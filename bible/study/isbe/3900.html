isbe[3963]='Guiltless`gilt\'-les: The primary meaning of the Hebrew word is "to be clean." Sometimes the meaning is "freedom from blame," at other times to be "free from punishment," these two ideas running over into each other as with the word "guilt." The latter meaning seems to predominate in <a onClick="return mV(\'Exd\',20,7);">Ex 20:7</a>; <a onClick="return mV(\'Deu\',5,11);">De 5:11</a>; <a onClick="return mV(\'2Sa\',14,9);">2Sa 14:9</a>; <a onClick="return mV(\'1Ki\',2,9);">1Ki 2:9</a>. The other meaning holds in <a onClick="return mV(\'Num\',32,22);">Nu 32:22</a>; <a onClick="return mV(\'Jos\',2,19);">Jos 2:19</a>; <a onClick="return mV(\'2Sa\',3,28);">2Sa 3:28</a>; <a onClick="return mV(\'Mat\',12,5,7);">Mt 12:5, 7</a>.``1';
isbe[3964]='Guilty`gil\'-ti: In addition to the general discussion under <a href="study/isbe/search.html?string=GUILT">GUILT</a> (which see), several New Testament passages demand special notice because the word "guilty" is not used in the principal sense of blameworthy, but with one of the two lesser meanings noted above which go to make up the complete idea. In 3 of these passages the King James Version renders "guilty" and the Revised Version (British and American) gives another rendering. In <a onClick="return mV(\'Mat\',26,66);">Mt 26:66</a> the King James Version, Jesus\' foes declare he is "guilty of death" (enochos, "liable to"). Here "guilty" simply means the one who is legally held, and the reference is not to the blame but to the consequence. This is a true use of the word in the lower and legal sense. It does not correspond with our higher usage, and so we have it in the Revised Version (British and American) "worthy of death." So in <a onClick="return mV(\'Rom\',3,19);">Ro 3:19</a>, "guilty" is changed to "under the judgment," and in <a onClick="return mV(\'Mat\',23,18);">Mt 23:18</a>, to "debtor."<P>In <a onClick="return mV(\'Jam\',2,10);">Jas 2:10</a> and <a onClick="return mV(\'1Cr\',11,27);">1Co 11:27</a>, the word "guilty" is also used in the lesser or more primitive sense, not primarily as involving blame but as involving the sinner\'s authorship or responsibility. This is the first element suggested in the definition of guilt given above, just as the preceding passages illustrate the third element. The man who stumbles in one point is "guilty" of the whole law. James does not refer here to the degree of blameworthiness. "Guilty of" means transgressor of, and he has transgressed the whole because the law is one. So in <a onClick="return mV(\'1Cr\',11,27);">1Co 11:27</a>, those "guilty of the body and the blood of the Lord" are those who have transgressed in the matter of the body and the blood of the Lord.``143';
isbe[3965]='Gulf`(chasma, "a chasm," "vent," "a gaping opening"—a great interval; from chaino, "to gape" or "yawn"): Occurs only in <a onClick="return mV(\'Luk\',16,26);">Lu 16:26</a>, "Between us and you there is a great gulf fixed" (compare "afar off" in <a onClick="return mV(\'Luk\',16,23);">16:23</A>). This is very different from, though it probably reflects, the rabbinical conception of the separation between the two compartments of Hades (Sheol) by "a hand\'s breadth," "a wall," or even, later, "a chasm," as the parable can be given here only a figurative significance, and is of purely ethical import. The fundamental difference between the Rich Man and Lazarus lies not in their conditions but in their characters. For "besides all this" (<a onClick="return mV(\'Luk\',16,26);">16:26</a>) the Revised Version, margin gives "in all these things," thus implying that the moral distinctions which exist in this life (<a onClick="return mV(\'Luk\',16,25);">16:25</A>) become more pronounced ("fixed") in the next world, and the "gulf" is impassable in the sense that a change of condition will not necessarily produce a change of soul.`<a href="./study/isbe/search.html?string=BOSOM,+ABRAHAM\'s">ABRAHAM\'S BOSOM</a>; <a href="./study/isbe/search.html?string=HADES">HADES</a>`91';
isbe[3966]='Guni; Gunites`gu\'-ni, gu\'-nits (guni):<P>(1) The name of a Naphtalite clan (<a onClick="return mV(\'Gen\',46,24);">Ge 46:24</a>; <a onClick="return mV(\'Num\',26,48);">Nu 26:48</a>; <a onClick="return mV(\'1Ch\',7,13);">1Ch 7:13</a>). In <a onClick="return mV(\'Num\',26,48);">Nu 26:48</a> the gentilic "Gunites" is also found, having in Hebrew the same form, with the article.<P>(2) The head of a Gadite family (<a onClick="return mV(\'1Ch\',5,15);">1Ch 5:15</a>).``1';
isbe[3967]='Gur-Baal`gur-ba\'-al (gur ba\'-al): The residence of certain Arabs against whom God helped Uzziah, king of Judah (<a onClick="return mV(\'2Ch\',26,7);">2Ch 26:7</a>). Its mention immediately after the Philistines may have suggested the "Gerar" of the Targum. Association with the Meunim points to the East. It may be taken as certain that Jebel Neby Harun, near Petra, has always been crowned by a sanctuary. This may have been "the dwelling place of Baal"; or, accepting Kittel\'s emendation (Tur ba\'al), "the rock" or "mountain of Baal." The Arabs probably dwelt in the region before the days of Petra (EB, under the word)``54';
isbe[3968]='Gur; the Ascent, of`gur, a-sent\', (ma\'-aleh ghur): The place where the servants of Jehu mortally wounded Ahaziah, king of Judah (<a onClick="return mV(\'2Ki\',9,27);">2Ki 9:27</a>). The ascent (the King James Version "going up") was hard by Ibleam, the site of which is identified about 1/2 mile south of Jenin.``1';
isbe[3969]='Gutter`gut\'-er.`<a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>`1';
isbe[3970]='Gymnasium`jim-na\'-zi-um.`<a href="./study/isbe/search.html?string=GAMES">GAMES</a>; <a href="./study/isbe/search.html?string=PALAESTRA,+PALESTRA">PALAESTRA.`1';
isbe[3971]='Ha`ha (he\'-ah): In <a onClick="return mV(\'Job\',39,25);">Job 39:25</a>, the Revised Version (British and American) "Aha," of the battle-horse.`<a href="./study/isbe/search.html?string=AH+AHA">AH, AHA</a>`1';
isbe[3972]='Haahashtari`ha-a-hash\'-ta-ri (ha\'-achashtari, possibly a corruption of ha\'-ashchuri): A descendant of Judah (<a onClick="return mV(\'1Ch\',4,6);">1Ch 4:6</a>). The name is probably corrupt. If the emendation suggested above is accepted, it means the Ashurites, and is a description of the preceding names.``1';
isbe[3973]='Habaiah; Hobaiah`ha-ba\'-ya, (cha-bhayah, chobhayah): A post-exilic priestly family which was unable to establish its pedigree. "Habaiah" is the form in <a onClick="return mV(\'Ezr\',2,61);">Ezr 2:61</a>; in the parallel passage (<a onClick="return mV(\'Neh\',7,63);">Ne 7:63</a>), the King James Version has "Habaiah," and the Revised Version (British and American) "Hobaiah"; in the parallel passage in 1Esdras 5:38, the form is Obdia, Codex Vaticanus, Obbeia.``1';
isbe[3974]='Habakkuk`ha-bak\'-uk, hab\'-a-kuk:<P><b>I. THE AUTHOR</b><P class="in15">1. Name<P class="in15">2. Life<P><b>II. THE BOOK</b><P class="in15">1. Interpretation of <span class="noTag">Habakkuk 1 and 2</span><P class="in15">2. Contents<P class="in15">3. Style<P class="in15">4. Integrity<P><b>III. THE TIME</b><P class="in15">1. Date<P class="in15">2. Occasion<P><b>IV. ITS TEACHING</b><P class="in15">1. Universal Supremacy of Yahweh<P class="in15">2. Faithfulness the Guarantee of Permanency<P><b>LITERATURE</b><hr /><P>I. The Author. 1. Name:<P>Habakkuk (chabhaqquq) means "embrace," or "ardent embrace." Some of the ancient rabbis, connecting the name with <a onClick="return mV(\'2Ki\',4,16);">2Ki 4:16</a>, "Thou shalt embrace a son," imagined that the prophet was the son of the Shunammite woman. The Septuagint form of the name, Hambakoum; Theodotion Hambakouk, presupposes the Hebrew chabbaquq. A similar word occurs in Assyrian as the name of a garden plant.<P>2. Life:<P>Practically nothing is known of Habakkuk. The book bearing his name throws little light upon his life, and the rest of the Old Testament is silent concerning him; but numerous legends have grown up around his name. The identification of the prophet with the son of the Shunammite woman is one. Another, connecting <a onClick="return mV(\'Isa\',21,6);">Isa 21:6</a> with <a onClick="return mV(\'Hab\',2,1);">Hab 2:1</a>, makes Habakkuk the watchman set by Isaiah to watch for the fall of Babylon. One of the recensions of the Septuagint text of Bel and the Dragon declares that the story was taken "from the prophecy of Habakkuk, the son of Jesus of the tribe of Levi." This must refer to an unknown apocryphal book ascribed to our prophet. What authority there may be for calling his father Jesus we do not know. The claim that he was of the tribe of Levi may be based upon the presence of the musical note at the end of the third chapter. According to the Lives of the Prophets, ascribed, though perhaps erroneously, to Epiphanius, bishop of Salamis in Cyprus during the latter part of the 4th century AD, he belonged to Bethtsohar, of the tribe of Simeon. A very interesting story is found in Bel and the Dragon (33-39), according to which Habakkuk, while on his way to the field with a bowl of pottage, was taken by an angel, carried to Babylon and placed in the lions den, where Daniel ate the pottage, when Habakkuk was returned to his own place. According to the Lives, Habakkuk died two years before the return of the exiles from Babylon. All these legends have little or no historical value.<P>II. The Book.<P>1. Interpretation of <span class="noTag">Habakkuk 1 and 2</span>:<P>It is necessary to consider the interpretation of <a onClick="return mV(\'Hab\',1,\'1-\');">Hab 1</a> and <a onClick="return mV(\'Hab\',2,\'1-\');">2</A> before giving the contents of the book, as a statement of the contents of these chapters will be determined by their interpretation. The different interpretations advocated may be grouped under three heads:<P>(1) According to the first view: <a onClick="return mV(\'Hab\',1,\'2-4\');">Hab 1:2-4</a>: The corruption of Judah; the oppression of the righteous Jews by the wicked Jews, which calls for the Divine manifestation in judgment against the oppressors. <a onClick="return mV(\'Hab\',1,\'5-11\');">1:5-11</A>: Yahweh announces that He is about to send the Chaldeans to execute judgment. <a onClick="return mV(\'Hab\',1,\'12-17\');">1:12-17</A>: The prophet is perplexed. He cannot understand how a righteous God can use these barbarians to execute judgment upon a people more righteous than they. He considers even the wicked among the Jews better than the Chaldeans. <a onClick="return mV(\'Hab\',2,\'1-4\');">2:1-4</A>: Yahweh solves the perplexing problem by announcing that the exaltation of the Chaldeans will be but temporary; in the end they will meet their doom, while the righteous will live. <a onClick="return mV(\'Hab\',2,\'5-20\');">2:5-20</A>: Woes against the Chaldeans.<P>(2) The second view finds it necessary to change the present arrangement of <a onClick="return mV(\'Hab\',1,\'5-11\');">Hab 1:5-11</a>; in their present position, they will not fit into the interpretation. For this reason Wellhausen and others omit these verses as a later addition; on the other hand, Giesebrecht would place them before <a onClick="return mV(\'Hab\',1,2);">1:2</A>, as the opening verses of the prophecy. The transposition would require a few other minor changes, so as to make the verses a suitable beginning and establish a smooth transition from <a onClick="return mV(\'Hab\',1,11);">1:11</A> to <a onClick="return mV(\'Hab\',1,2);">1:2</a>. Omitting the troublesome verses, the following outline of the two chapters may be given: <a onClick="return mV(\'Hab\',1,\'2-4\');">1:2-4</A>: The oppression of the righteous Jews by the wicked Chaldeans. <a onClick="return mV(\'Hab\',1,\'12-17\');">1:12-17</A>: Appeal to Yahweh on behalf of the Jews against their oppressors. <a onClick="return mV(\'Hab\',2,\'1-4\');">2:1-4</A>: Yahweh promises deliverance (see above). <a onClick="return mV(\'Hab\',2,\'5-20\');">2:5-20</A>: Woes against the Chaldeans.<P>(3) The third view also finds it necessary to alter the present order of verses. Again <a onClick="return mV(\'Hab\',1,\'5-11\');">Hab 1:5-11</a>, in the present position, interferes with theory; therefore, these verses are given a more suitable place after <a onClick="return mV(\'Hab\',2,4);">2:4</A>. According to this interpretation the outline is as follows: <a onClick="return mV(\'Hab\',1,\'2-4\');">1:2-4</A>: Oppression of the righteous Jews by the wicked Assyrians (Budde) or Egyptians (G. A. Smith). <a onClick="return mV(\'Hab\',1,\'12-17\');">1:12-17</A>: Appeal to Yahweh on behalf of the oppressed against the oppressor. <a onClick="return mV(\'Hab\',2,\'1-4\');">2:1-4</A>: Yahweh promises deliverance (see above). <a onClick="return mV(\'Hab\',1,\'5-11\');">1:5-11</A>: The Chaldeans will be the instrument to execute judgment upon the oppressors and to bring deliverance to the Jews. <a onClick="return mV(\'Hab\',2,\'5-20\');">2:5-20</A>: Woes against the Assyrians or Egyptians.<P>A full discussion of these views is not possible in this article (see Eiselen, Minor Prophets, 466-68). It may be sufficient to say that on the whole the first interpretation, which requires no omission or transposition, seems to satisfy most completely the facts in the case.<P>2. Contents:<P>The contents of <a onClick="return mV(\'Hab\',1,\'1-\');">Hab 1</a> and <a onClick="return mV(\'Hab\',2,\'1-\');">2</A> are indicated in the preceding paragraph. <a onClick="return mV(\'Hab\',3,\'1-\');">Hab 3</a> contains a lyrical passage called in the title "Prayer." The petitioner speaks for himself and the community. He remembers the mighty works of Yahweh for His people; the thought of them causes him to tremble; nevertheless, he calls for a repetition of the ancient manifestations (<a onClick="return mV(\'Hab\',3,2);">3:2</A>). In majestic pictures the poet describes the wonderful appearances of Yahweh in the past (<a onClick="return mV(\'Hab\',3,\'3-11\');">3:3-11</A>) for His chosen people (<a onClick="return mV(\'Hab\',3,\'12-15\');">3:12-15</A>). The remembrance of these manifestations fills the Psalmist with fear and trembling, but also with joy and confidence in the God of his salvation (<a onClick="return mV(\'Hab\',3,\'16-19\');">3:16-19</A>).<P>3. Style:<P>Only the Hebrew student can get an adequate idea of the literary excellence of the Book of Habakkuk. "The literary power of Habakkuk," says Driver, "is considerable. Though his book is a brief one, it is full of force; his descriptions are graphic and powerful; thought and expression are alike poetic; he is still a master of the old classical style, terse, parallelistic, pregnant; there is no trace of the often prosaic diffusiveness which manifests itself in the writings of Jeremiah and Ezekiel. And if <a onClick="return mV(\'Hab\',3,\'1-\');">Hab 3</a> be his, he is, moreover, a lyric poet of high order; the grand imagery and the rhythmic flow of this ode will bear comparison with some of the finest productions of the Hebrew muse."<P>4. Integrity:<P>More than half of the book, including <a onClick="return mV(\'Hab\',1,\'5-11\');">Hab 1:5-11</a>; <a onClick="return mV(\'Hab\',2,\'9-20\');">2:9-20</a>, and chapter <a onClick="return mV(\'Hab\',3,\'1-\');">3</a> entire, has been denied to the prophet Habakkuk. If the prophecy is rightly interpreted (see above), no valid reason for rejecting <a onClick="return mV(\'Hab\',1,\'5-11\');">1:5-11</A> can be found. <a onClick="return mV(\'Hab\',2,\'9-20\');">Hab 2:9-20</a> are denied to Habakkuk chiefly on two grounds:<P>(1) The "woes" are said to be in part, at least, unsuitable, if supposed to be addressed to the Chaldean king. This difficulty vanishes when it is borne in mind that the king is not addressed as an individual, but as representing the policy of the nation, as a personification of the nation.<P>(2) Some parts, especially <a onClick="return mV(\'Hab\',2,\'12-14\');">2:12-14</a>, "consist largely of citations and reminiscences of other passages, including some late ones" (compare <a onClick="return mV(\'Hab\',2,12);">2:12</A> with <a onClick="return mV(\'Mic\',3,10);">Mic 3:10</a>; <a onClick="return mV(\'Hab\',2,13);">Hab 2:13</a> with <a onClick="return mV(\'Jer\',51,58);">Jer 51:58</a>; <a onClick="return mV(\'Hab\',2,14);">Hab 2:14</a> with <a onClick="return mV(\'Isa\',11,9);">Isa 11:9</a>; <a onClick="return mV(\'Hab\',2,16);">Hab 2:16b</a> with <a onClick="return mV(\'Jer\',25,15,16);">Jer 25:15-16</a>; <a onClick="return mV(\'Hab\',2,\'18-20\');">Hab 2:18-20</a> with <a onClick="return mV(\'Isa\',44,9);">Isa 44:9</a>ff; <a onClick="return mV(\'Isa\',46,6,7);">46:6,7</A>; <a onClick="return mV(\'Jer\',10,\'1-16\');">Jer 10:1-16</a>).<P>Aside from the fact that the argument from literary parallels is always precarious, in this case the resemblances are few in number and of such general character that they do not necessarily presuppose literary dependence. <a onClick="return mV(\'Hab\',3,\'1-\');">Habakkuk 3</a> is denied to the prophet even more persistently, but the arguments are by no means conclusive. The fact that the chapter belongs to the psalm literature does not prove a late date unless it is assumed, without good reasons, that no psalms originated in the preexilic period. Nor do the historical allusions, which are altogether vague, the style, the relation to other writers, and the character of the religious ideas expressed, point necessarily to a late date. The only doubtful verses are <a onClick="return mV(\'Hab\',2,16);">2:16</a>ff, which seem to allude to a calamity other than the invasion of the Chaldeans; and Driver says, not without reason, "Had the poet been writing under the pressure of a hostile invasion, the invasion itself would naturally have been expected to form a prominent feature in this picture." Hence, while it may be impossible to prove that Habakkuk is the author of the prayer, it is equally impossible to prove the contrary; and while there are a few indications which seem to point to a situation different from that of Habakkuk, they are by no means definite enough to exclude the possibility of Habakkuk\'s authorship.<P>III. The Time.<P>1. Date:<P>The question of date is closely bound up with that of interpretation. Budde, on theory that the oppressors, threatened with destruction, are the Assyrians (see above, 3), dates the prophecy 621 to 615 BC. Granting that the Assyrians are in the mind of the prophet, the date suggested by Betteridge (AJT,1903, 674ff), circa 701 BC, is to be preferred; but if the Assyrians are not the oppressors, then with the Assyrians fall the dates proposed by Budde and Betteridge. If the prophecy is directed against Egypt, we are shut up to a very definite period, between 608 and 604 BC, for the Egyptian supremacy in Judah continued during these years only. If the Egyptians are not the oppressors, another date will have to be sought. If the Chaldeans are the oppressors of Judah, the prophecy must be assigned to a date subsequent to the battle of Carchemish in 605-604, for only after the defeat of the Egyptians could the Chaldeans carry out a policy of world conquest; and it was some years after that event that the Chaldeans first came into direct contact with Judah. But on this theory, <a onClick="return mV(\'Hab\',1,\'2-4\',12);">Hab 1:2-4, 12</a>ff; <a onClick="return mV(\'Hab\',2,8);">2:8</A>ff, presupposes the lapse of a considerable period of conquest, the subduing of many nations, the cruel oppression of Judah for some length of time; therefore, Nowack is undoubtedly correct, on this theory, in bringing the prophecy down to a period subsequent to the first exile in 597, or, as he says, "in round numbers about 590 BC."<P>A different date must be sought if <a onClick="return mV(\'Hab\',1,\'2-4\');">Hab 1:2-4</a> is interpreted as referring to the oppression of Jews by Jews, and <a onClick="return mV(\'Hab\',1,5);">1:5</a>ff, as a threat that Yahweh will raise up the Chaldeans, already known as a nation thirsting for blood, to punish the wickedness of Judah. These verses would seem to indicate (1) that the Chaldeans had not yet come into direct contact with Judah, and (2) that they had already given exhibitions of the cruel character of their warfare. Nebuchadnezzar advanced against Judah about 600 BC; but the years since the fall of Nineveh, in 607-606, and the battle of Carchemish, in 605-604, had given abundant opportunity to the Chaldeans to reveal their true character, and to the prophet and his contemporaries to become acquainted with this cruel successor of Nineveh. On this theory, therefore, the prophetic activity of Habakkuk must be assigned to shortly before 600 BC.<P>2. Occasion:<P>If Habakkuk prophesied about 600 BC, he lived under King Jehoiakim. The pious and well-meaning Josiah had been slain in an attempt to stop the advance of Egypt against Assyria. With his death the brief era of reform came to an end. After a reign of three months Jehoahaz was deposed by Pharaoh-necoh, who placed Jehoiakim on the throne. The latter was selfish, tyrannical and godless. In a short time the deplorable conditions of Manasseh\'s reign returned. It was this situation that caused the prophet\'s first perplexity: "O Yahweh, how long shall I cry, and thou wilt not hear? I cry out unto thee of violence, and thou wilt not save" (<a onClick="return mV(\'Hab\',1,2);">Hab 1:2</a>).<P>IV. Its Teaching.<P>In the Book of Habakkuk a new type of prophecy appears. The prophets were primarily preachers and teachers of religion and ethics. They addressed themselves to their fellow-countrymen in an attempt to win them back to Yahweh and a righteous life. Not so Habakkuk. He addresses himself to Yahweh, questioning the justice or even the reality of the Divine Providence. He makes complaint to God and expostulates with Him. The prophet Habakkuk, therefore, is a forerunner of the author of the Book of Job. "As a whole, his book is the fruit of religious reflection. It exhibits the communings and questionings of his soul—representative, no doubt, of many other pious spirits of the time—with God; and records the answers which the Spirit of God taught him for his own sake and for the sake of tried souls in every age.<P>Habakkuk has been called the prophet of faith. He possessed a strong, living faith in Yahweh; but he, like many other pious souls, was troubled and perplexed by the apparent inequalities of life. He found it difficult to reconcile these with his lofty conception of Yahweh. Nevertheless, he does not sulk. Boldly he presents his perplexities to Yahweh, who points the way to a solution, and the prophet comes forth from his trouble with a faith stronger and more intense than ever. It is in connection with his attempts to solve the perplexing problems raised by the unpunished sins of his countrymen and the unlimited success of the Chaldeans that Habakkuk gives utterance to two sublime truths:<P>1. The Universal Supremacy of Yahweh:<P>Yahweh is interested not only in Israel. Though Habakkuk, like the other prophets, believes in a special Divine Providence over Israel, he is equally convinced that Yahweh\'s rule embraces the whole earth; the destinies of all the nations are in His hand. The Chaldeans are punished not merely for their sins against Judah, but for the oppression of other nations as well. Being the only God, He cannot permit the worship of other deities. Temporarily the Chaldeans may worship idols, or make might their god, they may "sacrifice unto their net," and burn incense "unto their drag," because by them "their portion is fat and their food plenteous"; but Yahweh is from everlasting, the Holy One, and He will attest His supremacy by utterly destroying the boastful conqueror with his idols.<P>2. Faithfulness the Guarantee of Permanency:<P>The second important truth is expressed in <a onClick="return mV(\'Hab\',2,4);">Hab 2:4</a>: "The righteous shall live by his faith" (the American Revised Version, margin "faithfulness"). Faithfulness assures permanency. The thought expressed by the prophet is not identical with that expressed by the apostle who quotes the words (<a onClick="return mV(\'Gal\',3,11);">Ga 3:11</a>); nevertheless, the former also gives expression to a truth of profound significance. "Faithfulness" is with the prophet an external thing; it signifies integrity, fidelity, steadfastness under all provocations; but this implies, in a real sense, the New Testament conception of faith as an active principle of right conduct. A living faith determines conduct; religion and ethics go hand in hand, and especially in the hour of adversity a belief in Yahweh and unflinching reliance upon Him are the strongest preservers of fidelity and integrity. Faith without works is dead; faith expresses itself in life. Habakkuk places chief emphasis upon the expressions of faith, and he does so rightly; but in doing this he also calls attention, by implication at least, to the motive power behind the external manifestations. As an expression of living faith, <a onClick="return mV(\'Hab\',3,\'17-19\');">3:17-19</A> is not surpassed in the Old Testament.<P>LITERATURE.<P>Commentaries on the Minor Prophets by Ewald, Pusey, Keil, Orelli, G. A. Smith (Expositor\'s Bible), Driver (New Century Bible), Eiselen; A. B. Davidson, Commentary on "Nah," "Hab," "Zeph" (Cambridge Bible); A. F. Kirkpatrick, Doctrine of the Prophets; F. C. Eiselen, Prophecy and the Prophets; F. W. Farrar, Minor Prophets ("Men of the Bible"); Driver, LOT; HDB, article "Habakkuk"; EB, article "Habakkuk."``50';

isbe[3976]='Habaziniah`(chabhatstsinyah. Thus in the King James Version, but more correctly as in the Revised Version (British and American) Habazziniah, hab-a-zi-ni\'-a (<a onClick="return mV(\'Jer\',35,3);">Jer 35:3</a>)): The grandfather of Jaazaniah, who was the leader of the Rechabites who were tested by Jeremiah as to their obedience to their ancestor\'s command with reference to wine. Their loyalty to the commands of Jonadab was effectively used by Jeremiah in an appeal to the people of Judah to obey the words of Yahweh.``1';
isbe[3977]='Habergeon`hab’-er-jun, ha-bur’-jun, the King James Version (tachara’): In the Revised Version (British and American), <a onClick="return mV(\'Exd\',28,32);">Ex 28:32</a>; <a onClick="return mV(\'Exd\',39,23);">39:23</a>, etc., "coat of mail"; in <a onClick="return mV(\'Job\',41,26);">Job 41:26</a>, "pointed shaft," margin "coat of mail."`<a href="./study/isbe/search.html?string=ARMOR;+ARMS">ARMOR, ARMS</a>`1';
isbe[3978]='Habitation`hab-i-ta\'-shun: Properly a place of sojourn or dwelling. The term in the King James Version representing some 16 Hebrew words (moshabh, ma\'-on, mishkan, naweh, etc.), and 5 Greek words, is variously changed in certain passages in the Revised Version (British and American), as <a onClick="return mV(\'Gen\',49,5);">Ge 49:5</a>, "swords"; <a onClick="return mV(\'Lev\',13,46);">Le 13:46</a> "dwelling"; <a onClick="return mV(\'Job\',5,24);">Job 5:24</a>; <a onClick="return mV(\'Jer\',25,30,37);">Jer 25:30b,37</a>,"fold"; <a onClick="return mV(\'Psa\',89,14);">Ps 89:14</a>; <a onClick="return mV(\'Psa\',97,2);">97:2</a>, etc., "foundation"; <a onClick="return mV(\'Psa\',132,5);">Ps 132:5</a>, "tabernacle"; <a onClick="return mV(\'Luk\',16,9);">Lu 16:9</a>, "tabernacles," etc. Conversely, "habitation" appears in the Revised Version (British and American) for the King James Version "dwelling place" in <a onClick="return mV(\'2Ch\',30,27);">2Ch 30:27</a>; <a onClick="return mV(\'Psa\',79,7);">Ps 79:7</a>, "house"; <a onClick="return mV(\'Psa\',83,12);">Ps 83:12</a>; <a onClick="return mV(\'2Cr\',5,2);">2Co 5:2</a>, "tabernacle," <a onClick="return mV(\'Act\',7,46);">Ac 7:46</a>, etc.`<a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>`132';
isbe[3979]='Habor`ha\'-bor (chabhor; Habor, Habior; Isidor of Charax, Aburas (Abouras), Zosias, Aboras):<P>1. Its Position and Course:<P>Is described in <a onClick="return mV(\'2Ki\',17,6);">2Ki 17:6</a>; <a onClick="return mV(\'2Ki\',18,11);">18:11</a> (compare <a onClick="return mV(\'1Ch\',5,26);">1Ch 5:26</a>) as "the river of Gozan." It is the Arabic Khabur, and flows in a southerly direction from several sources in the mountains of Karaj Dagh (Mons Masius), which, in the 37th parallel, flanks the valley of the Tigris on the west. The river ultimately joins the Euphrates after receiving its chief tributary, the Jaghjagha Su (Mygdonius), at Circesium (Kirkisiyeh).<P>2. Etymologies of Habor:<P>The meaning of its name is doubtful, but Delitzsch has suggested a Sumerian etymology, namely, habur, "the fish-waterway," or it may be connected with "mother Hubur\'" a descriptive title of Tiamat (see <a href="study/isbe/search.html?string=MERODACH">MERODACH</a>; <a href="study/isbe/search.html?string=RAHAB">RAHAB</a>).<P>3. Historical References:<P>Layard found several interesting Assyrian remains in the district, including man-headed bulls bearing the name of Muses-Ninip, possibly an Assyrian governor. Tiglath-pileser I (circa 1120 BC) boasts of having killed 10 mighty elephants in Haran and on the banks of the Habor; and Assur-nacir-apli (circa 880 BC), after conquering Harsit (Harrit, Harmis), subjugated the tract around piate sa nar Habur, "the mouths of the Habor." According to 2Ki and 1 Chronicles, Shalmaneser IV and Sargon transported the exiled Israelites thither. Philological considerations exclude the identification of the Chebar of <a onClick="return mV(\'Eze\',13,\'1-\');">Eze 13</a>, etc., with the Habor.``136';
isbe[3980]='Hacaliah`hak-a-li\'-a (chakhalyah, meaning doubtful, perhaps "wait for Yahweh"; the King James Version Hachaliah): Father of Nehemiah (<a onClick="return mV(\'Neh\',11,\'1-\');">Ne 11</a>; <a onClick="return mV(\'Neh\',10,1);">10:1</a>).``1';
isbe[3981]='Hachilah, Hill of`ha-ki\'-la, hak\'-i-la, (chakhilah): A hill in the wilderness of Judah, associated with the wanderings of David. It is stated (<a onClick="return mV(\'1Sa\',23,19);">1Sa 23:19</a>) to be "on the south of the desert" (or Jeshimon), and (<a onClick="return mV(\'1Sa\',26,1);">1Sa 26:1</a>) to be "before (on the front (i.e. edge) of) the desert." It was near Ziph and Maon. The only plausible hypothesis is that it is represented by the ridge Dhahret el-Kolah in the wilderness of Ziph, toward the desert of En-gedi (PEF, III, 313, Sh XXI).``1';
isbe[3982]='Hachmoni; Hachmonite`hak-mo\'-ni, hak\'-mo-ni, or probably (chakhmoni, "wise"): The same word is rendered "Hachmoni," a proper name, in <a onClick="return mV(\'1Ch\',27,32);">1Ch 27:32</a> and "a Hachmonite" in <a onClick="return mV(\'1Ch\',11,11);">1Ch 11:11</a>. The form of the Hebrew word suggests that the latter translation should be adopted in both passages, and that it describes the warrior in one case, and the companion or tutor of David\'s sons in the other, as a member of a certain family—a Hachmonite of which nothing further is known. <a onClick="return mV(\'2Sa\',23,8);">2Sa 23:8</a>, "Josheb-basshebeth a Tahchemonite," bears the marks of a corrupt text, and should be parallel with <a onClick="return mV(\'1Ch\',11,11);">1Ch 11:11</a> so far as the name goes, reading "Jashobeam the Hachmonite." So Klostermann, Driver, Wellhausen, Budde, etc.``76';
isbe[3983]='Hadad`ha\'-dad:<P>(1) (chadhadh, "sharpness"): One of the twelve sons of Ishmael (<a onClick="return mV(\'Gen\',25,15);">Ge 25:15</a>, where the King James Version, following a mistake in Hebrew text, has "Hadar"; but "Hadad" is found in parallel passage <a onClick="return mV(\'1Ch\',1,30);">1Ch 1:30</a>; the Revised Version (British and American) reads "Hadad" in both places).<P>(2) (hadhadh): A king of Edom, son of Bedad (<a onClick="return mV(\'Gen\',36,35,36);">Ge 36:35-36</a> parallel <a onClick="return mV(\'1Ch\',1,46,47);">1Ch 1:46-47</a>), "who smote Midian in the field of Moab," and whose "city was Avith."<P>(3) Another king of Edom, written "Hadar" in <a onClick="return mV(\'Gen\',36,39);">Ge 36:39</a> by a copyist\'s mistake, but "Hadad" in the parallel passage <a onClick="return mV(\'1Ch\',1,50,51);">1Ch 1:50-51</a>. His city was Pau or Palestine.<P>(4) A member of the royal family of Edom in David\'s time, who as a child escaped Joab\'s slaughter of the Edomites, and fled to Egypt. On David\'s death he returned to Edom, where he made trouble for Solomon by stirring up the Edomites against the rule of Israel (<a onClick="return mV(\'1Ki\',11,\'14-22\',25);">1Ki 11:14-22, 25</a>).<P>(5) The supreme god of Syria, whose name is found in Scripture in the names of Syrian kings, Benhadad, Hadadezer. The god Hadad (= perhaps, "maker of loud noise") is mentioned in Assyrian inscriptions, and called on the monolith of Shalmaneser "the god of Aleppo." In the Assyrian inscriptions he is identified with the air-god Rammon or Rimmon. The union of the two names in <a onClick="return mV(\'Zec\',12,11);">Zec 12:11</a> suggests this identity, though the reference is uncertain, some regarding Hadadrimmon as the name of a place, others as the name of the god—"Hadad (is) Rimmon." The name "Hadad" is found in various other forms: Adad, Dadu, and Dadda. See A. H. Sayce in HDB under the word "Hadad."``76';
isbe[3984]='Hadadezer`had-ad-e\'-zer (hadhadh\'ezer; so <a onClick="return mV(\'2Sa\',8,\'1-\');">2Sa 8</a>; <a onClick="return mV(\'1Ki\',11,23);">1Ki 11:23</a>, but hadhar\'ezer, <a onClick="return mV(\'2Sa\',10,\'1-\');">2Sa 10</a>; <a onClick="return mV(\'1Ch\',18,\'1-\');">1Ch 18</a>): Mentioned in connection with David\'s wars of conquest (<a onClick="return mV(\'2Sa\',8,3);">2Sa 8:3</a>ff; <a onClick="return mV(\'2Sa\',10,\'1-19\');">2Sa 10:1-19</a>; <a onClick="return mV(\'1Ch\',18,3);">1Ch 18:3</a>); was king of Zobah in Syria. The exact position and size of this Syrian principality are uncertain, but it seems to have extended in David\'s time southward toward Ammon and eastward to the Euphrates. When the Ammonites had put themselves in the wrong with David by the insult done to his ambassadors (<a onClick="return mV(\'2Sa\',10,\'1-5\');">2Sa 10:1-5</a>) they summoned to their aid against the incensed king of Israel the Syrians of various adjoining principalities, among them the Syrians of Zobah under Hadadezer, the son of Rehob. The strategy of Joab, who set the force under command of Abishai his brother in array against the Ammonites, and himself attacked the Syrian allies, won for Israel a decisive victory. Not content with this result, Hadadezer gathered together another Syrian force, summoning this time also "the Syrians that were beyond the River" (<a onClick="return mV(\'2Sa\',10,16);">2Sa 10:16</a>), with Shobach the captain of his host at their head. On this occasion David himself took command of the Israelite forces and again defeated them near Helam, Shobach being left dead on the field. Hadadezer and his Syrian vassals, finding resistance hopeless, "made peace with Israel and served them" (<a onClick="return mV(\'2Sa\',10,19);">2Sa 10:19</a>). For the name Hadador Hadarezer, see <a href="study/isbe/search.html?string=BENHADAD">BENHADAD</a>.<P>LITERATURE.<P>Winckler, Geschichte Israels, I, 137ff; McCurdy, HPM, 204; Maspero, The Struggle of the Nations, 731.``128';
isbe[3985]='Hadadrimmon`ha-dad-rim\'-on, had-ad-rim\'-on (hadhadh rimmon): A name which occurs, along with Megiddon, in <a onClick="return mV(\'Zec\',12,11);">Zec 12:11</a>. It was long thought that this was a place in the plain of Megiddo, and that the mourning referred to was that for Josiah, slain in battle with Pharaoh-necoh (<a onClick="return mV(\'2Ki\',23,29);">2Ki 23:29</a>). This last, however, was certainly at Jerusalem. Jerome (Comm. on Zec) identifies Hadadrimmon with Maximianopolis, a village near Jezreel, probably Legio, the ancient Megiddo. Possibly, however, the form "Hadadrimmon" has arisen through the combination of two divine names; and the weeping may be that for Tammuz (<a onClick="return mV(\'Eze\',8,14);">Eze 8:14</a>), with whom the old Semitic deity had become confused in the popular mind.``54';
isbe[3986]='Hadar`ha\'-dar (<a onClick="return mV(\'Gen\',36,39);">Ge 36:39</a>).`<a href="./study/isbe/search.html?string=HADAD">HADAD</a>`1';
isbe[3987]='Hadarezer`had-ar-e\'-zer.`<a href="./study/isbe/search.html?string=HADADEZER">HADADEZER</a>`1';
isbe[3988]='Hadashah`ha-da\'-sha, had\'-a-sha (chadhashah, "new"): A town in the Shephelah of Judah, named with Zenan and Migdal-gad (<a onClick="return mV(\'Jos\',15,37);">Jos 15:37</a>). According to the Mishna (\'Erubhin, v. 6), it was the smallest town in Judah. It is not identified.``1';
isbe[3989]='Hadassah`ha-das\'-a (hadhaqqah, "myrtle"): The Hebrew name (<a onClick="return mV(\'Est\',2,7);">Es 2:7</a>) formerly borne by <a href="study/isbe/search.html?string=ESTHER">ESTHER</a> (which see).``1';
isbe[3990]='Hadattah`ha-dat\'-a (chadhattah, "new"):`<a href="./study/isbe/search.html?string=HAZOR">HAZOR</a>`1';
isbe[3991]='Hades`ha\'-dez (Haides, haides, "not to be seen"): Hades, Greek originally Haidou, in genitive, "the house of Hades," then, as nominative, designation of the abode of the dead itself. The word occurs in the New Testament in <a onClick="return mV(\'Mat\',11,23);">Mt 11:23</a> (parallel <a onClick="return mV(\'Luk\',10,15);">Lu 10:15</a>); <a onClick="return mV(\'Mat\',16,18);">Mt 16:18</a>; <a onClick="return mV(\'Luk\',16,23);">Lu 16:23</a>; <a onClick="return mV(\'Act\',2,27,31);">Ac 2:27, 31</a>; <a onClick="return mV(\'Rev\',1,18);">Re 1:18</a>; <a onClick="return mV(\'Rev\',6,8);">6:8</a>; <a onClick="return mV(\'Rev\',20,13);">20:13</a>f. It is also found in Textus Receptus of the New Testament <a onClick="return mV(\'1Cr\',15,55);">1Co 15:55</a>, but here the correct reading (Tischendorf, Westcott and Hort, The New Testament in Greek, the Revised Version (British and American)) is probably Thanate, "O Death," instead of Haide, "O Hades." the King James Version renders "Hades" by "hell" in all instances except <a onClick="return mV(\'1Cr\',15,55);">1Co 15:55</a>, where it puts "grave" (margin "hell") in dependence on <a onClick="return mV(\'Hsa\',13,14);">Ho 13:14</a>. the Revised Version (British and American) everywhere has "Hades."<P>1. In Old Testament: Sheol:<P>In the Septuagint Hades is the standing equivalent for Sheol, but also translates other terms associated with death and the state after it. The Greek conception of Hades was that of a locality receiving into itself all the dead, but divided into two regions, one a place of torment, the other of blessedness. This conception should not be rashly transferred to the New Testament, for the latter stands not under the influence of Greek pagan belief, but gives a teaching and reflects a belief which model their idea of Hades upon the Old Testament through the Septuagint. The Old Testament Sheol, while formally resembling the Greek Hades in that it is the common receptacle of all the dead, differs from it, on the one hand, by the absence of a clearly defined division into two parts, and, on the other hand, by the emphasis placed on its association with death and the grave as abnormal facts following in the wake of sin. The Old Testament thus concentrates the partial light it throws on the state after death on the negative, undesirable side of the prospect apart from redemption. When in the progress of Old Testament revelation the state after death begins to assume more definite features, and becomes more sharply differentiated in dependence on the religious and moral issue of the present life this is not accomplished in the canonical writings (otherwise in the apocalyptic literature) by dividing Sheol into two compartments, but by holding forth to the righteous the promise of deliverance from Sheol, so that the latter becomes more definitely outlined as a place of evil and punishment.<P>2. In the New Testament: Hades:<P>The New Testament passages mark a distinct stage in this process, and there is, accordingly, a true basis in Scripture for the identification in a certain aspect of Sheol—Hades—with hell as reflected in the King James Version. The theory according to which Hades is still in the New Testament the undifferentiated provisional abode of all the dead until the day of judgment, with the possibility of ultimate salvation even for those of its inmates who have not been saved in this life, is neither in harmony with the above development nor borne out by the facts of New Testament usage. That dead believers abide in a local Hades cannot be proven from <a onClick="return mV(\'1Th\',4,16);">1Th 4:16</a>; <a onClick="return mV(\'1Cr\',15,23);">1Co 15:23</a>, for these passages refer to the grave and the body, not to a gathering-place of the dead. On the other hand <a onClick="return mV(\'Luk\',23,43);">Lu 23:43</a>; <a onClick="return mV(\'2Cr\',5,\'6-8\');">2Co 5:6-8</a>; <a onClick="return mV(\'Phl\',1,23);">Php 1:23</a>; <a onClick="return mV(\'Rev\',6,9);">Re 6:9</a>; <a onClick="return mV(\'Rev\',7,9);">7:9</a>ff; <a onClick="return mV(\'Rev\',15,2);">15:2</A>ff teach that the abode of believers immediately after death is with Christ and God.<P>3. <a onClick="return mV(\'Act\',2,27,31);">Ac 2:27, 31</a>:<P>It is, of course, a different matter, when Hades, as not infrequently already the Old Testament Sheol, designates not the place of the dead but the state of death or disembodied existence. In this sense even the soul of Jesus was in Hades according\' to Peter\'s statement (<a onClick="return mV(\'Act\',2,27,31);">Ac 2:27, 31</a>—on the basis of <a onClick="return mV(\'Psa\',16,10);">Ps 16:10</a>). Here the abstract sense is determined by the parallel expression, "to see corruption" None the less from a comparatively early date this passage has been quoted in support of the doctrine of a local descent of Christ into Hades.<P>4. <a onClick="return mV(\'Rev\',20,13);">Re 20:13</a>; <a onClick="return mV(\'Rev\',6,8);">6:8</a>; <a onClick="return mV(\'Rev\',1,18);">1:18</a>:<P>The same abstract meaning is indicated for <a onClick="return mV(\'Rev\',20,13);">Re 20:13</a>. Death and Hades are here represented as delivering up the dead on the eve of the final judgment. If this is more than a poetic duplication of terms, Hades will stand for the personified state of death, Death for the personified cause of this state. The personification appears plainly from <a onClick="return mV(\'Rev\',20,14);">20:14</A>: "Death and Hades were cast into the lake of fire." In the number of these "dead" delivered up by Hades, believers are included, because, even on the chiliastic interpretation of <a onClick="return mV(\'Rev\',20,\'4-6\');">20:4-6</a>, not all the saints share in the first resurrection, but only those "beheaded for the testimony of Jesus, and for the word of God," i.e. the martyrs. A similar personifying combination of Death and Hades occurs in <a onClick="return mV(\'Rev\',6,8);">Re 6:8</a> ("a pale horse: and he that sat upon him his name was Death; and Hades followed with him"). In <a onClick="return mV(\'Rev\',1,18);">Re 1:18</a>, on the other hand, Death and Hades are represented as prisons from which Christ, in virtue of His own resurrection, has the power to deliver, a representation which again implies that in some, not necessarily local, sense believers also are kept in Hades.<P>5. <a onClick="return mV(\'Luk\',16,23);">Lu 16:23</a>:<P>In distinction from these passages when the abstract meaning prevails and the local conception is in abeyance, the remaining references are more or less locally conceived. Of these <a onClick="return mV(\'Luk\',16,23);">Lu 16:23</a> is the only one which might seem to teach that recipients of salvation enter after death into Hades as a place of abode. It has been held that Hades is here the comprehensive designation of the locality where the dead reside, and is divided into two regions, "the bosom of Abraham" and the place of torment, a representation for which Jewish parallels can be quoted, aside from its resemblance to the Greek bisection of Hades. Against this view, however, it may be urged, that if "the bosom of Abraham" were conceived as one of the two divisions of Hades, the other division would have been named with equal concreteness in connection with Dives. In point of fact, the distinction is not between "the bosom of Abraham" and another place, as both included in Hades, but between "the bosom of Abraham" and Hades as antithetical and exclusive. The very form of the description of the experience of Dives: "In Hades he lifted up his eyes, being in torments," leads us to associate Hades as such with pain and punishment. The passage, therefore, does not prove that the saved are after death in Hades. In further estimating its bearing upon the problem of the local conditions of the disembodied life after death, the parabolic character of the representation must be taken into account. The parable is certainly not intended to give us topographical information about the realm of the dead, although it presupposes that there is a distinct place of abode for the righteous and wicked respectively.<P>6. <a onClick="return mV(\'Mat\',11,23);">Mt 11:23</a>:<P>The two other passages where Hades occurs in the teaching of our Lord (<a onClick="return mV(\'Mat\',11,23);">Mt 11:23</a> parallel <a onClick="return mV(\'Luk\',10,15);">Lu 10:15</a>; and <a onClick="return mV(\'Mat\',16,18);">Mt 16:18</a>) make a metaphorical use of the conception, which, however, is based on the local sense. In the former utterance it is predicted of Capernaum that it shall in punishment for its unbelief "go down unto Hades." As in the Old Testament Sheol is a figure for the greatest depths known (<a onClick="return mV(\'Deu\',32,22);">De 32:22</a>; <a onClick="return mV(\'Isa\',7,11);">Isa 7:11</a>; <a onClick="return mV(\'Isa\',57,9);">57:9</a>; <a onClick="return mV(\'Job\',11,8);">Job 11:8</a>; <a onClick="return mV(\'Job\',26,6);">26:6</a>), this seems to be a figure for the extreme of humiliation to which that city was to be reduced in the course of history. It is true, <a onClick="return mV(\'Job\',11,24);">11:24</A>, with its mention of the day of judgment, might seem to favor an eschatological reference to the ultimate doom of the unbelieving inhabitants, but the usual restriction of Hades to the punishment of the intermediate state (see below) is against this.<P>7. <a onClick="return mV(\'Mat\',16,18);">Mt 16:18</a>:<P>In the other passage, <a onClick="return mV(\'Mat\',16,18);">Mt 16:18</a>, Jesus declares that the gates of Hades shall not katischuein the church He intends to build. The verb katischuein may be rendered, "to overpower" or "to surpass." If the former be adopted, the figure implied is that of Hades as a stronghold of the power of evil or death from which warriors stream forth to assail the church as the realm of life. On the other rendering there is no reference to any conflict between Hades and the church, the point of comparison being merely the strength of the church, the gates of Hades, i.e. the realm of death, serving in common parlance as a figure of the greatest conceivable strength, because they never allow to escape what has once entered through them.<P>The above survey of the passages tends to show that Hades, where it is locally conceived, is not a provisional receptacle for all the dead, but plainly associated with the punishment of the wicked. Where it comes under consideration for the righteous there is nothing to indicate a local sense. On <a onClick="return mV(\'1Pe\',3,19);">1Pe 3:19</a>; <a onClick="return mV(\'1Pe\',4,6);">4:6</a> (where, however, the word "Hades" does not occur), see articles <a href="study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT,+I-V">ESCHATOLOGY OF THE NEW TESTAMENT</a>; <a href="study/isbe/search.html?string=PRISON,+SPIRITS+IN">SPIRITS IN PRISON</a>.<P>8. Not a Final State:<P>The element of truth in theory of the provisional character of Hades lies in this, that the New Testament never employs it in connection with the final state of punishment, as subsequent to the last judgment. For this <a href="study/isbe/search.html?string=GEHENNA">GEHENNA</a> (which see) and other terms are used. Dives is represented as being in Hades immediately after his death and while his brethren are still in this present life. Whether the implied differentiation between stages of punishment, depending obviously on the difference between the disembodied and reembodied state of the lost, also carries with itself a distinction between two places of punishment, in other words whether Hades and Gehenna are locally distinct, the evidence is scarcely sufficient to determine. The New Testament places the emphasis on the eschatological developments at the end, and leaves many things connected with the intermediate state in darkness.``182';
isbe[3992]='Hadid`ha\'-did (chadhidh): A city in Benjamin (<a onClick="return mV(\'Neh\',11,33);">Ne 11:33</a>f) named with Lod and Ono (<a onClick="return mV(\'Ezr\',2,33);">Ezr 2:33</a>; <a onClick="return mV(\'Neh\',7,37);">Ne 7:37</a>), probably identical with Adida Septuagint Hadida) of 1Macc 12:38; 13:13, "over against the plain," which was fortified by Simon Maccabeus. It is represented by the modern el-Chaditheh, about 3 miles northeast of Lydda.``1';
isbe[3993]='Hadlai`had\'-li, had\'-la-i (chadhlay, "resting"): An Ephraimite (<a onClick="return mV(\'2Ch\',28,12);">2Ch 28:12</a>), father of Amasa, who was one of the heads of the tribe in the time of Pekah, king of Israel.``1';
isbe[3994]='Hadoram`ha-do\'-ram (hadhoram):<P>(1) Son of Joktan and apparently 6th in descent from Noah (<a onClick="return mV(\'Gen\',10,27);">Ge 10:27</a> parallel <a onClick="return mV(\'1Ch\',1,21);">1Ch 1:21</a>).<P>(2) Son of Tou, king of Hamath, sent by his father with presents to King David (<a onClick="return mV(\'1Ch\',18,10);">1Ch 18:10</a>). In <a onClick="return mV(\'2Sa\',8,9,10);">2Sa 8:9-10</a>, written probably incorrectly "Joram," "son of Toi."<P>(3) Rehoboam\'s superintendent of the forced labor department (<a onClick="return mV(\'2Ch\',10,18);">2Ch 10:18</a>), called Adoram <a onClick="return mV(\'1Ki\',12,18);">1Ki 12:18</a>, a contraction of <a href="study/isbe/search.html?string=ADONIRAM">ADONIRAM</A> (which see). He was sent by Rehoboam as messenger to Israel at the time of the revolt of the ten tribes and was stoned to death by them.``76';
isbe[3995]='Hadrach`ha\'-drak, had\'-rak (chadhrakh): "The land of Hadrach" is mentioned only once in Scripture (<a onClick="return mV(\'Zec\',9,1);">Zec 9:1</a>), and there it is grouped with Damascus, Hamath, Tyre and Sidon. It may be safely identified with the "Hatarikka" of the Assyrian inscriptions, against which Assur-dan III made expeditions in his 1st (772 BC), 8th and 18th years. It also appears in inscriptions of Tiglath-pileser III. They place it in the north of Lebanon.``1';
isbe[3996]='Hagab`ha\'-gab (chaghabh, "locust"): Ancestor of some of the Nethinim who returned from the Babylonian captivity with Zerubbabel and Nehemiah. The name occurs second after Hagabah in <a onClick="return mV(\'Ezr\',2,46);">Ezr 2:46</a>, but is omitted entirely from the parallel list of <a onClick="return mV(\'Neh\',7,48);">Ne 7:48</a>.``1';
isbe[3997]='Hagaba`ha-ga\'-ba, hag\'-a-ba (chaghabha\'): Same as the following (<a onClick="return mV(\'Neh\',7,48);">Ne 7:48</a>).``1';
isbe[3998]='Hagabah`ha-ga\'-ba, hag\'-a-ba (chaghabhah, "locust"): Like Hagab, an ancestor of some of the Nethinim who returned from Babylon with Zerubbabel (<a onClick="return mV(\'Ezr\',2,45);">Ezr 2:45</a>); spelled Hagaba in the parallel passage (<a onClick="return mV(\'Neh\',7,48);">Ne 7:48</a>).``1';
isbe[3999]='Hagar`ha\'-gar (haghar, "emigration," "flight"; Hagar, Agar): An Egyptian woman, the handmaid or slave of Sarai; a present, perhaps, from Pharaoh when Abram dissembled to him in Egypt (<a onClick="return mV(\'Gen\',12,16);">Ge 12:16</a>). Mention is made of her in two passages (<a onClick="return mV(\'Gen\',16,\'1-\');">Ge 16</a>; <a onClick="return mV(\'Gen\',21,\'8-21\');">21:8-21</a>).<P>1. The Scornful Handmaid and Her Flight:<P>In the first narrative (<a onClick="return mV(\'Gen\',16,\'1-\');">Ge 16</a>) it is related that Sarai, despairing at her age of having children, gave Hagar to Abram as a concubine. As Hagar was not an ordinary household slave but the peculiar property of her mistress (compare <a onClick="return mV(\'Gen\',29,24,29);">Ge 29:24, 29</a>), any offspring which she might bear to Abram would be reckoned as Sarai\'s (compare <a onClick="return mV(\'Gen\',30,\'3-9\');">Ge 30:3-9</a>). In the prospect of becoming a mother, Hagar, forgetting her position, seems to have assumed an insolent bearing toward her childless mistress. Sarai felt keenly the contempt shown her by her handmaid, and in angry tones brought her conduct before Abram. Now that her plan was not working out smoothly, she unfairly blamed her husband for what originated with herself, and appealed to Heaven to redress her grievance. Abram refused to interfere in the domestic quarrel, and renouncing his rights over his concubine, and her claims on him, put her entirely at Sarai\'s disposal. Under the harsh treatment of her mistress Hagar\'s life became intolerable, and she fled into the wilderness, turning her steps naturally toward Egypt, her native land.<P>2. Her Vision and Return:<P>But the angel of Yahweh (who is here introduced for the first time as the medium of theophany) appeared to her as she was resting by a spring and commanded her to return and submit herself to her mistress, promising her an innumerable seed through her unborn son, concerning whom he uttered a striking prediction (see <a href="study/isbe/search.html?string=ISHMAEL+(1)">ISHMAEL</a>). To the angel (who is now said to be Yahweh Himself) Hagar gave the name "Thou art a God of seeing" (the Revised Version (British and American) "that seeth"), for she said, "Have I even here (in the desert where God, whose manifestations were supposed to be confined to particular places, might not be expected to reveal Himself) looked after him that seeth me?"—the meaning being that while God saw her, it was only while the all-seeing God in the person of His angel was departing that she became conscious of His presence. The spring where the angel met with her was called in Hebrew tradition Be\'er-lachay-ro\'i, "the well of the living one who seeth me" (Revised Version, margin).<P>Obedient to the heavenly vision Hagar returned, as the narrative implies, to her mistress and gave birth to Ishmael, Abram being then eighty-six years old.<P>The idea in <a onClick="return mV(\'Gen\',30,13);">30:13</a> is not very clearly expressed. The word translated "here" generally means "hither," and there is no explanation of the "living one" in the name of the well. It has therefore been proposed to emend the Hebrew text and read "Have I even seen God, and lived after my seeing?"—an allusion to the belief that no one could "see God and live" (compare <a onClick="return mV(\'Gen\',32,30);">Ge 32:30</a>; <a onClick="return mV(\'Exd\',33,20);">Ex 33:20</a>). But there are difficulties in the way of accepting this emendation. The name of God, "a God of seeing," would require to be interpreted in an objective sense as "a God who is seen," and the consequent name of the well, "He that seeth me liveth," would make God, not Hagar, as in <a onClick="return mV(\'Gen\',30,13);">30:13</a>, the speaker.<P>3. Her Harsh Expulsion and Divine Help:<P>The other narrative (<a onClick="return mV(\'Gen\',21,\'8-21\');">Ge 21:8-21</a>) relates what occurred in connection with the weaning of Isaac. The presence and conduct of Ishmael during the family feast held on the occasion roused the anger and jealousy of Sarah who, fearing that Ishmael would share the inheritance with Isaac, peremptorily demanded the expulsion of the slave-mother and her son. But the instincts of Abraham\'s fatherly heart recoiled from such a cruel course, and it was only after the revelation was made to him that the ejection of Hagar and her son would be in the line of the Divine purpose—for Isaac was his real seed, while Ishmael would be made a nation too—that he was led to forego his natural feelings and accede to Sarah\'s demand. So next morning the bondwoman and her son were sent forth with the bare provision of bread and a skin of water into the wilderness of Beersheba. When the water was spent, Hagar, unable to bear the sight of her boy dying from thirst, laid him under a shrub and withdrew the distance of a bowshot to weep out her sorrow. But the angel of God, calling to her out of heaven, comforted her with the assurance that God had heard the voice of the lad and that there was a great future before him. Then her eyes were opened to discover a well of water from which she filled the skin and gave her son to drink. With God\'s blessing the lad grew up amid the desert\'s hardships, distinguished for his skill with the bow. He made his home in the wilderness of Paran, and his mother took a wife for him out of her own country.<P>4. Practical Lessons from the History:<P>The life and experience of Hagar teach, among other truths, the temptations incident to a new position; the foolishness of hasty action in times of trial and difficulty; the care exercised over the lonely by the all-seeing God; the Divine purpose in the life of everyone, however obscure and friendless; how God works out His gracious purposes by seemingly harsh methods; and the strength, comfort and encouragement that ever accompany the hardest experiences of His children.<P>5. Critical Points in the Documents:<P><a onClick="return mV(\'Gen\',16,\'1-\');">Genesis 16</a> belongs to the Jahwist, J, (except <a onClick="return mV(\'Gen\',16,1,3);">16:1a, 3,15f</A> which are from P), and <a onClick="return mV(\'Gen\',21,\'8-21\');">21:8-21</A> to E. From the nature of the variations in the narratives many critics hold that we have here two different accounts of the same incident. But the narratives as they stand seem to be quite distinct, the one referring to Hagar\'s flight before the birth of Ishmael, and the other to her expulsion at the weaning of Isaac. It is said, however, that Elohist (E) represents Ishmael as a child "playing" (The Revised Veersion, margin, Septuagint paizonta) with Isaac at the weaning festival, and young enough to be carried by his mother and "cast" under a shrub; while according to the Priestly Code, the Priestly Code (P), (<a onClick="return mV(\'Gen\',16,16);">Ge 16:16</a>; <a onClick="return mV(\'Gen\',21,5);">21:5</a>), as a child was weaned at the age of two or three years, he would be a lad of sixteen at that time. The argument for the double narrative here does not seem conclusive. The word metsacheq (<a onClick="return mV(\'Gen\',16,9);">16:9</A>) does not necessarily mean "playing" when used absolutely; it is so used in <a onClick="return mV(\'Gen\',19,14);">Ge 19:14</a>, evidently in the sense of "mocking" or "jesting," and Delitzsch gives it that meaning there. Then as to <a onClick="return mV(\'Gen\',19,14);">19:14</A>, the Massoretic Text does not state that the child was put on her shoulder, although the Septuagint does; nor does "cast" (<a onClick="return mV(\'Gen\',19,15);">19:15</a>) so "clearly imply" that Ishmael was an infant carried by his mother (compare <a onClick="return mV(\'Mat\',15,30);">Mt 15:30</a>). It may be added that the words yeledh and na\'ar, translated "child" and "lad" respectively, determine nothing as to age, as they are each used elsewhere in both senses.<P>6. Allegorical Use of the Story by Paul:<P>In <a onClick="return mV(\'Gal\',4,21);">Ga 4:21</a>ff Paul makes an allegorical use of this episode in the history of Ishmael and Isaac to support his argument for the transitory character of the Jewish ritual and the final triumph of Christian freedom over all Judaizing tendencies. In elaborating his reference, the apostle institutes a series of contrasts. Hagar, the bondwoman, represents the old covenant which was given from Mt. Sinai; and as Ishmael was Abraham\'s son after the flesh, so the Judaizing Christians, who wish to remain in bondage to the law, are Hagar\'s children. On the other hand, Sarah, the freewoman, represents the new covenant instituted by Christ; and as Isaac was born to Abraham in virtue of the promise, so the Christians who have freed themselves entirely from the law of carnal ordinances and live by faith are Sarah\'s children. Thus Hagar corresponds to "the Jerusalem that now is," that is, the Jewish state which is in spiritual bondage with her children; while Sarah represents "the Jerusalem that is above," "our mother" (Revised Version (British and American)), the mother of us Christians, that free spiritual city to which Christians even now belong (<a onClick="return mV(\'Phl\',3,20);">Php 3:20</a>). By this allegory the apostle would warn the Galatian Christians of the danger which beset them from their Judaizing brethren, of their subjection to the covenant of works and their ultimate expulsion from the household of faith.<P>To us Paul\'s reference does not appeal with the same force as it would do to those to whom he was writing. The incident taken by itself, indeed, does not contain any suggestion of such a hidden meaning. Yet the history of the Hebrew nation is but typical of the history of the church in all ages, and the apostle\'s familiarity with rabbinical modes of interpretation may have led him to adopt this method of confirming the truth which he had already proved from the law itself.<P>For a discussion of the text and interpretation of <a onClick="return mV(\'Gal\',4,25);">Ga 4:25a</a>, "Now this Hagar is mount Sinai in Arabia," and an account of Philo\'s allegory of Hagar and Sarah, see Lightfoot\'s notes at the end of chapter iv in his Commentary on Gal.``32';
