isbe = [];

isbe[4101]='Hard; Hardiness; Harddiness; Hardly`hard, har\'-di-nes, hard\'-nes, hard\'-li (qasheh, pala\'; skleros):The senses in which hard is used may be distinguished as:<P>(1) "Firm," "stiff," opposite to soft: <a onClick="return mV(\'Job\',41,24);">Job 41:24</a>, yatsaq, "to be firm," "his heart...as hard as a piece of the nether millstone," the Revised Version (British and American) "firm"; <a onClick="return mV(\'Eze\',3,7);">Eze 3:7</a>, qasheh, "sharp," "hard of heart"; chazaq, "firm," "As an adamant harder than flint have I made thy forehead"; <a onClick="return mV(\'Jer\',5,3);">Jer 5:3</a>, "They have made their faces harder than a rock"; <a onClick="return mV(\'Pro\',21,29);">Pr 21:29</a>, \'azaz, "to make strong," "hard," "impudent," "a wicked man hardeneth his face"; <a onClick="return mV(\'Pro\',13,15);">Pr 13:15</a> probably belongs here also where \'ethan is translated "hard": "The way of the transgressor is hard," the English Revised Version "The way of the treacherous is rugged"; the Hebrew word means, "lasting," "firm," poet. "rocks" (the earth\'s foundations, <a onClick="return mV(\'Mic\',6,2);">Mic 6:2</a>), and the meaning seems to be, not that the way (path) of transgressors, or the treacherous (Delitzsch has "uncultivated"), is hard (rocky) to them, but that their way, or mode of acting, is hard, unsympathetic, unkind, "destitute of feeling in things which, as we say, would soften a stone" (Delitzsch on passage); also <a onClick="return mV(\'Mat\',25,24);">Mt 25:24</a>, skleros, "stiff," "thou art a hard man"; The <span class="noTag">Wisdom of Solomon 11:4</span>, skleros, "hard stone," the Revised Version (British and American) "flinty rock," margin "the steep rock."<P>(2) "Sore," "trying," "painful," qasheh (<a onClick="return mV(\'Exd\',1,14);">Ex 1:14</a>, "hard service"; Deuteronomy 26:6; <a onClick="return mV(\'2Sa\',3,39);">2Sa 3:39</a>; <a onClick="return mV(\'Psa\',60,3);">Ps 60:3</a>; <a onClick="return mV(\'Isa\',14,3);">Isa 14:3</a>); qashah "to have it hard" (<a onClick="return mV(\'Gen\',35,16,17);">Ge 35:16-17</a>; <a onClick="return mV(\'Deu\',15,18);">De 15:18</a>); \'athaq, "stiff" (<a onClick="return mV(\'Psa\',94,4);">Ps 94:4</a> the King James Version, "They utter and speak hard things"); skleros (<a onClick="return mV(\'Jhn\',6,60);">Joh 6:60</a>, "This is a hard saying"—hard to accept, hard in its nature; <a onClick="return mV(\'Act\',9,5);">Ac 9:5</a> the King James Version; <a onClick="return mV(\'Act\',26,14);">Ac 26:14</a>; <a onClick="return mV(\'Jud\',1,15);">Jude 1:15</a>, "hard speeches"; The <span class="noTag">Wisdom of Solomon 19:13</span>).<P>(3) "Heavy," "pressing hard," kabhedh, "weighty" (<a onClick="return mV(\'Eze\',3,5,6);">Eze 3:5-6</a>, "a people of a strange speech and of a hard language," the Revised Version margin (Hebrew) "deep of lip and heavy of tongue"); camakh, "to lay" (<a onClick="return mV(\'Psa\',88,7);">Ps 88:7</a>, "Thy wrath lieth hard upon me").<P>(4) "Difficult," "hard to do," "know," etc., pala\', "difficult to be done" (<a onClick="return mV(\'Gen\',18,14);">Ge 18:14</a>, "Is anything too hard for Yahweh?"; <a onClick="return mV(\'Jer\',32,17,27);">Jer 32:17, 27</a>; <a onClick="return mV(\'Deu\',17,8);">De 17:8</a>; <a onClick="return mV(\'2Sa\',13,2);">2Sa 13:2</a>); qasheh (<a onClick="return mV(\'Exd\',18,26);">Ex 18:26</a>, "hard causes"); qashah (<a onClick="return mV(\'Deu\',1,17);">De 1:17</a>; <a onClick="return mV(\'2Ki\',2,10);">2Ki 2:10</a>); chidhah, "something twisted," "involved," "an enigma"; compare <a onClick="return mV(\'Jdg\',14,14);">Jud 14:14</a> (<a onClick="return mV(\'1Ki\',10,1);">1Ki 10:1</a>; <a onClick="return mV(\'2Ch\',9,1);">2Ch 9:1</a>, "to prove Solomon with hard questions"); \'ahidhan, Aramaic (<a onClick="return mV(\'Dan\',5,12);">Da 5:12</a>); duskolos, literally, "difficult about food," "hard to please," hence, "difficult to accomplish" (<a onClick="return mV(\'Mar\',10,24);">Mr 10:24</a>, "How hard is it for them that trust in riches to enter into the kingdom of God"); dusnoetos, "hard to be understood" (<a onClick="return mV(\'Hbr\',5,11);">Heb 5:11</a>; <a onClick="return mV(\'2Pe\',3,16);">2Pe 3:16</a>; compare Ecclesiasticus 3:21, "things too hard for thee," chalepos).<P>(5) "Close," or "near to" (hard by), naghash, "to come nigh" (<a onClick="return mV(\'Jdg\',9,52);">Jud 9:52</a>, the American Standard Revised Version "near"); dabhaq and dabheq, "to follow hard after" (<a onClick="return mV(\'Jdg\',20,45);">Jud 20:45</a>; <a onClick="return mV(\'Psa\',63,8);">Ps 63:8</a>, etc.); \'etsel, "near" (<a onClick="return mV(\'1Ki\',21,1);">1Ki 21:1</a>); le\'ummath, "over against" (<a onClick="return mV(\'Lev\',3,9);">Le 3:9</a>); \'adh, "to" "even to" (<a onClick="return mV(\'1Ch\',19,4);">1Ch 19:4</a>, the King James Version "hard by," the Revised Version (British and American) "even to").<P>Hardiness occurs in Judith 16:10 thrasos, the Revised Version (British and American) "boldness."<P>Hardness is the translation of mutsaq, "something poured out," "dust wetted," "running into clods" (<a onClick="return mV(\'Job\',38,38);">Job 38:38</a>), the Revised Version (British and American) "runneth into a mass"; "hardness of heart" occurs in the Gospels; in <a onClick="return mV(\'Mar\',3,5);">Mr 3:5</a>, it is porosis, "hardness," "callousness"; <a onClick="return mV(\'Mat\',19,8);">Mt 19:8</a>; <a onClick="return mV(\'Mar\',10,5);">Mr 10:5</a>; <a onClick="return mV(\'Mar\',16,14);">16:14</a>, sklerokardia, "dryness," "stiffness of heart"; compare Ecclesiasticus 16:10; in <a onClick="return mV(\'Rom\',2,5);">Ro 2:5</a>, it is sklerotes; in <a onClick="return mV(\'2Ti\',2,3);">2Ti 2:3</a> the King James Version we have, "Endure hardness, as a good soldier of Jesus Christ," the Revised Version (British and American) "Suffer hardship with me" (corrected text), margin "Take thy part in suffering hardship" (kakopatheo, "to suffer evil").<P>Hardly occurs in the Old Testament (<a onClick="return mV(\'Exd\',13,15);">Ex 13:15</a>), "Pharaoh would hardly let us go," qashah, literally, "hardened to let us go," the Revised Version margin "hardened himself against letting us go"; "hardly bestead" (<a onClick="return mV(\'Isa\',8,21);">Isa 8:21</a>) is the translation of qadshah, the American Standard Revised Version "sore distressed." In the New Testament "hardly" is the translation of duskolos, "hard to please," "difficult," meaning not scarcely or barely, but with difficulty (<a onClick="return mV(\'Mat\',19,23);">Mt 19:23</a>, "A rich man shall hardly enter into the kingdom of heaven," the Revised Version (British and American) "it is hard for"; <a onClick="return mV(\'Mar\',10,23);">Mr 10:23</a>; <a onClick="return mV(\'Luk\',18,24);">Lu 18:24</a>, "how hardly" ("with what difficulty")); of mogis, "with labor," "pain," "trouble" (<a onClick="return mV(\'Luk\',9,39);">Lu 9:39</a>, "hardly departeth from him" ("painfully")); of molis "with toil and fatigue" (<a onClick="return mV(\'Act\',27,8);">Ac 27:8</a>, the Revised Version (British and American) "with difficulty"; The <span class="noTag">Wisdom of Solomon 9:16</span>, "Hardly do we guess aright at things that are upon earth"; Ecclesiasticus 26:29, "A merchant shall hardly keep himself from wrong doing"; 29:6, "He shall hardly receive the half," in each instance the word is molis, but in the last two instances we seem to see the transition to "scarcely"; compare also <a onClick="return mV(\'Exd\',13,15);">Ex 13:15</a>).<P>The Revised Version has "too hard" for "hidden" (<a onClick="return mV(\'Deu\',30,11);">De 30:11</a>, margin "wonderful"); "hardness" for "boldness" (of face) (<a onClick="return mV(\'Ecc\',8,1);">Ec 8:1</a>); for "sorrow" (<a onClick="return mV(\'Lam\',3,65);">La 3:65</a>); "deal hardly with me" for "make yourselves strong to me" (<a onClick="return mV(\'Job\',19,3);">Job 19:3</a>); omits "It is hard for thee to kick against the pricks" (<a onClick="return mV(\'Act\',9,5);">Ac 9:5</a>, corrected text); "hardship" for "trouble" (<a onClick="return mV(\'2Ti\',2,9);">2Ti 2:9</a>).``185';
isbe[4102]='Harden`har\'-d\'-n (chazaq, qashah; skleruno):<P>(1) "Harden" occurs most frequently in the phrase "to harden the heart," or "the neck." This hardening of men\'s hearts is attributed both to God and to men themselves, e.g. with reference to the hearts of Pharaoh and the Egyptians; the Hiphil of chazaq, "to make strong," is frequently used in this connection (<a onClick="return mV(\'Exd\',4,21);">Ex 4:21</a>, "I will harden his heart," the Revised Version margin (Hebrew) "make strong"; <a onClick="return mV(\'Exd\',7,13);">Ex 7:13</a>, "And he hardened P.\'s heart," the Revised Version (British and American) "was hardened," margin (Hebrew) "was strong"; <a onClick="return mV(\'Exd\',7,22);">Ex 7:22</a>; <a onClick="return mV(\'Exd\',8,19);">8:19</a>; <a onClick="return mV(\'Exd\',9,12);">9:12</a>; <a onClick="return mV(\'Exd\',10,20,27);">10:20, 27</a>, etc.; <a onClick="return mV(\'Exd\',14,17);">Ex 14:17</a>, "I will harden the hearts of the Egyptians," the Revised Version margin (Hebrew) "make strong"; compare <a onClick="return mV(\'Jos\',11,20);">Jos 11:20</a>); qashah, "to be heavy," "to make hard" (<a onClick="return mV(\'Exd\',7,3);">Ex 7:3</a>); kabhedh, "heavy," "slow," "hard," not easily moved (<a onClick="return mV(\'Exd\',10,1);">Ex 10:1</a>, the Revised Version margin (Hebrew) "made heavy"). When the hardening is attributed to man\'s own act kabhedh is generally used (<a onClick="return mV(\'Exd\',8,15);">Ex 8:15</a>, "He hardened his heart, and hearkened not," the Revised Version margin (Hebrew) "made heavy"; <a onClick="return mV(\'Exd\',8,32);">Ex 8:32</a>, "Pharaoh hardened his heart" (the Revised Version margin as before); <a onClick="return mV(\'Exd\',9,7,34);">Ex 9:7, 34</a>; <a onClick="return mV(\'1Sa\',6,6);">1Sa 6:6</a> twice). The "hardening" of men\'s hearts by God is in the way of punishment, but it is always a consequence of their own self-hardening. In Pharaoh\'s case we read that "he hardened his heart" against the appeal to free the Israelites; so hardening himself, he became always more confirmed in his obstinacy, till he brought the final doom upon himself. This is how sin is made to become its own punishment. It was not confined to Pharaoh and the Egyptians nor does it belong to the past only. As Paul says (<a onClick="return mV(\'Rom\',9,18);">Ro 9:18</a>),"whom he will he hardeneth" (skleruno); <a onClick="return mV(\'Exd\',11,7);">Ex 11:7</a>, "The election obtained it, and the rest were hardened" (the Revised Version (British and American) and King James Version margin, poroo, "to make hard" or "callous"); a "Hardening in part hath befallen Israel" (porosis); compare <a onClick="return mV(\'Jhn\',12,40);">Joh 12:40</a> (from <a onClick="return mV(\'Isa\',6,10);">Isa 6:10</a>), "He hath blinded their eyes, and he hardened their heart"; <a onClick="return mV(\'Isa\',63,17);">Isa 63:17</a>, "O Yahweh, why dost thou make us to err from thy ways, and hardenest our heart from thy fear?" (qashach, "to harden"); compare on the other side, as expressing the human blameworthiness, <a onClick="return mV(\'Job\',9,4);">Job 9:4</a>, "Who hath hardened himself against him, and prospered?" <a onClick="return mV(\'Mar\',3,5);">Mr 3:5</a>, "being grieved at the hardening of their heart;" <a onClick="return mV(\'Mar\',6,52);">Mr 6:52</a>, "Their heart was hardened"; <a onClick="return mV(\'Rom\',2,5);">Ro 2:5</a>, "after thy hardness and impenitent heart." In Hebrew religious thought everything was directly attributed to God, and the hardening is God\'s work, in His physical and ethical constitution and laws of man\'s nature; but it is always the consequence of human action out of harmony therewith. Other instances of skleruno are in <a onClick="return mV(\'Act\',19,9);">Ac 19:9</a>; <a onClick="return mV(\'Hbr\',3,8,13,15);">Heb 3:8, 13, 15</a>; <a onClick="return mV(\'Hbr\',4,7);">4:7</a>.<P>(2) "Harden" in the sense of "to fortify one\'s self" (make one\'s self hard) is the translation of caladh, "to leap," "exult" (<a onClick="return mV(\'Job\',6,10);">Job 6:10</a> the King James Version, "I would harden myself in sorrow," the Revised Version (British and American) "Let me exult in pain," margin "harden myself").<P>(3) In <a onClick="return mV(\'Pro\',21,29);">Pr 21:29</a> "harden" has the meaning of "boldness," "defiance" or "shamelessness" (brazen-faced); \'azaz, Hiphil, "to strengthen one\'s countenance," "A wicked man hardeneth his face"; Delitzsch, "A godless man showeth boldness in his mien"; compare <a onClick="return mV(\'Pro\',7,13);">Pr 7:13</a>; <a onClick="return mV(\'Ecc\',8,1);">Ec 8:1</a>; see also <a href="study/isbe/search.html?string=HARD;+HARDINESS;+HARDDINESS;+HARDLY">HARD</A>.<P>For "harden" the Revised Version (British and American) has "stubborn" (<a onClick="return mV(\'Exd\',7,14);">Ex 7:14</a>; <a onClick="return mV(\'Exd\',9,7);">9:7</a>, margin "heavy"); "hardenest" (<a onClick="return mV(\'Isa\',63,17);">Isa 63:17</a>); "made stiff" (<a onClick="return mV(\'Jer\',7,26);">Jer 7:26</a>; <a onClick="return mV(\'Jer\',19,15);">19:15</a>); for "is hardened" (<a onClick="return mV(\'Job\',39,16);">Job 39:16</a>, the American Standard Revised Version "dealeth hardly," and the English Revised Version margin); "at the hardening" instead of "for the hardness" (<a onClick="return mV(\'Mar\',3,5);">Mr 3:5</a>); "hardening" for "blindness" (<a onClick="return mV(\'Eph\',4,18);">Eph 4:18</a>).``185';
isbe[4103]='Hardly; Hardness``<a href="./study/isbe/search.html?string=HARD;+HARDINESS;+HARDDINESS;+HARDLY">HARD</a>`1';
isbe[4104]='Hare`har (\'arnebheth (<a onClick="return mV(\'Lev\',11,6);">Le 11:6</a>; <a onClick="return mV(\'Deu\',14,7);">De 14:7</a>); compare Arabic \'arnab, "hare"): This animal is mentioned only in the lists of unclean animals in Leviticus and Deuteronomy, Where it occurs along with the camel, the coney and the swine. The camel, the hare and the coney are unclean, \'because they chew the cud but part not the hoof,\' the swine, "because he parteth the hoof...but cheweth not the cud." The hare and the coney are not ruminants, but might be supposed to be from their habit of almost continually moving their jaws. Both are freely eaten by the Arabs. Although \'arnebheth occurs only in the two places cited, there is no doubt that it is the hare. Septuagint has dasupous, "rough-footed," which, while not the commonest Greek word (lagos), refers to the remarkable fact that in hares and rabbits the soles of the feet are densely covered with hair. \'Arnab, which is the common Arabic word for "hare," is from the same root as the Hebrew \'arnebheth.<P><a onClick="return mV(\'Lev\',11,\'4-7\');">Le 11:4-7</a>: verse <a onClick="return mV(\'Lev\',11,4);">4</A>, English Versions of the Bible "camel"; Septuagint ton kamelon; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) camelus; Hebrew ha-gamal. <a onClick="return mV(\'Lev\',11,5);">Le 11:5</a>, English Versions of the Bible "coney"; Septuagint ton dasupoda; Vulgate, choerogryllus; Hebrew ha-shapan. <a onClick="return mV(\'Lev\',11,6);">Le 11:6</a>, English Versions of the Bible "hare"; Septuagint ton choirogruillion Vulgate, lepus; Hebrew ha-arnebeth. <a onClick="return mV(\'Lev\',11,7);">Le 11:7</a>, English Versions of the Bible "swine"; Septuagint ton hun; Vulgate, sus; Hebrew ha-chazir.<P><a onClick="return mV(\'Deu\',14,7);">De 14:7</a>: English Versions of the Bible "camel"; Septuagint ton kamelon Vulgate, camelum; Hebrew hagamal; English Versions of the Bible "hare"; Septuagint dasupoda; Vulgate, leporem; Hebrew ha\'arnebeth; English Versions of the Bible "coney"; Septuagint choirogrullion; Vulgate, choerogryllum; Hebrew hashaphan.<P><a onClick="return mV(\'Deu\',14,8);">De 14:8</a>: English Versions of the Bible "swine"; Septuagint ton hun Vulgate, sus; Hebrew hacheziyr.<P>It is evident from the above and from the meanings of dasupous and chorogrullios as given in Liddell and Scott, that the order of Septuagint in <a onClick="return mV(\'Lev\',11,5,6);">Le 11:5-6</a> does not follow the Hebrew, but has apparently assimilated the order of that of <a onClick="return mV(\'Deu\',14,7,8);">De 14:7-8</a>. In <a onClick="return mV(\'Psa\',104,18);">Ps 104:18</a>, Septuagint has chorogrullios for shaphan; also in <a onClick="return mV(\'Pro\',30,26);">Pr 30:26</a>.<P>Since the word "coney," which properly means "rabbit," has been applied to the hyrax, so, in America at least, the word "rabbit" is widely used for various species of hare, e.g. the gray rabbit and the jack-rabbit, both of which are hares. Hares have longer legs and ears and are swifter than rabbits. Their young are hairy and have their eyes open, while rabbits are born naked and blind. Hares are widely distributed in the Northern Hemisphere, and there is one species in South America. Rabbits are apparently native to the Western Mediterranean countries, although they have been distributed by man all over the world.<P>Lepus syriacus, the common hare of Syria and Palestine, differs somewhat from the European hare. Lepus judeae is cited by Tristram from Northeastern Palestine, and he also notes three other species from the extreme south.``37';
isbe[4105]='Hareph`ha\'-ref (chareph, "scornful"): A chief of Judah, one of the sons of Caleb and father of Beth-gader (<a onClick="return mV(\'1Ch\',2,51);">1Ch 2:51</a>). A quite similar name, Hariph, occurs in <a onClick="return mV(\'Neh\',7,24);">Ne 7:24</a>; <a onClick="return mV(\'Neh\',10,19);">10:19</a>, but it is probably that of another individual.``1';
isbe[4106]='Hareth`ha\'-reth (chhareth, in pause).`<a href="./study/isbe/search.html?string=HERETH,+THE+FOREST+OF">HERETH</a>`1';
isbe[4107]='Harhaiah`har-ha\'-ya (charhayah, "Yah protects"): A goldsmith, whose son, Uzziel, helped to repair the walls of Jerusalem under Zerubbabel (<a onClick="return mV(\'Neh\',3,8);">Ne 3:8</a>).``1';
isbe[4108]='Harhas`har\'-has (charchas, "splendor"): Grandfather of Shallum, husband of Huldah (<a onClick="return mV(\'2Ki\',22,14);">2Ki 22:14</a>). Name given as "Hasrah" in parallel passage (<a onClick="return mV(\'2Ch\',34,22);">2Ch 34:22</a>).``1';
isbe[4109]='Harhur`har\'-hur (charchur, "free-born" or "fever"; "Hasour): One of the Nethinim whose descendants came from Babylon with Zerubbabel (<a onClick="return mV(\'Ezr\',2,51);">Ezr 2:51</a>; <a onClick="return mV(\'Neh\',7,53);">Ne 7:53</a>; 1Esdras 5:31).``1';
isbe[4110]='Harim`ha\'-rim (charim): A family name.<P>(1) A non-priestly family that returned from captivity with Zerubbabel (<a onClick="return mV(\'Ezr\',2,32);">Ezr 2:32</a>; <a onClick="return mV(\'Neh\',7,35);">Ne 7:35</a>); mentioned among those who married foreign wives (<a onClick="return mV(\'Ezr\',10,31);">Ezr 10:31</a>); also mentioned among those who renewed the covenant (<a onClick="return mV(\'Neh\',10,27);">Ne 10:27</a>).<P>(2) A priestly family returning with Zerubbabel (<a onClick="return mV(\'Ezr\',2,39);">Ezr 2:39</a>; <a onClick="return mV(\'Neh\',7,42);">Ne 7:42</a>; <a onClick="return mV(\'Neh\',12,3,15);">12:3, 15</a> (see <a href="study/isbe/search.html?string=REHUM">REHUM</A>)); members of this family covenanted to put away their foreign wives (<a onClick="return mV(\'Ezr\',10,21);">Ezr 10:21</a>; <a onClick="return mV(\'Neh\',10,5);">Ne 10:5</a>). A family of this name appears as the third of the priestly courses in the days of David and Solomon (<a onClick="return mV(\'1Ch\',24,8);">1Ch 24:8</a>).<P>(3) In <a onClick="return mV(\'Neh\',3,11);">Ne 3:11</a> is mentioned Malchijah, son of Harim, one of the wall-builders. Which family is here designated is uncertain.``164';
isbe[4111]='Hariph`ha\'-rif (chariph, chariph): One of those who returned from exile under Zerubbabel and helped to seal the covenant under Nehemiah and Ezra (<a onClick="return mV(\'Neh\',7,24);">Ne 7:24</a>; <a onClick="return mV(\'Neh\',10,19);">10:19</a> (20)). <a onClick="return mV(\'Ezr\',2,18);">Ezr 2:18</a> has "Jorah."``1';
isbe[4112]='Harlot`har\'-lot: This name replaces in the Revised Version (British and American) "whore" of the King James Version. It stands for several words and phrases used to designate or describe the unchaste woman, married or unmarried, e.g. zonah, \'ishshah nokhriyah, qedheshah; Septuagint and New Testament porne. porneia is used chiefly of prenuptial immorality, but the married woman guilty of sexual immorality is said to be guilty of porneia (<a onClick="return mV(\'Mat\',5,32);">Mt 5:32</a>; <a onClick="return mV(\'Mat\',19,9);">19:9</a>; compare <a onClick="return mV(\'Amo\',7,17);">Am 7:17</a> Septuagint). These and cognate words are applied especially in the Old Testament to those devoted to immoral service in idol sanctuaries, or given over to a dissolute life for gain. Such a class existed among all ancient peoples, and may be traced in the history of Israel. Evidence of its existence in very early times is found (<a onClick="return mV(\'Gen\',38,\'1-\');">Ge 38</a>). It grew out of conditions, sexual and social, which were universal. After the corrupting foreign influxes and influences of Solomon\'s day, it developed to even fuller shamelessness, and its voluptuous songs (<a onClick="return mV(\'Isa\',23,16);">Isa 23:16</a>), seductive arts (<a onClick="return mV(\'Pro\',6,24);">Pr 6:24</a>), and blighting influence are vividly pictured and denounced by the prophets (<a onClick="return mV(\'Pro\',7,10);">Pr 7:10</a>; <a onClick="return mV(\'Pro\',29,3);">29:3</a>; <a onClick="return mV(\'Isa\',23,16);">Isa 23:16</a>; <a onClick="return mV(\'Jer\',3,3);">Jer 3:3</a>; <a onClick="return mV(\'Jer\',5,7);">5:7</a>; <a onClick="return mV(\'Eze\',16,25);">Eze 16:25</a>; compare <a onClick="return mV(\'Deu\',23,17);">De 23:17</a>). Money was lavished upon women of this class, and the weak and unwary were taken captive by them, so that it became one of the chief concerns of the devout father in Israel to "keep (his son) from the evil woman," who "hunteth for the precious life" (<a onClick="return mV(\'Pro\',6,24,26);">Pr 6:24, 26</a>). From the title given her in Prov, a "foreign woman" (<a onClick="return mV(\'Pro\',23,27);">23:27</A>), and the warnings against "the flattery of the foreigner\'s tongue" (<a onClick="return mV(\'Pro\',6,24);">6:24</A>; compare <a onClick="return mV(\'1Ki\',11,1);">1Ki 11:1</a>; <a onClick="return mV(\'Ezr\',10,2);">Ezr 10:2</a>), we may infer that in later times this class was chiefly made up of strangers from without. The whole subject must be viewed in the setting of the times. Even in Israel, then, apart from breaches of marriage vows, immoral relations between the sexes were deemed venial (<a onClick="return mV(\'Deu\',22,28);">De 22:28</a>f). A man was forbidden to compel his daughter to sin (<a onClick="return mV(\'Lev\',19,29);">Le 19:29</a>), to "profane (her) and make her a harlot," but she was apparently left free to take that way herself (compare <a onClick="return mV(\'Gen\',38,\'1-\');">Ge 38</a>). The children of the harlot, though, were outlawed (<a onClick="return mV(\'Deu\',23,2);">De 23:2</a>), and later the harlot is found under the sternest social ban (<a onClick="return mV(\'Mat\',21,31,32);">Mt 21:31-32</a>).<P>The subject takes on even a darker hue when viewed in the light of the hideous conditions that prevailed in ancient Syria affecting this practice. The harlot represented more than a social peril and problem. She was a qedheshah, one of a consecrated class, and as such was the concrete expression and agent of the most insidious and powerful influence and system menacing the purity and permanence of the religion of Yahweh. This system deified the reproductive organs and forces of Nature and its devotees worshipped their idol symbols in grossly licentious rites and orgies. The temple prostitute was invested with sanctity as a member of the religious caste, as she is today in India. Men and women thus prostituted themselves in the service of their gods. The Canaanite sanctuaries were gigantic brothels, legalized under the sanctions of religion. For a time, therefore, the supreme religious question was whether such a cult should be established and allowed to naturalize itself in Israel, as it had done in Babylon (Herodotus i.199) and in Greece (Strabo viii.6). That the appeal thus made to the baser passions of the Israelites was all too successful is sadly clear (<a onClick="return mV(\'Amo\',2,7);">Am 2:7</a>; <a onClick="return mV(\'Hsa\',4,13);">Ho 4:13</a>). The prophets give vivid pictures of the syncretizing of the worship of Baal and Astarte with that of Yahweh and the extent to which the local sanctuaries were given over to this form of corruption. They denounced it as the height of impiety and as sure to provoke Divine judgments. Asa and Jehoshaphat undertook to purge the land of such vile abominations (<a onClick="return mV(\'1Ki\',14,24);">1Ki 14:24</a>; <a onClick="return mV(\'1Ki\',15,12);">15:12</a>; <a onClick="return mV(\'1Ki\',22,46);">22:46</a>). The Deuteronomic code required that all such "paramours" be banished, and forbade the use of their unholy gains as temple revenue (<a onClick="return mV(\'Deu\',23,17,18);">De 23:17-18</a>. Driver\'s note). The Levitical law forbade a priest to take a harlot to wife (<a onClick="return mV(\'Lev\',21,7);">Le 21:7</a>). and commanded that the daughter of a priest who played the harlot should be burned (<a onClick="return mV(\'Lev\',21,9);">Le 21:9</a>).<P>See <a href="study/isbe/search.html?string=ASHTORETH">ASHTORETH</a>; <a href="study/isbe/search.html?string=IMAGES">IMAGES</a>; <a href="study/isbe/search.html?string=IDOLATRY">IDOLATRY</A>.<P>It is grimly significant that the prophets denounce spiritual apostasy as "harlotry" (the King James Version "whoredom"). But it would seem that the true ethical attitude toward prostitution was unattainable so long as marriage was in the low, transitional stage mirrored in the Old Testament; though the religion of Yahweh was in a measure delivered from the threatened peril by the fiery discipline of the exile.<P>In New Testament times, a kindred danger beset the followers of Christ, especially in Greece and Asia Minor (<a onClick="return mV(\'Act\',15,20,29);">Ac 15:20, 29</a>; <a onClick="return mV(\'Rom\',1,24);">Ro 1:24</a>ff; <a onClick="return mV(\'1Cr\',6,9);">1Co 6:9</a>ff; <a onClick="return mV(\'Gal\',5,19);">Ga 5:19</a>). That lax views of sexual morality were widely prevalent in the generation in which Christ lived is evident both from His casual references to the subject and from His specific teaching in answer to questions concerning adultery and divorce (compare Josephus, Ant, IV, viii, 23; Vita, section 76; Sirach 7:26; 25:26; 42:9, and the Talm). The ideas of the times were debased by the prevalent polygamous customs, "it being of old permitted to the Jews to marry many wives" (Josephus, BJ, I, xxiv, 2; compare Ant, XVII, i, 2). The teaching of Jesus was in sharp contrast with the low ideals and the rabbinical teaching of the times. The controversy on this question waxed hot between the two famous rival rabbinical schools. Hillel reduced adultery to the level of the minor faults. Shammai opposed his teaching as immoral in tendency. kata pasan aitian (<a onClick="return mV(\'Mat\',19,3);">Mt 19:3</a>), gives incidental evidence of the nature of the controversy. It was characteristic of the teaching of Jesus that He went to the root of the matter, making this sin to consist in "looking on a woman to lust after her." Nor did He confine Himself to the case of the married. The general character of the terms in <a onClick="return mV(\'Mat\',5,28);">Mt 5:28</a>, pas ho blepon, forbids the idea that gunaika, and emoicheusen, are to be limited to post-nuptial sin with a married woman. On the other hand it is a characteristic part of the work of Jesus to rescue the erring woman from the merciless clutches of the Pharisaic tribunal, and to bring her within the pale of mercy and redemption (<a onClick="return mV(\'Mat\',21,31,32);">Mt 21:31-32</a>). He everywhere leaned to the side of mercy in dealing with such cases, as is indicated by the traditional and doubtless true narrative found in the accepted text of the Fourth Gospel (<a onClick="return mV(\'Jhn\',7,\'53-\');">Joh 7:53</A>-<a onClick="return mV(\'Jhn\',8,\'1-8\');">8:11</a>).``47';
isbe[4113]='Harlotry`har\'-lot-ri.`<a href="./study/isbe/search.html?string=CRIMES">CRIMES</a>`1';
isbe[4114]='Harnepher`har\'-ne-fer, har-ne\'-fer (charnepher): A member of the tribe of Asher (<a onClick="return mV(\'1Ch\',7,36);">1Ch 7:36</a>).``1';
isbe[4115]='Harness`har\'-nes: A word of Celtic origin meaning "armour" in the King James Version; it is the translation of shiryan, "a coat of mail" (<a onClick="return mV(\'1Ki\',22,34);">1Ki 22:34</a>; <a onClick="return mV(\'2Ch\',18,33);">2Ch 18:33</a>); of nesheq, "arms," "weapons" (<a onClick="return mV(\'2Ch\',9,24);">2Ch 9:24</a>, the Revised Version (British and American) "armor"); of \'acar "to bind" (<a onClick="return mV(\'Jer\',46,4);">Jer 46:4</a>), "harness the horses," probably here, "yoke the horses"; compare <a onClick="return mV(\'1Sa\',6,7);">1Sa 6:7</a>, "tie the kine to the cart" (bind them), <a onClick="return mV(\'Gen\',46,29);">Ge 46:29</a>; another rendering is "put on their accoutrements"; compare 1Macc 6:43, "one of the beasts armed with royal harness" (thorax), the Revised Version (British and American) "breastplates"; compare 1Macc 3:3, "warlike harness"; 1Macc 6:41 (hopla), the Revised Version (British and American) "arms"; 2Macc 3:25, etc.; harnessed represents chamushim, "armed," "girded" (<a onClick="return mV(\'Exd\',13,18);">Ex 13:18</a>, "The children of Israel went up harnessed," the Revised Version (British and American) "armed"). Tyndale, Cranmer, Geneva have "harnes" in <a onClick="return mV(\'Luk\',11,22);">Lu 11:22</a>, Wycliff "armer."``185';
isbe[4116]='Harod, Well of`ha\'-rod (\'en charodh, "fountain of trembling"): The fountain beside which (probably above it) Gideon and his army were encamped (<a onClick="return mV(\'Jdg\',7,1);">Jud 7:1</a>). Moore (Judges, in the place cited.) argues, inconclusively, that the hill Moreh must be sought near Shechem, and that the well of Harod must be some spring in the neighborhood of that city. There is no good reason to question the accuracy of the common view which places this spring at \'Ain Jalud, on the edge of the vale of Jezreel, about 2 miles east of Zer\'in, and just under the northern cliffs of Gilboa. A copious spring of clear cold water rises in a rocky cave and flows out into a large pool, whence it drains off, in Nahr Jalud, down the vale past Beisan to the Jordan. This is probably also to be identified with the spring "which is in Jezreel," i.e. in the district, near which Saul encamped before the battle of Gilboa (<a onClick="return mV(\'1Sa\',29,1);">1Sa 29:1</a>). \'Ain el-Meiyiteh, just below Zer\'in on the north, is hardly of sufficient size and importance to be a rival to \'Ain Jalud.`<a href="./study/isbe/search.html?string=ESDRAELON">ESDRAELON</a>`54';
isbe[4117]='Harodite`ha\'-rod-it (charodhi): Two of David\'s heroes, Shamma and Elika, are so called (<a onClick="return mV(\'2Sa\',23,25);">2Sa 23:25</a>). Septuagint omits the second name. In <a onClick="return mV(\'1Ch\',11,27);">1Ch 11:27</a>, the first is called "Shammoth the Harorite," while the second is omitted. "Harorite" is a clerical error for "Harodite," the Hebrew letter daleth ("d") being taken for the Hebrew letter resh ("r"). Possibly Harodite may be connected with the well of <a href="study/isbe/search.html?string=HAROD,+WELL+OF">HAROD</A> (which see).``1';
isbe[4118]='Haroeh`ha-ro\'-e (ha-ro\'eh, "the seer"): A Judahite (<a onClick="return mV(\'1Ch\',2,52);">1Ch 2:52</a>).``1';
isbe[4119]='Harorite`ha\'-ro-rit.`<a href="./study/isbe/search.html?string=HARODITE">HARODITE</a>`1';
isbe[4120]='Harosheth, of the Gentiles, of the Nations`ha-ro\'-sheth or (charosheth ha-goyim): There is now no means of discovering what is meant by the phrase "of the nations." This is the place whence Sisera led his hosts to the Kishon against Deborah and Barak (<a onClick="return mV(\'Jdg\',4,13);">Jud 4:13</a>), to which the discomfited and leaderless army fled after their defeat (<a onClick="return mV(\'Jdg\',4,16);">Jud 4:16</a>). No site seems so well to meet the requirements of the narrative as el Charithiyeh. There are still the remains of an ancient stronghold on this great double mound, which rises on the north bank of the Kishon, in the throat of the pass leading by the base of Carmel, from the coast to Esdraelon. It effectually commands the road which here climbs the slope, and winds through the oak forest to the plain; Megiddo being some 16 miles distant. The modern also preserves a reminiscence of the ancient name. By emending the text, Cheyne would here find the name "Kadshon," to be identified with Kedesh in Galilee (EB, under the word). On any reasonable reading of the narrative this is unnecessary.``54';
isbe[4121]='Harp`harp.`<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>`1';
isbe[4122]='Harrow`har\'-o (sadhadh): Sadhadh occurs in 3 passages (<a onClick="return mV(\'Job\',39,10);">Job 39:10</a>; <a onClick="return mV(\'Isa\',28,24);">Isa 28:24</a>; <a onClick="return mV(\'Hsa\',10,11);">Ho 10:11</a>). In the first 2 it is translated "harrow," in the last "break the clods." That this was a separate operation from plowing, and that it was performed with an instrument drawn by animals, seems certain. As to whether it corresponded to our modern harrowing is a question. The reasons for this uncertainty are:<P>(1) the ancient Egyptians have left no records of its use;<P>(2) at the present time, in those parts of Palestine and Syria where foreign methods have not been introduced, harrowing is not commonly known, although the writer has been told that in some districts the ground is leveled after plowing with the threshing-sledge or a log drawn by oxen. Cross-plowing is resorted to for breaking up the lumpy soil, especially where the ground has been baked during the long rainless summer. Lumps not reduced in this way are further broken up with a hoe or pick. Seed is always sown before plowing, so that harrowing to cover the seed is unnecessary. See <a href="study/isbe/search.html?string=AGRICULTURE">AGRICULTURE</A>. Figuratively used of affliction, discipline, etc. (<a onClick="return mV(\'Isa\',28,24);">Isa 28:24</a>).``133';
isbe[4123]='Harrows`har\'-oz (chrits): Charits has no connection with the verb translated "harrows." The context seems to indicate some form of pointed instrument (<a onClick="return mV(\'2Sa\',12,31);">2Sa 12:31</a>; <a onClick="return mV(\'1Ch\',20,3);">1Ch 20:3</a>; see especially the Revised Version margin).``1';
isbe[4124]='Harsha`har\'-sha (charsha\'): Head of one of the families of the Nethinim (<a onClick="return mV(\'Ezr\',2,52);">Ezr 2:52</a>; <a onClick="return mV(\'Neh\',7,54);">Ne 7:54</a>); 1Esdras 5:32, "Charea."``1';
isbe[4125]='Harsith`har\'-sith (charcith): One of the gates of Jerusalem (<a onClick="return mV(\'Jer\',19,2);">Jer 19:2</a> the Revised Version (British and American)); margin suggests "gate of the potsherds"; the King James Version has "east gate" and the King James Version margin "sun gate," both deriving the name from cherec, "sun." The gate opened into the valley of Hinnom.`<a href="./study/isbe/search.html?string=JERUSALEM,+1">JERUSALEM</a>; <!--<a href="./study/isbe/search.html?string=POTSHERD+GATE">POTSHERD</a>-->`1';
isbe[4126]='Hart`hart.`<a href="./study/isbe/search.html?string=DEER">DEER</a>`1';
isbe[4127]='Harum`ha\'-rum, har\'-um (charum): A Judahite (<a onClick="return mV(\'1Ch\',4,8);">1Ch 4:8</a>).``1';
isbe[4128]='Harumaph`ha-roo\'-maf (charumaph): Father of Jedaiah who assisted in repairing the walls of Jerusalem under Nehemiah (<a onClick="return mV(\'Neh\',3,10);">Ne 3:10</a>).``1';
isbe[4129]='Haruphite`ha-roo\'-fit (charuphi, or chariphi); In <a onClick="return mV(\'1Ch\',12,5);">1Ch 12:5</a> Shephatiah, one of the companions of David, is called a Haruphite (K) or Hariphite (Q). If the latter be the correct reading, it is connected with <a href="study/isbe/search.html?string=HARIPH">HARIPH</a> or perhaps <a href="study/isbe/search.html?string=HAREPH">HAREPH</a> (which see).``1';
isbe[4130]='Haruz`ha\'-ruz (charuts): Father of Meshullemeth, the mother of Amon, king of Judah (<a onClick="return mV(\'2Ki\',21,19);">2Ki 21:19</a>).``1';
isbe[4131]='Harvest`har\'-vest (qatsir; therismos): To many of us, harvest time is of little concern, because in our complex life we are far removed from the actual production of our food supplies, but for the Hebrew people, as for those in any agricultural district today, the harvest was a most important season (<a onClick="return mV(\'Gen\',8,22);">Ge 8:22</a>; <a onClick="return mV(\'Gen\',45,6);">45:6</a>). Events were reckoned from harvests (<a onClick="return mV(\'Gen\',30,14);">Ge 30:14</a>; <a onClick="return mV(\'Jos\',3,15);">Jos 3:15</a>; <a onClick="return mV(\'Jdg\',15,1);">Jud 15:1</a>; <a onClick="return mV(\'Rth\',1,22);">Ru 1:22</a>; <a onClick="return mV(\'Rth\',2,23);">2:23</a>; <a onClick="return mV(\'1Sa\',6,13);">1Sa 6:13</a>; <a onClick="return mV(\'2Sa\',21,9);">2Sa 21:9</a>; <a onClick="return mV(\'2Sa\',23,13);">23:13</a>). The three principal feasts of the Jews corresponded to the three harvest seasons (<a onClick="return mV(\'Exd\',23,16);">Ex 23:16</a>; <a onClick="return mV(\'Exd\',34,21,22);">34:21-22</a>);<P>(1) the feast of the Passover in April at the time of the barley harvest (compare <a onClick="return mV(\'Rth\',1,22);">Ru 1:22</a>);<P>(2) the feast of Pentecost (7 weeks later) at the wheat harvest (<a onClick="return mV(\'Exd\',34,22);">Ex 34:22</a>), and<P>(3) the feast of Tabernacles at the end of the year (October) during the fruit harvest.<P>The seasons have not changed since that time. Between the reaping of the barley in April and the wheat in June, most of the other cereals are reaped. The grapes begin to ripen in August, but the gathering in for making wine and molasses (dibs), and the storing of the dried figs and raisins, is at the end of September. Between the barley harvest in April and the wheat harvest, only a few showers fall, which are welcomed because they increase the yield of wheat (compare <a onClick="return mV(\'Amo\',4,7);">Am 4:7</a>). Samuel made use of the unusual occurrence of rain during the wheat harvest to strike fear into the hearts of the people (<a onClick="return mV(\'1Sa\',12,17);">1Sa 12:17</a>). Such an unusual storm of excessive violence visited Syria in 1912, and did much damage to the harvests, bringing fear to the superstitious farmers, who thought some greater disaster awaited them. From the wheat harvest until the fruit harvest no rain falls (<a onClick="return mV(\'2Sa\',21,10);">2Sa 21:10</a>; <a onClick="return mV(\'Jer\',5,24);">Jer 5:24</a>; compare <a onClick="return mV(\'Pro\',26,1);">Pr 26:1</a>). The harvesters long for cool weather during the reaping season (compare <a onClick="return mV(\'Pro\',25,13);">Pr 25:13</a>).<P>Many definite laws were instituted regarding the harvest. Gleaning was forbidden (<a onClick="return mV(\'Lev\',19,9);">Le 19:9</a>; <a onClick="return mV(\'Lev\',23,22);">23:22</a>; <a onClick="return mV(\'Deu\',24,19);">De 24:19</a>) (see <a href="study/isbe/search.html?string=GLEANING">GLEANING</A>). The first-fruits were required to be presented to Yahweh (<a onClick="return mV(\'Lev\',23,10);">Le 23:10</a>). In Syria the Christians still celebrate \'id er-rubb ("feast of the Lord"), at which time the owners of the vineyards bring their first bunches of grapes to the church. The children of Israel were enjoined to reap no harvest for which they had not labored (<a onClick="return mV(\'Lev\',25,5);">Le 25:5</a>). In Proverbs the harvesting of ants is mentioned as a lesson for the sluggard (<a onClick="return mV(\'Pro\',6,8);">Pr 6:8</a>; <a onClick="return mV(\'Pro\',10,5);">10:5</a>; <a onClick="return mV(\'Pro\',20,4);">20:4</a>).<P>Figurative: A destroyed harvest typified devastation or affliction (<a onClick="return mV(\'Job\',5,5);">Job 5:5</a>; <a onClick="return mV(\'Isa\',16,9);">Isa 16:9</a>; <a onClick="return mV(\'Isa\',17,11);">17:11</a>; <a onClick="return mV(\'Jer\',5,17);">Jer 5:17</a>; <a onClick="return mV(\'Jer\',50,16);">50:16</a>). The "time of harvest," in the Old Testament frequently meant the day of destruction (<a onClick="return mV(\'Jer\',51,33);">Jer 51:33</a>; <a onClick="return mV(\'Hsa\',6,11);">Ho 6:11</a>; <a onClick="return mV(\'Joe\',3,13);">Joe 3:13</a>). "Joy in harvest" typified great joy (<a onClick="return mV(\'Isa\',9,3);">Isa 9:3</a>); "harvest of the Nile," an abundant harvest (<a onClick="return mV(\'Isa\',23,3);">Isa 23:3</a>). "The harvest is past" meant that the appointed time was gone (<a onClick="return mV(\'Jer\',8,20);">Jer 8:20</a>). Yahweh chose the most promising time to cut off the wicked, namely, "when there is a cloud of dew in the heat of harvest" (<a onClick="return mV(\'Isa\',18,4,5);">Isa 18:4-5</a>). This occurrence of hot misty days just before the ripening of the grapes is still common. They are welcome because they are supposed to hasten the harvest. The Syrian farmers in some districts call it et-tabbakh el\'ainib wa tin ("the fireplace of the grapes and figs").<P>In the Gospels, Jesus frequently refers to the harvest of souls (<a onClick="return mV(\'Mat\',9,37,38);">Mt 9:37-38</a> bis; <a onClick="return mV(\'Mat\',13,30,39);">Mt 13:30,39</a>; <a onClick="return mV(\'Mar\',4,29);">Mr 4:29</a>; <a onClick="return mV(\'Jhn\',4,35);">Joh 4:35</a>). In explaining the parable of the Tares he said, "The harvest is the end of the world" (<a onClick="return mV(\'Mat\',13,39);">Mt 13:39</a>; compare <a onClick="return mV(\'Rev\',14,15);">Re 14:15</a>).`<a href="./study/isbe/search.html?string=AGRICULTURE">AGRICULTURE</a>`133';
isbe[4132]='Hasadiah`has-a-di\'-a (chacadhyah, "Yah is kind"): A son of Zerubbabel (<a onClick="return mV(\'1Ch\',3,20);">1Ch 3:20</a>). In Baruch 1:1 the Greek is Asadias.``1';
isbe[4133]='Hasenuah`has-e-nu\'-a (haccenu\'ah): In the King James Version (<a onClick="return mV(\'1Ch\',9,7);">1Ch 9:7</a>) for <a href="study/isbe/search.html?string=HASSENUAH">HASSENUAH</a> (which see).``1';
isbe[4134]='Hashabiah`hash-a-bi\'-a (chashabhyah):<P>(1) Two Levites of the family of Merari (<a onClick="return mV(\'1Ch\',6,45);">1Ch 6:45</a>; <a onClick="return mV(\'1Ch\',9,14);">9:14</a>).<P>(2) A Levite who dwelt in Jerusalem at the time of Nehemiah (<a onClick="return mV(\'Neh\',11,15);">Ne 11:15</a>).<P>(3) A son of Jeduthun (<a onClick="return mV(\'1Ch\',25,3);">1Ch 25:3</a>).<P>(4) A Hebronite, chief of a clan of warriors who had charge of West Jordan in the interests of Yahweh and the king of Israel (<a onClick="return mV(\'1Ch\',26,30);">1Ch 26:30</a>).<P>(5) A Levite who was a "ruler" (<a onClick="return mV(\'1Ch\',27,17);">1Ch 27:17</a>).<P>(6) One of the Levite chiefs in the time of Josiah, who gave liberally toward the sacrifices (<a onClick="return mV(\'2Ch\',35,9);">2Ch 35:9</a>). In 1Esdras 1:9 it is "Sabias."<P>(7) A Levite whom Ezra induced to return from exile with him (<a onClick="return mV(\'Ezr\',8,19);">Ezr 8:19</a>). 1Esdras 8:48 has "Asebias."<P>(8) One of the twelve priests set apart by Ezra to take care of the gold, the silver, and the vessels of the temple on their return from exile (<a onClick="return mV(\'Ezr\',8,24);">Ezr 8:24</a>; 1Esdras 8:54, "\'Assamias").<P>(9) Ruler of half of the district of "Keilah," who helped to repair the walls under Nehemiah (<a onClick="return mV(\'Neh\',3,17);">Ne 3:17</a>), and also helped to seal the covenant (<a onClick="return mV(\'Neh\',10,11);">Ne 10:11</a>; <a onClick="return mV(\'Neh\',12,24);">12:24</a>).<P>(10) A Levite (<a onClick="return mV(\'Neh\',11,22);">Ne 11:22</a>).<P>(11) A priest (<a onClick="return mV(\'Neh\',12,21);">Ne 12:21</a>).``146';
isbe[4135]='Hashabnah`ha-shab\'-na (chashabhnah): One who helped to seal the covenant under Nehemiah (<a onClick="return mV(\'Neh\',10,25);">Ne 10:25</a>).``1';
isbe[4136]='Hashabneiah`hash-ab-ne-i\'-a (chashabhneyah; the King James Version Hashabniah, hash-ab-ni\'a).<P>(1) Father of one of the builders of the wall (<a onClick="return mV(\'Neh\',3,10);">Ne 3:10</a>).<P>(2) A Levite mentioned in connection with the prayer preceding the signing of the covenant (<a onClick="return mV(\'Neh\',9,5);">Ne 9:5</a>); possibly identical with the Hashabiah (chashabhyah) of <a onClick="return mV(\'Ezr\',8,19,24);">Ezr 8:19, 24</a>; <a onClick="return mV(\'Neh\',10,11);">Ne 10:11</a>; <a onClick="return mV(\'Neh\',11,22);">11:22</a>; <a onClick="return mV(\'Neh\',12,24);">12:24</a>, or one of these.``1';
isbe[4137]='Hashbadana; Hashbadnana`hash-ba-da\'-na, hash-bad\'-a-na (chashbaddanah): Probably a Levite. He was one of those who stood at Ezra\'s left hand when he read the law, and helped the people to understand the meaning (<a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>). 1Esdras 9:44 has "Nabarias" (Nabareias).``1';
isbe[4138]='Hashem`ha\'-shem (hashem): The "sons of Hashem" are mentioned (<a onClick="return mV(\'1Ch\',11,34);">1Ch 11:34</a>) among David\'s mighty men. The parallel passage (<a onClick="return mV(\'2Sa\',23,32);">2Sa 23:32</a>) has "sons of Jashen."``1';
isbe[4139]='Hashmonah`hash\'-mo-na (chashmonah, "fatness"): A desert camp of the Israelites between Mithkah and Moseroth (<a onClick="return mV(\'Num\',33,29,30);">Nu 33:29-30</a>).`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[4140]='Hashub`ha\'-shub, hash\'-ub.`<a href="./study/isbe/search.html?string=HASSHUB">HASSHUB</a>`1';
isbe[4141]='Hashubah`ha-shoo\'-ba (chashubhah, "consideration"): One of the sons of Zerubbabel (<a onClick="return mV(\'1Ch\',3,20);">1Ch 3:20</a>).``1';
isbe[4142]='Hashum`ha\'-shum (chashum):<P>(1) In <a onClick="return mV(\'Ezr\',2,19);">Ezr 2:19</a>; <a onClick="return mV(\'Neh\',7,22);">Ne 7:22</a>, "children of Hashum" are mentioned among the returning exiles. In <a onClick="return mV(\'Ezr\',10,33);">Ezr 10:33</a> (compare 1Esdras 9:33, "Asom"), members of the same family are named among those who married foreign wives.<P>(2) One of those who stood on Ezra\'s left at the reading of the law (<a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>; 1Esdras 9:44, "Lothasubus"). The signer of the covenant (<a onClick="return mV(\'Neh\',10,18);">Ne 10:18</a>) is possibly the same.``1';
isbe[4143]='Hasidaeans`has-i-de\'-anz (Hasidaioi, a transliteration of chacidhim, "the pious," "Puritans"): A name assumed by the orthodox Jews (1Macc 2:42; 7:13) to distinguish them from the Hellenizing faction described in the Maccabean books as the "impious," the "lawless," the "transgressors." They held perhaps narrow but strict and seriously honest views in religion, and recognized Judas Maccabeus as their leader (2Macc 14:6). They existed as a party before the days of the Maccabees, standing on the ancient ways, caring little for politics, and having small sympathy with merely national aspirations, except when affecting religion (1Macc 1:63; 2Macc 6:18ff; Judith 12:2; Ant, XIV, iv, 3). Their cooperation with Judas went only to the length of securing the right to follow their own religious practices. When Bacchides came against Jerusalem, they were quite willing to make peace because Alcimus, "a priest of the seed of Aaron," was in his company. Him they accepted as high priest, though sixty of them soon fell by his treachery (1Macc 7:13). Their desertion of Judas was largely the cause of his downfall.``79';
isbe[4144]='Hasmoneans``<a href="./study/isbe/search.html?string=ASMONEANS">ASMONEANS</a>`1';
isbe[4145]='Hasrah`haz\'-ra, has\'-ra (chacrah): Grandfather of Shallum, who was the husband of Huldah the prophetess (<a onClick="return mV(\'2Ch\',34,22);">2Ch 34:22</a>). In <a onClick="return mV(\'2Ki\',22,14);">2Ki 22:14</a>, <a href="study/isbe/search.html?string=HARHAS">HARHAS</a> (which see).``1';
isbe[4146]='Hassenaah`has-e-na\'-a (haccena\'ah): In <a onClick="return mV(\'Neh\',3,3);">Ne 3:3</a> the "sons of Hassenaah" are mentioned among the builders of the wall. Probably the same as Senaah (<a onClick="return mV(\'Ezr\',2,35);">Ezr 2:35</a>; <a onClick="return mV(\'Neh\',7,38);">Ne 7:38</a>) with the definite article, i.e. has-Senaah. The latter, from the connection, would appear to be a place-name.`<a href="./study/isbe/search.html?string=HASSENUAH">HASSENUAH</a>`1';
isbe[4147]='Hassenuah`has-e-nu\'-a (haccenu\'ah): A family name in the two lists of Benjamite inhabitants of Jerusalem (<a onClick="return mV(\'1Ch\',9,7);">1Ch 9:7</a>, the King James Version "Hasenuah"; <a onClick="return mV(\'Neh\',11,9);">Ne 11:9</a>, "Senuah"). The name is possibly the same as <a href="study/isbe/search.html?string=HASSENAAH">HASSENAAH</A> (which see), yet the occurrence of the singular ("son of Hassenuah") does not so well accord with the idea of a place-name.``1';
isbe[4148]='Hasshub`hash\'-ub (chashshubh, "considerate"; the King James Version everywhere Hashub except <a onClick="return mV(\'1Ch\',9,14);">1Ch 9:14</a>):<P>(1) A builder of the wall (<a onClick="return mV(\'Neh\',3,11);">Ne 3:11</a>).<P>(2) Another builder of the same name (<a onClick="return mV(\'Neh\',3,23);">Ne 3:23</a>).<P>(3) One of the signers of the covenant (<a onClick="return mV(\'Neh\',10,23);">Ne 10:23</a>).<P>(4) A Levite chief (<a onClick="return mV(\'Neh\',11,15);">Ne 11:15</a>; <a onClick="return mV(\'1Ch\',9,14);">1Ch 9:14</a>). BDB makes (1) and (3) identical``1';
isbe[4149]='Hassophereth`has-o-fe\'-reth.`<a href="./study/isbe/search.html?string=SOPHERETH">SOPHERETH</a>`1';
isbe[4150]='Haste`hast (chaphaz, chush, mahar; speudo): "Haste" (from a root meaning "to pursue") implies "celerity of motion."<P>(1) The noun occurs as translation of mahar, "to hasten," etc. (<a onClick="return mV(\'Exd\',10,16);">Ex 10:16</a>; <a onClick="return mV(\'Exd\',12,33);">12:33</a>, "in haste"); of chapaz, "to make haste" (<a onClick="return mV(\'2Ki\',7,15);">2Ki 7:15</a>; <a onClick="return mV(\'Psa\',31,22);">Ps 31:22</a>; <a onClick="return mV(\'Psa\',116,11);">116:11</a>, "I said in my haste (the Revised Version margin "alarm"), All men are liars"); of chippazon, a "hasty flight" (<a onClick="return mV(\'Exd\',12,11);">Ex 12:11</a>; <a onClick="return mV(\'Deu\',16,3);">De 16:3</a>; <a onClick="return mV(\'Isa\',52,12);">Isa 52:12</a>); of nachats, "to be urgent" (<a onClick="return mV(\'1Sa\',21,8);">1Sa 21:8</a>, "The king\'s business required haste").<P>(2) "Haste" as a verb is transitive and intrans; instances of the transitive use are, \'uts, "to hasten," "press" (<a onClick="return mV(\'Exd\',5,13);">Ex 5:13</a>, "And the taskmasters hasted them," the Revised Version (British and American) "were urgent"); chush, "to make haste" (<a onClick="return mV(\'Isa\',5,19);">Isa 5:19</a>); mahar (<a onClick="return mV(\'2Ch\',24,5);">2Ch 24:5</a> twice); shaqadh, "to watch," "to fix one\'s attention" on anything (<a onClick="return mV(\'Jer\',1,12);">Jer 1:12</a> the King James Version, "I will hasten my word"); mahir, "hasting" (<a onClick="return mV(\'Isa\',16,5);">Isa 16:5</a>, "hasting righteousness," the Revised Version (British and American) "swift to do"). The intransitive use is more frequent and represents many different words.<P>Hasty also occurs in several instances (<a onClick="return mV(\'Pro\',21,5);">Pr 21:5</a>; <a onClick="return mV(\'Pro\',29,20);">29:20</a>, \'uts, etc.); in <a onClick="return mV(\'Isa\',28,4);">Isa 28:4</a>, bikkur, "first-fruit," is translated "hasty fruit," the Revised Version (British and American) "first-ripe fig."<P>The Revised Version (British and American) has "Haste ye" for "assemble yourselves" (<a onClick="return mV(\'Joe\',3,11);">Joe 3:11</a> margin, as the King James Version); "make haste" for "speedily" (<a onClick="return mV(\'Psa\',143,7);">Ps 143:7</a>); "and hasted to catch whether it were his mind" (for <a onClick="return mV(\'1Ki\',20,33);">1Ki 20:33</a> the King James Version); "and it hasteth toward the end," margin (Hebrew) "panteth," for "but at the end it shall speak" (<a onClick="return mV(\'Hab\',2,3);">Hab 2:3</a>); "hastily" for "suddenly" (<a onClick="return mV(\'1Ti\',5,22);">1Ti 5:22</a>); for "and for this I make haste" (<a onClick="return mV(\'Job\',20,2);">Job 20:2</a>), "even by reason of my haste that is in me," margin "and by reason of this my haste is within me"; for "hasten after another god" (<a onClick="return mV(\'Psa\',16,4);">Ps 16:4</a>), the American Standard Revised Version has "that give gifts for another god," the English Revised Version "exchange the Lord for"; for "hasten hereunto" (<a onClick="return mV(\'Ecc\',2,25);">Ec 2:25</a>), "have enjoyment"; for "hasten hither" (<a onClick="return mV(\'1Ki\',22,9);">1Ki 22:9</a>), "fetch quickly"; for "and gather" (<a onClick="return mV(\'Exd\',9,19);">Ex 9:19</a>), "hasten in"; for "hasteneth that he may" (<a onClick="return mV(\'Isa\',51,14);">Isa 51:14</a>), "shall speedily"; for "hasteth to" (<a onClick="return mV(\'Job\',9,26);">Job 9:26</a>), "swoopeth on"; for "and hasteth" (<a onClick="return mV(\'Job\',40,23);">Job 40:23</a>), "he trembleth"; for "hasty" (<a onClick="return mV(\'Dan\',2,15);">Da 2:15</a>), "urgent."``185';
isbe[4151]='Hasupha`ha-sa\'-fa (chasupha\'): Head of a family of Nethinim among the returning exiles (<a onClick="return mV(\'Ezr\',2,43);">Ezr 2:43</a>; <a onClick="return mV(\'Neh\',7,46);">Ne 7:46</a>). <a onClick="return mV(\'Neh\',7,46);">Ne 7:46</a> the King James Version has "Hashupha," and 1Esdras 5:29, "Asipha."``1';
isbe[4152]='Hat`The original word (karbela\', Aramaic) rendered "hat" in <a onClick="return mV(\'Dan\',3,21);">Da 3:21</a> the King James Version is very rare, appearing only here in the Old Testament. There is acknowledged difficulty in translating it, as well as the other words of the passage. "Hat" of the King James Version certainly fails to give its exact meaning. The hat as we know it, i.e. headgear distinguished from the cap or bonnet by a circular brim, was unknown to the ancient East. The nearest thing to the modern hat among the ancients was the petasus worn by the Romans when on a journey, though something like it was used on like occasions by the early Greeks. In the earlier Hebrew writings there is little concerning the headgear worn by the people. In <a onClick="return mV(\'1Ki\',20,31);">1Ki 20:31</a> we find mention of "ropes" upon the head in connection with "sackcloth" on the loins. On Egyptian monuments are found pictures of Syrians likewise with cords tied about their flowing hair. The custom, however, did not survive, or was modified, clearly because the cord alone would afford no protection against the sun, to which peasants and travelers were perilously exposed. It is likely, therefore, that for kindred reasons the later Israelites used a head-covering similar to that of the modern Bedouin. This consists of a rectangular piece of cloth called keffiyeh, which is usually folded into triangular form and placed over the head so as to let the middle part hang down over the back of the neck and protect it from the sun, while the two ends are drawn as needed under the chin and tied, or thrown back over the shoulders. A cord of wool is then used to secure it at the top. It became customary still later for Israelites to use a head-covering more like the "turban" worn by the fella-heen today. It consists in detail of a piece of cotton cloth worked into the form of a cap (takiyeh), and so worn as to protect the other headgear from being soiled by the perspiration. A felt cap, or, as among the Turks, a fez or red tarbush, is worn over this. On the top of these is wound a long piece of cotton cloth with red stripes and fringes, a flowered kerchief, or a striped keffiyeh. This protects the head from the sun, serves as a sort of purse by day, and often as a pillow by night. Some such headgear is probably meant by the "diadem" of <a onClick="return mV(\'Job\',29,14);">Job 29:14</a> and the "hood" of <a onClick="return mV(\'Isa\',3,23);">Isa 3:23</a>, Hebrew tsaniph, from tsanaph, "to roll up like a coil" (compare <a onClick="return mV(\'Isa\',22,18);">Isa 22:18</a>).``47';
isbe[4153]='Hatach`ha\'-tak.`<a href="./study/isbe/search.html?string=HATHACH">HATHACH</a>`1';
isbe[4154]='Hatchet`hach\'-et (kashshil): <a onClick="return mV(\'Psa\',74,6);">Ps 74:6</a> the Revised Version (British and American), "hatchet," the King James Version "axes."`<a href="./study/isbe/search.html?string=AX">AX</a>`1';
isbe[4155]='Hate; Hatred`hat, ha\'-tred (verb, sane\', "oftenest," satam, <a onClick="return mV(\'Gen\',27,41);">Ge 27:41</a>, etc.; noun, sin\'ah; miseo): A feeling of strong antagonism and dislike, generally malevolent and prompting to injury (the opposite of love); sometimes born of moral resentment. Alike in the Old Testament and New Testament, hate of the malevolent sort is unsparingly condemned (<a onClick="return mV(\'Num\',35,20);">Nu 35:20</a>; <a onClick="return mV(\'Psa\',109,5);">Ps 109:5</a>; <a onClick="return mV(\'Pro\',10,12);">Pr 10:12</a>; <a onClick="return mV(\'Tts\',3,3);">Tit 3:3</a>; <a onClick="return mV(\'1Jo\',3,15);">1Joh 3:15</a>), but in the Old Testament hatred of evil and evil-doers, purged of personal malice, is commended (<a onClick="return mV(\'Psa\',97,10);">Ps 97:10</a>; <a onClick="return mV(\'Psa\',101,3);">101:3</a>; <a onClick="return mV(\'Psa\',139,21,22);">139:21-22</a>, etc.). The New Testament law softens this feeling as regards persons, bringing it under the higher law of love (<a onClick="return mV(\'Mat\',5,43,44);">Mt 5:43-44</a>; compare <a onClick="return mV(\'Rom\',12,\'17-21\');">Ro 12:17-21</a>), while intensifying the hatred of evil (<a onClick="return mV(\'Jud\',1,23);">Jude 1:23</a>; <a onClick="return mV(\'Rev\',2,6);">Re 2:6</a>). God himself is hated by the wicked (<a onClick="return mV(\'Exd\',20,5);">Ex 20:5</a>; <a onClick="return mV(\'Psa\',139,21);">Ps 139:21</a>; compare <a onClick="return mV(\'Rom\',8,7);">Ro 8:7</a>). Sometimes, however, the word "hate" is used hyperbolically in a relative sense to express only the strong preference of one to another. God loved Jacob, but hated Esau (<a onClick="return mV(\'Mal\',1,3);">Mal 1:3</a>; <a onClick="return mV(\'Rom\',9,13);">Ro 9:13</a>); father and mother are to be hated in comparison with Christ (<a onClick="return mV(\'Luk\',14,26);">Lu 14:26</a>; compare <a onClick="return mV(\'Mat\',10,37);">Mt 10:37</a>).`<a href="./study/isbe/search.html?string=ENMITY">ENMITY</a>`132';
isbe[4156]='Hathach`ha\'-thak (hathakh; Septuagint Hachrathaios): One of the chamberlains of Ahasuerus, appointed to attend on Esther (<a onClick="return mV(\'Est\',4,5,6,9,10);">Es 4:5-6, 9-10</a>, the King James Version "Hatach"), through whom she learned from Mordecai of Haman\'s plot.``1';
isbe[4157]='Hathath`ha\'-thath (chathath, "terror"): Son of Othniel and grandson of Kenaz (<a onClick="return mV(\'1Ch\',4,13);">1Ch 4:13</a>).``1';
isbe[4158]='Hatipha`ha-ti\'-fa, hat\'-i-fa (chatipha\', "taken," "captive" (?)): The ancestral head of a family of Nethinim that returned from Babylon (<a onClick="return mV(\'Ezr\',2,54);">Ezr 2:54</a>; <a onClick="return mV(\'Neh\',7,56);">Ne 7:56</a> = "Atipha," 1Esdras 5:32).``1';
isbe[4159]='Hatita`ha-ti\'-ta, hat\'-i-ta (chatita\'): Head of a family among the "children of the porters" who returned from exile (<a onClick="return mV(\'Ezr\',2,42);">Ezr 2:42</a>; <a onClick="return mV(\'Neh\',7,45);">Ne 7:45</a>; 1Esdras 5:28, "Ateta").``1';
isbe[4160]='Hatsi-Hammenuchoth`hat-si-ham-en-u\'-koth: A marginal reading in <a onClick="return mV(\'1Ch\',2,52);">1Ch 2:52</a> the King James Version. It disappears in the Revised Version (British and American), which reads in text, "half of the <a href="study/isbe/search.html?string=MENUHOTH">MENUHOTH</A>" (which see) (Hebrew chatsi ha-menuchoth).``1';
isbe[4161]='Hattil`hat\'-il (chattil): A company of servants of Solomon appearing in the post-exilic literature (<a onClick="return mV(\'Ezr\',2,57);">Ezr 2:57</a>; <a onClick="return mV(\'Neh\',7,59);">Ne 7:59</a>). Same called "Agia" in 1Esdras 5:34.``1';
isbe[4162]='Hattush`hat\'-ush (chattush):<P>(1) Son of Shemaiah, a descendant of the kings of Judah, in the 5th generation from Zerubbabel (<a onClick="return mV(\'1Ch\',3,22);">1Ch 3:22</a>). He returned with Zerubbabel and Ezra from Babylon to Jerusalem (<a onClick="return mV(\'Ezr\',8,2);">Ezr 8:2</a>; <a onClick="return mV(\'Neh\',12,2);">Ne 12:2</a>). (There is some doubt as to whether the Hatrush of the lineage of David and the priest of the same name, mentioned in <a onClick="return mV(\'Neh\',10,4);">Ne 10:4</a> and <a onClick="return mV(\'Neh\',12,2);">12:2</A>, are one and the same.) He was one of those who signed the covenant with Nehemiah (<a onClick="return mV(\'Neh\',10,4);">Ne 10:4</a>).<P>(2) Son of Hashabneiah; aided Nehemiah to repair the walls of Jerusalem (<a onClick="return mV(\'Neh\',3,10);">Ne 3:10</a>).``197';
isbe[4163]='Haunt`hont, hant: The verb in Old English was simply "to resort to," "frequent"; a place of dwelling or of business was a haunt. The noun occurs in <a onClick="return mV(\'1Sa\',23,22);">1Sa 23:22</a> as the translation of reghel, "foot," "See his place where his haunt is," the Revised Version margin, Hebrew \'foot\' "; the verb is the translation of yashabh, "to sit down," "to dwell" (<a onClick="return mV(\'Eze\',26,17);">Eze 26:17</a>, "on all that haunt it," the Revised Version (British and American) "dwelt there," margin "inhabited her"), and of halakh, "to go,"\' or "live" (<a onClick="return mV(\'1Sa\',30,31);">1Sa 30:31</a>, "all the places where David himself and his men were wont to haunt").``1';
isbe[4164]='Hauran`ho\'-ran (chawran; Septuagint Auranitis, also with aspirate):<P>1. Extent of Province in Ancient Times:<P>A province of Eastern Palestine which, in <a onClick="return mV(\'Eze\',47,16,18);">Eze 47:16, 18</a>, stretched from Dan in the north to Gilead in the south, including all that lay between the Jordan and the desert. It thus covered the districts now known as el-Jedur, el-Jaulan, and el-Chauran. It corresponded roughly with the jurisdiction of the modern Turkish governor of Hauran. The Auranites of later times answered more closely to the Hauran of today.<P>2. Modern Hauran:<P>The name Chauran probably means "hollow land." Between Jebel ed-Druze (see <a href="study/isbe/search.html?string=BASHAN">BASHAN (MOUNT OF)</a> on the east, and Jedua and Jaulan (see <a href="study/isbe/search.html?string=GOLAN; GAULONITIS">GOLAN</A>) on the west, runs a broad vale, from Jebel el \'Aswad in the north, to the Yarmuk in the southwest, and the open desert in the southeast. It is from 1,500 to 2,000 ft. above sea-level, and almost 50 miles in length, by 45 in breadth. Chauran aptly describes it. To the modern Chauran are reckoned 3 districts, clearly distinguished in local speech:<P>3. En-Nuqrah:<P>(1) En-Nuqrah, "the cavity." This district touches the desert in the southeast, the low range of ez Zumleh on the southwest, Jaulan on the west, el-Leja\' on the north and, Jebel ed-Druze on the east. The soil, composed of volcanic detritus, is extraordinarily rich. Here and there may be found a bank of vines; but the country is practically treeless: the characteristic product is wheat, and in its cultivation the village population is almost wholly occupied.<P>4. El-Leja\':<P>(2) El-Leja\', "the asylum." This is a rocky tract lying to the north of en-Nuqrah. It is entirely volcanic, and takes, roughly, the form of a triangle, with apex in the north at el Burak, and a base of almost 20 miles in the south. For the general characteristics of this district see <a href="study/isbe/search.html?string=TRACHONITIS">TRACHONITIS</a>. Its sharply marked border, where the rocky edges fall into the surrounding plain, have suggested to some the thought that here we have chebhel \'argobh, "the measured lot of Argob." See, however, <a href="study/isbe/search.html?string=ARGOB+(2)">ARGOB</A>. There is little land capable of cultivation, and the Arabs who occupy the greater part have an evil reputation. As a refuge for the hunted and for fugitives from justice it well deserves its name.<P>5. El-Jebel:<P>(3) El-Jebel, "the mountain." This is the great volcanic range which stands on the edge of the desert, protecting the fertile reaches of el-Chauran from encroachment by the sand, known at different times as Mons Asaldamus, Jebel Chauran, and Jebel ed-Druze. This last is the name it bears today in consequence of the settlement of Druzes here, after the massacre in Mt. Lebanon in 1860. Those free-spirited people have been a thorn in the side of the Turks ever since: and whether or not the recent operations against them (January, 1911) will result in their entire, subjugation, remains to be seen. The western slopes of the mountain are well cultivated, and very fruitful; vineyards abound; and there are large reaches of shady woodlands. Calkhad, marking the eastern boundary of the land of Israel, stands on the ridge of the mountain to the south Jebel el-Kuleib in which the range culminates, reaches a height of 5,730 ft. Jebel Chauran is named in the Mishna (Rosh ha-shanah, ii.4) as one of the heights from which fire-signals were flashed, announcing the advent of the new year. For its history see <a href="study/isbe/search.html?string=BASHAN">BASHAN</A>. The ruins which are so plentiful in the country date for the most part from the early Christian centuries; and probably nothing above ground is older than the Roman period. The substructions, however, and the subterranean dwellings found in different parts, e.g. at Der\'ah, may be very ancient. The latest mention of a Christian building is in an inscription found by the present writer at el-Kufr, which tells of the foundation of a church in 720 AD (PEFS, July, 1895, p. 275, Inscr number 150). A good account of Hauran and its cities is given in HGHL, XXIX, 611.``54';
isbe[4165]='Have`hav: "To have" is to own or possess; its various uses may be resolved into this, its proper meaning.<P>A few of the many changes in the Revised Version (British and American) are, for "a man that hath friends" (<a onClick="return mV(\'Pro\',18,24);">Pr 18:24</a>), "maketh many friends," margin (Hebrew) "a man of friends"; for "all that I have" (<a onClick="return mV(\'Luk\',15,31);">Lu 15:31</a>), "all that is mine"; for "we have peace with God" (<a onClick="return mV(\'Rom\',5,1);">Ro 5:1</a>) the English Revised Version has "let us have," margin "some authorities read we have," the American Standard Revised Version as the King James Version margin "many ancient authorities read let us have"; for "what great conflict I have" (<a onClick="return mV(\'Col\',2,1);">Col 2:1</a>), "how greatly I strive"; for "will have" (<a onClick="return mV(\'Mat\',9,13);">Mt 9:13</a>; <a onClick="return mV(\'Mat\',12,7);">12:7</a>), "desire"; <a onClick="return mV(\'Mat\',27,43);">Mt 27:43</a>, "desireth"; for "would have" (<a onClick="return mV(\'Mar\',6,19);">Mr 6:19</a>; <a onClick="return mV(\'Act\',10,10);">Ac 10:10</a>), "desired"; <a onClick="return mV(\'Act\',16,27);">Ac 16:27</a>, "was about"; <a onClick="return mV(\'Act\',19,30);">19:30</A>, "was minded to"; <a onClick="return mV(\'Act\',23,28);">23:28</A> "desiring"; <a onClick="return mV(\'Hbr\',12,17);">Heb 12:17</a>, "desired to"; for "ye have" (<a onClick="return mV(\'Hbr\',10,34);">Heb 10:34</a>), the English Revised Version has "ye yourselves have," margin "ye have your ownselves," the American Standard Revised Version "ye have for yourselves," margin "many ancient authorities read, ye have your own selves for a better possession" (compare <a onClick="return mV(\'Luk\',9,25);">Lu 9:25</a>; <a onClick="return mV(\'Luk\',21,19);">21:19</a>); "having heard" for "after that ye heard" (<a onClick="return mV(\'Eph\',1,13);">Eph 1:13</a>); "having suffered before," for "even after that we had suffered" (<a onClick="return mV(\'1Th\',2,2);">1Th 2:2</a>); "and thus, having," for "so after he had" (<a onClick="return mV(\'Hbr\',6,15);">Heb 6:15</a>).``185';
isbe[4166]='Haven`ha\'-v\'-n<P>(1) choph (<a onClick="return mV(\'Gen\',49,13);">Ge 49:13</a>, the Revised Version margin "beach"; <a onClick="return mV(\'Jdg\',5,17);">Jud 5:17</a>, the Revised Version margin "shore," the King James Version "seashore," the King James Version margin "port"); elsewhere "sea-shore" (<a onClick="return mV(\'Deu\',1,7);">De 1:7</a>; <a onClick="return mV(\'Jos\',9,1);">Jos 9:1</a>; <a onClick="return mV(\'Jer\',47,7);">Jer 47:7</a>) or "sea coast" (<a onClick="return mV(\'Eze\',25,16);">Eze 25:16</a>); from root chaphaph, "to wash" or "to lave"; compare Arabic chaffa, "to rub"; and chaffat, "border"; Chufuf, in Eastern Arabia;<P>(2) machoz (<a onClick="return mV(\'Psa\',107,30);">Ps 107:30</a>);<P>(3) limen (<a onClick="return mV(\'Act\',27,12);">Ac 27:12</a> bis); also Fair Havens, kaloi limenes (<a onClick="return mV(\'Act\',27,8);">Ac 27:8</a>):<P>While the Greek limen is "harbor," the Hebrew Choph is primarily "shore." There is no harbor worthy of the name on the shore of Palestine south of Chaifa. Indeed there is no good natural harbor on the whole coast of Syria and Palestine. The promontories of Carmel, Beirut and Tripolis afford shelter from the prevalent southwest wind, but offer no refuge from the fury of a northern gale. On rocky shores there are inlets which will protect sail boats at most times, but the ships of the ancients were beached in rough weather, and small craft are so treated at the present time. See <!--illustration under--> <a href="study/isbe/search.html?string=BITHYNIA">BITHYNIA</a>. <!--, p. 483.-->``37';
isbe[4167]='Havens, Fair`ha\'-v\'-nz.`<a href="./study/isbe/search.html?string=FAIR+HAVENS">FAIR HAVENS</a>`1';
isbe[4168]='Havilah`hav\'-i-la (chawilah; Heuila):<P>(1) Son of Cush (<a onClick="return mV(\'Gen\',10,7);">Ge 10:7</a>; <a onClick="return mV(\'1Ch\',1,9);">1Ch 1:9</a>).<P>(2) Son of Yoktan, descendant of Shem (<a onClick="return mV(\'Gen\',10,29);">Ge 10:29</a>; <a onClick="return mV(\'1Ch\',1,23);">1Ch 1:23</a>).<P>(3) Mentioned with Shur as one of the limits of the territory of the Ishmaelites (<a onClick="return mV(\'Gen\',25,18);">Ge 25:18</a>); compare the same limits of the land of the Amalekites (<a onClick="return mV(\'1Sa\',15,7);">1Sa 15:7</a>), where, however, the text is doubtful. It is described (<a onClick="return mV(\'Gen\',2,11,12);">Ge 2:11-12</a>) as bounded by the river Pishon and as being rich in gold, bdellium and "shoham-stone" (English Version of the Bible, "onyx"). The shoham-stone was perhaps the Assyrian samtu, probably the malachite or turquoise. The mention of a Cushite Havilah is explained by the fact that the Arabian tribes at an early time migrated to the coast of Africa. The context of <a onClick="return mV(\'Gen\',10,7);">Ge 10:7</a> thus favors situation on the Ethiopian shore, and the name is perhaps preserved in the kolpos Aualites and in the tribe Abalitai on the south side of the straits of Babel-Mandeb. Or possibly a trace of the name appears in the classical Aualis, now Zeila\' in Somaliland. But its occurrence among the Yoktanite Arabs (<a onClick="return mV(\'Gen\',10,29);">Ge 10:29</a>) suggests a location in Arabia. South Arabian inscriptions mention a district of Khaulan (Chaulan), and a place of this name is found both in Tihama and southeast of San\'a\'. Again Strabo\'s Chaulotaioi and Chuwaila in Bahrein point to a district on the Arabian shore of the Persian Gulf. No exact identification has yet been made.``63';
isbe[4169]='Havoc`hav\'-ok: "Devastation," "to make havoc of" is the translation of lumainomai, "to stain," "to disgrace"; in the New Testament "to injure," "destroy" (<a onClick="return mV(\'Act\',8,3);">Ac 8:3</a>, "As for Saul he made havoc of the church," the Revised Version (British and American) "laid waste"; 1Macc 7:7, "what havoc," the Revised Version (British and American) "all the havock," exolothreusis, "utter destruction").<P>The Revised Version has "made havoc of" (portheo) for "destroyed" (<a onClick="return mV(\'Act\',9,21);">Ac 9:21</a>; <a onClick="return mV(\'Gal\',1,23);">Ga 1:23</a>), for "wasted" (<a onClick="return mV(\'Gal\',1,13);">Ga 1:13</a>).``1';
isbe[4170]='Havvah`hav\'-a (chawwah): Hebrew spelling, rendered Eve, "mother of all living," <a onClick="return mV(\'Gen\',3,20);">Ge 3:20</a> the Revised Version margin.`<a href="./study/isbe/search.html?string=EVE">EVE</a>`1';
isbe[4171]='Havvoth-Jair`hav-oth-ja\'-ir (chawwoth ya\'ir "the encampments" or "tent villages of Jair"; the King James Version Havoth-Jair, ha-voth-ja\'ir): The word chawwoth occurs only in this combination (<a onClick="return mV(\'Num\',32,41);">Nu 32:41</a>; <a onClick="return mV(\'Deu\',3,14);">De 3:14</a>; <a onClick="return mV(\'Jdg\',10,4);">Jud 10:4</a>), and is a legacy from the nomadic stage of Hebrew life. Jair had thirty sons who possessed thirty "cities," and these are identified with Havvoth-jair in <a onClick="return mV(\'Jdg\',10,3);">Jud 10:3</a>ff. The district was in Gilead (<a onClick="return mV(\'Jdg\',10,5);">10:5</A>; <a onClick="return mV(\'Num\',32,41);">Nu 32:41</a>). In <a onClick="return mV(\'Deu\',3,13);">De 3:13</a>f; it is identified with Bashan and Argob; but in <a onClick="return mV(\'1Ki\',4,13);">1Ki 4:13</a>, "the towns of Jair" are said to be in Gilead; while to him also "pertained the region of Argob, which is in Bashan, threescore great cities with walls and brazen bars." There is evident confusion here. If we follow <a onClick="return mV(\'Jdg\',10,3);">Jud 10:3</a>ff, we may find a useful clue in <a onClick="return mV(\'Jdg\',10,5);">10:5</A>. Kamon is named as the burial place of Jair. This probably corresponds to Kamun taken by Antiochus III, on his march from Pella to Gephrun (Polyb. v.70, 12). Schumacher (Northern \'Ajlun, 137) found two places to the west of Irbid with the names Qamm and Qumeim (the latter a diminutive of the former) with ancient ruins. Qamm probably represents the Hebrew Qamon, so that Havvoth-jair should most likely be sought in this district, i.e. in North Gilead, between the Jordan Valley and Jebel ez-Zumleh.``54';
isbe[4172]='Hawk`hok (nets; hierax, and glaux; Latin Accipiter nisus): A bird of prey of the genus accipiter. Large hawks were numerous in Palestine. The largest were 2 ft. long, have flat heads, hooked beaks, strong talons and eyes appearing the keenest and most comprehensive of any bird. They can sail the length or breadth of the Holy Land many times a day. It is a fact worth knowing that mist and clouds interfere with the vision of birds and they hide, and hungry and silent wait for fair weather, so you will see them sailing and soaring on clear days only. These large hawks and the glede are of eagle-like nature, nesting on Carmel and on the hills of Galilee, in large trees and on mountain crags. They flock near Beersheba, and live in untold numbers in the wilderness of the Dead Sea. They build a crude nest of sticks and twigs and carry most of the food alive to their young. Of course they were among the birds of prey that swarm over the fresh offal from slaughter and sacrifice. No bird steers with its tail in flight in a more pronounced manner than the hawk. These large birds are all-the-year residents, for which reason no doubt the people distinguished them from smaller families that migrated. They knew the kite that Isaiah mentioned in predicting the fall of Edom. With them the smaller, brighter-colored kestrels, that flocked over the rocky shores of the Dead Sea and over the ruins of deserted cities, seemed to be closest in appearance to the birds we include in the general term "falcon." Their ate mice, insects and small birds, but not carrion. The abomination lists of <a onClick="return mV(\'Lev\',11,16);">Le 11:16</a> and <a onClick="return mV(\'Deu\',14,15);">De 14:15</a> each include hawks in a general term and specify several species as unfit for food. <a onClick="return mV(\'Job\',39,26);">Job 39:26</a> reads:<P class="in15">"Is it by thy wisdom that the hawk soareth,<br>And stretcheth her wings toward the south?"<P>Aside from calling attention to the miraculous flight, this might refer to migration, or to the wonderful soaring exhibitions of these birds.`<a href="./study/isbe/search.html?string=GLEDE">GLEDE</a>; <a href="./study/isbe/search.html?string=KITE">KITE</a>; <a href="./study/isbe/search.html?string=NIGHT+HAWK">NIGHT HAWK</a>; <a href="./study/isbe/search.html?string=FALCON">FALCON</a>`167';
isbe[4173]='Hay`ha.`<a href="./study/isbe/search.html?string=GRASS">GRASS</a>`1';
isbe[4174]='Hazael`ha-za\'-el, ha\'-za-el, haz\'-a-el (chaza\'-el and chazah\'-el; Hazael; Assyrian haza\'ilu):<P>1. In Biblical History:<P>Comes first into Biblical history as a high officer in the service of Ben-hadad II, king of Syria (<a onClick="return mV(\'2Ki\',8,7);">2Ki 8:7</a>ff; compare <a onClick="return mV(\'1Ki\',19,15);">1Ki 19:15</a>ff). He had been sent by his sick sovereign to inquire of the prophet Elisha, who was then in Damascus, whether he should recover of his sickness or not. He took with him a present "even of every good thing of Damascus, forty camels\' burden," and stood before the man of God with his master\'s question of life or death. To it Elisha made the oracular response, "Go, say unto him, Thou shalt surely recover; howbeit Yahweh hath showed me that he shall surely die." Elisha looked steadfastly at Hazael and wept, explaining to the incredulous officer that he was to be the perpetrator of horrible cruelties against the children of Israel: "Their strongholds wilt thou set on fire, and their young men wilt thou slay with the sword, and wilt dash in pieces their little ones, and rip up their women with child" (<a onClick="return mV(\'2Ki\',8,12);">2Ki 8:12</a>). Hazael protested against the very thought of such things, but Elisha assured him that Yahweh had shown him that he was to be king of Syria. No sooner had Hazael delivered to his master the answer of the man of God than the treacherous purpose took shape in his heart to hasten Ben-hadad\'s end, and "He took the coverlet, and dipped it in water, and spread it on his face, so that he died: and Hazael reigned in his stead" (<a onClick="return mV(\'2Ki\',8,15);">2Ki 8:15</a>). The reign which opened under such sinister auspices proved long and successful, and brought the kingdom of Syria to the zenith of its power. Hazael soon found occasion to invade Israel. It was at Ramoth-gilead, which had already been the scene of a fierce conflict between Israel and Syria when Ahab met his d
