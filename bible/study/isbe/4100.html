eath, that Hazael encountered Joram, the king of Israel, with whom his kinsman, Ahaziah, king of Judah, had joined forces to retain that important fortress which had been recovered from the Syrians (<a onClick="return mV(\'2Ki\',9,14,15);">2Ki 9:14-15</a>). The final issue of the battle is not recorded, but Joram received wounds which obliged him to return across the Jordan to Jezreel, leaving the forces of Israel in command of Jehu, whose anointing by Elisha\'s deputy at Ramoth-gilead, usurpation of the throne of Israel, slaughter of Joram, Ahaziah and Jezebel, and vengeance upon the whole house of Ahab are told in rapid and tragic succession by the sacred historian (<a onClick="return mV(\'2Ki\',9,\'1-\');">2Ki 9</a>; <a onClick="return mV(\'2Ki\',10,\'1-\');">10</a>).<P>Whatever was the issue of this attack upon Ramoth-gilead, it was not long before Hazael laid waste the whole country east of the Jordan—"all the land of Gilead, the Gadites, and the Reubenites, and the Manassites, from Aroer, which is by the valley of the Arnon, even Gilead and Bashan" (<a onClick="return mV(\'2Ki\',10,33);">2Ki 10:33</a>; compare <a onClick="return mV(\'Amo\',1,3);">Am 1:3</a>). Nor did Judah escape the heavy hand of the Syrian oppressor. Marching southward through the plain of Esdraelon, and following a route along the maritime plain taken by many conquerors before and since, Hazael fought against Gath and took it, and then "set his face to go up to Jerus" (<a onClick="return mV(\'2Ki\',12,17);">2Ki 12:17</a>). As other kings of Judah had to do with other conquerors, Jehoash, who was now on the throne, bought off the invader with the gold and the treasures of temple and palace, and Hazael withdrew his forces from Jerusalem.<P>Israel, however, still suffered at the hands of Hazael and Ben-hadad, his son, and the sacred historian mentions that Hazael oppressed Israel all the days of Jehoahaz, the son of Jehu. So grievous was the oppression of the Syrians that Hazael "left not to Jehoahaz, of the people save fifty horsemen, and ten chariots, and ten thousand footmen; for the king of Syria destroyed them, and made them like the dust in threshing" (<a onClick="return mV(\'2Ki\',13,\'1-7\');">2Ki 13:1-7</a>). Forty or fifty years later Amos, in the opening of his prophecy, recalled those Syrian campaigns against Israel when he predicted vengeance that was to come upon Damascus. "Thus saith Yahweh...I will send a fire into the house of Hazael, and it shall devour the palaces of Ben-hadad" (<a onClick="return mV(\'Amo\',1,3,4);">Am 1:3-4</a>).<P>2. In the Monuments:<P>Already, however, the power of Syria had passed its meridian and had begun to decline. Events of which there is no express record in the Biblical narrative were proceeding which, ere long, made it possible for the son of Jehoahaz, Joash or Jehoash, to retrieve the honor of Israel and recover the cities that had been lost (<a onClick="return mV(\'2Ki\',13,25);">2Ki 13:25</a>). For the full record of these events we must turn to the Assyrian annals preserved in the monuments. We do read in the sacred history that Yahweh gave Israel "a saviour, so that they went out from under the hand of the Syrians" (<a onClick="return mV(\'2Ki\',13,5);">2Ki 13:5</a>). The annals of the Assyrian kings give us clearly and distinctly the interpretation of this enigmatic saying. The relief that came to Israel was due to the crippling of the power of Syria by the aggression of Assyria upon the lands of the West. From the Black Obelisk in the British Museum, on which Shalmaneser II (860-825 BC) has inscribed the story of the campaign he carried on during his long reign, there are instructive notices of this period of Israelite history. In the 18th year of his reign (842 BC), Shalmaneser made war against Hazael. On the Obelisk the record is short, but a longer account is given on one of the pavement slabs from Nimroud, the ancient Kalab. It is as follows: "In the 18th year of my reign for the 16th time I crossed the Euphrates. Hazael of Damascus trusted to the strength of his armies and mustered his troops in full force. Senir (Hermon), a mountain summit which is in front of Lebanon, he made his stronghold. I fought with him; his defeat I accomplished; 600 of his soldiers with weapons I laid low; 1,121 of his chariots, 470 of his horses, with his camp I took from him. To save his life, he retreated; I pursued him; in Damascus, his royal city, I shut him up. His plantations I cut down. As far as the mountains of the Hauran I marched. Cities without number I wrecked, razed, and burnt with fire. Their spoil beyond count I carried away. As far as the mountains of Baal-Rosh, which is a headland of the sea (at the mouth of the Nahr el-Kelb, Dog River), I marched; my royal likeness I there set up. At that time I received the tribute of the Syrians and Sidonians and of Yahua (Jehu) the son of Khumri (Omri)" (Ball, Light from the East, 166; Schrader, COT, 200f). From this inscription we gather that Shalmaneser did not succeed in the capture of Damascus. But it still remained an object of ambition to Assyria, and Ramman-nirari III, the grandson of Shalmaneser, succeeded in capturing it, and reduced it to subjection. It was this monarch who was "the saviour" whom God raised up to deliver Israel from the hand of Syria. Then it became possible for Israel under Jehoash to recover the cities he had lost, but by this time Hazael had died and Ben-hadad, his son, Ben-hadad III, called Mari on the monuments, had become king in his stead (<a onClick="return mV(\'2Ki\',13,24,25);">2Ki 13:24-25</a>).<P>LITERATURE.<P>Schrader, COT, 197-208; McCurdy, HPM, I, 282ff.``128';
isbe[4175]='Hazaiah`ha-za\'-ya (chazayah, "Jah sees"): Among the inhabitants of Jerusalem mentioned in the list of Judahites in <a onClick="return mV(\'Neh\',11,5);">Ne 11:5</a>.``1';
isbe[4176]='Hazar`ha\'-zar (chatsar, construct of chatser, "an enclosure," "settlement," or "village"): Is frequently the first element in Hebrew place-names.<P>1. Hazar-addar:<P>Hazar-addar (Hebrew chatsar \'addar), a place on the southern boundary of Judah (<a onClick="return mV(\'Num\',34,4);">Nu 34:4</a>), is probably identical with Hazron (<a onClick="return mV(\'Jos\',15,3);">Jos 15:3</a>), which, in this case, however, is separated from Addar (the King James Version "Adar"). It seems to have lain somewhere to the southwest of Kadesh-barnea.<P>2. Hazar-enan:<P>Hazar-enan (Hebrew chatsar \'enan, "village of springs": enan is Aramaic; Once (<a onClick="return mV(\'Eze\',47,17);">Eze 47:17</a>) it is called Enon), a place, unidentified, at the junction of the northern and eastern frontiers of the land promised to Israel (<a onClick="return mV(\'Num\',34,9);">Nu 34:9</a>f; compare <a onClick="return mV(\'Eze\',47,17);">Eze 47:17</a>; <a onClick="return mV(\'Eze\',48,1);">48:1</a>). To identify it with the sources of the Orontes seems to leave too great a gap between this and the places named to the south. Buhl (GAP, 66f) would draw the northern boundary from Nahr el-Qasimiyeh to the foot of Hermon, and would locate Hazar-enan at Banias. The springs there lend fitness to the name; a condition absent from el-Chadr, farther east, suggested by von Kesteren. But there is no certainty.<P>3. Hazar-gaddah:<P>Hazar-gaddah (Hebrew hatsar-gaddah), a place in the territory of Judah "toward the border of Edom in the south" (<a onClick="return mV(\'Jos\',15,21,27);">Jos 15:21, 27</a>). Eusebius, Onomasticon (s.v. "Gadda") places it in the uttermost parts of the Daroma, overlooking the Dead Sea. This might point to the site of Masada, or to the remarkable ruins of Umm Bajjaq farther south (GAP, 185).<P>4. Hazar-hatticon:<P>Hazar-hatticon (the Revised Version (British and American) <a href="study/isbe/search.html?string=HAZER">HAZER-HATTICON</A>; Hebrew chatser ha-tikhon, "the middle village"), a place named on the ideal border of Israel (<a onClick="return mV(\'Eze\',47,16);">Eze 47:16</a>). The context shows that it is identical with Hazar-enan, for which this is apparently another name. Possibly, however, it is due to a scribal error.<p>5. Hazarmaveth:<P>Hazarmaveth (Hebrew chatsarmaweth), the name of a son of Joktan attached to a clan or district in Southern Arabia (<a onClick="return mV(\'Gen\',10,26);">Ge 10:26</a>; <a onClick="return mV(\'1Ch\',1,20);">1Ch 1:20</a>). It is represented by the modern Chadramaut, a broad and fruitful valley running nearly parallel with the coast for about 100 miles, north of el-Yemen. The ruins and inscriptions found by Glaser show that it was once the home of a great civilization, the capital being Sabata (<a onClick="return mV(\'Gen\',10,7);">Ge 10:7</a>) (Glaser, Skizze, II,20,423ff).<P>6. Hazar-shual:<P>Hazar-Shual (Hebrew chatsar shu\'al), a place in the south of Judah (<a onClick="return mV(\'Jos\',15,28);">Jos 15:28</a>) assigned to Simeon (<a onClick="return mV(\'Jos\',19,3);">Jos 19:3</a>; <a onClick="return mV(\'1Ch\',4,28);">1Ch 4:28</a>). It was reoccupied after the exile (<a onClick="return mV(\'Neh\',11,27);">Ne 11:27</a>). Sa\'weh on a hill east of Beersheba has been suggested; but there is no certainty.<P>7. Hazar-susah:<P>Hazar-susah (Hebrew chatsar cucah, <a onClick="return mV(\'Jos\',19,5);">Jos 19:5</a>), Hazar-susim (Hebrew chatsar cucim, <a onClick="return mV(\'1Ch\',4,31);">1Ch 4:31</a>). As it stands, the name means "station of a mare" or "of horses," and it occurs along with Beth-marcaboth, "place of chariots," which might suggest depots for trade in chariots and horses. The sites have not been identified.``54';
isbe[4177]='Hazazon-Tamar`haz\'-a-zan-ta\'-mar (chatsatson tamar; the King James Version Hazezon Tamar): "Hazazon of the palm trees," mentioned (<a onClick="return mV(\'Gen\',14,7);">Ge 14:7</a>) as a place of the Amorites, conquered, together with En-mishpat and the country of the Amalekites, by Chedorlaomer; in <a onClick="return mV(\'2Ch\',20,2);">2Ch 20:2</a> it is identified with EN-GEDI (which see); and if so, it must have been its older name. If this identification be accepted, then Hazazon may survive in the name Wady Husasah, northwest of \'Ain Jidy. Another suggestion, which certainly meets the needs of the narrative better, is that Hazazon-tamar is the Thamara of Eusebius, Onomasticon (85 3; 210 86), the Thamaro, of Ptol. xvi.3. The ruin Kurnub, 20 miles west-southwest of the south end of the Dead Sea—on the road from Hebron to Elath—is supposed to mark this site.``117';
isbe[4178]='Hazel`ha\'-z\'-l (<a onClick="return mV(\'Gen\',30,37);">Ge 30:37</a> the King James Version).`<a href="./study/isbe/search.html?string=ALMOND">ALMOND</a>`1';
isbe[4179]='Hazelelponi`haz-el-el-po\'-ni.`<a href="./study/isbe/search.html?string=HAZZELELPONI">HAZZELELPONI</a>`1';
isbe[4180]='Hazer-Hatticon; Hazarhatticon`ha\'-zer-hat\'-i-kon.`<a href="./study/isbe/search.html?string=HAZAR">HAZAR</a>`1';
isbe[4181]='Hazerim`ha-ze\'-rim, haz\'-er-im (chatserim): Is rendered in the King James Version (<a onClick="return mV(\'Deu\',2,23);">De 2:23</a>) as the name of a place in the southwest of Palestine, in which dwelt the Avvim, ancient inhabitants of the land. The word means "villages," and ought to be translated as in the Revised Version (British and American). The sentence means that the Avvim dwelt in villages—not in fortified towns—before the coming of the Caphtorim, the Philistines, who destroyed them.``1';
isbe[4182]='Hazeroth`ha-ze\'-roth, haz\'-er-oth (chatseroth, "enclosures"): A camp of the Israelites, the 3rd from Sinai (<a onClick="return mV(\'Num\',11,35);">Nu 11:35</a>; <a onClick="return mV(\'Num\',12,16);">12:16</a>; <a onClick="return mV(\'Num\',33,17);">33:17</a>; <a onClick="return mV(\'Deu\',1,1);">De 1:1</a>). It is identified with \'Ain Chadrah ("spring of the enclosure"), 30 miles northeast of Jebel Musa, on the way to the \'Arabah.`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[4183]='Hazezon-Tamar`haz\'-e-zon-ta\'-mar chatsatson tamar, <a onClick="return mV(\'Gen\',14,7);">Ge 14:7</a> the King James Version; chatstson tamar, <a onClick="return mV(\'2Ch\',20,2);">2Ch 20:2</a>).`<a href="./study/isbe/search.html?string=HAZAZON-TAMAR">HAZAZON-TAMAR</a>`1';
isbe[4184]='Haziel`ha\'-zi-el (chazi\'el, "God sees"): A Levite of the sons of Shimei, of David\'s time (<a onClick="return mV(\'1Ch\',23,9);">1Ch 23:9</a>).``1';
isbe[4185]='Hazo`ha\'-zo (chazo, fifth son of Nahor (<a onClick="return mV(\'Gen\',22,22);">Ge 22:22</a>)): Possibly the eponym of a Nahorite family or clan.``1';
isbe[4186]='Hazor`ha\'-zor (chatsor; Nasor; Codex Sinaiticus, Asor, 1Macc 11:67):<P>(1) The royal city of Jabin (<a onClick="return mV(\'Jos\',11,1);">Jos 11:1</a>), which, before the Israelite conquest, seems to have been the seat of a wide authority (<a onClick="return mV(\'Jos\',11,11);">Jos 11:11</a>). It was taken by Joshua, who exterminated the inhabitants, and it was the only city in that region which he destroyed by fire (<a onClick="return mV(\'Jos\',11,\'11-13\');">11:11-13</A>). At a later time the Jabin Dynasty appears to have recovered power and restored the city (<a onClick="return mV(\'Jdg\',4,2);">Jud 4:2</a>). The heavy defeat of their army at the hands of Deborah and Barak led to their final downfall (<a onClick="return mV(\'Jdg\',4,23);">Jud 4:23</a>). It was in the territory allotted to Naphtali (<a onClick="return mV(\'Jos\',19,36);">Jos 19:36</a>). Hazor was one of the cities for the fortification of which Solomon raised a levy (<a onClick="return mV(\'1Ki\',9,15);">1Ki 9:15</a>). Along with other cities in Galilee, it was taken by Tiglathpileser III (<a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>). In the plain of Hazor, Jonathan the Maccabee gained a great victory over Demetrius (1Macc 11:67ff). In Tobit 12 it is called "Asher" Septuagint Aser), and Kedesh is said to be "above" it. Josephus (Ant., V, v, 1) says that Hazor was situated over the lake, Semechonitis, which he evidently identifies with the Waters of Merom (<a onClick="return mV(\'Jos\',11,13);">Jos 11:13</a>). It must clearly be sought on the heights west of el-Chuleh. Several identifications have been suggested, but no certain conclusion can be reached. Some (Wilson and Guerin) favor Tell Harreh to the southeast of Qedes, where there are extensive ruins. Robinson thought of Tell Khureibeh, 2 1/2 miles south of Qedes, where, however, there are no ruins. We may take it as certain that the ancient name of Hazor is preserved in Merj el-Chadireh, southwest of Qedes, and north of Wady \'Uba, and in Jebel Chadireh, east of the Merj, although it has evidently drifted from the original site, as names have so often done in Palestine. Conder suggests a possible identification with Chazzur, farther south, "at the foot of the chain of Upper Galilee...in position more appropriate to the use of the chariots that belonged to the king of Hazor" (HDB, under the word).<P>(2) A town, unidentified, in the south of Judah (<a onClick="return mV(\'Jos\',15,23);">Jos 15:23</a>).<P>(3) A town in the south of Judah (<a onClick="return mV(\'Jos\',15,25);">Jos 15:25</a>).<P>(4) A town in Benjamin (<a onClick="return mV(\'Neh\',11,33);">Ne 11:33</a>) now represented by Khirbet Chazzar, not far to the east of Neby Samwil.<P>(5) An unidentified place in Arabia, smitten by Nebuchadnezzar (<a onClick="return mV(\'Jer\',49,28,33);">Jer 49:28, 33</a>).`<a href="./study/isbe/search.html?string=KERIOTH-HEZRON">KERIOTH-HEZRON</a>`54';
isbe[4187]='Hazor-Hadattah`ha\'-zor-ha-dat\'-a (Aramaic chatsor chadhattah, "New Hazor"): "An Aramaic adjective, however, in this region is so strange that the reading must be questioned" (Di). One of the "uttermost cities...of Judah toward the border of Edom" (<a onClick="return mV(\'Jos\',15,25);">Jos 15:25</a>). Eusebius and Jerome describe a "New Hazor" to the east of Ascalon, but this is too far north.``1';
isbe[4188]='Hazzelelponi`haz-e-lel-po\'-ni (hatstselelponi): A feminine name occurring in the list of the genealogy of Judah (<a onClick="return mV(\'1Ch\',4,3);">1Ch 4:3</a>); probably representing a clan.``1';
isbe[4189]='He`ha: The fifth letter of the Hebrew alphabet; transliterated in this Encyclopedia as "h." It came also to be used for the no. 5</a>. For name, etc.,`<a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>`1';
isbe[4190]='Head`hed (ro\'-sh, Aramaic re\'sh, and in special sense gulgoleth, literally, "skull," "cut-off head" (<a onClick="return mV(\'1Ch\',10,10);">1Ch 10:10</a>), whence Golgotha (<a onClick="return mV(\'Mat\',27,33);">Mt 27:33</a>; <a onClick="return mV(\'Mar\',15,22);">Mr 15:22</a>; <a onClick="return mV(\'Jhn\',19,17);">Joh 19:17</a>); mera\'ashah, literally, "head-rest," "pillow," "bolster" (<a onClick="return mV(\'1Ki\',19,6);">1Ki 19:6</a>); qodhqodh, literally, crown of the head (<a onClick="return mV(\'Deu\',28,35);">De 28:35</a>; <a onClick="return mV(\'Deu\',33,16,20);">33:16, 20</a>; <a onClick="return mV(\'2Sa\',14,25);">2Sa 14:25</a>; <a onClick="return mV(\'Isa\',3,17);">Isa 3:17</a>; <a onClick="return mV(\'Jer\',48,45);">Jer 48:45</a>); barzel, "the head of an axe" (<a onClick="return mV(\'Deu\',19,5);">De 19:5</a>, the Revised Version margin "iron"; <a onClick="return mV(\'2Ki\',6,5);">2Ki 6:5</a>); lehabhah, lahebheth, "the head of a spear" (<a onClick="return mV(\'1Sa\',17,7);">1Sa 17:7</a>); kephale): The first-mentioned Hebrew word and its Aramaic form are found frequently in their literal as well as metaphorical sense. We may distinguish the following meanings:<P>1. Used of Men:<P>By a slight extension of meaning, "head" occasionally stands for the person itself. This is the case in all passages where evil is said to return or to be requited upon the head of a person (see below).<P>2. Used of Animals:<P>The word is also used in connection with the serpent\'s head (<a onClick="return mV(\'Gen\',3,15);">Ge 3:15</a>), the head of the sacrificial ram, bullock and goat (<a onClick="return mV(\'Exd\',29,10,15,19);">Ex 29:10, 15, 19</a>; <a onClick="return mV(\'Lev\',4,4,24);">Le 4:4, 24</a>), the head of leviathan (<a onClick="return mV(\'Job\',41,7);">Job 41:7, (Hebrew 40:31)</a>).<P>3. The Head-Piece:<P>It is used also as representing the top or summit of a thing, as the capital of column or pillar (<a onClick="return mV(\'Exd\',36,38);">Ex 36:38</a>; <a onClick="return mV(\'Exd\',38,28);">38:28</a>; <a onClick="return mV(\'2Ch\',3,15);">2Ch 3:15</a>); of mountains (<a onClick="return mV(\'Exd\',19,20);">Ex 19:20</a>; <a onClick="return mV(\'Num\',21,20);">Nu 21:20</a>; <a onClick="return mV(\'Jdg\',9,7);">Jud 9:7</a>; <a onClick="return mV(\'Amo\',1,2);">Am 1:2</a>; <a onClick="return mV(\'Amo\',9,3);">9:3</a>); of a scepter (<a onClick="return mV(\'Est\',5,2);">Es 5:2</a>); of a ladder (<a onClick="return mV(\'Gen\',28,12);">Ge 28:12</a>); of a tower (<a onClick="return mV(\'Gen\',11,4);">Ge 11:4</a>).<P>4. Beginning, Source, Origin:<P>As a fourth meaning the word occurs (<a onClick="return mV(\'Pro\',8,23);">Pr 8:23</a>; <a onClick="return mV(\'Ecc\',3,11);">Ec 3:11</a>; <a onClick="return mV(\'Isa\',41,4);">Isa 41:4</a>) in the sense of beginning of months (<a onClick="return mV(\'Exd\',12,2);">Ex 12:2</a>), of rivers (<a onClick="return mV(\'Gen\',2,10);">Ge 2:10</a>), of streets or roads (<a onClick="return mV(\'Isa\',51,20);">Isa 51:20</a>; <a onClick="return mV(\'Eze\',16,25);">Eze 16:25</a>; <a onClick="return mV(\'Eze\',21,21);">21:21</a>).<P>As a leader, prince, chief, chieftain, captain (or as an adjective, with the meaning of foremost, uppermost), originally: "he that stands at the head"; compare "God is with us at our head" (<a onClick="return mV(\'2Ch\',13,12);">2Ch 13:12</a>); "Knowest thou that Yahweh will take away thy master from thy head?" (<a onClick="return mV(\'2Ki\',2,3);">2Ki 2:3</a>); "head-stone" the Revised Version (British and American) "top stone," i.e. the upper-most stone (<a onClick="return mV(\'Zec\',4,7);">Zec 4:7</a>).<P>5. Leader, Prince:<P>Israel is called the head of nations (<a onClick="return mV(\'Deu\',28,13);">De 28:13</a>); "The head (capital) of Syria is Damascus, and the head (prince) of Damascus is Rezin" (<a onClick="return mV(\'Isa\',7,8);">Isa 7:8</a>); "heads of their fathers\' houses," i.e. elders of the clans (<a onClick="return mV(\'Exd\',6,14);">Ex 6:14</a>); compare "heads of tribes" (<a onClick="return mV(\'Deu\',1,15);">De 1:15</a>), also "captain," literally, head (<a onClick="return mV(\'Num\',14,4);">Nu 14:4</a>; <a onClick="return mV(\'Deu\',1,15);">De 1:15</a>; <a onClick="return mV(\'1Ch\',11,42);">1Ch 11:42</a>; <a onClick="return mV(\'Neh\',9,17);">Ne 9:17</a>). The phrase "head and tail" (<a onClick="return mV(\'Isa\',9,14);">Isa 9:14</a>; <a onClick="return mV(\'Isa\',19,15);">19:15</a>) is explained by the rabbis as meaning the nobles and the commons among the people; compare "palm-branch and rush" (<a onClick="return mV(\'Isa\',9,14);">Isa 9:14</a>), "hair of the feet...and beard" (<a onClick="return mV(\'Isa\',7,20);">Isa 7:20</a>), but compare also <a onClick="return mV(\'Isa\',9,15);">Isa 9:15</a>. In the New Testament we find the remarkable statement of Christ being "the head of the church" (<a onClick="return mV(\'Eph\',1,22);">Eph 1:22</a>; <a onClick="return mV(\'Eph\',5,23);">5:23</a>), "head of every man" (<a onClick="return mV(\'1Cr\',11,3);">1Co 11:3</a>), "head of all principality and power" (<a onClick="return mV(\'Col\',2,10);">Col 2:10</a>), "head of the body, the church" (<a onClick="return mV(\'Col\',1,18);">Col 1:18</a>; compare <a onClick="return mV(\'Eph\',4,15);">Eph 4:15</a>). The context of <a onClick="return mV(\'1Cr\',11,3);">1Co 11:3</a> is very instructive to a true understanding of this expression: "I would have you know, that the head of every man is Christ; and the head of the woman is the man; and the head of Christ is God" (compare <a onClick="return mV(\'Eph\',5,23);">Eph 5:23</a>). Here, clearly, reference is had to the lordship of Christ over His church, not to the oneness of Christ and His church, while in <a onClick="return mV(\'Eph\',4,16);">Eph 4:16</a> the dependence of the church upon Christ is spoken of. These passages should not therefore be pressed to include the idea of Christ being the intellectual center, the brain of His people, from whence the members are passively governed, for to the Jewish mind the heart was the seat of the intellect, not the head.<P>See <a href="study/isbe/search.html?string=HEART">HEART</a>.<P>6. Various Uses:<P>As the head is the most essential part of physical man, calamity and blessing are said to come upon the head of a person (<a onClick="return mV(\'Gen\',49,26);">Ge 49:26</a>; <a onClick="return mV(\'Deu\',33,16);">De 33:16</a>; <a onClick="return mV(\'Jdg\',9,57);">Jud 9:57</a>; <a onClick="return mV(\'1Sa\',25,39);">1Sa 25:39</a>; <a onClick="return mV(\'2Ch\',6,23);">2Ch 6:23</a>; <a onClick="return mV(\'Eze\',9,10);">Eze 9:10</a>; <a onClick="return mV(\'Eze\',11,21);">11:21</a>; <a onClick="return mV(\'Eze\',16,43);">16:43</a>; <a onClick="return mV(\'Eze\',22,31);">22:31</a>). For this reason hands are placed upon the head of a person on which blessings are being invoked (<a onClick="return mV(\'Gen\',48,14,17,18);">Ge 48:14, 17-18</a>; <a onClick="return mV(\'Mat\',19,15);">Mt 19:15</a>) and upon the sacrificial animal upon which sins are laid (<a onClick="return mV(\'Exd\',29,15);">Ex 29:15</a>; <a onClick="return mV(\'Lev\',1,4);">Le 1:4</a>; <a onClick="return mV(\'Lev\',4,29,33);">4:29, 33</a>). Responsibility for a deed is also said to rest on the head of the doer (<a onClick="return mV(\'2Sa\',1,16);">2Sa 1:16</a>; <a onClick="return mV(\'2Sa\',3,29);">3:29</a>; <a onClick="return mV(\'1Ki\',8,32);">1Ki 8:32</a>; <a onClick="return mV(\'Psa\',7,16);">Ps 7:16</a>; <a onClick="return mV(\'Act\',18,6);">Ac 18:6</a>). The Bible teaches us to return good for evil (<a onClick="return mV(\'Mat\',5,44);">Mt 5:44</a>), or in the very idiomatic Hebrew style, to "heap coals of fire upon (the) head" of the adversary (<a onClick="return mV(\'Pro\',25,22);">Pr 25:22</a>; <a onClick="return mV(\'Rom\',12,20);">Ro 12:20</a>). This phrase is dark as to its origin, but quite clear as to its meaning and application (compare <a onClick="return mV(\'Rom\',12,17,19,21);">Ro 12:17, 19, 21</a>). The Jew was inclined to swear by his head (<a onClick="return mV(\'Mat\',5,36);">Mt 5:36</a>), as the modern Oriental swears by his beard. The head is said to be under a vow (<a onClick="return mV(\'Num\',6,18,19);">Nu 6:18-19</a>; <a onClick="return mV(\'Act\',18,18);">Ac 18:18</a>; <a onClick="return mV(\'Act\',21,23);">21:23</a>), because the Nazirite vow could readily be recognized by the head.<P>There are numerous idiomatic expressions connected with the head, of which we enumerate the following: "the hoary head" designates old age (see <a href="study/isbe/search.html?string=HAIR">HAIR</A>); "to round the corners of the head," etc. (<a onClick="return mV(\'Lev\',19,27);">Le 19:27</a>; compare also <a onClick="return mV(\'Deu\',14,1);">De 14:1</a>; <a onClick="return mV(\'Amo\',8,10);">Am 8:10</a>), probably refers to the shaving of the side locks or the whole scalp among heathen nations, which was often done in idolatrous shrines or in token of initiation into the service of an idol. It was therefore forbidden to Israel, and its rigid observance gave rise to the peculiar Jewish custom of wearing long side locks (see <a href="study/isbe/search.html?string=HAIR">HAIR</a>). "Anointing the head" (<a onClick="return mV(\'Psa\',23,5);">Ps 23:5</a>; <a onClick="return mV(\'Psa\',92,10);">92:10</a>; <a onClick="return mV(\'Hbr\',1,9);">Heb 1:9</a>) was a sign of joy and hospitality, while the "covering of the head" (<a onClick="return mV(\'2Sa\',15,30);">2Sa 15:30</a>; <a onClick="return mV(\'Est\',6,12);">Es 6:12</a>; <a onClick="return mV(\'Jer\',14,3);">Jer 14:3</a>), "putting the hand upon the head" (<a onClick="return mV(\'2Sa\',13,19);">2Sa 13:19</a>) and putting earth, dust or ashes upon it (<a onClick="return mV(\'Jos\',7,6);">Jos 7:6</a>; <a onClick="return mV(\'1Sa\',4,12);">1Sa 4:12</a>; <a onClick="return mV(\'2Sa\',12,\'1-\');">2Sa 12</a>; <a onClick="return mV(\'2Sa\',13,19);">13:19</a>; <a onClick="return mV(\'Lam\',2,10);">La 2:10</a>; compare <a onClick="return mV(\'Amo\',2,7);">Am 2:7</a>) were expressive of sadness, grief, deep shame and mourning. In <a onClick="return mV(\'Est\',7,8);">Es 7:8</a> Haman\'s face is covered as a condemned criminal, or as one who has been utterly put to shame, and who has nothing more to say for his life.<P>In this connection the Pauline injunction as to the veiling of women in the public gatherings of the Christians (<a onClick="return mV(\'1Cr\',11,5);">1Co 11:5</a>), while men were instructed to appear bareheaded, must be mentioned. This is diametrically opposed to the Jewish custom, according to which men wore the head covered by the Tallith or prayer shawl, while women were considered sufficiently covered by their long hair (<a onClick="return mV(\'1Cr\',11,15);">1Co 11:15</a>). The apostle here simply commends a Greek custom for the congregation residing among Greek populations; in other words, he recommends obedience to local standards of decency and good order.<P>"To bruise the head" (<a onClick="return mV(\'Gen\',3,15);">Ge 3:15</a>) means to injure gravely; "to smite through the head" (<a onClick="return mV(\'Psa\',68,21);">Ps 68:21</a>) is synonymous with complete destruction. "To shake or wag the head" (<a onClick="return mV(\'Psa\',22,7);">Ps 22:7</a>; <a onClick="return mV(\'Psa\',44,14);">44:14</a>; <a onClick="return mV(\'Psa\',64,8);">64:8</a>; <a onClick="return mV(\'Jer\',18,16);">Jer 18:16</a>; <a onClick="return mV(\'Jer\',48,27);">48:27</a>; <a onClick="return mV(\'Lam\',2,15);">La 2:15</a>; <a onClick="return mV(\'Mat\',27,39);">Mt 27:39</a>; <a onClick="return mV(\'Mar\',15,29);">Mr 15:29</a>) conveys the meaning of open derision and contempt. "To bow down the head" (<a onClick="return mV(\'Isa\',58,5);">Isa 58:5</a>) indicates humility, sadness and mourning, but it may also be a mere pretense for piety. (Sirach 19:26).``106';

isbe[4196]='Heady`hed\'i: The translation in the King James Version of propetes, "falling forward," trop. "prone," "ready to do anything," "precipitate," "headlong" (<a onClick="return mV(\'2Ti\',3,4);">2Ti 3:4</a>, "heady, high-minded," etc., the Revised Version (British and American) "headstrong"; in <a onClick="return mV(\'Act\',19,36);">Ac 19:36</a>, the only other place in the New Testament where propetes occurs, the King James Version has "rashly," the Revised Version (British and American) "rash"). "Headstrong signifies strong in the head or the mind, and heady, full of one\'s own head" (Crabb, English Synonyms). "Heady confidence promises victory without contest" (Johnson).``1';
isbe[4197]='Heal`hel (rapha\'; therapeuo, iaomai, diasozo): The English word is connected with the Anglo-Saxon hoelan, and is used in several senses:<P>(1) Lit., in its meaning of making whole or well, as in <a onClick="return mV(\'Ecc\',3,3);">Ec 3:3</a>. In this way it occurs in prayers for restoration to health (<a onClick="return mV(\'Num\',12,13);">Nu 12:13</a>; <a onClick="return mV(\'Psa\',6,2);">Ps 6:2</a>; <a onClick="return mV(\'Jer\',17,14);">Jer 17:14</a>); and also in declarations as to God\'s power to restore to health (<a onClick="return mV(\'Deu\',32,39);">De 32:39</a>; <a onClick="return mV(\'2Ki\',20,\'5-8\');">2Ki 20:5-8</a>).<P>(2) Metaphorically it is applied to the restoration of the soul to spiritual health and to the repair of the injuries caused by sin (<a onClick="return mV(\'Psa\',41,4);">Ps 41:4</a>; <a onClick="return mV(\'Jer\',30,17);">Jer 30:17</a>).<P>(3) The restoration and deliverance of the afflicted land is expressed by it in <a onClick="return mV(\'2Ch\',7,14);">2Ch 7:14</a>; <a onClick="return mV(\'Isa\',19,22);">Isa 19:22</a>.<P>(4) It is applied to the forgiveness of sin (<a onClick="return mV(\'Jer\',3,22);">Jer 3:22</a>).<P>In the New Testament, therapeuo is used 10 times in describing our Lord\'s miracles, and is translated "heal." Iaomai is used to express spiritual healing (<a onClick="return mV(\'Mat\',13,15);">Mt 13:15</a>; <a onClick="return mV(\'Luk\',5,17);">Lu 5:17</a>; <a onClick="return mV(\'Jhn\',12,40);">Joh 12:40</a>), and also of curing bodily disease (<a onClick="return mV(\'Jhn\',4,47);">Joh 4:47</a>). Diasozo, meaning "to heal thoroughly," is used in <a onClick="return mV(\'Luk\',7,3);">Lu 7:3</a> the King James Version where the Revised Version (British and American) renders it "save." The act of healing is called iasis twice, in <a onClick="return mV(\'Act\',4,22,30);">Ac 4:22, 30</a>; sozo, to save or deliver, is translated "made whole" by the Revised Version (British and American) in <a onClick="return mV(\'Mar\',5,23);">Mr 5:23</a>; <a onClick="return mV(\'Luk\',8,36);">Lu 8:36</a>; <a onClick="return mV(\'Act\',14,9);">Ac 14:9</a>, but is "healed" in the King James Version. Conversely "made whole" the King James Version in <a onClick="return mV(\'Mat\',15,28);">Mt 15:28</a> is replaced by "healed" in the Revised Version (British and American).<P>Healed is used 33 times in the Old Testament as the rendering of the same Hebrew word, and in the same variety of senses. It is also used of purification for an offense or breach of the ceremonial law (<a onClick="return mV(\'2Ch\',30,20);">2Ch 30:20</a>); and to express the purification of water which had caused disease (<a onClick="return mV(\'2Ki\',2,21,22);">2Ki 2:21-22</a>). Figuratively, the expression "healed slightly" (the English Revised Version "lightly") is used to describe the futile efforts of the false prophets and priests to remedy the backsliding of Israel (<a onClick="return mV(\'Jer\',6,14);">Jer 6:14</a>; <a onClick="return mV(\'Jer\',8,11);">8:11</a>); here the word for "slightly" is the contemptuous term, qalal, which means despicably or insignificantly. In <a onClick="return mV(\'Eze\',30,21);">Eze 30:21</a>, the word "healed" is the rendering of the feminine passive participle, rephu\'ah and is better translated in the Revised Version (British and American) "apply healing medicines." In the New Testament "healed" usually occurs in connection with the miracles of our Lord and the apostles. Here it is worthy of note that Luke more frequently uses the verb iaomai than therapeuo, in the proportion of 17 to 4, while in Matthew and Mark the proportion <span class="noTag">is</span> 4 to 8.<P>Healer (chabhash) occurs once in <a onClick="return mV(\'Isa\',3,7);">Isa 3:7</a>; the word literally means a "wrapper up" or "bandager."``107';
isbe[4198]='Healing`hel\'-ing (marpe\', te\'alah, kehah): In the Old Testament this word is always used in its figurative sense; marpe\', which literally means "a cure," is used in <a onClick="return mV(\'Jer\',14,19);">Jer 14:19</a> twice, and in <a onClick="return mV(\'Mal\',4,2);">Mal 4:2</a>; te\'alah, which literally means "an irrigation canal," here means something applied externally, as a plaster, in which sense it is used metaphorically in <a onClick="return mV(\'Jer\',30,13);">Jer 30:13</a>; kehah occurs only in <a onClick="return mV(\'Nah\',3,19);">Na 3:19</a> the King James Version and is translated "assuagings" in the Revised Version (British and American).<P>In the New Testament 5 times the verb is therapeuo; once (<a onClick="return mV(\'Act\',10,38);">Ac 10:38</a>) iaomai; in the other passages it is either iama, as in <a onClick="return mV(\'1Cr\',12,\'9-30\');">1Co 12:9-30</a>, or iasis, as in <a onClick="return mV(\'Act\',4,22);">Ac 4:22</a>, derivatives from this verb``1';
isbe[4199]='Healing, Gifts of`(charismata iamaton): Among the "spiritual gifts" enumerated in <a onClick="return mV(\'1Cr\',12,\'4-11\',28);">1Co 12:4-11, 28</a> are included "gifts of healings." See <a href="study/isbe/search.html?string=SPIRITUAL+GIFTS">SPIRITUAL GIFTS</A>. The subject has risen into much prominence of recent years, and so calls for separate treatment. The points to be considered are:<P class="in15">(1) the New Testament facts,<P class="in15">(2) the nature of the gifts,<P class="in15">(3) their permanence in the church.<P>1. The New Testament Facts:<P>The Gospels abundantly show that the ministry of Christ Himself was one of healing no less than of teaching (compare <a onClick="return mV(\'Mar\',1,14);">Mr 1:14</a>f with <a onClick="return mV(\'Mar\',1,\'32-34\');">1:32-34</a>). When He sent forth the Twelve (<a onClick="return mV(\'Mar\',6,7,13);">Mr 6:7, 13</a>) and the Seventy (<a onClick="return mV(\'Luk\',10,1,9);">Lu 10:1, 9</a>), it was not only to preach the Kingdom of God but to heal the sick. The inauthentic conclusion of Mark\'s Gospel, if it does not preserve words actually used by Christ Himself, bears witness at all events to the traditional belief of the early church that after His departure from the world His disciples would still possess the gift of healing. The Book of Acts furnishes plentiful evidence of the exercise of this gift by apostles and other prominent men in the primitive church (<a onClick="return mV(\'Act\',3,7);">Ac 3:7</a>f; <a onClick="return mV(\'Act\',5,\'12-16\');">5:12-16</A>; <a onClick="return mV(\'Act\',8,7);">8:7</A>; <a onClick="return mV(\'Act\',19,12);">19:12</A>; <a onClick="return mV(\'Act\',28,8);">28:8</a>f), and the Epistle of James refers to a ministry of healing carried on by the elders of a local church acting in their collective capacity (<a onClick="return mV(\'Jam\',5,14);">Jas 5:14</a>f). But Paul in this passage speaks of "gifts of healings" (the plural "healings" apparently refers to the variety of ailments that were cured) as being distributed along with other spiritual gifts among the ordinary members of the church. There were men, it would seem, who occupied no official position in the community, and who might not otherwise be distinguished among their fellow-members, on whom this special charisma of healing had been bestowed.<P>2. The Nature of the Gifts:<P>On this subject the New Testament furnishes no direct information, but it supplies evidence from which conclusions may be drawn. We notice that the exercise of the gift is ordinarily conditional on the faith of the recipient of the blessing (<a onClick="return mV(\'Mar\',6,5,6);">Mr 6:5-6</a>; <a onClick="return mV(\'Mar\',10,52);">10:52</a>; <a onClick="return mV(\'Act\',14,9);">Ac 14:9</a>)—faith not only in God but in the human agent (<a onClick="return mV(\'Act\',3,4);">Ac 3:4</a>ff; <a onClick="return mV(\'Act\',5,15);">5:15</A>; <a onClick="return mV(\'Act\',9,17);">9:17</a>). The healer himself is a person of great faith (<a onClick="return mV(\'Mat\',17,19);">Mt 17:19</a>f), while his power of inspiring the patient with confidence points to the possession of strong, magnetic personality. The diseases cured appear for the most part to have been not organic but functional; and many of them would now be classed as nervous disorders. The conclusion from these data is that the gifts of healing to which Paul alludes were not miraculous endowments, but natural therapeutic faculties raised to their highest power by Christian faith.<P>Modern psychology, by its revelation of the marvels of the subliminal self or subconscious mind and the power of "suggestion," shows how it is possible for one man to lay his hand on the very springs of personal life in another, and so discloses the psychical basis of the gift of healing. The medical science of our time, by its recognition of the dependence of the physical upon the spiritual, of the control of the bodily functions by the subconscious self, and of the physician\'s ability by means of suggestion, whether waking or hypnotic, to influence the subconscious soul and set free the healing powers of Nature, provides the physiological basis. And may we not add that many incontestable cases of Christian faith-cure (take as a type the well-known instance in which Luther at Weimar "tore Melanchthon," as the latter put it, "out of the very jaws of death"; see RE, XII, 520) furnish the religious basis, and prove that faith in God, working through the soul upon the body, is the mightiest of all healing influences, and that one who by his own faith and sympathy and force of personality can stir up faith in others may exercise by God\'s blessing the power of healing diseases?<P>3. Permanence of Healing Gifts in the Church:<P>There is abundant evidence that in the early centuries the gifts of healing were still claimed and practiced within the church (Justin, Apol. ii.6; Irenaeus, Adv. Haer. ii. 32, 4; Tertullian, Apol. xxiii; Origen, Contra Celsum, vii.4). The free exercise of these gifts gradually ceased, partly, no doubt, through loss of the early faith and spirituality, but partly through the growth of an ascetic temper which ignored Christ\'s gospel for the body and tended to the view that pain and sickness are the indispensable ministers of His gospel for the soul. All down the history of the church, however, there have been notable personalities (e.g. Francis of Assisi, Luther, Wesley) and little societies of earnest Christians (e.g. the Waldenses, the early Moravians and Quakers) who have reasserted Christ\'s gospel on its physical side as a gospel for sickness no less than for sin, and claimed for the gift of healing the place Paul assigned to it among the gifts of the Spirit. In recent years the subject of Christian healing has risen into importance outside of the regularly organized churches through the activity of various faith-healing movements. That the leaders of these movements have laid hold of a truth at once Scriptural and scientific there can be little doubt, though they have usually combined it with what we regard as a mistaken hostility to the ordinary practice of medicine. It is worth remembering that with all his faith in the spiritual gift of healing and personal experience of its power, Paul chose Luke the physician as the companion of his later journeys; and worth noticing that Luke shared with the apostle the honors showered upon the missionaries by the people of Melita whom they had cured of their diseases (<a onClick="return mV(\'Act\',28,10);">Ac 28:10</a>). Upon the modern church there seems to lie the duty of reaffirming the reality and permanence of the primitive gift of healing, while relating it to the scientific practice of medicine as another power ordained of God, and its natural ally in the task of diffusing the Christian gospel of health.<P>LITERATURE.<P>Hort, Christian Ecclesia, chapter x; A.T. Schofield, Force of Mind, Unconscious Therapeutics; E. Worcester and others, Religion and Medicine; HJ, IV, 3, p. 606; The Expositor T, XVII, 349,4 17.``94';
isbe[4200]='Health`helth (shalom, yeshu\'ah, \'arukhah; riph\'uth, \'arukhah; soteria, hugiaino): Shalom is part of the formal salutation still common in Palestine. In this sense it is used in <a onClick="return mV(\'Gen\',43,28);">Ge 43:28</a>; <a onClick="return mV(\'2Sa\',20,9);">2Sa 20:9</a>; the stem word means "peace," and is used in many varieties of expression relating to security, success and good bodily health. Yeshu\'ah, which specifically means deliverance or help, occurs in the refrain of <a onClick="return mV(\'Psa\',42,11);">Ps 42:11</a>; <a onClick="return mV(\'Psa\',43,5);">43:5</a>, as well as in <a onClick="return mV(\'Psa\',67,2);">Ps 67:2</a>; in the American Standard Revised Version it is rendered "help." Riph\'uth is literally, "healing," and is found only in <a onClick="return mV(\'Pro\',3,8);">Pr 3:8</a>. Marpe\' also means healing of the body, but is used in a figurative sense as of promoting soundness of mind and moral character in <a onClick="return mV(\'Pro\',4,22);">Pr 4:22</a>; <a onClick="return mV(\'Pro\',12,18);">12:18</a>; <a onClick="return mV(\'Pro\',13,17);">13:17</a>; <a onClick="return mV(\'Pro\',16,24);">16:24</a>, as also in <a onClick="return mV(\'Jer\',8,15);">Jer 8:15</a>, where the Revised Version (British and American) renders it "healing." \'Arukhah is also used in the same figurative sense in <a onClick="return mV(\'Isa\',58,8);">Isa 58:8</a>; <a onClick="return mV(\'Jer\',8,22);">Jer 8:22</a>; <a onClick="return mV(\'Jer\',30,17);">30:17</a>; <a onClick="return mV(\'Jer\',33,6);">33:6</a>; literally means "repairing or restoring"; it is the word used of the repair of the wall of Jerusalem by Nehemiah (chapter <a onClick="return mV(\'Neh\',4,\'1-\');">4</A>).<P>The word "health" occurs twice in the New Testament: in Paul\'s appeal to his shipmates to take food (<a onClick="return mV(\'Act\',27,34);">Ac 27:34</a>), he says it is for their soteria, literally, "safety"; so the American Standard Revised Version, the King James Version "health." The verb hugianino is used in <a onClick="return mV(\'3Jo\',1,2);">3Joh 1:2</a>, in the apostle\'s salutation to Gaius.``107';
