isbe = [];

isbe[1901]='Castor and Pollux`kas\'-ter, pol\'-uks.`<a href="./study/isbe/search.html?string=DIOSCURI">DIOSCURI</a>; <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[1902]='Cat`(ailouros): The only mention of this animal is in Baruch 6:22. It is not mentioned in the canonical Scriptures, though Bochart (Hieroz., 862) gives "wild cats" as the equivalent of tsyim in <a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a>; <a onClick="return mV(\'Isa\',34,14);">34:14</a>; <a onClick="return mV(\'Jer\',50,39);">Jer 50:39</a>; <a onClick="return mV(\'Psa\',74,19);">Ps 74:19</a>, where English Versions of the Bible gives "wild beasts of the desert." Mention is, however, made of cats, cathod, in the Welsh Bible (<a onClick="return mV(\'Isa\',34,14);">Isa 34:14</a>). The only mention of the catta in classical Latin writers is in Martial xiii. 69. How the cat was regarded in Egypt is described in Herod. ii. 66 and Rawlinson\'s notes. In Baruch 6:22 cats are mentioned with "bats, swallows and birds" as sitting with impunity on the images of the heathen gods which are unable to drive them off.`<a href="./study/isbe/search.html?string=ZOOLOGY">ZOOLOGY</a>`79';
isbe[1903]='Catechist; Catechumen`kat\'-e-kist, kate-ku\'-men (katechizein "to resound," "to teach," "to instruct"): A catechist is a teacher who instructs his pupils in the elements of his own religion. In the Old Testament he teaches them the rudiments of Old Testament truth; in the New Testament he teaches the principles of the Christian faith. A catechumen, one whom the catechist instructs or catechizes, in preparation for the ceremony of baptism.<P>The words are derived from katechein, meaning "to give a sound," "to answer," "to echo." Classically it was used of the sounding down of rushing water, of the falling of music from a ship to the sea. Then it came to signify the sounding down of words of command or instruction. The preposition kata strengthens the meaning, bringing out more emphatically the back or return sound, the echo, the answer. So it came to mean familiar verbal instruction, a free informal discussion between teacher and pupil. Luke informs Theophilus (<a onClick="return mV(\'Luk\',1,4);">Lu 1:4</a>) that he intends to give him a succinct and orderly account of those things which he had previously received by word of mouth (peri hon katechethes). See also the Greek in <a onClick="return mV(\'Act\',18,25);">Ac 18:25</a> and <a onClick="return mV(\'Act\',21,21);">Ac 21:21</a>; <a onClick="return mV(\'Rom\',2,18);">Ro 2:18</a>; <a onClick="return mV(\'1Cr\',14,19);">1Co 14:19</a>; <a onClick="return mV(\'Gal\',6,6);">Ga 6:6</a>. In all these passages the Greek verb is "catechised."<P>We do not find in the New Testament an organized catechumenate, such as we find in the 3rd and 4th centuries. The apostles preached mainly to synagogue-instructed Jews who were familiar with the law and the prophets and the Psalms, or to Gentiles who had, learned from the Jews and had become "<a href="./study/isbe/search.html?string=PROSELYTE">proselytes</a>" (which see). The first apostolic preaching and teaching was to convince the hearers that Jesus was the promised Messiah, the Saviour of the world. As believers multiplied, the contrast between them and those who rejected the teaching became more and more marked. Opposition, scorn and persecution became more bold and bitter. The Christians were compelled to set forth and defend their beliefs more clearly. They had to meet and answer keen and persistent objections. And so the necessity for clear, systematic and organized teaching grew more and more into the form of an ordered catechumenate. The Apostolic Constitutions, from the latter part of the 3rd century, show the institution in a fair state of development. A Jew, pagan, or heretic of good moral standing, upon application to the deacon, presbyter, or bishop, was admitted into the state of catechumen by the sign of the cross and the imposition of hands (Schaff-Herzog, under the word).<P>The basis for the Christian catechumenate we find in the great commission (<a onClick="return mV(\'Mat\',28,19,20);">Mt 28:19-20</a>). The aim of this commission was to make disciples, i.e. believing followers. The means for this discipling are baptizing and teaching. The result of using the means is that those who have become disciples are to observe all things whatsoever Christ has commanded.<P>Jesus Himself at twelve years of age had become a child of the law, a catechumen. He increased in wisdom and learned obedience. He became the great Catechist instructing His disciples, other private individuals and the multitudes. See an example of His catechizing in <a onClick="return mV(\'Mat\',16,13);">Mt 16:13</a>ff.<P>Paul was a master in method. See examples of use of the modern pedagogical method of apperception in <a onClick="return mV(\'Act\',14,1);">Ac 14:14</a>ff; <a onClick="return mV(\'Act\',17,16);">17:16</a>ff; <a onClick="return mV(\'Act\',14,8,9);">19:8-9</a>. The cathechetical method is frequently found in the epistles (see <a onClick="return mV(\'1Cr\',3,1,2);">1Co 3:1-2</a>; <a onClick="return mV(\'Hbr\',5,11,14);">Heb 5:11, 14</a>; <a onClick="return mV(\'Hbr\',6,1,2);">6:1-2</a>; <a onClick="return mV(\'1Pe\',2,2);">1Pe 2:2</a>; <a onClick="return mV(\'1Jo\',2,13);">1Jo 2:13</a>), and so the idea of religious nurture and instruction is found all through the New Testament. The catechist and the catechumen are there. It was not something new in the New Testament. Its roots lie back and run through the Old Testament. The narrative of God\'s first communication with man, inside the gates of Eden, concerning commandment, law, sin, its consequences, its remedy, takes a catechetical form. The importance of systematic instruction, both public and private, is emphasized throughout the Old Testament and New Testament, although it might not always take the form of catechizing in the modern pedagogical sense. In the patriarchal age the father was the prophet, the teacher, the catechist, in his house, which often included several families with their servants (see <a onClick="return mV(\'Gen\',18,19);">Ge 18:19</a>). Matthew Henry explains thus: "Abraham not only took care of his children, but his whole household, including his servants, were catechized" (see also <a onClick="return mV(\'Exd\',12,26);">Ex 12:26</a>; <a onClick="return mV(\'Deu\',6,\'1-9\');">De 6:1-9</a>; <a onClick="return mV(\'Jos\',4,6,7);">Jos 4:6-7</a>; <a onClick="return mV(\'Jos\',24,15);">24:15</a>; <a onClick="return mV(\'Psa\',34,11);">Ps 34:11</a>). Priests and Levites in addition to their sacerdotal functions were catechists (instructors) among the people (<a onClick="return mV(\'Lev\',10,11);">Le 10:11</a>; <a onClick="return mV(\'Deu\',33,10);">De 33:10</a>; <a onClick="return mV(\'2Ch\',15,3);">2Ch 15:3</a>; <a onClick="return mV(\'Eze\',44,23);">Eze 44:23</a>). In later times the synagogues had regular instruction in the law and the prophets.`<a href="./study/isbe/search.html?string=EDUCATION">EDUCATION</a>; <a href="./study/isbe/search.html?string=INSTRUCTION">INSTRUCTION</a>; <a href="./study/isbe/search.html?string=TEACHER">TEACHER</a>`64';
isbe[1904]='Caterpillar`kat\'-er-pil-er (chacil (<a onClick="return mV(\'Psa\',78,46);">Ps 78:46</a>; <a onClick="return mV(\'Joe\',1,4);">Joe 1:4</a>, etc.); yeleq (<a onClick="return mV(\'Psa\',105,34);">Ps 105:34</a> the King James Version, the American Standard Revised Version "grasshopper"; <a onClick="return mV(\'Jer\',51,14,27);">Jer 51:14, 27</a> the King James Version; elsewhere "canker-worm")): A name given to a larval stage of the <a href="./study/isbe/search.html?string=LOCUST">LOCUST</a> (which see).``1';
isbe[1905]='Catholic Epistles`kath\'-o-lik (epistolai katholikai): In distinction from the apostolic or Pauline epistles which were addressed to individual churches or persons, the term "catholic," in the sense of universal or general, was applied by Origen and the other church Fathers to the seven epistles written by James, Peter, John and Jude. As early as the 3rd century it came to be used in the sense of "encyclical," "since," as Theodoret says, "they are not addressed to single churches, but generally (katholou) to the faithful, whether to the Jews of the Dispersion, as Peter writes, or even to all who are living as Christians under the same faith." Three other explanations of the term have been given, namely,<P>(1) that it was intended to indicate a common apostolic authorship (only a few support this view);<P>(2) that it signifies that the seven epistles were universally received as genuine;<P>(3) that it refers to the catholicity of their doctrine, i.e. orthodox and authoritative versus heretical epistles whose teachings were in harmony with Christian truth. By some misconception of the word "catholic" the Western Church interpreted it as signifying "canonical" and sometimes called these epistles epistolae canonicae. That it was originally used in the sense of "general" epistles is now commonly received.<P>This is evident from their form of address. James wrote to all Jews, "of the Dispersion," who had embraced the Christian faith. In his first epistle Peter addressed the same Christians, including also Gentile converts, resident in five provinces of Asia Minor: "elect who axe sojourners of the Dispersion." His second epistle is to all Christians everywhere. John\'s first letter was evidently written to a cycle of churches and intended for universal use. Jude also had in mind all Christians when he said "to them that are called beloved in God," etc. The seeming exceptions are 2 and 3 John, addressed to individuals, but included with the catholic epistles as properly belonging with John\'s first epistle and of value to the general reader. The character and contents of these seven epistles are treated under their various heads. The letters of James and Jude belong to the Judaic school of Christianity; those of Peter to a broad and non-partisan type of faith that both includes and mediates between the Judaists and Paulinists. John\'s letters were written after the internal doctrinal controversies of the church had ceased, and the pressure of opposition and error from without tended to unite his "little children" in a new community of love and spiritual life.``139';
isbe[1906]='Cathua`ka-thu\'-a (Kathoua; Codex Vaticanus, Koua): Head of a family of temple-servants who returned from the captivity with Zerubbabel (1Esdras 5:30); corresponds to Giddel in <a onClick="return mV(\'Ezr\',2,47);">Ezr 2:47</a>.``1';
isbe[1907]='Cattle`kat\'-\'-l (behemah, "a dumb beast"; miqneh, "a possession" from qanah, "to acquire" (compare Arabic qana\', "to acquire," and Greek kienos, "beast," and plural ktenea, "flocks," from ktaomai, "to acquire," flocks being both with the Homeric peoples and with the patriarchs an important form of property; compare English "fee"); tso\'n "small cattle," "sheep" or goats (compare Arabic da\'n, "sheep"); seh, a single sheep or goat (compare Arabic shah); mela\'khah, "property," from la\'akh, "to minister" (compare Arabic malakah and mulk, "property," from malak, "to possess"); meri\' "fatling" (<a onClick="return mV(\'1Ki\',19,\'1-\');">1Ki 19</a>); thremma (<a onClick="return mV(\'Jhn\',4,12);">Joh 4:12</a>), "cattle," i.e. "that which is nourished," from trepho, "to nourish"; baqar, "kine," "oxen" (compare Arabic baqar, "cattle"); shor, tor (<a onClick="return mV(\'Dan\',4,25);">Da 4:25</a>), tauros (<a onClick="return mV(\'Mat\',22,4);">Mt 22:4</a>), "ox" or "bull"; bous, "ox" (<a onClick="return mV(\'Luk\',13,15);">Lu 13:15</a>); \'eleph, only in the plural, \'alaphim, "oxen" (<a onClick="return mV(\'Psa\',8,7);">Ps 8:7</a>): From the foregoing and by examination of the many references to "cattle," "kine" or "oxen" it is apparent that there are important points of contact in derivation and usage in the Hebrew, Greek and English terms. It is evident that neat cattle were possessed in abundance by the patriarchs and later Israelites, which is fax from being the case in Palestine at the present day. The Bedouin usually have no cattle. The fellachin in most parts of the country keep them in small numbers, mostly for plowing, and but little for milk or for slaughtering. Travelers in the Holy Land realize that goat\'s milk is in most places easier to obtain than cow\'s milk. The commonest cattle of the fellachin are a small black breed. In the vicinity of Damascus are many large, fine milch cattle which furnish the delicious milk and cream of the Damascus bazaars. For some reason, probably because they are not confined and highly fed, the bulls of Palestine are meek creatures as compared with their European or American fellows.<P>In English Versions of the Bible the word "cattle" is more often used in a wide sense to include sheep and goats than to denote merely neat cattle. In fact, baqar, which distinctively denotes neat cattle, is often rendered "herds," as tso\'n, literally "sheep," is in a large number of instances translated "flocks." A good illustration is found in <a onClick="return mV(\'Gen\',32,7);">Ge 32:7</a>: "Then Jacob...divided the, people (\'am) that were with him, and the flocks (tso\'n), and the herds (baqar), and the camels (gemallim), into two companies (machanoth)." For the last word the King James Version has "drove" in <a onClick="return mV(\'Gen\',33,8);">Ge 33:8</a>, the Revised Version (British and American) "company." Next to tso\'n, the word most commonly rendered "flock" in English Versions of the Bible is \'edher, from root "to arrange," "to set in order." \'Edher is rendered "herd" in <a onClick="return mV(\'Pro\',27,23);">Pr 27:23</a>, and in <a onClick="return mV(\'Joe\',1,18);">Joe 1:18</a> it occurs twice, being rendered "herds of cattle," \'edhre baqar, and "flocks of sheep," \'edhre ha-tso\'n. Miqneh is rendered "flock" in <a onClick="return mV(\'Num\',32,26);">Nu 32:26</a>, "herd" in <a onClick="return mV(\'Gen\',47,18);">Ge 47:18</a>, and "cattle" in a large number of passages. Other words rendered "flock" are: mar\'ith (r. ra\'ah (Arabic ra\'a), "to pasture"), once in <a onClick="return mV(\'Jer\',10,21);">Jer 10:21</a>; \'ashteroth tso\'n, "flocks of thy sheep," the Revised Version (British and American) "young of thy flock," in <a onClick="return mV(\'Deu\',7,13);">De 7:13</a>, etc., \'ashiaroth being plural of \'ashtoreth, or Ashtoreth; chasiph, once in <a onClick="return mV(\'1Ki\',20,27);">1Ki 20:27</a>: "The Children of Israel encamped before them (the Syrians) like two little flocks of kids," chasiph signifying "something stripped off or separated," from root chasaph, "to strip" or "to peel," like the Arabic qati\', "flock," from root qata\', "to cut off"; poimne (<a onClick="return mV(\'Mat\',26,31);">Mt 26:31</a>): "The sheep of the flock shall be scattered," and (<a onClick="return mV(\'Luk\',2,8);">Lu 2:8</a>): "keeping watch by night over their flock"; poimnion (<a onClick="return mV(\'Luk\',12,32);">Lu 12:32</a>): "Fear not, little flock," and (<a onClick="return mV(\'1Pe\',5,2);">1Pe 5:2</a>): "Tend the flock of God which is among you." Figurative: Not only poimne and poimnion but also \'edher and tso\'n are used figuratively of God\'s people; e.g. <a onClick="return mV(\'Isa\',40,11);">Isa 40:11</a>: "He will feed his flock (\'edher) like a shepherd"; <a onClick="return mV(\'Zec\',10,3);">Zec 10:3</a>: "Yahweh of hosts hath visited his flock ([\'edher]), the house of Judah"; <a onClick="return mV(\'Isa\',65,10);">Isa 65:10</a>: "And Sharon shall be a fold of flocks" (tso\'n); <a onClick="return mV(\'Jer\',23,2);">Jer 23:2</a>: "Ye have scattered my flock" (tso\'n); <a onClick="return mV(\'Eze\',34,22);">Eze 34:22</a>: "Therefore will I save my flock" (tso\'n); <a onClick="return mV(\'Mic\',7,14);">Mic 7:14</a>: "Feed...the flock (tso\'n) of thy heritage."<P>The wild ox or wild bull, the Revised Version (British and American) "antelope" (te\'o or to\' of <a onClick="return mV(\'Deu\',14,5);">De 14:5</a> and <a onClick="return mV(\'Isa\',51,20);">Isa 51:20</a>), is considered by the writer to be probably the Arabian oryx, and in this he is in agreement with Tristram (NHB). Tristram however thinks that the unicorn (rem or re\'em), the Revised Version (British and American) "wild ox," was the aurochs, while the present writer believes that this also may well have been the oryx, which at the present day has at least three names in Arabic, one of which, baqar-ul-wachsh, means "wild ox."<P>See <a href="./study/isbe/search.html?string=ANTELOPE">ANTELOPE</a>.<P>Our domestic cattle are believed by some of the best authorities to be of the same species as the ancient European wild ox or aurochs, Bos taurus, which is by others counted as a distinct species under the title of Bos primigeniusú The aurochs was widely spread over Europe in Roman times, but is now extinct. Some degenerate wild cattle are preserved in some British parks, but these according to Lydekker in the Royal Natural History are probably feral descendants of early domestic breeds. Tristram cites the occurrence in the Dog River bone breccia of teeth which may be those of the aurochs, but this is a deposit accumulated by prehistoric man of an unknown antiquity to be variously estimated according to the predilections of the geologist at a few thousands or a few score of thousands of years, and is far from proving that this animal existed in Palestine in Bible times or at any time.<P>The European bison (Bos or Bison bonassus) is thought by some to be the wild ox of the Bible. This is a forest-dwelling species and is now confined to the forests of Lithuania and the Caucasus. It was formerly more widely distributed, but there is no certain evidence that it ever lived as far south as Palestine, and there have probably never existed in Palestine forests suitable to be the haunts of this animal.<P>About the Sea of Tiberias and the Jordan valley and in the plain of Coele-Syria there exist today Indian buffaloes (Bos bubalus) some feral and some in a state of domestication, which are believed to have been introduced in comparatively recent times.`<a href="./study/isbe/search.html?string=BEAST">BEAST</a>; <a href="./study/isbe/search.html?string=CALF">CALF</a>`37';
isbe[1908]='Cauda`ko\'-da (Kauda; also called Klauda; the King James Version Clauda; the modern Greek name Gaudho supports the form Cauda): An island 23 miles west of Cape Matala. It is a small island, and can never have supported a large population, or have been of any importance. Its elevation to the rank of a bishopric in Byzantine times must have been due to its association with the voyage of Paul. The ship with Paul on board was driven under the lee of Cauda (<a onClick="return mV(\'Act\',27,16);">Ac 27:16</a>); in the calm water south of the island the crew succeeded in hauling in the boat, undergirding the ship and slackening sail.``20';
isbe[1909]='Caul`kol:<P>(1) yothereth (<a onClick="return mV(\'Exd\',29,13);">Ex 29:13</a>), the large lobe or flap of the liver, which is usually mentioned together with the kidneys and the fat as the special portions set aside for the burnt offering (<a onClick="return mV(\'Lev\',3,4,10,15);">Le 3:4, 10, 15</a>; <a onClick="return mV(\'Lev\',4,9);">4:9</a>; <a onClick="return mV(\'Lev\',7,4);">7:4</a>; <a onClick="return mV(\'Lev\',8,16,25);">8:16, 25</a>; <a onClick="return mV(\'Lev\',9,10,19);">9:10, 19</a>).<P>(2) ceghor (from the root caghar, "to enclose," "shut up"), <a onClick="return mV(\'Hsa\',13,8);">Ho 13:8</a>, literally the enclosure or covering of the heart, the caul or pericardium, or perhaps the chest as surrounding the heart. It must not be forgotten, however, that the expression may be taken in the sense of "mailcoat of the heart," i.e. hardened heart, which is shut to the influence of God\'s grace. So Luther and many modern translators and commentators.``106';
isbe[1910]='Cause`kos: In both the King James Version and the Revised Version (British and American) "for this cause" (the King James Version "cause") occurs in <a onClick="return mV(\'Exd\',9,16);">Ex 9:16</a> as the rendering of ba\'abhur zo\'th = "in order that"; "to the end that"; so also in <a onClick="return mV(\'Dan\',2,12);">Da 2:12</a> for kol-qebhel denah, and in <a onClick="return mV(\'2Ch\',32,20);">2Ch 32:20</a> the King James Version for \'al-zo\'th, where RVS read "because of." In the New Testament the word is used adverbially in the translation of several Greek phrases: heneka toutou (<a onClick="return mV(\'Mat\',19,5);">Mt 19:5</a>; <a onClick="return mV(\'Mar\',10,7);">Mr 10:7</a>); dia touto, <a onClick="return mV(\'Jhn\',12,27);">Joh 12:27</a>; <a onClick="return mV(\'Rom\',1,26);">Ro 1:26</a>; <a onClick="return mV(\'Rom\',13,6);">13:6</a>; <a onClick="return mV(\'Rom\',15,9);">15:9</a> (the Revised Version (British and American) "therefore"); <a onClick="return mV(\'1Cr\',11,30);">1Co 11:30</a>; <a onClick="return mV(\'1Th\',2,13);">1Th 2:13</a>; <a onClick="return mV(\'2Th\',2,11);">2Th 2:11</a>; <a onClick="return mV(\'1Ti\',1,16);">1Ti 1:16</a>; <a onClick="return mV(\'Hbr\',9,15);">Hebrews 9:15</a>; eis touto, <a onClick="return mV(\'Jhn\',18,37);">Joh 18:37</a> (where the King James Version varying the phraseology reads "to this end" "for this cause"); <a onClick="return mV(\'1Pe\',4,6);">1Pe 4:6</a> the King James Version; toutou charin, <a onClick="return mV(\'Eph\',3,14);">Eph 3:14</a>. Unusual renderings occur, as "for his cause" (= "because of"), <a onClick="return mV(\'2Cr\',7,12);">2Co 7:12</a>; as = "affair," "thing," obsolete in the King James Version <a onClick="return mV(\'1Ki\',12,15);">1Ki 12:15</a>; <a onClick="return mV(\'2Ch\',10,15);">2Ch 10:15</a>, where the word occurs as a paraphrase of necibbah (= "turn of affairs"). In <a onClick="return mV(\'1Sa\',25,31);">1Sa 25:31</a> (King James Version, the Revised Version (British and American)) "causeless" (= without cause the American Standard Revised Version) occurs arbitrarily in adverb sense.``164';
isbe[1911]='Causeway; Causey`koz\'-wa, ko\'-zi (more correctly): This word occurs in <a onClick="return mV(\'1Ch\',26,16,18);">1Ch 26:16, 18</a> for the Hebrew mecillah; Septuagint pastophorion tes anabaseos. In <a onClick="return mV(\'2Ch\',9,11);">2Ch 9:11</a> the word is translated "terraces" (Septuagint anabaseis). Compare BDB, under the word, where mecilloth, is an error for mic\'adhoth (<a onClick="return mV(\'1Ki\',10,12);">1Ki 10:12</a>). In all the above passages reference is made to a series or flight of steps leading up into the temple. The word also signifies a prepared, traveled road, as in <a onClick="return mV(\'Num\',20,19);">Nu 20:19</a>; <a onClick="return mV(\'Jdg\',20,31);">Jud 20:31</a>f; <a onClick="return mV(\'Jdg\',20,45);">45</a>; <a onClick="return mV(\'1Sa\',6,12);">1Sa 6:12</a>; <a onClick="return mV(\'2Sa\',20,12);">2Sa 20:12</a>f; <a onClick="return mV(\'2Ki\',18,17);">2Ki 18:17</a> (<a onClick="return mV(\'Isa\',36,2);">Isa 36:2</a>); <a onClick="return mV(\'Isa\',7,3);">Isa 7:3</a>; <a onClick="return mV(\'Isa\',11,16);">11:16</a>; <a onClick="return mV(\'Isa\',19,23);">19:23</a>; <a onClick="return mV(\'Isa\',33,8);">33:8</a>; <a onClick="return mV(\'Isa\',40,3);">40:3</a>; <a onClick="return mV(\'Isa\',49,11);">49:11</a>; <a onClick="return mV(\'Jer\',31,21);">Jer 31:21</a>.<P>Figurative: In <a onClick="return mV(\'Isa\',59,7);">Isa 59:7</a> the word (mecillah) occurs in a figurative sense, so also in <a onClick="return mV(\'Jdg\',5,20);">Jud 5:20</a>; <a onClick="return mV(\'Pro\',16,17);">Pr 16:17</a>.``164';
isbe[1912]='Cave`kav ([me\'arah] (compare Arabic magharah), chor (<a onClick="return mV(\'Job\',30,6);">Job 30:6</a> the King James Version), mechilloth (<a onClick="return mV(\'Isa\',2,19);">Isa 2:19</a>); ope (<a onClick="return mV(\'Hbr\',11,38);">Hebrews 11:38</a>), spelaion (<a onClick="return mV(\'Jhn\',11,38);">Joh 11:38</a>); chor, more often rendered "hole," is akin to Arabic khaur, "gulf" or "inlet," but is also related to me\'arah (compare also Arabic ghaur "low-land," especially of the Jordan valley and Dead Sea). Mechilloth (root, chalal, "to pierce" (compare Arabic khall, "to pierce")) occurs only in <a onClick="return mV(\'Isa\',2,19);">Isa 2:19</a>, where the King James Version has "caves" and translates me\'aroth in the same verse by "holes." In the Revised Version (British and American) these words are very properly changed about. Spelaion is a common Greek word for "cave"; ope means rather "hole"): In Palestine as in other limestone countries, caves are of frequent occurrence, and not a few of large size are known. Water from the rain and snow, seeping down through cracks, enlarges the passages through which it goes by dissolving away the substance of the rock. Just as upon the surface of the land the trickling streams unite to form brooks and rivers, so many subterranean streams may come together in a spacious channel, and may issue upon the surface as a bold spring. The cave of the Dog River near Beirut and that of \'Afqa (perhaps Aphek (<a onClick="return mV(\'Jos\',13,4);">Jos 13:4</a>)) in Lebanon are excellent examples of this. Not infrequently after forming a cave the stream of water may find some lower outlet by a different route, leaving its former course dry. In some cases the hinder part of the roof of the cave may fall in, leaving the front part standing as a natural bridge. Numerous shallow caves, especially in the faces of cliffs, are formed not by seeping water, but by atmospheric erosion, a portion of a relatively soft stratum of rock being hollowed out, while harder strata above and below it are but little worn away. Many of the hermits\' caves originated in this way and were artificially enlarged and walled up at the mouth. The principal caves mentioned in the Bible are those of <a href="./study/isbe/search.html?string=MACHPELAH">MACHPELAH</a>, <a href="./study/isbe/search.html?string=MAKKEDAH">MAKKEDAH</a> and <a href="./study/isbe/search.html?string=ADULLAM">ADULLAM</a> (which see).`<a href="./study/isbe/search.html?string=DEN">DEN</a>`37';
isbe[1913]='Cease`ses: A remarkable array of 20 Hebrew and 6 Greek words is so translated. In the King James Version 15 of the former and 3 of the latter are used only once with this rendering. The originals most frequently in use are chadhal, "to leave off"; shabhath "to rest from" (labor); pauomai, "to make to cease." Few words illustrate better the fertility of the Hebrew in expressing limitless shades of meaning, impoverished by the use of one English word. This extensive variety is, however, well expressed by "cease": i.e. stop, come to an end, e.g. ceasing of tears (<a onClick="return mV(\'Jer\',14,17);">Jer 14:17</a>); work (<a onClick="return mV(\'Ezr\',4,24);">Ezr 4:24</a>); grinders (<a onClick="return mV(\'Ecc\',12,3);">Ec 12:3</a>); thunder (<a onClick="return mV(\'Exd\',9,29);">Ex 9:29</a>); the wicked (<a onClick="return mV(\'Job\',3,17);">Job 3:17</a>); anger (<a onClick="return mV(\'Psa\',37,8);">Ps 37:8</a>). The significance of shabhath lies in its being the Hebrew for Sabbath, implying complete cessation: as of manna (<a onClick="return mV(\'Jos\',5,12);">Jos 5:12</a>); strife and ignominy (<a onClick="return mV(\'Pro\',22,10);">Pr 22:10</a>); occurs with negative to show the ceaseless Providence of God in Nature: "summer and winter...shall not c." (<a onClick="return mV(\'Gen\',8,22);">Ge 8:22</a>). In the New Testament it illustrates Christ\'s power over Nature; wind and raging sea ceased (<a onClick="return mV(\'Luk\',8,24);">Lu 8:24</a>); over a sinner\'s heart: "not ceased to kiss my feet" (dialeipo) (<a onClick="return mV(\'Luk\',7,45);">Lu 7:45</a>); devotion of the early disciples, "ceased not to teach and to preach Jesus as the Christ" (<a onClick="return mV(\'Act\',5,42);">Ac 5:42</a>); the eternity and blessedness of the believer\'s sabbatic rest (apoleipo) (<a onClick="return mV(\'Hbr\',4,10);">Hebrews 4:10</a> the King James Version).``139';
isbe[1914]='Cedar`se\'-dar, se\'-der (\'erez, from Hebrew root meaning "to be firm"; kedros): The \'erez was in almost all the Old Testament references the true cedar, Cedrus libani, but the name may have been applied in a loose way to allied trees, such as junipers and pines. In <a onClick="return mV(\'Num\',24,6);">Nu 24:6</a>—"as cedar-trees beside the waters"—the reference must, as is most probable, be purely poetical (see <a href="./study/isbe/search.html?string=ALOES">ALOES</a>) or the \'arazim must signify some other kind of tree which flourishes beside water.<P>1. Cedar for Ritual Cleansing:<P>Cedar is twice mentioned as a substance for ritual cleansing. In <a onClick="return mV(\'Lev\',14,4);">Le 14:4</a> the cleansed leper was sprinkled with the blood of a "clean bird" into which had been put "cedar-wood, and scarlet, and hyssop." In <a onClick="return mV(\'Num\',19,6);">Nu 19:6</a> "cedar-wood, and hyssop, and scarlet" were to be cast into the holocaust of the red heifer. (For the symbolical meaning see <a href="./study/isbe/search.html?string=CLEAN">CLEAN</a>.) Here it is very generally considered that the cedar could not have been the wood of Cedrus libani, which so far as we know never grew in the wilderness, but that of some species of juniper—according to Post, Juniperis phoenicea, which may still be found in the wilderness of Edom.<P>2. Cedar Trees in the Old Testament:<P>Cedar trees are everywhere mentioned with admiration in the Old Testament. Solomon made the cedar the first of trees (<a onClick="return mV(\'1Ki\',4,33);">1Ki 4:33</a>). They are the "glory of Lebanon" (<a onClick="return mV(\'Isa\',35,2);">Isa 35:2</a>; <a onClick="return mV(\'Isa\',60,13);">60:13</a>). The most boastful threat of Sennacherib was that he would cut down the tall cedars of Lebanon (<a onClick="return mV(\'Isa\',37,24);">Isa 37:24</a>). They were strong, as is implied in— " The voice of Yahweh is powerful;...The voice of Yahweh breaketh the cedars; Yea, Yahweh breaketh in pieces the cedars of Lebanon" (<a onClick="return mV(\'Psa\',29,4,5);">Ps 29:4-5</a>). The cedars are tall—"whose height was like the height of the cedars"—(<a onClick="return mV(\'Amo\',2,9);">Am 2:9</a>; <a onClick="return mV(\'2Ki\',19,23);">2Ki 19:23</a>); majestic (<a onClick="return mV(\'2Ki\',14,9);">2Ki 14:9</a>), and excellent (<a onClick="return mV(\'Sgs\',5,15);">So 5:15</a>). The Assyrian power is compared to—"a cedar in Lebanon with fair branches, and with a forest-like shade, an high stature; and its top was among the thick boughs...its stature was exalted above all the trees of the field; and its boughs were multiplied, and its branches became long" (<a onClick="return mV(\'Eze\',31,\'3-5\');">Eze 31:3-5</a>). They are in particular God\'s trees— "The trees of Yahweh are filled with moisture, The cedars of Lebanon, which he hath planted" (<a onClick="return mV(\'Psa\',104,16);">Ps 104:16</a>). Doubtless as a reminiscence of this the Syrians today call the cedar \'ars er rubb, "the cedar of the Lord." The growth of the cedar is typical of that of the righteous man (<a onClick="return mV(\'Psa\',92,12);">Ps 92:12</a>).<P>That cedars were once very abundant in the Lebanon is evident (<a onClick="return mV(\'1Ki\',6,\'9-18\');">1Ki 6:9-18</a>; <a onClick="return mV(\'1Ki\',10,27);">10:27</a>). What they contributed to the glory and beauty of that district may be seen in <a onClick="return mV(\'Zec\',11,\'1-2\');">Zec 11:1-2</a>: " Open thy doors, O Lebanon, that the fire may devour thy cedars. Wail, O fir-tree, for the cedar is fallen, because the glorious (Revised Version margin) ones are destroyed: Wail, O ye oaks of Bashan, for the strong forest is come down."<P>3. Cedar Timber:<P>The wood of the cedar has always been highly prized—much more so than the sycamore (<a onClick="return mV(\'1Ki\',10,27);">1Ki 10:27</a>; <a onClick="return mV(\'Isa\',9,10);">Isa 9:10</a>). David had a house of cedar built for him by Hiram, king of Tyre (<a onClick="return mV(\'2Sa\',5,11);">2Sa 5:11</a>), and he prepared "cedar-trees without number" for the temple which his son was to build (<a onClick="return mV(\'1Ch\',22,4);">1Ch 22:4</a>). Cedar timber was very much used in the construction of Solomon\'s temple and palace, the trees being cut in the Lebanon by Sidonians by orders of the king of Tyre—"Hiram gave Solomon timber of cedar and timber of fir according to all his desire" (<a onClick="return mV(\'1Ki\',5,\'6-10\');">1Ki 5:6-10</a>). One of Solomon\'s most important buildings was known as "the house of the forest of Lebanon" (<a onClick="return mV(\'1Ki\',7,2);">1Ki 7:2</a>; <a onClick="return mV(\'1Ki\',10,17);">10:17</a>; <a onClick="return mV(\'2Ch\',9,16);">2Ch 9:16</a>), on account of the source of its materials. While cedar was well adapted for beams (<a onClick="return mV(\'1Ki\',6,9);">1Ki 6:9</a>; <a onClick="return mV(\'Sgs\',1,17);">So 1:17</a>), boards (<a onClick="return mV(\'Sgs\',8,9);">So 8:9</a>), pillars (<a onClick="return mV(\'1Ki\',7,2);">1Ki 7:2</a>) and ceilings (<a onClick="return mV(\'Jer\',22,14);">Jer 22:14</a>), it was suited as well for carved work, such as idols (<a onClick="return mV(\'Isa\',44,14,15);">Isa 44:14-15</a>). It was also used for ships\' masts (<a onClick="return mV(\'Eze\',27,5);">Eze 27:5</a>).<P>4. Cedars in Modern Syria:<P>The Cedrus libani still survives in the mountains of Syria and flourishes in much greater numbers in the Taurus mountains. "There are groves of cedars above el-Ma\'acir, Baruk, \'Ain Zehaltah, Hadith, Besherri, and Sir" (Post, Flora, 751). Of these the grove at Besherri is of world-wide renown. It consists of a group of about 400 trees, among them some magnificent old patriarchs, which lies on the bare slopes of the Lebanon some 6,000 ft. above the sea. Doubtless they are survivors of a forest which here once covered the mountain slopes for miles. The half a dozen highest specimens reach a height of between 70 and 80 ft., and have trunks of a circumference of 40 ft. or more. It is impossible to estimate with any certainty their age, but they may be as much as 800, or even 1,000, years old. Though magnificent, these are by no means the largest of their kind. Some of the cedars of Amanus are quite 100 ft. high and the Himalayan cedar, Cedrus deodara, a variety of Cedrus libani, reaches a height of 150 ft. The impressiveness of the cedar lies, however, not so much in its height and massive trunk, as in the wonderful lateral spread of its branches, which often exceeds its height. The branches grow out horizontally in successive tiers, each horizontal plane presenting, when looked at from above, the appearance of a green sward. The leaves are about an inch long, arranged in clusters; at first they are bright green, but they change with age to a deeper tint with a glaucous hue; the foliage is evergreen, the successive annual growths of leaves each lasting two years. The cones, 4 to 6 inches long, are oval or oblong-ovate, with a depression at times at the apex; they require two years to reach maturity and then, unlike other conifers, they remain attached to the tree, dropping out their scales bearing the seeds.<P>The wood of the cedar, specially grown under the conditions of its natural habitat, is hard, close grained, and takes a high polish. It is full of resin (<a onClick="return mV(\'Psa\',92,14);">Ps 92:14</a>) which preserves it from rot and from worms. Cedar oil, a kind of turpentine extracted from the wood, was used in ancient times as a preservative for parchments and garments.``117';
isbe[1915]='Cedron`se\'-dron.`<a href="./study/isbe/search.html?string=KIDRON">KIDRON</a>`1';
isbe[1916]='Ceilan`se\'-lan.`<a href="./study/isbe/search.html?string=KILAN">KILAN</a>`1';
isbe[1917]='Ceiled; Ceiling`seld, sel\'-ing (the King James Version and the English Revised Version Cieled, Cieling; the Hebrew words for "ceiled" are chippah, caphan, sachiph; for "ceiling," cippun): Ceiling occurs only in <a onClick="return mV(\'1Ki\',6,15);">1Ki 6:15</a>. It comes from the root caphan, meaning "to cover." It has its common meaning of the upper surface of a room; there is, however, some doubt of the textual Ceiled is found in <a onClick="return mV(\'2Ch\',3,5);">2Ch 3:5</a> (chippah); <a onClick="return mV(\'Jer\',22,14);">Jer 22:14</a>; <a onClick="return mV(\'Hag\',1,4);">Hag 1:4</a> (caphan in both); <a onClick="return mV(\'Eze\',41,16);">Eze 41:16</a> (sachiph), the text of the last passage being doubtful. In none of these cases does "ceiled" refer to the upper surface of a room, but to the covering or paneling of the inner walls of a house with cedar or other costly wood. This is in accordance with a common early use of the English word, no longer frequent.``12';
isbe[1918]='Celebrate`sel\'-e-brat: Of the three Hebrew words so rendered halal, "to praise" is preeminently significant. It is an onomatopoetic word meaning "to give a clear sharp sound," as word in vocal rejoicing, celebration. Its equivalent in Ethiopic is ellell, German hallen, English halloo, and appears in the great choral word Hallelujah of the Hebrew religion. Passing into Christian use it has become the term most expressive of majestic praise. <a onClick="return mV(\'Psa\',113,\'1-\');">Psalms 113-118</a> and <a onClick="return mV(\'Psa\',136,\'1-\');">136</a> are called Hallel psalms. Found in Hezekiah\'s psalm of praise for his miraculous recovery: "Death cannot celebrate thee" (<a onClick="return mV(\'Isa\',38,18);">Isa 38:18</a>). chaghagh, root meaning "to move in a circle" hence, "to keep a festival" by sacred leaping and dancing; "celebrate (the Revised Version (British and American) "keep") a feast" (<a onClick="return mV(\'Lev\',23,41);">Le 23:41</a>); shabhath, "to rest," i.e. keep or observe a holy day; "celebrate (the Revised Version (British and American) "keep") your sabbath" (<a onClick="return mV(\'Lev\',23,32);">Le 23:32</a>).``139';
isbe[1919]='Celestial`se-les\'-chal (epouranios, "above the sky," "heavenly"): Peculiar to Paul\'s majestic argument on the resurrection: celestial verses terrestrial bodies (<a onClick="return mV(\'1Cr\',15,40);">1Co 15:40</a>) with reference possibly to sun and moon, etc., but more probably to the bodies of angels in distinction from those of beasts and mortal men (compare Christ\'s words, <a onClick="return mV(\'Mat\',22,30);">Mt 22:30</a>; <a onClick="return mV(\'Luk\',20,36);">Lu 20:36</a>); including also doubtless in the apostle\'s thought the resurrection-body of Jesus and of the saints already taken-into glory. Light is thrown on its meaning by the rendering of the same Greek original as "heavenly places" (<a onClick="return mV(\'Eph\',1,3,20);">Eph 1:3, 20</a>; <a onClick="return mV(\'Eph\',2,6);">2:6</a>; <a onClick="return mV(\'Eph\',3,10);">3:10</a>); "heavenly" (<a onClick="return mV(\'1Cr\',15,48);">1Co 15:48</a>). Hence, "celestial" as used by Paul indicates the soul\'s continued life beyond the grave, the spiritual body of the redeemed in heaven, who, in Christ, have put on immortality.``139';
isbe[1920]='Cellar`sel\'-er, sel\'-ar (krupte; \'otsar): Krupte is found only in <a onClick="return mV(\'Luk\',11,33);">Lu 11:33</a>, and is rendered "cellar" in the Revised Version (British and American); the King James Version has "secret place." In this passage it doubtless means a cellar beneath a house. Etymologically the Greek word means "a covered place," and in classical Greek its usage includes vaults and crypts as well as cellars. It seems evident that it was only the larger houses in Palestine in which cellars were used with any frequency. It is shown by the excavations that in rebuilding a town which was in ruins the old houses were sometimes utilized as cellars for the new. \'otsar, is rendered cellar only in <a onClick="return mV(\'1Ch\',27,27);">1Ch 27:27</a>f. It is an erroneous rendering, the correct meaning being stores, or supplies, of wine and oil.``12';
isbe[1921]='Celosyria`se-lo-sir\'-i-a.`<a href="./study/isbe/search.html?string=COELE+SYRIA">COELE-SYRIA</a>`1';
isbe[1922]='Cenchreae`sen\'-kre-e (Kegchreai, Westcott and Hort, The New Testament in Greek Kenchreai; the King James Version incorrectly Cenchrea): A seaport of Corinth on the eastern side of the isthmus (see <a href="./study/isbe/search.html?string=CORINTH">CORINTH</a>). Here according to <a onClick="return mV(\'Act\',18,18);">Ac 18:18</a>, Paul had his hair shorn before sailing for Syria, since he had a vow. A local church must have been established there by Paul, since Phoebe, the deaconess of Cenchrea, was entrusted with the Epistle to the Romans, and was commended to them in the highest terms by the apostle, who charged them to "assist her in whatsoever matter she may have need" (<a onClick="return mV(\'Rom\',16,1,2);">Ro 16:1-2</a>).``1';
isbe[1923]='Cendebaeus`sen-de-be\'-us (Kendebaios; the King James Version Cendebeus): A general of Antiochus VII who was appointed "captain of the seacoast" of Palestine (1Macc 15:38ff) after the defeat of Tryphon by Antiochus 138 BC. He fortified Kedron and harassed the Jews in various ways. As Simon Maccabeus was too old to attack Cendebaeus in person he sent his two eldest sons, Judas and John, who defeated him with great loss at Modin (1Macc 16:1-10).``1';
isbe[1924]='Censer`sen\'-ser: In the King James Version censer is used as a translation of two Hebrew words, namely, machtah, and miqtereth. The former word is generally rendered "censer," sometimes "firepan," and in three cases (<a onClick="return mV(\'Exd\',25,38);">Ex 25:38</a>; <a onClick="return mV(\'Exd\',37,23);">37:23</a>; <a onClick="return mV(\'Num\',4,9);">Nu 4:9</a>) "snuffdish" It denoted a bowl-shaped vessel used for different purposes, namely,<P>(1) a censer, in which incense was burnt (<a onClick="return mV(\'Lev\',10,1);">Le 10:1</a>);<P>(2) a firepan, made of bronze, used in connection with the altar of burnt offering (<a onClick="return mV(\'Exd\',27,3);">Ex 27:3</a>);<P>(3) a snuffdish, i.e. a receptacle to hold pieces of burnt lamp-wick removed by the tongs or snuffers (<a onClick="return mV(\'Exd\',25,38);">Ex 25:38</a>).<P>Probably in all these cases the same kind of vessel was meant, namely, a bowl-shaped utensil with a handle, not unlike a saucepan. The other Hebrew word (derived from the same root as the word for "incense") denoted a vessel for conveying incense (<a onClick="return mV(\'Eze\',8,11);">Eze 8:11</a>; <a onClick="return mV(\'2Ch\',26,19);">2Ch 26:19</a>). The Greek word thumiaterion, by which the Septuagint rendered miqtereth, is used also in <a onClick="return mV(\'Hbr\',9,4);">Hebrews 9:4</a>, where the King James Version gives "censer," but the American Standard Revised Version is probably more correct, namely, "altar of incense" (see Commentaries under the word). Compare also <a onClick="return mV(\'Rev\',8,3,5);">Re 8:3, 5</a>, where libanotos, properly the adjective of "frankincense," is translated "censer."``103';
isbe[1925]='Census`sen\'-sus.`<a href="./study/isbe/search.html?string=DAVID">DAVID</a>; <a href="./study/isbe/search.html?string=QUIRINIUS">QUIRINIUS</a>`1';
isbe[1926]='Centurion`sen-tu\'-ri-un: As the name implies, hekatontarches or hekatontarchos, kenturion, Latin centurio, was the commander of a hundred men, more or less, in a Roman legion. Matthew and Luke use the Greek word while Mark prefers the Latin form, as he does in the case of other words, seeing that he wrote primarily for Roman readers. The number of centurions in a legion was 60, that being at all epochs the number of centuries, although the number varied in the cohort or speira. The ordinary duties of the centurion were to drill his men, inspect their arms, food and clothing, and to command them in the camp and in the field. Centurions were sometimes employed on detached service the conditions of which in the provinces are somewhat obscure. Men like Cornelius and Julius (<a onClick="return mV(\'Act\',10,1);">Ac 10:1</a>; <a onClick="return mV(\'Act\',27,1);">27:1</a>) may have been separated from the legion to which they properly belonged for the discharge of special duties. They and other centurions mentioned in the Gospels and the Acts (<a onClick="return mV(\'Mat\',8,5);">Mt 8:5</a>; <a onClick="return mV(\'Mar\',15,39,44,45);">Mr 15:39, 44-45</a>; <a onClick="return mV(\'Luk\',23,47);">Lu 23:47</a>) are represented by the sacred writers in a favorable light.`<a href="./study/isbe/search.html?string=AUGUSTAN+BAND">AUGUSTAN BAND</a>`128';
isbe[1927]='Cephas`se\'-fas.`<a href="./study/isbe/search.html?string=PETER,+SIMON">PETER (SIMON)</a>`1';
isbe[1928]='Ceras`se\'-ras (Keras; the Revised Version (British and American) <a href="./study/isbe/search.html?string=KERAS">KERAS</a> (which see)).``1';
isbe[1929]='Certain; Certainly; Certainty`ser\'-tin, ser\'-tin-li, ser\'tin-ti: The rendering of some Hebrew words and forms expressive of what is definitely settled or determined.<P>(1) Translation of the Hebrew nakhon, "to be established" or "fixed," as in <a onClick="return mV(\'Deu\',13,14);">De 13:14 (Hebrew 15)</a>; <a onClick="return mV(\'Deu\',17,4);">De 17:4</a>; <a onClick="return mV(\'1Sa\',23,23);">1Sa 23:23</a> (of <a onClick="return mV(\'Exd\',16,4);">Ex 16:4</a>, "a certain rate every day" the King James Version). In the New Testament it is the rendering of asphales, asphaleia, from "a" privative and sphallein, "to shake" or "move"; as in <a onClick="return mV(\'Luk\',1,4);">Lu 1:4</a>, "the certainty of those things" = actual circumstances; <a onClick="return mV(\'Act\',21,34);">Ac 21:34</a>; <a onClick="return mV(\'Act\',22,30);">22:30</a>; <a onClick="return mV(\'Act\',25,26);">25:26</a>.<P>(2) The word "certain" is also employed in the Old Testament to bring out the force of the absolute infinitive form used with the finite verb to express emphasis or to strengthen the idea of the main verb (Kautzsch-Gesenius, Hebrew Grammar, translation Collins-Cowley, 357, 3). Such usage occurs in <a onClick="return mV(\'Gen\',18,10);">Ge 18:10</a>; <a onClick="return mV(\'Jos\',9,24);">Jos 9:24</a>; <a onClick="return mV(\'Lev\',5,19);">Le 5:19</a>; <a onClick="return mV(\'Lev\',24,16);">24:16</a>; <a onClick="return mV(\'1Sa\',20,3);">1Sa 20:3</a> the King James Version; <a onClick="return mV(\'1Ki\',2,37);">1Ki 2:37</a>; <a onClick="return mV(\'Jer\',26,15);">Jer 26:15</a>; <a onClick="return mV(\'Jer\',36,29);">36:29</a>; <a onClick="return mV(\'Jer\',42,19,22);">42:19, 22</a>; <a onClick="return mV(\'Jer\',44,17);">44:17</a>.<P>(3) The word "certain" is also made auxiliary to bring out the force of such expressions as the Hebrew yatsabh, "to be firm," as in <a onClick="return mV(\'Dan\',2,8);">Da 2:8</a>; also in the New Testament, of the verb astatein as in <a onClick="return mV(\'1Cr\',4,11);">1Co 4:11</a>, "have no certain dwelling-place."<P>(4) Mention might be made also of "certain" as the rendering of sundry words, as \'akh, in <a onClick="return mV(\'Lam\',2,16);">La 2:16</a>; ki, in <a onClick="return mV(\'Exd\',3,12);">Ex 3:12</a>; and ontos, in <a onClick="return mV(\'Luk\',23,47);">Lu 23:47</a>, all being expressions for what is sure, beyond doubt.``164';
isbe[1930]='Certify`ser\'-ti-fi: Occurs in<P>(1) <a onClick="return mV(\'2Sa\',15,28);">2Sa 15:28</a> (haggidh, "to show," "announce," from naghadh);<P>(2) <a onClick="return mV(\'Ezr\',4,14,16);">Ezr 4:14, 16</a>; <a onClick="return mV(\'Ezr\',5,10);">5:10</a>; <a onClick="return mV(\'Ezr\',7,24);">7:24</a> (hodha\', "to make known," from yedha\'; Aramaic for yadha\');<P>(3) <a onClick="return mV(\'Est\',2,22);">Es 2:22</a> the King James Version (\'amar, "to say," "tell," so the Revised Version (British and American)); and<P>(4) <a onClick="return mV(\'Gal\',1,11);">Ga 1:11</a> the King James Version gnorizo, "to make to know," so the Revised Version (British and American).<P>In the English Versions of the Bible, accordingly, the word has not the strong, specific sense of "to make certain," but only the broader sense of "to make to know." Compare <a onClick="return mV(\'Psa\',39,5);">Ps 39:5</a> (Prayer Book version), "that I may be certified how long I have to live."``1';
isbe[1931]='Cetab`se\'-tab.`<a href="./study/isbe/search.html?string=KETAB">KETAB</a>`1';
isbe[1932]='Chabris`ka\'-bris (Abris, Chabreis): Son of Gothoniel, one of the three rulers of Bethulia in the time of Judith (Judith 6:15; 8:10; 10:6).``1';
isbe[1933]='Chadias, they of; Chadiasai`ka\'-di-as, ka\'-di-a-si; (the Revised Version (British and American) Codex Alexandrinus, Chadasai; Codex Vaticanus, hoi Chadiasai): The inhabitants of the city here referred to returned with Zerubbabel, along with the Ammidioi (1Es 5:20). The name is not found in Ezra and Nehemiah. The Chadiasai have been taken for the people of Kadesh and the Ammidioi for the people of Humtah (<a onClick="return mV(\'Jos\',15,54);">Jos 15:54</a>). Possibly the place is identical with Kedesh of <a onClick="return mV(\'Jos\',15,23);">Jos 15:23</a>.``1';
isbe[1934]='Chaereas`ke\'-re-as (Chaireas; the King James Version Chereas): Brother of Timotheus, the Ammonite leader against Judas Maccabeus (1Macc 5:6). He held the fortress of Gazara (the "Jazer" of 1Macc 5:8) to which Timotheus fled from Judas. The latter pursued him and captured the fortress after a vigorous siege. In the slaughter which followed the two brothers, Chaereas and Timotheus, were killed (2Macc 10:32,37).``1';
isbe[1935]='Chafe`chaf (mar, "bitter"; hence, bitter of soul, deadly, destructive, ferocious, "as a bear robbed of her whelps"): Occurs only in <a onClick="return mV(\'2Sa\',17,8);">2Sa 17:8</a>; used by Hushai to characterize David\'s supposedly fierce mood at the time of Absalom\'s armed rebellion.``1';
isbe[1936]='Chaff`chaf: Four different words have been translated "chaff" in the Old Testament:<P>(1) mots, is found in <a onClick="return mV(\'Job\',21,18);">Job 21:18</a>; <a onClick="return mV(\'Psa\',1,4);">Ps 1:4</a>; <a onClick="return mV(\'Psa\',35,5);">35:5</a>; <a onClick="return mV(\'Isa\',17,13);">Isa 17:13</a>; <a onClick="return mV(\'Isa\',29,5);">29:5</a>; <a onClick="return mV(\'Isa\',41,15);">41:15</a>; <a onClick="return mV(\'Hsa\',13,3);">Ho 13:3</a>; <a onClick="return mV(\'Zep\',2,2);">Ze 2:2</a>.<P>(2) chashash, occurs in two verses (<a onClick="return mV(\'Isa\',5,24);">Isa 5:24</a>; <a onClick="return mV(\'Isa\',33,11);">33:11</a>). Compare "chashish," an Arabic word which, as commonly used, denotes grass either standing or cut, green or dry, although, strictly speaking, dry or cut grass alone. In the Revised Version (British and American) <a onClick="return mV(\'Isa\',5,24);">Isa 5:24</a> the translation is "dry grass."<P>(3) tebhen, is translated "chaff" in the King James Version (<a onClick="return mV(\'Jer\',23,28);">Jer 23:28</a>). The same word is rendered "straw" in the Revised Version (British and American) (compare Arabic tibn).<P>(4) \'ur, a Chaldaic word, occurs in <a onClick="return mV(\'Dan\',2,35);">Da 2:35</a>.<P>In the New Testament achuron, is found in <a onClick="return mV(\'Mat\',3,12);">Mt 3:12</a> and <a onClick="return mV(\'Luk\',3,17);">Lu 3:17</a>.<P>In the process of winnowing, as it has been carried on in the East for thousands of years, the grain is tossed into the air so that the wind may cause a separation of chaff and straw. The light husks from the wheat and fine particles of straw are dispersed by the wind in the form of a fine dust; the heavier straw which has been broken into short pieces by the threshing process falls near at hand on the edge of the threshing-floor, while the grain falls back upon the pile. In Syria and Palestine, that which falls near at hand as cut straw is called tibn. This word occurs in the Arabic translation of <a onClick="return mV(\'Mat\',3,12);">Mt 3:12</a> and <a onClick="return mV(\'Luk\',3,17);">Lu 3:17</a>. This straw is ordinarily saved and fed as "roughage" to the animals. It could easily be gathered and burned, as indicated in the above-mentioned verses, while the chaff is blown away beyond recovery, a strong figure to depict complete annihilation (<a onClick="return mV(\'Job\',21,18);">Job 21:18</a>; <a onClick="return mV(\'Isa\',29,5);">Isa 29:5</a>; <a onClick="return mV(\'Isa\',41,16);">41:16</a>; <a onClick="return mV(\'Hsa\',13,3);">Ho 13:3</a>; <a onClick="return mV(\'Dan\',2,35);">Da 2:35</a>).`<a href="./study/isbe/search.html?string=AGRICULTURE">AGRICULTURE</a>; <a href="./study/isbe/search.html?string=STRAW">STRAW</a>; <a href="./study/isbe/search.html?string=WINNOWING">WINNOWING</a>`133';
isbe[1937]='Chain; Chains`chan, chanz: Chains were used by the Hebrews:<P>(1) As ornaments: \'ets\'adhah, netiphah, \'anaq, rabhidh, sharsherah, rattoq. As ornaments for the person they were worn about the ankles (<a onClick="return mV(\'Num\',31,50);">Nu 31:50</a>; <a onClick="return mV(\'Isa\',3,20);">Isa 3:20</a>) and about the neck (<a onClick="return mV(\'Sgs\',4,9);">So 4:9</a>; <a onClick="return mV(\'Eze\',16,11);">Eze 16:11</a>). They were used as ornaments for the ephod and breastplate of the high priest (<a onClick="return mV(\'Exd\',28,14);">Ex 28:14</a>; <a onClick="return mV(\'Exd\',39,15);">39:15</a>). These chains were of pure gold. Solomon placed chains before the oracle in the temple (<a onClick="return mV(\'1Ki\',6,21);">1Ki 6:21</a>), and these were also of pure gold. They were used as ornaments for graven images (<a onClick="return mV(\'Isa\',40,19);">Isa 40:19</a>) and around the necks of prized animals. This was true of the camels taken from the Midianites by Gideon (<a onClick="return mV(\'Jdg\',8,21,26);">Jud 8:21, 26</a>).<P>(2) As marks of distinction: rabhidh, hamunekh (hamnikh): That seems to be true of the chain which Pharaoh placed about the neck of Joseph (<a onClick="return mV(\'Gen\',41,42);">Ge 41:42</a>), and of the one which the king of Babylon promised to the wise men (<a onClick="return mV(\'Dan\',5,7);">Da 5:7</a>).<P>(3) As means of confining prisoners: nechosheth; halusis: A number of passages that were translated "chains" in the King James Version are translated "fetters" in the Revised Version (British and American) (see <a onClick="return mV(\'Jdg\',16,21);">Jud 16:21</a>; <a onClick="return mV(\'2Sa\',3,34);">2Sa 3:34</a>). Among the Romans the prisoner was chained to one or two guards (<a onClick="return mV(\'Act\',12,6,7);">Ac 12:6-7</a>; <a onClick="return mV(\'Act\',21,33);">21:33</a>; <a onClick="return mV(\'Eph\',6,20);">Eph 6:20</a>; <a onClick="return mV(\'2Ti\',1,16);">2Ti 1:16</a>). These chains were perhaps made of copper or an alloy of copper and tin.<P>(4) As a figurative expression: \'anaq. The Psalmist likens pride to a chain about the neck (<a onClick="return mV(\'Psa\',73,6);">Ps 73:6</a>), and in Pr it is stated that the young man who hears the instruction of his father and forsakes not the law of his mother shall find that they are chains about his neck (<a onClick="return mV(\'Pro\',1,9);">Pr 1:9</a>). In <a onClick="return mV(\'Rev\',20,1);">Re 20:1</a> the angel is described as descending with a great chain in his hand. According to the King James Version Peter speaks of the fallen angels as having been delivered into "chains of darkness" (<a onClick="return mV(\'2Pe\',2,4);">2Pe 2:4</a>), seira, and Jude speaks of them as being reserved in "everlasting chains" (<a onClick="return mV(\'Jud\',1,6);">Jude 1:6</a>, the Revised Version (British and American) "bonds"), desmos.`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`62';
isbe[1938]='Chair`char.`<a href="./study/isbe/search.html?string=SEAT">SEAT</a>; <a href="./study/isbe/search.html?string=SEATS,+CHIEF">SEATS, CHIEF</a>`1';
isbe[1939]='Chalcedony`kal-sed\'-o-ni, kal\'-se-do-ni.`<a href="./study/isbe/search.html?string=STONES,+PRECIOUS">STONES, PRECIOUS</a>`1';
isbe[1940]='Chalcol`kal\'-kol.`<a href="./study/isbe/search.html?string=CALCOL">CALCOL</a>`1';
isbe[1941]='Chaldea; Chaldeans`kal-de\'-a, kal-de\'-anz (kasdim, \'erets kasdim; Chaldaia, Chaldaioi):<P>1. Geographical Position<P class="in15">Seats of the Chaldeans<P>2. Originally Sumero-Akkadian<P>3. History of the Chaldean Tribes<P>4. Merodach-baladan and Sargon of Assyria<P>5. Suzubu<P>6. Musezib-Marduk<P>7. Merodach-baladan\'s Son<P>8. Na\'id-Marduk<P>9. Palia<P>10. Nabu-bel-sumati and Others<P class="in15">His Tragic End<P>11. The Chaldeans Forge Ahead<P>12. Nabopolassar\'s Revolt against Assyria<P>13. The Chaldeans as Learned Men<hr /><P>"Kasdim," "land of Kasdim" or "the Chaldeans," is the usual designation, in the Old Testament, for the land and the people (<a onClick="return mV(\'Jer\',50,10);">Jer 50:10</a>; <a onClick="return mV(\'Jer\',51,24);">51:24</a>; <a onClick="return mV(\'Jer\',24,5);">24:5</a>; <a onClick="return mV(\'Jer\',25,12);">25:12</a>). The corresponding Greek form with l for s follows the Assyr-Bab Kaldu, mat Kaldi, "Chaldean, land of the Chaldeans." Kasdim is possibly connected with the name of Kesed (Kesedh), nephew of Abraham (<a onClick="return mV(\'Gen\',22,22);">Ge 22:22</a>), and may be derived from the Assyr-Bab root kasadu, "to capture," suggesting that the Chaldeans were originally tribes of nomadic plunderers (compare <a onClick="return mV(\'Job\',1,17);">Job 1:17</a>).<P>1. Geographical Position:<P>Seats of the Chaldeans:<P>In its widest acceptation, Chaldea is the name of the whole of Babylonia, owing to the fact that the Chaldeans had given more than one king to the country. In the strict sense, however, their domain was the tract at the Northwest end of the Persian Gulf, which was often called by the Assyro-Babylonians mat Tamtim, "the Land of the Sea," a province of unknown extent. When these tribes migrated into Babylonia is uncertain, as is also their original home; but as they are closely related to the Arameans, it is possible that their first settlements lay in the neighborhood of the Aramean states bordering on the Holy Land. Tiglath-pileser IV (742 BC) speaks of the ra\'asani or chiefs of the Kaldu, and the mention of numerous Aramean tribes in Babylonia itself shows that their example of settling there soon found imitators, as did the Anglo-Saxons when they invaded Britain. Among the Chaldean tribes in Babylonia may be mentioned Bit Amukkani, whose capital was Sapia; Bit Yakin which furnished the dynasty to which Merodach-baladan II belonged; and probably also Bit Dakkuri, as all three lay near the Persian Gulf. Sargon of Assyria excludes Bit-Amukkani and Bit-Dakkuri, and speaks of "the whole of the land of Chaldea, as much as there is; the land of Bit-Yakini, on the shore of the Salt River (the Persian Gulf), to the border of Tilmun" (the island of Bahrein and the adjacent mainland) (Pavement Inscr., IV, ll. 82, 83, 85, 86). It was probably the influence of theBabylonians among whom they settled which changed these nomads into city-dwellers. Sennacherib refers to 75 (var. 89) strong cities and fortresses of Chaldea, and 420 (var. 800) smaller towns which were around them; and there were also Chaldeans (and Arameans) in Erech, Nippur (Calneh), Kis, Hursag-kalama, Cuthah, and probably Babylon.<P>2. Originally Sumero-Akkadian:<P>The "land of the sea" (mat Tamtim) is mentioned in the chronicle of the early Babylonian kings (rev. 14) as being governed by Ea-gamil, contemporary of Samsu-Titana (circa 1900 BC), but at that period it was apparently one of the original Sumero-Akkadian states of Babylonia. It is doubtful whether, at that early date, the Chaldeans had entered Babylonia and founded settlements there, though the record mentions Arameans somewhat later on.<P>3. History of the Chaldean Tribes:<P>One of the earliest references to the Chaldeans is that of Shalmaneser II of Assyria, who, on invading Babylonia in the eponymy of Belbunaya (851 BC), captured the city Baqani, which belonged to Adini of the Chaldean tribe of Dakuri. After plundering and destroying the place, Shalmaneser attacked Enzudi, the capital, whereupon Adini submitted and paid tribute. On this occasion Yakini of "the Land of the Sea," also paid tribute, as did Musallim-Marduk, son of Amukkani (the Bit-Amukkani mentioned above). The next Assyrian ruler to mention the country is Adadnirari III (810 BC), who speaks of all the kings of the Chaldeans, which evidently refers to the various states into which the Chaldean tribes were divided. Later on, Sargon of Assyria, in his 12th year, decided to break the power of Merodach-baladan, who had made himself master of Babylon. To effect this, he first defeated the Gambulians, who were the Chaldean king\'s supporters, and the Elamites, his allies over the border. The Chaldean, however, did not await the Assyrian king\'s attack, but escaped to Yatburu in Elam, leaving considerable spoil behind him.<P>4. Merodach-baladan and Sargon of Assyria:<P>Though extensive operations were carried out, and much booty taken, the end of the campaign seems only to have come two years later, when Dur-Yakin was destroyed by fire and reduced to ruins. In the "Annals of Hall XIV" Sargon claims to have taken Merodach-baladan prisoner, but this seems doubtful. Merodach-baladan fled, but returned and mounted the throne again on Sargon\'s death in 705 BC. Six months later Sennacherib, in his turn, attacked him, and he again sought safety in flight.<P>5. Suzubu:<P>A Chaldean chief named Suzubu, however, now came forward, and proclaimed himself king of Babylon, but being defeated, he likewise fled. Later on, Sennacherib attacked the Chaldeans at Nagitu and other settlements in Elamite-territory which Merodach-baladan and his followers had founded.<P>6. Musezib-Marduk:<P>After the death of Merodach-baladan, yet another Chaldean, whom Sennacherib calls likewise Suzubu, but whose full name was Musezib-Marduk, mounted the Babylonian throne. This ruler applied for help against Sennacherib of Assyria to Umman-menanu, the king of Elam, who, taking the bribe which was offered, supported him with an armed force, and a battle was fought at Chalule on the Tigris, in which Sennacherib claims the victory—probably rightly. Musezib-Marduk reigned 4 years, and was taken prisoner by his whilom ally, Umman-menanu, who sent him to Assyria.<P>7. Merodach-baladan\'s Son:<P>In the reign of Esarhaddon, Nabu-zer-napistilisir, one of the sons of Merodach-baladan, gathered an army at Larsa, but was defeated by the Assyrians, and fled to Elam. The king of that country, however, wishing to be on friendly terms with Esarhaddon, captured him and put him to death.<P>8. Na\'id-Marduk:<P>This prince had a brother named Na\'id-Marduk, who, not feeling himself safe in the country which had acted treacherously toward his house, fled, and made submission to Esarhaddon, who received him favorably, and restored to him the dominion of the "Land of the Sea." This moderation secured the fidelity of the Chaldeans, and when the Elamite Urtaku sent inviting them to revolt against their suzerain, they answered to the effect that Na\'id-Marduk was their lord, and they were the servants of the king of Assyria. This took place probably about 650 BC, in the reign of Esarhaddon\'s son Assur-bani-apli (see <a href="./study/isbe/search.html?string=OSNAPPAR">OSNAPPAR</a>).<P>9. Palia:<P>Hostility to Assyria, however, continued to exist in the tribe, Palia, grandson of Merodach-baladan, being one of the prisoners taken by Assur-bani-apli\'s troops in their operations against the Gambulians (a Babylonian, and perhaps a Chaldean tribe) later on. It was only during the struggle of Samas-sumukin (Saosduchimos), king of Babylon, Assur-banl-apli\'s brother, however, that they took sides against Assyria as a nationality. This change was due to the invitation of the Babylonian king—who may have been regarded, rather than Assur-bani-apli, as their overlord.<P>10. Nabu-bel-sumati:<P>The chief of the Chaldeans was at that time another grandson of Merodach-baladan, Nabu-bel-sumati, who seized the Assyrians in his domain, and placed them in bonds. The Chaldeans suffered, with the rest, in the great defeat of the Babylonian and allied forces, when Babylon and the chief cities of the land fell. Mannu-ki-Babili of the Dakkurians, Ea-sum-ikisa of Bit-Amukkani, with other Chaldean states, were punished for their complicity in Samas-sum-ukin\'s revolt, while Nabu-bel-sumati fled and found refuge at the court of Indabigas, king of Elam. Assur-bani-apli at once demanded his surrender, but civil war in Elam broke out, in which Indabigas was slain, and Ummanaldas mounted the throne.<P>His Tragic End:<P>This demand was now renewed, and Nabu-bel-sumati, fearing that he would be surrendered, decided to end his life. He therefore directed his armor-bearer to dispatch him, and each ran the other through with his sword. The prince\'s corpse, with the head of his armor-bearer, were then sent, with some of the Chaldean fugitives, to Assyria, and presented to the king. Thus ended, for a time, Chaldean ambition in Babylonia and in the domain of eastern politics.<P>11. The Chaldeans Forge Ahead:<P>With the death of Assur-bani-apli, which took place about 626 BC, the power of Assyria fell, his successors being probably far less capable men than he. This gave occasion for many plots against the Assyrian empire, and the Chaldeans probably took part in the general movement. In the time of Saracus (Sin-sarra-iskun of Assyria, circa 620 BC) Busalossor would seem to have been appointed general of the forces in Babylonia in consequence of an apprehended invasion of barbarians from the sea (the Persian Gulf) (Eusebius, Chronicon, book i).<P>12. Nabopolassar\'s Revolt against Assyria:<P>The new general, however, revolted against the Assyrians, and made himself master of Babylonia. As, in other cases, the Assyrians seem to have been exceedingly faithful to their king, it has been thought possible that this general, who was none other than Nabopolassar, the father of Nebuchadpolassar\'s rezzar, was not really an Assyrian, but a Babylonian, and probably a Chaldean. This theory; if correct, would explain how Babylonia, in its fullest sense, obtained the name of Chaldea, and was no longer known as the land of Shinar (<a onClick="return mV(\'Gen\',10,10);">Ge 10:10</a>). The reputation of Merodach-baladan, the contemporary of Hezekiah, may have been partly responsible for the change of name.<P>13. The Chaldeans as Learned Men:<P>It was not in the restricted sense, but as a synonym of Babylonian, that the name Chaldean obtained the signification of "wise man." That the Chaldeans in the restricted and correct sense were more learned than, or even as learned as, the Babylonians in general, is unlikely. Moreover, the native inscriptions give no indication that this was the case. The Babylonians in general, on the other hand, were enthusiastic students from very early times. From their inscriptions, it is certain that among their centers of learning may be classed Sippar and Larsa, the chief seats of sun-worship; Nippur, identified with the Calneh of <a onClick="return mV(\'Gen\',10,10);">Ge 10:10</a>; Babylon, the capital; Borsippa in the neighborhood of Babylon; Ur of the Chaldees; and Erech. There is, also, every probability that this list could be extended, and will be extended, when we know more; for wherever an important temple existed, there was to be found also a priestly school. "The learning of the Chaldeans" (<a onClick="return mV(\'Dan\',1,4);">Da 1:4</a>; <a onClick="return mV(\'Dan\',2,2);">2:2</a>; <a onClick="return mV(\'Dan\',4,7);">4:7</a>; <a onClick="return mV(\'Dan\',5,7,11);">5:7, 11</a>) comprised the old languages of Babylonia (the two dialects of Sumerian, with a certain knowledge of Kassite, which seems to have been allied to the Hittite; and other languages of the immediate neighborhood); some knowledge of astronomy and astrology; mathematics, which their sexagesimal system of numeration seems to have facilitated; and a certain amount of natural history. To this must be added a store of mythological learning, including legends of the Creation, the Flood (closely resembling in all its main points the account in the Bible), and apparently also the Temptation and the Fall. They had likewise a good knowledge of agriculture, and were no mean architects, as the many celebrated buildings of Babylonia show—compare not only the descriptions of the Temple of Belus (see <a href="./study/isbe/search.html?string=BABEL,+TOWER+OF">BABEL, TOWER OF</a>) and the Hanging Gardens, but also the remains of Gudea\'s great palace at Lagas (Tel-loh), where that ruler, who lived about 2500 BC, is twice represented as an architect, with plan and with rule and measure. (These statues are now in the Louvre.) That their architecture never attained the elegance which characterized that of the West, is probably due to the absence of stone, necessitating the employment of brick as a substitute (<a onClick="return mV(\'Gen\',11,3);">Ge 11:3</a>).`<a href="./study/isbe/search.html?string=BABYLONIA">BABYLONIA</a>; <a href="./study/isbe/search.html?string=SHINAR">SHINAR</a>`136';
isbe[1942]='Chalkstone`chok\'-ston (\'abhneghir (compare Eben-ezer, \'ebhen ha-\'ezer, "stone of the help," <a onClick="return mV(\'1Sa\',7,12);">1Sa 7:12</a>)): In <a onClick="return mV(\'Isa\',27,9);">Isa 27:9</a> we have: "Therefore by this shall the iniquity of Jacob be forgiven, and this is all the fruit of taking away his sin: that he maketh all the stones of the altar as chalkstones that are beaten in sunder, so that the Asherim and the sun-images shall rise no more." \'Abhne-ghir is compounded of \'ebhen, "stone," which occurs in many passages, and gir or gir, "lime" (compare Arabic jir, "gypsum" or "quicklime"), which occurs only here and in <a onClick="return mV(\'Dan\',5,5);">Da 5:5</a>: "wrote...upon the plaster (gir) of the wall of the king\'s palace." Nearly all the rock of Palestine is limestone. When limestone is burned, it is converted into lime, which is easily broken into pieces, and, if allowed to remain open to the air, becomes slaked by the moisture of the atmosphere and crumbles into dust. The reference is to the destruction of the altar. It may mean that the altar will be burned so that the stones will become lime, or, more probably, that the stones of the altar will be broken as chalkstones (i.e. lumps of quicklime) are broken. There is no doubt that lime was known to the Egyptians, Assyrians and Hebrews, though clay, with or without straw, was more commonly used in building. Even bitumen ("slime") appears to have been used for mortar.`<a href="./study/isbe/search.html?string=CLAY">CLAY</a>; <a href="./study/isbe/search.html?string=LIME">LIME</a>; <a href="./study/isbe/search.html?string=SLIME">SLIME</a>`37';
isbe[1943]='Challenge`chal\'-enj: Only in <a onClick="return mV(\'Exd\',22,9);">Ex 22:9</a>, where the King James Version has taken Hebrew \'amar, "say," in the sense of "claim." the Revised Version (British and American) "whereof one saith, This is it," points more definitely to the idea of identification of the stolen personal property.``1';
isbe[1944]='Chalphi`kal\'-fi (Chalphi; the King James Version Calphi): Father of Judas, who, along with Mattathias, steadily supported Jonathan at the battle of Gennesar when the hosts of Demetrius\' princes were routed (1Macc 11:70).``1';
isbe[1945]='Chamber`cham\'-ber (the translation of the following Hebrew words: chedher, chuppah, yatsia\', yatsua\', lishkah, nishkah, \'aliyah, tsela\', and the Aramaic word \'illith): For the most part the word chamber is the expression of an idea which would be adequately expressed by the English word "room," in accordance with an earlier use of the word, now little employed. For the arrangement of rooms in a Hebrew house, see <a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>. Chedher is a word of frequent occurrence, and designates a private room. Chuppah is translated "chamber" only in <a onClick="return mV(\'Psa\',19,5);">Ps 19:5</a>, where it is used in connection with "bridegroom," and means a bridal chamber. The same Hebrew word used of the bride in <a onClick="return mV(\'Joe\',2,16);">Joe 2:16</a> is rendered "closet." Yatsia\' and yatsua\' are found only in <a onClick="return mV(\'1Ki\',6,5,6,10);">1Ki 6:5-6, 10</a> (the King James Version only in all the passages), yatsua\' being the reading of Kethibh and yatsia\' of Kere in each ease. Here the meaning is really "story," as given in the Revised Version (British and American), except in <a onClick="return mV(\'1Ki\',6,6);">1Ki 6:6</a>, where doubtless the text should be changed to read ha-tsela\', "the side-chamber." Lishkah, a frequent word, and the equivalent nishkah, infrequent, are used ordinarily of a room in the temple utilized for sacred purposes, occasionally of a room in the palace. \'Aliyah and the equivalent Aramaic \'illith signify "a roof chamber," i.e. a chamber built on the flat roof of a house. Tsela\', when used of a chamber, designates a side-chamber of the temple. It is usually rendered "side-chamber," but "chamber" in <a onClick="return mV(\'1Ki\',6,5,8);">1Ki 6:5, 8</a> (the King James Version), where the Revised Version (British and American) has "side-chamber."``12';
isbe[1946]='Chamber, Roof``<a href="./study/isbe/search.html?string=CHAMBER">CHAMBER</a>`1';
isbe[1947]='Chambering`cham\'-ber-ing: Illicit intercourse; the rendering in English Versions of the Bible since Tyndale of koitias (literally "beds," <a onClick="return mV(\'Rom\',13,13);">Ro 13:13</a>). The Greek usage is paralleled in classic authors and the Septuagint; like the English participle, it denotes repeated or habitual acts. The word is not recorded elsewhere in English literature as verb or participle in this sense; in Othello, iii,3,a chamberer is an intriguer, male wanton, in Byron, Werner, IV, 1, 404, a gallant or carpet knight, and in Chaucer, Clerk\'s Tale, 766, a concubine.``1';
isbe[1948]='Chamberlain`cham\'-ber-lin: In the Old Testament the word rendered chamberlain, caric, is more properly "eunuch," an officer which oriental monarchs placed over their harems (<a onClick="return mV(\'Est\',1,10,12,15);">Es 1:10, 12, 15</a>; <a onClick="return mV(\'Est\',2,3,14,21);">2:3, 14, 21</a>; <a onClick="return mV(\'Est\',4,4);">4:4</a>f; <a onClick="return mV(\'Est\',6,2,14);">6:2,14</a>; <a onClick="return mV(\'Est\',7,9);">7:9</a>; <a onClick="return mV(\'2Ki\',23,11);">2Ki 23:11</a>). This officer seems also to have had other duties. See under <a href="./study/isbe/search.html?string=EUNUCH">EUNUCH</a>. In the New Testament:<P>(1) oikonomos, literally manager of the household, apparently the "treasurer" as in the Revised Version (British and American) "Erastus the treasurer of the city saluteth you" (<a onClick="return mV(\'Rom\',16,23);">Ro 16:23</a>). Compare adapted use as applied to Christian apostles and teachers, bishops, and even to individual members; in which cases, rendered "stewards" (<a onClick="return mV(\'1Cr\',4,1);">1Co 4:1</a>; <a onClick="return mV(\'Tts\',1,7);">Tit 1:7</a>; <a onClick="return mV(\'1Pe\',4,10);">1Pe 4:10</a>).<P>(2) In <a onClick="return mV(\'Act\',12,20);">Ac 12:20</a>, "Blastus the king\'s chamberlain" (ho epi toa koitonos tou basileos, "he who is over the king\'s bed-chamber"), not treasure-chamber, as above; here praefectus cubiculo, or chief valet de chambre to the royal person, a position involving much honor and intimacy.``137';
isbe[1949]='Chambers in the Heavens``<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>; <a href="./study/isbe/search.html?string=DIAL+OF+AHAZ">DIAL OF AHAZ</a>`1';
isbe[1950]='Chambers in the South``<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>; <a href="./study/isbe/search.html?string=SOUTH,+CHAMBERS+OF+THE">SOUTH, CHAMBERS OF THE</a>`1';
isbe[1951]='Chambers of Imagery`im\'-aj-ri, im\'-a-jer-i (maskith): The reference (<a onClick="return mV(\'Eze\',8,12);">Eze 8:12</a>) is to chambers in the temple where the elders of Israel were wont to assemble and practice rites of an idolatrous character. What the imagery consisted of, we may gather from <a onClick="return mV(\'Eze\',8,10);">8:10</a>: symbolic representations of beasts and reptiles and "detestable things." It is thought that these symbols were of a zodiacal character. The worship of the planets was in vogue at the time of the prophet among the degenerate Israelites.``1';
isbe[1952]='Chameleon`ka-me\'-le-un (koach, the Revised Version (British and American) <a href="./study/isbe/search.html?string=LAND+CROCODILE">LAND CROCODILE (<a onClick="return mV(\'Lev\',11,30);">Le 11:30</a>); tinshemeth, the King James Version mole, the Revised Version (British and American) <a href="./study/isbe/search.html?string=CHAMELEON">CHAMELEON</a> (<a onClick="return mV(\'Lev\',11,30);">Le 11:30</a>):<P>Koach, which in the King James Version is rendered "chameleon" and in the Revised Version (British and American) "land crocodile," means also "strength" or "power," as in <a onClick="return mV(\'Gen\',4,12);">Ge 4:12</a>; <a onClick="return mV(\'1Sa\',2,9);">1Sa 2:9</a>; <a onClick="return mV(\'Psa\',22,15);">Ps 22:15</a>; <a onClick="return mV(\'Isa\',40,29);">Isa 40:29</a>, and many other passages. The Septuagint has chamaileon, but on account of the ordinary meaning of the word, koach, it has been thought that some large lizard should be understood here. The desert monitor, Varanus griseus, one of the largest of lizards, sometime attaining the length of 4 ft., is common in Palestine and may be the animal here referred to. The name "monitor" is a translation of the German warnen, "to warn," with which has been confused the Arabic name of this animal, waran or waral, a word of uncertain etymology.<P>The word tinshemeth in the same verse is rendered in the King James Version "mole" and in the Revised Version (British and American) "chameleon." The Septuagint has aspalax (= spalax, "mole"). Tinshemeth also occurs in the lists of unclean birds in <a onClick="return mV(\'Lev\',11,18);">Le 11:18</a> and <a onClick="return mV(\'Deu\',14,16);">De 14:16</a>, where it is rendered: the King James Version "swan"; the Revised Version (British and American) "horned owl"; Septuagint porphurion (i.e. "coot" or, according to some, "heron"); Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) cygnus, "swan." It appears to come from the root nasham, "to breathe"; compare neshamah, "breath" (<a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a>; <a onClick="return mV(\'Job\',27,3);">Job 27:3</a> the King James Version, etc.). It has therefore in <a onClick="return mV(\'Lev\',11,30);">Le 11:30</a> been referred to the chameleon on account of the chameleon\'s habit of puffing up its body with air and hissing, and in the other passages to the pelican, on account of the pelican\'s great pouched bill.<P>The common chameleon is abundant in Palestine, being found also in North Africa and in Spain. The other species of chameleons are found principally in Africa and Madagascar. It is not only a harmless but a decidedly useful creature, since it feeds upon insects, especially flies. Its mode of capturing its prey is most interesting. It slowly and cautiously advances until its head is from 4 to 6 inches from the insect, which it then secures by darting out its tongue with great rapidity. The pigment cells in its skin enable it to change its color from pale yellow to bright green, dark green and almost black, so that it can harmonize very perfectly with its surroundings. Its peculiar toes and prehensile tail help to fit it for its life in the trees. Its prominent eyes with circular lids, like iris diaphragms can be moved independently of each other, and add to its striking appearance.``37';
