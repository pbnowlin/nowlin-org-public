isbe[1953]='Chamois`sham\'-i, sha-mwa\', sha-moi\' (zemer; kamelopdrdalis): Occurs only once in the Bible, i.e. in the list of clean animals in <a onClick="return mV(\'Deu\',14,5);">De 14:5</a>. Gesenius refers to the verb zamar, "to sing," and suggests the association of dancing or leaping, indicating thereby an active animal. M\'Lean in Encyclopedia Biblica cites the rendering of the Targums dica\', or "wild goat." Now there are two wild goats in Palestine. The better known is the ibex of the south, which may well be the ya\'el (English Versions, "wild goat"; <a onClick="return mV(\'Job\',39,1);">Job 39:1</a>; <a onClick="return mV(\'Psa\',104,18);">Ps 104:18</a>; <a onClick="return mV(\'1Sa\',24,2);">1Sa 24:2</a>), as well as the \'aqqo (English Version, "wild goat," <a onClick="return mV(\'Deu\',14,5);">De 14:5</a>). The other is the pasang or Persian wild goat which ranges from the Northeast of Palestine and the Syrian desert to Persia, and which may be the zemer (English Versions "chamois"). The accompanying illustration, which is taken from the Royal Natural History, shows the male and female and young. The male is distinguished by its larger horns and goatee. The horns are in size and curvature very similar to those of the ibex (see <a href="./study/isbe/search.html?string=GOAT">GOAT</a>, section 2), but the front edge is like a nicked blade instead of being thick and knotty as in the ibex. Like the ibex it is at home among the rocks, and climbs apparently impossible cliffs with marvelous ease.<P>Tristram (NHB) who is followed by Post (HDB) suggests that zemer may be the Barbary sheep (Ovis tragelaphus), though the latter is only known to inhabit the Atlas Mountains, from the Atlantic to Tunis. Tristram supports his view by reference to a kebsh ("ram") which the Arabs say lives in the mountains of Sinai, though they have apparently neither horns nor skins to show as trophies, and it is admitted that no European has seen it. The true chamois (Rupicapra tragus) inhabits the high mountains from the Pyrenees to the Caucasus, and there is no reason to suppose that it was ever found in Syria or Palestine.``37';
isbe[1954]='Champaign`sham-pan\', sham\'-pan (\'arabhah, biq\'ah): A champaign is a flat open country, and the word occurs in <a onClick="return mV(\'Deu\',11,30);">De 11:30</a> the King James Version (the Revised Version (British and American) "the Arabah") as a translation of \'arabhah, for which the King James Version has in most places "the plain," and the Revised Version (British and American) "the Arabah," when it is used with the article and denotes a definite region, i.e. the valley of the Jordan from the Sea of Galilee to the Dead Sea (<a onClick="return mV(\'Deu\',2,8);">De 2:8</a>; <a onClick="return mV(\'Deu\',3,17);">3:17</a>; <a onClick="return mV(\'Deu\',4,4);">4:4:9</a>; <a onClick="return mV(\'Jos\',3,16);">Jos 3:16</a>; <a onClick="return mV(\'Jos\',8,14);">8:14</a>; <a onClick="return mV(\'Jos\',11,16);">11:16</a>; <a onClick="return mV(\'Jos\',12,1,3,8);">12:1, 3, 8</a>; <a onClick="return mV(\'2Sa\',2,29);">2Sa 2:29</a>; <a onClick="return mV(\'2Sa\',4,7);">4:7</a>; <a onClick="return mV(\'2Ki\',14,25);">2Ki 14:25</a>; <a onClick="return mV(\'2Ki\',25,4);">25:4</a>; <a onClick="return mV(\'Jer\',39,4);">Jer 39:4</a>; <a onClick="return mV(\'Jer\',52,7);">52:7</a>), and also the valley running southward from the Dead Sea to the Gulf of Akabah (<a onClick="return mV(\'Deu\',1,1);">De 1:1</a>). <a onClick="return mV(\'Eze\',47,8);">Eze 47:8</a> has for ha-\'arabhah "the desert," the King James Version margin "plain," the Revised Version (British and American) "the Arabah." The plural is used in <a onClick="return mV(\'Jos\',5,10);">Jos 5:10</a>; <a onClick="return mV(\'2Ki\',25,5);">2Ki 25:5</a>, "the plains of Jericho," and in <a onClick="return mV(\'Num\',22,1);">Nu 22:1</a>; <a onClick="return mV(\'Num\',26,3);">26:3</a>, "the plains of Moab." Elsewhere \'arabhah is rendered in English Versions of the Bible "desert" or "wilderness" (<a onClick="return mV(\'Job\',24,5);">Job 24:5</a>; <a onClick="return mV(\'Job\',39,6);">39:6</a>; <a onClick="return mV(\'Isa\',33,9);">Isa 33:9</a>; <a onClick="return mV(\'Isa\',35,1,6);">35:1, 6</a>; <a onClick="return mV(\'Isa\',40,3);">40:3</a>; <a onClick="return mV(\'Isa\',41,19);">41:19</a>; <a onClick="return mV(\'Isa\',51,3);">51:3</a>; <a onClick="return mV(\'Jer\',2,6);">Jer 2:6</a>; <a onClick="return mV(\'Jer\',17,6);">17:6</a>; <a onClick="return mV(\'Jer\',50,12);">50:12</a>). At the present day, the Jordan va lley is called the Ghaur (compare Hebrew \'ur, "to dig," me\'arah, "cave," and Arabic magharah, "cave"). This name is also applied to the deltas of streams flowing into the Dead Sea from the east, which are clothed with thickets of thorny trees and shrubs, i.e. Ghaur-ul-Mezra\'ah, at the mouths of Wadi-Kerak and Wadi-Beni-Chammad, Ghaur-uc-Cafiyeh, at the mouth of Wadi-ul-Hisa. The name "Arabah" (Arabic al-\'Arabah) is now confined to the valley running southward from the Dead Sea to the Gulf of Akabah, separating the mountains of Edom from Sinai and the plateau of at-Tih.<P>See <a href="./study/isbe/search.html?string=ARABAH">ARABAH</a>.<P><a onClick="return mV(\'Eze\',37,2);">Eze 37:2</a> the King James Version margin has "champaign" for biq\'ah, which is elsewhere rendered "vale" or "valley." Biq\'ah seems to be applied to wide, open valleys, as: "the valley of Jericho" (<a onClick="return mV(\'Deu\',34,3);">De 34:3</a>), "the valley of Megiddo" (<a onClick="return mV(\'2Ch\',35,22);">2Ch 35:22</a>; <a onClick="return mV(\'Zec\',12,11);">Zec 12:11</a>), "the valley of Lebanon" (<a onClick="return mV(\'Jos\',11,17);">Jos 11:17</a>). If Baal-Gad be Ba\'albeq and "the valley of Lebanon" be Coele-syria, the present name of Coele-syria, al-Biqa\' (plural of buq\'ah, "a low, wet place or meadow"), may be regarded as a survival of the Hebre w biq\'ah.``37';
isbe[1955]='Champion`cham\'-pi-un (\'ish habenayim): In <a onClick="return mV(\'1Sa\',17,4,23);">1Sa 17:4, 23</a> this unusual expression occurs in the description of Goliath. It means literally "the man of the two spaces," "spaces," or "space between," and is perhaps to be explained by the fact that there was a brook flowing through the valley separating the two armies. In <a onClick="return mV(\'1Sa\',17,51);">1Sa 17:51</a> the word champion is the rendering of the Hebrew gibbor, "mighty man."``1';
isbe[1956]='Chanaan; Chanaanite`ka\'-nan, ka\'-na-an, ka\'-nan-it (Chanaan), the King James Version in the Apocrypha (Judith 5:3,16) and New Testament (<a onClick="return mV(\'Act\',7,11);">Ac 7:11</a>; <a onClick="return mV(\'Act\',13,19);">13:19</a>) for the Revised Version (British and American) <a href="./study/isbe/search.html?string=CANAAN,+CANAANITE">CANAAN, CANAANITE</a> (which see).``1';
isbe[1957]='Chance`chans: The idea of chance in the sense of something wholly fortuitous was utterly foreign to the Hebrew creed. Throughout the whole course of Israel\'s history, to the Hebrew mind, law, not chance, ruled the universe, and that law was not something blindly mechanical, but the expression of the personal Yahweh. Israel\'s belief upon this subject may be summed up in the couplet, " The lot is cast into the lap; But the whole disposing thereof is of Yahweh" (<a onClick="return mV(\'Pro\',16,33);">Pr 16:33</a>). A number of Hebrew and Greek expressions have been translated "chance," or something nearly equivalent, but it is noteworthy that of the classical words for chance, suntuchia, and tuche, the former never occurs in the Bible and the latter only twice in the Septuagint.<P>The closest approach to the idea of chance is found in the statement of the Philistines that if their device for ascertaining the cause of their calamities turned out a certain way they would call them a chance, that is, bad luck (miqreh, <a onClick="return mV(\'1Sa\',6,9);">1Sa 6:9</a>). But note that it was a heathen people who said this. We have the same Hebrew noun and the verb, from which the noun is taken, a number of times, but variously rendered into English: Uncleanness that "chanceth him by night" (<a onClick="return mV(\'Deu\',23,10);">De 23:10</a>). "Her hap was to light on the portion of the field" (<a onClick="return mV(\'Rth\',2,3);">Ru 2:3</a>). "Something hath befallen him" (<a onClick="return mV(\'1Sa\',20,26);">1Sa 20:26</a>). "One event happeneth to them all" (<a onClick="return mV(\'Ecc\',2,14,15);">Ec 2:14-15</a>); "that which befalleth the sons of men" ("sons of men are a chance," the English Revised Version, margin) (<a onClick="return mV(\'Ecc\',3,19);">Ec 3:19</a>). "There is one event to the righteous and to the wicked" (<a onClick="return mV(\'Ecc\',9,2,3);">Ec 9:2-3</a>). Here the idea certainly is not something independent of the will of God, but something unexpected by man.<P>There is also qara\', "If a bird\'s nest chance to be before thee in the way" (<a onClick="return mV(\'Deu\',22,6);">De 22:6</a>). Both the above Hebrew words are combined in the statement "As I happened by chance upon Mount Gilboa" (<a onClick="return mV(\'2Sa\',1,6);">2Sa 1:6</a>). "And Absalom chanced to meet the servants of David" ("met the servants," <a onClick="return mV(\'2Sa\',18,9);">2Sa 18:9</a>, the King James Version). "And there happened to be there a base fellow" (<a onClick="return mV(\'2Sa\',20,1);">2Sa 20:1</a>).<P>We have also pegha\', "Time and chance happeneth to them all," meaning simply occurrence (<a onClick="return mV(\'Ecc\',9,11);">Ec 9:11</a>). "Neither adversary, nor evil occurrence" (<a onClick="return mV(\'1Ki\',5,4);">1Ki 5:4</a>).<P>In the New Testament we have sugkuria, "coincidence," a meeting apparently accidental, a coincidence. "By chance a certain priest was going down that way" (<a onClick="return mV(\'Luk\',10,31);">Lu 10:31</a>). Also ei tuchoi. "It may chance of wheat, or of some other kind," i.e. we cannot tell which (<a onClick="return mV(\'1Cr\',15,37);">1Co 15:37</a>). "It may be" (<a onClick="return mV(\'1Cr\',14,10);">1Co 14:10</a>).<P>If we look at the Septuagint we find tuche used twice. "And Leah said, (En tuche) With fortune" ("a troop cometh," the King James Version; "fortunate," the Revised Version (British and American); "with fortune," the Revised Version, margin, <a onClick="return mV(\'Gen\',30,11);">Ge 30:11</a>). Note, it was no Israelite, but who said this. "That prepare a table for Fortune, and that fill up mingled wine unto Destiny" ("fate," <a onClick="return mV(\'Isa\',65,11);">Isa 65:11</a>). In this passage tuche stands or the Hebrew meni, the god of destiny, and Fortune is for Gad, the old Semitic name for the god of fortune found in inscriptions, private names, etc. Note here, however, also, that the prophet was rebuking idolatrous ones for apostasy to heathen divinities.<P>We have also in the Apocrypha, "these things which have chanced," the Revised Version (British and American) "to be opened unto thee" (2Esdras 10:49).`<a href="./study/isbe/search.html?string=GAD">GAD</a>; <a href="./study/isbe/search.html?string=MENI">MENI</a>`177';
isbe[1958]='Chancellor`chan\'-sel-er: The rendering in <a onClick="return mV(\'Ezr\',4,8,9,17);">Ezr 4:8-9, 17</a> of the Hebrew be\'el Te\'em; Septuagint Baal (<a onClick="return mV(\'Ezr\',4,9);">4:9</a>), Balgam (<a onClick="return mV(\'Ezr\',4,17);">4:17</a>), the latter being an incorrect translation of Hebrew \'ayin. In 1Esdras 2:16, 25, Beeltethmos (compare <a onClick="return mV(\'Ezr\',4,8);">Ezr 4:8</a>) occurs as a corruption, doubtless of be\'el Te\'em. The term in question designates an Assyrian office, namely, that of the "master or lord of official intelligence," or "postmaster" (Sayce).``1';
isbe[1959]='Change`chanj: A word which seeks to express the many shades of meaning contained in 13 variations of 9 Hebrew words and 5 Greek. These signify, in turn, "to change" "to exchange," "to turn," "to put or place," "to make other" i.e. "alter," "to disguise oneself." chalaph, and its derivatives, occuring often, indicates "to pass away," hence, alter, renew, e.g.:<P>(1) "changes of raiment" (<a onClick="return mV(\'Gen\',45,22);">Ge 45:22</a>; <a onClick="return mV(\'Jdg\',14,12,13,19);">Jud 14:12-13, 19</a>);<P>(2) "changed my wages ten times" (<a onClick="return mV(\'Gen\',31,7,41);">Ge 31:7, 41</a>);<P>(3) heavens changed "as a vesture" (<a onClick="return mV(\'Psa\',102,26);">Ps 102:26</a>);<P>(4) "changes and warfare" (<a onClick="return mV(\'Job\',10,17);">Job 10:17</a>), i.e. relays of soldiers as illustrated in <a onClick="return mV(\'1Ki\',5,14);">1Ki 5:14</a> (the Revised Version, margin "host after host is against me");<P>(5) "till my change come" (the Revised Version (British and American) "release"), i.e. death (<a onClick="return mV(\'Job\',14,14);">Job 14:14</a>);<P>(6) "changed the ordinances" (the American Standard Revised Version "violated the statutes"), i.e. disregarded law (<a onClick="return mV(\'Isa\',24,5);">Isa 24:5</a>);<P>(7) change of mind (<a onClick="return mV(\'Hab\',1,11);">Hab 1:11</a> the King James Version). <p>Used also of change of character, haphakh:<P>(1) of leprosy, "changed unto white" (<a onClick="return mV(\'Lev\',13,16);">Le 13:16</a>);<P>(2) figuratively of the moral life, "Can the Ethiopian change his skin?" (<a onClick="return mV(\'Jer\',13,23);">Jer 13:23</a>); so also mur, and derivatives, "changed their gods" and "their glory," etc. (<a onClick="return mV(\'Psa\',106,20);">Ps 106:20</a>; <a onClick="return mV(\'Jer\',2,11);">Jer 2:11</a>; <a onClick="return mV(\'Hsa\',4,7);">Ho 4:7</a>).<P>Other words used to indicate change of name (<a onClick="return mV(\'2Ki\',24,17);">2Ki 24:17</a>); of day and night (<a onClick="return mV(\'Job\',17,12);">Job 17:12</a>); of times and seasons (<a onClick="return mV(\'Dan\',2,21);">Da 2:21</a>); of countenance. (<a onClick="return mV(\'Dan\',7,28);">Da 7:28</a>); of behavior (<a onClick="return mV(\'1Sa\',21,13);">1Sa 21:13</a>); God\'s unchangeableness, "I, Yahweh, change not" (<a onClick="return mV(\'Mal\',3,6);">Mal 3:6</a>).<P>In the New Testament the word has to do chiefly with spiritual realities:<P>(1) metatithemi, of the necessary change of the priesthood and law under Christ (<a onClick="return mV(\'Hbr\',7,12);">Heb 7:12</a>);<P>(2) allatto, of His changing the customs of Moses (<a onClick="return mV(\'Act\',6,14);">Ac 6:14</a>);<P>(3) of moral change, e.g. debasement (<a onClick="return mV(\'Rom\',1,23,25,26);">Ro 1:23, 25-26</a>);<P>(4) of bodily change at the resurrection (<a onClick="return mV(\'1Cr\',15,51,52);">1Co 15:51-52</a>; metaschematizo, <a onClick="return mV(\'Phl\',3,21);">Php 3:21</a> the King James Version);<P>(5) metaballo, of change of mind in presence of a miracle (<a onClick="return mV(\'Act\',28,6);">Ac 28:6</a>);<P>(6) of the change to come over the heavens at the great day of the Lord (<a onClick="return mV(\'Hbr\',1,12);">Heb 1:12</a>; compare <a onClick="return mV(\'2Pe\',3,10,12);">2Pe 3:10, 12</a>).<P>Figurative uses indicated separately in the course of the article.``139';
isbe[1960]='Change of Raiment`ra\'-ment.`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>`1';
isbe[1961]='Changer`chan\'-jer (kollubistes, "money-changer," and so rendered <a onClick="return mV(\'Mat\',21,12);">Mt 21:12</a>; <a onClick="return mV(\'Mar\',11,15);">Mr 11:15</a>): A banker or other person who changes money at a fixed rate. Indignant at the profane traffic in the temple Jesus "poured out the changers\' money" (<a onClick="return mV(\'Jhn\',2,15);">Joh 2:15</a>). So used only here.`<a href="./study/isbe/search.html?string=BANK">BANK</a>; <a href="./study/isbe/search.html?string=MONEY+CHANGERS">MONEY-CHANGERS</a>`1';
isbe[1962]='Channel`chan\'-el (\'aphiq (root \'aphaq, "to hold or contain," "to be strong"; compare Arabic \'afaq "to overcome" and \'afiq, "preeminent"); shibboleth (shabhal, "to go," "to go up or grow," "to flow"; compare Arabic \'asbal, "to flow," "to rain," "to put forth ears"; sabalat, "an ear of grain"; sabil, "a road," "a public fountain")): In <a onClick="return mV(\'Job\',12,21);">Job 12:21</a>; <a onClick="return mV(\'Job\',40,18);">40:18</a>; <a onClick="return mV(\'Job\',41,15);">41:15</a> we have \'aphiq in the sense of "strong" (but compare <a onClick="return mV(\'Job\',40,18);">40:18</a>, the Revised Version (British and American) "tubes" (of brass)). Elsewhere it is translated "river," "brook," "stream," "channel" or "watercourse." Shibboleth (in the dialect of Ephraim cibboleth (<a onClick="return mV(\'Jdg\',12,6);">Jud 12:6</a>)) means "an ear of grain" (<a onClick="return mV(\'Gen\',41,5);">Ge 41:5</a>ff; <a onClick="return mV(\'Rth\',2,2);">Ru 2:2</a>; <a onClick="return mV(\'Isa\',17,5);">Isa 17:5</a>) or "a flood of water" (<a onClick="return mV(\'Psa\',69,2,15);">Ps 69:2, 15</a>; <a onClick="return mV(\'Isa\',27,12);">Isa 27:12</a>). In <a onClick="return mV(\'2Sa\',22,16);">2Sa 22:16</a> (compare <a onClick="return mV(\'Psa\',18,15);">Ps 18:15</a>) we have: " Then the channels of the sea appeared, The foundations of the world were laid bare, By the rebuke of Yahweh, At the blast of the breath of his nostrils." This is reminiscent of "fountains of the deep" (<a onClick="return mV(\'Gen\',7,11);">Ge 7:11</a>; <a onClick="return mV(\'Gen\',8,2);">8:2</a>; <a onClick="return mV(\'Pro\',8,28);">Pr 8:28</a>). It is a question how far we should attribute to these ancient writers a share in modern notions of oceanography, but the idea seems to be that of a withdrawal of the water of the ocean, and the laying bare of submarine declivities and channels such as we know to exist as the result of erosion during a previous period of elevation, when the given portion of ocean floor was dry land.<P>The fact that many streams of Palestine flow only during the rainy season seems to be referred to in <a onClick="return mV(\'Job\',6,15);">Job 6:15</a>; and perhaps also in <a onClick="return mV(\'Psa\',126,4);">Ps 126:4</a>.`<a href="./study/isbe/search.html?string=BROOK">BROOK</a>; <a href="./study/isbe/search.html?string=RIVER">RIVER</a>`37';
isbe[1963]='Chant`(paraT): Occurs only once in the King James Version in <a onClick="return mV(\'Amo\',6,5);">Am 6:5</a>, and the meaning of the Hebrew is uncertain. Parat corresponds to an Arabic root meaning to anticipate. It may therefore signify to improvise, to sing without care or preparation. the Revised Version (British and American) "to sing idle songs" suits the context. See Driver, Joel and Amos.``1';
isbe[1964]='Chanuneus`ka-nun\'-e-us (Chanounaios; the King James Version Channuneus): A Levite in the list of 1Esdras 8:48, probably corresponding to "Merari" in <a onClick="return mV(\'Ezr\',8,19);">Ezr 8:19</a>.``1';
isbe[1965]='Chapel`chap\'-el (miqdash, "a holy place"; the Revised Version (British and American) <a href="./study/isbe/search.html?string=SANCTUARY">SANCTUARY</a>, which see): "It is the king\'s chapel" (<a onClick="return mV(\'Amo\',7,13);">Am 7:13</a> the King James Version), an expression indicative of the dependence of this sanctuary on the court.``1';
isbe[1966]='Chaphenatha`ka-fen\'-a-tha (Chaphenatha; the King James Version Caphenatha): A name apparently given to part of the eastern wall of Jerusalem or a fort in that neighborhood which is said (1Macc 12:37) to have been repaired by Jonathan Maccabeus. The place cannot now be identified. Various speculations have been made as to the origin of the name, but they can hardly be said to throw any light on the passage cited.``1';
isbe[1967]='Chapiter`chap\'-i-ter.`<a href="./study/isbe/search.html?string=ARCHITECTURE">ARCHITECTURE</a>; <a href="./study/isbe/search.html?string=JACHIN+AND+BOAZ">JACHIN AND BOAZ</a>; <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</a>`1';
isbe[1968]='Chapman`chap\'-man (plural \'anshe ha-tarim): Word used only once in the King James Version (<a onClick="return mV(\'2Ch\',9,14);">2Ch 9:14</a>, the American Standard Revised Version "the traders"; compare also <a onClick="return mV(\'1Ki\',10,15);">1Ki 10:15</a> the Revised Version (British and American), where the Hebrew uses the same expression). The English word means "merchant"; compare the verb "to chaffer," and the German Kaufmann. The Hebrew means "those who go about" as merchants.``1';
isbe[1969]='Chapt`(chathath): The Hebrew term chathath means "broken," "terrified" or "dismayed." This term as it occurs in <a onClick="return mV(\'Jer\',14,4);">Jer 14:4</a> is rendered "chapt" in English Versions of the Bible, "cracked" in the American Standard Revised Version, and "dismayed" in the Revised Version, margin. Inasmuch as the Hebrew term means "broken," it is not incorrectly rendered "chapt" or "chapped," which means to be cracked open.``1';
isbe[1970]='Charaathalan`kar-a-ath\'-a-lan (Charaathalan; the King James Version Charaathalar (1Esdras 5:36)): Most probably a corruption of the text. The names "Cherub, Addan, and Immer" in the lists of <a onClick="return mV(\'Ezr\',2,59);">Ezr 2:59</a> and <a onClick="return mV(\'Neh\',7,61);">Ne 7:61</a> are presented in the text cited as "Charaathalan leading them, and Allar."``1';
isbe[1971]='Characa`kar\'-a-ka.`<a href="./study/isbe/search.html?string=CHARAX">CHARAX</a>`1';
isbe[1972]='Charashim`kar\'-a-shim (charashim, "craftsmen").`<a href="./study/isbe/search.html?string=GE+HARASHIM">GE-HARASHIM</a>`1';
isbe[1973]='Charax; Characa`kar\'-ax, kar\'-a-ka; (eis ton Charaka; the King James Version Charax): A place mentioned only in 2Macc 12:17. It lay east of the Jordan and is said to be 750 stadia from Caspis, and to be inhabited by Jews called Tubieni, that is, of Tobie (Tob) in Gilead (1Macc 5:9,13; 2Macc 12:17). There is no clue as to the direction in which Ch. lay from Caspis. Possibly Kerak (Kir-moab), in post-Biblical times called Charamoba and Moboucharax, may represent the place. It lay about 100 miles south of el-Mezerib, southeast of the Dead Sea.``1';
isbe[1974]='Charchemish`kar\'-ke-mish.`<a href="./study/isbe/search.html?string=CARCHEMISH">CARCHEMISH</a>`1';
isbe[1975]='Charchus`kar\'-kus.`<a href="./study/isbe/search.html?string=BARCHUS">BARCHUS</a>`1';
isbe[1976]='Charea`kar\'-re-a (Charea): Head of a family of temple-servants (1Esdras 5:32); called "Harsha" in <a onClick="return mV(\'Ezr\',2,52);">Ezr 2:52</a>; <a onClick="return mV(\'Neh\',7,54);">Ne 7:54</a>.``1';
isbe[1977]='Charge; Chargeable`charj, char\'-ja-b\'-l (from Latin carrus, "a wagon," hence, "to lay or put a load on or in," "to burden, or be a burden"):<P>Figurative:<P>(1) of a special duty mishmereth, ("thing to be watched"), "the charge of Yahweh" (<a onClick="return mV(\'Lev\',8,35);">Le 8:35</a>), the injunctions given in <a onClick="return mV(\'Exd\',29,1);">Ex 29</a>; "the charge of the tabernacle" (<a onClick="return mV(\'Num\',1,53);">Nu 1:53</a>); "the charge of the sons of Getshon" (<a onClick="return mV(\'Num\',3,25);">Nu 3:25</a>);<P>(2) of the burden of expense (kabhedh, "to be, or make heavy"; adapanos, "without expense"), "lest we be chargeable unto thee" (<a onClick="return mV(\'2Sa\',13,25);">2Sa 13:25</a> the King James Version, the Revised Version (British and American) "burdensome"); "The former governors...were charge unto the people" (<a onClick="return mV(\'Neh\',5,15);">Ne 5:15</a> margin "laid burdens upon"); "that...I may make the gospel without charge" (<a onClick="return mV(\'1Cr\',9,18);">1Co 9:18</a>; see <a href="./study/isbe/search.html?string=CHARGES">CHARGES</a>);<P>(3) of oversight, care, custody, "Who gave him a charge over the earth?" (<a onClick="return mV(\'Job\',34,13);">Job 34:13</a>); "to have the charge of the gate" (<a onClick="return mV(\'2Ki\',7,17);">2Ki 7:17</a>); "charge of the vessels of service" (<a onClick="return mV(\'1Ch\',9,28);">1Ch 9:28</a>); "cause ye them that have charge (pequddoth, "inspectors") over the city" (<a onClick="return mV(\'Eze\',9,1);">Eze 9:1</a>); "who had the charge of all her treasure" (<a onClick="return mV(\'Act\',8,27);">Ac 8:27</a> the King James Version, the Revised Version (British and American) "was over");<P>(4) of a command, injunction, requirement, "He gave him a charge" (<a onClick="return mV(\'Gen\',28,6);">Ge 28:6</a>); "His father charged the people with the oath" (<a onClick="return mV(\'1Sa\',14,27);">1Sa 14:27</a>); "Jesus strictly (margin "sternly") charged them" (<a onClick="return mV(\'Mat\',9,30);">Mt 9:30</a>); "I charge you by the Lord" (<a onClick="return mV(\'1Th\',5,27);">1Th 5:27</a> the King James Version, the Revised Version (British and American) "adjure"); "having received such a charge" (<a onClick="return mV(\'Act\',16,24);">Ac 16:24</a>, paraggelia, "private or extra message"); "This charge I commit unto thee" (<a onClick="return mV(\'1Ti\',1,18);">1Ti 1:18</a>);<P>(5) of blame, responsibility, reckoning, "Lord, lay not this sin to their charge" (<a onClick="return mV(\'Act\',7,60);">Ac 7:60</a>); "nothing laid to his charge" (<a onClick="return mV(\'Act\',23,29);">Ac 23:29</a>); "Who shall lay anything to the charge of God\'s elect?" (<a onClick="return mV(\'Rom\',8,33);">Ro 8:33</a>).``91';
isbe[1978]='Charger`char\'-jer (the American Standard Revised Version "platter"): A word which meant in the older English speech a flat dish or platter. It is used in the Bible as the translation:<P>(1) of qe\'arah, which in <a onClick="return mV(\'Num\',7,19);">Nu 7:19</a> the King James Version (the Revised Version (British and American) "platter") and repeatedly in that chapter denotes one of the gifts made by the several princes at the dedication of the tabernacle;<P>(2) of \'aghartal, a word of uncertain derivation used in <a onClick="return mV(\'Ezr\',1,9);">Ezr 1:9</a> (the King James Version) twice to designate certain temple vessels which might better be called "libation bowls";<P>(3) of pinax, used <a onClick="return mV(\'Mat\',14,8,11);">Mt 14:8, 11</a>; <a onClick="return mV(\'Mar\',6,25,28);">Mr 6:25, 28</a> (EV) for the dish in which the head of John the Baptist was presented.``51';
isbe[1979]='Charges`char\'-jiz (dapanao, "to spend"): "Be at charges for them" (<a onClick="return mV(\'Act\',21,24);">Ac 21:24</a>, the King James Version "with them"), i.e. pay the sacrificial expenses of these poorer Nazirites (compare Josephus, Ant, XIX, xvi, 1).``1';
isbe[1980]='Chariot`char\'-i-ot (merkabh, merkabhah, "riding-chariot," rekhebh, "war-chariot"; harma):<P>1. Chariots of Egypt<P>2. Chariots of the Canaanites<P>3. Chariots of Solomon and Later Kings<P>4. Chariots of the Assyrians<P>5. Chariots of Chaldeans, Persians, Greeks<P>6. In the New Testament<P>7. Figurative Use<P>LITERATURE<hr /><P>1. Chariots of Egypt:<P>It is to the chariots of ancient Egypt that reference is first made in Scripture. Joseph was honored by being made to ride in the second chariot of King Pharaoh (<a onClick="return mV(\'Gen\',41,43);">Ge 41:43</a>). Joseph paid honor to his father on his arrival in Goshen by meeting him in his chariot (<a onClick="return mV(\'Gen\',46,29);">Ge 46:29</a>). In the state ceremonial with which the remains of Jacob were escorted to Canaan, chariots and horsemen were conspicuous (<a onClick="return mV(\'Gen\',50,9);">Ge 50:9</a>). In the narrative of the departure of the Israelites from Egypt and of Pharaoh\'s futile attempts to detain them the chariots and horsemen of Pharaoh figure largely (<a onClick="return mV(\'Exd\',14,17,18,23,25);">Ex 14:17-18, 23, 25</a>; <a onClick="return mV(\'Exd\',15,4,19);">15:4, 19</a>). It was with the Hyksos invasion, some centuries before the Exodus, that the horse, and subsequently the chariot, were introduced for purposes of war into Egypt; and it may have been the possession of chariots that enabled those hated shepherd warriors to overpower the native Egyptians. The Egyptian chariot was distinguished by its lightness of build. It was so reduced in weight that it was possible for a man to carry his chariot on his shoulders without fatigue. The ordinary chariot was made of wood and leather, and had only two occupants, the fighting man and his shield-bearer. The royal chariots were ornamented with gold and silver, and in the battle of Megiddo Thothmes III is represented as standing in his chariot of electrum like the god of war, brandishing his lance. In the battle the victorious Egyptians captured 2,041 horses and 924 chariots from the Syrian allies.<P>2. Chariots of the Canaanites:<P>The Canaanites had long been possessed of horses and chariots when Joshua houghed their horses and burnt their chariots with fire at the waters of Merom (<a onClick="return mV(\'Jos\',11,6,9);">Jos 11:6, 9</a>). The chariots of iron which the Canaanites could maneuvere in the plains and valleys proved a formidable obstacle to the complete conquest of the land (<a onClick="return mV(\'Jdg\',1,19);">Jud 1:19</a>). Jabin had 900 chariots of iron, and with them he was able to oppress the children of Israel twenty years (<a onClick="return mV(\'Jdg\',4,3);">Jud 4:3</a>). The Philistines of the low country and the maritime plain, of whom we read in Judges and Samuel, were a warlike people, were disciplined and well armed and their possession of chariots gave them a great advantage over the Israelites. In the war of Michmash they put into the field the incredible number of 30,000 chariots and 6,000 horsemen, only in the end to suffer a grievous defeat (<a onClick="return mV(\'1Sa\',13,5);">1Sa 13:5</a>; <a onClick="return mV(\'1Sa\',14,20);">14:20</a>). In the battle of Gilboa, however, the chariots and horsemen of the Philistines bore down all opposition, and proved the destruction of Saul and his house. Of these chariots there have come down to us no detailed description and no representation. But we cannot be far wrong in turning to the chariot of the Hittites as a type of the Canaanite and Philistine chariot. It is not from the monuments of the Hittites themselves, however, but from the representations of the Kheta of the Egyptian monuments, that we know what their chariots were like. Their chariotry was their chief arm of offense. The Hittite chariot was used, too, for hunting; but a heavier car with paneled sides was employed for war. The Egyptian monuments represent three Hittites in each car, a practice which differed from that of Egypt and attracted attention. Of the three, one guided the chariot, another did the fighting with sword and lance, and the third was the shield-bearer.<P>3. Chariots of Solomon and Later Kings:<P>The Israelites living in a mountainous country were tardy in adopting the chariot for purposes of war. David houghed all the chariot horses of Hadadezer, king of Zobah, and "reserved of them for a hundred chariots" (<a onClick="return mV(\'2Sa\',8,4);">2Sa 8:4</a>), and Adonijah prepared for himself chariots and horsemen with a view to contest the throne of his father (<a onClick="return mV(\'1Ki\',1,5);">1Ki 1:5</a>). But Solomon was the first in Israel to acquire chariots and horses on a national scale, and to build cities for their accommodation (<a onClick="return mV(\'1Ki\',9,19);">1Ki 9:19</a>). In Massoretic Text of the Old Testament we read that Solomon had agents who received droves of horses from Egypt, and it is added: "And a chariot came up and went out of Egypt for 600 shekels of silver, and a horse for 150; and so for all the kings of the Hittites, and for the kings of Syria, did they bring them out by their means" (<a onClick="return mV(\'1Ki\',10,29);">1Ki 10:29</a>). On the strength of a warrantable emendation of the text it is now proposed to read the preceding (<a onClick="return mV(\'1Ki\',10,28);">1Ki 10:28</a>): "And Solomon\'s import of horses was from Mucri and from Kue; the king\'s traders received them from Kue at a price"—where Mucri and Kue are North Syria and Cilicia. No doubt it was Egypt out of which the nation was forbidden by the Deuteronomic law to multiply horses (<a onClick="return mV(\'Deu\',17,16);">De 17:16</a>), but on the other hand the statement of Ezekiel (<a onClick="return mV(\'Eze\',27,14);">27:14</a>) that Israel derived horses, chargers and mules not from Egypt but from Togarmah—North Syria and Asia Minor—agrees with the new rendering (Burney, Notes on Hebrew Text of the Books of Kings, in the place cited.). From Solomon\'s time onward chariots were in use in both kingdoms. Zimri, who slew Elah, son of Baasha, king of Israel, was captain of half his chariots (<a onClick="return mV(\'1Ki\',16,9);">1Ki 16:9</a>). It was when sitting in his chariot in disguise beside the driver that Ahab received his fatal wound at Ramoth-gilead (<a onClick="return mV(\'1Ki\',22,34);">1Ki 22:34</a>). The floor of the royal chariot was a pool of blood, and "they washed the chariot by the pool of Samaria" (<a onClick="return mV(\'1Ki\',22,35,38);">1Ki 22:35, 38</a>). It was in his war-chariot that his servants carried Josiah dead from the fatal field of Megiddo (<a onClick="return mV(\'2Ki\',23,30);">2Ki 23:30</a>).<p>The chief pieces of the Hebrew chariot were<P>(1) the pole to which the two horses were yoked,<P>(2) the axle—resting upon two wheels with six or eight spokes (<a onClick="return mV(\'1Ki\',7,33);">1Ki 7:33</a>)—into which the pole was fixed,<P>(3) a frame or body open behind, standing upon the axle and fitted by a leather band to the pole.<P>The chariots of iron of which we read (<a onClick="return mV(\'Jdg\',4,3);">Jud 4:3</a>) were of wood strengthened or studded with iron. Like that of the Hittite, the Hebrew chariot probably carried three men, although in the chariot of Ahab (<a onClick="return mV(\'1Ki\',22,34);">1Ki 22:34</a>) and in that of Jehu (<a onClick="return mV(\'2Ki\',9,24);">2Ki 9:24</a>f) we read of only two.<P>4. Chariots of the Assyrians:<P>In the later days when the Assyrians overran the lands of the West, the Israelites had to face the chariots and the hosts of Sennacherib and of the kings (<a onClick="return mV(\'2Ki\',19,23);">2Ki 19:23</a>). And they faced them with chariots of their own. An inscription of Shalmaneser II of Assyria tells how in the battle of Karkar (854 BC) Ahab of the land of Israel had put into the field 2,000 chariots and 10,000 soldiers. But the Assyrian chariotry was too numerous and powerful for Israel. The Assyrian chariot was larger and heavier than the Egyptian or the Hebrew: it had usually three and sometimes four occupants (Maspero, Life in Ancient Egypt and Assyria, 322). When we read in Nahum\'s prophecy of "chariots flashing with steel," "rushing to and fro in the broad ways" (<a onClick="return mV(\'Nah\',2,3,4);">Na 2:3-4</a>), it is of the Assyrian chariots that we are to think being hastily got together for the defense of Nineveh.<P>5. Chariots of Chaldeans, Persians, Greeks:<P>In early Babylonian inscriptions of the 3rd millennium before Christ there is evidence of the use of the war-chariots, and Nebuchadrezzar in his campaigns to the west had chariots as part of his victorious host (<a onClick="return mV(\'Jer\',47,3);">Jer 47:3</a>). It was the Persians who first employed scythed chariots in war; and we find Antiochus Eupator in the Seleucid period equipping a Greek force against Judea which had 300 chariots armed with scythes (2Macc 13:2).<P>6. In the New Testament:<P>In the New Testament the chariot is only twice mentioned. Besides the chariot in which the Ethiopian eunuch was traveling when Philip the evangelist made up to him (<a onClick="return mV(\'Act\',8,28,29,38);">Ac 8:28-29, 38</a>), there is only the mention of the din of war-chariots to which the onrush of locusts in Apocalyptic vision is compared (<a onClick="return mV(\'Rev\',9,9);">Re 9:9</a>).<P>7. Figurative Use:<P>In the figurative language of Scripture, the chariot has a place. It is a tribute to the powerful influence of Elijah and Elisha when they are separately called "the chariots of Israel and the horsemen thereof" (<a onClick="return mV(\'2Ki\',2,12);">2Ki 2:12</a>; <a onClick="return mV(\'2Ki\',13,14);">13:14</a>). The angelic hosts are declared to be God\'s chariots, twice ten thousand, thousands upon thousands (<a onClick="return mV(\'Psa\',68,17);">Ps 68:17</a>). But chariots and horses themselves are a poor substitute for the might of God (<a onClick="return mV(\'Psa\',20,7);">Ps 20:7</a>). God Himself is represented as riding upon His chariots of salvation for the defense of His people (<a onClick="return mV(\'Hab\',3,8);">Hab 3:8</a>). In the Book of Zec, the four chariots with their horses of various colors have an apocalyptic significance (<a onClick="return mV(\'Zec\',6,1);">Zec 6</a>). In the worship of the host of heaven which prevailed in the later days of the kingdom of Judah, "<a href="./study/isbe/search.html?string=THE CHARIOTS OF THE SUN">the chariots of the sun</a>" (see article) were symbols which led the people into gross idolatry and King Josiah burnt them with fire (<a onClick="return mV(\'2Ki\',23,11);">2Ki 23:11</a>).<P>LITERATURE.<P>Nowack, Hebrew Archaeology, I, 366f; Garstang, Land of the Hittites, 363f; Maspero, Struggle of the Nations and Life in Ancient Egypt and Assyria; Rawlinson, Five Great Monarchies, II, 1-21.``128';
isbe[1981]='Chariots of the Sun`(markebhoth ha-shemesh): These, together with "horses of the sun," are mentioned in <a onClick="return mV(\'2Ki\',23,11);">2Ki 23:11</a>. They are said to have stood in the temple, a gift of the kings of Judah. Josiah removed the horses from the precincts of the temple and burned the chariots. Among the Greeks, Helios was endowed with horses and chariots. Thus the course of the sun as he sped across the skies was understood by the mythological mind of antiquity. The Babylonian god Shamash (= Hebrew Shemesh) likewise had his chariot and horses as well as his charioteer. The cult of the sun and other heavenly bodies which was particularly in vogue during the latter days of the Judean monarchy (compare <a onClick="return mV(\'2Ki\',23,5);">2Ki 23:5</a>; <a onClick="return mV(\'Eze\',8,16);">Eze 8:16</a>f; <a onClick="return mV(\'Deu\',17,3);">De 17:3</a>; <a onClick="return mV(\'Jer\',8,2);">Jer 8:2</a>) seems to have constituted an element of the Canaanitish religion (compare the names of localities like Beth-shemesh and the like). The chariots of the sun are also referred to in Enoch 72:5,37; 75:4, and Greek Apocrypha of Baruch 6.``115';
isbe[1982]='Charitably`char\'-i-ta-bli (kata agapen): The Revised Version (British and American), which substitutes "love" for "charity" regularly, removing the latter word from the vocabulary of Scripture, makes a like change in <a onClick="return mV(\'Rom\',14,15);">Ro 14:15</a>, the only occurrence of "charitably" in the King James Version; the Revised Version (British and American) "in love."`<a href="./study/isbe/search.html?string=CHARITY">CHARITY</a>`1';
isbe[1983]='Charity`char\'-i-ti (agape):<P>1. A New Word<P>2. A New Ideal<P>3. An Apostolic Term<P>4. Latin Equivalents<P>5. English Translation<P>6. Inward Motive<P>7. Character<P>8. Ultimate Ideal<p>9. Almsgiving<P>10. Tolerance<hr /><P>In the King James Version in 26 places from <a onClick="return mV(\'1Cr\',8,1);">1Co 8:1</a> onward. The same Greek word, which appears in the New Testament 115 times, is elsewhere translated by "love."<P>1. A New Word:<P>The substantive agape is mainly, if not exclusively, a Biblical and ecclesiastical word (see Deissmann, Bible Studies, 198ff), not found in profane writings, although the verb agapan, from which it is derived, is used in classical Greek in the sense of "love, founded in admiration, veneration, esteem, like the Latin diligere" (Grimm-Thayer), rather than natural emotion (Latin, amare).<P>2. A New Ideal:<P>It is a significant evidence of the sense of a new ideal and principle of life that permeated the Christian consciousness of the earliest communities, that they should have made current a new word to express it, and that they should derive that word, not from the current or philosophical language of Greek morality, but from the Septuagint.<P>3. An Apostolic Term:<P>In the New Testament the word is apostolic, and appears first and predominantly in the Pauline writings. It is found only twice in the Synoptics (<a onClick="return mV(\'Mat\',24,12);">Mt 24:12</a>; <a onClick="return mV(\'Luk\',11,42);">Lu 11:42</a>), and although it is in both places put in the mouth of the Saviour, it can easily be understood how the language of a later time may have been used by the narrator, when it is considered that these gospels were compiled and reduced to writing many years after the spread of the Pauline epistles. The word is not found in James, Mark or Acts, but it appears in Paul 75 times, in John 30 times, in Peter 4 times, in Jude twice and in Hebrews twice. Jesus Christ gave the thing and the spirit in the church, and the apostles (probably Paul) invented the term to express it.<P>4. Latin Equivalents:<P>When Jerome came to translate the Greek Testament into Latin, he found in that language no word to represent agape. Amor was too gross, and he fell back on dilectio and caritas, words which, however, in their original meanings were too weak and colorless to represent agape adequately. No principle seems to have guided him in the choice of the one word or the other in particular places.<P>5. English Translation:<P>Caritas in English became "charity," and was taken over by the English translators from the Vulg, though not with any regularity, nor as far as can be judged, according to any definite principle, except that it is used of agape only in man, never as it denotes a quality or action of God, which is always translated by "love." When agape is translated by "charity" it means either<P>(1) a disposition in man which may qualify his own character (<a onClick="return mV(\'1Cr\',8,1);">1Co 8:1</a>) and be ready to go forth to God (<a onClick="return mV(\'1Cr\',8,3);">1Co 8:3</a>) or to men; or<P>(2) an active and actual relation with other men, generally within the church (<a onClick="return mV(\'Col\',3,14);">Col 3:14</a>; <a onClick="return mV(\'1Th\',3,6);">1Th 3:6</a>; <a onClick="return mV(\'2Th\',1,3);">2Th 1:3</a>; <a onClick="return mV(\'1Ti\',1,5);">1Ti 1:5</a>; <a onClick="return mV(\'1Ti\',4,12);">4:12</a>; <a onClick="return mV(\'1Pe\',4,8);">1Pe 4:8</a>; <a onClick="return mV(\'1Pe\',5,14);">5:14</a>), but also absolutely and universally (<a onClick="return mV(\'1Cr\',13,\'1-\');">1Co 13</a>). In the earlier epistles it stands first and unique as the supreme principle of the Christian life (<a onClick="return mV(\'1Cr\',13,\'1-\');">1Co 13</a>), but in the later writings, it is enumerated as one among the Christian virtues (<a onClick="return mV(\'1Ti\',2,15);">1Ti 2:15</a>; <a onClick="return mV(\'2Ti\',2,22);">2Ti 2:22</a>; <a onClick="return mV(\'2Ti\',3,10);">3:10</a>; <a onClick="return mV(\'Tts\',2,2);">Tit 2:2</a>; <a onClick="return mV(\'2Pe\',1,7);">2Pe 1:7</a>; <a onClick="return mV(\'Rev\',2,19);">Re 2:19</a>).<P>6. Inward Motive:<P>In Paul\'s psalm of love (<a onClick="return mV(\'1Cr\',13,\'1-\');">1Co 13</a>) it is set forth as an innermost principle contrasted with prophecy and knowledge, faith and works, as the motive that determines the quality of the whole inner life, and gives value to all its activities. If a man should have all gifts of miracles and intellect, and perform all the works of goodness and devotion, "and have not love, it profiteth nothing," for they would be purely external and legal, and lacking in the quality of moral choice and personal relation which give life its value (<a onClick="return mV(\'1Cr\',13,\'1-3\');">1Co 13:1-3</a>). Love itself defines men\'s relation to men as generous, tolerant and forgiving.<P>7. Character:<P>"Love suffereth long, and is kind; love envieth not" (<a onClick="return mV(\'1Cr\',13,4);">1Co 13:4</a>). It determines and defines a man\'s own character and personality. It is not boastful and arrogant, but dignified, pure, holy, courageous and serene. Evil cannot provoke it nor wrong delight it. It bears cheerfully all adversity and follows its course in confident hope (<a onClick="return mV(\'1Cr\',13,\'4-7\');">1Co 13:4-7</a>). It is final virtue, the ultimate ideal of life. Many of life\'s activities cease or change, but "love never faileth."<P>8. Ultimate Ideal:<P>To it all other graces and virtues are subordinated. "Now abideth faith, hope, love, these three; and the greatest of these is love" (<a onClick="return mV(\'1Cr\',13,\'8-13\');">1Co 13:8-13</a>). In one passage only in the New Testament (<a onClick="return mV(\'3Jo\',1,6);">3Jo 1:6</a>) agape seems to have a meaning that comes near to the later, ecclesiastical meaning of charity as almsgiving.<P>9. Almsgiving:<P>With the growing legalism of the church and the prevalence of monastic ideals of morality, caritas came to mean the very opposite of Paul\'s agape—just "the giving of goods to feed the poor," which "without love profiteth nothing." At present, the word means either liberality to the poor, or tolerance in judging the actions of others, both qualities of love, but very inadequate to express its totality.<P>10. Tolerance:<P>The Revisers have therefore accurately dropped the word and substituted "love" for it in all passages. It is interesting to note that in Welsh the reverse process has occurred: cariad (from Latin caritas) was used throughout to translate agape, with the result that, in both religious and ordinary speech, the word has established itself so firmly as almost to oust the native word "serch."``145';
isbe[1984]='Charm`charm: Definition.—The word charm is derived from the Latin carmen, "a song," and denotes strictly what is sung; then it comes to mean a magical formula chanted or recited with a view to certain desired results. Charm is distinguished from amulet in this, that the latter is a material object having as such a magical potency, though it is frequently an inscribed formula on it that gives this object its power (see <a href="./study/isbe/search.html?string=AMULET">AMULET</a>). The word charm stands primarily for the incantation, though it is often applied to an inscribed amulet.<P>A charm may be regarded as having a positive or a negative effect. In the first case it is supposed to secure some desired object or result (see <a href="./study/isbe/search.html?string=AMULET">AMULET</a>). In the second, it is conceived as having the power of warding off evils, as the evil eye, the inflictions of evil spirits and the like. In the last, its negative meaning, the word "countercharm" (German, Gegenzauber) is commonly used.<P>Charms are divisible into two general classes according as they are written (or printed) or merely spoken:<P>(1) Written charms—Of these we have examples in the phylacteries and the mezuzah noticed in the article <a href="./study/isbe/search.html?string=AMULET">AMULET</a>. In <a onClick="return mV(\'Act\',19,\'13-20\');">Ac 19:13-20</a> we read of written charms used by the Ephesians, such as are elsewhere called (ephesia grammata). Such magical formulas were written generally on leather, though sometimes on papyrus, on lead, and even on gold. Those mentioned in the above passage must have been inscribed on some very valuable material, gold perhaps, or they could not have cost 2,000 British pounds (= 50,000 drachmas). Charms of the kind have been dug up from the ruins of Ephesus. In modern Egypt drinking-bowls are used, inscribed with passages from the Koran, and it is considered very lucky to drink from such a "lucky bowl," as it is called. Parts of the Koran and often complete miniature copies are worn by Egyptians and especially by Egyptian soldiers during war. These are buried with the dead bodies, just as the ancient Egyptians interred with their dead portions of the Book of the Dead or even the whole book, and as the early Abyssinians buried with dead bodies certain magical texts. Josephus (Ant., VIII, ii, 5) says that Solomon composed incantations by which demons were exorcised and diseases healed.<P>(2) Spoken charms are at least as widespread as those inscribed. Much importance was attached by the ancients (Egyptians, Babylonians, etc.) to the manner in which the incantations were recited, as well as to the substance of the formulas. If beautifully uttered, and with sufficient frequency, such incantations possessed unlimited power. The stress laid on the mode of reciting magical charms necessitated the existence of a priestly class and did much to increase the power of such a class. The binding force of the uttered word is implied in many parts of the Old Testament (see <a onClick="return mV(\'Jos\',9,20);">Jos 9:20</a>). Though the princes of Israel had promised under false pretenses to make a covenant on behalf of Israel with the Gibeonites, they refused to break their promise because the word had been given. The words of blessing and curse were believed to have in themselves the power of self-realization. A curse was a means of destruction, not a mere realization (see <a onClick="return mV(\'Num\',22,\'1-\');">Nu 22-24</a>, Balaam\'s curses; <a onClick="return mV(\'Jdg\',5,23);">Jud 5:23</a>; <a onClick="return mV(\'Job\',31,\'1-\');">Job 31</a>). In a similar way the word of blessing was believed to insure its own realization. In <a onClick="return mV(\'Gen\',48,\'8-22\');">Ge 48:8-22</a> the greatness of Ephraim and Manasseh is ascribed to the blessing of Jacob upon them (see further <a onClick="return mV(\'Exd\',12,32);">Ex 12:32</a>; <a onClick="return mV(\'Jdg\',17,2);">Jud 17:2</a>; <a onClick="return mV(\'2Sa\',21,3);">2Sa 21:3</a>). It is no doubt to be understood that the witch of Endor raised Samuel from the dead by the recitation of some magical formula (<a onClick="return mV(\'1Sa\',28,7);">1Sa 28:7</a>ff).<P>The uttering of the tetragrammaton (YHWH) was at a very early time (at latest 300 BC) believed to be magically potent, and hence, its ordinary use was forbidden, so that instead of Yahweh, the Jews of the time, when the earliest part of the Septuagint was translated, used for this Divine name the appellative \'adhonai = "Lord." In a similar way among the Jews of post-Biblical and perhaps of even Biblical times, the pronunciation of the Aaronic blessing (<a onClick="return mV(\'Num\',6,\'24-26\');">Nu 6:24-26</a>) was supposed to possess great efficacy and to be a means of certain good to the person or persons involved. Evil spirits were exorcised by Jews of Paul\'s day through the use of the name of the Lord Jesus (<a onClick="return mV(\'Act\',19,13);">Ac 19:13</a>). In the Talmud (Pecachim 110a) it is an instruction that if a man meets a witch he should say, "May a pot of boiling dung be stuffed into your mouth, you ugly witch," and her power is gone.`<a href="./study/isbe/search.html?string=AMULET">AMULET</a>`33';

isbe[1986]='Charmis`kar\'-mis (Charmeis, Charmeis, A, Chalmeis): The son of Melchiel, one of the three elders or rulers of the town of Bethulia (Judith 6:15; 8:10; 10:6).``1';
isbe[1987]='Charran`kar\'-an (Charrhan): Greek form of <a href="./study/isbe/search.html?string=HARAN">HARAN</a> (which see) (<a onClick="return mV(\'Act\',7,2,4);">Ac 7:2, 4</a>).``1';

isbe[1990]='Chaste; Chastity`chast, chas\'-ti-ti.`<a href="./study/isbe/search.html?string=CRIMES">CRIMES</a>; <a href="./study/isbe/search.html?string=MARRIAGE">MARRIAGE</a>`1';
isbe[1991]='Chastening; Chastisement`chas\'-\'-n-ing, chas\'-tiz-ment: These two words corresponding to Hebrew mucar, and Greek paideia, are distinguished in English use, in that "chastisement" is applied to the infliction of pain, either as a punishment or for recalling to duty, while "chastening," is a wider term, indicating the discipline or training to which one is subjected, without, as in the other term, referring to the means employed to this end. The narrower term occurs in the Revised Version (British and American) but once in the New Testament and then in its verbal form, <a onClick="return mV(\'Luk\',23,16);">Lu 23:16</a>: "I will therefore chastise him." the King James Version uses it also in <a onClick="return mV(\'Hbr\',12,8);">Heb 12:8</a>.<P>The meaning of the word paideia grows with the progress of revelation. Its full significance is unfolded in the New Testament, when reconciliation through Christ has brought into prominence the true fatherhood of God (<a onClick="return mV(\'Hbr\',12,5,10);">Heb 12:5, 10</a>). In the Old Testament, where it occurs about 40 times, the radical meaning is that simply of training, as in <a onClick="return mV(\'Deu\',8,5);">De 8:5</a>: "As a man chasteneth his son, so Yahweh thy God chasteneth thee." But, as in a dispensation where the distinguishing feature is that of the strictest justice, retributive punishment becomes not only an important, but a controlling factor. in the training, as in <a onClick="return mV(\'Lev\',26,28);">Le 26:28</a>: "I will chastise you seven times for your sins." In this sense, it is used of chastisements inflicted by man even unjustly: "My father chastised you with whips, but I will chastise you with scorpions" (<a onClick="return mV(\'1Ki\',12,11);">1Ki 12:11</a>). As, therefore, the thought of the suffering inflicted, or that of the end toward which it is directed, preponderates, the Psalmist can pray: "Neither chasten me in thy hot displeasure" (<a onClick="return mV(\'Psa\',6,1);">Ps 6:1</a>), and take comfort in the words: "Blessed is the man whom thou chastenest" (<a onClick="return mV(\'Psa\',94,12);">Ps 94:12</a>). Hence, it is common in both the King James Version and the Revised Version (British and American) to find the Hebrew mucar, and Greek paideia translated as "instruction." Illustrations are most numerous in Prov.<P>In the New Testament the Greek paideia is used with a variety similar to its corresponding Hebrew in the Old Testament. Examples of the fundamental idea, namely, that of "training," are found in such passages as <a onClick="return mV(\'Act\',7,22);">Ac 7:22</a>; <a onClick="return mV(\'Act\',22,3);">22:3</a>, where Moses and Paul are said to have been "instructed," and <a onClick="return mV(\'2Ti\',3,16);">2Ti 3:16</a>, where Scripture is said to be "profitable...for instruction" (compare <a onClick="return mV(\'1Ti\',1,20);">1Ti 1:20</a>; <a onClick="return mV(\'2Ti\',2,25);">2Ti 2:25</a>; <a onClick="return mV(\'Tts\',2,12);">Tit 2:12</a>; <a onClick="return mV(\'Rom\',2,20);">Ro 2:20</a>). A similar, but not identical, thought, is found in <a onClick="return mV(\'Eph\',6,4);">Eph 6:4</a>: "Nurture them in the chastening and admonition of the Lord." But when paideia is described as bringing pain, the mystery of suffering, which in the Old Testament is most fully treated in the Book of Job, at last finds its explanation. The child of God realizes that he cannot be beneath God\'s wrath, and hence, that the chastening which he endures is not destructive, but corrective (<a onClick="return mV(\'1Cr\',10,13);">1Co 10:13</a>; <a onClick="return mV(\'1Cr\',11,32);">11:32</a>; <a onClick="return mV(\'2Cr\',6,9);">2Co 6:9</a>; <a onClick="return mV(\'Rev\',3,19);">Re 3:19</a>). In <a onClick="return mV(\'Hbr\',12,\'5-11\');">Heb 12:5-11</a>, such consolation is afforded, not, as in the above passages, by incidental allusions, but by a full argument upon the basis of <a onClick="return mV(\'Pro\',3,11);">Pr 3:11</a>f; an Old Testament text that has depth and richness that can be understood and appropriated only by those who through Christ have learned to recognize the Omnipotent Ruler of heaven and earth, as their loving and considerate Father. On the basis of this passage, a distinction is often drawn between punishment and chastisement; the former, as an act of justice, revealing wrath, and the latter, as an act of mercy, love. Since to them that are in Christ Jesus, there is no condemnation (<a onClick="return mV(\'Rom\',8,1);">Ro 8:1</a>) they can suffer no punishment, but only chastisement. Where there is guilt, there is punishment; but where guilt has been removed, there can be no punishment. There being no degrees of justification, no one can be forgiven in part, with a partial guilt still set to his account for which he must yet give a reckoning, either here or hereafter. If, then, all the righteousness of Christ belongs to him, and no sin whatever remains to be forgiven, either in whole or in part, all life\'s sorrows are remedial agencies against danger and to train for the kingdom of heaven.``84';
isbe[1992]='Chatter`chat\'-er (tsaphaph): This word, which means to "peep," "twitter" or "chirp," as small birds do, is translated "chatter" only in <a onClick="return mV(\'Isa\',38,14);">Isa 38:14</a>, "Like a swallow or a crane, so did I chatter."`<a href="./study/isbe/search.html?string=CHIRP">CHIRP</a>`1';
isbe[1993]='Chavah`ka\'-va (Septuagint Zoe): A transliteration of the Hebrew chawwah or chavvah, which means "life giver" "living" and appears in our English versions as Eve (<a onClick="return mV(\'Gen\',3,20);">Ge 3:20</a>, see the King James Version margin).``1';
isbe[1994]='Chebar`ke\'-bar (kebhar, "joining" (Young), "length" (Strong); Chobar): The river by the side of which his first vision was vouchsafed to Ezekiel (<a onClick="return mV(\'Eze\',1,1);">Ez 1:1</a>). It is described as in "the land of the Chaldeans," and is not, therefore, to be sought in Northern Mesopotamia. This rules out the Habor, the modern Chabour, with which it is often identified. The two names are radically distinct: chabhor could not be derived from kebhar. One of the great Babylonian canals is doubtless intended. Hilprecht found mention made of (naru) kabaru, one of these canals large enough to be navigable, to the east of Nippur, "in the land of the Chaldeans." This "great canal" he identifies with the modern shatt en-Nil, in which probably we should recognize the ancient Chebar.``54';
isbe[1995]='Check`(mucar): Occurs in <a onClick="return mV(\'Job\',20,3);">Job 20:3</a> the King James Version, "I have heard the check of my reproach" (the Revised Version (British and American) "the reproof which putteth me to shame"), i.e. a check or reproof, such as that which closes the last speech of Job (chapter <a onClick="return mV(\'Job\',19,\'1-\');">19</a>), and intended to put Zophar to shame.``1';
isbe[1996]='Checker-Work; (Network)`chek\'-er-wurk (sebhakhah): This was a kind of ornamentation used on the tops of the pillars of Jachin and Boaz before the porch of the Temple (<a onClick="return mV(\'1Ki\',7,17);">1Ki 7:17</a>). Its exact form is not known. See <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</a>. For "a broidered coat" (<a onClick="return mV(\'Exd\',28,4);">Ex 28:4</a> the King James Version), the Revised Version (British and American) gives "a coat of checker work."`<a href="./study/isbe/search.html?string=BROIDERED">BROIDERED</a>; <a href="./study/isbe/search.html?string=EMBROIDERY">EMBROIDERY</a>`1';
isbe[1997]='Chedorlaomer`ked-or-la-o\'-mer, ked-or-la\'-omer (kedhorla\'omer; Chodollogomor):<P>1. Was he the Elamite King Kudur-lahgumal?<P>2. Kudur-lahgumal and the Babylonians<P>3. The Son of Eri-Ekua<P>4. Durmah-ilani, Tudhul(a) and Kudur-lahmal<P>5. The Fate of Sinful Rulers<P>6. The Poetical Legend<P>7. Kudur-lahgumal\'s Misdeeds<P>8. The Importance of the Series<HR /><P>The name of the Elamite overlord with whom Amraphel, Arioch and Tidal marched against Sodom and Gomorrah, and the other cities of the plain (<a onClick="return mV(\'Gen\',14,1);">Ge 14:1</a>ff). The Greek (Septuagint) form of the name is Chodollogomor, implying a different vocalization, the assimilation of "R" with "L", and the pronunciation of "\'o" as "gho" (Codorlaghomer). This suggests that the Elamite form, in cuneiform, would be Kudur-lagamar, the second element being the name of a god, and the whole therefore meaning "servant of La\'omer" (Lagamar), or the like. A Babylonian deity worshippeal at Dilmu, Lagamal, may be the same as the Elamite Lagamar. This name is not found in the cuneiform inscriptions, unless it be, as is possible, the fancifully-written Kudur-lah(gu)mal (or Kodorlahgomal) of three late Babylonian legends, one of which is in poetical form. Besides this Elamite ruler, two of these tablets mention also a certain Eri-Aku or Eri-Akua, son of Durmah-ilani, and one of them refers to Tudhul(a) or Tidal.<P>See <a href="./study/isbe/search.html?string=ERI-AKU">ERI-AKU, 4</a>.<P>1. Was He the Elamite King Kudur-lahgumal?:<P>Objections have been made to the identification of Chedorlaomer with the Kudur-lah(gu)mal of these texts, some Assyriologists having flatly denied the possibility, while others expressed the opinion that, though these names were respectively those with which they have been identified, they were not the personages referred to in <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>, and many have refrained from expressing an opinion at all. The main reason for the identification of Kudur-lah(gu)mal(?) with Chedorlaomer is its association with the names Eri-Eaku and Tudgul(a) found on two of the documents. No clear references to the expedition against the Cities of the Plain, however, have been found in these texts.<P>2. Kudur-lahgumal and the Babylonians:<P>The longer of the two prose compositions (Brit. Mus., Sp. II, 987) refers to the bond of heaven (extended?) to the four regions, and the fame which he (Merodach?) set for (the Elamites) in Babylon, the city of (his) glory. So (? the gods), in their faithful (or everlasting) counsel, decreed to Kudur-lahgumal, king of Elam (their favor?). He came down, and (performed) what was good to them, and exercised dominion in Babylon, the city of Kar-Dunias (Babylonia). When in power, however, he acted in a way which did not please the Babylonians, for he loved the winged fowl, and favored the dog which crunched the bone. "What(?) king of Elam was there who had (ever) (shown favor to?) the shrine of E-saggil?" (E-sagila, the great temple of Belus at Babylon).<P>3. The Son of Eri-Ekua:<P>A letter from Durmah-ilani son of Eri-Ekua (?Arioch) is at this point quoted, and possibly forms the justification for the sentences which had preceded, giving, as they do, reasons for the intervention of the native ruler. The mutilation of the inscription, however, makes the sense and sequence very difficult to follow.<P>4. Durmah-ilani, Tudhul(a) and Kudur-lahmal:<P>The less perfect fragment (Sp. III, 2) contains, near the beginning, the word hammu, and if this be, as Professor F. Hommel has suggested, part of the name Hammurabi (Amraphel), it would in all probability place the identification of Kudur-lahgumal(?) with Chedorlaomer beyond a doubt. This inscription states, that Merodach, in the faithfulness of his heart, caused the ruler not supporting (the temples of Babylonia) to be slain with the sword. The name of Durmah-ilani then occurs, and it seems to be stated of him that he carried off spoil, and Babylon and the temple E-saggil were inundated. He, however, was apparently murdered by his son, and old and young (were slain) with the sword. Then came Tudhul(a) or Tidal, son of Gazza(ni?), who also carried off spoil, and again the waters devastated Babylon and E-saggil. But to all appearance Tudhul(a), in his turn, was overtaken by his fate, for "his son shattered his head with the weapon of his hands." At this point there is a reference to Elam, to the city Ahhea(?), and to the land of Rabbatum, which he (? the king of Elam) had spoiled. Whether this refers to some expedition to Palestine or not is uncertain, and probably unlikely, as the next phrase speaks of devastation inflicted in Babylonia.<P>5. The Fate of Sinful Rulers:<P>But an untoward fate overtook this ruler likewise, for Kudur-lahmal (= lahgumal), his son, pierced his heart with the steel sword of his girdle. All these references to violent deaths are apparently cited to show the dreadful end of certain kings, "lords of sin," with whom Merodach, the king of the gods, was angry.<P>6. The Poetical Legend:<P>The third text is of a poetical nature, and refers several times to "the enemy, the Elamite"—apparently Kudur-lahgu(mal). In this noteworthy inscription, which, even in its present imperfect state, contains 78 lines of wedge-written text, the destruction wrought by him is related in detail. He cast down the door (of the temple) of Istar; entered Du-mah, the place where the fates were declared (see <a href="./study/isbe/search.html?string=BABEL,+BABYLON">BABEL, BABYLON</a>), and told his warriors to take the spoil and the goods of the temple.<P>7. Kudur-lahgumal\'s Misdeeds:<P>He was afraid, however, to proceed to extremities, as the god of the place "flashed like lightning, and shook the (holy) places." The last two paragraphs state that he set his face to go down to Tiamtu (the seacoast; see <a href="./study/isbe/search.html?string=CHALDEA">CHALDEA</a>), whither Ibi-Tutu, apparently the king of that district, had hastened, and founded a pseudo-capital. But the Elamite seems afterward to have taken his way north again, and after visiting Borsippa near Babylon, traversed "the road of darkness—the road to Mesku" (?Mesech). He destroyed the palace, subdued the princes, carried off the spoil of all the temples and took the goods (of the people) to Elam. At this point the text breaks off.<P>8. The Importance of the Series:<P>Where these remarkable inscriptions came from there ought to be more of the same nature, and if these be found, the mystery of Chedorlaomer and Kudur-lahgumal will probably be solved. At present it can only be said, that the names all point to the early period of the Elamite rulers called Kudurides, before the land of Tiamtu or Tamdu was settled by the Chaldeans. Evidently it was one of the heroic periods of Babylonian history, and some scribe of about 350 BC had collected together a number of texts referring to it. All three tablets were purchased (not excavated) by the British Museum, and reached that institution through the same channel. See the Journal of the Victoria Institute, 1895-96, and Professor Sayce in Proceedings of the Society of Biblical Archaeology (1906), 193ff, 241ff; (1907), 7ff.``136';
isbe[1998]='Cheek Teeth`(methalle\'ah, transposed from malta\'ah (only in <a onClick="return mV(\'Psa\',58,6);">Ps 58:6</a>), literally "the biter," "crusher," "molar," "jaw-teeth," "great teeth" (<a onClick="return mV(\'Job\',29,17);">Job 29:17</a> margin; <a onClick="return mV(\'Joe\',1,6);">Joe 1:6</a>)).<P>Figurative: The word is used as a synonym of reckless strength and cruelty.``1';
isbe[1999]='Cheek; Cheekbone`chek, chek\'-bon:<P>(1) lechi; siagon, "the jaw," "jaw-bone," "side of the face." The Hebrew word denotes originally freshness and rounded softness of the cheek, a sign of beauty in youth and maiden (<a onClick="return mV(\'Sgs\',1,10);">So 1:10</a>; <a onClick="return mV(\'Sgs\',5,13);">5:13</a>). The oriental guards with jealous care his cheek from touch or defilement, therefore a stroke on the cheek was, and is to this day, regarded as an act of extreme rudeness of behavior, a deadly affront. Our Saviour, however, teaches us in <a onClick="return mV(\'Mat\',5,39);">Mt 5:39</a> and <a onClick="return mV(\'Luk\',6,29);">Lu 6:29</a> that even this insult is to be ignored and pardoned.<P>Jawbones of animals have been frequently used as tools and weapons among primitive people. We see this sufficiently proven from cave deposits in many parts of the world, and from recent ethnological researches, especially in Australia. In the light of this evidence it is interesting to note that Samson used a jawbone of an ass with success against his enemies the Philistines (<a onClick="return mV(\'Jdg\',15,15);">Jud 15:15</a>).<P>(2) malqoach (<a onClick="return mV(\'Psa\',22,15);">Ps 22:15</a>), is a dual form indicative of the two jaws, to which a parched tongue seems to cleave.<P>(3) methalle\'ah (<a onClick="return mV(\'Job\',29,17);">Job 29:17</a>), better "<a href="./study/isbe/search.html?string=CHEEK+TEETH">cheek teeth</a>" (which see).``106';
isbe[2000]='Cheer; Cheerfulness`cher, cher\'-fool-nes: The English word "cheer" meant:<P>(1) originally face, countenance (Greek kara, "head," through Old French, chere, "face"),<P>(2) then the expression on the face, especially<P>(3) the expression of good spirits, and finally<P>(4) good spirits, without any reference to the facial expression.<P>The noun "cheer" in English Versions of the Bible is only found with adjective "good" (except 1Esdras 9:54, "great cheer"), the word not having quite lost its earlier neutral character (any face expression, whether joyous or otherwise). In Old Testament, Tobh, is translated "cheer," "let thy heart cheer thee" (see <a href="./study/isbe/search.html?string=GOOD">GOOD</a>); sameach, "to rejoice" is so translated in <a onClick="return mV(\'Deu\',24,5);">De 24:5</a>, "shall cheer his wife" (the King James Version "cheer up his wife"), and <a onClick="return mV(\'Jdg\',9,13);">Jud 9:13</a>, "wine, which cheereth God (\'elohim) and man." The phrase "of good cheer" occurs in Old Testament in <a onClick="return mV(\'Job\',9,27);">Job 9:27</a> (the King James Version "comfort"); in Apocrypha, 1Esdras 9:54; The <span class="noTag">Wisdom of Solomon 18:6</span>; Baruch 4:5, 30; Sirach 18:32 the King James Version (the Revised Version (British and American) "luxury"); in New Testament for Greek euthumeo, euthumos, in <a onClick="return mV(\'Act\',27,22,25,36);">Ac 27:22, 25, 36</a>, and for tharseo in <a onClick="return mV(\'Mat\',9,2,22);">Mt 9:2, 22</a>. (the King James Version "comfort"); <a onClick="return mV(\'Mat\',14,27);">Mt 14:27</a>; <a onClick="return mV(\'Mar\',22,6,50);">Mr 6:50</a>; <a onClick="return mV(\'Mar\',10,49);">10:49</a> (RV; "comfort" in the King James Version); <a onClick="return mV(\'Jhn\',16,33);">Joh 16:33</a>; <a onClick="return mV(\'Act\',23,11);">Ac 23:11</a>. "Cheer" as verb transitive occurs in <a onClick="return mV(\'Ecc\',11,9);">Ec 11:9</a>; <a onClick="return mV(\'Deu\',24,5);">Deu 24:5</a>; <a onClick="return mV(\'Jdg\',9,13);">Jud 9:13</a>.<P>Cheerful occurs in <a onClick="return mV(\'Pro\',15,13,15);">Pr 15:13, 15</a> (the King James Version "merry"); <a onClick="return mV(\'Zec\',8,19);">Zec 8:19</a>; <a onClick="return mV(\'Zec\',9,17);">9:17</a> the King James Version; Sirach 30:25; <a onClick="return mV(\'2Cr\',9,7);">2Co 9:7</a>.<P>Cheerfully, <a onClick="return mV(\'Act\',24,10);">Ac 24:10</a>.<P>Cheerfulness, <a onClick="return mV(\'Rom\',12,8);">Ro 12:8</a>.``49';
