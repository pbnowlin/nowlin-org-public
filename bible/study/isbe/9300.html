isbe[9381]='Zerahiah`zer-a-hi\'-a (zerachyah, "Yahweh hath risen" or "come forth"; the Septuagint has Zaraia, with variants):<P>(1) A priest of the line of Eleazar (<a onClick="return mV(\'1Ch\',6,6,51);">1Ch 6:6,51</a>; <a onClick="return mV(\'Ezr\',7,4);">Ezr 7:4</a>).<P>(2) A head of a family, who returned with Ezra from Babylon (<a onClick="return mV(\'Ezr\',8,4);">Ezr 8:4</a>).``1';
isbe[9382]='Zerahites`ze\'-ra-hits (ha-zarchi; Codex Vaticanus ho Zarai; Codex Alexandrinus ho Zaraei; the King James Version Zarhites):<P>(1) A family of Simeonites (<a onClick="return mV(\'Num\',26,13);">Nu 26:13</a>).<P>(2) Descendants of Zerah, son of Judah (<a onClick="return mV(\'Num\',26,20);">Nu 26:20</a>). To this family Achan belonged (<a onClick="return mV(\'Jos\',7,17);">Jos 7:17</a>), as did also two of David\'s captains (<a onClick="return mV(\'1Ch\',27,11,13);">1Ch 27:11,13</a>).``1';
isbe[9383]='Zered`ze\'-red (zeredh; Codex Vaticanus Zaret; Codex Alexandrinus Zare; the King James Version, Zared (<a onClick="return mV(\'Num\',21,12);">Nu 21:12</a>)): This is the nachal or "torrent valley" given as the place where Israel encamped before they reached the Arnon (<a onClick="return mV(\'Num\',21,12);">Nu 21:12</a>). In <a onClick="return mV(\'Deu\',2,13);">De 2:13</a>f; the crossing of the brook Zered marks the end of the 38 years\' desert wanderings. It has often been identified with Wady el-\'Achsa, which runs up from the southeastern corner of the Dead Sea. A fatal objection to this is that the host had entered the wilderness to the east of Moab before they crossed the Zered (<a onClick="return mV(\'Num\',21,11);">Nu 21:11</a>), while Wady el-\'Achsa must have formed the southern boundary of Moab. We may conclude with certainty that one of the confluents of Wady Kerak is intended, but which, it is impossible now to say.``54';
isbe[9384]='Zeredah; Zeredath; Zeredatha; Zererah; Zererath`zer\'-e-da, zer\'-e-dath, zer-e-da\'-tha, zer\'-e-ra, zer\'-e-rath.`<a href="./study/isbe/search.html?string=ZARETHAN">ZARETHAN</a>`1';
isbe[9385]='Zeresh`ze\'-resh (zeresh, "gold," from the Persian; Sosara): The wife of Haman (<a onClick="return mV(\'Est\',5,10,14);">Es 5:10,14</a>; <a onClick="return mV(\'Est\',6,13);">6:13</a>), the vizier of Xerxes.``1';
isbe[9386]='Zereth`ze\'-reth (tsereth, meaning unknown): A Judahite (<a onClick="return mV(\'1Ch\',4,7);">1Ch 4:7</a>).``1';
isbe[9387]='Zereth-Shahar`ze\'-reth-sha\'-har (tsereth ha-shachar; Codex Vaticanus Sereda kai Seion, Codex Alexandrinus Sarth kai Sior): A town in the territory of Reuben, "in the mount of the valley," named with Kiriathaim and Sibmah (<a onClick="return mV(\'Jos\',13,19);">Jos 13:19</a>). Perhaps in the name Chammat ec-Cara, attaching to the hot springs near Macherus, there may be some echo of the ancient name; but no identification is possible.``1';
isbe[9388]='Zeri`ze\'-ri (tseri, meaning unknown): "Son" of Jeduthun, and a temple musician (<a onClick="return mV(\'1Ch\',25,3);">1Ch 25:3</a>) = "Izri" of <a onClick="return mV(\'1Ch\',25,11);">1Ch 25:11</a>, which should be read here.`<a href="./study/isbe/search.html?string=IZRI">IZRI</a>`1';
isbe[9389]='Zeror`ze\'-ror (tseror, meaning unknown; the Septuagint has Ared; Lucian has Sara): An ancestor of Kish and King Saul (<a onClick="return mV(\'1Sa\',9,1);">1Sa 9:1</a>).`<a href="./study/isbe/search.html?string=ZUR">ZUR</a>`1';
isbe[9390]='Zeruah`ze-roo\'-a (tseru\'ah, perhaps "leprous"): Mother of King Jeroboam I (<a onClick="return mV(\'1Ki\',11,26);">1Ki 11:26</a>), the Septuagint, Codex Vaticanus and Lucian omit the name in <a onClick="return mV(\'1Ki\',11,26);">1Ki 11:26</a>, but the long the Septuagint after Massoretic Text of 12:24 reads (<a onClick="return mV(\'1Ki\',12,24);">12:24b</A>): "And there was a man of the hill-country of Ephraim, a servant of Solomon, and his name was Jeroboam, and the name of his mother was Sareisa (Septuagint has Sareisa), a harlot."`<a href="./study/isbe/search.html?string=ZARETHAN">ZARETHAN</a>`1';
isbe[9391]='Zerubbabel`ze-rub\'-a-bel (zerubbabhel, probably a transliteration of the Babylonian name Zeru-Babili, "seed of Babylon"; Zorobabel):<P>1. Name:<P>Is commonly called the son of Shealtiel (<a onClick="return mV(\'Ezr\',3,2,8);">Ezr 3:2,8</a>; <a onClick="return mV(\'Ezr\',5,2);">5:2</a>; <a onClick="return mV(\'Neh\',12,1);">Ne 12:1</a>; <a onClick="return mV(\'Hag\',1,1,12,14);">Hag 1:1,12,14</a>; <a onClick="return mV(\'Mat\',1,12);">Mt 1:12</a>; <a onClick="return mV(\'Luk\',3,27);">Lu 3:27</a>); but in <a onClick="return mV(\'1Ch\',3,19);">1Ch 3:19</a> he is called the son of Pedaiah, the brother apparently of Shealtiel (Salathiel) and the son or grandson of Jeconiah. It is probable that Shealtiel had no children and adopted Zerubbabel; or that Zerubbabel was his levirate son; or that, Shealtiel being childless, Zerubbabel succeeded to the rights of sonship as being the next of kin.<P>2. Family:<P>Whatever may have been his blood relationship to Jeconiah, the Scriptures teach that Zerubbabel was his legal successor, of the 3rd or 4th generation. According to <a onClick="return mV(\'1Ch\',3,19);">1Ch 3:19</a>, he had one daughter, Shelomith, and seven sons, Meshullam, Hananiah, Hashubah, Ohel, Berechiah, Hasadiah and Jushab-hesed. In <a onClick="return mV(\'Mat\',1,13);">Mt 1:13</a> he is said to have been the father of Abiud (i.e. Abi-hud). As it is the custom in Arabia today to give a man a new name when his first son is born, so it may have been, in this case, that Meshullam was the father of Hud, and that his name was changed to Abiud as soon as his son was named Hud. In <a onClick="return mV(\'Luk\',3,27);">Lu 3:27</a>, the son of Zerubbabel is called Rhesa. This is doubtless the title of the head of the captivity, the resh gelutha\', and would be appropriate as a title of Meshullam in his capacity as the official representative of the captive Jews. That Zerubbabel is said in the New Testament to be the son of Shealtiel the son of Neri instead of Jeconiah may be accounted for on the supposition that Shealtiel was the legal heir or adopted son of Jeconiah, who according to <a onClick="return mV(\'Jer\',36,30);">Jer 36:30</a> was apparently to die childless.<P>3. Relation to Sheshbazzar:<P>It has been shown in the article on Sheshbazzar that he and Zerubbabel may possibly have been the same person and that the name may have been Shamash-ban (or bun)-zer-Babili-usur. It seems more probable, however, that Sheshbazzar, the prince of Judah, was governor under Cyrus and that Zerubbabel was governor under Darius. The former, according to <a onClick="return mV(\'Ezr\',1,8);">Ezr 1:8</a> and 5:14-16, laid the foundations, and the latter completed the building of the temple (<a onClick="return mV(\'Ezr\',2,2,68);">Ezr 2:2,68</a>; <a onClick="return mV(\'Ezr\',4,2);">4:2</a>; <a onClick="return mV(\'Hag\',1,14);">Hag 1:14</a>; <a onClick="return mV(\'Zec\',4,9);">Zec 4:9</a>).<P>4. History:<P>All that is known certainly about Zerubbabel is found in the canonical Books of Zechariah, Haggai and Ezra-Nehemiah. According to these he and Jeshua, the high priest, led up a band of captives from Babylon to Jerusalem and began rebuilding the temple in the second year of Darius Hystaspis. They first constructed the altar of burnt offerings, and afterward built a temple, usually called the Second Temple, much inferior in beauty to that of Solomon. According to Josephus and the apocryphal Book of Ezra (1Esdras 3,4), Zerubbabel was a friend of Darius Hystaspis, having successfully competed before him in a contest whose object was to determine what was the strongest thing in the world—wine, kings, women, or truth. Zerubbabel, having demonstrated that truth was the mightiest of all, was called the king\'s "cousin," and was granted by him permission to go up to Jerusalem and to build the temple. Zerubbabel was also made a governor of Jerusalem, and performed also the duties of the tirshatha, an official who was probably the Persian collector of taxes.`<a href="./study/isbe/search.html?string=TIRSHATHA">TIRSHATHA</a>`196';
isbe[9392]='Zeruiah`ze-roo-i\'-a, ze-roo\'-ya (tseruyah, tseruyah (<a onClick="return mV(\'2Sa\',14,1);">2Sa 14:1</a>; <a onClick="return mV(\'2Sa\',16,10);">16:10</a>), meaning uncertain; Sarouia): In <a onClick="return mV(\'2Sa\',2,18);">2Sa 2:18</a>; <a onClick="return mV(\'2Sa\',17,25);">17:25</a>; <a onClick="return mV(\'1Ch\',2,16);">1Ch 2:16</a>, and elsewhere where the names Joab, Abishai, occur. According to <a onClick="return mV(\'1Ch\',2,16);">1Ch 2:16</a> a sister of David and mother of Joab, Abishai and Asahel, the two former being always referred to as sons of Zeruiah. This latter fact is explained by some as pointing to a type of marriage by which the children belonged to their mother\'s clan (compare Abimelech, <a onClick="return mV(\'Jdg\',8,31);">Jud 8:31</a>; <a onClick="return mV(\'Jdg\',9,1);">9:1</a>ff); by others as being due to her husband\'s early death; and again as a proof of the mother in this case being the stronger personality. Either of the last two reasons may be the correct one, and plenty of parallels from the village names of boys today can be produced to illustrate both explanations. According to <a onClick="return mV(\'2Sa\',2,32);">2Sa 2:32</a>, her husband was buried at Bethlehem. In <a onClick="return mV(\'2Sa\',17,25);">2Sa 17:25</a>, "Abigal the daughter of Nahash" is said to be her sister.`<a href="./study/isbe/search.html?string=ABIGAIL">ABIGAIL</a>`149';
isbe[9393]='Zetham`ze\'-tham (zetham, meaning unknown): A Gershonite Levite (<a onClick="return mV(\'1Ch\',23,8);">1Ch 23:8</a>; <a onClick="return mV(\'1Ch\',26,22);">26:22</a>). In the second passage Curtis holds that "the sons of Jehieli" is a gloss; he points the Massoretic Text to read "brethren" instead of "brother," and so has "Jehiel (<a onClick="return mV(\'1Ch\',26,22);">1Ch 26:22</a>) and his brethren, Zetham and Joel, were over the treasures."``1';
isbe[9394]='Zethan`ze\'-than (zethan, perhaps "olive tree"): A Benjamite (<a onClick="return mV(\'1Ch\',7,10);">1Ch 7:10</a>), but Curtis holds that he is a Zebulunite (Chron., 145ff).``1';
isbe[9395]='Zethar`ze\'-thar (zethar; Oppert, Esther, 25, compares Persian zaitar, "conqueror"; see BDB; Septuagint Abataza): A eunuch of Ahasuerus (<a onClick="return mV(\'Est\',1,10);">Es 1:10</a>).``1';
isbe[9396]='Zeus`zus (Zeus, the Revised Version margin; the Revised Version (British and American) and the King James Version Jupiter): The supreme god of Hellenic theology, "king of gods and of men." In 168 BC Antiochus Epiphanes, "who on God\'s altars danced," bent upon the thorough Hellenization of Judea and Jerusalem, sent "an old man of Athens" (or "Geron an Athenian," the Revised Version margin) to pollute the sanctuary in the temple at Jerusalem and to call it by the name of Jupiter Olympius, and that at Gerizim by the name of Jupiter Xenius (2Macc 6:1ff). Olympius, from Mt. Olympus, the home of the gods, is the favorite epithet of Zeus, Zeus Olympius being to the Greek world what Jupiter Capitolinus was to the Roman. The same Antiochus commenced the splendid temple of Zeus Olympius, finished under Hadrian. Zeus is also frequently styled Xenius or "Protector of strangers" (Juppiter hospitalis) in classical literature. The epithet is here applied because the people of Gerizim—the Samaritans—were hospitable, probably an ironical statement of the author (compare <a onClick="return mV(\'Luk\',9,52);">Lu 9:52</a>f). Zeus is also in <a onClick="return mV(\'Act\',14,12);">Ac 14:12</a>f the Revised Version margin for <a href="./study/isbe/search.html?string=JUPITER">JUPITER</a> (which see).``5';
isbe[9397]='Zia`zi\'-a (zia\', meaning uncertain): A Gadite, possibly the name of a Gadite clan (<a onClick="return mV(\'1Ch\',5,13);">1Ch 5:13</a>).``1';
isbe[9398]='Ziba`zi\'-ba (tsibha\', tsibha\' (<a onClick="return mV(\'2Sa\',16,4);">2Sa 16:4</a> a), meaning unknown; Seiba): A former servant or probably dependent of Saul\'s house (<a onClick="return mV(\'2Sa\',9,1);">2Sa 9:1</a>), who was brought to David when the king inquired if there was not a member of Saul\'s family that he could show kindness to (compare David\'s oath to Jonathan in <a onClick="return mV(\'1Sa\',20,14);">1Sa 20:14</a>ff). Ziba tells David of Mephibosheth (Meribbaal), Jonathan\'s son, who is thereupon taken to the king from Lodebar, east of the Jordan, and given Saul\'s estate. Ziba is also bidden to till the land and bring in its produce, and "it shall be food for thy master\'s son," according to Massoretic Text in <a onClick="return mV(\'2Sa\',9,10);">2Sa 9:10b</a>; but the Septuagint and Lucian have a better reading, "thy master\'s household." Mephibosheth himself is to eat at David\'s table. Ziba is to be assisted in this by his sons and servants; he had 15 sons and 20 servants (9:10).<P>When David has to leave Jerusalem at the time of Absalom\'s revolt, Ziba (<a onClick="return mV(\'2Sa\',16,\'1-4\');">2Sa 16:1-4</a>) takes two asses for members of the king\'s household to ride on, and 200 loaves and 100 clusters of raisins as provisions for the youths. When asked where Mephibosheth is, he accuses his master of remaining behind purposely in hopes that his father\'s kingdom would be restored to him. David then confers upon Ziba his master\'s estate.<P>After Absalom\'s death, David sets out to return to Jerusalem from Mahanaim, east of Jordan. Ziba with his sons and servants, as we are told in a parenthesis in <a onClick="return mV(\'2Sa\',19,17,18);">2Sa 19:17,18a (Hebrew verses 18,19a)</a>, by means of a ferry-boat goes backward and forward over Jordan, and thus enables the king\'s household to cross. But he has wrongly accused his master of treacherous lukewarmness toward David, for Mephibosheth meets the king on his return journey to Jerusalem (<a onClick="return mV(\'2Sa\',19,\'24-30\');">2Sa 19:24-30 (Hebrew verses 25-31)</a>) with signs of grief. When he is asked why he had not joined the king at the time of the latter\'s flight, he answers that Ziba deceived him, "for thy servant said to him, Saddle me (so read in <a onClick="return mV(\'2Sa\',19,26);">2Sa 19:26 (Hebrew text, verse 27)</a> with Septuagint and Syriac for Massoretic Text \'I will have saddled me\') the ass." He then accuses Ziba of falsehood, and David divides the estate between the two, although Mephibosheth is quite willing that Ziba should retain the whole of it.``149';
isbe[9399]='Zibeon`zib\'-e-on (tsibh\'on, "hyena"; HPN, 95; Sebegon): A Horite chief (<a onClick="return mV(\'Gen\',36,2,14,20,24,29);">Ge 36:2,14,20,24,29</a>; <a onClick="return mV(\'1Ch\',1,38,40);">1Ch 1:38,40</a>); he is called the "Hivite" in <a onClick="return mV(\'Gen\',36,2);">Ge 36:2</a> where "Horite" should be read with 36:20,29. In <a onClick="return mV(\'Gen\',36,2,14);">Ge 36:2,14</a> Anah is said to be "the daughter of Zibeon," whereas the Septuagint, the Samaritan Pentateuch, the Syriac, and Lucian have "the son of Zibeon"; compare <a onClick="return mV(\'1Ch\',1,38,40);">1Ch 1:38,40</a>, where also Anah is Zibeon\'s son.``1';
isbe[9400]='Zibia`zib\'-i-a (tsibhya\', perhaps "gazelle"): A Benjamite (<a onClick="return mV(\'1Ch\',8,9);">1Ch 8:9</a>).``1';
