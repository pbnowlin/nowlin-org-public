>Zechariah 9-14</a> depends so largely on older prophecies for his thoughts, and consequently more or less for his language; and (b) the fact that these prophecies are so very brief. There is no mode of reasoning so treacherous as that from language and style. (For the technical discussion of this point, see the present writer\'s The Prophecies of Zechariah, 54-59.) <P>5. The Unity of the Book:<P>Among the further objections made to the genuineness of <span class="noTag">Zechariah 9-14</span>, and consequently to the unity of the book, the following are the chief:<P>(1) There are no "visions" in these oracles as in <a onClick="return mV(\'Zec\',1,\'1-\');">Zechariah 1-6</a>. But there are none either in <a onClick="return mV(\'Zec\',7,\'1-\');">Zechariah 7</a>; <a onClick="return mV(\'Zec\',8,\'1-\');">8</a>, and yet these latter are not denied to Zechariah. As a matter of fact, however, visions do actually occur in chapters 9-14, only of a historico-parabolic (<a onClick="return mV(\'Zec\',11,\'4-17\');">11:4-17</A>) and eschatological character (<a onClick="return mV(\'Zec\',9,\'13-17\');">9:13-17</A>; chapters <a onClick="return mV(\'Zec\',12,\'1-\');">12</A>; <a onClick="return mV(\'Zec\',14,\'1-\');">14</a>).<P>(2) There are "no dates," as in <a onClick="return mV(\'Zec\',1,1,7);">Zec 1:1,7</a>; <a onClick="return mV(\'Zec\',7,1);">7:1</a>. But dates are seldom attached to "oracles" (<a onClick="return mV(\'Isa\',13,1);">Isa 13:1</a>; <a onClick="return mV(\'Isa\',15,1);">15:1</a>; <a onClick="return mV(\'Nah\',1,1);">Na 1:1</a>; <a onClick="return mV(\'Hab\',1,1);">Hab 1:1</a>; <a onClick="return mV(\'Mal\',1,1);">Mal 1:1</a>). There is but one instance in the entire Old Testament (<a onClick="return mV(\'Isa\',14,28);">Isa 14:28</a> margin); whereas "visions" are frequently dated.<P>(3) There is "no Satan." But Satan is never mentioned elsewhere in any prophetic book of the Old Testament.<P>(4) There is "no interpreting angel" in <a onClick="return mV(\'Zec\',9,1);">Zechariah 9-14</a>. But "oracles" need no interpreting angel. On the other hand, "the Angel of Yahweh" is mentioned in both parts (<a onClick="return mV(\'Zec\',3,1);">3:1</a>ff; <a onClick="return mV(\'Zec\',12,8);">12:8</A>), a fact which is far more noteworthy.<P>(5) Proper names are wanting in <span class="noTag">Zechariah 9-14</span>, e.g. Zerubbabel and Joshua. But neither do these names occur in chapters <a onClick="return mV(\'Zec\',7,\'1-\');">7</A>; <a onClick="return mV(\'Zec\',8,\'1-\');">8</A>. <P>(6) The sins alluded to are different, e.g. theft and false swearing in <a onClick="return mV(\'Zec\',5,3,4">Zec 5:3,4</a>; while in <a onClick="return mV(\'Zec\',10,2">10:2</a> seeking teraphim and in <a onClick="return mV(\'Zec\',13,2">13:2</a>ff false prophecy are named. But these sins may have existed side by side. What is far more noteworthy, in both parts the prophet declares that all these evils shall be taken away and removed out of the land (3:9; 5:9-11; 13:1,2).<P>(7) The Messianic pictures are different, e.g. in <a onClick="return mV(\'Zec\',1,\'1-\');">Zechariah 1-8</a> the Messiah is spoken of as Branch-Priest (<a onClick="return mV(\'Zec\',3,8,9);">3:8,9</A>; <a onClick="return mV(\'Zec\',6,12,13);">6:12,13</A>); whereas in chapters 9-14, as King, (<a onClick="return mV(\'Zec\',9,9,10);">9:9,10</A>). But in <a onClick="return mV(\'Zec\',6,13);">6:13</a> it is expressly stated that the Branch-Priest "shall sit and rule upon his throne." Of far greater moment is the picture of the nations coming to Zion to worship Yahweh. This remarkable picture recurs in all the different sections of the book (<a onClick="return mV(\'Zec\',6,12,13,15);">6:12,13,15</A>; <a onClick="return mV(\'Zec\',8,\'20-23\');">8:20-23</A>; <a onClick="return mV(\'Zec\',12,6);">12:6</A>; <a onClick="return mV(\'Zec\',14,\'16-19\');">14:16-19</A>).<P>On the other hand, the following are some of the arguments which favor the genuineness of these disputed chapters:<P>(1) The fundamental ideas of both parts are the same. By this we mean that the deeper we go the nearer we approach unity. As Dr. G.A. Smith argues against Graetz, who divides <a onClick="return mV(\'Hsa\',1,\'1-\');">Hosea 1-3</a> from <a onClick="return mV(\'Hsa\',4,\'1-\');">Hosea 4-14</a>, "in both parts there are the same religious principles and the same urgent and jealous temper"; the same is equally true of <a onClick="return mV(\'Zec\',1,\'1-\');">Zec 1-8</a> and <a onClick="return mV(\'Zec\',9,\'1-\');">Zec 9-14</a>. Certain similarities are especially noteworthy, e.g.<P>(a) an unusually deep, spiritual tone pervades the entire book. The call to a true repentance, first sounded forth in the introduction (<a onClick="return mV(\'Zec\',1,\'1-7\');">1:1-7</A>), is developed more and more throughout the entire 14 chapters; thus, in the sanctifying of Joshua (<a onClick="return mV(\'Zec\',3,4);">Zec 3:4</a>), in the message to Zerubbabel, "not by might, nor by power, but by my Spirit" (<a onClick="return mV(\'Zec\',4,6);">Zec 4:6</a>), in the conditions of future blessing (<a onClick="return mV(\'Zec\',6,15);">Zec 6:15</a>), in the answer to the Bethel deputation (<a onClick="return mV(\'Zec\',7,\'5-9\');">Zec 7:5-9</a>; <a onClick="return mV(\'Zec\',8,16);">8:16</a>); and in <a onClick="return mV(\'Zec\',9,\'1-\');">Zechariah 9-14</a>, in the consecration of the remnant of the Philistines (<a onClick="return mV(\'Zec\',9,7);">9:7</A>), in the blessings to Ephraim (<a onClick="return mV(\'Zec\',10,12);">10:12</A>), in the baptism of grace upon Jerusalem (<a onClick="return mV(\'Zec\',12,10);">12:10</A>), in the fountain for sin (<a onClick="return mV(\'Zec\',13,1);">13:1</A>), in the worship of Yahweh (<a onClick="return mV(\'Zec\',13,9);">13:9</A>), in the living waters going forth from Jerusalem (<a onClick="return mV(\'Zec\',14,8);">14:8</A>), and in the dedication of everything as holy unto the Lord (<a onClick="return mV(\'Zec\',14,20,21);">14:20,21</A>). The tone which tempers these prophecies is an extraordinarily deep and spiritual one throughout. And this argument cannot be set aside by rejecting wholesale certain passages as later interpolations, as is done by Mitchell (ICC, 242-44).<P>(b) There is a similar attitude of hope and expectation in both parts. This is especially important. For example,<P>(i) the return of the whole nation is a prevailing idea of happiness in both parts (<a onClick="return mV(\'Zec\',2,6,10);">Zec 2:6,10</a>; <a onClick="return mV(\'Zec\',8,7,8);">8:7,8</a>; <a onClick="return mV(\'Zec\',9,12);">9:12</a>; <a onClick="return mV(\'Zec\',10,6,7);">10:6,7</a>).<P>(ii) The expectation that Jerusalem shall be inhabited (<a onClick="return mV(\'Zec\',1,16,17);">Zec 1:16,17</a>; <a onClick="return mV(\'Zec\',2,4);">2:4</a>; <a onClick="return mV(\'Zec\',8,3,8);">8:3,8</a>; <a onClick="return mV(\'Zec\',12,6);">12:6</a>; <a onClick="return mV(\'Zec\',14,10,11);">14:10,11</a>),<P>(iii) and that the temple shall be built and become the center of the nation\'s religious life (<a onClick="return mV(\'Zec\',1,16,17);">Zec 1:16,17</a>; <a onClick="return mV(\'Zec\',3,7);">3:7</a>; <a onClick="return mV(\'Zec\',6,15);">6:15</a>; <a onClick="return mV(\'Zec\',7,2,3);">7:2,3</a>; <a onClick="return mV(\'Zec\',9,8);">9:8</a>; <a onClick="return mV(\'Zec\',14,20,21);">14:20,21</a>).<P>(iv) Messianic hope is peculiarly strong in both (<a onClick="return mV(\'Zec\',3,8,9);">Zec 3:8,9</a>; <a onClick="return mV(\'Zec\',6,12,13);">6:12,13</a>; <a onClick="return mV(\'Zec\',9,9,10);">9:9,10</a>; <a onClick="return mV(\'Zec\',11,12,13);">11:12,13</a>; <a onClick="return mV(\'Zec\',12,10);">12:10</a>; <a onClick="return mV(\'Zec\',13,1,7,8,9);">13:1,7-9</a>).<P>(v) Peace and prosperity are expected (<a onClick="return mV(\'Zec\',1,17);">Zec 1:17</a>; <a onClick="return mV(\'Zec\',3,10);">3:10</a>; <a onClick="return mV(\'Zec\',6,13);">6:13</a>; <a onClick="return mV(\'Zec\',8,12,19);">8:12,19</a>; <a onClick="return mV(\'Zec\',9,10,\'12-17\');">9:10,12-17</a>; <a onClick="return mV(\'Zec\',10,1,7,810,12);">10:1,7,8,10,12</a>; <a onClick="return mV(\'Zec\',12,8);">12:8</a>; <a onClick="return mV(\'Zec\',14,11);">14:11</a>,<a onClick="return mV(\'Zec\',14,\'16-19\');">16-19</a>).<P>(vi) The idea of God\'s providence as extending to the whole earth (<a onClick="return mV(\'Zec\',1,\'14-17\');">Zec 1:14-17</a>; <a onClick="return mV(\'Zec\',2,9,12);">2:9,12</a>; <a onClick="return mV(\'Zec\',4,10);">4:10</a>; <a onClick="return mV(\'Zec\',6,5);">6:5</a>; <a onClick="return mV(\'Zec\',9,1,8,14);">9:1,8,14</a>; <a onClick="return mV(\'Zec\',10,3,5,9,12);">10:3,5,9,12</a>; <a onClick="return mV(\'Zec\',12,\'2-4\',8);">12:2-4,8</a>; <a onClick="return mV(\'Zec\',13,7);">13:7</a>; <a onClick="return mV(\'Zec\',14,3,9);">14:3,9</a>). Again, <P>(c) the prophet\'s attitude toward Judah is the same in both parts. It is an attitude of supreme regard for Judah\'s interests, making them second only to the capital (<a onClick="return mV(\'Zec\',2,2,4,16);">Zec 2:2,4,16</a>; <a onClick="return mV(\'Zec\',8,19);">8:19</a>; <a onClick="return mV(\'Zec\',1,12);">1:12</a>; <a onClick="return mV(\'Zec\',8,13,15);">8:13,15</a>; <a onClick="return mV(\'Zec\',12,2);">12:2</a>; <a onClick="return mV(\'Zec\',14,14);">14:14</a>; <a onClick="return mV(\'Zec\',10,3);">10:3</a>; <a onClick="return mV(\'Zec\',12,4,6,7);">12:4,6,7</a>; <a onClick="return mV(\'Zec\',14,21);">14:21</a>; <a onClick="return mV(\'Zec\',9,9,13);">9:9,13</a>; <a onClick="return mV(\'Zec\',10,6);">10:6</a>; <a onClick="return mV(\'Zec\',11,14);">11:14</a>; <a onClick="return mV(\'Zec\',14,5);">14:5</a>). The prophet\'s attitude toward the nations, the enemies of theocracy, is the same in both parts. The whole assembled world are the enemies of Israel. But though they have scattered Judah, Israel and Jerusalem (<a onClick="return mV(\'Zec\',1,11);">1:11</A>), and are still coming up to besiege Jerusalem (<a onClick="return mV(\'Zec\',12,2);">12:2</A>; <a onClick="return mV(\'Zec\',14,2);">14:2</A>), yet they shall be joined to the Lord in that day (<a onClick="return mV(\'Zec\',2,11);">2:11</A>) and worship Yahweh like the Jews (<a onClick="return mV(\'Zec\',8,\'20-23\');">8:20-23</A>; <a onClick="return mV(\'Zec\',14,\'16-19\');">14:16-19</A>). These are all striking instances of similarity in the fundamental ideas of the two parts of the book.<P>(2) There are peculiarities of thought common to both parts: e.g.<P>(a) the habit of dwelling on the same thought (<a onClick="return mV(\'Zec\',2,1,4,5,11);">Zec 2:1,4,5,11</a>; <a onClick="return mV(\'Zec\',6,12,113);">6:12,13</a>; <a onClick="return mV(\'Zec\',8,4,5);">8:4,5</a>; <a onClick="return mV(\'Zec\',8,21,22);">8:21,22</a>; <a onClick="return mV(\'Zec\',11,8);">11:8</a>; parallel <a onClick="return mV(\'Zec\',13,3);">13:3</a>; <a onClick="return mV(\'Zec\',14,16,18,19);">14:5,16,18,19</a>);<P>(b) the habit of expanding one fundamental thought into a series of clauses (<a onClick="return mV(\'Zec\',6,13);">Zec 6:13</a>; <a onClick="return mV(\'Zec\',9,5,7);">9:5,7</a>; <a onClick="return mV(\'Zec\',1,17);">1:17</a>; <a onClick="return mV(\'Zec\',3,8,9);">3:8,9</a>; <a onClick="return mV(\'Zec\',12,4);">12:4</a>);<P>(c) the habit of referring to a thought already introduced: e.g. to the "Branch" (<a onClick="return mV(\'Zec\',3,8);">Zec 3:8</a>; <a onClick="return mV(\'Zec\',6,12);">6:12</a>); "eyes" (<a onClick="return mV(\'Zec\',3,9);">Zec 3:9</a>; <a onClick="return mV(\'Zec\',4,10);">4:10</a>); measuring "line" (<a onClick="return mV(\'Zec\',1,16);">Zec 1:16</a>; <a onClick="return mV(\'Zec\',2,5,6);">2:5,6</a>); choosing Jerusalem (<a onClick="return mV(\'Zec\',1,17);">Zec 1:17</a>; <a onClick="return mV(\'Zec\',2,12);">2:12</a>; <a onClick="return mV(\'Zec\',3,2);">3:2</a>); removing iniquity (<a onClick="return mV(\'Zec\',3,9);">Zec 3:9</a>; <a onClick="return mV(\'Zec\',5,3);">5:3</a>ff; <a onClick="return mV(\'Zec\',13,2);">13:2</a>); measurements (<a onClick="return mV(\'Zec\',5,2);">Zec 5:2</a>; <a onClick="return mV(\'Zec\',14,10);">14:10</a>); colors of horses (<a onClick="return mV(\'Zec\',1,8);">Zec 1:8</a>; <a onClick="return mV(\'Zec\',6,2,6);">6:2,6</a>); the idea of Israel as a "flock" (<a onClick="return mV(\'Zec\',9,16);">Zec 9:16</a>; <a onClick="return mV(\'Zec\',10,2);">10:2</a>; <a onClick="return mV(\'Zec\',11,4);">11:4</a>f; <a onClick="return mV(\'Zec\',13,7);">13:7</A>); idols (<a onClick="return mV(\'Zec\',10,2);">Zec 10:2</a>; <a onClick="return mV(\'Zec\',13,2);">13:2</a>); shepherds (<a onClick="return mV(\'Zec\',11,3);">Zec 11:3</a>ff; <a onClick="return mV(\'Zec\',13,7);">13:7</a>); and of "all nations" (<a onClick="return mV(\'Zec\',11,10);">Zec 11:10</a>; <a onClick="return mV(\'Zec\',12,3);">12:3</a>ff; <a onClick="return mV(\'Zec\',14,2);">14:2</a>); Mitchell in attempting to answer this argument has failed utterly to grasp the point (ICC, 243);<P>(d) the use made of the cardinal number "two"; thus, two olive trees (<a onClick="return mV(\'Zec\',4,3);">Zec 4:3</a>); two women (<a onClick="return mV(\'Zec\',5,9);">Zec 5:9</a>); two mountains (<a onClick="return mV(\'Zec\',6,1);">Zec 6:1</a>); two staves (<a onClick="return mV(\'Zec\',11,7);">Zec 11:7</a>); two parts (<a onClick="return mV(\'Zec\',14,2,4);">Zec 14:2,4</a>); with which compare <a onClick="return mV(\'Zec\',6,13);">Zec 6:13</a>; <a onClick="return mV(\'Zec\',9,12);">9:12</a>; <a onClick="return mV(\'Zec\',14,8);">14:8</a>;<P>(e) the resort in each part of the book to symbolic actions as a mode of instruction; e.g. the coronation scene in <a onClick="return mV(\'Zec\',6,\')9-15\';">6:9-15</A>, and the breaking of the two staves in <a onClick="return mV(\'Zec\',11,\'4-14\');">11:4-14</A>.<P>(3) Certain peculiarities of diction and style favor unity of authorship; e.g. the phrase "no man passed through nor returned" (<a onClick="return mV(\'Zec\',7,14);">Zec 7:14</a>; <a onClick="return mV(\'Zec\',9,8);">9:8</a>) never occurs elsewhere in the Old Testament. The author\'s preference for and frequent use of vocatives (<a onClick="return mV(\'Zec\',2,7,10);">Zec 2:7,10</a>; <a onClick="return mV(\'Zec\',3,2,8);">3:2,8</a>; <a onClick="return mV(\'Zec\',4,7);">4:7</a>; <a onClick="return mV(\'Zec\',9,9,13);">9:9,13</a>; <a onClick="return mV(\'Zec\',11,1,2);">11:1,2</a>; <a onClick="return mV(\'Zec\',13,7);">13:7</a>); and especially the frequent alternation of the scriptio plena and the scriprio defectiva orthography in the Hebrew (compare <a onClick="return mV(\'Zec\',1,2,5);">Zec 1:2,5</a> with <a onClick="return mV(\'Zec\',1,4,6);">1:4,6</a> and <a onClick="return mV(\'Zec\',8,14);">8:14</A>; <a onClick="return mV(\'Zec\',2,11);">2:11</a> with <a onClick="return mV(\'Zec\',5,7);">5:7</A>; <a onClick="return mV(\'Zec\',1,11);">1:11</A> with <a onClick="return mV(\'Zec\',7,7);">7:7</A>; <a onClick="return mV(\'Zec\',9,5);">9:5</a> with <a onClick="return mV(\'Zec\',10,5,11);">10:5,11</A>; and <a onClick="return mV(\'Zec\',10,4);">10:4</A> with <a onClick="return mV(\'Zec\',9,9);">9:9</a>).<P>Accordingly, we conclude,<P>(1) that <a onClick="return mV(\'Zec\',9,\'1-\');">Zechariah 9-14</a> are of post-exilic origin;<P>(2) that they are not, however, late post-exilic;<P>(3) that they had their origin in the period just before the completion of the temple, 516 BC, and<P>(4) that they were probably composed by Zechariah himself.<P>6. Conclusion:<P>This conclusion is based upon the text taken as a whole, without an arbitrary dissection of the prophecies in the interests of a false theory. Mitchell (ICC, 258-59), after eliminating numerous individual passages, arrives at the conclusion that <a onClick="return mV(\'Zec\',9,\'1-\');">Zechariah 9-14</a> were written by four different writers;<P>(1) <a onClick="return mV(\'Zec\',9,\'1-10\');">Zec 9:1-10</a>, soon after 333 BC;<P>(2) <a onClick="return mV(\'Zec\',9,\'11-\');">Zec 9:11-11:3</a>, about 247-222 BC;<P>(3) <a onClick="return mV(\'Zec\',11,\'4-17\');">Zec 11:4-17</a> and <a onClick="return mV(\'Zec\',13,7,8,9);">13:7-9</A>, between 217 and 204 BC; and<P>(4) <a onClick="return mV(\'Zec\',12,\'1-\');">Zec 12:1</a>-<a onClick="return mV(\'Zec\',13,\'1-6\');">13:6</a> and chapter <a onClick="return mV(\'Zec\',14,\'1-\');">14</a>, about the same time.<P>Tradition points to a saner and securer conclusion, that these oracles were written by Zechariah himself; which in turn is corroborated by internal evidence, as has been shown above. One wonders why these oracles, written so late in Israel\'s history, should have been appended by the collectors of the Canon to the genuine prophecies of Zechariah, if, as is alleged, that prophet had nothing whatever to do with them!<P>LITERATURE.<P>(1) Those Who Defend the Unity of the Book:<P>C. H. H. Wright, Zechariah and His Prophecies (Bampton Lectures), London, 1879; G. L. Robinson, The Prophecies of Zechariah, with Special Reference to the Origin and Date of Chapters 9-14, Leipzig Dissertation, reprinted from American Journal of Semitic Languages and Literatures, XII, 1896; W.H. Lowe, Hebrew Student\'s Commentary on Zechariah, Hebrew and the Septuagint, London, 1882; O.J. Bredenkamp, Der Prophet Sach., Erklart, 1879; Marcus Dods, The Post-Exilian Prophets: Haggai, Zechariah, Malachi ("Handbook for Biblical Classes"), Edinburgh, 1879; E.B. Pusey, Minor Prophets, 1877; W. Drake, "Commentary on Zechariah" (Speaker\'s Commentary), 1876; T. W. Chambers, "The Book of Zechariah" (Lange\'s Bible Work), 1874; A. Van Hoonacker, in Revue Biblique,1902,161ff; idem, Les douze petits prophetes, 1908; Wm. Moeller, article "Zechariah" in The Illustrated Bible Dictionary, edited by W.C. Piercy, 1908.<P>(2) Those Who Advocate a Preexilic Origin for <a onClick="return mV(\'Zec\',9,1);">Zechariah 9-14</a>:<P>Hitzig-Steiner, Die zwolf kleinen Propheten, 1881; Samuel Davidson, An Introduction to the Old Testament, 1862-63; W. Pressel, Commentar zu den Schriften der Propheten Haggai, Sacharja und Maleachi, 1870; C. A. Bruston, Histoire critique de la litterature prophetique des Hebreux, 1881; Samuel Sharpe, History of the Hebrew Nation, Literature and Chronology, 1882; G. von Orelll, Das Buch Ezechiel u. die zwolf kleinen Propheten, 1888; Ferd. Montet, Etude critique sur la date assignable aux six derniers chapitres de Zac, 1882; H. L. Strack, Einleitung in das Altes Testament, 1895; F. W. Farrar, Minor Prophets, in "Men of the Bible" series.<P>(3) Those Who Advocate a Post-Zecharian Origin for Zecharaih 9-14:<P>B. Stade, "Deuterozacharja, eine krit. Studie," in ZATW, 1881-82; T. K. Cheyne, "The Date of <a onClick="return mV(\'Zec\',9,1);">Zec 9-14</a>," in JQR, I, 1889; C. H. Cornill, Einleitung in das Altes Testament, 1891; S. R. Driver, Introduction to the Literature of the Old Testament, 1910; J. Wellhausen, Die kleinen Propheten ubersetzt, 1893; N. I. Rubinkam, The Second Part of the Book of Zechariah, 1892; Karl Marti, Der Prophet Sacharja, 1892; A. F. Kirkpatrick, Doctrine of the Prophets, 1892; R. Eckardt, "Der Sprachgebrauch von Zach 9-14," ZATW,1893,76-109; A. K. Kuiper, Zacharja 9-14; eine exegetischcritische Studie, 1894; J. W. Rothstein, Die Nachtgesichte des Sacharja, 1910; G.A. Smith in Expositor\'s Bible, 1896-97; S. R. Driver In the New Century Bible; H. G. Mitchell, ICC, 1912.``152';
isbe[9352]='Zecher`ze\'-ker (zakher, pausal form for zekher, "memorial"; the King James Version Zacher): In <a onClick="return mV(\'1Ch\',8,31);">1Ch 8:31</a> = "Zechariah" of <a onClick="return mV(\'1Ch\',9,37);">1Ch 9:37</a>.`<a href="./study/isbe/search.html?string=ZECHARIAH">ZECHARIAH</a>`1';
isbe[9353]='Zechrias`zek-ri\'-as (Codex Vaticanus (Zechrias, A and Fritzsche, Ezerias; the King James Version Ezerias): An ancestor of Ezra (1Esdras 8:1) = "Azariah" of <a onClick="return mV(\'Ezr\',7,1);">Ezr 7:1</a>.``1';
isbe[9354]='Zedad`ze\'-dad (tsedhadhah, only found with He locale; Samaritan tseradhah; Septuagint Saradak, Sadadak, Saddak): A town or district named in <a onClick="return mV(\'Num\',34,8);">Nu 34:8</a>; <a onClick="return mV(\'Eze\',47,15);">Eze 47:15</a> as on the ideal northern boundary of Israel. The uncertainty of the reading has led to two different identifications being proposed. The form "Zerad" was accepted by yon Kasteren, and his identification was Khirbet Serada in the Merj \'Ayun, west of the Hasbany branch of the Jordan and north of \'Abil. This identification, however, would compel us to draw the ideal boundary along the Qasmiyeh valley and thence eastward to Hermon, and that is much too far south If with Dillmann, Wetzstein, Muehlau and others we read "Zedad," then it is clearly identical with Sadad, a village on the road between Ribleh and Qaryetain. It has been objected that Sadad is too far to the east; but here, as in the tribal boundaries also, the references are rather to the district or lands possessed than to their central town or village.``23';
isbe[9355]='Zedechias`zed-e-ki\'-as: 1Esdras 1:46 the King James Version = the Revised Version (British and American) "Sedekias."``1';
isbe[9356]='Zedekiah (1)`zed-e-ki\'-a (tsidhqiyahu, tsidhqiyah, "Yah my righteousness"; Sedekia, Sedekias):<P>(1) The son of Chenaanah (<a onClick="return mV(\'1Ki\',22,11,24);">1Ki 22:11,24</a>; <a onClick="return mV(\'2Ch\',18,10,23);">2Ch 18:10,23</a>). Zedekiah was apparently the leader and spokesman of the 400 prophets attached to the court in Samaria whom Ahab summoned in response to Jehoshaphat\'s request that a prophet of Yahweh should be consulted concerning the projected campaign against Ramoth-gilead. In order the better to impress his audience Zedekiah produced iron horns, and said to Ahab, "With these shalt thou push the Syrians, until they be consumed." He also endeavored to weaken the influence of Micaiah ben Imlah upon the kings by asking ironically, "Which way went the Spirit of Yahweh from me to speak unto thee?"<P>In Josephus (Ant., VIII, xv, 4) there is an interesting rearrangement and embellishment of the Biblical narrative. There Zedekiah is represented as arguing that since Micaiah contradicts Elijah\'s prediction as to the place of Ahab\'s death, he must be regarded as a false prophet. Then, smiting his opponent, he prayed that if he were in the wrong his right hand might forthwith be withered. Ahab, seeing that no harm befell the hand that had smitten Micaiah, was convinced; whereupon Zedekiah completed his triumph by the incident of the horns mentioned above.<P>(2) The son of Maaseiah (<a onClick="return mV(\'Jer\',29,\'21-23\');">Jer 29:21-23</a>). A false prophet who, in association with another, Ahab by name, prophesied among the exiles in Babylon, and foretold an early return from captivity. Jeremiah sternly denounced them, not only for their false and reckless predictions, but also for their foul and adulterous lives, and declared that their fate at the hands of Nebuchadnezzar should become proverbial in Israel.<P>(3) The son of Hananiah (<a onClick="return mV(\'Jer\',36,12);">Jer 36:12</a>). One of the princes of Judah before whom Jeremiah\'s roll was read in the 5th year of Jehoiakim.<P>(4) One of the officials who sealed the renewed covenant (<a onClick="return mV(\'Neh\',10,1);">Ne 10:1</a>, the King James Version "Zid-kijah"). The fact that his name is coupled with Nehemiah\'s suggests that he was a person of importance. But nothing further is known of him.<P>(5) The last king of Judah (see following article).``95';
isbe[9357]='Zedekiah (2)`(tsidhqiyahu, "Yah my righteousness"; name changed from Mattaniah (mattanyah, "gift of Yah"; Sedekias):<P><b>SOURCES FOR HIS REGION AND TIME</b><P>1. Annalistic<P>2. Prophetic<b><P>II. THE ADMINISTRATION OF THE LAST KING OF JUDAH</b><P>1. The Situation<P>2. The Parvenu Temper<P>3. Inconsistencies<P>4. Character of the King<P>5. His Fate<P>6. Doom of the Nation<hr /><P>The last king of Judah, uncle and successor of Jehoiachin; reigned 11 years, from 597 to 586, and was carried captive to Babylon.<P>I. Sources for His Reign and Time.<P>1. Annalistic:<P>Neither of the accounts in <a onClick="return mV(\'2Ki\',24,18);">2Ki 24:18-25:7</a> and <a onClick="return mV(\'2Ch\',36,\'11-21\');">2Ch 36:11-21</a> refers, as is the usual custom, to state annals; these ran out with the reign of Jehoiakim. The history in 2 Kings is purely scribal and historianic in tone; 2 Chronicles, especially as it goes on to the captivity, is more fervid and homiletic. Both have a common prophetic origin; and indeed <a onClick="return mV(\'Jer\',52,1);">Jeremiah 52</a>, which is put as an appendix to the book of his prophecy, tells the story of the reign and subsequent events, much as does 2 Kings, but in somewhat fuller detail.<P>2. Prophetic:<P>Two prophets are watching with keen eyes the progress of this reign, both with the poignant sense that the end of the Judean state is imminent: Jeremiah in Jerusalem and Ezekiel, one of the captives in the deportation with Jehoiachin, in Babylon. Dates are supplied with the prophecies of both: Jeremiah\'s numbered from the beginning of the reign and not consecutive; Ezekiel\'s numbered from the beginning of the first captivity, and so coinciding with Jeremiah\'s. From these dated prophecies the principal ideas are to be formed of the real inwardness of the time and the character of the administration. The prophetic passages identifiable with this reign, counted by its years, are: <a onClick="return mV(\'Jer\',24,\'1-\');">Jeremiah 24</a>, after the deportation of Jehoiachin (Jeconiah)—the inferior classes left with Zedekiah (compare <a onClick="return mV(\'Eze\',11,15);">Eze 11:15</a>; <a onClick="return mV(\'Eze\',17,\'12-14\');">17:12-14</a>); <a onClick="return mV(\'Jer\',27,\'1-\');">Jer 27-29</a>, beginning of reign—false hopes of return of captives and futile diplomacies with neighboring nations; <a onClick="return mV(\'Jer\',51,59);">Jer 51:59</a>, 4th year—Zedekiah\'s visit to Babylon; <a onClick="return mV(\'Eze\',4,\'1-\');">Eze 4-7</a>, 5th year—symbolic prophecies of the coming end of Judah; <a onClick="return mV(\'Eze\',8,\'1-\');">Eze 8-12</a>, 6th year—quasi-clairvoyant view of the idolatrous corruptions in Jerusalem; <a onClick="return mV(\'Eze\',17,\'11-21\');">Eze 17:11-21</a>, same year—Zedekiah\'s treacherous intrigues with Egypt; <a onClick="return mV(\'Eze\',21,\'18-23\');">Eze 21:18-23</a>, 7th year—Nebuchadnezzar casting a divination to determine his invasion of Judah; <a onClick="return mV(\'Jer\',21,\'1-\');">Jer 21</a>, undated but soon after—deputation from the king to the prophet inquiring Yahweh\'s purpose; <a onClick="return mV(\'Jer\',34,\'1-7\');">Jer 34:1-7</a>, undated—the prophet\'s word to the king while Nebuchadnezzar\'s invasion is still among the cities of the land; <a onClick="return mV(\'Eze\',24,1,2);">Eze 24:1,2</a>, 9th year—telepathic awareness of the beginning of the siege, synchronistic with <a onClick="return mV(\'Jer\',39,\'1-10\');">Jer 39:1-10</a>; <a onClick="return mV(\'2Ki\',25,\'1-7\');">2Ki 25:1-7</a>; <a onClick="return mV(\'Jer\',37,\'1-\');">Jer 37</a>; <a onClick="return mV(\'Jer\',38,\'1-\');">38</a>, undated, but soon after—prophecies connected with the temporary raising of the siege and the false faith of the ruling classes; <a onClick="return mV(\'Jer\',32,\'1-\');">Jer 32</a>, 10 th year—Jeremiah\'s redemption of his Anathoth property in the midst of siege, and the good presage of the act; <a onClick="return mV(\'Jer\',39,\'1-\');">Jer 39</a>, 11th year—annalistic account of the breaching of the city wall and the flight and eventual fate of the king. A year and a half later Ezekiel (<a onClick="return mV(\'Eze\',33,21,22);">33:21,22</a>) hears the news from a fugitive.<P>II. The Administration of the Last King of Judah.<P>1. The Situation:<P>When Nebuchadnezzar took away Jehoiachin, and with him all the men of weight and character (see under <a href="./study/isbe/search.html?string=JEHOIACHIN">JEHOIACHIN></a>), his object was plain: to leave a people so broken in resources and spirit that they would not be moved to rebellion (see <a onClick="return mV(\'Eze\',17,14);">Eze 17:14</a>). But this measure of his effected a segmentation of the nation which the prophets immediately recognized as virtually separating out their spiritual "remnant" to go to Babylon, while the worldly and inferior grades remained in Jerusalem. These are sharply distinguished from each other by Jeremiah in his parable of the Figs (chapter 24), published soon after the first deportation. The people that were left were probably of the same sort that Zephaniah described a few years before, those who had "settled on their lees" (<a onClick="return mV(\'Zep\',1,12);">1:12</a>), a godless and inert element in religion and state. Their religious disposition is portrayed by Ezekiel in Zedekiah\'s 6th year, in his clairvoyant vision of the uncouth temple rites, as it were a cesspool of idolatry, maintained under the pretext that Yahweh had forsaken the land (see <a onClick="return mV(\'Eze\',8,\'1-\');">Eze 8</a>). Clearly these were not of the prophetic stamp. It was over such an inferior grade of people that Zedekiah was appointed to a thankless and tragic reign.<P>2. The Parvenu Temper:<P>For a people so raw and inexperienced in administration the prophets recognized one clear duty: to keep the oath which they had given to Nebuchadnezzar (see <a onClick="return mV(\'Eze\',17,\'14-16\');">Eze 17:14-16</a>). But they acted like men intoxicated with new power; their accession to property and unwonted position turned their heads. Soon after the beginning of the reign we find Jeremiah giving emphatic warning both to his nation and the ambassadors of neighboring nations against a rebellious coalition (<a onClick="return mV(\'Jer\',27,\'1-\');">Jeremiah 27</a> mistakenly dated in the 4th year of Jehoiakim; compare <a onClick="return mV(\'Jer\',27,3,12);">27:3,12</A>); he has also an encounter with prophets who, in contradiction of his consistent message, predict the speedy restoration of Jehoiachin and the temple vessels. The king\'s visit to Babylon (<a onClick="return mV(\'Jer\',51,59);">Jer 51:59</a>) was probably made to clear himself of complicity in treasonable plots. Their evil genius, Egypt, however, is busy with the too headstrong upstart rulers; and about the middle of the reign Zedekiah breaks his covenant with his over-lord and, relying on Egypt, embarks on rebellion. The prophetic view of this movement is, that it is a moral outrage; it is breaking a sworn word (<a onClick="return mV(\'Eze\',17,\'15-19\');">Eze 17:15-19</a>), and thus falsifying the truth of Yahweh.<P>3. Inconsistencies:<P>This act of rebellion against the king of Babylon was not the only despite done to "Yahweh\'s oath." Its immediate effect, of course, was to precipitate the invasion of the Chaldean forces, apparently from Riblah on the Orontes, where for several years Nebuchadnezzar had his headquarters. Ezekiel has a striking description of his approach, halting to determine by arrow divination whether to proceed against Judah or Ammon (<a onClick="return mV(\'Eze\',21,\'18-23\');">21:18-23</A>). Before laying siege to Jerusalem, however, he seems to have spent some time reducing outlying fortresses (compare <a onClick="return mV(\'Jer\',34,\'1-7\');">Jer 34:1-7</a>); and during the suspense of this time the king sent a deputation to Jeremiah to inquire whether Yahweh would not do "according to all his wondrous works," evidently hoping for some such miraculous deliverance as had taken place in the time of Sennacherib (<a onClick="return mV(\'Jer\',21,1);">Jer 21:1</a>). The prophet gives his uniform answer, that the city must fall; advising the house of David also to "execute justice and righteousness." Setting about this counsel as if they would bribe Yahweh\'s favor, the king then entered into an agreement with his people to free all their Hebrew bond-slaves (<a onClick="return mV(\'Jer\',34,\'8-10\');">Jer 34:8-10</a>), and sent back a deputation to the prophet entreating his intercession (<a onClick="return mV(\'Jer\',37,3);">Jer 37:3</a>), as if, having bribed Yahweh, they might work some kind of a charm on the divine will. Nebuchadnezzar had meanwhile invested the city; but just then the Egyptian army approached to aid Judah, and the Babylonian king raised the siege long enough to drive the Egyptians back to their own land; at which, judging that Yahweh had interfered as of old, the people caused their slaves to return to their bondage (<a onClick="return mV(\'Jer\',34,11);">Jer 34:11</a>). This treachery called forth a trenchant prophecy from Jeremiah, predicting not only the speedy return of the Chaldean army (<a onClick="return mV(\'Jer\',37,\'6-10\');">Jer 37:6-10</a>), but the captivity of the king and the destruction of the city (<a onClick="return mV(\'Jer\',34,\'17-22\');">Jer 34:17-22</a>). It was during this temporary cessation of the siege that Jeremiah, attempting to go to Anathoth to redeem his family property, was seized on the pretext of deserting to the enemy, and put in prison (<a onClick="return mV(\'Jer\',37,\'11-15\');">Jer 37:11-15</a>).<P>4. Character of the King:<P>During the siege, which was soon resumed, Zedekiah\'s character, on its good and bad sides, was revealed through his frequent contact with the prophet Jeremiah. The latter was a prisoner most of the time; and the indignities which he suffered, and which the king heedlessly allowed, show how the prophet\'s word and office had fallen in respect (compare the treatment he received, <a onClick="return mV(\'Jer\',26,\'16-19\');">Jer 26:16-19</a> with <a onClick="return mV(\'Jer\',37,15);">37:15</A>; <a onClick="return mV(\'Jer\',38,6);">38:6</A>). The king, however, was not arrogant and heartless like his brother Jehoiakim; he was weak and without consistent principles; besides, he was rather helpless and timid in the hands of his headstrong officials (compare <a onClick="return mV(\'Jer\',38,5,24,25,26);">Jer 38:5,24-26</a>). His regard for the word of prophecy was rather superstitious than religious: while the prophet\'s message and counsel were uniformly consistent, he could not bring himself to follow the will of Yahweh, and seemed to think that Yahweh could somehow be persuaded to change his plans (see <a onClick="return mV(\'Jer\',37,17);">Jer 37:17</a>; <a onClick="return mV(\'Jer\',38,\'14-16\');">38:14-16</a>). His position was an exceedingly difficult one; but even so, he had not the firmness, the wisdom, the consistency for it.<P>In his siege of the city Nebuchadnezzar depended mainly on starving it into surrender; and we cannot withhold a measure of admiration for a body of defenders who, in spite of the steadily decreasing food supply and the ravages of pestilence, held the city for a year and a half.<P>5. His Fate:<P>During this time Jeremiah\'s counsel was well known: the counsel of surrender, and the promise that so they could save their lives (<a onClick="return mV(\'Jer\',21,9);">Jer 21:9</a>; <a onClick="return mV(\'Jer\',38,2);">38:2</a>). It was for this, indeed, that he was imprisoned, on the plea that he "weakened the hands" of the defenders; and it was due to the mercy of a foreign slave that he did not suffer death (<a onClick="return mV(\'Jer\',38,\'7-9\');">Jer 38:7-9</a>). At length in the 11th year of Zedekiah\'s reign, just as the supply of food in the city was exhausted, the Chaldean army effected a breach in the wall, and the king of Babylon with his high officials came in and sat in the middle gate. Zedekiah and his men of war, seeing this, fled by night, taking the ill-advised route by the road to Jericho; were pursued and captured in the plains of the Jordan; and Zedekiah was brought before the king of Babylon at Riblah. After putting to death Zedekiah\'s sons and the nobles of Judah before his eyes, the king of Babylon then put out the eyes of Zedekiah and carried him captive to Babylon, where, it is uncertain how long after, he died. Jeremiah had prophesied that he would die in peace and have a state mourning (<a onClick="return mV(\'Jer\',34,4,5);">Jer 34:4,5</a>); Ezekiel\'s prophecy of his doom is enigmatic: "I will bring him to Babylon to the land of the Chaldeans; yet shall he not see it, though he shall die there" (<a onClick="return mV(\'Eze\',12,13);">Eze 12:13</a>).<P>6. Doom of the Nation:<P>The cruelly devised humiliation of the king was only an episode in the tragic doom of the city and nation. Nebuchadnezzar was not minded to leave so stubborn and treacherous a fortress on his path of conquest toward Egypt. A month after the event at Riblah his deputy, Nebuzaradan, entered upon the reduction of the city: burning the temple and all the principal houses, breaking down the walls, carrying away the temple treasures still unpillaged, including the bronze work which was broken into scrap metal, and deporting the people who were left after the desperate resistance and those who had voluntarily surrendered. The religious and state officials were taken to Riblah and put to death. "So," the historian concludes, "Judah was carried away captive out of his land" (<a onClick="return mV(\'Jer\',52,27);">Jer 52:27</a>). This was in 586 BC. This, however, was only the political date of the Babylonian exile, the retributive limit for those leavings of Israel who for 11 years had played an insincere game of administration and failed. The prophetic date, from which Ezekiel reckons the years of exile, and from which the prophetic eye is kept on the fortunes and character of the people who are to be redeemed, was 597 BC, when Jehoiachin\'s long imprisonment began and when the flower of Israel, transplanted to a foreign home, began its term of submission to the word and will of Yahweh. It was this saving element in Israel who still had a recognized king and a promised future. By both Jeremiah and Ezekiel, Zedekiah was regarded not as Yahweh\'s anointed but as the one whom Nebuchadnezzar "had made king" (<a onClick="return mV(\'Jer\',37,1);">Jer 37:1</a>; <a onClick="return mV(\'Eze\',17,16);">Eze 17:16</a>), "the king that sitteth upon the throne of David" (<a onClick="return mV(\'Jer\',29,16);">Jer 29:16</a>). The real last king of Judah was Jehoiachin; Ezekiel\'s title for Zedekiah is "prince" (<a onClick="return mV(\'Eze\',12,10);">Eze 12:10</a>).``66';
isbe[9358]='Zeeb`ze\'-eb, zeb.`<a href="./study/isbe/search.html?string=OREB">OREB</a>`1';
isbe[9359]='Zela, Zelah`ze\'-la (tsela\' (<a onClick="return mV(\'2Sa\',21,14);">2Sa 21:14</a>)): A city in the territory of Benjamin (<a onClick="return mV(\'Jos\',18,28);">Jos 18:28</a>; the Septuagint here omits). Here was the burying-place of the family of Saul, whither the bones of the king and of Jonathan were brought for burial (<a onClick="return mV(\'2Sa\',21,14);">2Sa 21:14</a>; the Septuagint here reads en te pleura, translating tsela\', "side"). The place is not identified. It may be the Zilu of the Tell el-Amarna Letters.``1';
isbe[9360]='Zelek`ze\'-lek (tseleq, meaning unknown): An Ammonite, one of David\'s mighty men (<a onClick="return mV(\'2Sa\',23,37);">2Sa 23:37</a>; <a onClick="return mV(\'1Ch\',11,39);">1Ch 11:39</a>).``1';
isbe[9361]='Zelophehad`ze-lo\'-fe-had (tslophchadh, meaning unknown): Head of a Manassite family who died without male issue (<a onClick="return mV(\'Num\',26,33);">Nu 26:33</a>; <a onClick="return mV(\'Num\',27,1,7);">27:1,7</a>; <a onClick="return mV(\'Num\',36,2,6,10,11);">36:2,6,10,11</a>; <a onClick="return mV(\'Jos\',17,3);">Jos 17:3</a>; <a onClick="return mV(\'1Ch\',7,15);">1Ch 7:15</a>). His daughters came to Moses and Eleazar and successfully pleaded for a possession for themselves (<a onClick="return mV(\'Num\',27,1);">Nu 27:1</a>). This became the occasion for a law providing that in the case of a man dying without sons, the inheritance was to pass to his daughters if he had any. A further request is made (<a onClick="return mV(\'Num\',36,2);">Nu 36:2</a>) by the heads of the Gileadite houses that the women who were given this right of inheritance should be compelled to marry members of their own tribe, so that the tribe may not lose them and their property. This is granted and becomes law among the Hebrews.<P>Gray says (ICC on <a onClick="return mV(\'Num\',26,33);">Nu 26:33</a>) that the "daughters" of Zelophehad are towns or clans.``149';
isbe[9362]='Zelotes`ze-lo\'-tez (Zelotes).`<a href="./study/isbe/search.html?string=SIMON+THE+ZEALOT">SIMON THE ZEALOT</a>; <a href="./study/isbe/search.html?string=ZEALOT">ZEALOT</a>`1';
isbe[9363]='Zelzah`zel\'-za (tseltsach; hallomenous megala): A place where Samuel told Saul he would meet two men with news that the asses were found. Its position is defined as "by Rachel\'s sepulchre, in the border of Benjamin" (<a onClick="return mV(\'1Sa\',10,2);">1Sa 10:2</a>). It has been thought that the place of meeting was sufficiently indicated without the word betseltsach, which is translated "at Zelzah," and that this cannot therefore be a place-name. The Septuagint has "leaping mightily" or "in great haste" (Ewald) points to a different text. Whether the Greek can be so translated is also a question, as megala does not elsewhere occur as an adverb. Some corruption of the text is probable. The border of Benjamin may be roughly determined, but the tomb of Rachel is now unknown. No name like Zelzah has been recovered in the district. Smith ("Samuel," ICC, at the place) suggests that we should read "Zela" for "Zelzah" (tsela\', for tseltsach).``54';
isbe[9364]='Zemaraim`zem-a-ra\'-im (cemdrayim; Codex Vaticanus Sara; Codex Alexandrinus Semrim): A city in the territory of Benjamin. It is named between Betharabah and Bethel (<a onClick="return mV(\'Jos\',18,22);">Jos 18:22</a>), and is probably to be sought east of the latter city. It is usual to identify it with es-Samra, a ruin about 4 miles north of Jericho. Mt. Zemaraim probably derived its name from the city, and must be sought in the neighborhood. On this height, which is said to be in Mt. Ephraim, Abijah, king of Judah, stood when making his appeal to the men of Israel under Jeroboam (<a onClick="return mV(\'2Ch\',13,4);">2Ch 13:4</a>). If the identification with es-Samra is correct, this hill must be in the uplands to the west, es-Samra being on the floor of the valley. Dillmann (Joshua, at the place) thinks Zemaraim cannot be so far east of Bethel, but may be found somewhere to the south of that town.``54';
isbe[9365]='Zemarite`zem\'-a-rit (ha-tsemari; ho Samaraios): A Canaanite people named in <a onClick="return mV(\'Gen\',10,18);">Ge 10:18</a>; <a onClick="return mV(\'1Ch\',1,16);">1Ch 1:16</a>. The occurrence of the name between Arvadite and Hamathite gives a hint as to locality. A place called Cumur is mentioned in the Tell el-Amarna Letters along with Arvad. The name probably survives in that of Sumra, a village on the seacoast between Tripolis and Ruwad, about 1 1/2 miles north of Nahr el-Kebir. We may with some certainty identify this modern village with the site of the town from which the inhabitants were named "Zemarites."``1';
isbe[9366]='Zemirah`ze-mi\'-ra (zemirah, meaning uncertain; Septuagint Codex Vaticanus Amarias; Codex Alexandrinus Zamarias; the King James Version Zemira): A descendant of Benjamin (<a onClick="return mV(\'1Ch\',7,8);">1Ch 7:8</a>), but more probably of Zebulun (Curtis, Chronicles, 145ff).``1';
isbe[9367]='Zenan`ze\'-nan.`<a href="./study/isbe/search.html?string=ZAANAN">ZAANAN</a>`1';
isbe[9368]='Zenas`ze\'-nas (Zenas (<a onClick="return mV(\'Tts\',3,13);">Tit 3:13</a>); the name in full would probably be Zenodorus, literally, meaning "the gift of Zeus"):<P>1. A Jewish Lawyer:<P>Paul calls Zenas "the lawyer." The meaning of this is, that, previous to his becoming a Christian, he had been a Jewish lawyer. The lawyers were that class of Jewish teachers who were specially learned in the Mosaic Law, and who interpreted that Law, and taught it to the people.<P>They are met with again and again in the Gospels, where they frequently came into contact with Christ, usually in a manner hostile to Him. For example, "A certain lawyer stood up and made trial of him, saying, Teacher, what shall I do to inherit eternal life?" (<a onClick="return mV(\'Luk\',10,25);">Lu 10:25</a>). our Lord replied to him on his own ground, asking, "What is written in the law? how readest thou?" Regarding this class of teachers as a whole, it is recorded that "the Pharisees and lawyers rejected for themselves the counsel of God" (<a onClick="return mV(\'Luk\',7,30);">Lu 7:30</a>). The term nomikos, "lawyer," applied to Zenas, is in the Gospels varied by nomodidakalos, "a teacher of the law," and by grammateus, "a scribe": all three terms describe the same persons. Before his conversion to Christ, Zenas had been a lawyer, one of the recognized expounders of the Law of Moses.<P>A different view of Zenas\' occupation is taken by Zahn (Introduction to the New Testament, II, 54), who says that in itself nomikos could denote a rabbi, quoting Ambrosiaster, "Because Zenas had been of this profession in the synagogue, Paul calls him by this name." But Zahn gives his own opinion that "since the Jewish scribe who became a Christian, by that very act separated himself from the rabbinic body, and since the retention of rabbinic methods and ways of thinking was anything but a recommendation in Paul\'s eyes (<a onClick="return mV(\'1Ti\',1,7);">1Ti 1:7</a>), Zenas is here characterized, not as legis (Mosaicae), doctor, but as juris peritus. The word denotes not an office, but usually the practical lawyer, through whose assistance e.g. a will is made, or a lawsuit carried on. Plutarch applies this name to the renowned jurist Mucius Scaevola."<P>The ordinary meaning seems preferable, which sees in Zenas one who previous to his conversion had been a Jewish rabbi.<P>2. Paul\'s Wishes regarding Zenas:<P>It is not certain where Paul was when he wrote the Epistle to Titus. But he directs Titus to come to him to Nicopolis, where he had resolved to spend the ensuing winter. And he adds the injunction that he desires him to "bring Zenas the lawyer and Apollos"—Paul\'s old friend from Alexandria—with him "on their journey diligently, that nothing be wanting unto them" (the King James Version). This may mean that Paul wished to have Zenas and Apollos with him at Nicopolis; but, on the other hand, it may not have this meaning. For the King James Version in translating "bring" is in error. The word signifies, as given in the Revised Version (British and American), "set forward" on their journey, that is, furnish them with all that they need for the journey. But even supposing Paul is not instructing Titus to bring Zenas and Apollos to Nicopolis—though this is perhaps what he means—yet it is most interesting to find these two friends of the apostle mentioned in this particular way, and especially at a time so near to the close of his life. Paul was unselfish as ever, solicitous that Zenas and Apollos be comfortably provided for on their intended journey. He is full of affectionate regard for them, interested in their welfare at every step; while he himself is far distant in another country, he remembers them with tender and sympathetic friendship. Doubtless the two friends reciprocated his affection.<P>Nothing more is known of Zenas than is contained in this passage.``155';
isbe[9369]='Zend-Avesta`zend-a-ves\'-ta.`<a href="./study/isbe/search.html?string=PERSIAN+RELIGION">PERSIAN RELIGION</a>; <a href="./study/isbe/search.html?string=ZOROASTRIANISM">ZOROASTRIANISM</a>`1';
isbe[9370]='Zephaniah`zef-a-ni\'-a (tsephanyah, tsephanyahu, "Yah hath treasured"):<P>(1) The prophet.<P>See <a href="./study/isbe/search.html?string=ZEPHANIAH,+BOOK+OF">ZEPHANIAH, BOOK OF</a>.<P>(2) A Levite or priest (<a onClick="return mV(\'1Ch\',6,36);">1Ch 6:36 (Hebrew 21)</a>), called in some genealogies "Uriel" (<a onClick="return mV(\'1Ch\',6,24);">1Ch 6:24</a>; <a onClick="return mV(\'1Ch\',15,5,11);">15:5,11</a>).<P>(3) Judean father or fathers of various contemporaries of Zechariah, the prophet (<a onClick="return mV(\'Zec\',6,10,14);">Zec 6:10,14</a>).<P>(4) A priest, the second in rank in the days of Jeremiah. He was a leader of the "patriotic" party which opposed Jeremiah. Nevertheless, he was sent to the prophet as a messenger of King Zedekiah when Nebuchadnezzar was about to attack the city (<a onClick="return mV(\'Jer\',21,1);">Jer 21:1</a>) and at other crises (<a onClick="return mV(\'Jer\',37,3);">Jer 37:3</a>; compare <a onClick="return mV(\'Jer\',29,25,29);">29:25,29</a>; <a onClick="return mV(\'2Ki\',25,18);">2Ki 25:18</a>). That he continued to adhere to the policy of resistance against Babylonian authority is indicated by the fact that he was among the leaders of Israel taken by Nebuzaradan before the king of Babylon, and killed at Riblah (<a onClick="return mV(\'2Ki\',25,18);">2Ki 25:18</a> parallel <a onClick="return mV(\'Jer\',52,24);">Jer 52:24</a>).``81';
isbe[9371]='Zephaniah, Apocalypse of`A (probably) Jewish apocryphal work of this name is mentioned in the Stichometry of Nicephorus and another list practically identical with this; a quotation from it is also preserved by Clement of Alexandria (Strom., v. 11,77). Dr. Charles thinks this indicates a Christian revision (Encyclopedia Brittanica, II, article "Apocalypse"); others suppose it to point to a Christian, rather than a Jewish, origin. See Schurer, HJP, div II, volume III, pp. 126-27, 132; GJV4, III, 367-69.``1';
isbe[9372]='Zephaniah, Book of`<b>I. THE AUTHOR</b><P class="in15">1. Name<P class="in15">2. Ancestry<P class="in15">3. Life<P><b>II. TIME</b><P class="in15">1. Date<P class="in15">2. Political Situation<P class="in15">3. Moral and Religious Conditions<P><b>III. BOOK</b><P class="in15">1. Contents<P class="in15">2. Integrity<P><b>IV. TEACHING</b><P class="in15">1. The Day of Yahweh<P class="in15">2. Universalism<P class="in15">3. Messianic Prophecy<P><b>LITERATURE</b><hr /><P>I. The Author.<P>1. Name:<P>The name "Zephaniah" (tsephanyah; Sophonias), which is borne by three other men mentioned in the Old Testament, means "Yah hides," or "Yah has hidden" or "treasured." "It suggests," says G. A. Smith, "the prophet\'s birth in the killing time of Manasseh" (<a onClick="return mV(\'2Ki\',21,16);">2Ki 21:16</a>).<P>2. Ancestry:<P>The ancestry of the prophet is carried back four generations (<a onClick="return mV(\'Zep\',1,1);">Ze 1:1</a>), which is unusual in the Old Testament (compare <a onClick="return mV(\'Isa\',1,1);">Isa 1:1</a>; <a onClick="return mV(\'Hsa\',1,1);">Ho 1:1</a>); hence, it is thought, not without reason (Eiselen, Minor Prophets, 505), that the last-mentioned ancestor, Hezekiah, must have been a prominent man—indeed, no other than King Hezekiah of Judah, the contemporary of Isaiah and Micah. If Zephaniah was of royal blood, his condemnation of the royal princes (<a onClick="return mV(\'Zep\',1,8);">1:8</A>) becomes of great interest. In a similar manner did Isaiah, who in all probability was of royal blood, condemn without hesitation the shortcomings and vices of the rulers and the court. An ancient tradition declares that Zephaniah was of the tribe of Simeon, which would make it impossible for him to be of royal blood; but the origin and value of this tradition are uncertain.<P>Zephaniah lived in Judah; that he lived in Jerusalem is made probable by the statement in 1:4, "I will cut off...from this place," as well as by his intimate knowledge of the topography of the city (<a onClick="return mV(\'Zep\',1,10,11);">1:10,11</a>).<P>3. Life:<P>For how long he continued his prophetic activity we do not know, but it is not improbable that, as in the case of Amos, his public activity was short, and that, after delivering his message of judgment in connection with a great political crisis, he retired to private life, though his interest in reforms may have continued (<a onClick="return mV(\'2Ki\',23,2);">2Ki 23:2</a>).<P>II. Time.<P>1. Date:<P>The title (<a onClick="return mV(\'Zep\',1,1);">Ze 1:1</a>) places the prophetic activity of Zephaniah somewhere within the reign of Josiah, that is, between 639 and 608 BC. Most scholars accept this statement as historically correct. The most important exception is E. Koenig (Einl, 252ff), who places it in the decade following the death of Josiah. Koenig\'s arguments are altogether inconclusive, while all the internal evidence points toward the reign of Josiah as the period of Zephaniah\'s activity. Can the ministry of the prophet be more definitely located within the 31 years of Josiah? The latter\'s reign falls naturally into two parts, separated by the great reform of 621. Does the work of Zephaniah belong to the earlier or the later period?<P>The more important arguments in favor of the later period are:<P>(a) <a onClick="return mV(\'Deu\',28,29,30);">De 28:29,30</a> is quoted in <a onClick="return mV(\'Zep\',1,13,15,17);">Ze 1:13,15,17</a>, in a manner which shows that the former book was well known, but according to the modern view, the Deuteronomic Code was not known until 621, because it was lost (<a onClick="return mV(\'2Ki\',22,8);">2Ki 22:8</a>).<P>(b) The "remnant of Baal" (<a onClick="return mV(\'Zep\',1,4);">Ze 1:4</a>) points to a period when much of the Baal-worship had been removed, which means subsequent to 621.<P>(c) The condemnation of the "king\'s sons" (<a onClick="return mV(\'Zep\',1,8);">Ze 1:8</a>) presupposes that at the time of the utterance they had reached the age of moral responsibility; this again points to the later period.<P>These arguments are inconclusive:<P>(a) The resemblances between Deuteronomy and Zephaniah are of such a general character that dependence of either passage on the other is improbable.<P>(b) The expression in <a onClick="return mV(\'Zep\',1,4);">Ze 1:4</a> bears an interpretation which made its use quite appropriate before 621 (Eiselen, Minor Prophets, 508).<P>(c) "King\'s sons" may be equivalent to "royal princes," referring not to Josiah\'s children at all. The last two objections lose all force if the Septuagint readings are accepted (<a onClick="return mV(\'Zep\',1,4);">Ze 1:4</a>, "names of Baal"; <a onClick="return mV(\'Zep\',1,8);">1:8</A>, "house of the king").<P>On the other hand, there are several considerations pointing to the earlier date:<P>(a) The youth of the king would make it easy for the royal princes to go to the excesses condemned in <a onClick="return mV(\'Zep\',1,8,9);">Ze 1:8,9</a>.<P>(b) The idolatrous practices condemned by Zephaniah (<a onClick="return mV(\'Zep\',1,3,4,5);">1:3-5</a>) are precisely those abolished in 621.<P>(c) The temper described in <a onClick="return mV(\'Zep\',1,12);">Ze 1:12</a> is explicable before 621 and after the death of Josiah in 608, but not between 621 and 608, when religious enthusiasm was widespread.<P>(d) Only the earlier part of Josiah\'s reign furnishes a suitable occasion for the prophecy.<P>Evidently at the time of its delivery an enemy was threatening the borders of Judah and of the surrounding nations. But the only foes of Judah during the latter part of the 7th century meeting all the conditions are the Scythians, who swept over Western Asia about 625 BC. At the time the prophecy was delivered their advance against Egypt seems to have been still in the future, but imminent (<a onClick="return mV(\'Zep\',1,14);">Ze 1:14</a>); hence, the prophet\'s activity may be placed between 630 and 625, perhaps in 626. If this date is correct, Zephaniah and Jeremiah began their ministries in the same year.<P>2. Political Situation:<P>Little can be said about the political conditions in Judah during the reign of Josiah, because the Biblical books are silent concerning them. Josiah seems to have remained loyal to his Assyrian lord to the very end, even when the latter\'s prestige had begun to wane, and this loyalty cost him his life (<a onClick="return mV(\'2Ki\',23,29);">2Ki 23:29</a>). As already suggested, the advance of the Scythians furnished the occasion of the prophecy. Many questions concerning these Scythians remain still unanswered, but this much is clear, that they were a non-Semitic race of barbarians, which swept in great hordes over Western Asia during the 7th century BC (see <a href="./study/isbe/search.html?string=SCYTHIANS">SCYTHIANS</a>). The prophet looked upon the Scythians as the executioners of the divine judgment upon his sinful countrymen and upon the surrounding nations; and he saw in the coming of the mysterious host the harbinger of the day of Yahweh.<P>3. Moral and Religious Conditions:<P>The Book of Zephaniah, the early discourses of Jeremiah, and <a onClick="return mV(\'2Ki\',21,\'1-\');">2Ki 21-23</a> furnish a vivid picture of the social, moral, and religious conditions in Judah at the time Zephaniah prophesied. Social injustice and moral corruption were widespread (<a onClick="return mV(\'Zep\',3,1,3,7);">3:1,3,7</A>). Luxury and extravagance might be seen on every hand; fortunes were heaped up by oppressing the poor (<a onClick="return mV(\'Zep\',1,8.9);">1:8,9</A>). The religious situation was equally bad. The reaction under Manasseh came near making an end of Yahweh-worship (<a onClick="return mV(\'2Ki\',21,\'1-\');">2Ki 21</a>). Amon followed in the footsteps of his father, and the outlook was exceedingly dark when Josiah came to the throne. Fortunately the young king came under prophetic influence from the beginning, and soon undertook a religious reform, which reached its culmination in the 18th year of his reign. When Zephaniah preached, this reform was still in the future. The Baalim were still worshipped, and the high places were flourishing (<a onClick="return mV(\'Zep\',1,4);">1:4</A>); the hosts of heaven were adored upon the housetops (<a onClick="return mV(\'Zep\',1,5);">1:5</A>); a half-hearted Yahweh-worship, which in reality was idolatry, was widespread (<a onClick="return mV(\'Zep\',1,5);">1:5</A>); great multitudes had turned entirely from following Yahweh (<a onClick="return mV(\'Zep\',1,6);">1:6</A>). When the cruel Manasseh was allowed to sit undisturbed upon the throne for more than 50 years, many grew skeptical and questioned whether Yahweh was taking any interest in the affairs of the nation; they began to say in their hearts, "Yahweh will not do good, neither will he do evil" (<a onClick="return mV(\'Zep\',1,12);">1:12</A>). Conditions could hardly be otherwise, when the religious leaders had become misleaders (<a onClick="return mV(\'Zep\',3,4);">3:4</A>). The few who, amid the general corruption, remained faithful would be insufficient to avert the awful judgment upon the nation, though they themselves might be "hid in the day of Yahweh\'s anger" (<a onClick="return mV(\'Zep\',2,43;">2:3</A>).<P>III. Book.<P>1. Contents:<P>The Book of Zephaniah falls naturally into two parts of unequal length. The first part (<a onClick="return mV(\'Zep\',1,\'2-\');">1:2-3:8</A>) contains, almost exclusively, denunciations and threats; the second (<a onClick="return mV(\'Zep\',3,\'9-20\');">3:9-20</A>), a promise of salvation and glorification. The prophecy opens with the announcement of a world judgment (<a onClick="return mV(\'Zep\',1,2,3);">1:2,3</A>), which will be particularly severe upon Judah and Jerusalem, because of idolatry (<a onClick="return mV(\'Zep\',1,4,5,6);">1:4-6</A>). The ungodly nobles will suffer most, because they are the leaders in crime (<a onClick="return mV(\'Zep\',1,8,9);">1:8,9</A>). The judgment is imminent (<a onClick="return mV(\'Zep\',1,7);">1:7</a>); when it arrives there will be wailing on every hand (<a onClick="return mV(\'Zep\',1,10,11);">1:10,11</A>). No one will escape, even the indifferent skeptics will be aroused (<a onClick="return mV(\'Zep\',1,12,13);">1:12,13</A>). In the closing verses of chapter <a onClick="return mV(\'Zep\',1,\'1-\');">1</A>, the imminence and terribleness of the day of Yahweh are emphasized, from which there can be no escape, because Yahweh has determined to make a "terrible end of all them that dwell in the land" (<a onClick="return mV(\'Zep\',1,\14-18\');">1:14-18</A>). A way of escape is offered to the meek; if they seek Yahweh, they may be "hid in the day of Yahweh" (<a onClick="return mV(\'Zep\',2,1,2,3);">2:1-3</A>). <a onClick="return mV(\'Zep\',2,\'4-15\');">Ze 2:4-15</a> contains threats upon 5 nations, Philistia (<a onClick="return mV(\'Zep\',2,\'4-7\');">2:4-7</A>), Moab and Ammon (<a onClick="return mV(\'Zep\',2,\'8-11\');">2:8-11</A>), Ethiopia (<a onClick="return mV(\'Zep\',2,12);">2:12</A>), Assyria (<a onClick="return mV(\'Zep\',2,13,14,15);">2:13-15</a>). In <a onClick="return mV(\'Zep\',3,1);">Ze 3:1</a> the prophet turns once more to Jerusalem. Leaders, both civil and religious, and people are hopelessly corrupt (<a onClick="return mV(\'Zep\',3,\'1-4\');">3:1-4</A>), and continue so in spite of Yahweh\'s many attempts to win the city back to purity (<a onClick="return mV(\'Zep\',3,\'5-7\');">3:5-7</A>); hence, the judgment which will involve all nations has become inevitable (<a onClick="return mV(\'Zep\',3,8);">3:8</A>). A remnant of the nations and of Judah will escape and find rest and peace in Yahweh (<a onClick="return mV(\'Zep\',3,\'9-13\');">3:9-13</A>). The closing section (<a onClick="return mV(\'Zep\',3,\'14-204);">3:14-20</A>) pictures the joy and exaltation of the redeemed daughter of Zion.<P>2. Integrity:<P>The authenticity of every verse in <a onClick="return mV(\'Zep\',2,\'1-\');">Zephaniah 2</a> and <a onClick="return mV(\'Zep\',3,\'1-\');">3</A>, and of several verses in chapter <a onClick="return mV(\'Zep\',1,\'1-\');">1</a>, has been questioned by one or more scholars, but the passages rejected or questioned with greatest persistency are <a onClick="return mV(\'Zep\',2,\'1-15\');">2:1-3,4-15</a> (especially <a onClick="return mV(\'Zep\',2,\'8-11\');">2:8-11</A>); <a onClick="return mV(\'Zep\',3,9,10,\'14-20\');">3:9,10,14-20</a>. The principal objection to <a onClick="return mV(\'Zep\',2,\'1-3\');">2:1-3</A> is the presence in <a onClick="return mV(\'Zep\',2,3);">2:3</A> of the expressions "meek of the earth," and "seek meekness." It is claimed that "meek" and "meekness" as religious terms are post-exilic. There can be no question that the words occur more frequently in post-exilic psalms and proverbs than in preexilic writings, but it cannot be proved, or even shown to be probable, that the words might not have been used in Zephaniah\'s day (compare <a onClick="return mV(\'Exd\',10,3);">Ex 10:3</a>; <a onClick="return mV(\'Num\',12,3);">Nu 12:3</a>; <a onClick="return mV(\'Isa\',2,9);">Isa 2:9</a>ff; <a onClick="return mV(\'Mic\',6,8);">Mic 6:8</a>). A second objection is seen in the difference of tone between these verses and <a onClick="return mV(\'Zep\',1,\'1-\');">Zephaniah 1</a>. The latter, from beginning to end, speaks of the terrors of judgment; <a onClick="return mV(\'Zep\',2,\'1-3\');">2:1-3</A> weakens this by offering a way of escape. But surely, judgment cannot have been the last word of the prophets; in their thought, judgment always serves a disciplinary purpose. They are accustomed to offer hope to a remnant. Hence, <a onClick="return mV(\'Zep\',2,\'1-3\');">2:1-3</A> seems to form the necessary completion of chapter 1.<P>The objections against <a onClick="return mV(\'Zep\',2,\'4-15\');">Zephaniah 2:4-15</a> as a whole are equally inconclusive. For <a onClick="return mV(\'Zep\',2,\'13-15\');">2:13-15</A>, a date preceding the fall of Nineveh seems most suitable. The threat against Philistia (<a onClick="return mV(\'Zep\',2,\'4-7\');">2:4-7</A>) also is quite intelligible in the days of Zephaniah, for the Scythians passed right through the Philistine territory. If Ethiopia stands for Egypt, 2:12 can easily be accounted for as coming from Zephaniah, for the enemies who were going along the Mediterranean coast must inevitably reach Egypt. But if it is insisted upon that the reference is to Ethiopia proper, again no difficulty exists, for in speaking of a world judgment Zephaniah might mention Ethiopia as the representative of the far south. Against <a onClick="return mV(\'Zep\',2,\'8-11\');">2:8-11</a> the following objections are raised:<P>(a) Moab and Ammon were far removed from the route taken by the Scythians.<P>(b) The "reproaches" of <a onClick="return mV(\'Zep\',2,8-10);">2:8,10</a> presuppose the destruction of Jerusalem (<a onClick="return mV(\'Eze\',25,3,6,8);">Eze 25:3,6,8</a>).<P>(c) The attitude of the prophet toward Judah (<a onClick="return mV(\'Zec\',2,9,10);">Zech 2:9,10</a>) is the exact opposite of that expressed in <a onClick="return mV(\'Zep\',1,\'1-\');">Zephaniah 1</a>.<P>(d) The qinah meter, which predominates in the rest of the section, is absent from <a onClick="return mV(\'Zep\',2,\'8-11\');">2:8-11</A>.<P>(e) <a onClick="return mV(\'Zep\',2,12);">Ze 2:12</a> is the natural continuation of <a onClick="return mV(\'Zep\',2,9);">2:9</a>.<P>These five arguments are by no means conclusive:<P>(a) The prophet is announcing a world judgment. Could this be executed by the Scythians if they confined themselves to the territory along the Mediterranean Sea?<P>(b) Is it true that the "reproaches" of <a onClick="return mV(\'Zep\',2,8,10);">2:8,10</A> presuppose the destruction of Jerusalem?<P>(c) The promises in <a onClick="return mV(\'Zep\',2,\'7-10\');">2:7,8-10</a> are only to a remnant, which presupposes a judgment such as is announced in chapter <a onClick="return mV(\'Zep\',1,\'1-\');">1</a>.<P>(d) Have we a right to demand consistency in the use of a certain meter in oratory, and, if so, may not the apparent inconsistency be due to corruption of the text, or to a later expansion of an authentic oracle?<P>(e) <a onClick="return mV(\'Zep\',2,\'8-11\');">Ze 2:8-11</a> can be said to interrupt the thought only if it is assumed that the prophet meant to enumerate the nations in the order in which the Scythians naturally would reach their territory.<P>From Philistia they would naturally pass to Egypt. But is this assumption warranted? While the objections against the entire paragraph are inconclusive, it cannot be denied that <a onClick="return mV(\'Zep\',2,12);">2:12</a> seems the natural continuation of <a onClick="return mV(\'Zep\',2,9);">2:9</a>, and since <a onClick="return mV(\'Zep\',2,10);">2:10</a> and <a onClick="return mV(\'Zep\',2,11);">11</a> differ in other respects from those preceding, suspicion of the originality of these two verses cannot be suppressed.<P><a onClick="return mV(\'Zep\',3,\'1-8\');">Ze 3:1-8</a> is so similar to chapter <a onClick="return mV(\'Zep\',1,\'1-\');">1</A> that its originality cannot be seriously questioned, but <a onClick="return mV(\'Zep\',3,\'1-8\');">3:1-8</A> carry with them <a onClick="return mV(\'Zep\',3,\'9-13\');">3:9-13</a>, which describe the purifying effects of the judgment announced in <a onClick="return mV(\'Zep\',3,\'1-8\');">3:1-8</A>. The present text of <a onClick="return mV(\'Zep\',3,10);">3:10</A> may be corrupt, but if properly emended there remains insufficient reason for questioning <a onClick="return mV(\'Zep\',3,10);">3:10 and <a onClick="return mV(\'Zep\',3,10);">11</A>. The authenticity of <a onClick="return mV(\'Zep\',3,\'14-20\');">3:14-20</a> is more doubtful than that of any other section of Zephaniah. The buoyant tone of the passage forms a marked contrast to the somber, quiet strain of <a onClick="return mV(\'Zep\',3,\'11-13\');">3:11-13</a>; the judgments upon Judah appear to be in the past; <a onClick="return mV(\'Zep\',3,\'18-20\');">3:18-20</A> seem to presuppose a scattering of the people of Judah, while the purifying judgment of <a onClick="return mV(\'Zep\',3,\'11-13\');">3:11-13</A> falls upon the people in their own land; hence, there is much justice in Davidson\'s remark that "the historical situation presupposed is that of <a onClick="return mV(\'Isa\',40,\'1-\');">Isa 40</a>ff." On the other hand, it must be borne in mind that the passage is highly poetic, that it presents an ideal picture of the future, in the drawing of which imagination must have played some part, and it may be difficult to assert that the composition of this poem was entirely beyond the power of Zephaniah\'s enlightened imagination. But while the bare possibility of Zephaniah\'s authorship may be admitted, it is not impossible that <a onClick="return mV(\'Zep\',3,\'14-20\');">3:14-20</a> contains a "new song from God," added to the utterances of Zephaniah at a period subsequent to the fall of Jerusalem.<P>IV. Teaching.<P>The teaching of Zephaniah closely resembles that of the earlier prophetic books. Yahweh is the God of the universe, a God of righteousness and holiness, who expects of His worshippers a life in accord with His will. Israel are His chosen people, but on account of rebellion they must suffer severe punishment. Wholesale conversion seems out of the question, but a remnant may escape, to be exalted among the nations. He adds little, but attempts with much moral and spiritual fervor to impress upon his comtemporaries the fundamental truths of the religion of Yahweh. Only a few points deserve special mention.<P>1. The Day of Yahweh:<P>Earlier prophets had spoken of the day of Yahweh; Amos (<a onClick="return mV(\'Amo\',5,18,19,20);">5:18-20</a>) had described it in language similar to that employed by Zephaniah; but the latter surpasses all his predecessors in the emphasis he places upon this terrible manifestation of Yahweh (see <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+OLD+TESTAMENT">ESCHATOLOGY OF THE OLD TESTAMENT</a>). His entire teaching centers around this day; and in the Book of Zephaniah we find the germs of the apocalyptic visions which become so common in later prophecies of an eschatological character. Concerning this day he says<P>(a) that it is a day of terror (<a onClick="return mV(\'Zep\',1,15);">1:15</A>),<P>(b) it is imminent (<a onClick="return mV(\'Zep\',1,14);">1:14</A>),<P>(c) it is a judgment for sin (<a onClick="return mV(\'Zep\',1,17);">1:17</A>),<P>(d) it falls upon all creation (<a onClick="return mV(\'Zep\',1,2,3);">1:2,3</A>; <a onClick="return mV(\'Zep\',2,\'4-15\');">2:4-15</A>; <a onClick="return mV(\'Zep\',3,8);">3:8</A>),<P>(e) it is accompanied by great convulsions in Nature (<a onClick="return mV(\'Zep\',1,15);">1:15</A>),<P>(f) a remnant of redeemed Hebrews and foreigners will escape from its terrors (<a onClick="return mV(\'Zep\',2,3);">Ze 2:3</a>; <a onClick="return mV(\'Zep\',3,\'9-13\');">3:9-13</a>).<P>2. Universalism:<P>The vision of the book is world-wide. The terrors of the day of Yahweh will fall upon all. In the same manner from all nations converts will be won to Yahweh (<a onClick="return mV(\'Zep\',3,9,10);">Ze 3:9,10</a>). These will not be compelled to come to Jerusalem to worship Yahweh (<a onClick="return mV(\'Isa\',2,2);">Isa 2:2</a>; <a onClick="return mV(\'Mic\',4,1);">Mic 4:1</a>); they may worship Him "every one from his place" (<a onClick="return mV(\'Zep\',2,11);">Ze 2:11</a>), which is a step in the direction of the utterance of Jesus in <a onClick="return mV(\'Jhn\',4,21);">Joh 4:21</a>.<P>3. Messianic Prophecy:<P>The Messianic King is not mentioned by Zephaniah. Though he draws a sublime picture of the glories of the Messianic age (<a onClick="return mV(\'Zep\',3,\'14-20\');">Ze 3:14-20</a>), there is not a word concerning the person of the Messianic King. Whatever is done is accomplished by Yahweh Himself.<P>LITERATURE.<P>Cornms. on the Minor Prophets by Ewald, Pusey, Keil, Orelli, G. A. Smith (Expositor\'s Bible); Driver (New Century); Eiselen; A. B. Davidson, Commentary on Nahum, Habakkuk, and Zephaniah (Cambridge Bible); A. F. Kirkpatrick, Doctrine of the Prophets; Eiselen, Prophecy and the Prophets; F. W. Farrar, "Minor Prophets," Men of the Bible; S. R. Driver, Driver, Introduction to the Literature of the Old Testament; Hastings, Dictionary of the Bible (five volumes), article "Zephaniah, Book of"; Encyclopedia Biblica, article "Zephaniah."``50';
isbe[9373]='Zephath`ze\'-fath.`<a href="./study/isbe/search.html?string=HORMAH">HORMAH</a>`1';
isbe[9374]='Zephathah, Valley of`zef\'-a-tha (ge\'tsephathah; Septuagint kata borran, reading tsephoah, instead of tsephathah): This is the place where Asa met and defeated the Ethiopians under Zerah (<a onClick="return mV(\'2Ch\',14,10);">2Ch 14:10</a>). It is said to be at Mareshah. No name resembling this has been recovered there. Possibly, therefore, the Septuagint rendering is right, "in the ravine to the north of Mareshah." In that case the battle may have been fought in Wady el-\'Afranj.``1';
isbe[9375]='Zephi; Zepho`ze\'-fi, ze\'-fo (tsephi, perhaps "gaze," or "gazing," in <a onClick="return mV(\'1Ch\',1,36);">1Ch 1:36</a>; tspho, the same meaning in <a onClick="return mV(\'Gen\',36,11,115);">Ge 36:11,15</a>): A duke of Edom. Septuagint has Sophar, which Skinner (Genesis, 431) says may be the original of Job\'s kind friend. In <a onClick="return mV(\'Gen\',36,43);">Ge 36:43</a> the Septuagint has Zaphoei (= tsepho, i.e. Zepho), for Iram. Skinner holds it probable that the two names, Zepho and Iram, were in the original text, thus making the <span class="noTag">number 12</span> (compare Lagarde, Septuagint-Stud., II,10,1. 178; 37, 1. 270; Nestle, Margin., 12). Lucian has Sophar, in <a onClick="return mV(\'Gen\',36,11,15);">Ge 36:11,15</a>; Sepphoue, in <a onClick="return mV(\'1Ch\',1,37);">1Ch 1:37</a>, and Saphoin, in <a onClick="return mV(\'Gen\',36,43);">Ge 36:43</a>.``149';
isbe[9376]='Zephon`ze\'-fon.`<a href="./study/isbe/search.html?string=ZIPHION">ZIPHION</a>`1';
isbe[9377]='Zephonites`ze\'-fon-its, ze-fo\'-nits (ha-tsphoni; ho Saphoni, Codex Alexandrinus omits): A family of Gadites descended from Zephon (<a onClick="return mV(\'Num\',26,15);">Nu 26:15</a>), who is called "Ziphion" in <a onClick="return mV(\'Gen\',46,16);">Ge 46:16</a>.``1';
isbe[9378]='Zer`zer, zer (tser; in Septuagint the verse (<a onClick="return mV(\'Jos\',19,35);">Jos 19:35</a>) reads kai hai poleis teichereis ton Turion, which implies a Hebrew text with ha-tsurim, "Tyrians"; this must be an error): One of the fortified cities in Naphtali, named between Ziddim (Chattin) and Hammath (el-Chammeh, south of Tiberias). If the text is correct, it must have lain on the slopes west of the Sea of Galilee. It is not identified.``1';
isbe[9379]='Zerah`ze\'-ra (zerach, meaning uncertain):<P>(1) In <a onClick="return mV(\'Gen\',38,30);">Ge 38:30</a>; <a onClick="return mV(\'Gen\',46,12);">46:12</a>; <a onClick="return mV(\'Num\',26,20);">Nu 26:20</a>; <a onClick="return mV(\'Jos\',7,1,18,24);">Jos 7:1,18,24</a>; <a onClick="return mV(\'Jos\',22,20);">22:20</a>; <a onClick="return mV(\'1Ch\',2,4,6);">1Ch 2:4,6</a>; <a onClick="return mV(\'1Ch\',9,6);">9:6</a>; <a onClick="return mV(\'Neh\',11,24);">Ne 11:24</a>; <a onClick="return mV(\'Mat\',1,3);">Mt 1:3</a>, younger twin-son of Judah and Tamar, and an ancestor of Achan. In <a onClick="return mV(\'Num\',26,20);">Nu 26:20</a>; <a onClick="return mV(\'Jos\',7,17);">Jos 7:17</a>f he is the head of the Zerahites (also <a onClick="return mV(\'1Ch\',27,11,13);">1Ch 27:11,13</a>). the King James Version has "Zarah" in <a onClick="return mV(\'Gen\',38,30);">Ge 38:30</a>; <a onClick="return mV(\'Gen\',46,12);">46:12</a>, and "Zarhites" for "Zerahites" in Numbers, Joshua and 1 Chronicles. See Curtis (Chronicles, 84f) for identification of Ezrahite with Zerahite.<P>(2) Edomites:<P>(a) an Edomite chief (<a onClick="return mV(\'Gen\',36,13,17);">Ge 36:13,17</a>; <a onClick="return mV(\'1Ch\',1,37);">1Ch 1:37</a>);<P>(b) father of an Edomite king (<a onClick="return mV(\'Gen\',36,33);">Ge 36:33</a>; <a onClick="return mV(\'1Ch\',1,44);">1Ch 1:44</a>).<P>(3) Levites:<P>(a) <a onClick="return mV(\'1Ch\',6,21);">1Ch 6:21 (Hebrew verse 6)</a>;<P>(b) <a onClick="return mV(\'1Ch\',6,41);">1Ch 6:41 (Hebrew verse 26)</a>.<P>(4) Head of the Zerahites (<a onClick="return mV(\'Num\',26,13);">Nu 26:13</a>, the King James Version "Zarhites"; <a onClick="return mV(\'1Ch\',4,24);">1Ch 4:24</a>). In <a onClick="return mV(\'Num\',26,13);">Nu 26:13</a> = "Zohar" of <a onClick="return mV(\'Gen\',46,10);">Ge 46:10</a>; <a onClick="return mV(\'Exd\',6,15);">Ex 6:15</a>.<P>See <a href="./study/isbe/search.html?string=ZOHAR">ZOHAR</a>, (2).<P>(5) Cushite king (<a onClick="return mV(\'2Ch\',14,9);">2Ch 14:9</a>). See the next article.``149';
isbe[9380]='Zerah (the Ethiopian)`(zerach ha-kushi (<a onClick="return mV(\'2Ch\',14,9);">2Ch 14:9</a>); Zare): A generation ago the entire story of Zerah\'s conquest of Asa, coming as it did from a late source (<a onClick="return mV(\'2Ch\',14,\'9-15\');">2Ch 14:9-15</a>), was regarded as "apocryphal": "If the incredibilities are deducted nothing at all is left" (Wellhausen, Prolegomena to the History of Israel,207,208); but most modern scholars, while accepting certain textual mistakes and making allowance for customary oriental hyperbole in description; accept this as an honest historical narrative, "nothing" in the Egyptian inscriptions being "inconsistent" with it (Nicol in BD; and compare Sayce, HCM, 362-64). The name "Zerah" is a "very likely corruption" of "Usarkon" (U-Serak-on), which it closely resembles (see Petrie, Egypt and Israel, 74), and most writers now identify Zerah with Usarkon II, though the Egyptian records of this particular era are deficient and some competent scholars still hold to Usarkon I (Wiedemann, Petrie, McCurdy, etc.). The publication by Naville (1891) of an inscription in which Usarkon II claims to have invaded "Lower and Upper Palestine" seemed to favor this Pharaoh as the victor over Asa; but the chronological question is difficult (Eighth Memoir of the Egyptian Exploration Fund, 51). The title "the Cushite" (Hebrew) is hard to understand. There are several explanations possible.<P>(1) Wiedemann holds that this may refer to a real Ethiopian prince, who, though unrecorded in the monuments, may have been reigning at the Asa era. There is so little known from this era "that it is not beyond the bounds of probability for an Ethiopian invader to have made himself master of the Nile Valley for a time" (Geschichte von Alt-Aegypten, 155).<P>(2) Recently it has been the fashion to refer this term "Cushite" to some unknown ruler in Southern or Northern Arabia (Winckler, Cheyne, etc.). The term "Cushite" permits this, for although it ordinarily corresponds to <a href="./study/isbe/search.html?string=ETHIOPIA">ETHIOPIA</a> (which see), yet sometimes it designates the tract of Arabia which must be passed over in order to reach Ethiopia (Jeremias, The Old Testament in the Light of Ancient East, I, 280) or perhaps a much larger district (see BD; EB; Hommel, Ancient Hebrew Tradition; Winckler, KAT, etc.). This view, however, is forced to explain the geographical and racial terms in the narrative differently from the ordinary Biblical usage (see Cheyne, EB). Dr. W. M. Flinders Petrie points out that, according to the natural sense of the narrative, this army must have been Egyptian for<P>(a) after the defeat it fled toward Egypt, not eastward toward Arabia;<P>(b) the cities around Gerar (probably Egyptian towns on the frontier of Palestine), toward which they naturally fled when defeated, were plundered;<P>(c) the invaders were Cushim and Lubim (Libyans), and this could only be the case in an Egyptian army; (d) Mareshah is a well-known town close to the Egyptian frontier (History of Egypt, III, 242-43; compare Konig, Funf neue arab. Landschaftsnamen im Altes Testament, 53-57).<P>(3) One of the Usarkons might be called a "Cushite" in an anticipatory sense, since in the next dynasty (XXIII) Egypt was ruled by Ethiopian kings.``26';
