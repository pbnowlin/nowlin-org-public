<script type="text/javascript">
isbe = [];

isbe[9301]='Zaketan`zar\'-e-tan (tsarethan): the King James Version <a onClick="return mV(\'Jos\',3,16);">Jos 3:16</a> for <a href="./study/isbe/search.html?string=ZARETHAN">ZARETHAN</A> (which see).``1';
isbe[9302]='Zalaph`za\'-laf (tsalaph, "caper-plant"): Father of Hanun, one of the repairers of the wall (<a onClick="return mV(\'Neh\',3,30);">Ne 3:30</a>).``1';
isbe[9303]='Zalmon`zal\'-mon (tsalmon; Selmon, oros Ermon; the King James Version Salmon (<a onClick="return mV(\'Psa\',68,14);">Ps 68:14</a>)):<P>(1) From the slopes of Mt. Zalmon, Abimelech and his followers gathered the wood with which they burned down "the stronghold of the house of El-berith," which may have been the citadel of Shechem (<a onClick="return mV(\'Jdg\',9,46);">Jud 9:46</a>). The mountain therefore was not far from the city; but no name resembling this has yet been recovered in Mt. Ephraim. It is just possible that in the modern Arabic name of Mt. Ebal, es-Sulemiyeh, there may be an echo of Zalmon. It is precisely to this mountain, especially to the western slopes, that one would expect Abimelech and his people to go for the purpose in view. The name occurs again in <a onClick="return mV(\'Psa\',68,14);">Ps 68:14</a>, a passage of admitted difficulty. Snow in Palestine is mainly associated with Mt. Hermon, where it may be seen nearly all the year round; hence, doubtless the Greek reading "Mt. Hermon" in Judges. But snow is well known among the uplands in winter; and the Psalmist may simply have meant that the kings were scattered like snowflakes in the wind on Mt. Zalmon. We need not therefore look to Bashan or elsewhere for the mountain. The locality is fixed by the narrative in Jgs.<P>(2) One of David\'s heroes (<a onClick="return mV(\'2Sa\',23,28);">2Sa 23:28</a>).`<a href="./study/isbe/search.html?string=ILAI">ILAI</a>`54';
isbe[9304]='Zalmonah`zal-mo\'na (tsalmonah, "gloomy"): A desert camp of the Israelites, the first after Mt. Hor (<a onClick="return mV(\'Num\',33,41,42);">Nu 33:41,42</a>). The name "suggests some gloomy valley leading up to the Edomite plateau."`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[9305]='Zalmunnah`zal-mun\'-a.`<a href="./study/isbe/search.html?string=ZEBAH+AND+ZALMUNNA">ZEBAH AND ZALMUNNA</a>`1';
isbe[9306]='Zambis`zam\'-bis: the King James Version = the Revised Version (British and American) <a href="./study/isbe/search.html?string=ZAMBRI">ZAMBRI</a> (which see).``1';
isbe[9307]='Zambri`zam\'-bri (Codex Vaticanus Zambrei, Codex Alexandrinus Zambris; the King James Version Zambis, from Aldine Zambis): <P>(1) One of the sons of Ezora who put away their foreign wives (1Esdras 9:34) = "Amariah" of <a onClick="return mV(\'Ezr\',10,42);">Ezr 10:42</a>.<P>(2) The King James Version = the Revised Version (British and American) "Zimri" of 1Macc 2:26.``1';
isbe[9308]='Zamoth`za\'-moth, za\'-moth (Zamoth): The head of a family, some members of which married. foreign wives (1Esdras 9:28) = "Zattu" of <a onClick="return mV(\'Ezr\',10,27);">Ezr 10:27</a>; called "Zathui" in 1Esdras 5:12 and "Zathoes" (the King James Version "Zathoe") in 1Esdras 8:32.``1';
isbe[9309]='Zamzummim`zam-zum\'-im (zam-zummim): A race of giants who inhabited the region east of the Jordan afterward occupied by the Ammonites who displaced them. They are identified with the Rephaim (<a onClick="return mV(\'Deu\',2,20);">De 2:20</a>). They may be the same as the Zuzim mentioned in connection with the Rephaim in <a onClick="return mV(\'Gen\',14,5);">Ge 14:5</a>.`<a href="./study/isbe/search.html?string=REPHAIM">REPHAIM</a>`1';
isbe[9310]='Zanoah`za-no\'-a (zanoach; Codex Vaticanus Tano; Codex Alexandrinus Zano):<P>(1) A town in the Judean Shephelah, grouped with Eshtaol, Zorah and Ashnah (<a onClick="return mV(\'Jos\',15,34);">Jos 15:34</a>). The Jews reoccupied the place after the exile (<a onClick="return mV(\'Neh\',11,30);">Ne 11:30</a>). Here it is named between Jarmuth and Adullam. The inhabitants assisted in rebuilding the walls of Jerusalem, repairing the valley gate (<a onClick="return mV(\'Neh\',3,13);">Ne 3:13</a>). Eusebius (in Onomasticon) places it at Zanna, in the district of Eleutheropolis on the Jerusalem road. It is represented by the modern Zanu\'a, about 10 miles north of Belt Jibrin (Eleutheropolis).<P>(2) (Codex Vaticanus Zakanaeim; Codex Alexandrinus Zano): A place in the mountains (<a onClick="return mV(\'Jos\',15,56);">Jos 15:56</a>) of which Jekuthiel was the "father" or founder (<a onClick="return mV(\'1Ch\',4,18);">1Ch 4:18</a>). It may be identified with Zenuta, a ruined site on a hill about 12 miles south of Hebron.``54';
isbe[9311]='Zaphenath-Paneah, Zaphnath-Paaneah`zaf-e\'-nath-pa-ne\'-a, zaf\'-nath-pa-a-ne\'a (tsaphenath pa\'aneach; Egyptian Zoph-ent-pa-ankh; Septuagint D, Psonthomphantch, "the one who furnishes the nourishment of life," i.e. the chief steward of the realm): The name given Joseph by the Egyptian king by whom he was promoted, probably the Hyksos king Aphophis (<a onClick="return mV(\'Gen\',41,45);">Ge 41:45</a>).`<a href="./study/isbe/search.html?string=JOSEPH">JOSEPH</a>`1';
isbe[9312]='Zaphon`za\'-fon (tsaphon; Codex Vaticanus Saphan; Codex Alexandrinus Saphon): A city on the east of the Jordan in the territory of Gad (<a onClick="return mV(\'Jos\',13,27);">Jos 13:27</a>). It is named again in <a onClick="return mV(\'Jdg\',12,1);">Jud 12:1</a> as the place where the elders of Gilead gathered to meet with Jephthah (tsaphonah should be translated "to Zaphon," not "northward"). It must have lain well to the north of Gad. According to the Talmud Amathus represented Zaphon (Neubauer, Geog. du Talmud, 249). Here sat one of the Synedria created by Gabinius (Ant., XIV, v, 4). It was a position of great strength (B J, I, iv, 2). Eusebius, Onomasticon places it 21 Roman miles S. of Pella. This is the modern Tell \'Amateh, on the south bank of Wady er-Rujeib, 15 miles south of Pella, and nearly 5 miles north of the Jabbok. Buhl (GAP, 259) objects to the identification that Tell \'Amateh corresponds to the Asophon of Josephus (Ant., XIII, xii, 5). But this objection does not seem well founded.``54';
isbe[9313]='Zara`za\'-ra (Zara): the King James Version (<a onClick="return mV(\'Mat\',1,3);">Mt 1:3</a>) = Greek form of <a href="./study/isbe/search.html?string=ZERAH">ZERAH</a> (which see).``1';
isbe[9314]='Zaraces`zar\'-a-sez: the King James Version = the Revised Version (British and American) <a href="./study/isbe/search.html?string=ZARAKES">ZARAKES</A> (which see).``1';
isbe[9315]='Zarah`za\'-ra.`<a href="./study/isbe/search.html?string=ZERAH">ZERAH</a>`1';
isbe[9316]='Zaraias`za-ra\'-yas, za-ri\'-as (Zaraias):<P>(1) One of the leaders in the Return along with Zerubbabel (1Esdras 5:8) = "Seraiah" of <a onClick="return mV(\'Ezr\',2,2);">Ezr 2:2</a> and "Azariah" of <a onClick="return mV(\'Neh\',7,7);">Ne 7:7</a> = the King James Version <a href="./study/isbe/search.html?string=ZACHARIAS">ZACHARIAS</a> (which see).<P>(2) An ancestor of Ezra in 1Esdras 8:2 (omitted in Codex Vaticanus and Swete) = "Zerahiah" of <a onClick="return mV(\'Ezr\',7,4);">Ezr 7:4</a> and apparently= "Arna" of 2Esdras 1:2.<P>(3) The father of Eliaonias, the leader of the sons of Phaath Moab under Ezra (1Esdras 8:31)= "Zerahiah" of <a onClick="return mV(\'Ezr\',8,4);">Ezr 8:4</a>.<P>(4) One of "the sons of Saphatias" who went up with Ezra (1Esdras 8:34) = "Zebadiah" of <a onClick="return mV(\'Ezr\',8,8);">Ezr 8:8</a>.``1';
isbe[9317]='Zarakes`zar\'-a-kez (Codex Alexandrinus and Fritzsche, Zarakes; Codex Vaticanus and Swete, Zarios; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Zaracelem; the King James Version Zaraces): Occurs in the difficult passage, 1Esdras 1:38, as the equivalent of Jehoahaz (<a onClick="return mV(\'2Ki\',23,34);">2Ki 23:34</a>) and Joahaz (<a onClick="return mV(\'2Ch\',36,4);">2Ch 36:4</a>), the brother of Eliakim (Jehoiakim or <a href="./study/isbe/search.html?string=JOAKIM">JOAKIM</a> (which see)). According to 1Esdras 1:38, Joakim apparently apprehended his brother, Zarakes, and brought him up out of Egypt, whither he must have been previously taken by Necoh, whereas 2 Kings and 2 Chronicles only state that Necoh took Joahaz (Zarakes) to Egypt.``1';
isbe[9318]='Zardeus`zar-de\'-us (Codex Alexandrinus Zardaias; Codex Vaticanus Swete and Fritzsche, Zeralias; the King James Version Sardeus): One of the sons of Zamoth who had married "strange wives" (1Esdras 9:28) = "Aziza" of <a onClick="return mV(\'Ezr\',10,27);">Ezr 10:27</a>.``1';
isbe[9319]='Zareah`za\'-re-a, za-re\'-a (tsor\'ah): the King James Version in <a onClick="return mV(\'Neh\',11,29);">Ne 11:29</a> for <a href="./study/isbe/search.html?string=ZORAH">ZORAH</a> (which see).``1';
isbe[9320]='Zareathites`za-re\'a-thits.`<a href="./study/isbe/search.html?string=ZORATHITES">ZORATHITES</a>`1';
isbe[9321]='Zared`za\'-red (zaredh (in pause)).`<a href="./study/isbe/search.html?string=ZERED">ZERED</a>`1';
isbe[9322]='Zarephath`zar\'-e-fath (tsarephath; Sarepta): The Sidonian town in which Elijah was entertained by a widow after he left the brook Cherith (<a onClick="return mV(\'1Ki\',17,9);">1Ki 17:9</a>). Obadiah refers to it as a Canaanite (probably meaning Phoenicia) town (<a onClick="return mV(\'Oba\',1,20);">Ob 1:20</a>). It appears in the Greek form Sarepta in <a onClick="return mV(\'Luk\',4,26);">Lu 4:26</a> (the King James Version), and is said to be in the land of Sidon. Josephus (Ant., VIII, xiii, 2) says it was not "far from Sidon and Tyre, for it lay between them." Eusebius, Onomasticon (s.v. "Sarefta"), places it on the public road, i.e. the road along the seashore. It can be no other than the modern Sarafend, about 13 miles north of Tyre, on the spur of the mountain which divides the plain of Tyre from that of Sidon.<P>The site of the ancient town is marked by the ruins on the shore to the south of the modern village, about 8 miles to the south of Sidon, which extend along the shore for a mile or more. They are in two distinct groups, one on a headland to the west of a fountain called Ain el-Qantara, which is not far from the shore. Here was the ancient harbor which still affords shelter for small craft. The other group of ruins is to the south, and consists of columns, sarcophagi and marble slabs, indicating a city of considerable importance. The modern village of Sarafend was built some time after the 12th century, since at the time of the Crusades the town was still on the shore.<P>It is conjectured that the Syrophoenician woman mentioned in <a onClick="return mV(\'Luk\',4,26);">Lu 4:26</a> was an inhabitant of Zarephath., and it is possible that our Lord visited the place in His journey to the region as narrated in <a onClick="return mV(\'Mar\',7,\'24-31\');">Mr 7:24-31</a>, for it is said that he "came through Sidon unto the sea of Galilee."<P>The place has been identified by some with Misrephoth-maim of <a onClick="return mV(\'Jos\',11,8);">Jos 11:8</a> and <a onClick="return mV(\'Jos\',13,6);">13:6</a>, but the latter passage would indicate that Misrephoth-maim was at the limit of the territory of the Sidonians, which Zarephath was not in the days of Joshua.<P>See <a href="./study/isbe/search.html?string=MISREPHOTH-MAIM">MISREPHOTH-MAIM</A>; <a href="./study/isbe/search.html?string=SIDON">SIDON</a>.<P>Originally Sidonian, the town passed to the Tyrians after the invasian of Shalmaneser IV, 722 BC. It fell to Sennacherib 701 BC. The Wely, or shrine bearing the name of el-Khudr, the saint in whom George is blended with Elijah, stands near the shore. Probably here the Crusaders erected a chapel on what they believed to be the site of the widow\'s house.``54';
isbe[9323]='Zarethan`zar\'-e-than (tsarethan): A city, according to <a onClick="return mV(\'Jos\',3,16);">Jos 3:16</a> (omitted, however, by the Septuagint) near Adam, which is probably to be identified with Tell Damieh at the mouth of the Jabbok. In <a onClick="return mV(\'1Ki\',4,12);">1Ki 4:12</a> it is mentioned in connefection with Bethshean and said to be "beneath Jezreel." In <a onClick="return mV(\'1Ki\',7,46);">1Ki 7:46</a>, this is said to be at "the ford of Adamah," according to the reading of some, but according to the Massoretic text, "in the clay around between Succoth and Zarethan," where the bronze castings for the temple were made by Solomon\'s artificers. In <a onClick="return mV(\'2Ch\',4,17);">2Ch 4:17</a>, the name appears as Zeredah, which in <a onClick="return mV(\'1Ki\',11,26);">1Ki 11:26</a> is said to have been the birthplace of Jeroboam, son of Nebat. In <a onClick="return mV(\'Jdg\',7,22);">Jud 7:22</a>, Gibeon is said to have pursued the Midianites "as far as Bethshittah toward Zererah," which is probably a misreading for Zeredah, arising from the similarity of the Hebrew letters daleth and resh. The place has not been positively identical. From the suggestion that the name means "the great (or lofty) rock," it has without sufficient reason been supposed that it designates the conspicuous peak of Kurn Surtabheh which projects from the mountains of Ephraim into the valley of the Jordan opposite the mouth of the Jabbok.``198';
isbe[9324]='Zarezth-Shahar`za\'-reth-sha\'-har (tsereth ha-shachar).`<a href="./study/isbe/search.html?string=ZERETH-SHAHAR">ZERETH-SHAHAR</a>`1';
isbe[9325]='Zarhites`zar\'-hits.`<a href="./study/isbe/search.html?string=ZERAH">ZERAH</a>`1';
isbe[9326]='Zartanah`zar-ta\'-na, zar\'-ta-na (tsarethanah): the King James Version in <a onClick="return mV(\'1Ki\',4,12);">1Ki 4:12</a> for "Zarethan." The form is Zarethan with Hebrew locale.``1';
isbe[9327]='Zarthan`zar\'-than (tsarethan): the King James Version in <a onClick="return mV(\'1Ki\',7,46);">1Ki 7:46</a> for <a href="./study/isbe/search.html?string=ZARETHAN">ZARETHAN</A> (which see).``1';
isbe[9328]='Zathoes`zath\'-o-ez, za-tho\'-ez (Zathoes; the King James Version, Zathoe): Name of a family, part of which returned with Ezra (1Esdras 8:32), not found in the Hebrew of <a onClick="return mV(\'Ezr\',8,5);">Ezr 8:5</a>; probably identical with "Zattu" of <a onClick="return mV(\'Ezr\',2,8);">Ezr 2:8</a>; <a onClick="return mV(\'Neh\',7,13);">Ne 7:13</a>, many of which family went up with Zerubbabel, and so called also "Zathui" (1Esdras 5:12).`<a href="./study/isbe/search.html?string=ZATTU">ZATTU</a>`1';
isbe[9329]='Zathui`za-thu\'-i (Zaththoui, Septuagint Codex Vaticanus Zaton): In 1Esdras 5:12 = "Zattu" in <a onClick="return mV(\'Ezr\',2,8);">Ezr 2:8</a>; <a onClick="return mV(\'Neh\',10,14);">Ne 10:14</a>. In 1Esdras 9:28 the same name is "Zamoth."``1';
isbe[9330]='Zatthu`zat\'-thu: In <a onClick="return mV(\'Neh\',10,14);">Ne 10:14</a>; the Revised Version (British and American) <a href="./study/isbe/search.html?string=ZATTU">ZATTU</a> (which see).``1';
isbe[9331]='Zattu`zat\'-u (zattu\', meaning unknown): Head of a large family that returned with Zerubbabel to Jerusalem from Babylon (<a onClick="return mV(\'Ezr\',2,8);">Ezr 2:8</a>; <a onClick="return mV(\'Ezr\',10,27);">10:27</a>; <a onClick="return mV(\'Neh\',7,13);">Ne 7:13</a>; <a onClick="return mV(\'Neh\',10,14);">10:14 (15)</a>). According to <a onClick="return mV(\'Ezr\',10,27);">Ezr 10:27</a>, some of his sons had married foreign wives, and Zattu is named in <a onClick="return mV(\'Neh\',10,14);">Ne 10:14</a> as one of the chiefs who signed Nehemiah\'s covenant. Septuagint A also adds the name before that of Shecaniah in <a onClick="return mV(\'Ezr\',8,5);">Ezr 8:5</a>, and so we should read, "And of the sons of Zattu, Shecaniah..."; <span class="noTag">so</span> 1Esdras 8:32 has Zathoes. the King James Version has "Zatthu" in Neb 10:14.``1';
isbe[9332]='Zavan`za\'-van.`<a href="./study/isbe/search.html?string=ZAAVAN">ZAAVAN</a>`1';
isbe[9333]='Zayin`za\'-yin "z": The 7th letter of the Hebrew alphabet; transliterated in this Encyclopedia as "z". It came also to be used for the <span class="noTag">number 7</span>.`<a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>`1';
isbe[9334]='Zaza`za\'-za (zaza\', meaning unknown; the Septuagint\'s Codex Vaticanus Ozam; Codex Alexandrinus Ozaza): A Jerahmeelite (<a onClick="return mV(\'1Ch\',2,33);">1Ch 2:33</a>).``1';
isbe[9335]='Zealot; Zealots`zel\'-ut, zel\'-uts: Simon, one of the apostles, was called "the Zealot" Zelotes from zeloo "to rival," "emulate," "be jealous," "admire," "desire greatly," <a onClick="return mV(\'Luk\',6,15);">Lu 6:15</a>; <a onClick="return mV(\'Act\',1,13);">Ac 1:13</a>, the King James Version "Zelotes"). In <a onClick="return mV(\'Mat\',10,4);">Mt 10:4</a> and <a onClick="return mV(\'Mar\',3,18);">Mr 3:18</a> he is called "the Cananean" (so the Revised Version (British and American) correctly; not "the Canaanite," as the King James Version says, following inferior manuscripts), ho Kananaios. From the time of the Maccabees there existed among the Jews a party who professed great zeal for the observance of the "law." According to Josephus (BJ, IV, iii, 9; v, 1; VII, viii, 1) they resorted to violence and assassination in their hatred of the foreigner, being at many points similar to the Chinese Boxers. It is not improbable that the "Assassins" (see <a href="./study/isbe/search.html?string=ASSASSINS">ASSASSINS</a>) of <a onClick="return mV(\'Act\',21,38);">Ac 21:38</a> were identical, or at least closely associated, with this body of "Zealots," to which we must conclude that Simon had belonged before he became one of the Twelve.`<a href="./study/isbe/search.html?string=SIMON+THE+ZEALOT">SIMON THE ZEALOT</a>`75';
isbe[9336]='Zebadiah`zeb-a-di\'-a<P>(1) zebhadhyaha,<P>(2) zebhadhyah, "Yah has bestowed";<P>the form (1) is the Hebrew name in (1), (a), (b), (2), below; the form (2) in the rest. Some manuscripts have Zechariah in (1), (a), (b), (3)).<P>Compare <a href="./study/isbe/search.html?string=ZABDI">ZABDI</a>; <a href="./study/isbe/search.html?string=ZABDIEL">ZABDIEL</A>:<P>(1) Levites:<P>(a) a Korahite doorkeeper of David\'s reign (<a onClick="return mV(\'1Ch\',26,2);">1Ch 26:2</a>);<P>(b) one of the Levites sent by King Jehoshaphat to teach the Torah in Judah (<a onClick="return mV(\'2Ch\',17,8);">2Ch 17:8</a>).<P>(2) Son of Ishmael (<a onClick="return mV(\'2Ch\',19,11);">2Ch 19:11</a>); "ruler of the house of Judah in all the king\'s (Jehoshaphat\'s) matters," i.e. judge in civil cases, the "controversies" of <a onClick="return mV(\'2Ch\',19,8);">2Ch 19:8</a>.<P>(3) Benjamites, perhaps descended from Ehud (see Curtis, Chron., 158ff):<P>(a) In <a onClick="return mV(\'1Ch\',8,15);">1Ch 8:15</a>;<P>(b) in <a onClick="return mV(\'1Ch\',8,17);">8:17</A>, where the name may be a dittography from <a onClick="return mV(\'1Ch\',8,15);">8:15</A>.<P>(4) A Benjamite recruit of David at Ziklag (<a onClick="return mV(\'1Ch\',12,7);">1Ch 12:7 (Hebrew verse 8)</a>).<P>(5) One of David\'s army officers, son and successor of Asahel (<a onClick="return mV(\'1Ch\',27,7);">1Ch 27:7</a>).<P>(6) One of those who returned from Babylon to Jerusalem with Ezra (<a onClick="return mV(\'Ezr\',8,8);">Ezr 8:8</a>) = "Zaraias" of 1Esdras 8:34.<P>(7) One of those who had married foreign wives (<a onClick="return mV(\'Ezr\',10,20);">Ezr 10:20</a>) = "Zabdeus" of 1Esdras 9:21.``149';
isbe[9337]='Zebah And Zalmunna`ze\'-ba (zebhach, "victim"), zal-mun\'-a (tsalmunna\', "protection refused"): Two Midianite kings or chiefs whom Gideon slew (<a onClick="return mV(\'Jdg\',8,\'4-21\');">Jud 8:4-21</a>; <a onClick="return mV(\'Psa\',83,11);">Ps 83:11 (Hebrew text, verse 12)</a>). The name zebhach (Zebee) is very much like that of ze\'ebh (Zeb, "Zeeb" in the Septuagint). Moore (Judgess, 220) says that tsalmunna\' is probably "a genuine Midianite name"; Noldeke conjectured that it contains that of a deity (ts(a)lm), and a compound form tslmshzbh, is found in an inscription from Teima, a place east of the Midianite capital (Corpus Inscriptionum Semiticarum, II, cxiiif).<P>The narrative of <a onClick="return mV(\'Jdg\',8,\'4-21\');">Jud 8:4-21</a> is not to be connected with that of <a onClick="return mV(\'Jdg\',8,\'1-3\');">8:1-3</a>. Budde (Kurzer Hand-Comm. z. Altes Testament, XXII) would join <a onClick="return mV(\'Jdg\',8,4);">8:4</A> to <a onClick="return mV(\'Jdg\',6,34);">6:34</a>; Moore (ICC) following Budde\'s earlier work (1890) would connect it with a part of <a onClick="return mV(\'Jdg\',7,22);">7:22b</A>, describing the direction of the flight, while Nowack (Hand-Komm.) regards the battle of <a onClick="return mV(\'Jdg\',8,11);">8:11</A> as the same as that of <a onClick="return mV(\'Jdg\',7,11);">7:11</A> if; he then takes the latter part of <a onClick="return mV(\'Jdg\',8,11);">8:11</A> to refer to the place of the camp at night. There are many difficulties in forming a natural connection for the verses. It may be noted that in <a onClick="return mV(\'Jdg\',8,18);">8:18</A>f Gideon is not "the least in my father\'s house," as he represents himself to be in <a onClick="return mV(\'Jdg\',6,15);">6:15</A>.<P>The whole section tells of a daring raid made by Gideon upon the Midianites. Some of his own kin had been slain by Midianite hordes at Ophrah (<a onClick="return mV(\'Jdg\',8,18);">Jud 8:18</a>f), and, stirred by this, Gideon went in hot pursuit with 300 men (<a onClick="return mV(\'Jdg\',8,4);">Jud 8:4</a>). He requested provisions for his men from the people of Succoth and Penuel, but was refused this. He then went on and caught the Midianites unawares at Karkor (<a onClick="return mV(\'Jdg\',8,10);">Jud 8:10</a>) and captured their two chiefs. He then had his revenge on the two towns, and returned probably to his home with the two notable prisoners. These he determined to slay to avenge the death of his own kinsmen, and called upon his eldest son to perform this solemn public duty that he owed to the dead. His son, apparently only a boy, hesitated, and he did the deed himself. W. R. Smith (Lectures on the Religion of the Semites, 2nd edition, 417, note) compares with this call to Gideon\'s son the choice of young men or lads as sacrificers in <a onClick="return mV(\'Exd\',24,5);">Ex 24:5</a>, and says that the Saracens also charged lads with the execution of their captives.<P>The narrative reminds one of David\'s romantic life in <a onClick="return mV(\'1Sa\',25,\'1-\');">1Sa 25</a>; <a onClick="return mV(\'1Sa\',27,\'1-\');">27</a>; <a onClick="return mV(\'1Sa\',30,\'1-\');">30</a>. It is throughout a characteristic picture of the life of the early Hebrews in Palestine, for whom it was a sacred duty to avenge the dead. It affords a splendid illustration of what is meant by the spirit of Yahweh coming upon, or rather "clothing itself with" (Revised Version margin) Gideon (<a onClick="return mV(\'Jdg\',6,34);">Jud 6:34</a>); compare also Saul\'s call to action (<a onClick="return mV(\'1Sa\',11,\'1-11\');">1Sa 11:1-11</a>), and also <a onClick="return mV(\'Jdg\',19,1);">Jud 19</a> f.``149';
isbe[9338]='Zebaim`ze-be\'-im.`<a href="./study/isbe/search.html?string=POCHERETH+HAZZEBAIM">POCHERETH-HAZZEBAIM</a>`1';
isbe[9339]='Zebedee`zeb\'-e-de (zibhdi, "the gift of God"; Zebedaios): The father of the apostles James and John (<a onClick="return mV(\'Mar\',1,19);">Mr 1:19</a>) and a fisherman on the Sea of Galilee (<a onClick="return mV(\'Mar\',1,20);">Mr 1:20</a>), the husband of Salome (<a onClick="return mV(\'Mat\',27,56);">Mt 27:56</a>; compare <a onClick="return mV(\'Mar\',16,1);">Mr 16:1</a>).`<a href="./study/isbe/search.html?string=JAMES">JAMES</a>; <a href="./study/isbe/search.html?string=SALOME">SALOME</a>`1';
isbe[9340]='Zebidah`ze-bi\'-da, zeb\'-i-da (zebhudhah, Qere, whence the King James Version "Zebudah," whereas the Kethibh is zebhidhah; the Qere means "bestowed" and is the feminine of Zabud): Daughter of Pedaiah of Rumah, and mother of King Jehoiakim of Judah (<a onClick="return mV(\'2Ki\',23,36);">2Ki 23:36</a>). The Septuagint\'s Codex Vaticanus has, however, Iella thugater Edeil ek Krouma, Codex Alexandrinus Eieldaph th. Eieddila ek Rhuma. In <a onClick="return mV(\'2Ch\',36,5);">2Ch 36:5</a> Massoretic Text lacks these names, but the Septuagint Codex Vaticanus has Zechora th. Nereiou ek Rhama; here the name of the king\'s mother = Hebrew zekhurah, due to a confusion of the Hebrew letter kaph (k) with the Hebrew letter beth (b), and the Hebrew letter resh (r) with the Hebrew letter daleth (d), and thus we find support for the Qere, zebhudhah ("Zebudah," in <a onClick="return mV(\'2Ki\',23,36);">2Ki 23:36</a> the King James Version). Lucian has confused the names here with those of <a onClick="return mV(\'2Ki\',24,18);">2Ki 24:18</a>, and has as there, "Amital, the daughter of Jeremiah of Libnah."``149';
isbe[9341]='Zebina`ze-bi\'-na (zebhina\', "bought"): One of those who had married foreign wives (<a onClick="return mV(\'Ezr\',10,43);">Ezr 10:43</a>); the name is not in 1Esdras 9:35, and is omitted by the Septuagint\'s Codex Alexandrinus in Ezra.``1';
isbe[9342]='Zeboiim`ze-boi\'-im (tsebhoyim; the Septuagint uniformly Sebo(e)im; the King James Version, Zeboim): One of the cities in the Vale of Siddim, destroyed with Sodom and Gomorrah. It is always mentioned next to Admah (<a onClick="return mV(\'Gen\',10,19);">Ge 10:19</a>; <a onClick="return mV(\'Gen\',14,2,8);">14:2,8</a>; <a onClick="return mV(\'Deu\',29,23);">De 29:23</a>; <a onClick="return mV(\'Hsa\',11,8);">Ho 11:8</a>). It is not to be confounded with Zeboim mentioned in <a onClick="return mV(\'1Sa\',13,18);">1Sa 13:18</a> and <a onClick="return mV(\'Neh\',11,34);">Ne 11:34</a>. The site has not been positively identified, but must be determined by the general questions connected with the Vale of Siddim.`<a href="./study/isbe/search.html?string=SIDDIM+VALE+OF">SIDDIM, VALE OF</a>`1';
isbe[9343]='Zeboim`ze-bo\'-im (1) tsebho\'im; Seboeim (<a onClick="return mV(\'Neh\',11,34);">Ne 11:34</a>); (2) ge ha-tsebho\'im; Gai ten Samein (<a onClick="return mV(\'1Sa\',13,18);">1Sa 13:18</a>)):<P>(1) A Benjamite town mentioned as between <a href="./study/isbe/search.html?string=HADID">HADID</a> (which see) and <a href="./study/isbe/search.html?string=NEBALLAT">NEBALLAT</a> (which see), and therefore in the maritime plain near Lydda; the site is lost (<a onClick="return mV(\'Neh\',11,34);">Ne 11:34</a>).<P>(2) The Valley of Zeboim, "the valley of hyenas," one of three companies of the Philistines left their camp at Michmash and "turned the way of the border that looketh down upon the valley of Zeboim toward the wilderness" (<a onClick="return mV(\'1Sa\',13,18);">1Sa 13:18</a>). There are several valleys with names derived from the hyena, so common in these parts. There is a small branch valley called Shakked dab\'a, "ravine of the hyenas," north of the Wady kelt (Grove), a, Wady abu dab\'a, "valley of the father of hyenas, which joins the Wady kelt from the south (Marti), and a large and well-known Wady dab\'a, "valley of hyenas," which runs parallel with the Wady kelt, some 3 miles farther south, and ends at the Dead Sea. The first of these, which apparently leads to Mukhmas itself, seems the most probable. See Conder\'s Handbook, 241.``117';
isbe[9344]='Zebudah`ze-bu\'-da.`<a href="./study/isbe/search.html?string=ZEBIDAH">ZEBIDAH</a>`1';
isbe[9345]='Zebul`ze\'-bul (zebhul, perhaps "exalted"; Zeboul): In <a onClick="return mV(\'Jdg\',9,26);">Jud 9:26</a>ff. He is called in <a onClick="return mV(\'Jdg\',9,30);">9:30</a> sar ha-\'ir, "the ruler of the city," a phrase translated "the governor of the city" in <a onClick="return mV(\'1Ki\',22,26);">1Ki 22:26</a> = <a onClick="return mV(\'2Ch\',18,25);">2Ch 18:25</a>; <a onClick="return mV(\'2Ki\',23,8);">2Ki 23:8</a>; <a onClick="return mV(\'2Ch\',34,8);">2Ch 34:8</a>; he was "commandant of the town" of Shechem. In <a onClick="return mV(\'Jdg\',9,28);">Jud 9:28</a> he is referred to as the paqidh, "officer," or, more correctly, "deputy" of Abimelech. This verse is a little difficult, but if we read "served" for "serve ye," it becomes fairly clear in meaning. With Moore (Judges, 255ff) we may translate it thus: "Who is Abimelech? and who is Shechem, that we should serve him (i.e. Abimelech)? Did not the son of Jerubbaal and Zebul his deputy (formerly) serve the people of Qamor (the father of Shechem)? Why then should we serve him (Abimelech)?" This is also the way Budde (Kurzer Hand-Comm. z. Altes Testament, 75) takes the verse. And further in <a onClick="return mV(\'Jdg\',9,29);">Jud 9:29</a> for "and he said" many read with the Septuagint "then would I say."<P>The position of Zebul is here that of a deputy to Abimelech, who lived in Arumah (<a onClick="return mV(\'Jdg\',9,41);">Jud 9:41</a>). When Gaal came to Shechem, a newcomer with a band of men, he seized the opportunity at a vintage feast to attack Abimelech and express a desire to lead a revolt against him (<a onClick="return mV(\'Jdg\',9,\'26-29\');">Jud 9:26-29</a>). Zebul heard these words and reported the matter to his master, vising him to make s sudden rush upon the city (<a onClick="return mV(\'Jdg\',9,\'30-33\');">Jud 9:30-33</a>). This Abimelech does, and Gaal, on noticing the troops, tells Zebul, who turns upon him and bids him make good his bragging words. Gaal is thus forced to go out and fight Abimelech, and is defeated (<a onClick="return mV(\'Jdg\',9,\'34-40\');">Jud 9:34-40</a>).<P>If this be the correct interpretation of the narrative so far, it is fairly simple and clear. Some, however, maintain that the words of Gaal about Zebul in <a onClick="return mV(\'Jdg\',9,28);">Jud 9:28</a> are meant as an insult to the governor of the city; this is the view of Wellbausch (Compos., 353f; note) and Nowack (Handkomm.; compare also his Archdologie, I, 304, 308, for the meaning of sar). Zebul is, according to them, head of the Shechemite community, and Wellhausen and Kittel (History of Hebrew, II, 85) believe him to have had something to do with the revolt of <a onClick="return mV(\'Jdg\',9,23,24,25);">9:23-25</A>. For the latter view there is no proof; possibly Zebul was the head of the community of Shechem, but as he was a subject of Abimelech, who was the king or prince of Shechem, there could not be much sting in calling him the "deputy" of his master.<P>The questions that arise from <a onClick="return mV(\'Jdg\',9,41);">Jud 9:41</a>ff need only be referred to here. Many critics have seen in <a onClick="return mV(\'Jdg\',9,\'22-45\');">9:22-45</A> more than one source. Moore groups the verses thus:<P>(1) <a onClick="return mV(\'Jdg\',9,22,23,25,42);">9:22-23,25,42</a>ff as due to the Elohist (E), with <a onClick="return mV(\'Jdg\',9,24);">9:24</A> from RJE;<P>(2) <a onClick="return mV(\'Jdg\',9,\'26-41\');">9:26-41</a> due to J. It is doubtful if the division is as clear as this.<P>There seem however to be parallels:<P>(1) The plans of Abimelech in <a onClick="return mV(\'Jdg\',9,\')34-40\';">9:34-40</A> are very similar to those in <a onClick="return mV(\'Jdg\',9,42);">9:42</A>ff.<P>(2) <a onClick="return mV(\'Jdg\',9,41);">Jud 9:41b</a> seems to give in short what we find related in <a onClick="return mV(\'Jdg\',9,\'34-40\');">9:34-40</A>.<P>(3) Septuagint in <a onClick="return mV(\'Jdg\',9,31);">9:31</a> has suggested to many that we should read there, "and he sent messengers unto Abimelech in Arumah," instead of reading "craftily." We would thus have a parallel to <a onClick="return mV(\'Jdg\',9,41);">9:41a</A>.<P>It may be suggested therefore that if the account be double (and it is strange that Abimelech should again attack the city by almost the same methods as before, when the revolters had been already got rid of), the narratives would be in this order:<P>Introductory, <a onClick="return mV(\'Jdg\',9,\'23-25\');">Jud 9:23-25</a>; then <a onClick="return mV(\'Jdg\',9,\'26-29\',30);">9:26-29,30</A> common to both, and so possibly part of <a onClick="return mV(\'Jdg\',9,31,32);">9:31 and 32</a>f. Then we have two accounts of the event: (a) <a onClick="return mV(\'Jdg\',9,31,\'34-40\');">9:31 (part), 34-40</A>; (b) <a onClick="return mV(\'Jdg\',9,\'41-45\');">9:41-45</A>, followed by <a onClick="return mV(\'Jdg\',9,46);">9:46</A>ff.``149';
isbe[9346]='Zebulonite`zeb\'-u-lon-it.`<a href="./study/isbe/search.html?string=ZEBULUNITES">ZEBULUNITES</a>`1';
isbe[9347]='Zebulun`zeb\'-u-lun (zebhulun, also written zebuwlun and zebuluwn; the first form occurs only in <a onClick="return mV(\'Jdg\',1,30);">Jud 1:30</A>; the other two are frequent, and are used interchangeably; Zaboulon): In <a onClick="return mV(\'Gen\',30,20);">Ge 30:20</a> Leah exclaims, "God hath endowed me with a good dowry," which suggests a derivation of Zebulun from zabhadh, "to bestow," the (d) being replaced by (l). Again she says, "Now will my husband dwell with me (or "honor me"): and she called his name Zebulun"; the derivation being from zabhal, "to exalt" or "honor" (OHL, under the word).<P>Zebulun was the 10th son of Jacob, the 6th borne to him by Leah in Paddan-aram. Nothing is known of this patriarch\'s life, save in so far as it coincides with that of his brethren. Targum Pseudo-Jonathan says that he first of the five brethren was presented to Pharaoh by Joseph, when Israel and his house arrived in Egypt (<a onClick="return mV(\'Gen\',47,2);">Ge 47:2</a>). Three sons, Sered, Elon and Jahleel, were born to him in Canaan, and these became the ancestors of the three main divisions of the tribe (<a onClick="return mV(\'Gen\',46,14);">Ge 46:14</a>).<P>The position of the tribe of Zebulun in the wilderness was with the standard of the camp of Judah on the east side of the tabernacle (<a onClick="return mV(\'Num\',2,7);">Nu 2:7</a>). This camp moved foremost on the march (<a onClick="return mV(\'Num\',2,9);">Nu 2:9</a>). At the first census Zebulun numbered 57,400 men of war (<a onClick="return mV(\'Num\',1,30);">Nu 1:30</a>), the prince of the tribe being Eliab, son of Helon (<a onClick="return mV(\'Num\',1,9);">Nu 1:9</a>). At the second census the men of war numbered 60,500 (<a onClick="return mV(\'Num\',26,27);">Nu 26:27</a>); see, however, <a href="./study/isbe/search.html?string=NUMBERS">NUMBERS</A>. Among the spies Zebulun was represented by Gaddiel son of Sodi (<a onClick="return mV(\'Num\',13,10);">Nu 13:10</a>). To assist in the division of the land Elizaphan son of Parnach was chosen (<a onClick="return mV(\'Num\',34,25);">Nu 34:25</a>). At Shechem Zebulun, the descendants of Leah\'s youngest son, stood along with Reuben, whose disgrace carried with it that of his tribe, and the descendants of the sons of the handmaids, over against the other six, who traced their descent to Rachel and Leah (<a onClick="return mV(\'Deu\',27,13);">De 27:13</a>). At the second division of territory the lot of Zebulun came up third, and assigned to him a beautifully diversified stretch of country in the north. The area of his possession is in general clear enough, but it is impossible to define the boundaries exactly (<a onClick="return mV(\'Jos\',19,\'10-16\');">Jos 19:10-16</a>). It "marched" with Naphtali on the east and southeast, and with Asher on the west and northwest. The line ran northward from Mt. Tabor, keeping on the heights west of the Sea of Galilee, on to Kerr \'Anan (Hannathon). It turned westward along the base of the mountain, and reached the border of Asher, probably by the vale of \'Abilin. It then proceeded southward to the Kishon opposite Tell Kaimun (Jokneam). As the plain belonged to Issachar, the south border would skirt its northern edge, terminating again at Tabor, probably near Deburiyeh (Daberath), which belonged to Issachar (<a onClick="return mV(\'Jos\',21,28);">Jos 21:28</a>).<P>The details given are confusing. It is to be observed that this does not bring Zebulun into touch with the sea, and so is in apparent contradiction with <a onClick="return mV(\'Gen\',49,13);">Ge 49:13</a>, and also with Josephus (Ant., V, i, 22; BJ, III, iii, 1), who says the lot of Zebulun included the land which "lay as far as the Lake of Gennesareth, and that which belonged to Carmel and the sea." Perhaps, however, the limits changed from time to time. So far as the words in <a onClick="return mV(\'Gen\',49,13);">Ge 49:13</a> are concerned, Delitzsch thinks they do not necessarily imply actual contact with the sea; but only that his position should enable him to profit by maritime trade. This it certainly did; the great caravan route, via maris, passing through his territory. Thus he could "suck the treasures of the sea." See also <a href="./study/isbe/search.html?string=TABOR,+MOUNT">TABOR, MOUNT</a>. Within the boundaries thus roughly indicated were all varieties of mountain and plain, rough upland country. shady wood and fruitful valley. What is said of the territory of Naphtali applies generally to this. Olive groves and vineyards are plentiful. Good harvests are gathered on the sunny slopes, and on the rich levels of the Plain of Asochis (el-Battauf).<P>Elon the Zebulunite was the only leader given by the tribe to Israel of whom we have any record (<a onClick="return mV(\'Jdg\',12,11);">Jud 12:11</a>f); but the people were brave and skillful in war, furnishing, according to the Song of Deborah, "(them) that handle the marshal\'s staff" (<a onClick="return mV(\'Jdg\',5,14);">Jud 5:14</a>). The tribe sent 50,000 single-hearted warriors, capable and well equipped, to David at Hebron (<a onClick="return mV(\'1Ch\',12,33);">1Ch 12:33</a>). From their rich land they brought stores of provisions (<a onClick="return mV(\'1Ch\',12,40);">1Ch 12:40</a>). Over Zebulun in David\'s time was Ishmaiah, son of Obadiah (<a onClick="return mV(\'1Ch\',27,19);">1Ch 27:19</a>).Although they had fallen away, Hezekiah proved that many of them were capable of warm response to the appeal of religious duty and privilege (<a onClick="return mV(\'2Ch\',30,10,18);">2Ch 30:10f; 18</a>). They are not named, but it is probable that Zebulun suffered along with Naphtali in the invasion of Tiglath-pileser (<a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>). In later days the men from these breezy uplands lent strength and enterprise to the Jewish armies. Jotapata (Tell Jifat), the scene of Josephus\' heroic defense, was in Zebulun. So was Sepphoris (Seffuriyeh), which was for a time the capital of Galilee (Ant., XVIII, ii, 1; BJ, VII; III, ii, 4). Nazareth, the home of our Saviour\'s boyhood, is sheltered among its lower hills.``54';
isbe[9348]='Zebulunites`zeb\'-u-lun-its (hazebhuloni; Zaboulon): Members of the tribe of Zebulun (<a onClick="return mV(\'Num\',26,27);">Nu 26:27</a>; <a onClick="return mV(\'Jdg\',12,11);">Jud 12:11</a>f).``1';
isbe[9349]='Zechariah (1)`zek-a-ri\'-a (zekharyahu, or zekharyah; the Septuagint Zacharia(s)): A very common name in the Old Testament. The form, especially the longer form, of the name would suggest for its meaning, "Yah remembers" or "Yah is renowned," and the name was doubtless understood in this sense in later times. But the analogies with <a href="./study/isbe/search.html?string=ZACCUR">ZACCUR</a>, <a href="./study/isbe/search.html?string=ZECHER">ZECHER</a>, <a href="./study/isbe/search.html?string=ZICHRI">ZICHRI</a> (which see), etc., make some original ethnic derivation probable.<P>(1) King of Israel, son of Jeroboam II (the King James Version "Zachariah"). See the next article.<P>(2) The grandfather of King Hezekiah, through Hezekiah\'s mother Abi (<a onClick="return mV(\'2Ki\',18,2);">2Ki 18:2</a>, the King James Version "Zachariah" parallel <a onClick="return mV(\'2Ch\',29,1);">2Ch 29:1</a>).<P>(3) A contemporary of Isaiah, taken by Isaiah as a trustworthy witness in the matter of the sign Maher-shalal-hash-baz (<a onClick="return mV(\'Isa\',8,1);">Isa 8:1</a>). As his father\'s name was Jeberechiah, some support seems to be offered to theories of those who would make him the author of certain portions of Zechariah.<P>See <a href="./study/isbe/search.html?string=ZECHARIAH,+BOOK+OF">ZECHARIAH, BOOK OF</A>.<P>(4) A Reubenite of the time of Israel\'s captivity (<a onClick="return mV(\'1Ch\',5,7);">1Ch 5:7</a>).<P>(5) A Benjamite, living in Gideon (<a onClick="return mV(\'1Ch\',9,37);">1Ch 9:37</a>; called "Zecher" in <a onClick="return mV(\'1Ch\',8,31);">8:31</A>). He was the brother of Kish and hence, the uncle of Saul.<P>(6) A Manassite of Gilead, at the time of David (<a onClick="return mV(\'1Ch\',27,21);">1Ch 27:21</a>).<P>(7) The third son of Jehoshaphat (<a onClick="return mV(\'2Ch\',21,2);">2Ch 21:2</a>). He was slain by Jehoram (<a onClick="return mV(\'2Ch\',21,4);">2Ch 21:4</a>).<P>(8) A "prince" who Jehoshaphat sent to "teach" in the cities of Judah (<a onClick="return mV(\'2Ch\',17,7);">2Ch 17:7</a>). As this "teaching" was in connection with the establishing of the Law, Zechariah was primarily a judge.<P>(9) A prophet who was influential in the early days of Uzziah (<a onClick="return mV(\'2Ch\',26,5);">2Ch 26:5</a>). He is characterized as ha-mebh in bire\'oth (beyir\'ath(?)) ha-elohim, which phrase is usually understood to mean that he had instructed (Revised Version margin) the king in the fear of God. As long as he lived the king profited by his instruction and advice.<P>The following eight are all Levites:<P>(10) A doorkeeper at the time of David, who was made a singer "of the second degree" (<a onClick="return mV(\'1Ch\',15,18);">1Ch 15:18</a>; the text is confused). He was a player on a "psaltery" (<a onClick="return mV(\'1Ch\',15,20);">1Ch 15:20</a>) and took part in the thanksgiving when the Ark was brought to Jerusalem (<a onClick="return mV(\'1Ch\',16,5);">1Ch 16:5</a>).<P>(11) A son of Isshiah (<a onClick="return mV(\'1Ch\',24,25);">1Ch 24:25</a>).<P>(12) A son of Meshelemiah, a "porter of the door of the tent of meeting" at the time of David (<a onClick="return mV(\'1Ch\',9,21);">1Ch 9:21</a>; <a onClick="return mV(\'1Ch\',26,2,14);">26:2,14</a>). In <a onClick="return mV(\'1Ch\',26,14);">1Ch 26:14</a> called "a discreet counselor."<P>(13) A son of Hosah, a Merarite, also at David\'s time (<a onClick="return mV(\'1Ch\',26,11);">1Ch 26:11</a>).<P>(14) The father of the prophet, <a href="./study/isbe/search.html?string=JAHAZIEL">JAHAZIEL</A> (which see) (<a onClick="return mV(\'2Ch\',20,14);">2Ch 20:14</a>).<P>(15) A son of Asaph, who assisted in the purification of the Temple at the time of Hezekiah (<a onClick="return mV(\'2Ch\',29,13);">2Ch 29:13</a>).<P>(16) A Kohathite, who assisted in the repair of the Temple at the time of Josiah (<a onClick="return mV(\'2Ch\',34,12);">2Ch 34:12</a>).<P>(17) A son of Jonathan, an Asaphite, one of the musicians at the dedication of the wall at the time of Nehemiah (<a onClick="return mV(\'Neh\',12,35);">Ne 12:35</a>).<P>The following are all priests:<P>(18) A trumpeter at the time of David (<a onClick="return mV(\'1Ch\',15,24);">1Ch 15:24</a>).<P>(19) A son of Jehoiada, at the time of Joash. He rebuked the people publicly for their apostasy, and was stoned by them, Joash consenting to their act (<a onClick="return mV(\'2Ch\',24,\'20-22\');">2Ch 24:20-22</a>). As 2 Chronicles is the last book in the Hebrew Old Testament, Zechariah was regarded as the last of the Old Testament martyrs, and hence, is coupled with Abel (the first martyr) in <a onClick="return mV(\'Mat\',23,35);">Mt 23:35</a> parallel <a onClick="return mV(\'Luk\',11,51);">Lu 11:51</a>. The words "son of Barachiah" in Matthew are due to confusing this Zechariah with the prophet.<P>See <a href="./study/isbe/search.html?string=ZACHARIAH">ZACHARIAH</a>.<P>(20) One of the "rulers of the house of God" at the time of Josiah (<a onClick="return mV(\'2Ch\',35,8);">2Ch 35:8</a>).<P>(21) A son of Pashhur, 242 of whose descendants as "chiefs of fathers\' houses" dwelt in Jerusalem at the time of Nehemiah (<a onClick="return mV(\'Neh\',11,13);">Ne 11:13</a>).<P>(22) A trumpeter at the dedication of the wall at the time of Nehemiah (<a onClick="return mV(\'Neh\',12,41);">Ne 12:41</a>).<P>(23) The prophet (<a onClick="return mV(\'Ezr\',5,1);">Ezr 5:1</a>; <a onClick="return mV(\'Ezr\',6,14);">6:14</a>; <a onClick="return mV(\'Neh\',12,16);">Ne 12:16</a>; <a onClick="return mV(\'Zec\',1,1,7);">Zec 1:1,7</a>; <a onClick="return mV(\'Zec\',7,1,8);">7:1,8</a>; 1Esdras 6:1; 7:3).<P>See <a href="./study/isbe/search.html?string=ZECHARIAH,+BOOK+OF">ZECHARIAH, BOOK OF</>.<P>The following are all returned exiles or are mentioned only as ancestors of such:<P>(24) A son of Parosh (<a onClick="return mV(\'Ezr\',8,3);">Ezr 8:3</a>; 1Esdras 8:30 has "Zacharias" here and elsewhere).<P>(25) A son of Bebai (<a onClick="return mV(\'Ezr\',8,11);">Ezr 8:11</a>; 1Esdras 8:37)<P>(26) One of the "chief men" dispatched by Ezra to bring priests from Casiphia (<a onClick="return mV(\'Ezr\',8,16);">Ezr 8:16</a>; 1Esdras 8:44). Doubtless the same as (24) or (25), above.<P>(27) One of the persons who stood by Ezra at the reading of the Law (<a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>; 1Esdras 9:44); almost certainly identical with (26).<P>(28) A son of Elam, who had taken a foreign wife (<a onClick="return mV(\'Ezr\',10,26);">Ezr 10:26</a>; 1Esdras 9:27).<P>(29) A son of Amariah, a Judahite, the ancestor of certain persons dwelling in Jerusalem (<a onClick="return mV(\'Neh\',11,4);">Ne 11:4</a>).<P>(30) A son of "the Shilonite," the ancestor of certain persons dwelling in Jerusalem (<a onClick="return mV(\'Neh\',11,5);">Ne 11:5</a>).``48';
isbe[9350]='Zechariah (2)`(zekharyah, zekharydhu, "Yah has remembered" (<a onClick="return mV(\'2Ki\',14,29);">2Ki 14:29</a>; <a onClick="return mV(\'2Ki\',15,\'8-12\');">15:8-12</a>); Zacharias, the King James Version Zachariah): Son of Jeroboam II, and 14th king of Israel. He was the 4th of the line of Jehu, and reigned six months. Zechariah succeeded to a splendid inheritance, as he was king, not only of the ten tribes of Israel, but of the Syrian state of Damascus, which his father had subdued. In the unusual wealth and dignity of this position lay his peril. Also there were two dark shadows falling across his path, though both probably unseen by him. One was the promise to Jehu, as the reward of his destroying the worship of Baal in Israel, that his sons should sit on the throne of Israel to the 4th generation (<a onClick="return mV(\'2Ki\',10,30);">2Ki 10:30</a>; <a onClick="return mV(\'2Ki\',15,12);">15:12</a>). Zechariah was Jehu\'s great-great-grandson. The other was the word of Amos to the priest of Bethel: "Then said the Lord. ...I will rise against the house of Jeroboam with the sword" (<a onClick="return mV(\'Amo\',7,8,9);">Am 7:8,9</a>).<P>The only brief notice of Zechariah personal to himself is that he gave his support to the worship of the calves, since Jeroboam I established the religion of the state. He hardly had time, however, to identify himself with this or any institution before he was publicly assassinated by Shallum, the son of Jabesh (he "smote him before the people"). The prophet Hosea was then alive, and there is probably allusion to this crime when, addressing Ephraim, he says: "Where is thy king, that he may save thee in all thy cities?. ...I have given thee a king in mine anger, and have taken him away in my wrath" (<a onClick="return mV(\'Hsa\',13,10,11);">Ho 13:10,11</a>; compare <a onClick="return mV(\'Hsa\',1,4);">1:4</a>).<P>There has long been difficulty with the chronology of this period. Archbishop Ussher assumed an interregnum of 11 years between the death of Jeroboam II and Zechariah\'s accession. This is accepted as probable by a recent writer, who sees "at least 10 years of incessant conflict between rival claimants to the throne on Jeroboam\'s death" (see article "Zechariah" in HDB, IV). It seems more likely that there is error in certain of the synchronisms. The year of Zechariah\'s accession was probably 759 BC (some put it later), and the 6 months of his reign, with that given to Shallum, may be included in the 10 years of Menahem, who followed them (<a onClick="return mV(\'2Ki\',15,17);">2Ki 15:17</a>).`<a href="./study/isbe/search.html?string=CHRONOLOGY+OF+THE+OLD+TESTAMENT">CHRONOLOGY OF THE OLD TESTAMENT</a>`17';
isbe[9351]='Zechariah, Book of`1. The Prophet<P>2. His Times and Mission<P>3. Contents and Analysis<P>4. The Critical Question Involved<P>5. The Unity of the Book<P>6. Conclusion<P>LITERATURE<hr /><P>Few books of the Old Testament are as difficult of interpretation as the Book of Zechariah; no other book is as Messianic. Jewish expositors like Abarbanel and Jarchi, and Christian expositors such as Jerome, are forced to concede that they have failed "to find their hands" in the exposition of it, and that in their investigations they passed from one labyrinth to another, and from one cloud into another, until they lost themselves in trying to discover the prophet\'s meaning. The scope of Zechariah\'s vision and the profundity of his thought are almost without a parallel. In the present writer\'s judgment, his book is the most Messianic, the most truly apocalyptic and eschatological, of all the writings of the Old Testament.<P>1. The Prophet:<P>Zechariah was the son of Berechiah, and the grandson of Iddo (<a onClick="return mV(\'Zec\',1,1,7);">Zec 1:1,7</a>). The same Iddo seems to be mentioned among the priests who returned from exile under Zerubbabel and Joshua in the year 536 BC (<a onClick="return mV(\'Neh\',12,4);">Ne 12:4</a>; <a onClick="return mV(\'Ezr\',2,2);">Ezr 2:2</a>). If so, Zechariah was a priest as well as a prophet, and presumably a young man when he began to preach. Tradition, on the contrary, declares that he was well advanced in years. He apparently survived Haggai, his contemporary (<a onClick="return mV(\'Ezr\',5,1);">Ezr 5:1</a>; <a onClick="return mV(\'Ezr\',6,14);">6:14</a>). He was a poet as well as a prophet. Nothing is known of his end. The Targum says he died a martyr.<P>2. His Times and Mission:<P>The earliest date in his book is the 2nd year (520 BC) of the reign of Darius Hystaspis, and the latest, the 4th year of the same king\'s reign (<a onClick="return mV(\'Zec\',1,1,7);">Zec 1:1,7</a>; <a onClick="return mV(\'Zec\',7,1);">7:1</a>). Though these are the only dates given in his writings, it is possible of course that he may have continued active for several additional years. Otherwise, he preached barely two years. The conditions under which he labored were similar to those in Haggai\'s times. Indeed, Haggai had begun to preach just two months before Zechariah was called. At that time there were upheavals and commotions in different parts of the Persian empire, especially in the northeast, Jeremiah\'s prophecies regarding the domination of Babylon for 70 years had been fulfilled (<a onClick="return mV(\'Jer\',15,11);">Jer 15:11</a>; <a onClick="return mV(\'Jer\',29,10);">29:10</a>). The returned captives were becoming disheartened and depressed because Yahweh had not made it possible to restore Zion and rebuild the temple. The foundations of the latter had been already laid, but as yet there was no superstructure (<a onClick="return mV(\'Ezr\',3,\'8-10\');">Ezr 3:8-10</a>; <a onClick="return mV(\'Zec\',1,16);">Zec 1:16</a>). The altar of burnt offering was set up upon its old site, but as yet there were no priests worthy to officiate in the ritual of sacrifice (<a onClick="return mV(\'Ezr\',3,2,3);">Ezr 3:2,3</a>; <a onClick="return mV(\'Zec\',3,3);">Zec 3:3</a>). The people had fallen into apathy, and needed to be aroused to their opportunity. Haggai had given them real initiative, for within 24 days after he began to preach the people began to work (<a onClick="return mV(\'Hag\',1,1,15);">Hag 1:1,15</a>). It was left for Zechariah to bring the task of temple-building to completion. This Zechariah did successfully; this, indeed, was his primary mission and work.<P>3. Contents and Analysis:<P>The prophecies of Zechariah naturally fall into two parts, chapters 1-8 and 9-14, both of which begin with the present and look forward into the distant future. (1) <a onClick="return mV(\'Zec\',1,\'1-\');">Zechariah 1-8</a>, consisting of three distinct messages delivered on three different occasions:<P>(a) <a onClick="return mV(\'Zec\',1,\'1-6\');">Zec 1:1-6</a>, an introduction, delivered in the 8th month of the 2nd year of Darius Hystaspis (520 BC). These words, having been spoken three months before the prophecies which follow, are obviously a general introduction. They are decidely spiritual and strike the keynote of the entire collection. In them the prophet issues one of the strongest and most intensely spiritual calls to repentance to be found in the Old Testament.<P>(b) <a onClick="return mV(\'Zec\',1,7);">Zec 1:7-6:15</a>, a series of eight night visions, followed by a coronation scene, all delivered on the 24th day of the 11th month of the same 2nd year of Darius (520 BC), or exactly two months after the corner stone of the temple had been laid (<a onClick="return mV(\'Hag\',2,18);">Hag 2:18</a>; <a onClick="return mV(\'Zec\',1,7);">Zec 1:7</a>). These visions were intended to encourage the people to rebuild God\'s house. They are eight in number, and teach severally the following lessons:<P>(i) The vision of the horses (<a onClick="return mV(\'Zec\',1,\'7-17\');">Zec 1:7-17</a>), teaching God\'s special care for and interest in his people: "My house shall be built" (<a onClick="return mV(\'Zec\',1,16);">Zec 1:16</a>).<P>(ii) The four horns and four smiths (<a onClick="return mV(\'Zec\',1,\'18-21\');">Zec 1:18-21</a>), teaching that Israel\'s foes have finally been destroyed; in fact that they have destroyed themselves. There is no longer, therefore, any opposition to building God\'s house.<P>(iii) The man with a measuring line (<a onClick="return mV(\'Zec\',2,\'1-\');">Zechariah 2</a>), teaching that God will re-people, protect and dwell in Jerusalem as soon as the sacred edifice has been built. The city itself will expand till it becomes a great metropolis without walls; Yahweh will be a wall of fire round about it.<P>(iv) Joshua, the high priest, clad in filthy garments, and bearing the sins both of himself and the people (<a onClick="return mV(\'Zec\',3,\'1-\');">Zechariah 3</a>); but cleansed, continued and made typical of the Messiah-Branch to come.<P>(v) The candelabrum and the two olive trees (<a onClick="return mV(\'Zec\',4,\'1-\');">Zechariah 4</a>), teaching that the visible must give place to the spiritual, and that, through "the two sons of oil," Zerubbabel the layman, and Joshua the priest (<a onClick="return mV(\'Zec\',4,14);">Zec 4:14</a>), the light of God\'s church will continue to burn with ever-flaming brightness. For it is "not by might" but by Yahweh\'s Spirit, i.e. by divine life and animation, by divine vigor and vivacity, by divine disposition and courage, by divine executive ability and technical skill, that God\'s house shall be built and supplied with spiritual life (<a onClick="return mV(\'Zec\',4,6);">Zec 4:6</a>).<P>(vi) The flying roll (<a onClick="return mV(\'Zec\',5,\'1-4\');">Zec 5:1-4</a>), teaching that when the temple is built and God\'s law is taught the land shall be purified from outward wickedness.<P>(vii) The Ephah (<a onClick="return mV(\'Zec\',5,\'5-11\');">Zec 5:5-11</a>); wickedness personified is borne away back to the land of Shinar, teaching that when the temple is rebuilt wickedness shall be actually removed from the land.<P>(viii) The four chariots (<a onClick="return mV(\'Zec\',6,\'1-8\');">Zec 6:1-8</a>), teaching that God\'s protecting providence will be over His sanctuary, and that His people, purified from sin, shall rest secure in Him.<P>These eight visions are followed by a coronation scene, in which Joshua the high priest is crowned and made typical of the Messiah-Priest-King, whose name is Branch (<a onClick="return mV(\'Zec\',6,\'9-15\');">Zec 6:9-15</a>). (c) <a onClick="return mV(\'Zec\',7,1);">Zechariah 7</a>; <a onClick="return mV(\'Zec\',8,1);">8</a>, Zechariah\'s answer to the Bethel deputation concerning fasting; delivered on the 4th day of the 9th month of the 4th year of Darius (518 BC). The Jews had been accustomed to fast on the anniversaries of the following four great outstanding events in the history of their capital:<P>(i) when Nebuchadnezzar took Jerusalem, in the 4th month (<a onClick="return mV(\'Jer\',52,6);">Jer 52:6</a>);<P>(ii) when the Temple was burned in the 5th month (<a onClick="return mV(\'Jer\',52,12);">Jer 52:12</a>);<P>(iii) when Gedaliah was murdered in the 7th month (<a onClick="return mV(\'Jer\',41,2);">Jer 41:2</a>); and<P>(iv) when the siege of Jerusalem was begun in the 10th month (<a onClick="return mV(\'2Ki\',25,1);">2Ki 25:1</a>).<P>There are four sections to the prophet\'s answer divided by the slightly varying formula, "The word of Yahweh came unto me" (<a onClick="return mV(\'Zec\',7,4,8);">Zec 7:4,8</a>; <a onClick="return mV(\'Zec\',8,1,18);">8:1,18</a>) and teaching:<P>(a) Fasting affects only yourselves; God requires obedience (<a onClick="return mV(\'Zec\',7,\'4-7\');">Zec 7:4-7</a>).<P>(b) Look at the lesson from your fathers; they forsook justice and compassion and God punished them (<a onClick="return mV(\'Zec\',7,\'8-14\');">Zec 7:8-14</a>).<P>(c) Yahweh is now waiting to return to Jerusalem to save His people in truth and holiness. In the future, instead of a curse God will send blessing, instead of evil, good (<a onClick="return mV(\'Zec\',8,\'1-17\');">Zec 8:1-17</a>).<P>(d) In fact, your fasts shall be changed into festivals, and many nations shall in that day seek Yahweh of hosts in Jerusalem (<a onClick="return mV(\'Zec\',8,\'18-23\');">Zec 8:18-23</a>).<P>(2) <a onClick="return mV(\'Zec\',9,\'1-\');">Zechariah 9-14</a>, consisting of two oracles, without dates;<P>(a) <a onClick="return mV(\'Zec\',9,\'1-\');">Zechariah 9-11</a>, an oracle of promise to the new theocracy. This section contains promises of a land in which to dwell, a return from exile, victory over a hostile world-power, temporal blessings and national strength, closing, with a parable of judgment brought on by Israel\'s rejection of Yahweh as their shepherd; thus Judah and Ephraim restored, united and made victorious over their enemies, are promised a land and a king (<a onClick="return mV(\'Zec\',9,\'1-\');">Zec 9</a>); Israel shall be saved and strengthened (<a onClick="return mV(\'Zec\',10,\'1-\');">Zec 10</a>); Israel shall be punished for rejecting the shepherding care of Yahweh (<a onClick="return mV(\'Zec\',11,\'1-\');">Zec 11</a>);<P>(b) <a onClick="return mV(\'Zec\',12,\'1-\');">Zechariah 12-14</a>, an oracle describing the victories of the new theocracy, and the coming day of Yahweh. This section is strongly eschatological, presenting three distinct apocalyptic pictures: thus how Jerusalem shall be besieged by her enemies, but saved by Yahweh (<a onClick="return mV(\'Zec\',12,\'1-\');">Zec 12</a>); how a remnant of Israel purified and refined shall be saved (<a onClick="return mV(\'Zec\',13,\'1-\');">Zec 13</a>); closing with a grand apocalyptic vision of judgment and redemption—the nations streaming up to Jerusalem to keep the joyous Feast of Tabernacles, and everything in that day becoming holy to Yahweh.<P>4. The Critical Question Involved:<P>There are two opposing schools of criticism in regard to the origin of <a onClick="return mV(\'Zec\',9,\'1-\');">Zechariah 9-14</a>; one holds what is known as the pre-exilic hypothesis, according to which chapters 9-14 were written before the downfall of Jerusalem; more specifically, that <a onClick="return mV(\'Zec\',9,\'1-\');">Zechariah 9-11</a> and <a onClick="return mV(\'Zec\',13,7,8,9);">13:7-9</A> spring from the 8th century BC, having been composed perhaps by Zechariah, the son of Jeberechiah mentioned in <a onClick="return mV(\'Isa\',8,2);">Isa 8:2</a>; whereas <a onClick="return mV(\'Zec\',12,\'1-\');">Zechariah 12-14</a>, except <a onClick="return mV(\'Zec\',13,7,8,9);">13:7-9</A>, were composed by some unknown contemporary of Jeremiah in the 7th century BC. On the other hand, there are also those who advocate a late post-Zecharian origin for chapters 9-14, somewhere about the 3rd century BC. The latter hypothesis is today the more popular. Over against these the traditional view, of course, is that Zechariah, near the close of the 6th century, wrote the entire book ascribed to him. Only chapters 9-14 are in dispute. No one doubts the genuineness of <a onClick="return mV(\'Zec\',1,\'1-\');">Zechariah 1-8</a>.<P>The following are the main arguments of those who advocate a pre-exilic origin for these oracles:<P>(1) <a onClick="return mV(\'Zec\',11,8);">Zec 11:8</a>, "And I cut off the three shepherds in one month." These "three shepherds" are identified with certain kings who reigned but a short time each in the Northern Kingdom; for example, Zechariah, Shallum and Menahem (<a onClick="return mV(\'2Ki\',15,\'8-14\');">2Ki 15:8-14</a>). But the difficulty with this argument is that they were not cut off "in one month"; Menahem, on the contrary, reigned 10 years in Samaria (<a onClick="return mV(\'2Ki\',15,17);">2Ki 15:17</a>).<P>(2) <a onClick="return mV(\'Zec\',12,\'11-14\');">Zec 12:11-14</a>, which speaks of "a great mourning in Jerusalem, as the mourning of Hadadrimmon in the valley of Megiddon," is claimed to fix the date of <a onClick="return mV(\'Zec\',12,\'1-\');">Zechariah 12-14</a>. Josiah fell in the valley of Megiddo (<a onClick="return mV(\'2Ki\',23,29);">2Ki 23:29</a>; <a onClick="return mV(\'2Ch\',35,22);">2Ch 35:22</a>). But surely the mourning of Judah for Josiah might have been remembered for a century, from 609 BC till 518 BC.<P>(3) <a onClick="return mV(\'Zec\',14,5);">Zec 14:5</a>, referring to the "earthquake" in the days of Uzziah, is another passage fastened upon to prove the preexilic origin of these prophecies. But the earthquake which is here alluded to took place at least a century and a half before the date assigned for the composition of <a onClick="return mV(\'Zec\',14,\'1-\');">Zechariah 14</a>. And surely if an earthquake can be alluded to by an author 150 years after it occurs, Zechariah, who lived less than a century later, might have alluded to it also.<P>(4) A much stronger argument in favor of a pre-exilic origin of these prophecies is the names given to theocracy, e.g. "Ephraim" and "Jerusalem" (<a onClick="return mV(\'Zec\',9,10);">Zec 9:10</a>), "Judah" and "Ephraim" (<a onClick="return mV(\'Zec\',9,13);">Zec 9:13</a>), "house of Judah" and "house of Joseph" (<a onClick="return mV(\'Zec\',10,6);">Zec 10:6</a>), "Judah and Israel" (<a onClick="return mV(\'Zec\',11,14);">Zec 11:14</a>), implying that the kingdoms of Israel and Judah are still standing. But subsequent to the captivity the Jews ever regarded themselves as representatives of the 12 tribes, as is obvious from their offering 12 sacrifices (<a onClick="return mV(\'Ezr\',6,17);">Ezr 6:17</a>; <a onClick="return mV(\'Ezr\',8,35);">8:35</a>). Moreover, old names such as "Israel" and "Judah" long survived (compare <a onClick="return mV(\'Jer\',31,\'27-31\');">Jer 31:27-31</a>; <a onClick="return mV(\'Zec\',8,13);">Zec 8:13</a>).<P>(5) <a onClick="return mV(\'Zec\',14,10);">Zec 14:10</a>, which defines the area occupied by Judah as extending "from Geba to Rimmon," which corresponds, it is alleged, with the conditions which prevailed just prior to the captivity. But it satisfies equally well the conditions after the exile in Zechariah\'s own time.<P>(6) Again, it is argued that the national sins, the prevailing sins, idolatry, teraphim and false prophecy (<a onClick="return mV(\'Zec\',10,2);">Zec 10:2</a>; <a onClick="return mV(\'Zec\',13,\'2-6\');">13:2-6</a>), are those of pre-exilic times. But the same sins persisted in the post-exilic congregation (<a onClick="return mV(\'Neh\',6,\'7-14\');">Ne 6:7-14</a>; <a onClick="return mV(\'Mal\',2,11);">Mal 2:11</a>; <a onClick="return mV(\'Mal\',3,5);">3:5</a>), and there is no special emphasis laid upon them here.<P>(7) Finally, it is argued that the enemies of Israel mentioned in <a onClick="return mV(\'Zec\',9,\'1-\');">Zechariah 9-14</a> are those of pre-exilic times, Assyria and Egypt (<a onClick="return mV(\'Zec\',10,10,11);">10:10,11</a>), Syria, Phoenicia and Philistia (<a onClick="return mV(\'Zec\',9,\'1-7\');">9:1-7</A>). But forms of expression are slow in changing: the name "Assyrians" occurs in <a onClick="return mV(\'Lam\',5,6);">La 5:6</a>, and "Assyria" is employed instead of "Persia" in <a onClick="return mV(\'Ezr\',6,22);">Ezr 6:22</a>. Jeremiah prophesied against Damascus and Hamath long after their loss of independence (<a onClick="return mV(\'Jer\',49,\'23-27\');">49:23-27</a>). After the exile, the Philistines resisted Israel\'s return (<a onClick="return mV(\'Neh\',4,7,8);">Ne 4:7,8</a>). In short all these nations were Israel\'s hereditary foes, and, therefore, judgments pronounced against them were always in place. Furthermore, it may be said in general that there are reasons for thinking that, in both halves of the Book of Zechariah, the exile is represented as an event of the past, and that the restoration from exile both of Ephraim and Judah, though incomplete, has already begun. This is unquestionably true of <a onClick="return mV(\'Zec\',1,\'1-\');">Zechariah 1-8</a> (<a onClick="return mV(\'Zec\',1,12);">1:12</A>; <a onClick="return mV(\'Zec\',2,\'6-12\');">2:6-12</A>; <a onClick="return mV(\'Zec\',6,10);">6:10</A>; <a onClick="return mV(\'Zec\',7,5);">7:5</A>; <a onClick="return mV(\'Zec\',8,7,8);">8:7,8</a>). The exile is treated as a fact. It is almost equally true of <a onClick="return mV(\'Zec\',9,\'1-\');">Zechariah 9-14</a> (compare <a onClick="return mV(\'Zec\',9,8,11);">9:8,11</a>; <a onClick="return mV(\'Zec\',10,6,8,9,10);">10:6,8-10</A>). Moreover, it may with justice be claimed that the alleged authors of chapters 9-14 dissociate themselves from any definitely named person or any specific event known to be pre-exilic. God alone is described as Ruler of His people. The only king mentioned is the Messiah-King (<a onClick="return mV(\'Zec\',9,9,10);">9:9,10</A>; <a onClick="return mV(\'Zec\',14,9);">14:9</A>). The "house of David" mentioned in <a onClick="return mV(\'Zec\',12,\'7-12\');">12:7-12</a>; <a onClick="return mV(\'Zec\',13,1);">13:1</A>, is never described as in possession of the throne. It is David\'s "house," and not any earthly ruler in it, of which the prophet speaks. Further, there are passages, indeed, in chapters 9-14 which, if pre-exilic in origin, would have been obscure and even misleading to a people confronted by the catastrophes of 722 and 586 BC. No specific enemy is alluded to. No definite army is named as approaching. Instead of Assyria, Javan is painted as the opposing enemy of theocracy (<a onClick="return mV(\'Zec\',9,13);">9:13</A>), and even she is not yet raised up or even threatening. On the other hand, in <a onClick="return mV(\'Zec\',12,\'1-\');">Zechariah 12-14</a>, it is not the Chaldeans under Nebuchadnezzar, but "all nations," who are described as coming up against Jerusalem (<a onClick="return mV(\'Zec\',12,2,3);">12:2,3</A>; <a onClick="return mV(\'Zec\',14,2);">14:2</A>). Moreover, victory and not defeat is promised (<a onClick="return mV(\'Zec\',9,8,14,16);">9:8,14,16</a>; <a onClick="return mV(\'Zec\',12,4,7,8);">12:4,7,8</A>). The preexilic prophets Amos, Hosea and Jeremiah held out no such hopes. These oracles, however, promise even temporal prosperity and abundance (<a onClick="return mV(\'Zec\',9,17);">9:17</A>; <a onClick="return mV(\'Zec\',10,1,8,12);">10:1,8,12</a>; <a onClick="return mV(\'Zec\',12,8);">12:8</A>; <a onClick="return mV(\'Zec\',14,2,14);">14:2,14</a>); and they exhort the people to rejoice rather than to fear (<a onClick="return mV(\'Zec\',9,9);">9:9</A>; <a onClick="return mV(\'Zec\',14,7);">10:7</A>); while in <a onClick="return mV(\'Zec\',14,\'16-19\');">14:16-19</A> all nations are represented as going up to Jerusalem to keep the Feast of Tabernacles, which was the most joyous feast of the Hebrew calendar. All this is quite the opposite of what the pre-exilic prophets (who are known to have been pre-exilic) actually prophesied. In <a onClick="return mV(\'Zec\',9,\'1-\');">Zec 9-14</a>, there is sounded forth not one clear note of alarm or warning; judgment rather gives place to hope, warning to encouragement, threatening to joy and gladness, all of which is most inconsistent with the idea that these chapters are of preexilic origin. On the other hand, their are perfectly consistent with the conditions and promises of post-exilic times.<P>The other hypothesis remaining to be discussed is that known as the post-Zecharian. This may be said to represent the prevailing critical view at the present time. But it, like the pre-exilic hypothesis, is based upon a too literalistic and mechanical view of prophecy. Those, like Stade, Wellhausen, Kuenen, Marti, Kautzsch, Cornill, Cheyne, Driver, Kuiper, Echardt and Mitchell, who advocate this view, employ the same critical methods as those whose views we have just discussed, but arrive at diametrically opposite conclusions. Indeed, no two critics agree as to the historical circumstances which produced these oracles. Most are of the opinion, however, that these chapters were composed during the Greek period, i.e. after 333 BC. In examining the arguments urged by the representatives of this school special caution is needed in distinguishing between the grounds advanced in support of a post-exilic and those which argue a post-Zecharian date. The former we may for the most part accept, as Zechariah was himself a post-exilic prophet; the latter we must first examine. In favor of a very late or Grecian origin for <a onClick="return mV(\'Zec\',9,\'1-\');">Zechariah 9-14</a>, the chief and all-important passage, and the one upon which more emphasis is placed than upon all others together, is <a onClick="return mV(\'Zec\',9,13);">9:13</a>, "For I have bent Judah for me, I have filled the bow with Ephraim; and I will stir up thy sons, O Zion, against thy sons, O Greece, and will make thee as the sword of a mighty man." Kuiper in summing up throws the whole weight of his argument in favor of a Greek date on this verse. Wellhausen makes it decide the date of these prophecies; while Stade declares that the announcement of the "sons of Javan" is alone sufficient to prove that these prophecies are after 333 BC. Two things are especially emphasized by critics in connection with this important passage:<P>(1) that the sons of Javan are the world-power of the author\'s day, namely, the Greek-Maccabean world-power; and<P>(2) that they are the enemies of Zion.<P>But in opposition to these claims it should be observed<P>(1) that the sons of Javan are but one of several world-powers within the range of the prophet\'s horizon (<a onClick="return mV(\'Zec\',9,\'1-7\');">Zec 9:1-7</a>, Syria, Phoenicia, Philistia; <a onClick="return mV(\'Zec\',12,2);">12:2</a>f; <a onClick="return mV(\'Zec\',14,2);">14:2</a>f; all nations; and <a onClick="return mV(\'Zec\',10,10,11);">10:10,11</a>, Assyria and Egypt); and<P>(2) that the Greeks under Alexander were not the enemies of Zion, and did not fight against the Jews, but against the Persians.<P>Assuming the genuineness of the passage (<a onClick="return mV(\'Zec\',9,13);">Zec 9:13</a>), the following considerations point to the Persian period as its probable historical background:<P>(a) The prophecy would be vague and meaningless if uttered after the invasion of Alexander.<P>(b) The passage does not describe a victory for the sons of Javan, but rather a defeat.<P>(c) It is introduced by an appeal to those still in exile to return, which would have been quite meaningless after Alexander\'s conquest.<P>(d) In short, <a onClick="return mV(\'Zec\',9,\'13-17\');">Zec 9:13-17</a>, as a whole, is not a picture of actual war, but rather an apocalyptic vision of the struggle of Israel with the world-power of the West, hence, its indefiniteness and figurative language.<P>Furthermore, it must not be forgotten that in Zechariah\'s own day the Greeks were rapidly becoming a menacing world-power. In the first 3 years (521-519 BC) of Darius\' reign, 12 different revolts took place, principally in the north and east. But, in 518, Darius was compelled to move westward at the head of his royal armies; Darius\' visit to Egypt in 517 BC was cut short by the disturbances of the Greeks (compare Wiedemann, Gesch., 236). In the year 516 BC the Greeks of the Hellespont and Bosporus, with the island of Samos, were made to submit to Pets rule. The next year (515 BC), Darius led an expedition against the Scythians across the Danube, the failure of which encouraged the Ionians subsequently to revolt. In 500 BC the great Ionian revolt actually took place. In 499 BC Sardis, the most important stronghold for Persia in Asia Minor, was burned by the Athenians. In 490 BC Marathon was fought and Persia was conquered. In 480 BC Xerxes was defeated at Salamis. But it is unnecessary to sketch the rise of Jayan further. Enough has been related to show that already in the reign of Darius Hystaspis—in whose reign Zechariah is known to have lived and prophesied—the sons of Greece were a rising world-power, and a threatening world-power. This is all really that is required by the passage. The sons of Jayan were but one of Israel\'s enemies in Zechariah\'s day; but they were of such importance that victory over them carried with it momentous Messianic interests. The language of chapter 9 is vague, and, in our judgment, too vague and too indefinite to have been uttered after Marathon (490 BC), or even after the burning of Sardis (500 BC); for, in that case, the author would have been influenced more by Greece and less by the movements and commotions of the nations.<P>Other arguments advanced by the post-Zecharian school are:<P>(1) <a onClick="return mV(\'Zec\',14,9);">Zec 14:9</a>, "And Yahweh shall be King over all the earth: in that day shall Yahweh be one, and his name one." To Stade this passage contains a polemic against the conditions in Greek times when all gods were conceived of as only different representations of one and the same god. But, on the contrary, the post-exilic congregation was as truly a theocracy in the days of Darius Hystaspis as in the period subsequent to Alexander\'s conquest. The Jewish colony of the Restoration was a religious sect, not a political organization. Zechariah often pictures the close relation of Yahweh to His people (2:10-13; 8:3,13), and the author of chapters 9-14 describes similar conditions. The "yearning for a fuller theocracy," which Cheyne (Bampton Lectures, 120) discovers in <a onClick="return mV(\'Zec\',9,\'1-\');">Zec 9-14</a>, is thoroughly consistent with the yearning of a struggling congregation in a land of forsaken idols shortly after the return from exile.<P>(2) <a onClick="return mV(\'Zec\',12,2);">Zec 12:2b</a>, interpreted to mean that "Judah also, forced by the enemy, shall be in the siege against Jerusalem," is a proof, it is alleged, that the children of the Diaspora had served as soldiers. The verse, accordingly, is said to be a description of the hostile relations which actually existed between Jerusalem and Judah in the beginning of the Maccabean struggle. The validity of these claims, however, is vitiated by a correct exegesis of the passage in hand. The text is apparently corrupt. In order to obtain a subject for "shall be," the preposition before Judah had better be stricken out, as in the Targum. The passage then translated reads, "And Judah also shall be in the siege against Jerusalem." But this is ambiguous. It may mean that Judah shall fight against Jerusalem, or it may mean that Judah, too, shall be besieged. The latter is obviously the true meaning of the passage, as <a onClick="return mV(\'Zec\',12,7);">Zec 12:7</a> indicates. For, as one nation might besiege Jerusalem (a city), so all nations, coming up are practically going to besiege Judah. The Septuagint favors this interpretation; likewise the Coptic version; and <a onClick="return mV(\'Zec\',14,14);">Zec 14:14</a>. Wellhausen frankly concedes that "no characteristic of the prophecy under discussion in reality agrees with the conditions of the Maccabean time. The Maccabees were not the Jews of the lowland, and they did not join themselves with the heathen out of hatred to the city of Jerusalem, in order finally to fall treacherously upon their companions in war. There is not the slightest hint in our passage of religious persecution; that alone decides, and hence, the most important sign of Maccabean times is wanting."<P>(3) <a onClick="return mV(\'Zec\',10,10,11);">Zec 10:10,11</a>, which mentions "Egypt" and "Assyria" (and which, strange to say, is also one of the strongest proofs in support of the preexilic hypothesis), is singularly enough interpreted to refer respectively to the Ptolemies of Egypt and the Seleucids of Syria. But this is quite impossible, and especially so in view of the prominence which is given to Egypt in <a onClick="return mV(\'Zec\',14,19);">14:19</A>, which points to Persian rather than Greek conditions; for then Egypt, in consequence of her perpetual efforts to throw off the Persian yoke, was naturally brought under the observation of the Jews in Palestine, who repeatedly beheld the Persian armies passing on their way to the valley of the Nile.<P>(4) Still another argument advanced in favor of a late post-Zecharian date for these oracles is that from language and style: Aramaisms, scriptio plena, the preponderance of the shorter form of the personal pronoun "I," the Hebrew ending on, the frequent use of the nota accusativi, especially with suffixes, the omission of the article, the use of the infinitive absolute, and the clumsy diction and weary repetition of these prophecies are pointed to as evidence of their origin in Grecian times. But in opposition to these claims, it may be remarked in general that their force is greatly weakened by two considerations: (a) the fact that the author of <a onClick="return mV(\'Zec\',9,\'1-\');"
