isbe[8546]='Syntyche`sin\'-ti-ke (Suntuche, literally, "fortunate" (<a onClick="return mV(\'Phl\',4,2);">Php 4:2</a>)): A Christian woman in the church at Philippi; She and Euodia, who had some quarrel or cause of difference between them, are mentioned by name by Paul, and are besought separately: "I beseech Euodia, and I beseech Syntyche" (the King James Version) to be reconciled to one another, to be "of the same mind in the Lord." The apostle also entreats an unnamed Christian at Philippi, whom he terms "true yokefellow," to "help these women, for they labored with me in the gospel." What he means is that he asks the true yokefellow to help Euodia and Syntyche, each of whom had labored with Paul.<P>This refers to the visit which he, in company with Silas and Luke and Timothy, paid to Philippi (<a onClick="return mV(\'Act\',16,12);">Ac 16:12</a>), and which resulted in the gospel being introduced to that city and the church being formed there. Euodia and Syntyche had been among the first converts and had proved helpful in carrying on the work. The word used for "labored" signifies "they joined with me in my struggle," and probably refers to something more than ordinary labor, for those were critical times of danger and suffering, which the apostle and his companions and fellow-workers then encountered at Philippi.<P>That workers so enthusiastic and so honored should have quarreled, was very sad. Paul, therefore, entreats them to be reconciled. Doubtless his request was given heed to, especially in view of his promised visit to Philippi.`<a href="./study/isbe/search.html?string=EUODIA">EUODIA</a>; <a href="./study/isbe/search.html?string=YOKE-FELLOW">YOKE-FELLOW</a>`155';
isbe[8547]='Synzygus`sin\'-zi-gus (sunzuge): In <a onClick="return mV(\'Phl\',4,3);">Php 4:3</a> it is rendered "yokefellow." WHm (Sunzuge), Thayer, Lex. New Testament, 594 (Suzuge), and others, take it as a proper name in this passage.view of his promised visit to Philippi.`<a href="./study/isbe/search.html?string=YOKE+FELLOW">YOKE-FELLOW</a>`1';
isbe[8548]='Syracuse`sir\'-a-kus, sir-a-kus\' (Surakousai; Latin Syracusae, Ital. Siracusa): Situated on the east coast of Sicily, about midway between Catania and the southeastern extremity of the island.<P>The design of the present work scarcely permits more than a passing allusion to Syracuse, the most brilliant Greek colony on the shores of the Western Mediterranean, where Paul halted three days, on his way from Melita to Rome (<a onClick="return mV(\'Act\',28,12);">Ac 28:12</a>). The original Corinthian colony rounded in 734 BC (Thucydides vi.3) was confined to the islet Ortygia, which separates the Great Harbor from the sea. Later the city spread over the promontory lying northward of Ortygia and the harbor.<P>Syracuse assumed a pre-eminent position in the affairs of Sicily under the rule of the tyrants Gelon (485-478 BC; compare Herodotus vii.154-55) and Hieron (478-467 BC). It nourisher greatly after the establishment of popular government in 466 BC (Diodorus xi.68-72). The Syracusans successfully withstood the famous siege by the Athenians in 414 BC, the narrative of which is the most thrilling part of the work of Thucydides (vi, vii).<P>Dionysius took advantage of the fear inspired by the Carthaginians to elevate himself to despotic power in 405 BC, and he was followed, after a reign of 38 years, by his son of the same name. Although democratic government was restored by Timoleon after a period of civil dissensions in 344 BC (Plutarch, Timoleon), popular rule was not of long duration.<P>The most famous of the later rulers was the wise Hieron (275-216 BC), who was the steady ally of the Romans. His grandson and successor Hieronymus deserted the alliance of Rome for that of Carthage, which led to the celebrated siege of the city by the Romans under Marcellus and its fall in 212 (Livy xxiv.21-33). Henceforth Syracuse was the capital of the Roman province of Sicily. Cicero calls it "the greatest of Greek cities and the most beautiful of all cities" (Cicero Verr. iv.52).``3';
isbe[8549]='Syria (1)`sir\'-i-a (Suria (<a onClick="return mV(\'Mat\',4,24);">Mt 4:24</a>; <a onClick="return mV(\'Luk\',2,2);">Lu 2:2</a>)):<P>1. Name and Its Origin<P>2. Other Designations<P>3. Physical<P class="in15">(1) The Maritime Plain<P class="in15">(2) First Mountain Belt<P class="in15">(3) Second Mountain Belt<P class="in15">(4) Great Central Valley<P class="in15">(5) The Eastern Belt<P class="in15">(6) Rivers<P class="in15">(7) Nature of Soil<P class="in15">(8) Flora<P class="in15">(9) Fauna<P class="in15">(10) Minerals<P class="in15">(11) Central Position<P>4. History<P class="in15">(1) Canaanitic Semites<P class="in15">(2) Sargon of Agade<P class="in15">(3) Babylonian Supremacy<P class="in15">(4) Hittite and Aramean<P class="in15">(5) Hittites and Egyptians<P class="in15">(6) Amarna Period<P class="in15">(7) Rameses II<P class="in15">(8) Philistines<P class="in15">(9) Tiglath-pileser I<P class="in15">(10) Aramean States<P class="in15">(11) Peaceful Development<P class="in15">(12) Shalmaneser II<P class="in15">(13) Tiglath-pileser III<P class="in15">(14) Shalmaneser IV and Sargon<P class="in15">(15) Pharaoh-necoh and Nebuchadnezzar<hr /><P>1. Name and Its Origin:<P>The name does not occur in the Massoretic Text nor the Peshitta of the Old Testament, but is found in the Septuagint, in the Peshitta of the New Testament and in the Mishna In the Septuagint it represents "Aram" in all its combinations, as Aram-zobah, etc. The name itself first appears in Herodotus vii.63, where he says that "Syrians" and "Assyrians" were the Greek and barbarian designations of the same people. Otherwise he is quite vague in his use of the term. Xenophon is clearer when he (Anab; vii.8, 25) distinguishes between Syria and Phoenicia. Syria is undoubtedly an extension of the name "Suri" the ancient Babylonian designation of a district in Northern Mesopotamia, but later embracing regions beyond the Euphrates to the north and west, as far as the Taurus. Under the Seleucids, Syria was regarded as coextensive with their kingdom, and the name shrank with its dimensions. Strabo, Pliny and Ptolemy give its boundaries as the Taurus Mountains, the Euphrates, the Syro-Arabian desert and the Mediterranean, and the territory within these limits is still politically designated Syria, though popularly Palestine is generally named separately.<P>2. Other Designations:<P>Homer (Iliad ii.785) and Hesiod (Theog. 304) call the inhabitants of the district "Arimoi," with which compare the cuneiform "Arimu" or "Aramu" for Arameans. The earliest Assyrian name was "Martu," which Hommel regards as a contraction of "Amartu," the land of the "Amurru" or Amorites. In Egyptian records the country is named "Ruten" or "Luten," and divided into "Lower" and "Upper," the former denoting Palestine and the latter Syria proper.<P>3. Physical:<P>(1) The Maritime Plain.<P>Syria, within the boundaries given, consists of a series of belts of low and high land running north and south, parallel to the Mediterranean. The first of these is the maritime plain. It consists of a broad strip of sand dunes covered by short grass and low bushes, followed by a series of low undulating hills and wide valleys which gradually rise to a height of about 500 ft. This belt begins in Northern Syria with the narrow Plain of Issus, which extends to a few miles south of Alxandretta, but farther south almost disappears, being represented only by the broader valleys and the smaller plains occupied by such towns as Latakia, Tripolis and Beirut. South of the last named the maritime belt is continuous, being interrupted only where the Ladder of Tyre and Mt. Carmel descend abruptly into the sea. In the Plain of Akka it has a breadth of 8 miles, and from Carmel southward it again broadens out, till beyond Caesarea it has an average of 10 miles. Within the sand dunes the soil is a rich alluvium and readily yields to cultivation. In ancient times it was covered with palm trees, which, being thence introduced into Greece, were from their place of origin named phoinikes.<P>(2) First Mountain Belt.<P>From the maritime plain we rise to the first mountain belt. It begins with the Amanus, a branch of the Taurus in the north. Under that name it ceases with the Orontes valley, but is continued in the Nuseiriyeh range (Mt. Cassius, 5,750 ft.), till the Eleutherus valley is reached, and thence rising again in Lebanon (average 5,000 ft.), Jebel Sunnin (8,780 ft.), it continues to the Leontes or Quasmiyeh. The range then breaks down into the rounded hills of Upper Galilee (3,500 ft.), extends through the table-land of Western Palestine (2,500 ft.), and in the south of Judea broadens out into the arid Badiet et-Tih or Wilderness of Wandering.<P>(3) Second Mountain Belt.<P>Along with this may be considered the parallel mountain range. Beginning in the neighborhood of Riblah, the chain of anti-Lebanon extends southward to Hermon (9,200 ft.), and thence stretches out into the plateau of the Jaulan and Hauran, where we meet with the truncated cones of extinct volcanoes and great sheets of basaltic lava, especially in el-Leja and Jebel ed-Druz. The same table-land continues southward, with deep ravines piercing its sides, over Gilead, Moab and Edom.<P>(4) Great Central Valley.<P>Between Lebanon and Anti-Lebanon lies the great valley of Coele-Syria. It is continued northward along the Orontes and thence stretches away eastward to the Euphrates, while southward it merges into the valleys of the Jordan and the Arabah. From the sources of the Orontes and Leontes at Baalbek (4,000 ft.) it falls away gently to the north; but to the south the descent is rapid. In Merj \'Ayun it has sunk to 1,800 ft., at Lake Huleh it is over 7 ft., at the Lake of Tiberias—682 ft., and at the Dead Sea—1,292 ft., and thence it rises again to the Gulf of Akabah. This great valley was caused by a line of fault or fracture of the earth\'s crust, with parallel and branching faults. In ancient times the whole valley formed an arm of the sea, and till the Glacial period at the end of the Tertiary (Pleistocene) Age, a lake extended along the whole Jordan valley as far as the Huleh. We can thus understand that the great plain and adjoining valleys consist mainly of alluvial deposits with terraces of gravel and sand on the enclosing slopes.<P>See <a href="./study/isbe/search.html?string=LEBANON">LEBANON</A>; <a href="./study/isbe/search.html?string=NATURAL+FEATURES">NATURAL FEATURES</a>; <a href="./study/isbe/search.html?string=PALESTINE">PALESTINE</A>; <a href="./study/isbe/search.html?string=PHOENICIA">PHOENICIA</A>.<P>(5) The Eastern Belt.<P>To the east of the Anti-Lebanon belt there is a narrow stretch of cultivated land which in some places attains a breadth of several miles, but this is always determined by the distance to which the eastern streams from Anti-Lebanon flow. Around Damascus the Abana (Barada) and neighboring streams have made the district an earthly paradise, but they soon lose themselves in the salt marshes about 10 miles east of the city. Elsewhere the fruitful strip gradually falls away into the sands and rocks of the Syrian desert, barren alike of vegetable and animal life.<P>(6) Rivers.<P>The mountain ranges determine the course of the rivers and their length. The streams flowing westward are naturally short and little more than summer torrents. Those flowing to the desert are of the same character, the only one of importance being the Abana, to which Damascus owes its existence. Only the great central valley permits the formation of larger rivers, and there we find the Orontes and Leontes rising within a few feet of each other beside Baalbek, and draining Coele-Syria to the north and south, till breaking through the mountains they reach the sea. The Jordan is the only other stream of any size. In ancient, as also in modern times, the direction of these streams determined the direction of the great trade route from Mesopotamia to Egypt through Coele-Syria and across pal, as also the position of the larger towns, but, not being themselves navigable, they did not form a means of internal communication.<P>(7) Nature of Soil.<P>The variation in altitude both above and below the sea-level is naturally conducive to a great variety of climate, while the nature of the disintegrating rocks and the alluvial soil render great productivity possible. Both of the mountain belts in their whole length consist chiefly of cretaceous limestone, mixed with friable limestone with basaltic intrusions and volcanic products. The limestone is highly porous, and during the rainy season absorbs the moisture which forms reservoirs and feeds the numerous springs on both the eastern and western slopes. The rocks too are soft and penetrable and can easily be turned into orchard land, a fact that explains how much that now appears as barren wastes was productive in ancient times as gardens and fruitful fields (Bab Talmud, Megh. 6a).<P>(8) Flora.<P>The western valleys and the maritime plain have the flora of the Mediterranean, but the eastern slopes and the valleys facing the desert are poorer. On the southern coasts and in the deeper valleys the vegetation is tropical, and there we meet with the date-palm, the sugar-cane and the sycomore. Up to 1,600 ft., the products include the carob and the pine, after which the vine, the fig and the olive are met with amid great plantations of dwarf oak, till after 3,000 ft. is reached, then cypresses and cedars till the height of 6,200 ft., after which only Alpine plants are found. The once renowned "cedars of Lebanon" now exist only in the Qadisha and Baruk valleys. The walnut and mulberry are plentiful everywhere, and wheat, corn, barley, maize and lentils are widely cultivated. Pasture lands are to be found in the valleys and plains, and even during the dry season sheep, goats and cattle can glean sufficient pasturage among the low brushwood.<P>(9) Fauna.<P>The animal world is almost as varied. The fox, jackal, hyena, bear, wolf and hog are met nearly everywhere, and small tigers are sometimes seen (compare <a onClick="return mV(\'2Ki\',14,9);">2Ki 14:9</a>). The eagle, vulture, partridge and blue pigeon are plentiful, and gay birds chirp everywhere. The fish in the Jordan and its lakes are peculiar and interesting. There are in all 22 varieties, the largest being a kind of perch, the coracinus, which is known elsewhere also in the Nile (Josephus, Ant, III, x, 8), and a peculiar old-world variety locally named \'Abu-musht.<P>(10) Minerals.<P>In both the eastern and the western mountain belts there are abundant supplies of mineral wealth. They consist chiefly of coal, iron, bitumen, asphalt and mineral oil, but they are mostly unworked. In the Jordan valley all the springs below the level of the Mediterranean are brackish, and many of them are also hot and sulfurous, the best known being those Tiberias.<P>(11) Central Position.<P>The country, being in virtue of its geographical configuration separated into small isolated districts, naturally tended to break up into a series of petty independent states. Still the central position between the Mesopotamian empires on the one hand and Egypt and Arabia on the other made it the highway through which the trade of the ancient world passed, gave it an importance far in excess of its size or productivity, and made it a subject of contention whenever East and West were ruled by different powers.<P>4. History:<P>(1) Canaanitic Semites.<P>When history begins for us in the 3rd millennium BC, Syria was already occupied by a Semitic population belonging to the Canaanitic wave of immigration, i.e. such as spoke dialects akin to Hebrew or Phoenician. The Semites had been already settled for a considerable time, for a millennium earlier in Egypt we find Semitic names for Syrian articles of commerce as well as Semites depicted on the Egyptian monuments.<P>(2) Sargon of Agade.<P>Omitting as doubtful references to earlier relations between Babylonia and Syria, we may consider ourselves on solid ground in accepting the statements of the Omen Tablets which tell us that Sargon of Agade (2750 BC) four times visited the land of Martu and made the peoples of one accord. His son Naram-sin, while extending the empire in other directions maintained his authority here also. Commercial relations were continued, and Babylonia claimed at least a supremacy over Martu, and at times made it effective.<P>(3) Babylonian Supremacy.<P>Hammurabi and also his great-grandson Ammisatana designate themselves in inscriptions as kings of Martu, and it is very likely that other kings maintained the traditional limits of the empire. The long-continued supremacy of Babylon not only made itself felt in imposing place-names, but it made Assyrian the language of diplomacy, even between Syria and Egypt, as we see in the Tell el-Amarna Letters.<P>(4) Hittite and Aramean.<P>By the middle of the 2nd millennium BC we find considerable change in the population. The Mitanni, a Hittite people, the remains of whose language are to be found in the still undeciphered inscriptions at Carchemish, Marash, Aleppo and Hamath, are now masters of Northern Syria.<P>See <a href="./study/isbe/search.html?string=HITTITES">HITTITES</A>.<P>The great discoveries of Dr. H. Winckler at Boghazkeui have furnished a most important contribution to our knowledge. The preliminary account may be found in OLZ, December 15,1906,and the Mitteilungen der deutschen orient. Gesellschaft, <span class="noTag">number 35</span>, December, 1907.<P>Elsewhere the Aramean wave has become the predominant Semitic element of population, the Canaanitic now occupying the coast towns (Phoenicians) and the Canaan of the Old Testament.<P>(5) Hittites and Egyptians.<P>At this time Babylonia was subject to the Kassites, an alien race of kings, and when they fell, about 1100 BC, they gave place to a number of dynasties of short duration. This gave the Egyptians, freed from the Hyksos rule, the opportunity to lay claim to Syria, and accordingly we find the struggle to be between the Hittites and the Egyptians. Thothmes I, about 1600 BCa overran Syria as far as the Euphrates and brought the country into subjection. Thothmes III did the same, and he has left us on the walls of Karnak an account of his campaigns and a list of the towns he conquered.<P>(6) Amarna Period.<P>In the reign of Thothmes IV the Hittites began to leave their mountains more and more and to press forward into Central Syria. The Tell el-Amarna Letters show them to be the most serious opponents to the Egyptian authority in Syria and Palestine during the reign of Amenhotep IV (circa 1380 BC), and before Seti I came to the throne the power of the Pharaohs had greatly diminished in Syria. Then the Egyptian sphere only reached to Carmel, while a neutral zone extended thence to Kadesh, northward of which all belonged to the Hitites.<P>(7) Rameses II.<P>Rameses II entered energetically into the war against Hatesar, king of the Hittites, and fought a battle near Kadesh. He claims a great victory, but the only result seems to have been that his authority was further extended into the neutral territory, and the sphere of Egyptian influence extended across Syria from the Lycus (Dog River) to the south of Damascus. The arrangement was confirmed by a treaty in which Northern Syria was formally recognized as the Hittite sphere of influence, and, on the part of the Assyrians who were soon to become the heirs of the Hittite pretensions, this treaty formed the basis of a claim against Egypt. About the year 1200 BC the Hittites, weakened by this war, were further encroached upon by the movements of northern races, and the empire broke up into a number of small separate independent states.<P>(8) Philistines.<P>Among the moving races that helped to weaken and break up the Hittite influence in Syria were the Pulusati (or Purusati), a people whose origin is not yet definitely settled. They entered Syria from the north and overcame all who met them, after which they encamped within the Egyptian sphere of influence. Rameses III marched against them, and he claims a great victory. Later, however, we find them settled in southeastern Palestine under the name of Philistines. Their settlement at that time is in harmony with the Tell el-Amarna Letters in which we find no trace of them, while in the 11th century BC they are there as the inveterate foes of Israel.<P>(9) Tiglath-pileser I.<P>Assyria was now slowly rising into power, but it had to settle with Babylon before it could do much in the West. Tiglath-pieser I, however, crossed the Euphrates, defeated the Hittite king of Carchemish, advanced to the coast of Arvad, hunted wild bulls in Lebanon and received gifts from the Pharaoh, who thus recognized him as the successor of the Hittites in Northern Syria.<P>(10) Aramean States.<P>When the Hittite empire broke up, the Arameans in Central Syria, now liberated, set up a number of separate Aramean states, which engaged in war with one another, except when they had to combine against a common enemy. Such states were established in Hamath, Hadrach, Zobah and Rehob. The exact position of Hadrach is still unknown, but Hamath was evidently met on its southern border by Rehob and Zobah, the former extending along the Biqa\'a to the foot of Hermon, while the latter stretched along the eastern slopes of Anti-Lebanon and included Damascus, till Rezon broke away and there set up an independent kingdom, which soon rose to be the leading state; southeast of Hermon were the two smaller Aramean states of Geshur and Maacah.<P>(11) Peaceful Development.<P>For nearly three centuries now, Syria and Palestine were, except on rare occasions, left in peace by both Mesopotamia and Egypt. In the 12th century BC Babylonia was wasted by the Elamite invasion, and thereafter a prolonged war was carried on between Assyria and Babylonia, and although a lengthened period of peace succeeded, it was wisely used by the peaceful rulers of Assyria for the strengthening of their kingdom internally. In Egypt the successors of Rameses III were engaged against the aggressive Theban hierarchy. During the XXIst Dynasty the throne was usurped by the high priests of Amen, while the XXIId were Lybian usurpers, and the three following dynasties Ethiopian conquerors.<P>(12) Shalmaneser II.<P>In the 9th century Asshur-nazirpal crossed the Euphrates and overran the recently established state of Patin in the Plain of Antioch. He besieged its capital and planted a colony in its territory, but the arrangement was not final, for his successor, Shalmaneser II, had again to invade the territory and break up the kingdom into a number of small principalities. Then in 854 BC he advanced into Central Syria, but was met at Karkar by a strong confederacy consisting of Ben-hadad of Damascus and his Syrian allies including Ahab of Israel. He claims a victory, but made no advance for 5 years. He then made three unsuccessful expeditions against Damascus, but in 842 received tribute from Tyre, Sidon and Jehu of Israel, as recorded and depicted on the Black Obelisk. It was not till the year 797 that Ramman-nirari, after subduing the coast of Phoenicia, was able to reduce Mari\'a of Damascus to obedience at which time also he seems to have carried his conquests through Eastern Palestine as far as Edom. The Assyrian power now suffered a period of decline, during which risings took place at Hadrach and Damascus, and Jeroboam II of Israel was able (<a onClick="return mV(\'2Ki\',14,25);">2Ki 14:25</a>) to extend his boundaries northward to the old limits.<P>(13) Tiglath-pileser III.<P>It thus happened that Tiglath-pileser III (745-728) had to reconquer the whole of Syria. He captured Arpad after two years\' warfare (742-740). Then he divided the territory of Hamath among his generals. At this juncture Ahaz of Judah implored his aid against Rezin of Damascus and Remaliah of Israel. Ahaz was relieved, but was made subject to Assyria. Damascus fell in 732 BC and a Great Court was held there, which the tributary princes of Syria, including Ahaz (<a onClick="return mV(\'2Ki\',16,10);">2Ki 16:10</a>), attended. The Assyrian empire now possessed the whole of Syria as far as the River of Egypt. Sibahe, however, encouraged revolt in what had been the Egyptian sphere of infiuence and insurrections took place in Phoenicia and Samaria.<P>(14) Shalmaneser IV and Sargon.<P>After some difficulty Shalmaneser IV compelled Tyre and Sidon to submit and to pay tribute. Samaria, too, was besieged, but was not taken till Sargon came to the throne in 722. Hamath and Carchemish again rose, but were finally reduced in 720 and 717 respectively. Again in 711 Sargon overran Palestine and broke up a fresh confederacy consisting of Egypt, Moab, Edom, Judah and the Philistines. In 705 the Egyptians under Sibahe and their allies the Philistines under Hanun of Gaza were defeated at Raphia.<P>The last three rulers of Assyria were in constant difficulties with Babylonia and a great part of the empire was also overrun by the Scythians (circa 626 BC), and so nothing further was done in the West save the annexation of the mainland possessions of Phoenicia.<P>(15) Pharaoh-necoh and Nebuchadnezzar.<P>In 609 when Assyria was in the death grapple with Babylonia, Pharaoh-necoh took advantage of the situation, invaded Syria, and, defeating Josiah en route, marched to Carchemish. In 605, however, he was there completely defeated by Nebuchadnezzar, and the whole of Syria became tributary to Babylonia. the former Syrian states now appear as Babylonian provinces, and revolts in Judah reduced it also to that position in 586 BC.<P>Under Persian rule these provinces remained as they were for a time, but ultimately "Ebir nari" or Syria was formed into a satrapy. The Greek conquest with the Ptolemies in Egypt and the Seleucids in Babylon brought back some of the old rivalry between East and West, and the same unsettled conditions. On the advent of Rome, Syria was separated from Babylonia and made into a province with Antioch as its capital, and then the Semitic civilization which had continued practically untouched till the beginning of the Christian era was brought more and more into contact with the West. With the advent of Islam, Syria fell into Arab hands and Damascus became for a short time (661-750 AD) the capital of the new empire, but the central authority was soon removed to Babylonia. Thenceforward Syria sank to the level of a province of the caliphate, first Abbasside (750-1258), then Fatimite (1258-1517), and finally Ottoman.``23';

isbe[8552]='Syriac Versions`1. Analogy of Latin Vulgate<P>2. The Designation "Peshito" ("Peshitta")<P>3. Syriac Old Testament<P>4. Syriac New Testament<P>5. Old Syriac Texts<P class="in15">(1) Curetonian<P class="in15">(2) Tatian\'s Diatessaron<P class="in15">(3) Sinaitic Syriac<P class="in15">(4) Relation to Peshito<P>6. Probable Origin of Peshito<P>7. History of Peshito<P>8. Other Translations<P class="in15">(1) The Philoxenian<P class="in15">(2) The Harclean<P class="in15">(3) The Jerusalem Syriac<P>LITERATURE<hr /><P>As in the account of the Latin versions it was convenient to start from Jerome\'s Vulgate, so the Syriac versions may be usefully approached from the Peshitta, which is the Syriac Vulgate (Jerome\'s Latin Bible, 390-405 A.D.)<P>1. Analogy of Latin Vulgate:<P>Not that we have any such full and clear knowledge of the circumstances under which the Peshitta was produced and came into circulation. Whereas the authorship of the Latin Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) has never been in dispute, almost every assertion regarding the authorship of the Peshitta, and the time and place of its origin, is subject to question. The chief ground of analogy between the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) and the Peshitta is that both came into existence as the result of a revision. This, indeed, has been strenuously denied, but since Dr. Hort in his Introduction to Westcott and Hort\'s New Testament in the Original Greek, following Griesbach and Hug at the beginning of the last century, maintained this view, it has gained many adherents. So far as the Gospels and other New Testament books are concerned, there is evidence in favor of this view which has been added to by recent discoveries; and fresh investigation in the field of Syriac scholarship has raised it to a high degree of probability. The very designation. "Peshito," has given rise to dispute. It has been applied to the Syriac as the version in common use, and regarded as equivalent to the Greek (koine) and the Latin Vulgate (Jerome\'s Latin Bible, 390-405 A.D.)<P>2. The Designation "Peshito" ("Peshitta"):<P>The word itself is a feminine form (peshitetha\'), meaning "simple," "easy to be understood." It seems to have been used to distinguish the version from others which are encumbered, with marks and signs in the nature of an apparatus criticus. However this may. be, the term as a designation of the version has not been found in any Syriac author earlier than the 9th or 10th century.<P>As regards the Old Testament, the antiquity of the Version is admitted on all hands. The tradition, however, that part of it was translated from Hebrew into Syriac for the benefit of Hiram in the days of Solomon is a myth. That a translation was made by a priest named Assa, or Ezra, whom the king of Assyria sent to Samaria, to instruct the Assyrian colonists mentioned in <a onClick="return mV(\'2Ki\',17,\'1-\');">2Ki 17</a>, is equally legendary. That the tr of the Old Testament and New Testament was made in connection with the visit of Thaddaeus to Abgar at Edessa belongs also to unreliable tradition. Mark has even been credited in ancient Syriac tradition with translating his own Gospel (written in Latin, according to this account) and the other books of the New Testament into Syriac<P>3. Syriac Old Testament:<P>But what Theodore of Mopsuestia says of the Old Testament is true of both: "These Scriptures were translated into the tongue of the Syrians by someone indeed at some time, but who on earth this was has not been made known down to our day" (Nestle in HDB, IV, 645b). Professor Burkitt has made it probable that the translation of the Old Testament was the work of Jews, of whom there was a colony in Edessa about the commencement of the Christian era (Early Eastern Christianity, 71ff). The older view was that the translators were Christians, and that the work was done late in the 1st century or early in the 2nd. The Old Testament known to the early Syrian church was substantially that of the Palestinian Jews. It contained the same number of books but it arranged them in a different order. First there was the Pentateuch, then Job, Joshua, Judgess, 1 and 2 Samuel, 1 and 2 Kings, 1 and 2 Chronicles, Psalms, Proverbs, Ecclesiastes, Ruth, Canticles, Esther, Ezra, Nehemiah, Isaiah followed by the Twelve Minor Prophets, Jeremiah and Lamentations, Ezekiel, and lastly Daniel. Most of the apocryphal books of the Old Testament are found in the Syriac, and the Book of Sirach is held to have been translated from the Hebrew and not from the Septuagint.<P>4. Syriac New Testament:<P>Of the New Testament, attempts at translation must have been made very early, and among the ancient versions of New Testament Scripture the Syriac in all likelihood is the earliest. It was at Antioch, the capital of Syria, that the disciples of Christ were first called Christians, and it seemed natural that the first translation of the Christian Scriptures should have been made there. The tendency of recent research, however, goes to show that Edessa, the literary capital, was more likely the place.<P>If we could accept the somewhat obscure statement of Eusebius (Historia Ecclesiastica, IV, xxii) that Hegesippus "made some quotations from the Gospel according to the Hebrews and from the Syriac Gospel," we should have a reference to a Syriac New Testament as early as 160-80 AD, the time of that Hebrew Christian writer. One thing is certain, that the earliest New Testament of the Syriac church lacked not only the Antilegomena—2 Peter, 2 and 3 John, Jude, and Revelation—but the whole of the Catholic Epistles and the Apocalypse. These were at a later date translated and received into the Syriac Canon of the New Testament, but the quotations of the early Syrian Fathers take no notice of these New Testament books.<P>From the 5th century, however, the Peshitta containing both Old Testament and New Testament has been used in its present form only as the national version of the Syriac Scriptures. The translation of the New Testament is careful, faithful and literal, and the simplicity, directness and transparency of the style are admired by all Syriac scholars and have earned for it the title of "Queen of the versions."<P>5. Old Syriac Texts:<P>It is in the Gospels, however, that the analogy between the Latin Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) and the Syriac Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) can be established by evidence. If the Peshitta is the result of a revision as the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) was, then we may expect to find Old Syriac texts answering to the Old Latin. Such texts have actually been found. Three such texts have been recovered, all showing divergences from the Peshitta, and believed by competent scholars to be anterior to it. These are, to take them in the order of their recovery in modern times, (1) the Curetonian Syriac, (2) the Syriac of Tatian\'s Diatessaron, and (3) the Sinaitic Syriac.<P>(1) Curetonian.<P>The Curetonian consists of fragments of the Gospels brought in 1842 from the Nitrian Desert in Egypt, and now in the British Museum. The fragments were examined by Canon Cureton of Westminster and edited by him in 1858. The manuscript from which the fragments have come appears to belong to the 5th century, but scholars believe the text itself to be as old as the 2nd century. In this recension the Gospel according to Matthew has the title Evangelion da-Mepharreshe, which will be explained in the next section.<P>(2) Tatian\'s "Diatessaron."<P>The Diatessaron of Tatian is the work which Eusebius ascribes to that heretic, calling it that "combination and collection of the Gospels, I know not how, to which he gave the title Diatessaron." It is the earliest harmony of the Four Gospels known to us. Its existence is amply attested in the church of Syria, but it had disappeared for centuries, and not a single copy of the Syriac work survives.<P>A commentary upon it by Ephraem the Syrian, surviving in an Armenian translation, was issued by the Mechitarist Fathers at Venice in 1836, and afterward translated into Latin. Since 1876 an Arabic translation of the Diatessaron itself has been discovered; and it has been ascertained that the Cod. Fuldensis of the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) represents the order and contents of the Diatessaron. A translation from the Arab can now be read in English in Dr. J. Hamlyn Hill\'s The Earliest Life of Christ Ever Compiled from the Four Gospels.<P>Although no copy of the Diatessaron has survived, the general features of Tatian\'s Syriac work can be gathered from these materials. It is still a matter of dispute whether Tatian composed his Harmony out of a Syriac version already made, or composed it first in Greek and then translated it into Syriac. But the existence and widespread use of a Harmony, combining in one all four Gospels, from such an early period (172 AD), enables us to understand the title Evangelion da-Mepharreshe It means "the Gospel of the Separated," and points to the existence of single Gospels, Matthew, Mark, Luke, John, in a Syriac translation, in contradistinction to Tatian\'s Harmony. Theodoret, bishop of Cyrrhus in the 5th century, tells how he found more than 200 copies of the Diatessaron held in honor in his diocese and how he collected them, and put them out of the way, associated as they were with the name of a heretic, and substituted for them the Gospels of the four evangelists in their separate forms.<P>(3) Sinaitic Syriac.<P>In 1892 the discovery of the 3rd text, known, from the place where it was found, as the Sin Syriac, comprising the four Gospels nearly entire, heightened the interest in the subject and increased the available material. It is a palimpsest, and was found in the monastery of Catherine on Mt. Sinai by Mrs. Agnes S. Lewis and her sister Mrs. Margaret D. Gibson. The text has been carefully examined and many scholars regard it as representing the earliest translation into Syriac, and reaching back into the 2nd century. Like the Curetonian, it is an example of the Evangelion da-Mepharreshe as distinguished from the Harmony of Tatian.<P>(4) Relation to Peshito.<P>The discovery of these texts has raised many questions which it may require further discovery and further investigation to answer satisfactorily. It is natural to ask what is the relation of these three texts to the Peshitta. There are still scholars, foremost of whom is G. H. Gwil-liam, the learned editor of the Oxford Peshito (Tetraevangelium sanctum, Clarendon Press, 1901), who maintain the priority of the Peshitta and insist upon its claim to be the earliest monument of Syrian Christianity. But the progress of investigation into Syriac Christian literature points distinctly the other way. From an exhaustive study of the quotations in the earliest Syriac Fathers, and, in particular, of the works of Ephraem Syrus, Professor Burkitt concludes that the Peshitta did not exist in the 4th century. He finds that Ephraem used the Diatessaron in the main as the source of his quotation, although "his voluminous writings contain some clear indications that he was aware of the existence of the separate Gospels, and he seems occasionally to have quoted from them (Evangelion da-Mepharreshe, 186). Such quotations as are found in other extant remains of Syriac literature before the 5th century bear a greater resemblance to the readings of the Curetonian and the Sinaitic than to the readings of the Peshitta. Internal and external evidence alike point to the later and revised character of the Peshitta<P>6. Probable Origin of Peshito:<P>How and where and by whom was the revision carried out? Dr. Hort, as we have seen, believed that the "revised" character of the Syriac Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) was a matter of certainty, and Dr. Westcott and he connected the authoritative revision which resulted in the Peshitta with their own theory, now widely adopted by textual critics, of a revision of the Greek text made at Antioch in the latter part of the 3rd century, or early in the 4th. The recent investigations of Professor Burkitt and other scholars have made it probable that the Peshitta was the work of Rabbula, bishop of Edessa, at the beginning of the 5th century. Of this revision, as of the revision which plays such an important part in the textual theory of Westcott and Hort, direct evidence is very scanty, in the former case altogether wanting. Dr. Burkitt, however, is able to quote words of Rabbula\'s biographer to the effect that "by the wisdom of God that was in him he translated the New Testament from Greek into Syriac because of its variations, exactly as it was." This may well be an account of the first publication of the Syriac Vulg, the Old Syriac texts then available having been brought by this revision into greater conformity with the Greek text current at Antioch in the beginning of the 5th century. And Rabbula was not content with the publication of his revision; he gave orders to the priests and the deacons to see that "in all the churches a copy of the Evangelion da-Mepharreshe shall be kept and read" (ib 161ff, 177f). It is very remarkable that before the time of Rabbula, who ruled over the Syr-speaking churches from 411 to 435, there is no trace of the Peshitta, and that after his time there is scarcely a vestige of any other text. He very likely acted in the manner of Theodoret somewhat later, pushing the newly made revision, which we have reason to suppose the Peshitta to have been, into prominence, and making short work of other texts, of which only the Curetonian and the Sinaitic are known to have survived to modern times.<P>7. History of Peshito:<P>The Peshitta had from the 5th century onward a wide circulation in the East, and was accepted and honored by all the numerous sects of the greatly divided Syriac Christianity. It had a great missionary influence, and the Armenian and Georgian VSS, as well as the Arabic and the Persian, owe not a little to the Syriac. The famous Nestorian tablet of Sing-an-fu witnesses to the presence of the Syriac Scriptures in the heart of China in the 7th century. It was first brought to the West by Moses of Mindin, a noted Syrian ecclesiastic, who sought a patron for the work of printing it in vain in Rome and Venice, but found one in the Imperial Chancellor at Vienna in 1555—Albert Widmanstadt. He undertook the printing of the New Testament, and the emperor bore the cost of the special types which had to be cast for its issue in Syriac. Immanuel Tremellius, the converted Jew whose scholarship was so valuable to the English reformers and divines, made use of it, and in 1569 issued a Syriac New Testament in Hebrew letters. In 1645 the editio princeps of the Old Testament was prepared by Gabriel Sionita for the Paris Polyglot, and in 1657 the whole Peshitta found a place in Walton s London Polyglot. For long the best edition of the Peshitta was that of John Leusden and Karl Schaaf, and it is still quoted under the symbol Syriac schaaf, or Syriac Sch. The critical edition of the Gospels recently issued by Mr. G. H. Gwilliam at the Clarendon Press is based upon some 50 manuscripts. Considering the revival of Syriac scholarship, and the large company of workers engaged in this field, we may expect further contributions of a similar character to a new and complete critical edition of the Peshitta<P>8. Other Translations:<P>(1) The Philoxenian.<P>Besides the Peshitta there are other translations which may briefly be mentioned. One of these is the Philoxenian, made by Philoxenus, bishop of Mabug (485-519) on the Euphrates, from the Greek, with the help of his Chorepiscopus Polycarp. The Psalms and portions of Isaiah are also found in this version; and it is interesting as having contained the Antilegomena—2 Peter, 2 and 3 John, and Jude.<P>(2) The Harclean.<P>Another is the Harclean, which is a revision of the Philoxenian, undertaken by Thomas of Harkel in Mesopotamia, and carried out by him at Alexandria about 616, with the help of Greek manuscripts exhibiting western reading. The Old Testament was undertaken at the same time by Paul of Tella. The New Testament contains the whole of the books, except Rev. It is very literal in its renderings, and is supplied with an elaborate system of asterisks and daggers to indicate the variants found in the manuscripts.<P>(3) The Jerusalem Syriac.<P>Mention may also be made of a Syriac version of the New Testament known as the Jerusalem or Palestinian Syriac, believed to be independent, and not derived genealogically from those already mentioned. It exists in a Lectionary of the Gospels in the Vatican, but two fresh manuscripts of the Lectionary have been found on Mt. Sinai by Dr. Rendel Harris and Mrs. Lewis, with fragments of Acts and the Pauline Epistles. The dialect employed deviates considerably from the ordinary Syriac, and the Greek text underlying it has many peculiarities. It alone of Syriac manuscripts has the pericope adulterae. In <a onClick="return mV(\'Mat\',27,17);">Mt 27:17</a> the robber is called Jesus Barabbas. Gregory describes 10 manuscripts (Textkritik, 523f).<P>LITERATURE.<P>Nestle, Syrische Uebersetzungen, PRE3, Syriac VSS, HDB, and Introduction to the Textual Criticism of the Greek New Testament, 95-106; G. H. Gwilliam, Studia Biblica, II,1890,III,1891,V,1903,and Tetraevangelium sanctum Syriacum; Scrivener, Intro4, 6-40; Burkitt, "Early Eastern Christianity," Texts and Studies, VII, 2:1-91, Evangelion da-Mepharreshe, I, II, and "Syr VSS," EB; Gregory, Textkritik, 479-528.``128';
isbe[8553]='Syrian; Language`sir\'-i-an (the King James Version <a href="./study/isbe/search.html?string=SYRIAC">SYRIAC</a>).`<a href="./study/isbe/search.html?string=SYRIAC+VERSIONS">SYRIAC VERSIONS</a>`1';
isbe[8554]='Syrians`sir\'-i-anz (\'aram; Suroi; Assyrian Aramu, Arumu, Arimu):<P>1. Division of Aram<P>2. A Semitic Race<P>3. Syria and Israel<P>4. Under Nabateans and Palmyrenes<P>5. A Mixed Race, Semitic Type<P>6. Religion<hr /><P>The terms "Syria" and "Syrians" are used in two senses in the Bible. In the Old Testament they are uniformly "Aram," "Aramaean," while in the New Testament they are used in a wider and more indefinite sense (<a onClick="return mV(\'Mat\',4,24);">Mt 4:24</a>; <a onClick="return mV(\'Act\',15,23);">Ac 15:23</a>; <a onClick="return mV(\'Act\',18,18);">18:18</a>; <a onClick="return mV(\'Gal\',1,21);">Ga 1:21</a>), and include all the dwellers of the land whether Arameans or not.<P>1. Division of Aram:<P>Aram was divided into several districts, comprising, in general, the region to the east of the Jordan, but extending in the north over most of Northern Syria, or from the Orontes eastward, and Northern Mesopotamia. This latter division was called Aram-naharaim—Aram of the two rivers, i.e. Tigris and Euphrates—and is the Nahrina of the Egyptian inscriptions. It is also called Paddan-aram in the Old Testament (<a onClick="return mV(\'Gen\',25,20);">Ge 25:20</a>) or field of Aram (<a onClick="return mV(\'Hsa\',12,12);">Ho 12:12</a>). The most important of the divisions of Aram in Old Testament times was Aram-dammesek, the Syria of Damascus, which sometimes dominated all of the other divisions lying to the south, such as Rehob, Tob, Zobah, and Mancab (<a onClick="return mV(\'2Sa\',10,8);">2Sa 10:8</a>). Geshur was in this region and should be reckoned as an Aramean dis-trict (<a onClick="return mV(\'2Sa\',15,8);">2Sa 15:8</a>).<P>2. A Semitic Race:<P>The Arameans were of Semitic stock and closely akin to the Hebrews. Aram is called a son of Shem (<a onClick="return mV(\'Gen\',10,22);">Ge 10:22</a>), which means a descendant, for we find him afterward called a grandson of Nahor, the brother of Abraham (<a onClick="return mV(\'Gen\',22,21);">Ge 22:21</a>). The Israelites were taught to say "A Syrian (Ara-maean) ready to perish was my father" (<a onClick="return mV(\'Deu\',26,5);">De 26:5</a>), and the kinship of the Hebrews and Arameans was further cemented by the marriage of Isaac with Rebekah, the sister of Laban the Syrian, and of Jacob with his daughters (<a onClick="return mV(\'Gen\',24,\'1-\');">Ge 24</a>; <a onClick="return mV(\'Gen\',29,\'1-\');">29</a>). The period when the Arameans first appeared in Syria is uncertain, but was probably later than 2000 BC. When Abraham came from Haran, Damascus was already occupied (<a onClick="return mV(\'Gen\',15,2);">Ge 15:2</a>), and this may have been the oldest settlement of the Arameans in Syria proper, although it is not mentioned on the monuments until long after, in the time of Thothmes III of Egypt, about 1479 BC. The Syrians were generally hostile to the Hebrews and had wars with them from the time of David onward. David subdued them, although they were aided by the tribes from beyond the Euphrates (<a onClick="return mV(\'2Sa\',10,\'1-\');">2Sa 10</a>), but after the division of the kingdom they often proved too strong for the northern Israelites.<P>3. Syria and Israel:<P>In the days of Omri the Syrians of Damascus brought them into subjection, but Ahab recovered all the lost territory and Damascus seems to have been subordinate for a time (<a onClick="return mV(\'1Ki\',20,34);">1Ki 20:34</a>). The king of Damascus afterward regained the supremacy, as appears from the Assyrian records, for in the war of Shalmaneser II with the peoples of Syria we find them led by Ben-hadad of Damascus and, among his subject allies, Ahab, who furnished 2,000 chariots and 10,000 men. Ben-hadad succeeded in uniting most of the petty kingdoms of Syria together in opposition to Assyria, but could not hold them, and they fell, one after another, as well as Damascus itself, into the hands of the great world-power. Jeroboam II recovered the districts that had been taken from Israel by the Syrians (<a onClick="return mV(\'2Ki\',14,25);">2Ki 14:25</a>), but this was only a temporary success, for Rezin extended his authority over all the East-Jordanic region as far as Elath on the Red Sea (<a onClick="return mV(\'2Ki\',16,6);">2Ki 16:6</a>), and he and Pekah joined in an attack upon Judah, but failed on account of the Assyrian advance (<a onClick="return mV(\'2Ki\',16,\'5-9\');">2Ki 16:5-9</a>). Damascus fell into the hands of Tiglath-pileser in 732 BC, and the power of the Syrians was completely broken.<P>4. Under Nabatheans and Palmyrenes:<P>The Aramaic peoples became prominent again under the Nabateans and Palmyrenes, both of whom were of this stock, as their language is clearly Aramaic. The former established a kingdom extending from the Euphrates to the Red Sea, their capital being Petra, and Damascus was under their control in the reign of their king Aretas (el-Harith) (<a onClick="return mV(\'2Cr\',11,32);">2Co 11:32</a>). This kingdom was absorbed by Rome in the reign of Trajan. The Palmyrenes did not come into prominence until the 3rd century AD, but became, for a short time, the leading power in Western Asia. In the weakness of Rome, under Gallienus, Odenathus and his still more distinguished wife, Zenobia, dominated all Syria, and the latter dared to dispute with Aurelian the empire of the East. With her fall in 272 AD the power of the Arameans was extinguished and never revived.<P>5. A Mixed Race, Semitic Type:<P>The Syrians in the broader sense have always been a mixed people, though of a prevailing Semitic type. The earliest layer of Semitic population was the Amorite which was found in Syria when the first Babylonian empire extended its authority over the land. Later appear the Canaanites, Phoenicians, Jebusites, Hivites and other tribes, all of which are classed together as descendants of Canaan in <a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10</a>, but their Semitic character in historic times is undoubted. The Hyksos who were driven from Egypt to Palestine and Syria were of the same race, as would appear from the Egyptian records. The Arameans formed the next wave of Semitic stock, but there were others, like the Hittites, who were not Semitic, and the Philistines, whose race affinity is doubtful. The Egyptians occupied the country for a long period, but did not contribute much to the population. Some of the tribes brought in by the Assyrians may have been non-Semitic, but most of them were evidently of cognate race (<a onClick="return mV(\'2Ki\',17,24);">2Ki 17:24</a>), and the racial characteristics of the Syrians were not changed. When Alexander and his successors brought in the Greek and Macedoninn elements there was a decided change in the city population, but little in the country districts, and although the Greeks had a powerful influence upon the civilization of the country the Semitic type overcame the admixture of Greek blood and prevailed in the country as a whole. The Romans ruled the country for centuries and established a number of military colonies, but they did not affect the population even as much as the Greeks. When, in the 7th century AD, the Mohammedan conquest swept over Syria, it brought in another great wave of pure Semitic stock with the numerous Arab settlers, who tended to obliterate any non-Semitic elements that might have existed. The effects of the influx of Europeans in the time of the Crusades were not sufficient to produce any marked change, and the same may be said of all later invasions of Turks and Kurds.<P>The Syrians, while thus a mixed people to a large extent, have maintained the Semitic type, but they have never, in all their history, been able to unite politically, and have always been divided, when independent. They have been, during the greater part of their history, under foreign domination, as they still are, under Turkish rule.<P>6. Religion:<P>The religion of the Syrians in ancient times was undoubtedly similar to that of the Babylonians, as is shown by the names of their gods. The Arameans worshipped Hadad and Rimmon (<a onClick="return mV(\'2Ki\',5,18);">2Ki 5:18</a>), sometimes joined as Hadadrimmon (<a onClick="return mV(\'Zec\',12,11);">Zec 12:11</a>). Baal, or Bel, Ashtoreth, or Ishtar, were almost universally worshipped, and Nebu, Agli-bol, Melakh-bol, Ati and other deities are found in the Palmyrene inscriptions, showing the Babylonian influence in their cult. This was to be expected from the known prevalence of Babylonian culture throughout Western Asia for centuries.``138';
isbe[8555]='Syrophoenician`si\'-ro-fe-nish\'-an, sir-o- (Surophoinissa, Surophoinikissa; Westcott and Hort, The New Testament in Greek has variant Sura Phoinikissa; the King James Version Syrophenician): The woman from the borders of Tyre and Sidon whose daughter Jesus healed is described as "a Greek, a Syrophoenician by race" (<a onClick="return mV(\'Mar\',7,26);">Mr 7:26</a>), and again as "a Canaanitish woman" (<a onClick="return mV(\'Mat\',15,22);">Mt 15:22</a>). This seems to mean that she was of Canaanite descent, a native of the Phoenician seaboard, Greek in religion, and probably also in speech. The names Syria and Phoenicia are both applied to the same region in <a onClick="return mV(\'Act\',21,2,3);">Ac 21:2,3</a>. Syrophoenician may therefore denote simply an inhabitant of these parts. According to Strabo (xvii.3), this district was called Syrophoenicia to distinguish it from the North African Lybophoenicia.``54';
isbe[8556]='Syrtis`sir\'-tis (surtis): the Revised Version (British and American) form for "quicksands" in <a onClick="return mV(\'Act\',27,17);">Ac 27:17</a>. These sandbanks, off the northern coast of Africa, have from early times been regarded as a source of danger to mariners. Virgil refers to them (Aen. iv.40f). In Paul\'s voyage, the ship, driven by a tempestuous wind, Euraquilo, was in peril of being cast-upon them.``1';
isbe[8557]='Syzygus`siz\'-i-gus.`<a href="./study/isbe/search.html?string=SYNZYGUS">SYNZYGUS</a>`1';
isbe[8558]='Taanach`ta\'-nak (ta\'anakh, or ta\'nakh; the Septuagint Tanach, with many variants): A royal city of the Canaanites, the king of which was slain by Joshua (<a onClick="return mV(\'Jos\',12,21);">12:21</a>). It was within the boundaries of the portion of Issachar, but was one of the cities reckoned to Manasseh (<a onClick="return mV(\'Jos\',17,11);">Jos 17:11</a>; <a onClick="return mV(\'1Ch\',7,29);">1Ch 7:29</a>), and assigned to the Kohathite Levites (<a onClick="return mV(\'Jos\',21,25);">Jos 21:25</a>). The Canaanites were not driven out; only at a later time they were set to taskwork (<a onClick="return mV(\'Jos\',17,12);">Jos 17:12</a>f; <a onClick="return mV(\'Jdg\',1,27);">Jud 1:27</a>f). Here the great battle was fought when the defeat of Sisera broke the power of the oppressor Jabin (<a onClick="return mV(\'Jdg\',5,19);">Jud 5:19</a>). It was in the administrative district of Baana ben Ahilud (<a onClick="return mV(\'1Ki\',4,12);">1Ki 4:12</a>). The name appears in the list of Thothmes III at Karnak; and Shishak records his plundering of Taanach when he invaded Palestine under Jeroboam I (compare <a onClick="return mV(\'1Ki\',14,25);">1Ki 14:25</a>f). Eusebius says in Onomasticon that it is a very large village, 3 miles from Legio. it is represented by the modern Ta\'annek, which stands on a hill at the southwestern edge of the plain of Esdraelon. Megiddo (Tell el-Mutesellim) lies 5 miles to the northwest. These two places are almost invariably named together. The great highway for traffic, commercial and military, from Babylon and Egypt, ran between them. They were therefore of high strategic importance. Excavations were recently conducted on the site by Professor Sellin, and a series of valuable and deeply interesting discoveries were made, shedding light upon the social and religious life and practices of the inhabitants down to the 1st century BC, through a period of nearly 2,000 years. The Canaanites were the earliest occupants. In accordance with Biblical history, "there is no evidence of a break or abrupt change in the civilization between the Canaanite and the Israelite occupation of Taanach; the excavations Show rather gradual development. The Canaanites will have gradually assimilated the Israelites drawn to them from the villages in the plain" (Driver, Schweich Lectures, 1908, 84). In the work just cited Driver gives an admirable summary of the results obtained by Professor Sellin. In his book on the Religion of Ancient Palestine, Professor Stanley A. Cook has shown, in short compass, what excellent use may be made of the results thus furnished.``54';
isbe[8559]='Taanach`ta\'-nak (ta\'anakh, or ta\'nakh; the Septuagint Tanach, with many variants): A royal city of the Canaanites, the king of which was slain by Joshua (<a onClick="return mV(\'Jos\',12,21);">12:21</a>). It was within the boundaries of the portion of Issachar, but was one of the cities reckoned to Manasseh (<a onClick="return mV(\'Jos\',17,11);">Jos 17:11</a>; <a onClick="return mV(\'1Ch\',7,29);">1Ch 7:29</a>), and assigned to the Kohathite Levites (<a onClick="return mV(\'Jos\',21,25);">Jos 21:25</a>). The Canaanites were not driven out; only at a later time they were set to taskwork (<a onClick="return mV(\'Jos\',17,12);">Jos 17:12</a>f; <a onClick="return mV(\'Jdg\',1,27);">Jud 1:27</a>f). Here the great battle was fought when the defeat of Sisera broke the power of the oppressor Jabin (<a onClick="return mV(\'Jdg\',5,19);">Jud 5:19</a>). It was in the administrative district of Baana ben Ahilud (<a onClick="return mV(\'1Ki\',4,12);">1Ki 4:12</a>). The name appears in the list of Thothmes III at Karnak; and Shishak records his plundering of Taanach when he invaded Palestine under Jeroboam I (compare <a onClick="return mV(\'1Ki\',14,25);">1Ki 14:25</a>f). Eusebius says in Onomasticon that it is a very large village, 3 miles from Legio. it is represented by the modern Ta\'annek, which stands on a hill at the southwestern edge of the plain of Esdraelon. Megiddo (Tell el-Mutesellim) lies 5 miles to the northwest. These two places are almost invariably named together. The great highway for traffic, commercial and military, from Babylon and Egypt, ran between them. They were therefore of high strategic importance. Excavations were recently conducted on the site by Professor Sellin, and a series of valuable and deeply interesting discoveries were made, shedding light upon the social and religious life and practices of the inhabitants down to the 1st century BC, through a period of nearly 2,000 years. The Canaanites were the earliest occupants. In accordance with Biblical history, "there is no evidence of a break or abrupt change in the civilization between the Canaanite and the Israelite occupation of Taanach; the excavations Show rather gradual development. The Canaanites will have gradually assimilated the Israelites drawn to them from the villages in the plain" (Driver, Schweich Lectures, 1908, 84). In the work just cited Driver gives an admirable summary of the results obtained by Professor Sellin. In his book on the Religion of Ancient Palestine, Professor Stanley A. Cook has shown, in short compass, what excellent use may be made of the results thus furnished.``54';
isbe[8560]='Taanath-Shiloh`ta\'-a-nath-shi\'-lo (ta\'-anath shiloh; Codex Vaticanus Thenasa kai Sellesa, Tenathselo): A town on the border of the territory of Ephraim named between Michmethath and Janoah (<a onClick="return mV(\'Jos\',16,6);">Jos 16:6</a>). According to Eusebius, Onomasticon (s.v. "Thena") it lay about 10 Roman miles east of Neapolis, on the road to the Jordan. Ptolemy speaks of Thena, probably the same place, as a town in Samaria (<a onClick="return mV(\'Jos\',16,5);">Jos 16:5</a>). It may be identified with Ta\'na, a village about 7 miles southeast of Nablus. Yanun, the ancient Janoah, lies 2 miles to the south. A Roman road from Neapolis to the Jordan valley passed this way. At Ta\'na there are "foundations, caves, cisterns and rockcut tombs" (PEFM, II, 245). This identification being quite satisfactory, the Talmudic notion that Taanath-shiloh was the same place as Shiloh may be dismissed (Jerusalem Talmud, Meghillah, i).``54';
isbe[8561]='Tabaoth, Tabbaoth`ta-ba\'-oth, tab\'-a-oth (tabba\'oth; Tabaoth, Taboth): The name of a family of temple-servants (1Esdras 5:29) = "Tabbaoth" (Hebrew: Tabba\'oth) of <a onClick="return mV(\'Ezr\',2,43);">Ezr 2:43</a>; <a onClick="return mV(\'Neh\',7,46);">Ne 7:46</a>; perhaps called after the name of a place.`<a href="./study/isbe/search.html?string=TABBATH">TABBATH</a>`1';
isbe[8562]='Tabbath`tab\'-ath (Tabbath; Codex Vaticanus Tabath; Gabath): A place named after Abel-meholah in the account of the Midianite flight before Gideon (<a onClick="return mV(\'Jdg\',7,23);">Jud 7:23</a>). It must therefore have been a place in the Jordan valley to the east of Beth-shan. No trace of the name has yet been recovered.``1';
isbe[8563]='Tabeel`ta\'-be-el: A name meaning "good is God," borne by two persons in the Old Testament (<a onClick="return mV(\'Isa\',7,6);">Isa 7:6</a>, the King James Version, "Tabeal").<P>(1) The father of the man whom the kings of Israel and Damascus planned to place upon the throne of Judah (<a onClick="return mV(\'Isa\',7,6);">Isa 7:6</a>). The form of the name Tabhe\'el, suggests that he was a Syrian; his son evidently was a tool of Rezin, king of Damascus. The name is vocalized so as to read Tebeal (Tabhe\'al), which might be translated "good for nothing," though some explain it as a pausal form, with the ordinary meaning. The change, probably due to a desire to express contempt, is very slight in Hebrew.<P>(2) A Persian official in Samaria (Tabhe\'el) (<a onClick="return mV(\'Ezr\',4,7);">Ezr 4:7</a>). All that is known of him is that he joined with other officials in sending a letter to Artaxerxes for the purpose of hindering the rebuilding of the walls of Jerusalem.``50';
isbe[8564]='Tabellius`ta-bel\'-i-us (Tabellios): One of the Persian officials in Samaria who wrote a letter to Artaxerxes which caused the rebuilding of Jerusalem to be stopped for a time (1Esdras 2:16) = "Tabeel" of <a onClick="return mV(\'Ezr\',4,7);">Ezr 4:7</a>.``1';
isbe[8565]='Taber`ta\'-ber (taphaph, "to strike a timbrel" (<a onClick="return mV(\'Psa\',68,25);">Ps 68:25</a>)): The word is used only once in the King James Version, namely, in the exceedingly graphic account of the capture of Nineveh given in <a onClick="return mV(\'Nah\',2,7);">Na 2:7</a>. The queen (perhaps the city personified) is dishonored and led into ignominious captivity, followed by a mourning retinue of "maids of honor" who taber upon, that is, beat violently, their breasts. Such drumming on the breasts was a gesture indicative of great grief (<a onClick="return mV(\'Luk\',18,3);">Lu 18:3</a>).``1';
isbe[8566]='Taberah`tab\'-e-ra, ta-be\'-ra (tabh\'erah, "burning"): A wilderness camp of the Israelites, the site of which is unidentified. Here, it is recorded, the people complained against Yahweh, who destroyed many of them by fire. This is the origin of the name (<a onClick="return mV(\'Num\',11,3);">Nu 11:3</a>; <a onClick="return mV(\'Deu\',9,22);">De 9:22</a>).``1';
isbe[8567]='Tabernacle of Testimony (Witness)`(<a onClick="return mV(\'Num\',9,15);">Nu 9:15</a>; <a onClick="return mV(\'2Ch\',24,6);">2Ch 24:6</a>, the Revised Version (British and American) "the tent of the testimony").`<a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>`1';
isbe[8568]='Tabernacle, A`tab\'-er-na-k\'l (\'ohel mo\'edh "tent of meeting," mishkan, "dwelling"; skene):<P><b>A. STRUCTURE AND HISTORY</b><P><b>I. INTRODUCTORY</b><P class="in15">1. Earlier "Tent of Meeting"<P class="in15">2. A Stage in Revelation<P class="in15">3. The Tabernacle Proper<P><b>II. STRUCTURE</b><P class="in15">1. The Enclosure or Court<P class="in15">2. Structure, Divisions and Furniture of the Tabernacle<P class="in30">(1) Coverings of the Tabernacle (<a onClick="return mV(\'Exd\',26,\'1-14\');">Exodus 26:1-14</a>; <a onClick="return mV(\'Exd\',36,\'8-19\');">36:8-19</a>)<P class="in45">(a) Tabernacle Covering Proper<P class="in45">(b) Tent Covering<P class="in45">(c) Protective Covering<P class="in30">(2) Framework and Divisions of the Tabernacle (<a onClick="return mV(\'Exd\',26,\'15-37\');">Exodus 26:15-37</a>; <a onClick="return mV(\'Exd\',36,\'20-38\');">36:20-38</a>)<P class="in45">Arrangement of Coverings<P class="in30">(3) Furniture of the Sanctuary<P class="in45">(a) The Table of Shewbread<P class="in45">(b) The Candlestick (Lampstand)<P class="in45">(c) The Altar of Incense<P><b>III. HISTORY</b><P class="in15">1. Removal from Sinai<P class="in15">2. Sojourn at Kadesh<P class="in15">3. Settlement in Canaan<P class="in15">4. Destruction of Shiloh<P class="in15">5. Delocalization of Worship<P class="in15">6. Nob and Gibeon<P class="in15">7. Restoration of the Ark<P class="in15">8. The Two Tabernacles<P><b>IV. SYMBOLISM</b><P class="in15">1. New Testament References<P class="in15">2. God\'s Dwelling with Man<P class="in15">3. Symbolism of Furniture<P><b>LITERATURE</b><hr /><P>I. Introductory.<P>Altars sacred to Yahweh were earlier than sacred buildings. Abraham built such detached altars at the Terebinth of Moreh (<a onClick="return mV(\'Gen\',12,6,7);">Ge 12:6,7</a>), and again between Beth-el and Ai (<a onClick="return mV(\'Gen\',12,8);">Ge 12:8</a>). Though he built altars in more places than one, his conception of God was already monotheistic. The "Judge of all the earth" (<a onClick="return mV(\'Gen\',18,25);">Ge 18:25</a>) was no tribal deity. This monotheistic ideal was embodied and proclaimed in the tabernacle and in the subsequent temples of which the tabernacle was the prototype.<P>1. Earlier "Tent of Meeting":<P>The first step toward a habitation for the Deity worshipped at the altar was taken at Sinai, when Moses builded not only "an altar under the mount," but "12 pillars, according to the 12 tribes of Israel" (<a onClick="return mV(\'Exd\',24,4);">Ex 24:4</a>). There is no recorded command to this effect, and there was as yet no separated priesthood, and sacrifices were offered by "young men of the children of Israel" (<a onClick="return mV(\'Exd\',24,5);">Ex 24:5</a>); but already the need of a separated structure was becoming evident. Later, but still at Sinai, after the sin of the golden calf, Moses is stated to have pitched "the tent" (as if well known: the tense is frequentative, "used to take the tent and to pitch it") "without the camp, afar off," and to have called it, "the tent of meeting," a term often met with afterward (<a onClick="return mV(\'Exd\',33,7);">Ex 33:7</a>). This "tent" was not yet the tabernacle proper, but served an interim purpose. The ark was not yet made; a priesthood was not yet appointed; it was "without the camp"; Joshua was the sole minister (<a onClick="return mV(\'Exd\',33,11);">Ex 33:11</a>). It was a simple place of revelation and of the meeting of the people with Yahweh (<a onClick="return mV(\'Exd\',33,7,\'9-11\');">Ex 33:7,9-11</a>). Critics, on the other hand, identifying this "tent" with that in <a onClick="return mV(\'Num\',11,16);">Nu 11:16</a>ff; <a onClick="return mV(\'Num\',11,16);">12:4ff; <a onClick="return mV(\'Deu\',31,14,15);">De 31:14,15</a> (ascribed to the Elohist source), regard it as the primitive tent of the wanderings, and on the ground of these differences from the tabernacle, described later (in the Priestly Code), deny the historicity of the latter. On this see below under B,4,(5).<P>2. A Stage in Revelation:<P>No doubt this localization of the shrine of Yahweh afforded occasion for a possible misconception of Yahweh as a tribal Deity. We must remember that here and throughout we have to do with the education of a people whose instincts and surroundings were by no means monotheistic. It was necessary that their education should begin with some sort of concession to existing ideas. They were not yet, nor for long afterward, capable of the conception of a God who dwelleth not in temples made with hands. So an altar and a tent were given them; but in the fact that this habitation of God was not fixed to one spot, but was removed from place to place in the nomad life of the Israelites, they had a persistent education leading them away from the idea of local and tribal deities.<P>3. The Tabernacle Proper:<P>The tabernacle proper is that of which the account is given in <a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25-27</a>; <a onClick="return mV(\'Exd\',30,\'1-\');">30-31</a>; <a onClick="return mV(\'Exd\',35,\'1-\');">35-40</a>, with additional details in <a onClick="return mV(\'Num\',3,25);">Nu 3:25</a>ff; <a onClick="return mV(\'Num\',4,4);">4:4</a>ff; <a onClick="return mV(\'Num\',7,1);">7:1</a>ff. The central idea of the structure is given in the words, "Make me a sanctuary, that I may dwell among them" (<a onClick="return mV(\'Exd\',25,8);">Ex 25:8</a>). It was the dwelling-place of the holy Yahweh in the midst of His people; also the place of His "meeting" with them (<a onClick="return mV(\'Exd\',25,22);">Ex 25:22</a>). The first of these ideas is expressed in the name mishkan; the second in the name \'ohel mo\'edh (it is a puzzling fact for the critics that in <a onClick="return mV(\'Exd\',25,1);">Ex 25-27:19</a> only mishkan is used; in <a onClick="return mV(\'Exd\',28,1);">Exodus 28-31</a> only \'ohel mo\'edh; in other sections the names intermingle). The tabernacle was built as became such a structure, according to the "pattern" shown to Moses in the mount (<a onClick="return mV(\'Exd\',25,9,40);">25:9,40</A>; <a onClick="return mV(\'Exd\',26,30);">26:30</A>; compare <a onClick="return mV(\'Act\',7,44);">Ac 7:44</a>; <a onClick="return mV(\'Hbr\',8,2,5);">Heb 8:2,5</a>). The modern critical school regards this whole description of the tabernacle as an "ideal" construction—a projection backward by post-exilian imagination of the ideas and dimensions of the Temple of Solomon, the measurements of the latter being throughout halved. Against this violent assumption, however, many things speak. See below under B.<P>II. Structure.<P>The ground plan of the Mosaic tabernacle (with its divisions, courts, furniture, etc.) can be made out with reasonable certainty. As respects the actual construction, knotty problems remain, in regard to which the most diverse opinions prevail. Doubt rests also on the precise measurement by cubits (see <a href="./study/isbe/search.html?string=CUBIT">CUBIT</A>; for a special theory, see W. S. Caldecott, The Tabernacle; Its History and Structure). For simplification the cubit is taken in this article as roughly equivalent to 18 inches.<P>A first weighty question relates to the shape of the tabernacle. The conventional and still customary conception (Keil, Bahr, A. R. S. Kennedy in HDB, etc.) represents it as an oblong, flat-roofed structure, the rich coverings, over the top, hanging down on either side and at the back—not unlike, to use a figure sometimes employed, a huge coffin with a pall thrown over it. Nothing could be less like a "tent," and the difficulty at once presents itself of how, in such a structure, "sagging" of the roof was to be prevented. Mr. J. Fergusson, in his article "Temple" in Smith\'s DB, accordingly, advanced the other conception that the structure was essentially that of a tent, with ridge-pole, sloping roof, and other appurtenances of such an erection. He plausibly, though not with entire success, sought to show how this construction answered accurately to the measurements and other requirements of the text (e.g. the mention of "pins of the tabernacle," <a onClick="return mV(\'Exd\',35,18);">Ex 35:18</a>). With slight modification this view here commends itself as having most in its favor.<P>To avoid the difficulty of the ordinary view, that the coverings, hanging down outside the framework, are unseen from within, except on the roof, it has sometimes been argued that the tapestry covering hung down, not outside, but inside the tabernacle (Keil, Bahr, etc.). It is generally felt that this arrangement is inadmissible. A newer and more ingenious theory is that propounded by A. R. S. Kennedy in his article "Tabernacle" in HDB. It is that the "boards" constituting the framework of the tabernacle were, not solid planks, but really open "frames," through which the finely wrought covering could be seen from within. There is much that is fascinating in this theory, if the initial assumption of the flat roof is granted, but it cannot be regarded as being yet satisfactorily made out. Professor Kennedy argues from the excessive weight of the solid "boards." It might be replied: In a purely "ideal" structure such as he supposes this to be, what does the weight matter? The "boards," however, need not have been so thick or heavy as he represents.<P>In the more minute details of construction yet greater diversity of opinion obtains, and imagination is often allowed a freedom of exercise incompatible with the sober descriptions of the text.<P>1. The Enclosure or Court:<P>The attempt at reconstruction of the tabernacle begins naturally with the "court" (chatser) or outer enclosure in which the tabernacle stood (see <a href="./study/isbe/search.html?string=COURT+OF+THE+SANCTUARY">COURT OF THE SANCTUARY</a>). The description is given in <a onClick="return mV(\'Exd\',27,\'9-18\');">Ex 27:9-18</a>; <a onClick="return mV(\'Exd\',38,\'9-20\');">38:9-20</a>. The court is to be conceived of as an enclosed space of 100 cubits (150 ft.) in length, and 50 cubits (75 ft.) in breadth, its sides formed (with special arrangement for the entrance) by "hangings" or curtains (qela\'im) of "fine twined linen," 5 cubits (7 1/2 ft.) in height, supported by pillars of brass (bronze) 5 cubits apart, to which the hangings were attached by "hooks" and "fillets" of silver. It thus censisted of two squares of 50 cubits each, in the anterior of which (the easterly) stood the "altar of burnt-offering" (see <a href="./study/isbe/search.html?string=ALTAR">ALTAR</a>), and the "layer" (see <a href="./study/isbe/search.html?string=LAVER">LAVER</a>), and in the posterior (the westerly) the tabernacle itself. From <a onClick="return mV(\'Exd\',30,\'17-21\');">Ex 30:17-21</a> we learn that the laver—a large (bronze) vessel for the ablutions of the priests—stood between the altar and the tabernacle (<a onClick="return mV(\'Exd\',30,18);">Ex 30:18</a>) The pillars were 60 in number, 20 being reckoned to the longer sides (north and south), and 10 each to the shorter (east and west). The pillars were set in "sockets" or bases (\'edhen) of brass (bronze), and had "capitals" (the King James Version and the English Revised Version "chapiters") overlaid with silver (<a onClick="return mV(\'Exd\',38,17);">Ex 38:17</a>). The "fillets" are here, as usually, regarded as silver rods connecting the pillars; some, however, as Ewald, Dillmann, Kennedy, take the "fillet" to be an ornamental band round the base of the capital. On the eastern side was the "gate" or entrance. This was formed by a "screen" (macakh) 20 cubits (30 ft.) in breadth, likewise of fine twined linen, but distinguished from the other (white) hangings by being embroidered in blue, and purple, and scarlet (see <a href="./study/isbe/search.html?string=EAST+GATE">EAST GATE</A>). The hangings on either side of the "gate" were 15 cubits in breadth. The 10 pillars of the east side are distributed—4 to the entrance screen, 3 on either side to the hangings. The enumeration creates some difficulty till it is remembered that in the reckoning round the court no pillar is counted twice, and that the corner pillars and those on either side of the entrance had each to do a double duty. The reckoning is really by the 5-cubit spaces between the pillars. Mention is made (<a onClick="return mV(\'Exd\',27,19);">Ex 27:19</a>; <a onClick="return mV(\'Exd\',38,20);">38:20</a>) of the "pins" of the court, as well as of the tabernacle, by means of which, in the former case, the pillars were held in place. These also were of brass (bronze).<P>2. Structure, Divisions and Furniture of the Tabernacle:<P>In the inner of the two squares of the court was reared the tabernacle—a rectangular oblong structure, 30 cubits (45 ft.) long and 10 cubits (15 ft.) broad, divided into two parts, a holy and a most holy (<a onClick="return mV(\'Exd\',26,33);">Ex 26:33</a>). Attention has to be given here<P>(1) to the coverings of the tabernacle,<P>(2) to its framework and divisions, and<P>(3) to its furniture.<P>(1) Coverings of the Tabernacle (<a onClick="return mV(\'Exd\',26,\'1-14\');">Exodus 26:1-14</a>; <a onClick="return mV(\'Exd\',36,\'8-19\');">36:8-19</a>).<P>The wooden framework of the tabernacle to be afterward described had 3 coverings—one, the immediate covering of the tabernacle or "dwelling," called by the same name, mishkan (<a onClick="return mV(\'Exd\',26,1,6);">Ex 26:1,6</a>); a second, the tent" covering of goats\' hair; and a third, a protective covering of rams\' and seal- (or porpoise-) skins, cast over the whole.<P>(a) Tabernacle Covering Proper:<P>The covering of the tabernacle proper (<a onClick="return mV(\'Exd\',26,\'1-6\');">Ex 26:1-6</a>) consisted of 10 curtains (yeri\'oth, literally, "breadth") of fine twined linen, beautifully-woven with blue, and purple, and scarlet, and with figures of cherubim. The 10 curtains, each 28 cubits long and 4 cubits broad, were joined together in sets of 5 to f
