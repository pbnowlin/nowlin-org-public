orm 2 large curtains, which again were fastened by 50 loops and clasps (the King James Version "taches") of gold, so as to make a single great curtain 40 cubits (60 ft.) long, and 28 cubits (42 ft.) broad.<P>(b) Tent Covering:<P>The "tent" covering (<a onClick="return mV(\'Exd\',26,\'7-13\');">Ex 26:7-13</a>) was formed by 11 curtains of goats hair, the length in this case being 30 cubits, and the breadth 4 cubits. These were joined in sets of 5 and 6 curtains, and as before the two divisions were coupled by 50 loops and clasps (this time of bronze), into one great curtain of 44 cubits (66 ft.) in length and 30 cubits (45 ft.) in breadth—an excess of 4 cubits in length and 2 in breadth over the fine tabernacle curtain.<P>(c) Protective Covering:<P>Finally, for purposes of protection, coverings were ordered to be made (<a onClick="return mV(\'Exd\',26,14);">Ex 26:14</a>) for the "tent" of rams\' skins dyed red, and of seal-skins or porpoise-skins (English Versions of the Bible, "badgers\' skins"). The arrangement of the coverings is considered below.<P>(2) Framework and Division of the Tabernacle (<a onClick="return mV(\'Exd\',26,\'15-37\');">Exodus 26:15-37</a>; <a onClick="return mV(\'Exd\',36,\'20-38\');">36:20-38</a>)<P>The framework of the tabernacle was, as ordinarily understood, composed of upright "boards" of acacia wood, forming 3 sides of the oblong structure, the front being closed by an embroidered screen," depending from 5 pillars (<a onClick="return mV(\'Exd\',26,36,37);">Ex 26:36,37</a>; see below). These boards, 48 in number (20 each for the north and south sides, and 8 for the west side), were 10 cubits (15 ft.) in height, and 1 1/2 cubits (2 ft. 3 in.) in breadth (the thickness is not given), and were overlaid with gold. They were set by means of "tenons" (literally, "hands"), or projections at the foot, 2 for each board, in 96 silver "sockets," or bases ("a talent for a socket," <a onClick="return mV(\'Exd\',38,27);">Ex 38:27</a>). In the boards were "rings" of gold, through which were passed 3 horizontal "bars," to hold the parts together—the middle bar, apparently, on the long sides, extending from end to end (<a onClick="return mV(\'Exd\',26,28);">Ex 26:28</a>), the upper and lower bars being divided in the center (5 bars in all on each side). The bars, like the boards, were overlaid with gold. Some obscurity rests on the arrangement at the back: 6 of the boards were of the usual breadth (= 9 cubits), but the 2 corner boards appear to have made up only a cubit between them (<a onClick="return mV(\'Exd\',26,\'22-24\');">Ex 26:22-24</a>). Notice has already been taken of theory (Kennedy, article "Tabernacle," HDB) that the so-called "boards" were not really such, but were open "frames," the 2 uprights of which, joined by crosspieces, are the "tenons" of the text. It seems unlikely, if this was meant, that it should not be more distinctly explained. The enclosure thus constructed was next divided into 2 apartments, separated by a "veil," which hung from 4 pillars overlaid with gold and resting in silver sockets. Like the tabernacle-covering, the veil was beautifully woven with blue, purple, and scarlet, and with figures of cherubim (<a onClick="return mV(\'Exd\',26,31,32);">Ex 26:31,32</a>; see <a href="./study/isbe/search.html?string=VEIL">VEIL</A>). The outer of these chambers, or holy place" was as usually computed, 20 cubits long by 10 broad; the inner, or most holy place, was 10 cubits square. The "door of the tent" (<a onClick="return mV(\'Exd\',26,36);">Ex 26:36</a>) was formed, as already stated, by a "screen," embroidered with the above colors, and depending from 5 pillars in bronze sockets. Here also the hooks were of gold, and the pillars and their capitals overlaid with gold (<a onClick="return mV(\'Exd\',36,38);">Ex 36:38</a>).<P>Arrangement of Coverings:<P>Preference has already been expressed for Mr. Fergusson\'s idea that the tabernacle was not flat-roofed, the curtains being cast over it like drapery, but was tentlike in shape, with ridge-pole, and a sloping roof, raising the total height to 15 cubits. Passing over the ridge pole, and descending at an angle, 14 cubits on either side, the inner curtain would extend 5 cubits beyond the walls of the tabernacle, making an awning of that width north and south, while the goats\'-hair covering above it, 2 cubits wider, would hang below it a cubit on either side. The whole would be held in position by ropes secured by bronze tent-pins to the ground (<a onClick="return mV(\'Exd\',27,19);">Ex 27:19</a>; <a onClick="return mV(\'Exd\',38,31);">38:31</a>). The scheme has obvious advantages in that it preserves the idea of a "tent," conforms to the principal measurements, removes the difficulty of "sagging" on the (flat) roof, and permits of the golden boards, bars and rings, on the outside, and of the finely wrought tapestry, on the inside, being seen (Professor Kennedy provides for the latter by his "frames," through which the curtain would be visible). On the other hand, it is not to be concealed that the construction proposed presents several serious difficulties. The silence of the text about a ridge-pole, supporting pillars, and other requisites of Mr. Fergusson\'s scheme (his suggestion that "the middle bar" of <a onClick="return mV(\'Exd\',26,28);">Ex 26:28</a> may be the ridge-pole is quite untenable), may be got over by assuming that these parts are taken for granted as understood in tent-construction. But this does not apply to other adjustments, especially those connected with the back and front of the tabernacle. It was seen above that the inner covering was 40 cubits in length, while the tabernacle-structure was 30 cubits. How is this excess of 10 cubits in the tapestry-covering dealt with? Mr. Fergusson, dividing equally, supposes a porch of 5 cubits at the front, and a space of 5 cubits also behind, with hypothetical pillars. The text, however, is explicit that the veil dividing the holy from the most holy place was hung "under the clasps" (<a onClick="return mV(\'Exd\',26,33);">Ex 26:33</a>), i.e. on this hypothesis, midway in the structure, or 15 cubits from either end. Either, then,<P>(1) the idea must be abandoned that the holy place was twice the length of the Holy of Holies (20 X 10; it is to be observed that the text does not state the proportions, which are inferred from those of Solomon\'s Temple), or<P>(2) Mr. Fergusson\'s arrangement must be given up, and the division of the curtain be moved back 5 cubits, depriving him of his curtain for the porch, and leaving 10 cubits to be disposed of in the rear. Another difficulty is connected with the porch itself. No clear indication of such a porch is given in the text, while the 5 pillars "for the screen" (<a onClick="return mV(\'Exd\',26,37);">Ex 26:37</a>) are most naturally taken to be, like the latter, at the immediate entrance of the tabernacle. Mr. Fergusson, on the other hand, finds it necessary to separate pillars and screen, and to place the pillars 5 cubits farther in front. He is right, however, in saying that the 5th pillar naturally suggests a ridge-pole; in his favor also is the fact that the extra breadth of the overlying tentcovering was to hang down, 2 cubits at the front, and 2 cubits at the back of the tabernacle (<a onClick="return mV(\'Exd\',26,9,12);">Ex 26:9,12</a>). It is possible that there was a special disposition of the inner curtain—that belonging peculiarly to the "dwelling"—"according to which its "clasps" lay above the "veil" of the Holy of Holies (20 cubits from the entrance), and its hinder folds closed the aperture at the rear which otherwise would have admitted light into the secrecy of the shrine. But constructions of this kind must ever remain more or less conjectural.<P>The measurements in the above reckoning are internal. Dr. Kennedy disputes this, but the analogy of the temple is against his view.<P>(3) Furniture of the Sanctuary<P>The furniture of the sanctuary is described in <a onClick="return mV(\'Exd\',25,\'10-40\');">Ex 25:10-40</a> (ark, table of shewbread, candlestick); <a onClick="return mV(\'Exd\',30,\'1-10\');">30:1-10</A> (altar of incense); compare <a onClick="return mV(\'Exd\',37,\'1-\');">Exodus 37</a> for making. In the innermost shrine, the Holy of Holies, the sole object was the ark of the covenant, overlaid within and without with pure gold, with its molding and rings of gold, its staves overlaid with gold passed through the rings, and its lid or covering of solid gold—the propitiatory or mercy-seat—at either end of which, of one piece with it (<a onClick="return mV(\'Exd\',25,19);">25:19</A>; <a onClick="return mV(\'Exd\',37,8);">37:8</a>), stood cherubim, with wings outstretched over the mercy-seat and with faces turned toward it (for details see <a href="./study/isbe/search.html?string=ARK+OF+THE+COVENANT">ARK OF THE COVENANT</a>; <a href="./study/isbe/search.html?string=MERCY-SEAT">MERCY-SEAT</a>; <a href="./study/isbe/search.html?string=CHERUBIM">CHERUBIM</a>). This was the meeting-place of Yahweh and His people through Moses (<a onClick="return mV(\'Exd\',25,22);">25:22</A>). The ark contained only the two tables of stone, hence its name "the ark of the testimony" (<a onClick="return mV(\'Exd\',25,16,22);">25:16,22</A>). It is not always realized how small an object the ark was—only 2 1/2 cubits (3 ft. 9 in.) long, 1 1/2 cubits (2 ft. 3 in.) broad, and the same (1 1/2 cubits) high.<P>The furniture of the outer chamber of the tabernacle consisted of<P>(a) the table of shewbread;<P>(b) the golden candlestick:<P>(c) the altar of incense, or golden altar.<P>These were placed, the table of shewbread on the north side (<a onClick="return mV(\'Exd\',40,22);">Ex 40:22</a>), the candlestick on the south side (<a onClick="return mV(\'Exd\',40,24);">Ex 40:24</a>), and the altar of incense in front of the veil, in the holy place.<P>(a) The Table of Shewbread:<P>The table of shewbread was a small table of acacia wood, overlaid with gold, with a golden rim round the top, gold rings at the corners of its 4 feet, staves for the rings, and a "border" (at middle?) joining the legs, holding them together. Its dimensions were 2 cubits (3 ft.) long, 1 cubit (18 inches) broad, and 1 1/2 cubits (2 ft. 3 inches) high. On it were placed 12 cakes, renewed each week, in 2 piles (compare <a onClick="return mV(\'Lev\',24,\'5-9\');">Le 24:5-9</a>), together with dishes (for the bread), spoons (incense cups), flagons and bowls (for drink offerings), all of pure gold.<P>See <a href="./study/isbe/search.html?string=SHEWBREAD,+TABLE+OF">SHEWBREAD, TABLE OF</a>.<P>(b) The Candlestick:<P>The candlestick or lampstand was the article on which most adornment was lavished. It was of pure gold, and consisted of a central stem (in <a onClick="return mV(\'Exd\',25,\'32-35\');">Ex 25:32-35</a> this specially receives the name "candlestick"), with 3 curved branches on either side, all elegantly wrought with cups of almond blossom, knops, and flowers (lilies?)—3 of this series to each branch and 4 to the central stem. Upon the 6 branches and the central stem were 7 lamps from which the light issued. Connected with the candlestick were snuffers and snuff-dishes for the wicks—all of gold. The candlestick was formed from a talent of pure gold (<a onClick="return mV(\'Exd\',25,38);">Ex 25:38</a>).<P>See <a href="./study/isbe/search.html?string=CANDLESTICK">CANDLESTICK</a>.<P>(c) The Altar of Incense:<P>The description of the altar of incense occurs (<a onClick="return mV(\'Exd\',30,\'1-10\');">Ex 30:1-10</a>) for some unexplained reason or displacement out of the place where it might be expected, but this is no reason for throwing doubt (with some) upon its existence. It was a small altar, overlaid with gold, a cubit (18 in.) square, and 2 cubits (3 ft.) high, with 4 horns. On it was burned sweet-smelling incense. It had the usual golden rim, golden rings, and gold-covered staves.<P>See <a href="./study/isbe/search.html?string=ALTAR+OF+INCENSE">ALTAR OF INCENSE</a>.<P>III. History.<P>1. Removal from Sinai:<P>We may fix 1220 BC as the approximate date of the introduction of the tabernacle. It was set up at Sinai on the 1st day of the 1st month of the 2nd year (<a onClick="return mV(\'Exd\',40,2,17);">Ex 40:2,17</a>), i.e. 14 days before the celebration of the Passover on the first anniversary of the exodus (see <a href="./study/isbe/search.html?string=CHRONOLOGY+OF+THE+OLD+TESTAMENT">CHRONOLOGY OF THE OLD TESTAMENT</a>, sec. VII, VIII). When the people resumed their journey, the ark was wrapped in the veil which had served to isolate the most holy place (<a onClick="return mV(\'Num\',4,5);">Nu 4:5</a>). This and the two altars were carried upon the shoulders of the children of Kohath, a descendant of Levi, and were removed under the personal supervision of the high priest (<a onClick="return mV(\'Num\',3,31,32);">Nu 3:31,32</a>; <a onClick="return mV(\'Num\',4,15);">4:15</a>). The rest of the dismembered structure was carried in six covered wagons, offered by the prince, each drawn by two oxen (<a onClick="return mV(\'Num\',7,\'1-\');">Nu 7</a>). Doubtless others were provided for the heavier materials (compare Keil). Before leaving Sinai the brazen altar had been dedicated, and utensils of gold and silver had been presented for use at the services. The tabernacle had been standing at Sinai during 50 days (<a onClick="return mV(\'Num\',10,11);">Nu 10:11</a>).<P>2. Sojourn at Kadesh:<P>The journey lay along the "great and terrible wilderness" between Horeb in the heart of Arabia and Kadesh-barnea in the Negeb of Judah; of the 40 years occupied in the journey to Canaan, nearly 38 were spent at Kadesh, a fact not always clearly recognized. The tabernacle stood here during 37 years (one year being occupied in a punitive journey southward to the shore of the Red Sea). During this whole time the ordinary sacrifices were not offered (<a onClick="return mV(\'Amo\',5,25);">Am 5:25</a>), though it is possible that the appropriate seasons were nevertheless marked in more than merely chronological fashion. Few incidents are recorded as to these years, and little mention is made of the tabernacle throughout the whole journey except that the ark of the covenant preceded the host when on the march (<a onClick="return mV(\'Num\',10,\'33-36\');">Nu 10:33-36</a>). It is the unusual that is recorded; the daily aspect of the tabernacle and the part it played in the life of the people were among the things recurrent and familiar.<P>3. Settlement in Canaan:<P>When, at last, the Jordan was crossed, the first consideration, presumably, was to find a place on which to pitch the sacred tent, a place hitherto uninhabited and free from possible defilement by human graves. Such a place was found in the neighborhood of Jericho, and came to be known as Gilgal (<a onClick="return mV(\'Jos\',4,19);">Jos 4:19</a>; <a onClick="return mV(\'Jos\',5,10);">5:10</a>; <a onClick="return mV(\'Jos\',9,6);">9:6</a>; <a onClick="return mV(\'Jos\',10,6,43);">10:6,43</a>). Gilgal, however, was always regarded as a temporary site. The tabernacle is not directly mentioned in connection with it. The question of a permanent location was the occasion of mutual jealousy among the tribes, and was at last settled by the removal of the tabernacle to Shiloh, in the territory of Ephraim, a place conveniently central for attendance of all adult males at the three yearly festivals, without the zone of war, and also of some strategic importance. During the lifetime of Joshua, therefore, the tabernacle was removed over the 20 miles, or less, which separated Shiloh among the hills from Gilgal in the lowlands (<a onClick="return mV(\'Jos\',18,1);">Jos 18:1</a>; <a onClick="return mV(\'Jos\',19,51);">19:51</a>). While at Shiloh it seems to have acquired some accessories of a more permanent kind (<a onClick="return mV(\'1Sa\',1,9);">1Sa 1:9</a>, etc.), which obtained for it the name "temple" (<a onClick="return mV(\'1Sa\',1,9);">1Sa 1:9</a>; <a onClick="return mV(\'1Sa\',3,3);">3:3</a>).<P>4. Destruction of Shiloh:<P>During the period of the Judges the nation lost the fervor of its earlier years and was in imminent danger of apostasy. The daily services of the tabernacle were doubtless observed after a perfunctory manner, but they seem to have had little effect upon the people, either to soften their manners or raise their morals. In the early days of Samuel war broke out afresh with the Philistines. At a council of war the unprecedented proposal was made to fetch the ark of the covenant from Shiloh (<a onClick="return mV(\'1Sa\',4,1);">1Sa 4:1</a>). Accompanied by the two sons of Eli—Hophni and Phinehas—it arrived in the camp and was welcomed by a shout which was heard in the hostile camp. It was no longer Yahweh but the material ark that was the hope of Israel, so low had the people fallen. Eli himself, at that time high priest, must at least have acquiesced in this superstition. It ended in disaster. The ark was taken by the Philistines, its two guardians were slain, and Israel was helpless before its enemies. Though the Hebrew historians are silent about what followed, it is certain that Shiloh itself fell into the hands of the Philistines. The very destruction of it accounts for the silence of the historians, for it would have been at the central sanctuary there, the center and home of what literary culture there was in Israel during this stormy period, that chronicles of events would be kept. <a onClick="return mV(\'Psa\',78,60);">Ps 78:60</a>ff no doubt has reference to this overthrow, and it is referred to in <a onClick="return mV(\'Jer\',7,12);">Jer 7:12</a>. The tabernacle itself does not seem to have been taken by the Philistines, as it is met with later at Nob.<P>5. Delocalization of Worship:<P>For lack of a high priest of character, Samuel himself seems now to have become the head of religious worship. It is possible that the tabernacle may have been again removed to Gilgal, as it was there that Samuel appointed Saul to meet him in order to offer burnt offerings and peace offerings. The ark, however, restored by the Philistines, remained at Kiriath-jearim (<a onClick="return mV(\'1Sa\',7,1,2);">1Sa 7:1,2</a>), while courts for ceremonial, civil, and criminal administration were held, not only at Gilgal, but at other places, as Beth-el, Mizpah and Ramah (<a onClick="return mV(\'1Sa\',7,\'15-17\');">1Sa 7:15-17</a>), places which acquired a quasi-ecclesiastical sanctity. This delocalization of the sanctuary was no doubt revolutionary, but it is partly explained by the fact that even in the tabernacle there was now no ark before which to burn incense. Of the half-dozen places bearing the name of Ramah, this, which was Samuel\'s home, was the one near to Hebron, where to this day the foundations of what may have been Samuel\'s sacred enclosure may be seen at the modern Ramet-el-Khalil.<P>6. Nob and Gibeon:<P>We next hear of the tabernacle at Nob, with Ahimelech, a tool of Saul (probably the Ahijah of <a onClick="return mV(\'1Sa\',14,3);">1Sa 14:3</a>), as high priest (<a onClick="return mV(\'1Sa\',21,1);">1Sa 21:1</a>). This Nob was 4 miles to the north of Jerusalem and was more-over a high place, 30 ft. higher than Zion. It does not follow that the tabernacle was placed at the top of the hill. Here it remained a few years, till after the massacre by Saul of all the priests at Nob save one, Abiathar (<a onClick="return mV(\'1Sa\',22,11);">1Sa 22:11</a>). Subsequently, possibly by Saul himself, it was removed to Gibeon (<a onClick="return mV(\'1Ch\',16,39);">1Ch 16:39</a>; <a onClick="return mV(\'1Ch\',21,29);">21:29</a>). Gibeon was 6 miles from Jerusalem, and 7 from Beth-el, and may have been chosen for its strategic advantage as well as for the fact that it was already inhabited by priests, and was Saul\'s ancestral city.<P>7. Restoration of the Ark:<P>This removal by Saul, if he was the author of it, was recognized afterward by David as a thing done, with which he did not think it wise to interfere (of <a onClick="return mV(\'1Ch\',16,40);">1Ch 16:40</a>). On his capturing the fortress of Jebus (later Jerusalem), and building himself a "house" there, David prepared a place for the ark of God, and pitched a tent on Zion in imitation of the tabernacle at Gibeon (<a onClick="return mV(\'2Sa\',6,17);">2Sa 6:17</a>ff; <a onClick="return mV(\'1Ch\',16,1);">1Ch 16:1</a>). He must also have provided an altar, for we read of burnt offerings and peace offerings being made there. Meanwhile the ark had been brought from Kiriath-jearim, where it had lain so long; it was restored in the presence of a concourse of people representing the whole nation, the soldiery and civilians delivering it to the priests (<a onClick="return mV(\'2Sa\',6,1);">2Sa 6:1</a>). On this journey Uzzah was smitten for touching the ark. Arrived near Jerusalem, the ark was carried into the house of Obed-edom, a Levite, and remained there for 3 months. At the end of this time it was carried into David\'s tabernacle with all fitting solemnity and honor.<P>8. The Two Tabernacles:<P>Hence, it was that there were now two tabernacles, the original one with its altar at Gibeon, and the new one with the original ark in Jerusalem, both under the protection of the king. Both, however, were soon to be superseded by the building of a temple. The altar at Gibeon continued in use till the time of Solomon. Of all the actual material of the tabernacle, the ark alone remained unchanged in the temple. The tabernacle itself, with its sacred vessels, was brought up to Jerusalem, and was preserved, apparently, as a sacred relic in the temple (<a onClick="return mV(\'1Ki\',8,4);">1Ki 8:4</a>). Thus, after a history of more than 200 years, the tabernacle ceases to appear in history.<P>IV. Symbolism.<P>Though the tabernacle was historically the predecessor of the later temples, as a matter of fact, the veil was the only item actually retained throughout the series of temples. Nevertheless it is the tabernacle rather than the temple which has provided a substructure for much New Testament teaching. All the well-known allusions of the writer to the Hebrews, e.g. in chapters 9 and 10, are to the tabernacle, rather than to any later temple.<P>1. New Testament References:<P>In general the tabernacle is the symbol of God\'s dwelling with His people (<a onClick="return mV(\'Exd\',25,8);">Ex 25:8</a>; compare <a onClick="return mV(\'1Ki\',8,27);">1Ki 8:27</a>), an idea in process of realization in more and more perfect forms till it reaches its completion in the carnation of the Word ("The Word became flesh, and dwelt (Greek "tabernacled") among us," <a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>; compare <a onClick="return mV(\'2Cr\',5,1);">2Co 5:1</a>), in the church collectively (<a onClick="return mV(\'2Cr\',6,16);">2Co 6:16</a>) and in the individual believer (<a onClick="return mV(\'1Cr\',6,19);">1Co 6:19</a>) and finally in the eternal glory (<a onClick="return mV(\'Rev\',2,13);">Re 2:13</a>). In the Epistle to the Hebrews, the locus classicus of the tabernacle in Christian thought, the idea is more cosmical—the tabernacle in its holy and most holy divisions representing the earthly and the heavenly spheres of Christ\'s activity. The Old Testament was but a shadow of the eternal substance, an indication of the true ideal (<a onClick="return mV(\'Hbr\',8,5);">Heb 8:5</a>; <a onClick="return mV(\'Hbr\',10,1);">10:1</a>). The tabernacle in which Christ ministered was a tabernacle which the Lord pitched, and not man (<a onClick="return mV(\'Hbr\',8,2);">Heb 8:2</a>). He is the high priest of "the greater and more perfect tabernacle" (<a onClick="return mV(\'Hbr\',9,11);">Heb 9:11</a>). "Christ entered not into a holy place made with hands, like in pattern to the true; but into heaven itself, now to appear before the face of God for us" (<a onClick="return mV(\'Hbr\',9,24);">Heb 9:24</a>). The symbolical significance of the tabernacle and its worship is not, however, confined to the Epistle to the Hebrews. It must be admitted that Paul. does not give prominence to the tabernacle symbolism, and further, that his references are to things common to the tabernacle and the temple. But Paul speaks of "the layer of regeneration" (<a onClick="return mV(\'Tts\',3,5);">Tit 3:5</a> the Revised Version margin), and of Christ, who "gave himself up for us, an offering and a sacrifice to God, for an odor of a sweet smell" (<a onClick="return mV(\'Eph\',5,2);">Eph 5:2</a>). The significance which the synoptic writers give to the rending of the veil of the temple (<a onClick="return mV(\'Mat\',27,51);">Mt 27:51</a>; <a onClick="return mV(\'Mar\',15,38);">Mr 15:38</a>; <a onClick="return mV(\'Luk\',23,45);">Lu 23:45</a>) shows how this symbolism entered deeply into their thought and was felt by them to have divine attestation in this supernatural fact. The way into the holiest of all, as the writer to the Hebrews says, was now made manifest (<a onClick="return mV(\'Hbr\',9,8);">9:8</a>; <a onClick="return mV(\'Hbr\',10,19,20);">10:19,20</A>).<P>2. God\'s Dwelling with Man:<P>The suggestion which underlies all such New Testament references is not only that Christ, in His human manifestation, was both tabernacle and priest, altar and sacrifice, but also, and still more, that God ever has His dwelling among men, veiled no doubt from the unbelieving and insincere, but always manifest and accessible to the faithful and devout. As we have a great high priest who is now passed into the heavens, there to appear in our behalf in the true tabernacle, so we ourselves have permission and encouragement to enter into the holiest place of all on earth by the blood of the everlasting covenant. Of the hopes embodied in these two planes of thought, the earthly tabernacle was the symbol, and contained the prospect and foretaste of the higher communion. It is this which has given the tabernacle such an abiding hold on the imagination and veneration of the Christian church in all lands and languages.<P>3. Symbolism of Furniture:<P>The symbolism of the various parts of the tabernacle furniture is tolerably obvious, and is considered under the different headings. The ark of the covenant with its propitiatory was the symbol of God\'s gracious meeting with His people on the ground of atonement (compare <a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>; see <a href="./study/isbe/search.html?string=ARK+OF+THE+COVENANT">ARK OF THE COVENANT</a>). The twelve cakes of shewbread denote the twelve tribes of Israel, and their presentation is at once an act of gratitude for that which is the support of life, and, symbolically, a dedication of the life thus supported; the candlestick speaks to the calling of Israel to be a people of light (compare Jesus in <a onClick="return mV(\'Mat\',5,\'14-16\');">Mt 5:14-16</a>); the rising incense symbolizes the act of prayer (compare <a onClick="return mV(\'Rev\',5,8);">Re 5:8</a>; <a onClick="return mV(\'Rev\',8,3);">8:3</a>).<P>LITERATURE.<P>See the articles on "Tabernacle" and "Temple" in Smith\'s DB, HDB, EB, The Temple BD, etc.; also the commentaries. on Exodus (the Speaker\'s Pulpit Commentary, Keil\'s, Lange\'s, etc.); Bahr, Symbolik d. Mosaischen Cult; Keil, Archaeology, I, 98ff (English translation); Westcott, essay on "The General Significance of the Tabernacle," in his Hebrews; Brown, The Tabernacle (1899); W. S. Caldecott, The Tabernacle: Its History and Structure. See the articles in this Encyclopedia on the special parts of the tabernacle.`<a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</a>`19';
isbe[8569]='Tabernacle, B`<b>B. IN CRITICISM</b><P><b>I. CONSERVATIVE AND CRITICAL VIEWS</b><P><b>II. ARGUMENTS IN SUPPORT OF THE CRITICAL THEORY EXAMINED</b><P class="in15">1. Not Stated, That the Temple Was Constructed after the Pattern of the Tabernacle<P class="in15">2. No Trace of the Tabernacle in Pre-Solomonic Times<P class="in15">3. The Tabernacle Could Not Have Been Built as Exodus Describes<P class="in15">4. Biblical Account Contains Marks of Its Unhistorical Character<P class="in15">5. Pre-exilic Prophets Knew Nothing of Levitical System of Which the Tabernacle Was Said to Be the Center.<P><b>LITERATURE</b><hr /><P>I. Conservative and Critical Views.<P>The conservative view of Scripture finds:<P>(1) that the tabernacle was constructed by Moses in the wilderness of Sinai;<P>(2) that it was fashioned according to a pattern shown to him in the Mount;<P>(3) that it was designed to be and was the center of sacrificial worship for the tribes in the wilderness; and<P>(4) that centuries later the Solomonic Temple was constructed after it as a model.<P>However, the critical (higher) view of Scripture says:<P>(1) that the tabernacle never existed except on paper;<P>(2) that it was a pure creation of priestly imagination sketched after or during the exile;<P>(3) that it was meant to be a miniature sanctuary on the model of Solomon\'s Temple;<P>(4) that it was represented as having been built in the wilderness for the purpose of legitimizing the newly-published Priestly Code (P) or Levitical ritual still preserved in the middle books of the Pentateuch; and<P>(5) that the description of the tabernacle furnished in the Priestly Code (P) (<a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25-31</a>; <a onClick="return mV(\'Exd\',36,\'1-\');">36-40; <a onClick="return mV(\'Num\',2,2,17);">Nu 2:2,17</a>; <a onClick="return mV(\'Num\',5,\'1-4\');">5:1-4</a>; <a onClick="return mV(\'Num\',14,44);">14:44</a>) conflicts with that given in the Elohist (E) (<a onClick="return mV(\'Exd\',33,\'7-11\');">Ex 33:7-11</a>), both as to its character and its location.<P>The principal grounds on which it is proposed to set aside the conservative viewpoint and put in its place the critical theory are these:<P>II. Arguments in Support of the Critical Theory Examined.<P>(1) It is nowhere stated that Solomon\'s Temple was constructed after the pattern of the Mosaic tabernacle; hence, it is reasonable to infer that the Mosaic tabernacle had no existence when or before the Solomonic Temple was built.<P>(2) No trace of the Mosaic tabernacle can be found in the pre-Solomonic period, from which it is clear that no such tabernacle existed.<P>(3) The Mosaic tabernacle could not have been produced as Exodus describes, and, accordingly, the story must be relegated to the limbo of romance.<P>(4) The Biblical account of the Mosaic tabernacle bears internal marks of its completely unhistorical character.<P>(5) The pre-exilic prophets knew nothing of the Levitical system of which the Mosaic tabernacle was the center, and hence, the whole story must be set down as a sacred legend.<P>These assertions demand examination:<P>1. Not Stated, That the Temple Was Constructed after the Pattern of the Tabernacle:<P>It is urged that nowhere is it stated that Solomon\'s Temple was fashioned after the pattern of the Mosaic tabernacle. Wellhausen thinks (GI, chapter i,3,p. 44) that, had it been so, the narrators in Kings and Chronicles would have said so. "At least," he writes, "one would have expected that in the report concerning the building of the new sanctuary, casual mention would have been made of the old." And so there was—in <a onClick="return mV(\'1Ki\',8,4);">1Ki 8:4</a> and <a onClick="return mV(\'2Ch\',5,5);">2Ch 5:5</a>. Of course, it is contended that "the tent of meeting" referred to in these passages was not the Mosaic tabernacle of <a onClick="return mV(\'Exd\',25,1);">Ex 25</a>, but simply a provisional shelter for the ark—though in P the Mosaic tabernacle bears the same designation (<a onClick="return mV(\'Exd\',27,21);">Ex 27:21</a>). Conceding, however, for the sake of argument, that the tent of the historical books was not the Mosaic tabernacle of Exodus, and that this is nowhere spoken of as the model on which Solomon\'s Temple was constructed, does it necessarily follow that because the narrators in Kings and Chronicles did not expressly state that Solomon\'s Temple was built after the pattern of the Mosaic tabernacle, therefore the Mosaic tabernacle had no existence when the narrators wrote? If it does, then the same logic will demonstrate the non-existence of Solomon\'s Temple before the exile, because when the writer of P was describing the Mosaic tabernacle he made no mention whatever about its being a miniature copy of Solomon\'s Temple. A reductio ad absurdum like this disposes of the first of the five pillars upon which the new theory rests.<P>2. No Trace of the Tabernacle in Pre-Solomonic Times<P>It is alleged that no trace of the Mosaic tabernacle can be found in pre-Solomonic times. On the principle that silence about a person, thing or event does not prove the non-existence of the person or thing or the non-occurrence of the event, this 2nd argument might fairly be laid aside as irrelevant. Yet it will be more satisfactory to ask, if the assertion be true, why no trace of the tabernacle can be detected in the historical books in pre-Solomonic times. The answer is, that of course it is true, if the historical books be first "doctored," i.e. gone over and dressed to suit theory, by removing from them every passage, sentence, clause and word that seems to indicate, presuppose or imply the existence of the tabernacle, and such passage, sentence, clause and word assigned to a late R who inserted it into the original text to give color to his theory, and support to his fiction that the Mosaic tabernacle and its services originated in the wilderness. Could this theory be established on independent grounds, i.e. by evidence derived from other historical documents, without tampering with the sacred narrative, something might be said for its plausibility. But every scholar knows that not a particle of evidence has ever been, or is likely ever to be, adduced in its support beyond what critics themselves manufacture in the way described. That they do find traces of the Mosaic tabernacle in the historical books, they unconsciously and unintentionally allow by their efforts to explain such traces away, which moreover they can only do by denouncing these traces as spurious and subjecting them to a sort of surgical operation in order to excise them from the body of the text. But these so-called spurious traces are either true or they are not true. If they are true, whoever inserted them, then they attest the existence of the tabernacle, first at Shiloh, and afterward at Nob, later at Gibeon, and finally at Jerusalem; if they are not true, then some other things in the narrative must be written down as imagination, as, e.g. the conquest of the land, and its division among the tribes, the story of the altar on the east of Jordan, the ministry of the youthful Samuel at Shiloh, and of Ahimelech at Nob.<P>(1) The Mosaic Tabernacle at Shiloh.<P>That the structure at Shiloh (<a onClick="return mV(\'1Sa\',1,3,9,19,24);">1Sa 1:3,9,19,24</a>; <a onClick="return mV(\'1Sa\',2,11,12);">2:11,12</a>; <a onClick="return mV(\'1Sa\',3,3);">3:3</a>) was the Mosaic tabernacle everything recorded about it shows. It contained the ark of God, called also the ark of the covenant of God and the ark of the covenant of Yahweh, or more fully the ark of the covenant of Yahweh of Hosts, names, especially the last, which for the ark associated with the tabernacle were not unknown in the period of the wandering. It had likewise a priesthood and a sacrificial worship of three parts—offering sacrifice (in the forecourt), burning incense (in the holy place), and wearing an ephod (in the Holy of Holies)—which at least bore a close resemblance to the cult of the tabernacle, and in point of fact claimed to have been handed down from Aaron. Then Elkanah\'s pious custom of going up yearly from Ramathaim-zophim to Shiloh to worship and to sacrifice unto Yahweh of Hosts suggests that in his day Shiloh was regarded as the central high place and that the law of the three yearly feasts (<a onClick="return mV(\'Exd\',23,14);">Ex 23:14</a>; <a onClick="return mV(\'Lev\',23,\'1-18\');">Le 23:1-18</a>; <a onClick="return mV(\'Deu\',16,16);">De 16:16</a>) was not unknown, though perhaps only partially observed; while the statement about "the women who did service at the door of the tent of meeting" as clearly points back to the similar female institution in connection with the tabernacle (<a onClick="return mV(\'Exd\',38,8);">Ex 38:8</a>). To these considerations it is objected (a) that the Shiloh sanctuary was not the Mosaic tabernacle, which was a portable tent, but a solid structure with posts and doors, and<P>(b) that even if it was not a solid structure but a tent, it could be left at any moment without the ark, in which case it could not have been the Mosaic tabernacle of which the ark was an "inseparable companion"; while<P>(c) if it was the ancient "dwelling" of Yahweh, it could not have been made the dormitory of Samuel.<P>But<P>(a) while it need not be denied that the Shiloh sanctuary possessed posts and doors—<a onClick="return mV(\'Jer\',7,12);">Jer 7:12</a> seems to admit that it was a structure which might be laid in ruins—yet this does not warrant the conclusion that the Mosaic tabernacle had no existence in Shiloh. It is surely not impossible or even improbable that, when the tabernacle had obtained a permanent location at Shiloh, and that for nearly 400 years (compare above under A, III,1,8 and see <a href="./study/isbe/search.html?string=CHRONOLOGY+OF+THE+OLD+TESTAMENT">CHRONOLOGY OF THE OLD TESTAMENT</a>, VII, VIII), during the course of these centuries a porch with posts and doors may have been erected before the curtain that formed the entrance to the holy place, or that strong buildings may have been put up around it as houses for the priests and Levites, as treasure-chambers, and such like—thus causing it to present the appearance of a palace or house with the tabernacle proper in its interior. Then<P>(b) as to the impossibility of the ark being taken from the tabernacle, as was done when it was captured by the Philistines, there is no doubt that there were occasions when it was not only legitimate, but expressly commanded to separate the ark from the tabernacle, though the war with the Philistines was not one. In <a onClick="return mV(\'Num\',10,33);">Nu 10:33</a>, it is distinctly stated that the ark, by itself, went before the people when they marched through the wilderness; and there is ground for thinking that during the Benjamite war the ark was with divine sanction temporarily removed from Shiloh to Beth-el (<a onClick="return mV(\'Jdg\',20,26,27);">Jud 20:26,27</a>) and, when the campaign closed, brought back again to Shiloh (<a onClick="return mV(\'Jdg\',21,12);">Jud 21:12</a>).<P>(c) As for the notion that the Shiloh sanctuary could not have been the Mosaic tabernacle because Samuel is said to have slept in it beside the ark of God, it should be enough to reply that the narrative does not say or imply that Samuel had converted either the holy place or the most holy into a private bedchamber, but merely that he lay down to sleep "in the temple of the Lord where the ark of God was," doubtless "in the court where cells were built for the priests and Levites to live in when serving at the sanctuary" (Keil). But even if it did mean that the youthful Samuel actually slept in the Holy of Holies, one fails to see how an abuse like that may not have occurred in a time so degenerate as that of Eli, or how, if it did, it would necessarily prove that the Shiloh shrine was not the Mosaic tabernacle.<P>(2) The Mosaic Tabernacle at Nob.<P>That the sanctuary at Nob (<a onClick="return mV(\'1Sa\',21,\'1-6\');">1Sa 21:1-6</a>) was the Mosaic tabernacle may be inferred from the following circumstances:<P>(a) that it had a high priest with 85 ordinary priests, a priest\'s ephod, and a table of shewbread;<P>(b) that the eating of the shewbread was conditioned by the same law of ceremonial purity as prevailed in connection with the Mosaic tabernacle (<a onClick="return mV(\'Lev\',15,18);">Le 15:18</a>); and<P>(c) that the Urim was employed there by the priest to ascertain the divine will—all of which circumstances pertained to the Mosaic tabernacle and to no other institution known among the Hebrews.<P>If the statement (<a onClick="return mV(\'1Ch\',13,3);">1Ch 13:3</a>) that the ark was not inquired at in the days of Saul calls for explanation, that explanation is obviously this, that during Saul\'s reign the ark was dissociated from the tabernacle, being lodged in the house of Abinadab at Kiriath-jearim, and was accordingly in large measure forgotten. The statement (<a onClick="return mV(\'1Sa\',14,18);">1Sa 14:18</a>) that Saul in his war with the Philistines commanded Ahijah, Eli\'s great-grandson, who was "the priest of the Lord in Shiloh, wearing an ephod" (<a onClick="return mV(\'1Sa\',14,3);">1Sa 14:3</a>) to fetch up the ark—if <a onClick="return mV(\'1Sa\',14,18);">1Sa 14:18</a> should not rather be read according to the Septuagint, "Bring hither the ephod"—can only signify that on this particular occasion it was fetched from Kiriath-jearim at the end of 20 years and afterward returned thither. This, however, is not a likely supposition; and for the Septuagint reading it can be said that the phrase "Bring hither" was never used in connection with the ark; that the ark was never employed for ascertaining the Divine Will, but the ephod was; and that the Hebrew text in <a onClick="return mV(\'1Sa\',14,18);">1Sa 14:18</a> seems corrupt, the last clause reading "for the ark of God was at that day and the sons of Israel," which is not extremely intelligible.<P>(3) The Mosaic Tabernacle at Gibeon.<P>The last mention of the Mosaic tabernacle occurs in connection with the building of Solomon\'s Temple (<a onClick="return mV(\'1Ki\',8,4);">1Ki 8:4</a>; <a onClick="return mV(\'2Ch\',1,3);">2Ch 1:3</a>; <a onClick="return mV(\'2Ch\',5,3);">5:3</a>), when it is stated that the ark of the covenant and the tent of meeting, and all the holy vessels that were in the tent were solemnly fetched up into the house which Solomon had built. That what is here called the tabernacle of the congregation, or the tent of meeting, was not the Mosaic tabernacle has been maintained on the following grounds:<P>(a) that had it been so, David, when he fetched up the ark from Obed-edom\'s house, would not have pitched for it a tent in the city of David, but would have lodged it in Gibeon;<P>(b) that had the Gibeon shrine been the Mosaic tabernacle it would not have been called as it is in Kings, "a great high place";<P>(c) that had the Gibeon shrine been the Mosaic tabernacle, Solomon would not have required to cast new vessels for his Temple, as he is reported to have done; and<P>(d) that had the Gibeon shrine been the Mosaic tabernacle the brazen altar would not have been left behind at Gibeon but would also have been conveyed to Mt. Moriah.<P>But<P>(a) if it was foolish and wrong for David not to lodge the ark in Gibeon, that would not make it certain that the Mosaic tabernacle was not at Gibeon. That it was either foolish or wrong, however, is not clear. David may have reckoned that if the house of Obed-edom had derived special blessing from the presence of the ark in it for three months, possibly it would be for the benefit of his (David\'s) house and kingdom to have the ark permanently in his capital. And in addition, David may have remembered that God had determined to choose out a place for His ark, and in answer to prayer David may have been directed to fetch the ark to Jerusalem. As good a supposition this, at any rate, as that of the critics.<P>(b) That the Gibeon shrine should have been styled "the great high place" (<a onClick="return mV(\'1Ki\',3,4);">1Ki 3:4</a>) is hardly astonishing, when one calls to mind that it was the central sanctuary, as being the seat of the Mosaic tabernacle with its brazen altar. And may not the designation "high place," or bamah, have been affixed to it just because, through want of its altar, it had dwindled down into a mere shadow of the true sanctuary and become similar to the other "high places" or bamoth?<P>(c) The casting of new vessels for Solomon\'s Temple needs no other explanation than this, that the new house was at least twice as spacious as the old, and that in any case it was fitting that the new house should have new furniture.<P>(d) That the brazen altar would not have been left behind at Gibeon when the Mosaic tabernacle was removed, may be met by the demand for proof that it was actually left behind. That it was left behind is a pure conjecture. That it was transplanted to Jerusalem and along with the other tabernacle utensils laid up in a side chamber of the temple is as likely an assumption as any other (see <a onClick="return mV(\'1Ki\',8,4);">1Ki 8:4</a>).<P>3. The Tabernacle Could Not Have Been Built as Exodus Describes<P>It is maintained that the Mosaic tabernacle could not have been produced as Exodus describes:<P>(1) that the time was too short,<P>(2) that the Israelites were too little qualified, and<P>(3) that the materials at their disposal were too scanty for the construction of so splendid a building as the Mosaic tabernacle.<P>But<P>(1) does any intelligent person believe that 9 months was too short a time for 600,000 able-bodied men, to say nothing of their women and children, to build a wooden house 30 cubits long, 10 high and 10 broad, with not as many articles in it as a well-to-do artisan\'s kitchen oftentimes contains?<P>(2) Is it at all likely that they were so ill-qualified for the work as the objection asserts? The notion that the Israelites were a horde of savages or simply a tribe of wandering nomads does not accord with fact. They had been bond-men, it is true, in the land of Ham; but they and their fathers had lived there for 400 years; and it is simply incredible, as even Knobel puts it, that they should not have learnt something of the mechanical articles One would rather be disposed to hold that they must have had among them at the date of the Exodus a considerable number of skilled artisans. At least, archaeology has shown that if the escaped bondsmen knew nothing of the arts and sciences, it was not because their quondam masters had not been able to instruct them. The monuments offer silent witness that every art required by the manufacturers existed at the moment in Egypt, as e.g. the arts of metal-working, wood-carving, leather-making, weaving and spinning. And surely no one will contend that the magnificent works of art, the temples and tombs, palaces and pyramids, that are the world\'s wonder today, were the production always and exclusively of native Egyptian and never of Hebrew thought and labor! Nor<P>(3) is the reasoning good, that whatever the Israelites might have been able to do in Egypt where abundant materials lay to hand, they were little likely to excel in handicrafts of any sort in a wilderness where such materials were wanting.<P>Even Knobel could reply to this, that as the Israelites when they escaped from Egypt were not a horde of savages, so neither were they a tribe of beggars; that they had not entered on their expedition in the wilderness without preparation, or without taking with them their most valuable articles; that the quantities of gold, silver and precious stones employed in the building of the tabernacle were but trifles in comparison with other quantities of the same that have been found in possession of ancient oriental peoples; that a large portion of what was contributed had probably been obtained by despoiling the Egyptians before escaping from their toils and plundering the Amalekites whom they soon after defeated at Rephidim, and who, in all likelihood, at least if one may judge from the subsequent example of the Midianites, had come to the field of war bedecked with jewels and gold; and that the acacia wood, the linen, the blue, the purple and the scarlet, with the goats\' skins, rams\' skins, and seal skins might all have been found and prepared in the wilderness (compare Kurtz, Geschichte des alten Bundes, II, section 53). In short, so decisively has this argument, derived from the supposed deficiency of culture and resources on the part of the Israelites, been disposed of by writers of by no means too conservative pro-clivities, that one feels surprised to find it called up again by Benzinger in Encyclopedia Biblica to do duty in support of the unhistorical character of the tabernacle narrative in Exodus.<P>4. Biblical Account Contains Marks of Its Unhistorical Character<P>The Biblical account of the Mosaic tabernacle, it is further contended, bears internal marks of its completely unhistorical character, as e.g.<P>(1) that it represents the tabernacle as having been constructed on a model which had been supernaturally shown to Moses;<P>(2) that it habitually speaks of the south, north, and west sides of the tabernacle although no preceding order had been issued that the tent should be so placed;<P>(3) that the brazen altar is described as made of timber overlaid with brass, upon which a huge fire constantly burned;<P>(4) that, the tabernacle is depicted, not as a mere provisional shelter for the ark upon the march, but "as the only legitimate sanctuary for the church of the twelve tribes before Solomon"; and<P>(5) that the description of the tabernacle furnished in P (<a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25-31</a>; <a onClick="return mV(\'Exd\',36,\'1-\');">36-40</A>; <a onClick="return mV(\'Num\',2,2,17);">Nu 2:2,17</a>; <a onClick="return mV(\'Num\',5,\'1-4\');">5:1-4</a>; <a onClick="return mV(\'Num\',14,44);">14:44</a>) conflicts with that given in E (<a onClick="return mV(\'Exd\',33,\'7-11\');">Ex 33:7-11</a>), both as to its character and its location.<P>But<P>(1) why should the story of the tabernacle be a fiction, because Moses is reported to have made it according to a pattern showed to him in the Mount (<a onClick="return mV(\'Exd\',25,40);">Ex 25:40 (Hebrew 8:5)</a>)? No person says that the Temple of Solomon was a fiction, because David claimed that the pattern of it given to Solomon had been communicated to him (David) by divine inspiration (<a onClick="return mV(\'1Ch\',28,19);">1Ch 28:19</a>). Every critic also knows that Ezekiel wrote the book that goes by his name. Yet Ezekiel asserts that the temple described by him was beheld by him in a vision. Unless therefore the supernatural is ruled out of history altogether, it is open to reply that God could just as easily have revealed to Moses the pattern of the tabernacle as He afterward exhibited to Ezekiel the model of his temple. And even if God showed nothing to either one prophet or the other, the fact that Moses says he saw the pattern of the tabernacle no more proves that he did not write the account of it, than Ezekiel\'s stating that he beheld the model of his temple attests that Ezekiel never penned the description of it. The same argument that proves Moses did not write about the tabernacle also proves that Ezekiel could not have written about the vision-temple. Should it be urged that as Ezekiel\'s temple was purely visionary so also was Moses\' tabernacle, the argument comes with small consistency and less force from those who say that Ezekiel\'s vision-temple was the model of a real temple that should afterward be built; since if Ezekiel\'s vision-temple was (or should have been, according to the critics) converted into a material sanctuary, no valid reason can be adduced why Moses\' vision-tabernacle should not also have been translated into an actual building.<P>(2) How the fact that the tabernacle had three sides, south, north and west, shows it could not have been fashioned by Moses, is one of those mysteries which takes a critical mind to understand. One naturally presumes that the tabernacle must have been located somewhere and oriented somehow; and, if it had four sides, would assuredly suit as well to set them toward the four quarters of heaven as in any other way. But in so depicting the tabernacle, say the critics, the fiction writers who invented the story were actuated by a deep-laid design to make the Mosaic tabernacle look like the Temple of Solomon. Quite a harmless design, if it was really entertained! But the Books of Kings and Chronicles will be searched in vain for any indication that the Temple foundations were set to the four quarters of heaven. It is true that the 12 oxen who supported the molten sea in Solomon\'s Temple were so placed—4 looking to the north, 4 to the south, 4 to the east, and 4 to the west (<a onClick="return mV(\'1Ki\',7,25);">1Ki 7:25</a>); but this does not necessarily warrant the inference that the sides of the Temple were so placed. Hence, on the well-known principle of modern criticism, that when a thing is not mentioned by a writer the thing does not exist, seeing that nothing is recorded about how the temple was placed, ought it not to be concluded that the whole story about the Temple is a myth?<P>(3) As to the absurdity of representing a large fire as constantly burning upon a wooden altar overlaid with a thin plate of brass, this would certainly have been all that the critics say—a fatal objection to receiving the story of the tabernacle as true. But if the story was invented, surely the inventor might have given Moses and his two skilled artisans, Bezalel and Oholiab, some credit for common sense, and not have made them do, or propose to do, anything so stupid as to try to keep a large fire burning upon an altar of wood. This certainly they did not do. An examination of <a onClick="return mV(\'Exd\',27,\'1-8\');">Ex 27:1-8</a>; <a onClick="return mV(\'Exd\',38,\'1-7\');">38:1-7</a> makes it clear that the altar proper upon which "the strong fire" burned was the earth or stone-filled (<a onClick="return mV(\'Exd\',20,24);">Ex 20:24</a>f) hollow which the wooden and brass frame enclosed.<P>(4) The fourth note of fancy—what Wellhausen calls "the chief matter"—that the tabernacle was designed for a central sanctuary to the church of the Twelve Tribes before the days of Solomon, but never really served in this capacity—is partly true and partly untrue. That it was meant to be a central sanctuary, until Yahweh should select for Himself a place of permanent habitation, which He did in the days of Solomon, is exactly the impression a candid reader derives from Exodus, and it is gratifying to learn from so competent a critic as Wellhausen that this impression is correct. But that it really never served as a central sanctuary, it is impossible to admit, after having traced its existence from the days of Joshua onward to those of Solomon. That occasionally altars were erected and sacrifices offered at other places than the tabernacle—as by Gideon at Ophrah (<a onClick="return mV(\'Jdg\',6,\'24-27\');">Jud 6:24-27</a>) and by Samuel at Ramah (<a onClick="return mV(\'1Sa\',7,17);">1Sa 7:17</a>)—is no proof that the tabernacle was not the central sanctuary. If it is, then by parity of reasoning the altar in Mt. Ebal (<a onClick="return mV(\'Deu\',27,5);">De 27:5</a>) should prove that Jerusalem was not intended as a central sanctuary. But, if alongside of the Temple in Jerusalem, an altar in Ebal could be commanded, then also alongside of the tabernacle it might be legitimate to erect an altar and offer sacrifice for special needs. And exactly this is what was done. While the tabernacle was appointed for a central sanctuary the earlier legislation was not revoked: "An altar of earth thou shalt make unto me, and shalt sacrifice thereon thy burnt-offerings, and thy peace-offerings, thy sheep, and thine oxen: in every place where I record my name I will come unto thee and I will bless thee" (<a onClick="return mV(\'Exd\',20,24);">Ex 20:24</a>). It was still legitimate to offer sacrifice in any spot where Yahweh was pleased to manifest Himself to His people. And even though it had not been, the existence of local shrines alongside of the tabernacle would no more warrant the conclusion that the tabernacle was never built than the failure of the Christian church to keep the Golden Rule would certify that the Sermon on the Mount was never preached.<P>(5) With regard to the supposed want of harmony between the two descriptions of the tabernacle in P and E, much depends on whether the structures referred to in these documents were the same or different.<P>(a) If different, i.e. if the tent in E (<a onClick="return mV(\'Exd\',33,\'7-11\');">Ex 33:7-11</a>) was Moses\' tent (Kurtz, Keil, Kalisch, Ewald and others), or a preliminary tent erected by Moses (Havernick, Lange; Kennedy, and section A (I, 1), above), or possessed by the people from their forefathers (von Gerlach, Benzinger in EB), no reason can be found why the two descriptions should not have varied as to both the character of the tent and its location. The tent in E, which according to the supposition was purely provisional, a temporary sanctuary, may well have been a simple structure and pitched outside the camp; while the tent in P could just as easily have been an elaborate fabric with an ark, a priesthood and a complex sacrificial ritual and located in the midst of the camp. In this case no ground can arise for suggesting that they were contradictory of one another, or that P\'s tent was a fiction, a paper-tabernacle, while E\'s tent was a reality and the only tabernacle that ever existed in Israel. But<P>(b) if on the other hand the tent in E was the same as the tent in P (Calvin, Mead in Lange, Konig, Eerdmans, Valeton and others), then the question may arise whether or not any contradiction existed between them, and, if such contradiction did exist, whether this justifies the inference that P\'s tent was unhistorical, i.e. never took shape except in the writer\'s imagination.<P>That the tent in E was not P\'s Mosaic tabernacle has been argued on the following grounds:<P>(a) that the Mosaic tabernacle (assuming it to have been a reality and not a fiction) was not yet made; so that E\'s tent must have been either the tent of Moses or a provisional tent;<P>(b) that nothing is said about a body of priests and Levites with an ark and a sacrificial ritual in connection with E\'s tent, but only of a non-Levitical attendant Joshua, and<P>(c) that it was situated outside the camp, whereas P\'s tabernacle is always represented as in the midst of the camp.<P>The first of these grounds largely disappears when <a onClick="return mV(\'Exd\',33,7);">Ex 33:7</a> is read as in the Revised Version: "Now Moses used to take the tent and to pitch it without the camp." The verbs, being in the imperfect, point to Moses\' practice (Driver, Introduction and Hebrew Tenses; compare Ewald, Syntax, 348), which again may refer either to the past or to the future, either to what Moses was in the habit of doing with his own or the preliminary tent, or what he was to do with the tent about to be constructed. Which interpretation is the right one must be determined by the prior question which tent is intended. Against the idea of E\'s tent being Moses\' private domicile stands the difficulty of seeing why it was not called his tent instead of the tent, and why Moses should be represented as never going into it except to hold communion with Yahweh. If it was a provisional tent, struck up by Moses, why was no mention of its construction made? And if it was a sort of national heirloom come down from the forefathers of Israel, why does the narrative contain not the slightest intimation of any such thing?<P>On the other hand if E\'s tent was the same as P\'s, the narrative does not require to be broken up; and <a onClick="return mV(\'Exd\',33,\'7-11\');">Ex 33:7-11</a> quite naturally falls into its place as an explanation of how the promises of 33::3 and 5 were carried out (see infra).<P>The second supposed proof that E\'s tent was not P\'s but an earlier one, namely, that P\'s had a body of priests and Levites, an ark and a complex ritual, while E\'s had only Joshua as attendant and made no mention of ark, priests or sacrifices, loses force, unless it can be shown that there was absolute necessity that in this paragraph a full description of the tabernacle should be given. But obviously no such necessity existed, the object of the writer having been as above explained. Driver, after Wellhausen (GJ, 387), conjectures that in E\'s original document <a onClick="return mV(\'Exd\',33,\'7-11\');">Ex 33:7-11</a> may have been preceded "by an account of the construction of the Tent of Meeting and of the ark," and that "when the narrative was combined with that of P this part of it (being superfluous by the side of <a onClick="return mV(\'Exd\',25,\'1-\');">Exodus 25-35</a>) was probably omitted." As this however is only a conjecture, it is of no more (probably of less) value than the opinion that <a onClick="return mV(\'Exd\',25,\'1-\');">Exodus 25-35</a> including <a onClick="return mV(\'Exd\',33,\'7-11\');">33:7-11</A> proceeded from the same pen. The important contribution to the interpretation of the passage is that the absence from the paragraph relating to E\'s tent of the ark, priests and sacrifices is no valid proof that E\'s tent was not the Mosaic tabernacle.<P>The third argument against their identity is their different location—E\'s outside and P\'s inside the camp. But it may be argued (a) that the translation in the Revised Version (British and American) distinctly relieves this difficulty. For if Moses used to take and pitch the tabernacle outside the camp, the natural implication is that the tabernacle was often, perhaps usually, inside the camp, as in the Priestly Code (P), and only from time to time pitched outside the camp, when Yahweh was displeased with the people (Eerdmans, Valeton). Or (2) that "outside the camp" may signify away, at an equal distance from all the four camps ("over against the tent of meeting"—in the King James Version "far off," after <a onClick="return mV(\'Jos\',3,4);">Jos 3:4</a>—were the various tribes with their standards, i.e. the four camps, to be pitched; <a onClick="return mV(\'Num\',2,2);">Nu 2:2</a>); so that the tabernacle might easily be in the midst of all the camps and yet "outside" and "far off" from each camp separately, thus requiring every individual who sought the Lord to go out from his camp unto the tabernacle. <a onClick="return mV(\'Num\',11,\'26-30\');">Nu 11:26-30</a> may perhaps shed light upon the question. There it is stated that "there remained two men in the camp (who) had not gone out with Moses unto the Tent," and that Moses and the elders after leaving the tent, "gat (them) into the camp." Either the tent at this time was in the center of the square, around which the four camps were stationed, or it was outside. If it was outside, then the first of the foregoing explanations will hold good; if it was inside the camp, then the second suggestion must be adopted, namely, that while the camps were round about the tabernacle, the tabernacle was outside each camp. "Although the tabernacle stood in the midst of the camp, yet it was practically separated from the tents of the tribes by an open space and by the encampment of the Levites" (Pulpit Commentary, in the place cited.; compare Keil, in the place cited.). When one calls to mind that the tabernacle was separated from each side of the square probably, as in <a onClick="return mV(\'Jos\',3,4);">Jos 3:4</a>, by 2,000 cubits (at 19-25 inches each = about 3/4 of a mile), one has small difficulty in understanding how the tabernacle could be both outside the several camps and inside them all; how the two promises in <a onClick="return mV(\'Exd\',33,\'1-\');">Ex 33</a> (the King James Version)—"I will not go up in the midst of thee" (<a onClick="return mV(\'Exd\',33,3);">33:3</A>) and "I will come up into the midst of thee" (<a onClick="return mV(\'Exd\',33,5);">33:5</A>)—might be fulfilled; how Moses and the elders could go out from the camp (i.e. their several camps) to the tabernacle and after leaving the tabernacle return to the camp (i.e. their several camps); and how no insuperable difficulty in the shape of an insoluble contradiction exists between E\'s account and P\'s account.<P>5. Pre-exilic Prophets Knew Nothing of Levitical System of Which the Tabernacle Was Said to Be the Center.<P>That the pre-exilic prophets knew nothing about the Levitical system of which the tabernacle was the center is regarded as perhaps the strongest proof that the tabernacle had no existence in the wilderness and indeed never existed at all except on paper. The assertion about the ignorance of the pre-exilic prophets as to the sacrificial system of the Priestly Code has been so often made that it has come to be a "commonplace" and "stock-phrase" of modern criticism. In particular, Amos in the 8th century BC (<a onClick="return mV(\'Amo\',5,25,26);">5:25,26</A>) and Jeremiah in the 7th century BC (<a onClick="return mV(\'Jer\',7,\'21-23\');">7:21-23</a>) are quoted as having publicly taught that no such sacrificial ritual as the tabernacle implied had been promulgated in the wilderness. But, if these prophets were aware that the Levitical Law had not been given by Moses, one would like to know,<P>(1) how this interpretation of their language had been so long in being discovered;<P>(2) how the critics themselves are not unanimous in accepting this interpretation—which they are not;<P>(3) how Amos could represent Yahweh as saying "I hate, I despise your feasts, and I will take no delight in your solemn assemblies. Yea, though ye offer me your burnt-offerings and meal-offerings, I will not accept them; neither will I regard the peace-offerings of your fat beasts" (<a onClick="return mV(\'Amo\',5,21,22);">5:21,22</A>), if Yahweh had never accepted and never enjoined them;<P>(4) how Jeremiah could have been a party to putting forward Deuteronomy as a work of Moses if he knew that Yahweh had never commanded sacrifices to be offered, which Deuteronomy does; and<P>(5) how Jeremiah could have blamed Judah for committing spiritual adultery if Yahweh had never ordered the people to offer sacrifice.<P>In reply to<P>(1) it will scarcely do to answer that all previous interpreters of Amos and Jeremiah had failed to read the prophets\' words as they stand (<a onClick="return mV(\'Amo\',5,25,26);">Am 5:25,26</a>; <a onClick="return mV(\'Jer\',7,22);">Jer 7:22</a>), because the question would then arise why the middle books of the Pentateuch should not also be read as they stand, as e.g. when they say, "The Lord spake unto Moses," and again "These (the legislative contents of the middle books) are the commandments, which Yahweh commanded Moses for the children of Israel in mount Sinai" (<a onClick="return mV(\'Lev\',27,34);">Le 27:34</a>). As for<P>(2) it is conveniently forgotten that Bohlen (Introduction to Genesis, I, 277) admitted that some of the Pentateuch "might possibly have originated in the time of Moses," and when quoting <a onClick="return mV(\'Jer\',7,22);">Jer 7:22</a> never dreamed of putting forward an explanation different from the orthodox rendering of the same, and certainly did not cite it as a proof that the Law had no existence prior to the exile; that De Wette in his Einleitung (261, 262, 8th edition) stated that "the holy laws and institutions of theocratic people had for their author Moses, who in giving them stood under divine guidance"; that Knobel (Die Bucher Ex und Lev, xxii) explicitly declared that Moses must be regarded not only as the liberator and founder of his people, but also the originator of the peculiar Israelite constitution and lawgiving, at least in its fundamental elements; that Ewald (Die Propheten, II, 123) regarded <a onClick="return mV(\'Jer\',7,22);">Jer 7:22</a> as making no announcement about the origin of the sacrificial cult; and that Bleek (Introduction to the Old Testament) forgot to read the modern critical interpretation into the words of Amos and Jeremiah for the simple reason that to have done so would have stultified his well-known view that many of the laws of the middle books of the Pentateuch are of Mosaic origin. Nor is the difficulty<P>(3) removed by holding that, if prior to the days of Amos Yahweh did accept the burnt offerings and meal offerings of Israel, these were not sacrifices that had been appointed in the wilderness, because Yahweh Himself appears to intimate (<a onClick="return mV(\'Amo\',5,25,26);">Am 5:25,26</a>) that no such sacrifices or offerings had been made during the whole 40 years\' wandering. Had this been the case, it is not easy to see why the post-exilic authors of the Priestly Code should have asserted the contrary, should have represented sacrifices as having been offered in the wilderness, as they have done (see <a onClick="return mV(\'Num\',16,\'1-\');">Nu 16</a>; <a onClick="return mV(\'Num\',18,\'1-\');">18</a>). The obvious import of Yahweh\'s language is either that the sacrificial worship which He had commanded had been largely neglected by the people, or that it had been so heartless and formal that it was no true worship at all—their real worship being given to their idols—and that as certainly as the idolaters in the wilderness were excluded from Canaan, so the idolaters in Amos\' day, unless they repented, would be carried away into exile. As to<P>(4) Jeremiah\'s action in putting forward or helping to put forward Deuteronomy as a work of Moses when he knew that it represented Yahweh as having commanded sacrifices to be offered both in the wilderness and in Canaan (<a onClick="return mV(\'Deu\',12,6,11,13);">De 12:6,11,13</a>), and must have been aware as well that J-E had represented Yahweh as commanding sacrifice at Sinai (<a onClick="return mV(\'Exd\',20,24,25);">Ex 20:24,25</a>), no explanation can be offered that will clear the prophet from the charge of duplicity and insincerity, or prevent his classification with the very men who were a grief of mind to him and against whom a large part of his life was spent in contending, namely, the prophets that prophesied lies in the name of God. Nor does it mend matters to suggest (Cheyne) that when Jeremiah perceived that Deuteronomy, though floated into publicity under high patronage, did not take hold, he changed his mind, because in the first place if Jeremiah did so, he should, like an honest man, have washed his hands clear of Deuteronomy, which he did not; and in the second place, because had he done so he could not have been "the iron pillar and brazen wall" which Yahweh had intended him to be and indeed had promised to make him against the princes, priests and people of the land (<a onClick="return mV(\'Jer\',1,18);">1:18</A>). And, still further,<P>(5) it passes comprehension how, if Yahweh never commanded His people to offer sacrifice to Him, Jeremiah could have represented Yahweh as enjoining him to pronounce a curse upon the inhabitants of Jerusalem because they transgressed the words of Yahweh\'s covenant, which He had made with their fathers in the day when He brought them out of the land of Egypt, by running after other gods to serve them, setting up altars and burning incense unto Baal and even working lewdness in Yahweh\'s house (<a onClick="return mV(\'Jer\',11,\'1-15\');">Jer 11:1-15</a>). It is urged in answer to this, that the offense complained of was not that the men of Judah did not offer sacrifices to Yahweh, but that they offered them to Baal and polluted His temple with heathen rites—that what Yahweh demanded from His worshippers was not the offering of sacrifice, but obedience to the moral law conjoined with abstinence from idolatry. But in that case, what was the use of a temple at all? And why should Yahweh speak of it as "mine house," if sacrifices were not required to be offered in it (compare on this Kittel, The Scientific Study of the Old Testament, 218)? Why idolatrous sacrifices were denounced was not merely because they were wrong in themselves, but also because they had supplanted the true sacrificial worship of Yahweh. As already stated, it is not easy to perceive how Jeremiah could have said that Yahweh had never commanded sacrifices to be offered to Him, when he (Jeremiah) must have known that the Book of the Covenant in J-E (<a onClick="return mV(\'Exd\',20,24,25);">Ex 20:24,25</a>) represented Yahweh as expressly enjoining them. Had Jeremiah not read the Book of the Covenant with sufficient care? This is hardly likely in so earnest a prophet. Or will it be lawful to suggest that Jeremiah knew the Book of the Covenant to be a fiction and the assumption of divine authority for its enactments to be merely a rhetorical device? In this case his words might be true; only one cannot help regretting that he did not distinctly state that in his judgment the Book of the Covenant was a fraud.<P>It may now be added in confirmation of the preceding, that the various references to a tabernacle in the New Testament appear at least to imply that in the 1st Christian century the historicity of the Mosaic tabernacle was generally accepted. These references are Peter\'s exclamation on the Mount of Transfiguration (<a onClick="return mV(\'Mat\',17,4);">Mt 17:4</a>; <a onClick="return mV(\'Mar\',9,5);">Mr 9:5</a>; <a onClick="return mV(\'Luk\',9,33);">Lu 9:33</a>); Stephen\'s statement in the council (<a onClick="return mV(\'Act\',7,44);">Ac 7:44</a>); the affirmations in Hebrews (chapters <a onClick="return mV(\'Hbr\',8,\'1-\');">8</A>; <a onClick="return mV(\'Hbr\',9,\'1-\');">9</A>); and the voice which John heard out of heaven (<a onClick="return mV(\'Rev\',21,3);">Re 21:3</a>). It may be admitted that taken separately or unitedly these utterances do not amount to a conclusive demonstration that the tabernacle actually existed in the wilderness; but read in the light of Old Testament aeclarations that such a tabernacle did exist, they have the force of a confirmation. If the language of Peter and that of John may fairly enough be regarded as figurative, even then their symbolism suggests, as its basis, what Stephen and the writer to the He affirm to have been a fact, namely, that their "fathers had the tabernacle...in the wilderness," and that, under the first covenant, "there was a tabernacle prepared."<P>LITERATURE.<P>I, critical: De Wette, Beitrage; von Bohlen, Genesis; Georg, Judische Feste; Reuss, Geschichte der heiligen Schriften des AT; Graf, de Templo Silonensi; Kuenen, The Religion of Israel; Wellhausen, Prolegomena zur Geschichte Israels; HDB and EB, articles "Tabernacle," II, conservative: Bredenkamp, Gesetz und Propheten; Kurtz, Geschichte des alten Bundes; Havernick, Einleitung; Hengstenberg, Egypt and the Books of Moses; Riehm, Handworterbuch, and Herzog, RE (ed 1; edition 3 is "critical"), articles "Stiftshutte"; Baxter, Sanctuary and Sacrifice; Bissell, The Pentateuch: Its Origin and Structure; Orr, The Problem of the Old Testament; Whitelaw, Old Testament Critics.``192';
