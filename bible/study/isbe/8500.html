isbe[8501]='Sunrising`sun\'-riz-ing: A frequent designation in the Old Testament for the East (<a onClick="return mV(\'Num\',21,11);">Nu 21:11</a>; <a onClick="return mV(\'Deu\',4,41,47);">De 4:41,47</a>; <a onClick="return mV(\'Jos\',1,15);">Jos 1:15</a>, etc.). In <a onClick="return mV(\'Rev\',7,2);">Re 7:2</a>, the Revised Version (British and American) has "sunrising" for the King James Version "east."``1';
isbe[8502]='Sunstroke`sun\'-strok.`<a href="./study/isbe/search.html?string=SUN,+SMITING+BY">SUN, SMITING BY</a>`1';
isbe[8503]='Sup; Supper`sup\'-er.`<a href="./study/isbe/search.html?string=MEALS">MEALS</a>`1';
isbe[8504]='Superfluous; Superfluity`su-pur\'-floo-us, su-per-floo\'-i-ti (sara\'; perissos (<a onClick="return mV(\'2Cr\',9,1);">2Co 9:1</a>), perisseia): According to the Levitical Law, "a blind man, or a lame, or he that hath a fiat nose, or anything superfluous" could not fulfill priestly functions (<a onClick="return mV(\'Lev\',21,18);">Le 21:18</a>; <a onClick="return mV(\'Lev\',22,23);">22:23</a>). According to Dillmann (Baentsch, BDB) the word should be rendered "a limb too long," but Ewald (following the Septuagint) suggests "having cropped ears." The only instance of superfluity occurs in <a onClick="return mV(\'Jam\',1,21);">Jas 1:21</a>, the King James Version "superfluity of naughtiness"; according to Mayor "overflowing ebullition of malice" (the Revised Version (British and American) "overflowing of wickedness," margin "malice"); but the Greek word is used in other connections, e.g. of "grace" (<a onClick="return mV(\'Rom\',5,17);">Ro 5:17</a>); "joy" (<a onClick="return mV(\'2Cr\',8,2);">2Co 8:2</a>).``103';
isbe[8505]='Superscription`su-per-skrip\'-shun (epigraphe):<P>(1) The legend on a coin designating the person in whose honor or by whose authority it is issued (<a onClick="return mV(\'Mat\',22,20);">Mt 22:20</a>; <a onClick="return mV(\'Mar\',12,16);">Mr 12:16</a>; <a onClick="return mV(\'Luk\',20,24);">Lu 20:24</a>).<P>(2) The accusation on the cross of Jesus (<a onClick="return mV(\'Mar\',15,26);">Mr 15:26</a>; <a onClick="return mV(\'Luk\',23,38);">Lu 23:38</a>). According to Roman custom an inscription bearing the charge or ground of a criminal\'s condemnation was fixed to the cross on which he was crucified. The use of such an inscription at the crucifixion of Jesus is mentioned by all four evangelists. The fullest description is that of Mark, "the superscription of his accusation" (he epigraphe tes aitias autou) (<a onClick="return mV(\'Mar\',15,26);">15:26</A>). Matthew calls it more briefly "his accusation" (ten aitian autou) (<a onClick="return mV(\'Mat\',27,38);">27:38</A>), while Luke styles it merely "a superscription" (epigraphe) (<a onClick="return mV(\'Luk\',23,38);">23:38</A>). In the Fourth Gospel it is called a "title" (titlon) (<a onClick="return mV(\'Jhn\',19,19);">Joh 19:19</a>). The text of the superscription is given by the four evangelists in varying terms and with various degrees of fullness.``121';
isbe[8506]='Superstition; Superstitious`su-per-stish\'-un; su-per-stish\'-us (deisidaimonia, "fearing demons"): The Biblical use of these words is limited to that of the former in <a onClick="return mV(\'Act\',25,19);">Ac 25:19</a> the King James Version, and of the latter in <a onClick="return mV(\'Act\',17,22);">Ac 17:22</a>. In the former reference, Festus speaks of the Jews\' "superstition" (the Revised Version (British and American) "religion"), thus artfully dodging an avowal of his own convictions "respecting the Hebrew faith." In <a onClick="return mV(\'Act\',17,22);">Ac 17:22</a> the King James Version Paul tactfully refers to the Athenians as being "too superstitious" (the Revised Version (British and American) "too religious"), thus using the term correctly from both their and his point of view. They were truly too "religious" with their superstitions.``41';
isbe[8507]='Suph`soof (cuph; plesion tes eruthras (thalasses); the King James Version Red Sea): As the verse stands, the place where Moses addressed the children of Israel is indicated as "beyond the Jordan in the wilderness, in the Arabah over against Suph" (<a onClick="return mV(\'Deu\',1,1);">De 1:1</a>). the King James Version, following Septuagint, takes the name as a contraction of yam suph (see <a href="./study/isbe/search.html?string=RED+SEA">RED SEA</a>). The abbreviation is not found elsewhere. The name of the sea was not derived from that of a city; so we need not look in that direction. Knobel suggested Naqb es-Safa, a pass about 25 miles west-southwest of the Dead Sea. But it is "unsuitably situated; nor does the name agree phonetically (for Arabic ts agrees with Hebew tsade not with Hebew samek)." (Driver, "Deuteronomy," ICC, 4). No identification is possible.``54';
isbe[8508]='Suphah`soo\'-fa (suphah, for wahebh becuphah; Septuagint reads ten Zoob ephlogise; the King James Version Rea Sea): Suphah is the region in which Vaheb is situated (<a onClick="return mV(\'Num\',21,14);">Nu 21:14</a>). It is probably identical with Suph of <a onClick="return mV(\'Deu\',1,1);">De 1:1</a>. Tristram (Land of Moab, 50f) suggested identification with Ghor es-Safiyeh], a small oasis east of the mud flats of Es-Sebkhah], south of the Dead Sea; but "the sibilants do not correspond, and Safiyeh is a specifically Arabic term (Wetzstein in Delitzsch, Gen4, 586, note 2) which does not seem to be a likely explanation of Suphah" (Gray, "Nu," ICC, 285f). This, and other questions of identification, must wait for solution until a more thorough exploration of the whole district has been accomplished.``54';
isbe[8509]='Supper`sup\'-er.`<a href="./study/isbe/search.html?string=MEALS">MEALS</a>`1';
isbe[8510]='Supper, Lord\'s``<a href="./study/isbe/search.html?string=LORD\'s+supper">LORD\'S SUPPER</a>`1';
isbe[8511]='Supply`su-pli\':<a onClick="return mV(\'Phl\',4,19);">Php 4:19</a> for pleroo; <a onClick="return mV(\'1Cr\',16,17);">1Co 16:17</a>; <a onClick="return mV(\'Phl\',2,30);">Php 2:30</a> for anapleroo; <a onClick="return mV(\'2Cr\',9,12);">2Co 9:12</a> (the King James Version); <a onClick="return mV(\'2Cr\',11,9);">2Co 11:9</a> for prosanapleroo. All three verbs mean "to fill," the 3rd containing the additional connotation "fill up to a certain point." <a onClick="return mV(\'Eph\',4,16);">Eph 4:16</a>; <a onClick="return mV(\'Phl\',1,19);">Php 1:19</a> for the noun epichoregia, literally, "an additional supply." But no special force of "additional" seems to be contained in the passages. In <a onClick="return mV(\'2Cr\',9,10);">2Co 9:10a</a>; <a onClick="return mV(\'Gal\',3,5);">Ga 3:5</a>; <a onClick="return mV(\'Col\',2,9);">Col 2:9</a>; <a onClick="return mV(\'2Pe\',1,5,11);">2Pe 1:5,11</a>, we have epichoregeo, "to furnish besides," i.e. fully supply; in <a onClick="return mV(\'2Cr\',9,10);">2Co 9:10b</a>; <a onClick="return mV(\'1Pe\',4,11);">1Pe 4:11</a> the simple choregeo, "to furnish,"``48';
isbe[8512]='Sur`sur (Codex Vaticanus Assour, Codex Alexandrinus Sour): Those that dwelt in Sur are mentioned along with the inhabitants of Sidon, Tyre, Ocina, etc., as dreading the approach of Holofernes and the Assyrian any (Judith 2:28). The names run from north to south, and Sur immediately follows Tyre (modern Sur), with which, therefore, it can hardly be identified. No probable identification has been suggested.`<a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>`1';
isbe[8513]='Sure; Surely`shoor, shoor\'-li: In modern English is used chiefly in the phrases "to be sure" or "to make sure," and as a simple adjective it is usually either archaic or exceedingly colloquial. The adjectival use, however, is common (chiefly for \'aman, "to confirm," and its derivatives) in English Versions of the Bible, where modern English would prefer "secure" or "certain" (<a onClick="return mV(\'1Sa\',2,35);">1Sa 2:35</a>; Sir 40:25; <a onClick="return mV(\'Act\',13,34);">Ac 13:34</a>, etc.). "To be sure that" is also fairly common in the King James Version, and occasionally (as in <a onClick="return mV(\'Deu\',12,23);">De 12:23</a>, "Be sure that thou eat not the blood," for chazaq, "to be firm") it has rather more emphasis than in modern English. But usually the phrase is a mere periphrasis for some word meaning "to know" (compare the Revised Version (British and American) <a onClick="return mV(\'Exd\',3,19);">Ex 3:19</a>; <a onClick="return mV(\'Luk\',10,11);">Lu 10:11</a>; <a onClick="return mV(\'Rom\',2,2);">Ro 2:2</a>, etc.). In <a onClick="return mV(\'Pro\',6,3);">Pr 6:3</a>, the King James Version has "Make sure thy friend" for rahabh, "be boisterous" "beset" the Revised Version (British and American) "importune." The sense is "Force him to pay his debt."<P>Surely in English Versions of the Bible is used almost always to qualify an entire phrase, as in <a onClick="return mV(\'Gen\',28,16);">Ge 28:16</a>, "Surely Yahweh is in this place." In modern English "surely" used in this way suggests that the statement is being argued and is therefore slightly doubtful, but in Elizabethan English the purpose is to exclude all doubt ("beyond question"). With this force the King James Version uses "surely" to translate almost any emphatic form, and the Revised Version (British and American) has conformed to AV\'s use, and such changes as have been made by the Revised Version (British and American) (<a onClick="return mV(\'Mat\',26,73);">Mt 26:73</a>; <a onClick="return mV(\'Luk\',4,23);">Lu 4:23</a>; <a onClick="return mV(\'Rev\',22,20);">Re 22:20</a>, etc.) are merely to preserve uniformity of rendition. The most common use of "surely" in this sense is to translate a verb when emphasized by its own part. (absolute inf. in Hebrew), as "Thou shalt, surely die" (<a onClick="return mV(\'Gen\',2,17);">Ge 2:17</a>) for "dying thou shalt die" (compare <a onClick="return mV(\'Gen\',22,17);">Ge 22:17</a> for the Hebrew construction). In this sense "surely" is sometimes varied by "of a surety" (<a onClick="return mV(\'Gen\',15,13);">Ge 15:13</a>, etc.) without the slightest difference in meaning (compare <a onClick="return mV(\'Gen\',9,5);">Ge 9:5</a> and <a onClick="return mV(\'Gen\',26,9);">26:9</A>). In addition "surely" is used occasionally as a simple adverb where modern English would prefer "securely" or "certainly" (compare <a onClick="return mV(\'Pro\',10,9);">Pr 10:9</a> and the King James Version <a onClick="return mV(\'Luk\',1,1);">Lu 1:1</a>, "surely believed," the Revised Version (British and American) "fulfilled," the Revised Version margin "fully established").<P>Surety, besides its use in "of a surety" appears, in the Old Testament to translate \'arabh, "to be surety," and in <a onClick="return mV(\'Hbr\',7,22);">Heb 7:22</a> for egguos, "guarantor," "giver of security." Modern English prefers "security," as does even the King James Version in <a onClick="return mV(\'Act\',17,9);">Ac 17:9</a>. "Suretiship" (the American Standard Revised Version "suretyship") in <a onClick="return mV(\'Pro\',11,15);">Proverbs 11:15</a> for taqa\', "to strike (hands)."`<a href="./study/isbe/search.html?string=STRIKE">STRIKE</a>; <a href="./study/isbe/search.html?string=SURETY">SURETY</a>`48';
isbe[8514]='Surety`shoor\'-ti: This word is used in three different connections or groups:<P>(1) As a derivative of the word "sure" it means "of a certainty" or "surely."—In <a onClick="return mV(\'Gen\',15,13);">Ge 15:13</a> the infinitive absolute of the verb is used to give emphasis to the idea of the verb and is rendered "of a surety." In <a onClick="return mV(\'Gen\',18,13);">Ge 18:13</a> the Hebrew \'omnam is translated "of a surety." In <a onClick="return mV(\'Gen\',26,9);">Ge 26:9</a> \'akh is similarly rendered, and has the force of our "indeed." In <a onClick="return mV(\'Act\',12,11);">Ac 12:11</a> alethos, is translated in the King James Version "of a surety," but better in the Revised Version (British and American) "of a truth."<P>(2) In the sense of security or pledge for a person.—This means that one person may become security for another, that such a one will do a certain thing at a time in the future. Judah was "surety" to his father Jacob that Benjamin would safely return from Egypt (<a onClick="return mV(\'Gen\',43,9);">Ge 43:9</a>). He pledged his life that the younger brother would return safely. He tells Joseph (<a onClick="return mV(\'Gen\',44,32);">Ge 44:32</a>) how he had become surety for Benjamin, and offers to become Joseph\'s slave for the sake of his brother. Job says (<a onClick="return mV(\'Job\',17,3);">Job 17:3</a>), "Give now a pledge, be surety for me with thyself; who is there that will strike hands with me?" The striking of hands refers to the action or gesture by which the surety or pledge was publicly manifested and thus ratified. Job here beseeches God to become surety for him, to pledge him that some time in the future He will cause Job\'s innocence to be made known and be acknowledged by God Himself. In <a onClick="return mV(\'Isa\',38,14);">Isa 38:14</a> Hezekiah says, "O Lord, I am oppressed, be thou my surety." He wishes God to give him a pledge of some kind, to go security for him in such a way that he will surely be saved out of his sickness and distress. Jesus is called "the surety (egguos) of a better covenant" (<a onClick="return mV(\'Hbr\',7,22);">Heb 7:22</a>). Jesus is the pledge or surety that through Him we may obtain the assurance and certainty that a more excellent covenant has been established by God, and are assured also of the truth of the promises connected with it.<P>(3) It is used to describe the practice of going security for another by striking hands with that person and becoming responsible for money or any object loaned.—The Book of Proverbs unhesitatingly condemns the practice. No mention is made of it in the Mosaic Law, as if the custom were then practically unknown. The Book of Proverbs makes no distinction between a stranger and a neighbor; the person who does such a thing is likened unto an animal caught in a trap. He is exhorted to sleep no more until he has got out of the trap, or freed himself from this obligation (<a onClick="return mV(\'Pro\',6,\'1-5\');">Pr 6:1-5</a>). The wisdom of such advice has been abundantly verified by experience. It does not necessarily preclude certain special cases, where the practice may be justified. The international relationships of the Jews in the period of the monarchy, together with the unsettled condition of the country (<a onClick="return mV(\'Neh\',5,3);">Ne 5:3</a>) and people, needed such commercial strictness. Their trade was mostly in the hands of the Phoenicians and other foreigners, and the pressure of taxation for the payment of foreign tribute, etc., was heavy (<a onClick="return mV(\'Neh\',5,4);">Ne 5:4</a>f). <a onClick="return mV(\'Pro\',11,15);">Pr 11:15</a>; <a onClick="return mV(\'Pro\',17,18);">17:18</a> declare one "void of understanding" who thus goes security for another. <a onClick="return mV(\'Pro\',20,16);">Pr 20:16</a> seems to contain an exclamation of contemptuous rebuke for the man who goes security. <a onClick="return mV(\'Pro\',22,26);">Pr 22:26</a>; <a onClick="return mV(\'Pro\',27,13);">27:13</a> contain like admonitions.`<a href="./study/isbe/search.html?string=DEBT">DEBT</a>; <a href="./study/isbe/search.html?string=PLEDGE">PLEDGE</a>; <a href="./study/isbe/search.html?string=SECURITY">SECURITY</a>; <a href="./study/isbe/search.html?string=STRIKE">STRIKE</a>`146';
isbe[8515]='Surname`sur\'-nam (kanah; epikalein): A word derived from the French., meaning "an additional name"; in modern English always the family name of a person. Indeed, the spelling "surname" in the King James Version 1Macc 1:10; 2:2; 6:43 may be due to a confusion with "sire\'s name." But the custom of family names was entirely unknown among the Hebrews. The word is used twice in the King James Version of the Old Testament, namely, <a onClick="return mV(\'Isa\',44,5);">Isa 44:5</a>; <a onClick="return mV(\'Isa\',45,4);">45:4</a>. The Hebrew word means "to give flattering or honorary titles." In the former passage foreigners are so envious of the prosperity of the Jews that they are anxious to be surnamed by the name of Israel, i.e. to be enrolled as members of the Jewish nation. In the latter case Yahweh gives Cyrus an honorary title, namely, "servant of Yahweh," and thus appoints him to be His instrument in the restoration of His people. The same word is rendered in <a onClick="return mV(\'Job\',32,21);">Job 32:21</a>, the King James Version "give flattering titles." Elihu declares his intention to examine the situation without fear or favor. He will not allow such high-sounding titles as "Your Worship" or "My Lord" to stand in his way. He will not be overawed by Job\'s social position. In the New Testament the word is used in the case of Peter—Simon whose surname is Peter (<a onClick="return mV(\'Act\',10,5,32);">Ac 10:5,32</a>; <a onClick="return mV(\'Act\',11,13);">11:13</a>); of Mark—John whose surname was Mark (<a onClick="return mV(\'Act\',12,12,25);">Ac 12:12,25</a>; <a onClick="return mV(\'Act\',15,37);">15:37</a>); of Judas—surnamed Iscariot (<a onClick="return mV(\'Luk\',22,3);">Lu 22:3</a>); of Barsabbas—who was surnamed Justus (<a onClick="return mV(\'Act\',1,23);">Ac 1:23</a>); and of Judas—surnamed Barsabbas (<a onClick="return mV(\'Act\',15,22);">Ac 15:22</a>). It was a widespread custom in the ancient world to give honorary and symbolical titles. our Lord surnamed Simon Peter (<a onClick="return mV(\'Mar\',3,16);">Mr 3:16</a>), and James and John Boanerges (<a onClick="return mV(\'Mar\',3,17);">Mr 3:17</a>). <a onClick="return mV(\'Act\',15,37);">Ac 15:37</a> the King James Version has "surname" for the simple "call" (so the Revised Version (British and American)).``103';
isbe[8516]='Susa`su\'-sa, soo\'-sa (Additions to Esther 11:3).`<a href="./study/isbe/search.html?string=SHUSHAN">SHUSHAN</a>`1';
isbe[8517]='Susanchites`su-san\'-kits (shushanekhaye\').`<a href="./study/isbe/search.html?string=SHUSHANCHITES">SHUSHANCHITES</a>`1';
isbe[8518]='Susanna, the History of`su-zan\'-a:<P>1. Name<P>2. Canonicity and Position<P>3. Contents<P>4. Fact or Fiction?<P>5. Date<P>6. Original Language<hr /><P>1. Name:<P>This novelette has, in the Septuagint, the bare title "Susanna" (Sousanna, from Hebrew shoshannah, "lily"). So also in the Syro-Hexapla. In Codex Alexandrinus (Theodotion) it is designated Horasis a (Vision I); see <a href="./study/isbe/search.html?string=BEL+AND+THE+DRAGON">BEL AND THE DRAGON</A>, sec. I. In the Harklensian Syriac (Ball\'s W2) its title is "The Book of Little (or the child?) Daniel."<P>2. Canonicity and Position:<P>Susanna was with the other Additions included in the Bible Canon of the Greek, Syrian and Latin churches. Julius Africanus (circa 230 AD) was the first to dispute the right of Susanna to a place in the Canon, owing to its improbable character. Origen replied to him, strongly maintaining its historicity (see Schurer, GJV4, III, 455; HJP, II,3,p. 186, where the references are given). In the Septuagint, Syro-Hexapla and Vulgate, Susanna is Daniel 14, but in Theodotion (ABQ) it opens Daniel, preceding chapter 1, a position implied in the King James Version and the Revised Version (British and American) which are based on Theodotion, formerly believed to be the true Septuagint. Yet it is probable that even in Theodotion the original place agreed with that in the true Septuagint (Swete\'s 87); so Roth (Kautzsch, Die Apok., 172) and Driver (Commentary on Daniel, Cambridge Bible, xviii).<P>See <a href="./study/isbe/search.html?string=BEL+AND+THE+DRAGON">BEL AND THE DRAGON</A>.<P>3. Contents:<P>The story of Susanna is thus told in Theodotion\'s version, and therefore in English Versions of the Bible which follows it. Susanna was the beautiful and devout wife of Joakim who resided in Babylon in the early years of the exile, and owned a fine park which was open to his fellow-exiles (verses 1-4). Two of these last were elders and judges who, though held in high esteem, suffered impure thoughts toward Susanna to enter their minds. One day, meeting in the park, they divulged to each other their lustful passion toward this beautiful woman, and resolved together to seize the first opportunity to waylay her in the park and to overpower her (verses 5-15). A joint attempt was made upon Susanna, who resisted, notwithstanding threats of false accusation (verses 22-26). The elders make a false charge, both in private and in public, and she is accordingly condemned to death (verses 27-41). On the way to execution she is met by Daniel (= judge "of God") who has the case reopened, and by a system of cross-examination of the two elders succeeds in convincing the people that Susanna is innocent of the charge brought against her. She is acquitted, but her accusers are put to death.<P>The story told in the Septuagint (87) is essentially the same, though varying somewhat in details. Versions 1-4 seem to have been prefixed for clearness by Theodotion, for in Susanna verse 7 of the Septuagint Susanna is introduced for the first time: "These seeing a woman of beautiful appearance called Susanna, the wife of one of the Israelites," etc. The original text began therefore with verse 5, though in a slightly different form. Septuagint omits verses 15-18 which tell of the two elders concealing themselves and watching as Susanna entered the park and took her bath. There is not a word in Septuagint concerning the threats of the elders to defame Susanna in the event of her refusing what they desired (verses 20ff); this omission makes the Septuagint form of the story obscure, suggesting that this section has fallen out by error. Nor does the Septuagint mention the crying out of Susanna and the elders (verse 24). The trial took place in the house, according to Theodotion (and English Versions of the Bible) (verse 28), but, according to Septuagint, in the synagogue (verse 28). In Septuagint (verse 30) it is said that the number of Susanna\'s relatives, servants and servant-maids present at the trial was 500; Theodotion is silent on this. Septuagint (verse 35) makes Susanna pray to God before her condemnation, but Theodotion (English Versions of the Bible, verses 42-44) after. According to Septuagint the young man whom the elders falsely said they found with Susanna escaped unobserved because masked; Theodotion says he got away because the elders had not strength to hold him (verse 39). Septuagint is silent about the two maids who, according to Theodotion (verse 36), accompanied Susanna to the bath. Theodotion does not speak of the angel who according to Septuagint imparted to Daniel the wisdom he displayed (but compare Theodotion, verse 50); but on the other hand he adds the words ascribed to Daniel (verse 51, English Versions), though he leaves out the words imputed to him by Septuagint (= even elders may lie). Septuagint omits the words of the people addressed to Daniel: "What mean these words which thou hast spoken?" (verse 47, Theodotion, English Versions of the Bible). According to Theodotion (verse 50) the people entreated Daniel to act as judge among them; Septuagint omits this statement. Two questions were put to the elders, according to the Septuagint: "Under what kind of tree?" "In what part of the park?" but only one, according to Theodotion (and English Versions of the Bible): "Under what kind of tree?" Septuagint has it that as a punishment the two elders were hurled down the precipice; according to Theodotion they were slain (verse 62). In the last two verses (verses 63f) Septuagint points the moral of the story, but Theodotion closes by describing the joy of Susanna\'s relatives at the happy issue of the trial and the increased respect in which Daniel came to be held. For the dependence of the version see <a href="./study/isbe/search.html?string=TEXT+AND+MANUSCRIPTS+OF+THE+NEW+TESTAMENT">TEXT AND MANUSCRIPTS OF THE NEW TESTAMENT</A>; <a href="./study/isbe/search.html?string=TEXT+OF+THE+OLD+TESTAMENT">TEXT OF THE OLD TESTAMENT</A>; <a href="./study/isbe/search.html?string=VERSIONS">VERSIONS</A>.<P>4. Fact or Fiction?:<P>It is quite evident that the story is a fabrication and that it came to be attached to Daniel on account of the part played in it by Daniel the judge.<P>(1) The form of the story differs in Septuagint, Theodotion and the various Syriac recensions, showing that it was a floating legend, told in manifold ways.<P>(2) No confirmation of what is here narrated has been discovered in written or epigraphic sources.<P>(3) The grounds on which Susanna was condemned are trivial and wholly inadequate.<P>(4) The conduct of the judge, Daniel, is unnatural and arbitrary.<P>Though, however, the story is fictitious, it rests in part or wholly on older sources.<P>(1) Ewald (Geschichte(3), IV, 386) believed that it was suggested by the Babylonian legend in which two old men are seduced by the goddess of love (compare Koran 2 96).<P>(2) Brull (Das apokryphische Sus-Buch, 1877), followed by Ball (Speaker\'s Apocrypha, II, 323-31), Marshall and R. H. Charles, came to the following conclusions:<P>(a) That the first half of the story rests on a tradition regarding two elders (Ahab and Zedekiah) who seduced certain women by persuading them that they would thus become the mother of the Messiah. This tradition has its origin probably in <a onClick="return mV(\'Jer\',29,\'21-23\');">Jer 29:21-23</a>, where it is said that Yahweh would sorely punish Ahab and Zedekiah because they had "committed villany in Israel," having "committed adultery with their neighbours\' wives" (the King James Version). We can trace the above story amid many variations in the writings of Origen and Jerome and in sundry rabbinical works.<P>(b) The trial scene is believed to have a wholly different origin. It is said to have arisen about 100-96 BC, when Simon ben Shetach was president of the Sanhedrin. His son was falsely accused of a capital offense and was condemned to death. On the way to execution the accusers admitted that he was innocent of the crime; yet at his own request the son is executed in order that the father\'s hands might be strengthened in the inauguration of new reforms in the administration of justice. The Pharisees and Sadducees differed as to the punishment to be meted out to false witnesses where the death sentence was involved. The first party advocated a stricter examination of witnesses, and a severer penalty if their testimony could be proved false. The Sadducee party took up a more moderate position on both points. Susanna has been held to be a kind of tract setting forth by example the views of the Pharisee party. If this opinion of the origin of Susanna be accepted, this tract was written by a Palestinian Jew, a position rendered probable by other considerations.<P>5. Date:<P>If, as the Greek, Latin and Syriac churches held and hold, Susanna forms an integral part of Daniel, the date of this last book (see <a href="./study/isbe/search.html?string=DANIEL">DANIEL</a>) is the date of Sus. But there is conclusive evidence that the three "Additions" circulated independently, though we have no means of fixing the date with any certainty. Perhaps this piece arose during the struggles between the Pharisees and Sadducees about 94-89 BC; see preceding section. In that case 90 BC would be a suitable date. On the date of Theodotion\'s translation see <a href="./study/isbe/search.html?string=DANIEL">DANIEL</A>; <a href="./study/isbe/search.html?string=BEL+AND+THE+DRAGON">BEL AND THE DRAGON</A>; <a href="./study/isbe/search.html?string=VERSIONS">VERSIONS</A>; <a href="./study/isbe/search.html?string=TEXT+AND+MANUSCRIPTS+OF+THE+NEW+TESTAMENT">TEXT AND MANUSCRIPTS OF THE NEW TESTAMENT</A>; <a href="./study/isbe/search.html?string=TEXT+OF+THE+OLD+TESTAMENT">TEXT OF THE OLD TESTAMENT</A>.<P>6. Original Language:<P>Our materials for judging of the language in which the author wrote are slender, and no great probability can at present be reached. The following scholars argue for a Greek original: Fritzsche, De Wette, Keil, Herzfeld, Graf, Holtzmann. The following are some of the grounds:<P>(1) There are several paronomasias or word-plays, as in Susanna verses 54f; schinon ("under a mastick tree")...schisei ("will cut"); verses 58f; prinon ("under a holm tree")...prisai ("to cut"). But this last word (prisai) is absent from the true Septuagint, though it occurs in Theodotion (Swete\'s text, verse 59, has kataprise from the same root). If the word-play in verses 58f is due to a translation based on Septuagint, the first example (verses 54f), found in Septuagint and Theodotion, is as likely to be the work of the translator of those verses from the Hebrew.<P>(2) It is said that no trace of a Hebrew original has been discovered; but up to a few years ago the same statement could have been made of Sir.<P>There is a growing opinion that the author wrote in Hebrew (or Aramaic?); so Ball, J. T. Marshall, R. H. Charles.<P>(1) The writer was almost certainly a Palestinian Jew, and he would be far more likely to write in his own language, especially as he seems to have belonged to the Pharisaic party, who were ardent nationalists (see preceding section, at end).<P>(2) There is a goodly number of Hebraisms, rather more than one would expect had the writer composed in Hellenistic Greek<P>For versions and literature see <a href="./study/isbe/search.html?string=BEL+AND+THE+DRAGON">BEL AND THE DRAGON</A>; <a href="./study/isbe/search.html?string=DANIEL">DANIEL</A>; the Oxford Apocrypha, edition by R. H. Charles, 638ff.``33';
isbe[8519]='Susi`su\'-si, soo\'-si (cuci): Father of Gaddi, one of the spies, who represented the tribe of Manasseh (<a onClick="return mV(\'Num\',13,11);">Nu 13:11</a>).``1';
isbe[8520]='Swaddle; Swaddling-Band`swod\'-\'-l, swod\'-ling-band (verb chathal, "enwrap," "swaddle" (<a onClick="return mV(\'Eze\',16,4);">Eze 16:4</a>), noun chathullah, "swaddling-band" (<a onClick="return mV(\'Job\',38,9);">Job 38:9</a>); verb sparganoo, "to wrap in swaddling clothes" (<a onClick="return mV(\'Luk\',2,7,12);">Lu 2:7,12</a>), noun spargana (pl.), "swaddling clothes" (The <span class="noTag">Wisdom of Solomon 7:4</span>). the King James Version also has "swaddle" (<a onClick="return mV(\'Lam\',2,22);">La 2:22</a>) for Taphach, literally, "to extend." But the word means "to carry on the outstretched palms of the hands" (compare Tippuchim, "dandled in the hands," <a onClick="return mV(\'Lam\',2,20);">La 2:20</a>), whence RV\'s "to dandle"): "To swaddle" and "to swathe" are really the same word, both forms going back to an AS form swethel, "a bandage," but "swaddle" has become the technical term for the wrapping of an infant in the Orient or elsewhere. The oriental swaddling-clothes consist of a square of cloth and two or more bandages. The child is laid on the cloth diagonally and the corners are folded over the feet and body and under the head, the bandages then being tied so as to hold the cloth in position. This device forms the clothing of the child until it is about a year old, and its omission (<a onClick="return mV(\'Eze\',16,4);">Eze 16:4</a>) would be a token that the child had been abandoned. The mention of darkness as a "swaddling-band" at the birth of the sea (<a onClick="return mV(\'Job\',38,9);">Job 38:9</a>) is only a poetic way of saying that the sea, at its creation, was covered with clouds and darkness, and to find any idea of restraint involved is fanciful.``48';
isbe[8521]='Swallow`swal\'-o (deror; strouthos, in Proverbs and Psalms, chelidon, in Isa; Latin Hirundo rustica): A small long-winged bird of exhaustless flight, belonging to the family Hirundinidae. Deror means the bird of freedom, and as the swallow is of tireless wing, it has been settled upon as fitting the requirements of the text. In the passages where \'aghur is translated "swallow," there is a mistake, that word referring to the crane. There is also a word, cuc or cic, that means a rushing sound, that is incorrectly translated "swallow," when it should be "swift" (Cypselus apus).<P>These birds are near relatives and so alike on the wing as to be indistinguishable to any save a close observer. Yet the Hebrews knew and made a difference. The swallow is a trifle larger and different in color. It remains all the year, while in numerous instances the swift migrates and is a regular sign of returning spring. The swallow is of long and tireless flight. The swift is so much faster that the sound of its wings can be heard when passing. The swallow plasters a mud nest under eaves, on towers, belfries, and close to human habitations. The swifts are less intimate, building in deserted places, under bridges and on rocky crevices. The swallows utter constantly a rather sweet low note; the swifts chatter harshly and incessantly at their nests. These differences are observable to the most careless people. Scientists separate the birds on account of anatomical structure also. Despite this, the birds are confused in most of our translations.<P class="in15">"Like a swallow or a crane, so did I chatter;<br>I did moan as a dove; mine eyes fail with looking upward:<br>O Lord, I am oppressed, be thou my surety"<br>(<a onClick="return mV(\'Isa\',38,14);">Isa 38:14</a>).<P>Here \'aghur is translated "swallow" and cuc "crane," which is clearly interchanging words, as the Arabic for "swift" is cuc, the same as the Hebrew. The line should read, "swift and crane." And another reason for changing swallow to swift, in this passage, lies in the fact that of the two birds the swift is the incessant and raucous chatterer, and this was the idea in the mind of Hezekiah when he sang his Trouble Song. Another incorrect reference is found in <a onClick="return mV(\'Jer\',8,7);">Jer 8:7</a>: "Yea, the stork in the heavens knoweth her appointed times; and the turtle-dove and the swallow and the crane observe the time of their coming; but my people know not the law of Yahweh." Few swallows migrate. Returning swifts are one of the first signs of spring.<P class="in15">"As the sparrow in her wandering, as the swallow in her flying,<br>So the curse that is causeless alighteth not"<p class="in15"> (<a onClick="return mV(\'Pro\',26,2);">Pr 26:2</a>).<P>This reference might apply to either, remembering always that the swift took its name from its exceptional flight, it being able to cover over 80 miles an hour. However, the swallow is credited with 800 miles in a night.<P class="in15">"Yea, the sparrow hath found her a house,<br>And the swallow a nest for herself, where she may lay her young,<br>Even thine altars, O Yahweh of hosts,<br>My King, and my God"<p class="in15" (<a onClick="return mV(\'Psa\',84,3);">Ps 84:3</a>).<P>Here is one instance, at least, where the swallow is at home and the translation correct. The swift might possibly have built in the temple: the swallow was sure to be there.``167';
isbe[8522]='Swan`swon (tinshemeth, "chameleon," "tree-toad," "water-hen," "owl"; kuknos; Latin cygnus; Anglo-Saxon: swan and swon): Mentioned only in old versions and the Revised Version margin in <a onClick="return mV(\'Lev\',11,18);">Le 11:18</a>: "the swan, and the pelican, and the gier eagle," and in <a onClick="return mV(\'Deu\',14,16);">De 14:16</a> Septuagint porphurion = "water-hen"; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) ibis). In the Revised Version (British and American) this is rightly changed to "the horned owl, and the pelican, and the vulture." A bird of the duck family wrongly placed among the abominations in old versions of the Bible, now changed to horned owl.<P>White and gray swans spend their winter migratory season on the waters of the Holy Land. They are among the most ancient birds of history; always have been used for food; when young and tender, of fine flesh and delicious flavor; so there is no possibility that they were ever rightfully placed among the birds unsuitable for food. Their feeding habits are aquatic, their food in no way objectionable.``167';
isbe[8523]='Swearing`swar\'-ing.`<a href="./study/isbe/search.html?string=OATH">OATH</a>; <a href="./study/isbe/search.html?string=PERJURY">PERJURY</a>; <a href="./study/isbe/search.html?string=CRIMES">CRIMES</a>; <a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[8524]='Sweat`swet (ze\'ah (<a onClick="return mV(\'Gen\',3,19);">Ge 3:19</a>), yeza\' (<a onClick="return mV(\'Eze\',44,18);">Eze 44:18</a>); hidros (2Macc 2:26; <a onClick="return mV(\'Luk\',22,44);">Lu 22:44</a>)): "In the sweat of thy face shalt thou eat bread" (<a onClick="return mV(\'Gen\',3,19);">Ge 3:19</a>). Somewhat difficult is the passage, which the Revised Version (British and American) renders: "But the priests the Levites, the sons of Zadok...shall have linen tires upon their heads, and shall have linen breeches upon their loins; they shall not gird themselves with anything that causeth sweat," literally, "they shall not gird themselves with sweat" (<a onClick="return mV(\'Eze\',44,15,18);">Eze 44:15,18</a>). The idea is evidently that profuse perspiration would make their ministrations unpleasant. The rule was of special importance in the sultry climate of Palestine.<P>Luke, the physician, describing the agony of the Lord in Gethsemane, says: "His sweat became as it were great drops (thromboi) of blood falling down upon the ground" (<a onClick="return mV(\'Luk\',22,44);">Lu 22:44</a>, the Revised Version (British and American), following Codex Sinaiticus (a), Codex Alexandrinus, Codex Vaticanus etc., notes in margin: "Many ancient authorities omit <a onClick="return mV(\'Luk\',22,43,44);">Lu 22:43,44</a>"). There are two difficulties of interpretation in this passage, apart from the difficulty which the physiological explanation of the phenomenon presents:<P>(1) the word (thrombos) translated "drop" means literally, "a clot of blood," "a lump," "a curd," and is nowhere else used in the sense of drop.<P>(2) It has been generally accepted that the sweat of the brow of Jesus had become bloody in appearance and in character, a symptom called in ancient medicine haimatodes hidros, "bloody sweat."<P>It must, however, be observed that this translation would make the Greek particle hosei, superfluous, by which, not the identity of the sweat with drops of blood, but a certain similarity or comparison must be intended. Ch. Th. Kuinoel, in his Latin commentary on the historical books of the New Testament (Leipzig,1809,II, 654), has given all known parallel instances in history and legend, which seem to prove that under certain psychological or physiological conditions, though rarely, haimatodes hidros has occurred.<P>Olshausen in his Commentary, II, 469, thinks that the following points of comparison might have been in the mind of Luke:<P>(1) the sweat may have appeared on the forehead of Jesus in heavy drops;<P>(2) these may have dropped visibly to the ground, just as drops of blood fall from a wound;<P>(3) in addition, possibly a reddish color may have been noticeable, owing to an exudation of the arteries, though the latter is not directly expressed in the words of the evangelist. See also Dr. Stroud, On the Physical Cause of the Death of Christ, 183; Bynaeus, De morte Christi, II, 33.<P>The people of Palestine in Greek-Roman times were generally provided with handkerchiefs, used especially to wipe off the perspiration. The fashion was derived from Rome, whence the name of these napkins became soudarion, Latin sudarium. The late legend of Berenice or Veronica, who presented her handkerchief to the Saviour on His way to be crucified, and who found, when it had been returned to her by the Lord, that His features had been imprinted upon the cloth, is a reminiscence of this use. These handkerchiefs were frequently used to tie up small bundles of certain possessions, money, etc. (<a onClick="return mV(\'Luk\',19,20);">Lu 19:20</a>). As a rule the dead had their faces covered with one, or had it tied around the head (<a onClick="return mV(\'Jhn\',11,44);">Joh 11:44</a>; <a onClick="return mV(\'Jhn\',20,7);">20:7</a>). In Ephesus the handkerchiefs of Paul were carried to the sick, and achieved miraculous cures (<a onClick="return mV(\'Act\',19,12);">Ac 19:12</a>).<P>The verb hidroo, "to sweat," is found in a rather difficult passage of the Didache (i.6), which is introduced as a quotation, the source of which, however, we do not know: "Let thy alms sweat into (in ?) thy hands, until thou knowest to whom thou givest." The context seems to show that we have here a free repetition of the arguments of Sirach 12:1ff. so that the meaning would be: "In giving charity, do not give indiscriminately or thoughtlessly, but consider carefully so that no one who is unworthy receive your benefaction." Still it is not impossible that the text is corrupt in the passage.``106';

isbe[8526]='Sweet Incense`See <a href="./study/isbe/search.html?string=SPICES">SPICES</A>.``1';
isbe[8527]='Swell`swel (tsabhah): In the ordeal of the Water of Jealousy described in <a onClick="return mV(\'Num\',5,\'11-31\');">Nu 5:11-31</a> (P), the effect on the unfaithful wife ot the drinking of the holy water was to cause the thigh to fall away (Revised Version) or rot (the King James Version) and the abdomen to "swell." This ceremonial was a direct appeal to the judgment of God, for there was nothing in the holy water (taken from the laver) or the dust of the temple which was mixed with it to produce this effect. In the Talmudic tract Cotah there are given many rabbinical opinions and particulars as to the procedure in later times. Apparently from the passage in Numbers, the judgment speedily followed the appeal, but according to Sotah, iii.4, it might be postponed even for four years, and in v.1, it is said to have produced the same effect on the adulterer as on the unfaithful wife. We have no details as to the nature or permanency of the swelling.<P>"Swell" as the translation of another word, batseq, is used in the sense of blistering of the feet from long tramping. Both in <a onClick="return mV(\'Deu\',8,4);">De 8:4</a> and <a onClick="return mV(\'Neh\',9,21);">Ne 9:21</a> it is said that in spite of their long wilderness marches the feet of the Israelites did not swell. This was a token of divine protection.`<a href="./study/isbe/search.html?string=SWOLLEN">SWOLLEN</a>`107';
isbe[8528]='Swelling`swel\'-ing: The verb ga\'-ah, means "rise up" (<a onClick="return mV(\'Eze\',47,5);">Eze 47:5</a>, etc.), so that the noun ga\'awah (<a onClick="return mV(\'Psa\',46,3);">Ps 46:3</a>) means "arising." The "swelling" of the sea that shakes the mountains is a perfectly good translation, and "pride" (so the American Revised Version margin) is beside the mark. In <a onClick="return mV(\'Jer\',12,5);">Jer 12:5</a>; <a onClick="return mV(\'Jer\',49,19);">49:19</a> parallel <a onClick="return mV(\'Jer\',50,44);">50:44</a>; <a onClick="return mV(\'Zec\',11,3);">Zec 11:3</a> is found the phrase ge\'on ha-yarden, "exaltation of the Jordan," which the King James Version translates "pride of Jordan" in Zechariah and "swelling of Jordan" in Jeremiah (the Revised Version (British and American) has "pride" throughout, with "swelling" in the margin of Jeremiah). What is described is a place, with a mass of vegetation, easily burned (<a onClick="return mV(\'Zec\',11,\'1-3\');">Zec 11:1-3</a>), a lair of lions (<a onClick="return mV(\'Jer\',49,19);">Jer 49:19</a>; <a onClick="return mV(\'Zec\',11,3);">Zec 11:3</a>), and a particularly dangerous place for human beings (<a onClick="return mV(\'Jer\',12,5);">Jer 12:5</a>). The luxuriant thicket of the Jordan bank is evidently meant, which could well be spoken of as "Jordan\'s pride" (OHL, "majesty of the Jordan"), and "swelling" is quite impossible.<P>In the New Testament "swelling" is used in <a onClick="return mV(\'2Cr\',12,20);">2Co 12:20</a> for phusiosis, "puffing up," "blatant self-conceit," and <a onClick="return mV(\'2Pe\',2,18);">2Pe 2:18</a> parallel <a onClick="return mV(\'Jud\',1,16);">Jude verse 16</a> for huperogkos, "overgrown," "solemnly inane."``48';
isbe[8529]='Swift``<a href="./study/isbe/search.html?string=SWALLOW">SWALLOW</a>`1';
isbe[8530]='Swift Beasts`(kirkaroth (<a onClick="return mV(\'Isa\',66,20);">Isa 66:20</a>)): the King James Version and the English Revised Version "swift beasts," the English Revised Version margin and the American Standard Revised Version "dromedaries." In <a onClick="return mV(\'Mic\',1,13);">Mic 1:13</a> (rekhesh) a horse is meant, the Revised Version (British and American) "swift steed."`<a href="./study/isbe/search.html?string=CAMEL">CAMEL</a>; <a href="./study/isbe/search.html?string=HORSE">HORSE</a>`1';
isbe[8531]='Swine`swin (chazir; compare Arabic khinzir; hus, Septuagint and New Testament; compare Greek sus, and Latin sus; adjective hueios, as a substantive, the Septuagint; choiros, Septuagint and New Testament): In both ancient and modern times domestic swine have been little kept in Palestine, but wild swine are well known as inhabitants of the thickets of the Chuleh, the Jordan valley, the Dead Sea, and some of the mountains. The species is Susanna scrofa, the wild pig of Europe, North Africa and Western Asia.<P>In the Old Testament the swine is mentioned in <a onClick="return mV(\'Lev\',11,7);">Le 11:7</a> and <a onClick="return mV(\'Deu\',14,8);">De 14:8</a> as an unclean animal: "And the swine, because he parteth the hoof, and is clovenfooted, but cheweth not the cud, he is unclean unto you." In <a onClick="return mV(\'Isa\',65,4);">Isa 65:4</a> and <a onClick="return mV(\'Isa\',66,3,17);">66:3,17</A> the eating of swine\'s flesh and the offering of oblations of swine\'s blood are referred to as abominations. Septuagint also refers to swine in three passages where these animals are not mentioned in the Hebrew and EV. In <a onClick="return mV(\'2Sa\',17,8);">2Sa 17:8</a> where English Versions of the Bible has "as a bear robbed of her whelps in the field," Septuagint adds (translation) "and as a savage boar in the plain." In <a onClick="return mV(\'1Ki\',21,19);">1Ki 21:19</a> Septuagint 20:19), where English Versions of the Bible has "in the place where dogs licked the blood of Naboth," Septuagint has "where the swine and the dogs licked"; similarly in <a onClick="return mV(\'1Ki\',22,38);">1Ki 22:38</a>. In 1Macc 1:47 there is reference to a decree of Antiochus ordering the sacrifice of swine. In 2Macc 6 and 7 there are accounts of the torture and death of Eleazar, an aged scribe, and of a mother and her seven sons for refusing to taste swine\'s flesh. Swine, the property of Gentiles, are mentioned in the account of the Gadarene demoniac (<a onClick="return mV(\'Mat\',8,30,31,32);">Mt 8:30,31,32</a>; <a onClick="return mV(\'Mar\',5,11,12,13,14,16);">Mr 5:11,12,13,14,16</a>; <a onClick="return mV(\'Luk\',8,32,33);">Lu 8:32,33</a>), and in the parable of the Prodigal Son (<a onClick="return mV(\'Luk\',15,15,16);">Lu 15:15,16</a>).<P>Figurative: We find the following figurative references to swine:<P class="in15">"The boar out of the wood doth ravage it,<br>And the wild beasts of the field feed on it" (i.e. on the "vine out of Egypt")<br>(<a onClick="return mV(\'Psa\',80,13);">Ps 80:13</a>);<P class="in15">"As a ring of gold in a swine\'s snout,<br>So is a fair woman that is without discretion"<br>(<a onClick="return mV(\'Pro\',11,22);">Pr 11:22</a>);<P>"The Carmonians (the King James Version Carmanians, perhaps of Kirman or Carmania, in southwestern Persia) raging in wrath shall go forth as the wild boars of the wood" (2Esdras 15:30);<P>"The dog turning to his own vomit again, and the sow that had washed to wallowing in the mire" (<a onClick="return mV(\'2Pe\',2,22);">2Pe 2:22</a>; compare <a onClick="return mV(\'Pro\',26,11);">Pr 26:11</a>).``37';
isbe[8532]='Swollen`swol\'-\'-n (pimprasthai, only in <a onClick="return mV(\'Act\',28,6);">Ac 28:6</a>): The Melitans expected to see Paul poisoned by the viper\'s bite. the Revised Version (British and American) and the King James Version translate it "swollen," but the word is used by certain medical writers in the sense of inflammation; see Nicander, Theriaca, 306; Hesiod, Theogonia, 856, expressing thereby the burning up by a thunderbolt. Swelling accompanies the local lesion of snake-bite and often large purpuric exudation of blood, as well as paralysis, especially of the lower limbs.``1';
isbe[8533]='Sword`sord.`<a href="./study/isbe/search.html?string=ARMOR">ARMOR</a>`1';
isbe[8534]='Sycamine, Tree`sik\'-a-min, (sukaminos (<a onClick="return mV(\'Luk\',17,6);">Lu 17:6</a>)): This is generally accepted as the black mulberry tree (Morus nigra; Natural Order, Urlicaceae), known in Arabic as tut shrami, "the Damascus mulberry," a fine tree which grows to the height of 30 ft. It produces the dark blood-red mulberry juice referred to in 1Macc 6:34 (moron), "the blood of...mulberries," which was shown to the elephants of the Syrians. The white mulberry, M. alba, has white and less juicy fruit, and it is cultivated largely for the sake of its leaves with which the silkworms of the Lebanon are fed.``117';
isbe[8535]='Sycamore`sik\'-a-mor.`<a href="./study/isbe/search.html?string=SYCOMORE">SYCOMORE</a>`1';
isbe[8536]='Sychar`si\'-kar (Suchar): Mentioned only once, in connection with the visit of Jesus to Jacob\'s Well (<a onClick="return mV(\'Jhn\',4,5);">Joh 4:5</a>). He was passing through Samaria on His way to Galilee, "so he cometh to a city of Samaria, called Sychar, near to the parcel of ground that Jacob gave to his son Joseph: and Jacob\'s well was there." Jerome thought the name was a clerical error for Sychem (Epistle 86). In Eusebius (in Onomasticon) he is content to translate Eusebius, placing Sychar east of Neapolis. It is now generally admitted that the text is correct. Some have held, however, that Sychar is only another name for Shechem ("Sychem"). It is suggested, e.g., that it is a nickname applied in contempt by the Jews, being either shikkor, "drunken," or sheqer, "falsehood." Others think the form has arisen through change of "m" to "r" in pronunciation; as "l" to "r" in Beliar. These theories may safely be set aside. The evidence that Sychar was a distinct place east of Shechem may be described as overwhelming. It is carefully and perspicuously marshaled by G. A. Smith (Historical Geography of the Holy Land, 367ff). The manner in which it is mentioned shows that it was not a specially well-known place: "a city of Samaria called Sychar." No one familiar with Palestine would have written "a city of Samaria called Sychem." It is mentioned only because of its nearness to the well.<P>As to the position of the well, there is general agreement (see <a href="./study/isbe/search.html?string=JACOB\'S+WELL">JACOB\'S WELL</A>). It is on the right of the road where it bends from the plain of Makhneh into the pass of Shechem. Fully half a mile off, on the edge of the plain, is the village of \'Askar, on the lower slope of Ebal. A little to the west is the traditional tomb of Joseph. This is the district east of Shechem usually identified with Jacob\'s "parcel of ground." Many have sought to find Sychar in the modern \'Askar. There are two difficulties. The first is the initial letter \'ain in the modern name. But G. A. Smith has shown that such a change as this, although unusual, is not impossible. The second is the presence of the copious spring, \'Ain \'Askar, which would make it unnecessary for the villagers to carry water from Jacob\'s Well. This cannot easily be explained away. One could understand a special journey at times, if any peculiar value attached to the water in the well; but from it, evidently, the woman drew her ordinary supplies (<a onClick="return mV(\'Jhn\',4,15);">Joh 4:15</a>). This difficulty would probably in any case be fatal to the claim of the village at \'Ain \'Askar to represent the ancient Sychar. But Professor R. S. A. Macalister has shown reason to believe that the village is not older than Arab times (PEFS, 1907, 92ff). He examined the mound Telul Balata, nearly 1/2 mile southwest of \'Askar, and just west of Joseph\'s tomb. There he found evidence of occupation from the days of the Hebrew monarchy down to the time of Christ. Here there is no spring; and it is only 1/4 mile distant from Jacob\'s Well—nearer therefore to the well than to \'Askar. In other respects the site is suitable, so that perhaps here we may locate the Sychar of the Gospel. The name may easily have migrated to \'Askar when the village fell into decay.``54';
isbe[8537]='Sychem`si\'-kem (Suchem): In this form the name of Shechem appears in <a onClick="return mV(\'Act\',7,16);">Ac 7:16</a> the King James Version, in the report of Stephen\'s speech. the King James Version is a transcription from the Greek; the Revised Version (British and American) in accordance with its practice, to give uniformity in the English, follows the Hebrew form of the name given in the Old Testament.``1';
isbe[8538]='Sycomore, Tree`sik\'-o-mor, (shiqmah, Aramaic shiqema\' plural shiqmim; in Septuagint wrongly translated by sukaminos, "the mulberry"; see <a href="./study/isbe/search.html?string=SYCAMINE">SYCAMINE</A> (<a onClick="return mV(\'1Ki\',10,27);">1Ki 10:27</a>; <a onClick="return mV(\'1Ch\',27,28);">1Ch 27:28</a>; <a onClick="return mV(\'2Ch\',1,15);">2Ch 1:15</a>; <a onClick="return mV(\'2Ch\',9,27);">9:27</a>; <a onClick="return mV(\'Isa\',9,10);">Isa 9:10</a>; <a onClick="return mV(\'Amo\',7,14);">Am 7:14</a>): shiqkmoth (<a onClick="return mV(\'Psa\',78,47);">Ps 78:47</a>); sukomoraia (<a onClick="return mV(\'Luk\',19,4);">Lu 19:4</a>)): The sycomore-fig, Ficus sycomorus (Natural Order, Urticaceae), known in Arabic as Jummeiz, is one of the finest of the lowland trees of Palestine, and attains still greater proportions in Lower Egypt. It is evident from <a onClick="return mV(\'1Ki\',10,27);">1Ki 10:27</a>; <a onClick="return mV(\'2Ch\',1,15);">2Ch 1:15</a> that it was once abundant, and at a later period it was so plentiful in the neighborhood of what is now Haifa as to give the name Sykaminon to the town which once stood near there. It is a tree which cannot flourish in the cooler mountain heights; it cannot stand frost (<a onClick="return mV(\'Psa\',78,47);">Ps 78:47</a>). It was one of the distinguishing marks of Lower, as contrasted with Upper, Galilee that the sycomore could flourish there. It is highly improbable that sycomores could ever have flourished near Tekoa (compare <a onClick="return mV(\'Amo\',7,14);">Am 7:14</a>), but it is quite possible that the town or individual inhabitants may have held lands in the Jordan valley or in the Shephelah on which these trees grew. Villages in Palestine today not infrequently possess estates at considerable distances; the village of Silwan (Siloam), for example, possesses and cultivates extensive fertile lands halfway to the Dead Sea. The sycomore produces small, rounded figs, about an inch long, which grow upon tortuous, leafless twigs springing from the trunk or the older branches; they are more or less tasteless. It would appear that in ancient times some treatment was adopted, such as piercing the apex of the fruit to hasten the ripening. Amos was a "nipper" (bolec) of sycomore figs (<a onClick="return mV(\'Amo\',7,14);">Am 7:14</a>). The tree not uncommonly attains a height of 50 ft., with an enormous trunk; in many parts, especially where, as near the coast, the tree grows out of sandy soil, the branching roots stand out of the ground for some distance. The timber is of fair quality and was much valued in ancient times (<a onClick="return mV(\'1Ki\',10,27);">1Ki 10:27</a>; <a onClick="return mV(\'2Ch\',1,15);">2Ch 1:15</a>; <a onClick="return mV(\'2Ch\',9,27);">9:27</a>; <a onClick="return mV(\'Isa\',9,10);">Isa 9:10</a>). Mummy cases and many of the best preserved wooden utensils of ancient Egyptian life are made of it. This tree must be distinguished from the English sycamore, Acer pseudo-platanus (Natural Order, Spindaceae), the "false plane tree," a kind of maple.``117';
isbe[8539]='Syene`si-e\'-ne.`<a href="./study/isbe/search.html?string=SEVENEH">SEVENEH</a>`1';
isbe[8540]='Symeon`sim\'-e-on (Sumeon): the Revised Version (British and American) in <a onClick="return mV(\'Luk\',3,30);">Lu 3:30</a>; <a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>; <a onClick="return mV(\'Act\',15,14);">15:14</a> for the King James Version "<a href="./study/isbe/search.html?string=SIMEON">Simeon</a>" (which see). The persons are:<P>(1) An ancestor of Jesus (<a onClick="return mV(\'Luk\',3,30);">Lu 3:30</a>).<P>(2) Symeon, called Niger, one of the prophets and teachers in the church at Antioch (<a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>).<P>(3) For Simon Peter, see <a href="./study/isbe/search.html?string=PETER">PETER</A>; compare <a onClick="return mV(\'Act\',15,14);">Ac 15:14</a>.`<a href="./study/isbe/search.html?string=SIMEON">SIMEON</a>`1';
isbe[8541]='Synagogue`sin\'-a-gog:<P>1. Name<P>2. Origin<P>3. Spread of Synagogues<P>4. The Building<P class="in15">(1) The Site<P class="in15">(2) The Structure<P class="in15">(3) The Furniture<P>5. The Officials<P class="in15">(1) The Elders<P class="in15">(2) The Ruler<P class="in15">(3) The Servant (or Servants)<P class="in15">(4) Delegate of the Congregation<P class="in15">(5) The Interpreter<P class="in15">(6) The Almoners<P>6. The Service<P class="in15">(1) Recitation of the "Shema\'"<P class="in15">(2) Prayers<P class="in15">(3) Reading of the Law and the Prophets<P class="in15">(4) The Sermon<P class="in15">(5) The Benediction<P>LITERATURE<hr /><P>1. Name:<P>Synagogue, Greek sunagoge, "gathering" (<a onClick="return mV(\'Act\',13,43);">Ac 13:43</a>), "gathering-place" (<a onClick="return mV(\'Luk\',7,5);">Lu 7:5</a>), was the name applied to the Jewish place of worship in later Judaism in and outside of Palestine Proseuche, "a place of prayer" (<a onClick="return mV(\'Act\',16,13);">Ac 16:13</a>), was probably more of the nature of an enclosure, marking off the sacred spot from the profane foot, than of a roofed building like a synagogue. Sabbateion in Ant, XV, i,6,2, most probably also meant synagogue. In the Mishna we find for synagogue beth ha-keneceth, in the Targums and Talmud be-khenishta\', or simply kenishta\'. The oldest Christian meetings and meeting-places were modeled on the pattern of the synagogues, and, in Christian-Palestinian Aramaic the word kenishta\' is used for the Christian church (compare Zahn, Tatian\'s Diatessaron, 335).<P>2. Origin:<P>That the synagogue was, in the time of our Lord, one of the most important religious institutions of the Jews is clear from the fact that it was thought to have been instituted by Moses (Apion, ii, 17; Philo, De Vita Moses, iii.27; compare Targum Jer to <a onClick="return mV(\'Exd\',18,20);">Ex 18:20</a>). It must have come into being during the Babylonian exile. At that time the more devout Jews, far from their native land, having no sanctuary or altar, no doubt felt drawn from time to time, especially on Sabbath and feast days, to gather round those who were specially pious and God-fearing, in order to listen to the word of God and engage in some kind of worship. That such meetings were not uncommon is made probable by <a onClick="return mV(\'Eze\',14,1);">Eze 14:1</a>; <a onClick="return mV(\'Eze\',20,1);">20:1</a>. This would furnish a basis for the institution of the synagogue. After the exile the synagogue remained and even developed as a counterpoise to the absolute sacerdotalism of the temple, and must have been felt absolutely necessary for the Jews of the Dispersion. Though at first it was meant only for the exposition of the Law, it was natural that in the course of time prayers and preaching should be added to the service. Thus these meetings, which at first were only held on Sabbaths and feast days, came also to be held on other days, and at the same hours with the services in the temple. The essential aim, however, of the synagogue was not prayer, but instruction in the Law for all classes of the people. Philo calls the synagogues "houses of instruction, where the philosophy of the fathers and all manner of virtues were taught" (compare <a onClick="return mV(\'Mat\',4,23);">Mt 4:23</a>; <a onClick="return mV(\'Mar\',1,21);">Mr 1:21</a>; <a onClick="return mV(\'Mar\',6,2);">6:2</a>; <a onClick="return mV(\'Luk\',4,15,33);">Lu 4:15,33</a>; <a onClick="return mV(\'Luk\',6,6);">6:6</a>; <a onClick="return mV(\'Luk\',13,10);">13:10</a>; <a onClick="return mV(\'Jhn\',6,59);">Joh 6:59</a>; <a onClick="return mV(\'Jhn\',18,20);">18:20</a>; CAp, ii, 17).<P>3. Spread of Synagogues:<P>In Palestine the synagogues were scattered all over the country, all the larger towns having one or more (e.g. Nazareth, <a onClick="return mV(\'Mat\',13,54);">Mt 13:54</a>; Capernaum, <a onClick="return mV(\'Mat\',12,9);">Mt 12:9</a>). In Jerusalem, in spite of the fact that the Temple was there, there were many synagogues, and all parts of the Diaspora were represented by particular synagogues (<a onClick="return mV(\'Act\',6,9);">Ac 6:9</a>). Also in heathen lands, wherever there was a certain number of Jews, they had their own synagogue: e.g. Damascus (<a onClick="return mV(\'Act\',9,2);">Ac 9:2</a>), Salamis (<a onClick="return mV(\'Act\',13,5);">Ac 13:5</a>), Antioch of Pisidia (<a onClick="return mV(\'Act\',13,14);">Ac 13:14</a>), Thessalonica (<a onClick="return mV(\'Act\',17,1);">Ac 17:1</a>), Corinth (<a onClick="return mV(\'Act\',18,4);">Ac 18:4</a>), Alexandria (Philo, Leg Ad Cai, xx), Rome (ibid., xxiii). The papyrus finds of recent years contain many references to Jewish synagogues in Egypt, from the time of Euergetes (247-221 BC) onward. According to Philo (Quod omnis probus liber sit, xii, et al.) the Essenes had their own synagogues, and, from \'Abhoth 3 10, it seems that "the people of the land," i.e. the masses, especially in the country, who were far removed from the influence of the scribes, and were even opposed to their narrow interpretation of the Law had their own synagogues.<P>4. The Building:<P>(1) The Site.<P>There is no evidence that in Palestine the synagogues were always required to be built upon high ground, or at least that they should overlook all other houses (compare PEFS, July, 1878, 126), though we read in the Talmud that this was one of the requirements (Tos Meghillah, edition Zunz, 4:227; Shabbath 11a). From <a onClick="return mV(\'Act\',16,13);">Ac 16:13</a> it does not follow that synagogues were intentionally built outside the city, and near water for the sake of ceremonial washing (compare Monatsschr. fur Gesch. und Wissensch. des Judenthums,1889, 167-70; HJP II, 370).<P>(2) The Structure.<P>Of the style of the architecture we have no positive records. From the description in the Talmud of the synagogue at Alexandria (Toc Cukkah, edition Zunz, 198 20; Cukkah 51b one imagines the synagogues to have been modeled on the pattern of the temple or of the temple court. From the excavations in Palestine we find that in the building the stone of the country was used. On the lintels of the doors were different forms of ornamentation, e.g. seven-branched candlesticks, an open flower between two paschal lambs, or vine leaves with bunches of grapes, or, as in Capernaum, a pot of manna between two representations of Aaron\'s rod. The inside plan "is generally that of two double colonnades, which seem to have formed the body of the synagogue, the aisles east and west being probably used as passages. The intercolumnar distance is very small, never greater than 9 1/2 ft." (Edersheim). Because of a certain adaptation of the corner columns at the northern end, Edersheim supposes that a woman\'s gallery was once erected there. It does not appear, however, from the Old Testament or New Testament or the oldest Jewish tradition that there was any special gallery for women. It should be noted, as against this conclusion, that in De Vita Contemplativa, attributed by some to Philo, a certain passage (sec. iii) seems to imply the existence of such a gallery.<P>(3) The Furniture.<P>We only know that there was a movable ark in which the rolls of the Law and the Prophets were kept. It was called \'aron ha-qodhesh, but chiefly tebhah (Meghillah 3 1; Nedharim 5 5; Ta\'anith 2 1,2), and it stood facing the entrance. According to Ta\'anith 15a it was taken out and carried in a procession on fast days. In front of the ark, and facing the congregation, were the "chief seats" (see <a href="./study/isbe/search.html?string=CHIEF+SEATS">CHIEF SEATS</A>) for the rulers of the synagogue and the learned men (<a onClick="return mV(\'Mat\',23,6);">Mt 23:6</a>). From <a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a> and <a onClick="return mV(\'Neh\',8,4);">9:4</a> it appears that the bemah (Jerusalem Meghillah 3 1), a platform from which the Law was read, although it is not mentioned in the New Testament, was of ancient date, and in use in the time of Christ.<P>5. The Officials:<P>(1) The Elders.<P>These officials (<a onClick="return mV(\'Luk\',7,3);">Lu 7:3</a>) formed the local tribunal, and in purely Jewish localities acted as a Committee of Management of the affairs of the synagogue (compare Berakhoth 4 7; Nedharim 5 5; Meghillah 3 1). To them belonged, most probably, among other things, the power to excommunicate (compare <a onClick="return mV(\'Ezr\',10,8);">Ezr 10:8</a>; <a onClick="return mV(\'Luk\',6,22);">Lu 6:22</a>; <a onClick="return mV(\'Jhn\',9,22);">Joh 9:22</a>; <a onClick="return mV(\'Jhn\',12,42);">12:42</a>; <a onClick="return mV(\'Jhn\',16,2);">16:2</a>; \'Edhuyoth 5 6; Ta\'anith 3 8; Middoth 2 2).<P>(2) The Ruler.<P>Greek archisunagogos (<a onClick="return mV(\'Mar\',5,35);">Mr 5:35</a>; <a onClick="return mV(\'Luk\',8,41,49);">Lu 8:41,49</a>; <a onClick="return mV(\'Luk\',13,14);">13:14</a>; <a onClick="return mV(\'Act\',18,8,17);">Ac 18:8,17</a>), Hebrew ro\'sh ha-keneseth (Sotah 7 7,8). In some synagogues there were several rulers (<a onClick="return mV(\'Mar\',5,22);">Mr 5:22</a>; <a onClick="return mV(\'Act\',13,15);">Ac 13:15</a>). They were most probably chosen from among the elders. It was the ruler\'s business to control the synagogue services, as for instance to decide who was to be called upon to read from the Law and the Prophets (Yoma\' 7 1) and to preach (<a onClick="return mV(\'Act\',13,15);">Ac 13:15</a>; compare <a onClick="return mV(\'Luk\',13,14);">Lu 13:14</a>); he had to look after the discussions, and generally to keep order.<P>(3) The Servant (or Servants).<P>Greek huperetes; Talmud chazzan (<a onClick="return mV(\'Luk\',4,20);">Lu 4:20</a>; Yoma\' 7 1; Sotah 7 7,8). He had to see to the lighting of the synagogue and to keep the building clean. He it was who wielded the scourge when punishment had to be meted out to anyone in the synagogue (<a onClick="return mV(\'Mat\',10,17);">Mt 10:17</a>; <a onClick="return mV(\'Mat\',23,34);">23:34</a>; <a onClick="return mV(\'Mar\',13,9);">Mr 13:9</a>; <a onClick="return mV(\'Act\',22,19);">Ac 22:19</a>; compare Makkoth 16). From Shabbath 1 3 it seems that the chazzan was also an elementary teacher.<P>See <a href="./study/isbe/search.html?string=EDUCATION">EDUCATION</a>.<P>(4) Delegate of the Congregation.<P>Hebrew sheliach tsibbur (Ro\'sh ha-shanah 4 9; Berakhoth 5 5). This office was not permanent, but one was chosen at each meeting by the ruler to fill it, and he conducted the prayers. According to Meghillah 4 5, he who was asked to read the Scriptures was also expected to read the prayers. He had to be a man of good character.<P>(5) The Interpreter.<P>Hebrew methargeman. It was his duty to translate into Aramaic the passages of the Law and the Prophets which were read in Hebrew (Meghillah 3 3; compare <a onClick="return mV(\'1Cr\',14,28);">1Co 14:28</a>). This also was probably not a permanent office, but was filled at each meeting by one chosen by the ruler.<P>(6) The Almoners.<P>(Dema\'i 3 1; Kiddushin 4 5). Alms for the poor were collected in the synagogue (compare <a onClick="return mV(\'Mat\',6,2);">Mt 6:2</a>). According to Pe\'ah 8 7, the collecting was to be done by at least two persons, and the distributing by at least three.<P>6. The Service:<P>(1) Recitation of the "Shema\'".<P>At least ten persons had to be present for regular worship (Meghillah 4 3; Sanhedhrin 1 6). There were special services on Saturdays and feast days. In order to keep the synagogue services uniform with those of the temple, both were held at the same hours. The order of service was as follows: the recitation of the shema\', i.e. a confession of God\'s unity, consisting of the passages <a onClick="return mV(\'Deu\',6,\'4-9\');">De 6:4-9</a>; <a onClick="return mV(\'Deu\',11,\'13-21\');">11:13-21</a>; .<a onClick="return mV(\'Num\',15,\'37-41\');">Nu 15:37-41</a> (Berakhoth 2 2; Tamidh 5 1). Before and after the recitation of these passages "blessings" were said in connection with the passages (Berakhoth 1 4). This formed a very important part of the liturgy. It was believed to have been ordered by Moses (compare Ant, IV, viii, 13).<P>(2) Prayers.<P>The most important prayers were the Shemoneh \'esreh, "Eighteen Eulogies," a cycle of eighteen prayers, also called "The Prayer" (Berakhoth 4 3; Ta\'anith 2 2). Like the shema\' they are very old.<P>The following is the first of the eighteen: "Blessed art Thou, the Lord our God, and the God of our fathers, the God of Abraham, the God of Isaac, and the God of Jacob: the great, the mighty and the terrible God, the most high God Who showest mercy and kindness, Who createst all things, Who rememberest the pious deeds of the patriarchs, and wilt in love bring a redeemer to their children\'s children for Thy Name\'s sake; O King, Helper, Saviour and Shield! Blessed art Thou, O Lord, the Shield of Abraham."<P>The prayers of the delegate were met with a response of Amen from the congregation.<P>(3) Reading of the Law and the Prophets.<P>After prayers the parashah, i.e. the pericope from the Law for that Sabbath, was read, and the interpreter translated verse by verse into Aramaic (Meghillah 3 3). The whole Pentateuch was divided into 154 pericopes, so that in the course of 3 years it was read through in order. After the reading of the Law came the haphtarah, the pericope from the Prophets for that Sabbath, which the interpreter did not necessarily translate verse by verse, but in paragraphs of 3 verses (Meghillah, loc. cit.).<P>(4) The Sermon.<P>After the reading from the Law and the Prophets followed the sermon, which was originally a caustical exposition of the Law, but which in process of time assumed a more devotional character. Anyone in the congregation might be asked by the ruler to preach, or might ask the ruler for permission to preach.<P>The following example of an old (lst century AD) rabbinic sermon, based on the words, "He hath clothed me with the garments of salvation" (<a onClick="return mV(\'Isa\',61,10);">Isa 61:10</a>, a verse in the chapter from which Jesus took His text when addressing the synagogue of Nazareth), will serve as an illustration of contemporary Jewish preaching:<P>"Seven garments the Holy One—blessed be He!—has put on, and will put on from the time the world was created until the hour when He will punish the wicked Edom (i.e. Roman empire). When He created the world, He clothed Himself in honor and majesty, as it is said (<a onClick="return mV(\'Psa\',104,1);">Ps 104:1</a>): \'Thou art clothed in honor and majesty.\' Whenever He forgave the sins of Israel, He clothed Himself in white, for we read (<a onClick="return mV(\'Dan\',7,9);">Da 7:9</a>): \'His raiment was white as snow.\' When He punishes the peoples of the world, He puts on the garments of vengeance, as it is said (<a onClick="return mV(\'Isa\',59,17);">Isa 59:17</a>): \'He put on garments of vengeance for clothing, and was clad with zeal as a cloke.\' The sixth garment He will put on when the Messiah comes; then He will clothe Himself in a garment of righteousness, for it is said (same place): \'He put on righteousness as a breast-plate, and an helmet of salvation upon His head.\' The seventh garment He will put on when He punishes Edom; then He will clothe Himself in \'adhom, i.e. \'red,\' for it is said (<a onClick="return mV(\'Isa\',63,2);">Isa 63:2</a>): \'Wherefore art Thou red in Thine apparel?\' But the garment which He will put upon the Messiah, this will shine afar, from one end of the earth to the other, for it is said (<a onClick="return mV(\'Isa\',61,10);">Isa 61:10</a>): \'As a bridegroom decketh himself with a garland.\' And the Israelites will partake of His light, and will say:<P class="in15">\'Blessed is the hour when the Messiah shall come!<br>Blessed the womb out of which He shall come!<br>Blessed His contemporaries who are eye-witnesses!<br>Blessed the eye that is honored with a sight of Him!<br>For the opening of His lips is blessing and peace;<br>His speech is a moving of the spirits;<br>The thoughts of His heart are confidence and cheerfulness;<br>The speech of His tongue is pardon and forgiveness;<br>His prayer is the sweet incense of offerings;<br>His petitions are holiness and purity.<br>O how blessed is Israel, for whom such has been prepared!<p class="in15">For it is said (<a onClick="return mV(\'Psa\',31,19);">Ps 31:19</a>):<p class="in15">"How great is Thy goodness, which thou hast laid up for them that fear thee" \' "<br>(Pesiqta\', edition Buber).<P>(5) The Benediction.<P>After the sermon the benediction was pronounced (by a priest), and the congregation answered Amen (Berakhoth 5 4; Sotah 7 2,3).<P>LITERATURE.<P>L. Zunz, Die gottesdienstlichen Vortrage der Juden, 2nd edition; Herzfeld, Geschichte des Volkes Israel, III, 129-37, 183-226; Hausrath, Neutestamentliche Zeitgesch., 2d edition, 73-80; HJP, II, 357-86; GJV4, II; 497-544; Edersheim, Life and Times of Jesus the Messiah, 5th edition, I, 431-50; Oesterly and Box, "The Religion and Worship of the Synagogue," Church and Synagogue, IX, <span class="noTag">number 2</span>, April,1907,p. 46; W. Bacher, article "Synagogue" in HDB; Strack, article "Synagogen," in RE, 3rd edition, XIX.``98';

isbe[8544]='Synagogue, the Great`A college or assembly of learned men, originating with Ezra, to whom Jewish tradition assigns an important share in the formation of the Old Testament Canon, and many legal enactments (see <a href="./study/isbe/search.html?string=CANON+OF+THE+OLD+TESTAMENT">CANON OF THE OLD TESTAMENT</a>). One of its latest members is said to have been Simon the Just (circa 200 BC). The oldest notice of the Great Synagogue is in the tract of the Mishna, Pirqe \'Abhoth (circa 200 AD); this is supplemented by an often-quoted, passage in another tract of the Mishna, Babha\' Bathra\' (14b), on the Canon, and by later traditions. It tells against the reliabe of these traditions that they are late, and are mixed up with much that is self-evidently unhistorical, while no corroboration is found in Ezra or Nehemiah, in the Apocrypha, or in Josephus. On this account, since the exhaustive discussion by Kuenen on the subject (Over de Mannen der Groote Synagoge), most scholars have been disposed to throw over the tradition altogether, regarding it as a distorted remembrance of the great convocation described in <a onClick="return mV(\'Neh\',8,\'1-\');">Ne 8-10</a> (so W. R. Smith, Driver, etc.; compare article by Selbie in HDB in support of total rejection). This probably is an excess of skepticism. The convocation in Nehemiah has no points of resemblance to the kind of assembly recalled in this tradition; and while fantastic details may be unreal, it is difficult to believe that declarations so circumstantial and definite have no foundation at all in actual history. The direct connection with Ezra may be discounted, though possibly—indeed it is likely—somebody associated with Ezra in his undeniable labors on the Canon may have furnished the germ from which the institution in question was developed (see the careful discussion in C. H. H. Wright, <a onClick="return mV(\'Ecc\',1,\'1-\');">Ec 1-10</a>, and Excursus III, "The Men of the Great Synagogue").<P>For the rabbinical quotations and further important details, see C. Taylor\'s Sayings of the Jewish Fathers, 11f and 110 f.``132';
