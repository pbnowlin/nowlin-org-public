isbe[8571]='Tabitha`tab\'-i-tha (Tabeitha).`<a href="./study/isbe/search.html?string=DORCAS">DORCAS</a>`1';
isbe[8572]='Table`"Table" is derived from the Latin tabula, meaning primarily "a board," but with a great variety of other significances, of which "writing-tablet" is the most important for the Biblical use of "table." So in English "table" meant at first "any surface" and, in particular, "a surface for writing," and further specialization was needed before "table" became the name of the familiar article of furniture ("object with a horizontal surface"), a meaning not possessed by tabula in Latin. After this specialization "table" in the sense of "a surface for writing" was replaced in later English by the diminutive form "tablet." But "surface for writing" was still a common meaning of "table," and in this sense it represents luach (<a onClick="return mV(\'Exd\',24,12);">Ex 24:12</a>, etc.), a word of uncertain origin, plax, "something flat" (<a onClick="return mV(\'2Cr\',3,3);">2Co 3:3</a>; <a onClick="return mV(\'Hbr\',9,4);">Heb 9:4</a>), deltos, "a writing tablet" (1Macc 8:22; 14:18,27,48), or pinakidion "writing tablet" (<a onClick="return mV(\'Luk\',1,63);">Lu 1:63</a>—a rather unusual word). the American Standard Revised Version has kept the word in the familiar combination "tables of stone" (<a onClick="return mV(\'Exd\',24,12);">Ex 24:12</a>, etc.), but elsewhere (<a onClick="return mV(\'Pro\',3,3);">Pr 3:3</a>; <a onClick="return mV(\'Pro\',7,3);">7:3</a>; <a onClick="return mV(\'Isa\',30,8);">Isa 30:8</a>; <a onClick="return mV(\'Jer\',17,1);">Jer 17:1</a>; <a onClick="return mV(\'Hab\',2,2);">Hab 2:2</a>; <a onClick="return mV(\'Luk\',1,63);">Lu 1:63</a>) has replaced "table" by "tablet," a change made by the English Revised Version only in <a onClick="return mV(\'Isa\',30,8);">Isa 30:8</a>; <a onClick="return mV(\'Luk\',1,63);">Lu 1:63</a>.<P>See <a href="./study/isbe/search.html?string=TABLET">TABLET</a>.<P>The table as an article of furniture is shulchan, in the Hebrew and trapezal, in the Greek. The only exceptions are <a onClick="return mV(\'Sgs\',1,12);">So 1:12</a>, mecabh, "something round," perhaps a "round table," perhaps a "cushion," perhaps a "festal procession," and <a onClick="return mV(\'Mar\',7,4);">Mr 7:4</a>, the King James Version kline, "couch" (so the Revised Version (British and American)), while <a onClick="return mV(\'Jhn\',13,28);">Joh 13:28</a> and <a onClick="return mV(\'Jhn\',12,2);">Joh 12:2</a>, the King James Version "at the table," and Tobit 7:8, the King James Version "on the table," represent only the general sense of the original. Of the two regular words, shulchan is properly "a piece of hide," and so "a leather mat," placed on the ground at meal time, but the word came to mean any "table," however elaborate (e.g. <a onClick="return mV(\'Exd\',25,\'23-30\');">Ex 25:23-30</a>). Trapeza means "having four feet."<P><a onClick="return mV(\'2Ki\',4,10);">2Ki 4:10</a> seems to indicate that a table was a necessary article in even the simpler rooms. Curiously enough, however, apart from the table of shewbread there is no reference in the Bible to the form or construction of tables, but the simpler tables in Palestine of the present day are very much lower than ours. The modern "tables of the money changers" (<a onClick="return mV(\'Mar\',11,15);">Mr 11:15</a> and parallel\'s) are small square trays on stands, and they doubtless had the same form in New Testament times.<P>See <a href="./study/isbe/search.html?string=SHEWBREAD,+TABLE+OF">SHEWBREAD, TABLE OF</a>; <a href="./study/isbe/search.html?string=MONEY-CHANGERS">MONEY-CHANGERS</a>.<P>To eat at a king\'s table (<a onClick="return mV(\'2Sa\',9,7);">2Sa 9:7</a>, etc.) is naturally to enjoy a position of great honor, and the privilege is made by Christ typical of the highest reward (<a onClick="return mV(\'Luk\',22,30);">Lu 22:30</a>). Usually "to eat at one\'s table" is meant quite literally, but in <a onClick="return mV(\'1Ki\',18,19);">1Ki 18:19</a>; <a onClick="return mV(\'Neh\',5,17);">Ne 5:17</a> (compare <a onClick="return mV(\'1Ki\',10,5);">1Ki 10:5</a>) it probably means "be fed at one\'s expense." On the other hand, the misery of eating the leavings of a table (<a onClick="return mV(\'Jdg\',1,7);">Jud 1:7</a>; <a onClick="return mV(\'Mar\',7,28);">Mr 7:28</a>; <a onClick="return mV(\'Luk\',16,21);">Lu 16:21</a>) needs no comment. The phrase "table of the Lord (Yahweh)" in <a onClick="return mV(\'Mal\',1,7,12);">Mal 1:7,12</a> the King James Version (compare <a onClick="return mV(\'Eze\',41,22);">Eze 41:22</a>; <a onClick="return mV(\'Eze\',44,16);">44:16</a>; <a onClick="return mV(\'Eze\',39,20);">Eze 39:20</a> is quite different) means "the table (altar) set before the Lord," but the same phrase in <a onClick="return mV(\'1Cr\',10,21);">1Co 10:21</a> is used in a different sense and the origin of its use by Paul is obscure. Doubtless the language, if not the meaning, of Malachi had its influence and may very well have been suggested to Paul as he wrote <a onClick="return mV(\'1Cr\',10,18);">1Co 10:18</a>. On the other hand, light may be thrown on the passage by such a papyrus fragment as "Chareimon invites you to dine at the table (kline) of the lord Serapis," a formal invitation to an idol-banquet (<a onClick="return mV(\'1Cr\',8,10);">1Co 8:10</a>; Pap. Oxyr. i.110; compare iii.523). This would explain Paul\'s "table of demons"—a phrase familiar to the Corinthians—and he wrote "table of the Lord" to correspond (compare, however, Pirqe \'Abhoth, iii.4). "Table at which the Lord is Host," at any rate, is the meaning of the phrase. On the whole passage see the comms., especially that of Lietzmann (fullest references). Probably <a onClick="return mV(\'Luk\',22,30);">Lu 22:30</a> has no bearing on <a onClick="return mV(\'1Cr\',10,21);">1Co 10:21</a>. The meaning of <a onClick="return mV(\'Psa\',69,22);">Ps 69:22</a> (quoted in <a onClick="return mV(\'Rom\',11,9);">Ro 11:9</a>), "Let their table before them become a snare," is very obscure ("let them be attacked while deadened in revelings"?), and perhaps was left intentionally vague.``48';
isbe[8573]='Table of Nations`1. The Table and Its Object<P>2. What It Includes and Excludes<P>3. Order of the Three Races<P>4. Extent of Each<P>5. Sons of Japheth<P>6. Sons and Descendants of Ham<P>7. Further Descendants of Ham<P>8. Sons of Shem<P>9. Further Descendants of Shem<P>10. Value of Table and Its Historical Notes<P>11. Further Arguments for Early Date of Table<hr /><P>1. The Table and Its Object:<P>This is the expression frequently used to indicate "the generations of the sons of Noah" contained in <a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10</a>. These occupy the whole chapter, and are supplemented by <a onClick="return mV(\'Gen\',11,\'1-9\');">Ge 11:1-9</a>, which explain how it came about that there were so many languages in the world as known to the Hebrews. The remainder of <a onClick="return mV(\'Gen\',11,\'1-\');">Genesis 11</a> traces the descent of Abram, and repeats a portion of the information contained in <a onClick="return mV(\'Gen\',10,\'1-\');">Genesis 10</a> on that account only. The whole is seemingly intended to lead up to the patriarch\'s birth.<P>2. What It Includes and Excludes:<P>Noah and his family being the only persons left alive after the Flood, the Table naturally begins with them, and it is from his three sons, Shem, Ham and Japheth, that the inhabitants of the earth, as known to the Hebrews, were descended. All others—the Mongolians of the Far East and Japan, the American Indians, both North and South, the natives of Australia and New Zealand—were naturally omitted from the list. It may, of course, be argued that all the nations not regarded as descended from Shem and Japheth might be included among the descendants of Ham; but apart from the fact that this would give to Ham far more than his due share of the human race, it would class the Egyptians and Canaanites with the Mongolians, Indians, etc., which seems improbable. "The Table of Nations," in fact, excludes the races of which the Semitic East was in ignorance, and which could not, therefore, be given according to their lands, languages, families, and nations (<a onClick="return mV(\'Gen\',10,5,20,31);">Ge 10:5,20,31</a>).<P>3. Order of the Three Races:<P>Notwithstanding that the sons of Noah are here (<a onClick="return mV(\'Gen\',10,1);">Ge 10:1</a>) and elsewhere mentioned in the order Shem, Ham and Japheth (<a onClick="return mV(\'Gen\',5,32);">Ge 5:32</a>; <a onClick="return mV(\'Gen\',6,10);">6:10</a>), and Ham was apparently the youngest (see HAM), the Table begins (<a onClick="return mV(\'Gen\',10,2);">Ge 10:2</a>) with Japheth, enumerates then the descendants of Ham (<a onClick="return mV(\'Gen\',10,6);">Ge 10:6</a>), and finishes with those of Shem (<a onClick="return mV(\'Gen\',10,21);">Ge 10:21</a>). This order in all probability indicates the importance of each race in the eyes of the Hebrews, who as Semites were naturally interested most in the descendants of Shem with whom the list ends. This enabled the compiler to continue the enumeration of Shem\'s descendants in <a onClick="return mV(\'Gen\',11,12);">Ge 11:12</a> immediately after the verses dealing with the building of the Tower of Babel and the Confusion of Tongues.<P>4. Extent of Each:<P>The numbers of the descendants of each son of Noah, however, probably bear witness to the compiler\'s knowledge, rather than their individual importance in his eyes. Thus, the more remote and less known race of Japheth is credited with 14 descendants only (7 sons and 7 grandsons), while Ham has no less than 29 descendants (4 sons, 23 grandsons, and 2 great-grandsons), and Shem the same (5 sons, 5 grandsons, 1 great-grandson, and 20 remoter descendants to the 6th generation). Many of the descendants of Shem and Ham, however, are just as obscure as the descendants of Japheth. How far the relationship to the individual sons of Noah is to be taken literally is uncertain. The earlier names are undoubtedly those of nations, while afterward we have, possibly, merely tribes, and in chapter 11 the list develops into a genealogical list of individuals.<P>5. Sons of Japheth:<P>It is difficult to trace a clear system in the enumeration of the names in the Table. In the immediate descendants of Japheth (<a onClick="return mV(\'Gen\',10,2);">Ge 10:2</a>), Gomer, Magog, Tubal and Mesech, we have the principal nations of Asia Minor, but Madai stands for the Medes on the extreme east, and Javan (the Ionians) for the Greeks (? and Romans) on the extreme west (unless the Greeks of Asia Minor were meant). Gomer\'s descendants apparently located themselves northward of this tract, while the sons of Javan extended themselves along the Mediterranean coastlands westward, Tarshish standing, apparently, for Spain, Kittim being the Cyprians, and Rodanim the Rhodians.<P>6. Sons and Descendants of Ham:<P>Coming to the immediate descendants of Ham (<a onClick="return mV(\'Gen\',10,6);">Ge 10:6</a>), the writer begins with those on the south and then goes northward in the following order: Cush or Ethiopia, Mizraim or Egypt, Phut (better Put, the Revised Version (British and American)) by the Red Sea, and lastly Canaan—the Holy Land—afterward occupied by the Israelites. The sons of Cush, which follow (<a onClick="return mV(\'Gen\',10,7);">Ge 10:7</a>), are apparently nationalities of the Arabian coast, where Egyptian influence was predominant. These, with the sons of Raamah, embrace the interior of Africa as known to the Hebrews, and the Arabian tract as far as Canaan, its extreme northern boundary. The reference to Babylonia (Nimrod) may be regarded as following not unnaturally here, and prominence is given to the district on account of its importance and romantic history from exceedingly early times. Nevertheless, this portion (<a onClick="return mV(\'Gen\',10,\'8-12\');">Ge 10:8-12</a>) reads like an interpolation, as it not only records the foundation of the cities of Babylonia, but those of Assyria as well—the country mentioned lower down (<a onClick="return mV(\'Gen\',10,22);">Ge 10:22</a>) among the children of Shem.<P>7. Further Descendants of Ham:<P>The text then goes back to the West again, and enumerates the sons of Mizraim or Egypt (<a onClick="return mV(\'Gen\',10,13);">Ge 10:13</a>), mostly located on the southeastern and eastern shores of the Mediterranean. These include the "Libyans in the narrowest sense" (Lehabim), two districts regarded as Egyptian (Naphtuhim and Pathrusim), the Casluhim from whom came the Philistines, and the Caphtorim, probably not the Cappadocians of the Targums, but the island of Crete, "because such a large island ought not to be wanting" (Dillmann). The more important settlements in the Canaanitish sphere of influence are referred to as the sons of Canaan (<a onClick="return mV(\'Gen\',10,15);">Ge 10:15</a>)—Sidon, Heth (the Hittites), the Jebusites (who were in occupation of Jerusalem when the Israelites took it), the Amorites (whom Abraham found in Canaan), and others. Among the sons of Canaan are, likewise, the Girgashites, the Arkites and Sinites near Lebanon, the Arvadites of the coast, and the Hamathites, in whose capital, Hamath, many hieroglyphic inscriptions regarded as records of the Hittites or people of Heth have been found. It is possibly to this occupation of more or less outlying positions that the "spreading abroad" of the families of the Canaanites (<a onClick="return mV(\'Gen\',10,18);">Ge 10:18</a>) refers. In <a onClick="return mV(\'Gen\',10,19);">Ge 10:19</a> the writer has been careful to indicate "the border of the Canaanites," that being of importance in view of the historical narrative which was to follow; and here he was evidently on familiar ground. 8. Sons of Shem:<P>In his final section—the nations descended from Shem (<a onClick="return mV(\'Gen\',10,21);">Ge 10:21</a>)—the compiler again begins with the farthest situated—the Elamites—after which we have Asshur (Assyria), to the northwest; Arpachshad (? the Chaldeans), to the west; Lud (Lydia), northwest of Assyria; and Aram (the Aramean states), south of Lud and west of Assyria. The tribes or states mentioned as the sons of Aram (Uz, Hul, Gether and Mash), however, do not give the names with which we are familiar in the Old Testament (Aram Naharaim, Aram Zobah, etc.), and have evidently to be sought in different positions, indicating that they represent an earlier stage of their migrations. With regard to their positions, it has been suggested that Uz lay in the neighborhood of the Hauran and Damascus; Hul near the Sea of Galilee; and that Mash stands for Mons Masius. This last, however, may have been the land of Mas, West of Babylonia.<P>9. Further Descendants of Shem:<P>Only one son is attributed to Arpachshad, namely, Shelah (shalach, shelach, <a onClick="return mV(\'Gen\',10,24);">Ge 10:24</a>), unidentified as a nationality. This name should, however, indicate some part of Babylonia, especially if his son, Eber, was the ancestor of the Hebrews, who were apparently migrants from Ur (Mugheir) (see <a href="./study/isbe/search.html?string=ABRAHAM">ABRAHAM</A>; <a href="./study/isbe/search.html?string=UR+OF+THE+CHALDEES">UR OF THE CHALDEES</a>). Though Peleg, "in whose days the land was divided," may not have been an important link in the chain, the explanatory phrase needs notice. It may refer to the period when the fertilizing watercourses of Babylonia—the "rivers of Babylon" (<a onClick="return mV(\'Psa\',137,1);">Ps 137:1</a>)—were first constructed (one of their names was pelegh), or to the time when Babylonia was divided into a number of small states, though this latter seems to be less likely. Alternative renderings for Selah, Eber and Peleg are "sending forth" (Bohlen), "crossing" (the Euphrates), and "separation" (of the Joktanites) (Bohlen), respectively.<P>The Babylonian geographical fragment 80-6-17, 504 has a group explained as Pulukku, perhaps a modified form of Peleg, followed by (Pulukku) sa ebirti, "Pulukku of the crossing", the last word being from the same root as Eber. This probably indicates a city on one side of the river (? Euphrates), at a fordable point, and a later foundation bearing the same name on the other side.<P>Reu, Serug, and Nahor, however, are regarded generally as place-names, and Terah as a personal name (the father of Abram, Nahor and Haran). From this point onward the text (<a onClick="return mV(\'Gen\',11,27);">Ge 11:27</a>) becomes the history of the Israelite nation, beginning with these patriarchs.<P>10. Value of Table and Its Historical Notes:<P>Arguments for its early date.—There is hardly any doubt that we have in this ethnographical section of Genesis one of the most valuable records of its kind. Concerning the criticisms upon it which have been made, such things are unavoidable, and must be regarded as quite legitimate, in view of the importance of the subject. The interpolated sections concerning Nimrod and the Tower of Babel are such as would be expected in a record in which the compiler aimed at giving all the information which he could, and which he thought desirable for the complete understanding of his record. It may be regarded as possible that this information was given in view of the connection of Abraham with Babylonia. In his time there were probably larger cities than Babylon, and this would suggest that the building of the Babylonian capital may have been arrested. At the time of the captivity on the other hand, Babylon was the largest capital in then known world, and the reference to its early abandonment would then have conveyed no lesson—seeing the extent of the city, the reader realized that it was only a short setback from which it had suffered, and its effects had long since ceased to be felt.<P>11. Further Arguments for Early Date of Table:<P>Limits of its information.—For the early date of the Table also speaks the limited geographical knowledge displayed. Sargon of Agade warred both on the east and the west of Babylonia, but he seems to have made no expeditions to the north, and certainly did not touch either Egypt or Ethiopia. This suggests not only that the information available was later than his time, but also that it was obtained from merchants, travelers, envoys and ambassadors. The scantiness of the information about the north of Europe and Asia, and the absence of any reference to the Middle or the Far East, imply that communications were easiest on the west, the limit of trade in that direction being apparently Spain. If it could be proved that the Phoenicians came as far westward as Britain for their tin, that might fix the latest date of the compilation of the Table, as it must have been written before it became known that their ships went so far; but in that case, the date of their earliest journeys thither would need to be fixed. Noteworthy is the absence of any reference to the Iranians (Aryan Persians) on the east. These, however, may have been included with the Medes (Madai), or one of the unidentified names of the descendants of Japheth in <a onClick="return mV(\'Gen\',10,2,3);">Ge 10:2,3</a>.<P>See <a href="./study/isbe/search.html?string=SHEM">SHEM</A>; <a href="./study/isbe/search.html?string=HAM">HAM</A>; <a href="./study/isbe/search.html?string=JAPHETH">JAPHETH</A>, and the other special articles in this Encyclopedia; also, for a great mass of information and theories by many scholars and specialists, Dillmann, Kurzgefasstes exegetisches Handbuch zum Altes Testament, "Die Genesis," Leipzig, 1882; W. Max Muller, Asien und Europa, Leipzig, 1893; and F. Hommel, Grundriss der Geographic und Geschichte des alten Orients, Munich, 1904.``136';
isbe[8574]='Tablet`tab\'-let: A rigid flat sheet (plate, pad or slab) used to receive writing. Stone, clay, wood and perhaps bronze, gold and lead tablets, at least, are mentioned in the Bible. In the Old English sense of "locket" the word is incorrectly used in the King James Version also of what the Revised Version (British and American) translates as "armlets," margin "necklaces" (<a onClick="return mV(\'Exd\',35,22);">Ex 35:22</a>; <a onClick="return mV(\'Num\',31,50);">Nu 31:50</a>) and "perfume boxes" (<a onClick="return mV(\'Isa\',3,20);">Isa 3:20</a>).<P>The technical Hebrew word for tablet, luach, is generally translated in both the King James Version and the Revised Version (British and American) as "table." This is used for stone, wood or metal plates or tablets with or without writing. In Isaiah (<a onClick="return mV(\'Isa\',30,8);">30:8</a>) where the Revised Version (British and American) translates "tablet," it is contrasted with the "roll" and probably means the wood or waxed tablet. In Habakkuk (<a onClick="return mV(\'Hab\',2,2);">2:2</a>, the American Standard Revised Version "tablet," the King James Version and the English Revised Version "table") it perhaps refers to a metal tablet to be erected on a wall, but more likely it refers to the wooden tablet. It is also used in Proverbs (<a onClick="return mV(\'Pro\',3,3);">3:3</a>; <a onClick="return mV(\'Pro\',7,3);">7:3</a>, the American Standard Revised Version "tablet," the King James Version and the English Revised Version "table") and in Jeremiah (<a onClick="return mV(\'Jer\',17,1);">17:1</a>) figuratively of the writing upon the tablets of the heart, the word being rendered in the Septuagint by the same word (plax) used by Paul (<a onClick="return mV(\'2Cr\',3,3);">2Co 3:3</a>, "tables" in the King James Version and the Revised Version (British and American)) in the same figure. In other cases (<a onClick="return mV(\'Exd\',24,12);">Ex 24:12</a>, etc.) it is used of the tablets of stone containing the Decalogue.<P>The word gillayon (<a onClick="return mV(\'Isa\',8,1);">Isa 8:1</a>), which is translated in the Revised Version (British and American) "tablet" and in the King James Version "roll," is elsewhere (<a onClick="return mV(\'Isa\',3,23);">Isa 3:23</a>) translated "mirror," and is thought to mean a blank polished surface for writing, particularly because in later use it means the blank margin of a roll.<P>See <a href="./study/isbe/search.html?string=ROLL">ROLL</A>.<P>The clay tablet is referred to in Ezekiel (<a onClick="return mV(\'Eze\',4,1);">4:1</a>, English Versions of the Bible "tile"), and its use there for a map of the city has been strikingly illustrated in modern excavation by a tablet map discovered at Nippur (Hilprecht, Explorations, 518). Jeremiah (<a onClick="return mV(\'Jer\',32,14);">32:14</a>, the Revised Version (British and American) "deeds," the King James Version "evidences") may also refer to clay tablets, but not surely, since roll deeds were also kept in earthen jars. Job (<a onClick="return mV(\'Job\',19,24);">19:24</a>) is thought by some to refer to the writing on leaden tablets, such as were in very common use in antiquity and in the Middle Ages for the writing of charms and especially curses, but more hold that inscriptions filled with lead are meant here. The plate of pure gold (<a onClick="return mV(\'Exd\',28,36);">Ex 28:36</a>; <a onClick="return mV(\'Lev\',8,9);">Le 8:9</a>), engraved like the gravings of a signet, which was on Aaron\'s miter, may also be properly described as a tablet, recalling the silver treaty between the Hittites and Egyptians and the gold plate on which Queen Helena of Adiabene (Yoma\' 37a; Jewish Encyclopedia, VI, 334) had engraved a passage from the Pentateuch (<a onClick="return mV(\'Num\',5,\'19-22\');">Nu 5:19-22</a>). Bronze tablets (deltos) are several times referred to in 1Maccabees (8:22; 14:18,27,48).<P>"Daleth" (daleth or deleth), the Semitic (Phoenician) original from which the generic Greek word for tablet (deltos) is derived (Gardthausen, p. 124, note 1), is perhaps not found strictly in this meaning in the Old Testament. The word is used, however, of two kinds of written documents and in such a way as to suggest that one is the original of, and the other derived from, the "daleth"-tablet. In <a onClick="return mV(\'Deu\',6,9);">De 6:9</a> and <a onClick="return mV(\'Deu\',11,20);">11:20</A> it is enjoined that the laws of Yahweh shall be written upon the gates of the houses, and in each case the "daleths" (doors) are meant, since the door-posts are also mentioned, and in <a onClick="return mV(\'1Sa\',21,13);">1Sa 21:13</a>, where David "scrabbles," it is expressly said to be upon the "doors" ("daleths") of the gate. This practice of writing upon house doors and city gates corresponds to the modern posting of notices on church doors and scoring of tallies on a door by the rural innkeeper; and the name seems to have passed from this great door tablet to the portable tablet. On the other hand Jeremiah (<a onClick="return mV(\'Jer\',36,23);">36:23</a>) uses "daleths" (English Versions of the Bible "leaves") for the columns of a roll, obviously transferring the term from the panel form of the folding tablets.<P>pinakis, or pinakidion, is found in <a onClick="return mV(\'Eze\',9,2,11);">Eze 9:2,11</a> in the version of Symmachus in place of the "writer\'s inkhorn," and pinakidion, in <a onClick="return mV(\'Luk\',1,63);">Lu 1:63</a>, of the (wooden) tablet on which Zacharias wrote the name of John. Puxion is used several times by Septuagint as the translation for luach, and once (<a onClick="return mV(\'Sgs\',5,14);">So 5:14</a>) for ivory tablets. Sanis is used as the translation of "daleth" or luach 2 or 3 times in the Septuagint and still oftener in the other versions. The most common Greek term both in the New Testament (<a onClick="return mV(\'2Cr\',3,3);">2Co 3:3</a>; <a onClick="return mV(\'Hbr\',9,4);">Heb 9:4</a>) and in the Greek Old Testament is plax, most often used of the tables of stone. This, like platos, which is also used for luach in Septuagint, is not recognized in the modern textbooks (Thompson, Gardthausen, Birt).<P>LITERATURE.<P>Gardthausen, Griechische Palaeog., Leipzig, I (1911), 123-32; compare pp. 24-45.`<a href="./study/isbe/search.html?string=WRITING">WRITING</a>`147';
isbe[8575]='Tabor`ta\'-ber, tar\'-bor (tabhor; Codex Vaticanus Thachcheia; Codex Alexandrinus Thabor): One of the towns in the territory of Zebulun, given to the Merarite Levites (<a onClick="return mV(\'1Ch\',6,77);">1Ch 6:77</a>). The parallel list in <a onClick="return mV(\'Jos\',21,24);">Jos 21:24</a>f contains no name like this. There is no indication of its position. Some have thought that it may correspond to Daberath in the territory of Issachar (<a onClick="return mV(\'Jos\',21,28);">21:28</A>), now represented by Deburiyeh on the western slope of Mt. Tabor; others that it may be the mountain itself; and yet others that it may be a city on the mountain, which probably was occupied from very early times. There is a Tabor mentioned as on the border of Issachar (<a onClick="return mV(\'Jos\',19,22);">Jos 19:22</a>); but that is almost certainly the mountain. It has been suggested that Tabor in <a onClick="return mV(\'1Ch\',6,17);">1Ch 6:17</a> may be a contraction of Chisloth-tabor (<a onClick="return mV(\'Jos\',19,12);">Jos 19:12</a>), the modern Iksal, 3 miles west of the mountain. No certainty is possible.``54';
isbe[8576]='Tabor, Mount`(tabhor, har tabhor; oros Thabor, to Itaburion): This mountain seems to be named as on the border of Issachar (<a onClick="return mV(\'Jos\',19,22);">Jos 19:22</a>). It is possibly identical with the mountain to which Zebulun and Issachar were to call the peoples (<a onClick="return mV(\'Deu\',33,19);">De 33:19</a>). Standing on the boundary between the tribes, they would claim equal rights in the sanctuary on the top. The passage seems to indicate that it was a place of pilgrimage. The worshippers, bringing with them the "abundance of the sea" and the "treasures of the sand," would be a source of profit to the local authorities. The mountain can be no other than Jebel et-Tur, an isolated and shapely height, rising at the northeast corner of the Plain of Esdraelon, about 5 miles west of Nazareth. The mountain has retained its sacred character, and is still a place of pilgrimage, only the rites being changed. The present writer has mingled with great interest among the crowds that assemble there from all parts at the Feast of the Transfiguration.<P>It was on the summit and slopes of this mountain that Deborah and Barak gathered their forces; and hence, they swept down to battle with Sisera in the great plain (<a onClick="return mV(\'Jdg\',4,6,12,14);">Jud 4:6,12,14</a>). Here probably the brothers of Gideon were murdered by Zeba and Zalmunna (<a onClick="return mV(\'Jdg\',8,18);">Jud 8:18</a>). Moore ("Jgs," ICC, at the place) thinks the scene of the slaughter must have been much farther south. He does not see what the brothers of Gideon were doing so far north of their home in Abiezer. There is, however, no reason for placing Ophrah so far to the south as he does; and in any case the men were probably captured and taken to Tabor as prisoners. Josephus (Ant., VII, ii, 3) says it was in one of Solomon\'s administrative districts (compare <a onClick="return mV(\'1Ki\',4,17);">1Ki 4:17</a>). Such a prominent and commanding position must always have invited fortification. In the time of Antiochus the Great, 218 BC, we find a fortress here, which that king took by stratagem, Atabyrion by name (Polyb. v. 70, 6). It was recovered by the Jews, and was held by them under Janneus, 105-70 BC (Ant., XIII, xv, 4). The place fell to the Romans at the conquest under Pompey; and not far from the mountain Alexander, son of Aristobulus II, suffered defeat at the hands of Gabinius, proconsul of Syria, 53 BC (Ant., XIV, iv, 3; BJ, I, viii, 7). Josephus, who commanded in Galilee at the outbreak of the Jewish war, recognized the importance of the position, and built a wall round the summit. After the disaster to Jewish arms at Jotapata, where Josephus himself was taken prisoner, many fugitives took refuge here. Placidus the Roman general did not attempt an assault upon the fortress. Its defenders were by a feint drawn into the plain, where they were defeated, and the city surrendered.<P>A tradition which can be traced to the 4th century AD places the scene of the Transfiguration on this mountain. Allusion has been made above to the sacred character of the place. To this, and to the striking appearance of the mountain, the rise of the tradition may have been due. Passing centuries have seen a succession of churches and monasteries erected on the mountain. The scene of the Transfiguration was laid at the southeastern end of the summit, and here a church was built, probably by Tancred. Hard by was also shown the place where Melchizedek met Abraham returning from the pursuit of Chedorlaomer. The mountain shared to the full the vicissitudes of the country\'s stormy history. In 1113 AD the Arabs from Damascus plundered the monasteries and murdered the monks. An unsuccessful attack was made by Saladin in 1183, but 4 years later, after the rout of the Crusaders at Hattin, he devastated the place. Twenty-five years after that it was fortified by el-Melek el-\'Adel, brother of Saladin, and the Crusaders failed in an attempt to take it in 1217. In 1218, however, the Saracens threw down the defenses. Sultan Bibars in 1263 ordered the destruction of the Church of the Transfiguration, and for a time the mountain was deserted. The Feast of the Transfiguration, however, continued to be celebrated by the monks from Nazareth. During the last quarter of the 19th century much building was done by the Latin and Greek churches, who have now large and substantial monasteries and churches. They have also excavated the ruins of many of the old ecclesiastical buildings. The remains now to be seen present features of every period, from Jewish times to our own.<P>Mt. Tabor rises to a height of 1,843 ft. above the sea, and forms the most striking feature of the landscape. Seen from the south it presents the shape of a hemisphere; from the west, that of a sugar loaf. Its rounded top and steep sides are covered with thick brushwood. It is about half a century since the oak forest disappeared; but solitary survivors here and there show what the trees must have been. A low neck connects the mountain with the uplands to the north. It is cut off from Jebel ed-Duchy on the south by a fertile vale, which breaks down into Wady el-Bireh, and thence to the Jordan. A zigzag path on the northwest leads to the top, whence most interesting and comprehensive views are obtained. Southward, over Little Hermon, with Endor and Nain on its side, and Shunem at its western base, we catch a glimpse of Mt. Gilboa. Away across the plain the eye runs along the hills on the northern boundary of Samaria, past Taanach and Megiddo to Carmel by the sea, and the oak forest that runs northward from the gorge of the Kishon. A little to the north of west, 5 miles of broken upland, we can see the higher houses of Nazareth gleaming white in the sun. Eastward lies the hollow of the Jordan, and beyond it the wall of Gilead and the steep cliffs east of the Sea of Galilee, broken by glens and watercourses, and especially by the great chasm of the Yarmuk. The mountains of Zebulun and Naphtali seem to culminate in the shining mass of Great Hermon, rising far in the northern sky. Standing here one realizes how aptly the two mountains may be associated in the Psalmist\'s thought, although Hermon be mighty and Tabor humble (<a onClick="return mV(\'Psa\',89,12);">Ps 89:12</a>). Tabor is referred to by Jeremiah (<a onClick="return mV(\'Jer\',46,18);">46:18</a>), and Hosea alludes to some ensnaring worship practiced on the mountain (<a onClick="return mV(\'Jer\',5,1);">5:1</a>).<P>The present writer spent some weeks on Mt. Tabor, and as the result of careful observation and consideration concluded that the scene of the Transfiguration cannot be laid here. The place would appear to have been occupied at that time; and the remoteness and quiet which Jesus evidently sought could hardly have been found here.`<a href="./study/isbe/search.html?string=TRANSFIGURATION,+MOUNT+OF">TRANSFIGURATION, MOUNT OF</a>`54';
isbe[8577]='Tabor, Oak of`(<a href="./study/isbe/search.html?string=PLAIN+OF+TABOR">PLAIN OF TABOR</A> in the King James Version) (elon tabhor; he drus Thabor): A place mentioned only in Samuel\'s directions to Saul after his anointing (<a onClick="return mV(\'1Sa\',10,3);">1Sa 10:3</a>). It lay between the city where the two met and Gibeah whither Saul was returning. Ewald and Thenius thought it might be identical with the palm tree of Deborah, but there is nothing to support this conjecture. Others have thought we might read "oak of Deborah," as signifying the place where Rachel\'s nurse was buried (<a onClick="return mV(\'Gen\',35,8);">Ge 35:8</a>). The truth is that nothing whatever is now known of the site.``54';
isbe[8578]='Tabret; Timbrel`tab\'-ret, tim\'-brel.`<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>`1';
isbe[8579]='Tabrimmon`tab-rim\'-on, tab\'-ri-mon (Tabhrimmon, "Rimmon is good"; Codex Vaticanus Taberema; Codex Alexandrinus Tabenraema): The son of Hezion and father of <a href="./study/isbe/search.html?string=BENHADAD">BENHADAD</A> (which see) (<a onClick="return mV(\'1Ki\',15,18);">1Ki 15:18</a>, the King James Version, "Tabrimon").``1';
isbe[8580]='Taches`tach\'-iz.`<a href="./study/isbe/search.html?string=CLASPS">CLASPS</a>`1';
isbe[8581]='Tachmonite`tak\'-mo-nit.`<a href="./study/isbe/search.html?string=TAHCHEMONITE">TAHCHEMONITE</a>`1';
isbe[8582]='Tackling`tak\'-ling.`<a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';
isbe[8583]='Tadmor`tad\'-mor, tad\'-mor (tadhmor): A city built by Solomon in the wilderness (<a onClick="return mV(\'2Ch\',8,4);">2Ch 8:4</a>), the Roman Palmyra. Tadmor is the native name and is found on inscriptions. It occurs also in the Kere of <a onClick="return mV(\'1Ki\',9,18);">1Ki 9:18</a>, where the Kethibh or consonants read "Tamar" (compare <a onClick="return mV(\'Eze\',47,19);">Eze 47:19</a>; <a onClick="return mV(\'Eze\',48,28);">48:28</a>). It is famous in Arabian as well as in Hebrew literature, and enters Roman history in connection with Zenobia and Longinus. The inscriptions, which belong for the most part to the latter period (266-73 AD), have been published by Dawkins and Wood and also by M. Waddington and the Duc de Luynes. Popular works on the subject are An Account of Palmyra and Zenobia by W. Wright, and The Last Days and Fall of Palmyra by W. Ware.`<a href="./study/isbe/search.html?string=TAMAR">TAMAR</a>`189';
isbe[8584]='Tahan; Tahanites`ta\'-han, ta\'-han-its (tachan, tachani): The name of two Ephraimites who lived toward the end of the exodus of the Israelites (circa 1415 BC).<P>(1) The head of one of the families of the tribe of Ephraim (<a onClick="return mV(\'Num\',26,35);">Nu 26:35</a>).<P>(2) The son of Telah and father of Ladan, also of the tribe of Ephraim (<a onClick="return mV(\'1Ch\',7,25);">1Ch 7:25</a>f).``1';
isbe[8585]='Tahapanes`ta-hap\'-a-nez (tachpanchec).`<a href="./study/isbe/search.html?string=TAHPANHES">TAHPANHES</a>`1';
isbe[8586]='Tahash`ta\'-hash (tachash; Tochos; the King James Version Thahash): A son of Nahor by his concubine Reumah (<a onClick="return mV(\'Gen\',22,24);">Ge 22:24</a>). The word tachash means a kind of leather or skin, and perhaps the animal yielding it, probably the "dugong" (compare Brown, Briggs, and Driver). Tachash has been identified by Winckler with Tichis (Egypt), located on the Orontes, north of Kadesh.``1';
isbe[8587]='Tahath (1)`ta\'-hath (tachath, "below"): A wilderness station of the Israelites (<a onClick="return mV(\'Num\',33,26,27);">Nu 33:26,27</a>), between Makheloth and Terah.`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[8588]='Tahath (2)`(1) A Kohathite Levite (<a onClick="return mV(\'1Ch\',6,24);">1Ch 6:24</a>).<P>(2) The name is mentioned twice among the sons of Ephraim (<a onClick="return mV(\'1Ch\',7,20);">1Ch 7:20</a>); two families may be meant, or perhaps the name has been accidentally repeated.``1';
isbe[8589]='Tahchemonite`ta-ke\'-mo-nit, ta\'-ke-mon-it (tachkemoni): Name of a family to which Jashobeam, the chief captain in David\'s army, belonged (<a onClick="return mV(\'2Sa\',23,8);">2Sa 23:8</a>; <a onClick="return mV(\'1Ch\',11,11);">1Ch 11:11</a>). In 1 Chronicles it is "Hachmonite."``1';
isbe[8590]='Tahpanhes`ta\'-pan-hez, ta-pan\'-hez (usually in the Old Testament tachpanchec; Septuagint Taphnas; Coptic, Taphnes): The various spellings of the Hebrew text are fairly well indicated in the King James Version by Tahapanes (<a onClick="return mV(\'Jer\',2,16);">Jer 2:16</a>); Tahpanhes (<a onClick="return mV(\'Jer\',43,\'7-9\');">Jer 43:7-9</a>; <a onClick="return mV(\'Jer\',44,1);">44:1</a>; <a onClick="return mV(\'Jer\',46,14);">46:14</a>); Tehaphnehes (<a onClick="return mV(\'Eze\',30,18);">Eze 30:18</a>), while an Egyptian queen (XXIst Dynasty) is named Tahpenes (<a onClick="return mV(\'1Ki\',11,19,20);">1Ki 11:19,20</a>). Tahpanhes was a city on the eastern frontier of Lower Egypt, represented today by Tell Defenneh, a desert mound lying some 20 miles southwest from Pelusium (Biblical "Sin") and a little north of the modern Al-Kantarah ("the bridge"), marking the old caravan route from Egypt to Palestine, Mesopotamia and Assyria. Its Egyptian name is unknown, but it was called Daphnai, by the Greeks, and by the modern Arabs Def\'neh. The site is now desolate, but it was a fertile district when watered by the Pelusiac branch of the Nile (compare <a onClick="return mV(\'Isa\',19,6,7);">Isa 19:6,7</a>). Tahpanhes was so powerful that Jeremiah can say that it, with Memphis, has "broken the crown" of Israel\'s head (<a onClick="return mV(\'Jer\',2,16);">2:16</A>), and Ezekiel can speak of its "daughters" (colonies or suburban towns), and names it with Heliopolis and Bubastis when the "yokes Septuagint "sceptres") of Egypt" shall be broken by Yahweh (<a onClick="return mV(\'Eze\',30,18);">30:18</A>). In a later passage Jeremiah describes the flight of the Jews from their ruined capital to Tahpanhes after the death of Gedaliah (<a onClick="return mV(\'Jer\',43,\'1-7\');">43:1-7</A>) and prophesies that Nebuchadnezzar shall invade Egypt and punish it, establishing his throne upon the brick pavement (the King James Version "kiln") which is at the entry of Pharaoh\'s royal palace at Tahpanhes (<a onClick="return mV(\'Jer\',43,\'8-11\');">Jer 43:8-11</a>). He calls Tahpanhes as a witness to the desolation of the cities of Judah (<a onClick="return mV(\'Jer\',44,1);">Jer 44:1</a>), but prophesies an equal destruction of Tahpanhes and other Egyptian cities (probably occupied by fugitive Jews) when Nebuchadnezzar shall smite them (<a onClick="return mV(\'Jer\',46,14);">Jer 46:14</a>).<P>This invasion of Egypt by Nebuchadnezzar was for a long time strenuously denied (e.g. as late as 1889 by Kuenen, Historisch-critisch Onderzoek, 265-318); but since the discovery and publication (1878) of fragments of Nebuchadnezzar\'s annals in which he affirms his invasion of Egypt in his 37th year (568-567 BC), most scholars have agreed that the predictions of Jeremiah (<a onClick="return mV(\'Jer\',43,\'9-13\');">43:9-13</a>; <a onClick="return mV(\'Jer\',44,30);">44:30</a>) uttered shortly after 586 BC and of Ezekiel (<a onClick="return mV(\'Eze\',29,19);">29:19</a>) uttered in 570 BC were fulfilled, "at least in their general sense" (Driver, Authority and Archaeology, 116). Three cuneiform inscriptions of Nebuchadnezzar were found by Arabs probably on or near this site. The excavation of Tahpanhes in 1886 by W. M. Flinders Petrie made it "highly probable that the large oblong platform of brickwork close to the palace fort built at this spot by Psammetichus I, circa 664 BC, and now called Kasr Bint el-Yehudi, \'the castle of the Jew\'s daughter,\' is identical with the quadrangle \'which is at the entry of Pharaoh\'s house in Tahpanhes\' in which Jeremiah was commanded to bury the stones as a token that Nebuchadnezzar would spread his pavilion over them when he led his army into Egypt" (ibid., 117). Josephus explicitly mentions that Nebuchadnezzar, when he captured Tahpanhes, carried off a Jewish contingent from that city (Ant., IX, vii). Dr. Petrie found that while a small fort had existed here since the Rameside era (compare Herodotus ii.17), yet the town was practically founded by Psammetichus I, continued prosperous for a century or more, but dwindled to a small village in Ptolemaic times. Many sealings of wine jars stamped with the cartouches of Psammetichus I and Amosis were found in situ. Tahpanhes being the nearest Egyptian town to Palestine, Jeremiah and the other Jewish refugees would naturally flee there (<a onClick="return mV(\'Jer\',43,7);">43:7</a>). It is not at all unlikely that Nebuchadnezzar\'s invasion of Egypt was partly due to Egypt\'s favorable reception of these refugees.<P>The pottery found at Tahpanhes "shows on the whole more evidence of Greeks than Egyptians in the place....Especially between 607-587 BC a constant intercourse with the Greek settlers must have been going on and a wider intercourse than even a Greek colony in Palestine would have produced....The whole circumstances were such as to give the best possible opportunity for the permeation of Greek words and Greek ideas among the upper classes of the Jewish exiles" (Petrie, Nebesheh and Defenneh,1888,50). This was, however, only one of many places where the Greeks and Hebrews met freely in this century (see e.g. Duruy, History of Greece, II, 126-80; Cobern, Daniel, 301-307). A large foreign traffic is shown at Tahpanhes in which no doubt the Jews took part. Discoveries from the 6th century BC included some very finely painted pottery, "full of archaic spirit and beauty," many amulets and much rich jewelry and bronze and iron weapons, a piece of scale armor, thousands of arrow heads, and three seals of a Syrian type. One of the few inscriptions prays the blessing of Neit upon "all beautiful souls." There was also dug up a vast number of minute weights evidently used for weighing precious metals, showing that the manufacture of jewelry was carried on here on a large scale. One of the most pathetic and suggestive "finds" from this century, which witnessed the Babylonian captivity, consisted of certain curious figures of captives, carved in limestone, with their legs bent backward from their knees and their ankles and elbows bound together (Petrie, op. cit., chapters ix-xii).``26';
isbe[8591]='Tahpenes`ta\'-pe-nez, ta-pe\'-nez (tachpenec; Septuagint Thekem(e)ina): Queen of Egypt, the sister of Hadad\'s wife and the foster-mother of his son Genubath (<a onClick="return mV(\'1Ki\',11,19);">1Ki 11:19</a>f).`<a href="./study/isbe/search.html?string=PHARAOH">PHARAOH</a>`1';
isbe[8592]='Tahrea`ta\'-re-a, ta-re\'-a (tachrea\'): Son of Micah, a descendant of Gibeon (<a onClick="return mV(\'1Ch\',9,41);">1Ch 9:41</a>; in <a onClick="return mV(\'1Ch\',8,35);">8:35</a> "Tarea").``1';
isbe[8593]='Tahtim-Hodshi`ta-tim-hod\'-shi.`<a href="./study/isbe/search.html?string=KADESH+ON+THE+ORONTES">KADESH ON THE ORONTES</a>`1';
isbe[8594]='Tail`tal (\'alyah; zanabh; oura): The broad tail of the Syrian sheep, wrongly rendered "<a href="./study/isbe/search.html?string=RUMP">rump</a>" (which see) in the King James Version, is mentioned as one of the portions of sacrifice which was burned on the altar as a sweet savor to God (<a onClick="return mV(\'Exd\',29,22);">Ex 29:22</a>). The 2nd Hebrew word is used of the tails of serpents (<a onClick="return mV(\'Exd\',4,4);">Ex 4:4</a>), of foxes, which Samson tied together in his cruel sport, in order to destroy the grainfields of the Philistines by means of attached firebrands (<a onClick="return mV(\'Jdg\',15,4);">Jud 15:4</a>, etc.). The following seems to be an allusion to this incident: "Fear not, neither let thy heart be faint, because of these two tails of smoking firebrands, for the fierce anger of Rezin and Syria, and of the son of Remaliah" (<a onClick="return mV(\'Isa\',7,4);">Isa 7:4</a>).<P>Figurative: "Tail" = inferiority, as opposed to "head" = superiority, leadership. "Yahweh will make thee the head, and not the tail; and thou shalt be above only, and thou shalt not be beneath; if thou shalt hearken unto the commandments of Yahweh" (<a onClick="return mV(\'Deu\',28,13);">De 28:13</a>; compare also <a onClick="return mV(\'Deu\',28,13);">28:44</A>).<P>In the New Testament we find oura used of the apocalyptic animals, scorpions, horses, and the dragon (<a onClick="return mV(\'Rev\',9,10,19);">Re 9:10,19</a>; <a onClick="return mV(\'Rev\',12,4);">12:4</a>).``106';
isbe[8595]='Take`tak: Most of the very numerous examples of this word are still in good use and only a few call for special attention. "To take" in the sense of "capture" is still common, but when a person or living animal is in point, modern English usually adds "prisoner" or "captive." English Versions of the Bible not infrequently has this addition (<a onClick="return mV(\'Gen\',14,14);">Ge 14:14</a>, etc.), but more commonly "take" is used without it (<a onClick="return mV(\'Jos\',10,39);">Jos 10:39</a>; <a onClick="return mV(\'Job\',5,13);">Job 5:13</a>; Sirach 23:21; <a onClick="return mV(\'Jhn\',7,30);">Joh 7:30</a>, etc.). An occasional obscurity is thus caused, as in <a onClick="return mV(\'Gen\',27,3);">Ge 27:3</a>, "take me venison" for "hunt venison for me." "To take advice" (<a onClick="return mV(\'2Ch\',25,17);">2Ch 25:17</a>; the King James Version <a onClick="return mV(\'Jdg\',19,30);">Jud 19:30</a>, the Revised Version (British and American) "counsel") is "to reflect," not "to consult others" (compare <a onClick="return mV(\'1Ki\',12,28);">1Ki 12:28</a>; but contrast <a onClick="return mV(\'2Ki\',6,8);">2Ki 6:8</a>, etc.). "To take knowledge of" is "to learn thoroughly," "investigate" (<a onClick="return mV(\'1Sa\',23,23);">1Sa 23:23</a>, etc.), as is "to take notice of" (<a onClick="return mV(\'2Sa\',3,36);">2Sa 3:36</a>). "To take an oath of" (<a onClick="return mV(\'Gen\',50,25);">Ge 50:25</a>, etc.) is "to exact an oath of." "To be taken with a disease" in the King James Version <a onClick="return mV(\'Mat\',4,24);">Mt 4:24</a>; <a onClick="return mV(\'Luk\',4,38);">Lu 4:38</a> is "to suffer with" (the Revised Version (British and American) "be holden with"), but in 1Macc 9:55; 2Macc 9:21 (the King James Version and the Revised Version (British and American)), the context gives the force "be attacked by," as in modern English Compare the King James Version <a onClick="return mV(\'Luk\',8,37);">Lu 8:37</a> (the Revised Version (British and American) "holden"); <a onClick="return mV(\'Mic\',4,9);">Mic 4:9</a> (the Revised Version (British and American) "take hold of"). "Take" occurs in the sense "overtake" in the King James Version <a onClick="return mV(\'Gen\',19,19);">Ge 19:19</a> (the Revised Version (British and American) "overtake"); Sirach 36:26. "Take away" has sometimes a more forcible significance than in modern English, as in the King James Version <a onClick="return mV(\'Lev\',6,2);">Le 6:2</a>, "a thing taken away by violence" (the Revised Version (British and American) "robbery"); <a onClick="return mV(\'Dan\',11,12);">Da 11:12</a>, the King James Version "He hath taken away the multitude," where the meaning is "swept away" (compare the Revised Version margin "carried away"; the Revised Version (British and American) "shall be lifted up" is inappropriate here). So in "lest he take thee away with his stroke" (the King James Version <a onClick="return mV(\'Job\',36,18);">Job 36:18</a>), "take away" means simply "slay." (The text here is intensely obscure, and the Revised Version (British and American) has followed a different interpretation.) So "to be taken away" may mean simply "to die," as in <a onClick="return mV(\'Eze\',33,6);">Eze 33:6</a>; The Wisdom of Solomon 14:15; Sirach 16:9; 19:3; <a onClick="return mV(\'Mar\',2,20);">Mr 2:20</a>, although in <a onClick="return mV(\'1Cr\',5,2);">1Co 5:2</a> it means "to be expelled." "To take away judgment" or "right" (<a onClick="return mV(\'Job\',27,2);">Job 27:2</a>; <a onClick="return mV(\'Job\',34,5);">34:5</a>; <a onClick="return mV(\'Act\',8,33);">Ac 8:33</a>) is "to refuse it," but in <a onClick="return mV(\'Zep\',3,15);">Ze 3:15</a> English Versions of the Bible means "the sentence against thee is canceled" (the Hebrew text is dubious). <a onClick="return mV(\'Neh\',5,2);">Ne 5:2</a> the King James Version has "take up" for "get" (so the Revised Version (British and American)), perhaps with the connotation "on credit." "Take up" is also used frequently for "utter solemnly" (<a onClick="return mV(\'Num\',23,7);">Nu 23:7</a>; <a onClick="return mV(\'Isa\',14,4);">Isa 14:4</a>, etc.), a use due to the Hebrew "lift up," "exalt" (nasa\'). For "take up" in the sense of "lift" (physically), compare <a onClick="return mV(\'Isa\',40,15);">Isa 40:15</a>; <a onClick="return mV(\'Act\',7,43);">Ac 7:43</a>; the King James Version 21:15. "Take care" in Tobit 5:20; <a onClick="return mV(\'1Cr\',9,9);">1Co 9:9</a> the King James Version (the Revised Version (British and American) "to care") means "be anxious about," "have in mind" And the very obscure "scurrility in the matter of giving and taking" (Sirach 41:19) is explained by the Hebrew to mean "refusing the gift for which thou art besought." The following phrases are archaic, but hardly need explanation: "Take indignation" (<a onClick="return mV(\'Neh\',4,1);">Ne 4:1</a>); "take wrong" (<a onClick="return mV(\'1Cr\',6,7);">1Co 6:7</a>); "take up in the lips" (<a onClick="return mV(\'Eze\',36,3);">Eze 36:3</a>; the King James Version <a onClick="return mV(\'Psa\',16,4);">Ps 16:4</a>, "take...into my lips," the Revised Version (British and American) "take...upon my lips"); and in the King James Version "take to record" (<a onClick="return mV(\'Act\',20,26);">Ac 20:26</a>, the Revised Version (British and American) "testify unto"); "take shame" (<a onClick="return mV(\'Mic\',2,6);">Mic 2:6</a> the King James Version).``48';
isbe[8596]='Tale`tal (tokhen, mithkoneth, micpar; leros): In the King James Version of the Old Testament (with one exception, <a onClick="return mV(\'Psa\',90,9);">Ps 90:9</a>) "tale" (in the sing.) means number. "Tell" often has the same meaning, e.g. "I may tell (i.e. reckon) all my bones" (<a onClick="return mV(\'Psa\',22,17);">Ps 22:17</a>). When Moses requested permission to go three days\' journey into the wilderness to sacrifice to Yahweh, Pharaoh replied by demanding the full "tale" of bricks from the Israelites although they were compelled to provide themselves with straw (<a onClick="return mV(\'Exd\',5,8,18);">Ex 5:8,18</a>; see also <a onClick="return mV(\'1Sa\',18,27);">1Sa 18:27</a>; <a onClick="return mV(\'1Ch\',9,28);">1Ch 9:28</a>). In <a onClick="return mV(\'Psa\',90,9);">Ps 90:9</a>, "as a tale that is told" is a doubtful rendering (see <a href="./study/isbe/search.html?string=GAMES">GAMES</A>). The Septuagint and the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) render "as a spider\'s web." The literal and perhaps accurate translation is "as a sigh" (Driver, in the Parallel Psalter, gives "as a murmur"). The word used in this psalm means "to whisper," or "speak sotto voce," as a devout believer repeats to himself the words of a favorite hymn or passage (<a onClick="return mV(\'Psa\',1,2);">Ps 1:2</a>).<P>The disciples considered the account given by the women in regard to the resurrection as "idle tales" (the King James Version, the Revised Version (British and American) "idle talk"), literally, "nonsensical talk" (<a onClick="return mV(\'Luk\',24,11);">Lu 24:11</a>).<P>In talebearer the word has another meaning, namely, "slanderous talk or gossip." The word occurs 5 times in <a onClick="return mV(\'Pro\',11,13);">Pr 11:13</a>; <a onClick="return mV(\'Pro\',18,8);">18:8</a>; <a onClick="return mV(\'Pro\',20,19);">20:19</a>; <a onClick="return mV(\'Pro\',26,20,22);">26:20,22</a> (the King James Version) and once in Leviticus (<a onClick="return mV(\'Lev\',19,16);">19:16</a>). The word used in Leviticus and also in <a onClick="return mV(\'Pro\',20,19);">Pr 20:19</a> means a person who gads about from house to house hawking malicious gossip (compare <a onClick="return mV(\'1Ti\',5,13);">1Ti 5:13</a>). From the same root comes the Hebrew word for "merchant." In <a onClick="return mV(\'Eze\',22,9);">Eze 22:9</a> for the King James Version "men that carry tales" the Revised Version (British and American) gives "slanderous men," as Doeg (<a onClick="return mV(\'1Sa\',22,9,22);">1Sa 22:9,22</a>); Ziba (<a onClick="return mV(\'2Sa\',16,3);">2Sa 16:3</a>; <a onClick="return mV(\'2Sa\',19,27);">19:27</a>); and a certain maid-servant (<a onClick="return mV(\'2Sa\',17,17);">2Sa 17:17</a>).`<a href="./study/isbe/search.html?string=SLANDER">SLANDER</a>`103';
isbe[8597]='Talent`tal\'-ent (kikkar; talanton): A weight composed of 60 manehs (English Versions of the Bible "pounds") equal to about 120 pounds troy and 96 pounds avoirdupois, or 672,500 grains, of the Phoenician standard. See <a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>. When used in the monetary sense the talent might be either of silver or gold, and the value varied according to the standard, but is probably to be taken on the Phoenician, which would give about 410 British pounds, or $2,050 (in 1915), for the silver talent and 6,150 British pounds or $30,750 (in 1915), for the gold.<P>Figurative: "Talent," like "pound," is used metaphorically in the New Testament for mental and spiritual attainments or gifts (<a onClick="return mV(\'Mat\',25,\'15-28\');">Mt 25:15-28</a>).`<a href="./study/isbe/search.html?string=MONEY">MONEY</a>`138';
isbe[8598]='Talitha Cumi`ta-le\'-tha koo\'-me (talitha koumi): Derived from the Aramaic Talyetha\' qumi, "damsel, arise"), which in the New Testament manuscripts is transliterated variously (Westcott-Hort, Taleitha koum, otherwise Talitha koumi). We have no data for determining how far Jesus employed the Aramaic language, but Mark (<a onClick="return mV(\'Mar\',5,41);">5:41</a>) notes its use in this tender incident, and there is strong probability that Aramaic was used normally, if not exclusively, by Christ. There is, however, no ground for attributing any magical significance to the use of the Aramaic words in connection with this miracle.``1';
isbe[8599]='Talmai`tal\'-mi, tal\'-ma-i (talmay):<P>(1) A clan, possibly of Aramean origin, generally reputed to be of gigantic height; resident in Hebron at the time of the Hebrew conquest and driven thence by Caleb (<a onClick="return mV(\'Num\',13,22);">Nu 13:22</a>; <a onClick="return mV(\'Jos\',15,14);">Jos 15:14</a>; <a onClick="return mV(\'Jdg\',1,10);">Jud 1:10</a>).<P>(2) A son of Ammihur (or Ammihud), king of Geshur, a small Aramean kingdom, and a contemporary of David, to whom he gave his daughter Maacah in marriage. When Absalom fled from David after the assassination of Amnon he took refuge with Talmai at Geshur (<a onClick="return mV(\'2Sa\',3,3);">2Sa 3:3</a>; <a onClick="return mV(\'2Sa\',13,37);">13:37</a>; <a onClick="return mV(\'1Ch\',3,2);">1Ch 3:2</a>).``1';
isbe[8600]='Talmon`tal\'-mon (talmon): One of the porters in connection with the temple-service (<a onClick="return mV(\'1Ch\',9,17);">1Ch 9:17</a>; <a onClick="return mV(\'Ezr\',2,42);">Ezr 2:42</a>; <a onClick="return mV(\'Neh\',7,45);">Ne 7:45</a>; <a onClick="return mV(\'Neh\',11,19);">11:19</a>; <a onClick="return mV(\'Neh\',12,25);">12:25</a>).``1';
