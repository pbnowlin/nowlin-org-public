isbe = [];

isbe[6301]='Navel`na\'-v\'l (shor. The Septuagint in <a onClick="return mV(\'Pro\',3,8);">Pr 3:8</a> suggests a different reading, namely, instead of shorrekha, sherekha equals she\'erkha, "thy flesh")): The King James Version translates the Hebrew sharir in the description of Behemoth (<a onClick="return mV(\'Job\',40,16);">Job 40:16</a>) by "navel," where modern translators have substituted "muscles"; similarly in the translation of shorer (<a onClick="return mV(\'Sgs\',7,2);">So 7:2</a>) it has been replaced by "body." There remain two passages of the Revised Version (British and American) where "navel" is retained as the translation of shor. Thus we find the word used, pars pro toto, for the whole being: "It (the fear of Yahweh) will be health to thy navel, and marrow to thy bones" (<a onClick="return mV(\'Pro\',3,8);">Pr 3:8</a>). The uttermost neglect which a new-born babe can experience is expressed by Ezekiel: "In the day thou wast born thy navel (i.e. umbilical cord) was not cut neither wast thou washed in water to cleanse thee; thou wast not salted at all, nor swaddled at all" (<a onClick="return mV(\'Eze\',16,4);">Eze 16:4</a>).``106';
isbe[6302]='Navy`na\'-vi.`<a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';
isbe[6303]='Nazarene`naz-a-ren; naz\'-a-ren Nazarenos; Nazaraios in Matthew, John, Acts and Luke): A derivative of Nazareth, the birthplace of Christ. In the New Testament it has a double meaning: it may be friendly and it may be inimical.<P>1. An Honourable Title:<P>On the lips of Christ\'s friends and followers, it is an honorable name. Thus Matthew sees in it a fulfillment of the old Isaiah prophecy (<a onClick="return mV(\'Isa\',11,1);">Isa 11:1</a> (Hebrew)): "That it might be fulfilled which was spoken through the prophets, that he should be called a Nazarene (<a onClick="return mV(\'Mat\',2,23);">Mt 2:23</a>). According to an overwhelming array of testimony (see Meyer, Commentary, in loc.), the name Nazareth is derived from the same natsar, found in the text quoted from Isaiah. We have here undoubtedly to do with a permissible accommodation.<P>It is not quite certain that Matthew did not intend, by the use of this word, to refer to the picture of the Messiah, as drawn in <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a>, on account of the low estimate in which this place was held (<a onClick="return mV(\'Jhn\',1,46);">Joh 1:46</a>). Nor is permissible, as has been done by Tertullian and Jerome, to substitute the word "Nazarite" for "Nazarene," which in every view of the case is contrary to the patent facts of the life of the Saviour.<P>Says Meyer, "In giving this prophetic title to the Messiah he entirely disregards the historical meaning of the same Septuagint reading in <a onClick="return mV(\'Isa\',11,1);">Isa 11:1</a>, anthos), keeps by the relationship of the name Nazareth to the word natsar, and recognizes by virtue of the same, in that prophetic Messianic name netser, the typical reference to this—that Jesus through His settlement in Nazareth was to become a Nazoraios, a \'Nazarene.\'" This name clung to Jesus throughout His entire life. It became His name among the masses: "Jesus of Nazareth passeth by" (<a onClick="return mV(\'Mar\',10,47);">Mr 10:47</a>; <a onClick="return mV(\'Luk\',24,19);">Lu 24:19</a>). Perhaps Matthew, who wrote after the event, may have been influenced in his application of the Isaian prophecy by the very fact that Jesus was popularly thus known. Even in the realm of spirits He was known by this appellation. Evil spirits knew and feared Him, under this name (<a onClick="return mV(\'Mar\',1,24);">Mr 1:24</a>; <a onClick="return mV(\'Luk\',4,34);">Lu 4:34</a>), and the angels of the resurrection morning called Him thus (<a onClick="return mV(\'Mar\',16,6);">Mr 16:6</a>), while Jesus applied the title to Himself (<a onClick="return mV(\'Act\',22,8);">Ac 22:8</a>). In the light of these facts we do not wonder that the disciples, in their later lives and work, persistently used it (<a onClick="return mV(\'Act\',2,22);">Ac 2:22</a>; <a onClick="return mV(\'Act\',3,6);">3:6</a>; <a onClick="return mV(\'Act\',10,38);">10:38</a>).<P>2. A Title of Scorn:<P>If His friends knew Him by this name, much more His enemies, and to them it was a title of scorn and derision. Their whole attitude was compressed in that one word of Nathanael, by which he voiced his doubt, "Can any good thing come out of Nazareth?" (<a onClick="return mV(\'Jhn\',1,46);">Joh 1:46</a>). In the name "Nazarene," the Jews, who opposed and rejected Christ, poured out all the vials of their antagonism, and the word became a Jewish heritage of bitterness. It is hard to tell whether the appellation, on the lips of evil spirits, signifies dread or hatred (<a onClick="return mV(\'Mar\',1,24);">Mr 1:24</a>; <a onClick="return mV(\'Luk\',4,34);">Lu 4:34</a>). With the gatekeepers of the house of the high priest the case is clear. There it signifies unadulterated scorn (<a onClick="return mV(\'Mat\',26,71);">Mt 26:71</a>; <a onClick="return mV(\'Mar\',14,67);">Mr 14:67</a>). Even in His death the bitter hatred of the priests caused this name to accompany Jesus, for it was at their dictation written above His cross by Pilate (<a onClick="return mV(\'Jhn\',19,19);">Joh 19:19</a>). The entire Christian community was called by the leaders of the Jewish people at Jerusalem, "the sect of the Nazarenes" (<a onClick="return mV(\'Act\',24,5);">Ac 24:5</a>). If, on the one hand, therefore, the name stands for devotion and love, it is equally certain that on the other side it represented the bitter and undying hatred of His enemies.``42';
isbe[6304]='Nazareth`naz\'-a-reth (Nazaret, Nazareth, and other forms):<P>1. Notice Confined to the New Testament:<P>A town in Galilee, the home of Joseph. and the Virgin Mary, and for about 30 years the scene of the Saviour\'s life (<a onClick="return mV(\'Mat\',2,23);">Mt 2:23</a>; <a onClick="return mV(\'Mar\',1,9);">Mr 1:9</a>; <a onClick="return mV(\'Luk\',2,39,51);">Lu 2:39,51</a>; <a onClick="return mV(\'Luk\',4,16);">4:16</a>, etc.). He was therefore called Jesus of Nazareth, although His birthplace was Bethlehem; and those who became His disciples were known as Nazarenes. This is the name, with slight modification, used to this day by Moslems for Christians, Nacara—the singular being Nacrany.<P>The town is not named in the Old Testament, although the presence of a spring and the convenience of the site make it probable that the place was occupied in old times. Quaresimus learned that the ancient name was Medina Abiat, in which we may recognize the Arabic el-Medinat el-baidtah, "the white town." Built of the white stone supplied by the limestone rocks around, the description is quite accurate. There is a reference in Mishna (Menachoth viii.6) to the "white house of the hill" whence wine for the drink offering was brought. An elegy for the 9th of Abib speaks of a "course" of priests settled in Nazareth. This, however, is based upon an ancient midhrash now lost (Neubauer, Geogr. du Talmud, 82, 85, 190; Delitzsch, Ein Tag in Capernaum, 142). But all this leaves us still in a state of uncertainty.<P>2. Position and Physical Features:<P>The ancient town is represented by the modern en-Nacirah, which is built mainly on the western and northwestern slopes of a hollow among the lower hills of Galilee, just before they sink into the plain of Esdraelon. It lies about midway between the Sea of Galilee and the Mediterranean at Haifa. The road to the plain and the coast goes over the southwestern lip of the hollow; that to Tiberias and Damascus over the heights to the northeast. A rocky gorge breaks down southward, issuing on the plain between two craggy hills. That to the west is the traditional Hill of Precipitation (<a onClick="return mV(\'Luk\',4,29);">Lu 4:29</a>). This, however, is too far from the city as it must have been in the days of Christ. It is probable that the present town occupies pretty nearly the ancient site; and the scene of that attempt on Jesus\' life may have been the cliff, many feet in height, not far from the old synagogue, traces of which are still seen in the western part of the town. There is a good spring under the Greek Orthodox church at the foot of the hill on the north. The water is led in a conduit to the fountain, whither the women and their children go as in old times, to carry home in their jars supplies for domestic use. There is also a tiny spring in the face of the western hill. To the northwest rises the height on which stands the sanctuary, now in ruins, of Neby Sa\'in. From this point a most beautiful and extensive view is obtained, ranging on a clear day from the Mediterranean on the west to the Mountain of Bashan on the east; from Upper Galilee and Mt. Hermon on the north to the uplands of Gilead and Samaria on the south The whole extent of Esdraelon is seen, that great battlefield, associated with so many heroic exploits in Israel\'s history, from Carmel and Megiddo to Tabor and Mt. Gilboa.<P>3. Present Inhabitants:<P>There are now some 7,000 inhabitants, mainly Christian, of whom the Greek Orthodox church claims about 3,000. Moslems number about 1,600. There are no Jews. It is the chief market town for the pastoral and agricultural district that lies around it.<P>4. Labors of Jesus:<P>In Nazareth, Jesus preached His first recorded sermon (<a onClick="return mV(\'Luk\',4,16);">Lu 4:16</a>), when His plainness of speech aroused the homicidal fury of His hearers. "He did not many mighty works there because of their unbelief" (<a onClick="return mV(\'Mat\',13,58);">Mt 13:58</a>). Finding no rest or security in Nazareth, He made His home in Capernaum. The reproach implied in Nathanael\'s question, "Can any good thing come out of Nazareth?" (<a onClick="return mV(\'Jhn\',1,46);">Joh 1:46</a>), has led to much speculation. By ingenious emendation of the text Cheyne would read, "Can the Holy One proceed from Nazareth?" (EB, under the word). Perhaps, however, we should see no more in this than the acquiescence of Nathanael\'s humble spirit in the lowly estimate of his native province entertained by the leaders of his people in Judea.<P>5. Later History:<P>Christians are said to have first settled here in the time of Constantine (Epiphanius), whose mother Helena built the Church of the Annunciation. In crusading times it was the seat of the bishop of Bethscan. It passed into Moslem hands after the disaster to the Crusaders at Chattin (1183). It was destroyed by Sultan Bibars in 1263. In 1620 the Franciscans rebuilt the Church of the Annunciation, and the town rose again from its ruins. Here in 1799 the French general Junot was assailed by the Turks. After his brilliant victory over the Turks at Tabor, Napoleon visited Nazareth. The place suffered some damage in the earthquake of 1837.<P>Protestant Missions are now represented in Nazareth by agents of the Church Missionary Society, and of the Edinburgh Medical Missionary Society.``54';
isbe[6305]='Nazirite`naz\'-i-rit (nazir, connected with nadhar, "to vow"; nazeir, nazeiraios, as also various words indicating "holiness" or "devotion"; the King James Version, Nazarite):<P>1. Antiquity and Origin<P>2. Conditions of the Vow<P>3. Initiation<P>4. Restoration<P>5. Completion and Release<P>6. Semi-sacerdotal Character<P>7. Nazirites for Life<P>8. Samson\'s Case<P>9. Samuel\'s Case<P>10. Token of Divine Favor<P>11. Did Not Form Communities<P>12. Among Early Christians<P>13. Parallels among Other Peoples<hr /><P>The root-meaning of the word in Hebrew as well as the various Greek translations indicates the Nazirite as "a consecrated one" or "a devotee." In the circumstances of an ordinary vow, men consecrated some material possession, but the Nazirite consecrated himself or herself, and took a vow of separation and self-imposed discipline for the purpose of some special service, and the fact of the vow was indicated by special signs of abstinence. The chief Old Testament passages are <a onClick="return mV(\'Jdg\',13,\'5-7\');">Jud 13:5-7</a>; <a onClick="return mV(\'Jdg\',16,17);">16:17</a>; <a onClick="return mV(\'Num\',6,\'1-\');">Nu 6</a>; <a onClick="return mV(\'Amo\',2,11,12);">Am 2:11,12</a>; compare Sirach 46:13 (Hebrew); 1Macc 3:49-52.<P>1. Antiquity and Origin:<P>The question has been raised as to whether the Nazirite vow was of native or foreign origin in Israel.The idea of special separation, however, seems in all ages to have appealed to men of a particular temperament, and we find something of the kind in many countries and always linked with special abstinence of some kind; and from all that is said in the Pentateuch we should infer that the custom was already ancient in Israel and that Mosaism regulated it, bringing it into line with the general system of religious observance and under the cognizance of the Aaronic priests. The critics assign the section dealing with this matter (<a onClick="return mV(\'Num\',6,\'1-21\');">Nu 6:1-21</a>) to the Priestly Code (P), and give it a late date, but there cannot be the least doubt that the institution itself was early. It seems not unlikely that on the settlement in Canaan, when the Israelites, having failed to overcome the native population, began to mix freely with them, the local worship, full of tempting Dionysiac elements, brought forth this religious protest in favor of Israel\'s ancient and simpler way of living, and as a protection against luxury in settling nomads. It is worthy of note that among the Semites vine-growing and wine-drinking have ever been considered foreign to their traditional nomadic mode of life. It was in this same protest that the Rechabites, who were at least akin to the Nazirites, went still farther in refusing even in Canaan to abandon the nomadic state.<P>See <a href="./study/isbe/search.html?string=RECHABITES">RECHABITES</a>.<P>2. Conditions of the Vow:<P>The Pentateuch, then, makes provision for the Nazirite vow being taken by either men or women, though the Old Testament does not record a single instance of a female Nazirite. Further, it provides only for the taking of the vow for a limited time, that is, for the case of the "Nazirite of days." No period of duration is mentioned in the Old Testament, but the Mishna, in dealing with the subject, prescribes a period of 30 days, while a double period of 60 or even a triple one of 100 days might be entered on. The conditions of Naziritism entailed:<P class="in15">(1) the strictest abstinence from wine and from every product of the vine;<P class="in15">(2) the keeping of the hair uncut and the beard untouched by a razor;<P class="in15">(3) the prohibition to touch a dead body; and<P class="in15">(4) prohibition of unclean food (<a onClick="return mV(\'Jdg\',13,\'5-7\');">Jud 13:5-7</a>; <a onClick="return mV(\'Num\',6,\'1-\');">Nu 6</a>).<P>3. Initiation:<P>The ceremonial of initiation is not recorded, the Pentateuch treating it as well known. The Talmud tells us that it was only necessary for one to express the wish that he might be a Nazirite. A formal vow was, however, taken; and from the form of renewal of the vow, when by any means it was accidentally broken, we may judge that the head was also shorn on initiation and the hair allowed to grow during the whole period of the vow.<P>4. Restoration:<P>The accidental violation of the vow just mentioned entailed upon the devotee the beginning of the whole matter anew and the serving of the whole period. This was entered on by the ceremonial of restoration, in the undergoing of which the Nazirite shaved his head, presented two turtle-doves or two young pigeons for sin and burnt offerings, and re-consecrated himself before the priest, further presenting a lamb for a trespass offering (<a onClick="return mV(\'Num\',6,\'9-12\');">Nu 6:9-12</a>).<P>5. Completion and Release:<P>When the period of separation was complete, the ceremonial of release had to be gone through. It consisted of the presentation of burnt, sin and peace offerings with their accompaniments as detailed in <a onClick="return mV(\'Num\',6,\'13-21\');">Nu 6:13-21</a>, the shaving of the head and the burning of the hair of the head of separation, after which the Nazirite returned to ordinary life.<P>6. Semi-sacerdotal Character:<P>The consecration of the Nazirite in some ways resembled that of the priests, and similar words are used of both in <a onClick="return mV(\'Lev\',21,12);">Le 21:12</a> and <a onClick="return mV(\'Num\',6,17);">Nu 6:17</a>, the priest\'s vow being even designated nezer. It opened up the way for any Israelite to do special service on something like semi-sacerdotal lines. The priest, like the Nazirite, dared not come into contact with the dead (<a onClick="return mV(\'Lev\',21,1);">Le 21:1</a>), dared not touch wine during the period of service (<a onClick="return mV(\'Lev\',10,9);">Le 10:9</a>), and, further, long hair was an ancient priestly custom (<a onClick="return mV(\'Eze\',44,20);">Eze 44:20</a>).<P>7. Nazirites for Life:<P>The only "Nazirites for life" that we know by name are Samson, Samuel and John the Baptist, but to these Jewish tradition adds Absalom in virtue of his long hair. We know of no one voluntarily taking the vow for life, all the cases recorded being those of parents dedicating their children. In rabbinical times, the father but not the mother might vow for the child, and an interesting case of this kind is mentioned in the dedication of Rabbi Chanena by his father in the presence of Rabban Gamaliel (Nazir, 29b).<P>8. Samson\'s Case:<P>Samson is distinctly named a Nazirite in <a onClick="return mV(\'Jdg\',13,7);">Jud 13:7</a> and <a onClick="return mV(\'Jdg\',16,17);">16:17</A>, but it has been objected that his case does not conform to the regulations in the Pentateuch. It is said that he must have partaken of wine when he made a feast for his friends, but that does not follow and would not be so understood, say, in a Moslem country today. It is further urged that in connection with his fighting he must have come into contact with many dead men, and that he took honey from the carcass of the lion. To us these objections seem hypercritical. Fighting was specially implied in his vow (<a onClick="return mV(\'Jdg\',13,5);">Jud 13:5</a>), and the remains of the lion would be buy a dry skeleton and not even so defiling as the ass\'s jawbone, to which the critics do not object.<P>9. Samuel\'s Case:<P>Samuel is nowhere in the Old Testament called a Nazirite, the name being first applied to him in Sirach 46:13 (Hebrew), but the restrictions of his dedication seem to imply that he was. Wellhausen denies that it is implied in <a onClick="return mV(\'1Sa\',1,11);">1Sa 1:11</a> that he was either a Nathin ("a gift, (one) \'given\' unto Yahweh"; compare <a onClick="return mV(\'Num\',3,9);">Nu 3:9</a>; <a onClick="return mV(\'Num\',18,6);">18:6</a>) or a Nazirite. In the Hebrew text the mother\'s vow mentions only the uncut hair, and first in Septuagint is there added that he should not drink wine or strong drink, but this is one of the cases where we should not regard silence as final evidence. Rather it is to be regarded that the visible sign only is mentioned, the whole contents of the vow being implied.<P>10. Token of Divine Favor:<P>It is very likely that Nazirites became numerous in Israel in periods of great religious or political excitement, and in <a onClick="return mV(\'Jdg\',5,2);">Jud 5:2</a> we may paraphrase, \'For the long-haired champions in Israel.\' That they should be raised up was considered a special token of God\'s favor to Israel, and the tempting of them to break their vow by drinking wine was considered an aggravated sin (<a onClick="return mV(\'Amo\',2,11,12);">Am 2:11,12</a>). At the time of the captivity they were looked upon as a vanished glory in Israel (<a onClick="return mV(\'Lam\',4,7);">La 4:7</a> margin), but they reappeared in later history.<P>11. Did Not Form Communities:<P>So far as we can discover, there is no indication that they formed guilds or settled communities like the "Sons of the Prophets." In some sense the Essenes may have continued the tradition, and James, the Lord\'s brother (Euseb., HE, II, xxiii,3,following Hegesippus), and also Banns, tutor of Josephus (Vita, 2), who is probably the same as the Buni mentioned as a disciple of Jesus in Sanhedrin 43a, were devotees of a kind resembling Nazirites. Berenice\'s vow was also manifestly that of the Nazirite (Josephus, B J, II, xv, 1).<P>12. Among Early Christians:<P>The case of John the Baptist is quite certain, and it was probably the means of introducing the custom among the early Christians. It was clearly a Nazirite\'s vow which Paul took, "having shorn his head in Cenchrea" (<a onClick="return mV(\'Act\',18,18);">Ac 18:18</a>), and which he completed at Jerusalem with other Christians similarly placed (<a onClick="return mV(\'Act\',21,23);">Ac 21:23</a>).<P>As the expenses of release were heavy for poor men, such were at times aided in this matter by their richer brethren. Thus, Agrippa, on his return from Rome, assisted many Nazirites (Josephus, Ant., XIX, vi, 1), and Paul was also at charges with others (<a onClick="return mV(\'Act\',21,23);">Ac 21:23</a>).<P>We come across something of the same kind in many countries, and we find special abstinence always emphasized. Thus we meet with a class of "votaries" as early as the days of Hammurabi, and his code devotes quite a number of sections to them. Among other restrictions they were prohibited from even entering a wineshop (Sect, 110).<P>13. Parallels among Other Peoples:<P>Then we are familiar with the hierodouloi of the Greeks, and the Vestal Virgins of the Romans. The word nezir also appears in Syriac and was applied to the maidens devoted to the service of Belthis. In the East, too, there have always been individuals and societies of ascetics who were practically Nazirites, and the modern dervish in nearly every way resembles him, while it is worthy of record in this connection that the Moslem (an abstainer by creed) while under the vow of pilgrimage neither cuts his hair nor pares his nails till the completion of his vow in Mecca.``23';
isbe[6306]='Neah`ne\'-a (ha-ne\'ah, "the neah"; Annoua): A town in the lot of Zebulun (<a onClick="return mV(\'Jos\',19,13);">Jos 19:13</a>), mentioned along with Gath-hepher and Rimmon. It is possibly identical with "Neiel" (<a onClick="return mV(\'Jos\',19,27);">Jos 19:27</a>). No name resembling either of these has yet been recovered, although the district in which the place must be sought is pretty definitely indicated. It may probably have lain to the north of Rimmon (Rummaneh), about 4 miles northeast of Seffuriyeh.``1';
isbe[6307]='Neapolis`ne-ap\'-o-lis (Neapolis; Westcott and Hort, The New Testament in Greek, Nea Polis): A town on the northern shore the Aegean, originally belonging to Thrace but later falling within the Roman province of Macedonia. It was the seaport of Philippi, and was the first point in Europe at which Paul and his companions landed; from Troas they had sailed direct to Samothrace, and on the next day reached Neapolis (<a onClick="return mV(\'Act\',16,11);">Ac 16:11</a>). Paul probably passed through the town again on his second visit to Macedonia (<a onClick="return mV(\'Act\',20,1);">Ac 20:1</a>), and he certainly must have embarked there on his last journey from Philippi to Troas, which occupied 5 days (<a onClick="return mV(\'Act\',20,6);">Ac 20:6</a>). The position of Neapolis is a matter of dispute. Some writers have maintained that it lay on the site known as Eski (i.e. "Old") Kavalla (Cousinery, Macedoine, II, 109ff), and that upon its destruction in the 6th or 7th century AD the inhabitants migrated to the place, about 10 miles to the east, called Christopolis in medieval and Kavalla in modern times. But the general view, and that which is most consonant with the evidence, both literary and archaeological, places Neapolis at Kavalla, which lies on a rocky headland with a spacious harbor on its western side, in which the fleet of Brutus and Cassius was moored at the time of the battle of Philippi (42 BC; Appian Bell. Civ. iv.106). The town lay some 10 Roman miles from Philippi, with which it was connected by a road leading over the mountain ridge named Symbolum, which separates the plain of Philippi from the sea.<P>The date of its foundation is uncertain, but it seems to have been a colony from the island of Thasos, which lay opposite to it (Dio Cassius xlvii.35). It appears (under the name Neopolis, which is also borne on its coins) as member both of the first and of the second Athenian confederacy, and was highly commended by the Athenians in an extant decree for its loyalty during the Thasian revolt of 411-408 BC (Inser. Graec., I, Suppl. 51). The chief cult of the city was that of "The Virgin," usually identified with the Greek Artemis. (See Leake, Travels in Northern Greece, III, 180; Cousinery, Voyage dans la Macedoine, II, 69ff, 109ff; Heuzey and Daumet, Mission archeol. de Macedoine, 11ff.)``176';
isbe[6308]='Near, Nigh`ner, ni (chiefly qarobh, "to draw near," qarabh; eggus): Used of proximity in place (<a onClick="return mV(\'Gen\',19,20);">Ge 19:20</a>; <a onClick="return mV(\'Gen\',45,10);">45:10</a>; <a onClick="return mV(\'Exd\',13,17);">Ex 13:17</a>; <a onClick="return mV(\'Psa\',22,11);">Ps 22:11</a>; <a onClick="return mV(\'Jhn\',3,23);">Joh 3:23</a>, etc.), time (<a onClick="return mV(\'Jer\',48,16);">Jer 48:16</a>; <a onClick="return mV(\'Eze\',7,7);">Eze 7:7</a>; <a onClick="return mV(\'Eze\',30,3);">30:3</a>; <a onClick="return mV(\'Mar\',13,28);">Mr 13:28</a>), or kinship (<a onClick="return mV(\'Lev\',21,2);">Le 21:2</a>; <a onClick="return mV(\'Rth\',3,12);">Ru 3:12</a>), but also employed of moral nearness. Yahweh is "nigh" to them that are of a broken heart (<a onClick="return mV(\'Psa\',34,18);">Ps 34:18</a>). God draws nigh to His people, and they to Him (<a onClick="return mV(\'Jam\',4,8);">Jas 4:8</a>). The antithesis is God\'s "farness" from the wicked.``1';
isbe[6309]='Neariah`ne-a-ri\'-a (ne\'aryah):<P>(1) A descendant of David (<a onClick="return mV(\'1Ch\',3,22);">1Ch 3:22</a>f).<P>(2) A descendant of Simeon (<a onClick="return mV(\'1Ch\',4,42);">1Ch 4:42</a>).<P>In both instances the Septuagint reads "Noadiah."``1';
isbe[6310]='Nebai`ne\'-bi, ne-ba\'-i, neb\'-a-i (nebhay).`<a href="./study/isbe/search.html?string=NOBAI">NOBAI</a>`1';
isbe[6311]='Nebaioth`ne-ba\'-yoth, ne-bi\'-oth (nabhayoth; Septuagint Nabaioth): Firstborn of Ishmael (<a onClick="return mV(\'Gen\',25,13);">Ge 25:13</a>; <a onClick="return mV(\'Gen\',28,9);">28:9</a>; <a onClick="return mV(\'Gen\',36,3);">36:3</a>; <a onClick="return mV(\'1Ch\',1,29);">1Ch 1:29</a>). <a onClick="return mV(\'Isa\',60,7);">Isa 60:7</a> mentions the tribe Nebaioth with Kedar, with an allusion to its pastoral nature: "the rams of Nebaioth" are to serve the ideal Zion as sacrificial victims. Again associated with Kedar, the name occurs frequently in Assyrian inscriptions. The tribe must have had a conspicuous place among the northern Arabs. Josephus, followed by Jerome, regarded Nebaioth as identical with the Nabateans, the great trading community and ally of Rome, whose capital and stronghold was Petra. This view is widely accepted, but the name "Nabatean" is spelled with a "T" (teth), and the interchange of "T" (teth) and "t" (taw), although not unparalleled, is unusual. If the name is Arabic, it is probably a feminine plural, and in that case could have no connection with the Nabateans.``63';
isbe[6312]='Neballat`ne-bal\'-at (nebhallat; Naballat): A town occupied by the Benjamites after the exile, named along with Lod and Ono (<a onClick="return mV(\'Neh\',11,34);">Ne 11:34</a>). It is represented by the modern Belt Nebala, 4 miles Northeast of Lydda.``1';
isbe[6313]='Nebat`ne\'-bat (nebhat): Father of Jeroboam I (<a onClick="return mV(\'1Ki\',11,26);">1Ki 11:26</a>, and frequently elsewhere). The name occurs only in the phrase "Jeroboam the son of Nebat," and is evidently intended to distinguish Jeroboam I from the later son of Joash.`<a href="./study/isbe/search.html?string=JEROBOAM">JEROBOAM</a>`1';
isbe[6314]='Nebo (1)`ne\'-bo (nebho; Assyrian Nabu): The Babylonian god of literature and science. In the Babylonian mythology he is represented as the son and interpreter of Bel-merodach (compare <a onClick="return mV(\'Isa\',46,1);">Isa 46:1</a>; Bel and Nebo there represent Babylon). His own special shrine was at Borsippo. His planet was Mercury. His name enters into Biblical names, as "Nebuchadnezzar," and perhaps "Abed-nego" (<a onClick="return mV(\'Dan\',1,7);">Da 1:7</a>, for "Abed-nebo, servant of Nebo").`<a href="./study/isbe/search.html?string=BABYLONIA+AND+ASSYRIA,+RELIGION+OF">BABYLONIA AND ASSYRIA, RELIGION OF</a>`1';
isbe[6315]='Nebo (2)`(nebho; Nabau):<P>(1) This town is named in <a onClick="return mV(\'Num\',32,3);">Nu 32:3</a> between Sebam and Beon (which latter evidently represents Baal-meon of <a onClick="return mV(\'Num\',32,38);">32:38</A>), after Heshbon and Elealeh, as among the cities assigned by Moses to Reuben. It was occupied by the Reubenite clan Bela (<a onClick="return mV(\'1Ch\',5,8);">1Ch 5:8</a>). Here it is named between Aroer and Baalmeon. In their denunciations of wrath against Moab, Isaiah names it along with Medeba (<a onClick="return mV(\'Isa\',15,2);">Isa 15:2</a>) and Jeremiah with Kiriathaim (<a onClick="return mV(\'Jer\',48,1);">Jer 48:1</a>), and again (<a onClick="return mV(\'Jer\',48,22);">Jer 48:22</a>) between Dibon and Beth-diblathaim. Mesha (M S) says that by command of Chemosh he went by night against the city, captured it after an assault that lasted from dawn till noon, and put all the inhabitants to death. He dedicated the place to Ashtar-chemosh. Jerome (Commentary on <a onClick="return mV(\'Isa\',15,2);">Isa 15:2</a>) tells us that at Nebo was the idol of Chemosh. The site which seems best to meet the requirements of the passages indicated is on the ridge of Jebel Neba to the southwest of Hesban, where ruins of an ancient town bearing the name of en-Neba are found (Buhl, GAP, 266).<P>(2) (nebho; B, Nabou A, Nabo, and other forms): Fifty-two descendants of the inhabitants of Nebo returned from exile with Zerubbabel (<a onClick="return mV(\'Ezr\',2,29);">Ezr 2:29</a>; <a onClick="return mV(\'Neh\',7,33);">Ne 7:33</a>). The place was in Judah and is named after Bethel and Ai. There is nothing, however, to guide us as to its exact position. It may be represented by either Belt Nuba, 12 miles northwest of Jerusalem, or Nuba, which lies about 4 miles south-southeast of \'Id el-Ma\' (Adullam).``54';
isbe[6316]='Nebo, Mount`(har nebho; Nabau): A mountain in the land of Moab which Moses ascended at the command of God in order that he might see the Land of Promise which he was never to enter. There also he was to die. From the following passages (namely, <a onClick="return mV(\'Num\',33,47);">Nu 33:47</a>; <a onClick="return mV(\'Deu\',32,49);">De 32:49</a>; <a onClick="return mV(\'Deu\',34,1);">34:1</a>), we gather that it was not far from the plain of Moab in which Israel was encamped; that it was a height standing out to the west of the mountains of Abarim; that it lay to the east of Jericho; and that it was a spot from which a wide and comprehensive view of Palestine could be obtained. None of these conditions are met by Jebel \'Attarus, which is too far to the east, and is fully 15 miles south of a line drawn eastward from Jericho. Jebel \'Osha, again, in Mt. Gilead, commands, indeed, an extensive view; but it lies too far to the north, being at least 15 miles north of a line drawn eastward from Jericho. Both of these sites have had their advocates as claimants for the honor of representing the Biblical Nebo.<P>The "head" or "top" of Pisgah is evidently identical with Mt. Nebo (<a onClick="return mV(\'Deu\',34,1);">De 34:1</a>). After Moses\' death he was buried "in the valley in the land of Moab," over against Beth-peor.<P>The name Neba is found on a ridge which, some 5 miles southwest of Hesban and opposite the northern end of the Dead Sea, runs out to the west from the plateau of Moab, "sinking gradually: at first a broad brown field of arable land, then a flat top crowned by a ruined cairn, then a narrower ridge ending in the summit called Siagbah, whence the slopes fall steeply on all sides. The name Nebo or Neba (the "knob" or "tumulus") applies to the flat top with the cairn, and the name Tal\'at es-Sufa to the ascent leading up to the ridge from the north. Thus we have three names which seem to connect the ridge with that whence Moses is related to have viewed the Promised Land, namely, first, Nebo, which is identically the same word as the modern Neba; secondly, Siaghah, which is radically identical with the Aramaic Se\'ath, the word standing instead of Nebo in the Targum of Onkelos (<a onClick="return mV(\'Num\',32,3);">Nu 32:3</a>), where it is called the burial place of Moses; thirdly, Tal\'at es-Sufa, which is radically identical with the Hebrew Zuph (tsuph), whence Mizpah (mitspah) and Zophim (tsophim...The name Pisgah is not now known, but the discovery of Zophim (compare <a onClick="return mV(\'Num\',23,14);">Nu 23:14</a>) confirms the view now generally held, that it is but another title of the Nebo range."<P>Neither Mt. Hermon nor Dan (Tell el-Qady) is visible from this point; nor can Zoar be seen; and if the Mediterranean is the hinder sea, it also is invisible. But, as Driver says ("Dt," ICC, 419), the terms in <a onClick="return mV(\'Deu\',34,1,3);">De 34:1,3</a> are hyperbolical, and must be taken as including points filled in by the imagination as well as those actually visible to the eye. Mr. Birch argues in favor of Tal\'at el-Benat, whence he believes Dan and Zoar to be visible, while he identifies "the hinder sea" with the Dead Sea (PEFS,1898,110ff).``54';
isbe[6317]='Nebuchadnezzar; Nebuchadrezzar`neb-u-kad-nez\'-ar, -rez\'-ar: Nebuchadnezzar, the second king of Babylon of that name, is best known as the king who conquered Judah, destroyed Jerusalem, and carried the people of the Jews captive to Babylon. Of all the heathen monarchs mentioned by name in the Scriptures, Nebuchadnezzar is the most prominent and the most important. The prophecies of Jeremiah, Ezekiel, and Daniel, and the last chapters of Kings and Chronicles centered about his life, and he stands preeminent, along with the Pharaohs of the oppression and the exodus, among the foes of the kingdom of God. The documents which have been discovered in Babylon and elsewhere within the last 75 years have added much to our knowledge of this monarch, and have in general confirmed the Biblical accounts concerning him.<P>1. His Name:<P>His name is found in two forms in the Bible, Nebuchadnezzar and Nebuchadrezzar. In the Septuagint he is called Nabouchodonosor, and in the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Nabuchodonosor. This latter form is found also in the King James Version Apocrypha throughout and in the Revised Version (British and American) 1Esdras, Ad Esther and Baruch, but not Judith or Tobit. This change from "r" to "n" which is found in the two writings of the name in the Hebrew and the Aramaic of the Scriptures is a not uncommon one in the Semitic languages, as in Burnaburiyash and Burraburiyash, Ben-hadad and Bar-hadad (see Brockelmann\'s Comparative Grammar,136,173, 220). It is possible, however, that the form Nebuchadnezzar is the Aramaic translation of the Babylonian Nebuchadrezzar. If we take the name to be compounded of Nabu-kudurri-usur in the sense "O Nebo, protect thy servant," then Nabu-kedina-usur would be the best translation possible in Aramaic. Such translations of proper names are common in the old versions of the Scriptures and elsewhere. For example, in WAI, V,44,we find 4 columns of proper names of persons giving the Sumerian originals and the Semitic translations of the same; compare Bar-hadad in Aramaic for Hebrew Ben-hadad. In early Aramaic the "S" had not yet become "T" (see Cooke, Text-Book of North-Sem Inscriptions, 188f); so that for anyone who thought that kudurru meant "servant," Nebuchadnezzar would be a perfect translation into Aramaic of Nebuchadrezzar.<P>2. Family:<P>The father of Nebuchadnezzar was Nabopolassar, probably a Chaldean prince. His mother is not known by name. The classical historians mention two wives: Amytis, the daughter of Astyages, and Nitocris, the mother of Nabunaid. The monuments mention three sons: Evil-merodach who succeeded him, Marduk-shum-utsur, and Marduk-nadin-achi. A younger brother of Nebuchadnezzar, called Nabu-shum-lishir, is mentioned on a building-inscription tablet from the time of Nabopolassar.<P>3. Sources of Information:<P>The sources of our information as to the life of Nebuchadnezzar are about 500 contract tablets dated according to the days, months and years of his reign of 43 years; about 30 building and honorific inscriptions; one historical inscription; and in the Books of Jeremiah, Ezekiel, Daniel, and Kings. Later sources are Chronicles, Ezra, and the fragments of Berosus, Menander, Megasthenes, Abydenus, and Alexander Polyhistor, largely as cited by Josephus and Eusebius.<P>4. Political History:<P>From these sources we learn that Nebuchadnezzar succeeded his father on the throne of Babylon in 604 BC, and reigned till 561 BC. He probably commanded the armies of Babylon from 609. BC. At any rate, he was at the head of the army which defeated Pharaoh-necoh at Carchemish on the Euphrates in 605 BC (see <a onClick="return mV(\'2Ki\',23,31);">2Ki 23:31</a>; <a onClick="return mV(\'2Ch\',35,20);">2Ch 35:20</a>ff). After having driven Necoh out of Asia and settled the affairs of Syria and Palestine, he was suddenly recalled to Babylon by the death of his father. There he seems quietly to have ascended the throne. In the 4th year of Jehoiakim (or 3rd according to the Babylonian manner of reckoning (<a onClick="return mV(\'Dan\',1,1);">Da 1:1</a>)), he came up first against Jerusalem and carried away part of the vessels of the temple and a few captives of noble lineage. Again, in Jehoiakim\'s 11th year, he captured Jerusalem, put Jehoiakim, its king, into chains, and probably killed him. His successor, Jehoiachin, after a three months\' reign, was besieged in Jerusalem, captured, deposed, and carried captive to Babylon, where he remained in captivity 37 years until he was set free by Evil-merodach. In the 9th year of Zedekiah, Nebuchadnezzar made a 4th expedition against Jerusalem which he besieged, captured, and destroyed (see <a onClick="return mV(\'Jer\',52,\'1-\');">Jer 52</a>). In addition to these wars with Judah, Nebuchadnezzar carried on a long siege of Tyre, lasting 13 years, from his 7th to his 20th year. He had at least three wars with Egypt. The first culminated in the defeat of Necoh at Carchemish; the second in the withdrawal of Hophra (Apries) from Palestine in the 1st year of the siege of Jerusalem under Zedekiah; and the third saw the armies of Nebuchadnezzar entering Egypt in triumph and defeating Amasis in Nebuchadnezzar\'s 37th year. In the numerous building and honorific inscriptions of Nebuchadnezzar he makes no mention by name of his foes or of his battles; but he frequently speaks of foes that he had conquered and of many peoples whom he ruled. Of these peoples he mentions by name the Hittites and others (see Langdon, 148-51). In the Wady-Brissa inscription, he speaks of a special conquest of Lebanon from some foreign foe who had seized it; but the name of the enemy is not given.<P>5. Buildings, etc.:<P>The monuments justify the boast of Nebuchadnezzar "Is not this great Babylon that I have built?" (<a onClick="return mV(\'Dan\',4,30);">Da 4:30</a>). Among these buildings special emphasis is placed by Nebuchadnezzar upon his temples and shrines to the gods, particularly to Marduk, Nebo and Zarpinat, but also to Shamash, Sin, Gula, Ramman, Mah, and others. He constructed, also, a great new palace and rebuilt an old one of his father\'s. Besides, he laid out and paved with bricks a great street for the procession of Marduk, and built a number of great walls with moats and moat-walls and gates. He dug several broad, deep canals, and made dams for flooding the country to the north and south of Babylon, so as to protect it against the attack of its enemies. He made, also, great bronze bulls and serpents, and adorned his temples and palaces with cedars and gold. Not merely in Babylon itself, but in many of the cities of Babylonia as well, his building operations were carried on, especially in the line of temples to the gods.<P>6. Religion, etc.:<P>The inscriptions of Nebuchadnezzar show that he was a very religious man, probably excelling all who had preceded him in the building of temples, in the institution of offerings, and the observance of all the ceremonies connected with the worship of the gods. His larger inscriptions usually contain two hymns and always close with a prayer. Mention is frequently made of the offerings of precious metals, stones and woods, of game, fish, wine, fruit, grain, and other objects acceptable to the gods. It is worthy of note that these offerings differ in character and apparently in purpose from those in use among the Jews. For example, no mention is made in any one of Nebuchadnezzar\'s inscriptions of the pouring out or sprinkling of blood, nor is any reference made to atonement, or to sin.<P>7. Madness:<P>No reference is made in any of these inscriptions to Nebuchadnezzar\'s insanity. But aside from the fact that we could scarcely expect a man to publish his own calamity, especially madness, it should be noted that according to Langdon we have but three inscriptions of his written in the period from 580 to 561 BC. If his madness lasted for 7 years, it may have occurred between 580 and 567 BC, or it may have occurred between the Egyptian campaign of 567 BC and his death in 561 BC. But, as it is more likely that the "7 times" mentioned in Dan may have been months, the illness may have been in any year after 580 BC, or even before that for all we know.<P>8. Miracles, etc.:<P>No mention is made on the monuments<P class="in15">(1) of the dream of Nebuchadnezzar recorded in <a onClick="return mV(\'Dan\',2,\'1-\');">Da 2</a>, or<P class="in15">(2) of the image of gold that he set up, or<P class="in15">(3) of the fiery furnace from which the three children were delivered (<a onClick="return mV(\'Dan\',3,\'1-\');">Da 3</a>).<P>As to (1), it may be said, however, that a belief in dreams was so universal among all the ancient peoples, that a single instance of this kind may not have been considered as worthy of special mention. The annals of Ashur-banipal and Nubu-naid and Xerxes give a number of instances of the importance attached to dreams and their interpretation. It is almost certain that Nebuchadnezzar also believed in them. That the dream recorded in Dan is not mentioned on the monuments seems less remarkable than that no dream of his is recorded.<P>As to (2) we know that Nebuchadnezzar made an image of his royal person (salam sharrutiya, Langdon, XIX, B, col. x, 6; compare the image of the royal person of Nabopolassar, id, p. 51), and it is certain that the images of the gods were made of wood (id, p. 155), that the images of Nebo and Marduk were conveyed in a bark in the New Year\'s procession (id, pp. 157,159,163, 165) and that there were images of the gods in all the temples (id, passim); and that Nebuchadnezzar worshipped before these images. That Nebuchadnezzar should have made an image of gold and put it up in the Plain of Dura is entirely in harmony with what we know of his other "pious deeds."<P>(3) As to "the fiery furnace," it is known that Ashurbanipal, king of Assyria, says that his own brother, Shamash-shumukin, was burned in a similar furnace.<P>The failure of Nebuchadnezzar to mention any of the particular persons or events recorded in Dan does not disprove their historicity, any more than his failure to mention the battle of Carchemish, or the siege of Tyre and Jerusalem, disproves them. The fact is, we have no real historical inscription of Nebuchadnezzar, except one fragment of a few broken lines found in Egypt.<P>LITERATURE.<P>T.G. Pinches, The New Testament in the Light of the Historical Records and Legends of Assyria and Babylonia; Stephen Langdon, Building Inscriptions of the Neo-Babylonian Empire. See also, Rogers, History of Babylonia and Assyria; and McCurdy, History, Prophecy and the Monuments, III.``196';
isbe[6318]='Nebushazban`neb-u-shaz\'-ban (nebhushazebhan equals Assyrian Nabusezib-anni, "Nebo delivers me"; the King James Version Nebushasban): An important officer (the Rab-saris, chief captain or "chief eunuch") of the Babylonian army, who with Nergal-sharezer and others was appointed to see to the safety of Jeremiah after the taking of Jerusalem (<a onClick="return mV(\'Jer\',39,13);">Jer 39:13</a>).``1';
isbe[6319]='Nebuzaradan`neb-u-zar-a\'-dan, -zar\'-a-dan (nebhuzar\'adhan equals Assyrian Nabu-zara-iddina, "Nebo has given seed"; Nebouzardan): Nebuchadnezzar\'s general at the siege of Jerusalem (<a onClick="return mV(\'2Ki\',25,8,11,20);">2Ki 25:8,11,20</a>; <a onClick="return mV(\'Jer\',52,12,15,26);">Jer 52:12,15,26</a>; <a onClick="return mV(\'Jer\',39,9,10,11,13);">39:9,10,11,13</a>). Under the title of "captain of the guard," he commanded the army, and, after the fall of the city, carried out his master\'s policy with regard to the safety of Jeremiah, the transport of the exiles, and the government of those who were left in the land.``1';
isbe[6320]='Necho; Nechoh`ne\'-ko.`<a href="./study/isbe/search.html?string=PHARAOH-NECOH">PHARAOH-NECOH</a>`1';
isbe[6321]='Neck`nek (tsawwar, tsawwa\'r, tsawwaron, tsawwa\'rah, Aramaic tsawwar (<a onClick="return mV(\'Dan\',5,7,16,29);">Da 5:7,16,29</a>), \'oreph, miphreqeth (<a onClick="return mV(\'1Sa\',4,18);">1Sa 4:18</a>); nostos, "back" (Baruch 2:33); occasionally the words garon (<a onClick="return mV(\'Isa\',3,16);">Isa 3:16</a>; <a onClick="return mV(\'Eze\',16,11);">Eze 16:11</a>), and gargeroth, plural of gargarah, literally, "throat" (<a onClick="return mV(\'Pro\',1,9);">Pr 1:9</a>; <a onClick="return mV(\'Pro\',3,3,12);">3:3,12</a>; <a onClick="return mV(\'Pro\',6,21);">6:21</a>), are translated "neck"): The neck is compared with a tower for beauty (<a onClick="return mV(\'Sgs\',4,4);">So 4:4</a>; <a onClick="return mV(\'Sgs\',7,4);">7:4</a>) and is decorated with necklaces and chains (<a onClick="return mV(\'Pro\',1,9);">Pr 1:9</a>; <a onClick="return mV(\'Pro\',3,3,12);">3:3,12</a>; <a onClick="return mV(\'Pro\',6,21);">6:21</a>, Hebrew gargeroth; <a onClick="return mV(\'Eze\',16,11);">Eze 16:11</a>, Hebrew garon, "throat"; <a onClick="return mV(\'Dan\',5,7,16,29);">Da 5:7,16,29</a>, Hebrew tsawwar). It is also the part of the body where the yoke, emblem of labor and hardship, dependence and subjection, is borne (<a onClick="return mV(\'Deu\',28,48);">De 28:48</a>; <a onClick="return mV(\'Jer\',27,8,11,12);">Jer 27:8,11,12</a>; <a onClick="return mV(\'Jer\',28,14);">28:14</a>; <a onClick="return mV(\'Act\',15,10);">Ac 15:10</a>). "To shake off the yoke," "to break the yoke," or "to take it off" is expressive of the regaining of independence and liberty, either by one\'s own endeavors or through help from outside (<a onClick="return mV(\'Gen\',27,40);">Ge 27:40</a>; <a onClick="return mV(\'Isa\',10,27);">Isa 10:27</a>; <a onClick="return mV(\'Jer\',28,11);">Jer 28:11</a>; <a onClick="return mV(\'Jer\',30,8);">30:8</a>). Certain animals which were not allowed as food (like the firstborn which were not redeemed) were to be killed by having their necks (\'oreph) broken (<a onClick="return mV(\'Exd\',13,13);">Ex 13:13</a>; <a onClick="return mV(\'Exd\',34,20);">34:20</a>); the turtle-doves and young pigeons, which were sacrificed as sin offerings or as burnt offerings, had their heads wrung or pinched off from their necks (<a onClick="return mV(\'Lev\',5,8);">Le 5:8</a>). In <a onClick="return mV(\'1Sa\',4,18);">1Sa 4:18</a> the Hebrew word miphreqeth signifies a fracture of the upper part of the spinal column caused by a fall.<P>It was a military custom of antiquity for the conqueror to place his foot upon the vanquished. This custom, frequently represented in sculpture on many an Egyptian temple wall, is referred to in <a onClick="return mV(\'Jos\',10,24);">Jos 10:24</a>; Baruch 4:25 and probably in <a onClick="return mV(\'Rom\',16,20);">Ro 16:20</a> and <a onClick="return mV(\'Psa\',110,1);">Ps 110:1</a>. Paul praises the devotion of Aquila and Priscilla, "who for my life laid down their own necks" (<a onClick="return mV(\'Rom\',16,4);">Ro 16:4</a>).<P>To "fall on the neck" of a person is a very usual mode of salutation in the East (<a onClick="return mV(\'Gen\',33,4);">Ge 33:4</a>; <a onClick="return mV(\'Gen\',45,14);">45:14</a>; <a onClick="return mV(\'Gen\',46,29);">46:29</a>; Tob 11:9,13; <a onClick="return mV(\'Luk\',15,20);">Lu 15:20</a>; <a onClick="return mV(\'Act\',20,37);">Ac 20:37</a>). In moments of great emotion such salutation is apt to end in weeping on each other\'s neck.<P>Readiness for work is expressed by "putting one\'s neck to the work" (<a onClick="return mV(\'Neh\',3,5);">Ne 3:5</a>). Severe punishment and calamity are said to "reach to the neck" (<a onClick="return mV(\'Isa\',8,8);">Isa 8:8</a>; <a onClick="return mV(\'Isa\',30,28);">30:28</a>).<P>The Lord Jesus speaks of certain persons for whom it were better to have had a millstone put around the neck and to have been drowned in the sea. The meaning is that even the most disgraceful death is still preferable to a life of evil influence upon even the little ones of God\'s household (<a onClick="return mV(\'Mat\',18,6);">Mt 18:6</a>; <a onClick="return mV(\'Mar\',9,42);">Mr 9:42</a>; <a onClick="return mV(\'Luk\',17,2);">Lu 17:2</a>).<P>To "make the neck stiff," to "harden the neck" indicates obstinacy often mingled with rebellion (<a onClick="return mV(\'Exd\',32,9);">Ex 32:9</a>; <a onClick="return mV(\'Exd\',33,3,5);">33:3,5</a>; <a onClick="return mV(\'Exd\',34,9);">34:9</a>; <a onClick="return mV(\'2Ch\',30,8);">2Ch 30:8</a>; <a onClick="return mV(\'2Ch\',36,13);">36:13</a>; <a onClick="return mV(\'Neh\',9,16,17,29);">Ne 9:16,17,29</a>; <a onClick="return mV(\'Psa\',75,5);">Ps 75:5</a> (the Revised Version margin "insolently with a haughty neck"); <a onClick="return mV(\'Pro\',29,1);">Pr 29:1</a>; <a onClick="return mV(\'Jer\',7,26);">Jer 7:26</a>). Compare sklerotracholes, "stiffnecked" (<a onClick="return mV(\'Act\',7,51);">Ac 7:51</a>). Similarly Isaiah (<a onClick="return mV(\'Isa\',48,4);">48:4</a>) speaks of the neck of the obstinate sinner as resembling an iron sinew.`<a href="./study/isbe/search.html?string=FOOTSTOOL">FOOTSTOOL</a>`106';
isbe[6322]='Necklace`nek\'-las (rabhidh, "chain"): A neck-chain ornament, worn either separately (<a onClick="return mV(\'Eze\',16,11);">Eze 16:11</a>), or with pendants (<a onClick="return mV(\'Isa\',3,19);">Isa 3:19</a>), such as crescents (<a onClick="return mV(\'Isa\',3,18);">Isa 3:18</a>) or rings (<a onClick="return mV(\'Gen\',38,25);">Ge 38:25</a>); sometimes made of gold (<a onClick="return mV(\'Gen\',41,42);">Ge 41:42</a>; <a onClick="return mV(\'Dan\',5,29);">Da 5:29</a>), or of strings of jewels (<a onClick="return mV(\'Sgs\',1,10);">So 1:10</a>). Even beasts of burden were sometimes so adorned by royalty (<a onClick="return mV(\'Jdg\',8,26);">Jud 8:26</a>). It was considered suggestive of pride (<a onClick="return mV(\'Psa\',73,6);">Ps 73:6</a>) or of filial loyalty (<a onClick="return mV(\'Pro\',1,9);">Pr 1:9</a>). The word does not occur in the King James Version, but such adornments have always been popular in all the Bible lands.``1';
isbe[6323]='Neco`ne\'-ko (nekho (<a onClick="return mV(\'2Ch\',35,22);">2Ch 35:22</a>; <a onClick="return mV(\'2Ch\',36,4);">36:4</a>))., "chain"): A neck-chain ornament, worn either separately (<a onClick="return mV(\'Eze\',16,11);">Eze 16:11</a>), or with pendants (<a onClick="return mV(\'Isa\',3,19);">Isa 3:19</a>), such as crescents (<a onClick="return mV(\'Isa\',3,18);">Isa 3:18</a>) or rings (<a onClick="return mV(\'Gen\',38,25);">Ge 38:25</a>); sometimes made of gold (<a onClick="return mV(\'Gen\',41,42);">Ge 41:42</a>; <a onClick="return mV(\'Dan\',5,29);">Da 5:29</a>), or of strings of jewels (<a onClick="return mV(\'Sgs\',1,10);">So 1:10</a>). Even beasts of burden were sometimes so adorned by royalty (<a onClick="return mV(\'Jdg\',8,26);">Jud 8:26</a>). It was considered suggestive of pride (<a onClick="return mV(\'Psa\',73,6);">Ps 73:6</a>) or of filial loyalty (<a onClick="return mV(\'Pro\',1,9);">Pr 1:9</a>). The word does not occur in the King James Version, but such adornments have always been popular in all the Bible lands.`<a href="./study/isbe/search.html?string=PHARAOH+NECOH">PHARAOH-NECOH</a>`1';

isbe[6326]='Nedabiah`ned-a-bi\'-a (nedhabhyah): A descendant of David (<a onClick="return mV(\'1Ch\',3,18);">1Ch 3:18</a>).``1';
isbe[6327]='Needle`ne\'-d\'-l (rhaphis): The word "needle" occurs only 3 times, namely, in the reference to Christ\'s use of the proverb: "It is easier for a camel to go through a needle\'s eye, than for a rich man to enter into the kingdom of God" (<a onClick="return mV(\'Mat\',19,24);">Mt 19:24</a>; <a onClick="return mV(\'Mar\',10,25);">Mr 10:25</a>; <a onClick="return mV(\'Luk\',18,25);">Lu 18:25</a>). This saying ought to be accepted in the same sense as <a onClick="return mV(\'Mat\',23,24);">Mt 23:24</a>, "Ye blind guides, that strain out the gnat, and swallow the camel!" Christ used them to illustrate absurdities. A rabbinical parallel is cited, "an elephant through a needle\'s eye." Some writers have attempted to show that rhaphis referred to a small gate of a walled oriental city. No evidence of such a use of the word exists in the terms applied today in Biblical lands to this opening. "Rich man" here has the connotation of a man bound up in his riches. If a man continues to trust in his earthly possessions to save him, it would be absurd for him to expect to share in the spiritual kingdom where dependence upon the King is a first requisite.<P>The fact that needles are not mentioned elsewhere in the Bible should not be taken to indicate that this instrument was not used. Specimens of bone and metal needles of ancient origin show that they were common household objects.`<a href="./study/isbe/search.html?string=CAMEL">CAMEL</a>`133';

isbe[6330]='Neesing`ne\'-zing (<a onClick="return mV(\'Job\',41,18);">Job 41:18</a>, the King James Version, the English Revised Version "by his neesings a light doth shine," the American Standard Revised Version "sneezings"): "Neese" in Elizabethan English (through two distinct derivations) could mean either "sneeze" or "snort," and it is impossible to say which force was intended by the King James Version editors. The Hebrew is \'atishah, a word found only here, but connected with a Semitic root meaning "sneeze," or, perhaps, "snort." <a onClick="return mV(\'Job\',41,18);">Job 41:18</a> is part of the description of the "leviathan" or crocodile. This animal has a habit of inflating himself, and after this he discharges through his nostrils the moist, heated vapor, which sparkles in the sunlight. The act is neither a "sneeze" nor a "snort," but the latter word is sufficiently descriptive. There is no allusion to legendary "fire-spouting" monsters. Compare <a onClick="return mV(\'Job\',39,20);">Job 39:20</a>; <a onClick="return mV(\'Jer\',8,16);">Jer 8:16</a>.<P>In the older editions of the King James Version "neesed" is found in <a onClick="return mV(\'2Ki\',4,35);">2Ki 4:35</a>: "and the child neesed seven times" (later editions and the Revised Version (British and American) "sneezed").``48';
isbe[6331]='Negeb`neg\'-eb (ha-neghebh, "the negeb" or simply, neghebh, from a root meaning "to be dry," and therefore in the first instance implying the "dry" or "parched regions," hence, in the Septuagint it is usually translated eremos, "desert," also nageb):<P>1. Meaning:<P>As the Negeb lay to the south of Judah, the word came to be used in the sense of "the south," and is so used in a few passages (e.g. <a onClick="return mV(\'Gen\',13,14);">Ge 13:14</a>) and in such is translated lips (see <a href="./study/isbe/search.html?string=GEOGRAPHY">GEOGRAPHY)</a>. The English translation is unsuitable in several passages, and likely to lead to confusion. For example, in <a onClick="return mV(\'Gen\',13,1);">Ge 13:1</a> Abram is represented as going "into the south" when journeying northward from Egypt toward Bethel; in <a onClick="return mV(\'Num\',13,22);">Nu 13:22</a> the spies coming from the "wilderness of Zin" toward Hebron are described as coming "by the south," although they were going north. The difficulty in these and many other passages is at once obviated if it is recognized that the Negeb was a geographical term for a definite geographical region, just as Shephelah, literally, "lowland," was the name of another district of Palestine. In the Revised Version (British and American) "Negeb" is given in margin, but it would make for clearness if it were restored to the text.<P>2. Description:<P>This "parched" land is generally considered as beginning south of edition Dahariyeb—the probable site of <a href="./study/isbe/search.html?string=DEBIR">DEBIR</a> (which see)—and as stretching south in a series of rolling hills running in a general direction of east to west until the actual wilderness begins, a distance of perhaps 70 miles (see <a href="./study/isbe/search.html?string=NATURAL+FEATURES">NATURAL FEATURES</a>). To the east it is bounded by the Dead Sea and the Southern Ghor, and to the west there is no defined boundary before the Mediterranean. It is a land of sparse and scanty springs and small rainfall; in the character of its soil it is a transition from the fertility of Canaan to the wilderness of the desert; it is essentially a pastoral land, where grazing is plentiful in the early months and where camels and goats can sustain life, even through the long summer drought. Today, as through most periods of history, it is a land for the nomad rather than the settled inhabitant, although abundant ruins in many spots testify to better physical conditions at some periods (see I,5,below). The direction of the valleys east or west, the general dryness, and the character of the inhabitants have always made it a more or less isolated region without thoroughfare. The great routes pass along the coast to the west or up the Arabah to the east. It formed an additional barrier to the wilderness beyond it; against all who would lead an army from the south, this southern frontier of Judah was always secure. Israel could not reach the promised land by this route, through the land of the Amalekites (<a onClick="return mV(\'Num\',13,29);">Nu 13:29</a>; <a onClick="return mV(\'Num\',14,\'43-45\');">14:43-45</a>).<P>3. Old Testament References:<P>The Negeb was the scene of much of Abram\'s wanderings (<a onClick="return mV(\'Gen\',12,9);">Ge 12:9</a>; <a onClick="return mV(\'Gen\',13,1,3);">13:1,3</a>; <a onClick="return mV(\'Gen\',20,1);">20:1</a>); it was in this district that Hagar met with the angel (<a onClick="return mV(\'Gen\',16,7,14);">Ge 16:7,14</a>); Isaac (<a onClick="return mV(\'Gen\',24,62);">Ge 24:62</a>) and Jacob (<a onClick="return mV(\'Gen\',37,1);">Ge 37:1</a>; <a onClick="return mV(\'Gen\',46,5);">46:5</a>) both dwelt there. Moses sent the spies through this district to the hill country (<a onClick="return mV(\'Num\',13,17,22);">Nu 13:17,22</a>); the Amalekites then dwelt there (<a onClick="return mV(\'Num\',13,29);">Nu 13:29</a>) and apparently, too, in some parts of it, the Avvim (<a onClick="return mV(\'Jos\',13,3,4);">Jos 13:3,4</a>). The inheritance of the children of Simeon, as given in <a onClick="return mV(\'Jos\',19,\'1-9\');">Jos 19:1-9</a>, was in the Negeb, but in <a onClick="return mV(\'Jos\',15,\'21-32\');">Jos 15:21-32</a> these cities are credited to Judah (see <a href="./study/isbe/search.html?string=SIMEON">SIMEON</a>). Achish allotted to David, in response to his request, the city of <a href="./study/isbe/search.html?string=ZIKLAG">ZIKLAG</a> (q.v) in the Negeb (<a onClick="return mV(\'1Sa\',27,5);">1Sa 27:5</a>f); the exploits of David were against various parts of this district described as the Negeb of Judah, the Negeb of the <A href="./study/isbe/search.html?string=JERAHMEEL;+JERAHMEELITES">Jerahmeelites</a>, and the Negeb of the <A href="./study/isbe/search.html?string=KENITES">Kenites</a> while in <a onClick="return mV(\'1Sa\',30,14);">1Sa 30:14</a> we have mention of the Negeb of the <A href="./study/isbe/search.html?string=CHERETHITES">Cherethites</a> and the Negeb of <A href="./study/isbe/search.html?string=CALEB">Caleb</a>. To this we may add the Negeb of <A href="./study/isbe/search.html?string=ARAD">Arad</a> (<a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a>). It is impossible to define the districts of these various clans (see separate articles under these names). The, Negeb, together with the "hill-country" and the "Shephelah," was according to Jeremiah (<a onClick="return mV(\'Jer\',17,26);">17:26</a>; <a onClick="return mV(\'Jer\',32,44);">32:44</a>; <a onClick="return mV(\'Jer\',33,13);">33:13</a>) to have renewed prosperity after the captivity of Judah was ended.<P>4. Later History:<P>When Nebuchadnezzar took Jerusalem the Edomites sided with the Babylonians (compare <a onClick="return mV(\'Lam\',4,21);">La 4:21</a>f; <a onClick="return mV(\'Eze\',35,\'3-15\');">Eze 35:3-15</a>; <a onClick="return mV(\'Oba\',1,\'10-16\');">Ob 1:10-16</a>), and during the absence of the Jews they advanced north and occupied all the Negeb and Southern Judea as far as Hebron (see <a href="./study/isbe/search.html?string=JUDAEA">JUDAEA</a>). Here they annoyed the Jews in Maccabean times until Judas expelled them from Southern Judea (164 BC) and John Hyrcanus conquered their country and compelled them to become Jews (109 BC). It was to one of the cities here—Malatha—that Herod Agrippa withdrew himself (Josephus, Ant, XVIII, vi, 2).<P>The palmy days of this district appear to have been during the Byzantine period: the existing ruins, so far as they can be dated at all, belong to this time. Beersheba was an important city with a bishop, and Elusa (mentioned by Ptolemy in the 2nd century) was the seat of a bishop in the 4th, 5th and 6th centuries. After the rise of Mohammedanism the land appears to have lapsed into primitive conditions. Although lawlessness and want of any central control may account for much of the retrogression, yet it is probable that Professor Ellsworth Huntington (loc. cit.) is right in his contention that a change of climate has had much to do with the rise and fall of civilization and settled habitation in this district. The district has long been given over to the nomads, and it is only quite recently that the Turkish policy of planting an official with a small garrison at Beersheba and at \'Aujeh has produced some slight change in the direction of a settled population and agricultural pursuits.<P>5. Its Ancient Prosperity:<P>It is clear that in at least two historic periods the Negeb enjoyed a very considerable prosperity. What it may have been in the days of the Patriarchs it is difficult to judge; all we read of them suggests a purely nomadic life similar to the Bedouin of today but with better pasturage. In the division of the land among the tribes mention is made of many cities—the Hebrew mentions 29 (<a onClick="return mV(\'Jos\',15,\'21-32\');">Jos 15:21-32</a>; <a onClick="return mV(\'Jos\',19,\'1-9\');">19:1-9</a>; <a onClick="return mV(\'1Ch\',4,\'28-33\');">1Ch 4:28-33</a>)—and the wealth of cattle evidently was great (compare <a onClick="return mV(\'1Sa\',15,9);">1Sa 15:9</a>; <a onClick="return mV(\'1Sa\',27,9);">27:9</a>; <a onClick="return mV(\'1Sa\',30,16);">30:16</a>; <a onClick="return mV(\'2Ch\',14,14);">2Ch 14:14</a>f). The condition of things must have been far different from that of recent times.<P>The extensive ruins at Bir es Seba\' (Beersheba) Khalasa (Elusa), Ruheibeh (<a href="./study/isbe/search.html?string=REHOBOTH">REHOBOTH</a>, which see), \'Aujeh and other cities, together with the signs of orchards, vineyards and gardens scattered widely around these and other sites, show how comparatively well populated this area was in Byzantine times in particular. Professor Huntington (loc. cit.) concludes from these ruins that the population of the large towns of the Negeb alone at this period must have amounted to between 45,000 and 50,000. The whole district does not support 1,000 souls today.<P>LITERATURE.<P>Robinson, BR (1838); Wilton, The Negeb, or "South Country" of Scripture (1863); E.H. Palmer, The Desert of the Exodus, II (1871); Trumbull, Kadesh-Barnea (1884); G. A. Smith, HGHL, chapter xiii (1894); E. Huntington, Palestine and Its Transformation, chapter vi, etc.``117';
isbe[6332]='Neginah; Neginoth`ne-ge\'-na (<a onClick="return mV(\'Psa\',61,1);">Ps 61 the King James Version, title</a>), ne-ge\'-noth, neg\'-i-noth (<a onClick="return mV(\'Psa\',4,1);">Ps 4 the King James Version, title</a>).`<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>; <a href="./study/isbe/search.html?string=PSALMS">PSALMS</a>`1';
isbe[6333]='Nehelamite, the`ne-hel\'-a-mit, (ha-necheldmi): The designation of Shemaiah, a false prophet who opposed Jeremiah (<a onClick="return mV(\'Jer\',29,24,31,32);">Jer 29:24,31,32</a>). The word means "dweller of Nehelam," but no such place-name is found in the Old Testament. Its etymology, however, suggests a connection with the Hebrew chalam, "to dream," and this has given rise to the rendering of the King James Version margin "dreamer."``1';
isbe[6334]='Nehemiah`ne-he-mi\'-a, ne-hem-i\'-a (nechemyah, "comforted of Yah"):<P>1. Family<P>2. Youth<P>3. King\'s Cupbearer<P>4. Governor of Judea<P>5. Death<P>LITERATURE<hr /><P>Nehemiah, the son of Hacaliah, is the Jewish patriot whose life is recorded in the Biblical work named after him. All that we know about him from contemporary sources is found in this book; and so the readers of this article are referred to the Book of Nehemiah for the best and fullest account of his words and deeds.<P>1. Family:<P>All that is known of his family is that he was the son of Hacaliah (<a onClick="return mV(\'Neh\',1,1);">Ne 1:1</a>) and that one of his brothers was called Hanani (<a onClick="return mV(\'Neh\',1,2);">Ne 1:2</a>; <a onClick="return mV(\'Neh\',7,2);">7:2</a>); the latter a man of sufficient character and importance to have been made a ruler of Jerusalem.<P>From <a onClick="return mV(\'Neh\',10,\'1-8\');">Ne 10:1-8</a> some have inferred that he was a priest, since Nehemiah comes first in the list of names ending with the phrase, "these were the priests." This view is supported by the Syriac and Arabic versions of <a onClick="return mV(\'Neh\',10,1);">10:1</A>, which read: "Nehemiah the elder, the son of Hananiah the chief of the priests"; and by the Latin Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) of 2Macc 1:21, where he is called "Nehemiah the priest," and possibly by 2Macc 1:18, where it is said that Nehemiah "offered sacrifices, after that he had builded the temple and the altar."<P>The argument based upon <a onClick="return mV(\'Neh\',10,\'1-8\');">Ne 10:1-8</a> will fall to the ground, if we change the pointing of the "Seraiah" of the 3rd verse and read "its princes," referring back to the princes of <a onClick="return mV(\'Neh\',10,1);">10:1</A>. In this case, Nehemiah and Zedekiah would be the princes; then would come the priests and then the Levites.<P>Some have thought that he was of the royal line of Judah, inasmuch as he refers to his "fathers\' sepulchres" at Jerusalem (<a onClick="return mV(\'Neh\',2,3);">Ne 2:3</a>). This would be a good argument only if it could be shown that none but kings had sepulchers at Jerusalem.<P>It has been argued again that he was of noble lineage because of his position as cupbearer to the king of Persia. To substantiate this argument, it would need to be shown that none but persons of noble birth could serve in this position; but this has not been shown, and cannot be shown.<P>2. Youth:<P>From the fact that Nehemiah was so grieved at the desolation of the city and sepulchers of his fathers and that he was so jealous for the laws of the God of Judah, we can justly infer that he was brought up by pious parents, who instructed him in the history and law of the Jewish people.<P>3. King\'s Cupbearer:<P>Doubtless because of his probity and ability, he was apparently at an early age appointed by Artaxerxes, king of Persia, to the responsible position of cupbearer to the king. There is now no possible doubt that this King his king was Artaxerxes, the first of that name, commonly called Longimanus, who ruled over Persia from 464 to 424 BC. The mention of the sons of Sanballat, governor of Samaria, in a letter written to the priests of Jerusalem in 407 BC, among whom Johanan is especially named, proves that Sanballat must have ruled in the time of Artaxerxes I rather than in that of Artaxerxes II.<P>The office of cupbearer was "one of no trifling honor" (Herod. iii.34). It was one of his chief duties to taste the wine for the king to see that it was not poisoned, and he was even admitted to the king while the queen was present (<a onClick="return mV(\'Neh\',2,6);">Ne 2:6</a>). It was on account of this position of close intimacy with the king that Nehemiah was able to obtain his commission as governor of Judea and the letters and edicts which enabled him to restore the walls of Jerusalem.<P>4. Governor of Judea:<P>The occasion of this commission was as follows: Hanani, the brother of Nehemiah, and other men of Judah came to visit Nehemiah while he was in Susa in the 9th month of the 20th year of Artaxerxes. They reported that the Jews in Jerusalem were in great affliction and that the wall thereof was broken down and its gates burned with fire. Thereupon he grieved and fasted and prayed to God that he might be granted favor by the king. Having appeared before the latter in the 1st month of the 21st year of Artaxerxes, 444 BC, he was granted permission to go to Jerusalem to build the city of his fathers\' sepulchers, and was given letters to the governors of Syria and Palestine and especially to Asaph, the keeper of the king\'s forest, ordering him to supply timber for the wall, the fortress, and the temple. He was also appointed governor of the province of which Jerusalem was the capital.<P>Armed with these credentials and powers he repaired to Jerusalem and immediately set about the restoration of the walls, a work in which he was hindered and harassed by Sanballat, the governor of Samaria, and others, some of them Jews dwelling in Jerusalem. Notwithstanding, he succeeded in his attempt and eventually also in providing gates for the various entrances to the city.<P>Having accomplished these external renovations, he instituted a number of social reforms. He appointed the officers necessary for better government, caused the people to be instructed in the Law by public readings, and expositions; celebrated the Feast of Tabernacles; and observed a national fast, at which the sins of the people were confessed and a new covenant with Yahweh was solemnly confirmed. The people agreed to avoid marriages with the heathen, to keep the Sabbath, and to contribute to the support of the temple. To provide for the safety and prosperity of the city, one out of every ten of the people living outside Jerusalem was compelled to settle in the city. In all of these reforms he was assisted by Ezra, who had gone up to Jerusalem in the 7th year of Artaxerxes.<P>5. Death:<P>Once, or perhaps oftener, during his governorship Nehemiah returned to the king. Nothing is known as to when or where he died. It is certain, however, that he was no longer governor in 407 BC; for at that time according to the Aramaic letter written from Elephantine to the priests of Jerusalem, Bagohi was occupying the position of governor over Judea. One of the last acts of Nehemiah\'s government was the chasing away of one of the sons of Joiada, the son of Eliashib, because he had become the son-in-law to Sanballat, the governor of Samaria. As this Joiada was the father of Johanan (<a onClick="return mV(\'Neh\',12,22);">Ne 12:22</a>) who, according to the Aramaic papyrus, was high priest in 407 BC, and according to Josephus (Ant., XI, viii.1) was high priest while Bagohi (Bogoas) was general of Artaxerxes\' army, it is certain that Nehemiah was at this time no longer in power. From the 3rd of the Sachau papyri, it seems that Bagohi was already governor in 410 BC; and, that at the same time, Dalayah, the son of Sanballat, was governor in Samaria. More definite information on these points is not to be had at present.<P>LITERATURE.<P>The only early extra-Biblical data with regard to Nehemiah and the Judea of his times are to be found:<P>(1) in the Egyptian papyri of Elephantine ("Aramaische Papyri und Ostraka aus einer judischen Militar-Kolonie zu Elephantine," Altorientalische Sprachdenkmaler des 5. Jahrhunderts vor Chr., Bearbeitet von Eduard Sachau. Leipzig, 1911);<P>(2) in Josephus, Ant, XI, vi, 6-8; vii,1,2;<P>(3) in Ecclesiasticus 49:13, where it is said: "The renown of Nehemiah is glorious; of him who established our waste places and restored our ruins, and set up the gates and bars";<p>(4) and lastly in 2Macc 1:18-36 and 2:13; in the latter of these passages it speaks of \'the writings and commentaries of Nehemiah; and how he, founding a library, gathered together the acts of the kings and the prophets and of David and the epistles of the kings concerning the holy gifts.\'`<a href="./study/isbe/search.html?string=EZRA+NEHEMIAH">EZRA-NEHEMIAH</a>`196';
isbe[6335]='Nehemiah, Book of``<a href="./study/isbe/search.html?string=EZRA+NEHEMIAH">EZRA-NEHEMIAH</a>`1';
isbe[6336]='Nehemias`ne-he-mi\'-as: Greek form of the Hebrew Nehemiah.<P>(1) Neemias, one of the leaders of the return under Zerubbabel (1Esdras 5:8) equals "Nehemiah" of <a onClick="return mV(\'Ezr\',2,2);">Ezr 2:2</a>; <a onClick="return mV(\'Neh\',7,7);">Ne 7:7</a>.<P>(2) Neemias, Codex Vaticanus Naimias, the prophet Nehemiah (1Esdras 5:40 where the King James Version margin reads "Nehemias who also is Atharias"). Neither Nehemias nor Attharias is found in the parallel <a onClick="return mV(\'Ezr\',2,63);">Ezr 2:63</a>; <a onClick="return mV(\'Neh\',7,65);">Ne 7:65</a>, but ha-tirshatha\' equals Tirshatha, "the governor," by whom Zerubbabel must be intended. Thus, the Hebrew word for "governor" has been converted into a proper name and by some blunder the name Nehemiah inserted, perhaps because he also was known by the title of "governor."``5';
isbe[6337]='Nehiloth`ne-hil\'-oth, ne\'-hi-loth (<a onClick="return mV(\'Psa\',5,1);">Ps 5, title</a>). See <a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>.``1';
isbe[6338]='Nehum`ne\'-hum (nechum): One of the twelve heads of the people who returned with Zerubbabel (<a onClick="return mV(\'Neh\',7,7);">Ne 7:7</a>). In the parallel passage (<a onClick="return mV(\'Ezr\',2,2);">Ezr 2:2</a>), the name appears as <a href="./study/isbe/search.html?string=REHUM">REHUM</a> (which see), and in 1Esdras 5:8 as "Roimus."``1';
isbe[6339]='Nehushta`ne-hush\'-ta (nechushta\'): Mother of King Jehoiachin (<a onClick="return mV(\'2Ki\',24,8);">2Ki 24:8</a>). She was the daughter of Elnathan of Jerusalem. After the fall of the city she was exiled with her son and his court (<a onClick="return mV(\'2Ki\',24,12);">2Ki 24:12</a>; <a onClick="return mV(\'Jer\',29,2);">Jer 29:2</a>).``1';
isbe[6340]='Nehushtan`ne-hush\'-tan (nechushtan; compare nechosheth, "brass," and nachash, "serpent"):<P>1. Traditional Interpretation:<P>The word occurs but once, namely, in <a onClick="return mV(\'2Ki\',18,4);">2Ki 18:4</a>. In the account there given of the reforms carried out by Hezekiah, it is said that "he brake in pieces the brazen serpent that Moses had made; for unto those days the children of Israel did burn incense to it; and he called it Nehushtan." According to the Revised Version margin the word means "a piece of brass." If this be correct, the sense of the passage is that Hezekiah not only breaks the brazen serpent in pieces but, suiting the word to the act, scornfully calls it "a (mere) piece of brass." Hezekiah thus takes his place as a true reformer, and as a champion of the purification of the religion of Israel. This is the traditional interpretation of the passage, and fairly represents the Hebrew text as it now stands.<P>2. Derivation: A Proper Noun:<P>There are at least three considerations, however, which throw doubt upon this interpretation. In the first place, the word Nehushtan is not a common noun, and cannot mean simply "a piece of brass." The point of the Biblical statement is entirely lost by such a construction. It is emphatically a proper noun, and is the special name given to this particular brazen serpent. As such it would be sacred to all worshippers of the brazen serpent, and familiar to all who frequented the Temple. In the second place, it is probable that Nehushtan is to be derived from nachash, "serpent," rather than from nechosheth, "brass,"<P>(1) because the Greek VSS, representing a form of the Hebrew text earlier than Massoretic Text, suggest this in their transliteration of Nehushtan (Codex Vaticanus Nesthalei; Codex Alexandrinus Nesthan);<P>(2) because the Hebrew offers a natural derivation of Nehushtan from nachash, "serpent"; and<P>(3) because the name of the image would more probably be based on its form than on the material out of which it was made. In the third place, the reading, "and it was called," which appears in the Revised Version margin, is decidedly preferable to that in the text. It not only represents the best reading of the Hebrew, but is confirmed by the similar reading, "and they called it," which appears in the Greek version referred to above. These readings agree in their indication that Nehushtan was the name by which the serpent-image was generally known during the years it was worshipped, rather than an expression used for the first time by Hezekiah on the occasion of its destruction.<P>Whichever derivation be adopted, however, the word must be construed as a proper name. If it be derived from "brass," then the translation must be, not "a piece of brass," but "The (great) Brass," giving the word a special sense by which it refers unequivocally to the well-known image made of brass. If it be derived from "serpent," then the translation must be, "The (great) Serpent," the word in this case referring in a special sense to the well-known image in serpent form. But the significance of the word probably lies far back of any etymological explanation of it that can now be given. It is not a term that can be adequately explained by reference to verbal roots, but is rather an epitome of the reverence of those who, however mistakenly, looked upon the brazen serpent as a proper object of worship.<P>In view of the foregoing it may be concluded,<P>(1) that Nehushtan was the (sacred) name by which the brazen serpent was known during the years "the children of Israel did burn incense to it";<P>(2) that the word is derived from nachash, "serpent"; and<P>(3) that it was used in the sense of "The Serpent," par excellence.`<a href="./study/isbe/search.html?string=IMAGES">IMAGES</a>; <a href="./study/isbe/search.html?string=SERPENT,+FIERY">SERPENT, FIERY</a>`104';
