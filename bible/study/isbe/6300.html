isbe[6341]='Neiel`ne\'i\'-el (ne\'i\'el; Codex Vaticanus Inael; Codex Alexandrinus Aniel): A town on the boundary between Zebulun and Asher mentioned between Jiftah-el and Cabul (<a onClick="return mV(\'Jos\',19,27);">Jos 19:27</a>). It may be the same as Neah (<a onClick="return mV(\'Jos\',19,13);">Jos 19:13</a>), but the place is not identified.``1';
isbe[6342]='Neigh`na (tsahal, "to cry aloud," "neigh"): Figuratively used to indicate lustful desire (<a onClick="return mV(\'Jer\',5,8);">Jer 5:8</a>; compare <a onClick="return mV(\'Neh\',13,29);">13:29</A>).``1';
isbe[6343]='Neighbor`na\'-ber (rea\', \'amith, "friend," qarobh, shakhen; ho plesion, "near" geiton, (compare 2Macc 6:8; 9:25), "inhabitant"; Latin proximus (2Esdras 15:19), civis (2Esdras 9:45; 10:2, the Revised Version margin "townman")):<P>1. As Described in the Old Testament:<P>In the Old Testament, the relationship of neighborhood involves moral and social obligations which are frequently emphasized. These are in the main described in negative rather than positive terms; e.g. there are special injunctions not to bear false witness against a neighbor (<a onClick="return mV(\'Exd\',20,16);">Ex 20:16</a>; <a onClick="return mV(\'Deu\',5,20);">De 5:20</a>; <a onClick="return mV(\'Pro\',25,18);">Pr 25:18</a>), or in any way to deal falsely with him, defraud him, frame malicious devices or harbor evil thoughts against him (<a onClick="return mV(\'Exd\',20,17);">Ex 20:17</a>; <a onClick="return mV(\'Lev\',6,2);">Le 6:2</a>; <a onClick="return mV(\'Lev\',19,13);">19:13</a>; <a onClick="return mV(\'Deu\',23,24);">De 23:24</a>f; <a onClick="return mV(\'Psa\',15,3);">Ps 15:3</a>; <a onClick="return mV(\'Psa\',101,5);">101:5</a>; <a onClick="return mV(\'Pro\',24,28);">Pr 24:28</a>; <a onClick="return mV(\'Jer\',22,13);">Jer 22:13</a>; <a onClick="return mV(\'Zec\',8,17);">Zec 8:17</a>), or to lead him into shameful conduct (<a onClick="return mV(\'Hab\',2,15);">Hab 2:15</a>), or to wrong him by lying carnally with his wife (<a onClick="return mV(\'Lev\',18,20);">Le 18:20</a>). But the supreme law that underlies these negative injunctions is stated positively. "Thou shalt love thy neighbor as thyself" (<a onClick="return mV(\'Lev\',19,18);">Le 19:18</a>). In this verse the term "neighbor"is defined by the expression, "the children of my people." Here, and generally in the Old Testament, the term implies more than mere proximity; it means one related by the bond of nationality, a fellow-countryman, compatriot. Yahweh being regarded as a national God, there was no religious bond regulating the conduct of the Hebrews with other nations. Conduct which was prohibited between fellow-Jews was permitted toward a foreigner, e.g. the exaction of interest (<a onClick="return mV(\'Deu\',23,19,20);">De 23:19,20</a>).<P>2. As Described in the New Testament:<P>In the New Testament, this limitation of moral obligation to fellow-countrymen is abolished. Christ gives a wider interpretation of the commandment in <a onClick="return mV(\'Lev\',19,18);">Le 19:18</a>, so as to include in it those outside the tie of nation or kindred. This is definitely done in the parable of the Good Samaritan (<a onClick="return mV(\'Luk\',10,\'25-37\');">Lu 10:25-37</a>), where, in answer to the question, "Who is my neighbor?" Jesus shows that the relationship is a moral, not a physical one, based not on kinship but on the opportunity and capacity for mutual help. The word represents, not so much a rigid fact, but an ideal which one may or may not realize (<a onClick="return mV(\'Luk\',10,36);">Lu 10:36</a>, "Which of these three, thinkest thou, proved (literally, became, not was) neighbor," etc.). This larger connotation follows naturally as a corollary to the doctrine of the universal Fatherhood of God. The commandment to love one\'s neighbor as one\'s self must not be interpreted as if it implied that we are to hate our enemy (an inference which the jews were apt to make); human love should be like the Divine, impartial, having all men for its object (<a onClick="return mV(\'Mat\',5,43);">Mt 5:43</a>). Love to one\'s fellow-men in this broad sense to be placed side by side with love to God as the essence and sum of human duty (<a onClick="return mV(\'Mat\',22,\'35-40\');">Mt 22:35-40</a> parallel <a onClick="return mV(\'Mar\',12,\'28-31\');">Mr 12:28-31</a>). Christ\'s apostles follow His example in giving a central position to the injunction to love one\'s neighbor as one\'s self (<a onClick="return mV(\'Jam\',2,8);">Jas 2:8</a>, where is is called the "royal law" i.e. the supreme or governing law; <a onClick="return mV(\'Rom\',13,9);">Ro 13:9</a>; <a onClick="return mV(\'Gal\',5,14);">Ga 5:14</a>).``49';
isbe[6344]='Nekeb`ne\'-keb: This name occurs only in combination with "Adami" (\'adhami ha-neqebh, "Adami of the pass"); Septuagint reads the names of two places: kai Arme kai Nabok (B); kai Armai kai Nakeb (<a onClick="return mV(\'Jos\',19,33);">Jos 19:33</a>), so we should possibly read "Adami and Nekeb." Neubauer says (Geog. du Talmud, 225) that later the name of Nekeb was Ciyadathah. It may therefore be represented by the modern Seiyadeh, not far from ed-Damieh to the east of Tabor, about 4 miles southwest of Tiberias. The name of Nekeb, a town in Galilee, appears in the list of Thothmes III.``1';
isbe[6345]='Nekoda`ne-ko\'-da (neqodha\'):<P>(1) Head of a family of Nethinim (<a onClick="return mV(\'Ezr\',2,48);">Ezr 2:48</a>; <a onClick="return mV(\'Neh\',7,50);">Ne 7:50</a>; compare 1Es 5:31).<P>(2) Head of a family which failed to prove its Israelite descent (<a onClick="return mV(\'Ezr\',2,60);">Ezr 2:60</a>; <a onClick="return mV(\'Neh\',7,62);">Ne 7:62</a>; compare 1Es 5:31,37). In the parallel verses of 1Esdras the names are given thus: <a href="./study/isbe/search.html?string=NOEBA">NOEBA</a> and <a href="./study/isbe/search.html?string=NEKODAN">NEKODAN</a> (which see).``1';
isbe[6346]='Nekodan`ne-ko\'-dan (Nekodan; the Revised Version margin "Nekoda"; the King James Version Necodan):<P>(1) Head of a family which returned from exile, but "could not show their families nor their stock" (1Esdras 5:37) equals "Nekoda" of <a onClick="return mV(\'Ezr\',2,60);">Ezr 2:60</a>; <a onClick="return mV(\'Neh\',7,62);">Ne 7:62</a>.`<a href="./study/isbe/search.html?string=NOEBA">NOEBA</a>`1';
isbe[6347]='Nemuel`nem\'-u-el, ne-mu\'-el (nemu\'el):ould not show their families nor their stock" (1Esdras 5:37) equals "Nekoda" of <a onClick="return mV(\'Ezr\',2,60);">Ezr 2:60</a>; <a onClick="return mV(\'Neh\',7,62);">Ne 7:62</a>.<P>(1) A Reubenite, brother of Dathan and Abiram (<a onClick="return mV(\'Num\',26,9);">Nu 26:9</a>).<P>(2) A son of Simeon (<a onClick="return mV(\'Num\',26,12);">Nu 26:12</a>; <a onClick="return mV(\'1Ch\',4,24);">1Ch 4:24</a>). The name occurs also in the form "Jemuel" (<a onClick="return mV(\'Gen\',46,10);">Ge 46:10</a>; <a onClick="return mV(\'Exd\',6,15);">Ex 6:15</a>). According to Gray (Studies in Hebrew Proper Names), either form is etymologically obscure; but Nemuel is probably correct, for it is easier to account for its corruption into Jemuel than vice versa. The patronymic Nemuelites occurs once (<a onClick="return mV(\'Num\',26,12);">Nu 26:12</a>).``1';
isbe[6348]='Nemuelites`nem\'-u-el-its, ne-mu\'-el-its (ha-nemu\'eli).`<a href="./study/isbe/search.html?string=NEMUEL">NEMUEL</a>`1';
isbe[6349]='Nephea`ne-fe\'-a.`<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>`1';
isbe[6350]='Nepheg`ne\'-feg (nephegh, "sprout," "shoot"):<P>(1) Son of Izhar, and brother of Korah of the famous trio, Korah, Dathan and Abiram (<a onClick="return mV(\'Exd\',6,21);">Ex 6:21</a>).<P>(2) A son of David (<a onClick="return mV(\'2Sa\',5,15);">2Sa 5:15</a>; <a onClick="return mV(\'1Ch\',3,7);">1Ch 3:7</a>; <a onClick="return mV(\'1Ch\',14,6);">14:6</a>).``1';
isbe[6351]='Nephew`nef\'-u, nev\'-u.`<a href="./study/isbe/search.html?string=RELATIONSHIPS,+FAMILY">RELATIONSHIPS, FAMILY</a>`1';
isbe[6352]='Nephi`ne\'-fi.`<a href="./study/isbe/search.html?string=NEPHTHAI">NEPHTHAI</a>`1';
isbe[6353]='Nephilim`nef\'-i-lim (nephilim): This word, translated "giants" in the King James Version, but retained in the Revised Version (British and American), is found in two passages of the Old Testament—one in <a onClick="return mV(\'Gen\',6,4);">Ge 6:4</a>, relating to the antediluvians; the other in <a onClick="return mV(\'Num\',13,33);">Nu 13:33</a>, relating to the sons of Anak in Canaan. In the former place the Nephilim are not necessarily to be identified with the children said to be borne "the daughters of men" to "the sons of God" (<a onClick="return mV(\'Gen\',6,2,4);">Ge 6:2,4</a>); indeed, they seem to be distinguished from the latter as upon the earth before this unholy commingling took place (see <a href="./study/isbe/search.html?string=SONS+OF+GOD">SONS OF GOD</a>). But it is not easy to be certain as to the interpretation of this strange passage. In the second case they clearly represent men of gigantic stature, in comparison with whom the Israelites felt as if they were "grasshopers." This agrees with <a onClick="return mV(\'Gen\',6,4);">Ge 6:4</a>, "the mighty men that were of old, the men of renow." Septuagint, therefore, was warranted in translating by gigantes.``132';
isbe[6354]='Nephis`ne\'-fis.`<a href="./study/isbe/search.html?string=NIPHIS">NIPHIS</a>`1';
isbe[6355]='Nephish; Nephisim; Nephishesim; Nephusim`ne\'-fish, ne-fi\'-sim, ne-fish\'-e-sim, ne-fusim (nephicim, nephucim): The former is the Kethibh (Hebrew: "written") form of the name adopted in the Revised Version (British and American); the latter the Qere (Hebrew "read") form, adopted in the King James Version and the Revised Version margin (<a onClick="return mV(\'Ezr\',2,50);">Ezr 2:50</a>).`<a href="./study/isbe/search.html?string=NAPHISH">NAPHISH</a>; <a href="./study/isbe/search.html?string=NEPHUSHESIM">NEPHUSHESIM</a>`1';
isbe[6356]='Nephthai`nef\'-thi, nef\'-tha-i.`<a href="./study/isbe/search.html?string=NEPHTHAR">NEPHTHAR</a>`1';
isbe[6357]='Nephthalim`nef\'-tha-lim (<a onClick="return mV(\'Mat\',4,13);">Mt 4:13</a>): The Greek form of <a href="./study/isbe/search.html?string=NAPHTALI">NAPHTALI</a> (which see).``1';
isbe[6358]='Nephthar; Nephthai`nef\'-thar (Nephthar; Codex Alexandrinus and Swete, Nephthar, the King James Version and Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Naphthar), (Nephthai, al. Nephthaei, Fritzsche, Nepha, the King James Version and Vulgate, following Old Latin, Nephi; Swete, following Codex Alexandrinus, gives Nephthar twice): According to 2Macc 1:19-36, at the time of the captivity the godly priests took of the altar fire of the temple and concealed it "privily in the hollow of a well that was without water," unknown to all. "After many years" (upon Return), before offering the sacrifices, Nehemiah sent the descendants of the godly priests to fetch the hidden fire. They reported they could find no fire but only "thick water" hudor pachu), which he commanded them to draw up and sprinkle upon the wood and the sacrifices. After an interval the sun shone forth from behind a cloud and the liquid ignited and consumed the sacrifices. Nehemiah then commanded them to pour (katachein, al. katechein, and kataschein) the rest of the liquid upon great stones. Another flame sprang up which soon spent itself, "whereas the light from the altar shone still" (Revised Version margin, the exact meaning being doubtful). When the king of Persia investigated it, he enclosed the spot as sacred. Nehemiah and his friends called the thick liquid "Nephthar," "which is by interpretation \'cleansing\'" (katharismos), "but most men call it Nephthai."<P>No satisfactory explanation is to hand of either name; one of which is probably a corruption of the other. And no word exists in the Hebrew like either of them with the meaning of "cleansing," "purification." The Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) applies the name to the spot (hunc locum), not the thing. The story probably originated in Persia, where naphtha was abundant. The ignition of the liquid by the hot rays of the sun and the appearance of the words render it highly probable that it was the inflammable rockoil naphtha, the combustible properties of which were quite familiar to the ancients (Pliny, NH, ii. 109; Plutarch, Alexander 35; Diosc., i.101; Strabo, Geogr. xvi.1, 15); the words then are probably corruptions of what the Greeks termed naphtha. Ewald (History, V, 163) says: "This is but one of the many stories which sought in later times to enhance the very high sanctity of the Temple, with reference even to its origin."``5';
isbe[6359]='Nephtoah`nef-to\'-a, nef\'-to-a (nephtoach, occurs only in the expression ma\'yan me nephtoach, "the fountain of the waters of Nephtoah"; Septuagint pege hudatos Naphtho): This spring was on the border line between Judah and Benjamin (<a onClick="return mV(\'Jos\',15,9);">Jos 15:9</a>; <a onClick="return mV(\'Jos\',18,15);">18:15</a>). The place is usually identified with Lifta, a village about 2 miles northwest of Jerusalem, on the east bank of the Wady beit Hanina]. It is a village very conspicuous to the traveler along the high road from Jaffa as he nears Jerusalem. There are ancient rock-cut tombs and a copious spring which empties itself into a large masonry reservoir. The situation of Lifta seems to agree well with the most probable line of boundary between the two tribes; the spring as it is today does not appear to be so abundant as to warrant such an expression as "spring of the waters," but it was, like many such sources, probably considerably more abundant in Old Testament times.<P>Conder would identify Lifta with the ancient <a href="./study/isbe/search.html?string=ELEPH">ELEPH</a> (which see) of Benjamin, and, on the ground that the Talmud (see Talmud Babylonian, Yom\' 31a) identifies Nephtoah with <a href="./study/isbe/search.html?string=ETAM">ETAM</a> (which see), he would find the site of Nephtoah at \'Ain \'Atan, south of Bethlehem. The Talmud is not a sufficiently trustworthy guide when unsupported by other evidence, and the identification creates great difficulty with the boundary line. See Palestine Exploration Fund, III, 18, 43, Sh XVII.``117';
isbe[6360]='Nephushesim; Nephishesim`ne-fush\'-e-sim, ne-fish\'-e-sim (nephushecim, nephishecim): The former is the Kethibh (Hebrew "written") form of the name adopted in the Revised Version (British and American); the latter the Qere (Hebrew "read") form adopted in the King James Version and the Revised Version margin (<a onClick="return mV(\'Neh\',7,52);">Ne 7:52</a>).`<a href="./study/isbe/search.html?string=NAPHISH">NAPHISH</a>; <a href="./study/isbe/search.html?string=NEPHISIM">NEPHISIM</a>`1';
isbe[6361]='Ner`ner (ner, "lamp"): Father of Abner (<a onClick="return mV(\'1Sa\',14,50);">1Sa 14:50</a>f; <a onClick="return mV(\'1Sa\',26,5,14);">26:5,14</a>, etc.); grandfather of Saul (<a onClick="return mV(\'1Ch\',8,33);">1Ch 8:33</a>). Other references, though adding no further information are <a onClick="return mV(\'2Sa\',2,8,12);">2Sa 2:8,12</a>; <a onClick="return mV(\'2Sa\',3,23,25,28,37);">3:23,25,28,37</a>; <a onClick="return mV(\'1Ki\',2,5,32);">1Ki 2:5,32</a>, etc.``1';
isbe[6362]='Nereus`ne\'-rus, ne\'-re-us (Nereus): The name of a Roman Christian to whom with his sister Paul sent greetings (<a onClick="return mV(\'Rom\',16,15);">Ro 16:15</a>). Nereus and the others saluted with him (<a onClick="return mV(\'Rom\',16,15);">Ro 16:15</a>) formed small community or "house church." The name of the sister is not given, but the name Nereis is found on an inscription of this date containing names of the emperor\'s servants (Lightfoot, Phil, 176). Among the Acta Sanctorum connected with the early church in Rome are the "Acts of Nereus and Achilleus" which call them chamberlains of Domitilla, the niece of Vespasian, and relate their influence over her in persuading her to remain a virgin.``78';
isbe[6363]='Nergal`nar\'-gal (nereghal): A Babylonian deity, identified with the planet Mars, and worshipped at Cutha (compare <a onClick="return mV(\'2Ki\',17,30);">2Ki 17:30</a>).`<a href="./study/isbe/search.html?string=BABYLONIA+AND+ASSYRIA,+RELIGION+OF">BABYLONIA AND ASSYRIA, RELIGION OF</a>`1';
isbe[6364]='Nergal-Sharezer`nur-gal-sha-re\'-zar (nereghal-shar\'etser, Hebrew form of Assyrian Nergal-sar-usur, "O Nergal, defend the prince"): A Babylonian officer, the "Rab-mag," associated with Nebushazban in the care of Jeremiah after the fall of Jerusalem (<a onClick="return mV(\'Jer\',39,3,13);">Jer 39:3,13</a>). According to Hommel (article "Babylon," Hastings, Dictionary of the Bible (five volumes)) and Sayce (Hastings Dictionary of the Bible, under the word), Nergal-sharezer is to be identified with Neriglissar who succeeded Evil-merodach on the throne of Babylon (compare Cheyne and Johns, Encyclopedia Biblica, under the word).``1';
isbe[6365]='Neri`ne\'-ri Nerei (Tisch., Treg., Westcott and Hort, The New Testament in Greek), Textus Receptus of the New Testament, Neri; for Hebrew neriyah): The name of an ancestor of Jesus, the grandfather of Zerubbabel (<a onClick="return mV(\'Luk\',3,27);">Lu 3:27</a>).`<a href="./study/isbe/search.html?string=NERIAH">NERIAH</a>`1';
isbe[6366]='Neriah`ne-ri\'-a (neriyah, "whose lamp is Yah"): The father of Seraiah and of Baruch, Jeremiah\'s friend and secretary (<a onClick="return mV(\'Jer\',32,12,16);">Jer 32:12,16</a>; <a onClick="return mV(\'Jer\',36,4,8,32);">36:4,8,32</a>; <a onClick="return mV(\'Jer\',43,3);">43:3</a>). In Baruch 1:1 the Greek form of the name, Ner(e)ias, is given, and this shortened, Neri, occurs in the genealogy of Jesus Christ.``1';
isbe[6367]='Nerias`ne-ri\'-as (Ner(e)ias): The Greek form of Hebrew Neriah found only in Baruch 1:1 as the father of Baruch equals "Neriah" of <a onClick="return mV(\'Jer\',32,12);">Jer 32:12</a>; <a onClick="return mV(\'Jer\',36,4);">36:4</a>ff; <a onClick="return mV(\'Jer\',43,3);">43:3</a>. To Baruch\'s brother, Seraiah, the same genealogy is ascribed in <a onClick="return mV(\'Jer\',51,59);">Jer 51:59</a>.``1';
isbe[6368]='Nero`ne\'-ro (Neron): <p><b>I. NAME, PARENTAGE AND EARLY</b><P><b>II. AGRIPPINA\'S AMBITION FOR NERO</b><P class="in15">Her Nine Measures for Bringing Him to the Throne<P><b>III. NERO\'S REIGN</b><P class="in15">1. Quinquennium Nerohis<P class="in15">2. Poppea Sabina (58 AD)<P class="in15">3. Poppea and Tigellinus<P class="in15">4. Great Fire (July, 64)<P class="in15">5. Persecution of Christians<P class="in15">6. Conspiracy of Piso (65 AD)<P class="in15">7. Nero in Greece (66 AD)<P class="in15">8. Death of Nero<P><b>IV. DOWNFALL AND CHARACTER</b><P class="in15">1. Seven Causes of Downfall<P class="in15">2. Character<P><b>V. "NERO REDIVIVUS"</b><P><b>VI. NERO AND CHRISTIANITY</b><P class="in15">1. Nero and the New Testament<P class="in15">2. Neronian Policy and Christianity<P><b>LITERATURE</b><hr /><P>The fifth Roman emperor, born at Antium December 15, 37 AD, began to reign October 13,54,died June 9, 68.<P>I. Name, Parentage and Early Training.<P>His name was originally Lucius Domitius Ahenobarbus but after his adoption into the Claudian gens by the emperor Claudius, he became Nero Claudius Caesar Germanicus. His father was Enaeus Domitius Ahenobarbus ("Brazen-beard"), a man sprung from an illustrious family and of vicious character. His mother was Agrippina the younger, the daughter of Germanicus and the elder Agrippina, sister of the emperor Caius (Caligula) and niece of the emperor Claudius. On the birth of the child, his father predicted, amid the congratulations of his friends, that any offspring of himself and Agrippina could only prove abominable and disastrous for the public (Suet. Nero vi: detestabile et malo publico). At the age of three the young Domitius lost his father and was robbed of his estates by the rapacity of Caius. In 39 his mother was banished for supposed complicity in a plot against Caius. Nero was thus deprived of his mother and at the same time left almost penniless. His aunt, Domitia Lepida, now undertook the care of the boy and placed him with two tutors, a dancer and a barber (Suetonius vi). On the accession of Claudius, Agrippina was recalled, and Nero was restored to his mother and his patrimony (41 AD).<P>II. Agrippina\'s Ambition for Nero.<P>She cared little for her son\'s moral education, but began immediately to train him for high position. She aimed at nothing less than securing the empire for Nero. With a view to this she must gain influence over her uncle, the emperor Clandius, who was very susceptible to female charms. At first the path was by no means easy, while the licentious empress, Messalina, was in power. But on the fall and death of Messalina (48 AD)—for which Agrippina may have intrigued—the way seemed opened. With the assistance of the emperor\'s freedman, Pallas, Agrippina proved the successful candidate for Claudius\' affections. She how felt secure to carry out the plans for the elevation of her son:<P>Her Nine Measures for Bringing Him to the Throne<P>(1) She secured his betrothal to Octavia, the daughter of Claudius, having previously, by the villainy of Vitellius, broken off the engagement between Octavia and Lucius Silanus (ibid., xlviii). Later, Nero married this unfortunate lady.<P>(2) Vitellius again obliged by securing a modification of Roman law so as to permit a marriage with a brother\'s (not sister\'s) daughter, and in 49 Agrippina became empress.<P>(3) In the meantime she had caused Seneca to be recalled from banishment and had entrusted to him the education of Nero for imperial purposes.<P>(4) The adoption of her son by Claudius (50 AD).<P>(5) She next secured early honors and titles for Nero in order to mark him out as Clandins\' successor.<P>(6) She caused Britannicus, Claudius\' son, to be kept in the background and treated as a mere child, removing by exile or death suspected supporters of Britannicus.<P>(7) Agrippina was farsighted and anticipated a later secret of Roman imperialism—the influence of the armies in the nomination of emperors. For this cause she took an active interest in military affairs and gave her name to a new colony on the Rhine (modern Cologne). But she did not forget the importance of securing the praetorian guard and Burrus the prefect.<P>(8) She persuaded Clandins to make a will in favor of her son. All was now ready. But Claudius did not like the idea of excluding his son Britannicus from power, and murmurs were heard among the senate and people. Delay might prove fatal to Agrippina\'s plans, so<P>(9) Claudius must die. The notorious Locusta administered poison in a dish of mushrooms, and Xenophon, Agrippina\'s physician, thrust a poisoned feather down Claudius\' throat on the pretense of helping him to vomit. Burrus then took Nero forth and caused him to be proclaimed imperator by the praetorians.<P>III. Nero\'s Reign.<P>1. Quinquennium Neronis:<P>Nero\'s reign falls into three periods, the first of which is the celebrated quinquennium, or first 5 years, characterized by good government at home and in the provinces and popularity with both senate and people. Agrippina, having seated her son on the throne, did not purpose to relinquish power herself; she intended to rule along with him. And at first Nero was very devoted to her and had given as watchword to the guard, "the best of mothers" (Tacitus, Annals xiii.2; Suetonius ix). This caused a sharp conflict with Seneca and Burrus, who could not tolerate Agrippina\'s arrogance and unbounded influence over her son. In order to detach him from his mother they encouraged him in an amour with a Greek freedwoman, Acre (Tac. Ann. xiii.12). This first blow to Agrippina\'s influence was soon followed by the dismissal from court of her chief protector Pallas. She now threatened to bring forth Britannicus and present him as the rightful heir to the throne. This cost Britannicus his life, for Nero, feeling insecure while a son of Claudius lived, compassed his death at a banquet. A hot wine cup was offered Britannicus, and to cool it to taste, cold water was added which had been adulterated with a virulent poison. The victim succumbed immediately. All eyes fastened on Nero in suspicion, but he boldly asserted that the death was due to a fit of epilepsy—a disease to which Britannicus had been subject from childhood. Such was the fate of Agrippina\'s first protege. She next took up the cause of the despised and ill-treated Octavia, which so incensed her son that he deprived her of her guards and caused her to remove from the palace. Agrippina now disappears for the next few years to come into brief and tragic prominence later. Seneca and Burrus undertook the management of affairs, with results that justified the favorable impression which the first 5 years of Nero\'s reign made upon the Roman people. Many reforms were initiated, financial, social and legislative. These ministers treated Nero to counsels of moderation and justice, dictating a policy which left considerable activity to the senate. But perceiving the bent of his evil nature, they allowed him to indulge in low pleasures and excesses with the most profligate companions, thinking, perhaps, either that the young ruler would in this way prove less harmful to the public, or that, after sowing his wild oats, he would return to the serious business of government. But in both ways they were sorely disappointed, for Nero, having surrendered himself to the basest appetites, continued to go from excess to excess. He surrounded himself with the most dissolute companions, conspicuous among whom were Salvius Otho and Claudius Senecio.<P>2. Poppea Sabina (58 AD):<P>The former had a wife as ambitious as she was unprincipled, and endowed, according to Tacitus, with every gift of nature except an "honorable mind." Already divorced before marrying Otho, she was minded to employ Otho merely as a tool to enable her to become Nero\'s consort. With the appearance of Poppea Sabina, for such was her name, opens the second period of Nero\'s reign. She proved his evil star. Under her influence he shook off all restraints, turned a deaf ear to is best advisers and plunged deeper into immorality and crime. She allowed, if not persuaded, Nero to give her husband a commission in the distant province of Lusitania. Her jealousy could tolerate no possible rival. She plotted the death of Agrippina to which she easily persuaded Nero to consent. This foul crime was planned and carried out with the greatest cunning. Anicetus, admiral of the fleet, undertook to construct a vessel that would sink to order. Nero invited his mother to his villa at Baiae at the Quinquatrus celebration. After the banquet she was persuaded to return to Bauli by the vessel prepared. But the plan did not succeed, and Agrippina saved herself by swimming ashore. She pretended to treat the matter as an accident, sending a freedman to Nero to inform him of her escape. Anicetus, however, relieved Nero of the awkward position by pretending that Agrippina\'s freedman had dropped a dagger which was considered proof enough of her guilt. Deserted by her friends and slaves except one freedman, she was quickly dispatched by her murderers. Nero gave out that she died by suicide (Suetonius xxxiv; Tacitus, Annals cxli-cxlviii).<P>3. Poppea and Tigellinus:<P>Nero no longer made any secret of taking Poppea as his mistress, and, under her influence, bid defiance to the best Roman traditions and plunged deeper into dissipation. In 62 AD matters grew much worse by the death of the praetorian prefect, Burrus. Seneca lost in him a powerful ally, and Poppea gained in one of the new prefects, Sofonius Tigellinus, a powerful ally. She succeeded in causing Seneca to retire from the court. Next she determined to remove Octavia. A charge of adultery was first tried, but as the evidence proved too leaky, Nero simply divorced her because of barrenness. Then Anicetus was persuaded to confess adultery with her, and the innocent Octavia was banished to the island of Pandateria, where a little later she was executed at Poppea\'s orders and her head brought to her rival (62 AD). Poppea was now empress, and the next year bore a daughter to Nero, but the child died when only three months old. Two years later Poppea herself died during pregnancy, of a cruel kick inflicted by Nero in a fit of rage (65 AD). He pronounced an eulogy over her and took a third wife, Statilia Messalina, of whom he had no issue.<P>Nero, having by his extravagance exhausted the well-filled treasury of Claudius (as Caius did that of Tiberius), was driven to fill his coffers by confiscations of the estates of rich nobles against whom his creature Tigellinus could trump the slightest plausible charge. But even this did not prevent a financial crisis—the beginning of the bankruptcy of the later Rein empire. The provinces which at first enjoyed good government were now plundered; new and heavy taxes were imposed. Worst of all, the gold and silver coinage was depreciated, and the senate was deprived of the right of copper coinage.<P>4. Great Fire (July, 64):<P>This difficulty was much increased by the great fire which was not only destructive to both private and state property, but also necessitated the providing thousands of homeless with shelter, and lowering the price of corn. On July 18,64,this great conflagration broke out in Circus Maximus. A high wind caused it to spread rapidly over a large portion of the city, sweeping before it ill-built streets of wooden houses. At the end of six days it seemed to be exhausted for lack of material, when another conflagration started in a different quarter of the city. Various exaggerated accounts of the destruction are found in Roman historians: of the 14 city regions 7 were said to have been totally destroyed and 4 partially. Nero was at Antium at the time. He hastened back to the city and apparently took every means of arresting the spread of the flames. He superintended in person the work of the fire brigades, often exposing himself to danger. After the fire he threw open his own gardens to the homeless. The catastrophe caused great consternation, and, for whatever reasons, suspicion seemed to fix upon Nerio. Rumor had it that on hearing the Greek verse, "When I am dead let the earth be wrapped in fire," he interrupted, "Nay rather, while I live" (Suetonius xxxviii); that he had often deplored the ugliness of the city and wished an opportunity to rebuild it; that he purposely set it on fire in order to find room for his magnificent Domus Aurea ("Golden House"); that when the city was burning he gazed upon it from the tower of Maecenas delighted with what he termed "the beauty of the conflagration"; that he recited in actor\'s costume the sack of Troy (Suetonius xxxviii; Tacitus, Annals xv.38ff). In spite of all these reports Nero must be absolved of the guilt of incendiarism.<P>5. Persecution of Christians:<P>Such public calamities were generally attributed to the wrath of the gods. In the present case everything was done to appease the offended deity. Yet, in spite of all, suspicion still clung to Nero "Wherefore in order to allay the rumor he put forward as guilty (subdidit reos), and afflicted with the most exquisite punishments those who were hated for their abominations (flagitia) and called \'Christians\' by the populace. Christus, from whom the name was derived, was punished by the procurator Pontius Pilatus in the reign of Tiberius. This noxious form of religion (exitiabilis superstitio), checked for a time, broke out again not only in Judea its original home, but also throughout the city (Rome) where all abominations meet and find devotees. Therefore first of all those who confessed (i.e. to being Christians) were arrested, and then as a result of their information a large number (multitude ingens) were implicated (reading coniuncti, not convicti), not so much on the charge of incendiarism as for hatred of the human race. They died by methods of mockery; some were covered with the skins of wild beasts and then torn by dogs, some were crucified, some were burned as torches to give light at night...whence (after scenes of extreme cruelty) commiseration was stirred for them, although guilty and deserving the worst penalties, for men felt that their destruction was not on account of the public welfare but to gratify the cruelty of one (Nero)" (Tacitus, Annals xv.44). Such is the earliest account of the first heathen persecution (as well as the first record of the crucifixion by a heathen writer). Tacitus here clearly implies that the Christians were innocent (subdidit reos), and that Nero employed them simply as scapegoats. Some regard the conclusion of the paragraph as a contradiction to this—"though guilty and deserving the severest punishment" (adversus sontes et novissima exempla meritos). But Tacitus means by sontes that the Christians were "guilty" from the point of view of the populace, and that they merited extreme punishment also from his own standpoint for other causes, but not for arson. Fatebantur does not mean that they confessed to incendiarism, but to being Christians, and qui fatebantur means there were some who boldly confessed, while others tried to conceal or perhaps even denied their faith.<P>But why were the Christians selected as scapegoats? Why not the Jews, who were both numerous and had already offended the Roman government and had been banished in great numbers? Or why not the many followers of the oriental religions, which had proved more than once obnoxious?<P>(1) Poppea was favorable to Judaism and had certainly enough influence over Nero to protect the Jews; she was regarded by them as a proselyte and is termed by Josephus (Ant., XX, viii, 11) theosebes, "god-fearing." When the populace and Nero were seeking victims for revenge, the Jews may have been glad of the opportunity of putting forward the Christians and may have been encouraged in this by Poppea. Farrar (Early Days of Christianity, I, chapter iv) sees "in the proselytism of Poppea, guided by Jewish malice, the only adequate explanation of the first Christian persecution."<P>(2) Closely connected with this was doubtless the observation by the Roman government that Christianity was an independent faith from Judaism. This may first have been brought home to the authorities by the trial of Paul before Nero, as suggested by Ramsay (Expositor, July, 1893). Judaism was a recognized and tolerated religion, a religio licita, and Christianity when divorced from Judaism became a religio illicita and punishable by the state, for Christianity first rose "under the shadow of licensed Judaism" (sub umbraculo licitae Judeorum religionis: Tertullian, Apol., xxi).<P>(3) As Christianity formed a society apart from Roman society, all kinds of crimes were attributed to its followers, Thyestean feasts, nightly orgies, hostility to temples and images. These flagitia seemed summed up in odium humani generis, "hatred for the human race."<P>(4) They were easily selected as being so numerous and making most progress in a line opposed to Roman spirit; compare ingens multitudo (Tacitus, Annals xv.44; Clemens Rom., Cor 1:6, polu plethos; compare also "great multitude" of <a onClick="return mV(\'Rev\',7,9);">Re 7:9</a>; <a onClick="return mV(\'Rev\',19,1);">19:1</a>).<P>(5) No doubt, too, early Christian enthusiasm was unequivocal in its expressions, especially in its belief of a final conflagration of the world and its serene faith amid the despair of others.<P>6. Conspiracy of Piso (65 AD):<P>In the meantime Tigellinus\' tyranny and confiscations to meet Nero\'s expenses caused deep discontent among the nobles, which culminated in the famous conspiracy at the head of which was C. Calpurnius Piso. The plot was prematurely betrayed by Milichus. An inquisition followed in which the most illustrious victims who perished were Seneca the philosopher, Lucan the poet, Lucan\'s mother, and later Annaeus Mela, brother of Seneca and father of Lucan, T. Petronius Arbiter, "the glass of fashion." Finally, "Nero having butchered so many illustrious men, at last desired to exterminate virtue itself by the death of Thrasea Paetus and Barea Soranus" (Tacitus, Annals xvi.21f).<P>7. Visit to Greece (66 AD):<P>Having cleared every suspected person out of the way, he abandoned the government in Rome to a freedman Helius, and started on a long visit to Greece (66-68 AD), where he took part in musical contests and games, himself winning prizes from the obsequious Greeks, in return for which Nero bestowed upon them "freedom." Nero was so un-Roman that he was perfectly at home in Greece, where alone he said he was appreciated by cultured people. In the meantime the revolt of Vindex in Gaul commenced (68 AD), but it was soon quelled by Verginius Rufus on account of its national Gaulic character. Galba of Hither Spain next declared himself legatus of the senate and the Roman people. Nero was persuaded to return to Rome by Helius; he confiscated Galba\'s property, but his weakness and hesitancy greatly helped the cause of the latter.<P>8. Death of Nero:<P>Nymphidius Sabinus, one of the prefects, won over the guard for Galba, by persuading the irresolute emperor to withdraw from Rome and then told the praetorians that Nero had deserted them. Nero was a coward, both in life and in death. While he had the means of easily crushing Galba, he was revolving plans of despair in his Servilian gardens, whether he should surrender himself to the mercies of the Parthians or to those of Galba; whether Galba would allow him the province of Egypt; whether the public would forgive his past if he showed penitence enough. In his distraction a comforter asked him in the words of Virgil, "Is it then so wretched to die?" He could not summon the courage for suicide, nor could he find one to inflict the blow for him: "Have I then neither friend nor foe?" Phaon a freedman offered him the shelter of his villa a few miles from Rome. Here he prepared for suicide, but with great cowardice. He kept exclaiming, "What an artist I am to perish!" (Qualis artifex pereo, Suet. xlix). On learning that he was condemned to a cruel death by the senate, he put the weapon to his throat and was assisted in the fatal blow by Epaphroditus his secretary. A centurion entered pretending he had come to help: "Too late—this is fidelity," were Nero\'s last words. His remains were laid in the family vault of the Domitii by his two nurses Ecloge and Alexandria and his concubine Acte (Suetonius L). Thus perished on July 9, 68 AD the last of the line of Julius Caesar in his 31st year and in the 14th of his reign.<P>IV. Downfall and Character.<P>1. Seven Causes of Downfall:<P>The causes of his downfall were briefly:<P class="in15">(1) his lavish expenditure leading to burdensome taxation and financial insecurity;<P class="in15">(2) tyranny and cruelty of his favorites;<P class="in15">(3) the great fire which brought dissatisfaction to fasten suspicion on Nero and the consequent enlargement of his private abode at the expense of the city—especially the Golden House;<P class="in15">(4) the unpopular measure of the extension of Roman franchise to Greece and favored foreigners;<P class="in15">(5) the security engendered by the success with which the conspiracy of Piso was crushed;<P class="in15">(6) the discovery of another "secret of empire," that an emperor could be created elsewhere than at Rome, that the succession of emperors was not hereditary but rested with the great armies, and<P class="in15">(7) the cowardice and weakness which Nero displayed in the revolt which led to his death.<P>His reign is memorable for the activity of Seneca, the great fire, the persecution of Christians, the beginning of the bankruptcy of the later Roman empire, the Armenian disaster of Paetus (62 AD) retrieved by Corbulo and the humiliation of Parthia, the outbreak of the insurrection in Judea (66 AD), which ended in the destruction of Jerusalem.<P>2. Character:<P>Nero ranks with Gaius for folly and vice, while his cruelties recall the worst years of Tiberius. Very effeminate in his tastes, particular about the arrangement of his hair and proud of his voice, his greatest fault was inordinate vanity which courted applause for performances on non-Roman lines. He neglected his high office and degraded Roman gravitas by zeal for secondary pursuits. Nero, like his three predecessors, was very susceptible to female charms. He was licentious in the extreme, even to guilt of that nameless vice of antiquity—love of a male favorite. His cruelty, both directly and through his instruments, made the latter part of his reign as detestable as the quinquennium had been golden. He loved the extravagant and luxurious in every exaggerated form. He was a weakling and a coward in his life, and especially in his death. Of his personal appearance we are told his features were regular and good; the expression of his countenance, however, was somewhat repelling. His frame was ill proportioned—slender legs and big stomach. In later years his face was covered with pimples.<P>V. "Nero Redivivus."<P>It seems as if there was something lovable even about this monster, which led a freedman to remain faithful to the last, and his two old nurses and cast-off concubine to care affectionately for his remains, and for a long time there were not wanting hands to strew his grave with spring and autumn flowers and to display his effigy (Suet. lvii). But, whether from the strange circumstances of his death, or the subsequent terrible confusion in the Roman world, or from whatever cause, there soon arose a belief that Nero had not really died, but was living somewhere in retirement or had fled among the Parthians, and that he was destined in a short time to return and bring great calamity upon his enemies or the world (quasi viventis et brevi magno inimicorum malo reversuri: Suetonius lvii). This belief was a force among the Parthians who were ready to take up arms at the report of a pseudo-Nero (Tacitus, History i.2). In the confusion of the year of the four emperors, Greece and Asia were disturbed by the report of the advent of Nero (Tac. Hist. ii.8), and the historian promises to mention the fortune and attempts of other pseudo-Neros. This belief was taken up by the Jews and amalgamated with their legend of Antichrist. In Ascension of <span class="noTag">Isaiah 4</span>  (1st century AD), the Antichrist is clearly identified with Nero: "Belial shall appear in the shape of a man, the king of wickedness, the matricide." It occurs again and again in both the Jewish and Christian sections of the Sib Oracles (3:66ff; 4:117f; 135ff; 5:100f; 136f; 216f). How far Nero was regarded by the Christians as the historical personage of Antichrist is a disputed point. That the common belief of the revival or advent of Nero should influence contemporary Christian thought in days of social and political turmoil is highly probable. Bousset (Commentary) regards the beast of <a onClick="return mV(\'Rev\',13,1);">Re 13</a> as Rome, and the smitten head whose "deathstroke was healed" as Nero, and some scholars take <a onClick="return mV(\'Rev\',17,10);">Re 17:10</a>f as referring to Nero. The "scarlet-colored beast" of <a onClick="return mV(\'Rev\',17,3);">17:3</A> may be intended either for the Roman government in general or for Nero in particular. That the number 666 (<a onClick="return mV(\'Rev\',13,18);">Re 13:18</a>) represents in Hebrew letters the numerical equivalent of Neron Kesar is significant, for the Jewish Christians would be familiar with gematriya\' (the numerical equivalent of names). See <a href="./study/isbe/search.html?string=NUMBER">NUMBER</a>. Compare Farrar, Early Days, chapter xxviii, section 5. In later times the idea of a twofold Antichrist seems to have arisen—one for the Jews and one for the Gentiles; compare especially Commodian, Carm. Apol. (926): "to us Nero became Antichrist, to the Jews the other" (nobis Nero factus Antichristus, ille Judaeis). There was an alternate theory that Nero had really been killed, but that he would rise again (Sib Or 5:216f; Augustine, De Civ. Dei, xx.19: unde nonnulli ipsum resurrecturum et futurum Antichristum suspicantur).<P>VI. Nero and Christianity.<P>1. Nero and the New Testament:<P>The name Nero does not occur in the New Testament, but he was the Caesar to whom Paul appealed (<a onClick="return mV(\'Act\',25,11);">Ac 25:11</a>) and at whose tribunal Paul was tried after his first imprisonment. It is quite likely that Nero heard Paul\'s case in person, for the emperor showed much interest in provincial cases. It was during the earlier "golden quinquennium" of Nero\'s reign that Paul addressed his epistle to the Christians at Rome, and probably in the last year of Nero\'s reign (68 AD) Paul suffered death near the city, though Harnack (Chronologie) places his death in the first Neronian persecution of 64. Although the New Testament gives no hint of a possible visit or sojourn of Peter in Rome, such a sojourn and subsequent martyrdom are highly probable and almost certain from the early persistent tradition, especially in Clement of Rome, Ignatius and Papias, and later in Tertullian, Clement of Alexandria and the Liber Pontificalis (catalogue of popes). His execution at Rome under Nero is practically certain.<P>2. Neronian Policy and Christianity:<P>The first persecution to which Christianity was subjected came from the Jews: the first heathen persecution took place under Nero. Up to this time the Roman government had been on friendly terms with Christianity, as Christianity was either not prominent enough to cause any disturbance of society or was confounded by the Romans with Judaism (sub umbraculo licitae Judeorum religionis: Tertullian, Apol., xxi). Paul, writing to the Christians of the capital, urged them to "be in subjection to the higher powers" as "ordained of God" (<a onClick="return mV(\'Rom\',13,1);">Ro 13:1</a>), and his high estimation of the Roman government as power for the good of society was probably enhanced by his mild captivity at Rome which permitted him to carry on the work of preaching and was terminated by an acquittal on the first trial (accepting the view of a first acquittal and subsequent activity before condemnation at a second trial). But soon, whether because of the trial of Paul, a Roman citizen, at Rome (about 63), or the growing hostility of the Jews, or the increasing numbers and alarming progress of the new religion, the distinction between Christianity and Judaism became apparent to the Roman authorities. If it had not yet been proscribed as a religio illicita ("\'unlicensed religion"), neither had it been admitted as a religio licita. Christianity was not in itself as yet a crime; its adherents were not liable to persecution "for the name." According to one view the Neronian persecution was a spasmodic act and an isolated incident in imperial policy: the Christians were on this occasion put forward merely to remove suspicion from Nero. They were not persecuted either as Christians or as incendiaries, but on account of flagitia and odium humani generis, i.e. Thyestean feasts, Oedipodean incest and nightly orgies were attributed to them, and their withdrawal from society and exclusive manners caused the charge of "hatred for society." The evidence of Tacitus (Ann. xv.44) would bear out this view of the Neronian persecution as accidental, isolated, to satisfy the revenge of the mob, confined to Rome and of brief duration. The other view is, however, preferable, as represented by Ramsay (Church in the Roman Empire, chapter xi) and E. G. Hardy (Studies in Roman History, chapter iv). Suetonius speaks of the persecution of Christians as a permanent police regulation in a list of other seemingly permanent measures (Nero xvi: afflicti suppliciis Christiani genus hominum superstitionis novae ac maleficae), which is not inconsistent with the account of Tacitus—who gives the initial step and Suetonius the permanent result. The Christians by these trials, though not convicted of incendiarism, were brought into considerable prominence; their unsocial and exclusive manners, their withdrawal from the duties of state, their active proselytism, together with the charges of immorality, established them in Roman eyes as the enemies of society. Christianity thus became a crime and was banned by the police authorities. Suetonius gives a "brief statement of the permanent administrative principle into which Nero\'s action ultimately resolved itself" (Ramsay, op. cit., 232). No formal law needed to be passed, the matter could be left with the prefect of the city. A trial must be held and the flagitia proved before an order for execution, according to Ramsay, but Hardy holds that henceforth the name itself—nomen ipsum—was proscribed. A precedent was now established of great importance in the policy of the imperial government toward Christianity (see, further, <a href="./study/isbe/search.html?string=ROMAN+EMPIRE+AND+CHRISTIANITY">ROMAN EMPIRE AND CHRISTIANITY</a>). There ls no reason to suppose that the Neronian persecution of 64 AD extended beyond Rome to the provinces, though no doubt the attitude of the home government must have had considerable influence with provincial officers. Paul seems to have gone undisturbed, or at least with no unusual obstacles, in his evangelization after his acquittal. The authorities for a general Neronian persecution and formal Neronian laws against Christianity are late; compare Orosius (History vii.7, "(Nero) was the first to put to death Christians at Rome and gave orders that they should be subjected to the same persecution throughout all the provinces").<P>LITERATURE.<P>(a) Ancient:<P>Tacitus Annals xii-xvi; Suetonius Nero; Dio Cassius in Epit. of Xiphilinus 61ff; Zonaras xi.<P>(b) Modern:<P>Hermann Schiller, Geschichte des rom. Kaiserreichs unter der Regierung des Neron (Berlin, 1872); Merivale, Hist of the Romans under the Empire; Ramsay, Church in the Roman Empire and The Expositor, 1893; E.G. Hardy, Christianity and the Roman Government and Studies in Roman History; Mommsen, "Der Religionsfrevel nach rom. Recht," Histor. Zeitschr., 1890; C. F. Arnold, Die Neronische Christenverfolgung; Farrar, Early Days of Christianity; Baring-Gould, Tragedy of the Caesars: G.H. Lewes, "Was Nero a Monster?" in Cornhill Magazine, July, 1863; B.W. Henderson, Life and Principate of the Emperor Nero, with important bibliography of ancient and modern authorities (London, 1903); Lehmann, Claudius u. Nero.``5';
isbe[6369]='Nest`(qen; neossia, nossia; in the New Testament kataskenosis; Latin nidus): A receptacle prepared by a bird for receiving its eggs and young. Nests differ with species. Eagles use a large heap of coarse sticks and twigs on the cleft of a mountain (<a onClick="return mV(\'Job\',39,27);">Job 39:27</a>ff; <a onClick="return mV(\'Jer\',49,16);">Jer 49:16</a>; <a onClick="return mV(\'Oba\',1,4);">Ob 1:4</a>); hawks prefer trees; vultures, hollow trees or the earth; ravens, big trees; doves and pigeons, trees or rocky crevices (<a onClick="return mV(\'Jer\',48,28);">Jer 48:28</a>); hoopoes, hollow trees; swallows, mud nests under a roof, on cliffs or deserted temples; owls, hollow trees, dark places in ruins or sand burrows (on the qippoz of <a onClick="return mV(\'Isa\',34,15);">Isa 34:15</a> see <a href="./study/isbe/search.html?string=OWL">OWL</a>); cranes, storks and herons, either trees (<a onClick="return mV(\'Psa\',104,17);">Ps 104:17</a>) or rushes beside water (storks often choose housetops, as well).<P>Each nest so follows the building laws of its owner\'s species that any expert ornithologist can tell from a nest which bird builded it. Early in incubation a bird deserts a nest readily because it hopes to build another in a place not so easily discoverable and where it can deposit more eggs. When the young have progressed until their quickening is perceptible through the thin shells pressed against the breast of the mother, she develops a boldness called by scientists the "brooding fever." In this state the wildest of birds frequently will suffer your touch before deserting the nest. Especially is this the case if the young are just on the point of emerging. The first Biblical reference to the nest of a bird will be found in Balaam\'s fourth prophecy in <a onClick="return mV(\'Num\',24,21);">Nu 24:21</a>: "And he looked on the Kenite, and took up his parable and said, Strong is thy dwelling-place, and thy nest is set in the rock." Here Balaam was thinking of the nest of an eagle, hawk or vulture, placed on solid rock among impregnable crags of mountain tops. The next reference is among the laws for personal conduct in <a onClick="return mV(\'Deu\',22,6);">De 22:6</a>: "If a bird\'s nest chance to be before thee in the way, in any tree or on the ground, with young ones or eggs, and the dam sitting upon the young, or upon the eggs, thou shalt not take the dam with the young." Beyond question this is the earliest law on record for the protection of a brooding bird. It is probable that it was made permissible to take the young, as the law demanded their use, at least in the case of pigeons and doves, for sacrifice. In <a onClick="return mV(\'Job\',29,18);">Job 29:18</a>, Job cries,<P class="in15">"Then I said, I shall die in my nest,<br>And I shall multiply my days as the sand:"<P>that is, he hoped in his days of prosperity to die in the home he had builded for his wife and children. In <a onClick="return mV(\'Psa\',84,3);">Ps 84:3</a> David sings,<P class="in15">"Yea, the sparrow hath found her a house,<br>And the swallow a nest for herself,<br>where she may lay her young,<br>Even thine altars, O Yahweh of hosts,<br>My King, and my God."<P>These lines are rich and ripe with meaning, for in those days all the world protected a temple nest, even to the infliction of the death penalty on anyone interfering with it. This was because the bird was supposed to be claiming the protection of the gods. Hebrew, Arab and Egyptian guarded all nests on places of worship. Pagan Rome executed the shoemaker who killed a raven that built on a temple, and Athens took the same revenge on the man who destroyed the nest of a swallow. Isaiah compared the destruction of Assyria to the robbing of a bird\'s nest: "And my hand hath found as a nest the riches of the peoples; and as one gathereth eggs that are forsaken, have I gathered all the earth: and there was none that moved the wing, or that opened the mouth, or chirped" (<a onClick="return mV(\'Isa\',10,14);">Isa 10:14</a>; compare <a onClick="return mV(\'Isa\',16,2);">Isa 16:2</a>). Matthew quotes Jesus as having said, "The foxes have holes, and the birds of the heaven have nests; but the Son of man hath not where to lay his head" (<a onClick="return mV(\'Mat\',8,20);">Mt 8:20</a> equals <a onClick="return mV(\'Luk\',9,58);">Lu 9:58</a>).``167';

isbe[6371]='Netaim`na\'-ta-im, ne\'-ta-im, ne-ta\'-im neta\'im; Codex Vaticanus Azaeim; Codex Alexandrinus Ataeim): In <a onClick="return mV(\'1Ch\',4,23);">1Ch 4:23</a> the King James Version reads "those that dwell among plants and hedges," the Revised Version (British and American) "the inhabitants of Netaim and Gederah." The latter may be taken as correct. Gederah was in the Judean Shephelah. Here also we should seek for Netaim; but no likely identification has yet been suggested.``1';
isbe[6372]='Nethanel`ne-than\'-el, neth\'-a-nel (nethan\'el, "God has given"; Nathanael; the King James Version Nethaneel, ne-than\'-e-el):<P>(1) A chief or prince of Issachar (<a onClick="return mV(\'Num\',1,8);">Nu 1:8</a>; <a onClick="return mV(\'Num\',2,5);">2:5</a>; <a onClick="return mV(\'Num\',7,18,23);">7:18,23</a>; <a onClick="return mV(\'Num\',10,15);">10:15</a>).<P>(2) The 4th son of Jesse (<a onClick="return mV(\'1Ch\',2,14);">1Ch 2:14</a>).<P>(3) One of the trumpet-blowers before the ark when it was brought up from the house of Obededom (<a onClick="return mV(\'1Ch\',15,24);">1Ch 15:24</a>).<P>(4) A Levite scribe, the father of Shemaiah (<a onClick="return mV(\'1Ch\',24,6);">1Ch 24:6</a>).<P>(5) The 5th son of Obed-edom (<a onClick="return mV(\'1Ch\',26,4);">1Ch 26:4</a>).<P>(6) One of the princes whom Jehoshaphat sent to teach in the cities of Judah (<a onClick="return mV(\'2Ch\',17,7);">2Ch 17:7</a>).<P>(7) A Levite who gave cattle for Josiah\'s Passover (<a onClick="return mV(\'2Ch\',35,9);">2Ch 35:9</a>).<P>(8) One of the priests who had married foreign wives (<a onClick="return mV(\'Ezr\',10,22);">Ezr 10:22</a>; compare 1Es 9:22</a>).<P>(9) A priest registered under the high priest Joiakim (<a onClick="return mV(\'Neh\',12,21);">Ne 12:21</a>).<P>(10) A Levite musician who assisted at the dedication of the walls (<a onClick="return mV(\'Neh\',12,36);">Ne 12:36</a>).``95';
isbe[6373]='Nethaniah`neth-a-ni\'-a (nethanyahu, "Yah has given"; Nathanias):<P>(1) An Asaphite musician (<a onClick="return mV(\'1Ch\',25,2,12);">1Ch 25:2,12</a>).<P>(2) A Levite who accompanied the princes sent by Jehoshaphat to teach in the cities of Judah (<a onClick="return mV(\'2Ch\',17,8);">2Ch 17:8</a>).<P>(3) The father of Jehudi (<a onClick="return mV(\'Jer\',36,14);">Jer 36:14</a>).<P>(4) The father of Ishmael, the murderer of Gedaliah (<a onClick="return mV(\'Jer\',40,815,15);">Jer 40:8,14,15</a>; <a onClick="return mV(\'Jer\',41,11);">41:11</a>; <a onClick="return mV(\'2Ki\',25,23,25);">2Ki 25:23,25</a>). Some manuscripts of Septuagint read here Maththanias.``1';
isbe[6374]='Nethinim`neth\'-i-nim (nethinim, "given"; Natheineim; the King James Version Nethinims):<P>1. Meaning:<P>A group of temple-servants (<a onClick="return mV(\'1Ch\',9,2);">1Ch 9:2</a> and 16 times in Ezra and Nehemiah). The word has always the article, and does not occur in the singular. The Septuagint translators usually transliterate, but in one passage (<a onClick="return mV(\'1Ch\',9,2);">1Ch 9:2</a>) they render, "the given ones" (hoi dedomenoi). The Syriac (Peshitta) also, in Ezra, Nehemiah, transliterates the word, but in <a onClick="return mV(\'1Ch\',9,2);">1Ch 9:2</a> renders it by a word meaning "sojourners." The meaning "given" is suggestive of a state of servitude, and Josephus seems to confirm the suggestion by calling the Nethinim "temple-slaves" (hierodouloi) (Ant., XI, v, 1). It should, however, be noted that another form of this word is employed in the directions regarding the Levites: "Thou shalt give the Levites unto Aaron and to his sons: they are wholly given unto him on behalf of the children of Israel" (<a onClick="return mV(\'Num\',3,9);">Nu 3:9</a>; compare also <a onClick="return mV(\'Num\',8,16,19);">Nu 8:16,19</a>).<P>2. History:<P>Of the history of the Nethinim in earlier times there are but few and uncertain traces. When Joshua discovered that he had been beguiled by the Gibeonites into a covenant to let them live, he reduced their tribe to servitude, and declared, "Now therefore ye are cursed, and there shall never fail to be of you bondsmen, both hewers of wood and drawers of water for the house of my God" (<a onClick="return mV(\'Jos\',9,23,27);">Jos 9:23,27</a>). It is no doubt tempting to see in the Gibeonites the earliest Nethinim, but another tradition traces their origin to a gift of David and the princes for the service of the Levites (<a onClick="return mV(\'Ezr\',8,20);">Ezr 8:20</a>). Their names, too, indicate diversity of origin; for besides being mostly un-Hebrew in aspect, some of them are found elsewhere in the Old Testament as names of non-Israelitish tribes. The Meunim, for example (<a onClick="return mV(\'Ezr\',2,50);">Ezr 2:50</a> equals <a onClick="return mV(\'Neh\',7,52);">Ne 7:52</a>), are in all likelihood descended from the Meonites or Maonites who are mentioned as harassing Israel (<a onClick="return mV(\'Jdg\',10,12);">Jud 10:12</a>), as in conflict with the Simeonites (<a onClick="return mV(\'1Ch\',4,41);">1Ch 4:41</a>), and as finally overcome by Uzziah (<a onClick="return mV(\'2Ch\',26,7);">2Ch 26:7</a>). The next name in the lists is that of the children of Nephisim. These may be traced to the Hagrite clan of Naphish (<a onClick="return mV(\'Gen\',25,15);">Ge 25:15</a>; <a onClick="return mV(\'1Ch\',5,19);">1Ch 5:19</a>). In both Ezra and Nehemiah, the list is immediately followed by that of the servants of Solomon, whose duties were similar to, it may be even humbler than, those of the Nethinim. These servants of Solomon appear to be descendants of the Canaanites whom Solomon employed in the building of his temple (<a onClick="return mV(\'1Ki\',5,15);">1Ki 5:15</a>). All these indications are perhaps slight; but they point in the same direction, and warrant the assumption that the Nethinim were originally foreign slaves, mostly prisoners of war, who had from time to time been given to the temple by the kings and princes of the nation, and that to them were assigned the lower menial duties of the house of God.<P>3. Post-exilic History:<P>At the time of the return from the exile the Nethinim had come to be regarded as important. Their number was considerable: 392 accompanied Zerubbabel at the first Return in 538 BC (<a onClick="return mV(\'Ezr\',2,58);">Ezr 2:58</a> equals <a onClick="return mV(\'Neh\',7,60);">Ne 7:60</a>). When Ezra, some 80 years later, organized the second Return, he secured a contingent of Nethinim numbering 220 (<a onClick="return mV(\'Ezr\',8,20);">Ezr 8:20</a>). In Jerusalem they enjoyed the same privileges and immunities as the other religious orders, being included by Artaxerxes\' letter to Ezra among those who should be exempt from toll, custom and tribute (<a onClick="return mV(\'Ezr\',7,24);">Ezr 7:24</a>). A part of the city in Ophel, opposite the Water-gate, was assigned them as an official residence (<a onClick="return mV(\'Neh\',3,26,31);">Ne 3:26,31</a>), and the situation is certainly appropriate if their duties at all resembled those of the Gibeonites (see Ryle, "Ezra and Nehemiah," in Cambridge Bible, Intro, 57). They were also organized into a kind of guild under their own leaders or presidents (<a onClick="return mV(\'Neh\',11,21);">Ne 11:21</a>).<P>The Nethinim are not again mentioned in Scripture. It is probable that they, with the singers and porters, became gradually incorporated in the general body of Levites; their name passed ere long into a tradition, and became at a later time a butt for the scorn and bitterness of the Talmudic writers against everything that they regarded as un-Jewish.``95';
isbe[6375]='Netophah`ne-to\'-fa (netophah; Septuagint Netopha, Nephota, and other variants): The birthplace of two of David\'s heroes, Maharai and Heleb (<a onClick="return mV(\'2Sa\',23,28,29);">2Sa 23:28,29</a>), also of Seraiah the son of Tanhumeth the Netophathite, one of the captains who came to offer allegiance to Gedaliah (<a onClick="return mV(\'2Ki\',25,23);">2Ki 25:23</a>; <a onClick="return mV(\'Jer\',40,8);">Jer 40:8</a>). "The villages of the Netophathites" are mentioned (<a onClick="return mV(\'1Ch\',9,16);">1Ch 9:16</a>) as the dwellings of certain Levites and (<a onClick="return mV(\'Neh\',12,28);">Ne 12:28</a>, the King James Version "Netophathi") of certain "sons of the singers."<P>The first mention of the place itself is in <a onClick="return mV(\'Ezr\',2,22);">Ezr 2:22</a>; <a onClick="return mV(\'Neh\',7,26);">Ne 7:26</a>; 1Es 5:18 (the Revised Version (British and American) "Netophas"), where we have parallel lists of the exiles returning from Babylon under Zerubbabel; the place is mentioned between Bethlehem and Anathoth and in literary association with other cities in the mountains of Judah, e.g. Gibeon, Kiriath-jearim, Chephereh and Beeroth. In this respect it is most plausible to identify it with <a href="./study/isbe/search.html?string=NEPHTOAH">NEPHTOAH</a> (which see), although the disappearance of the terminal guttural in the latter creates a difficulty. Conder has suggested a site known as Khirbet Ummtoba, northeast of Bethlehem, an ancient site, but not apparently of great importance. Beit Nettif, an important village on a lofty site in the Shephelah near the "Vale of Elah," also appears to have an echo of the name, and indeed may well be the Beth Netophah of the Mishna (Shebhu\'oth, ix.5; Neubauer, Geogr., 128), but the position does not seem to agree at all with that of the Old Testament Netophah. For Khirbet Umm-Toba see Palestine Exploration Fund, III, 128; for Beit Nettif, Palestine Exploration Fund, III, 24; RBR, II, 17f; both Sh XVII.``117';
isbe[6376]='Netophas`ne-to\'-fas (Codex Vaticanus Netebas; Codex Alexandrinus Netophae): A town named in 1Esdras 5:18, identical with "Netophah" of <a onClick="return mV(\'Ezr\',2,22);">Ezr 2:22</a>; <a onClick="return mV(\'Neh\',7,26);">Ne 7:26</a>.``1';
isbe[6377]='Netophathi; Netophathites`ne-tof\'-a-thi, ne-tof\'-a-thits.`<a href="./study/isbe/search.html?string=NETOPHAH">NETOPHAH</a>`1';
isbe[6378]='Nettles`net\'-\'lz:<p>(1) charul, (<a onClick="return mV(\'Job\',30,7);">Job 30:7</a>; <a onClick="return mV(\'Pro\',24,31);">Pr 24:31</a>; <a onClick="return mV(\'Zep\',2,9);">Ze 2:9</a> margin, in all, "wild vetches"); the translation "nettles" is due to the supposed derivations of charul from an (obsolete) charal, meaning "to be sharp" or "stinging," but a translation "thorns" (as in Vulgate) would in that case do as well. Septuagint has phrugana agria, "wild brushwood," in Job, and certainly the association with the "saltwort" and the retm, "broom," in the passage would best be met by the supposition that it means the low thorny bushes plentiful in association with these plants. "Vetch" is suggested by the Aramaic, but is very uncertain. <p>(2) qimmosh (<a onClick="return mV(\'Isa\',34,13);">Isa 34:13</a>; <a onClick="return mV(\'Hsa\',9,6);">Ho 9:6</a>), and plural qimmeshonim (<a onClick="return mV(\'Pro\',24,31);">Pr 24:31</a>), translated (English Versions of the Bible) "thorns," because of the translation of charul as "nettles" in the same verse From <a onClick="return mV(\'Isa\',34,13);">Isa 34:13</a> qimmosh is apparently distinct from thorns, and the translation "nettle" is very probable, as such neglected or deserted places as described in the three references readily become overgrown with nettles in Palestine The common and characteristic Palestine nettle is the Urtica pilulifera, so called from the globular heads of its flowers.``117';
isbe[6379]='Network`net\'-wurk (sebhakhah): the Revised Version (British and American) in <a onClick="return mV(\'2Ki\',25,17);">2Ki 25:17</a>; <a onClick="return mV(\'2Ch\',4,13);">2Ch 4:13</a> (also in the plural, <a onClick="return mV(\'2Ch\',4,12,13);">4:12,13</A>), for "wreathen work" and "wreath" in the King James Version (of the adornment of the capitals of the pillars of Solomon\'s temple; see <a href="./study/isbe/search.html?string=JACHIN+AND+BOAZ">JACHIN AND BOAZ</a>). "Networks" in <a onClick="return mV(\'Isa\',19,9);">Isa 19:9</a> is in the Revised Version (British and American) correctly rendered "white cloth." In the American Standard Revised Version "network" is substituted for "pictures" in the King James Version (<a onClick="return mV(\'Pro\',25,11);">Pr 25:11</a>), "baskets" in the English Revised Version margin "filigree work."``1';
