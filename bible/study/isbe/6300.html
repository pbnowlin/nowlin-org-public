isbe[6393]='New; Newness`nu, nu\'-nes (chadhash; kainos, neos):<P>1. In the Old Testament:<P>The word commonly translated "new" in the Old Testament is chadhash, "bright," "fresh," "new" (special interest was shown in, and importance attached to, fresh and new things and events); <a onClick="return mV(\'Exd\',1,8);">Ex 1:8</a>; <a onClick="return mV(\'Deu\',20,5);">De 20:5</a>; <a onClick="return mV(\'Deu\',22,8);">22:8</a>; <a onClick="return mV(\'Deu\',24,5);">24:5</a>; <a onClick="return mV(\'1Sa\',6,7);">1Sa 6:7</a>; <a onClick="return mV(\'2Sa\',21,16);">2Sa 21:16</a>; <a onClick="return mV(\'Psa\',33,3);">Ps 33:3</a>, "a new song"; <a onClick="return mV(\'Jer\',31,31);">Jer 31:31</a>, "new covenant"; <a onClick="return mV(\'Eze\',11,19);">Eze 11:19</a>, "a new spirit"; <a onClick="return mV(\'Eze\',18,31);">18:31</A> "new heart"; <a onClick="return mV(\'Eze\',36,26);">36:26</A>, etc.; chodhesh is "the new moon," "the new-moon day," the first of the lunar month, a festival, then "month" (<a onClick="return mV(\'Gen\',29,14);">Ge 29:14</a>, "a month of days"); it occurs frequently, often translated "month"; we have "new moon" (<a onClick="return mV(\'1Sa\',20,5,18,24);">1Sa 20:5,18,24</a>, etc.); tirosh is "new (sweet) wine" (<a onClick="return mV(\'Neh\',10,39);">Ne 10:39</a>; <a onClick="return mV(\'Joe\',1,5);">Joe 1:5</a>; <a onClick="return mV(\'Joe\',3,18);">3:18</a>, it is \'asis, the Revised Version (British and American) "sweet wine"); in <a onClick="return mV(\'Act\',2,13);">Ac 2:13</a>, "new wine" is gleukos.<P>Other words in the Old Testament for "new" are chadhath, Aramaic (<a onClick="return mV(\'Ezr\',6,4);">Ezr 6:4</a>); Tari, "fresh" (<a onClick="return mV(\'Jdg\',15,15);">Jud 15:15</a>, the Revised Version (British and American) "a fresh jawbone of an ass"); beri\'ah, a "creation" (<a onClick="return mV(\'Num\',16,30);">Nu 16:30</a>, "if Yahweh make a new thing," the Revised Version margin "create a creation"); bakhar, "to be first-fruits" (<a onClick="return mV(\'Eze\',47,12);">Eze 47:12</a>; so the Revised Version margin); qum, "setting," is translated "newly" (<a onClick="return mV(\'Jdg\',7,19);">Jud 7:19</a>); also miqqarobh, "recently" (<a onClick="return mV(\'Deu\',32,17);">De 32:17</a>, the Revised Version (British and American) "of late "); news is shermu\'ah, "report," "tidings"; <a onClick="return mV(\'Pro\',25,25);">Pr 25:25</a>, "good news from a far country."<P>2. In the New Testament:<P>In the New Testament "new" (mostly kainos, "new," "fresh," "newly made") is an important word. We have the title of the "New Testament" itself, rightly given by the American Standard Revised Version as "New Covenant," the designation of "the new dispensation" ushered in through Christ, the writings relating to which the volume contains. We have "new covenant" (kainos) in <a onClick="return mV(\'Luk\',22,20);">Lu 22:20</a>, "This cup is the new covenant in my blood" (the English Revised Version margin "testament"; in <a onClick="return mV(\'Mat\',26,28);">Mt 26:28</a>; <a onClick="return mV(\'Mar\',14,24);">Mr 14:24</a>, "new" is omitted in the Revised Version (British and American), but in Matthew the margin "many ancient authorities insert new," and in Mark "some ancient authorities"); <a onClick="return mV(\'1Cr\',11,25);">1Co 11:25</a>, the English Revised Version margin "or testament"; <a onClick="return mV(\'2Cr\',3,6);">2Co 3:6</a>, the English Revised Version margin "or testament"; <a onClick="return mV(\'Hbr\',8,8);">Heb 8:8</a>, the English Revised Version margin "or testament"; in <a onClick="return mV(\'Hbr\',8,13);">8:13</A>, "covenant" is supplied (compare <a onClick="return mV(\'Hbr\',12,24);">Heb 12:24</a>, neos).<P>Corresponding to this, we have (<a onClick="return mV(\'2Cr\',5,17);">2Co 5:17</a>, the King James Version and the Revised Version (British and American)), "The old things have passed away; behold, they are become new": ibid., "If any man is in Christ, he is a new creature," the Revised Version margin "there is a new creation"; <a onClick="return mV(\'Gal\',6,15);">Ga 6:15</a>, margin "or creation," "new man" (<a onClick="return mV(\'Eph\',2,15);">Eph 2:15</a>; <a onClick="return mV(\'Eph\',4,24);">4:24</a>; <a onClick="return mV(\'Col\',3,10);">Col 3:10</a> (neos)); "new commandment" (<a onClick="return mV(\'Jhn\',13,34);">Joh 13:34</a>); "new doctrine" (<a onClick="return mV(\'Act\',17,19);">Ac 17:19</a>); "new thing" (<a onClick="return mV(\'Act\',17,21);">Ac 17:21</a>); "newness of life" (kainotes) (<a onClick="return mV(\'Rom\',6,4);">Ro 6:4</a>); "newness of the spirit" (<a onClick="return mV(\'Rom\',7,6);">Ro 7:6</a>; compare <a onClick="return mV(\'2Cr\',5,17);">2Co 5:17</a>); "a new name," (<a onClick="return mV(\'Rev\',2,17);">Re 2:17</a>; <a onClick="return mV(\'Rev\',3,12);">3:12</a>), "new heavens and a new earth" (<a onClick="return mV(\'2Pe\',3,13);">2Pe 3:13</a>); "new Jerusalem" (<a onClick="return mV(\'Rev\',3,12);">Re 3:12</a>; <a onClick="return mV(\'Rev\',21,2);">21:2</a>); "new song" (<a onClick="return mV(\'Rev\',5,9);">Re 5:9</a>); compare "new friend" and "new wine" (Sirach 9:10b, c); artigennetos, "newborn" (<a onClick="return mV(\'1Pe\',2,2);">1Pe 2:2</a>); prosphatos, "newly slain," "new" (<a onClick="return mV(\'Hbr\',10,20);">Heb 10:20</a>, the Revised Version (British and American) "a new and living way, through the veil, that is to say, his flesh"; compare Sirach 9:10a; Judith 4:3); "new" is the translation of neos, "new," "young" (<a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a>; <a onClick="return mV(\'Col\',3,10);">Col 3:10</a>; "new man"; <a onClick="return mV(\'Hbr\',12,24);">Heb 12:24</a>, "new covenant").<P>The difference in meaning between kainos and neos, is, in the main, that kainos denotes new in respect of quality, "the new as set over against that which has seen service, the outworn, the effete, or marred through age"; neos, "new (in respect of time), that which has recently come into existence," e.g. kainon mnemeion, the "new tomb" in which Jesus was laid, was not one recently made, but one in which no other dead had ever lain; the "new covenant," the "new man," etc., may be contemplated under both aspects of quality and of time (Trench, Synonyms of the New Testament, 209f).<P>In <a onClick="return mV(\'Mat\',9,16);">Mt 9:16</a>; <a onClick="return mV(\'Mar\',2,21);">Mr 2:21</a>, agnaphos, "unsmoothed," "unfinished," is translated "new," "new cloth," the Revised Version (British and American) "undressed." For "new bottles" (<a onClick="return mV(\'Luk\',5,38);">Lu 5:38</a> and parallels), the Revised Version (British and American) has "fresh wine-skins."``185';
isbe[6394]='Neziah`ne-zi\'-a (netsiach): The head of a family of Nethinim (<a onClick="return mV(\'Ezr\',2,54);">Ezr 2:54</a>; <a onClick="return mV(\'Neh\',7,56);">Ne 7:56</a>), called in 1Esdras 5:32, "Nasi" (the King James Version and the Revised Version margin "Nasith").``1';
isbe[6395]='Nezib`ne\'-zib (netsibh; Codex Vaticanus Naseib; Codex Alexandrinus Nesib): A town in the Judean Shephelah, mentioned along with Keilah and Mareshah (<a onClick="return mV(\'Jos\',15,43);">Jos 15:43</a>). Eusebius, Onomasticon, places it 7 miles from Eleutheropolis (Beit Jibrin), on the road to Hebron. It is represented today by Beit Nasib, a village with ancient remains some 2 miles southwest of Khirbet Kila (Keilah).``1';
isbe[6396]='Nibhaz`nib\'-haz (nibhchaz): Given as the name of an idol of the Avvites, introduced by them into Samaria (<a onClick="return mV(\'2Ki\',17,31);">2Ki 17:31</a>), but otherwise unknown. The text is supposed to be corrupt.``1';
isbe[6397]='Nibshan`nib\'-shan (ha-nibhshan; Codex Vaticanus Naphlazon; Codex Alexandrinus Nebsan): A city in the Judean wilderness named between Secacah and the City of Salt (<a onClick="return mV(\'Jos\',15,62);">Jos 15:62</a>). Eusebius, Onomasticon, knows the place but gives no clue to its identification. The site has not been recovered. Wellhausen suggests the emendation of nibhshan to kibhshan, "furnace" (Proleg. 2, 344).``1';
isbe[6398]='Nicanor (1)`ni-ka\'-nor, ni\'-ka-nor (Nikanor): The son of Patroclus and one of the king\'s "chief friends" (2Macc 8:9), a Syrian general under Antiochus Epiphanes and Demetrius Soter. After the defeat of Seron by Judas, Epiphanes entrusted his chancellor Lysias with the reduction of Judea (1Macc 3:34ff). Nicanor was one of the three generals commissioned by Lysias—the others being Ptolemy, son of Dorymenes, and Gorgias (1Macc 3:38). The campaign began in 166 BC; the Syrians were defeated at Emmaus (1Macc 3:57ff), while Gorgias at a later stage gained a victory at Jamnia over a body of Jews who disobeyed Judas (1Macc 5:58). The account given in 2Macc differs considerably, both in omissions and in additions (2Macc 8:9ff). There Nicanor, not Gorgias, is the chief in command. The battle of Emmaus is not mentioned, but "the thrice-accursed Nicanor," having in overweening pride invited a thousand slavedealers to accompany him to buy the Jewish captives, was humiliated, and his host was destroyed, he himself escaping "like a fugitive slave" to Antioch (2Macc 8:34f). After the death of Epiphanes, Eupator and Lysias (the last two at the hands of Demetrius (1Macc 7:2)), Nicanor appears again under King Demetrius in the struggle between Alcimus and Judas. Alcimus, having been seated in the priesthood by Demetrius\' officer Bacchides, could not hold it against Judas and the patriots. He appealed again to Demetrius, who this time selected Nicanor, now governor of Cyprus (2Macc 12:2) and known for his deadly hatred of the Jews, to settle the dispute and slay Judas (2Macc 14:12ff; 1Macc 7:26ff). Nicanor was appointed governor of Judea on this occasion. Again 1 and 2Maccabees differ. According to 1Maccabees, Nicanor sought in vain to seize Judas by treachery. Then followed the battle of Capharsalama ("village of peace"), in which the Syrians were defeated, though Josephus (Ant., XII, x, 5) says Judas was defeated. Nicanor retired to Jerusalem, insulted the priests and threatened the destruction of the temple unless they delivered up Judas. He then retired to Beth-horon to find Judas posted opposite him at Adasa (1Macc 7:39ff) 3 1/2 miles distant. Here on the 13th of the 12th month Adar (March), 161 BC, the Syrians sustained a crushing defeat, Nicanor himself being the first to fall. The Jews cut off his head and proud right hand and hanged them up beside Jerusalem. For a little while Adasa gave the land of Judah rest. The people ordained to keep this "day of great gladness" year by year—the 13th of Adar, "the day before the day of Mordecai" (Feast of Purim). 2Maccabees mentions that Simon, Judas\' brother, was worsted in a first engagement (14:17), omits the battle of Capharsalama, and represents Nicanor, struck with the manliness of the Jews, as entering into friendly relations with Judas, urging him to marry and lead a quiet life, forgetful of the king\'s command until Alcimus accused him to Demetrius. The latter peremptorily ordered Nicanor to bring Judas in all haste as prisoner to Antioch (14:27). The scene of the final conflict (Adasa) is given only as "in the region of Samaria" (15:1). According to this account, it was Judas who ordered the mutilation of Nicanor and in a more gruesome fashion (15:30ff). It is possible that the Nicanor, the Cypriarch or governor of Cyprus of 2Macc 12:2, is a different person from Nicanor, the son of Patroclus—a view not accepted in the above account.``5';
isbe[6399]='Nicanor (2)`(Nikanor): One of "the seven" chosen to superintend "the daily ministration" of the poor of the Christian community at Jerusalem (<a onClick="return mV(\'Act\',6,5);">Ac 6:5</a>). The name is Greek.``1';
isbe[6400]='Nicodemus`nik-o-de\'-mus (Nikodemos): A Pharisee and a "ruler of the Jews," mentioned only by John. He<P>(1) interviewed Christ at Jerusalem and was taught by Him the doctrine of the New Birth (<a onClick="return mV(\'Jhn\',3,\'1-15\');">Joh 3:1-15</a>),<P>(2) defended Him before the Sanhedrin (<a onClick="return mV(\'Jhn\',7,\'50-52\');">Joh 7:50-52</a>), and<P>(3) assisted at His burial (<a onClick="return mV(\'Jhn\',19,\'39-42\');">Joh 19:39-42</a>).<P>1. The Interview:<P>This meeting, which it has been surmised took place in the house of John (<a onClick="return mV(\'Jhn\',3,\'1-15\');">Joh 3:1-15</a>), was one of the results of our Lord\'s ministry at Jerusalem during the first Passover (compare <a onClick="return mV(\'Jhn\',3,2);">Joh 3:2</a> with <a onClick="return mV(\'Jhn\',2,23);">Joh 2:23</a>). Although Nicodemus had been thus won to believe in the divine nature of Christ\'s mission, his faith was yet very incomplete in that he believed Him to be inspired only after the fashion of the Old Testament prophets. To this faint-hearted faith corresponded his timidity of action, which displayed itself in his coming "by night," lest he should offend his colleagues in the Sanhedrin and the other hostile Jews (<a onClick="return mV(\'Jhn\',3,2);">Joh 3:2</a>). In answer to the veiled question which the words of Nicodemus implied, and to convince him of the inadequacy of mere intellectual belief, Christ proclaimed to him the necessity for a spiritual regeneration: "Except one be born anew, he cannot see the kingdom of God" (<a onClick="return mV(\'Jhn\',3,3);">Joh 3:3</a>). This was interpreted by Nicodemus only in its materialistic sense, and therefore caused him bewilderment and confusion (<a onClick="return mV(\'Jhn\',3,4);">Joh 3:4</a>). But Christ, as on another occasion when dealing with His questioners on a similar point of doctrine (compare <a onClick="return mV(\'Jhn\',6,52,53);">Joh 6:52,53</a>), answered his perplexity only by repeating His previous statement (<a onClick="return mV(\'Jhn\',3,5);">Joh 3:5</a>). He then proceeded to give further explanation. The re-birth is not outward but inward, it is not of the body but of the soul (<a onClick="return mV(\'Jhn\',3,6);">Joh 3:6</a>). Just as God is the real agent in the birth of the body, so also is He the Creator of the New Spirit; and just as no one knoweth whence cometh the wind, or "whither it goeth," yet all can feel its effects who come under its influence, so is it with the rebirth. Only those who have experienced it as a change in themselves, wrought by the Divine Power, are qualified to judge either of its reality or of its effects (<a onClick="return mV(\'Jhn\',3,7,8);">Joh 3:7,8</a>). But Nicodemus, since such experience had not yet been his, remained still unenlightened (<a onClick="return mV(\'Jhn\',3,9);">Joh 3:9</a>). Christ therefore condemned such blindness in one who yet professed to be a teacher of spiritual things (<a onClick="return mV(\'Jhn\',3,10);">Joh 3:10</a>), and emphasized the reality in His own life of those truths which He had been expounding (<a onClick="return mV(\'Jhn\',3,11);">Joh 3:11</a>). With this, Christ returned to the problem underlying the first statement of Nicodemus. If Nicodemus cannot believe in "earthly things," i.e. in the New Birth, which, though coming from above, is yet realized in this world, how can he hope to understand "heavenly things," i.e. the deeper mysteries of God\'s purpose in sending Christ into the world (<a onClick="return mV(\'Jhn\',3,12);">Joh 3:12</a>), of Christ\'s Divine sonship (<a onClick="return mV(\'Jhn\',3,13);">Joh 3:13</a>), of His relationship to the atonement and the salvation of man (<a onClick="return mV(\'Jhn\',3,14);">Joh 3:14</a>), and of how a living acceptance of and feeding upon Him is in itself Divine life (<a onClick="return mV(\'Jhn\',3,15);">Joh 3:15</a>; compare <a onClick="return mV(\'Jhn\',6,\'25-65\');">Joh 6:25-65</a>)?<P>2. The Defense:<P>The above interview, though apparently fruitless at the time, was not without its effect upon Nicodemus. At the Feast of Tabernacles, when the Sanhedrin was enraged at Christ\'s proclamation of Himself as the "living water" (<a onClick="return mV(\'Jhn\',7,37,38);">Joh 7:37,38</a>), Nicodemus was emboldened to stand up in His defense. Yet here also he showed his natural timidity. He made no personal testimony of his faith in Christ, but sought rather to defend Him on a point of Jewish law (<a onClick="return mV(\'Jhn\',7,\'50-52\');">Joh 7:50-52</a>; compare <a onClick="return mV(\'Exd\',23,1);">Ex 23:1</a>; <a onClick="return mV(\'Deu\',1,16,17);">De 1:16,17</a>; <a onClick="return mV(\'Deu\',17,6);">17:6</a>; <a onClick="return mV(\'Deu\',19,15);">19:15</a>).<P>3. The Burial:<P>By this open act of reverence Nicodemus at last made public profession of his being of the following of Christ. His wealth enabled him to provide the "mixture of myrrh and aloes, about a hundred pounds," with which the body of Jesus was embalmed (<a onClick="return mV(\'Jhn\',19,39);">Joh 19:39</a>).<P>The Gospel of Nicodemus and other apocryphal works narrate that Nicodemus gave evidence in favor of Christ at the trial before Pilate, that he was deprived of office and banished from Jerusalem by the hostile Jews, and that he was baptized by Peter and John. His remains were said to have been found in a common grave along with those of Gamaliel and Stephen.<P>Nicodemus is a type of the "well-instructed and thoughtful Jew who looked for the consummation of national hope to follow in the line along which he had himself gone, as being a continuation and not a new beginning" (Westcott). The manner in which the Gospel narrative traces the overcoming of his natural timidity and reluctant faith is in itself a beautiful illustration of the working of the Spirit, of how belief in the Son of Man is in truth a new birth, and the entrance into eternal life.``88';
