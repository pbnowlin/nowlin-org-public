urabi\'s dynasty was that designated Arabian by Berosus. Its founder was apparently Sumu-abi, and Hammurabi was the fifth in descent from him. Hammurabi\'s father, Sin-mubalit, and his grandfather, Abil-Sin, are the only rulers of the dynasty which have Babylonian names, all the others being apparently Arabic.<P>2. The Years Following His Accession:<P>Concerning Hammurabi\'s early life nothing is recorded, but since he reigned at least 43 years, he must have been young when he came to the throne. His accession was apparently marked by some improvement in the administration of the laws, wherein, as the date-list says, he "established righteousness." After this, the earlier years of his reign were devoted to such peaceful pursuits as constructing the shrines and images of the gods, and in his 6th year he built the wall of the city of Laz. In his 7th year he took Unug (Erech) and Isin—two of the principal cities of Babylonia, implying that the Dynasty of Babylon had not held sway in all the states.<P>3. Military Operations and Further Pious Works. Inauguration of His Image:<P>While interesting himself in the all-important work of digging canals, he found time to turn his attention to the land of Yamutbalu (8th year), and in his 10th he possibly conquered, or received the homage of, the city and people (or the army) of Malgia or Malga. Next year the city Rabiku was taken by a certain Ibik-Iskur, and also, seemingly, a place called Salibu. The inauguration of the throne of Zer-panitum, and the setting up, seemingly, of some kind of royal monument, followed, and was succeeded by other religious duties—indeed, work of this nature would seem to have occupied him every year until his 21st, when he built the fortress or fortification of the city Bazu. His 22nd year is described as that of his own image as king of righteousness; and the question naturally arises, whether this was the date when he erected the great stele found at Susa in Elam, inscribed with his Code of Laws, which is now in the Louvre. Next year he seems to have fortified the city of Sippar, where, it is supposed, this monument was originally erected.<P>4. The Capture of Rim-Sin:<P>Pious works again occupied him until his 30th year, when the army of Elam is referred to, possibly indicating warlike operations, which paved the way for the great campaign of his 31st year, when, "with the help of Anu and Enlil," he captured Yamut-balu and King Rim-Sin, the well-known ruler of Larsa. In his 32nd year he destroyed the army of Asnunna or Esnunnak.<P>5. Various Works, and an Expedition to Mesopotamia:<P>After these victories, Hammurabi would seem to have been at peace, and in his 33rd year he dug the canal Hammurabi-nuhus-nisi, "Hammurabi the abundance of the people," bringing to the fields of his subjects fertility, "according to the wish of Enlila." The restoration of the great temple at Erech came next, and was followed by the erection of a fortress, "high like a mountain," on the banks of the Tigris. He also built the fortification of Rabiku on the bank of the Tigris, implying preparations for hostilities, and it was possibly on account of this that the next year he made supplication to Tasmetum, the spouse of Nebo. The year following (his 37th), "by the command of Anu and Enlila," the fortifications of Maur and Malka were destroyed, after which the country enjoyed a twelve-month of peace. In all probability, however, this was to prepare for the expedition of his 39th year, when he subjugated Turukku, Kagmu and Subartu, a part of Mesopotamia. The length of this year-date implies that the expedition was regarded as being of importance.<P>6. His Final Years:<P>Untroubled by foreign affairs, the chief work of Hammurabi during his 40th year was the digging of the canal Tisit-Enlila, at Sippar, following this up by the restoration of the temple E-mete-ursag and a splendid temple-tower dedicated to Zagaga and Istar. The defenses of his country were apparently his last thought, for his 43rd year, which seemingly terminated his reign and his life, was devoted to strengthening the fortifications of Sippar, a work recorded at greater length in several cylinder-inscriptions found on the site.<P>7. No Record of an Expedition to Palestine:<P>Unfortunately none of the documents referring to his reign makes mention of his attack, in company with the armies of Chedorlaomer, Tidal and Arioch, upon the rebel-kings of Sodom and Gomorrah. This naturally throws doubt on the identification of Hammurabi with the Amraphel of <a onClick="return mV(\'Gen\',14,1);">Ge 14:1</a>ff. It must be remembered, however, that we do not possess a complete history either of his life or his rule. That he was a contemporary of Arioch seems undoubted, and if this be the case, Chedorlaomer and Tidal were contemporaries too. Various reasons might be adduced for the absence of references to the campaign in question—his pride may have precluded him from having a year named after an expedition—no matter how satisfactory it may have been—carried out for another power—his suzerain; or the allied armies may have suffered so severely from attacks similar to that delivered by Abraham, that the campaign became an altogether unsuitable one to date by.<P>8. The Period When It May Have Taken Place:<P>If Eri-Aku was, as Thureau-Dangin has suggested, the brother of Rim-Sin, king of Larsa (Elassar), he must have preceded him on the throne, and, in that case, the expedition against the kings of the Plain took place before Hammurabi\'s 30th year, when he claims to have defeated Rim-Sin. As the date of Rim-Sin\'s accession is doubtful, the date of Eri-Aku\'s (Arioch\'s) death is equally so, but it possibly took place about 5 years before Rim-Sin\'s defeat. The expedition in question must therefore have been undertaken during the first 25 years of Hammurabi\'s reign. As Amraphel is called king of Shinar (Babylonia), the period preceding Hammurabi\'s accession ought probably to be excluded.<P>9. Hammurabi\'s Greatness as a Ruler:<P>Of all the kings of early Babylonia so far known, Hammurabi would seem to have been one of the greatest, and the country made good progress under his rule. His conflicts with Elam suggest that Babylonia had become strong enough to resist that warlike state, and his title of adda or "father" of Martu (= Amurru, the Amorites) and of Yamutbalu on the east implies not only that he maintained the country\'s influence, but also that, during his reign, it was no longer subject to Elam. Rim-Sin and the state of Larsa, however, were not conquered until the time of Samsu-iluna, Hammurabi\'s son. It is noteworthy that his Code of Laws (see 3, above) not only determined legal rights and responsibilities, but also fixed the rates of wages, thus obviating many difficulties.`<a href="./study/isbe/search.html?string=AMRAPHEL">AMRAPHEL</a>; <a href="./study/isbe/search.html?string=ARIOCH">ARIOCH</a>; <a href="./study/isbe/search.html?string=CHEDORLAOMER">CHEDORLAOMER</a>; <a href="./study/isbe/search.html?string=TIDAL">TIDAL</a>`136';
isbe[4054]='Hammurabi, Code of`kod.<P><b>I. HISTORICAL</b><P class="in15">1. Discovery of the Code<P class="in15">2. Editions of the Code<P class="in15">3. Description of the Stone<P class="in15">4. History of the Stone<P class="in15">5. Origin and Later History of the Code<P><b>II. CONTENTS OF THE CODE</b><P class="in15">1. The Principles of Legal Process<P class="in15">2. Theft, Burglary, Robbery<P class="in15">3. Laws concerning Vassalage<P class="in15">4. Immovables<P class="in15">5. Trader and Agent<P class="in15">6. Taverns<P class="in15">7. Deposits<P class="in15">8. Family<P class="in15">9. Concerning Wounding, etc.<P class="in15">10. Building of Houses and Ships<P class="in15">11. Hiring in General, etc.<P class="in15">12. Slaves<P><b>III. THE SIGNIFICANCE OF THE CODE</b><P class="in15">1. Hammurabi and Moses<P class="in15">2. The Code and Other Legal Systems<P><b>LITERATURE</b><hr /><P>I. Historical.<P>1. Discovery of the Code:<P>When Professor Meissner published, in 1898, some fragments of cuneiform tablets from the library of the Assyrian king Ashurbanipal (668-628 BC), he also then suggested that these pieces were parts of a copy of an old Book of Law from the time of the so-called First Babylonian Dynasty, one of the kings of which was Hammurabi (more exactly Hammurapi, circa 2100 BC). A few years later this suggestion was fully established. In December, 1901,and January, 1902, a French expedition under the leadership of M. J. de Morgan, the chief aim of which was the exploration of the old royal city Susa, found there a diorite stone, 2,25 meters high and almost 2 meters in circumference. This stone had a relief (see below) and 44 columns of ancient Babylonian cuneiform writing graven upon it. Professor V. Scheil, O.P., the Assyriological member of the expedition, recognized at once that this stele contains the collection of laws of King Hammurabi, and published this characteristic discovery as early as 1902 in the official report of the expedition: Delegation en Perse (Tome IV, Paris).<P>2. Editions of the Code:<P>At the same time Scheil gave the first translation of the text. Since then the text has several times been published, translated and commented upon; compare especially: H. Winckler, Die Gesetze Hammurabis (= Der alte Orient, IV, Leipzig; 1st edition, 1903; 4th edition, 1906); H. Winckler, Die Gesetze Hammurabis in Umschrift und Ubersetzung, Leipzig, 1904; D.H. Muller, Die Gesetze Hammurabis und die Mosaische Gesetzgebung, Vienna, 1903; R.F. Harper, The Code of Hammurabi, Chicago, 1904; C.H.W. Johns, Babylonian and Assyrian Laws, Contracts, Letters, Edinburgh, 1904, 44ff; T.G. Pinches, The Old Testament in the Light of the Historical Records and Legends of Assyria and Babylonia, London, 1908, 487; A. Ungnad, Altorientalische Texte und Bilder zum Alten Testament, Tubingen,1909, I, 140ff; A. Ungnad, Keilschrifttexte der Gesetze Hammurapis, Leipzig, 1909; J. Kohler, F. Peiser and A. Ungnad, Hammurabis Gesetz, 5 volumes, Leipzig, 1904-11.<P>3. Description of the Stone:<P>The stone has the form of a column the cross-section of which is approximately an ellipse. The upper part of the face has a relief (see illustration). We see the king in supplicating attitude standing before the sun-god who sits upon a throne and is characterized by sun rays which stream out from his shoulders. As the king traced back the derivation of the Code to an inspiration of this god, we may suppose that the relief represents the moment when the king received the laws from the mouth of the god. Lower on the face of the stone are 16 columns of text, which read from top to bottom; 7 other columns were erased some time later than Hammurabi in order to make room for a new inscription. The reverse side contains 28 columns of text.<P>4. History of the Stone:<P>The stone was set up by the king, toward the end of his reign of 43 years, in the temple Esagila at Babylon, the capital of his dominion (circa 2100 BC). It was probably stolen from there by the Elamitic king Shutruk-Nakhunte, in the 12th century BC, at the time of the plundering of Babylon, and set up as a trophy of war in the Elamitic capital Susa. The same king had, it would seem, the 7 columns from the face side erased in order to engrave there an account of his own deeds, but through some unknown circumstance this latter was not accomplished. After the discovery of the stele it was brought to Paris where it now forms one of the most important possessions of the Louvre.<P>5. Origin and Later History of the Code:<P>If, however, Hammurabi was not the first legislator of Babylonia, still he was, as far as we can see, the first one who used the language of the people, i.e. the Semitic idiom. We know that nearly 1,000 years earlier a king, Urukagina, promulgated laws in Babylonia which have been lost; an ancestor of Hammurabi, Sumulael, appears also to have given laws. As we are able to recognize from the actual practice of Babylonian social life, the legislation of Hammurabi signifies nothing essentially new. Even before his time laws after the same principles were administered. His service lies before all in that he gathered together the extant laws and set them up in the Semitic language. The laws were promulgated already in the 2nd year of his reign, but the stele known to us was set up in the temple at Babylon about 30 years later. Moreover, the laws were set up in more than one copy, for in Susa fragments of another copy were found. How long the laws were in actual use it is impossible to determine. In any case, as late as the time of Ashurbanipal (see above), they used to be copied; indeed we even possess copies in neo-Babylonian characters which are later than the 7th century BC. Fortunately the duplicates contain several passages which are destroyed on the large stele in consequence of the erasure of the seven columns. Thus we are able, in spite of the gaps in the large stele, almost completely to determine the contents of the Code.<P>II. The Contents of the Code.<P>The laws themselves are preceded by an introduction which was added later, after the law had already been published about 30 years. The introduction states in the first place that already in the primeval age, when Marduk the god of Babylon was elected king of the gods, Hammurabi was predestined by the gods "to cause justice to radiate over the land, to surrender sinners and evildoers to destruction, and to take care that the strong should not oppress the weak." Hammurabi\'s Code is, indeed, conceived from this standpoint.<P>Farther on, the king lauds his services to the principal cities of Babylonia, their temples and cults. He appears as a true server of the gods, as a protector of his people and a gracious prince to those who at first would not acknowledge his supremacy. To be sure, this introduction is not entirely free from presumption; for the king describes himself as "god of the kings" and "sun-god of Babylon"! The hopes of a Saviour, which heathen antiquity also knew, he regards as realized in his own person.<P>The Code itself may be divided into 12 divisions. It manifests, in no way, a very definite logical system; the sequence is often interrupted, and one recognizes that it is not so much a systematic and exhaustive work as a collection of the legal standards accumulated in the course of time. Much that we would expect to find in a Code is not even mentioned.<P>1. The Principles of Legal Process:<P>The first five paragraphs treat of some principles of legal process. In the first place false accusation is considered. The unprovable charge of sorcery is dealt with in an especially interesting manner (section symbol 2). The accused in this case has to submit to an ordeal at the hands of the River-god; nevertheless nothing is said concerning the details of this ordeal. If he is convicted by the god as guilty, the accuser receives his house; in the opposite case, the accuser is condemned to death and the accused receives his house. The law also proceeds rigorously against false witnesses: in a process in which life is at stake, conscious perjury is punished with death (section symbol 3). Finally the king strives also for an uncorrupt body of judges; a judge who has not carried out the judgment of the court correctly has not only to pay twelve times the sum at issue, but he is also dismissed with disgrace from his office.<P>2. Theft, Burglary, Robbery:<P>The next sections (section symbol, section symbol 6-25) occupy themselves with serious theft, burglary, robbery and other crimes of a like nature. Theft from palace or temple, or the receiving and concealing of stolen property, is punished with death or a heavy fine according to the nature of what is stolen (section symbol, section symbol 6, 8). As it was a custom in Babylonia to effect every purchase in the presence of witnesses or with a written deed of sale, one understands the regulation that, in certain cases in which witnesses were not forthcoming, or a deed could not be shown, theft was assumed: the guilty person suffered death (section symbol 7). A careful procedure is prescribed for the case in which lost goods are found in the hands of another: he who, in the investigation, cannot prove his legitimate right, suffers death, just as a deceiver who tries to enrich himself through making a false accusation (section symbol, section symbol 9ff). Kidnapping of a free child or carrying away and concealing a slave from the palace is punished with death (section symbol, section symbol 14ff). As slavery had the greatest economic significance in Babylonia, detailed regulations concerning the seizing of runaway slaves and similar matters were given (section symbol, section symbol 17ff). Burglary, as also robbery, is punished with death (section symbol, section symbol 21ff). If a robber is not caught, the persons or corporations responsible for the safety of the land had to make compensation (section symbol, section symbol 22ff). Whoever attempts to enrich himself from a building in conflagration is thrown into the fire (section symbol 25).<P>3. Laws concerning Vassalage:<P>The next paragraphs (section symbol, section symbol 26-41) control vassalage, particularly in reference to rights and duties of a military kind, concerning which we are not yet quite clear. Here also Hammurabi\'s care for those of a meaner position is exhibited, since he issues rigid regulations against misuse of the power of office and punishes certain offenses of this kind even with death (section symbol 34). The crown had, in every case, authority in reference to estates in fee which a vassal could not sell, exchange or transmit to his wife or daughters (section symbol, section symbol 36ff, 41); as a rule the sons took over the estates after the death of the father together with the accompanying rights and duties. The same was the case if, in the service of the king, the father had been lost sight of (section symbol, section symbol 28f). The estates in fee of what we may call "lay-priestesses" (concerning whom we shall have to speak later) take a special position (section symbol 40).<P>4. Immovables:<P>A longer section (section symbol, section symbol 41ff) is given to immovables (field, garden, house); for the economic life of the ancient Babylonians depended first of all upon the cultivation of grain and date-palms; the legal relations of the land tenants are exactly explained (section symbol, section symbol 42ff): neglect of his work does not liberate the tenant from his duties to his overlord. On the other hand, in cases of losses through the weather, he is so far released from his duties that of the rent not yet paid he has to pay only an amount corresponding to the quantity of the product of his tenancy (section symbol, section symbol 45f). Also the landowner with liabilities, who suffers through failure of crops and inundation, enjoys far-reaching protection (section 48), and his business relations generally are adequately regulated (section symbol, section symbol 49ff). As the regular irrigation of the fields was the chief condition for profitable husbandry in a land lacking rain, strong laws are made in reference to this: damage resulting from neglect has to be compensated for; indeed, whoever had not the means to do this could be sold with his family into slavery (section symbol, section symbol 53ff). Special regulations protect the landowner from unlicensed grazing on his fields of crops (section symbol, section symbol 57f).<P>The regulations concerning horticulture (section symbol, section symbol 59-66) are similar; here also the relation of the proprietor to the gardener who had to plant or to cultivate the garden is carefully considered; the same is true with respect to the business liabilities of the owner. These regulations concerning horticulture are not entirely preserved upon the stele, but, through the above-mentioned duplicates, we can restore them completely.<P>Our knowledge concerning the legal relations between house-owners and tenants (section symbol, section symbol 67ff) is less, because the parts dealing with these on the stele are entirely lost and can only be partially restored from duplicates. Reference is once more made to vassalage (section 71). The relations between neighbors are also regulated, but we cannot ascertain how in detail (section symbol, section symbol 72ff). Concerning the precise rights of tenants and landlords we are also but slightly informed (section 78).<P>On account of the gaps, we are not able to determine how far the regulations concerning immovables extended. In the gaps there seem to have been still other laws concerning business liabilities. The number of missing paragraphs can only approximately be determined, so that our further enumeration of the paragraphs cannot be regarded as absolutely correct.<P>5. Trader and Agent:<P>The text begins again with the treatment of the legal relations between the trader and his agents (section symbol, section symbol 100-107); these agents are a kind of officials for the trader whose business they look after. While the Code discusses their responsibilities and duties to their masters, it also protects them from unjust and deceitful ones.<P>6. Taverns:<P>The taverns of Babylonia (sections 108-11) seem very often to have been the resort of criminals. As a rule they were in the hands of proprietresses who were made responsible for what took place on their premises (section 109). Priestesses were forbidden to visit these houses under penalty of being burned (section 110).<P>7. Deposits:<P>The next division (sections 112-26) deals especially with deposits, although some of its regulations are only indirectly therewith connected. Deceptive messengers are to be punished (section 112). The debtor is protected from violent encroachments of the creditor (section 113). Detailed regulations are given concerning imprisonment for debt (sections 114ff). The creditor must guard himself from mistreating a person imprisoned for debt, in his house; if a child of the debtor dies through the fault of the creditor, the jus talionis is resorted to: a child of the creditor is killed (section 116). The members of a family imprisoned for debt have to be released after three years (section 117). If anyone desires to give something to another to be saved for him, he must do it in the presence of witnesses or draw up a statement of the transaction; otherwise later claims cannot be substantiated (sections 122ff). Whoever accepts the objects is responsible for them (section 125), but is also protected from unjustified claims of his client (section 126).<P>8. Family:<P>The sections occupied with the rights of the family are very extensive (sections 127-95). Matrimony rests upon a contract (section 128) and presupposes the persistent fidelity of the wife (sections 129ff), while the husband is not bound, in this respect, by regulations of any kind. An unfaithful wife may be thrown into the water, but the partner of her sin may also, under certain circumstances, suffer the penalty of death. Long unpreventable absence of the husband justifies the wife to marry again only when she lacks the means of support (sections 133ff). On the part of the husband, there are no hindrances to divorce, so long as he settles any matters with his wife concerning her property, provides for the upbringing of the children and, in certain cases, gives a divorce-sum as compensation (sections 137ff). Disorderly conduct of the wife is sufficient for the annulling of the marriage; in this case the husband may reduce the wife to the state of a slave (section 141). The wife may only annul the marriage if her husband grossly neglects his duties toward her (section 142). If a wife desires the annulling of the marriage for any other reason, she is drowned (section 143).<P>As a rule, polygamy is not allowed. If a barren wife gives to her husband a slave girl who bears children to him, then he may not marry another wife (section 144); otherwise he might do so (section 145). The slave given to the husband is bound to show due deference to her mistress; if she does not do this she loses her privileged position, but she may not be sold if she has borne a child to the husband (sections 146f). Incurable disease of the wife is a ground for the marriage of another wife (sections 148f).<P>Gifts of the husband to the wife may not be touched by the children at the death of the husband, but nevertheless property has to remain in the family (section 150). Debts contracted before the marriage by one side or the other are not binding for the other, if an agreement has been made to that effect (section 151f).<P>Rigid laws are made against abuses in sexual life. The wife who kills her husband for the sake of a lover is impaled upon a stake (section 153). Incest is punished, according to the circumstances, with exile or death (sections 154ff).<P>Breach of promise by the man without sufficient reason entails to him the loss of all presents made for the betrothed. If the father of the betrothed annuls the engagement, he must give back to the man twice the value of the presents (sections 159ff); especially the sum paid for the wife to her father (Bab terhatu).<P>Matters concerning inheritance are carefully dealt with (sections 162ff). The dowry of a wife belongs, after her death, to her children (section 162). Presents made during the lifetime are not reckoned in the dividing of the inheritance (section 165), apart from the outlay which a father has to make in the case of each of his sons, the chief portion of which is the money for a wife (section 166). Children borne from different mothers share the paternal inheritance equally (section 167).<P>Disinheritance of a child is permitted only in the case of serious offenses after a previous warning (sections 168f). Illegitimate children borne from slaves have part in the inheritance only if the father has expressly acknowledged them as his children (section 170); otherwise, at the death of the father, they are released (section 171).<P>The chief wife, whose future needs had not been secured during the lifetime of her husband, receives from the property of the deceased husband a portion equal to that received by each child, but she has only the use of it (section 172). A widow may marry again, but then she loses all claim on the property of her first husband, in favor of his children (sections 172, 177); the children of both her marriages share her own property equally (sections 173f).<P>The children from free women married to slaves are free (section 175). The master of the slave has only a claim to half of the property of the slave which he has acquired during such a marriage (sections 176f).<P>Unmarried daughters mostly became priestesses or entered a religious foundation (Babylonian, malgu); they also received, very often, a sort of dowry, which, however, remained under the control of their brothers and which, on the death of the former, fell to the brothers and sisters, if their fathers had not expressly given them a free hand in this matter (sections 178f). In cases where the father did not give such a dowry, the daughter received, from the property left, a share equal to that of the others, but only for use; those dedicated to a goddess obtained only a third of such an amount (section 180f). The lay-priestesses of the god Marduk of Babylon enjoyed special privileges in that they had full control over any property thus acquired (section 182).<P>As a rule, adopted children could not be dismissed again (sections 185ff). Parents who had given their child to a master, who had adopted it and taught it handwork, could not claim it again (sections 188f). Gross insubordination of certain adopted children of a lower class is severely punished by the cutting off of the tongue (section 192) or the tearing out of an eye (section 193). Deceitful wet-nurses are also severely punished (section 194). The last paragraph of this section (section 195) states the punishment for children who strike their father as the cutting off of the hand.<P>9. Concerning Wounding, etc.:<P>The next division (sections 196-227) occupies itself with wounding of all kinds, in the first place with the jus talionis: an eye for an eye, a bone for a bone, a tooth for a tooth. Persons lower in the social grade usually accepted money instead (sections 196ff). A box on the ears inflicted by a free man upon a free man cost the former 60 shekels (section 203); in the case of one half-free, 10 shekels (section 204); but if a slave so strikes a free man, his ear is to be cut off (section 205). Unintentional wounding of the body, which proves to be fatal, is covered by a fine (sections 207f). Anyone who strikes a pregnant free woman, so as to cause a miscarriage and the death of the woman, is punished by having his daughter killed (section 210); in the case of a half-free woman or a slave, a money compensation was sufficient (sections 212ff). The surgeon is responsible for certain operations; if they succeed, he receives a legally determined high reward; if they fail, under certain circumstances his hand might be cut off (sections 215ff). Certainly this law was an effective preventive against quacks! Farther on come regulations concerning the fees of surgeons (sections 221ff) and veterinary surgeons; to a certain degree the latter are responsible for the killing of an animal under their charge (sections 224f).<P>10. Building of Houses and Ships:<P>Later, the building of houses and ships is treated of (sections 228-40). The builder is responsible for the stability of the house built by him; if it falls down and kills the master of the house, the builder is killed; if it kills a child of the house, a child of the builder is killed (sections 229f). For any other damages incurred, the builder is likewise responsible (sections 231ff). The regulations for the builders of ships are similar (sections 234ff). The man who hires a ship is answerable to the proprietor (sections 236ff). With the busy shipping trade on the canals, special attention had to be given to prevent accidents (section 240).<P>11. Hiring in General, etc.:<P>Already in earlier sections there were regulations concerning hiring (rent) and wages. This eleventh division (sections 241-77) deals with the matter more in detail, but it also brings many things forward which are only slightly related thereto. It states tariffs for working animals (sections 242f), and in conclusion to this makes equally clear to what extent the hirer of such an animal is responsible for harm to the animal (sections 244ff). Special attention must be given an ox addicted to goring (sections 250ff; see below). Care is taken that unfaithful stewards do not escape their punishment: in gross cases of breach of confidence they are punished with the cutting off of the hand or by being torn (in the manner of being tortured on a rack) by oxen (sections 253ff). The wages for agricultural laborers are determined (sections 257f), and in connection with this, lesser cases of theft of field-utensils are considered and covered by a money fine (sections 259f). The wages of a shepherd and his duties form the subject of some other paragraphs (sections 261ff). Finally, matters having to do with hiring are mentioned: the hiring of animals for threshing (sections 268 if), of carriages (section 271), wages of laborers (section 273) and handworkers (section 274), and the hire of ships (sections 276f).<P>12. Slaves:<P>The last division (sections 278-82) treats of slaves in so far as they are not already mentioned. The seller is responsible to the buyer that the slave does not suffer from epilepsy (section 278), and that nobody else has a claim upon him (section 279). Slaves of Babylonian origin, bought in a foreign land, must be released, if they are brought back to Babylonia and recognized by their former master (section 280). If a slave did not acknowledge his master, his ear could be cut off (section 282).<P>Here the laws come to an end. In spite of many regulations which seem to us cruel, they show keen sense of justice and impartiality. Thus the king, in an epilogue, rightly extols himself as a shepherd of salvation, as a helper of the oppressed, as an adviser of widows and orphans, in short, as the father of his people. In conclusion, future rulers are admonished to respect his laws, and the blessings of the gods are promised to those who do so. But upon those who might attempt to abolish the Code he calls down the curse of all the great gods, individually and collectively. With that the stele ends.<P>III. The Significance of the Code.<P>The significance of the Code has been recognized ever since its discovery; for, indeed, it is the most ancient collection of laws which we know. For judgment concerning the ancient Babylonian civilization, for the history of slavery, for the position of woman and many other questions the Code offers the most important material. The fact that law and religion are nearly always distinctly separated is worthy of special attention.<P>1. Hammurabi and Moses:<P>It is not to be wondered at that a monument of such importance demands comparison with similar monuments. In this reference the most important question is as to the relation in which the Code stands to the Law of Moses. Hammurabi was not only king of Babylonia but also of Amurru (= "land of the Amorites"), called later Palestine and Western Syria. As his successors also retained the dominion over Amurru, it is quite possible that, for a considerable time, the laws of Hammurabi were in force here also, even if perhaps in a modified form. In the time of Abraham, for example, one may consider the narratives of Sarah and Hagar (<a onClick="return mV(\'Gen\',16,1);">Ge 16:1</a>), and Rachel and Bilhah (<a onClick="return mV(\'Gen\',30,1);">Ge 30:1</a>), which show the same juridical principles as the Code (compare sections 144ff; see above). Other narratives of the Old Testament indicate the same customs as the Code does for Babylonia; compare <a onClick="return mV(\'Gen\',24,53);">Ge 24:53</a>, where the bridal gifts to Rebekah correspond to the Babylonian terhatu (section 159); similarly <a onClick="return mV(\'Gen\',31,14);">Ge 31:14</a> f.<P>Between the Code and the Law of Moses, especially in the so-called Book of the Covenant (<a onClick="return mV(\'Exd\',20,22);">Ex 20:22-23:33</a>), there are indeed extraordinary parallels. We might mention here the following examples:<P><a onClick="return mV(\'Exd\',21,2);">Ex 21:2</a>: "If thou buy a Hebrew servant, six years he shall serve: and in the seventh he shall go out free for nothing." Similarly, Code of Hammurabi, section 117: "If a man become involved in debt, and give his wife, his son or his daughter for silver or for labor, they shall serve three years in the house of their purchaser or bondmaster: in the fourth year they shall regain their freedom."<P><a onClick="return mV(\'Exd\',21,15);">Ex 21:15</a>: "And he that smiteth his father, or his mother, shall be surely put to death." Compare Code of Hammurabi, section 195: "If a son strike his father, his hand shall be cut off."<P><a onClick="return mV(\'Exd\',21,18);">Ex 21:18</a> f: "And if men contend, and one smite the other with a stone, or with his fist, and he die not, but keep his bed; if he rise again, and walk abroad upon his staff, then shall he that smote him be quit: only he shall pay for the loss of his time, and shall cause him to be thoroughly healed." Compare Code of Hammurabi, section 206: "If a man strike another man in a noisy dispute and wound him, that man shall swear, \'I did not strike him knowingly\'; and he shall pay for the physician."<P><a onClick="return mV(\'Exd\',21,22);">Ex 21:22</a>: "If men strive together, and hurt a woman with child, so that her fruit depart, and yet no harm follow; he shall surely be fined, according as the woman\'s husband shall lay upon him; and he shall pay as the judges determine." Compare Code of Hammurabi, section 209: "If a man strike a free woman and cause her fruit to depart, he shall pay ten shekels of silver for her fruit."<P><a onClick="return mV(\'Exd\',21,24);">Ex 21:24</a>: "Eye for eye, tooth for tooth, hand for hand, foot for foot." Compare Code of Hammurabi, section 196: "If a man destroy the eye of a free man, his eye shall be destroyed." section 197: "If he break the bone of a free man, his bone shall be broken." section 200: "If a man knock out the teeth of a man of the same rank, his teeth shall be knocked out."<P><a onClick="return mV(\'Exd\',21,\'28-32\');">Ex 21:28-32</a>: "If an ox gore a man or a woman to death, the ox shall be surely stoned, and its flesh shall not be eaten; but the owner of the ox shall be quit. But if the ox was wont to gore in time past, and it hath been testified to its owner, and he hath not kept it in, but it hath killed a man or a woman; the ox shall be stoned, and its owner also shall be put to death....If the ox gore a man-servant or a maid-servant, there shall be given unto their master 30 shekels of silver, and the ox shall be stoned." Compare Code of Hammurabi, sections 250ff: "If an ox, while going along the street, gore a man and cause his death, no claims of any kind can be made. If a man\'s ox be addicted to goring and have manifested to him his failing, that it is addicted to goring, and, nevertheless, he have neither blunted his horns, nor fastened up his ox; then if his ox gore a free man and cause his death, he shall give 30 shekels of silver. If it be a man\'s slave, he shall give 20 shekels of silver."<P><a onClick="return mV(\'Exd\',22,7);">Ex 22:7</a>ff reminds one of Code of Hammurabi, sections 124ff; <a onClick="return mV(\'Exd\',22,10);">Ex 22:10</a>ff of Code of Hammurabi, sections 244ff and 266 f.<P>The resemblances between the other parts of the Pentateuch and the Code are not so striking as those between the Code and the. Book of the Covenant; nevertheless one may compare <a onClick="return mV(\'Lev\',19,35);">Le 19:35</a>f with Code of Hammurabi, section 5; <a onClick="return mV(\'Lev\',20,10);">Le 20:10</a> with Code of Hammurabi, section 129; <a onClick="return mV(\'Lev\',24,19);">Le 24:19</a>f with Code of Hammurabi, sections 196ff; <a onClick="return mV(\'Lev\',25,39);">Le 25:39</a>ff with Code of Hammurabi, section 117; <a onClick="return mV(\'Deu\',19,16);">De 19:16</a>ff with Code of Hammurabi, sections 3f; <a onClick="return mV(\'Deu\',22,22);">De 22:22</a> with Code of Hammurabi, section 129; <a onClick="return mV(\'Deu\',24,1);">De 24:1</a> with Code of Hammurabi, sections 137ff and sections 148f; <a onClick="return mV(\'Deu\',24,7);">De 24:7</a> with Code of Hammurabi, section 14; especially <a onClick="return mV(\'Deu\',21,15,18);">De 21:15ff, 18ff</a>, with Code of Hammurabi, sections 167, 168f; where, in both cases, there is a transition from regulations concerning the property left by a man, married several times, to provisions referring to the punishment of a disobedient son, certainly a remarkable agreement in sequence.<P>One can hardly assert that the parallels quoted are accidental, but just as little could one say that they are directly taken from the Code; for they bear quite a definite impression due to the Israelite culture, and numerous marked divergences also exist. As we have already mentioned, the land Amurru was for a time Babylonian territory, so that Babylonian law must have found entrance there. When the Israelites came into contact with Babylonian culture, on taking possession of the land of Canaan (a part of the old Amurru), it was natural that they should employ the results of that culture as far as they found them of use for themselves. Under no circumstances may one suppose here direct quotation. Single parts of the Laws of Moses, especially the Decalogue (<a onClick="return mV(\'Exd\',20,\'1-\');">Ex 20</a>), with its particularly pointed conciseness, have no parallel in Code of Hammurabi.<P>2. The Code and Other Legal Systems: It has also been attempted to establish relations between the Code and other legal systems. In the Talmud, especially in the fourth order of the Mishna called Neziqin (i.e. "damages"), there are many regulations which remind one of the Code. But one must bear in mind that the Jews during the exile could hardly have known the Code in detail; if there happen to be similarities, these are to be explained by the fact that many of the regulations of the Code were still retained in the later Babylonian law, and the Talmud drew upon this later Babylonian law for many regulations which seemed useful for its purposes. The connection is therefore an indirect one.<P>The similarities with the remains of old Arabian laws and the so-called Syrio-Roman Lawbook (5th century AD) have to be considered in the same way, though some of these agreements may have only come about accidentally.<P>That the similarities between Roman and Greek legal usages and the Code are only of an accidental nature may be taken as assured. This seems all the more probable, in that between the Code and other legal systems there are quite striking similarities in individual points, even though we cannot find any historical connection, e.g. the Salic law, the lawbook of the Salic Franks, compiled about 500 AD, and which is the oldest preserved Germanic legal code.<P>Until a whole number of lost codes, as the Old Amoritish and the neo-Bab, are known to us in detail, one must guard well against hasty conclusions. In any case it is rash to speak of direct borrowings where there may be a whole series of mediating factors.<P>LITERATURE.<P>(Concerning the questions treated of in the last paragraphs refer especially to: S. A. Cook, The Laws of Moses and Code of Hammurabi, London, 1903; J. Jeremias, Moses and Hammurabi, Leipzig, 1903; S. Oettli, Das Gesetz Hammurabis und die Thora Israels, Leipzig, 1903; H. Grimme, Das Gesetz Hammurabis und Moses, Koln, 1903; H. Fehr, Hammurapi und das Salische Recht, Bonn, 1910.``179';
isbe[4055]='Hamon-Gog`ha\'-mon-gog (hamon-gogh, "the multitude of Gog"): The name of the place where "Gog and all his multitude" are to be buried (<a onClick="return mV(\'Eze\',39,11,15);">Eze 39:11, 15</a>). By a change in the pointing of <a onClick="return mV(\'Eze\',39,11);">Eze 39:11</a>, ha-\'abharim for ha-\'obherim, we should read "valley of Abarim" for "valley of them that pass through." In that case it would seem that the prophet thought of some ravine in the mountains east of the Dead Sea.``1';
isbe[4056]='Hamonah`ha-mo\'-na (hamonah): The name of a city which stood apparently near <a href="study/isbe/search.html?string=HAMON-GOG">HAMON-GOG</a> (which see) (<a onClick="return mV(\'Eze\',39,16);">Eze 39:16</a>).``1';
isbe[4057]='Hamor`ha\'-mor (chamor, "an ass"; Emmor): Hamor was the father of Shechem from whom Jacob bought a piece of ground on his return from Paddan-aram for one hundred pieces of silver (<a onClick="return mV(\'Gen\',33,19);">Ge 33:19</a>), and the burial place of Joseph when his body was removed from Egypt to Canaan (<a onClick="return mV(\'Jos\',24,32);">Jos 24:32</a>). "The men of Hamor" were inhabitants of Shechem, and suffered a great loss under Abimelech, a prince over Israel (<a onClick="return mV(\'Jdg\',9,\'22-49\');">Jud 9:22-49</a>). Dinah, Jacob\'s daughter, was criminally treated by Hamor, who requested her to be given to him in marriage, in which plan he had the cooperation of his father, Shechem. The sons of Jacob rejected their proposition and laid a scheme by which the inhabitants of the city were circumcised, and in the hour of helplessness slew all the males, thus wreaking special vengeance upon Hamor and his father Shechem. It is mere conjecture to claim that Hamor and Dinah were personifications of early central Palestinian clans in sharp antagonism, and that the course of Simeon and Levi was really the treachery of primitive tribes. Because the word Hamor means "an ass" and Shechem "a shoulder," there is no reason for rejecting the terms as designations of individuals and considering the titles as mere tribal appellations.``38';
isbe[4058]='Hamran`ham\'-ran.`<a href="./study/isbe/search.html?string=HEMDAN">HEMDAN</a>`1';
isbe[4059]='Hamuel`ham\'-u-el, ha-mu\'-el.`<a href="./study/isbe/search.html?string=HAMMUEL">HAMMUEL</a>`1';
isbe[4060]='Hamul`ha\'-mul (chamul, "pitied," "spared"): A son of Perez, and head of one of the clans of Judah (<a onClick="return mV(\'Gen\',46,12);">Ge 46:12</a>; <a onClick="return mV(\'1Ch\',2,5);">1Ch 2:5</a>; <a onClick="return mV(\'Num\',26,21);">Nu 26:21</a>). His descendants were called Hamulites.``1';
isbe[4061]='Hamutal`ha-mu\'-tal (chamutal, "father-in-law" or "kinsman of the dew"): A daughter of Jeremiah of Libnah, and wife of King Josiah, and mother of Jehoahaz and Zedekiah (<a onClick="return mV(\'2Ki\',23,31);">2Ki 23:31</a>; <a onClick="return mV(\'2Ki\',24,18);">24:18</a>; <a onClick="return mV(\'Jer\',52,1);">Jer 52:1</a>). In the last two references and in the Septuagint the name appears as "Hamital." Swete gives a number of variants, e.g. <a onClick="return mV(\'2Ki\',24,18);">2Ki 24:18</a>: Codex Vaticanus, Mitat; Codex Alexandrinus, Amitath; <a onClick="return mV(\'Jer\',52,1);">Jer 52:1</a>: Codex Vaticanus, Hameitaal; Codex Sinaiticus, Codex Alexandrinus Hamitaal; Codex Q Hamital.``1';
isbe[4062]='Hanamel`han\'-a-mel (hanam\'el; the King James Version Hanameel, ha-nam\'el): The son of Shallum, Jeremiah\'s uncle, of whom the prophet, while in prison, during the time when Jerusalem was besieged by the Chaldeans, bought a field with due formalities, in token that a time would come when house and vineyards would once more be bought in the land (<a onClick="return mV(\'Jer\',32,\'6-15\');">Jer 32:6-15</a>).``1';
isbe[4063]='Hanan`ha\'-nan (chanan, "gracious"):<P>(1) A chief of the tribe of Benjamin (<a onClick="return mV(\'1Ch\',8,23);">1Ch 8:23</a>).<P>(2) The youngest son of Azel, a descendant of Saul (<a onClick="return mV(\'1Ch\',8,38);">1Ch 8:38</a>; <a onClick="return mV(\'1Ch\',9,44);">9:44</a>).<P>(3) One of David\'s mighty men of valor (<a onClick="return mV(\'1Ch\',11,43);">1Ch 11:43</a>).<P>(4) The head of a family of the Nethinim who returned with Zerubbabel (<a onClick="return mV(\'Ezr\',2,46);">Ezr 2:46</a>; <a onClick="return mV(\'Neh\',7,49);">Ne 7:49</a>).<P>(5) An assistant of Ezra in expounding the law (<a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>). Possibly the same person is referred to in <a onClick="return mV(\'Neh\',10,10);">Ne 10:10</a> (11).<P>(6) One of the four treasurers put in charge of the tithes by Nehemiah (<a onClick="return mV(\'Neh\',13,13);">Ne 13:13</a>).<P>(7,8) Two who "sealed the covenant" on the eve of the restoration (<a onClick="return mV(\'Neh\',10,22);">Ne 10:22</a> (23), <a onClick="return mV(\'Neh\',10,26);">26</a> (27)).<P>(9) A son of Igdaliah, "the man of God," whose sons had a chamber in the temple at Jerusalem (<a onClick="return mV(\'Jer\',35,4);">Jer 35:4</a>).``38';
isbe[4064]='Hananel, the Tower of`ban\'-an-el (chanan\'el, "El (God) is gracious"; the King James Version Hananeel, ha-nan\'e-el): A tower in the walls of Jerusalem adjoining (<a onClick="return mV(\'Neh\',3,1);">Ne 3:1</a>; <a onClick="return mV(\'Neh\',12,39);">12:39</a>) the tower of <a href="study/isbe/search.html?string=HAMMEAH">HAMMEAH</A> (which see). The company of Levites coming from the west passed "by the fish gate, and the tower of Hananel, and the tower of Hammeah, even unto the sheep gate" (<a onClick="return mV(\'Neh\',12,39);">Ne 12:39</a>). In <a onClick="return mV(\'Jer\',31,38);">Jer 31:38</a> it is foretold "that the city shall be built to Yahweh from the tower of Hananel unto the gate of the corner"—apparently the whole stretch of north wall. In <a onClick="return mV(\'Zec\',14,10);">Zec 14:10</a> it says Jerusalem "shall dwell in her place, from Benjamin\'s gate unto the place of the first gate, unto the corner gate, and from the tower of Hananel unto the king\'s winepresses." These last were probably near Siloam, and the distance "from the tower of Hananel unto the king\'s winepresses" describes the greatest length of the city from north to south. All the indications point to a tower, close to the tower of Hammeah, near the northeast corner, a point of the city always requiring special fortification and later the sites successively of the Baris and of the Antonia.`<a href="./study/isbe/search.html?string=JERUSALEM, 1">JERUSALEM</a>`117';
isbe[4065]='Hanani`ha-na\'-ni (chanani, "gracious"):<P>(1) A musician and son of Heman, David\'s seer, and head of one of the courses of the temple service (<a onClick="return mV(\'1Ch\',25,4,25);">1Ch 25:4, 25</a>).<P>(2) A seer, the father of Jehu. He was cast into prison for his courage in rebuking Asa for relying on Syria (<a onClick="return mV(\'1Ki\',16,1,7);">1Ki 16:1, 7</a>; <a onClick="return mV(\'2Ch\',19,2);">2Ch 19:2</a>; <a onClick="return mV(\'2Ch\',20,34);">20:34</a>).<P>(3) A priest, of the sons of Immer, who had married a foreign wife (<a onClick="return mV(\'Ezr\',10,20);">Ezr 10:20</a>).<P>(4) A brother or kinsman of Nehemiah who carried news of the condition of the Jews in Palestine to Susa and became one of the governors of Jerusalem (<a onClick="return mV(\'Neh\',1,2);">Ne 1:2</a>; <a onClick="return mV(\'Neh\',7,2);">7:2</a>).<P>(5) A priest and chief musician who took part in the dedication of the walls of Jerusalem (<a onClick="return mV(\'Neh\',12,36);">Ne 12:36</a>).``38';
isbe[4066]='Hananiah`han-a-ni\'-a (chananyahu, chananyah; Ananias; also with aspirate, "Yahweh hath been gracious"): This was a common name in Israel for many centuries.<P>(1) A Benjamite (<a onClick="return mV(\'1Ch\',8,24);">1Ch 8:24</a>).<P>(2) A captain of Uzziah\'s army (<a onClick="return mV(\'2Ch\',26,11);">2Ch 26:11</a>).<P>(3) Father of one of the princes under Jehoiakim (<a onClick="return mV(\'Jer\',36,12);">Jer 36:12</a>).<P>(4) One of the sons of Heman and leader of the 16th division of David\'s musicians (<a onClick="return mV(\'1Ch\',25,4,23);">1Ch 25:4, 23</a>).<P>(5) Grandfather of the officer of the guard which apprehended Jeremiah on a charge of desertion (<a onClick="return mV(\'Jer\',37,13);">Jer 37:13</a>).<P>(6) A false prophet of Gibeon, son of Azzur, who opposed Jeremiah, predicting that the yoke of Babylon would be broken in two years, and that the king, the people and the vessels of the temple would be brought back to Jerusalem. Jeremiah would be glad if it should be so, nevertheless it would not be. The question then arose, Which is right, Jeremiah or Hananiah? Jeremiah claimed that he was right because he was in accordance with all the great prophets of the past who prophesied evil and their words came true. Therefore his words are more likely to be true. The prophet of good, however, must wait to have his prophecy fulfilled before he can be accredited. Hananiah took off the yoke from Jeremiah and broke it in pieces, symbolic of the breaking of the power of Babylon. Jeremiah was seemingly beaten, retired and received a message from Yahweh that the bar of wood would become a bar of iron, and that Hananiah would die during the year because he had spoken rebellion against Yahweh (<a onClick="return mV(\'Jer\',28,\'1-\');">Jer 28</a> passim).<P>(7) One of Daniel\'s companions in Babylon whose name was changed to Shadrach (<a onClick="return mV(\'Dan\',1,7,11,19);">Da 1:7, 11, 19</a>).<P>(8) A son of Zerubbabel (<a onClick="return mV(\'1Ch\',3,19,21);">1Ch 3:19, 21</a>).<P>(9) A Levite, one of the sons of Bebai, one of those who married foreign wives (<a onClick="return mV(\'Ezr\',10,28);">Ezr 10:28</a>; 1Esdras 9:29).<P>(10) One of the perfumers (the King James Version "apothecaries") who wrought in rebuilding the wall under Nehemiah (<a onClick="return mV(\'Neh\',3,8);">Ne 3:8</a>).<P>(11) One who helped to repair the wall above the horse gate (<a onClick="return mV(\'Neh\',3,30);">Ne 3:30</a>). This may be the same person as no. 10</a>.<P>(12) A governor of the castle, i.e. the birah or fortress, and by Nehemiah placed in charge of the whole city of Jerusalem, because "he was a faithful man, and feared God above many" (<a onClick="return mV(\'Neh\',7,2);">Ne 7:2</a>).<P>(13) One of those who sealed the covenant under Nehemiah (<a onClick="return mV(\'Neh\',10,23);">Ne 10:23</a>); a Levite.<P>(14) A priest who was present at the dedication of the walls of Jerusalem (<a onClick="return mV(\'Neh\',12,12,41);">Ne 12:12, 41</a>).``146';
isbe[4067]='Hand`(yadh, "hand"; kaph, "the hollow hand," "palm"; yamin, "the right hand"; semo\'l, "the left hand"; cheir, "hand"; dexia, "the right hand"; aristera, "the left hand" (only <a onClick="return mV(\'Luk\',23,33);">Lu 23:33</a>; <a onClick="return mV(\'2Cr\',6,7);">2Co 6:7</a>), or euphemistically (for evil omens come from the left hand; compare Latin sinister, German linkisch, etc.); euonumos, literally, "having a good name"): The Hebrew words are used in a large variety of idiomatic expressions, part of which have passed into the Greek (through the Sepuagint) and into modern European languages (through the translations of the Bible; see Oxford Hebrew Lexicon, under the word "yadh"). We group what has to be said about the word under the following heads:<P>1. The Human Hand: Various Uses:<P>The human hand (considered physically) and, anthropopathically, the hand of God (<a onClick="return mV(\'Gen\',3,22);">Ge 3:22</a>; <a onClick="return mV(\'Psa\',145,16);">Ps 145:16</a>): The hand included the wrist, as Will be seen from all passages in which bracelets are mentioned as ornaments of the hand, e.g. <a onClick="return mV(\'Gen\',24,22,30,47);">Ge 24:22, 30, 47</a>; <a onClick="return mV(\'Eze\',16,11);">Eze 16:11</a>; <a onClick="return mV(\'Eze\',23,42);">23:42</a>, or where the Bible speaks of fetters on the hands (<a onClick="return mV(\'Jdg\',15,14);">Jud 15:14</a>, etc.). On the other hand, it cannot seem strange that occasionally the expression "hand" may be used for a part, e.g. the fingers, as in <a onClick="return mV(\'Gen\',41,42);">Ge 41:42</a>, etc.. According to the lexicon talionis, justice demanded "hand for hand" (<a onClick="return mV(\'Exd\',21,24);">Ex 21:24</a>; <a onClick="return mV(\'Deu\',19,21);">De 19:21</a>). We enumerate the following phrases without claiming to present a complete list: "To fill the hand" (<a onClick="return mV(\'Exd\',32,29);">Ex 32:29</a> m; <a onClick="return mV(\'1Ch\',29,5);">1Ch 29:5</a> margin) means to consecrate, evidently from the filling of hands with sacrificial portions for the altar. Compare also <a onClick="return mV(\'Lev\',7,37);">Le 7:37</a>; <a onClick="return mV(\'Lev\',8,22,28,29,31,33);">8:22, 28-29, 31, 33</a>, where the sacrifice, the ram, the basket of consecration are mentioned. "To put or set the hand unto" (<a onClick="return mV(\'Deu\',15,10);">De 15:10</a>; <a onClick="return mV(\'Deu\',23,20);">23:20</a>; <a onClick="return mV(\'Deu\',28,8,20);">28:8, 20</a>), to commence to do; "to put forth the hand" (<a onClick="return mV(\'Gen\',3,22);">Ge 3:22</a>; <a onClick="return mV(\'Gen\',8,9);">8:9</a>); "to stretch out the hand" (<a onClick="return mV(\'Eze\',25,13,16);">Eze 25:13, 16</a>; <a onClick="return mV(\'Zep\',2,13);">Ze 2:13</a>); "to shake or wag the hand upon" (<a onClick="return mV(\'Isa\',10,32);">Isa 10:32</a>; <a onClick="return mV(\'Zep\',2,15);">Ze 2:15</a>; <a onClick="return mV(\'Zec\',2,9);">Zec 2:9</a>), to defy. "To lay the hand upon the head" (<a onClick="return mV(\'2Sa\',13,19);">2Sa 13:19</a>) is an expression of sadness and mourning, as we see from Egyptian representations of scenes of mourning. Both in joy and in anger hands are "smitten together" (<a onClick="return mV(\'Num\',24,10);">Nu 24:10</a>), and people "clap their hands" at a person or over a person in spiteful triumph (<a onClick="return mV(\'Job\',27,23);">Job 27:23</a>; <a onClick="return mV(\'Lam\',2,15);">La 2:15</a>; <a onClick="return mV(\'Nah\',3,19);">Na 3:19</a>). "To put one\'s life into one\'s hand" is to risk one\'s life (<a onClick="return mV(\'1Sa\',19,5);">1Sa 19:5</a>; <a onClick="return mV(\'1Sa\',28,21);">28:21</a>). "To lay hands upon" is used in the sense of blessing (<a onClick="return mV(\'Mat\',19,13);">Mt 19:13</a>), or is symbolical in the act of miraculous healing (<a onClick="return mV(\'Mat\',9,18);">Mt 9:18</a>; <a onClick="return mV(\'Mar\',8,23);">Mr 8:23</a>; <a onClick="return mV(\'Act\',28,8);">Ac 28:8</a>), or an emblem of the gift of the Holy Spirit and His endowments (<a onClick="return mV(\'Act\',8,\'17-19\');">Ac 8:17-19</a>; <a onClick="return mV(\'Act\',13,3);">13:3</a>; <a onClick="return mV(\'1Ti\',4,14);">1Ti 4:14</a>; <a onClick="return mV(\'2Ti\',1,6);">2Ti 1:6</a>); but it also designates the infliction of cruelty and punishment (<a onClick="return mV(\'Gen\',37,22);">Ge 37:22</a>; <a onClick="return mV(\'Lev\',24,14);">Le 24:14</a>), the imposition of responsibility (<a onClick="return mV(\'Num\',8,10);">Nu 8:10</a>; <a onClick="return mV(\'Deu\',34,9);">De 34:9</a>). Thus also the sins of the people were symbolically transferred upon the goat which was to be sent into the wilderness (<a onClick="return mV(\'Lev\',16,21);">Le 16:21</a>). This act, rabbinical writings declare, was not so much a laying on of hands, as a vigorous pressing. "Lifting up the hand" was a gesture accompanying an oath (<a onClick="return mV(\'Deu\',32,40);">De 32:40</a>) or a blessing pronounced over a multitude (<a onClick="return mV(\'Lev\',9,22);">Le 9:22</a>; <a onClick="return mV(\'Luk\',24,50);">Lu 24:50</a>), a prayer (<a onClick="return mV(\'Psa\',119,48);">Ps 119:48</a>). "To put the hands to the mouth" is indicative of (compulsory) silence (<a onClick="return mV(\'Job\',21,5);">Job 21:5</a>; <a onClick="return mV(\'Job\',40,4);">40:4</a>; <a onClick="return mV(\'Pro\',30,32);">Pr 30:32</a>; <a onClick="return mV(\'Mic\',7,16);">Mic 7:16</a>). To "slack one\'s hand" is synonymous with negligence and neglect (<a onClick="return mV(\'Jos\',10,6);">Jos 10:6</a>), and "to hide or bury the hand in the dish" is descriptive of the slothful, who is tired even at meals (<a onClick="return mV(\'Pro\',19,24);">Pr 19:24</a>; <a onClick="return mV(\'Pro\',26,15);">26:15</a>).<P>2. The Hand as Power:<P>The hand in the sense of power and authority: (compare Assyrian idu, "strength"); <a onClick="return mV(\'Jos\',8,20);">Jos 8:20</a> margin, "They had no hands (the Revised Version (British and American) "power") to flee this way or that way"; <a onClick="return mV(\'Jdg\',1,35);">Jud 1:35</a>, "The hand of the house of Joseph prevailed"; <a onClick="return mV(\'Psa\',76,5);">Ps 76:5</a>, "None of the men of might have found their hands"; <a onClick="return mV(\'Psa\',89,48);">Ps 89:48</a> margin, "shall deliver his soul from the hand (the Revised Version (British and American) "power") of Sheol"; <a onClick="return mV(\'2Ki\',3,15);">2Ki 3:15</a>, "The hand of Yahweh came upon him"; <a onClick="return mV(\'Exd\',14,31);">Ex 14:31</a> margin, "Israel saw the great hand (the Revised Version (British and American) "work") which Yahweh did upon the Egyptians"; <a onClick="return mV(\'Deu\',34,12);">De 34:12</a>, "in all the mighty hand...which Moses wrought in the sight of all Israel."<P>3. The Hand for the Person:<P>The hand used (pars pro toto) for the person: "His hand shall be against every man" (<a onClick="return mV(\'Gen\',16,12);">Ge 16:12</a>). "Slay the priests of Yahweh; because their hand also is with David" (<a onClick="return mV(\'1Sa\',22,17);">1Sa 22:17</a>). "Jonathan went to David into the wood and strengthened his hand in God" (<a onClick="return mV(\'1Sa\',23,16);">1Sa 23:16</a>). In this sense penalty is exacted "from the hand" or "at the hand" of the transgressor (<a onClick="return mV(\'Gen\',9,5);">Ge 9:5</a>; <a onClick="return mV(\'Eze\',33,8);">Eze 33:8</a>).<P>4. Hand, Meaning Side:<P>The hand in the sense of side: "All the side (Hebrew "hand") of the river Jabbok" (<a onClick="return mV(\'Deu\',2,37);">De 2:37</a>); "by the wayside" (Hebrew "by the hand of the way," <a onClick="return mV(\'1Sa\',4,13);">1Sa 4:13</a>). The manuscripts have here the error yakh, for yadh; compare the Hebrew of <a onClick="return mV(\'Psa\',140,5);">Ps 140:5 (Hebrew 6)</a> (leyadh ma\'gal); "On the side (Hebrew "hand") of their oppressors there was power" (<a onClick="return mV(\'Ecc\',4,1);">Ec 4:1</a>); "I was by the side (Hebrew "hand") of the great river" (<a onClick="return mV(\'Dan\',10,4);">Da 10:4</a>).<P>5. English Idiom:<P>Mention must also be made here of the English idiom, "at hand," frequently found in our versions of the Scriptures. In Hebrew and Greek there is no reference to the word "hand," but words designating nearness of time or place are used. The usual word in Hebrew is qarabh, "to be near," and qarobh, "near"; in Greek eggus, "near," and the verb eggizo, "to come near." Rarely other words are used, as enesteken, "has come," the English Revised Version "is now present" (<a onClick="return mV(\'2Th\',2,2);">2Th 2:2</a>), and ephesteken, "is come" (<a onClick="return mV(\'2Ti\',4,6);">2Ti 4:6</a>).<P>Frequently the words refer to the "day" or "coming of the Lord"; still it must not be forgotten that it may often refer to the nearness of God in a local sense, as in <a onClick="return mV(\'Jer\',23,23);">Jer 23:23</a>, "Am I a God at hand, saith Yahweh, and not a God afar off?" and probably in <a onClick="return mV(\'Phl\',4,5);">Php 4:5</a>, "The Lord is at hand," though many, perhaps most, commentators regard the expression as a version of the Aramaic maran atha (<a onClick="return mV(\'1Cr\',16,22);">1Co 16:22</a>). Passages such as <a onClick="return mV(\'Psa\',31,20);">Ps 31:20</a>; <a onClick="return mV(\'Psa\',119,151);">119:151</a>; <a onClick="return mV(\'Mat\',28,20);">Mt 28:20</a> would, however, speak for an interpretation which lays the ictus on the abiding presence of the Lord with the believer.<P>NOTE.—The ancients made a careful distinction of the respective values of the two hands. This is perhaps best seen from <a onClick="return mV(\'Gen\',48,\'13-19\');">Ge 48:13-19</a>, where the imposition of the hands of aged Israel upon the heads of Joseph\'s sons seems unfair to their father, because the left hand is being placed upon the elder, the right hand upon the younger son. The very word euonumos proves the same from the Greek point of view. This word is a euphemistic synonym of aristera, and is used to avoid the unlucky omen the common word may have for the person spoken to. Thus the goats, i.e. the godless, are placed at the left hand of the great Judge, while the righteous appear at His right (<a onClick="return mV(\'Mat\',25,33);">Mt 25:33</a>). We read in <a onClick="return mV(\'Ecc\',10,2);">Ec 10:2</a>, "A wise man\'s heart is at his right hand; but a fool\'s heart at his left," i.e. is inclined to evil. As the Jews orientated themselves by looking toward the rising of the sun (Latin oriens, the east), the left hand represented the north, and the right hand the south (<a onClick="return mV(\'1Sa\',23,19,24);">1Sa 23:19, 24</a>; <a onClick="return mV(\'2Sa\',24,5);">2Sa 24:5</a>). The right hand was considered the more honorable (<a onClick="return mV(\'1Ki\',2,19);">1Ki 2:19</a>; <a onClick="return mV(\'Psa\',45,9);">Ps 45:9</a>); therefore it was given in attestation of a contract, a federation or fellowship (<a onClick="return mV(\'Gal\',2,9);">Ga 2:9</a>). It is the more valuable in battle; a friend or protector will therefore take his place at the right to guard it (<a onClick="return mV(\'Psa\',16,8);">Ps 16:8</a>; <a onClick="return mV(\'Psa\',73,23);">73:23</a>; <a onClick="return mV(\'Psa\',109,31);">109:31</a>; <a onClick="return mV(\'Psa\',110,5);">110:5</a>; <a onClick="return mV(\'Psa\',121,5);">121:5</a>), but the enemy will, for the same reason, try to assail it (<a onClick="return mV(\'Job\',30,12);">Job 30:12</a>; <a onClick="return mV(\'Psa\',109,6);">Ps 109:6</a>; <a onClick="return mV(\'Zec\',3,1);">Zec 3:1</a>). It was also the unprotected side, because the shield was carried on the left arm: hence, the point of danger and honor. The right hand is also the side of power and strength (<a onClick="return mV(\'Psa\',60,5);">Ps 60:5</a>; <a onClick="return mV(\'Psa\',63,8);">63:8</a>; <a onClick="return mV(\'Psa\',108,6);">108:6</a>; <a onClick="return mV(\'Psa\',118,15,16);">118:15-16</a>; <a onClick="return mV(\'Psa\',110,1);">110:1</a>; <a onClick="return mV(\'Mat\',22,44);">Mt 22:44</a>; <a onClick="return mV(\'Mat\',20,21,23);">Mt 20:21, 23</a>). Both hands are mentioned together in the sense of close proximity, intimate association, in <a onClick="return mV(\'Mar\',10,37);">Mr 10:37</a>.``106';
isbe[4068]='Hand Weapon`hand\'-wep\'-un (<a onClick="return mV(\'Num\',35,18);">Nu 35:18</a> the King James Version).`<a href="./study/isbe/search.html?string=ARMOR;+ARMS">ARMOR</a>`1';
isbe[4069]='Handbreadth`hand\'-bredth (Tephach, Tophach, <a onClick="return mV(\'1Ki\',7,26);">1Ki 7:26</a>; <a onClick="return mV(\'2Ch\',4,5);">2Ch 4:5</a>; <a onClick="return mV(\'Psa\',39,5);">Ps 39:5</a>; <a onClick="return mV(\'Exd\',25,25);">Ex 25:25</a>; <a onClick="return mV(\'Exd\',37,12);">37:12</a>; <a onClick="return mV(\'Eze\',40,5,43);">Eze 40:5, 43</a>; <a onClick="return mV(\'Eze\',43,13);">43:13</a>): A Hebrew linear measure containing 4 fingers, or digits, and equal to about 3 inches.`<a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`1';
isbe[4070]='Handful`hand\'-fool: There are five words in Hebrew used to indicate what may be held in the hand, either closed or open.<P>(1) chophen, chophnayim. The fist or closed hand occurs in the dual in <a onClick="return mV(\'Exd\',9,8);">Ex 9:8</a>, where it signifies what can be taken in the two hands conjoined, a double handful.<P>(2) kaph, "hollow of the hand," the palm; an open handful (<a onClick="return mV(\'Lev\',9,17);">Le 9:17</a>; <a onClick="return mV(\'1Ki\',17,12);">1Ki 17:12</a>; <a onClick="return mV(\'Ecc\',4,6);">Ec 4:6</a>).<P>(3) \'amir, "sheaf or bundle." It signifies the quantity of grain a gleaner may gather in his hand (<a onClick="return mV(\'Jer\',9,22);">Jer 9:22 (Hebrew 21)</a>).<P>(4) qomets, "the closed handful" (<a onClick="return mV(\'Gen\',41,47);">Ge 41:47</a>; <a onClick="return mV(\'Lev\',2,2);">Le 2:2</a>; <a onClick="return mV(\'Lev\',5,12);">5:12</a>; <a onClick="return mV(\'Lev\',6,15);">6:15 (Hebrew 6:8)</a>; <a onClick="return mV(\'Num\',5,26);">Nu 5:26</a>).<P>(5) sho\'al, "the hollow of the hand," or what can be held in it (<a onClick="return mV(\'1Ki\',20,10);">1Ki 20:10</a>; <a onClick="return mV(\'Eze\',13,19);">Eze 13:19</a>). In <a onClick="return mV(\'Isa\',40,12);">Isa 40:12</a> it signifies "measure."<P>(6) piccah (<a onClick="return mV(\'Psa\',72,16);">Ps 72:16</a>) is rendered "handful" by the King James Version, but is properly "abundance" as in the Revised Version (British and American).``138';
isbe[4071]='Handicraft`han\'-di-kraft.`<a href="./study/isbe/search.html?string=CRAFTS">CRAFTS</a>`1';
isbe[4072]='Handkerchief`han\'-ker-chif (soudarion): A loan-word from the Latin sudarium, found in plural in <a onClick="return mV(\'Act\',19,12);">Ac 19:12</a>, soudaria; compare sudor, "perspiration"; literally, "a cloth used to wipe off perspiration." Elsewhere it is rendered "napkin" (<a onClick="return mV(\'Luk\',19,20);">Lu 19:20</a>; <a onClick="return mV(\'Jhn\',11,44);">Joh 11:44</a>; <a onClick="return mV(\'Jhn\',20,7);">20:7</a>)`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>; <a href="./study/isbe/search.html?string=NAPKIN">NAPKIN</a>`1';
isbe[4073]='Handle`han\'-d\'-l (kaph): The noun occurs once in <a onClick="return mV(\'Sgs\',5,5);">So 5:5</a>, "handles of the bolt" (the King James Version "lock"). The verb "handle" represents several Hebrew (\'achaz, mashakh, taphas, etc.) and Greek (thiggano, <a onClick="return mV(\'Col\',2,21);">Col 2:21</a>; pselaphao, <a onClick="return mV(\'Luk\',24,39);">Lu 24:39</a>; <a onClick="return mV(\'1Jo\',1,1);">1Joh 1:1</a>) words in the King James Version, but is also sometimes substituted in the Revised Version (British and American) for other renderings in the King James Version, as in <a onClick="return mV(\'Sgs\',3,8);">So 3:8</a> for "hold"; in <a onClick="return mV(\'Luk\',20,11);">Lu 20:11</a>, "handled shamefully," for "entreated shamefully"; in <a onClick="return mV(\'2Ti\',2,15);">2Ti 2:15</a>, "handling aright," for "rightly dividing," etc.``1';
isbe[4074]='Handmaid`hand\'-mad: Which appears often in the Old Testament, but seldom in the New Testament, like bondmaid, is used to translate two Hebrew words (shiphchah, and \'amah) both of which normally mean a female slave. It is used to translate the former word in the ordinary sense of female slave in <a onClick="return mV(\'Gen\',16,1);">Ge 16:1</a>; <a onClick="return mV(\'Gen\',25,12);">25:12</a>; <a onClick="return mV(\'Gen\',29,24,29);">29:24, 29</a>; <a onClick="return mV(\'Pro\',30,23);">Pr 30:23</a>; <a onClick="return mV(\'Jer\',34,11,16);">Jer 34:11, 16</a>; <a onClick="return mV(\'Joe\',2,29);">Joe 2:29</a>; to translate the latter word in <a onClick="return mV(\'Exd\',23,12);">Ex 23:12</a>; <a onClick="return mV(\'Jdg\',19,19);">Jud 19:19</a>; <a onClick="return mV(\'2Sa\',6,20);">2Sa 6:20</a>. It is used as a term of humility and respectful self-depreciation in the presence of great men, prophets and kings, to translate the former word in <a onClick="return mV(\'Rth\',2,13);">Ru 2:13</a>; <a onClick="return mV(\'1Sa\',1,18);">1Sa 1:18</a>; <a onClick="return mV(\'1Sa\',28,21);">28:21</a>; <a onClick="return mV(\'2Sa\',14,6);">2Sa 14:6</a>; <a onClick="return mV(\'2Ki\',4,2,16);">2Ki 4:2, 16</a>; it translates the latter word in the same sense in <a onClick="return mV(\'Rth\',3,9);">Ru 3:9</a>; <a onClick="return mV(\'1Sa\',1,16);">1Sa 1:16</a>; <a onClick="return mV(\'1Sa\',25,24,28,31,41);">25:24, 28, 31, 41</a>; <a onClick="return mV(\'2Sa\',20,17);">2Sa 20:17</a>; <a onClick="return mV(\'1Ki\',1,13,17);">1Ki 1:13, 17</a>; <a onClick="return mV(\'1Ki\',3,20);">3:20</a>. It is also used to express a sense of religious humility in translating the latter word only, and appears in this sense in but three passages, <a onClick="return mV(\'1Sa\',1,11);">1Sa 1:11</a>; <a onClick="return mV(\'Psa\',86,16);">Ps 86:16</a>; <a onClick="return mV(\'Psa\',116,16);">116:16</a>.<P>In the New Testament it occurs 3 times, in a religious sense, as the translation of doule, "a female slave" (<a onClick="return mV(\'Luk\',1,38,48);">Lu 1:38, 48</a>; <a onClick="return mV(\'Act\',2,18);">Ac 2:18</a>), and twice (<a onClick="return mV(\'Gal\',4,22,23);">Ga 4:22-23</a>) as the translation of paidiske, the King James Version "bondmaid."``114';
isbe[4075]='Hands; Hands, Imposition, Laying On of`im-po-zish\'-un (epithesis cheiron, <a onClick="return mV(\'Act\',8,18);">Ac 8:18</a>; <a onClick="return mV(\'1Ti\',4,14);">1Ti 4:14</a>; <a onClick="return mV(\'2Ti\',1,6);">2Ti 1:6</a>; <a onClick="return mV(\'Hbr\',6,2);">Heb 6:2</a>): The act or ceremony of the imposition of hands appears in the Old Testament in various connections: in the act of blessing (<a onClick="return mV(\'Gen\',48,14);">Ge 48:14</a>); in the ritual of sacrifice (hands of the offerer laid on head of victim, <a onClick="return mV(\'Exd\',29,10,15,19);">Ex 29:10, 15, 19</a>; <a onClick="return mV(\'Lev\',1,4);">Le 1:4</a>; <a onClick="return mV(\'Lev\',3,2,8,13);">3:2, 8, 13</a>; <a onClick="return mV(\'Lev\',4,4,24,29);">4:4, 24, 29</a>; <a onClick="return mV(\'Lev\',8,14);">8:14</a>; <a onClick="return mV(\'Lev\',16,21);">16:21</a>); in witness-bearing in capital offenses (<a onClick="return mV(\'Lev\',24,14);">Le 24:14</a>). The tribe of Levi was set apart by solemn imposition of hands (<a onClick="return mV(\'Num\',8,10);">Nu 8:10</a>); Moses appointed Joshua to be his successor by a similar act (<a onClick="return mV(\'Num\',27,18,23);">Nu 27:18, 23</a>; <a onClick="return mV(\'Deu\',34,9);">De 34:9</a>). The idea in these cases varies with the purpose of the act. The primary idea seems to be that of conveyance or transference (compare <a onClick="return mV(\'Lev\',16,21);">Le 16:21</a>), but, conjoined with this, in certain instances, are the ideas of identification and of devotion to God.<P>In the New Testament Jesus laid hands on the little children (<a onClick="return mV(\'Mat\',19,13,15);">Mt 19:13, 15</a> parallel <a onClick="return mV(\'Mar\',10,16);">Mr 10:16</a>) and on the sick (<a onClick="return mV(\'Mat\',9,18);">Mt 9:18</a>; <a onClick="return mV(\'Mar\',6,5);">Mr 6:5</a>, etc.), and the apostles laid hands on those whom they baptized that they might receive the Holy Spirit (<a onClick="return mV(\'Act\',8,17,19);">Ac 8:17, 19</a>; <a onClick="return mV(\'Act\',19,6);">19:6</a>), and in healing (<a onClick="return mV(\'Act\',12,17);">Ac 12:17</a>). Specially the imposition of hands was used in the setting apart of persons to a particular office or work in the church. This is noticed as taking place in the appointment of the Seven (<a onClick="return mV(\'Act\',6,6);">Ac 6:6</a>), in the sending out of Barnabas and Saul (<a onClick="return mV(\'Act\',13,3);">Ac 13:3</a>), at the ordination of Timothy (<a onClick="return mV(\'1Ti\',4,14);">1Ti 4:14</a>; <a onClick="return mV(\'2Ti\',1,6);">2Ti 1:6</a>), but though not directly mentioned, it seems likely that it accompanied all acts of ordination of presbyters and deacons (compare <a onClick="return mV(\'1Ti\',5,22);">1Ti 5:22</a>; <a onClick="return mV(\'Hbr\',6,2);">Heb 6:2</a>). The presbyters could hardly convey what they had not themselves received (<a onClick="return mV(\'1Ti\',1,14);">1Ti 1:14</a>). Here again the fundamental idea is communication. The act of laying on of hands was accompanied by prayer (<a onClick="return mV(\'Act\',6,6);">Ac 6:6</a>; <a onClick="return mV(\'Act\',8,15);">8:15</a>; <a onClick="return mV(\'Act\',13,3);">13:3</a>), and the blessing sought was imparted by God Himself. No ground is afforded by this symbolical action for a sacrament of "Orders."`<a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>; <a href="./study/isbe/search.html?string=MINISTRY">MINISTRY</a>; <a href="./study/isbe/search.html?string=ORDAIN;+ORDINATION">ORDINATION</a>`132';
isbe[4076]='Handstaff`hand\'-staf (maqqkel yadh): In plural in <a onClick="return mV(\'Eze\',39,9);">Eze 39:9</a>, among weapons of war.`<a href="./study/isbe/search.html?string=STAFF">STAFF</a>`1';
isbe[4077]='Handwriting`hand\'-rit-ing.`<a href="./study/isbe/search.html?string=WRITING,+1">WRITING</a>; <a href="./study/isbe/search.html?string=MANUSCRIPTS">MANUSCRIPTS</a>`1';
isbe[4078]='Hanes`ha\'-nez (chanec): Occurs only in <a onClick="return mV(\'Isa\',30,4);">Isa 30:4</a>. The one question of importance concerning this place is its location. It has never been certainly identified. It was probably an Egyptian city, though even that is not certain. Pharaoh, in his selfish haste to make league with the kingdom of Judah, may have sent his ambassadors far beyond the frontier. The language of Isaiah, "Their ambassadors came to Hanes," certainly seems to indicate a place in the direction of Jerusalem from Tanis. This indication is also the sum of all the evidence yet available. There is no real knowledge concerning the exact location of Hanes. Opinions on the subject are little more than clever guesses. They rest almost entirely upon etymological grounds, a very precarious foundation when not supported by historical evidence. The Septuagint has, "For there are in Tanis princes, wicked messengers." Evidently knowing no such place, they tried to translate the name. The Aramaic version gives "Tahpanhes" for Hanes, which may have been founded upon exact knowledge, as we shall see.<P>Hanes has been thought by some commentators to be Heracleopolis Magna, Egyptian Hunensurten, abridged to Hunensu, Copt Ahnes, Hebrew Chanec, Arabic Ahneysa, the capital of the XXth Nome, or province, of ancient Egypt. It was a large city on an island between the Nile and the Bahr Yuseph, opposite the modern town of Beni Suef. The Greeks identified the ram-headed god of the place with Heracles, hence, "Heracleopolis." The most important historical notes in Egypt and the best philological arguments point to this city as Hanes. But the plain meaning of <a onClick="return mV(\'Isa\',30,4);">Isa 30:4</a> points more positively to a city somewhere in the delta nearer to Jerusalem than Tanis (compare Naville\'s cogent argument, "Ahnas el Medineh," 3-4). Dumichen considered the hieroglyphic name of Tahpanhes to be Hens. Knowledge of this as a fact may have influenced the Aramaic rendering, but does not warrant the arbitrary altering of the Hebrew text.``93';
isbe[4079]='Hanging`hang\'-ing (talah, "to hang up," "suspend," <a onClick="return mV(\'2Sa\',21,12);">2Sa 21:12</a>; <a onClick="return mV(\'Deu\',28,66);">De 28:66</a>; <a onClick="return mV(\'Job\',26,7);">Job 26:7</a>; <a onClick="return mV(\'Psa\',137,2);">Ps 137:2</a>; <a onClick="return mV(\'Sgs\',4,4);">So 4:4</a>; <a onClick="return mV(\'Hsa\',11,7);">Ho 11:7</a>): Generally, where the word is used in connection with punishments, it appears to have reference to the hanging of the corpse after execution. We find but two clear instances of death by hanging, i.e. strangulation—those of Ahithophel and Judas (<a onClick="return mV(\'2Sa\',17,23);">2Sa 17:23</a>; <a onClick="return mV(\'Mat\',27,5);">Mt 27:5</a>), and both these were eases of suicide, not of execution. The foregoing Hebrew word is clearly used for "hanging" as a mode of execution in <a onClick="return mV(\'Est\',5,14);">Es 5:14</a>; <a onClick="return mV(\'Est\',6,4);">6:4</a>; <a onClick="return mV(\'Est\',7,9);">7:9</a>ff; <a onClick="return mV(\'Est\',8,7);">8:7</A>; <a onClick="return mV(\'Est\',9,13,14,25);">9:13,14,25</A>; but probably the "gallows" or "tree" (\'ets) was a stake for the purpose of impaling the victim. It could be lowered for this purpose, then raised "fifty cubits high" to arrest the public gaze. The Greek word used in <a onClick="return mV(\'Mat\',27,5);">Mt 27:5</a> is apagchesthai, "to strangle oneself." See HDB, article "Hanging," for an exhaustive discussion.``77';
