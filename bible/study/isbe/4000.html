isbe[4001]='Hagerite`ha\'-ger-it (haghri).`<a href="./study/isbe/search.html?string=HAGRITES">HAGRITES</a>`1';
isbe[4002]='Haggada`ha-ga\'-da`<a href="./study/isbe/search.html?string=TALMUD">TALMUD</a>`1';
isbe[4003]='Haggai`hag\'-a-i, hag\'-a-i (chaggay, an adjective formed from chagh, "feast"):<P>1. Name:<P>The word "Haggai" may mean "festal," the prophet having been born perhaps on a festival day; compare the Roman name "Festus." Hebrew proper names were sometimes formed in this manner, e.g. Barzillai, "a man of iron," from barzel, "iron." Haggai may, however, be a shortened form of Haggiah (<a onClick="return mV(\'1Ch\',6,30);">1Ch 6:30</a>), meaning "festival of Yahweh," as Mattenai is an abbreviation of Mattaniah (<a onClick="return mV(\'Ezr\',10,33);">Ezr 10:33</a>; <a onClick="return mV(\'Ezr\',10,26);">Ezr 10:26</a>). In Greek Haggaios, in Latin, Aggaeus or Aggeus, sometimes Haggaeus. Haggai is the 10th in the order of the Twelve Prophets.<P>2. Personal History:<P>Little is really known of his personal history. But we do know that he lived soon after the captivity, being the first of the prophets of the Restoration. From <a onClick="return mV(\'Hag\',2,3);">Hag 2:3</a> of his prophecies it is inferred by many that he had seen the first temple, which, as we know, was destroyed in 586 BC. If so, he must have prophesied when a comparatively old man, for we know the exact date of his prophecies, 520 BC. According to <a onClick="return mV(\'Ezr\',5,1);">Ezr 5:1</a>; <a onClick="return mV(\'Ezr\',6,14);">6:14</a>, he was a contemporary of Zechariah, and was associated with him in the work of rebuilding the temple; besides, in the Greek and Latin and Syriac VSS, his name stands with Zechariah\'s at the head of certain psalms, e.g. <a onClick="return mV(\'Psa\',111,\'1-\');">Ps 111 (112)</a>, in the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) alone; <a onClick="return mV(\'Psa\',125,\'1-\');">Psalms 125</a>; <a onClick="return mV(\'Psa\',126,\'1-\');">126</a>, in the Peshitta alone; <a onClick="return mV(\'Psa\',137,\'1-\');">Ps 137</a>, in the Septuagint alone; <a onClick="return mV(\'Psa\',146,\'1-\');">Psalms 146</a>; <a onClick="return mV(\'Psa\',147,\'1-\');">147</a>; <a onClick="return mV(\'Psa\',148,\'1-\');">148</a>, in Septuagint and Peshitta; and <a onClick="return mV(\'Psa\',145,\'1-\');">Ps 145</a>, in Septuagint, Peshitta and Vulgate; perhaps these psalms were introduced into the temple-service on their recommendation. He was a prophet of great faith (compare <a onClick="return mV(\'Hag\',2,\'1-5\');">2:1-5</A>); it is possible that he was a priest also (compare <a onClick="return mV(\'Hag\',2,\'10-19\');">2:10-19</A>). Like Malachi he bears the name of "Yahweh\'s messenger" (<a onClick="return mV(\'Hag\',1,13);">Hag 1:13</A>; compare <a onClick="return mV(\'Mal\',3,1);">Mal 3:1</a>). According to Jewish tradition, he was a member of the Great Synagogue.<P>3. Work:<P>Haggai\'s work was intensely practical and important. Yahweh employed him to awaken the conscience and stimulate the enthusiasm of his compatriots in the rebuilding of the temple. "No prophet ever appeared at a more critical juncture in the history of the people, and, it may be added, no prophet was more successful" (Marcus Dods). Zechariah assisted him (compare <a onClick="return mV(\'Hag\',1,1);">Hag 1:1</a>; <a onClick="return mV(\'Zec\',1,1);">Zec 1:1</a>).<P>4. Period and Circumstances:<P>Haggai\'s prophecies, like Ezekiel\'s, are dated "in the second year of Darius" (<a onClick="return mV(\'Hag\',1,1);">Hag 1:1</a>; <a onClick="return mV(\'Hag\',2,10);">2:10</a>), i.e. 520 BC. The Jews, 42,360 strong (<a onClick="return mV(\'Ezr\',2,64);">Ezr 2:64</a>), had returned from Babylon 16 years before (536 BC), under the leadership of Zerubbabel, the civil head of the community, and Joshua, the ecclesiastical. The generous edict of Cyrus had made return possible (compare <a onClick="return mV(\'Ezr\',1,\'1-4\');">Ezr 1:1-4</a>). The new colonists had settled in Jerusalem and in the neighboring towns of Bethlehem, Bethel, Anathoth, Gibeon, Kiriath-jearim, and others adjacent (<a onClick="return mV(\'Ezr\',2,20);">Ezr 2:20</a>). Eager to reestablish the public worship of the sanctuary, they set about at once to erect the altar of burnt offering upon its old site (<a onClick="return mV(\'Ezr\',3,2,3);">Ezr 3:2-3</a>; compare <a onClick="return mV(\'Hag\',2,14);">Hag 2:14</a>). Plans were also made for the immediate rebuilding of the temple, and the foundation stone was actually laid in the 2nd month of the 2nd year of the return (<a onClick="return mV(\'Ezr\',3,\'8-10\');">Ezr 3:8-10</a>), but the work was suddenly interrupted by the jealous, half-caste, semi-pagan Samaritans, descendants of the foreign colonists introduced into Samaria in 722 BC (compare <a onClick="return mV(\'2Ki\',17,\'24-41\');">2Ki 17:24-41</a>), whose offer to cooperate had been refused (<a onClick="return mV(\'Ezr\',4,\'1-5\',24);">Ezr 4:1-5, 24</a>). For 16 years thereafter nothing was done toward rearing the superstructure (<a onClick="return mV(\'Ezr\',4,5,24);">Ezr 4:5, 24</a>; <a onClick="return mV(\'Ezr\',5,16);">5:16</a>); indeed, the Jews became indifferent, and began to build for themselves "ceiled houses" (<a onClick="return mV(\'Hag\',1,4);">Hag 1:4</a>). (W. H. Kosters has attempted to show that there was no return under Cyrus, and that Haggai and Zechariah, who never allude to any return, but rather look upon the return as still in the future (compare <a onClick="return mV(\'Zec\',2,6,7);">Zec 2:6-7</a>), preached to the Jews who remained in Jerusalem, never having been carried by Nebuchadnezzar into captivity in 586 BC. But this theory is opposed by too many converging lines of Scriptural statement to warrant serious credence.) With the accession of Darius Hystaspes (i.e. Darius, the son of Hystaspes), the tide turned. Darius was a true successor to Cyrus, and favored religious freedom. Through the influence of the prophets Haggai and Zechariah, the people were roused from their lethargy, and the work of rebuilding was resumed with energy in 520 BC (<a onClick="return mV(\'Hag\',1,14,15);">Hag 1:14-15</a>). The foundations were relaid (<a onClick="return mV(\'Hag\',2,18);">Hag 2:18</a>). Four years later, in the 6th year of Darius, the whole structure was completed and dedicated (<a onClick="return mV(\'Ezr\',6,15);">Ezr 6:15</a>). Meanwhile important events were taking place in the Persian empire. On the death (of Cambyses in 522 BC, the throne had been seized by a usurper, the so-called Pseudo-Smerdis, who held it, however, for some 7 months only. He was murdered by Darius, and the latter was elevated to the throne. But this gave other ambitious pretenders cause to rebel, and many provinces revolted, among them Susiana, Media, Assyria, Armenia, Parthia, and others (compare the famous Behistun inscription). Altogether Darius fought 19 battles in putting down his rivals, and did not succeed in vanquishing all of his foes till the year after Haggai prophesied. This accounts for the prophet\'s repeated allusions to Yahweh\'s "shaking" the nations (<a onClick="return mV(\'Hag\',2,6,7,21,22);">2:6,7,21,22</a>). Haggai seems to regard the "shaking" of the nations as the precursor of the Messianic age. It was, therefore, important from the prophet\'s point of view, that Yahweh\'s temple should be made ready for the Messiah\'s advent, that it might become the religious center of the world (compare <a onClick="return mV(\'Isa\',2,\'2-4\');">Isa 2:2-4</a>). The exact date of Haggai\'s preaching was from September to December, 520 BC.<P>5. Analysis:<P>Haggai\'s prophecies are dated and therefore easily analyzed. They are composed of four distinct discourses, all four being delivered within 4 months\' time in the year 520 BC:<P>(1) <a onClick="return mV(\'Hag\',1,\'1-\');">Hag 1</a>, delivered on the 1st day of the 6th month (September), in which the prophet reproaches the people for their indifference to the work of rebuilding the temple, and warns them to consider their ways; assuring them that their procrastination was not due to want of means (<a onClick="return mV(\'Hag\',1,4);">1:4</A>), and that God on account of their apathy was withholding the produce of the field (<a onClick="return mV(\'Hag\',1,10);">1:10</a>). The effect of this appeal was that 24 days later, all the people, including Zerubbabel and Joshua, began the work of reconstruction (<a onClick="return mV(\'Hag\',1,14,15);">1:14,15</a>).<P>(2) <a onClick="return mV(\'Hag\',2,\'1-9\');">Hag 2:1-9</a>, delivered on the 21st day of the 7th month (October), which was about one month after the work had been resumed, and containing a note of encouragement to those who felt that the new structure was destined to be so much inferior to Solomon\'s temple. The prophet, on the contrary, assures them that the latter glory of the new house shall eclipse that of Solomon\'s magnificent temple, for soon a great "shaking" on Yahweh\'s part among the nations will usher in the Messianic age, and the precious things of all nations will flow in to beautify it (compare <a onClick="return mV(\'Hbr\',12,\'26-28\');">Heb 12:26-28</a>).<P>(3) <a onClick="return mV(\'Hag\',2,\'10-19\');">Hag 2:10-19</a>, delivered on the 24th day of the 9th month (December) which was exactly 3 months after the building had been resumed, and containing, like the first discourse, a rebuke to the people because of their indifference and inertia. The discourse is couched in the form of a parable (<a onClick="return mV(\'Hag\',2,\'11-14\');">2:11-14</a>), by means of which the prophet explains why the prayers of the people go unanswered. It is because they have so long postponed the completion of the temple; a taint of guilt vitiates everything they do, and blasting and mildew and hail, and consequently unfruitful seasons, are the result. On the other hand, if they will but press forward with the work, Yahweh will again bless them, and fruitful seasons will follow their revived zeal (<a onClick="return mV(\'Hag\',2,19);">2:19</a>; compare <a onClick="return mV(\'Zec\',8,\'9-12\');">Zec 8:9-12</a>).<P>(4) <a onClick="return mV(\'Hag\',2,\'20-23\');">Hag 2:20-23</a>, delivered on the 24th day of the 9th month, the very same day as that on which the discourse in <a onClick="return mV(\'Hag\',2,\'10-19\');">2:10-19</a> was delivered. The sequence is immediate. For when Yahweh "shakes" the nations, He will establish Zerubbabel, the representative of the Davidic dynasty and the object of patriotic hopes. When the heathen powers are overthrown, Zerubbabel will stand unshaken as Yahweh\'s honored and trusted vicegerent, and as the precious signet on Yahweh\'s hand (compare <a onClick="return mV(\'Jer\',22,24);">Jer 22:24</a>; <a onClick="return mV(\'Sgs\',8,6);">So 8:6</a>).<P>6. Message:<P>The most striking feature in Haggai\'s message is its repeated claim of Divine origin: 5 times in the 38 verses of his prophecies, he tells us that "the word of Yahweh came" unto him (<a onClick="return mV(\'Hag\',1,1,3);">Hag 1:1, 3</a>; <a onClick="return mV(\'Hag\',2,1,10,20);">2:1, 10, 20</a>); 4 times, also, he used the formula, "Thus saith Yahweh of hosts" (<a onClick="return mV(\'Hag\',1,2,5,7);">1:2, 5, 7</a>; <a onClick="return mV(\'Hag\',2,11);">2:11</a>); 5 times "saith Yahweh of hosts" (<a onClick="return mV(\'Hag\',1,9);">1:9</A>; <a onClick="return mV(\'Hag\',2,6,7,9,23);">2:6, 7, 9, 23</a>); and 4 times simply "saith Yahweh" (<a onClick="return mV(\'Hag\',1,13);">1:13</A>; <a onClick="return mV(\'Hag\',2,4,14,17);">2:4,14,17</A>). Altogether he uses the exalted phrase "Yahweh of hosts" 14 times, besides 19 repetitions of the single but ineffable name "Yahweh." The most striking sentence in all his prophecies is probably that found in <a onClick="return mV(\'Hag\',1,13);">1:13</A>, "Then spake Haggai, Yahweh\'s messenger in Yahweh\'s message unto the people." His single purpose, as we have above seen, was to encourage the building of the temple. This he seems to have regarded as essential to the purity of Israel\'s religion. His key-exhortation is "Consider your ways" (<a onClick="return mV(\'Hag\',1,5,7);">1:5, 7</a>; compare <a onClick="return mV(\'Hag\',2,15,18);">2:15,18</A>). His prophecies reflect the conditions of his age. He points to judgments as a proof of the Divine displeasure (<a onClick="return mV(\'Hag\',1,9,10);">1:9,10</a>; <a onClick="return mV(\'Hag\',2,\'15-19\');">2:15-19</a>). Unlike the earlier prophets, he does not denounce idolatry; but like his contemporary, Zechariah, and his successor, Malachi, he does lay stress on the external side of religion. Chief interest centers in the somewhat unusual parable contained in <a onClick="return mV(\'Hag\',2,\'10-19\');">Hag 2:10-19</a>, which teaches that holiness is not contagious, but that evil is. "The faint aroma of sanctity coming from their altar and sacrifices was too feeble to pervade the secular atmosphere of their life" (A. B. Davidson, Exile and Restoration, 82). Haggai argues that Israel\'s sacrifices for 16 years had been unclean in God\'s sight, and had brought them no blessing, because they had left the temple in ruins; and, that while a healthy man cannot give his health to another by touching him, a sick man may easily spread contagion among all those about him. The thought is suggestive. Haggai may or may not have been a priest, "but in so short a prophecy this elaborate allusion to ritual is very significant." Another very striking thought in Haggai\'s book is his reference to Zerubbabel as Yahweh\'s "servant" and "signet," whom Yahweh has "chosen" (<a onClick="return mV(\'Hag\',2,23);">2:23</A>). Wellhausen regards these words as an equivalent to making Zerubbabel the Messiah; but it is enough to think that the prophet is attempting only to restore him to the honorable position from which his grandfather, Jehoiachin, in <a onClick="return mV(\'Jer\',22,24);">Jer 22:24</a>, had been degraded. Thus would the prophet link Zerubbabel, the political hope of the post-exilic congregation, to the royal line of Judah. Isaiah speaks of Cyrus in similar terms without any Messianic implication (<a onClick="return mV(\'Isa\',44,28);">Isa 44:28</a>; <a onClick="return mV(\'Isa\',45,1);">45:1</a>). On the other hand, the implicit Messianic import of <a onClick="return mV(\'Hag\',2,7,8);">Hag 2:7-8</a> is recognized on all sides.<P>7. Style:<P>Haggai\'s style is suited to the contents of his prophecies. While he is less poetical than his predecessors, yet parallelism is not altogether wanting in his sentence (<a onClick="return mV(\'Hag\',2,8);">Hag 2:8</a>). Compared with the greater books of prophecy, his brief message has been declared "plain and unadorned," "tame and prosaic"; yet it must be acknowledged that he is not wanting in pathos when he reproves, or in force when he exhorts. Though he labors under a poverty of terms, and frequently repeats the same formulas, yet he was profoundly in earnest, and became the most successful in his purpose of all his class. He was especially fond of interrogation. At best we have only a summary, probably, of what he actually preached.<P>8. Criticism:<P>The critical questions involved in Haggai\'s case are not serious: <a onClick="return mV(\'Hag\',2,5);">Hag 2:5a</a>, for example, is wanting in the Septuagint; to <a onClick="return mV(\'Hag\',2,4);">2:14</a> the Septuagint adds from <a onClick="return mV(\'Amo\',5,10);">Am 5:10</a>; <a onClick="return mV(\'Amo\',5,17);">5:17</a> is very similar to, and seems dependent on, <a onClick="return mV(\'Amo\',4,9);">Am 4:9</a>; <a onClick="return mV(\'Amo\',1,7);">1:7b</a> and <a onClick="return mV(\'Amo\',1,13);">13</A>, are rejected by some as later interpolations; while Klostermann and Marti hold that the book as a whole was not written by Haggai at all, but rather about his prophetic activity, a perfectly gratuitous assumption without any substantial proof in its favor.<P>LITERATURE.<P>Driver, New Century Bible, "The Minor Prophets," II, 1906; LOT, 1909; G. A. Smith, Expositor\'s Bible, "The Twelve Prophets," II, 1898; E. B. Pusey, The Minor Prophets, II, 1878; M. Dods, "Handbooks for Bible Classes," Hag, Zec, Mal; J. Wellhausen, Die kleinen Propheten ubersetzt u. erklart, 1898; W. Nowack, Die kleinen Propheten ubersetzt u. erklart, 1905; K. Marti, Dodekapropheton erklart, 1904; H. G. Mitchell, ICC, 1912.``152';
isbe[4004]='Haggeri`hag\'-e-ri.`<a href="./study/isbe/search.html?string=HAGRI">HAGRI</a>`1';
isbe[4005]='Haggi`hag\'-i (chaggi, "festive"): The second son of Gad (<a onClick="return mV(\'Gen\',46,16);">Ge 46:16</a>; <a onClick="return mV(\'Num\',26,15);">Nu 26:15</a>). The latter refers to his descendants as Haggites, of whom nothing else is known.``1';
isbe[4006]='Haggiah`ha-gi\'-a (chaggiyah, "feast of Yah"): Named in <a onClick="return mV(\'1Ch\',6,30);">1Ch 6:30</a> as among the descendants of Levi.``1';
isbe[4007]='Haggites`hag\'-its.`<a href="./study/isbe/search.html?string=HAGGI">HAGGI</a>`1';
isbe[4008]='Haggith`hag\'-ith (chaggith, "festal"): According to <a onClick="return mV(\'2Sa\',3,4);">2Sa 3:4</a>; <a onClick="return mV(\'1Ki\',1,5,11);">1Ki 1:5, 11</a>; <a onClick="return mV(\'1Ki\',2,13);">2:13</a>; <a onClick="return mV(\'1Ch\',3,2);">1Ch 3:2</a>, the fifth wife of David and the mother of his fourth son, Adonijah. The latter was born in Hebron while David\'s capital was there (<a onClick="return mV(\'2Sa\',3,4,5);">2Sa 3:4-5</a>).``1';
isbe[4009]='Hagia`ha\'-gi-a.`<a href="./study/isbe/search.html?string=AGIA">AGIA</a>`1';
isbe[4010]='Hagiographa`hag-i-og\'-ra-fa.`<a href="./study/isbe/search.html?string=BIBLE,+THE,+I-III">BIBLE</a>; <a href="./study/isbe/search.html?string=CANON+OF+THE+OLD+TESTAMENT,+I">CANON OF THE OLD TESTAMENT</a>`1';
isbe[4011]='Hagri`hag\'-ri (haghri, "wanderer"; the King James Version Haggeri): The father of Mibhar, one of the "mighty men" who rallied round David during his foreign wars. Mentioned only in <a onClick="return mV(\'1Ch\',11,38);">1Ch 11:38</a>, whose parallel passage, <a onClick="return mV(\'2Sa\',23,36);">2Sa 23:36</a>, gives, instead, the name "Bani the Gadite."``1';
isbe[4012]='Hagrites`hag\'-rits (haghri\'im): An Arab tribe, or confederation of tribes (<a onClick="return mV(\'1Ch\',5,10,19,20);">1Ch 5:10, 19-20</a> the King James Version "Hagarites"; <a onClick="return mV(\'1Ch\',27,31);">1Ch 27:31</a> the King James Version "Hagerite"; <a onClick="return mV(\'Psa\',83,6);">Ps 83:6</a> "Hagarenes"), against which the Reubenites fought in the days of Saul. In <a onClick="return mV(\'Gen\',25,\'12-18\');">Ge 25:12-18</a> are recorded the descendants, "generations," of Ishmael, "whom Hagar the Egyptian Sarah\'s handmaid, bare unto Abraham." Two, and possibly three, of these tribes, Jetur, Naphish and Kedemah (<a onClick="return mV(\'Gen\',25,15);">25:15</A>), appear to be identical with the 3 tribes whom the Reubenites and the other Israelite tribes east of the Jordan conquered and dispossessed (<a onClick="return mV(\'1Ch\',5,\'1-\');">1Ch 5</a>). The correspondence of names in Genesis and 1 Chronicles leaves little doubt that "Hagrite" is a generic term roughly synonymous with "Ishmaelite," designating the irregular and shifting line of desert tribes stretching along the east and south of Palestine. Those "east of Gilead," "Jetur, Naphish and Nodah," were overcome by Reuben: "The Hagrites were delivered into their hand, and all that were with them....And they took away their cattle...they dwelt in their stead until the captivity" (<a onClick="return mV(\'1Ch\',5,\'20-22\');">1Ch 5:20-22</a>).<P>These along with other Arab tribes are mentioned in the inscriptions of Tiglath-pileser III (745-727 BC). Jetur gave his name to the Itureans of Roman times, who were famed soldiers dwelling in Anti-Libanus. Compare Curtis, Commentary on Chronicles; Skinner, "Gen," ICC, in the place cited.``109';
isbe[4013]='Ha-Hiroth`ha-hi\'-roth.`<a href="./study/isbe/search.html?string=PI+HAHIROTH">PI-HAHIROTH</a>`1';
isbe[4014]='Hai`ha\'-i (ha-\'ay, "the heap"): <a onClick="return mV(\'Gen\',12,8);">Ge 12:8</a>; <a onClick="return mV(\'Gen\',13,3);">13:3</a> the King James Version; the Revised Version (British and American) <a href="study/isbe/search.html?string=AI">AI</a> (which see).``1';
isbe[4015]='Hail (1)`hal (baradh; chalaza):<P>1. Its Occurrence:<P>Hail usually falls in the spring or summer during severe thunder storms. Hailstones are made up of alternate layers of ice and snow, and sometimes reach considerable size, causing great damage by their fall. Upward currents of air carry up raindrops already formed to the colder regions above, where they freeze, and as they again pass through layers of cloud, their bulk increases until, too heavy to be carried by the current, they fall to the ground. Hailstorms, like thunder storms, occur in narrow belts a few miles in breadth and are of short duration. Almost without exception they occur in the daytime. If they take place before the time of harvest they do great damage to grain and fruit, and in extreme cases have injured property and endangered life.<P>2. In Syria:<P>Hailstorms, while by no means common in Syria and Palestine, are not unusual and are of great severity. They occasionally take place in Egypt. Within a few years hailstones of unusual size fell in Port Said, breaking thousands of windows.<P>3. Biblical Instances:<P>(1) The plague of hail (<a onClick="return mV(\'Exd\',9,\'23-24\');">Ex 9:23-24</a>; <a onClick="return mV(\'Psa\',78,47);">Ps 78:47</a>), which was a local storm, as they usually are, falling on the Egyptians and not striking the children of Israel in Goshen. It was of great severity. "There was hail, and fire mingled with the hail, very grievous, such as had not been in all the land of Egypt since it became a nation" (<a onClick="return mV(\'Exd\',9,24);">Ex 9:24</a>). It took place in January, for the barley "was in the ear, and the flax was in bloom" (<a onClick="return mV(\'Exd\',9,31);">Ex 9:31</a>), and caused great damage.<P>(2) After the battle with the Amorites at Gibeon, "Yahweh cast down great stones from heaven upon them unto Azekah, and they died: they were more who died with the hailstones than they whom the children of Israel slew with the sword" (<a onClick="return mV(\'Jos\',10,11);">Jos 10:11</a>).<P>4. As Punishment:<P>Hail is often spoken of as a means of punishing the wicked: "As a tempest of hail...will he cast down" (<a onClick="return mV(\'Isa\',28,2);">Isa 28:2</a>); "The hail shall sweep away the refuge of lies" (<a onClick="return mV(\'Isa\',28,17);">Isa 28:17</a>); and as symbols of God\'s anger: "I will rain...great hailstones, fire, and brimstone" (<a onClick="return mV(\'Eze\',38,22);">Eze 38:22</a>); "There shall be...great hailstones in wrath to consume it" (<a onClick="return mV(\'Eze\',13,13);">Eze 13:13</a>; compare <a onClick="return mV(\'Isa\',30,30);">Isa 30:30</a>; <a onClick="return mV(\'Hag\',2,17);">Hag 2:17</a>; <a onClick="return mV(\'Rev\',8,7);">Re 8:7</a>; <a onClick="return mV(\'Rev\',11,19);">11:19</a>; <a onClick="return mV(\'Rev\',16,21);">16:21</a>).<P>5. God\'s Power:<P>Yahweh\'s power and wisdom are shown in controlling the hail: "Hast thou seen the treasuries of the hail?" (<a onClick="return mV(\'Job\',38,22);">Job 38:22</a>); "Fire and hail, snow and vapor...fulfilling his word" (<a onClick="return mV(\'Psa\',148,8);">Ps 148:8</a>).``85';
isbe[4016]='Hail (2)`hal: Interjection, found only in the Gospels as the translation of chaire, chairete, imp. of chairo, "to rejoice," is used as a greeting or salutation. The word "Hail" is Old English and was formerly an adjective, used with the verb to be, meaning "well," "sound," "hale," e.g. "Hale be thou." Wycliff has "heil" without the verb, followed by other English VSS, except that the Geneva has "God save thee," in <a onClick="return mV(\'Mat\',26,49);">Mt 26:49</a>; <a onClick="return mV(\'Mat\',28,9);">28:9</a>. The word occurs in <a onClick="return mV(\'Mat\',26,49);">Mt 26:49</a>; <a onClick="return mV(\'Mat\',27,29);">27:29</a>; <a onClick="return mV(\'Mat\',28,9);">28:9</a>, "all hail"; <a onClick="return mV(\'Mar\',15,18);">Mr 15:18</a>; <a onClick="return mV(\'Luk\',1,28);">Lu 1:28</a>; <a onClick="return mV(\'Jhn\',19,3);">Joh 19:3</a>.`<a href="./study/isbe/search.html?string=GODSPEED">GODSPEED</a>; <a href="./study/isbe/search.html?string=GREETING">GREETING</a>`1';
isbe[4017]='Hair`har (se\'ar, sa\'ar, Aramaic se\'ar, and their derivatives; thrix, gen. case trichos, kome):<P>1. Hair Fashions:<P>Hair was worn in different fashions by the Orientals of Biblical times, and not always in the same way among the same people in different epochs. We know this clearly from Egyptian literature and monuments, as well as from the writings of Greek authors (especially Herodotus), that the dwellers on the Nile had their heads shaved in early youth, leaving but a side lock until maturity was attained, when this mark of childhood was taken away. Priests and warriors kept their heads closely shaved; nothing but the exigencies of arduous warfare were allowed to interfere with this custom. On the other hand, the Hebrew people, like their Babylonian neighbors (Herod. i.195), affected long and well-cared-for, bushy curls of hair as emblems of manly beauty. Proofs thereof are not infrequent in the Scriptures and elsewhere. Samson\'s (<a onClick="return mV(\'Jdg\',16,13,19);">Jud 16:13, 19</a>) and Absalom\'s (<a onClick="return mV(\'2Sa\',14,26);">2Sa 14:26</a>) long luxuriant hair is specially mentioned, and the Shulammite sings of the locks of her beloved which are "bushy (the Revised Version, margin "curling"), and black as a raven" (<a onClick="return mV(\'Sgs\',5,11);">So 5:11</a>). Josephus (Ant., VIII, vii, 3 (185)) reports that Solomon\'s body-guard was distinguished by youthful beauty and "luxuriant heads of hair." In the history of Samson we read of "the seven locks of his head" (<a onClick="return mV(\'Jdg\',16,19);">Jud 16:19</a>). It is likely that the expression signifies the plaits of hair which are even now often worn by the young Bedouin warrior of the desert.<P>2. Hair in Idol Worship:<P>It is well known that among the surrounding heathen nations the hair of childhood or youth was often shaved and consecrated at idolatrous shrines (compare Herod. ii.65 for Egypt). Frequently this custom marked an initiatory rite into the service of a divinity (e.g. that of Orotal (Bacchus) in Arabia, Herod. iii.8). It was therefore an abomination of the Gentiles in the eyes of the Jew, which is referred to in <a onClick="return mV(\'Lev\',19,27);">Le 19:27</a>; <a onClick="return mV(\'Jer\',9,26);">Jer 9:26</a>; <a onClick="return mV(\'Jer\',25,23);">25:23</a>; <a onClick="return mV(\'Jer\',49,32);">49:32</a>. The Syriac version of the latter passage renders, "Ye shall not let your hair grow long" (i.e. in order to cut it as a religious rite in honor of an idol). It is, however, probable that among the Jews, as now among many classes of Mohammedans, the periodical cropping of the hair, when it had become too cumbersome, was connected with some small festivity, when the weight of the hair was ascertained, and its weight in silver was given in charity to the poor. At least, the weighing of Absalom\'s hair (<a onClick="return mV(\'2Sa\',14,26);">2Sa 14:26</a>) may be referred to some such custom, which is not unparalleled in other countries. The use of balances in connection with the shaving-off of the hair in <a onClick="return mV(\'Eze\',5,1);">Eze 5:1</a> is certainly out of the common. See illustration, "Votive Offering," on p. 1302.<P>3. The Nazirite Vow:<P>We may also compare the shaving of the head of the Nazirite to these heathen practices, though the resemblance is merely superficial. The man who made a vow to God was responsible to Him with his whole body and being. Not even a hair was to be injured willfully during the whole period of the vow, for all belonged to God. The conclusion of the Nazirite vow was marked by sacrifices and the shaving of the head at the door of the sanctuary (<a onClick="return mV(\'Num\',6,\'1-21\');">Nu 6:1-21</a>), indicative of a new beginning of life. The long untouched hair was therefore considered as the emblem of personal devotion (or devotedness) to the God of all strength. Thus it was an easy step to the thought that in the hair was the seat of strength of a Samson (<a onClick="return mV(\'Jdg\',16,17,20);">Jud 16:17, 20</a>). God has numbered the very hairs of the head (<a onClick="return mV(\'Mat\',10,30);">Mt 10:30</a>; <a onClick="return mV(\'Luk\',12,7);">Lu 12:7</a>), which to human beings conveys the idea of the innumerableness (<a onClick="return mV(\'Psa\',40,12);">Ps 40:12</a>; <a onClick="return mV(\'Psa\',69,4);">69:4</a>). What God can number, He can also protect, so that not even a hair of the head might "fall to the earth" or "perish." These phrases express complete safety (<a onClick="return mV(\'1Sa\',14,45);">1Sa 14:45</a>; <a onClick="return mV(\'2Sa\',14,11);">2Sa 14:11</a>; <a onClick="return mV(\'1Ki\',1,52);">1Ki 1:52</a>; <a onClick="return mV(\'Luk\',21,18);">Lu 21:18</a>; <a onClick="return mV(\'Act\',27,34);">Ac 27:34</a>).<P>4. Later Fashions:<P>In New Testament times, especially in the Diaspora, the Jews frequently adopted the fashion of the Romans in cropping the hair closely (<a onClick="return mV(\'1Cr\',11,14);">1Co 11:14</a>); still the fear of being tainted by the idolatrous practice of the heathen, which is specially forbidden in <a onClick="return mV(\'Lev\',21,5);">Le 21:5</a>, was so great that the side locks remained untouched and were permitted to grow ad libitum. This is still the custom among the Jews of Eastern Europe and the Orient.<P>See also <a href="study/isbe/search.html?string=HEAD">HEAD</a>.<P>5. Woman\'s Hair:<P>If Hebrew men paid much attention to their hair, it was even more so among Hebrew women. Long black tresses were the pride of the Jewish maiden and matron (<a onClick="return mV(\'Sgs\',7,5);">So 7:5</a>; <a onClick="return mV(\'Jhn\',11,2);">Joh 11:2</a>; <a onClick="return mV(\'1Cr\',11,5,6,15);">1Co 11:5-6, 15</a>), but many of the expressions used in connection with the "coiffures" of women do not convey to us more than a vague idea. The "locks" of the King James Version in <a onClick="return mV(\'Sgs\',4,1,3);">So 4:1,3</a>; <a onClick="return mV(\'Sgs\',6,7);">6:7</a>; <a onClick="return mV(\'Isa\',47,2);">Isa 47:2</a> (tsemmah) probably do not refer to the hair, but should be translated (as does the Revised Version (British and American), which follows the Septuagint) by "veil." dallah (<a onClick="return mV(\'Sgs\',7,5);">So 7:5</a>), signifies the slender threads which represent the unfinished web in the loom (compare <a onClick="return mV(\'Isa\',38,12);">Isa 38:12</a>), and thence the flowing hair of women (the Revised Version (British and American) "hair"). rehatim (the Revised Version (British and American) "tresses"), in the same verse of the So of Songs means literally the "gutters" at which the flocks were watered (compare <a onClick="return mV(\'Gen\',30,38,41);">Ge 30:38, 41</a>), and thus the long plaits of the maiden with which the lover toys and in which he is held captive. The braiding or dressing of woman\'s hair is expressed in <a onClick="return mV(\'2Ki\',9,30);">2Ki 9:30</a> and Judith 10:3. In New Testament times Christian women are warned against following the fashionable world in elaborate hairdressing (<a onClick="return mV(\'1Ti\',2,9);">1Ti 2:9</a>; <a onClick="return mV(\'1Pe\',3,3);">1Pe 3:3</a>).<P>6. Barbers:<P>The care of the hair, especially the periodical cutting of the same, early necessitated the trade of the barber. The Hebrew word gallabh is found in <a onClick="return mV(\'Eze\',5,1);">Eze 5:1</a>, and the plural form of the same word occurs in an inscription at Citium (Cyprus) (CIS, 1586), where the persons thus described clearly belonged to the priests or servants of a temple.<P>See <a href="study/isbe/search.html?string=BARBER">BARBER</A>.<P>7. Ointments:<P>Numerous were the cosmetics and ointments applied to the hair (<a onClick="return mV(\'Ecc\',9,8);">Ec 9:8</a>; <a onClick="return mV(\'Mat\',6,17);">Mt 6:17</a>; perhaps <a onClick="return mV(\'Rth\',3,3);">Ru 3:3</a>), but some, reserved for sacramental purposes, were prohibited for profane use (<a onClick="return mV(\'Exd\',30,32);">Ex 30:32</a>; <a onClick="return mV(\'Psa\',133,2);">Ps 133:2</a>). Such distinction we find also in Egypt, where the walls of temple laboratories were inscribed with extensive recipes of such holy oils, while the medical papyri (see especially Papyrus Ebers, plates 64-67) contain numerous ointments for the hair, the composition of some of which is ascribed to a renowned queen of antiquity. Even Greek and Roman medical authors have transmitted to us the knowledge of some such prescriptions compounded, it is said, by Queen Cleopatra VI of Egypt, the frivolous friend of Caesar and Antony (see my dissertation, Die uber die medicinischen Kenntnisse der alten Aegypter berichtenden Papyri, ere, Leipzig,1888,121-32). We know from Josephus (Ant., XVI, viii, 1 (233)), that Herod the Great, in his old age, dyed his hair black, a custom, however, which does not appear to be specifically Jewish, as hair-dyes as well as means for bleaching the hair were well known in Greece and Rome. It is certain that the passage <a onClick="return mV(\'Mat\',5,36);">Mt 5:36</a> would not have been spoken, had this been a common custom in the days of the Lord. A special luxury is mentioned by Josephus (Ant., VIII, vii, 3 (185)), who states that the young men who formed the body-guard of King Solomon were in the habit, on festive occasions, of sprinkling their long hair with gold-dust (psegma chrusou).<P>For the Jews the anointing of the head was synonymous with joy and prosperity (compare <a onClick="return mV(\'Psa\',23,5);">Ps 23:5</a>; <a onClick="return mV(\'Psa\',92,10);">92:10</a>; <a onClick="return mV(\'Hbr\',1,9);">Heb 1:9</a>; compare also "oil of joy," <a onClick="return mV(\'Isa\',61,3);">Isa 61:3</a>, and "oil of gladness," <a onClick="return mV(\'Psa\',45,7);">Ps 45:7</a>). It was also, like the washing of feet, a token of hospitality (<a onClick="return mV(\'Psa\',23,5);">Ps 23:5</a>; <a onClick="return mV(\'Luk\',7,46);">Lu 7:46</a>).<P>On the contrary, it was the custom in times of personal or national affliction and mourning to wear the hair unanointed and disheveled, or to cover the head with dust and ashes (<a onClick="return mV(\'2Sa\',14,2);">2Sa 14:2</a>; <a onClick="return mV(\'Jos\',7,6);">Jos 7:6</a>; <a onClick="return mV(\'Job\',2,12);">Job 2:12</a>), or to tear the hair or to cut it off (<a onClick="return mV(\'Ezr\',9,3);">Ezr 9:3</a>; <a onClick="return mV(\'Neh\',13,25);">Ne 13:25</a>; <a onClick="return mV(\'Jer\',7,29);">Jer 7:29</a>).<P>8. Symbolical Use of Word:<P>We have referred to the thickness of hair which supplied the Hebrew with a suitable expression for the conception "innumerable." Hair is also expressive of minuteness; thus the 700 left-handed men of Benjamin were able to "sling stones at a hairbreadth, and not miss" (<a onClick="return mV(\'Jdg\',20,16);">Jud 20:16</a>). Gray hairs and the hoary white of old age were highly honored by the Jews (<a onClick="return mV(\'Pro\',16,31);">Pr 16:31</a>; <a onClick="return mV(\'Pro\',20,29);">20:29</a>; 2Macc 6:23). Besides expressing old age (<a onClick="return mV(\'Isa\',46,4);">Isa 46:4</a>), they stand for wisdom (The <span class="noTag">Wisdom of Solomon 4:9 (10)</span>). Sometimes white hair is the emblem of a glorious, if not Divine, presence (<a onClick="return mV(\'Dan\',7,9);">Da 7:9</a>; 2Macc 15:13; <a onClick="return mV(\'Rev\',1,14);">Re 1:14</a>). Calamity befalling the gray-headed was doubly terrible (<a onClick="return mV(\'Gen\',42,38);">Ge 42:38</a>; <a onClick="return mV(\'Gen\',44,29);">44:29</a>). The "hair of the flesh" is said to "stand up" (<a onClick="return mV(\'Job\',4,15);">Job 4:15</a>; Sirach 27:14) when sudden terror or fear takes hold of a person. The symbolical language of <a onClick="return mV(\'Isa\',7,20);">Isa 7:20</a> uses the "hair of the feet" (see <a href="study/isbe/search.html?string=FEET">FEET</A>) and "the beard" as synonymous with "the humble" and the "mighty of the people."<P>Camel\'s hair (<a onClick="return mV(\'Mat\',3,4);">Mt 3:4</a>; <a onClick="return mV(\'Mar\',1,6);">Mr 1:6</a>) is mentioned in connection with the description of John the Baptist\'s raiment. It represents, according to Jerome, a rough shirt worn under the coat or wrapper, though a rather soft fabric is produced in Arabia from the finer wool of the camel.<P>Goat\'s hair was the material of a cloth used for wearing apparel and for a more or less waterproof covering of tents and bundles. It is the black tent-cloth of Kedar\' (<a onClick="return mV(\'Sgs\',1,5);">So 1:5</a>; <a onClick="return mV(\'Exd\',26,7);">Ex 26:7</a>; <a onClick="return mV(\'Exd\',36,14);">36:14</a>). In New Testament times it was the special product of Paul\'s native province, Cilicia, whence its name cilicium, and its manufacture formed the apostle\'s own trade (<a onClick="return mV(\'Act\',18,3);">Ac 18:3</a>). It is also mentioned as a material for stuffing pillows (<a onClick="return mV(\'1Sa\',19,13);">1Sa 19:13</a>).`<a href="./study/isbe/search.html?string=WEAVING">WEAVING</a>`106';
isbe[4018]='Hair, Plucking of the``<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[4019]='Ha-Jehudijah`ha-je-hu-di\'-ja (ha-yehudhiyah): Named in the genealogical list (<a onClick="return mV(\'1Ch\',4,18);">1Ch 4:18</a>). Possibly a proper name (Revised Version, margin), but probably "the Jewess" (Revised Version (British and American)). May be so given in order to distinguish from the Egyptian named in this verse. The King James Version translates "Jehudijah."``1';
isbe[4020]='Hakkatan`hak\'-a-tan (ha-qatan, "the little one"): The father of Johanan, who returned with Ezra to Jerusalem (<a onClick="return mV(\'Ezr\',8,12);">Ezr 8:12</a> = Akatan, 1Esdras 8:38).``1';
isbe[4021]='Hakkoz`hak\'-oz (haqqots, or ha-qots, "the nimble"):<P>(1) A priest and chief of the 7th course of Aaron\'s sons selected by David (<a onClick="return mV(\'1Ch\',24,10);">1Ch 24:10</a>). According to <a onClick="return mV(\'Ezr\',2,61);">Ezr 2:61</a>; <a onClick="return mV(\'Neh\',3,4,21);">Ne 3:4, 21</a>; <a onClick="return mV(\'Neh\',7,63);">7:63</a>, his descendants returned with Zerubbabel from the captivity. But the King James Version considers the name in Ezra and Nehemiah as having the article prefixed, hence renders "Koz."<P>(2) One of Judah\'s descendants (<a onClick="return mV(\'1Ch\',4,8);">1Ch 4:8</a>).``1';
isbe[4022]='Hakupha`ha-ku\'-fa (chaqupha\' "incitement"). A family name of some of the Nethinim who returned with Zerubbabel from Babylon (<a onClick="return mV(\'Ezr\',2,51);">Ezr 2:51</a>; <a onClick="return mV(\'Neh\',7,53);">Ne 7:53</a>).``1';
isbe[4023]='Halah`ha\'-la (chalach; Halae, Hallae, Chaach, for Chalach, Chala; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Hala):<P>1. Many Identifications:<P>Mentioned in <a onClick="return mV(\'2Ki\',17,6);">2Ki 17:6</a>; <a onClick="return mV(\'2Ki\',18,11);">18:11</a>; <a onClick="return mV(\'1Ch\',5,26);">1Ch 5:26</a>, as one of the places to which the kings of Assyria sent the exiled Israelites (see <a href="study/isbe/search.html?string=GOZAN">GOZAN</A>; <a href="study/isbe/search.html?string=HABOR">HABOR</a>). Various identifications have been proposed, all of them except the last more or less improbable for philological reasons:<P>(1) the Assyrian Kalach (Nimrud, the Calah of <a onClick="return mV(\'Gen\',10,11);">Ge 10:11</a>);<P>(2) the Assyrian Hilakku (Cilicia);<P>(3) Chalkitis in Mesopotamia (Ptol. v.18, 4), adjoining Gauzanitis (Gozan)—a good position otherwise;<P>(4) the Calachene of Strabo, in the north of Assyria. Equally unsuitable, also, is<P>(5) the Chalonitis of Pliny and Strabo, northeast of Assyria, notwithstanding that this was apparently called Halah by the Syrians. An attractive identification was<P>(6) with the river Balikh (by change of "H" into "B")—compare Septuagint "in Halae and in Habor, rivers of Gozan"—but even this has to be abandoned in favor of<P>(7) the Assyrian Halahhu, which (except the doubling and the case-ending) is the same, letter for letter.<P>2. The Most Probable of Them:<P>It is mentioned in the W. Asia Inscr, II, plural 53, l. 35, between Arrapha (Arrapachitis) and Racappu (Reseph). According to the tablet K. 123, where it is called mat Halahhi, "the land of Halahhu," it apparently included the towns Se-bise, Se-irrisi, Lu-ammu(ti?), and Se-Akkulani, apparently four grain-producing centers for the Assyrian government. The first quotation implies that Halah was near or in Gauzanitis, and had a chief town of the same name. Of the 8 personal names in K. 123, 5 are Assyrian, the remainder being Syrian rather than Israelite.``136';
isbe[4024]='Halak, Mount`ha\'-lak (ha-har he-chalaq): A mountain that marked the southern limit of the conquests of Joshua (<a onClick="return mV(\'Jos\',11,17);">Jos 11:17</a>; <a onClick="return mV(\'Jos\',12,7);">12:7</a>). It is spoken of as the "mount Halak (literally, "the bare" or "smooth mountain") that goeth up to Seir." The latter passage locates it on the west of the Arabah. The southern boundary of the land is defined by the ascent of Akrabbim (<a onClick="return mV(\'Num\',34,4);">Nu 34:4</a>; <a onClick="return mV(\'Jos\',15,3);">Jos 15:3</a>). This may with some certainty be identified with the pass known today as naqb es-Safa, "pass of the smooth rock," through which runs the road from the south to Hebron. To the southwest opens Wady Maderah, a continuation of Waddy el-Fiqrah, in which there rises a conspicuous hill, Jebel Maderah, composed of limestone, answering well the description of a bare or smooth mountain. It is a striking feature of the landscape viewed from all sides, and may well be the mount here referred to.`<a href="./study/isbe/search.html?string=HOR+MOUNT">HOR, MOUNT</a>`54';
isbe[4025]='Halakha`ha-la\'-ka.`<a href="./study/isbe/search.html?string=TALMUD">TALMUD</a>`1';
isbe[4026]='Hale; Haling`hal, hal\'-ing (OE halen): "To pull" or drag, the King James Version translation of suro, "to draw or drag" (<a onClick="return mV(\'Act\',8,3);">Ac 8:3</a>, "haling men and women," the American Standard Revised Version "dragging"), and of katasuro, "to drag down" or "force along" (<a onClick="return mV(\'Luk\',12,58);">Lu 12:58</a>, "lest he hale thee to the judge," the American Standard Revised Version "lest haply he drag thee unto the judge"). A more frequent modern form is "haul."``1';
isbe[4027]='Half`haf.`<a href="./study/isbe/search.html?string=NUMBER">NUMBER</a>`1';
isbe[4028]='Halhul`hal\'-hul (chalchul): A city in the hill country of Judah (<a onClick="return mV(\'Jos\',15,58);">Jos 15:58</a>), "Halhul, Beth-zur and Gedor." It is without doubt the modern Chalchul, a village on a hill, surrounded by fine fields and vineyards, some 4 miles north of Hebron and less than a mile to the east of the modern carriage road. It is conspicuous from a considerable distance on account of its ancient mosque, Wely Nebi Yulnas, the "shrine of the Prophet Jonah"—a tradition going back at least to the 14th century. The mosque, which has a minaret or tower, is built upon a rock platform artificially leveled. In the 14th century it was stated by Isaac Chilo (a Jewish pilgrim) that the tomb of Gad the Seer (<a onClick="return mV(\'1Sa\',22,5);">1Sa 22:5</a>; <a onClick="return mV(\'2Sa\',24,11);">2Sa 24:11</a>f) was situated in this town. Beth-zur (Belt Sur) and Gedor (Jedur) are both near. In Josephus (BJ, IV, ix, 6) we read of an Alurus (where the Idumeans assembled), and in Jerome (OS 119 7) of a village Alula near Hebron, which both probably refer to the same place (PEF, III, 305; Sh XXI).``117';
isbe[4029]='Hali`ha\'-li (chali): A town named with Helkath, Beten and Achshaph on the border of Asher (<a onClick="return mV(\'Jos\',19,25);">Jos 19:25</a>). No certain identification is possible; but it may be represented by the modern Khirbet \'Alia, circa 13 miles northeast of Acre.``1';
isbe[4030]='Halicarnassus`hal-i-kar-nas\'-us (Halikarnassos): The largest and strongest city of the ancient country of Caria in Asia Minor, situated on the shore of a bay, 15 miles from the island of Cos. Its site was beautiful; its climate temperate and even; the soil of the surrounding country was unusually fertile and noted for its abundance of fig, orange, lemon, olive and almond trees. When the ancient country fell into the possession of the Persians, the kings of Caria were still permitted to rule. One of the rulers was the famous queen Artemisia who fought at the battle of Salamis. The most famous of the kings, however, was Maussollos (Mausolus), who ruled from 373 to 353 BC, and the tomb in which he was buried was long considered one of the wonders of the ancient world. Pliny describes the tomb as a circular structure, 140 ft. high, 411 ft. in circumference, and surrounded by 36 columns; it was covered with a pyramidal dome. The ancient writer Vitruvius, in his description of the city, says that the agora was along the shore; back of it was the mausoleum, and still farther away was the temple of Mars. To the right of the agora were the temples of Venus and Mercury, and to the left was the palace of Maussollos. Alexander the Great destroyed the city only after a long siege, but he was unable to take the acropolis. The city never quite recovered, yet it was later distinguished as the supposed birthplace of Herodotus and Dionysius. That a number of Jews lived there is evident from the fact, according to 1Macc 15:23, that in the year 139 BC, a letter was written by the Roman Senate in their behalf. In the 1st century BC, a decree was issued granting to the Jews in Halicarnassus liberty to worship "according to the Jewish laws, and to make their proseuche at the sea-side, according to the customs of their forefathers" (Josephus, Ant, XIV, x, 23).<P>The modern town of Budrun, which represents the ancient Halicarnassus and covers a part of its site, stands a little to the west of the castle of Peter. This castle was erected by the Knights of Rhodes in 1404 AD, partly from the ruins of the mausoleum. Lord Redcliffe, who explored the ruins in 1846, sent many of the sculptured slabs from the castle to the British Museum where they may now be seen. Sir C. Newton conducted excavations there in 1857-58, adding other sculptures to the collection in the British Museum. He discovered the foundation of the Ionic temple of Aphrodite, and the greenstone foundation of the mausoleum upon which modern Turkish houses had been built. He also opened several tombs which were outside the ancient city. The city walls, built by Maussollos about 360 BC, and defining the borders of the ancient city, are still preserved; but the ancient harbor which was protected by a mole, has now disappeared. The ruins may best be reached by boat from the island of Cos.``7';
isbe[4031]='Hall`hol (<a onClick="return mV(\'Luk\',22,55);">Lu 22:55</a> the King James Version).`<a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>`1';
isbe[4032]='Hall, Judgment``<a href="./study/isbe/search.html?string=JUDGMENT+HALL">JUDGMENT HALL</a>; <a href="./study/isbe/search.html?string=PRAETORIUM">PRAETORIUM</a>`1';
isbe[4033]='Hallel`ha-lal\', hal\'-el: In the fifth book of the Psalms (107-50) there are several groups of Hallelujah Psalms: <a onClick="return mV(\'Psa\',104,\'1-\');">104-106</A>; <a onClick="return mV(\'Psa\',111,\'1-\');">111-113</a>; <a onClick="return mV(\'Psa\',115,\'1-\');">115-117</a>; <a onClick="return mV(\'Psa\',135,\'1-\');">135</a>; <a onClick="return mV(\'Psa\',146,\'1-\');">146-150</A>. In the worship of the synagogue <a onClick="return mV(\'Psa\',135,\'1-\');">Psalms 135-136</a> and <a onClick="return mV(\'Psa\',146,\'1-\');">146-150</A> were used in the daily morning service. <a onClick="return mV(\'Psa\',113,\'1-\');">Psalms 113-118</a> were called the "Egypt Hallel," and were sung at the feasts of the Passover, Pentecost, Tabernacles and Dedication. At the Passover, <a onClick="return mV(\'Psa\',113,\'1-\');">Psalms 113</a> and <a onClick="return mV(\'Psa\',114,\'1-\');">114</a> (according to the school of Shammai only <a onClick="return mV(\'Psa\',113,\'1-\');">Ps 113</a>) were sung before the feast, and <a onClick="return mV(\'Psa\',115,\'1-\');">Psalms 115-118</a> after drinking the last cup. The song used by our Lord and the disciples on the night of the betrayal (<a onClick="return mV(\'Mat\',26,30);">Mt 26:30</a>), just before the departure for the Mount of Olives, probably included <a onClick="return mV(\'Psa\',115,\'1-\');">Psalms 115-118</a>.``156';
isbe[4034]='Hallelujah`hal-e-loo\'-ya (halela-yah, "praise ye Yah"; allelouia): The word is not a compound, like many of the Hebrew words which are composed of the abbreviated form of "Yahweh" and some other word, but has become a compound word in the Greek and other languages. Even if the Jews perhaps had become accustomed to use it as a compound, it is never written as such in the text. In some Psalms, Hallelujah is an integral part of the song (<a onClick="return mV(\'Psa\',135,3);">Ps 135:3</a>), while in others it simply serves as a liturgical interjection found either at the beginning (<a onClick="return mV(\'Psa\',111,\'1-\');">Ps 111</a>) or at the close (<a onClick="return mV(\'Psa\',104,\'1-\');">Ps 104</a>) of the psalms or both (<a onClick="return mV(\'Psa\',146,\'1-\');">Ps 146</a>). The Hallelujah Psalms are found in three groups: <a onClick="return mV(\'Psa\',104,\'1-\');">104-106</A>; <a onClick="return mV(\'Psa\',111,\'1-\');">111-113</a>; <a onClick="return mV(\'Psa\',146,\'1-\');">146-150</A>. In the first group, Hallelujah is found at the close of the psalm as a lit. interjection (<a onClick="return mV(\'Psa\',106,1);">106:1</A> is an integral part of the psalm). In the second group, Hallelujah is found at the beginning (<a onClick="return mV(\'Psa\',113,9);">113:9</A> is an integral part of the psalm depending on the adjective "joyful"). In the third group, Hallelujah is found both at the close and at the beginning of the psalms. In all other cases, (<a onClick="return mV(\'Psa\',115,\'1-\');">Pss 115</a>; <a onClick="return mV(\'Psa\',116,\'1-\');">116</a>; <a onClick="return mV(\'Psa\',117,\'1-\');">117</a>) Hallelujah seems to be an integral part of the psalms. These three groups were probably taken from an older collection of psalms like the group <a onClick="return mV(\'Psa\',120,\'1-\');">Psalms 120-134</a>. In the New Testament Hallelujah is found as part of the song of the heavenly host (<a onClick="return mV(\'Rev\',19,1);">Re 19:1</a>). The word is preserved as a liturgical interjection by the Christian church generally.``16';
isbe[4035]='Hallohesh`ha-lo\'-hesh (ha-lochesh, "the whisperer," "the slanderer"): A post-exilic chief whose son Shallum assisted in repairing the walls of Jerusalem (<a onClick="return mV(\'Neh\',3,12);">Ne 3:12</a>, the King James Version "Halohesh"). He was also one of the leaders who signed the national covenant (<a onClick="return mV(\'Neh\',10,24);">Ne 10:24 (Hebrew 25)</a>).``1';
isbe[4036]='Hallow; Hallowed`hal\'-o, hal\'-od, hal\'-o-ed ("to render or treat as holy," Anglo-Saxon halgian, from halig, "holy"): It translates several forms of qadhash, "set apart," "devote," "consecrate," frequently rendered in the King James Version, the Revised Version (British and American), the American Standard Revised Version "consecrate," "dedicate," "holy," and especially "sanctify," closely synonymous, "hallow" perhaps containing more of the thought of reverence, sacredness, holiness. It embraces the idea of marked separateness. It is applied to persons, as the priest (<a onClick="return mV(\'Lev\',22,2,3);">Le 22:2-3</a>); to places or buildings, as the middle of the temple court (<a onClick="return mV(\'1Ki\',8,64);">1Ki 8:64</a>); the tabernacle (<a onClick="return mV(\'Exd\',40,9);">Ex 40:9</a>); to things, like the portion of the sacrifice set apart for the priests (<a onClick="return mV(\'Num\',18,8);">Nu 18:8</a>); to times and seasons, as the Sabbath (<a onClick="return mV(\'Jer\',17,22);">Jer 17:22</a>; <a onClick="return mV(\'Eze\',20,20);">Eze 20:20</a>) and the Jubilee year (<a onClick="return mV(\'Lev\',25,10);">Le 25:10</a>); to God Himself (<a onClick="return mV(\'Lev\',22,32);">Le 22:32</a>). Its underlying idea of the separateness of holy nature or holy use works out into several often overlapping senses:<p>(1) To set apart, dedicate, offer, reserve, for the worship or service of God: <a onClick="return mV(\'Exd\',28,38);">Ex 28:38</a>, "The holy things, which the children of Israel shall hallow in all their holy gifts"; also <a onClick="return mV(\'Lev\',22,3);">Le 22:3</a>; <a onClick="return mV(\'Num\',18,29);">Nu 18:29</a>, etc.; <a onClick="return mV(\'2Ki\',12,4);">2Ki 12:4</a>, "All the money the hallowed things" (the King James Version "dedicated"), etc.<p>(2) To make holy, by selecting, setting apart, claiming, or acknowledging as His own: <a onClick="return mV(\'Gen\',2,3);">Ge 2:3</a>, "God blessed the seventh day, and hallowed it" (the King James Version "sanctified"); but <a onClick="return mV(\'Exd\',20,11);">Ex 20:11</a> (King James Version, the English Revised Version, the American Standard Revised Version), "hallowed." So of the temple (<a onClick="return mV(\'1Ki\',9,7);">1Ki 9:7</a>); of the firstborn, spared in Egypt (<a onClick="return mV(\'Num\',3,13);">Nu 3:13</a>).<p>(3) To dedicate or consecrate by formal ceremonial, with the accompanying idea of cleansing from sin and uncleanness: <a onClick="return mV(\'Exd\',29,1);">Ex 29:1</a>, "This is the thing that thou shalt do unto them (Aaron and his sons) to hallow them, to minister unto me in the priest\'s office." The whole chapter is devoted to the elaborate ceremonial, consisting of ablutions, endowment in priestly robes and paraphernalia, anointing with oil, the offering of a bullock for a sin offering, and of a ram, the placing of the blood of another ram upon the right ear, right thumb, right great toe of each, the wave offering, the anointing of the holy garments, and the eating of the consecrated food, all this lasting seven days, and indicating the completeness with which they were set apart, the deep necessity of purification, and the solemnity and sacredness of the office. The tabernacle and its furniture were similarly "hallowed" by a simpler ceremony, using the anointing oil.<p>(4) To render ritually fit for religious service, worship, or use: <a onClick="return mV(\'Lev\',16,19);">Le 16:19</a>, "Hallow it (the altar with the sprinkled blood) from the uncleannesses of the children of Israel"; <a onClick="return mV(\'Num\',6,11);">Nu 6:11</a>, "The priest shall...make atonement for him, for that he sinned by reason of the dead, and shall hallow his head that same day."<p>(5) To hold sacred, reverence, keep holy: <a onClick="return mV(\'Jer\',17,22);">Jer 17:22</a>, "But hallow ye the Sabbath day," by keeping it distinct and separate, especially (<a onClick="return mV(\'Jer\',17,24,27);">Jer 17:24, 27</a>) by refraining from unnecessary work, from burden-bearing, travel, or traffic (<a onClick="return mV(\'Neh\',13,16);">Ne 13:16</a>). See <a onClick="return mV(\'Exd\',20,\'8-11\');">Ex 20:8-11</a> (the Sabbath Commandment).<p>(6) To revere, hold in awe, and reverence as holy and "separated from sinners" in majesty, power, sacredness: <a onClick="return mV(\'Lev\',22,32);">Le 22:32</a>, "And ye shall not profane my holy name; but I will be hallowed among the children of Israel." Qadhash is elsewhere translated "sanctify" in this connection, meaning "to be manifested in awe-producing majesty, power, or grace": <a onClick="return mV(\'Eze\',38,23);">Eze 38:23</a>, "And I will...sanctify myself, and I will make myself known in the eyes of many nations; and they shall know that I am Yahweh"; compare <a onClick="return mV(\'Eze\',28,22,23);">Eze 28:22-23</a>, etc.<P>In the New Testament "hallow" occurs only in the "Lord\'s Prayer," there rendering hagiazo, the Septuagint word for qadhash: <a onClick="return mV(\'Mat\',6,9);">Mt 6:9</a>; <a onClick="return mV(\'Luk\',11,2);">Lu 11:2</a>, "Hallowed be thy name." Hagiazo is quite frequent in the New Testament, and is always (American Standard Revised Version) rendered "sanctify," except here, and in <a onClick="return mV(\'Rev\',22,11);">Re 22:11</a>, "He that is holy, let him be made holy still." To "hallow the name" includes not only the inward attitude and outward action of profound reverence and active praise, but also that personal godliness, loving obedience and aggressive Christlikeness, which reveal the presence of God in the life, which is His true earthly glory.``31';
isbe[4037]='Halt`holt (tsala\', "to limp"; cholos, "lame," "crippled"): the American Standard Revised Version in <a onClick="return mV(\'Gen\',32,31);">Ge 32:31</a> prefers "limped"; in <a onClick="return mV(\'Mic\',4,6,7);">Mic 4:6-7</a>; <a onClick="return mV(\'Zep\',3,19);">Ze 3:19</a>, "is (or was) lame"; in <a onClick="return mV(\'Luk\',14,21);">Lu 14:21</a>, the American Standard Revised Version and the English Revised Version have "lame." In <a onClick="return mV(\'1Ki\',18,21);">1Ki 18:21</a> a different word (pacach) is used in English Versions of the Bible of moral indecision: "How long halt ye between two opinions?" the American Standard Revised Version renders, "How long go ye limping between the two sides?"``1';
isbe[4038]='Ham (1)`ham (cham; Cham):<P>1. The Youngest Son of Noah:<P>The youngest son of Noah, from whom sprang the western and southwestern nations known to the Hebrews. His name first occurs in <a onClick="return mV(\'Gen\',5,32);">Ge 5:32</a>, where, as in <a onClick="return mV(\'Gen\',6,10);">6:10</A> and elsewhere, it occupies the second place. In <a onClick="return mV(\'Gen\',9,18);">Ge 9:18</a> Ham is described as "the father of Canaan," to prepare the reader for <a onClick="return mV(\'Gen\',9,\'25-27\');">9:25-27</A>, where Noah, cursing Ham for having told Shem and Japheth of his nakedness, refers to him as Canaan. On account of this, it has been suggested that "Canaan" stood originally in all the passages where the three brothers are spoken of, and that this was later changed to "Ham," except in the verses containing the curse. It seems more likely, however, that the name "Canaan" is inserted prophetically, as Noah would not desire to curse his son, but only one branch of that son\'s descendants, who were later the principal adversaries of the Hebrews.<P>2. Ham as a Nationality:<P>The name given, in <a onClick="return mV(\'Psa\',105,23,27);">Ps 105:23, 27</a>; <a onClick="return mV(\'Psa\',106,22);">106:22</a> (compare <a onClick="return mV(\'Psa\',78,51);">78:51</a>), to Egypt as a descendant of Ham, son of Noah. As Shem means "dusky," or the like, and Japheth "fair," it has been supposed that Ham meant, as is not improbable, "black." This is supported by the evidence of Hebrew and Arabic, in which the word chamam means "to be hot" and "to be black," the latter signification being derived from the former.<P>3. Meaning of the Word:<P>That Ham is connected with the native name of Egypt, Kem, or, in full pa ta\' en Kem, "the land of Egypt," in Bashmurian Coptic Kheme, is unlikely, as this form is probably of a much later date than the composition of Genesis, and, moreover, as the Arabic shows, the guttural is not a true kh, but the hard breathing h, which are both represented by the Hebrew cheth.<P>4. The Nations Descending from Ham:<P>Of the nationalities regarded as descending from Ham, none can be described as really black. First on the list, as being the darkest, is Cush or Ethiopia (<a onClick="return mV(\'Gen\',10,6);">Ge 10:6</a>), after which comes Mitsrayim, or Egypt, then Put or Libyia, and Canaan last. The sons or descendants of each of these are then taken in turn, and it is noteworthy that some of them, like the Ethiopians and the Canaanites, spoke Semitic, and not Hamitic, languages—Seba (if connected with the Sabeans), Havilah (Yemen), and Sheba, whose queen visited Solomon. Professor Sayce, moreover, has pointed out that Caphtor is the original home of the Phoenicians, who spoke a Semitic language. The explanation of this probably is that other tongues were forced upon these nationalities in consequence of their migrations, or because they fell under the dominion of nationalities alien to them. The non-Sem Babylonians, described as descendants of Nimrod (Merodach), as is welI known, spoke Sumerian, and adopted Semitic Babylonian only on account of mingling with the Semites whom they found there. Another explanation is that the nationalities described as Hamitic—a parallel to those of the Semitic section—were so called because they fell under Egyptian dominion. This would make the original Hamitic race to have been Egyptian and account for Ham as a (poetical) designation of that nationality. Professor F. L. Griffith has pointed out that the Egyptian Priapic god of Panopolis (Akhmim), sometimes called Menu, but also apparently known as Khem, may have been identified with the ancestor of the Hamitic race—he was worshipped from the coast of the Red Sea to Coptos, and must have been well known to Egypt\'s eastern neighbors. He regards the characteristics of Menu as being in accord with the shamelessness of Ham as recorded in <a onClick="return mV(\'Gen\',9,20);">Ge 9:20</a>ff.`<a href="./study/isbe/search.html?string=JAPHETH+(1)">JAPHETH</a>; <a href="./study/isbe/search.html?string=SHEM">SHEM</a>; <a href="./study/isbe/search.html?string=TABLE+OF+NATIONS">TABLE OF NATIONS</a>`136';
isbe[4039]='Ham (2)`(ham):<P>(1) A place east of the Jordan named between Ashteroth-karnaim and Shaveh-kiriathaim, in which Chedorlaomer smote the Zu-zim (<a onClick="return mV(\'Gen\',14,5);">Ge 14:5</a>). No name resembling this has been recovered. Septuagint reads bahem "with them," instead of beham, "in Ham." Some have thought that "Ham" may be a corruption from "Ammon"; or that it may be the ancient name of Rabbath-ammon itself.<P>(2) A poetical appellation of Egypt: "the land of Ham" (<a onClick="return mV(\'Psa\',105,23);">Ps 105:23</a>, etc.) is the land of Jacob\'s sojourning, i.e. Egypt; "the tents of Ham" (<a onClick="return mV(\'Psa\',78,51);">Ps 78:51</a>) are the dwellings of the Egyptians. It may be derived from the native name of Egypt, Kemi, or Khemi.`<a href="./study/isbe/search.html?string=MIZRAIM">MIZRAIM</a>; <a href="./study/isbe/search.html?string=SHEM">SHEM</a>`54';
isbe[4040]='Haman`ha\'-man (haman; Haman): A Persian noble and vizier of the empire under Xerxes. He was the enemy of Mordecai, the cousin of Esther. Mordecai, being a Jew, was unable to prostrate himself before the great official and to render to him the adoration which was due to him in accordance with Persian custom. Haman\'s wrath was so inflamed that one man\'s life seemed too mean a sacrifice, and he resolved that Mordecai\'s nation should perish with him. This was the cause of Haman\'s downfall and death. A ridiculous notion, which, though widely accepted, has no better foundation than a rabbinic suggestion or guess, represents him as a descendant of Agag, the king of Amalek, who was slain by Samuel. But the language of Scripture (<a onClick="return mV(\'1Sa\',15,33);">1Sa 15:33</a>) indicates that when Agag fell, he was the last of his house. Besides, why should his descendants, if any existed, be called Agagites and not Amalekites? Saul\'s posterity are in no case termed Saulites, but Benjamites or Israelites. But the basis of this theory has been swept away by recent discovery. Agag was a territory adjacent to that of Media. In an inscription found at Khorsabad, Sargon, the father of Sennacherib, says: "Thirty-four districts of Media I conquered and I added them to the domain of Assyria: I imposed upon them an annual tribute of horses. The country of Agazi (Agag)...I ravaged, I wasted, I burned." It may be added that the name of Haman is not Hebrew, neither is that of Hammedatha his father. "The name of Haman," writes M. Oppert, the distinguished Assyriologist, "as well as that of his father, belongs to the Medo-Persian."``180';
isbe[4041]='Hamath`ha\'-math (chamath; Hemath, Haimath; Swete also has Hemath): The word signifies a defense or citadel, and such designation was very suitable for this chief royal city of the Hittites, situated between their northern and southern capitals, Carchemish and Kadesh, on a gigantic mound beside the Orontes. In <a onClick="return mV(\'Amo\',6,2);">Am 6:2</a> it is named Great Hamath, but not necessarily to distinguish it from other places of the same name.<P>1. Early History:<P>The Hamathite is mentioned in <a onClick="return mV(\'Gen\',10,18);">Ge 10:18</a> among the sons of Canaan, but in historic times the population, as the personal names testify, seems to have been for the most part Semitic. The ideal boundary of Israel reached the territory, but not the city of Hamath (<a onClick="return mV(\'Num\',34,8);">Nu 34:8</a>; <a onClick="return mV(\'Jos\',13,5);">Jos 13:5</a>; <a onClick="return mV(\'Eze\',47,\'13-21\');">Eze 47:13-21</a>). David entered into friendly relations with Toi, its king (<a onClick="return mV(\'2Sa\',8,9);">2Sa 8:9</a>), and Solomon erected store cities in the land of Hamath (<a onClick="return mV(\'2Ch\',8,4);">2Ch 8:4</a>). In the days of Ahab we meet with it on the cuneiform inscriptions, under the name mat hamatti, and its king Irhuleni was a party to the alliance of the Hittites with Ben-hadad of Damascus and Ahab of Israel against Shalmaneser II; but this was broken up by the battle of Qarqar in 854 BC, and Hamath became subject to Assyria. Jeroboam II attacked, partially destroyed, and held it for a short time (<a onClick="return mV(\'2Ki\',14,28);">2Ki 14:28</a>; <a onClick="return mV(\'Amo\',6,2);">Am 6:2</a>). In 730 BC, its king Eniilu paid tribute to Tiglath-pileser, but he divided its lands among his generals, and transported 1,223 of its inhabitants to Sura on the Tigris. In 720, Sargon "rooted out the land of Hamath and dyed the skin of Ilubi\'idi (or Jau-bi\'idi) its king, like wool" and colonized the country with 4,300 Assyrians, among whom was Deioces the Mede. A few years later Sennacherib also claims to have taken it (<a onClick="return mV(\'2Ki\',18,34);">2Ki 18:34</a>; <a onClick="return mV(\'2Ki\',19,13);">19:13</a>). In <a onClick="return mV(\'Isa\',11,11);">Isa 11:11</a>, mention is made of Israelites in captivity at Hamath, and Hamathites were among the colonists settled in Samaria (<a onClick="return mV(\'2Ki\',17,24);">2Ki 17:24</a>) by Esarhaddon in 675 BC. Their special object of worship was Ashima, which, notwithstanding various conjectures, has not been identified.<P>2. Later History:<P>The Hamathite country is mentioned in 1Macc 12:25 in connection with the movements of Demetrius and Jonathan. The Seleucids renamed it Epiphaneia (Josephus, Ant, I, vi, 2), and by this name it was known to the Greeks and the Romans, even appearing as Paphunya in Midrash Ber Rab chapter 37. Locally, however, the ancient name never disappeared, and since the Moslem conquest it has been known as Hama. Saladin\'s family ruled it for a century and a half, but after the death of Abul-fida in 1331 it sank into decay.<P>3. Modern Condition:<P>The position of Hama in a fruitful plain to the east of the Nusairiyeh Mountains, on the most frequented highway between Mesopotamia and Egypt, and on the new railway, gives it again, as in ancient times, a singular significance, and it is once more rising in importance. The modern town is built in four quarters around the ancient citadel-mound, and it has a population of at least 80,000. It is now noted for its gigantic irrigating wheels. Here, too, the Hittite inscriptions were first found and designated Hamathite.<P>4. Entering in of Hamath:<P>In connection with the northern boundary of Israel, "the entering in of Hamath" is frequently mentioned (<a onClick="return mV(\'Num\',13,21);">Nu 13:21</a>; <a onClick="return mV(\'1Ki\',8,65);">1Ki 8:65</a>, etc., the American Standard Revised Version "entrance"). It has been sought in the Orontes valley, between Antioch and Seleucia, and also at Wady Nahr el-Barid, leading down from Homs to the Mediterranean to the north of Tripoli. But from the point of view of Palestine, it must mean some part of the great valley of Coele-Syria (Biqa\'a). It seems that instead of translating, we should read here a place-name—"Libo of Hamath"—and the presence of the ancient site of Libo (modern Leboue) 14 miles north-northeast of Baalbek, at the head-waters of the Orontes, commanding the strategical point where the plain broadens out to the north and to the south, confirms us in this conjecture.``23';
isbe[4042]='Hamath-Zobah`ha\'-math-zo\'-ba (chamath tsobhah; Baisoba):Mentioned only in <a onClick="return mV(\'2Ch\',8,3);">2Ch 8:3</a>. Apart from Great Hamath no site answering to this name is known. It does not seem to be implied that Solomon took possession of Hamath itself, but rather that he "confirmed" his dominion over parts of the kingdom of Zobah, which on its fall may have been annexed by Hamath. The Septuagint\'s Codex Vaticanus suggests a reading—Bethzobah—omitting all reference to Hamath. On the other hand, the geographical distinctions between Zobah and Hamath having passed away long before Chronicles was written, the double name may have been used to indicate generally the extent of Solomon\'s conquests, as also to avoid confusion with the Zobah in the Hauran (<a onClick="return mV(\'2Sa\',23,36);">2Sa 23:36</a>).``23';
isbe[4043]='Hammath`ham\'-ath (chammath, "hot spring"):<P>(1) "The father of the house of Rechab" (<a onClick="return mV(\'1Ch\',2,55);">1Ch 2:55</a>).<P>(2) One of the fenced cities of Naphtali, named with Zer, Rakkath and Chinnereth (<a onClick="return mV(\'Jos\',19,35);">Jos 19:35</a>). It is doubtless identical with Emmaus mentioned by Josephus (Ant., XVIII, ii, 3; BJ, IV, i, 3) as near Tiberias, on the shore of the lake of Gennesareth. It is represented by the modern el-Chammam, nearly 2 miles south of Tiberias. It was, of course, much nearer the ancient Tiberias, which lay south of the present city. The hot baths here, "useful for healing," in the time of Josephus, have maintained their reputation. In recent years, indeed, there has been a marked increase in the number of sick persons from all parts who visit the baths. The waters are esteemed specially valuable for rheumatism and skin troubles. In the large public bath the water has a temperature of over 140 degree Fahr. Parts of the ancient fortification still cling to the mountain side above the baths; and the remains of an aqueduct which brought fresh water from sources in the southwest may be traced along the face of the slopes. Hammath is identical with Hammon (<a onClick="return mV(\'1Ch\',6,76);">1Ch 6:76</a>); and probably also with Hammoth-dor (<a onClick="return mV(\'Jos\',21,32);">Jos 21:32</a>).``54';
isbe[4044]='Hammeah, the Tower of`ha-me\'-a, ham\'-e-a (ha-me\'ah (<a onClick="return mV(\'Neh\',3,1);">Ne 3:1</a>); the King James Version Meah): The origin of the name is obscure; in the margin the meaning is given "Tower of the hundred"; it has been suggested that it may have been 100 cubits high or had 100 steps. It was the most important point on the walls of Jerusalem in going west from the Sheep Gate, and is mentioned along with the T. of <a href="study/isbe/search.html?string=HANANEL">HANANEL</A> (which see) (<a onClick="return mV(\'Neh\',3,1);">Ne 3:1</a>), and was therefore near the northeast corner, and probably stood where the Baris and Antonia afterward were, near the northwest corner of the charam where are today the Turkish barracks.`<a href="./study/isbe/search.html?string=JERUSALEM,+1">JERUSALEM</a>`117';
isbe[4045]='Hammedatha`ham-e-da\'-tha (hammedhatha\'): The father of Haman (<a onClick="return mV(\'Est\',3,1);">Es 3:1</a>). He is generally termed the "Agagite"; the name is of Persian etymology, signifying "given by the moon."``1';
isbe[4046]='Hammelech`ham\'-e-lek (ha-melekh, "the king"): Wrongly translated as a proper name in the King James Version. It should be rendered "the king," as in the American Standard Revised Version (<a onClick="return mV(\'Jer\',36,26);">Jer 36:26</a>; <a onClick="return mV(\'Jer\',38,6);">38:6</a>).``1';
isbe[4047]='Hammer`ham\'-er: The Hebrew maqqebheth, occurs in <a onClick="return mV(\'Jdg\',4,21);">Jud 4:21</a>, where it refers to the mallet (probably wooden) used to drive tent-pins into the ground. The same word occurs in <a onClick="return mV(\'1Ki\',6,7);">1Ki 6:7</a>; <a onClick="return mV(\'Isa\',44,12);">Isa 44:12</a>; <a onClick="return mV(\'Jer\',10,4);">Jer 10:4</a> as applied to a workman\'s hammer. Pattish (compare Arabic, fatis), occurs in <a onClick="return mV(\'Isa\',41,7);">Isa 41:7</a>; <a onClick="return mV(\'Jer\',23,29);">Jer 23:29</a>; <a onClick="return mV(\'Jer\',50,23);">50:23</a>. It was probably a blacksmith\'s hammer or heavy hammer used for breaking rock. There is doubt about the rendering of <a onClick="return mV(\'Jdg\',5,26);">Jud 5:26</a>, where the word, halmuth, occurs. From the context, the instrument mentioned was probably not a hammer. In <a onClick="return mV(\'Psa\',74,6);">Ps 74:6</a>, kelaph, is better translated "axes," not "hammers."`<a href="./study/isbe/search.html?string=TOOLS">TOOLS</a>`133';
isbe[4048]='Hammiphkad, Gate of`ha-mif\'-kad (sha\'ar ha-miphqadh, "Gate of the Muster"): One of the gates of Jerusalem (<a onClick="return mV(\'Neh\',3,31);">Ne 3:31</a>) not mentioned elsewhere; probably situated near the northeast corner of the Temple area.``1';
isbe[4049]='Hammolecheth`ha-mol\'-e-keth (hamolekheth, "the queen"; Septuagint Malecheth; the King James Version Hammoleketh): The daughter of Machir and sister of Gilead (<a onClick="return mV(\'1Ch\',7,18);">1Ch 7:18</a>).``1';
isbe[4050]='Hammon`ham\'-on (chammon, "glowing"):<P>(1) A place on the seaward frontier of Asher, named with Rehob and Kanah (<a onClick="return mV(\'Jos\',19,28);">Jos 19:28</a>), to be sought, therefore, not far from Tyre. The most probable identification so far suggested is with Umm el\'Amud, "mother of the column" (or \'Awamid, "columns"), at the mouth of Wady Chamul, on the shore, about 10 miles south of Tyre. An inscription found by Renan shows that the place was associated with the worship of Ba\'al Chamman (CIS, I, 8).<P>(2) A city in Naphtali, given to the Gershonite Levites (<a onClick="return mV(\'1Ch\',6,76);">1Ch 6:76</a>). It is identical with Hammath (<a onClick="return mV(\'Jos\',19,35);">Jos 19:35</a>), and probably also with Hammoth-dor (<a onClick="return mV(\'Jos\',21,32);">Jos 21:32</a>).``54';
isbe[4051]='Hammoth-Dor`ham-oth-dor\' (chammoth do\'r; Emathdor, as also several corrupt forms): A fenced, Levitical city of Naphtali (<a onClick="return mV(\'Jos\',19,35);">Jos 19:35</a>; <a onClick="return mV(\'Jos\',21,32);">21:32</a>); also named Hammen (<a onClick="return mV(\'1Ch\',6,61);">1Ch 6:61</a> Hebrew). Probably the hammatu of the Karnak lists, and the hamatam of WAI, II, 53; certainly the Emmaus of Josephus, Ant, XVIII, ii, 3; BJ, IV, i, 3; Hamata of \'Erubhin v. 5; Meghillah 2b, and the modern el-Hammam, 1 1/2 miles south of Tiberias. The name signifies "hot springs," and these, 4 in number, still exist. They have a temperature of 144 degree F., are salt and bitter in taste and sulfurous in smell. Considered invaluable for rheumatism, they are crowded in June and July. This health-giving reputation is of ancient date. It is mentioned in Josephus, BJ, IV, i, 3; and a coin of Tiberias of the reign of Trajan depicts Hygeia sitting on a rock beside the springs, feeding the serpent of Aesculapius. Being used for pleasure also, they were permitted to the Jew on the Sabbath, whereas had they been used only medicinally, they would have been forbidden (Babylonian Talmud, Shab 109a; compare <a onClick="return mV(\'Mat\',12,10);">Mt 12:10</a>).``23';
isbe[4052]='Hammuel`ham\'-u-el (chammu\'el, "wrath of God"): A son of Mishma, a Simeonite, of the family of Shaul (<a onClick="return mV(\'1Ch\',4,26);">1Ch 4:26</a>).``1';
isbe[4053]='Hammurabi`cham-oo-ra\'-be:<P>1. Etymology of His Name, with Reference to Amraphel; His Dynasty<P>2. The Years Following His Accession<P>3. Military Operations and Further Pious Works. Inauguration of His Image<P>4. The Capture of Rim-Sin<P>5. Various Works, and an Expedition to Mesopotamia<P>6. His Final Years<P>7. No Record of His Expedition to Palestine<P>8. The Period When It May Have Taken Place<P>9. Hammurabi\'s Greatness as a Ruler<HR /><P>1. Etymology of His Name with Reference to Amraphel; His Dynasty:<P>The name of the celebrated warrior, builder, and lawgiver, who ruled over Babylonia about 2000 BC. In accordance with the suggestion of the late Professor Eb. Schrader, he is almost universally identified with the <a href="study/isbe/search.html?string=AMRAPHEL">AMRAPHEL</a> of <a onClick="return mV(\'Gen\',14,1);">Ge 14:1</a>, etc. (which see). Hammurabi was apparently not of Babylonian origin, the so-called "Dynasty of Babylon," to which he belonged, having probably come from the West. The commonest form of the name is as above, but Hamu(m)-rabi (with mimmation) is also found. The reading with initial "b" in the second element is confirmed by the Babylonian rendering of the name as Kimta-rapastum, "my family is widespread," or the like, showing that rabi was regarded as coming from rabu, "to be great." A late letter-tablet, however (see PSBA, May, 1901, p. 191), gives the form Ammurapi, showing that the initial is not really "kh", and that the "b" of the second element had changed to "p" (compare Tiglath-pil-eser for Tukulti-abil-esar, etc.). Amraphel (for Amrapel, Amrabel, Amrabe) would therefore seem to be due to Assyrian influence, but the final "l" is difficult to explain. Professor F. Hommel has pointed out, that the Babylonian rendering, "my family is widespread," is simply due to the scribes, the first element being the name of the Arabic deity \'Am, making \'Ammu-rabi, "Am is great." Admitting this, it would seem to be certain that Hamm
