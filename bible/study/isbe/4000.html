isbe[4080]='Hangings`hang\'-ingz:<P>(1) In English Versions of the Bible this word in the plural represents the Hebrew qela\'im, the curtains of "fine twined linen" with which the court of the tabernacle was enclosed. These were five cubits in height, and of lengths corresponding to the sides of the enclosure and the space on either side of the entrance in front, and were suspended from hooks fastened to the pillars of the court. They are described at length in <a onClick="return mV(\'Exd\',27,\'9-15\');">Ex 27:9-15</a>; <a onClick="return mV(\'Exd\',38,\'9-18\');">38:9-18</a>. See, besides, <a onClick="return mV(\'Exd\',35,17);">Ex 35:17</a>; <a onClick="return mV(\'Exd\',39,40);">39:40</a>; <a onClick="return mV(\'Num\',3,26);">Nu 3:26</a>; <a onClick="return mV(\'Num\',4,26);">4:26</a>.<P>(2) In the King James Version another word, macakh (the Revised Version (British and American) uniformly "screen"), is distinguished from the preceding only by the singular, "hanging" (<a onClick="return mV(\'Exd\',35,17);">Ex 35:17</a>; <a onClick="return mV(\'Exd\',38,18);">38:18</a>, etc.). It is used of the screen or portiere, embroidered in colors, that closed the entrance of the court (<a onClick="return mV(\'Exd\',27,16);">Ex 27:16</a>; <a onClick="return mV(\'Exd\',35,17);">35:17</a>; <a onClick="return mV(\'Exd\',38,18);">38:18</a>; <a onClick="return mV(\'Exd\',39,40);">39:40</a>; <a onClick="return mV(\'Exd\',40,8,33);">40:8, 33</a>; <a onClick="return mV(\'Num\',3,26);">Nu 3:26</a>; <a onClick="return mV(\'Num\',4,26);">4:26</a>); of the screen of similar workmanship at the entrance of the tabernacle (<a onClick="return mV(\'Exd\',26,36,37);">Ex 26:36-37</a>; <a onClick="return mV(\'Exd\',35,15);">35:15</a>; <a onClick="return mV(\'Exd\',36,37);">36:37</a>; <a onClick="return mV(\'Exd\',39,38);">39:38</a>; <a onClick="return mV(\'Exd\',40,5,28);">40:5, 28</a>; <a onClick="return mV(\'Num\',3,25);">Nu 3:25</a>; <a onClick="return mV(\'Num\',4,25);">4:25</a>); and once (<a onClick="return mV(\'Num\',3,31);">Nu 3:31</a>) of the tapestry veil, adorned with cherubim, at the entrance of the Holy of Holies (elsewhere, parokheth, "veil," <a onClick="return mV(\'Exd\',26,\'31-33\');">Ex 26:31-33</a>, etc., or parokheth ha-macakh, "veil of the screen," <a onClick="return mV(\'Exd\',35,12);">Ex 35:12</a>, etc.). In <a onClick="return mV(\'Num\',3,26);">Nu 3:26</a>, the King James Version renders macakh "curtain," and in <a onClick="return mV(\'Exd\',35,12);">Ex 35:12</a>; <a onClick="return mV(\'Exd\',39,34);">39:34</a>; <a onClick="return mV(\'Exd\',40,21);">40:21</a> (compare also <a onClick="return mV(\'Num\',4,5);">Nu 4:5</a>), "covering."<P>(3) In <a onClick="return mV(\'2Ki\',23,7);">2Ki 23:7</a> we read of "hangings" (Hebrew "houses") which the women wove for the Asherah. If the text is correct we are to think perhaps of tent shrines for the image of the goddess. Lucian\'s reading (stolas, "robes") is preferred by some, which would have reference to the custom of bringing offerings of clothing for the images of the gods. In <a onClick="return mV(\'1Ki\',7,29);">1Ki 7:29</a> the Revised Version (British and American), "wreaths of hanging work" refers to a kind of ornamentation on the bases of the lavers. In <a onClick="return mV(\'Est\',1,6);">Es 1:6</a>, "hangings" is supplied by the translators.``44';
isbe[4081]='Haniel`han\'-i-el.`<a href="./study/isbe/search.html?string=HANNIEL">HANNIEL</a>`1';
isbe[4082]='Hannah`han\'-a (channah, "grace," "favor"; Hanna): One of the two wives of Elkanah, an Ephraimite who lived at Ramathaim-zophim. Hannah visited Shiloh yearly with her husband to offer sacrifices, for there the tabernacle was located. She was greatly distressed because they had no children. She therefore prayed earnestly for a male child whom she promised to dedicate to the Lord from his birth. The prayer was heard, and she called her son\'s name Samuel ("God hears"). When he was weaned he was carried to Shiloh to be trained by Eli, the priest (<a onClick="return mV(\'1Sa\',1,\'1-\');">1Sa 1</a>). Hannah became the mother of five other children, three sons and two daughters (<a onClick="return mV(\'1Sa\',2,2);">1Sa 2:2</a>). Her devotion in sending Samuel a little robe every year is one of the tenderest recorded instances of maternal love (<a onClick="return mV(\'1Sa\',2,19);">1Sa 2:19</a>). She was a prophetess of no ordinary talent, as is evident from her elevated poetic deliverance elicited by God\'s answer to her prayer (<a onClick="return mV(\'1Sa\',2,\'1-10\');">1Sa 2:1-10</a>).``38';
isbe[4083]='Hannathon`han\'-a-thon (channathon): A city on the northern boundary of Zebulun (<a onClick="return mV(\'Jos\',19,14);">Jos 19:14</a>). It is probably identical with Kefar Hananyah, which the Mishna gives as marking the northern limit of lower Galilee (Neubauer, Geog. du Talmud, 179). It is represented by the modern Kefr \'Anan, about 3 miles southeast of er-Rameh.``1';
isbe[4084]='Hanniel`han\'-i-el (channi\'el "grace of God"):<P>(1) The son of Ephod and a prince of Manasseh who assisted in dividing Canaan among the tribes (<a onClick="return mV(\'Num\',34,23);">Nu 34:23</a>).<P>(2) A son of Ulla and a prince and hero of the tribe of Asher (<a onClick="return mV(\'1Ch\',7,39);">1Ch 7:39</a>); the King James Version "Haniel."``1';
isbe[4085]='Hanoch; Hanochites`ha\'-nok, ha\'-nok-its (chanokh, "initiation," "dedication"):<P>(1) A grandson of Abraham by Keturah, and an ancestral head of a clan of Midian (<a onClick="return mV(\'Gen\',25,4);">Ge 25:4</a>; <a onClick="return mV(\'1Ch\',1,33);">1Ch 1:33</a>, the King James Version "Henoch").<P>(2) The eldest son of Reuben (<a onClick="return mV(\'Gen\',46,9);">Ge 46:9</a>; <a onClick="return mV(\'Exd\',6,14);">Ex 6:14</a>; <a onClick="return mV(\'1Ch\',5,3);">1Ch 5:3</a>).<P>The descendants of Hanoch were known as Hanochites (<a onClick="return mV(\'Num\',26,5);">Nu 26:5</a>).``1';
isbe[4086]='Hanun`ha\'-nun (chanun, "favored," "pitied"):<P>(1) A son and successor of Nahash, king of Ammon. Upon the death of Nahash, David sent sympathetic communications to Hanun, which were misinterpreted and the messengers dishonored. Because of this indignity, David waged a war against him, which caused the Ammonites to lose their independence (<a onClick="return mV(\'2Sa\',10,1);">2Sa 10:1</a>ff; <a onClick="return mV(\'1Ch\',19,1);">1Ch 19:1</a>).<P>(2) One of the six sons of Zalaph who assisted in repairing the east wall of Jerusalem (<a onClick="return mV(\'Neh\',3,30);">Ne 3:30</a>).<P>(3) One of the inhabitants of Zanoah who repaired the Valley Gate in the wall of Jerusalem (<a onClick="return mV(\'Neh\',3,13);">Ne 3:13</a>).``38';
isbe[4087]='Hap; Haply`hap, hap\'-li (miqreh, lu; mepote):<P>Hap (a Saxon word for "luck, chance") is the translation of miqreh, "a fortuitous chance," "a lot" (<a onClick="return mV(\'Rth\',2,3);">Ru 2:3</a>, the King James Version "Her hap was to light on a part of the field belonging unto Boaz"); in <a onClick="return mV(\'1Sa\',6,9);">1Sa 6:9</a>, the same word is translated "chance" (that happened); "event," in <a onClick="return mV(\'Ecc\',9,2,3);">Ec 9:2-3</a>, with "happeneth," in <a onClick="return mV(\'Ecc\',2,14);">Ec 2:14</a>.<P>Haply (from "hap") is the translation of lu, "if that" (<a onClick="return mV(\'1Sa\',14,30);">1Sa 14:30</a>, "if haply the people had eaten freely"); of ei ara, "if then" (<a onClick="return mV(\'Mar\',11,13);">Mr 11:13</a>, "if haply he might find anything thereon"); of ei arage (<a onClick="return mV(\'Act\',17,27);">Ac 17:27</a>, "if haply they might feel after him"); of mepote, "lest ever" "lest perhaps" etc. (<a onClick="return mV(\'Luk\',14,29);">Lu 14:29</a>; <a onClick="return mV(\'Act\',5,39);">Ac 5:39</a>); of me pos, "lest in anyway" (<a onClick="return mV(\'2Cr\',9,4);">2Co 9:4</a> the King James Version, "lest haply," the Revised Version (British and American) "lest by any means").<P>The Revised Version has "haply" for "at any time" (<a onClick="return mV(\'Mat\',4,6);">Mt 4:6</a>; <a onClick="return mV(\'Mat\',5,25);">5:25</a>; <a onClick="return mV(\'Mat\',13,15);">13:15</a>; <a onClick="return mV(\'Mar\',4,12);">Mr 4:12</a>; <a onClick="return mV(\'Luk\',4,11);">Lu 4:11</a>; <a onClick="return mV(\'Luk\',21,34);">21:34</a>; <a onClick="return mV(\'Hbr\',2,1);">Heb 2:1</a>); introduces "haply" (<a onClick="return mV(\'Mat\',7,6);">Mt 7:6</a>; <a onClick="return mV(\'Mat\',13,29);">13:29</a>; <a onClick="return mV(\'Mat\',15,32);">15:32</a>; <a onClick="return mV(\'Mat\',27,64);">27:64</a>; <a onClick="return mV(\'Mar\',14,2);">Mr 14:2</a>; <a onClick="return mV(\'Luk\',3,15);">Lu 3:15</a>; <a onClick="return mV(\'Luk\',12,58);">12:58</a>; <a onClick="return mV(\'Luk\',14,8,12);">14:8, 12</a>; <a onClick="return mV(\'Act\',27,29);">Ac 27:29</a>; <a onClick="return mV(\'Hbr\',4,1);">Heb 4:1</a>); has "haply there shall be," for "lest there be" (<a onClick="return mV(\'Hbr\',3,12);">Heb 3:12</a>).``185';
isbe[4088]='Hapharaim`haf-a\'-ra\'-im (chapharayim; the King James Version Haphraim, haf-ra\'im, possibly "place of a moat"): A town in the territory of Issachar, named with Shunem and Anaharath (<a onClick="return mV(\'Jos\',19,19);">Jos 19:19</a>). Eusebius, Onomasticon identifies it with "Affarea," and places it 6 miles north of Legio-Megiddo. This position corresponds with that of the modern el-Ferriyeh, an ancient site with remarkable tombs northwest of el-Lejjun.``1';
isbe[4089]='Happen`hap\'-\'-n (qarah; sumbaino): "Happen" (from "hap"), "to fall out," "befall," etc., "come to anyone," is the translation of qarah, "to meet," etc. (<a onClick="return mV(\'1Sa\',28,10);">1Sa 28:10</a>, "There shall no punishment happen to thee," the Revised Version margin "guilt come upon thee"; <a onClick="return mV(\'2Sa\',1,6);">2Sa 1:6</a>; <a onClick="return mV(\'Est\',4,7);">Es 4:7</a>; <a onClick="return mV(\'Ecc\',2,14,15);">Ec 2:14-15</a>; <a onClick="return mV(\'Ecc\',9,11);">9:11</a>; <a onClick="return mV(\'Isa\',41,22);">Isa 41:22</a>); of qara\', "to meet," "cause to happen," etc. (<a onClick="return mV(\'2Sa\',20,1);">2Sa 20:1</a>); of hayah, "to be" (<a onClick="return mV(\'1Sa\',6,9);">1Sa 6:9</a>, "It was a chance that happened to us"); of nagha\', "to touch," "to come to" (<a onClick="return mV(\'Ecc\',8,14);">Ec 8:14</a> bis). In the New Testament it is in several instances the translation of sumbaino, "to go" or "come up together" "to happen" (<a onClick="return mV(\'Mar\',10,32);">Mr 10:32</a>; <a onClick="return mV(\'Luk\',24,14);">Lu 24:14</a>; <a onClick="return mV(\'Act\',3,10);">Ac 3:10</a>; <a onClick="return mV(\'1Cr\',10,11);">1Co 10:11</a>; <a onClick="return mV(\'1Pe\',4,12);">1Pe 4:12</a>; <a onClick="return mV(\'2Pe\',2,22);">2Pe 2:22</a>); once of ginomai, "to become," "to happen" (<a onClick="return mV(\'Rom\',11,25);">Ro 11:25</a>, the Revised Version (British and American), "befallen"). "Happeneth" occurs (<a onClick="return mV(\'Ecc\',2,15);">Ec 2:15</a>, as it happeneth to the fool" (miqreh); 2Esdras 10:6; Baruch 3:10 (ti estin)). The Revised Version (British and American) supplies "that happened" for "were done" (<a onClick="return mV(\'Luk\',24,35);">Lu 24:35</a>).`<a href="./study/isbe/search.html?string=CHANGE">CHANGE</a>`185';
isbe[4090]='Happiness`hap\'-i-nes.`<a href="./study/isbe/search.html?string=BLESSEDNESS">BLESSEDNESS</a>`1';
isbe[4091]='Happizzez`hap\'-i-zez (ha-pitstsets; the King James Version, Aphses): A priest on whom fell the lot for the 18th of the 24 courses which David appointed for the temple service (<a onClick="return mV(\'1Ch\',24,15);">1Ch 24:15</a>).``1';
isbe[4092]='Har-Magedon`har-ma-ged\'-on (Harmagedon from Hebrew har meghiddo, "Mount of Megiddo"; the King James Version Armageddon): This name is found only in <a onClick="return mV(\'Rev\',16,16);">Re 16:16</a>. It is described as the rallying-place of the kings of the whole world who, led by the unclean spirits issuing from the mouth of the dragon, the beast and the false prophet, assemble here for "the war of the great day of God, the Almighty." Various explanations have been suggested; but, as Nestle says (HDB, s.v), "Upon the whole, to find an allusion here to Megiddo is still the most probable explanation." In the history of Israel it had been the scene of never-to-be-forgotten battles. Here took place the fatal struggle between Josiah and Pharaoh-necoh (<a onClick="return mV(\'2Ki\',23,29);">2Ki 23:29</a>; <a onClick="return mV(\'2Ch\',35,22);">2Ch 35:22</a>). Long before, the hosts of Israel had won glory here, in the splendid victory over Sisera and his host (<a onClick="return mV(\'Jdg\',5,19);">Jud 5:19</a>). These low hills around Megiddo, with their outlook over the plain of Esdraelon, have witnessed perhaps a greater number of bloody encounters than have ever stained a like area of the world\'s surface. There was, therefore, a peculiar appropriateness in the choice of this as the arena of the last mighty struggle between the powers of good and evil. The choice of the hill as the battlefield has been criticized, as it is less suitable for military operations than the plain. But the thought of Gilboa and Tabor and the uplands beyond Jordan might have reminded the critics that Israel was not unaccustomed to mountain warfare. Megiddo itself was a hill-town, and the district was in part mountainous (compare Mt. Tabor, <a onClick="return mV(\'Jdg\',4,6,12);">Jud 4:6, 12</a>; "the high places of the field," <a onClick="return mV(\'Jdg\',5,18);">5:18</A>). It will be remembered that this is apocalypse. Har-Magedon may stand for the battlefield without indicating any particular locality. The attempt of certain scholars to connect the name with "the mount of congregation" in <a onClick="return mV(\'Isa\',14,13);">Isa 14:13</a> (Hommel, Genkel, etc.), and with Babylonian mythology, cannot be pronounced successful. Ewald (Die Johan. Schrift, II, 204) found that the Hebrew forms of "Har-Magedon" and "the great Rome" have the same numerical value—304. The historical persons alluded to in the passage do not concern us here.``54';
isbe[4093]='Hara`ha\'-ra (hara\'; Septuagint omits): A place named in <a onClick="return mV(\'1Ch\',5,26);">1Ch 5:26</a> along with Halah, Habor and the river of Gozan, whither the Reubenites, the Gadites and the half-tribe of Manasseh were carried by Tiglath-pileser. In <a onClick="return mV(\'2Ki\',17,6);">2Ki 17:6</a>; <a onClick="return mV(\'2Ki\',18,11);">18:11</a>, Hara is omitted, and in both, "and in the cities of the Medes" is added. Septuagint renders ore Medon, "the mountains of the Medes," which may represent Hebrew hare madhay, "mountains of Media," or, \'are madhay, "cities of Media." The text seems to be corrupt. The second word may have fallen out in <a onClick="return mV(\'1Ch\',5,26);">1Ch 5:26</a>, hare being changed to hara\'.``54';
isbe[4094]='Haradah`ha-ra\'-da, har\'-a-da (charadhah, "fearful"): A desert station of the Israelites between Mt. Shepher and Makheloth (<a onClick="return mV(\'Num\',33,24);">Nu 33:24:25</a>).`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[4095]='Haran (1)`ha\'-ran (haran):<P>(1) Son of Terah, younger brother of Abraham and Nahor, and father of Lot (<a onClick="return mV(\'Gen\',11,27);">Ge 11:27</a>). He had two daughters, Milcah and Iscah (<a onClick="return mV(\'Gen\',11,29);">Ge 11:29</a>).<P>(2) A Gershonite, of the family of Shimei (<a onClick="return mV(\'1Ch\',23,9);">1Ch 23:9</a>).``1';
isbe[4096]='Haran (2)`ha\'-ran (charan; Charhran): The city where Terah settled on his departure from Ur (<a onClick="return mV(\'Gen\',11,31);">Ge 11:31</a>f); whence Abram set out on his pilgrimage of faith to Canaan (<a onClick="return mV(\'Gen\',12,1);">Ge 12:1</a>). It was probably "the city of Nahor" to which Abraham\'s servant came to find a wife for Isaac (<a onClick="return mV(\'Gen\',24,10);">Ge 24:10</a>). Hither came Jacob when he fled from Esau\'s anger (<a onClick="return mV(\'Gen\',27,43);">Ge 27:43</a>). Here he met his bride (<a onClick="return mV(\'Gen\',29,4);">Ge 29:4</a>), and in the neighboring pastures he tended the flocks of Laban. It is one of the cities named by Rabshakeh as destroyed by the king of Assyria (<a onClick="return mV(\'2Ki\',19,12);">2Ki 19:12</a>; <a onClick="return mV(\'Isa\',37,12);">Isa 37:12</a>). Ezekiel speaks of the merchants of Haran as trading with Tyre (<a onClick="return mV(\'Eze\',27,23);">27:23</a>).<P>The name appears in Assyro-Babalonian as Charran, which means "road"; possibly because here the trade route from Damascus joined that from Nineveh to Carchemish. It is mentioned in the prism inscription of Tiglath-pileser I. It was a seat of the worship of Sin, the moon-god, from very ancient times. A temple was built by Shalmaneser II. Haran seems to have shared in the rebellion of Assur (763 BC, the year of the solar eclipse, June 15). The privileges then lost were restored by Sargon II. The temple, which had been destroyed, was rebuilt by Ashurbanipal, who was here crowned with the crown of Sin. Haran and the temple suffered much damage in the invasion of the Umman-Manda (the Medes). Nabuna\'id restored temple and city, adorning them on a lavish scale. Near Haran the Parthians defeated and slew Crassus (53 BC), and here Caracalla was assassinated (217 AD). In the 4th century it was the seat of a bishopric; but the cult of the moon persisted far into the Christian centuries. The chief temple was the scene of heathen worship until the 11th century, and was destroyed by the Mongols in the 13th.<P>The ancient city is represented by the modern Charran to the southeast of Edessa, on the river Belias, an affluent of the Euphrates. The ruins lie on both sides of the stream, and include those of a very ancient castle, built of great basaltic blocks, with square columns, 8 ft. thick, which support an arched roof some 30 ft. in height. Remains of the old cathedral are also conspicuous. No inscriptions have yet been found here, but a fragment of an Assyrian lion has been uncovered. A well nearby is identified as that where Eliezer met Rebekah.<P>In <a onClick="return mV(\'Act\',7,2,4);">Ac 7:2, 4</a>, the King James Version gives the name as Charran.``54';
isbe[4097]='Hararite`ha\'-ra-rit (ha-harari, or ha-\'arari): Literally, "mountaineer," more particularly an inhabitant of the hill country of Judah. Thus used of two heroes:<P>(1) Shammah, the son of Agee (<a onClick="return mV(\'2Sa\',23,11,33);">2Sa 23:11, 33</a>). The parallel passage, <a onClick="return mV(\'1Ch\',11,34);">1Ch 11:34</a>, has "Shage" in place of "Shammah."<P>(2) Ahiam, the son of Sharar the Ararite" (<a onClick="return mV(\'2Sa\',23,33);">2Sa 23:33</a>). In <a onClick="return mV(\'1Ch\',11,35);">1Ch 11:35</a>, "Sacar" for Sharar as here.``1';
isbe[4098]='Harbona; Harbonah`har-bo\'-na (charebhona\' charebhonah): One of the seven eunuchs who served Ahasuerus and to whom was given the command to bring Queen Esther before the king (<a onClick="return mV(\'Est\',1,10);">Es 1:10</a>). It was he who suggested that Haman be hanged upon the self-same gallows that he had erected for Mordecai (<a onClick="return mV(\'Est\',7,9);">Es 7:9</a>). Jewish tradition has it that Harbona had originally been a confederate of Haman, but, upon noting the failure of the latter\'s plans, abandoned him. The Persian equivalent of the name means "donkey-driver."``1';
isbe[4099]='Harbour`har\'-ber. Used figuratively of God in <a onClick="return mV(\'Joe\',3,16);">Joe 3:16</a> the King James Version margin, (Hebrew) "place of repair, or, harbour" (the King James Version "hope," the Revised Version (British and American) "refuge").`<a href="./study/isbe/search.html?string=HAVEN">HAVEN</a>; <a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';
isbe[4100]='Hard Sayings; Hard Sentences`sa\'-ingz; sen\'-ten-siz: In <a onClick="return mV(\'Dan\',5,12);">Da 5:12</a> the King James Version (Aramaic \'aqiahan), the Revised Version (British and American) "dark sentences," of enigmatic utterances which preternatural wisdom was needed to interpret; in <a onClick="return mV(\'Jhn\',6,60);">Joh 6:60</a> (skleros...ho logos), of sayings (Christ\'s words at Capernaum about eating His flesh and drinking His blood) difficult for the natural mind to understand (compare <a onClick="return mV(\'Jhn\',6,52);">6:52</A>).``1';
