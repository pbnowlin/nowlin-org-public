he covenant" (<a onClick="return mV(\'Exd\',21,\'1-\');">Ex 21</a>; <a onClick="return mV(\'Exd\',22,\'1-\');">22</a>; <a onClick="return mV(\'Exd\',23,\'1-\');">23</a>; <a onClick="return mV(\'Exd\',24,4,7);">24:4, 7</a>). He wrote "the words of this law" of Deuteronomy at Moab, "in a book, until they were finished" (<a onClick="return mV(\'Deu\',31,9,24,26);">De 31:9, 24, 26</a>). This was given to the priests to be put by the side of the ark for preservation (<a onClick="return mV(\'Deu\',31,25,26);">De 31:25-26</a>). Other notices occur of the writing of Moses (<a onClick="return mV(\'Exd\',17,14);">Ex 17:14</a>; <a onClick="return mV(\'Num\',33,2);">Nu 33:2</a>; <a onClick="return mV(\'Deu\',31,19,22);">De 31:19, 22</a>; compare <a onClick="return mV(\'Num\',11,26);">Nu 11:26</a>). The song of Miriam, and the snatches of song in <a onClick="return mV(\'Num\',21,\'1-\');">Nu 21</a>, the first (perhaps all) quoted from the "book of the Wars of Yahweh" (<a onClick="return mV(\'Num\',21,14);">Nu 21:14</a>ff), plainly belong to Mosaic times. In this connection it should be noticed that the discourses and law of Deuteronomy imply the history and legislation of the critical JE histories (see below). The priestly laws (Leviticus, Numbers) bear so entirely the stamp of the wilderness that they can hardly have originated anywhere else, and were probably then, or soon after, written down. Joshua, too, is presumed to be familiar with writing (<a onClick="return mV(\'Jos\',8,\'30-35\');">Jos 8:30-35</a>; compare <a onClick="return mV(\'Deu\',27,8);">De 27:8</a>), and is stated to have written his farewell address "in the book of the law of God" (<a onClick="return mV(\'Jos\',24,26);">Jos 24:26</a>; compare <a onClick="return mV(\'Jos\',1,7,8);">Jos 1:7-8</a>). These statements already imply the beginning of a sacred literature.<P>(c) Judges:<P>The song of Deborah (<a onClick="return mV(\'Jdg\',5,\'1-\');">Jud 5</a>) is an indubitably authentic monument of the age of the Judges, and the older parts of Judges, at least, must have been nearly contemporary with the events which they record. A knowledge of writing among the common people seems implied in <a onClick="return mV(\'Jdg\',8,14);">Jud 8:14</a> (American Revised Version, margin). Samuel, like Joshua, wrote "in a book" (<a onClick="return mV(\'1Sa\',10,25);">1Sa 10:25</a>), and laid it up, evidently among other writings, "before Yahweh."<P>(d) Monarchy:<P>The age of David and Solomon was one of high development in poetical and historical composition: witness the elegies of David (<a onClick="return mV(\'2Sa\',1,17);">2Sa 1:17</a>ff; <a onClick="return mV(\'2Sa\',3,33,34);">3:33-34</a>), and the finely-finished narrative of David\'s reign (<a onClick="return mV(\'2Sa\',9,\'1-\');">2Sa 9-20</a>), the so-called "Jerusalem-Source," admitted to date "from a period very little later than that of the events related" (Driver, LOT, 183). There were court scribes and chroniclers. David and the Monarchy: David, as befits his piety and poetical and musical gifts (compare on this POT, 440ff), is credited with laying the foundations of a sacred psalmody (<a onClick="return mV(\'2Sa\',23,1);">2Sa 23:1</a>ff; see <a href="./study/isbe/search.html?string=PSALMS">PSALMS</a>), and a whole collection of psalms (<span class="noTag">Pss 1-72</span>, with exclusion of the distinct collection, (<a onClick="return mV(\'Psa\',42,\'1-\');">Psalms 42-50</a>)), once forming a separate book (compare <a onClick="return mV(\'Psa\',72,20);">Ps 72:20</a>), are, with others, ascribed to him by their titles (<a onClick="return mV(\'Psa\',1,\'1-\');">Psalms 1</a>; <a onClick="return mV(\'Psa\',2,\'1-\');">2</a>; <a onClick="return mV(\'Psa\',10,\'1-\');">10</a> are untitled). It is hardly credible that a tradition like this can be wholly wrong, and a Davidic basis of the Psalter may safely be assumed. Numerous psalms, by their mention of the "king" (as <a onClick="return mV(\'Psa\',2,\'1-\');">Psalms 2</a>; <a onClick="return mV(\'Psa\',18,\'1-\');">18</a>; <a onClick="return mV(\'Psa\',20,\'1-\');">20</a>; <a onClick="return mV(\'Psa\',21,\'1-\');">21</a>; <a onClick="return mV(\'Psa\',28,\'1-\');">28</a>; <a onClick="return mV(\'Psa\',33,\'1-\');">33</a>; <a onClick="return mV(\'Psa\',45,\'1-\');">45</a>; <a onClick="return mV(\'Psa\',61,\'1-\');">61</a>; <a onClick="return mV(\'Psa\',63,\'1-\');">63</a>; <a onClick="return mV(\'Psa\',72,\'1-\');">72</a>; <a onClick="return mV(\'Psa\',101,\'1-\');">101</a>; <a onClick="return mV(\'Psa\',110,\'1-\');">110</a>), are naturally referred to the period of the monarchy (some, as <a onClick="return mV(\'Psa\',18,\'1-\');">Ps 18</a> certainly, Davidic). Other groups of psalms are referred to the temple guilds (Sons of Korah, Asaph).<P>(e) Wisdom Literature—History:<P>Solomon is renowned as founder of the Wisdom literature and the author of Proverbs (<a onClick="return mV(\'1Ki\',4,32);">1Ki 4:32</a>; <a onClick="return mV(\'Pro\',1,1);">Pr 1:1</a>; <a onClick="return mV(\'Pro\',10,1);">10:1</a>; <a onClick="return mV(\'Ecc\',12,9);">Ec 12:9</a>; Ec itself appears to be late), and of the Song of Solomon (<a onClick="return mV(\'Sgs\',1,1);">So 1:1</a>). The "men of Hezekiah" are said to have copied put a collection of his proverbs (<a onClick="return mV(\'Pro\',25,1);">Pr 25:1</a>; see <a href="./study/isbe/search.html?string=PROVERBS">PROVERBS</a>). Here also may be placed the Book of Job. Hezekiah\'s reign appears to have been one of literary activity: to it, probably, are to be referred certain of the Psalms (e.g. <a onClick="return mV(\'Psa\',46,\'1-\');">Psalms 46</a>; <a onClick="return mV(\'Psa\',48,\'1-\');">48</a>; compare Perowne, Delitzsch). In history, during the monarchy, the prophets would seem to have acted as the "sacred historiographers" of the nation. From their memoirs of the successive reigns, as the later books testify (<a onClick="return mV(\'1Ch\',29,29);">1Ch 29:29</a>; <a onClick="return mV(\'2Ch\',9,29);">2Ch 9:29</a>; <a onClick="return mV(\'2Ch\',12,15);">12:15</a>, etc.), are compiled most of the narratives in our canonical writings (hence the name "former prophets"). The latest date in 2Ki is 562 BC, and the body of the book is probably earlier.<P>(f) Prophecy:<P>(i) Assyrian Age:<P>With the rise of written prophecy a new form of literature enters, called forth by, and vividly mirroring, the religious and political conditions of the closing periods of the monarchy in Israel and Judah (see <a href="./study/isbe/search.html?string=PROPHECY">PROPHECY</a>). On the older view, Obadiah and Joel stood at the head of the series in the pre-Assyrian period (9th century), and this seems the preferable view still. On the newer view, these prophets are late, and written prophecy begins in the Assyrian period with Amos (Jeroboam II, circa 750 BC) and Hosea (circa 745-735). When the latter prophet wrote, Samaria was tottering to its fall (721 BC). A little later, in Judah, come Isaiah (circa 740-690) and Micah (circa 720-708). Isaiah, in the reigns of Uzziah, Jotham, Ahaz and Hezekiah, is the greatest of the prophets in the Assyrian age, and his ministry reaches its climax in the deliverance of Jerusalem from Sennacherib (<a onClick="return mV(\'2Ki\',18,\'1-\');">2Ki 18</a>; <a onClick="return mV(\'2Ki\',19,\'1-\');">19</a>; <a onClick="return mV(\'Isa\',36,\'1-\');">Isa 36</a>; <a onClick="return mV(\'Isa\',37,\'1-\');">Isa 37</a>). It is a question whether some oracles of an Isaianic school are not mingled with the prophet\'s own writings, and most scholars now regard the 2nd part of the book (<span class="noTag">Isa 40-66</span>) as exilian or (in part) post-exilian in date. The standpoint of much in these chapters is certainly in the Exile; whether the composition of the whole can be placed there is extremely doubtful (see <a href="./study/isbe/search.html?string=ISAIAH">ISAIAH</a>). Nahum, who prophesies against Nineveh, belongs to the very close of this period (circa 660).<P>(ii) Chaldean Age:<P>The prophets Zephaniah (under Josiah, circa 630 BC) and Habakkuk (circa 606) may be regarded as forming the transition to the next—the Chaldean—period. The Chaldeans (unnamed in Zephaniah) are advancing but are not yet come (<a onClick="return mV(\'Hab\',1,6);">Hab 1:6</a>). The great prophetic figure here, however, is Jeremiah, whose sorrowful ministry, beginning in the 13th year of Josiah (626 BC), extended through the succeeding reigns till after the fall of Jerusalem (586 BC). The prophet elected to remain with the remnant in the land, and shortly after, troubles having arisen, was forcibly carried into Egypt (<a onClick="return mV(\'Jer\',43,\-\'1);">Jer 43</a>). Here also he prophesied (<a onClick="return mV(\'Jer\',43,\'1-\');">Jer 43</a>; <a onClick="return mV(\'Jer\',44,\'1-\');">Jer 44</a>). From the reign of Jehoiakim, Jeremiah consistently declared the success of the Chaldean arms, and foretold the 70 years\' captivity (<a onClick="return mV(\'Jer\',25,\'12-14\');">Jer 25:12-14</a>). Baruch acted as his secretary in writing out and editing his prophecies (<a onClick="return mV(\'Jer\',36,\'1-\');">Jer 36</a>; <a onClick="return mV(\'Jer\',45,\'1-\');">Jer 45</a>).<P>(g) Josiah\'s Reformation:<P>A highly important event in this period was Josiah\'s reformation in his 18th year (621 BC), and the discovery, during repairs of the temple, of "the book of the law," called also "the book of the covenant" and "the law of Moses" (<a onClick="return mV(\'2Ki\',22,8);">2Ki 22:8</a>; <a onClick="return mV(\'2Ki\',23,2,24,25);">23:2, 24-25</a>). The finding of this book, identified by most authorities with the Book of Deuteronomy, produced an extraordinary sensation. On no side was there the least question that it was a genuine ancient work. Jeremiah, strangely, makes no allusion to this discovery, but his prophecies are deeply saturated with the ideas and style of Deuteronomy.<P>(h) Exilian and Post-Exilian:<P>The bulk of <span class="noTag">Isa 40-66</span> belongs, at least in spirit, to the Exile, but the one prophet of the Exile known to us by name is the priestly Ezekiel. Carried captive under Jehoiachin (597 BC), Ezekiel labored among his fellow-exiles for at least 22 years (<a onClick="return mV(\'Eze\',1,2);">Eze 1:2</a>; <a onClick="return mV(\'Eze\',29,17);">29:17</a>). A man of the strongest moral courage, his symbolic visions on the banks of the Chebar alternated with the most direct expostulation, exhortation, warning and promise. In the description of an ideal temple and its worship with which his book closes (chapters <a onClick="return mV(\'Eze\',40,\'40-\');">40-48</a>), critics think they discern the suggestion of the Levitical code.<P>(i) Daniel, etc.:<P>After Ezekiel the voice of prophecy is silent till it revives in Daniel, in Babylon, under Nebuchadnezzar and his successors. Deported in 605 BC, Daniel rose to power, and "continued" until the 1st year of Cyrus (536 BC; <a onClick="return mV(\'Dan\',1,21);">Da 1:21</a>). Criticism will have it that his prophecies are product of the Maccabean age, but powerful considerations on the other side are ignored (see <a href="./study/isbe/search.html?string=DANIEL">DANIEL</a>). Jonah may have been written about this time, though the prophet\'s mission itself was pre- Assyrian (9th century). The rebuilding of the temple after the return, under Zerubbabel, furnished the occasion for the prophecies of Haggai and Zechariah (520 BC). Scholars are disposed to regard only <a onClick="return mV(\'Zec\',1,\'1-\');">Zec 1-8</a> as belonging to this period—the remainder being placed earlier or later. Malachi, nearly century after (circa 430), brings up the rear of prophecy, rebuking unfaithfulness, and predicting the advent of the "messenger of the covenant" (<a onClick="return mV(\'Mal\',3,1,2);">Mal 3:1-2</a>). To this period, or later, belong, besides post-exilian psalms (e.g. <a onClick="return mV(\'Psa\',124,\'1-\');">Psalms 124</a>; <a onClick="return mV(\'Psa\',126,\'1-\');">126</a>), the books of Ezra, Nehemiah, Chronciles, Esther and apparently Ecclesiastes.<P>(j) Preexilic Bible:<P>If, in this rapid sketch, the facts are correctly represented, it will be apparent that, in opposition to prevalent views, large body of sacred literature existed (laws, histories, psalms, wisdom-books, prophecies), and was recognized long before the Exile. God\'s ancient people had "Scriptures"—had a Bible—if not yet in collected form. This is strikingly borne out by the numerous Old Testament passages referring to what appears to be a code of sacred writings in the hands of the pious in Israel. Such are the references to, and praises of, the "law" and "word" of God in many of the Psalms (e.g. <a onClick="return mV(\'Psa\',1,\'1-\');">Psalm 1</a>; <a onClick="return mV(\'Psa\',19,\'1-\');">19</a>; <a onClick="return mV(\'Psa\',119,\'1-\');">119</a>; <a onClick="return mV(\'Psa\',12,6);">12:6</a>; <a onClick="return mV(\'Psa\',17,4);">17:4</a>; <a onClick="return mV(\'Psa\',18,21,22);">18:21-22</a>), with the references to God\'s known "words," "ways," "commandments," "statutes," in other books of the Old Testament (<a onClick="return mV(\'Job\',8,8);">Job 8:8</a>; <a onClick="return mV(\'Hsa\',8,12);">Ho 8:12</a>; <a onClick="return mV(\'Dan\',9,2);">Da 9:2</a>). In brief, Scriptures, which must have contained records of God\'s dealings with His people, a knowledge of which is constantly presupposed, "laws" of God for the regulation of the heart and conduct, "statutes," "ordinances," "words" of God, are postulate of a great part of the Old Testament.<P>(2) Critical views.<P>The account of the origin and growth of the Old Testament above presented is in marked contrast with that given in the textbooks of the newer critical schools. The main features of these critical views are sketched in the article <a href="./study/isbe/search.html?string=CRITICISM">CRITICISM</a> (which see); here a brief indication will suffice. Generally, the books of the Old Testament are brought down to late dates; are regarded as highly composite; the earlier books, from their distance from the events recorded, are deprived of historical worth. Neither histories nor laws in the Pentateuch belong to the Mosaic age: Joshua is a "romance"; Judges may embody ancient fragments, but in bulk is unhistorical. The earliest fragments of Israelite literature are lyric pieces like those preserved in <a onClick="return mV(\'Gen\',4,23,24);">Ge 4:23-24</a>; <a onClick="return mV(\'Gen\',9,\'25-27\');">9:25-27</a>; <a onClick="return mV(\'Num\',21,\'1-\');">Nu 21</a>; the Song of Deborah (<a onClick="return mV(\'Jdg\',5,\'1-\');">Jud 5</a>) is probably genuine. Historical writing begins about the age of David or soon thereafter. The folklore of the Hebrews and traditions of the Mosaic age began to be reduced to writing about the 9th century BC.<P>(a) The Pentateuch:<P>Our present Pentateuch (enlarged to a "Hexateuch," including Josh) consists of 4 main strands (themselves composite), the oldest of which (called Jahwist (Jahwist), from its use of the name Yahweh) goes back to about 850 BC. This was Judean. A parallel history book (called E, from its use of the name Elohim, God) was produced in the Northern kingdom about a century later (circa 750). Later still these two were united (JE). These histories, "prophetic" in spirit, were originally attributed to individual authors, distinguished by minute criteria of style: the more recent fashion is to regard them as the work of "schools." Hitherto the only laws known were those of the (post-Mosaic) Book of the Covenant (<a onClick="return mV(\'Eze\',20,\'1-\');">Ex 20-23</a>). Later, in Josiah\'s reign, the desire for centralization of worship led to the composition of the Book of Deuteronomy. This, secreted in the temple, was found by Hilkiah (<a onClick="return mV(\'2Ki\',22,\'1-\');">2Ki 22</a>), and brought about the reformation of Josiah formerly mentioned. Deuteronomy (D), thus produced, is the third stra nd in the Pentateuchal compilation. With the destruction of the city and temple, under the impulse of Ezekiel, began a new period of law-construction, now priestly in spirit. Old laws and usages were codified; new laws were invented; the history of institutions was recast; finally, the extensive complex of Levitical legislation was brought into being, clothed with a wilderness dress, and ascribed to Moses. This elaborate Priestly Code (PC), with its accompanying history, was brought from Babylon by Ezra, and, united with the already existing JE and D, was given forth by him to the restored community at Jerusalem (444 BC; <a onClick="return mV(\'Neh\',8,\'1-\');">Ne 8</a>) as "the law of Moses." Their acceptance of it was the inauguration of "Judaism."<P>(b) Histories:<P>In its theory of the Pentateuch the newer criticism lays down the determinative positions for its criticism of all the remaining books of the Old Testament. The historical books show but a continuation of the processes of literary construction exemplified in the books ascribed to Moses. The Deuteronomic element, e.g. in Joshua, Judges, 1 and 2 Samuel, 1 and 2 Kings, proves them, in these parts, to be later than Josiah, and historically untrustworthy. The Levitical element in 1 and 2 Chronicles demonstrates its pictures of David and his successors to be distorted and false. The same canon applies to the prophets. Joel, e.g. must be post-exilian, because it presupposes the priestly law. The patriarchal and Mosaic histories being subverted, it is not permitted to assume any high religious ideas in early Israel. David, therefore, could not have written the Psalms. Most, if not practically all, of these are post-exilian.<P>(c) Psalms and Prophets:<P>Monotheism came in—at least first obtained recognition—through Amos and Hosea. The prophets could not have the foresight and far-reaching hopes seen in their writings: these passages, therefore, must be removed. Generally the tendency is to put dates as low as possible and very many books, regarded before as preexilian, are carried down in whole or part, to exilian, post-exilian, and even late Greek times (Priestly Code, Psalter, Job, Proverbs, Canticles, Ecclesiastes, Second Isaiah, Joel, Lamentations). Daniel is Maccabean and unhistorical (circa 168-167 BC).<P>It is not proposed here to discuss this theory, <b>which is not accepted in the present article</b>, and is considered elsewhere (see <a href="./study/isbe/search.html?string=CRITICISM">CRITICISM</a>; <a href="./study/isbe/search.html?string=PENTATEUCH">PENTATEUCH</a>). The few points calling for remark relate to canonical acceptance.<P>(3) Formation of the Canon.<P>The general lines of the completed Jewish canon have already been sketched, and some light has now been thrown on the process by which the several books obtained a sacred authority. As to the actual stages in the formation of the canon opinions again widely diverge (see <a href="./study/isbe/search.html?string=CANON+OF+THE+OLD+TESTAMENT">CANON OF THE OLD TESTAMENT</a>).<P>(a) Critical Theory:<P>On theory at present in favor, no collections of sacred books were made prior to the return from Babylon. The only books that had authority before the Exile were, perhaps, the old Book of the Covenant, and, from Josiah\'s time, the Book of Deuteronomy. Both, after the return, were, on this theory, embodied, with the JE histories, and the Priestly Code, in Ezra\'s completed Book of the Law (with Joshua(?)), in which, accordingly, the foundation of a canon was laid. The fivefold division of the law was later. Subsequently, answering to the 2nd division of the Jewish canon, a collection was made of the prophetic writings. As this includes books which, on the critical view, go down to Greek times (Jon; <a onClick="return mV(\'Zec\',9,\'1-\');">Zec 9-14</a>), its completion cannot be earlier than well down in the 3rd century BC. Latest of all came the collection of the "Hagiographa"—a division of the canon, on theory, kept open to receive additions certainly till the 2nd century, some think after. Into it were received such late writings as Ecclesiastes, the Maccabean Psalms, Daniel. Even then one or two books (Ecclesiastes, Esther) remained subjects of dispute.<P>(b) More Positive View:<P>It will appear from the foregoing that this theory is not here accepted without considerable modification. If the question be asked, What constituted a right to a place in the canon? the answer can hardly be other than that suggested by Josephus in the passage formerly quoted—a real or supposed inspiration in the author of the book. Books were received if men had the prophetic spirit (in higher or lower degree: that, e.g. of wisdom); they ceased to be received when the succession of prophets was thought to fail (after Malachi). In any case the writings of truly inspired men (Moses, the prophets, psalmists) were accepted as of authority. It was sought, however, to be shown above, that such books, many of them, already existed from Moses down, long before the Exile (the law, collections of psalms, of proverbs, written prophecies: to what end did the prophets write, if they did not mean their prophecies to be circulated and preserved?); and such writings, to the godly who knew and used them, had the full value of Scripture. A canon began with the first laying up of the "book of the law" before Yahweh (<a onClick="return mV(\'Deu\',31,25,26);">De 31:25-26</a>; <a onClick="return mV(\'Jos\',24,26);">Jos 24:26</a>). The age of Ezra and Nehemiah, therefore, is not that of the beginning, but, as Jewish tradition rightly held (Josephus; 2Macc 2:13; Talmud), rather that of the completion, systematic delimitation, acknowledgment and formal close of the canon. The divisions of "law, prophets, and holy writings" would thus have their place from the beginning, and be nearly contemporaneous. The Samaritans accepted only the 5 books of the law, with apparently Joshua (see <a href="./study/isbe/search.html?string=SAMARITAN+PENTATEUCH">SAMARITAN PENTATEUCH</a>).<P>(c) Close of Canon:<P>There is no need for dogmatism as to an absolute date for the close of the canon. If inspired voices continued to be heard, their utterances were entitled to recognition. Books duly authenticated might be added, but the non-inclusion of such as a book as Sirach (Ecclesiasticus: in Hebrew, circa 200 BC) shows that the limits of the canon were jealously guarded, and the onus of proof rests on those who affirm that there were such books. Calvin, e.g. held that there were Maccabean Psalms. Many modern scholars do the same, but it is doubtful if they are right. Ecclesiastes is thought on linguistic grounds to be late, but it and other books need not be so late as critics make them. Daniel is confidently declared to be Maccabean, but there are weighty reasons for maintaining a Persian date (see <a href="./study/isbe/search.html?string=DANIEL">DANIEL</a>). As formerly noticed, the threefold division into "the law, the prophets, and the rest (ta loipa, a definite number) of the books" is already attested in the Prologue to Sirach.<P>2. The New Testament:<P>Critical controversy, long occupied with the Old Testament, has again keenly attached itself to the New Testament, with similar disturbing results (see <a href="./study/isbe/search.html?string=CRITICISM">CRITICISM</a>). Extremer opinions may be here neglected, and account be taken only of those that can claim reasonable support. The New Testament writings are conveniently grouped into the historical books (Gospels and Acts); Epistles (Pauline and other); and a Prophetic book (Rev). In order of writing, the Epistles, generally, are earlier than the Gospels, but in order of subject, the Gospels naturally claim attention first.<P>(1) Historical Books:<P>The main facts about the origin of the Gospels can perhaps be distinguished from the complicated literary theories which scholars are still discussing (see <a href="./study/isbe/search.html?string=GOSPELS">GOSPELS</a>). The first three Gospels, known as the Synoptics, evidently embody a common tradition, and draw from common sources. The Fourth Gospel—that of John—presents problems by itself.<P>(a) The Synoptics:<P>The former—the Synoptic Gospels (Matthew, Mark, Luke)—fall in date well within the apostolic age, and are, in the 2nd century, uniformly connected with the authors whose names they bear, Mark is spoken of as "the interpreter of Peter" (Papias, in HE iii.39); Luke is the well-known companion of Paul. A difficulty arises about Matthew, whose Gospel is stated to have been written in Aramaic (Papias, ut supra, etc.), while the gospel bearing his name is in Greek. The Greek gospel seems at least to have been sufficiently identified with the apostle to admit of the early church always treating it as his.<P>The older theory of origin assumed an oral basis for all 3 Gospels. The tendency in recent criticism is to distinguish two main sources:<P>(1) Mark, the earliest gospel, a record of the preaching of Peter;<P>(2) a collection of the sayings and discourses of Jesus, attributed to Matthew (the Eusebian Logia, now called Q); with<P>(3) a source used by Luke in the sections peculiar to himself—the result of his own investigations (<a onClick="return mV(\'Luk\',1,\'1-4\');">Lu 1:1-4</a>).<P>Matthew and Luke are supposed to be based on Mark and the Logia (Q); in Luke\'s case with the addition of his special material. Oral tradition furnished what remains. A simpler theory may be to substitute for (1) a Petrine tradition already firmly fixed while yet the apostles were working together in Jerusalem. Peter, as foremost spokesman, would naturally stamp his own type upon the oral narratives of Christ\'s sayings and doings (the Mark type), while Matthew\'s stories, in part written, would be the chief source for the longer discourses. The instruction imparted by the apostles and those taught by them would everywhere be made the basis of careful catechetical teaching, and records of all this, more or less fragmentary, would be early in circulation (<a onClick="return mV(\'Luk\',1,\'1-4\');">Lu 1:1-4</a>). This would explain the Petrine type of narrative, and the seeming dependence of Matthew and Luke, without the necessity of supposing a direct use of Mark. So important a gospel could hardly be included in the "attempts" of <a onClick="return mV(\'Luk\',1,1);">Lu 1:1</a>.<P>(b) Fourth Gospel:<P>The Fourth Gospel (John), the genuineness of which is assumed (see <a href="./study/isbe/search.html?string=JOHN,+GOSPEL+F">JOHN, GOSPEL OF</a>), differs entirely in character and style. It is less a narrative than a didactic work, written to convince its readers that Jesus is "the Son of God" (<a onClick="return mV(\'Jhn\',20,31);">Joh 20:31</a>). The gospel may be presumed to have been composed at Ephesus, in the last years of the apostle\'s residence there. With this its character corresponds. The other gospels had long been known; John does not therefore traverse the ground already covered by them. He confines himself chiefly to matters drawn from his personal recollections: the Judean ministry, the visits of Christ to Jerusalem, His last private discourses to His disciples. John had so often retold, and so long brooded over, the thoughts and words of Jesus, that they had become, in a manner, part of his own thought, and, in reproducing them, he necessarily did so with a subjective tinge, and in a partially paraphrastic and interpretative manner. Yet it is truly the words, thoughts and deeds of his beloved Lord that he narrates. His gospel is the needful complement to the others—the "spiritual" gospel.<P>(c) Acts:<P>The Acts narrates the origin and early fortunes of the church, with, as its special motive (compare <a onClick="return mV(\'Act\',1,8);">Ac 1:8</a>), the extension of the gospel to the Gentiles through the labors of Paul. Its author is Luke, Paul\'s companion, whose gospel it continues (<a onClick="return mV(\'Act\',1,1);">Ac 1:1</a>). Certain sections—the so-called "we-sections" (<a onClick="return mV(\'Act\',16,\'10-17\');">Ac 16:10-17</a>; <a onClick="return mV(\'Act\',20,\'5-15\');">20:5-15</a>; <a onClick="return mV(\'Act\',21,\'1-18\');">21:1-18</a>; <a onClick="return mV(\'Act\',27,\'1-\');">27:1</s>-<a onClick="return mV(\'Act\',28,\'1-16\');">28:16</a>)—are transcribed directly from Luke\'s journal of Paul\'s travels. The book closes abruptly with Paul\'s 2 years\' imprisonment at Rome (<a onClick="return mV(\'Act\',28,30,31);">Ac 28:30-31</a>; 60-61 AD), and not a hint is given of the issue of the imprisonment—trial, liberation or death. Does this mean that a 3rd "treatise" was contemplated? Or that the book was written while the imprisonment still continued? (thus now Harnack). If the latter, the Third Gospel must be very early.<P>(2) The Epistles.<P>(a) Pauline:<P>Doubt never rested in the early church on the 13 epistles of Paul. Following upon the rejection by the "Tubingen" school of all the epistles but 4 (Romans,1, 2 Corinthians, Galatians), the tide of opinion has again turned strongly in favor of their genuineness. An exception is the Pastoral epistles (1, 2 Timothy, Titus), still questioned by some on insufficient grounds (see <a href="./study/isbe/search.html?string=PASTORAL+EPISTLES">PASTORAL EPISTLES</a>). The epistles, called forth by actual needs of the churches, are a living outpouring of the thoughts and feelings of the mind and heart of the apostle in relation to his converts. Most are letters to churches he himself had founded (1 Corinthians, 2 Corinthians, Galatians, Ephesians(?), Philippians, 1 Thessalonians, 2 Thessalonains): two are to churches he had not himself visited, but with which he stood in affectionate relations (Romans, Colossians); one is purely personal (Philemon); three are addressed to individuals, but with official responsibilities (1 Timothy, 2 Timothy, Titus). The larger number were written during his missionary labors, and reflect his personal situation, anxieties and companionships at the places of their composition; four are epistles of the 1st Roman imprisonment (Ephesians, Philippians, Colossians, Philemon): 2 Timothy is a voice from the dungeon, in his 2nd imprisonment, shortly before his martyrdom. Doctrine, counsel, rebuke, admonition, tender solicitude, ethical instruction, prayer, thanksgiving, blend in living fusion in their contents. So marvelous a collection of letters, on such magnificent themes, was never before given to the world.<P>The earliest epistles, in point of date, are generally held to be those to the Thessalonians, written from Corinth (52, 53 AD). The church, newly-founded, had passed through much affliction (<a onClick="return mV(\'1Th\',1,6);">1Th 1:6</a>; <a onClick="return mV(\'1Th\',2,14);">2:14</a>; <a onClick="return mV(\'1Th\',3,3,4);">3:3-4</a>, etc.), and Paul writes to comfort and exhort it. His words about the Second Coming (<a onClick="return mV(\'1Th\',4,13);">1Th 4:13</a>ff) led to mistaken expectations and some disorders. His second epistle was written to correct these problems (<a onClick="return mV(\'2Th\',2,\'1-3\');">2Th 2:1-3</a>; <a onClick="return mV(\'2Th\',3,6);">3:6</a>, etc.).<P>Corinth itself received the next epistles—the 1st called forth by reports received at Ephesus of grave divisions and irregularities (<a onClick="return mV(\'1Cr\',1,11);">1Co 1:11</a>; <a onClick="return mV(\'1Cr\',3,3);">3:3</a>; <a onClick="return mV(\'1Cr\',11,18);">11:18</a>ff, etc.), joined with pride of knowledge, doctrinal heresy (<a onClick="return mV(\'1Cr\',15,12);">1Co 15:12</a>ff), and at least one case of gross immorality (chapter <a onClick="return mV(\'1Cr\',5,\'1-\');">5</a>) in the church; the 2nd, written at Philippi, expressing joy at the repentance of the offender, and removing the severe sentence that had been passed upon him (<a onClick="return mV(\'2Cr\',2,\'1-10\');">2Co 2:1-10</a>; compare <a onClick="return mV(\'1Cr\',5,3,4);">1Co 5:3-4</a>), likewise vindicating Paul\'s own apostleship 2Co (chapters <a onClick="return mV(\'2Cr\',10,\'1-\');">10-13</a>). The date of both <span class="noTag">is</span> 57 AD. 1Co contains the beautiful hymn on love (chapter <a onClick="return mV(\'1Cr\',1,\'1-\');">13</a>), and the noble chapter on resurrection (chapter <a onClick="return mV(\'1Cr\',15,\'1-\');">15</a>).<P>In the following year (58 BC) Paul penned from Corinth the Epistle to the Romans—the greatest of his doctrinal epistles. In it he develops his great theme of the impossibility of justification before God through works of law (<a onClick="return mV(\'Rom\',1,\'1-\');">Ro 1-3</a>), and of the Divine provision for human salvation in a "righteousness of God" in Christ Jesus, received through faith. He exhibits first the objective side of this redemption in the deliverance from condemnation effected through Christ\'s reconciling death (<a onClick="return mV(\'Rom\',3,\'1-\');">Ro 3-5</a>); then the subjective side, in the new life imparted by the spirit, giving deliverance from the power of sin (<a onClick="return mV(\'Rom\',6\'1-\');">Ro 6-8</a>). A discussion follows of the Divine sovereignty in God\'s dealings with Israel, and of the end of these dealings (<a onClick="return mV(\'Rom\',9,\'1-\');">Ro 9-11</a>), and the epistle concludes with practical exhortations, counsels to forbearance and greetings (<a onClick="return mV(\'Rom\',12,\'1-\');">Ro 12-16</a>).<P>Closely connected with the Epistle to the Romans is that to the Galatians, in which the same truths are handled, but now with a polemical intent in expostulation and reproach. The Galatian churches had apostatized from the gospel of faith to Jewish legalism, and the apostle, sorely grieved, writes this powerful letter to rebuke their faithlessness, and recall them to their allegiance to the truth. It is reasonable to suppose that the two epistles are nearly related in place and time. The question is complicated, however, by the dispute which has arisen as to whether the churches intended are those of Northern Galatia (the older view; compare Conybeare and Howson, Lightfoot) or those of Southern Galatia (Sir Wm. Ramsay), i.e. the churches of Derbe, Lystra, Iconium and Antioch, in Paul\'s time embraced in the Roman province of Galatia (see <a href="./study/isbe/search.html?string=GALATIA">GALATIA</a>; <a href="./study/isbe/search.html?string=GALATIANS">GALATIANS</a>). If the latter view is adopted, date and place are uncertain; if the former, the epistle may have been written from Ephesus (circa 57 AD).<P>The 4 epistles of the imprisonment all fall within the years 60, 61 AD. That to the Philipplans, warmly praising the church, and exhorting to unity, possibly the latest of the group, was sent by the hand of Epaphroditus, who had come to Rome with a present from the Philippian church, and had there been overtaken by a serious illness (<a onClick="return mV(\'Phl\',2,\'25-30\');">Php 2:25-30</a>; <a onClick="return mV(\'Phl\',4,\'15-18\');">4:15-18</a>). The remaining 3 epistles (Ephesians, Colossians, and Philemon) were written at one time, and were carried to their destinations by Epaphras. Ephesians and Colossians are twin epistles, similar in thought and style, extolling the preeminence of Christ, but it is doubtful whether the former was not really a "circular" epistle, or even, perhaps, the lost Epistle to the Laodiceans (<a onClick="return mV(\'Col\',4,16);">Col 4:16</a>; see <a href="./study/isbe/search.html?string=LAODICEANS,+EPISTLE+TO+THE">LAODICEANS, EPISTLE TO THE</a>). The Colossian epistle has in view an early form of Gnostic heresy (compare Lightfoot, Galatians). Philemon is a personal letter to a friend of the apostle\'s at Colosse, whose runaway slave, Onesimus, now a Christian, is being sent back to him with warm commendations.<P>See <a href="./study/isbe/search.html?string=CAPTIVITY+EPISTLES">CAPTIVITY EPISTLES</a>.<P>Latest from Paul\'s pen are the Pastoral Epistles (1 Timothy, 2 Timothy, Titus), implying his liberation from his first imprisonment, and a new period of missionary labor in Ephesus, Macedonia and Crete (see <a href="./study/isbe/search.html?string=PASTORAL+EPISTLES">PASTORAL EPISTLES</a>). Timothy was left at Ephesus (<a onClick="return mV(\'1Ti\',1,3);">1Ti 1:3</a>), Titus at Crete (<a onClick="return mV(\'Tts\',1,5);">Tit 1:5</a>), for the regulation and superintendence of the churches. The epistles, the altered style of which shows the deep impress of advancing years and changed conditions, contain admonitions to pastoral duty, with warnings as to perils that had arisen or would arise. 1 Timothy and Titus were written while the apostle was still at liberty (63 AD); 2 Timothy is from his Roman prison, when his case had been partly heard, and the end was impending (<a onClick="return mV(\'2Ti\',4,6,7);">2Ti 4:6-7</a>).<P>(b) Epistle to the Hebrews:<P>These are the Pauline Epistles proper. The Epistle to the Hebrews, though ascribed to Paul in the title of the King James Version, is not really his. It is an early writing (probably before the destruction of Jerusalem, 70 AD) of some friend of the apostle\'s (in Italy, <a onClick="return mV(\'Hbr\',13,23,24);">Heb 13:23-24</a>), designed, by a reasoned exhibition of the superiority of Jesus to Moses and the Levitical priesthood, and of the fulfillment of Old Testament types and institutions in His person and sacrifice, to remove the difficulties of Jewish Christians, who clung with natural affection to their temple and divinely appointed ritual. It was included by Eusebius, with others in the East (not, however, by Origen), among the epistles of Paul: in the West the Pauline authorship was not admitted. Many, nevertheless, with Origen, upheld a connection with Paul ("the thoughts are Paul\'s"). Ideas and style suggest an Alexandrian training: hence Luther\'s conjecture of Apollos as the writer. There can be no certainty on the subject. The value of the Epistle is unimpaired, whoever was the author.<P>(c) Catholic Epistles:<P>Of the seven so-called "Catholic" Epistles, James and Jude are by "brethren" of the Lord (James, "the Lord\'s brother," was head of the church at Jerusalem, <a onClick="return mV(\'Act\',15,13);">Ac 15:13</a>; <a onClick="return mV(\'Act\',21,18);">21:18</a>; <a onClick="return mV(\'Gal\',1,19);">Ga 1:19</a>, etc.); Peter and John, to whom the others were ascribed, were apostles. James and 1 Peter are addressed to the Jews of the Dispersion (<a onClick="return mV(\'1Pe\',1,1);">1Pe 1:1</a>; <a onClick="return mV(\'Jam\',1,1);">Jas 1:1</a>). The doubts respecting certain of these writings have already been mentioned. The early date and acceptance of James is attested by numerous allusions (Clement of Rome, Barnabas, Hermas, Didache). Many regard it as the earliest of the epistles—before Paul\'s. Its tone is throughout practical. The seeming conflict with Paul on faith and works, which led Luther to speak slightingly of it, is only verbal. Paul, too, held that a dead faith avails nothing (<a onClick="return mV(\'1Cr\',13,2);">1Co 13:2</a>; <a onClick="return mV(\'Gal\',5,6);">Ga 5:6</a>). 1 John, like 1 Peter, was undisputed (if the Fourth Gospel is genuine, 1 John is), and, on internal grounds, the shorter epistles (2 John, 3 John) need not be doubted (see <a href="./study/isbe/search.html?string=JOHN,+THE+EPISTLES+OF">JOHN, THE EPISTLES OF</a>). Jude, rugged in style, with allusions to Jewish Apocalypses (<a onClick="return mV(\'Jud\',1,9,24);">1:9, 24</a>), is well attested, and 2 Peter seems to found on it. The last-named epistle must rely for acceptance on its own claim (<a onClick="return mV(\'2Pe\',1,1,8);">2Pe 1:1, 8</a>), and on internal evidence of sincerity. It is to be observed that, though late in being noticed, it never appears to have been treated as spurious. The style certainly differs from 1 Peter; this may be due to the use of an amanuensis. If accepted, it must be placed late in Peter\'s life (before 65 AD). 1 Peter and Jude, in that case, must be earlier (see <a href="./study/isbe/search.html?string=CATHOLIC+EPISTLES">CATHOLIC EPISTLES</a>).<P>(3) Prophecy.<P>The Book of Revelation:<P>The one prophetic book of the New Testament—the apocalyptic counterpart of Daniel in the Old Testament—is the Book of Revelation. The external evidence for the Johannine authorship is strong (see <a href="./study/isbe/search.html?string=APOCALYPSE">APOCALYPSE</a>). Tradition and internal evidence ascribe it to the reign of Domitian (circa 95 AD). Its contents were given in vision in the isle of Patmos (<a onClick="return mV(\'Rev\',1,9);">Re 1:9</a>). The theory which connects it with the reign of Nero through the supposed fitness of this name to express the mystic number 666 is entirely precarious (compare Salmon, Introduction to New Testament, 245-54). The main intent is to exhibit in symbolic form the approaching conflicts of Christ and His church with anti-Christian powers—with secular world-power (Beast), with intellectual anti-Christianism (False Prophet), with ecclesiastical anti-Christianism (Woman)—these conflicts issuing in victory and a period of triumph, preluding, after a sharp, final struggle, the last scenes (resurrection, judgment), and the eternal state. When the visions are taken, not as poetic imaginings, but as true apocalyptic unveilings, the change in style from the gospel, which may be regarded as already written, can readily be understood. These mighty revelations in Patmos brought about, as by volcanic force, a tremendous upheaval in the seer\'s soul, breaking through all previous strata of thought and feeling, and throwing everything into a new perspective. On the resultant high keynote: "Amen: Come, Lord Jesus" (<a onClick="return mV(\'Rev\',22,20);">Re 22:20</a>), the New Testament closes.<P>(4) New Testament Canon.<P>The principal steps by which the books now enumerated were gradually formed into a New Testament "Canon," have been indicated in previous sections. The test of canonicity here, as in the Old Testament, is the presence of inspiration. Some would prefer the word "apostolic," which comes to the same thing. All the writings above reckoned were held to be the works of apostles or of apostolic men, and on this ground were admitted into the list of books having authority in the church. Barnabas (circa 100-120 AD) already quotes <a onClick="return mV(\'Mat\',20,16);">Mt 20:16</a> with the formula "it is written." Paul quotes as "scripture" (<a onClick="return mV(\'1Ti\',5,18);">1Ti 5:18</a>) a passage found only in Luke (<a onClick="return mV(\'Luk\',10,7);">Lu 10:7</a>). Paul\'s Epistles are classed with "other scriptures" in <a onClick="return mV(\'2Pe\',3,16);">2Pe 3:16</a>. Post-apostolic Fathers draw a clear distinction between their own writings and those of apostles like Paul and Peter (Polycarp, Ignatius, Barnabas). The Fathers of the close of the 2nd century treat the New Testament writings as in the fullest degree inspired (compare Westcott, Introduction to Study of Gospels, Appendix B). An important impulse to the formation of a definite canon came from the Gnostic Marcion (circa 140 AD), who made a canon for himself in 2 parts, "Gospel" and "Apostolicon," consisting of one gospel (a mutilated Lk) and 10 epistles of Paul (excluding Pastorals). A challenge of this kind had to be taken up, and lists of New Testament writings began to be made (Melito, Muratorian Fragment, etc.), with the results previously described. By the commencement of the 4th century unanimity had practically been attained as regards even the Antilegomena. At the Council of Nicea (325 AD), Westcott says, "the Holy Scriptures of the Old and New Testaments were silently admitted on all sides to have a final authority" (Bible in Church, 155).`<a href="./study/isbe/search.html?string=CANON+OF+THE+NEW+TESTAMENT">CANON OF THE NEW TESTAMENT</a>`1';
isbe[1487]='Bible, the, V. Inspiration, Unity/Spiritual Purpose`1. Scripture a Unity:<P>Holy Scripture is not simply a collection of religious books: still less does it consist of mere fragments of Jewish and Christian literature. It belongs to the conception of Scripture that, though originating "by divers portions and in divers manners" (<a onClick="return mV(\'Hbr\',1,1);">Heb 1:1</a>), it should yet, in its completeness, constitute a unity, evincing, in the spirit and purpose that bind its parts together, the Divine source from which its revelation comes. The Bible is the record of God\'s revelations of Himself to men in successive ages and dispensations (<a onClick="return mV(\'Eph\',1,\'8-10\');">Eph 1:8-10</a>; <a onClick="return mV(\'Eph\',3,\'5-9\');">3:5-9</a>; <a onClick="return mV(\'Col\',1,25,26);">Col 1:25-26</a>), till the revelation culminates in the advent and work of the Son, and the mission of the Spirit. It is this aspect of the Bible which constitutes its grand distinction from all collections of sacred writings—the so-called "Bibles" of heathen religions—in the world. These, as the slightest inspection of them shows, have no unity. They are accumulations of heterogeneous materials, presenting, in their collocation, no order, progress, or plan. The reason is, that they embody no historical revelation working out a purpose in consecutive stages from germinal beginnings to perfect close. The Bible, by contrast, is a single book because it embodies such a revelation, and exhibits such a purpose. The unity of the book, made up of so many parts, is the attestation of the reality of the revelation it contains.<P>2. The Purpose of Grace:<P>This feature of spiritual purpose in the Bible is one of the most obvious things about it (compare POT, 30ff). It gives to the Bible what is sometimes termed its "organic unity." The Bible has a beginning, middle and end. The opening chapters of Genesis have their counterpart in the "new heaven and new earth" and paradise restored of the closing chapters of Revelation (<a onClick="return mV(\'Rev\',21,\'1-\');">21</a>; <a onClick="return mV(\'Rev\',22,\'1-\');">22</a>). Man\'s sin is made the starting-point for disclosures of God\'s grace. The patriarchal history, with its covenants and promises, is continued in the story of the Exodus and the events that follow, in fulfillment of these promises. Deuteronomy recapitulates the lawgiving at Sinai. Josua sees the people put in possession of the promised land. Backsliding, rebellion, failure, do not defeat God\'s purpose, but are overruled to carry it on to a surer completion. The monarchy is made the occasion of new promises to the house of David (<a onClick="return mV(\'2Sa\',7,\'1-\');">2Sa 7</a>). The prophets root themselves in the past, but, at the very hour when the nation seems sinking in ruin; hold out bright hopes of a greater future in the extension of God\'s kingdom to the Gentiles, under Messiah\'s rule. A critical writer, Kautzsch, has justly said: "The abiding value of the Old Testament lies above all in this, that it guarantees to us with absolute certainty the fact and the process of a Divine plan and way of salvation, which found its conclusion and fulfillment in the new covenant, in the person and work of Jesus Christ" (Bleibende Bedeutung des Altes Testament, 22, 24, 28-29, 30-31).<P>Fulfilment in Christ.<P>How truly all that was imperfect, transitional, temporary, in the Old Testament was brought to realization and completion in the redemption and spiritual kingdom of Christ need not here be dwelt upon. Christ is the prophet, priest and king of the New Covenant. His perfect sacrifice, "once for all," supersedes and abolishes the typical sacrifices of the old economy (<a onClick="return mV(\'Hbr\',9,\'1-\');">Heb 9-10</a>). His gift of the Spirit realizes what the prophets had foretold of God\'s law being written in men\'s hearts (<a onClick="return mV(\'Jer\',31,\'31-34\');">Jer 31:31-34</a>; <a onClick="return mV(\'Jer\',32,39,40);">32:39-40</a>; <a onClick="return mV(\'Eze\',11,19,20);">Eze 11:19-20</a>, etc.). His kingdom is established on moveless foundations, and can have no end (<a onClick="return mV(\'Phl\',2,\'9-11\');">Php 2:9-11</a>; <a onClick="return mV(\'Hbr\',12,28);">Heb 12:28</a>; <a onClick="return mV(\'Rev\',5,13);">Re 5:13</a>, etc.). In tracing the lines of this redeeming purpose of God, brought to light in Christ, we gain the key which unlocks the inmost meaning of the whole Bible. It is the revelation of a "gospel."<P>3. Inspiration:<P>"Inspiration" is a word round which many debates have gathered. If, however, what has been said is true of the Bible as the record of a progressive revelation, of its contents as the discovery of the will of God for man\'s salvation, of the prophetic and apostolic standing of its writers, of the unity of spirit and purpose that pervades it, it will be difficult to deny that a quite peculiar presence, operation, and guidance of the Spirit of God are manifest in its production. The belief in inspiration, it has been seen, is implied in the formation of these books into a sacred canon. The full discussion of the subject belongs to a special article. (see <a href="./study/isbe/search.html?string=INSPIRATION">INSPIRATION</a>). Biblical Claim.<P>Here it need only be said that the claim for inspiration in the Bible is one made in fullest measure by the Bible itself. It is not denied by any that Jesus and His apostles regarded the Old Testament Scriptures as in the fullest sense inspired. The appeal of Jesus was always to the Scriptures, and the word of Scripture was final with Him. "Have ye not read?" (<a onClick="return mV(\'Mat\',19,4);">Mt 19:4</a>). "Ye do err, not knowing the scriptures, nor the power of God" (<a onClick="return mV(\'Mat\',22,29);">Mt 22:29</a>). This because "God" speaks in them (<a onClick="return mV(\'Mat\',19,4);">Mt 19:4</a>). Prophecies and psalms were fulfilled in Him (<a onClick="return mV(\'Luk\',18,31);">Lu 18:31</a>; <a onClick="return mV(\'Luk\',22,37);">22:37</a>; <a onClick="return mV(\'Luk\',24,27,44);">24:27, 44</a>). Paul esteemed the Scriptures "the oracles of God" (<a onClick="return mV(\'Rom\',3,2);">Ro 3:2</a>). They are "God-inspired" (<a onClick="return mV(\'2Ti\',3,16);">2Ti 3:16</a>). That New Testament prophets and apostles were not placed on any lower level than those of the Old Testament is manifest from Paul\'s explicit words regarding himself and his fellow-apostles. Paul never faltered in his claim to be "an apostle of Christ Jesus through the will of God" (<a onClick="return mV(\'Eph\',1,1);">Eph 1:1</a>, etc.)—"separated unto the gospel of God "(<a onClick="return mV(\'Rom\',1,1);">Ro 1:1</a>)—who had received his message, not from man, but by "revelation" from heaven (<a onClick="return mV(\'Gal\',1,11,22);">Ga 1:11, 22</a>). The "mystery of Christ" had "now been revealed unto his holy apostles and prophets in the Spirit," in consequence of which the church is declared to be "built upon the foundation of the apostles and prophets, Christ Jesus himself being the chief corner stone" (<a onClick="return mV(\'Eph\',2,20);">Eph 2:20</a>; <a onClick="return mV(\'Eph\',3,5);">3:5</a>).<P>Marks of Inspiration.<P>It might be shown that these claims made by New Testament writers for the Old Testament and for themselves are borne out by what the Old Testament itself teaches of prophetic inspiration, of wisdom as the gift of God\'s spirit, and of the light, holiness, saving virtue and sanctifying power continually ascribed to God\'s "law," "words," "statutes," "commandments," "judgments" (see above). This is the ultimate test of "inspiration"—that to which Paul likewise appeals—its power to "make wise unto salvation through faith which is in Christ Jesus" (<a onClick="return mV(\'2Ti\',3,15);">2Ti 3:15</a>)—its profitableness "for teaching, for reproof, for correction, for instruction which is in righteousness" (<a onClick="return mV(\'2Ti\',3,16);">2Ti 3:16</a>)—all to the end "that the man of God may be complete, furnished completely unto every good work" (<a onClick="return mV(\'2Ti\',3,17);">2Ti 3:17</a>). Nothing is here determined as to "inerrancy" in minor historical, geographical, chronological details, in which some would wrongly put the essence of inspiration; but it seems implied that at least there is no error which can interfere with or nullify the utility of Scripture for the ends specified. Who that brings Scripture to its own tests of inspiration, will deny that, judged as a whole, it fulfils them?<P>4. Historical Influence of the Bible:<P>The claim of the Bible to a Divine origin is justified by its historical influence. Regarded even as literature, the Bible has an unexampled place in history. Ten or fifteen manuscripts are thought a goodly number for an ancient classic; the manuscripts of whole or parts of the New Testament are reckoned by thousands, the oldest going back to the 4th or 5th century. Another test is translation. The books of the New Testament had hardly begun to be put together before we find translations being made of them in Latin, Syriac, Egyptian, later into Gothic and other barbarous tongues (see <a href="./study/isbe/search.html?string=ABILENE">VERSIONS</a>). In the Middle Ages, before the invention of printing, translations were made into the vernacular of most of the countries of Europe. Today there is not a language in the civilized world, hardly a language among uncivilized tribes, wherever missions have gone, into which this word of God has not been rendered. Thanks to the labors of Bible Societies, the circulation of the Bible in the different countries of the world in recent years outstrips all previous records. No book has ever been so minutely studied, has had so many books written on it, has founded so vast a literature of hymns, liturgies, devotional writings, sermons, has been so keenly assailed, has evoked such splendid defenses, as the Bible. Its spiritual influence cannot be estimated. To tell all the Bible has been and done for the world would be to rewrite in large part the history of modern civilization. Without it, in heathen lands, the arm and tongue of the missionary would be paralyzed. With it, even in the absence of the missionary, wondrous results are often effected. In national life the Bible is the source of our highest social and national aspirations. Professor Huxley, though an agnostic, argued for the reading of the Bible in the schools on this very ground. "By the study of what other book," he asked, "could children be so much humanized, and made to feel that each figure in that vast historical procession fills, like themselves, but a momentary space in the interval between two eternities, and earns the blessings or the curses of all times, according to its effort to do good and to hate evil, even as they are also earning their payment for their work?" (Critiques and Addresses, 61).<P>VI. Addenda.<P>A few notes may be added, in closing, on special points not touched in the preceding sections.<P>1. Chapters and Verses:<P>Already in pre-Talmudic times, for purposes of reading in the synagogues, the Jews had larger divisions of the law into sections called Para-shahs, and of the prophets into similar sections called Haphtarahs. They had also smaller divisions into Pecuqim, corresponding nearly with our verses. The division into chapters is much later (13th century). It is ascribed to Cardinal Hugo de St Caro (died 1248); by others to Stephen Langton, archbishop of Canterbury (died 1227). It was adopted into the Vulgate, and from this was transferred by R. Nathan (circa 1440) to the Hebrew Bible (Bleek, Keil). Verses are marked in the Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) as early as 1558. They first appear in the New Testament in Robert Stephens\' edition of the Greek Testament in 1551. Henry Stephens, Robert\'s son, reports that they were devised by his father during a journey on horseback from Paris to Lyons.<P>2. The King James Version and Revised Version:<P>The King James Version of 1611, based in part on earlier English Versions, especially Tyndale\'s, justly holds rank as one of the noblest monuments of the English language of its own, or any, age. Necessarily, however, the Greek text used by the translators ("Textus Receptus"), resting on a few late manuscripts, was very imperfect. With the discovery of more ancient manuscripts, and multiplication of appliances for criticism, the need and call for a revised text and translation became urgent. Finally, at the instance of the Convocation of the Province of Canterbury, the task of revision was undertaken by Committees representing the best English and American scholarship. Their labors resulted in the publication, in 1881, of the Revised New Testament, and in 1885, of the Revised Old Testament (a revised edition of the Apocrypha was published in 1896). The preferencest of the American Revisers were printed in an appendix, a pledge being given that no further changes should be made for 14 years. The English Companies were disbanded shortly after 1885, but the American Committee, adhering to its own renderings, and believing that further improvements on the English the Revised Version (British and American) were possible, continued its organization and work. This issued, in 1901, in the production of the American Standard Revised Version, which aims at greater consistency and accuracy in a number of important respects, and is supplied, also, with carefully selected marginal references (see <a href="./study/isbe/search.html?string=AMERICAN+REVISED+VERSION">AMERICAN REVISED VERSION</a>). Little could be done, in either the English Revised Version or the American Standard Revised Version, in the absence of reliable data for comparison, with the text of the Old Testament, but certain obvious corrections have been made, or noted in the margin.<P>3. Helps to Study:<P>In recent years abundant helps have been furnished, apart from Commentaries and Dictionaries, for the intelligent study of the English Bible. Among such works may be mentioned the Oxford Helps to the Study of the Bible; the valuable Aids to Bible Students (Eyre and Spottiswoode, 1898); Dr. Angus\' Bible Handbook (revised by Green); A. S. Peake\'s Guide to Biblical Study (1897); W. F. Adeney\'s How to Read the Bible (1896); R. C. Moulton\'s The Modern Reader\'s Bible (1907); The Sunday School Teachers\' Bible (1875); The Variorum Reference Bible and Variorum Teachers\' Bible (1880); Weymouth\'s New Testament in Modern Speech (1909); The Twentieth Century New Testament (Westcott and Hort\'s text, 1904); S. Lloyd\'s The Corrected English New Testament (Bagster, 1905).<P>LITERATURE.<P>Compare articles in the Bible Dicts., specially Sanday on "Bible," and Dobschutz on "The Bible in the Church," in Hastings\' Encyclopedia of Religion and Ethics, II; Westcott, The Bible in the Church (1875); W. H. Bennett, A Primer of the Bible (1897); A. F. Kirkpatrick, The Divine Library of the Old Testament (1896); J. Eadie, The English Bible; works on Introduction (Driver, etc.); books mentioned above under "Helps"; B. B. Warfield in Princeton Theological Review (October, 1910); C. A. Briggs, General Introduction to the Study of Holy Scripture (Scribners, 1899); W. H. Green, General Introduction to the Old Testament (Scribners, 1899); E. C. Bissell, The Pentateuch: Its Origin and Structure (Scribners, 1885); Zahn, Introduction to the New Testament.``132';
