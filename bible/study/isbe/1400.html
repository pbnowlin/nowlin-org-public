of travel notice only one Bethsaida.<P>(iii) The east coast of the sea was definitely attached to Galilee in AD 84, and Ptolemy (circa 140) places Julius in Galilee. It is therefore significant that only the Fourth Gospel speaks of "Bethsaida of Galilee."<P>(iv) There could hardly have been two Bethsaidas so close together.<P>But:<P>(i) It is not said that Jesus came hither that he might leave the territory of Antipas for that of Philip; and in view of <a onClick="return mV(\'Mar\',6,30);">Mr 6:30</a>ff, and <a onClick="return mV(\'Luk\',9,10);">Lu 9:10</a>ff, the inference from <a onClick="return mV(\'Mat\',14,13);">Mt 14:13</a> that he did so, is not warranted.<P>(ii) The Bethsaida of medieval writers was evidently on the west of the Jordan. If it lay on the east it is inconceivable that none of them should have mentioned the river in this connection.<P>(iii) If the 4th Gospel was not written until well into the 2nd century, then the apostle was not the author; but this is a very precarious assumption. John, writing after 84 AD, would hardly have used the phrase "Bethsaida of Galilee" of a place only recently attached to that province, writing, as he was, at a distance from the scene, and recalling the former familiar conditions.<P>(iv) In view of the frequent repetition of names in Palestine the nearness of the two Bethsaidas raises no difficulty. The abundance of fish at each place furnished a good reason for the recurrence of the name.``54';
isbe[1458]='Bethsamos`beth-sa\'-mos.`<a href="./study/isbe/search.html?string=BETHASMOTH">BETHASMOTH</a>`1';
isbe[1459]='Bethsura; Bethsuron`beth-su\'-ra (Baithsoura (1Macc 4:29, etc.)), (2Macc 11:5 the Revised Version (British and American)): The Greek form of the name <a href="./study/isbe/search.html?string=BETH-ZUR">BETH-ZUR</a> (which see).``1';
isbe[1460]='Bethuel (1)`be-thu\'-el (bethu\'el; "dweller in God"): A son of Nahor and Milcah, Abraham\'s nephew, father of Laban and Rebekah (<a onClick="return mV(\'Gen\',22,23);">Ge 22:23</a>; <a onClick="return mV(\'Gen\',24,15,24,47,50);">24:15, 24, 47, 50</a>; <a onClick="return mV(\'Gen\',25,20);">25:20</a>; <a onClick="return mV(\'Gen\',28,2,5);">28:2, 5</a>). In the last-named passage, he is surnamed "the Syrian." The only place where he appears as a leading character in the narrative is in connection with Rebekah\'s betrothal to Isaac; and even here, his son Laban stands out more prominently than he—a fact explainable on the ground of the custom which recognized the right of the brother to take a special interest in the welfare of the sister (compare <a onClick="return mV(\'Gen\',34,5,21,25);">Ge 34:5, 21, 25</a>; <a onClick="return mV(\'2Sa\',13,20,22);">2Sa 13:20, 22</a>). Ant, I, xvi, 2 states that Bethuel was dead at this time.``77';
isbe[1461]='Bethuel (2)`be-thu\'-el, beth\'-u-el (bethu\'el, "destroyed of God"): A town of Simeon (<a onClick="return mV(\'1Ch\',4,30);">1Ch 4:30</a>), the same as Bethul (<a onClick="return mV(\'Jos\',19,4);">Jos 19:4</a>), and, probably, as the Beth-el of <a onClick="return mV(\'1Sa\',30,27);">1Sa 30:27</a>.``1';
isbe[1462]='Bethul`beth\'-ul, be\'-thul (bethul):`<a href="./study/isbe/search.html?string=BETHUEL">BETHUEL</a>; <a href="./study/isbe/search.html?string=CHESIL">CHESIL</a>`1';
isbe[1463]='Bethulia`be-thu\'-li-a (Baithouloua): A town named only in the Book of Judith (4:6; 6:10ff; 7:1ff; 8:3; 10:6; 12:7; 15:3,6; 16:21ff). From these references we gather that it stood beside a valley, on a rock, at the foot of which was a spring, not far from Jenin; and that it guarded the passes by which an army might march to the south. The site most fully meeting these conditions is that of Sanur. The rock on the summit of which it stands rises sheer from the edge of Merj el-Ghariq, on the main highway, some 7 miles south of Jenin. Other identifications are suggested: Conder favoring Mithiliyeh, a little farther north; while the writer of the article "Bethulia" in Encyclopedia Biblica argues for identification with Jerusalem.``54';
isbe[1464]='Betimes`be-timz\':In the sense of "early" is the translation of two Hebrew words:<P>(1) shakham, a root meaning "to incline the shoulder to a load," hence "to load up," "start early": in <a onClick="return mV(\'Gen\',26,31);">Ge 26:31</a> "they rose up betimes in the morning," also in <a onClick="return mV(\'2Ch\',36,15);">2Ch 36:15</a> (the American Standard Revised Version "early");<P>(2) of shachar, a root meaning "to dawn" in <a onClick="return mV(\'Job\',8,5);">Job 8:5</a>; <a onClick="return mV(\'Job\',24,5);">24:5</a>, the American Standard Revised Version "diligently," and in <a onClick="return mV(\'Pro\',13,24);">Pro 13:24</a>, "chasteneth him betimes."<P>In the Apocrypha (Sirach 6:36) "betimes" is the translation of orthizo, literally, "to rise early in the morning," while in Bel and the Dragon verse 16 the same word is translated "betime."<P>In other cases the King James Version "betimes" appears as "before the time" (Sirach 51:30); "early" (1Macc 4:52; 11:67); "the mourning" (1Macc 5:30).``89';
isbe[1465]='Betolion`be-to\'-li-on (Betolio (Codex Alexandrinus), or (Codex Vaticanus) Betolio; the King James Version Betolius, be-to\'-li-us): A town the people of which to the number of 52 returned from Babylon with Zerubbabel (1Esdras 5:21). It corresponds to Bethel in <a onClick="return mV(\'Ezr\',2,28);">Ezr 2:28</a>.``1';
isbe[1466]='Betomesthaim; Betomasthaim`be-to-mes\'-tha-im, be-to-mes\'-tham the King James Version Betomestham, (Betomesthaim (Judith 4:6)): the King James Version Betomasthem (Baitornasthaim (Judith 15:4)): The place is said to have been "over against Jezreel, in the face of (i. e eastward of) the plain that is near Dothan" It can hardly be Deir Massin, which lies west of the plain. The district is clearly indicated, but no identification is yet possible.``1';
isbe[1467]='Betonim`bet\'-o-nim, be-to\'-nim (betonim; Botanei or Botanin): A town east of the Jordan in the territory of Gad (<a onClick="return mV(\'Jos\',13,26);">Jos 13:26</a>). It may be identical with Batneh, about 3 miles southwest of es-salt.``1';
isbe[1468]='Betray`be-tra\' (ramah; paradidomi): In the Old Testament only once (<a onClick="return mV(\'1Ch\',12,17);">1Ch 12:17</a>). David warns those who had deserted to him from Saul: "If ye be come to betray me to mine adversaries...the God of our fathers look thereon." The same Hebrew word is elsewhere translated "beguile" (<a onClick="return mV(\'Gen\',29,25);">Ge 29:25</a>; <a onClick="return mV(\'Jos\',9,22);">Jos 9:22</a>), "deceive" (<a onClick="return mV(\'1Sa\',19,17);">1Sa 19:17</a>; <a onClick="return mV(\'1Sa\',28,12);">28:12</a>; <a onClick="return mV(\'2Sa\',19,26);">2Sa 19:26</a>; <a onClick="return mV(\'Pro\',26,19);">Pr 26:19</a>; <a onClick="return mV(\'Lam\',1,19);">La 1:19</a>).<P>In the New Testament, for paradidomi: 36 times, of the betrayal of Jesus Christ, and only 3 times besides (<a onClick="return mV(\'Mat\',24,10);">Mt 24:10</a>; <a onClick="return mV(\'Mar\',13,12);">Mr 13:12</a>; <a onClick="return mV(\'Luk\',21,16);">Lu 21:16</a>) of kinsmen delivering up one another to prosecution. In these three places the Revised Version (British and American) translates according to the more general meaning, "to deliver up," and also (in <a onClick="return mV(\'Mat\',17,22);">Mt 17:22</a>; <a onClick="return mV(\'Mat\',20,18);">20:18</a>; <a onClick="return mV(\'Mat\',26,16);">26:16</a>; <a onClick="return mV(\'Mar\',14,10,21);">Mr 14:10, 21</a>; <a onClick="return mV(\'Luk\',22,4,6);">Lu 22:4, 6</a>) where it refers to the delivering up of Jesus. The Revisers\' idea was perhaps to retain "betray" only in direct references to Judas\' act, but they have not strictly followed that rule. Judas\' act was more than that of giving a person up to the authorities; he did it under circumstances of treachery which modified its character:<P>(a) he took advantage of his intimate relation with Jesus Christ as a disciple to put Him in the hands of His enemies;<P>(b) he did it stealthily by night, and<P>(c) by a kiss, an act which professed affection and friendliness;<P>(d) he did it for money, and<P>(e) he knew that Jesus Christ was innocent of any crime (<a onClick="return mV(\'Mat\',27,4);">Mt 27:4</a>).``145';
isbe[1469]='Betrayers`be-tra\'-ers (prodotai, "betrayers," "traitors"): Stephen charged the Jews with being betrayers of the Righteous One (<a onClick="return mV(\'Act\',7,52);">Ac 7:52</a>) i.e. as having made Judas\' act their own; compare <a onClick="return mV(\'Luk\',6,16);">Lu 6:16</a>: "Judas Iscariot, who became a traitor;" <a onClick="return mV(\'2Ti\',3,4);">2Ti 3:4</a>, "traitors."``1';
isbe[1470]='Betroth`be-troth\', be-troth\' (\'dras): On betrothal as a social custom see <a href="./study/isbe/search.html?string=MARRIAGE">MARRIAGE</a>. Hosea, in his great parable of the prodigal wife, surpassed only by a greater Teacher\'s parable of the Prodigal Son, uses betrothal as the symbol of Yahweh\'s pledge of His love and favor to penitent Israel (<a onClick="return mV(\'Hsa\',2,19,20);">Ho 2:19-20</a>). In <a onClick="return mV(\'Exd\',21,8,9);">Ex 21:8-9</a> the Revised Version (British and American) renders "espouse" for the "betroth" of the King James Version, the context implying the actual marriage relation.``1';
isbe[1471]='Between the Testaments`<b>I. THE PERIOD IN GENERAL</b><P><b>II. A GLANCE AT CONTEMPORANEOUS HISTORY</b><P class="in15">1. The Egyptian Empire<P class="in15">2. Greece<P class="in15">3. Rome<P class="in15">4. Asia<P><b>III. HISTORICAL DEVELOPMENTS</b><P class="in15">1. The Persian Period<P class="in15">2. The Alexandrian Period<P class="in15">3. The Egyptian Period<P class="in15">4. The Syrian Period<P class="in15">5. The Maccabean Period<P class="in15">6. The Roman Period<P><b>IV. INTERNAL DEVELOPMENTS IN THIS PERIOD</b><P class="in15">1. Literary Activity<P class="in30">(a) The Apocrypha<P class="in30">(b) Pseudepigrapha<P class="in30">(c) The Septuagint<P class="in15">2. Spiritual Conditions<P class="in15">3. Parties<P class="in15">4. Preparation for Christianity<hr /><P>As the title indicates, the historical period in the life of Israel extends from the cessation of Old Testament prophecy to the beginning of the Christian era.<P>I. The Period in General.<P>The Exile left its ineffaceable stamp on Judaism as well as on the Jews. Their return to the land of their fathers was marked by the last rays of the declining sun of prophecy. With Malachi it set. Modern historical criticism has projected some of the canonical books of the Bible far into this post-exilic period. Thus Kent (HJP, 1899), following the lead of the Wellhausen-Kuenen hypothesis, with all its later leaders, has charted the period between 600 BC, the date of the first captivity, to 160 BC, the beginning of the Hasmonean period of Jewish history, in comparative contemporaneous blocks of double decades. Following the path of Koster, the historical position of Ezra and Nehemiah is inverted, and the former is placed in the period 400-380 BC, contemporaneously with Artaxerxes II; Joel is assigned to the same period; portions of Isaiah (chapters 63-66; 24-27) are placed about 350 BC; Zechariah is assigned to the period 260-240, and Daniel is shot way down the line into the re ign of the Seleucids, between 200 and 160 BC. Now all this is very striking and no doubt very critical, but the ground of this historical readjustment is wholly subjective, and has the weight only of a hypothetical conjecture. Whatever may be our attitude to the critical hypothesis of the late origin of some of the Old Testament literally, it seems improbable that any portion of it could have reached far into the post-exilic period. The interval between the Old and the New Testaments is the dark period in the hist ory of Israel. It stretches itself out over about four centuries, during which there was neither prophet nor inspired writer in Israel. All we know of it we owe to Josephus, to some of the apocryphal books, and to scattered references in Greek and Latin historians. The seat of empire passed over from the East to the West, from Asia to Europe. The Persian Empire collapsed, under the fierce attacks of the Macedonians, and the Greek Empire in turn gave way to the Roman rule.<P>II. A Glance at Contemporaneous History.<P>For the better understanding of this period in the history of Israel, it may be well to pause for a moment to glance at the wider field of the history of the world in the centuries under contemplation, for the words "fullness of time" deal with the all-embracing history of mankind, for whose salvation Christ appeared, and whose every movement led to its realization.<P>1. The Egyptian Empire:<P>In the four centuries preceding Christ, The Egyptian empire, the oldest and in many respects the most perfectly developed civilization of antiquity, was tottering to its ruins. The 29th or Mendesian Dynasty, made place, in 384 BC, for the 30th or Sebennitic Dynasty, which was swallowed up, half a century later, by the Persian Dynasty. The Macedonian or 32nd replaced this in 332 BC, only to give way, a decade later, to the last or 33rd, the Ptolemaic Dynasty. The whole history of Egypt in this period was therefore one of endless and swiftly succeeding changes. In the Ptolemaic Dynasty there was a faint revival of the old glory of the past, but the star of empire had set for Egypt, and the mailed hand of Rome finally smote down a civilization whose beginnings are lost in the dim twilight of history. The Caesarian conquest of 47 BC was followed, 17 years later, by the annexation of Egypt to the new world-power, as a Roman province. Manetho\'s history is the one great literary monument of Egyptian history in this period. Her priests had been famous for their wisdom, to which Lycurgus and Solon, the Greek legislators, had been attracted, as well as Pythagoras and Plato, the world\'s greatest philosophers.<P>2. Greece:<P>In Greece also the old glory was passing away. Endless wars sapped the strength of the national life. The strength of Athens and Sparta, of Corinth and Thebes had departed, and when about the beginning of our period, in 337 BC, the congress of Greek states had elected Philip of Macedon to the hegemony of united Greece, the knell of doom sounded for all Greek liberty. First Philip and after him Alexander wiped out the last remnants of this liberty, and Greece became a fighting machine for the conquest of the world in the meteoric career of Alexander the Great. But what a galaxy of illustrious names adorn the pages of Greek history, in this period, so dark for Israel! Think of Aristophanes and Hippocrates, of Xenophon and Democritus, of Plato and Apelies, of Aeschines and Demosthenes, of Aristotle and Praxiteles and Archimedes, all figuring, amid the decay of Greek liberty, in the 4th and 3rd centuries before Christ! Surely if the political glory of Greece had left its mark on the ages, its intellectual brilliancy is their pride.<P>3. Rome:<P>Rome meanwhile was strengthening herself, by interminable wars, for the great task of world-conquest that lay before her. By the Latin and Samnite and Punic wars she trained her sons in the art of war, extended her territorial power and made her name dreaded everywhere. Italy and north Africa, Greece and Asia Minor and the Northernbarbarians were conquered in turn. Her intellectual brilliancy was developed only when the lust of conquest was sated after a fashion, but in the century immediately preceding the Christian era we find such names as Lucretius and Hortentius, Cato and Cicero, Sallust and Diodorus Siculus, Virgil and Horace. At the close of the period between the Testaments, Rome had become the mistress of the world and every road led to her capital.<P>4. Asia:<P>In Asia the Persian empire, heir to the civilization and traditions of the great Assyrian-Babylonian world-power, was fast collapsing and was ultimately utterly wiped out by the younger Greek empire and civilization. In far-away India the old ethnic religion of Brahma a century or more before the beginning of our period passed through the reformatory crisis inaugurated by Gatama Buddha or Sakya Mouni, and thus Buddhism, one of the great ethnic religions, was born. Another reformer of the Tauistic faith was Confucius, the sage of China, a contemporary of Buddha, while Zoroaster in Persia laid the foundations of his dualistic world-view. In every sense and in every direction, the period between the Testaments was therefore one of political and intellectual ferment.<P>III. Historical Developments.<P>As regards Jewish history, the period between the Testaments may be divided as follows:<P class="in15">(1) the Persian period;<P class="in15">(2) the Alexandrian period;<P class="in15">(3) the Egyptian period;<P class="in15">(4) the Syrian period;<P class="in15">(5) the Maccabean period;<P class="in15">(6) the Roman period.<P>1. The Persian Period:<P>The Persian period extends from the cessation of prophecy to 334 BC. It was in the main uneventful in the history of the Jews, a breathing spell between great national crises, and comparatively little is known of it. The land of Palestine was a portion of the Syrian satrapy, while the true government of the Jewish people was semi-theocratic, or rather sacerdotal, under the rule of the high priests, who were responsible to the satrap. As a matter of course, the high-priestly office became the object of all Jewish ambition and it aroused the darkest passions. Thus John, the son of Judas, son of Eliashib, through the lust of power, killed his brother Jesus, who was a favorite of Bagoses, a general of Artaxerxes in command of the district. The guilt of the fratricide was enhanced, because the crime was committed in the temple itself, and before the very altar. A storm of wrath, the only notable one of this period, thereupon swept over Judea. The Persians occupied Jerusalem, the temple was defiled, the city laid waste in part, a heavy fine was imposed on the people and a general persecution followed, which lasted for many years (Ant., XI, 7; Kent, HJP, 231). Then as later on, in the many persecutions which followed, the Samaritans, ever pliable and willing to obey the tyrant of the day, went practically scot free.<P>2. The Alexandrian Period:<P>The Alexandrian period was very brief, 334-323 BC. It simply covers the period of the Asiatic rule of Alexander the Great. In Greece things had been moving swiftly. The Spartan hegemony, which had been unbroken since the fall of Athens, was now by destroyed by the Thebans under Epaminondas, in the great battles of Leuctra and Mantinea. But the new power was soon crushed Philip of Macedon, who was thereupon chosen general leader by the unwilling Greeks. Persia was the object of Philip\'s ambition and vengeance, but the dagger of Pausanias (Ant., XI, viii, 1) forestalled the execution of his plans. His son Alexander, a youth of 20 years, succeeded him, and thus the "great he-goat," of which Daniel had spoken (<a onClick="return mV(\'Dan\',8,8);">Da 8:8</a>; <a onClick="return mV(\'Dan\',10,20);">10:20</a>), appeared on the scene. In the twelve years of his reign (335-323 BC) he revolutionized the world. Swift as an eagle he moved. All Greece was laid at his feet. Thence he moved to Asia, where he defeated Darius in the memorable battles of Granicus and Issus. Passing southward, he conquered the Mediterranean coast and Egypt and then moved eastward again, for the complete subjugation of Asia, when he was struck down in the height of his power, at Babylon, in the 33rd year of his age. In the Syrian campaign he had come in contact with the Jews. Unwilling to leave any stronghold at his back, he reduced Tyre after a siege of several months, and advancing southward demanded the surrender of Jerusalem. But the Jews, taught by bitter experience, desired to remain loyal to Persia. As Alexander approached the city, Jaddua the high priest, with a train of priests in their official dress, went out to meet him, to supplicate mercy. A previous dream of this occurrence is said to have foreshadowed this event, and Alexander spared the city, sacrificed to Yahweh, had the prophecies of Daniel concerning him rehearsed in his hearing, and showed the Jews many favors (Ant., XI, viii, 5) From that day on they became his favorites; he employed them in his army and gave them equal rights w ith the Greeks, as first citizens of Alexandria, and other cities, which he founded. Thus the strong Hellenistic spirit of the Jews was created, which marked so large a portion of the nation, in the subsequent periods of their history.<P>3. The Egyptian Period:<P>The Egyptian period (324-264 BC). The death of Alexander temporarily turned everything into chaos. The empire, welded Thrace together by his towering genius, fell apart under four of his generals—Ptolemy, Lysimachus, Cassander, and Selenus (<a onClick="return mV(\'Dan\',8,21,22);">Da 8:21-22</a>). Egypt fell to the share of Ptolemy Soter and Judea was made part of it. At first Ptolemy was harsh in his treatment of the Jews, but later on he learned to respect them and became their patron as Alexander had been. Hecataeus of is at this time said to have studied the Jews, through information received from Hezekiah, an Egyptian Jewish immigrant, and to have written a Jewish history from the time of Abraham till his own day. This book, quoted by Josephus and Origen, is totally lost. Soter was succeeded by Ptolemy Philadelphus, an enlightened ruler, famous through the erection of the lighthouse of Pharos, and especially through the founding of the celebrated Alexandrian library. Like his father he was very friendly to the Jews, and in his reign the celebrated Greek translation of the Old Testament Scriptures, the Septuagint, was made, according to tradition (Ant., XII, ii). As however the power of the Syrian princes, the Seleucids, grew, Palestine increasingly became the battle ground between them and the Ptolemies. In the decisive battle between Ptolemy Philopator and Antiochus the Great, at Raphia near Gaza, the latter was crushed and during Philopator\'s reign Judea remained an Egyptian province. And yet this battle formed the turning-point of the history of the Jews in their relation to Egypt. For when Ptolemy, drunk with victory, came to Jerusalem, he endeavored to enter the holy of holies of the temple, although he retreated, in confusion, from the holy place. But he wreaked his vengeance on the Jews, for opposing his plan, by a cruel persecution. He was succeeded by his son Ptolemy Epiphanes, a child of 5 years. The long-planned vengeance of Antiochus now took form in an invasion of Egypt. Coele-Syria and Judea were occupied by the Syrians and passed over into the possession of the Seleucids.<P>4. The Syrian Period:<P>The Syrian period (204-165 BC). Israel now entered into the valley of the shadow of death. This entire period was an almost uninterrupted martyrdom. Antiochus was succeeded by Seleucis Philopator. But harsh as was their attitude to the Jews, neither of these two was notorious for his cruelty to them. Their high priests, as in former periods, were still their nominal rulers. But the aspect of everything changed when Antiochus Epiphanes (175-164 BC) came to the throne. He may fitly be called the Nero of Jewish history. The nationalists among the Jews were at that time wrangling with the Hellenists for the control of affairs. Onias III, a faithful high priest, was expelled from office through the machinations of his brother Jesus or Jason (2Macc 4:7-10). Onias went to Egypt, where at Heliopolis he built a temple and officiated as high priest. Meanwhile Jason in turn was turned out of the holy office by the bribes of still another brother, Menelaus, worse by far than Jason, a Jew-hater and an avowed defender of Greek life and morals. The wrangle between the brothers gave Antiochus the opportunity he craved to wreak his bitter hatred on the Jews, in the spoliation of Jerusalem, in the wanton and total defilement of the temple, and in a most horrible persecution of the Jews (1Macc 1:16-28; 2Macc 5:11-23; <a onClick="return mV(\'Dan\',11,28);">Da 11:28</a>; Ant, XII, v, 3.4). Thousands were slain, women and children were sold into captivity, the city wall was torn down, all sacrifices ceased, and in the temple on the altar of burnt offering a statue was erected to Jupiter Olympius (1Macc 1:43; 2Macc 6:1-2). Circumcision was forbidden, on pain of death, and all the people of Israel were to be forcibly paganized. As in the Persian persecution, the Samaritans again played into the hands of the Syrians and implicitly obeyed the will of the Seleucids. But the very rigor of the persecution caused it to fail of its purpose and Israel proved to be made of sterner stuff than Antiochus imagined. A priestly family dwelling at Modin, west of Jerusalem, named Hasmonean, after one of its ancestors, consisting of Mattathias and his five sons, raised the standard of revolt, which proved successful after a severe struggle.<P>See <a href="./study/isbe/search.html?string=ASMONEANS">ASMONEANS</a>.<P>5. The Maccabean Period:<P>The Maccabean period (165-63 BC). The slaying of an idolatrous Jew at the very altar was the signal of revolt. The land of Judea is specially adapted to guerilla tactics, and Judas Maccabeus, who succeeded his father, as leader of the Jewish patriots, Was a past master in this kind of warfare. All efforts of Antiochus to quell the rebellion failed most miserably, in three Syrian campaigns. The king died of a loathsome disease and peace was at last concluded with the Jews. Though still nominally under Syrian control, Judas became governor of Palestine. His first act was the purification and rededication of the temple, from which the Jews date their festival of purification (see <a href="./study/isbe/search.html?string=PURIFICATION">PURIFICATION</a>). When the Syrians renewed the war, Judas applied for aid to the Romans, whose power began to be felt in Asia, but he died in battle before the promised aid could reach him (Ant., XII, xi, 2). He was buried by his father\'s side at Modin and was succeeded by his brother Jonathan. From that time the Maccabean history becomes one of endless cabals. Jonathan was acknowledged by the Syrians as meridarch of Judea, but was assassinated soon afterward. Simon succeeded him, and by the help of the Romans was made hereditary ruler of Palestine. He in turn was followed by John Hyrcanus. The people were torn by bitter partisan controversies and a civil war was waged, a generation later, by two grandsons of John Hyrcanus, Hyrcanus and Aristobulus. In this internecine struggle the Roman general Pompey participated by siding with Hyrcanus, while Aristobulus defied Rome and defended Jerusalem. Pompey took the city, after a siege of three months, and entered the holy of holies, thereby forever estranging from Rome every loyal Jewish heart.<P>6. The Roman Period:<P>The Roman period (63-4 BC). Judea now became a Roman province. Hyrcanus, stripped of the hereditary royal power, retained only the high-priestly office. Rome exacted an annual tribute, and Aristobulus was sent as a captive to the capital. He contrived however to escape and renewed the unequal struggle, in which he was succeeded by his sons Alexander and Antigonus. In the war between Pompey and Caesar, Judea was temporarily forgotten, but after Caesar\'s death, under the triumvirate of Octavius, Antony and Lepidus, Antony, the eastern triumvir, favored Herod the Great, whose intrigues secured for him at last the crown of Judea and enabled him completely to extinguish the old Maccabean line of Judean princes.<P>IV. Internal Developments in This Period.<P>One thing remains, and that is a review of the developments within the bosom of Judaism itself in the period under consideration. It is self-evident that the core of the Jewish people, which remained loyal to the national traditions and to the national faith, must have been radically affected by the terrible cataclysms which mark their history, during the four centuries before Christ. What, if any, was the literary activity of the Jews in this period? What was their spiritual condition? What was the result of the manifest difference of opinion within the Jewish economy? What preparation does this period afford for the "fullness of time"? These and other questions present themselves, as we study this period of the history of the Jews.<P>1. Literary Activity:<P>The voice of prophecy was utterly hushed in this period, but the old literary instinct of the nation asserted itself; it was part and parcel of the Jewish traditions and would not be denied. Thus in this period many writings were produced, which of although they lack canonical authority, among Protestants at least, still are extremely helpful for a correct understanding the life of Israel in the dark ages before Christ.<P>(a) The Apocrypha.<P>First of all among the fruits of this literary activity stand the apocryphal books of the Old Testament. It is enough here to mention them. They are fourteen in number: 1 and 2Esdras, Tobit, Judith, 2 Esther, Wisdom of Solomon, Ecclesiasticus, in Baruch, Song of the Three Holy Children, History of Susannah, Bel and the Dragon, Prayer of Manasses, 1 and 2Maccabees. As 3 and 4 Maccabees fall presumably within the Christian era, they are not here enumerated. All these apocryphal writings are of the utmost importance for a correct understanding of the Jewish problem in the day which they were written. For fuller information, see <a href="./study/isbe/search.html?string=APOCRYPHA">APOCRYPHA</a>.<P>(b) Pseudepigrapha.<P>Thus named from the spurious character of the authors\' names they bear. Two of these writings very probably belong to our of period, while a host of them evidently belong to a later date. In this class of writings there is a mute confession of the conscious poverty of the day. First of all, we have the Psalter of Solomon, originally written in Hebrew and translated into Greek—a collection of songs for worship, touching in their spirit, and evincing the fact that true faith never died in the heart of the true believer. The second is the Book of Enoch, a production of an apocalyptic nature, named after Enoch the patriarch, and widely known about the beginning the Christian era. This book is quoted in the New Testament (<a onClick="return mV(\'Jud\',1,14);">Jude 1:14</a>). It was originally written in Hebrew or Aramaic and translated into Greek as there is no trace of a Christian influence in the book, the presumption is that the greater part of it was written at an earlier period. Both Jude and the author of Revelation must have known it, as a comparative study of both books will show. The question of these quotations or allusions is a veritable crux interpretum: how to reconcile the inspiration of these books with these quotations?<P>(c) The Septuagint.<P>The tradition of the Septuagint is told by Josephus (Ant., XII, ii, 13). Aristeas and Aristobulus, a Jewish priest in the reign of Ptolemy Philometor (2Macc 1:10), are also quoted in support of it by Clement of Alexandria and by Eusebius. See <a href="./study/isbe/search.html?string=SEPTUAGINT">SEPTUAGINT</a>. The truth of the matter is most probably that this great translation of the Old Testament Scriptures was begun at the instance of Ptolemy Philadelphus 285-247 BC, under the direction of Demetrius Phalereus, and was completed somewhere about the middle of the 2nd century BC. Internal evidence abounds that the translation was made by different hands and at different times. If the translation was in any way literal, the text of the Septuagint raises various interesting questions in regard to the Hebrew text that was used in the translation, as compared with the one we now possess. The Septuagint was of the utmost missionary value and contributed perhaps more than any other thing to prepare the world for the "fullness of time."<P>2. Spiritual Conditions:<P>The return from Babylon marked a turning point in the spiritual history of the Jews. From that time onward, the lust of idolatry, which had marked their whole previous history, utterly disappears. In the place of it came an almost intolerable spirit of exclusiveness, a striving after legal holiness, these two in combination forming the very heart and core of the later Pharisaism. The holy books, but especially the law, became an object of almost idolatrous reverence; the spirit was utterly lost in the form. And as their own tongue, the classic Hebrew, gradually gave way to the common Aramaic, the rabbis and their schools strove ever more earnestly to keep the ancient tongue pure, worship and life each demanding a separate language. Thus, the Jews became in a sense bilingual, the Hebrew tongue being used in their synagogues, the Aramaic in their daily life, and later on, in part at least, the Greek tongue of the conqueror, the lingua franca of the period. A spiritual aristocracy very largely replaced the former rule of their princes and nobles. As the core of their religion died, the bark of the tree flourished. Thus, tithes were zealously paid by the believer (compare <a onClick="return mV(\'Mat\',23,23);">Mt 23:23</a>), the Sabbath became a positive burden of sanctity, the simple laws of God were replaced by cumbersome human inventions, which in later times were to form the bulk of the Talmud, and which crushed down all spiritual liberty in the days of Christ (<a onClick="return mV(\'Mat\',11,28);">Mt 11:28</a>; <a onClick="return mV(\'Mat\',23,4,23);">23:4, 23</a>). The substitution of the names "Elohim" and "Adonai" for the old glorious historic name "Yahweh" is an eloquent commentary on all that has been said before and on the spiritual condition of Israel in this period (Ewald, History of Israel, V, 198), in which the change was inaugurated. The old centripetal force, the old ideal of centralization, gave way to an almost haughty indifference to the land of promise. The Jews became, as they are today, a nation without a country. For, for every Jew that came back to the old national home, a thousand remained in the land of their adopti on. And yet scattered far and wide, in all sorts of environments, they remained Jews, and the national consciousness was never extinguished. It was God\'s mark on them now as then. And thus they became world-wide missionaries of the knowledge of the true God, of a gospel of hope for a world that was hopeless, a gospel which wholly against their own will directed the eyes of the world to the fullness of time and which prepared the fallow soil of human hearts for the rapid spread of Christianity when it ultimately appeared.<P>3. Parties:<P>During the Greek period the more conservative and zealous of the Jews were all the time confronted with a tendency of a very considerable portion of the people, especially the younger and wealthier set, to adopt the manners of life and thought and speech of their masters, the Greeks. Thus the Hellenistic party was born, which was bitterly hated by all true blooded Jews, but which left its mark on their history, till the date of the final dispersion 70 AD. From the day of Mattathias, the Chasids or Haside ans (1Macc 2:42) were the true Jewish patriots. Thus the party of the Pharisees came into existence (Ant., XIII, x, 5; XVIII, i, 2; BJ, I, v, 2). See <a href="./study/isbe/search.html?string=PHARISEES">PHARISEES</a>. They were opposed by the more secular-minded Sadducees (Ant., XIII, x, 6; XVIII, i, 3; BJ, II, viii, 14), wealthy, of fine social standing, wholly free from the restraints of tradition, utterly oblivious of the future life and closely akin to the Greek Epicureans. See <a href="./study/isbe/search.html?string=SADDUCEES">SADDUCEES</a>. These parties bitterly opposed each other till the very end of the national existence of the Jews in Palestine, and incessantly fought for the mastery, through the high-priestly office. Common hatred for Christ, for a while, afforded them a community of interests.<p>4. Preparation for Christianity:<P>Throughout this entire dark period of Israel\'s history, God was working out His own Divine plan with them. Their Scriptures were translated into Greek, after the conquest of Alexander the Great the common language in the East. Thus the world was prepared for the word of God, even as the latter in turn prepared the world for the reception of the gift of God, in the gospel of His Son. The Septuagint thus is a distinct forward movement in the fulfillment of the Abrahamic promise (<a onClick="return mV(\'Gen\',12,3);">Ge 12:3</a>; <a onClick="return mV(\'Gen\',18,18);">18:18</a>). As the sacrificial part of Jewish worship declined, through their wide separation from the temple, the eyes of Israel were more firmly fixed on their Scriptures, read every Sabbath in their synagogues, and, as we have seen, these Scriptures, through the rendering of the Septuagint, had become the property of the entire world. Thus, the synagogue everywhere became the great missionary institute, imparting to the world Israel\'s exalted Messianic hopes. On the other hand, the Jews themselves, embittered by long-continued martyrdoms and suffering, utterly carnalized this Messianic expectation in an increasing ratio as the yoke of the oppressor grew heavier and the hope of deliverance grew fainter. And thus when their Messiah came, Israel recognized Him not, while the heart-hungry heathen, who through the Septuagint had become familiar with the promise, humbly received Him (<a onClick="return mV(\'Jhn\',1,\'9-14\');">Joh 1:9-14</a>). The eyes of Israel were blinded for a season, \'till the fullness of the Gentiles shall be gathered in\' (<a onClick="return mV(\'Rom\',9,32);">Ro 9:32</a>; <a onClick="return mV(\'Rom\',11,25);">11:25</a>).``42';
isbe[1472]='Beulah`bu\'-la (be\'ulah "married"): A name symbolically applied to Israel: "Thy land (shall be called) Beulah...thy land shall be married....so shall thy sons marry thee" (<a onClick="return mV(\'Isa\',62,4);">Isa 62:4</a>f). In this figure, frequently used since Hosea, the prophet wishes to express the future prosperity of Israel. The land once desolate shall again be populated.``1';
isbe[1473]='Bewail`be-wal\' (kopto): In the middle voice, this word has the thought of striking on the breast and of loud lamentation, so common among oriental people in time of great sorrow. It is used to express the most intense grief, a sorrow that compels outward demonstration (<a onClick="return mV(\'Luk\',8,52);">Lu 8:52</a>; <a onClick="return mV(\'Luk\',23,27);">23:27</a>). A striking instance of this grief is that of the daughter of Jephthah (<a onClick="return mV(\'Jdg\',11,37);">Jud 11:37</a>; <a onClick="return mV(\'Lev\',10,6);">Le 10:6</a>).`<a href="./study/isbe/search.html?string=BURIAL">BURIAL</a>; <a href="./study/isbe/search.html?string=GRIEF">GRIEF</a>`1';
isbe[1474]='Bewitch`be-wich\' (existemi): There are two Greek words in the New Testament translated "bewitch." The one given above (<a onClick="return mV(\'Act\',8,9,21);">Ac 8:9, 21</a> the King James Version "bewitched," the Revised Version (British and American) "amazed") has reference to the work of Simon Magus. It means "to be out of one\'s mind," "to astonish," "to overwhelm with wonder." The other word, baskaino (<a onClick="return mV(\'Gal\',3,1);">Ga 3:1</a>), means "to fascinate by false representation." It is by this means the apostle complains they have been led to accept a teaching wholly contrary to the gospel of Christ. Both these words reveal to us something of the difficulty the early teachers had to eradicate the idea so widely held by the Jews and Egyptians especially, that there were certain powers, dark and mysterious, which by certain occult forces they could control. For a long time this had to be contended with as one of the corrupt practices brought into the church by the converts, both from Judaism and heathenism. These words have a reference to the evil eye which for centuries was, and even today is, an important factor in the life of the people of the East. <a onClick="return mV(\'1Ti\',6,20);">1Ti 6:20</a> is a reference to this thought and explains the word "science" (the King James Version) as there used.`<a href="./study/isbe/search.html?string=DIVINATION">DIVINATION</a>; <a href="./study/isbe/search.html?string=EVIL+EYE">EVIL EYE</a>; <a href="./study/isbe/search.html?string=SORCERY">SORCERY</a>; <a href="./study/isbe/search.html?string=SUPERSTITION">SUPERSTITION</a>`87';
isbe[1475]='Bewray; Bewrayer`be-ra\', be-ra\'-er: In its derivation is entirely different from betray (Latin, tradere), and meant originally "to disclose," "reveal" (compare Shakspere, Titus Andronicus, II, iv, 3: "Write down thy mind, bewray thy meaning so"); but has been affected by the former word and is used almost synonymously. It is the translation of three Hebrew words:<P>(1) qara\', meaning "to call out" (<a onClick="return mV(\'Pro\',27,16);">Pr 27:16</a>), "the ointment of his right hand which bewrayeth itself" (the American Standard Revised Version "his right hand encountereth oil," the American Revised Version, margin "the oil of his right hand betrayeth itself");<P>(2) naghadh meaning "to front," "to announce" (by word of mouth): <a onClick="return mV(\'Pro\',29,24);">Pr 29:24</a>, "heareth cursing and bewrayeth it not" (the American Standard Revised Version "heareth the adjuration and uttereth nothing");<P>(3) galah, "to denude," figuratively, "to reveal" (<a onClick="return mV(\'Isa\',16,3);">Isa 16:3</a>), "bewray not him that wandereth" (the American Standard Revised Version "betray not the fugitive").<P>In Sirach 27:17 "bewray (the Revised Version (British and American) "reveal") his secrets" is the translation of apokalupto, literally "to uncover"; so also in Sirach 27:21 (the Revised Version (British and American) "revealeth"). Bewrayer of 2Macc 4:1 ("bewrayer of. the money and of his country," the Revised Version (British and American) "had given information of the money and had betrayed his country") is the translation of endeiktes, literally, "one who shows."<P>In the New Testament "bewrayeth" is the King James Version of <a onClick="return mV(\'Mat\',26,73);">Mt 26:73</a>; "thy speech bewrayeth thee" is the translation of the phrase delon poiein, which the American Standard Revised Version renders "maketh thee known."``89';
isbe[1476]='Beyond`be-yond\':Found in the Hebrew only in its application to space and time, and for these ideas three words are employed: hale\'ah (<a onClick="return mV(\'Gen\',35,21);">Ge 35:21</a>) = "to the distance"; \'abhar = "to go beyond" "to cross" derivative \'ebher (Chald. \'abhar) = "across," "beyond" (<a onClick="return mV(\'Deu\',30,13);">De 30:13</a>; <a onClick="return mV(\'Jos\',18,7);">Jos 18:7</a>; <a onClick="return mV(\'Jdg\',3,26);">Jud 3:26</a>; <a onClick="return mV(\'1Sa\',20,36);">1Sa 20:36</a>; <a onClick="return mV(\'2Ch\',20,2);">2Ch 20:2</a>; <a onClick="return mV(\'Ezr\',4,17,20);">Ezr 4:17, 20</a>; <a onClick="return mV(\'Jer\',25,22);">Jer 25:22</a>); and \'al (<a onClick="return mV(\'Lev\',15,25);">Le 15:25</a>) = "beyond the time." In the New Testament peran, is used to express "beyond" in the spatial sense (<a onClick="return mV(\'Mat\',4,15);">Mt 4:15</a>), while other words and phrases are employed for adverbial ideas of degree: huperperissos (<a onClick="return mV(\'Mar\',7,37);">Mr 7:37</a>); huper (<a onClick="return mV(\'2Cr\',8,3);">2Co 8:3</a>; <a onClick="return mV(\'2Cr\',10,16);">10:16</a>); kathuperbolen (<a onClick="return mV(\'Gal\',1,13);">Ga 1:13</a>). In the King James Version be\'eher, is occasionally translated "beyond," and when this word is joined to ha- yarden, "Jordan," as it usually is, it becomes critically important. In the American Standard Revised Version, be\'ebher ha- yarden is translated "beyond the Jordan," in <a onClick="return mV(\'Gen\',50,10,21);">Ge 50:10, 21</a>; <a onClick="return mV(\'Deu\',3,20,25);">De 3:20, 25</a>; <a onClick="return mV(\'Jos\',9,10);">Jos 9:10</a>; <a onClick="return mV(\'Jdg\',5,17);">Jud 5:17</a>; "on this side Jordan" in <a onClick="return mV(\'Deu\',1,1,5);">De 1:1, 5</a>; <a onClick="return mV(\'Jos\',1,14,15);">Jos 1:14-15</a>; "on the other side Jordan" in <a onClick="return mV(\'Deu\',11,30);">De 11:30</a>; <a onClick="return mV(\'Jos\',12,1);">Jos 12:1</a>; <a onClick="return mV(\'Jos\',22,4);">22:4</a>; <a onClick="return mV(\'Jos\',24,2,8);">24:2, 8</a> (compare the King James Version and the Revised Version (British and American), <a onClick="return mV(\'Jos\',24,14,25);">Jos 24:14, 25</a>; see <a href="./study/isbe/search.html?string=RIVER,+THE">RIVER, THE</a>), <a onClick="return mV(\'Jdg\',10,8);">Jud 10:8</a>; <a onClick="return mV(\'1Sa\',31,7);">1Sa 31:7</a>; and "on the side of Jordan" in <a onClick="return mV(\'Jos\',5,1);">Jos 5:1</a>. The American Standard Revised Version gives "beyond the Jordan" throughout. me\'ebher, is used with ha-yarden in <a onClick="return mV(\'Num\',34,15);">Nu 34:15</a>; <a onClick="return mV(\'Num\',35,14);">35:14</a>; <a onClick="return mV(\'Jos\',13,32);">Jos 13:32</a>; <a onClick="return mV(\'Jdg\',7,25);">Jud 7:25</a>; and \'ebher, alone in <a onClick="return mV(\'Deu\',4,49);">De 4:49</a> (the King James Version "on this side"); <a onClick="return mV(\'Jos\',13,27);">Jos 13:27</a> (the King James Version "on the other side"). It is clear that the phrase may be translated "across Jordan"; that it is used of either side of the Jordan (<a onClick="return mV(\'Deu\',3,8);">De 3:8</a> speaks of the eastern, <a onClick="return mV(\'Deu\',3,20,25);">De 3:20, 25</a> of the western); that "beyond Jordan" may be used of the side of the Jordan on which the writer stands (<a onClick="return mV(\'Jos\',5,1);">Jos 5:1</a>; <a onClick="return mV(\'Jos\',9,1);">9:1</a>; <a onClick="return mV(\'Jos\',12,7);">12:7</a>); but from the fact that <a onClick="return mV(\'Deu\',1,1,5);">De 1:1, 5</a>; <a onClick="return mV(\'Deu\',4,41,46,47,49);">4:41, 46-47, 49</a>, where statements are made about Moses, the reference is to the country east of the Jordan, while in <a onClick="return mV(\'Deu\',3,20,25);">De 3:20, 25</a>; <a onClick="return mV(\'Deu\',11,30);">11:30</a>, where Moses is represented as speaking, the west is indicated, critics have concluded that the author (at least of Deuteronomy) must have lived after Moses, being careful to distinguish between himself and the prophet.``77';
isbe[1477]='Bezaanannim`be-za-an-an\'-im (<a onClick="return mV(\'Jos\',19,33);">Jos 19:33</a> the Revised Version, margin).`<a href="./study/isbe/search.html?string=ZAANANNIM">ZAANANNIM</a>`1';
isbe[1478]='Bezai`be\'-za-i (betsay, "shining"(?)):<P>(1) A chief who with Nehemiah sealed the covenant (<a onClick="return mV(\'Neh\',10,18);">Ne 10:18</a>).<P>(2) The descendants of Bezai returned with Zerubbabel to Jerusalem (323, <a onClick="return mV(\'Ezr\',2,17);">Ezr 2:17</a>; 324, <a onClick="return mV(\'Neh\',7,23);">Ne 7:23</a> = Bassai, 1Esdras 5:16).``1';
isbe[1479]='Bezalel`bez\'-a-lel (betsal\'el, "in the shadow (protection) of \'El (God)"; Beseleel; the King James Version Bezaleel):<P>(1) A master workman under Moses; son of Uri, son of Hur, of the tribe of Judah. Yahweh gave him especial wisdom and skill for his task, which was, with the aid of Oholiab of the tribe of Dan, to superintend the making of the tabernacle and its furniture (<a onClick="return mV(\'Exd\',31,2);">Ex 31:2</a>; <a onClick="return mV(\'Exd\',35,30);">35:30</a>; <a onClick="return mV(\'Exd\',36,1,2,8);">36:1-2, 8</a>; <a onClick="return mV(\'Exd\',37,1);">37:1</a>; <a onClick="return mV(\'Exd\',38,22);">38:22</a>; <a onClick="return mV(\'1Ch\',2,20);">1Ch 2:20</a>; <a onClick="return mV(\'2Ch\',1,5);">2Ch 1:5</a>).<P>(2) An Israelite of the time of Ezra who put away a foreign wife (<a onClick="return mV(\'Ezr\',10,30);">Ezr 10:30</a>).``57';
isbe[1480]='Bezek`be\'-zek (bezeq; Bezek, Codex Vaticanus, Abiezek):<P>(1) The city of Adoni-bezek taken by Judah and Simeon (<a onClick="return mV(\'Jdg\',1,4);">Jud 1:4</a>f), in the territory allotted to Judah. It is somewhat doubtfully identified with Bezqah, about 3 miles Northeast of Gezer.<P>(2) The place where Saul marshaled his army before marching to the relief of Jabesh-gilead (<a onClick="return mV(\'1Sa\',11,8);">1Sa 11:8</a>). Eusebius, Onomasticon speaks of two villages of this name 17 Roman miles from Shechem, on the way to Scythopolis. No doubt Khirbet Ibziq is intended. Here, or on the neighboring height, Ras Ibziq, a mountain 2,404 ft. above sea level, the army probably assembled.``54';
isbe[1481]='Bezer`be\'-zer (betser; Bosor, "strong"):<P>(1) A city of refuge, set apart by Moses for the Reubenites and located in the "plain country" (or table-land, Mishor) east of the Jordan, later assigned to this tribe by Joshua (<a onClick="return mV(\'Deu\',4,43);">De 4:43</a>; <a onClick="return mV(\'Jos\',20,8);">Jos 20:8</a>). The same city was assigned by lot as place of residence to the children of Merari of the Levite tribe (<a onClick="return mV(\'Jos\',21,36);">Jos 21:36</a>; <a onClick="return mV(\'1Ch\',6,63,78);">1Ch 6:63, 78</a>). Driver, HDB, suggests the identity of Bezer with Bozrah (Septuagint, Bosor) (<a onClick="return mV(\'Jer\',48,24);">Jer 48:24</a>). Besheir has been suggested as the present site. According to the manuscript it was forti fied by Mesha.<P>(2) A son of Zophah of the house of Asher (<a onClick="return mV(\'1Ch\',7,37);">1Ch 7:37</a>).``16';
isbe[1482]='Bezeth`be\'-zeth (Bezeth): A place in the neighborhood of Jerusalem to which Bacchides withdrew and where he slew several deserters (1Macc 7:19). Possibly the same as Bezetha.`<a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>`1';
isbe[1483]='Bezetha`be-ze\'-tha: Also called by Josephus the "New City" (BJ, V, iv, 2), certain suburbs of Jerusalem, north of the Temple, which were outside the second but included within the third wall. <a href="./study/isbe/search.html?string=BEZETH">BEZETH</a> (which see) may be the same place.`<a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>`1';
isbe[1484]='Biatas`bi\'-a-tas (Phalias; Codex Alexandrinus, Phiathas): the Revised Version (British and American) "Phalias," one of the Levites (1Esdras 9:48) who "taught (the people) the law of the Lord, making them withal to understand it." Called Pelaiah in <a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>.``1';
isbe[1485]='Bible, the, I., II., III. I Introduction`bi\'-b\'-l, (biblia):<P><b>I. THE NAMES</b><P class="in15">1. Bible<P class="in15">2. Other Designations—Scriptures, etc.<P class="in15">3. Old Testament and New Testament<P><p>II. LANGUAGES</b><P><b>III. COMPASS AND DIVISIONS</b><P class="in15">1. The Jewish Bible<P class="in30">Josephus, etc.<P class="in15">2. The Septuagint<P class="in30">The Apocrypha<P class="in15">3. The Vulgate (Old Testament)<P class="in15">4. The New Testament<P class="in30">(1) Acknowledged Books<P class="in30">(2) Disputed Books<P><p>IV. LITERARY GROWTH AND ORIGIN—CANONICITY</b><P class="in15">1. The Old Testament<P class="in30">(1) Indications of Old Testament Itself<P class="in45">(a) Patriarchal Age<P class="in45">(b) Mosaic Age<P class="in45">(c) Judges<P class="in45">(d) Monarchy<P class="in45">(e) Wisdom Literature—History<P class="in45">(f) Prophecy<P class="in60">(aa) Assyrian Age<P class="in60">(bb) Chaldean Age<P class="in45">(g) Josiah\'s Reformation<P class="in45">(h) Exilian and Post-Exilian<P class="in45">(i) Daniel, etc.<P class="in45">(j) Pre-exilic Bible<P class="in30">(2) Critical Views<P class="in45">(a) The Pentateuch<P class="in45">(b) Histories<P class="in45">(c) Psalms and Prophets<P class="in30">(3) Formation of Canon<P class="in45">(a) Critical Theory<P class="in45">(b) More Positive View<P class="in45">(c) Close of Canon<P class="in15">2. The New Testament<P class="in30">(1) Historical Books<P class="in45">(a) The Synoptics<P class="in45">(b) Fourth Gospel<P class="in45">(c) Acts<P class="in30">(2) The Epistles<P class="in45">(a) Pauline<P class="in45">(b) Epistle to Hebrews<P class="in45">(c) Catholic Epistles<P class="in30">(3) Prophecy<P class="in45">Book of Revelation<P class="in30">(4) New Testament Canon<P><b>V. UNITY AND SPIRITUAL PURPOSE—INSPIRATION</b><P class="in15">1. Scripture a Unity<P class="in15">2. The Purpose of Grace<P class="in15">3. Inspiration<P class="in15">4. Historical Influence<P><b>VI. ADDENDA</b><P class="in15">1. Chapters and Verses<P class="in15">2. The King James Version and the Revised Version (British and American)<P class="in15">3. Helps to Study<P><b>LITERATURE</b><hr /><P>General Designation:<P>This word designates the collection of the Scriptures of the Old Testament and New Testament recognized and in use in the Christian churches. Different religions (such as the Zoroastrian, Hindu, Buddhist, Mohammedan) have their collections of sacred writings, sometimes spoken of as their "Bibles." The Jews acknowledge only the Scriptures of the Old Testament. Christians add the writings contained in the New Testament. The present article deals with the origin, character, contents and purpose of the Christian Scriptures, regarded as the depository and authoritative record of God\'s revelations of Himself and of His will to the fathers by the prophets, and through His Son to the church of a later age (<a onClick="return mV(\'Hbr\',1,1,2);">Heb 1:1-2</a>). Reference is made throughout to the articles in which the several topics are more fully treated.<P>I. The Names.<P>1. Bible:<P>The word "Bible" is the equivalent of the Greek word biblia (diminutive from biblos, the inner bark of the papyrus), meaning originally "books." The phrase "the books" (ta biblia) occurs in <a onClick="return mV(\'Dan\',9,2);">Da 9:2</a> (Septuagint) for prophetic writings. In the Prologue to Sirach ("the rest of the books") it designates generally the Old Testament Scriptures; similarly in 1Macc 12:9 ("the holy books"). The usage passed into the Christian church for Old Testament (2 Clem 14:2), and by and by (circa 5th century) was extended to the whole Scriptures. Jerome\'s name for the Bible (4th century) was "the Divine Library" (Bibliotheca Divina). Afterward came an important change from plural to singular meaning. "In process of time this name, with many others of Greek origin, passed into the vocabulary of the western church; and in the 13th century, by a happy solecism, the neuter plural came to be regarded as a feminine singular, and \'The Books\' became by common consent \'The Book\' (biblia, singular), in which form the word was passed into the languages of modern Europe" (Westcott, Bible in the Church, 5). Its earliest occurrences in English are in Piers Plowman, Chaucer and Wycliffe.<P>2. Other Designations—Scriptures, etc.:<P>There is naturally no name in the New Testament for the complete body of Scripture; the only Scriptures then known being is those of the Old Testament. In <a onClick="return mV(\'2Pe\',3,16);">2Pe 3:16</a>, however, Paul\'s epistles seem brought under this category. The common designations for the Old Testament books by our Lord and His apostles were "the scriptures" (writings) (<a onClick="return mV(\'Mat\',21,42);">Mt 21:42</a>; <a onClick="return mV(\'Mar\',14,49);">Mr 14:49</a>; <a onClick="return mV(\'Luk\',24,32);">Lu 24:32</a>; <a onClick="return mV(\'Jhn\',5,39);">Joh 5:39</a>; <a onClick="return mV(\'Act\',18,24);">Ac 18:24</a>; <a onClick="return mV(\'Rom\',15,4);">Ro 15:4</a>, etc.), "the holy, scriptures" (<a onClick="return mV(\'Rom\',1,2);">Ro 1:2</a>); once "the sacred writings" (<a onClick="return mV(\'2Ti\',3,15);">2Ti 3:15</a>). The Jewish technical division (see below) into "the law," the "prophets," and the "(holy) writings" is recognized in the expression "in the law of Moses, and the prophets, and the psalms" (<a onClick="return mV(\'Luk\',24,44);">Lu 24:44</a>). More briefly the whole summed up under "the law and the prophets" (<a onClick="return mV(\'Mat\',5,17);">Mt 5:17</a>; <a onClick="return mV(\'Mat\',11,13);">11:13</a>; <a onClick="return mV(\'Act\',13,15);">Ac 13:15</a>). Occasionally even the term "law" is extended to include the other divisions (<a onClick="return mV(\'Jhn\',10,34);">Joh 10:34</a>; <a onClick="return mV(\'Jhn\',12,34);">12:34</a>; <a onClick="return mV(\'Jhn\',15,25);">15:25</a>; <a onClick="return mV(\'1Cr\',14,21);">1Co 14:21</a>). Paul uses the phrase "the oracles of God" as a name for the Old Testament Scriptures (<a onClick="return mV(\'Rom\',3,2);">Ro 3:2</a>; compare <a onClick="return mV(\'Act\',7,38);">Ac 7:38</a>; <a onClick="return mV(\'Hbr\',5,12);">Heb 5:12</a>; <a onClick="return mV(\'1Pe\',4,11);">1Pe 4:11</a>).<P>3. Old Testament and New Testament:<P>Special interest attaches to the names "Old" and "New Testament," now and since the close of the 2nd century in common use to distinguish the Jewish and the Christian Scriptures. "Testament" (literally "a will") is used in the New Testament (the King James Version) to represent the Greek word diatheke, in classical usage also "a will," but in the Septuagint and New Testament employed to translate the Hebrew word berith, "a covenant." In the Revised Version (British and American), accordingly, "testament" is, with two exceptions (<a onClick="return mV(\'Hbr\',9,16,27);">Heb 9:16, 27</a>), changed to "covenant" (<a onClick="return mV(\'Mat\',26,28);">Mt 26:28</a>; <a onClick="return mV(\'2Cr\',3,6);">2Co 3:6</a>; <a onClick="return mV(\'Gal\',3,15);">Ga 3:15</a>; <a onClick="return mV(\'Hbr\',7,22);">Heb 7:22</a>; <a onClick="return mV(\'Hbr\',9,15);">9:15</a>, etc.). Applied to the Scriptures, therefore, "Old" and "New Testament" mean, strictly, "Old" and "New Covenant," though the older usage is now too firmly fixed to be altered. The name is a continuation of the Old Testament designation for the law, "the book of the covenant" (<a onClick="return mV(\'2Ki\',23,2);">2Ki 23:2</a>). In this sense Paul applies it (<a onClick="return mV(\'2Cr\',3,14);">2Co 3:14</a>) to the Old Testament law; "the reading of the old testament" (the Revised Version (British and American) "Covenant"). When, after the middle of the 2nd century, a def inite collection began to be made of the Christian writings, these were named "the New Testament," and were placed as of equal authority alongside the "Old." The name Novum Testamentum (also Instrumentum) occurs first in Tertullian (190-220 AD), and soon came into general use. The idea of a Christian Bible may be then said to be complete.<P>II. Languages.<P>The Old Testament, it is well known, is written mostly in Hebrew; the New Testament is written wholly in Greek, the parts of the Old Testament not in Hebrew, namely, <a onClick="return mV(\'Ezr\',4,8);">Ezr 4:8-6:18</a>; <a onClick="return mV(\'Ezr\',7,\'12-26\');">7:12-26</a>; <a onClick="return mV(\'Jer\',10,11);">Jer 10:11</a>; <a onClick="return mV(\'Dan\',2,\'4-\');">Da 2:4-7:28</a>, are in Aramaic (the so-called Chaldee), a related dialect, which, after the Exile, gradually displaced Hebrew as the spoken language of the Jews (see <a href="./study/isbe/search.html?string=ARAMAIC">ARAMAIC</a>; <a href="./study/isbe/search.html?string=LANGUAGES+OF+THE+OLD+TESTAMENT">LANGUAGES OF THE OLD TESTAMENT</a>). The ancient Hebrew text was "unpointed," i.e. without the vowel-marks now in use. These are due to the labors of the Massoretic scholars (after 6th century AD).<P>The Greek of the New Testament, on which so much light has recently been thrown by the labors of Deissmann and others from the Egyptian papyri, showing it to be a form of the "common" (Hellenistic) speech of the time (see <a href="./study/isbe/search.html?string=LANGUAGE+OF+THE+NEW+TESTAMENT">LANGUAGE OF THE NEW TESTAMENT</a>), still remains, from its penetration by Hebrew ideas, the influence of the Septuagint, peculiarities of training and culture in the writers, above all, the vitalizing and transforming power of Christian conceptions in vocabulary and expression, a study by itself. "We speak," the apostle says, "not in words which man\'s wisdom teacheth, but which the Spirit teacheth" (<a onClick="return mV(\'1Cr\',2,13);">1Co 2:13</a>). This is not always remembered in the search for parallels in the papyri. (For translations into other languages, see <a href="./study/isbe/search.html?string=VERSIONS">VERSIONS</a>.)<P>III. Compass and Divisions.<P>The story of the origin, collection, and final stamping with canonical authority of the books which compose our present Bible involves many points still keenly in dispute. Before touching on these debatable matters, certain more external facts fall to be noticed relating to the general structure and compass of the Bible, and the main divisions of its contents.<P>1. Jewish Bible<P>Josephus, etc.:<P>A first step is to ascertain the character and contents of the Jewish Bible—the Bible in use by Christ and His apostles. Apart from references in the New Testament itself, an important aid is here afforded by a passage in Josephus (Apion, I, 8), which may be taken to represent the current belief of the Jews in the 1st century AD. After speaking of the prophets as writing their histories "through the inspiration of God," Josephus says: "For we have not myriads of discordant and conflicting books, but 22 only, comprising the record of all time, and justly accredited as Divine. Of these, 5 are books of Moses, which embrace the laws and the traditions of mankind until his own death, a period of almost 3,000 years. From the death of Moses till the reign of Artaxerxes, the successor of Xerxes, king of Persia, the prophets who followed Moses narrated the events of their time in 13 books. The remaining 4 books consist of hymns to God, and maxims of conduct for men. From Artaxerxes to our own age, the history has been written in detail, but it is not esteemed worthy of the same credit, on account of the exact succession of the prophets having been no longer maintained." He goes on to declare that, in this long interval, "no one has dared either to add anything to (the writings), or to take anything from them, or to alter anything," and speaks of them as "the decrees (dogmata) of God," for which the Jews would willingly die. Philo (20 BC-circa 50 AD) uses similar strong language about the law of Moses (in Eusebius, Pr. Ev., VIII, 6).<P>In this enumeration of Josephus, it will be seen that the Jewish sacred books—39 in our Bible—are reckoned as 22 (after the number of letters in the Hebrew alphabet), namely, 5 of the law, 13 of the prophets and 4 remaining books. These last are Psalms, Proverbs, Songs and Ecclesiastes. The middle class includes all the historical and prophetical books, likewise Job, and the reduction in the number from 30 to 13 is explained by Judges-Ruth, 1 and 2 Samuel, 1 and 2 Kings, 1 and 2 Chronicles, Ezra-Nehemiah, Jereremiah-Lamentations and the 12 minor prophets, each being counted as one book. In his 22 books, therefore, Josephus includes all those in the present Hebrew canon, and none besides—not the books known as the <a href="./study/isbe/search.html?string=APOCRYPHA">APOCRYPHA</a>, though he was acquainted with and used some of these.<P>Other Lists and Divisions.<P>The statement of Josephus as to the 22 books acknowledged by the Jews is confirmed, with some variation of enumeration, by the lists preserved by Eusebius (Historia Ecclesiastica, vi.26) from Melito of Sardis (circa 172 AD) and Origen (186-254 AD), and by Jerome (Pref to Old Testament, circa 400)—all following Jewish authorities. Jerome knew also of a rabbinical of division into 24 books. The celebrated passage from the Talmud (Babha\' Bathra\', 14b: see <a href="./study/isbe/search.html?string=CANON+OF+THE+OLD+TESTAMENT">CANON OF THE OLD TESTAMENT</a>; compare Westcott, Bible in Church, 35; Driver, LOT, vi) counts also 24. This number is obtained by separating Ruth from Judges and Lamentations from Jeremiah. The threefold division of the books, into Law, Prophets, and other sacred Writings (Hagiographa), is old. It is already implied in the Prologue to Sirach (circa 130 BC), "the law, the prophets, and the rest the books"; is glanced at in a work ascribed to Philo (De vita contempl., 3); is indicated, as formerly seen, in <a onClick="return mV(\'Luk\',24,44);">Lu 24:44</a>. It really reflects stages in the formation of the Hebrew canon (see below). The rabbinical division, however, differed materially from that of Josephus in reckoning only 8 books of the prophets, and relegating 1 and 2 Chronicles, Ezra-Nehemiah, Esther, Job and Daniel to the Hagiographa, thus enlarging that group to 9 (Westcott, op. cit., 28; DB, I, "Canon"). When Ruth and Lamenations were separated, they were added to the list, raising the number to 11. Some, however, take this to be the original arrangement. In printed Hebrew Bibles the books in all the divisions are separate. The Jewish schools further divided the "Prophets" into "the former prophets" (the historical books—Joshua, Judges, Samuel and Kings), and "the latter prophets" (Isaiah, Jeremiah, Ezekiel, and the twelve minor prophets as one book).<P>New Testament References.<P>It may be concluded that the above lists, excluding the Apocrypha, represent the Hebrew Bible as it existed in the time of our Lord (the opinion, held by some, that the Sadducees received only the 5 books of the law rests on no sufficient evidence). This result is borne out by the evidence of quotations in Josephus and Philo (compare Westcott, op. cit.). Still more is it confirmed by an examination of Old Testament quotations and references in the New Testament. It was seen above that the main divisions of the Old Testament are recognized in the New Testament, and that, under the name "Scriptures," a Divine authority is ascribed to them. It is therefore highly significant that, although the writers of the New Testament were familiar with the Septuagint, which contained the Apocrypha (see below), no quotation from any book of the Apocrypha occurs in their pages, One or two allusions, at most, suggest acquaintance with the Book of Wisdom (e.g. The <span class="noTag">Wisdom of Solomon</span> 5:18-21 parallel <a onClick="return mV(\'Eph\',6,\'13-17\');">Eph 6:13-17</a>). On the other hand, "every book in the Hebrew Bible is distinctly quoted in the New Testament with the exception of Joshua, Judges, Chronicles, Canticles, Ecclesiastes, Ezra, Nehemiah, Esther, Obadiah, Zechariah and Nahum" (Westcott). Enumerations differ, but about 178 direct quotations may be reckoned in the Gospels, Acts and Epistles; if references are included, the number is raised to about 700 (see <a href="./study/isbe/search.html?string=QUOTATIONS+IN+THE+NEW+TESTAMENT">QUOTATIONS IN THE NEW TESTAMENT</a>). In four or five places (<a onClick="return mV(\'Luk\',11,49,50,51);">Lu 11:49-51</a>; <a onClick="return mV(\'Jam\',4,5);">Jas 4:5</a>; <a onClick="return mV(\'1Cr\',2,9);">1Co 2:9</a>; <a onClick="return mV(\'Eph\',5,14);">Eph 5:14</a>; <a onClick="return mV(\'Jhn\',7,38);">Joh 7:38</a>) apparent references occur to sources other than the Old Testament; it is doubtful whether most of them are really so (compare Westcott, op. cit., 46-48; <a onClick="return mV(\'Eph\',5,14);">Eph 5:14</a> may be from a Christian hymn). An undeniable influence of Apocalyptic literature is seen in Jude, where <a onClick="return mV(\'Jud\',1,14,25);">Jude 1:14, 25</a> are a direct quotation from the Book of Enoch. It does not follow that Jude regarded this book as a proper part of Scripture.<P>2. The Septuagint:<P>Hitherto we have been dealing with the Hebrew Old Testament; marked changes are apparent when we turn to the Septuagint, or Greek version of the Septuagint current in the Greek-speaking world at the commencement of the Christian era. The importance of this version lies in the fact that it was practically the Old Testament of the early church. It was used by the apostles and their converts, and is freely quoted in the New Testament, sometimes even when its renderings vary considerably from the Hebrew. Its influence was necessarily, therefore, very great.<P>Origin.<P>The special problems connected with origin, text and literary relations of the Septuagint are dealt with elsewhere (see <a href="./study/isbe/search.html?string=SEPTUAGINT">SEPTUAGINT</a>). The version took its rise, under one of the early Ptolemies, from the needs of the Jews in Egypt, before the middle of the 2nd century BC; was gradually executed, and completed hardly later than circa 100 BC; thereafter spread into all parts. Its renderings reveal frequent divergence in manuscripts from the present Massoretic Text, but show also that the translators permitted themselves considerable liberties in enlarging, abbreviating, transposing and otherwise modifying the texts they had, and in the insertion of materials borrowed from other sources.<P>The Apocrypha.<P>The most noteworthy differences are in the departure from Jewish tradition in the arrangement of the books (this varies greatly; compare Swete, Introduction to Old Testament in Greek, II, chapter i), and in the inclusion in the list of the other books, unknown to the Hebrew canon, now grouped as the Apocrypha. These form an extensive addition. They include the whole of the existing Apocrypha, with the exception of 2Esdras and Pr Man. All are of late date, and are in Greek, though Sirach had a Hebrew original which has been partly recovered. They are not collected, but are interspersed among the Old Testament books in what are taken to be their appropriate places. The Greek fragments of Esther, e.g. are incorporated in that book; Susanna and Bel and the Dragon form part of Daniel; Baruch is joined with Jeremiah, etc. The most important books are Wisdom, Sirach and 1Maccabees (circa 100 BC). The fact that Sirach, originally in Hebrew (circa 200 BC), and of high repute, was not included in the Hebrew canon, has a weighty bearing on the period of the closing of the latter.<P>Ecclesiastical Use.<P>It is, as already remarked, singular that, notwithstanding this extensive enlargement of the canon by the Septuagint, the books just named obtained no Scriptural recognition from the writers of the New Testament. The more scholarly of the Fathers, likewise (Melito, Origen, Athanasius, Cyprian, Jerome, etc.), adhere to the Hebrew list, and most draw a sharp distinction between the canonical books, and the Greek additions, the reading of which is, however, admitted for edification (compare Westcott, op. cit., 135-36, 168, 180, 182-83). Where slight divergencies occur (e.g. Esther is omitted by Melito and placed by Athanasius among the Apocrypha; Origen and Athanasius add Baruch to Jer), these are readily explained by doubts as to canonicity or by imperfect knowledge. On the other hand, familiarity with the Septuagint in writers ignorant of Hebrew could not but tend to break down the limits of the Jewish canon, and to lend a Scriptural sanction to the additions to that canon. This was aided in the West by the fact that the Old Latin versions (2nd century) based on the Septuagint, included these additions (the Syriac Peshitta followed the Hebrew). In many quarters, therefore, the distinction is found broken down, and ecclesiastical writers (Clement, Barnabas, Irenaeus, Tertullian, Clement of Alexandria, Basil, etc.) quote freely from books like Wisdom, Sirach, Baruch, Tobit, 2Esdras, as from parts of the Old Testament.<P>3. The Vulgate (Old Testament):<P>An important landmark is reached in the Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) or Latin version of Jerome. Jerome, on grounds explained in his Preface, recognized only the Hebrew Scriptures as canonical; under pressure he executed later a hasty translation of Tobit and Judith. Feeling ran strong, however, in favor of the other books, and ere long these were added to Jerome\'s version from the Old Latin (see <a href="./study/isbe/search.html?string=VULGATE">VULGATE</a>). It is this enlarged Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) which received official recognition, under anathema, at the Council of Trent (1543), and, with revision, from Clement VIII (1592), though, earlier, leading Romish scholars (Ximenes, Erasmus, Cajetan) had made plain the true state of the facts. The Greek church vacillated in its decisions, sometimes approving the limited, sometimes the extended, canon (compare Westcott, op. cit., 217-29). The churches of the Reformation (Lutheran, Swiss), as was to be expected, went back to the Hebrew canon, giving only a qualified sanction to the reading and ecclesiastical use of the Apocrypha. The early English versions (Tyndale, Coverdale, etc.) include, but separate, the apocryphal books (see <a href="./study/isbe/search.html?string=ENGLISH+VERSIONS">ENGLISH VERSIONS</a>). The Anglican Articles express the general estimate of these books: "And the other books (as Jerome saith) the Church doth read for example of life and instruction of manners; yet doth it not apply them to establish any doctrine" (Art. VIII). Modern Protestant Bibles usually exclude the Apocrypha altogether.<P>4. The New Testament:<P>From this survey of the course of opinion on the compass of the Old Testament, we come to the New Testament. This admits of being more briefly treated. It has been seen that a Christian New Testament did not, in the strict sense, arise till after the middle of the 2nd century. Gospels and Epistles had long existed, collections had begun to be made, the Gospels, at least, were weekly read in the assemblies of the Christians (Justin, 1 Apol., 67), before the attempt was made to bring together, and take formal account of, all the books which enjoyed apostolic authority (see <a href="./study/isbe/search.html?string=CANON+OF+THE+NEW+TESTAMENT">CANON OF THE NEW TESTAMENT</a>). The needs of the church, however, and very specially controversy with Gnostic opponents, made it necessary that this work should be done; collections also had to be formed for purposes of translation into other tongues. Genuine gospels had to be distinguished from spurious; apostolic writings from those of later date, or falsely bearing apostolic names. When this task was undertaken, a distinction soon revealed itself between two classes of books, setting aside those recognized on all hands as spurious: (1) books universally acknowledged—those named afterward by Eusebius the homologoumena; and (2) books only partially acknowledged, or on which some doubt rested—the Eusebian antilegomena (Historia Ecclesiastica, iii. 25). It is on this distinction that differences as to the precise extent of the New Testament turned.<P>(1) Acknowledged Books.<P>The "acknowledged" books present little difficulty. They are enumerated by Eusebius, whose statements are confirmed by early lists (e.g. that of Muratori, circa 170 AD), quotations, versions and patristic use. At the head stand the Four Gospels and the Acts, then come the 13 epistles of Paul, then 1 Peter and 1 John. These, Westcott says, toward the close of the 2nd century, "were universally received in every church, without doubt or limitation, as part of the written rule of Christian faith, equal in authority with the Old Scriptures, and ratified (as it seemed) by a tradition reaching back to the date of their composition" (op. cit., 133). With them may almost be placed Revelation (as by Eusebius) and He, the doubts regarding the latter relating more to Pauline authority than to genuineness (e.g. Origen).<P>(2) Disputed Books.<P>The "disputed" books were the epistles of James, Jude, 2 John and 3 John and 2 Peter. These, however, do not all stand in the same rank as regards authentication. A chief difficulty is the silence of the western Fathers regarding James, 2 Peter and 3 John. On the other hand, James is known to Origen and is included in the Syriac Peshitta; the Muratorian Fragment attests Jude and 2 John as "held in the Catholic church" (Jude also in Tertullian, Clement of Alexandria, Origen); none of the books are treated as spurious. The weakest in attestation <span class="noTag">is</span> 2 Pet, which is not distinctly traceable before the 3rd century (See <a href="./study/isbe/search.html?string=CANON+OF+THE+NEW+TESTAMENT">CANON OF THE NEW TESTAMENT</a>; articles under the word) It is to be added that, in a few instances, as in the case of the Old Testament Apocrypha, early Fathers cite as Scripture books not generally accepted as canonical (e.g. Barnabas, Hermas, Apocrypha of Peter).<P>The complete acceptance of all the books in our present New Testament canon may be dated from the Councils of Laodicea (circa 363 AD) and of Carthage (397 AD), confirming the lists of Cyril of Jerusalem, Jerome and Augustine.``1';
isbe[1486]='Bible, the, IV. Canonicity` IV. Literary Growth and Origin—Canonicity.<P>Thus far the books of the Old Testament and New Testament have been taken simply as given, and no attempt has been made to inquire how or when they were written or compiled, or how they came to acquire the dignity and authority implied in their reception into a sacred canon. The field here entered is one bristling with controversy, and it is necessary to choose one\'s steps with caution to find a safe way through it. Details in the survey are left, as before, to the special articles.<P>1. The Old Testament:<P>Attention here is naturally directed, first, to the Old Testament. This, it is obvious, and is on all sides admitted, has a long literary history prior to its final settlement in a canon. As to the course of that history traditional and modern critical views very widely differ. It may possibly turn out that the truth lies somewhere midway between them.<P>(1) Indications of Old Testament Itself.<P>If the indications furnished by the Old Testament itself be accepted, the results are something like the following:<P>(a) Patriarchal Age:<P>No mention is made of writing in the patriarchal age, though it is now known that a high literary culture then prevailed in Babylonia, Egypt and Palestine, and it is not improbable, indeed seems likely, that records in some form came down from that age, and are, in parts, incorporated in the early history of the Bible.<P>(b) Mosaic Age:<P>In Mosaic times writing was in use, and Moses himself was trained in the learning of the Egyptians (<a onClick="return mV(\'Exd\',2,10);">Ex 2:10</a>; <a onClick="return mV(\'Act\',7,22);">Ac 7:22</a>). In no place is the composition of the whole Pentateuch (as traditionally believed) ascribed to Moses, but no inconsiderable amount of written matter is directly attributed to him, creating the presumption that there was more, even when the fact is not stated. Moses wrote "all the words of Yahweh" in the "book of t
