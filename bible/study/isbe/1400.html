isbe[1490]='Biblical Theology`bib\'-li-kal the-ol\'-o-ji:<P><b>I. BIBLICAL THEOLOGY AS A SCIENCE</b><P class="in15">1. Definition<P class="in15">2. Relation to Dogmatics<P class="in15">3. Place and Method of Biblical Theology<P class="in15">4. Relation to Scientific Exegesis<P><b>II. HISTORY OF BIBLICAL THEOLOGY</b><P class="in15">1. Its Rise in Scientific Form<P class="in15">2. Patristic and Scholastic Periods<P class="in15">3. Biblical Efforts in 17th and 18th Centuries<P class="in15">4. Old Testament Theology in First Half of 19th Century<P class="in15">5. New Testament Theology in the 19th Century<P class="in15">6. Old Testament Theology in Second Half of 19th Century<P class="in15">7. Bearings of Criticism on Old Testament Theology<P><b>III. DIVISIONS OF BIBLICAL THEOLOGY</b><P class="in15">1. Divergent Views of Old Testament Divisions<P class="in15">2. Law and Prophecy<P class="in15">3. Primal Prophetism and Final Judaism<P class="in15">4. Place of Mosaism<P class="in15">5. Nature of Israel\'s Religious Development<P><b>LITERATURE</b><hr /><P>I. Biblical Theology As a Science.<P>1. Definition:<P>Biblical theology seems best defined as the doctrine of Biblical religion. As such it works up the material contained in the Old Testament and the New Testament as the product of exegetical study. This is the modern technical sense of the term, whereby it signifies a systematic representation of Biblical religion in its primitive form.<P>Biblical theology has sometimes been taken to signify not alone this science of the doctrinal declarations of the Scriptures, but the whole group of sciences Concerned with the interpretation and exposition of the Scriptures. In that wider view of Biblical theology, the term exegetical theology has been used to define and include the group of sciences already referred to. But the whole weight of preference seems, in our view, to belong to the narrower use of the term Biblical theology, as more strictly scientific.<P>2. Relation to Dogmatics:<P>This is not to confound the science of Biblical theology with that of dogmatics, for their characters are sharply distinguished. The science of dogmatics is a historico-philosophical one; that of Biblical theology is purely historic. Dogmatics declares what, for religious faith, must be regarded as truth; Biblical theology only discovers what the writers of the Old Testament and the New Testament adduce as truth. This latter merely ascertains the contents of the ideas put forward by the sacred writers, but is not concerned with their correctness or verification. It is the what of truth, in these documentary authorities, Biblical theology seeks to attain. The why, or with what right, it is so put forward as truth, belongs to the other science, that of dogmatics.<P>3. Place and Method of Biblical Theology:<P>Biblical theology is thus the more objective science; it has no need of dogmatics; dogmatics, on the other hand, cannot be without the aid of Biblical theology. The Biblical theologian should be a Christian philosopher, an exegete, and, above all, a historian. For it is in a manner purely historical that Biblical theology seeks to investigate the teaching, in whole, of each of the sacred writers. Each writing it studies in itself, in its relation to the others, and in its place in history taken as a whole. Its method is historical-genetic. The proper place of Biblical theology is at the head of historical theology, where it shines as a center of light. Its ideal as a science is to present a clear, complete and comprehensive survey of the Biblical teachings.<P>4. Relation to Scientific Exegesis:<P>In pursuance of this end, Biblical theology is served by scientific exegesis, whose results it presents in ordered form so as to exhibit the organic unity and completeness of Biblical religion. The importance of Biblical theology lies in the way it directs, corrects and fructifies all moral and dogmatic theology by bringing it to the original founts of truth. Its spirit is one of impartial historical inquiry.<P>II. History of Biblical Theology.<P>1. Its Rise in Scientific Form:<P>Biblical theology, in any truly scientific form, dates only from the 18th century. Offspring as it was of German rationalism, it has yet been found deserving of cultivation and scientific study by the most orthodox theology. Indeed, Pietism, too, urged its claims as Biblical dogma, over against the too scholastic dogma of orthodoxy.<P>2. Patristic and Scholastic Periods:<P>The Patristic theology, no doubt, was Biblical, and the Alexandrian School deserves special praise. The scholastic theology of the Middle Ages leaned on the Fathers rather than on the Bible. Biblical theology, in spirit, though not in form, found a revival at the Reformation. But this was early followed by a 17th century type of scholasticism, polemical and confessional.<P>3. Biblical Efforts in 17th and 18th Centuries:<P>Even in that century, however, efforts of a more purely Biblical character were not wanting, as witness those of Schmidt, Witsius and Vitringa. But throughout the entire 18th century there were manifest endeavors to throw off the scholastic yoke and return to Biblical simplicity. Haymann (1708), Busching (1756), Zachariae (1772) and Storr (1793), are examples of the efforts referred to. But it was from the rationalistic side that the first vindication of Biblical theology as a science of independent rank was made. This merit belonged to Gabler (1787), who urged a purely historical treatment of the Bible, and was, later, shared by his colleague, G. L. Bauer, who issued a Biblical Theology of the New Testament (Ger) in four parts (1800-1802). More independent still was the standpoint assumed by C. F. Ammon in his Biblische Theologie (2nd edition, 1801- 2). Ammon does not fail to apprehend the historical character of our science, saying that Biblical theology should deal only with the "materials, fundamental ideas, and results of Biblical teaching, without troubling itself about the connection of the same, or weaving them into an artificial system."<P>4. Old Testament Theology in First Half of 19th Century:<P>The influence of Schleiermacher was hardly a fortunate one, the Old Testament being sundered from the New Testament, and attention centered on the latter. Kayser (1813) and, still more, DeWette, who died in 1850, pursued the perfecting of our science, particularly in matters of method. Continuators of the work were Baumgarten-Crusius (1828), Cramer (1830) and Colln, whose work was posthumously presented by D. Schulz in 1836. It was in the second quarter of the 19th century that the Biblical theology of the Old Testament began to receive the full attention it deserved. It has been declared the merit of Hegel\'s philosophy to have taught men to see, in the various Biblical systems of doctrine, a complete development, and Hegel did, no doubt, exert a fertilizing influence on historical inquiry. But it must also be said that the Hegelian philosophy affected Biblical theology in a prejudicial manner, as may be seen in Vatke\'s a priori construction of history and doctrine in his work, Die bib. Theologie (1835), and in Bruno Bauer\'s Die Religion des AT (1838-39), which disputed but did not improve upon Vatke. Steudel (1840), Oehler (1845) and Havernick (1848) are worthy of particularly honorable mention in this Old Testament connection. In his Theology of the Old Testament (3rd edition, 1891; American edition, 1883) G. F. Oehler excellently maintained the close connection between the Old Testament and the New Testament, which Hengstenberg had already emphasized in 1829.<P>5. New Testament Theology in the 19th Century:<P>The Biblical theology of the New Testament was furthered by the memorable Neander. In 1832, he first issued his Planting and Training of the Christian Church, while his Life of Jesus first appeared in 1837. In this latter work, he summarized the doctrine of the Redeemer, while the former presented the doctrinal teaching of the apostolic writers in such wise as to show the different shades of thought peculiar to each of them, pointing out, at the same time, "how, notwithstanding all difference, there was an essential unity beneath, unless one is deceived by the form, and how the form in its diversity is easily explained." C. F. Schmid improved in some respects upon Neander\'s work in his excellent Biblical Theology of the New Testament, issued (1853) after his death by Weizsacker (new edition, 1864). In Schmid\'s work, the Biblical theology of the New Testament is presented with objectivity, clearness and penetrating sympathy.<P>Hahn\'s Theology of the New Testament (1854) came short of doing justice to the diverse types of doctrinal development in the New Testament. The work of G. V. Lechler on the apostolic and post-apostolic age, was, in its improved form of 1857, much more important. E. Reuss, in 1852, issued his valuable History of the Christian Theology of the Apostolic Age, a complete and critical work, but not sufficiently objective in its treatment. The Prelections on New Testament Theology of F. C. Baur, head of the Tubingen school, exemplify both the merits and the defects of the school. They are critical, independent and suggestive, but lacking in impartiality. They were published by his son after his death (1864). A new edition of these lectures on New Testament theology was issued by Pfleiderer in 1893.<P>Having first dealt with the teachings of Jesus, Baur then set out the materials of the New Testament theology in three periods, making Paul well-nigh the founder of Christianity. For him only four epistles of Paul were genuine products of the apostolic age, namely, Romans, the two Corinthians, Galatians, together with the Revelation. To the growth and history of the New Testament Baur applied the method of the Hegelian dialectic, and, though powerful and profound, displayed a lack of sane, well-balanced judgment. Yet so conservative a scholar as Weiss gave Baur the credit of having "first made it the problem of criticism to assign to each book of the New Testament its place in the history of the development of primitive Christianity, to determine the relations to which it owes its origin, the object at which it aims, and the views it represents." Among Baur\'s followers may be noted Pfleiderer, in his Paulinism (1873).<P>The Theology of the New Testament, by J. J. Van Oosterzee (English edition, 1870), is a serviceable book for students, and the New Testament Theology of A. Immer (1878), already famous for his hermeneutical studies, is noteworthy. Chief among subsequent cultivators of the Biblical theology of the New Testament must be reckoned B. Weiss, whose work in two volumes (English edition, 1882-83) constitutes a most critical and complete, thorough and accurate treatment of the subject in all its details: W. Beyschlag, whose New Testament Theology (English edition, in 2 volumes, 1895) is also valuable; H. Holtzmann, whose treatise on New Testament Theology (1897) dealt in a critical fashion with the doctrinal contents of the New Testament. Holtzmann\'s learning and ability are great, but his work is marred by naturalistic presuppositions. The French work on Theology of the New Testament, by J. Boron (2 volumes, 1893-94) is marked by great independence, skill and fairness. The Theology of the New Testament, by W. F. Adeney (1894), and the yet more recent, and very attractively written, work with the same title, by G. B. Stevens (1899), bring us pretty well up to the present state of our science in respect of the New Testament.<P>6. Old Testament Theology in Second Half of the 19th Century:<P>Coming back to the Biblical theology of the Old Testament in the second half of the 19th century, we find A. Klostermann\'s Investigations into the Old Testament Theology, which appeared in 1868. The Old Testament theology, no less than that of the New Testament, was set forth by that great scholar, H. Ewald, in four volumes (1871-75; English edition (first part), 1888). His interest in New Testament theology was due to his strong feeling that the New Testament is really the second part of the record of Israel\'s revelation. A. Kuenen dealt with the Religion of Israel in two volumes (English edition, 1874-75), writing nobly but with defective insight into, and comprehension of, the higher religious ideas of Israel. F. Hitzig\'s Prelections (1880) deal with theology of the Old Testament, as part of their contents. H. Schultz treated of the Old Testament Theology in two volumes (1st edition, 1869; 5th edition, 1896; English edition, 1892), in a careful, mainly just, and, by comparison, well-balanced handling of the development of its religious ideas.<P>We have not touched upon writers like Smend, for example, in his History of Old Testament Religion (1893), and J. Robertson, in his Early Religion of Israel (2nd edition, 1892), who treat of the Biblical theology of the Old Testament only in a way subsidiary to the consideration of the historico-critical problems. The Conception of Revelation in the Old Testament was dealt with by F. E. Konig in 1882 in a careful and comprehensive manner, and with regard to the order and relation of the documents, revelation in Israel being taken by him in a supranaturalistic sense. Significant also for the progress of Old Testament Biblical theology was The Theological and the Historical View of the Old Testament, by C. Siegfried (1890), who insisted on the development of the higher religion of Israel being studied from the elder prophets as starting-point, instead of the law.<P>Mention should be made of Biblical Study: Its Principles, Methods and History, by C. A. Briggs (1883; 4th edition, 1891); of the important Compendium of the Biblical Theology of the Old and the New Testament by K. Schlottmann (1889); of E. Riehm\'s valuable Old Testament Theology (1889); and of G. Dalman\'s Studies in Biblical Theology—the Divine name and its history—in 1889. Also, of the Old Testament Theology of A. Duff (1891); A. Dillmann\'s Handbook of Old Testament Theology, edited by Kittel (189:5); and of Marti\'s edition of the Theology of the Old Testament of A. Kayser (3rd edition, 1897).<P>Of Theology of the Old Testament, by A. B. Davidson (1904), it may be said that it does full justice to the idea of a progressive development of doctrine in the Old Testament, and is certainly divergent from the view of those who, like Cheyne, treat the Old Testament writings as so many fragments, from which no theology can be extracted. Biblical Theology of the Old Testament, by B. Stade (1905), is the work of a distinguished representative of the modern critical views, already famous for his work on the history of Israel (1887). The Theology of the Old Testament by W. H. Bennett (1906) is a clear and useful compendium of the subject.<P>7. Bearings of Criticism on Old Testament Theology:<P>Recent works like The Problem of the Old Testament by James Orr (1905), Old Testament Critics by Thomas Whitelaw (1903), and Essays in Pentateuchal Criticism, by Harold M. Wiener (1909), deal with the critical questions, and do not concern us here, save to remark that they are not without bearing, in their results, upon theology of the Old Testament. Such results are, e.g. the insistences, in Orr\'s work, on the unity of the Old Testament, the higher than naturalistic view of Israel\'s religious development, the discriminate use of Divine names like Elohim and Yahweh, and so forth; and the express contention in Whitelaw\'s work, that the critical hypotheses are not such as can yield "a philosophically reasonable theology" (p. 346). Indeed, it must not be supposed that even works, like that of S. R. Driver, Introduction to the Literature of the Old Testament (first issued in 1891), axe without resultant influence on Biblical theology.<P>So far from that, the truth is that there is probably no result of the readjustment of the history and literature of the Old Testament so important as its bearings on the Biblical theology of the Old Testament. For the order and the method of revelation are most surely involved in the order and relation of the books or documents, and the course of the history. The progress of the revelation ran parallel with the work of God in Nature and in the growth of human society. Hence, the reconstruction of the historical theology of the Old Testament will take much time and study, that the full value of the Old Testament may be brought out as that of an independent and permanent revelation, with characteristic truths of its own. Meantime, the reality of that revelation, and the teleological character of the Old Testament, have been brought out, in the most signal manner, by theological scholars like Dorner, Dillmann, Kittel, Kautsch, Schultz and others, who feel the inadequacy of natural development or "human reflection" to account for Old Testament th eology, and the immediacy of God\'s contact with man in Old Testament times to be alone sufficient to account for a revelation so weighty, organically connected, dynamically bound together, monotheistic and progressive.<P>III. Divisions of Biblical Theology.<P>1. Divergent Views of Old Testament Divisions:<P>The divisions of Old Testament theology are matters of grave difficulty. For the newer criticism has practically transformed that mode of representing the process of Israel\'s religious development, which had been customary or traditional. On this latter view, the Patriarchal Age was succeeded by the Mosaic Age, with its law-giving under Moses, followed, after an intercalated period of Judges and monarchy, by the splendid Age of Prophecy. Then there was the Exile preparing the way, after the Return, for the new theocracy, wherein the Law of Moses was sought with more persistent endeavor, though not without darkly legalistic result. Such were the historic bases for Old Testament theology, but the modifications proposed by the new criticism are sufficiently serious. These it will be necessary to indicate, without going beyond the scope of this article and attempting criticism of either the one view or the other. It is the more necessary to do so, that finality has not been reached by criticism. We are only concerned with the difference which these divergent views make for Old Testament Biblical theology, whose reconstruction is very far from perfected.<P>2. Law and Prophecy:<P>That they do mean serious difference has been indicated in the historical part of this article. Most obtrusive of these differences is the proposal to invert the order of law and prophecy, and speak rather of the Prophets and the Law. For the Law is, on the newer view, taken to belong to the post-prophetic period—in short, to the period of the return from the Exile, whereas, in the traditional scheme of the order of revelation, the Law was found in full force both at the Exodus and the Return, with a dead-letter period between. The garment of legalism, the newer criticism asserts, could not have suited the Israelite nation in its early and undeveloped stage, as it does after the teachings of the prophets and the discipline of the Exile. Against this, the older scheme prefers the objection that an external and legalistic system is made the outcome of the lofty spiritual teaching of the prophets; the letter appears super-imposed upon the spirit. Criticism, however, postulates for the ritual codes of the Pentateuch an influence parallel in time with that of prophetism.<P>3. Primal Prophetism and Final Judaism:<P>Besides the adjustments of prophecy and law just referred to, the critical views postulate a primal period in which the religion of the prophets, with their view of Israel\'s vocation, was inculcated; also, a final period of Judaism, intercalated between the Return and the Maccabees, in which are seen at work the Levitical law, and various anti-legal tendencies. It must be obvious that attempts to integrate the Old Testament theology amid the prevailing uncertainties of criticism must be far from easy or final, even if the need and importance be felt of keeping the religious interest before even the historical in Old Testament study. For the Old Testament writers, religion was primary, history secondary and incidental, we may well believe.<P>4. Place of Mosaism:<P>We must be content to know less of the remote beginnings and initial stages of Israel\'s religious development, for, as A. B. Davidson remarked, "in matters like this we never can get at the beginning." J. Robertson deems criticism wrong in not allowing "a sufficient starting-point for the development," by which he means that pure prophetic religion needs "a pure pre-prophetic religion" to explain its more than "germinal or elementary character." It may be noted, too, how much greater place and importance are attached to Mosaism or Moses by critics like Reuss, Schultz, Bredenkamp and Strack, than by Wellhausen, who yet allows a certain substratum of actual and historical fact.<P>5. Nature of Israel\'s Religious Development:<P>It may be observed, further, that no one is under any compulsion to account for such a transformation, as even Wellhausen allows, in the slow growth from very low beginnings of the idea of Yahweh up to pure and perfect monotheism—among a non- metaphysical people—by the simple supposition of naturalistic theory. Evolutionary the critical hypothesis of the religious development of Israel may be, but that development was clearly not so exclusively controlled by human elements or factors as to exclude the presence of supernatural energy or power of revelation. It had God within it—had, in Dorner\'s phrase, "teleology as its soul." Thus, as even Gunkel declares, "Israel is, and remains, the people of revelation." This is why Israel was able to make—despite all retrograde tendencies—rectilinear progress toward a predestined goal—the goal of being what Ewald styled a "purely immortal and spiritual Israel." Old Testament theology does not seem to have sufficiently realized that the Old Testament really presents us with theologies rather than a theology—with the progressive development of a religion rather than with theological ideas resting on one historic plane.<P>LITERATURE.<P>I. Old Testament Literature:<P>B. Stade, Biblische Theologie des A T, 1905; H. Schultz, A T Theologie, 5th edition, 1896; English edition, 1892; H. Ewald, Revelation: Its Nature and Record, English edition, 1884; G F. Oehler, Theology of the Old Testament, English edition, 1874; A. Kuenen, The Religion of Israel to the Fall of the Jewish State, English edition, 1875; E. Riehm, AT Theologie, 1889; S. R. Driver, An Introduction to the Literature of the Old Testament, 1st edition,1891,A. B. Davidson, Theology the Old Testament, 1904; J. Orr, The Problem of the Old Testament, 1905; A. Duff, Old Testament Theology, 1891; J. Robertson, Early Religion of Israel, 2nd edition, 1892; W. R. Smith, The Old Testament in the Jewish Church, new edition, 1892; W. H. Bennett; The Theology of the Old Testament, 1896; T. K. Cheyne, Founders of Old Testament Criticism, 1893; T. Whitelaw, Old Testament Critics, 1903; W. G. Jordan, Biblical Criticism and Modern Thought, 1909; H. M. Wiener, Essays in Pentateuchal Crit icism, 1909; E. C. Bissell, The Pentateuch: Its Origin and Structure, 1885; D. K. V. Orelli, The Old Testament Prophecy, Amer. edition,1885,English edition, 1893; B. Duhm, Die Theologogie der Propheten, 1875; E. Richre, Messianic Prophecy, 2nd English edition, 1891; C. I. Bredenkamp, Gesetz und Propheten, 1881; W. R. Smith, The Prophets of Israel, 1882; D. K. Schlottmann, Kompendium der biblischen Theologie des A. u. N. Testaments, 1889; A. T. Kirkpatrick, The Divine Library of the Old Testament, 1891; J. Lindsay, The Significance of the Old Testament for Modern Theology, 1896; R. Kittel, Scientific Study of the Old Testament, English edition, 1910.<P>II. New Testament Literature:<P>W. Beyschlag, New Testament Theology, 2nd edition, 1896; English edition, 1895; H. Holtzmann, Lehrbuch der N T Theologie, 1897; B. Weiss, Lehrbuch der biblischen Theologie des New Testament, 7th edition, 1903; English edition, 1883; J. J. V. Oosterzee, Die Theologie des New Testament, 2nd edition, 1886; English edition, 1870; J. Boron, Theologie du Nouveau Testament, 1893-94; C. F. Schmid, Biblische Theologie des New Testament, new edition, 1864; G. B. Stevens, The Theology of the New Testament, 1899; F. C. Baur, Vorlesungen uber New Testament Theologie, 1864; W. F. Adeney, The Theology of the New Testament, 1894; A. C. McGiffert, A History of Christianity in the Apostolic Age, 1897; E. Reuss, History of Christian Theology in the Apostolic Age, English edition, 1872; H. H. Wendt, The Teaching of Jesus, English edition, 1892; A. B. Bruce, The Kingdom of God, 1890; J. Moorhouse, The Teaching of Christ, 1891; O. Pfleiderer, Der Paulinismus, 2nd edition, 1890; 2nd English edition, 1891; A. Sabatier, The Apostle Paul, English edition, 1891; G. B. Stevens, The Pauline Theology, 2nd edition, 1897; G. Matheso n, The Spiritual Development of Paul, 1890; E. Riehm, Der Lehrbegriff des Hebraerbriefs, 1867; B. Weiss, Der petrinische Lehrbegriff, 1855; G. B. Stevens, The Johannine Theology, 1894; B. Weiss, Der johanneische Lehrbegriff in seinen Grundzugen untersucht, 1862.``96';
isbe[1491]='Bichri`bik\'-ri (bikhri, "first born"; compare HPN,88,102): Father of Sheba who rebelled against David. Bichri is of the house of Benjamin and the word probably means a "descendant of Becher" (<a onClick="return mV(\'2Sa\',20,1);">2Sa 20:1</a>ff). Compare <a href="./study/isbe/search.html?string=BECHER">BECHER 1</a>.``1';
isbe[1492]='Bid`Variously signifying, according to six Hebrew and as many Greek originals:<P>(1) "to command" (<a onClick="return mV(\'Num\',14,10);">Nu 14:10</a>; <a onClick="return mV(\'Mat\',1,24);">Mt 1:24</a> the King James Version, prostasso);<P>(2) "to prescribe" or "order" (<a onClick="return mV(\'Jhn\',2,2);">Joh 2:2</a>);<P>(3) "to consecrate," and so rendered in the Revised Version (British and American) (<a onClick="return mV(\'Zep\',1,7);">Ze 1:7</a>; compare <a onClick="return mV(\'1Sa\',16,5);">1Sa 16:5</a>);<P>(4) eipon, "to say" or "tell" (<a onClick="return mV(\'Mat\',16,12);">Mt 16:12</a>);<P>(5) "to call" i.e. "invite" (kaleo), conspicuously used in this sense in Christ\'s parables of the Marriage Feast (<a onClick="return mV(\'Mat\',22,\'3-9\');">Mt 22:3-9</a>) and of the Great Supper (<a onClick="return mV(\'Luk\',14,\'7-24\');">Lu 14:7-24</a>);<P>(6) "to take leave of," appotasso (<a onClick="return mV(\'Luk\',9,61);">Lu 9:61</a>).``1';
isbe[1493]='Bidden`bid\'-n: "Called," "invited" (<a onClick="return mV(\'1Sa\',9,13);">1Sa 9:13</a>).``1';
isbe[1494]='Bide`bid: A variant of "abide" (which see); is the rendering of perimeno, in The <span class="noTag">Wisdom of Solomon 8:12</span> (the Revised Version (British and American) "they shall wait for me"). In <a onClick="return mV(\'Act\',1,4);">Ac 1:4</a> the same word is translated "wait for."``1';
isbe[1495]='Bidkar`bid\'-kar (bidhqar; "son of Deker" (?); compare HPN, 69): A captain in the service of Jehu, formerly his fellow-officer (<a onClick="return mV(\'2Ki\',9,25);">2Ki 9:25</a>).``1';
isbe[1496]='Bier`ber:<P>(1) Found in the Old Testament only in <a onClick="return mV(\'2Sa\',3,31);">2Sa 3:31</a>, "and king David followed the bier"; and in the New Testament in <a onClick="return mV(\'Luk\',7,14);">Lu 7:14</a>, "and he (Jesus) came nigh and touched the bier." The Hebrew word rendered "bier" (mittah) and its Greek equivalent (soros) mean strictly "coffin." The so-called "bier" among the ancient Hebrews was simply an open coffin or a flat wooden frame, on which the body of the dead was carried from the house to the grave.<P>(2) Closed coffins, so universal now in the West, were unknown to common usage among the Hebrews of olden times, though not unknown to Egyptians, Greeks and Romans.<P>At the burial of Abner the people were commanded to "rend their clothes" and "gird themselves with sackcloth," and the king himself in token of his grief and royal regard, "followed the bier" in the procession to the grave (<a onClick="return mV(\'2Sa\',3,31);">2Sa 3:31</a>).<P>(3) Of Jesus, when He met the procession that went out of the gate of the city of Nain, bearing to the grave the only son of the widowed mother, Luke says, "When the Lord saw her, he had compassion on her...and he came nigh and touched the bier," and commanded the young man to arise, etc. We should recall that contact with a dead body was forbidden by the law as a source of defilement (<a onClick="return mV(\'Num\',19,11);">Nu 19:11</a>f); so Jesus here "came nigh" and "touched the bier" only in raising the young man, thus avoiding any criticism for infraction of the law. In <a onClick="return mV(\'Jhn\',11,35);">Joh 11:35</a>, as here, we have a miracle of Jesus which clearly pointed to a higher law—the eternal law of compassion which received its first full expression in the life of Jesus and forms one of the distinctive features of the gospel.``47';
isbe[1497]='Bigtha`big\'-tha (bighetha\'; Septuagint Barazi; Codex Vaticanus, Boraze; Codex Alexandrinus, Oareboa): One of the seven eunuchs or chamberlains having charge of the harem of King Xerxes ("Ahasuerus") and commanded to bring Vashti to the king\'s banquet (<a onClick="return mV(\'Est\',1,10);">Es 1:10</a>).``1';
isbe[1498]='Bigthan; Bigthana`big\'-than big-tha\'-na (bighethan, bighethana\'; Septuagint omits name): One of the two chamberlains or eunuchs of Xerxes on ("Ahasuerus") who conspired against the king\'s life, the conspiracy being detected by Mordecai and the culprits hanged (<a onClick="return mV(\'Est\',2,21);">Es 2:21</a>). Possibly these men had been partially superseded by the degradation of Vashti and were thus prompted to take revenge Xerxes.``1';
isbe[1499]='Bigvai`big\'-va-i (bighway; Baogei, Bagoua):<P>(1) The head of one of the families who returned from Babylon with Zerubbabel (<a onClick="return mV(\'Ezr\',2,2);">Ezr 2:2</a>; <a onClick="return mV(\'Neh\',7,7);">Ne 7:7</a>), having a large number of his retainers (2,056, according to <a onClick="return mV(\'Ezr\',2,14);">Ezr 2:14</a>; <span class="noTag">2,067</span>, according to <a onClick="return mV(\'Neh\',7,19);">Ne 7:19</a>), besides 72 males later under Ezra (<a onClick="return mV(\'Ezr\',8,14);">Ezr 8:14</a>).<P>(2) One of those who subscribed the covenant with Nehemiah (<a onClick="return mV(\'Neh\',10,16);">Ne 10:16</a>).``1';
isbe[1500]='Bikath-Aven`bik-ath-a\'-ven (biq\'ath \'awen, "valley of vanity" (<a onClick="return mV(\'Amo\',1,5);">Am 1:5</a> King James Version, margin)).`<a href="./study/isbe/search.html?string=AVEN">AVEN</a>; <a href="./study/isbe/search.html?string=BETH+EDEN">BETH-EDEN</a>`1';
