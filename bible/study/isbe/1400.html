isbe = [];

isbe[1401]='Beth-Car`beth\'-kar (beth-kar; Baithchor, Belchor): "And the men of Israel went out of Mizpah, and pursued the Philistines, and smote them, Until they came under Beth-car" (<a onClick="return mV(\'1Sa\',7,11);">1Sa 7:11</a>). \'Ain Karem has been suggested; if Mizpah is nebi Samwil then this identification is probable, as the pursuit would be along the deep Wady beit Hannineh—a natural line of retreat for the Philistines to take.`<a href="./study/isbe/search.html?string=BETH+HACCHEREM">BETH-HACCHEREM</a>`1';
isbe[1402]='Beth-Dagon`beth-da\'-gon (bethdaghon; Bethdagon):<P>(1) A town in the Shephelah of Judah named with Gederoth, Naamah, and Makkedah (<a onClick="return mV(\'Jos\',15,41);">Jos 15:41</a>). It may be represented by the modern Beit Dijan, about 6 miles southeast of Jaffa. This however is a modern site, and not in the Shephelah. Nearly 2 miles to the south is Khirbet Dajan, a Roman site. The connection in which it occurs leads us to expect a position farther southeast<P>(2) A city on the border of Asher (<a onClick="return mV(\'Jos\',19,27);">Jos 19:27</a>) which Conder would identify with Tell D\'auk, near the mouth of the Belus, in the plan of Acre.<P>The name seems to have been of frequent occurrence. There is a Beit Dejan about 6 miles east of Nablus, and Josephus speaks of a fortress called Dagon above Jericho (Ant., XII, viii, 1; BJ, I, ii, 3). This would seem to indicate a widespread worship of Dagon. But the name may mean "house of corn."``54';
isbe[1403]='Beth-Diblathaim`beth-dib-la-tha\'-im (beth dibhlathayim; oikos Deblaithaim, literally, "house of Diblathaim"): A town in Moab mentioned with Dibon and Nebo (<a onClick="return mV(\'Jer\',48,22);">Jer 48:22</a>). It is probably identical with Almondiblathaim (<a onClick="return mV(\'Num\',33,46);">Nu 33:46</a>f). Mesha claims to have fortified it along with Mehedeba and Ba\'al-me\'on (see <a href="./study/isbe/search.html?string=MOABITE+STONE">MOABITE STONE</a>). The place is not yet identified.``1';
isbe[1404]='Beth-Eden`beth-e\'-den (<a onClick="return mV(\'Amo\',1,5);">Am 1:5</a> King James Version, margin; English Versions of the Bible "house of Eden").`<a href="./study/isbe/search.html?string=CHILDREN+OF+EDEN">CHILDREN OF EDEN</a>`1';
isbe[1405]='Beth-Emek`beth-e\'-mek (beth ha-\'emeq; Bethaemek, "house of the valley"): A town in the territory of Zebulun (<a onClick="return mV(\'Jos\',19,27);">Jos 19:27</a>). It has not been identified, but must be sought somewhere east of Acre, not far from Kabul, the ancient Cabul.``1';
isbe[1406]='Beth-Ezel`beth-e\'-zel (beth ha-\'etsel; oikos echomenous autes; literally, "adjoining house"): A place named along with other cities in the Philistine plain (<a onClick="return mV(\'Mic\',1,11);">Mic 1:11</a>). The site has not been identified. By some it is thought to be the same as Azel of <a onClick="return mV(\'Zec\',14,5);">Zec 14:5</a>;`<a href="./study/isbe/search.html?string=AZEL">AZEL</a>`1';
isbe[1407]='Beth-Gader`beth-ga\'-der (bethgadher; Baithgedor, or (Codex Vaticanus) Baithgaidon): The name occurs between those of Bethlehem and Kiriath-jearim in <a onClick="return mV(\'1Ch\',2,51);">1Ch 2:51</a>. It is possibly identical with Geder of <a onClick="return mV(\'Jos\',12,13);">Jos 12:13</a>.``1';
isbe[1408]='Beth-Gamul`beth-ga\'-mul (beth gamul; oikos Gaimol; Codex Sinaiticus, Gamola): A city in Moab named with Dibon, Kiriathaim and Beth-meon (<a onClick="return mV(\'Jer\',48,23);">Jer 48:23</a>). Conder places it at Umm el-Jamal, toward east of the plateau, south of Medeba (HDB, under the word). Others (Guthe, Kurz. bib. Worterbuch, under the word; Buhl, GAP, 268, etc.) favor Jemeil, a site 6 miles east of Dhiban. Since the town is not mentioned among the cities of Israel Buhl doubts if it should be sought north of the Arnon.``1';
isbe[1409]='Beth-Gilgal`beth-gil\'-gal (beth ha-gilgal; Bethaggalgal; the King James Version house of Gilgal): The Gilgal which lay in the plain east of Jericho (<a onClick="return mV(\'Neh\',12,29);">Ne 12:29</a>).`<a href="./study/isbe/search.html?string=GILGAL">GILGAL</a>`1';
isbe[1410]='Beth-Haccherem`beth-ha-ke\'-rem, beth-hak\'-e-rem (the King James Version Beth-haccerem; beth ha-kerem; Bethachcharma (see DB), "place of the vineyard"): A district (in <a onClick="return mV(\'Neh\',3,14);">Ne 3:14</a>) ruled over by one, Malchijah; mentioned in <a onClick="return mV(\'Jer\',6,1);">Jer 6:1</a> as a suitable signal station. From its association with Tekoa (<a onClick="return mV(\'Jer\',6,1);">Jer 6:1</a>) and from the statement by Jerome that it was a village which he could see daily from Bethlehem, the Frank mountain (Herodium) has been suggested. It certainly would be a unique place for a beacon. More suitable is the fertile vineyard country around \'Ain Karem (the "spring of the vineyard"). On the top of Jebel \'Ali, above this village, are some remarkable cairns which, whatever their other uses, would appear to have been once beacons. \'Ain Karem appears as Carem in the Septuagint (<a onClick="return mV(\'Jos\',15,59);">Jos 15:59</a>).`<a href="./study/isbe/search.html?string=BETH+CAR">BETH-CAR</a>`117';
isbe[1411]='Beth-Haggan`beth-hag\'-an (beth-ha-gan, "house of the garden"). The place where Ahaziah was slain by Jehu (<a onClick="return mV(\'2Ki\',9,27);">2Ki 9:27</a>). The words are rendered in English Versions of the Bible "the garden house," but some take them to be a proper name. The location is doubtful.``1';
isbe[1412]='Beth-Hanan; Elon-Beth-Hanan`beth-ha\'-nan (<a onClick="return mV(\'1Ki\',4,9);">1Ki 4:9</a>).`<a href="./study/isbe/search.html?string=ELON">ELON</a>`1';
isbe[1413]='Beth-Haram`beth-ha\'-ram (beth haram; Baitharan; Codex Alexandrinus, Baitharra; the King James Version wrongly, Beth-Aram): An Amorite city taken and fortified by the Gadites (<a onClick="return mV(\'Jos\',13,27);">Jos 13:27</a>; <a onClick="return mV(\'Num\',32,36);">Nu 32:36</a>; in the latter passage the name appears as Beth-haran, probably the original form). It corresponds to Bethramphtha of Josephus (Ant., XVIII, ii, 1), which, according to Eusebius, was the name used by the Syrians. Here was a palace of Herod (Ant., XVII, x, 6; BJ, II, iv, 2). Eusebius, Onomasticon says it was called Livias. Josephus says it was fortified by Herod Antipas, who called it Julias for the wife of Augustus (Ant., XVIII, ii, 1; BJ, II, ix, 1). The name would be changed to Julias when Livia, by the will of the emperor, was received into the Gens Julia. It is represented by Tell er-Rameh in Wady Chesban, about 6 miles east of Jordan.``54';
isbe[1414]='Beth-Haran`beth-ha\'-ran (beth haran): A fenced city east of the Jordan (<a onClick="return mV(\'Num\',32,36);">Nu 32:36</a>) identical with <a href="./study/isbe/search.html?string=BETH-HARAM">BETH-HARAM</a>, which see.``1';
isbe[1415]='Beth-Hoglah`beth-hog\'-la (beth-choghlah; Septuagint Baithaglaam, "house of partridge"): Mentioned in <a onClick="return mV(\'Jos\',15,6);">Jos 15:6</a>; <a onClick="return mV(\'Jos\',18,19);">18:19</a>, identified with Ain Haijab ("partridge spring") lying between Jericho and the Jordan, where in 1874 there was still a ruined Greek monastery called Kasr Hajlah, dating from the 12th century. The ruins are now destroyed. In <a onClick="return mV(\'Jos\',15,5);">Jos 15:5</a>; <a onClick="return mV(\'Jos\',18,19);">18:19</a> it is said to be at the mouth of the Jordan on a Tongue (Lisan) of the Salt Sea. But it is now several miles inland, probably because the Jordan has silt edition up a delta to that extent.`<a href="./study/isbe/search.html?string=DEAD+SEA">DEAD SEA</a>`198';
isbe[1416]='Beth-Horon`beth-ho\'-ron (beth-choron (other Hebrew forms occur); Bethoron, probably the "place of the hollow"; compare Hauran, "the hollow"):<P>1. The Ancient Towns:<P>The name of two towns, Beth-horon the Upper (<a onClick="return mV(\'Jos\',16,5);">Jos 16:5</a>) and Beth-horon the Lower (<a onClick="return mV(\'Jos\',16,3);">Jos 16:3</a>), said to have been built (<a onClick="return mV(\'1Ch\',7,24);">1Ch 7:24</a>) by Sheerah, the daughter of Beriah. The border line between Benjamin and Ephraim passed by the Beth- horons (<a onClick="return mV(\'Jos\',16,5);">Jos 16:5</a>; <a onClick="return mV(\'Jos\',21,22);">21:22</a>), the cities belonging to the latter tribe and therefore, later on, to the Northern Kingdom. Solomon "built Beth-horon the upper, and Beth-horon the nether, fortified cities, with walls, gates, and bars" (<a onClick="return mV(\'2Ch\',8,5);">2Ch 8:5</a>; <a onClick="return mV(\'1Ki\',9,17);">1Ki 9:17</a>).<P>From Egyptian sources (Muller, As. und Europa, etc.) it appears that Beth-horon was one of the places conquered by Shishak of Egypt from Rehoboam. Again, many centuries later, Bacchides repaired Beth-horon, "with high walls, with gates and with bars and in them he set a garrison, that they might work malice upon ("vex") Israel" (1Macc 9:50,51), and at another time the Jews fortified it against Holofernes (Judith 4:4,5).<P>2. The Modern Beit Ur el foqa and el tachta:<P>These two towns are now known as Beit Ur el foqa (i.e. "the upper") and Beit Ur el tachta (i.e. "the lower"), two villages crowning hill tops, less than 2 miles apart; the former is some 800 ft. higher than the latter. Today these villages are sunk into insignificance and are off any important lines of communication, but for many centuries the towns occupying their sites dominated one of the most historic roads in history.<P>3. The Pass of the Beth-horons:<P>When (<a onClick="return mV(\'Jos\',10,10);">Jos 10:10</a>) Joshua discomfited the kings of the Amorites "he slew them with a great slaughter at Gibeon, and chased them by the way of the \'Ascent of Beth-horon.\' " When the Philistines were opposing King Saul at Michmash they sent a company of their men to hold "the way of Beth-horon."<P>This pass ascends from the plain of Ajalon (now Yalo) and climbs in about 3/4 hr. to Beit Ur el tachta (1,210 ft.); it then ascends along the ridge, with valleys lying to north and south, and reaches Beit Ur el foqa (2,022 ft.), and pursuing the same ridge arrives in another 4 1/2 miles at the plateau to the north of el Jib (Gibeon). At intervals along this historic route traces of the ancient Roman paving are visible. It was the great highroad into the heart of the land from the earliest times until about three or four centuries ago. Along this route came Canaanites, Israelites, Philistines, Egyptians, Syrians, Romans, Saracens and Crusaders. Since the days of Joshua (<a onClick="return mV(\'Jos\',10,10);">Jos 10:10</a>) it has frequently been the scene of a rout. Here the Syrian general Seron was defeated by Judas Maccabeus (1Macc 3:13-24), and six years later Nicanor, retreating from Jerusalem, was here defeated and slain (1Macc 7:39ff; Josephus, Ant, XII, x, 5). Along this pass in 66 AD the Roman general Cestius Gallus was driven in headlong flight before the Jews.<P>Now the changed direction of the highroad to Jerusalem has left the route forsaken and almost forgotten. See PEF, III, 86, Sh XVII.``117';
isbe[1417]='Beth-Horon, the Battle of`1. The Political Situation<P>2. Joshua\'s Strategy<P>3. Joshua\'s Command to the Sun and Moon<P>4. The Astronomical Relations of the Sun and Moon<P>5. The "Silence" of the Sun<P>6. "Yahweh Fought for Israel"<P>7. The Afternoon\'s March<P>8. The Chronicle and the Poem Independent Witnesses<P>9. Date of the Events<P>10. The Records Are Contemporaneous with the Events<hr /><P>1. The Political Situation:<P>The battle which gave to the Israelites under Joshua the command of Southern Palestine has always excited interest because of the astronomical marvel which is recorded to have then taken place.<P>In invading Palestine the Israelites were not attacking a single coherent state, but a country occupied by different races and divided, like Greece at a later period, into a number of communities, each consisting practically of but a single city and the cultivated country around it. Thus Joshua destroyed the two cities of Jericho and Ai without any interference from the other Amorites. The destruction of Jericho gave him full possession of the fertile valley of the Jordan; the taking of Ai opened his way up to the ridge which forms the backbone of the country, and he was able to lead the people unopposed to the mountains of Ebal and Gerizim for the solemn reading of the Law. But when the Israelites returned from this ceremony a significant division showed itself amongst their enemies. Close to Ai, Joshua\'s most recent conquest, was Beeroth, a small town inhabited by Hivites; and no doubt because in the natural order of events Beeroth might look to be next attacked, the Hivites determined to make terms with Israel. An embassy was therefore sent from Gibeon, their chief city, and Joshua and the Israelites, believing that it came from a distant land not under the Ban, entered into the proposed alliance.<P>The effect on the political situation was immediate. The Hivites formed a considerable state, relatively speaking; their cities were well placed on the southern highland, and Gibeon, their capital, was one of the most important fortresses of that district, and only 6 miles distant from Jerusalem, the chief Amorite stronghold. The Amorites recognized at once that, in view of this important defection, it was imperative for them to crush the Gibeonites before the Israelites could unite with them, and this they endeavored to do. The Gibeonites, seeing themselves attacked, sent an urgent message to Joshua, and he at the head of his picked men made a night march up from Gilgal and fell upon the Amorites at Gibeon the next day and put them to flight.<P>2. Joshua\'s Strategy:<P>We are not told by which route he marched, but it is significant that the Amorites fled by the way of Beth-horon; that is to say, not toward their own cities, but away from them. A glance at the map shows that this means that Joshua had succeeded in cutting their line of retreat to Jerusalem. He had probably therefore advanced upon Gibeon from the south, instead of by the obvious route past Ai which he had destroyed and Beeroth with which he was in alliance. But, coming up from Gilgal by the ravines in the neighborhood of Jerusalem, he was exposed to a great danger, for the Amorites might have caught him before he had gained a footing on the plateau, and have taken him at a complete disadvantage. It was thus that the eleven tribes suffered such terrible loss at the hands of the Benjamites in this very region during the first inter-tribal war, and probably the military significance of the first repulse from Ai was of the same character; the forces holding the high ground being able to overwhelm their opponents without any fear of reprisals.<P>It would seem possible, therefore, that Joshua may have repeated, on a larger scale, the tactics he employed in his successful attack upon Ai. He may have sent one force to draw the Amorites away from Gibeon, and when this was safely done, may have led the rest of his army to seize the road to Jerusalem, and to break up the forces besieging Gibeon. If so, his strategy was successful up to a certain point. He evidently led the Israelites without loss up to Gibeon, crushed the Amorites there, and cut off their retreat toward Jerusalem. He failed in one thing. In spite of the prodigious efforts which he and his men had made, the greater part of the Amorite army succeeded in escaping him and gained a long start in their flight, toward the northwest, through the two Beth-horons.<P>3. Joshua\'s Command to the Sun and Moon:<P>It was at this point that the incident occurred upon which attention has been chiefly fixed. The Book of Jashar (which seems to have been a collection of war songs and other ballads) ascribes to Joshua the command: "Sun, be thou silent upon (be) Gibeon (compare Revised Version margin); And thou, Moon, in (be) the valley of Aijalon. And the Sun was silent, And the Moon stayed, Until the nation had avenged themselves of their enemies." (<a onClick="return mV(\'Jos\',10,12,23);">Jos 10:12, 23</a>). And the prose narrative continues, "The sun stayed in the midst of heaven, and hasted not to go down about a whole day."<P>4. The Astronomical Relations of the Sun and Moon:<P>In these two, the ballad and the prose chronicle, we have several distinct astronomical relations indicated. The sun to Joshua was associated with Gibeon, and the sun can naturally be associated with a locality in either of two positions: it may be overhead to the observer, in which case he would consider it as being above the place where he himself was standing; or on the other hand, he might see the locality on the skyline and the sun rising or setting just behind it. In the present instance there is no ambiguity, for the chronicle distinctly states that the sun was in "the midst of heaven"; literally, in the halving of the heaven, that is to say overhead. This is very important because it assures us that Joshua must have been at Gibeon when he spoke, and that it must have been noonday of summer when the sun in Southern Palestine is only about 8 degrees or 12 degrees from the exact zenith. Next, the moon appeared to be associated with the valley of Aijalon; that is, it must have been low down on the horizon in that direction, and since Aijalon is Northwest of Gibeon it must have been about to set, which would imply that it was about half full, in its "third quarter," the sun being, as we have seen, on the meridian. Thirdly, "the sun hasted not to go down," that is to say, it had already attained the meridian, its culmination; and henceforward its motion was downward. The statement that it was noonday is here implicitly repeated, but a further detail is added. The going down of the sun appeared to be slow. This is the work of the afternoon, that is of half the day, but on this occasion the half-day appeared equal in length to an ordinary whole day. There is therefore no question at all of the sun becoming stationary in the sky: the statement does not admit of that, but only of its slower progress.<P>5. The "Silence" of the Sun:<P>The idea that the sun was fixed in the sky, in other words, that the earth ceased for a time to rotate on its axis, has arisen from the unfortunate rendering of the Hebrew verb dum, "be silent," by "stand thou still." It is our own word "dumb," both being onomatopoetic words from the sound made when a man firmly closes his lips upon his speech. The primary meaning of the word therefore is "to be silent," but its secondary meaning is "to desist," "to cease," and therefore in some cases "to stand still. "<P>From what was it then that Joshua wished the sun to cease: from its moving or from its shining? It is not possible to suppose that, engaged as he was in a desperate battle, he was even so much as thinking of the sun\'s motion at all. But its shining, its scorching heat, must have been most seriously felt by him. At noon, in high summer, the highland of Southern Palestine is one of the hottest countries of the world. It is impossible to suppose that Joshua wished the sun to be fixed overhead, where it must have been distressing his men who had already been 17 hours on foot. A very arduous pursuit lay before them and the enemy not only had a long start but must have been fresher than the Israelites. The sun\'s heat therefore must have been a serious hindrance, and Joshua must have desired it to be tempered. And the Lord hearkened to his voice and gave him this and much more. A great hailstorm swept up from the west, bringing with it a sudden lowering of temperature, and no doubt hiding the sun and putting it to "silence."<P>6. "Yahweh Fought for Israel":<P>And "Yahweh fought for Israel," for the storm burst with such violence upon the Amorites as they fled down the steep descent between the Beth-horons, that "they were more who died with the hailstones than they whom the children of Israel slew with the sword" (<a onClick="return mV(\'Jos\',10,11);">Jos 10:11</a>). This was the culminating incident of the day, the one which so greatly impressed the sacred historian. "There was no day like that before it or after it, that Yahweh hearkened unto the voice of a man" (<a onClick="return mV(\'Jos\',10,14);">Jos 10:14</a>). It was not the hailstorm in itself nor the veiling of the sun that made the day so remarkable. It was that Joshua had spoken, not in prayer or supplication, but in command, as if all Nature was at his disposal; and the Lord had hearkened and had, as it were, obeyed a human voice: an anticipation of the time when a greater Joshua should command even the winds and the sea, and they should obey Him (<a onClick="return mV(\'Mat\',8,\'23-27\');">Mt 8:23-27</a>).<P>7. The Afternoon\'s March:<P>The explanation of the statement that the sun "hasted not to go down about a whole day" is found in <a onClick="return mV(\'Jos\',10,10);">Jos 10:10</a>, in which it is stated that the Lord discomfited the Amorites before Israel, "and he slew them with a great slaughter at Gibeon, and chased them by the way of the ascent of Beth-horon, and smote them to Azekah, and unto Makkedah." The Israelites had of course no time-keepers, no clocks or watches, and the only mode of measuring time available to them was the number of miles they marched. Now from Gibeon to Makkedah by the route indicated is some 30 miles, a full day\'s march for an army. It is possible that, at the end of the campaign, the Israelites on their return found the march from Makkedah to Gibeon heavy work for an entire day. Measured by the only means available to them, that afternoon seemed to be double the ordinary length. The sun had "hasted not to go down about a whole day."<P>8. The Chronicle and the Poem Independent Witnesses:<P>Joshua\'s reference to the moon in connection with the Valley of Aijalon appears at first sight irrelevant, and has frequently been assumed to be merely inserted to complete the parallelism of the poem. But when examined astronomically it becomes clear that it cannot have been inserted haphazard. Joshua must have mentioned the moon because he actually saw it at the moment of speaking. Given that the sun was "in the midst of heaven," above Gibeon, there was only a very restricted arc of the horizon in which the moon could appear as associated with some terrestrial object; and from Gibeon, the Valley of Aijalon does lie within that narrow arc. It follows therefore that unless the position assigned to the moon had been obtained from actual observation at the moment, it would in all probability have been an impossible one. The next point is especially interesting. The ballad does not expressly state whether the sun was upon Gibeon in the sense of being upon it low down on the distant horizon, or upon it, in the sense of being overhead both to Joshua and to that city. But the moon being above the Valley of Aijalon, it becomes clear that the latter is the only possible solution. The sun and moon cannot both have been setting—though this is the idea that has been generally held, it being supposed that the day was far spent and that Joshua desired it to be prolonged—for then sun and moon would have been close together, and the moon would be invisible. The sun cannot have been setting, and the moon rising; for Aijalon is west of Gibeon. Nor can the sun have been rising, and the moon setting, since this would imply that the time of year was either about October 30 of our present calendar, or about February 12. The month of February was already past, since the Israelites had kept the Feast of the Passover. October cannot have come; for, since Beeroth, Gibeon and Jerusalem were so close together, it is certain that the events between the return of the Israelites to Gilgal and the battle of Beth-horon cannot have been spread over several months, but must have occupied only a few days. The poem therefore contains implicitly the same fact that is explicitly stated in the prose narrative—that the sun was overhead—but the one statement cannot, in those days, have been inferred from the other.<P>9. Date of the Events:<P>A third point of interest is that the position of the moon gives an indication of the time of the year. The Valley of Aijalon <span class="noTag">is</span> 17 degrees north of west of from Gibeon, of which the latitude <span class="noTag">is</span> 31</a> degrees 51 minutes North. With these details, and assuming the time to be nearly noon, the date must have been about the 21st day of the 4th month of the Jewish calendar, corresponding to July 22 of our present calendar, with a possible uncertainty of one or two days on either side. The sun\'s declination would then be about 21 degrees North, so that at noon it was within 11 degrees of the zenith. It had risen almost exactly at 5 AM and would set almost exactly at 7 PM. The moon was now about her third quarter, and in North latitude, about 5 degrees. It had risen about 11 o\'clock the previous night, and was now at an altitude of under 7 degrees, and within about half an hour of setting. The conditions are not sufficient to fix the year, since from the nature of the luni-solar cycle there will always be one or two years in each cycle of 19 that will satisfy the conditions of the case, and the date of the Hebrew invasion of Palestine is not known with sufficient certainty to limit the inquiry to any particular cycle.<P>10. The Records Are Contemporaneous with the Events:<P>It will be seen however that the astronomical conditions introduced by the mention of the moon are much more stringent than might have been expected. They supply therefore proof of a high order that the astronomical details, both of the poem and prose chronicle, were derived from actual observation at the time and have been preserved to us unaltered. Each, therefore, supplies a strictly contemporaneous and independent record.<P>This great occurrence appears to be referred to in one other passage of Scripture—the Prayer of Habakkuk. Here again the rendering of the English versions is unfortunate, and the passage should stand: "The sun and moon ceased (to shine) in their habitation; At the light of Thine arrows they vanished, And at the shining of Thy glittering spear. Thou didst march through the land in indignation, Thou didst thresh the nations in anger" (<a onClick="return mV(\'Hab\',3,11,12);">Hab 3:11-12</a>).``119';
isbe[1418]='Beth-Jeshimoth`beth-jesh\'-i-moth (beth ha-yeshimoth; Codex Vaticanus, Haisimoth; Codex Alexandrinus, Asimoth, and other variants (see DB, under the word)): Mentioned as the point in the south from which the camp of Israel stretched to Abel-shittim in the plains of Moab (<a onClick="return mV(\'Num\',33,49);">Nu 33:49</a>). In <a onClick="return mV(\'Jos\',12,3);">Jos 12:3</a> the way to Beth-jeshimoth is described as south of the Arabah, near the Dead Sea. It was in the lot assigned to Reuben (<a onClick="return mV(\'Jos\',13,20);">Jos 13:20</a>), At what times and how long it was actually held by Israel we do not know; but it appears in <a onClick="return mV(\'Eze\',25,9);">Eze 25:9</a> as belonging to Moab. It may be identical with Khirbet es-Suweimeh, where there are some ruins and a well, about 3 miles east of the mouth of the Jordan.``54';
isbe[1419]='Beth-Leaphrah`beth-le-af\'-ra (beth le\'aphrah; Septuagint ex oikou kata gelota, "house of dust"): The name of a place found only in <a onClick="return mV(\'Mic\',1,10);">Mic 1:10</a>. From the connection in which it is used it was probably in the Philistine plain. There seems to be a play upon the name in the sentence, "at Beth le-\'apharah have I rolled myself in the dust," \'aphrah meaning "dust," and possibly another on Philistine in rolled, hith-palldshithi (see G. A. Smith, The Book of the Twelve Prophets, called Minor, in the place cited.).``1';
isbe[1420]='Beth-Lebaoth`beth-le-ba\'-oth, beth-leb\'-aoth (beth lebha\'oth; Baithalbath, "house of lionesses"): A town in the territory of Simeon (<a onClick="return mV(\'Jos\',19,6);">Jos 19:6</a>). In <a onClick="return mV(\'1Ch\',4,31);">1Ch 4:31</a> the name is given as Beth-birei: the Revised Version (British and American) <a href="./study/isbe/search.html?string=BETH-BIRI ">BETH-BIRI</a> (which see).``1';
isbe[1421]='Beth-Lehemite`beth\'-le-hem-it (beth ha-lachmi): An inhabitant of Bethlehem, a town in Judah, 5 miles south of Jerusalem. Jesse is so named in <a onClick="return mV(\'1Sa\',16,18);">1Sa 16:18</a>; <a onClick="return mV(\'1Sa\',17,58);">17:58</a>, and Elhanan in <a onClick="return mV(\'2Sa\',21,19);">2Sa 21:19</a>. The children of Bethlehem are referred to in <a onClick="return mV(\'Ezr\',2,21);">Ezr 2:21</a>; <a onClick="return mV(\'Neh\',7,26);">Ne 7:26</a>; 1Esdras 5:17.``1';
isbe[1422]='Beth-Lomon`beth-lo\'-mon (Baithlomon; Codex Vaticanus, Rhagethlomon): The inhabitants of this city are mentioned as returning with Zerubbabel from Babylon (1Esdras 5:17). It is the city of Bethlehem in Judah, the modern Beit Lachm (<a onClick="return mV(\'Ezr\',2,21);">Ezr 2:21</a>).``1';
isbe[1423]='Beth-Maacah`beth-ma\'-a-ka.`<a href="./study/isbe/search.html?string=ABEL-BETH-MAACAH">ABEL-BETH-MAACAH</a>`1';
isbe[1424]='Beth-Marcaboth`beth-mar\'-ka-both (beth ha-markabhoth; Baithmachereb, "the house of chariots"): Mentioned along with Hazar-susah, "the station of horses" (<a onClick="return mV(\'Jos\',19,5);">Jos 19:5</a>; <a onClick="return mV(\'1Ch\',4,31);">1Ch 4:31</a>) as cities in the Negeb near Ziklag. It is tempting to connect these stations with "the cities for his chariots, and the cities for his horsemen" which Solomon built (<a onClick="return mV(\'1Ki\',9,19);">1Ki 9:19</a>; compare <a onClick="return mV(\'1Ki\',10,26);">1Ki 10:26</a>). The site of Beth-marcaboth has not been identified, but Guerin (La Terre Sainte. Jerusalem et le Nord de la Judee, II, 230) suggests Khan Yunas, southwest of Gaza, as a suitable chariot city.``117';
isbe[1425]='Beth-Meon`beth-me\'-on: A city of Moab (<a onClick="return mV(\'Jer\',48,23);">Jer 48:23</a>), identical with <a href="./study/isbe/search.html?string=BAAL-MEON">BAAL-MEON</a> (which see).``1';
isbe[1426]='Beth-Merhak`beth-mer\'-hak (beth ha-merchaq; en oiko to makran, literally "a place (house) that was far off" (<a onClick="return mV(\'2Sa\',15,17);">2Sa 15:17</a> the Revised Version, margin "the Far House")): A place mentioned in the account of David\'s flight from Absalom. No town of this name is known on the route which he followed. Some scholars think the name denotes simply the outermost of the houses of the city.``1';
isbe[1427]='Beth-Millo`beth-mil\'-o.`<a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>`1';
isbe[1428]='Beth-Nimrah`beth-nim\'-ra (beth nimrah, "house of leopard," <a onClick="return mV(\'Num\',32,36);">Nu 32:36</a>, but in verse <a onClick="return mV(\'Num\',32,3);">Nu 32:3</a> it is simply Nimrah): In <a onClick="return mV(\'Jos\',13,27);">Jos 13:27</a> the full name appears. In <a onClick="return mV(\'Isa\',15,6);">Isa 15:6</a> the name appears as Nimrim, identified as Tell Nimrim, between Jericho and the mountains on the east, where there is a fountain of large size. The city was assigned to Gad. In the 4th century AD it was located as five Roman miles north of Livias. Eusebius calls it Bethamnaram (SEP, I, Tell Nimrin).``1';
isbe[1429]='Beth-Palet`beth-pa\'-let.`<a href="./study/isbe/search.html?string=BETH+PELET">BETH-PELET</a>`1';
isbe[1430]='Beth-Pazzez`beth-paz\'-ez (beth patstsets; Bersaphes, Baithphrasee): A town in the territory of Issachar, named with En-gannim and En- haddah (<a onClick="return mV(\'Jos\',19,21);">Jos 19:21</a>). The site has not been discovered; it probably lay near the modern Jenin.``1';
isbe[1431]='Beth-Pelet`beth-pe\'-let (beth-pelet; Baithphaleth, "house of escape"; the King James Version Beth-palet; <a onClick="return mV(\'Jos\',15,27);">Jos 15:27</a>, Beth-phelet, the King James Version <a onClick="return mV(\'Neh\',11,26);">Ne 11:26</a>): One of "the uttermost cities of the tribe of the children of Judah toward the border of Edom in the (Negeb) south" (<a onClick="return mV(\'Jos\',15,21,27);">Jos 15:21, 27</a>). Site unknown.``1';
isbe[1432]='Beth-Peor`beth-pe\'-or (beth pe\'or; oikos Phogor; in Joshua (Vaticanus), Baithphogor, or beth-):" Over against Beth-peor" the Israelites were encamped, "beyond the Jordan, in the valley," when Moses uttered the speeches recorded in Deuteronomy (<a onClick="return mV(\'Deu\',3,29);">De 3:29</a>; <a onClick="return mV(\'Deu\',4,46);">4:46</a>). "In the valley in the land of Moab over against Beth-peor" Moses was buried (<a onClick="return mV(\'Deu\',34,6);">De 34:6</a>). Beth-peor and the slopes of Pisgah (the King James Version "Ashdoth-pisgah") are mentioned in close connection in <a onClick="return mV(\'Jos\',13,20);">Jos 13:20</a>. According to Eusebius, Onomasticon, Beth-peor was situated near Mt. Peor (Fogor) opposite Jericho, 6 miles above Livias. Mt. Peor is the "top" or "head" of Peor (<a onClick="return mV(\'Num\',23,28);">Nu 23:28</a>). Some height commanding a view of the plain east of the river in the lower Jordan valley is clearly intended, but thus far no identification is possible. "The slopes of Pisgah" are probably the lower slopes of the mountain toward Wady \'Ayun Musa. Somewhere north of this the summit we are in search of may be found. Conder suggested the cliff at Minyeh, south of Wady Jedeideh, and of Pisgah; and would locate Beth-peor at el-Mareighat, "the smeared things," evidently an ancient place of worship, with a stone circle and standing stones, about 4 miles east, on the same ridge. This seems, however, too far south, and more difficult to reach from Shittim than we should gather from <a onClick="return mV(\'Num\',25,1);">Nu 25:1</a>ff.``54';
isbe[1433]='Beth-Phelet`beth-fe\'-let.`<a href="./study/isbe/search.html?string=BETH+PELET">BETH-PELET</a>`1';
isbe[1434]='Beth-Rapha`beth-ra\'-fa (beth rapha\'; B, ho Bathraia, Bathrepha): The name occurs only in the genealogical list in <a onClick="return mV(\'1Ch\',4,12);">1Ch 4:12</a>. It does not seem possible now to associate it with any particular place or clan.``1';
isbe[1435]='Beth-Rehob`beth-re\'-hob (beth-rechobh; ho oikos Rhaab): An Aramean town and district which, along with Zobah and Maacah, assisted Ammon against David (<a onClick="return mV(\'2Sa\',10,6,8);">2Sa 10:6, 8</a>, Rehob). It is probably identical with Rehob (<a onClick="return mV(\'Num\',13,21);">Nu 13:21</a>), the northern limit of the spies\' journey. Laish-Dan (probably Tell el-Kadi) was situated near it (<a onClick="return mV(\'Jdg\',18,28);">Jud 18:28</a>). The site of the town is unknown. It has been conjecturally identified with Hunin, west of Banias, and, more plausibly, with Banias itself (Thomson, The Land and the Book (2), 218; Buhl, Geog., 240; Moore, ICC, Judges, 399).``172';
isbe[1436]='Beth-Shean; Beth-Shan`beth-she\'-an, beth\'-shan (beth-shan, or [beth-she\'an]; in Apocrypha Baithsan or Bethsa): A city in the territory of Issachar assigned to Manasseh, out of which the Canaanites were not driven (<a onClick="return mV(\'Jos\',17,11);">Jos 17:11</a>; <a onClick="return mV(\'Jdg\',1,27);">Jud 1:27</a>); in the days of Israel\'s strength they were put to taskwork (<a onClick="return mV(\'Jdg\',1,28);">Jud 1:28</a>). They doubtless were in league with the Philistines who after Israel\'s defeat on Gilboa exposed the bodies of Saul and his sons on the wall of the city (<a onClick="return mV(\'1Sa\',31,7);">1Sa 31:7</a>ff), whence they were rescued by the men of Jabesh, who remembered the earlier kindness of the king (<a onClick="return mV(\'1Sa\',31,7);">1Sa 31:7</a>ff; <a onClick="return mV(\'2Sa\',21,12);">2Sa 21:12</a>). In <a onClick="return mV(\'1Ki\',4,12);">1Ki 4:12</a> the name applies to the district in which the city stands. It was called Scythopolis by the Greeks. This may be connected with the invasion of Palestine by the Scythians who, according to George Syncellus, "overran Palestine and took possession of Beisan." This may be the invasion noticed by Herodotus, circa 600 BC (i.104-6). Here Tryphon failed in his first attempt to take Jonathan by treachery (1Macc 12:40). It fell to John Hyrcanus, but was taken from the Jews by Pompey. It was rebuilt by Gabinius (Ant., XIV, v, 3), and became an important member of the league of the "ten cities" (BJ, III, ix, 7). The impiousness of the inhabitants is painted in dark colors by Josephus (Vita, 6; BJ, II, xviii, 3); and the Mishna speaks of it as a center of idol worship (\'Abhodhah Zarah, i.4). Later it was the seat of a bishop.<P>It is represented by the modern Beisan, in the throat of the Vale of Jezreel where it falls into the Jordan valley, on the southern side of the stream from \'Ain Jalud. The ruins of the ancient city are found on the plain, and on the great mound where probably stood the citadel. Between the town and the stretch of marsh land to the south runs the old road from east to west up the Vale of Jezreel, uniting in Esdraelon with the great caravan road from north to south.``54';
isbe[1437]='Beth-Shemesh`beth-she\'-mesh, beth\'-shemesh (beth-shemesh; Baithsamus, "house of the sun"): This name for a place doubtless arose in every instance from the presence of a sanctuary of the sun there. In accordance with the meaning and origin of the word, it is quite to be expected that there should be several places of this name in Bible lands, and the expectation is not disappointed. Analysis and comparison of the passages in the Bible where a Beth-shemesh is mentioned show four places of this name.<P>1. Beth-shemesh of Judah:<P>The first mention of a place by this name is in the description of the border of the territory of Judah (<a onClick="return mV(\'Jos\',15,10);">Jos 15:10</a>) which "went down to Beth-Shemesh." This topographical indication "down" puts the place toward the lowlands on the east or west side of Palestine, but does not indicate which. This point is clearly determined by the account of the return of the ark by the Philistine lords from Ekron (<a onClick="return mV(\'1Sa\',6,\'9-19\');">1Sa 6:9-19</a>). They returned the ark to Beth-shemesh, the location of which they indicated by the remark that if their affliction was from Yahweh, the kine would bear the ark "by the way of its own border." The Philistines lay along the western border of Judah and the location of Beth-Shemesh of Judah is thus clearly fixed near the western lowland, close to the border between the territory of Judah and that claimed by the Philistines. This is confirmed by the account of the twelve officers of the commissariat of King Solomon. One of these, the son of Dekar, had a Beth-shemesh in his territory. By excluding the territory assigned to the other eleven officers, the territory of this son of Dekar is found to be in Judah and to lie along the Philistine border (<a onClick="return mV(\'1Ki\',4,9);">1Ki 4:9</a>). A Philistine attack upon the border- land of Judah testifies to the same effect (<a onClick="return mV(\'2Ch\',28,18);">2Ch 28:18</a>). Finally, the battle between Amaziah of Judah and Jehoash of Israel, who "looked one another in the face" at Beth-shemesh, puts Beth-Shemesh most probably near the border between Judah and Israel, which would locate it near the northern part of the western border of Judah\'s territo ry. In the assignment of cities to the Levites, Judah gave Beth-shemesh with its suburbs (<a onClick="return mV(\'Jos\',21,16);">Jos 21:16</a>). It has been identified with a good degree of certainty with the modern \'Ain Shems.<P>It may be that Ir-shemesh, "city of the sun," and Har-cherec, "mount of the sun," refer to Beth-shemesh of Judah (<a onClick="return mV(\'Jos\',15,10);">Jos 15:10</a>; <a onClick="return mV(\'Jos\',19,\'41-43\');">19:41-43</a>; <a onClick="return mV(\'1Ki\',4,9);">1Ki 4:9</a>; <a onClick="return mV(\'Jdg\',1,33);">Jud 1:33c</a>, <a onClick="return mV(\'Jdg\',1,35);">35</a>). But the worship of the sun was so common and cities of this name so many in number that it would be hazardous to conclude with any assurance that because these three names refer to the same region they therefore refer to the same place.<P>2. Beth-shemesh of Issachar:<P>In the description of the tribal limits, it is said of Issachar (<a onClick="return mV(\'Jos\',19,22);">Jos 19:22</a>), "And the border reached to Tabor, and Shahazumah, and Beth-shemesh; and the goings out of their border were at the Jordan." The description indicates that Beth- shemesh was in the eastern part of Issachar\'s territory. The exact location of the city is not known.<P>3. Beth-shemesh of Naphtali:<P>A Beth-shemesh is mentioned together with Beth-anath as cities of Naphtali (<a onClick="return mV(\'Jos\',19,38);">Jos 19:38</a>). There is no clear indication of the location of this city. Its association with Beth-anath may indicate that they were near each other in the central part of the tribal allotment. As at Gezer, another of the cities of the Levites the Canaanites were not driven out from Beth- shemesh.<P>4. Beth-shemesh "that is in the Land of Egypt":<P>A doom is pronounced upon "Beth-shemesh, that is in the land of Egypt" (<a onClick="return mV(\'Jer\',43,13);">Jer 43:13</a>). The Seventy identify it with Heliopolis. There is some uncertainty about this identification. If Beth-shemesh, "house of the sun," is here a description of Heliopolis, why does it not have the article? If it is a proper name, how does it come that a sanctuary in Egypt is called by a Hebrew name? It may be that the large number of Jews in Egypt with Jeremiah gave this Hebrew name to Heliopolis for use among themselves, Beth-shemesh. being a translation of Egyptian Perra as suggested by Griffith. Otherwise, Beth- shemesh. cannot have been Heliopolis, but must have been some other, at present unknown, place of Semitic worship. This latter view seems to be favored by Jeremiah\'s double threat: "He shall also break the pillars of Beth-shemesh, that is in the land of Egypt; and the houses of the gods of Egypt shall he burn with fire" (save place). If Beth-shemesh were the "house of the sun," then the balancing of the state ment would be only between "pillars" and "houses," but it seems more naturally to be between Beth-shemesh, a Semitic place of worship "that is in the land of Egypt" on the one hand, and the Egyptian place of worship, "the houses of the gods of Egypt," on the other.<P>But the Seventy lived in Egypt and in their interpretation of this passage were probably guided by accurate knowledge of facts unknown now, such as surviving names, tradition and even written history. Until there is further light on the subject, it is better to accept their interpretation and identify this Beth-shemesh with Heliopolis.`<a href="./study/isbe/search.html?string=ON">ON</a>`93';
isbe[1438]='Beth-Shemite`beth-she\'-mit beth-shimshi (<a onClick="return mV(\'1Sa\',6,14,20);">1Sa 6:14, 20</a>): An inhabitant of Beth-shemesh in Judah (compare <a href="./study/isbe/search.html?string=BETH-SHEMESH">BETH-SHEMESH 1</a>).``1';
isbe[1439]='Beth-Shittah`beth-shit\'-a (beth ha-shittah, "house of the acacia"): A place on the route followed by the Midianites in their flight before Gideon (<a onClick="return mV(\'Jdg\',7,22);">Jud 7:22</a>). It is probably identical with the modern Shutta, a village in the Vale of Jezreel, about 6 miles Northwest of Beisan.``1';
isbe[1440]='Beth-Tappuah`beth-tap\'-u-a (beth-tappuach; Beththapphoue, "place of apples" (see however <a href="./study/isbe/search.html?string=APPLE">APPLE</a>)); A town in the hill country of Judah (<a onClick="return mV(\'Jos\',15,53);">Jos 15:53</a>), probably near Hebron (el Tappuah, <a onClick="return mV(\'1Ch\',2,43);">1Ch 2:43</a>), possibly the same as Tephon (1Macc 9:50). The village of Tuffuch, 3 1/2 miles Northwest of Hebron, is the probable site; it stands on the edge of a high ridge, surrounded by very fruitful gardens; an ancient highroad runs through the village, and there are many old cisterns and caves. (See PEF, III, 310, 379, Sh XXI.)``117';
isbe[1441]='Beth-Zacharias`beth-zak-a-ri\'-as (Baith-zacharia): Here Judas Maccabeus failed in battle with Antiochus Eupator, and his brother Eleazar fell in conflict with an elephant (1Macc 6:32ff; the King James Version "Bathzacharias"). It was a position of great strength, crowning a promontory which juts out between two deep valleys. It still bears the ancient name with little change, Beit Zakaria. It lies about 4 miles southwest of Bethlehem (BR, III, 283ff; Ant, XII, ix, 4).``1';
isbe[1442]='Beth-Zur`beth\'-zur (beth-tsur; Baith-sour, "house of rock"; less probably "house of the god Zur"):<P>(1) Mentioned (<a onClick="return mV(\'Jos\',15,58);">Jos 15:58</a>) as near Halhul and Gedor in the hill country of Judah; fortified by Rehoboam (<a onClick="return mV(\'2Ch\',11,7);">2Ch 11:7</a>). In <a onClick="return mV(\'Neh\',3,16);">Ne 3:16</a> mention is made of "Nehemiah the son of Azbuk, the ruler of half the district of Beth-zur." During the Maccabean wars it (Bethsura) came into great importance (1Macc 4:29,61; 6:7,26,31,49,50; 9:52; 10:14; 11:65; 14:7,33). Josephus describes it as the strongest place in all Judea (Ant., XIII, v, 6). It was inhabited in the days of Eusebius and Jerome.<P>(2) It is the ruined site Belt Cur, near the main road from Jerusalem to Hebron, and some 4 miles north of the latter. Its importance lay in its natural strength, on a hilltop dominating the highroad, and also in its guarding the one southerly approach for a hostile army by the Vale of Elah to the Judean plateau. The site today is conspicuous from a distance through the presence of a ruined medieval tower. (See PEF, III, 311, Sh XXI).``117';
isbe[1443]='Bethabara`beth-ab\'-a-ra beth\'abharah; (Bethabara, "house of the ford"): According to the King James Version (following Textus Receptus of the New Testament) the place where John baptized (<a onClick="return mV(\'Jhn\',1,28);">Joh 1:28</a>). the Revised Version (British and American) (with Tischendorf, Westcott and Hort, The New Testament in Greek following Codex Sinaiticus, Codex Vaticanus, Codex Alexandrinus, Codex Ephraemi) reads <a href="./study/isbe/search.html?string=BETHANY">BETHANY</a>. It is distinguished from the Bethany of Lazarus and his sisters as being "beyond the Jordan." The reading "Bethabara" became current owing to the advocacy of Origen. Various suggestions have been made to explain the readings. G. A. Smith (HGHL) suggests that Bethany ("house of the ship") and Bethabara ("house of the ford") are names for the same place. Bethabara has also been identified with Bethbarah, which, however, was probably not on the Jordan but among the streams flowing into it (<a onClick="return mV(\'Jdg\',7,24);">Jud 7:24</a>). It is interesting to note that LXXB reads Baithabara for Massoretic Text Beth-\'arabhah, one of the cities of Benjamin (<a onClick="return mV(\'Jos\',18,22);">Jos 18:22</a>). If this be correct, the site is in Judea.<P>Another solution is sought in the idea of a corruption of the original name into Bethany and Bethabara, the name having the consonants n, b and r after Beth. In <a onClick="return mV(\'Jos\',13,27);">Jos 13:27</a> (Septuagint, Codex Vaticanus) we find Baithanabra for Bethnimrah (Massoretic Text), and Sir George Grove in DB (arts. "Bethabara" and "Beth-nimrah") identifies Bethabara and Beth-nimrah. The site of the latter was a few miles above Jericho (see <a href="./study/isbe/search.html?string=BETH-NIMRAH">BETH-NIMRAH</a>), "immediately accessible to Jerusalem and all Judea" (compare <a onClick="return mV(\'Mat\',3,5);">Mt 3:5</a>; <a onClick="return mV(\'Mar\',1,5);">Mr 1:5</a>, and see article "Bethany" in EB). This view has much in its favor.<P>Then, again, as Dr. G. Frederick Wright observes: "The traditional site is at the ford east of Jericho; but as according to <a onClick="return mV(\'Jhn\',1,29,35,43);">Joh 1:29, 35, 43</a> it was only one day\'s journey from Cana of Galilee, while according to <a onClick="return mV(\'Jhn\',10,40);">Joh 10:40</a>; <a onClick="return mV(\'Jhn\',11,3,6,27);">11:3, 6, 27</a> it was two or three days from Bethany, it must have been well up the river toward Galilee. Conder discovered a well-known ford near Beisan called Abarah, near the mouth of the valley of Jezreel. This <span class="noTag">is</span> 20 miles from Cana and 60 miles from Bethany, and all the conditions of the place fit in with the history."`<a href="./study/isbe/search.html?string=BETHANY">BETHANY</a>`78';
isbe[1444]='Bethany`beth\'-a-ni (Bethania):<P>(1) A village, 15 furlongs from Jerusalem (<a onClick="return mV(\'Jhn\',11,18);">Joh 11:18</a>), on the road to Jericho, at the Mount of Olives (<a onClick="return mV(\'Mar\',11,1);">Mr 11:1</a>; <a onClick="return mV(\'Luk\',19,29);">Lu 19:29</a>), where lived "Simon the leper" (<a onClick="return mV(\'Mar\',14,3);">Mr 14:3</a>) and Mary, Martha and Lazarus (<a onClick="return mV(\'Jhn\',11,18);">Joh 11:18</a>f). This village may justifiably be called the Judean home of Jesus, as He appears to have preferred to lodge there rather than in Jerusalem itself (<a onClick="return mV(\'Mat\',21,17);">Mt 21:17</a>; <a onClick="return mV(\'Mar\',11,11);">Mr 11:11</a>). Here occurred the incident of the raising of Lazarus (<a onClick="return mV(\'Jhn\',11,\'1-\');">Joh 11</a>) and the feast at the house of Simon (<a onClick="return mV(\'Mat\',26,\'1-13\');">Mt 26:1-13</a>; <a onClick="return mV(\'Mar\',14,\'3-9\');">Mr 14:3-9</a>; <a onClick="return mV(\'Luk\',7,\'36-50\');">Lu 7:36-50</a>; <a onClick="return mV(\'Jhn\',12,\'1-8\');">Joh 12:1-8</a>). The Ascension as recorded in <a onClick="return mV(\'Luk\',24,\'50-51\');">Lu 24:50-51</a> is thus described: "He led them out until they were over against Bethany: and he lifted up his hands, and blessed them. And it came to pass, while he blessed them, he parted from them, and was carried up into heaven."<P>Bethany is today el \'Azareyeh ("the place of Lazarus"—the L being displaced to form the article). It is a miserably untidy and tumble-down village facing east on the southeast slope of the Mount of Olives, upon the carriage road to Jericho. A fair number of fig, almond and olive trees surround the houses. The traditional tomb of Lazarus is shown and there are some remains of medieval buildings, besides rock-cut tombs of much earlier date (PEF, III, 27, Sheet XVII).<P>(2) "Bethany beyond the Jordan" (<a onClick="return mV(\'Jhn\',1,28);">Joh 1:28</a>; the King James Version Bethabara; Bethabara, a reading against the majority of the manuscripts, supported by Origen on geographical grounds): No such place is known. Grove suggested that the place intended is <a href="./study/isbe/search.html?string=BETH-NIMRAH">BETH-NIMRAH</a> (which see), the modern Tell nimrin, a singularly suitable place, but hard to fit in with <a onClick="return mV(\'Jhn\',1,28);">Joh 1:28</a>; compare <a onClick="return mV(\'Jhn\',2,1);">Joh 2:1</a>. The traditional site is the ford east of Jericho.``117';
isbe[1445]='Betharam`beth-a\'-ram (beth haram).`<a href="./study/isbe/search.html?string=BETH+HARAM">BETH-HARAM</a>`1';
isbe[1446]='Bethasmoth`beth-az\'-moth (the King James Version Bethsamos; Baithasmoth (1Esdras 5:18); corresponds to Beth-azmaveth in <a onClick="return mV(\'Neh\',7,28);">Ne 7:28</a>): A town in the territory of Benjamin, and may be identified with the modern el-Hizmeh.`<a href="./study/isbe/search.html?string=AZMAVETH">AZMAVETH</a>`1';
isbe[1447]='Bethbasi`beth-ba\'-si (Baithbasi): The name may mean "place of marshes" = Hebrew beth-betsi. According to G. A. Smith there is a Wady el-Bassah east of Tekoa in the wilderness of Judea. The name means "marsh," which Dr. Smith thinks impossible, and really "an echo of an ancient name." Jonathan and Simon repaired the ruins of the fortified place "in the desert" (1Macc 9:62,64). Josephus reads Bethalaga, i.e. Beth-hoglah (Ant., XIII, i, 5). Peshitta version reads Beth-Yashan (see <a href="./study/isbe/search.html?string=JESHANAH">JESHANAH</a>), which Dr. Cheyne thinks is probably correct. Thus the origin of the name and the site of the town are merely conjectural.``78';
isbe[1448]='Bethel`beth\'-el (beth-\'el; Baithel and oikos theou, literally, "house of God"):<P>(1) A town near the place where Abraham halted and offered sacrifice on his way south from Shechem.<P>1. Identification and Description:<P>It lay west of Ai (<a onClick="return mV(\'Gen\',12,8);">Ge 12:8</a>). It is named as on the northern border of Benjamin (the southern of Ephraim, <a onClick="return mV(\'Jos\',16,2);">Jos 16:2</a>), at the top of the ascent from the Jordan valley by way of Ai (<a onClick="return mV(\'Jos\',18,13);">Jos 18:13</a>). It lay south of Shiloh (<a onClick="return mV(\'Jdg\',21,19);">Jud 21:19</a>). Eusebius, Onomasticon places it 12 Roman miles from Jerusalem, on the road to Neapolis. It is represented by the modern Beitin, a village of some 400 inhabitants, which stands on a knoll east of the road to Nablus. There are four springs which yield supplies of good water. In ancient times these were supplemented by a reservoir hewn in the rock south of the town. The surrounding country is bleak and barren, the hills being marked by a succession of stony terraces, which may have suggested the form of the ladder in Jacob\'s famous dream.<P>2. The Sanctuary:<P>The town was originally called Luz (<a onClick="return mV(\'Gen\',28,19);">Ge 28:19</a>, etc.). When Jacob came hither on his way to Paddan-aram we are told that he lighted upon "the place" (<a onClick="return mV(\'Gen\',28,11);">Ge 28:11</a>. Hebrew). The Hebrew maqom, like the cognate Arabic maqam, denotes a sacred place or sanctuary. The maqom was doubtless that at which Abraham had sacrificed, east of the town. In the morning Jacob set up "for a pillar" the stone which had served as his pillow (<a onClick="return mV(\'Gen\',28,18);">Ge 28:18</a>; see <a href="./study/isbe/search.html?string=PILLAR">PILLAR</a>, matstsebhah), poured oil upon it and called the name of the place Bethel, "house of God"; that is, of God whose epiphany was for him associated with the pillar. This spot became a center of great interest, lending growing importance to the town. In process of time the name Luz disappeared, giving place to that of the adjoining sanctuary, town and sanctuary being identified. Jacob revisited the place on his return from Paddan-aram; here Deborah, Rebekah\'s nurse, died and was buried under "the oak" (<a onClick="return mV(\'Gen\',35,6);">Ge 35:6</a>f). Probably on rising ground east of Bethel Abraham and Lot stood to view the uninviting highlands and the rich lands of the Jordan valley (<a onClick="return mV(\'Gen\',13,9);">Ge 13:9</a>ff).<P>3. History:<P>Bethel was a royal city of the Canaanites (<a onClick="return mV(\'Jos\',12,16);">Jos 12:16</a>). It appears to have been captured by Joshua (<a onClick="return mV(\'Jos\',8,7);">8:7</a>), and it was allotted to Benjamin (<a onClick="return mV(\'Jos\',18,22);">Jos 18:22</a>). In <a onClick="return mV(\'Jdg\',1,22);">Jud 1:22</a>ff it is represented as held by Canaanites, from whom the house of Joseph took it by treachery (compare <a onClick="return mV(\'1Ch\',7,28);">1Ch 7:28</a>). Hither the ark was brought from Gilgal (<a onClick="return mV(\'Jdg\',2,1);">Jud 2:1</a>, Septuagint). Israel came to Bethel to consult the Divine oracle (<a onClick="return mV(\'Jdg\',20,18);">Jud 20:18</a>), and it became an important center of worship (<a onClick="return mV(\'1Sa\',10,3);">1Sa 10:3</a>). The home of the prophetess Deborah was not far off (<a onClick="return mV(\'Jdg\',4,5);">Jud 4:5</a>). Samuel visited Bethel on circuit, judging Israel (<a onClick="return mV(\'1Sa\',7,16);">1Sa 7:16</a>).<P>With the disruption of the kingdom came Bethel\'s greatest period of splendor and significance. To counteract the influence of Jerusalem as the national religious center Jeroboam embarked on the policy which won for him the unenviable reputation of having "made Israel to sin." Here he erected a temple, set up an image, the golden calf, and established an imposing ritual. It became the royal sanctuary and the religious center of his kingdom (<a onClick="return mV(\'1Ki\',12,29);">1Ki 12:29</a>ff; <a onClick="return mV(\'Amo\',7,13);">Am 7:13</a>). He placed in Bethel the priests of the high places which he had made (<a onClick="return mV(\'1Ki\',12,32);">1Ki 12:32</a>). To Bethel came the man of God from Judah who pronounced doom against Jeroboam (<a onClick="return mV(\'1Ki\',13,\'1-\');">1Ki 13</a>), and who, having been seduced from duty by an aged prophet in Bethel, was slain by a lion. According to the prophets Amos and Hosea the splendid idolatries of Bethel were accompanied by terrible moral and religious degradation. Against the place they launched the most scathing denunciations, declaring the vengeance such things must entail (<a onClick="return mV(\'Amo\',3,14);">Am 3:14</a>; <a onClick="return mV(\'Amo\',4,4);">4:4</a>; <a onClick="return mV(\'Amo\',5,11);">5:11</a> m; <a onClick="return mV(\'Amo\',9,1);">Am 9:1</a>; <a onClick="return mV(\'Hsa\',4,15);">Ho 4:15</a>; <a onClick="return mV(\'Hsa\',5,8);">5:8</a>; <a onClick="return mV(\'Hsa\',10,5,8,15);">10:5, 8, 15</a>). With the latter the name Bethel gives place in mockery to Beth-aven. Bethel shared in the downfall of Samaria wrought by the Assyrians; and according to an old tradition, Shalmaneser possessed himself of the golden calf (compare <a onClick="return mV(\'Jer\',48,13);">Jer 48:13</a>). The priest, sent by the Assyrians to teach the people whom they had settled in the land how to serve Yahweh, dwelt in Bethel (<a onClick="return mV(\'2Ki\',17,28);">2Ki 17:28</a>). King Josiah completed the demolition of the sanctuary at Bethel, destroying all the instruments of idolatry, and harr ying the tombs of the idolaters. The monument of the man of God from Judah he allowed to stand (<a onClick="return mV(\'2Ki\',23,4,25);">2Ki 23:4, 25</a>). The men of Bethel were among those who returned from Babylon with Zerubbabel (<a onClick="return mV(\'Ezr\',2,28);">Ezr 2:28</a>; <a onClick="return mV(\'Neh\',7,32);">Ne 7:32</a>), and it is mentioned as reoccupied by the Benjamites (<a onClick="return mV(\'Neh\',11,31);">Ne 11:31</a>). Zechariah (<a onClick="return mV(\'Zec\',7,2);">Zec 7:2</a>) records the sending of certain men from Jerusalem in the 4th year of King Darius to inquire regarding particular religious practices. Bethel was one of the towns fortified by Bacchides in the time of the Maccabees (1Macc 9:50; Ant, XIII, i, 3). It is named again as a small town which, along with Ephraim, was taken by Vespasian as he approached Jerusalem (BJ, IV, ix, 9).<P>(2) A city in Judah which in <a onClick="return mV(\'1Sa\',30,27);">1Sa 30:27</a> is called Bethel; in <a onClick="return mV(\'Jos\',19,4);">Jos 19:4</a> Bethul; and in <a onClick="return mV(\'1Ch\',4,30);">1Ch 4:30</a> Bethuel. The site has not been identified. In <a onClick="return mV(\'Jos\',15,30);">Jos 15:30</a> Septuagint gives Baithel in Judah, where the Hebrew has Kecil, probably a scribal error.``54';
isbe[1449]='Bethel, Mount`(har beth-\'el; Baithel louza (<a onClick="return mV(\'1Sa\',13,2);">1Sa 13:2</a>, the Revised Version (British and American) "the mount of Bethel"; <a onClick="return mV(\'Jos\',16,1);">Jos 16:1</a>)): The hill which stretches from the north of the town to Tell \'Acur. The road to Shechem lies along the ridge. An army in possession of these heights easily commanded the route from north to south.``1';
isbe[1450]='Bethelite`beth\'-el-it: The term applied to a man who in the days of Ahab rebuilt Jericho (<a onClick="return mV(\'1Ki\',16,34);">1Ki 16:34</a>).`<a href="./study/isbe/search.html?string=HIEL">HIEL</a>`1';
isbe[1451]='Bether`be\'-ther (bether): In <a onClick="return mV(\'Sgs\',2,17);">So 2:17</a> mention is made of "the mountains of Bether." It is doubtful if a proper name is intended. The Revised Version, margin has, "perhaps, the spice malobathron." A Bether is prominent in late Jewish history as the place where the Jews resisted Hadrian under Bar Cochba in 135 AD. Its identity with Bittir, 7 miles southwest of Jerusalem, is attested by an inscription.``1';
isbe[1452]='Bethesda`be-thez\'-da (Bethesda; Textus Receptus of the New Testament, <a onClick="return mV(\'Jhn\',5,2);">Joh 5:2</a> (probably beth chicda\', "house of mercy"); other forms occur as Bethzatha and Bethsaida):<P>1. The Conditions of the Narrative: <a onClick="return mV(\'Jhn\',5,2);">Joh 5:2</a>:<P>The only data we have is the statement in <a onClick="return mV(\'Jhn\',5,\'2-4\');">Joh 5:2-4</a>: "Now there is in Jerusalem by the sheep gate a pool, which is called in Hebrew Bethesda, having five porches. In these lay a multitude of them that were sick, blind, halt, withered." Many ancient authorities add (as in the Revised Version, margin) "waiting for the moving of the water: for an angel of the Lord went down at certain seasons into the pool, and troubled the water," etc.<P>The name does not help as to the site, no such name occurs elsewhere in Jerusalem; the mention of the sheep gate is of little assistance because the word "gate" is supplied, and even were it there, its site is uncertain. Sheep "pool" or "place" is at least as probable; the tradition about the "troubling of the water" (which may be true even if the angelic visitant may be of the nature of folk-lore) can receive no rational explanation except by the well-known phenomenon, by no means uncommon in Syria and always considered the work of a supernatural being, of an intermittent spring. The arrangement of the five porches is similar to that demonstrated by Dr. F. Bliss as having existed in Roman times as the Pool of Siloam; the story implies that the incident occurred outside the city walls, as to carry a bed on the Sabbath would not have been forbidden by Jewish traditional law.<P>2. The Traditional Site:<P>Tradition has varied concerning the site. In the 4th century, and probably down to the Crusades, a pool was pointed out as the true site, a little to the Northwest of the present Stephen\'s Gate; it was part of a twin pool and over it were erected at two successive periods two Christian churches. Later on this site was entirely lost and from the 13th century the great Birket Israel, just north of the Temple area, was pointed out as the site.<P>Within the last quarter of a century, however, the older traditional site, now close to the Church of Anne, has been rediscovered, excavated and popularly accepted. This pool is a rock-cut, rain-filled cistern, 55 ft. long X 12 ft. broad, and is approached by a steep and winding flight of steps. The floor of the rediscovered early Christian church roofs over the pool, being supported upon five arches in commemoration of the five porches. At the western end of the church, where probably the font was situated, there was a fresco, now much defaced and fast fading, representing the angel troubling the waters.<P>3. A More Probable Site:<P>Although public opinion supports this site, there is much to be said for the proposal, promulgated by Robinson and supported by Conder and other good authorities, that the pool was at the "Virgin\'s Fount" (see <a href="./study/isbe/search.html?string=GIHON">GIHON</a>), which is today an intermittent spring whose "troubled" waters are still visited by Jews for purposes of cure. As the only source of "living water" near Jerusalem, it is a likely spot for there to have been a "sheep pool" or "sheep place" for the vast flocks of sheep coming to Jerusalem in connection with the temple ritual. See Biblical World, XXV, 80ff.``117';
isbe[1453]='Bethink`be-think\' (heshibh \'el lebh, "to lay to heart," hence, "recall to mind"): Anglo-Saxon word used only in seventh petition of Solomon\'s prayer at the dedication of the Temple. If the people, carried into captivity, because of sin, should "take it to heart," then God (he prayed) would hear and forgive (<a onClick="return mV(\'1Ki\',8,47);">1Ki 8:47</a>; <a onClick="return mV(\'2Ch\',6,37);">2Ch 6:37</a>). A choice illustration of the mental and heart process in reflection, repentance and conversion.``1';
isbe[1454]='Bethlehem`beth\'-le-hem (bethlechem; Baithleem, or Bethleem, "house of David," or possibly "the house of Lakhmu," an Assyrian deity):<P>I. Bethlehem Judah:<P>Bethlehem Judah, or <a href="./study/isbe/search.html?string=EPHRATH">EPHRATH</a> or <a href="./study/isbe/search.html?string=EPHRATHAH">EPHRATHAH</a> (which see) is now Beit Lahm (Arabic = "house of meat"), a town of upward of 10,000 inhabitants, 5 miles south of Jerusalem and 2,350 ft. above sea level. It occupies an outstanding position upon a spur running east from the watershed with deep valleys to the northeast and south. It is just off the main road to Hebron and the south, but upon the highroad to Tekoa and En-gedi. The position is one of natural strength; it was occupied by a garrison of the Philistines in the days of David (<a onClick="return mV(\'2Sa\',23,14);">2Sa 23:14</a>; <a onClick="return mV(\'1Ch\',11,16);">1Ch 11:16</a>) and was fortified by Rehoboam (<a onClick="return mV(\'2Ch\',11,6);">2Ch 11:6</a>). The surrounding country is fertile, cornfields, fig and olive yards and vineyards abound. Bethlehem is not naturally well supplied with water, the nearest spring is 800 yds. to the southeast, but for many centuries the "low level aqueduct" from "Solomon\'s Pools" in the Artas valley, which has here been tunneled through the hill, has been tapped by the inhabitants; there are also many rock-cut cisterns.<P>1. Early History:<P>In <a onClick="return mV(\'1Ch\',2,51);">1Ch 2:51</a> Salma, the son of Caleb, is described as the "father of Bethlehem." In <a onClick="return mV(\'Gen\',35,19);">Ge 35:19</a>; <a onClick="return mV(\'Gen\',48,7);">48:7</a> it is recorded that Rachel "was buried in the way to Ephrath (the same is Beth-lehem)." Tradition points out the site of Rachel\'s tomb near where the road to Bethlehem leaves the main road. The Levites of the events of <a onClick="return mV(\'Jdg\',17,\'1-\');">Jud 17</a>; <a onClick="return mV(\'Jdg\',19,\'1-\');">Jud 19</a> were Bethlehemites. In the list of the towns of Judah the name Bethlehem occurs, in the Septuagint version only in <a onClick="return mV(\'Jos\',15,57);">Jos 15:57</a>.<P>2. David the Bethlehemite:<P>Ruth, famous chiefly as the ancestress of David, and of the Messiah, settled in Bethlehem with her second husband Boaz, and it is noticeable that from her new home she could view the mountains of Moab, her native land. David himself "was the son of that Ephrathite of Bethlehem-judah, whose name was Jesse" (<a onClick="return mV(\'1Sa\',17,12);">1Sa 17:12</a>). To Bethlehem came Samuel to anoint a successor to unworthy Saul (<a onClick="return mV(\'1Sa\',16,4);">1Sa 16:4</a>): "David went to and fro from Saul to feed his father\'s sheep at Bethlehem" (<a onClick="return mV(\'1Sa\',17,15);">1Sa 17:15</a>). David\'s "three mighty men" "brake through the host of the Philistines, and drew water out of the well of Beth- lehem, that was by the gate, and took it, and brought it to David" (<a onClick="return mV(\'2Sa\',23,14,16);">2Sa 23:14, 16</a>). Tradition still points out the well. From this town came those famous "sons of Zeruiah," David\'s nephews, whose loyalty and whose ruthless cruelty became at once a protection and a menace to their royal relative: in <a onClick="return mV(\'2Sa\',2,32);">2Sa 2:32</a> it is mentioned that one of them, Asahel, was buried "in the sepulchre of his father, which was in Bethlehem."<P>3. Later Bible History:<P>After the time of David, Bethlehem would appear to have sunk into insignificance. But its future fame is pointed at by Micah (<a onClick="return mV(\'Mic\',5,2);">Mi 5:2</a>): "But thou, Beth-lehem Ephrathah, which art little to be among the thousands of Judah, out of thee shall one come forth unto me that is to be ruler in Israel; whose goings forth are from of old, from everlasting."<P>In the return of the Jews captive Bethlehemites re-inhabited the place (<a onClick="return mV(\'Ezr\',2,21);">Ezr 2:21</a>; <a onClick="return mV(\'Neh\',7,26);">Ne 7:26</a> "men"; 1Esdras 5:17 "sons").<P>4. The Christian Era:<P>In the New Testament Bethlehem is mentioned as the birthplace of the Messiah Jesus (<a onClick="return mV(\'Mat\',2,1,5);">Mt 2:1, 5</a>; <a onClick="return mV(\'Luk\',2,4,25);">Lu 2:4, 25</a>) in consequence of which event occurred Herod\'s "massacre of the innocents" (<a onClick="return mV(\'Mat\',2,8,16);">Mt 2:8, 16</a>). Inasmuch as Hadrian devastated Bethlehem and set up there a sacred grove to Adonis (Jerome, Ep. ad Paul, lviii. 3) it is clear that veneration of this spot as the site of the Nativity must go back before 132 AD. Constantine (circa 330) founded a basilica over the cave-stable which tradition pointed out as the scene of the birth, and his church, unchanged in general structure though enlarged by Justinian and frequently adorned, repaired and damaged, remains today the chief attraction of the town. During the Crusades, Bethlehem became of great importance and prosperity; it remained in Christian hands after the overthrow of the Latin kingdom, and at the present day it is in material things one of the most prosperous Christian centers in the Holy Land.<P>II. Bethlehem of Zebulun:<P>Bethlehem of Zebulun (<a onClick="return mV(\'Jos\',19,15);">Jos 19:15</a>) was probably the home of Ibzan (<a onClick="return mV(\'Jdg\',12,8);">Jud 12:8</a>) though Jewish tradition is in support of (1). See Josephus, Ant, V, vii, 13. This is now the small village of Beit Lahm, some 7 miles Northwest of Nazareth on the edge of the oak forest. Some antiquities have been found here recently, showing that in earlier days it was a place of some importance. It is now the site of a small German colony. See PEF, I, 270, Sh V.``117';
isbe[1455]='Bethlehem, Star of``<a href="./study/isbe/search.html?string=STAR+OF+THE+MAGI">STAR OF THE MAGI</a>`1';
isbe[1456]='Bethphage`beth\'-fa-je, beth\'-faj (from beth paghah; Bethphage, or Bethphage; in Aramaic "place of young figs"): Near the Mount of Olives and to the road from Jerusalem to Jericho; mentioned together with Bethany (<a onClick="return mV(\'Mat\',21,1);">Mt 21:1</a>; <a onClick="return mV(\'Mar\',11,1);">Mr 11:1</a>; <a onClick="return mV(\'Luk\',19,29);">Lu 19:29</a>). The place occurs in several Talmudic passages where it may be inferred that it was near but outside Jerusalem; it was at the Sabbatical distance limit east of Jerusalem, and was surrounded by some kind of wall. The medieval Bethphage was between the summit and Bethany. The site is now enclosed by the Roman Catholics. As regards the Bethphage of the New Testament, the most probable suggestion was that it occupied the summit itself where Kefr et Tur stands today. This village certainly occupies an ancient site and no other name is known. This is much more probable than the suggestion that the modern Abu Dis is on the site of Bethphage.``117';
isbe[1457]='Bethsaida`beth-sa\'-i-da (Bethsaida, "house of fishing"):<P>(1) A city east of the Jordan, in a "desert place" (that is, uncultivated ground used for grazing) at which Jesus miraculously fed the multitude with five loaves and two fishes (<a onClick="return mV(\'Mar\',6,32);">Mr 6:32</a>ff; <a onClick="return mV(\'Luk\',9,10);">Lu 9:10</a>). This is doubtless to be identified with the village of Bethsaida in Lower Gaulonitis which the Tetrarch Philip raised to the rank of a city, and called Julias, in honor of Julia, the daughter of Augustus. It lay near the place where the Jordan enters the Sea of Gennesaret (Ant., XVIII, ii, 1; BJ, II, ix, 1; III, x, 7; Vita, 72). This city may be located at et-Tell, a ruined site on the east side of the Jordan on rising ground, fully a mile from the sea. As this is too far from the sea for a fishing village, Schumacher (The Jaulan, 246) suggests that el-\'Araj, "a large, completely destroyed site close to the lake," connected in ancient times with et-Tell "by the beautiful roads still visible," may have been the fishing village, and et- Tell the princely residence. He is however inclined to favor el-Mes\'adiyeh, a ruin and winter village of Arab et- Tellawiyeh, which stands on an artificial mound, about a mile and a half from the mouth of the Jordan. It should be noted, however, that the name is in origin radically different from Bethsaida. The substitution of sin for cad is easy: but the insertion of the guttural \'ain is impossible. No trace of the name Bethsaida has been found in the district; but any one of the sites named would meet the requirements.<P>To this neighborhood Jesus retired by boat with His disciples to rest awhile. The multitude following on foot along the northern shore of the lake would cross the Jordan by the ford at its mouth which is used by foot travelers to this day. The "desert" of the narrative is just the barriyeh of the Arabs where the animals are driven out for pasture. The "green grass" of <a onClick="return mV(\'Mar\',6,39);">Mr 6:39</a>, and the "much grass" of <a onClick="return mV(\'Jhn\',6,10);">Joh 6:10</a>, point to some place in the plain of el-Bateichah, on the rich soil of which the grass is green and plentiful compared with the scanty herbage on the higher slopes.<P>(2) Bethsaida of Galilee, where dwelt Philip, Andrew, Peter (<a onClick="return mV(\'Jhn\',1,44);">Joh 1:44</a>; <a onClick="return mV(\'Jhn\',12,21);">12:21</a>), and perhaps also James and John. The house of Andrew and Peter seems to have been not far from the synagogue in Capernaum (<a onClick="return mV(\'Mat\',8,14);">Mt 8:14</a>; <a onClick="return mV(\'Mar\',1,29);">Mr 1:29</a>, etc.). Unless they had moved their residence from Bethsaida to Capernaum, of which there is no record, and which for fishermen was unlikely, Bethsaida must have lain close to Capernaum. It may have been the fishing town adjoining the larger city. As in the case of the other Bethsaida, no name has been recovered to guide us to the site. On the rocky promontory, however, east of Khan Minyeh we find Sheikh \'Aly ec-Caiyadin, "Sheikh Aly of the Fishermen," as the name of a ruined weley, in which the second element in the name Bethsaida is represented. Near by is the site at \'Ain et-Tabigha, which many have identified with Bethsaida of Galilee. The warm water from copious springs runs into a little bay of the sea in which fishes congregate in great numbers. This has therefore always been a favorite haunt of fishermen. If Capernaum were at Khan Minyeh, then the two lay close together. The names of many ancient places have been lost, and others have strayed from their original localities. The absence of any name resembling Bethsaida need not concern us.<P>Were There Two Bethsaidas?:<P>Many scholars maintain that all the New Testament references to Bethsaida apply to one place, namely, Bethsaida Julias. The arguments for and against this view may be summarized as follows:<P>(a) Galilee ran right round the lake, including most of the level coastland on the east. Thus Gamala, on the eastern shore, was within the jurisdiction of Josephus, who commanded in Galilee (BJ, II, xx, 4). Judas of Gamala (Ant., XVIII, i, l) is also called Judas of Galilee (ibid., i, 6). If Gamala, far down the eastern shore of the sea, were in Galilee, a fortiori Bethsaida, a town which lay on the very edge of the Jordan, may be described as in Galilee.<P>But Josephus makes it plain that Gamala, while added to his jurisdiction, was not in Galilee, but in Gaulonitis (BJ, II, xx, 6). Even if Judas were born in Gamala, and so might properly be called a Gaulonite, he may, like others, have come to be known as belonging to the province in which his active life was spent. "Jesus of Nazareth" was born in Bethlehem. Then Josephus explicitly says that Bethsaida was in Lower Gaulonitis (BJ, II, ix, 1). Further, Luke places the country of the Gerasenes on the other side of the sea from Galilee (<a onClick="return mV(\'Luk\',8,26);">Lu 8:26</a>)—antipera tes Galilaias ("over against Galilee").<P>(b) To go to the other side—eis to peran (<a onClick="return mV(\'Mar\',6,45);">Mr 6:45</a>)—does not of necessity imply passing from the east to the west coast of the lake, since Josephus uses the verb diaperaioo of a passage from Tiberias to Tarichea (Vita, 59). But (i) this involved a passage from a point on the west to a point on the south shore, "crossing over" two considerable bays; whereas if the boat started from any point in el-Bateichah, to which we seem to be limited by the "much grass," and by the definition of the district as belonging to Bethsaida, to sail to et-Tell, it was a matter of coasting not more than a couple of miles, with no bay to cross. (ii) No case can be cited where the phrase eis to peran certainly means anything else than "to the other side." (iii) Mark says that the boat started to go unto the other side to Bethsaida, while John, gives the direction "over the sea unto Capernaum" (<a onClick="return mV(\'Mar\',6,17);">Mr 6:17</a>). The two towns were therefore practically in the same line. Now there is no question that Capernaum was on "the other side," nor is there any suggestion that the boat was driven out of its course; and it is quite obvious that, sailing toward Capernaum, whether at Tell Chum or at Khan Minyeh, it would never reach Bethsaida Julius. (iv) The present writer is familiar with these waters in both storm and calm. If the boat was taken from any point in el-Bateichah towards et-Tell, no east wind would have distressed the rowers, protected as that part is by the mountains. Therefore it was no contrary wind that carried them toward Capernaum and the "land of Gennesaret." On the other hand, with a wind from the west, such as is often experienced, eight or nine hours might easily be occupied in covering the four or five miles from el-Bateichah to the neighborhood of Capernaum.<P>(c) The words of Mark (<a onClick="return mV(\'Mar\',6,45);">Mr 6:45</a>), it is suggested (Sanday, Sacred Sites of the Gospels, 42), have been too strictly interpreted: as the Gospel was written probably at Rome, its author being a native, not of Galilee, but of Jerusalem. Want of precision on topographical points, therefore, need not surprise us. But as we have seen above, the "want of precision" must also be attributed to the writer of <a onClick="return mV(\'Jhn\',6,17);">Joh 6:17</a>. The agreement of these two favors the strict interpretation. Further, if the Gospel of Mark embodies the recollections of Peter, it would be difficult to find a more reliable authority for topographical details connected with the sea on which his fisher life was spent.<P>(d) In support of the single-city theory it is further argued that<P>(i) Jesus withdrew to Bethsaida as being in the jurisdiction of Philip, when he heard of the murder of John by Antipas, and would not have sought again the territories of the latter so soon after leaving them.<P>(ii) Medieval works
