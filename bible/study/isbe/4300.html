ng him as well-nigh a martyr to the new spiritual uprising of faith which Isaiah was laboring to bring about. In the Messianic ideal which, in Isaiah\'s sublime conception, was rising into personal form, it fell to his lot to adumbrate the first kingly stage, the stage of committal to Yahweh\'s word and will and abiding the event. It was a cardinal element in that composite ideal which the Second Isaiah pushes to its ultimate in his portrayal of the servant of Yahweh; another element, the element of sacrifice, has yet to be added. Meanwhile, as with the king so with his remnant-realm, the venture of faith is like a precipitation of spiritual vitality, or, as the prophet puts it, a new birth (compare <a onClick="return mV(\'Isa\',26,17);">Isa 26:17</a>f; <a onClick="return mV(\'Isa\',37,3);">37:3</A>; <a onClick="return mV(\'Isa\',66,7);">66:7</A>f; for the stages of it). The event of deliverance, not by men\'s policies but by Yahweh\'s miraculous hand, was the speedy vindication of such trust; and the revulsion of the next decade witnessed a confirming and solidifying of spiritual integrity in the remnant which made it a factor to be reckoned with in the trying times that succeeded (see under <a href="study/isbe/search.html?string=MANASSEH+(3)">MANASSEH</a>). The date of Hezekiah\'s death (probably not long after 690) is not certainly known; nor of the death of his mentor Isaiah (tradition puts this by martyrdom under Manasseh); but if our view of his closing years is correct, the king\'s death crowned a consistent character of strength and spiritual steadfastness; while the unapproachable greatness of Isaiah speaks for itself.<P>IV. Reflection of His Age in Literature.<P>1. Complication and Revival:<P>The sublime and mature utterances of Isaiah alone, falling in this time, are sufficient evidence that in Hezekiah\'s age, Israel reached its golden literary prime. Among the idealists and thinkers throughout the nation a new spiritual vigor and insight were awake. Of their fellowship was the king himself, who emulated the activity of his predecessor Solomon as patron of piety and letters. The compilation of the later Solomonic section of the Proverbs (<a onClick="return mV(\'Pro\',25,\'1-\');">Pr 25-29</a>), attributed to the "men of Hezekiah," indicates the value attached to the accumulations of the so-called Wisdom literature; and it is fair to assume that these men of Hezekiah did not stop with compiling, but stamped upon the body of Proverbs as a whole that sense of it as a philosophy of life which it henceforth bears, and perhaps added the introductory section, <a onClick="return mV(\'Pro\',1,\'1-\');">Pr 1-9</a>. Nor would a king so zealous for the organization and enrichment of the temple-worship (compare <a onClick="return mV(\'Isa\',38,20);">Isa 38:20</a>) be indifferent to its body of sacred song. It seems certain that his was, in all the nation\'s history, the greatest single agency in compiling and adapting the older Davidic Psalms, and in the composition of new ones. Perhaps this union of collecting and creative work in psalmody is referred to in the mention of "the words of David, and of Asaph the seer" (<a onClick="return mV(\'2Ch\',29,30);">2Ch 29:30</a>). To Hezekiah himself is attributed one "writing" which is virtually a psalm, <a onClick="return mV(\'Isa\',38,20);">Isa 38:20</a>. The custom through all the history of hymnology (in our own day also) of adapting older compositions to new liturgical uses makes uncertain the identification of psalms belonging specifically to this period; still, many psalms of books ii and iii, and especially those ascribed to Asaph and the sons of Korah, seem a close reflection of the spirit of the times. An interesting theory recently advanced (see Thirtle, Old Testament Problems) that the fifteen Songs of the Steps ("Degrees" or "Ascents," <a onClick="return mV(\'Psa\',120,\'1-\');">Psalms 120-134</a>) are a memorial of Hezekiah\'s fifteen added years, when as a sign the shadow went backward on the steps of Ahaz (<a onClick="return mV(\'2Ki\',20,\'8-11\');">2Ki 20:8-11</a>), seems to reveal many remarkable echoes of that eventful time. Nor does it seem unlikely that with this first extensive collection of psalms the titles began to be added.<P>2. Of More Creative Strain:<P>This literary activity of Hezekiah\'s time, though concerned largely with collecting and reviving the treasures of older literature, was pursued not in the cold scribal spirit, but in a fervid creative way. This may be realized in two of the psalms which the present writer ascribes to this period. <a onClick="return mV(\'Psa\',49,\'1-\');">Ps 49</a>, a psalm of the sons of Korah, is concerned to make an essential tenet of Wisdom viable in song (compare <a onClick="return mV(\'Psa\',49,3,4);">Ps 49:3-4</a>), as if one of the "men of Hezekiah" who is busy with the Solomonic counsels would popularize the spirit of his findings. <a onClick="return mV(\'Psa\',78,\'1-\');">Ps 78</a> in like manner, a Maschil of Asaph, is concerned to make the noble histories of old viable in song (<a onClick="return mV(\'Psa\',78,2);">78:2</a>), especially the wilderness history when Israel received the law and beheld Yahweh\'s wonders, and down to the time when Ephraim was rejected and Judah, in the person of David, was chosen to the leadership in Israel.<P>Such a didactic poem would not stand solitary in a period so instructed. As in Wisdom and psalmody, so in the domain of law and its attendant history, the literary activity was vigorous. This age of Hezekiah seems the likeliest time for putting into literary idiom that "book of the law" found later in the Temple (<a onClick="return mV(\'2Ki\',22,\'1-\');">2Ki 22</a>); which book Josiah\'s reforms, carried out according to its commands, prove to have been our Book of Deuteronomy. This is not the place to discuss the Deuteronomic problem (see under <a href="study/isbe/search.html?string=JOSIAH">JOSIAH</A>); it is fair to note here, however, that as compared with the austere statement of the Mosaic statutes elsewhere, this book has a literary art and coloring which seem to stamp its style as that of a later age than Moses\', though its substance is Mosaic; and this age of Hezekiah seems the likeliest time to put its rewriting and adaptation. Nor did the new spirit of literary creation feed itself entirely on the past. The king\'s chastening experience of illness and trial, with the steadfast faith that upbore and survived it, must have been fruitful of new ideas, especially of that tremendous conception, now just entering into thought, of the ministry of suffering. Time, of course, must be allowed for the ripening of an idea so full of involvement; and it is long before its sacrificial and atoning values come to light in such utterances as <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a>. But such psalms as <a onClick="return mV(\'Psa\',49,\'1-\');">Ps 49</a> and <a onClick="return mV(\'Psa\',73,\'1-\');">Ps 73</a>, not to mention Hezekiah\'s own psalm (<a onClick="return mV(\'Isa\',38,\'1-\');">Isa 38</a>), show that the problem was a living one; it was working, moreover, in connection with the growing Wisdom philosophy, toward the composition of the Book of Job, which in a masterly way both subjects the current Wisdom motives to a searching test and vindicates the intrinsic integrity of the patriarch in a discipline of most extreme trial. The life of a king whose experience had some share in clarifying the ideas of such a book was not lived in vain.``66';

isbe[4326]='Hezekiah, the Men of`A body of men of letters to whom is ascribed the compilation of a supplementary collection of Solomonic proverbs (<a onClick="return mV(\'Pro\',25,1);">Pr 25:1</a>).`<a href="./study/isbe/search.html?string=PROVERBS+THE+BOOK+OF">PROVERBS, THE BOOK OF</a>; <a href="./study/isbe/search.html?string=HEZEKIAH+(2)">HEZEKIAH</a>`1';
isbe[4327]='Hezion`he\'-zi-on (chezyon; the Septuagint\'s Codex Vaticanus, Azein; Codex Alexandrinus, Azael): An ancestor of Ben-hadad, king of Syria (<a onClick="return mV(\'1Ki\',15,18);">1Ki 15:18</a>).``1';
isbe[4328]='Hezir`he\'-zer:<P>(1) (chezir; the Septuagint\'s Codex Vaticanus, Chezein; Codex Alexandrinus, Iezeir): A Levite in the time of David (<a onClick="return mV(\'1Ch\',24,15);">1Ch 24:15</a>).<P>(2) Septuagint Hezeir): A chief of the people in the time of Nehemiah (<a onClick="return mV(\'Neh\',10,20);">Ne 10:20</a>).``1';
isbe[4329]='Hezro; Hezrai`hez\'-ro, hez\'-ra-i, hez\'-ri (chezro, <a onClick="return mV(\'2Sa\',23,35);">2Sa 23:35</a>; <a onClick="return mV(\'1Ch\',11,37);">1Ch 11:37</a>, but the Qere of <a onClick="return mV(\'2Sa\',23,35);">2Sa 23:35</a> is chezray. The ancient versions almost unanimously support the form Hezrai): A Carmelite, i.e. an inhabitant of Carmel. One of David\'s thirty "mighty men."`<a href="./study/isbe/search.html?string=CARMELITE">CARMELITE</a>`1';
isbe[4330]='Hezron (1)`hez\'-ron (chetsron, and chetsron; Septuagint Asron):<P>(1) A son of Reuben (<a onClick="return mV(\'Gen\',46,9);">Ge 46:9</a>; <a onClick="return mV(\'Exd\',6,14);">Ex 6:14</a>), and head of the family of the Hezronites (<a onClick="return mV(\'Num\',26,6);">Nu 26:6</a>).<P>(2) A son of Perez, and grandson of Judah (<a onClick="return mV(\'Gen\',46,12);">Ge 46:12</a>; <a onClick="return mV(\'Num\',26,21);">Nu 26:21</a>; <a onClick="return mV(\'1Ch\',2,5,9,18,21,24,25);">1Ch 2:5, 9, 18, 21, 24, 25</a>; <a onClick="return mV(\'1Ch\',4,1);">4:1</a>), a direct ancestor of David (<a onClick="return mV(\'Rth\',4,18);">Ru 4:18</a>f). He appears also in the genealogy of our Lord (Esrom) (<a onClick="return mV(\'Mat\',1,3);">Mt 1:3</a>; <a onClick="return mV(\'Luk\',3,33);">Lu 3:33</a>).``1';
isbe[4331]='Hezron (2)`(chetsron, "enclosure"): On the south boundary of Judah between "Kadesh-barnea" and "Addar" (<a onClick="return mV(\'Jos\',15,3);">Jos 15:3</a>); in the parallel passage (<a onClick="return mV(\'Num\',34,4);">Nu 34:4</a>) "Hazar-addar." The two places may have been near together. Conder suggests that the name survives in Jebel Hadhireh, a mountain northwest of Petra in the Tih.``1';
isbe[4332]='Hezronites`hez\'-ron-its (ha-chetsrowni and ha-chetsroni; Septuagint ho Asronei): The name of the descendants of Hezron the son of Reuben (<a onClick="return mV(\'Num\',26,6);">Nu 26:6</a>), and of the descendants of Hezron the son of Perez (<a onClick="return mV(\'Num\',26,21);">Nu 26:21</a>).``1';
isbe[4333]='Hiddai`hid\'-a-i, hi-da\'-i (hidday; Alexandrian Haththai): One of David\'s thirty "mighty men" (<a onClick="return mV(\'2Sa\',23,30);">2Sa 23:30</a>), described as "of the brooks of Gaash." In the parallel list in <a onClick="return mV(\'1Ch\',11,32);">1Ch 11:32</a> the form of the name is "Hurai" (huray).``1';
isbe[4334]='Hiddekel`hid\'-e-kel (chiddeqel): One of the rivers of <a href="study/isbe/search.html?string=EDEN">EDEN</A> (which see) (<a onClick="return mV(\'Gen\',2,14);">Ge 2:14</a>, the Revised Version margin "that is, Tigris"; so Septuagint Tigris), said to flow east to Assyria, usually identified with the Tigris, which rises in Armenia near Lake Van and, after flowing southeast through 8 degrees of latitude, joins the Euphrates in Babylonia to form the Shatt el-\'Arab, which runs for 100 miles through a delta which has been formed since the time of Abraham, and now enters the Persian Gulf through 2 branches. About one-third of the distance below its source, and soon after it emerges from the mountains of Kurdistan, the Tigris passes by Mosul, the site of ancient Nineveh, and, lower down at Bagdad, approaches within a few miles of the Euphrates. Here and for many miles below, since the level is lower than that of the Euphrates, numerous canals are conducted to it, irrigating the most fertile portions of Babylonia.``198';
isbe[4335]='Hidden`hid\'-\'n: The translation of Taman, "to hide," "to bury" (<a onClick="return mV(\'Job\',3,16);">Job 3:16</a>); of tsaphan "to conceal," "store up" (<a onClick="return mV(\'Job\',15,20);">Job 15:20</a>, "The number of years is hidden to the oppressor," the Revised Version (British and American) "even the number of years that are laid up for the oppressor," margin "and years that are numbered are laid up"; <a onClick="return mV(\'Job\',24,1);">Job 24:1</a>, "Why, seeing times are not hidden from the Almighty," the Revised Version (British and American) "Why are times not laid up by the Almighty?" margin as the King James Version with "Why is it?" prefixed; <a onClick="return mV(\'Psa\',83,3);">Ps 83:3</a>, "They consulted (the Revised Version (British and American) "consult") against thy hidden ones"); of matspunim (from tsaphan), "hidden things or places" (<a onClick="return mV(\'Oba\',1,6);">Ob 1:6</a>, "How are his hidden things sought up!" the Revised Version (British and American) "treasures," the American Standard Revised Version "sought out"); of pala\', "to be wonderful," "difficult" (<a onClick="return mV(\'Deu\',30,11);">De 30:11</a>, "This commandment...is not hidden from thee," the Revised Version (British and American) "too hard for thee," margin "or wonderful"); of chaphas, Hithpael, "to hide one\'s self" (<a onClick="return mV(\'Pro\',28,12);">Pr 28:12</a>, the Revised Version (British and American) "When the wicked rise, men hide themselves," margin (Hebrew) "must be searched for"); of kruptos, "hidden," "secret" (<a onClick="return mV(\'1Pe\',3,4);">1Pe 3:4</a>, "the hidden man of the heart"; <a onClick="return mV(\'1Cr\',4,5);">1Co 4:5</a>, krupton, "the hidden things of darkness"; <a onClick="return mV(\'2Cr\',4,2);">2Co 4:2</a>, "the hidden things of dishonesty," the Revised Version (British and American) "of shame"); of apokrupto, "to hide away," trop., not to reveal or make known (<a onClick="return mV(\'1Cr\',2,7);">1Co 2:7</a>, "But we speak God\'s wisdom in a mystery, even the wisdom that hath been hidden"; compare <a onClick="return mV(\'Eph\',3,9);">Eph 3:9</a>; <a onClick="return mV(\'Col\',1,26);">Col 1:26</a>).<P>Among the occurrences of "hidden" in Apocrypha we have (2Esdras 16:62), "The Spirit of Almighty God...searcheth out all hidden things in the secrets of the earth," the Revised Version (British and American) "He who made all things and searcheth out hidden things in hidden places"; Ecclesiasticus 42:19, "revealing the steps (the Revised Version (British and American) "traces") of hidden things," apokruphos; 42:20, "Neither any word is hidden from him," the Revised Version (British and American) "hid," ekrube).``185';
isbe[4336]='Hiel`hi\'-el (chi\'el; Achiel): A Bethelite who according to <a onClick="return mV(\'1Ki\',16,34);">1Ki 16:34</a> rebuilt Jericho, and in fulfillment of a curse pronounced by Joshua (<a onClick="return mV(\'Jos\',6,26);">Jos 6:26</a>) sacrificed his two sons. This seems to have been a custom prevalent among primitive peoples, the purpose being to ward off ill luck from the inhabitants, especially in a case where the destroyer had invoked a curse on him who presumed to rebuild. Numerous instances are brought to light in the excavations of Gezer (Macalister, Bible Side-Lights from the Mound of Gezer, chapter x). At first the very best was claimed as a gift to the deity, e.g. one\'s own sons; then some less valuable member of the community. When civilization prevented human sacrifice, animals were offered instead. The story of Abraham offering Isaac may be a trace of this old custom, the tenor of the story implying that at the time of the writing of the record, the custom was coming to be in disrepute. A similar instance is the offering of his eldest son by the king of Edom to appease the deity and win success in battle (<a onClick="return mV(\'2Ki\',3,27);">2Ki 3:27</a>; compare <a onClick="return mV(\'Mic\',6,7);">Mic 6:7</a>). Various conjectures have been made as to the identity of this king. Ewald regarded him as a man of wealth and enterprise (unternehmender reicher Mann); Cheyne following Niebuhr makes it Jehu in disguise, putting <a onClick="return mV(\'1Ki\',16,34);">1Ki 16:34</a> after <a onClick="return mV(\'2Ki\',10,33);">2Ki 10:33</a>; Winckler explains as folklore.``164';
isbe[4337]='Hierapolis`he-er-ap\'-o-lis (Hierapolis, "sacred city"): As the name implies, Hierapolis was a holy city. It was situated 6 miles from Laodicea and twice that distance from Colosse, on the road from Sardis to Apamea. Though its history is not well known, it seems to have been of Lydian origin, and once bore the name of Kydrara. The Phrygian god Sabazios was worshipped there under the name Echidma, and represented by the symbol of the serpent. Other local deities were Leto and her son Lairbenos. Though called the holy city, Hierapolis was peculiarly regarded as the stronghold of Satan, for there was a Plutonium, or a hole reaching far down into the earth, from which there issued a vapor, even poisoning the birds flying above. It is supposed that upon a stool, deep in the Plutonium, a priest or priestess sat, and, when under the influence of the vapor, uttered prophecies valuable to those who sought them. Though a stronghold of Satan, Hierapolis early became a Christian city, for, according to <a onClick="return mV(\'Col\',4,13);">Col 4:13</a>, the only place where it is mentioned in the New Testament, a church was founded there through the influence of Paul while he was at Ephesus. Tradition claims that Philip was the first evangelist to preach there, and it also claims that he and his two unmarried daughters were buried there; a third who was married, was buried at Ephesus. Several of the early Christians suffered martyrdom at Hierapolis, yet Christianity flourished, other churches were built, and during the 4th century the Christians filled the Plutonium with stones, thus giving evidence that the paganism had been entirely supplanted by the church. During the Roman period, Justinian made the city a metropolis, and it continued to exist into the Middle Ages. In the year 1190 Frederick Barbarossa fought with the Byzantines there.<P>The modern town is called Pambuk Kalessi, or cotton castle, not because cotton is raised in the vicinity, but because of the white deposit from the water of the calcareous springs. The springs were famous in ancient times because they were supposed to possess Divine powers. The water is tepid, impregnated with alum, but pleasant to the taste. It was used by the ancients for dyeing and medicinal purposes. The deposit of pure white brought up by the water from the springs has heaped itself over the surrounding buildings, nearly burying them, and stalactite formations, resembling icicles, hang from the ruins. The ruins, which are extensive, stand on a terrace, commanding an extensive view, and though they are partly covered by the deposit, one may still trace the city walls, the temple, several churches, the triumphal arch, the gymnasium and baths, and the most perfect theater in Asia Minor. Outside the walls are many tombs.``7';
isbe[4338]='Hiereel`hi-er\'-e-el (Hiereel): 1Esdras 9:21. In <a onClick="return mV(\'Ezr\',8,9);">Ezr 8:9</a> the name is Jehiel.``1';
isbe[4339]='Hieremoth`hi-er\'-e-moth (Ieremoth):<P>(1) 1Esdras 9:27 = Jeremoth (<a onClick="return mV(\'Ezr\',10,26);">Ezr 10:26</a>).<P>(2) 1Esdras 9:30 = Jeremoth (<a onClick="return mV(\'Ezr\',10,29);">Ezr 10:29</a>, margin "and Ramoth").``1';
isbe[4340]='Hierielus`hi-er-i-e\'-lus (Iezrielos).`<a href="./study/isbe/search.html?string=JEZRIELUS">JEZRIELUS</a>`1';
isbe[4341]='Hiermas`hi-ur\'-mas (Hiermas): 1Esdras 9:26, corresponding to Ramiah in <a onClick="return mV(\'Ezr\',10,25);">Ezr 10:25</a>.``1';
isbe[4342]='Higgaion`hi-ga\'yon, hi-gi\'-on (higgayon): The meaning of this word is uncertain. Two interpretations are possible; the one based on an allied Arabic root gives "a deep vibrating sound," the other derived from the Greek versions of <a onClick="return mV(\'Psa\',9,16);">Ps 9:16</a>, where we read higgayon Celah, takes it to mean an instrumental interlude.`<a href="./study/isbe/search.html?string=PSALMS">PSALMS</a>`1';
isbe[4343]='High Day`Is found in <a onClick="return mV(\'Gen\',29,7);">Ge 29:7</a> as a rendering of the Hebrew yom agadhol, literally, "great day." The Hebrew means the day at its height, broad daylight as contrasted with the time for getting the cattle to their sheds for the night (compare French grand jour). In <a onClick="return mV(\'Jhn\',19,31);">Joh 19:31</a>, "highday" renders megale hemera, literally, "great day," and refers to the Passover Sabbath—and therefore a Sabbath of special sanctity.``1';
isbe[4344]='High Place`1. General:<P>(1) "High place" is the normal translation of bamah, a word that means simply "elevation" (<a onClick="return mV(\'Jer\',26,18);">Jer 26:18</a>; <a onClick="return mV(\'Eze\',36,2);">Eze 36:2</a>, etc.; compare the use in <a onClick="return mV(\'Job\',9,8);">Job 9:8</a> of the waves of the sea. For the plural as a proper noun see <a href="study/isbe/search.html?string=BAMOTH">BAMOTH</A>). In the King James Version of <a onClick="return mV(\'Eze\',16,24,25,31,39);">Eze 16:24-25, 31, 39</a>, "high places" is the translation of ramah (the Revised Version (British and American) "lofty places"), a common word (see <a href="study/isbe/search.html?string=RAMAH">RAMAH</A>) of exactly the same meaning, indistinguishable from bamah in 16:16. In three of these verses of Ezekiel (<a onClick="return mV(\'Eze\',16,24,31,39);">16:24,31,39</a>) ramah is paralleled by gabh, which again has precisely the same sense ("eminent place" in the King James Version, the English Revised Version), and the "vaulted place" of the American Standard Revised Version (English Revised Version margin) is in disregard of Hebrew parallelism. In particular, the high places are places of worship, specifically of idolatrous worship. So the title was transferred from the elevation to the sanctuary on the elevation (<a onClick="return mV(\'1Ki\',11,7);">1Ki 11:7</a>; <a onClick="return mV(\'1Ki\',14,23);">14:23</a>; compare the burning of the "high place" in <a onClick="return mV(\'2Ki\',23,15);">2Ki 23:15</a>), and so came to be used of any idolatrous shrine, whether constructed on an elevation or not (note how in <a onClick="return mV(\'2Ki\',16,4);">2Ki 16:4</a>; <a onClick="return mV(\'2Ch\',28,4);">2Ch 28:4</a> the "high places" are distinguished from the "hills"). So the "high places" in the cities (<a onClick="return mV(\'2Ki\',17,9);">2Ki 17:9</a>; <a onClick="return mV(\'2Ch\',21,11);">2Ch 21:11</a> (Septuagint)) could have stood anywhere, while in <a onClick="return mV(\'Eze\',16,16);">Eze 16:16</a> a portable structure seems to be in point.<P>(2) The use of elevations for purposes of worship is so widespread as to be almost universal, and rests, probably, on motives so primitive as to evade formal analysis. If any reason is to be assigned, the best seems to be that to dwellers in hilly country the heaven appears to rest on the ridges and the sun to go forth from them—but such reasons are certainly insufficient to explain everything. Certain it is that Israel, no less than her neighbors, found special sanctity in the hills. Not only was\' Sinai the "Mount of God," but a long list can be drawn up of peaks that have a special relation to Yahweh (see <a href="study/isbe/search.html?string=HILL;+MOUNT;+MOUNTAIN">MOUNT, MOUNTAIN</A>; and for the New Testament, compare <a onClick="return mV(\'Mar\',9,2);">Mr 9:2</a>; <a onClick="return mV(\'Hbr\',12,\'18-24\');">Heb 12:18-24</a>, etc.). And the choice of a hilltop for the Temple was based on considerations other than convenience and visibility. (But bamah is not used of the Temple Mount.)<P>2. Description:<P>Archaeological research, particularly at Petra and Gezer, aided by the Old Testament notices, enables us to reconstruct these sanctuaries with tolerable fullness. The cult was not limited to the summit of the hill but took place also on the slopes, and the objects of the cult might be scattered over a considerable area. The most sacred objects were the upright stone pillars (matstsebhah), which seem to have been indispensable. (Probably the simplest "high places" were only a single upright stone.) They were regarded as the habitation of the deity, but, none the less, were usually many in number (a fact that in no way need implicate a plurality of deities). At one time they were the only altars, and even at a later period, when the altar proper was used, libations were sometimes poured on the pillars directly. The altars were of various shapes, according to their purpose (incense, whole burnt offerings, etc.), but were always accompanied by one or more pillars. Saucer-shaped depressions, into which sacrifices could be poured, are a remnant of very primitive rites (to this day in Samaria the paschal lamb is cooked in a pit). The trees of the high place, especially the "terebinths" (oaks?), were sacred, and their number could be supplemented or their absence supplied by an artificial tree or pole (\'asherah, the "grove" of the King James Version). (Of course the original meaning of the pillar and asherah was not always known to the worshipper.) An amusing feature of the discoveries is that these objects were often of minute size, so that the gods could be gratified at a minimum of expense to the worshipper. Images (ephods?; the teraphim were household objects, normally) are certain, but in Palestine no remnants exist (the little Bes and Astarte figures were not idols used in worship). Other necessary features of a high place of the larger size were ample provision of water for lustral purposes, kitchens where the sacrifices could be cooked (normally by boiling), and tables for the sacrificial feasts. Normally, also, the service went on in the open air, but slight shelters were provided frequently for some of the objects. If a regular priest was attached to the high place (not always the case), his dwelling must have been a feature, unless he lived in some nearby village. Huts for those practicing incubation (sleeping in the sanctuary to obtain revelations through dreams) seem not to have been uncommon. But formal temples were very rare and "houses of the high places" in <a onClick="return mV(\'1Ki\',12,31);">1Ki 12:31</a>; <a onClick="return mV(\'1Ki\',13,32);">13:32</a>; <a onClick="return mV(\'2Ki\',17,29,32);">2Ki 17:29, 32</a>; <a onClick="return mV(\'2Ki\',23,19);">23:19</a> may refer only to the slighter structures just mentioned (see the comm.). In any case, however, the boundaries of the sanctuary were marked out, generally by a low stone wall, and ablutions and removal of the sandals were necessary before the worshipper could enter.<P>For the ritual, of course, there was no uniform rule. The gods of the different localities were different, and in Palestine a more or less thorough rededication of the high places to Yahweh had taken place. So the service might be anything from the orderly worship of Yahweh under so thoroughly an accredited leader as Samuel (<a onClick="return mV(\'1Sa\',9,\'11-24\');">1Sa 9:11-24</a>) to the wildest orgiastic rites. That the worship at many high places was intensely licentious is certain (but it must be emphasized against the statements of many writers that there is no evidence for a specific phallic cult, and that the explorations have revealed no unmistakable phallic emblems). The gruesome cemetery for newly born infants at Gezer is only one of the proofs of the prevalence of child-sacrifice, and the evidence for human sacrifice in other forms is unfortunately only too clear.<P>See <a href="study/isbe/search.html?string=GEZER">GEZER</a><!--, and illustration on p. 1224-->.<P>3. History:<P>(1) The opposition to the high places had many motives. When used for the worship of other gods their objectionable character is obvious, but even the worship of Yahweh in the high places was intermixed with heathen practices (<a onClick="return mV(\'Hsa\',4,14);">Ho 4:14</a>, etc.). In <a onClick="return mV(\'Amo\',5,\'21-24\');">Am 5:21-24</a>, etc., sacrifice in the high places is denounced because it is regarded as a substitute for righteousness in exactly the same way that sacrifice in the Temple is denounced in <a onClick="return mV(\'Jer\',7,\'21-24\');">Jer 7:21-24</a>. Or, sacrifice in the high places may be denounced under the best of conditions, because in violation of the law of the one sanctuary (<a onClick="return mV(\'2Ch\',33,17);">2Ch 33:17</a>, etc.).<P>(2) In 1 Samuel, sacrifice outside of Jerusalem is treated as an entirely normal thing, and Samuel presides in one such case (<a onClick="return mV(\'1Sa\',9,\'11-24\');">1Sa 9:11-24</a>). In 1Ki the practice of using high places is treated as legitimate before the construction of the Temple (<a onClick="return mV(\'1Ki\',3,\'2-4\');">1Ki 3:2-4</a>), but after that it is condemned unequivocally. The primal sin of Northern Israel was the establishment of high places (<a onClick="return mV(\'1Ki\',12,\'31-33\');">1Ki 12:31-33</a>; <a onClick="return mV(\'1Ki\',13,2,33);">13:2, 33</a>f), and their continuance was a chief cause of the evils that came to pass (<a onClick="return mV(\'2Ki\',17,10);">2Ki 17:10</a>f), while worship in them was a characteristic of the mongrel throng that repopulated Samaria (<a onClick="return mV(\'2Ki\',17,32);">2Ki 17:32</a>). So Judah sinned in building high places (<a onClick="return mV(\'1Ki\',14,23);">1Ki 14:23</a>), but the editor of Kings notes with obvious regret that even the pious kings (Asa, <a onClick="return mV(\'1Ki\',15,14);">1Ki 15:14</a>; Jehoshaphat, <a onClick="return mV(\'1Ki\',22,43);">22:43</A>; Jehoash, <a onClick="return mV(\'2Ki\',12,3);">2Ki 12:3</a>; Amaziah, <a onClick="return mV(\'2Ki\',14,4);">14:4</a>; Azariah, <a onClick="return mV(\'2Ki\',15,4);">15:4</A>; Jotham, <a onClick="return mV(\'2Ki\',15,35);">15:35</a>) did not put them away; i.e. the editor of Kings has about the point of view of <a onClick="return mV(\'Deu\',12,\'8-11\');">De 12:8-11</a>, according to which sacrifice was not to be restricted to Jerusalem until the country should be at peace, but afterward the restriction should be absolute. The practice had been of such long standing that Hezekiah\'s destruction of the high places (<a onClick="return mV(\'2Ki\',18,4);">2Ki 18:4</a>) could be cited by Rabshakeh as an act of apostasy from Yahweh (<a onClick="return mV(\'2Ki\',18,22);">2Ki 18:22</a>; <a onClick="return mV(\'2Ch\',32,12);">2Ch 32:12</a>; <a onClick="return mV(\'Isa\',36,7);">Isa 36:7</a>). Under Manasseh they were rebuilt, in connection with other idolatrous practices (<a onClick="return mV(\'2Ki\',21,\'3-9\');">2Ki 21:3-9</a>). This act determined the final punishment of the nation (<a onClick="return mV(\'2Ki\',21,\'10-15\');">21:10-15</A>), and the root-and-branch reformation of Josiah (<a onClick="return mV(\'2Ki\',23,\'1-\');">2Ki 23</a>) came too late. The attitude of the editor of Chronicles is still more condemnatory. He explains the sacrifice at Gibeon as justified by the presence of the Tabernacle (<a onClick="return mV(\'1Ch\',16,39);">1Ch 16:39</a>; <a onClick="return mV(\'1Ch\',21,29);">21:29</a>; <a onClick="return mV(\'2Ch\',1,3,13);">2Ch 1:3, 13</a>), states that God-fearing northerners avoided the high places (<a onClick="return mV(\'2Ch\',11,16);">2Ch 11:16</a>; compare <a onClick="return mV(\'1Ki\',19,10,14);">1Ki 19:10, 14</a>), and (against Kings) credits Asa (<a onClick="return mV(\'2Ch\',14,3,5);">2Ch 14:3, 5</a>) and Jehoshaphat (<a onClick="return mV(\'2Ch\',17,6);">2Ch 17:6</a>) with their removal. (This last notice is also in contradiction with <a onClick="return mV(\'2Ch\',20,33);">2Ch 20:33</a>, but <a onClick="return mV(\'2Ch\',16,17);">16:17a</A> is probably meant to refer to the Northern Kingdom, despite <a onClick="return mV(\'2Ch\',16,17);">16:17b</a>.) On the other hand, the construction of high places is added to the sins of Jehoram (<a onClick="return mV(\'2Ch\',21,11);">2Ch 21:11</a>) and of Ahaz (<a onClick="return mV(\'2Ch\',28,4,5);">2Ch 28:4-5</a>).<P>(3) Among the prophets, Elijah felt the destruction of the many altars of God as a terrible grief (<a onClick="return mV(\'1Ki\',19,10,14);">1Ki 19:10, 14</a>). Amos and Hosea each mention the high places by name only once (<a onClick="return mV(\'Amo\',7,9);">Am 7:9</a>; <a onClick="return mV(\'Hsa\',10,8);">Ho 10:8</a>), but both prophets have only denunciation for the sacrificial practices of the Northern Kingdom. That, however, these sacrifices were offered in the wrong place is not said. Isaiah has nothing to say about the high places, except in <a onClick="return mV(\'Isa\',36,7);">36:7</a>, while <a onClick="return mV(\'Mic\',1,5);">Mic 1:5</a> equates the sins of Jerusalem with those of the high places (if the text is right), but promises the exaltation of Jerusalem (<a onClick="return mV(\'Mic\',4,1);">4:1</A>f). In the references in <a onClick="return mV(\'Jer\',7,31);">Jer 7:31</a>; <a onClick="return mV(\'Jer\',19,5);">19:5</a>; <a onClick="return mV(\'Jer\',32,35);">32:35</a>; <a onClick="return mV(\'Eze\',6,3,6);">Eze 6:3, 6</a>; <a onClick="return mV(\'Eze\',16,16);">16:16</a>; <a onClick="return mV(\'Eze\',20,29);">20:29</a>; <a onClick="return mV(\'Eze\',43,7);">43:7</a>, idolatry or abominable practices are in point (so probably in <a onClick="return mV(\'Jer\',17,3);">Jer 17:3</a>, while <a onClick="return mV(\'Jer\',48,35);">Jer 48:35</a> and <a onClick="return mV(\'Isa\',16,12);">Isa 16:12</a> refer to non-Israelites).<P>(4) The interpretation of the above data and their historical import depend on the critical position taken as to the general history of Israel\'s religion.<P>LITERATURE.<P>See, especially, <a href="study/isbe/search.html?string=IDOLATRY">IDOLATRY</a>, and also <a href="study/isbe/search.html?string=ALTAR">ALTAR</a>; <a href="study/isbe/search.html?string=ASHERAH">ASHERAH</a>, etc.`<a href="./study/isbe/search.html?string=PALESTINE,+1">PALESTINE</a>; <a href="./study/isbe/search.html?string=ISRAEL,+RELIGION+OF,+1">ISRAEL, RELIGION OF</a>; <a href="./study/isbe/search.html?string=CRITICISM">CRITICISM</a>; <a href="./study/isbe/search.html?string=DEUTERONOMY">DEUTERONOMY</a>`48';
isbe[4345]='High Priest``<a href="./study/isbe/search.html?string=PRIEST,+HIGH">PRIEST, HIGH</a>`1';
isbe[4346]='High Things`The translation of hupselos, "high," "lofty," "elevated" (<a onClick="return mV(\'Rom\',12,16);">Ro 12:16</a>, "Mind not high things, but condescend to men of low estate," the King James Version margin "be contented with mean things," the Revised Version (British and American) "Set not your mind on high things, but condescend to (margin "Greek: be carried away with") things (margin "them") that are lowly"); high things are proud things, things regarded by the world as high.<P>High thing is hupsoma, "a high place," "elevation," etc. (<a onClick="return mV(\'2Cr\',10,5);">2Co 10:5</a>, "casting down every high thing that is exalted against the knowledge of God," "like a lofty tower or fortress built up proudly by the enemy"). In Judith 10:8; 13:4, hupsoma is rendered "exaltation."``185';
isbe[4347]='High, Most``<a href="./study/isbe/search.html?string=GOD,+NAMES+OF">GOD, NAMES OF</a>`1';
isbe[4348]='Highest`hi\'-est (\'elyon; hupsistos): The translation of \'elyon, used frequently of God and commonly translated "Most High" (<a onClick="return mV(\'Psa\',18,13);">Ps 18:13</a>, "The Highest gave his voice," the Revised Version (British and American) "Most High"; <a onClick="return mV(\'Psa\',87,5);">Ps 87:5</a>, "the highest himself," the Revised Version (British and American) "Most High"; <a onClick="return mV(\'Eze\',41,7);">Eze 41:7</a>, "the lowest (chamber) to the highest"); of tsammereth, the foliage of a tree (as if the wool or hair of trees), "the highest branch" (<a onClick="return mV(\'Eze\',17,3,12);">Eze 17:3, 12</a>, the Revised Version (British and American) "top," "lofty top"); of ro\'sh, "head," "top" (<a onClick="return mV(\'Pro\',8,26);">Pr 8:26</a>, "the highest part of the dust of the world," the King James Version margin "the chief part," the Revised Version (British and American) "the beginning of," margin "sum"); gappe marom, "on the ridges of the heights" (<a onClick="return mV(\'Pro\',9,3);">Pr 9:3</a>, "the highest places of the city"); ghabhoah me\'al gabhoah, literally, "one high (powerful) who is above the high (oppressor)," is translated "he that is higher than the highest" (<a onClick="return mV(\'Ecc\',5,8);">Ec 5:8</a>), the Revised Version (British and American) "one higher than the high (regardeth)." In the New Testament, hupsistos (like \'elyon) is used of God (<a onClick="return mV(\'Luk\',1,32);">Lu 1:32</a>, "the Son of the Highest," <a onClick="return mV(\'Luk\',1,35);">Lu 1:35</a>, "the power of the Highest," <a onClick="return mV(\'Luk\',1,76);">Lu 1:76</a>, "the prophet of the Highest"; <a onClick="return mV(\'Luk\',6,35);">Lu 6:35</a>, "the children of the Highest," in these places the Revised Version (British and American) has "Most High"); we have also "Hosanna in the highest" (<a onClick="return mV(\'Mat\',21,9);">Mt 21:9</a>; <a onClick="return mV(\'Mar\',11,10);">Mr 11:10</a>; see <a href="study/isbe/search.html?string=HOSANNA">HOSANNA</a>), "Glory to God in the highest" (<a onClick="return mV(\'Luk\',2,14);">Lu 2:14</a>), "Glory in the highest" (<a onClick="return mV(\'Luk\',19,38);">Lu 19:38</a>); protoklisia, "the first reclining-place" (at table), the chief place at meals, the middle place in each couch of the triclinium (Robinson), is rendered (<a onClick="return mV(\'Luk\',14,8);">Lu 14:8</a>), "the highest room," the Revised Version (British and American) "chief seat"; "room" was introduced by Tyndale; Wycliff had "the first place"; protokathedria (protos, "first," kathedra, "seat"), "the first or chief seat," is rendered (<a onClick="return mV(\'Luk\',20,46);">Lu 20:46</a>) "the highest seats," the Revised Version (British and American) "chief seats" Wycliff "the first chairs."<P>"The Highest" as a term for God appears (2Esdras 4:11,34, the Revised Version (British and American) "Most High"; The <span class="noTag">Wisdom of Solomon 6:3</span>, hupsistos; Ecclesiasticus 28:7, the Revised Version (British and American) "Most High").`<a href="./study/isbe/search.html?string=GOD,+NAMES+OF">GOD, NAMES OF</a>`185';
isbe[4349]='Highminded`hi\'-mind-ed: In modern usage denotes elevation of mind in a good sense, but formerly it was used to denote upliftedness in a bad sense, pride, arrogance. It is the translation of hupselophroneo, "to be highminded," "proud," "haughty" (<a onClick="return mV(\'Rom\',11,20);">Ro 11:20</a>, "Be not highminded, but fear"; <a onClick="return mV(\'1Ti\',6,17);">1Ti 6:17</a>, "Charge them that are rich...that they be not highminded"); of tuphoo "to wrap in mist or smoke," trop., to wrap in conceit, to make proud, etc. (<a onClick="return mV(\'2Ti\',3,4);">2Ti 3:4</a>, "Traitors, heady, highminded," the Revised Version (British and American) "puffed up"; compare <a onClick="return mV(\'1Ti\',3,6);">1Ti 3:6</a>; <a onClick="return mV(\'1Ti\',6,4);">6:4</a>). "No one can be highminded without thinking better of himself, and worse of others, than he ought to think" (Crabb, English Synonyms).``185';
isbe[4350]='Highway`hi\'-wa.`<!--<a href="./study/isbe/search.html?string=ROAD">ROAD</a>;--> <a href="./study/isbe/search.html?string=WAY">WAY</a>`1';
isbe[4351]='Hilen`hi-len (chilen): A city in the hill country of Judah, probably west or southwest of Hebron, assigned with its suburbs to the Levites (<a onClick="return mV(\'1Ch\',6,58);">1Ch 6:58 (Hebrew 43)</a>). The form of the name in <a onClick="return mV(\'Jos\',15,51);">Jos 15:51</a>; <a onClick="return mV(\'Jos\',21,15);">21:15</a> is <a href="study/isbe/search.html?string=HOLON">HOLON</a> (which see).``1';
isbe[4352]='Hilkiah`hil-ki\'-a (chilqiyah, "Yah is my portion" or "Yah\'s portion"): The name of 8 individuals in the Old Testament or 7, if the person mentioned in <a onClick="return mV(\'Neh\',12,7,21);">Ne 12:7, 21</a> was the same who stood with Ezra at the reading of the Law (<a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>). The latter appears as Ezecias (the King James Version) in 1Esdras 9:43. Five of this name are clearly associated with the priesthood, and the others are presumably so. The etymology suggests this. Either interpretation of the name expresses the person\'s claim on Yahweh or the parents\' recognition of Yahweh\'s claim on him.<P>(1) The person mentioned above (<a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>, etc.).<P>(2) A Levite of the sons of Merari (<a onClick="return mV(\'1Ch\',6,45);">1Ch 6:45</a>).<P>(3) Another Levite of Merari, son of Hosah (<a onClick="return mV(\'1Ch\',26,11);">1Ch 26:11</a>). Is he the "porter," i.e. "doorkeeper" of <a onClick="return mV(\'1Ch\',16,38);">1Ch 16:38</a>?<P>(4) Father of the Gemariah whom Zedekiah of Judah sent to Nebuchadnezzar (<a onClick="return mV(\'Jer\',29,3);">Jer 29:3</a>).<P>(5) The man in <a onClick="return mV(\'2Ki\',18,18);">2Ki 18:18</a>ff who is evidently more famous as the father of Eliakim, the majordomo of Hezekiah\'s palace (<a onClick="return mV(\'Isa\',22,20);">Isa 22:20</a>ff; <a onClick="return mV(\'Isa\',36,3);">36:3</a>). Probably the father\'s name is given in this and similar cases to distinguish between two persons of otherwise identical name.<P>(6) A priest of Anathoth, father of Jeremiah (<a onClick="return mV(\'Jer\',1,1);">Jer 1:1</a>).<P>(7) The son of Shallum, and the best known of the name (<a onClick="return mV(\'1Ch\',6,13);">1Ch 6:13</a>). He is great-grandfather of Ezra through his son Azariah (1Esdras 8:1; compare <a onClick="return mV(\'1Ch\',9,11);">1Ch 9:11</a>; <a onClick="return mV(\'Neh\',11,11);">Ne 11:11</a>). He discovered the lost Book of the Law during the repairing of the Temple (<a onClick="return mV(\'2Ki\',22,4,8);">2Ki 22:4, 8</a>); became chief leader in the ensuing reformation in 621 BC (<a onClick="return mV(\'2Ki\',23,4);">2Ki 23:4</a>; <a onClick="return mV(\'2Ch\',34,9);">2Ch 34:9</a>ff; <a onClick="return mV(\'2Ch\',35,8);">35:8</a>). He showed the recovered book to Shaphan the scribe, who, in turn, brought it to the notice of the king. At Josiah\'s request he led a deputation to Huldah the prophetess to "inquire of the Lord" concerning the new situation created by the discovery. The book discovered is usually identified with the Book of Deuteronomy.`<a href="./study/isbe/search.html?string=DEUTERONOMY">DEUTERONOMY</a>`186';
isbe[4353]='Hill, Hill Country`hil\'-kun-tri: The common translation of three Hebrew words:<P>(1) gibh\'ah, from root meaning "to be curved," is almost always translated "hill"; it is a pecuIiarly appropriate designation for the very rounded hills of Palestine; it is never used for a range of mountains. Several times it occurs as a place-name, "Gibeah of Judah" (<a onClick="return mV(\'Jos\',15,20,57);">Jos 15:20, 57</a>); "Gibeah of Benjamin" or "Saul" (<a onClick="return mV(\'Jdg\',19,\'12-16\');">Jud 19:12-16</a>, etc.); "Gibeah of Phinehas" (<a onClick="return mV(\'Jos\',24,33);">Jos 24:33</a> margin), etc. (see <a href="study/isbe/search.html?string=GIBEAH">GIBEAH</a>). Many such hills were used for idolatrous rites (<a onClick="return mV(\'1Ki\',14,23);">1Ki 14:23</a>; <a onClick="return mV(\'2Ki\',17,10);">2Ki 17:10</a>; <a onClick="return mV(\'Jer\',2,20);">Jer 2:20</a>, etc.).<P>(2) har, frequently translated in the King James Version "hill," is in the Revised Version (British and American) usually translated "mountain" (compare <a onClick="return mV(\'Gen\',7,19);">Ge 7:19</a>; <a onClick="return mV(\'Jos\',15,9);">Jos 15:9</a>; <a onClick="return mV(\'Jos\',18,15);">18:15</a>f; and many other references), or "hillcountry." Thus we have the "hill-country of the Amorites" (<a onClick="return mV(\'Deu\',1,7,19,20);">De 1:7, 19-20</a>); the "hill-country of Gilead" (<a onClick="return mV(\'Deu\',3,12);">De 3:12</a>); the "hill-country of Ephraim" (<a onClick="return mV(\'Jos\',17,15,16,18);">Jos 17:15-16, 18</a>; <a onClick="return mV(\'Jos\',19,50);">19:50</a>; <a onClick="return mV(\'Jos\',20,7);">20:7</a>, etc.); the "hill-country of Judah" (<a onClick="return mV(\'Jos\',11,21);">Jos 11:21</a>; <a onClick="return mV(\'Jos\',20,7);">20:7</a>; <a onClick="return mV(\'Jos\',21,11);">21:11</a>; <a onClick="return mV(\'2Ch\',27,4);">2Ch 27:4</a>, etc.; and (he oreine) <a onClick="return mV(\'Luk\',1,39,65);">Lu 1:39, 65</a>); the "hill-country of Naphtali" (<a onClick="return mV(\'Jos\',20,7);">Jos 20:7</a>). For geographical descriptions see <a href="study/isbe/search.html?string=PALESTINE,+1">PALESTINE</a>; <a href="study/isbe/search.html?string=COUNTRY">COUNTRY</a>; <a href="study/isbe/search.html?string=EPHRAIM+(1)">EPHRAIM</a>; <a href="study/isbe/search.html?string=JUDAH+(2)">JUDAH</a>, etc.<P>(3) \'ophel, is translated by "hill" in <a onClick="return mV(\'2Ki\',5,24);">2Ki 5:24</a>; <a onClick="return mV(\'Isa\',32,14);">Isa 32:14</a>; <a onClick="return mV(\'Mic\',4,8);">Mic 4:8</a>, but may possibly mean "tower" or "fort." In other passages the word occurs with the article as a place-name.`<a href="./study/isbe/search.html?string=OPHEL">OPHEL</a>`117';
isbe[4354]='Hill; Mount; Mountain`1. Names:<P>(1) The commonest word is har (also harar, and herer), which is rendered "hill," "mount" or "mountain." It occurs several hundreds of times. In a number of places the Revised Version (British and American) changes "hill" to "mountain," e.g. <a onClick="return mV(\'Gen\',7,19);">Ge 7:19</a>, mountains covered by flood; <a onClick="return mV(\'Exd\',24,4);">Ex 24:4</a>, Horeb; <a onClick="return mV(\'Jos\',18,14);">Jos 18:14</a>, mountain before Beth-horon: <a onClick="return mV(\'Jdg\',16,3);">Jud 16:3</a>, mountain before Hebron; <a onClick="return mV(\'Psa\',95,4);">Ps 95:4</a>, "The heights of the mountains are his also"; <a onClick="return mV(\'Psa\',121,1);">121:1</a>, "I will lift up mine eyes unto the mountains." "Hill" remains in <a onClick="return mV(\'Deu\',11,11);">De 11:11</a>, "land of hills and valleys"; <a onClick="return mV(\'1Ki\',20,23);">1Ki 20:23</a>, "god of the hills"; <a onClick="return mV(\'Psa\',2,6);">Ps 2:6</a>, "my holy hill of Zion": <a onClick="return mV(\'Psa\',98,8);">98:8</A>, "hills sing for joy." "Mount" is changed "hill-country" in <a onClick="return mV(\'Deu\',1,7);">De 1:7</a>, "hill-country of the Amorites"; <a onClick="return mV(\'Jdg\',12,15);">Jud 12:15</a>, "hill-country of the Amalekites"; <a onClick="return mV(\'Deu\',3,12);">De 3:12</a>, "hill-country of Gilead"; but <a onClick="return mV(\'Gen\',3,21);">Ge 3:21</a>, "mountain of Gilead"; and <a onClick="return mV(\'Jdg\',7,3);">Jud 7:3</a>, "Mount Gilead." "Hill" or "hills" is changed to "hill-country" in <a onClick="return mV(\'Deu\',1,7);">De 1:7</a>; <a onClick="return mV(\'Jos\',9,1);">Jos 9:1</a>; <a onClick="return mV(\'Jos\',10,40);">10:40</a>; <a onClick="return mV(\'Jos\',11,16);">11:16</a>; <a onClick="return mV(\'Jos\',17,16);">17:16</a>; <a onClick="return mV(\'Jos\',21,11);">21:11</a>. In <a onClick="return mV(\'Deu\',1,41,43);">De 1:41, 43</a>, the American Standard Revised Version changes "hill" to "hill-country," while the English Revised Version has "mountain." The reasons for these differences of treatment are not in all cases apparent.<P>(2) The Greek oros, is perhaps etymologically akin to har. It occurs often in the New Testament, and is usually translated "mount" or "mountain." In three places (<a onClick="return mV(\'Mat\',5,14);">Mt 5:14</a>; <a onClick="return mV(\'Luk\',4,29);">Lu 4:29</a>; <a onClick="return mV(\'Luk\',9,37);">9:37</a>) the King James Version has hill, which the Revised Version (British and American) retains, except in <a onClick="return mV(\'Luk\',9,37);">Lu 9:37</a>, "when they were come down from the mountain" (of the transfiguration). The derivative oreinos, "hill country," occurs in <a onClick="return mV(\'Luk\',1,39,65);">Lu 1:39, 65</a>.<P>(3) The common Hebrew word for "hill" is gibh\'ah = Gibeah (<a onClick="return mV(\'Jdg\',19,12);">Jud 19:12</a>); compare Geba, gebha\' (<a onClick="return mV(\'1Sa\',13,3);">1Sa 13:3</a>); Gibeon, gib\'on (<a onClick="return mV(\'Jos\',9,3);">Jos 9:3</a>), from root gabha\', "to be high"; compare Arabic qubbeh, "dome"; Latin caput; kephale.<P>(4) In <a onClick="return mV(\'1Sa\',9,11);">1Sa 9:11</a>, the King James Version has "hill" for ma\'aleh, root \'alah, "to ascend"; compare Arabic \'ala\', "to be high," and \'ali, "high." Here and elsewhere the Revised Version (British and American) has "ascent."<P>(5) English Versions of the Bible has "hill" in <a onClick="return mV(\'Isa\',5,\'1-\');">Isa 5</a> for qeren, "horn"; compare Arabic qarn, "horn," which is also used for a mountain peak.<P>(6) Tur, is translated "mountain" in <a onClick="return mV(\'Dan\',2,35,45);">Da 2:35, 45</a>, but the Revised Version margin "rock" in <a onClick="return mV(\'Dan\',2,35);">Da 2:35</a>. The Arabic tur, "mountain," is especially used with Sinai, jebel tur sina\'.<P>(7) mutstsabh (<a onClick="return mV(\'Isa\',29,3);">Isa 29:3</a>), is translated in the King James Version "mount" in the English Revised Version "fort," in the American Standard Revised Version "posted troops"; compare matstsabh, "garrison" (<a onClick="return mV(\'1Sa\',14,1);">1Sa 14:1</a>, etc.), from root natsabh, "to set"; compare Arabic nacab, "to set."<P>(8) colelah, from calal, "to raise," is in the King James Version and the English Revised Version "mount," the King James Version margin "engine of shot," the American Standard Revised Version "mound" (<a onClick="return mV(\'Jer\',32,24);">Jer 32:24</a>; <a onClick="return mV(\'Jer\',33,4);">33:4</a>; <a onClick="return mV(\'Eze\',4,2);">Eze 4:2</a>; <a onClick="return mV(\'Eze\',17,\'1-\');">17</a>; <a onClick="return mV(\'Eze\',21,22);">21:22</a>; <a onClick="return mV(\'Eze\',26,8);">26:8</a>; <a onClick="return mV(\'Dan\',11,15);">Da 11:15</a>).<P>2. Figurative and Descriptive:<P>The mountains and hills of Palestine are the features of the country, and were much in the thoughts of the Biblical writers. Their general aspect is that of vast expanses of rock. As compared with better-watered regions Descriptive of the earth, the verdure is sparse and incidental. Snow remains throughout the year on Hermon and the two highest peaks of Lebanon, although in the summer it is in great isolated drifts which are not usually visible from below. In Palestine proper, there are no snow mountains. Most of the valleys are dry wadies, and the roads often follow these wadies, which are to the traveler veritable ovens. It is when he reaches a commanding height and sees the peaks and ridges stretching away one after the other, with perhaps, through some opening to the west, a gleam of the sea like molten metal, that he thinks of the vastness and enduring strength of the mountains. At sunset the rosy lights are succeeded by the cool purple shadows that gradually fade into cold gray, and the traveler is glad of the shelter of his tent. The stars come out, and there is no sound outside the camp except perhaps the cries of jackals or the barking of some goat-herd\'s dog. These mountains are apt to repel the casual traveler by their bareness. They have no great forests on their slopes. Steep and rugged peaks like those of the Alps are entirely absent. There are no snow peaks or glaciers. There are, it is true, cliffs and crags, but the general outlines are not striking. Nevertheless, these mountains and hills have a great charm for those who have come to know them. To the Biblical writers they are symbols of eternity (<a onClick="return mV(\'Gen\',49,26);">Ge 49:26</a>; <a onClick="return mV(\'Deu\',33,15);">De 33:15</a>; <a onClick="return mV(\'Job\',15,7);">Job 15:7</a>; <a onClick="return mV(\'Hab\',3,6);">Hab 3:6</a>). They are strong and steadfast, but they too are the creation of God, and they manifest His power (<a onClick="return mV(\'Psa\',18,7);">Ps 18:7</a>; <a onClick="return mV(\'Psa\',97,5);">97:5</a>; <a onClick="return mV(\'Isa\',40,12);">Isa 40:12</a>; <a onClick="return mV(\'Isa\',41,15);">41:15</a>; <a onClick="return mV(\'Isa\',54,10);">54:10</a>; <a onClick="return mV(\'Jer\',4,24);">Jer 4:24</a>; <a onClick="return mV(\'Nah\',1,5);">Na 1:5</a>; <a onClick="return mV(\'Hab\',3,6);">Hab 3:6</a>). The hills were places of heathen sacrifice (<a onClick="return mV(\'Deu\',12,2);">De 12:2</a>; <a onClick="return mV(\'1Ki\',11,7);">1Ki 11:7</a>; <a onClick="return mV(\'2Ki\',16,4);">2Ki 16:4</a>; <a onClick="return mV(\'2Ki\',17,10);">17:10</a>; <a onClick="return mV(\'Eze\',6,13);">Eze 6:13</a>; <a onClick="return mV(\'Hsa\',4,13);">Ho 4:13</a>), and also of sacrifice to Yahweh (<a onClick="return mV(\'Gen\',22,2);">Ge 22:2</a>; <a onClick="return mV(\'Gen\',31,54);">31:54</a>; <a onClick="return mV(\'Jos\',8,30);">Jos 8:30</a>). Zion is the hill of the Lord (<a onClick="return mV(\'Psa\',2,6);">Ps 2:6</a>; <a onClick="return mV(\'Psa\',135,21);">135:21</a>; <a onClick="return mV(\'Isa\',8,18);">Isa 8:18</a>; <a onClick="return mV(\'Joe\',3,21);">Joe 3:21</a>; <a onClick="return mV(\'Mic\',4,2);">Mic 4:2</a>).<P>3. Particular Mountains:<P>Many proper names are associated with the mountains and hills: as Abarim, Amalekites, Ammah, Amorites, Ararat, Baalah, Baal-hermon, Bashan, Beth-el, Bether, Carmel, Chesalon, Ebal, Ephraim, Ephron, Esau, Gaash, Gareb, Geba, Gerizim, Gibeah, Gibeon, Gilboa, Gilead, Hachilah, Halak, Hebron, Heres, Hermon, Hor, Horeb, Jearim, Judah, Lebanon, Mizar, Moreh, Moriah, Naphtali, Nebo, Olives, Olivet, Paran, Perazim, Pisgah, Samaria, Seir, Senir, Sephar, Shepher, Sinai, Sion, Sirion, Tabor, Zalmon, Zemaraim, Zion. See also "mountain of the east" (<a onClick="return mV(\'Gen\',10,30);">Ge 10:30</a>); "mountains of the leopards" (<a onClick="return mV(\'Sgs\',4,8);">So 4:8</a>); "rocks of the wild goats" (<a onClick="return mV(\'1Sa\',24,2);">1Sa 24:2</a>); "hill of the foreskins" (Gibeah-haaraloth) (<a onClick="return mV(\'Jos\',5,3);">Jos 5:3</a>); "mountains of brass" (<a onClick="return mV(\'Zec\',6,1);">Zec 6:1</a>); "hill of God" (Gibeah of God) (<a onClick="return mV(\'1Sa\',10,5);">1Sa 10:5</a>); "hill of Yahweh" (<a onClick="return mV(\'Psa\',24,3);">Ps 24:3</a>); "mount of congregation" (<a onClick="return mV(\'Isa\',14,13);">Isa 14:13</a>); see also <a onClick="return mV(\'Mat\',4,8);">Mt 4:8</a>; <a onClick="return mV(\'Mat\',5,1);">5:1</a>; <a onClick="return mV(\'Mat\',14,23);">14:23</a>; <a onClick="return mV(\'Mat\',15,29);">15:29</a>; <a onClick="return mV(\'Mat\',17,1);">17:1</a>; <a onClick="return mV(\'Mat\',28,16);">28:16</a>; <a onClick="return mV(\'Luk\',8,32);">Lu 8:32</a>; <a onClick="return mV(\'Gal\',4,25);">Ga 4:25</a>.``37';
isbe[4355]='Hillel`hil\'-el (hillel, "he greatly praised"; Septuagint Ellel): An inhabitant of Pirathon in the hill country of Ephraim, and father of Abdon, one of the judges of Israel (<a onClick="return mV(\'Jdg\',12,13,15);">Jud 12:13, 15</a>).``1';
isbe[4356]='Hin`hin (hin): A liquid measure containing 12 logs, equal to about 8 quarts.`<a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`1';
isbe[4357]='Hind`hind.`<a href="./study/isbe/search.html?string=DEER">DEER</a>`1';
isbe[4358]='Hind of the Morning, the`The translation of Aijeleth hash-Shahar (\'ayyeleth ha-shachar) in the title of <a onClick="return mV(\'Psa\',22,\'1-\');">Ps 22</a>, probably the name of some wellknown song to which the psalm was intended to be sung, which possibly had reference to the early habits of the deer tribe in search of water and food, or to the flight of the hind from the hunters in early dawn; or "morning" may symbolize the deliverance from persecution and sorrow.<P>"The first rays of the morning sun, by which it announces its appearance before being itself visible, are compared to the fork-like antlers of a stag; and this appearance is called, <a onClick="return mV(\'Psa\',22,1);">Ps 22 title</a>. \'The hind of the morning,\' because those antler rays preceded the red of dawn, which again forms the transition to sunrise" (Delitzsch, Iris. 107).<P>According to Hengstenberg, the words indicate the subject-matter of the poem, the character, sufferings, and triumph of the person who is set before us. See <a href="study/isbe/search.html?string=PSALMS,+BOOK+OF,+1">PSALMS</a>. For an interesting Messianic interpretation see Hood, Christmas Evans, the Preacher of Wild Wales, 92ff.``91';
isbe[4359]='Hinge`hinj (poth): Hinges of Jewish sacred buildings in Scripture are mentioned only in connection with Solomon\'s temple. Here those for the doors, both of the oracle and of the outer temple, are said to have been of gold (<a onClick="return mV(\'1Ki\',7,50);">1Ki 7:50</a>). By this is probably to be understood that the pivots upon which the doors swung, and which turned in the sockets of the threshold and the lintel, were cased in gold. The proverb, "As the door turneth upon its hinges, so doth the sluggard upon his bed" (<a onClick="return mV(\'Pro\',26,14);">Pr 26:14</a>), describes the ancient mode of ingress and egress into important edifices. In the British Museum are many examples of stone sockets taken from Babylonian and Assyrian palaces and temples, engraved with the name and titles of the royal builder; while in the Hauran doors of a single slab of stone with stone pivots are still found in situ. Hinges, as we understand the word, were unknown in the ancient world.`<a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>`17';
isbe[4360]='Hinnom, Valley of`hin\'-om (ge hinnom, <a onClick="return mV(\'Jos\',15,8);">Jos 15:8</a>; <a onClick="return mV(\'Jos\',18,16);">18:16</a>; "valley of the son of Hinnom" (ge bhen hinnom), <a onClick="return mV(\'Jos\',15,8);">Jos 15:8</a>; <a onClick="return mV(\'Jos\',18,16);">18:16</a>; <a onClick="return mV(\'2Ch\',28,3);">2Ch 28:3</a>; <a onClick="return mV(\'2Ch\',33,6);">33:6</a>; <a onClick="return mV(\'Jer\',7,31);">Jer 7:31</a>f; <a onClick="return mV(\'Jer\',19,2,6);">19:2,6</A>; <a onClick="return mV(\'Jer\',32,35);">32:35</a>; "valley of the children (sons) of Hinnom" (ge bhene hinnom), <a onClick="return mV(\'2Ki\',23,10);">2Ki 23:10</a>; or simply "the valley," literally, the "hollow" or "ravine" (ha-gay\'),<a onClick="return mV(\'2Ch\',26,9);">2Ch 26:9</a>; <a onClick="return mV(\'Neh\',2,13,15);">Ne 2:13, 15</a>; <a onClick="return mV(\'Neh\',3,13);">3:13</a>; <a onClick="return mV(\'Jer\',31,40);">Jer 31:40</a> and, perhaps also, <a onClick="return mV(\'Jer\',2,23);">Jer 2:23</a> (the above references are in the Hebrew text; there are some variations in the Septuagint)): The meaning of "Hinnom" is unknown; the expressions ben Hinnom and bene Hinnom would suggest that it is a proper name; in <a onClick="return mV(\'Jer\',7,32);">Jer 7:32</a>; <a onClick="return mV(\'Jer\',19,6);">19:6</a> it is altered by the prophet to "valley of slaughter," and therefore some have thought the original name must have had a pleasing meaning.<P>1. Bible References and History:<P>It was near the walls of Jerusalem, "by the entry of the gate Harsith" (<a onClick="return mV(\'Jer\',19,2);">Jer 19:2</a>); the Valley Gate opened into it (<a onClick="return mV(\'Neh\',2,13);">Ne 2:13</a>; <a onClick="return mV(\'Neh\',3,13);">3:13</a>). The boundary between Judah and Benjamin ran along it (<a onClick="return mV(\'Jos\',15,8);">Jos 15:8</a>; <a onClick="return mV(\'Jos\',18,16);">18:16</a>). It was the scene of idolatrous practices in the days of Ahaz (<a onClick="return mV(\'2Ch\',28,3);">2Ch 28:3</a>) and of Manasseh, who "made his children to pass through the fire in the valley of the son of Hinnom" (<a onClick="return mV(\'2Ch\',33,6);">2Ch 33:6</a>), but Josiah in the course of his reforms "defiled Topheth, which is in the valley of the children (margin "son") of Hinnom, that no man might make his son or his daughter to pass through the fire to Molech" (<a onClick="return mV(\'2Ki\',23,10);">2Ki 23:10</a>). It was on account of these evil practices that Jeremiah (<a onClick="return mV(\'Jer\',7,32);">7:32</A>; <a onClick="return mV(\'Jer\',19,6);">19:6</A>) announced the change of name. Into this valley dead bodies were probably cast to be consumed by the dogs, as is done in the Wady er-Rababi today, and fires were here kept burning to consume the rubbish of the city. Such associations led to the Ge-Hinnom (New Testament "Gehenna") becoming the "type of Hell" (Milton, Paradise Lost, i, 405).<P>See <a href="study/isbe/search.html?string=GEHENNA">GEHENNA</a>.<P>2. Situation:<P>The Valley of Hinnom has been located by different writers in each of the three great valleys of Jerusalem. In favor of the eastern or Kidron valley we have the facts that Eusebius and Jerome (Onom) place "Gehennom" under the eastern wall of Jerusalem and the Moslem geographical writers, Muqaddasi and Nasir-i-khusran, call the Kidron valley Wady Jahamum. The Jewish writer Kimchi also identifies the Valley of Jehoshaphat (i.e. the Kidron) with Hinnom. These ideas are probably due to the identification of the eastern valley, on account of its propinquity to the Temple, as the scene of the last judgment—the "Valley of Jehoshaphat" of <a onClick="return mV(\'Joe\',3,2);">Joe 3:2</a>—and the consequent transference there of the scene of the punishment of the wicked, Gehenna, after the ancient geographical position of the Valley of Hinnom, had long been lost. In selecting sacred sites, from the 4th Christian century onward, no critical topographical acumen has been displayed until quite modern times. There are three amply sufficient arguments against this view: (1) the Kidron valley is always called a nachal and not a gay\' (see <a href="study/isbe/search.html?string=KIDRON">KIDRON</A>); (2) the "Gate of the Gai" clearly did not lie to the east of the city; (3) En-rogel, which lay at the beginning of the Valley of Hinnom and to its east (<a onClick="return mV(\'Jos\',15,8);">Jos 15:8</a>; <a onClick="return mV(\'Jos\',18,16);">18:16</a>) cannot be the "Virgin\'s fount," the ancient Gihon (<a onClick="return mV(\'2Sa\',17,17);">2Sa 17:17</a>).<P>See <a href="study/isbe/search.html?string=GIHON+(2)">GIHON</A>.<P>Several distinguished modern writers have sought to identify the Tyropeon Valley (el Wad) with Hinnom, but as the Tyropeon was incorporated within the city walls before the days of Manasseh (see <a href="study/isbe/search.html?string=JERUSALEM, 1">JERUSALEM</A>), it is practically impossible that it could have been the scene of the sacrifice of children—a ritual which must have occurred beyond the city\'s limits (<a onClick="return mV(\'2Ki\',23,10);">2Ki 23:10</a>, etc.).<P>3. Wady er-Rababi:<P>The clearest geographical fact is found in <a onClick="return mV(\'Jos\',15,8);">Jos 15:8</a>; <a onClick="return mV(\'Jos\',18,16);">18:16</a>, where we find that the boundary of Judah and Benjamin passed from En-rogel "by the valley of the son of Hinnom"; if the modern Bir Eyyub is En-rogel, as is certainly most probable, then the Wady er-Rababi, known traditionally as Hinnom, is correctly so called. It is possible that the name extended to the wide open land formed by the junction of the three valleys; indeed, some would place Tophet at this spot, but there is no need to extend the name beyond the actual gorge. The Wady er-Rababi commences in a shallow, open valley due west of the Jaffa Gate, in the center of which lies the Birket Mamilla; near the Jaffa Gate it turns south for about 1/3 of a mile, its course being dammed here to form a large pool, the Birket es Sultan. Below this it gradually curves to the east and rapidly descends between sides of bare rocky scarps, much steeper in ancient times. A little before the valley joins the wide Kidron valley lies the traditional site of <a href="study/isbe/search.html?string=AKELDAMA">AKELDAMA</a> (which see).``117';
isbe[4361]='Hip`(shoq, "leg," "limb," "hip," "shoulder"): Samson smote the Philistines "hip and thigh" (Hebrew "leg upon thigh"), which was indicative of "a great slaughter" (<a onClick="return mV(\'Jdg\',15,8);">Jud 15:8</a>), the bodies being hewed in pieces with such violence that they lay in bloody confusion, their limbs piled up on one another in great heaps.`<a href="./study/isbe/search.html?string=SINEW">SINEW</a>`1';
isbe[4362]='Hippopotamus`hip-o-pot\'-a-mus (<a onClick="return mV(\'Job\',41,1);">Job 41:1</a> margin).`<a href="./study/isbe/search.html?string=BEHEMOTH">BEHEMOTH</a>`1';
isbe[4363]='Hirah`hi\'-ra (chirah; Septuagint Eiras): A native of Adullam, and a "friend" of Judah (<a onClick="return mV(\'Gen\',38,1,12);">Ge 38:1, 12</a>). The Septuagint and the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) both describe him as Judah\'s "shepherd."``1';
isbe[4364]='Hiram`hi\'-ram (chiram; Septuagint Chiram, but Cheiram, in <a onClick="return mV(\'2Sa\',5,11);">2Sa 5:11</a>; <a onClick="return mV(\'1Ch\',14,1);">1Ch 14:1</a>): There is some confusion regarding the form of this name. In the Books of Samuel and Kings the prevailing form is "Hiram" (chiram); but in <a onClick="return mV(\'1Ki\',5,10,18);">1Ki 5:10, 18 margin (Hebrew 24,32)</a>; <a onClick="return mV(\'1Ki\',7,40);">7:40</A> margin "Hirom" (chirom) is found. In Chronicles the form of the word is uniformly "Huram" (churam).<P>(1) A king of Tyre who lived on most friendly terms with both David and Solomon. After David had taken the stronghold of Zion, Hiram sent messengers and workmen and materials to build a palace for him at Jerusalem (<a onClick="return mV(\'2Sa\',5,11);">2Sa 5:11</a>; <a onClick="return mV(\'1Ch\',14,1);">1Ch 14:1</a>). Solomon, on his accession to the throne, made a league with Hiram, in consequence of which Hiram furnished the new king of Israel with skilled workmen and with cedar trees and fir trees and algum trees from Lebanon for the building of the Temple. In return Solomon gave annually to Hiram large quantities of wheat and oil (<a onClick="return mV(\'1Ki\',5,1);">1Ki 5:1 (Hebrew 15)</a>ff; <a onClick="return mV(\'2Ch\',2,3);">2Ch 2:3 (Hebrew 2)</a>ff). "At the end of twenty years, wherein Solomon had built the two houses, the house of Yahweh and the king\'s house," Solomon made a present to Hiram of twenty cities in the land of Galilee. Hiram was not at all pleased with these cities and contemptuously called them "Cabul." His displeasure, however, with this gift does not seem to have disturbed the amicable relations that had hitherto existed between the two kings, for subsequently Hiram sent to the king of Israel 120 talents of gold (<a onClick="return mV(\'1Ki\',9,\'10-14\');">1Ki 9:10-14</a>). Hiram and Solomon maintained merchant vessels on the Mediterranean and shared mutually in a profitable trade with foreign ports (<a onClick="return mV(\'1Ki\',10,22);">1Ki 10:22</a>). Hiram\'s servants, "shipmen that had knowledge of the sea," taught the sailors of Solomon the route from Ezion-geber and Eloth to Ophir, whence large stores of gold were brought to King Solomon (<a onClick="return mV(\'1Ki\',9,26);">1Ki 9:26</a>; <a onClick="return mV(\'2Ch\',8,17);">2Ch 8:17</a>f).<P>Josephus (Apion, I,17,18) informs us, on the authority of the historians Dius and Menander, that Hiram was the son of Abibal, that he had a prosperous reign of 34 years, and died at the age of 53. He tells us on the same authority that Hiram and Solomon sent problems to each other to solve; that Hiram could not solve those sent him by Solomon, whereupon he paid to Solomon a large sum of money, as had at first been agreed upon. Finally, Abdemon, a man of Tyre, did solve the problems, and proposed others which Solomon was unable to explain; consequently Solomon was obliged to pay back to Hiram a vast sum of money. Josephus further states (Ant., VIII, ii, 8) that the correspondence carried on between Solomon and Hiram in regard to the building of the Temple was preserved, not only in the records of the Jews, but also in the public records of Tyre. It is also related by Phoenician historians that Hiram gave his daughter to Solomon in marriage.<P>(2) The name of a skillful worker in brass and other substances, whom Solomon secured from Hiram king of Tyre to do work on the Temple. His father was a brass-worker of Tyre, and his mother was a woman of the tribe of Naphtali (<a onClick="return mV(\'1Ki\',7,14);">1Ki 7:14</a>), "a woman of the daughters of Dan" (<a onClick="return mV(\'2Ch\',2,14);">2Ch 2:14 (Hebrew 13)</a>; <a onClick="return mV(\'1Ki\',7,13);">1Ki 7:13</a>ff; <a onClick="return mV(\'2Ch\',2,13);">2Ch 2:13f (Hebrew 12,13)</a>).``29';
isbe[4365]='Hircanus`her-ka\'nuz.`<a href="./study/isbe/search.html?string=HYRCANUS">HYRCANUS</a>`1';
isbe[4366]='Hire`hir: Two entirely different words are translated "hire" in the Old Testament:<P>(1) The most frequent one is sakhar, verb sakhar, and verbal adjective sakhir.<P>(a) As a verb it means "to hire" for a wage, either money or something else; in this sense it is used with regard to ordinary laborers (<a onClick="return mV(\'1Sa\',2,5);">1Sa 2:5</a>; <a onClick="return mV(\'2Ch\',24,12);">2Ch 24:12</a>), or mercenary soldiers (<a onClick="return mV(\'2Sa\',10,6);">2Sa 10:6</a>; <a onClick="return mV(\'2Ki\',7,6);">2Ki 7:6</a>; <a onClick="return mV(\'1Ch\',19,6);">1Ch 19:6</a>; <a onClick="return mV(\'2Ch\',25,6);">2Ch 25:6</a>), or a goldsmith (<a onClick="return mV(\'Isa\',46,6);">Isa 46:6</a>), or a band of loose followers (<a onClick="return mV(\'Jdg\',9,4);">Jud 9:4</a>), or a false priest (<a onClick="return mV(\'Jdg\',18,4);">Jud 18:4</a>), or Balaam (<a onClick="return mV(\'Deu\',23,4);">De 23:4</a>; <a onClick="return mV(\'Neh\',13,2);">Ne 13:2</a>), or hostile counselors (<a onClick="return mV(\'Ezr\',4,5);">Ezr 4:5</a>), or false prophets (<a onClick="return mV(\'Neh\',6,12);">Ne 6:12</a>f). As a verbal adjective it refers to things (<a onClick="return mV(\'Exd\',22,15);">Ex 22:15</a>; <a onClick="return mV(\'Isa\',7,20);">Isa 7:20</a>)or men (<a onClick="return mV(\'Lev\',19,13);">Le 19:13</a>; <a onClick="return mV(\'Jer\',46,21);">Jer 46:21</a>).<P>(b) As a noun it denotes the wage in money, or something else, paid to workmen for their services (<a onClick="return mV(\'Gen\',30,32);">Ge 30:32</a>f; <a onClick="return mV(\'Gen\',31,8);">31:8</A>; <a onClick="return mV(\'Deu\',24,15);">De 24:15</a>; <a onClick="return mV(\'1Ki\',5,6);">1Ki 5:6</a>; <a onClick="return mV(\'Zec\',8,10);">Zec 8:10</a>), or the rent or hire paid for a thing (<a onClick="return mV(\'Exd\',22,15);">Ex 22:15</a>), or a work-beast (<a onClick="return mV(\'Zec\',8,10);">Zec 8:10</a>). In <a onClick="return mV(\'Gen\',30,16);">Ge 30:16</a> Leah hires from Rachel the privilege of having Jacob with her again, and her conception and the subsequent birth of a son, she calls her hire or wage from the Lord for the gift of her slave girl to Jacob as a concubine (<a onClick="return mV(\'Gen\',30,18);">Ge 30:18</a>).<P>(2) The other word translated hire is \'ethnan, once \'ethnan. It is rather a gift (from root nathan, "to give") than a wage earned by labor, and is used uniformly in a bad sense. It is the gift made to a harlot (<a onClick="return mV(\'Deu\',23,18);">De 23:18</a>), or, reversing the usual custom, made by the harlot nation (<a onClick="return mV(\'Eze\',16,31,41);">Eze 16:31, 41</a>). It was also used metaphorically of the gifts made by Israelites to idols, since this was regarded as spiritual harlotry (<a onClick="return mV(\'Isa\',23,17);">Isa 23:17</a>f; <a onClick="return mV(\'Mic\',1,7);">Mic 1:7</a>; compare also <a onClick="return mV(\'Hsa\',8,9);">Ho 8:9</a>f).<P>In the English New Testament the word occurs once as a verb and 3 times as a noun as the translation of misthos, and its verbal form. In <a onClick="return mV(\'Mat\',20,1,8);">Mt 20:1, 8</a> and <a onClick="return mV(\'Jam\',5,4);">Jas 5:4</a> it refers to the hiring of ordinary field laborers for a daily wage. In <a onClick="return mV(\'Luk\',10,7);">Lu 10:7</a> it signifies the stipend which is due the laborer in the spiritual work of the kingdom of God. It is a wage, earned by toil, as that of other laborers. The word is very significant here and absolutely negatives the idea, all too prevalent, that money received by the spiritual toiler is a gift. It is rather a wage, the reward of real toil.``114';
isbe[4367]='Hireling`hir\'-ling (sakhir): Occurs only 6 times in the Old Testament, and uniformly means a laborer for a wage. In <a onClick="return mV(\'Job\',7,1);">Job 7:1</a>f there is reference to the hireling\'s anxiety for the close of the day. In <a onClick="return mV(\'Isa\',16,14);">Isa 16:14</a> and <a onClick="return mV(\'Isa\',21,16);">21:16</A> the length of the years of a hireling is referred to, probably because of the accuracy with which they were determined by the employer and the employee. Malachi (<a onClick="return mV(\'Mal\',3,5);">3:5</A>) speaks of the oppression of the hireling in his wages, probably by the smallness of the wage or by in some way defrauding him of part of it.<P>In the New Testament the word "hireling" (misthotos) occurs only in <a onClick="return mV(\'Jhn\',10,12);">Joh 10:12</a>f; where his neglect of the sheep is contrasted unfavorably with the care and courage of the shepherd who owns the sheep, who leads them to pasture and lays down his life for their protection from danger and death.``114';
isbe[4368]='His`hiz: Used often in the King James Version with reference to a neuter or inanimate thing, or to a lower animal (<a onClick="return mV(\'Gen\',1,11);">Ge 1:11</a>, "after his kind"; <a onClick="return mV(\'Lev\',1,16);">Le 1:16</a>, "pluck away his crop"; <a onClick="return mV(\'Act\',12,10);">Ac 12:10</a>, "of his own accord"; <a onClick="return mV(\'1Cr\',15,38);">1Co 15:38</a>, "his own body"), etc. the Revised Version (British and American) substitutes "its."``1';
isbe[4369]='Hiss`his (sharaq): "To hiss" has two applications:<P class="in15">(1) to call,<P class="in15">(2) to express contempt or scorn.<P>(1) It is the translation of sharaq, a mimetic word meaning to hiss or whistle, to call (bees, etc.), (a) <a onClick="return mV(\'Isa\',5,26);">Isa 5:26</a>, "I will hiss unto them from the ends of the earth," the Revised Version (British and American) "hiss for them (margin "him") from the end of the earth"; <a onClick="return mV(\'Isa\',7,18);">7:18</A>, "Yahweh will hiss for the fly that is in the uttermost part of the rivers of Egypt, and for the bee that is in the land of Assyria"; namely, Egyptians whose land was noted for flies (<a onClick="return mV(\'Isa\',18,1);">18:1</A>) and Assyrians whose country was pre-eminently one of bees. Dangerous enemies are compared to bees in <a onClick="return mV(\'Deu\',1,44);">De 1:44</a>; <a onClick="return mV(\'Psa\',118,12);">Ps 118:12</a> (Skinner\'s Isaiah): <a onClick="return mV(\'Zec\',10,8);">Zec 10:8</a>, "I will hiss for them, and gather them" (His own people, who will come at His call).<P>(2) More often, to hiss is to express contempt or derision (<a onClick="return mV(\'1Ki\',9,8);">1Ki 9:8</a>; <a onClick="return mV(\'Job\',27,23);">Job 27:23</a>; <a onClick="return mV(\'Jer\',19,8);">Jer 19:8</a>, etc.). In this sense we have also frequently a hissing (<a onClick="return mV(\'2Ch\',29,8);">2Ch 29:8</a>; <a onClick="return mV(\'Jer\',19,8);">Jer 19:8</a>; <a onClick="return mV(\'Jer\',25,9,18);">25:9, 18</a>; <a onClick="return mV(\'Jer\',29,18);">29:18</a>; <a onClick="return mV(\'Jer\',51,37);">51:37</a>; <a onClick="return mV(\'Mic\',6,16);">Mic 6:16</a>, shereqah); <a onClick="return mV(\'Jer\',18,16);">Jer 18:16</a>, sheriqoth or sheruqoth; Ecclesiasticus 22:1, "Every one will hiss him (the slothful man) out in his disgrace" (eksurisso, "to hiss out"); The <span class="noTag">Wisdom of Solomon 17:9</span>, "hissing of serpents" (surigmos).``185';
isbe[4370]='Hitherto`hith\'-er-too (to this): Used of both place and time. It is the translation of various words and phrases:<P>(1) Of place, \'adh halom (<a onClick="return mV(\'2Sa\',7,18);">2Sa 7:18</a>, "Thou hast brought me hitherto," the Revised Version (British and American) "thus far"; <a onClick="return mV(\'1Ch\',17,16);">1Ch 17:16</a>; perhaps <a onClick="return mV(\'1Sa\',7,12);">1Sa 7:12</a>, \'adh hennah, "Hitherto hath Yahweh helped us" (in connection with the setting up of the stone Ebenezer)) belongs to this head; hennah is properly an adverb of place; it might always be rendered "thus far."<P>(2) Of time, \'adh koh, "unto this" (<a onClick="return mV(\'Exd\',7,16);">Ex 7:16</a>, "Hitherto thou hast not hearkened"; <a onClick="return mV(\'Jos\',17,14);">Jos 17:14</a>, "Hitherto Yahweh hath blessed me"); me\'az, "from then" (<a onClick="return mV(\'2Sa\',15,34);">2Sa 15:34</a>, the Revised Version (British and American) "in time past"); hale\'ah, "beyond," etc. (<a onClick="return mV(\'Isa\',18,7);">Isa 18:7</a>, "terrible from their beginning hitherto," the Revised Version (British and American) "onward"); \'adh kah, Aramaic (<a onClick="return mV(\'Dan\',7,28);">Da 7:28</a>, the Revised Version (British and American) "here," margin "hitherto"); \'adh hennah, "unto here" (<a onClick="return mV(\'Jdg\',16,13);">Jud 16:13</a>; <a onClick="return mV(\'1Sa\',1,16);">1Sa 1:16</a>; <a onClick="return mV(\'Psa\',71,17);">Ps 71:17</a>, etc.); achri tou deuro (<a onClick="return mV(\'Rom\',1,13);">Ro 1:13</a>, "was let (the Revised Version (British and American) "hindered") hitherto"); heos arti, "until now" (<a onClick="return mV(\'Jhn\',5,17);">Joh 5:17</a>, "My Father worketh hitherto, and I work" the Revised Version (British and American) "even until now," that is, "on the Sabbath as well as on other days\', and I do as He does"; <a onClick="return mV(\'Jhn\',16,24);">Joh 16:24</a>, "Hitherto have ye asked nothing in my name: ask, and ye shall receive," that is "up till now"; "now ask in my name and ye shall receive"); oupo, "not yet" (<a onClick="return mV(\'1Cr\',3,2);">1Co 3:2</a>, "Hitherto ye were not able to bear it," the Revised Version (British and American) "not yet").``185';
