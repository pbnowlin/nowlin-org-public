isbe[4371]='Hittites`hit\'-its (bene cheth, chittim; Chettaioi): One of the seven nations conquered by Israel in Palestine.<P><b>I. OLD TESTAMENT NOTICES</b><P class="in15">1. Enumeration of Races<P class="in15">2. Individuals<P class="in15">3. Later Mention<P><b>II. HISTORY</b><P class="in15">1. Sources<P class="in15">2. Chronology<P class="in15">3. Egyptian Invasions: XVIIIth Dynasty<P class="in15">4. "The Great King"<P class="in15">5. Egyptian Invasions: XIXth Dynasty<P class="in15">6. Declension of Power: Aryan Invasion<P class="in15">7. Second Aryan Invasion<P class="in15">8. Assyrian Invasions<P class="in15">9. Invasion by Assur-nasir-pal<P class="in15">10. Invasions by Shalmaneser II and Rimmonnirari III<P class="in15">11. Revolts and Invasions<P class="in15">12. Break-up of Hittite Power<P class="in15">13. Mongols in Syria<P><b>III. LANGUAGE</b><P class="in15">1. Mongol Race<P class="in15">2. Hittite and Egyptian Monuments<P class="in15">3. Hair and Beard<P class="in15">4. Hittite Dress<P class="in15">5. Hittite Names<P class="in15">6. Vocabulary of Pterium Epistles<P class="in15">7. Tell el-Amarna Tablet<P><b>IV. RELIGION</b><P class="in15">1. Polytheism: Names of Deities<P class="in15">2. Religious Symbolism<P><b>V. SCRIPT</b><P class="in15">1. Cuneiform and Hieroglyphic<P class="in15">2. Description of Signs<P class="in15">3. Interpretation of Monuments<P><b>LITERATURE</b><hr /><P>I. Old Testament Notices.<P>1. Enumeration of Races:<P>The "sons of Heth" are noticed 12 times and the Hittites 48 times in the Old Testament. In 21 cases the name Occurs in the enumeration of races, in Syria and Canaan, which are said (<a onClick="return mV(\'Gen\',10,6);">Ge 10:6</a>f) to have been akin to the early inhabitants of Chaldea and Babylon. From at least 2000 BC this population is known, from monumental records, to have been partly Semitic and partly Mongolic; and the same mixed race is represented by the Hittite records recently discovered in Cappadocia and Pontus. Thus, while the Canaanites ("lowlanders"), Amorites (probably "highlanders"), Hivites ("tribesmen") and Perizzites ("rustics") bear Semitic titles, the Hittites, Jebusites and Girgashites appear to have non-Sem names. Ezekiel (<a onClick="return mV(\'Eze\',16,3,15);">16:3,15</A>) speaks of the Jebusites as a mixed Hittite-Amorite people.<P>2. Individuals:<P>The names of Hittites noticed in the Old Testament include several that are Semitic (Ahimelech, Judith, Bashemath, etc.), but others like Uriah and Beeri (<a onClick="return mV(\'Gen\',26,34);">Ge 26:34</a>) which are probably non-Sem. Uriah appears to have married a Hebrew wife (Bathsheba), and Esau in like manner married Hittite women (<a onClick="return mV(\'Gen\',26,34);">Ge 26:34</a>; <a onClick="return mV(\'Gen\',36,2);">36:2</a>). In the time of Abraham we read of Hittites as far south as Hebron (<a onClick="return mV(\'Gen\',23,3);">Ge 23:3</a>ff; <a onClick="return mV(\'Gen\',27,46);">27:46</A>), but there is no historic improbability in this at a time when the same race appears (see <a href="study/isbe/search.html?string=ZOAN">ZOAN</A>) to have ruled in the Nile Delta (but see Gray in The Expositor, May,1898,340f).<P>3. Later Mention:<P>In later times the "land of the Hittites" (<a onClick="return mV(\'Jos\',1,4);">Jos 1:4</a>; <a onClick="return mV(\'Jdg\',1,26);">Jud 1:26</A>) was in Syria and near the Euphrates (see <a href="study/isbe/search.html?string=TAHTIM-HODSH">TAHTIM-HODSHI</a>); though Uriah (<a onClick="return mV(\'2Sa\',11,\'1-\');">2Sa 11</a>) lived in Jerusalem, and Ahimelech (<a onClick="return mV(\'1Sa\',26,6);">1Sa 26:6</a>) followed David. In the time of Solomon (<a onClick="return mV(\'1Ki\',10,29);">1Ki 10:29</a>), the "kings of the Hittites" are mentioned with the "kings of Syria," and were still powerful a century later (<a onClick="return mV(\'2Ki\',7,6);">2Ki 7:6</a>). Solomon himself married Hittite wives (<a onClick="return mV(\'1Ki\',11,1);">1Ki 11:1</a>), and a few Hittites seem still to have been left in the south (<a onClick="return mV(\'2Ch\',8,7);">2Ch 8:7</a>), even in his time, if not after the captivity (<a onClick="return mV(\'Ezr\',9,1);">Ezr 9:1</a>; <a onClick="return mV(\'Neh\',9,8);">Ne 9:8</a>).<P>II. History.<P>1. Sources:<P>The Hittites were known to the Assyrians as Chatti, and to the Egyptians as Kheta, and their history has been very fully recovered from the records of the XVIIIth and XIXth Egyptian Dynasties, from the Tell el-Amarna Letters, from Assyrian annals and, quite recently, from copies of letters addressed to Babylonian rulers by the Hittite kings, discovered by Dr. H. Winckler in the ruins of Boghaz-keui ("the town of the pass"), the ancient Pterium in Pontus, east of the river Halys. The earliest known notice (King, Egypt and West Asia, 250) is in the reign of Saamsu-ditana, the last king of the first Babylonian Dynasty, about 2000 BC, when the Hittites marched on the "land of Akkad," or "highlands" north of Mesopotamia.<P>2. Chronology:<P>The chronology of the Hittites has been made clear by the notices of contemporary rulers in Babylonia, Matiene, Syria and Egypt, found by Winckler in the Hittite correspondence above noticed, and is of great importance to Bible history, because, taken in conjunction with the Tell el-Amarna Letters, with the Kassite monuments of Nippur, with the Babylonian chronicles and contemporary chronicles of Babylon and Assyria, it serves to fix the dates of the Egyptian kings of the XVIIIth and XIXth Dynasties which were previously uncertain by nearly a century, but which may now be regarded as settled within a few years. From the Tell el-Amarna Letters it is known that Thothmes IV was contemporary with the father of Adad-nirari of Assyria (Berlin no. 30), and Amenophis IV with Burna-burias of Babylon (Brit. Mss. no. 2</a>); while a letter from Chattu-sil, the Hittite contemporary of Rameses II, was addressed to Kadashman-Turgu of Babylon on the occasion of his accession. These notices serve to show that the approximate dates given by Brugsch for the Pharaohs are more correct than those proposed by Mahler; and the following table will be useful for the understanding of the history—Thothmes III being known to have reigned 54 years, Amenophis III at least 36 years, and Rameses II, 66 years or more. The approximate dates appear to be thus fixed.<P>3. Egyptian Invasions: XVIIIth Dynasty:<P>The Hyksos race having been expelled from the Delta by Aahmes, the founder of the XVIIIth (Theban) Dynasty, after 1700 BC, the great trade route through Palestine Syria was later conquered by Thothmes I, who set up a monument on the west bank of the Euphrates. The conquests of Aahmes were maintained by his successors Amenophis I and Thothmes I and II; but when Thothmes III attained his majority (about 1580 BC), a great league of Syrian tribes and of Canaanites, from Sharuhen near Gaza and "from the water of Egypt, as far as the land of Naharain" (Aram-naharaim), opposed this Pharaoh in his 22nd year, being led by the king of Kadesh—probably Kadesh on the Orontes (now Qedes, north of Riblah)—but they were defeated near Megiddo in Central Palestine; and in successive campaigns down to his 31st year, Thothmes III reconquered the Palestine plains, and all Syria to Carchemish on the Euphrates. In his 29th year, after the conquest of Tuneb (now Tennnib, west of Arpad), he mentions the tribute of the Hittites including "304 lbs in 8 rings of silver, a great piece of white precious stone, and zagu wood." They were, however, still powerful, and further wars in Syria were waged by Amenophis II, while Thothmes IV also speaks of his first "campaign against the land of the Kheta." Adad-nirari I wrote to Egypt to say that Thothmes IV had established his father (Bel-tiglat-Assur) as ruler of the land of Marchasse (probably Mer\'ash in the extreme north of Syria), and to ask aid against the "king of the land of the Hittites." Against the increasing power of this race Thothmes IV and his son Amenophis III strengthened themselves by marriage alliances with the Kassite kings of Babylon, and with the cognate rulers of Matiene, east of the Hittite lands of Syria, and Cappadocia. Dusratta of Matiene, whose sister Gilukhepa was married by Amenophis III in his 10th year, wrote subsequently to this Pharaoh to announce his own accession (Am Tab, Brit. Mus. no. 9</a>) and his defeat of the Hittites, sending a two-horse chariot and a young man and young woman as "spoils of the land of the Hittites."<P>4. "The Great King":<P>About this time (1480 BC) arose a great Hittite ruler bearing the strange name Subbiliuliuma, similar to that of Sapalulmi, chief the Hattinai, in North Syria, mentioned by Shalmaneser II in the 9th century BC. He seems to have ruled at Pterium, and calls himself "the great king, the noble king of the Hatti." He allied himself against Dusratta with Artatama, king of the Harri or North Syrians. The Syrian Hittites in Marchassi, north of the land of the Amorites, were led shortly after by Edugamma of Kinza (probably Kittiz, north of Arpad) in alliance with Aziru the Amorite, on a great raid into Phoenicia and to Bashan, south of Damascus. Thus it appears that the Amorites had only reached this region shortly before the Hebrew conquest of Bashan. Amenophis III repelled them in Phoenicia, and Subbiliuliuma descended on Kinza, having made a treaty with Egypt, and captured Edugamma and his father Suttatarra. He also conquered the land of Ikata which apparently lay east of the Euphrates and south of Carehemish. Some 30 years later, in the reign of Amenophis IV, Dusratta of Matiene was murdered, and his kingdom was attacked by the Assyrians; but Subbiliuliuma, though not a friend of Dusratta with whom he disputed the suzerainty of North Syria, sent aid to Dusratta\'s son Mattipiza, whom he set on his throne, giving him his own daughter as a wife. A little later (about 1440 BC) Aziru the Amorite, who had been subject to Amenophis III, submitted to this same great Hittite ruler, and was soon able to conquer the whole of Phoenicia down to Tyre. All the Egyptian conquests were thus lost in the latter part of the reign of Amenophis III, and in that of Amenophis IV. Only Gaza seems to have been retained, and Burna-burias of Babylon, writing to Amenophis IV, speaks of the Canaanite rebellion as beginning in the time of his father Kuri-galzu I (Am Tab, British Museum no. 2</a>), and of subsequent risings in his own time (Berlin no. 7</a>) which interrupted communication with Egypt. Assur-yuballidh of Assyria (Berlin no. 9</a>), writing to the same Pharaoh, states also that the relations with Assyria, which dated back even to the time of Assur-nadin-akhi (about 1550 BC), had ceased. About this earlier period Thothmes III records that he received presents from Assyria. The ruin of Egypt thus left the Hittites independent, in North Syria, about the time when—according to Old Testament chronology—Palestine was conquered by Joshua. They probably acknowledged Arandas, the successor of Subbiliuliuma, as their suzerain.<P>5. Egyptian Invasions: XIXth Dynasty:<P>The XVIIIth Dynasty was succeeded, about 1400 BC, or a little later, by the XIXth, and Rameses I appears to have been the Pharaoh who made the treaty which Mursilis, brother of Arandas, contracted with Egypt. But on the accession of Seti I, son of Rameses I, the Syrian tribes prepared to "make a stand in the country of the Harri" against the Egyptian resolution to recover the suzerainty of their country. Seti I claims to have conquered "Kadesh (on the Orontes) in the Land of the Amorites," and it is known that Mutallis, the eldest son of Mursilis, fought against Egypt. According to his younger brother Hattusil, he was tyrant, who was finally driven out by his subjects and died before the accession of Kadashman-Turgu (about 1355 BC) in Babylon. Hattusil, the contemporary of Rameses II, then seized the throne as "great king of the Hittites" and "king of Kus" ("Cush," <a onClick="return mV(\'Gen\',2,3);">Ge 2:3</a>), a term which in the Akkadian language meant "the west." In his 2nd year Rameses II advanced, after the capture of Ashkelon, as far as Beirut, and in his 5th year he advanced on Kadesh where he was opposed by a league of the natives of "the land of the Kheta, the land of Naharain, and of all the Kati" (or inhabitants of Cilicia), among which confederates the "prince of Aleppo" is specially noticed. The famous poem of Pentaur gives an exaggerated account of the victory won by Rameses II at Kadesh, over the allies, who included the people of Carchemish and of many other unknown places; for it admits that the Egyptian advance was not continued, and that peace was concluded. A second war occurred later (when the sons of Rameses II were old enough to take part), and a battle was then fought at Tuneb (Tennib) far north of Kadesh, probably about 1316 BC. The celebrated treaty between Rameses II and Chattusil was then made, in the 21st year of the first named. It was engraved on a silver tablet having on the back the image of Set (or Sutekh), the Hittite god of heaven, and was brought to Egypt by Tar-Tessubas, the Hittite envoy. The two "great kings" treated together as equals, and formed a defensive and offensive alliance, with extradition clauses which show the advanced civilization of the age. In the 34th year of his reign, Rameses II (who was then over 50 years of age) married a daughter of Chattusil, who wrote to a son of Kadashman-Turgu (probably Kadashman-burias) to inform this Kassite ruler of Babylon of the event. He states in another letter that he was allied by marriage to the father of Kadashman-Turgu, but the relations between the Kassite rulers and the Hittites were not very cordial, and complaints were made on both sides. Chattusil died before Rameses II, who ruled to extreme old age; for the latter (and his queen) wrote letters to Pudukhipa, the widow of this successful Hittite overlord. He was succeeded by Dudhalia, who calls himself "the great king" and the "son of Pudukhipa the great queen, queen of the land of the city of the Chatti."<P>6. Declension of Power: Aryan Invasion:<P>The Hittite power began now, however, to decline, in consequence of attacks from the West by hostile Aryan invaders. In the 5th year of Seti Merenptah II, son of Rameses II, these fair "peoples of the North" raided the Syrian coasts, and advanced even to Belbeis and Heliopolis in Egypt, in alliance with the Libyans west of the Delta. They were defeated, and Merenptah appears to have pursued them even to Pa-Kan\'-ana near Tyre. A text of his 5th year (found by Dr. Flinders Petrie in 1896) speaks of this campaign, and says that while "Israel is spoiled" the "Hittites are quieted": for Merenptah appears to have been on good terms with them, and allowed corn to be sent in ships "to preserve the life of this people of the Chatti." Dudchalia was succeeded by his son "Arnuanta the great king," of whom a bilingual seal has been found by Dr. Winckler, in Hittite and cuneiform characters; but the confederacy of Hittite tribes which had so long resisted Egypt seems to have been broken up by these disasters and by the increasing power of Assyria.<P>7. Second Aryan Invasion:<P>A second invasion by the Aryans occurred in the reign of Rameses III (about 1200 BC) when "agitation seized the peoples of the North," and "no people stood before their arms, beginning with the people of the Chatti, of the Kati, of Carchemish and Aradus." The invaders, including Danai (or early Greeks), came by land and sea to Egypt, but were again defeated, and Rameses III—the last of the great Pharaohs—pursued them far north, and is even supposed by Brugsch to have conquered Cyprus. Among the cities which he took he names Carchemish, and among his captives were "the miserable king of the Chatti, a living prisoner," and the "miserable king of the Amorites."<P>8. Assyrian Invasions:<P>Half a century later (1150 BC) the Assyrians began to invade Syria, and Assur-ris-isi reached Beirut; for even as early as about 1270 BC Tukulti-Ninip of Assyria had conquered the Kassites, and had set a Semitic prince on their throne in Babylon. Early in his reign (about 1130 BC) Tiglath- pileser I claims to have subdued 42 kings, marching "to the fords of the Euphrates, the land of the Chatti, and the upper sea of the setting sun"—or Mediterranean. Soldiers of the Chatti had seized the cities of Sumasti (probably Samosata), but the Assyrian conqueror made his soldiers swim the Euphrates on skin bags, and so attacked "Carchemish of the land of the Hittites." The Moschians in Cappadocia were apparently of Hittite race, and were ruled by 5 kings: for 50 years they had exacted tribute in Commagene (Northeastern Syria), and they were defeated, though placing 20,000 men in the field against Tiglath-pileser I. He advanced to Kumani (probably Comana in Cappadocia), and to Arini which was apparently the Hittite capital called Arinas (now Iranes), west of Caesarea in the same region.<P>9. Invasion by Assur-nacir-pal:<P>The power of the Hittites was thus broken by Assyria, yet they continued the struggle for more than 4 centuries afterward. After the defeat of Tiglath-pileser I by Marduk-nadin-akhi of Babylon (1128-1111 BC), there is a gap in Assyrian records, and we next hear of the Hittites in the reign of Assur-nacir-pal (883-858 BC); he entered Commagene, and took tribute from "the son of Bachian of the land of the Chatti," and from "Sangara of Carchemish in the land of the Chatti," so that it appears that the Hittites no longer acknowledged a single "great king." They were, however, still rich, judging from the spoil taken at Carchemish, which included 20 talents of silver, beads, chains, and sword scabbards of gold, 100 talents of copper, 250 talents of iron, and bronze objects from the palace representing sacred bulls, bowls, cups and censers, couches, seats, thrones, dishes, instruments of ivory and 200 slave girls, besides embroidered robes of linen and of black and purple stuffs, gems, elephants\' tusks, chariots and horses. The Assyrian advance continued to \'Azzaz in North Syria, and to the Afrin river, in the country of the Chattinai who were no doubt Hittites, where similar spoils are noticed, with 1,000 oxen and 10,000 sheep: the pagutu, or "maces" which the Syrian kings used as scepters, and which are often represented on Hittite monuments, are specially mentioned in this record. Assur-nacir-pal reached the Mediterranean at Arvad, and received tribute from "kings of the sea coast" including those of Gebal, Sidon and Tyre. He reaped the corn of the Hittites, and from Mt. Amanus in North Syria he took logs of cedar, pine, box and cypress.<P>10. Invasions by Shalmaneser II and Rimmonnirari III:<P>His son Shalmaneser II (858-823 BC) also invaded Syria in his 1st year, and again mentions Sangara of Carchemish, with Sapalulmi of the Chattinai. In Commagene the chief of the Gamgums bore the old Hittite name Mutallis. In 856 BC Shalmaneser II attacked Mer\'-ash and advanced by Dabigu (now Toipuk) to \'Azzaz. He took from the Hattinai 3 talents of gold, 100 of silver, 300 of copper, 1,000 bronze vases and 1,000 embroidered robes. He also accepted as wives a daughter of Mutallis and another Syrian princess. Two years later 120,000 Assyrians raided the same region, but the southward advance was barred by the great Syrian league which came to the aid of Irchulena, king of Hamath, who was not subdued till about 840 BC. In 836 BC the people of Tubal, and the Kati of Cappadocia and Cilicia, were again attacked. In 831 BC Qubarna, the vassal king of the Chattinai in Syria, was murdered by his subjects, and an Assyrian tartanu or general was sent to restore order. The rebels under Sapalulmi had been confederated with Sangara of Carchemish. Adad-nirari III, grandson of Shalmaneser II, was the next Assyrian conqueror: in 805 BC he attacked \'Azzaz and Arpad, but the resistance of the Syrians was feeble, and presents were sent from Tyre, Sidon, Damascus and Edom. This conqueror states that he subdued "the land of the Hittites, the land of the Amorites, to the limits of the land of Sidon," as well as Damascus, Edom and Philistia.<P>11. Revolts and Invasions:<P>But the Hittites were not as yet thoroughly subdued, and often revolted. In 738 BC Tiglath-pileser II mentions among his tributaries a chief of the Gamgums bearing the Hittite name Tarku-lara, with Pisiris of Carchemish. In 702 BC Sennacherib passed peacefully through the "land of the Chatti" on his way to Sidon: for in 717 BC Sargon had destroyed Carchemish, and had taken many of the Hittites prisoners, sending them away far east and replacing them by Babylonians. Two years later he in the same way took the Hamathites as captives to Assyria. Some of the Hittites may have fled to the south, for in 709 BC Sargon states that the king of Ashdod was deposed by "people of the Chatti plotting rebellion who despised his rule," and who set up Azuri instead.<P>12. Breakup of Hittite Power:<P>The power of the Hittites was thus entirely broken before Sennacherib\'s time, but they were not entirely exterminated, for, in 673 BC, Esar-haddon speaks of "twenty-two kings of the Chatti and near the sea." Hittite names occur in 712 BC (Tarchu-nazi of Meletene) and in 711 BC (Mutallis of Commagene), but after this they disappear. Yet, even in a recently found text of Nebuchadnezzar (after 600 BC), we read that "chiefs of the land of the Chattim, bordering on the Euphrates to the west, where by command of Nergal my lord I had destroyed their rule, were made to bring strong beams from the mountain of Lebanon to my city Babylon." A Hittite population seems to have survived even in Roman times in Cilicia and Cappadocia, for (as Dr. Mordtman observed) a king and his son in this region both bore the name Tarkon-dimotos in the time of Augustus, according to Dio Cassius and Tacitus; and this name recalls that of Tarku-timme, the king of Erine in Cappadocia, occurring on a monument which shows him as brought captive before an Assyrian king, while the same name also occurs on the bilingual silver boss which was the head of his scepter, inscribed in Hittite and cuneiform characters.<P>13. Mongols in Syria:<P>The power of the Mongolic race decayed gradually as that of the Semitic Assyrians increased; but even now in Syria the two races remain mingled, and Turkoman nomads still camp even as far south as the site of Kadesh on the Orontes, while a few tribes of the same stock (which entered Syria in the Middle Ages) still inhabit the plains of Sharon and Esdraelon, just as the Southern Hittites dwelt among the Amorites at Jerusalem and Hebron in the days of Abraham, before they were driven north by Thothmes III.<P>III. Language.<P>1. Mongol Race:<P>The questions of race and language in early times, before the early stocks were mixed or decayed, cannot be dissociated, and we have abundant evidence of the racial type and characteristic dress of the Hittites. The late Dr. Birch of the British Museum pointed out the Mongol character of the Hittite type, and his opinion has been very generally adopted. In 1888 Dr. Sayce (The Hittites, 15, 101) calls them "Mongoloid," and says, "They had in fact, according to craniologists, the characteristics of a Mongoloid race." This was also the opinion of Sir W. Flower; and, if the Hittites were Mongols, it would appear probable that they spoke a Mongol dialect. It is also apparent that, in this case, they would be related to the old Mongol population of Chaldea (the people of Akkad and Sumir or "of the highlands and river valley") from whom the Semitic Babylonians derived their earliest civilization.<P>2. Hittite on Egyptian Monuments:<P>The Hittite type is represented, not only on their own monuments, but on those of the XVIIIth and XIXth Egyptian Dynasties, including a colored picture of the time of Rameses III. The type represented has a short head and receding forehead, a prominent and sometimes rather curved nose, a strong jaw and a hairless face. The complexion is yellow, the eyes slightly slanting, the hair of the head black, and gathered into a long pigtail behind. The physiognomy is like that of the Sumerians represented on a bas-relief at Tel-loh (Zirgul) in Chaldea, and very like that of some of the Kirghiz Mongols of the present time, and of some of the more purely Mongolic Turks. The head of Gudea at Zirgul in like manner shows (about 2800 BC) the broad cheek bones and hairless face of the Turkish type; and the language of his texts, in both grammar and vocabulary, is closely similar to pure Turkish speech.<P>3. Hair and Beard:<P>Among Mongolic peoples the beard grows only late in life, and among the Akkadians it is rarely represented—excepting in the case of gods and ancient kings. The great bas-relief found by Koldewey at Babylon, and representing a Hittite thunder-god with a long pigtail and (at the back) a Hittite inscription, is bearded, but the pigtailed heads on other Hittite monuments are usually hairless. At Iasili-Kaia—the rock shrine near Pterium—only the supreme god is bearded, and all the other male figures are beardless. At Ibreez, in Lycaonia, the gigantic god who holds corn and grapes in his hands is bearded, and the worshipper who approaches him also has a beard, and his hair is arranged in the distinctive fashion of the Semitic Babylonians and Assyrians. This type may represent Semitic mixture, for M. Chantre discovered at Kara-eyak, in Cappadocia, tablets in Semitic Babylonian representing traders\' letters perhaps as old as 2000 BC. The type of the Ibreez figures has been said to resemble that of the Armenian peasantry of today; but, although the Armenians are Aryans of the old Phrygian stock, and their language almost purely Aryan, they have mixed with the Turkish and Semitic races, and have been said even to resemble the Jews. Little reliance can be placed, therefore, on comparison with modern mixed types. The Hittite pigtail is very distinctive of a Mongolic race. It was imposed on the Chinese by the Manchus in the 17th century, but it is unknown among Aryan or Semitic peoples, though it seems to be represented on some Akkadian seals, and on a bas-relief picturing the Mongolic Susians in the 7th century BC.<P>4. Hittite Dress:<P>The costume of the Hittites on monuments seems also to indicate Mongolic origin. Kings and priests wear long robes, but warriors (and the gods at Ibreez and Babylon) wear short jerkins, and the Turkish shoe or slipper with a curled-up toe, which, however, is also worn by the Hebrew tribute bearers from Jehu on the "black obelisk" (about 840 BC) of Shalmaneser II. Hittite gods and warriors are shown as wearing a high, conical head-dress, just like that which (with addition of the Moslem turban) characterized the Turks at least as late as the 18th century. The short jerkin also appears on Akkadian seals and bas-reliefs, and, generally speaking, the Hittites (who were enemies of the Lycians, Danai and other Aryans to their west) may be held to be very clearly Mongolic in physical type and costume, while the art of their monuments is closely similar to that of the most archaic Akkadian and Babylonian sculptures of Mesopotamia. It is natural to suppose that they were a branch of the same remarkable race which civilized Chaldea, but which seems to have had its earliest home in Akkad, or the "highlands" near Ararat and Media, long before the appearance of Aryan tribes either in this region or in Ionia. The conclusion also agrees with the Old Testament statement that the Hittites were akin to the descendants of Ham in Babylonia, and not to the "fair" tribes (Japheth), including Medes, Ionians and other Aryan peoples.<P>5. Hittite Names:<P>As early as 1866 Chabas remarked that the Hittite names (of which so many have been mentioned above) were clearly not Semitic, and this has been generally allowed. Those of the Amorites, on the other hand, are Semitic, and the type represented, with brown skin, dark eyes and hair, aqui-line features and beards, agrees (as is generally allowed) in indicating a Semitic race. There are now some 60 of these Hittite names known, and they do not suggest any Aryan etymology. They are quite unlike those of the Aryan Medes (such as Baga-datta, etc.) mentioned by the Assyrians, or those of the Vannic kings whose language (as shown by recently published bilinguals in Vannic and Assyrian) seems very clearly to have been Iranian—or similar to Persian and Sanskrit—but which only occurs in the later Assyrian age. Comparisons with Armenian and Georgian (derived from the Phrygian and Scythian) also fail to show any similarity of vocabulary or of syntax, while on the other hand comparisons with the Akkadian, the Kassite and modern Turkish at once suggest a linguistic connection which fully agrees with what has been said above of the racial type. The common element Tarku, or Tarkhan, in Hittite names suggests the Mongol dargo and the Turkish tarkhan, meaning a "tribal chief." Sil again is an Akkadian word for a "ruler," and nazi is an element in both Hittite and Kassite names.<P>6. Vocabulary of Pterium Epistles:<P>It has also been remarked that the vocabulary of the Hittite letters discovered by Chantre at Pterium recalls that of the letter written by Dusratta of Matiene to Amenophis III (Am Tab no. 27</a>, Berlin), and that Dusratta adored the Hittite god Tessupas. A careful study of the language of this letter shows that, in syntax and vocabulary alike, it must be regarded as Mongolic and as a dialect of the Akkadian group. The cases of the noun, for instance, are the same as in Akkadian and in modern Turkish. No less than 50 words and terminations are common to the language of this letter and of those discovered by M. Chantre and attributed to the Hittites whose territory immediately adjoined that of Matiene. The majority of these words occur also in Akkadian.<P>7. Tell el-Amarna Tablet:<P>But in addition to these indications we have a letter in the Tell el-Amarna Letters (Berlin no. 10 written by a Hittite prince, in his own tongue and in the cuneiform script. It is from (and not to, as has been wrongly supposed by Knudtzon) a chief named Tarchun-dara, and is addressed to Amenophis III, whose name stands first. In all the other letters the name of the sender always follows that of the recipient. The general meaning of this letter is clear from the known meanings of the "ideograms" used for many words; and it is also clear that the language is "agglutinative" like the Akkadian. The suffixed possessive pronouns follow the plural termination of the noun as in Akkadian, and prepositions are not used as they are in Semitic and Aryan speech; the precative form of the verb has also been recognized to be the same as used in Akkadian. The pronouns mi, "my," and ti, "thy," are to be found in many living Mongolic dialects (e.g. the Zyrianian me and te); in Akkadian also they occur as mi and zi. The letter opens with the usual salutation: "Letter to Amenophis III the great king, king of the land of Egypt (Mizzari-na), from Tarchun-dara (Tarchundara-da), king of the land of Arzapi (or Arzaa), thus. To me is prosperity. To my nobles, my hosts, my cavalry, to all that is mine in all my lands, may there be prosperity; (moreover?) may there be prosperity: to thy house, thy wives, thy sons, thy nobles, thy hosts, thy cavalry, to all that is thine in thy lands may there be prosperity." The letter continues to speak of a daughter of the Pharaoh, and of a sum of gold which is being sent in charge of an envoy named Irsappa. It concludes (as in many other instances) with a list of presents, these being sent by "the Hittite prince (Nu Chattu) from the land Igait" (perhaps the same as Ikata), and including, besides the gold, various robes, and ten chairs of ebony inlaid with ivory. As far as it can at present be understood, the language of this letter, which bears no indications of either Semitic or Aryan speech, whether in vocabulary or in syntax, strongly favors the conclusion that the native Hittite language was a dialect of that spoken by the Akkadians, the Kassites and the Minyans of Matiene, in the same age.<P>IV. Religion.<P>1. Polytheism: Names of Deities:<P>The Hittites like their neighbors adored many gods. Besides Set (or Sutekh), the "great ruler of heaven," and Ishtar (Ashtoreth), we also find mentioned (in Chattusil\'s treaty) gods and goddesses of "the hills and rivers of the land of the Chatti," "the great sea, the winds and the clouds." Tessupas was known to the Babylonians as a name of Rimmon, the god of thunder and rain. On a bilingual seal (in Hittite and cuneiform characters), now in the Ashmolean Museum, we find noticed the goddess Ischara, whose name, among the Kassites, was equivalent to Istar. The Hittite gods are represented—like those of the Assyrians—standing erect on lions. One of them (at Samala in Syria) is lion-headed like Nergal. They also believed in demons, like the Akkadians and others.<P>2. Religious Symbolism:<P>Their pantheon was thus also Mongolic, and the suggestion (by Dr. Winckler) that they adored Indian gods (Indra, Varuna), and the Persian Mithra, not only seems improbable, but is also hardly supported by the quotations from Semitic texts on which this idea is based. The sphinx is found as a Hittite emblem at Eyuk, north of Pterium, with the double-headed eagle which again, at Iasili-kaia, supports a pair of deities. It also occurs at Tel-loh as an Akkadian emblem, and was adopted by the Seljuk Turks about 1000 AD. At Eyuk we have a representation of a procession bringing goats and rams to an altar. At Iflatun-bunar the winged sun is an emblem as in Babylonia. At Mer\'-ash, in Syria, the mother goddess carries her child, while an eagle perches on a harp beside her. At Carchemish the naked Ishtar is represented with wings. The religious symbolism, like the names of deities, thus suggests a close connection with the emblems and beliefs of the Kassites and Akkadians.<P>V Script.<P>1. Cuneiform and Hieroglyphic:<P>In the 16th century BC, and down to the 13th century, the Hittites used the cuneiform characters and the Babylonian language for correspondence abroad. On seals and and mace-heads they used their own hieroglyphics, together with the cuneiform. These emblems, which occur on archaic monuments at Hamath, Carchemish and Aleppo in Syria, as well as very frequently in Cappadocia and Pontus, and less frequently as far west as Ionia, and on the east at Babylon, are now proved to be of Hittite origin, since the discovery of the seal of Arnuanta already noticed. The suggestion that they were Hittite was first made by the late Dr. W. Wright (British and Foreign Evangelical Review, 1874). About 100 such monuments are now known, including seals from Nineveh and Cappadocia, and Hittite gold ornaments in the Ashmolean Museum; and there can be little doubt that, in cases where the texts accompany figures of the gods, they are of a votive character.<P>2. Description of Signs:<P>The script is quite distinctive, though many of the emblems are similar to those used by the Akkadians. There are some 170 signs in all, arranged one below another in the line—as among Akkadians. The lines read alternately from right to left and from left to right, the profile emblems always facing the beginning of each line.<P>The interpretation of these texts is still a controversial question, but the most valuable suggestion toward their understanding is that made by the late Canon Isaac Taylor (see <a href="study/isbe/search.html?string=ALPHABET">ALPHABET</A>, 1883). A syllabary which was afterward used by the Greeks in Cyprus, and which is found extensively spread in Asia Minor, Egypt, Palestine, Crete, and even on later coins in Spain, was recognized by Dr. Taylor as being derived from the Hittite signs. It was deciphered by George Smith from a Cypriote-Phoenician bilingual, and appears to give the sounds applying to some 60 signs.<P>3. Interpretation of Monuments:<P>These sounds are confirmed by the short bilinguals as yet known, and they appear in some cases at least to be very clearly the monosyllabic words which apply in Akkadian to similar emblems. We have thus the bases of a comparative study, by aid of a known language and script—a method similar to that which enabled Sir H. Rawlinson to recover scientifically the lost cuneiform, or Champollion to decipher Egyptian hieroglyphics.<P>LITERATURE.<P>The Egyptian notices will be found in Brugsch\'s A History of Egypt under the Pharaohs, 1879, and the Assyrian in Schrader\'s Cuneiform Inscriptions and the Old Testament, English Translation, 1885. The discoveries of Chantre are published in his Mission en Cappadoce,1898, and those of Dr. H. Winckler in the Mitteilungen der deutschen Orient-Gesellschaft, no. 35, December, 1907. The researches of Humann and Puchstein, Reisen in Kleinasien und Nordsyrien,1890, are also valuable for this question; as is also Dr. Robert Koldewey\'s discovery of a Hittite monument at Babylon (Die hettische Inschrift, 1900). The recent discovery of sculpture at a site north of Samala by Professor Garstang is published in the Annals of Archaeology, I, no. 4, 1908, by the University of Liverpool. These sculptures are supposed to date about 800 BC, but no accompanying inscriptions have as yet been found. The views of the present writer are detailed in his Tell Amarna Tablets, 2nd edition,1894, and in The Hittites and Their Languages, 1898. Dr. Sayce has given an account of his researches in a small volume, The Hittites,1888, but many discoveries by Sir C. Wilson, Mr. D.G. Hogarth, Sir W. Ramsay, and other explorers have since been published, and are scattered in various periodicals not easily accessible. The suggestions of Drs. Jensen, Hommel, and Peiser, in Germany, of comparison with Armenian, Georgian and Turkish, have not as yet produced any agreement; nor have those of Dr. Sayce, who looks to Vannic or to Greek; and further light on Hittite decipherment is still awaited. See, further, Professor Garstang\'s Land of the Hittites, 1910.`<a href="./study/isbe/search.html?string=ASIA+MINOR,+ARCHAEOLOGY+OF">ASIA MINOR, ARCHAEOLOGY OF</a>; <a href="./study/isbe/search.html?string=PALESTINE+EXPLORATION,+1">PALESTINE EXPLORATION</a>`28';
isbe[4372]='Hivite`hi\'-vit (chiwwni; Heuaios):<P>1. Name:<P>A son of Canaan (<a onClick="return mV(\'Gen\',10,17);">Ge 10:17</a>), i.e. an inhabitant of the land of Canaan along with the Canaanite and other tribes (<a onClick="return mV(\'Exd\',3,17);">Ex 3:17</a>, etc.). In the list of Canaanite peoples given in <a onClick="return mV(\'Gen\',15,\'19-21\');">Ge 15:19-21</a>, the Hivites are omitted in the Hebrew text, though inserted in Septuagint and S. Gesenius suggests that the name is descriptive, meaning "villagers." The difficulty of explaining it is increased by the fact that it has been confused with "Horite" in some passages of the Hebrew text. In <a onClick="return mV(\'Jos\',9,7);">Jos 9:7</a> the Septuagint reads "Horite" as also does Codex A in <a onClick="return mV(\'Gen\',34,2);">Ge 34:2</a>, and in <a onClick="return mV(\'Gen\',36,2);">Ge 36:2</a> a comparison with <a onClick="return mV(\'Gen\',36,24,25);">36:24,25</A> shows that "Horite" must be substituted for "Hivite."<P>2. Geographical Situation:<P>In <a onClick="return mV(\'Jdg\',3,3);">Jud 3:3</a> the Hittites are described as dwelling "in Mount Lebanon, from Mount Baal-hermon unto the entrance of Hamath," and in accordance with this the Hivite is described in <a onClick="return mV(\'Jos\',11,3);">Jos 11:3</a> as being "under Hermon in the land of Mizpeh," and in <a onClick="return mV(\'2Sa\',24,7);">2Sa 24:7</a> they are mentioned immediately after "the stronghold of Tyre." Hence, the Septuagint (Codex Alexandrinus) reading must be right in <a onClick="return mV(\'Gen\',34,2);">Ge 34:2</a> and <a onClick="return mV(\'Jos\',9,7);">Jos 9:7</a>, which makes the inhabitants of Shechem and Gibeon Horites instead of Hivites; indeed, in <a onClick="return mV(\'Gen\',48,22);">Ge 48:22</a> the people of Shechem are called Amorite, though this was a general name for the population of Canaan in the patriarchal period. No name resembling Hivite has yet been found in the Egyptian or Babylonian inscriptions.``157';
isbe[4373]='Hizki`hiz\'-ki (chizqi; Septuagint Azaki; the King James Version Hezeki): A son of Elpaal, a descendant of Benjamin (<a onClick="return mV(\'1Ch\',8,17);">1Ch 8:17</a>).``1';
isbe[4374]='Hizkiah`hiz-ki\'-a (chizqiyah; Septuagint Ezekia, "strength of Yah"):<P>(1) A son of Neariah, a descendant of David (<a onClick="return mV(\'1Ch\',3,23);">1Ch 3:23</a>, the King James Version "Hezekiah").<P>(2) An ancestor of the prophet Zephaniah (<a onClick="return mV(\'Zep\',1,1);">Ze 1:1</a>). In the Revised Version (British and American) this word is here translated "Hezekiah." This name again appears in <a onClick="return mV(\'Neh\',10,17);">Ne 10:17 (Hebrew 18)</a> in the form of "Hizkijah" in the King James Version, but as "Hezekiah" in the Revised Version (British and American).`<a href="./study/isbe/search.html?string=HEZEKIAH">HEZEKIAH</a>`1';
isbe[4375]='Hoar-Frost; Hoary`hor\'-frost.`<a href="./study/isbe/search.html?string=FROST">FROST</a>`1';
isbe[4376]='Hoar; Hoary`hor, hor\'-i.`<a href="./study/isbe/search.html?string=COLOR">COLOR</a>; <a href="./study/isbe/search.html?string=HAIR">HAIR</a>`1';
isbe[4377]='Hobab`ho\'-bab (chobhabh, "beloved"; Septuagint Obab): This name occurs only twice (<a onClick="return mV(\'Num\',10,29);">Nu 10:29</a>; <a onClick="return mV(\'Jdg\',4,11);">Jud 4:11</a>). It is not certain whether it denotes the father-in-law or the brother-in-law of Moses. The direct statement of <a onClick="return mV(\'Num\',10,29);">Nu 10:29</a> is that Hobab was "the son of Reuel" (the King James Version "Raguel"). This is probably the correct view and finds support in <a onClick="return mV(\'Exd\',18,27);">Ex 18:27</a>, which tells us that some time before the departure of the Israelites from Sinai, Jethro had departed and returned to his own land. The statement of <a onClick="return mV(\'Jdg\',4,11);">Jud 4:11</a> is ambiguous, and therefore does not help us out of the difficulty, but is rather itself to be interpreted in the light of the earlier statement in <a onClick="return mV(\'Num\',10,29);">Nu 10:29</a>.<P>Mohammedan traditions favor the view that Hobab was only another name for Jethro. But this has little weight against the statements of Scripture. However, whether father-in-law or brother-in-law to Moses, the service he rendered to the leader of the hosts of Israel was most valuable and beautiful. Hobab was an experienced sheikh of the desert whose counsel and companionship Moses desired in the unfamiliar regions through which he was to journey. His knowledge of the wilderness and of its possible dangers would enable him to be to the Israelites "instead of eyes."<P>The facts recorded of this man are too meager to enable us to answer all the questions that arise concerning him. A difficulty that remains unsolved is the fact that in <a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a> and <a onClick="return mV(\'Jud\',4,11);">4:11</A> he is described as a Kenite, while in <a onClick="return mV(\'Exd\',3,1);">Ex 3:1</a> and <a onClick="return mV(\'Exd\',18,1);">18:1</A>, the father-in-law of Moses is spoken of as "the priest of Midian."``29';
isbe[4378]='Hobah`ho\'-ba (chobhah): A place "on the left hand," i.e. to the north of "Damascus," to which Abraham pursued the defeated army of Chedorlaomer (<a onClick="return mV(\'Gen\',14,15);">Ge 14:15</a>). It is probably identical with the modern Choba, about 60 miles northwest of Damascus.``1';
isbe[4379]='Hobaiah`ho-ba\'-ya (chobhayah, "whom Yahweh hides," i.e. "protects"): The head of a priestly family that returned from Babylon with Zerubbabel. Because they could not trace their genealogy, they were not permitted to serve in the priestly office (<a onClick="return mV(\'Neh\',7,63);">Ne 7:63</a>f). In the Qere of this passage and in the parallel list of <a onClick="return mV(\'Ezr\',2,61);">Ezr 2:61</a>, this name appears in the form "Habaiah" (chabhayyah). "Obdia" is the form of the word in 1Esdras 5:38.``1';
isbe[4380]='Hock`(\'aqar, "to root out"): To hamstring, i.e. to render useless by cutting the tendons of the hock (in the King James Version and the English Revised Version "hough"). "In their selfwill they hocked an ox" (<a onClick="return mV(\'Gen\',49,6);">Ge 49:6</a>, the King James Version "digged down a wall"), in their destructiveness maiming those which they could not carry off: See also <a onClick="return mV(\'Jos\',11,6,9);">Jos 11:6, 9</a>; <a onClick="return mV(\'2Sa\',8,4);">2Sa 8:4</a>.``1';
isbe[4381]='Hod`hod (hodh, "majesty," "splendor"; the Septuagint\'s Codex Alexadrinus, Hod; Codex Vaticanus, Oa): One of the sons of Zophah, a descendant of Asher (<a onClick="return mV(\'1Ch\',7,37);">1Ch 7:37</a>).``1';
isbe[4382]='Hodaiah`ho-da\'-ya.`<a href="./study/isbe/search.html?string=HODAVIAH">HODAVIAH</a>`1';
isbe[4383]='Hodaviah`hod-a-vi\'-a (hodhawyah, or hodhawyahu; the Septuagint\'s Codex Alexandrinus, Hodouia):<P>(1) One of the heads of the half-tribe of Manasseh on the east of the Jordan (<a onClick="return mV(\'1Ch\',5,24);">1Ch 5:24</a>).<P>(2) A Benjamite, the son of Hassenuah (<a onClick="return mV(\'1Ch\',9,7);">1Ch 9:7</a>).<P>(3) A Levite, who seems to have been the head of an important family in that tribe (<a onClick="return mV(\'Ezr\',2,40);">Ezr 2:40</a>). In <a onClick="return mV(\'Neh\',7,43);">Ne 7:43</a> the name is Hodevah (hodhewah; Qere hodheyah). Compare <a onClick="return mV(\'Ezr\',3,9);">Ezr 3:9</a>.<P>(4) A son of Elioenai, and a descendant of David (<a onClick="return mV(\'1Ch\',3,24);">1Ch 3:24</a>; hodhaywahu; Qere hodhawyahu, the King James Version "Hodaiah").``1';
isbe[4384]='Hodesh`ho\'-desh (chodhesh, "new moon"): One of the wives of Shaharaim, a Benjamite (<a onClick="return mV(\'1Ch\',8,9);">1Ch 8:9</a>).``1';
isbe[4385]='Hodevah`ho-de\'-va, ho\'-de-va (hodhewah, hodheyah, "splendor of Yah"): A Levite and founder of a Levite family, seventy-four of whom returned from exile with Zerubbabel, 538 BC (<a onClick="return mV(\'Neh\',7,43);">Ne 7:43</a>). the American Revised Version, margin gives as another reading "Hodeiah." In <a onClick="return mV(\'Ezr\',2,40);">Ezr 2:40</a> he is called Hodaviah, of which Hodevah and Hodeiah are slight textual corruptions, and in <a onClick="return mV(\'Ezr\',3,9);">Ezr 3:9</a> Judah, a name practically synonymous.``1';
isbe[4386]='Hodiah; Hodijah`ho-di\'-a, ho-di\'-ja (hodhiyah, "splendor of Yah"):<P>(1) A brother-in-law of Naham (<a onClick="return mV(\'1Ch\',4,19);">1Ch 4:19</a>), and possibly for that reason reckoned a member of the tribe of Judah. the King James Version translate "his wife" is wrong.<P>(2) One of the Levites who explained to the people the Law as read by Ezra (<a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>) and led their prayers (<a onClick="return mV(\'Neh\',9,5);">Ne 9:5</a>). He is doubtless one of the two Levites of this name who sealed the covenant of Nehemiah (<a onClick="return mV(\'Neh\',10,10,13);">Ne 10:10, 13</a>).<P>(3) One of the chiefs of the people who sealed the covenant of Nehemiah (<a onClick="return mV(\'Neh\',10,18);">Ne 10:18</a>).``108';
isbe[4387]='Hoglah`hog\'-la (choghlah, "partridge"): The third of five daughters of Zelophehad of the tribe of Manasseh (<a onClick="return mV(\'Num\',26,33);">Nu 26:33</a>). Zelophehad leaving no male heir, it was made a statute that the inheritance in such cases should pass to the daughters, if such there were, as joint heirs, on condition, however, of marriage within the tribe (<a onClick="return mV(\'Num\',27,\'1-11\');">Nu 27:1-11</a>; <a onClick="return mV(\'Num\',36,\'1-12\');">36:1-12</a>; <a onClick="return mV(\'Jos\',17,3);">Jos 17:3</a>f).``1';
isbe[4388]='Hoham`ho\'-ham (hoham, "whom Yahweh impels(?)" Gesenius): An Amorite king of Hebron and one of the five kings of the Amorites who leagued for war on Gibeon because of its treaty of peace with Joshua. The five were defeated in the decisive battle of Beth-horon, shut up in the cave at Makkedah in which they had taken refuge, and after the battle were slain, hanged and cast into the cave (<a onClick="return mV(\'Jos\',10,\'1-27\');">Jos 10:1-27</a>).``1';
isbe[4389]='Hoise`hoiz: The older form of "hoist" (Old English, hoise), to raise, to lift, and is the translation of epairo, "to lift up": "they...hoised up the mainsail to the wind" (<a onClick="return mV(\'Act\',27,40);">Ac 27:40</a>). the Revised Version (British and American) "and hoisting up the foresail to the wind"; Wycliff has "lefte up" Tyndale "hoysed up."``1';
isbe[4390]='Hold`hold: In the American Standard Revised Version frequently "stronghold" (<a onClick="return mV(\'Jdg\',9,49);">Jud 9:49</a>; <a onClick="return mV(\'1Sa\',22,4);">1Sa 22:4</a>; <a onClick="return mV(\'1Sa\',24,22);">24:22</a>; <a onClick="return mV(\'2Sa\',5,17);">2Sa 5:17</a>; <a onClick="return mV(\'2Sa\',23,14);">23:14</a>; <a onClick="return mV(\'1Ch\',11,16);">1Ch 11:16</a>; <a onClick="return mV(\'1Ch\',12,16);">12:16</a>). See <a href="study/isbe/search.html?string=FORTIFICATION">FORTIFICATION</a>. In <a onClick="return mV(\'Rev\',18,2);">Re 18:2</a> for the King James Version "cage" (phulake) the Revised Version (British and American) substitutes, as in first clause, "hold," and in the margin "prison."``1';
isbe[4391]='Holding`hol\'-ding: Occurs with various shades of meaning:<P>(1) as the translation of tamakh, "to acquire," it has the sense of taking, obtaining (<a onClick="return mV(\'Isa\',33,15);">Isa 33:15</a>, the Revised Version (British and American) "that shaketh his hands from taking a bribe," the English Revised Version, as the King James Version, "holding");<P>(2) of kul, "to hold," "contain," having the sense of containing or restraining (<a onClick="return mV(\'Jer\',6,11);">Jer 6:11</a>, "I am weary with holding in");<P>(3) of krateo, "to receive," "observe," "maintain" (<a onClick="return mV(\'Mar\',7,3);">Mr 7:3</a>, "holding the tradition of the elders"; <a onClick="return mV(\'1Ti\',1,19);">1Ti 1:19</a>, echo, "holding faith and a good conscience"; <a onClick="return mV(\'1Ti\',3,9);">1Ti 3:9</a>, "holding the mystery of the faith in a pure conscience");<P>(4) holding fast, cleaving to, krateo (<a onClick="return mV(\'Col\',2,19);">Col 2:19</a>, "not holding the head," the Revised Version (British and American) "holding fast"; compare <a onClick="return mV(\'Act\',3,11);">Ac 3:11</a>; <a onClick="return mV(\'Rev\',7,1);">Re 7:1</a>, "holding the four winds of the earth, that no wind should blow"); antechomai, "to hold over against one\'s self," "to hold fast" (<a onClick="return mV(\'Tts\',1,9);">Tit 1:9</a>, the Revised Version (British and American) "holding to the faithful word");<P>(5) holding forth, epecho, "to hold upon, to hold out toward" (<a onClick="return mV(\'Phl\',2,16);">Php 2:16</a>, "holding forth the word of life," so the Revised Version (British and American)); Lightfoot has "holding out" (as offering); others, however, render "holding fast," persevering in the Christian faith and life—connecting with being "blameless and harmless" in <a onClick="return mV(\'Phl\',2,15);">Php 2:15</a>.``185';
isbe[4392]='Holiness`ho\'-li-nes (qadhosh, "holy," qodhesh, "holiness"; hagios, "holy"):<P><b>I. IN THE OLD TESTAMENT MEANING OF THE TERM</b><P>1. The Holiness of God<P class="in15">(1) Absoluteness and Majesty<P class="in15">(2) Ethical Holiness<P>2. Holiness of Place, Time and Object<P>3. Holiness of Men<P class="in15">(1) Ceremonial<P class="in15">(2) Ethical and Spiritual<P><b>II. IN THE NEW TESTAMENT: THE CHRISTIAN CONCEPTION</b><P>1. Applied to God<P>2. Applied To Christ<P>3. Applied To Things<P>4. Applied To Christians<P class="in15">(1) As Separate from the World<P class="in15">(2) As Bound to the Pursuit of an Ethical Ideal<hr /><P>I. In the Old Testament Meaning of the Term.<P>There has been much discussion as to the original meaning of the Semitic root Q-D-SH, by which the notion of holiness is expressed in the Old Testament. Some would connect it with an Assyrian word denoting purity, clearness; most modern scholars incline to the view that the primary idea is that of cutting off or separation. Etymology gives no sure verdict on the point, but the idea of separation lends itself best to the various senses in which the word "holiness" is employed. In primitive Semitic usage "holiness" seems to have expressed nothing more than that ceremonial separation of an object from common use which the modern study of savage religions has rendered familiar under the name of taboo (W.R. Smith, Religion of the Semites, Lect iv). But within the Biblical sphere, with which alone we are immediately concerned, holiness attaches itself first of all, not to visible objects, but to the invisible Yahweh, and to places, seasons, things and human beings only in so far as they are associated with Him. And while the idea of ceremonial holiness runs through the Old Testament, the ethical significance which Christianity attributes to the term is never wholly absent, and gradually rises in the course of the revelation into more emphatic prominence.<P>1. The Holiness of God:<P>As applied to God the notion of holiness is used in the Old Testament in two distinct senses:<P>(1) Absoluteness and Majesty<P>First in the more general sense of separation from all that is human and earthly. It thus denotes the absoluteness, majesty, and awfulness of the Creator in His distinction from the creature. In this use of the word, "holiness" is little more than an equivalent general term for "Godhead," and the adjective "holy" is almost synonymous with "Divine" (compare <a onClick="return mV(\'Dan\',4,8,9,18);">Da 4:8-9, 18</a>; <a onClick="return mV(\'Dan\',5,11);">5:11</a>). Yahweh\'s "holy arm" (<a onClick="return mV(\'Isa\',52,10);">Isa 52:10</a>; <a onClick="return mV(\'Psa\',98,1);">Ps 98:1</a>) is His Divine arm, and His "holy name" (<a onClick="return mV(\'Lev\',20,3);">Le 20:3</a>, etc.) is His Divine name. When Hannah sings "There is none holy as Yahweh" (<a onClick="return mV(\'1Sa\',2,2);">1Sa 2:2</a>), the rest of the verse suggests that she is referring, not to His ethical holiness, but simply to His supreme Divinity.<P>(2) Ethical Holiness<P>But, in the next place, holiness of character in the distinct ethical sense is ascribed to God. The injunction, "Be ye holy; for I am holy" (<a onClick="return mV(\'Lev\',11,44);">Le 11:44</a>; <a onClick="return mV(\'Lev\',19,2);">19:2</a>), plainly implies an ethical conception. Men cannot resemble God in His incommunicable attributes. They can reflect His likeness only along the lines of those moral qualities of righteousness and love in which true holiness consists. In the Psalmists and Prophets the Divine holiness becomes, above all, an ethical reality convicting men of sin (<a onClick="return mV(\'Isa\',6,3,5);">Isa 6:3, 5</a>) and demanding of those who would stand in His presence clean hands and a pure heart (<a onClick="return mV(\'Psa\',24,3);">Ps 24:3</a>f).<P>2. Holiness of Place, Time and Object:<P>From the holiness of God is derived that ceremonial holiness of things which is characteristic of the Old Testament religion. Whatever is connected with the worship of the holy Yahweh is itself holy. Nothing is holy in itself, but anything becomes holy by its consecration to Him. A place where He manifests His presence is holy ground (<a onClick="return mV(\'Exd\',3,5);">Ex 3:5</a>). The tabernacle or temple in which His glory is revealed is a holy building (<a onClick="return mV(\'Exd\',28,29);">Ex 28:29</a>; <a onClick="return mV(\'2Ch\',35,5);">2Ch 35:5</a>); and all its sacrifices (<a onClick="return mV(\'Exd\',29,33);">Ex 29:33</a>), ceremonial materials (<a onClick="return mV(\'Exd\',30,25);">30:25</A>; <a onClick="return mV(\'Num\',5,17);">Nu 5:17</a>) and utensils (<a onClick="return mV(\'1Ki\',8,4);">1Ki 8:4</a>) are also holy. The Sabbath is holy because it is the Sabbath of the Lord (<a onClick="return mV(\'Exd\',20,\'8-11\');">Ex 20:8-11</a>). "Holiness, in short, expresses a relation, which consists negatively in separation from common use, and positively in dedication to the service of Yahweh" (Skinner in HDB, II, 395).<P>3. Holiness of Men:<P>The holiness of men is of two kinds:<P>(1) Ceremonial<P>A ceremonial holiness, corresponding to that of impersonal objects and depending upon their relation to the outward service of Yahweh. Priests and Levites are holy because they have been "hallowed" or "sanctified" by acts of consecration (<a onClick="return mV(\'Exd\',29,1);">Ex 29:1</a>; <a onClick="return mV(\'Lev\',8,12,30);">Le 8:12, 30</a>). The Nazirite is holy because he has separated himself unto the Lord (<a onClick="return mV(\'Num\',6,5);">Nu 6:5</a>). Above all, Israel, notwithstanding all its sins and shortcomings, is holy, as a nation separated from other nations for Divine purposes and uses (<a onClick="return mV(\'Exd\',19,6);">Ex 19:6</a>, etc.; compare <a onClick="return mV(\'Lev\',20,24);">Le 20:24</a>).<P>(2) Ethical and Spiritual<P>But out of this merely ceremonial holiness there emerges a higher holiness that is spiritual and ethical. For unlike other creatures man was made in the image of God and capable of reflecting the Divine likeness. And as God reveals Himself as ethically holy, He calls man to a holiness resembling His own (<a onClick="return mV(\'Lev\',19,2);">Le 19:2</a>). In the so-called "Law of Holiness" (<a onClick="return mV(\'Lev\',17,\'1-\');">Le 17:1-26:46</a>), God\'s demand for moral holiness is made clear; and yet the moral contents of the Law are still intermingled with ceremonial elements (<a onClick="return mV(\'Lev\',17,10);">Le 17:10</a>ff; <a onClick="return mV(\'Lev\',19,19);">19:19</A>; <a onClick="return mV(\'Lev\',21,1);">21:1</A>). In psalm and prophecy, however, a purely ethical conception comes into view—the conception of a human holiness which rests upon righteousness and truth (<a onClick="return mV(\'Psa\',15,1);">Ps 15:1</a>f) and the possession of a contrite and humble spirit (<a onClick="return mV(\'Isa\',57,15);">Isa 57:15</a>). This corresponds to the knowledge of a God who, being Himself ethically holy, esteems justice, mercy and lowly piety more highly than sacrifice (<a onClick="return mV(\'Hsa\',6,6);">Ho 6:6</a>; <a onClick="return mV(\'Mic\',6,\'6-8\');">Mic 6:6-8</a>).<P>II. In the New Testament: The Christian Conception.<P>The idea of holiness is expressed here chiefly by the word hagios and its derivatives, which correspond very closely to the words of the Q-D-SH group in Hebrew, and are employed to render them in the Septuagint. The distinctive feature of the New Testament idea of holiness is that the external aspect of it has almost entirely disappeared, and the ethical meaning has become supreme. The ceremonial idea still exists in contemporary Judaism, and is typically represented by the Pharisees (<a onClick="return mV(\'Mar\',7,\'1-13\');">Mr 7:1-13</a>; <a onClick="return mV(\'Luk\',18,11);">Lu 18:11</a>f). But Jesus proclaimed a new view of religion and morality according to which men are cleansed or defiled, not by anything outward, but by the thoughts of their hearts (<a onClick="return mV(\'Mat\',15,\'17-20\');">Mt 15:17-20</a>), and God is to be worshipped neither in Samaria nor Jerusalem, but wherever men seek Him in spirit and in truth (<a onClick="return mV(\'Jhn\',4,\'21-24\');">Joh 4:21-24</a>).<P>1. Applied to God:<P>In the New Testament the term "holy" is seldom applied to God, and except in quotations from the Old Testament (<a onClick="return mV(\'Luk\',1,49);">Lu 1:49</a>; <a onClick="return mV(\'1Pe\',1,15);">1Pe 1:15</a>f), only in the Johannine writings (<a onClick="return mV(\'Jhn\',17,11);">Joh 17:11</a>; <a onClick="return mV(\'Rev\',4,8);">Re 4:8</a>; <a onClick="return mV(\'Rev\',6,10);">6:10</a>). But it is constantly used of the Spirit of God (<a onClick="return mV(\'Mat\',1,18);">Mt 1:18</a>; <a onClick="return mV(\'Act\',1,2);">Ac 1:2</a>; <a onClick="return mV(\'Rom\',5,5);">Ro 5:5</a>, etc.), who now, in contrast with Old Testament usage, becomes specifically the Holy Spirit or Holy Ghost.<P>2. Applied to Christ:<P>In several passages the term is applied to Christ (<a onClick="return mV(\'Mar\',1,24);">Mr 1:24</a>; <a onClick="return mV(\'Act\',3,14);">Ac 3:14</a>; <a onClick="return mV(\'Act\',4,30);">4:30</a>, etc.), as being the very type of ethical perfection (compare <a onClick="return mV(\'Hbr\',7,26);">Heb 7:26</a>).<P>3. Applied to Things:<P>In keeping with the fact that things are holy in a derivative sense through their relationship to God, the word is used of Jerusalem (<a onClick="return mV(\'Mat\',4,5);">Mt 4:5</a>), the Old Testament covenant (<a onClick="return mV(\'Luk\',1,72);">Lu 1:72</a>), the Scriptures (<a onClick="return mV(\'Rom\',1,2);">Ro 1:2</a>), the Law (<a onClick="return mV(\'Rom\',7,12);">Ro 7:12</a>), the Mount of Transfiguration (<a onClick="return mV(\'2Pe\',1,18);">2Pe 1:18</a>), etc.<P>4. Applied to Christians:<P>But it is especially in its application to Christians that the idea of holiness meets us in the New Testament in a sense that is characteristic and distinctive. Christ\'s people are regularly called "saints" or holy persons, and holiness in the high ethical and spiritual meaning of the word is used to denote the appropriate quality of their life and conduct.<P>(1) As Separate from the World<P>No doubt, as applied to believers, "saints" conveys in the first place the notion of a separation from the world and a consecration to God. Just as Israel under the old covenant was a chosen race, so the Christian church in succeeding to Israel\'s privileges becomes a holy nation (<a onClick="return mV(\'1Pe\',2,9);">1Pe 2:9</a>), and the Christian individual, as one of the elect people, becomes a holy man or woman (<a onClick="return mV(\'Col\',3,12);">Col 3:12</a>). In Paul\'s usage all baptized persons are "saints," however far they may still be from the saintly character (compare <a onClick="return mV(\'1Cr\',1,2,14);">1Co 1:2, 14</a> with <a onClick="return mV(\'1Cr\',5,1);">5:1</A>ff).<P>(2) As Bound to the Pursuit of an Ethical Ideal<P>But though the use of the name does not imply high ethical character as a realized fact, it always assumes it as an ideal and an obligation. It is taken for granted that the Holy Spirit has taken up His abode in the heart of every regenerate person, and that a work of positive sanctification is going on there. The New Testament leaves no room for the thought of a holiness divorced from those moral qualities which the holy God demands of those whom He has called to be His people.<P>LITERATURE.<P>Robertson Smith, Religion of the Semites, Lects. iii, iv; A. B. Davidson, Theology of the Old Testament, 145ff; Schultz, Theology of the Old Testament, II, 167ff; Orr, Sin as a Problem of Today, chapter iii; Sanday-Headlam, Romans, 12ff; articles "Holiness" in HDB and "Heiligkeit Gottes im AT" in RE.`<a href="./study/isbe/search.html?string=SANCTIFICATION">SANCTIFICATION</a>`94';
isbe[4393]='Hollow`hol\'-o (kaph, nabhabh): "Hollow" is the translation of kaph, "hollow" (<a onClick="return mV(\'Gen\',32,25,32);">Ge 32:25, 32</a>, "the hollow of his thigh," the hip-pan or socket, over the sciatic nerve); of nabhabh, "to be hollow" (<a onClick="return mV(\'Exd\',27,8);">Ex 27:8</a>; <a onClick="return mV(\'Exd\',38,7);">38:7</a>; <a onClick="return mV(\'Jer\',52,21);">Jer 52:21</a>); of sho\'-al, "hollow" (<a onClick="return mV(\'Isa\',40,12);">Isa 40:12</a>, "Who hath measured the waters in the hollow of his hand?" (in handfuls; compare <a onClick="return mV(\'1Ki\',20,10);">1Ki 20:10</a>; <a onClick="return mV(\'Eze\',13,19);">Eze 13:19</a>)); of makhtesh, "a mortar," "socket of a tooth" (from its shape) (<a onClick="return mV(\'Jdg\',15,19);">Jud 15:19</a>, "God clave an (the Revised Version (British and American) "the") hollow place that is in Lehi"); of sheqa\'aruroth, probably from qa\'ar, "to sink" (<a onClick="return mV(\'Lev\',14,37);">Le 14:37</a>, "the walls of the house with hollow strakes," so the English Revised Version, the American Standard Revised Version "hollow streaks," depressions); of koilotes (The <span class="noTag">Wisdom of Solomon 17:19</span>, "the hollow mountains," the Revised Version (British and American) "hollows of the mountains"); of koiloma (2Macc 1:19, "hollow place of a pit," the Revised Version (British and American) "hollow of a well"); of antrodes (2Macc 2:5, "a hollow cave," the Revised Version (British and American) "a chamber in the rock," margin (Greek) "a cavernous chamber").``185';
isbe[4394]='Holm-Tree`hom\'-tre:<P>(1) tirzah (<a onClick="return mV(\'Isa\',44,14);">Isa 44:14</a>, the King James Version "cypress"): The name, from the root meaning (compare Arabic taraza) "to be hard," implies some very hard wood. Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) has ilex, which is Latin for holm oak, so named from its holly-like leaves (hollen in Old English = "holly"); this translation has now been adopted, but it is doubtful.<P>(2) prinos, Susanna verse 58. This is the ilex or holm oak. There is a play on the words prinos and prisai (literally, "saw") in verses 58 and 59 (see <a href="study/isbe/search.html?string=SUSANNA">SUSANNA</A>). The evergreen or holm oak is represented by two species in Palestine, Quercus ilex and Q. coccifera. The leaf of both species is somewhat like a small holly leaf, is glossy green and usually spiny. The Q. ilex is insignificant, but Q. coccifera is a magnificent tree growing to a height of 40 ft. or more, and often found in Palestine flourishing near sacred tombs, and itself not infrequently the object of superstitious veneration.``117';
isbe[4395]='Holofernes`hol-o-fur\'-nez (Olophernes): According to the Book of Judith, chief captain of Nebuchadnezzar, king of the Assyrians (Judith 2:4), who was commissioned to make war upon the west country and to receive from the inhabitants the usual tokens of complete submission, earth and water. The object of the expedition of Holofernes, who thus became the typical persecutor of the Jews, was to compel men everywhere to worship Nebuchadnezzar. He was slain by Judith, the heroine of the book of that name, during the siege of Bethulia. There is no notice of Holofernes except in the Book of Judith. The termination of the word would seem to indicate a Persian origin for the name. The Holofernes of Shakespeare and Rabelais is in no way connected with the deeds of the Holofernes of the Apocrypha.``79';
isbe[4396]='Holon`ho\'-lon (cholon or chowlon):<P>(1) One of the towns in the hill country of Judah (<a onClick="return mV(\'Jos\',15,51);">Jos 15:51</a>) assigned to the Levites <a onClick="return mV(\'Jos\',21,15);">21:15</a>). In <a onClick="return mV(\'1Ch\',6,58);">1Ch 6:58 (Hebrew 43)</a>, it is <a href="study/isbe/search.html?string=HILEN">HILEN</A> (which see). The site may be the important ruins of Beit\'alam (see PEF, III, 313,321, Sh XXI).<P>(2) Probably once an important town in the "plain," i.e. plateau, of Moab (<a onClick="return mV(\'Jer\',48,21);">Jer 48:21</a>); the site is unknown.``1';

isbe[4398]='Holy Ghost (Spirit), Sin Against the``<a href="./study/isbe/search.html?string=BLASPHEMY">BLASPHEMY</a>; <a href="./study/isbe/search.html?string=HOLY+SPIRIT,+2">HOLY SPIRIT</a>`1';
isbe[4399]='Holy of Holies`ho\'-liz (qodhesh ha-qodhashim, <a onClick="return mV(\'Exd\',26,33);">Ex 26:33</a>, debhir, <a onClick="return mV(\'1Ki\',6,16);">1Ki 6:16</a>, etc.; in the New Testament, hagia hagion, <a onClick="return mV(\'Hbr\',9,3);">Heb 9:3</a>): The name given to the innermost shrine, or adytum of the sanctuary of Yahweh.<P>1. In the Tabernacle:<P>The most holy place of the tabernacle in the wilderness (<a onClick="return mV(\'Exd\',26,\'31-33\');">Ex 26:31-33</a>) was a small cube of 10 cubits (15 ft.) every way. It was divided from the holy Ceiled by curtains which bore cherubic figures embroidered in blue and purple and scarlet (<a onClick="return mV(\'Exd\',26,1);">Ex 26:1</a>), it contained no furniture but the Ark of the Covenant, covered by a slab of gold called the <a href="study/isbe/search.html?string=MERCY-SEAT">MERCY-SEAT</a> (which see), and having within it only the two stone tables of the Law (see <a href="study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>; <a href="study/isbe/search.html?string=ARK+OF+THE+COVENANT">ARK OF THE COVENANT</a>). Only the high priest, and he but once a year, on the great <a href="study/isbe/search.html?string=ATONEMENT,+DAY+OF">DAY OF ATONEMENT</A> clothed in penitential garments, amid a cloud of incense, and with blood of sacrifice (<a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>; compare <a onClick="return mV(\'Hbr\',9,7);">Heb 9:7</a>).<P>2. In the Temple of Solomon:<P>The proportions of the most holy place in the first temple were the same as in the tabernacle, but the dimensions were doubled. The sacred chamber was enlarged to 20 cubits (30 ft.) each way. We now meet with the word debhir, "oracle" (<a onClick="return mV(\'1Ki\',6,16);">1Ki 6:16</a>, etc.), which with the exception of <a onClick="return mV(\'Psa\',28,2);">Ps 28:2</a>, belonging perhaps to the same age, is met with in Scripture only in the period of Solomon\'s reign. This sanctum, like its predecessor, contained but one piece of furniture—the Ark of the Covenant. It had, however, one new conspicuous feature in the two large figures of cherubim of olive wood, covered with gold, with wings stretching from wall to wall, beneath which the ark was now placed (<a onClick="return mV(\'1Ki\',6,\'23-28\');">1Ki 6:23-28</a>; <a onClick="return mV(\'2Ch\',3,\'10-13\');">2Ch 3:10-13</a>; see <a href="study/isbe/search.html?string=TEMPLE">TEMPLE</A>).<P>3. In Later Times:<P>In Ezekiel\'s temple plans, which in many things may have been those of the temple of Zerubbabel, the prophet gives 20 cubits as the length and breadth of the most holy place, showing that these figures were regarded as too sacred to undergo change (<a onClick="return mV(\'Eze\',41,4);">Eze 41:4</a>). There was then no Ark of the Covenant, but Jewish tradition relates that the blood of the great Day of Atonement was sprinkled on an unhewn stone that stood in its place. In Herod\'s temple, the dimensions of the two holy chambers remained the same—at least in length and breadth (see <a href="study/isbe/search.html?string=TEMPLE,+HEROD\'S">TEMPLE, HEROD\'S</a>). The holiest place continued empty. In the spoils of the temple depicted on the Arch of Titus there is no representation of the Ark of the Covenant; only of the furniture of the outer chamber or holy place.<P>4. Figurative:<P>In the Epistle to the Hebrews we are taught that the true holy of holies is the heaven into which Jesus has now entered to appear in virtue of His own sacrifice in the presence of God for us (<a onClick="return mV(\'Hbr\',9,11);">Heb 9:11</a>). Restriction is now removed, and the way into the holiest is made open for all His people (<a onClick="return mV(\'Hbr\',10,19,20);">Heb 10:19-20</a>).``17';
