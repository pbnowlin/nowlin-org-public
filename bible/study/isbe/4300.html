isbe[4301]='Heritage`her\'-i-taj (nachalah, from nachal, "to give"; kleroo): That which is allotted, possession, property, portion, share, peculiar right, inheritance; applied to land transferred from the Canaanites to Israel (<a onClick="return mV(\'Psa\',11,6);">Ps 11:6</a>; <a onClick="return mV(\'Psa\',136,22);">136:22</a>); to Israel, as the heritage of Yahweh (<a onClick="return mV(\'Joe\',3,2);">Joe 3:2</a>, etc.). In the New Testament (<a onClick="return mV(\'Eph\',1,11);">Eph 1:11</a>) applied to believers, the spiritual Israel, as God\'s peculiar possession (Ellicott, Eadie).``1';
isbe[4302]='Hermas`hur\'-mas (Hermas): An abbreviated form of several names, e.g. Hermagoras, Hermeros, Hermodorus, Hermogenes, etc.; the name of a Roman Christian to whom Paul sent greetings (<a onClick="return mV(\'Rom\',16,14);">Ro 16:14</a>). Origen and some later writers have identified him with the author of The Pastor of Hermas, but without sufficient reason. According to the Canon of Muratori, the author of The Pastor wrote when his brother Pius was bishop of Rome (140-55 AD). He speaks of himself, however, as a contemporary of Clement of Rome (chapter 4) (circa 100 AD). The name Hermas is very common, and Origen\'s identification is purely conjectural.``78';
isbe[4303]='Hermeneutics`hur-me-nu\'-tiks.`<a href="./study/isbe/search.html?string=INTERPRETATION">INTERPRETATION</a>`1';
isbe[4304]='Hermes (1)`hur\'-mez (Hermes): In the Revised Version margin of <a onClick="return mV(\'Act\',14,12);">Ac 14:12</a> for "Mercury" in text (the King James Version "Mercurius").``1';
isbe[4305]='Hermes (2)`(Hermes): The name of a Roman Christian, otherwise unknown, to whom Paul sent greetings (<a onClick="return mV(\'Rom\',16,14);">Ro 16:14</a>). "Hermes is among the commonest slave names. In the household alone probably not less than a score of persons might be counted up from the inscriptions, who bore this name at or about the time when Paul wrote" (Lightfoot, Philippians, 176).``1';
isbe[4306]='Hermogenes`her-moj\'-e-nez (Hermogenes, literally "born of Hermes," a Greek deity, called by the Romans, "Mercury," <a onClick="return mV(\'2Ti\',1,15);">2Ti 1:15</a>):<P>1. Where Did He "Turn Away"?:<P>Hermogenes was a Christian, mentioned by Paul as having, along with Phygellus and "all that are in Asia," turned away from him. It is not clear when or where the defection of those Asiatic Christians from the apostle took place, whether it was at Rome at the time of Paul\'s second imprisonment there, and especially on the occasion of his being brought before the emperor\'s supreme court, to be tried on a charge now involving the death penalty, or whether it was at some previous time in Ephesus.<P>2. Was It in Ephesus?:<P>If it was the latter, then the meaning is that Paul wishes to inform Timothy, or perhaps only to remind him, how in Ephesus, where Timothy was the presiding minister of the church, these persons, Phygellus and Hermogenes with many more, had turned away from him, that is, had refused to submit to his authority, and had rejected the Christian doctrine which he taught. This latter meaning, referring the "turning away" to some previous occasion in Ephesus, is thought by some expositors to be the probable signification, owing to the fact that the verb "they be turned away" is in the aorist tense, referring to a time long past when the apostle wrote.<P>3. Unlikelihood of It Being in Ephesus:<P>On the other hand there is no evidence that there ever was a time when "all they which are in Asia" (the King James Version) turned away from obedience to Paul. Whatever may have been the disloyalty and disobedience of individuals—and this certainly existed; see, e.g., <a onClick="return mV(\'Act\',20,29);">Ac 20:29</a>f—yet, certainly the New Testament does not show that all that were in Asia, the Christian community as a whole, in Ephesus and Miletus and Laodicea and Hierapolis and Colosse and other places, repudiated his apostolic authority.<P>4. Probalility of It Being in Rome:<P>If the words "all they which are in Asia" refer to all the Christians from the proconsular province of Asia, who happened to be in Rome at the time of Paul\'s second imprisonment there, it can easily be understood that they should turn away from him at that testing time. It is impossible to say exactly what form their desertion of the apostle assumed. Their turning away would likely be caused by fear, lest if it were known that they were friends of the prisoner in the Mamertine, they would be involved in the same imprisonment as had overtaken him, and probably also in the same death penalty.<P>It is altogether in favor of a reference to Rome, that what is said about Phygellus and Hermogenes and their turning away from Paul is immediately followed by a reference to Onesiphorus, and to the great kindness which he showed, when he sought the apostle but very diligently in Rome. On the whole, therefore, a reference to Rome and to the manner in which these persons, named and unnamed, from Asia, had deserted Paul, seems most probable.`<a href="./study/isbe/search.html?string=PHYGELLUS">PHYGELLUS</a>`155';
isbe[4307]='Hermon`hur\'-mon (chermon; Codex Vaticanus, Haermon):<P>1. Description:<P>The name of the majestic mountain in which the Anti-Lebanon range terminates to the south (<a onClick="return mV(\'Deu\',3,8);">De 3:8</a>, etc.). It reaches a height of 9,200 ft. above the sea, and extends some 16 to 20 miles from north to south. It was called Sirion by the Sidonians (<a onClick="return mV(\'Deu\',3,9);">De 3:9</a>; compare <a onClick="return mV(\'Psa\',29,6);">Ps 29:6</a>), and Senir by the Amorites (<a onClick="return mV(\'Deu\',3,9);">De 3:9</a>). It is also identified with Sion (<a onClick="return mV(\'Deu\',4,48);">De 4:48</a>). See <a href="study/isbe/search.html?string=SIRION">SIRION</A>; <a href="study/isbe/search.html?string=SENIR">SENIR</a>; <a href="study/isbe/search.html?string=SION">SION</A>. Sometimes it is called "Mt. Hermon" (<a onClick="return mV(\'Deu\',3,8);">De 3:8</a>; <a onClick="return mV(\'Jos\',11,17);">Jos 11:17</a>; <a onClick="return mV(\'1Ch\',5,23);">1Ch 5:23</a>, etc.); at other times simply "Hermon" (<a onClick="return mV(\'Jos\',11,3);">Jos 11:3</a>; <a onClick="return mV(\'Psa\',89,12);">Ps 89:12</a>, etc.).<P>2. The Hermons:<P>Once it is called "Hermons" (chermonim). the King James Version mistakenly renders this "the Hermonites" (<a onClick="return mV(\'Psa\',42,6);">Ps 42:6</a>). It must be a reference to the triple summits of the mountain. There are three distinct heads, rising near the middle of the mass, the two higher being toward the east. The eastern declivities are steep and bare; the western slopes are more gradual; and while the upper reaches are barren, the lower are well wooded; and as one descends he passes through fruitful vineyards and orchards, finally entering the rich fields below, in Wady etteim. The Aleppo pine, the oak, and the poplar are plentiful. The wolf and the leopard are still to be found on the mountain; and it is the last resort of the brown, or Syrian, bear. Snow lies long on the summits and shoulders of the mountain; and in some of the deeper hollows, especially to the north, it may be seen through most of the year.<P>Mt. Hermon is the source of many blessings to the land over which it so proudly lifts its splendid form. Refreshing breezes blow from its cold heights. Its snows are carried to Damascus and to the towns on the seaboard, where, mingled with the sharab, "drink," they mitigate the heat of the Syrian summer. Great reservoirs in the depths of the mountain, fed by the melting snows, find outlet in the magnificent springs at Chasbeiyeh, Tell el-Kady, and Banias, while the dew-clouds of Hermon bring a benediction wherever they are carried (<a onClick="return mV(\'Psa\',133,3);">Ps 133:3</a>).<P>3. Sanctuaries:<P>Hermon marked the northern limit of Joshua\'s victorious campaigns (<a onClick="return mV(\'Jos\',12,1);">Jos 12:1</a>, etc.). It was part, of the dominion of Og (<a onClick="return mV(\'Jos\',12,5);">Jos 12:5</a>), and with the fall of that monarch, it would naturally come under Israelite influence. Its remote and solitary heights must have attracted worshippers from the earliest times; and we cannot doubt that it was a famous sanctuary in far antiquity. Under the highest peak are the ruins of Kacr \'Antar, which may have been an ancient sanctuary of Baal. Eusebius, Onomasticon, speaks of a temple on the summit much frequented by the surrounding peoples; and the remains of many temples of the Roman period have been found on the sides and at the base of the mountain. The sacredness of Hermon may be inferred from the allusion in <a onClick="return mV(\'Psa\',89,12);">Ps 89:12</a> (compare Enoch 6:6; and see also <a href="study/isbe/search.html?string=BAAL-HERMON">BAAL-HERMON</A>).<P>Some have thought that the scene of the Transfiguration should be sought here; see, however, <a href="study/isbe/search.html?string=TRANSFIGURATION,+MOUNT+OF">TRANSFIGURATION, MOUNT OF</A>.<P>The modern name of Hermon is Jebel eth-thilj, "mount of snow," or Jebel esh-sheikh, "mount of the elder," or "of the chief."<P>Little Hermon, the name now often applied to the hill between Tabor and Gilboa, possibly the Hill of Moreh, on which is the sanctuary of Neby Dahy, has no Biblical authority, and dates only from the Middle Ages.``54';
isbe[4308]='Hermonites`hur\'-mon-its: In <a onClick="return mV(\'Psa\',42,6);">Ps 42:6</a> the King James Version, where the Revised Version (British and American) reads "Hermons."`<a href="./study/isbe/search.html?string=HERMON">HERMON</a>`1';
isbe[4309]='Herod`her\'-ud: The name Herod (Herodes) is a familiar one in the history of the Jews and of the early Christian church. The name itself signifies "heroic," a name not wholly applicable to the family, which was characterized by craft and knavery rather than by heroism. The fortunes of the Herodiam family are inseparably connected with the last flickerings of the flame of Judaism, as a national power, before it was forever extinguished in the great Jewish war of rebellion, 70 AD. The history of the Herodian family is not lacking in elements of greatness, but whatever these elements were and in whomsoever found, they were in every ease dimmed by the insufferable egotism which disfigured the family, root and branch. Some of the Herodian princes were undeniably talented; but these talents, wrongly used, left no marks for the good of the people of Israel. Of nearly all the kings of the house of Herod it may truly be said that at their death "they went without being desired," unmissed, unmourned. The entire family history is one of incessant brawls, suspicion, intrigue arid shocking immorality. In the baleful and waning light of the rule of the Herodians, Christ lived and died, and under it the foundations of the Christian church were laid.<a onClick="return mV(\'1Cr\',11,19);">1Co 11:19</a> m; <a onClick="return mV(\'Gal\',5,20);">Ga 5:20</a> margin, where it is shown to interfere with that unity of faith and community of interests that belong to Christians. There being but one standard of truth, and one goal for all Christian life, any arbitrary choice varying from what was common to all believers, becomes an inconsistency and a sin to be warned against. Ellicott, on <a onClick="return mV(\'Gal\',5,20);">Ga 5:20</a>, correctly defines "heresies" (King James Version, the English Revised Version) as "a more aggravated form of dichostasia" (the American Standard Revised Version "parties") "when the divisions have developed into distinct and organized parties"; so also <a onClick="return mV(\'1Cr\',11,19);">1Co 11:19</a>, translated by the Revised Version (British and American) "factions." In <a onClick="return mV(\'2Pe\',2,1);">2Pe 2:1</a>, the transition toward the subsequent ecclesiastical sense can be traced. The "destructive heresies" (Revised Version margin, the English Revised Version margin "sects of perdition") are those guilty of errors both of doctrine and of life very fully described throughout the entire chapter, and who, in such course, separated themselves from the fellowship of the church.<P>1. The Family Descent:<P>The Herodians were not of Jewish stock. Herod the Great encouraged the circulation of the legend of the family descent from an illustrious Babylonian Jew (Ant., XIV, i, 3), but it has no historic basis. It is true the Idumeans were at that time nominal Jews, since they were subdued by John Hyrcanus in 125 BC, and embodied in the Asmonean kingdom through an enforced circumcision, but the old national antagonism remained (<a onClick="return mV(\'Gen\',27,41);">Ge 27:41</a>). The Herodian family sprang from Antipas (died 78 BC), who was appointed governor of Idumaea by Alexander Janneus. His son Antipater, who succeeded him, possessed al the cunning, resourcefulness and unbridled ambition of his son Herod the Great. He had an open eye for two things—the unconquerable strength of the Roman power and the pitiable weakness of the decadent Asmonean house, and on these two factors he built the house of his hopes. He craftily chose the side of Hyrcanus II in his internecine war with Aristobulus his brother (69 BC), and induced him to seek the aid of the Romans. Together they supported the claims of Pompey and, after the latter\'s defeat, they availed themselves of the magnanimity of Caesar to submit to him, after the crushing defeat of Pompey at Pharsalus (48 BC). As a reward, Antipater received the procuratorship of Judea (47 BC), while his innocent dupe Hyrcanus had to satisfy himself with the high-priesthood. Antipater died by the hand of an assassin (43 BC) and left four sons, Phasael, Herod the Great, Joseph, Pheroras, and a daughter Salome. The second of these sons raised the family to its highest pinnacle of power and glory. Pheroras was nominally his co-regent ann, possessed of his father\'s cunning, maintained himself to the end, surviving his cruel brother, but he cuts a small figure in the family history. He, as well as his sister Salome, proved an endless source of trouble to Herod by the endless family brawls which they occasioned.<P>2. Herod the Great:<P>With a different environment and with a different character, Herod the Great might have been worthy of the surname which he now bears only as a tribute of inane flattery. What we know of him, we owe, in the main, to the exhaustive treatment of the subject by Josephus in his Antiquities and Jewish War, and from Strabo and Dio Cassius among the classics. We may subsume our little sketch of Herod\'s life under the heads of (1) political activity, (2) evidences of talent, and (3) character and domestic life.<P>(1) Political Activity.<P>Antipater had great ambitions for his son. Herod was only a young man when he began his career as governor of Galilee. Josephus\' statement, however, that he was only "fifteen years old" (Ant., XIV, ix, 2) is evidently the mistake of some transcriber, because we are told (XVII, viii, 1) that "he continued his life till a very old age." That was 42 years later, so that Herod at this time must have been at least 25 years old. His activity and success in ridding his dominion of dangerous bands of freebooters, and his still greater success in raising the always welcome tribute-money for the Roman government, gained for him additional power at court. His advance became rapid. Antony appointed him "tetrarch" of Judea in 41 BC, and although he was forced by circumstances temporarily to leave his domain in the hands of the Parthians and of Antigonus, this, in the end, proved a blessing in disguise. In this final spasm of the dying Asmonean house, Antigonus took Jerusalem by storm, and Phasael, Herod\'s oldest brother, fell into his hands. The latter was governor of the city, and foreseeing his fate, he committed suicide by dashing out his brains against the walls of his prison. Antigonus incapacitated his brother Hyrcanus, who was captured at the same time, from ever holding the holy office again by cropping off his ears (Ant., XIV, xiii, 10). Meanwhile, Herod was at Rome, and through the favor of Antony and Augustus he obtained the crown of Judea in 37 BC. The fond ambition of his heart was now attained, although he had literally to carve out his own empire with the sword. He made quick work of the task, cut his way back into Judea and took Jerusalem by storm in 37 BC.<P>The first act of his reign was the extermination of the Asmonean house, to which Herod himself was related through his marriage with Mariamne, the grandchild of Hyrcanus. Antigonus was slain and with him 45 of his chief adherents. Hyrcanus was recalled from Babylon, to which he had been banished by Antigonus, but the high-priesthood was bestowed on Aristobulus, Herod\'s brother-in-law, who, however, soon fell a victim to the suspicion and fear of the king (Ant., XV, iii, 3). These outrages against the purest blood in Judea turned the love of Mariamne, once cherished for Herod, into a bitter hatred. The Jews, loyal to the dynasty of the Maccabees, accused Herod before the Roman court, but he was summarily acquitted by Antony. Hyrcanus, mutilated and helpless as he was, soon followed Aristobulus in the way of death, 31 BC (Ant., XV, vi, 1). When Antony, who had ever befriended Herod, was conquered by Augustus at Actium (31 BC), Herod quickly turned to the powers that were, and, by subtle flattery and timely support, won the imperial favor. The boundaries of his kingdom were now extended by Rome. And Herod proved equal to the greater task. By a decisive victory over the Arabians, he showed, as he had done in his earlier Galilean government, what manner of man he was, when aroused to action. The Arabians were wholly crushed, and submitted themselves unconditionally under the power of Herod (Ant., XV, v, 5). Afraid to leave a remnant of the Asmonean power alive, he sacrificed Mariamne his wife, the only human being he ever seems to have loved (28 BC), his mother-in-law Alexandra (Ant., XV, vii, 8), and ultimately, shortly before his death, even his own sons by Mariamne, Alexander and Aristobulus 7 BC (Ant., XVI, xi, 7). In his emulation of the habits and views of life of the Romans, he continually offended and defied his Jewish subjects, by the introduction of Roman sports and heathen temples in his dominion. His influence on the younger Jews in this regard was baneful, and slowly a distinct partly arose, partly political, partly religious, which called itself the Herodian party, Jews in outward religious forms but Gentiles in their dress and in their whole view of life. They were a bitter offense to the rest of the nation, but were associated with the Pharisees and Sadducees in their opposition to Christ (<a onClick="return mV(\'Mat\',22,16);">Mt 22:16</a>; <a onClick="return mV(\'Mar\',3,6);">Mr 3:6</a>; <a onClick="return mV(\'Mar\',12,13);">12:13</a>). In vain Herod tried to win over the Jews, by royal charity in time of famine, and by yielding, wherever possible, to their bitter prejudices. They saw in him only a usurper of the throne of David, maintained by the strong arm of the hated Roman oppressor. Innumerable plots were made against his life, but, with almost superhuman cunning, Herod defeated them all (Ant., XV, viii). He robbed his own people that he might give munificent gifts to the Romans; he did not even spare the grave of King David, which was held in almost idolatrous reverence by the people, but robbed it of its treasures (Ant., XVI, vii, 1). The last days of Herod were embittered by endless court intrigues and conspiracies, by an almost insane suspicion on the part of the aged king, and by increasing indications of the restlessness of the nation. Like Augustus himself, Herod was the victim of an incurable and loathsome disease. His temper became more irritable, as the malady made progress, and he made both himself and his court unutterably miserable. The picture drawn by Josephus (Ant., XVII) is lifelike and tragic in its vividness. In his last will and testament, he remained true to his life-long fawning upon the Roman power (Ant., XVII, vi, 1). So great became his suffering toward the last that he made a fruitless attempt at suicide. But, true to his character, one of the last acts of his life was an order to execute his son Antipater, who had instigated the murder of his halfbrothers, Alexander and Aristobulus, and another order to slay, after his death, a number of nobles, who were guilty of a small outbreak at Jerusalem and who were confined in the hippodrome (Ant., XVI, vi, 5). He died in the 37th year of his reign, 34 years after he had captured Jerusalem and slain Antigonus. Josephus writes this epitaph: "A man he was of great barbarity toward all men equally, and a slave to his passions, but above the consideration of what was right. Yet was he favored by fortune as much as any man ever was, for from a private man he became a king, and though he were encompassed by ten thousand dangers, he got clear of them all and continued his life to a very old age" (Ant., XVII, viii, 1).<P>(2) Evidences of Talent.<P>The life of Herod the Great was not a fortuitous chain of favorable accidents. He was unquestionably a man of talent. In a family like that of Antipus and Antipater, talent must necessarily be hereditary, and Herod inherited it more largely than any of his brothers. His whole life exhibits in no small degree statecraft, power of organization, shrewdness. He knew men and he knew how to use them. He won the warmest friendship of Roman emperors, and had a faculty of convincing the Romans of the righteousness of his cause, in every contingency. In his own dominions he was like Ishmael, his hand against all, and the hands of all against him, and yet he maintained himself in the government for a whole generation. His Galilean governorship showed what manner of man he was, a man with iron determination and great generalship. His Judean conquest proved the same thing, as did his Arabian war. Herod was a born leader of men. Under a different environment he might have developed into a truly great man, and had his character been coordinate with his gifts, he might have done great things for the Jewish people. But by far the greatest talent of Herod was his singular architectural taste and ability. Here he reminds one of the old Egyptian Pharaohs. Against the laws of Judaism, which he pretended to obey, he built at Jerusalem a magnificent theater and an amphitheater, of which the ruins remain. The one was within the city, the other outside the walls. Thus he introduced into the ascetic sphere of the Jewish life the frivolous spirit of the Greeks and the Romans. To offset this cruel infraction of all the maxims of orthodox Judaism, he tried to placate the nation by rebuilding the temple of Zerubbabel and making it more magnificent than even Solomon\'s temple had been. This work was accomplished somewhere between 19 BC and 11 or 9 BC, although the entire work was not finished till the procuratorship of Albinus, 62-64 AD (Ant., XV, xi,5,6; XX, ix, 7; <a onClick="return mV(\'Jhn\',2,20);">Joh 2:20</a>). It was so transcendently beautiful that it ranked among the world\'s wonders, and Josephus does not tire of describing its glories (BJ, V, v). Even Titus sought to spare the building in the final attack on the city (BJ, VI, iv, 3). Besides this, Herod rebuilt and beautified Struto\'s Tower, which he called after the emperor, Caesarea. He spent 12 years in this gigantic work, building a theater and amphitheater, and above all in achieving the apparently impossible by creating a harbor where there was none before. This was accomplished by constructing a gigantic mole far out into the sea, and so enduring was the work that the remains of it are seen today. The Romans were so appreciative of the work done by Herod that they made Caesarea the capital of the new regime, after the passing away of the Herodian power. Besides this, Herod rebuilt Samaria, to the utter disgust of the Jews, calling it Sebaste. In Jerusalem itself he built the three great towers, Antonia, Phasaelus and Mariamne, which survived even the catastrophe of the year 70 AD. All over Herod\'s dominion were found the evidences of this constructive passion. Antipatris was built by him, on the site of the ancient Kapharsaba, as well as the stronghold Phasaelus near Jericho, where he was destined to see so much suffering and ultimately to die. He even reached beyond his own domain to satisfy this building mania at Ascalon, Damascus, Tyre and Sidon, Tripoli, Ptolemais, nay even at Athens and Lacedaemon. But the universal character of these operations itself occasioned the bitterest hatred against him on the part of the narrowminded Jews.<P>(3) Characteristics and Domestic Life.<P>The personality of Herod was impressive, and he was possessed of great physical strength. His intellectual powers were far beyond the ordinary; his will was indomitable; he was possessed of great tact, when he saw fit to employ it; in the great crises of his life he was never at a loss what to do; and no one has ever accused Herod the Great of cowardice. There were in him two distinct individualities, as was the case with Nero. Two powers struggled in him for the mastery, and the lower one at last gained complete control. During the first part of his reign there were evidences of large-heartedness, of great possibilities in the man. But the bitter experiences of his life, the endless whisperings and warnings of his court, the irreconcilable spirit of the Jews, as well as the consciousness of his own wrongdoing, changed him into a Jewish Nero: a tyrant, who bathed his own house and his own people in blood. The demons of Herod\'s life were jealousy of power, and suspicion, its necessary companion.<P>He was the incarnation of brute lust, which in turn became the burden of the lives of his children. History tells of few more immoral families than the house of Herod, which by intermarriage of its members so entangled the genealogical tree as to make it a veritable puzzle. As these marriages were nearly all within the line of forbidden consanguinity, under the Jewish law, they still further embittered the people of Israel against the Herodian family. When Herod came to the throne of Judea, Phasael was dead. Joseph his younger brother had fallen in battle (Ant., XIV, xv, 10), and only Pheroras and Salome survived. The first, as we have seen, nominally shared the government with Herod, but was of little consequence and only proved a thorn in the king\'s flesh by his endless interference and plotting. To him were allotted the revenues of the East Jordanic territory. Salome, his sister, was ever neck-deep in the intrigues of the Herodian family, but had the cunning of a fox and succeeded in making Herod believe in her unchangeable loyalty, although the king had killed her own son-in-law and her nephew, Aristobulus, his own son. The will of Herod, made shortly before his death, is a convincing proof of his regard for his sister (Ant., XVII, viii, 1).<P>His domestic relations were very unhappy. Of his marriage with Doris and of her son, Antipater, he reaped only misery, the son, as stated above, ultimately falling a victim to his father\'s wrath, when the crown, for which he plotted, was practically within his grasp. Herod appears to have been deeply in love with Mariamne, the grandchild of Hyrcanus, in so far as he was capable of such a feeling, but his attitude toward the entire Asmonean family and his fixed determination to make an end of it changed whatever love Mariamne had for him into hatred. Ultimately she, as well as her two sons, fell victims to Herod\'s insane jealousy of power. Like Nero, however, in a similar situation, Herod felt the keenest remorse after her death. As his sons grew up, the family tragedy thickened, and the court of Herod became a veritable hotbed of mutual recriminations, intrigues and catastrophes. The trials and executions of his own conspiring sons were conducted with the acquiescence of the Roman power, for Herod was shrewd enough not to make a move without it. Yet so thoroughly was the condition of the Jewish court understood at Rome, that Augustus, after the death of Mariamne\'s sons (7 BC), is said to have exclaimed: "I would rather be Herod\'s hog hus than his son huios." At the time of his death, the remaining sons were these: Herod, son of Mariamne, Simon\'s daughter; Archelaus and Antipas, sons of Malthace, and Herod Philip, son of Cleopatra of Jerusalem. Alexander and Aristobulus were killed, through the persistent intrigues of Antipater, the oldest son and heir presumptive to the crown, and he himself fell into the grave he had dug for his brothers.<P>By the final testament of Herod, as ratified by Rome, the kingdom was divided as follows: Archelaus received one-half of the kingdom, with the title of king, really "ethnarch," governing Judea, Samaria and Idumaea; Antipas was appointed "tetrarch" of Galilee and Peraea; Philip, "tetrarch" of Trachonitis, Gaulonitis and Paneas. To Salome, his intriguing sister, he bequeathed Jamnia, Ashdod and Phasaelus, together with 500,000 drachmas of coined silver. All his kindred were liberally provided for in his will, "so as to leave them all in a wealthy condition" (Ant., XVII, viii, 1). In his death he had been better to his family than in his life. He died unmourned and unbeloved by his own people, to pass into history as a name soiled by violence and blood. As the waters of Callirhoe were unable to cleanse his corrupting body, those of time were unable to wash away the stains of a tyrant\'s name. The only time he is mentioned in the New Testament is in <a onClick="return mV(\'Mat\',2,\'1-\');">Matthew 2</a> and <a onClick="return mV(\'Luk\',1,\'1-\');">Luke 1</a>. In Matthew he is associated with the wise men of the East, who came to investigate the birth of the "king of the Jews." Learning their secret, Herod found out from the "priests and scribes of the people" where the Christ was to be born and ordered the "massacre of the innocents," with which his name is perhaps more generally associated than with any other act of his life. As Herod died in 4 BC and some time elapsed between the massacre and his death (<a onClick="return mV(\'Mat\',2,19);">Mt 2:19</a>), we have here a clue to the approximate fixing of the true date of Christ\'s birth. Another, in this same connection, is an eclipse of the moon, the only one mentioned by Josephus (Ant., XVII, vi, 4; text and note), which was seen shortly before Herod\'s death. This eclipse occurred on March 13, in the year of the Julian Period,4710,therefore 4 BC.<P>3. Herod Antipas:<P>Herod Antipas was the son of Herod the Great and Malthace, a Samaritan woman. Half Idumean, half Samaritan, he had therefore not a drop of Jewish blood in his veins, and "Galilee of the Gentiles" seemed a fit dominion for such a prince. He ruled as "tetrarch" of Galilee and Peraea (<a onClick="return mV(\'Luk\',3,1);">Lu 3:1</a>) from 4 BC till 39 AD. The gospel picture we have of him is far from prepossessing. He is superstitious (<a onClick="return mV(\'Mat\',14,1);">Mt 14:1</a>f), foxlike in his cunning (<a onClick="return mV(\'Luk\',13,31);">Lu 13:31</a>f) and wholly immoral. John the Baptist was brought into his life through an open rebuke of his gross immorality and defiance of the laws of Moses (<a onClick="return mV(\'Lev\',18,16);">Le 18:16</a>), and paid for his courage with his life (<a onClick="return mV(\'Mat\',14,10);">Mt 14:10</a>; Ant, XVIII, v, 2).<P>On the death of his father, although he was younger than his brother Archelaus (Ant., XVII, ix, 4f; BJ, II, ii, 3), he contested the will of Herod, who had given to the other the major part of the dominion. Rome, however, sustained the will and assigned to him the "tetrarchy" of Galilee and Peraea, as it had been set apart for him by Herod (Ant., XVII, xi, 4). Educated at Rome with Archelaus and Philip, his half-brother, son of Mariamne, daughter of Simon, he imbibed many of the tastes and graces and far more of the vices of the Romans. His first wife was a daughter of Aretas, king of Arabia. But he sent her back to her father at Petra, for the sake of Herodias, the wife of his brother Philip, whom he had met and seduced at Rome. Since the latter was the daughter of Aristobulus, his half-brother, and therefore his niece, and at the same time the wife of another half-brother, the union between her and Antipas was doubly sinful. Aretas repaid this insult to his daughter by a destructive war (Ant., XVIII, v, 1). Herodias had a baneful influence over him and wholly dominated his life (<a onClick="return mV(\'Mat\',14,\'3-10\');">Mt 14:3-10</a>). He emulated the example of his father in a mania for erecting buildings and beautifying cities. Thus, he built the wall of Sepphoris and made the place his capital. He elevated Bethsaida to the rank of a city and gave it the name "Julia," after the daughter of Tiberius. Another example of this inherited or cultivated building-mania was the work he did at Betharamphtha, which he called "Julias" (Ant., XVIII, ii, 1). His influence on his subjects was morally bad (<a onClick="return mV(\'Mar\',8,15);">Mr 8:15</a>). If his life was less marked by enormities than his father\'s, it was only so by reason of its inevitable restrictions. The last glimpse the Gospels afford of him shows him to us in the final tragedy of the life of Christ. He is then at Jerusalem. Pilate in his perplexity had sent the Saviour bound to Herod, and the utter inefficiency and flippancy of the man is revealed in the account the Gospels give us of the incident (<a onClick="return mV(\'Luk\',23,\'7-12\');">Lu 23:7-12</a>; <a onClick="return mV(\'Act\',4,27);">Ac 4:27</a>). It served, however, to bridge the chasm of the enmity between Herod and Pilate (<a onClick="return mV(\'Luk\',23,12);">Lu 23:12</a>), both of whom were to be stripped of their power and to die in shameful exile. When Caius Caligula had become emperor and when his scheming favorite Herod Agrippa I, the bitter enemy of Antipas, had been made king in 37 AD, Herodias prevailed on Herod Antipas to accompany her to Rome to demand a similar favor. The machinations of Agrippa and the accusation of high treason preferred against him, however, proved his undoing, and he was banished to Lyons in Gaul, where he died in great misery (Ant., XVIII, vii, 2; BJ, II, ix, 6).<P>4. Herod Philip:<P>Herod Philip was the son of Herod the Great and Cleopatra of Jerusalem. At the death of his father he inherited Gaulonitis, Traehonitis and Paneas (Ant., XVII, viii, 1). He was Philip apparently utterly unlike the rest of the Herodian family, retiring, dignified, moderate and just. He was also wholly free from the intriguing spirit of his brothers, and it is but fair to suppose that he inherited this totally un-Herodian character and disposition from his mother. He died in the year 34 AD, and his territory was given three years later to Agrippa I, his nephew and the son of Aristobulus, together with the tetrarchy of Lysanias (Ant., XVIII, iv, 6; XIX, v, 1).<P>5. Herod Archelaus:<P>Herod Archelaus was the oldest son of Herod the Great by Malthace, the Samaritan. He was a man of violent temper, reminding one a great deal of his father. Educated like all Archelaus the Herodian princes at Rome, he was fully familiar with the life and arbitrariness of the Roman court. In the last days of his father\'s life, Antipater, who evidently aimed at the extermination of all the heirs to the throne, accused him and Philip, his half-brother, of treason. Both were acquitted (Ant., XVI, iv, 4; XVII, vii, 1). By the will of his father, the greater part of the Herodian kingdom fell to his share, with the title of "ethnarch." The will was contested by his brother Antipas before the Roman court. While the matter was in abeyance, Archelaus incurred the hatred of the Jews by the forcible repression of a rebellion, in which some 3,000 people were slain. They therefore opposed his claims at Rome, but Arche1aus, in the face of all this opposition, received the Roman support (Ant., XVII, xi, 4). It is very ingeniously suggested that this episode may be the foundation of the parable of Christ, found in <a onClick="return mV(\'Luk\',19,\'12-27\');">Lu 19:12-27</a>. Archelaus, once invested with the government of Judea, ruled with a hard hand, so that Judea and Samaria were both soon in a chronic state of unrest. The two nations, bitterly as they hated each other, became friends in this common crisis, and sent an embassy to Rome to complain of the conduct of Archelaus, and this time they were successful. Archelaus was warned by a dream of the coming disaster, whereupon he went at once to Rome to defend himself, but wholly in vain. His government was taken from him, his possessions were all confiscated by the Roman power and he himself was banished to Vienna in Gaul (Ant., XVII, xiii,2,3). He, too, displayed some of his father\'s taste for architecture, in the building of a royal palace at Jericho and of a village, named after himself, Archelais. He was married first to Mariamne, and after his divorce from her to Glaphyra, who had been the wife of his half-brother Alexander (Ant., XVII, xiii). The only mention made of him in the Gospels is found in <a onClick="return mV(\'Mat\',2,22);">Mt 2:22</a>.<P>Of Herod, son of Herod the Great and Mariamne, Simon\'s daughter, we know nothing except that he married Herodias, the daughter of his dead halfbrother Aristobulus. He is called Philip in the New Testament (<a onClick="return mV(\'Mat\',14,3);">Mt 14:3</a>), and it was from him that Antipas lured Herodias away. His later history is wholly unknown, as well as that of Herod, the brother of Philip the tetrarch, and the oldest son of Herod the Great and Cleopatra of Jerusalem.<P>6. Herod Agrippa I:<P>Two members of the Herodian family are named Agrippa. They are of the line of Aristobulus, who through Mariamne, grand-daughter of Hyrcanus, carried down the line of the Asmonean blood. And it is worthy of note that in this line, nearly extinguished by Herod through his mad jealousy and fear of the Maccabean power, the kingdom of Herod came to its greatest glory again.<P>Herod Agrippa I, called Agrippa by Josephus, was the son of Aristobulus and Bernice and the grandson of Herod the Great and Mariamne. Educated at Rome with Claudius (Ant., XVIII, vi,1,4), he was possessed of great shrewdness and tact. Returning to Judea for a little while, he came back to Rome in 37 AD. He hated his uncle Antipas and left no stone unturned to hurt his cause. His mind was far-seeing, and he cultivated, as his grandfather had done, every means that might lead to his own promotion. He, therefore, made fast friends with Caius Caligula, heir presumptive to the Roman throne, and his rather outspoken advocacy of the latter\'s claims led to his imprisonment by Tiberius. This proved the making of his fortune, for Caligula did not forget him, but immediately on his accession to the throne, liberated Agrippa and bestowed on him, who up to that time had been merely a private citizen, the "tetrarchies" of Philip, his uncle, and of Lysanias, with the title of king, although he did not come into the possession of the latter till two more years had gone by (Ant., XVIII, vi, 10). The foolish ambition of Herod Antipas led to his undoing, and the emperor, who had heeded the accusation of Agrippa against his uncle, bestowed on him the additional territory of Galilee and Peraea in 39 AD. Agrippa kept in close touch with the imperial government, and when, on the assassination of Caligula, the imperial crown was offered to the indifferent Claudius, it fell to the lot of Agrippa to lead the latter to accept the proffered honor. This led to further imperial favors and further extension of his territory, Judea and Samaria being added to his domain, 40 AD. The fondest dreams of Agrippa had now been realized, his father\'s fate was avenged and the old Herodian power had been restored to its original extent. He ruled with great munificence and was very tactful in his contact with the Jews. With this end in view, several years before, he had moved Caligula to recall the command of erecting an imperial statue in the city of Jerusalem; and when he was forced to take sides in the struggle between Judaism and the nascent Christian sect, he did not hesitate a moment, but assumed the role of its bitter persecutor, slaying James the apostle with the sword and harrying the church whenever possible (<a onClick="return mV(\'Act\',12,\'1-\');">Ac 12</a>). He died, in the full flush of his power, of a death, which, in its harrowing details reminds us of the fate of his grandfather (<a onClick="return mV(\'Act\',12,\'20-23\');">Ac 12:20-23</a>; Ant, XIX, viii, 2). Of the four children he left (BJ, II, xi, 6), three are known to history—Herod Agrippa II, king of Calchis, Bernice of immoral celebrity, who consorted with her own brother in defiance of human and Divine law, and became a byword even among the heathen (Juv. Sat. vi. 156-60), and Drusilla, the wife of the Roman governor Felix (<a onClick="return mV(\'Act\',24,24);">Ac 24:24</a>). According to tradition the latter perished in the eruption of Vesuvius in 79 AD, together with her son Agrippa. With Herod Agrippa I, the Herodian power had virtually run its course.<P>7. Herod Agrippa II:<P>Herod Agrippa II was the son of Herod Agrippa I and Cypros. When his father died in 44 AD he was a youth of only 17 years and considered too young to assume the government of Judea. Claudius therefore placed the country under the care of a procurator. Agrippa had received a royal education in the palace of the emperor himself (Ant., XIX, ix, 2). But he had not wholly forgotten his people, as is proven by his intercession in behalf of the Jews, when they asked to be permitted to have the custody of the official highpriestly robes, till then in the hands of the Romans and to be used only on stated occasions (Ant., XX, i, 1). On the death of his uncle, Herod of Calchis, Claudius made Agrippa II "tetrarch" of the territory, 48 AD (BJ, II, xii, 1; XIV, iv; Ant, XX, v, 2). As Josephus tells us, he espoused the cause of the Jews whenever he could (Ant., XX, vi, 3). Four years later (52 AD), Claudius extended the dominion of Agrippa by giving him the old "tetrarchies" of Philip and Lysanias. Even at Calchis they had called him king; now it became his official title (Ant., XX, vii, 1). Still later (55 AD), Nero added some Galilean and Perean cities to his domain. His whole career indicates the predominating influence of the Asmonean blood, which had shown itself in his father\'s career also. If the Herodian taste for architecture reveals itself here and there (Ant., XX, viii, 11; IX, iv), there is a total absence of the cold disdain wherewith the Herods in general treated their subjects. The Agrippas are Jews.<P>Herod Agrippa II figures in the New Testament in <a onClick="return mV(\'Act\',25,13);">Ac 25:13</a>; <a onClick="return mV(\'Act\',26,32);">26:32</a>. Paul there calls him "king" and appeals to him as to one knowing the Scriptures. As the brother-in-law of Felix he was a favored guest on this occasion. His relation to Bernice his sister was a scandal among Jews and Gentiles alike (Ant., XX, vii, 3). In the fall of the Jewish nation, Herod Agrippa\'s kingdom went down. Knowing the futility of resistance, Agrippa warned the Jews not to rebel against Rome, but in vain (BJ, II, xvi, 2-5; XVII, iv; XVIII, ix; XIX, iii). When the war began he boldly sided with Rome and fought under its banners, getting wounded by a sling-stone in the siege of Gamala (BJ, IV, i, 3). The oration by which he sought to persuade the Jews against the rebellion is a masterpiece of its kind and became historical (BJ, II, xvi). When the inevitable came and when with the Jewish nation also the kingdom of Herod Agrippa II had been destroyed, the Romans remembered his loyalty. With Bernice his sister he removed to Rome, where he became a praetor and died in the year 100 AD, at the age of 70 years, in the beginning of Trajan\'s reign.<P>LITERATURE.<P>Josephus, Josephus, Antiquities and BJ; Strabo; Dio Cassius. Among all modern works on the subject, Schurer, The Jewish People in the Time of Jesus Christ (5 vols) is perhaps still the best.``42';
isbe[4310]='Herodians`he-ro\'-di-anz (Herodianoi): A party twice mentioned in the Gospels (<a onClick="return mV(\'Mat\',22,16);">Mt 22:16</a> parallel <a onClick="return mV(\'Mar\',12,13);">Mr 12:13</a>; <a onClick="return mV(\'Mar\',3,6);">3:6</a>) as acting with the Pharisees in opposition to Jesus. They were not a religious sect, but, as the name implies, a court or political party, supporters of the dynasty of Herod. Nothing is known of them beyond what the Gospels state. Whatever their political aims, they early perceived that Christ\'s pure and spiritual teaching on the kingdom of God was irreconcilable with these, and that Christ\'s influence with the people was antagonistic to their interests. Hence, in Galilee, on the occasion of the healing of the man with the withered hand, they readily joined with the more powerful party of the Pharisees in plots to crush Jesus (<a onClick="return mV(\'Mar\',3,6);">Mr 3:6</a>); and again, in Jerusalem, in the last week of Christ\'s life, they renewed this alliance in the attempt to entrap Jesus on the question of the tribute money (<a onClick="return mV(\'Mat\',22,16);">Mt 22:16</a>). The warning of Jesus to His disciples to "beware of the leaven of Herod" (<a onClick="return mV(\'Mar\',8,15);">Mr 8:15</a>) may have had reference to the insidious spirit of this party.``132';
isbe[4311]='Herodias`he-ro\'-di-as (Herodias): The woman who compassed the death of John the Baptist at Macherus (<a onClick="return mV(\'Mat\',14,\'1-12\');">Mt 14:1-12</a>; <a onClick="return mV(\'Mar\',6,\'14-29\');">Mr 6:14-29</a>; compare also <a onClick="return mV(\'Luk\',3,19,20);">Lu 3:19-20</a>; <a onClick="return mV(\'Luk\',9,\'7-9\');">9:7-9</a>). According to the Gospel records, Herodias had previously been married to Philip, but had deserted him for his brother Herod the tetrarch. For this Herod was reproved by John (compare <a onClick="return mV(\'Lev\',18,16);">Le 18:16</a>; <a onClick="return mV(\'Lev\',20,21);">20:21</a>), and Herod, therefore, to please Herodias, bound him and cast him into prison. According to <a onClick="return mV(\'Mat\',14,5);">Mt 14:5</a> he would even then have put John to death, but "feared the multitude," which regarded John as a prophet. But <a onClick="return mV(\'Mar\',6,19);">Mr 6:19</a>f relates it was Herodias who especially desired the death of John, but that she was withstood by Herod whose conscience was not altogether dead. This latter explanation is more in harmony with the sequel. At Herod\'s birthday feast, Herodias induced her daughter Salome, whose dancing had so charmed the tetrarch, to ask as her reward the head of John the Baptist on a charger. This was given her and she then brought it to her mother.<P>Herodias was daughter of Aristobulus, son of Herod the Great, by Mariamne, daughter of Hyrcanus. Her second husband (compare above) was Herod Antipas, tetrarch of Galilee and Peraea (circa 4-39 AD), son of Herod the Great by Malthace. Herod Antipus was thus the step-brother of Aristobulus, father of Herodias. Regarding the first husband of Herodias, to whom she bore Salome, some hold that the Gospel accounts are at variance with that of Josephus. In <a onClick="return mV(\'Mat\',14,3);">Mt 14:3</a>; <a onClick="return mV(\'Mar\',6,17);">Mr 6:17</a>; <a onClick="return mV(\'Luk\',3,19);">Lu 3:19</a>, he is called Philip the brother of Herod (Antipus). But in <a onClick="return mV(\'Mat\',14,3);">Mt 14:3</a> and <a onClick="return mV(\'Luk\',3,19);">Lu 3:19</a> the name Philip is omitted by certain important manuscripts. According to Josephus, he was Herod, son of Herod the Great by Mariamne daughter of Simon the high priest, and was thus a step-brother of Herod Antipas (compare Josephus, Ant, XVIII, v, 4). It is suggested in explanation of the discrepancy<P>(1) that Herod, son of Mariamne, bore a second name Philip, or<P>(2) that there is confusion in the Gospels with Heroal-Philip, tetrarch of Trachonitis, who was the son of Herod the Great and Cleopatra, and who was in reality the husband of Salome, daughter of Herodias (compare also A. B. Bruce, The Expositor Greek Testament., I, 381; A. C. Headlam, article "Herod" in HDB, II,359,360).<P>According to Josephus (Ant., VIII, vii, 2; XVIII, vii, 1) the ambition of Herodias proved the ruin of Herod Antipas. Being jealous of the power of Agrippa her brother, she induced Herod to demand of Caligula the title of king. This was refused through the machinations of Agrippa, and Herod was banished. But the pride of Herodias kept her still faithful to her husband in his misfortune.``88';
isbe[4312]='Herodion`he-ro\'-di-on (Herodion; Westcott and Hort, The New Testament in Greek Hrodion): A Roman Christian to whom Paul sent greetings (<a onClick="return mV(\'Rom\',16,11);">Ro 16:11</a>). The name seems to imply that he was a freedman of the Herods, or a member of the household of Aristobulus, the grandson of Herod the Great (<a onClick="return mV(\'Rom\',16,10);">Ro 16:10</a>). Paul calls him "my kinsman," i.e. "a Jew" (see <a href="study/isbe/search.html?string=JUNIAS">JUNIAS, 1</A>).``1';
isbe[4313]='Heron`her\'-un (\'anaphah; charadrios; Latin Ardea cinerea): Herons are mentioned only in the abomination lists of <a onClick="return mV(\'Lev\',11,19);">Le 11:19</a> (margin "ibis") and <a onClick="return mV(\'Deu\',14,18);">De 14:18</a>. They are near relatives of crane, stork, ibis and bittern. These birds, blue, white or brown, swarmed in Europe and wintered around Merom, along the Jordan, at the headwaters of the Jabbok and along its marshy bed in the dry season. Herons of Southern Africa that summered in the Holy Land loved to nest on the banks of Merom, and raise their young among the bulrushes, papyrus, reeds and water grasses, although it is their usual habit to build in large trees. The white herons were small, the blue, larger, and the brown, close to the same size. The blue were 3 1/2 ft. in length, and had a 5-ft. sweep. The beak, neck and legs constituted two-thirds of the length of the body, which is small, lean and bony, taking its appearance of size from its long loose feathers. Moses no doubt forbade these birds as an article of diet, because they ate fish and in older specimens would be tough, dark and evil smelling. The very poor of our western and southeastern coast states eat them.``167';
isbe[4314]='Hesed, Son of`he\'-sed.`<a href="./study/isbe/search.html?string=BEN+HESED">BEN-HESED</a>`1';
isbe[4315]='Heshbon`hesh\'-bon (cheshbon; Hesebon): The royal city of Sihon king of the Amorites, taken and occupied by the Israelites under Moses (<a onClick="return mV(\'Num\',21,25);">Nu 21:25</a>f; etc.). It lay on the southern border of Gad (<a onClick="return mV(\'Jos\',13,26);">Jos 13:26</a>), and was one of the cities fortified by Reuben (<a onClick="return mV(\'Num\',32,37);">Nu 32:37</a>). It is reckoned among the cities of Gad given to the Merarite Levites (<a onClick="return mV(\'Jos\',21,39);">Jos 21:39</a>). In later literature (<a onClick="return mV(\'Isa\',15,4);">Isa 15:4</a>; <a onClick="return mV(\'Isa\',16,8);">16:8</a>f; <a onClick="return mV(\'Jer\',48,2,34,45);">Jer 48:2, 34, 45</a>; <a onClick="return mV(\'Jer\',49,3);">49:3</a>) it is referred to as a city of Moab. It passed again into Jewish hands, and is mentioned by Josephus (Ant., XIII, xv, 4) as among their possessions in the country of Moab under Alexander Janneus. The city with its district called Hesebonitis, was also under the jurisdiction of Herod the Great (Ant., XV, vii,5,where it is described as lying in the Peraea). Eusebius, Onomasticon places it 20 Roman miles from the Jordan. It is represented by the modern Chesban, a ruined site in the mountains over against Jericho, about 16 miles east of the Jordan. It stands on the edge of Wady Chesban in a position of great strength, about 600 ft. above \'Ain Chesban. The ruins, dating mainly from Roman times, spread over two hills, respectively 2,930 ft. and 2,954 ft. in height. There are remains of a temple overlooked from the west by those of a castle. There is also a large ruined reservoir; while the spring in the valley forms a succession of pools (<a onClick="return mV(\'Sgs\',7,4);">So 7:4</a>). The city is approached from the valley by a steep path passing through a cutting in the rock, which may have been closed by a gate (Conder, Heth and Moab, 142). On a hill to the west, el-Kurmiyeh, is a collection of dolmens and stone circles (Musil, Arabia Petrea, I, 383ff).``54';
isbe[4316]='Heshmon`hesh\'-mon (cheshmon): An unidentified place on the border of Judah toward Edom (<a onClick="return mV(\'Jos\',15,27);">Jos 15:27</a>). This may have been the original home of the Hasmoneans.``1';
isbe[4317]='Heth (1)`chath cheth: The eighth letter of the Hebrew alphabet; transliterated in this Encyclopedia as "ch". It came also to be used for the no. 8</a>`<a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>`1';
isbe[4318]='Heth (2)`heth (cheth): In <a onClick="return mV(\'Gen\',23,10);">Ge 23:10</a> the ancestor of the Hittites. As the various peoples who occupied Canaan were thought to belong to one stock, <a onClick="return mV(\'Gen\',10,15);">Ge 10:15</a> (<a onClick="return mV(\'1Ch\',1,13);">1Ch 1:13</a>) makes Heth the (2nd) son of Canaan. In <a onClick="return mV(\'Gen\',23,\'1-\');">Ge 23</a> the "sons of Heth" occupy Hebron, but they were known to have come there from the north. A reference to this seems to be preserved in the order of the names in <a onClick="return mV(\'Gen\',10,15,16);">Ge 10:15-16</a>, where Heth is placed between Sidon and the Jebusites.`<a href="./study/isbe/search.html?string=HITTITES">HITTITES</a>`1';
isbe[4319]='Hethlon`heth\'-lon (chethlon; Peshitta chethron): Name of a place associated with Zedad on the ideal northern boundary of Israel, as given in <a onClick="return mV(\'Eze\',47,15);">Eze 47:15</a> and <a onClick="return mV(\'Eze\',48,1);">48:1</a>, but not named in <a onClick="return mV(\'Num\',34,8);">Nu 34:8</a>, while the Septuagint evidently translated the text it had. In accordance with the opinion they hold as to the boundary line of Northern Israel, van Kasteren and Buhl seek to identify Hethlon with \'Adlun on the river Qasmiyeh. Much more in harmony with the line of the other border towns given is its identification with Heitala to the northeast of Tripoli. The "way of Hethlon" would then coincide with the Eleutherus valley, between Homs and the Mediterranean, through which the railway now runs, and to this identification the Septuagint seems to give testimony, indicating some path of "descent" from the Biqa\'a.``23';
isbe[4320]='Hewer`hu\'-er (chotebh): Applies especially to a wood-worker or wood-gatherer (compare Arabic chattab, "a woodman") (<a onClick="return mV(\'Jos\',9,21,23,27);">Jos 9:21, 23, 27</a>; <a onClick="return mV(\'2Ch\',2,10);">2Ch 2:10</a>; <a onClick="return mV(\'Jer\',46,22);">Jer 46:22</a>). Gathering wood, like drawing water, was a menial task. Special servants were assigned to the work (<a onClick="return mV(\'Deu\',29,11);">De 29:11</a>). Joshua set the Gibeonites to hewing wood and drawing water as a punishment for their trickery, whereas were it not for the oath which the Israelites had sworn, the Gibeonites would probably have been killed.<P>chatsbh, from the root "to cut" or "to carve," applies to hewers of stone in <a onClick="return mV(\'1Ki\',5,15);">1Ki 5:15</a>; <a onClick="return mV(\'2Ki\',12,12);">2Ki 12:12</a>; <a onClick="return mV(\'1Ch\',22,15);">1Ch 22:15</a>; <a onClick="return mV(\'2Ch\',2,18);">2Ch 2:18</a>.`<a href="./study/isbe/search.html?string=DRAWER+OF+WATER">DRAWER OF WATER</a>`133';
isbe[4321]='Hexateuch`hek\'-sa-tuk:<P>1. Evidence for:<P>This word, formed on the analogy of Pentateuch, Heptateuch, etc., is used by modern writers to denote the first six books of the Bible (i.e. the Law and Joshua) collectively. Many critics hold that these six books were composed out of the sources JEP, etc. (on which see <a href="study/isbe/search.html?string=PENTATEUCH,+1">PENTATEUCH</A>), and only separated very much later into different works. The main grounds for this belief are:<P>(1) the obvious fact that Joshua provides the sequel to the Pentateuch, narrating the conquest and settlement in Canaan to which the latter work looks forward, and<P>(2) certain material and stylistic resemblances. The composition of the respective works is considered in the articles <a href="study/isbe/search.html?string=PENTATEUCH,+1">PENTATEUCH</A> and <a href="study/isbe/search.html?string=JOSHUA+(1)">JOSHUA</a>.<P>2. Evidence against:<P>Here we must glance at the evidence against theory of a Hexateuch. It is admitted that there is no trace of any such work as the Hexateuch anywhere in tradition. The Jewish Canon places the Pentateuch in a separate category from Joshua. The Samaritans went farther and adopted the Pentateuch alone. The orthography of the two works differs in certain important particulars (see E. Konig, Einleitung, 151f; 250). Hence, a different literary history has to be postulated for the two works, even by those who adopt theory of a Hexateuch. But that theory is open to objection on other grounds. There are grave differences of opinion among its supporters as to whether all the supposed Pentateuchal documents are present in Joshua, and in any case it is held that they are quite differently worked up, the redactors having proceeded on one system in the Pentateuch and on quite another in Joshua. Arguments are given in the article <a href="study/isbe/search.html?string=PENTATEUCH,+1">PENTATEUCH</A> to show the presence of Mosaic and pre-Mosaic elements in the Pentateuch and the unsoundness of the documentary theory in that work, and if these be correct theory of a Hexateuch necessarily falls to the ground.`<a href="./study/isbe/search.html?string=PENTATEUCH,+1">PENTATEUCH</a>; <a href="./study/isbe/search.html?string=JOSHUA+(1)">JOSHUA</a>`193';
isbe[4322]='Hezeki`hez\'-e-ki (chizqi).`<a href="./study/isbe/search.html?string=HIZKI">HIZKI</a>`1';
isbe[4323]='Hezekiah (1)`hez-e-ki\'-a (chizqiyah):<P>(1) King of Judah. See special article [<a href="./study/isbe/search.html?string=HEZEKIAH+(2)">Hezekiah (2)</a>]<P>(2) A son of Neariah, of the royal family of Judah (<a onClick="return mV(\'1Ch\',3,23);">1Ch 3:23</a>, the Revised Version (British and American) "Hizkiah").<P>(3) An ancestor of Zephaniah (<a onClick="return mV(\'Zep\',1,1);">Ze 1:1</a>, the King James Version "Hizkiah").<P>(4) One of the returned exiles from Babylon (<a onClick="return mV(\'Ezr\',2,16);">Ezr 2:16</a>; <a onClick="return mV(\'Neh\',7,21);">Ne 7:21</a>).``1';
isbe[4324]='Hezekiah (2)`(chizqiyah, "Yahweh has strengthened"; also written chizqiyahu, "Yah has strengthened him"; Hezekias): One of the greatest of the kings of Judah; reigned (according to the most self-consistent chronology) from circa 715 to circa 690 BC.<P>Old Testament Estimate:<P>On the Old Testament standard of loyalty to Yahweh he is eulogized by Jesus Sirach as one of the three kings who alone did not "commit trespass" (Sirach 49:4), the other two being David and Josiah. The Chronicler represents him (<a onClick="return mV(\'2Ch\',32,31);">2Ch 32:31</a>) as lapsing from the wisdom of piety only by his vainglory in revealing the resources of his realm to the envoys of Merodach-baladan. In <a onClick="return mV(\'2Ki\',18,5);">2Ki 18:5</a>, the earliest estimate, his special distinction, beyond all other Judean kings, before or after, was that he "trusted in Yahweh, the God of Israel." It is as the king who "clave to Yahweh" (<a onClick="return mV(\'2Ki\',18,6);">2Ki 18:6</a>) that the Hebrew mind sums up his royal and personal character.<P>I. Sources for His Life and Times.<P>1. Scripture Annals:<P>The historical accounts in <a onClick="return mV(\'2Ki\',18,\'1-\');">2Ki 18</a>; <a onClick="return mV(\'2Ki\',20,\'1-\');">20</A> and <a onClick="return mV(\'2Ch\',29,\'1-\');">2Ch 29</a>; <a onClick="return mV(\'2Ch\',32,\'1-\');">32</A> are derived in the main from the same state annals, though the latter seems also to have had the Temple archives to draw upon. For "the rest of his acts" 2 Kings refers to a source then still in existence but now lost, "the book of the chronicles of the kings of Judah" (<a onClick="return mV(\'2Ki\',20,20);">2Ki 20:20</a>), and 2 Chronicles to "the vision of Isaiah the prophet the son of Amoz, in the book of the kings of Judah and Israel" (<a onClick="return mV(\'2Ch\',32,32);">2Ch 32:32</a>). In this last-named source (if this is the original of our Book of Isaiah), besides the warnings and directions called out by the course of the history, there is a narrative section (<a onClick="return mV(\'Isa\',36,\'1-\');">Isa 36</a>; <a onClick="return mV(\'Isa\',39,\'1-\');">39</a>) recounting the Sennacherib crisis much as do the other histories, but incorporating also a passage of Isaianic prophecy (<a onClick="return mV(\'Isa\',37,\'22-32\');">Isa 37:22-32</a>) and a "writing of Hezekiah king of Judah" (<a onClick="return mV(\'Isa\',38,\'10-20\');">Isa 38:10-20</a>). Lastly, in Sirach 48:17-25, there is a summary of the good and wise deeds of Hezekiah, drawn from the accounts that we already have.<P>2. View-point and Colouring:<P>Of these sources the account in 2 Kings is most purely historianic, originating at a time when religious and political values, in the Hebrew mind, were inseparable. In 2 Chronicles the religious point and coloring, especially in its later developed ritual and legal aspects, has the decided predominance. Sirach, with the mind of a man of letters, is concerned mainly with eulogizing Hezekiah. in his "praise of famous men" (compare Sirach 44-50), of course from the devout Hebrew point of view. In the vision of Isaiah (<a onClick="return mV(\'Isa\',1,\'1-\');">Isa 1</a>; <a onClick="return mV(\'Isa\',39,\'1-\');">39</A>), we have the reflection of the moral and spiritual situation in Jerusalem, as realized in the fervid prophetic consciousness; and in the prophecy of his younger contemporary Micah, the state of things in the outlying country districts nearest the path of invasion, where both the iniquities of the ruling classes and the horrors of war were felt most keenly. Doubtless also many devotional echoes of these times of stress are deducible from the Psalms, so far as we can fairly identify them.<P>3. Side-Lights:<P>It is in Hezekiah\'s times especially that the Assyrian inscriptions become illuminating for the history of Israel; for one important thing they furnish certain fixed dates to which the chronology of the times can be adjusted. Of Sennacherib\'s campaign of 701, for instance, no fewer than six accounts are at present known (see G.A. Smith, Jerusalem, II, 154, note), the most detailed being the "Taylor Cylinder," now in the British Museum, which in the main agrees, or at least is not inconsistent, with the Scripture history.<P>II. Events of His Reign.<P>1. His Heritage:<P>From his weak and unprincipled father Ahaz (compare <a onClick="return mV(\'2Ch\',28,\'16-25\');">2Ch 28:16-25</a>), Hezekiah inherited not only a disorganized realm but a grievous burden of Assyrian dominance and tribute, and the constant peril and suspense of greater encroachments from that arrogant and arbitrary power: the state of things foretold in <a onClick="return mV(\'Isa\',7,20);">Isa 7:20</a>; <a onClick="return mV(\'Isa\',8,7);">8:7</a>f. The situation was aggravated by the fact that not only the nation\'s weakness but its spiritual propensities had incurred it: the dominant classes were aping the sentiments, fashions and cult of the East (compare <a onClick="return mV(\'Isa\',2,\'6-8\');">Isa 2:6-8</a>), while the neglected common people were exposed to the corruptions of the still surviving heathenism of the land. The realm, in short, was at the spiritual nadir-point from which prophets like Isaiah and Micah were laboring to bring about the birth of a true Hebrew conscience and faith. Their task was a hard one: with a nation smear-eyed, dull-cared, fat-hearted (<a onClick="return mV(\'Isa\',6,10);">Isa 6:10</a>), whose religion was a precept of men learned by rote (<a onClick="return mV(\'Isa\',29,13);">Isa 29:13</a>). Clearly, from this point of view, a most difficult career was before him.<P>2. Religious Reform:<P>The sense of this unspiritual state of things furnishes the best keynote of Hezekiah\'s reforms in religion, which according to the Chronicler he set about as soon as he came to the throne (<a onClick="return mV(\'2Ch\',29,3);">2Ch 29:3</a>). It is the Chronicler who gives the fullest account of these reforms (<a onClick="return mV(\'2Ch\',29,\'1-\');">2Ch 29-31</a>); naturally, from his priestly point of view and access to ecclesiastical archives. Hezekiah began with the most pressing constructive need, the opening and cleansing of the Temple, which his father Ahaz had left closed and desecrated (<a onClick="return mV(\'2Ch\',28,24);">2Ch 28:24</a>), and went on to the reorganization of its liturgical and choral service. In connection with this work he appointed a Passover observance, which, on a scale and spirit unknown since Solomon (<a onClick="return mV(\'2Ch\',30,26);">2Ch 30:26</a>), he designed as a religious reunion of the devout-minded in all Israel, open not only to Jerusalem and Judah, but to all who would accept his invitation from Samaria, Galilee, and beyond the Jordan (<a onClick="return mV(\'2Ch\',30,\'5-12\',18);">2Ch 30:5-12, 18</a>). The immediate result of the enthusiasm engendered by this Old Home Week was a vigorous popular movement of iconoclasm against the idolatrous high places of the land. That this was no weak fanatical impulse to break something, but a touch of real spiritual quickening, seems evidenced by one incident of it: the breaking up of Moses\' old brazen serpent and calling it what it had come to mean, nechushtan, "a piece of brass" (<a onClick="return mV(\'2Ki\',18,4);">2Ki 18:4</a>); the movement seems in fact to have had in it the sense, however crude, that old religious forms had become hurtful and effete superstitions, hindering spirituality. Nor could the movement stop with the old fetish. With it went the demolition of the high places themselves and the breaking down of the pillars (matstsebhoth) and felling of the sacred groves (\'asherah), main symbols these of a debasing nature cult. This reform, on account of later reactions (see under <a href="study/isbe/search.html?string=MANASSEH+(3)">MANASSEH</A>), has been deemed ineffective; rather, its effects were inward and germinal; nor were they less outwardly than could reasonably be expected, before its meanings were more deepened and centralized.<P>3. Internal Improvements:<P>All this, on the king\'s part, was his response to the spiritual influence of Isaiah, with whose mind his own was sincerely at one. As a devout disciple in the school of prophetic ideas, he earnestly desired to maintain the prophet\'s insistent attitude of "quietness and confidence" (compare <a onClick="return mV(\'Isa\',30,15);">Isa 30:15</a>), that is, of stedfast trust in Yahweh alone, and of abstinence from revolt and entangling alliances with foreign powers. This, however, in the stress and suspense of the times, did not preclude a quiet preparation for emergencies; and doubtless the early years of his reign were notable, not only for mild and just administration throughout his realm, but for measures looking to the fortifying and defense of the capital. His work of repairing and extending the walls and of strengthening the citadel (Millo), as mentioned in <a onClick="return mV(\'2Ch\',32,5);">2Ch 32:5</a>, had probably been in progress long before the Assyrian crisis was imminent. Nor was he backward in coming to an understanding with other nations, as to the outlook for revolt against Assyria. He could not learn his lesson of faith all at once, especially with a factious court pulling the other way. He did not escape the suspicion of Sargon (died 705), who for his Egyptian leanings counted him among the "plotters of sedition" (compare COT, 100); while the increasing prosperity and strength of his realm marked him for a leading role in an eventual uprising. He weathered at least one chance of rebellion, however, in 711, probably through the strenuous exertions of Isaiah (see <a onClick="return mV(\'Isa\',20,1);">Isa 20:1</a>ff).<P>4. The Assyrian Crisis:<P>Hezekiah\'s opportunity to rise against Assyrian domination seems to have been taken about 704. How so pious a king came to do it in spite of Isaiah\'s strenuous warnings, both against opposition to Assyria and alliance with other powers, is not very clear. The present writer ventures to suggest the view that the beginning was forced or perhaps sprung upon him by his princes and nobles. In the year before, Sargon, dying, had left his throne to Sennacherib, and, as at all ancient changes of sovereignty, this was the signal for a general effort for independence on the part of subject provinces. That was also the year of Hezekiah\'s deadly illness (<a onClick="return mV(\'2Ki\',20,\'1-\');">2Ki 20</a>; <a onClick="return mV(\'Isa\',38,\'1-\');">Isa 38</a>), when for a time we know not how long he would be incapacitated for active administration of affairs. Not unlikely on his recovery he found his realm committed beyond withdrawal to an alliance with Egypt and perhaps the leadership of a coalition with Philistia; in which case personally he could only make the best of the situation. There was nothing for it but to confirm this coalition by force, which he did in his Philistine campaign mentioned in <a onClick="return mV(\'2Ki\',18,8);">2Ki 18:8</a>. Meanwhile, in the same general uprising, the Chaldean Merodach-baladan, who had already been expelled from Babylon after an 11-year reign (721-710), again seized that throne; and in due time envoys from him appeared in Jerusalem, ostensibly to congratulate the king on his recovery from his illness, but really to secure his aid and alliance against Assyria (<a onClick="return mV(\'2Ki\',20,\'12-15\');">2Ki 20:12-15</a>; <a onClick="return mV(\'Isa\',39,\'1-4\');">Isa 39:1-4</a>). Hezekiah, flattered by such distinguished attention from so distant and powerful a source, by revealing his resources committed what the Chronicler calls the one impious indiscretion of his life (<a onClick="return mV(\'2Ch\',32,31);">2Ch 32:31</a>), incurring also Isaiah\'s reproof and adverse prediction (<a onClick="return mV(\'2Ki\',20,17);">2Ki 20:17</a>f; <a onClick="return mV(\'Isa\',39,6);">Isa 39:6</a>f). The conflict with Sennacherib was now inevitable; and Hezekiah, by turning the water supply of Jerusalem from the Gihon spring to a pool within the walls and closing it from without, put the capital in readiness to stand a siege. The faith evoked by this wise work, confirmed by the subsequent deliverance, is reflected in <a onClick="return mV(\'Psa\',46,\'1-\');">Ps 46</a>. That this incurring of a hazardous war, however, with its turmoils and treacheries, and the presence of uncouth Arab mercenaries, was little to the king\'s desire or disposition, seems indicated in <a onClick="return mV(\'Psa\',120,\'1-\');">Ps 120</a>, which with the other Songs of Degrees (<a onClick="return mV(\'Psa\',120,\'1-\');">Pss 120-134</a>) may well reflect the religious faith of this period of Hezekiah\'s life.<P>5. Invasion and Deliverance:<P>The critical moment came in 701, when Sennacherib, who the year before had reconquered Babylon and expelled Merodach-baladan (perhaps <a onClick="return mV(\'Isa\',21,\'1-9\');">Isa 21:1-9</a> refers to and this), was free to invade his rebellious provinces in the West. It was a vigorous and sweeping campaign; in which, beginning with Sidon and advancing down<P>through the coast lands, he speedily subdued the Philistine cities, defeating them and their southern allies (whether these were from Egypt proper or from its extension across the Sinai peninsula and Northern Arabia, Mutsri, is not quite clear) at Eltekeh; in which campaign, according to his inscription, he took 46 walled towns belonging to Judah with their spoil and deported over 200,000 of their inhabitants. This, which left Jerusalem a blockaded town (in fact he says of Hezekiah: "Himself I shut up like a bird in a cage in Jerusalem his royal city"), seems referred to in <a onClick="return mV(\'Isa\',1,\'7-9\');">Isa 1:7-9</a> and predicted in <a onClick="return mV(\'Isa\',6,11);">Isa 6:11</a>f. Its immediate effect was to bring Hezekiah to terms and extort an enormous tribute (<a onClick="return mV(\'2Ki\',18,\'14-16\');">2Ki 18:14-16</a>). When later, however, he was treacherous enough to disregard the compact thus implied (perhaps <a onClick="return mV(\'Isa\',33,\'1-\');">Isa 33</a> refers to this), and demanded the surrender of the city (<a onClick="return mV(\'2Ki\',18,\'17-\');">2Ki 18:17</a>-<a onClick="return mV(\'2Ki\',19,\'1-7\');">19:7</a>; <a onClick="return mV(\'Isa\',36,\'2-\');">Isa 36:2</A>-<a onClick="return mV(\'Isa\',37,\'1-7\');">37:7</a>), Hezekiah besought the counsel of Isaiah, who bade him refuse the demand, and predicted that Sennacherib would "hear tidings" and return to his own land; which prediction actually came to pass, and suddenly Hezekiah found himself free. A deliverance so great, and so signally vindicating the setting forth of faith, could not but produce a momentous revulsion in the nation\'s mind, like a new spiritual birth in which the faith of the "remnant" became a vital power in Israel; its immediate effect seems portrayed in <a onClick="return mV(\'Psa\',124,\'1-\');">Ps 124</a> and perhaps <a onClick="return mV(\'Psa\',126,\'1-\');">Ps 126</a>, and its deep significance as the birth of a nation in a day seems summarized long afterward in <a onClick="return mV(\'Isa\',66,\'7-9\');">Isa 66:7-9</a>; compare <a onClick="return mV(\'Isa\',37,3);">37:3</a>; <a onClick="return mV(\'2Ki\',19,3);">2Ki 19:3</a>.<P>6. The Second Summons:<P>A second summons to surrender, sent from Libnah by letter (<a onClick="return mV(\'2Ki\',19,1);">2Ki 19:1</a>ff; <a onClick="return mV(\'Isa\',37,8);">Isa 37:8</a>), is treated by the Scripture historians as a later feature of the same campaign; but recent researches seem to make it possible, nay probable, that this belonged to another campaign of Sennacherib, when Taharka of Ethiopia (Tirhakah, <a onClick="return mV(\'2Ki\',19,9);">2Ki 19:9</a>; <a onClick="return mV(\'Isa\',37,9);">Isa 37:9</a>) came to power in Egypt, in 691. If this was so, there is room in Hezekiah\'s latter years for a decade of peace and prosperity (compare <a onClick="return mV(\'2Ch\',32,22,23,\'27-30\');">2Ch 32:22, 23, 27-30</A>), and in Isaiah\'s old age for a collection and revision of his so wonderfully vindicated prophecies. The historians\' evident union of two stories in one makes the new attitude with which this crisis was met, obscure; but the tone of confirmed confidence and courage seems decidedly higher. The discomfiture of Sennacherib in this case was brought about, not by a rumor of rebellions at home, but by an outbreak of plague (<a onClick="return mV(\'2Ki\',19,35);">2Ki 19:35</a>f; <a onClick="return mV(\'Isa\',37,36);">Isa 37:36</a>f), which event the Scripture writers interpreted as a miracle. The prophetic sign of deliverance (<a onClick="return mV(\'2Ki\',19,29);">2Ki 19:29</a>; <a onClick="return mV(\'Isa\',37,30);">Isa 37:30</a>) may be referred to the recovery of the devastated lands from the ravage inflicted by Sennacherib in his first campaign (compare also <a onClick="return mV(\'Psa\',126,5);">Ps 126:5</a>f).<P>III. His Character.<P>Our estimate of Hezekiah\'s character is most consistently made by regarding him as a disciple of Isaiah, who was earnestly minded to carry out his prophetic ideas. As, however, these were to begin with only the initial ideas of a spiritual "remnant," the king\'s sympathies must needs be identified at heart, not with his imperious nobles and princes, but with a minority of the common people, whose religious faith did not become a recognizable influence in the state until after 701. In the meantime his zeal for purer worship and more just domestic administration, which made him virtually king of the remnant, made him a wise and sagacious prince over the whole realm. Isaiah\'s glowing prophecy (<a onClick="return mV(\'Isa\',32,\'1-8\');">32:1-8</A>) seems to be a Messianic projection of the saner and clearer-seeing era that his domestic policy adumbrated—a time when king and nobles rule in righteousness, when man can lean on man, when things good and evil are seen as they are and called by their right names. When it came to dealing with the foreign situation, however, especially according to the Isaianic program, his task was exceedingly difficult, as it were a pioneer venture in faith. His effort to maintain an attitude of steadfast trust in Yahweh, with the devout quietism which, though really its consistency and strength looked like a supine passivity, would lead his restlessly scheming nobles to regard him as a pious weakling; and not improbably they came to deem him almost a negligible quantity, and forced his hand into diplomacies and coalitions that were not to his mind. Some such insolent attitude of theirs seems to be portrayed in <a onClick="return mV(\'Isa\',28,\'14-22\');">Isa 28:14-22</a>. This was rendered all the more feasible, perhaps, by the period of incapacitation that must have attended his illness, in the very midst of the nation\'s critical affairs. Isaiah\'s words (<a onClick="return mV(\'Isa\',33,17);">33:17</a>ff) may be an allusion at once to his essential kingliness, to the abeyance of its manifestation due to his disease, and to the constricted condition into which, meanwhile, the realm had fallen. This exceedingly critical episode of Hezekiah\'s career does not seem to have had its rights with students of the era. Considering the trials that his patient faith must have had, always at cross-purposes with his nobles (compare <a onClick="return mV(\'Psa\',120,6);">Ps 120:6</a>f); that now by reason of his sickness they had the whip hand; that his disease cut him off not only from hope of life, but from association with men and access to the sanctuary (compare <a onClick="return mV(\'Isa\',38,10,11,12);">Isa 38:10-12</a>); that, as his son Manasseh was not born till three years within the fifteen now graciously added to his life (compare <a onClick="return mV(\'2Ki\',21,1);">2Ki 21:1</a>), his illness seemed to endanger the very perpetuity of the Davidic dynasty, we have reason for regardi
