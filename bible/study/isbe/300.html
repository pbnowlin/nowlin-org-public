as, partly no doubt from being the pupil of Aristotle, yet more imbued with Greek feelings and ideas than was Preparation his father. He was early introduced into the cares of government and the practice of war. While Philip was engaged in the siege of Byzantium he sent his son to replace Antipater in the regency; during his occupancy of this post, Alexander, then only a youth of sixteen, had to undertake a campaign against the Illyrians, probably a punitive expedition. Two years later, at the decisive battle of Chaeroneia, which fixed the doom of the Greek autonomous city, Alexander commanded the feudal cavalry of Macedon, the "Companions." He not only saved his father\'s life, but by his timely and vehement charge materially contributed to the victory.<P>3. His Accession to the Hegemony of Greece:<P>When all his plans for the invasion of Persia were complete, and a portion of his troops was already across the Hellespont, Philip was assassinated. Having secured his succession, Alexander proceeded to Corinth, where he was confirmed in his father\'s position of leader of Hellas against Darius. Before he could cross into Asia he had to secure his northern frontier against possible raids of barbarian tribes. He invaded Thrace with his army and overthrew the Triballi, then crossed the Danube and inflicted a defeat on the Getae. During his absence in these but slightly known regions, the rumor spread that he had been killed, and Thebes began a movement to throw off the Macedonian yoke. On his return to Greece he wreaked terrible vengeance on Thebes, not only as promoter of this revolt, but also as the most powerful of the Greek states.<P>4. Campaign in Asia Minor:<P>Having thus secured his rear, Alexander collected his army at Pella to cross the Hellespont, that he might exact the vengeance of Greece on Persia for indignities suffered at the hands of Xerxes, who "by his strength through his riches" had stirred, up "all against the realm of Grecia" (<a onClick="return mV(\'Dan\',11,2);">Da 11:2</a>, the King James Version). Steeped as he was in the romance of the Iliad, Alexander, when he came to the site of Troy, honored Achilles, whom he claimed as his ancestor, with games and sacrifices. This may have been the outflow of his own romantic nature, but there was also wise policy in it; the Greeks were more readily reconciled to the loss of their freedom when it was yielded up to one who revived in his own person the heroes of the Iliad. It may be noted how exactly the point of Alexander\'s invasion is indicated in Daniel\'s prophecy (<a onClick="return mV(\'Dan\',8,5);">Da 8:5</a>). From Troy he advanced southward, and encountered the Persian forces at the Granicus. While in the conflict Alexander exhibited all the reckless bravery of a Homeric hero. He at the same time showed the skill of a consummate general. The Persian army was dispersed with great slaughter.<P>Before proceeding farther into Persia, by rapid marches and vigorously pressed sieges, he completed the conquest of Asia Minor. Here, too, he showed his knowledge of the sensitiveness of Asiatic peoples to omens, by visiting Gordium, and cutting the knot on which, according to legend, depended the empire of Asia.<P>5. Battle of Issus and March through Syria to Egypt:<P>What he had done in symbol he had to make a reality; he had to settle the question of supremacy in Asia by the sword. He learned that Darius had collected an immense army and was coming to meet him. Although the Persian host was estimated at a half-million men, Alexander hastened to encounter it. Rapidity of motion, as symbolized in Daniel by the "he-goat" that "came from the west...and touched not the ground" (<a onClick="return mV(\'Dan\',8,5);">Da 8:5</a>), was Alexander\'s great characteristic. The two armies met in the relatively narrow plain of Issus, where the Persians lost, to a great extent, the advantage of their numbers; they were defeated with tremendous slaughter, Darius himself setting the example of flight. Alexander only pursued the defeated army far enough to break it up utterly. He began his march southward along the seacoast of Syria toward Egypt, a country that had always impressed the Greek imagination. Though most of the cities, on his march, opened their gates to the conqueror, Tyre and Gaza only yielded after a prolonged siege.<P>In the case of the latter of these, enraged at the delay occasioned by the resistance, and emulous of his ancestor, Alexander dragged its gallant defender Batis alive behind his chariot as Achilles had dragged the dead Hector. It ought to be noted that this episode does not appear in Arrian, usually regarded as the most authentic historian of Alexander. Josephus relates that after he had taken Gaza, Alexander went up to Jerusalem, and saw Jaddua the high priest, who showed him the prophecy of Daniel concerning him. The fact that none of the classic historians take any notice of such a detour renders the narrative doubtful: still it contains no element of improbability that the pupil of Aristotle, in the pursuit of knowledge, might, during the prosecution of the siege of Gaza, with a small company press into the hill country of Judea, at once to secure the submission of Jerusalem which occupied a threatening position in regard to his communications, and to see something of that mysterious nation who worshipped one God and had no idols.<P>6. Founding of Alexandria and Visit to the Shrine of Jupiter Ammon:<P>When he entered Egypt, the whole country submitted without a struggle. Moved at once by the fact that Pharos is mentioned in the Odyssey, and that he could best rule Egypt from the seacoast, he founded Alexandria on the strip of land opposite Pharos, which separated Lake Mareotis from the Mediterranean. The island Pharos formed a natural breakwater which made possible a spacious double harbor; the lake, communicating with the Nile, opened the way for inland navigation. As usual with Alexander, romance and policy went hand in hand. The city thus founded became the capital of the Ptolemies, and the largest city of the Hellenistic world. He spent his time visiting shrines, in the intervals of arranging for the government of the country. The most memorable event of his stay in Egypt was his expedition to the oracle or Jupiter Ammon (Amen-Ra) where he was declared the son of the god. To the Egyptians this meant no more than that he was regarded a lawful monarch, but he pretended to take this declaration as assigning to him a Divine origin like so many Homeric heroes. Henceforward, there appeared on coins Alexander\'s head adorned with the ram\'s horn of Amen-Ra. This impressed the eastern imagination so deeply that Mohammed, a thousand years after, calls him in the Quran Iskander dhu al-qarnain, "Alexander the lord of the two horns." It is impossible to believe that the writer of Daniel could, in the face of the universal attribution of the two ram\'s horns to Alexander, represent Persia, the power he overthrew, as a two-horned ram (<a onClick="return mV(\'Dan\',8,3,20);">Da 8:3, 20</a>), unless he had written before the expedition into Egypt.<P>7. The Last Battle with Darius:<P>Having arranged the affairs of Egypt, Alexander set out for his last encounter with Darius. In vain had Darius sent to Alexander offering to share the empire with him; the "king of Javan" (Revised Version margin) "was moved with anger against him" (<a onClick="return mV(\'Dan\',8,7);">Da 8:7</a>) and would have nothing but absolute submission. There was nothing left for Darius but to prepare for the final conflict. He collected a yet huger host than that he had had under him at Issus, and assembled it on the plain east of the Tigris. Alexander hastened to meet him. Although the plain around Gaugamela was much more suitable for the movements of the Persian troops, which consisted largely of cavalry, and gave them better opportunity of making use of their great numerical superiority to outflank the small Greek army, the result was the same as at Issus—overwhelming defeat and immense slaughter. The consequence of this victory was the submission of the greater portion of the Persian empire.<P>After making some arrangements for the government of the new provinces, Alexander set out in the pursuit of Darius, who had fled in the care or custody of Bessus, satrap of Bactria. Bessus, at last, to gain the favor of Alexander, or, failing that, to maintain a more successful resistance, murdered Darius. Alexander hurried on to the conquest of Bactria and Sogdiana, in the course of his expedition capturing Bessus and putting him to death. In imitation of Bacchus, he proceeded now to invade India. He conquered all before him till he reached the Sutlej; at this point his Macedonian veterans refused to follow him farther.<P>8. Close of His Life:<P>Thus compelled to give up hopes of conquests in the farther East, he returned to Babylon, which he purposed to make the supreme capital of his empire, and set himself, with all his superabundant energy, to organize his dominions, and fit Babylon for its new destiny. While engaged in this work he was seized with malaria, which, aggravated by his recklessness in eating and drinking, carried him off in his 33rd year.<P>9. His Influence:<P>Alexander is not to be estimated merely as a military conqueror. If he had been only this, he would have left no deeper impress on the world than Tamerlane or Attila. While he conquered Asia, he endeavored also to Hellenize her. He everywhere founded Greek cities that enjoyed at all events a municipal autonomy. With these, Hellenistic thought and the Hellenistic language were spread all over southwestern Asia, so that philosophers from the banks of the Euphrates taught in the schools of Athens. It was through the conquests of Alexander that Greek became the language of literature and commerce from the shores of the Mediterranean to the banks of the Tigris. It is impossible to estimate the effect of this spread of Greek on the promulgation of the gospel.``173';
isbe[382]='Alexandria`al-eg-zan’-dri-a (he Alexandreia).<P>1. History:<P>In 331 BC, Alexander the Great, on his way to visit the Oracle of Amon seeking divine honors, stopped at the west extremity of the Delta at the isle of Pharos the landing-place of Odysseus (Od. iv.35) His keen eye noted the strategic possibilities of the site occupied by the little Egyptian village of Rhacotis, and his decision was immediate to erect here, where it would command the gateway to the richest domain of his empire, a glorious city to be called by his own name. Deinocrates, greatest living architect, already famous as builder of the Temple of Diana, was given free hand and like a dream the most beautiful city of the ancient or modern world (with the single exception of Rome) arose with straight, parallel streets—one at least 200 feet wide—with fortresses, monuments, palaces, government buildings and parks all erected according to a perfect artistic plan. The city was about fifteen miles in circumference (Pliny), and when looked at from above represented a Macedonian cloak, such as was worn by Alexander’s heroic ancestors. A colossal mole joined the island to the main land and made a double harbor, the best in all Egypt.<P>Before Alexander died (323 BC) the future of the city as the commercial metropolis of the world was assured and here the golden casket of the conqueror was placed in a fitting mausoleum. Under the protection of the first two Ptolemies and Euergetes Alexandria reached its highest prosperity, receiving through Lake Mareotis the products of Upper Egypt, reaching by the Great Sea all the wealth of the West, while through the Red Sea its merchant vessels brought all the treasures of India and Arabia into the Alexandria docks without once being unladen.<P>The manufactories of Alexandria were extensive, the greatest industry however being shipbuilding, the largest merchant ships of the world and battleships capable of carrying 1,000 men, which could hurl fire with fearful effect, being constructed here. This position of supremacy was maintained during the Roman domination up to the 5th century during which Alexandria began to decline. Yet even when Alexandria was captured by the Arabs (641) under the caliph Omar, the general could report: "I have taken a city containing 4,000 palaces and 4,000 baths and 400 theaters." They called it a "city of marble" and believed the colossal obelisks, standing on crabs of crystal, and the Pharos, that white stone tower 400 ft. high, "wonder of the world," to be the creation of jinn, not of men. With oriental exaggeration they declared that one amphitheater could easily hold a million spectators and that it was positively painful to go upon the streets at night because of the glare of light reflected from the white palaces. But with the coming of the Arabs Alexandria began to decline. It sank lower when Cairo became the capital (circa 1000 AD), and received its death blow when a sea route to India was discovered by way of the Cape of Good Hope (circa 1500).<P>Today the ancient Alexandria lies entirely under the sea or beneath some later construction. Only one important relic remains visible, the so-called Pompey’s Pillar which dates from the reign of Diocletian. Excavations by the English (1895) and Germans (1898-99) have yielded few results, though Dr. G. Botti discovered the Serapeum and some immense catacombs, and only recently (1907) some fine sphinxes. In its most flourishing period the population numbered from 600,000 to 800,000, half of whom were perhaps slaves. At the close of the 18th century. it numbered no more than 7,000. Under the khedives it has recently gained something of its old importance and numbers now 320,000, of whom 46,000 are Europeans, chiefly Greeks (Baedeker, Handbook, 1902; Murray, Handbook, 1907).<P>2. The Jews in Alexandria:<P>Among the private papers of Alexander it is said a sketch was found outlining his vast plan of making a Greek empire which should include all races as harmonious units. In accordance with this, Europeans, Asiatics and Africans found in Alexandria a common citizenship. Indeed in several cities, under the Ptolemies, who accepted this policy, foreigners were even given superiority to natives. Egyptians and Greeks were conciliated by the introduction of a syncretic religion in which the greatest Greek god was worshipped as Osiris, Egyptian god of the underworld, whose soul appeared visibly in the form of the Apis bull.<P>This was the most popular and human form of the Egyptian worship. This new religion obtained phenomenal success. It was in furtherance of this general policy that the Jews in Alexandria were given special privileges, and though probably not possessing full civic rights, yet they "occupied in Alexandria a more Influential position than anywhere else in the ancient world" (Jewish Encyclopedia). To avoid unnecessary friction a separate district was given to the Jews, another to the Greeks and another to the native Egyptians. In the Greek section were situated the palaces of the Ptolemies, the Library and Museum. In the Egyptian district was the temple dedicated to Serapis (Osiris-Apis) which was only excelled in grandeur by the capitol at Rome. The Jews possessed many synagogues in their own district and in Philo’s day these were not confined to any one section of the city. Some synagogues seem to have exercised the right of asylum, the same as heathen temples. One of these was so large that the chazan signaled by a flag when the congregation should give the Amen! Each district had a practically independent political government.<P>The Jews were at first ruled by a Hebrew ethnarch. By the days of Augustus a Council of Elders (gerusia) had control, presided over by 71 archons. Because of their wealth, education and social position they reached high public office. Under Ptol. VI and Cleopatra the two generals-in-chief of the royal army were Jews. Ptol. I had 30,000 Jewish soldiers, in his army, whose barracks have only recently been discovered. It may have been a good thing that the persecution of Antiochus Epiphanes (2nd century BC) checked Jewish Hellenization. During the Roman supremacy the rights of the Jews were maintained, except during their persecution for a brief period by the insane Caligula, and the control of the most important industries, including the corn trade, came into their hands.<P>When Christianity became the state religion of Egypt the Jews at once began to be persecuted. The victory of Heraclius over the Persians (629 AD) was followed by such a massacre of the Jews that the Coptics of Egypt still denominate the first week in Lent as the "Fast of Heraclius." Wisdom and many other influential writings of the Jews originated in Alexandria. Doubtless numbers of the recently discovered documents from the Cairo genizah came originally from Alexandria. But the epochal importance of Alexandria is found in the teaching which prepared the Hebrew people for the reception of a gospel for the whole world, which was soon to be preached by Hebrews from Hellenized Galilee.<P>3. Alexandria’s Influence on the Bible:<P>(1) In <a onClick="return mV(\'Dan\',11,\'1-\');">Da 11</a> the Ptolomies of Alexandria and their wives are made a theme of prophecy. Apollos, the "orator," was born in Alexandria (<a onClick="return mV(\'Act\',18,24);">Ac 18:24</a>). Luke twice speaks of himself and Paul sailing in "a ship of Alexandria" (<a onClick="return mV(\'Act\',27,6);">Ac 27:6</a>; <a onClick="return mV(\'Act\',28,11);">28:11</a>). Stephen ‘disputed’ in Jerusalem in the synagogue of the Alexandrians (<a onClick="return mV(\'Act\',6,9);">Ac 6:9</a>). These direct references are few, but the influence of Alexandria on the Bible was inestimable.<P>(2) The Septuagint, translated in Alexandria (3rd to 2nd centuries BC), preserves a Hebrew text 1,000 years older than any now known. This translation if not used by Jesus was certainly used by Paul and other New Testament writers, as shown by their quotations. It is Egyptian even in trifles. This Greek Bible not only opened for the first time the "Divine Oracles" to the Gentiles and thus gave to the Old Testament an international influence, but it affected most vitally the Hebrew and Christian development.<P>(3) The Alexandrinus Codex (4th to 5th centuries) was the first of all the great uncials to come into the hands of modern scholars. It was obtained in Alexandria and sent as a present to the king of England (1628) by Cyrellus Lucaris, the Patriarch of Constantinople. The Sinaiticus and Vaticanus uncials with many other most important Bible manuscripts—Hebrew, Greek, Coptic and Syriac—came from Alexandria.<P>(4) John and several other New Testament writings have justly been regarded as showing the influence of this philosophic city. Neither the phraseology nor conceptions of the Fourth Gospel could have been grasped in a world which Alexandria had not taught. Pfleiderer’s statement that He "may be termed the most finished treatise of the Alexandria philosophy" may be doubted, but no one can doubt the fact of Alexandrian influence on the New Testament.<P>4. Influence of Alexandria on Culture:<P>With the founding of the University of Alexandria began the "third great epoch in the history of civilization" (Max Muller). It was modeled after the great school of Athens, but excelled, being preeminently the "university of progress" (Mahaffy). Here for the first time is seen a school of science and literature, adequately endowed and offering large facilities for definite original research. The famous library which at different eras was reported as possessing from 400,000 to 900,000 books and rolls—the rolls being as precious as the books—was a magnificent edifice connected by marble colonnades with the Museum, the "Temple of the Muses." An observatory, an anatomical laboratory and large botanical and Zoological gardens were available. Celebrated scholars, members of the various faculties, were domiciled within the halls of the Museum and received stipends or salaries from the government.<P>The study of mathematics, astronomy, poetry and medicine was especially favored (even vivisection upon criminals being common); Alexandrian architects were sought the world over; Alexandrian inventors were almost equally famous; the influence of Alexandrian art can still be marked in Pompeii and an Alexandrian painter was a hated rival of Apelles. Here Euclid wrote his Elements of Geometry; here Archimedes, "that greatest mathematical and inventive genius of antiquity," made his spectacular discoveries in hydrostatics and hydraulics; here Eratosthenes calculated the size of the earth and made his other memorable discoveries; while Ptolemy studied here for 40 years and published an explanation of the stellar universe which was accepted by scientists for 14 centuries, and established mathematical theories which are yet the basis of trigonometry. "Ever since this epoch the conceptions of the sphericity of the earth, its poles, axis, the equator, the arctic and antarctic circles, the equinoctial points, the solstices, the inequality of climate on the earth’s surface, have been current notions among scientists. The mechanism of the lunar phases was perfectly understood, and careful though not wholly successful calculations were made of inter-sidereal distances. On the other hand literature and art flourished under the careful protection of the court. Literature and its history, philology and criticism became sciences" (Alexandria Weber).<P>It may be claimed that in literature no special originality was displayed though the earliest "love storms" and pastoral poetry date from this period (Mahaffy); yet the literature of the Augustan Age cannot be understood "without due appreciation of the character of the Alexandrian school" (EB, 11th ed.), while in editing texts and in copying and translating manuscripts inconceivable patience and erudition were displayed. Our authorized texts of Homer and other classic writers come from Alexandria not from Athens. All famous books brought into Egypt were sent to the library to be copied.<P>The statement of Josephus that Ptolemy Philadelphus (285-247) requested the Jews to translate the Old Testament into Greek is not incredible. It was in accordance with the custom of that era. Ptol. Euergetes is said to have sent to Athens for the works of Aeschylus, Sophocles, Euripides, etc., and when these were transcribed, sent back beautiful copies to Greece and kept the originals! No library in the world except the prophetic library in Jerusalem was ever as valuable as the two Alexandrian libraries. The story that the Arabs burned it in the 7th century is discredited and seemingly disproved (Butler). At any rate, after this period we hear of great private libraries in Alexandria, but the greatest literary wonder of the world has disappeared.<P>5. Influence on Philosophy:<P>Though no department of philosophy was established in the Museum, nevertheless from the 3rd century BC to the 6th century AD it was the center of gravity in the philosophic world. Here Neo-Pythagoreanism arose. Here Neo-Platonism, that contemplative and mystical reaction against the materialism of the Stoics, reached its full flower. It is difficult to overestimate the influence of the latter upon religious thought. In it the profoundest Aryan speculations were blended with the sublimest Semitic concepts. Plato was numbered among the prophets. Greece here acknowledged the Divine Unity to which the Old Testament was pledged. Here the Jew acknowledged that Athens as truly as Jerusalem had taught a vision of God. This was the first attempt to form a universal religion.<P>The Alexandrian philosophy was the Elijah to prepare the way for a Saviour of the world. The thought of both Sadducee and Pharisee was affected by it and much late pre-Christian Jewish literature is saturated with it. Neo-Platonism drew attention to the true relation between matter and spirit, good and evil, finite and infinite; it showed the depth of antagonism between the natural and spiritual, the real and ideal; it proclaimed the necessity of some mystic union between the human and the Divine. It stated but could not solve the problem. Its last word was escape, not reconciliation (Ed. Caird). Neo-Platonism was the "germ out of which Christian theology sprang" (Caird) though later it became an adverse force. Notwithstanding its dangerous teaching concerning evil, it was on the whole favorable to piety, being the forerunner of mysticism and sympathetic with the deepest, purest elements Of a spiritual religion.<P>6. Christian Church in Alexandria:<P>According to all tradition, Mark the evangelist, carried the gospel to Alexandria, and his body rested here until removed to Venice, 828 AD. From this city Christianity reached all Egypt and entered Nubia, Ethiopia and Abyssinia. During the 4th century, ten councils were held in Alexandria, it being theological and ecclesiastical center of Christendom. The first serious persecution of Christians by heathen occurred here under Decius (251) and was followed by many others, the one under Diocletian (303-11) being so savage that the native Coptic church still dates its era from it. When the Christians reached political power they used the same methods of controversy, wrecking the Caesarion in 366 and the Serapeum twenty-five years later. Serapis (Osiris-Apis) was the best beloved of all the native deities. His temple was built of most precious marbles and filled with priceless sculptures, while in its cloisters was a library second only to the Great Library of the Museum. When Christianity became the state religion of Egypt the native philosophers, moved by patriotism, rallied to the support of Serapis. But Theodosius (391) prohibited idolatry, and led by the bishop, the Serapeum was seized, and smitten by a soldier’s battle-axe, the image—which probably represented the old heathen religion at its best—was broken to pieces, and dragged through the streets.<P>That day, as Steindorff well puts it, "Egyp paganism received its death blow; the Egyptian religion fell to pieces" (History of Egypt). Thereafter heathen worship hid itself in the dens and caves of the earth. Even secret allegiance to Serapis brought persecution and sometimes death. The most appalling tragedy of this kind occurred in 415 when Hypatia, the virgin philosopher, celebrated equally for beauty, virtue and learning, was dragged by a mob to the cathedral, stripped, and torn to pieces before the altar. Some of the greatest Christian leaders used all their influence against such atrocities, but the Egyptian Christians were always noted for their excitability. They killed heretics easily, but they would themselves be killed rather than renounce the very slightest and most intangible theological tenet. It only needed the change of a word e.g. in the customary version to raise a riot (Expos, VII, 75).<P>Some curious relics of the early Egyptian church have very recently come to light. The oldest autographic Christian letter known (3rd century) proves that at that time the church was used as a bank, and its ecclesiastics (who, whether priests or bishops, were called "popes") were expected to help the country merchants in their dealings with the Roman markets. Some sixty letters of the 4th century written to a Christian cavalry officer in the Egyptian army are also preserved, while papyri and ostraca from circa 600 AD show that at this time no deacon could be ordained without having first learned by heart as much as an entire Gospel or 25 Psalms and two epistles of Paul, while a letter from a bishop of this period is filled with Scripture, as he anathematizes the "oppressor of the poor," who is likened unto him who spat in the face of our Lord on the cross and smote Him on the head (Adolph Deissmann, Light from the Ancient East, etc., 1910). Oppression of Jews and heretics was not, however, forbidden and during the 5th and 6th centuries. Egypt was a battle-field in which each sect persecuted every other.<P>Even when the Arabs under the caliph Omar captured the city on Good Friday (641), Easter Day was spent by the orthodox in torturing supposed heretics! The next morning the city was evacuated and Jews and Coptics received better treatment from the Arabs than they had from the Roman or Greek ecclesiastics. After the Arab conquest the Coptic church, being released from persecution, prospered and gained many converts even from the Mohammedans.<P>But the Saracenic civilization and religion steadily displaced the old, and the native learning and native religion soon disappeared into the desert. By the 8th century, Arabic had taken the place of Greek and Coptic, not only in public documents but in common speech. Then for 1,000 years the Egyptian church remained without perceptible influence on culture or theology. But its early influence was immeasurable and can still be marked in Christian art, architecture and ritual as well as in philosophy and theology. Perhaps its most visible influence was in the encouragement of image-reverence and asceticism. It is suggestive that the first hermit (Anthony) was a native Egyptian, and the first founder of a convent (Pachomius) was a converted Egyptian (heathen) monk. Today Alexandria has again become a Christian metropolis containing Coptics, Romans, Greeks, Armenians, Maronites, Syrians, Chaldeans and Protestants. The Protestants are represented by the Anglican church, the Scotch Free church, the evangelical church of Germany and the United Presbyterian church of the U.S. (For minute divisions see Catholic Encyclopedia)<P>7. Catechetical School in Alexandria:<P>The first theological school of Christendom was founded in Alexandria. It was probably modeled after earlier Gnostic schools established for the study of religious philosophy. It offered a three years’ course. There were no fees, the lecturers being supported by gifts from rich students. Pantaenus, a converted Stoic philosopher, was its first head (180). He was followed by Clement (202) and by Origen (232) under whom the school reached its zenith. It always stood for the philosophical vindication of Christianity. Among its greatest writers were Julius Africanus (215), Dionysius (265), Gregory (270), Eusebius (315), Athanasius (373) and Didymus (347), but Origen (185-254) was its chief glory; to him belongs the honor of defeating paganism and Gnosticism with their own weapons; he gave to the church a "scientific consciousness," his threefold interpretation of Scripture affected Biblical exegesis clear down to the last century.<P>Arius was a catechist in this institution, and Athanasius, the "father of orthodoxy" and "theological center of the Nicene age" (Schaff), though not officially connected with the catechetical school was greatly affected by it, having been bred and trained in Alexandria. The school was closed toward the end of the 4th century because of theological disturbances in Egypt, but its work was continued from Caesarea and other centers, affecting profoundly Western teachers like Jerome and Ambrose, and completely dominating Eastern thought. From the first there was a mystical and Docetic tendency visible, while its views of inspiration and methods of interpretation, including its constant assumption of a secret doctrine for the qualified initiate, came legitimately from Neo-Platonism. For several centuries after the school disbanded its tenets were combated by the "school of Antioch," but by the 8th century the Alexandrian theology was accepted by the whole Christian world, east and west.<P>LITERATURE.<P>Besides works mentioned in the text see especially: Petrie, History of Egypt (1899), V, VI, Mahaffy, Empire of the Ptolemies (1895), Progress of Hellenism (1905); Butler, Arab Conquest of Egypt (1902); Ernst Sieglin, Ausgrabungen in Alexandrien (1908); Harnack, Lehrbuch der Dogmengeschichte (1895-1900), and in New Sch-Herz (1910); Inge, Alexandrian Theology in Encyclopedia of Religion and Ethics (1908); Ed. Caird, Evolution of Theology in the Greek Philosophers (1904); Pfleiderer, Philosophy and Development of Religion (1894); Schaff, History of Christian Church (1884-1910); Zogheb, Etudes sur l’ancienne Alexandrie (1909).``26';
isbe[383]='Alexandrians`al-eg-zan\'-dri-ans (Alexandreis): Jews of Alexandria, who had, with the Libertines and Cyrenians, a synagogue in Jerusalem. They were among those who disputed with Stephen (<a onClick="return mV(\'Act\',6,9);">Ac 6:9</a>).``1';
isbe[384]='Aliah`a-li\'-a (\'alyah): One of the dukes, or heads of thousands of Edom (<a onClick="return mV(\'1Ch\',1,51);">1Ch 1:51</a>). In <a onClick="return mV(\'Gen\',36,40);">Ge 36:40</a> the name is Alvah (\'alwah), the only difference being the change of the weaker w, of Genesis to the somewhat stronger, y, of the later Chronicles, a change which is not infrequent in Hebrew. He is not to be confused, as in HDB, with the Alian of the same chapter.``1';
isbe[385]='Alian`a-li\'-an (\'alyan): A descendant of Esau, and son of Shobal (<a onClick="return mV(\'1Ch\',1,40);">1Ch 1:40</a>). In the corresponding earlier genealogy (<a onClick="return mV(\'Gen\',36,23);">Ge 36:23</a>) the same person is given as Alvan (\'alwan), the change of the third consonant being a simple one, common to Hebrew, occurring similarly in <a href="./study/isbe/search.html?string=ALIAH">Aliah</a> (which see). Alian is not to be identified with Aliah, since the groups of names in which these occur are quite different, and the context in each case is not the same.``1';
isbe[386]='Alien`al’-yen: Found in the King James Version for ger, (<a onClick="return mV(\'Exd\',18,3);">Ex 18:3</a>) = "guest," hence: "foreigner," "sojourner" the Revised Version (British and American); also for nekhar (<a onClick="return mV(\'Isa\',61,5);">Isa 61:5</a>) = "foreign," "a foreigner" the Revised Version (British and American) (concrete), "heathendom" (abstract), "alien," "strange" (-er), and for nokhri (<a onClick="return mV(\'Deu\',14,21);">De 14:21</a> the Revised Version (British and American) "foreigner"; compare <a onClick="return mV(\'Job\',19,15);">Job 19:15</a>; <a onClick="return mV(\'Psa\',69,8);">Ps 69:8</a>; <a onClick="return mV(\'Lam\',5,2);">La 5:2</a>)—"strange," in a variety of degrees and meanings: "foreign," "non-relative," "adulterous," "different," "wonderful," "alien," "outlandish," "strange." In the New Testament we find apellotriomenos (<a onClick="return mV(\'Eph\',4,18);">Eph 4:18</a>; <a onClick="return mV(\'Col\',1,21);">Col 1:21</a>) = "being alienated," and allotrios (<a onClick="return mV(\'Hbr\',11,34);">Heb 11:34</a>) = "another’s," "not one’s own," hence: "foreign," "not akin," "hostile." In the Old Testament the expression was taken in its literal sense, referring to those who were not Israelites—the heathen; in the New Testament it is given a figurative meaning, as indicating those who have not become naturalized in the kingdom of God, hence are outside of Christ and the blessing of the gospel.``77';
isbe[387]='Alienate`al\'-yen-at (\'abhar; apallotrioo, "to estrange from"): In Old Testament, for the break between husband and wife caused by unfaithfulness to the marriage vow (<a onClick="return mV(\'Jer\',6,8);">Jer 6:8</a>; <a onClick="return mV(\'Eze\',23,17);">Eze 23:17</a>); also applied to the diversion of property (<a onClick="return mV(\'Eze\',48,14);">Eze 48:14</a>). In New Testament, spiritually, for the turning of the soul from God (<a onClick="return mV(\'Eph\',2,12);">Eph 2:12</a>; <a onClick="return mV(\'Col\',1,21);">Col 1:21</a>). The Greek allotrios, which is the root of the verb, is the opposite of id-i-os, "one\'s own." The word implies a former state, whence the person or thing has departed, and that, generally, by deterioration.``1';
isbe[388]='Alive`a-liv\' (chai, "living"; zao, "to live," anazao, "to live again"): These Hebrew and Greek originals are the chief terms for life in both Testaments. They cover all life, including soul and spirit, although primarily referring to physical vitality. Striking examples may be cited: "Is your father yet alive?" (<a onClick="return mV(\'Gen\',43,7);">Ge 43:7</a>); "To whom he also showed himself alive" (<a onClick="return mV(\'Act\',1,3);">Ac 1:3</a>). Often used of God: "the living God" (<a onClick="return mV(\'Jos\',3,10);">Jos 3:10</a>); also of the resurrection life: "In Christ shall all be made alive" (<a onClick="return mV(\'1Cr\',15,22);">1Co 15:22</a>); of the soul\'s regenerate life: "Reckon...yourselves...alive unto God," "as those that are alive from the dead" (<a onClick="return mV(\'Rom\',6,11);">Ro 6:11:13</a> the King James Version). The term is vital with the creative energy of God; the healing, redemptive, resurrection life of Christ; the renewing and recreative power of the Holy Spirit.``139';
isbe[389]='All`ol: Used in various combinations, and with different meanings.<P>(1) All along, "Weeping all along as he went" (<a onClick="return mV(\'Jer\',41,6);">Jer 41:6</a>), i.e. throughout the whole way he went, feigning equal concern with the men from Shiloh, etc., for the destruction of the Temple, so as to put them off their guard.<P>(2) All in all, "That God may be all in all" (<a onClick="return mV(\'1Cr\',15,28);">1Co 15:28</a>, Greek: panta en pasin, "all things in all (persons and) things"). "The universe, with all it comprises, will wholly answer to God’s will and reflect His mind" (Dummelow).<P>(3) All one, "It is all one" (<a onClick="return mV(\'Job\',9,22);">Job 9:22</a>), "it makes no difference whether I live or die."<P>(4) At all, "If thy father miss me at all" (<a onClick="return mV(\'1Sa\',20,6);">1Sa 20:6</a>), "in any way," "in the least."<P>(5) All to, "All to brake his skull" (<a onClick="return mV(\'Jdg\',9,53);">Jdg 9:53</a> the King James Version) an obsolete form signifying "altogether"; "broke his skull in pieces."<P>(6) Often used indefinitely of a large number or a great part, "All the cattle of Egypt died" (<a onClick="return mV(\'Exd\',9,6);">Ex 9:6</a>; compare <a onClick="return mV(\'Exd\',9,19,25);">Ex 9:19, 25</a>); "all Judea, and all the region round about" (<a onClick="return mV(\'Mat\',3,5);">Mt 3:5</a>); "that all the world should be enrolled" (<a onClick="return mV(\'Luk\',2,1);">Lu 2:1</a>); "all Asia and the world" (<a onClick="return mV(\'Act\',19,27);">Ac 19:27</a>); "All (people) verily held John to be a prophet" (<a onClick="return mV(\'Mar\',11,32);">Mr 11:32</a>).``91';
isbe[390]='Allammelech`a-lam\'-e-lek (\'allammelekh, "oak of a king"): A town in the tribe of Asher, the location of which is not known (<a onClick="return mV(\'Jos\',19,26);">Jos 19:26</a>; the King James Version Alammelech).``1';
isbe[391]='Allar`al\'-ar (the King James Version, Aalar; Aalar): Occurring once (1Esdras 5:36) and used apparently to indicate a place from which certain Jews came on the return from captivity, who could not prove their lineage, and were excluded for this reason from the privileges of the priesthood. HDB identifies with Immer of <a onClick="return mV(\'Ezr\',2,59);">Ezr 2:59</a> and <a onClick="return mV(\'Neh\',7,61);">Ne 7:61</a> (which see), but this is not at all certain.``1';
isbe[392]='Allay`a-la’ (heniach, "to cause to rest," "soothe": "Gentleness allayeth [lit., "pacifieth"] great offenses" [<a onClick="return mV(\'Ecc\',10,4);">Ec 10:4</a>]): The word is applied to what "excites, disturbs and makes uneasy" (Smith, Synonyms Discriminated, 106).``1';
isbe[393]='Allege`a-lej\' ("paratithemi," "to set forth," <a onClick="return mV(\'Act\',17,3);">Ac 17:3</a>): It is not used in the English Bible in its more modern and usual sense, "to assert," but is about equivalent to "to prove."``1';
isbe[394]='Allegiance`a-le\'-jans (mishmereth, "a charge," from shamar, "to keep," <a onClick="return mV(\'1Ch\',12,29);">1Ch 12:29</a>): the Revised Version, margin gives as literal meaning, "kept the charge of the house of Saul," which revisers consider figurative for "maintaining their loyalty and fidelity," i.e. "allegiance."``1';
isbe[395]='Allegory`al’-e-go-ri: The term allegory, being derived from allo agoreuein, signifying to say something different from what the words themselves imply, can etymologically be applied to any figurative form of expression of thought. In actual usage in theology, the term is employed in a restricted sense, being used however in three ways, namely, rhetorically, hermeneutically and homiletically. In the first-mentioned sense it is the ordinary allegory of rhetoric, which is usually defined as an extended or continued metaphor, this extension expanding from two or more statements to a whole volume, like Bunyan’s Pilgrim’s Progress. Allegories of this character abound in the Scriptures, both in Old Testament and in New Testament. Instructive examples of this kind are found in <a onClick="return mV(\'Psa\',80,\'8-19\');">Ps 80:8-19</a>; <a onClick="return mV(\'Ecc\',12,\'3-7\');">Ec 12:3-7</a>; <a onClick="return mV(\'Jhn\',10,\'1-16\');">Joh 10:1-16</a>; <a onClick="return mV(\'Eph\',6,\'11-17\');">Eph 6:11-17</a>. According to traditional interpretation of both the Jewish exegesis and of the Catholic and Protestant churches the entire book of Canticles is such an allegory. The subject is discussed in full in Terry’s Biblical Hermeneutics, etc., chapter vii, 214-38.<P>In the history of Biblical exegesis allegory represents a distinct type of interpretation, dating back to pre-Christian times, practiced particularly by the Alexandrian Jews, and adopted by the early Church Fathers and still practiced and defended by the Roman Catholic church. This method insists that the literal sense, particularly of historical passages, does not exhaust the divinely purposed meaning of such passages, but that these latter also include a deeper and higher spiritual and mystical sense. The fourfold sense ascribed to the Scriptures finds its expression in the well-known saying: Littera gesta docet; quid credas, allegorica; moralis, quid agas, quid speres, anagogica ("The letter shows things done; what you are to believe, the allegoric; what you are to do, the moral; what you are to hope, the anagogic"), according to which the allegorical is the hidden dogmatical meaning to be found in every passage.<P>Cremer, in his Biblico-Theological New Testament Lexicon, shows that this method of finding a hidden thought behind the simple statement of a passage, although practiced so extensively on the Jewish side by Aristobulus and especially Philo, is not of Jewish origin, but was, particularly by the latter, taken from the Alexandrian Greeks (who before this had interpreted Greek mythology as the expression of higher religious conceptions) and applied to a deeper explanation of Old Testament historical data, together with its theophanies, anthropomorphisms, anthropopathies, and the like, which in their plain meaning were regarded as unworthy of a place in the Divine revelation of the Scriptures. Such allegorizing became the common custom of the early Christian church, although not practiced to the same extent in all sections, the Syrian church exhibiting the greatest degree of sobriety in this respect. In this only Jewish precedent was followed; the paraphrases commonly known as the Targum, the Midrash, and later in its most extreme form in the Kabbalah, all showed this mark of eisegesis instead of exegesis. This whole false hermeneutical principle and its application originated doubtless in an unhistorical conception of what the Scriptures are and how they originated. It is characteristic of the New Testament, and one of the evidences of its inspiration, that in the entire Biblical literature of that age, both Jewish and Christian, it is the only book that does not practice allegorizing but abides by the principle of the literal interpretation. Nor is Paul’s exegesis in <a onClick="return mV(\'Gal\',4,\'21-31\');">Ga 4:21-31</a> an application of false allegorical methods. Here in <a onClick="return mV(\'Gal\',4,24);">Ga 4:24</a> the term allegoroumena need not be taken in the technical sense as expressive of a method of interpretation, but merely as a paraphrase of the preceding thought; or, if taken technically, the whole can be regarded as an argumentum ad hominem, a way of demonstration found also elsewhere in Paul’s writings.<P>The Protestant church, beginning with Luther, has at all times rejected this allegorizing and adhered to the safe and sane principle, practiced by Christ and the entire New Testament, namely, Sensum ne inferas, sed efferas ("Do not carry a meaning into [the Scriptures] but draw it out of [the Scriptures]"). It is true that the older Protestant theology still adheres to a sensus mysticus in the Scriptures, but by this it means those passages in which the sense is conveyed not per verba (through words), but per res verbis descriptas ("through things described by means of words"), as e.g. in the parable and the type.<P>In homiletics allegorizing is applied to the method which draws spiritual truths from common historical statements, as e.g. when the healing of a leper by Christ is made the basis of an exposition of the healing of the soul by the Saviour. Naturally this is not interpretation in the exegetical sense.``159';

isbe[397]='Allemeth`al\'-e-meth (\'allemeth, "concealment"; the King James Version Alemeth, <a onClick="return mV(\'1Ch\',6,60);">1Ch 6:60</a>): Name of a town in tribe of Benjamin, near Anathoth, one of the cities given to the sons of Aaron, the same as Almon of <a onClick="return mV(\'Jos\',21,18);">Jos 21:18</a>. The the King James Version <a href="./study/isbe/search.html?string=ALEMETH">ALEMETH</a> (which see) is based upon the Hebrew reading \'alemeth. Its site is the modern Almit, a village a short distance Northeast of Anathoth.``1';
isbe[398]='Alliance`a-li’-ans. 1. In the Patriarchal Stories:<P>Frequent references are made to alliances between the patriarchs and foreigners. Abraham is reported to have had "confederates" among the chiefs of the Canaanites (<a onClick="return mV(\'Gen\',14,13);">Ge 14:13</a>). He also allied with Abimelech, king of Gerar (<a onClick="return mV(\'Gen\',21,\'22-34\');">Ge 21:22-34</a>). Isaac’s alliance with Abimelech (<a onClick="return mV(\'Gen\',26,\'26-34\');">Ge 26:26-34</a>), which is offered as an explanation of the name Beer-sheba (<a onClick="return mV(\'Gen\',26,33);">Ge 26:33</a>), appears to be a variant of the record of alliance between Abraham and Abimelech. Jacob formed an alliance with Laban, the Syrian (<a onClick="return mV(\'Gen\',31,\'44-54\');">Ge 31:44-54</a>), by which Gilead was established as a boundary line between Israel and Aramaic. These treaties refer, in all probability, to the early period of Israel’s history, and throw a good deal of light upon the relation between Israel and the Philistines and the Syrians immediately after the conquest of Canaan.<P>2. In Pre-Canaanitic History:<P>The only reference to an alliance between Israel and foreign people prior to the conquest of Canaan, that might be regarded as historical, is that made between Israel and the Kenite tribes at the foot of Sinai, the precise nature of which, however, is not very clearly indicated. Such alliances led to intermarriages between the members of the allied tribes. Thus Moses married a Kenite woman (<a onClick="return mV(\'Jdg\',1,16);">Jdg 1:16</a>; <a onClick="return mV(\'Jdg\',4,11);">4:11</a>). The patriarchal marriages refer to the existing conditions after the conquest. Possibly one more alliance belonging to that period is that between Israel and Moab (<a onClick="return mV(\'Num\',25,\'1-3\');">Nu 25:1-3</a>). According to the narrative, Israel became attached to the daughters of Moab, at Shittim, and was led astray after Baal-peor. Its historicity is proven from the prophetic allusions to this event (compare <a onClick="return mV(\'Hsa\',9,10);">Ho 9:10</a>; <a onClick="return mV(\'Mic\',6,5);">Mic 6:5</a>).<P>3. During the Conquest:<P>The invading hordes of Israel met with strong opposition on the part of the natives of Palestine (<a onClick="return mV(\'Jdg\',1,21,\'27-36\');">Jdg 1:21, 27-36</a>). In time, alliances were formed with some of them, which generally led, as might be expected, to considerable trouble. One concrete illustration is preserved in the story of the Gibeonites (<a onClick="return mV(\'Jos\',9,\'1\');">Jos 9</a>). Intermarriages were frequent. The tribe of Judah thus became consolidated through the alliance and the amalgamation with the Kenites and Calebites (<a onClick="return mV(\'Jdg\',1,\'10-16\');">Jdg 1:10-16</a>). These relations between Israel and the Canaanites threatened the preservation of Yahwism.<P>4. The Monarchy:<P>Prohibitory measures were adopted in the legal codes with a view to Jewish separateness and purity (<a onClick="return mV(\'Exd\',23,32);">Ex 23:32</a>; <a onClick="return mV(\'Exd\',34,12,15);">34:12, 15</a>; <a onClick="return mV(\'Deu\',7,2);">De 7:2</a>; compare <a onClick="return mV(\'Jdg\',2,2,3);">Jdg 2:2-3</a>; <a onClick="return mV(\'Lev\',18,3,4);">Le 18:3-4</a>; <a onClick="return mV(\'Lev\',20,22);">20:22</a> f.).<P>But at a very early date in the history of the Jewish kingdom the official heads of the people formed such alliances and intermarried. David became an ally to Achish of Gath (<a onClick="return mV(\'1Sa\',27,\'2-12\');">1Sa 27:2-12</a>) and later on with Abner, which led to the consolidation of Judah and Israel into one kingdom (<a onClick="return mV(\'2Sa\',3,\'17-21\');">2Sa 3:17-21</a>; <a onClick="return mV(\'2Sa\',5,\'1-3\');">5:1-3</a>). It appears likewise that Toi, king of Hamath, formed an alliance with David (<a onClick="return mV(\'2Sa\',9,10);">2Sa 9:10</a>) and that Hiram of Tyre was his ally (<a onClick="return mV(\'1Ki\',5,12);">1Ki 5:12</a> a). Alliances wrath foreign nations became essential to the progress of trade and commerce during the reign of Solomon. Two of his treaties are recorded: one with Hiram of Tyre (<a onClick="return mV(\'1Ki\',5,\'12-18\');">1Ki 5:12-18</a>; <a onClick="return mV(\'1Ki\',9,\'11-14\');">9:11-14</a>) and one with Pharaoh, king of Egypt (<a onClick="return mV(\'1Ki\',9,16);">1Ki 9:16</a>).<P>5. The Divided Kingdom:<P>After the disruption, Shishak of Egypt invaded Judea, and probably also Israel. This meant an abrogation of the treaty existing between Israel and Egypt during the reign of Solomon. In consequence of the war between the two kingdoms, Asa formed an alliance with Benhadad of Syria (<a onClick="return mV(\'1Ki\',15,\'18-20\');">1Ki 15:18-20</a>). Later on Ahab sought an alliance with Ben-hadad (<a onClick="return mV(\'1Ki\',20,\'31-34\');">1Ki 20:31-34</a>). Friendly relations ensued between Israel and Judah, during the reign of Jehoshaphat, which continued to the close of the dynasty of Omri (<a onClick="return mV(\'1Ki\',22,\'2-4\',50);">1Ki 22:2-4, 50</a>; <a onClick="return mV(\'2Ki\',3,7);">2Ki 3:7</a>). With the accession of Jehu, hostilities were resumed. In the Syro-Ephraimitic war, Israel was allied with Syria, and Judah with Assyria (<a onClick="return mV(\'2Ki\',16,\'6-9\');">2Ki 16:6-9</a>; <a onClick="return mV(\'Isa\',7,\'1\');">Isa 7</a>). This opened the way to the Assyrian power into both kingdoms. Relief against Assyria was sought in Egypt; Hoshea rebelled against Shalmaneser, and allied with So (Sevechus, the Shabaka of the 25th Dynasty) and thus brought about the fall of Samaria.<P>6. The Kingdom of Judah:<P>Hezekiah likewise sought an alliance with So, but derived no assistance from him. He is recorded to have formed friendly relations with Berodach-baladan of Babylon (<a onClick="return mV(\'2Ki\',20,\'12-18\');">2Ki 20:12-18</a>). These alliances resulted in the introduction of foreign cults into Jerusalem (<a onClick="return mV(\'2Ki\',16,10,11);">2Ki 16:10-11</a>). During the reign of Manasseh, Yahwism was seriously threatened by foreign religious practices (<a onClick="return mV(\'2Ki\',21,\'2-9\');">2Ki 21:2-9</a>). The protesting spirit against the prevailing conditions found expression in the Deuteronomic code, which emphasizes the national policy. Josiah fought against Pharaoh- necoh as an ally of Assyria (<a onClick="return mV(\'2Ki\',23,29);">2Ki 23:29</a>). Jehoahaz continued the Assyrian alliance and was dethroned in consequence by Pharaoh-necoh (<a onClick="return mV(\'2Ki\',23,33);">2Ki 23:33</a>). Jehoiakin was disposed to be friendly with Egypt, and even after his subjection to Nebuchadnezzar, he remained loyal to the Pharaoh (<a onClick="return mV(\'2Ki\',23,35);">2Ki 23:35</a>). Zedekiah came to the throne as an ally of Babylon. When he broke this alliance, the destruction of Jerusalem resulted (<a onClick="return mV(\'2Ki\',25,\'1-\');">2Ki 25</a>).<P>7. In Post-exilic Times:<P>Judas Maccabeus sought an alliance with the Romans (1Macc 8; Josephus, Ant, XII, x, 6) which was renewed by Jonathan (1Macc 12:1; Ant, XIII, v, 8) and by Simon (1Macc 15:17; Ant, XIII, vii, 3). Treaties were concluded with the Spartans (1Macc 12:2; 14:20; Ant, XII, iv, 10; XIII, v, 8). The Roman alliance was again renewed by Hyrcanus about 128 BC (Ant., XIII, ix, 2). This alliance proved to be of fatal consequence to the independence of the Jews (Ant., XIV, iv, 4; and xiv, 5). For the rites connected with the formation of the earlier alliances,`<a href="./study/isbe/search.html?string=COVENANT">COVENANT</a>`27';
isbe[399]='Allied`a-lid\' (qarobh, "near," as in <a onClick="return mV(\'Gen\',45,10);">Ge 45:10</a>; <a onClick="return mV(\'Exd\',13,17);">Ex 13:17</a>, etc.): <a onClick="return mV(\'Neh\',13,4);">Ne 13:4</a> refers either to family ties, as in <a onClick="return mV(\'Rth\',2,20);">Ru 2:20</a>, or to intimate association.``1';
isbe[400]='Allom`al\'-om (Allon): the Revised Version (British and American) <a href="./study/isbe/search.html?string=ALLON">ALLON</a> (which see): One of the families of the "servants of Solomon," whose descendants returned with Zerubbabel from Babylon in the First Return, 537 BC (1Esdras 5:34). The name is not found in the parallel lists of Ezra and Nehemiah, although some have tried to identify with the last name of each list, Ami of <a onClick="return mV(\'Ezr\',2,57);">Ezr 2:57</a>, and Amon of <a onClick="return mV(\'Neh\',7,59);">Ne 7:59</a>. This is not probable.``1';
