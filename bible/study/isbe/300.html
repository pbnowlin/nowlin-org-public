isbe = [];

isbe[301]='Ahaziah`a-ha-zi&#146;-a (&#146;achazyah and &#145;achazyahu, "Yah holds, or sustains"):<P>I. Ahaziah.<P>Son of Ahab and Jezebel, eighth king of Israel (<a onClick="return mV(\'1Ki\',22,\'51-\');">1Ki 22:51-2Ki 1:18</a>).<P>1. His Reign:<P>Ahaziah became king over Israel in the seventeenth year of Jehoshaphat, king of Judah, and he reigned two years, 854-853 BC. There is, here an incongruity between the synchronism and the length of the reigns of the kings. Jehoshaphat began to reign in the fourth year of Ahab (<a onClick="return mV(\'1Ki\',22,41);">1Ki 22:41</a>), and he reigned 22 years (<a onClick="return mV(\'1Ki\',16,29);">1Ki 16:29</a>). Accordingly Ahaziah&#146;s first year, in the twenty-second year of Ahab, would fall in the nineteenth year of Jehoshaphat. The chronological statement in <a onClick="return mV(\'2Ki\',1,17);">2Ki 1:17</a> is probably taken from the Syriac, and both are in harmony wrath a method of computation followed by certain Greek manuscripts.<P>2. His Character:<P>A good name does not insure a good character. Ahaziah, the "God-sustained," served Baal and worshipped him, and provoked to anger Yahweh, the God of Israel, Just as his father before him had done. He appears to have been weak and unfortunate, and calamities in quick succession pursued him.<P>3. The Revolt of Moab:<P>Ahab had sought the good and became an enemy to the best. His house and the nation suffered the consequences. "Moab rebelled against Israel after the death of Ahab." Ahaziah appears to have been too weak to offer resistance. The Moabite Stone dates the revolt in the days of Ahab. No doubt it began at the time of Ahab&#146;s last campaign against Syria.<P>4. His Maritime Alliance:<P>According to <a onClick="return mV(\'1Ki\',22,48);">1Ki 22:48</a> f., Ahaziah attempted to form an alliance with Jehoshaphat of Judah to revive the ancient maritime traffic, but failed. According to <a onClick="return mV(\'2Ch\',20,\'35-37\');">2Ch 20:35-37</a> the alliance was consummated, in consequence of which the enterprise came to nothing. See <a href="./study/isbe/search.html?string=JEHOSHAPHAT">JEHOSHAPHAT</a>.<P>5. His Sickness and Death:<P>Ahaziah suffered a severe accident by falling through the lattice in his upper apartment in Samaria, and lay sick. As a worthy son of Jezebel and Ahab, he sent messengers to consult Baalzebub, the god of Ekron, regarding his recovery. But Israel belonged to Yahweh. Accordingly the messengers were met by the prophet Elijah who for the last time warns against the corrupting moral influences of the Baal religion. "Thus saith Yahweh, Is it because there is no God in Israel, that thou sendest to inquire of Baal-zebub, the god of Ekron? therefore thou shalt not come down from the bed whither thou art gone up, but shalt surely die" was the message which he sent back to the embassy, and the death of the king speedily followed.<P>II. Ahaziah.<P>Sixth king of Judah (<a onClick="return mV(\'2Ki\',8,\'25-29\');">2Ki 8:25-29</a>; <a onClick="return mV(\'2Ki\',9,16);">9:16</a>f. = <a onClick="return mV(\'2Ch\',22,\'1-9\');">2Ch 22:1-9</a>); also written Jehoahaz (<a onClick="return mV(\'2Ch\',21,17);">2Ch 21:17</a>; <a onClick="return mV(\'2Ch\',25,23);">25:23</a>), which is merely a transposition of the component parts of the compound. The form "Azariah" (<a onClick="return mV(\'2Ch\',22,6);">2Ch 22:6</a>) is an error, fifteen Hebrew manuscripts and all the versions reading Ahaziah.<P>1. His Brief Reign:<P>Ahaziah, youngest son of Jehoram, began to reign in the twelfth year (<a onClick="return mV(\'2Ki\',8,25);">2Ki 8:25</a>) of Jehoram of Israel. In <a onClick="return mV(\'2Ki\',9,29);">2Ki 9:29</a> it is stated as the eleventh. The former is probably the Hebrew, the latter the Greek method of computation, the Septuagint Luc also reading eleventh in 8:25. He was 22 years old when he began to reign and he reigned one year (<a onClick="return mV(\'2Ki\',8,26);">2Ki 8:26</a>). The reading "forty two" (<a onClick="return mV(\'2Ch\',22,2);">2Ch 22:2</a>) is a scribal error, since according to <a onClick="return mV(\'2Ch\',21,5,20);">2Ch 21:5, 20</a> Jehoram the father was only 40 years old at the time of his death. Syriac, Arabic and Luc read 22, Septuagint Codex Vaticanus 20.<P>See <a href="./study/isbe/search.html?string=CHRONOLOGY+OF+THE+OLD+TESTAMENT">CHRONOLOGY OF THE OLD TESTAMENT</A>.<P>2. His Character:<P>(Compare <a onClick="return mV(\'2Ki\',8,27);">2Ki 8:27</a>; <a onClick="return mV(\'2Ch\',22,3,4);">2Ch 22:3-4</a>.) In view of the disaster which befell the royal house (<a onClick="return mV(\'2Ch\',21,16,17);">2Ch 21:16-17</a>), the inhabitants of Jerusalem placed Ahaziah the youngest son upon the throne. That "he walked in the way of the house of Ahab" is exemplified by Chronicles to the effect that his mother, the daughter of Jezebel, counseled him in the ways of wickedness and that the house of Ahab led him to his destruction. The influence of Jezebel was at work in Judah. Ahaziah dedicated "hallowed things" to Yahweh (<a onClick="return mV(\'2Ki\',12,18);">2Ki 12:18</a>), but he did evil in Yahweh&#146;s eyes.<P>3. His Alliance with Jehoram of Israel:<P>(Compare <a onClick="return mV(\'2Ki\',8,28-29);">2Ki 8:28-29</a>; <a onClick="return mV(\'2Ch\',22,5,6);">2Ch 22:5-6</a>.) Ahaziah cultivated the relations which had been established between the two kingdoms by Ahab. Accordingly he joined his uncle Jehoram of Israel in an expedition against Hazael, king of Syria. Ramoth-gilead was captured and held for Israel against the king of Syria (<a onClick="return mV(\'2Ki\',9,14);">2Ki 9:14</a>). However, Jehoram of Israel was wounded and returned to Jezreel to be healed of his wounds. It appears that the army was left in charge of Jehu at Ramoth-gilead. Ahaziah apparently went to Jerusalem and later went down to Jezreel to visit Jehoram. In the meantime Jehu formed a conspiracy against Jehoram.<P>4. His Death:<P>The death of Ahaziah, as told in <a onClick="return mV(\'2Ki\',9,16);">2Ki 9:16</a> f., differs from the account in <a onClick="return mV(\'2Ch\',22,\'7-9\');">2Ch 22:7-9</a>. According to the account in Kings, Ahaziah who is visiting Jehoram, joins him in a separate chariot to meet Jehu. Jehoram suspecting treachery turns to flee, but an arrow from the bow of Jehu pierces his heart and he dies in his chariot. Ahaziah tries to escape, but is overtaken near Ibleam and mortally wounded by one of Jehu&#146;s men. He fled to the fortress of Megiddo, where he died. His servants conveyed his body in a chariot to Jerusalem, where he was buried. According to the Chronicler, this account is very much abbreviated (<a onClick="return mV(\'2Ch\',22,7);">2Ch 22:7</a> f.). His destruction is of God because of his alliance with Jehoram. Jehu, who was executing judgment on the house of Ahab, first slew the kinsmen of Ahaziah. He then sought Ahaziah who was hiding in Samaria. When he was found, he was brought to Jehu and put to death. He was buried, but where and by whom we are not told.<P>That there were other traditions respecting the death of Ahaziah, is proved by Josephus, who says that when Ahaziah was wounded he left his chariot and fled on horseback to Megiddo, where he was well cared for by his servants until he died (Ant., IX, vi, 3).``125';
isbe[302]='Ahban`a\'-ban (\'achban, "brother of an intelligent one"(?) Achbar): The son of Abishur of the tribe of Judah (<a onClick="return mV(\'1Ch\',2,29);">1Ch 2:29</a>).``1';
isbe[303]='Aher`a\'-her (\'acher, "another"; Aer): A man of Benjamin (<a onClick="return mV(\'1Ch\',7,12);">1Ch 7:12</a>), apparently a contracted form, perhaps the same as Ahiram (King James Version) (<a onClick="return mV(\'Num\',26,38);">Nu 26:38</a>) or Aharah (<a onClick="return mV(\'1Ch\',8,1);">1Ch 8:1</a>).``1';
isbe[304]='Ahi`a\'-hi (\'achi, "my brother," or perhaps a contraction from <a href="./study/isbe/search.html?string=AHIJAH">AHIJAH</a>, which see):<p>(1) A member of the tribe of Gad (<a onClick="return mV(\'1Ch\',5,15);">1Ch 5:15</a>).<p>(2) A member of the tribe of Asher (<a onClick="return mV(\'1Ch\',7,34);">1Ch 7:34</a>).``1';
isbe[305]='Ahi or Ah`In proper names (\'achi or \'ach "brother"): The usage is practically the same with that of \'abh, \'abhi. See <a href="./study/isbe/search.html?string=NAMES+PROPER">NAMES, PROPER</a>,`<a href="./study/isbe/search.html?string=ABI">ABI</a>`1';
isbe[306]='Ahiah`a-hi\'-a: A variant in the King James Version (<a onClick="return mV(\'1Sa\',14,3,18);">1Sa 14:3, 18</a>; <a onClick="return mV(\'1Ki\',4,3);">1Ki 4:3</a>; <a onClick="return mV(\'1Ch\',8,7);">1Ch 8:7</a>) for <a href="./study/isbe/search.html?string=AHIJAH">AHIJAH</a>, which see. Also in the Revised Version (British and American) (<a onClick="return mV(\'Neh\',10,26);">Ne 10:26</a>).``1';
isbe[307]='Ahiam`a-hi\'-am (\'achi\'am, "mother\'s brother"): One of David\'s thirty heroes. He was the son of Sharar (<a onClick="return mV(\'2Sa\',23,33);">2Sa 23:33</a>) or according to <a onClick="return mV(\'1Ch\',11,35);">1Ch 11:35</a> of Sacar, the Hararite.``1';
isbe[308]='Ahian`a-hi\'-an (\'achyan, "brotherly"): A son of Shemida of the tribe of Manasseh (<a onClick="return mV(\'1Ch\',7,19);">1Ch 7:19</a>).``1';
isbe[309]='Ahiezer`a-hi-e\'-zer (\'achi\'ezer, "brother is help"):<P>(1) A son of Ammishaddai, a Danite prince, who acted as representative of his tribe on several occasions. (See <a onClick="return mV(\'Num\',1,12);">Nu 1:12</a>; <a onClick="return mV(\'Num\',2,25);">2:25</a>; <a onClick="return mV(\'Num\',7,66,71);">7:66, 71</a>; <a onClick="return mV(\'Num\',10,25);">10:25</a>.)<P>(2) One of the mighty men or warriors, who joined David at Ziklag when a furtive before Saul (<a onClick="return mV(\'1Ch\',12,3);">1Ch 12:3</a>).``1';
isbe[310]='Ahihud`a-hi\'-hud (\'achihudh, "brother is majesty"):<P>(1) One of the chief men of the tribe of Asher. He was selected by Moses to help divide the land west of the Jordan (<a onClick="return mV(\'Num\',34,27);">Nu 34:27</a>).<P>(2) A son of Ehud of the tribe of Benjamin (<a onClick="return mV(\'1Ch\',8,6,7);">1Ch 8:6-7</a>). The text here is obscure and probably corrupt.``1';
isbe[311]='Ahijah`a-hi\'-ja (\'achiyah or \'achiyahu, "brother of Yahweh," "my brother is Yahweh," "Yah is brother." In the King James Version the name sometimes appears as Ahiah):<P>(1) One of the sons of Jerahmeel the great-grandson of Judah (<a onClick="return mV(\'1Ch\',2,25);">1Ch 2:25</a>).<P>(2) A descendant of Benjamin (<a onClick="return mV(\'1Ch\',8,7);">1Ch 8:7</a>).<P>(3) The son of Ahitub, priest in the time of King Saul (<a onClick="return mV(\'1Sa\',14,3,18);">1Sa 14:3, 18</a>). Either he is the same with Ahimelech, who is mentioned later, or he is the father or brother of Ahimelech. He is introduced to us when Saul has been so long on the throne that his son Jonathan is a man grown and a warrior. He is in attendance upon Saul, evidently as an official priest, "wearing an ephod." When Saul wishes direction from God he asks the priest to bring hither the ark; but then, without waiting for the message, Saul counts the confusion in the Philistine camp a sufficient indication of the will of Providence, and hurries off to the attack. Some copies of the Greek here read "ephod" instead of "ark," but the documentary evidence in favor of that reading is far from decisive. If the Hebrew reading is correct, then the seclusion of the ark, from the time of its return from Philistia to the time of David, was not so absolute as many have supposed. See <a href="./study/isbe/search.html?string=AHIMELECH">AHIMELECH</A>, i.<P>(4) One of David\'s mighty men, according to the list in <a onClick="return mV(\'1Ch\',11,36);">1Ch 11:36</a>. The corresponding name in the list in <a onClick="return mV(\'2Sa\',23,34);">2Sa 23:34</a> is Eliam the son of Ahithophel the Gilonite.<P>(5) A Levite of David\'s time who had charge of certain treasures connected with the house of God (<a onClick="return mV(\'1Ch\',26,20);">1Ch 26:20</a>). The Greek copies presuppose the slightly different text which would give in English "and their brethren," instead of Ahijah. This is accepted by many scholars, and it is at least more plausible than most of the proposed corrections of the Hebrew text by the Greek.<P>(6) Son of Sinsha and brother of Elihoreph (<a onClick="return mV(\'1Ki\',4,3);">1Ki 4:3</a>). The two brothers were scribes of Solomon. Can the scribes Ahijah and Shemaiah (<a onClick="return mV(\'1Ch\',24,6);">1Ch 24:6</a>) be identified with the men of the same names who, later, were known as distinguished prophets? Sinsha is probably the same with Shavsha (<a onClick="return mV(\'1Ch\',18,16);">1Ch 18:16</a>; compare <a onClick="return mV(\'2Sa\',8,17);">2Sa 8:17</a>; <a onClick="return mV(\'2Sa\',20,25);">20:25</a>), who was scribe under David, the office in this case descending from father to son.<P>(7) The distinguished prophet of Shiloh, who was interested in Jeroboam I. In Solomon\'s lifetime Ahijah clothed himself with a new robe, met Jeroboam outside Jerusalem, tore the robe into twelve pieces, and gave him ten, in token that he should become king of the ten tribes (<a onClick="return mV(\'1Ki\',11,\'29-39\');">1Ki 11:29-39</a>). Later, when Jeroboam had proved unfaithful to Yahweh, he sent his wife to Ahijah to ask in regard to their sick son. The prophet received her harshly, foretold the death of the son, and threatened the extermination of the house of Jeroboam (<a onClick="return mV(\'1Ki\',14,\'1\');">1Ki 14</a>). The narrative makes the impression that Ahijah was at this time a very old man (<a onClick="return mV(\'1Ki\',14,4);">1Ki 14:4</a>). These incidents are differently narrated in the long addition at <a onClick="return mV(\'1Ki\',12,24);">1Ki 12:24</a> found in some of the Greek copies. In that addition the account of the sick boy precedes that of the rent garment, and both are placed between the account of Jeroboam\'s return from Egypt and that of the secession of the ten tribes, an order in which it is impossible to think that the events occurred. Further, this addition attributes the incident of the rent garment to Shemaiah and not to Ahijah, and says that Ahijah was 60 years old.<P>Other notices speak of the fulfillment of the threatening prophecies spoken by Ahijah (<a onClick="return mV(\'2Ch\',10,15);">2Ch 10:15</a>; <a onClick="return mV(\'1Ki\',12,15);">1Ki 12:15</a>; <a onClick="return mV(\'1Ki\',15,29);">15:29</a>). In 2Ch "the prophecy of Ahijah the Shilonite" is referred to as a source for the history of Solomon (<a onClick="return mV(\'2Ch\',9,29);">2Ch 9:29</a>).<P>(8) The father of Baasha king of Israel (<a onClick="return mV(\'1Ki\',15,27,33);">1Ki 15:27, 33</a>; <a onClick="return mV(\'1Ki\',21,22);">21:22</a>; <a onClick="return mV(\'2Ki\',9,9);">2Ki 9:9</a>).<P>(9) A Levite of Nehemiah\'s time, who sealed the covenant (<a onClick="return mV(\'Neh\',10,26);">Ne 10:26</a> the King James Version).``11';
isbe[312]='Ahikam`a-hi\'-kam (\'achiqam, "my brother has risen up"): A prominent man of the time of King Josiah and the following decades (<a onClick="return mV(\'2Ki\',22,12,14);">2Ki 22:12, 14</a>; <a onClick="return mV(\'2Ki\',25,22);">25:22</a>; <a onClick="return mV(\'2Ch\',34,20);">2Ch 34:20</a>; <a onClick="return mV(\'Jer\',26,24);">Jer 26:24</a>; <a onClick="return mV(\'Jer\',39,14);">39:14</a>; <a onClick="return mV(\'Jer\',40,5);">40:5</a> f.; <a onClick="return mV(\'Jer\',41,1);">41:1</a f.; <a onClick="return mV(\'Jer\',43,6);">43:6</a>). He was the son of Shaphan, who very likely is to be identified with Shaphan the scribe, who was at that time so prominent. Ahikam was the father of Gedaliah, whom, on the capture of Jerusalem, Nebuchadnezzar made governor of the land. Ahikam was a member of the deputation sent by Josiah to the prophetess Huldah to consult her concerning the contents of the Book of the Law which had been found. Under Jehoiakim he had sufficient influence to protect Jeremiah from being put to death. On the capture of Jerusalem Nebuchadnezzar committed Jeremiah into the care of Gedaliah. It is clear that both Shaphan and his son, like Jeremiah, belonged to the party which held that the men of Judah were under obligation to keep the oath which they had sworn to the tang of Babylon.``11';
isbe[313]='Ahilud`a-hi\'-lud (\'achiludh, "child\'s brother," perhaps): The father of Jehoshaphat, who is mentioned as "recorder" in both the earlier and the later lists under David, and in the list under Solomon (<a onClick="return mV(\'2Sa\',8,16);">2Sa 8:16</a>; <a onClick="return mV(\'1Ch\',18,15);">1Ch 18:15</a>; <a onClick="return mV(\'2Sa\',20,24);">2Sa 20:24</a>; <a onClick="return mV(\'1Ki\',4,3);">1Ki 4:3</a>). In the absence of proof we may assume that the father of Baana, one of Solomon\'s district superintendents, was the same Ahilud (<a onClick="return mV(\'1Ki\',4,12);">1Ki 4:12</a>).``1';
isbe[314]='Ahimaaz`a-hi-ma\'-az, a-him\'-a-az (\'achima\'ats, perhaps "my brother is rage," or "brother of rage"):<P>(1) Father of Ahinoam the wife of King Saul (<a onClick="return mV(\'1Sa\',14,50);">1Sa 14:50</a>).<P>(2) The son of Zadok the high priest (<a onClick="return mV(\'1Ch\',6,8,9,53);">1Ch 6:8-9, 53</a>). With his father he remained loyal to David in the rebellions both of Absalom and of Adonijah. With Jonathan the son of Abiathar he carried information to Dared when he fled from Absalom (<a onClick="return mV(\'2Sa\',15,27,36);">2Sa 15:27, 36</a>; <a onClick="return mV(\'2Sa\',17,17,20);">17:17, 20</a>). At his own urgent request he carried tidings to David after the death of Absalom (<a onClick="return mV(\'2Sa\',18,19);">2Sa 18:19</a> f.). He told the king of the victory, and also, through his reluctance to speak, informed him of Absalom\'s death. By his reluctance and his sympathy he softened a little the message, which the Cushite presently repeated more harshly.<P>That Ahimaaz did not succeed his father as high priest has been inferred from the fact that in the Solomon list of heads of departments (<a onClick="return mV(\'1Ki\',4,2);">1Ki 4:2</a>) Azariah the son of Zadok is mentioned as priest. It is assumed that this Azariah is the one who appears in the genealogy as the son of Ahimaaz, and that for some reason Ahimaaz was left out of the succession. These inferences are not Justified by the record, though possibly the record does not absolutely disprove them. As the list stands it makes Zadok and Abiathar the high priests. Azariah and Zabud, the son of Nathan (<a onClick="return mV(\'1Ki\',4,2,5);">1Ki 4:2, 5</a>), are spoken of as holding priestly offices of a different kind. Ahimaaz may have died early, or may have followed some other career, but the simple fact is that we do not know.<P>(3) Ahimaaz, in Naphtali, was one of Solomon\'s twelve commissary officers (<a onClick="return mV(\'1Ki\',4,15);">1Ki 4:15</a>), who married Basemath the daughter of Solomon. It is not impossible that he was Ahimaaz the son of Zadok, though there is no proof to that effect.``11';
isbe[315]='Ahiman`a-hi\'-man (\'achiman, perhaps, "brother of fortune," or, "my brother is fortune"):<P>(1) One of the names given as those of the three "children of the Anak" (<a onClick="return mV(\'Num\',13,22);">Nu 13:22</a>; <a onClick="return mV(\'Jos\',15,14);">Jos 15:14</a>; <a onClick="return mV(\'Num\',13,28);">Nu 13:28</a>; <a onClick="return mV(\'2Sa\',21,16,18);">2Sa 21:16, 18</a>), or the three "sons of the Anak" (<a onClick="return mV(\'Jos\',15,14);">Jos 15:14</a>; <a onClick="return mV(\'Jdg\',1,20);">Jud 1:20</a>). The three names (Ahiman, Sheshai, Talmai) also occur together in <a onClick="return mV(\'Jdg\',1,10);">Jud 1:10</a>. The word Anak in the Hebrew Bible has the definite article except in <a onClick="return mV(\'Num\',13,33);">Nu 13:33</a> and <a onClick="return mV(\'Deu\',9,2);">De 9:2</a>. Its use is that of a common noun denoting a certain type of man, rather than as the proper name of a person or a clan, though this need not prevent our thinking of the Anakim as a clan or group of clans, who regarded Arba as their founder. The question is raised whether Ahiman and Sheshai and Talmai are to be thought of as persons or as clans. The most natural understanding of the Bible statements is certainly to the effect that they were personal leaders among the Anakim of Kiriath-arba (Hebron). They were smitten and dispossessed by the tribe of Judah, with Caleb for leader.<P>(2) A Levite, one of the gatekeepers of the latest Bible times (<a onClick="return mV(\'1Ch\',9,17);">1Ch 9:17</a>). He is associated with Akkub and Talmon and their brethren: compare <a onClick="return mV(\'Neh\',11,19);">Ne 11:19</a>.``11';
isbe[316]='Ahimelech`a-him\'-e-lek (\'achimelekh, "brother of a king," or, "my brother is king," or, "king is brother"):<P>(1) The father of David\'s high priest Abiathar: son of Ahitub, the son of Phinehas, the son of Eli (<a onClick="return mV(\'1Sa\',21,1,2,8);">1Sa 21:1-2, 8</a>; <a onClick="return mV(\'1Sa\',22,\'9-20\');">22:9-20</a>; <a onClick="return mV(\'1Sa\',23,6);">23:6</a>; <a onClick="return mV(\'1Sa\',30,7);">30:7</a>). Ahijah the son of Ahitub (<a onClick="return mV(\'1Sa\',14,3,18);">1Sa 14:3, 18</a>) was either the same person under another name, or was Ahimelech\'s father or brother. See <a href="./study/isbe/search.html?string=AHIJAH">AHIJAH</A>, 3. Ahimelech is an interesting person, especially because he stands for whatever information we have concerning the priestly office in Israel during the period between Eli and David. Whether the Deuteronomic law for a central sanctuary originated with Moses or not, its provisions were very imperfectly carried out during the times of the Judges. This was particularly the case after the capture of the ark by the Philistines, and the deaths of Eli and his sons. From that time to the middle of the reign of David the ark was in the custody of the men of Kiriath-jearim "in the hill," or "in Gibeah" (<a onClick="return mV(\'1Sa\',7,1);">1Sa 7:1</a>; <a onClick="return mV(\'2Sa\',6,2,3);">2Sa 6:2-3</a>).<P>As a general proposition Israel "sought not unto it" (<a onClick="return mV(\'1Ch\',13,3);">1Ch 13:3</a>), though there is nothing to forbid the idea that it may, on occasion, have been brought out from its seclusion (<a onClick="return mV(\'1Sa\',14,18);">1Sa 14:18</a>). Before and after the accession of Saul some of the functions of the national sanctuary were transacted, of course very incompletely, at Gilgal (<a onClick="return mV(\'1Sa\',10,8);">1Sa 10:8</a>; <a onClick="return mV(\'1Sa\',11,14,15);">11:14-15</a>; <a onClick="return mV(\'1Sa\',13,7);">13:7</a>; <a onClick="return mV(\'1Sa\',15,12,21,23);">15:12, 21, 33</a>). Whether there was a priesthood, with Ahitub the grandson of Eli as high priest, is a matter on which we have no information; but we may remind ourselves that the common assumption that such men as Samuel and Saul performed priestly offices is nothing but an assumption. After Saul has been king for a good many years we find Ahijah in his retinue, acting as priest and wearing priestly vestments. A few years later Ahimelech is at the head of the very considerable priestly establishment at Nob. The scale on which it existed is indicated by the fact that 85 robed priests perished in the massacre (<a onClick="return mV(\'1Sa\',22,18);">1Sa 22:18</a>).<P>They had families residing at Nob (<a onClick="return mV(\'1Sa\',22,19);">1Sa 22:19</a>). They were thought of as priests of Yahweh, and were held in reverence (<a onClick="return mV(\'1Sa\',22,17);">1Sa 22:17</a>). It was a hereditary priesthood (<a onClick="return mV(\'1Sa\',22,11,15);">1Sa 22:11, 15</a>). Men deposited votive offerings there, the sword of Goliath, for example (<a onClick="return mV(\'1Sa\',21,9);">1Sa 21:9</a>). There seems to have been some kind of police authority, whereby a person might be "detained" (<a onClick="return mV(\'1Sa\',21,7);">1Sa 21:7</a>). It was customary to inquire of Yahweh there (<a onClick="return mV(\'1Sa\',22,10,15);">1Sa 22:10, 15</a>). A distraction was made between the common and the holy (<a onClick="return mV(\'1Sa\',21,\'4-6\');">1Sa 21:4-6</a>). The custom of the shewbread was maintained (<a onClick="return mV(\'1Sa\',21,6);">1Sa 21:6</a>). In fine, Jesus is critically correct in calling the place "the house of God" (<a onClick="return mV(\'Mar\',2,26);">Mr 2:26</a>). The account does not say that the ark was there, or that the burnt-offering of the morning and evening was offered, or that the great festivals were held. The priestly head of the establishment at Nob is represented to have been the man who had the right to the office through his descent from Aaron. It is gratuitous to assume that there were other similar sanctuaries in Israel, though the proposition that there were none might be, like other negative propositions, hard to establish by positive proof.<P>(2) A son of Abiathar (<a onClick="return mV(\'2Sa\',8,17);">2Sa 8:17</a>; <a onClick="return mV(\'1Ch\',18,16);">1Ch 18:16</a>; <a onClick="return mV(\'1Ch\',24,6);">24:6</a>), and grandson of the above. In a list of the heads of departments under David, a list belonging later than the middle of David\'s 40 years, and in which David\'s sons appear, this Ahimelech, the son of David\'s friend, is mentioned as sharing with Zadok a high position in the priesthood. In this capacity, later, he shared with David and Zadok in the apportionment of the priests into 24 ancestral classes, 16 of the house of Eleazar, and 8 of the house of Ithamar (<a onClick="return mV(\'1Ch\',24,\'1\');">1Ch 24</a>). In this account Ahimelech is mentioned three times, and with some detail. It is alleged as a difficulty that Abiathar was then living, and was high priest along with Zadok (<a onClick="return mV(\'1Ch\',15,11);">1Ch 15:11</a>; <a onClick="return mV(\'2Sa\',15,29);">2Sa 15:29</a>; <a onClick="return mV(\'2Sa\',19,11);">19:11</a>; <a onClick="return mV(\'2Sa\',20,25);">20:25</a>; <a onClick="return mV(\'1Ki\',2,27,35);">1Ki 2:27, 35</a>; <a onClick="return mV(\'1Ki\',4,4);">4:4</a>, etc.). But surely there is no improbability in the affirmation that Abiathar had a son named Ahimelech, or that this son performed prominent priestly functions in his father\'s lifetime.<P>Many regard "Ahimelech the son of Abiathar" (Mt gives Ahimelech) as an inadvertent transposition for "Abiathar the son of Ahimelech." This is rather plausible in the passage in <a onClick="return mV(\'2Sa\',8,\'1-\');">2Sa 8</a> and the duplicate of it in <a onClick="return mV(\'1Ch\',18,16);">1Ch 18:16</a>, but it has no application in the detailed account in <a onClick="return mV(\'1Ch\',24,\'1-\');">1Ch 24</a>. One must accept Ahimelech the son of Abiathar as historical unless, indeed, one regards the testimony of Ch to a fact as evidence in disproof of that fact. See <a href="./study/isbe/search.html?string=ABIATHAR">ABIATHAR</A>.<P>(3) A Hittite, a companion and friend of David, when he was hiding from Saul in the wilderness (<a onClick="return mV(\'1Sa\',26,6);">1Sa 26:6</a>).``11';
isbe[317]='Ahimoth`a-hi\'-moth (\'achimoth, "brother of death," or, "my brother is death"): A descendant of Kohath the son of Levi (<a onClick="return mV(\'1Ch\',6,25);">1Ch 6:25</a>); ancestor of Elkanah the father of Samuel. The name Mahath holds a similar place in the list that follows (<a onClick="return mV(\'1Ch\',6,35);">1Ch 6:35</a>).``1';
isbe[318]='Ahinadab`a-hin\'-a-dab (\'achinadhabh, "brother of willingness," or, "my brother is willing"): Decidedly the ordinary use of the stem nadhabh is to denote willingness rather than liberality or nobleness One of Solomon\'s twelve commissary officers (<a onClick="return mV(\'1Ki\',4,14);">1Ki 4:14</a>). He was the son of Iddo, and his district was Mahanaim.``1';
isbe[319]='Ahinoam`a-hi-no\'-am, a-hin\'-o-am (\'achino\'am, "my brother is pleasantness"):<P>(1) Daughter of Ahimaaz, and wife of King Saul (<a onClick="return mV(\'1Sa\',14,50);">1Sa 14:50</a>).<P>(2) The woman from Jezreel whom David married after Saul gave Michal to another husband. She and Abigail, the widow of Nabal, seem to have been David\'s only wives prior to the beginning of his reign in Hebron. His marriage to Abigail is mentioned first, with some details, followed by the statement, easily to be understood in the pluperfect, that he had previously married Ahinoam (<a onClick="return mV(\'1Sa\',25,\'39-44\');">1Sa 25:39-44</a>). Three times they are mentioned together, Ahinoam always first (<a onClick="return mV(\'1Sa\',27,3);">1Sa 27:3</a>; <a onClick="return mV(\'1Sa\',30,5);">30:5</a>; <a onClick="return mV(\'2Sa\',2,2);">2Sa 2:2</a>), and Ahinoam is the mother of David\'s first son and Abigail of his second (<a onClick="return mV(\'2Sa\',3,2);">2Sa 3:2</a>; <a onClick="return mV(\'1Ch\',3,1);">1Ch 3:1</a>). Ahinoam\'s son was Amnon. The record really represents David\'s polygamy as a series of bids for political influence; the names of Amnon, Absalom, Adonijah suggest that the method was not finally a success.``11';
isbe[320]='Ahio`a-hi\'-o (\'achyo, variously explained as "his brother," "brotherly," "brother of Yahweh," "my brother is Yah"): Proper names containing a similar form of the name of Yahweh are found on the ostraca recently exhumed at Samaria. The word is always treated as a common noun in the ordinary Greek copies, being rendered either "brother" or "brothers," or "his brother" or "his brothers"; but this is probably to be taken as an instance of the relative inferiority of the Greek text as compared with the Massoretic Text. See <a href="./study/isbe/search.html?string=OSTRACA">OSTRACA</A>.<P>(1) One of the sons of Beriah, the son of Elpaal, the son of Shaharaim and Hushim, reckoned among the families of Benjamin (<a onClick="return mV(\'1Ch\',8,14);">1Ch 8:14</a>). Beriah and Shema are described as \'ancestral heads\' "of the inhabitants of Aijalon, who put to flight the inhabitants of Gath."<P>(2) A descendant of Jeiel ("the father of Gibeon") and his wife Maacah (<a onClick="return mV(\'1Ch\',8,31);">1Ch 8:31</a>; <a onClick="return mV(\'1Ch\',9,37);">9:37</a>). King Saul apparently came from the same family (<a onClick="return mV(\'1Ch\',8,30,33);">1Ch 8:30, 33</a>; <a onClick="return mV(\'1Ch\',9,39);">9:39</a>).<P>(3) One of the men who drove the new cart when David first attempted to bring the ark from the house of Abinadab to Jerusalem (<a onClick="return mV(\'2Sa\',6,3,4);">2Sa 6:3-4</a>; <a onClick="return mV(\'1Ch\',13,7);">1Ch 13:7</a>). In Samuel Uzza and Ahio are called sons of Abinadab. By the most natural understanding of the Biblical data about 100 years had elapsed since the ark was brought to the house; they were sons of that Abinadab in the sense of being his descendants. Whether he had a successor of the same name living in David\'s time is a matter of conjecture.``11';
isbe[321]='Ahira`a-hi\'-ra (\'achira\', "brother of evil," or, "my brother is evil"): A man of Naphtali, contemporary with Moses. He is five times mentioned as the son of Enan. He was the representative of his tribe who assisted Moses in the census (<a onClick="return mV(\'Num\',1,15);">Nu 1:15</a>). He was the hereditary "prince" of the tribe; he made the tribal offering (<a onClick="return mV(\'Num\',2,29);">Nu 2:29</a>; <a onClick="return mV(\'Num\',7,78);">7:78</a>; compare <a onClick="return mV(\'Num\',7,83);">Nu 7:83</a>), and was commander of the tribal host when on the march (<a onClick="return mV(\'Num\',10,27);">Nu 10:27</a>).``1';
isbe[322]='Ahiram`a-hi\'-ram (\'achiram, "exalted brother," or "my brother is exalted"):<P>A son of Benjamin. Mentioned third of the five in <a onClick="return mV(\'Num\',26,38,39);">Nu 26:38-39</a>. In <a onClick="return mV(\'1Ch\',8,1);">1Ch 8:1</a> five sons are likewise mentioned, being explicitly numbered; the third name, Aharah (\'achrach), is conjectured to be either a corruption of Ahiram or a different name for the same person. In <a onClick="return mV(\'1Ch\',7,6);">1Ch 7:6</a> f., is a fuller list of Benjamite names, but it is fragmentary and not clear. In it occurs Aher (\'acher), which may be either Ahiram or Aharah with the end of the word lost. In <a onClick="return mV(\'Gen\',46,21);">Ge 46:21</a> ten sons of Benjamin are mentioned, some being there counted as sons who, in the other lists, are spoken of as more remote descendants. In this list Ehi (\'echi) is perhaps Ahiram shortened.`<a href="./study/isbe/search.html?string=AHARAH">AHARAH</a>; <a href="./study/isbe/search.html?string=AHER">AHER</a>; <a href="./study/isbe/search.html?string=EHI">EHI</a>`11';
isbe[323]='Ahiramite`a-hi\'-ram-it (\'achirami, "of the family of Ahiram"; <a onClick="return mV(\'Num\',26,38);">Nu 26:38</a>).`<a href="./study/isbe/search.html?string=AHIRAM">AHIRAM</a>`1';
isbe[324]='Ahisamach`a-his\'-a-mak (\'achicamakh, "my brother supports"): A man of the tribe of Dan, father of Oholiab, who was the assistant of Bezalel in the building of the tent of meeting and preparing its furniture (<a onClick="return mV(\'Exd\',31,6);">Ex 31:6</a>; <a onClick="return mV(\'Exd\',35,34);">35:34</a>; <a onClick="return mV(\'Exd\',38,23);">38:23</a>).``1';
isbe[325]='Ahishahar`a-hish\'-a-har (\'achishachar, "brother of dawn"): One of the sons of Bilhan, the son of Jediael, the son of Benjamin (<a onClick="return mV(\'1Ch\',7,10);">1Ch 7:10</a>).``1';
isbe[326]='Ahishar`a-hish\'-ar (\'achishar, "my brother has sung"): Mentioned in Solomon\'s list of heads of departments as "over the household" (<a onClick="return mV(\'1Ki\',4,6);">1Ki 4:6</a>).``1';
isbe[327]='Ahithophel`a-hith\'-o-fel (\'achithophel, "brother of foolishness," perhaps): The real leader of the Absalom rebellion against David. He is described as "the king\'s counselor," in a context connected with events some of which are dated in the fortieth year of David (<a onClick="return mV(\'1Ch\',27,33,34);">1Ch 27:33-34</a>; compare <a onClick="return mV(\'1Ch\',26,31);">1Ch 26:31</a>). Concerning him and his part in the rebellion we have rather full information (<a onClick="return mV(\'2Sa\',15,12);">2Sa 15:12</a> f.).<P>Some hold that he was the grandfather of Bathsheba, and make much of this in forming their estimates of him. Does the evidence sustain this view? In the latter half of the list of David\'s mighty men, not among the older veterans with whom the list begins, appears "Eliam the son of Ahithophel the Gilonite" (<a onClick="return mV(\'2Sa\',23,34);">2Sa 23:34</a>), the corresponding name in the other copy of the list being "Ahijah the Pelonite" (<a onClick="return mV(\'1Ch\',11,36);">1Ch 11:36</a>). It is assumed that this is the same Eliam who was father to Bath-sheba (<a onClick="return mV(\'2Sa\',11,3);">2Sa 11:3</a>). Apparently the Chronicler testifies (<a onClick="return mV(\'1Ch\',3,5);">1Ch 3:5</a>) that the mother of Solomon was "Bath-shua the daughter of Ammiel."<P>Bathshua may easily be a variant of Bathsheba, and the names Eliam and Ammiel are made up of the same parts, only in reversed order. It is not strange that men have inferred that the son of Ahithophel was the father of Bathsheba. But the inference is really not a probable one. The record does not make the impression that Ahithophel was an older man than David. The recorded events of David\'s life after his misconduct with Bathsheba cannot have occupied less than about twenty years; that is, he cannot have been at the time older than about fifty years. That Ahithophel had then a married grand-daughter is less probable than that there were in Israel two Eliams. Further, Ahithophel was not the sort of man to conspire against the interests of his grand-daughter and her son, however he may, earlier, have resented the conduct of David toward her. Ahithophel\'s motive in the rebellion was doubtless ambition for personal power, though he very likely shared with many of his countrymen in the conviction that it was unjust to push aside an older son by elevating a younger son to the throne.<P>Ahithophel has a reputation for marvelous practical sagacity (<a onClick="return mV(\'2Sa\',16,23);">2Sa 16:23</a>). He did not show this in joining the conspiracy but it is in evidence in his management of the affair. According to the record the hearts of the people, in spite of the much fault they had to find, were all the time with David. Absalom\'s only chance of success was by the method of surprise and stampede. There must be a crisis in which everybody would join Absalom because everybody thought that everybody else had done so. Such a state of public sentiment could last only a very few days; but if, in those few days, David could be put out of the way, Absalom might hold the throne in virtue of his personal popularity and in default of a rival. The first part of the program was carried out with wonderful success; when it came to the second part, Ahithophel\'s practical wisdom was blocked by Hushai\'s adroit appeal to Absalom\'s personal vanity. Ahithophel saw with absolute clearness that Absalom had sacrificed his one opportunity, and he committed suicide to avoid participation in the shameful defeat which he saw could not be averted.``11';
isbe[328]='Ahitob`a-hi\'-tob (Achitob; the King James Version Achitob): One of the ancestors of Ezra (1Esdras 8:2; 2Esdras 1:1). Compare <a href="./study/isbe/search.html?string=AHITUB">AHITUB</A>, 3 (<a onClick="return mV(\'Ezr\',7,2);">Ezr 7:2</a> et al.).``1';
isbe[329]='Ahitub`a-hi’-tub (’achitubh, "brother of goodness," i.e. "good brother," or, "my brother is goodness"):<P>(1) The brother of Ichabod and son of Phinehas the son of Eli (<a onClick="return mV(\'1Sa\',14,3);">1Sa 14:3</a>; <a onClick="return mV(\'1Sa\',22,9);">22:9, 11-12, 20</a>), According to <a onClick="return mV(\'1Ch\',24,\'1-\');">1Ch 24</a> he and his line were descended from Aaron through Ithamar. The record implies that he was born while his father and grandfather were priests at Shiloh, and it says that he was the father and grandfather of priests; but it is silent as to his own exercise of the priestly office. We have no information concerning the office from the time when the Philistines captured the ark till Saul became king. See <a href="./study/isbe/search.html?string=AHIJAH">AHIJAH</A>; <a href="./study/isbe/search.html?string=AHIMELECH">AHIMELECH</A>; <a href="./study/isbe/search.html?string=ABIATHAR">ABIATHAR</A>.<P>(2) A descendant of Aaron through Eleazar: by this fact distinguished from Ahitub, the descendant of Ithamar, though nearly contemporaneous with him. Especially known as the father of Zadok who, at Solomon’s accession, became sole high priest (<a onClick="return mV(\'2Sa\',8,17);">2Sa 8:17</a>; <a onClick="return mV(\'1Ch\',6,8);">1Ch 6:8</a>; <a onClick="return mV(\'1Ch\',18,16);">18:16</a>). His genealogical line, from Levi to the Exile, is given in <a onClick="return mV(\'1Ch\',6,\'1-15\');">1Ch 6:1-15</a>. The three successive names, Ahitub and Zadok and Ahimaaz, appear in <a onClick="return mV(\'2Sa\',8,17);">2Sa 8:17</a>; <a onClick="return mV(\'2Sa\',15,27);">15:27</a>, etc.. The line is paralleled by selected names in <a onClick="return mV(\'Ezr\',7,\'1-5\');">Ezr 7:1-5</a>, and relatively late parts of it are paralleled in <a onClick="return mV(\'1Ch\',9,11);">1Ch 9:11</a> and <a onClick="return mV(\'Neh\',11,11);">Ne 11:11</a>. The best explanation of certain phenomena in Chronicles is that the record was copied from originals that were more or less fragmentary. In some cases, also, a writer gives only such parts of a genealogy as are needed for his purpose. It is due to these causes that there are many omissions in the genealogical lists, and that they supplement one another. Allowing for these facts there is no reason why we should not regard the genealogies of Ahitub as having distract historical value.<P>(3) In the genealogies, in the seventh generation from Ahitub, the descendant of Eleazar, appears another Ahitub, the son of another Amariah and the father (or grandfather) of another Zadok (<a onClick="return mV(\'1Ch\',6,11);">1Ch 6:11</a>; <a onClick="return mV(\'1Ch\',9,11);">9:11</a>; <a onClick="return mV(\'Neh\',11,11);">Ne 11:11</a>). The list in <a onClick="return mV(\'Ezr\',7,\'1-\');">Ezr 7</a> omits a block of names, and the Ahitub there named may be either 2 or 3. He is mentioned in 1Esdras 8:2 and 2Esdras 1:1, and the name occurs in Judith 8:1. In these places it appears in the English versions in the various forms: Ahitub, Ahitob, Achitob, Acitho.``11';
isbe[330]='Ahlab`a’-lab (’achlabh, "fat or fruitful"): A town of Asher. It is clear, however, that the Israelites failed to drive away the original inhabitants (<a onClick="return mV(\'Jdg\',1,31);">Jdg 1:31</a>). Some have identified Ahlab with Gush Halab or Geschila, Northwest of the Sea of Galilee.``1';
isbe[331]='Ahlai`a\'-li (\'achlay "O would that!"):<P>(1) A Son of Sheshan (<a onClick="return mV(\'1Ch\',2,31);">1Ch 2:31</a>) or according to <a onClick="return mV(\'1Ch\',2,34);">1Ch 2:34</a> a daughter of Sheshan, for here we read: "Now Sheshan had no sons, but daughters."<P>(2) The father of Zabad, a soldier in David\'s army (<a onClick="return mV(\'1Ch\',11,41);">1Ch 11:41</a>).``1';
isbe[332]='Ahoah`a-ho\'-a (\'achoah, "brotherly"(?)): A son of Bela of the tribe of Benjamin (<a onClick="return mV(\'1Ch\',8,4);">1Ch 8:4</a>).``1';
isbe[333]='Ahohite`a-ho\'-hit (\'achochi): A patronymic employed in connection with the descendants of <a href="./study/isbe/search.html?string=AHOAH">AHOAH</A> (which see) such as Doda (<a onClick="return mV(\'2Sa\',23,9);">2Sa 23:9</a>) or Dodo (<a onClick="return mV(\'1Ch\',11,12);">1Ch 11:12</a>), Ilai (<a onClick="return mV(\'1Ch\',11,29);">1Ch 11:29</a>) or Zalmon (<a onClick="return mV(\'2Sa\',23,28);">2Sa 23:28</a>), and also Eleazar, son of Dodo (<a onClick="return mV(\'1Ch\',11,12);">1Ch 11:12</a>). The family must have been fond of military affairs, for all the above were officers in David and Solomon\'s armies.``1';
isbe[334]='Aholah`a-ho\'-la.`<a href="./study/isbe/search.html?string=OHOLAH">OHOLAH</a>`1';
isbe[335]='Aholiab`a-ho-li\'-ab.`<a href="./study/isbe/search.html?string=OHOLIAB">OHOLIAB</a>`1';
isbe[336]='Aholiah`a-ho-li\'-a.`<a href="./study/isbe/search.html?string=OHOLIAB">OHOLIAB</a>`1';
isbe[337]='Aholibah`a-ho\'-li-ba.`<a href="./study/isbe/search.html?string=OHOLIBAH">OHOLIBAH</a>`1';
isbe[338]='Aholibamah`a-ho-li-ba\'-ma.`<a href="./study/isbe/search.html?string=OHOLIBAMAH">OHOLIBAMAH</a>`1';
isbe[339]='Ahumai`a-hu\'-ma-i, a-hu\'-mi (\'achumay, "brother of water"(?)): A descendant of Shobal of the tribe of Judah (<a onClick="return mV(\'1Ch\',4,2);">1Ch 4:2</a>).``1';
isbe[340]='Ahuzzam; Ahuzam`a-huz\'-am, a-hu\'-zam (\'achuzzam, "possessor"). A son of Ashahur of the tribe of Judah, his mother\'s name was Naarah (<a onClick="return mV(\'1Ch\',4,6);">1Ch 4:6</a>); written Ahuzam in the King James Version.``1';
isbe[341]='Ahuzzath`a-huz\'-ath (\'achuzzath, "possession"): A "friend" perhaps a minister, of Abimelech, king of Gerar. He together with Phicol, commander of the army, accompanied their sovereign to Beersheba to make a covenant with Isaac (<a onClick="return mV(\'Gen\',26,26);">Ge 26:26</a>). The termination "-ath" reminds us of Philistine proper names, such as Gath, Goliath, etc. Compare Genubath (<a onClick="return mV(\'1Ki\',11,20);">1Ki 11:20</a>).``1';
isbe[342]='Ahzai`a\'-zi (\'achzay, "my protector"): A priest who resided in Jerusalem (<a onClick="return mV(\'Neh\',11,13);">Ne 11:13</a>). The the King James Version has Ahasai which is probably the same as Jahzevah of <a onClick="return mV(\'1Ch\',9,12);">1Ch 9:12</a>.``1';
isbe[343]='Ai`a\'-i (\'ay, written always with the definite article, ha-\'ay, probably meaning "the ruin," kindred root, \'awah):<P>(1) A town of central Palestine, in the tribe of Benjamin, near and just east of Bethel (<a onClick="return mV(\'Gen\',12,8);">Ge 12:8</a>). It is identified with the modern Haiyan, just south of the village Der Diwan (Conder in HDB; Delitzsch in Commentary on <a onClick="return mV(\'Gen\',12,8);">Ge 12:8</a>) or with a mound, El-Tell, to the north of the modern village (Davis, Dict. Biblical). The name first appears in the earliest journey of Abraham through Palestine (<a onClick="return mV(\'Gen\',12,8);">Ge 12:8</a>), where its location is given as east of Bethel, and near the altar which Abraham built between the two places. It is given similar mention as he returns from his sojourn in Egypt (<a onClick="return mV(\'Gen\',13,3);">Ge 13:3</a>). In both of these occurrences the King James Version has the form Hai, including the article in transliterating. The most conspicuous mention of Ai is in the narrative of the Conquest. As a consequence of the sin of Achan in appropriating articles from the devoted spoil of Jericho, the Israelites were routed in the attack upon the town; but after confession and expiation, a second assault was successful, the city was taken and burned, and left a heap of ruins, the inhabitants, in number twelve thousand, were put to death, the king captured, hanged and buried under a heap of stones at the gate of the ruined city, only the cattle being kept as spoil by the people (<a onClick="return mV(\'Jos\',7,\'1-\');">Jos 7</a>; <a onClick="return mV(\'Jos\',8,\'1-\');">8</a>). The town had not been rebuilt when Joshua was written (<a onClick="return mV(\'Jos\',8,28);">Jos 8:28</a>). The fall of Ai gave the Israelites entrance to the heart of Canaan, where at once they became established, Bethel and other towns in the vicinity seeming to have yielded without a struggle. Ai was rebuilt at some later period, and is mentioned by Isaiah (<a onClick="return mV(\'Isa\',10,28);">Isa 10:28</a>) in his vivid description of the approach of the Assyrian army, the feminine form (\'ayyath) being used. Its place in the order of march, as just beyond Michmash from Jerusalem, corresponds with the identification given above. It is mentioned also in post-exilic times by <a onClick="return mV(\'Ezr\',2,28);">Ezr 2:28</a> and <a onClick="return mV(\'Neh\',7,32);">Ne 7:32</a>, (and in <a onClick="return mV(\'Neh\',11,31);">Ne 11:31</a> as, \'ayya\'), identified in each case by the grouping with Bethel.<P>(2) The Ai of <a onClick="return mV(\'Jer\',49,3);">Jer 49:3</a> is an Ammonite town, the text probably being a corruption of \'ar; or ha-\'ir, "the city" (BDB).``109';
isbe[344]='Aiah`a\'-ya (\'ayyah, "falcon"; once in the King James Version Ajah, <a onClick="return mV(\'Gen\',36,24);">Ge 36:24</a>):<P>(1) A Horite, son of Zibeon, and brother of Anah, who was father of one of Esau\'s wives (<a onClick="return mV(\'Gen\',36,24);">Ge 36:24</a>; <a onClick="return mV(\'1Ch\',1,40);">1Ch 1:40</a>).<P>(2) Father of Rizpah, a concubine of Saul, about whom Ishbosheth falsely accused Abner (<a onClick="return mV(\'2Sa\',3,7);">2Sa 3:7</a>), and whose sons were hanged to appease the Gibeonites, whom Saul had wronged (<a onClick="return mV(\'2Sa\',21,\'8-11\');">2Sa 21:8-11</a>).``1';
isbe[345]='Aiath`a\'-yath (\'ayyath): Found in <a onClick="return mV(\'Isa\',10,28);">Isa 10:28</a>; feminine form of the city <a href="./study/isbe/search.html?string=AI">AI</a> (which see).``1';
isbe[346]='Aid`ad (chazaq, "to strengthen," "to aid"): A military term used only once in Old Testament in the King James Version (<a onClick="return mV(\'Jdg\',9,24);">Jdg 9:24</a>) and displaced in the Revised Version (British and American) by the literal rendering, "who strengthened his hands." The men of Shechem supported Abimelech in his fratricidal crime, with money, enabling him to hire men to murder his brethren. The fundamental idea in the word, as used in the Old Testament, is "abounding strength."``1';
isbe[347]='Aija`a-i\'-ja (\'ayya\'): A form of name for city Ai, found in <a onClick="return mV(\'Neh\',11,31);">Ne 11:31</a>.`<a href="./study/isbe/search.html?string=AI">AI</a>; <a href="./study/isbe/search.html?string=AIATH">AIATH</a>`1';
isbe[348]='Aijalon`a’-ja-lon (’ayyalon, "deerplace"; the King James Version, Ajalon (<a onClick="return mV(\'Jos\',10,12);">Jos 10:12</a>)):<P>(1) The name of a town allotted to the tribe of Dan (<a onClick="return mV(\'Jos\',19,42);">Jos 19:42</a>), which was also designated a Levitical city (<a onClick="return mV(\'Jos\',21,24);">Jos 21:24</a>), which fell to the Sons of Kohath (<a onClick="return mV(\'1Ch\',6,69);">1Ch 6:69</a>). The first mention of Aijalon is in the narrative of Joshua’s defeat of the five Amorite kings: "thou, Moon, in the valley of Aijalon" (<a onClick="return mV(\'Jos\',10,12);">Jos 10:12</a>). The Danites failed to take it from the Amorites (<a onClick="return mV(\'Jdg\',1,35);">Jdg 1:35</a>), although the men of Ephraim held it in vassalage. Here Saul and Jonathan won a great victory over the Philistines (<a onClick="return mV(\'1Sa\',14,31);">1Sa 14:31</a>). At one time it was held by the tribe of Benjamin (<a onClick="return mV(\'1Ch\',8,13);">1Ch 8:13</a>). Rehoboam fortified it against the kingdom of Israel (<a onClick="return mV(\'2Ch\',11,10);">2Ch 11:10</a>). In the days of King Ahaz it was captured by the Philistines (<a onClick="return mV(\'2Ch\',28,18);">2Ch 28:18</a>). It has been identified with the modern Yalo; its antiquity goes back to Tell el-Amarna Letters, in which it has mention. It Is situated Northwest of Jerusalem in a valley of the same name, which leads down from the mountains to the sea.<P>(2) A town in the tribe of Zebulun, site unknown, where Elon the judge was buried (<a onClick="return mV(\'Jdg\',12,12);">Jdg 12:12</a>).``109';
isbe[349]='Aijeleth Hash-Shahar`a\'-je-leth hash-sha\'-har.`<a href="./study/isbe/search.html?string=PSALMS">PSALMS</a>; <a href="./study/isbe/search.html?string=SONG">SONG</a>`1';
isbe[350]='Ail`al (Anglo-Saxon: eglan, "to pain"): As a verb translation, is "to trouble," "afflict" (obsolete); intrans, "to feel pain, trouble, uneasiness," etc.; it represents Hebrew mah lekha "what to thee" (<a onClick="return mV(\'Gen\',21,17);">Ge 21:17</a>, "What aileth thee, Hagar?"; <a onClick="return mV(\'Jdg\',18,23);">Jdg 18:23</a>; <a onClick="return mV(\'1Sa\',11,5);">1Sa 11:5</a>; <a onClick="return mV(\'2Sa\',14,5);">2Sa 14:5</a>; <a onClick="return mV(\'2Ki\',6,28);">2Ki 6:28</a>; <a onClick="return mV(\'Isa\',22,1);">Isa 22:1</a>); in <a onClick="return mV(\'Psa\',114,5);">Ps 114:5</a>, it is figuratively or poetically applied to the sea, the river Jordan, etc.: "What ailed thee, O thou sea, that thou fleddest?" etc.; the Revised Version (British and American), "What aileth thee, O thou sea that thou fleest?" etc.; in 2Esdras 9:42; 10:31, "What aileth thee?"``1';
isbe[351]='Aim`am: In The <span class="noTag">Wisdom of Solomon 13:9</span>. Lit. translation by the King James Version of Greek stochasasthai, which commonly means "to shoot at." This is Interpreted and explained by the Revised Version (British and American) as "explore," with a hint as to the nature of the process, and may be paraphrased: "If they be able to conjecture the mysteries of the universe."``1';
isbe[352]='Ain (1)``<a href="./study/isbe/search.html?string=AYIN">AYIN</a>`1';
isbe[353]='Ain (2)`a\'-in (\'ayin, "eye or spring (of water)"):<P>(1) A town in the extreme Northwest corner of Canaan, so named, most probably, from a noted spring in the vicinity (<a onClick="return mV(\'Num\',34,11);">Nu 34:11</a>). Thomson and after him Robinson make Ain the same as \'Ain el-\'Asy, the chief source of the Orontes, some fifteen miles southwest of Riblah, which, in turn, is about twenty miles southwest of Emesa (Hums). As Ain is named in connection with Lake Gennesaret, some claim that Riblah of <a onClick="return mV(\'Num\',34,11);">Nu 34:11</a> must be another place farther south and closer to that lake.<P>(2) A Levitical city (<a onClick="return mV(\'Jos\',21,16);">Jos 21:16</a>) in the Negeb or southern part of Judah. It was first allotted to the tribe of Judah (<a onClick="return mV(\'Jos\',15,32);">Jos 15:32</a>) but later to Simeon (<a onClick="return mV(\'Jos\',19,7);">Jos 19:7</a>). The fact that it is several times named in immediate connection with Rimmon has lent plausibility to the view that we have here a compound word, and that we should read En-Rimmon, i.e. Ain-Rimmon (see <a onClick="return mV(\'Jos\',15,32);">Jos 15:32</a>; <a onClick="return mV(\'Jos\',19,7);">19:7</a>; <a onClick="return mV(\'1Ch\',4,32);">1Ch 4:32</a>).`<a href="./study/isbe/search.html?string=AYIN">AYIN</a>`34';
isbe[354]='Air`ar (aer): In the Old Testament "air" is used (with one exception) in the phrase "fowl" or "fowls (birds) of the air." The Hebrew word is usually rendered "heaven" or "heavens." According to ancient Hebrew cosmogony the sky was a solid dome (firmament) stretching over the earth as a covering. In the above phrase the air means the space between the earth and the firmament. In <a onClick="return mV(\'Job\',41,16);">Job 41:16</a> "air" renders ruach, "breath," "wind," "spirit." The scales of the leviathan are so closely joined together that no air can penetrate. In the New Testament the phrase "birds (or fowls) of the air," occurs ten times. This simply reproduces the Hebraism noticed above. Apart from this expression "air" in the King James Version represents aer, which denotes the atmosphere which surrounds us. The expression "beating the air" (<a onClick="return mV(\'1Cr\',9,26);">1Co 9:26</a>) means to "deal blows that do not get home"—that miss the mark. In his conflict with the lower life represented by the body, Paul compares himself to a boxer who aims with unerring accuracy at his opponent. No stroke is lost. Paul also uses the phrase "speaking into the air" (<a onClick="return mV(\'1Cr\',14,9);">1Co 14:9</a>) in reference to the unintelligible utterances of those who "spake with tongues." In the expression, "prince of the powers of the air" (<a onClick="return mV(\'Eph\',2,2);">Eph 2:2</a> the King James Version) we find an echo of the current belief that the air was the dwelling place of spirits, especially of evil spirits.``103';
isbe[355]='Airus`a-i\'-rus, ar\'-us (Iairos): the King James Version, one of the heads of a family of temple servants (1Esdras 5:31 the Revised Version (British and American) <a href="./study/isbe/search.html?string=JAIRUS">JAIRUS</a>), which returned from Babylon with Zerubbabel; in the Old Testament called Reaiah (<a onClick="return mV(\'Ezr\',2,47);">Ezr 2:47</a>; <a onClick="return mV(\'Neh\',7,50);">Ne 7:50</a>), and classed among the Nethinim.``1';
isbe[356]='Ajah`a\'-ja. An Edomite tribe (<a onClick="return mV(\'Gen\',36,24);">Ge 36:24</a> the King James Version).`<a href="./study/isbe/search.html?string=AIAH">AIAH</a>`1';
isbe[357]='Ajalon`aj\'-a-lon.`<a href="./study/isbe/search.html?string=AIJALON">AIJALON</a>`1';
isbe[358]='Akan`a\'-kan (\'aqan, "twisted"): A son of Ezer, a descendant of Esau of Seir (<a onClick="return mV(\'Gen\',36,27);">Ge 36:27</a>). He is called Jaakan in <a onClick="return mV(\'1Ch\',1,42);">1Ch 1:42</a>. The King James Version margin has Jakan.``1';
isbe[359]='Akatan`ak\'-a-tan (Akatan; the King James Version, Acatan = Hakkatan; <a onClick="return mV(\'Ezr\',8,12);">Ezr 8:12</a>): The father of Joannes who returned with Ezra to Jerusalem (1Esdras 8:38).``1';
isbe[360]='Akeldama`a-kel\'-da-ma (Akeldama, or, in many manuscripts, Akeldamach; the King James Version, Aceldama): A field said in <a onClick="return mV(\'Act\',1,19);">Ac 1:19</a> to have been bought by Judas with the "thirty pieces of silver." In <a onClick="return mV(\'Mat\',27,6,7);">Mt 27:6-7</a> it is narrated that the priests took the silver pieces which Judas had "cast down...into the sanctuary" and "bought with them the potter\'s field, to bury strangers in. Wherefore that field was called, The field of blood, unto this day." Doubtless it was a supposed connection between this potter\'s field and the potter\'s house (<a onClick="return mV(\'Jer\',18,2);">Jer 18:2</a>) and the Valley of the Son of Hinnom (<a onClick="return mV(\'Jer\',19,2);">Jer 19:2</a>) which influenced the selection of the present site which, like the Aramaic h-q-l-d-m-\'(Dalman), is today known as haqq-ed-dumm, "field of blood."<P>Tradition, which appears to go back to the 4th century, points to a level platform on, and some distance up, the southern slope of the Wady er Rababi (Valley of Hinnom) just before it joins the Kidron Valley. Upon this spot there is a very remarkable ruin (78 ft. x 57 ft.) which for many centuries was used as a charnel house. The earth here was reputed to have the property of quickly consuming dead bodies. So great was its reputation that vast quantities of it are said to have been transported in 1215 AD to the Campo Santo at Pisa.<P>When this building was standing entire, the bodies were lowered into it through five openings in the roof and then left to disintegrate, so that a few years ago there were very many feet of bones all over the floor. These have now been removed. A little southeast of this ruin is a new Greek monastery erected in recent years over the remains of a large number of cave tombs; many of the bones from "Akeldama" are now buried here.``117';
isbe[361]='Akkad; Akkadians`ak\'-ad, a-ka\'-di-ans.`<a href="./study/isbe/search.html?string=ACCAD">ACCAD</a>; <a href="./study/isbe/search.html?string=ACCADIANS">ACCADIANS</a>`1';
isbe[362]='Akkos`ak\'-os (Akbos in 1Esdras 5:38; the King James Version <a href="./study/isbe/search.html?string=ACCOS">Accos</a>, which see): The Old Testament equivalent (<a onClick="return mV(\'1Ch\',24,10);">1Ch 24:10</a>; <a onClick="return mV(\'Ezr\',2,61);">Ezr 2:61</a>; <a onClick="return mV(\'Neh\',3,4,21);">Ne 3:4, 21</a>) is <a href="./study/isbe/search.html?string=HAKKOZ">HAKKOZ</a> (haqqots), which also see.``1';
isbe[363]='Akkub`ak\'-ub (\'aqqubh, "pursuer"):<P>(1) A son of Elioenai, a descendant of Zerubbabel (<a onClick="return mV(\'1Ch\',3,24);">1Ch 3:24</a>).<P>(2) A Levite porter on duty at the east gate of the second Temple (<a onClick="return mV(\'1Ch\',9,17);">1Ch 9:17</a>).``1';
isbe[364]='Akrabattine`ak-ra-ba-ti\'-ne (Akrabattine; the King James Version, Arabattine): A place in Idumaea where Judas Maccabee defeated the children of Esau (1Macc 5:3).``1';
isbe[365]='Akrabbim`ak-rab\'-im (once in the King James Version, Acrabbim (<a onClick="return mV(\'Jos\',15,3);">Jos 15:3</a>); \'aqrabbim, "scorpions"): Three times found (<a onClick="return mV(\'Num\',34,4);">Nu 34:4</a>; <a onClick="return mV(\'Jos\',15,3);">Jos 15:3</a>; <a onClick="return mV(\'Jdg\',1,36);">Jud 1:36</a>), and always with ma\'aleh, "ascent" or "pass"; and so "Ascent of the Scorpions," an ascent at the southwest point of the Dead Sea and a part of the boundary line between Judah and Edom. At this pass Judas Maccabeus won a victory over the Edomites (1Macc 5:3), called in the King James Version, Arabattine.``1';
isbe[366]='Al-Tashheth; Al-Taschith`al-tash\'-heth, al-tas\'-kith.`<a href="./study/isbe/search.html?string=PSALMS">PSALMS</a>; <a href="./study/isbe/search.html?string=SONG">SONG</a>`1';
isbe[367]='Alabaster`al’-a-bas-ter (alabastron [<a onClick="return mV(\'Mat\',26,7);">Mt 26:7</a>; <a onClick="return mV(\'Mar\',14,3);">Mr 14:3</a>; <a onClick="return mV(\'Luk\',7,37);">Lu 7:37</a>]): In modern mineralogy alabaster is crystalline gypsum or sulphate of lime. The Greek word alabastron or alabastos meant a stone casket or vase, and alabastites was used for the stone of which the casket was made. This stone was usually crystalline stalagmitic rock or carbonate of lime, now often called oriental alabaster, to distinguish it from gypsum. The word occurs in the Bible only in the three passages of the Synoptic Gospels cited above.`<a href="./study/isbe/search.html?string=BOX">BOX</a>`1';
isbe[368]='Alameth`al’-a-meth (‘alameth, "concealment"; <a onClick="return mV(\'1Ch\',7,8);">1Ch 7:8</a> the King James Version): The name of a son of Becher and grandson of Benjamin. His name was preserved as the name of a town near Anathoth (<a href="./study/isbe/search.html?string=ALLEMETH">ALLEMETH</a>, <a onClick="return mV(\'1Ch\',6,60);">1Ch 6:60</a> the Revised Version [British and American]). Except for the strong pausal accent in the Hebrew the form of the word would be the same as <a href="./study/isbe/search.html?string=ALEMETH">ALEMETH</a> (which see).``1';
isbe[369]='Alammelech`a-lam\'-e-lek: the King James Version (<a onClick="return mV(\'Jos\',19,26);">Jos 19:26</a>) for <a href="./study/isbe/search.html?string=ALLAMMELECH">ALLAMMELECH</a> (which see).``1';
isbe[370]='Alamoth`al\'-a-moth.`<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>`1';
isbe[371]='Alarm`a-larm\' (teru\'ah): This expression is found six times in the Old Testament. The Hebrew word so rendered is derived from a verb meaning "to shout" or "blow a horn," as a signal for breaking up camp, starting on a journey or into battle, or in triumphant shout over the defeat of enemies. In a few instances it is employed of a cry of despair or distress. The noun teru\'ah translated "alarm" in <a onClick="return mV(\'Num\',10,5);">Nu 10:5</a>f. refers to the signal given the people of Israel to start on their journey in the Wilderness. The passages in Jeremiah (<a onClick="return mV(\'Jer\',4,19);">4:19</a>; <a onClick="return mV(\'Jer\',49,2);">49:2</a>) both refer to the summons for war. The same is true of <a onClick="return mV(\'Zep\',1,16);">Ze 1:16</a>. The law concerning the sounding of the alarm is fully stated in <a onClick="return mV(\'Num\',10,\'1-10\');">Nu 10:1-10</a>. Here we read that two silver trumpets of beaten work were sounded by the sons of Aaron in case of war and also "in the day of...gladness" to gather the people together for the various feasts, new moons, sacrifices and offerings.``34';
isbe[372]='Albeit`ol-be\'-it (hina me; literally, "lest"): Occurs in a paraphrase rather than as a translation of a clause in <a onClick="return mV(\'Phm\',1,19);">Phm 1:19</a> the King James Version. The thought is: "although" or "albeit" (synonym of "although") "I might say," etc. This the Revised Version (British and American) translates with intense literalness: "that I say not".``1';
isbe[373]='Alcimus`al’-si-mus (’elyaqum, "God will rise"; Alkimos, "valiant"): A high priest for three years, 163-161 BC, the record of whose career may be found in 1Macc 7:4-50; 9:1-57; 2Macc 14; see also Ant, XII, 9-11; XX, 10. He was a descendant of Aaron, but not in the high-priestly line (1Macc 7:14; also Ant, XX, 10); and being ambitious for the office of high priest, he hastened to Antioch to secure the favor and help of the new king, Demetrius, who had just overthrown Antiochus Eupator and made himself king. Alcimus was of the Grecianizing party, and therefore bitterly opposed by the Maccabees. Demetrius sent a strong army under Bacchides to establish him in the high-priesthood at Jerusalem. The favor with which Alcimus was received by the Jews at Jerusalem on account of his Aaronic descent was soon turned to hate by his cruelties. When Bacchides and his army returned to Antioch, Simon Maccabeus attacked and overcame Alcimus, and drove him also to Syria. There he secured from Demetrius another army, led by Nicanor, who, failing to secure Simon by treachery, joined battle with him, but was defeated and killed. A third and greater army, under Bacchides again, was dispatched to save the falling fortunes of Alcimus. Now Simon was overwhelmed and slain, Alcimus established as high priest and a strong force left in Jerusalem to uphold him. But he did not long enjoy his triumph, since he died soon after from a paralytic stroke.``109';
isbe[374]='Alcove`al\'-kov (qubbah; the King James Version tent; the American Standard Revised Version pavilion; the American Revised Version, margin alcove): Perhaps a large tent occupied by a prince (<a onClick="return mV(\'Num\',25,8);">Nu 25:8</a>).``1';
isbe[375]='Alema`al\'-e-ma (Alemois): A town in Gilead, mentioned once only (1Macc 5:26), besieged by the nations under Timotheus, together with Bosor and other cities; and probably relieved along with these cities by Judas Maccabeus, although no mention is made of Alema\'s relief. The name occurs the one time as dative plural.``1';
isbe[376]='Alemeth`al\'-e-meth (\'alemeth, "concealment"):<P>(1) the Revised Version (British and American) for Alameth of the King James Version in <a onClick="return mV(\'1Ch\',7,8);">1Ch 7:8</a>.<P>(2) Descendant of Saul and Jonathan, and son of Jehoaddah, <a onClick="return mV(\'1Ch\',8,36);">1Ch 8:36</a>, or of Jarah, <a onClick="return mV(\'1Ch\',9,42);">1Ch 9:42</a>. The genealogies in the two chapters are identical, and he is the fifth generation after Jonathan.<P>(3) In some Hebrew texts, Ginsburg and Baer, for <a href="./study/isbe/search.html?string=ALLEMETH">ALLEMETH</a> (which see); so in the King James Version.``1';
isbe[377]='Aleph`a\'-lef (\'): The first letter of the Hebrew alphabet. It is nearly soundless itself and best represented, as in this Encyclopedia, by the smooth breathing (\'), but it is the direct ancestor of the Greek, Latin and English "a" as in "father." In either case this beginning of the alphabet happens to be near the very basis of all speech—in one case the simple expiration of breath, in the other the simplest possible vocal action—the actual basis from which all other vowels are evolved. It became also the symbol for the number one (1) and, with the dieresis, 1,000. It is the symbol also for one of the most famous of Greek Biblical manuscripts, the Codex Sinaiticus. For name, written form, etc.,`<a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>`147';
isbe[378]='Aleppo`a-lep\'-o`<a href="./study/isbe/search.html?string=BEREA">BEREA</a>`1';
isbe[379]='Alexander`al-eg-zan’-der Alexandros, literal meaning "defender of men." This word occurs five times in the New Testament, (<a onClick="return mV(\'Mar\',15,21);">Mr 15:21</a>; <a onClick="return mV(\'Act\',4,6);">Ac 4:6</a>; <a onClick="return mV(\'Act\',19,33);">19:33</a>; <a onClick="return mV(\'1Ti\',1,19,20);">1Ti 1:19-20</a>; <a onClick="return mV(\'2Ti\',4,14);">2Ti 4:14</a>): It is not certain whether the third, fourth and fifth of these passages refer to the same man.<P>1. A Son of Simon of Cyrene:<P>The first of these Alexanders is referred to in the passage in Mark, where he is said to have been one of the sons of Simon of Cyrene, the man who carried the cross of Christ. Alexander therefore may have been a North African by birth. Matthew, Mark, and Luke all record the fact, with varying detail, that Simon happened to be passing at the time when Christ was being led out of the city, to be crucified on Calvary. Mark alone tells that Simon was the father of Alexander and Rufus. From this statement of the evangelist, it is apparent that at the time the Second Gospel was written, Alexander and Rufus were Christians, and that they were well known in the Christian community. Mark takes it for granted that the first readers of his Gospel will at once understand whom he means.<P>There is no other mention of Alexander in the New Testament, but it is usually thought that his brother Rufus is the person mentioned by Paul in <a onClick="return mV(\'Rom\',16,13);">Ro 16:13</a>, "Salute Rufus the chosen in the Lord, and his mother and mine." If this identification is correct, then it follows, not only that the sons of Simon were Christians, but that his wife also was a Christian, and that they had all continued faithful to Christ for many years. It would also follow that the households were among the intimate friends of Paul, so much so that the mother of the family is affectionately addressed by him as "Rufus’ mother and mine." The meaning of this is, that in time past this lady had treated Paul with the tender care which a mother feels and shows to her own son.<P>This mention of Rufus and his mother is in the list of names of Christians resident in Rome. Lightfoot (Comm. on Philippians, 176) writes: "There seems no reason to doubt the tradition that Mark wrote especially for the Romans; and if so, it is worth remarking that he alone of the evangelists describes Simon of Cyrene, as ‘the father of Alexander and Rufus.’ A person of this name therefore (Rufus) seems to have held a prominent place among the Roman Christians; and thus there is at least fair ground for identifying the Rufus of Paul with the Rufus of Mark. The inscriptions exhibit several members of the household (of the emperor) bearing the names Rufus and Alexander, but this fact is of no value where both names are so common."<P>To sum up, Alexander was probably by birth a North African Jew; he became a Christian, and was a well-known member of the church, probably the church in Rome. His chief claim to recollection is that he was a son of the man who carried the cross of the Saviour of the world.<P>2. A Relative of Annas:<P>The second Alexander, referred to in <a onClick="return mV(\'Act\',4,6);">Ac 4:6</a>, was a relative of Annas the Jewish high priest. He is mentioned by Luke, as having been present as a member of the Sanhedrin, before which Peter and John were brought to be examined, for what they had done in the cure of the lame man at the gate of the temple. Nothing more is known of this Alexander than is here given by Luke. It has been conjectured that he may have been the Alexander who was a brother of Philo, and who was also the alabarch or magistrate of the city of Alexandria. But this conjecture is unsupported by any evidence at all.<P>3. Alexander and the Riot at Ephesus:<P>The third Alexander is mentioned in <a onClick="return mV(\'Act\',19,33);">Ac 19:33</a>: "And some of the multitude instructed Alexander, the Jews putting him forward. And Alexander beckoned with the hand, and would have made defense unto the people. But when they perceived that he was a Jew, all with one voice," etc., the Revised Version, margin. In the matter of the riot in Ephesus the whole responsibility rested with Demetrius the silversmith. In his anger against the Christians generally, but specially against Paul, because of his successful preaching of the gospel, he called together a meeting of the craftsmen; the trade of the manufacture of idols was in jeopardy. From this meeting there arose the riot, in which the whole city was in commotion. The Jews were wholly innocent in the matter: they had done nothing to cause any disturbance. But the riot had taken place, and no one could tell what would happen. Modern anti-Semitism, in Russia and other European countries, gives an idea of an excited mob stirred on by hatred of the Jews. Instantly recognizing that the fury of the Ephesian people might expend itself in violence and bloodshed, and that in that fury they would be the sufferers, the Jews "put forward" Alexander, so that by his skill as a speaker he might clear them, either of having instigated the riot, or of being in complicity with Paul. "A certain Alexander was put forward by the Jews to address the mob; but this merely increased the clamor and confusion. There was no clear idea among the rioters what they wanted: an anti-Jewish and an anti-Christian demonstration were mixed up, and probably Alexander’s retention was to turn the general feeling away from the Jews. It is possible that he was the worker in bronze, who afterward did Paul much harm" (Ramsay, Paul the Traveler, etc., 279).<P>4. Alexander an Ephesian Heretic:<P>The fourth of the New Testament Alexanders is one of two heretical teachers at Ephesus—the other being Hymeneus: see article under the word [<a href="./study/isbe/search.html?string=HYMENAEUS">Hymenaeus</a>]—against whom Paul warns Timothy in <a onClick="return mV(\'1Ti\',1,19,20);">1Ti 1:19-20</a>. The teaching of Hymeneus and Alexander was to the effect that Christian morality was not required—antinomianism. They put away—"thrust from them," the Revised Version (British and American)—faith and a good conscience; they willfully abandoned the great central facts regarding Christ, and so they "made shipwreck concerning the faith."<P>5. His Heresy Incipient Gnosticism:<P>In <a onClick="return mV(\'2Ti\',2,17,18);">2Ti 2:17-18</a>, Hymeneus is associated with Philetus, and further details are there given regarding their false teaching. What they taught is described by Paul as "profane babblings," as leading to more ungodliness, and as eating "as doth a gangrene." Their heresy consisted in saying that the resurrection was past already, and it had been so far successful, that it had overthrown the faith of some. The doctrine of these three heretical teachers, Hymeneus, Alexander and Philetus, was accordingly one of the early forms of Gnosticism. It held that matter was originally and essentially evil; that for this reason the body was not an essential part of human nature; that the only resurrection was that of each man as he awoke from the death of sin to a righteous life; that thus in the case of everyone who has repented of sin, "the resurrection was past already," and that the body did not participate in the blessedness of the future life, but that salvation consisted in the soul’s complete deliverance from all contact with a material world and a material body.<P>So pernicious were these teachings of incipient Gnosticism in the Christian church, that they quickly spread, eating like a gangrene. The denial of the future resurrection of the body involved also the denial of the bodily resurrection of Christ, and even the fact of the incarnation. The way in which therefore the apostle dealt with those who taught such deadly error, was that he resorted to the same extreme measures as he had employed in the case of the immoral person at Corinth; he delivered Hymeneus and Alexander to Satan, that they might learn not to blaspheme. Compare <a onClick="return mV(\'1Cr\',5,5);">1Co 5:5</a>.<P>6. Alexander the Coppersmith:<P>The fifth and last occurrence of the name Alexander is in <a onClick="return mV(\'2Ti\',4,14,15);">2Ti 4:14-15</a>, "Alexander the coppersmith did me much evil: the Lord will render to him according to his works: of whom do thou also beware (the King James Version "of whom be thou ware also"); for he greatly withstood our words." This Alexander was a worker in copper or iron, a smith. It is quite uncertain whether Alexander nbr. 5 should be identified with Alexander nbr. 4, and even with Alexander nbr. 3. In regard to this, it should be remembered that all three of these Alexanders were resident in Ephesus; and it is specially to be noticed that the fourth and the fifth of that name resided in that city at much the same time; the interval between Paul’s references to these two being not more than a year or two, as not more than that time elapsed between his writing 1 Timothy and 2 Timothy. It is therefore quite possible these two Alexanders may be one and the same person.<P>In any case, what is stud of this last Alexander is that he had shown the evil which was in him by doing many evil deeds to the apostle, evidently on the occasion of a recent visit paid by Paul to Ephesus. These evil deeds had taken the form of personally opposing the apostle’s preaching. The personal antagonism of Alexander manifested itself by his greatly withstanding the proclamation of the gospel by Paul. As Timothy was now in Ephesus, in charge of the church there, he is strongly cautioned by the apostle to be on his guard against this opponent.``155';
isbe[380]='Alexander Balas`Alexander ba\'-las (Alexandros ho Balas legomenos): He contended against Demetrius I of Syria for the throne and succeeded in obtaining it. He was a youth of mean origin, but he was put forth by the enemies of Demetrius as being Alexander, the son and heir of Antiochus Epiphanes. He received the support of the Roman Senate and of Ptolemy VI of Egypt, and on account of the tyranny of Demetrius, was favored by many of the Syrians. The country was thrown into civil war and Demetrius was defeated by Alexander II took up the cause of his father and in 147 BC, Alexander fled from his kingdom and was soon after assassinated.<P>Our chief interest in Alexander is his connection with the Maccabees. Jonathan was the leader of the Maccabean forces and both Alexander and Demetrius sought his aid. Demetrius granted Jonathan the right to raise and maintain an army. Alexander, not to be outdone, appointed Jonathan high priest, and as a token of his new office sent him a purple robe and a diadem (Ant., XIII, ii, 2). This was an important step in the rise of the Maccabean house, for it insured them the support of the Chasidim. In 153 BC, Jonathan officiated as high priest at the altar (1Macc 10:1-14; Ant, XIII, ii, 1). This made him the legal head of Judea and thus the movement of the Maccabees became closely identified with Judaism. In 1Macc 10:1, he is called Alexander Epiphanes.``62';
isbe[381]='Alexander, the Great`(Alexandros). <p>1. Parentage and Early Life:<P>Alexander, of Macedon, commonly called "the Great" (born 356 BC), was the son of Philip, king of Macedon, and of Olympias, daughter of Neoptolemos, an Epeirote king. Although Alexander is not mentioned by name in the canonical Scriptures, in Daniel he is designated by a transparent symbol (<a onClick="return mV(\'Dan\',8,5,21);">Daniel 8:5, 21</a>). In 1Macc 1:1 he is expressly named as the overthrower of the Persian empire, and the founder of that of the Greeks. As with Frederick the Great, the career of Alexander would have been impossible had his father been other than he was. Philip had been for some years a hostage in Thebes: while there he had learned to appreciate the changes introduced into military discipline and tactics by Epaminondas. Partly no doubt from the family claim to Heracleid descent, deepened by contact in earlier days with Athenians like Iphicrates, and the personal influence of Epaminondas, Philip seems to have united to his admiration for Greek tactics a tincture of Hellenistic culture, and something like a reverence for Athens, the great center of this culture. In military matters his admiration led him to introduce the Theban discipline to the rough peasant levies of Macedon, and the Macedonian phalanx proved the most formidable military weapon that had yet been devised. The veneer of Greek culture which he had taken on led him, on the one hand, laying stress on his Hellenistic descent, to claim admission to the comity of Hellas, and on the other, to appoint Aristotle to be a tutor to his son. By a combination of force and fraud, favored by circumstances, Philip got himself appointed generalissimo of the Hellenistic states; and further induced them to proclaim war against the "Great King." In all this he was preparing the way for his son, so soon to be his successor.<P>2. His Preparation for His Career:<P>He was also preparing his son for his career. Alexander w
