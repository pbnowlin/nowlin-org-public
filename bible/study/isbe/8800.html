isbe[8807]='Tin`tin (bedhil): Tin is mentioned with brass, iron and lead in <a onClick="return mV(\'Num\',31,22);">Nu 31:22</a>; <a onClick="return mV(\'Eze\',22,18,20);">Eze 22:18,20</a>. Ezekiel mentions tin along with silver, iron and lead as being imported into Tyre from Tarshish (see <a href="./study/isbe/search.html?string=METALS">METALS</A>). The tin must have been brought in the form of ore and smelted in Syria. The writer has some slag dug from a deposit near Beirut which yielded nearly pure tin. It was probably the site of an ancient smelter\'s shop.``37';
isbe[8808]='Tiphsah`tif\'-sa (tiphcach, "ford"; Thapsa):<P>(1) This marks the northern extremity of the dominions ruled by Solomon, Gaza being the limit on the south (<a onClick="return mV(\'1Ki\',4,24);">1Ki 4:24</a>). It can hardly be other than Thapsacus, on the right bank of the Euphrates, before its waters join those of the Balik. The great caravan route between East and West crossed the river by the ford at this point. Here Cyrus the younger effected a somewhat perilous crossing (Xenophon, Anabasis i.4, 2). The ford was also used by Darius; but Alexander the Great, in his pursuit constructed two bridges for the transport of his army (Arrian iii.7). Under the Seleucids it was called Amphipolis. The site is probably occupied by the modern Qal\'at Dibse, where there is a ford still used by the caravans. It is about 8 miles below Meskene, where the river makes a bend to the east.<P>(2) (Codex Vaticanus Thersa, Codex Alexandrinus Thaira): The inhabitants of this town, which was apparently not far from Tirzah, did not favor the regicide Menahem, refusing to open to him. In his wrath he massacred the Tiphsites with circumstances of horrible cruelty (<a onClick="return mV(\'2Ki\',15,16);">2Ki 15:16</a>). Khirbet Tafsah, about 6 miles southwest of Nablus, corresponds in name, but is probably too far from Tirzah.``54';
isbe[8809]='Tiras`ti\'-ras (tirac; Theiras, Lucian Thiras): A son of Japheth (<a onClick="return mV(\'Gen\',10,2);">Ge 10:2</a> (P); <a onClick="return mV(\'1Ch\',1,5);">1Ch 1:5</a>). Not mentioned elsewhere; this name was almost unanimously taken by the ancient commentators (so Josephus, Ant, I, vi, 1) to be the same as that of the Thracians (Thrakes); but the removal of the nominative ending -s does away with this surface resemblance. Tuch was the first to suggest the Tursenioi, a race of Pelasgian pirates, who left many traces of their ancient power in the islands and coasts of the Aegean, and who were doubtless identical with the Etruscans of Italy. This brilliant suggestion has since been confirmed by the discovery of the name Turusa among the seafaring peoples who invaded Egypt in the reign of Merenptah (W.M. Muller, AE, 356ff). Tiras has also been regarded as the same as Tarshish.``197';
isbe[8810]='Tirathites`ti\'-rath-its (tir\'athim; Codex Vaticanus and Codex Alexandrinus, Argathieim; Lucian, Tharathei: A family of scribes that dwelt at Jabez (<a onClick="return mV(\'1Ch\',2,55);">1Ch 2:55</a>). The three families mentioned in this verse (Tirathites, Shimathites and Sucathites) are taken by Jerome to be three different classes of religious functionaries—singers, scribes, recorders ("canentes atque resonances et in tabernaculis commorantes"). The Targum takes the same view, save that the "Sucathites" are those "covered" with a spirit of prophecy. Bertheau sees the Tirathites as "gate-keepers" (Aramaic tera\' = Heb sha\'ar). Keil holds the three names to be those of the descendants of unknown men named Tira, Shemei and Sucah. The passage seems too obscure to admit of interpretation.``197';
isbe[8811]='Tire, Headtire`tir (<a onClick="return mV(\'2Ki\',9,30);">2Ki 9:30</a>; <a onClick="return mV(\'Isa\',3,20);">Isa 3:20</a>; <a onClick="return mV(\'Eze\',24,17,23);">Eze 24:17,23</a>; Judith 10:3; 16:8).`<a href="./study/isbe/search.html?string=dress">DRESS</a>`1';
isbe[8812]='Tires, Round`tirz: Small ornaments in the shape of crescents (<a onClick="return mV(\'Isa\',3,18);">Isa 3:18</a> King James Version, Revised Version "crescents").`<a href="./study/isbe/search.html?string=astronomy">ASTRONOMY</a>; <a href="./study/isbe/search.html?string=crescents">CRESCENTS</a>`1';
isbe[8813]='Tirhakah`ter-ha\'-ka, tir-ha\'-ka (tirhaqah; Codex Vaticanus in 2 Kings Thara; elsewhere and in Codex Alexandrinus Tharaka; Josephus Tharsikes):<P>1. Name and Prenomen:<P>The king of Cush or Ethiopia (basileus Aithiopon), who opposed Sennacherib in Palestine (<a onClick="return mV(\'2Ki\',19,9);">2Ki 19:9</a>; <a onClick="return mV(\'Isa\',37,9);">Isa 37:9</a>). The name of this ruler of Egypt and his native realm appears in hieroglyphics as Taharqa, his prenomen being Nefer-atmu-Ra-chu, "Nefer-atmu-Ra protects." The Assyrian form of Tirhakah is Tarqu or Tarqu\'u (inscriptions of Assur-bani-pal).<P>2. Origin and Length of Reign:<P>Tirhakah was one of the sons, and apparently the favorite, of Piankhy II. He left his mother, and the city Napata, at the age of 20; and when she followed him northward, she found him crowned as king of Egypt. As he died, after a reign of at least 26 years, in 667 BC, he must have mounted the throne about 693 BC.<P>3. A Chronological Difficulty<P>The engagement between Tirhakah\'s army and the Assyrians is regarded as having taken place in 701 BC. Petrie explains this date by supposing he acted at first for the reigning Pharaoh, his cousin Shabatoka, Tirhakah not having officially become Pharaoh until the former\'s death in 693 BC. There is a general opinion, however, that the Assyrian historians, like those of 2 King and Isaiah, have mingled two campaigns made by Sennacherib, one of them being after the accession of Tirhakah.<P>4. First Conflict with the Assyrians:<P>According to the Old Testament account, Sennacherib was besieging Libnah when Tirhakah\'s army appeared in Palestine. In Sennacherib\'s inscriptions, however, the battle with "the king(s) of Mucuru (Egypt) and the bowmen, chariots, and cavalry of Meruhha" (Meroe or Ethiopia), who had come to Hezekiah\'s help, took place in the neighborhood of Eltekeh. He claims to have captured the sons of the king (variant, "kings") of Egypt and the charioteers of the king of Meruhha, and then, having taken Eltekeh, Timna, and Ekron, he brought out Padi from Jerusalem, and resented him on the throne of Ekron. The name of Tirhakah does not occur in his account.<P>5. Struggles with Esar-haddon and Assur-bani-pal. His Death:<P>It would seem to have been Egypt\'s interference in Palestinian affairs which caused the Assyrian kings to desire the conquest of that distant country. According to the Babylonian Chronicle, the Assyrian army fought in Egypt in the 7th year of Esar-haddon (675 BC), and the country was then apparently quiet until 672 BC, when Esar-haddon marched thither, and after fighting three battles, entered Memphis. "The king" (Tirhakah) fled, but his sons and nephews were made prisoners. In the latter campaign (670 BC) Esar-haddon fell ill and died on the way out, so that the operations were, apparently, completed by his son, Assur-bani-pal (Osnap-par); On hearing of the Assyrian success at Kar-Baniti, Tirhakah, who was at Memphis, fled to Thebes. The 20 petty kings installed in Egypt by Esar-haddon were restored by Assur-bani-pal, but they feared the vengeance of Tirhakah after the Assyrian army had retired, and therefore made an agreement with him. On this news reaching the Assyrian king, he sent his army back to Egypt, and the petty rulers having been abolished, Necho king of Memphis and Sais was set on the throne, with his son, Nabu-sizbanni, as ruler in Athribes. On hearing of the success of the Assyrian armies, Tirhakah fled, and died in Cush (Ethiopia). He was suceeded by Tantamane (Identified with Tanut-Amon), son of Sabaco, whom the Assyrians defeated in the last expedition which they ever made to Egypt (see W. F. Petrie, History of Egypt, III, 294ff).``136';
isbe[8814]='Tirhana`tur\'-ha-na, ter-ha\'-na (tirchanah; Codex Vaticanus Tharam; Codex Alexandrinus Tharchna, Lucian Tharaana): A son of Caleb by his concubine, Maacah (<a onClick="return mV(\'1Ch\',2,48);">1Ch 2:48</a>).``1';
isbe[8815]='Tiria`tir\'-i-a, ti\'-ri-a (tireya\', Baer tirya\'; Codex Vaticanus omits it; Codex Alexandrinus Theria; Lucian Ethria): A son of Jehallelel (<a onClick="return mV(\'1Ch\',4,16);">1Ch 4:16</a>).``1';
isbe[8816]='Tirshatha`ter-sha\'-tha, tur\'-sha-tha (tirshatha\'; Hathersatha): A title which occurs 5 times in Ezra and Nehemiah (<a onClick="return mV(\'Ezr\',2,63);">Ezr 2:63</a>; <a onClick="return mV(\'Neh\',7,65);">Ne 7:65</a>, the American Standard Revised Version and the English Revised Version margin "governor"). In <a onClick="return mV(\'Neh\',8,9);">Ne 8:9</a>; <a onClick="return mV(\'Neh\',10,1);">10:1</a>, Nehemiah is called the tirshatha\'. In <a onClick="return mV(\'Ezr\',2,63);">Ezr 2:63</a>; <a onClick="return mV(\'Neh\',7,65,70);">Ne 7:65,70</a>, it is the title of Sheshbazzar, or Zerubbabel. As in <a onClick="return mV(\'Neh\',12,26);">Ne 12:26</a>, Nehemiah is called a pechah, or governor, a title which in <a onClick="return mV(\'Ezr\',5,14);">Ezr 5:14</a> is given to Sheshbazzar also, it has been supposed that pechah and tirshatha\' were equivalent terms, the former being of Assyrio-Babylonian and the latter of Persian origin. According to Lagarde, it comes from the Bactrian antarekshatra, that is, "he who takes the place of the king." According to Meyer and Scheftelowitz it is a modified form of a hypothetical Old Persian word tarsata. According to Gesenius and Ewald, it is to be compared with the Persian torsh, "severe," "austere," i.e. "stern lord." It seems more probable that it is derived from the Babylonian root rashu, "to take possession of," from which we get the noun rashu, "creditor." In this case it may well have had the sense of a tax-collector. One of the principal duties of the Persian satrap, or governor, was to assess and collect the taxes (see Rawlinson\'s Persia, chapter viii). This would readily account for the fact that in <a onClick="return mV(\'Neh\',7,70);">Ne 7:70</a> the tirshatha\' gave to the treasure to be used in the building of the temple a thousand drachms of gold, etc., and that in <a onClick="return mV(\'Ezr\',1,8);">Ezr 1:8</a> Cyrus numbered the vessels of the house of the Lord unto Sheshbazzar. This derivation would connect it with the Aramaic rashya, "creditor," and the New Hebrew rashuth, "highest power," "magistrate."``196';
isbe[8817]='Tirzah`tur\'-za (tirtsah; Thersa):<P>(1) A royal city of the Canaanites, the king of which was slain by Joshua (<a onClick="return mV(\'Jos\',12,24);">12:24</a>). It superseded Shechem as capital of the Northern Kingdom (<a onClick="return mV(\'1Ki\',14,17);">1Ki 14:17</a>, etc.), and itself gave place in turn to Samaria. Here reigned Jeroboam, Nadab his son, Baasha, Elah and Zimri (<a onClick="return mV(\'1Ki\',15,21,33);">1Ki 15:21,33</a>; <a onClick="return mV(\'1Ki\',16,6,8,9,15);">16:6,8,9,15</a>). Baasha was buried in Tirzah. Here Elah was assassinated while "drinking himself drunk" in the house of his steward; here therefore probably he was buried. Zimri perished in the flames of his palace, rather than fall into Omri\'s hands. In Tirzah Menahem matured his rebellion against Shallum (<a onClick="return mV(\'2Ki\',15,14);">2Ki 15:14</a>). The place is mentioned in <a onClick="return mV(\'Sgs\',6,4);">So 6:4</a> the King James Version, where the Shulammite is said to be "beautiful...as Tirzah, comely as Jerusalem." The comparison may be due to the charm of its situation. The name may possibly be derived from ratsah, "to delight." Several identifications have been suggested. Buhl (Geographic des alten Palestina, 203) favors et-tireh, on the west of the plain of Makhneh, 4 miles south of Nablus, which he identifies with the Tira-thana of Josephus. He quotes Neubauer to the effect that the later Jews said Tir\'an or Tar\'ita instead of Tirzah, as weakening the claim of Telluzah, which others (e.g. Robinson, BR, III, 302) incline to. It is a partly ruined village with no spring, but with ancient cisterns, on a hill about 4 miles east of north from Nablus. This was evidently the place intended by Brocardius—Thersa, about 3 miles east of Samaria (Descriptio, VII). A third claimant is Teiasir, a fortress at the point where the road from Abel-meholah joins that from Shechem to Bethshan, fully 11 miles northeast of Nablus. It is impossible to decide with certainty. The heavy "T" in Telluzah is a difficulty. Teiasir is perhaps too far from Shechem. Buhl\'s case for identification with eT-Tireh is subject to the same difficulty as Telluzah.<P>(2) One of the five daughters of Zelophehad (<a onClick="return mV(\'Num\',26,33);">Nu 26:33</a>; <a onClick="return mV(\'Num\',27,1);">27:1</a>; <a onClick="return mV(\'Num\',36,11);">36:11</a>; <a onClick="return mV(\'Jos\',17,3);">Jos 17:3</a>).``54';
isbe[8818]='Tishbite`tish\'-bit.`<a href="./study/isbe/search.html?string=elijah">ELIJAH</a>`1';
isbe[8819]='Tishri; Tisri`tish\'-re, tiz\'-re: The 7th month of the Jewish ecclesiastical, and 1st of the civil, year (September-October). The same as Ethanim.`<a href="./study/isbe/search.html?string=calendar">CALENDAR</a>`1';
isbe[8820]='Titans`ti\'-tanz: In Judith 16:7, "Neither did the sons of the Titans (huioi Titanon) smite him." The name of an aboriginal Canaanitish race of reputed giants who inhabited Palestine before the Hebrews, and so used in the sense of "giants" in general. See <a href="./study/isbe/search.html?string=REPHAIM">REPHAIM</A>. In <a onClick="return mV(\'2Sa\',5,18,22);">2Sa 5:18,22</a>, the "valley of Rephaim" is translated by the Septuagint as "the valley of the Titans."``1';
isbe[8821]='Tithe`tith (ma\'aser; dekate): The custom of giving a 10th part of the products of the land and of the spoils of war to priests and kings (1Macc 10:31; 11:35; <a onClick="return mV(\'1Sa\',8,15,17);">1Sa 8:15,17</a>) was a very ancient one among most nations. That the Jews had this custom long before the institution of the Mosaic Law is shown by <a onClick="return mV(\'Gen\',14,\'17-20\');">Ge 14:17-20</a> (compare <a onClick="return mV(\'Hbr\',7,4);">Heb 7:4</a>) and <a onClick="return mV(\'Gen\',28,22);">Ge 28:22</a>. Many critics hold that these two passages are late and only reflect the later practice of the nation; but the payment of tithes is so ancient and deeply rooted in the history of the human race that it seems much simpler and more natural to believe that among the Jews the practice was in existence long before the time of Moses.<P>In the Pentateuch we find legislation as to tithes in three places.<P>(1) According to <a onClick="return mV(\'Lev\',27,\'30-33\');">Le 27:30-33</a>, a tithe had to be given of the seed of the land, i.e. of the crops, of the fruit of the tree, e.g. oil and wine, and of the herd or the flock (compare <a onClick="return mV(\'Deu\',14,22,23);">De 14:22,23</a>; <a onClick="return mV(\'2Ch\',31,5,6);">2Ch 31:5,6</a>). As the herds and flocks passed out to pasture they were counted (compare <a onClick="return mV(\'Jer\',33,13);">Jer 33:13</a>; <a onClick="return mV(\'Eze\',20,37);">Eze 20:37</a>), and every 10th animal that came out was reckoned holy to the Lord. The owner was not allowed to search among them to find whether they were bad or good, nor could he change any of them; if he did, both the one chosen and the one for which it was changed were holy. Tithes of the herds and flocks could not be redeemed for money, but tithes of the seed of the land and of fruit could be, but a 5th part of the value of the tithe had to be added.<P>(2) In <a onClick="return mV(\'Num\',18,\'21-32\');">Nu 18:21-32</a> it is laid down that the tithe must be paid to the Levites. (It should be noted that according to <a onClick="return mV(\'Hbr\',7,5);">Heb 7:5</a>, \'they that are of the sons of Levi, who receive the office of the priesthood...take tithes of the people.\' Westcott\'s explanation is that the priests, who received from the Levites a tithe of the tithe, thus symbolically received the whole tithe. In the time of the second temple the priests did actually receive the tithes. In the Talmud (Yebhamoth 86a et passim) it is said that this alteration from the Mosaic Law was caused by the sin of the Levites, who were not eager to return to Jerusalem, but had to be persuaded to do so by Ezra (<a onClick="return mV(\'Ezr\',8,15);">Ezr 8:15</a>).) The Levites were to receive the tithes offered by Israel to Yahweh, because they had no other inheritance, and in return for their service of the tabernacle (<a onClick="return mV(\'Num\',18,21,24);">Nu 18:21,24</a>). The tithe was to consist of corn of the threshing-floor and the fullness of the wine press (<a onClick="return mV(\'Num\',18,27);">Nu 18:27</a>), which coincides with seed of the land and fruit of the trees in <a onClick="return mV(\'Lev\',27,\'1-\');">Le 27</a>. The Levites, who stood in the same relation to the priests as the people did to themselves, were to offer from this their inheritance a heave offering, a tithe of a tithe, to the priests (compare <a onClick="return mV(\'Neh\',10,39);">Ne 10:39</a>), and for this tithey were to choose of the best part of what they received.<P>(3) In <a onClick="return mV(\'Deu\',12,5,6,11,18);">De 12:5,6,11,18</a> (compare <a onClick="return mV(\'Amo\',4,4);">Am 4:4</a>) it is said that the tithe is to be brought "unto the place which Yahweh your God shall choose out of all your tribes, to put his name there," i.e. to Jerusalem; and in <a onClick="return mV(\'Deu\',12,7,12,18);">De 12:7,12,18</a>, that the tithe should be used there as a sacred meal by the offerer and his household, including the Levite within his gates. Nothing is said here about tithing cattle, only grain, wine and oil being mentioned (compare <a onClick="return mV(\'Neh\',10,\'36-38\');">Ne 10:36-38</a>; <a onClick="return mV(\'Neh\',13,5,12);">13:5,12</a>). In <a onClick="return mV(\'Deu\',14,\'22-29\');">De 14:22-29</a> it is laid down that if the way was too long to carry the tithe to Jerusalem it could be exchanged for money, and the money taken there instead, where it was to be spent in anything the owner chose; and whatever was bought was to be eaten by him and his household and the Levites at Jerusalem. In the third year the tithe was to be reserved and eaten at home by the Levite, the stranger, the fatherless and the widow. In <a onClick="return mV(\'Deu\',26,\'12-15\');">De 26:12-15</a> it is laid down that in the 3rd year, after this feast had been given, the landowner should go up himself before the Lord his God, i.e. to Jerusalem, and ask God\'s blessing on his deed. (According to the Mishna, Cotah 9 10; Ma\'aser Sheni 5 65, the high priest Johanan abolished this custom.) In this passage this 3rd year is called "the year of tithing."<P>There is thus an obvious apparent discrepancy between the legislation in Leviticus and Deuteronomy. It is harmonized in Jewish tradition, not only theoretically but in practice, by considering the tithes as three different tithes, which are named the First Tithe, the Second Tithe, and the Poor Tithe, which is called also the Third Tithe (Pe\'ah, Ma\'aseroth, Ma\'ser Sheni, Dema\'i, Ro\'sh ha-shanah; compare Tobit 1:7,8; Ant, IV, iv, 3; viii, 8; viii, 22). According to this explanation, after the tithe (the First Tithe) was given to the Levites (of which they had to give the tithe to the priests), a Second Tithe of the remaining nine-tenths had to be set apart and consumed in Jerusalem. Those who lived far from Jerusalem could change this Second Tithe into money with the addition of a 5th part of its value. Only food, drink or ointment could be bought for the money (Ma\'aser Sheni 2 1; compare <a onClick="return mV(\'Deu\',14,26);">De 14:26</a>). The tithe of cattle belonged to the Second Tithe, and was to be used for the feast in Jerusalem (Zebhachim 5 8). In the 3rd year the Second Tithe was to be given entirely to the Levites and the poor. But according to Josephus (Ant., IV, viii, 22) the "Poor Tithe" was actually a third one. The priests and the Levites, if landowners, were also obliged to give the Poor Tithe (Pe\'ah 1 6).<P>The explanation given by many critics, that the discrepancy between Deuteronomy and Leviticus is due to the fact that these are different layers of legislation, and that the Levitical tithe is a post-exilian creation of the Priestly Code, is not wholly satisfactory, for the following reasons:<P>(1) The allusion in <a onClick="return mV(\'Deu\',18,1,2);">De 18:1,2</a> seems to refer to the Levitical tithe.<P>(2) There is no relation between the law of <a onClick="return mV(\'Num\',18,1);">Nu 18</a> and post-exilian conditions, when the priests were numerous and the Levites a handful.<P>(3) A community so poor and disaffected as that of Ezra\'s time would have refused to submit to a new and oppressive tithe burden.<P>(4) The division into priests and Levites cannot have been of the recent origin that is alleged.<P>See <a href="./study/isbe/search.html?string=LEVITES">LEVITES</a>.<P>W. R. Smith and others suggest that the tithe is simply a later form of the first-fruits, but this is difficult to accept, since the first-fruits were given to the priest, while the tithes were not. The whole subject is involved in considerable obscurity, which with our present information cannot easily be cleared away.<P>The Talmudic law of tithing extends the Mosaic Law, with most burdensome minuteness, even to the smallest products of the soil. Of these, according to some, not only the seeds, but, in certain cases, even the leaves and stalks had to be tithed (Ma\'aseroth 4 5), "mint, anise, and cummin" (Dema\'i 11 1; compare <a onClick="return mV(\'Mat\',23,23);">Mt 23:23</a>; <a onClick="return mV(\'Luk\',11,42);">Lu 11:42</a>). The general principle was that "everything that is eaten, that is watched over, and that grows out of the earth" must be tithed (Ma\'aseroth 1 1).<P>Considering the many taxes, religious and secular, that the Jews had to pay, especially in post-exilian times, we cannot but admire the liberality and resourcefulness of the Jewish people. Only in the years just after the return from exile do we hear that the taxes were only partially paid (<a onClick="return mV(\'Neh\',13,10);">Ne 13:10</a>; compare <a onClick="return mV(\'Mal\',1,7);">Mal 1:7</a>ff; and for pre-exilian times compare <a onClick="return mV(\'2Ch\',31,4);">2Ch 31:4</a>ff). In later times such cases seldom occur (Sotah 48a), which is the more surprising since the priests, who benefited so much by these laws of the scribes, were the adversaries of the latter.``98';
isbe[8822]='Title`ti\'-t\'-l: <a onClick="return mV(\'Jhn\',19,19,20);">Joh 19:19,20</a> for titlos.<P>The following arrangement of the title on the cross has been suggested: See Geikie, Life and Words of Christ, chapter lxiii, note e; Seymour, The Cross in Tradition, History and Art (New York, 1898), pp. 115, 116,136, 138.<P>In <a onClick="return mV(\'2Ki\',23,17);">2Ki 23:17</a>, the King James Version has "title" for tsiyyun. The word is connected with tsawah, "to command," and King James Version seems to have understood tsiyyun as "that giving directions," "sign-posts" (compare <a onClick="return mV(\'Eze\',39,15);">Eze 39:15</a>). The word, however, means "grave-stone," "monument."`<a href="./study/isbe/search.html?string=superscription">SUPERSCRIPTION</a>`1';
isbe[8823]='Tittle`tit\'-\'-l (keraia (Westcott-Hort, kerea), from keras, "a horn"): A small stroke or mark, specif. on a letter to denote accent, or as a diacritical mark; used only in <a onClick="return mV(\'Mat\',5,18);">Mt 5:18</a> and <a onClick="return mV(\'Luk\',16,17);">Lu 16:17</a>. In the first passage it is used in connection with iota, or jot, i.e. the very smallest thing, and in both it refers to the minutiae of the Law. It is well known that the scribes paid the greatest attention to such marks attached to the letters in the Hebrew Scriptures, the Massoretic Text of which abounds in them.`<a href="./study/isbe/search.html?string=jot">JOT</a>; <a href="./study/isbe/search.html?string=yodh">YODH</a>`1';
isbe[8824]='Titus`ti\'-tus (Titos (<a onClick="return mV(\'2Cr\',2,13);">2Co 2:13</a>; <a onClick="return mV(\'2Cr\',7,6,13);">7:6,13</a>; <a onClick="return mV(\'2Cr\',8,6,16,23);">8:6,16,23</a>; <a onClick="return mV(\'2Cr\',12,18);">12:18</a>; <a onClick="return mV(\'Gal\',2,1,3);">Ga 2:1,3</a>; <a onClick="return mV(\'2Ti\',4,10);">2Ti 4:10</a>; <a onClick="return mV(\'Tts\',1,4);">Tit 1:4</a>)):<P>1. One of Paul\'s Converts:<P>A Greek Christian, one of Paul\'s intimate friends, his companion in some of his apostolic journeys, and one of his assistants in Christian work. His name does not occur in the Acts; and, elsewhere in the New Testament, it is found only in 2 Corinthians, Galatians, 2 Timothy and Titus. As Paul calls him "my true child after a common faith" (<a onClick="return mV(\'Tts\',1,4);">Tit 1:4</a>), it is probable that he was one of the apostle\'s converts.<P>2. Paul Refuses to Have Him Circumcised:<P>The first notice of Titus is in <a onClick="return mV(\'Act\',15,2);">Ac 15:2</a>, where we read that after the conclusion of Paul\'s 1st missionary journey, when he had returned to Antioch, a discussion arose in the church there, in regard to the question whether it was necessary that Gentile Christians should be circumcised and should keep the Jewish Law. It was decided that Paul and Barnabas, "and certain other of them," should go up to Jerusalem to the apostles and elders about this question. The "certain other of them" includes Titus, for in <a onClick="return mV(\'Gal\',2,3);">Ga 2:3</a> it is recorded that Titus was then with Paul. The Judaistic party in the church at Jerusalem desired to have Titus circumcised, but Paul gave no subjection to these persons and to their wishes, "no, not for an hour; that the truth of the gospel might continue with you" (<a onClick="return mV(\'Gal\',2,5);">Ga 2:5</a>). The matter in dispute was decided as recorded in <a onClick="return mV(\'Act\',15,\'13-29\');">Ac 15:13-29</a>. The decision was in favor of the free promulgation of the gospel, as preached by Paul, and unrestricted by Jewish ordinances. Paul\'s action therefore in regard to Titus was justified. In fact Titus was a representative or test case.<P>It is difficult and perhaps impossible to give the true reason why Titus is not mentioned by name in the Acts, but he is certainly referred to in <a onClick="return mV(\'Act\',15,2);">15:2</a>.<P>3. Sent to Corinth:<P>There is no further notice of Titus for some years afterward, when he is again mentioned in 2 Corinthians. In this Epistle his name occurs 8 times. From the notices in this Epistle it appears that Titus had been sent by Paul, along with an unnamed "brother," to Corinth as the apostle\'s delegate to the church there (<a onClick="return mV(\'2Cr\',12,18);">2Co 12:18</a>). His chief business was evidently to deal with the cases of immorality which had occurred there. His mission was largely successful, so that he was able to return to Paul with joy, because his spirit was refreshed by the Corinthians (<a onClick="return mV(\'2Cr\',7,13);">2Co 7:13</a>). His inward affection was largely drawn out to them, and "he remembereth the obedience of you all, how with fear and trembling ye received him" (<a onClick="return mV(\'2Cr\',7,15);">2Co 7:15</a>). At Corinth Titus seems also to have assisted in organizing the weekly collections for the poor saints in Jerusalem. See <a onClick="return mV(\'1Cr\',16,1,2);">1Co 16:1,2</a> compared with <a onClick="return mV(\'2Cr\',8,6);">2Co 8:6</a>: "We exhorted Titus, that as he had made a beginning before, so he would also complete in you this grace also."<P>After the departure of Titus from Corinth, difficulty had again arisen in the church there, and Titus seems to have been sent by Paul a second time to that city, as the apostle\'s messenger, carrying a letter from him—referred to in <a onClick="return mV(\'2Cr\',2,3);">2Co 2:3</a>ff; <a onClick="return mV(\'2Cr\',7,8);">2Co 7:8</A>ff.<P>4. Paul Goes to Meet Him:<P>The state of the Corinthian church had been causing much anxiety to Paul, so much so that when he had come to Troas to preach Christ\'s gospel, and a door was opened to him of the Lord, he found no rest in his spirit, because he found not Titus, his brother; so he left Troas, and went thence into Macedonia, in order to meet Titus the sooner, so as to ascertain from him how matters stood in Corinth. In Macedonia accordingly the apostle met Titus, who brought good news regarding the Corinthians. In the unrest and fightings and fears which the troubles at Corinth had caused Paul to experience, his spirit was refreshed when Titus reached him. "He that comforteth the lowly, even God, comforted us by the coming of Titus...while he told us your longing, your mourning, your zeal for me; so that I rejoiced yet more" (<a onClick="return mV(\'2Cr\',7,6,7);">2Co 7:6,7</a>).<P>Paul now wrote to the Corinthians again—our Second Epistle to the Corinthians—and dispatched it to its destination by the hand of Titus, into whose heart \'God had put the same earnest care for them\' (<a onClick="return mV(\'2Cr\',8,\'16-18\');">2Co 8:16-18</a>). Titus was also again entrusted with the work of overseeing the weekly collection in the Corinthian church (<a onClick="return mV(\'2Cr\',8,10,24);">2Co 8:10,24</a>).<P>5. Travels with Paul to Crete:<P>There is now a long interval in the history of Titus, for nothing further is recorded of him till we come to the Pastoral Epistles. From Paul\'s Epistle to him these details are gathered: On Paul\'s liberation at the conclusion of his first Roman imprisonment he made a number of missionary journeys, and Titus went with him, as his companion and assistant, on one of these—to the island of Crete. From Crete, Paul proceeded onward but he left Titus to "set in order the things that were wanting, and appoint elders in every city" (<a onClick="return mV(\'Tts\',1,5);">Tit 1:5</a>). Paul reminds him of the character of the people of Crete, and gives him various instructions for his guidance; charges him to maintain sound doctrine, and advises him how to deal with the various classes of persons met with in his pastoral capacity.<P>6. Paul Sends for Him:<P>Titus is informed that Artemas or Tychicus will be sent to Crete so that he will be free to leave the island and to rejoin the apostle at Nicopolis, where he has determined to winter. Such were Paul\'s plans; whether they were carried out is unknown. But this at least is certain, that Titus did rejoin Paul, if not at Nicopolis, then at some other spot; and he was with him in Rome on the occasion of his 2nd imprisonment there, for he is mentioned once again (<a onClick="return mV(\'2Ti\',4,10);">2Ti 4:10</a>) as having gone to Dalmatia, evidently on an evangelistic errand, as the apostle was in the habit of sending his trusted friends to do such work, when he himself was no longer able to do this, owing to his imprisonment. "Paul regarded as his own the work done from centers where he labored, by helpers associated with him, considering the churches thus organized as under his jurisdiction. This throws light upon the statement in <a onClick="return mV(\'2Ti\',4,10);">2Ti 4:10</a>, that Titus at that time had gone to Dalmatia, and a certain Crescens to Gaul. There is no indication that they, like Demas, had deserted the apostle and sought safety for themselves, or that, like Tychicus, they had been sent by the apostle upon some special errand. In either case it would be a question why they went to these particular countries, with which, so far as we know, Paul, up to this time, had never had anything to do. The probability is that Titus, who had long been associated with Paul (<a onClick="return mV(\'Gal\',2,3);">Ga 2:3</a>), who, as his commissioner, had executed difficult offices in Corinth (<a onClick="return mV(\'2Cr\',7,\'1-\');">2Co 7-9</a>), and who, not very long before 2 Timothy was written, had completed some missionary work in Crete that had been begun by others, had gone as a missionary and as Paul\'s representative and helper to Dalmatia....If by this means, beginnings of church organizations had been made...in Spain by Paul himself, in Gaul by Crescens, in Dalmatia by Titus, then, in reality, the missionary map had been very much changed since Paul\'s first defense" (Zahn, Introduction to the New Testament. II, 11).<P>7. His Character:<P>Titus was one of Paul\'s very dear and trusted friends; and the fact that he was chosen by the apostle to act as his delegate to Corinth, to transact difficult and delicate work in the church there, and that he did this oftener than once, and did it thoroughly and successfully, shows that Titus was not merely a good but a most capable man, tactful and resourceful and skillful in the handling of men and of affairs. "Whether any inquire about Titus, he is my partner and fellow-worker to you-ward" (<a onClick="return mV(\'2Cr\',8,23);">2Co 8:23</a>).``155';
isbe[8825]='Titus Justus`tish\'-us jus\'-tus.`<a href="./study/isbe/search.html?string=justus">JUSTUS</a>; <a href="./study/isbe/search.html?string=titus+justus">TITUS JUSTUS</a>`1';
isbe[8826]='Titus Manius``<a href="./study/isbe/search.html?string=manius">MANIUS</a>`1';
isbe[8827]='Titus, Epistle to`(Titos or Titios Ioustos (<a onClick="return mV(\'Act\',18,7);">Ac 18:7</a>)): Titus or Titius—for the manuscripts vary in regard to the spelling—was the prenomen of a certain Corinthian, a Jewish proselyte (sebomenos ton Theon). See <a href="./study/isbe/search.html?string=PROSELYTE">PROSELYTE</A>). His name seems also to indicate that he was a Roman by birth. He is altogether a different person from Titus, Paul\'s assistant and companion in some of his journeys, to whom also the Epistle to Titus is addressed.<P>Titus or Titius Justus was not the "host of Paul at Corinth" (HDB, article "Justus," p. 511), for Luke has already narrated that, when Paul came to Corinth, "he abode with" Aquila and Priscilla (<a onClick="return mV(\'Act\',18,3);">Ac 18:3</a>). What is said of Titius Justus is that when the Jews in Corinth opposed themselves to Paul and blasphemed when he testified that Jesus was the Christ, then Paul ceased to preach the gospel in the Jewish synagogue as he had formerly done, and "he departed thence, and went into the house of a certain man named Titus Justus, one that worshipped God, whose house joined hard to the synagogue" (<a onClick="return mV(\'Act\',18,7);">Ac 18:7</a>).<P>"Titius Justus was evidently a Roman or a Latin, one of the coloni of the colony Corinth. Like the centurion Cornelius, he had been attracted to the synagogue. His citizenship would afford Paul an opening to the more educated class of the Corinthian population" (Ramsay, Paul the Traveler and the Roman Citizen, 256).<P>Paul\'s residence in Corinth continued for a year and a half, followed without a break by another period indicated in the words, he "tarried after this yet many days" (<a onClick="return mV(\'Act\',18,11,18);">Ac 18:11,18</a>), and during the whole of this time he evidently used the house of Titius Justus, for the purposes both of preaching the gospel and of gathering the church together for Christian worship and instruction, "teaching the word of God among them" (<a onClick="return mV(\'Act\',18,11);">Ac 18:11</a>).<P>Titius Justus, therefore, must have been a wealthy man, since he possessed a house in which there was an apartment sufficiently large to be used for both of these purposes; and he himself must have been a most enthusiastic member of the church, when in a period of protracted difficulty and persecution, he welcomed Paul to his house, that he might use it as the meeting-place of the church in Corinth.`<a href="./study/isbe/search.html?string=pastoral+epistles">PASTORAL EPISTLES</a>; <a href="./study/isbe/search.html?string=titus">TITUS</a>; <a href="./study/isbe/search.html?string=titius+justus">TITIUS JUSTUS</a>; <a href="./study/isbe/search.html?string=justus">JUSTUS</a>`155';
isbe[8828]='Tizite`ti\'-zit (ha-titsi; Codex Vaticanus ho Ieasei; Codex Alexandrinus ho Thosaei; Lucian Athosi): A gentilic attached to the name "Joha" (<a onClick="return mV(\'1Ch\',11,45);">1Ch 11:45</a>), one of the soldiers of David; the origin is totally unknown.``1';
isbe[8829]='Toah`to\'-a.`<a href="./study/isbe/search.html?string=nahath">NAHATH</a>`1';
isbe[8830]='Tob, the Land of`tob, tob (\'erets Tobh, "a good land"; ge Tob): Hither Jephthah escaped from his brethren after his father\'s death (<a onClick="return mV(\'Jdg\',11,3);">Jud 11:3</a>), and perfected himself in the art of war, making forays with "the vain fellows" who joined him. Here the elders of Gilead found him, when, reduced to dire straits by the children of Ammon, they desired him to take command of their army (<a onClick="return mV(\'Jdg\',11,5);">Jud 11:5</a>ff). This country contributed 12,000 men to the forces of the allies, who with the Ammonites were defeated by Israel (<a onClick="return mV(\'2Sa\',10,8);">2Sa 10:8</a>). In 1Macc 5:13 we read of the land of Tubins where the Jews, about 1,000 men, were slain by the Gentiles, their wives and children being carried into captivity. The Tubieni, "men of Tobit" of 2Macc 12:17, were probably from this place. Ptolemy (v.19) speaks of Thauba, a place to the southwest of Zobah, which may possibly be Tobit. The Talmud (Neubauer, Geog. du Talmud, 239) identifies the land of Tobit with the district of Hippene. Tobit would then be represented by Hippos, modern Susiyeh, to the southwest of Fiq on the plateau east of the Sea of Galilee. Perhaps the most likely identification is that supported by G. A. Smith (HGHL, 587), with eT-Taiyibeh, 10 miles south of Umm Qeis (Gadara). The name is the same in meaning as Tobit.``54';
isbe[8831]='Tob-Adonijah`tob-ad-o-ni\'-ja, tob-(Tobh \'adhoniyah, "good is the Lord"; Codex Vaticanus Tobadobeia; Codex Alexandrinus and Lucian Tobadonia): One of the Levites sent by King Jehoshaphat to teach in the cities of Judah (<a onClick="return mV(\'2Ch\',17,8);">2Ch 17:8</a>). The name looks like a dittography arising from the two previous names, Adonijah and Tobijah.``1';
isbe[8832]='Tobiah`to-bi\'-a (Tobhiyah; Codex Alexandrinus Tobias; omitted in Codex Vaticanus):<P>(1) An Ammonite slave (King James Version, "servant"), probably of Sanballat, the governor of Samaria (<a onClick="return mV(\'Neh\',2,10);">Ne 2:10</a>). He was grieved exceedingly when Nehemiah came to seek the welfare of the children of Israel. In two ways he was connected by marriage with the Jews, having himself married the daughter of Shecaniah, the son of Arab, and his son Jehohanan having married the daughter of Meshullam, the son of Berechiah (<a onClick="return mV(\'Neh\',6,18);">Ne 6:18</a>). Because of this close connection with the Jews, the nobles of the latter corresponded by letter with him and also reported his good deeds to Nehemiah and reported Nehemiah\'s words to Tobiah. In consequence of the report, Tobiah sent letters to Nehemiah to put him in fear (<a onClick="return mV(\'Neh\',6,17,18,19);">6:17-19</A>). Nehemiah seems to have considered him to be his chief enemy; for he put him before Sanballat in his prayers to God to remember his opponents according to their works (<a onClick="return mV(\'Neh\',6,14);">6:14</A>). In <a onClick="return mV(\'Neh\',13,4);">13:4</A> we are told that he was an ally of Eliashib, the high priest who had the oversight of the chambers of the house of God and had prepared for him as a guest chamber the room which had before been used as a storehouse for offerings of various kinds. Nehemiah, having heard during his second visit to Jerusalem of this desecration of the temple, cast out the household stuff of Tobiah and cleansed the chambers, restoring the vessels of God and the offerings as of old.<P>(2) The eponym of a family which returned with Zerubbabel, but could not trace its descent (<a onClick="return mV(\'Ezr\',2,60);">Ezr 2:60</a>; <a onClick="return mV(\'Neh\',7,62);">Ne 7:62</a>).``196';
isbe[8833]='Tobias`to-bi\'-as:<P>(1) The son of Tobit.<P>See <a href="./study/isbe/search.html?string=TOBIT,+BOOK+OF">TOBIT, BOOK OF</a>.<P>(2) Tobias, Codex Alexandrinus Tobio the father (according to Josephus, grandfather) of <a href="./study/isbe/search.html?string=HYRCANUS">HYRCANUS</A> (which see) (2Macc 3:11).``1';
isbe[8834]='Tobie`to\'-bi.`<a href="./study/isbe/search.html?string=tubias">TUBIAS</a>`1';
isbe[8835]='Tobiel`to-bi\'-el, to\'-bi-el (Tobiel, Codex Alexandrinus Tobiel): The father of Tobit (Tobit 1:1); another form of "Tabeel]" "God is good."``1';
isbe[8836]='Tobijah`to-bi\'-ja (Tobhiyah, "Yahweh is good"):<P>(1) A Levite in the reign of Jehoshaphat whom the king sent to teach in the cities of Judah (<a onClick="return mV(\'2Ch\',17,8);">2Ch 17:8</a>; Tobhiyahu; the Septuagint omits).<P>(2) One of a party of Jews that came from Babylon to Jerusalem with gold and silver for a crown for Zerubbabel and Joshua, or for Zerubbabel alone (<a onClick="return mV(\'Zec\',6,10,14);">Zec 6:10,14</a>). The crown was to be stored in the temple in remembrance of the donors (the Septuagint in both passages translates Tobiyah by chresimoi, i.e. Tobheyha).``1';
isbe[8837]='Tobit, Book of`to\'-bit:<P>1. Name<P>2. Canonicity<P>3. Contents<P>4. Fact or Fiction?<P>5. Some Sources<P>6. Date<P>7. Place of Composition<P>8. Versions<P>9. Original Language<P>LITERATURE<hr /><P>1. Name:<P>The book is called by the name of its principal hero which in Greek is Tobit, Tobeit and Codex N Tobeith. The original Hebrew word thus transliterated (Tobhiyah) means "Yahweh is good." The Greek name of the son is Tobias, a variant of the same Hebrew word. In the English, Welsh, etc., translations, the father and son are called Tobit and Tobias respectively, but in the Vulgate both are known by the same name—Tobias—the cause of much confusion. In Syriac the father is called Tobit, the son Tobiya, following apparently the Greek; the former is not a transliteration of the Hebrew form given above and assumes a different etymology, but what?<P>2. Canonicity:<P>Though this book is excluded from Protestant Bibles (with but few exceptions), Tobit 4:7-9 is read in the Anglican offertory, and at one time Tobias and Sarah occupied in the marriage service of the Anglican rubrics the position at present held by Abraham and Sarah. For the position of the book in the Septuagint, Vulgate and English Versions of the Bible, see <a href="./study/isbe/search.html?string=JUDITH">JUDITH</a>, 2.<P>3. Contents:<P>The Book of Tobit differs in essential matters in its various versions and even in different manuscripts of the same versions (compare the Septuagint). The analysis of the book which follows is based on the Septuagint\'s Codex Vaticanus and Codex Alexandrinus, which English Versions of the Bible follow. The Vulgate differs in many respects. The book tells of two Jewish families, living, one at Nineveh, the other at Ecbatana, both of which had fallen into great trouble, but at length recovered their fortunes and became united by the marriage of the son of one to the daughter of the other. Tobit had, with his brethren of the tribe of Naphtali, been taken captive by Enemessar (= Shalmaneser). remaining in exile under his two successors, Sennacherib and Sarchedonus (Esar-haddon). During his residence in the Northern Kingdom (Israel) and after his removal to Nineveh (Assyria), he continued faithful to the Jewish religion and supported the observances of that religion at Jerusalem. Moreover, he fasted regularly, gave alms freely. and buried such of his fellow-countrymen as had been put to death with the approval or by the command of the Assyrian king. Notwithstanding this loyalty to the religion of his fathers and the fact that he buried Jewish corpses intended to be<P>disgraced by exposure, he like other Jews (Daniel, etc.) won favor at court by his upright demeanor and was made steward of the king\'s estate. Under the next king (Sennacherib) all this was changed, for he not only lost his high office but was deprived of his wealth, and came perilously near to losing his life. Through an accident (bird dung falling into his eyes) he lost his sight, and, to make bad worse, his wife, in the manner of Job\'s, taunted him with the futility of his religious faith. Job-like he prayed that God might take him out of his distress.<P>Now it happened that at this time another Jewish family, equally loyal to the ancestral faith, had fallen into similar distress—Raguel, his wife Edna and his daughter Sarah, who resided at Ecbatana (Vulgate "Rages"; compare Tobit 1:14) in Media. Now Sarah was an only daughter, comely of person and virtuous of character. She had been married to seven successive husbands, but each one of them had been slain on the bridal night by the demon Asmodeus, who seems to have been eaten up with jealousy and wished no other to have the charming maid whom he loved. The parents of Tobias at Nineveh, like those of Sarah at Ecbatana, wished to see their only child married that they might have descendants, but the marriage must be in each case to one belonging to the chosen race (Tobit 3:7-15; but see 7, below). The crux of the story is the bringing together of Tobias and Sarah and the frustration of the jealous murders of Asmodeus. In the deep poverty to which he had been reduced Tobit bethought himself of the money (ten talents, i.e. about 3,500 British pounds) which he had deposited with one Gabael of Rages. The Septuagint\'s Codex Alexandrinus and Codex Vaticanus have Rhagoi) in Media (see Tobit 1:14). This he desired his son to fetch; but the journey is long and dangerous, and he must have a trustworthy guide which he finds in Raphael, an angel sent by God, but who appears in the guise of an orthodox Jew. The old man is delighted with the guide, whom, however, he first of all carefully examines, and dismisses his son with strict injunctions to observe the Law, to give alms and not to take to wife a non-Jewish (EV "strange") maiden (Tobit 4:3ff). Proceeding on the journey they make a halt on reaching the Tigris, and during a bath in the river Tobias sees a fish that made as if it would devour him. The angel tells him to seize the fish and to extract from it and carefully keep its heart, liver and gall. Reaching Ecbatana they are hospitably lodged in the home of Raguel, and at once Tobias falls madly in love with the beautiful daughter Sarah, and desires to have her for wife. This is approved by the girl\'s parents and by Raphael, and the marriage takes place. Before going together for the night the angel instructs the bridegroom to burn the heart and liver of the fish he had caught in the Tigris. The smoke that resulted acted as a countercharm, for it drove away the evil spirit who nevermore returned (Tobit 8:1ff). At the request of Tobias, Raphael leaves for Rages and brings from Gabael the ten talents left in his charge by Tobit. Tobias and his bride led by the angel now set out for Nineveh amid the prayers and blessings of Raguel and with half his wealth. They are warmly welcomed by the aged and anxious parents Tobit and Anna, and Tobias\' dog which he took with him (Tobit 5:16) was so pleased upon getting back to the old home that, according to the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) rendering, he "ran on before as if bringing the news..., showing his joy by fawning and by wagging his tail" (Vulgate Tobit 11:9; compare English Versions of the Bible 11:4). Upon reaching his father, acting upon Raphael\'s directions, Tobias heals Tobit\'s demon-caused blindness by applying to the old man\'s eyes the gall of the fish, whereupon sight returns and the family\'s cup of happiness is full. The angel is offered a handsome fee for the services he has rendered, but, refusing all, he declares who he is and why he was sent by God, who deserves all the praise, he none. Tobit, having a presentiment of the coming doom of Nineveh, urges his son to leave the country and make his home in Media after the death of his parents. Tobias is commanded to write the events which had happened to him in a book (12:20). We then have Tobit\'s hymn of praise and thanksgiving and a record of his death at the age of 158 years (Tobit 13; 14). Tobias and Sarah, in accordance with Tobit\'s advice, leave for Ecabatana. His parents-in-law follow his parents into the other world, and at the age of 127 he himself dies, though not before hearing of the destruction of Nineveh by Nebuchadnezzar (14:13-15).<P>4. Fact or Fiction?:<P>Luther seems to have been the first to call in question the literal historicity of this book, regarding it rather in the light of a didactic romance. The large number of details pervading the book, personal, local and chronological, give it the appearance of being throughout a historical record; but this is but part of the author\'s article. His aim is to interest, instruct and encourage his readers, who were apparently in exile and had fallen upon evil times. What the writer seeks to make clear is that if they are faithful to their religious duties, giving themselves to prayer and almsgiving, burying their dead instead of exposing them on the "Tower of Silence," as did the Persians, then God would be faithful to them as He had been to Tobit.<P>That the book was designed to be a book of religious instruction and not a history appears from the following considerations:<P>(1) There are historical and geographical inaccuracies in the book. It was not Shalmaneser (Enemessar) who made the tribes of Naphtali and Zebulun exiles in Assyria, but Tiglath-pileser (734); see <a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>. Sennacherib was not the son of Shalmaneser (Tobit 1:15), but of Sargon the Usurper. Moreover, the Tigris does not lie on the way from Nineveh to Ecbatana, as Tobit 6f imply.<P>(2) The prominence given to certain Jewish principles and practices makes it clear that the book was written on their account. See Tobit 1:3ff, Tobit\'s integrity, his support of the Jerusalem sanctuary, his almsgiving, etc.: (a) he buries the dead bodies of Jews; (b) he and his wife pray; (c) he teaches Tobias to keep the Law, give alms, etc. Note in particular the teaching of Raphael the angel (Tobit 12:6ff) and that contained in Tobit\'s song of praise (Tobit 13).<P>(3) The writer has borrowed largely from other sources, Biblical and non-Biblical, and he shows no regard for correctness of facts so long as he succeeds in making the teaching clear and the tale interesting. The legend about the angel who pretended to be an orthodox Jew with a proper Jewish name and pedigree was taken from popular tradition and could hardly have been accepted by the writer as literally true.<P>For oral and written sources used by the author of Tobit see the next section. A writer whose aim was to give an exact account of things which happened would hardly have gone to so many sources belonging to such different times, nor would he bring into one life events which in the sources belong to many lives (Job, etc.).<P>5. Some Sources:<P>The Book of Tobit is dependent upon older sources, oral or written, more than is the case with most books in the Apocrypha. The following is a brief statement of some of these:<P>(1) The Book of Job.<P>Besides belonging to the same general class of literature as Job, such as deals with the problem of suffering, Tobit presents us with a man in whose career there are alternations of prosperity and adversity similar to those that meet us in Job. When Anna reproaches her husband for continuing to believe in a religion which fails him at the critical moment (Tobit 2:14), we have probably to see a reflection of the similar incident in Job ("renounce God and die" (<a onClick="return mV(\'Job\',2,9);">Job 2:9</a>)).<P>(2) The Book of Sirach.<P>There are so many parallels between Sirach and Tobit that some kind of dependence seems quite clear. Take the following as typical: Both lay stress on the efficacy of alms-giving (Tobit 4:11; 12:9; compare Sirach 3:30; 29:12; 40:24). Both teach the same doctrine of Sheol as the abode of feelingless shades to which the good as well as the bad go (Tobit 3:6,10; 13:2, compare Sirach 46:19; 14:16; 17:28). The importance of interring the dead is insisted upon in both books (Tobit 1:17; 2:3,7; 4:3f; compare Sirach 7:33; 30:18; 38:16). The same moral duties are emphasized: continued attention to God and the life He enjoins (Tobit 4:5f; 19; compare Sirach 6:37; 8:8-14; 35:10; 37:2); chastity and the duty of marrying within one\'s own people (Tobit 4:12f; 8:6; compare Sirach 7:26; 36:24); proper treatment of servants (Tobit 4:14; compare Sirach 7:20f); the sin of covetousness (Tobit 5:18f; compare Sirach 5); see more fully Speaker\'s Apocrypha, I, 161 f.<P>(3) The Achiqar Legend.<P>We now know that the story of Ahikar referred to in Tobit 14:10 existed in many forms and among many ancient nations. The substance of the legend is briefly that Achiqar was prime minister in Assyria under Sennacherib. Being childless he adopted a boy Nadan (called "Aman" in 14:10) and spared no expense or pains to establish him well in life. Upon growing up the young man turns out badly and squanders, not only his own money, but that of Achiqar. When rebuked and punished by the latter, he intrigues against his adoptive father and by false letters persuades the king that his minister is a traitor. Achiqar is condemned to death, but the executioner saves the fallen minister\'s life and conceals him in a cellar below his (Achiqar\'s) house. In a great crisis which unexpectedly arises the king expresses the wish that he had still with him his old and (as he thought) now executed minister. He is delighted to find after all that he is alive, and he loses no time in restoring him to his lost position, handing over to him Nadan for such punishment as he thinks fit.<P>There can be no doubt that the "Achiacharus" of Tobit (Achiacharos, 1:21f; 2:10; 11:18; 14:10), a nephew of Tobit, is the Achiqar of the above story. George Hoffmann of Kiel (Auszuge aus syrischen Akten persiacher Martyrer) was the first to connect the Achiqar legend with the Achiacharus of Tobit, though he believed that the story arose in the Middle Ages under the influence of Tobit. Modern scholars, however, agree that the story is of heathen origin and of older date than Tobit. Rendel Harris published a Syriac version of this legend together with an Introduction and translation (Cambridge Press, 1898), but more important are the references to this tale in the papyri found at Elephantine and recently published by Eduard Sachau, Aramaic Papyrus und Ostraka, (1911, 147ff). This last proves that the tale is as old as 400 BC at least. For lull bibliography on the subject (up to 1909) see Schurer, GJV4, III, 256ff. See also The Story of Achiqar from the Syriac, Arabic, Armenian, Greek, Slavonic versions by Conybeare, J. Rendel Harris and A. S. Lewis,1898,and in particular Histoire et Sagesse d\'Achiqar, paragraph Francois Nace, 1909.<P>(4) The Book of Esther:<P>The occurrence in Tobit 14:10 of "Aman" for "Nadan" may show dependence upon Esther, in which book Haman, prime minister and favorite of Ahasuerus (Xerxes, 485-464 BC) exhibits treachery comparable with that of Nadan. But Esther seems to the present writer to have been written after and not before Tobit (see Century Bible, "Esther," 299ff). It is much more likely that a copyist substituted, perhaps unconsciously through mental association, the name Haman for that which stood originally in the text. Marshall (HDB, IV, 789) thinks that the author of Tobit was acquainted with the Book of Jubilees, but he really proves no more than that both have many resemblances. In its angelology and demonology the Book of Jubilees is much more developed and belongs to a later date (about 100 BC; see R.H. Charles, Book of Jubilees, lviff, lviiiff). But the two writings have naturally much in common because both were written to express the sentiments of strict Jews living in the 2nd century BC.<P>6. Date:<P>This book seems to reflect the Maccabean age, an age in which faithful Jews suffered for their religion. It is probable that Judith and Tobit owe their origin to the same set of circumstances, the persecutions of the Jews by the Syrian party. The book belongs therefore to about 160 BC. The evidence is external and internal.<P>(1) External.<P>(a) Tobit 14:4-9 implies the existence of the Book of Jonah and also the completion and recognition of the prophetic Canon (about 200 BC).<P>(b) Since Sirach is used as a source, that book must have been written, i.e. Tobit belongs to a later date than say 180 BC.<P>(c) The Christian Father Polycarp in 112 AD quotes from Tobit, but there is no earlier allusion to the book. The external evidence proves no more than that Tobit must have been written after 180 BC and before 112 AD.<P>(2) Internal.<P>(a) Tobit 14:5f seems to show that Jonah was written while the temple of Zerubbabel was in existence, but before this structure had been replaced by the gorgeous temple erected under Herod the Great: i.e. Tobit was written before 25 BC.<P>(b) The stress laid upon the burial of the dead suits well the period of the Syrian persecution, when we know Antiochus Epiphanes allowed Jewish corpses to lie about unburied.<P>(c) We have in Tobit and Judith the same zeal for the Jewish Law and its observance which in a special degree marked the Maccabean age. Noldeke and Lohr (Kautzsch, Apok. des Altes Testament, 136) argue for a date about 175 BC, on the ground that in Tobit there is an absence of that fervent zeal for Judaism and that hatred of men and things non-Jewish which one finds in books written during the Maccabean wars. But we know for certain that when the Maccabean enthusiasm was at its height there existed all degrees of fervor among the Jews, and it would be a strange thing if all the literature of the time represented but one phase of the national life.<P>7. Place of Composition:<P>We have no means of ascertaining who wrote this book, for the ascription of the authorship to Tobit (1:1ff) is but a literary device. There are, however, data which help in fixing the nationality of the writer and the country in which he lived. That the author was a Jew is admitted by all, for no other than a Jew could have shown such a deep interest in Jewish things and in the fortunes of the Jewish nation. Moreover, the fact that Tobit, though member of the Northern Kingdom, is represented as worshipping at the Jerusalem temple and observing the feasts there (1:4-7) makes it probable that the author was a member of the Southern Kingdom wishing to glorify the religion of his country.<P>That he did not live in Palestine is suggested by several considerations:<P>(1) The book describes the varying fortunes of Jews in exile so completely and with such keen sympathy as to suggest that the writer was himself one of them.<P>(2) The affectionate language in which he refers to Jerusalem and its religious associations (Tobit 1:4ff) is such as a member of the Diaspora would use.<P>(3) The author nowhere reveals a close personal knowledge of Palestine. That Tobit, the ostensible author (1:1), should be set forth as a native of Galilee (1:1f) is due to the art of the writer.<P>Assuming that the book was written in a foreign land, opinions differ as to which. The evidence seems to favor either Persia or Egypt. In favor of Persia is the Persian background of the book. Asmodeus (Tobit 3:8,17) is the Pets Aesma daeva. The duty of burying the dead is suggested to the Jewish writer by the Persian (Zoroastrian) habit of exposing dead bodies on the "Tower of Silence" to be eaten by birds. Consanguineous marriages are forbidden in the Pentateuch (see <a onClick="return mV(\'Lev\',18,6);">Le 18:6</a>ff); but they are favored by Tobit 1:9; 3:15; 4:12; 7:4. The latter seems to show that Tobias and Sarah whom he married were first cousins. Marriages between relatives were common among the Iranians and were defended by the magicians as a religious duty. One may say it was allowed in the particular case in question on account of the special circumstances, the fewness of Jews in the parts where the families of Tobit and Raguel lived; compare <a onClick="return mV(\'Num\',36,4);">Nu 36:4</a>ff for another special case. The fact that a dog is made to accompany Tobias on his journey to Ecbatana (Tobit 5:17; 11:4) favors a Persian origin, but is so repugnant to Semitic ideas that it is omitted from the Hebrew versions of this story (see <a href="./study/isbe/search.html?string=DOG">DOG</A>). For an elaborate defense of a Persian origin of Tobit see J. H. Moulton, The Expository Times, XI, 157ff; compare H. Maldwyn Hughes, The Ethics of Jewish Apocryphal Literature, 42ff. The evidence is not decisive; for a knowledge of Iranian modes of thought and expression may be possessed by persons living far away from Iranian territory. And at some points Tobit teaches things contrary to Zoroastrianism. Noldeke and Lohr hold that the book was composed in Egypt, referring to the facts that the demon Asmodeus on being overcome flees to Egypt (8:3) and that there were Jews in Egypt who remained loyal to their ancestral faith and were nevertheless promoted to high places in the state. The knowledge of Mesopotamia shown by the author is so defective (see 4, above) that a Mesopotamian origin for the book cannot be conceived of.<P>8. Versions:<P>Tobit exists in an unusually large number of manuscripts and versions showing that the book was widely read and regarded as important. But what is peculiar in the case of this book is that its contents differ largely—and not seldom in quite essential matters—in the various manuscripts, texts and translations (see 3. above).<P>Tobit has come down to us in the following languages:<P>(1) Greek.<P>Manuscripts of the Greek text belong to three classes:<P>(a) that found in the uncials Codex Vaticanus and Codex Alexandrinus, BA, (which are almost identical) and most Greek manuscripts; our English and other modern translations are made from this;<P>(b) that of Codex Sinaiticus which deviates from (a) often in important matters. The old Latin tallies with this very closely;<P>(c) that of Codices 44, 106 and 107 (adopting the numbers of Holmes and Parsons), which largely coincides with (b).<P>From 7:10 onward this text forms the basis of the Syriac (Peshitta) version Opinions differ as to which of these three Greek texts is the oldest. Fritzsche, Noldeke and Grimm defend the priority of BA. In favor of this are the following: This text exists in the largest number of manuscripts and translations; it is most frequently quoted by the Fathers and other early writers; it is less diffuse and more spontaneous, showing less editorial manipulation. Ewald, Reusch, Schurer, Nestle and J. Rendel Harris hold that &?#1488; [Aleph] represents the oldest Greek text. Schurer (GJV4, III, 243) gives the principal arguments for this view (compare Fuller, Speaker\'s Commentary, I, 168f). &?#1488; [Aleph] is much fuller than BA. Condensation (compare BA) is much more likely, Fuller and Schurer say, than expansion (Codex Sinaiticus); but this is questioned. In some cases, Codex Sinaiticus preserves an admittedly better text, which is of course true often of the Septuagint and even the minor versions as against the Massoretic Text.<P>(2) Latin.<P>(i) The Old Latin based on Codex Sinaiticus found in (i) the editions published in 1751 by Sabbathier (Bib. Sac. Latin versions Antiq.); (ii) in the Book of Tobit (A. Neubauer, 1878). This text exists in at least three recensions. (b) The Vulgate, which simply reproduces Jerome\'s careless translation made in a single night; see (3). In Judith and Tobit, the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) is in every respect identical with its translation made by Jerome.<P>(3) Aramaic (a Term Which Strictly Embraces Syriac).<P>(a) That from which Jerome\'s Jewish help made the Hebrew that formed the basis of Jerome\'s Latin version. We have no copy of this (see next section).<P>(b) That published by Neubauer (Book of Tobit, a Chaldee Text) which was found by him imbedded in a Jewish Midrash of the 15th century.<P>Neubauer was convinced and tried to prove that this is the version which Jerome\'s teacher put into Hebrew and which therefore formed the basis of Jerome\'s own version In favor of this is the fact that in Tobit 1-36, and therefore throughout the book, Tobit is spoken of in the third person alike in this Aramaic (Chaldee) version and in Jerome\'s Latin translation; whereas in all the other versions (compare chapters 1-36) Tobit speaks in the first person ("I," etc.). But the divergences between this Aramaic and Jerome\'s Latin versions are numerous and important, and Neubauer\'s explanations are inadequate (op. cit., viff). Besides, Dalman (Grammatik des jud.-palest. Aramaic,1894,27-29) proves from the language that this version belongs to the 7th century AD or to a later time.<P>(4) Syriac.<P>The text of this version was first printed in the London Polyglot (Volume IV) and in a critically revised form in the Lib. Apocrypha. Vet. Test. Syriac of Lagarde. This text consists of parts of two different versions. The Hexaplar text based on the usual manuscripts (Codex Vaticanus and Codex Alexandrinus etc.) is used from Tobit 1:1-7:9. From 7:10 onward the text corresponds closely with the Greek, &#1488; [Aleph] , and &#1514; [Tav] especially in parts, with the manuscripts 44,106,107. See fully Schurer, GJV4, 244ff.<P>(5) Hebrew.<P>None of the Hebrew recensions are old. Two Hebrew texts of Tobit have been known since the 16th century, having been printed then and often afterward. Both are to be found in the London Polyglot.<P>(a) That known as Hebraeus Munsteri (HM), from the fact that it was published at Basel in 1542 by Sebastian Munster, though it had also been printed in 1516 at Constantinople.<P>(b) That known as Hebraeus Fagii (HF), on account of the fact that Paul Fagius published it in 1542.<P>It had, however, been previously published, i.e. in Constantinople in 1517. HF introduces Biblical phraseology wherever possible. Since these are comparatively late translations they have but little critical value, and the same statement applies to the two following Hebrew translations discovered, edited and translated by Dr. M. Caster (see PSBA, XVIII, 204ff, 259ff; XIX, 27ff):<P>(a) A Hebrew manuscript found in the British Museum and designated by him HL. This manuscript agrees with the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) and Aramaic at some points where the other authorities differ, and Dr. Gaster thinks it not unlikely that in HL we have a copy of the original text. He has not been followed by any scholar in this opinion.<P>(b) Dr. Gaster copied some years ago from a Hebrew Midrash, apparently no longer existing, a condensed Hebrew version (HG) of Tobit. Like HL it agrees often with the Vulgate and Aramaic against other versions and manuscripts.<P>(6) Ethiopic.<P>Dillmann has issued the ancient Ethiopic versions in his Biblia Veteris Testamenti Aethiopica, V, 1894.<P>9. Original Language:<P>The majority of modern scholars, who have a better knowledge of Sere than the older scholars, hold that the original text of Tobit was Semitic (Aramaic or Hebrew); so Ewald, Hilgenfeld, Graetz, Neubauer, Bickell, Fuller (Speaker\'s Apocrypha), Marshall (HDB). In favor of this are the following considerations:<P>(1) The existence of an Aramaic text in Jerome\'s day (see (3), above).<P>(2) The proper names in the book, male and female, have a Semitic character.<P>(3) The style of the writer is Semitic rather than Aryan, many of the expressions making bad Greek, but when turned into Semitic yielding good Aramaic or Hebrew.<P>See the arguments as set out by Fuller (Speaker\'s Apocrypha, I, 164ff). Marshall (HDB, III, 788) gives his reasons for concluding that the original language was Aramaic, not Hebrew, in this opinion following Neubauer (op. cit.). Graetz (Monatsschrift far Geschichte und Wissenschaft der Juden,1879,386ff) gives his grounds for deciding for a Hebrew original. That the book was written in Greek is the view upheld by Fritzsche, Noldeke, W.R. Smith, Schurer and Lbhr. The text of Codex Vaticanus and Codex Alexandrinus says Lohr, contains Greek of the most idiomatic kind, and gives no suggestion of being a translation.<P>LITERATURE.<P>Much of the best literature has been cited in the course of the preceding article. See also "Literature" in article <a href="./study/isbe/search.html?string=APOCRYPHA">APOCRYPHA</a>, for text, comms., etc., and the Bible Dicts., Encyclopedia Biblica (W. Erbt) and HDB (J. T. Marshall). Note in addition the following: K. D. Ilgen, Die Geschichte Tobias, nach den drei verschiedenen Originalen, Griechisch, Lateinisch u. Syriac., etc., 1800; Ewald, Gesch.3, IV, 269-74; Graetz, Gesch.2, IV, 466ff; Noldeke, "Die Texte des Buchs Tobit," Monatsschrift der Berlin Acad.,1879,45ff; Bickell, "A Source of the Book of Tobit," Athenaeum,1890,700ff; 1891, 123ff; I. Abrahams, "Tobit\'s Dog," Jewish Quarterly Review, I,3,288 E. Cosquin, "Le livre de Tobie et l\'histoire du sage Achiqar," Rev. Biblical Int., VIII,1899,50-82, 519-31, rejects R. Harris\' views; Margarete Plath, "Zum Buch Tobit," Stud. und Krit.,1901,377-414; I. Levi, "La langue originale de Tobit," Rev. Juive, XLIV,1902,288-91, Oxford Apocrypha, "Tobit" (full bibliography).``33';
isbe[8838]='Tochen`to\'-ken (tokhen, "task," "measure"; Codex Vaticanus Thokka; Codex Alexandrinus Thochchan): One of the cities of Simeon, mentioned with Rimmen and Ashan (<a onClick="return mV(\'1Ch\',4,32);">1Ch 4:32</a>). The name does not appear in Joshua\'s list (<a onClick="return mV(\'Jos\',19,7);">Jos 19:7</a>), but in that place the Septuagint gives Thokka, from which we may infer that the name has fallen out in the Hebrew. It is not identified.``1';
isbe[8839]='Togarmah`to-gar\'-ma [togharmah]; Thorgama, Thergama, Thurgama, Thurgaba; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Thorgoma):<P>1. Its Forms: A Suggested Identification:<P>The 3rd son of Gomer, and grandson of Japheth, his brothers being Ashkenaz and Riphath (<a onClick="return mV(\'Gen\',10,3);">Ge 10:3</a>). The meaning of the name is doubtful. Grimm (Gesch. deutsch. Sprache, II, 325) suggests Sanskr. toka, "tribe," and arma = Armenia. Etymological and other difficulties stand in the way of French Delitzsch\'s identification of Togarmah with the Assyrian Til-garimmu, "hill of Garimmu," or, possibly, "of the bone-heap," a fortress of Melitene, on the borders of Tabal (Tubal).<P>2. Probably Armenia or a Tract Connected Therewith:<P>In <a onClick="return mV(\'Eze\',27,14);">Eze 27:14</a> Togarmah is mentioned after Tubal, Javan and Mesech as supplying horses and mules to the Tyrians, and in 38:6 it is said to have supplied soldiers to the army of Gog (Gyges of Lydia). In the Assyrian inscriptions horses came from Kusu (neighborhoed of Cappadocia), Andia and Mannu, to the north of Assyria. Both Kiepert and Dillmann regard Togarmah as having been southeastern Armenia, and this is at present the general opinion. The ancient identification of their country with Togarmah by the Armenians, though correct, is probably due to the Septuagint transposition of "g" and "r" (Thorgama for Togarmah), which has caused them to see therein the name of Thorgom, father of Haik, the founder of their race (Moses of Khor, I,4,secs. 9-11). <a onClick="return mV(\'Eze\',27,14);">Eze 27:14</a> (Swete) alone has "g" before "r": Thaigrama. The name "Armenia" dates from the 5th century BC.`<a href="./study/isbe/search.html?string=armenia">ARMENIA</a>; <a href="./study/isbe/search.html?string=table+of+nations">TABLE OF NATIONS</a>`136';

isbe[8842]='Token`to\'-k\'-n (\'oth, usually rendered "sign" (on <a onClick="return mV(\'Deu\',22,14);">De 22:14</a>ff see the comms.)): "Sign" and "token" are virtually synonymous words and in the King James Version are used with little or no distinction (in <a onClick="return mV(\'Exd\',13,\'1-\');">Ex 13</a>, compare <a onClick="return mV(\'Exd\',13,9);">13:9</A> and <a onClick="return mV(\'Exd\',13,16);">16</A>). If there is any difference, "token" is perhaps more concrete and palpable than "sign," but this difference cannot be stressed. The modern use of "token," however, as a "memorial of something past" found in <a onClick="return mV(\'Num\',17,10);">Nu 17:10</a>; <a onClick="return mV(\'Jos\',2,12);">Jos 2:12</a>. the Revised Version (British and American) has substituted sign in <a onClick="return mV(\'Exd\',13,16);">Ex 13:16</a>; <a onClick="return mV(\'Psa\',135,9);">Ps 135:9</a>; <a onClick="return mV(\'Isa\',44,25);">Isa 44:25</a>, and the American Standard Revised Version has "evidence" in <a onClick="return mV(\'Job\',21,29);">Job 21:29</a> (a needlessly prosaic change). The four New Testament examples, <a onClick="return mV(\'Mar\',14,44);">Mr 14:44</a>; <a onClick="return mV(\'Phl\',1,28);">Php 1:28</a>; <a onClick="return mV(\'2Th\',1,5);">2Th 1:5</a>; <a onClick="return mV(\'2Th\',3,17);">3:17</a> (each for a different Greek word) are self-explanatory.`<a href="./study/isbe/search.html?string=sign">SIGN</a>`48';
isbe[8843]='Tokhath`tok\'-hath.`<a href="./study/isbe/search.html?string=tikvah">TIKVAH</a>`1';
isbe[8844]='Tola`to\'-la (tola\', "worm" or "scarlet stuff"):<P>(1) One of the four sons of Issachar (<a onClick="return mV(\'Gen\',46,13);">Ge 46:13</a>; <a onClick="return mV(\'1Ch\',7,1);">1Ch 7:1</a>), mentioned among those who journeyed to Egypt with Jacob (<a onClick="return mV(\'Gen\',46,8);">Ge 46:8</a>f), and in the census taken by Moses and Eleazar, as father of the Tolaites (<a onClick="return mV(\'Num\',26,23);">Nu 26:23</a>) whose descendants in the reign of David included 22,600 "mighty men of valor" (<a onClick="return mV(\'1Ch\',7,2);">1Ch 7:2</a>).<P>(2) One of the Judges, the son of Puah, a man of Isaachar. He dwelt in the hill country of Ephraim in the village of Shamir, where after judging Israel 23 years he was buried (<a onClick="return mV(\'Jdg\',10,1,2);">Jud 10:1,2</a>). In the order of succession he is placed between Abimelech and Jair. It is interesting to note that both Tola and Puah are names of colors, and that they occur together both in the case of the judge and in that of the sons of Isaachar. They may therefore be looked upon as popular typical or ancestral names of the Issachar tribe, although current critical theories seek an explanation in a confusion of texts.``80';
isbe[8845]='Tolad`to-\'lad.`<a href="./study/isbe/search.html?string=eltolad">ELTOLAD</a>`1';
isbe[8846]='Tolaites`to-\'la-its.`<a href="./study/isbe/search.html?string=tola">TOLA</a>`1';
isbe[8847]='Tolbanes`tol\'-ba-nez, tol-ba\'-nez (Tolbanes): One of the porters who had taken foreign wives (1Esdras 9:25) = "Telem" of <a onClick="return mV(\'Ezr\',10,24);">Ezr 10:24</a>; perhaps identical with the porter Talmon (<a onClick="return mV(\'Neh\',12,25);">Ne 12:25</a>).``1';
isbe[8848]='Toll`tol: (1) Aramaic middah, "toll" or "tribute" paid by a vassal nation to its conqueror (<a onClick="return mV(\'Ezr\',4,20);">Ezr 4:20</a>; <a onClick="return mV(\'Ezr\',6,8);">6:8</a>; <a onClick="return mV(\'Neh\',5,4);">Ne 5:4</a>); written also mindah (<a onClick="return mV(\'Ezr\',4,13);">Ezr 4:13</a>; <a onClick="return mV(\'Ezr\',7,24);">7:24</a>). More accurately for halakh, "toll," or "way tax" (<a onClick="return mV(\'Ezr\',4,13,20);">Ezr 4:13,20</a>; <a onClick="return mV(\'Ezr\',7,24);">7:24</a>). In New Testament times the Romans had placed throughout Palestine many toll stations (telonion). Levi the publican was stationed at such a tax office (<a onClick="return mV(\'Mat\',9,9);">Mt 9:9</a>; <a onClick="return mV(\'Mar\',2,14);">Mr 2:14</a>; <a onClick="return mV(\'Luk\',5,27);">Lu 5:27</a>); compare telones, a "tax collector" or "publican." The tax which the Jews paid toward the support of the temple, a didrachma, is called telos, "toll" (<a onClick="return mV(\'Mat\',17,25);">Mt 17:25</a>), the same as the word rendered "tribute" (<a onClick="return mV(\'Rom\',13,7);">Ro 13:7</a>).``137';
isbe[8849]='Tomb`toom.`<a href="./study/isbe/search.html?string=burial">BURIAL</a>`1';
