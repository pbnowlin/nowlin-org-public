isbe[8851]='Tongs`tongz (melqachayim): This word is, where it occurs in the King James Version and the English Revised Version, with two exceptions, changed in the American Standard Revised Version into "snuffers" (<a onClick="return mV(\'Exd\',25,38);">Ex 25:38</a>; <a onClick="return mV(\'Num\',4,9);">Nu 4:9</a>; <a onClick="return mV(\'2Ch\',4,21);">2Ch 4:21</a>; see <a href="./study/isbe/search.html?string=SNUFFERS">SNUFFERS</A>), The exceptions are <a onClick="return mV(\'1Ki\',7,49);">1Ki 7:49</a>, "tongs of gold," and <a onClick="return mV(\'Isa\',6,6);">Isa 6:6</a>, "taken with the tongs from off the altar."<P>In <a onClick="return mV(\'Isa\',44,12);">Isa 44:12</a>, where another word (ma\'atsadh) is used, "the smith with the tongs" of the King James Version is changed in the Revised Version (British and American) into "the smith maketh an axe" (compare <a onClick="return mV(\'Jer\',10,3);">Jer 10:3</a>).`<a href="./study/isbe/search.html?string=altar">ALTAR</a>; <a href="./study/isbe/search.html?string=tools">TOOLS</a>`1';
isbe[8852]='Tongue`tung: Almost invariably for either lashon, or glossa the latter word with the cognates heteroglossos, "of strange tongues" (<a onClick="return mV(\'1Cr\',14,21);">1Co 14:21</a>), glossodes, "talkative," English Versions of the Bible "full of tongue" (Sirach 8:3; 9:18), glossotomeo, "to cut out the tongue" (2Macc 7:4), diglossos, "double-tongued" (Sirach 5:9; 28:13). In <a onClick="return mV(\'1Ti\',3,8);">1Ti 3:8</a>, however, "double-tongued" is for dilogos, literally, "two-worded." Where "tongue" in the King James Version translates dialektos (<a onClick="return mV(\'Act\',1,19);">Ac 1:19</a>; <a onClick="return mV(\'Act\',2,8);">2:8</a>; <a onClick="return mV(\'Act\',21,40);">21:40</a>; <a onClick="return mV(\'Act\',22,2);">22:2</a>; <a onClick="return mV(\'Act\',26,14);">26:14</a>), the Revised Version (British and American) has "language," while for the King James Version "in the Hebrew tongue" in <a onClick="return mV(\'Jhn\',5,2);">Joh 5:2</a>; <a onClick="return mV(\'Rev\',9,11);">Re 9:11</a>; <a onClick="return mV(\'Rev\',16,16);">16:16</a> (Hebraisti) the Revised Version (British and American) has simply "in Hebrew." In addition, in the Old Testament and Apocrypha, the King James Version uses "to hold one\'s tongue" as a translation for various verbs meaning "to be silent"; the Revised Version (British and American) in the Old Testament writes "to hold one\'s peace" and in the Apocrypha "to be silent," except in Sirach 32:8, where the King James Version is retained (siopao).<P>The various uses of "tongue" in English are all possible also for lashon and glossa, whether as the physical organ (<a onClick="return mV(\'Exd\',11,7);">Ex 11:7</a>; <a onClick="return mV(\'Mar\',7,33);">Mr 7:33</a>, etc.) or as meaning "language" (<a onClick="return mV(\'Gen\',10,5);">Ge 10:5</a>; <a onClick="return mV(\'Act\',2,4);">Ac 2:4</a>, etc.) or as describing anything shaped like a tongue (<a onClick="return mV(\'Isa\',11,15);">Isa 11:15</a>; <a onClick="return mV(\'Act\',2,3);">Ac 2:3</a>, etc.). In addition, both words, especially lashon appear in a wider range of meanings than can be taken by "tongue" in modern English. So the tongue appears as the specific organ of speech, where we should prefer "mouth" or "lips" (<a onClick="return mV(\'Exd\',4,10);">Ex 4:10</a>; <a onClick="return mV(\'Psa\',71,24);">Ps 71:24</a>; <a onClick="return mV(\'Psa\',78,36);">78:36</a>; <a onClick="return mV(\'Pro\',16,1);">Pr 16:1</a>; <a onClick="return mV(\'Phl\',2,11);">Php 2:11</a>, etc.), and hence, "tongue" is used figuratively for the words uttered (<a onClick="return mV(\'Job\',6,30);">Job 6:30</a>; <a onClick="return mV(\'Psa\',139,4);">Ps 139:4</a>; <a onClick="return mV(\'1Jo\',3,18);">1Joh 3:18</a>, etc.). So the tongue can be said to have moral qualities (<a onClick="return mV(\'Psa\',109,2);">Ps 109:2</a>; <a onClick="return mV(\'Pro\',15,4);">Pr 15:4</a>, etc.) or to be "glad" (<a onClick="return mV(\'Act\',2,26);">Ac 2:26</a>); to "love with the tongue" (<a onClick="return mV(\'1Jo\',3,18);">1Joh 3:18</a>) is to love in word only, and to be "double-tongued" (Sirach 5:9; 28:13; <a onClick="return mV(\'1Ti\',3,8);">1Ti 3:8</a> is to be a liar. A further expansion of this figurative use has produced expressions that sound slightly bizarre in English, although their meaning is clear enough: e.g., "Who have whet their tongue like a sword" (<a onClick="return mV(\'Psa\',64,3);">Ps 64:3</a>); "His tongue is as a devouring fire" (<a onClick="return mV(\'Isa\',30,27);">Isa 30:27</a>); "My tongue is the pen of a ready writer" (<a onClick="return mV(\'Psa\',45,1);">Ps 45:1</a>), and, especially, "Their tongue walketh through the earth" (<a onClick="return mV(\'Psa\',73,9);">Ps 73:9</a>).<P>In <a onClick="return mV(\'Job\',20,12);">Job 20:12</a>, "Though wickedness be sweet in his mouth, though he hide it under his tongue," the figure is that of an uncultured man rolling a choice morsel around in his mouth so as to extract the utmost flavor. In <a onClick="return mV(\'Psa\',10,7);">Ps 10:7</a>; <a onClick="return mV(\'Psa\',66,17);">66:17</a> (Revised Version margin), however "under the tongue" means "in readiness to utter," while in <a onClick="return mV(\'Sgs\',4,11);">So 4:11</a>, "Honey and milk are under thy tongue," the pleasure of a caress is described. To "divide their tongue" (<a onClick="return mV(\'Psa\',55,9);">Ps 55:9</a>) is to visit on offenders the punishment of Babel.`<a href="./study/isbe/search.html?string=tONGUES,+CONFUSION+OF">TONGUES, CONFUSION OF</a>`48';
isbe[8853]='Tongues of Fire`(glossai hosei puros): The reference in this topic is to the marvelous gift of the Holy Spirit on the Day of Pentecost (<a onClick="return mV(\'Act\',2,\'1-13\');">Ac 2:1-13</a>). After His resurrection the Lord bade His disciples to tarry in Jerusalem until He should fulfill to them the promise of the Father, and until they should be clothed with power from on high (<a onClick="return mV(\'Luk\',24,49);">Lu 24:49</a>). <a onClick="return mV(\'Act\',1,8);">Ac 1:8</a> repeats the same gracious promise with additional particulars: "But ye shall receive power, when the Holy Spirit is come upon you: and ye shall be my witnesses both in Jerusalem, and in all Judea and Samaria, and unto the uttermost part of the earth." These were probably the last words our Lord spoke on earth before He ascended to the right hand of God.<P>1. Supernatural Manifestations:<P>When the Day of Pentecost was fully come and the disciples, no doubt by previous arrangement and with one accord, were gathered together in one place, the promise was gloriously fulfilled. On that day, the 50th after the Passover, and so the first day of the week, the Lord\'s day, the Spirit of God descended upon them in marvelous copiousness and power. The gift of the Spirit was accompanied by extraordinary manifestations or phenomena. These were three and were supernatural. His coming first appealed to the ear. The disciples heard a "sound from heaven," which rushed with mighty force into the house and filled it even as the storm rushes, but there was no wind. It was the sound that filled the house, not a wind. It was an invisible cause producing audible effects. Next, the eye was arrested by the appearance of tongues of fire which rested on each of the gathered company. Our the King James Version "cloven tongues" is somewhat misleading, for it is likely to suggest that each fire-like tongue was cloven or forked, as one sometimes sees in the pictures representing the scene. But this is not at all the meaning of Luke\'s expression; rather, tongues parting asunder, tongues distributed among them, each disciple sharing in the gift equally with the others. "Like as of fire," or, more exactly, "as if of fire," indicates the appearance of the tongues, not that they were actually aflame, but that they prefigured the marvelous gift with which the disciples were now endowed.<P>Finally, there was the impartation to them of a new strange power to speak in languages they had never learned. It was because they were filled with the Holy Spirit that this extraordinary gift was exhibited by them. Not only did the Spirit enable them thus to speak, but even the utterance of words depended on His divine influence—they spake "as the Spirit gave them utterance."<P>Many attempts have been made by writers on the Acts to explain the phenomenon of Pentecost so as to exclude in whole or in part the supernatural element which Luke unquestionably recognizes. Some try to account for the gift of tongues by saying that it was a new style of speaking, or new forms of expression, or new and elevated thoughts, but this is both unnatural and wholly inconsistent with the narrative where a real difference of language is implied. Others imagine that the miracle was wrought upon the ears of the hearers, each of whom supposed what he heard to be uttered in his mother-tongue. But this view contradicts the distinct statement in <a onClick="return mV(\'Act\',2,4);">Ac 2:4</a>: they "began to speak with other tongues," i.e. the disciples did. It contradicts what the multitude affirmed, namely, "How hear we, every man in our own language, wherein we were born?" (<a onClick="return mV(\'Act\',2,8);">2:8</A>). Furthermore, the view contains an element of falsehood, for in this case the miracle was wrought to make men believe what was not actually the fact. The only reasonable explanation of the phenomena is that which the record bears on its face, and which Luke obviously meant his readers to believe, namely, that the Holy Spirit enabled the disciples to speak in the various languages represented by the multitude gathered together at the time.<P>2. Sinai and Pentecost:<P>The scenes witnessed at Pentecost were somewhat analogous to the events which occurred at the giving of the Law at Sinai, but the contrast between them is much more pronounced. We are told in <a onClick="return mV(\'Hbr\',12,18,19);">Heb 12:18,19</a> that "tempest," "fire," and "the voice of words" attended the inauguration of the Mosaic dispensation. Something similar was witnessed at Pentecost. But the differences between the two are very marked. At Sinai there were also the blackness and darkness, the quaking earth, the thunderings and lightnings, the voice of the trumpet exceeding loud, the terror of the people, and the fear of Moses (<a onClick="return mV(\'Exd\',19,\'16-18\');">Ex 19:16-18</a>; <a onClick="return mV(\'Hbr\',12,18,19);">Heb 12:18,19</a>). Nothing of this was seen at Pentecost.<P>The phenomena characterize the two dispensations. That of Sinai was legal. Its substance was: Do and live; disobey and die. Law knows no mercy, extends no grace. Exact justice is its rule, perfect righteousness its requirement, and death its penalty. No wonder terrible things accompanied its proclamation, and Moses trembled with fear. No wonder it was called "a fiery law" (<a onClick="return mV(\'Deu\',33,2);">De 33:2</a>).<P>3. Qualities Imparted by the Spirit:<P>With the advent of the Spirit came perfect grace, divine power and complete pardon for the worst of men. At Sinai God spoke in one language. At Pentecost the Spirit through the disciples spoke in many tongues (15 in all are mentioned in <a onClick="return mV(\'Act\',2,\'1-\');">Ac 2</a>). The Law was for one people alone; the gospel is for the whole race. The sound that accompanied the outpouring of the Spirit filled all the house and all the disciples likewise—token and pledge of the copiousness, the fullness of the gift. The tongues of flame signified the power of speech, boldness of utterance, and persuasiveness which from henceforth were to mark the testimony of the disciples.<P>The marvelous capabilities which the witnesses display after Pentecost are most noteworthy. It is common to admire their courage and zeal, to contrast their fearlessness in the presence of enemies and danger with their former timidity and cowardice. It is perhaps not so common to recognize in them the qualities that lie at the foundation of all effective work, that which gives to witness-bearing for Christ its real energy and potency. These qualities are such as: knowledge and wisdom, zeal and prudence, confidence and devotion, boldness and love. skill and tact. These and the like gifts appear in their discourses, in their behavior when difficulties arise and dangers impend, and in their conduct before the angry rulers. It is altogether remarkable with what skill and tact they defend themselves before the Sanhedrin, and with what effectiveness they preach the gospel of the grace of God to the multitude, often a scoffing and hostile multitude. In Peter\'s address on the Day of Pentecost there are the marks of the highest art, the most skillful logic, and the most, persuasive argument. Professor Stifler well says of it: "It is without a peer among the products of uninspired men. And yet it is the work of a Galilean fisherman, without culture or training, and his maiden effort." The like distinguished traits are found in Peter\'s address recorded in <a onClick="return mV(\'Act\',3,\'1-\');">Ac 3</a>, in that to Cornelius and his friends, and in his defense when arraigned by the strict believers at Jerusalem for having gone into the company of men uncircumcised and having eaten with them. No less must be said of the equally wonderful reply of Stephen to the charge brought against him as recorded in <a onClick="return mV(\'Act\',7,\'1-\');">Ac 7</a>. It is quite true that Stephen did not share in the effusion of the Spirit on the Day of Pentecost, so far as we know, but he did share in the gift and power of the Spirit soon after, for we are told that he was full of faith and of the Holy Spirit, that he was also full of grace and power. Accordingly, it should be no surprise to read, as the effect of his discourse, that the high priest and all the rest who heard him "were cut to the heart, and they gnashed on him with their teeth" (<a onClick="return mV(\'Act\',7,54);">7:54</a>). Stephen spoke with a tongue of fire.<P>In the management of the serious complaint made by the Grecian Jews against the Hebrews as to the neglect of their widows in the daily ministration (<a onClick="return mV(\'Act\',6,1);">Ac 6:1</a>), and in their conduct and defense when brought before the council, as they were once and again (<a onClick="return mV(\'Act\',4,\'1-\');">Ac 4</a>; <a onClick="return mV(\'Act\',5,\'1-\');">5</a>; <a onClick="return mV(\'Act\',12,\'1-\');">12</a>), they exhibited a wisdom and prudence far enough removed from shrewdness and cunning. The qualities they possessed and displayed are uncommon, are more than human, they are the gift of the Holy Spirit with whom they were baptized on Pentecost. So the Lord Jesus had promised (<a onClick="return mV(\'Mar\',13,11);">Mr 13:11</a>; <a onClick="return mV(\'Jhn\',16,13);">Joh 16:13</a>; <a onClick="return mV(\'Act\',1,8);">Ac 1:8</a>).<P>4. Distinguished from <a onClick="return mV(\'1Cr\',12,\'1-\');">1 Corinthians 12</a>; <a onClick="return mV(\'1Cr\',14,\'1-\');">14</a>:<P>The tongues of fire which we have been considering appear to have differed in one important aspect from the like gift bestowed on the Corinthians (<a onClick="return mV(\'1Cr\',12,\'1-\');">1Co 12</a>; <a onClick="return mV(\'1Cr\',14,\'1-\');">14</a>). At Pentecost the disciples spoke in the languages of the various persons who heard them; there needed to be no interpreter, as was provided for at Corinth. Paul distinctly orders that if there be no one to explain or interpret the ecstatic utterance of a speaker, he shall keep silent (<a onClick="return mV(\'1Cr\',14,28);">1Co 14:28</a>). At Pentecost many spoke at the same time, for the Spirit had perfect control of the entire company and used each as it pleased Him. At Corinth Paul directed that not more than two or at most three should speak in a tongue, and that by course (one at a time). At Pentecost each one of the 15 nationalities there represented by the crowd heard in his own tongue wherein he was born the wonderful works of God. At Corinth no one understood the tongue, not even the speaker himself, for it seems to have been a rhapsody, an uncontrolled ecstatic outburst, and in case there was no one to interpret or explain it, the speaker was to hold his peace and speak to himself and to God, i.e. he must not disturb the worship by giving voice to his ecstasy unless the whole assembly should be edified thereby. Paul sets prophecy, or preaching the word of God, far above this gift of tongues.<P>It may not be out of place here to say that the so-called "gift of tongues," so loudly proclaimed by certain excitable persons in our day, has nothing in common with the mighty action of the Spirit of God on the day of Pentecost, and hardly anything with that which the Corinthian Christians enjoyed, and which Paul regulated with a master-hand.<P>LITERATURE.<P>Stifler, Introduction to the Book of Acts; Alexander, Commentary on the Acts; Kuyper, Work of the Holy Spirit; Moorehead, Outline Studies in Acts—Ephesians.`<a href="./study/isbe/search.html?string=tongues,+gift+of">TONGUES, GIFT OF</a>`123';
isbe[8854]='Tongues, Confusion of`tungz:<P>1. The Narrative:<P>According to <a onClick="return mV(\'Gen\',11,\'1-9\');">Ge 11:1-9</a>, at some time not very long after the Flood, "the whole earth was of one language and of one speech. And it came to pass, as they journeyed east" (the "they" is left vague) that they settled in the land of Shinar (Babylonia). There they undertook to build "a city, and a tower, whose top may reach unto heaven," using the Bah burned brick and "slime" as building materials. The motive was to "make us a name; lest we be scattered abroad upon the face of the whole earth." This seems to mean that the buildings would give them a reputation for impregnability that would secure them against devastating invasions. "And Yahweh came down to see." And He said, "Nothing will be withholden from them, which they purpose to do. Come, let us go down, and there confound their language." The persons spoken to are not named (compare <a onClick="return mV(\'Gen\',1,26);">Ge 1:26</a>; <a onClick="return mV(\'Gen\',3,22);">3:22</a>), nor is it explained how Yahweh, who in <a onClick="return mV(\'Gen\',11,5);">Ge 11:5</a> was on earth, is now in heaven. "So Yahweh scattered them abroad from thence," and the name of the city was "called Babel (babhel); because Yahweh did there confound (balal) the language of all the earth: and from thence did Yahweh scatter them abroad upon the face of all the earth."<P>The purpose of this narrative is the explanation of the diversity of human languages. They originated through an act of Yahweh, in order to destroy the presumptuous designs of the first builders of Babylon.<P>2. Context:<P>The section admittedly belongs to J and it has no connection with the matter (mostly P) in <a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10</a>. For <a onClick="return mV(\'Gen\',10,\'1-\');">Genesis 10</a> explains the origin of the nations "every one after his tongue, after their families" (<a onClick="return mV(\'Gen\',10,5,20,31);">10:5,20,31</A>) as due to the orderly migration and gradual spreading of the sons and descendants of Noah, and names Nimrod (<a onClick="return mV(\'Gen\',10,10);">10:10</>) as the sole founder of Babylon. Nor does <a onClick="return mV(\'Gen\',11,\'1-9\');">11:1-9</a> logically continue the J matter in <a onClick="return mV(\'Gen\',9,\'1-\');">Genesis 9</a>, as too many persons are involved for the time immediately following the Flood. Still, it is quite possible that some J matter was dropped when the J and P sources were united at this point. Another possibility is to see in <a onClick="return mV(\'Gen\',11,\'1-9\');">Ge 11:1-9</a> the continuation of <a onClick="return mV(\'Gen\',4,\'16-24\');">Ge 4:16-24</a>, which it carries on smoothly, with the same distrust of human culture. The murderer Cain went to the east of Eden (<a onClick="return mV(\'Gen\',4,16);">4:16</A>), and his descendants brought in the knowledge of the various arts (<a onClick="return mV(\'Gen\',4,20,21,22);">4:20-22</a>). These descendants journeyed still farther to the east (<a onClick="return mV(\'Gen\',11,2);">11:2</A>), attempted to use their skill in building the tower and were punished by the balal catastrophe. No account of the Deluge could have followed, for all the diversities of languages would have been wiped away by that event.<P>This assumption of a special, early source within J probably best explains the facts. It is indicated by the very primitive, naive theology, which is much less developed than that of J as a whole. And the obscure relation of <a onClick="return mV(\'Gen\',11,\'1-9\');">Ge 11:1-9</a> to the Flood narrative is accounted for, for two narratives were combined here, one of which contained an account of the Deluge, while the other did not.<P>3. Homogeneity:<P>By using the repeated "going down" of verses <a onClick="return mV(\'Gen\',11,5,7);">5,7</a> as a clue, the section can be resolved fairly easily into two narratives, e.g.<P>(1) The men build a tower, "whose top may reach unto heaven," in order to make a name for themselves as marvelous builders. Yahweh, seeing the work beginning and "lest nothing be withholden from them," etc., goes down and confounds their language.<P>(2) The men build a city, as a defensive measure, "lest we be scattered abroad on the face of the whole earth." Yahweh goes down to see and scatters them abroad. For other analyses see the commentaries.<P>But they are hardly imperative. For (2) gives no motive for Yahweh\'s action, while "city" and "tower," "confusion of tongues" and "scattering," are complementary rather than parallel terms. The supposition that a few words describing Yahweh\'s return to heaven have disappeared somewhere from verse 6 relieves the awkwardness.<P>4. Historicity:<P>The "historicity" of the narrative will be upheld by very few persons of the present day. Human languages began to diverge (if, indeed there ever was such a thing as a primitive language) tens, if not hundreds, of thousands of years before the building of Babylon and long before human beings had attained enough skill to erect the most rudimentary structures, let alone such an elaborate affair as the brick-built city and tower of Babel. And what is true of languages as a whole is equally true of the languages spoken in the vicinity of Palestine. If Egyptian Hittite, and the Semitic group have any common point of origin, it lies vastly back of the time and cultural conditions presupposed in <a onClick="return mV(\'Gen\',11,\'1-9\');">Ge 11:1-9</a>. It is needless to enlarge on this, but for the harm done by a persistent clinging to the letter of the narrative, White\'s History of the Warfare of Science with Theology may be consulted. It belonged to the genius of the Hebrews to seek religious explanations of the things around them. And such an explanation of the origin of languages is the content of <a onClick="return mV(\'Gen\',11,\'1-9\');">Ge 11:1-9</a>.<P>5. Sources:<P>This explanation seems, as yet, to be without parallel, for the translation of the fragmentary British Museum Inscription K 3657 is entirely uncertain. Indeed, legends as to how the differences of human speech began seem to be extremely scanty everywhere, as if the question were not one that occupied the minds of primitive people. Comparative folklore still has much work to do as regards this special topic (for a few references see Encyclopedia Brit, 11th edition, article "Babel" and Gunkel Genesis3 in the place cited.). The other features of the narrative, however, are without great significance. Buildings that were unfinished because the builders offended the gods are fairly abundant, and it is quite possible that the writer of <a onClick="return mV(\'Gen\',11,\'1-9\');">Ge 11:1-9</a> had some particular Bah structure in mind (see <a href="./study/isbe/search.html?string=BABEL,+TOWER+OF">BABEL, TOWER OF</a>). Nor are attempts of men to climb into heaven difficult to conceive, when the sky is thought of (as it nearly always was until comparatively modern times) as a material dome. So Greek Baruch (3:6f) specifies that they "built the tower to the height of 463 cubits. And they took a gimlet, and sought to pierce the heaven, saying, Let us see whether the heaven is made of clay, or of brass, or of iron." Closely parallel to the Babel story is the Greek legend of the giants, who piled Pelion on Ossa in their attempt to storm the dwelling of the gods, and, as a matter of fact, the two accounts seem to be combined in Sib Or 3:97-104.<P>Whether aided by a tradition about some particular Babylonian tower or not, the localization of the story in Babylonia was inevitable. The Babylonians, above all nations in the world, relied on their wisdom and their skill, and so nowhere but in Babylon would this supreme presumption have been possible. Babylon, the embodiment of pride, at the very beginning of her existence was guilty of an act of pride so overwhelming as to call out God\'s vengeance. The "folk-etymology" babhel-balal (in Aramaic babhel-balbel) may have been suggested by this story or (perhaps more probably) it may have originated separately, perhaps at first as a piece of deliberate irony. Certainly the many languages that could be heard in Babylon were not without significance for the story.<P>6. Religious Value:<P>The religious value of the story is dimmed for the modern reader because of the very primitive concepts that it contains. The men are able to build up into heaven. In order to see what they are doing Yahweh is obliged to "come down." He is obliged to take action lest His dwelling-place be invaded (compare <a onClick="return mV(\'Gen\',3,22);">Ge 3:22</a>). And the "let us go down" of <a onClick="return mV(\'Gen\',11,7);">Ge 11:7</a>, while certainly not polytheistic, is equally certainly a polytheistic "remnant." On the other hand, it is to be noted that God\'s power is never in question and that there is no desperate and uncertain battle as in the Greek legend. Important, also (and often overlooked), is the realization that God\'s power is just as active in Babylon as it is in Palestine. The primal meaning to the Israelite, however, was this: In Babylon was seen the greatest enemy of the people of God, possessing immeasurable resources. Humanly speaking, there were no limits to this power, and if it had been uncontrolled at the beginning, all the world would have been overwhelmed with the rule of evil. This God had prevented.<P>LITERATURE.<P>Driver in HDB; Cheyne (art. "Babel, Tower of") in EB; the commentaries. on Genesis, especially those of Skinner, Driver, Procksch, and Gunkel.``48';
isbe[8855]='Tongues, Gift of`1. Basic Character of <a onClick="return mV(\'1Cr\',14,\'1-\');">1 Corinthians 14</a>:<P>A spiritual gift mentioned in <a onClick="return mV(\'Act\',10,\'44-46\');">Ac 10:44-46</a>; <a onClick="return mV(\'Act\',11,15);">11:15</a>; <a onClick="return mV(\'Act\',19,6);">19:6</a>; <a onClick="return mV(\'Mar\',16,17);">Mr 16:17</a>, and described in <a onClick="return mV(\'Act\',2,\'1-13\');">Ac 2:1-13</a> and at length in <a onClick="return mV(\'1Cr\',12,\'1-\');">1Co 12-14</a>, especially chapter <a onClick="return mV(\'1Cr\',14,\'1-\');">14</A>. In fact, <a onClick="return mV(\'1Cr\',14,\'1-\');">1Co 14</a> contains such a full and clear account that this passage is basic. The speaker in a tongue addressed God (<a onClick="return mV(\'1Cr\',14,2,28);">14:2,28</A>) in prayer (<a onClick="return mV(\'1Cr\',14,14);">14:14</A>), principally in the prayer of thanksgiving (<a onClick="return mV(\'1Cr\',14,15,16,17);">14:15-17</a>). The words so uttered were incomprehensible to the congregation (<a onClick="return mV(\'1Cr\',14,2,5,9);">14:2,5,9</a>, etc.), and even to the speaker himself (<a onClick="return mV(\'1Cr\',14,14);">14:14</A>). Edification, indeed, was gained by the speaker (<a onClick="return mV(\'1Cr\',14,4);">14:4</A>), but this was the edification of emotional experience only (<a onClick="return mV(\'1Cr\',14,14);">14:14</A>). The words were spoken "in the spirit" (<a onClick="return mV(\'1Cr\',14,2);">14:2</a>); i.e. the ordinary faculties were suspended and the divine, specifically Christian, element in the man took control, so that a condition of ecstasy was produced. This immediate (mystical) contact with the divine enabled the utterance of "mysteries" (<a onClick="return mV(\'1Cr\',14,2);">14:2</a>)—things hidden from the ordinary human understanding (see <a href="./study/isbe/search.html?string=MYSTERY">MYSTERY</A>). In order to make the utterances comprehensible to the congregation, the services of an "interpreter" were needed. Such a man was one who had received from God a special gift as extraordinary as the gifts of miracles, healings, or the tongues themselves (<a onClick="return mV(\'1Cr\',12,10,30);">12:10,30</a>); i.e. the ability to interpret did not rest at all on natural knowledge, and acquisition of it might be given in answer to prayer (<a onClick="return mV(\'1Cr\',14,13);">14:13</A>). Those who had this gift were known, and Paul allowed the public exercise of "tongues" only when one of the interpreters was present (<a onClick="return mV(\'1Cr\',14,28);">14:28</A>). As the presence of an interpreter was determined before anyone spoke, and as there was to be only one interpreter for the "two or three" speakers (<a onClick="return mV(\'1Cr\',14,28);">14:28</a>), any interpreter must have been competent to explain any tongue. But different interpreters did not always agree (<a onClick="return mV(\'1Cr\',14,26);">14:26</a>), whence the limitation to one.<P>2. Foreign Languages Barred Out:<P>These characteristics of an interpreter make it clear that "speaking in a tongue" at Corinth was not normally felt to be speaking in a foreign language. In <a onClick="return mV(\'1Cr\',14,10);">1Co 14:10</a> English Versions of the Bible are misleading with "there are, it may be, so many kinds of voices in the world," which suggests that Paul is referring directly to the tongues. But tosauta there should be rendered "very many," "ever so many," and the verse is as purely illustrative as is <a onClick="return mV(\'1Cr\',14,7);">14:7</a>. Hence, foreign languages are to be barred out. (Still, this need not mean that foreign phrases may not occasionally have been employed by the speakers, or that at times individuals may not have made elaborate use of foreign languages. But such cases were not normative at Corinth.) Consequently, if "tongues" means "languages," entirely new languages must be thought of. Such might have been of many kinds (<a onClick="return mV(\'1Cr\',12,28);">12:28</A>), have been regarded as a fit creation for the conveyance of new truths, and may even at times have been thought to be celestial languages—the "tongues of angels" (<a onClick="return mV(\'1Cr\',13,1);">13:1</A>). On the other hand, the word for "tongue" (glossa) is of fairly common use in Greek to designate obsolete or incomprehensible words, and, specifically, for the obscure phrases uttered by an oracle. This use is closely parallel to the use in Corinth and may be its source, although then it would be more natural if the "ten thousand words in a tongue" of <a onClick="return mV(\'1Cr\',14,19);">14:19</A> had read "ten thousand glossai." In no case, however, can "tongue" mean simply the physical organ, for <a onClick="return mV(\'1Cr\',14,18,19);">14:18,19</A> speaks of articulated words and uses the plural "tongues" for a single speaker (compare <a onClick="return mV(\'1Cr\',14,5,6);">14:5,6</A>).<P>3. A State of Ecstasy:<P>A complete explanation of the tongues is given by the phenomena of ecstatic utterances, especially when taken in connection with the history of New Testament times. In ecstasy the soul feels itself so suffused with the divine that the man is drawn above all natural modes of perception (the understanding becomes "unfruitful"), and the religious nature alone is felt to be active. Utterances at such times naturally become altogether abnormal. If the words remain coherent, the speaker may profess to be uttering revelations, or to be the mere organ of the divine voice. Very frequently, however, what is said is quite incomprehensible, although the speaker seems to be endeavoring to convey something. In a still more extreme case the voice will be inarticulate, uttering only groans or outcries. At the termination of the experience the subject is generally unconscious of all that has transpired.<P>For the state, compare Philo, Quis rerum. divin., li-liii.249-66: "The best (ecstasy) of all is a divinely-infused rapture and \'mania,\' to which the race of the prophets is subject....The wise man is a sounding instrument of God\'s voice, being struck and played upon invisibly by Him....As long as our mind still shines (is active)...we are not possessed (by God)...but...when the divine light shines, the human light sets....The prophet...is passive, and another (God) makes use of his vocal organs." Compare, further, the descriptions of Celsus (Origen, Contra Celsus, vii.9), who describes the Christian "prophets" of his day as preaching as if God or Christ were speaking through them, closing their words with "strange, fanatical, and quite unintelligible words of which no rational person can find the meaning." The Greek papyri furnish us with an abundance of magical formulas couched in unintelligible terms (e.g. Pap. Lond.,121,"Iao, eloai, marmarachada, menepho, mermai, ieor, aeio, erephie, pherephio," etc.), which are not infrequently connected with an ecstatic state (e.g. Reitzenstein, Poimandres, 53-58).<P>Interpretation of the utterances in such a state would always be difficult and diversities of interpretation would be unavoidable. Still, with a fixed content, such as the Christian religion gave, and with the aid of gestures, etc., men who felt that they had an understanding of such conditions could undertake to explain them to the congregation. It is to be noted, however, that Paul apparently does not feel that the gift of interpretation is much to be relied on, for otherwise he would have appraised the utility of tongues more highly than he does. But the popularity of tongues in Corinth is easily understood. The speaker was felt to be taken into the closest of unions with God and hence, to be an especial object of God\'s favor. Indeed, the occurrence of the phenomenon in a neo-convert was irrefragable proof that the conversion was approved by God (<a onClick="return mV(\'Act\',10,\'44-48\');">Ac 10:44-48</a>; <a onClick="return mV(\'Act\',11,15);">11:15</a>; <a onClick="return mV(\'Act\',19,6);">19:6</a>). So in <a onClick="return mV(\'Mar\',16,17);">Mr 16:17</a> the gift is treated as an exceptional and miraculous divine blessing (in this verse "new" is textually uncertain, and the meaning of the word, if read, is uncertain also). Moreover, for the more selfish, the gift was very showy (<a onClick="return mV(\'1Cr\',13,1);">1Co 13:1</a> suggests that it was vociferous), and its possession gratified any desire for personal prominence.<P>4. The Account in <a onClick="return mV(\'Act\',2,\'1-\');">Ac 2</a>:<P>The account in <a onClick="return mV(\'Act\',2,\'1-\');">Ac 2</a> differs from that of <a onClick="return mV(\'1Cr\',14,\'1-\');">1Co 14</a> in making the tongues foreign languages, although the ability to use such languages is not said to have become a permanent apostolic endowment. (Nor is it said that the speech of <a onClick="return mV(\'Act\',2,\'14-36\');">Ac 2:14-36</a> was delivered in more than one language.) When the descent of the Spirit occurred, those who were assembled together were seized with ecstasy and uttered praises to God. A crowd gathered and various persons recognized words and phrases in their own tongues; nothing more than this is said. That the occasion was one where a miracle would have had unusual evidential value is evident, and those who see a pure miracle in the account have ample justification for their position. But no more than a providential control of natural forces need be postulated, for similar phenomena are abundantly evidenced in the history of religious experience. At times of intense emotional stress the memory acquires abnormal power, and persons may repeat words and even long passages in a foreign language, although they may have heard them only once. Now the situation at Jerusalem at the time of the Feast gave exactly the conditions needed, for then there were gathered pilgrims from all countries, who recited in public liturgical passages (especially the Shemoneh \'Esreh) in their own languages. These, in part, the apostles and the "brethren" simply reproduced. Incomprehensible words and phrases may well have been included also (<a onClick="return mV(\'Act\',2,13);">Ac 2:13</a>), but for the dignity of the apostles and for the importance of Pentecost Luke naturally cared to emphasize only the more unusual side and that with the greatest evidential value. It is urged, to be sure, that this interpretation contradicts the account in <a onClick="return mV(\'1Cr\',14,\'1-\');">1Co 14</a>. But it does so only on the assumption that the tongues were always uniform in their manifestation and appraisement everywhere—and the statement of this assumption is its own refutation. If the modern history of ecstatic utterances has any bearing on the Apostolic age, the speaking in foreign languages could not have been limited only to Pentecost. (That, however, it was as common as the speaking in new "languages" would be altogether unlikely.) But both varieties Luke may well have known in his own experience.<P>5. Religious Emotionalism:<P>Paul\'s treatment of the tongues in <a onClick="return mV(\'1Cr\',12,\'1-\');">1Co 12-14</a> is a classical passage for the evaluation of religious emotionalism. Tongues are a divine gift, the exercise is not to be forbidden (<a onClick="return mV(\'1Cr\',14,39);">14:39</A>), and Paul himself is grateful that he has the gift in an uncommon degree (<a onClick="return mV(\'1Cr\',14,18);">14:18</A>). Indeed, to those who treat them simply with scorn they become a "sign" that hardening is taking place (<a onClick="return mV(\'1Cr\',14,21,22,23);">14:21-23</A>). Yet a love of them because they are showy is simply childish (<a onClick="return mV(\'1Cr\',14,20);">14:20</A>; <a onClick="return mV(\'1Cr\',13,11);">13:11</a>), and the possessor of the gift is not to think that he has the only thing worth obtaining (<a onClick="return mV(\'1Cr\',12,\'1-\');">1Co 12</a>). The only gift that is utterly indispensable is love (<a onClick="return mV(\'1Cr\',13,\'1-\');">1Co 13</a>), and without it tongues are mere noise (<a onClick="return mV(\'1Cr\',13,1);">13:1</a>). The public evidential value of tongues, on which perhaps the Corinthians were inclined to lay stress, Paul rates very low (<a onClick="return mV(\'1Cr\',14,21,22,23);">14:21-23</A>). Indeed, when exercised in public they tend to promote only the self-glorification of the speaker (<a onClick="return mV(\'1Cr\',14,4);">14:4</a>), and so are forbidden when there is not an interpreter, and they are limited for public use at all times (<a onClick="return mV(\'1Cr\',14,27,28);">14:27,28</A>). But the ideal place for their exercise is in private: "Let him speak to himself, and to God" (<a onClick="return mV(\'1Cr\',14,28);">14:28</a>). The applicability of all this to modern conditions needs no commentary. Ultra-emotionalistic outbreaks still cause the formation of eccentric sects among us, and every evangelist knows well-meaning but slightly weak individuals who make themselves a nuisance. On the other hand, a purely intellectual and ethical religion is rather a dreary thing. A man who has never allowed his religious emotions to carry him away may well be in a high state of grace—but he has missed something, and something of very great value.<P>See also <a href="./study/isbe/search.html?string=SPIRITUAL+GIFTS">SPIRITUAL GIFTS</A>; <a href="./study/isbe/search.html?string=TONGUES+OF+FIRE">TONGUES OF FIRE</a>.<P>LITERATURE.<P>Plumptre in DB is still useful. Wright, Some New Testament Problems (1898), and Walker, The Gift of Tongues and Other Essays (1906), have collections of material. Of the commentaries on 1 Corinthians those of Heinrici (latest edition, 1896), Lietzmann (1907) and J. Weiss (1910) are much the best, far surpassing Robertson and Plummer in ICC (1911). For the Greek material, see ... in the index of Rhode\'s Psyche. Gunkel, Die Wirkungen des heiligen Geistes (1888, 2nd reprint in 1909), was epoch-making. For the later period, see Weinel, Die Wirkungen des Gelstes und der Geister (1899); Lake, The Earlier Epistles of Paul (London, 1911); and see Inge in The Quarterly Review (London, 1914).``48';
isbe[8856]='Tongues, Interpretation, of`in-tur-pre-ta\'-shun.`<a href="./study/isbe/search.html?string=spiritual+gifts">SPIRITUAL GIFTS</a>; <a href="./study/isbe/search.html?string=tongues,+gift+of">TONGUES, GIFT OF</a>`1';
isbe[8857]='Tools`toolz: In the Bible, references to the handicrafts are almost entirely incidental, and not many tools are named. The following article aims to give a list of those mentioned, together with those that must have existed also. For detailed description and the Hebrew and Greek terms employed, see the separate articles.<P>(1) The percussion tool was the hammer, used for splitting or trimming stone, beating metals, and in wood-carving, as well as for driving nails, tent pins, etc. Several words are translated "hammer," but the distinction between them is very vague and in some cases the propriety of the translation is dubious. Certainly no such distinction is made as that between "hammer" and "mallet," nor were separate names given to the different hammers used in the various crafts (compare, e.g., <a onClick="return mV(\'Jdg\',4,21);">Jud 4:21</a>; <a onClick="return mV(\'1Ki\',6,7);">1Ki 6:7</a>; <a onClick="return mV(\'Isa\',44,12);">Isa 44:12</a>; <a onClick="return mV(\'Jer\',10,4);">Jer 10:4</a>—all for maqqabhah).<P>See <a href="./study/isbe/search.html?string=HAMMER">HAMMER</a>.<P>(2) Of cutting tools, the simplest was of course the knife. In <a onClick="return mV(\'Exd\',20,25);">Ex 20:25</a>, however, the knife ("sword," English Versions of the Bible "tool") appears as a stone-cutter\'s implement and is without doubt a chisel. But the hatchet of <a onClick="return mV(\'Psa\',74,6);">Ps 74:6</a> may be a knife.<P>See <a href="./study/isbe/search.html?string=HATCHET">HATCHET</A>; <a href="./study/isbe/search.html?string=KNIFE">KNIFE</A>.<P>For ax, again, various words are employed in a way that is quite obscure to us and apparently with meanings that are not fixed. So garzen in <a onClick="return mV(\'Deu\',20,19);">De 20:19</a> is certainly an ax, but in the Siloam Inscription (ll 2,4) it is a pickax (see <a href="./study/isbe/search.html?string=MATTOCK">MATTOCK</a>). The various words translated "ax" (the Revised Version (British and American) "axe") must also somewhere include the word for adz, but the specific term, if there were any such (ma\'atsadh(?)), is unknown. But the adz is a very ancient tool and must certainly have existed in Palestine.<P>See <a href="./study/isbe/search.html?string=AX+(AXE),+AX-HEAD">AX (AXE), AX-HEAD</a>.<P>The saw was used both for wood and for stone (<a onClick="return mV(\'1Ki\',7,9);">1Ki 7:9</a>), in the latter case being employed in connection with water and sand. But sawing stone was a very laborious process, and this was one reason why the ancients preferred stone in large blocks. These were quarried by the use of heavy hammers and wedges.<P>See <a href="./study/isbe/search.html?string=SAW">SAW</A>.<P>The plane (maqtso\'ah) of <a onClick="return mV(\'Isa\',44,13);">Isa 44:13</a> should be translated chisel. Chisels, of course, are almost as old as humanity, and were used on both wood and stone and doubtless also on metals. In particular, with a broad chisel and an adz the surface of wood may be finished very smoothly, and these two implements took the place of the plane. For wood-carving the concave chisel (gouge) may have been invented.<P>The pencil of <a onClick="return mV(\'Isa\',44,13);">Isa 44:13</a> is probably a stylus, for engraving as well as for marking out lines. For engraving on gems (<a onClick="return mV(\'Exd\',28,9);">Ex 28:9</a>, etc.) particularly delicate instruments of this kind must have been used.<P>See <a href="./study/isbe/search.html?string=LINE">LINE</a>; <a href="./study/isbe/search.html?string=PENCIL">PENCIL</a>.<P>(3) Among the boring tools, only the awl appears (<a onClick="return mV(\'Exd\',21,6);">Ex 21:6</a>; <a onClick="return mV(\'Deu\',15,17);">De 15:17</a>), an instrument primarily for the use of workers in leather. Holes in wood or stone were made by a drill, often worked with the aid of a drawn bow, through the string of which the drill was passed.<P>See <a href="./study/isbe/search.html?string=AWL">AWL</A>.<P>(4) Blunted tools were of course sharpened on stones, as everywhere. In <a onClick="return mV(\'1Sa\',13,21);">1Sa 13:21</a> English Versions of the Bible speaks of sharpening with a file, but the text of the verse is hopelessly corrupt and the translation mere guesswork. But files of some sort (stone?) must of course have been used by metal-workers.<P>See <a href="./study/isbe/search.html?string=FILE">FILE</A>.<P>(5) Measuring tools were the line and the rod (see <a href="./study/isbe/search.html?string=REED">REED</a>), and the latter must also have been used as a straight-edge. The compasses of <a onClick="return mV(\'Isa\',44,13);">Isa 44:13</a> were for drawing circles, but doubtless served for measuring also. See <a href="./study/isbe/search.html?string=COMPASSES">COMPASSES</a>. Plumb-line (\'anakh in <a onClick="return mV(\'Amo\',7,7);">Am 7:7</a>f; a symbol of the searching moral investigation which would be followed by a precise and exact judgment; compare mishkoleth, "plummet," <a onClick="return mV(\'2Ki\',21,13);">2Ki 21:13</a>; <a onClick="return mV(\'Isa\',28,17);">Isa 28:17</a>) and plummet (\'ebhen bedhil, "a stone of tin," <a onClick="return mV(\'Zec\',4,10);">Zec 4:10</a>, used by Zerubbabel in testing the completed walls) were likewise necessities and had existed from a very early period. Tools of some sort must have been used in addition by builders in drawing plans, but their nature is unknown.<P>See <a href="./study/isbe/search.html?string=LINE">LINE</A>.<P>(6) The tools for holding and handling work (vises, tongs, pincers, etc.) are never alluded to (the King James Version in <a onClick="return mV(\'Isa\',44,12);">Isa 44:12</a> is wrong; see <a href="./study/isbe/search.html?string=TONGS">TONGS</A>). For moving larger objects no use was made of cranes, and lifting was done by the aid of inclined planes and rollers; but blocks of stone weighing hundreds of tons could be handled in this way.<P>The material of the Hebrew tools was either iron or bronze. The former was introduced at least by the time of David (<a onClick="return mV(\'2Sa\',12,31);">2Sa 12:31</a>), but the mention of iron as a material is often made in such a way (<a onClick="return mV(\'Amo\',1,3);">Am 1:3</a>, etc.) as to show that it was not to be taken for granted. In fact, iron was hard to work and expensive, and bronze probably persisted for a while as a cheaper material. Stone tools would be used only by the very poor or as occasional makeshifts or for sacred purposes (<a onClick="return mV(\'Jos\',5,2);">Jos 5:2</a>).`<a href="./study/isbe/search.html?string=agriculture">AGRICULTURE</a>; <a href="./study/isbe/search.html?string=carpenter">CARPENTER</a>; <a href="./study/isbe/search.html?string=crafts">CRAFTS</a>; <a href="./study/isbe/search.html?string=potter,+smith">POTTER, SMITH</a>`48';
isbe[8858]='Toparchy`to\'-par-ki, top\'-ar-ki (toparchia): the King James Version renders this Greek word by "government" in 1Macc 11:28 (the King James Version margin and the Revised Version (British and American) "province"). It denotes a small administrative district corresponding to the modern Turkish Nahieh, administered by a Mudir. Three such districts were detached from the country of Samaria and added to Judea. Elsewhere (1Macc 10:30; 11:34) the word used to describe them is nomos. Some idea of the size of these districts may be gathered from the fact that Judea was divided into ten (Pliny v.14) or eleven (BJ, III, iii, 5) toparchies.``1';
isbe[8859]='Topaz`to\'-paz.`<a href="./study/isbe/search.html?string=stones,+precious">STONES, PRECIOUS</a>`1';
isbe[8860]='Tophel`to\'-fel (tophel; Tophol): This name is found in a passage with many difficulties (<a onClick="return mV(\'Deu\',1,1);">De 1:1</a>). The verse ostensibly makes clearer the position occupied by the camp of Israel where Moses addressed the people, by reference to certain other places which might be presumed to be better known. Not one of them, however, has been satisfactorily identified. Some think Tophel may be represented by the modern et-tafeleh, 15 miles southeast of the Dead Sea, on the caravan road from Petra to Kerak. Apart from the question of position, the change of "t" to "T" is not easily explained. Meantime we must suspend judgment.``54';
isbe[8861]='Topheth`to\'-feth (ha-topheth, etymology uncertain; the most probable is its connection with a root meaning "burning"—the "place of burning"; the King James Version, Tophet, except in <a onClick="return mV(\'2Ki\',23,10);">2Ki 23:10</a>): The references are to such a place: "They have built the high places of Topheth, which is in the valley of the son of Hinnom, to burn their sons and their daughters in the fire" (<a onClick="return mV(\'Jer\',7,31);">Jer 7:31</a>). On account of this abomination Topheth and the Valley of Hinnom should be called "The valley of Slaughter: for they shall bury in Topheth, till there be no place to bury," the Revised Version margin "because there shall be no place else" (<a onClick="return mV(\'Jer\',7,32);">Jer 7:32</a>); see also <a onClick="return mV(\'Jer\',19,6,12,13,14);">Jer 19:6,12,13,14</a>. Josiah is said to have "defiled Topheth" as part of his great religious reforms (<a onClick="return mV(\'2Ki\',23,10);">2Ki 23:10</a>). The site of this shameful place would seem to have been either at the lower end of the Valley of Hinnom (see <a href="./study/isbe/search.html?string=HINNOM,+VALLEY+OF">HINNOM, VALLEY OF</A>), near where Akeldama is now pointed out, or in the open ground where this valley joins the Kidron.``117';
isbe[8862]='Torah`to\'-ra.`<a href="./study/isbe/search.html?string=law+in+the+old+testament">LAW IN THE OLD TESTAMENT</a>; <a href="./study/isbe/search.html?string=revelation">REVELATION</a>`1';
isbe[8863]='Torch`torch (lappidh; lampas; in the King James Version this word occurs only 4 times (<a onClick="return mV(\'Nah\',2,3,4);">Na 2:3,4 (Hebrew 4,5)</a>; <a onClick="return mV(\'Zec\',12,6);">Zec 12:6</a>; <a onClick="return mV(\'Jhn\',18,3);">Joh 18:3</a>). In the Revised Version (British and American) it is found 10 times (<a onClick="return mV(\'Gen\',15,17);">Ge 15:17</a>; <a onClick="return mV(\'Jdg\',7,16,20);">Jud 7:16,20</a>; <a onClick="return mV(\'Job\',41,19);">Job 41:19 (Hebrew 11)</a>; <a onClick="return mV(\'Eze\',1,13);">Eze 1:13</a>; <a onClick="return mV(\'Dan\',10,6);">Da 10:6</a>; <a onClick="return mV(\'Nah\',2,4);">Na 2:4 (Hebrew 5)</a>; <a onClick="return mV(\'Zec\',12,6);">Zec 12:6</a>; <a onClick="return mV(\'Jhn\',18,3);">Joh 18:3</a>; <a onClick="return mV(\'Rev\',8,10);">Re 8:10</a>)): A flambeau; a large portable light.`<a href="./study/isbe/search.html?string=lamp">LAMP</a>; <a href="./study/isbe/search.html?string=lantern">LANTERN</a>`1';
isbe[8864]='Tormah`tor\'-ma (tormah, "fraud"; Codex Vaticanus en kruphe, "in secret," Codex Alexandrinus meta doron, "with gifts"): This name is given in EVm as an alternative to "privily", or "craftily" the Revised Version (British and American) (<a onClick="return mV(\'Jdg\',9,31);">Jud 9:31</a>). There is no knowledge of such a place. The text is corrupt.``1';
isbe[8865]='Torment, Place of`tor\'-ment: A literal translation in <a onClick="return mV(\'Luk\',16,28);">Lu 16:28</a> of topos tes basanou.`<a href="./study/isbe/search.html?string=hell">HELL</a>`1';
isbe[8866]='Tormentor`tor-men\'-ter: the King James Version 2Macc 7:29 for demios "belonging to the people," and so "public executioner," the Revised Version (British and American) "butcher." A term of utter contempt, whose force is lost in the King James Version. Also <a onClick="return mV(\'Mat\',18,34);">Mt 18:34</a> for basanistes, "torturer." Normally the bankrupt debtor was sold into slavery. But, apparently, in extreme cases (where concealment of assets was suspected?) the defaulter was sent to prison until restitution should be made. Probably the imprisonment itself was regarded as "torment" (as it doubtless was), and the "tormentors" need mean nothing more than jailers.``48';
isbe[8867]='Tortoise`tor\'-tus, tor\'-tis, tor\'-tois. (the King James Version) (tsabh, the Revised Version (British and American) "great lizard"; compare the Arabic word, dabb, the thorny-tailed lizard): The word tsabh occurs as the name of an animal only in <a onClick="return mV(\'Lev\',11,29);">Le 11:29</a>, being the third in the list of unclean "creeping things."<P>The same word is found in <a onClick="return mV(\'Isa\',66,20);">Isa 66:20</a>, translated "litters," and in <a onClick="return mV(\'Num\',7,3);">Nu 7:3</a>, where \'eghloth tsabh is translated "covered wagons." Gesenius derives the word, in all senses, from the root cabhabh, "to move gently," "to flow"; compare Arabic dabba, "to flow." The Arabic noun dabb is Uromastix spinipes, the Arabian thorny-tailed lizard. This lizard is about 18 inches long, its relatively smooth body being terminated with a great tail armed with rings of spiny scales. The Arabs have a familiar proverb, \'a\'kad min dhanab ud-dabb, "knottier than the tail of the dabb." The Septuagint has for tsabh in <a onClick="return mV(\'Lev\',11,29);">Le 11:29</a> ho krokodeilos ho chersaios, the English equivalent of which, "land-crocodile," is used by the Revised Version (British and American) for the fifth in the list of unclean "creeping things," koach, the King James Version "chameleon."<P>The writer does not know what can have led the translators of the King James Version to use here the word "tortoise." Assuming that the thorny-tailed lizard is meant, the "great lizard" of the Revised Version (British and American) may be considered to be a fair translation.`<a href="./study/isbe/search.html?string=lizard">LIZARD</a>`37';
isbe[8868]='Totemism`to\'-tem-iz\'-m: How far the belief in totems and totemistic relationships existed in early Israel cannot be discussed at length here. Evidence of the belief in deified animal ancestors is supposed by some writers to be found in the tribal names Leah ("wild cow"?), Rachel ("ewe"), Simeon (synonymous with the Arabic sim\'u, which denotes a cross between a wolf and a hyena), Hamor ("ass"), Caleb ("dog"), Zibiah ("gazelle"), etc. But these names in themselves "do not prove a totem stage in the development of Israel" (HPN, 114); philologically, the view has a shaky foundation (see, e.g. article "Leah" in 1-vol HDB).<P>Again, it is true that, as a rule, in totemic communities the individual may not kill or eat the name-giving object of his kin, these animals being regarded as sacred in totem worship and therefore "unclean" (taboo) as food. But the attempt to connect such personal names as Shaphan ("rock-badger"), Achbor ("mouse"), Huldah ("weasel")—all from the time of Josiah (<a onClick="return mV(\'2Ki\',22,3,12,14);">2Ki 22:3,12,14</a>; compare Deborah ("bee"), Gaal ("beetle"?), Told ("crimson worm," "cochineal"), Nabash ("serpent"))—with the list of unclean animals in <a onClick="return mV(\'Lev\',11,\'1-\);">Le 11</a> (see <a onClick="return mV(\'Lev\',11,5);">11:5</a> (margin), <a onClick="return mV(\'Lev\',11,29);">29</a>) and <a onClick="return mV(\'Deu\',14,\'1-\');">De 14</a> is beset with difficulties (compare, however, <a onClick="return mV(\'Isa\',66,17);">Isa 66:17</a>; <a onClick="return mV(\'Eze\',8,10);">Eze 8:10</a>f), since all the names cannot possibly be explained on this ground.<P>See also <a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE, II,2,(4); VI, 1.</A><P>Robertson Smith (followed by Stade and Benzinger) strongly advocated the view "that clear traces of totemism can be found in early Israel" (see HDB, III, 100). G. B. Gray also seems inclined to favor the view that some of these names may be "indirectly derivative from a totem stage of society" (HDB, III, 483f), while at the same time he recognizes that "the only question is whether other explanations are not equally satisfactory" (HPN, 105).<P>Other writers, such as Wellhausen, Noldeke (ZDMG, 157f; 1886), Marti (Gesch. der israelit. Religion, 4th edition, 24), Addis (Hebrew Rel., 33f), have opposed or abandoned theory as applied to Israel.<P>"Upon the whole we must conclude once more that, while it is certainly possible that Totemism once prevailed in Israel, its prevalence cannot be proved; and, above all, we must hold that the religion of Israel as it presents itself in the Old Testament has not retained the very slightest recollection of such a state of things" (Kautzsch, HDB, extra vol, 614f; compare p. 623).<P>The theory is also opposed by Job. Jacobs (article "Are there Totem-Clans in the Old Testament?" in Archaeol. Review, III (1889), <span class="noTag">number 3</span>, 145ff); F.V. Zapletal, Der Totemismus u. die Religion Israels; and S. A. Cook, in JQR, XIV, number 55.<P>The evidence on either side is inconclusive, but the weight of authority is opposed to the view that totemism ever existed in Israel. What is certain is that totemism was never a potent factor, either in the early religion of Israel as an organized people, or in any of the dominant cults of the historical period as a whole (see articles "Family" in HDB, I, 850 (Bennett); "Sacrifice," HDB, IV, 331 (Paterson], and <a href="./study/isbe/search.html?string=DEFILEMENT">DEFILEMENT</a> (Crannell), <a href="./study/isbe/search.html?string=IMAGES">IMAGES</A>, 3, 6 (Cobern), and <a href="./study/isbe/search.html?string=ISRAEL,+RELIGION+OF">ISRAEL, RELIGION OF</a>, II,1,(4) (Orelli), in this Encyclopedia).<P>LITERATURE.<P>In addition to the works cited in the text, see, for theory of the prevalence of totemism in early Israel, W. R. Smith, Religion of the Semites (2nd edition, 1894), Kinship and Marriage in Early Arabia (1903); A. F. Scot, Offering and Sacrifice (1900); and I. Benzinger, Hebraische Archaol. (1907); against, Eric Brit, 11th edition, XIII,177, article "Hebrew Religion" (Whitehouse); Standard BD, 782; Temple DB, article "Shaphan." For a general account and discussion of totemism, see Frazer, Totemism and Exogamy (1910) and The Golden Bough (3rd edition, 1907-13); Westermarck, History of Human Marriage (1891); Deans, Tales from the Totems of Hidery (1898); Lang, Myth, Ritual, Religion (new edition, 1899), The Secret of the Totem (1905), and article "Totemism" in Encyclopedia Brit, 11th edition, XXVII, with extensive bibliography; HDB, extra vol, 115; and Cymru, 1892-93, p. 137; 1893-94, p. 7.``91';
isbe[8869]='Tou`to\'-oo (to\'u; Codex Vaticanus Thoa; Codex Alexandrinus Thoou): King of Hamath. As an enemy of Hadarezer, after David\'s victory over the latter, he sent David a message of congratulation (<a onClick="return mV(\'1Ch\',18,9);">1Ch 18:9</a>f). In <a onClick="return mV(\'2Sa\',8,9);">2Sa 8:9</a>f spelled "Toi."``1';
isbe[8870]='Tow`to (ne\'oreth (<a onClick="return mV(\'Jdg\',16,9);">Jud 16:9</a>; <a onClick="return mV(\'Isa\',1,31);">Isa 1:31</a>)): The coarser part of flax, with short threads, used as an example of easily inflammable material. Also <a onClick="return mV(\'Isa\',43,17);">Isa 43:17</a> the King James Version for pishtah, the usual word for "flax" (so the English Revised Version), here as used for a wick (so the American Standard Revised Version, the English Revised Version margin).``1';

isbe[8876]='Tower of Ivory`(mighdal hashen): Occurs only in <a onClick="return mV(\'Sgs\',7,4);">So 7:4</a>. Cheyne would, not unreasonably, emend the text and read the "tower of Shenir" as a parallel to the "tower of Lebanon" in the same verse. If the reading "tower of ivory" is correct, the reference must be to some piece of furniture in the adornment of which ivory was much used, and when we compare the word mighdal here with its use for a "pulpit" in <a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>, we can think only of a reminiscence of something of the nature of the throne of ivory made by Solomon (<a onClick="return mV(\'1Ki\',10,18);">1Ki 10:18</a>).``23';
isbe[8877]='Tower of Lebanon`(mighdal ha-lebhanon): (<a onClick="return mV(\'Sgs\',7,4);">So 7:4</a>)): The designation "which looketh toward Damascus" compels us to identify it with some portion of, or something in, the eastern range of "Lebanon, toward the sun-rising" (<a onClick="return mV(\'Jos\',13,5);">Jos 13:5</a>). It would then of necessity correspond to the chief summit of Hermon, on which there has been from ancient times also a tower-like temple, and from which the view is almost of boundless extent, Damascus with its gardens and groves being surprisingly near and appearing like a beautiful island in a wide extended sea.`<a href="./study/isbe/search.html?string=lebanon">LEBANON</a>`23';

isbe[8880]='Tower of Shechem`(mighdal shekhem): Mentioned only in <a onClick="return mV(\'Jdg\',9,\'46-49\');">Jud 9:46-49</a>. It seems along with the Beth-millo and the Beth-el-berith to have comprised the three strongest parts of the fortification when Abimelech besieged the town. It was, however, abandoned by its defenders, who took refuge in the Beth-millo, in which they were slain.``1';
