isbe[8801]='Timnath-Serah`tim-nath-se\'-ra (timnath cerach; Codex Vaticanus Thamarchdres; Codex Alexandrinus Thamathsara): This place, assigned as an inheritance to Joshua, is described as being in Mt. Ephraim, on the north side of the mountain of Gaash (<a onClick="return mV(\'Jos\',19,50);">Jos 19:50</a>; <a onClick="return mV(\'Jos\',24,30);">24:30</a>). Here, when his work was done, the great leader was laid to rest. The mountain of Gaash unfortunately cannot be identified. Josephus says that Joshua was buried at Thamna, a city of Ephraim (Ant., V, i, 29), which probably corresponds to Thamna, the head of a Jewish toparchy (BJ, III, iii, 5). Vespasian marched from Thamnatha to Lydda, which apparently was near (IV, viii, 1). The place was taken and reduced to slavery by Cassius (Ant., XIV, xi, 2). It was put in charge of John the Essene at the beginning of the Jewish war (BJ, II, xx, 4). Eusebius, Onomasticon (s.v. "Thamna" and "Thamnathsara") identifies it with "Timnath" of <a onClick="return mV(\'Gen\',38,12);">Ge 38:12</a> the King James Version, placing it in the mountain in the tribe of Dan (or Judah), on the way from Diospolis (Lydda) to Jerusalem. The tomb of Joshua was still shown there. This points to Tibneh, in the uplands 12 miles northeast of Lydda. South of the village, in the face of a rock, are a series of rock-hewn tombs, the largest of which, containing 14 loculi, and a small chamber behind with one loculus, may be that associated with Joshua by Eusebius, Onomasticon. A giant oak grows hard by perhaps the greatest tree in Palestine. Kefr Ishu\'a, "village of Joshua," lies about 3 miles to the east. This identification is now generally accepted.<P>The Samaritan tradition points to the tomb of Joshua at Kefr Charis, 9 miles south of Nablus. Outside the village to the east are two shrines. One is called Neby Kifl, the other, Neby Kala\'a. The former, "prophet of division," or "of the portion," might apply to Joshua; the latter is identified with Caleb. This identification assumes that the first element of the name has fallen out, the second only surviving.``54';
isbe[8802]='Timnite`tim\'-nit (timni Thamnathaios): The father of Samson\'s wife, a native of Timnah (<a onClick="return mV(\'Jdg\',15,6);">Jud 15:6</a>).``1';
isbe[8803]='Timon`ti\'-mon (Timon): One of "the seven" chosen to relieve the apostles by attending to "the daily ministration" to the poor of the Christian community in Jerusalem (<a onClick="return mV(\'Act\',6,5);">Ac 6:5</a>). The name is Greek, but as Nicolaus is distinguished from the remaining six as a proselyte, Timon and the others were probably Jews by birth.``1';
isbe[8804]='Timotheus`ti-mo\'-the-us (Timotheos):<P>(1) A leader of the children of Ammon who was on several occasions severely defeated by Judas Maccabeus (1Macc 5:6ff, 34ff; 2Macc 8:30; 9:3; 10:24; 19:2,18ff) in 165-163 BC. According to 2Macc 10:37, he was slain at Gazara after having hidden in a cistern. But in 2Macc 12:2 he is again at liberty as an opponent of the Jews, and in 12:24f he falls into the hands of Dositheus and Sosipater, but by representing that many Jewish captives were at his mercy and likely to suffer if he were put to death, he is again released. These discrepancies are so great—though not unusual in 2Maccabees—that some suppose another Timotheus is referred to in 12:2ff. He is most probably the same person, the careless author of 2Maccabees making a slip in saying Timotheus was killed at Gazara. He probably escaped by hiding in the cistern. The Greek name for an Ammonite leader is striking:<P>(a) he may have been a genuine Ammonite with a Greek name, or<P>(b) a Syro-Macedonian officer placed by Syrian authority over the Ammonites, or<P>(c) a Greek soldier of fortune invited by the Ammonites to be their commander.<P>(2) See next article.``5';
isbe[8805]='Timothy`tim\'-o-thi (Timotheos (<a onClick="return mV(\'Act\',17,14);">Ac 17:14</a>; <a onClick="return mV(\'Act\',18,5);">18:5</a>; <a onClick="return mV(\'Act\',19,22);">19:22</a>; <a onClick="return mV(\'Act\',20,4);">20:4</a>; <a onClick="return mV(\'Rom\',16,21);">Ro 16:21</a>; <a onClick="return mV(\'1Cr\',4,17);">1Co 4:17</a>; <a onClick="return mV(\'1Cr\',16,10);">16:10</a>; <a onClick="return mV(\'2Cr\',1,1,19);">2Co 1:1,19</a>; <a onClick="return mV(\'Phl\',1,1);">Php 1:1</a>; <a onClick="return mV(\'Phl\',2,19);">2:19</a>; <a onClick="return mV(\'Col\',1,1);">Col 1:1</a>; <a onClick="return mV(\'1Th\',1,1);">1Th 1:1</a>; <a onClick="return mV(\'1Th\',3,2,6);">3:2,6</a>; <a onClick="return mV(\'2Th\',1,1);">2Th 1:1</a>; <a onClick="return mV(\'1Ti\',1,2,18);">1Ti 1:2,18</a>; <a onClick="return mV(\'1Ti\',6,20);">6:20</a>; <a onClick="return mV(\'2Ti\',1,2);">2Ti 1:2</a>; <a onClick="return mV(\'Phm\',1,1);">Phm 1:1</a>; <a onClick="return mV(\'Hbr\',13,23);">Heb 13:23</a>; the King James Version, Timotheus):<P>1. One of Paul\'s Converts:<P>Timothy was one of the best known of Paul\'s companions and fellow-laborers. He was evidently one of Paul\'s own converts, as the apostle describes him as his beloved and faithful son in the Lord (<a onClick="return mV(\'1Cr\',4,17);">1Co 4:17</a>); and in <a onClick="return mV(\'1Ti\',1,2);">1Ti 1:2</a> he writes to "Timothy my true child in faith"; and in <a onClick="return mV(\'2Ti\',1,2);">2Ti 1:2</a> he addresses him as "Timothy my beloved child."<P>2. A Native of Lystra:<P>He was a resident, and apparently a native, either of Lystra or Derbe, cities which were visited and evangelized by Paul on his 1st missionary journey (<a onClick="return mV(\'Act\',14,6);">Ac 14:6</a>). It is probable that of these two cities, it was Lystra treat was Timothy\'s native place. For instance, in <a onClick="return mV(\'Act\',20,4);">Ac 20:4</a> in a list of Paul\'s friends there are the names of "Gaius of Derbe, and Timothy"; this evidently infers that Timothy was not "of Derbe." And in <a onClick="return mV(\'Act\',16,3);">Ac 16:3</a>, the brethren who gave Paul the good report of Timothy were "at Lystra and Iconium"; the brethren from Derbe are not mentioned. Lystra was evidently Timothy\'s native city.<P>3. Converted at Lystra:<P>In <a onClick="return mV(\'2Ti\',3,10,11);">2Ti 3:10,11</a> Paul mentions that Timothy had fully known the persecutions and afflictions which came to him at Antioch, at Iconium and at Lystra. These persecutions occurred during the apostle\'s first visit to these towns; and Timothy seems to have been one of those who were converted at that time, as we find that on Paul\'s next visit to Lystra and Derbe, Timothy was already one of the Christians there: "He came also to Derbe and to Lystra: and behold a certain disciple was there, named Timothy" (<a onClick="return mV(\'Act\',16,1);">Ac 16:1</a>).<P>Timothy was now chosen by Paul to be one of his companions. This was at an early period in Paul\'s apostolic career, and it is pleasing to find that to the end of the apostle\'s life Timothy was faithful to him.<P>4. His Father and Mother:<P>Timothy\'s father was a heathen Greek (Hellen, not Hellenistes, a Greek-speaking Jew); this fact is twice mentioned (<a onClick="return mV(\'Act\',16,1,3);">Ac 16:1,3</a>). His mother was a Jewess, but he had not been circumcised in infancy, probably owing to objections made by his father. Timothy\'s mother was called Eunice, and his grandmother Lois. Paul mentions them by name in <a onClick="return mV(\'2Ti\',1,5);">2Ti 1:5</a>; he there speaks of the unfeigned faith which was in Timothy, and which dwelt at the first in Eunice and Lois. It is evident that Eunice was converted to Christ on Paul\'s 1st missionary journey to Derbe and Lystra, because, when he next visited these cities, she is spoken of as "a Jewess who believed" (<a onClick="return mV(\'Act\',16,1);">Ac 16:1</a>).<P>5. Becomes a Co-worker with Paul:<P>On this 2nd visit to Derbe and Lystra, Paul was strongly attracted to Timothy, and seeing his unfeigned faith, and that from a child he had known the sacred Scriptures of the Old Testament (<a onClick="return mV(\'2Ti\',3,15);">2Ti 3:15</a>), and seeing also his Christian character and deportment, and his entire suitability for the work of the ministry, he would have him "to go forth with him" (<a onClick="return mV(\'Act\',16,3);">Ac 16:3</a>). Timothy acquiesced in Paul\'s desire, and as preliminaries to his work as a Christian missionary, both to Jew and Gentile, two things were done. In order to conciliate the Jewish Christians, who would otherwise have caused trouble, which would have weakened Timothy\'s position and his work as a preacher of the gospel, Paul took Timothy and circumcised him.<P>6. Circumcised:<P>Paul was willing to agree to this being done, on account of the fact that Timothy\'s mother was a Jewess. It was therefore quite a different case from that of Titus, where Paul refused to allow circumcision to be performed (<a onClick="return mV(\'Act\',15,2);">Ac 15:2</a>)—Titus being, unlike Timothy, a Gentile by birth.<P>See <a href="./study/isbe/search.html?string=TITUS">TITUS</A>.<P>The other act which was performed for Timothy\'s benefit, before he set out with Paul, was that he was ordained by the presbytery or local council of presbyters in Derbe and Lystra.<P>7. His Ordination:<P>Showing the importance which Paul assigned to this act of ordination, he refers to it in a letter to Timothy written many years afterward: "Neglect not the gift that is in thee, which was given thee by prophecy, with the laying on of the hands of the presbytery" (<a onClick="return mV(\'1Ti\',4,14);">1Ti 4:14</a>). In this ordination Paul himself took part, for he writes, "I put thee in remembrance, that thou stir up the gift of God, which is in thee through the laying on of my hands" (<a onClick="return mV(\'2Ti\',1,6);">2Ti 1:6</a>).<P>"<a onClick="return mV(\'2Ti\',1,6);">2Ti 1:6</a> should be viewed in the light of <a onClick="return mV(\'1Ti\',4,14);">1Ti 4:14</a>. Probably it was prophetic voices (through prophecy; compare <a onClick="return mV(\'1Ti\',1,18);">1Ti 1:18</a>, \'according to the prophecies which went before in regard to thee\') which suggested the choice of Timothy as assistant of Paul and Silvanus, and his consecration to this work with prayer and the laying on of hands (compare <a onClick="return mV(\'Act\',13,2);">Ac 13:2</a>f). The laying on of hands by the presbyters (<a onClick="return mV(\'1Ti\',4,14);">1Ti 4:14</a>), and that by Paul (<a onClick="return mV(\'2Ti\',1,6);">2Ti 1:6</a>), are not mutually exclusive, especially since the former is mentioned merely as an accompanying circumstance of his endowment with special grace, the latter as the efficient cause of this endowment. The churches in the neighborhood of Timothy\'s home, according to <a onClick="return mV(\'Act\',14,23);">Ac 14:23</a>, had been furnished with a body of presbyters soon after their founding" (Zahn, Introduction to the New Testament, II, 23).<P>8. Accompanies Paul:<P>Thus, prepared for the work, Timothy went forth with Paul on the apostle\'s 2nd missionary journey. We find Timothy with him at Berea (<a onClick="return mV(\'Act\',17,14);">Ac 17:14</a>), having evidently accompanied him to all places visited by him up to that point, namely, Phrygia, the region of Galatia, Mysia, Troas, Neapoils, Philippi, Amphipolis, Apollonia, Thessalonica and Berea. Paul next went—and went alone, on account of the persecution at Berea—to Athens (<a onClick="return mV(\'Act\',17,15);">Ac 17:15</a>); and from that city he sent a message to Silas and Timothy at Berea, that they should come to him at Athens with all speed. They quickly came to him there, and were immediately sent on an errand to the church in Thessalonica; "When we could no longer forbear, we thought it good to be left behind at Athens alone; and sent Timothy, our brother, and minister of God, and our fellow-labourer in the gospel of Christ, to establish you, and to comfort you concerning your faith: that no man should be moved by these afflictions" (<a onClick="return mV(\'1Th\',3,1,2,3);">1Th 3:1,2,3</a> the King James Version). Timothy and Silas discharged this duty and returned to the apostle, bringing him tidings of the faith of the Christians in Thessalonica, of their love and of their kind remembrance of Paul, and of their ardent desire to see him; and Paul was comforted (<a onClick="return mV(\'1Th\',3,5,6,7);">1Th 3:5,6,7</a>).<P>9. At Corinth:<P>Paul had left Athens before Silas and Timothy were able to rejoin him. He had proceeded to Corinth, and it was while the apostle was in that city, that "when Silas and Timothy came down from Macedonia, Paul was constrained by the word, testifying to the Jews that Jesus was the Christ" (<a onClick="return mV(\'Act\',18,5);">Ac 18:5</a>). Timothy evidently remained with Paul during the year and six months of his residence in Corinth, and also throughout this missionary journey to its end. From Corinth Paul wrote the Epistle to the Romans, and he sent them a salutation from Timothy, "Timothy my fellow-worker saluteth you" (<a onClick="return mV(\'Rom\',16,21);">Ro 16:21</a>).<P>10. Salutations:<P>In connection with this salutation from Timothy, it should be noticed that it was Paul\'s custom to associate with his own name that of one or more of his companions, in the opening salutations in the Epistles. Timothy\'s name occurs in <a onClick="return mV(\'2Cr\',1,1);">2Co 1:1</a>; <a onClick="return mV(\'Phl\',1,1);">Php 1:1</a>; <a onClick="return mV(\'Col\',1,1);">Col 1:1</a>; <a onClick="return mV(\'Phm\',1,1);">Phm 1:1</a>. It is also found, along with that of Silvanus, in <a onClick="return mV(\'1Th\',1,1);">1Th 1:1</a> and <a onClick="return mV(\'2Th\',1,1);">2Th 1:1</a>.<P>11. At Ephesus:<P>On Paul\'s 3rd missionary journey, Timothy again accompanied him, though he is not mentioned until Ephesus was reached. This journey involved much traveling, much work and much time. At Ephesus alone more than two years were spent. And when Paul\'s residence there was drawing to a close, he laid his plans to go to Jerusalem, after passing en route through Macedonia and Achaia. Accordingly he sent on before him "into Macedonia two of them that ministered unto him, Timothy and Erastus" (<a onClick="return mV(\'Act\',19,22);">Ac 19:22</a>).<P>12. To Corinth Again:<P>From Ephesus Paul wrote the First Epistle to the Corinthians (<a onClick="return mV(\'1Cr\',16,8);">1Co 16:8</a>), and in it he mentioned (<a onClick="return mV(\'1Cr\',16,10);">1Co 16:10</a>) that Timothy was then traveling to Corinth, apparently a prolongation of the journey into Macedonia. After commending him to a kind reception from the Corinthians, Paul proceeded to say that Timothy was to return to him from Corinth; that is, Timothy was to bring with him a report on the state of matters in the Corinthian church.<P>13. In Greece:<P>Soon thereafter the riot in Ephesus occurred; and when it was over, Paul left Ephesus and went to Macedonia and Greece. In Macedonia he was rejoined by Timothy, whose name is associated with his own, in the opening salutation of the Second Epistle, which he now wrote to Corinth. Timothy accompanied him into Greece, where they abode three months.<P>14. In Jerusalem:<P>From Greece the apostle once more set his face toward Jerusalem, Timothy and others accompanying him (<a onClick="return mV(\'Act\',20,4);">Ac 20:4</a>). "We that were of Paul\'s company" (<a onClick="return mV(\'Act\',21,8);">Ac 21:8</a> the King James Version), as Luke terms the friends who now traveled with Paul—and Timothy was one of them—touched at Troas and a number of other places, and eventually reached Jerusalem, where Paul was apprehended. This of course terminated, for the time, his apostolic journeys, but not the cooperation of his friends, or of Timothy among them.<P>15. In Rome:<P>The details of the manner in which Timothy was now employed are not recorded, until he is found once more with Paul—during his 1st imprisonment in Rome. But, from that point onward, there are many notices of how he was occupied in the apostle\'s service. He is mentioned in three of the Epistles written by Paul at this time, namely, in <a onClick="return mV(\'Col\',1,1);">Col 1:1</a>, and <a onClick="return mV(\'Phm\',1,1);">Phm 1:1</a>, in both of which his designation is "Timothy our brother," and in <a onClick="return mV(\'Phl\',1,1);">Php 1:1</a>, "Paul and Timothy, servants of Christ Jesus." In <a onClick="return mV(\'Phl\',2,19);">Php 2:19</a>, there is the interesting notice that, at a time when Paul\'s hope was that he would soon be liberated from his imprisonment, he trusted that he would be able to send Timothy to visit the church at Philippi:<P>16. To Visit Philippi:<P>"I hope in the Lord Jesus to send Timothy shortly unto you, that I also may be of good comfort, when I know your state. For I have no man likeminded, who will care truly for your state....But ye know the proof of him, that, as a child serveth a father, so he served with me in furtherance of the gospel. Him therefore I hope to send forthwith."<P>17. Appointed to Ephesus:<P>Paul\'s hope was realized: he was set free; and once again Timothy was his companion in travel. Perhaps it was in Philippi that they rejoined each other, for not only had Paul expressed his intention of sending Timothy there, but he had also said that he hoped himself to visit the Philippian church (<a onClick="return mV(\'Phl\',1,26);">Php 1:26</a>; <a onClick="return mV(\'Phl\',2,24);">2:24</a>). From this point onward it is difficult, perhaps impossible, to trace the course of Paul\'s journeys, but he tells us that he had left Timothy as his delegate or representative in Ephesus (<a onClick="return mV(\'1Ti\',1,3);">1Ti 1:3</a>); and soon thereafter he wrote the First Epistle to Timothy, in which he gave full instructions in regard to the manner in which he should conduct the affairs of the Ephesian church, until Paul himself should again revisit Ephesus: "These things write I unto thee, hoping to come unto thee shortly" (<a onClick="return mV(\'1Ti\',3,14);">1Ti 3:14</a>).<P>18. His Position in Ephesus:<P>"The position which Timothy occupied in Ephesus, as it is described in 1 Timothy, cannot without doing the greatest violence to history be called that of a bishop, for the office of bishop existed only where the one bishop, superior to the presbytery, represented the highest expression of the common church life. The office was for life, and confined to the local church. This was particularly the case in Asia Minor, where, although as early as the time of Revelation and the time of Ignatius, bishoprics were numerous and closely adjacent, the office always retained its local character. On the other hand, Timothy\'s position at the head of the churches of Asia was due to the position which he occupied as Paul\'s helper in missionary work. It was his part in the apostolic calling, as this calling involved the oversight of existing churches. Timothy was acting as a temporary representative of Paul in his apostolic capacity at Ephesus, as he had done earlier in Corinth, and in Thessalonica and Philippi (<a onClick="return mV(\'1Cr\',4,17);">1Co 4:17</a>; <a onClick="return mV(\'1Th\',3,2);">1Th 3:2</a>f; <a onClick="return mV(\'Phl\',2,\'19-23\');">Php 2:19-23</a>). His relation was not closer to one church than to the other churches of the province; its rise and disappearance did not affect at all the organization of the local congregations" (Zahn, Introduction to the New Testament, II, 34).<P>19. Paul Summons Him to Rome:<P>From the Second Epistle still further detail can be gathered. Paul was a second time imprisoned, and feeling that on this occasion his trial would be followed by an adverse judgment and by death, he wrote from Rome to Timothy at Ephesus, affectionately requesting him to come to him: "Give diligence to come shortly unto me" (<a onClick="return mV(\'2Ti\',4,9);">2Ti 4:9</a>). The fact that at that time, when no Christian friend was with Paul except Luke (<a onClick="return mV(\'2Ti\',4,11);">2Ti 4:11</a>), it was to Timothy he turned for sympathy and aid, closing with the request that his own son in the faith should come to him, to be with him in his last hours, shows how true and tender was the affection which bound them together. Whether Timothy was able to reach Rome, so as to be with Paul before his execution, is unknown.<P>20. Mention in <a onClick="return mV(\'Hbr\',13,\'1-\');">Hebrews 13</a>:<P>One other notice of him occurs in <a onClick="return mV(\'Hbr\',13,23);">Heb 13:23</a>: "Know ye that our brother Timothy hath been set at liberty; with whom, if he come shortly, I will see you." As the author of the Epistle to the Hebrews is not Paul, it is problematical what the meaning of these words really is, except that Timothy had been imprisoned and—unlike what took place in Paul\'s case—he had escaped death trod had been set free.<P>21. His Character:<P>Nothing further is known of him. Of all Paul\'s friends, with the exception, perhaps, of Luke, Paul\'s beloved friend, Timothy was regarded by him with the tenderest affection; he was his dearly loved son, faithful and true. Various defects have been alleged to exist in Timothy\'s character. These defects are inferred from the directions and instructions addressed to him by Paul in the Pastoral Epistles, buy these inferences may be wrong, and it is a mistake to exaggerate them in view of his unbroken and unswerving loyalty and of the long and faithful service rendered by him to Paul, "as a child serveth a father" (<a onClick="return mV(\'Phl\',2,22);">Php 2:22</a>).``155';
