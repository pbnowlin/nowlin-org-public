isbe[8884]='Town`toun: This word is used to represent a number of different Hob terms in the Old Testament.<P>(1) When any explanatory word or attendant circumstances show that a "city" was unwalled, and sometimes in the contrary case (<a onClick="return mV(\'1Sa\',23,7);">1Sa 23:7</a>), the Hebrew \'ir is translated "town" by the King James Version, and the Revised Version (British and American) generally agrees with it (<a onClick="return mV(\'Deu\',3,5);">De 3:5</a>; <a onClick="return mV(\'1Sa\',27,5);">1Sa 27:5</a>; <a onClick="return mV(\'Est\',9,19);">Es 9:19</a>).<P>(2) Both the King James Version and the Revised Version (British and American) translate chawwoth by "towns" (<a onClick="return mV(\'Num\',32,41);">Nu 32:41</a>; <a onClick="return mV(\'Jos\',13,30);">Jos 13:30</a>; <a onClick="return mV(\'1Ki\',4,13);">1Ki 4:13</a>; <a onClick="return mV(\'1Ch\',2,23);">1Ch 2:23</a>), while chatserim and perazoth both appear in the King James Version as "towns," but in the Revised Version (British and American) as "villages" (<a onClick="return mV(\'Gen\',25,16);">Ge 25:16</a>; <a onClick="return mV(\'Zec\',2,4);">Zec 2:4</a>). See <a href="./study/isbe/search.html?string=HAVVOTH-JAIR">HAVVOTH-JAIR</a>.<P>(3) Bath, literally, "daughter," is sometimes found in the plural between the name of a city and chatserim, "villages," as in <a onClick="return mV(\'Jos\',15,45);">Jos 15:45</a> margin, "Ekron, with its daughters and its villages." "Towns" is evidently the appropriate translation, and, even without chatserim, bath is rendered "town" (the Revised Version (British and American) <a onClick="return mV(\'Num\',21,25);">Nu 21:25</a>, etc.). The same use of "daughter" occurs also in the Greek of 1Macc 5:65 (thugater), the King James Version "town," the Revised Version (British and American) "village," margin "daughter."<P>(4) the King James Version and the English Revised Version gloss qir, "wall" in <a onClick="return mV(\'Jos\',2,15);">Jos 2:15</a> by rendering it "town wall"; the American Standard Revised Version omits.<P>(5) The Greek term komopoleis (<a onClick="return mV(\'Mar\',1,38);">Mr 1:38</a>), being a combination of the words for "village" and "city," is a clear attempt to describe something between the two, and is well translated "town." (6) the King James Version uses "town" (<a onClick="return mV(\'Mat\',10,11);">Mt 10:11</a> etc.) and "village" (<a onClick="return mV(\'Mat\',9,35);">Mt 9:35</a>, etc.) quite indifferently for kome; the Revised Version (British and American) has "village" throughout. For similar changes of the King James Version "town" compare 2Macc 8:6 (chora); 11:5; 12:21 (chorion, the Revised Version (British and American) "place").`<a href="./study/isbe/search.html?string=city">CITY</a>; <a href="./study/isbe/search.html?string=village">VILLAGE</a>`23';
isbe[8885]='Town Clerk`klurk, klark (grammateus): The word "clerk," "writer," "town clerk," "scribe," is found in this meaning only in <a onClick="return mV(\'Act\',19,35);">Ac 19:35</a>, "when the townclerk had quieted the multitude." Cremer defines the word as signifying a "public servant among the Greeks and the reader of the legal and state-papers" (Lexicon of the New Testament). There was considerable difference between the authority of these "clerks" in the cities of Asia Minor and of Greece. Among the Greeks the grammateis were usually slaves, or at least persons belonging to the lower classes of society, and their office was a nominal, almost a mechanical, one. In Asia, on the contrary, they were officers of considerable consequence, as the passage quoted indicates (Thucidydes vii.19, "the scribe of the city") and the grammateus is not infrequently mentioned in the inscriptions and on the coins of Ephesus (e.g. British Museum Inscriptions, III,2,482, 528). They had the supervision of the city archives, all official decrees were drawn up by them, and it was their prerogative to read such decrees to the assembled citizens. Their social position was thus one of eminence, and a Greek scribe would have been much amazed at the deference shown to his colleagues in Asia and at the power they wielded in the administration of affairs.``42';
isbe[8886]='Trachonitis`trak-o-ni\'-tis: Appears in Scripture only in the phrase tes Itouraias kai Trachbnitidos choras, literally, "of the Iturean and Trachonian region" (<a onClick="return mV(\'Luk\',3,1);">Lu 3:1</a>). Trachonitis signifies the land associated with the trachon, "a rugged stony tract." There are two volcanic districts south and east of Damascus, to which the Greeks applied this name: that to the northwest of the mountain of Bashan (Jebel ed-Druze) is now called el-Leja\', "the refuge" or "asylum." It lies in the midst of an arable and pastoral country; and although it could never have supported a large population, it has probably always been inhabited. The other is away to the northeast of the mountain, and is called in Arabic es-Safa. This covers much the larger area. It is a wild and inhospitable desert tract, remote from the dwellings of men. It was well known to the ancients; but there was nothing to attract even a sparse population to its dark and forbidding rocks, burning under the suns of the wilderness. It therefore plays no part in the history. These are the two Trachons of Strabo (xvi.2, 20). They are entirely volcanic in origin, consisting of lava belched forth by volcanoes that have been extinct for ages. In cooling, the lava has split up and crumbled into the most weird and fantastic forms. The average elevation of these districts above the surrounding country is about 30 ft. Es-Safa is quite waterless. There are springs around the border of el-Leja\', but in the interior, water-supply depends entirely upon cisterns. Certain great hollows in the rocks also form natural reservoirs, in which the rain water is preserved through the summer months.<P>El-Leja\' is roughly triangular in shape, with its apex to the north. The sides are about 25 miles in length, and the base about 20. The present writer has described this region as he saw it during two somewhat lengthened visits: From Zor\'a our course lay northeast by east...What a wild solitude it is! Far on every hand stretched a veritable land of stone. The first hour or two of our march no living thing was seen....Wherever we looked, before or behind, lay wide fields of volcanic rock, black and repulsive,...with here and there a deep circular depression, through which in the dim past red destruction belched forth, now carefully walled round the lip to prevent wandering sheep or goat from falling in by night. The general impression conveyed was as if the dark waters of a great sea, lashed to fury by a storm, had been suddenly petrified....At times we passed over vast sheets of lava which in cooling had cracked in nearly regular lines, and which, broken through in parts, appeared to rest on a stratum of different character, like pieces of cyclopaean pavement. Curious rounded rocks were occasionally seen by the wayside, like gigantic black soap bubbles blown up by the subterranean steam and gases of the active volcanic age; often, with the side broken out as if burst by escaping vapor, the mass, having cooled too far to collapse, remained an enduring monument of the force that formed it. Scanty vegetation peeped from the fissures in the rocks, or preserved a precarious existence in the scanty soil sometimes seen in a hollow between opposing slopes. In a dreary waterless land where the cloudless sun, beating down on fiery stones, creates a heat like that of an oven, it were indeed a wonder if anything less hardy than the ubiquitous thistle could long hold up its head....When the traveler has fairly penetrated the rough barriers that surround eI-Leja\' he finds not a little pleasant land within—fertile soil which, if only freed a little from overlying stones, might support a moderate population. In ancient times it was partly cleared, and the work of the old-world agriculturists remains in gigantic banks of stones built along the edges of the patches they cultivated" (Arab and Druze at Home, 30ff).<P>In some parts, especially those occupied by the Druzes, fair crops are grown. Where the Arabs are masters, poverty reigns. They also have an evil reputation. As one said to the present writer, "They will even slay the guest." \'Arab el-Leja\' anjas ma yakun is a common saying, which may be freely rendered: "Than the Arabs of el-Leja\' greater rascals do not exist." Until comparatively recent years there were great breadths of oak and terebinth. These have disappeared, largely owing to the enterprise of the charcoal burners. The region to the northeast was described by a native as bass wa\'r, "nothing but barren rocky tracts" (compare Hebrew ya\'ar), over which in summer, he said, not even a bird would fly. There are many ruined sites. A list of 71 names collected by the present writer will be found in PEFS,1895,366ff. In many cases the houses, strongly built of stone, are still practically complete, after centuries of desertion.<P>There may possibly be a reference to the Trachons in the Old Testament where Jeremiah speaks of the charerim, "parched places" (<a onClick="return mV(\'Jer\',17,6);">17:6</a>). The cognate el-Charrah is the word used by the Arabs for such a burned, rocky area. For theory that el-Leja\' corresponds to the Old Testament "Argob," see <a href="./study/isbe/search.html?string=ARGOB">ARGOB</A>.<P>The robbers who infested the place, making use of the numerous caves, were routed out by Herod the Great (Ant., XV, x, 1ff; XVI, ix, 1; XVII, ii, 1f). Trachonitis was included in the tetrarchy of Philip (viii, 1; ix, 4). At his death without heirs it was joined to the province of Syria (XVIII, iv, 6). Caligula gave it to Agrippa I. After his death in 44 AD, and during the minority of his son, it was administered by Roman officers. From 53 till 100 AD it was ruled by Agrippa II. In 106 AD it was incorporated in the new province of Arabia. Under the Romans the district enjoyed a period of great prosperity, to which the Greek inscriptions amply testify. To this time belong practically all the remains to be seen today. The theaters, temples, public buildings and great roads speak of a high civilization. That Christianity also made its way into these fastnesses is vouched for by the ruins of churches. Evil days came with the advent of the Moslems. Small Christian communities are still found at Khabab on the western Luchf, and at Sur in the interior. The southeastern district, with the chief town of Damet el-\'Alia, is in the hands of the Druzes; the rest is dominated by the Arabs.``54';
isbe[8887]='Trade`trad:<P><b>I. GENERAL</b><P class="in15">1. Terms<P class="in15">2. Position of Palestine<P class="in15">3. Trade Products of Palestine<P class="in15">4. Palestinian Traders<P><b>II. HISTORY</b><P class="in15">1. To David<P class="in15">2. Solomon<P class="in15">3. Maritime Trade<P class="in15">4. To the Exile<P class="in15">5. The Exile and After<P><b>LITERATURE</b><hr /><P>I. General. 1. Terms:<P>For a full list of the commercial terms used in the Old Testament, reference must be made to EB, IV, cols. 5193-99. Only the more important can be given here.<P>For "merchant" the Hebrew uses almost always one of the two participial forms cocher, or rokhel, both of which mean simply "one who travels." There is no difference in their meaning, but when the two are used together (<a onClick="return mV(\'Eze\',27,13);">Eze 27:13</a>) the Revised Version (British and American) distinguishes by using "trafficker" for rokhel. The verb cachar, from which cocher is derived, is translated "to trade" in <a onClick="return mV(\'Gen\',34,10,21);">Ge 34:10,21</a> and "to traffic" in <a onClick="return mV(\'Gen\',42,34);">Ge 42:34</a>, with numerous noun formations from the same stem. The verb rakhal from which rokhel is derived does not occur, but the noun formation rekhullah in <a onClick="return mV(\'Eze\',26,12);">Eze 26:12</a> (the Revised Version (British and American) "merchandise"); <a onClick="return mV(\'Eze\',28,5,16,18);">28:5,16,18</a> (the Revised Version (British and American) "traffic") may be noted. In <a onClick="return mV(\'Eze\',27,24);">Eze 27:24</a> the Revised Version (British and American) has "merchandise" for markoleth, but the word means "place of merchandise," "market." The participle tarim, from tur, "seek out," in combination with \'aneshe, "men," in <a onClick="return mV(\'1Ki\',10,15);">1Ki 10:15</a>, is translated "merchant men" by the King James Version, "chapmen" by the English Revised Version and "traders" by the American Standard Revised Version; in <a onClick="return mV(\'2Ch\',9,14);">2Ch 9:14</a>, the King James Version and the English Revised Version have "chapmen" and the American Standard Revised Version "traders." The text of these verses is suspected. In <a onClick="return mV(\'Eze\',27,\'1-\');">Eze 27</a> (only) "merchandise" represents ma\'arabh, from \'arabh, "to exchange," translated "to deal," margin "exchange," in <a onClick="return mV(\'Eze\',27,9);">27:9</A> the American Standard Revised Version, with "dealers," margin "exchangers," in <a onClick="return mV(\'Eze\',27,27);">27:27</A> (the King James Version and the English Revised Version have "occupy," "occupiers"). kena\'an, and kena\'ani "Canaanite," are sometimes used in the sense of "merchant," but it is often difficult to determine whether the literal or the transferred force is intended. Hence, all the confusion in English Versions of the Bible; in the Revised Version (British and American) note "merchant," <a onClick="return mV(\'Job\',41,6);">Job 41:6</a>; "merchant," margin "Canaanite," <a onClick="return mV(\'Pro\',31,24);">Pr 31:24</a>; "trafficker," <a onClick="return mV(\'Isa\',23,8);">Isa 23:8</a>; "trafficker," margin "Canaanite," <a onClick="return mV(\'Hsa\',12,7);">Ho 12:7</a>; "Canaan," margin "merchant people," <a onClick="return mV(\'Isa\',23,11);">Isa 23:11</a>; <a onClick="return mV(\'Zep\',1,11);">Ze 1:11</a>, and compare "land of traffic," margin "land of Canaan," <a onClick="return mV(\'Eze\',17,4);">Eze 17:4</a>.<P>See <a href="./study/isbe/search.html?string=CHAPMAN">CHAPMAN</a>; <a href="./study/isbe/search.html?string=OCCUPY">OCCUPY</a>.<P>In Apocrypha and New Testament "merchant" is for emporos (Sirach 26:29, etc.; <a onClick="return mV(\'Mat\',13,45);">Mt 13:45</a>; <a onClick="return mV(\'Rev\',18,3,11,15,23);">Re 18:3,11,15,23</a>). So "merchandise" is emporion, in <a onClick="return mV(\'Jhn\',2,16);">Joh 2:16</a> and emporia, in <a onClick="return mV(\'Mat\',22,5);">Mt 22:5</a>, while emporeuomai, is translated "make merchandise of" in <a onClick="return mV(\'2Pe\',2,3);">2Pe 2:3</a> and "trade" in <a onClick="return mV(\'Jam\',4,13);">Jas 4:13</a> (the King James Version "buy and sell"). But "to trade" in <a onClick="return mV(\'Mat\',25,16);">Mt 25:16</a> is for ergazomai (compare <a onClick="return mV(\'Rev\',18,17);">Re 18:17</a>), and <a onClick="return mV(\'Luk\',19,13);">Lu 19:13</a> for pragmateuomai, the King James Version "occupy"; while "merchandise" in <a onClick="return mV(\'Rev\',18,11,12);">Re 18:11,12</a> is for gomos, "cargo" (so the Revised Version margin; compare <a onClick="return mV(\'Act\',21,3);">Ac 21:3</a>). Worthy of note, moreover, is metabolia, "exchange" (Sirach 37:11).<P>2. Position of Palestine:<P>Any road map of the ancient world shows that Palestine, despite its lack of harbors, occupied an extremely important position as regards the trade-routes. There was no exit to the west from the great caravan center Damascus, there was virtually no exit landward from the great maritime centers Tyre and Sidon, and there was no exit to the north and northeast from Egypt without crossing Palestine. In particular, the only good road connecting Tyre (and Sidon) with Damascus lay directly across Northern Palestine, skirting the Sea of Galilee. In consequence, foreign merchants must at all times have been familiar figures in Palestine (<a onClick="return mV(\'Gen\',37,25,28);">Ge 37:25,28</a>; <a onClick="return mV(\'1Ki\',10,15);">1Ki 10:15</a>; <a onClick="return mV(\'Neh\',13,16);">Ne 13:16</a>; <a onClick="return mV(\'Isa\',2,6);">Isa 2:6</a>; <a onClick="return mV(\'Zep\',1,11);">Ze 1:11</a>, etc.). As a corollary, tolls laid on these merchants would always have been a fruitful source of income (<a onClick="return mV(\'1Ki\',10,15);">1Ki 10:15</a>; <a onClick="return mV(\'Eze\',26,2);">Eze 26:2</a>; <a onClick="return mV(\'Ezr\',4,20);">Ezr 4:20</a>), and naturally Palestine enjoyed particular advantages for the distribution of her own products through the presence of these traders.<P>3. Trade Products of Palestine:<P>Of these products the three great staples were grain, oil and wine (<a onClick="return mV(\'Hsa\',2,8);">Ho 2:8</a>; <a onClick="return mV(\'Deu\',7,13);">De 7:13</a>, etc.). The wine of Palestine, however, gained little reputation in the ancient world, and its export is mentioned only in <a onClick="return mV(\'2Ch\',2,10,15);">2Ch 2:10,15</a>; <a onClick="return mV(\'Ezr\',3,7);">Ezr 3:7</a>, while <a onClick="return mV(\'Eze\',27,18);">Eze 27:18</a> says expressly that for good wine Tyre sent to Damascus. Grain would not be needed by Egypt, but it found a ready market in Phoenicia, both for consumption in the great cities of Tyre and Sidon and for export (<a onClick="return mV(\'1Ki\',5,11);">1Ki 5:11</a>; <a onClick="return mV(\'Ezr\',3,7);">Ezr 3:7</a>; <a onClick="return mV(\'Eze\',27,17);">Eze 27:17</a>, etc.). A reverse dependence of Palestine on Tyre for food (<a onClick="return mV(\'Isa\',23,18);">Isa 23:18</a>; compare <a onClick="return mV(\'Gen\',41,57);">Ge 41:57</a>) could have occurred only under exceptional circumstances. Oil was needed by Egypt as well as by Phoenicia (<a onClick="return mV(\'Hsa\',12,1);">Ho 12:1</a>; <a onClick="return mV(\'Isa\',57,9);">Isa 57:9</a>), but from Northern Israel was probably shipped into Egypt by way of Phoenicia. <a onClick="return mV(\'Hsa\',2,5,9);">Ho 2:5,9</a> mentions wool and flax as products of Israel, but neither could have been important. Flax was a specialty of Egypt (<a onClick="return mV(\'Isa\',19,9);">Isa 19:9</a>) and is hardly mentioned in the Old Testament, while for wool Israel had to depend largely on Moab (<a onClick="return mV(\'2Ki\',3,4);">2Ki 3:4</a>; <a onClick="return mV(\'Isa\',16,1);">Isa 16:1</a>). Minor products that were exported were "balm...honey, spicery and myrrh, pistachio-nuts and almonds" (<a onClick="return mV(\'Gen\',43,11);">Ge 43:11</a> margin; see the separate articles, and compare "pannag and...balm" in <a onClick="return mV(\'Eze\',27,17);">Eze 27:17</a>). These were products of Gilead (<a onClick="return mV(\'Gen\',37,25);">Ge 37:25</a>). "Oaks of Bashan" had commercial value, but only for use for oars (<a onClick="return mV(\'Eze\',27,5);">Eze 27:5</a>), and so in small logs. Palestine had to import all heavy timbers (<a onClick="return mV(\'1Ki\',5,6);">1Ki 5:6</a>, etc.). Despite <a onClick="return mV(\'Deu\',8,9);">De 8:9</a>, Palestine is deficient in mineral wealth. The value of Pal\'s manufactured products would depend on the skill of the inhabitants, but for the arts the Hebrews seem to have had no particular aptitude (<a onClick="return mV(\'1Ki\',5,6);">1Ki 5:6</a>; compare <a onClick="return mV(\'1Sa\',13,19);">1Sa 13:19</a>ff).<P>4. Palestinian Traders:<P>In comparison with the great volume of international trade that was constantly passing across Palestine, the above products could have had no very great value and the great merchants would normally have been foreigners. A wide activity as "middlemen" and agents was, however, open to the inhabitants of Palestine, if they cared to use it. Such a profession would demand close contact with the surrounding nations and freedom from religious scruples. The Canaanites evidently excelled in commercial pursuits of this time, so much so that "Canaanite" and "merchant" were convertible terms.<P>II. History.<P>1. To David:<P>The Israelites entered Canaan as a nomadic people who had even agriculture yet to learn, and with a religious self-consciousness that restrained them from too close relations with their neighbors. Hence, they were debarred from much participation in trade. The legislation of the Pentateuch (in sharp distinction from that of Code of Hammurabi) shows this non-commercial spirit very clearly, as there are no provisions that relate to merchants beyond such elementary matters as the prohibition of false weights, etc. (<a onClick="return mV(\'Deu\',25,13);">De 25:13</a>; <a onClick="return mV(\'Lev\',19,36);">Le 19:36</a>; Covenant Code has not even these rules). In particular, the prohibition of interest (<a onClick="return mV(\'Exd\',22,25);">Ex 22:25</a>; <a onClick="return mV(\'Deu\',23,19);">De 23:19</a>, etc.) shows that no native commercial life was contemplated, for, without a credit-system, trade on any extensive scale was impossible. All this was to be left to foreigners (<a onClick="return mV(\'Deu\',23,20);">De 23:20</a>; compare <a onClick="return mV(\'Deu\',15,6);">15:6</a>; <a onClick="return mV(\'Deu\',28,12,44);">28:12,44</A>). The Jewish ideal, indeed, was that each household should form a self-sufficient producing unit (<a onClick="return mV(\'Pro\',31,\'10-27\');">Pr 31:10-27</a>), with local or national exchange of those commodities (such as tools and salt) that could not be produced at home. And this ideal seems to have been maintained tolerably well. The most northerly tribes, through their proximity to the Phoenicians, were those first affected by the commercial spirit, and in particular the isolated half-tribe of Dan. In <a onClick="return mV(\'Jdg\',5,17);">Jud 5:17</a> we find them "remaining in ships" at the time of Barak\'s victory. As their territory had no seacoast, this must mean that they were gaining funds by serving in the ships of Tyre and Sidon. Zebulun and Issachar, likewise, appear in <a onClick="return mV(\'Deu\',33,19);">De 33:19</a> as the merchants of Israel, apparently selling their wares chiefly at the time of the great religious assemblages. But the disorders at the time of the Judges were an effectual bar against much commerce. Saul at length succeeded in producing some kind of order, and we hear that he had brought in a prosperity that showed itself in richer garments and golden ornaments for the women (<a onClick="return mV(\'2Sa\',1,24);">2Sa 1:24</a>; see <a href="./study/isbe/search.html?string=MONEY">MONEY</a>). David\'s own establishment of an official shekel (<a onClick="return mV(\'2Sa\',14,26);">2Sa 14:26</a>) is proof that trade was becoming a matter of importance.<P>2. Solomon:<P>Under Solomon, however, Israel\'s real trade began. The writer of Kings lays special stress on his imports. From Tyre came timber (<a onClick="return mV(\'1Ki\',5,6);">1Ki 5:6</a>, etc.) and gold (<a onClick="return mV(\'1Ki\',9,11);">1Ki 9:11</a>). From Sheba came gold and spices (<a onClick="return mV(\'1Ki\',10,10);">1Ki 10:10</a>, "gave" here, like "presents" elsewhere, is a euphemism). From Ophir and elsewhere came gold, silver, precious stones, almug trees, ivory, apes and peacocks (<a onClick="return mV(\'1Ki\',10,11,22,25);">1Ki 10:11,22,25</a>). According to Massoretic Text <a onClick="return mV(\'1Ki\',10,28);">1Ki 10:28</a>f; horses and chariots were brought from Egypt and re-sold to the north.<P>But the text here is suspected. Egypt had no reputation as a horse-mart in comparison with Northern Syria and Western Armenia (see <a href="./study/isbe/search.html?string=TOGARMAH">TOGARMAH</A>). So many scholars prefer to read "Musri" (in northwestern Arabia) for "Egypt" (mtsr for mtsrym—see the comms., especially EB, III, cols. 3162-63). Yet the change does not clear up all the difficulties, and Egypt was certainly famous for her chariots. And compare <a onClick="return mV(\'Deu\',17,16);">De 17:16</a>.<P>In exchange Solomon exported to Tyre wheat and oil (<a onClick="return mV(\'1Ki\',5,11);">1Ki 5:11</a>; <a onClick="return mV(\'2Ch\',2,10,15);">2Ch 2:10,15</a> adds "barley...and wine"). What he sent to the other countries is not specified, and, in particular, there is no mention of what he exchanged for gold. <a onClick="return mV(\'1Ki\',5,11);">1Ki 5:11</a>; <a onClick="return mV(\'1Ki\',9,11);">9:11</a>, however, indicate that Hiram was the intermediary for most of this gold traffic, so that at the final settlement of accounts Solomon must have been heavily in Hiram\'s debt. <a onClick="return mV(\'1Ki\',9,11);">1Ki 9:11</a> proves this. Solomon had undertaken a larger task than the resources of Palestine could meet, and in payment was obliged to cede Northern Galilee to Hiram. (The writer of 1 Kings explains that \'the cities were worthless,\' while Chronicles passes over the unedifying incident altogether, if <a onClick="return mV(\'2Ch\',8,2);">2Ch 8:2</a> is not a reversal of the case.)<P>3. Maritime Trade:<P>Among Solomon\'s other activities sea-commerce was not forgotten. David\'s victory over Edom gave access to the Red Sea at Eziongeber, and this port was utilized by Hiram and Solomon in partnership (<a onClick="return mV(\'1Ki\',9,26);">1Ki 9:26</a>), Hiram, apparently, supplying the ships and the sailors (<a onClick="return mV(\'1Ki\',10,11);">1Ki 10:11</a>). After Solomon\'s death, Edom revolted and the way to the sea was closed (<a onClick="return mV(\'1Ki\',11,14);">1Ki 11:14</a>). It was not recovered until the time of Jehoshaphat, and he could do nothing with it, "for the ships were broken at Eziongeber" (<a onClick="return mV(\'1Ki\',22,48);">1Ki 22:48</a>), i.e. in the home harbor. Either they were badly built or incompetently manned. The Hebrews had no skill as sailors.<P>See <a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>.<P>4. To the Exile:<P>After the time of Solomon the commerce established by him of course continued, with fluctuations. Samaria became so important a city from the trade standpoint that Ben-hadad I forced Baasha to assign a street there to the merchants of Damascus, while Ahab succeeded in extracting the reverse privilege from Ben-hadad II (<a onClick="return mV(\'1Ki\',20,34);">1Ki 20:34</a>). The long and prosperous contemporary reigns of Jeroboam II and Uzziah evidently had great importance for the growth of commerce, and it was the growing luxury of the land under these reigns that called forth the denunciations of Amos, Hosea and Isaiah. Amos complains of the importation of expensive foreign luxuries by the rich (compare <a onClick="return mV(\'Isa\',3,\'18-23\');">Isa 3:18-23</a>), who wasted the natural products of Palestine (<a onClick="return mV(\'Isa\',6,\'3-6\');">Isa 6:3-6</a>; <a onClick="return mV(\'Isa\',3,12,15);">3:12,15</a>). Grain, the chief article of value, was extorted from the poor (<a onClick="return mV(\'Isa\',5,11);">Isa 5:11</a>), and the grain-dealers were notoriously dishonest (<a onClick="return mV(\'Isa\',8,\'4-6\');">Isa 8:4-6</a>); <a onClick="return mV(\'Isa\',8,6);">Isa 8:6c</a> in English Versions of the Bible suggests the sale of adulterated grain. The meaning of the Hebrew, however, is obscure, but of course adulteration must have existed, and it is doubtless not without significance that the labels on the recently discovered Samaritan jar-fragments emphasize the purity of the contents (Harvard Theological Review, 1911, 138-39). The extent of commercialism so overwhelms Hosea that he exclaims \'Ephraim is become a Canaanite!\' (<a onClick="return mV(\'Hsa\',12,7);">12:7</A> margin). The most unscrupulous dealing is justified by the plea, "Surely I am become rich" (<a onClick="return mV(\'Hsa\',12,8);">12:8</A>). Isaiah is shocked at the intimate contracts made with foreigners, which prove so profitable to the makers, but which bring in idolatry (<a onClick="return mV(\'Hsa\',2,6,7,8);">2:6-8</A>). It was in the time of Isaiah that Assyrian influence began to make itself felt in Judah, and the setting up in the Temple of a pattern of an Assyrian altar (<a onClick="return mV(\'2Ki\',16,10);">2Ki 16:10</a>f) must have been accompanied with an influx of Assyrian commodities of all descriptions. (Similarly, the religious reaction under Hezekiah would have been accompanied by a boycott on Assyrian goods.) Data for the following pre-exilic period are scanty, but <a onClick="return mV(\'Eze\',26,2);">Eze 26:2</a> shows that Jerusalem retained a position of some commercial importance up to the time of her fall. Of especial interest are <a onClick="return mV(\'Isa\',23,\'1-\');">Isa 23</a> and <a onClick="return mV(\'Eze\',26,\'1-\');">Eze 26</a>; <a onClick="return mV(\'Eze\',27,\'1-\');">27</a> with their descriptions of the commerce of Tyre. Ezekiel indeed confines himself to description, but Isaiah characterizes the income of all this trade as "the hire of a harlot" (<a onClick="return mV(\'Isa\',23,17,18);">23:17,18</A>), a phrase that reappears in <a onClick="return mV(\'Rev\',18,3,9);">Re 18:3,9</a>—a chapter couched in the genuine old prophetic tone and based almost exclusively on Isaiah and Ezekiel. But it is important to note that Isaiah realizes (<a onClick="return mV(\'Isa\',23,18);">23:18</a>) that all this enterprise is capable of consecration to Yahweh and is therefore not wrong in itself.<P>5. The Exile and After:<P>The deportation into Babylon brought the Jews directly into the midst of a highly developed commercial civilization, and, although we are ignorant of the details, they must have entered into this life to a very considerable extent. Indeed, it is more than probable that it was here that the famed commercial genius of the Jews made its appearance. Certain it is that exiles acquired great wealth and rose to high position (<a onClick="return mV(\'Zec\',6,10);">Zec 6:10</a>; <a onClick="return mV(\'Neh\',1,11);">Ne 1:11</a>; <a onClick="return mV(\'Neh\',5,17);">5:17</a>, etc.), and that when an opportunity to return to Palestine was opened, most of the exiles preferred to stay where they were (see <a href="./study/isbe/search.html?string=EXILE">EXILE</A>). As a matter of fact, the Palestinian community was beggarly poor for years (<a onClick="return mV(\'Zec\',8,10);">Zec 8:10</a>; <a onClick="return mV(\'Hag\',1,6);">Hag 1:6</a>; <a onClick="return mV(\'Neh\',1,3);">Ne 1:3</a>; <a onClick="return mV(\'Mal\',3,\'10-12\');">Mal 3:10-12</a>, etc.) and could not even prevent the sale of its children into slavery (<a onClick="return mV(\'Joe\',3,6);">Joe 3:6</a>). Such trade as existed was chiefly in the hands of foreigners (<a onClick="return mV(\'Joe\',3,17);">Joe 3:17</a>; <a onClick="return mV(\'Zec\',14,21);">Zec 14:21</a>), but the repeated crop-failures must have forced many Jews into commerce to keep from starving. The history of the 4th century is very obscure, but for the later commercial history of the Jews the foundation of Alexandria (332 BC) was a fact of fundamental importance. For Alexandria rapidly became the commercial center of the world and into it the Jews, attracted by the invitations of the Ptolemies, poured in streams. Alexandria\'s policy was closely copied by Antioch (on the period see Ant, XII, i, iii; compare <a href="./study/isbe/search.html?string=ALEXANDRIA">ALEXANDRIA</a>; <a href="./study/isbe/search.html?string=ANTIOCH">ANTIOCH</a>), and Ant, XII, iv, shows that the ability of the Jews was duly recognized by the Gentiles. But this development was outside Palestine. Sirach does not count commerce among the list of trades in 38:24-30 (note, however, the increased importance of artisans) and his references to commerce throughout are not especially characteristic (5:8; 8:13, etc.; but see 42:7). But even the trade of Palestine must have been increasing steadily. Under the Maccabees Joppa was captured, and the opening of its port for Greek commerce is numbered among Simon\'s "glories" (1Macc 14:5). The unification of the trade-world under Rome, of course, gave Palestine a share in the benefits. Herod was able to work commercial miracles (Ant., XV, vi, 7; viii, 1; ix, 2; xi, 1; XVI, v, 3,etc.), and the Palestine of the New Testament is a commercial rather than an agricultural nation. Christ\'s parables touch almost every side of commercial life and present even the pearl merchant as a not unfamiliar figure (<a onClick="return mV(\'Mat\',13,45);">Mt 13:45</a>). Into the ethics of commerce, however, He entered little. Sharp dealings were everywhere (<a onClick="return mV(\'Mar\',12,40);">Mr 12:40</a>; <a onClick="return mV(\'Luk\',16,\'1-12\');">Lu 16:1-12</a>, etc.), and the service of Mammon, which had pushed its way even into the temple (<a onClick="return mV(\'Mar\',11,\'15-17\');">Mr 11:15-17</a> and parallel\'s), was utterly incompatible with the service of God (<a onClick="return mV(\'Mat\',6,\'19-34\');">Mt 6:19-34</a>, etc.). In themselves, however the things of Caesar and the things of God (<a onClick="return mV(\'Mar\',12,17);">Mr 12:17</a> and parallel\'s) belong to different spheres, and with financial questions pure and simple He refused to interfere (<a onClick="return mV(\'Luk\',12,13);">Lu 12:13</a>f). For further details and for the (not very elaborate) teaching of the apostles see <a href="./study/isbe/search.html?string=ETHICS">ETHICS</a>.<P>LITERATURE.<P>The appropriate sections in the HA\'s and Biblical diets., especially G. A. Smith\'s indispensable article "Trade" in EB, IV, cols. 5145-99 (1903); for the later period, GJV4, II, 67-82 (1907), III, 97-102 (1909). Compare also Herzfeld, Handelsgeschichte der Juderi des Alterthums2 (1894).``48';

isbe[8889]='Tradition`tra-dish\'-un: The Greek word is paradosis, "a giving over," either by word of mouth or in writing; then that which is given over, i.e. tradition, the teaching that is handed down from one to another. The word does not occur in the Hebrew Old Testament (except in <a onClick="return mV(\'Jer\',39,4);">Jer 39 (32):4</a>; <a onClick="return mV(\'Jer\',41,2);">41 (34):2</a>, used in another sense), or in the Septuagint or the Apocrypha (except in 2Esdras 7:26, used in a different sense), but is found 13 times in the New Testament (<a onClick="return mV(\'Mat\',15,2,3,6);">Mt 15:2,3,6</a>; <a onClick="return mV(\'Mar\',7,3,5,8,9,13);">Mr 7:3,5,8,9,13</a>; <a onClick="return mV(\'1Cr\',11,2);">1Co 11:2</a>; <a onClick="return mV(\'Gal\',1,14);">Ga 1:14</a>; <a onClick="return mV(\'Col\',2,8);">Col 2:8</a>; <a onClick="return mV(\'2Th\',2,15);">2Th 2:15</a>; <a onClick="return mV(\'2Th\',3,6);">3:6</a>).<P>1. Meaning in Jewish Theology:<P>The term in the New Testament has apparently three meanings. It means, in Jewish theology, the oral teachings of the elders (distinguished ancestors from Moses on) which were reverenced by the late Jews equally with the written teachings of the Old Testament, and were regarded by them as equally authoritative on matters of belief and conduct. There seem to be three classes of these oral teachings:<P>(a) some oral laws of Moses (as they supposed) given by the great lawgiver in addition to the written laws;<P>(b) decisions of various judges which became precedents in judicial matters;<P>(c) interpretations of great teachers (rabbis) which came to be prized with the same reverence as were the Old Testament Scriptures.<P>It was against the tradition of the elders in this first sense that Jesus spoke so pointedly to the scribes and Pharisees (<a onClick="return mV(\'Mat\',15,2);">Mt 15:2</a>f; <a onClick="return mV(\'Mar\',7,3);">Mr 7:3</a>f). The Pharisees charged Jesus with transgressing "the tradition of the elders." Jesus turned on them with the question, "Why do ye also transgress the commandment of God because of your tradition?" He then shows how their hollow traditionalism has fruited into mere ceremonialism and externalism (washing of hands, vessels, saying "Corban" to a suffering parent, i.e. "My property is devoted to God, and therefore I cannot use it to help you," etc.), but He taught that this view of uncleanness was essentially false, since the heart, the seat of the soul, is the source of thought, character and conduct (<a onClick="return mV(\'Mar\',7,14);">Mr 7:14</a>f).<P>2. As Used in 1 Corinthians and 2 Thessalonians:<P>The word is used by Paul when referring to his personal Christian teachings to the churches at Corinth and Thessalonica (<a onClick="return mV(\'1Cr\',11,2);">1Co 11:2</a>; <a onClick="return mV(\'2Th\',2,15);">2Th 2:15</a>; <a onClick="return mV(\'2Th\',3,6);">3:6</a>). In this sense the word in the singular is better translated "instruction," signifying the body of teaching delivered by the apostle to the church at Thessalonica (<a onClick="return mV(\'2Th\',3,6);">2Th 3:6</a>). But Paul in the other two passages uses it in the plural, meaning the separate instructions which he delivered to the churches at Corinth and Thessalonica.<P>3. As Used in Colossians:<P>The word is used by Paul in <a onClick="return mV(\'Col\',2,8);">Col 2:8</a> in a sense apparently different from the two senses above. He warns his readers against the teachings of the false teachers in Colosse, which are "after the tradition of men." Olshausen, Lightfoot, Dargan, in their commentaries in the place cited., maintain that the reference is to the Judaistic character of the false teachers. This may be true, and yet we must see that the word "tradition" has a much broader meaning here than in 1 above. Besides, it is not certain that the false teachings at Colosse are essentially Jewish in character. The phrase "tradition of men" seems to emphasize merely the human, not necessarily Jewish, origin of these false teachings.<P>The verb paradidomi, "to give over," is also used 5 times to express the impartation of Christian instruction: <a onClick="return mV(\'Luk\',1,2);">Lu 1:2</a>, where eyewitnesses are said to have handed down the things concerning Jesus; <a onClick="return mV(\'1Cr\',11,2,23);">1Co 11:2,23</a> and <a onClick="return mV(\'1Cr\',15,3);">15:3</A> referring to the apostle\'s personal teaching; <a onClick="return mV(\'2Pe\',2,21);">2Pe 2:21</a>, to instruction by some Christian teacher (compare <a onClick="return mV(\'1Pe\',1,18);">1Pe 1:18</a>).<P>LITERATURE.<P>Broadus, Allen, Meyer, commentaries on <span class="noTag">Mt 15:2</span>f; Swete, Gould, commentaries on Mark (7:3f); Lightfoot, Meyer, commentaries on <span class="noTag">Ga 1:14</span>; Lightfoot, Olshausen, Dargan (American Commentary), commentaries on <span class="noTag">Col 2:8</span>; Milligan, commentary on 1 and 2 Thessalonians (<span class="noTag">2Th 2:15</span> and 3:6); Weber, Jewish Theology (Ger., Altsyn. Theol.); Pocock, Porta Mosis, 350-402; Schurer, HJP, II, i, section 25; Edersheim, Life and Times of Jesus the Messiah, II, chapter xxxi; Josephus, Ant, XIII, x, 6.``194';
isbe[8890]='Traffic, Trafficker`traf\'-ik, traf\'-ik-er (kena\'-an, micchar, cachar, rekhullah):<P>(1) Kena\'an = "Canaan," and, as the Canaanites were celebrated merchants, came to mean "merchant," and so "traffic" (see <a href="./study/isbe/search.html?string=CANAAN">CANAAN</a>). <a onClick="return mV(\'Eze\',17,4);">Eze 17:4</a> refers to the great eagle who "cropped off the topmost of the young twigs (of cedar) thereof, and carried it unto a land of traffic; he set it in a city of merchants."<P>(2) Micchar means "trade," and so "traffic"; comes from a root meaning "to travel round," e.g. as a peddler. <a onClick="return mV(\'1Ki\',10,15);">1Ki 10:15</a> reads: "Besides that which the traders brought, and the traffic of the merchants." This refers to the income of Solomon.<P>(3) Cachar means "to go about," "occupy with," "trade," "traffic," "merchant," and so the business of the moving merchant or peddler. Joseph said to his brothers: "So will I deliver you your brother, and ye shall traffic in the land" (<a onClick="return mV(\'Gen\',42,34);">Ge 42:34</a>). He evidently meant that they should have license to become, throughout Egypt, traveling traders.<P>(4) Rekhullah, from a root meaning "to travel for trading," and so a peddled traffic, as in spices, etc. Ezekiel speaks against the prince of Tyre: "By thy great wisdom and by thy traffic hast thou increased thy riches" (<a onClick="return mV(\'Eze\',28,5);">28:5</A>); and against the king of Tyre: "in the unrighteousness of thy traffic," etc. (<a onClick="return mV(\'Eze\',28,18);">Eze 28:18</a>).`<a href="./study/isbe/search.html?string=market">MARKET</a>; <a href="./study/isbe/search.html?string=merchandise">MERCHANDISE</a>; <a href="./study/isbe/search.html?string=ships+and+boats">SHIPS AND BOATS</a>; <a href="./study/isbe/search.html?string=trade">TRADE</a>`142';
isbe[8891]='Tragacanth`trag\'-a-kanth: For "spicery" in <a onClick="return mV(\'Gen\',37,25);">Ge 37:25</a>, the Revised Version margin gives "gum tragacanth or storax."`<a href="./study/isbe/search.html?string=spice">SPICE</a>; <a href="./study/isbe/search.html?string=storax">STORAX</a>`1';
isbe[8892]='Train`tran (verb chanakh, "educate" (<a onClick="return mV(\'Pro\',22,6);">Pr 22:6</a>), with adjective chanikh (<a onClick="return mV(\'Gen\',14,14);">Ge 14:14</a>)): In <a onClick="return mV(\'1Ki\',10,2);">1Ki 10:2</a> the Queen of Sheba\'s "train," the noun is chayil, the usual word for "force," "army." But in <a onClick="return mV(\'Isa\',6,1);">Isa 6:1</a> the "train" (shul, "loose hanging garment") is that of God\'s robe (the Revised Version margin "skirts").``1';
isbe[8893]='Train; Trained`tran, trand: The word is used in two places in both the King James Version and the Revised Version (British and American), namely, <a onClick="return mV(\'Gen\',14,14);">Ge 14:14</a>, where it means "drilled," "prepared for war," and <a onClick="return mV(\'Pro\',22,6);">Pr 22:6</a>. "Train up a child" means more than to teach, and includes everything that pertains to the proper development of the child, especially in its moral and spiritual nature. In this broader sense also the Revised Version (British and American) substitutes "train" for the "teach" of the King James Version in <a onClick="return mV(\'Tts\',2,4);">Tit 2:4</a> (sophronizo).``1';
isbe[8894]='Trance`trans (ekstasis): The condition expressed by this word is a mental state in which the person affected is partially or wholly unconscious of objective sensations, but intensely alive to subjective impressions which, however they may be originated, are felt as if they were revelations from without. They may take the form of visual or auditory sensations or else of impressions of taste, smell, heat or cold, and sometimes these conditions precede epileptic seizures constituting what is named the aura epileptica. The word occurs 5 times in the King James Version, twice in the story of Balaam (<a onClick="return mV(\'Num\',24,4,16);">Nu 24:4,16</a>), twice in the history of Peter (<a onClick="return mV(\'Act\',10,10);">Ac 10:10</a>; <a onClick="return mV(\'Act\',11,5);">11:5</a>), and once in that of Paul (<a onClick="return mV(\'Act\',22,17);">Ac 22:17</a>). In the Balaam story the word is of the nature of a gloss rather than a translation, as the Hebrew naphal means simply "to fall down" and is translated accordingly in the Revised Version (British and American). Here Septuagint has en hupno, "in sleep" (see <a href="./study/isbe/search.html?string=SLEEP,+DEEP">SLEEP, DEEP</a>). In Peter\'s vision on the housetop at Joppa he saw the sail (othone) descending from heaven, and heard a voice. Paul\'s trance was also one of both sight and sound. The vision on the Damascus road (<a onClick="return mV(\'Act\',9,\'3-9\');">Ac 9:3-9</a>) and that recorded in <a onClick="return mV(\'2Cr\',12,\'2-4\');">2Co 12:2-4</a> were also cases of trance, as were the prophetic ecstasies of Saul, Daniel and Elisha, and the condition of John in which he says that he was "in the Spirit" (<a onClick="return mV(\'Rev\',1,10);">Re 1:10</a>).<P>The border line between trance and dream is indefinite: the former occurs while one is, in a sense, awake; the latter takes place in the passage from sleep to wakefulness. The dream as well as the vision were supposed of old to be channels of revelation (<a onClick="return mV(\'Job\',33,15);">Job 33:15</a>). In Shakespearean English, "trance" means a dream (Taming of the Shrew, I, i, 182), or simply a bewilderment (Lucrece, 1595).<P>In the phenomena of hypnotic suggestion, sometimes affecting a number of persons simultaneously we have conditions closely allied to trance, and doubtless some of the well-authenticated phantom appearances are similar subjective projections from the mind affecting the visual and auditory centers of the brain.``107';
isbe[8895]='Transfiguration`trans-fig-o-ra\'-shun (metamorphoomai, "to be transformed"): Used only with reference to the transfiguration of Christ (<a onClick="return mV(\'Mat\',17,2);">Mt 17:2</a>; <a onClick="return mV(\'Mar\',9,2);">Mr 9:2</a>) and the change wrought in the Christian personality through fellowship with Christ (<a onClick="return mV(\'Rom\',12,2);">Ro 12:2</a>; <a onClick="return mV(\'2Cr\',3,18);">2Co 3:18</a>).<P>(1) About midway of His active ministry Jesus, accompanied by Peter, James and John, withdrew to a high mountain apart (probably Mt. Hermon; see next article) for prayer. While praying Jesus was "transfigured," "his face did shine as the sun," "and his garments became glistering, exceeding white, so as no fuller on earth can whiten them." It was night and it was cold. The disciples were drowsy and at first but dimly conscious of the wonder in progress before their eyes. From the brightness came the sound of voices. Jesus was talking with Moses and Elijah, the subject of the discourse, as the disciples probably learned later, being of the decease (exodus) which Jesus was about to accomplish at Jerusalem. As the disciples came to themselves, the figures of Moses and Elijah seemed to withdraw, whereupon Peter impetuously demanded tents to be set up for Jesus and His heavenly visitants that the stay might be prolonged and, if possible, made permanent. Just then a cloud swept over them, and out of the cloud a voice came, saying, "This is my beloved Son: hear ye him." In awe the disciples prostrated themselves and in silence waited. Suddenly, lifting up their eyes they saw no one, save Jesus only (<a onClick="return mV(\'Mat\',17,\'1-13\');">Mt 17:1-13</a>; <a onClick="return mV(\'Mar\',9,\'2-13\');">Mr 9:2-13</a>; <a onClick="return mV(\'Luk\',9,\'28-36\');">Lu 9:28-36</a>).<P>Such is the simple record. What is its significance? The Scripture narrative offers no explanation, and indeed the event is afterward referred to only in the most general way by Peter (<a onClick="return mV(\'2Pe\',1,\'16-18\');">2Pe 1:16-18</a>) and, perhaps, by John (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>). That it marked a crisis in the career of Jesus there can be no doubt. From this time He walked consciously under the shadow of the cross. A strict silence on the subject was enjoined upon the three witnesses of His transfiguration until after "the Son of man should have risen again from the dead." This means that, as not before, Jesus was made to realize the sacrificial character of His mission; was made to know for a certainty that death, soon and cruel, was to be His portion; was made to know also that His mission as the fulfillment of Law (Moses) and prophecy (Elijah) was not to be frustrated by death. In His heart now would sound forever the Father\'s approval, "This is my beloved Son, in whom I am well pleased." The scene, therefore, wrought out in Jesus a new fervor, a new boldness, a new confidence of ultimate victory which, as a source of holy joy, enabled Him to endure the cross and to despise the shame (<a onClick="return mV(\'Hbr\',12,2);">Heb 12:2</a>). In the disciples the scene must have wrought a new faith in the heavensent leadership of Jesus. In the dark days which were soon to come upon them the memory of the brightness of that unforgettable night would be a stay and strength. There might be opposition, but there could be no permanent defeat of one whose work was ratified by Moses, by Elijah, by God Himself. Indeed, was not the presence of Moses and Elijah a pledge of immortality for all? How in the face of such evidence, real to them, however it might be to others, could they ever again doubt the triumph of life and of Him who was the Lord of life? The abiding lesson of the Transfiguration is that of the reality of the unseen world, of its nearness to us, and of the comforting and inspiring fact that "spirit with spirit may meet."<P>The transfigured appearance of Jesus may have owed something to the moonlight on the snow and to the drowsiness of the disciples; but no one who has ever seen the face of a saint fresh from communion with God, as in the case of Moses (<a onClick="return mV(\'Exd\',34,\'29-35\');">Ex 34:29-35</a>) and of Stephen (<a onClick="return mV(\'Act\',6,15);">Ac 6:15</a>), will have any difficulty in believing that the figure of Jesus was irradiated with a "light that never was on sea or land." See Comms. and Lives of Christ; also a suggestive treatment in Westcott\'s Introduction to the Study of the Gospels. (2) The transfiguration of Christians is accomplished by the renewing of the mind whereby, in utter abandonment to the will of God, the disciple displays the mind of Christ (<a onClick="return mV(\'Rom\',12,2);">Ro 12:2</a>); and by that intimate fellowship with God, through which, as with unveiled face he beholds the glory of the Lord, he is "transformed into the same image from glory to glory, even as from the Lord the Spirit" (<a onClick="return mV(\'2Cr\',3,18);">2Co 3:18</a>).``168';
isbe[8896]='Transfiguration, Mount of`trans-fig-u-ra\'-shun (referred to as the "holy mount" in <a onClick="return mV(\'2Pe\',1,18);">2Pe 1:18</a>): Records of the Transfiguration are found in <a onClick="return mV(\'Mat\',17,1);">Mt 17:1</a>ff; <a onClick="return mV(\'Mar\',9,2);">Mr 9:2</a>ff; <a onClick="return mV(\'Luk\',9,28);">Lu 9:28</a>ff. From these narratives we gather that Jesus went with His disciples from Bethsaida to the neighborhood of Caesarea Philippi, where Peter\'s memorable confession was made. Some six or eight days later Jesus went up into a high mountain to pray, taking with Him Peter, James and John. There He was transfigured before them. Descending the next day, He healed a demoniac boy, and then passed through Galilee to Capernaum.<P>1. Not Olivet or Tabor:<P>It is quite evident that the tradition placing the scene on the Mount of Olives must be dismissed. Another tradition, dating from the 4th century, identifies the mountain with Tabor. In the article on <a href="./study/isbe/search.html?string=TABOR,+MOUNT">TABOR, MOUNT</A>, reasons are stated for rejecting this tradition. It was indeed possible in the time indicated to travel from Caesarea Philippi to Tabor; but there is nothing to show why this journey should have been undertaken; and, the mountain top being occupied by a town or village, a suitable spot could not easily have been found.<P>2. Mt. Hermon:<P>In recent years the opinion has become general that the scene must be placed somewhere on Mt. Hermon. It is near to Caesarea Philippi. It is the mountain par excellence in that district (<a onClick="return mV(\'Luk\',9,28);">Lu 9:28</a>). It was easily possible in the time to make the journey to Chasbeiyah and up the lofty steeps. The sacred associations of the mountain might lend it special attractions (Stanley, S and the Priestly Code (P), 399). This is supported by the transient comparison of the celestial splendor with the snow, where alone it could be seen in Palestine (ibid., 400).<P>It seems to have been forgotten that Mt. Hermon lay beyond the boundaries of Palestine, and that the district round its base was occupied by Gentiles (HJP, II, i, 133f). The sacred associations of the mountain were entirely heathen, and could have lent it no fitness for the purpose of Jesus; hos chion, "as snow," in <a onClick="return mV(\'Mar\',9,3);">Mr 9:3</a>, does not belong to the original text, and therefore lends no support to the identification. It was evidently in pursuance of His ordinary custom that Jesus "went up into the mountain to pray" (<a onClick="return mV(\'Luk\',9,28);">Lu 9:28</a>). This is the only indication of His purpose. It is not suggested that His object was to be transfigured. "As he was praying," the glory came. There is no hint that He had crossed the border of Palestine; and it is not easy to see why in the circumstances He should have made this journey and toilsome ascent in heathen territory. Next morning as usual He went down again, and was met by a crowd that was plainly Jewish. The presence of "the scribes" is sufficient proof of this (<a onClick="return mV(\'Mar\',9,14);">Mr 9:14</a>). Where was such a crowd to come from in this Gentile district? Matthew in effect says that the healing of the demoniac took place in Galilee (<a onClick="return mV(\'Mat\',17,22);">Mt 17:22</a>). The case against Mt. Hermon seems not less conclusive than that against Tabor.<P>3. Jebel Jermuk:<P>The present writer has ventured to suggest an identification which at least avoids the difficulties that beset the above (Expository Times, XVIII, 333f). Among the mountains of Upper Galilee Jebel Jermuk is especially conspicuous, its shapely form rising full 4,000 ft. above the sea. It is the highest mountain in Palestine proper, and is quite fitly described as hupselon ("high"). It stands to the west over against the Safed uplands, separated from them by a spacious valley, in the bottom of which runs the tremendous gorge, Wady Leimun. It is by far the most striking feature in all the Galilean landscape. The summit commands a magnificent view, barred only to the southwest by other mountains of the range. It rises from the midst of a district which then supported a large population of Jews, with such important Jewish centers as Kefr Bir\'im, Gishcala, Meiron, etc., around its base. Remote and lonely as it is, the summit was just such a place as Jesus might have chosen for prayer. It was comparatively easy to reach, and might be comfortably climbed in the evening. Then on His descent next day the crowd might easily assemble from the country and the villages near by. How long our Lord stayed near Caesarea Philippi after the conversation recorded in <a onClick="return mV(\'Mat\',16,21);">Mt 16:21</a>ff we do not know. From Banias to Gishcala, e.g. one could walk on foot without fatigue in a couple of days. If a little time were spent in the Jewish villages passed on the way, the six days, or Luke\'s "about eight days," are easily accounted for. From this place to Capernaum He would "pass through Galilee" (<a onClick="return mV(\'Mar\',9,30);">Mr 9:30</a>).``54';
isbe[8897]='Transform`trans-form\' (<a onClick="return mV(\'Rom\',12,2);">Ro 12:2</a>; the Revised Version (British and American) <a onClick="return mV(\'2Cr\',3,18);">2Co 3:18</a> for metamorphoomai, and the King James Version <a onClick="return mV(\'2Cr\',11,13,14,15);">2Co 11:13,14,15</a> for metaschematizo, the Revised Version (British and American) "fashion"): The commentaries often explain the former word as connoting a change of nature, while the latter refers only to the appearance, but this distinction is probably fanciful.``1';
isbe[8898]='Transgression`trans-gresh\'-un: From "transgress," to pass over or beyond; to overpass, as any rule prescribed as the limit of duty; to break or violate, as a law, civil or moral; the act of transgressing; the violation of a law or known principle of rectitude; breach of command; offense; crime; sin. In the Old Testament pesha\', occurs 80 times, rendered in all versions by "transgression." Its meaning is "rebellion"; see <a href="./study/isbe/search.html?string=REBELLION">REBELLION</a>. The word "rebellion" differs from this word in that it may be in the heart, though no opportunity should be granted for its manifestation: "An evil man seeketh only rebellion" (<a onClick="return mV(\'Pro\',17,11);">Pr 17:11</a>). Here the wise man contemplates an evil heart, looking for an excuse or opportunity to rebel.<P>The New Testament uses parabasis, "trespass": "The law...was added because of transgressions" (<a onClick="return mV(\'Gal\',3,19);">Ga 3:19</a>); "Where there is no law, neither is there transgression" (<a onClick="return mV(\'Rom\',4,15);">Ro 4:15</a>); "for the redemption of the transgressions that were under the first covenant" (<a onClick="return mV(\'Hbr\',9,15);">Heb 9:15</a>).``45';
isbe[8899]='Translation`trans-la\'-shun: The verb "translate" is found once in the Old Testament (<a onClick="return mV(\'2Sa\',3,10);">2Sa 3:10</a> the King James Version, in the sense of "to transfer") and 3 times in the New Testament (<a onClick="return mV(\'Col\',1,13);">Col 1:13</a>, methistemi, where it means "to transfer"; twice in <a onClick="return mV(\'Hbr\',11,5);">Heb 11:5</a>, where it has the quasi-technical sense of removing one from the earthly to the heavenly state without the intervening experience of death).<P>The noun "translation" occurs only in <a onClick="return mV(\'Hbr\',11,5);">Heb 11:5</a>, metathesis, where it refers to the transition, the general nature of which has just been described in connection with the verb. With their customary reserve in regard to such matters, the Scriptures simply record the fact of Enoch\'s translation without commenting either upon the attendant circumstances, or upon the nature of the change involved in his experience. Doubtless what Paul says in <a onClick="return mV(\'1Cr\',15,51,52);">1Co 15:51,52</a> applied in the case of Enoch and also in that of Elijah (<a onClick="return mV(\'2Ki\',2,11);">2Ki 2:11</a>).``116';
isbe[8900]='Trap`(moqesh; thera, literally, "hunting," used metaphorically in Psalms and Romans as "trap"): Any of the methods for taking birds; see <a href="./study/isbe/search.html?string=SNARE">SNARE</A>; <a href="./study/isbe/search.html?string=NET">NET</A>; <a href="./study/isbe/search.html?string=GIN">GIN</A>, etc. It is probable that a trap was more particularly a hole in the ground covered with twigs, concealed by leaves and baited with food. Such devices were common in taking the largest animals and may have been used with birds also. Trap is mentioned frequently in connection with snare and in such manner as to indicate that they were different devices: "Know for a certainty that Yahweh your God will no more drive these nations from out of your sight; but they shall be a snare and a trap unto you" (<a onClick="return mV(\'Jos\',23,13);">Jos 23:13</a>). Another such reference will be found in <a onClick="return mV(\'Psa\',69,22);">Ps 69:22</a>:<P>"Let their table before them become a snare;<P>And when they are in peace, let it become a trap."<P>This is quoted in <a onClick="return mV(\'Rom\',11,9);">Ro 11:9</a>: "Let their table be made a snare, and a trap,<P>And a stumbling block, and a recompense unto them."<P>An instance where a trap alone is referred to can be found in <a onClick="return mV(\'Jer\',5,26);">Jer 5:26</a>: "They set a trap, they catch men." <a onClick="return mV(\'Isa\',42,22);">Isa 42:22</a> uses this expression, "snared in holes." This might mean that a snare was placed in a hole, or that the hole was the snare to lure bird or animal to its death. The former proposition is sustained by Job, who says, "A noose is hid for him in the ground, and a trap for him in the way" (<a onClick="return mV(\'Job\',18,10);">18:10</A>). This translation appears as if it were reversed and should read, "A trap is hid for him in the ground and a noose in the way."``167';
