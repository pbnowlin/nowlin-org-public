pyramidal top. Its origin is unknown; its traditional name is due to our Lord\'s word in <a onClick="return mV(\'Mat\',23,35);">Mt 23:35</a>; <a onClick="return mV(\'Luk\',11,51);">Lu 11:51</a> (see <a href="study/isbe/search.html?string=ZACHARIAH">ZACHARIAH</A>).<P>4. The "Egyptian Tomb":<P>A little farther down the valley of the Kidron, at the commencement of the village of Siloam, is another rock-cut tomb, the so-called Egyptian Tomb, or according to some, "the tomb of Solomon\'s Egyptian wife." It is a monolith 18 ft. square and 11 ft. high, and the interior has at one time been used as a chapel. It is now Russian property. It probably belongs to much the same period as the three before-mentioned tombs, and, like them, shows strong Egyptian influence.<P>The so-called "Tombs of the Judges" belong to the Roman period, as do the scores of similar excavations in the same valley. The "Tombs of the Prophets" on the western slopes of the Mount of Olives are now considered to belong to the 4th or 5th Christian century.<P>Near the knoll over Jeremiah\'s Grotto, to the west and northwest, are a great number of tombs, mostly Christian. The more northerly members of the group are now included in the property of the Dominicans attached to the Church of Stephen, but one, the southernmost, has attracted a great deal of attention because it was supposed by the late General Gordon to be the tomb of Christ.<P>5. The "Garden Tomb":<P>In its condition when found it was without doubt, like its neighbors, a Christian tomb of about the 5th century, and it was full of skeletons. Whether it may originally have been a Jewish tomb is unproved; it certainly could not have been recognized as a site of any sanctity until General Gordon promulgated his theory (see PEFS, 1892, 120-24; see also <a href="study/isbe/search.html?string=GOLGOTHA">GOLGOTHA</a>).<P>6. Tomb of "Simon the Just":<P>The Jews greatly venerate a tomb on the eastern side of the Wady el Joz, not far south of the great North Road; they consider it to be the tomb of Simon the Just, but it is in all probability not a Jewish tomb at all.<P>7. Other Antiquities:<P>Only passing mention can here be made of certain remains of interest connected with the exterior walls of the Charam. The foundation walls of the temple-platform are built, specially upon the east, south and west, of magnificent blocks of smooth, drafted masonry with an average height of 3 1/2 ft. One line, known as the "master course," runs for 600 ft. westward from the southeastern angle, with blocks 7 ft. high. Near the southeastern angle at the foundation itself, certain of the blocks were found by the Palestine Exploration Fund engineers to be marked with Phoenician characters, which it was supposed by many at the time of their discovery indicated their Solomonic origin. It is now generally held that these "masons\' marks" may just as well have been used in the time of Herod the Great, and on other grounds it is held that all this magnificent masonry is due to the vast reconstruction of the Temple which this great monarch initiated (see <a href="study/isbe/search.html?string=TEMPLE,+A1">TEMPLE</A>). In the western wall of the Charam, between the southwestern corner and the "Jewish wailing place," lies "Robinson\'s Arch." It is the spring of an arch 50 ft. wide, projecting from the temple-wall; the bridge arising from it had a span of 50 ft., and the pier on the farther side was discovered by Warren. Under the bridge ran a contemporary paved Roman street, and beneath the unbroken pavement was found, lying inside a rock aqueduct, a voussoir of an older bridge. This bridge connected the temple-enclosure with the upper city in the days of the Hasmonean kings. It was broken down in 63 BC by the Jews in anticipation of the attack of Pompey (Antiquities, XIV, iv, 2; BJ, I, vii, 2), but was rebuilt by Herod in 19 BC (Jewish Wars, VI, viii, 1; vi, 2), and finally destroyed in 70 AD.<P>Nearly 600 ft. farther north, along this western temple-wall is Wilson\'s Arch, which lies under the surface within the causeway which crosses the Tyropeon to the Babylonian es Silseleh of the Charam; although not itself very ancient there are here, deeper down, arches belonging to the Herodian causeway which here approached the temple-platform.<P>8. Ecclesiastical Sites:<P>With regard to the common ecclesiastical sites visited by pious pilgrims little need be said here. The congeries of churches that is included under that name of Church of the Holy Sepulchre includes a great many minor sites of the scenes of the Passion which have no serious claims. Besides the Holy Sepulchre itself—which, apart from its situation, cannot be proved or disproved, as it has actually been destroyed—the only important site is that of "Mount Calvary." All that can be said is that if the Sepulchre is genuine, then the site may be also; it is today the hollowed-out shell of a rocky knoll encased in marble and other stones and riddled with chapels.<P>See <a href="study/isbe/search.html?string=GOLGOTHA">GOLGOTHA</A>.<P>The coenaculum, close to the Moslem "Tomb of David" (a site which has no serious claims), has been upheld by Professor Sanday (Sacred Sites of the Gospels) as one which has a very strong tradition in its favor. The most important evidence is that of Epiphanias, who states that when Hadrian visited Jerusalem in 130, one of the few buildings left standing was "the little Church of God, on the site where the disciples, returning after the Ascension of the Saviour from Olivet, had gone up to the Upper room, for there it had been built, that is to say in the quarter of Zion." In connection with this spot there has been pointed out from early Christian times the site of the House of Caiaphas and the site of the death of the Virgin Mary—the Dormitio Sanctae Virginis. It is in consequence of this latter tradition that the German Roman Catholics have now erected here their magnificent new church of the Dormition. A rival line of traditions locates the tomb of the Virgin in the Kidron valley near Gethsemane, where there is a remarkable underground chapel belonging to the Greeks.``117';
isbe[4993]='Jerusalem, 4`IX. History.<P>Pre-Israelite period.—The beginnings of Jerusalem are long before recorded history: at various points in the neighborhood, e.g. at el Bukei\'a to the southwest, and at the northern extremity of the Mount of Olives to the northeast, were very large settlements of Paleolithic man, long before the dawn of history, as is proved by the enormous quantities of Celts scattered over the surface. It is certain that the city\'s site itself was occupied many centuries before David, and it is a traditional view that the city called <a href="study/isbe/search.html?string=SALEM+(1)">SALEM</a> (which see) (<a onClick="return mV(\'Gen\',14,18);">Ge 14:18</a>), over which Melchizedek was king, was identical with Jerusalem.<P>1. Tell el-Amarna Correspondence:<P>The first certain reference to this city is about 1450 BC, when the name Ur-u-salem occurs in several letters belonging to the Tell el-Amarna Letters correspondence. In 7 of these letters occurs the name Abd Khiba, and it is clear that this man was "king," or governor of the city, as the representative of Pharaoh of Egypt. In this correspondence Abd Khiba represents himself as hard pressed to uphold the rights of his suzerain against the hostile forces which threaten to overwhelm him. Incidentally we may gather that the place was then a fortified city, guarded partly by mercenary Egyptian troops, and there are reasons for thinking that then ruler of Egypt, Amenhotep IV, had made it a sanctuary of his god Aten—the sun-disc. Some territory, possibly extending as far west as Ajalon, seems to have been under the jurisdiction of the governor. Professor Sayce has stated that Abd Khiba was probably a Hittite chief, but this is doubtful. The correspondence closes abruptly, leaving us in uncertainty with regard to the fate of the writer, but we know that the domination of Egypt over Palestine suffered an eclipse about this time.<P>2. Joshua\'s Conquest:<P>At the time of Joshua\'s invasion of Canaan, <a href="study/isbe/search.html?string=ADONI-ZEDEK">ADONI-ZEDEK</A> (which see) is mentioned (<a onClick="return mV(\'Jos\',10,\'1-27\');">Jos 10:1-27</a>) as king of Jerusalem; he united with the kings of Hebron, Jarmuth, Lachish and Eglon to fight against the Gibeonites who had made peace with Joshua; the 5 kings were defeated and, being captured in hiding at the cave Makkedah, were all slain. Another king, <a href="study/isbe/search.html?string=ADONIBEZEK">ADONIBEZEK</A> (which see) (whom some identify with Adoni-zedek), was defeated by Judah after the death of Joshua, and after being mutilated was brought to Jerusalem and died there (<a onClick="return mV(\'Jdg\',1,\'1-7\');">Jud 1:1-7</a>), after which it is recorded (<a onClick="return mV(\'Jdg\',1,8);">Jud 1:8</a>) that Judah "fought against Jerusalem, and took it...and set the city on fire." But it is clear that the city remained in the hands of the "Jebusites" for some years more (<a onClick="return mV(\'Jdg\',1,21);">Jud 1:21</a>; <a onClick="return mV(\'Jdg\',19,11);">19:11</a>), although it was theoretically reckoned on the southern border of Benjamin (<a onClick="return mV(\'Jos\',15,8);">Jos 15:8</a>; <a onClick="return mV(\'Jos\',18,16,28);">18:16, 28</a>). David, after he had reigned 7 1/2 years at Hebron, determined to make the place his capital and, about 1000 BC, captured the city.<P>3. Site of the Jebusite City:<P>Up to this event it is probable that Jerusalem was like other contemporary fortified sites, a comparatively small place encircled with powerful walls, with but one or perhaps two gates; it is very generally admitted that this city occupied the ridge to the south of the temple long incorrectly called "Ophel," and that its walls stood upon steep rocky scarps above the Kidron valley on the one side, and the Tyropeon on the other. We have every reason to believe that the great system of tunnels, known as "Warren\'s Shaft" (see VII,3,above) existed all through this period.<P>4. David:<P>The account of the capture of Jerusalem by David is obscure, but it seems a probable explanation of a difficult passage (<a onClick="return mV(\'2Sa\',5,\'6-9\');">2Sa 5:6-9</a>) if we conclude that the Jebusites, relying upon the extraordinary strength of their position, challenged David: "Thou shalt not come in hither, but the blind and the lame shall turn thee away" (<a onClick="return mV(\'2Sa\',5,6);">2Sa 5:6</a> margin), and that David directed his followers to go up the "watercourse" and smite the "lame and the blind"—a term he in his turn applies mockingly to the Jebusites. "And Joab the son of Zeruiah went up first, and was made chief" (<a onClick="return mV(\'1Ch\',11,6);">1Ch 11:6</a>). It seems at least probable that David\'s men captured the city through a surprise attack up the great tunnels (see VII,3,above). David having captured the stronghold "Zion," renamed it the "City of David" and took up his residence there; he added to the strength of the fortifications "round about from the <a href="study/isbe/search.html?string=MILLO">MILLO</A> (which see) and onward"; with the assistance of Phoenician workmen supplied by Hiram, king of Tyre, he built himself "a house of cedar" (<a onClick="return mV(\'2Sa\',5,11);">2Sa 5:11</a>; compare <a onClick="return mV(\'2Sa\',7,2);">7:2</A>). The ark of Yahweh was brought from the house of Obed-edom and lodged in a tent (<a onClick="return mV(\'2Sa\',6,17);">2Sa 6:17</a>) in the "city of David" (compare <a onClick="return mV(\'1Ki\',8,1);">1Ki 8:1</a>). The threshing-floor of Araunah (<a onClick="return mV(\'2Sa\',24,18);">2Sa 24:18</a>), or Ornan (<a onClick="return mV(\'1Ch\',21,15);">1Ch 21:15</a>), the Jebusite, was later purchased as the future site of the temple.<P>5. Expansion of the City:<P>The Jerusalem which David captured was small and compact, but there are indications that during his reign it must have increased considerably by the growth of suburbs outside the Jebusite walls. The population must have been increased from several sources. The influx of David\'s followers doubtless caused many of the older inhabitants to be crowded out of the walled area. There appear to have been a large garrison (<a onClick="return mV(\'2Sa\',15,18);">2Sa 15:18</a>; <a onClick="return mV(\'2Sa\',20,7);">20:7</a>), many officials and priests and their families (<a onClick="return mV(\'2Sa\',8,\'16-18\');">2Sa 8:16-18</a>; <a onClick="return mV(\'2Sa\',20,\'23-26\');">20:23-26</a>; <a onClick="return mV(\'2Sa\',23,8);">23:8</a>), and the various members of David\'s own family and their relatives (<a onClick="return mV(\'2Sa\',5,\'13-16\');">2Sa 5:13-16</a>; <a onClick="return mV(\'2Sa\',14,24,28);">14:24, 28</a>; <a onClick="return mV(\'1Ki\',1,5,53);">1Ki 1:5, 53</a>, etc.). It is impossible to suppose that all these were crowded into so narrow an area, while the incidental mention that Absalom lived two whole years in Jerusalem without seeing the king\'s face implies suburbs (<a onClick="return mV(\'2Sa\',14,24,28);">2Sa 14:24, 28</a>). The new dwellings could probably extend northward toward the site of the future temple and northwestward into and up the Tyropeon valley along the great north road. It is improbable that they could have occupied much of the western hill.<P>6. Solomon:<P>With the accession of Solomon, the increased magnificence of the court, the foreign wives and their establishments, the new officials and the great number of work people brought to the city for Solomon\'s great buildings must necessarily have enormously swelled the resident population, while the recorded buildings of the city, the temple, the king\'s house, the House of the Daughter of Pharaoh, the House of the Forest of Lebanon, the Throne Hall and the Pillared Hall (<a onClick="return mV(\'1Ki\',7,\'1-8\');">1Ki 7:1-8</a>) must have altered the whole aspect of the site. In consequence of these new buildings, the sanctuary together with the houses of the common folk, a new wall for the city was necessary, and we have a statement twice made that Solomon built "the wall of Jerusalem round about" (<a onClick="return mV(\'1Ki\',3,1);">1Ki 3:1</a>; <a onClick="return mV(\'1Ki\',9,15);">9:15</a>); it is also recorded that he built Millo (<a onClick="return mV(\'1Ki\',9,15,24);">1Ki 9:15, 24</a>; <a onClick="return mV(\'1Ki\',11,27);">11:27</a>), and that "he repaired the breach of the city of David his father" (<a onClick="return mV(\'1Ki\',11,27);">1Ki 11:27</a>). The question of the Millo is discussed elsewhere (see <a href="study/isbe/search.html?string=MILLO">MILLO</A>); the "breach" referred to may have been the connecting wall needed to include the Millo within the complete circle of fortifications, or else some part of David\'s fortification which his death had left incomplete.<P>7. Solomon\'s City Wall:<P>As regards the "Wall of Jerus" which Solomon built, it is practically certain that it was, on the north and west, that described by Josephus as the First Wall (see VI, 7 above). The vast rock-cut scarps at the southwestern corner testify to the massiveness of the building. Whether the whole of the southwestern hill was included is matter of doubt. Inasmuch as there are indications at Bliss\'s tower (see VI, 4th above) of an ancient wall running northeasterly, and enclosing the summit of the southwestern hill, it would appear highly probable that Solomon\'s wall followed that line; in this case this wall must have crossed the Tyropeon at somewhat the line of the existing southern wall, and then have run southeasterly to join the western wall of the old city of the Jebusites. The temple and palace buildings were all enclosed in a wall of finished masonry which made it a fortified place by itself—as it appears to have been through Hebrew history—and these walls, where external to the rest of the city, formed part of the whole circle of fortification.<P>Although Solomon built so magnificent a house for Yahweh, he erected in the neighborhood shrines to other local gods (<a onClick="return mV(\'1Ki\',11,7,8);">1Ki 11:7-8</a>), a lapse ascribed largely to the influence of his foreign wives and consequent foreign alliances.<P>8. The Disruption (933 BC):<P>The disruption of the kingdom must have been a severe blow to Jerusalem, which was left the capital, no longer of a united state, but of a petty tribe. The resources which were at the command of Solomon for the building up of the city were suddenly cut off by Jeroboam\'s avowed policy, while the long state of war which existed between the two peoples—a state lasting 60 years (<a onClick="return mV(\'1Ki\',14,30);">1Ki 14:30</a>; <a onClick="return mV(\'1Ki\',15,6,16);">15:6,16</a>; <a onClick="return mV(\'1Ki\',22,44);">22:44</a>)—must have been very injurious to the growth of commerce and the arts of peace.<P>9. Invasion of Shishak (928 BC):<P>In the 5th year of Rehoboam (928), Shishak (Sheshonq) king of Egypt came up against Jerusalem (<a onClick="return mV(\'1Ki\',14,25);">1Ki 14:25</a>) and took "the fenced cities of Judah" (<a onClick="return mV(\'2Ch\',12,4);">2Ch 12:4</a> the King James Version). It has been commonly supposed that he besieged and captured Jerusalem itself, but as there is no account of the destruction of fortifications and as the name of this city has not been deciphered upon the Egyptian records of this campaign, it is at least as probable, and is as consistent with the Scriptural references, that Shishak was bought off with "the treasures of the house of Yahweh, and the treasures of the king\'s house" and "all the shields of gold which Solomon had made" (<a onClick="return mV(\'1Ki\',14,26);">1Ki 14:26</a>).<P>10. City Plundered by Arabs:<P>It is clear that by the reign of Jehoshaphat the city had again largely recovered its importance (compare <a onClick="return mV(\'1Ki\',22,\'1-\');">1Ki 22</a>), but in his son Jehoram\'s reign (849-842 BC) Judah was invaded and the royal house was pillaged by Philistines and Arabs (<a onClick="return mV(\'2Ch\',21,\'16-17\');">2Ch 21:16-17</a>). Ahaziah (842 BC), Jehoram\'s son, came to grief while visiting his maternal relative at Jezreel, and after being wounded in his chariot near Ibleam, and expiring at Megiddo, his body was carried to Jerusalem and there buried (<a onClick="return mV(\'2Ki\',9,\'27-28\');">2Ki 9:27-28</a>). Jerusalem was now the scene of the dramatic events which center round the usurpation and death of Queen Athaliah (<a onClick="return mV(\'2Ki\',11,16);">2Ki 11:16</a>; <a onClick="return mV(\'2Ch\',23,15);">2Ch 23:15</a>) and the coronation and reforms of her grandson Joash (<a onClick="return mV(\'2Ki\',12,\'1-16\');">2Ki 12:1-16</a>; <a onClick="return mV(\'2Ch\',24,\'1-14\');">2Ch 24:1-14</a>).<P>11. Hazael King of Syria Bought Off (797 BC):<P>After the death of the good priest Jehoiada, it is recorded (<a onClick="return mV(\'2Ch\',24,15);">2Ch 24:15</a>) that the king was led astray by the princes of Judah and forsook the house of Yahweh, as a consequence of which the Syrians under Hazael came against Judah and Jerusalem, slew the princes and spoiled the land, Joash giving him much treasure from both palace and temple (<a onClick="return mV(\'2Ki\',12,17,18);">2Ki 12:17-18</a>; <a onClick="return mV(\'2Ch\',24,23);">2Ch 24:23</a>). Finally Joash was assassinated (<a onClick="return mV(\'2Ki\',12,20,21);">2Ki 12:20-21</a>; <a onClick="return mV(\'2Ch\',24,25);">2Ch 24:25</a>) "at the house of Millo, on the way that goeth down to Silla."<P>12. Capture of the City of Jehoash of Israel:<P>During the reign of Amaziah (797-729 BC), the murdered king\'s son, a victory over Edom appears to have so elated the king that he wantonly challenged Jehoash of Israel to battle (<a onClick="return mV(\'2Ki\',14,8);">2Ki 14:8</a>f). The two armies met at Beth-shemesh, and Judah was defeated and "fled every man to his tent." Jerusalem was unable to offer any resistance to the victors, and Jehoash "brake down the wall of Jerusalem from the gate of Ephraim unto the corner gate, 400 cubits" and then returned to Samaria, loaded with plunder and hostages (<a onClick="return mV(\'2Ki\',14,14);">2Ki 14:14</a>). Fifteen years later, Amaziah was assassinated at Lachish whither he had fled from a conspiracy; nevertheless they brought his body upon horses, and he was buried in Jerusalem.<P>13. Uzziah\'s Refortification (779-740 BC):<P>Doubtless it was a remembrance of the humiliation which his father had undergone which made Uzziah (Azariah) strengthen his position. He subdued the Philistines and the Arabs in Gur, and put the Ammonites to tribute (<a onClick="return mV(\'2Ch\',26,7,8);">2Ch 26:7-8</a>). He "built towers in Jerusalem at the corner gate, and at the valley gate, and at the turnings (Septuagint) of the walls, and fortified them" (<a onClick="return mV(\'2Ch\',26,9);">2Ch 26:9</a>). He is also described as having made in Jerusalem "engines, invented by skillful men, to be on the towers and upon the battlements, wherewith to shoot arrows and great stones" (<a onClick="return mV(\'2Ch\',26,15);">2Ch 26:15</a>). The city during its long peace with its northern neighbors appears to have recovered something of her prosperity in the days of Solomon. During his reign the city was visited by a great earthquake (<a onClick="return mV(\'Zec\',14,4);">Zec 14:4</a>; <a onClick="return mV(\'Amo\',1,1);">Am 1:1</a>; compare <a onClick="return mV(\'Isa\',9,10);">Isa 9:10</a>; <a onClick="return mV(\'Isa\',29,6);">29:6</a>; <a onClick="return mV(\'Amo\',4,11);">Am 4:11</a>; <a onClick="return mV(\'Amo\',8,8);">8:8</a>). Jotham, his son, built the upper gate of the house of Yahweh" (<a onClick="return mV(\'2Ki\',15,35);">2Ki 15:35</a>; <a onClick="return mV(\'2Ch\',27,3);">2Ch 27:3</a>), probably the same as the "upper gate of Benjamin" (<a onClick="return mV(\'Jer\',20,2);">Jer 20:2</a>). He also built much on the wall of Ophel—probably the ancient fortress of Zion on the southeastern hill (<a onClick="return mV(\'2Ch\',27,3);">2Ch 27:3</a>); see <a href="study/isbe/search.html?string=OPHEL">OPHEL</A>.<P>14. Ahaz Allies with Assyria (736-728 BC):<P>His son Ahaz was soon to have cause to be thankful for his father\'s and grandfather\'s work in fortifying the city, for now its walls were successful in defense against the kings of Syria and Israel (<a onClick="return mV(\'2Ki\',16,5,6);">2Ki 16:5-6</a>); but Ahaz, feeling the weakness of his little kingdom, bought with silver and gold from the house of Yahweh the alliance of Tiglath-pileser, king of Assyria. He met the king at Damascus and paid him a compliment by having an altar similar to his made for his own ritual in the temple (<a onClick="return mV(\'2Ki\',16,\'10-12\');">2Ki 16:10-12</a>). His reign is darkened by a record of heathen practices, and specially by his making "his son to pass through the fire"—as a human sacrifice in, apparently, the Valley of Hinnom (<a onClick="return mV(\'1Ki\',16,\'3-4\');">1Ki 16:3-4</a>; compare <a onClick="return mV(\'2Ch\',28,3);">2Ch 28:3</a>).<P>15. Hezekiah\'s Great Works:<P>Hezekiah (727-699 BC), his son, succeeded to the kingdom at a time of surpassing danger. Samaria, and with it the last of Israel\'s kingdom, had fallen. Assyria had with difficulty been bought off, the people were largely apostate, yet Jerusalem was never so great and so inviolate to prophetic eyes (<a onClick="return mV(\'Isa\',7,4);">Isa 7:4</a>; <a onClick="return mV(\'Isa\',8,8,10);">8:8, 10</a>; <a onClick="return mV(\'Isa\',10,28);">10:28</a>; <a onClick="return mV(\'Isa\',14,\'25-32\');">14:25-32</a>, etc.). Early in his reign, the uprising of the Chaldean Merodach-baladan against Assyria relieved Judah of her greatest danger, and Hezekiah entered into friendly relations with this new king of Babylon, showing his messengers all his treasures (<a onClick="return mV(\'Isa\',39,1,2);">Isa 39:1-2</a>). At this time or soon after, Hezekiah appears to have undertaken great works in fitting his capital for the troubled times which lay before him. He sealed the waters of Gihon and brought them within the city to prevent the kings of Assyria from getting access to them (<a onClick="return mV(\'2Ki\',20,20);">2Ki 20:20</a>; <a onClick="return mV(\'2Ch\',32,4,30);">2Ch 32:4, 30</a>).<P>See <a href="study/isbe/search.html?string=SILOAM;+SILOAH;+SHELAH;+SHILOAH">SILOAM</A>.<P>It is certain, if their tunnel was to be of any use, the southwestern hill must have been entirely enclosed, and it is at least highly probable that in the account (<a onClick="return mV(\'2Ch\',32,5);">2Ch 32:5</a>), he "built up all the wall that was broken down, and built towers thereon (margin), and the other wall without," the last phrase may refer to the stretch of wall along the edge of the southwestern hill to Siloam. On the other hand, if that was the work of Solomon, "the other wall" may have been the great buttressed dam, with a wall across it which closed the mouth of the Tyropeon, which was an essential part of his scheme of preventing a besieging army from getting access to water. He also strengthened <a href="study/isbe/search.html?string=MILLO">MILLO</a> (which see), on the southeastern hill. Secure in these fortifications, which made Jerusalem one of the strongest walled cities in Western Asia, Hezekiah, assisted, as we learn from Sennacherib\'s descriptions, by Arab mercenaries, was able to buy off the great Assyrian king and to keep his city inviolate (<a onClick="return mV(\'2Ki\',18,\'13-16\');">2Ki 18:13-16</a>). A second threatened attack on the city appears to be referred to in <a onClick="return mV(\'2Ki\',19,\'9-37\');">2Ki 19:9-37</a>.<P>16. His Religious Reforms:<P>Hezekiah undertook reforms. "He removed the high places, and brake the pillars, and cut down the Asherah: and he brake in pieces the brazen serpent that Moses had made and...he called it Nehushtan," i.e. a piece of brass (<a onClick="return mV(\'2Ki\',18,4);">2Ki 18:4</a>).<P>Manasseh succeeded his father when but 12, and reigned 55 years (698-643) in Jerusalem (<a onClick="return mV(\'2Ki\',21,1);">2Ki 21:1</a>). He was tributary to Esarhaddon and Ashurbanipal, as we know from their inscriptions; in one of the latter\'s he is referred to as king "of the city of Judah." The king of Assyria who, it is said (<a onClick="return mV(\'2Ch\',33,11);">2Ch 33:11</a>; compare Ant, X, iii, 2), carried Manasseh in chains to Babylon, was probably Ashurbanipal. How thoroughly the country was permeated by Assyrian influence is witnessed by the two cuneiform tablets recently found at Gezer belonging to this Assyrian monarch\'s reign (PEFS, 1905, 206, etc.).<P>17. Manasseh\'s Alliance with Assyria:<P>The same influence, extending to the religious sphere, is seen in the record (<a onClick="return mV(\'2Ki\',21,5);">2Ki 21:5</a>) that Manasseh "built altars for all the host of heaven in the two courts of the house of Yahweh." There are other references to the idolatrous practices introduced by this king (compare <a onClick="return mV(\'Jer\',7,18);">Jer 7:18</a>; <a onClick="return mV(\'2Ki\',23,5,11,12);">2Ki 23:5, 11-12</a>, etc.). He also filled Jerusalem from one end to the other with the innocent blood of martyrs faithful to Yahweh (<a onClick="return mV(\'2Ki\',21,16);">2Ki 21:16</a>; compare <a onClick="return mV(\'Jer\',19,4);">Jer 19:4</a>). Probably during this long reign of external peace the population of the city much increased, particularly by the influx of foreigners from less isolated regions.<P>18. His Repair of the Walls:<P>Of this king\'s improvements to the fortifications of Jerusalem we have the statement (<a onClick="return mV(\'2Ch\',33,14);">2Ch 33:14</a>), "He built an outer wall to the city of David, on the west side of Gihon in the valley, even to the entrance at the fish gate." This must have been a new or rebuilt wall for the whole eastern side of the city. He also compassed about the <a href="study/isbe/search.html?string=OPHEL">OPHEL</a> (which see) and raised it to a very great height.<P>Manasseh was the first of the Judahic kings to be buried away from the royal tombs. He was buried (as was his son Amon) "in the garden of his own house, in the garden of Uzza" (<a onClick="return mV(\'2Ki\',21,18);">2Ki 21:18</a>). These may be the tombs referred to (<a onClick="return mV(\'Eze\',43,\'7-9\');">Eze 43:7-9</a>) as too near the temple precincts.<P>19. Josiah and Religious Reforms (640-609 BC):<P>In the reign of Josiah was found the "Book of the Law," and the king in consequence instituted radical reforms (<a onClick="return mV(\'2Ki\',22,\'1-\');">2Ki 22</a>; <a onClick="return mV(\'2Ki\',23,\'1-\');">23</a>). Kidron smoked with the burnings of the Asherah and of the vessels of Baal, and Topheth in the Valley of Hinnom was defiled. At length after a reign of 31 years (<a onClick="return mV(\'2Ki\',23,29,30);">2Ki 23:29-30</a>), Josiah, in endeavoring to intercept Pharaoh-necoh from combining with the king of Babylon, was defeated and slain at Megiddo and was buried "in his own sepulchre" in Jerusalem—probably in the same locality where his father and grandfather lay buried. Jehoahaz, after a reign of but 3 months, was carried captive (<a onClick="return mV(\'2Ki\',23,34);">2Ki 23:34</a>) by Necoh to Egypt, where he died—and apparently was buried among strangers (<a onClick="return mV(\'Jer\',22,\'10-12\');">Jer 22:10-12</a>). His brother Eliakim, renamed Jehoiakim, succeeded. In the 4th year of his reign, Egypt was defeated at Carchemish by the Babylonians, and as a consequence Jehoiakim had to change from subjection to Egypt to that of Babylon.<P>20. Jeremiah Prophesies the Approaching Doom:<P>During this time Jeremiah was actively foretelling in streets and courts of Jerusalem (<a onClick="return mV(\'Jer\',5,1);">5:1</a>, etc.) the approaching ruin of the city, messages which were received with contempt and anger by the king and court (<a onClick="return mV(\'Jer\',36,23);">Jer 36:23</a>). In consequence of his revolt against Babylon, bands of Chaldeans, Syrians, Moabites and Ammonites came against him (<a onClick="return mV(\'2Ki\',24,2);">2Ki 24:2</a>), and his death was inglorious (<a onClick="return mV(\'2Ki\',24,6);">2Ki 24:6</a>; <a onClick="return mV(\'Jer\',22,18,19);">Jer 22:18-19</a>).<P>21. Nebuchadnezzar Twice Takes Jerusalem (586 BC):<P>His son Jehoiachin, who succeeded him, went out with all his household and surrendered to the approaching Nebuchadnezzar (597), and was carried to Babylon where he passed more than 37 years (<a onClick="return mV(\'2Ki\',25,\'27-30\');">2Ki 25:27-30</a>). Jerusalem was despoiled of all its treasures and all its important inhabitants. The king of Babylon\'s nominee, Zedekiah, after 11 years rebelled against him, and consequently Jerusalem was besieged for a year and a half until "famine was sore in the city." On the 9th of Ab all the men of war "fled by night by the way of the gate between the two walls, which was by the king\'s garden," i.e. near the mouth of the Tyropeon, and the king "went by the way of the Arabah," but was overtaken and captured "in the plains of Jericho." A terrible punishment followed his faithlessness to Babylon (<a onClick="return mV(\'2Ki\',25,\'1-7\');">2Ki 25:1-7</a>). The city and the temple were despoiled and burnt; the walls of Jerusalem were broken down, and none but the poorest of the land "to be vinedressers and husbandmen" were left behind (<a onClick="return mV(\'2Ki\',25,8);">2Ki 25:8</a>f; <a onClick="return mV(\'2Ch\',36,17);">2Ch 36:17</a>f). It is probable that the ark was removed also at this time.<P>22. Cyrus and the First Return (538 BC):<P>With the destruction of their city, the hopes of the best elements in Judah turned with longing to the thought of her restoration. It is possible that some of the remnant left in the land may have kept up some semblance of the worship of Yahweh at the temple-site. At length, however, when in 538 Cyrus the Persian became master of the Babylonian empire, among many acts of a similar nature for the shrines of Assyrian and Babylonian gods, he gave permission to Jews to return to rebuild the house of Yahweh (<a onClick="return mV(\'Ezr\',1,1);">Ezr 1:1</a>f). Over 40,000 (<a onClick="return mV(\'Ezr\',1,\'1-\');">Ezr 1</a>; <a onClick="return mV(\'Ezr\',2,\'1-\');">2</a>) under Sheshbazzar, prince of Judah (<a onClick="return mV(\'Ezr\',1,8,11);">Ezr 1:8, 11</a>), governor of a province, returned, bringing with them the sacred vessels of the temple. The daily sacrifices were renewed and the feasts and fasts restored (<a onClick="return mV(\'Ezr\',3,\'3-7\');">Ezr 3:3-7</a>), and later the foundations of the restored temple were laid (<a onClick="return mV(\'Ezr\',3,10);">Ezr 3:10</a>; <a onClick="return mV(\'Ezr\',5,16);">5:16</a>), but on account of the opposition of the people of the land and the Samaritans, the building was not completed until 20 years later (<a onClick="return mV(\'Ezr\',6,15);">Ezr 6:15</a>).<P>23. Nehemiah Rebuilds the Walls:<P>The graphic description of the rebuilding of the walls of Jerusalem in 445 by Nehemiah gives us the fullest account we have of these fortifications at any ancient period. It is clear that Nehemiah set himself to restore the walls, as far as possible, in their condition before the exile. The work was done hurriedly and under conditions of danger, half the workers being armed with swords, spears and bows to protect the others, and every workman was a soldier (<a onClick="return mV(\'Neh\',4,13);">Ne 4:13</a>,<a onClick="return mV(\'Neh\',4,\'16-21\');">16-21</a>). The rebuilding took 52 days, but could not have been done at all had not much of the material lain to hand in the piles of ruined masonry. Doubtless the haste and limited resources resulted in a wall far weaker than that Nebuchadnezzar destroyed 142 years previously, but it followed the same outline and had the same general structure.<P>24. Bagohi Governor:<P>For the next 100 years we have scarcely any historical knowledge of Jerusalem. A glimpse is afforded by the papyri of Elephantine where we read of a Jewish community in Upper Egypt petitioning Bagohi, the governor of Judea, for permission to rebuild their own temple to Yahweh in Egypt; incidentally they mention that they had already sent an unsuccessful petition to Johanan the high priest and his colleagues in Jerusalem. In another document we gather that this petition to the Persian governor was granted. These documents must date about 411-407 BC. Later, probably about 350, we have somewhat ambiguous references to the destruction of Jerusalem and the captivity of numbers of Jews in the time of Artaxerxes (III) Ochus (358-337 BC).<P>With the battle of Issus and Alexander\'s Palestinian campaign (circa 332 BC), we are upon surer historical ground, though the details of the account (Ant., XI, viii, 4) of Alexander\'s visit to Jerusalem itself are considered of doubtful authenticity.<P>25. Alexander the Great:<P>After his death (323 BC), Palestine suffered much from its position, between the Ptolemies of Egypt and the Seleucids of Antioch. Each became in turn its suzerain, and indeed at one time the tribute appears to have been divided between them (Ant., XII, iv, 1).<P>26. The Ptolemaic Rule:<P>In 321 Ptolemy Soter invaded Palestine, and, it is said (Ant., XII, i, 1), captured Jerusalem by a ruse, entering the city on the Sabbath as if anxious to offer sacrifice. He carried away many of his Jewish prisoners to Egypt and settled them there. In the struggles between the contending monarchies, although Palestine suffered, the capital itself, on account of its isolated position, remained undisturbed, under the suzerainty of Egypt. In 217 BC, Ptolemy (IV) Philopator, after his victory over Antiochus III at Raphia, visited the temple at Jerusalem and offered sacrifices; he is reported (3Macc 1) to have entered the "Holy of Holies." The comparative prosperity of the city during the Egyptian domination is witnessed to by Hecataeus of Abdera, who is quoted by Jos; he even puts the population of the city at 120,000, which is probably an exaggeration.<P>27. Antiochus the Great:<P>At length in 198, Antiochus the Great having conquered Coele-Syria in the epoch-making battle at Banias, the Jews of their own accord went over to him and supplied his army with plentiful provisions; they assisted him in besieging the Egyptian garrison in the <a href="study/isbe/search.html?string=AKRA">AKRA</A> (which see) (Ant., XII, iii, 3). Josephus produces letters in which Antiochus records his gratification at the reception given him by the Jews and grants them various privileges (same place). We have an account of the prosperity of the city about this time (190-180 BC) by Jesus ben Sira in the Book of Ecclus; it is a city of crowded life and manifold activities. He refers in glowing terms to the great high priest, Simon ben Onias (226-199 BC), who (Ecclesiasticus 50:1-4) had repaired and fortified the temple and strengthened the walls against a siege. The letter of Aristeas, dated probably at the close of this great man\'s life (circa 200 BC), gives a similar picture. It is here stated that the compass of the city was 40 stadia. The very considerable prosperity and religious liberty which the Jews had enjoyed under the Egyptians were soon menaced under the new ruler; the taxes were increased, and very soon fidelity to the tenets of Judaism came to be regarded as treachery to the Seleucid rule.<P>28. Hellenization of the City under Antiochus Epiphanes:<P>Under Antiochus Epiphanes the Hellenization of the nation grew apace (2Macc 4:9-12; Ant, XII, v, 1); at the request of the Hellenizing party a "place of exercise" was erected in Jerusalem (1Macc 1:14; 2Macc 4:7f). The Gymnasium was built and was soon thronged by young priests; the Greek hat—the petasos—became the fashionable headdress in Jerusalem. The Hellenistic party, which was composed of the aristocracy, was so loud in its professed devotion to the king\'s wishes that it is not to be wondered at that Antiochus, who, on a visit to the city, had been received with rapturous greetings, came to think that the poor and pious who resisted him from religious motives were largely infected with leanings toward his enemies in Egypt. The actual open rupture began when tidings reached Antiochus, after a victorious though politically barren campaign in Egypt, that Jerusalem had risen in his rear on behalf of the house of Ptolemy. Jason, the renegade high priest, who had been hiding across the Jordan, had, on the false report of the death of Antiochus, suddenly returned and re-possessed himself of the city. Only the Akra remained to Syria, and this was crowded with Menelaus and those of his followers who had escaped the sword of Jason.<P>29. Capture of the City (170 BC):<P>Antiochus lost no time; he hastened (170 BC) against Jerusalem with a great army, captured the city, massacred the people and despoiled the temple (1Macc 1:20-24; Ant, XII, v, 3). Two years later Antiochus, balked by Rome in Egypt (Polyb. xxix. 27; Livy xlv. 12), appears to have determined that in Jerusalem, at any rate, he would have no sympathizers with Egypt.<P>30. Capture of 168 BC:<P>He sent his chief collector of tribute (1Macc 1:29), who attacked the city with strong force and, by means of stratagem, entered it (1Macc 1:30). After he had despoiled it, he set it on fire and pulled down both dwellings and walls. He massacred the men, and many of the women and children he sold as slaves (1Macc 1:31-35; 2Macc 5:24).<P>31. Attempted Suppression of Judaism:<P>He sacrificed swine (or at least a sow) upon the holy altar, and caused the high priest himself—a Greek in all his sympathies—to partake of the impure sacrificial feasts; he tried by barbarous cruelties to suppress the ritual of circumcision (Ant., XII, v, 4). In everything he endeavored, in conjunction with the strong Hellenizing party, to organize Jerusalem as a Greek city, and to secure his position he built a strong wall, and a great tower for the Akra, and, having furnished it well with armor and victuals, he left a strong garrison (1Macc 1:33-35). But the Syrians had overreached themselves this time, and the reaction against persecution and attempted religious suppression produced the great uprising of the Maccabeans.<P>32. The Maccabean Rebellion:<P>The defeat and retirement of the Syrian commander Lysias, followed by the death of Antiochus Epiphanes, led to an entire reversal of policy on the part of the Council of the boy-king, Antiochus V. A general amnesty was granted, with leave to restore the temple-worship in its ancestral forms. The following year (165 BC) Judas Maccabeus found "the sanctuary desolate, and the altar profaned, the gates burned up, and shrubs growing in the courts as in a forest...and the priests\' chambers pulled down" (1Macc 4:38).<P>33. The Dedication of the Temple (165 BC):<P>He at once saw to the reconstruction of the altar and restored the temple-services, an event celebrated ever after as the "Feast of the Dedication," or chanukkah (1Macc 4:52-59; 2Macc 10:1-11; Ant, XII, vii, 7; compare <a onClick="return mV(\'Jhn\',10,22);">Joh 10:22</a>). Judas also "builded up Mt. Zion," i.e. the temple-hill, making it a fortress with "high walls and strong towers round about," and set a garrison in it (1Macc 4:41-61).<P>34. Defeat of Judas and Capture of the City:<P>The Hellenizing party suffered in the reaction, and the Syrian garrison in the Akra, Syria\'s one hold on Judea, was closely invested, but though Judas had defeated three Syrian armies in the open, he could not expel this garrison. In 163 BC a great Syrian army, with a camel corps and many elephants, came to the relief of the hard-pressed garrison. Lysias, accompanied by the boy-king himself (Antiochus V), approached the city from the south via <a href="study/isbe/search.html?string=BETH-ZUR">BETH-ZUR</A> (which see). At Beth-zachariah the Jews were defeated, and Judas\' brother Eleazar was slain, and Jerusalem was soon captured. The fort on Mt. Zion which surrounded the sanctuary was surrendered by treaty, but when the king saw its strength he broke his oath and destroyed the fortifications (1Macc 6:62). But even in this desperate state Judas and his followers were saved. A certain pretender, Philip, raised a rebellion in a distant part of the empire, and Lysias was obliged to patch up a truce with the nationalist Jews more favorable to Judas than before his defeat; the garrison in the Akra remained, however, to remind the Jews that they were not independent. In 161 BC another Syrian general, Nicanor, was sent against Judas, but he was at first won over to friendship and when, later, at the instigation of the Hellenistic party, he was compelled to attack Judas, he did so with hastily raised levies and was defeated at Adasa, a little north of Jerusalem. Judas was, however, not long suffered to celebrate his triumph. A month later Bacchides appeared before Jerusalem, and in April, 161, Judas was slain in battle with him at Berea.<P>35. His Death (161 BC):<P>Both the city and the land were re-garrisoned by Syrians; nevertheless, by 152, Jonathan, Judas\' brother, who was residing at Michmash, was virtual ruler of the land, and by astute negotiation between Demetrius and Alexander, the rival claimants to the throne of Antioch, Jonathan gained more than any of his family had ever done. He was appointed high priest and strategos, or deputy for the king, in Judea. He repaired the city and restored the temple-fortress with squared stones (1Macc 10:10-11).<P>36. Jonathan\'s Restorations:<P>He made the walls higher and built up a great part of the eastern wall which had been destroyed and "repaired which was called Caphenatha" (1Macc 12:36-37; Ant, XIII, v, ii); he also made a great mound between the Akra and the city to isolate the Syrian garrison (same place) .<P>37. Surrender of City to Antiochus Sidetes (134 BC):<P>Simon, who succeeded Jonathan, finally captured the Akra in 139, and, according to Josephus (Ant., XIII, vi, 7), not only destroyed it, but partially leveled the very hill on which it stood (see, however, 1Macc 14:36,37). John Hyrcanus, 5 years later (134 BC), was besieged in Jerusalem by Antiochus Sidetes in the 4th year of his reign; during the siege the Syrian king raised 100 towers each 3 stories high against the northern wall—possibly these may subsequently have been used for the foundations of the second wall. Antiochus was finally bought off by the giving of hostages and by heavy tribute, which Hyrcanus is said to have obtained by opening the sepulcher of David. Nevertheless the king "broke down the fortifications that encompassed the city" (Ant., XIII, viii, 2-4).<P>38. Hasmonean Buildings:<P>During the more prosperous days of the Hasmonean rulers, several important buildings were erected. There was a great palace on the western (southwestern) hill overlooking the temple (Ant., XX, viii, 11), and connected with it at one time by means of a bridge across the Tyropeon, and on the northern side of the temple a citadel—which may (see VIII, 7 above) have been the successor of one here in pre-exilic times—known as the Baris; this, later on, Herod enlarged into the Antonia (Ant., XV, xi, 4; BJ, V, v, 8).<P>39. Rome\'s Intervention:<P>In consequence of the quarrel of the later Hasmonean princes, further troubles fell upon the city. In 65 BC, Hyrcanus II, under the instigation of Antipas the Idumean, rebelled against his brother Aristobulus, to whom he had recently surrendered his claim to sovereignty. With the assistance of Aretas, king of the Nabateans, he besieged Aristobulus in the temple. The Roman general Scaurus, however, by order of Pompey, compelled Aretas to retire, and then lent his assistance to Aristobulus, who overcame his brother (Ant., XIV, ii, 1-3). Two years later (63 BC) Pompey, having been met by the ambassadors of both parties, bearing presents, as well as of the Pharisees, came himself to compose the quarrel of the rival factions, and, being shut out of the city, took it by storm.<P>40. Pompey Takes the City by Storm:<P>He entered the "Holy of Holies," but left the temple treasures unharmed. The walls of the city were demolished; Hyrcanus II was reinstated high priest, but Aristobulus was carried a prisoner to Rome, and the city became tributary to the Roman Empire (Ant., XIV, iv, 1-4; BJ, I, vii, 1-7). The Syrian proconsul, M. Lucinius Crassus, going upon his expedition against the Parthians in 55 BC, carried off from the temple the money which Pompey had left (Ant., XIV, vii, 1).<P>41. Julius Caesar Appoints Antipater Procurator (47 BC):<P>In 47 BC Antipater, who for 10 years had been gaining power as a self-appointed adviser to the weak Hyrcanus, was made a Roman citizen and appointed procurator in return for very material services which he had been able to render to Julius Caesar in Egypt (Ant., XIV, viii,1,3, 5); at the same time Caesar granted to Hyrcanus permission to rebuild the walls of Jerusalem besides other privileges (Ant., XIV, x, 5). Antipater made his eldest son, Phaselus, governor of Jerusalem, and committed Galilee to the care of his able younger son, Herod.<P>42. Parthian Invasion:<P>In 40 BC Herod succeeded his father as procurator of Judea by order of the Roman Senate, but the same year the Parthians under Pacorus and Barzapharnes captured and plundered Jerusalem (Ant., XIV, xiii, 3,1) and re-established Antigonus (Jewish Wars, I, xiii, 13). Herod removed his family and treasures to Massada and, having been appointed king of Judea by Antony, returned, after various adventures, in 37 BC. Assisted by Sosius, the Roman proconsul, he took Jerusalem by storm after a 5 months siege; by the promise of liberal reward he restrained the soldiers from sacking the city (Ant., XIV, xvi, 2-3).<P>43. Reign of Herod the Great (37-4 BC):<P>During the reign of this great monarch Jerusalem assumed a magnificence surpassing that of all other ages. In 24 BC the king built his vast palace in the upper city on the southwestern hill, near where today are the Turkish barracks and the Armenian Quarter. He rebuilt the fortress to the north of the temple—the ancient Baris—on a great scale with 4 lofty corner towers, and renamed it the Antonia in honor of his patron. He celebrated games in a new theater, and constructed a hippodrome (Jewish Wars, II, iii, 1) or amphitheater (Antiquities, XV, viii, 1).<P>44. Herod\'s Great Buildings:<P>He must necessarily have strengthened and repaired the walls, but such work was outshone by the 4 great towers which he erected, Hippicus, Pharsel and Mariamne, near the present Jaffa Gate—the foundations of the first two Great are supposed to be incorporated in the present so-called "Tower of David"—and the lofty octagonal tower, Psephinus, farther to the northwest. The development of Herod\'s plans for the reconstruction of the temple was commenced in 19 BC, but they were not completed till 64 AD (<a onClick="return mV(\'Jhn\',2,20);">Joh 2:20</a>; <a onClick="return mV(\'Mat\',24,1,2);">Mt 24:1-2</a>; <a onClick="return mV(\'Luk\',21,5,6);">Lu 21:5-6</a>). The sanctuary itself was built by 1,000 specially trained priests within a space of 18 months (11-10 BC). The conception was magnificent, and resulted in a mass of buildings of size and beauty far surpassing anything that had stood there before. Practically all the remains of the foundations of the temple-enclosure now surviving in connection with the Charam belong to this period. In 4 BC—the year of the Nativity—occurred the disturbances following upon the destruction of the Golden Eagle which Herod had erected over the great gate of the temple, and shortly afterward Herod died, having previously shut up many of the leading Jews in the hippodrome with orders that they should be slain when he passed away (Jewish Wars, I, xxxiii, 6). The accession of Archelaus was signalized by Passover riots which ended in the death of 3,000, an after-result of the affair of the Golden Eagle.<P>45. Herod Archelaus (4 BC-6 AD):<P>Thinking that order had been restored, Archelaus set out for Rome to have his title confirmed. During his absence Sabinus, the Roman procurator, by mismanagement and greed, raised the city about his ears, and the next Passover was celebrated by a massacre, street fighting and open robbery. Varus, the governor of Syria, who had hastened to the help of his subordinate, suppressed the rebellion with ruthless severity and crucified 2,000 Jews. Archelaus returned shortly afterward as ethnarch, an office which he retained until his exile in 6 AD. During the procuratorship of Coponius (6-10 AD) another Passover riot occurred in consequence of the aggravating conduct of some Samaritans.<P>46. Pontius Pilate:<P>During the procuratorship of Pontius Pilate (26-37 AD) there were several disturbances, culminating in a riot consequent upon his taking some of the "corban" or sacred offerings of the temple for the construction of an aqueduct (Ant., XVIII, iii, 2)—probably part at least of the "lowlevel aqueduct" (see VII, 15, above). Herod Agrippa I enclosed the suburbs, which had grown up north of the second wall and of the temple, by what Josephus calls the "Third Wall" (see V, above).<P>47. King Agrippa:<P>His son, King Agrippa, built—about 56 AD—a large addition to the old Hasmonean palace, from which he could overlook the temple area. This act was a cause of offense to the Jews who built a wall on the western boundary of the Inner Court to shut off his view. In the quarrel which ensued the Jews were successful in gaining the support of Nero (Ant., XX, viii, 11). In 64 AD the long rebuilding of the temple-courts, which had been begun in 19 BC, was concluded. The 18,000 workmen thrown out of employment appear to have been given "unemployed work" in "paving the city with white stone" (Ant., XX, ix, 6-7).<P>48. Rising against Florus and Defeat of Gallus:<P>Finally the long-smoldering discontent of the Jews against the Romans burst forth into open rebellion under the criminal incompetence of Gessius Florus, 66 AD (Ant., XX, xi, 1). Palaces and public buildings were fired by the angered multitude, and after but two days\' siege, the Antonia itself was captured, set on fire and its garrison slain (Jewish Wars, II, xvii, 6-7). Cestius Gallus, hastening from Syria, was soon engaged in a siege of the city. The third wall was captured and the suburb <a href="study/isbe/search.html?string=BEZETHA">BEZETHA</a> (which see) burnt, but, when about to renew the attack upon the second wall, Gallus appears to have been seized with panic, and his partial withdrawal developed into an inglorious retreat in which he was pursued by the Jews down the pass to the Beth-horons as far as Antipatris (Jewish Wars, II, xix).<P>49. The City Besieged by Titus (70 AD):<P>This victory cost the Jews dearly in the long run, as it led to the campaign of Vespasian and the eventual crushing of all their national hopes. Vespasian commenced the conquest in the north, and advanced by slow and certain steps. Being recalled to Rome as emperor in the midst of the war, the work of besieging and capturing the city itself fell to his son Titus. None of the many calamities which had happened to the city are to be compared with this terrible siege. In none had the city been so magnificent, its fortifications so powerful, its population so crowded. It was Passover time, but, in addition to the crowds assembled for this event, vast numbers had hurried there, flying from the advancing Roman army. The loss of life was enormous; refugees to Titus gave 600,000 as the number dead (Jewish Wars, V, xiii, 7), but this seems incredible. The total population today within the walls cannot be more than 20,000, and the total population of modern Jerusalem, which covers a far greater area than that of those days, cannot at the most liberal estimate exceed 80,000. Three times this, or, say, a quarter of a million, seems to be the utmost that is credible, and many would place the numbers at far less.<P>50. Party Divisions within the Besieged Walls:<P>The siege commenced on the 14th of Nisan, 70 AD, and ended on the 8th of Elul, a total of 134 days. The city was distracted by internal feuds. Simon held the upper and lower cities; John of Gischala, the temple and "Ophel"; the Idumeans, introduced by the Zealots, fought only Walls for themselves, until they relieved the city of their terrors. Yet another party, too weak to make its counsels felt, was for peace with Rome, a policy which, if taken in time, would have found in Titus a spirit of reason and mercy. The miseries of the siege and the destruction of life and property were at least as much the work of the Jews themselves as of their conquerors. On the 15th day of the siege the third wall (Agrippa\'s), which had been but hastily finished upon the approach of the Romans, was captured; the second wall was finally taken on the 24th day; on the 72nd day the Antonia fell, and 12 days later the daily sacrifice ceased. On the 105th day—the ominous 9th of Ab—the temple and the lower city were burnt, and the last day found the whole city in flames.<P>51. Capture and Utter Destruction of the City:<P>Only the three great towers of Herod, Hippicus, Pharsel and Mariamne, with the western walls, were spared to protect the camp of the Xth Legion which was left to guard the site, and "in order to demonstrate to posterity what kind of city it was and how well fortified"; the rest of the city was dug up to its foundations (Jewish Wars, VII, i, 1).<P>52. Rebellion of Bar-Cochba:<P>For 60 years after its capture silence reigns over Jerusalem. We know that the site continued to be garrisoned, but it was not to any extent rebuilt. In 130 AD it was visited by Hadrian, who found but few buildings standing. Two years later (132-35 AD) occurred the last great rebellion of the Jews in the uprising of Bar-Cocha ("son of a star"), who was encouraged by the rabbi Akiba. With the suppression of this last effort for freedom by Julius Severus, the remaining traces of Judaism were stamped out, and it is even said (the Jerusalem Talmud, Ta\'anith 4) that the very site of the temple was plowed up by T. Annius Rufus; An altar of Jupiter was placed upon the temple-site, and Jews were excluded from Jerusalem on pain of death.<P>53. Hadrian Builds AElia Capitolina:<P>In 138 Hadrian rebuilt the city, giving it the name AElia Capitolina. The line of the southern wall of AElia was probably determined by the southern fortification of the great Roman legionary camp on the western (southwestern) hill, and it is probable that it was the general line of the existing southern wall. At any rate, we know that the area occupied by the coenaculum and the traditional "Tomb of David" was outside the walls in the 4th century. An equestrian statue of Hadrian was placed on the site of the "Holy of Holies" (Jerome, Commentary on <a onClick="return mV(\'Isa\',2,8);">Isa 2:8</a>; <a onClick="return mV(\'Mat\',24,15);">Mt 24:15</a>). An inscription now existing in the southern wall of the temple-area, in which occurs the name of Hadrian, may have belonged to this monument, while a stone head, discovered in the neighborhood of Jerusalem some 40 years ago, may have belonged to the statue. Either Hadrian himself, or one of the Antonine emperors, erected a temple of Venus on the northwestern hill, where subsequently was built the Church of the Holy Sepulchre (Euseb., Life of Constantine, III, 36). The habit of pilgrimage to the holy sites, which appears to have had its roots far back in the 2nd century (see Turner, Journal of Theological Studies, I,551,quoted by Sanday, Sacred Sites of the Gospels, 75-76), seems to have increasingly flourished in the next two centuries; beyond this we know little of the city.<P>54. Constantine Builds the Church of the Anastasis:<P>In 333 AD, by order of Constantine, the new church of the Anastasis, marking the supposed site of the Holy Sepulchre, was begun. The traditions regarding this site and the Holy Cross alleged to have been found there, are recorded some time after the events and are of doubtful veracity. The building must have been magnificent, and covered a considerably larger area than that of the existing church. In 362 Julian is said to have attempted to rebuild the temple, but the work was interrupted by an explosion. The story is doubtful.<P>At some uncertain date before 450 the coenaculum and "Church of the Holy Zion" were incorporated within the walls. This is the condition depicted in the Madeba Mosaic and also that described by Eucherius who, writing between 345-50 AD, states that the circuit of the walls "now receives within itself Mt. Zion, which was once outside, and which, lying on the southern side, overhangs the city like a citadel." It is possible this was the work of the emperor Valentinian who is known to have done some reconstruction of the walls.<P>55. The Empress Eudoxia Rebuilds the Walls:<P>In 450 the empress Eudoxia, the widow of Theodosius II, took up her residence in Jerusalem and rebuilt the walls upon their ancient lines, bringing the whole of the southwestern hill, as well as the Pool of Siloam, within the circuit (Evagarius, Hist. Eccles., I, 22). At any rate, this inclusion of the pool existed in the walls described by Antoninus Martyr in 560 AD, and it is confirmed by Bliss\'s work (see above VI, 4). She also built the church of Stephen, that at the Pool of Siloam and others.<P>56. Justinian:<P>The emperor Justinian, who was perhaps the greatest of the Christian builders, erected the great Church of Mary, the remains of which are now considered by some authorities to be incorporated in the el Aqsa Mosque; he built also a "Church of Sophia" in the "Pretorian," i.e. on the site of the Antonia (see, however, <a href="study/isbe/search.html?string=PRAETORIUM">PRAETORIUM</a>), and a hospital to the west of the temple. The site of the temple itself appears to have remained in ruins down to the 7th century.<P>57. Chosroes II Captures the City:<P>In 614 Palestine was conquered by the Persian Chosroes II, and the Jerusalem churches, including that of the Holy Sepulchre, were destroyed, an event which did much to prepare the way for the Moslem architects of half a century later, who freely used the columns of these ruined churches in the building of the "Dome of the Rock."<P>58. Heracleus Enters It in Triumph:<P>In 629 Heracleus, having meanwhile made peace with the successor of Chosroes II, reached Jerusalem in triumph, bearing back the captured fragment of the cross. He entered the city through the "Golden Gate," which indeed is believed by many to have reached its present form through his restorations. The triumph of Christendom was but short. Seven years earlier had occurred the historic flight of Mohammed from Mecca (the Hegira), and in 637 the victorious followers of the Prophet appeared in the Holy City. After a short siege, it capitulated, but the khalif Omar treated the Christians with generous mercy.<P>59. Clemency of Omar:<P>The Christian sites were spared, but upon the temple-site, which up to this had apparently been occupied by no important Christian building but was of peculiar sanctity to the Moslems through Mohammed\'s alleged visions there, a wooden mosque was erected, capable of accommodating 3,000 worshippers. This was replaced in 691 AD by the magnificent Kubbet es Sakah], or "Dome of the Rock," built by \'Abd\'ul Malek, the 10th khalif. For some centuries the relations of the Christians and Moslems appear to have been friendly: the historian el Muqaddasi, writing in 985, describes the Christians and Jews as having the upper hand in Jerusalem. In 969 Palestine passed into the power of the Egyptian dynasty, and in 1010 her ruler, the mad Hakim, burnt many of the churches, which, however, were restored in a poor way.<P>60. The Seljuk Turks and Their Cruelties:<P>In 1077 Isar el Atsis, a leader of the Seljuk Turks conquered Palestine from the north, drove out the Egyptians and massacred 3,000 of the inhabitants of Jerusalem. The cruelty of the Turks—in contrast, be it noted, with the conduct of the Arab Moslems—was the immediate cause of the Crusades. In 1098 the city was retaken by the Egyptian Arabs, and the following year was again captured after a 40 days\' seige by the soldiers of the First Crusade, and Godfrey de Bouillon became the first king. Great building activity marked the next 80 peaceful years of Latin rule: numbers of churches were built, but, until toward the end of this period, the walls were neglected.<P>61. Crusaders Capture the City in 1099:<P>In 1177 they were repaired, but 10 years later failed to resist the arms of the victorious Saladin. The city surrendered, but City the inhabitants were spared. In 1192 Saladin repaired the walls, but in 1219 they were dismantled by orders of the sultan of Damascus. In 1229 the emperor Frederick II of Germany obtained the Holy City by treaty, on condition that he did not restore the fortifications, a stipulation which, being broken by the inhabitants 10 years later, brought down upon them the vengeance of the emir of Kerak. Nevertheless, in 1243 the city was again restored to the Christians unconditionally.<P>62. The Kharizimians:<P>The following year, however, the Kharizimian Tartars—a wild, savage horde from Central Asia—burst into Palestine, carrying destruction before them; they seized Jerusalem, massacred the people, and rifled the tombs of the Latin kings. Three years later they were ejected from Palestine by the Egyptians who in their turn retained it until, in 1517, they were conquered by the Ottoman Turks, who still hold it. The greatest of their sultans, Suleiman the Magnificent, built the present walls in 1542.<P>63. Ottoman Turks Obtain the City (1517 AD):<P>In 1832 Mohammed Ali with his Egyptian forces came and captured the city, but 2 years later the fellahin rose against his rule and for a time actually gained possession of the city, except the citadel, making their entrance through the main drain. The besieged citadel was relieved by the arrival of Ibrahim Pasha from Egypt with reinforcements. The city and land were restored to the Ottoman Turks by the Great Powers in 1840.<P>X. Modern Jerusalem.<P>1. Jews and "Zionism":<P>The modern city of Jerusalem has about 75,000 inhabitants, of whom over two-thirds are Jews. Until about 50 years ago the city was confined within its 16th-century walls, the doors of its gates locked every night, and even here there were considerable areas unoccupied. Since then, and particularly during the last 25 years, there has been a rapid growth of suburbs to the north, northwest, and west of the old city. This has been largely due to the steady stream of immigrant Jews from every part of the world, particularly from Russia, Romania, Yemin, Persia, Bokhara, the Caucasus, and from all parts of the Turkish empire. This influx of Jews, a large proportion of whom are extremely poor, has led to settlements or "colonies" of various classes of Jews being erected all over the plateau to the north—an area never built upon before—but also on other sides of the city. With the exception of the Bokhara Colony, which has some fine buildings and occupies a lofty and salubrious situation, most of the settlements are mean cottages or ugly almshouses. With the exception of a couple of hospitals, there is no Jewish public building of any architectural pretensions. The "Zionist" movement, which has drawn so many Jews to Jerusalem, cannot be called a success, as far as this city is concerned, as the settlers and their children as a rule either steadily deteriorate physically and morally—from constant attacks of malaria, combined with pauperism and want of work—or, in the case of the energetic and enlightened, they emigrate—to America especially; this emigration has been much stimulated of late by the new law whereby Jews and Christians must now, like Moslems, do military service.<P>The foreign Christian population represents all nations and all sects; the Roman church is rapidly surpassing all other sects or religions in the importance of their buildings. The Russians are well represented by their extensive enclosure, which includes a large cathedral, a hospital, extensive hospice in several blocks, and a handsome residence for the consul-general, and by the churches and other buildings on the Mount of Olives. The Germans have a successful colony belonging to the "Temple" sect to the west of Jerusalem near the railway station, and are worthily represented by several handsome buildings, e.g. the Protestant "Church of the Redeemer," built on the site and on the ground plan of a fine church belonging to the Knights of John, the new (Roman Catholic) Church of the Dormition on "Mount Zion," with an adjoining Benedictine convent, a very handsome Roman Catholic hospice outside the Damascus Gate, the Kaiserin Augusta Victoria Sanatorium on the Mount of Olives, and a Protestant Johanniter Hospice in the city, a large general hospital and a leper hospital, a consulate and two large schools. In influence, both secular and religious, the Germans have rapidly gained ground in the last 2 decades. British influence has much diminished, relatively.<P>2. Christian Buildings and Institutions:<P>The British Ophthalmic Hospital, belonging to the "Order of the Knights of John," the English Mission Hospital, belonging to the London Jews Society, the Bishop Gobat\'s School and English College connected with the Church Missionary Society, 3 Anglican churches, of which the handsome George\'s Collegiate Church adjoins the residence of the Anglican bishop, and a few small schools comprise the extent of public buildings connected with British societies. France and the Roman Catholic church are worthily represented by the Dominican monastery and seminary connected with the handsome church of Stephen—rebuilt on the plan of an old Christian church—by the Ratisbon (Jesuit) Schools, the Hospital of Louis, the hospice and Church of Augustine, and the monastery and seminary of the "white fathers" or Freres de la mission algerienne, whose headquarters center round the beautifully restored Church of Anne. Not far from here are the convent and school of the Saeurs de Sion, at the Ecce Homo Church. Also inside the walls near the New Gate is the residence of the Latin Patriarch—a cardinal of the Church of Rome—with a church, the school of the Freres de la doctrine chretienne, and the schools, hospital and convent of the Franciscans, who are recognized among their co-religionists as the "parish priests" in the city, having been established there longer than the numerous other orders.<P>All the various nationalities are under their respective consuls and enjoy extra-territorial rights. Besides the Turkish post-office, which is very inefficiently managed, the Austrians, Germans, French, Russians and Italians all have post-offices open to all, with special "Levant" stamps. The American mail is delivered at the French post-office. There are four chief banks, French, German, Ottoman and Anglo-Palestinian (Jewish). As may be supposed, on account of the demand for land for Jewish settlements or for Christian schools or convents, the price of such property has risen enormously. Unfortunately in recent years all owners of land—and Moslems have not been slow to copy the foreigners—have taken to enclosing their property with high and unsightly walls, greatly spoiling both the walks around the city and the prospects from many points of view. The increased development of carriage traffic has led to considerable dust in the dry season, and mud in winter, as the roads are metaled with very soft limestone. The Jerus-Jaffa Railway (a French company), 54 miles long, which was opened in 1892, has steadily increased its traffic year by year, and is now a very paying concern. There is no real municipal water-supply, and no public sewers for the new suburbs—though the old city is drained by a leaking, ill-constructed medieval sewer, which opens just below the Jewish settlement in the Kidron and runs down the Wady en Nauru. A water-supply, new Sewers, electric trams and electric lights for the streets, are all much-talked-of improvements. There are numerous hotels, besides extensive accommodations in the religious hospices, and no less than 15 hospitals and asylums.<P>LITERATURE.<P>This is enormous, but of very unequal value and much of it out of date. For all purposes the best book of reference is Jerusalem from the Earliest Times to AD 70, 2 volumes, by Principal G.A. Smith. It contains references to all the literature. To this book and to its author it is impossible for the present writer adequately to express his indebtedness, and no attempt at acknowledgment in detail has been made in this article. In supplement of the above, Jerusalem, by Dr. Selah Merrill, and Jerusalem in Bible Times, by Professor Lewis B. Paton, will be found useful. The latter is a condensed account, especially valuable for its illustrations and its copious references. Of the articles in the recent Bible Dictionaries on Jerusalem, that by Conder in HDB is perhaps the most valuable. Of guide-books, Baedeker\'s Guide to Palestine and Syria (1911), by Socin and Benzinger, and Barnabe Meistermann\'s (R.C.) New Guide to the Holy Land (1909), will be found useful; also Hanauer\'s Walks about Jerusalem.<P>On Geology, Climate and Water-Supply:<P>Hull\'s "Memoir on Physical Geography and Geology of Arabian Petrea, Palestine, and Adjoining Districts," PEF; and Blankenhorn," Geology of the Nearer Environs of Jerusalem," ZDPV, 1905; Chaplin, "Climate of Jerusalem," PEFS, 1883; Glaisher, "Meteorol. Observations in Palestine," special pamphlet of the Palestine Exploration Fund; Hilderscheid, "Die Niederschlagsverhaltnisse Palestine in alter u. neuer Zeit," ZDPV (1902); Huntington, Palestine and Its Transformation (1911); Andrew Watt, "Climate in Hebron," etc., Journal of the Scottish Meteorological Society (1900-11); Schick, "Die Wasserversorgung der Stadt Jerusalem," ZDPV, 1878; Wilson "Water Supply of Jerusalem," Proceedings of the Victoria Institute, 1906; Masterman, in Biblical World, 1905.<P>On Archaeology and Topography:<P>PEF, volume on Jerusalem, with accompanying maps and plans; Clermont-Ganneau, Archaeological Researches, I, 1899 (PEF); William, Holy City (1849); Robinson, Biblical Researches (1856); Wilson, Recovery of Jerusalem (1871); Warren Underground Jerusalem (1876); Vincent, Underground Jerusalem (1911); Guthe, "Ausgrabungen in Jerusalem," ZDPV, V; Bliss and Dickie, Excavations in Jerusalem (1894-97); Sanday, Sacred Sites of the Gospels (1903); Mitchell, "The Wall of Jerusalem according to the Book of Nehemiah," JBL (1903); Wilson, Golgotha and the Holy Sepulchre (1906); Kuemmel, Materialien z. Topographie des alten Jerusalem; also numerous reports in the PEFS; Zeitschrift des deutschen Palestine Vereins; and the Revue biblique.<P>On History:<P>Besides Bible, Apocrypha, works of Josephus, and History of Tacitus: Besant and Palmer, History of Jerusalem; Conder, Judas Maccabeus and Latin Kingdom of Jerusalem; Le Strange, Palestine under the Moslems (1890); C.F. Kent, Biblical Geography and History (1911). Bevan, Jerusalem under the High-Priests; Watson, The Story of Jerusalem.``117';
isbe[4994]='Jerusalem, New`(Hierousalem kaine): This name occurs in <a onClick="return mV(\'Rev\',21,2);">Re 21:2</a> (<a onClick="return mV(\'Rev\',21,10);">21:10</a>, "holy city"). The conception is based on prophecies which predict a glorious future to Jerusalem after the judgment (<a onClick="return mV(\'Isa\',52,1);">Isa 52:1</a>). In Revelation, however, it is not descriptive of any actual locality on earth, but allegorically depicts the final state of the church ("the bride," "the wife of the Lamb," <a onClick="return mV(\'Rev\',21,2,9);">Re 21:2, 9</a>), when the new heaven and the new earth shall have come into being. The picture is drawn from a twofold point of view: the new Jerusalem is a restoration of Paradise (<a onClick="return mV(\'Rev\',21,6);">Re 21:6</a>; <a onClick="return mV(\'Rev\',22,1,2,14);">22:1-2,14</a>); it is also the ideal of theocracy realized (<a onClick="return mV(\'Rev\',21,3,12,14,22);">Re 21:3,12,14,22</a>). The latter viewpoint explains the peculiar representation that the city descends "out of heaven from God" (<a onClick="return mV(\'Rev\',21,2,10);">Re 21:2, 10</a>), which characterizes it as, on the one hand, a product of God\'s supernatural workmanship, and as, on the other hand, the culmination of the historic process of redemption. In other New Testament passages, where theocratic point of view is less prominent, the antitypical Jerusalem appears as having its seat in heaven instead of, as here, coming down from heaven to earth (compare <a onClick="return mV(\'Gal\',4,26);">Ga 4:26</a>; <a onClick="return mV(\'Hbr\',11,10);">Heb 11:10</a>; <a onClick="return mV(\'Hbr\',12,22);">12:22</a>).`<a href="./study/isbe/search.html?string=REVELATION+OF+JOHN">REVELATION OF JOHN</a>`182';
isbe[4995]='Jerusha`je-roo\'-sha (yerusha\', "taken possession of," i.e. "married"): In <a onClick="return mV(\'2Ki\',15,33);">2Ki 15:33</a> = "Jerushah" (yerushah, same meaning) of <a onClick="return mV(\'2Ch\',27,1);">2Ch 27:1</a>, the mother of King Jotham of Judah. Zadok was her father\'s name; he may be the priest of <a onClick="return mV(\'1Ch\',6,12);">1Ch 6:12 (Hebrew 5:38)</a>.``1';
isbe[4996]='Jeshaiah`je-sha\'-ya, je-shi\'-a<P>(a) yesha\'yahu;<P>(b) yesha\'yah, "deliverance of Yah"; (2) (3) below have form (a), the others form (b):<P>(1) Son of Hananiah, and grandson of Zerubbabel, according to <a onClick="return mV(\'1Ch\',3,21);">1Ch 3:21</a>, the King James Version "Jesaiah."<P>But commentators follow Hebrew (and the Revised Version margin) in the first part of the verse, and Septuagint, Vulgate, Syriac in the second part, thus reading, "And the son of Hananiah (was) Pelatiah, and Jeshaiah (was) his son, and Arnan his son," etc., thus making Jeshaiah a grandson of Hananiah.<P>(2) A "son" of Jeduthun, and like him a temple musician; head of the family of that name (<a onClick="return mV(\'1Ch\',25,3,15);">1Ch 25:3, 15</a>).<P>(3) A Levite, ancestor of Shelemoth, one of David\'s treasurers (<a onClick="return mV(\'1Ch\',26,25);">1Ch 26:25</a>).<P>(4) A descendant of Elam; he went with Ezra from Babylon to Jerusalem (<a onClick="return mV(\'Ezr\',8,7);">Ezr 8:7</a>) = "Jesias" (Revised Version), "Josias" (the King James Version), 1Esdras 8:33.<P>(5) A descendant of Merari and a contemporary of Ezra (<a onClick="return mV(\'Ezr\',8,19);">Ezr 8:19</a>) = "Osaias" of 1Esdras 8:48.<P>(6) A Benjamite (<a onClick="return mV(\'Neh\',11,7);">Ne 11:7</a>), the King James Version "Jesaiah."``149';
isbe[4997]='Jeshanah`jesh\'-a-na, je-sha\'-na (yeshanah): A town named with Bethel and Ephron among the places taken by Abijah from Jeroboam (<a onClick="return mV(\'2Ch\',13,19);">2Ch 13:19</a>). Most scholars are agreed that the same name should be read instead of ha-shen, in <a onClick="return mV(\'1Sa\',7,12);">1Sa 7:12</a>. It is probably identical with the Isanas, of Josephus (Ant., XIV, xv, 12). It is represented by the modern \'Ain Sinia, 3 1/4 miles north of Bethel, with a spring and interesting ancient remains.``1';
isbe[4998]='Jesharelah`jesh-a-re\'-la (yesar\'elah, meaning doubtful): One of the (or probably a family of) Levitical musicians (<a onClick="return mV(\'1Ch\',25,14);">1Ch 25:14</a>), called "Asharelah" in verse <a onClick="return mV(\'1Ch\',25,2);">2</a>. The names should be written "Asarelah" and "Jesarelah."``1';
isbe[4999]='Jeshebeab`je-sheb\'-e-ab (yeshebh\'abh, meaning uncertain): A Levite of the 14th course (<a onClick="return mV(\'1Ch\',24,13);">1Ch 24:13</a>). Kittel and Gray (HPN, 24) read with Septuagint, A, "Ishbaal"; the name is omitted in Septuagint (Codex Vaticanus) and the change in Massoretic Text as well as the omission in Septuagint may be due to the word ba\'al forming part of the name.`<a href="./study/isbe/search.html?string=JERUBBESHETH">JERUBBESHETH</a>`1';
isbe[5000]='Jesher`je\'-sher (yesher, or yesher, "uprightness"): A son of Caleb (<a onClick="return mV(\'1Ch\',2,18);">1Ch 2:18</a>).``1';
