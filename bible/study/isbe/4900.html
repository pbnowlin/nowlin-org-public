mV(\'2Ch\',17,5);">2Ch 17:5</a>).<P>2. His System of Public Instruction:<P>Believing that religion and morals, the civilization, suffer from ignorance, Jehoshaphat introduced a system of public instruction for the whole land (<a onClick="return mV(\'2Ch\',17,7);">2Ch 17:7</a>). He appointed a commission, composed of princes, Levites and priests, to go from city to city to instruct the people. Their instruction was to be based on the one true foundation of sound morals and healthy religious life, "the book of the law of Yahweh" (<a onClick="return mV(\'2Ch\',17,\'7-9\');">2Ch 17:7-9</a>).<P>3. His Judicial Institutions:<P>Next in importance to Jehoshaphat\'s system of public instruction, was his provision for the better administration of justice. He appointed judges to preside over courts of common pleas, which he established in all the fortified cities of Judah. In addition to these local courts, two courts of appeal, an ecclesiastical and a civil court, were established at Jerusalem to be presided over by priests, Levites, and leading nobles as judges. At the head of the ecclesiastical court of appeal was the high priest, and a layman, "the ruler of the house of Judah," headed the civil court of appeal (<a onClick="return mV(\'2Ch\',19,\'4-11\');">2Ch 19:4-11</a>). The insistence that a judge was to be in character like Yahweh, with whom there is "no iniquity...nor respect of persons, nor taking of bribes" (<a onClick="return mV(\'2Ch\',19,7);">2Ch 19:7</a>), is worthy of note.<P>4. His Military Defenses:<P>According to <a onClick="return mV(\'2Ch\',17,2);">2Ch 17:2</a>, Jehoshaphat began his reign with defensive measures against Israel. Furthermore, he built castles and cities of store in the land of Judah, "and he had many works," probably military supplies, "in the cities of Judah" (<a onClick="return mV(\'2Ch\',17,3);">17:13</A>). He appears to have had a large standing army, including cavalry (<a onClick="return mV(\'1Ki\',22,4);">1Ki 22:4</a>; <a onClick="return mV(\'2Ch\',17,14);">2Ch 17:14</a>). However, the numbers in <a onClick="return mV(\'2Ch\',17,14);">2Ch 17:14</a>ff seem to be impossibly high.<P>5. His Foreign Policy:<P>Godliness and security at home were followed by respect and peace abroad. The fact that the Philistines and the Arabians brought tribute (<a onClick="return mV(\'2Ch\',17,11);">2Ch 17:11</a>), and that Edom had no king (<a onClick="return mV(\'1Ki\',22,47);">1Ki 22:47</a>), but a deputy instead, who possibly was appointed by Jehoshaphat, would indicate that he held the suzerainty over the nations and tribes bordering Judah on the south and west Holding the suzerainty over the weaker nations, and being allied with the stronger, Jehoshaphat secured the peace for the greater part of his reign (<a onClick="return mV(\'1Ch\',17,10);">1Ch 17:10</a>) that fostered the internal development of the kingdom.<P>6. His Alliance with Ahab:<P>In contrast to the former kings of Judah, Jehoshaphat saw greater benefit in an alliance with Israel than in civil war. Accordingly, the old feud between the two kingdoms (<a onClick="return mV(\'1Ki\',14,30);">1Ki 14:30</a>; <a onClick="return mV(\'1Ki\',15,6);">15:6</a>) was dropped, and Jehoshaphat made peace with Israel (<a onClick="return mV(\'1Ki\',22,44);">1Ki 22:44</a>). The political union was cemented by the marriage of Jehoram, son of Jehoshaphat, to Athaliah, daughter of Ahab and Jezebel. Shortly after the marriage, Jehoshaphat joined Ahab in a campaign against Syria (<a onClick="return mV(\'2Ch\',18,\'1-3\');">2Ch 18:1-3</a>). In view of the subordinate position that Jehoshaphat seems to take in the campaign (<a onClick="return mV(\'1Ki\',22,4,30);">1Ki 22:4,30</a>), and in view of the military service rendered to Jehoram (<a onClick="return mV(\'2Ki\',3,4);">2Ki 3:4</a>), Judah seems to have become a dependency of Israel. Nevertheless, the union may have contributed to the welfare and prospity of Judah, and it may have enabled Jehoshaphat to hold the suzerainty over the neighboring nations. However, the final outcome of the alliance with the house of Omri was disastrous for Judah. The introduction into Judah of Baalism more than counterbalanced any political and material advantage gained, and in the succeeding reigns it indirectly led to the almost total extinction of the royal family of Judah (<a onClick="return mV(\'2Ki\',11,1);">2Ki 11:1</a>).<P>7. His Alliance with Jehoram:<P>In spite of the denunciation of the prophet Jehu for his expedition with Ahab, thus "help(ing) the wicked" (<a onClick="return mV(\'2Ch\',19,2);">2Ch 19:2</a>), Jehoshaphat entered into a similar alliance with Jehoram of Israel (<a onClick="return mV(\'2Ki\',3,4);">2Ki 3:4</a>). On the invitation of Jehoram to join him in an expedition against Moab, Jehoshaphat was ready with the same set speech of acceptance as in the case of Ahab (<a onClick="return mV(\'2Ki\',3,7);">2Ki 3:7</a>; compare <a onClick="return mV(\'1Ki\',22,4);">1Ki 22:4</a>). For the details of the expedition see <a href="study/isbe/search.html?string=JEHORAM">JEHORAM, (1)</A>.<P>8. Victory over the Moabites and Ammonites:<P>The Chronicler has given us a very remarkable account of a victory gained by Jehoshaphat over the Moabites and Ammonites. No doubt he made use of a current historical Midrash. Many find the historical basis of the Midrash in the events recorded in <a onClick="return mV(\'2Ki\',3,4);">2Ki 3:4</a>ff. However, the localities are different, and there a defeat is recorded, while in this case we have a victory. The story in outline bears the stamp of probability. <a onClick="return mV(\'1Ki\',22,45);">1Ki 22:45</a> seems to suggest wars of Jehoshaphat that are not mentioned in Kings. The tribes mentioned in the account are represented as trying to make permanent settlement in Judah (<a onClick="return mV(\'2Ch\',20,11);">2Ch 20:11</a>). In their advance through the south of Judah, they were doubtless harassed by the shepherd population of the country. Jehoshaphat, according to his custom, sought the help of Yahweh. The invading forces fell to quarreling among themselves (<a onClick="return mV(\'2Ch\',20,23);">2Ch 20:23</a>), and destroyed one another. The spoil was great because the invaders had brought all their goods with them, expecting to remain in the land.<P>9. Destruction of Jehoshaphat\'s Fleet:<P>The destruction of Jehoshaphat\'s fleet is recorded in <a onClick="return mV(\'1Ki\',22,48,49);">1Ki 22:48-49</a> and in <a onClick="return mV(\'2Ch\',20,\'35-37\');">2Ch 20:35-37</a>. However, the two accounts are quite different. According to Kings, Jehoshaphat built ships of Tarshish to sail to Ophir for gold, but the vessels were wrecked at zion-geber. Thereupon Ahaziah offered to assist Jehoshaphat with seamen, but Jehoshaphat refused to enter into the alliance. According to Chronicles the alliance had been formed, and together they built ships at Ezion-geber, which were destroyed because Jehoshaphat had made an alliance with the wicked king of Israel. In view of Jehoshaphat\'s other alliances, the Chronicler may be in the right. Chronicles, however, misunderstood the term "ships of Tarshish."<P>10. His Death:<P>Jehoshaphat died at the age of 60. Josephus says (Ant., IX, iii, 2) that he was buried in a magnificent manner, for he had imitated the actions of David. The kingdom was left to Jehoram, who inaugurated the beginning of his reign by causing the massacre of his brethren.``125';
isbe[4933]='Jehoshaphat, Valley of`(\'emeq yehoshaphat); the latter word means "Yahweh judgeth," and \'emeq, "wide," "open valley"; Septuagint he koilas Iosaphat): The name is used in <a onClick="return mV(\'Joe\',3,2,12);">Joe 3:2,12</a> of the scene of Judgment: "Let the nations bestir themselves, and come up to the valley of Jehoshaphat; for there will I sit to judge all the nations round about" (<a onClick="return mV(\'Joe\',3,12);">Joe 3:12</a>). "The valley of decision" (or "sharp judgment") is another name the prophet gives to this spot (<a onClick="return mV(\'Joe\',3,14);">Joe 3:14</a>). Some have identified it with the valley (\'emeq) of <a href="study/isbe/search.html?string=BERACAH">BERACAH</a> (which see) of <a onClick="return mV(\'2Ch\',20,26);">2Ch 20:26</a>, where King Jehoshaphat obtained a great victory, but this is improbable.<P>Since the 4th century AD the <a href="study/isbe/search.html?string=KIDRON">KIDRON</a> (which see) valley has been named the Valley of Jehoshaphat. The tradition is now strongest among the Moslems who point out the exact scene of the Judgment; the Bridge As Sirat, dividing heaven and hell, is to stretch across this valley from the Charam area to the Mount of Olives. It is, however, the ambition of every pious Jew to be buried on the slopes of this valley, to be at hand at the resurrection. This, too, was an ordinary place for Jewish graves in preexilic times (<a onClick="return mV(\'2Ki\',23,6);">2Ki 23:6</a>, etc.). The valley today, especially that part adjacent to the temple, is crowded with Moslem and Jewish graves. A worthless tradition indicates the tomb of Jehoshaphat himself close to the so-called "Pillar of Absalom." See <a href="study/isbe/search.html?string=KING\'S+VALE">KING\'S VALE</A>. There is not the slightest reason for believing that this is the spot referred to by Joel—indeed he may have spoken of an ideal spot only. The valley of the Kidron is a nachal ("ravine"), not an \'emeq ("broad valley"). It is impos sible not to suspect that there is some connection between the name Jehoshaphat and the name of a village near the head of this valley—Shaphat; perhaps at one time it was Wady Shaphat, which name would readily suggest the traditional one.`<a href="./study/isbe/search.html?string=GEHENNA">GEHENNA</a>`117';
isbe[4934]='Jehosheba`je-hosh\'-e-ba, je-ho-she\'-ba (yehoshebha\', "Yahweh is an oath"): Called "Jehoshabeath" in <a onClick="return mV(\'2Ch\',22,11);">2Ch 22:11</a>; daughter of Jehoram king of Judah, possibly by a wife other than Athaliah (<a onClick="return mV(\'2Ki\',11,2);">2Ki 11:2</a>). According to <a onClick="return mV(\'2Ch\',22,11);">2Ch 22:11</a>, she was the wife of Jehoiada, the priest. She hid Jehoash, the young son of King Ahaziah, and so saved his life from Queen Athaliah.``1';
isbe[4935]='Jehoshua`je-hosh\'-u-a (yehoshua\', "Yahweh is deliverance," or "is opulence"): The usual Hebrew form of the name "Joshua"; it occurs in the King James Version of <a onClick="return mV(\'Num\',13,16);">Nu 13:16</a> (the American Standard Revised Version "Hoshea"); and in some editions of the King James Version in <a onClick="return mV(\'1Ch\',7,27);">1Ch 7:27</a>, where others have the form "Jehoshuah" (h being wrongly added at the end).`<a href="./study/isbe/search.html?string=JOSHUA+(1)">JOSHUA</a>`1';
isbe[4936]='Jehovah`je-ho\'-va, je-ho\'-va.`<a href="./study/isbe/search.html?string=GOD,+NAMES+OF">GOD, NAMES OF</a>`1';
isbe[4937]='Jehovah, Servant of``<a href="./study/isbe/search.html?string=SERVANT+OF+JEHOVAH">SERVANT OF JEHOVAH</a>`1';
isbe[4938]='Jehovah-Jireh`je-ho\'-va-ji\'-re (yahweh yir\'-eh, "Yahweh sees"): The name given by Abraham to the place where he had sacrificed a ram provided by God, instead of his son Isaac (<a onClick="return mV(\'Gen\',22,14);">Ge 22:14</a>). The meaning plainly is that the Lord sees and provides for the necessities of His servants. There is an allusion to <a onClick="return mV(\'Gen\',22,8);">Ge 22:8</a> where Abraham says, "God will provide himself (the Revised Version, margin "will see for himself") the lamb for a burnt offering." The verse (<a onClick="return mV(\'Gen\',22,14);">22:14</A> the King James Version) goes on to connect the incident with the popular proverb, "In the mount of the Lord it shall be seen" (the Revised Version (British and American) "provided"), the Revised Version margin suggests "he shall be seen." "The mount of Yahweh" in other places denotes the temple hill at Jerusalem (<a onClick="return mV(\'Psa\',24,3);">Ps 24:3</a>; <a onClick="return mV(\'Isa\',2,3);">Isa 2:3</a>, etc.). With changes of the punctuation very different readings have been suggested. According to Swete\'s text: "And Abraham called the name of that place (the) \'Lord saw\' (aorist) in order that they may say today: \'In the mountain (the) Lord was seen\'"(aorist). Septuagint reads, "In the mountain Yahweh seeth," or "will see." If there is merely a verbal connection between the clauses we should most naturally read, "In the mount of Yahweh one is seen (appears)," i.e. men, people, appear—the reference being to the custom of visiting the temple at pilgrimages (Driver, HDB, under the word). But if the connection of the proverb with the name "Yahweh-jireh" depends on the double sense of the word "see," then the best explanation may be, Yahweh sees the needs of those who come to worship before Him on Zion, and there "is seen," i.e. reveals Himself to them by answering their prayers and supplying their wants. His "seeing," in other words, takes practical effect in a "being seen" (ibid.).``54';
isbe[4939]='Jehovah-Nissi`je-ho\'-va nis\'-i (yahweh nicci, "Yahweh is my banner"): So Moses named the altar which he reared to signalize the defeat of the Amalekites by Israel under Joshua, at Rephidim (<a onClick="return mV(\'Exd\',17,15);">Ex 17:15</a>). Septuagint translates "the Lord my refuge," deriving nicci from nuc, "to flee." Targum Onkelos reads, "Moses built an altar and worshipped on it before Yahweh, who had wrought for him miracles" (niccin). The suggestion is that the people should rally round God as an army gathers round its standard. He it is who leads them to victory.``1';
isbe[4940]='Jehovah-Shalom`je-ho\'-va sha\'-lom (yahweb shalom, "Yahweh is peace"): This was the name given by Gideon to the altar he built at Ophra, in allusion to the word spoken to him by the Lord, "Peace be unto thee" (<a onClick="return mV(\'Jdg\',6,24);">Jud 6:24</a>). It is equivalent to "Yahweh is well disposed."``1';
isbe[4941]='Jehovah-Shammah`je-ho\'-va sham\'-a (yahweh shammah, "Yahweh is there"): The name to be given to the new Jerusalem, restored and glorified, as seen in the vision of Ezekiel (<a onClick="return mV(\'Eze\',48,35);">48:35</A> margin; compare <a onClick="return mV(\'Rev\',21,3);">Re 21:3</a>). Yahweh returns to the temple which He had forsaken, and from that time forward the fact of supreme importance is that He is there, dwelling in the midst of His people.``1';
isbe[4942]='Jehovah-Tsidkenu (Tsidkenu)`je-ho\'-va tsid-ke\'-nu, tsid\'-ke-nu (yahweh tsidhqenu, "Yahweh (is) our righteousness"): The symbolic name given<P>(1) to the king who is to reign over the restored Israel (<a onClick="return mV(\'Jer\',23,6);">Jer 23:6</a>);<P>(2) to the state or capital (<a onClick="return mV(\'Jer\',33,16);">Jer 33:16</a>).``1';
isbe[4943]='Jehozabad`je-hoz\'-a-bad (yehozabhadh, "Yahweh has bestowed"):<P>(1) A servant of King Jehoash of Judah. According to <a onClick="return mV(\'2Ki\',12,21);">2Ki 12:21 (Hebrew 22)</a>, he was a son of Shomer, but <a onClick="return mV(\'2Ch\',24,26);">2Ch 24:26</a> makes him "son of Shimrith the Moabitess."<P>(2) A Korahite doorkeeper, son of Obed-edom (<a onClick="return mV(\'1Ch\',26,4);">1Ch 26:4</a>).<P>(3) A Benjamite, one of King Jehoshaphat\'s warriors (<a onClick="return mV(\'2Ch\',17,18);">2Ch 17:18</a>).``1';
isbe[4944]='Jehozadak`je-hoz\'-a-dak (yehotsadhaq, "Yahweh is righteous"): Priest at the time of the captivity under Nebuchadrezzar (<a onClick="return mV(\'1Ch\',6,14,15);">1Ch 6:14-15</a>. He was the father of Joshua (Jeshua) the priest (<a onClick="return mV(\'Hag\',1,1,12,14);">Hag 1:1,12,14</a>; <a onClick="return mV(\'Hag\',2,2,4);">2:2,4</a>; <a onClick="return mV(\'Zec\',6,11);">Zec 6:11</a>). the King James Version has Josedech in Hag and Zec. Same as "Jozadak" (yotsadhaq, same meaning) in <a onClick="return mV(\'Ezr\',3,2,8);">Ezr 3:2, 8</a>; <a onClick="return mV(\'Ezr\',5,2);">5:2</a>; <a onClick="return mV(\'Ezr\',10,18);">10:18</a>; <a onClick="return mV(\'Neh\',12,26);">Ne 12:26</a>; and = "Josedek" (King James Version "Josedec") of 1Esdras 5:5,48,56; 6:2; 9:19; Sirach 49:12.``1';
isbe[4945]='Jehu`je\'-hu (yehu; meaning uncertain, perhaps "Yahweh is he"; <a onClick="return mV(\'1Ki\',19,16,17);">1Ki 19:16-17</a>; <a onClick="return mV(\'2Ki\',9,\'1-\');">2Ki 9</a>; <a onClick="return mV(\'2Ki\',10,\'1-\');">10</a>; Eiou): Son of Jehoshaphat, and descendant of Nimshi, hence, commonly called "the son of Nimshi"; 10th king of Israel, and founder of its IVth Dynasty. Jehu reign for 28 years. His accession may be reckoned at circa 752 BC (some date a few years later).<P>1. Officer of Ahab:<P>A soldier of fortune, Jehu appears first as an officer in the body-guard of Ahab. To himself we owe the information that he was present at the judicial murder of Naboth, and that Naboth\'s sons were put to death with their father (<a onClick="return mV(\'2Ki\',9,26);">2Ki 9:26</a>). He was in attendance when Ahab drove from Samaria to inspect his new possession in Jezreel, and was witness of the dramatic encounter at the vineyard between the king and the prophet Elijah (compare <a onClick="return mV(\'1Ki\',21,16);">1Ki 21:16</a>ff). Years after, Jehu reminded Bidkar, his captain (literally, "thirdsman," in chariot), of the doom they had there heard pronounced upon Ahab and his house (<a onClick="return mV(\'2Ki\',9,25);">2Ki 9:25</a>). It was in fulfillment of this doom that Jehu at that time ordered the body of the slain Jehoram to be thrown into the enclosure which had once been Naboth\'s (<a onClick="return mV(\'2Ki\',9,26);">2Ki 9:26</a>). Ahab\'s temporary repentance averted the punishment from himself for a few years (<a onClick="return mV(\'1Ki\',21,\'27-29\');">1Ki 21:27-29</a>), but the blow fell at the battle of Ramoth-gilead, and Jehu would not be unmindful of the prophet\'s words as he beheld the dogs licking Ahab\'s blood as they washed his chariot "by the pool of Samaria" (<a onClick="return mV(\'1Ki\',22,38);">1Ki 22:38</a>).<P>2. Jehoram at Ramoth-gilead and Jezreel:<P>A different fate awaited Ahab\'s two sons. The elder, Ahaziah, died, after a short reign, from the effects of an accident (<a onClick="return mV(\'2Ki\',1,\'1-\');">2Ki 1</a>). He was succeeded by his brother Jehoram, who toward the close of his reign of 12 years (<a onClick="return mV(\'2Ki\',3,1);">2Ki 3:1</a>) determined on an attempt to recover Ramoth-gilead, where his father had been fatally stricken, from Hazael, of Syria. Ramoth-gilead was taken (<a onClick="return mV(\'2Ki\',9,14);">2Ki 9:14</a>), but in the attack the Israelite king was severely wounded, and was taken to Jezreel to be healed of his wounds (<a onClick="return mV(\'2Ki\',9,15);">2Ki 9:15</a>). The city meanwhile was left in charge of Jehu and his fellow-captains. At Jezreel he was visited by Ahaziah, of Judah, who had taken part with him in the war (<a onClick="return mV(\'2Ki\',8,28,29);">2Ki 8:28-29</a>; <a onClick="return mV(\'2Ki\',9,16);">9:16</a>).<P>3. The Anointing of Jehu:<P>The time was now ripe for the execution of the predicted vengeance on the house of Ahab, and to Elisha the prophet, the successor of Elijah, it fell to take the decisive step which precipitated the crisis. Hazael and Jehu had already been named to Elijah as the persons who were to execute the Divine judgment, the one as king of Syria, the other as king of Israel (<a onClick="return mV(\'1Ki\',19,\'15-17\');">1Ki 19:15-17</a>). Elijah was doubtless aware of this commission, which it was now his part, as respected Jehu, to fulfill. A messenger was hastily dispatched to Ramoth-gilead, with instructions to seek out Jehu, take him apart, anoint him king of Israel in Yahweh\'s name, and charge him with the task of utterly destroying the house of Ahab in punishment for the righteous blood shed by Ahab and Jezebel. The messenger was then to flee. This was done, and Jehu, the sacred oil poured on his head, found himself alone with this appalling trust committed to him (<a onClick="return mV(\'2Ki\',9,\'1-10\');">2Ki 9:1-10</a>).<P>4. The Revolution—Death of Jehoram:<P>Events now moved rapidly. Jehu\'s companions were naturally eager to know what had happened, and on learning that Jehu had been anointed king, they at once improvised a throne by throwing their garments on the top of some steps, blew the trumpet, and proclaimed, "Jehu is king." Not a moment was lost. No one was permitted to leave the city to carry forth tidings, and Jehu himself, with characteristic impetuosity, set out, with a small body of horsemen, in his chariot to Jezreel. Bidkar was there as charioteer (<a onClick="return mV(\'2Ki\',9,25);">2Ki 9:25</a>). As they came within sight of the city, a watchman reported their advance, and messengers were sent to inquire as to their errand. These were ordered to fall into the rear. This conduct awakened suspicion, and Jehoram and Ahaziah—who was still with his invalided kinsman—ordered their chariots, and proceeded in person to meet Jehu. The companies met at the ill-omened field of Naboth, and there the first stroke of vengeance fell. The anxious query, "Is it peace?" was answered by a storm of denunciation from Jehu, and on Jehoram turning to flee, an arrow from Jehu\'s powerful bow shot him through the heart, and he sank dead in his chariot. Ahaziah likewise was pursued, and smitten "at the ascent of Gur, which is by Ibleam." He died at Megiddo, and was taken to Jerusalem for burial in the sepulcher of the kings (<a onClick="return mV(\'2Ki\',9,\'11-28\');">2Ki 9:11-28</a>). A somewhat variant account of Ahaziah\'s death is given in <a onClick="return mV(\'2Ch\',22,9);">2Ch 22:9</a>. It is possible that Jehu came to Megiddo or its neighborhood, and had to do with his end there.<P>5. Death of Jezebel:<P>The slaughter of Jehoram was at once followed by that of the chief instigator of all the crimes for which the house of Ahab suffered—the queen-mother Jezebel. Hot from the pursuit of Ahaziah, Jehu pressed on Jezreel. Jezebel, now an aged woman, but still defiant, had painted and attired herself, and, looking from her window, met him as he drove into the palace court, with the insulting question, "Is it peace, thou Zimri, thy master\'s murderer?" (compare <a onClick="return mV(\'1Ki\',16,\'9-12\');">1Ki 16:9-12</a>). Jehu\'s answer was an appeal for aid from those within. Two or three eunuchs of the palace gave signs of their concurrence. These, at Jehu\'s bidding, threw Jezebel down into the courtyard, where, lying in her blood, she was trodden under foot by the chariot horses. When, a little later, her remains were sought for burial, she was found to have been almost wholly devoured by the dogs—a lurid commentary on Elijah\'s earlier threatening, which was now recalled (<a onClick="return mV(\'2Ki\',9,\'30-37\');">2Ki 9:30-37</a>). Jehu was an intrepid minister of judgment, but the pitiless zeal, needless cruelty, and, afterward, deceit, with which he executed his mission, withdraw our sympathy from him, as it did that of a later prophet (<a onClick="return mV(\'Hsa\',1,4);">Ho 1:4</a>).<P>6. Slaughter of Ahab\'s Descendants:<P>The next acts of Jehu reveal yet more clearly his thoroughness of purpose and promptitude of action, while they afford fresh exhibitions of his ruthlessness and unscrupulousness of spirit. Samaria was the capital of the kingdom, and headquarters of the Baal-worship introduced by Jezebel, though it is recorded of Jehoram that he had removed, at least temporarily, an obelisk of Baal which his father had set up (<a onClick="return mV(\'2Ki\',3,2);">2Ki 3:2</a>; compare <a onClick="return mV(\'2Ki\',10,26);">10:26</a>). The city was still held for the house of Ahab, and 70 of Ahab\'s "son"—to be taken here in the large sense of male descendants—resided in it (<a onClick="return mV(\'2Ki\',10,1,6);">2Ki 10:1,6</a>). Jehu here adopted a bold and astute policy. He sent letters to Samaria challenging those in authority to set up one of their master\'s sons as king, and fight for the city and the kingdom. The governors knew well that they could make no effective resistance to Jehu, and at once humbly tendered their submission. Jehu, in a second message, bade them prove their sincerity by delivering to him the heads of the 70 princes of Ahab\'s house in baskets. This they did, by their act irrevocably committing themselves to Jehu\'s cause (<a onClick="return mV(\'2Ki\',10,9);">2Ki 10:9</a>). The ghastly relics were piled up in two heaps at the gate of Jezreel—a horrible object lesson to any still inclined to hesitate in their allegiance. Friends and partisans of the royal house shared the fate of its members (<a onClick="return mV(\'2Ki\',10,11);">2Ki 10:11</a>).<P>7. Slaughter of Ahaziah\'s Brethren:<P>Apart from the faultiness in the agent\'s motive, the deeds now recounted fell within the letter of Jehu\'s commission. As much cannot be said of the deeds of blood that follow. Jehu had killed Ahaziah, king of Judah. Now, on his way to Samaria, he met a company of 42 persons, described as "brethren of Ahaziah"—evidently blood-relations of various degrees, as Ahaziah\'s own brethren had been earlier slain by the Arabians (<a onClick="return mV(\'2Ch\',21,17);">2Ch 21:17</a>; <a onClick="return mV(\'2Ch\',22,1);">22:1</a>)—and, on learning who they were, and of their purpose to visit their kinsfolk at Jezreel, gave orders that they be slain on the spot, and their bodies ignominiously thrown into the pit (or "cistern") of the shearing-house where he had encountered them. It was a cruel excess for which no sufficient justification can be pleaded (<a onClick="return mV(\'2Ki\',10,\'12-14\');">2Ki 10:12-14</a>).<P>8. Massacre of the Worshippers of Baal:<P>Still less can the craft and violence be condoned by which, when he reached Samaria, Jehu evinced his "zeal for Yahweh" (<a onClick="return mV(\'2Ki\',10,16);">2Ki 10:16</a>) in the extirpation of the worshippers of Baal. Jehu had secured on his side the support of a notable man—Jehonadab the son of Rechab (<a onClick="return mV(\'2Ki\',10,15,16);">2Ki 10:15-16</a>; compare <a onClick="return mV(\'Jer\',35,\'6-19\');">Jer 35:6-19</a>)—and his entrance into Samaria was signalized by further slaying of all adherents of Ahab. Then, doubtless to the amazement of many, Jehu proclaimed himself an enthusiastic follower of Baal. A great festival was organized, to which all prophets, worshippers, and priests of Baal were invited from every part of Israel. Jehu himself took the leading part in the sacrifice (<a onClick="return mV(\'2Ki\',10,25);">2Ki 10:25</a>). Vestments were distributed to distinguish the true worshippers of Baal from others. Then when all were safely gathered into "the house of Baal," the gates were closed, and 80 soldiers were sent in to massacre the whole deluded company in cold blood. None escaped. The temple of Baal was broken up. Thus, indeed, "Jehu destroyed Baal out of Israel" (<a onClick="return mV(\'2Ki\',10,28);">2Ki 10:28</a>), but at what a frightful cost of falsehood and treacherous dealing! (<a onClick="return mV(\'2Ki\',10,\'18-28\');">2Ki 10:18-28</a>).<P>9. Wars with Hazael:<P>The history of Jehu in the Bible is chiefly the history of his revolution as now narrated. His reign itself is summed up in a few verses, chiefly occupied with the attacks made by Hazael, king of Syria, on the trans-Jordanic territories of Israel (<a onClick="return mV(\'2Ki\',10,32,33);">2Ki 10:32-33</a>). These districts were overrun, and remained lost to Israel till the reign of Jehu\'s great-grandson, Jeroboam II (<a onClick="return mV(\'2Ki\',14,28);">2Ki 14:28</a>).<P>10. Assyrian Notices:<P>It is in another direction, namely, to the annals of Assyria, we have to look for any further information we possess on the reign of Jehu In these annals, fortunately, some interesting notices are preserved. In 854 BC was fought the great battle of Qarqar (a place between Aleppo and Hamath), when Shalmaneser II, king of Assyria, defeated a powerful combination formed against him (Damascus, Hamath, Philistia Ammon, etc.). Among the allies on this occasion is mentioned "Ahabbu of Sir\'-ilaa," who took the third place with 2,000 chariots and 10,000 footmen. There is a difficulty in supposing Ahab to have been still reigning as late as 854, and Wellhausen, Kamphausen and others have suggested that Ahab\'s name has been confused with that of his successor Jehoram in the Assyrian annals. Kittel, in his History of the Hebrews (II,233,English translation) is disposed to accept this view. G. Smith, in his Assyrian Eponym Canon (179), is of the opinion that the tribute lists were often carelessly compiled and in error as to names. The point of interest is that from this time Israel was evidently a tributary of Assyria.<P>11. Tribute of Jehu:<P>With this accord the further notices of Israel in the inscriptions of Shalmaneser II, two in number. Both belong to the year 842 BC and relate to Jehu. On Shalmaneser\'s Black Obelisk is a pictorial representation of "the tribute of Jehu, son of Omri." An ambassador kneels before the conqueror, and presents his gifts. They include silver, gold, a gold cup, gold vessels, a golden ladle, lead, a staff for the king\'s hand, scepters. An allusion to the same event occurs in the annals of Shalmaneser\'s campaign against Hazael of Syria in this year. "At that time I received the tribute of the Tyrians, Sidonians, of Jehu, son of Omri."<P>There are some indications that in his latter years, which were clouded with misfortune, Jehu associated with himself his son Jehoahaz in the government (compare <a onClick="return mV(\'2Ki\',13,1,10);">2Ki 13:1,10</a>, where Jehoahaz comes to the throne in the 23rd, and dies in the 37th year of Jehoash of Judah—14 years—yet has a total reign of 17 years). Jehu is not mentioned in Chronicles, except incidentally in connection with the death of Ahaziah (<a onClick="return mV(\'2Ch\',22,9);">2Ch 22:9</a>), and as the grandfather of Jehoash (<a onClick="return mV(\'2Ch\',25,17);">2Ch 25:17</a>).<P>The character of Jehu is apparent from the acts recorded of him. His energy, determination, promptitude, and zeal fitted him for the work he had to do. It was rough work, and was executed with relentless thoroughness. Probably gentler measures would have failed to eradicate Baal-worship from Israel. His impetuosity was evinced in his furious driving (<a onClick="return mV(\'2Ki\',9,20);">2Ki 9:20</a>). He was bold, daring, unscrupulous, and masterful and astute in his policy. But one seeks in vain in his character for any touch of magnanimity, or of the finer qualities of the ruler. His "zeal for Yahweh" was too largely a cloak for merely worldly ambition. The bloodshed in which his rule was rounded early provoked a reaction, and his closing years were dark with trouble. He is specially condemned for tolerating the worship of the golden calves (<a onClick="return mV(\'2Ki\',10,\'29-31\');">2Ki 10:29-31</a>). Nevertheless the throne was secured to his dynasty for four generations (<a onClick="return mV(\'2Ki\',10,30);">2Ki 10:30</a>; compare <a onClick="return mV(\'2Ki\',15,12);">15:12</A>).``17';
isbe[4946]='Jehubbah`je-hub\'-a (yechubbah, meaning unknown): A descendant of Asher, mentioned in <a onClick="return mV(\'1Ch\',7,34);">1Ch 7:34</a>, where Qere is wechubbah, "and Hubbah," but Kethibh is yachbah; the Septuagint\'s Codex Vaticanus follows the Qere.``1';
isbe[4947]='Jehucal`je-hu\'-kal (yechukhal, probably meaning "Yahweh is able"): A courtier sent by King Zedekiah to Jeremiah to ask the prophet to pray for the king and the people (<a onClick="return mV(\'Jer\',37,3);">Jer 37:3</a>). Most versions except Septuagint, with <a onClick="return mV(\'Jer\',38,1);">Jer 38:1</a>, have "Jucal" (yukhal, same meaning).``1';
isbe[4948]='Jehud`je\'-hud (yehudh): A town in the lot of Dan named between Baalath and Bene-berak (<a onClick="return mV(\'Jos\',19,45);">Jos 19:45</a>). The only possible identification seems to be with el-Yehudiyeh, which lies about 8 miles east of Jaffa.``1';
isbe[4949]='Jehudi`je-hu\'-di (yehudhi, properly "a Jew"): An officer of King Jehoiakim (<a onClick="return mV(\'Jer\',36,14,21,23);">Jer 36:14, 21, 23</a>). He was sent by the princes to summon Baruch to read the roll containing Jeremiah\'s prophecies to them; he afterward read them to the king, who destroyed them. His name is noteworthy, as also is that of his grandfather Cushi (i.e. "Ethiopian"), and the two are said to point to a foreign origin.``1';
isbe[4950]='Jehudijah`je-hu-di\'-ja (<a onClick="return mV(\'1Ch\',4,18);">1Ch 4:18</a> the King James Version).`<a href="./study/isbe/search.html?string=HA-JEHUDIJAH">HA-JEHUDIJAH</a>`1';
isbe[4951]='Jehuel`je-hu\'-el (Kethibh yechu\'el; but Qere yechi\'-el, i.e. "Jehiel" the King James Version, in <a onClick="return mV(\'2Ch\',29,14);">2Ch 29:14</a>): A Levite.`<a href="./study/isbe/search.html?string=JEHIEL">JEHIEL</a>`1';
isbe[4952]='Jehush`je\'-hush (<a onClick="return mV(\'1Ch\',8,39);">1Ch 8:39</a>).`<a href="./study/isbe/search.html?string=JEUSH">JEUSH</a>`1';
isbe[4953]='Jeiel`je-i\'-el (ye\'i\'el, meaning unknown):<P>(1) A Reubenite (<a onClick="return mV(\'1Ch\',5,7);">1Ch 5:7</a>).<P>(2) In <a onClick="return mV(\'1Ch\',8,29);">1Ch 8:29</a>, added in the Revised Version (British and American) from <a onClick="return mV(\'1Ch\',9,35);">9:35</A>, where Kethibh is "Jeuel," an ancestor of King Saul; the King James Version "Jehiel."<P>(3) One of David\'s mighty men (<a onClick="return mV(\'1Ch\',11,44);">1Ch 11:44</a>). the King James Version is "Jehiel"; Kethibh is "Jeuel."<P>(4) A Levite, keeper of the ark with Obed-edom (<a onClick="return mV(\'1Ch\',15,18);">1Ch 15:18, 21</a>; <a onClick="return mV(\'1Ch\',16,5);">16:5</a>; <a onClick="return mV(\'2Ch\',20,14);">2Ch 20:14</a>), called "Jehiah" in <a onClick="return mV(\'1Ch\',15,24);">1Ch 15:24</a>.<P>(5) A Levite (<a onClick="return mV(\'1Ch\',16,5);">1Ch 16:5</a>) = "Jaaziel" of <a onClick="return mV(\'1Ch\',15,18);">1Ch 15:18</a> (which see).<P>(6) A scribe under King Uzziah (<a onClick="return mV(\'2Ch\',26,11);">2Ch 26:11</a>).<P>(7) A chief of the Levites, present at King Josiah\'s great Passover feast (<a onClick="return mV(\'2Ch\',35,9);">2Ch 35:9</a>).<P>(8) One of those who had married foreign wives (<a onClick="return mV(\'Ezr\',10,43);">Ezr 10:43</a>) = "Juel" in 1Esdras 9:35.<P>(9) the King James Version in <a onClick="return mV(\'2Ch\',29,14);">2Ch 29:14</a>; see <a href="study/isbe/search.html?string=JEHIEL">JEHIEL, (5)</a>.<P>(10) the King James Version in <a onClick="return mV(\'Ezr\',8,13);">Ezr 8:13</a>; see <a href="study/isbe/search.html?string=JEUEL">JEUEL, (3)</A>.``149';
isbe[4954]='Jekabzel`je-kab\'-ze-el (yeqabhtse\'el, "God gathers"; <a onClick="return mV(\'Neh\',11,25);">Ne 11:25</a>).`<a href="./study/isbe/search.html?string=KABZEEL">KABZEEL</a>`1';
isbe[4955]='Jekameam`jek-a-me\'-am, je-kam\'-e-am (yeqam\'-am probably "may kinsman establish"): Head of a Levitical house (<a onClick="return mV(\'1Ch\',23,19);">1Ch 23:19</a>; <a onClick="return mV(\'1Ch\',24,23);">24:23</a>). The meaning of the name depends upon that of (\'am) in compound names; see H P N, 46, 51ff.``1';
isbe[4956]='Jekamiah`jek-am-mi\'-a (yeqamyah, "may Yahweh establish"):<P>(1) A Judahite, son of Shallum (<a onClick="return mV(\'1Ch\',2,41);">1Ch 2:41</a>).<P>(2) A son of King Jeconiah (Jehoiachin); in the King James Version "Jecamiah" (<a onClick="return mV(\'1Ch\',3,18);">1Ch 3:18</a>).``1';
isbe[4957]='Jekuthiel`je-ku\'-thi-el (yeqthi\'el meaning doubtful): A Judahite (<a onClick="return mV(\'1Ch\',4,18);">1Ch 4:18</a>). The meaning may be "preservation of God" or perhaps the same as yoqthe\'el, "Joktheel," the name of a place in <a onClick="return mV(\'Jos\',15,38);">Jos 15:38</a>; <a onClick="return mV(\'2Ki\',14,7);">2Ki 14:7</a>.``1';
isbe[4958]='Jemimah`je-mi\'-ma (yemimah, perhaps a diminutive meaning "little dove"): The first daughter of Job (<a onClick="return mV(\'Job\',42,14);">42:14</a>), born after his restoration from affliction.``1';
isbe[4959]='Jemnaan`jem\'-na-an (Iemnaan): A city on the coast of Palestine; mentioned among those affected by the expedition of Holofernes (Judith 2:28; 3:1ff). The name is used for Jabniel, generally called "Jamnia" by the Greek writers.``1';
isbe[4960]='Jemuel`je-mu\'-el (yemu\'el, meaning unknown): A "son" of Simeon (<a onClick="return mV(\'Gen\',46,10);">Ge 46:10</a>; <a onClick="return mV(\'Exd\',6,15);">Ex 6:15</a>) = "Nemuel" in <a onClick="return mV(\'Num\',26,12);">Nu 26:12</a>; <a onClick="return mV(\'1Ch\',4,24);">1Ch 4:24</a>.<P>The Syriac version has "Jemuel" in the 4 passages, but Gray (H P N, 307, note 6) thinks "Jemuel" is more probably a correction in Gen than "Nemuel" in Numbers.``1';
isbe[4961]='Jeopard; Jeopardy`jep\'-ard, jep\'-ar-di: The Eng, word referred originally to a game where the chances were even (from OFr. jeu parti); transferred thence to designate any great risk. In the New Testament, represented by the Greek verb kinduneuo (<a onClick="return mV(\'Luk\',8,23);">Lu 8:23</a>; <a onClick="return mV(\'1Cr\',15,30);">1Co 15:30</a>). In the Old Testament (<a onClick="return mV(\'Jdg\',5,18);">Jud 5:18</a>) for a Hebrew idiom, "despise the soul," i.e. they placed a small value upon their lives (Vulgate "offered their souls to death"); for elliptical expression, "went with their lives," in <a onClick="return mV(\'2Sa\',23,17);">2Sa 23:17</a> margin.``1';
isbe[4962]='Jephthah`jef\'-tha (yiphtach, "opened," or "opener," probably signifying "Yahweh will open"; Iephthae; used as the name of a place, as in <a onClick="return mV(\'Jos\',15,43);">Jos 15:43</a>; <a onClick="return mV(\'Jos\',19,14);">19:14</a>; of a man, <a onClick="return mV(\'Jdg\',10,\'6-\');">Jud 10:6-12:7</a>): Ninth judge of the Israelites. His antecedents are obscure. Assuming Gilead to be the actual name of his father, his mother was a harlot. He was driven from home on account of his illegitimacy, and went to the land of Tobit in eastern Syria (<a onClick="return mV(\'Jdg\',11,2,3);">Jud 11:2-3</a>). Here he and his followers lived the life of freebooters.<P>The Israelites beyond the Jordan being in danger of an invasion by the Ammonites, Jephthah was invited by the elders of Gilead to be their leader (<a onClick="return mV(\'Jdg\',11,5,6);">Jud 11:5-6</a>). Remembering how they had expelled him from their territory and his heritage, Jephthah demanded of them that in the event of success in the struggle with the Ammonites, he was to be continued as leader. This condition being accepted he returned to Gilead (<a onClick="return mV(\'Jdg\',11,\'7-11\');">Jud 11:7-11</a>). The account of the diplomacy used by Jephthah to prevent the Ammonites from invading Gilead is possibly an interpolation, and is thought by many interpreters to be a compilation from <a onClick="return mV(\'Num\',20,\'1-\');">Nu 20</A>-<a onClick="return mV(\'Num\',21,\'1-\');">21</a>. It is of great interest, however, not only because of the fairness of the argument used (<a onClick="return mV(\'Jdg\',11,\'12-28\');">Jud 11:12-28</a>), but also by virtue of the fact that it contains a history of the journey of the Israelites from Lower Egypt to the banks of the Jordan. This history is distinguished from that of the Pentateuch chiefly by the things omitted. If diplomacy was tried, it failed to dissuade the Ammonites from seeking to invade Israel. Jephthah prepared for battle, but before taking the field paused at Mizpeh of Gilead, and registered a vow that if he were successful in battle, he would offer as a burnt offering to Yahweh whatsoever should first come from his doors to greet him upon his return (<a onClick="return mV(\'Jdg\',11,\'29-31\');">Jud 11:29-31</a>). The battle is fought, Jephthah is the victor, and now his vow returns to him with anguish and sorrow. Returning to his home, the first to greet him is his daughter and only child. The father\'s sorrow and the courage of the daughter are the only bright lights on this sordid, cruel conception of God and of the nature of sacrifice. That the sacrifice was made seems certain from the narrative, although some critics choose to substitute for the actual death of the maiden the setting the girl apart for a life of perpetual virginity. The Israelite laws concerning sacrifices and the language used in <a onClick="return mV(\'Jdg\',11,39);">Jud 11:39</a> are the chief arguments for the latter interpretation. The entire narrative, however, will hardly bear this construction (<a onClick="return mV(\'Jdg\',11,\'34-40\');">11:34-40</A>).<P>Jephthah was judge in Israel for 6 years, but appears only once more in the Scripture narrative. The men of Ephraim, offended because they had had no share in the victory over the Ammonites, made war upon Gilead, but were put to rout by the forces under Jephthah (<a onClick="return mV(\'Jdg\',12,\'1-6\');">Jud 12:1-6</a>).``158';
isbe[4963]='Jephunneh`je-fun\'-e (yephunneh, meaning uncertain):<P>(1) Father of Caleb (<a onClick="return mV(\'Num\',13,6);">Nu 13:6</a>; <a onClick="return mV(\'Num\',14,6,30);">14:6,30</a>, etc.).<P>According to <a onClick="return mV(\'Num\',13,6);">Nu 13:6</a>, he was of the tribe of Judah; according to <a onClick="return mV(\'Num\',32,12);">32:12</A>; <a onClick="return mV(\'Jos\',14,6);">Jos 14:6</a>, a Kenizzite; the Kenizzites were incorporated in Judah (compare <a onClick="return mV(\'1Ch\',4,\'13-15\');">1Ch 4:13-15</a>).<P>(2) A son of Jether, an Asherite (<a onClick="return mV(\'1Ch\',7,38);">1Ch 7:38</a>).``1';
isbe[4964]='Jerah`je\'-ra (yerach): A son of Joktan (<a onClick="return mV(\'Gen\',10,26);">Ge 10:26</a> parallel <a onClick="return mV(\'1Ch\',1,20);">1Ch 1:20</a>). No district Jerah has been discovered. However, Yurakh in Yemen and Yarach in Hijaz are places named by the Arabic geographers. The fact that the word in Hebrew means "moon" has led to the following suggestions: the Banu Hilal ("sons of the new moon") in the north of Yemen; Ghubb el-Qamar ("the bay of the moon"), Jebel el-Qamar ("the mountains of the moon") in eastern Chadramant. But in Southern Arabia worship of the moon has caused the word to bulk largely in place-names.``1';
isbe[4965]='Jerahmeel; Jerahmeelites`je-ra\'-me-el, je-ra\'-me-el-its (yerachme\'el, "may God have compassion!"):<P>(1) In <a onClick="return mV(\'1Ch\',2,9,\'25-27\',33,42);">1Ch 2:9,25-27,33,42</a>, he is described as the son of Hezron, the son of Perez, the son of Judah by Tamar his daughter-in-law (<a onClick="return mV(\'Gen\',38,\'1-\');">Ge 38</a>). In <a onClick="return mV(\'1Sa\',27,10);">1Sa 27:10</a> is mentioned the neghebh of the (ha-yerach-me\'eli, a collective noun), the Revised Version (British and American) "the south of the Jerahmeelites." The latter is a tribal name in use probably before the proper name, above; their cities are mentioned in <a onClick="return mV(\'1Sa\',30,29);">1Sa 30:29</a>. Cheyne has radical views on Jerahmeel. See EB, under the word; also T. Witton Davies in Review of Theology and Philosophy, III, 689-708 (May, 1908); and Cheyne\'s replies in Hibbert Journal, VII, 132-51 (October, 1908), and Decline and Fall of the Kingdom of Judah.<P>(2) A Merarite Levite, son of Kish (<a onClick="return mV(\'1Ch\',24,29);">1Ch 24:29</a>).<P>(3) "The king\'s son," the Revised Version (British and American) and the King James Version margin (<a onClick="return mV(\'Jer\',36,26);">Jer 36:26</a>). the Revised Version margin, the King James Version have "son of Hammelech," taking the word ha-melek as a proper name. He was "probably a royal prince, one who had a king among his ancestors but not necessarily son of the ruling king; so <a onClick="return mV(\'Jer\',38,6);">38:6</A>; <a onClick="return mV(\'1Ki\',22,26);">1Ki 22:26b</a>; especially <a onClick="return mV(\'Zep\',1,8);">Ze 1:8</a> written at a time when the reigning king, Josiah, could not have had a grown-up \'son\' "(Driver, Jeremiah, 224, note e). Jerahmeel was with two others commanded by Jehoiakim to arrest Jeremiah and Baruch.``149';
isbe[4966]='Jerechu; Jerechus`jer\'-e-ku, jer\'-e-kus the King James Version (1Esdras 5:22).`<a href="./study/isbe/search.html?string=JERICHO">JERICHO</a>`1';
isbe[4967]='Jered`je\'-red (yeredh, "descent"): A Judahite, father of Gedor (<a onClick="return mV(\'1Ch\',4,18);">1Ch 4:18</a>).`<a href="./study/isbe/search.html?string=JARED">JARED</a>`1';
isbe[4968]='Jeremai`jer\'-e-mi, jer-e-ma\'-i (yeremay, meaning unknown): One of those who had married foreign wives (<a onClick="return mV(\'Ezr\',10,33);">Ezr 10:33</a>).`<a href="./study/isbe/search.html?string=JEREMIAS">JEREMIAS</a>`1';
isbe[4969]='Jeremiah (1)`jer-e-mi\'-a<P>(a) yirmeyahu, or<P>(b) shorter form, yirmeyah, both differently explained as "Yah establishes (so Giesebrecht), whom Yahweh casts," i.e. possibly, as Gesenius suggests, "appoints" (A. B. Davidson in HDB, II, 569a), and "Yahweh looseneth" (the womb); see BDB:<P>The form (b) is used of Jeremiah the prophet only in <a onClick="return mV(\'Jer\',27,1);">Jer 27:1</a>; <a onClick="return mV(\'Jer\',28,5,6,10,11,12,15);">28:5-6,10-12b,15</a>; <a onClick="return mV(\'Jer\',29,1);">29:1; <a onClick="return mV(\'Ezr\',1,1);">Ezr 1:1</a>; <a onClick="return mV(\'Dan\',9,2);">Da 9:2</a>, while the other is found 116 times in Jeremiah alone. In 1Esdras 1:28,32,47,57; 2Esdras 2:18, English Versions of the Bible has "Jeremy," so the King James Version in 2Macc 2:1,5,7; <a onClick="return mV(\'Mat\',2,17);">Mt 2:17</a>; <a onClick="return mV(\'Mat\',27,9);">27:9</a>; in <a onClick="return mV(\'Mat\',16,14);">Mt 16:14</a>, the King James Version has "Jeremias," but the Revised Version (British and American) in 2Maccabees and Matthew has "Jeremiah."<P>(1) The prophet. See special article <a href="./study/isbe/search.html?string=JEREMIAH+(2)">Jeremiah (2)</a>. Of the following, (2), (3) and (4) have form (a) above; the others the form (b).<P>(2) Father of Hamutal (Hamital), the mother of King Jehoahaz and King Jehoiakim (<a onClick="return mV(\'2Ki\',23,31);">2Ki 23:31</a>; <a onClick="return mV(\'2Ki\',24,18);">24:18</a> parallel <a onClick="return mV(\'Jer\',52,1);">Jer 52:1</a>).<P>(3) A Rechabite (<a onClick="return mV(\'Jer\',35,3);">Jer 35:3</a>).<P>(4) In <a onClick="return mV(\'1Ch\',12,13);">1Ch 12:13 (Hebrew 14)</a>, a Gadite.<P>(5) In <a onClick="return mV(\'1Ch\',12,10);">1Ch 12:10</a> (<span class="noTag">Hebrew 11</span>), a Gadite.<P>(6) In <a onClick="return mV(\'1Ch\',12,4);">1Ch 12:4 (Hebrew 5)</a>, a Benjamite(?) or Judean. (4), (5) and (6) all joined David at Ziklag.<P>(7) Head of a Manassite family (<a onClick="return mV(\'1Ch\',5,24);">1Ch 5:24</a>).<P>(8) A priest who sealed the covenant with Nehemiah (<a onClick="return mV(\'Neh\',10,2);">Ne 10:2</a>), probably the same as he of <a onClick="return mV(\'Neh\',12,34);">12:34</A> who took part in the procession at the dedication of the walls of Jerusalem.<P>(9) A priest who went to Jerusalem with Zerubbabel from exile and became head of a priestly family of that name (<a onClick="return mV(\'Neh\',12,1);">Ne 12:1</a>).``149';
isbe[4970]='Jeremiah (2)`jer-e-mi\'-a:<P>1. Name and Person<P>2. Life of Jeremiah<P>3. The Personal Character of Jeremiah<P>4. The Prophecies of Jeremiah<P>5. The Book of Jeremiah<P>6. Authenticity and Integrity of the Book<P>7. Relation to the Septuagint (Septuagint)<P>LITERATURE<hr /><P>1. Name and Person:<P>The name of one of the greatest prophets of Israel. The Hebrew yirmeyahu, abbreviated to yirmeyah, signifies either "Yahweh hurls" or "Yahweh founds." Septuagint reads Iermias, and the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Jeremias. As this name also occurs not infrequently, the prophet is called "the son of Hilkiah" (<a onClick="return mV(\'Jer\',1,1);">Jer 1:1</a>), who is, however, not the high priest mentioned in <a onClick="return mV(\'2Ki\',22,\'1-\');">2Ki 22</a> and <a onClick="return mV(\'2Ki\',23,\'1-\');">23</A>, as it is merely stated that he was "of the priests that were in Anathoth" in the land of Benjamin In Anathoth, now Anata, a small village 3 miles northeast of Jerusalem, lived a class of priests who belonged to a side line, not to the line of Zadok (compare <a onClick="return mV(\'1Ki\',2,26);">1Ki 2:26</a>).<P>2. Life of Jeremiah:<P>Jeremiah was called by the Lord to the office of a prophet while still a youth (<a onClick="return mV(\'Jer\',1,6);">1:6</a>) about 20 years of age, in the 13th year of King Josiah (<a onClick="return mV(\'Jer\',1,2);">1:2</a>;<a onClick="return mV(\'Jer\',25,3);"> 25:3</A>), in the year 627 BC, and was active in this capacity from this time on to the destruction of Jerusalem, 586 BC, under kings Josiah, Jehoahaz, Jehoiakim, Jehoiachin, and Zedekiah. Even after the fall of the capital city he prophesied in Egypt at least for several years, so that his work extended over a period of about 50 years in all. At first he probably lived in Anathoth, and put in his appearance publicly in Jerusalem only on the occasion of the great festivals; later he lived in Jerusalem, and was there during the terrible times of the siege and the destruction of the city.<P>Although King Josiah was God-fearing and willing to serve Yahweh, and soon inaugurated his reformation according to the law of Yahweh (in the 18th year of his reign), yet Jeremiah, at the time when he was called to the prophetic office, was not left in doubt of the fact that the catastrophe of the judgment of God over the city would soon come (<a onClick="return mV(\'Jer\',1,\'11-\');">1:11</A>ff); and when, after a few years, the Book of the Law was found in the temple (<a onClick="return mV(\'2Ki\',22,\'1-\');">2Ki 22</a> and <a onClick="return mV(\'2Ki\',23,\'1-\');">23</A>), Jeremiah preached "the words of this covenant" to the people in the town and throughout the land (<a onClick="return mV(\'Jer\',11,\'1-8\');">11:1-8</A>; <a onClick="return mV(\'Jer\',17,\'19-27\');">17:19-27</a>), and exhorted to obedience to the Divine command; but in doing this then and afterward he became the object of much hostility, especially in his native city, Anathoth. Even his own brethren or near relatives entered into a conspiracy against him by declaring that he was a dangerous fanatic (<a onClick="return mV(\'Jer\',12,6);">12:6</A>). However, the condition of Jeremiah under this pious king was the most happy in his career, and he lamented the latter\'s untimely death in sad lyrics, which the author of Chronicles was able to use (<a onClick="return mV(\'2Ch\',35,25);">2Ch 35:25</a>), but which have not come down to our times.<P>Much more unfavorable was the prophet\'s condition after the death of Josiah. Jehoahaz-Shallum, who ruled only 3 months, received the announcement of his sentence from Jeremiah (<a onClick="return mV(\'Jer\',22,10);">22:10</A>ff). Jehoiakim (609-598 BC) in turn favored the heathen worship, and oppressed the people through his love of luxury and by the erection of grand structures (<a onClick="return mV(\'Jer\',22,13);">Jer 22:13</a>). In addition, his politics were treacherous. He conspired with Egypt against his superior, Nebuchadnezzar. Epoch-making was the 4th year of Jehoiakim, in which, in the battle of Carchemish, the Chaldeans gained the upper hand in Hither Asia, as Jeremiah had predicted (<a onClick="return mV(\'Jer\',46,\'1-12\');">46:1-12</A>). Under Jehoiakim Jeremiah delivered his great temple discourse (<a onClick="return mV(\'Jer\',7,\'1-\');">Jer 7-9</a>; <a onClick="return mV(\'Jer\',10,\'17-25\');">10:17-25</a>). The priests for this reason determined to have the prophet put to death (<a onClick="return mV(\'Jer\',26,\'1-\');">Jer 26</a>). However, influential elders interceded for him, and the princes yet showed some justice. He was, however, abused by the authorities at the appeal of the priests (<a onClick="return mV(\'Jer\',20,\'1-\');">Jer 20</a>). According to <a onClick="return mV(\'Jer\',36,1);">36:1</A>ff, he was no longer permitted to enter the place of the temple. For this reason the Lord commanded him to collect his prophecies in a bookroll, and to have them read to the people by his faithful pupil Baruch (<a onClick="return mV(\'Jer\',36,\'1-\');">Jer 36</a>; compare <a onClick="return mV(\'Jer\',45,\'1-\');">Jer 45</a>). The book fell into the hands of the king, who burned it. However, Jeremiah dictated the book a second time to Baruch, together with new additions.<P>Jehoiachin or Coniah (<a onClick="return mV(\'Jer\',22,24);">Jer 22:24</a>), the son of Jehoiakim, after a reign of 3 months, was taken into captivity to Babylon by Nebuchadnezzar, together with a large number of his nobles and the best part of the people (<a onClick="return mV(\'Jer\',24,1);">Jer 24:1</a>; <a onClick="return mV(\'Jer\',29,2);">29:2</a>), as the prophet had predicted (<a onClick="return mV(\'Jer\',22,\'20-30\');">Jer 22:20-30</a>). But conditions did not improve under Zedekiah (597-586 BC). This king was indeed not as hostile to Jeremiah as Jehoiakim had been; but all the more hostile were the princes and the generals, who were now in command after the better class of these had been deported to Babylon. They continually planned rebellion against Babylon, while Jeremiah was compelled to oppose and put to naught every patriotic agitation of this kind. Finally, the Babylonian army came in order to punish the faithles s vassal who had again entered into an alliance with Egypt. Jeremiah earnestly advised submission, but the king was too weak and too cowardly as against his nobles. A long siege resulted, which caused the direst sufferings in the life of Jeremiah. The commanders threw him into a vile prison, charging him with being a traitor (<a onClick="return mV(\'Jer\',37,11);">37:11</a>ff). The king, who consulted him secretly, released him from prison, and put him into the "court of the guard" (<a onClick="return mV(\'Jer\',37,17);">37:17</A>ff), where he could move around freely, and could again prophesy. Now that the judgment had come, he could again speak of the hopeful future (<a onClick="return mV(\'Jer\',32,\'1-\');">Jer 32</a>; <a onClick="return mV(\'Jer\',33,\'1-\');">33</a>). Also <a onClick="return mV(\'Jer\',30,\'1-\');">Jer 30</a> and <a onClick="return mV(\'Jer\',31,\'1-\');">31</A>, probably, were spoken about this time. But as he continued to preach submission to the people, those in authority cast him into a slimy cistern, from which the pity of a courtier, Ebed-melech, delivered him (<a onClick="return mV(\'Jer\',39,\'15-18\');">39:15-18</A>). He again returned to the court of the guard, where he remained until Jerusalem was taken.<P>After the capture of the city, Jeremiah was treated with great consideration by the Babylonians, who knew that he had spoken in favor of their government (<a onClick="return mV(\'Jer\',39,11);">39:11</a>ff; <a onClick="return mV(\'Jer\',40,1);">40:1</a>ff). They gave him the choice of going to Babylon or of remaining in his native land. He decided for the latter, and went to the governor Gedaliah, at Mizpah, a man worthy of all confidence. But when this man, after a short time, was murdered by conscienceless opponents, the Jews who had been left in Palestine, becoming alarmed and fearing the vengeance of the Chaldeans, determined to emigrate to Egypt. Jeremiah advised against this most earnestly, and threatened the vengeance of Yahweh, if the people should insist upon their undertaking (<a onClick="return mV(\'Jer\',42,1);">42:1</A>ff). But they insisted and even compelled the aged prophet to go with them (<a onClick="return mV(\'Jer\',43,1);">43:1</A>ff). Their first goal was Tahpanhes (Daphne), a town in Lower Egypt. At this place he still continued to preach the word of God to his fellow-Israelites; compare the latest of his preserved discourses in <a onClick="return mV(\'Jer\',43,\'8-13\');">43:8-13</a>, as also the sermon in <a onClick="return mV(\'Jer\',44,\'1-\');">Jer 44</a>, delivered at a somewhat later time but yet before 570 BC. At that time Jeremiah must have been from 70 to 80 years old. He probably died soon after this in Egypt. The church Fathers report that he was stoned to death at Daphne by the Jews (Jerome, Adv. Jovin, ii, 37; Tertullian, Contra Gnost., viii; Pseudepiphan. De Proph., chapter viii; Dorotheus, 146; Isidorus, Ort. et Obit. Patr., chapter xxxviii). However, this report is not well founded. The same is the case with the rabbinical tradition, according to which he, in company with Baruch, was taken from Egypt to Babylon by Nebuchadnezzar, and died there (Cedher \'Olam Rabba\' 26).<P>3. The Personal Character of Jeremiah:<P>The Book of Jeremiah gives us not only a fuller account of the life and career of its author than do the books of the other prophets, but we also learn more about his own inner and personal life and feelings than we do of Isaiah or any other prophet. From this source we learn that he was, by nature, gentle and tender in his feelings, and sympathetic. A decided contrast to this is found in the hard and unmerciful judgment which it was his mission to announce. God made him strong and firm and immovable like iron for his mission (<a onClick="return mV(\'Jer\',1,18);">1:18</A>; <a onClick="return mV(\'Jer\',15,20);">15:20</A>). This contrast between his naturally warm personal feelings and his strict Divine mission not rarely appears in the heart-utterances found in his prophecies. At first he rejoiced when God spoke to him (<a onClick="return mV(\'Jer\',15,16);">15:16</A>); but soon these words of God were to his heart a source of pain and of suffering (<a onClick="return mV(\'Jer\',15,17);">15:17</a>ff). He would have preferred not to utter them; and then they burned in his breast as a fire (<a onClick="return mV(\'Jer\',20,7);">20:7</a>ff; <a onClick="return mV(\'Jer\',23,9);">23:9</a>). He personally stood in need of love, and yet was not permitted to marry (<a onClick="return mV(\'Jer\',16,1);">16:1</A>f). He was compelled to forego the pleasures of youth (<a onClick="return mV(\'Jer\',15,17);">15:17</A>). He loved his people as nobody else, and yet was always compelled to prophesy evil for it, and seemed to be the enemy of his nation. This often caused him to despair. The enmity to which he fell a victim, on account of his declaration of nothing but the truth, he deeply felt; see his complaints (<a onClick="return mV(\'Jer\',9,1);">9:1</a>ff; <a onClick="return mV(\'Jer\',12,5);">12:5</a>f; <a onClick="return mV(\'Jer\',15,10);">15:10</A>; <a onClick="return mV(\'Jer\',17,\'14-18\');">17:14-18</a>; <a onClick="return mV(\'Jer\',18,23);">18:23</a>, and often). In this sad antagonism between his heart and the commands of the Lord, he would perhaps wish that God had not spoken to him; he even cursed the day of his birth (<a onClick="return mV(\'Jer\',15,10);">15:10</A>; <a onClick="return mV(\'Jer\',20,\'14-18\');">20:14-18</a>; compare <a onClick="return mV(\'Job\',3,1);">Job 3:1</a>ff). Such complaints are to be carefully distinguished from that which the Lord through His Spirit communicated to the prophet. God rebukes him for these complaints, and demands of him to repent and to trust and obey Him (<a onClick="return mV(\'Jer\',15,19);">Jer 15:19</a>). This discipline makes him all the more unconquerable. Even his bitter denunciations of his enemies (<a onClick="return mV(\'Jer\',11,20);">Jer 11:20</a>ff; <a onClick="return mV(\'Jer\',15,15);">15:15</a>; <a onClick="return mV(\'Jer\',17,18);">17:18</a>; <a onClick="return mV(\'Jer\',16,\'21-23\');">18:21-23</A>) originated in part in his passionate and deep nature, and show how great is the difference between him and that perfect Sufferer, who prayed even for His deadly enemies. But Jeremiah was nevertheless a type of that Suffering Saviour, more than any of the Old Testament saints. He, as a priest, prayed for his people, until God forbade him to do so (<a onClick="return mV(\'Jer\',7,16);">7:16</a>; <a onClick="return mV(\'Jer\',11,14);">11:14</a>; <a onClick="return mV(\'Jer\',14,11);">14:11</a>; <a onClick="return mV(\'Jer\',18,20);">18:20</a>). He was compelled more than all the others to suffer through the anger of God, which was to afflict his people. The people themselves also felt that he meant well to them. A proof of this is seen in the fact that the rebellious people, who always did the contrary of what he had commanded them, forced him, the unwelcome prophet of God, to go along with them, to Egypt, because they felt that he was their good genius.<P>4. The Prophecies of Jeremiah:<P>What Jeremiah was to preach was the judgment upon Judah. As the reason for this judgment Jeremiah everywhere mentioned the apostasy from Yahweh, the idolatry, which was practiced on bamoth, or the "high places" by Judah, as this had been done by Israel. Many heathenish abuses had found their way into the life of the people. Outspoken heathenism had been introduced by such men as King Manasseh, even the sacrifice of children to the honor of Baal-Molech in the valley of Hinnom (<a onClick="return mV(\'Jer\',7,31);">7:31</a>; <a onClick="return mV(\'Jer\',19,15);">19:5</a>; <a onClick="return mV(\'Jer\',32,35);">32:35</a>), and the worship of "the queen of heaven" (<a onClick="return mV(\'Jer\',7,18);">7:18</A>; <a onClick="return mV(\'Jer\',44,19);">44:19</A>). It is true that the reformation of Josiah swept away the worst of these abominations. But an inner return to Yahweh did not result from this reformation. For the reason that the improvement had been more on the surface and outward, and was done to please the king, Jeremiah charges up to his people all their previous sins, and the guilt of the present generation was yet added to this (<a onClick="return mV(\'Jer\',16,11);">16:11</a>f). Together with religious insincerity went the moral corruption of the people, such as dishonesty, injustice, oppression of the helpless, slander, and the like. Compare the accusations found in <a onClick="return mV(\'Jer\',5,1);">5:1</a>ff, <a onClick="return mV(\'Jer\',5,7);">7</a>f; <a onClick="return mV(\'Jer\',5,26);">26</a>ff; <a onClick="return mV(\'Jer\',6,7,13);">6:7,13</a>; <a onClick="return mV(\'Jer\',7,5,9);">7:5f; 9</a>; <a onClick="return mV(\'Jer\',9,2,6,8);">9:2,6,8</a>; <a onClick="return mV(\'Jer\',17,9);">17:9</a>ff; <a onClick="return mV(\'Jer\',21,12);">21:12</a>; <a onClick="return mV(\'Jer\',22,13);">22:13</a>ff; <a onClick="return mV(\'Jer\',23,10);">23:10</a>; <a onClick="return mV(\'Jer\',29,23);">29:23</a>, etc. Especially to the spiritual leaders, the priests and prophets, are these things charged up.<P>The judgment which is to come in the near future, as a punishment for the sins of the people, is from the outset declared to be the conquest of the country through an enemy from abroad. In this way the heated caldron with the face from the north, in the vision containing the call of the prophet (<a onClick="return mV(\'Jer\',1,13);">Jer 1:13</a>), is to be understood. This power in the north is not named until the 4th year of Jehoiakim (<a onClick="return mV(\'Jer\',25,\'1-\');">Jer 25</a>), where Nebuchadnezzar is definitely designated as the conqueror. It is often thought, that, in the earlier years of his career, Jeremiah had in mind the Scythians when he spoke of the enemies from the north, especially in <a onClick="return mV(\'Jer\',4,\'1-\');">Jer 4-6</a>. The Scythians (according to Herodotus i.103ff) had, probably a few years before Jeremiah\'s call to the prophetic office, taken possession of Media, then marched through Asia Minor, and even forced their way as far as Egypt. They crossed through Canaan, passing by on their march from east to west, near Beth-shean (Scythopolis). The ravages of this fierce people probably influenced the language used by Jeremiah in his prophecies (compare <a onClick="return mV(\'Jer\',4,11);">4:11</a>ff; <a onClick="return mV(\'Jer\',5,15);">5:15</a>ff; <a onClick="return mV(\'Jer\',6,3);">6:3</a>ff, <a onClick="return mV(\'Jer\',6,22);">22</a>ff). But it is unthinkable that Jeremiah expected nothing more than a plundering and a booty-seeking expedition of the Scythian nomad hordes. Chariots, such as are described in <a onClick="return mV(\'Jer\',4,13);">4:13</a>, the Scythians did not possess. Moreover, it must not be forgotten that Jeremiah from the outset speaks of a deportation of his people to this foreign land (<a onClick="return mV(\'Jer\',3,18);">3:18</a>; <a onClick="return mV(\'Jer\',5,19);">5:19</a>), while an exile of Israel in the country of the Scythians was out of the question. At all events from the 4th year of Jehoiakim, Jeremiah regards the Chaldeans as the enemy who, according to his former announcement, would come from the north. It is possible that it was only in the course of time that he reached a clear conviction as to what nation was meant by the revelation from God. But, upon further reflection, he must have felt almost certain on this subject, especially as Isaiah (<a onClick="return mV(\'Isa\',39,6);">39:6</a>), Micah (<a onClick="return mV(\'Mic\',4,10);">4:10</a>), and, soon after these, Habakkuk had named Babylon as the power that was to carry out the judgment upon Israel. Other prophets, too, regard the Babylonians as belonging to the northern group of nations (compare <a onClick="return mV(\'Zec\',6,8);">Zec 6:8</a>), because they always came from the north, and because they were the legal successors of the Assyrians.<P>In contrast to optimistic prophets, who had hoped to remedy matters in Israel (<a onClick="return mV(\'Jer\',6,14);">Jer 6:14</a>), Jeremiah from the beginning predicted the destruction of the city and of the sanctuary, as also the end of the Jewish nation and the exile of the people through these enemies from abroad. According to <a onClick="return mV(\'Jer\',25,11);">25:11</a>; <a onClick="return mV(\'Jer\',29,10);">29:10</a>, the Babylonian supremacy (not exactly the exile) was to continue for 70 years; and after this, deliverance should come. Promises to this effect are found only now and then in the earlier years of the prophet (<a onClick="return mV(\'Jer\',3,14);">3:14</a>ff; <a onClick="return mV(\'Jer\',12,14);">12:14</A>ff; <a onClick="return mV(\'Jer\',16,14);">16:14</a>f). However, during the time of the siege and afterward, such predictions are more frequent (compare <a onClick="return mV(\'Jer\',23,\'1-6\');">23:1</a>ff; <a onClick="return mV(\'Jer\',24,6,7);">24:6</a>f; <a onClick="return mV(\'Jer\',47,\'2-7\');">47:2-7</a>; and in the "Book of Comfort," chapters <a onClick="return mV(\'Jer\',30,\'1-\');">30-33</a>).<P>What characterizes this prophet is the spiritual inwardness of his religion; the external theocracy he delivers up to destruction, because its forms were not animated by God-fearing sentiments. External circumcision is of no value without inner purity of heart. The external temple will be destroyed, because it has become the hiding-place of sinners. External sacrifices have no value, because those who offer them are lacking in spirituality, and this is displeasing to God. The law is abused and misinterpreted (<a onClick="return mV(\'Jer\',8,8);">Jer 8:8</a>); the words of the prophets as a rule do not come from God. Even the Ark of the Covenant is eventually to make way for a glorious presence of the Lord. The law is to be written in the hearts of men (<a onClick="return mV(\'Jer\',31,31);">Jer 31:31</a>). The glories of the Messianic times the prophet does not describe in detail but their spiritual character he repeatedly describes in the words "Yahweh our righteousness" (<a onClick="return mV(\'Jer\',23,6);">Jer 23:6</a>; <a onClick="return mV(\'Jer\',33,16);">33:16</a>). However, we must not over-estimate the idealism of Jeremiah. He believed in a realistic restoration of theocracy to a form, just as the other prophets (compare <a onClick="return mV(\'Jer\',31,\'1-\');">Jer 31</a>-<a onClick="return mV(\'Jer\',32,\'1-\');">32</a>, <a onClick="return mV(\'Jer\',38,\'1-\');">38</a>, <a onClick="return mV(\'Jer\',39,\'1-\');">39</a>, <a onClick="return mV(\'Jer\',40,\'1-\');">40</a>).<P>As far as the form of his prophetic utterances is concerned, Jeremiah is of a poetical nature; but he was not only a poet. He often speaks in the meter of an elegy; but he is not bound by this, and readily passes over into other forms of rhythms and also at times into prosaic speech, when the contents of his discourses require it. The somewhat monotonous and elegiac tone, which is in harmony with his sad message to the people, gives way to more lively and varied forms of expression, when the prophet speaks of other and foreign nations. In doing this he often makes use of the utterances of earlier prophets.<P>5. The Book of Jeremiah:<P>The first composition of the book is reported in <a onClick="return mV(\'Jer\',36,1);">Jer 36:1</a>ff. In the 4th year of Jehoiakim, at the command of Yahweh, he dictated all of the prophecies he had spoken down to this time to his pupil Baruch, who wrote them on a roll. After the destruction of this book-roll by the king, he would not be stopped from reproducing the contents again and making additions to it (<a onClick="return mV(\'Jer\',36,32);">Jer 36:32</a>). In this we have the origin of the present Book of Jeremiah. This book, however, not only received further additions, but has also been modified. While the discourses may originally have been arranged chronologically, and these reached only down to the 4th year of King Jehoiakim, we find in the book, as it is now, as early as <a onClick="return mV(\'Jer\',21,1);">Jer 21:1</a>ff; <a onClick="return mV(\'Jer\',23,1);">23:1</a>ff; <a onClick="return mV(\'Jer\',26,1);">26:1</A>ff, discourses from the times of Zedekiah. However, the 2nd edition (<a onClick="return mV(\'Jer\',36,28);">Jer 36:28</a>) contained, no doubt, <a onClick="return mV(\'Jer\',25,\'1-\');">Jer 25</a>, with those addresses directed against the heathen nations extant at that time. The lack of order, from a chronological point of view, in the present book, is attributable also to the fact that historical accounts or appendices concerning the career of Jeremiah were added to the book in later times, e.g. <a onClick="return mV(\'Jer\',26,\'1-\');">Jer 26</a>; <a onClick="return mV(\'Jer\',35,\'1-\');">35</a>; <a onClick="return mV(\'Jer\',36,\'1-\');">36</a> and others; and in these additions are also found older discourses of the prophet. Beginning with <a onClick="return mV(\'Jer\',37,\'1-\');">Jer 37</a>, the story of the prophet during the siege of Jerusalem and after the destruction of the city is reported, and in connection with this are his words and discourses belonging to this period.<P>It is a question whether these pieces, which are more narrative in character, and which are the product of a contemporary, probably Baruch, at one time constituted a book by themselves, out of which they were later taken and incorporated in the book of the prophet, or whether they were inserted by Baruch. In favor of the first view, it may be urged that they are not always found at their proper places chronologically; e.g. <a onClick="return mV(\'Jer\',26,\'1-\');">Jer 26</a> is a part of the temple discourse in <a onClick="return mV(\'Jer\',7,\'1-\');">Jer 7<a onClick="return mV(\'Jer\',8,\'1-\');">; 8</a>; <a onClick="return mV(\'Jer\',9,\'1-\');">9</a>. However, this "Book of Baruch," which is claimed by some critics to have existed as a separate book beside that of Jeremiah, would not furnish a connected biography, and does not seem to have been written for biographical purposes. It contains introductions to certain words and speeches of the prophet and statements of what the consequences of these had been. Thus it is more probable that Baruch, at a later time, made supplementary additions to the original book, which the prophet had dictated without any personal data. But in this work the prophet himself may have cooperated. At places, perhaps, the dictation of the prophet ends in a narrative of Baruch (<a onClick="return mV(\'Jer\',19,\'14-\');">Jer 19:14</a>-<a onClick="return mV(\'Jer\',20,\'1-6\');">20:6</a>), or vice versa. Baruch seems to have written a historical introduction, and then Jeremiah dictated the prophecy (<a onClick="return mV(\'Jer\',27,1);">27:1</a>; <a onClick="return mV(\'Jer\',18,1);">18:1</a>; <a onClick="return mV(\'Jer\',32,1);">32:1</a>ff, and others). Of course, the portions of the book which came from the pen of Baruch are to be regarded as an authentic account.<P>6. Authenticity and Integrity of the Book:<P>However, critics have denied to Jeremiah and his pupil certain sections of the present book, and they claim that these belong to a later date. Among these <span class="noTag">is</a> <a onClick="return mV(\'Jer\',10,\'1-16\');">10:1-16</a>, containing a warning to those in the exile against idolatry (and related to <a onClick="return mV(\'Isa\',40,\'1-\');">Isa 40</a>ff) which, it is claimed, could not possibly in this form and fullness be the work of Jeremiah. Also <a onClick="return mV(\'Jer\',17,\'19-27\');">17:19-27</a> is without reason denied to Jeremiah, upon the ground that he could not have thought of emphasizing the Sabbath law. He was, however, no modern idealist, but respected also the Divine ordinances (compare <a onClick="return mV(\'Jer\',11,\'1-8\');">11:1-8</a>). Then <a onClick="return mV(\'Jer\',25,\'1-\');">Jer 25</a> is rejected by some, while others attack especially <a onClick="return mV(\'Jer\',25,\'12-14\');">25:12-14</a> and <a onClick="return mV(\'Jer\',25,\'27-38\');">25:27-38</a>; but in both cases without reason. On the other hand, we admit that <a onClick="return mV(\'Jer\',25,25);">25:25</a> and also <a onClick="return mV(\'Jer\',25,13);">25:13</a>f are later additions. The words, "all that is written in this book, which Jeremiah hath prophesied against all the nations," are probably a superscription, which has found its way into the text. In <a onClick="return mV(\'Jer\',25,26);">25:26</a> the words, "and the king of Sheshach shall drink after them," are likewise considered spurious. Sheshach is rightly regarded here, as in <a onClick="return mV(\'Jer\',51,41);">51:41</a>, as a cipher for "Babel," but the use of \'At-bash (a cipher in which the order of the letters of the Hebrew alphabet is reversed, taw (t) for \'aleph (\'), shin (sh) for beth (b), etc., hence, SHeSHaKH = BaBHeL, see the commentaries) does not prove spuriousness. The sentence is not found in the Septuagint. The attacks made on <a onClick="return mV(\'Jer\',30,\'1-\');">Jer 30</a> and <a onClick="return mV(\'Jer\',30,\'1-\');">31</A> are of little moment. <a onClick="return mV(\'Jer\',33,\'14-26\');">Jer 33:14-26</a> is not found in the Septuagint, and its contents, too, belong to the passages in Jeremiah that are most vigorously attacked. Critics regard Jeremiah as too spiritual to have perpetuated the Levitical priesthood. In <a onClick="return mV(\'Jer\',39,1,2,\'4-10\');">Jer 39:1-2, 4-10</a> are evidently additions that do not belong to this place. The remaining portion can stand. Among the discourses against the nations, <a onClick="return mV(\'Jer\',46,\'1-\');">Jer 46-51</a>, those in <a onClick="return mV(\'Jer\',46,\'1-12\');">46:1-12</A>, spoken immediately preceding the battle of Carchemish, cannot be shown to be unauthentic; even <a onClick="return mV(\'Jer\',46,\'13-28\');">46:13-28</a> are also genuine. The fact, however, is that the text has suffered very much. Nor are there any satisfactory reasons against the prophecy in <a onClick="return mV(\'Jer\',47,\'1-\');">Jer 47</a>; <a onClick="return mV(\'Jer\',48,\'1-\');">48</a>; <a onClick="return mV(\'Jer\',49,\'1-\');">49</a>, if we assume that Jeremiah reasserted some of his utterances against the heathen nations that did not seem to have been entirely fulfilled. <a onClick="return mV(\'Jer\',50,\'1-\');">Jer 50</a> and <a onClick="return mV(\'Jer\',51,\'1-\');">51</A>, the discourses against Babylon, have the distinct impress of Jeremiah. This impression is stronger than the doubts, which, however, are not without weight. The events in <a onClick="return mV(\'Jer\',51,59);">51:59</A>ff, which are not to be called into question, presuppose longer addresses of Jeremiah against Babylon. The possibility, however, remains that the editing of these utterances as found in the present book dates from the time after 586 BC. That any influence of Deutero-Isaiah or later authors can be traced in Jeremiah cannot be shown with any certainty. <a onClick="return mV(\'Jer\',52,\'1-\');">Jer 52</a> was written neither by Jeremiah nor for his book, but is taken from the Books of Kings, and is found there almost verbatim (<a onClick="return mV(\'2Ki\',24,\'1-\');">2Ki 24</a>; <a onClick="return mV(\'2Ki\',25,\'1-\');">25</a>).<P>7. Relation to the Septuagint (Septuagint):<P>A special problem is furnished by the relation of the text of Jeremiah to the Alexandrian version of the Seventy (Septuagint). Not only does the Hebrew form of the book differ from the Greek materially, much more than this is the case in other books of the Old Testament, but the arrangement, too, is a different one. The oracle concerning the heathen nations (<a onClick="return mV(\'Jer\',46,\'1-\');">Jer 46-51</a>) is in the Septuagint found in the middle of <a onClick="return mV(\'Jer\',25,\'1-\');">Jer 25</a>, and that, too, in an altogether different order (namely, <a onClick="return mV(\'Jer\',49,35,46);">49:35ff, 46</A>; <a onClick="return mV(\'Jer\',50,\'1-\');">50</a>; <a onClick="return mV(\'Jer\',51,\'1-\');">51</A>; <a onClick="return mV(\'Jer\',47,\'1-7\');">47:1-7</a>; <a onClick="return mV(\'Jer\',49,\'7-22\');">49:7-22</A>; <a onClick="return mV(\'Jer\',49,\'1-5\',\'28-33\');">49:1-5, 28-33</A>, <a onClick="return mV(\'Jer\',49,\'23-27\');">23-27</A>; <a onClick="return mV(\'Jer\',48,\'1-\');">48</a>). In addition, the readings throughout the book in many cases are divergent, the text in the Septuagint being in general shorter and more compact. The Greek text has about 2,700 Hebrew words less than the authentic Hebrew text, and is thus about one-eighth shorter.<P>As far as the insertion of the addresses against the heathen nations in <a onClick="return mV(\'Jer\',29,\'1-\');">Jer 29</a> is concerned, the Greek order is certainly not more original than is the Hebrew. It rather tears apart, awkwardly, what is united in <a onClick="return mV(\'Jer\',25,\'1-\');">Jer 25</a>, and has probably been caused by a misunderstanding. The words of <a onClick="return mV(\'Jer\',25,13);">25:13</A> were regarded as a hint that here the discourses against the heathen were to follow. Then, too, the order of these discourses in the Greek text is less natural than the one in Hebrew. In regard to the readings of the text, it has been thought that the text of the Septuagint deserves the preference on account of its brevity, and that the Hebrew text had been increased by additions. However, in general, the Greek version is very free, and often is done without an understanding of the subject; and there are reasons to believe that the translator shortened the text, when he thought the style of Jeremiah too heavy. Then, too, where he met with repetitions, he probably would omit; or did so when he found trouble with the matter or the language. This does not deny that his translation in many places may be correct, and that additions may have been made to the Hebrew text.<P>LITERATURE.<P>Calvin, Praelectiones in Librum Prophetiae Jeremiah et Thren, Geneva, 1653; Sebastian Schmidt, Commentarii in libr. prophet. Jeremiah, Argent, 1685. Modern commentary by Hitzig, Ewald, Graf, Nagelsbach, Keil; also Cheyne (Pulpit Comm.), Peake, Duhm, and von Orelli.``131';
