nd on it today is the so-called "Tower of David," built on the foundations of two of Herod\'s great towers.<P>(2) Northwestern Hill:<P>"The northern quarter of the city." This district does not appear to have had any other name in Old Testament or New Testament, though some of the older authorities would place the "Akra" here (see infra). Today it is the "Christian quarter" of Jerusalem, which centers round the Church of the Holy Sepulchre.<P>(3) Northeastern Hill:<P>"Bezetha" or "New City," even now a somewhat sparsely inhabited area, has no name in Biblical literature.<P>(4) Central-eastern Hill:<P>The "third hill" of Josephus, clearly the site of the Temple which, as Josephus says (BJ, V, v), "was built upon a strong hill." In earlier times it was the "threshing-floor of Araunah the Jebusite." On the question whether it has any claims to be the Moriah of <a onClick="return mV(\'Gen\',22,2);">Ge 22:2</a>, as it is called in <a onClick="return mV(\'2Ch\',3,1);">2Ch 3:1</a>, see <a href="study/isbe/search.html?string=MORIAH">MORIAH</A>. The temple hill is also in many of the Hebrew writings called Zion, on which point see <a href="study/isbe/search.html?string=ZION">ZION</a>.<P>(5) Southeastern Hill:<P>This Josephus calls "Akra" and "Lower City," but while on the one hand these names require some elucidation, there are other names which have at one period or another come to be applied to this hill, namely, "City of David," "Zion" and "Ophel." These names for this hill we shall now deal with in order.<P>3. The Akra:<P>In spite of the very definite description of Josephus, there has been considerable difference of opinion regarding the situation of the "Akra." Various parts of the northwestern, the northeastern, the southeastern hills, and even the central-eastern itself, have been suggested by earlier authorities, but instead of considering the various arguments, now largely out of date, for other proposed sites, it will be better to deal with the positive arguments for the southeastern hill. Josephus states that in his day the term "Akra" was applied to the southeastern hill, but in references to the earlier history it is clear that the Akra was not a whole hill, but a definite fortress (akra = "fortress").<P>(1) It was situated on the site, or on part of the site, which was considered in the days of the Maccabees to have been the "City of David." Antiochus Epiphanes (168 BC), after destroying Jerusalem, "fortitled the city of David with a great and strong wall, with strong towers and it became unto them an Akra" (1Macc 1:33-36). The formidable fortress—known henceforth as "the Akra"—became a constant menace to the Jews, until at length, in 142 BC, it was captured by Simon, who not only razed the whole fortress, but, according to Josephus (Ant., XIII, vi, 7; B J, V, iv, 1), actually cut down the hill on which it stood. He says that "they all, labouring zealously, demolished the hill, and ceasing not from the work night and day for three whole years, brought it to a level and even slope, so that the Temple became the highest of all after the Akra and the hill upon which it was built had been removed" (Ant., XIII, vi, 7). The fact that at the time of Josephus this hill was evidently lower than the temple hill is in itself sufficient argument against any theory which would place the Akra on the northwestern or southwestern hills.<P>(2) The Akra was close to the temple (1Macc 13:52), and from its walls the garrison could actually overlook it (1Macc 14:36). Before the hill was cut down it obscured the temple site (same place) .<P>(3) It is identified by Josephus as forming part, at least, of the lower city, which (see below) bordered upon the temple (compare BJ, I, i, 4; V, iv, 1; vi, 1).<P>(4) The Septuagint identifies the Akra with Millo (<a onClick="return mV(\'2Sa\',5,9);">2Sa 5:9</a>; <a onClick="return mV(\'1Ki\',9,\'15-24\');">1Ki 9:15-24</a>; <a onClick="return mV(\'2Ch\',32,5);">2Ch 32:5</a>).<P>Allowing that the original Akra of the Syrians was on the southeastern hill, it is still a matter of some difficulty to determine whereabouts it stood, especially as, if the statements of Josephus are correct, the natural configuration of the ground has been greatly altered. The most prominent point upon the southeastern hill, in the neighborhood of Gihon, appears to have been occupied by the Jebusite fortress of <a href="study/isbe/search.html?string=ZION">ZION</A> (which see), but the site of the Akra can hardly be identical with this, for this became the "City of David," and here were the venerated tombs of David and the Judean kings, which must have been destroyed if this hill was, as Josephus states, cut down. On this and other grounds we must look for a site farther north. Sir Charles Watson (PEFS, 1906, 1907) has produced strong topographical and literary arguments for placing it where the al Aqsa mosque is today; other writers are more inclined to put it farther south, somewhere in the neighborhood of the massive tower discovered by Warren on the "Ophel" wall (see <a href="study/isbe/search.html?string=MILLO">MILLO</A>). If the account of Josephus, written two centuries after the events, is to be taken as literal, then Watson\'s view is the more probable.<P>4. The Lower City:<P>Josephus, as we have seen, identified the Akra of his day with the Lower City. This latter is not a name occurring in the Bible because, as will be shown, the Old Testament name for this part was "City of David." That by Lower City Josephus means the southeastern hill is shown by many facts. It is actually the lowest part of the city, as compared with the "Upper City," Temple Hill and the Bezetha; it is, as Josephus describes, separated from the Upper City by a deep valley—the Tyropeon; this southeastern hill is "double-curved," as Josephus describes, and lastly several passages in his writings show that the Lower City was associated with the Temple on the one end and the Pool of Siloam at the other (compare Ant, XIV, xvi, 2; BJ, II, xvii, 5; IV, ix, 12; VI, vi, 3; vii, 2).<P>In the wider sense the "Lower City" must have included, not only the section of the city covering the southeastern hill up to the temple precincts, where were the palaces (BJ, V, vi, 1; VI, vi, 3), and the homes of the well-to-do, but also that in the valley of the Tyropeon from Siloam up to the "Council House," which was near the northern "first wall" (compare BJ, V, iv, 2), a part doubtless inhabited by the poorest.<P>5. City of David and Zion:<P>It is clear (<a onClick="return mV(\'2Sa\',5,7);">2Sa 5:7</a>; <a onClick="return mV(\'1Ch\',11,5);">1Ch 11:5</a>) that the citadel "Zion" of the Jebusites became the "City of David," or as G. A. Smith calls it, "David\'s Burg," after its capture by the Hebrews. The arguments for placing "Zion" on the southeastern hill are given elsewhere (see <a href="study/isbe/search.html?string=ZION">ZION</A>), but a few acts relevant especially to the "City of David" may be mentioned here: the capture of the Jebusite city by means of the gutter (<a onClick="return mV(\'2Sa\',5,8);">2Sa 5:8</a>), which is most reasonably explained as "Warren\'s Shaft" (see VII); the references to David\'s halt on his flight (<a onClick="return mV(\'2Sa\',15,23);">2Sa 15:23</a>), and his sending Solomon to Gihon to be crowned (<a onClick="return mV(\'1Ki\',1,33);">1Ki 1:33</a>), and the common expression "up," used in describing the transference of the Ark from the City of David to the Temple Hill (<a onClick="return mV(\'1Ki\',8,1);">1Ki 8:1</a>; <a onClick="return mV(\'2Ch\',5,2);">2Ch 5:2</a>; compare <a onClick="return mV(\'1Ki\',9,24);">1Ki 9:24</a>), are all consistent with this view. More convincing are the references to Hezekiah\'s aqueduct which brought the waters of Gihon "down on the west side of the city of David" (<a onClick="return mV(\'2Ch\',32,30);">2Ch 32:30</a>); the mention of the City of David as adjacent to the Pool of Shelah (or Shiloah; compare <a onClick="return mV(\'Isa\',8,6);">Isa 8:6</a>), and the "king\'s garden" in <a onClick="return mV(\'Neh\',3,15);">Ne 3:15</a>, and the position of the Fountain Gate in this passage and <a onClick="return mV(\'Neh\',12,37);">Ne 12:37</a>; and the statement that Manasseh built "an outer wall to the City of David, on the west side of Gihon" in the nachal, i.e. the Kidron valley (<a onClick="return mV(\'2Ch\',33,14);">2Ch 33:14</a>).<P>The name appears to have had a wider significance as the city grew. Originally "City of David" was only the name of the Jebusite fort, but later it became equivalent to the whole southeastern hill. In the same way, Akra was originally the name of the Syrian fort, but the name became extended to the whole southeastern hill. Josephus looks upon "City of David" and "Akra" as synonymous, and applies to both the name "Lower City." For the names Ophel and Ophlas see <a href="study/isbe/search.html?string=OPHEL">OPHEL</A>.<P>V. Excavations and Antiquities.<P>During the last hundred years explorations and excavations of a succession of engineers and archaeologists have furnished an enormous mass of observations for the understanding of the condition of ancient Jerusalem. Some of the more important are as follows: In 1833 Messrs. Bonorni, Catherwood and Arundale made a first thorough survey of the Charam (temple-area), a work which was the foundation of all subsequent maps for over a quarter of a century.<P>1. Robinson:<P>In 1838, and again in 1852, the famous American traveler and divine, E. Robinson, D.D., visited the land as the representative of an American society, and made a series of brilliant topographical investigations of profound importance to all students of the Holy Land, even today.<P>In 1849 Jerusalem was surveyed by Lieuts. Aldrich and Symonds of the Royal Engineers, and the data acquired were used for a map constructed by Van de Vilde and published by T. Tobler.<P>In 1857 an American, J.T. Barclay, published another map of Jerusalem and its environs "from actual and minute survey made on the spot."<P>In 1860-1863 De Vogue in the course of some elaborate researches in Syria explored the site of the sanctuary.<P>2. Wilson and the Palestine Exploration Fund (1865):<P>In 1864-65 a committee was formed in London to consider the sanitary condition of Jerusalem, especially with a view to furnishing the city with a satisfactory water-supply, and Lady Burdett-Coutts gave 500 pounds toward a proper survey of Jerusalem and its environs as a preliminary step. Captain (later Lieutenant-General Sir Charles) Wilson, R.E., was lent by the Ordnance Survey Department of Great Britain for the purpose. The results of this survey, and of certain tentative excavations and observations made at the same time, were so encouraging that in 1865 "The Palestine Exploration Fund" was constituted, "for the purpose of investigating the archaeology, geography, geology, and natural history of the Holy Land."<P>3. Warren and Conder:<P>During 1867-70 Captain (later Lieutenant-General Sir Charles) Warren, R.E., carried out a series of most exciting and original excavations all over the site of Jerusalem, especially around the Charam. During 1872-75 Lieutenant (later Lieutenant-Colonel) Conder, R.E., in the course of the great survey of Western Palestine, made further contributions to our knowledge of the Holy City.<P>4. Maudslay:<P>In 1875 Mr. Henry Maudslay, taking advantage of the occasion of the rebuilding of "Bishop Gobat\'s Boys\' School," made a careful examination of the remarkable rock cuttings which are now more or less incorporated into the school buildings, and made considerable excavations, the results being described in PEFS (April, 1875).<P>In 1881 Professor Guthe made a series of important excavations on the southeastern hill, commonly called "Ophel," and also near the Pool of Siloam; his reports were published in ZDPV, 1882.<P>5. Schick:<P>The same year (1881), the famous Siloam inscription was discovered and was first reported by Herr Baurath Schick, a resident in Jerusalem who from 1866 until his death in 1901 made a long series of observations of the highest importance on the topography of Jerusalem. He had unique opportunities for scientifically examining the buildings in the Charam, and the results of his study of the details of that locality are incorporated in his wonderful Temple model. He also made a detailed report of the ancient aqueducts of the city. Most important of all were the records he so patiently and faithfully kept of the rock levels in all parts of the city\'s site whenever the digging of foundations for buildings or other excavations gave access to the rock. His contributions to the PEF and ZDPV run into hundreds of articles.<P>6. Clermont-Ganneau:<P>M. Clermont-Ganneau, who was resident in Jerusalem in the French consular service, made for many years, from 1880 onward, a large number of acute observations on the archaeology of Jerusalem and its environs, many of which were published by the PEF. Another name honored in connection with the careful study of the topography of Jerusalem over somewhat the same period is that of Selah Merrill, D.D., for many years U.S. consul in Jerusalem.<P>7. Bliss and Dickie:<P>In 1894-97 the Palestine Exploration Fund conducted an elaborate series of excavations with a view to determining in particular the course of the ancient southern walls under the direction of Mr. T.J. Bliss (son of Daniel Bliss, D.D., then president of the Syrian Protestant College, Beirut), assisted by Mr. A.C. Dickie as architect. After picking up the buried foundations of walls at the southeastern corner where "Maudslay\'s scarp" was exposed in the Protestant cemetery, Bliss and Dickie followed them all the way to the Pool of Siloam, across the Tyropeon and on to "Ophel"—and also in other directions. Discoveries of great interest were also made in the neighborhood of the Pool of Siloam (see <a href="study/isbe/search.html?string=SILOAM;+SILOAH;+SHELAH;+SHILOAH">SILOAM</a>).<P>Following upon these excavations a number of private investigations have been made by the Augustinians in a large estate they have acquired on the east side of the traditional hill of Zion.<P>In 1909-1911 a party of Englishmen, under Captain the Honorable M. Parker, made a number of explorations with very elaborate tunnels upon the hill of Ophel, immediately above the Virgin\'s Fount. In the course of their work, they cleaned out the whole Siloam aqueduct, finding some new passages; they reconstructed the Siloam Pool, and they completed Warren\'s previous investigation in the neighborhood of what has been known as "Warren\'s Shaft."<P>8. Jerusalem Archaeological Societies:<P>There are several societies constantly engaged in observing new facts connected with the topography of ancient Jerusalem, notably the School of Archaeology connected with the University of Stephens, under the Dominicans; the American School of Archaeology; the German School of Biblical Archaeology under Professor Dalman, and the Palestine Exploration Fund.<P>VI. The City\'s Walls and Gates.<P>1. The Existing Walls:<P>Although the existing walls of Jerusalem go back in their present form to but the days of Suleiman the Magnificent, circa 1542 AD, their study is an essential preliminary to the understanding of the ancient walls. The total circuit of the modern walls <span class="noTag">is</span> 4,326 yards, or nearly 2 1/8 miles, their average height <span class="noTag">is</span> 35 ft., and they have altogether 35 towers and 8 gates—one of which is walled up. They make a rough square, with the four sides facing the cardinal points of the compass. The masonry is of various kinds, and on every side there are evidences that the present walls are a patchwork of many periods. The northern wall, from near the northwestern angle to some distance east of the "Damascus Gate," lies parallel with, though somewhat inside of, an ancient fosse, and it and the gate itself evidently follow ancient lines. The eastern and western walls, following as they do a general direction along the edges of deep valleys, must be more or less along the course of earlier walls. The eastern wall, from a little south of Stephen\'s Gate to the southeastern angle, contains many ancient courses, and the general line is at least as old as the time of Herod the Great; the stretch of western wall from the so-called "Tower of David" to the southwestern corner is certainly along an ancient line and has persisted through very many centuries. This line of wall was allowed to remain undestroyed when Titus leveled the remainder. At the northwestern angle are some remains known as Kala\'at Jalud ("Goliath\'s castle"), which, though largely medieval, contain a rocky core and some masonry of Herodian times, which are commonly accepted as the relics of the lofty tower Psephinus.<P>2. Wilson\'s Theory:<P>The course of the southern wall has long been a difficulty; it is certainly not the line of wall before Titus; it has none of the natural advantages of the western and eastern walls, and there are no traces of any great rock fosse, such as is to be found on the north. The eastern end is largely built upon the lower courses of Herod\'s southern wall for his enlarged temple-platform, and in it are still to be found walled up the triple, single and double gates which lead up to the Temple. The irregular line followed by the remainder of this wall has not until recent times received any explanation. Sir Charles Wilson (Golgotha and the Holy Sepulchre) suggests the probable explanation that the line of wall from the southwestern to the "Zion Gate" was determined by the legionary camp which stood on the part of the city now covered by the barracks and the Armenian quarter. Allowing that the remains of the first wall on the north and west were utilized for this fortified camp (from 70-132 AD), and supposing the camp to have occupied the area of 50 acres, as was the case with various European Roman camps, whose remains are known, the southern camp wall would have run along the line of the existing southern walls. This line of fortification having been thus selected appears to have been followed through the greater part of the succeeding centuries down to modern times. The line connecting the two extremities of the southern wall, thus determined by the temple-platform and legionary camp, respectively, was probably that first followed by the southern wall of Hadrian\'s city AElia.<P>3. The Existing Gate:<P>Of the 8 existing city gates, on the west side there is but one, Babylonian el Khulil (the "Gate of Hebron"), commonly known to travelers as the Jaffa Gate. It is probably the site of several earlier gates. On the north there are 3 gates, Babylonian Abd\'ul Kamid (named after the sultan who made it) or the "New Gate"; Babylonian el \'amud ("Gate of the Columns"), now commonly called the "Damascus Gate," but more in ancient times known as "St. Stephen\'s Gate," and clearly, from the existing remains, the site of an earlier gateway; and, still farther east, the Babylonian es Sahirah ("Gate of the Plain"), or "Herod\'s Gate." On the east side the only open gate is the Babylonian el \'Asbat ("Gate of the Tribes"), commonly called by native Christians, Babylonian Sitti Miriam ("Gate of the Lady Mary"), but in European guide-books called "St. Stephen\'s Gate." A little farther south, near the northeastern corner of the Charam, is the great walled-up Byzantine Gate, known as Babylonian edition Dahariyeh ("Gate of the Conqueror"), but to Europeans as the "Golden Gate." This structure has been variously ascribed to Justinian and Heraclius, but there are massive blocks which belong to a more ancient structure, and early Christian tradition places the "Beautiful Gate" of the Temple here. In the southern wall are two city gates; one, insignificant and mean, occupies the center of el Wad and is known as Babylonian el Mugharibeh ("Gate of the Moors"), and to Europeans as the "Dung Gate"; the other, which is on the crown of the western hill, traditional Zion, is the important Babylonian Nebi Daoud ("Gate of the Prophet David"), or the "Zion Gate."<P>All these gates assumed their present form at the time of the reconstruction of the walls by Suleiman the Magnificent, but the more important ones occupy the sites of earlier gates. Their names have varied very much even since the times of the Crusaders. The multiplicity of names for these various gates—they all have two or three today—and their frequent changes are worth noticing in connection with the fact that in the Old Testament history some of the gates appear to have had two or more names.<P>As has been mentioned, the course of the present southern wall is the result of Roman reconstruction of the city since the time of Titus. To Warren, Guthe, Maudslay and Bliss we owe a great deal of certain knowledge of its more ancient course. These explorers have shown that in all the pre-Roman period (and at least one period since) the continuation southward of the western and eastern ridges, as well as the wide valley between—an area now but sparsely inhabited—was the site of at once the most crowded life, and the most stirring scenes in the Hebrew history of the city. The sanctity of the Holy Sepulchre has caused the city life to center itself more and more around that sanctuary, thereby greatly confusing the ancient topography for many centuries.<P>4. Buried Remains of Earlier Walls:<P>(1) Warren\'s excavations revealed: (a) a massive masonry wall 46 ft. east of the Golden Gate, which curved toward the west at its northern end, following the ancient rock contours at this spot. It is probable that this was the eastern wall of the city in pre-Herodian times. Unfortunately the existence of a large Moslem cemetery outside the eastern wall of the Charam precludes the possibility of any more excavations in this neighborhood. (b) More important remains in the southeastern hill, commonly known as "Ophel." Here commencing at the southeastern angle of the Charam, Warren uncovered a wall 14 1/2 ft. thick running south for 90 ft. and then southwest along the edge of the hill for 700 ft. This wall, which shows at least two periods of construction, abuts on the sanctuary wall with a straight joint. Along its course were found 4 small towers with a projection of 6 ft. and a face from 22 to 28 ft. broad, and a great corner tower projecting 41 1/2 ft. from the wall and with a face 80 ft. broad. The face of this great tower consists of stones one to two ft. high and 2 or 3 ft. long; it is founded upon rock and stands to the height of 66 ft. Warren considers that this may be ha-mighdal ha-yotse\' or "tower that standeth out" of <a onClick="return mV(\'Neh\',3,25);">Ne 3:25</a>.<P>(2) In 1881 Professor Guthe picked up fragmentary traces of this city-wall farther south, and in the excavations of Captain Parker (1910-1911) further fragments of massive walls and a very ancient gate have been found.<P>(3) Maudslay\'s excavations were on the southwestern hill, on the site occupied by "Bishop Gobat\'s School" for boys, and in the adjoining Anglo-German cemetery. The school is built over a great mass of scarped rock 45 ft. square, which rises to a height of 20 ft. from a platform which surrounds it and with which it is connected by a rock-cut stairway; upon this massive foundation must have stood a great tower at what was in ancient times the southwestern corner of the city. From this point a scarp facing westward was traced for 100 ft. northward toward the modern southwestern angle of the walls, while a rock scarp, in places 40 ft. high on the outer or southern side and at least 14 ft. on the inner face, was followed for 250 ft. eastward until it reached another great rock projection with a face of 43 ft. Although no stones were found in situ, it is evident that such great rock cuttings must have supported a wall and tower of extraordinary strength, and hundreds of massive squared stones belonging to this wall are now incorporated in neighboring buildings.<P>(4) Bliss and Dickie\'s work commenced at the southeastern extremity of Maudslay\'s scarp, where was the above-mentioned massive projection for a tower, and here were found several courses of masonry still in situ. This tower appears to have been the point of divergence of two distinct lines of wall, one of which ran in a direction northeast, skirting the edge of the southeastern hill, and probably joined the line of the modern walls at the ruined masonry tower known as Burj el Kebrit, and another running southeast down toward the Pool of Siloam, along the edge of the Wady er Rababi (Hinnom). The former of these walls cannot be very ancient, because of the occurrence of late Byzantine moldings in its foundations. The coenaculum was included in the city somewhere about 435-450 AD (see IX, 55), and also in the 14th century. Bliss considers it probable that this is the wall built in 1239 By Frederick II, and it is certainly that depicted in the map of Marino Sanuto (1321 AD). Although these masonry remains are thus comparatively late, there were some reasons for thinking that at a much earlier date a wall took a similar direction along the edge of the southwestern hill; and it is an attractive theory, though unsupported by any very definite archaeological evidence, that the wall of Solomon took also this general line. The wall running southeast from the tower, along the edge of the gorge of Hinnom, is historically of much greater importance. Bliss\'s investigations showed that here were remains belonging to several periods, covering altogether considerably over a millennium. The upper line of wall was of fine masonry, with stones 1 ft. by 3 ft. in size, beautifully jointed and finely dressed; in some places this wall was founded upon the remains of the lower wall, in others a layer of debris intervened. It is impossible that this upper wall can be pre-Roman, and Bliss ascribes it to the Empress Eudoxia (see IX, 55). The lower wall rested upon the rock and showed at least 3 periods of construction. In the earliest the stones had broad margins and were carefully jointed, without mortar. This may have been the work of Solomon or one of the early kings of Judah. The later remains are evidently of the nature of repairs, and include the work of the later Judean kings, and of Nehemiah and of all the wall-repairers, down to the destruction in 70 AD. At somewhat irregular intervals along the wall were towers of very similar projection and breadth to those found on Warren\'s wall on the southeastern hill. The wall foundations were traced—except for an interval where they passed under a Jewish cemetery—all the way to the mouth of the Tyropeon valley. The upper wall disappeared (the stones having been all removed for later buildings) before the Jewish cemetery was reached.<P>5. The Great Dam of the Tyropeon:<P>During most periods, if not indeed in all, the wall was carried across the mouth of the Tyropeon valley upon a great dam of which the massive foundations still exist under the ground, some 50 ft. to the east of the slighter dam which today supports the Birket el Kamra (see <a href="study/isbe/search.html?string=SILOAM;+SILOAH;+SHELAH;+SHILOAH">SILOAM</A>). This ancient dam evidently once supported a pool in the mouth of the Tyropeon, and it showed evidences of having undergone buttressing and other changes and repairs. Although it is clear that during the greater part of Jewish history, before and after the captivity, the southern wall of Jerusalem crossed upon this dam, there were remains of walls found which tended to show that at one period, at any rate, the wall circled round the two Siloam pools, leaving them outside the fortifications.<P>6. Ruins of Ancient Gates:<P>In the stretch of wall from "Maudslay\'s Scarp" to the Tyropeon valley remains of 2 city gates were found, and doubtful indications of 2 others. The ruins of the first of these gates are now included in the new extension of the Anglo-German cemetery. The gate had door sills, with sockets, of 4 periods superimposed upon each other; the width of the entrance was 8 ft. 10 inches during the earliest, and 8 ft. at the latest period. The character of the masonry tended to show that the gate belonged to the upper wall, which is apparently entirely of the Christian era. If this is so, this cannot be the "Gate of the Gai" of <a onClick="return mV(\'Neh\',3,13);">Ne 3:13</a>, although the earlier gate may have occupied this site. Bliss suggests as a probable position for this gate an interval between the two contiguous towers IV and V, a little farther to the east.<P>Another gate was a small one, 4 ft. 10 inches wide, marked only by the cuttings in the rock for the door sockets. It lay a little to the west of the city gate next to be described, and both from its position and its insignificance, it does not appear to have been an entrance to the city; it may, as Bliss suggests, have given access to a tower, now destroyed.<P>The second great city gateway was found some 200 ft. south of the Birket el Kamra, close to the southeastern angle of the ancient wall. The existing remains are bonded into walls of the earlier period, but the three superimposed door sills, with their sockets—to be seen uncovered today in situ—mark three distinct periods of long duration. The gate gave access to the great main street running down the Tyropeon, underneath which ran a great rock-cut drain, which probably traversed the whole central valley of the city. During the last two periods of the gate\'s use, a tower was erected—at the exact southeastern angle—to protect the entrance. The earliest remains here probably belong to the Jewish kings, and it is very probable that we have here the gate called by Nehemiah (<a onClick="return mV(\'Neh\',3,13);">3:13</a>) the "Dung Gate." Bliss considered that it might be the "Fountain Gate" (<a onClick="return mV(\'Neh\',3,15);">Ne 3:15</a>), which, however, was probably more to the east, although Bliss could find no remains of it surviving. The repairs and alterations here have been so extensive that its disappearance is in no way surprising. The Fountain Gate is almost certainly identical with the "Gate between the Two Walls," through which Zedekiah and his men of war fled (<a onClick="return mV(\'2Ki\',25,4);">2Ki 25:4</a>; <a onClick="return mV(\'Jer\',39,4);">Jer 39:4</a>; <a onClick="return mV(\'Jer\',52,7);">52:7</a>).<P>7. Josephus\' Description of the Walls:<P>The most definite account of the old walls is that of Josephus (Jewish Wars, V, iv,1,2), and though it referred primarily to the existing walls of his day, it is a convenient one for commencing the historical survey. He describes three walls. The first wall "began on the north, at the tower called Hippicus, and extended as far as the Xistus, and then Joining at the Council House, ended at the western cloister of the temple." On the course of this section of the wall there is no dispute. The tower Hippicus was close to the present Jaffa Gate, and the wall ran from here almost due west to the temple-area along the southern edge of the western arm of the Tyropeon (see III,2,above). It is probable that the Karet edition Dawayeh, a street running nearly parallel with the neighboring "David Street," but high up above it, lies above the foundations of this wall.<P>8. First Wall:<P>It must have crossed the main Tyropeon near the Tarik bab es Silsilel, and joined the western cloisters close to where the Mechkemeh, the present "Council House," is situated.<P>Josephus traces the southern course of the first wall thus: "It began at the same place (i.e. Hippicus), and extended through a place called Bethso to the gate of the Essenes; and after that it went southward, having its bending above the fountain Siloam, when it also bends again toward the east at Solomon\'s Pool, and reaches as far as a certain place which they called \'Ophlas,\' where it was joined to the eastern cloister of the temple." Although the main course of this wall has now been followed with pick and shovel, several points are still uncertain. Bethso is not known, but must have been close to the southwestern angle, which, as we have seen, was situated where "Bishop Gobat\'s School" is today. It is very probably identical with the "Tower of the Furnaces" of <a onClick="return mV(\'Neh\',3,11);">Ne 3:11</a>, while the "Gate of the Essenes" must have been near, if not identical with, the "Gate of the Gai" of <a onClick="return mV(\'Neh\',3,13);">3:13</a>. The description of Josephus certainly seems to imply that the mouth of the Siloam aqueduct ("fountain of Siloam") and the pools were both outside the fortification. We have seen from these indications in the underground remains that this was the case at one period. Solomon\'s Pool is very probably represented by the modern Birket el Khamra. It is clear that the wall from here to the southeastern angle of the temple-platform followed the edge of the southeastern hill, and coincided farther north with the old wall excavated by Warren. As will be shown below, this first wall was the main fortification of the city from the time of the kings of Judah onward. In the time of Josephus, this first wall had 60 towers.<P>9. Second Wall:<P>The Second Wall of Josephus "took its beginning from that gate which they called \'Gennath,\' which belonged to the first wall: it only encompassed the northern quarter of the city and reached as far as the tower Antonia" (same place). In no part of Jerusalem topography has there been more disagreement than upon this wall, both as regards its curve and as regards its date of origin. Unfortunately, we have no idea at all where the "Gate Gennath" was. The Tower Antonia we know. The line must have passed in a curved or zigzag direction from some unknown point on the first wall, i.e. between the Jaffa Gate and the Charam to the Antonia. A considerable number of authorities in the past and a few careful students today would identify the general course of this wall with that of the modern northern wall. The greatest objections to this view are that no really satisfactory alternative course has been laid down for the third wall (see below), and that it must have run far north of the Antonia, a course which does not seem to agree with the description of Josephus, which states that the wall "went up" to the Antonia. On the other hand, no certain remains of any city wall within the present north wall have ever been found; fragments have been reported by various observers (e.g. the piece referred to as forming the eastern wall of the so-called "Pool of Hezekiah"; see VII, ii, below), but in an area so frequently desolated and rebuilt upon—where the demand for squared stones must always have been great—it is probable that the traces, if surviving at all, are very scanty. This is the case with the south wall excavated by Bliss (see VI), and that neighborhood has for many centuries been unbuilt upon. It is quite probable that the area included within the second wall may have been quite small, merely the buildings which clustered along the sides of the Tyropeon. Its 40 towers may have been small and built close together, because the position was, from the military aspect, weak. It must be remembered that it was the unsatisfactory state of the second wall which necessitated a third wall. There is no absolute reason why it may not have excluded the greater part of the northwestern hill—and with it the site of the Church of the Holy Sepulchre—but there is no proof that it did. The date of the second wall is unknown (see below).<P>10. Third Wall:<P>This third wall, which was commenced after the time of Christ by Herod Agrippa I, is described in more detail by Josephus. It was begun upon an elaborate plan, but was not finished in its original design because Agrippa feared Claudius Caesar, "lest he should suspect that so strong a wall was built in order to make some innovation in public affairs" (Jewish Wars, V, iv, 2). It, however, at the time of the siege, was of a breadth of over 18 ft., and a height of 40 ft., and had 90 massive towers. Josephus describes it as beginning at the tower Hippicus (near the Jaffa Gate), "where it reached as far as the north quarter of the city, and the tower Psephinus." This mighty tower, 135 ft. high, was at the northwestern corner and overlooked the whole city. From it, according to Josephus (Jewish Wars, V, vi, 3), there was a view of Arabia (Moab) at sunrising, and also of "the utmost limits of the Hebrew possessions at the Sea westward." From this corner the wall turned eastward until it came over against the monuments of Helene of Adiabene, a statement, however, which must be read in connection with another passage (Ant., XX, iv, 3), where it says that this tomb "was distant no more than 3 furlongs from the city of Jerusalem." The wall then "extended to a very great length" and passed by the sepulchral caverns of the kings—which may well be the so-called "Solomon\'s Quarries," and it then bent at the "Tower of the Corner," at a monument which is called the Monument of the Fuller (not identified), and joined to the old wall at the Kidron valley.<P>The commonly accepted theory is that a great part of this line of wall is that pursued by the modern north wall, and Kal\'at el Jalud, or rather the foundation of it, that marks the site of Psephinus. The Damascus Gate is certainly on the line of some earlier gate. The "Tower of the Corner" was probably about where the modern Herod\'s Gate is, or a little more to the east, and the course of the wall was from here very probably along the southern edge of the "St. Anne\'s Valley," joining on to the northeast corner of the Charam a little south of the present Stephen\'s Gate. This course of the wall fits in well with the description of Josephus. If the so-called "Tombs of the Kings" are really those of Queen Helena of Adiabene and her family, then the distance given as 3 furlongs is not as far out as the distance to the modern wall; the distance is actually 3 1/2 furlongs.<P>Others, following the learned Dr. Robinson, find it impossible to believe that the total circuit of the walls was so small, and would carry the third wall considerably farther north, making the general line of the modern north wall coincide with the second wall of Josephus. The supporters of this view point to the description of the extensive view from Psephinus, and contend that this presupposed a site on still higher ground, e.g. where the present Russian buildings now are. They also claim that the statement that the wall came "over against" the monument of Queen Helena certainly should mean very much nearer that monument than the present walls. Dr. Robinson and others who have followed him have pointed to various fragments which they claim to have been pieces of the missing wall. The present writer, after very many years\' residence in Jerusalem, watching the buildings which in the last 25 years have sprung up over the area across which this line of wall is claimed to have run, has never seen a trace of wall foundations or of fosse which was in the very least convincing; while on the other hand this area now being rapidly covered by the modern suburb of Jerusalem presents almost everywhere below the surface virgin rock. There is no evidence of any more buildings than occasional scattered Roman villas, with mosaic floors. The present writer has rather unwillingly come to the opinion that the city walls were never farther north than the line they follow today. With respect to the objection raised that there could not possibly have been room enough between the two walls for the "Camp of the Assyrians," where Titus pitched his camp (Jewish Wars, V, vii, 3), any probable line for the second wall would leave a mean of 1,000 ft. between the two walls, and in several directions considerably more. The probable position of the "Camp of the Assyrians" would, according to this view, be in the high ground (the northwestern hill) now occupied by the Christian quarter of the modern city. The question of what the population of Jerusalem was at this period is discussed in IX,49,below. For the other great buildings of the city at this period, see also IX, 43-44, below.<P>11. Date of Second Wall:<P>Taking then the walls of Jerusalem as described by Josephus, we may work backward and see how the walls ran in earlier periods. The third wall does not concern us any more, as it was built after the Crucifixion. With respect to the second wall, there is a great deal of difference of opinion regarding its origin. Some consider, like Sir Charles Watson, that it does not go back earlier than the Hasmoneans; whereas others (e.g. G.A. Smith), because of the expression in <a onClick="return mV(\'2Ch\',32,5);">2Ch 32:5</a> that Hezekiah, after repairing the wall, raised "another wall without," think that this wall goes back as far as this monarch. The evidence is inconclusive, but the most probable view seems to be that the "first wall," as described by Josephus, was the only circuit of wall from the kings of Judah down to the 2nd century BC, and perhaps later.<P>12. Nehemiah\'s Account of the Walls:<P>The most complete Scriptural description we have of the walls and gates of Jerusalem is that given by Nehemiah. His account is valuable, not only as a record of what he did, but of what had been the state of the walls before the exile. It is perfectly clear that considerable traces of the old walls and gates remained, and that his one endeavor was to restore what had been before—even though it produced a city enclosure much larger than necessary at his time. The relevant passages are <a onClick="return mV(\'Neh\',2,\'13-15\');">Ne 2:13-15</a>, the account of his night ride; <a onClick="return mV(\'Neh\',3,\'1-.2\');">3:1-32</a>, the description of the rebuilding; and <a onClick="return mV(\'Neh\',12,\'31-39\');">12:31-39</a>, the routes of the two processions at the dedication.<P>13. Valley Gate:<P>In the first account we learn that Nehemiah went out by night by the <a href="study/isbe/search.html?string=VALLEY+GATE ">VALLEY GATE</A> (which see), or Gate of the Gai, a gate (that is, opening) into the Gai Hinnom, and probably at or near the gate discovered by Bliss in what is now part of the Anglo-German cemetery; he passed from it to the Dung Gate, and from here viewed the walls of the city.<P>14. Dung Gate:<P>This, with considerable assurance, may be located at the ruined foundations of a gate discovered by Bliss at the southeastern corner of the city. The line of wall clearly followed the south edge of the southwestern hill from the Anglo-German cemetery to this point. He then proceeded to the Fountain Gate, the site of which has not been recovered, but, as there must have been water running out here (as today) from the mouth of the Siloam tunnel, is very appropriately named here.<P>15. Fountain Gate:<P>Near by was the <a href="study/isbe/search.html?string=KING\'S+POOL">KING\'S POOL</a> (which see), probably the pool—now deeply buried—which is today represented by the Birket el Kamra. Here Nehemiah apparently thought of turning into the city, "but there was no place for the beast that was under me to pass" (<a onClick="return mV(\'Neh\',2,14);">2:14</a>), so he went up by the Nachal (Kidron), viewed the walls from there, and then retraced his steps to the Valley Gate. There is another possibility, and that is that the King\'s Pool was the pool (which certainly existed) at Gihon, in which case the Fountain Gate may also have been in that neighborhood.<P>All the archaeological evidence is in favor of the wall having crossed the mouth of the Tyropeon by the great dam at this time, and the propinquity of this structure to the Fountain Gate is seen in <a onClick="return mV(\'Neh\',3,15);">Ne 3:15</a>, where we read that Shallum built the Fountain Gate "and covered it, and set up the doors thereof...and the bars thereof, and the wall of the pool of Shelah (see <a href="study/isbe/search.html?string=SILOAM;+SILOAH;+SHELAH;+SHILOAH">SILOAM</a>) by the <a href="study/isbe/search.html?string=KING\'S+GARDEN">KING\'S GARDEN</A> (which see), even unto the stairs that go down from the city of David." All these localities were close together at the mouth of el Wad.<P>Passing from here we can follow the circuit of the city from the accounts of the rebuilding of the walls in <a onClick="return mV(\'Neh\',3,15);">Ne 3:15</a>f. The wall from here was carried "over against the sepulchres of David," which we know to have stood in the original "City of David" above Gihon, past "the pool that was made," and "the house of the Gibborim" (mighty men)—both unknown sites. It is clear that the wall is being carried along the edge of the southeastern hill toward the temple. We read of two angles in the wall—both needed by the geographical conditions—the high priest\'s house, of "the tower that standeth out" (supposed to have been unearthed by Warren), and the wall of the <a href="study/isbe/search.html?string=OPHEL">OPHEL</A> (which see).<P>16. Water Gate:<P>There is also mention of a Water Gate in this position, which is just where one would expect a road to lead from the temple-area down to Gihon. From the great number of companies engaged in building, it may be inferred that all along this stretch of wall from the Tyropeon to the temple, the destruction of the walls had been specially great.<P>17. Horse Gate:<P>Proceeding north, we come to the Horse Gate. This was close to the entry to the king\'s house (<a onClick="return mV(\'2Ki\',11,16);">2Ki 11:16</a>; <a onClick="return mV(\'2Ch\',23,15);">2Ch 23:15</a>; <a onClick="return mV(\'Jer\',31,40);">Jer 31:40</a>). The expression used, "above" the Horse Gate, may imply that the gate itself may have been uninjured; it may have been a kind of rock-cut passage or tunnel. It cannot have been far from the present southeastern angle of the city. Thence "repaired the priests, every one over against his own house"—the houses of these people being to the east of the temple. Then comes the Gate of Hammiphkad (see <a href="study/isbe/search.html?string=HAMMIPHKAD,+GATE+OF">HAMMIPHKAD, GATE OF</a>), the ascent (or "upper chamber," margin) of the corner, and finally the <a href="study/isbe/search.html?string=SHEEP+GATE">SHEEP GATE</a> (which see), which was repaired by the goldsmiths and merchants.<P>18. Sheep Gate:<P>This last gate was the point from which the circuit of the repairs was traced. The references, <a onClick="return mV(\'Neh\',3,1,31);">Ne 3:1, 31</a>; <a onClick="return mV(\'Neh\',12,39);">12:39</a>, clearly show that it was at the eastern extremity of the north wall.<P>The details of the gates and buildings in the north wall as described by Nehemiah, are difficult, and certainty is impossible; this side must always necessarily have been the weak side for defense because it was protected by no, or at best by very little, natural valley. As has been said, we cannot be certain whether Nehemiah is describing a wall which on its western two-thirds corresponded with the first or the second wall of Josephus. Taking the first theory as probable, we may plan it as follows: west of the Sheep Gate two towers are mentioned (<a onClick="return mV(\'Neh\',3,1);">Ne 3:1</a>; <a onClick="return mV(\'Neh\',12,39);">12:39</a>). Of these <a href="study/isbe/search.html?string=HANANEL">HANANEL</a> (which see) was more easterly than <a href="study/isbe/search.html?string=HAMMEAH">HAMMEAH</a> (which see), and, too, it would appear from <a onClick="return mV(\'Zec\',14,10);">Zec 14:10</a> to have been the most northerly point of the city. Probably then two towers occupied the important hill where afterward stood the fortress Baris and, later, the Antonia. At the Hammeah tower the wall would descend into the Tyropeon to join the eastern extremity of the first wall where in the time of Josephus stood the Council House (BJ, V, iv, 2).<P>19. Fish Gate:<P>It is generally considered that the <a href="study/isbe/search.html?string=FISH+GATE">FISH GATE</a> (which see) (<a onClick="return mV(\'Neh\',3,3);">Ne 3:3</a>; <a onClick="return mV(\'Neh\',12,39);">12:39</a>; <a onClick="return mV(\'Zep\',1,10);">Ze 1:10</a>; <a onClick="return mV(\'2Ch\',33,14);">2Ch 33:14</a>) stood across the Tyropeon in much the same way as the modern Damascus Gate does now, only considerably farther south. It was probably so called because here the men of Tyre sold their fish (<a onClick="return mV(\'Neh\',13,16);">Ne 13:16</a>). It is very probably identical with the "Middle Gate" of <a onClick="return mV(\'Jer\',39,3);">Jer 39:3</a>. With this region are associated the <a href="study/isbe/search.html?string=MISHNEH">MISHNEH</a> (which see) or "second quarter" (<a onClick="return mV(\'Zep\',1,10);">Ze 1:10</a> margin) and the <a href="study/isbe/search.html?string=MAKTESH">MAKTESH</a> (which see) or "mortar" (<a onClick="return mV(\'Zep\',1,11);">Ze 1:11</a>).<P>20. "Old Gate":<P>The next gate westward, after apparently a considerable interval, is translated in English Versions of the Bible the "<a href="study/isbe/search.html?string=OLD+GATE">OLD GATE</a>" (which see), but is more correctly the "Gate of the old ...."; what the word thus qualified is, is doubtful. <a onClick="return mV(\'Neh\',3,6);">Ne 3:6</a> margin suggests "old city" or "old wall," whereas Mitchell (Wall of Jerusalem according to the Book of Nehemiah) proposes "old pool," taking the pool in question to be the so-called "Pool of Hezekiah." According to the view here accepted, that the account of Nehemiah refers only to the first wall, the expression "old wall would be peculiarly suitable, as here must have been some part of that first wall which went back unaltered to the time of Solomon. The western wall to the extent of 400 cubits had been rebuilt after its destruction by Jehoash, king of Israel (see IX, 12, below), and Manasseh had repaired all the wall from Gihon round north and then west to the Fish Gate. This gate has also been identified with the Sha\'ar ha-Pinnah, or "Corner Gate," of <a onClick="return mV(\'2Ki\',14,13);">2Ki 14:13</a>; <a onClick="return mV(\'2Ch\',25,23);">2Ch 25:23</a>; <a onClick="return mV(\'Jer\',31,38);">Jer 31:38</a>; <a onClick="return mV(\'Zec\',14,10);">Zec 14:10</a>, and with the Sha\'ar ha-Ri\'shon, or "First Gate," of <a onClick="return mV(\'Zec\',14,10);">Zec 14:10</a>, which is identified as the same as the Corner Gate; indeed ri\'shon ("first") is probably a textual error for yashan ("old"). If this is so, this "Gate of the Old" or "Corner Gate" must have stood near the northwestern corner of the city, somewhere near the present Jaffa Gate.<P>21. Gate of Ephraim:<P>The next gate mentioned is the Gate of Ephraim (<a onClick="return mV(\'Neh\',12,39);">Ne 12:39</a>), which, according to <a onClick="return mV(\'2Ki\',14,13);">2Ki 14:13</a>; <a onClick="return mV(\'2Ch\',25,23);">2Ch 25:23</a>, was 400 cubits or 600 ft. from the Corner Gate. This must have been somewhere on the western wall; it is scarcely possible to believe, as some writers would suggest, that there could have been no single gate between the Corner Gate near the northwestern corner and the Valley Gate on the southern wall.<P>22. Tower of the Furnaces:<P>The "Broad Wall" appears to correspond to the southern stretch of the western wall as far as the "Tower of the Furnaces" or ovens, which was probably the extremely important corner tower now incorporated in "Bishop Gobat\'s School." This circuit of the walls satisfies fairly well all the conditions; the difficulties are chiefly on the north and west. It is a problem how the Gate of Ephraim comes to be omitted in the account of the repairs, but G.A. Smith suggests that it may be indicated by the expression, "throne of the governor beyond the river" (<a onClick="return mV(\'Neh\',3,7);">Ne 3:7</a>). See, however, Mitchell (loc. cit.). If theory be accepted that the second wall already existed, the Corner Gate and the Fish Gate will have to be placed farther north.<P>23. The Gate of Benjamin:<P>In Old Testament as in later times, some of the gates appear to have received different names at various times. Thus the Sheep Gate, at the northeastern angle, appears to be identical with the Gate of Benjamin or Upper Gate of Benjamin (<a onClick="return mV(\'Jer\',20,2);">Jer 20:2</a>; <a onClick="return mV(\'Jer\',37,13);">37:13</a>; <a onClick="return mV(\'Jer\',38,7);">38:7</a>); the prophet was going, apparently, the nearest way to his home in Anathoth. In <a onClick="return mV(\'Zec\',14,10);">Zec 14:10</a> the breadth of the city is indicated, where the prophet writes, "She shall be lifted up, and shall dwell in her place, from Benjamin\'s gate unto the place of the first gate, unto the corner gate."<P>24. Upper Gate of the Temple:<P>The Upper Gate of the Temple (<a onClick="return mV(\'2Ki\',15,35);">2Ki 15:35</a>; <a onClick="return mV(\'2Ch\',27,3);">2Ch 27:3</a>; compare <a onClick="return mV(\'2Ch\',23,20);">2Ch 23:20</a>; <a onClick="return mV(\'Eze\',9,2);">Eze 9:2</a>) is probably another name for the same gate. It must be remembered the gates were, as excavations have shown us, reduced to a minimum in fortified sites: they were sources of weakness.<P>The general outline of the walls and gates thus followed is in the main that existing from Nehemiah back until the early Judean monarchy, and possibly to Solomon.<P>25. The Earlier Walls:<P>Of the various destructions and repairs which occurred during the time of the monarchy, a sufficient account is given in IX below, on the history. Solomon was probably the first to enclose the northwestern hill within the walls, and to him usually is ascribed all the northern and western stretch of the "First Wall"; whether his wall ran down to the mouth of the Tyropeon, or only skirted the summit of the northwestern hill is uncertain, but the latter view is probable. David was protected by the powerful fortifications of the Jebusites, which probably enclosed only the southeastern hill; he added to the defenses the fortress <a href="study/isbe/search.html?string=MILLO">MILLO</a> (which see). It is quite possible that the original Jebusite city had but one gate, on the north (<a onClick="return mV(\'2Sa\',15,2);">2Sa 15:2</a>), but the city must have overflowed its narrow limits during David\'s reign and have needed an extended and powerful defense, such as Solomon made, to secure the capital. For the varied history and situation of the walls in the post-Biblical period, see IX ("History"), below.``117';
isbe[4992]='Jerusalem, 3`VII. Antiquarian Remains Connected with the Water-Supply.<P>In a city like Jerusalem, where the problem of a water-supply must always have been one of the greatest, it is only natural that some of the most ancient and important works should have centered round it. The three sources of supply have been<P class="in15">(1) springs,<P class="in15">(2) cisterns,<P class="in15">(3) aqueducts.<P>1. Gihon: The Natural Spring:<P>(1) The natural springs have been described in II, 3; but connected with them, and especially with the city\'s greatest and most venerated source, the Gihon, there are certain antiquarian remains of great interest.<P>(a) The "Virgin\'s Fount," ancient Gihon, arises, as has been described (II, 3), in a rocky cleft in the Kidron valley bottom; under natural conditions the water would run along the valley bed, now deeply buried under debris of the ancient city, and doubtless when the earliest settlers made their dwellings in the caves (which have been excavated) on the sides of the valley near the spring, they and their flocks lived on the banks of a stream of running water in a sequestered valley among waterless hills. From, however, a comparatively early period—at the least 2000 BC—efforts were made to retain some of the water, and a solid stone dam was built which converted the sources into a pool of considerable depth. Either then, or somewhat later, excavations were made in the cliffs overhanging the pool, whereby some at least of these waters were conducted, by means of a tunnel, into the heart of the southeastern hill, "Ophel," so that the source could be reached from within the city walls. There are today two systems of tunnels which are usually classed as one under the name of the "Siloam aqueduct," but the two systems are probably many centuries apart in age.<P>2. The Aqueduct of the Canaanites:<P>The older tunnel begins in a cave near the source and then runs westward for a distance of 67 ft.; at the inner end of the tunnel there is a perpendicular shaft which ascends for over 40 ft. and opens into a lofty rock-cut passage which runs, with a slight lateral curvature, to the north, in the direction of the surface. The upper end has been partially destroyed, and the roof, which had fallen in, was long ago partially restored by a masonry arch. At this part of the passage the floor is abruptly interrupted across its whole width by a deep chasm which Warren partially excavated, but which Parker has since conclusively shown to end blindly. It is clear that this great gallery, which <span class="noTag">is</span> 8 to 9 ft. wide, and in places as high or higher, was constructed (a natural cavern possibly utilized in the process) to enable the inhabitants of the walled-in city above it to reach the spring. It is in fact a similar work to the great water-passage at <a href="study/isbe/search.html?string=GEZER">GEZER</a> (which see), which commenced in a rock-cut pit 26 ft. deep and descended with steps, to a depth of 94 ft. 6 inches below the level of the rock surface; the sloping passage was 23 ft. high and 13 ft. broad. This passage which could be dated with certainty as before 1500 BC, and almost certainly as early as 2000 BC, was cut out with flint knives and apparently was made entirely to reach a great underground source of water.<P>3. Warren\'s Shaft:<P>The discovery of this Gezer well-passage has thrown a flood of light upon the "Warren\'s Shaft" in Jerusalem, which would appear to have been made for an exactly similar purpose. The chasm mentioned before may have been an effort to reach the source from a higher point, or it may have been made, or later adapted, to prevent ingress by means of the system of tunnels into the city. This passage is in all probability the "watercourse" (tsinnor) of <a onClick="return mV(\'2Sa\',5,8);">2Sa 5:8</a> up which, apparently, Joab and his men (<a onClick="return mV(\'1Ch\',11,6);">1Ch 11:6</a>) secretly made their way; they must have waded through the water at the source, ascended the perpendicular shaft (a feat performed in 1910 by some British officers without any assistance from ladders), and then made their way into the heart of the city along the great tunnel. Judging by the similar Gezer water tunnel, this great work may not only have existed in David\'s time, but may have been constructed as much as 1,000 years before.<P>4. Hezekiah\'s "Siloam" Aqueduct:<P>The true Siloam tunnel is a considerably later work. It branches off from the older aqueduct at a point 67 ft. from the entrance, and after running an exceedingly winding course of 1,682 ft., it empties itself into the Pool of Siloam (total length 1,749 ft.). The whole canal is rock cut; it <span class="noTag">is</span> 2 to 3 ft. wide, and varies in height from 16 ft. at the south end to 4 ft. 6 inches at the lowest point, near the middle. The condition of this tunnel has recently been greatly changed through Captain Parker\'s party having cleared out the accumulated silt of centuries; before this, parts of the channel could be traversed only with the greatest difficulty and discomfort. The primitive nature of this construction is shown by the many false passages made, and also by the extensive curves which greatly add to its length. This latter may also be partly due to the workmen following lines of soft strata. M. Clermont-Ganneau and others have thought that one or more of the great curves may have been made deliberately to avoid the tombs of the kings of Judah. The method of construction of the tunnel is narrated in the Siloam Inscription (see <a href="study/isbe/search.html?string=SILOAM;+SILOAH;+SHELAH;+SHILOAH">SILOAM</A>). It was begun simultaneously from each end, and the two parties met in the middle. It is a remarkable thing that there is a difference of level of only one foot at each end; but the lofty height of the southern end is probably due to a lowering of the floor here after the junction was effected. It is practically certain that this great work is that referred to in <a onClick="return mV(\'2Ki\',20,20);">2Ki 20:20</a>: "Now the rest of the acts of Hezekiah, and all his might, and how he made the pool, and the conduit, and brought water into the city, are they not written in the book of the chronicles of the kings of Judah?" And in <a onClick="return mV(\'2Ch\',32,30);">2Ch 32:30</a>: "This same Hezekiah also stopped the upper spring of the waters of Gihon, and brought them straight down on the west side of the city of David."<P>5. Other Aqueducts at Gihon:<P>In addition to these two conduits, which have a direct Scriptural interest, there are remains of at least two other aqueducts which take their origin at the Virgin\'s Fount—one a channel deeply cut in rock along the western sides of the Kidron valley, found by Captain Parker, and the other a built channel, lined with very good cement, which takes its rise at a lower level than any of the other conduits close to the before-mentioned rocky cleft from which the water rises, and runs in a very winding direction along the western side of the Kidron. This the present writer has described in PEFS, 1902. One of these, perhaps more probably the former, may be the conduit which is referred to as Shiloah (shiloach), or "conducted" (<a onClick="return mV(\'Isa\',8,6);">Isa 8:6</a>), before the construction of Hezekiah s work (see <a href="study/isbe/search.html?string=SILOAM;+SILOAH;+SHELAH;+SHILOAH">SILOAM</a>).<P>There are other caves and rock-cut channels around the ancient Gihon which cannot fully be described here, but which abundantly confirm the sanctity of the site.<P>6. Bir Eyyub:<P>(b) Bir Eyyub has a depth of 125 ft.; the water collects at the bottom in a large rock-hewn chamber, and it is clear that it has been deepened at some period, because at the depth of 113 ft. there is a collecting chamber which is now replaced by the deeper one. Various rock-cut passages or staircases were found by Warren in the neighborhood of this well.<P>7. Varieties of Cisterns:<P>(2) The cisterns and tanks.—Every ancient site in the hill country of Palestine is riddled with cisterns for the storage of rain water. In Jerusalem for very many centuries the private resident has depended largely upon the water collected from the roof of his house for all domestic purposes. Such cisterns lie either under or alongside the dwelling. Many of the earliest of these excavations are bottle-shaped, with a comparatively narrow mouth cut through the hard Mizzeh and a large rounded excavation made in the underlying Melekeh (see II, 1 above). Other ancient cisterns are cavities hewn in the rock, of irregular shape, with a roof of harder rock and often several openings. The later forms are vaulted over, and are either cut in the rock or sometimes partially built in the superlying rubbish.<P>For more public purposes large cisterns were made in the Charam, or temple-area. Some 3 dozen are known and planned; the largest is calculated to contain 3,000,000 gallons. Such structures were made largely for the religious ritual, but, as we shall see, they have been supplied by other sources than the rainfall. In many parts of the city open tanks have been constructed, such a tank being known in Arabic as a birkeh, or, followed by a vowel, birket. With most of these there is considerable doubt as to their date of construction, but probably none of them, in their present form at any rate, antedates the Roman period.<P>8. Birket Israel:<P>Within the city walls the largest reservoir is the Birket Israel which extends from the northeastern angle of the Charam westward for 360 ft. It is 125 ft. wide and was originally 80 ft. deep, but has in recent years been largely filled up by the city\'s refuse. The eastern and western ends of this pool are partially rock-cut and partly masonry, the masonry of the former being a great dam 45 ft. thick, the lower part of which is continuous with the ancient eastern wall of the temple-area. The sides of the pool are entirely masonry because this reservoir is built across the width of the valley referred to before (III, 2) as "St. Anne\'s Valley." Other parts of this valley are filled with debris to the depth of 100 ft. The original bottom of the reservoir is covered with a layer of about 19 inches of very hard concrete and cement. There was a great conduit at the eastern end of the pool built of massive stones, and connected with the pool by a perforated stone with three round holes 5 1/2 inches in diameter. The position of this outlet shows that all water over a depth of 22 ft. must have flowed away. Some authorities consider this pool to have been pre-exilic. By early Christian pilgrims it was identified as the "Sheep Pool" of <a onClick="return mV(\'Jhn\',5,2);">Joh 5:2</a>, and at a later period, until quite recent times, it was supposed to have been the Pool of Bethesda.<P>9. Pool of Bethesda:<P>The discovery, a few years ago, of the long-lost Piscina in the neighborhood of the "Church of Anne," which was without doubt the Pool of Bethesda of the 5th century AD, has caused this identification to be abandoned.<P>See <a href="study/isbe/search.html?string=BETHESDA">BETHESDA</A>.<P>10. The Twin Pools:<P>To the west of the Birket Israel are the "twin pools" which extend under the roadway in the neighborhood of the "Ecce Homo" arch. The western one is 165 ft. by 20 ft. and the eastern 127 ft. by 20 ft. M. Clermont-Ganneau considers them to be identical with the Pool Struthius of Josephus (BJ, V, xi, 4), but others, considering that they are actually made in the fosse of the Antonia, give them a later date of origin. In connection with these pools a great aqueduct was discovered in 1871, 2 1/2-3 ft. wide and in places 12 ft. high, running from the neighborhood of the Damascus Gate—but destroyed farther north—and from the pools another aqueduct runs in the direction of the Charam.<P>11. Birket Hammam el Batrak:<P>On the northwestern hill, between the Jaffa Gate and the Church of the Sepulchre there is a large open reservoir, known to the modern inhabitants of the city as Birket Kammam el Batrak, "the Pool of the Patriarch\'s Bath." It is 240 ft. long (north to south), 144 ft. broad and 19-24 ft. deep. The cement lining of the bottom is cracked and practically useless. The eastern wall of this pool is particularly massive, and forms the base of the remarkably level street Karet en Nasara, or "Christian Street"; it is a not improbable theory that this is actually a fragment of the long-sought "second" wall. If so, the pool, which is proved to have once extended 60 ft. farther north, may have been constructed originally as part of the fosse. On the other hand, this pool appears to have been the Amygdalon Pool, or "Pool of the Tower" (berekhath ha-mighdalin), mentioned by Josephus (Jewish Wars, V, xi, 4), which was the scene of the activities of the 10th legion, and this seems inconsistent with the previous theory, as the events described seem to imply that the second wall ran outside the pool. The popular travelers\' name, "Pool of Hezekiah," given to this reservoir is due to theory, now quite discredited, that this is the pool referred to in <a onClick="return mV(\'2Ki\',20,20);">2Ki 20:20</a>, "He made the pool, and the conduit, and brought water into the city." Other earlier topographists have identified it as the "upper pool" of <a onClick="return mV(\'Isa\',7,3);">Isa 7:3</a>; <a onClick="return mV(\'Isa\',36,2);">36:2</a>.<P>12. Birket Mamilla:<P>The Birket Kammam el Batrak is supplied with water from the Birket Mamilla, about 1/2 mile to the west. This large pool, 293 ft. long by 193 ft. broad and 19 1/2 ft. deep, lies in the midst of a large Moslem cemetery at the head of the Wady Mes, the first beginning of the Wady er Rababi (Hinnom). The aqueduct which connects the two pools springs from the eastern end of the Birket Mamilla, runs a somewhat winding course and enters the city near the Jaffa Gate. The aqueduct is in bad repair, and the water it carries, chiefly during heavy rain, is filthy. In the Middle Ages it was supposed that this was the "Upper Pool of Gihon" (see <a href="study/isbe/search.html?string=GIHON">GIHON</A>), but this and likewise the "highway of the <a href="study/isbe/search.html?string=FULLER\'S+FIELD">FULLER\'S FIELD</a>" (which see) are now located elsewhere. Wilson and others have suggested that it is the "Serpent\'s Pool" of Josephus (Jewish Wars, V, iii, 2). Titus leveled "all the places from Scopus to Herod\'s monument which adjoins the pool called that of the Serpent." Like many such identifications, there is not very much to be said for or against it; it is probable that the pool existed at the time of the siege. It is likely that this is the Beth Memel of the Talmud (the Babylonian Talmud, \'Erubin 51 b; Sanhedrin 24 a; Bere\'shith Rabba\' 51).<P>13. Birket es Sultan:<P>The Birket es Sultan is a large pool—or, more strictly speaking, enclosure—555 ft. north and south by 220 ft. east and west. It is bounded on the west and north by a great curve of the low-level aqueduct as it passes along and then across the Wady er Rababi. The southern side consists of a massive dam across the valley over which the Bethlehem carriage road runs. The name may signify either the "great" pool or be connected with the fact that it was reconstructed in the 16th century by the sultan Suleiman ibn Selim, as is recorded on an inscription upon a wayside fountain upon the southern wall. This pool is registered in the cartulary of the Holy Sepulchre as the Lacus Germani, after the name of a knight of Germanus, who built or renovated the pool in 1176 AD. Probably a great part of the pool is a catchment area, and the true reservoir is the rock-cut birkeh at the southern end, which has recently been cleaned out. It is extremely difficult to believe that under any conditions any large proportion of the whole area could ever have even been filled. Today the reservoir at the lower end holds, after the rainy season, some 10 or 12 ft. of very dirty water, chiefly the street drainage of the Jaffa road, while the upper two-thirds of the enclosure is used as a cattle market on Fridays. The water is now used for sprinkling the dusty roads in dry seasons.<P>The Pool of Siloam and the now dry Birket el Kamra are described under <a href="study/isbe/search.html?string=SILOAM;+SILOAH;+SHELAH;+SHILOAH">SILOAM</A> (which see).<P>There are other tanks of considerable size in and around the city, e.g. the Birket Sitti Miriam, near "St. Stephen\'s Gate," an uncemented pool in the Wady Joz, connected with which there is a rockcut aqueduct and others, but they are not of sufficient historical importance to merit description here.<P>14. "Solomon\'s Pools":<P>(3) The conduits bringing water to the city from a distance are called the "high-level" and "low-level" aqueducts respectively, because they reached the city at different levels—the former probably somewhere near the present Jaffa Gate, the latter at the temple-platform.<P>15. Low-Level Aqueduct:<P>The low-level aqueduct which, though out of repair, can still be followed along its whole course, conveyed water from three great pools in the Wady \'Artas, 7 miles south of Jerusalem. They are usually called "Solomon\'s pools," in reference perhaps partly to <a onClick="return mV(\'Ecc\',2,6);">Ec 2:6</a>: "I made me pools o water, to water therefrom the forest where trees were reared," but as any mighty work in Palestine is apt to be referred to the wise king of Israel, much stress cannot be laid on the name. These three storage reservoirs are constructed across the breadth of the valley, the lowest and largest being 582 ft. long by 177 ft. broad and, at the lowest end, 50 ft. deep. Although the overflow waters of \'Ain es Saleh, commonly known as the "sealed fountain" (compare <a onClick="return mV(\'Sgs\',4,12);">So 4:12</a>), reach the pools, the chief function was probably to collect the flood waters from the winter rains, and the water was passed from tank to tank after purification. There are in all four springs in this valley which supply the aqueduct which still conveys water to Bethlehem, where it passes through the hill by means of a tunnel and then, after running, winding along the sides of the hill, it enters another tunnel now converted into a storage tank for Jerusalem; from this it runs along the mountain sides and along the southern slopes of the site of Jerusalem to the Charam. The total length of this aqueduct is nearly 12 miles, but at a later date the supply was increased by the construction of a long extension of the conduit for a further 28 miles to Wady \'Arrub on the road to Hebron, another 5 miles directly south of the pools. Here, too, there is a reservoir, the Birket el \'Arrub, for the collection of the flood-water, and also several small springs, which are conducted in a number of underground rock-cut channels to the aqueduct. The total length of the low-level aqueduct is about 40 miles, and the fall in level from Birket el \'Arrub (2,645 ft. above sea-level) at its far end to el Kas, the termination in the Charam Jerusalem (2,410 ft. above sea-level), is 235 ft.<P>16. High-Level Aqueduct:<P>The high-level aqueduct commences in a remarkable chain of wells connected with a tunnel, about 4 miles long, in the Wady Biar, "the Valley of Wells." Upward of 50 wells along the valley bottom supplied each its quotient; the water thence passed through a pool where the solid matter settled, and traversed a tunnel 1,700 ft. long into the \'Artas valley. Here, where its level was 150 ft. above that of the low-level aqueduct, the conduit received the waters of the "sealed fountain," and finally "delivered them in Jerusalem at a level of about 20 ft. above that of the Jaffa Gate" (Wilson). The most remarkable feature of this conduit is the inverted siphon of perforated limestone blocks, forming a stone tube 15 inches in diameter, which carried the water across the valley near Rachel\'s Tomb.<P>17. Dates of Construction of These Aqueducts:<P>On a number of these blocks, Latin inscriptions with the names of centurions of the time of Severus (195 AD) have been found, and this has led many to fix a date to this great work. So good an authority as Wilson, however, considers that these inscriptions may refer to repairs, and that the work is more probably Herodian. Unless the accounts of Josephus (Jewish Wars, V, iv, 4; II, xvii, 9) are exaggerated, Herod must have had some means of bringing abundant running water into the city at the level obtained by this conduit. The late Dr. Schick even suggested a date as early as Hyrcanus (135-125 BC). With regard to the low-level aqueduct, we have two definite data. First Josephus (Ant., XVIII, iii, 2) states that Pontius Pilate "undertook to bring a current of water to Jerusalem, and did it with the sacred money, and derived the origin of the stream from the distance of 200 furlongs," over 22 miles; in Jewish Wars, II, ix, 4 he is said to have brought the water "from 400 furlongs"—probably a copyist\'s error. But these references must either be to restorations or to the extension from Wady \'Arrub to Wady \'Artas (28 miles), for the low-level aqueduct from the pools to Jerusalem is certainly the same construction as the aqueduct from these pools to the "Frank Mountain," the Herodium, and that, according to the definite statements of Josephus (Ant., XV, ix, 4; BJ, I, xxi, 10), was made by Herod the Great. On the whole the usual view is that the high-level aqueduct was the work of Severus, the low-level that of Herod, with an extension southward by Pontius Pilate.<P>Jerus still benefits somewhat from the low-level aqueduct which is in repair as far as Bethlehem, though all that reaches the city comes only through a solitary 4-inch pipe. The high-level aqueduct is hopelessly destroyed and can be traced only in places; the wells of Wady Biar are choked and useless, and the long winding aqueduct to Wady \'Arrub is quite broken.<P>VIII. Tombs, Antiquarian Remains and Ecclesiastical Sites.<P>1. The "Tombs of the Kings":<P>Needless to say all the known ancient tombs in the Jerusalem area have been rifled of their contents long ago. The so-called Tombs of the Kings in the Wady el Joz are actually the monument of Queen Helena of Adiabene, a convert to Judaism (circa 48 AD). Josephus (Ant., XX, iv, 3) states that her bones, with those of members of her family, were buried "at the pyramids," which were 3 in number and distant from Jerusalem 3 furlongs. A Hebrew inscription upon a sarcophagus found here by De Saulcy ran: (tsarah malkethah), "Queen Sarah," possibly the Jewish name of Queen Helena.<P>2. "Herod\'s Tomb":<P>On the western side of the Wady el Mes (the higher part of Hinnom), is a very interesting Greek tomb containing beautifully carved sarcophagi. These are commonly known as "Herod\'s Tombs" (although Herod the Great was buried on the Herodium), and, according to Schick, one of the sarcophagi may have belonged to Mariamne, Herod\'s wife. A more probable theory is that this is the tomb of the high priest Ananias (Jewish Wars, V, xii, 2).<P>3. "Absalom\'s Tomb":<P>On the eastern side of the Kidron, near the southeastern angle of the Charam, are 3 conspicuous tombs. The most northerly, Tantur Fer\'on, generally called "Absalom\'s Tomb," is a Greek-Jewish tomb of the Hasmonean period, and, according to Conder, possibly the tomb of Alexander Janneus (HDB, article "Jerusalem"). S. of this is the traditional "Grotto of James," which we know by a square Hebrew inscription over the pillars to be the family tomb of certain members of the priestly family (<a onClick="return mV(\'1Ch\',24,15);">1Ch 24:15</a>), of the Beni Hazir. It may belong to the century before Christ.<P>The adjoining traditional tomb of Zachariah is a monolithic monument cut out of the living rock, 16 ft. square and 30 ft. high. It has square pilasters at the corners, Ionic pillars between, and a
