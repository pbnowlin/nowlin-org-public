isbe = [];

isbe[4901]='Jedeus`je-de\'-us (Iedaios): Called <a href="study/isbe/search.html?string=ADAIAH">ADAIAH</A> (which see) in <a onClick="return mV(\'Ezr\',10,29);">Ezr 10:29</a> (1Esdras 9:30).``1';
isbe[4902]='Jediael`je-di\'-a-el (yedhi\'a\'-el, "God makes known" (?)):<P>(1) A "son" of Benjamin or probably of Zebulun (<a onClick="return mV(\'1Ch\',7,6,10,11);">1Ch 7:6, 10-11</a>). See Curtis, Chronicles, 145-49, who suggests emending the name to yachle\'el, Jahleel, in agreement with <a onClick="return mV(\'Gen\',46,24);">Ge 46:24</a>.<P>(2) One of David\'s mighty men (<a onClick="return mV(\'1Ch\',11,45);">1Ch 11:45</a>), probably = the Manassite who deserted to David at Ziklag (<a onClick="return mV(\'1Ch\',12,20);">1Ch 12:20 (Hebrew 21)</a>).<P>(3) A Korahite doorkeeper in David\'s reign (<a onClick="return mV(\'1Ch\',26,2);">1Ch 26:2</a>).``1';
isbe[4903]='Jedidah`je-di\'-da (yedhidhah, "beloved"): Mother of King Josiah of Judah, daughter of Adaiah of Bozkath (<a onClick="return mV(\'2Ki\',22,1);">2Ki 22:1</a>).``1';
isbe[4904]='Jedidiah`jed-i-di\'-a (yedhidh-yah, "the beloved of Yah"): The name conferred by God through Nathan upon Solomon at his birth (<a onClick="return mV(\'2Sa\',12,25);">2Sa 12:25</a>).``1';
isbe[4905]='Jeduthun`je-du\'-thun.`<a href="./study/isbe/search.html?string=ASAPH">ASAPH</a>`1';
isbe[4906]='Jeeli`je-e\'-li (Ieieli: Called "Jaalah" in <a onClick="return mV(\'Ezr\',2,56);">Ezr 2:56</a> and "Jaala" in <a onClick="return mV(\'Neh\',7,58);">Ne 7:58</a> (1Esdras 5:33).``1';
isbe[4907]='Jeelus`je-e\'-lus (Ieelos): Called "Jehiel" in <a onClick="return mV(\'Ezr\',10,2);">Ezr 10:2</a> (1Esdras 8:92).``1';
isbe[4908]='Jeezer`je-e\'-zer (the King James Version) (\'i\'ezer; the Revised Version (British and American) <a href="study/isbe/search.html?string=IEZER;+IEZERITES">IEZER</A>): The name of a elan of Gilead (<a onClick="return mV(\'Num\',26,30);">Nu 26:30</a>), but read la-\'abhi\'ezer, i.e. "of Abiezer" (compare <a onClick="return mV(\'Jos\',17,2);">Jos 17:2</a>).`<a href="./study/isbe/search.html?string=ABIEZER">ABIEZER</a>`1';
isbe[4909]='Jeezerites`je-e\'-zer-its.`<a href="./study/isbe/search.html?string=ABIEZER">ABIEZER</a>`1';
isbe[4910]='Jegar-Saha-Dutha`je-gar-sa-ha-du\'-tha (yeghar sahadhutha\'; Septuagint Bounos marturei, "(the) mound witnesses"): The name given by the Aramean, Laban, to the "cairn of witness," called by Jacob <a href="study/isbe/search.html?string=GALEED">GALEED</a> (which see) (<a onClick="return mV(\'Gen\',31,47);">Ge 31:47</a>). The rest of the second part of this name appears again in <a onClick="return mV(\'Job\',16,19);">Job 16:19</a>, where sahadhi, should be rendered with the Revised Version (British and American), "he that voucheth for me," i.e. "my witness."``1';
isbe[4911]='Jehallelel; Jehaleleel`je-hal\'-e-lel (Revised Version (British and American)), je-ha-le\'-le-el (the King James Version) (yehallel\'el, "he shall praise God"):<P>(1) A Judahite (<a onClick="return mV(\'1Ch\',4,16);">1Ch 4:16</a>).<P>(2) A Levite, a descendant of Merari (<a onClick="return mV(\'2Ch\',29,12);">2Ch 29:12</a>).``1';
isbe[4912]='Jehdeiah`je-de\'-ya, ja\'-de-ya (yechdeyahu, "may Yahweh give joy!"):<P>(1) A Levite, head of the family of Shubael (<a onClick="return mV(\'1Ch\',24,20);">1Ch 24:20</a>).<P>(2) An officer of David "over the asses" (<a onClick="return mV(\'1Ch\',27,30);">1Ch 27:30</a>).``1';
isbe[4913]='Jehezkel; Jehezekel`je-hez\'-kel (Revised Version (British and American)), je-hez\'-e-kel (the King James Version) (yechezqe\'l "God strengthens"):<P>(1) A priest of David\'s time (<a onClick="return mV(\'1Ch\',24,16);">1Ch 24:16</a>).<P>(2) Jehezkel in <a onClick="return mV(\'Eze\',1,3);">Eze 1:3</a> King James Version margin, for <a href="study/isbe/search.html?string=EZEKIEL,+1">EZEKIEL</a> (which see).``1';
isbe[4914]='Jehiah`je-hi\'-a (yechiyah, "may Yahweh live!"): Keeper of the ark with Obed-edom (<a onClick="return mV(\'1Ch\',15,24);">1Ch 15:24</a>), but in verse <a onClick="return mV(\'1Ch\',15,18);">18</A> the name is ye\'i\'el, <a href="study/isbe/search.html?string=JEIEL">JEIEL</A> (which see)``1';
isbe[4915]='Jehiel; Jehieli`je-hi\'-el, je-hi\'-e-li (yechi\'el, "may God live!"):<P>(1) A Levite, one of the musicians appointed to play upon instruments at the bringing up of the ark by David (<a onClick="return mV(\'1Ch\',15,18,20);">1Ch 15:18, 20</a>; <a onClick="return mV(\'1Ch\',16,5);">16:5</a>); (yechi\'eli): A patronymic of this name (<a onClick="return mV(\'1Ch\',26,21,22);">1Ch 26:21-22</a>), but Curtis (Chronicles, 286-87) reads "Jehiel (<a onClick="return mV(\'1Ch\',26,21);">1Ch 26:21</a>) and he is brethren Zetham and Joel" (<a onClick="return mV(\'1Ch\',26,22);">1Ch 26:22</a>); compare <a onClick="return mV(\'1Ch\',23,8);">1Ch 23:8</a>, where the three seem to be brothers. See (2) above [<a href="study/isbe/search.html?string=JEHIAH">Jehiah</A>].<P>(2) A Gershonite, head of a Levitical house (<a onClick="return mV(\'1Ch\',23,8);">1Ch 23:8</a>; <a onClick="return mV(\'1Ch\',29,8);">29:8</a>).<P>(3) Son of a Hachmonite; he was "with the king\'s (David\'s) sons," i.e. their tutor (<a onClick="return mV(\'1Ch\',27,32);">1Ch 27:32</a>).<P>(4) A son of King Jehoshaphat (<a onClick="return mV(\'2Ch\',21,2);">2Ch 21:2</a>).<P>(5) In <a onClick="return mV(\'2Ch\',29,14);">2Ch 29:14</a> the King James Version, where Qere is yechu\'el, the Revised Version (British and American) "Jehuel," a Hermanite Levite who took part in cleansing the temple in Hezekiah\'s reign.<P>(6) An overseer in Hezekiah\'s reign (<a onClick="return mV(\'2Ch\',31,13);">2Ch 31:13</a>).<P>(7) One of the three "rulers" of the temple in Hezekiah\'s reign (<a onClick="return mV(\'2Ch\',35,8);">2Ch 35:8</a>).<P>(8) Father of Obadiah, a returned exile (<a onClick="return mV(\'Ezr\',8,9);">Ezr 8:9</a>) = "Jezelus" of 1Esdras 8:35.<P>(9) Father of Shecaniah (<a onClick="return mV(\'Ezr\',10,2);">Ezr 10:2</a>) = "Jeelus" of 1Esdras 8:92. He was a "son" of Elam, and so probably the same as "Jehiel" in <a onClick="return mV(\'Ezr\',10,26);">Ezr 10:26</a>, one of those who had married foreign wives = "Jezrielus" of 1Esdras 9:27.<P>(10) A "son" of Harim, and one of those who had married foreign wives (<a onClick="return mV(\'Ezr\',10,21);">Ezr 10:21</a>) = "Hiereel" of 1Esdras 9:21.<P>(11) The King James Version in <a onClick="return mV(\'1Ch\',9,35);">1Ch 9:35</a> = <a href="study/isbe/search.html?string=JEIEL">JEIEL</a> (q.v. (2)).<P>(12) The King James Version in <a onClick="return mV(\'1Ch\',11,44);">1Ch 11:44</a> = <a href="study/isbe/search.html?string=JEIEL">JEIEL</a> (q.v. (3)).``149';
isbe[4916]='Jehizkiah`je-hiz-ki\'-a (yechizqiyahu, "Yah strengthens"): One of the Ephraimite chiefs (<a onClick="return mV(\'2Ch\',28,12);">2Ch 28:12</a>) who with Obed are said to have opposed the enslavement of the Judahites taken captive by Pekah in his war against Ahaz (circa 734 BC).``1';
isbe[4917]='Jehoaddah; Jehoadah`je-ho-ad\'-a (Revised Version (British and American)), je-ho\'-a-da (the King James Version) (yeho\'addah, "Yah has deposed" or "numbered"): A descendant of King Saul (<a onClick="return mV(\'1Ch\',8,36);">1Ch 8:36</a>), called "Jarah" in <a onClick="return mV(\'1Ch\',9,42);">1Ch 9:42</a>, where the Septuagint has Iada = ya\'dah.`<a href="./study/isbe/search.html?string=JARAH">JARAH</a>`1';
isbe[4918]='Jehoaddan`je-ho-ad\'-an (yeho\'addan, meaning unknown): In <a onClick="return mV(\'2Ch\',25,1);">2Ch 25:1</a>; and Qere, the King James Version in <a onClick="return mV(\'2Ki\',14,2);">2Ki 14:2</a>, where Kethibh and the Revised Version (British and American) are "Jehoaddin" (yeho\'addin), the mother of King Amaziah of Judah.``1';
isbe[4919]='Jehoaddin`je-ho-ad\'-in.`<a href="./study/isbe/search.html?string=JEHOADDAN">JEHOADDAN</a>`1';
isbe[4920]='Jehoahaz`je-ho\'-a-haz, je-ho-a\'-haz (yeho\'achaz, "Yah has grasped"; Ioachas; <a onClick="return mV(\'2Ki\',13,\'1-9\');">2Ki 13:1-9</a>):<P>(1) Son of Jehu, and 11th king of Israel. He is stated to have reigned 17 years.<P>1. Chronology of Reign:<P>Josephus was already aware (Ant., IX, viii, 5) of the chronological difficulty involved in the cross-references in <a onClick="return mV(\'2Ki\',13,1);">2Ki 13:1</a> and <a onClick="return mV(\'2Ki\',13,10);">10</A>, the former of which states that Jehoahaz began to reign in the 23rd year of Jehoash of Jerusalem, and reigned 17 years; while the latter gives him a successor in Jehoash\'s 37th year, or 14 years later. Josephus alters the figure of verse <a onClick="return mV(\'2Ki\',13,1);">1</A> to <span class="noTag">21</a>; and, to meet the same difficulty, the Septuagint (Aldine edition) changes 37 to 39</a> in <a onClick="return mV(\'2Ki\',13,10);">13:10</a>. The difficulty may be met by supposing that Jehoahaz was associated with his father Jehu for several years in the government of the country before the death of the latter, and that these years were counted as a part of his reign. This view has in its favor the fact that Jehu was an old man when he died, and may have been incapacitated for the full discharge of administrative duties before the end came. The accession of Jehoahaz as sole ruler may be dated about 825 BC.<P>2. Low Condition of the Kingdom:<P>When Jehoahaz came to the throne, he found a discouraged and humiliated people. The territory beyond Jordan, embracing 2 1/2 tribes, or one-fourth of the whole kingdom, had been lost in warfare with the Syrian king, Hazael (<a onClick="return mV(\'2Ki\',10,32,33);">2Ki 10:32-33</a>). A heavy annual subsidy was still payable to Assyria, as by his father Jehu. The neighboring kingdom of Judah was still unfriendly to any member of the house of Jehu. Elisha the prophet, though then in the zenith of his influence, does not seem to have done anything toward the stability of Jehu\'s throne.<P>3. Israel and Syria:<P>Specially did Israel suffer during this reign from the continuance of the hostility of Damascus (<a onClick="return mV(\'2Ki\',13,3,4,22);">2Ki 13:3-4, 22</a>). Hazael had been selected, together with Jehu, as the instrument by which the idolatry of Israel was to be punished (<a onClick="return mV(\'1Ki\',19,16);">1Ki 19:16</a>). Later the instruments of vengeance fell out. On Jehu\'s death, the pressure from the east on Hazael was greatly relieved. The great conqueror, Shalmaneser II, had died, and his son Samsi-Ramman IV had to meet a revolt within the empire, and was busy with expeditions against Babylon and Media during the 12 years of his reign (824-812 BC). During these years, the kingdoms of the seaboard of the Mediterranean were unmolested. They coincide with the years of Jehoahaz, and explain the freedom which Hazael had to harass the dominions of that king.<P>4. The Elisha Episodes:<P>Particulars of the several campaigns in which the troops of Damascus harassed Israel are not given. The life of Elisha extended through the 3 reigns of Jehoram (12 years), Jehu (28 years) and Jehoahaz (12 or 13 years), into the reign of Joash (<a onClick="return mV(\'2Ki\',13,1);">2Ki 13:1</a>). It is therefore probable that in the memorabilia of his life in <a onClick="return mV(\'2Ki\',4,\'1-\');">2Ki 4-8</a>, now one and now another king of Israel should figure, and that some of the episodes there recorded belong to the reign of Jehoahaz. There are evidences that strict chronological order is not observed in the narrative of Elisha, e.g. Gehazi appears in waiting on the king of Israel in <a onClick="return mV(\'2Ki\',8,5);">8:5</A>, after the account of his leprosy in <a onClick="return mV(\'2Ki\',5,27);">5:27</A>. The terrible siege of Samaria in <a onClick="return mV(\'2Ki\',7,\'1-\');">2Ki 7</a> is generally referred to the reign of Jehoram; but no atmosphere is so suitable to it as that of the reign of Jehoahaz, in one of the later years of whom it may have occurred. The statement in <a onClick="return mV(\'2Ki\',13,7);">13:7</A> that "the king of Syria destroyed them, and made them like the dust in threshing," and the statistics there given of the depleted army of Jehoahaz, would correspond with the state of things that siege implies. In this case the Ben-hadad of <a onClick="return mV(\'2Ki\',6,24);">2Ki 6:24</a> would be the son of Hazael (<a onClick="return mV(\'2Ki\',13,3);">13:3</A>).<P>5. His Idolatry:<P>Jehoahaz, like his father, maintained the calf-worship in Bethel and Dan, and revived also the cult of the Asherah, a form of Canaanitish idolatry introduced by Ahab (<a onClick="return mV(\'1Ki\',16,33);">1Ki 16:33</a>). It centered round a sacred tree or pole, and was probably connected with phallic worship (compare <a onClick="return mV(\'1Ki\',15,13);">1Ki 15:13</a>, where Maacah, mother of Asa, is said to have "made an abominable image for an Asherah" in Jerusalem).<P>6. Partial Reform:<P>The close of this dark reign, however, is brightened by a partial reform. In his distress, we are told, "Jehoahaz besought Yahweh, and Yahweh hearkened unto him" (<a onClick="return mV(\'2Ki\',13,4);">2Ki 13:4</a>). If the siege of Samaria in <a onClick="return mV(\'2Ki\',6,\'1-\');">2Ki 6</a> belongs to his reign, we might connect this with his wearing "sackcloth within upon his flesh" (<a onClick="return mV(\'2Ki\',6,30);">6:30</A>)—an act of humiliation only accidentally discovered by the rending of his garments. <a onClick="return mV(\'2Ki\',6,5);">2Ki 6:5</a> goes on to say that "Yahweh gave Israel a saviour, so that they went out from under the hand of the Syrians." The "saviour" may refer to Joash, under whom the deliverance began (<a onClick="return mV(\'2Ki\',13,25);">13:25</A>), or to Jeroboam II, of whom it is declared that by him God "saved" Israel (<a onClick="return mV(\'2Ki\',14,27);">14:27</A>). Others take it to refer to Ramman-nirari III, king of Assyria, whose conquest of Damascus made possible the victories of these kings.<P>(2) A king of Judah, son and successor of Josiah; reigned three months and was deposed, 608 BC. Called "Shallum" in <a onClick="return mV(\'Jer\',22,11);">Jer 22:11</a>; compare <a onClick="return mV(\'1Ch\',3,15);">1Ch 3:15</a>. The story of his reign is told in <a onClick="return mV(\'2Ki\',23,\'30-35\');">2Ki 23:30-35</a>, and in a briefer account in <a onClick="return mV(\'2Ch\',36,\'1-3\');">2Ch 36:1-3</a>. The historian of 2 Kings characterizes his reign as evil; 2Ch passes no verdict upon him. On the death of his father in battle, which threw the realm into confusion, he, though a younger son (compare <a onClick="return mV(\'2Ki\',23,31);">2Ki 23:31</a> with <a onClick="return mV(\'2Ki\',23,36);">23:36</A>; <a onClick="return mV(\'1Ch\',3,15);">1Ch 3:15</a> makes him the fourth son of Josiah), was raised to the throne by "the people of the land," the same who had secured the accession to his father; see under <a href="study/isbe/search.html?string=JOSIAH">JOSIAH</A>. Perhaps, as upholders of the sterling old Davidic idea, which his father had carried out so well, they saw in him a better hope for its integrity than in his elder brother Jehoiakim (Eliakim), whose tyrannical tendencies may already have been too apparent. The prophets also seem to have set store by him, if we may judge by the sympathetic mentions of him in <a onClick="return mV(\'Jer\',22,11);">Jer 22:11</a> and <a onClick="return mV(\'Eze\',1,3,4);">Eze 1:3-4</a>. His career was too short, however, to make any marked impression on the history of Judah.<P>Josiah\'s ill-advised meddling with the designs of Pharaoh-necoh (see under <a href="study/isbe/search.html?string=JOSIAH">JOSIAH</a>) had had, in fact, the ill effect of plunging Judah again into the vortex of oriental politics, from which it had long been comparatively free. The Egyptian king immediately concluded that so presumptuous a state must not be left in his rear unpunished. Arrived at Riblah on his Mesopotamian expedition, he put Jehoahaz in bonds, and later carried him prisoner to Egypt, where he died; raised his brother Jehoiakim to the throne as a vassal king; and imposed on the realm a fine of a hundred talents of silver and a talent of gold. So the fortunes of the Judean state, so soon after Josiah\'s good reign, began their melancholy change for the worse.<P>(3) In <a onClick="return mV(\'2Ch\',21,17);">2Ch 21:17</a>; <a onClick="return mV(\'2Ch\',25,23);">25:23</a> = <a href="study/isbe/search.html?string=AHAZIAH">AHAZIAH</a>, king of Judah (which see) (<a onClick="return mV(\'2Ki\',8,25);">2Ki 8:25</a>ff; <a onClick="return mV(\'2Ch\',22,\'1-\');">2Ch 22:1</a>).`<a href="./study/isbe/search.html?string=JEHOASH">JEHOASH</a>`18';
isbe[4921]='Jehoash; Joash`je-ho\'-ash, the uncontracted form of (yeho\'ash, yo\'ash, "Yahweh has bestowed"; compare <a onClick="return mV(\'2Ki\',11,2,21);">2Ki 11:2,21</a>; <a onClick="return mV(\'2Ki\',12,1,19);">12:1,19</a>; <a onClick="return mV(\'2Ch\',24,\'1-\');">2Ch 24</a>: je-ho\'-ash, the uncontracted form of (yeho\'ash, yo\'ash, "Yahweh has bestowed"; compare <a onClick="return mV(\'2Ki\',11,2,21);">2Ki 11:2,21</a>; <a onClick="return mV(\'2Ki\',12,1,19);">12:1,19</a>; <a onClick="return mV(\'2Ch\',24,1);">2Ch 24:1</a>, etc.; Ioas):<P>(1) The 9th king of Judah; son of Ahaziah and Zibiah, a woman of Beersheba (<a onClick="return mV(\'2Ki\',11,\'1-\');">2Ki 11</A>-<a onClick="return mV(\'2Ki\',12,\'1-\');">12</a>; <a onClick="return mV(\'2Ch\',22,\'10-\');">2Ch 22:10-24:27</a>). Jehoash was 7 years old at his accession, and reigned 40 years. His accession may be placed in 852 BC. Some include in the years of his reign the 6 years of Athaliah\'s usurpation.<P>I. Ninth King of Judah<P>1. His Early Preservation:<P>When, on Athaliah\'s usurpation of the throne, she massacred the royal princes, Jehoash was saved from her unnatural fury by the action of his aunt Jehosheba, the wife of Jehoiada, the high priest (<a onClick="return mV(\'2Ki\',11,1,2);">2Ki 11:1-2</a>; <a onClick="return mV(\'2Ch\',22,10,11);">2Ch 22:10-11</a>). During 6 years he was concealed in the house of Jehoiada, which adjoined the temple; hence, is said to have been "hid in the house of Yahweh"—a perfectly legitimate use of the phrase according to the idiom of the time.<P>2. The Counter-Revolution:<P>During these formative years of Jehoash\'s early life, he was under the moral and spiritual influence of Jehoiada—a man of lofty character and devout spirit. At the end of 6 years, a counter-revolution was planned by Jehoiada, and was successfully carried out on a Sabbath, at one of the great festivals. The accounts of this revolution in Kings and Chronicles supplement each other, but though the Levitical interest of the Chronicler is apparent in the details to which he gives prominence, the narratives do not necessarily collide, as has often been represented. The event was prepared for by the young king being privately exhibited to the 5 captains of the "executioners" (the Revised Version (British and American) "Carites") and "runners" (<a onClick="return mV(\'2Ki\',11,4);">2Ki 11:4</a>; <a onClick="return mV(\'2Ch\',23,1);">2Ch 23:1</a>). These entered into covenant with Jehoiada, and, by his direction, summoned the Levites from Judah (<a onClick="return mV(\'2Ch\',23,2);">2Ch 23:2</a>), and made the necessary arrangements for guarding the palace and the person of the king. In these dispositions both the royal body-guard and the Levites seem to have had their parts. Jehoash next appears standing on a platform in front of the temple, the law of the testimony in his hand and the crown upon his head. Amid acclamations, he is anointed king. Athaliah, rushing on the scene with cries of "treason" (see <a href="study/isbe/search.html?string=ATHALIAH">ATHALIAH</a>), is driven forth and slain. A new covenant is made between Yahweh and the king and people, and, at the conclusion of the ceremony, a great procession is formed, and the king is conducted with honor to the royal house (<a onClick="return mV(\'2Ki\',11,19);">2Ki 11:19</a>; <a onClick="return mV(\'2Ch\',23,20);">2Ch 23:20</a>). Thus auspiciously did the new reign begin.<P>3. Repair of the Temple:<P>Grown to manhood (compare the age of his son Amaziah, <a onClick="return mV(\'2Ki\',14,25);">2Ki 14:25</a>), Jehoash married two wives, and by them had sons and daughters (<a onClick="return mV(\'2Ch\',24,3);">2Ch 24:3</a>). His great concern at this period, however, was the repair of the temple—the "house of Yahweh"—which in the reign of Athaliah had been broken up in many places, plundered, and allowed to become dilapidated (<a onClick="return mV(\'2Ki\',12,5,12);">2Ki 12:5,12</a>; <a onClick="return mV(\'2Ch\',24,7);">2Ch 24:7</a>). To meet the expense of its restoration, the king gave orders that all moneys coming into the temple, whether dues or voluntary offerings, should be appropriated for this purpose (<a onClick="return mV(\'2Ki\',12,4);">2Ki 12:4</a>), and from the account in Chronicles would seem to have contemplated a revival of the half-shekel tax appointed by Moses for the construction of the tabernacle (<a onClick="return mV(\'2Ch\',24,5,6);">2Ch 24:5-6</a>; compare <a onClick="return mV(\'Exd\',30,\'11-16\');">Ex 30:11-16</a>; <a onClick="return mV(\'Exd\',38,25);">38:25</a>). To enforce this impost would have involved a new census, and the memory of the judgments which attended David\'s former attempt of this kind may well have had a deterrent effect on Jehoiada and the priesthood. "The Levites hastened it not," it is declared (<a onClick="return mV(\'2Ch\',24,5);">2Ch 24:5</a>).<P>4. A New Expedient:<P>Time passed, and in the 23rd year of the king\'s reign (his 30th year), it was found that the breaches of the house had still not been repaired. A new plan was adopted. It was arranged that a chest with a hole bored in its lid should be set up on the right side of the altar in the temple-court, under the care of two persons, one the king\'s scribe, the other an officer of the high priest, and that the people should be invited to bring voluntarily their half-shekel tax or other offerings, and put it in this box (<a onClick="return mV(\'2Ki\',12,9);">2Ki 12:9</a>; <a onClick="return mV(\'2Ch\',24,8,9);">2Ch 24:8-9</a>). Gifts from worshippers who did not visit the altar were received by priests at the gate, and brought to the box. The expedient proved brilliantly successful. The people cheerfully responded, large sums were contributed, the money was honestly expended, and the temple was thoroughly renovated. There remained even a surplus, with which gold and silver vessels were made, or replaced, for the use of the temple. Jehoiada\'s long and useful life seems to have closed soon after.<P>5. The King\'s Declension:<P>With the death of this good man, it soon became evident that the strongest pillar of the state was removed. It is recorded that "Jehoash did that which was right in the eyes of Yahweh all his days wherein Jehoiada the priest instructed him" (<a onClick="return mV(\'2Ki\',12,2);">2Ki 12:2</a>), but after Jehoiada had been honorably interred in the sepulchers of the kings (<a onClick="return mV(\'2Ch\',24,16);">2Ch 24:16</a>), a sad declension became manifest. The princes of Judah came to Jehoash and expressed their wish for greater freedom in worship than had been permitted them by the aged priest. With weak complaisance, the king "hearkened unto them" (<a onClick="return mV(\'2Ch\',24,17);">2Ch 24:17</a>). Soon idols and Asherahs began to be set up in Jerusalem and the other cities of Judah. Unnamed prophets raised their protests in vain. The high priest Zechariah, a worthy son of Jehoiada, testified in his place that as the nation had forsaken Yahweh, he also would forsake it, and that disaster would follow (<a onClick="return mV(\'2Ch\',24,20);">2Ch 24:20</a>). Wrathful at the rebuke, the king gave orders that Zechariah should be stoned with stones in the temple-court (<a onClick="return mV(\'2Ch\',24,21);">2Ch 24:21</a>). This was done, and the act of sacrilege, murder, and ingratitude was perpetrated to which Jesus seems to refer in <a onClick="return mV(\'Mat\',23,35);">Mt 23:35</a>; <a onClick="return mV(\'Luk\',11,51);">Lu 11:51</a> ("son of Barachiah" in the former passage is probably an early copyist\'s gloss through confusion with the prophet Zechariah).<P>6. Calamities and Assassination:<P>The high priest\'s dying words, "Yahweh look upon it, and require it," soon found an answer. Within a year of Zechariah\'s death, the armies of Hazael, the Syrian king, were ravaging and laying waste Judah. The city of Gath fell, and a battle, the place of which is not given, placed Jerusalem at the mercy of the foe (<a onClick="return mV(\'2Ki\',12,17);">2Ki 12:17</a>; <a onClick="return mV(\'2Ch\',24,23,24);">2Ch 24:23-24</a>). To save the capital from the indignity of foreign occupation, Jehoash, then in dire sickness, collected all the hallowed things of the temple, and all the gold of the palace, and sent them to Hazael (<a onClick="return mV(\'2Ki\',12,17,18);">2Ki 12:17-18</a>). This failure of his policy, in both church and state, excited such popular feeling against Jehoash, that a conspiracy was formed to assassinate him. His physical sufferings won for him no sympathy, and two of his own officers slew him, while asleep, in the fortress of Millo, where he was paying a visit (<a onClick="return mV(\'2Ki\',12,20);">2Ki 12:20</a>). He was buried in the city of David, but not in the royal sepulchers, as Jehoiada had been (<a onClick="return mV(\'2Ch\',24,25);">2Ch 24:25</a>).<P>Jehoash is mentioned as the father of Amaziah (<a onClick="return mV(\'2Ki\',14,1);">2Ki 14:1</a>; <a onClick="return mV(\'2Ch\',25,25);">2Ch 25:25</a>). His contemporaries in Israel were Jehoahaz (<a onClick="return mV(\'2Ki\',13,1);">2Ki 13:1</a>) and Jehoash (<a onClick="return mV(\'2Ki\',13,10);">2Ki 13:10</a>).<P>(2) The son of Jehoahaz, and 12th king of Israel (<a onClick="return mV(\'2Ki\',13,\'10-25\');">2Ki 13:10-25</a>; <a onClick="return mV(\'2Ki\',14,\'8-16\');">14:8-16</a>; <a onClick="return mV(\'2Ch\',25,\'17-24\');">2Ch 25:17-24</a>).<P>II. Twelveth King of Israel<P>1. Accession and Reign:<P>Jehoash reigned for 16 years. His accession may be placed in 813 BC. There were almost simultaneous changes in the sovereignties of Judah and of Assyria—Amazih succeeding to the throne of Judah in the 2nd year of Jehoash, and Ramman-nirari III coming to the throne of Assyria in 811 BC—which had important effects on the history of Israel in this reign.<P>2. Elisha and Jehoash:<P>During the three previous reigns, for half a century, Elisha had been the prophet of Yahweh to Israel. He was now aged and on his deathbed. Hearing of his illness, the young king came to Dothan, where the prophet was, and had a touching interview with him. His affectionate exclamation, "My father, my father, the chariots of Israel and the horsemen thereof" (<a onClick="return mV(\'2Ki\',13,14);">2Ki 13:14</a>; compare <a onClick="return mV(\'2Ki\',2,12);">2:12</a>), casts a pleasing light upon his character. On his lips the words had another meaning than they bore when used by Elish himself at Elijah\'s translation. Then they referred to the "appearance" which parted Elisha from his master; now they referred to the great service rendered by the prophet to the kingdom. Not only had Elisha repeatedly saved the armies of Israel from the ambushes prepared for them by the Syrians (<a onClick="return mV(\'2Ki\',6,\'8-23\');">2Ki 6:8-23</a>), but he had given assurance of the relief of the capital when it was at its worst extremity (<a onClick="return mV(\'2Ki\',6,24);">2Ki 6:24</a>). To Jehoash, Elisha\'s presence was indeed in place of chariots and horse. The truth was anew demonstrated by the promise which the dying prophet now made to him. Directing Jehoash in the symbolical action of the shooting of certain arrows, he predicted three victories over the Syrians—the first at Aphek, now Fik, on the east of the Lake of Galilee—and more would have been granted, had the faith of the king risen to the opportunity then afforded him (<a onClick="return mV(\'2Ki\',6,\'15-19\');">2Ki 6:15-19</a>).<P>3. Assyria and Damascus:<P>An interesting light is thrown by the annals of Assyria on the circumstances which may have made these victories of Jehoash possible. Ramman-nirari III, who succeeded to the throne in 811 BC, made an expedition against Damascus, Edom and Philistia, in his account of which he says: "I shut up the king (of Syria) in his chief city, Damascus....He clasped my feet, and gave himself up....His countless wealth and goods I seized in Damascus." With the Syrian power thus broken during the remainder of this ruler\'s reign of 27 years, it may be understood how Jehoash should be able to recover, as it is stated he did, the cities which Ben-hadad had taken from his father Jehoahaz (<a onClick="return mV(\'2Ki\',13,25);">2Ki 13:25</a>). Schrader and others see in this Assyrian ruler the "saviour" of Israel alluded to in <a onClick="return mV(\'2Ki\',13,5);">2Ki 13:5</a>; more usually the reference is taken to be to Jehoash himself, and to Jeroboam II (compare <a onClick="return mV(\'2Ki\',14,27);">2Ki 14:27</a>).<P>4. War With Judah:<P>The epitome of Jehoash\'s reign is very brief, but the favorable impression formed of him from the acts of Elisha is strengthened by another gained from the history of Amaziah of Judah (<a onClick="return mV(\'2Ki\',14,\'8-16\');">2Ki 14:8-16</a>; <a onClick="return mV(\'2Ch\',25,\'17-24\');">2Ch 25:17-24</a>). For the purpose of a southern campaign Amaziah had hired a large contingent of troops from Samaria. Being sent back unemployed, these mercenaries committed ravages on their way home, for which, apparently, no redress was given. On the first challenge of the king of Judah, Jehoash magnanimously refused the call to arms, but on Amaziah persisting, the peace established nearly 80 years before by Jehoshaphat (<a onClick="return mV(\'1Ki\',22,44);">1Ki 22:44</a>) was broken at the battle of Beth-shemesh, in which Amaziah was defeated and captured. Jerusalem opened its gates to the victor, and was despoiled of all its treasure, both of palace and temple. A portion of the wall was broken down, and hostages for future behavior were taken to Samaria (<a onClick="return mV(\'2Ki\',14,13,14);">2Ki 14:13-14</a>).<P>5. Character:<P>Jehoash did not long survive his crowning victory, but left a resuscitated state, and laid the foundation for a subsequent rule which raised Israel to the zenith of its power. Josephus gives Jehoash a high character for godliness, but, like each of his predecessors, he followed in the footsteps of Jeroboam I in permitting, if not encouraging, the worship of the golden calves. Hence, his conduct is pronounced "evil" by the historian (<a onClick="return mV(\'2Ki\',13,11);">2Ki 13:11</a>). He was succeeded by his son Jeroboam II.``17';
isbe[4922]='Jehohanan`je-ho-ha\'-nan (yehochanan, "Yahweh is (or has been) gracious"):<P>(1) A Korahite doorkeeper in David\'s reign, "son" of Meshelemiah (<a onClick="return mV(\'1Ch\',26,3);">1Ch 26:3</a>). Septuagint, Luc, has "Jehonathan."<P>(2) One of the five captains over King Jehoshaphat\'s army (<a onClick="return mV(\'2Ch\',17,15);">2Ch 17:15</a>), probably father of Ishmael, "son of Jehohanan" (<a onClick="return mV(\'2Ch\',23,1);">2Ch 23:1</a>).<P>(3) <a onClick="return mV(\'Ezr\',10,6);">Ezr 10:6</a> (the King James Version has "Johnnan") = "Johanan" of <a onClick="return mV(\'Neh\',12,22,23);">Ne 12:22-23</a> = "Jonathan" of <a onClick="return mV(\'Neh\',12,11);">Ne 12:11</a>, "son" of Eliashib (<a onClick="return mV(\'Ezr\',10,6);">Ezr 10:6</a>; but "grandson" in <a onClick="return mV(\'Neh\',12,11);">Ne 12:11</a>). He was high priest in Ezra\'s time = "Jonas" in 1Esdras 9:1 (the King James Version "Joanan").<P>(4) One of those who had married foreign wives (<a onClick="return mV(\'Ezr\',10,28);">Ezr 10:28</a>) = "Joannes" the Revised Version (British and American), "Johannes" the King James Version (1Esdras 9:29).<P>(5) Son of Tobiah, the Ammonite, Nehemiah\'s opponent (<a onClick="return mV(\'Neh\',6,18);">Ne 6:18</a>, the King James Version "Johanan").<P>(6) Head of the priestly family of Amariah (<a onClick="return mV(\'Neh\',12,13);">Ne 12:13</a>).<P>(7) A priest present at the dedication of the walls of Jerusalem (<a onClick="return mV(\'Neh\',12,42);">Ne 12:42</a>).<P>(8) The name in the Hebrew of <a onClick="return mV(\'2Ch\',28,12);">2Ch 28:12</a>.`<a href="./study/isbe/search.html?string=JOHANAN">JOHANAN</a>`149';
isbe[4923]='Jehoiachin`je-hoi\'-a-kin (yehoyakhin, "Yahweh will uphold"; called also "Jeconiah" in <a onClick="return mV(\'1Ch\',3,16);">1Ch 3:16</a>; <a onClick="return mV(\'Jer\',24,1);">Jer 24:1</a>; yekhonyah, "Yahweh will be steadfast," and "Coniah" in <a onClick="return mV(\'Jer\',22,24,28);">Jer 22:24,28</a>; konyahu, "Yahweh has upheld him"; \'Ioakeim): A king of Judah; son and successor of Jehoiakim; reigned three months and surrendered to Nebuchadnezzar; was carried to Babylon, where, after being there 37 years a prisoner, he died.<P>1. Sources:<P>The story of his reign is told in <a onClick="return mV(\'2Ki\',24,\'8-16\');">2Ki 24:8-16</a>, and more briefly in <a onClick="return mV(\'2Ch\',36,\'9-10\');">2Ch 36:9-10</a>. Then, after the reign of his successor Zedekiah and the final deportation are narrated, the account of his release from prison 37 years afterward and the honor done him is given as the final paragraph of 2Ki (<a onClick="return mV(\'2Ki\',25,\'27-30\');">25:27-30</A>). The same thing is told at the end of the Book of Jeremiah (<a onClick="return mV(\'Jer\',52,\'31-34\');">52:31-34</A>). Neither for this reign nor for the succeeding is there the usual reference to state annals; these seem to have been discontinued after Jehoiakim. In <a onClick="return mV(\'Jer\',22,\'24-30\');">Jer 22:24-30</a> there is a final pronouncement on this king, not so much upon the man as upon his inevitable fate, and a prediction that no descendant of his shall ever have prosperous rule in Judah.<P>2. His Reign:<P>Of the brief reign of Jehoiachin there is little to tell. It was rather a historic landmark than a reign; but its year, 597 BC, was important as the date of the first deportation of Jewish captives to Babylon (unless we except the company of hostages carried away in Jehoiakim\'s 3rd (4th) year, <a onClick="return mV(\'Dan\',1,\'1-7\');">Da 1:1-7</a>). His coming to the throne was just at or near the time when Nebuchadnezzar\'s servants were besieging Jerusalem; and when the Chaldean king\'s arrival in person to superintend the siege made apparent the futility of resistance, Jehoiachin surrendered to him, with all the royal household and the court. He was carried prisoner to Babylon, and with him ten thousand captives, comprising all the better and sturdier element of the people from prince to craftsman, leaving only the poorer sort to constitute the body of the nation under his successor Zedekiah. With the prisoners were carried away also the most valuable treasures of the temple and the royal palace.<P>3. The Two Elements:<P>Ever since Isaiah fostered the birth and education of a spiritually-minded remnant, for him the vital hope of Israel, the growth and influence of this element in the nation has been discernible, as well in the persecution it has roused (see under <a href="study/isbe/search.html?string=MANASSEH+(3)">MANASSEH</A>), as in its fiber of sound progress. It is as if a sober sanity of reflection were curing the people of their empty idolatries. The feeling is well expressed in such a passage as <a onClick="return mV(\'Hab\',2,\'18-20\');">Hab 2:18-20</a>. Hitherto, however, the power of this spiritual Israel has been latent, or at best mingled and pervasive among the various occupations and interests of the people. The surrender of Jehoiachin brings about a segmentation of Israel on an unheard-of principle: not the high and low in wealth or social position, but the weight and worth of all classes on the one side, who are marked for deportation, and the refuse element of all classes on the other, who are left at home. With which element of this strange sifting Jeremiah\'s prophetic hopes are identified appears in his parable of the Good and Bad Figs (<a onClick="return mV(\'Jer\',24,\'1-\');">Jer 24</a>), in which he predicts spiritual integrity and upbuilding to the captives, and to the home-staying remainder, shame and calamity. Later on, he writes to the exiles in Babylon, advising them to make themselves at home and be good citizens (<a onClick="return mV(\'Jer\',29,\'1-10\');">Jer 29:1-10</a>). As for the hapless king, "this man Coniah," who is to be their captive chief in a strange land, Jeremiah speaks of him in a strain in which the stern sense of Yahweh\'s inexorable purpose is mingled with tender sympathy as he predicts that this man shall never have a descendant on David\'s throne (<a onClick="return mV(\'Jer\',22,\'24-30\');">Jer 22:24-30</a>). It is as if he said, All as Yahweh has ordained, but—the pity of it!<P>4. Thirty-seven Years Later:<P>In the first year of Nebuchadnezzar\'s successor, perhaps by testamentary edict of Nebuchadnezzar himself, a strange thing occurred. Jehoiachin, who seems to have been a kind of hostage prisoner for his people, was released from prison, honored above all the other kings in similar case, and thenceforth to the end of his life had his portion at the royal table (<a onClick="return mV(\'2Ki\',25,\'27-30\');">2Ki 25:27-30</a>; <a onClick="return mV(\'Jer\',52,\'31-34\');">Jer 52:31-34</a>). This act of clemency may have been due to some such good influence at court as is described in the Book of Daniel; but also it was a tribute to the good conduct of that better element of the people of which he was hostage and representative. It was the last event of Judean royalty; and suggestive for the glimpse it seems to afford of a people whom the Second Isaiah could address as redeemed and forgiven, and of a king taken from durance and judgment (compare <a onClick="return mV(\'Isa\',53,8);">Isa 53:8</a>), whose career makes strangely vivid the things that are said of the mysterious "Servant of Yahweh."``66';
isbe[4924]='Jehoiada`je-hoi\'-a-da (yehoyadha\', "Yahweh knows"; Iodae):<P>(1) Father of Benaiah, the captain of David\'s body-guard (<a onClick="return mV(\'2Sa\',8,18);">2Sa 8:18</a>; <a onClick="return mV(\'2Sa\',20,23);">20:23</a>; <a onClick="return mV(\'2Sa\',23,20,22);">23:20,22</a>; <a onClick="return mV(\'1Ki\',1,8);">1Ki 1:8</a>, etc.). Jehoiada was "the son of a valiant man of Kabzeel" (<a onClick="return mV(\'2Sa\',23,20);">2Sa 23:20</a>), but commentators read with Septuagint and Ewald, "Benaiah (the son of Jehoiada) a man of valor." Kabzeel was a town belonging to Judah on the border of Edom in the south (<a onClick="return mV(\'Jos\',15,21);">Jos 15:21</a>). In <a onClick="return mV(\'1Ch\',27,5);">1Ch 27:5</a>, we read "Benaiah, the son of Jehoiada the priest, chief," the Revised Version (British and American), but the Revised Version margin has "chief minister" wrongly. Yet Jehoiada is nowhere else called a priest or even a Levite, though in <a onClick="return mV(\'1Ch\',12,27);">1Ch 12:27 (Hebrew, verse 28)</a> a Jehoiada is mentioned as a military "leader of the house of Aaron," who came to David to Hebron with other members of the house of Levi. In <a onClick="return mV(\'1Ch\',27,34);">1Ch 27:34</a> there is named among David\'s counselors, "Jehoiada the son. of Benaiah," where some commentators would read with two manuscripts, "Benaiah, the son of Jehoiada" though Curtis, Critical and Exegetical Commentary on the Books of Chronicles,295,keeps the Massoretic Text.<P>(2) Priest in the reigns of Ahaziah, Queen Athaliah, and Jehoash (Joash) of Judah (<a onClick="return mV(\'2Ki\',11,\'4-\');">2Ki 11:4</a>-<a onClick="return mV(\'2Ki\',12,\'1-16\');">12:16 (Hebrew 17)</a> = <a onClick="return mV(\'2Ch\',23,\'1-\');">2Ch 23:1</A>-<a onClick="return mV(\'2Ch\',24,\'1-14\');">24:14</a>; <a onClick="return mV(\'2Ch\',22,11);">2Ch 22:11</a>; <a onClick="return mV(\'2Ch\',24,\'14-16\',\'17-20\',22,25);">24:14-16,17-20,22,25</a>). In <a onClick="return mV(\'2Ki\',12,10);">2Ki 12:10 (Hebrew, verse 11)</a> he is called "high priest," and is the first to be given that title, but as the priest lived in the temple, there is no meaning in saying that he "came up," so commentators omit the words, "and the chief priest." According to <a onClick="return mV(\'2Ch\',22,11);">2Ch 22:11</a>, he had married Jehoshabeath (= Jehosheba), the daughter of the king, i.e. Jehoram.<P>1. Jehoiada and the Revolt against Athaliah:<P>(a) The account in <a onClick="return mV(\'2Ch\',23,\'1-21\');">2Ch 23:1-21</a> differs in many respects from that in <a onClick="return mV(\'2Ki\',11,\'4-20\');">2Ki 11:4-20</a>, but even the latter has its problems, and Stade (ZATW, 1885, 280ff) pointed out two sources in it. This view is accepted by many. A reader is struck at once by the double reference to the death of Athaliah (<a onClick="return mV(\'2Ki\',11,16,20);">2Ki 11:16,20</a>), and the construction of the Hebrew for "making a covenant" is different in <a onClick="return mV(\'2Ki\',11,4);">2Ki 11:4</a> from that in <a onClick="return mV(\'2Ki\',11,17);">11:17</A>. Stade holds that there is one narrative in <a onClick="return mV(\'2Ki\',11,\'4-12\',\'18-20\');">11:4-12,18b-20</a> and another in <a onClick="return mV(\'2Ki\',11,\'13-18\');">11:13-18a</A>.<P>In the first, Jehoiada makes an agreement with the captains of the foreign body-guard, and arranges that both the incoming and outgoing temple-guard shall be kept in the temple at the time when the guard should be changed on the Sabbath, and also that th e young prince, Jehoash, who had been kept in hiding, shall be proclaimed. The captains do this, and the prince is crowned and proclaimed (<a onClick="return mV(\'2Ki\',11,\'4-12\');">2Ki 11:4-12</a>). Then officers are set up in the temple, and Jehoash is taken to the royal palace and enthroned. The revolt proves popular with the people of Jerusalem and those of the district, and Athaliah is slain in the palace.<P>But there are difficulties in this narrative, though the above gives the trend of events; <a onClick="return mV(\'2Ki\',11,5);">2Ki 11:5</a> refers to a third of the guard who "came in on the sabbath," and <a onClick="return mV(\'2Ki\',11,7);">11:7</a> to two companies who "go forth on the sabbath"; the Hebrew is, "they that enter the sabbath" and "they that go out of the sabbath." <a onClick="return mV(\'2Ki\',11,9);">2Ki 11:9</a> makes clear the connection between <a onClick="return mV(\'2Ki\',11,5);">11:5</a> and <a onClick="return mV(\'2Ki\',11,7);">7</A>. But <a onClick="return mV(\'2Ki\',11,6);">11:6</a> introduces a difficulty: it seems to denote a division of those who "enter" into three divisions, i.e. the two in <a onClick="return mV(\'2Ki\',11,6);">11:6</A> and one in <a onClick="return mV(\'2Ki\',11,5);">11:5</a>. If <a onClick="return mV(\'2Ki\',11,16);">11:6</a> be omitted, as is proposed by many, this difficulty vanishes. But there still remains the question of the change of guards. Commentators say that "they who enter the sabbath" are those who leave the temple and enter their quarters at the beginning of the Sabbath, presumably, while "those who go out" are those who leave their quarters to mount guard. This is not impossible as an explanation of the Hebrew. It is further believed that the guard at the temple on the Sabbath was double that on other days. The other explanation, held by older commentators is that on the Sabbath the guard was only half its usual size; this gives another meaning to the Hebrew phrases. On the other hand, it may be held that the revolt took place at the close of the Sabbath, and that the double-sized guard was kept by Jehoiada even after the usual-sized one had come to take their place. It should be added that Wellhausen proposed to read (tse\'adhoth), "armlets" (compare <a onClick="return mV(\'Isa\',3,19);">Isa 3:19</a>), for (\'edhuth), "testimony," in <a onClick="return mV(\'2Ki\',11,12);">2Ki 11:12</a>; and in <a onClick="return mV(\'2Ki\',11,19);">11:19</A> the words "and all the people of the land" are held to be an addition.<P>(b) The 2nd narrative (<a onClick="return mV(\'2Ki\',11,\'13-18\');">2Ki 11:13-18a</a>) begins suddenly. Presumably, its earlier part was identical with the earlier part of the 1st narrative, unless <a onClick="return mV(\'2Ki\',11,6);">2Ki 11:6</a> was a part originally of this 2nd account. Athaliah hears the noise of the people (<a onClick="return mV(\'2Ki\',11,13);">11:13</A>, where "the guard" is a gloss and so to be omitted), and comes to the temple, where she witnesses the revolt and cries, "Treason! treason!" Jehoiada orders her to be put forth (omit "between the ranks" in <a onClick="return mV(\'2Ki\',11,15);">11:15</A>), so that she should not be slain in the temple, and she is murdered at one of the palace entrances (<a onClick="return mV(\'2Ki\',11,16);">11:16</A>, where the Revised Version (British and American), following Septuagint of <a onClick="return mV(\'2Ch\',23,15);">2Ch 23:15</a>, translates the first sentence wrongly: it should be "So they laid hands on her"). Jehoiada then makes the king and the people enter into a solemn covenant to be Yahweh\'s people, and the result is the destruction of the temple of Baal, and the death of Mattan, its priest (<a onClick="return mV(\'1Ki\',11,17,18);">1Ki 11:17-18 a</a>). This 2nd narrative gives a religious significance to the revolt, but it is incomplete. The other narrative presents a very natural course of events, for it was absolutely necessary for Jehoiada to secure the allegiance of the royal foreign body-guard.<P>(c) The account in <a onClick="return mV(\'2Ch\',23,\'1-21\');">2Ch 23:1-21</a>, though following that of 2Ki in the main, differs from it considerably. The guard is here composed of Levites; it does not mention the foreign body-guard, and relates how the revolt was planned with the Levites of the cities of Judah—a method which would have become known to Athaliah and for which she would have made preparations, no doubt. Chronicles makes it a wholly religious movement, while 2 Kings gives two points of view. The value of the Chronicler\'s account depends largely on one\'s estimate of the Books of Chronicles and one\'s views as to the development of the Jewish priestly system. A. Van Hoonacker, Lesacerdoce levitique dans la loi et dans l\'histoire des Hebreux, 93-100, defends the account in 2 Chronicles.<P>2. Jehoiada and the Restoration of the Temple:<P>The part which Jehoiada played in the restoration of the temple buildings is described in <a onClick="return mV(\'2Ki\',11,\'21-\');">2Ki 11:21</A>-<a onClick="return mV(\'2Ki\',11,16);">12:16 (Hebrew 12:1-17)</a> parallel <a onClick="return mV(\'2Ch\',24,\'1-14\');">2Ch 24:1-14</a>. Here again the narratives of 2 Kings and 2 Chronicles differ to a large extent.<P class="in15">(a) According to 2 Kings,<P class="in30">(i) the priests are commanded by Jehoash to devote the dues or free-will offerings of the people to repairing the breaches in the temple. They fail to do so, and<P class="in30">(ii) Jehoiada is summoned by the king and rebuked. Then<P class="in30">(iii) a new regulation is put into force: the offerings, except the guilt offerings and sin offerings, are no longer to be given to the priests, but to be put into a chest provided in the temple for the purpose.<P class="in30">(iv) The money got in this way is devoted to repairing the temple, but<P class="in30">(v) none of it is used to provide temple vessels.<P class="in15">(b) Chronicles, on the other hand,<P class="in30">(i) relates that the priests and Levites are commanded to go through Judah to collect the necessary money. They "hastened it not." Then<P class="in30">(ii) Jehoiada is summoned to account for this disobedience, and<P class="in30">(iii) a chest is put outside the temple to receive the tax commanded by Moses.<P class="in30">(iv) This the people pay willingly, and the temple is repaired. There is such a surplus that<P class="in30">(v) there is money also to provide vessels for the temple.<P>It is at least questionable whether the additions in 2 Chronicles are trustworthy; the contradictions against 2 Kings are clear, and the latter gives the more likely narrative, although Van Hoonackcr (op. cit., 10114) defends the former.<P>According to <a onClick="return mV(\'2Ch\',24,15);">2Ch 24:15</a>, Jehoiada lived to be 130 years old, and was buried among the kings—a unique distinction.<P>(3) The King James Version in <a onClick="return mV(\'Neh\',3,6);">Ne 3:6</a> = <a href="study/isbe/search.html?string=JOIADA">JOIADA</a> (which see).<P>(4) There is a Jehoiada, the priest mentioned in <a onClick="return mV(\'Jer\',29,26);">Jer 29:26</a>, in whose stead Zephaniah was declared priest by Shemaiah in a letter.<P>Giesebrecht takes him to be the same as the priest of Athaliah\'s time (see (2) above), but Duhm says that nothing is known of him. In any case, Zephaniah could not have been the direct successor of the well-known Jehoiada, and so the reference can scarcely be to him if it is to have any meaning.``149';
isbe[4925]='Jehoiakim`je-hoi\'-a-kim (yehoyaqim, "Yahweh will establish"; Ioakeim): The name given him by Pharaoh-necoh, who raised him to the throne as vassal king in place of his brother Jehoahaz, is changed from Eliakim (\'elyaqim, "God will establish"). The change compounds the name, after the royal Judean custom, with that of Yahweh; it may also imply that Necoh claims Yahweh\'s authorization for his act, as in a similar way Sennacherib had claimed it for his invasion of Judah (<a onClick="return mV(\'2Ki\',18,25);">2Ki 18:25</a>). He has represented the campaign with which Josiah interfered as undertaken by Divine command (\'El, <a onClick="return mV(\'2Ch\',35,21);">2Ch 35:21</a>); this episode of it merely translates the authorization, rather arrogantly, into the conquered nation\'s dialect.<P>A king of Judah, elder (half-) brother and successor of Jehoahaz; reigned 11 years from 608 BC.<P>I. Sources for His Life and Time.<P>1. Annalistic:<P>The circumstances of his accession and raising of the indemnity to Pharaoh-necoh, followed by a brief resume of his reign, are narrated in <a onClick="return mV(\'2Ki\',23,\'34-\');">2Ki 23:34</a>-<a onClick="return mV(\'2Ki\',24,\'1-6\');">24:6</a>. The naming of the source for "the rest of his acts" (<a onClick="return mV(\'2Ki\',24,5);">24:5</A>) is the last reference we have to "the book of the chronicles of the kings of Judah." The account in <a onClick="return mV(\'2Ch\',36,\'5-8\');">2Ch 36:5-8</a>, though briefer still, mentions Nebuchadnezzar\'s looting of the temple at some uncertain date in his reign. Neither account has any good to say of Jehoiakim; to the writer of 2 Kings, however, his ill fortunes are due to Yahweh\'s retributive justice for the sins of Manasseh; while to the Chronicler the sum of his acts, apparently connected with the desecration of the sanctuary, is characterized as "the abominations which he did." For "the rest of his acts" we are referred, also for the last time, to the "book of the kings of Israel and Judah."<P>2. Prophetic:<P>For the moral and spiritual chaos of the time, and for prophecies and incidents throwing much light on the king\'s character, Jeremiah has a number of extended passages, not, however, in consecutive order.<P>The main ones clearly identifiable with this reign are: <a onClick="return mV(\'2Ki\',22,\'13-19\');">2Ki 22:13-19</a>, inveighing against the king\'s tyrannies and predicting his ignominious death; <a onClick="return mV(\'2Ki\',26,\'1-\');">2 Kings 25</a>, dated in the beginning of his reign and again predicting (as had been predicted before in <a onClick="return mV(\'2Ki\',7,\'2-15\');">7:2-15</A>) the destruction of the temple; <a onClick="return mV(\'2Ki\',25,\'1-\');">2 Kings 25</a>, dated in his 4th year and predicting the conquest of Judah and surrounding nations by Nebuchadnezzar; <a onClick="return mV(\'2Ki\',36,\'1-\');">2 Kings 36</A>, dated in the 4th and 5th years, and telling the story of the roll of prophecy which the king destroyed; <a onClick="return mV(\'2Ki\',45,\'1-\');">2 Kings 45</A>, an appendix from the 4th year, reassuring Baruch the scribe, in terms of the larger prophetic scale, for his dismay at what he had to write; <a onClick="return mV(\'2Ki\',46,\'1-\');">2 Kings 46</A>, also an appendix, a reminiscence of the year of Carchemish, containing the oracle then pronounced against Egypt, and giving words of the larger comfort to Judah. The Book of the prophet Habakkuk, written in this reign, gives expression to the prophetic feeling of doubt and dismay at the unrequited ravages of the Chaldeans against a people more righteous than they, with a sense of the value of steadfast faith and of Yahweh\'s world-movement and purpose which explains the seeming enormity.<P>II. Character and Events of His Reign.<P>1. The Epoch:<P>The reign of Jehoiakim is not so significant for any personal impress of his upon his time as for the fact that it fell in one of the most momentous epochs of ancient history. By the fall of Nineveh in 606 to the assault of Nebuchadnezzar, then crown prince of the rising Babylonian empire, Assyria, "the rod of (Yahweh\'s) anger" (<a onClick="return mV(\'Isa\',10,5);">Isa 10:5</a>), ended its arrogant and inveterate sway over the nations. Nebuehadnezzar, coming soon after to the Chaldean throne, followed up his victory by a vigorous campaign against Pharaoh-necoh, whom we have seen at the end of Josiah\'s reign (see under <a href="study/isbe/search.html?string=JOSIAH">JOSIAH</a>) advancing toward the Euphrates in his attempt to secure Egyptian dominion over Syria and Mesopotamia. The encounter took place in 605 at Carehemish on the northern Euphrates, where Necoh was defeated and driven back to the borders of his own land, never more to renew his aggressions (<a onClick="return mV(\'2Ki\',24,7);">2Ki 24:7</a>). The dominating world-empire was now in the hands of the Chaldeans, "that bitter and hasty nation" (<a onClick="return mV(\'Hab\',1,6);">Hab 1:6</a>); the first stage of the movement by which the world\'s civilization was passing from Semitic to Aryan control. With this world-movement Israel\'s destiny was henceforth to be intimately involved; the prophets were already dimly aware of it, and were shaping their warnings and promises, as by a Divine instinct, to that end. It was on this larger scale of things that they worked; it had all along been their endeavor, and continued with increasing clearness and fervor, to develop in Israel a conscience and stamina which should be a leavening power for good in the coming great era (compare <a onClick="return mV(\'Isa\',2,\'2-4\');">Isa 2:2-4</a>; <a onClick="return mV(\'Mic\',4,\'1-3\');">Mic 4:1-3</a>).<P>2. The King\'s Perverse Character:<P>Of all these prophetic meanings, however, neither the king nor the ruling classes had the faintest realization; they saw only the political exigencies of the moment. Nor did the king himself, in any patriotic way, rise even to the immediate occasion. As to policy, he was an unprincipled opportunist: vassal to Necoh to whom he owed his throne, until Necoh himself was defeated; enforced vassal to Nebuchadnezzar for 3 years along with the other petty kings of Western Asia; then rebelling against the latt er as soon as he thought he could make anything by it. As to responsibility of administration, he had simply the temper of a despotic self-indulgent Oriental. He raised the immense fine that Necoh imposed upon him by a direct taxation, which he farmed out to unscrupulous officials. He indulged himself with erecting costly royal buildings, employing for the purpose enforced and unpaid labor (<a onClick="return mV(\'Jer\',22,\'13-17\');">Jer 22:13-17</a>); while all just interests of his oppressed subjects went wholly unregarded. As to religion, he let matters go on as they had been under Manasseh, probably introducing also the still more strange and heathenish rites from Egypt and the east of which we see the effects in <a onClick="return mV(\'Eze\',8,\'5-17\');">Eze 8:5-17</a>. And meanwhile the reformed temple-worship which Josiah had introduced seems to have become a mere formal and perfunctory matter, to which, if we may judge by his conspicuous absence from fast and festal occasions (e.g. <a onClick="return mV(\'Jer\',26,\'1-\');">Jer 26</a>; <a onClick="return mV(\'Jer\',36,\'1-\');">36</a>), the king paid no attention. His impious act of cutting up and burning Jeremiah\'s roll (<a onClick="return mV(\'Jer\',36,23);">Jer 36:23</a>), as also his vindictive pursuit and murder of Uriah for prophesying in the spirit of Jeremiah (<a onClick="return mV(\'Jer\',26,\'20-23\');">26:20-23</a>), reveal his antipathy to any word that does not prophesy "smooth things" (compare <a onClick="return mV(\'Isa\',30,10);">Isa 30:10</a>), and in fact a downright perversity to the name and will of Yahweh.<P>3. The Prophetic Attitude:<P>With the onset of the Chaldean power, prophecy, as represented in the great seers whose words remain to us, reached a crisis which only time and the consistent sense of its Iarger issues could enable it to weather. Isaiah, in his time, had stood for the inviolability of Zion, and a miraculous deliverance had vindicated his sublime faith. But with Jeremiah, conditions had changed. The idea thus engendered, that the temple was bound to stand and with it Jerusalem, an idea confirmed by Josiah\'s centralizing reforms, had become a superstition and a presumption (compare <a onClick="return mV(\'Jer\',7,4);">Jer 7:4</a>); and Jeremiah had reached the conviction that it, with its wooden rites and glaring abuses, must go: that nothing short of a clean sweep of the old religious fetishes could cure the inveterate unspirituality of the nation. This conviction of his must needs seem to many like an inconsistency—to set prophecy against itself. And when the Chaldean appeared on the scene, his counsel of submission and prediction of captivity would seem a double inconsistency; not only a traversing of a tested prophecy, but treason to the state. This was the situation that he had to encounter; and for it he gave his tender feelings, his liberty, his life. It is in this reign of Jehoiakim that, for the sake of Yahweh\'s word and purpose, he is engulfed in the deep tragedy of his career. And in this he must be virtually alone. Habakkuk is indeed with him in sympathy; but his vision is not so clear; he must weather disheartening doubts, and" cherish the faith of the righteous (<a onClick="return mV(\'Hab\',2,4);">Hab 2:4</a>), and wait until the vision of Yahweh\'s secret purpose clears (<a onClick="return mV(\'Hab\',2,\'1-3\');">Hab 2:1-3</a>). If the prophets themselves are thus having such an equivocal crisis, we can imagine how forlorn is the plight of Yahweh\'s "remnant," who are dependent on prophetic faith and courage to guide them through the depths. The humble nucleus of the true Israel, which is some day to be the nation\'s redeeming element, is undergoing a stern seasoning.<P>4. Harassing and Death:<P>After Syria fell into Nebuchadnezzar\'s power, he seems to have established his headquarters for some years at Riblah; and after Jehoiada attempted to revolt from his authority, he sent against him guerrilla bands from the neighboring nations, and detachments from his Chaldean garrisons, who harassed him with raids and depredations. In <a onClick="return mV(\'2Ch\',36,6,7);">2Ch 36:6-7</a>, it is related that Nebuchadnezzar carried some of the vessels of the temple to Babylon and bound the king in fetters to carry him also to Babylon—the latter purpose apparently not carried out. This was in Jehoiada\'s 4th year. In <a onClick="return mV(\'Dan\',1,1,2);">Da 1:1-2</a>, though ascribed to Jehoiakim\'s 3rd year, this same event is related as the result of a siege of Jerusalem. It is ambiguously intimated also that the king was deported; and among "the seed royal and of the nobles" who were of the company were Daniel and his three companions (<a onClick="return mV(\'Dan\',1,3,6);">Da 1:3,6</a>). The manner of Jehoiakim\'s death is obscure. It is merely said (<a onClick="return mV(\'2Ki\',24,6);">2Ki 24:6</a>) that he "slept with his fathers"; but Josephus (Ant., X, vi, 3) perhaps assuming that Jeremiah\'s prediction (<a onClick="return mV(\'Jer\',22,19);">Jer 22:19</a>) was fulfilled, states that Nebuchadnezzar slew him and cast his body outside the walls unburied.``66';
isbe[4926]='Jehoiarib`je-hoi\'-a-rib (yehoyaribh, "Yahweh pleads" or "contends"): A priest in Jerusalem (<a onClick="return mV(\'1Ch\',9,10);">1Ch 9:10</a>); the name occurs again in <a onClick="return mV(\'1Ch\',24,7);">1Ch 24:7</a> as the name of a family among the 24 courses of priests = the family Joiarib (yoyaribh, same meaning as above, <a onClick="return mV(\'Neh\',1,2,6);">Ne 1:2,6</a>), the head of which is Matrenai in <a onClick="return mV(\'Neh\',12,19);">Ne 12:19</a>. In <a onClick="return mV(\'Neh\',11,10);">Ne 11:10</a> we should probably read ""Jedaiah and Joiarib" for "Jedaiah the son of Joiarib" (compare <a onClick="return mV(\'1Ch\',9,10);">1Ch 9:10</a>). Jehoiarib = Joarib in 1Macc 2:1.``1';
isbe[4927]='Jehonadab`je-hon\'-a-dab (yehonadhabh, either "Yahweh is noble" or "liberal," or "Yahweh has impelled") = Jonadab (yonadhabh, same meaning):<P>(1) Jehonadab in the Hebrew of <a onClick="return mV(\'2Sa\',13,5);">2Sa 13:5</a>; but Jonadab in English Versions of the Bible, and in Hebrew and English Versions of the Bible of <a onClick="return mV(\'2Sa\',13,3,12,35);">13:3,12,35</A>; son of Shimeah, King David\'s brother. He was friendly with Amnon his cousin, and is said to be "a very shrewd (the Revised Version (British and American) "subtle") man." He planned to get Tamar to wait upon Amnon. Two years after, when Absalom had murdered Amnon, and David had heard that all the king\'s sons were assassinated, Jehonadab assured him that only Amnon was killed; and his reassuring tone is justified (<a onClick="return mV(\'2Sa\',13,35);">2Sa 13:35</a>); possibly he knew of Absalom\'s intentions. Septuagint, Lucian, has "Jonathan" in <a onClick="return mV(\'2Sa\',13,3);">2Sa 13:3</a>ff; and in <a onClick="return mV(\'2Sa\',21,21);">2Sa 21:21</a> parallel <a onClick="return mV(\'1Ch\',20,7);">1Ch 20:7</a>, there is mentioned a son of Shimei (= "Shimca," <a onClick="return mV(\'1Ch\',2,7);">1Ch 2:7</a> = "Shammah," <a onClick="return mV(\'1Sa\',16,9);">1Sa 16:9</a>), whose name is Jonathan.<P>See <a href="study/isbe/search.html?string=JONATHAN+(1)">JONATHAN, (4)</a>.<P>(2) Jehonadab in <a onClick="return mV(\'2Ki\',10,15,23);">2Ki 10:15,23</a>; in Hebrew of <a onClick="return mV(\'Jer\',35,8,14,16,18);">Jer 35:8,14,16,18</a> = Jonadab in <a onClick="return mV(\'Jer\',35,6,10,19);">Jer 35:6,10,19</a>, and English Versions of the Bible of <a onClick="return mV(\'Jer\',35,8,14,16,18);">35:8,14,16,18</A>, "son" of Rechab, of the Kenite clan (<a onClick="return mV(\'1Ch\',2,55);">1Ch 2:55</a>). Jehonadab is described in <a onClick="return mV(\'2Ki\',10,\'1-\');">2Ki 10</a> as an ally of Jehu in the olition of Baal-worship in Samaria. Jehu met him after slaying the son of Ahab (<a onClick="return mV(\'2Ki\',10,15);">10:15</A>); the second part of the verse should probably be translated "And he greeted him and said to him, Is thy heart upright (with me) as my heart is with thee? And Jehonadab answered, Yes. Then spake Jehu (so the Septuagint), If so, give me thy hand. In <a onClick="return mV(\'Jer\',35,\'1-\');">Jer 35</a> (where English Versions of the Bible has Jonadab throughout), he is called the "father" of the Rechabites, who derived from him their ordinances for their nomadic life and abstention from wine.`<a href="./study/isbe/search.html?string=RECHAB;+RECHABITES">RECHAB; RECHABITES</a>`149';
isbe[4928]='Jehonathan`je-hon\'-a-than (yehonathan, "Yahweh has given"): The name is the same as Jonathan: the Hebrew has the two forms for the same person sometimes; sometimes only one is found. See <a href="study/isbe/search.html?string=JONATHAN+(1)">JONATHAN</a>. The form "Jehonathan" occurs as follows in English Versions of the Bible:<P>(1) A Levite who took part in teaching the Torah in the cities of Judah under Jehoshaphat (<a onClick="return mV(\'2Ch\',17,8);">2Ch 17:8</a> English Versions of the Bible and Hebrew).<P>(2) Head of the priestly family of Shemaiah (<a onClick="return mV(\'Neh\',12,18);">Ne 12:18</a> English Versions of the Bible and Hebrew).<P>(3) the King James Version and Hebrew in <a onClick="return mV(\'1Ch\',27,25);">1Ch 27:25</a>;`<a href="./study/isbe/search.html?string=JONATHAN+(1)">JONATHAN</a>`1';
isbe[4929]='Jehoram; Joram`je-ho\'-ram, written also in the abbreviated form, (yehoram, yoram, "Yahweh is high"; the Revised Version (British and American) retains "Joram" for Hebrew yehoram in <a onClick="return mV(\'2Ki\',9,\'15-24\');">2Ki 9:15-24</a>):<P>(1) Ninth king of Israel (<a onClick="return mV(\'2Ki\',1,\'17-\');">2Ki 1:17-9:28</a>), son of Ahab and Jezebel, successor to his brother Ahaziah, who died childless. He began to reign 853 BC, and reigned 12 years (<a onClick="return mV(\'2Ki\',3,1);">2Ki 3:1</a>; <a onClick="return mV(\'2Ki\',8,16);">8:16</a>).<P>The statement in <a onClick="return mV(\'2Ki\',1,17);">2Ki 1:17</a>, "the second year of Jehoram," follows a system of chronology common to the Lucian group of manuscripts, in which the 1st year of Jehoshaphat falls in the 11th year of Omri; the 24th year of Jehoshaphat in the 1st year of Ahaziah; and the 1st year of Jehoram in the 2nd year of Jehoram of Judah. The double chronology (<a onClick="return mV(\'2Ki\',1,17);">2Ki 1:17</a> and <a onClick="return mV(\'2Ki\',3,1);">2Ki 3:1</a>) is due to the intention of the compiler of Kings to refer all the acts of Elisha to the reign of Jehoram, thus dislocating the order of events in that reign. Elisha, however, survived Jehoram many years, and it is possible that some of the events are to be referred to subsequent reigns.<P>I. Ninth King of Israel<P>1. His Religious Policy:<P>It is difficult to estimate the religious character of Jehoram. Apparently the fierce fanaticism of Jezebel and the boldness of Ahab reappear in the son in the form of duplicity and superstition. The attempt of Jezebel to substitute Baal for Yahweh had failed. The people were on the side of Yahweh. Otherwise Jehu could not have carried out his bloody reform. All the worshippers of Baal in the land could be gathered into one temple of Baal (<a onClick="return mV(\'2Ki\',10,18);">2Ki 10:18</a>). Evidently Jehoram feared the people. Accordingly he posed as a reformer by putting away the pillar of Baal (<a onClick="return mV(\'2Ki\',3,2);">2Ki 3:2</a>), while secretly he worshipped Baal (<a onClick="return mV(\'2Ki\',3,13);">2Ki 3:13a</a>). Nevertheless, when he got into straits, he expected to receive the help of Yahweh (<a onClick="return mV(\'2Ki\',3,13);">2Ki 3:13</a> b). He had not learned that a dual nature is as impossible as a union of Baal and Yahweh.<P>2. The Moabite War:<P>Immediately upon his accession, Jehoram came into conflict with Mesha, king of Moab (<a onClick="return mV(\'2Ki\',3,4);">2Ki 3:4</a>). The account of the conflict is of special interest because of the supplementary information concerning Mesha furnished by the Moabite Stone. There we learn (ll. 1-8) that Moab became tributary to Israel in the days of Omri, and remained so for forty years, but that it rebelled in the days of Ahab. This probably brings us to the statement in <a onClick="return mV(\'2Ki\',3,4);">2Ki 3:4</a>ff that Mesha "rendered unto the king of Israel the wool of a hundred thousand lambs, and of a hundred thousand rams," and that "when Ahab was dead,...the king of Moab rebelled against the king of Israel." The victories of Mesha, glorified by the Moabite Stone, possibly took place before the events of <a onClick="return mV(\'2Ki\',3,4);">2Ki 3:4</a>ff. Accordingly, Jehoram resolved to recover the allegiance of the Moabites. He called to his aid the ally of his father, Jehoshaphat, king of Judah, and the latter\'s vassal, the king of Edom. Jehoram was entertained at Jerusalem (Josephus, Ant, IX, ii i, 1). The allies marched against Moab by the longer route, around the southern end of the Dead Sea, indicating that Moab was fortified against attack from the west, and that Israel was weak in the east Jordan country. After the allies had been miraculousl y delivered from perishing for lack of water, they devastated the land and sacked the cities, and finally they succeeded in shutting up Mesha in Kir-hareseth. Driven to despair, Mesha offered his eldest son upon the wall as a burnt offering to Chemosh. This seems to have caused the tide to turn, for "there was great wrath against Israel," and the allies returned to their own land, apparently having failed to secure a lasting advantage.<P>3. The Conflicts with Syria:<P>Assuming that <a onClick="return mV(\'2Ki\',4,\'1-\');">2Ki 4-8</a> belong to the reign of Jehoram, it appears that the Syrians made frequent incursions into the land of Israel, perhaps more in the nature of plundering robber bands than invasions by a regular army (<a onClick="return mV(\'2Ki\',6,\'1-\');">2Ki 6</a>). Finally, however, Ben-had in person invaded the country and besieged Samaria. The inhabitants were reduced to horrible straits by famine, when the oppressors took sudden flight and Israel was saved. In the years 849, 848,and 845, Shalmaneser II invaded Syria. It is probable that during this period Jehoram recovered Ramoth-gilead, which had fallen to Syria under Ahab. Hazael succeeded Ben-hadad as ruler of Syria, and his first act, after having murdered his predecessor, was to regain Ramoth-gilead. In the defense of the city, Jehoram, who was assisted by his nephew, Ahaziah, was wounded, and returned to Jezreel to be healed of his wounds.<P>4. The Conspiracy of Jehu:<P>Jehoram left the army at Ramoth-gilead under the command of Jehu, a popular captain of the host. While Jehoram was at Jezreel, Elisha sent a prophet to anoint Jehu as king of Israel. Jehu had been a witness of the dramatic scene when Elijah hurled the curse of Yahweh at Ahab for his crime against Naboth. Jehu at once found in himself the instrument to bring the curse to fulfillment. Accordingly, he conspired his crime against Jehoram With a company of horsemen he proceeded to Jezreel, where Ahaziah was visiting his sick uncle, Jehoram. Jehoram suspected treachery, and, in company with Ahaziah, he rode out to meet Jehu. On his question, "Is it peace, Jehu?" he received a brutal reply that no longer left him in doubt as to the intention of the conspirator. As Jehoram turned to flee, Jehu drew his bow and shot him in the back so that the arrow pierced his heart. His dead body was thrown into the plat of ground that had belonged to Naboth.<P>(2) King of Judah, son of Jehoshaphat (<a onClick="return mV(\'2Ki\',8,\'16-24\');">2Ki 8:16-24</a>; <a onClick="return mV(\'2Ch\',21,\'1-20\');">2Ch 21:1-20</a>), he began to rule about 849 and reigned 8 years. With reference to the chronological difficulty introduced by <a onClick="return mV(\'2Ki\',1,17);">2Ki 1:17</a>, see (1) above.<P>II. King of Judah<P>1. His Marriage:<P>In the beginning of the reigns of Ahab and Jehoshaphat, an attempt was made to end the old feud between Israel and Judah. At the suggestion of Ahab, the two kingdoms, for the first time, joined forces against the common foe from the north, the Syrians. To seal the alliance, Athaliah, daughter of Jezebel and Ahab, was married to Jehoram, son of Jehoshaphat. Thus Jehoram was brother-in-law to (1) above. No doubt this was considered as a master stroke of conciliatory policy by the parties interested. However, it proved disastrous for Judah. Beyond a doubt, the unholy zeal of Jezebel included the Baalizing of Judah as well as of Israel. This marriage was a step in that direction.<P>2. His Idolatry:<P>"A man shall leave his father and his mother, and shall cleave unto his wife." Jehoram did so. "He walked in the ways of the kings of Israel, as did the house of Ahab" (<a onClick="return mV(\'2Ki\',8,18);">2Ki 8:18</a>). According to <a onClick="return mV(\'2Ch\',21,11,13);">2Ch 21:11,13</a>, Jehoram not only accepted the religion of Athaliah, but he became a persecutor, compelling the inhabitants of Jerusalem and of the land to become apostates.<P>3. The Letter of Elijah:<P>Because of his gross idolatry and his wickedness, he is said (<a onClick="return mV(\'2Ch\',21,12);">2Ch 21:12</a>) to have received a denunciatory letter from the prophet Elijah, which, however, had no effect on him. But this leads to a chronological difficulty. Was Elijah still alive? The inference from <a onClick="return mV(\'2Ki\',3,11);">2Ki 3:11</a> is that he was not. Then, too, the Chronicler otherwise never mentions Elijah. Oettli is of the opinion that one should either read "Elisha" for "Elijah," or else consider the letter to have been the conception of a later writer, who felt that Elijah must have taken note of the wickedness of Jehoram and his wife, Athaliah, daughter of Ahab. In the latter event, the letter might be called a haggadic Midrash.<P>4. His Character:<P>A man\'s religion cannot be divorced from his character. Baalism had in it the elements of tyranny and civic unrighteousness. In keeping with his religion, and in true oriental fashion, Jehoram began his reign by murdering his brothers, and other princes of the land, to whom Jehoshaphat had given valuable gifts and responsible positions. The only event belonging to his reign recorded in Kings is the revolt of Edom.<P>5. The Revolt of Edom:<P>Edom was subdued by David, and, probably with the exception of a temporary revolt under Solomon (<a onClick="return mV(\'1Ki\',11,14);">1Ki 11:14</a>), it had remained subject to the united kingdom or to Judah until the revolt under Jehoram The text is somewhat obscure, but both accounts indicate that the expedition of Jehoram against Edom ended in failure. In the account we are told that at the same time Libnah revolted.<P>6. The Raid into Judah:<P>Perhaps the revolt of Libnah should be taken in connection with the invasion of the Philistines and of the Arabians, mentioned in <a onClick="return mV(\'2Ch\',21,\'1-\');">2Ch 21</a>. Libnah was located on the south-western border of Judah. Since it was a border city, it is possible that the compiler of Kings considered it as belonging to Philistia. In the account in Chronicles, Jehoram is represented as having lost all his possessions and all his family, save Jehoahaz, the youngest of his sons, when the town was sacked and the palace plundered by the invading force of Philistines and Arabians. The account appears to be based upon reliable sources.<P>7. His Death:<P>In his last days, he was afflicted with a frightful disease in the bowels. His death was unregretted, and his burial without honor. Contrast, however, <a onClick="return mV(\'2Ki\',8,24);">2Ki 8:24</a> with <a onClick="return mV(\'2Ch\',21,20);">2Ch 21:20</a>. Ahaziah, also called Jehoahaz, his younger son, then became king in his stead.``125';
isbe[4930]='Jehoshabeath`je-ho-shab\'-e-ath (yehoshabh\'ath, "Yahweh is an oath"): In <a onClick="return mV(\'2Ch\',22,11);">2Ch 22:11</a> = <a href="study/isbe/search.html?string=JEHOSHEBA">JEHOSHEBA</a> (which see) Compare <a onClick="return mV(\'2Ki\',11,2);">2Ki 11:2</a>.``1';
isbe[4931]='Jehoshaphat (1)`je-hosh\'-a-fat (yehoshaphat, "Yahweh has judged"):<P>(1) King of Judah. See separate article [<a href="./study/isbe/search.html?string=JEHOSHAPHAT+(2)">Jehoshaphat (2)</a>].<P>(2) Son of Ahilud. He was recorder under David (<a onClick="return mV(\'2Sa\',8,16);">2Sa 8:16</a>; <a onClick="return mV(\'2Sa\',20,24);">20:24</a>; <a onClick="return mV(\'1Ch\',18,15);">1Ch 18:15</a>) and Solomon (<a onClick="return mV(\'1Ki\',4,3);">1Ki 4:3</a>).<P>(3) Son of Paruah, and Solomon\'s overseer in Issachar to provide victuals for the royal household for one month of the year (<a onClick="return mV(\'1Ki\',4,17);">1Ki 4:17</a>).<P>(4) Son of Nimshi, and father of Jehu, king of Northern Israel (<a onClick="return mV(\'2Ki\',9,2,14);">2Ki 9:2,14</a>). His name is omitted in <a onClick="return mV(\'2Ki\',9,20);">9:20</a> and <a onClick="return mV(\'1Ki\',19,16);">1Ki 19:16</a>, where Jehu is called "son of Nimshi."<P>(5) the King James Version (but not Hebrew) in <a onClick="return mV(\'1Ch\',15,24);">1Ch 15:24</a>; the Revised Version (British and American) correctly <a href="study/isbe/search.html?string=JOSHAPHAT">JOSHAPHAT</A> (which see).``149';
isbe[4932]='Jehoshaphat (2)`je-hosh\'-a-fat (yehoshaphat, "Yahweh judges"): The 4th king of Judah, son of Asa. His mother was Azubah, the daughter of Shilhi, of whom nothing further is known. He was 35 years of age at his accession, and reigned 25 years, circa 873-849 BC. Th e history of his reign is contained in <a onClick="return mV(\'1Ki\',22,\'41-50\');">1Ki 22:41-50</a> and in <a onClick="return mV(\'2Ch\',17,\'1-\');">2Ch 17:1-21:1</a>. The narrative in <a onClick="return mV(\'1Ki\',22,\'1-35\');">1Ki 22:1-35a</a> and in <a onClick="return mV(\'2Ki\',3,4);">2Ki 3:4</a>ff belongs to the history of the Northern Kingdom. The absence from Kings of the details contained in 2 Chronicles affords no presumpt against their truth. Neither do high numbers, embellished statements, and the coloring of the writer\'s own age destroy the historical perspective.<P>1. His Religious Policy:<P>The reign of Jehoshaphat appears to have been one of unusual religious activity. It was, however, characterized not so much by striking religious measures as it was by the religious spirit that pervaded every act of the king, who sought the favor of Yahweh in every detail of his life (<a onClick="return mV(\'2Ch\',17,3,4);">2Ch 17:3-4</a>). He evidently felt that a nation\'s character is determined by its religion. Accordingly, he made it his duty to purify the national worship. The "sodomites," i.e. those who practiced immorality in the worsh ip of Yahweh in the temple precincts, were banished from the land (<a onClick="return mV(\'1Ki\',22,46);">1Ki 22:46</a>). The Asherim were taken out of Judah (<a onClick="return mV(\'2Ch\',17,6);">2Ch 17:6</a>; <a onClick="return mV(\'2Ch\',19,3);">19:3</a>), and "the people from Beer-sheba to the hill-country of Ephraim were brought back unto Yahweh, the God of their fathers" (<a onClick="return mV(\'2Ch\',19,4);">2Ch 19:4</a>). Because of his zeal for Yahweh, Jehoshaphat is rewarded with power and "riches and honor in abundance" (<a onClick="return
