isbe[4973]='Jeremias`jer-e-mi\'-as (Ieremias):<P>(1) Named among the sons of Baani as one of those who had married foreign wives (1Esdras 9:34). In <a onClick="return mV(\'Ezr\',10,33);">Ezr 10:33</a> we find, "Jeremai" among the sons of Hashum. In 1Esdras it should come in <span class="noTag">9:33</span> before Manasses.`<a href="./study/isbe/search.html?string=JEREMIAH">JEREMIAH</a>`1';
isbe[4974]='Jeremiel`jer-e-mi\'-el (Latin Hieremihel, al. Jeremiel, "El hurls" or "El appoints"): the King James Version margin and the Revised Version (British and American) in 2Esdras 4:36 for the King James Version "Uriel." He is here called the "archangel" who answers the questions raised by the souls of the righteous dead. He is perhaps identical with Ramiel of Apocrypha Baruch or Remiel of Eth Enoch.``1';
isbe[4975]='Jeremoth`jer\'-e-moth<P>(a) yeremoth and<P>(b) yeremowth,<P>(c) yerimowth, meaning unknown:<hr /><P>Of the following (1) has form (b), (5) the form (c), the rest (a).<P>(1) In <a onClick="return mV(\'1Ch\',7,8);">1Ch 7:8</a> (the King James Version "Jerimoth"), and<P>(2) In <a onClick="return mV(\'1Ch\',8,14);">1Ch 8:14</a>, Benjamites. Compare <a href="study/isbe/search.html?string=JEROHAM">JEROHAM, (2)</A>.<P>(3) In <a onClick="return mV(\'1Ch\',23,23);">1Ch 23:23</a>, and (4) in <a onClick="return mV(\'1Ch\',25,22);">1Ch 25:22</a> = "Jerimoth," <a onClick="return mV(\'1Ch\',24,30);">24:30</A>; heads of Levitical houses.<P>(5) A Naphtalite, one of David\'s tribal princes (<a onClick="return mV(\'1Ch\',27,19);">1Ch 27:19</a>); the King James Version "Jerimoth."<P>(6) (7) (8) Men who had married foreign wives. In <a onClick="return mV(\'Ezr\',10,26);">Ezr 10:26</a> (= "Hieremoth," 1Esdras 9:27); <a onClick="return mV(\'Ezr\',10,27);">Ezr 10:27</a> (= "Jarimoth," 1Esdras 9:28); <a onClick="return mV(\'Ezr\',10,29);">Ezr 10:29</a> (= "Hieremoth," 1Esdras 9:30); the Qere of the last is weramoth, "and Ramoth"; so the Revised Version margin, the King James Version.``149';
isbe[4976]='Jeremy`jer\'-e-mi.`<a href="./study/isbe/search.html?string=JEREMIAH">JEREMIAH</a>`1';
isbe[4977]='Jeremy, the Epistle of`jer\'-e-mi, (Epistole Ieremiou):<P>1. Name<P>2. Canonicity and Position<P>3. Contents<P>4. Original Language<P>5. Authorship, Date and Aim<P>6. Text and Versions<P>LITERATURE<hr /><P>1. Name:<P>In manuscripts Vaticanus and Alexandrinus the title is simply "An Epistle of Jeremiah." But in Codex Vaticanus, etc., there is a superscription introducing the letter: "Copy of a letter which Jeremiah sent to the captives about to be led to Babylon by (Peshitta adds Nebuchadnezzar) the king of the Babylonians, to make known to them what had been commanded him by God." What follows is a satirical exposure of the folly of idolatry, and not a letter. The idea of introducing this as a letter from Jeremiah was probably suggested by <a onClick="return mV(\'Jer\',29,1);">Jer 29:1</a>ff.<P>2. Canonicity and Position:<P>The early Greek Fathers were on the whole favorably disposed toward this tract, reckoning it to be a part of the Canon. It is therefore included in the lists of Canonical writings of Origen, Epiphanius, Cyril of Jerusalem and Athanasius, and it was so authoritatively recognized by the Council of Laodicea (360 AD).<P>In most Greek manuscripts of the Septuagint (Codices Alexandrinus and Vaticanus. March, Chisl, in the Syriac Hexateuch), it follows Lamentations as an independent piece, closing the supposed writings of Jeremiah. In the bestknown printed of the Septuagint (Tischendorf, Swete, etc.), the order is Jeremiah, Baruch, Lain, Epistle of Jeremy. In Fritzsche, Lib. Apocrypha VT Graece, Epistle Jeremiah stands between Baruch and Tobit. But in Latin manuscripts, including those of the Vulgate, it is appended to Baruch, of which it forms chapter 6, though it really has nothing to do with that book. This last is the case with Protestant editions (English versions of the Bible, etc.) of the Apocrypha, a more intelligible arrangement, since Jeremiah and Lamentations do not occur in the Apocrypha, and the Biblical Baruch was Jeremiah\'s amanuensis.<P>3. Contents:<P>In the so-called letter (see 1, above) the author shows the absurdity and wickedness of heathen worship. The Jews, for their sins, will be removed to Babylon, where they will remain 7 generations. In that land they will be tempted to worship the gods of the people. The writer\'s aim is ostensibly to warn them beforehand by showing how helpless and useless the idols worshipped are, and how immoral as well as silly the rites of the Bah religion are. For similar polemics against idolatry, see <a onClick="return mV(\'Isa\',44,\'9-19\');">Isa 44:9-19</a> (which in its earnestness resembles the Epistle Jeremiah closely); <a onClick="return mV(\'Jer\',10,\'3-9\');">Jer 10:3-9</a>; <a onClick="return mV(\'Psa\',115,\'4-8\');">Ps 115:4-8</a>; <a onClick="return mV(\'Psa\',135,\'15-18\');">135:15-18</a>; <span class="noTag">The Wisdom of Solomon 13:10-19; 15:13-17</span>.<P>4. Original Language:<P>That the Epistle Jeremiah was composed in Greek is the opinion of practically all scholars. There are no marks of translation; the Greek is on the whole good, and abounds in such rhetorical terms as characterized the Greek of Northern Egypt about the beginning of our era. There is no trace of a Hebrew original, though Origen has been mistakenly understood to say there was one in his day (see Schurer, GJV4, III, 467f). Romanist writers defend a Hebrew original, and point to some Hebraisms (verse 44 and the use of the fut. for the past), but these can be matched in admittedly Hellenistic Greek writings.<P>5. Authorship, Date and Aim:<P>The writer was almost certainly a resident in Alexandria toward the close of the last century BC. The Greek of the book, the references to Egyptian religion (verse 19, where the Feast of Lights at Sais—Herod. ii. 62—is referred to), and the allusion to the Epistle Jeremiah in 2Macc 2:2, denied by Schurer, etc., make the above conclusion very probable. The author had in mind the dangers to the religion of his fellow-countrymen presented by the fascinating forms of idolatry existing at Alexandria. Certainly Jeremiah is not the author, for the book was written in Greek and never formed part of the Hebrew Canon. Besides, the treatment is far below the level of the genuine writings of that prophet.<P>6. Text and Versions:<P>(1) The Greek.<P>This epistle occurs in the principal manuscripts of the Septuagint uncials (Codices Vaticanus, Alexandrinus, Q, Gamma, contain 7b-24a, etc.) and cursives (except 70, 96, 229).<P>(2) The Syriac.<P>P follows the Greek, but very freely. The Syriac H follows the text of Codex Vaticanus closely, often at the expense of Syriac idioms.<P>(3) The Latin.<P>The Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) is made direct from the Greek. There is a different Latin version published by Sabatier in his Biblical Sacr. Latin Versiones Antiquas, II, 734ff. It is freer than the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.)<P>(4) The Arabic.<P>There are also Arabic (following A), Coptic (ed Quatremere, 1810), and Ethiopic (ed Dillmann, 1894)versions.<P>LITERATURE.<P>See under <a href="study/isbe/search.html?string=APOCRYPHA">APOCRYPHA</A> for commentary and various editions. But note in addition to the literature mentioned the article the following: Reusch, Erklar. des B. Baruch, 1853; Daubanton, "Het Apok boek Epistole Ieremiou," Theol. Studien,1888,126-38.``33';
isbe[4978]='Jeriah`je-ri\'-a (yeriyahu, "founded of Yahweh"): In <a onClick="return mV(\'1Ch\',23,19);">1Ch 23:19</a>; <a onClick="return mV(\'1Ch\',24,23);">24:23</a> = "Jerijah" (yeriyah), <a onClick="return mV(\'1Ch\',26,31);">26:31</a>, head of a Levitical house: called chief of the Hebronites in <a onClick="return mV(\'1Ch\',24,23);">24:23</A> (compare <a onClick="return mV(\'1Ch\',24,30);">24:30</a>).``1';
isbe[4979]='Jeribai`jer\'-i-bi, jer-i-ba\'-i (yeribhay, meaning uncertain): One of David\'s mighty men of the armies (<a onClick="return mV(\'1Ch\',11,46);">1Ch 11:46</a>); one of the names not found in the list in <a onClick="return mV(\'2Sa\',23,\'24-29\');">2Sa 23:24-29a</a>.``1';
isbe[4980]='Jericho`jer\'-i-ko (the word occurs in two forms. In the Pentateuch, in <a onClick="return mV(\'2Ki\',25,5);">2Ki 25:5</a> and in Ezra, Nehemiah, Chronicles it is written yerecho; yericho, elsewhere): In <a onClick="return mV(\'1Ki\',16,34);">1Ki 16:34</a> the final Hebrew letter is he (h), instead of waw (w). The termination waw (w) thought to preserve the peculiarities of the old Canaanite. dialect. In the Septuagint we have the indeclinable form, Iericho (Swete has the form Iereicho as well), both with and without the feminine article; in the New Testament Iereicho, once with the feminine article The Arabic is er-Riha. According to <a onClick="return mV(\'Deu\',32,49);">De 32:49</a> it stood opposite Nebo, while in <a onClick="return mV(\'Deu\',34,3);">34:3</A> it is called a city grove of palm trees. It was surrounded with a wall (<a onClick="return mV(\'Jos\',2,15);">Jos 2:15</a>), and provided with a gate which was closed at night (<a onClick="return mV(\'Jos\',2,5);">Jos 2:5</a>), and was ruled over by a king. When captured, vessels of brass and iron, large quantities of silver and gold, and "a goodly Babylonish garment" were found in it (<a onClick="return mV(\'Jos\',7,21);">Jos 7:21</a>). It was on the western side of the Jordan, not far from the camp of Israel at Shittim, before crossing the river (<a onClick="return mV(\'Jos\',2,1);">Jos 2:1</a>). The city was on the "plains" (<a onClick="return mV(\'Jos\',4,13);">Jos 4:13</a>), but so close to "the mountain" on the west (probably the cliffs of Quarantania, the traditional scene of Christ\'s temptation) that it was within easy reach of the spies, protected by Rahab. It was in the lot of Benjamin (<a onClick="return mV(\'Jos\',18,21);">Jos 18:21</a>), the border of which ascended to the "slope (English versions of the Bible "side") of Jeremiah on the north" (<a onClick="return mV(\'Jos\',18,12);">Jos 18:12</a>). Authorities are generally agreed in locating the ancient city at Tel es-Sultan, a mile and a half northwest of modern Jericho. Here there is a mound 1,200 ft. long and 50 ft. in height supporting 4 smaller mounds, the highest of which is 90 ft. above the base of the main mound.<P>The geological situation (see <a href="study/isbe/search.html?string=JORDAN+VALLEY">JORDAN VALLEY</A>) sheds great light upon the capture of the city by Joshua (<a onClick="return mV(\'Jos\',6,\'1-\');">Jos 6</a>). If the city was built as we suppose it to have been, upon the unconsolidated sedimentary deposits which accumulated to a great depth in the Jordan valley during the enlargement of the Dead Sea, which took place in Pleistocene (or glacial) times, the sudden falling of the walls becomes easily credible to anyone who believes in the personality of God and in His power either to foreknow the future or to direct at His will the secondary causes with which man has to deal in Nature. The narrative does not state that the blowing of the rams\' horns of themselves effected the falling of the walls. It was simply said that at a specified juncture on the 7th day the walls would fall, and that they actually fell at that juncture. The miracle may, therefore, be regarded as either that of prophecy, in which the Creator by foretelling the course of things to Joshua, secured the junction of Divine and human activities which constitutes a true miracle, or we may regard the movements which brought down the walls to be the result of direct Divine action, such as is exerted by man when be produces an explosion of dynamite at a particular time and place. The phenomena are just such as occurred in the earthquake of San Francisco in 1906, where, according to the report of the scientific commission appointed by the state, "the most violent destruction of buildings was on the made ground. This ground seems to have behaved during the earthquake very much in the same way as jelly in a bowl, or as a semi-liquid in a tank." Santa Rosa, situated on the valley floor, "underlain to a considerable depth by loose or slightly coherent geological formations,...20 miles from the rift, was the most severely shaken town in the state and suffered the greatest disaster relatively to its population and extent" (Report, 13 and 15). Thus an earthquake, such as is easily provided for along the margin of this great Jordan crevasse, would produce exactly the phenomena here described, and its occurrence at the time and place foretold to Joshua constitutes it a miracle of the first magnitude.<P>Notwithstanding the curse pronounced in <a onClick="return mV(\'Jos\',6,26);">Jos 6:26</a> the King James Version, prophesying that whosoever should rebuild the city "he shall lay the foundations thereof in his firstborn," it was rebuilt (<a onClick="return mV(\'1Ki\',16,34);">1Ki 16:34</a>) by Hiel the Bethelite in the days of Ahab. The curse was literally fulfilled. Still David\'s messengers are said to have "tarried at Jericho" in his day (<a onClick="return mV(\'2Sa\',10,5);">2Sa 10:5</a>; <a onClick="return mV(\'1Ch\',19,5);">1Ch 19:5</a>). In Elisha\'s time (<a onClick="return mV(\'2Ki\',2,5);">2Ki 2:5</a>) there was a school of prophets there, while several other references to the city occur in the Old Testament and the Apocrypha (<a onClick="return mV(\'2Ch\',28,15);">2Ch 28:15</a>, where it is called "the city of palmtrees"; <a onClick="return mV(\'2Ki\',25,5);">2Ki 25:5</a>; <a onClick="return mV(\'Jer\',39,5);">Jer 39:5</a>; <a onClick="return mV(\'Ezr\',2,34);">Ezr 2:34</a>; <a onClick="return mV(\'Neh\',3,2);">Ne 3:2</a>; <a onClick="return mV(\'Neh\',7,36);">7:36</a>; 1Macc 9:50). Josephus describes it and the fertile plain surrounding it, in glowing terms. In the time of Christ, it was an important place yielding a large revenue to the royal family. But the city which Herod rebuilt was on a higher elevation, at the base of the western mountain, probably at Beit Jubr, where there are the ruins of a small fort. Jericho was the place of rendezvous for Galilean pilgrims desiring to avoid Samaria, both in going to and in departing from Jerusalem, and it has been visited at all times by thousands of pilgrims, who go down from Jerusalem to bathe in the Jordan. The road leading from Jerusalem to Jericho is still infested by robbers who hide in the rocky caverns adjoining it, and appear without warning from the tributary gorges of the wadies which dissect the mountain wall. At the present time Jericho and the region about is occupied only by a few hundred miserable inhabitants, deteriorated by the torrid climate which prevails at the low level about the head of the Dead Sea. But the present barrenness of the region is largely due to the destruction of the aqueducts which formerly distributed over the plain the waters brought down through the wadies which descend from the mountains of Judea. The ruins of many of these are silent witnesses of the cause of its decay. Twelve aqueducts at various levels formerly branched from the Wady Kelt, irrigating the plain both north and south. Remains of Roman masonry are found in these. In the Middle Ages they were so repaired that an abundance and variety of crops were raised, including wheat, barley, millet, figs, grapes and sugar cane.`<a href="./study/isbe/search.html?string=PALESTINE+EXPLORATION,+1">PALESTINE EXPLORATION</a>`198';
isbe[4981]='Jeriel`je\'-ri-el, jer\'-i-el (yeri\'el, "founded of God"; compare <a href="study/isbe/search.html?string=JERIAH">JERIAH</a>): A chief of Issachar (<a onClick="return mV(\'1Ch\',7,2);">1Ch 7:2</a>).``1';
isbe[4982]='Jerijah`je-ri\'-ja (<a onClick="return mV(\'1Ch\',26,31);">1Ch 26:31</a>).`<a href="./study/isbe/search.html?string=JERIAH">JERIAH</a>`1';
isbe[4983]='Jerimoth`jer\'-i-moth (see <a href="study/isbe/search.html?string=JEREMOTH">JEREMOTH, (c)</a>):<P>(1) A Benjamite (<a onClick="return mV(\'1Ch\',7,7);">1Ch 7:7</a>).<P>(2) A Benjamite who joined David at Ziklag, or perhaps a Judean (<a onClick="return mV(\'1Ch\',12,5);">1Ch 12:5 (Hebrew 6)</span>).<P>(3) In <a onClick="return mV(\'1Ch\',24,30);">1Ch 24:30</a> = <a href="study/isbe/search.html?string=JEREMOTH">JEREMOTH, (4)</a> (which see).<P>(4) A Levite musician in David\'s time (<a onClick="return mV(\'1Ch\',25,4);">1Ch 25:4</a>).<P>(5) Son of David and father of Mahalath, Rehoboam\'s wife (<a onClick="return mV(\'2Ch\',11,18);">2Ch 11:18</a>). He is not mentioned (<a onClick="return mV(\'2Sa\',3,\'2-5\');">2Sa 3:2-5</a>; <a onClick="return mV(\'2Sa\',5,\'14-16\');">5:14-16</a>; <a onClick="return mV(\'1Ch\',3,\'1-9\');">1Ch 3:1-9</a>; <a onClick="return mV(\'1Ch\',14,\'4-7\');">14:4-7</a>) among the sons of David\'s wives, so Curtis (Ch, 369) thinks that he was either the son of a concubine, or possibly the name is a corruption of "Ithream" (yithre\'am, <a onClick="return mV(\'1Ch\',3,3);">1Ch 3:3</a>).<P>(6) A Levite overseer in Hezekiah\'s time (<a onClick="return mV(\'2Ch\',31,13);">2Ch 31:13</a>).``149';
isbe[4984]='Jerioth`jer\'-i-oth, jer\'-i-oth (yeri\'oth, "(tent-) curtains"): In <a onClick="return mV(\'1Ch\',2,18);">1Ch 2:18</a>, where Massoretic Text is corrupt, Kittel in his commentary and in Biblical Hebrew reads "Caleb begat (children) of Azubah his wife, Jerioth." Wellhausen (De Gent. et Fam. Jud., 33) reads, "Caleb begat (children) of Azubah his wife, the daughter of Jerioth." According to English Versions of the Bible, Caleb had two wives, but the context does not bear this out. J. H. Michaelis regarded Jerioth as another name for Azubah. See Curtis, Commentary on Chronicles, 92.``1';
isbe[4985]='Jeroboam`jer-o-bo\'-am (yarobh\'am; Septuagint Hieroboam, usually assumed to have been derived from riyb and \'am, and signifying "the people contend," or, "he pleads the people\'s cause"): The name was borne by two kings of Israel.<P>(1) Jeroboam I, son of Nebat, an Ephraimite, and of Zeruah, a widow (<a onClick="return mV(\'1Ki\',11,\'26-40\');">1Ki 11:26-40</a>; <a onClick="return mV(\'1Ki\',12,14);">12-14:20</a>). He was the first king of Israel after the disruption of the kingdom, and he reigned 22 years (937-915 BC).<P>I. Jeroboam I<P>1. Sources:<P>The history of Jeroboam is contained in <a onClick="return mV(\'1Ki\',11,\'26-40\');">1Ki 11:26-40</a>; <a onClick="return mV(\'1Ki\',12,\'1-\');">12:1-14:20</a>; <a onClick="return mV(\'2Ch\',10,\'1-\');">2Ch 10:1</a>-<a onClick="return mV(\'2Ch\',10,\'1-4\');">11:4</a>; <a onClick="return mV(\'2Ch\',11,\'14-16\');">11:14-16</a>; <a onClick="return mV(\'2Ch\',12,15);">12:15</a>; <a onClick="return mV(\'2Ch\',13,\'3-20\');">13:3-20</a>, and in an insertion in the Septuagint after <a onClick="return mV(\'1Ki\',12,24);">1Ki 12:24</a> (a-z). This insertion covers about the same ground as the Massoretic Text, and the Septuagint elsewhere, with some additions and variations. The fact that it calls Jeroboam\'s mother a porne (harlot), and his wife the Egyptian princess Ano (compare <a onClick="return mV(\'1Ki\',11,\'1-\');">1Ki 11</a>); that Jeroboam is punished by the death of his son before he has done any wrong; that the episode with the prophet\'s mantle does not occur until the meeting at Shechem; that Jeroboam is not proclaimed king at all—all this proves the passage inferior to the Massoretic Text. No doubt it is a fragment of some historical work, which, after the manner of the later Midrash, has combined history and tradition, making rather free use of the historical kernel.<P>2. His Rise and Revolt:<P>Jeroboam, as a highly gifted and valorous young Ephraimite, comes to the notice of Solomon early in his reign (<a onClick="return mV(\'1Ki\',11,28);">1Ki 11:28</a>; compare <a onClick="return mV(\'1Ki\',9,15,24);">9:15,24</a>). Having noticed his ability, the king made him overseer of the fortifications and public work at Jerusalem, and placed him over the levy from the house of Joseph. The fact that the latter term may stand for the whole of the ten tribes (compare <a onClick="return mV(\'Amo\',5,6);">Am 5:6</a>; <a onClick="return mV(\'Amo\',6,6);">6:6</a>; <a onClick="return mV(\'Oba\',1,18);">Ob 1:18</a>) indicates the importance of the position, which, however, he used to plot against the king. No doubt he had the support of the people in his designs. Prejudices of long standing (<a onClick="return mV(\'2Sa\',19,40);">2Sa 19:40</a>f; <a onClick="return mV(\'2Sa\',20,\'1-\');">20</a>f) were augmented when Israelite interests were made subservient to Judah and to the king, while enforced labor and burdensome taxation filled the people\'s hearts with bitterness and jealousy. Jeroboam, the son of a widow, would be the first to feel the gall of oppression and to give voice to the suffering of the people. In addition, he had the approval of the prophet Ahijah of the old sanctuary of Shiloh, who, by tearing his new mantle into twelve pieces and giving ten of them to Jeroboam, informed him that he was to become king of the ten tribes. Josephus says (Ant., VIII, vii, 8) that Jeroboam was elevated by the words of the prophet, "and being a young man of warm temper, and ambitious of greatness, he could not be quiet," but tried to get the government into his hands at once. For the time, the plot failed, and Jeroboam fled to Egypt where he was received and kindly treated by Shishak, the successor to the father-in-law of Solomon.<P>3. The Revolt of the Ten Tribes:<P>The genial and imposing personality of Solomon had been able to stem the tide of discontent excited by his oppressive regime, which at his death burst all restraints. Nevertheless, the northern tribes, at a popular assembly held at Shechem, solemnly promised to serve Rehoboam, the son of Solomon, who had already been proclaimed king at Jerusalem, on condition that he would lighten the burdens that so unjustly rested upon them. Instead of receiving the magna charta which they expected, the king, in a spirit of despotism, gave them a rough answer, and Josephus says "the people were struck by his words, as it were, by an iron hammer" (Ant., VIII, viii, 3). But despotism lost the day. The rough answer of the king was met by the Marseillaise of the people:<P>"What portion have we in David?<br>Neither have we inheritance in the son of Jesse:<br>To your tents. O Israel:<br>Now see to thine own house, David" (<a onClick="return mV(\'1Ki\',12,16);">1Ki 12:16</a>).<P>Seeing the turn affairs had taken, but still unwilling to make any concessions, Rehoboam sent Adoram, who had been over the levy for many years (<a onClick="return mV(\'1Ki\',5,14);">1Ki 5:14</a>; <a onClick="return mV(\'1Ki\',12,18);">12:18</a>), and who no doubt had quelled dissatisfaction before, to force the people to submission, possibly by the very methods he had threatened to employ (<a onClick="return mV(\'1Ki\',12,14);">1Ki 12:14</a>). However, the attempt failed. The aged Adoram was stoned to death, while Rehoboam was obliged to flee ignominiously back to Jerusalem, king only of Judah (<a onClick="return mV(\'1Ki\',12,20);">1Ki 12:20</a>). Thus, the great work of David for a united kingdom was shattered by inferiors, who put personal ambitions above great ideals.<P>4. The Election:<P>As soon as Jeroboam heard that Solomon was dead, he returned from his forced exile in Egypt and took up his residence in his native town, Zeredah, in the hill country of Ephraim Septuagint <a onClick="return mV(\'1Ki\',12,20);">1Ki 12:20</a>ff). The northern tribes, having rejected the house of David, now turned to the leader, and perhaps instigator of the revolution. Jeroboam was sent for and raised to the throne by the choice and approval of the popular assembly. Divinely set apart for his task, and having the approval of the people, Jeroboam nevertheless failed to rise to the greatness of his opportunities, and his kingdom degenerated into a mere military monarchy, never stronger than the ruler who chanced to occupy the throne. In trying to avoid the Scylla that threatened its freedom and faith (<a onClick="return mV(\'1Ki\',11,33);">1Ki 11:33</a>), the nation steered into the Charybdis of revolution and anarchy in which it finally perished.<P>5. Political Events:<P>Immediately upon his accession, Jeroboam fortified Shechem, the largest city in Central Israel, and made it his capital. Later he fortified Penuel in the east Jordan country. According to <a onClick="return mV(\'1Ki\',14,17);">1Ki 14:17</a>, Tirzah was the capital during the latter part of his reign. About Jeroboam\'s external relations very little is known beyond the fact that there was war between him and Rehoboam constantly (<a onClick="return mV(\'1Ki\',14,30);">1Ki 14:30</a>). In <a onClick="return mV(\'2Ch\',13,\'2-20\');">2Ch 13:2-20</a> we read of an inglorious war with Abijah of Judah. When Shishak invaded Judah (<a onClick="return mV(\'1Ki\',14,25);">1Ki 14:25</a>f), he did not spare Israel, as appears from his inscription on the temple at Karnak, where a list of the towns captured by him is given. These belong to Northern Israel as well as to Judah, showing that Shishak exacted tribute there, even if he used violence only in Judah. The fact that Jeroboam successfully managed a revolution but failed to establish a dynasty shows that his strength lay in the power of his personality more than in the soundness of his principles.<P>6. His Religious Policy:<P>Despite the success of the revolution politically, Jeroboam descried in the halo surrounding the temple and its ritual a danger which threatened the permanency of his kingdom. He justifiably dreaded a reaction in favor of the house of David, should the people make repeated religious pilgrimages to Jerusalem after the first passion of the rebellion had spent itself. He therefore resolved to establish national sanctuaries in Israel. Accordingly, he fixed on Bethel, which from time immemorial was one of the chief sanctuaries of the land (<a onClick="return mV(\'Gen\',28,19);">Ge 28:19</a>; <a onClick="return mV(\'Gen\',35,1);">35:1</a>; <a onClick="return mV(\'Hsa\',12,4);">Ho 12:4</a>), and Dan, also a holy place since the conquest, as the chief centers of worship for Israel. Jeroboam now made "two calves of gold" as symbols of the strength and creative power of Yahweh, and set them up in the sanctuaries at Bethel and Dan, where altars and other sacred objects already existed. It appears that many of the priests still in the land were opposed to his image-worship (<a onClick="return mV(\'2Ch\',11,13);">2Ch 11:13</a>). Accordingly, he found it necessary to institute a new, non-Levitical priesthood (<a onClick="return mV(\'1Ki\',13,33);">1Ki 13:33</a>). A new and popular festival on the model of the feasts at Jerusalem was also established. Jeroboam\'s policy might have been considered as a clever political move, had it not contained the dangerous ppeal to the lower instincts of the masses, that led them into the immoralities of heathenism and hastened the destruction of the nation. Jeroboam sacrificed the higher interests of religion to politics. This was the "sin of Jeroboam the son of Nebat, wherewith he made Israel to sin" (<a onClick="return mV(\'1Ki\',12,30);">1Ki 12:30</a>; <a onClick="return mV(\'1Ki\',16,26);">16:26</a>).<P>7. Hostility of the Prophets:<P>It may be that many of the prophets sanctioned Jeroboam\'s religious policy. Whatever the attitude of the majority may have been, there was no doubt a party who strenuously opposed the image-worship.<P>(1) The Anonymous Prophet.<P>On the very day on which Jeroboam inaugurated the worship at the sanctuary at Bethel "a man of God out of Judah" appeared at Bethel and publicly denounced the service. The import of his message was that the royal altar should some day be desecrated by a ruler from the house of David. The prophet was saved from the wrath of the king only by a miracle. "The altar also was rent, and the ashes poured out from the altar." This narrative of <a onClick="return mV(\'1Ki\',13,\'1-\');">1Ki 13</a> is usually assumed to belong to a later time, but whatever the date of compilation, the general historicity of the account is little affected by it.<P>(2) The Prophet Ahijah.<P>At a later date, when Jeroboam had realized his ambition, but not the ideal which the prophet had set before him, Ahijah predicted the consequences of his evil policy. Jeroboam\'s eldest son had fallen sick. He thought of Ahijah, now old and blind, and sent the queen in disguise to learn the issue of the sickness. The prophet bade her to announce to Jeroboam that the house of Jeroboam should be extirpated root and branch; that the people whom he had seduced to idolatry should be uprooted from the land and transported beyond the river; and, severest of all, that her son should die.<P>8. His Death:<P>Jeroboam died, in the 22nd year of his reign, having "bequeathed to posterity the reputation of an apostate and a succession of endless revolutions."<P>(2) Jeroboam II (<a onClick="return mV(\'2Ki\',14,\'23-29\');">2Ki 14:23-29</a>), son of Joash and 13th king of Israel; 4th sovereign of the dynasty of Jehu. He reigned 41 years. His accession may be placed circa 798 BC (some date lower).<P>II. Jeroboam II<P>1. His Warlike Policy:<P>Jeroboam came into power on the crest of the wave of prosperity that followed the crushing of the supremacy of Damascus by his father. By his great victory at Aphek, followed by others, Joash had regained the territory lost to Israel in the reigns of Jehu and Jehoahaz (<a onClick="return mV(\'2Ki\',13,17,25);">2Ki 13:17, 25</a>). This satisfied Joash, or his death prevented further hostilities. Jeroboam, however, then a young man, resolved on a war of retaliation against Damascus, and on further conquests. The condition of the eastern world favored his projects, for Assyria was at the time engaged, under Shalmaneser III and Assurdan III, in a life-and-death struggle with Armenia. Syria being weakened, Jeroboam determined on a bold attempt to conquer and annex the whole kingdom of which Damascus was the capital. The steps of the campaign by which this was accomplished are unknown to us. The result only is recorded, that not only the intermediate territory fell into Jeroboam\'s hands, but that Damascus itself was captured (<a onClick="return mV(\'2Ki\',14,28);">2Ki 14:28</a>). Hamath was taken, and thus were restored the eastern boundaries of the kingdom, as they were in the time of David (<a onClick="return mV(\'1Ch\',13,5);">1Ch 13:5</a>). From the time of Joshua "the entrance of Hamath" (<a onClick="return mV(\'Jos\',13,5);">Jos 13:5</a>), a narrow pass leading into the valley of the Lebanons, had been the accepted northern boundary of the promised land. This involved the subjection of Moab and Ammon, probably already tributaries of Damascus.<P>2. New Social Conditions:<P>Jeroboam\'s long reign of over 40 years gave time for the collected tribute of this greatly increased territory to flow into the coffers of Samaria, and the exactions would be ruthlessly enforced. The prophet Amos, a contemporary of Jeroboam in his later years, dwells on the cruelties inflicted on the trans-Jordanic tribes by Hazael, who "threshed Gilead with threshing instruments of iron" (<a onClick="return mV(\'Amo\',1,3);">Am 1:3</a>). All this would be remembered now, and wealth to which the Northern Kingdom had been unaccustomed flowed in to its treasuries. The hovels of unburned brick in which the citizens had lived were replaced by "houses of hewn stone" (<a onClick="return mV(\'Amo\',5,11);">Am 5:11</a>). The ivory house which Ahab built in Samaria (<a onClick="return mV(\'1Ki\',22,39);">1Ki 22:39</a>; decorations only are meant) was imitated, and there were many "great houses" (<a onClick="return mV(\'Amo\',3,15);">Am 3:15</a>). The sovereign had both a winter and a summer palace. The description of a banqueting scene within one of these palatial abodes is lifelike in its portraiture. The guests stretched themselves upon the silken cushions of the couches, eating the flesh of lambs and stall-fed calves, drinking wine from huge bowls, singing idle songs to the sound of viols, themselves perfumed and anointed with oil (<a onClick="return mV(\'Amo\',6,\'4-6\');">Am 6:4-6</a>). Meanwhile, they were not grieved for the affliction of Joseph, and cared nothing for the wrongdoing of which the country was full. Side by side with this luxury, the poor of the land were in the utmost distress. A case in which a man was sold into slavery for the price of a pair of shoes seems to have come to the prophet\'s knowledge, and is twice referred to by him (<a onClick="return mV(\'Amo\',2,6);">Am 2:6</a>; <a onClick="return mV(\'Amo\',8,6);">8:6</a>).<P>3. Growth of Ceremonial Worship:<P>With all this, and as part of the social organization, religion of a kind flourished. Ritual took the place of righteousness; and in a memorable passage, Amos denounces the substitution of the one for the other (<a onClick="return mV(\'Amo\',5,21);">Am 5:21</a>). The worship took place in the sanctuaries of the golden calves, where the votaries prostrated themselves before the altar clothed in garments taken in cruel pledge, and drank sacrificial wine bought with the money of those who were fined for non-attendance there (<a onClick="return mV(\'Amo\',2,8);">Am 2:8</a>). There we are subsidiary temples and altars at Gilgal and Beersheba (<a onClick="return mV(\'Amo\',4,4);">Am 4:4</a>; <a onClick="return mV(\'Amo\',5,5);">5:5</a>; <a onClick="return mV(\'Amo\',8,14);">8:14</a>). Both of these places had associations with the early history of the nation, and would be attended by worshippers from Judah as well as from Israel.<P>4. Mission to Amos:<P>Toward the close of his reign, it would appear that Jeroboam had determined upon adding greater splendor and dignity to the central shrine, in correspondence with the increased wealth of the nation. Amos, about the same time, received a commission to go to Bethel and testify against the whole proceedings there. He was to pronounce that these sanctuaries should be laid waste, and that Yahweh would raise the sword against the house of Jeroboam. (<a onClick="return mV(\'Amo\',7,9);">Am 7:9</a>). On hearing his denunciation, made probably as he stood beside the altar, Amaziah, the priest of Bethel, sent a messenger to the king at Samaria, to tell him of the "conspiracy" of Amos, and that the land was not able to bear all his words. The messenger bore the report that Amos had declared "Jeroboam shall die by the sword," which Amos had not done. When the messenger had gone, priest and prophet had a heated controversy, and new threatenings were uttered (<a onClick="return mV(\'Amo\',7,\'10-17\');">Am 7:10-17</a>).<P>5. Prophecy of Jonah:<P>The large extension of territory acquired for Israel by Jeroboam is declared to have been the realization of a prophecy uttered earlier by Jonah, the son of Amittai (<a onClick="return mV(\'2Ki\',14,25);">2Ki 14:25</a>)—the same whose mission to Nineveh forms the subject of the Book of Jonah (<a onClick="return mV(\'Jon\',1,1);">1:1</a>). It is also indicated that the relief which had now come was the only alternative to the utter extinction of Israel. But Yahweh sent Israel a "saviour" (<a onClick="return mV(\'2Ki\',13,5);">2Ki 13:5</a>), associated by some with the Assyrian king Ramman-nirari III, who crushed Damascus, and left Syria an easy prey, first to Jehoash, then to Jeroboam. (see <a href="study/isbe/search.html?string=JEHOASH">JEHOASH</a>), but whom the historian seems to connect with Jeroboam himself (<a onClick="return mV(\'2Ki\',14,26,27);">2Ki 14:26-27</a>).<P>Jeroboam was succeeded on his death by his weak son Zechariah (<a onClick="return mV(\'2Ki\',14,29);">2Ki 14:29</a>).``126';
isbe[4986]='Jeroham`je-ro\'-ham (yerocham, "may he be compassionate!"):<P>(1) An Ephraimite, the father of Elkanah, and grandfather of Samuel (<a onClick="return mV(\'1Sa\',1,1);">1Sa 1:1</a>; <a onClick="return mV(\'1Ch\',6,27,34);">1Ch 6:27, 34 (Hebrew 12,19)</a>): Jerahmeel is the name in Septuagint, Codex Vaticanus, in 1 Samuel and in Septuagint, L and manuscripts, in 1 Chronicles.<P>(2) A Benjamite (<a onClick="return mV(\'1Ch\',8,27);">1Ch 8:27</a>), apparently = <a href="study/isbe/search.html?string=JEREMOTH">JEREMOTH, (2)</a> (compare <a onClick="return mV(\'1Ch\',8,14);">8:14</a>), and probably the same as he of <a onClick="return mV(\'1Ch\',9,8);">1Ch 9:8</a>.<P>(3) Ancestor of a priest in Jerusalem (<a onClick="return mV(\'1Ch\',9,12);">1Ch 9:12</a> = <a onClick="return mV(\'Neh\',11,12);">Ne 11:12</a>).<P>(4) A man of Gedor, father of two of David\'s Benjamite recruits at Ziklag, though Gedor might be a town in Southern Judah (<a onClick="return mV(\'1Ch\',12,7);">1Ch 12:7 (Hebrew 8)</a>).<P>(5) Father of Azarel, David\'s tribal chief over Dan (<a onClick="return mV(\'1Ch\',27,22);">1Ch 27:22</a>).<P>(6) Father of Azariah, one of the captains who supported Jehoiada in overthrowing Queen Athaliah (<a onClick="return mV(\'2Ch\',23,1);">2Ch 23:1</a>).``149';
isbe[4987]='Jerubbaal`jer-u-ba\'-al, je-rub\'-a-al (yerubba\'al, "let Baal contend"): The name given to Gideon by his father, Joash, and the people in recognition of his destruction of the altar of Baal at Ophrah (<a onClick="return mV(\'Jdg\',6,32);">Jud 6:32</a>). For this name the form "Jerubbesheth" (<a onClick="return mV(\'2Sa\',1,21);">2Sa 1:21</a>) was substituted after the analogy of "Ishbosheth" and "Mephibosheth," in which bosheth, the Hebrew word for "shame," displaced the word ba\'al, no doubt because the name resembled one given in honor of Baal.`<a href="./study/isbe/search.html?string=GIDEON">GIDEON</a>`1';
isbe[4988]='Jerubbesheth`jer-ub-be\'-sheth, je-rub\'-e-sheth (yerubbesheth, see <a href="study/isbe/search.html?string=JERUBBAAL">JERUBBAAL</A>, for meaning): It is found once (<a onClick="return mV(\'2Sa\',11,21);">2Sa 11:21</a>) for <a href="study/isbe/search.html?string=JERUBBAAL">JERUBBAAL</A>.<P>The word bosheth, "shameful thing," was substituted by later editors of the text for ba\'al, "lord," in the text of <a onClick="return mV(\'Jer\',3,24);">Jer 3:24</a>; <a onClick="return mV(\'Hsa\',9,10);">Ho 9:10</a>; in <a onClick="return mV(\'2Sa\',2,8);">2Sa 2:8</a>, etc., we find Ish-bosheth = Eshbaal (Ishbaal) in <a onClick="return mV(\'1Ch\',8,33);">1Ch 8:33</a>; <a onClick="return mV(\'1Ch\',9,39);">9:39</a>. The reason for this was reluctant to pronounce the word Ba\'al, which had by their time been associated with Canaanitic forms of worship. In <a onClick="return mV(\'2Sa\',11,21);">2Sa 11:21</a> Septuagint, Lucian, has "Jeroboal," which Septuagint, Codex Vaticanus, has corrupted to "Jeroboam." Compare <a href="study/isbe/search.html?string=MERIB-BAAL">MERIB-BAAL</a>; <a href="study/isbe/search.html?string=MEPHIBOSHETH">MEPHIBOSHETH</a>; and see Ginsburg, New Massoretico-Critical Text of the Hebrew Bible, Intro, 400ff. For a New Testament case compare <a onClick="return mV(\'Rom\',11,4);">Ro 11:4</a> and see Sanday and Headlam at the place.`<a href="./study/isbe/search.html?string=JERUBBAAL">JERUBBAAL</a>`149';
isbe[4989]='Jeruel`je-roo\'-el, jer\'-oo-el (yeru\'el, "founded by El"): Jahaziel prophesied that King Jehoshaphat should meet the hordes of Moabites and Ammonites, after they had come up by the "ascent of Ziz," "at the end of the valley (i.e. wady), before the wilderness of Jeruel" (<a onClick="return mV(\'2Ch\',20,16);">2Ch 20:16</a>). The particular part of the wilderness intended, is unknown. Cheyne (Encyclopedia Biblica) thinks this may be an error for the Jezreel of Judah, mentioned in <a onClick="return mV(\'Jos\',15,56);">Jos 15:56</a>, etc.`<a href="./study/isbe/search.html?string=JEZREEL">JEZREEL</a>`1';
isbe[4990]='Jerusalem, 1`je-roo\'-sa-lem:<P><b>I. THE NAME</b><P class="in15">1. In Cuneiform<P class="in15">2. In Hebrew<P class="in15">3. In Greek and Latin<P class="in15">4. The Meaning of Jerusalem<P class="in15">5. Other Names<P><b>II. GEOLOGY, CLIMATE AND SPRINGS</b><P class="in15">1. Geology<P class="in15">2. Climate and Rainfall<P class="in15">3. The Natural Springs<P><b>III. THE NATURAL SITE</b><P class="in15">1. The Mountains Around<P class="in15">2. The Valleys<P class="in15">3. The Hills<P><b>IV. GENERAL TOPOGRAPHY OF JERUSALEM</b><P class="in15">1. Description of Josephus<P class="in15">2. Summary of the Names of the Five Hills<P class="in15">3. The Akra<P class="in15">4. The Lower City<P class="in15">5. City of David and Zion<P><b>V. EXCAVATIONS AND ANTIQUITIES</b><P class="in15">1. Robinson<P class="in15">2. Wilson, and the Palestine Exploration Fund (1865)<P class="in15">3. Warren and Conder<P class="in15">4. Maudslay<P class="in15">5. Schick<P class="in15">6. Clermont-Ganneau<P class="in15">7. Bliss and Dickie<P class="in15">8. Jerusalem Archaeological Societies<P><b>VI. THE CITY\'S WALLS AND GATES</b><P class="in15">1. The Existing Walls<P class="in15">2. Wilson\'s Theory<P class="in15">3. The Existing Gates<P class="in15">4. Buried Remains of Earlier Walls<P class="in15">5. The Great Dam of the Tyropoeon<P class="in15">6. Ruins of Ancient Gates<P class="in15">7. Josephus\' Description of the Walls<P class="in15">8. First Wall<P class="in15">9. Second Wall<P class="in15">10. Third Wall<P class="in15">11. Date of Second Wall<P class="in15">12. Nehemiah\'s Account of the Walls<P class="in15">13. Valley Gate<P class="in15">14. Dung Gate<P class="in15">15. Fountain Gate<P class="in15">16. Water Gate<P class="in15">17. Horse Gate<P class="in15">18. Sheep Gate<P class="in15">19. Fish Gate<P class="in15">20. The "Old Gate"<P class="in15">21. Gate of Ephraim<P class="in15">22. Tower of the Furnaces<P class="in15">23. The Gate of Benjamin<P class="in15">24. Upper Gate of the Temple<P class="in15">25. The Earlier Walls<P><b>VII. ANTIQUARIAN REMAINS CONNECTED WITH THE WATER SUPPLY</b><P class="in15">1. Gihon: The Natural Spring<P class="in15">2. The Aqueduct of the Canaanites<P class="in15">3. Warren\'s Shaft<P class="in15">4. Hezekiah\'s "Siloam" Aqueduct<P class="in15">5. Other Aqueducts at Gihon<P class="in15">6. Bir Eyyub<P class="in15">7. Varieties of Cisterns<P class="in15">8. Birket Israel<P class="in15">9. Pool of Bethesda<P class="in15">10. The Twin Pools<P class="in15">11. Birket Chammam el Batrak<P class="in15">12. Birket Mamilla<P class="in15">13. Birket es Sultan<P class="in15">14. "Solomon\'s Pools"<P class="in15">15. Low-Level Aqueduct<P class="in15">16. High-Level Aqueduct<P class="in15">17. Dates of Construction of these Aqueducts<P><b>VIII. TOMBS, ANTIQUARIAN REMAINS AND ECCLESIASTICAL SITES</b><P class="in15">1. "The Tombs of the Kings"<P class="in15">2. "Herod\'s Tomb"<P class="in15">3. "Absalom\'s Tomb"<P class="in15">4. The "Egyptian Tomb"<P class="in15">5. The "Garden Tomb"<P class="in15">6. Tomb of "Simon the Just"<P class="in15">7. Other Antiquities<P class="in15">8. Ecclesiastical Sites<P><b>IX. HISTORY</b><P class="in15">1. Tell el-Amarna Correspondence<P class="in15">2. Joshua\'s Conquest<P class="in15">3. Site of the Jebusite City<P class="in15">4. David<P class="in15">5. Expansion of the City<P class="in15">6. Solomon<P class="in15">7. Solomon\'s City Wall<P class="in15">8. The Disruption (933 BC)<P class="in15">9. Invasion of Shishak (928 BC)<P class="in15">10. City Plundered by Arabs<P class="in15">11. Hazael King of Syria Bought Off (797 BC)<P class="in15">12. Capture of the City by Jehoash of Israel<P class="in15">13. Uzziah\'s Refortification (779-740 BC)<P class="in15">14. Ahaz Allies with Assyria (736-728 BC)<P class="in15">15. Hezekiah\'s Great Works<P class="in15">16. Hezekiah\'s Religious Reforms<P class="in15">17. Manasseh\'s Alliance with Assyria<P class="in15">18. His Repair of the Walls<P class="in15">19. Josiah and Religious Reforms (640-609 BC)<P class="in15">20. Jeremiah Prophesies the Approaching Doom<P class="in15">21. Nebuchadnezzar Twice Takes Jerusalem (586 BC)<P class="in15">22. Cyrus and the First Return (538 BC)<P class="in15">23. Nehemiah Rebuilds the Walls<P class="in15">24. Bagohi Governor<P class="in15">25. Alexander the Great<P class="in15">26. The Ptolemaic Rule<P class="in15">27. Antiochus the Great<P class="in15">28. Hellenization of the City under Antiochus Epiphanes<P class="in15">29. Capture of the City (170 BC)<P class="in15">30. Capture of 168 BC<P class="in15">31. Attempted Suppression of Judaism<P class="in15">32. The Maccabean Rebellion<P class="in15">33. The Dedication of the Temple (165 BC)<P class="in15">34. Defeat of Judas and Capture of the City<P class="in15">35. Judas\' Death (161 BC)<P class="in15">36. Jonathan\'s Restorations<P class="in15">37. Surrender of City to Antiochus Sidetes (134 BC)<P class="in15">38. Hasmonean Buildings<P class="in15">39. Rome\'s Intervention<P class="in15">40. Pompey Takes the City by Storm<P class="in15">41. Julius Caesar Appoints Antipater Procurator (47 BC)<P class="in15">42. Parthian Invasion<P class="in15">43. Reign of Herod the Great (37-4 BC)<P class="in15">44. Herod\'s Great Buildings<P class="in15">45. Herod Archelaus (4 BC-6 AD)<P class="in15">46. Pontius Pilate<P class="in15">47. King Agrippa<P class="in15">48. Rising against Florus and Defeat of Gallus<P class="in15">49. The City Besieged by Titus (70 AD)<P class="in15">50. Party Divisions within the Besieged Walls<P class="in15">51. Capture and Utter Destruction of the City<P class="in15">52. Rebellion of Bar-Cochba<P class="in15">53. Hadrian Builds Ella Capitolina<P class="in15">54. Constantine Builds the Church of the Anastasis<P class="in15">55. The Empress Eudoxia Rebuilds the Walls<P class="in15">56. Justinian<P class="in15">57. Chosroes II Captures the City<P class="in15">58. Heracleus Enters It in Triumph<P class="in15">59. Clemency of Omar<P class="in15">60. The Seljuk Turks and Their Cruelties<P class="in15">61. Crusaders Capture the City in 1099<P class="in15">62. The Kharizimians<P class="in15">63. Ottoman Turks Obtain the City (1517 AD)<P><b>X. MODERN JERUSALEM</b><P class="in15">1. Jews and "Zionism"<P class="in15">2. Christian Buildings and Institutions<P><b>LITERATURE</b><hr /> I. The Name.<P>1. In Cuneiform:<P>The earliest mention of Jerusalem is in the Tell el-Amarna Letters (1450 BC), where it appears in the form Uru-sa-lim; allied with this we have Ur-sa-li-immu on the Assyrian monuments of the 8th century BC.<P>The most ancient Biblical form is yerushalem, shortened in <a onClick="return mV(\'Psa\',76,2);">Ps 76:2</a> (compare <a onClick="return mV(\'Gen\',14,18);">Ge 14:18</a>) to Salem, but in Massoretic Text we have it vocalized yerushalaim. In <a onClick="return mV(\'Jer\',26,18);">Jer 26:18</a>; <a onClick="return mV(\'Est\',2,6);">Es 2:6</a>; <a onClick="return mV(\'2Ch\',25,1);">2Ch 25:1</a>; <a onClick="return mV(\'2Ch\',32,9);">32:9</a> we have yerushalayim, a form which occurs on the Jewish coins of the Revolt and also in Jewish literature; it is commonly used by modern Talmudic Jews.<P>2. In Hebrew:<P>The form Hebrew with the ending -aim or -ayim is interpreted by some as being a dual, referring to the upper and lower Jerusalem, but such forms occur in other names as implying special solemnity; such a pronunciation is both local and late.<P>3. In Greek and Latin:<P>In the Septuagint we get (Ierousalem), constantly reflecting the earliest and the common Hebrew pronunciation, the initial letter being probably unaspirated; soon, however, we meet with (Hierousalem)—with the aspirate—the common form in Josephus, and (Hierosoluma) in Maccabees (Books II through IV), and in Strabo. This last form has been carried over into the Latin writers, Cicero, Pliny, Tacitus and Suetonius. It was replaced in official use for some centuries by Hadrian\'s Aelia Capitolina, which occurs as late as Jerome, but it again comes into common use in the documents of the Crusades, while Solyma occurs at various periods as a poetic abbreviation.<P>In the New Testament we have (Hierousalem), particularly in the writings of Luke and Paul, and (ta Hierosoluma) elsewhere. The King James Version of 1611 has Ierosalem in the Old Testament and Hierusalem in the New Testament. The form Jerusalem first occurs in French writings of the 12th century.<P>4. The Meaning of Jerusalem:<P>With regard to the meaning of the original name there is no concurrence of opinion. The oldest known form, Uru-sa-lim, has been considered by many to mean either the "City of Peace" or the "City of (the god) Salem," but other interpreters, considering the name as of Hebrew origin, interpret it as the "possession of peace" or "foundation of peace." It is one of the ironies of history that a city which in all its long history has seen so little peace and for whose possession such rivers of blood have been shed should have such a possible meaning for its name.<P>5. Other Names:<P>Other names for the city occur. For the name Jebus see <a href="study/isbe/search.html?string=JESUS">JESUS</a>. In <a onClick="return mV(\'Isa\',29,1);">Isa 29:1</a>, occurs the name \'ari\'el probably "the hearth of God," and in <a onClick="return mV(\'Isa\',1,26);">1:26</A> the "city of righteousness." In <a onClick="return mV(\'Psa\',72,16);">Ps 72:16</a>; <a onClick="return mV(\'Jer\',32,24);">Jer 32:24</a>f; <a onClick="return mV(\'Eze\',7,23);">Eze 7:23</a>, we have the term ha\'ir, "the city" in contrast to "the land." A whole group of names is connected with the idea of the sanctity of the site; \'ir ha-qodhesh, the "holy city" occurs in <a onClick="return mV(\'Isa\',48,2);">Isa 48:2</a>; <a onClick="return mV(\'Isa\',52,1);">52:1</a>; <a onClick="return mV(\'Neh\',11,1);">Ne 11:1</a>, and yerushalayim ha-qedhoshah, "Jerusalem the holy" is inscribed on Simon\'s coins. In <a onClick="return mV(\'Mat\',4,5);">Mt 4:5</a>; <a onClick="return mV(\'Mat\',27,53);">27:53</a> we have he hagia polis, "the holy city," and in Philo, Hieropolis, with the same meaning.<P>In Arabic the common name is Beit el Maqdis, "the holy house," or el Muqaddas, "the holy," or the common name, used by the Moslems everywhere today, el Quds, a shortened form of el Quds esh Sheref, "the noble sanctuary."<P>Non-Moslems usually use the Arabic form Yerusalem.<P>II. Geology, Climate, and Springs.<P>1. Geology:<P>The geology of the site and environs of Jerusalem is comparatively simple, when studied in connection with that of the land of Palestine as a whole (see <a href="study/isbe/search.html?string=GEOLOGY+OF+PALESTINE">GEOLOGY OF PALESTINE</a>). The outstanding feature is that the rocks consist entirely of various forms of limestone, with strata containing flints; there are no primary rocks, no sandstone (such as comes to the surface on the east of the Jordan) and no volcanic rocks. The lime stone formations are in regular strata dipping toward the southeast, with an angle of about 10 degrees.<P>On the high hills overlooking Jerusalem on the east, southeast and southwest there still remain strata of considerable thickness of those chalky limestones of the post-Tertiary period which crown so many hilltops of Palestine, and once covered the whole land. On the "Mount of Olives," for example, occurs a layer of conglomerate limestone known as Nari, or "firestone," and another thicker deposit, known as Ka\'kuli, of which two distinct strata can be distinguished. In these layers, especially the latter, occur pockets containing marl or haur, and in both there are bands of flint.<P>Over the actual city\'s site all this has been denuded long ages ago. Here we have three layers of limestone of varying density very clearly distinguished by all the native builders and masons:<P>(1) Mizzeh helu, literally, "sweet mizzeh," a hard, reddish-grey layer capable of polish, and reaching in places to a depth of 70 ft. or more. The "holy rock" in the temple-area belongs to this layer, and much of the ancient building stone was of this nature.<P>(2) Below this is the Melekeh or "royal" layer, which, though not very thick—35 ft. or so—has been of great importance in the history of the city. This rock is peculiar in that when first exposed to the air it is often so soft that it can be cut with a knife, but under the influence of the atmosphere it hardens to make a stone of considerable durability, useful for ordinary buildings. The great importance of this layer, however, lies in the fact that in it have been excavated the hundreds of caverns, cisterns, tombs and aqueducts which honeycomb the city\'s site.<P>(3) Under the Melekeh is a Cenomanian limestone of great durability, known as Mizzeh Yehudeh, or "Jewish mizzeh." It is a highly valued building stone, though hard to work. Geologically it is distinguished from Mizzeh helu by its containing ammonites. Characteristically, it is a yellowish-grey stone, sometimes slightly reddish. A variety of a distinctly reddish appearance, known as Mizzeh ahmar, or "red mizzeh," makes a very ornamental stone for columns, tombstones, etc.; it takes a high polish and is sometimes locally known as "marble."<P>This deep layer, which underlies the whole city, comes to the surface in the Kidron valley, and its impermeability is probably the explanation of the appearance there of the one true spring, the "Virgin\'s Fount." The water over the site and environs of Jerusalem percolates with ease the upper layer, but is conducted to the surface by this hard layer; the comparatively superficial source of the water of this spring accounts for the poorness of its quality.<P>2. Climate and Rainfall:<P>The broad features of the climate of Jerusalem have probably remained the same throughout history, although there is plenty of evidence that there have been cycles of greater and lesser abundance of rain. The almost countless cisterns belonging to all ages upon the site and the long and complicated conduits for bringing water from a distance, testify that over the greater part of history the rainfall must have been, as at present, only seasonal.<P>As a whole, the climate of Jerusalem may be considered healthy. The common diseases should be largely preventable—under an enlightened government; even the malaria which is so prevalent is to a large extent an importation from the low-lying country, and could be stopped at once, were efficient means taken for destroying the carriers of infection, the abundant Anopheles mosquitoes. On account of its altitude and its exposed position, almost upon the watershed, wind, rain and cold are all more excessive than in the maritime plains or the Jordan valley. Although the winter\'s cold is severely felt, on account of its coinciding with the days of heaviest rainfall (compare <a onClick="return mV(\'Ezr\',10,9);">Ezr 10:9</a>), and also because of the dwellings and clothes of the inhabitants being suited for enduring heat more than cold, the actual lowest cold recorded is only 25 degrees F., and frost occurs only on perhaps a dozen nights in an average year. During the rainless summer months the mean temperature rises steadily until August, when it reaches 73,1 degrees F., but the days of greatest heat, with temperature over 100 degrees F. in the shade at times, occur commonly in September. In midsummer the cool northwest breezes, which generally blow during the afternoons and early night, do much to make life healthy. The most unpleasant days occur in May and from the middle of September until the end of October, when the dry southeast winds—the sirocco—blow hot and stifling from over the deserts, carrying with them at times fine dust sufficient in quantity to produce a marked haze in the atmosphere. At such times all vegetation droops, and most human beings, especially residents not brought up under such conditions, suffer more or less from depression and physical discomfort; malarial, "sandfly," and other fevers are apt to be peculiarly prevalent. "At that time shall it be said...to Jerusalem, A hot wind from the bare heights in the wilderness toward the daughter of my people, not to winnow, nor to cleanse" (<a onClick="return mV(\'Jer\',4,11);">Jer 4:11</a>).<P>During the late summer—except at spells of sirocco—heavy "dews" occur at night, and at the end of September or beginning of October the "former" rains fall—not uncommonly in tropical downpours accompanied by thunder. After this there is frequently a dry spell of several weeks, and then the winter\'s rain falls in December, January and February. In some seasons an abundant rainfall in March gives peculiar satisfaction to the inhabitants by filling up the cisterns late in the season and by producing an abundant harvest. The average rainfall is about 26 inches, the maximum recorded in the city being 42,95 inches in the season 1877-78, and the minimum being 12,5 inches in 1869-70. An abundant rainfall is not only important for storage, for replenishment of the springs and for the crops, but as the city\'s sewage largely accumulates in the very primitive drains all through the dry season, it requires a considerable force of water to remove it. Snow falls heavily in some seasons, causing considerable destruction to the badly built roofs and to the trees; in the winter of 1910-11 a fall of 9 inches occurred.<P>3. The Natural Springs:<P>There is only one actual spring in the Jerusalem area, and even to this some authorities would deny the name of true spring on account of the comparatively shallow source of its origin; this is the intermittent spring known today as \'Ain Umm edition deraj (literally, "spring of the mother of the steps"), called by the native Christians \'Ain Sitti Miriam (the "spring of the Lady Mary"), and by Europeans commonly called "The Virgin\'s Fount." All the archaeological evidence points to this as the original source of attraction of earliest occupants of the site; in the Old Testament this spring is known as <a href="study/isbe/search.html?string=GIHON+(2)">GIHON</a> (which see). The water arises in the actual bottom, though apparent west side, of the Kidron valley some 300 yards due south of the south wall of the Charam. The approach to the spring is down two flights of steps, an upper of 16 leading to a small level platform, covered by a modern arch, and a lower, narrower flight of 14 steps, which ends at the mouth of a small cave. The water has its actual source in a long cleft (perhaps 16 ft. long) running east and west in the rocky bottom of the Kidron valley, now many feet below the present surface. The western or higher end of the cleft is at the very entrance of the cave, but most of the water gushes forth from the lower and wider part which lies underneath the steps. When the water is scanty, the women of Siloam creep down into the cavity under the steps and fill their water-skins there; at such times no water at all finds its way into the cave. At the far end of the cave is the opening of that system of ancient tunnel-aqueducts which is described in VI, below. This spring is "intermittent," the water rising rapidly and gushing forth with considerable force, several times in the 24 hours after the rainy season, and only once or twice in the dry. This "intermittent" condition of springs is not uncommon in Palestine, and is explained by the accumulation of the underground water in certain cavities or cracks in the rock, which together make up a reservoir which empties itself by siphon action. Where the accumulated water reaches the bend of the siphon, the overflow commences and continues to run until the reservoir is emptied. Such a phenomenon is naturally attributed to supernatural agency by the ignorant—in this case, among the modern fellahin, to a dragon—and natives, specially Jews, visit the source, even today, at times of its overflow, for healing. Whether this intermittent condition of the fountain is very ancient it is impossible to say, but, as Jerome (Comm. in Esa, 86) speaks of it, it was probably present in New Testament times, and if so we have a strong argument for finding here the "Pool of Bethesda."<P>See <a href="study/isbe/search.html?string=BETHESDA">BETHESDA</a>.<P>In ancient times all the water flowed down the open, rocky valley, but at an early period a wall was constructed to bank up the water and convert the source into a pool. Without such an arrangement no water could find its way into the cave and the tunnels. The tunnels, described below (VI), were constructed for the purpose<P>(1) of reaching the water supply from within the city walls, and<P>(2) of preventing the enemies of the Jews from getting at the water (<a onClick="return mV(\'2Ch\',32,4);">2Ch 32:4</a>).<P>The water of this source, though used for all purposes by the people of Siloam, is brackish to the taste, and contains a considerable percentage of sewage; it is quite unfit for drinking. This condition is doubtless due to the wide distribution of sewage, both intentionally (for irrigation of the gardens) and unintentionally (through leaking sewers, etc.), over the soil overlying the rocks from which the water flows. In earlier times the water was certainly purer, and it is probable, too, that the fountain was more copious, as now hundreds of cisterns imprison the waters which once found their way through the soil to the deep sources of the spring.<P>The waters of the Virgin\'s Fount find their way through the Siloam tunnel and out at \'Ain Silwan (the "spring" of Siloam), into the Pool of Siloam, and from this source descend into the Kidron valley to water the numerous vegetable gardens belonging to the village of Siloam (see <a href="study/isbe/search.html?string=Siloam;+Siloah;+Shelah;+Shiloah">SILOAM</a>).<P>The second source of water in Jerusalem is the deep well known as Bir Eyyub, "Job\'s well," which is situated a little below the point where the Kidron valley and Hinnom meet. In all probability it derives its modern name from a legend in the Koran (Sura 38 5,40-41) which narrates that God commanded Job to stamp with his foot, whereupon a spring miraculously burst up. The well, which had been quite lost sight of, was rediscovered by the Crusaders in 1184 AD, and was by them cleaned out. It is 125 ft. deep. The supply of water in this well is practically inexhaustible, although the quality is no better than that of the "Virgin\'s Fount"; after several days of heavy rain the water overflows underground and bursts out a few yards lower down the valley as a little stream. It continues to run for a few days after a heavy fall of rain is over, and this "flowing Kidron" is a great source of attraction to the native residents of Jerusalem, who pour forth from the city to enjoy the rare sight of running water. Somewhere in the neighborhood of Bir Eyyub must have lain \'En-Rogel, but if that were once an actual spring, its source is now buried under the great mass of rubbish accumulated here (see <a href="study/isbe/search.html?string=EN-ROGEL">EN-ROGEL</A>).<P>Nearly 600 yards south of Bir Eyyub is a small gravelly basin where, when the Bir Eyyub overflows, a small spring called \'Ain el Lozeh (the "spring of the almond") bursts forth. It is not a true spring, but is due to some of the water of Job\'s well which finds its way along an ancient rock-cut aqueduct on the west side of the Wady en Nar, bursting up here.<P>The only other possible site of a spring in the Jerusalem area is the Chammam esh Shefa, "the bath of healing." This is an underground rock-basin in the Tyropeon valley, within the city walls, in which water collects by percolation through the debris of the city. Though once a reservoir with probably rock-cut channels conducting water to it, it is now a deep well with arches erected over it at various periods, as the rubbish of the city gradually accumulated through the centuries. There is no evidence whatever of there being any natural fountain, and the water is, in the dry season, practically pure sewage, though used in a neighboring Turkish bath.<P>G.A. Smith thinks that the <a href="study/isbe/search.html?string=JACKAL\'S+WELL">JACKAL\'S WELL</a> (which see) mentioned by Nehemiah (<a onClick="return mV(\'Neh\',2,13);">2:13</A>), which must have been situated in the Valley of Hinnom, may possibly have been a temporary spring arising there for a few years in consequence of an earthquake, but it is extremely likely that any well sunk then would tap water flowing along the bed of the valley. There is no such "spring" or "well" there today.<P>III. The Natural Site.<P>Modern Jerusalem occupies a situation defined geographically as 31 degrees 46 minutes 45 seconds North latitude., by 35 degrees 13 minutes 25 seconds East longitude. It lies in the midst of a bare and rocky plateau, the environs being one of the most stony and least fruitful districts in the habitable parts of Palestine, with shallow, gray or reddish soil and many outcrops of bare limestone. Like all the hill slopes with a southeasterly aspect, it is so thoroughly exposed to the full blaze of the summer sun that in its natural condition the site would be more or less barren. Today, however, as a result of diligent cultivation and frequent watering, a considerable growth of trees and shrubs has been produced in the rapidly extending suburbs. The only fruit tree which reaches perfection around Jerusalem is the olive.<P>1. The Mountains Around:<P>The site of Jerusalem is shut in by a rough triangle of higher mountain ridges: to the west runs the main ridge, or water parting, of Judea, which here makes a sweep to the westward. From this ridge a spur runs southeast and east, culminating due east of the city in the <a href="study/isbe/search.html?string=OLIVES,+MOUNT+OF">MOUNT OF OLIVES</a> (which see), nearly 2,700 ft. above sea-level and about 300 ft. above the mean level of the ancient city. Another spur, known as Jebel Deir abu Tor, 2,550 ft. high, runs east from the plateau of el Buqei\'a and lies southwest of the city; it is the traditional "Hill of Evil Counsel." The city site is thus dominated on all sides by these higher ranges—"the mountains (that) are round about Jerus" (<a onClick="return mV(\'Psa\',125,2);">Ps 125:2</a>)—so that while on the one hand the ancient city was hidden, at any considerable distance, from any direction except the southeast, it is only through this open gap toward the desert and the mountains of Moab that any wide outlook is obtainable. This strange vision of wilderness and distant mountain wall—often of exquisite loveliness in the light of the setting sun—must all through the ages have been the most familiar and the most potent of scenic influences to the inhabitants of Jerusalem.<P>2. The Valleys:<P>Within the enfolding hills the city\'s proper site is demarked by two main valleys. That on the west and southwest commences in a hollow occupied by the Moslem cemetery around the pool Birket Mamilla. The valley runs due east toward the modern Jaffa Gate, and there bends south, being known in this upper part of its course as the Wady el Mes. In this southern course it is traversed by a great dam, along which the modern Bethlehem road runs, which converts a large area of the valley bed into a great pool, the Birket es Sultan. Below this the valley—under the name of Wady er Rabadi—bends southeast, then east, and finally southeast again, until near Bir Eyyub it joins the western valley to form the Wady en Nar, 670 ft. below its origin. This valley has been very generally identified as the Valley of Hinnom (see <a href="study/isbe/search.html?string=HINNOM,+VALLEY+OF">HINNOM, VALLEY OF</a>.)<P>The eastern valley takes a wider sweep. Commencing high up in the plateau to the north of the city, near the great water-parting, it descends as a wide and open valley in a southeasterly direction until, where it is crossed by the Great North Road, being here known as Wady el Joz (the "Valley of the Walnuts"), it turns more directly east. It gradually curves to the south, and as it runs east of the city walls, it receives the name of Wady Sitti Miriam (the "Valley of the Lady Mary"). Below the southeast corner of the temple-area, near the traditional "Tomb of Absalom," the valley rapidly deepens and takes a direction slightly to the west of south. It passes the "Virgin\'s Fount," and a quarter of a mile lower it is joined by el Wad from the north, and a little farther on by the Wady er Rababi from the west. South of Bir Eyyub, the valley formed by their union is continued under the name of Wady en Nar to the Dead Sea. This western valley is that commonly known as the Brook Kidron, or, more shortly, the "Brook" (hachal), or ravine (see <a href="study/isbe/search.html?string=KIDRON">KIDRON</A>), but named from the 5th century onward by Christians the Valley of Jehoshaphat (see <a href="study/isbe/search.html?string=JEHOSHAPHAT,+VALLEY+OF">JEHOSHAPHAT, VALLEY OF</a>). The rocky tongue of land enclosed between these deep ravines, an area, roughly speaking, a little over one mile long by half a mile wide, is further subdivided into a number of distinct hills by some shallower valleys. The most prominent of these—indeed the only one noticeable to the superficial observer today—is the great central valley known to modern times by the single name el Wad, "the valley." It commences in a slight depression of the ground a little north of the modern "Damascus Gate," and after entering the city at this gate it rapidly deepens—a fact largely disguised today by the great accumulation of rubbish in its course. It traverses the city with the Charam to its east, and the Christian and Moslem quarters on rapidly rising ground to its west. Its course is observed near the Babylonian es Silseleh, where it is crossed by an ancient causeway, but farther south the valley reappears, having the walls of the Charam (near the "wailing place" and "Robinson\'s arch") on the east, and steep cliffs crossed by houses of the Jewish quarter on the west. It leaves the city at the "Dung Gate," and passes with an open curve to the east, until it reaches the Pool of Siloam, below\' which it merges in the Wady Sitti Miriam. This is the course of the main valley, but a branch of great importance in the ancient topography of the city starts some 50 yards to the west of the modern Jaffa Gate and runs down the Suwaikat Allun generally known to travelers as "David\'s Street," and thus easterly, along the Tarik bab es Silseleh, until it merges in the main valley. The main valley is usually considered to be the Tyropeon, or "Cheesemongers\' Valley" of Josephus, but some writers have attempted to confine the name especially to this western arm of it.<P>Another interior valley, which is known rather by the rock contours, than by surface observations, being largely filled up today, cuts diagonally across the northeast corner of the modern city. It has no modern name, though it is sometimes called "St. Anne\'s Valley." It arises in the plateau near "Herod\'s Gate," known as es Sahra, and entering the city about 100 yards to the east of that gate, runs south-southeast., and leaves the city between the northeast angle of the Charam and the Golden Gate, joining the Kidron valley farther southeast. The Birket Israel runs across the width of this valley, which had far more influence in determining the ancient topography of the city than has been popularly recognized. There is an artificially made valley between the Charam and the buildings to its north, and there is thought by many to be a valley between the southeast hill, commonly called "Ophel" and the temple-area. Such, then, are the valleys, great and small, by which the historic hills on which the city stood are defined. All of them, particularly in their southern parts, were considerably deeper in ancient times, and in places the accumulated debris is 80 ft. or more. All of them were originally torrent beds, dry except immediately after heavy rain. The only perennial outflow of water is the scanty and intermittent stream which overflows from the Pool of Siloam, and is used to irrigate the gardens in the Wady Sitti Miriam.<P>3. The Hills:<P>The east and west valleys isolate a roughly quadrilateral tongue of land running from northwest-west to south-southeast, and tilted so as to face southeast. This tongue is further subdivided by el Wad into two long ridges, which merge into each other in the plateau to the north. The western ridge has its actual origin considerably north of the modern wall, being part of the high ground lying between the modern Jaffa road to the west, and the commencement of the Kidron valley to the east. Within the city walls it rises as high as 2,581 ft. near the northwestern corner. It is divided by the west branch of the Tyropeon valley into two parts: a northern part—the northwestern hill—on which is situated today the Church of the Holy Sepulchre and the greater part of the "Christian quarter" of the city, and a southern hill—the southwestern—which is connected with the northwestern hill by but a narrow saddle—50 yards wide—near the Jaffa Gate. This hill sustains the citadel (the so-called "Tower of David"), the barracks and the Armenian quarter within the walls, and the Coenaculum and adjacent buildings outside the walls. This hill is from 2,500 to 2,350 ft. high along its summit, but drops rapidly on its southwestern, southern and southeastern sides. In its central part it falls much more gently toward the eastern hill across the now largely filled valley el Wad.<P>The eastern ridge may be reckoned as beginning at the rocky hill el-Edhemiyeh—popularly known as Gordon\'s Calvary—but the wide trench made here by quarrying somewhat obscures this fact. The ridge may for convenience be regarded as presenting three parts, the northeastern, central or central-eastern, and southeastern summits. The northeastern hill within the modern wall supports the Moslem quarter, and rises in places to a height of over 2,500 ft.; it narrows to a mere neck near the "Ecce Homo" arch, where it is joined to the barracks, on the site of the ancient Antonia. Under the present surface it is here separated from the temple summit by a deep rocky trench.<P>The central, or central-eastern, summit is that appearing as es Sakhra, the sacred temple rock, which <span class="noTag">is</span> 2,404 ft. high. This is the highest point from which the ground rapidly falls east, west, and south, but the natural contours of the adjacent ground are much obscured by the great substructures which have been made to sustain the temple platform.<P>The sloping, southeastern, hill, south of the temple area appears today, at any rate, to have a steady fall of from 2,350 ft. just south of the Charam southern wall to a little over 2,100 ft. near the Pool of Siloam. It is a narrow ridge running in a somewhat curved direction, with a summit near 200 ft. above the Kidron and 100 ft. above the bed of the Tyropeon. In length it is not more than 600 yards, in width, at its widest, only 150 yards, but its chief feature, its natural strength, is today greatly obscured on account of the rubbish which slopes down its sides and largely fills up its surrounding valleys. In earlier times, at least three of its sides were protected by deep valleys, and probably on quite two-thirds of its circumference its summit was surrounded by natural rocky scarps. According to Professor Guthe, this hill is divided from the higher ground to the north by a depression 12 ft. deep and 30-50 yards wide, but this has not been confirmed by other observers. The city covering so hilly a site as this must ever have consisted, as it does today, of houses terraced on steep slopes\' with stairways for streets.``117';
isbe[4991]='Jerusalem, 2`IV. General Topography of Jerusalem.<P>From the foregoing description of the "natural site," it will be seen that we have to deal with 5 natural subdivisions or hills, two on the western and three on the eastern ridges.<P>1. Description of Josephus:<P>In discussing the topography it is useful to commence with the description of Josephus, wherein he gives to these 5 areas the names common in his day (BJ, V, iv, 1,2). He says: "The city was built upon two hills which are opposite to one another and have a valley to divide them asunder...Now the Valley of the Cheesemongers, as it was called, and was that which distinguished the hill of the upper city from that of the lower, extended as far as Siloam" (ibid., V, iv, 1). Here we get the first prominent physical feature, the bisection of the city-site into two main hills. Farther on, however, in the same passage—one, it must be admitted, of some obscurity—Josephus distinguishes 5 distinct regions:<P>(1) The Upper City or Upper Market Place:<P>(The hill) "which sustains the upper city is much higher and in length more direct. Accordingly, it was called the citadel (phrourion) of King David...but it is by us called the Upper Market Place." This is without dispute the southwestern hill.<P>(2) Akra and Lower City:<P>"The other hill, which was called Akra, and sustains the lower city, was double-curved" (amphikurtos). The description can apply only to the semicircular shape of the southeastern hill, as viewed from the "upper city." These names, "Akra" and "Lower City," are, with reservations, therefore, to be applied to the southeastern hill.<P>(3) The Temple Hill:<P>Josephus\' description here is curious, on account of its indefiniteness, but there can be no question as to which hill he intends. He writes: "Over against this is a third hill, but naturally lower than the Akra and parted formerly from the other by a fiat valley. However, in those times when the Hasmoneans reigned, they did away with this valley, wishing to connect the city with the temple; and cutting down the summit of the Akra, they made it lower, so that the temple might be visible over it." Comparison with other passages shows that this "third hill" is the central-eastern—the "Temple Hill."<P>(4) Bezetha:<P>"It was Agrippa who encompassed the parts added to the old city with this wall (i.e. the third wall) which had been all naked before; for as the city grew more populous, it gradually crept beyond its old limits, and those parts of it that stood northward of the Temple, and joined that hill to the city, made it considerably larger, and occasioned that hill which is in number the fourth, and is called \'Bezetha,\' to be inhabited also. It lies over against the tower Antonia, but is divided from it by a deep valley, which was dug on purpose....This new-built part of the city was called \'Bezetha\' in our language, which, if interpreted in the Greek language, may be called the \'New City.\' " This is clearly the northeastern hill.<P>(5) The Northern Quarter of the City:<P>From the account of the walls given by Josephus, it is evident that the northern part of his "first wall" ran along the northern edge of the southwestern hill; the second wall enclosed the inhabited part of the northwestern hill. Thus Josephus writes: "The second wall took its beginning from the gate which they called Gennath in the first wall, and enclosing, the northern quarter only reached to the Antonia." This area is not described as a separate hill, as the inhabited area, except on the south, was defined by no natural valleys, and besides covering the northwestern hill, must have extended into the Tyropeon valley.<P>2. Summary of the Names of the Five Hills:<P>Here then we have Josephus\' names for these five districts:<P>(1) Southwestern Hill:<P>Southwestern Hill, "Upper City" and "Upper Market Place"; also the Summary Phrourion, or "fortress of David." From the 4th century AD, this hill has also been known as "Zion," a
