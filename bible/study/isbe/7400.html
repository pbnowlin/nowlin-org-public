; 14:7; thaumazo, "wonder," Sirach 7:29, and aischunomai, "be ashamed," Baruch 4:15.<P>"Reverend" occurs in the Old Testament in <a onClick="return mV(\'Psa\',111,9);">Ps 111:9</a>, of the name of God (yare\'), and in the Apocrypha in 2Macc 15:12, "a man reverend (aidemon, "modest") in bearing," and in the New Testament the Revised Version (British and American) has "reverent in demeanor" (hieroprepes) in <a onClick="return mV(\'Tts\',2,3);">Tit 2:3</a> and "reverend" in <a onClick="return mV(\'Phl\',4,8);">Php 4:8</a> margin (semnos).``61';
isbe[7415]='Revile`re-vil\'.`<a href="./study/isbe/search.html?string=CRIMES">CRIMES</a>; <a href="./study/isbe/search.html??string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[7416]='Revive; Reviving`re-viv\', reviv\'-ing: revive is the translation of chayah, "to live," "cause to live," used of restoration to life (<a onClick="return mV(\'Gen\',45,27);">Ge 45:27</a>; <a onClick="return mV(\'Jdg\',15,19);">Jud 15:19</a>, etc.); of rebuilding (<a onClick="return mV(\'Neh\',4,2);">Ne 4:2</a>); of restoration to well-being (<a onClick="return mV(\'Psa\',85,6);">Ps 85:6</a> (the Revised Version (British and American) "quicken"); <a onClick="return mV(\'Psa\',138,7);">Ps 138:7</a>; <a onClick="return mV(\'Isa\',57,15);">Isa 57:15</a>; <a onClick="return mV(\'Hsa\',6,2);">Ho 6:2</a>; <a onClick="return mV(\'Hsa\',14,7);">14:7</a>); of Yahweh\'s gracious work for His people (<a onClick="return mV(\'Hab\',3,2);">Hab 3:2</a>, "revive thy work in the midst of the years," etc.); "reviving" is the translation of michydh "preservation" or "means of life" (<a onClick="return mV(\'Ezr\',9,8,9);">Ezr 9:8,9</a>). "Revive" occurs in the New Testament as the translation of anazao, "to live again" (<a onClick="return mV(\'Rom\',7,9);">Ro 7:9</a>, <a onClick="return mV(\'Rom\',7,14);">14:9</a>, the King James Version "Christ both died, and rose, and revived," the Revised Version (British and American) (omitting "and rose") "Christ died and lived again" zao).<P>In 1Macc 13:7 the Revised Version (British and American) we have "And the spirit of the people revived," anazopureo, "to stir or kindle up as a fire," the same word as in <a onClick="return mV(\'2Ti\',1,6);">2Ti 1:6</a>, the Revised Version (British and American) "stir up the gift of God, which is in thee," margin "Greek: \'stir into flame.\'"<P>In view of the frequent modern use of "revive" and "revival," it is worthy of notice that it is to Timothy himself the exhortation is addressed. We too often merely pray for "revivals," forgetting that it is for us to "stir into flame" the gift of the Spirit which we have already received of God. It is ours from Him, but we let it lie dormant, as a slumbering ember merely.``185';
isbe[7417]='Reward`re-word\':In modern English (except when influenced by the Biblical forms) a "reward" is something given in recognition of a good act. In English Versions of the Bible, however, "reward" is used quite generally for anything given, and the term covers the recompense of evil (<a onClick="return mV(\'Psa\',91,8);">Ps 91:8</a>), wages (<a onClick="return mV(\'1Ti\',5,18);">1Ti 5:18</a> the King James Version), bribes (<a onClick="return mV(\'Mic\',7,3);">Mic 7:3</a>), and gifts (<a onClick="return mV(\'Jer\',40,5);">Jer 40:5</a> the King James Version). The Revised Version (British and American) has specialized the meaning in a number of cases (<a onClick="return mV(\'Psa\',94,2);">Ps 94:2</a>; <a onClick="return mV(\'Eze\',16,34);">Eze 16:34</a>; <a onClick="return mV(\'Jer\',40,5);">Jer 40:5</a>, etc.), but not systematically.``1';
isbe[7418]='Rezeph`re\'-zef (retseph;<P>1. Forms of the Name:<P>Codex Vaticanus Rhapheis; Rhaphes; Codex Alexandrinus ten Rhapheth (<a onClick="return mV(\'2Ki\',19,12);">2Ki 19:12</a>), B Q margin Rhapheth Codex Sinaiticus Q Rhafes; Codex Alexandrinus Rhapheis (<a onClick="return mV(\'Isa\',37,12);">Isa 37:12</a>); Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Roseph (<a onClick="return mV(\'2Ki\',19,12);">2Ki 19:12</a>), Reseph (<a onClick="return mV(\'Isa\',37,12);">Isa 37:12</a>)): One of the places referred to by Sennacherib\'s Rabshakeh when delivering that king\'s message to Hezekigh demanding the surrender of Jerusalem. The names which precede are Gozan and Haran; and "the children of Eden that were Telassar" follows.<P>2. Now Called Rucafa:<P>It is now represented by Rucafa, east of Tipsah and northeast of Hamath, and is regarded as the (Rhesapha) of Ptolemy (v.15). It was for some time under Assyrian dominion, and appears in a geographical list (2 R 53, 37a) preceded by Arrapba (Arrapachitis) and Halabbu (Halah), and followed by Tamnunu, uder the form of Rasappa (elsewhere Racapi).<P>3. Its Assyrian Governors:<P>From the Eponym Canons, Ninip-kibsi-ucur was, it appears, prefect in 839 BC, Uras-eres from 804 to 775 BC, Sin-sallimanni in 747, and Bel-emuranni in 737 BC. Judging from their names, all these were Assyrians, but a seemingly native governor, Abda\'u (or Abda\'i), possibly later than the foregoina, is mentioned in a list of officials (K. 9921). Yabutu was sanu (deputy-governor?) of Rezeph in 673 BC. Its mention in the Assyrian geographical lists implies that Rezeph was an important trade-center in Old Testament times.``136';
isbe[7419]='Rezia`re-zi\'-a.`<a href="./study/isbe/search.html?string=RIZIA">RIZIA</a>`1';
isbe[7420]='Rezin`re\'-zin (retsin; Rhaasson): The last of the kings of Syria who reigned in Damascus (<a onClick="return mV(\'2Ki\',15,37);">2Ki 15:37</a>; <a onClick="return mV(\'2Ki\',16,\'5-10\');">16:5-10</a>; <a onClick="return mV(\'Isa\',7,1);">Isa 7:1</a>; <a onClick="return mV(\'Isa\',8,\'4-7\');">8:4-7</a>). Alona with Pekah, the son of Remaliah, who reigned 20 years over Israel in Samaria, he joined in the Syro-Ephraimitic war aaainst Ahaz, the king of Judah. Together they laid siege to Jerusalem, but were unsuccessful in the effort to take it (<a onClick="return mV(\'2Ki\',16,5);">2Ki 16:5</a>; <a onClick="return mV(\'Isa\',7,1);">Isa 7:1</a>). It was to calm the fears, and to restore the fainting spirits of the men of Judah, that Isaiah was commissioned by the Lord to assure them that the schemes of "these two tails of smoking firebrands" (<a onClick="return mV(\'Isa\',7,4);">Isa 7:4</a>) were destined to miscarry. It was then, too, that the sign was aiven of the vigin who should conceive, and bear a son, and should call his name Immanuel. Rezin had to content himself on this campaign to the South with the capture of Elath from the men of Judah and its restoration to the men of Edom, from whom it had been taken and made a seaport by Solomon (<a onClick="return mV(\'2Ki\',16,6);">2Ki 16:6</a>, where it is agareed that "Syria" and "Syrians" should be read "Edom" and "Edomites," which in the Hebrew script are easy to be mistaken for one another, and are in fact often mistaken). Rezin, however, had a more formidable enemy to encounter on his return to Damascus. Ahaz, like kings of Judah before and after him, placed his reliance more on the arm of flesh than on the true King of his people, and appealed to Tiglath-pileser III, of Assyria, for help. Ahaz deliberately sacrificed the independence of his country in the terms of his offer of submission to the Assyrian: "I am thy servant and thy son" (<a onClick="return mV(\'2Ki\',16,7);">2Ki 16:7</a>). Tiglath-pileser had already carried his arms to the west and ravaged the northern border of Israel; and now he crossed the Euphrates and hastened to Damascus, slaying Rezin and carrying his people captive to Kir (<a onClick="return mV(\'2Ki\',16,9);">2Ki 16:9</a>). In the copious Annals of Tialath-pileser, Rezin figures with the designation Racunu(ni), but the tablet recording his death, found and read by Sir Henry Rawlinson, has been irrecoverably lost, and only the fact of its existence and loss remains (Schrader, COT, I, 252, 257). With the death of Rezin the kingdom of Damascus and Syria came to an end.<P>Rezin, Sons of: Mentioned among the Nethinim (<a onClick="return mV(\'Ezr\',2,48);">Ezr 2:48</a>), who returned to Jerusalem with Zerubbabel from captivity (compare <a onClick="return mV(\'Neh\',7,50);">Ne 7:50</a>).<P>LITERATURE.<P>Schrader, COT, as above; Driver, Authority, 99ff,``128';
isbe[7421]='Rezon`re\'-zon (rezon; Rhazon): Son of Eliadah, and a subject of Hadadezer, king of Zobah (<a onClick="return mV(\'1Ki\',11,23);">1Ki 11:23</a>). The name appears to be given as chezyon; Hazein (<a onClick="return mV(\'1Ki\',15,18);">1Ki 15:18</a>; see <a href="./study/isbe/search.html?string=HEZION">HEZION</a>), where he is the father of Tabrimmon, whose son Ben-hadad I is known through his leaaue with Asa, king of Judah. When David conquered Zobah, Rezon renounced his allegiance to Hadadezer and became powerful as an independent chief, capturing Damascus and setting up as king. Along with Hadad, the noted Edomite patriot, he became a thorn in the side of Solomon, the one making himself obnoxious in the South, the other in the north, of the kingdom of Israel, both being animated with a bitter hatred of the common foe. It is said of Rezon that he "reigned over Syria" (<a onClick="return mV(\'1Ki\',11,25);">1Ki 11:25</a>), and if the surmise adopted by many scholars is correct that he is the same as Hezion (<a onClick="return mV(\'1Ki\',15,18);">1Ki 15:18</a>), then he was really the founder of the dynasty of Syrian kings so well known in the history of this period of Israel; and the line would run: Rezon, Tabrimmon, Ben-hadad I, and Ben-hadad II.<P>LITERATURE.<P>Burney on <span class="noTag">1Ki 11:23 and 15:18</span> in Notes on Hebrew Text of Books of Kings; Winckler, Alttest. Untersuchunaen, 60ff.``128';
isbe[7422]='Rhegium`re-ji-um: This city [Rhegion] (<a onClick="return mV(\'Act\',28,13);">Ac 28:13</a>), the modern Reggio di Calabria) was a town situated on the east side of the Sicilian Straits, about 6 miles South of a point opposite Messana (Messina). Originally a colony of Chalcidian Greeks, the place enjoyed great prosperity in the 5th century BC, but was captured and destroyed by Dionysius, tyrant of Syracuse, in 387 BC, when all the surviving inhabitants were sold into slavery (Diodorus xiv. 106-8, 111, 112). The city never entirely recovered from this blow, althouah it was partially restored by the younaer Dionysius. On the occasion of the invasion of Italy by Pyrrhus, the people of Rhegium had recourse to an alliance with Rome (280 BC) and received 4,000 Campanian troops within their walls, who turned out to be very unruly guests. For, in imitation of a similar band of mercenaries across the strait in Messana, they massacred the male inhabitants and reduced the women to slavery (Polybius i.7; Orosius iv.3). They were not punished by the Romans until 270 BC, when the town was restored to those of its former inhabitants who still survived. The people of Rhegium were faithful to their alliance with Rome during the Second Punic War (Livy xxiii.30; xxiv. 1; xxvi.12; xxix.6). At the time of the Social War they were incorporated with the Roman state, Rhegium becoming a municipality (Cicero Verr. v.60; Pro Archia, 3).<P>The ship in which Paul sailed from Melita to Puteoli encountered unfavorable winds after leaving Syracuse, and reached Rhegium by means of tacking. It waited at Rhegium a day for a south wind which bore it to Puteoli (<a onClick="return mV(\'Act\',28,13);">Ac 28:13</a>), about 180 miles distant, where it probably arrived in about 26 hours.``3';
isbe[7423]='Rhesa`re\'-sa (Rhesa): A son of Zerubbabel in the genealogy of Jesus according to Luke (<a onClick="return mV(\'Luk\',3,27);">Lu 3:27</a>).``1';
isbe[7424]='Rhinoceros`ri-nos\'-er-os: This word is found in the King James Version margin to <a onClick="return mV(\'Isa\',34,7);">Isa 34:7</a> ("rhinocerots") for re\'emim, the King James Version "unicorns," the Revised Version (British and American) "wild-oxen." The word is quite inappropriate to the passage, which refers to the land of Edom. The one-horned rhinoceros, Rhinoceros unicornis, is confined to India. Other rhinoceroses are found in India and in equatorial Africa, but it is hardly to be presumed that these animals were meant by the Hebrew writers.`<a href="./study/isbe/search.html?string=UNICORN">UNICORN</a>`1';
isbe[7425]='Rhoda`ro\'-da (Rhode, "rose"): A maid in the house of Mary the mother of John Mark. She came to answer when Peter knocked at Mary\'s door after his miraculous release from prison. On recognizing his voice, she so forgot herself with joy that she neglected to open the door, but ran in to tell the others the glad news. They would not believe her, thinking she was mad; and when she persisted in her statement they said it must be his angel. The Jewish belief was that each man had a guardian angel assigned to him. Peter continued knocking, and was ultimately admitted (<a onClick="return mV(\'Act\',12,12);">Ac 12:12</a>).``78';
isbe[7426]='Rhodes`rodz (Rhodos): An island (and city) in the Aegean Sea, west of Caria, rough and rocky in parts, but well watered and productive, though at present not extensively cultivated. Almost one-third of the island is now covered with trees in spite of earlier deforestation. The highest mountains attain an altitude of nearly 4,000 ft. The older names were Ophiusa, Asteria, Trinacria, Corymbia. The capital in antiquity was Rhodes, at the northeastern extremity, a strongly fortitled city provided with a double harbor. Near the entrance of the harbor stood one of the seven wonders of the ancient world—a colossal bronze statue dedicated to Helios. Tiffs colossus, made by Chares about 290 BC, at a cost of 300 talents ($300,000 in 1915), towered to the height of 104 ft.<P>In the popular mind—both before and after Shakespeare represented Caesar as bestriding the world like a colossus—this gigantic figure is conceived as an image of a human being of monstrous size with leas spread wide apart, at the entrance of the inner harbor, so huge that the largest ship with sails spread could move in under it; but the account on which this conception is based seems to have no foundation.<P>The statue was destroyed in 223 BC by an earthquake. It was restored by the Romans. In 672 AD the Saracens sold the ruins to a Jew. The quantity of metal was so areat that it would fill the cars of a modern freight train (900 camel loads).<P>The most ancient cities of Rhodes were Ialysus, Ochyroma, and Lindus. The oldest inhabitants were immigrants from Crete. Later came the Carians. But no real advance in civilization was made before the immigration of the Dorians under Tlepolemus, one of the Heraclidae, and (after the Trojan war) Aethaemanes. Lindus, Ialysus and Camirus formed with Cos, Cnidus and Halicarnassus the so-called Dorian Hexapolis (Six Cities), the center of which was the temple of the Triopian Apollo on the coast of Caria. Rhodes now founded many colonies—in Spain (Rhode), in Italy (Parthenope, Salapia, Sirus, Sybaris), in Sicily (Gela), in Asia Minor (Soli), in Cilicia (Gaaae), and in Lycia (Corydalla). The island attained no political greatness until the three chief cities formed a confederation and rounded the new capital (Rhodes) in 408 BC. In the beginning of the Peloponnesian war, Rhodes sided with the Athenians, but, after 19 years of loyalty to Athens, went over to the Spartans (412 BC). In 394, when Conon appeared with his fleet before the city, the island fell into the hands of the Athenians again. A garrison was stationed at Rhodes by Alexander the Great. After his death this garrison was driven out by the Rhodians. It is at this time that the really great period of the island\'s history begins. The inhabitants bravely defended their capital against Demetrius Poliorcetes in 304 BC—the same Demetrius who two years before had won a naval victory and had coins stamped with a "Victory" that is the counterpart of the "Winaed Victory" which commands the unbounded admiration of the modern world—and extended their dominion over a strip of the Carian coast, as well as over several of the neiahboring islands, and for the first time in the history of the world established an international maritime and commercial law. The arts and sciences now began to flourish in the fair island in the southeastern Aegean. Aeschines, the famous orator of Athens, fled to Rhodes after his defeat by Demosthenes, and rounded a school of oratory, which was attended by many Romans. Rhodes became the faithful ally of Rome after the defeat of Antiochus in 189 BC. As a reward for her loyalty she received Caria. In 168, however, only a small portion of this territory remained under Rhodian sway (Peraea, or the Chersonesus). In 42 BC the island was devastated by Cassius. Later it was made a part of the Roman province of Asia (44 AD). Strabo says that he knows no city so splendid in harbor, walls and streets. When the Roman power declined, Rhodes fell into the hands of Caliph Moawijah, but later was taken by the Greeks, from whom at a later date the Genoese wrested the island. In 1249 John Cantacuzenus attempted to recover Rhodes, but in vain. Finally, however, success crowned the efforts of the Greeks under Theodoros Protosebastos. In 1310 the Knights of John, who had been driven from Palestine, made Rhodes their home. After the subjuaation of the island by Sultan Soliman in 1522 the Knights of John removed to Malta, and Rhodes has remained uninterruptedly a possession of the Sublime Porte down to the recent war between Turkey and the Balkan allies, forming, with the other islands, the province of the "Islands of the White Sea" (Archipelago). It has a Christian governor whose seat, though mostly at Rhodes, is sometimes at Chios. The population of the island has greatly diminished by emigration. In 1890 the total number of inhabitants was 30,000 (20,000 Greeks, 7,000 Mohammedans, 1,500 Jews). The chief products of Rhodes are wheat, oil, wine, figs and tropical fruits. A very important industry is the exportation of sponges. The purity of the air and the mildness of the climate make Rhodes a most delightful place to live in during the fall, winter and early spring. The city, built in the shape of an amphitheater, has a magnificent view toward the sea. It contains several churches made out of old mosques. The once famous harbor is now almost filled with sand. The inhabitants number nearly 12,000 (all Turks and Jews). Rhodes is mentioned in the New Testament only as a point where Paul touched on his voyage southward from the Hellespont to Caesarea (<a onClick="return mV(\'Act\',21,1);">Ac 21:1</a>); but in 1Macc 15:23 we are informed that it was one of the states to which the Romans sent letters in behalf of the Jews.<P>LITERATURE.<P>Berg, Die Insel Rhodes (Braunschweig, 1860-62): Schneiderwirth, Geschichte der Insel Rhodes (Heiligenstadt, 1868); Guerin, L\'ile de Rhodes, 2nd edition, Paris, 1880; Biliotti and Cottrel, L\'ile de Rhodes (Paris, 1881); Torr, Rhodes in Ancient Times (Cambridge, 1885) and Rhodes in Modern Times (1887).``71';
isbe[7427]='Rhodocus`rod\'-o-kus (Rhodokos): A Jewish traitor who disclosed the plans of Judas to Antiochus (Eupator) (2Macc 13:21) 162 BC. Of his fate nothing more is known.``1';
isbe[7428]='Rib`(tsela\', tsal\'ah; Aramaic \'ala\'): The Hebrew words designate the "side," "flank," thence the "ribs." They are found thus translated only in connection with the creation of Eve: "He (Yahweh) took one of his (Adam\'s) ribs, and closed up the flesh instead thereof: and the rib, which Yahweh God had taken from the man, made he (margin "builded he into") a woman" (<a onClick="return mV(\'Gen\',2,21,22);">Ge 2:21,22</a>). The Aramaic word is only found in <a onClick="return mV(\'Dan\',7,5);">Da 7:5</a>.<P>Twice the Revised Version (British and American) uses the word "rib" in a figurative sense of two beams or rafters built in to the ark of the covenant and the altar of incense, on which the golden rings were fastened, which served to carry ark and altar by means of staves (<a onClick="return mV(\'Exd\',30,4);">Ex 30:4</a>; <a onClick="return mV(\'Exd\',37,27);">37:27</a>).<P>A curious mistranslation has crept into the King James Version, which here follows Jewish commentators or etymologists, in four passages in 2 Samuel (<a onClick="return mV(\'2Sa\',2,23);">2:23</a>; <a onClick="return mV(\'2Sa\',3,27);">3:27</a>; <a onClick="return mV(\'2Sa\',4,6);">4:6</a>; <a onClick="return mV(\'2Sa\',20,10);">20:10</a>), where the "fifth rib" is mentioned as the place of the body under which spears or swords are thrust, so as to cause lethal wounds. The Hebrew word chomesh, which indeed means "fifth," is here a noun, derived from a root meaning "to be staunch," "stalwart," "stout" "fleshy," "obese" (compare chamush, "armed," "equipped soldier"; Arabic el khamis (el chamis), "the army," which, however, Arabic lexicographers explain as meaning "fivefold," namely, vanguard, right and left wing, center and rear guard). The word is to be translated "abdomen," "belly." the Revised Version (British and American) renders correctly "into the body."``106';
isbe[7429]='Ribai`ri\'-ba-i, ri\'-bi (ribhay; Septuagint Rheiba, with variants): A Benjamite, the father of <a href="./study/isbe/search.html?string=ITTAI">ITTAI</a> (which see), one of David\'s "mighty men" (<a onClick="return mV(\'2Sa\',23,29);">2Sa 23:29</a> parallel <a onClick="return mV(\'1Ch\',11,31);">1Ch 11:31</a>).``1';
isbe[7430]='Ribband`rib\'-and, rib\'-an (pathil (<a onClick="return mV(\'Num\',15,38);">Nu 15:38</a> the King James Version)).`<a href="./study/isbe/search.html?string=COLOR">COLOR</a>; <a href="./study/isbe/search.html??string=CORD">CORD</a>`1';
isbe[7431]='Riblah`rib\'-la (ribhlah; Rheblatha, with variants):<P>(1) Riblah in the land of Hamath first appears in history in 608 BC. Here Pharaoh-necoh, after defeating Josiah at Megiddo and destroying Kadytis or Kadesh on the Orontes, fixed his headquarters, and while in camp he deposed Jehoahaz and cast him into chains, fixed the tribute of Judah, and appointed Jehoiakim king (<a onClick="return mV(\'2Ki\',23,\'31-35\');">2Ki 23:31-35</a>). In 588 BC Nebuchadnezzar, at war with Egypt and the Syrian states, also established his headquarters at Riblah, and from it he directed the subjugation of Jerusalem. When it fell, Zedekiah was carried prisoner to Riblah, and there, after his sons and his nobles had been slain in his presence, his eyes were put out, and he was taken as a prisoner to Babylon (<a onClick="return mV(\'2Ki\',25,6,20);">2Ki 25:6,20</a>; <a onClick="return mV(\'Jer\',39,\'5-7\');">Jer 39:5-7</a>; <a onClick="return mV(\'Jer\',52,\'8-11\');">52:8-11</a>). Riblah then disappears from history, but the site exists today in the village of Ribleh, 35 miles northeast of Baalbek, and the situation is the finest that could have been chosen by the Egyptian or Babylonian kings for their headquarters in Syria. An army camped there had abundance of water in the control of the copious springs that go to form the Orontes. The Egyptians coming from the South had behind them the command of the rich corn and forage lands of Coele-Syria, while the Babylonian army from the north was equally fortunate in the rich plains extending to Hamath and the Euphrates. Lebanon, close by, with its forests, its hunting grounds and its snows, ministered to the needs and luxuries of the leaders. Riblah commanded the great trade and war route between Egypt and Mesopotamia, and, besides, it was at the dividing-point of many minor routes. It was in a position to attack with facility Phoenicia, Damascus or Palestine, or to defend itself against attack from those places, while a few miles to the South the mountains on each side close in forming a pass where a mighty host might easily be resisted by a few. In every way Riblah was the strategical point between North and South Syria. Riblah should probably be read for Diblah in <a onClick="return mV(\'Eze\',6,14);">Eze 6:14</a>, while in <a onClick="return mV(\'Num\',34,11);">Nu 34:11</a> it does not really appear. See (2).<P>(2) A place named as on the ideal eastern boundary of Israel in <a onClick="return mV(\'Num\',34,11);">Nu 34:11</a>, but omitted in <a onClick="return mV(\'Eze\',47,\'15-18\');">Eze 47:15-18</a>. The Massoretic Text reads "Hariblah"; but the Septuagint probably preserves the true vocalization, according to which we should translate "to Harbel." It is said to be to the east of \'Ain, and that, as the designation of a district, can only mean Merj \'Ayun, so that we should seek it in the neighborhood of Hermon, one of whose spurs Furrer found to be named Jebel \'Arbel.``23';
isbe[7432]='Riches`rich\'-ez, rich\'-iz: Used to render the following Hebrew and Greek words:<P>(1) \'Osher, which should, perhaps, be considered the most general word, as it is the most often used (<a onClick="return mV(\'Gen\',31,16);">Ge 31:16</a>; <a onClick="return mV(\'Ecc\',4,8);">Ec 4:8</a>; <a onClick="return mV(\'Jer\',9,23);">Jer 9:23</a>). It looks at riches simply as riches, without regard to any particular feature. Alongside this would go the Greek ploutos (<a onClick="return mV(\'Mat\',13,22);">Mt 13:22</a>; <a onClick="return mV(\'Eph\',2,7);">Eph 2:7</a>).<P>(2) Chocen (<a onClick="return mV(\'Pro\',27,24);">Pr 27:24</a>; <a onClick="return mV(\'Jer\',20,5);">Jer 20:5</a>), nekhacim and rekhush (<a onClick="return mV(\'Gen\',36,7);">Ge 36:7</a>; <a onClick="return mV(\'Dan\',11,13,14);">Da 11:13,14</a> the King James Version) look at riches as things accumulated, collected, amassed.<P>(3) Hon looks upon riches as earnings, the fruit of toil (<a onClick="return mV(\'Psa\',119,14);">Ps 119:14</a>; <a onClick="return mV(\'Pro\',8,18);">Pr 8:18</a>; <a onClick="return mV(\'Eze\',27,27);">Eze 27:27</a>).<P>(4) Hamon regards riches in the aspect of being much, this coming from the original idea of noise, through the idea of a multitude as making the noise, the idea of many, or much, being in multitude (<a onClick="return mV(\'Psa\',37,16);">Ps 37:16</a> the King James Version).<P>(5) Chayil regards riches as power (<a onClick="return mV(\'Psa\',62,1);">Ps 62:1</a>; <a onClick="return mV(\'Isa\',8,4);">Isa 8:4</a>; <a onClick="return mV(\'Isa\',10,14);">10:14</a>).<P>(6) Yithrah means "running over," and so presents riches as abundance (<a onClick="return mV(\'Jer\',48,36);">Jer 48:36</a> the King James Version). Along with this may be placed shua\', which has the idea of breadth, and so of abundance (<a onClick="return mV(\'Job\',36,19);">Job 36:19</a> the King James Version).<P>(7) Qinyan regards riches as a creation, something made (<a onClick="return mV(\'Psa\',104,24);">Ps 104:24</a>; compare margin);<P>(8) (chrema) looks at riches as useful (<a onClick="return mV(\'Mar\',10,23);">Mr 10:23</a>f parallel). Like the New Testament, the Apoe uses only ploutos and chrema.<P>Material riches are regarded by the Scriptures as neither good nor bad in themselves, but only according as they are properly or improperly used. They are transitory (<a onClick="return mV(\'Pro\',27,24);">Pr 27:24</a>); they are not to be trusted in (<a onClick="return mV(\'Mar\',10,23);">Mr 10:23</a>; <a onClick="return mV(\'Luk\',18,24);">Lu 18:24</a>; <a onClick="return mV(\'1Ti\',6,17);">1Ti 6:17</a>); they are not to be gloried in (<a onClick="return mV(\'Jer\',9,23);">Jer 9:23</a>); the heart is not to be set on them (<a onClick="return mV(\'Psa\',62,10);">Ps 62:10</a>); but they are made by God (<a onClick="return mV(\'Psa\',104,24);">Ps 104:24</a>), and come from God (<a onClick="return mV(\'1Ch\',29,12);">1Ch 29:12</a>); and they are the crown of the wise (<a onClick="return mV(\'Pro\',14,24);">Pr 14:24</a>). Material riches are used to body forth for us the most precious and glorious realities of the spiritual realm. See, e.g., <a onClick="return mV(\'Rom\',9,23);">Ro 9:23</a>; <a onClick="return mV(\'Rom\',11,33);">11:33</a>; <a onClick="return mV(\'Eph\',2,7);">Eph 2:7</a>; <a onClick="return mV(\'Phl\',4,19);">Php 4:19</a>; <a onClick="return mV(\'Col\',1,27);">Col 1:27</a>.`<a href="./study/isbe/search.html?string=MAMMON">MAMMON</a>; <a href="./study/isbe/search.html??string=TREASURE">TREASURE</a>; <a href="./study/isbe/search.html??string=WEALTH">WEALTH</a>`61';
isbe[7433]='Rid; Riddance`rid, rid\'-ans: "Rid" originally meant "rescue" (the King James Version <a onClick="return mV(\'Gen\',37,22);">Ge 37:22</a>; <a onClick="return mV(\'Exd\',6,6);">Ex 6:6</a>; <a onClick="return mV(\'Psa\',82,4);">Ps 82:4</a>; <a onClick="return mV(\'Psa\',144,7,11);">144:7,11</a>), whence the meaning "remove" or "clean out" (<a onClick="return mV(\'Lev\',26,6);">Le 26:6</a> the King James Version, with "riddance" in <a onClick="return mV(\'Lev\',23,22);">Le 23:22</a>; <a onClick="return mV(\'Zep\',1,18);">Ze 1:18</a>). The word occurs in the American Standard Revised Version and in the English Revised Version in <a onClick="return mV(\'Exd\',6,6);">Ex 6:6</a>.``1';

isbe[7436]='Right`rit (yashar, mishpat; dikaios, euthus): Many Hebrew words are translated "right," with different shades of meaning. Of these the two noted are the most important: yashar, with the sense of being straight, direct, as "right in the sight" of Yahweh (<a onClick="return mV(\'Exd\',15,26);">Ex 15:26</a>; <a onClick="return mV(\'Deu\',12,25);">De 12:25</a>, etc.), in one\'s own eyes (<a onClick="return mV(\'Jdg\',17,6);">Jud 17:6</a>), "right words" (<a onClick="return mV(\'Job\',6,25);">Job 6:25</a> the King James Version, yosher), "right paths" (<a onClick="return mV(\'Pro\',4,11);">Pr 4:11</a> the King James Version); and mishpat "judgment" "cause" etc., a forensic term, as "Shall not the Judge of all the earth do right?" (<a onClick="return mV(\'Gen\',18,25);">Ge 18:25</a>). In <a onClick="return mV(\'Job\',34,17);">Job 34:17</a>, the Revised Version (British and American) has "justice" (<a onClick="return mV(\'Job\',34,6);">34:6</A>, "right"), etc. The word tsedheq, tsedhaqah, ordinarily translated "righteousness," are in a few cases rendered "right" (<a onClick="return mV(\'2Sa\',19,28);">2Sa 19:28</a>; <a onClick="return mV(\'Neh\',2,20);">Ne 2:20</a>; <a onClick="return mV(\'Psa\',9,4);">Ps 9:4</a>; <a onClick="return mV(\'Psa\',17,1);">17:1</a>; <a onClick="return mV(\'Psa\',119,75);">119:75</a>; <a onClick="return mV(\'Eze\',18,5);">Eze 18:5</a>, etc.). In the New Testament the chief word is dikaios, primarily "even," "equal" (<a onClick="return mV(\'Mat\',20,4);">Mt 20:4</a>; <a onClick="return mV(\'Luk\',12,57);">Lu 12:57</a>, etc.); more generally the word is rendered "just" and "righteous." Euthus, used by Septuagint for yashar (<a onClick="return mV(\'1Sa\',12,23);">1Sa 12:23</a>; <a onClick="return mV(\'Hsa\',14,9);">Ho 14:9</a>), occurs a few times (<a onClick="return mV(\'Act\',8,21);">Ac 8:21</a>; <a onClick="return mV(\'Act\',13,10);">13:10</a>; <a onClick="return mV(\'2Pe\',2,15);">2Pe 2:15</a>); so orthos, "straight," "upright" (<a onClick="return mV(\'Luk\',10,28);">Lu 10:28</a>). "Right-hand" or "side" represents Hebrew yamin and kindred forms (<a onClick="return mV(\'Gen\',48,13,14,17);">Ge 48:13,14,17</a>; <a onClick="return mV(\'Exd\',15,6);">Ex 15:6</a>, etc.); the Greek, in this sense, is dexios (<a onClick="return mV(\'Mat\',6,3);">Mt 6:3</a>; <a onClick="return mV(\'Mat\',20,21);">20:21</a>, etc.).<P>Revised Version, among other changes, has "right" for the King James Version "judgment" in <a onClick="return mV(\'Job\',27,2);">Job 27:2</a>; <a onClick="return mV(\'Job\',34,5);">34:5</a>, and for "right" in the King James Version substitutes "straight" in <a onClick="return mV(\'Ezr\',8,21);">Ezr 8:21</a>, "skillful" in <a onClick="return mV(\'Ecc\',4,4);">Ec 4:4</a>, margin "successful," etc. In <a onClick="return mV(\'Jhn\',1,12);">Joh 1:12</a> the Revised Version (British and American) reads, "the right to become children of God" for the King James Version "the power" (exousia); in <a onClick="return mV(\'Mat\',20,7,15);">Mt 20:7,15</a> "right" is omitted, with the larger part of the verse. In <a onClick="return mV(\'2Ti\',2,15);">2Ti 2:15</a> "rightly dividing" (orthotomeo) is changed to "handling aright" with margin "holding a straight course in the word of truth. Or, rightly dividing the word of truth."``185';
isbe[7437]='Righteousness`ri\'-chus-nes (tsaddiq, adjective, "righteous," or occasionally "just" tsedheq, noun, occasionally = "riahteousness," occasionally = "justice"; dikaios, adjective, dikaiosune, noun, from dike, whose first meaning seems to have been "custom"; the general use suggested conformity to a standard: righteousness, "the state of him who is such as he ought to be" (Thayer)):<P>1. Double Aspect of Righteousness: Changing and Permanent<P>2. Social Customs and Righteousness<P>3. Changing Conception of Character of God: Obligations of Power<P>4. Righteousness as Inner<P>5. Righteousness as Social<P>6. Righteousness as Expanding in Content with Growth in Ideals of Human Worth<P>LITERATURE<hr /><P>1. Double Aspect of Righteousness: Changing and Permanent:<P>In Christian thought the idea of righteousness contains both a permanent and a changing element. The fixed element is the will to do right; the changing factor is the conception of what may be right at different times and under different circumstances. Throughout the entire course of Christian revelation we discern the emphasis on the first factor. To be sure, in the days of later Pharisaism righteousness came to be so much a matter of externals that the inner intent was often lost sight of altogether (<a onClick="return mV(\'Mat\',23,23);">Mt 23:23</a>); but, on the whole and in the main, Christian thought in all ages has recognized as the central element in righteousness the intention to be and do right. This common spirit binds together the first worshippers of God and the latest. Present-day conceptions of what is right differ by vast distances from the conceptions of the earlier Hebrews, but the intentions of the first worshippers are as discernible as are those of the doers of righteousness in the present day.<P>2. Social Customs and Righteousness:<P>There seems but little reason to doubt that the content of the idea of righteousness was determined in the first instance by the customs of social groups. There are some, of course, who would have us believe that what we experience as inner moral sanction is nothing but the fear of consequences which come through disobeying the will of the social group, or the feeling of pleasure which results as we know we have acted in accordance with the social demands. At least some thinkers would have us believe that this is all there was in moral feeling in the beginning. If a social group was to survive it must lay upon its individual members the heaviest exactions. Back of the performance of religious rites was the fear of the group that the god of the group would be displeased if certain honors were not rendered to him. Merely to escape the penalties of an angry deity the group demanded ceremonial religious observances. From the basis of fear thus wrought into the individuals of the group have come all our loftier movements toward righteousness.<P>It is not necessary to deny the measure of truth there may be in this account. To point out its inadequacy, however, a better statement would be that from the beginning the social group utilized the native moral feeling of the individual for the defense of the group. The moral feeling, by which we mean a sense of the difference between right and wrong, would seem to be a part of the native furnishing of the mind. It is very likely that in the beginning this moral feeling was directed toward the performance of the rites which the group looked upon as important.<P>See <a href="./study/isbe/search.html?string=ALMS">ALMS</a>.<P>As we read the earlier parts of the Old Testament we are struck by the fact that much of the early Hebrew morality was of this group kind. The righteous man was the man who performed the rites which had been handed down from the beginning (<a onClick="return mV(\'Deu\',6,25);">De 6:25</a>). The meaning of some of these rites is lost in obscurity, but from a very early period the characteristic of Hebrew righteousness is that it moves in the direction of what we should call today the enlargement of humanity. There seemed to be at work, not merely the forces which make for the preservation of the group, not merely the desire to please the God of the Hebrews for the sake of the material favors which He might render the Hebrews, but the factors which make for the betterment of humanity as such. As we examine the laws of the Hebrews, even at so late a time as the completion of the formal Codes, we are indeed struck by traces of primitive survivals (<a onClick="return mV(\'Num\',5,\'11-31\');">Nu 5:11-31</a>). There are some injunctions whose purpose we cannot well understand. But, on the other hand, the vast mass of the legislation had to do with really human considerations. There are rules concerning Sanitation (<a onClick="return mV(\'Lev\',13,\'1-\');">Le 13</a>), both as it touches the life of the group and of the individual; laws whose mastery begets emphasis, not merely upon external consequences, but upon the inner result in the life of the individual (<a onClick="return mV(\'Psa\',51,3);">Ps 51:3</a>); and prohibitions which would indicate that morality, at least in its plainer decencies, had come to be valued on its own account. If we were to seek for some clue to the development of the moral life of the Hebrews we might well find it in this emphasis upon the growing demands of human life as such. A suggestive writer has pointed out that the apparently meaningless commandment, "Thou shalt not boil a kid in its mother\'s milk" (<a onClick="return mV(\'Exd\',23,19);">Ex 23:19</a>), has back of it a real human purpose, that there are some things which in themselves are revolting apart from any external consequences (see also <a onClick="return mV(\'Lev\',18,\'1-\');">Le 18</a>).<P>3. Changing Conception of Character of God: Obligations of Power:<P>An index of the growth of the moral life of the people is to be found in the changing conception of the character of God. We need not enter into the question as to just where on the moral plane the idea of the God of the Hebrews started, but from the very beginning we see clearly that the Hebrews believed in their God as one passionately devoted to the right (<a onClick="return mV(\'Gen\',18,25);">Ge 18:25</a>). It may well be that at the start the God of the Hebrews was largely a God of War, but it is to be noticed that His enmity was against the peoples who had little regard for the larger human considerations. It has often been pointed out that one proof of the inspiration of the Scriptures is to be found in their moral superiority to the Scriptures of the peoples around about the Hebrews. If the Hebrew writers used material which was common property of Chaldeans, Babylonians, and other peoples, they nevertheless used these materials with a moral difference. They breathed into them a moral life which forever separates them from the Scriptures of other peoples. The marvel also of Hebrew history is that in the midst of revoltingly immoral surroundings the Hebrews grew to such ideals of human worth. The source of these ideals is to be found in their thougth of God. Of course, in moral progress there is a reciprocal effect; the thought of God affects the thought of human life and the thought of human life affects the thought of God; but the Hebrews no sooner came to a fresh moral insight than they made their moral discovery a part of the character of God. From the beginning, we repeat, the God of the Hebrews was a God directed in His moral wrath against all manner of abominations, aberrations and abnormalities. The purpose of God, according to the Hebrews, was to make a people "separated" in the sense that they were to be free from anything which would detract from a full moral life (<a onClick="return mV(\'Lev\',20,22);">Le 20:22</a>).<P>We can trace the more important steps in the growth of the Hebrew ideal. First, there was an increasingly clear discernment that certain things are to be ruled out at once as immoral. The primitive decencies upon which individual and social life depended were discerned at an early period (compare passages in Leviticus cited above). Along with this it must be admitted there was a slower approach to some ideals which we today consider important, the ideals of the marriage relations for example (<a onClick="return mV(\'Deu\',24,1,2);">De 24:1,2</a>). Then there was a growing sense of what constitutes moral obligation in the discharge of responsibilities upon the part of men toward their fellows (<a onClick="return mV(\'Isa\',5,8,23);">Isa 5:8,23</a>). There was increasing realization also of what God, as a moral Being, is obligated to do. The hope of salvation of nations and individuals rests at once upon the righteousness of God.<P>By the time of Isaiah the righteousness of God has come to include the obligations of power (<a onClick="return mV(\'Isa\',63,1);">Isa 63:1</a>). God will save His people, not merely because He has promised to save them, but because He must save them (<a onClick="return mV(\'Isa\',42,6);">Isa 42:6</a>). The must is moral. If the people of Israel show themselves unworthy, God must punish them; but if a remnant, even a small remnant, show themselves faithful, God must show His favor toward them. Moral worth is not conceived of as something that is to be paid for by external rewards, but if God is moral He must not treat the righteous and the unrighteous alike. This conception of what God must do as an obligated Being influences profoundly the Hebrew interpretation of the entire course of history (<a onClick="return mV(\'Isa\',10,20,21);">Isa 10:20,21</a>).<P>Upon this ideal of moral obligation there grows later the thought of the virtue of vicarious suffering (<a onClick="return mV(\'Isa\',53,\'1-\');">Isaiah 53</a>). The sufferings of the good man and of God for those who do not in themselves deserve such sufferings (for them) are a mark of a still higher righteousness (see <a href="./study/isbe/search.html?string=HOSEA">HOSEA</a>). The movement of the Scriptures is all the way from the thought of a God who gives battle for the right to the thought of a God who receives in Himself the heaviest shocks of that battle that others may have opportunity for moral life.<P>These various lines of moral development come, of course, to their crown in the New Testament in the life and death of Christ as set before us in the Gospels and interpreted by the apostles. Jesus stated certain moral axioms so clearly that the world never will escape their power. He said some things once and for all, and He did some things once and for all; that is to say, in His life and death He set on high the righteousness of God as at once moral obligation and self-sacrificing love (<a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>) and with such effectiveness that the world has not escaped and cannot escape this righteous influence (<a onClick="return mV(\'Jhn\',12,32);">Joh 12:32</a>). Moreover, the course of apostolic and subsequent history has shown that Christ put a winning and compelling power into the idea of righteousness that it would otherwise have lacked (<a onClick="return mV(\'Rom\',8,31,32);">Ro 8:31,32</a>).<P>4. Righteousness as Inner:<P>The ideas at work throughout the course of Hebrew and Christian history are, of course, at work today. Christianity deepens the sense of obligation to do right. It makes the moral spirit essential. Then it utilizes every force working for the increase of human happiness to set on high the meaning of righteousness. Jesus spoke of Himself as "life," and declared that He came that men might have life and have it more abundantly (<a onClick="return mV(\'Jhn\',10,10);">Joh 10:10</a>). The keeping of the commandments plays, of course, a large part in the unfolding of the life of the righteous Christian, but the keeping of the commandments is not to be conceived of in artificial or mechanical fashion (<a onClick="return mV(\'Luk\',10,\'25-37\');">Lu 10:25-37</a>). With the passage of the centuries some commandments once conceived of as essential drop into the secondary place, and other commandments take the controlling position. In Christian development increasing place is given for certain swift insights of the moral spirit. We believe that some things are righteous because they at once appeal to us as righteous. Again, some other things seem righteous because their consequences are beneficial, both for society and for the individual. Whatever makes for the largest life is in the direction of righteousness. In interpreting life, however, we must remember the essentially Christian conception that man does not live through outer consequences alone. In all thought of consequences the chief place has to be given to inner consequences. By the surrender of outward happiness and outward success a man may attain inner success. The spirit of the cross is still the path to the highest righteousness.<P>5. Righteousness as Social:<P>The distinctive note in emphasis upon righteousness in our own day is the stress laid upon social service. This does not mean that Christianity is to lose sight of the worth of the individual in himself. We have come pretty clearly to see that the individual is the only moral end in himself. Righteousness is to have as its aim the upbuilding of individual lives. The commandments of the righteous life are not for the sake of society as a thing in itself. Society is nothing apart from the individuals that compose it; but we are coming to see that individuals have larger relationships than we had once imagined and greater responsibilities than we had dreamed of. The influence of the individual touches others at more points than we had formerly realized. We have at times condemned the system of things as being responsible for much human misery which we now see can be traced to the agency of individuals. The employer, the day-laborer, the professional man, the public servant, all these have large responsibilities for the life of those around. The unrighteous individual has a power of contaminating other individuals, and his deadliness we have just begun to understand. All this is receiving new emphasis in our present-day preaching of righteousness. While our social relations are not ends in themselves, they are mighty means for reaching individuals in large numbers. The Christian conception of redeemed humanity is not that of society as an organism existing on its own account, but that of individuals knit very closely together in their social relationships and touching one another for good in these relationships (<a onClick="return mV(\'1Cr\',1,2);">1Co 1:2</a>; <a onClick="return mV(\'Rev\',7,9,10);">Re 7:9,10</a>). If we were to try to point out the line in which the Christian doctrine of righteousness is to move more and more through the years, we should have to emphasize this element of obligation to society. This does not mean that a new gospel is to supersede the old or even place itself alongside the old. It does mean that the righteousness of God and the teaching of Christ and the cross, which are as ever the center of Christianity, are to find fresh force in the thought of the righteousness of the Christian as binding itself, not merely by commandments to do the will of God in society, but by the inner spirit to live the life of God out into society.<P>6. Righteousness as Expanding in Content with Growth in Ideals of Human Worth:<P>In all our thought of righteousness it must be borne in mind that there is nothing in Christian revelation which will tell us what righteousness calls for in every particular circumstance. The differences between earlier and later practical standards of conduct and the differences between differing standards in different circumstances have led to much confusion in the realm of Christian thinking. We can keep our bearing, however, by remembering the double element in righteousness which we mentioned in the beginning; on the one hand, the will to do right, and, on the other, the difficulty of determining in a particular circumstance just what the right is. The larger Christian conceptions always have an element of fluidity, or, rather, an element of expansiveness. For example, it is clearly a Christian obligation to treat all men with a spirit of good will or with a spirit of Christian love. But what does love call for in a particular case? We can only answer the question by saying that love seeks for whatever is best, both for him who receives and for him who gives. This may lead to one course of conduct in one situation and to quite a different course in another. We must, however, keep before us always the aim of the largest life for all persons whom we can reach. Christian righteousness today is even more insistent upon material things, such as sanitary arrangements, than was the Code of Moses. The obligation to use the latest knowledge for the hygienic welfare is just as binding now as then, but "the latest knowledge" is a changing term. Material progress, education, spiritual instruction, are all influences which really make for full life.<P>Not only is present-day righteousness social and growing; it is also concerned, to a large degree, with the thought of the world which now is. Righteousness has too often been conceived of merely as the means of preparing for the life of some future Kingdom of Heaven. Present-day emphasis has not ceased to think of the life beyond this, but the life beyond this can best be met and faced by those who have been in the full sense righteous in the life that now is. There is here no break in true Christian continuity. The seers who have understood Christianity best always have insisted that to the fullest degree the present world must be redeemed by the life-giving forces of Christianity. We still insist that all idea of earthly righteousness takes its start from heavenly righteousness, or, rather, that the righteousness of man is to be based upon his conception of the righteousness of God. Present-day thinking concerns itself largely with the idea of the Immanence of God. God is in this present world. This does not mean that there may not be other worlds, or are not other worlds, and that God is not also in those worlds; but the immediate revelation of God to us is in our present world. Our present world then must be the sphere in which the righteousness of God and of man is to be set forth. God is conscience, and God is love. The present sphere is to be used for the manifestation of His holy love. The chief channel through which that holy love is to manifest itself is the conscience and love of the Christian believer. But even these terms are not to be used in the abstract. There is an abstract conscientiousness which leads to barren living: the life gets out of touch with things that are real. There is an experience of love which exhausts itself in well-wishing. Both conscience and love are to be kept close to the earth by emphasis upon the actual realities of the world in which we live.<P>LITERATURE.<P>G. B. Stevens, The Christian Doctrine of Salvation; A. E. Garvie, Handbook of Christian Apologetics; Borden P. Bowne, Principles of Ethics; Newman Smyth, Christian Ethics; A. B. Bruce, The Kingdom of God; W. N. Clarke, The Ideal of Jesus; H. C. King, The Ethics of Jesus.``112';
isbe[7438]='Rimmon (1)`rim\'-on:<P>(1) The rock Rimmon (cela\' rimmon; he petra Rhemmon): The place of refuge of the 600 surviving Benjamites of Gibeah (Jeba\') who "turned and fled toward the wilderness unto the rock of Rimmon, and abode in the rock of Rimmon four months" (<a onClick="return mV(\'Jdg\',20,45,47);">Jud 20:45,47</a>; <a onClick="return mV(\'Jdg\',21,13);">21:13</a>). Robinson\'s identification (RB, I, 440) has been very generally accepted. He found a conical and very prominent hill some 6 miles north-northeast of Jeba\' upon which stands a village called Rummon. This site was known to Eusebius and Jerome (OS 146 6; 287 98), who describe it as 15 Roman miles from Jerusalem. Another view, which would locate the place of refuge of the Benjamites in the Mugharet el jai, a large cavern on the south of the Wady Suweinit, near Jeba\', is strongly advocated by Rawnsley and Birch (see PEF, III, 137-48). The latter connects this again with <a onClick="return mV(\'1Sa\',14,2);">1Sa 14:2</a>, where Saul, accompanied by his 600, "abode in the uttermost part of Gibeah" under the pomegranate tree (Rimmon).<P>(2) (rimmon; Eremmon, or Rhemmoth): A city in the Negeb, near the border of Edom, ascribed to Judah (<a onClick="return mV(\'Jos\',15,32);">Jos 15:32</a>) and to Simeon (<a onClick="return mV(\'Jos\',19,7);">Jos 19:7</a>; <a onClick="return mV(\'1Ch\',4,32);">1Ch 4:32</a>, the King James Version "Remmon"). In <a onClick="return mV(\'Zec\',14,10);">Zec 14:10</a> it is mentioned as the extreme South of Judah—"from Geba to Rimmon, South of Jerusalem." In the earlier references Rimmon occurs in close association with \'Ain (a spring), and in <a onClick="return mV(\'Neh\',11,29);">Ne 11:29</a>, what is apparently the same place, \'Ain Rimmon, is called <a href="./study/isbe/search.html?string=EN-RIMMON">En-rimmon</a> (which see).<P>(3) (rimmon (<a onClick="return mV(\'Jos\',19,13);">Jos 19:13</a>), rimmonah, in some Hebrew manuscripts dimah (see <a href="./study/isbe/search.html?string=DIMNAH">DIMNAH</a>) (<a onClick="return mV(\'Jos\',21,35);">Jos 21:35</a>), and rimmono (<a onClick="return mV(\'1Ch\',6,77);">1Ch 6:77</a>)): In the King James Version we have "Remmon-methoar" in <a onClick="return mV(\'Jos\',19,13);">Jos 19:13</a>, but the Revised Version (British and American) translates the latter as "which stretcheth." This was a city on the border of Zebulun (<a onClick="return mV(\'Jos\',19,13);">Jos 19:13</a>) allotted to the Levites (<a onClick="return mV(\'Jos\',21,35);">Jos 21:35</a>, "Dimnah"; <a onClick="return mV(\'1Ch\',6,77);">1Ch 6:77</a>). The site is now the little village of Rummaneh on a low ridge South of the western end of the marshy plain el Battauf in Galilee; there are many rock-cut tombs and cisterns. It is about 4 miles north of el Mesh-hed, usually considered to be the site of Gath-hepher. See PEF, I, 363, Sh VI.``117';
isbe[7439]='Rimmon (2)`(rimmon, "pomegranate"; see <a href="./study/isbe/search.html?string=RIMMON-PEREZ">RIMMON-PEREZ</a>):<P>(1) A Syrian god. Naaman the Syrian leper after being cured is troubled over the fact that he will still have to bow down in the house of the Syrian god, Rimmon, when his master goes into the house to worship leaning on his hand (<a onClick="return mV(\'2Ki\',5,18);">2Ki 5:18</a>). Elisha answers him ambiguously: "Go in peace." Judging from Naaman\'s position and this incident, Rimmon must have been one of the leading gods of the Syrians worshipped in Damascus. He has been identified with Rammanu, the Assyrian god of wind, rain and storm. The name appears in the Syrian personal names <a href="./study/isbe/search.html?string=HADADRIMMON">HADADRIMMON</a> and <a href="./study/isbe/search.html?string=TABRIMMON">TABRIMMON</a> (which see) and its meaning is dubious (ramamu, "to thunder" (?))<P>(2) A Benjamite of Beeroth, whose sons Baanah and Rechab assassinated Ish-bosheth (<a onClick="return mV(\'2Sa\',4,2,5,9);">2Sa 4:2,5,9</a>).``81';
isbe[7440]='Rimmon, Rock of``<a href="./study/isbe/search.html?string=RIMMON">RIMMON</a>`1';
isbe[7441]='Rimmon-Perez`rim-mon-pe\'-rez (rimmon perets; the King James Version Rimmon-parez): A desert camp of the Israelites (<a onClick="return mV(\'Num\',33,19);">Nu 33:19</a>f), unidentified. Gesenius translates rimmon as "pomegranate," the place deriving its name from the abundance of pomegranates. But Conder derives it from ramam, "to be high," and translates it "cloven height."`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[7442]='Rimmonah; Rimmono`rim-mo\'-na, rimmo\'-no.`<a href="./study/isbe/search.html?string=RIMMON">RIMMON</a>`1';
isbe[7443]='Ring`(Anglo-Saxon, Hring, "ring"): The word renders (the American Standard Revised Version) two Hebrew words (in the King James Version and the English Revised Version three) and two Greek words. Tabba\'ath, the principal Hebrew word, is from Tabha\', "sink," either because the ring is something "cast" or molded, or, more probably, since the principal use of the ring was as a seal, because it "sank" into the wax or clay that received the impression. In Exodus, Tabba\'ath, "ring," is a detail of furniture or equipment, as the rings of the ark through which the staves were thrust (<a onClick="return mV(\'Exd\',25,12);">Ex 25:12</a>, etc.), rings for curtains, in the high priest\'s ephod (<a onClick="return mV(\'Exd\',28,28);">Ex 28:28</a>; <a onClick="return mV(\'Exd\',39,21);">39:21</a>), etc. Its other use was perhaps the original, to describe the article of personal adornment worn on the finger, apparently in the Old Testament always a signet-ring, and as such an indispensable article of masculine attire. Such a ring Pharaoh gave Joseph as a symbol of authority (<a onClick="return mV(\'Gen\',41,42);">Ge 41:42</a>); and Ahasuerus gave Haman (<a onClick="return mV(\'Est\',3,10);">Es 3:10</a>); with it the royal missive was sealed (<a onClick="return mV(\'Est\',3,12);">Es 3:12</a>; <a onClick="return mV(\'Est\',8,8,10);">8:8 twice, 10</a>). It was also a feminine ornament in Isaiah\'s list of the fashionable feminine paraphernalia, "the rings and the nose-jewels" (quite likely rings also) (<a onClick="return mV(\'Isa\',3,21);">Isa 3:21</a>). Either as ornaments or for their intrinsic value, or both, rings were used as gifts for sacred purposes from both men and women: "brooches, and ear-rings, and signet-rings" (margin "nose-rings") (<a onClick="return mV(\'Exd\',35,22);">Ex 35:22</a>); "bracelets, rings (the American Standard Revised Version "signet-rings"), ear-rings" (<a onClick="return mV(\'Num\',31,50);">Nu 31:50</a> the King James Version). chotham, "signet," mentioned in <a onClick="return mV(\'Gen\',38,18,25);">Ge 38:18,25</a>; <a onClick="return mV(\'Exd\',28,11,21,36);">Ex 28:11,21,36</a>; <a onClick="return mV(\'Exd\',39,6,14,30);">Ex 39:6,14,30</a>; <a onClick="return mV(\'Jer\',22,24);">Jer 22:24</a>; <a onClick="return mV(\'Hag\',2,23);">Hag 2:23</a>, etc., was probably usually a seal ring, but in <a onClick="return mV(\'Gen\',38,1);">Ge 38</a> and elsewhere the seal may have been swung on wire, and suspended by a cord from the neck. It was not only an identification, but served as a stamp for signature. galil, "circle" (compare "Galilee," "Circle" of the Gentiles), rendered "ring" in <a onClick="return mV(\'Est\',1,6);">Es 1:6</a>; <a onClick="return mV(\'Sgs\',5,14);">So 5:14</a>, may rather mean "cylinder" or "rod" of metal. <a href="./study/isbe/search.html?string=EARRING">Earring</a> (which see) in the King James Version is from totally different words: nezem, whose etymology is unknown, aghil, "round," or lachash, "amulet"; so the Revised Version (British and American). The "rings" of the wheels in <a onClick="return mV(\'Eze\',1,18);">Eze 1:18</a> (the King James Version) are gabh, "curved," and mean "rims" (American Standard Revised Version), "felloes." Egyptians especially wore a great profusion of rings, principally of silver or gold, engraved with scarabaei, or other devices. In the New Testament the ring, daktulios, "finger-ring," is a token of means, position, standing: "put a ring on his hand" (<a onClick="return mV(\'Luk\',15,22);">Lu 15:22</a>). Perhaps also it included the right to give orders in his father\'s name. To be chrusodaktulios, "golden-ringed," perhaps with more than one, indicated wealth and social rank: "a man with a gold ring" (<a onClick="return mV(\'Jam\',2,2);">Jas 2:2</a>).`<a href="./study/isbe/search.html?string=EARRING">EARRING</a>; <a href="./study/isbe/search.html??string=SIGNET">SIGNET</a>; <a href="./study/isbe/search.html??string=SEAL">SEAL</a>`31';
isbe[7444]='Ringleader`ring\'-led-er: In <a onClick="return mV(\'Act\',24,5);">Ac 24:5</a> the translation of protostates, "one who stands first." Not an opprobrious word in the Greek.``1';
isbe[7445]='Ringstreaked`ring\'-strekt (the King James Version and the English Revised Version ringstraked): <a onClick="return mV(\'Gen\',30,35,39,40);">Ge 30:35,39,40</a>; <a onClick="return mV(\'Gen\',31,8,10,12);">31:8 (twice), 10,12</a> for \'aqodh. In the context of <a onClick="return mV(\'Gen\',30,35);">Ge 30:35</a>, etc., \'aqodh certainly denotes defective coloring of some sort, but the exact meaning of the word is uncertain. The translation "ringstreaked" ("marked with circular bands") comes from connecting the word with the Hebrew root \'-q-d, "to bind" (<a onClick="return mV(\'Gen\',22,9);">Ge 22:9</a>), but this connection is dubious.``1';
isbe[7446]='Rinnah`rin\'-a (rinnah, "praise to God"; Septuagint: Codex Vaticanus Ana; Codex Alexandrinus Rhannon): A Judahite, according to Massoretic Text a son of Shimon (<a onClick="return mV(\'1Ch\',4,20);">1Ch 4:20</a>). But the Septuagint makes him a son of Hanan (Codex Vaticanus Phana; Codex Alexandrinus Anan) by reading "ben" in the next name (Ben-hanan) as "son of."``1';
isbe[7447]='Riot`ri\'-ut: Properly, "unrestrained behavior" of any sort, but in modern English usually connoting mob action, although such phrases as a "riotous banquet" are still in common use. the King James Version uses the word in the first sense, and it is retained by the Revised Version (British and American) in <a onClick="return mV(\'Luk\',15,13);">Lu 15:13</a>; <a onClick="return mV(\'Tts\',1,6);">Tit 1:6</a>; <a onClick="return mV(\'1Pe\',4,4);">1Pe 4:4</a> for asotos, asotia, "having no hope of safety," "profligate]." In <a onClick="return mV(\'Pro\',23,20);">Pr 23:20</a>; <a onClick="return mV(\'Pro\',28,7);">28:7</a> the Revised Version (British and American) has preferred "gluttonous," "glutton," in <a onClick="return mV(\'Rom\',13,13);">Ro 13:13</a>, "revelling," and in <a onClick="return mV(\'2Pe\',2,13);">2Pe 2:13</a>, "revel."``48';
isbe[7448]='Riphath`ri\'-fath (riphath): A son of Gomer, the eldest son of Japhet (<a onClick="return mV(\'Gen\',10,3);">Ge 10:3</a>; <a onClick="return mV(\'1Ch\',1,6);">1Ch 1:6</a>, where Massoretic Text and the Revised Version (British and American) read <a href="./study/isbe/search.html?string=DIPHATH">DIPHATH</a> (which see)). Josephus (Ant., I, vi, 1) identifies the Ripheans with the Paphlagonians, through whose country on the Black Sea ran the river "Rhebas" (Pliny, NH, vi.4).``1';
isbe[7449]='Rising`riz\'-ing (se\'eth, "a tumor," "swelling" (<a onClick="return mV(\'Lev\',13,2,10);">Le 13:2,10</a>, etc.)).`<a href="./study/isbe/search.html?string=LEPROSY">LEPROSY</a>`1';
isbe[7450]='Rissah`ris\'-a (riccah, "dew"): A camp of the Israelites in the wilderness wanderings between Libnah and Kehelathah (<a onClick="return mV(\'Num\',33,21);">Nu 33:21</a>f).`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[7451]='Rithmah`rith\'-ma (rithmah, "broom"): A desert camp of the Israelites (<a onClick="return mV(\'Num\',33,18,19);">Nu 33:18,19</a>). The name refers to the white desert broom.`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[7452]='River`riv\'-er:<P>(1) The usual word is nahar (Aramaic nehar (<a onClick="return mV(\'Ezr\',4,10);">Ezr 4:10</a>, etc.)), used of the rivers of Eden (<a onClick="return mV(\'Gen\',2,\'10-14\');">Ge 2:10-14</a>), often of the Euphrates (<a onClick="return mV(\'Gen\',15,18);">Ge 15:18</a>, etc.), of Abana and Pharpar (<a onClick="return mV(\'2Ki\',5,12);">2Ki 5:12</a>), the river of Gozan (<a onClick="return mV(\'2Ki\',17,6);">2Ki 17:6</a>), the river Chebar (<a onClick="return mV(\'Eze\',1,1);">Eze 1:1</a>), the rivers (canals?) of Babylon (<a onClick="return mV(\'Psa\',137,1);">Ps 137:1</a>), the rivers of Ethiopia (<a onClick="return mV(\'Isa\',18,1);">Isa 18:1</a>; <a onClick="return mV(\'Zep\',3,10);">Ze 3:10</a>). Compare nahr, the common Arabic word for "river."<P>(2) ye\'or, according to BDB from Egyptian iotr, \'io\'r, "watercourse," often of the Nile (<a onClick="return mV(\'Exd\',1,22);">Ex 1:22</a>, etc.). In <a onClick="return mV(\'Isa\',19,6);">Isa 19:6</a>, for ye\'ore matsor, the King James Version "brooks of defense," the Revised Version (British and American) has "streams of Egypt." In <a onClick="return mV(\'Isa\',19,7,8);">Isa 19:7,8</a>, for ye\'or, the King James Version "brooks," and <a onClick="return mV(\'Zec\',10,11);">Zec 10:11</a>, the King James Version "river," the Revised Version (British and American) has "Nile." In <a onClick="return mV(\'Job\',28,10);">Job 28:10</a>, the King James Version "He cutteth out rivers among the rocks," the Revised Version (British and American) has "channels," the Revised Version margin "passages."<P>(3) There are nearly 100 references to nachal. In about half of these the King James Version has "brook" and in about half "river." the Revised Version (British and American) has more often "brook" or "valley." But the Revised Version (British and American) has river in "whatsoever hath fins and scales in the waters, in the seas, and in the rivers" (<a onClick="return mV(\'Lev\',11,9);">Le 11:9</a>); "the river Jabbok" (<a onClick="return mV(\'Deu\',2,37);">De 2:37</a>; <a onClick="return mV(\'Jos\',12,2);">Jos 12:2</a>); the stream issuing from the temple (<a onClick="return mV(\'Eze\',47,\'5-12\');">Eze 47:5-12</a>). the Revised Version (British and American) has "brook of Egypt," i.e. el-\'Arish (<a onClick="return mV(\'Num\',34,5);">Nu 34:5</a>; <a onClick="return mV(\'Jos\',15,47);">Jos 15:47</a>; <a onClick="return mV(\'1Ki\',8,65);">1Ki 8:65</a>; <a onClick="return mV(\'2Ki\',24,7);">2Ki 24:7</a>; <a onClick="return mV(\'2Ch\',7,8);">2Ch 7:8</a>; <a onClick="return mV(\'Amo\',6,14);">Am 6:14</a>, "of the Arabah"); "brook (the King James Version "river") of Kanah" (<a onClick="return mV(\'Jos\',16,8);">Jos 16:8</a>); "valley (the King James Version "river") of the Arnon" (<a onClick="return mV(\'Deu\',2,24);">De 2:24</a>). English Versions of the Bible has "valley": of Gerar (<a onClick="return mV(\'Gen\',26,17);">Ge 26:17</a>), of Zered (<a onClick="return mV(\'Num\',21,12);">Nu 21:12</a>), but "brook Zered" (<a onClick="return mV(\'Deu\',2,13);">De 2:13</a>), of Eschol (<a onClick="return mV(\'Num\',32,9);">Nu 32:9</a>), of Sorek (<a onClick="return mV(\'Jdg\',16,4);">Jud 16:4</a>), of Shittim (<a onClick="return mV(\'Joe\',3,18);">Joe 3:18</a>). English Versions of the Bible has "brook": Besor (<a onClick="return mV(\'1Sa\',30,10);">1Sa 30:10</a>), Kidron (<a onClick="return mV(\'2Sa\',15,23);">2Sa 15:23</a>), Gaash, (<a onClick="return mV(\'2Sa\',23,30);">2Sa 23:30</a>), Cherith (<a onClick="return mV(\'1Ki\',17,3);">1Ki 17:3</a>); also the feminine nachalah, "brook (the King James Version "river") of Egypt" (<a onClick="return mV(\'Eze\',47,19);">Eze 47:19</a>; <a onClick="return mV(\'Eze\',48,28);">48:28</a>). The torrent-valley (wady) is often meant.<P>(4) pelegh, with feminine pelaggah, the King James Version "river," is in the Revised Version (British and American) translated "stream," except English Versions of the Bible "river of God" (<a onClick="return mV(\'Psa\',65,9);">Ps 65:9</a>); "streams of water" (<a onClick="return mV(\'Psa\',1,3);">Ps 1:3</a>; <a onClick="return mV(\'Pro\',5,16);">Pr 5:16</a>; <a onClick="return mV(\'Isa\',32,2);">Isa 32:2</a>; <a onClick="return mV(\'Lam\',3,48);">La 3:48</a>); "streams of honey" (<a onClick="return mV(\'Job\',20,17);">Job 20:17</a>); "streams of oil" (<a onClick="return mV(\'Job\',29,6);">Job 29:6</a>).<P>(5) \'aphiq, the King James Version "river," except English Versions of the Bible "water brooks" (<a onClick="return mV(\'Psa\',42,1);">Ps 42:1</a>), is in the Revised Version (British and American) "watercourses" (<a onClick="return mV(\'Eze\',6,3);">Eze 6:3</a>; <a onClick="return mV(\'Eze\',31,12);">31:12</a>; <a onClick="return mV(\'Eze\',32,6);">32:6</a>; <a onClick="return mV(\'Eze\',34,13);">34:13</a>; <a onClick="return mV(\'Eze\',35,8);">35:8</a>; <a onClick="return mV(\'Eze\',36,4,6);">36:4,6</a>), "water-brooks" (<a onClick="return mV(\'Sgs\',5,12);">So 5:12</a>; <a onClick="return mV(\'Joe\',1,20);">Joe 1:20</a>).<P>(6) yubhal, English Versions of the Bible "river" (<a onClick="return mV(\'Jer\',17,8);">Jer 17:8</a>). \'ubhal, and \'ubhal, English Versions of the Bible "river" (<a onClick="return mV(\'Dan\',8,2,3,6);">Da 8:2,3,6</a>).<P>(7) potamos: of the Jordan (<a onClick="return mV(\'Mar\',1,5);">Mr 1:5</a>); Euphrates (<a onClick="return mV(\'Rev\',9,14);">Re 9:14</a>); "rivers of living water" (<a onClick="return mV(\'Jhn\',7,38);">Joh 7:38</a>); "river of water of life" (<a onClick="return mV(\'Rev\',22,1);">Re 22:1</a>). So always in Greek for "river" in the Revised Version (British and American) Apocrypha (1Esdras 4:23, etc.).`<a href="./study/isbe/search.html?string=BROOK">BROOK</a>; <a href="./study/isbe/search.html??string=STREAM">STREAM</a>; <a href="./study/isbe/search.html??string=VALLEY">VALLEY</a>`37';

isbe[7454]='River, the (Great)``<a href="./study/isbe/search.html?string=EUPHRATES">EUPHRATES</a>`1';

isbe[7456]='Rizia`riz\'-i-a (ritsya\'): An Asherite (<a onClick="return mV(\'1Ch\',7,39);">1Ch 7:39</a>).``1';
isbe[7457]='Rizpah`riz\'-pa (ritspah, "hot stone"; Josephus, Rhaispha): In <a onClick="return mV(\'2Sa\',3,7);">2Sa 3:7</a> the subject of a coarse slander. <a onClick="return mV(\'2Sa\',21,1);">2Sa 21</a> contains the pathetic story of Rizpah\'s faithful watch over the bodies of her dead sons Mephibosheth and Armoni (<a onClick="return mV(\'2Sa\',21,10,11);">21:10,11</A>). Did this story suggest Tennyson\'s "Rizpah"? A three years\' famine had made David anxious, and in seeking a reason for the affliction he concluded that it lay in Saul\'s unavenged conduct to the Gibeonites (<a onClick="return mV(\'2Sa\',21,2);">21:2</a>). To appease Yahweh he gave up to the Gibeonites the two sons of Saul, Mephibosheth and Armoni, as well as Saul\'s 5 grandsons (whether by Michal or Merab; see <a href="./study/isbe/search.html?string=MERAB">MERAB</A>). These seven were hanged at Gibeah. Rizpah watched 5 months over their exposed bodies, but meanwhile the famine did not abate. Word was brought to David of Rizpah\'s act (<a onClick="return mV(\'2Sa\',21,10,11);">21:10,11</a>), and it is possible that her action suggested to David his next step in expiation. At any rate, he remembered the uncared-for bones of Jonathan and Saul lying in ignominy at Jabesh-gilead, whither they had been carried by stealth after the Philistines had kept them hung in the streets of Beth-shan for some time. The bones were recovered and apparently mingled with the bones Rizpah had guarded, and they were together buried in the family grave at Zelah. We are told that then "God was entreated for the land" (<a onClick="return mV(\'2Sa\',21,14);">21:14</a>).``186';
isbe[7458]='Road (Inroad)`rod the King James Version (<a onClick="return mV(\'1Sa\',27,10);">1Sa 27:10</a>; compare <a onClick="return mV(\'1Sa\',23,27);">1Sa 23:27</a>).`<a href="./study/isbe/search.html?string=RAID">RAID</a>`1';
