isbe[7401]='Retention of Sins`re-ten\'-shun, (krateo, "to lay fast hold of" (<a onClick="return mV(\'Jhn\',20,23);">Joh 20:23</a>)): The opposite of "the remission of sins." Where there was no evidence of repentance and faith, the community of believers were unauthorized to give assurance of forgiveness, and, therefore, could only warn that the guilt of sin was retained, and that the sinner remained beneath God\'s judgment.<P>While such retention has its place in connection with all preaching of the gospel, since the offers of grace are conditional, it is especially exercised, like the absolution, in the personal dealing of a pastor with a communicant, preparatory to the reception of the Lord\'s Supper. As the absolution is properly an assurance of individual forgiveness, so the retention is an assurance of individual non-forgiveness. That the retention is exercised by the ministry, not as an order, but as the representatives of the congregation of believers to which Christ gave the power of the keys, is shown by Alford, Greek Testament, on above passage. See also Melanchthon, Appendix to the "Schmalkald Articles."``84';
isbe[7402]='Retribution`ret-ri-bu\'-shun:<P>1. New Testament Terms<P>2. A Revelation of Wrath as Well as Grace<P>3. Witness of Natural Theology<P>4. Retribution the Natural Consequence of Sin<P>5. Also the Positive Infliction of Divine Wrath<P>6. Instances of Use of Orge and Thumos<P>7. Instances of Use of Greek Words for "Vengeance"<P>8. Words Meaning "Chastisement" Not Used of the Impenitent<P>9. Judgment Implies Retribution<P>10. Moral Sense Demands Vindication of God\'s Righteousness<P>11. Scripture Indicates Certainty of Vindication<P>LITERATURE<hr /><P>1. New Testament Terms:<P>The word as applied to the divine administration is not used in Scripture, but undoubtedly the idea is commonly enough expressed. The words which come nearest to it are orge, and thumos wrath attributed to God; ekdikeo, ekdikesis, ekdikos, and dike, all giving the idea of vengeance; kolasis, and timoria, "punishment"; besides krino, and its derivatives, words expressive of judgment.<P>2. A Revelation of Wrath as Well as Grace:<P><a onClick="return mV(\'Rom\',2,\'1-\');">Romans 2</a> is full of the thought of retribution. The apostle, in <a onClick="return mV(\'Rom\',2,5,6);">2:5,6</a>, comes very near to using the word itself, and gives indeed a good description of the thing: the day of wrath and revelation of the righteous judgment of God, "who will render to every man according to his works." It is well in approaching the subject to remind ourselves that there is undoubtedly, as the apostle says, a Revelation of wrath. We are so accustomed to think of the gracious revelation which the gospel brings us, and to approach the subject of the doom of the impenitent under the influence of the kindly sentiments engendered thereby, and with a view of God\'s gracious character as revealed in salvation, that we are apt to overlook somewhat the sterner facts of sin, and to misconceive the divine attitude toward the impenitent sinner. It is certainly well that we should let the grace of the gospel have full influence upon all our thinking, but we must beware of being too fully engrossed with one phase of the divine character. It is an infirmity of human nature that we find it difficult to let two seemingly conflicting conceptions find a place in our thought. We are apt to surrender ourselves to the sway of one or the other of them according to the pressure of the moment.<P>3. Witness of Natural Theology:<P>Putting ourselves back into the position of those who have only the light of natural theology, we find that all deductions from the perfections of God, as revealed in His works, combined with a consideration of man\'s sin and want of harmony with the Holy One, lead to the conclusion announced by the apostle: "The wrath of God is revealed from heaven against all ungodliness and unrighteousness of men" (<a onClick="return mV(\'Rom\',1,18);">Ro 1:18</a>). Wrath implies punishment, punishment is decreed, punishment is denounced. The word of God but confirms the verdict which conscience forecasts. Nature teaches that punishment, retribution, must follow sin. Within the sphere of physical law this is clearly exemplified. No breach of the so-called laws of Nature is tolerated. Strictly speaking, the laws of Nature cannot be broken, but let a man fail to keep in harmony with them, and the natural consequences will be trouble, punishment, retribution. Harmony with law is blessing; collision with law is loss. Thus law in Nature "worketh wrath" to the neglecters of it. Punishment necessarily results. So we may well expect that in the higher sphere, God\'s moral laws cannot be neglected or violated with impunity, and Scripture fully justifies the expectation and shows that sin must be punished. All things considered, the fact of punishment for sinners need not surprise; the fact of pardon is the surprising thing. The surprise of pardon has ceased to surprise us because we are so familiar with the thought. We know the "how" of it because of the revelation of grace. Grace, however, saves on certain conditions, and there is no such thing known in Scripture as indiscriminate, necessary, universal grace. It is only from the Bible that we know of the salvation by grace. That same revelation shows that the grace does not come to all, in the sense of saving all; though, of course, it may be considered as presented to all. Those who are not touched and saved by grace remain shut up in their sins. They are, and must be, in the nature of the case, left to the consequences of their sins, with the added guilt of rejecting the offered grace. "Except ye believe that I am he," said Incarnate Grace, "ye shall die in your sins" (<a onClick="return mV(\'Jhn\',8,24);">Joh 8:24</a>).<P>4. Retribution the Natural Consequence of Sin:<P>Another conclusion we may draw from the general Scriptural representation is that the future retribution is one aspect of the natural consequence of sin, yet it is also in another aspect the positive infliction of divine wrath. It is shown to be the natural outcome of sin in such passages as "Whatsoever a man soweth, that shall he also reap" (<a onClick="return mV(\'Gal\',6,7);">Ga 6:7</a>); "He that soweth unto his own flesh shall of the flesh reap corruption" (<a onClick="return mV(\'Gal\',6,8);">Ga 6:8</a>). It is not without suggestiveness that the Hebrew word \'awon means both iniquity and punishment, and when Cain said "My punishment is greater than I can bear" (<a onClick="return mV(\'Gen\',4,13);">Ge 4:13</a>), he really said "My iniquity is greater than I can bear"; his iniquity became his punishment. A due consideration of this thought goes a long way toward meeting many of the objections brought against the doctrine of future punishment.<P>5. Also the Positive Infliction of Divine Wrath:<P>The other statement, however, remains true and must be emphasized, that there is an actual infliction of divine wrath. All the great statements about the divine judgment imply this, and while it is wrong not to take account of the natural working out of sin in its terrible consequences, it is equally wrong, perhaps more so, to refuse to recognize this positive divine infliction of punishment. This, indeed, is the outstanding feature of retribution as it assumes form in Scripture. Even the natural consequences of sin, rightly viewed, are part of the divine infliction, since God, in the nature of things, has conjoined sin and its consequences, and part of the positive infliction is the judicial shutting up of the sinner to the consequences of his sin. So in the case of Cain, his iniquity became his punishment, inasmuch as God sentenced him to bear the consequences of that iniquity. On the other hand, we might say that even the terribly positive outpourings of God\'s wrath upon the sinner are the natural consequences of sin, since sin in its very nature calls down the divine displeasure. Indeed, these two phases of future punishment are so very closely connected that a right view of the matter compels us to keep both before us, and no full explanation of the punishment is possible when either phase is ignored.<P>6. Instances of the Use of Orge and Thumos:<P>The terms in Scripture applied to the doom of sinners all imply divine displeasure, punitive action, retribution. The two outstanding Greek words for "wrath," orge and thumos, are both freely applied to God. Orge indicates settled displeasure, whereas thumos is rather the blazing out of the anger. The former is, as we should expect, more frequently applied to God, and, of course, all that is capricious and reprehensible in human wrath must be eliminated from the word as used of God. It indicates the settled opposition of His holy nature against sin. It was an affection found in the sinless Saviour Himself, for "he looked round about on them with anger" (<a onClick="return mV(\'Mar\',3,5);">Mr 3:5</a>). In the Baptist\'s warning "to flee from the wrath to come" (<a onClick="return mV(\'Mat\',3,7);">Mt 3:7</a>; <a onClick="return mV(\'Luk\',3,7);">Lu 3:7</a>), it is unquestionably the wrath of God that is meant, the manifestation of that being further described as the burning of the chaff with unquenchable fire (<a onClick="return mV(\'Mat\',3,12);">Mt 3:12</a>). In <a onClick="return mV(\'Jhn\',3,36);">Joh 3:36</a> it is said of the unbeliever that "the wrath of God" abideth on him. In Romans it is used at least 9 times in reference to God, first in <a onClick="return mV(\'Rom\',1,18);">Ro 1:18</a>, the great passage we have already quoted about "the wrath of God revealed from heaven." The connection is a suggestive one and is often overlooked. In the passage Paul has quite a chain of reasons; he is ready to preach the gospel at Rome for he is not ashamed of the gospel; he is not ashamed of the gospel for it is the power of God unto salvation; it is the "power of God" for therein is revealed the righteousness of God by faith; and this salvation by faith is a necessity "for the wrath of God is revealed," etc. Thus the divine wrath on account of sin is the dark background of the gospel message. Had there been no such just wrath upon men, there had been no need for the divine salvation. The despising of God\'s goodness by the impenitent means a treasuring up of "wrath in the day of wrath and revelation of the righteous judgment of God" (<a onClick="return mV(\'Rom\',2,\'3-5\');">Ro 2:3-5</a>). God "visiteth with wrath" (<a onClick="return mV(\'Rom\',3,5);">Ro 3:5</a>).<P>In <a onClick="return mV(\'Rom\',4,15);">Ro 4:15</a> the apostle shows that "the law worketh wrath" (i.e. brings down the divine displeasure), while in <a onClick="return mV(\'Rom\',5,9);">5:9</a> he shows that believers are saved from wrath—undoubted wrath of God. The other two instances are in <a onClick="return mV(\'Rom\',9,22);">9:22</A>. Men are "by nature children of wrath" (<a onClick="return mV(\'Eph\',2,3);">Eph 2:3</a>); surely not "wrathful children," but liable to the wrath of God, and because of evil deeds cometh "the wrath of God upon the sons of disobedience" (<a onClick="return mV(\'Eph\',5,6);">Eph 5:6</a>; <a onClick="return mV(\'Col\',3,6);">Col 3:6</a>). Christ "delivereth us from the wrath to come" (<a onClick="return mV(\'1Th\',1,10);">1Th 1:10</a>); wrath has come upon the opposing Jews (<a onClick="return mV(\'1Th\',2,16);">1Th 2:16</a>); but believers are not appointed unto wrath (<a onClick="return mV(\'1Th\',5,9);">1Th 5:9</a>). With all these specific passages in view, to say nothing of the general teaching of the apostle on the question of coming judgment and punishment, it is utterly impossible to eliminate the idea of the divine displeasure against sinners, and His consequent retributive action toward them. Even Ritschl, who absolutely denies the great principle of retribution, of positive displeasure, admits that Paul teaches it; hence, the only way for him out of the difficulty is to reject Paul\'s teaching as unauthoritative. Other references to the "wrath of God" are in <a onClick="return mV(\'Hbr\',3,11);">Heb 3:11</a>; <a onClick="return mV(\'Hbr\',4,3);">4:3</a>; and 6 passages in the Apocalypse—<a onClick="return mV(\'Rev\',6,16);">Re 6:16</a>f; <a onClick="return mV(\'Rev\',11,18);">11:18</a>; <a onClick="return mV(\'Rev\',14,10);">14:10</a>; <a onClick="return mV(\'Rev\',16,19);">16:19</a>; <a onClick="return mV(\'Rev\',19,15);">19:15</a>. Two of these refer to the "wrath of the Lamb," one of the most terrible phrases in the whole of the New Testament. Thumos is only used in the Apocalypse concerning God (<a onClick="return mV(\'Rev\',14,\'10-19\');">Re 14:10-19</a>; <a onClick="return mV(\'Rev\',15,\'1-7\');">15:1-7</a>; <a onClick="return mV(\'Rev\',16,\'1-19\');">16:1-19</a>; <a onClick="return mV(\'Rev\',19,15);">19:15</a>). In each case it refers to the manifestation, the blazing forth of the wrath; in the last two passages it is used in combination with orge, and is rendered "fierceness," the fierceness of His wrath.<P>7. Instances of Use of Greek Words for "Vengeance":<P>Ekdikeo, which means to avenge, is twice used of God (<a onClick="return mV(\'Rev\',6,10);">Re 6:10</a>; <a onClick="return mV(\'Rev\',19,2);">19:2</a>); and ekdikesis, "vengeance," 6 times <a onClick="return mV(\'Luk\',18,7);">Lu 18:7</a>ff; <a onClick="return mV(\'Rom\',12,19);">Ro 12:19</a>; <a onClick="return mV(\'2Th\',1,8);">2Th 1:8</a>; <a onClick="return mV(\'Hbr\',10,30);">Heb 10:30</a>). In the first two instances it is used by Jesus concerning the divine action; ekdikos, "avenger," occurs once in application to God (<a onClick="return mV(\'1Th\',4,6);">1Th 4:6</a>); dike, "judgment" or "vengeance" is twice used of God (<a onClick="return mV(\'2Th\',1,9);">2Th 1:9</a>; <a onClick="return mV(\'Jud\',1,7);">Jude 1:7</a>). The use of these terms shows that the punishment inflicted on sinful men is strictly punishment of the vindicatory sort, the vindication of outraged justice, the infliction of deserved penalty. Very significant is the passage in <a onClick="return mV(\'2Th\',1,6);">2Th 1:6</a>, "It is a righteous thing with God to recompense affliction to them that afflict you." There is no question of bettering the offender.<P>8. Words Meaning "Chastisement" Not Used of the Impenitent:<P>It is very remarkable that the terms in Greek which would carry the meaning of punishment for the good of the offender are never used in the New Testament of the infliction which comes upon the impenitent; these are paideia and paideuo, and they are frequently used of the "chastisement" of believers, but not of the impenitent. It is often claimed that the word kolasis used in <a onClick="return mV(\'Mat\',25,46);">Mt 25:46</a> carries the meaning of chastisement for the improvement of the offender, but although Aristotle, in comparing it with timoria, may seem to suggest that it is meant for the improvement of the offender (what he really says is that it is tou paschontos heneka, "on account of the one suffering it," "has the punished one in view," whereas timoria is tou poiountos, "on account of the one inflicting" "that he may be satisfied"), the usage even in classical Greek is predominantly against making the supposed distinction. Both words are used interchangeably by the leading classical authors, including Aristotle himself, and kolasis is continually employed where no thought of betterment can be in question, while all admit that in Hellenistic Greek the distinction is not maintained, and in any case timoria is also used of the punishment of the sinner (<a onClick="return mV(\'Hbr\',10,29);">Heb 10:29</a>).<P>9. Judgment Implies Retribution:<P>All the representations of the coming day of judgment tell of the fact of retribution, and Christ Himself distinctly asserts it. Apart from His great eschatological discourses, concerning which criticism still hesitates and stammers, we have the solemn close of the Sermon on the Mount, and the pregnant statement of <a onClick="return mV(\'Mat\',16,27);">Mt 16:27</a>, "The Son of man shall come in the glory of his Father with his angels; and then shall he render unto every man according to his deeds," and all the apostolic teaching upon the solemn theme is but the unfolding of the same great thought.<P>10. Moral Sense Demands Vindication of God\'s Righteousness:<P>The conception of God as a perfect moral governor demands that His righteousness shall be fully vindicated. Looking at the course of history as it unfolds itself before us, we cannot fail to be struck with the anomalies which are presented. Righteousness does not always triumph, goodness is often put to shame, wickedness appears to be profitable, and wicked men often prosper while good men are under a cloud. Sometimes signal divine interpositions proclaim that God is indeed on the side of righteousness, but too often it seems as if He were unmindful, and men are tempted to ask the old question, "How doth God know? And is there knowledge in the Most High?" (<a onClick="return mV(\'Psa\',73,11);">Ps 73:11</a>), while the righteous say in their distress, "Yahweh, how long shall the wicked, how long shall the wicked triumph?" (<a onClick="return mV(\'Psa\',94,3);">Ps 94:3</a>). The moral sense cries out for some divine vindication, and the Scriptures, in harmony with this feeling, indicate that the final judgment will bring such vindication.<P>11. Scripture Indicates Certainty of Vindication:<P>In the Old Testament it is frequently presented as the solution of the baffling problems which beset the ethical sphere, as for instance in that fine utterance of religious philosophy in <a onClick="return mV(\'Psa\',73,\'1-\');">Ps 73</a>; the Psalmist has before him all the puzzling elements of the problem; the prosperity, the insolent and aggressive prosperity of the wicked, the non-success, the oppression, the misery of the righteous; he is well-nigh overwhelmed by the contemplation, and nearly loses his footing on the eternal verities, until he carries the whole problem into the light of God\'s presence and revelation, and then he understands that the end will bring the true solution.<P>So too the somber ruminations of the Preacher upon the contradictions arid anomalies and mysteries of human life, "under the sun," close in the reflection which throws its searchlight upon all the blackness: "This is the end of the matter:...Fear God, and keep his commandments; for this is the whole duty of man. For God will bring every work into judgment, with every hidden thing, whether it be good, or whether it be evil" (<a onClick="return mV(\'Ecc\',12,13);">Ec 12:13</a>f). In the light of the same truth, the apostles labored, believing that when the Lord comes He "will both bring to light the hidden things of darkness, and make manifest the counsels of the hearts" (<a onClick="return mV(\'1Cr\',4,5);">1Co 4:5</a>). The more fully the subject is considered, the more we must feel that for the vindication of righteousness, the justification of the divine procedure, the rectification of wrongs, the explanation of mysteries, the reward and triumph of the righteous and the confession and punishment of the wicked, a great final, retributive judgment is Scriptural, reasonable, necessary.<P>LITERATURE.<P>See the articles on <a href="./study/isbe/search.html?string=PUNISHMENT,+EVERLASTING">PUNISHMENT, EVERLASTING</a>; <a href="./study/isbe/search.html?string=JUDGMENT">JUDGMENT</a>; <a href="./study/isbe/search.html?string=SHEOL">SHEOL</a>, etc., and the works cited there``110';
isbe[7403]='Reu`re\'-u, roo (re\'u, Rhagau): A son of Peleg, a descendant of Shem (<a onClick="return mV(\'Gen\',11,18);">Ge 11:18</a>ff; <a onClick="return mV(\'1Ch\',1,25);">1Ch 1:25</a>; <a onClick="return mV(\'Luk\',3,35);">Lu 3:35</a>).``1';
isbe[7404]='Reuben`roo\'-ben, ru\'-ben (re\'ubhen; Rhouben): The eldest son of Jacob, born to him by Leah in Paddan-aram (<a onClick="return mV(\'Gen\',29,32);">Ge 29:32</a>).<P>1. Jacob\'s Oldest Son:<P>This verse seems to suggest two derivations of the name. As it stands in Massoretic Text it means "behold a son"; but the reason given for so calling him is "The Lord hath looked upon my affliction," which in Hebrew is ra\'ah be\'onyi, literally, "He hath seen my affliction." Of his boyhood we have only the story of the mandrakes (<a onClick="return mV(\'Gen\',30,14);">Ge 30:14</a>). As the firstborn he should really have been leader among his father\'s sons. His birthright was forfeited by a deed of peculiar infamy (<a onClick="return mV(\'Gen\',35,22);">Ge 35:22</a>), and as far as we know his tribe never took the lead in Israel. It is named first, indeed, in <a onClick="return mV(\'Num\',1,5,20);">Nu 1:5,20</a>, but thereafter it falls to the fourth place, Judah taking the first (<a onClick="return mV(\'Num\',2,10);">Nu 2:10</a>, etc.). To Reuben\'s intervention Joseph owed his escape from the fate proposed by his other brethren (<a onClick="return mV(\'Gen\',37,29);">Ge 37:29</a>). Some have thought Reuben designed to set him free, from a desire to rehabilitate himself with his father. But there is no need to deny to Reuben certain noble and chivalrous qualities. Jacob seems to have appreciated these, and, perhaps, therefore all the more deeply lamented the lapse that spoiled his life (<a onClick="return mV(\'Gen\',49,3);">Ge 49:3</a>f). It was Reuben who felt that their perils and anxieties in Egypt were a fit recompense for the unbrotherly conduct (<a onClick="return mV(\'Gen\',42,22);">Ge 42:22</a>). To assure his father of Benjamin\'s safe return from Egypt, whither Joseph required him to be taken, Reuben was ready to pledge his own two sons (<a onClick="return mV(\'Gen\',42,37);">Ge 42:37</a>). Four sons born to him in Canaan went down with Reuben at the descent of Israel into Egypt (<a onClick="return mV(\'Gen\',46,8);">Ge 46:8</a>f).<P>The incidents recorded are regarded by a certain school of Old Testament scholars as the vague and fragmentary traditions of the tribe, wrought into the form of a biography of the supposed ancestor of the tribe. This interpretation raises more difficulties than it solves, and depends for coherence upon too many assumptions and conjectures. The narrative as it stands is quite intelligible and self-consistent. There is no good reason to doubt that, as far as it goes, it is an authentic record of the life of Jacob\'s son.<P>2. Tribal History:<P>At the first census in the wilderness Reuben numbered 46,500 men of war (<a onClick="return mV(\'Num\',1,21);">Nu 1:21</a>); at the second they had fallen to 43,730; see <a href="./study/isbe/search.html?string=NUMBERS">NUMBERS</a>. The standard of the camp of Reuben was on the south side of the tabernacle; and with him were Simeon and Gad; the total number of fighting men in this division being 151, 450. Targum Pseudo-Jonathan says that the standard was a deer, with the legend "Hear O Israel, the Lord thy God is one Lord." On the march this division took the second place (<a onClick="return mV(\'Num\',2,10);">Nu 2:10</a>). The prince of the tribe was Elizur ben Shedeur, whose oblation is described in <a onClick="return mV(\'Num\',7,30);">Nu 7:30</a>ff. The Reubenite among the spies was Shammua ben Zaccur (<a onClick="return mV(\'Num\',13,4);">13:4</a>). It is possible that the conspiracy against Moses, organized by the Reubenites Dathan and Abiram, with the assistance of Korah the Levite (<a onClick="return mV(\'Num\',16,\'1-\');">Nu 16</a>), was an attempt on the part of the tribe to assert its rights as representing the firstborn. It is significant that the children of Korah did not perish (<a onClick="return mV(\'Num\',26,11);">26:11</a>). May not the influence of this incident on Moses\' mind be traced in his "blessing," wishing for the continuance of the tribe, indeed, but not in great strength (<a onClick="return mV(\'Deu\',33,6);">De 33:6</a>)? This was a true forecast of the tribal history.<P>When the high plateau east of the Dead Sea and the Jordan fell into the hands of the Israelite invaders, these spacious pastoral uplands irresistibly attracted the great flock-masters of Reuben and Gad, two tribes destined to be neighbors during succeeding centuries. At their earnest request Moses allowed them their tribal possessions here subject to one condition, which they loyally accepted. They should not "sit here," and so discourage their brethren who went to war beyond the Jordan. They should provide for the security of their cattle, fortify cities to protect their little ones and their wives from the inhabitants of the land, and their men of war should go before the host in the campaign of conquest until the children of Israel should have inherited every man his inheritance (<a onClick="return mV(\'Num\',32,\'1-27\');">Nu 32:1-27</a>). Of the actual part they took in that warfare there is no record, but perhaps "the stone of Bohan the son of Reuben" (<a onClick="return mV(\'Jos\',15,6);">Jos 15:6</a>; <a onClick="return mV(\'Jos\',18,17);">18:17</a>) marked some memorable deed of valor by a member of the tribe. At the end of the campaign the men of Reuben, having earned the gratitude of the western tribes, enriched by their share of the spoils of the enemy, returned with honor to their new home. Along with their brethren of Gad they felt the dangers attaching to their position of isolation, cut off from the rest of their people by the great cleft of the Jordan valley. They reared therefore the massive altar of Ed in the valley, so that in the very throat of that instrument of severance there might be a perpetual witness to themselves and to their children of the essential unity of Israel. The western tribes misunderstood the action and, dreading religious schism, gathered in force to stamp it out. Explanations followed which were entirely satisfactory, and a threatening danger was averted (<a onClick="return mV(\'Jos\',22,\'1-\');">Jos 22</a>). But the instincts of the eastern tribes were right, as subsequent history was to prove. The Jordan valley was but one of many causes of sundering. The whole circumstances and conditions of life on the east differed widely from those on the west of the river, pastoral pursuits and life in the open being contrasted with agricultural and city life.<P>The land given by Moses to the tribe of Reuben reached from the Arnon, Wady el-Mojib, in the South, to the border of Gad in the north. In <a onClick="return mV(\'Num\',32,34);">Nu 32:34</a> cities of Gad are named which lay far South, Aroer being on the very lip of the Arnon; but these are probably to be taken as an enclave in the territory of Reuben. From <a onClick="return mV(\'Jos\',13,15);">Jos 13:15</a>ff it is clear that the northern border ran from some point north of the Dead Sea in a direction east-northeast, passing to the north of Heshbon. The Dead Sea formed the western boundary, and it marched with the desert on the east. No doubt many districts changed hands in the course of the history. At the invasion of Tiglath-pileser, e.g., we read that Aroer was in the hands of the Reubenites, "and eastward...even unto the entrance of the wilderness from the river Euphrates" (<a onClick="return mV(\'1Ch\',5,8);">1Ch 5:8</a>f). Bezer the city of refuge lay in Reuben\'s territory (<a onClick="return mV(\'Jos\',20,8);">Jos 20:8</a>, etc.). A general description of the country will be found under <a href="./study/isbe/search.html?string=MOAB">MOAB</a>; while the cities of Reuben are dealt with in separate articles.<P>Reuben and Gad, occupying contiguous districts, and even, as we have seen, to some extent overlapping, are closely associated in the history. Neither took part in the glorious struggle against Sisera (<a onClick="return mV(\'Jdg\',5,15);">Jud 5:15</a>). Already apparently the sundering influences were taking effect. They are not excepted, however, from "all the tribes of Israel" who sent contingents for the war against Benjamin (<a onClick="return mV(\'Jdg\',20,10);">Jud 20:10</a>; <a onClick="return mV(\'Jdg\',21,5);">21:5</a>), and the reference in <a onClick="return mV(\'Jdg\',5,15);">Jud 5:15</a> seems to show that Reuben might have done great things had he been disposed. The tribe therefore was still powerful, but perhaps absorbed by anxieties as to its relations with neighboring peoples. In guarding their numerous flocks against attack from the South, and sudden incursions from the desert, a warlike spirit and martial prowess were developed. They were "valiant men, men able to bear buckler and sword, and to shoot with bow, and skillful in war" (<a onClick="return mV(\'1Ch\',5,18);">1Ch 5:18</a>). They overwhelmed the Hagrites with Jetur and Naphish and Nodab, and greatly enriched themselves with the spoil. In recording the raid the Chronicler pays a compliment to their religious loyalty: "They cried to God in the battle, and he was entreated of them, because they put their trust in him" (<a onClick="return mV(\'1Ch\',5,19);">1Ch 5:19</a>). Along with Gad and Manasseh they sent a contingent of 120,000 men "with all manner of instruments of war for the battle,...men of war, that could order the battle array," men who "came with a perfect heart to Hebron, to make David king" (<a onClick="return mV(\'1Ch\',12,37);">1Ch 12:37</a>f). Among David\'s mighty men was Adina, "a chief of the Reubenites, and thirty with him" (<a onClick="return mV(\'1Ch\',11,42);">1Ch 11:42</a>). In the 40th year of David\'s reign overseers were set over the Reubenites "for every matter pertaining to God, and for the affairs of the king" (<a onClick="return mV(\'1Ch\',26,32);">1Ch 26:32</a>). Perhaps in spite of the help given to David the Reubenites had never quite got over their old loyalty to the house of Saul. At any rate, when disruption came they joined the Northern Kingdom (<a onClick="return mV(\'1Ki\',11,31);">1Ki 11:31</a>).<P>The subsequent history of the tribe is left in much obscurity. Exposed as they were to hostile influences of Moab and the East, and cut off from fellowship with their brethren in worship, in their isolation they probably found the descent into idolatry all too easy, and the once powerful tribe sank into comparative insignificance. Of the immediate causes of this decline we have no knowledge. Moab established its authority over the land that had belonged to Reuben; and Mesha, in his inscription (M S), while he speaks of Gad, does not think Reuben worthy of mention. They had probably become largely absorbed in the northern tribe. They are named as suffering in the invasion of Hazael during the reign of Jehu (<a onClick="return mV(\'2Ki\',10,32);">2Ki 10:32</a>f). That "they trespassed against the God of their fathers, and played the harlot after the gods of the peoples of the land" is given as the reason for the fate that befell them at the hands of Pul, king of Assyria, who carried them away, "and brought them unto Halah, and Habor, and Hara, and to the river of Gozan" (<a onClick="return mV(\'1Ch\',5,25);">1Ch 5:25</a>f).<P>The resemblance of Reuben\'s case to that of Simeon is striking, for Simeon also appears to have been practically absorbed in the tribe of Judah. The prestige that should have been Reuben\'s in virtue of his birthright is said to have passed to Joseph (<a onClick="return mV(\'1Ch\',5,1);">1Ch 5:1</a>). And the place of Reuben and Simeon in Israel is taken by the sons of Joseph, a fact referred to in the blessing of Jacob (<a onClick="return mV(\'Gen\',48,5);">Ge 48:5</a>).<P>Ezekiel finds a place for Reuben in his picture of restored Israel (<a onClick="return mV(\'Eze\',48,6);">48:6</A>). He appears also—in this case preceded by Judah only—in <a onClick="return mV(\'Rev\',7,5);">Re 7:5</a>.``54';
isbe[7405]='Reubenites`roo\'-ben-its (ha-re\'ubheni; demoi Rhouben): Members of the tribe of Reuben (<a onClick="return mV(\'Num\',26,7);">Nu 26:7</a>, etc.). Adina, one of David\'s mighty men, was a Reubenite (<a onClick="return mV(\'1Ch\',11,42);">1Ch 11:42</a>).``1';
isbe[7406]='Reuel`roo\'-el (re\'u\'el, "God is his friend"; the Septuagint Rhagouel):<P>(1) In the genealogical system Reuel is both a son of Esau by Basemath (<a onClick="return mV(\'Gen\',36,4,10,13,17);">Ge 36:4,10,13,17</a>; <a onClick="return mV(\'1Ch\',1,35,37);">1Ch 1:35,37</a>) and the father of the father-in-law of Moses, Hobab (<a onClick="return mV(\'Num\',10,29);">Nu 10:29</a>). In the account of the marriage of Zipporah to Moses (<a onClick="return mV(\'Exd\',2,\'16-21\');">Ex 2:16-21</a>) Jethro seems to be called Reuel (compare <a href="./study/isbe/search.html?string=HOBAB">HOBAB</a>). The various names of Jethro perplexed the Talmudists, too; some held that his real name was "Hobab," and that Reuel was his father. Reuel is probably a clan name (Gray, "Nu," ICC), and Hobab is a member of the clan ("son") of Reuel (<a onClick="return mV(\'Num\',10,29);">Nu 10:29</a>, the King James Version reads "Raguel").<P>(2) The father of Eliasaph, the prince of Gad (<a onClick="return mV(\'Num\',2,14);">Nu 2:14</a>), called (by some copyist\'s mistake) "Deuel" in <a onClick="return mV(\'Num\',1,14);">Nu 1:14</a>; <a onClick="return mV(\'Num\',7,42,47);">7:42,47</a>; <a onClick="return mV(\'Num\',10,20);">10:20</a>. The Septuagint has uniformly Rhagouel.<P>(3) A Benjamite (<a onClick="return mV(\'1Ch\',9,8);">1Ch 9:8</a>).``197';
isbe[7407]='Reumah`roo\'-ma (re\'umah): The concubine of Nahor (<a onClick="return mV(\'Gen\',22,24);">Ge 22:24</a>).``1';
isbe[7408]='Revelation of John`<b>I. TITLE AND GENERAL CHARACTER OF BOOK</b><P class="in15">1. Title<P class="in15">2. Uniqueness and Reality of Visions<P><b>II. CANONICITY AND AUTHORSHIP</b><P class="in15">1. Patristic Testimony<P class="in15">2. Testimony of Book Itself<P class="in15">3. Objections to Johannine Authorship—Relation to Fourth Gospel<P><b>III. DATE AND UNITY OF THE BOOK</b><P class="in15">1. Traditional Date under Domitian<P class="in15">2. The Nero-Theory<P class="in15">3. Composite Hypotheses—Babylonian Theory<P><b>IV. PLAN AND ANALYSIS OF THE BOOK</b><P class="in15">1. General Scope<P class="in15">2. Detailed Analysis<P><b>V. PRINCIPLES OF INTERPRETATION</b><P class="in15">1. General Scheme of Interpretation<P class="in15">2. The Newer Theories<P class="in15">3. The Book a True Prophecy<P><b>VI. THEOLOGY OF THE BOOK</b><P><b>LITERATURE</b><hr /><P>The last book of the New Testament. It professes to be the record of prophetic visions given by Jesus Christ to John, while the latter was a prisoner, "for the word of God and the testimony of Jesus" (<a onClick="return mV(\'Rev\',1,9);">Re 1:9</a>), in <a href="./study/isbe/search.html?string=PATMOS">PATMOS</a> (which see), a small rocky island in the Aegean, about 15 miles west of Ephesus. Its precursor in the Old Testament is the Book of Daniel, with the symbolic visions and mystical numbers of which it stands in close affinity. The peculiar form of the book, its relation to other "apocalyptic" writings, and to the Fourth Gospel, likewise attributed to John, the interpretation of its symbols, with disputed questions of its date, of worship, unity, relations to contemporary history, etc., have made it one of the most difficult books in the New Testament to explain satisfactorily.<P>I. Title and General Character of Book.<P>1. Title:<P>"Revelation" answers to apokalupsis, in <a onClick="return mV(\'Rev\',1,1);">Re 1:1</a>. The oldest form of the title would seem to be simply, "Apocalypse of John," the appended words "the divine" (theologos, i.e. "theologian") not being older than the 4th century (compare the title given to Gregory of Nazianzus, "Gregory theologian"). The book belongs to the class of works commonly named "apocalyptic," as containing visions and revelations of the future, frequently in symbolical form (e.g. the Book of Enoch, the Apocalypse of Bar, the Apocalypse of Ezr; see <a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</a>), but it is doubtful if the word here bears this technical sense. The tendency at present is to group the New Testament Apocalypse with these others, and attribute to it the same kind of origin as theirs, namely, in the unbridled play of religious fantasy, clothing itself in unreal visional form.<P>2. Uniqueness and Reality of Visions:<P>But there is a wide distinction. These other works are pseudonymous—fictitious; on the face of them products of imagination; betraying that this is their origin in their crude, confused, unedifying character. The Apocalypse bears on it the name of its author—an apostle of Jesus Christ (see below); claims to rest on real visions; rings with the accent of sincerity; is orderly, serious, sublime, purposeful, in its conceptions; deals with the most solemn and momentous of themes. On the modern Nerotheory, to which most recent expositors give adherence, it is a farrago of baseless fantasies, no one of which came true. On its own claim it is a product of true prophecy (<a onClick="return mV(\'Rev\',1,3);">Re 1:3</a>; <a onClick="return mV(\'Rev\',22,18);">22:18</a>f), and has or will have sure fulfillment. Parallels here and there are sought between it and the Book of Enoch or the Apocalypse of Ezra. As a rule the resemblances arise from the fact that these works draw from the same store of the ideas and imagery of the Old Testament. It is there the key is chiefly to be sought to the symbolism of John. The Apocalypse is steeped in the thoughts, the images, even the language of the Old Testament (compare the illustrations in Lightfoot, Galatians, 361,where it is remarked: "The whole book is saturated with illustrations from the Old Testament. It speaks not the language of Paul, but of Isaiah and Ezekiel and Daniel"). These remarks will receive elucidation in what follows.<P>II. Canonicity and Authority.<P>1. Patristic Testimony:<P>The two questions of canonicity and authorship are closely connected. Eusebius states that opinion in his day was divided on the book, and he himself wavers between placing it among the disputed books or ranking it with the acknowledged (homologoumena). "Among these," he says, "if such a view seem correct, we must place the Apocalypse of John" (Historia Ecclesiastica, III, 25). That it was rightly so placed appears from a survey of the evidence. The first to refer to the book expressly is Justin Martyr (circa 140 AD), who speaks of it as the work of "a certain man, whose name was John, one of the apostles of Christ" (Dial, 81). Irenaeus (circa 180 AD) repeatedly and decisively declares that the Apocalypse was written by John, a disciple of the Lord (Adv. Haer., iv.20, 11; 30, 4; v.26, 1; 35,2,etc.), and comments on the number 666 (v.30, 1). In his case there can be no doubt that the apostle John is meant. Andreas of Cappadocia (5th century) in a Commentary on the Apocalypse states that Papias (circa 130 AD) bore witness to its credibility, and cites a comment by him on <a onClick="return mV(\'Rev\',12,\'7-9\');">Re 12:7-9</a>. The book is quoted in the Epistle on the martyrs of Vienne and Lyons (177 AD); had a commentary written on it by Melito of Sardis (circa 170 AD), one of the churches of the Apocalypse (Euseb., HE, IV, 26); was used by Theophilus of Antioch (circa 168 AD) and by Apollonius (circa 210 AD; HE, V, 25)—in these cases being cited as the Apocalypse of John. It is included as John\'s in the Canon of Muratori (circa 200 AD). The Johannine authorship (apostolic) is abundantly attested by Tertullian (circa 200 AD; Adv. Mar., iii.14,24,etc.); by Hippolytus (circa 240 AD), who wrote a work upon it; by Clement of Alexandria (circa 200 AD); by Origen (circa 230 AD), and other writers. Doubt about the authorship of the book is first heard of in the obscure sect of the Alogi (end of the 2nd century), who, with Caius, a Roman presbyter (circa 205 AD), attributed it to Cerinthus. More serious was the criticism of Dionysius of Alexandria (circa 250 AD), who, on internal grounds, held that the Fourth Gospel and the Apocalypse could not have come from the same pen (Euseb., HE, VII, 25). He granted, however, that it was the work of a holy and inspired man—another John. The result was that, while "in the Western church," as Bousset grants, "the Apocalypse was accepted unanimously from the first" (EB, I, 193), a certain doubt attached to it for a time in sections of the Greek and Syrian churches. It is not found in the Peshitta, and a citation from it in Ephraim the Syrian (circa 373) seems not to be genuine. Cyril of Jerusalem (circa 386 AD) omits it from his list, and it is unmentioned by the Antiochian writers (Chrysostom, Theodore of Mopsuestia, Theodoret). The Canon attributed to the Council of Laodicea (circa 360 AD) does not name it, but it is doubtful whether this document is not of later date (compare Westcott; also Bousset, Die Offenb. Joh., 28). On the other hand, the book is acknowledged by Methodius, Pamphilus, Athanasius, Gregory of Nyssa, Cyril Alex., Epiphanius, etc.<P>2. Testimony of Book Itself:<P>The testimony to the canonicity, and also to the Johannine authorship, of the Apocalypse is thus exceptionally strong. In full accordance with it is the claim of the book itself. It proclaims itself to be the work of John (<a onClick="return mV(\'Rev\',1,1,4,9);">Re 1:1,4,9</a>; <a onClick="return mV(\'Rev\',22,8);">22:8</a>), who does not, indeed, name himself an apostle, yet, in his inspired character, position of authority in the Asian churches, and selection as the medium of these revelations, can hardly be thought of as other than the well-known John of the Gospels and of consentient church tradition. The alternative view, first suggested as a possibility by Eusebius, now largely favored by modern writers, is that the John intended is the "presbyter John" of a well-known passage cited by Eusebius from Papias (Historia Ecclesiastica, III, 39). Without entering into the intricate questions connected with this "presbyter John"—whether he was really a distinct person from the apostle (Zahn and others dispute it), or whether, if he was, he resided at Ephesus (see <a href="./study/isbe/search.html?string=JOHN,+GOSPEL+OF">JOHN, GOSPEL OF</a>)—it is enough here to say that the reason already given, viz: the importance and place of authority of the author of the Apocalypse in the Asian churches, and the emphatic testimony above cited connecting him with the apostle, forbid the attribution of the book to a writer wholly unknown to church tradition, save for this casual reference to him in Papias. Had the assumed presbyter really been the author, he could not have dropped so completely out of the knowledge of the church, and had his place taken all but immediately by the apostle.<P>3. Objections to Johannine Authorship—Relation to Fourth Gospel:<P>One cause of the hesitancy regarding the Apocalypse in early circles was dislike of its millenarianism; but the chief reason, set forth with much critical skill by Dionysius of Alexandria (Euseb., HE, VII, 25), was the undoubted contrast in character and style between this work and the Fourth Gospel, likewise claiming to be from the pen of John. Two works so diverse in character—the Gospel calm, spiritual, mystical, abounding in characteristic expressions as "life," "light," "love," etc., written in idiomatic Greek; the Apocalypse abrupt, mysterious, material in its imagery, inexact and barbarous in its idioms, sometimes employing solecisms—could not, it was argued, proceed from the same author. Not much, beyond amplification of detail, has been added to the force of the arguments of Dionysius. There were three possibilities—either first, admitting the Johannine authorship of the Apocalypse, to assail the genuineness of the Gospel—this was the method of the school of Baur; or, second, accepting the Gospel, to seek a different author for the Apocalypse—John the presbyter, or another: thus not a few reverent scholars (Bleek, Neander, etc.); or, third, with most moderns, to deny the Johannine authorship of both Gospel and Apocalypse, with a leaning to the "presbyter" as the author of the latter (Harnack, Bousset, Moffatt, etc.). Singularly there has been of late in the advanced school itself a movement in the direction of recognizing that this difficulty of style is less formidable than it looks—that, in fact, beneath the surface difference, there is a strong body of resemblances pointing to a close relationship of Gospel and Apocalypse. This had long been argued by the older writers (Godet, Luthardt, Alford, Salmon, etc.), but it is now more freely acknowledged. As instances among many may be noted the use of the term "Logos" (<a onClick="return mV(\'Rev\',19,13);">Re 19:13</a>), the image of the "Lamb," figures like "water of life" words and phrases as "true," "he that overcometh," "keep the commandments," etc. A striking coincidence is the form of quotation of <a onClick="return mV(\'Zec\',12,10);">Zec 12:10</a> in <a onClick="return mV(\'Jhn\',19,37);">Joh 19:37</a> and <a onClick="return mV(\'Rev\',1,7);">Re 1:7</a>. If the Greek in parts shows a certain abruptness and roughness, it is plainly evidenced by the use of the correct constructions in other passages that this is not due to want of knowledge of the language. "The very rules which he breaks in one place he observes in others" (Salmon). There are, besides, subtle affinities in the Greek usage of the two books, and some of the very irregularities complained of are found in the Gospel (for ample details consult Bousset, op. cit.; Godet, Commentary on John, I, 267-70, English translation; Alford, Greek Test., IV, 224-28; Salmon, Introduction to the New Testament, 233-43, 2nd edition; the last-named writer says: "I have produced instances enough to establish decisively that there is the closest possible affinity between the Revelation and the other Johannine books"). Great differences in character and style no doubt still remain. Some, to leave room for these, favor an early date for the Apocalypse (68-69 BC; on this below); the trend of opinion, however, now seems, as will be shown, to be moving back to the traditional date in the reign of Domitian, in which case the Gospel will be the earlier, and the Apocalypse the later work. This, likewise, seems to yield the better explanation. The tremendous experiences of Patmos, bursting through all ordinary and calmer states of consciousness, must have produced startling changes in thought and style of composition. The "rapt seer" will not speak and write like the selfcollected, calmly brooding evangelist.<P>III. Date and Unity of the Book.<P>1. Traditional Date under Domitian:<P>Eusebius, in summing up the tradition of the Church on this subject, assigns John\'s exile to Patmos, and consequently the composition of the Apocalypse, to the latter part of the reign of Domitian (81-96 AD). Irenaeus (circa 180 AD) says of the book, "For it was seen, not a long time ago, but almost in our own generation, at the end of the reign of Domitian" (Adv. Haer., v.30, 3). This testimony is confirmed by Clement of Alexandria (who speaks of "the tyrant"), Origen, and later writers. Epiphanius (4th century), indeed, puts (Haer., li.12, 233) the exile to Patmos in the reign of Claudius (41-54 AD); but as, in the same sentence, he speaks of the apostle as 90 years of age, it is plain there is a strange blunder in the name of the emperor. The former date answers to the conditions of the book (decadence of the churches; widespread and severe persecution), and to the predilection of Domitian for this mode of banishment (compare Tacitus, History i.2; Eusebius, Historia Ecclesiastica, III, 18).<P>2. The Nero-Theory:<P>This, accordingly, may be regarded as the traditional date of composition of the Apocalypse, though good writers, influenced partly by the desire to give time for the later composition of the Gospel, have signified a preference for an earlier date (e.g. Westcott, Salmon). It is by no means to be assumed, however, that the Apocalypse is the earlier production. The tendency of recent criticism, it will be seen immediately, is to revert to the traditional date (Bousset, etc.); but for a decade or two, through the prevalence of what may be called the "Nero-theory" of the book, the pendulum swung strongly in favor of its composition shortly after the death of Nero, and before the destruction of Jerusalem (held to be shown to be still standing by <a onClick="return mV(\'Rev\',11,\'1-\');">Re 11</a>), i.e. about 68-69 AD. This date was even held to be demonstrated beyond all question. Reuss may be taken as an example. According to him (Christian Theology of the Apostolic Age, I, 369ff, English translation), apart from the ridiculous preconceptions of theologians, the Apocalypse is "the most simple, most transparent book that prophet ever penned." "There is no other apostolical writing the chronology of which can be more exactly fixed." "It was written before the destruction of Jerusalem, under the emperor Galba—that is to say, in the second half of the year 68 of our era." He proceeds to discuss "the irrefutable proofs" of this. The proof, in brief, is found in the beast (not introduced till <a onClick="return mV(\'Rev\',13,\'1-\');">Re 13</a>) with seven heads, one of which has been mortally wounded, but is for the present healed (<a onClick="return mV(\'Rev\',13,3);">Re 13:3</a>). "This is the Roman empire, with its first 7 emperors, one of whom is killed, but is to live again as Antichrist" (compare <a onClick="return mV(\'Rev\',17,10);">Re 17:10</a>f). The key to the whole book is said to be given in <a onClick="return mV(\'Rev\',13,18);">Re 13:18</a>, where the number of the beast is declared to be 666. Applying the method of numerical values (the Jewish Gematria), this number is found to correspond with the name "Nero Caesar" in Hebrew letters (omitting the yodh, the Hebrew letter "y"). Nero then is the 5th head that is to live again; an interpretation confirmed by rumors prevalent at that time that Nero was not really dead, but only hidden, and was soon to return to claim his throne. As if to make assurance doubly sure, it is found that by dropping the final "n" in "Neron," the number becomes 616—a number which Irenaeus in his comments on the subject (v.30,1) tells us was actually found in some ancient copies. The meaning therefore is thought to be clear. Writing under the emperor Galba, the 6th emperor (reckoning from Augustus), the author anticipates, after a short reign of a 7th emperor (<a onClick="return mV(\'Rev\',17,10);">Re 17:10</a>), the return of the Antichrist Nero—an 8th, but of the 7, with whom is to come the end. Jerusalem is to be miraculously preserved (<a onClick="return mV(\'Rev\',11,\'1-\');">Re 11</a>), but Rome is to perish. This is to happen within the space of 3 1/2 years. "The final catastrophe, which was to destroy the city and empire, was to take place in three years and a half....The writer knows...that Rome will in three years and a half perish finally, never to rise again." It does not matter for this theory that not one of the things predicted happened—that every anticipation was falsified. Nero did not return; Jerusalem was not saved; Rome did not perish; 3 1/2 years did not see the end of all things. Yet the Christian-church, though the failure of every one of these predictions had been decisively demonstrated, received the book as of divine inspiration, apparently without the least idea that such things had been intended (see the form of theory in Renan, with a keen criticism in Salmon\'s Introduction to the New Testament, lecture xiv).<P>3. Composite Hypotheses—Babylonian Theory:<P>What is to be said with reference to this "Nero-theory" belongs to subsequent sections: meanwhile it is to be observed that, while portions of theory are retained, significant changes have since taken place in the view entertained of the book as a whole, and with this of the date to be assigned to it. First, after 1882, came a flood of disintegrating hypotheses, based on the idea that the Apocalypse was not a unity, but was either a working up of one or more Jewish apocalypses by Christian hands, or at least incorporated fragments of such apocalypses (Uslter, Vischer, Weizsacker, Weyland, Pfieiderer, Spitta, etc.). Harnack lent his influential support to the form of this theory advocated by Vischer, and for a time the idea had vogue. Very soon, however, it fell into discredit through its own excesses (for details on the different views, see Bousset, or Moffatt\'s Introduction to the New Testament, 489ff), and through increasing appreciation of the internal evidence for the unity of the book. Gunkel, in his Schopfung und Chaos (1895), started another line of criticism in his derivation of the conceptions of the book, not from Jewish apocalypse, but from Babylonian mythology. He assailed with sharp criticism the "contemporary history" school of interpretation (the "Nero-theory" above), and declared its "bankruptcy." The number of the beast, with him, found its solution, not in Nero, but in the Hebrew name for the primeval chaos. This theory, too, has failed in general acceptance, though elements in it are adopted by most recent interpreters. The modified view most in favor now is that the Apocalypse is, indeed, the work of a Christian writer of the end of the 1st century, but embodies certain sections borrowed from Jewish apocalypse (as <a onClick="return mV(\'Rev\',7,\'1-8\');">Re 7:1-8</a>, the 144,000; <a onClick="return mV(\'Rev\',11,\'1-\');">Re 11</a>, measuring of the temple and the two witnesses; especially <a onClick="return mV(\'Rev\',12,\'1-\');">Re 12</a>, the woman and red dragon—this, in turn, reminiscent of Babylonian mythology). These supposed Jewish sections are, however, without real support in anything that is known, and the symbolism admits as easily of a Christian interpretation as any other part of the book. We are left, therefore, as before, with the book as a unity, and the tide of opinion flows back to the age of Domitian as the time of its origin. Moffatt (connecting it mistakenly, as it seems to us, with Domitian\'s emphasis on the imperial cult, but giving also other reasons) goes so far as to say that "any earlier date for the book is hardly possible" (Expository Greek Testament, V, 317). The list of authorities for the Domitianie date may be seen in Moffatt, Introduction, 508.<P>IV. Plan and Analysis of the Book.<P>1. General Scope:<P>The method of the book may thus be indicated. After an introduction, and letters to the seven churches (<a onClick="return mV(\'Rev\',1,\'1-\');">Re 1-3</a>), the properly prophetic part of the book commences with a vision of heaven (<a onClick="return mV(\'Rev\',4,\'1-\');">Re 4</a>; <a onClick="return mV(\'Rev\',5,\'1-\');">5</a>), following upon which are two series of visions of the future, parallel, it would appear, to each other—the first, the 7 seals, and under the 7th seal, the 7 trumpets (<a onClick="return mV(\'Rev\',6,\'1-\');">Re 6:1-11:19</a>, with interludes in <a onClick="return mV(\'Rev\',7,\'1-\');">Re 7</a> and again in <a onClick="return mV(\'Rev\',10,\'1-\');">Re 10</a>; <a onClick="return mV(\'Rev\',11,\'1-\');">11:1</a>-<a onClick="return mV(\'Rev\',12,1);">12:1</a>); the second, the woman and her child (<a onClick="return mV(\'Rev\',12,\'1-\');">Re 12</a>), the 2 beasts (<a onClick="return mV(\'Rev\',13,\'1-\');">Re 13</a>), and, after new interludes (<a onClick="return mV(\'Rev\',14,\'1-\');">Re 14</a>), the bowls and 7 last plagues (<a onClick="return mV(\'Rev\',15,\'1-\');">Re 15</a>; <a onClick="return mV(\'Rev\',16,\'1-\');">16</a>). The expansion of the last judgments is given in separate pictures (the scarlet woman, doom of Babylon, Har-Magedon, <a onClick="return mV(\'Rev\',17,1);">Re 17-19</a>); then come the closing scenes of the millennium, the last apostasy, resurrection and judgment (<a onClick="return mV(\'Rev\',20,\'1-\');">Re 20</a>), followed by the new heavens and new earth, with the descending new Jerusalem (<a onClick="return mV(\'Rev\',21,\'1-\');">Re 21</a>; <a onClick="return mV(\'Rev\',22,1);">22</a>). The theme of the book is the conflict of Christ and His church with anti-Christian powers (the devil, the beast, the false prophet, <a onClick="return mV(\'Rev\',16,13);">Re 16:13</a>), and the ultimate and decisive defeat of the latter; its keynote is in the words, "Come, Lord Jesus" (<a onClick="return mV(\'Rev\',22,20);">Re 22:20</a>; compare <a onClick="return mV(\'Rev\',1,7);">Re 1:7</a>); but it is to be noticed, as characteristic of the book, that while this "coming" is represented as, in manner, ever near, the end, as the crisis approaches, is again always postponed by a fresh development of events. Thus, under the 6th seal, the end seems reached (<a onClick="return mV(\'Rev\',6,\'12-17\');">Re 6:12-17</a>), but a pause ensues (<a onClick="return mV(\'Rev\',7,\'1-\');">Re 7</a>), and on the opening of the seventh seal, a new series begins with the trumpets (<a onClick="return mV(\'Rev\',8,2);">Re 8:2</a>). Similarly, at the sounding of the 6th trumpet, the end seems at hand (<a onClick="return mV(\'Rev\',9,\'12-21\');">Re 9:12-21</a>), but a new pause is introduced before the last sounding takes place (<a onClick="return mV(\'Rev\',11,15);">Re 11:15</a>). Then is announced the final victory, but as yet only in summary. A new series of visions begins, opening into large perspectives, till, after fresh interludes, and the pouring out of 6 of the bowls of judgment, Har-Magedon itself is reached; but though, at the outpouring of the 7th bowl, it is proclaimed, "It is done" (<a onClick="return mV(\'Rev\',16,17);">Re 16:17</a>), the end is again held over till these final judgments are shown in detail. At length, surely, in <a onClick="return mV(\'Rev\',19,\'1-\');">Re 19</a>, with the appearance of the white horseman—"The Word of God" (<a onClick="return mV(\'Rev\',19,13);">19:13</A>)—and the decisive overthrow of all his adversaries (<a onClick="return mV(\'Rev\',19,\'18-21\');">19:18-21</A>), the climax is touched; but just then, to our surprise, intervenes the announcement of the binding of Satan for 1,000 years, and the reign of Jesus and His saints upon the earth (the interpretation is not here discussed), followed by a fresh apostasy, and the general resurrection and judgment (<a onClick="return mV(\'Rev\',20,\'1-\');">Re 20</a>). Precise time-measures evidently fail in dealing with a book so constructed: the 3 1/2 years of the Nero-interpreters sink into insignificance in its crowded panorama of events. The symbolic numbers that chiefly rule in the book are "seven," the number of completeness (7 spirits, seals, trumpets, bowls, heads of beasts); "ten," the number of worldly power (10 horns); "four," the earthly number (4 living creatures, corners of earth, winds, etc.); 3 1/2 years—42 months—"time, and times, and half a time" (<a onClick="return mV(\'Rev\',12,14);">Re 12:14</a>) = 1,260 days, the period, borrowed from Daniel (<a onClick="return mV(\'Dan\',7,25);">7:25</A>; <a onClick="return mV(\'Dan\',12,7);">12:7</A>), of anti-Christian ascendancy.<P>2. Detailed Analysis:<P>The following is a more detailed analysis:<P><b>I. INTRODUCTION</b><P class="in15">1. Title and Address (<a onClick="return mV(\'Rev\',1,\'1-8\');">Re 1:1-8</a>)<P class="in15">2. Vision of Jesus and Message to the Seven Churches of the Province of Asia (<a onClick="return mV(\'Rev\',1,\'9-20\');">Re 1:9-20</a>)v3. The Letters to the Seven Churches (<a onClick="return mV(\'Rev\',2,\'1-\');">Re 2</a>; <a onClick="return mV(\'Rev\',3,\'1-\');">3</a>)<P class="in30">(1) Ephesus (<a onClick="return mV(\'Rev\',2,\'1-7\');">Re 2:1-7</a>)<P class="in30">(2) Smyrna (<a onClick="return mV(\'Rev\',2,\'8-11\');">Re 2:8-11</a>)<P class="in30">(3) Pergamos (<a onClick="return mV(\'Rev\',2,\'12-17\');">Re 2:12-17</a>)<P class="in30">(4) Thyatira (<a onClick="return mV(\'Rev\',2,\'18-29\');">Re 2:18-29</a>)<P class="in30">(5) Sardis (<a onClick="return mV(\'Rev\',3,\'1-6\');">Re 3:1-6</a>)<P class="in30">(6) Philadelphia (<a onClick="return mV(\'Rev\',3,\'7-13\');">Re 3:7-13</a>)<P class="in30">(7) Laodicea (<a onClick="return mV(\'Rev\',3,\'14-22\');">Re 3:14-22</a>)<P><b>II. THE THINGS TO COME. FIRST SERIES OF VISIONS: THE SEALS AND TRUMPETS</b><P class="in15">1. The Vision of Heaven<P class="in30">(1) Adoration of the Creator (<a onClick="return mV(\'Rev\',4,\'1-\');">Re 4</a>)<P class="in30">(2) The 7-Sealed Book; Adoration of God and the Lamb (<a onClick="return mV(\'Rev\',5,\'1-\');">Re 5</a>)<P class="in15">2. Opening of Six Seals (<a onClick="return mV(\'Rev\',6,\'1-\');">Re 6</a>)<P class="in30">(1) The White Horse (<a onClick="return mV(\'Rev\',6,1,2);">Re 6:1,2</a>)<P class="in30">(2) The Red Horse (<a onClick="return mV(\'Rev\',6,3,4);">Re 6:3,4</a>)<P class="in30">(3) The Black Horse (<a onClick="return mV(\'Rev\',6,5,6);">Re 6:5,6</a>)<P class="in30">(4) The Pale Horse (<a onClick="return mV(\'Rev\',6,7,8);">Re 6:7,8</a>)<P class="in30">(5) Souls under the Altar (<a onClick="return mV(\'Rev\',6,\'9-11\');">Re 6:9-11</a>)<P class="in30">(6) The Wrath of the Lamb (<a onClick="return mV(\'Rev\',6,\'12-17\');">Re 6:12-17</a>)<P class="in15">3. Interludes (<a onClick="return mV(\'Rev\',7,\'1-\');">Re 7</a>)<P class="in30">(1) Sealing of 144,000 on Earth (<a onClick="return mV(\'Rev\',7,\'1-8\');">Re 7:1-8</a>)<P class="in30">(2) Triumphant Multitude in Heaven (<a onClick="return mV(\'Rev\',7,\'9-17\');">Re 7:9-17</a>)<P class="in15">4. Opening of Seventh Seal: under This Seven Trumpets, of Which Six Now Sounded (<a onClick="return mV(\'Rev\',8,\'1)-\';">Re 8</a>; <a onClick="return mV(\'Rev\',9,\'1-\');">9</a>)<P class="in30">(1) Hail and Fire on Earth (<a onClick="return mV(\'Rev\',8,7);">Re 8:7</a>)<P class="in30">(2) Burning Mountain in Sea (<a onClick="return mV(\'Rev\',8,8,9);">Re 8:8,9</a>)<P class="in30">(3) Burning Star on Rivers and Fountains (<a onClick="return mV(\'Rev\',8,10,11);">Re 8:10,11</a>)<P class="in30">(4) One-third Sun, Moon, and Stars Darkened (<a onClick="return mV(\'Rev\',8,12);">Re 8:12</a>). "Woe"—Trumpets (<a onClick="return mV(\'Rev\',8,13);">Re 8:13</a>)<P class="in30">(5) The Fallen Star-Locusts (<a onClick="return mV(\'Rev\',9,\'1-11\');">Re 9:1-11</a>)<P class="in30">(6) Angels Loosed from Euphrates—the Horseman (<a onClick="return mV(\'Rev\',9,\'12-21\');">Re 9:12-21</a>)<P class="in15">5. Interludes—<P class="in30">(1) Angel with Little Book (<a onClick="return mV(\'Rev\',10,\'1-\');">Re 10</a>)<P class="in30">(2) Measuring of Temple and Altar—the Two Witnesses (<a onClick="return mV(\'Rev\',11,\'1-13\');">Re 11:1-13</a>)<P class="in15">6. Seventh Trumpet Sounded—Final Victory (<a onClick="return mV(\'Rev\',11,\'14-19\');">Re 11:14-19</a>)<P><b>III. SECOND SERIES OF VISIONS: THE WOMAN AND THE RED DRAGON; THE TWO BEASTS; THE BOWLS AND LAST PLAGUES</b><P class="in15">1. The Woman and Child; the Red Dragon and His Persecutions (<a onClick="return mV(\'Rev\',12,\'1-\');">Re 12</a>)<P class="in15">2. The Beast from the Sea, Seven-headed, Ten-horned (<a onClick="return mV(\'Rev\',13,\'1-10\');">Re 13:1-10</a>); the Two-horned Beast (<a onClick="return mV(\'Rev\',13,\'11-18\');">Re 13:11-18</a>)<P class="in15">3. Interludes (<a onClick="return mV(\'Rev\',14,1);">Re 14</a>)<P class="in30">(1) The Lamb on Mt. Zion; the 144,000 (<a onClick="return mV(\'Rev\',14,\'1-5\');">Re 14:1-5</a>)<P class="in30">(2) The Angel with "an Eternal Gospel" (<a onClick="return mV(\'Rev\',14,6,7);">Re 14:6,7</a>)<P class="in30">(3) Second Angel—(Anticipatory) Proclamation of Fall of Babylon (<a onClick="return mV(\'Rev\',14,8);">Re 14:8</a>)<P class="in30">(4) Third Angel—Doom of Worshippers of the Beast (<a onClick="return mV(\'Rev\',14,\'9-12\');">Re 14:9-12</a>)<P class="in30">(5) Blessedness of the Dead in the Lord (<a onClick="return mV(\'Rev\',14,13);">Re 14:13</a>)<P class="in30">(6) The Son of Man and the Great Vintage (<a onClick="return mV(\'Rev\',14,\'14-20\');">Re 14:14-20</a>)<P class="in15">4. The Seven Last Plagues—the Angels and Their Bowls: the Preparation in heaven (<a onClick="return mV(\'Rev\',15,\'1-\');">Re 15</a>)—the Outpouring (<a onClick="return mV(\'Rev\',16,\'1-\');">Re 16</a>)<P class="in30">(1) On Earth (<a onClick="return mV(\'Rev\',16,2);">Re 16:2</a>)<P class="in30">(2) On Sea (<a onClick="return mV(\'Rev\',16,3);">Re 16:3</a>)<P class="in30">(3) On Rivers and Fountains (<a onClick="return mV(\'Rev\',16,\'4-7\');">Re 16:4-7</a>)<P class="in30">(4) On Sun (<a onClick="return mV(\'Rev\',16,8,9);">Re 16:8,9</a>)<P class="in30">(5) On Seat of Beast (<a onClick="return mV(\'Rev\',16,10),11;">Re 16:10,11</a>)<P class="in30">(6) On Euphrates—Har-Magedon (<a onClick="return mV(\'Rev\',16,\'12-16\');">Re 16:12-16</a>)<P class="in30">(7) In the Air—Victory and Fall of Babylon (<a onClick="return mV(\'Rev\',16,\'17-21\');">Re 16:17-21</a>)<P><b>IV. EXPANSION OF LAST JUDGMENTS</b> (<a onClick="return mV(\'Rev\',17,\'1-\');">Re 17-19</a>)<P class="in15">1. The Scarlet Woman on Beast—Her Judgment (<a onClick="return mV(\'Rev\',17,\'1-\');">Re 17</a>)<P class="in15">2. Doom of Babylon and Lament over Her (<a onClick="return mV(\'Rev\',18,\'1-\');">Re 18</a>)<P class="in15">3. Interlude—Announcement of Marriage of the Lamb (<a onClick="return mV(\'Rev\',19,\'1-10\');">Re 19:1-10</a>)<P class="in15">4. Rider on White Horse ("The Word of God") and His Armies—Last Battle and Doom of Beast, False Prophet, and Their Followers (<a onClick="return mV(\'Rev\',19,\'11-21\');">Re 19:11-21</a>)<P><b>V. THE MILLENNIUM—NEW HEAVENS AND NEW EARTH</b> (<a onClick="return mV(\'Rev\',20,\'1-\');">Re 20</a>, <a onClick="return mV(\'Rev\',21,\'1-\');">21; <a onClick="return mV(\'Rev\',22,\'1-\');">22</a>)<P class="in15">1. Satan Bound; First Resurrection and Reign of Saints for 1,000 Years (<a onClick="return mV(\'Rev\',20,\'1-6\');">Re 20:1-6</a>)<P class="in15">2. Loosing of Satan and Final Conflict—Doom of Adversaries and of the Devil (<a onClick="return mV(\'Rev\',20,\'7-10\');">Re 20:7-10</a>)<P class="in15">3. General Resurrection and Last Judgment (<a onClick="return mV(\'Rev\',20,\'11-15\');">Re 20:11-15</a>)<P class="in15">4. New Heavens and New Earth<P class="in30">(1) The New Jerusalem from Heaven (<a onClick="return mV(\'Rev\',21,\'1-9\');">Re 21:1-9</a>)<P class="in30">(2) Description of the City (<a onClick="return mV(\'Rev\',21,\'10-27\');">Re 21:10-27</a>)<P class="in30">(3) Blessedness of Its Citizens (<a onClick="return mV(\'Rev\',22,\'1-7\');">Re 22:1-7</a>)<P class="in30">(4) Epilogue (<a onClick="return mV(\'Rev\',22,\'8-21\');">Re 22:8-21</a>)<hr /><P>V. Principles of Interpretation.<P>1. General Scheme of Interpretation:<P>As a book intended for the consolation of the church under present and future afflictions, the Apocalypse is meant by its author to be understood (<a onClick="return mV(\'Rev\',1,3);">Re 1:3</a>; <a onClick="return mV(\'Rev\',22,7);">22:7</a>). He must have been aware, however, that, while its general scope might be apprehended, mystery must rest upon many of its symbols, till the time of their actual fulfillment. The book relates to "things which must shortly come to pass" (<a onClick="return mV(\'Rev\',1,1);">Re 1:1</a>)—in their beginnings at least—and the divers interpretations since put upon its prophecies are the best evidence of the difficulties attaching to them. Schemes of interpretation have generally been grouped into praeterist (the prophecies being regarded as already fulfilled), futurist (the fulfillment being thrown wholly into the future), and the historical (the fulfillment being looked for in the continuous history of the church from John\'s day till the end).<P>(1) The older praeterist view may be taken as represented by Moses Stuart, who finds the fulfillment of <a onClick="return mV(\'Rev\',6,\'1-\');">Re 6-11</a> in the destruction of Jerusalem (Commentary, 520ff), and of <a onClick="return mV(\'Rev\',13,\'1-\');">Re 13-19</a> in the reign of Nero (690ff). Even he, however, has to interpret the chapter on the last things of the future.<P>(2) The futurist view connects the whole with the times of the second advent and the millennium. The beast is an individual who shall then appear as Antichrist. This rejects the plain intimations of the book that the events predicted lay, in their beginnings at least, immediately in the future of the writer.<P>(3) The historical view connects the various symbols with definite occurrences—as the invasions which overthrew the Roman Empire (the first 4 trumpets), the Saracens (first woe-trumpet), the Turks (second woe-trumpet), the papacy (the beast, <a onClick="return mV(\'Rev\',13,\'1-\');">Re 13</a>; the scarlet woman, <a onClick="return mV(\'Rev\',17,\'1-\');">Re 17</a>), etc. A day-year principle is applied to the periods (1,260 days—1,260 years). As representatives of this view may be mentioned Mode, Vitringa, Sir Isaac Newton, Elliott in Horae Apocalypticae, A. Barnes.<P>2. The Newer Theories:<P>These older schemes are largely put out of date by the newer theories, already alluded to, in which the Apocalypse is explained out of contemporary conditions, the legend of the returning Nero, Jewish apocalypse, and Babylonian mythology. These are praeterist theories also, but differ from the older in that in them all real prophecy is denied. A mainstay of such theories is the declaration of the book that the events announced are close at hand (<a onClick="return mV(\'Rev\',1,1,3);">Re 1:1,3</a>; <a onClick="return mV(\'Rev\',22,20);">22:20</a>). When, however, it is remembered that, on any view, this nearness includes a period of 1,000 years before the judgment and descent of the new Jerusalem, it will be felt that it will not do to give these expressions too restricted a temporal significance. The horizon is wider. The coming of Christ is ever near—ever approaching—yet it is not to be tied down to "times and seasons"; it is more of the nature of a process and has anticipatory exemplifications in many crises and providential events forecasting the end (see above). The "coming," e.g. to the church at Ephesus (<a onClick="return mV(\'Rev\',2,5);">Re 2:5</a>), or to the church at Pergamos (<a onClick="return mV(\'Rev\',9,16);">Re 9:16</a>)—contingent events—can hardly exhaust the full meaning of the Parousia. The Nero-theory demands a date at latest under Galba, but that date we have seen to be generally abandoned. Those who place it under Vespasian (omitting three short reigns) sacrifice the advantage of dating the book before the destruction of Jerusalem, and have to fall back on a supposititious Jewish fragment in <a onClick="return mV(\'Rev\',11,\'1-\');">Re 11</a>, which those who incorporated it must have known had never been fulfilled. The attempt to give a "contemporary historical" interpretation to the symbols of the successive churches, as Gunkel has acutely shown, completely breaks down in practice, while Gunkel\'s own attempt at a Babylonian explanation will be judged by most to be overstrained. "Dragon" in the Old Testament and elsewhere may be associated with widespread oriental ideas, but the definite symbolism of the Apocalypse in <a onClick="return mV(\'Rev\',12,\'1)-\';">Re 12</a> has no provable connection with Babylonian myths. There is the widest disagreement in theories of "composite" origin (from Jewish apocalypse). What seems simple and demonstrable to one has no plausibility to others. A form of "Nero Caesar," indeed, yields the mystic 666, but so do 1,000 other names—almost any name, with proper manipulation (compare Salmon, lecture xiv). Lastly, the returning-Nero legend yields no satisfactory explanation of the language in <a onClick="return mV(\'Rev\',13,3,12,14);">Re 13:3,12,14</a>; <a onClick="return mV(\'Rev\',17,11);">17:11</a>. The theory is that these words allude to the belief that Nero would return from the dead and become Antichrist (see above). Tacitus attests that there were vague rumors that Nero had not really died (Hist. ii.8), and later a pretender arose in Parthia taking advantage of this feeling (Suet. Nero. 57). The idea of Nero returning from the dead is categorically stated in Sib Or 5:363-70 (circa 120 AD); compare Sib Or 4:119-22 (circa 80 AD). Augustine mentions the idea (City of God, xx.19, 3), but without connection with the Apocalypse. By Domitian\'s time, however, it was perfectly certain that Nero had not returned, and there was no longer, on this interpretation, any appositeness in speaking of a "head" the "deathstroke" of which was healed (<a onClick="return mV(\'Rev\',13,3);">Re 13:3</a>), which became the "eighth head" of <a onClick="return mV(\'Rev\',17,11);">Re 17:11</a>—if, indeed, the apostle could be conceived capable of being influenced by such vagaries. The events predicted lay, evidently, still in the future. It may be added that neither Irenaeus, nor any early interpreter, seems to have heard of the connection of 666 with "Nero." Ireneus himself suggests the solution Lateinos (compare Salmon, ut supra).<P>3. The Book a True Prophecy:<P>It is not proposed here to attempt the lines of a positive interpretation. If it is once recognized that the Apocalypse is a book of true prophecy, that its symbols stand for something real, and that its perspective is not to be limited to a brief period like 3 1/2 years, the way is opened, not, indeed, for a reading into it of a series of precise historical occurrences, but still for doing justice to the truth which lies at the basis of the historical interpretation, namely, that there are here prefigured the great crises in the age-long conflict of Christ and His church with pagan and anti-Christian adversaries. Events and tendencies may be grouped, or under different forms may relate to the same subject (e.g. the 144,000 sealed on earth—a spiritual Israel—in <a onClick="return mV(\'Rev\',7,\'1-8\');">Re 7:1-8</a>, and the triumphant multitude in heaven, <a onClick="return mV(\'Rev\',7,\'9-17\');">7:9-17</a>); successions of events may be foreshortened; different pictures may overlap; but, shining through the symbols, great truths and facts which have historical realization appear. There is no need for supposing that, in a drama of this range, the "heads" of the beast of <a onClick="return mV(\'Rev\',13,\'1-\');">Re 13</a> and <a onClick="return mV(\'Rev\',17,\'1-\');">17</A> (behind whom is the Dragon-enemy, Satan, of <a onClick="return mV(\'Rev\',12,\'1-\');">Re 12</a>) stand, in contrariety to the analogy of Daniel, for seven individual emperors, and that "the image of the beast," which has life given to it and "speaks" (<a onClick="return mV(\'Rev\',13,14,15);">Re 13:14,15</a>), is the statue of the emperor; or that such tremendous events as the fall of the Roman Empire, or the rise of the papacy—with which, however, must be combined all ecclesiastical anti-Christianism—or the false prophecy of later intellectual anti-Christianism have no place in the symbolism of the book. Sane, reverent thought will suggest many lines of correspondence with the course of God\'s providence, which may serve to illuminate its dark places. More than this need not be said here.<P>VI. Theology of the Book.<P>On this it is hardly necessary to dwell, for expositors are now well agreed that in its great doctrines of God, Christ, man, sin, redemption, the teaching of the Apocalypse does not vary essentially from the great types in the Epistles. The assonances with John\'s mode of thinking have already been alluded to. It is granted by all writers that the Christology is as high as anywhere in the New Testament. "It ought unhesitatingly to be acknowledged," says Reuss, "that Christ is placed in the Apocalypse on a paragraph with God" (op. cit., I, 397-98; compare <a onClick="return mV(\'Rev\',1,4,17);">Re 1:4,17</a>; <a onClick="return mV(\'Rev\',2,8);">2:8</a>; <a onClick="return mV(\'Rev\',5,\'12-14\');">5:12-14</a>; <a onClick="return mV(\'Rev\',22,13);">22:13</a>, etc.). Not less striking are the correspondences with the teaching of Paul and of Peter on redemption through the blood of Christ (<a onClick="return mV(\'Rev\',1,5);">Re 1:5</a>; <a onClick="return mV(\'Rev\',5,9);">5:9</a>; <a onClick="return mV(\'Rev\',7,14);">7:14</a>; <a onClick="return mV(\'Rev\',14,4);">14:4</a>, etc.). The perverted conception of the school of Baur that we have in the book an anti-Pauline manifesto (thus also Pfieiderer; compare Hibbert Lectures, 178), is now practically dead (see the criticism of it by Reuss, op. cit., I, 308-12). The point in which its eschatology differs from that of the rest of the New Testament is in its introduction of the millennium before the final resurrection and judgment. This enlarges, but does not necessarily contradict, the earlier stage of thought.<P>LITERATURE.<P>Moses Stuart, Commentary on Apocalypse; Alford, Greek Testament, IV, "The Revelation"; S. Davidson, Introduction to the New Testament (3rd edition), 176ff; G. Salmon, Introduction to the New Testament (2nd edition), lects xiii, xiv; Elliott, Horae Apocalypticae, with literature there mentioned; Farrar, Early Days of Christianity, chapter xxviii; Milligan, Discussions on the Apocalypse; H. Gunkel, Schopfung und Chaos; W. Bousset, Die Offenbarung Johannis, and article "Apocalypse" in EB, I; C. Anderson Scott, "Revelation" in Century Bible; J. Moffatt, Introduction to Literature of the New Testament (with notices of literature); also "Revelation" in Expositor\'s Bible; Trench, Epistles to the Seven Churches; W. M. Rarnsay, Letters to the Seven Churches; H. B. Swete, The Apocalypse of John.``132';
isbe[7409]='Revelation, 1-2`rev-e-la\'-shun:<P><b>I. THE NATURE OF REVELATION</b><P class="in15">1. The Religion of the Bible the Only Supernatural Religion<P class="in15">2. General and Special Revelation<P class="in30">(1) Revelation in Eden<P class="in30">(2) Revelation among the Heathen<P><b>II. THE PROCESS OF REVELATION</b><P class="in15">1. Place of Revelation among the Redemptive Acts of God<P class="in15">2. Stages of Material Development<P><b>III. THE MODES OF REVELATION</b><P class="in15">1. The Several Modes of Revelation<P class="in15">2. Equal Supernaturalness of the Several Modes<P class="in15">3. The Prophet God\'s Mouthpiece<P class="in15">4. Visionary Form of Prophecy<P class="in15">5. "Passivity" of Prophets<P class="in15">6. Revelation by Inspiration<P class="in15">7. Complete Revelation of God in Christ<P><b>IV. BIBLICAL TERMINOLOGY</b><P class="in15">1. The Ordinary Forms<P class="in15">2. "Word of Yahweh" and "Torah"<P class="in15">3. "The Scriptures"<P><b>LITERATURE</b><hr /><P>I. The Nature of Revelation.<P>1. The Religion of the Bible the Only Supernatural Religion:<P>The religion of the Bible is a frankly supernatural religion. By this is not meant merely that, according to it, all men, as creatures, live, move and have their being in God. It is meant that, according to it, God has intervened extraordinarily, in the course of the sinful world\'s development, for the salvation of men otherwise lost. In Eden the Lord God had been present with sinless man in such a sense as to form a distinct element in his social environment (<a onClick="return mV(\'Gen\',3,8);">Ge 3:8</a>). This intimate association was broken up by the Fall. But God did not therefore withdraw Himself from concernment with men. Rather, He began at once a series of interventions in human history by means of which man might be rescued from his sin and, despite it, brought to the end destined for him. These interventions involved the segregation of a people for Himself, by whom
