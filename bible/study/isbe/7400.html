isbe[7490]='Root`root (shoresh; rhiza): Frequently mentioned in the Old Testament and New Testament, but almost always in a figurative sense, e.g. "root of the righteous" (<a onClick="return mV(\'Pro\',12,3,12);">Pr 12:3,12</a>); "root that beareth gall" (<a onClick="return mV(\'Deu\',29,18);">De 29:18</a>); "Their root shall be as rottenness" (<a onClick="return mV(\'Isa\',5,24);">Isa 5:24</a>); "root of bitterness" (<a onClick="return mV(\'Hbr\',12,15);">Heb 12:15</a>). Also of peoples: "they whose root is in Amalek" (<a onClick="return mV(\'Jdg\',5,14);">Jud 5:14</a>); of Assyria (<a onClick="return mV(\'Eze\',31,7);">Eze 31:7</a>); "Ephraim is smitten, their root is dried up" (<a onClick="return mV(\'Hsa\',9,16);">Ho 9:16</a>); "Judah shall again take root downward" (<a onClick="return mV(\'2Ki\',19,30);">2Ki 19:30</a>; compare <a onClick="return mV(\'Isa\',27,6);">Isa 27:6</a>; <a onClick="return mV(\'Isa\',37,31);">37:31</a>); the root of Jesse (<a onClick="return mV(\'Isa\',11,10);">Isa 11:10</a>; <a onClick="return mV(\'Rom\',15,12);">Ro 15:12</a>); root of David (<a onClick="return mV(\'Rev\',5,5);">Re 5:5</a>; <a onClick="return mV(\'Rev\',22,16);">22:16</a>).``1';
isbe[7491]='Root of David``<a href="./study/isbe/search.html?string=DAVID,+ROOT+OF">DAVID, ROOT OF</a>`1';
isbe[7492]='Root of Jesse`(shoresh yishay (<a onClick="return mV(\'Isa\',11,10);">Isa 11:10</a>); rhiza tou Iessai (<a onClick="return mV(\'Rom\',15,12);">Ro 15:12</a>)): The Hebrew and Greek words are practically the same in meaning. "Root" means descendant, branch of the family or stock. The Messianic king was to be of the family of Jesse the father of David. In <a onClick="return mV(\'Rom\',15,12);">Ro 15:12</a> Paul quotes the Septuagint of <a onClick="return mV(\'Isa\',11,10);">Isa 11:10</a>. Jesus is a branch or descendant of the family of Jesse, as well as of David.`<a href="./study/isbe/search.html?string=DAVID,+ROOT+OF">DAVID, ROOT OF</a>`1';
isbe[7493]='Rope`rop: Used in the Old Testament for chebhel, "that which binds" (<a onClick="return mV(\'2Sa\',17,13);">2Sa 17:13</a>, etc.), and for \'abhoth, "that which is woven" (<a onClick="return mV(\'Jdg\',15,13);">Jud 15:13</a>, etc.). In neither word is any specified thickness or strength connoted, and chebhel is translated equally well by "line" (<a onClick="return mV(\'2Sa\',8,2);">2Sa 8:2</a>, etc.) or "cord" (<a onClick="return mV(\'Jos\',2,15);">Jos 2:15</a>, etc.), and \'abhoth by "cord" (<a onClick="return mV(\'Psa\',118,27);">Ps 118:27</a>, etc.), as best suits the context. Similarly in the New Testament the word schoinion, literally, "made of rushes" can mean the rope by which a boat is fastened (<a onClick="return mV(\'Act\',27,32);">Ac 27:32</a>) or small cords suitable for a whip (<a onClick="return mV(\'Jhn\',2,15);">Joh 2:15</a>). The usual material for ropes was certainly flax (hemp), but the Egyptians, and so possibly the Hebrews, at times made ropes of leathern thongs.`<a href="./study/isbe/search.html?string=CORD">CORD</a>; <a href="./study/isbe/search.html??string=LINE">LINE</a>; <a href="./study/isbe/search.html??string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`48';
isbe[7494]='Rose`roz: (1) (chabhatstseleth; anthos, "a flower" (<a onClick="return mV(\'Sgs\',2,1);">So 2:1</a>) krinon, "a lily" (<a onClick="return mV(\'Isa\',35,1);">Isa 35:1</a>)): By general consent English Versions of the Bible is wrong: in <a onClick="return mV(\'Sgs\',2,1);">So 2:1</a> margin reads "Hebrew habazzeleth, the autumn crocus" and in <a onClick="return mV(\'Isa\',35,1);">Isa 35:1</a>, margin reads "or autumn crocus." This is the Colchicum autumnale (Natural Order, Liliaceae). A Targum on <a onClick="return mV(\'Sgs\',2,1);">So 2:1</a> explains the Hebrew word as "narcissus", a very common plant in the plains and mountains of Palestine and a great favorite with the natives. Two species, N. tazetta and N. serolinus (Natural Order, Amaryllideae), occur, the latter being the finer; they are autumn plants. All authorities agree that the so-called "rose" was some kind of bulbed plant. (2) (rhodon, "the rose," mentioned in Ecclesiasticus 24:14; 39:13; 50:8; <span class="noTag">The Wisdom of Solomon 2:8</span>; 2Esdras 2:19): There is no reason why the rose, of which several varieties are common in Palestine, should not be meant. Tristram favors the rhododendron. The expression, "rose plants in Jericho," in Ecclesiasticus 24:14 has nothing whatever to do with what is now sold there as a "rose of Jericho," a dwarf annual plant, Anastatica hierochuntina (Natural Order, Cruciferae), which dries up and can be made to reexpand by placing the root in water.``117';
isbe[7495]='Rosh (1)`rosh, rosh (ro\'sh): A son or grandson of Benjamin (<a onClick="return mV(\'Gen\',46,21);">Ge 46:21</a>).``1';
isbe[7496]='Rosh (2)`(ro\'sh; Rhos, variant (Q margin) kephales; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) capiris):<P>1. Rosh and Its Renderings:<P>This name occurs in the prophecies against Gog in <a onClick="return mV(\'Eze\',38,2,3);">Eze 38:2,3</a> and <a onClick="return mV(\'Eze\',39,1);">39:1</a>, where the King James Version has "Gog, the land of Magog, the chief prince of Meshech and Tubal." This translation is due to ro\'sh being the common Hebrew word for "head" or "chief" (compare the Greek variant and the Vulgate), and is regarded as incorrect, that of the Revised Version (British and American), "Gog, of the land of Magog, the prince of Rosh, Meshech and Tubal," being preferred.<P>2. Identification with Russia:<P>The identification of Rosh is not without its difficulties. Gesenius regarded it as indicating the Russians, who are mentioned in Byzantine writers of the 10th century under the name of Rhos. He adds that they are also noticed by Ibn Fosslan (same period), under the name of Rus, as a people dwelling on the river Rha (Volga). Apart from the improbability that the dominion of Gog extended to this district, it would be needful to know at what date the Rus of the Volga arrived there.<P>3. Probably the Assyrian Rasu:<P>Notwithstanding objections on account of its eastern position, in all probability Fried. Delitzsch\'s identification of Rosh with the mat Rasi, "land of Rash" of the Assyrian inscriptions, is the best. Sargon of Assyria (circa 710 BC) conquered the countries "from the land of Rasu on the border of Elam as far as the river of Egypt," and this country is further described in his Khorsabad Inscription,18,as "the land of Rasu, of the boundary of Elam, which is beside the Tigris." Assyria having disappeared from among the nations when Ezekiel wrote his prophecies, Babylonia was probably the only power with which "Gog of the land of Magog" would have had to reckon, but it may well be doubted whether the Babylonian king would have allowed him to exercise power in the district of Rasu, except as a very faithful vassal. It may here be noted that the Hebrew spelling of Rosh presupposes an earlier pronunciation as Rash, a form agreeing closely with that used by the Assyrians. See Fried. Delitzsch, Wo lag das Paradies? 325.``136';
isbe[7497]='Rot; Rottenness`rot, rot\'-\'-n-nes (verb raqebh, noun raqabh (riqqabhon, <a onClick="return mV(\'Job\',41,27);">Job 41:27</a>), with maq, "decay" (<a onClick="return mV(\'Isa\',5,24);">Isa 5:24</a>), and \'abhash, "shrivel" (so <a onClick="return mV(\'Joe\',1,17);">Joe 1:17</a> the Revised Version margin)): "Rottenness of the bones" (<a onClick="return mV(\'Pro\',12,4);">Pr 12:4</a>; <a onClick="return mV(\'Pro\',14,30);">14:30</a>; <a onClick="return mV(\'Hab\',3,16);">Hab 3:16</a>) is ulceration (caries) of the bones, used as an example of an intensely painful disease. the King James Version, in addition, has "rot" in <a onClick="return mV(\'Num\',5,21,22,27);">Nu 5:21,22,27</a>, where the Revised Version (British and American) has "fall away" (naphal), but a euphemistic paraphrase is in point (see the comms.). In <a onClick="return mV(\'Jer\',38,11,12);">Jer 38:11,12</a> the King James Version has "old rotten rags" for melach, "rag" (the Revised Version (British and American) "wornout garments," a translation that specializes too far).``1';
isbe[7498]='Rote`rot: the Revised Version margin gives "learned by rote" in <a onClick="return mV(\'Isa\',29,13);">Isa 29:13</a> for the King James Version "taught," which indicates that the service of Yahweh was merely formal.``1';

isbe[7500]='Royal`roi\'-al: Either belonging to a king (kingdom) or having kingly power, dignity, authority, etc. In Hebrew, the word is expressed by using different nouns in the gen. case (the "construct state"). They are:<P>(1) melekh, "king": "Asher...shall yield royal dainties," literally, choice morsels of the king, meaning fit for a king (<a onClick="return mV(\'Gen\',49,20);">Ge 49:20</a>); "besides that which Solomon gave her of his royal bounty," literally, which he gave her according to the hand (the wealth) of King Solomon (<a onClick="return mV(\'1Ki\',10,13);">1Ki 10:13</a>; compare the Revised Version margin); "a royal statute," literally, statute of a malka\', which is the emphatic Aramaic term for melekh, "king" (<a onClick="return mV(\'Dan\',6,7);">Da 6:7</a>);<P>(2) mamlakhah, "the power and dignity of a king," "Gibeon...one of the royal cities," i.e. a capital city with a king of her own (<a onClick="return mV(\'Jos\',10,2);">Jos 10:2</a>; compare <a onClick="return mV(\'1Sa\',27,5);">1Sa 27:5</a>); "all the seed royal," literally, the seed of the kingdom (<a onClick="return mV(\'2Ki\',11,1);">2Ki 11:1</a>; compare <a onClick="return mV(\'2Ch\',22,10);">2Ch 22:10</a>);<P>(3) malkhuth, "kinghood," "kingdom": "royal majesty," literally, majesty of kinghood (<a onClick="return mV(\'1Ch\',29,25);">1Ch 29:25</a>); quite frequently in the Book of Esther; royal wine (<a onClick="return mV(\'Est\',1,7);">1:7</A>); crown (<a onClick="return mV(\'Est\',1,11);">1:11</a>; compare <a onClick="return mV(\'Est\',2,17);">2:17</a>; <a onClick="return mV(\'Est\',6,8);">6:8</a>); commandment (<a onClick="return mV(\'Est\',1,19);">1:19</A>); "her royal estate," literally, her kinghood (<a onClick="return mV(\'Est\',1,19);">1:19</A>); house royal (<a onClick="return mV(\'Est\',2,16);">2:16</A>; compare <a onClick="return mV(\'Est\',5,1);">5:1</A>); royal apparel (<a onClick="return mV(\'Est\',5,1);">5:1</A>; compare <a onClick="return mV(\'Est\',6,8,15);">6:8,15</a>); throne (<a onClick="return mV(\'Est\',5,1);">5:1</A>);<P>(4) melukhah, "kingdom," "kingly power and dignity": "royal city," literally, the city of the kingdom, meaning here that part of the city (Rabbah) in which the royal palace was situated (<a onClick="return mV(\'2Sa\',12,26);">2Sa 12:26</a>); "royal diadem," literally, turban of kinghood (<a onClick="return mV(\'Isa\',62,3);">Isa 62:3</a>);<P>(5) in <a onClick="return mV(\'Jer\',43,10);">Jer 43:10</a> we find the word shaphrir; its meaning is uncertain: "royal pavilion" (the Revised Version (British and American) and the King James Version), "glittering" (Revised Version, margin), "scepter," "a carpet covering a throne."<P>The New Testament uses the word for basilikos, "belonging to king": "royal apparel" (<a onClick="return mV(\'Act\',12,21);">Ac 12:21</a>); "the royal law," something like "the golden rule," being foremost because including all others (<a onClick="return mV(\'Jam\',2,8);">Jas 2:8</a>), and for basileios (being vested with kingly power and honor), "royal priesthood," the Hebrew rendering would be mamlekheth kohanim, "a kingdom of priests," i.e. a kingdom whose citizens are priests, emphasizing the two facts that the true Christians have free access to the grace of God and that they enjoy the liberties and privileges of His kingdom (<a onClick="return mV(\'1Pe\',2,9);">1Pe 2:9</a>).``8';
