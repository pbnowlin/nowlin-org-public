isbe[7460]='Roast``<a href="./study/isbe/search.html?string=FOOD">FOOD</a>`1';
isbe[7461]='Robber; Robbery`rob\'-er, rob\'-er-i: "Robber" represents no particular Hebrew word in the Old Testament, but in the Apocrypha and the New Testament is always a translation of lestes (see <a href="./study/isbe/search.html?string=THIEF">THIEF</A>). In the King James Version <a onClick="return mV(\'Job\',5,5);">Job 5:5</a>; <a onClick="return mV(\'Job\',18,9);">18:9</a>, "robber" stands for the doubtful word tsammim, the Revised Version (British and American) "hungry" in <a onClick="return mV(\'Job\',5,5);">Job 5:5</A> and "snare" in <a onClick="return mV(\'Job\',18,9);">18:9</A>. The meaning is uncertain, and perhaps tseme\'im, "thirsty," should be read in both places. <a onClick="return mV(\'Psa\',62,10);">Ps 62:10</a>, "Become not vain in robbery," means "put not your trust in riches dishonestly gained." RV\'s changes of the King James Version in <a onClick="return mV(\'Pro\',21,7);">Pr 21:7</a>; <a onClick="return mV(\'Dan\',11,14);">Da 11:14</a>; <a onClick="return mV(\'Nah\',3,1);">Na 3:1</a> are obvious. In <a onClick="return mV(\'Phl\',2,6);">Php 2:6</a> the King James Version reads "thought it not robbery to be equal with God." the English Revised Version has "a prize," while the English Revised Version margin and the American Standard Revised Version read "a thing to be grasped," the American Standard Revised Version rewording "counted not the being on an equality with God a thing to be grasped." The Greek here is harpagmos, a word derived from harpazo, "to ravish away," "carry off," "plunder" (compare "harpy"). Properly speaking, the termination -mos should give the derived noun an active sense, "the act of plundering," whence the King James Version\'s "robbery." The verse would then mean "who thought that being on an equality with God did not consist in grasping," and this translation gives good sense in the context and has some excellent scholarly support. But a passive significance is frequently found despite a -mos termination, giving to harpagmos the sense of "thing grasped," as in the Revised Version (British and American). Usually English commentators take "grasped" as meaning "clung to"—"did not think equality with God should be clung to tenaciously"—but "to cling to" seems unknown as a translation of harpazo. Hence, render "a thing to be grasped at"—did not seek equality with God by selfish methods but by humbling himself." It is to be noticed, naturally, that Paul is thinking of "equality with God" simply in the sense of "receiving explicit adoration from men" (<a onClick="return mV(\'Phl\',2,10,11);">Php 2:10,11</a>), and that the metaphysical relation of the Son to the Father is not at all in point.`<a href="./study/isbe/search.html?string=GRASP">GRASP</a>`48';
isbe[7462]='Robbers of Temples`(hierosuloi, "guilty of sacrilege"): A term used by the town clerk of Ephesus (<a onClick="return mV(\'Act\',19,37);">Ac 19:37</a>, the King James Version "robbers of churches"). As the temple of Diana (Artemas) had a great treasure-chamber, the offense might not be unknown among them; compare <a onClick="return mV(\'Rom\',2,22);">Ro 2:22</a>.<P>In 2Macc 4:42 the King James Version the epithet "church-robber" (the Revised Version (British and American) "author of the sacrilege") is applied to <a href="./study/isbe/search.html?string=LYSIMACHUS">LYSIMACHUS</a> (which see).``1';
isbe[7463]='Robe`rob.`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>`1';
isbe[7464]='Roboam`ro-bo\'-am (Rhoboam). the King James Version; Greek form of "Rehoboam" (thus the Revised Version (British and American)) (<a onClick="return mV(\'Mat\',1,7);">Mt 1:7</a>); successor of Solomon.``1';
isbe[7465]='Rock`rok (1) cela\'; (2) tsur (3) challamish, "flint"; compare Arabic khalanbus, "flint"; (4) kephim (<a onClick="return mV(\'Job\',30,6);">Job 30:6</a>;" <a onClick="return mV(\'Jer\',4,29);">Jer 4:29</a>); compare Kephas, "Cephas" = Petros, "Peter" (<a onClick="return mV(\'Jhn\',1,42);">Joh 1:42</a> the King James Version and the Revised Version margin); (5) petra):<P>1. Names:<P>Tsur and cela\' are the words most often found, and there is no well-defined distinction between them. They are frequently coupled together in the parallelism which is characteristic of the Hebrew writers: e.g.<P class="in15">"Be thou to me a strong rock (tsur),<br>A house of defense to save me.<br>For thou art my rock (tsela) and my fortress"<br>(<a onClick="return mV(\'Psa\',31,2,3);">Ps 31:2,3</a>).<P class="in15">"He clave rocks (tsur) in the wilderness,<br>And gave them drink abundantly as out of the depths.<br>He brought streams also out of the rock (sela),<br>And caused waters to run down like rivers"<br>(<a onClick="return mV(\'Psa\',78,15,16);">Ps 78:15,16</a>).<P>It is plain here that the two words are used for the sake of variety, without any clear difference of meaning. Even challamish (translated "flint") is used in the same way with tsur in <a onClick="return mV(\'Psa\',114,8);">Ps 114:8</a>:<P class="in15">"Who turned the rock (tsur) into a pool of water;<br>The flint (callamish) into a fountain of waters."<P>2. Figurative:<P>(1) Some of the most striking and beautiful imagery of the Bible is based upon the rocks. They are a symbol of God: "Yahweh is my rock, and my fortress" (<a onClick="return mV(\'2Sa\',22,2);">2Sa 22:2</a>; <a onClick="return mV(\'Psa\',18,2);">Ps 18:2</a>; <a onClick="return mV(\'Psa\',71,3);">71:3</a>); "God, the rock of my salvation" (<a onClick="return mV(\'2Sa\',22,47);">2Sa 22:47</a>; compare <a onClick="return mV(\'Psa\',62,2,7);">Ps 62:2,7</a>; <a onClick="return mV(\'Psa\',89,26);">89:26</a>); "my God the rock of my refuge" (<a onClick="return mV(\'Psa\',94,22);">Ps 94:22</a>); "the rock of thy strength" (<a onClick="return mV(\'Isa\',17,10);">Isa 17:10</a>); "Lead me to the rock that is higher than I" (<a onClick="return mV(\'Psa\',61,2);">Ps 61:2</a>); repeatedly in the Song of Moses (<a onClick="return mV(\'Deu\',32,3,4,18,30,31);">De 32:3,4,18,30,31</a>; compare <a onClick="return mV(\'2Sa\',22,32);">2Sa 22:32</a>). Paul applies the rock smitten in the wilderness (<a onClick="return mV(\'Exd\',17,6);">Ex 17:6</a>; <a onClick="return mV(\'Num\',20,11);">Nu 20:11</a>) to Christ as the source of living water for spiritual refreshment (<a onClick="return mV(\'1Cr\',10,4);">1Co 10:4</a>).<P>(2) The rocks are a refuge, both figuratively and literally (<a onClick="return mV(\'Jer\',48,28);">Jer 48:28</a>; <a onClick="return mV(\'Sgs\',2,14);">So 2:14</a>); "The rocks are a refuge for the conies" (<a onClick="return mV(\'Psa\',104,18);">Ps 104:18</a>). Many a traveler in Palestine has felt the refreshment of "the shade of a great rock in a weary land" (<a onClick="return mV(\'Isa\',32,2);">Isa 32:2</a>). A very different idea is expressed in <a onClick="return mV(\'Isa\',8,14);">Isa 8:14</a>, "And he shall be for a sanctuary; but for a stone of stumbling and for a rock of offense" (compare <a onClick="return mV(\'Rom\',9,33);">Ro 9:33</a>; <a onClick="return mV(\'1Pe\',2,8);">1Pe 2:8</a>).<P>(3) The rock is a symbol of hardness (<a onClick="return mV(\'Jer\',5,3);">Jer 5:3</a>; compare <a onClick="return mV(\'Isa\',50,7);">Isa 50:7</a>). Therefore, the breaking of the rock exemplifies the power of God (<a onClick="return mV(\'Jer\',23,29);">Jer 23:29</a>; compare <a onClick="return mV(\'1Ki\',19,11);">1Ki 19:11</a>). The rock is also a symbol of that which endures, "Oh that they...were graven in the rock for ever!" (<a onClick="return mV(\'Job\',19,23,24);">Job 19:23,24</a>). A rock was an appropriate place for offering a sacrifice (<a onClick="return mV(\'Jdg\',6,20);">Jud 6:20</a>; <a onClick="return mV(\'Jdg\',13,19);">13:19</a>). The central feature of the Mosque of \'Umar in Jerusalem is Qubbat-uc-Cakhrat, the "dome of the rock." The rock or cakhrat under the dome is thought to be the site of Solomon\'s altar of burnt offering, and further is thought to be the site of the threshing-floor of Araunah the Jebusite which David purchased to build an altar to Yahweh.<P>3. Kinds of Rock:<P>(1) The principal rock of Palestine and Syria is limestone of which there are many varieties, differing in color, texture, hardness and degrees of impurity, some of the limestone having considerable admixtures of clay or sand. Some of the harder kinds are very dense and break with a conchoidal fracture similar to the fracture of flint. In rocks which have for ages been exposed to atmospheric agencies, erosion has produced striking and highly picturesque forms. Nodules and layers of flint are of frequent occurrence in the limestone.<P>(2) Limestone is the only rock of Western Palestine, with the exception of some local outpourings of basaltic rock and with the further exception of a light-brown, porous, partly calcareous sandstone, which is found at intervals along the coast. This last is a superficial deposit of Quaternary or recent age, and is of aeolian origin. That is, it consists of dune sands which have solidified under the influence of atmospheric agencies. This is very exceptional, nearly all stratified rocks having originated as beds of sand or mud in the bottom of the sea.<P>(3) In Sinai, Edom, Moab, Lebanon and Anti-Lebanon is found the Nubian sandstone, a silicious sandstone which, at least in the north, is of middle or lower Cretaceous age. In the South, the lower strata of this formation seem to be paleozoic. Most of it is not sufficiently coherent to make good building stone, though some of its strata are very firm and are even used for millstones. In some places it is so incoherent or friable that it is easily dug with the pick, the grains falling apart and forming sand that can be used in mortar. In color the Nubian sandstone is on the whole dark reddish brown, but locally it shows great variation, from white through yellow and red to black. In places it also has tints of blue. The celebrated rock tombs and temples of Petra are carved in this stone.<P>(4) Extensive areas of the northern part of Eastern Palestine are covered with igneous rock. In the Jaulan Southeast of Mt. Hermon, this has been for ages exposed to the atmosphere and has formed superficially a rich dark soil. Further Southeast is the Leja\' (Arabic "refuge"), a wild tract covered with a deposit of lava which is geologically recent, and which, while probably earlier than man, is still but little affected by the atmosphere. It is with difficulty traversed and frequently furnishes an asylum to outlaws.`<a href="./study/isbe/search.html?string=CRAG">CRAG</a>; <a href="./study/isbe/search.html??string=FLINT">FLINT</a>; <a href="./study/isbe/search.html??string=GEOLOGY+OF+PALESTINE">GEOLOGY OF PALESTINE</a>; <a href="./study/isbe/search.html??string=LIME">LIME</a>`37';

isbe[7467]='Rock-Badger`r.-baj\'-er: This term is found in the Revised Version margin for "coney," shaphan (<a onClick="return mV(\'Lev\',11,5);">Le 11:5</a>; compare <a onClick="return mV(\'Deu\',14,7);">De 14:7</a>; <a onClick="return mV(\'Psa\',104,18);">Ps 104:18</a>; <a onClick="return mV(\'Pro\',30,26);">Pr 30:26</a>). It is a translation of klip das, the name given by the Boers to the Cape hyrax or coney.`<a href="./study/isbe/search.html?string=CONEY">CONEY</a>`1';
isbe[7468]='Rod`(maqqel, matteh, shebhet; rhabdos): Little distinction can be drawn between the Hebrew words used for "rod" and "staff." Maqqel is the word used in <a onClick="return mV(\'Gen\',30,37);">Ge 30:37</a>ff for the twigs of poplar put by Jacob before his sheep, and in <a onClick="return mV(\'Jer\',1,11);">Jer 1:11</a> of the "rod of an almond-tree." Matteh is used of a rod in the hand, as the "rods" of Moses and of Aaron (<a onClick="return mV(\'Exd\',4,2);">Ex 4:2</a>ff; <a onClick="return mV(\'Exd\',7,9);">7:9</a>, etc.). Shebhet is used, but sometimes also matteh, of the rod used for correction (<a onClick="return mV(\'Exd\',21,20);">Ex 21:20</a>; <a onClick="return mV(\'2Sa\',7,14);">2Sa 7:14</a>; <a onClick="return mV(\'Pro\',10,13);">Pr 10:13</a>; <a onClick="return mV(\'Pro\',13,24);">13:24</a>; <a onClick="return mV(\'Isa\',10,5);">Isa 10:5</a>, etc.). In <a onClick="return mV(\'Psa\',23,4);">Ps 23:4</a> ("Thy rod and thy staff, they comfort me"), however, shebhet is the shepherd\'s rod, figurative of divine guidance and care. In <a onClick="return mV(\'Eze\',21,10,13);">Eze 21:10,13</a>, the word stands for the royal scepter. In the New Testament "rod" is used of a rod of correction (<a onClick="return mV(\'1Cr\',4,21);">1Co 4:21</a>), Aaron\'s rod (<a onClick="return mV(\'Hbr\',9,4);">Heb 9:4</a>), a ruler\'s rod "of iron" (severity, as in <a onClick="return mV(\'Rev\',2,27);">Re 2:27</a>; <a onClick="return mV(\'Rev\',12,5);">12:5</a>; <a onClick="return mV(\'Rev\',19,15);">19:15</a>), a measuring rod (<a onClick="return mV(\'Rev\',11,1);">Re 11:1</a>).`<a href="./study/isbe/search.html?string=ARMOR;+ARMS">ARMOR, ARMS</a>`132';
isbe[7469]='Rodanim`rod\'-a-nim: The reading of Massoretic Text in <a onClick="return mV(\'1Ch\',1,7);">1Ch 1:7</a> for the <a href="./study/isbe/search.html?string=DODANIM">DODANIM</a> (which see) of <a onClick="return mV(\'Gen\',10,4);">Ge 10:4</a>, corresponding to the Rhodioi of the Septuagint in both passages. The Rodanim are generally identified as inhabitants of the island of <a href="./study/isbe/search.html?string=RHODES">RHODES</a> (which see), well known to the ancient Phoenicians (Homer\'s Iliad).``1';
isbe[7470]='Roe; Roebuck`ro, ro\'-buk: the King James Version has "roe" and "roebuck" for tsehi, tsebhiyah. the Revised Version (British and American) usually substitutes "gazelle" in the text (<a onClick="return mV(\'Deu\',12,15);">De 12:15</a>, etc.) or margin (<a onClick="return mV(\'Pro\',6,5);">Pr 6:5</a>, etc.), but retains "roe" in <a onClick="return mV(\'2Sa\',2,18);">2Sa 2:18</a>; <a onClick="return mV(\'1Ch\',12,8);">1Ch 12:8</a>; <a onClick="return mV(\'Sgs\',3,5);">So 3:5</a>; <a onClick="return mV(\'Sgs\',7,3);">7:3</a>. So the Revised Version (British and American) has "gazelle" for the King James Version "roe" in Sirach 27:20 (dorkas). the Revised Version (British and American) has "roe-buck" for yachmur (<a onClick="return mV(\'Deu\',14,5);">De 14:5</a>; <a onClick="return mV(\'1Ki\',4,23);">1Ki 4:23</a>), where the King James Version has "fallow deer." In the opinion of the writer, \'ayyal English Versions of the Bible "hart," should be translated "roe-buck," yachmur "fallow deer," and tsebhi "gazelle."`<a href="./study/isbe/search.html?string=DEER">DEER</a>; <a href="./study/isbe/search.html??string=GAZELLE">GAZELLE</a>`37';
isbe[7471]='Rogelim`ro\'-ge-lim, ro-ge\'-lim (roghelim; Rhogelleim): The place whence came Barzillai the Gileadite to succor David in his flight from Absalom (<a onClick="return mV(\'2Sa\',17,27);">2Sa 17:27</a>; <a onClick="return mV(\'2Sa\',19,31);">19:31</a>). It probably lay near the path followed by David, but it is not identical.``1';
isbe[7472]='Rohgah`ro\'-ga (Kethibh rohaghah, Qere rohgah): A name in the genealogy of Asher (<a onClick="return mV(\'1Ch\',7,34);">1Ch 7:34</a>).``1';
isbe[7473]='Roimus`ro\'-i-mus (Rhoeimos; Codex Alexandrinus Rhomelios): One of the leaders with Zerubbabel in the return (1Esdras 5:8) = "Rehum" in <a onClick="return mV(\'Ezr\',2,2);">Ezr 2:2</a>, of which it is the Greek form = "Nehum" in <a onClick="return mV(\'Neh\',7,7);">Ne 7:7</a>.``1';
isbe[7474]='Roll (Scroll)`rol: The usual form of book in Biblical times. It had been in use in Egypt for perhaps 2,000 years at the time when, according to the Pentateuch, the earliest Biblical books were written in this form. The Babylonian tablet seems to have been the prevailing form in Palestine up to about 1350 BC, but by 1100 BC, at least, the roll had been in established use for some time as far north as Byblos. Two Hebrew words, gillayon, meghillah, one Aramaic, cephar, and one Greek word, biblion, are so translated in the King James Version. Cephar (<a onClick="return mV(\'Ezr\',6,1);">Ezr 6:1</a>, the Revised Version (British and American) "archives, margin "books"), with the corresponding Hebrew form cepher, is the generic word for any whole work large or small, but as a book form (<a onClick="return mV(\'Isa\',34,4);">Isa 34:4</a>) it may mean "roll," and, according to Blau (pp. 37,45,etc.), it never does mean anything else. Both the other words seem to be connected with galal, "roll," which is the technical term for opening or closing a book. The meghillath cepher (<a onClick="return mV(\'Jer\',36,2);">Jer 36:2</a>) means the unwritten roll, or the roll considered in its material form as contrasted with the work. Meghillah, which is found in <a onClick="return mV(\'Ezr\',6,2);">Ezr 6:2</a> (English Versions of the Bible, "roll"), Jeremiah (often), Ezekiel (often) and Zechariah, is a somewhat late word, and came to mean a small roll (but with a complete work) as distinguished from a book, corresponding thus to the modern distinction of pamphlet and book or document and book. The word gillayon is translated in the Revised Version (British and American) as "tablet," and is universally regarded as meaning (<a onClick="return mV(\'Isa\',8,1);">Isa 8:1</a>) some smooth surface, corresponding to the same word in <a onClick="return mV(\'Isa\',3,23);">Isa 3:23</a> which is rendered "hand-mirror." But "cylinder-seal" would possibly fit the sense in both cases; this being hung round the neck as an ornament in one case and inscribed with a personal name in the other.<P>Biblion is regarded by the Bible translators as equivalent to meghillah in the sense of small roll. It is in fact 4 times in the Septuagint of <a onClick="return mV(\'Jer\',36,\'1-\');">Jer 36</a> used as the translation for meghillah, but very much oftener it is the translation for cepher, for which in fact it is the correct technical equivalent (Birt, Buchrolle, 21). Indeed the "small book" (Thayer, Lexicon, 101) is hardly consistent with the ideas of the heavens as a scroll, of the Lamb\'s Book of Life, or of the vast quantity of books of <a onClick="return mV(\'Jhn\',21,25);">Joh 21:25</a>, although in <a onClick="return mV(\'Luk\',4,17);">Lu 4:17</a> it may perhaps correspond closely with meghillah in the sense of a complete roll and work, which is at the same time a whole part of a larger work. Its use in <a onClick="return mV(\'Rev\',6,14);">Re 6:14</a> is reminiscent of <a onClick="return mV(\'Isa\',34,4);">Isa 34:4</a> ("scroll"), and is conclusive for the roll form. It is indeed always technically a roll and never codex or tablet.<P>It is not likely that Isaiah and John (here and in his Gospel, <a onClick="return mV(\'Jhn\',21,25);">21:25</A>) refer directly to the Babylonian idea that the heavens are a series of written tablets or to the rabbinic saying that "if all the oceans were ink, all reeds pens, the heavens and earth sheets to write upon, and all men writers, still it would not suffice for writing out the teachings of my Masters" (Blau, op. cit., 34). Nevertheless, the "whole Cosmos" does suggest "the heavens and earth" as sheets to write on, and under all there does perhaps lurk a conception of the broad expanse of heaven as a roll for writing upon.<P>LITERATURE.<P>Birt, Die Buchrolle in der Kunst, Leipzig, 1907; Jewish Encyclopedia, XI, 126-34, "Scroll of the Law"; Blau, Studien z. althebr. Buchwesen, Strassburg,1902,37-66, etc., and the literature under the article "<A href="./study/isbe/search.html?string=WRITING">Writing</A>," especially Gardthausen, 134-54.``147';
isbe[7475]='Roller`rol\'-er: the King James Version and the English Revised Version in <a onClick="return mV(\'Eze\',30,21);">Eze 30:21</a> for chittul, "bandage" (so the American Standard Revised Version). "Roller" was formerly a technical term in surgery for a wide bandage.``1';
isbe[7476]='Rolling Thing`rol\'-ing: <a onClick="return mV(\'Isa\',17,13);">Isa 17:13</a>, the King James Version "like a rolling thing before the whirlwind," a noncommittal translation of galgal, "revolving thing," "wheel" (<a onClick="return mV(\'Ecc\',12,6);">Ec 12:6</a>). the Revised Version (British and American) "like the whirling dust before the storm" is probably right.`<a href="./study/isbe/search.html?string=CHAFF">CHAFF</a>; <a href="./study/isbe/search.html??string=DUST">DUST</a>; <a href="./study/isbe/search.html??string=STUBBLE">STUBBLE</a>`1';
isbe[7477]='Romamti-Ezer`ro-mam-ti-e\'-zer, ro-mam-ti-e\'-zer (romamti \'ezer, "highest help"): Son of Heman, appointed chief of the 24th division of singers in David\'s time (<a onClick="return mV(\'1Ch\',25,4,31);">1Ch 25:4,31</a>).`<a href="./study/isbe/search.html?string=JOSHBEKASHAH">JOSHBEKASHAH</a>`1';

isbe[7479]='Roman Empire and Christianity, 1`em\'-pir:<P><b>I. OUTLINE OF THE ROMAN EMPIRE</b><P class="in15">1. Roman Empire a Result of Social Conflict<P class="in15">2. Coming of Monarchy<P class="in30">(1) Exhaustion of Parties<P class="in30">(2) Inability of Either Aristocracy or Democracy to Hold Equilibrium<P class="in30">(3) Precedents<P class="in30">(4) Withdrawal from Public Life: Individualism<P class="in30">(5) Industrial<P class="in30">(6) Military<P class="in30">(7) Imperial Interests<P class="in30">(8) Influence of Orient<P><b>II. PREPARATION OF THE ROMAN EMPIRE FOR CHRISTIANITY</b><P class="in15">1. Pax Romana and the Unification of the World<P class="in15">2. Cosmopolitanism<P class="in15">3. Eclecticism<P class="in15">4. Protection for Greek Culture<P class="in15">5. Linguistically<P class="in15">6. Materially<P class="in15">7. Tolerance<P class="in15">8. Pattern for a Universal Church<P class="in15">9. Roman Jurisprudence<P class="in15">10. Negative Preparation<P><b>III. ATTITUDE OF THE ROMAN EMPIRE TO RELIGIONS</b><P class="in15">1. Roman or State Religion<P class="in15">2. Non-Roman Religions—religiones licitae and religiones illicitae<P class="in30">(1) Judaism a religio licita<P class="in30">(2) Why Christianity Was Alone Proscribed<P class="in30">(3) Two Empires: Causes of Conflict<P class="in45">(a) Confusion of Spiritual and Temporal<P class="in45">(b) Unique Claims of Christianity<P class="in45">(c) Novelty of Christianity<P class="in45">(d) Intolerance and Exclusiveness of the Christian Religion and Christian Society<P class="in45">(e) Obstinatio<P class="in45">(f) Aggressiveness against Pagan Faith<P class="in45">(g) Christianos ad leones: Public Calamities<P class="in45">(h) Odium generis humani<P class="in30">(4) The Roman Empire Not the Only Disturbing Factor<P><b>IV. RELATIONS BETWEEN THE ROMAN EMPIRE AND CHRISTIANITY</b><P class="in15">1. Beginning of Christianity until Death of Nero, 68 AD<P class="in15">2. Flavian Period, 68-96 AD<P class="in15">3. The Antonine Period, 96-192 AD<P class="in15">4. Changing Dynasties, 192-284 AD<P class="in15">5. Diocletian until First General Edict of Toleration, 284-311 AD<P class="in15">6. First Edict of Toleration until Extinction of Western Empire, 311-476 AD<P><b>V. VICTORY OF CHRISTIANITY AND CONVERSION OF THE ROMAN EMPIRE</b><P class="in15">1. Negative Causes<P class="in15">2. Positive Causes<P><b>LITERATURE</b><hr /><P>I. Outline of the Roman Empire.<P>1. Roman Empire a Result of Social Conflict:<P>The founding of the Roman empire was the grandest political achievement ever accomplished. The conquests of Alexander the Great, Charlemagne and Napoleon seem small compared with the durable structure reared by Julius and his successor, Augustus. In one sense Julius Caesar—the most wonderful man that Rome or any other country produced—was the founder of the empire, and Augustus the founder of the principate. But the Roman empire was the culmination of a long process of political, constitutional, and social growth which gives a lasting interest to Roman history. The Roman empire was the only possible solution of a 700 years\' struggle, and Roman history is the story of the conflict of class with class, patrician against plebeian, populus against plebs, the antagonism of oligarchy and democracy, plutocracy against neglected masses. It is the account of the triumphant march of democracy and popular government against an exclusive governing caste. Against heavy odds the plebeians asserted their rights till they secured at least a measure of social, political and legal equality with their superiors (see <a href="./study/isbe/search.html?string=ROME">ROME</a>, I, 2-4). But in the long conflict both parties degenerated until neither militant democracy nor despotic oligarchy could hold the balance with justice. Democracy had won in the uphill fight, but lost itself and was obliged to accept a common master with aristocracy. It was of no small importance for Christianity that the Roman empire—practically synonymous with the orbis terrarum—had been converging both from internal and external causes toward a one-man government, the political counterpart of a universal religion with one God and Saviour.<P>(1) Julius Caesar.<P>For a couple of generations political leaders had foreseen the coming of supreme power and had tried to grasp it. But it was Julius Caesar who best succeeded in exploiting democracy for his own aggrandizement. He proved the potent factor of the first triumvirate (60 BC); his consulship (59) was truly kingly. In 49 BC he crossed the Rubicon and declared war upon his country, but in the same year was appointed Dictator and thus made his enemies the enemies of his country. He vanquished the Pompeians—senatorial and republican—at Pharsalia in 48 BC, Thapsus in 46 BC, and Munda in 45 BC. Between 46 and the Ides of March 44 no emperor before Diocletian was more imperial. He was recognized officially as "demigod"; temples were dedicated to his "clemency." He encouraged the people to abdicate to him their privileges of self-government and right of election, became chief (princeps) of the senate and high priest (pontifex maximus), so that he could manipulate even the will of the gods to his own purposes. His plans were equally great and beneficent. He saw the necessity of blending the heterogeneous populations into one people and extending Roman citizenship. His outlook was larger and more favorable to the coming of Christianity than that of his successor, Augustus. The latter learned from the fate of Caesar that he had advanced too rapidly along the imperial path. It taught Augustus caution.<P>(2) Augustus.<P>Octavian (Augustus) proved the potent factor of the second triumvirate. The field of Actiuim on September 2, 31 BC, decided the fate of the old Roman republic. The commonwealth sank in exhaustion after the protracted civil and internecine strife. It was a case of the survival of the fittest. It was a great crisis in human history, and a great man was at hand for the occasion. Octavian realized that supreme power was the only possible solution. On his return to Rome he began to do over again what Caesar had done—gather into his own hands the reins of government. He succeeded with more caution and shrewdness, and became the founder of the Roman empire, which formally began on January 16, 27 BC, and was signalized by the bestowal of the title <a href="./study/isbe/search.html?string=AUGUSTUS">AUGUSTUS</a> (which see). Under republican forms he ruled as emperor, controlling legislation, administration and the armies. His policy was on the whole adhered to by the Julio-Claudian line, the last of which was Nero (died 68 AD).<P>(3) Flavian Dynasty.<P>In 68 AD a new "secret of empire" was discovered, namely, that the principate was not hereditary in one line and that emperors could be nominated by the armies. After the bloody civil wars of 68, "the year of the four emperors," Vespasian founded the IInd Dynasty, and dynastic succession was for the present again adopted. With the Flavians begins a new epoch in Roman history of pronounced importance for Christianity. The exclusive Roman ideas are on the wane. Vespasian was of plebeian and Sabine rank and thus non-Roman, the first of many non-Roman emperors. His ideas were provincial rather than Roman, and favorable to the amalgamation of classes, and the leveling process now steadily setting in. Though he accepted the Augustan "diarchy," he began to curtail the powers of the senate. His son Titus died young (79-81). Domitian\'s reign marks a new epoch in imperialism: his autocratic spirit stands half-way between the Augustan principate and the absolute monarchy of Diocletian. Domitian, the last of the "twelve Caesars" (Suetonius), was assassinated September 18, 96 AD. The soldiers amid civil war had elected the last dynasty. This time the senate asserted itself and nominated a brief series of emperors—on the whole the best that wore the purple.<P>(4) Adoptive or Antonine Emperors.<P>The Antonine is another distinct era marked by humane government, recognition of the rights of the provinces and an enlargement of the ideas of universalism. Under Trajan the empire was extended; a series of frontier blockades was established—a confession that Rome could advance no farther. Under Hadrian a policy of retreat began; henceforth Rome is never again on the aggressive but always on the defensive against restless barbarians. Unmistakable signs of weakness and decay set in under Antoninus Pius and Marcus Aurelius. This, the best and happiest period of Roman imperial government, was the beginning of the end. In this era we detect a growing centralization of authority; the senate practically becomes a tool of the emperor. A distinct civil service was established which culminated in bureaucracy under Hadrian.<P>(5) Changing Dynasties, 193-284 AD.<P>On the death of Commodus, whose reign 180-93 AD stands by itself, the empire was put up for sale by the soldiery and knocked down to the highest bidder. The military basis of the empire was emphasized—which was indeed essential in this period of barbaric aggressiveness to postpone the fall of the empire until its providential mission was accomplished. A rapid succession of rulers follows, almost each new ruler bringing a new dynasty. Those disintegrating forces set in which developed so rapidly from the reign of Diocletian. The pax Romana had passed; civil commotion accentuated the dangers from invading barbarians. Plague and famine depopulated rich provinces. Rome itself drops into the background and the provincial spirit asserts itself proportionally. The year 212 AD is memorable for the edict of Caracalla converting all the free population into Roman citizens.<P>(6) From Diocletian until Partition.<P>In the next period absolute monarchy of pure oriental type was established by Diocletian, one of the ablest of Roman rulers. He inaugurated the principle of division and subdivision of imperial power. The inevitable separation of East and West, with the growing prominence of the East, becomes apparent. Rome and Italy are reduced to the rank of provinces, and new courts are opened by the two Augusti and two Caesars. Diocletian\'s division of power led to civil strife, until Constantine once more united the whole empire under his sway. The center of gravity now shifted from West to East by the foundation of Constantinople. The empire was again parceled out to the sons of Constantine, one of whom, Constantius, succeeded in again reuniting it (350 AD). In 364 it was again divided, Valentinian receiving the West and Valens the East.<P>(7) Final Partition.<P>On the death of Theodosius I (395), West and East fell to his sons Honorius and Arcadius, never again to be united. The western half rapidly degenerated before barbaric hordes and weakling rulers. The western provinces and Africa were overrun by conquering barbarians who set up independent kingdoms on Roman soil. Burgundians and Visigoths settled in Gaul; the latter established a kingdom in Spain. The Vandals under Genseric settled first in Southern Spain, then crossed to Africa and reduced it. Goths burst over Roman frontiers, settled in Illyria and invaded Italy. Alaric and his Goths spared Rome in 408 for a ransom; in 409 he appeared again and set up Attalus as king of the Romans, and finally in 410 he captured and sacked the city. It was again sacked by the Vandals under Genseric in 462, and, lastly, fell before Odoacer and his Germans in 476; he announced to the world that the empire of the West had ceased. The empire of the East continued at Constantinople the greatest political power through a chequred history down to the capture of the city in 1214 and its final capture by the Turks in 1453, when its spiritual and intellectual treasures were opened to western lands and proved of untold blessing in preparing the way for the Reformation of the 16th century. The East conquered the West intellectually and spiritually. In the East was born the religion of humanity.<P>2. Coming of the Monarchy:<P>(1) Exhaustion of Parties.<P>The Roman world had for two generations been steadily drifting toward monarchy, and at least one generation before the empire was set up clear minds saw the inevitable necessity of one-man government or supreme power, and each political leader made it his ambition to grasp it. The civil wars ceased for a century with the death of Antony. But the struggles of Tiberius Gracchus and Scipio Aemilianus, Caius Gracchus and Opimius, Drusus and Philippus, Marius and Sulla, Pompey and Caesar, and lastly Octavian and Antony had exhausted the state, and this exhaustion of political parties opened the way for monarchy. In fact it was a necessity for the welfare of the commonwealth that one should be elevated who could fairly hold the balance between oligarchy and the commons and duly recognize the claims of all parties. Even Cato Uticensis—the incarnation of republican ideas—admitted it would be better to choose a master than wait for a tyrant. The bloody wars could find no solution except the survival of the fittest. Moreover, the free political institutions of Rome had become useless and could no longer work under the armed oppression of factions. If any form of government, only supreme power would prove effectual amid an enfeebled, unpopular senate, corrupt and idle commons, and ambitious individuals.<P>(2) Inability of Either Aristocracy or Democracy to Hold Equilibrium.<P>Events had proved that a narrow exclusive aristocracy was incapable of good government because of its utterly selfish policy and disregard for the rights of all lower orders. It had learned to burke liberty by political murders. Neither was the heterogeneous population of later Rome disciplined to obey or to initiate just government when it had seized power. This anarchy within the body politic opened an easy way to usurpation by individuals. No republic and no form of free popular government could live under such conditions. Caesar said of the republic that it was "a name without any substance," and Curio declared it to be a "vain chimera." The law courts shared in the general corruption. The judicia became the bone of contention between the senate and the knights as the best instrument for party interests, and enabled the holders<P>(a) to receive large bribes,<P>(b) to protect their own order when guilty of the most flagrant injustice, and<P>(c) to oppress other orders.<P>Justice for all, and especially for conquered peoples, was impossible. Elective assemblies refused to perform their proper functions because of extravagant bribery or the presence of candidates in arms. In fact, the people were willing to forego the prerogative of election and accept candidates at the nomination of a despotic authority. The whole people had become incapable of self-government and were willing—almost glad—to be relieved of the necessity.<P>(3) Precedents.<P>Besides, precedents for one-man government, or the concentration of supreme power in one hand, were not wanting, and had been rapidly multiplying in Roman history as it drew nearer to the end of the republic. Numerous protracted commands and special commissions had accustomed the state to the novelty of obedience without participation in administration. The 7 consulships of Marius, the 4 of Cinna, the 3 extraordinary commissions of Pompey and his sole consulship, the dictatorship of Sulla without time limit, the two 5-year-period military commands of Caesar, his repeated dictatorships the last of which was to extend for 10 years—all these were pointing directly toward Caesarism.<P>(4) Withdrawal from Public Life: Individualism.<P>On another side the way was opened to supreme power by the increasing tendency for some of the noblest and best minds to withdraw from public life to the seclusion of the heart life and thus leave the field open for demagogic ambition. After the conquests of Alexander the Great, philosophy abandoned the civic, political or city-state point of view and became moral and individual. Stoicism adopted the lofty spiritual teachings of Plato and combined them with the idea of the brotherhood of humanity. It also preached that man must work out his salvation, not in public political life, but in the secret agonies of his own soul. This religion took hold of the noblest Roman souls who were conscious of the weariness of life and felt the desire for spiritual fellowship and comfort. The pendulum in human systems of thought generally swings to the opposite extreme, and these serious souls abandoned public life for private speculation and meditation. Those who did remain at the helm of affairs—like the younger Cato—were often too much idealists, living in the past or in an ideal Platonic republic, and proved very unequal to the practical demagogues who lived much in the present with a keen eye to the future. Also a considerable number of the moderate party, who in better days would have furnished leaders to the state, disgusted with the universal corruption, saddened by the hopeless state of social strife and disquieted by uncertainty as to the issue of victory for either contending party, held aloof and must have wished for and welcomed a paramount authority to give stability to social life. Monarchy was in the air, as proved by the sentiments of the two pseudo-Sallustian letters, the author of which calls upon Caesar to restore government and reorganize the state, for if Rome perish the whole world must perish with her.<P>(5) Industrial.<P>To another considerable class monarchy must have been welcome—the industrial and middle class who were striving for competence and were engaged in trade and commerce. Civil wars and the strife of parties must have greatly hindered their activity. They cast their lot neither with the optimates nor with the idle commonalty. They desired only a stable condition of government under which they could uninterruptedly carry on their trades.<P>(6) Military.<P>Military conditions favored supreme power. Not only had the lengthened commands familiarized the general with his legions and given him time to seduce the soldiery to his own cause, but the soldiery too had been petted and spoiled like the spoon-fed populace. The old republican safeguards against ambition had been removed. The ranks of the armies had also been swollen with large numbers of provincials and non-Romans who had no special sentiment about republican forms. We have seen the military power growing more and more prominent. The only way of averting a military despotism supported and prompted by the soldiers was to set up a monarchy, holding all the military, legislative and administrative functions of the state in due proportion. This was superior to a merely nominal republic always cringing under fear of military leaders.<P>(7) Imperial Interests.<P>Lastly, the aggression and conquests of the republic had brought about a state of affairs demanding an empire. The East and the West had been subdued; many provinces and heterogeneous populations were living under the Roman eagle. These provinces could not permanently be plundered and oppressed as under the republican senate. The jus civile of Rome must learn also the jus naturale and jus gentium. An exclusive selfish senatorial clique was incapable of doing justice to the conquered peoples. One supreme ruler over all classes raised above personal ambition could best meet their grievances. The senate had ruled with a rod of iron; the provinces could not possibly be worse under any form of government. Besides, monarchy was more congenial to the provincials than a republic which they could not comprehend.<P>(8) Influence of Orient.<P>The Orientals had long been used to living under imperial and absolute forms of government and would welcome such a form among their new conquerors. Besides, residence in the Orient had affected Roman military leaders with the thirst after absolute power. And no other form was possible when the old city-state system broke down, and as yet federal government had not been dreamed of. Another consideration: the vast and dissimilar masses of population living within the Roman dominions could more easily be held together under a king or emperor than by a series of ever-changing administrations, just as the Austro-Hungarian and the British empires are probably held together better under the present monarchies than would be possible under a republican system. This survey may make clear the permanent interest in Roman history for all students of human history. The Roman empire was established indeed in the fullness of the times for its citizens and for Christianity.<P>II. Preparation of the Roman Empire for Christianity.<P>About the middle of the reign of Augustus a Jewish child was born who was destined to rule an empire more extensive and lasting than that of the Caesars. It is a striking fact that almost synchronous with the planting of the Roman empire Christianity appeared in the world. Although on a superficial glance the Roman empire may seem the greatest enemy of early Christianity, and at times a bitter persecutor, yet it was in many ways the grandest preparation and in some ways the best ally of Christianity. It ushered in politically the fullness of the times. The Caesars—whatever they may have been or done—prepared the way of the Lord. A brief account must here be given of some of the services which the Roman empire rendered to humanity and especially to the kingdom of God.<P>1. Pax Romana and the Unification of the World:<P>The first universal blessing conferred by the empire was the famous pax Romana ("Roman peace"). The world had not been at peace since the days of Alexander the Great. The quarrels of the Diadochi, and the aggression of the Roman republic had kept the nations in a state of constant turmoil. A universal peace was first established with the beginning of the reign of Augustus and the closing of the temple of Janus. In all the countries round the Mediterranean and from distant Britain to the Euphrates the world was at rest. Rome had made an end of her own civil wars and had put a stop to wars among the nations. Though her wars were often iniquitous and unjustifiable, and she conquered like a barbarian, she ruled her conquests like a humane statesman. The quarrels of the Diadochi which caused so much turmoil in the East were ended, the territory of the Lagids; Attalids, Seleucids and Antigonids having passed under the sway of Rome. The empire united Greeks, Romans and Jews all under one government. Rome thus blended the nations and prepared them for Christianity. Now for the first time we may speak of the world as universal humanity, the orbis terrarum, he oikoumene (<a onClick="return mV(\'Luk\',2,1);">Lu 2:1</a>), the genus humanum. These terms represented humanity as living under a uniform system of government. All were members of one earthly state; the Roman empire was their communis omnium patria.<P>2. Cosmopolitanism:<P>This state of affairs contributed largely to the spread of cosmopolitanism which had set in with the Macedonia conqueror. Under the Roman empire all national barriers were removed; the great cities—Rome, Alexandria, Antioch, etc.—became meeting-places of all races and languages. The Romans were everywhere carrying their laws and civilization; Greeks settled in thousands at all important centers as professors, merchants, physicians, or acrobats; Orientals were to be found in large numbers with their gods and mysteries in Rome, "the epitome of the world." In the Roman armies soldiers from all quarters of the empire became companions. And many thousands of slaves of fine education and high culture contributed much to cosmopolitanism. Being in many cases far superior in culture to their masters, they became their teachers. And in every city of importance, East or West, large bodies of the Jewish Diaspora were settled.<P>3. Eclecticism:<P>This cosmopolitanism gave great impetus to a corresponding eclecticism of thought. Nothing could have been more favorable to Christianity than this intermixture of all races and mutual exchange of thought. Each people discovered how much it had in common with its neighbors. From the days of the Diadochi, Stoicism had been preaching the gospel of a civic and ethical brotherhood of humanity. In the fusion of different philosophic systems the emphasis had shifted from the city-state or political or national to the moral and human point of view. All men were thus reduced to equality before the One; only virtue and vice were the differentiating factors. Men were akin with the divine—at least the wise and good—so that one poet could say, "We are His offspring."<P>Stoicism did a noble service in preparation for Christianity by preaching universalism along the path of individualism. It also furnished comfort and strength to countless thousands of weary human lives and ministered spiritual support and calm resignation at many a heathen deathbed. It may be declared to be the first system of religious thought—for it was a religion more than a philosophy—which made a serious study of the diseases of the human soul. We know of course its weakness and imperfections, that it was an aristocratic creed appealing only to the elect of mortals, that it had little message for the fallen and lower classes, that it was cold and stern, that it lacked—as Seneca felt—the inspiration of an ideal life. But with all its failures it proved a worthy pedagogue to a religion which brought a larger message than that of Greece. It afforded the spiritual and moral counterpart to the larger human society of which the Roman empire was the political and visible symbol. Hitherto a good citizen had been a good man. Now a good man is a good citizen, and that not of a narrow city-state, but of the world. Stoicism also proved tile interpreter and mouthpiece to the Roman empire of the higher moral and spiritual qualities of Greek civilization; it diffused the best convictions of Greece about God and man, selecting those elements that were universal and of lasting human value.<P>See <a href="./study/isbe/search.html?string=STOICS">STOICS</a>.<P>The mind of the Roman empire was further prepared for Christianity by the Jewish Diaspora. Greeks learned from Jews and Jews from Greeks and the Romans from both. The unification effected by Roman Law and administration greatly aided the Diaspora. Jewish settlements became still more numerous and powerful both in the East and West. Those Jews bringing from the homeland the spiritual monotheism of their race combined it with Greek philosophy which had been setting steadily for monotheism. With the Jews the exclusively national element was subordinated to the more human and universal, the ceremonial to the religious. They even adopted the world-language of that day—Greek—and had their sacred Scriptures translated into this language in which they carried on an active proselytism. The Roman spirit was at first essentially narrow and exclusive. But even the Romans soon fell beneath the spell of this cosmopolitanism and eclecticism. As their conquests increased, their mind was correspondingly widened. They adopted the policy of Alexander—sparing the gods of the conquered and admitting them into the responsibility of guarding Rome; they assimilated them with their own Pantheon or identified them with Roman gods. In this way naturally the religious ideas of conquered races more highly civilized than the conquerors laid hold on Roman minds.<P>See <a href="./study/isbe/search.html?string=DISPERSION">DISPERSION</a>.<P>4. Protection for Greek Culture:<P>Another inestimable service rendered to humanity and Christianity was the protection which the Roman power afforded the Greek civilization. We must remember that the Romans were at first only conquering barbarians who had little respect for culture, but idealized power. Already they had wiped out two ancient and superior civilizations—that of Carthage without leaving a trace, and that of Etruria, traces of which have been discovered in modern times. It is hard to conceive what a scourge Rome would have proved to the world had she not fallen under the influence of the superior culture and philosophy of Greece. Had the Roman Mars not been educated by Pallas Athene the Romans would have proved Vandals and Tartars in blotting out civilization and arresting human progress. The Greeks, on the other hand, could conquer more by their preeminence in everything that pertains to the intellectual life of man than they could hold by the sword. A practical and political power was needed to protect Greek speculation. But the Romans after causing much devastation were gradually educated and civilized and have contributed to the uplifting and enlightenment of subsequent civilizations by both preserving and opening to the world the spiritual qualities of Greece. The kinship of man with the divine, learned from Socrates and Plato, went forth on its wide evangel. This Greek civilization, philosophy and theology trained many of the great theologians and leaders of the Christian church, so that Clement of Alexandria said that Greek philosophy and Jewish law had proved schoolmasters to bring the world to Christ. Paul, who prevented Christianity from remaining a Jewish sect and proclaimed its universalism, learned much from Greek—especially from Stoic—thought. It is also significant that the early Christian missionaries apparently went only where the Greek language was known, which was the case in all centers of Roman administration.<P>5. Linguistically:<P>The state of the Roman empire linguistically was in the highest degree favorable to the spread of Christianity. The Greek republics by their enterprise, superior genius and commercial abilities extended their dialects over the Aegean Islands, the coasts of Asia Minor, Sicily and Magna Graecia. The preeminence of Attic culture and literature favored by the short-lived Athenian empire raised this dialect to a standard among the Greek peoples. But the other dialects long persisted. Out of this babel of Greek dialects there finally arose a normal koine or "common language." By the conquests of Alexander and the Hellenistic sympathies of the Diadochi this common Greek language became the lingua franca of antiquity. Greek was known in Northern India, at the Parthian court, and on the distant shores of the Euxine (Black Sea). The native land of the gospel was surrounded on all sides by Greek civilization. Greek culture and language penetrated into the midst of the obstinate home-keeping Palestinian Jews. Though Greek was not the mother-tongue of our Lord, He understood Greek and apparently could speak it when occasion required—Aramaic being the language of His heart and of His public teachings. The history of the Maccabean struggle affords ample evidence of the extent to Which Greek culture, and with it the Greek language, were familiar to the Jews. There were in later days Hellenistic bodies of devout Jews in Jerusalem itself. Greek was recognized by the Jews as the universal language: the inscription on the wall of the outer temple court forbidding Gentiles under pain of death to enter was in Greek. The koine became the language even of religion—where a foreign tongue is least likely to be used—of the large Jewish Diaspora. They perceived the advantages of Greek as the language of commerce—the Jews\' occupation—of culture and of proselytizing. They threw open their sacred Scriptures in the Septuagint and other versions to the Greek-Roman world, adapting the translation in many respects to the requirements of Greek readers. "The Bible whose God was Yahweh was the Bible of one people: the Bible whose God was (kurios, "Lord") was the Bible of humanity." When the Romans came upon the scene, they found this language so widely known and so deeply rooted they could not hope to supplant it. Indeed they did not try—except in Sicily and Magna Graecia—to suppress Greek, but rather gladly accepted it as the one common means of intercourse among the peoples of their eastern dominions.<P>See <a href="./study/isbe/search.html?string=LANGUAGE+OF+THE+NEW+TESTAMENT">LANGUAGE OF THE NEW TESTAMENT</a>.<P>Though Latin was of course the official language of the conquerors, the decrees of governors generally appeared with a Greek translation, so that they might be "understanded of the people," and Greek overcame Latin, as English drove out the French of the Norman invaders. Latin poets and historians more than once complained that Graecia capta ferum victorem cepit ("conquered Greece vanquished its stern conqueror"). With the spread of Latin there were two world-languages side by side for the whole Roman empire, but Greek was prevailingly the language of the eastern half of the Roman empire which was the first soil for Christian churches and the first half of the empire to be Christianized. Later when Christianity was able to extend her activity to the West, she found Latin ready as the common means of intercourse. That Rome respected Greek is greatly to her credit and much to the advantage of Christianity. For Christianity, when it began to aim at universalism, dropped its native Aramaic. The gospel in order to become a world-evangel was translated into Greek. The early Christian missionaries did not learn the languages or patois of the Roman empire, but confined themselves to centers of Greek culture. Paul wrote in Greek to the church in Rome itself, of which Greek was the language. And while Christianity was spreading through the Greek East under the unification of Roman administration, the Romans were Romanizing and leveling the West for Latin Christianity (see <a href="./study/isbe/search.html?string=LATIN">LATIN</a>). In the West it may be noted that the first foothold of the Christian religion was in Greek—witness the church in Gaul.<P>6. Materially:<P>In material ways too Rome opened the way for Christianity by building the great highways for the gospel. The great system of roads that knit then civilized world together served not only the legions and the imperial escorts, but were of equal service to the early missionaries, and when churches began to spring up over the empire, these roads greatly facilitated that church organization and brotherhood which strengthened the church to overcome the empire. With the dawn of the pax Romana all these roads became alive once more with a galaxy of caravans and traders. Commerce revived and was carried on under circumstances more favorable than any that obtained till the past century. Men exchanged not only material things, but also spiritual things. Many of these early traders and artisans were Christians, and while they bought and sold the things that perish, they did not lose an opportunity of spreading the gospel. For an empire which embraced the Mediterranean shores, the sea was an important means of intercommunication; and the Mediterranean routes were safer for commerce and travel at that period than during any previous one. Pompey the Great had driven the pirates off the sea, and with the fall of Sextus Pompey no hostile maritime forces remained. The ships which plied in countless numbers from point to point of this great inland sea offered splendid advantages and opportunity for early Christian missionary enthusiasm.<P>7. Tolerance:<P>The large measure of freedom permitted by Roman authorities to the religions of all nations greatly favored the growth of infant Christianity. The Roman empire was never in principle a persecutor with a permanent court of inquisition. Strange cults from the East and Egypt flourished in the capital, and except when they became a danger to public morality or to the peace of society they were allowed to spread unchecked under the eyes of the police. See below on non-Roman religions.<P>8. Pattern for a Universal Church:<P>Further, the Roman empire afforded Christianity a material and outward symbol for its spiritual ambition. It enlarged the vision of the church. Only a citizen (Paul) of such a world-empire could dream of a religion for all humanity. If the Roman sword could so conquer and unify the orbis terrarum, the militant church should be provoked to attempt nothing less in the religious sphere. It also furnished many a suggestion to the early organizers of the new community, until the Christian church became the spiritual counterpart of the Roman empire. The Christians appropriated many a weapon from the arsenal of the enemy and learned from them aggressiveness, the value of thorough organization and of military methods.<P>9. Roman Jurisprudence:<P>Roman law in its origins was characterized by the narrowest exclusiveness, and the first formal Roman code was on Greek patterns, yet the Romans here as in so many other respects improved upon what they had borrowed and became masters of jurisprudence in the antique world. As their empire and conceptions expanded, they remodeled their laws to embrace all their subjects. One of the greatest boons conferred by Rome upon the antique world was a uniform system of good laws—the source of much of our European jurisprudence. The Roman law played an equally important role with the Jewish in molding and disciplining for Christianity. It taught men to obey and to respect authority, and proved an effective leveling and civilizing power in the empire. The universal law of Rome was the pedagogue for the universal law of the gospel.<P>See <a href="./study/isbe/search.html?string=ROMAN+LAW">ROMAN LAW</a>.<P>10. Negative Preparation:<P>The Romans could offer their subjects good laws, uniform government and military protection, but not a satisfactory religion. A universal empire called for a universal religion, which Christianity alone could offer. Finally, not only by what Rome had accomplished but by what she proved incapable of accomplishing, the way of the Lord was made ready and a people prepared for His coming. It was a terrible crisis in the civilization and religion of antiquity. The old national religions and systems of belief had proved unable to soothe increasing imperious moral and spiritual demands of man\'s nature. A moral bankruptcy was immanent. The old Roman religion of abstract virtues had gone down in formalism; it was too cold for human hearts. Man could no longer find the field of his moral activity in the religion of the state; he was no longer merely an atom in society performing religious rites, not for his own soul, but for the good of the commonwealth. Personality had been slowly emerging, and the new schools of philosophy called man away from the state to seek peace with God in the solitude of his own soul first of all. But even the best of these schools found the crying need of a positive, not a negative religion, the need for a perfect ideal life as a dynamic over ordinary human lives. Thus was felt an imperious demand for a new revelation, for a fresh vision or knowledge of God. In earlier days men had believed that God had revealed Himself to primitive wise men or heroes of their race, and that subsequent generations must accept with faith what these earlier seers, who stood nearer God, as Cicero said, had been pleased to teach of the divine. But soon this stock of knowledge became exhausted. Plato, after soaring to the highest point of poetic and philosophic thought about the divine, admitted the need of a demon or superman to tell us the secrets of eternity. With the early Roman empire began a period of tremendous religious unrest. Men tried philosophy, magic, astrology, foreign rites, to find a sure place of rest. This accounts for the rapid and extensive diffusion of oriental mysteries which promised to the initiated communion with God here, a "better hope" in death, and satisfied the craving for immortality beyond time. These were the more serious souls who would gladly accept the consolations of Jesus. Others, losing all faith in any form of religion, gave themselves up to blank despair and accepted Epicureanism with its gospel of annihilation and its carpe diem morals. This system had a terrible fascination for those who had lost themselves; it is presented in its most attractive form in the verses of Lucretius—the Omar Khayyam of Latin literature. Others again, unable to find God, surrendered themselves to cheerless skepticism. The sore need of the new gospel of life and immortality will be borne in upon the mind of those who read the Greek and Roman sepulchral inscriptions. And even Seneca, who was almost a Christian in some respects, speaks of immortality as a "beautiful dream" (bellum somnium), though tribulation later gave a clearer vision of the "city of God." Servius Sulpicius, writing to Cicero a letter of consolation on the death of his much-missed Tullia, had only a sad "if" to offer about the future (Cic. Fam. iv.5). Nowhere does the unbelief and pessimism of pre-Christian days among the higher classes strike one more forcibly than in the famous discussion recorded by Sallust (Bel. Cat. lif) as to the punishment of the Catilinarian conspirators. Caesar, who held the Roman high-priesthood and the highest authority on the religion of the state, proposes life imprisonment, as death would only bring annihilation and rest to these villains—no hereafter, no reward or punishment (eam cuncta mortalium mala dissolvere; ultra neque curae neque gaudio locum esse). Cato next speaks—the most religious man of his generation—in terms which cast no rebuke upon Caesar\'s Epicureanism and materialism (ibid., 52). Cicero (In Cat. iv.4) is content to leave immortality an open question. The philosophers of Athens mocked Paul on Mars\' Hill when he spoke of a resurrection. Such was the attitude of the educated classes of the Greek-Roman world at the dawn of Christianity, though it cannot be denied that there was also a strong desire for continued existence. The other classes were either perfunctorily performing the rites of a dead national religion or wereseeking, some, excitement or aesthetic worship or even scope for their baser passions, some, peace and promise for the future, in the eastern mysteries. The distinction between moral and physical evil was coming to the surface, and hence, a consciousness of sin. Religion and ethics had not yet been united. "The throne of the human mind" was declared vacant, and Christianity was at hand as the best claimant. In fact, the Greek-Roman mind had been expanding to receive the pure teachings of Jesus.``5';
isbe[7480]='Roman Empire And Christianity, 2`III. Attitude of the Roman Empire to Religions.<P>1. Roman or State Religion:<P>The history of Roman religion reveals a continuous penetration of Italian, Etruscan, Greek, Egyptian and oriental worship and rites, until the old Roman religion became almost unrecognizable, and even the antiquarian learning of a Varro could scarcely discover the original meaning or use of<P>many Roman deities. The Roman elements or modes of worship progressively retreated until they and the foreign rites with which they were overlaid gave way before the might of Christianity. As Rome expanded, her religious demands increased. During the regal period Roman religion was that of a simple agricultural community. In the period between the Regifugium and the Second Punic War Roman religion became more complicated and the Roman Pantheon was largely increased by importations from Etruria, Latium and Magna Graecia. The mysterious religion of Etruria first impressed the Roman mind, and from this quarter probably came the Trinity of the Capitol (Jupiter, Juno, Minerva) previously introduced into Etruria from Greek sources, thus showing that the Romans were not the first in Italy to be influenced by the religion of Greece. New modes of worship, non-Roman in spirit, also came in from the Etruscans and foreign elements of Greek mythology. Latium also made its contribution, the worship of Diana coming from Aricia and also a Latin Jupiter. Two Latin cults penetrated even within the Roman pomoerium—that of Hercules and Castor, with deities of Greek origin. The Greek settlements in Southern Italy (Magna Graecia) were generous in their contributions and opened the way for the later invasion of Greek deities. The Sibylline Books were early imported from Cumae as sacred scriptures for the Romans. In 493 BC during a famine a temple was built to the Greek trinity Demeter, Dionysus, and Persephone, under the Latin names of Ceres, Liber, and Libera—the beginning of distrust in the primitive Roman numina and of that practice, so oft repeated in Roman history, of introducing new and foreign gods at periods of great distress. In 433 Apollo came from the same region. Mercury and Asclepius followed in 293 BC, and in 249 BC Dis and Proserpina were brought from Tarentum. Other non-Roman modes of approach to deity were introduced. Rome had been in this period very broad-minded in her policy of meeting the growing religious needs of her community, but she had not so far gone beyond Italy. A taste had also developed for dramatic and more aesthetic forms of worship. The period of the Second Punic War was a crisis in Roman religious life, and the faith of the Romans waned before growing unbelief. Both the educated classes and the populace abandoned the old Roman religion, the former sank into skepticism, the latter into superstition; the former put philosophy in the place of religion, the latter the more sensuous cults of the Orient. The Romans went abroad again to borrow deities—this time to Greece, Asia and Egypt. Greek deities were introduced wholesale, and readily assimilated to or identified with Roman deities (see <a href="./study/isbe/search.html?string=ROME">ROME, III, 1</a>). In 191 BC Hebe entered as Juventas, in 179 Artemis as Diana, in 138 Ares as Mars. But the home of religion—the Orient—proved more helpful. In 204 BC Cybele was introduced from Pessinus to Rome, known also as the Great Mother (magna mater)—a fatal and final blow to old Roman religion and an impetus to the wilder and more orgiastic cults and mysterious glamor which captivated the common mind. Bacchus with his gross immorality soon followed. Sulla introduced Ma from Phrygia as the counterpart of the Roman Bellona, and Egypt gave Isis. In the wars of Pompey against the pirates Mithra was brought to Rome—the greatest rival of Christianity. Religion now began to pass into the hands of politicians and at the close of the republic was almost entirely in their hands. Worship degenerated into formalism, and formalism culminated in disuse. Under the empire philosophic systems continued still more to replace religion, and oriental rites spread apace. The religious revival of Augustus was an effort to breathe life into the dry bones. His plan was only partly religious, and partly political—to establish an imperial and popular religion of which he was the head and centering round his person. He discovered the necessity of an imperial religion. In the East kings had long before been regarded as divine by their subjects. Alexander the Great, like a wise politician, intended to use this as one bond of union for his wide dominions. The same habit extended among the Diadochian kings, especially in Egypt and Syria. When Augustus had brought peace to the world, the Orient was ready to hail him as a god. Out of this was evolved the cult of the reigning emperor and of Roma personified. This worship gave religious unity to the empire, while at the same time magnifying the emperor. But the effort was in vain: the old Roman religion was dead, and the spiritual needs of the empire continued to be met more and more by philosophy and the mysteries which promised immortality. The cult of the Genius of the emperor soon lost all reality. Vespasian himself on his deathbed jested at the idea of his becoming a god. The emperor-worship declined steadily, and in the 3rd and 4th centuries oriental worships were supreme. The religion of the Roman empire soon became of that cosmopolitan and eclectic type so characteristic of the new era.<P>2. Non-Roman Religions: religiones licitae and religiones illicitae:<P>The non-Roman religions were divided into religiones licitae ("licensed worships") and religiones illicitae ("unlicensed"). The Romans at different times, on account of earthquakes, pestilences, famine or military disasters, introduced non-Roman cults as means of appeasing the numina. This generally meant that the cults in question could be performed with impunity by their foreign adherents. It legalized the collegia necessary for these worships from which Roman citizens were by law excluded. But, generally speaking, any people settling at Rome was permitted the liberty of its own native worship in so far as the exercise of it did not interfere with the peace of the state or corrupt the morals of society. On one occasion (186 BC), by a decree of the senate, a severe inquisition was instituted against the Bacchanalian rites which had caused flagrant immorality among the adherents. But Rome was never a systematic persecutor. These foreign rites and superstitions, though often forbidden and their professed adherents driven from the city, always returned stronger than ever. Roman citizens soon discovered the fascination of oriental and Greek mysteries, and devoted themselves to foreign gods while maintaining the necessary formalism toward the religion of the state. Very often too Roman citizens would be presidents of these religious brotherhoods. It should not be forgotten that the original moral elements had fallen out of Roman religion, and that it had become simply a political and military religion for the welfare of the state, not for the salvation of the individual. The individual must conform to certain prescribed rites in order to avert calamity from the state. This done, the state demanded no more, and left him a large measure of freedom in seeking excitement or aesthetic pleasure in the warm and more social foreign mysteries. Thus, while the Romans retained the distinction of religiones licitae and illicitae, they seldom used severity against the latter. Many unlicensed cults were never disturbed. In fact, the very idea of empire rendered toleration of non-Roman religions a necessity. Practically, though not theoretically, the empire abandoned the idea of religiones illicitae, while it retained it upon the statute-book to use in case of such an emergency as the Christian religion involved. Not only the government was tolerant, but the different varieties of religions were tolerant and on good terms with each other. The same man might be initiated into the mysteries of half a dozen divinities. The same man might even be priest of two or more gods. Some had not the slightest objection to worshipping Christ along with Mithra, Isis and Adonis. Men were growing conscious of the oneness of the divine, and credited their neighbors with worshipping the One Unknown under different names and forms. Hadrian is said to have meditated the erection of temples throughout the empire to the Unknown God.<P>(1) Judaism a "religio licita."<P>An interesting and, for the history of Christianity, important example of a religio licita is Judaism. No more exclusive and obstinate people could have been found upon whom to bestow the favor. Yet from the days of Julius Caesar the imperial policy toward the Jew and his religion was uniformly favorable, with the brief exception of the mad attempt of Gaius. The government often protected them against the hatred of the populace. Up to 70 AD they were allowed freely to send their yearly contribution to the temple; they were even allowed self-governing privileges and legislative powers among themselves, and thus formed an exclusive community in the midst of Roman society. Even the disastrous war of 68-70 AD and the fall of Jerusalem did not bring persecution upon the Jew, though most of these self-governing and self-legislating powers were withdrawn and the Jews were compelled to pay a poll-tax to the temple of the Capitoline Jupiter. Still their religion remained licensed, tolerated, protected. They were excused from duties impossible for their religion, such as military service. This tolerance of the Jewish religion was of incalculable importance to infant Christianity which at first professed to be no more than a reformed and expanded Judaism.<P>(2) Why Christianity Was Alone Proscribed.<P>The question next arises: If such was the universally mild and tolerant policy of the empire to find room for all gods and cults, and to respect the beliefs of all the subject peoples, how comes the anomaly that Christianity alone was proscribed and persecuted? Christianity was indeed a religio illicita, not having been accepted by the government as a religio licita, like Judaism. But this is no answer. There were other unlicensed religions which grew apace in the empire. Neither was it simply because Christianity was aggressive and given to proselytism and dared to appear even in the imperial household: Mithraism and Isism were militant and aggressive, and yet were tolerated. Nor was it simply because of popular hatred, for the Christian was not hated above the Jew. Other reasons must explain the anomaly.<P>(3) Two Empires: Causes of Conflict.<P>The fact was that two empires were born about the same time so like and yet so unlike as to render a conflict and struggle to the death inevitable. The Christians were unequivocal in asserting that the society for which they were waiting and laboring was a "kingdom."<P>(a) Confusion of Spiritual and Temporal:<P>They thought not merely in national or racial but in ecumenical terms. The Romans could not understand a kingdom of God upon earth, but confused Christian ambition with political. It was soon discovered that Christianity came not to save but to destroy and disintegrate the empire. Early Christian enthusiasm made the term "kingdom" very provoking to pagan patriotism, for many, looking for the Parousia of their Lord, were themselves misled into thinking of the new society as a kingdom soon to be set up upon the earth with Christ as king. Gradually, of course, Christians became enlightened upon this point, but the harm had been done. Both the Rein empire and Christianity were aiming at a social organization to embrace the genus humanum. But though these two empires were so alike in several points and the one had done so much to prepare the way for the other, yet the contrast was too great to allow conciliation. Christianity would not lose the atom in the mass; it aimed at universalism along the path of individualism—giving new value to human personality.<P>(b) Unique Claims of Christianity:<P>It seemed also to provoke Roman pride by its absurd claims. It preached that the world was to be destroyed by fire to make way for new heavens and a new earth, that the Eternal City (Rome) was doomed to fall, that a king would come from heaven whom Christians were to obey, that amid the coming desolations the Christians should remain tranquil.<P>(c) Novelty of Christianity:<P>Again after Christianity came from underneath the aegis of Judaism, it must have taken the government somewhat by surprise as a new and unlicensed religion which had grown strong under a misnomer. It was the newest and latest religion of the empire; it came suddenly, as it were, upon the stage with no past. It was not apparent to the Roman mind that Christianity had been spreading for a generation under the tolerance granted to Judaism (sub umbraculo licitae Judeorum religionis: Tert.), the latter of which was "protected by its antiquity," as Tacitus said. The Romans were of a conservative nature and disliked innovations. The greatest statesman of the Augustan era, Maecenas, advised the emperor to extend no tolerance to new religions as subversive of monarchy (Dio Cassius lii.36). A new faith appearing suddenly with a large clientele might be dangerous to the public peace (multitude ingens: Tac. Ann. xv.44; polu plethos Clem. Rom.; Cor 1 6).<P>(d) Intolerance and Exclusiveness of the Christian Religion and Christian Society:<P>In one marked way Christians contravcned the tolerant eclective spirit of the empire—the intolerance and absoluteness of their religion and the exclusiveness of their society. All other religions of the empire admitted compromise and eclecticism, were willing to dwell rather on the points of contact with their neighbors than on the contrast. But Christianity admitted no compromise, was intolerant to all other systems. It must be admitted that in this way it was rather unfair to other cults which offered comfort and spiritual support to thousands of the human race before the dawn of Christianity. But we shall not blame, when we recognize that for its own life and mission it was necessary to show itself at first intolerant. Many heathen would gladly accept Christ along with Mithra and Isis and Serapis. But Christianity demanded complete separation. The Jesus cult could tolerate no rival: it claimed to be absolute, and worshippers of Jesus must be separate from the world. The Christian church was absolute in its demands; would not rank with, but above, all worships. This spirit was of course at enmity with that of the day which enabled rival cults to co-exist with the greatest indifference. Add to this the exclusive state of Christian society. No pious heathen who had purified his soul by asceticism and the sacraments of antiquity could be admitted into membership unless he renounced things dear to him and of some spiritual value. In every detail of public life this exclusive spirit made itself felt. Christians met at night and held secret assemblies in which they were reputed to perpetrate the most scandalous crimes. Thyestean banquets, Oedipean incest, child murder, were among the charges provoked by their exclusiveness.<P>(e) Obstinatio:<P>Add to this also the sullen obstinacy with which Christians met the demands of imperial power—a feature very offensive to Rein governors. Their religion would be left them undisturbed if they would only render formal obedience to the religion of the state. Roman clemency and respect for law were baffled before Christian obstinacy. The martyr\'s courage appeared as sheer fanaticism. The pious Aurelius refers but once to Christianity, and in the words psile parataxis, "sheer obstinacy," and Aristides apparently refers to Christianity as authadeia, stubbornness.<P>See <a href="./study/is
