isbe[7484]='Roman; Romans`ro\'-man, ro\'-manz.`<a href="./study/isbe/search.html?string=ROME">ROME</a>; <a href="./study/isbe/search.html??string=CITIZENSHIP">CITIZENSHIP</a>`1';
isbe[7485]='Romans, Epistle to the`1. Its Genuineness<P>2. Its Integrity<P>3. The Approximate Date<P>4. The Place of Writing<P>5. The Destination<P>6. The Language<P>7. The Occasion<P>8. Some Characteristics<P>9. Main Teachings of the Epistle<P class="in15">(1) Doctrine of Man<P class="in15">(2) Doctrine of God<P class="in15">(3) Doctrine of Son of God—Redemption; Justification<P class="in15">(4) Doctrine of the Spirit of God<P class="in15">(5) Doctrine of Duty<P class="in15">(6) Doctrine of Israel<P><b>LITERATURE</b><hr /><P>This is the greatest, in every sense, of the apostolic letters of Paul; in scale, in scope, and in its wonderful combination of doctrinal, ethical and administrative wisdom and power. In some respects the later Epistles, Ephesians and Colossians, lead us to even higher and deeper arcana of revelation, and they, like Romans, combine with the exposition of truth a luminous doctrine of duty. But the range of Roman is larger in both directions, and presents us also with noble and far-reaching discussions of Christian polity, instructions in spiritual utterance and the like, to which those Epistles present no parallel, and which only the Corinthian Epistles rival.<P>1. Its Genuineness:<P>No suspicion on the head of the genuineness of the Epistle exists which needs serious consideration. Signs of the influence of the Epistle can be traced, at least very probably, in the New Testament itself; in 1 Peter, and, as some think, in James. But in our opinion James was the earlier writing, and Lightfoot has given strong grounds for the belief that the paragraph on faith and justification (<a onClick="return mV(\'Jam\',2,1);">Jas 2</a>) has no reference to perversions of Pauline teaching, but deals with rabbinism. Clement of Rome repeatedly quotes Romans, and so do Ignatius, Polycarp, Justin. Marcion includes it in his list of Pauline Epistles, and it is safe to say in general Romans "has been recognized in the Christian church as long as any collection of Paul\'s Epistles has been extant" (A. Robertson, in HDB, under the word). But above all other evidences it testifies to itself. The fabrication of such a writing, with its close and complex thought, its power and marked originality of treatment, its noble morale, and its spiritual elevation and ardor, is nothing short of a moral impossibility. A mighty mind and equally great heart live in every page, and a soul exquisitely sensitive and always intent upon truth and holiness. Literary personation is an art which has come to anything like maturity only in modern times, certainly not before the Renaissance. In a fully developed form it is hardly earlier than the 19th century. And even now who can point to a consciously personated authorship going along with high moral principle and purpose?<P>2. Its Integrity:<P>The question remains, however, whether, accepting the Epistle in block as Pauline, we have it, as to details, just as it left the author\'s hands. Particularly, some phenomena of the text of the last two chapter invite the inquiry. We may—in our opinion we must—grant those chapters to be Pauline. They breathe Paul in every sentence. But do they read precisely like part of a letter to Rome? For example, we have a series of names (<a onClick="return mV(\'Rom\',16,\'1-15\');">Ro 16:1-15</a>), representing a large circle of personally known and loved friends of the writer, a much longer list than any other in the Epistles, and all presumably—on theory that the passage is integral to the Epistle—residents at Rome. May not such a paragraph have somehow crept in, after date, from another writing? Might not a message to Philippian, Thessalonian or Ephesian friends, dwellers in places where Paul had already established many intimacies, have fallen out of its place and found lodgment by mistake at the close of this letter to Rome? It seems enough to reply by one brief statement of fact. We possess some 300 manuscripts of Romans, and not one of these, so far as it is uninjured, fails to give the Epistle complete, all the chapters as we have them, and in the present order (with one exception, that of the final doxology). It is observable meanwhile that the difficulty of supposing Paul to have had a large group of friends living at Rome, before his own arrival there, is not serious. To and from Rome, through the whole empire, there was a perpetual circulation of population. Suppose Aquila and Priscilla (e.g.) to have recently returned (<a onClick="return mV(\'Act\',18,2);">Ac 18:2</a>) to Rome from Ephesus, and suppose similar migrations from Greece or from Asia Minor to have taken place within recent years; we can then readily account for the greetings of <a onClick="return mV(\'Rom\',16,\'1-\');">Ro 16</a>.<P>Lightfoot has brought it out in an interesting way (see his Philippians, on <a onClick="return mV(\'Phl\',4,22);">4:22</A>) that many of the names (e.g. Amplias, Urbanus, Tryphena) in <a onClick="return mV(\'Rom\',16,\'1-\');">Ro 16</a> are found at Rome, in inscriptions of the early imperial age, in cemeteries where members of the widely scattered "household of Caesar" were interred. This at least suggests the abundant possibility that the converts and friends belonging to the "household" who, a very few years later, perhaps not more than three, were around him at Rome when he wrote to Philippi (<a onClick="return mV(\'Phl\',4,22);">Php 4:22</a>), and sent their special greeting ("chiefly they") to the Philipplans, were formerly residents at Philippi, or elsewhere in Macedonia, and had moved thence to the capital not long before the apostle wrote to the Romans. A. Robertson (ut supra) comes to the conclusion, after a careful review of recent theories, "that the case for transferring this section...from its actual connection to a lost Epistle to Ephesus is not made out."<P>Two points of detail in the criticism of the text of Romans may be noted. One is that the words "at Rome" (<a onClick="return mV(\'Rom\',1,7,15);">1:7,15</A>) are omitted in a very few manuscripts, in a way to remind us of the interesting phenomenon of the omission of "at Ephesus" (<a onClick="return mV(\'Eph\',1,1);">Eph 1:1</a> margin). But the evidence for this omission being original is entirely inadequate. The fact may perhaps be accounted for by a possible circulation of Romans among other mission churches as an Epistle of universal interest. This would be much more likely if the manuscripts and other authorities in which the last two chapters are missing were identical with those which omit "at Rome," but this is not the case.<P>The other and larger detail is that the great final doxology (<a onClick="return mV(\'Rom\',16,\'25-27\');">Ro 16:25-27</a>) is placed by many cursives at the end of <a onClick="return mV(\'Rom\',14,\'1-\');">Romans 14</a>, and is omitted entirely by three manuscripts and by Marcion. The leading uncials and a large preponderance of ancient evidence place it where we have it. It is quite possible that Paul may have reissued Romans after a time, and may only then have added the doxology, which has a certain resemblance in manner to his later (captivity) style. But it is at least likely that dogmatic objections led Marcion to delete it, and that his action accounts for the other phenomena which seem to witness against its place at the finale.<P>It is worth noting that Hort, a singularly fearless, while sober student, defends without reserve the entirety of the Epistle as we have it, or practically so. See his essay printed in Lightfoot\'s Biblical Studies.<P>3. The Approximate Date:<P>We can fix the approximate date with fair certainty within reasonable limits. We gather from <a onClick="return mV(\'Rom\',15,19);">Ro 15:19</a> that Paul, when he wrote, was in the act of closing his work in the East and was looking definitely westward. But he was first about (<a onClick="return mV(\'Rom\',15,25,26);">15:25,26</A>) to revisit Jerusalem with his collection, mainly made in Macedonia and Achaia, for the "poor saints." Placing these allusions side by side with the references in 1 and 2 Corinthians to the collection and its conveyance, and again with the narrative of Acts, we may date Romans very nearly at the same time as 2 Corinthians, just before the visit to Jerusalem narrated in <a onClick="return mV(\'Act\',20,\'1-\');">Ac 20</a>, etc. The year may be fixed with great probability as 58 AD. This estimate follows the lines of Lightfoot\'s chronology, which Robertson (ut supra) supports. More recent schemes would move the date back to 56 AD.<P>"The reader\'s attention is invited to this date. Broadly speaking, it was about 30 years at the most after the Crucifixion. Let anyone in middle life reflect on the freshness in memory of events, whether public or private, which 30 years ago made any marked impression on his mind. Let him consider how concrete and vivid still are the prominent personages of 30 years ago, many of whom of course are still with us. And let him transfer this thought to the 1st century, and to the time of our Epistle. Let him remember that we have at least this one great Christian writing composed, for certain, within such easy reach of the very lifetime of Jesus Christ when His contemporary friends were still, in numbers, alive and active. Then let him open the Epistle afresh, and read, as if for the first time, its estimate of Jesus Christ—a Figure then of no legendary past, with its halo, but of the all but present day. Let him note that this transcendent estimate comes to us conveyed in the vehicle not of poetry and rhetoric, but of a treatise pregnant with masterly argument and admirable practical wisdom, tolerant and comprehensive. And we think that the reader will feel that the result of his meditations on date and circumstances is reassuring as to the solidity of the historic basis of the Christian faith" (from the present writer\'s introduction to the Epistle in the Temple Bible; see also his Light from the First Days: Short Studies in 1 Thessalonians).<P>4. The Place of Writing:<P>With confidence we may name Corinth as the place of writing. Paul was at the time in some "city" (<a onClick="return mV(\'Rom\',16,23);">Ro 16:23</a>). He was staying with one Gaius, or Caius (same place), and we find in <a onClick="return mV(\'1Cr\',1,14);">1Co 1:14</a> a Gaius, closely connected with Paul, and a Corinthian. He commends to the Romans the deaconess Phoebe, attached to "the church at Cenchrea" (<a onClick="return mV(\'Rom\',16,1);">16:1</A>), presumably a place near that from which he was writing; and Cenchrea was the southern part of Corinth.<P>5. The Destination:<P>The first advent of Christianity to Rome is unrecorded, and we know very little of its early progress. Visiting Romans (epidemountes), both Jews and proselytes, appear at Pentecost (<a onClick="return mV(\'Act\',2,10);">Ac 2:10</a>), and no doubt some of these returned home believers. In <a onClick="return mV(\'Act\',18,2);">Ac 18:2</a> we have Aquila and Priscilla, Jews, evidently Christians, "lately come from Italy," and probably from Rome. But we know practically nothing else of the story previous to this Epistle, which is addressed to a mission church obviously important and already spiritually advanced. On the other hand (a curious paradox in view of the historical development of Roman Christianity), there is no allusion in the Epistle to church organization. The Christian ministry (apart from Paul\'s own apostleship) is not even mentioned. It may fairly be said to be incredible that if the legend of Peter\'s long episcopate were historical, no allusion whatever to his work, influence and authority should be made. It is at least extremely difficult to prove that he was even present in Rome till shortly before his martyrdom, and the very ancient belief that Peter and Paul founded the Roman church is more likely to have had its origin in their martyrdoms there than in Peter\'s having in any sense shared in the early evangelization of the city.<P>As to Rome itself, we may picture it at the date of the Epistle as containing, with its suburbs, a closely massed population of perhaps 800,000 people; a motley host of many races, with a strong oriental element, among which the Jews were present as a marked influence, despised and sometimes dreaded, but always attracting curiosity.<P>6. The Language:<P>The Epistle was written in Greek, the "common dialect," the Greek of universal intercourse of that age. One naturally asks, why not in Latin, when the message was addressed to the supreme Latin city? The large majority of Christian converts beyond doubt came from the lower middle and lowest classes, not least from the slave class. These strata of society were supplied greatly from immigrants, much as in parts of East London now aliens make the main population. Not Latin but Greek, then lingua franca of the Mediterranean, would be the daily speech of these people. It is remarkable that all the early Roman bishops bear Greek names. And some 40 years after the date of this Epistle we find Clement of Rome writing in Greek to the Corinthians, and later again, early in the 2nd century, Ignatius writing in Greek to the Romans.<P>7. The Occasion:<P>We cannot specify the occasion of writing for certain. No hint appears of any acute crisis in the mission (as when 1 Corinthians, 2 Corinthians, Galatians, or Colossians were written). Nor would personal reminiscences influence the writer, for he had not yet seen Rome. We can only suggest some possibilities as follows:<P>(1) A good opportunity for safe communication was offered by the deaconess Phoebe\'s proposed visit to the metropolis. She doubtless asked Paul for a commendatory letter, and this may have suggested an extended message to the church.<P>(2) Paul\'s thoughts had long gone toward Rome. See <a onClick="return mV(\'Act\',19,21);">Ac 19:21</a>: "I must see Rome," words which seem perhaps to imply some divine intimation (compare <a onClick="return mV(\'Act\',23,11);">23:11</A>). And his own life-course would fall in with such a supernatural call. He had always aimed at large centers; and now his great work in the central places of the Levant was closing; he had worked at Ephesus, Thessalonica, Corinth; he was at last to think of the supreme center of all. Rome must always have had a dominant interest for the "Apostle of the Nations," and any suggestion that his Lord\'s will tended that way would intensify it to the highest degree.<P>(3) The form of the Epistle may throw further light on the occasion. The document falls, on the whole, into three parts. First we have <a onClick="return mV(\'Rom\',1,\'1-\');">Romans 1-8</a> inclusive, a prolonged exposition of the contrasted and related phenomena of sin and salvation, with special initial references to the cases of Jew and non-Jew respectively. Then come <a onClick="return mV(\'Rom\',9,\'1-\');">Romans 9-11</a>, which deal with the Jewish rejection of the Jewish Messiah, developing into a prophetic revelation of the future of Israel in the grace of God. Lastly we have <a onClick="return mV(\'Rom\',12,\'1-\');">Romans 12-16</a>. Some account of the writer\'s plans, and his salutations to friends, requests for prayer, etc., form the close of this section. But it is mainly a statement of Christian duty in common life, personal, civil, religious. Under the latter head we have a noble treatment of problems raised by varying opinions, particularly on religious observances, among the converts, Jew and Gentile.<P>Such phenomena cast a possible light on the occasion of writing. The Roman mission was on one side, by its locality and surroundings, eminently gentile. On the other, there was, as we have seen, a strong Judaic element in Roman life, particularly in its lower strata, and no doubt around the Jewish community proper there had grown up a large community of "worshippers" (sebomenoi) or, as we commonly call them, "proselytes" ("adherents," in the language of modern missionary enterprise), people who, without receiving circumcision, attended Jewish worship and shared largely in Jewish beliefs and ideals. Among these proselytes, we may believe, the earliest evangelists at Rome found a favorable field, and the mission church as Paul knew of it contained accordingly not only two definite classes, converts from paganism, converts from native Judaism, but very many in whose minds both traditions were working at once. To such converts the problems raised by Judaism, both without and within the church, would come home with a constant intimacy and force, and their case may well have been present in a special degree in the apostle\'s mind alike in the early passages (<a onClick="return mV(\'Rom\',1,\'1-\');">Romans 1-3</a>) of the Epistle and in such later parts as <a onClick="return mV(\'Rom\',2,\'1-\');">Romans 2-11</a>; <a onClick="return mV(\'Rom\',14,\'1-\');">14</a>; <a onClick="return mV(\'Rom\',15,\'1-\');">15</a>. On the one hand they would greatly need guidance on the significance of the past of Israel and on the destiny of the chosen race in the future. Moreover, discussions in such circles over the way of salvation would suggest to the great missionary his exposition of man\'s reconciliation with a holy God and of His secrets for purity and obedience in an unholy world. And meanwhile the ever-recurring problems raised by ceremonial rules in common daily life—problems of days and seasons, and of forbidden food—would, for such disciples, need wise and equitable treatment.<P>(4) Was it not with this position before him, known to him through the many means of communication between Rome and Corinth, that Paul cast his letter into this form? And did not the realization of the central greatness of Rome suggest its ample scale? The result was a writing which shows everywhere his sense of the presence of the Judaic problem. Here he meets it by a statement, massive and tender, of "heaven\'s easy, artless, unencumbered plan" of redemption, grace, and glory, a plan which on its other side is the very mystery of the love of God, which statement is now and forever a primary treasure of the Christian faith. And then again he lays down for the too eager champions of the new "liberty" a law of loving tolerance toward slower and narrower views which is equally our permanent spiritual possession, bearing a significance far-reaching and benign.<P>(5) It has been held by some great students, notably Lightfoot and Hort, that the main purpose of Romans was to reconcile the opposing "schools" in the church, and that its exposition of the salvation of the individual is secondary only. The present writer cannot take this view. Read the Epistle from its spiritual center, so to speak, and is not the perspective very different? The apostle is always conscious of the collective aspect of the Christian life, an aspect vital to its full health. But is he not giving his deepest thought, animated by his own experience of conviction and conversion, to the sinful man\'s relation to eternal law, to redeeming grace, and to a coming glory? It is the question of personal salvation which with Paul seems to us to live and move always in the depth of his argument, even when Christian polity and policy is the immediate theme.<P>8. Some Characteristics:<P>Excepting only Ephesians (the problem of the authorship of which is insoluble, and we put that great document here aside), Romans is, of all Paul has written, least a letter and most a treatise. He is seen, as we read, to approach religious problems of the highest order in a free but reasoned succession; problems of the darkness and of the light, of sin and grace, fall and restoration, doom and remission, faith and obedience, suffering and glory, transcendent hope and humblest duty, now in their relation to the soul, now so as to develop the holy collectivity of the common life. The Roman converts are always first in view, but such is the writer, such his handling, that the results are for the universal church and for every believer of all time. Yet all the while (and it is in this a splendid example of that epistolary method of revelation which is one of the glories of the New Testament) it is never for a moment the mere treatise, however great. The writer is always vividly personal, and conscious of persons. The Epistle is indeed a masterpiece of doctrine, but also always "the unforced, unartificial utterance of a friend to friends."<P>9. Main Teachings of the Epistle:<P>Approaching the Epistle as a treatise rather than a letter (with the considerable reserves just stated), we indicate briefly some of its main doctrinal deliverances. Obviously, in limine, it is not set before us as a complete system either of theology or of morals; to obtain a full view of a Pauline dogma and ethics we must certainly place Ephesians and Colossians, not to speak of passages from Thessalonians, beside Romans. But it makes by far the nearest approach to doctrinal completeness among the Epistles.<P>(1) Doctrine of Man.<P>In great measure this resolves itself into the doctrine of man as a sinner, as being guilty in face of an absolutely holy and absolutely imperative law, whether announced by abnormal revelation, as to the Jew, or through nature and conscience only, as to the Gentile. At the back of this presentation lies the full recognition that man is cognizant, as a spiritual being, of the eternal difference of right and wrong, and of the witness of creation to personal "eternal power and Godhead" as its cause, and that he is responsible in an awe-inspiring way for his unfaithfulness to such cognitions. He is a being great enough to be in personal moral relation with God, and able to realize his ideal only in true relation with Him; therefore a being whose sin and guilt have an unfathomable evil in them. So is he bound by his own failure that he cannot restore himself; God alone, in sovereign mercy, provides for his pardon by the propitiation of Christ, and for his restoration by union with Christ in the life given by the Holy Spirit. Such is man, once restored, once become "a saint" (a being hallowed), a "son of God" by adoption and grace, that his final glorification will be the signal (in some sense the cause?) of a transfiguration of the whole finite universe. Meanwhile, man is a being actually in the midst of a life of duty and trial, a member of civil society, with obligations to its order. He lives not in a God-forsaken world, belonging only to another and evil power. His new life, the "mind of the Spirit" in him, is to show itself in a conduct and character good for the state and for society at large, as well as for the "brotherhood."<P>(2) Doctrine of God.<P>True to the revelation of the Old Testament, Paul presents God as absolute in will and power, so that He is not only the sole author of nature but the eternal and ultimately sole cause of goodness in man. To Him in the last resort all is due, not only the provision of atonement but the power and will to embrace it. The great passages which set before us a "fore-defining" (proorisis, "predestination") and election of the saints are all evidently inspired by this motive, the jealous resolve to trace to the one true Cause all motions and actions of good. The apostle seems e.g. almost to risk affirming a sovereign causation of the opposite, of unbelief and its sequel. But patient study will find that it is not so. God is not said to "fit for ruin" the "vessels of wrath." Their woeful end is overruled to His glory, but nowhere is it taken to be caused by Him. All along the writer\'s intense purpose is to constrain the actual believer to see the whole causation of his salvation in the will and power of Him whose inmost character is revealed in the supreme fact that, "for us all," "he spared not his Son."<P>(3) Doctrine of Son of God—Redemption; Justification.<P>The Epistle affords materials for a magnificently large Christology. The relation of the Son to creation is indeed not expounded in terms (as in Col), but it is implied in the language of <a onClick="return mV(\'Rom\',8,\'1-\');">Romans 8</a>, where the interrelation of our redemption and the transfiguration of Nature is dealt with. We have the Lord\'s manhood fully recognized, while His Godhead (as we read in <a onClick="return mV(\'Rom\',9,5);">9:5</A>; so too Robertson, ut supra) is stated in terms, and it is most certainly implied in the language and tone of e.g. the close of <a onClick="return mV(\'Rom\',8,\'1-\');">Romans 8</a>. Who but a bearer of the Supreme Nature could satisfy the conception indicated in such words as those of <a onClick="return mV(\'Rom\',8,32,\35-39\');">8:32,35-39</A>, coming as they do from a Hebrew monotheist of intense convictions? Meantime this transcendent Person has so put Himself in relation with us, as the willing worker of the Father\'s purpose of love, that He is the sacrifice of peace for us (<a onClick="return mV(\'Rom\',3,\'1-\');">Romans 3</a>), our "propitiatory" One (hilasterion, is now known to be an adjective), such that (whatever the mystery, which leaves the fact no less certain) the man who believes on Him, i.e. (as <a onClick="return mV(\'Rom\',4,\'1-\');">Romans 4</a> fully demonstrates) relies on Him, gives himself over to His mercy, is not only forgiven but "justified," "justified by faith." And "justification" is more than forgiveness; it is not merely the remission of a penalty but a welcome to the offender, pronounced to be lawfully at peace with the eternal holiness and love.<P>See <a href="./study/isbe/search.html?string=JUSTIFICATION">JUSTIFICATION</a>; <a href="./study/isbe/search.html?string=PROPITIATION">PROPITIATION</a>.<P>In closest connection with this message of justification is the teaching regarding union with the Christ who has procured the justification. This is rather assumed than expounded in Romans (we have the exposition more explicitly in Eph, Col, and Gal), but the assumption is present wherever the pregnant phrase "in Christ" is used. Union is, for Paul, the central doctrine of all, giving life and relation to the whole range. As Lightfoot has well said (Sermons in Paul\'s, <span class="noTag">number 16</span>), he is the apostle not primarily of justification, or of liberty, great as these truths are with him, but of union with Christ. It is through union that justification is ours; the merits of the Head are for the member. It is through union that spiritual liberty and power are ours; the Spirit of life is from the Head to the member. Held by grace in this profound and multiplex connection, where life, love and law are interlaced, the Christian is entitled to an assurance full of joy that nothing shall separate him, soul and (ultimately) body, from his once sacrificed and now risen and triumphant Lord.<P>(4) Doctrine of the Spirit of God.<P>No writing of the New Testament but John\'s Gospel is so full upon this great theme as <a onClick="return mV(\'Rom\',8,\'1-\');">Romans 8</a> may be said to be the locus classicus in the Epistles for the work of the Holy Ghost in the believer. By implication it reveals personality as well as power (see especially <a onClick="return mV(\'Rom\',8,26);">8:26</A>). Note particularly the place of this great passage, in which revelation and profoundest conditions run continually into each other. It follows <a onClick="return mV(\'Rom\',7,\'1-\');">Romans 7</a>, in which the apostle depicts, in terms of his own profound and typical experience, the struggles of conscience and will over the awful problem of the "bondage" of indwelling sin. If we interpret the passage aright, the case supposed is that of a regenerate man, who, however, attempts the struggle against inward evil armed, as to consciousness, with his own faculties merely, and finds the struggle insupportable. Then comes in the divine solution, the promised Spirit of life and liberty, welcomed and put into use by the man who has found his own resources yam. "In Christ Jesus," in union with Him, he "by the Spirit does to death the practices of the body," and rises through conscious liberty into an exulting hope of "the liberty of the glory of the sons of God"—not so, however as to know nothing of "groaning within himself," while yet in the body; but it is a groan which leaves intact the sense of sonship and divine love, and the expectation of a final completeness of redemption.<P>(5) Doctrine of Duty.<P>While the Epistle is eminently a message of salvation, it is also, in vital connection with this, a treasury of principle and precept for the life of duty. It does indeed lay down the sovereign freedom of our acceptance for Christ\'s sake alone, and so absolutely that (<a onClick="return mV(\'Rom\',6,1,2,15);">Ro 6:1,2,15</a>) the writer anticipates the inference (by foes, or by mistaken friends), "Let us continue in sin." But the answer comes instantly, and mainly through the doctrine of union. Our pardon is not an isolated fact. Secured only by Christ\'s sacrifice, received only by the faith which receives Him as our all, it is ipso facto never received alone but with all His other gifts, for it becomes ours as we receive, not merely one truth about Him, but Him. Therefore, we receive His Life as our true life; and it is morally unthinkable that we can receive this and express it in sin. This assumed, the Epistle (<a onClick="return mV(\'Rom\',12,\'1-\');">Romans 12</a> and onward) lays down with much detail and in admirable application large ranges of the law of duty, civil, social, personal, embracing duties to the state, loyalty to its laws, payment of its taxes, recognition of the sacredness of political order, even ministered by pagans; and also duties to society and the church, including a large and loving tolerance even in religious matters, and a response to every call of the law of unselfish love. However we can or cannot adjust mentally the two sides, that of a supremely free salvation and that of an inexorable responsibility, there the two sides are, in the Pauline message. And reason and faith combine to assure us that both sides are eternally true, "antinomies" whose harmony will be explained hereafter in a higher life, but which are to be lived out here concurrently by the true disciple, assured of their ultimate oneness of source in the eternal love.<P>(6) Doctrine of Israel.<P>Very briefly we touch on this department of the message of Romans, mainly to point out that the problem of Israel\'s unbelief nowhere else in Paul appears as so heavy a load on his heart, and that on the other hand we nowhere else have anything like the light he claims to throw (<a onClick="return mV(\'Rom\',11,\'1-\');">Romans 11</a>) on Israel\'s future. Here, if anywhere, he appears as the predictive prophet, charged with the statement of a "mystery," and with the announcement of its issues. The promises to Israel have never failed, nor are they canceled. At the worst, they have always been inherited by a chosen remnant, Israel within Israel. And a time is coming when, in a profound connection with Messianic blessing on the Gentiles, "all Israel shall be saved," with a salvation which shall in turn be new life to the world outside Israel. Throughout the passage Paul speaks, not as one who "will not give up a hope," but as having had revealed to him a vast and definite prospect, in the divine purpose.<P>It is not possible in our present space to work out other lines of the message of Romans. Perhaps enough has been done to stimulate the reader\'s own inquiries.<P>LITERATURE.<P>Of the Fathers, Chrysostom and Augustine are pre-eminent as interpreters of Romans: Chrysostom in his expository Homilies, models of eloquent and illuminating discourse, full of "sanctified common sense," while not perfectly appreciative of the inmost doctrinal characteristics; Augustine, not in any continuous comm., but in his anti-Pelagian writings, which show the sympathetic intensity of his study of the doctrine of the Epistle, not so much on justification as on grace and the will. Of the Reformers, Calvin is eminently the great commentator, almost modern in his constant aim to ascertain the sacred writer\'s meaning by open-eyed inference direct from the words. On Romans he is at his best; and it is remarkable that on certain leading passages where grace is theme he is much less rigidly "Calvinistic" than some of his followers. In modern times, the not learned but masterly exposition of Robert Haldane (circa 1830) claims mention, and the eloquent and highly suggestive expository lectures (about the same date) of Thomas Chalmers. H. A. W. Meyer (5th edition,1872,English translation 1873-1874) among the Germans is excellent for carefulness and insight; Godet (1879, English translation 1881) equally so among French-writing divines; of late English interpreters I. A. Beet (1877, many revisions), Sanday and Headlam (1895, in the "International" series) and E. H. Gifford (admirable for scholarship and exposition; his work was printed first in the Speaker\'s (Bible) Comm.,1881,now separately) claim particular mention. J. Denney writes on Romans in The Expositor\'s Greek Test. (1900).<P>Luther\'s lectures on Romans, delivered in 1516-1517 and long supposed lost, have been recovered and were published by J. Ficker in 1908. Among modern German commentators, the most important is B. Weiss in the later revisions of the Meyer series (9th edition, 1899), while a very elaborate commentary has been produced by Zahn in his own series (1910). Briefer are the works of Lipsius (Hand-Kommentar, 2nd edition,1892,very scholarly and suggestive); Lietzmann (Handbuch zum N T, interest chiefly linguistic), and Julicher (in J. Weiss, Schriften des NTs, 2nd edition,1908,an intensely able piece of popular exposition).<P>A. E. Garvie has written a brilliant little commentary in the "(New) Century" series (no date); that of R. John Parry in the Cambridge Greek Testament,1913,is more popular, despite its use of the Greek text. F. B. Westcott\'s Paul and Justification,1913,contains a close grammatical study with an excellent paraphrase.<P>The writer may be allowed to name his short commentary (1879) in the Cambridge Bible for Schools and a fuller one, in a more homiletic style, in the Expositor\'s Bible, 1894.``46';
isbe[7486]='Rome`rom:<P><b>I. DEVELOPMENT OF THE REPUBLICAN CONSTITUTION</b><P class="in15">1. Original Roman State<P class="in15">2. The Struggle between Patricians and Plebeians<P class="in15">3. The Senate and Magistrates<P class="in15">4. Underlying Principles<P><b>II. EXTENSION OF ROMAN SOVEREIGNTY</b><P><b>III. THE IMPERIAL GOVERNMENT</b><P class="in15">1. Imperial Authority<P class="in15">2. Three Classes of Citizens<P><b>IV. ROMAN RELIGION</b><P class="in15">1. Deities<P class="in15">2. Religious Decay<P><b>V. ROME AND THE JEWS</b><P class="in15">1. Judea under Roman Procurators and Governors<P class="in15">2. Jewish Proselytism<P><b>VI. ROME AND THE CHRISTIANS</b><P class="in15">1. Introduction of Christianity<P class="in15">2. Tolerance and Proscription<P class="in15">3. Persecution<P><b>LITERATURE</b><hr /><P>Rome (Latin and Italian, Roma; Rhome): The capital of the Roman republic and empire, later the center of Lot Christendom, and since 1871 capital of the kingdom of Italy, is situated mainly on the left bank of the Tiber about 15 miles from the Mediterranean Sea in 41 degrees 53 minutes 54 seconds north latitude and 12 degrees 0 minutes 12 seconds longitude east of Greenwich.<P>It would be impossible in the limited space assigned to this article to give even a comprehensive outline of the ancient history of the Eternal City. It will suit the general purpose of the work to consider the relations of the Roman government and society with the Jews and Christians, and, in addition, to present a rapid survey of the earlier development of Roman institutions and power, so as to provide the necessary historical setting for the appreciation of the more essential subjects.<P>I. Development of the Republican Constitution.<P>1. Original Roman State:<P>The traditional chronology for the earliest period of Roman history is altogether unreliable, partly because the Gauls, in ravaging the city in 390 BC, destroyed the monuments which might have offered faithful testimony of the earlier period (Livy vi.1). It is known that there was a settlement on the site of Rome before the traditional date of the founding (753 BC). The original Roman state was the product of the coalition of a number of adjacent clan-communities, whose names were perpetuated in the Roman genres, or groups of imaginary kindred, a historical survival which had lost all significance in the period of authentic history. The chieftains of the associated clans composed the primitive senate or council of elders, which exercised sovereign authority. But as is customary in the development of human society a military or monarchical regime succeeded the looser patriarchal or sacerdotal organs of authority. This second stage may be identified with the legendary rule of the Tarquins, which was probably a period of Etruscan domination. The confederacy of clans was welded into a homogeneous political entity, and society was organized for civic ends, upon a timocratic basis. The forum was drained and became a social, industrial and political center, and the Capitoline temple of Jupiter, Juno, and Minerva (Etruscan pseudo-Hellenic deities) was erected as a common shrine for all the people. But above all the Romans are indebted to these foreign kings for a training in discipline and obedience which was exemplified in the later conception of magisterial authority signified by the term imperium.<P>The prerogatives of the kings passed over to the consuls. The reduction of the tenure of power to a single year and the institution of the principle of colleagueship were the earliest checks to the abuse of unlimited authority. But the true cornerstone of Roman liberty was thought to be the lexicon Valeria, which provided that no citizen should be put to death by a magistrate without being allowed the right of appeal to the decision of the assembly of the people.<P>2. The Struggle between Patricians and Plebeians:<P>A period of more than 150 years after the establishment of the republic was consumed chiefly by the struggle between the two classes or orders, the patricians and plebeians. The former were the descendants of the original clans and constituted the populus, or body-politic, in a more particular sense. The plebeians were descendants of former slaves and dependents, or of strangers who had been attracted to Rome by the obvious advantages for industry and trade. They enjoyed the franchise as members of the military assembly (comitia centuriata), but had no share in the magistracies or other civic honors and emoluments, and were excluded from the knowledge of the civil law which was handed down in the patrician families as an oral tradition.<P>The first step in the progress of the plebeians toward political equality was taken when they wrested from the patricians the privilege of choosing representatives from among themselves, the tribunes, whose function of bearing aid to oppressed plebeians was rendered effective by the right of veto (intercessio), by virtue of which any act of a magistrate could be arrested. The codification of the law in the Twelve Tables was a distinct advantage to the lower classes, because the evils which they had suffered were largely due to a harsh and abusive interpretation of legal institutions, the nature of which had been obscure (see <a href="./study/isbe/search.html?string=ROMAN+LAW">ROMAN LAW</a>). The abrogation, directly thereafter, of the prohibition of intermarriage between the classes resulted in their gradual intermingling.<P>3. The Senate and Magistrates: The kings had reduced the senate to the position of a mere advising body. But under the republican regime it recovered in fact the authority of which it was deprived in theory. The controlling power of the senate is the most significant feature of the republican government, although it was recognized by no statute or other constitutional document. It was due in part to the diminution of the power of the magistrates, and in part to the manner in which the senators were chosen. The lessening of the authority of the magistrates was the result of the increase in their number, which led not only to the curtailment of the actual prerogative of each, but also to the contraction of their aggregate independent influence. The augmentation of the number of magistrates was made necessary by the territorial expansion of the state and the elaboration of administration. But it was partly the result of plebeian agitation. The events of 367 BC may serve as a suitable example to illustrate the action of these influences. For when the plebeians carried by storm the citadel of patrician exclusiveness in gaining admission to the consulship, the highest regular magistracy, the necessity for another magistrate with general competency afforded an opportunity for making a compensating concession to the patricians, and the praetorship was created, to which at first members of the old aristocracy were alone eligible. Under the fully developed constitution the regular magistracies were five in number, consulship, praetorship, aedileship, tribunate, and quaestorship, all of which were filled by annual elections.<P>Mention has been made of the manner of choosing the members of the senate as a factor in the development of the authority of the supreme council. At first the highest executive officers of the state exercised the right of selecting new members to maintain the senators at the normal number of three hundred. Later this function was transferred to the censors who were elected at intervals of five years. But custom and later statute ordained that the most distinguished citizens should be chosen, and in the Roman community the highest standard of distinction was service to the state, in other words, the holding of public magistracies. It followed, therefore, that the senate was in reality an assembly of all living ex-magistrates. The senate included, moreover, all the political wisdom and experience of the community, and so great was its prestige for these reasons, that, although the expression of its opinion (senatus consultum) was endowed by law with no compelling force, it inevitably guided the conduct of the consulting magistrate, who was practically its minister, rather than its president.<P>When the plebeians gained admission to the magistracies, the patriciate lost its political significance. But only the wealthier plebeian families were able to profit by this extension of privilege, inasmuch as a political career required freedom from gainful pursuits and also personal influence. These plebeian families readily coalesced with the patricians and formed a new aristocracy, which is called the nobilitas for the sake of distinction. It rested ultimately upon the foundation of wealth. The dignity conferred by the holding of public magistracies was its title to distinction. The senate was its organ. Rome was never a true democracy except in theory. During the whole period embraced between the final levelling of the old distinctions based upon blood (287 BC) and the beginning of the period of revolution (133 BC), the magistracies were occupied almost exclusively by the representatives of the comparatively limited number of families which constituted the aristocracy. These alone entered the senate through the doorway of the magistracies, and the data would almost justify us in asserting that the republican and senatorial government were substantially and chronologically identical.<P>The seeds of the political and social revolution were sown during the Second Punic War and the period which followed it. The prorogation of military authority established a dangerous precedent in violation of the spirit of the republic, so that Pub. Cornelius Scipio was really the forerunner of Marius, Julius Caesar, and Augustus. The stream of gold which found its way from the provinces to Rome was a bait to attract the cupidity of the less scrupulous senators, and led to the growth of the worst kind of professionalism in politics. The middle class of small farmers decayed for various reasons; the allurement of service in the rich but effete countries of the Orient attracted many. The cheapness of slaves made independent farming unprofitable and led to the increase in large estates; the cultivation of grain was partly displaced by that of the vine and olive, which were less suited to the habits and ability of the older class of farmers.<P>The more immediate cause of the revolution was the inability of the senate as a whole to control the conduct of its more radical or violent members. For as political ambition became more ardent with the increase in the material prizes to be gained, aspiring leaders turned their attention to the people, and sought to attain the fulfillment o.f their purposes by popular legislation setting at nought the concurrence of the senate, which custom had consecrated as a requisite preliminary for popular action. The loss of initiative by the senate meant the subversion of senatorial government. The senate possessed in the veto power of the tribunes a weapon for coercing unruly magistrates, for one of the ten tribunes could always be induced to interpose his veto to prohibit the passage of popular legislation. But this weapon was broken when Tib. Gracchus declared in 133 BC that a tribune who opposed the wishes of the people was no longer their representative, and sustained this assertion.<P>4. Underlying Principles:<P>It would be foreign to the purpose of the present article to trace the vicissitudes of the civil strife of the last century of the republic. A few words will suffice to suggest the general principles which lay beneath the surface of political and social phenomena. Attention has been called to the ominous development of the influence of military commanders and the increasing emphasis of popular favor. These were the most important tendencies throughout this period, and the coalition of the two was fatal to the supremacy of the senatorial government. Marius after winning unparalleled military glory formed a political alliance with Glaucia and Saturninus, the leaders of the popular faction in the city in 100 BC. This was a turning-point in the course of the revolution. But the importance of the sword soon outweighed that of the populace in the combination which was thus constituted. In the civil wars of Marius and Sulla constitutional questions were decided for the first time by superiority of military strength exclusively. Repeated appeals to brute force dulled the perception for constitutional restraints and the rights of minorities. The senate had already displayed signs of partial paralysis at the time of the Gracchi. How rapidly its debility must have increased as the sword cut off its most stalwart members! Its power expired in the proscriptions, or organized murder of political opponents. The popular party was nominally triumphant, but in theory the Roman state was still an urban commonwealth with a single po1itical center. The franchise could be exercised only at Rome. It followed from this that the actual political assemblies were made up largely of the worthless element which was so numerous in the city, whose irrational instincts were guided and controlled by shrewd political leaders, particularly those who united in themselves military ability and the wiles of the demagogue. Sulla, Crassus, Julius Caesar, Antony, and lastly Octavian were in effect the ancient counterpart of the modern political "boss." When such men realized their ultimate power and inevitable rivalry, the ensuing struggle for supremacy and for the survival of the fittest formed the necessary process of elimination leading naturally to the establishment of the monarchy, which was in this case the rule of the last survivor. When Octavian received the title Augustus and the proconsular power (27 BC), the transformation was accomplished.<P>LITERATURE.<P>The standard work on Roman political institutions is Mommsen and Marquardt, Handbuch der klassischen Altertumer. Abbott, Roman Political Institutions, Boston and London,1901,offers a useful summary treatment of the subject.<P>II. Extension of Roman Sovereignty.<P>See <a href="./study/isbe/search.html?string=ROMAN+EMPIRE+AND+CHRISTIANITY">ROMAN EMPIRE AND CHRISTIANITY</a>, I.<P>LITERATURE.<P>Only the most important general works on Roman history can be mentioned: Ihne, Romische Geschichte (2nd edition), Leipzig, 1893-96, English translation, Longmans, London, 1871-82; Mommsen, History of Rome, English translation by Dickson, New York, 1874; Niebuhr, History of Rome, English translation by Hare and Thirlwall, Cambridge, 1831-32; Pais, Storia di Roma, Turin, 1898-99; Ferrero, Greatness and Decline of Rome, English translation by Zimmern, New York, 1909.<P>III. The Imperial Government.<P>1. Imperial Authority:<P>Augustus displayed considerable tact in blending his own mastery in the state with the old institutions of the republican constitution. His authority, legally, rested mainly upon the tribunician power, which he had probably received as early as 36 BC, but which was established on a better basis in 23 BC, and the proconsular prerogative (imperiurn proconsulare), conferred in 27 BC. By virtue of the first he was empowered to summon the senate or assemblies and could veto the action of almost any magistrate. The second title of authority conferred upon him the command of the military forces of the state and consequently the administration of the provinces where troops were stationed, besides a general supervision over the government of the other provinces. It follows that a distinction was made (27 BC) between the imperial provinces which were administered by the emperor\'s representatives (legati Augusti pro praetore) and the senatorial provinces where the republican machinery of administration was retained. The governors of the latter were called generally proconsuls (see <a href="./study/isbe/search.html?string=PROVINCE">PROVINCE</a>). Mention is made of two proconsuls in the New Testament, Gallio in Achaia (<a onClick="return mV(\'Act\',18,12);">Ac 18:12</a>) and Sergius Paulus in Cyprus (<a onClick="return mV(\'Act\',13,7);">Ac 13:7</a>). It is instructive to compare the lenient and common-sense attitude of these trained Roman aristocrats with that of the turbulent local mobs who dealt with Paul in Asia Minor, Judea, or Greece (Tucker, Life in the Roman World of Nero and Paul, New York,1910, 95).<P>2. Three Classes of Citizens:<P>Roman citizens were still divided into three classes socially, senatorial, equestrian, and plebeian, and the whole system of government harmonized with this triple division. The senatorial class was composed of descendants of senators and those upon whom the emperors conferred the latus clavus, or privilege of wearing the tunic with broad purple border, the sign of membership in this order. The quaestorship was still the door of admission to the senate. The qualifications for membership in the senate were the possession of senatorial rank and property of the value of not less than 1,000,000 sesterces ($45,000; £9,000). Tiberius transferred the election of magistrates from the people to the senate, which was already practically a closed body. Under the empire senatus consulta received the force of law. Likewise the senate acquired judicial functions, sitting as a court of justice for trying important criminal cases and hearing appeals in civil cases from the senatorial provinces. The equestrian class was made up of those who possessed property of the value of 400,000 sesterces or more, and the privilege of wearing the narrow purple band on the tunic. With the knights the emperors filled many important financial and administrative positions in Italy and the provinces which were under their control.<P>IV. Roman Religion.<P>1. Deities:<P>(1) The Roman religion was originally more consistent than the Greek, because the deities as conceived by the unimaginative Latin genius were entirely without human character. They were the influences or forces which directed the visible phenomena of the physical world, whose favor was necessary to the material prosperity of mankind. It would be incongruous to assume the existence of a system of theological doctrines in the primitive period. Ethical considerations entered to only a limited extent into the attitude of the Romans toward their gods. Religion partook of the nature of a contract by which men pledged themselves to the scrupulous observance of certain sacrifices and other ceremonies, and in return deemed themselves entitled to expect the active support of the gods in bringing their projects to a fortunate conclusion. The Romans were naturally polytheists as a result of their conception of divinity. Since before the dawn of science there was no semblance of unity in the natural world, there could be no unity in heaven. There must be a controlling spirit over every important object or class of objects, every person, and every process of nature. The gods, therefore, were more numerous than mankind itself.<P>(2) At an early period the government became distinctly secular. The priests were the servants of the community for preserving the venerable aggregation of formulas and ceremonies, many of which lost at an early period such spirit as they once possessed. The magistrates were the true representatives of the community in its relationship with the deities both in seeking the divine will in the auspices and in performing the more important sacrifices.<P>(3) The Romans at first did not make statues of their gods. This was partly due to lack of skill, but mainly to the vagueness of their conceptions of the higher beings. Symbols sufficed to signify their existence, a spear, for instance, standing for Mars. The process of reducing the gods to human form was inaugurated when they came into contact with the Etruscans and Greeks. The Tarquins summoned Etruscan artisans and artists to Rome, who made from terra cotta cult statues and a pediment group for the Capitoline temple.<P>The types of the Greek deities had already been definitely established when the Hellenic influence in molding Roman culture became predominant. When the form of the Greek gods became familiar to the Romans in works of sculpture, they gradually supplanted those Roman deities with which they were nominally identified as a result of a real or fancied resemblance.<P>See <a href="./study/isbe/search.html?string=GREECE,+RELIGION+IN+ANCIENT">GREECE, RELIGION IN ANCIENT</A>.<P>(4) The importation of new gods was a comparatively easy matter. Polytheism is by its nature tolerant because of its indefiniteness. The Romans could no more presume to have exhaustive knowledge of the gods than they could pretend to possess a comprehensive acquaintance with the universe. The number of their gods increased of necessity as human consciousness of natural phenomena expanded. Besides, it was customary to invite the gods of conquered cities to transfer their abode to Rome and favor the Romans in their undertakings. But the most productive source for religious expansion was the Sibylline Books. See <a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</a>, sec. V. This oracular work was brought to Rome from Cumae, a center of the cult of Apollo. It was consulted at times of crisis with a view to discover what special ceremonies would secure adequate divine aid. The forms of worship recommended by the Sibylline Books were exclusively Greek. As early as the 5th century BC the cult of Apollo was introduced at Rome. Heracles and the Dioscuri found their way thither about the same time. Later Italian Diana was merged with Artemis, and the group of Ceres, Liber, and Libera were identified with foreign Demeter, Dionysus, and Persephone. Thus Roman religion became progressively Hellenized. By the close of the Second Punic War the greater gods of Greece had all found a home by the Tiber, and the myriad of petty local deities who found no counterpart in the celestial beings of Mt. Olympus fell into oblivion. Their memory was retained by the antiquarian lore of the priests alone.<P>See <a href="./study/isbe/search.html?string=ROMAN+EMPIRE+AND+CHRISTIANITY">ROMAN EMPIRE AND CHRISTIANITY, III, 1</a>.<P>2. Religious Decay:<P>Roman religion received with the engrafted branches of Greek religion the germs of rapid decay, for its Hellenization made Roman religion peculiarly susceptible to the attack of philosophy. The cultivated class in Greek society was already permeated with skepticism. The philosophers made the gods appear ridiculous. Greek philosophy gained a firm foothold in Rome in the 2nd century BC, and it became customary a little later to look upon Athens as a sort of university town where the sons of the aristocracy should be sent for the completion of their education in the schools of the philosophers. Thus at the termination of the republican era religious faith had departed from the upper classes largely, and during the turmoil of the civil wars even the external ceremonies were often abandoned and many temples fell into ruins. There had never been any intimate connection between formal religion and conduct, except when the faith of the gods was invoked to insure the fulfillment of sworn promises.<P>Augustus tried in every way to restore the old religion, rebuilding no fewer than 82 temples which lay in ruins at Rome. A revival of religious faith did occur under the empire, although its spirit was largely alien to that which had been displayed in the performance of the official cult. The people remained superstitious, even when the cultivated classes adopted a skeptical philosophy. The formal religion of the state no longer appealed to them, since it offered nothing to the emotions or hopes. On the other hand the sacramental, mysterious character of oriental religions inevitably attracted them. This is the reason why the religions of Egypt and Syria spread over the empire and exercised an immeasurable influence in the moral life of the people. The partial success of Judaism and the ultimate triumph of Christianity may be ascribed in part to the same causes.<P>In concluding we should bear in mind that the state dictated no system of theology, that the empire in the beginning presented the spectacle of a sort of religious chaos where all national cults were guaranteed protection, that Roman polytheism was naturally tolerant, and that the only form of religion which the state could not endure was one which was equivalent to an attack upon the system of polytheism as a whole, since this would imperil the welfare of the community by depriving the deities of the offerings and other services in return for which their favor could be expected.<P>LITERATURE.<P>Marquardt, Romische Staatsverwaltung, III,3,"Das Sacralwesen"; Wissowa, Religion u. Kultus der Romer, Munich, 1902; Boissier, La religion romaine, Paris, 1884.<P>V. Rome and the Jews.<P>1. Judea under Roman Procurators and Governors:<P>Judaea became a part of the province of Syria in 63 BC (Josephus, BJ, vii, 7), and Hyrcanus, brother of the last king, remained as high priest (archiereus kai ethnarches; Josephus, Ant, XIV, iv, 4) invested with judicial as well as sacerdotal functions. But Antony and Octavius gave Palestine (40 BC) as a kingdom to Herod, surnamed the Great, although his rule did not become effective until 3 years later. His sovereignty was upheld by a Roman legion stationed at Jerusalem (Josephus, Ant, XV, iii, 7), and he was obliged to pay tribute to the Roman government and provide auxiliaries for the Roman army (Appian, Bell. Civ., v.75). Herod built Caesarea in honor of Augustus (Josephus, Ant, XV, ix, 6), and the Roman procurators later made it the seat of government. At his death in 4 BC the kingdom was divided between his three surviving sons, the largest portion falling to Archelaus, who ruled Judea, Samaria and Idumaea with the title ethnarches (Josephus, Ant, XVII, xi, 4) until 6 AD, when he was deposed and his realm reduced to the position of a province. The administration by Roman procurators (see <a href="./study/isbe/search.html?string=PROCURATOR">PROCURATOR</a>), which was now established, was interrupted during the period 41-44 AD, when royal authority was exercised by Herod Agrippa, grandson of Herod the Great, over the lands which had been embraced in the kingdom of his grandfather (Josephus, Ant, XIX, viii, 2), and, after 53 AD, Agrippa II ruled a considerable part of Palestine (Josephus, Ant, XX, vii, 1; viii, 4).<P>After the fall of Jerusalem and the termination of the great revolt in 70 AD, Palestine remained a separate province. Henceforth a legion (legio X Fretensis) was added to the military forces stationed in the land, which was encamped at the ruins of Jerusalem. Consequently, imperial governors of praetorian rank (legati Augusti pro praetore) took the place of the former procurators (Josephus, BJ, VII, i,2,3; Dio Cassius lv.23).<P>Several treaties are recorded between the Romans and Jews as early as the time of the Maccabees (Josephus, Ant, XII, x, 6; XIII, ix, 2; viii, 5), and Jews are known to have been at Rome as early as 138 BC. They became very numerous in the capital after the return of Pompey who brought back many captives (see <a href="./study/isbe/search.html?string=LIBERTINES">LIBERTINES</a>). Cicero speaks of multitudes of Jews at Rome in 58 BC (Pro Flacco 28), and Caesar was very friendly toward them (Suetonius Caesar 84). Held in favor by Augustus, they recovered the privilege of collecting sums to send to the temple (Philo Legatio ad Caium 40). Agrippa offered 100 oxen in the temple when visiting Herod (Josephus, Ant, XVI, ii, 1), and Augustus established a daily offering of a bull and two lambs. Upon the whole the Roman government displayed noticeable consideration for the religious scruples of the Jews. They were exempted from military service and the duty of appearing in court on the Sabbath. Yet Tiberius repressed Jewish rites in Rome in 19 AD (Suetonius Tiberius 36) and Claudius expelled the Jews from the city in 49 AD (Suetonius Claudius 25); but in both instances repression was not of long duration.<P>2. Jewish Proselytism:<P>The Jews made themselves notorious in Rome in propagating their religion by means of proselytizing (Horace Satires i.4, 142; i.9, 69; Juvenal xiv.96; Tacitus Hist. v. 5), and the literature of the Augustan age contains several references to the observation of the Sabbath (Tibullus i.3; Ovid Ars amatoria i.67, 415; Remedium amoris 219). Proselytes from among the Gentiles were not always required to observe all the prescriptions of the Law. The proselytes of the Gate (sebomenoi), as they were called, renounced idolatry and serious moral abuses and abstained from the blood and meat of suffocated animals. Among such proselytes may be included the centurion of Capernaum (<a onClick="return mV(\'Luk\',7,5);">Lu 7:5</a>), the centurion Cornelius (<a onClick="return mV(\'Act\',10,1);">Ac 10:1</a>), and the empress Poppea (Josephus, Ant, XX, viii, 11; Tacitus Ann. xvi.6).<P>On "proselytes of the Gate," GJV4, III,177,very properly corrects the error in HJP. These "Gate" people were not proselytes at all; they refused to take the final step that carried them into Judaism—namely, circumcision (Ramsay, The Expositor,1896,p. 200; Harnack, Expansion of Christianity, I, 11).<P>See <a href="./study/isbe/search.html?string=DEVOUT">DEVOUT</a>; <a href="./study/isbe/search.html?string=PROSELYTE">PROSELYTE</a>.<P>Notwithstanding the diffusion of Judaism by means of proselytism, the Jews themselves lived for the most part in isolation in the poorest parts of the city or suburbs, across the Tiber, near the Circus Maximus, or outside the Porta Capena. Inscriptions show that there were seven communities, each with its synagogue and council of elders presided over by a gerusiarch. Five cemeteries have been discovered with many Greek, a few Latin, but no Hebrew inscriptions.<P>LITERATURE.<P>Ewald, The Hist of Israel, English translation by Smith, London, 1885; Renan, Hist of the People of Israel, English translation, Boston, 1896; Schurer, The Jewish People in the Time of Jesus Christ, English translation by MacPherson, New York.<P>VI. Rome and the Christians.<P>1. Introduction of Christianity:<P>The date of the introduction of Christianity into Rome cannot be determined. A Christian community existed at the time of the arrival of Paul (<a onClick="return mV(\'Act\',28,15);">Ac 28:15</a>), to which he had addressed his Epistle a few years before (58 AD). It is commonly thought that the statement regarding the expulsion of the Jews from Rome under Claudius on account of the commotion excited among them by the agitation of Chrestus (Suetonius Claudius 25: Iudaeos impulsore Chresto assidue tumultuantis Roma expulit), probably in 49 AD, is proof of the diffusion of Christian teaching in Rome, on the ground that Chrestus is a colloquial, or mistaken, form of Christus. It has been suggested that the Christian faith was brought to the capital of the empire by some of the Romans who were converted at the time of Pentecost (<a onClick="return mV(\'Act\',2,10,41);">Ac 2:10,41</a>). It would be out of place to discuss here the grounds for the traditional belief that Peter was twice in Rome, once before 50 AD and again subsequent to the arrival of Paul, and that together the two apostles established the church there. Our present concern is with the attitude of the government and society toward Christianity, when once established. It may suffice, therefore, to remind the reader that Paul was permitted to preach freely while nominally in custody (<a onClick="return mV(\'Phl\',1,13);">Php 1:13</a>), and that as early as 64 AD the Christians were very numerous (Tacitus Ann. xv.44: multitudo ingens).<P>2. Tolerance and Proscription:<P>At first the Christians were not distinguished from the Jews, but shared in the toleration, or even protection, which was usually conceded to Judaism as the national religion of one of the peoples embraced within the empire. Christianity was not legally proscribed until after its distinction from Judaism was clearly perceived. Two questions demand our attention: (1) When was Christianity recognized as distinct from Judaism? (2) When was the profession of Christianity declared a crime? These problems are of fundamental importance in the history of the church under the Roman empire.<P>(1) If we may accept the passage in Suetonius cited above (Claudius 25) as testimony on the vicissitudes of Christianity, we infer that at that time the Christians were confused with the Jews. The account of Pomponia Graecina, who was committed to the jurisdiction of her husband (Tacitus Ann. xiii.32) for adherence to a foreign belief (superstitionis externae rea), is frequently cited as proof that as early as 57 AD Christianity had secured a convert in the aristocracy. The characterization of the evidence in this case by the contemporary authority from whom Tacitus has gleaned this incident would apply appropriately to the adherence to Judaism or several oriental religions from the point of view of Romans of that time; for Pomponia had lived in a very austere manner since 44 AD. Since there is some other evidence that Pomponia was a Christian, the indefinite account of the accusation against her as mentioned by Tacitus is partial proof that Christianity had not as yet been commonly recognized as a distinct religion (Marucchi, Elements d\'archeologie chretienne I, 13). At the time of the great conflagration in 64 AD the populace knew of the Christians, and Nero charged them collectively with a plot to destroy the city (Tacitus Ann. xv.44). The recognition of the distinctive character of Christianity had already taken place at this time. This was probably due in large measure to the circumstances of Paul\'s sojourn and trial in Rome and to the unprecedented number of converts made at that time. The empress Poppea, who was probably an adherent of Judaism (Josephus, Ant, XX, viii), may have enlightened the imperial court regarding the heresy of the Christians and their separation from the parent stock.<P>(2) In attempting to determine approximately the time at which Christianity was placed under the official ban of the imperial government, it will be convenient to adopt as starting-points certain incontestable dates between which the act of prosecution must have been issued. It is clear that at the time of the great conflagration (64 AD), the profession of Christianity was not a ground for criminal action. Paul had just been set at liberty by decree of the imperial court (compare <a onClick="return mV(\'2Ti\',4,17);">2Ti 4:17</a>). Moreover, the charge against the Christians was a plot to burn the city, not adherence to a proscribed religion, and they were condemned, as it appears, for an attitude of hostility toward the human race (Tacitus Ann. xv. 44). While governor of Bithynia (circa 112 AD), Pliny the younger addressed Trajan in a celebrated letter (x.96) asking advice to guide his conduct in the trial of many persons who were accused as Christians, and inquiring particularly whether Christianity in itself was culpable, or only the faults which usually accompanied adherence to the new faith. The reply of the emperor makes quite plain the fundamental guilt at that time of adherence to Christianity, and it supposes a law already existing against it (x.97). It follows, therefore, that the law against Christianity which was the legal basis for persecution must have been issued between the conflagration in 64 AD and Pliny\'s administration of Bithynia.<P>We cannot define the time of this important act of legislation more closely with absolute certainty, although evidence is not wanting for the support of theories of more or less apparent probability. Tradition ascribes a general persecution to the reign of Domitian, which would imply that Christianity was already a forbidden religion at that time. Allusions in Revelation (as <a onClick="return mV(\'Rev\',6,9);">6:9</a>), the references to recent calamities in Rome by Clement in his letter to the Corinthians (1 Ad Cor.), the condemnation of Acilius Glabrio (Dio Cassius lxvii.13), a man of consular rank, together with the emperor\'s cousin Flavius Clemens (Dio Cassius, xiii) and Flavia Domitilla and many others on the charge of atheism and Jewish customs (95 AD), are cited as evidence for this persecution. The fact that a number of persons in Bithynia abandoned Christianity 20 years before the judicial investigation of Pliny (Pliny x. 96) is of some importance as corroborative evidence.<P>But there are grounds worthy of consideration for carrying the point of departure back of Domitian. The letter of Peter from Babylon (Rome ?) to the Christians in Asia Minor implies an impending persecution (<a onClick="return mV(\'1Pe\',4,\'12-16\');">1Pe 4:12-16</a>). This was probably in the closing years of the reign of Nero. Allard cleverly observes (Histoire des persecutions, 61) that the mention of the Neronian persecution of the Christians apart from the description of the great fire in the work of Suetonius (Ner. 16), amid a number of acts of legislation, is evidence of a general enactment, which must have been adopted at the time of, or soon after, the proceedings which were instituted on the basis of the charge of arson. Upon the whole theory that the policy of the imperial government was definitely established under Nero carries with it considerable probability (compare Sulpitius Severus, Chron., ii.41).<P>3. Persecution:<P>Although the original enactment has been lost the correspondence of Pliny and Trajan enables us to formulate the imperial policy in dealing with the Christians during the 2nd century. Adherence to Christianity was in itself culpable. But proceedings were not to be undertaken by magistrates on their own initiative; they were to proceed only from charges brought by voluntary accusers legally responsible for establishing the proof of their assertions. Informal and anonymous information must be rejected. Penitence shown in abjuring Christianity absolved the accused from the legal penalty of former guilt. The act of adoring the gods and the living emperor before their statues was sufficient proof of non-adherence to Christianity or of repentance.<P>The attitude of the imperial authorities in the 3rd century was less coherent. The problem became more complicated as Christianity grew. Persecution was directed more especially against the church as an organization, since it was believed to exert a dangerous power. About 202 AD, Septimius Severus issued a decree forbidding specifically conversion to Judaism or Christianity (Spartianus, Severus, 17), in which he departed from the method of procedure prescribed by Trajan (conquirendi non sunt), and commissioned the magistrates to proceed directly against suspected converts. At this time the Christians organized funerary associations for the possession of their cemeteries, substituting corporative for individual ownership, and it would appear that under Alexander Severus they openly held places of worship in Rome (Lampridius, Alexander Severus, 22, 49). The emperor Philip (244-49) is thought to have been a Christian at heart (Eusebius, HE, VI, 34). A period of comparative calm was interrupted by the persecution under Decius (250-51 AD), when the act of sacrifice was required as proof of non-adherence to Christianity. Several certificates testifying to the due performance of this rite have been preserved.<P>Under Valerian (257 AD) the Christian organizations were declared illegal and the cemeteries were sequestrated. But an edict in 260 AD restored this property (Eusebius, VII, 13). A short persecution under Aurelian (274 AD) broke the long period of calm which extended to the first edict of persecution of Diocletian (February 24, 303). The Christians seem to have gained a sort of prescriptive claim to exist, for Diocletian did not at first consider them guilty of a capital crime. He sought to crush their organization by ordering the cessation of assemblies, the destruction of churches and sacred books, and abjuration under pain of political and social degradation. (Lactantius, De Morte Persecutorum, x.11,12,13; Eusebius, VIII, 2; IX, 10). Later he ordered the arrest of all the clergy, who were to be put to death unless they renounced the faith (Eusebius, VIII, 6). Finally the requirement of an act of conformity in sacrificing to the gods was made general. This final persecution, continuing in an irregular way with varying degrees of severity, terminated with the defeat of Maxentius by Constantine (October 29, 312). The Edict of Milan issued by Constantine and Licinius the following year established toleration, the restoration of ecclesiastical property and the peace of the church.<P>LITERATURE.<P>Allard, Histoire des persecutions, Paris, 1903; Le christianisme et l\'empire romain, Paris, 1903; Duchesne, Histoire ancienne de l\'eglise, Paris, 1907 (English translation); Marucchi, Elements d\'archeologie chretienne, Paris, 1899-1902; Hardy, Christianity and the Roman Government, London, 1894; Renan, L\'eglise chretienne, Paris, 1879; Ramsay, The Church in the Roman Empire, London, 1893.`<a href="./study/isbe/search.html?string=ROMAN+EMPIRE+AND+CHRISTIANITY">ROMAN EMPIRE AND CHRISTIANITY</a>`3';
