lines of ancient writing, and infers that the author used two pages of papyrus of the same size for both letters; but why we are to identify 2 John with the letter mentioned in 3 John because both happen to fill the same size of note paper is not quite clear.<P>On the other hand, the difficulties in the way of this attractive hypothesis are too substantial to be set aside. The two Epistles belong to entirely different situations. Both deal with the subject of hospitality; but the one forbids hospitality to the wrong kind of guests, and says nothing about the right kind, the other enjoins hospitality to the right kind and says nothing about the wrong kind. In the one the writer shows himself alarmed about the spread of heresy, in the other, about the insubordination of a self-important official. Is it conceivable that the Presbyter should send at the same time a letter to Gaius in which he promises that he will speedily come with a rod for Diotrephes (who had carried the church along with him), and another to the church in which that recalcitrant person was the leading spirit, in which he expresses the hope that when he comes and speaks face to face their "joy may be made full"—a letter, moreover, in which the real point at issue is not once touched upon? Such a procedure is scarcely imaginable.<P>We are still left, then, with the question What kind of entity, church or individual, is entitled "the lady Electa"? (See <a href="./study/isbe/search.html?string=ELECT+LADY">ELECT LADY</a>, where reasons are given for preferring this translation.) The address of the letter is certainly much more suggestive of an individual than of a church. After all that has been so persuasively argued, notably by Dr. Findlay (Fellowship in the Life Eternal, chapter iii), from the symbolizing of the church as the Bride of Christ, it remains very hard for the present writer to suppose that, in the superscription of a letter and without any hint of symbolism, anyone could address a particular Christian community as "the elect lady" or the "lady elect." On the other hand, the difficulties urged against the personal interpretation are not so grave as sometimes represented. The statement, "I have found certain of thy children walking in truth," does not imply that others of them were not doing so, but emphasizes what had come under the writer\'s personal observation. Nor can we pronounce the elevated and didactic love of the letter more suitable to a church than to an individual without taking into account the character, position and mutual relations of the correspondents. The person (if it was a person) addressed was evidently a Christian matron of high social standing—one able in a special degree to dispense hospitality, and of wide influence, one beloved of "all them that know the truth," whose words would be listened to and whose example would be imitated. And, in view of the ominous spreading of the leaven of Antichrist, it is not difficult to suppose that the Presbyter should write to such a person in such a strain. Nor does there seem to be anything especially odd in the fact of the children of a private family sending their respects to their aunt through the apostle John (Findlay). If he was intimate with that family, and in their immediate vicinity at the time of writing, it appears a natural thing for them to have done. Possibly Dr. Harris\' "exploded" prehistoric countess of Huntington" is not so far astray as a modern equivalent of the lady Electa.<P>LITERATURE.<P>On the 2nd and 3rd Epistles see Commentaries: Lucke, Huther, Ebrard, Holtzmann, Baumgarten, Westcott, Plummer, Bennett, Brooke; Expositions: Findlay, Fellowship in the Life Eternal; S. Cox, The Private Letters of Paul and John; J.M. Gibbon, The Eternal Life.``97';

isbe[5109]='Join`join: Of the New Testament words, kollao, literally, "glue," "weld together," and its compounds, designate the closest form of personal union, as in <a onClick="return mV(\'Luk\',15,15);">Lu 15:15</a>; <a onClick="return mV(\'1Cr\',6,16);">1Co 6:16</a>; <a onClick="return mV(\'Eph\',5,31);">Eph 5:31</a>. In the words of institution of marriage, suzeugnumi is used (<a onClick="return mV(\'Mat\',19,6);">Mt 19:6</a>; <a onClick="return mV(\'Mar\',10,9);">Mr 10:9</a>, literally, "yoke together"; compare <a onClick="return mV(\'Gen\',2,24);">Ge 2:24</a>).``1';
isbe[5110]='Jokdeam`jok\'-de-am (yoqedhe\'am): An unidentified city of Judah, named with Maon, Carmel and Ziph (<a onClick="return mV(\'Jos\',15,56);">Jos 15:56</a>). It probably lay to the south of Hebron.``1';
isbe[5111]='Jokim`jo\'-kim (yoqim, "Yahweh raises up"; compare <a href="./study/isbe/search.html?string=JEHOIAKIM">JEHOIAKIM</a>; <a href="./study/isbe/search.html?string=JOIAKIM">JOIAKIM</a>): A Judahite, descendant of Shelah (<a onClick="return mV(\'1Ch\',4,22);">1Ch 4:22</a>).``1';
isbe[5112]='Jokmeam`jok\'-me-am (yoqme\'am): A town in Mt. Ephraim assigned to the Kohathite Levites (<a onClick="return mV(\'1Ch\',6,68);">1Ch 6:68</a>), named along with Gezer and Beth-horon. Its place is taken by Kibzaim in <a onClick="return mV(\'Jos\',21,22);">Jos 21:22</a> (in Septuagint here the name is omitted). It is mentioned again in <a onClick="return mV(\'1Ki\',4,12);">1Ki 4:12</a> (the King James Version wrongly "Jokneam"), where it seems to indicate some position to the east of Ephraim. So far no identification is possible.``1';
isbe[5113]='Jokneam`jok\'-ne-am (yoqne\'am): A royal city of the Canaanites taken by Joshua and described as "in Carmel" (<a onClick="return mV(\'Jos\',12,22);">Jos 12:22</a>), in the territory of Zebulun, and allotted to the Merarite Levites (21:34). The border of Zebulun "reached to the brook that is before Jokneam" (<a onClick="return mV(\'Jos\',19,11);">19:11</A>). In <a onClick="return mV(\'1Ki\',4,12);">1Ki 4:12</a> the name appears in the King James Version where, with the Revised Version (British and American), we should read "Jokmeam." Eusebius, Onomasticon places it 6 Roman miles from Lejio (Lejjun) on the way to Ptolemais (Acre). This points to Tell Kaimun, a striking mound on the eastern slope of Mt. Carmel. To the east of it runs the "torrent bed" of the Kishon. It stands about 300 ft. above the valley to the north of it, and the sides are steep. It is crowned by the ruins of an 18th-century fortress. A little lower down are the remains of a small chapel. There are fine springs at the foot (PEFM, II, 69f). In Judith 7:3 it appears as "Cyamon" (Kuamon). It is the "Mons Cain" of the Middle Ages. "In the Samaritan Book of Judges it is noticed as the scene of a conflict between the Hebrews and the Giants; and Joshua is said to have been shut up here in magic walls of brass, till on sending a dove to the Hebrew king of Gilead, he was rescued" (Conder, HDB, under the word).``54';
isbe[5114]='Jokshan`jok\'-shan (yoqshan, meaning unknown): Son of Abraham and Keturah (<a onClick="return mV(\'Gen\',25,2,3);">Ge 25:2,3</a> parallel <a onClick="return mV(\'1Ch\',1,32);">1Ch 1:32</a>). Tuch suggested that yoqshan = yoqtan (<a onClick="return mV(\'Gen\',10,\'25-29\');">Ge 10:25-29</a>); see HDB, under the word; Skinner, Genesis, 350.``1';
isbe[5115]='Joktan`jok\'-tan (yoqtan, meaning unknown): "Son" of Eber, and "father" of 13 tribes (<a onClick="return mV(\'Gen\',10,25,26,29);">Ge 10:25,26,29</a>; <a onClick="return mV(\'1Ch\',1,19,20,23);">1Ch 1:19,20,23</a>).``1';
isbe[5116]='Joktheel`jok\'-the-el, jok\'-thel (yoqethe\'el): <P>(1) A city in the Shephelah of Judah named between Mizpeh and Lachish (<a onClick="return mV(\'Jos\',15,38);">Jos 15:38</a>); unidentified.<P>(2) A city in Edom formerly called Sela, taken by Amaziah after the battle in the Valley of Salt, and by him called Joktheel (<a onClick="return mV(\'2Ki\',14,7);">2Ki 14:7</a>).`<a href="./study/isbe/search.html?string=SELA">SELA</a>`1';
isbe[5117]='Jona`jo\'-na.`<a href="./study/isbe/search.html?string=JONAH">JONAH</a>; <a href="./study/isbe/search.html?string=JONAS">JONAS</a>`1';

isbe[5119]='Jonah`jo\'-na (yonah, "dove"; \'Ionas):<P>(1) According to <a onClick="return mV(\'2Ki\',14,25);">2Ki 14:25</a>, Jonah, the son of Amittai, of Gath-hepher, a prophet and servant of Yahweh, predicted the restoration of the land of Israel to its ancient boundaries through the efforts of Jeroboam II. The prophet lived and labored either in the early part of the reign of Jeroboam (790-750 BC), or during the preceding generation. He may with great probability be placed at 800-780 BC. His early ministry must have made him popular in Israel; for he prophesied of victory and expansion of territory. His native village of Gath-hepher was located in the territory of Zebulun (<a onClick="return mV(\'Jos\',19,13);">Jos 19:13</a>).<P>(2) According to the book bearing his name, Jonah the son of Amittai received a command to preach to Nineveh; but he fled in the opposite direction to escape from the task of proclaiming Yahweh\'s message to the great heathen city; was arrested by a storm, and at his own request was hurled into the sea, where he was swallowed by a great fish, remaining alive in the belly of the fish for three days. When on his release from the body of the fish the command to go to Nineveh was renewed, Jonah obeyed and announced the overthrow of the wicked city. When the men of Nineveh repented at the preaching of the prophet, God repented of the evil He had threatened to bring upon them. Jonah was grieved that the oppressing city should be spared, and waited in the vicinity to see what would be the final outcome. An intense patriot, Jonah wished for the destruction of the people that threatened to swallow up Israel. He thought that Yahweh was too merciful to the heathen oppressors. By the lesson of the gourd he was taught the value of the heathen in the sight of Yahweh.<P>It is the fashion now in scholarly circles to treat the Book of Jonah as fiction. The story is said to be an allegory or a parable or a symbolic narrative. Why then did the author fasten upon a true and worthy prophet of Yahweh the stigma of rebellion and narrowness? On theory that the narrative is an allegory, J. Kennedy well says that "the man who wrote it was guilty of a gratuitous insult to the memory of a prophet, and could not have been inspired by the prophet\'s Master thus to dishonor a faithful servant."<P>(3) our Lord referred on two different occasions to the sign of Jonah the prophet (<a onClick="return mV(\'Mat\',12,\'38-41\');">Mt 12:38-41</a>; <a onClick="return mV(\'Luk\',11,\'29-32\');">Lu 11:29-32</a>; <a onClick="return mV(\'Mat\',16,4);">Mt 16:4</a>). He speaks of Jonah\'s experience in the belly of the fish as parallel with His own approaching entombment for three days, and cites the repentance of the Ninevites as a rebuke to the unbelieving men of his own generation. Our Lord thus speaks both of the physical miracle of the preservation of Jonah in the body of the fish and of the moral miracle of the repentance of the Ninevites, and without the slightest hint that He regarded the story as an allegory.``156';
isbe[5120]='Jonah, the Book of`This little roll of four short chapters has given rise to almost as much discussion and difference of opinion as the first four chapters of Genesis. It would be presumptuous to think that one could, in a brief article, speak the final word on the questions in debate.<P>I. Contents of the Book.<P>The story is too well known to need retelling. Moreover, it would be difficult to give the events in fewer words than the author employs in his classic narrative. One event grows out of another, so that the interest of the reader never flags.<P>1. Jonah Disobedient, <a onClick="return mV(\'Jon\',1,\'1-3\');">Jonah 1:1-3</a>:<P>When the call came to Jonah to preach in Nineveh, he fled in the opposite direction, hoping thus to escape from his unpleasant task. He was afraid that the merciful God would forgive the oppressing heathen city, if it should repent at his preaching. Jonah was a narrow-minded patriot, who feared that Assyria would one day swallow up his own little nation; and so he wished to do nothing that might lead to the preservation of wicked Nineveh. Jonah was willing to prophesy to Israel; he at first flatly refused to become a foreign missionary.<P>2. Jonah Punished, <a onClick="return mV(\'Jon\',1,\'4-16\');">Jonah 1:4-16</a>:<P>The vessel in which the prophet had taken passage was arrested by a great storm. The heathen sailors inferred that some god must be angry with some person on board, and cast lots to discover the culprit. When the lot fell upon Jonah, he made a complete confession, and bravely suggested that they cast him overboard. The heathen mariners rowed desperately to get back to land, but made no progress against the storm. They then prayed Yahweh not to bring innocent blood upon them, and cast Jonah into the sea. As the storm promptly subsided, the heathen sailors offered a sacrifice to Yahweh and made vows. In this part of the story the mariners give an example of the capacity of the Gentiles to perform noble deeds and to offer acceptable worship to Yahweh.<P>3. Jonah Miraculously Preserved, <a onClick="return mV(\'Jon\',1,\'17-\');">Jonah 1:17</a>-<a onClick="return mV(\'Jon\',2,\'1-10\');">2:10</a>:<P>Yahweh prepared a great fish to swallow Jonah and to bear him in his body for three days and nights. Surprised to find himself alive and conscious in the body of the fish, the prophet prayed to his God. Already by faith he speaks of his danger as a past experience. The God who had saved him from drowning in the depths of the sea will yet permit him once more to worship with loud thanksgiving. At the command of Yahweh the fish vomits out Jonah upon the dry land. The almost inevitable grotesqueness of this part of the story is one of the strongest arguments against the view that the Book of Jonah is literal history and not a work of the imagination.<P>4. Jonah\'s Ministry in Nineveh, <a onClick="return mV(\'Jon\',3,\'1-4\');">Jonah 3:1-4</a>:<P>Upon the renewal of the command to go to Nineveh, Jonah obeyed, and marching through the streets of the great city, he cried, "Yet forty days, and Nineveh shall be overthrown!" His message was so brief that he may well have spoken it in good Assyrian. If the story of his deliverance from the sea preceded him, or was made known through the prophet himself, the effect of the prophetic message was thereby greatly heightened.<P>5. The Ninevites Repent, <a onClick="return mV(\'Jon\',3,\'5-10\');">Jonah 3:5-10</a>:<P>The men of Nineveh repented at the preaching of Jonah, the entire city uniting in fasting and prayer. So great was the anxiety of the people that even the lower animals were clothed in sackcloth. The men of Nineveh turned from deeds of violence ("their evil way") to seek the forgiveness of an angry God. Yahweh decided to spare the city.<P>6. A Narrow Prophet versus the Merciful God, <a onClick="return mV(\'Jon\',4,\'1-11\');">Jonah 4:1-11</a>:<P>Jonah breaks out into loud and bitter complaint when he learns that Nineveh is to be spared. He decides to encamp near the city to see what will become of it. He hopes it may yet be overthrown. Through a gourd vine Yahweh teaches the prophet a great lesson. If such a mean and perishable plant could come to have real value in the eyes of the sullen prophet, what estimate ought to be put on the lives of the thousands of innocent children and helpless cattle in the great city of Nineveh? These were dearer to the God of heaven than Jonah\'s protecting vine could possibly be to him.<P>II. The Aim of the Book.<P>The main purpose of the writer was to enlarge the sympathies of Israel and lead the chosen people to undertake the great missionary task of proclaiming the truth to the heathen world. Other lessons may be learned from the subordinate parts of the narrative, but this is the central truth of the Book of Jonah. Kent well expresses the author\'s main message: "In his wonderful picture of God\'s love for all mankind, and of the Divine readiness to pardon and to save even the ignorant heathen, if they but repent according to their light, he has anticipated the teaching of the parable of the Prodigal Son, and laid the foundation for some of the broadest faith and the noblest missionary activity of the present generation" (Sermons, Epistles, etc., 420).<P>III. Is the Book History?<p>1. What Did our Lord Teach?:<P>Most of the early interpreters so understood it, and some excellent scholars still hold this view. If Jesus thought of the story as history and so taught, that fact alone would settle the question for the devout believer. On two, possibly three, different occasions He referred to Jonah (<a onClick="return mV(\'Mat\',12,\'38-41\');">Mt 12:38-41</a>; <a onClick="return mV(\'Mat\',16,4);">16:4</a>; <a onClick="return mV(\'Luk\',11,\'29-32\');">Lu 11:29-32</a>). It is significant that Jesus brought the two great miracles of the Book of Jonah into relation with Himself and His preaching. As Jonah was three days and three nights in the body of the fish, so should the Son of Man be three days in the heart of the earth. The men of Nineveh repented at the preaching of Jonah, while the contemporaries of Jesus for the most part rejected His message. It is the fashion now among advanced critics to treat <a onClick="return mV(\'Mat\',12,40);">Mt 12:40</a> as an addition to the words of Jesus, though there is no manuscript evidence in favor of regarding the verse as an interpolation. G.A. Smith, among recent scholars, holds the view that Jesus did not mean to teach the historicity of Jonah\'s experience in the fish.<P>"Christ is using an illustration: it matters not whether that illustration be drawn from the realms of fact or of poetry" (BTP, II, 508). In a footnote Dr. Smith says: "Suppose we tell slothful people that theirs will be the fate of the man who buried his talent, is this to commit us to the belief that the personages of Christ\'s parables actually existed? Or take the homiletic use of Shakespeare\'s dramas—\'as Macbeth did,\' or \'as Hamlet said.\' Does it commit us to the historical reality of Macbeth or Hamlet? Any preacher among us would resent being bound by such an inference. And if we resent this for ourselves, how chary we should be about seeking to bind our Lord by it."<P>Notwithstanding Principal Smith\'s skillful presentation of his case, we still think that our Lord regarded the miracles of the fish and the repentance of the Ninevites as actual events. Orelli puts the matter judiciously: "It is not, indeed, proved with conclusive necessity that, if the resurrection of Jesus was a physical fact, Jonah\'s abode in the fish\'s belly must also be just as historical. On this point also the saying, \'A greater than Jonah is here,\' holds good. But, on the other hand, how arbitrary it is to assert, with Reuss, that Jesus regarded Jonah\'s history as a parable! On the contrary, Jesus saw in it a sign, a powerful evidence of the same Divine power which showed itself also in His dying in order to live again and triumph in the world. Whoever, therefore, feels the religious greatness of the book, and accepts as authoritative the attitude taken to its historical import by the Son of God Himself, will be led to accept a great act of the God who brings down to Hades and brings up again, as an actual experience of Jonah in his flight from his Lord" (The Twelve Minor Prophets,172,3).<P>2. Modern Critical Views:<P>Most modern critical scholars since Kleinert (1868) and Bloch (1875) have regarded the Book of Jonah as a work of the imagination. Some prefer to call it an allegory, others a parable, others a prose poem, others a didactic story, others a midrash, others a symbolical book. Keil, Pusey, Delitzsch, Orelli, J. Kennedy and others have contended for the historical character of the narrative. A few treat it as a legend containing a kernel of fact. Cheyne and a few other scholars assert that in the symbolic narrative are imbedded mythical clements. The trend of critical opinion, even in evangelical circles, has of late been toward the symbolical interpretation. Radical critics boldly set aside the teaching of Jesus as erroneous, while the more evangelical take refuge either in the doctrine of the Kenosis (<a onClick="return mV(\'Phl\',2,\'5-8\');">Php 2:5-8</a>), or in the principle of accommodation. The last explanation might commend itself to the devout student, namely, that Jesus did not think it worth while to correct the views of his contemporaries, had our Lord not spoken more than once of the sign of Jonah, and in such detail as to indicate His acceptance of the entire narrative with its two great miracles.<P>IV. Authorship and Date.<P>The old view that Jonah was the author is still held by some scholars, though most moderns place the book in the late exilic or post-exilic times. A few Aramaic words occur in the Hebrew text. The question in debate is whether the language of Israel in the days of Jeroboam II had taken over words from the Aramaic. There had certainly been a century of close political and commercial contact between Israel and the Arameans of Damascus, so that it would not be surprising to meet with Aramaic words in a prophet of Samaria. Hosea, in the generation following Jonah, betrays little evidence of Aramaic influence in his style and vocabulary. Of course, the personal equation is a factor that ought not to be overlooked. If the author was a Judean, we should probably have to think of the post-exilic period, when Aramaic began to displace Hebrew as the vernacular of the Jews. The Book of Jonah is anonymous, and we really do not know who the author was or when he lived. The view that Jonah wrote the story of his own disobedience and his debate with the merciful God has not been made wholly untenable.<P>V. The Unity of the Book.<P>Nachtigal (1799) contended that there were three different authors of widely different periods. Kleinert (1868) held that two parallel narratives had been woven together in <a onClick="return mV(\'Jon\',3,\'1-\');">Jonah 3</a> and <a onClick="return mV(\'Jon\',4,\'1-\');">4</a>. Kaufmann Kohler (1879) contended that there were a considerable number of glosses and interpolations besides some transpositions of material. W. Bohme, in 1887, advanced the most radical theory of the composition of the roll. He partitioned the story among two authors, and two redactors or supplementers. A few additional glosses were charged to later hands. Even radical critics treat Bohme\'s theory as one of the curiosities of criticism. Winckler (AOF, II, 260ff) tried to improve the story by a few transpositions. Hans Schmidt (1905) subjects the roll of Jonah to a searching criticism, and concludes that a good many changes have been made from religious motives. Budde follows Winckler and Schmidt both in transposing and in omitting some material. Sievers (1905) and Erbt (1907) tried to make of the Book of Jonah a poem; but they do not agree as to the meter. Sievers regards the roll as a unit, while Erbt contends for two main sources besides the prayer in <a onClick="return mV(\'Jon\',2,\'1-\');">Jonah 2</a>. Bewer, in ICC (1912), is far more conservative in both textual and literary criticism, recognizing but few glosses in our present text and arguing for the unity of the story apart from the insertion of the psalm in <a onClick="return mV(\'Jon\',2,\'1-\');">Jonah 2</a>. Nearly all recent critics assign Jonah\'s prayer to a writer other than the author of the narrative about Jonah, but opinions vary widely as to the manner in which the psalm found its way into the Book of Jonah. Bewer holds that it was probably put on the margin by a reader and afterward crept into the text, the copyist inserting it after <a onClick="return mV(\'Jon\',2,2);">2:2</a>, though it would more naturally follow <a onClick="return mV(\'Jon\',2,11);">2:11</a>. Bewer remarks: "The literary connections with various post-exilic psalms argue for a post-exilic date of the psalm. But how early or how late in the post-exilic period it belongs we cannot tell. The Hebrew is pure and no Aramaic influence is apparent." It is evident, then, that the presence or absence of Aramaic influence does not alone settle the question of the date of the document. Geography and the personal equation may be more important than the question of date. Bewer recognizes the fact that the psalm in Jonah is not a mere cento of quotations from the Psalms. "The phrases it has in common with other psalms," writes Professor Bewer, "were the common property of the religious language of the author\'s day" (p. 24). Those who still believe that David wrote many of the psalms find no difficulty in believing that a prophet of 780 BC could have drawn upon his knowledge of the Psalter in a prayer of thanksgiving to Yahweh.<P>LITERATURE.<P>Among commentaries covering the twelve Minor Prophets, see especially Pusey (1861), Keil (English translation, 1880), von Orelli (English translation, 1893), Wellhausen (1898), G.A. Smith (1898). Among special commentaries on Jonah, consult Kleinert, in Lange (English translation, 1875); Perowne, in Cambridge Bible (1897); Bewer in ICC (1912). See also C. H. H. Wright, Biblical Essays (1886); H. C. Trumbull, "Jonah in Nineveh," JBL, XI (1892); J. Kennedy, Book of Jonah (1895); Konig in HDB; Cheyne in EB. For more elaborate bibliography see Bewer in ICC, 25-27.``156';
isbe[5121]='Jonam`jo\'-nam (Ionam, Westcott and Hort, The New Testament in Greek; Ionan, Textus Receptus of the New Testament; the King James Version Jonan): An ancestor of Jesus in Luke\'s genealogy (<a onClick="return mV(\'Luk\',3,30);">Lu 3:30</a>).``1';
isbe[5122]='Jonan`jo\'-nan.`<a href="./study/isbe/search.html?string=JONAM">JONAM</a>`1';
isbe[5123]='Jonas (1)`jo\'-nas (Ionas; the King James Version, Jonan):<P>(1) Son of Eliasib (1Esdras 9:1).<P>(2) Corresponds in 1Esdras 9:23 to "Eliezer" in <a onClick="return mV(\'Ezr\',10,23);">Ezr 10:23</a>.<P>(3) The prophet Jonah (2Esdras 1:39; Tobit 14:4,8).``1';
isbe[5124]='Jonas (2)`jo\'-nas (yonah, or yochanan; Iona):<P>(1) The name given in <a onClick="return mV(\'Mat\',12,\'39-41\');">Mt 12:39-41</a>; <a onClick="return mV(\'Mat\',16,4);">16:4</a>; <a onClick="return mV(\'Luk\',11,\'29-32\');">Lu 11:29-32</a> the King James Version to the Old Testament prophet Jonah (the Revised Version (British and American) renders "Jonah").<P>See <a href="./study/isbe/search.html?string=JONAH">JONAH</a>.<P>(2) (Ioanes): The name given in <a onClick="return mV(\'Jhn\',21,15,16);">Joh 21:15,16</a> the King James Version to the father of the apostle Simon Peter. Nothing further is known of him, except the different forms of his name. In <a onClick="return mV(\'Jhn\',1,42);">Joh 1:42</a> the King James Version he is called Jona (compare also <a onClick="return mV(\'Mat\',16,17);">Mt 16:17</a> the King James Version). In <a onClick="return mV(\'Jhn\',1,42);">Joh 1:42</a>; <a onClick="return mV(\'Jhn\',21,15,16);">21:15,16</a> the Revised Version (British and American) he is called John, with the marginal note "Gr Joanes." In <a onClick="return mV(\'Mat\',16,17);">Mt 16:17</a> the Revised Version (British and American) Simon Peter is called Simon Bar-Jonah.<P>Jonas may be a contraction for Joanes (Keim). It has also been suggested that the father of Simon may have had a double name, Jona-Johannes (compare F. H. Chase in HDB, article "John, father of Simon Peter").``88';
isbe[5125]='Jonath Elem Rehokim`jo\'-nath e\'-lem re-ho\'-kim (yonath \'elem rechoqim) (<a onClick="return mV(\'Psa\',56,1);">Ps 56, title</a>): "The silent dove of the far ones" (i.e. either of far-off lands, or among aliens), or "The dove of the distant terebinths," in either case indicating the tune to the melody of which the psalm was to be sung.`<a href="./study/isbe/search.html?string=PSALMS">PSALMS</a>; <a href="./study/isbe/search.html?string=SONG">SONG</a>`1';
isbe[5126]='Jonathan (1)`jon\'-a-than (yehonathan, yonathan, "Yahweh has given"; Ionathan; compare <a href="./study/isbe/search.html?string=JEHONATHAN">JEHONATHAN</a>):<P>(1) (Hebrew yehonathan): The young "Levite" of <a onClick="return mV(\'Jdg\',17,\'1-\');">Judges 17</a>; <a onClick="return mV(\'Jdg\',18,\'1-\');">18</a> referred to by name in <a onClick="return mV(\'Jdg\',18,30);">18:30</a>, where he is called "the son of Gershom, the son of Moses," and where the King James Version has "Manasseh" for Moses, following the Massoretic Text in which the letter nun of Manasseh is "suspended."<P>Rashi states the reason thus: "Because of the honor of Moses was the nun written so as to alter the name." The original word was Moses, but it was thought undesirable that a descendant of his should have anything to do with images; and so Jonathan was made to have affinity (metaphorically) with Manasseh. See GB, Intro, 335-38.<P>Jonathan was a Levitical Judahite of Beth-lehem-judah, who came to the house of Micah, in the hill country of Ephraim, and hired himself as a priest in Micah\'s sanctuary (<a onClick="return mV(\'Jdg\',17,\'1-13\');">Jud 17:1-13</a>). The Danites sent 5 men north to spy for new territory, and on their way the spies came to the house of Micah, where they found Jonathan and consulted the oracle through him (<a onClick="return mV(\'Jdg\',18,\'1-5\');">Jud 18:1-5</a>). Having received a favorable answer, they set out and came to Laish, and on their return south they advised that an expedition be sent thither (<a onClick="return mV(\'Jdg\',18,\'6-10\');">Jud 18:6-10</a>). Their clansmen accordingly sent out a band of warriors who on their way passed by Micah\'s house. The spies informed their comrades of the ephod and teraphim and images there, and they seized them, inducing Jonathan at the same time to accompany them as their priest (<a onClick="return mV(\'Jdg\',18,\'11-20\');">Jud 18:11-20</a>). At Laish he founded a priesthood which was thus descended from Moses (<a onClick="return mV(\'Jdg\',18,30);">Jud 18:30</a>).<P>It has been held that there are two sources in the narrative in <a onClick="return mV(\'Jdg\',17,\'1-\');">Judges 17</a>; <a onClick="return mV(\'Jdg\',18,\'1-\');">18</a> (see Moore, Judges, 365-72). The section is important because of the light it throws on life and religion in early Israel. The "Levites" were not all of one tribe (see Moore, op. cit., 383-84); there were priests who claimed descent from Moses as well as Aaronite priests; and images were common in early Hebrew worship (compare <a onClick="return mV(\'Gen\',31,30);">Ge 31:30</a>ff; <a onClick="return mV(\'Jdg\',8,27);">Jud 8:27</a>; <a onClick="return mV(\'1Sa\',19,13);">1Sa 19:13</a>).<P>(2) Son of King Saul. See separate article [<A href="./study/isbe/search.html?string=JONATHAN+(2)">Jonathan (2)]</A>.<P>(3) (Hebrew yehonathan, yonathan, <a onClick="return mV(\'2Sa\',15,27,36);">2Sa 15:27,36</a>; <a onClick="return mV(\'2Sa\',17,17,20);">17:17,20</a>; <a onClick="return mV(\'1Ki\',1,42,43);">1Ki 1:42,43</a>): Son of Abiathar the priest. He acted with Ahimaaz as courier to inform David of events at Jerusalem during Absalom\'s revolt. It was he who also brought to Adonijah the news of Solomon\'s accession.<P>(4) (Hebrew yehonathan, <a onClick="return mV(\'2Sa\',21,21);">2Sa 21:21</a> parallel <a onClick="return mV(\'1Ch\',20,7);">1Ch 20:7</a>): Son of Shimei or Shimea, David\'s brother; he is said to be the slayer of Goliath.<P>See <a href="./study/isbe/search.html?string=JEHONADAB">JEHONADAB (1)</a>.<P>(5) (<a onClick="return mV(\'2Sa\',23,32);">2Sa 23:32</a>, Hebrew yehonathan = <a onClick="return mV(\'1Ch\',11,34);">1Ch 11:34</a>, Hebrew yonathan): One of David\'s mighty men.<P>See <a href="./study/isbe/search.html?string=JASHEN">JASHEN</a>.<P>(6) (Hebrew yonathan, <a onClick="return mV(\'1Ch\',2,32,33);">1Ch 2:32,33</a>): A Jerahmeelite.<P>(7) (Hebrew yehonathan, and so <a onClick="return mV(\'1Ch\',27,25);">1Ch 27:25</a> the King James Version): Son of Uzziah, and one of David\'s treasurers.<P>(8) (Hebrew yehonathan, <a onClick="return mV(\'1Ch\',27,32);">1Ch 27:32</a>): A dodh of David, the Revised Version (British and American) "uncle," the Revised Version margin "brother\'s son"; if he was David\'s nephew, he will be the same as (4) above. He "was a counselor" to David, and "a man of understanding, and a scribe."<P>(9) (Hebrew yonathan, <a onClick="return mV(\'Ezr\',8,6);">Ezr 8:6</a>; 1Esdras 8:32): Father of Ebed, a returned exile.<P>(10) (Hebrew yonathan, <a onClick="return mV(\'Ezr\',10,15);">Ezr 10:15</a>; 1Esdras 9:14): One who either supported (Revised Version (British and American)) or opposed (Revised Version margin, the King James Version) Ezra in the matter of foreign marriages; see <a href="./study/isbe/search.html?string=JAHZEIAH">JAHZEIAH</a>.<P>(11) (Hebrew yonathan, <a onClick="return mV(\'Neh\',12,11);">Ne 12:11</a>): A priest, descendant of Jeshua (Joshua) = "Johanan" (<a onClick="return mV(\'Neh\',12,22,23);">Ne 12:22,23</a>); see <a href="./study/isbe/search.html?string=JEHOHANAN">JEHOHANAN, (3)</a>.<P>(12) (Hebrew yonathan, <a onClick="return mV(\'Neh\',12,14);">Ne 12:14</a>): A priest.<P>(13) (Hebrew yonathan, <a onClick="return mV(\'Neh\',12,35);">Ne 12:35</a>): A priest, father of Zechariah.<P>(14) (Hebrew yehonathan, <a onClick="return mV(\'Jer\',37,15,20);">Jer 37:15,20</a>; <a onClick="return mV(\'Jer\',38,26);">38:26</a>): A scribe in whose house Jeremiah was imprisoned.<P>(15) (Hebrew yonathan, <a onClick="return mV(\'Jer\',40,8);">Jer 40:8</a>): Son of Kareah; a Judahite captain who joined Gedaliah after the fall of Jerusalem.<P>(16) (Ionathes, 1Macc 2:5; 9-13; and Inathan 2Macc 8:22; Swete reads Ionathes): The Maccabee surnamed Apphus in 1Macc 2:5, son of Mattathias.<P>(17) Son of Absalom (1Macc 13:11). He was sent by Simon the Maccabee to capture Joppa (compare 1Macc 11:70, where there is mentioned a Mattathias, son of Absalom).<P>(18) A priest who led in prayer at the first sacrifice after the return from exile (2Macc 1:23).``149';
isbe[5127]='Jonathan (2)`(yehonathan; also yonathan, "Yahweh has given"; Ionathan): The eldest son of Saul, the first king of Israel, of the tribe of Benjamin.<P>1. Three Periods:<P>The life of Jonathan, as far as we are told about him, falls naturally into 3 periods.<P>(1) First Period.<P>He comes on the scene as the right hand and lieutenant of his father in his early struggles to beat off the hostile tribes, especially the Ammonites (<a onClick="return mV(\'1Sa\',11,\'1-\');">1Sa 11</a>), who beset the territory of Israel on all sides. As soon as Saul had gained his first decisive victory, the people rallied to him in great numbers, so that he was able to count upon 3,000 men whenever they took the field. These were divided into two small armies, Saul retaining 2,000 and making Michmash his headquarters, the rest being stationed at Gibeah under Jonathan, some 5 miles distant as the crow flies. Jonathan thus commanded the base, while his father led the fighting force. This position of comparative inactivity does not appear to have been much to the taste of Jonathan. Midway between the two camps was a Philistine outpost at Geba, facing Michmash across the pass of that name, a valley with steep sides, now the Wady Suweinit. Saul does not seem to have felt himself strong enough to commence hostilities against the Philistines, and took means to increase the forces at his disposal. The Philistines no sooner heard that the Israelites had cast off their yoke (<a onClick="return mV(\'1Sa\',13,3);">1Sa 13:3b</a>: for "Let the Hebrews hear," read "The Hebrews have revolted," after the Septuagint), than they came out in great numbers (<a onClick="return mV(\'1Sa\',13,5);">1Sa 13:5</a>). They seem to have compelled Saul to evacuate Michmash, which they occupied, Saul falling back on Gibeah (<a onClick="return mV(\'1Sa\',13,16);">1Sa 13:16</a>) and Gilgal with a greatly reduced following (<a onClick="return mV(\'1Sa\',13,3,4);">1Sa 13:3,4</a> a seems to be a summary anticipation, in Hebrew style, of the events detailed in <a onClick="return mV(\'1Sa\',14,\'1-\');">1Sa 14</a>). In spite of this, Jonathan, accompanied only by his armor-bearer, surprised the Philistine outpost at Geba (<a onClick="return mV(\'1Sa\',14,5);">1Sa 14:5</a>, "Gibeah" should be "Geba"), which was killed to a man. This feat precipitated a general engagement, in which the Israelites, whose only weapons appear to have been their farming implements (<a onClick="return mV(\'1Sa\',13,20);">1Sa 13:20</a>), Saul and Jonathan alone being armed with iron swords and spears, routed their enemies. The completeness of the victory was impaired by the superstitious action of Saul in refusing to allow the people to eat until the day was over (<a onClick="return mV(\'1Sa\',14,24);">1Sa 14:24</a>). As this order was unwittingly broken by Jonathan, Saul wished to have him executed; but this the people refused to allow, as they clearly recognized that the credit of the victory was due to the energetic action of Jonathan in striking before the enemy had time to concentrate. (In the Hebrew text there is some confusion between Gibeah and Geba; compare <a onClick="return mV(\'1Sa\',10,5);">1Sa 10:5</a> margin and <a onClick="return mV(\'1Sa\',13,3);">13:3.</a>)<P>(2) Second Period.<P>The 2nd period of the life of Jonathan is that of his friendship for David. The narrative is too well known to need recapitulating, and the simple tale would only be spoiled by telling it in other words. Jonathan\'s devotion to David was such that he not only took his part against his father, Saul (<a onClick="return mV(\'1Sa\',18,\'1-\');">1Sa 18</a>; <a onClick="return mV(\'1Sa\',19,\'1-\');">19</a>), but was willing to surrender to him his undoubted claim to become Saul\'s successor (<a onClick="return mV(\'1Sa\',20,\'1-\');">1Sa 20</a>). Their last meeting took place in the "desert" of Ziph, to the south of Hebron, some time after David had been driven into outlawry (<a onClick="return mV(\'1Sa\',23,\'16-18\');">1Sa 23:16-18</a>).<P>(3) Third Period.<P>The 3rd phase of Jonathan\'s life is that of the exile of David, when Saul was directing his energies to combat what he no doubt considered the rebellion of the son of Jesse. During this civil war, if that can be called war in which one of the two sides refuses to take the offensive against the other, Jonathan remained entirely passive. He could not take part in proceedings which were directed against his friend whom he believed to be destined to occupy the place which he himself should in the ordinary course of events have filled. We therefore hear no more of Jonathan until the encroachments of the Philistines once more compelled Saul to leave the pursuit of the lesser enemy in order to defend himself against the greater. Saul\'s last campaign against the Philistines was short and decisive: it ended in the defeat of Gilboa and the death of himself and his sons. The men of Jabesh-gilead, out of gratitude for Saul\'s rescue of their town at the beginning of his reign, crossed over to Beth-shan, on the walls of which town the Philistines had hung in chains the bodies of Saul and Jonathan, and took them down under cover of darkness and carried them to Jabesh. There they burned the bodies after the manner of the primitive inhabitants of the land, and buried the bones.<P>2. His Character:<P>If we may judge from the little which has been handed down to us concerning him, Jonathan must have been one of the finest spirits that ever lived. His character is, as far as our knowledge goes, nearly perfect. He was athletic and brave (<a onClick="return mV(\'1Sa\',14,13);">1Sa 14:13</a>; <a onClick="return mV(\'2Sa\',1,22,23);">2Sa 1:22,23</a>).<P>3. Military Qualities:<P>He could keep his plans secret when secrecy was necessary in order to carry them to a successful issue (<a onClick="return mV(\'1Sa\',14,\'1-\');">1Sa 14:1</a>), and could decide on what course of action to follow and act upon it on the instant. His attack upon the Philistine garrison at Geba (or Gibeah, if we adopt the reading of the Septuagint and Targum of <a onClick="return mV(\'1Sa\',13,3);">1Sa 13:3</a>; compare <a onClick="return mV(\'1Sa\',10,5);">10:5</a>) was delivered at the right moment, and was as wise as it was daring. If he had a fault, from a military point of view, it may have been an inability to follow up an advantage. The pursuit of the Philistines on the occasion referred to ended with nightfall. In this respect, however, he perhaps cannot be censured with justice, as he never had an entirely free hand.<P>4. Filial Piety:<P>Jonathan\'s independence and capacity for acting on his own responsibility were combined with devotion to his father. While holding his own opinion and taking his own course, he conformed as far as possible to his father\'s views and wishes. While convinced of the high deserts of David, he sought by all means to mitigate Saul\'s hatred toward him, and up to a certain point he succeeded (<a onClick="return mV(\'1Sa\',19,6);">1Sa 19:6</a>). Filial duty could not have been more severely tested than was that of Jonathan, but his conduct toward both his father and his friend is above criticism. Only on one occasion did his anger get the better of him (<a onClick="return mV(\'1Sa\',20,34);">1Sa 20:34</a>) under gross provocation, Saul having impugned the honor of Jonathan\'s mother (<a onClick="return mV(\'1Sa\',20,30);">1Sa 20:30</a>, Septuagint) Ahinoam (<a onClick="return mV(\'1Sa\',14,50);">1Sa 14:50</a>), and attempted his life. The estrangement was momentary; Saul and Jonathan were undivided in life and in death (<a onClick="return mV(\'2Sa\',1,23);">2Sa 1:23</a> to be so read).<P>5. Friendship for David:<P>But it is as the befriender of David that Jonathan will always be remembered. He is the type of the very perfect friend, as well as of the chivalrous knight, for all time. His devotion to David was altogether human; had it been dictated by a superstitious belief in David\'s destiny as the future ruler of his people (<a onClick="return mV(\'1Sa\',23,17);">1Sa 23:17</a>), that belief would have been shared by Saul, which was not the case (<a onClick="return mV(\'1Sa\',20,31);">1Sa 20:31</a>). In disinterestedness and willingness to efface his own claims and give up his own titles the conduct of Jonathan is unsurpassed, and presents a pleasing contrast to some of the characters with whom we meet in the Bible. In this respect he resembles \'Ali, the cousin and son-in-law of Muhammad, who was the bravest of the brave, save when fighting in his own cause, and who had no ambition to fill the highest posts. So Jonathan preferred to serve rather than to command (<a onClick="return mV(\'1Sa\',23,17);">1Sa 23:17</a>). Jonathan and David stand for the highest ideal of Hebrew friendship, as do Damon and Pythias in Greek literature.<P>6. Inspired Affection:<P>We may be sure that Jonathan won the affection of the people. His squire was ready to follow him anywhere (<a onClick="return mV(\'1Sa\',14,7);">1Sa 14:7</a>). David\'s devotion to him seems to have been sincere, although it unfortunately coincided with his own self-interest. Jonathan appears to have inspired as great an affection as he himself felt (<a onClick="return mV(\'1Sa\',20,41);">1Sa 20:41</a>; <a onClick="return mV(\'2Sa\',1,26);">2Sa 1:26</a>). His quarrel with his father was largely due to the solicitude of the latter for his son\'s interests (<a onClick="return mV(\'1Sa\',18,29);">1Sa 18:29</a>; <a onClick="return mV(\'1Sa\',20,31);">20:31</a>).<P>7. His Descendants:<P>Jonathan\'s sons were, in common with his brother\'s, killed in the wars. One alone—Meribbaal (Mephibosheth)—survived. Jonathan\'s posterity through him lasted several generations. A table of them is given in <a onClick="return mV(\'1Ch\',8,33);">1Ch 8:33</a>ff parallel <a onClick="return mV(\'1Ch\',9,40);">9:40</a>ff (compare <a onClick="return mV(\'2Sa\',9,12);">2Sa 9:12</a>). They were famous soldiers and were, like their ancestors, distinguished in the use of the bow (<a onClick="return mV(\'1Ch\',8,40);">1Ch 8:40</a>).``189';
isbe[5128]='Jonathas`jon\'-a-thas (Swete reads Iathan, in Codex Vaticanus; Nathan, in Codex Sinaticus): The Latin form of the common name "Jonathan" (Tobit 5:13). See <a href="./study/isbe/search.html?string=JATHAN">JATHAN</a>. It is sometimes represented as Nathan.``1';
isbe[5129]='Joppa`jop\'-a (yapho, yapho\'; Ioppe): In <a onClick="return mV(\'Jos\',19,46);">Jos 19:46</a> the King James Version called "Japho," a city in the territory allotted to Dan; but there is nothing to show that in pre-exilic times it ever passed into Israelite hands.<P>1. Ancient Notices:<P>"The gate of Joppa" is mentioned in the Tell el-Amarna Letters (214, 32f; compare 178, 20), as guarded by an Egyptian officer for Amenhotep IV. It was conquered by Thothmes III, and old Egyptian records speak of the excellence of its gardens and fruit trees. Sennacherib claims to have taken Jonathas after a siege (Keilinschriftliche Bibliothek, 2, 93). To Jonathas, the Chronicler tells us, the cedars of Lebanon were brought in floats for transportation to Jerusalem by the workmen of the king of Tyre (<a onClick="return mV(\'2Ch\',2,16);">2Ch 2:16</a>).<P>2. Biblical References:<P>The city does not appear in the history as Philistine, so we may, perhaps, infer that it was held by the Phoenicians, the great seamen of those days. It was doubtless a Phoenician ship that Jonah found here, bound for Tarshish, when he fled from the presence of the Lord (<a onClick="return mV(\'Jon\',1,3);">Jon 1:3</a>). In Ezra\'s time, again, cedars were brought here for the buildings in Jerusalem (<a onClick="return mV(\'Ezr\',3,7);">Ezr 3:7</a>). Having been brought by messengers from Lydda to Jonathas, Peter here raised the dead Dorcas to life (<a onClick="return mV(\'Act\',9,36);">Ac 9:36</a>f). On the roof of Simon\'s house by the sea, the famous vision was vouchsafed to this apostle, from which he learned that the gospel was designed for Jew and Gentile alike (<a onClick="return mV(\'Act\',10,1);">Ac 10:1</a>ff; <a onClick="return mV(\'Act\',11,5);">11:5</a>).<P>3. History from Maccabean Times:<P>The men of Joppa, having treacherously drowned some 200 Jews, Judas Maccabeus fell upon the town "and set the haven on fire by night, and burned the boats, and put to the sword those that had fled thither" (2Macc 12:3ff). Jonathan took the city, in which Apollonius had placed a garrison (1Macc 11:47ff). It was not easy to hold, and some years later it was captured again by Simon, who garrisoned the place, completed the harbor and raised the fortifications (1Macc 12:36f; 13:11; 14:5-34). It is recorded as part of Simon\'s glory that he took it "for a haven, and made it an entrance for the isles of the sea," the Jews thus possessing for the first time a seaport through which commerce might be fully developed. It was taken by Pompey and joined to the province of Syria (Ant., XIV, iv, 4; BJ, I, vii, 7). Caesar restored it to the Jews under Hyrcanus (Ant., XIV, x, 6). It was among the cities given by Antony to Cleopatra (XV, iv, 1). Caesar added it to the kingdom of Herod (vii. 3; BJ, I, xx, 3), and at his death it passed to Archelaus (Ant., XVII, xi, 4; BJ, II, vi, 3). At his deposition it was attached to the Roman province. The inhabitants were now zealous Jews, and in the Roman wars it suffered heavily. After a massacre by Cestius Gallus, in which 8,400 of the people perished, it was left desolate. Thus it became a resort of the enemies of Rome, who turned pirates, and preyed upon the shipping in the neighboring waters. The place was promptly captured and destroyed by Vespasian. The people took to their boats, but a terrific storm burst upon them, dashing their frail craft to pieces on the rocks, so that vast numbers perished (BJ, III, ix, 2-4). At a later time it was the seat of a bishopric. During the Crusades it had a checkered history, being taken, now by the Christians, now by the Moslems. It was captured by the French under Kleber in 1799. It was fortified by the English, and afterward extended by the Turks (Baedeker, Palestine, 130).<P>4. Description:<P>The modern Yafa is built on a rocky mound 116 ft. high, at the edge of the sea. A reef of rocks runs parallel to the shore a short distance out. It may be rounded in calm weather by lighter vessels, and it affords a certain amount of protection. There is a gap in the reef through which the boats pass that meet the steamers calling here. In time of storm the passage is dangerous. On one of these rocks Perseus is said to have rescued the chained Andromeda from the dragon. Yafa is a prosperous town, profiting much by the annual streams of pilgrims who pass through it on their way to visit the holy places in Palestine. A good trade is done with Egypt, Syria and Constantinople. Soap, sesame, wheat and oranges are the chief exports. The famous gardens and orange groves of Jaffa form one of the main sights of interest. The Christians and the Moslems have rival traditions as to the site of the house of Simon the tanner. The remains of the house of Tabitha are also pointed out. From Jaffa to Jerusalem the first railway in Palestine was built.``54';
isbe[5130]='Jorah`jo\'-ra (yorah meaning uncertain, perhaps "harvest-born"): A family which returned with Zerubbabel (<a onClick="return mV(\'Ezr\',2,18);">Ezr 2:18</a>) = "Chariph" of <a onClick="return mV(\'Neh\',7,24);">Ne 7:24</a> = "Arsiphurith" (the King James Version "Arzephurith") of 1Esdras 5:16.``1';
isbe[5131]='Jorai`jo\'-ra-i (yoray, "whom Yahweh teaches"): A Gadite chief, but possibly the name of a clan (<a onClick="return mV(\'1Ch\',5,13);">1Ch 5:13</a>).``1';
isbe[5132]='Joram`jo\'-ram (yoram, "Yahweh is exalted"; compare <a href="./study/isbe/search.html?string=JEHORAM">JEHORAM</a>):<P>(1) Son of Toi (or Tou, according to Septuagint, Codex Vaticanus, and <a onClick="return mV(\'1Ch\',18,9,10);">1Ch 18:9,10</a>), sent by his father to greet David (<a onClick="return mV(\'2Sa\',8,10);">2Sa 8:10</a>) = "Hadoram" (<a onClick="return mV(\'1Ch\',18,9,10);">1Ch 18:9,10</a>) a form preferred by commentators in 2Sa also.<P>(2) Same as Jehoram, king of Judah (<a onClick="return mV(\'2Ki\',8,\'21-24\');">2Ki 8:21-24</a>; <a onClick="return mV(\'2Ki\',11,2);">11:2</a>; <a onClick="return mV(\'1Ch\',3,11);">1Ch 3:11</a>; <a onClick="return mV(\'Mat\',1,8);">Mt 1:8</a> Ioram).<P>(3) Same as Jehoram, king of Northern Israel (<a onClick="return mV(\'2Ki\',8,29);">2Ki 8:29</a>; compare <a onClick="return mV(\'2Ki\',9,15);">2Ki 9:15</a> the Revised Version margin).<P>(4) (In form yoram): A Levite (<a onClick="return mV(\'1Ch\',26,25);">1Ch 26:25</a>).<P>(5) (Ioram, 1Esdras 1:9) = "Jozabad" (<a onClick="return mV(\'2Ch\',35,9);">2Ch 35:9</a>); see <a href="./study/isbe/search.html?string=JOZABAD">JOZABAD (4)</a>.``1';
isbe[5133]='Jordan`jor\'-dan (yarden, "flowing downward"; \'Iordanes):<P>1. Source:<P>The Jordan river proper begins at the junction of four streams (the Bareighit, the Hasbany, the Leddan, and the Banias), in the upper part of the plain of Lake Huleh. The Bareighit receives its supply of water from the hills on the west, which separate the valley from the river Litany, and is the least important of the four. The Hasbany is the longest of the four (40 miles), issuing from a great fountain at the western foot of Mt. Hermon near Hasbeiya, 1,700 ft. above the sea, and descends 1,500 ft. in its course to the plain. The Leddan is the largest of the four streams, issuing in several fountains at the foot of the mound Tell el-kady (Dan, or Laish) at an elevation of 505 ft. above the sea. The Banias issues from a celebrated fountain near the town of Banias, which is identified as the Caesarea Philippi associated with the transfiguration. The ancient name was Paneas, originating from a grotto consecrated to the god Pan. At this place Herod erected a temple of white marble dedicated to Augustus Caesar. This is probably the Baal-gad of <a onClick="return mV(\'Jos\',11,17);">Jos 11:17</a> and <a onClick="return mV(\'Jos\',12,7);">12:7</a>. Its altitude <span clas="noTag">is</span> 1,100 ft. above tide, and the stream falls about 600 ft. in the 5 miles of its course to the head of the Jordan.<P>2. Lake Huleh:<P>The valley of Lake Huleh, through which the Jordan wends its way, is about 20 miles long and 5 miles wide, bordered on either side by hills and mountains attaining elevations of 3,000 ft. After flowing 4 or 5 miles through a fertile plain, the Jordan enters a morass of marshy land which nearly fills the valley, with the exception of 1 or 2 miles between it and the base of the mountains upon the western side. This morass is almost impenetrable by reason of bushes and papyrus reeds, which in places also render navigation of the channel difficult even with a canoe. Lake Huleh, into which the river here expands, is but 7 ft. above tide, and is slowly contracting its size by reason of the accumulation of the decaying vegetation of the surrounding morass, and of the sediment brought in by the river and three tributary mountain torrents. Its continued existence is evidence of the limited period through which present conditions have been maintained. It will not be many thousand years before it will be entirely filled and the morass be changed into a fertile plain. When the spies visited the region, the lake must have been much larger than it is now.<P>At the southern end of Lake Huleh, the valley narrows up to a width of a few hundred yards, and the river begins its descent into levels below the Mediterranean. The river is here only about 60 ft. broad, and in less than 9 miles descends 689 ft. through a narrow rocky gorge, where it meets the delta which it has deposited at the head of the Sea of Galilee, and slowly winds its way to meet its waters. Throughout this delta the river is easily fordable during a great part of the year.<P>3. Sea of Galilee:<P>The Sea of Galilee occupies an expansion of the Jordan valley 12 miles long and from 3 to 6 miles wide. The hills, reaching, in general, 1,200 or 1,500 ft. above the lake, come down close to its margin on every side. On the east and south they are mainly of volcanic origin, and to some extent of the same character on the northwest side above Tiberias. In the time of Christ the mouth of the river may have been a half-mile or more farther up the delta than now.<P>4. The Yarmuk:<P>As all the sediment of the upper Jordan settles in the vicinity of the delta near Capernaum, a stream of pellucid water issues from the southern end of the lake, at the modern town of Kerak. Before it reaches the Dead Sea, however, it becomes overloaded with sediment. From Kerak the opening of the valley is grand in the extreme. A great plain on the east stretches to the hills of Decapolis, and to the south, as far as the eye can reach, through the Ghor which descends to the Dead Sea, bordered by mountain walls on either side. Four or five miles below, it is joined on the east by the Yarmuk, the ancient Hieromax the largest of all its tributaries. The debris brought down by this stream has formed a fertile delta terrace 3 or 4 miles in diameter, which now, as in ancient times, is an attractive place for herdsmen and agriculturists. The valley of the Yarmuk now furnishes a natural grade for the Acre and Damascus Railroad, as it did for the caravan routes of early times. The town of Gadara lies upon an elevation just south of the Yarmuk and 4 or 5 miles east of the Jordan.<P>Ten miles below the lake, the river is joined on the west by Wddy el-Bireh, which descends from the vicinity of Nazareth, between Mt. Tabor and Endor, and furnishes a natural entrance from the Jordan to Central Galilee. An aqueduct here still furnishes water for the upper terrace of the Ghor. Wddy el-Arab, with a small perennial stream, comes in here also from the east.<P>5. El-Ghor:<P>Twenty miles below Lake Galilee the river is joined by the important Wady el-Jalud, which descends through the valley of Jezreel between Mt. Gilboa and the range of the Little Hermon (the hill Moreh of <a onClick="return mV(\'Jdg\',7,1);">Jud 7:1</a>). This valley leads up from the Jordan to the valley of Esdrelon and thence to Nazareth, and furnished the usual route for Jews going from Jerusalem to Nazareth when they wished to avoid the Samaritans. This route naturally takes one past Beisan (Bethshean), where the bodies of Saul and Jonathan were exposed by the Philistines, and past Shunem and Nain. There is a marked expansion of the Ghor opposite Beisan, constituting an important agricultural district. The town of Pella, to which the Christians fled at the time of the destruction of Jerusalem, lies upon the east side of the Ghor; while Jabesh-gilead, where the bodies of Saul and Jonathan were finally taken by their friends and cremated, is a little farther up the slope of Gilead. Twenty miles farther down, the Ghor, on the east, is joined by Wady Zerka (the brook Jabbok), the second largest tributary, separating Ammon from Gilead, its upper tributaries flowing past Ammon, Mizpeh, and Ramoth-gilead. It was down this valley that Jacob descended to Succoth.<P>A few miles below, the Wady Farah, whose head is at Sychar between Mts. Ebal and Gerizim, descends from the west, furnishing the natural route for Jacob\'s entrance to the promised land.<P>At Damieh (probably the Adam of <a onClick="return mV(\'Jos\',3,16);">Jos 3:16</a>), the Ghor is narrowed up by the projection, from the west, of the mountain ridge terminating in Kurn Surtubeh, which rises abruptly to a height of 2,000 ft. above the river.<P>The section of the Ghor between Damieh and the Dead Sea is of a pretty uniform width of 10 to 12 miles and is of a much more uniform level than the upper portions, but its fertility is interfered with by the lack of water and the difficulty of irrigation. From the vicinity of Jericho, an old Roman road follows up the Wady Nawaimeh, which furnished Joshua a natural line of approach to Ai, while through the Wady el-Kelt is opened the natural road to Jerusalem. Both Ai and the Mount of Olives are visible from this point of the Ghor.<P>6. The Zor:<P>In a direct line it is only 70 miles from Lake Galilee to the Dead Sea, and this is the total length of the lower plain (the Zor); but so numerous are the windings of the river across the flood plain from one bluff to the other that the length of the river is fully 200 miles. Col. Lynch reported the occurrence of 27 rapids, which wholly interrupted navigation, and many others which rendered it difficult. The major part of the descent below Lake Galilee takes place before reaching Damieh, 1,140 ft. below the Mediterranean. While the bluffs of the Ghor upon either side of the Zor, are nearly continuous and uniform below Damieh, above this point they are much dissected by the erosion of tributary streams. Still, nearly everywhere, an extended view brings to light the original uniform level of the sedimentary deposits formed when the valley was filled with water to a height of 650 ft. (see <a href="./study/isbe/search.html?string=ARABAH">ARABAH</a>; <a href="./study/isbe/search.html?string=DEAD+SEA">DEAD SEA</a>).<P>The river itself averages about 100 ft. in width when confined strictly within its channel, but in the early spring months the flood plain of the Zor is completely overflowed, bringing into its thickets a great amount of driftwood which increases the difficulty of penetrating it, and temporarily drives out ferocious animals to infest the neighboring country.<P>7. The Fords of Jordan:<P>According to Conder, there are no less than 60 fording-places between Lake Galilee and the Dead Sea. For the most part it will be seen that these occur at rapids, or over bars deposited by the streams which descend from one side or the other, as, for example, below the mouths of the Yarmuk, Jabbok, Jalud and Kelt. These fords are, however, impassable during the high water of the winter and spring months. Until the occupation by the Romans, no bridges were built; but they and their successors erected them at various places, notably below the mouth of the Yarmuk, and the Jabbok, and nearly opposite Jericho.<P>Notwithstanding the great number of fords where it is possible to cross at low water, those which were so related to the lines of travel as to be of much avail were few. Beginning near the mouth of the Jordan and proceeding northward, there was a ford at el-Henu leading directly from Jericho to the highlands northeast of the Dead Sea. Two or three miles farther to the north is the ford of the pilgrims, best known of all, at the mouth of Wady Kelt. A few miles farther up the river on the road leading from Jericho to es-Salt, near the mouth of the Wady Nimrin, there is now a bridge where the dependence was formerly upon the ford. Just below the mouth of the Wady Zerka (Jabbok) is the ford of Damieh, where the road from Shechem comes down to the river. A bridge was at one time built over the river at this point; but owing to a change in the course of the stream this is now over a dry water-course. The next important crossing-place is at the opening of the valley of Jezreel coming in from the west, where probably the Bethabara of the New Testament should be located. Upon this ford a number of caravan routes from east to west converge. The next important crossing-place is at el-Mujamia, 2 or 3 miles below the mouth of the Yarmuk. Here, also, there was a Roman bridge. There are also some traces of an ancient bridge remaining just below the exit of the river from Lake Galilee, where there was a ford of special importance to the people residing on the shores of this lake who could not afford to cross in boats. Between Lake Galilee and Lake Huleh, an easy ford leads across the delta of the stream a little above its junction with the lake; while 2 or 3 miles below Lake Huleh is found "the bridge of Jacob\'s daughters" on the line of one of the principal routes between Damascus and Galilee. Above Lake Huleh the various tributaries are easily crossed at several places, though a bridge is required to cross the Bareighit near its mouth, and another on the Hasbany on the main road from Caesarea Philippi to Sidon, at el-Ghagar.``198';
isbe[5134]='Jordan Valley`1. Physical Peculiarities:<P>As more fully detailed elsewhere (see <a href="./study/isbe/search.html?string=ARABAH">ARABAH</a>; <a href="./study/isbe/search.html?string=DEAD+SEA">DEAD SEA</a>; <a href="./study/isbe/search.html?string=GEOLOGY+OF+PALESTINE">GEOLOGY OF PALESTINE</a>), the Jordan valley in its lower portion occupies a remarkable depression in the earth\'s surface, reaching its greatest depth in the Dead Sea, the surface of which <span class="noTag">is</span> 1,300 ft., the bottom 2,600 ft. below tide level, the portion of the basin below the level of the sea being about 100 miles in length and from 10 to 15 miles in breadth at base, and from two to three times that distance between the bordering summits of the mountains and plateaus on either side. In the early prehistoric period, corresponding with the Glacial epoch, this depression was filled with water to a height of 1,400 ft. (see references above) which gradually disappeared by evaporation as present climatic conditions came on. At an elevation of approximately 650 ft. above the Dead Sea, very extensive sedimentary deposits were made, which, while appearing only in fragments along the shores of the Dead Sea, are continuous over the bottom of the valley (the so-called Ghor), farther north. These deposits are from 100 to 200 ft. thick, consisting of material which was brought down into the valley by the tributary mountain streams descending from each side, while the water stood at this higher level. Naturally these deposits slope gradually from the sides of the valley toward the center, the coarser material of the deposits being nearer the sides, and the amount of sediment being much increased opposite the mouths of the larger streams. The deposit was at first continuous over the entire Ghor, or valley, but has since been much dissected by the Jordan river and its tributaries. The Jordan itself has eroded a channel through the soft sediment, 100 ft. more or less deep, from Lake Galilee to the Dead Sea, a distance in a straight line of about 70 miles. At first this channel was narrow, but it has been constantly enlarged by the stream as it has meandered from side to side, undercutting the banks so that they cave into the river and are washed down to fill up the Dead Sea, a process which is especially familiar to residents upon the banks of the Mississippi and Missouri rivers. This narrow gorge is called the Zor, and will hereafter be referred to under this name. The Zor at present averages about 1/2 mile wide, the most of which is occupied by a flood plain extending from the banks of the river to the foot of the sedimentary bluffs on either side. This flood plain is so overgrown with brush and reeds that it is practically impenetrable, except by wild beasts, which, according to Scriptural references, have infested it from earliest times, among which may be mentioned the lion, the tiger, the wild boar. During the spring months, when the snows are melting from Mt. Hermon and cloudbursts are sending sudden torrents of water down the river courses from the plateau of Gilead and the mountains of Samaria, the Jordan "overflows all its banks," i.e. covers this flood plain and drives out the beasts to infest the neighborhood for a short time.<P>The surface of this old lake bed has also been much dissected by the tributary streams which come in from either side, they having cut channels across the Ghor down to a depth corresponding to that of the Zor. As a consequence the roads leading up the valley find it necessary to hug the base of the mountains on either side to avoid the abrupt descent into the channels of the tributary streams, which are deepest near their mouths. Another natural consequence of these physical peculiarities is that agriculture cannot be carried on except as water to irrigate the level surfaces of the Ghor is carried out from the higher levels of the perennial streams. There are many remains of such aqueducts for irrigation constructed in early times. These are now almost all in ruins and unused. Merrill, however, estimates that 200 square miles of the Jordan valley, over which the surface is as level as a prairie, and as free from stones, could be irrigated at the present time and made as fruitful as the valley of the Nile. But from time immemorial settled agriculture in the Ghor has been rendered precarious by the incursions of the nomadic tribes, who periodically come down from the desert regions on the east.<P>2. Descriptions:<P>Two descriptions (the first from my own journal) of the general views obtained of the Jordan valley from adjoining elevated points will give vividness to our conceptions of this remarkable depression.<P>"It was the middle of December when, after wading all day across the southern flanks of Mt. Hermon, through snow knee-deep for our horses, we descended below the clouds and the snow to the brink of the eastern mountain wall overlooking the upper valley of the Jordan. It was a sight ever to be remembered, with the glistering peak of Mt. Hermon to our right, and the jagged walls of the borders of Naphtali stretching across the horizon on the west, only a few miles away, while between and at our feet were the green fields of the upper Jordan valley, through which ran the silver thread of the river, broadening out into the expanded waters of Lake Merom. Over the plain could dimly be seen the black tents of the Arabs, and the husbandmen plowing the fields for an early harvest. No wonder the spies were impressed with the attractiveness and fertility of the region." This of the upper Jordan valley.<P>Dr. Merrill gives the following description of the view of the lower Jordan valley from the summit of Kurn Surtabeh, March 23: "Jebel esh Sheikh (Mt. Hermon) was covered with snow, and so was the Lebanon range farther to the west and north. Lake Merom and the volcanic peaks on the plain to the east of it and south of Hermon were distinctly seen, likewise the Sea of Galilee, the hills about Safed, the hills west of Tiberias and the slope from their summit, which inclines toward Mt. Tabor; also Gamala and Gadara, all the range of Jebel \'Ajlun or hills of Gilead, Kulat er Rubad, Jebel Meisera and Jebel Osha, the mountains of Moab, and the Dead Sea. But the mere naming of different points that can be seen gives no adequate idea of the extent and magnificence of the prospect which one enjoys from the top of this strange landmark. Hills to the west obstruct the view in that direction, and to the east nothing can be seen beyond the highest part of the Moab and Gilead ranges, but it is the north-and-south sweep which makes the prospect a glorious one. No language can picture correctly the Jordan valley, the winding stream, the jungles on its banks, the strange Ghor with its white, ragged sides, the vast plain of the valley, through and in the middle of which the lower Ghor (the Zor) is sunk, the dense green oases formed here and there by some mountain stream, and the still, lifeless sea, as bright and motionless as molten lead, lying far to the south, ending the great valley and touching the mountains on either side! This is an outline merely, but I cannot summon to my aid words which will describe it more accurately. The Jordan valley or Ghor, in front of Surtabeh, is about 8 miles wide, and looks like a vast plain. The lower Ghor (Zor) is the ragged channel cut down along the middle of the large one. This distinction of the upper and lower Ghor is by no means so strikingly defined above the mouth of the Zerka as it is below that point, and all the way thence to the Dead Sea."<P>3. Division into Eight Sections:<P>Considered in detail the valley may be divided, as Conder suggests, into 8 sections. "First the portion between Banias and the Huleh, where it is some 5 miles broad, with steep cliffs some 2,000 ft. high on either side and a broad marsh between. Secondly, from the Huleh to the Sea of Galilee, where the stream runs close to the eastern hills, and about 4 miles from the base of those on the west, which rise toward the high Safed mountains, more than 3,500 ft. above the lake. Thirdly, for 13 miles from the south end of the Sea of Galilee to the neighborhood of Beisan. Here the valley is only 1 1/2 miles broad west of the river, and about 3 on the east, the steep cliffs of the plateau of Kaukab el Hawa on the west reaching an altitude of 1,800 ft. above the stream.<P>"South of Beisan is the 4th district, with a plain west of Jordan, 12 miles long and 6 miles broad, the line of hills on the east being straight, and the foot of the mountains on this side about 2 miles from the river. In the neighborhood of Beisan, the cross-section of the plain shows 3 levels: that of the shelf on which Beisan stands, about 300 ft. below sea-level; that of the Ghor itself, some 400 ft. lower, reached by an almost precipitous descent; and that of the Zor, or narrow trench, from a half to a quarter of a mile wide, and about 150 ft. lower still. The higher shelf extends westward to the foot of Gilboa; it dies away on the south, but on the north it gradually rises into the plateau of Kaukab and to the western table-land above the sea of Galilee, 1,800 ft. above Jordan.<P>"After leaving the Beisan plain, the river passes through a narrow valley 12 miles long and 2 or 3 miles wide, with a raised table-land to the west, having a level averaging about 500 ft. above the sea. The Beisan plain is full of springs of fresh water, some of which are thermal, but a large current of salt warm water flows down Wady Maleh, at the northern extremity of this 5th district.<P>"In the 6th district, the Damieh region, the valley again opens to a width of about 3 miles on the west, and 5 on the east of J. The great block of the Kurn Surtubeh here stands out like a bastion, on the West, 2,400 ft. above the river. Passing this mountain, the 7th district is entered—a broad valley extending from near Fusail to \'Osh el Ghurab, north of Jericho. In this region the Ghor itself <span clas="noTag">is</span> 5 miles broad, west of the river, and rather more on the east. The lower trench or Zor is also wider here and more distinctly separated from the Ghor. A curious geographical feature of this region was also discovered by the Survey party. The great affluents of the Far\'ah and \'Aujeh do not flow straight to Jordan, but turn south about a mile west of it, and each runs, for about 6 miles, nearly parallel with the river; thus the mouth of the Far\'ah is actually to be found just where that of the next valley is shown on most maps.<P>"The 8th and last district is that of the plain of Jericho, which, with the corresponding basin (Ghor-es-Seiseban) east of Jordan, measures over 8 miles north and south, and more than 14 across, with Jordan about in the middle. The Zor is here about a mile wide, and some 200 ft. below the broad plain of the Ghor."<P>4. Climate Fauna and Flora:<P>Owing to its depression below sea-level the climate of the lower Jordan valley is even more than tropical. In the summer months thermometer scarcely falls below 100 degrees F., even in the night; but during the winter months, though the days are hot, thermometer frequently goes down to 40 degrees in the night time.<P>The fauna of this part of the Jordan valley and about the Dead Sea is said by Tristram (SWP, "Fauna and Flora") to be identical with that now existing in Ethiopia. Of the mammalia characteristic of this general region, 34 are Ethiopian and 16 Indian, though there is now no possible connection with either Ethiopia or India. The fish of the Jordan show close affinity to many species of the Nile and of the lakes and rivers of tropical Africa. Many species of birds, also, now confined to the lower basin and the Dead Sea, are related to Ethiopian and Indian species.<P>The flora is equally interesting. Out of 162 species of plants found at the southwest corner of the Dead Sea, 135 species are African in their affinity. In the marshes of Lake Huleh, many acres are covered with the papyrus plant, which became extinct in Egypt long ago, and is now found in Africa only in the Upper Nile beyond the 7th degree of North latitude. The most common trees and plants of the Jordan valley are the castor-oil plant and the oleander, flourishing especially about Jericho, several varieties of the acacia tree, the caper plant, the Dead Sea apple (Solanum Sodomaeum) the oser tree of the Arabs, tamarisks, Agnus casti (a flowering bamboo), Balanites Aegyptiaca (supposed to be the balm of Gilead), Populus Euphratica (a plant found all over Central Asia but not west of the Jordan), and many tropical plants, among which may be mentioned Zygophyllum coccineum, Boerhavia, Indigofera, several Astragali, Cassias, Gymnocarpum, and Nitraria.``198';

isbe[5140]='Josaphat`jos\'-a-fat (Iosaphat, the King James Version in <a onClick="return mV(\'Mat\',1,8);">Mt 1:8</a> for <a href="./study/isbe/search.html?string=JEHOSHAPHAT">JEHOSHAPHAT</a> (which see)): A king of Judah, mentioned in Matthew\'s genealogy of Christ.``1';

isbe[5142]='Jose`jo\'-se (Iose): the King James Version form for "Jesus" (Iesous) in Luke\'s genealogy (<a onClick="return mV(\'Luk\',3,29);">Lu 3:29</a>), the Revised Version (British and American) Greek.``1';

isbe[5144]='Josedech; Josedek`jos\'-e-dek, jos\'e-dek (Iosedek): Father of Jeshua (1Esdras 5:5). In <a onClick="return mV(\'Hag\',1,1);">Hag 1:1</a> the Revised Version (British and American), the relationship is described as "Joshua the son of <a href="./study/isbe/search.html?string=JEHOZADAK">JEHOZADAK</a> (which see), the high priest."``1';
isbe[5145]='Joseph (1)`jo\'-zef (yoceph; Ioseph):<P>1. In the Old Testament:<P class="in15">(1) The 11th son of Jacob and 1st of Rachel (see separate article [<A href="./study/isbe/search.html?string=JOSEPH+(2)">Joseph (2)</a>).<P class="in15">(2) The father of Igal of Issachar, one of the 12 spies (<a onClick="return mV(\'Num\',13,7);">Nu 13:7</a>).<P class="in15">(3) A son of Asaph (<a onClick="return mV(\'1Ch\',25,2,9);">1Ch 25:2,9</a>).<P class="in15">(4) A man of the sons of Bani, who had married a foreign wife (<a onClick="return mV(\'Ezr\',10,42);">Ezr 10:42</a>).<P class="in15">(5) A priest of the family of Shebaniah in the days of Joiakim (<a onClick="return mV(\'Neh\',12,14);">Ne 12:14</a>).<P>2. In the Apocrypha:<P class="in15">(1) Son of Zacharias, defeated by Gorgias circa 164 BC (1Macc 5:18,56,60).<P class="in15">(2) Called a brother of Judas Maccabeus in 2Macc 8:22, probably by mistake for John.<P class="in15">(3) Great-grandfather of Judith (Judith 8:1).<P>3. In the New Testament:<P class="in15">(1) The husband of Mary, the mother of Jesus (see special article [<A href="./study/isbe/search.html?string=JOSEPH,+HUSBAND+OF+MARY">Joseph, Husband of Mary</a>).<P class="in15">(2, 3) The name of 3 ancestors of Jesus according to the King James Version (<a onClick="return mV(\'Luk\',3,24,26,30);">Lu 3:24,26,30</a>); the name of two according to the Revised Version (British and American), which reads "Josech" in <a onClick="return mV(\'Luk\',3,26);">Lu 3:26</a>.<P class="in15">(4) A Jew of Arimathea in whose sepulcher Jesus was buried (<a onClick="return mV(\'Mat\',27,57);">Mt 27:57</a>, etc.; see article [<A href="./study/isbe/search.html?string=JOSEPH+OF+ARIMATHAEA">Joseph of Arimathaea</A>).<P class="in15">(5) One of the brethren of Jesus, according to the Revised Version (British and American) (<a onClick="return mV(\'Mat\',13,55);">Mt 13:55</a>, the King James Version "Joses"). the King James Version and the Revised Version (British and American) both have "Joses" in <a onClick="return mV(\'Mat\',27,56);">Mt 27:56</a>; <a onClick="return mV(\'Mar\',6,3);">Mr 6:3</a>; <a onClick="return mV(\'Mar\',15,40,47);">15:40,47</a>.<P class="in15">(6) Joseph Barsabbas (<a onClick="return mV(\'Act\',1,23);">Ac 1:23</a>; see article [<A href="./study/isbe/search.html?string=JOSEPH+BARSABBAS">Joseph Barsabbas</a>).<P class="in15">(7) Joseph, surnamed Barnabas (<a onClick="return mV(\'Act\',4,36);">Ac 4:36</a>, the King James Version "Joses"; see <a href="./study/isbe/search.html?string=BARNABAS">BARNABAS</a>].``78';
