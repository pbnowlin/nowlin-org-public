lled in 670. Two years later, however, occurred the revolt of Egypt and the death of Esar-haddon. Assur-bani-pal succeeded, and Egypt regained her independence in 660. The revolt of Babylonia, the incursion of the Scythians (<a onClick="return mV(\'Jer\',1,14);">Jer 1:14</a>) and the death of Assur-bani-pal followed. Two more kings sat on the throne of Assyria, and then Nineveh was taken by the combined Scythians (Mandor) and Babylonians (Herod. i.74; Nah; <a onClick="return mV(\'Zep\',2,\'13-15\');">Ze 2:13-15</a>; <a onClick="return mV(\'Hab\',1,5);">Hab 1:5</a>f).<P>9. After Scythian Invasion:<P>The Scythian tempest passed quickly, and when it was over the Assyrian peril was no more. Pharaoh-necoh seized the opportunity to avenge the injuries of his country by the invasion of the erstwhile Assyrian territories. Josiah, pursuing the policy of alliance with Babylonia inaugurated by Hezekiah, endeavored to arrest his progress. He was defeated and mortally wounded at Megiddo (<a onClick="return mV(\'Zec\',12,11);">Zec 12:11</a>).<P>10. Judah Again Dependent:<P>By the foolhardy action of Josiah, Judah lost its independence. The people, indeed, elected Jehoahaz (Shallum) king, but he was immediately deposed and carried to Egypt by the Pharaoh (<a onClick="return mV(\'Jer\',22,10);">Jer 22:10</a>ff; <a onClick="return mV(\'Eze\',19,3);">Eze 19:3</a>f), who appointed Jehoiakim (Eliakim) as vassal-king. After the defeat of the Pharaoh at Carchemish, the old Hittite stronghold, by Nebuchadrezzar, Jehoiakim submitted, and Judah became a dependency of Babylon. There must have been some return of prosperity, for Jehoiakim is denounced for his luxury and extravagance and oppressive taxation (<a onClick="return mV(\'Jer\',22,13);">Jer 22:13</a>), but the country was raided by the neighboring Bedouin (<a onClick="return mV(\'2Ki\',24,2);">2Ki 24:2</a>), and Jehoiakim came to an untimely end (<a onClick="return mV(\'Jer\',22,19);">Jer 22:19</a>).<P>11. Prophets Lose Influence:<P>The prophets were no longer, as under Hezekiah, all-powerful in the state. The influence of Jeremiah was no doubt great, but the majority was against him. His program was both unpopular in itself and it had the fatal defect of being diametrically opposed to that of Isaiah, the patriot-politician (if such there be), who had saved the state from shipwreck. Isaiah had preached reliance upon the national God and through it the political independence of the nation. It was the sad duty of Jeremiah to advise the surrender of the national independence to the newly risen power of Babylon. (<a onClick="return mV(\'Jer\',21,4,9);">Jer 21:4,9</a>; <a onClick="return mV(\'Jer\',38,2);">38:2</a>, etc.). Isaiah had held that the Holy City was impregnable (<a onClick="return mV(\'2Ki\',19,32);">2Ki 19:32</a>); Jeremiah was sure that it would be taken by the Chaldeans (<a onClick="return mV(\'Jer\',32,24,43);">Jer 32:24,43</a>). Events proved that each prophet was right for the time in which he lived.<P>12. The Deportations:<P>Jehoiakim was the only Judean king who was a vassal first to one overlord and then to another. Judah took a step downward in his reign. It was under him also that the first deportation of the Judeans occurred (<a onClick="return mV(\'Dan\',1,\'1-17\');">Da 1:1-17</a>). He was succeeded by his son Jehoiachin who, on account of a rebellion which closed the reign of his father, was ere long deported, along with the best of the nation (<a onClick="return mV(\'Jer\',22,24);">Jer 22:24</a>ff; <a onClick="return mV(\'Eze\',19,5);">Eze 19:5</a>). A 3rd son of Josiah, Mattaniah, was set on the throne under the title of Zedekiah. Against the advice of Jeremiah, this, the last king of Judah, declared himself independent of Babylon, and threw in his lot with Egypt under Pharaoh Hophra (Apries), thus breaking his oath of fealty (<a onClick="return mV(\'Eze\',17,15);">Eze 17:15</a>). On the advance of the Chaldeans, Judah was deserted by her allies, the Edomites and Philistines (see <a href="./study/isbe/search.html?string=JOB,+ BOOK+OF">JOB, BOOK OF</a>), and soon only Lachish (Tell el-Hesy), Azekah (probably Tell Zakarua) and Jerusalem remained in the hands of Zedekiah. The siege of the city lasted two years. It was taken on the fatal 9th of Ab in the year 586. Zedekiah\'s family was put to the sword, and he himself was taken to Babylon. Egypt shared the fate of Judah, with whom she had been often so closely connected, and Hophra was the last of the Pharaohs.<P>13. Summary:<P>The kingdom of Judah had lasted 480 years, counting from its commencement, exactly twice as long as the kingdom of Israel, counting from the disruption. No doubt this longer mary existence was due in the first place to the religious faith of the people. This is clear from the fact that the national religion not only survived the extinction of the nation, but spread far beyond its original territories and has endured down to the present day. But there were also circumstances which conspired to foster the growth of the nation in its earliest and most critical period. One of these was the comparative isolation and remoteness of the country. Neither the kingdom of Israel nor that of Judah is for a moment to be compared to those of Egypt and Assyria. Even the combined kingdom under David and Solomon hardly deserves that comparison; and separate, the Northern Kingdom would be about the size of New Hampshire and the Southern Kingdom about that of Connecticut. The smaller kingdom survived the larger because it happened to be slightly farther removed from the danger zone. Even had the two kingdoms held together, it is impossible that they could have withstood the expansion of Assyria and Babylonia on the one side and of Egypt on the other. The Egyptian party in Judean politics in the times of Isaiah and Jeremiah were so far in the right, that, if Judah could have maintained her independence in alliance with Egypt, these two countries combined might have withstood the power of Assyria or Babylon. But it is because this ancient race, tracing its descent from remote antiquity, preserved its religious, at the expense of its national independence, that its literature continues to mold much of the thought of Europe and America today.`<a href="./study/isbe/search.html?string=ISRAEL,+KINGDOM+OF">ISRAEL, KINGDOM OF</a>`189';
isbe[5194]='Judah, Territory of`(yehudhah):<P><b>I. GEOGRAPHICAL DATA</b><P class="in15">1. The Natural Boundaries<P class="in15">2. The Natural Divisions of Judah<P class="in30">(1) The Maritime Plain<P class="in30">(2) The Shephelah<P class="in30">(3) The Hill Country of Judah<P><b>II. THE TRIBE OF JUDAH AND ITS TERRITORY</b><P><b>III. THE BOUNDARIES OF THE KINGDOM OF JUDAH</b><P><b>LITERATURE</b><hr /><P>I. Geographical Data.<P>Although the physical conformation of Western Palestine divides this land into very definite areas running longitudinally north and south, yet all through history there has been a recognition of a further—and politically more important—division into 3 areas running transversely, known in New Testament times as Galilee, Samaria and Judea. These districts are differentiated to some extent by distinctive physical features which have in no small degree influenced the history of their inhabitants.<P>1. The Natural Boundaries:<P>The southernmost of these regions possesses on 3 sides very definite natural boundaries: to the west the Mediterranean, to the east the Dead Sea, and the Jordan, and to the south 60 miles, north to south, of practically trackless desert, a frontier as secure as sea or mountain range. On the north no such marked "scientific frontier" exists, and on this the one really accessible side, history bears witness that the frontier has been pushed backward and forward. The most ideal natural northern frontier, which only became the actual one comparatively late in Hebrew times (see <a href="./study/isbe/search.html?string=JUDAEA">JUDAEA</a>), is that which passes from the river \'Aujeh in the west, up the Wady Deir Baldt, by the wide and deep Wady Ishar to \'Akrabbeh and thence east to the Jordan. A second natural frontier commences at the same line on the west, but after following the Wady Deir Baldt, branches off southward along the Wady Nimr (now traversed by the modern carriage road from Jerusalem to Nablus), crosses the water-parting close to the lofty Tell Ashur and runs successively down the Wady Sanieh and the Wady \'Aujeh and by the eastern river \'Aujeh to the Jordan. This division-line is one conformable to the physical features, because north of it the table-lands of "Judea" give place to the more broken mountain groups of "Samaria." Another less natural, though much more historic, frontier is that which traverses the Vale of Ajalon, follows the Beth-horon pass, and, after crossing the central plateau near el Jib (Gibeon) and er Ram (Ramah of Benjamin), runs down the deep and rugged Wady SuweiniT, between Jeba\' (Geba) and Mukhmas (Michmash), to Jericho and the Jordan. It was along this line that the great frontier fortresses, Bethel, Gibeon, Ramah, Adasa, Geba and Michmash, were erected. Such, on the north, south, east, and west, were the natural boundaries of the southern third of Palestine; yet in all history the land thus enclosed scarcely ever formed a homogeneous whole.<P>2. The Natural Divisions of Judah:<P>Within these boundaries lay four very different types of land—the maritime plain, the "lowland" or Shephelah, the "hill country" and, included usually with the last, the desert or Jeshimon.<P>(1) The Maritime Plain:<P>The maritime plain, the "land Judah of the Philis" (<a onClick="return mV(\'1Sa\',6,1);">1Sa 6:1</a>; <a onClick="return mV(\'1Sa\',27,1);">27:1</a>; <a onClick="return mV(\'2Ki\',8,2);">2Ki 8:2</a>; <a onClick="return mV(\'Zep\',2,5);">Ze 2:5</a>), was ideally though never actually, the territory of Judah (compare <a onClick="return mV(\'Jos\',15,\'45-47\');">Jos 15:45-47</a>); it may have been included, as it is by some modern writers, as part of the Shephelah, but this is not the usual use of the word. It is a great stretch of level plain or rolling downs of very fertile soil, capable of supporting a thriving population and cities of considerable size, especially near the seacoast.<P>(2) The Shephelah:<P>The Shephelah (shephelah), or "lowland" of Judah (<a onClick="return mV(\'Deu\',1,7);">De 1:7</a>; <a onClick="return mV(\'Jos\',9,1);">Jos 9:1</a>; <a onClick="return mV(\'Jos\',11,2,16);">11:2,16</a>; <a onClick="return mV(\'Jos\',15,\'33-44\');">15:33-44</a>; <a onClick="return mV(\'1Ki\',10,27);">1Ki 10:27</a>; <a onClick="return mV(\'1Ch\',27,28);">1Ch 27:28</a>; <a onClick="return mV(\'Jer\',17,26);">Jer 17:26</a>).—In these references the word is variously rendered in the King James Version, usually as "vale" or "valley," sometimes, as in the last two, as "plain." In the Revised Version (British and American) the usual rendering is "lowland." In 1Macc 12:38, the King James Version has "Shephela" and the Revised Version (British and American) "plain country." The word "Shephelah" appears to survive in the Arabic Sifla about Beit Jebrin.<P>This is a very important region in the history of Judah. It is a district consisting mainly of rounded hills, 500-800 ft. high, with fertile open valleys full of corn fields; caves abound, and there are abundant evidences of a once crowded population. Situated as it is between the "hill country" and the maritime plain, it was the scene of frequent skirmishes between the Hebrews and the Philistines; Judah failed to hold it against the Philistines who kept it during most of their history. The Shephelah is somewhat sharply divided off from the central mountain mass by a remarkable series of valleys running north and south. Commencing at the Vale of Ajalon and passing south, we have in succession the Wady el Ghurab and, after crossing the Wady es Siwan, the Wady en Najil, the Wady es Sunt (Elah) and the Wady es Cur. It is noticeable that the western extremity of the most historic northern frontier of ancient Judah—that limited by the Vale of Ajalon in the west—appears to have been determined by the presence of this natural feature. North of this the hills of Samaria flatten out to the plain without any such intervening valleys.<P>(3) The Hill Country of Judah:<P>The hill country of Judah is by far the most characteristic part of that tribe\'s possessions; it was on account of the shelter of these mountain fastnesses that this people managed to hold their own against their neighbors and hide away from the conquering armies of Assyria and Egypt. No other section of the country was so secluded and protected by her natural borders. It was the environment of these bare hills and rugged valleys which did much to form the character and influence the literature of the Jews. The hill country is an area well defined, about 35 miles long and some 15 broad, and is protected on three sides by natural frontiers of great strength; on the north alone it has no "scientific frontier." On the south lay the Negeb, and beyond that the almost waterless wilderness, a barrier consisting of a series of stony hills running east and west, difficult for a caravan and almost impracticable for an army. On the west the hills rise sharply from those valleys which delimit them from the Shephelah, but they are pierced by a series of steep and rugged defiles which wind upward to the central table-land. At the northwestern corner the Bethhoron pass—part of the northern frontier line—runs upward from the wide Vale of Ajalon; this route, the most historic of all, has been associated with a succession of defeats inflicted by those holding the higher ground (see <a href="./study/isbe/search.html?string=BETH-HORON">BETH-HORON</a>). South of this is the Wady \'Ali, up which runs the modern carriage road to Jerusalem, and still farther south lies the winding rocky defile, up part of which the railway from Jaffa is laid, the Wady es Surar. A more important valley, because of its width and easier gradient, is the great Vale of Elah (Wady es Cunt), to guard the highest parts of which (now the Wady es Cur) was built the powerful fortress of Beth-zur (<a onClick="return mV(\'2Ch\',11,7);">2Ch 11:7</a>, etc.), which Josephus (Ant., XIII, v, 6) describes as "the strongest place in all Judea (see <a href="./study/isbe/search.html?string=BETH-ZUR">BETH-ZUR</a>). Up this pass the Syrians successfully with the aid of elephants (Ant., XII, ix, 4) invaded Judea. The eastern frontier of the hill country is one of extraordinary natural strength. Firstly, there were the Jordan and the Dead Sea; then along all but the northernmost part of the eastern frontier lay a long line of semi-precipitous cliffs, in places over 1,000 ft. high, absolutely unscalable and pierced at long intervals by passes all steep and dangerous. Within this again came a wide area of waterless and barren desert, the Wilderness of Judah (or Judea) known in English Versions of the Bible as <a href="./study/isbe/search.html?string=JESHIMON">JESHIMON</a> (which see). To the northeasterly part of the frontier, where the ascent from the Jericho plain to the mountains presents no special difficulty in gradation, the waterless condition of the Jeshimon greatly restricted the possible routes for an enemy. The natural position for the first line of defense was the fortified city of Jericho, but as a frontier fortress she failed from the days of Joshua onward (see <a href="./study/isbe/search.html?string=JERICHO">JERICHO</a>). From Jericho four roads pass upward to the plateau of Judah; unlike the corresponding passes on the western frontier, they do not traverse any definite line of valley, but in many places run actually along the ridges.<P>These roads are:<P>(a) The earliest historically, though now the least frequented, is the most northerly, which passes westward at the back of ancient Jericho (near \'Ain es Sultan) and ascends by Michmash and Ai to Bethel;<P>(b) the route traversed by the modern Jerus-Jericho road;<P>(c) the more natural route which enters the hills by Wady Joreif Ghusal and runs by Nebi Musa joining the line of the modern carriage road a mile or so after passing the deserted ruin of the Saracenic Khan el Ahmar. Here runs the road for the thousands of pilgrims who visit the shrine of Nebi Musa in the spring.<P>(d) The most natural pass of all is by way of Wady el Kuneiterah, across the open plateau of el Bukeia\' and over the shoulder of Jebel el Muntar to Bethlehem.<P>From \'Ain Feshkhah a very steep road, probably ancient, ascends to join this last route in el Bukeia\', From Engedi (\'Ain Jidy) a steep ascent—almost a stairway—winds abruptly to the plateau above, whence a road passes northwesterly by the Wady Hucaceh past Tekoa to Bethlehem and Jerusalem, and another branch goes west to Hebron and Juttah.<P>Somewhere along these routes must have lain the "Ascent of Ziz" and the "Wilderness of Jeruel," the scene of the events of <a onClick="return mV(\'2Ch\',20,\'1-\');">2Ch 20</a>. The hill country of Judah is distinguished from other parts of Palestine by certain physical characteristics. Its central part is a long plateau—or really series of plateaus-running north and south, very stony and barren and supplied with but scanty springs: "dew" is less plentiful than in the north; several of the elevated plains, e.g. about Bethlehem, Beit Jala and Hebron, are well suited to the growth of corn and olive trees; in the sheltered valleys and on the terraced hillsides to the west of the water-parting, vines, olives, figs and other fruit trees flourish exceedingly. There is evidence everywhere that cultivation was far more highly developed in ancient times; on most of the hill slopes to the west traces of ancient terraces can still be seen (see <a href="./study/isbe/search.html?string=BOTANY">BOTANY</a>). This district in many parts, especially on its eastern slopes, is preeminently a pastoral land, and flocks of sheep and goats abound, invading in the spring even the desert itself. This last is ever in evidence, visible from the environs of all Judah\'s greater cities and doubtless profoundly influencing the lives and thoughts of their inhabitants.<P>The altitude attained in this "hill country" is usually below 3,000 ft. in the north (e.g. Ramallah, 2,850 ft., Nebi Samwil, 2,935 ft.), but is higher near Hebron, where we get 3,545 ft. at Ramet el Khulil. Many would limit the term "hill country of Judea" to the higher hills centering around Hebron, but this is unnecessary. Jerusalem is situated near a lower and more expanded part of the plateau, while the higher hills to its north, are, like that city itself, in the territory of Benjamin.<P>II. The Tribe of Judah and Its Territory.<P>In <a onClick="return mV(\'Num\',26,\'19-22\');">Nu 26:19-22</a>, when the tribes of the Hebrews are enumerated "in the plains of Moab by the Jordan at Jericho" (<a onClick="return mV(\'Num\',26,3);">Nu 26:3</a>), Judah is described as made up of the families of the Shelanites, the Perezites, the Zerahites, the Hezronites and the Hamulites. "These are the families of Judah according to those that were numbered of them," a total of 76,500 (<a onClick="return mV(\'Num\',26,22);">Nu 26:22</a>). In <a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a> we read that the Kenites united with the tribe of Judah, and from other references (<a onClick="return mV(\'Jos\',14,\'6-15\');">Jos 14:6-15</a>; <a onClick="return mV(\'Jos\',15,\'13-19\');">15:13-19</a>; <a onClick="return mV(\'Jdg\',1,\'12-15\',20);">Jud 1:12-15,20</a>) we learn that the two Kenizzite clans of Caleb and Othniel also were absorbed; and it is clear from <a onClick="return mV(\'1Sa\',27,10);">1Sa 27:10</a>; <a onClick="return mV(\'1Sa\',30,29);">30:29</a> that the Jerahmeelites—closely connected with the Calebites (compare <a onClick="return mV(\'1Ch\',2,42);">1Ch 2:42</a>)—also formed a part of the tribe of Judah. The Kenizzites and Jerahmeelites were probably of Edomite origin (<a onClick="return mV(\'Gen\',36,11);">Ge 36:11</a>; compare <a onClick="return mV(\'1Ch\',2,42);">1Ch 2:42</a>), and this large admixture of foreign blood may partly account for the comparative isolation of Judah from the other tribes (e.g. she is not mentioned in <a onClick="return mV(\'Jdg\',5,\'1-\');">Jud 5</a>).<P>The territory of the tribe of Judas is described ideally in <a onClick="return mV(\'Jos\',15,\'1-\');">Jos 15</a>, but it never really extended over the maritime plain to the west. The natural frontiers to the west and east have already been described as the frontiers of the "hill country"; to the south the boundary is described as going "even to the wilderness of Zin southward, at the uttermost part of the south," i.e. of the Negeb (<a onClick="return mV(\'Jos\',15,1);">15:1</A>), and (<a onClick="return mV(\'Jos\',15,3);">15:3</A>) as far south as Kadesh-barnea, i.e. the oasis of \'Ain Kadis, 50 miles south of Beersheba, far in the desert; the position of the "Ascent of Akrabbim," i.e. of scorpions, is not known. The "Brook of Egypt" is generally accepted to be the Wady el \'Arish. The fact is, the actual frontier shaded off imperceptibly into the desert—varying perhaps with the possibilities of agriculture and depending therefore upon the rainfall. The cities mentioned on the boundaries, whose sites are now lost, probably roughly marked the edge of the habitable area (see <a href="./study/isbe/search.html?string=NEGEB">NEGEB</A>).<P>The northern boundary which separated the land of Judah from that of Benjamin requires brief mention. The various localities mentioned in <a onClick="return mV(\'Jos\',15,\'5-12\');">Jos 15:5-12</a> are dealt with in separate articles, but, omitting the very doubtful, the following, which are generally accepted, will show the general direction of the boundary line: The border went from the mouth of the Jordan to Beth-hoglah (\'Ain Hajlah), and from the Valley of Achor (Wady Kelt) by the ascent of Adummin (Tala \'at edition Dumm) to the waters of Enoch Shemesh (probably \'Ain Haud), Enoch Rogel (Bir Eyyub), and the Valley of Hinnom (Wady er Rababi). The line then crossed the Vale of Rephaim (el Bukeia\') to the waters of Nephtoah (Lifta), Kiriath-jearim (Kuryet el \'Enab), Chesalon (Kesla), Beth-shemesh (\'Ain Shems), Ekron (\'Akir), and Jabneel (Yebnah), "and the goings out of the border were at the sea." According to the above line, Jerusalem lay entirely within the bounds of Benjamin, though, according to a tradition recorded in the Talmud, the site of the altar was in a piece of land belonging to Judah. The above frontier line can be followed on any modern map of Palestine, and if it does not in many parts describe a natural frontier, it must be remembered that the frontiers of village and town possessions in modern Palestine are extremely arbitrary, and though undetermined by any natural limits such as streams or mountain summits, they persist from generation to generation, and this too during periods—not long past—when there was constant warfare between different clans.<P>The territory of Judah was small; even had it included all within its ideal boundaries, it would have been no more than 2,000 square miles; actually it was nearer 1,300 square miles, of which nearly half was desert.<P>III. The Boundaries of the Kingdom of Judah.<P>These were very circumscribed. In <a onClick="return mV(\'2Ch\',11,\'5-12\');">2Ch 11:5-12</a> there is a list of the cities—chiefly those on the frontier—which Rehoboam fortified. On the east were Bethlehem, Etam and Tekoa; and on the west and southwest were Beth-zur, Soco, Adullam, Gath, Mareshah, Ziph, Adoraim, Lachish, Azekah, Zorah, Aijalon and Hebron. The sites of the great majority of these are known, and they are all upon the borders of the Shephelah or the hill country. It will be seen too that the military preparation then made was against an attack from the west. In the 5th year of the reign of Rehoboam the expected attack came, and Shishak (Sheshenq I) of Egypt swept over the land and not only conquered all Judah and Jerusalem, but, according to the reading of some authorities in the account of this campaign given in the great temple of Karnak, he handed over to Jeroboam of Israel certain strongholds of Judah.<P>The usual northern frontier between the two Hebrew kingdoms appears to have been the southernmost of the three natural lines described in I above, namely by the Valley of Ajalon on the west and the Gorge of Michmash (Wady SuweiniT) on the east. Along the central plateau the frontier varied. Bethel (<a onClick="return mV(\'1Ki\',12,29);">1Ki 12:29</a>; <a onClick="return mV(\'2Ki\',10,29);">2Ki 10:29</a>; <a onClick="return mV(\'Amo\',3,14);">Am 3:14</a>; <a onClick="return mV(\'Amo\',4,4);">4:4</a>; <a onClick="return mV(\'Amo\',7,10,13);">7:10,13</a>; <a onClick="return mV(\'Hsa\',10,15);">Ho 10:15</a>) belonged to Israel, though once it fell to Judah when Abijah took it and with it Jeshanah (\'Ain Sinia) and Ephron (probably et Taiyibeh) (<a onClick="return mV(\'2Ch\',13,19);">2Ch 13:19</a>). Geba (Jeba\'), just to the south of the Wady Suweinit, was on the northern frontier of Judah, hence, instead of the old term "from Dan to Beer-sheba" we read now of "from Geba to Beersheba" (<a onClick="return mV(\'2Ki\',23,8);">2Ki 23:8</a>). Baasha, king of Israel, went south and fortified Ramah (er Ram, but 4 miles from Jerusalem) against Judah (<a onClick="return mV(\'1Ki\',15,17);">1Ki 15:17</a>), but Asa stopped his work, removed the fortifications and with the materials strengthened his own frontier at Geba and Mizpah (<a onClick="return mV(\'1Ki\',15,21,22);">1Ki 15:21,22</a>). In the Jordan valley Jericho was held by Israel (<a onClick="return mV(\'1Ki\',16,34);">1Ki 16:34</a>; <a onClick="return mV(\'2Ki\',2,4);">2Ki 2:4</a>).<P>After the Northern Kingdom fell, the frontier of Judah appears to have extended a little farther north, and Bethel (<a onClick="return mV(\'2Ki\',23,\'15-19\');">2Ki 23:15-19</a>) and Jericho (to judge from <a onClick="return mV(\'Ezr\',2,34);">Ezr 2:34</a>; <a onClick="return mV(\'Neh\',3,2);">Ne 3:2</a>; <a onClick="return mV(\'Neh\',7,36);">7:36</a>) also became part of the kingdom of Judah. For the further history of this district see <a href="./study/isbe/search.html?string=JUDAEA">JUDAEA</A>.<P>LITERATURE.<P>See especially H G H L, chapters viii-xv; P E F, III, and Saunders, Introduction to the Survey of Western Palestine.``117';
isbe[5195]='Judaism`joo\'-da-iz\'-m.`<a href="./study/isbe/search.html?string=ISRAEL,+RELIGION+OF">ISRAEL, RELIGION OF</a>`1';
isbe[5196]='Judas`joo\'-das (Ioudas; Greek form of Hebrew "Judah"):<P>(1) A Levite mentioned in 1Esdras 9:23 = <a href="./study/isbe/search.html?string=JUDAH">JUDAH (3)</a>.<P>(2) Judas Maccabeus, 3rd son of Mattathias (1Macc 2:4).<P>See <a href="./study/isbe/search.html?string=MACCABEES">MACCABEES</a>.<P>(3) Judas, son of Chalphi, a Jewish officer who supported Jonathan bravely at the battle of Hazor (1Macc 11:70; Ant, XIII, v, 7).<P>(4) A person of good position in Jerusalem at the time of the mission to Aristobulus (2Macc 1:10); he has been identified with Judas Maccabeus and also with an Essene prophet (Ant., XIII, xi, 2; BJ, III, 5).<P>(5) Son of Simon the Maccabee, and brother of John Hyrcanus (1Macc 16:2). He was wounded in the battle which he fought along with his brother against Cendebeus (1Macc 16:1ff; Ant, XIII, vii, 3), and was murdered by Ptolemy the usurper, his brother-in-law, at Dok (1Macc 16:11ff).``79';
isbe[5197]='Judas Barsabbas`bar-sab-\'as (Ioudas Barsabbas): Judas was, with Silas, a delegate from the church in Jerusalem to the GentileChristians of Antioch, Syria and Cilicia. They were appointed to convey the letter containing the decision of "the apostles and the elders, with the whole church" regarding the attitude to be taken by GentileChristians toward the Mosaic law, and also to explain "the same things by word of mouth." They accompanied Paul and Barnabas to Antioch, and, "being themselves also prophets," i.e. preachers, they not only handed over the epistle but stayed some time in the city preaching and teaching. They seem to have gone no farther than Antioch, for "they were dismissed in peace from the brethren unto those that had sent them forth," and it was Paul and Silas who some time afterward strengthened the churches in Syria and Cilicia (<a onClick="return mV(\'Act\',15,40,41);">Ac 15:40,41</a>).<P>According to <a onClick="return mV(\'Act\',15,34);">Ac 15:34</a> the King James Version, Judas returned to Jerusalem without Silas, who remained at Antioch and afterward became Paul\'s companion (<a onClick="return mV(\'Act\',15,40);">Ac 15:40</a>). The oldest manuscripts, however, omit <a onClick="return mV(\'Act\',15,34);">Ac 15:34</a>, and it is therefore omitted from the Revised Version (British and American). It was probably a marginal note to explain <a onClick="return mV(\'Act\',15,40);">Ac 15:40</a>, and in time it crept into the text. Judas and Silas are called "chief men among the brethren" (<a onClick="return mV(\'Act\',15,22);">15:22</a>), probably elders, and "prophets" (<a onClick="return mV(\'Act\',15,32);">15:32</A>).<P>Barsabbas being a patronymic, Judas was probably the brother of Joseph Barsabbas. He cannot be identified with any other Judas, e.g. "Judas not Iscariot" (<a onClick="return mV(\'Jhn\',14,22);">Joh 14:22</a>). We hear no more of Judas after his return to Jerusalem (<a onClick="return mV(\'Act\',15,22);">Ac 15:22</a>).``78';
isbe[5198]='Judas Iscariot`is-kar\'-i-ot (Ioudas Iskariotes, i.e. \'ish qeriyoth, "Judas, man of Kerioth"): One of the twelve apostles and the betrayer of Jesus; for etymology, etc., see <a href="./study/isbe/search.html?string=JUDAS">JUDAS</A>.<P>I. Life.<P>Judas was, as his second name indicates, a native of Kerioth or Karioth. The exact locality of Kerioth (compare <a onClick="return mV(\'Jos\',15,25);">Jos 15:25</a>) is doubtful, but it lay probably to the south of Judea, being identified with the ruins of el Karjetein (compare A. Plummer, article "Judas Iscariot" in HDB).<P>1. Name and Early History:<P>He was the son of Simon (<a onClick="return mV(\'Jhn\',13,2);">Joh 13:2</a>) or Simon Iscariot (<a onClick="return mV(\'Jhn\',6,71);">Joh 6:71</a>; <a onClick="return mV(\'Jhn\',13,26);">13:26</a>), the meaning of Iscariot explaining why it was applied to his father also. The first Scriptural reference to Judas is his election to the apostleship (compare <a onClick="return mV(\'Mat\',10,4);">Mt 10:4</a>; <a onClick="return mV(\'Mar\',3,19);">Mr 3:19</a>; <a onClick="return mV(\'Luk\',6,16);">Lu 6:16</a>). He may have been present at the preaching of John the Baptist at Bethany beyond Jordan (compare <a onClick="return mV(\'Jhn\',1,28);">Joh 1:28</a>), but more probably he first met Jesus during the return of the latter through Judea with His followers (compare <a onClick="return mV(\'Jhn\',3,22);">Joh 3:22</a>). According to the Gospel of the Twelve Apostles (see <a href="./study/isbe/search.html?string=SIMON+THE+ CANAANITE">SIMON THE CANAANITE</A>), Judas was among those who received the call at the Sea of Tiberias (compare <a onClick="return mV(\'Mat\',4,\'18-22\');">Mt 4:18-22</a>).<P>2. Before the Betrayal:<P>For any definite allusion to Judas during the interval lying between his call and the events immediately preceding the betrayal, we are indebted to John alone. These allusions are made with the manifest purpose of showing forth the nefarious character of Judas from the beginning; and in their sequence there is a gradual development and growing clearness in the manner in which Jesus makes prophecy regarding his future betrayer. Thus, after the discourse on the Bread of Life in the synagogue of Capernaum (<a onClick="return mV(\'Jhn\',6,\'26-59\');">Joh 6:26-59</a>), when many of the disciples deserted Jesus (<a onClick="return mV(\'Jhn\',6,66);">Joh 6:66</a>) and Peter protested the allegiance of the apostles (<a onClick="return mV(\'Jhn\',6,69);">Joh 6:69</a>), Jesus answered, "Did not I choose you the twelve, and one of you is a devil" (<a onClick="return mV(\'Jhn\',6,70);">Joh 6:70</a>). Then follows John\'s commentary, "Now he spake of Judas the son of Simon Iscariot, for he it was that should betray him, being one of the twelve" (<a onClick="return mV(\'Jhn\',6,71);">Joh 6:71</a>), implying that Judas was already known to Jesus as being in spirit one of those who "went back, arid walked no more with him" (<a onClick="return mV(\'Jhn\',6,66);">Joh 6:66</a>). But the situation, however disquieting it must have been to the ambitious designs which probably actuated Judas in his acceptance of the apostleship (compare below), was not sufficiently critical to call for immediate desertion on his part. Instead, he lulled his fears of exposure by the fact that he was not mentioned by name, and continued ostensibly one of the faithful. Personal motives of a sordid nature had also influence in causing him to remain. Appointed keeper of the purse, he disregarded the warnings of Jesus concerning greed and hypocrisy (compare <a onClick="return mV(\'Mat\',6,20);">Mt 6:20</a>; <a onClick="return mV(\'Luk\',12,\'1-3\');">Lu 12:1-3</a>) and appropriated the funds to his own use. As a cloak to his avarice, he pretended to be zealous in their administration, and therefore, at the anointing of Jesus\' feet by Mary, he asked "Why was not this ointment sold for 300 shillings, and given to the poor? Now this he said, not because he cared for the poor; but because he was a thief, and having the bag took away what was put therein" (<a onClick="return mV(\'Jhn\',12,5,6);">Joh 12:5,6</a>; compare also <a onClick="return mV(\'Mat\',26,\'7-13\');">Mt 26:7-13</a>; <a onClick="return mV(\'Mar\',14,\'3-8\');">Mr 14:3-8</a>).<P>3. The Betrayal:<P>Yet, although by this craftiness Judas concealed for a time his true nature from the rest of the disciples, and fomented any discontent that might arise among them (compare <a onClick="return mV(\'Mar\',14,4);">Mr 14:4</a>), he now felt that his present source of income could not long remain secure. The pregnant words of his Master regarding the day of his burial (compare <a onClick="return mV(\'Mat\',26,12);">Mt 26:12</a>; <a onClick="return mV(\'Mar\',14,8);">Mr 14:8</a>; <a onClick="return mV(\'Jhn\',12,7);">Joh 12:7</a>) revealed to His betrayer that Jesus already knew well the evil powers that were at work against Him; and it is significant that, according to Matthew and Mark, who alone of the synoptists mention the anointing, Judas departed immediately afterward and made his compact with the chief priests (compare <a onClick="return mV(\'Mat\',26,14,15);">Mt 26:14,15</a>; <a onClick="return mV(\'Mar\',14,10,11);">Mr 14:10,11</a>; compare also <a onClick="return mV(\'Luk\',22,\'3-6\');">Lu 22:3-6</a>). But his absence was only temporary. He was present at the washing of the disciples\' feet, there to be differentiated once more by Jesus from the rest of the Twelve (compare "Ye are clean, but not all" and "He that eateth my bread lifted up his heel against me," <a onClick="return mV(\'Jhn\',13,10,18);">Joh 13:10,18</a>), but again without being named. It seemed as if Jesus wished to give Judas every opportunity, even at this late hour, of repenting and making his confession. For the last time, when they had sat down to eat, Jesus appealed him thus with the words, "One of you shall betray me" (<a onClick="return mV(\'Mat\',26,21);">Mt 26:21</a>; <a onClick="return mV(\'Mar\',14,18);">Mr 14:18</a>; <a onClick="return mV(\'Luk\',22,21);">Lu 22:21</a>; <a onClick="return mV(\'Jhn\',13,21);">Joh 13:21</a>). And at the end, in answer to the anxious queries of His disciples, "Is it I?" He indicated his betrayer, not by name, but by a sign: "He it is, for whom I shall dip the sop, and give it him" (<a onClick="return mV(\'Jhn\',13,26);">Joh 13:26</a>). Immediately upon its reception, Judas left the supper room; the opportunity which he sought for was come (compare <a onClick="return mV(\'Jhn\',13,30);">Joh 13:30</a>; <a onClick="return mV(\'Mat\',26,16);">Mt 26:16</a>). There is some doubt as to whether he actually received the eucharistic bread and wine previous to his departure or not, but most modern commentators hold that he did not. On his departure, Judas made his way to the high priests and their followers, and coming upon Jesus in the Garden of Gethsemane, he betrayed his Master with a kiss (<a onClick="return mV(\'Mat\',26,\'47-50\');">Mt 26:47-50</a>; <a onClick="return mV(\'Mar\',14,43,44);">Mr 14:43,44</a>; <a onClick="return mV(\'Luk\',22,47);">Lu 22:47</a>; <a onClick="return mV(\'Jhn\',18,\'2-5\');">Joh 18:2-5</a>).<P>4. His Death:<P>After the betrayal, Mark, Luke and John are silent as regards Judas, and the accounts given in Matthew and Acts of his remorse and death vary in detail. According to Matthew, the actual condemnation of Jesus awakened Judas\' sense of guilt, and becoming still more despondent at his repulse by the chief priests and elders, "he cast down the pieces of silver into the sanctuary, and departed; and he went away and hanged himself." With the money the chief priests purchased the potter\'s field, afterward called "the field of blood," and in this way was fulfilled the prophecy of Zechariah (<a onClick="return mV(\'Zec\',11,\'12-14\');">11:12-14</A>) ascribed by Matthew to Jeremiah (<a onClick="return mV(\'Mat\',27,\'3-10\');">Mt 27:3-10</a>). The account given in <a onClick="return mV(\'Act\',1,\'16-20\');">Ac 1:16-20</a> is much shorter. It mentions neither Judas\' repentance nor the chief priests, but simply states that Judas "obtained a field with the reward of his iniquity; and falling headlong, he burst asunder in the midst, and all his bowels gushed out" (<a onClick="return mV(\'Act\',1,18);">1:18</a>). The author of Acts finds in this the fulfillment of the prophecy in <a onClick="return mV(\'Psa\',69,25);">Ps 69:25</a>. The Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) rendering, "When he had hanged himself, he burst asunder," suggests a means of reconciling the two accounts.<P>According to a legendary account mentioned by Papias, the death of Judas was due to elephantiasis (compare Hennecke, Neutestamentliche Apokryphen, 5). A so-called "Gospel of Judas" was in use among the Gnostic sect of the Cainites.<P>II. Character and Theories.<P>1. Joined the Apostles to Betray Jesus:<P>Much discussion and controversy have centered, not only around the discrepancies of the Gospel narratives of Judas, but also around his character and the problems connected with it. That the betrayer of Jesus should also be one of the chosen Twelve has given opportunity for the attacks of the foes of Christianity from the earliest times (compare Orig., Con. Cel., ii.12); and the difficulty of finding any proper solution has proved so great that some have been induced to regard Judas as merely a personification of the spirit of Judaism. The acceptance of this view would, however, invalidate the historical value of much of the Scriptural writings. Other theories are put forward in explanation, namely, that Judas joined the apostolic band with the definite intention of betraying Jesus. The aim of this intention has again received two different interpretations, both of which seek to elevate the character of Judas and to free him from the charge of sordid motives and cowardly treachery. According to one, Judas was a strong patriot, who saw in Jesus the foe of his race and its ancient creed, and therefore betrayed Him in the interests of his country. This view is, however, irreconcilable with the rejection of Judas by the chief priests (compare <a onClick="return mV(\'Mat\',27,\'3-10\');">Mt 27:3-10</a>). According to the other, Judas regarded himself as a true servant of Christianity, who assumed the role of traitor to precipitate the action of the Messiah and induce Him to manifest His miraculous powers by calling down the angels of God from heaven to help Him (compare <a onClick="return mV(\'Mat\',26,53);">Mt 26:53</a>). His suicide was further due to his disappointment at the failure of Jesus to fulfill his expectations. This theory found favor in ancient times with the Cainites (compare above), and in modern days with De Quincey and Bishop Whately. But the terms and manner of denunciation employed by Jesus in regard to Judas (compare also <a onClick="return mV(\'Jhn\',17,12);">Joh 17:12</a>) render this view also untenable.<P>2. Foreordained to Be a Traitor:<P>Another view is that Judas was foreordained to be the traitor: that Jesus was conscious from the first that He was to suffer death on the cross, and chose Judas because He knew that he should betray Him and thus fulfill the Divine decrees (compare <a onClick="return mV(\'Mat\',26,54);">Mt 26:54</a>). Those holding this view base their arguments on the omniscience of Jesus implied in <a onClick="return mV(\'Jhn\',2,24);">Joh 2:24</a>, Jesus "knew all men"; <a onClick="return mV(\'Jhn\',6,64);">Joh 6:64</a>, "Jesus knew from the beginning who should betray him," and <a onClick="return mV(\'Jhn\',18,4);">Joh 18:4</a>, "knowing all the things that were coming upon him." Yet to take those texts literally would mean too rigid application of the doctrine of predestination. It would treat Judas as a mere instrument, as a means and not an end in the hands of a higher power: it would render meaningless the appeals and reproaches made to him by Jesus and deny any real existence of that personal responsibility and sense of guilt which it was our Lord\'s very purpose to awaken and stimulate in the hearts of His hearers. John himself wrote after the event, but in the words of our Lord there was, as we have seen, a growing clearness in the manner in which He foretold His betrayal. The omniscience of Jesus was greater than that of a mere clairvoyant who claimed to foretell the exact course of future events. It was the omniscience of one who knew on the one hand the ways of His Eternal Father among men, and who, on the other, penetrated into the deepest recesses of human character and beheld there all its secret feelings and motives and tendencies.<P>3. Betrayal the Result of Gradual Development:<P>Although a full discussion of the character of Judas would of necessity involve those ultimate problems of Free Will and Original Sin (Westcott) which no theology can adequately solve, theory which regards the betrayal as the result of a gradual development within the soul of Judas seems the most practical. It is significant that Judas alone among the disciples was of southern extraction; and the differences in temperament and social outlook, together with the petty prejudices to which these generally give rise, may explain in part, though they do not justify, his after treachery—that lack of inner sympathy which existed between Judas and the rest of the apostles. He undoubtedly possessed certain business ability, and was therefore appointed keeper of the purse. But his heart could not have been clean, even from the first, as he administered even his primary charge dishonestly. The cancer of this greed spread from the material to the spiritual. To none of the disciples did the fading of the dream of an earthly kingdom of pomp and glory bring greater disappointment than to Judas. The cords of love by which Jesus gradually drew the hearts of the other disciples to Himself, the teaching by which He uplifted their souls above all earthly things, were as chafing bonds to the selfishness of Judas. And from his fettered greed and disappointed ambition sprang jealousy and spite and hatred. It was the hatred, not of a strong, but of an essentially weak man. Instead of making an open breach with his Lord, he remained ostensibly one of His followers: and this continued contact with a goodness to which he would not yield (compare Swete on <a onClick="return mV(\'Mar\',14,10);">Mr 14:10</a>), and his brooding over the rebukes of his Master, gave ready entrance for "Satan into his soul." But if he "knew the good and did not do it" (compare <a onClick="return mV(\'Jhn\',13,17);">Joh 13:17</a>), so also he was weak in the carrying out of his nefarious designs. It was this hesitancy, rather than a fiendish cunning, which induced him to remain till the last moment in the supper room, and which prompted the remark of Jesus "What thou doest, do quickly" (<a onClick="return mV(\'Jhn\',13,27);">Joh 13:27</a>). Of piece with this weak-mindedness was his attempt to cast the blame upon the chief priests and elders (compare <a onClick="return mV(\'Mat\',27,3,4);">Mt 27:3,4</a>). He sought to set himself right, not with the innocent Jesus whom he had betrayed, but with the accomplices in his crime; and because that world which his selfishness had made his god failed him at the last, he went and hanged himself. It was the tragic end of one who espoused a great cause in the spirit of speculation and selfish ambition, and who weighed not the dread consequences to which those impure motives might lead him (compare also Bruce, Training of the Twelve; Latham, Pastor Pastorum; Stalker, Trial and Death of Jesus Christ).``88';
