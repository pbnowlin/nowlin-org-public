isbe[5146]='Joseph (2)`jo\'-zef (yoceph, "He will add"; Septuagint Ioseph). The narrative (<a onClick="return mV(\'Gen\',30,23,24);">Ge 30:23,24</a>) indicates not so much a double etymology as the course of Rachel\'s thoughts. The use of \'acaph, "He takes away," suggested to her mind by its form in the future, yoceph, "He will add," "And she called his name Joseph, saying, Yahweh add to me another son"):<P><b>I. THE JOSEPH STORY, A LITERARY QUESTION</b><P class="in15">1. An Independent Original or an Adaptation?<P class="in15">2. A Monograph or a Compilation?<P class="in30">(1) An Analytical Theory Resolving It into a Mere Compilation<P class="in30">(2) A Narrative Full of Gems<P class="in30">(3) The Argument from Chronology Supporting It as a Monograph<P><b>II. THE STORY OF JOSEPH, A BIOGRAPHY</b><P class="in15">1. A Bedouin Prince in Canaan<P class="in15">2. A Bedouin Slave in Egypt<P class="in15">3. The Bedouin Slave Becomes Again the Bedouin Prince<P class="in15">4. The Prime Minister<P class="in15">5. The Patriarch<P><b>LITERATURE</b><hr /><P>The eleventh son of Jacob. The Biblical narrative concerning Joseph presents two subjects for consideration, the Joseph story, a literary question, and the story of Joseph, a biography. It is of the first importance to consider these questions in this order.<P>Cheyne in Encyclopedia Biblica reaches such conclusions concerning the Joseph story that the story of Joseph is mutilated almost beyond recognition as a biography at all. Driver in HDB holds that the Joseph story was "in all probability only committed to writing 700-800 years" later than the time to which Joseph is attributed, points out that Joseph\'s name was also the name of a tribe, and concludes that "the first of these facts at once destroys all guarantee that we possess in the Joseph narrative a literal record of the facts," and that "the second fact raises the further question whether the figure of Joseph, in part or even as a whole, is a reflection of the history and characteristics of the tribe projected upon the past in the individual form." But he draws back from this view and thinks it "more probable that there was an actual person Joseph, afterward...rightly or wrongly regarded as the ancestor of the tribe...who underwent substantially the experience recounted of him in Genesis." In the presence of such critical notions concerning the literature in which the narrative of Joseph is embodied, it is clear that until we have reached some conclusions concerning the Joseph story, we cannot be sure that there is any real story of Joseph to relate.<P>I. The Joseph Story, a Literary Question.<P>1. An Independent Original or an Adaptation?:<P>This literary problem will be solved, if satisfactory answers may be found to two questions: Is it an independent original or an adaptation? Suitable material for such an adaptation as would produce a Joseph story has been sought at either end of the line of history: Joseph the progenitor and Joseph the tribe. The only contestant for the claim of being an early original of which the Joseph story might be an adaptation is the nasty "Tale of Two Brothers" (RP, series I, volume II, 137-46). This story in its essential elements much resembles the Joseph story. But such events as it records are common: why not such stories?<P>What evidence does this "Tale of Two Brothers" afford that the Joseph story is not an independent original? Are we to suppose that because many French romances involve the demi-monde, there was therefore no Madame de Pompadour? Are court scandals so unheard of that ancient Egypt cannot afford two? And why impugn the genuineness of the Joseph story because the "Tale of Two Brothers" resembles it? Is anyone so ethereal in his passions as not to know by instinct that the essential elements of such scandal are always the same? The difference in the narrative is chiefly in the telling. At this latter point the Joseph story and the "Tale of Two Brothers" bear no resemblance whatever.<P>If the chaste beauty of the Biblical story be observed, and then one turn to the "Tale of Two Brothers" with sufficient knowledge of the Egyptian tongue to perceive the coarseness and the stench of it, there can be no question that the Joseph story is independent of such a literary source. To those who thus sense both stories, the claim of the "Tale of Two Brothers" to be the original of the Joseph story cannot stand for a moment. If we turn from Joseph the progenitor to Joseph the tribe, still less will the claim that the story is an adaptation bear careful examination. The perfect naturalness of the story, the utter absence from its multitudinous details of any hint of figurative language, such as personification always furnishes, and the absolutely accurate reflection in the story of the Egypt of Joseph\'s day, as revealed by the many discoveries of which people of 700-800 years later could not know, mark this theory of the reflection of tribal history and characteristics as pure speculation. And besides, where in all the history of literature has it been proven that a tribe has been thus successfully thrown back upon the screen of antiquity in the "individual form"? Similar mistakes concerning Menes and Minos and the heroes of Troy are a warning to us. Speculation is legitimate, so long as it does not cut loose from known facts, but gives no one the right to suppose the existence in unknown history of something never certainly found in known history. So much for the first question.<P>2. A Monograph or a Compilation?:<P>Is it a monograph or a compilation? The author of a monograph may make large use of literary materials, and the editor of a compilation may introduce much editorial comment. Thus, superficially, these different kinds of composition may much resemble each other, yet they are, in essential character, very different the one from the other. A compilation is an artificial body, an automaton; a monograph is a natural body with a living soul in it. This story has oriental peculiarities of repetition and pleonastic expression, and these things have been made much of in order to break up the story; to the reader not seeking grounds of partition, it is one of the most unbroken, simply natural and unaffected pieces of narrative literature in the world. If it stood alone or belonged to some later portion of Scripture, it may well be doubted that it would ever have been touched by the scalpel of the literary dissector. But it belongs to the Pentateuch. There are manifest evidences all over the Pentateuch of the use by the author of material, either documentary or of that paradoxical unwritten literature which the ancients handed down almost without the change of a word for centuries.<P>(1) An Analytical Theory Resolving It into a Mere Compilation.<P>An analytical theory has been applied to the Pentateuch as a whole, to resolve it into a mere compilation. Once the principles of this theory are acknowledged, and allowed sway there, the Joseph story cannot be left untouched, but becomes a necessary sacrifice to the system. A sight of the lifeless, ghastly fragments of the living, moving Joseph story which the analysis leaves behind (compare EB, article "Joseph") proclaims that analysis to have been murder. There was a life in the story which has been ruthlessly taken, and that living soul marked the narrative as a monograph.<P>(2) A Narrative Full of Gems.<P>Where else is to be found such a compilation? Here is one of the most brilliant pieces of literature in the world, a narrative full of gems:<P>(a) the account of the presentation of the brothers in the presence of Joseph when he was obliged to go out to weep (<a onClick="return mV(\'Gen\',43,\'26-34\');">Ge 43:26-34</a>), and<P>(b) the scene between the terrified brothers of Joseph and the steward of his house (<a onClick="return mV(\'Gen\',44,\'6-13\');">Ge 44:6-13</a>),<P>(c) Judah\'s speech (<a onClick="return mV(\'Gen\',44,\'18-34\');">Ge 44:18-34</a>),<P>(d) the touching close of the revelation of Joseph to his brothers at last (<a onClick="return mV(\'Gen\',45,\'1-15\');">Ge 45:1-15</a>).<P>The soul of the whole story breathes through all of these. Where in all literature, ancient or modern, is to be found a mere compilation that is a great piece of literature? So far removed is this story from the characteristics of a compilation, that we may challenge the world of literature to produce another monograph in narrative literature that surpasses it.<P>(3) The Argument from Chronology Supporting It as a Monograph<P>Then the dates of Egyptian names and events in this narrative strongly favor its origin so early as to be out of the reach of the compilers. That attempts at identification in Egyptian of names written in Hebrew, presenting as they do the peculiar difficulties of two alphabets of imperfectly known phonetic values and uncertain equivalency of one in terms of the other, should give rise to differences of opinion, is to be expected. The Egyptian equivalents of Zaphenath-paneah and Asenath have been diligently sought, and several identifications have been, suggested (Brugsch, Egypt under the Pharaohs, 122; Budge, History of Egypt, V, 126-27). That which is most exact phonetically and yields the most suitable and natural meaning for Zaphenath-paneah is by Lieblein (PSBA,1898,204-8). It is formed like four of the names of Hyksos kings before the time of Joseph, and means "the one who furnishes the nourishment of life," i.e. the steward of the realm. The name Asenath is found from the XIth Dynasty on to the XVIIIth. Potiphar is mentioned as an Egyptian. Why not of course an Egyptian? The narrative also points distinctly to conditions obtaining under the Hyksos kings. When the people were like to perish for want of food they promised Joseph in return for help that they would be "servants of Pharaoh" (<a onClick="return mV(\'Gen\',47,\'18-25\');">Ge 47:18-25</a>). This suggests a previous antagonism to the government, such as the Hyksos kings had long to contend with in Egypt. But the revolution which drove out the Hyksos labored so effectually to eradicate every trace of the hated foreigners that it is with the utmost difficulty that modern Egyptological research has wrested from the past some small items of information concerning them. Is it credible that the editor of scraps, which were themselves not written down until some 700-800 years later, should have been able to produce such a life-story fitting into the peculiar conditions of the times of the Hyksos? Considered as an independent literary problem on its own merits, aside from any entangling necessities of the analytical theory of the Pentateuch, the Joseph story must certainly stand as a monograph from some time within distinct memory of the events it records. If the Joseph story be an independent original and a monograph, then there is in reality to be considered the story of Joseph.<P>II. The Story of Joseph, a Biography.<P>It is unnecessary to recount here all the events of the life of Joseph, a story so incomparably told in the Biblical narrative. It will be sufficient to touch only the salient points where controversy has raged, or at which archaeology has furnished special illumination. The story of Joseph begins the tenth and last natural division of Genesis in these words: "The generations of Jacob" (<a onClick="return mV(\'Gen\',37,2);">Ge 37:2</a>). Up to this point the unvarying method of Genesis is to place at the head of each division the announcement "the generations of" one of the patriarchs, followed immediately by a brief outline of the discarded line of descent, and then to give in detail the account of the chosen line.<P>There is to be now no longer any discarded line of descent. All the sons of Jacob are of the chosen people, the depository of the revelation of redemption. So this division of Genesis begins at once with the chosen line, and sets in the very foreground that narrative which in that generation is most vital in the story of redemption, this story of Joseph beginning with the words, "Joseph, being seventeen years old, was feeding the flock with his brethren" (<a onClick="return mV(\'Gen\',37,2);">Ge 37:2</a>). Joseph had been born in Haran, the firstborn of the beloved Rachel, who died at the birth of her second son Benjamin. A motherless lad among the sons of other mothers felt the jealousies of the situation, and the experience became a temptation. The "evil report" of his brethren was thus naturally carried to his father, and quite as naturally stirred up those family jealousies which set his feet in the path of his great career (<a onClick="return mV(\'Gen\',37,\'2-4\');">Ge 37:2-4</a>). In that career he appears as a Bedouin prince in Canaan.<P>1. A Bedouin Prince in Canaan:<P>The patriarchs of those times were all sheiks or princes of those semi-nomadic rovers who by the peculiar social and civil customs of that land were tolerated then as they are to this day under the Turkish government in the midst of farms and settled land tenure. Jacob favored Rachel and her children. He put them hindermost at the dangerous meeting with Esau, and now he puts on Joseph a coat of many colors (<a onClick="return mV(\'Gen\',37,3);">Ge 37:3</a>). The appearance of such a coat a little earlier in the decoration of the tombs of Benichassan among Palestinian ambassadors to Egypt probably indicates that this garment was in some sense ceremonial, a token of rank. In any case Joseph, the son of Jacob, was a Bedouin prince. Did the father by this coat indicate his intention to give him the precedence and the succession as chieftain of the tribe? It is difficult otherwise to account for the insane jealousy of the older brethren (<a onClick="return mV(\'Gen\',37,4);">Ge 37:4</a>). According to the critical partition of the story, Joseph\'s dreams may be explained away as mere reflections or adaptations of the later history of Joseph (compare <a href="./study/isbe/search.html?string=PENTATEUCH">PENTATEUCH</a>). In a real biography the striking providential significance of the dreams appears at once. They cannot be real without in some sense being prophetic. On the other hand they cannot be other than real without vitiating the whole story as a truthful narrative, for they led immediately to the great tragedy; a Bedouin prince of Canaan becomes a Bedouin slave in Egypt.<P>2. A Bedouin Slave in Egypt:<P>The plot to put Joseph out of the way, the substitution of slavery for death, and the ghastly device for deceiving Jacob (<a onClick="return mV(\'Gen\',37,\'18-36\');">Ge 37:18-36</a>) are perfectly natural steps in the course of crime when once the brothers had set out upon it. The counterplot of Reuben to deliver Joseph reflects equally his own goodness and the dangerous character of the other brothers to whom he did not dare make a direct protest.<P>Critical discussion of "Ishmaelites" and "Midianites" and "Medanites" presents some interesting things and many clever speculations which may well be considered on their own merits by those interested in ethnology and etymologies. Many opinions advanced may prove to be correct. But let it be noted that they arc for the most part pure speculation. Almost nothing is known of the interrelation of the trans-Jordanic tribes in that age other than the few hints in the Bible. And who can say what manner of persons might be found in a caravan which had wandered about no one knows where, or how long, to pick up trade before it turned into the northern caravan route? Until archaeology supplies more facts it is folly to attach much importance to such speculations (Kyle, The Deciding Voice of the Monuments in Biblical Criticism, 221).<P>In the slave market in Egypt, Joseph was bought by Potiphar, an officer of Pharaoh, "an Egyptian." The significant mention of this fact fits exactly into a place among the recovered hints of the history of those times, which make the court then to be not Egyptian at all, but composed of foreigners, the dynasty of Hyksos kings among whom an "Egyptian" was so unexpected as to have his nationality mentioned.<P>Joseph\'s native nobility of character, the pious training he had received in his father\'s house, and the favor of God with him gave him such prosperity that his master entrusted all the affairs of his household to him, and when the greatest of temptations assails him he comes off victorious (<a onClick="return mV(\'Gen\',39,1);">Genesis 39</a>). There is strong ground for the suspicion that Potiphar did not fully believe the accusation of his wife against Joseph. The fact that Joseph was not immediately put to death is very significant. Potiphar could hardly do less than shut him up for the sake of appearances, and perhaps to take temptation away from his wife without seeming to suspect her. It is noticeable also that Joseph\'s character soon triumphed in prison. Then the same Providence that superintended his dreams is leading so as to bring him before the king (<a onClick="return mV(\'Gen\',40,\'1-\');">Genesis 40</a>; <a onClick="return mV(\'Gen\',41,\'1-\');">41</a>).<P>3. The Bedouin Slave Becomes Again the Bedouin Prince:<P>The events of the immediately preceding history prepared Joseph\'s day: the Hyksos kings on the throne, those Bedouin princes, "shepherd kings" (Petrie, Hyksos and Israelite Cities), the enmity of the Egyptians against this foreign dynasty so that they accounted every shepherd an "abomination" (<a onClick="return mV(\'Gen\',46,34);">Ge 46:34</a>), the friendly relation thus created between Palestinian tribes and Egypt, the princely character of Joseph, for among princes a prince is a prince however small his principality, and last of all the manifest favor of God toward Joseph, and the evident understanding by the Pharaohs of Semitic religion, perhaps even sympathy with it (<a onClick="return mV(\'Gen\',41,39);">Ge 41:39</a>). All these constitute one of the most majestic, Godlike movements of Providence revealed to us in the word of God, or evident anywhere in history. The same Providence that presided over the boy prince in his father\'s house came again to the slave prince in the Egyptian prison. The interpretation of the dreams of the chief butler and the chief baker of Pharaoh (<a onClick="return mV(\'Gen\',40,\'1-\');">Ge 40</a>-<a onClick="return mV(\'Gen\',41,\'1-24\');">41:1-24</a>) brought him at last through much delay and selfish forgetfulness to the notice of the king, and another dream in which the same cunning hand of Providence is plainly seen (<a onClick="return mV(\'Gen\',41,\'1-\');">Genesis 41</a>) is the means of bringing Joseph to stand in the royal presence. The stuff that dreams are made of interests scarcely less than the Providence that was superintending over them. As the harvest fields of the semi-nomadic Bedouin in Palestine, and the household routine of Egypt in the dreams of the chief butler and the chief baker, so now the industrial interests and the religious forms of the nation appear in the dreams of Pharaoh. The "seven kine" of the goddess Hathor supplies the number of the cows, and the doubling of the symbolism in the cattle and the grain points to the two great sources of Egypt\'s welfare. The Providence that had shaped and guided the whole course of Joseph from the Palestinian home was consummated when, with the words, "Inasmuch as thou art a man in whom is the spirit of God," Pharaoh lifted up the Bedouin slave to be again the Bedouin prince and made him the prime minister.<P>4. The Prime Minister:<P>The history of "kings\' favorites" is too well known for the elevation of Joseph to be in itself incredible. Such things are especially likely to take place among the unlimited monarchies of the Orient. The late empress of China had been a Chinese slave girl. The investiture of Joseph was thoroughly Egyptian—the "collar," the signet "ring," the "chariot" and the outrunners who cried before him "Abrech." The exact meaning of this word has never been certainly ascertained, but its general import may be seen illustrated to this day wherever in the East royalty rides out. The policy adopted by the prime minister was far-reaching, wise, even adroit (<a onClick="return mV(\'Gen\',41,\'25-36\');">Ge 41:25-36</a>). It is impossible to say whether or not it was wholly just, for we cannot know whether the corn of the years of plenty which the government laid up was bought or taken as a taxlevy. The policy involved some despotic power, but Joseph proved a magnanimous despot. The deep and subtle statesmanship in Joseph\'s plan does not fully appear until the outcome. It was probably through the policy of Joseph, the prime minister, that the Hyksos finally gained the power over the people and the mastery of the land.<P>Great famines have not been common in Egypt, but are not unknown. The only one which corresponds well to the Bible account is that one recorded in the inscription of Baba at el Kab, translated by Brugsch. Some scarcely justifiable attempts have been made to discredit Brugsch in his account of that inscription. The monument still remains and is easily visited, but the inscription is so mutilated that it presents many difficulties. The severity of the famine, the length of its duration, the preparation by the government, the distribution to the people, the success of the efforts for relief and even the time of the famine, as far as it can be determined, correspond well to the Bible account (Brugsch, Egypt under the Pharaohs, chapter vi). The way in which such famines in Egypt come about has been explained by a movement of the sudd, a sedgelike growth in the Nile, so as to clog the upper river (Wright, Scientific Confirmations, 70-79).<P>Joseph\'s brethren came "with those that came," i.e. with the food caravans. The account does not imply that the prime minister presided in person at the selling of grain, but only that he knew of the coming of his brethren and met them at the market place. The watchfulness of the government against "spies," by the careful guarding of the entrances to the land, may well have furnished him with such information. Once possessed with it, all the rest of the story of the interviews follows naturally (compare traditions of Joseph, Jewish Encyclopedia).<P>The long testing of the brethren with the attendant delay in the relief of the father Jacob and the family (<a onClick="return mV(\'Gen\',42,\'1-\');">Genesis 42-45</a>) has been the subject of much discussion, and most ingenious arguments for the justification of Joseph. All this seems unnecessary. Joseph was not perfect, and there is no claim of perfection made for him in the Bible. Two things are sufficient to be noted here: one that Joseph was ruler as well as brother, with the habits of a ruler of almost unrestrained power and authority and burdened with the necessity for protection and the obligation to mete out justice; the other that the deliberateness, the vexatious delays, the subtle diplomacy and playing with great issues are thoroughly oriental. It may be also that the perplexities of great minds make them liable to such vagaries. The career of Lincoln furnishes some curious parallels in the parleying with cases long after the great president\'s mind was fully made up and action taken.<P>The time of these events and the identification of Joseph in Egypt are most vexed questions not conclusively settled. Toffteen quite confidently presents in a most recent identification of Joseph much evidence to which one would like to give full credence (Toffteen, The Historical Exodus). But aside from the fact that he claims two exodi, two Josephs, two Aarons, two lawgivers called Moses, and two givings of the law, a case of critical doublets more astounding than any heretofore claimed in the Pentateuch, the evidence itself which he adduces is very far from conclusive. It is doubtful if the texts will bear the translation he gives them, especially the proper names. The claims of Rameses II, that he built Pithom, compared with the stele of 400 years, which he says he erected in the 400th year of King Nubti, seems to put Joseph about the time of the Hyksos king. This is the most that can be said now. The burial of Jacob is in exact accord with Egyptian customs. The wealth of the Israelites who retained their possessions and were fed by the crown, in contrast with the poverty of the Egyptians who sold everything, prepares the way for the wonderful growth and influence of Israel, and the fear which the Egyptians at last had of them. "And Joseph died, being 110 years old," an ideal old age in the Egyptian mind. The reputed burial place of Joseph at Shechem still awaits examination.<P>5. The Patriarch:<P>Joseph stands out among the patriarchs in some respects with preeminence. His nobility of character, his purity of heart and life, his magnanimity as a ruler and brother Patriarch make him, more than any other of the Old Testament characters, an illustration of that type of man which Christ was to give to the world in perfection. Joseph is not in the list of persons distinctly referred to in Scripture as types of Christ—the only perfectly safe criterion—but none more fully illustrates the life and work of the Saviour. He wrought salvation for those who betrayed and rejected him, he went down into humiliation as the way to his exaltation, he forgave those who, at least in spirit, put him to death, and to him as to the Saviour, all must come for relief, or perish.<P>LITERATURE. Commentaries on Genesis; for rabbinical literature, compare Seligsohn in Jewish Encyclopedia, some very interesting and curious traditions; Ebers, Egypten und die Bucher Moses; "The Tale of Two Brothers," RP, series I, volume II, 13746; Wilkinson-Birch, The Manners and Customs of the Ancient Egyptians; Erman, Life in Ancient Egypt.``93';
isbe[5147]='Joseph Barnabas``<a href="./study/isbe/search.html?string=BARNABAS">BARNABAS</a>`1';
isbe[5148]='Joseph Barsabbas`bar-sab\'-as Barsabbas, or Barsabas; the King James Version Barsabas, bar\'-sa-bas; for etymology, etc., of Joseph, see general article on <a href="./study/isbe/search.html?string=JOSEPH">JOSEPH</a>): Joseph Barsabbas was surnamed Justus (<a onClick="return mV(\'Act\',1,23);">Ac 1:23</a>). Barsabbas was probably a patronymic, i.e. son of Sabba or Seba. Other interpretations given are "son of an oath," "son of an old man," "son of conversion," "son of quiet." It is likely that the "Judas called Barsabbas" of <a onClick="return mV(\'Act\',15,22);">Ac 15:22</a> was his brother. Ewald considers that both names refer to the same person, but this is improbable.<P>Joseph was one of those who accompanied the apostles "all the time that the Lord Jesus went in and went out among us, beginning from the baptism of John, unto the day that he was received up from us" (<a onClick="return mV(\'Act\',1,21,22);">Ac 1:21,22</a>). At the meeting of the brethren under the presidency of Peter in Jerusalem shortly after the crucifixion, he was, therefore, proposed along with Matthias as a suitable candidate for the place in the apostleship left vacant by the treachery and death of Judas Iscariot; but was unsuccessful (<a onClick="return mV(\'Act\',1,\'15-26\');">Ac 1:15-26</a>).<P>According to Eusebius (Historia Ecclesiastica, I, 12), Joseph was one of the 70 (<a onClick="return mV(\'Luk\',10,1);">Lu 10:1</a>), and Papias records the oral tradition that he drank a cup of poison without harm (compare <a onClick="return mV(\'Mar\',16,18);">Mr 16:18</a>). The Acts of Paul, a work belonging to the 2nd century and first mentioned by Origen, relates that Barsabbas, Justus the Flatfoot and others were imprisoned by Nero for protesting their faith in Christ, but that upon a vision of the newly martyred Paul appearing to the emperor, he ordered their immediate release.``88';
isbe[5149]='Joseph of Arimathaea`(A Arimathaias; for etymology, etc., of Joseph, see general article on <a href="./study/isbe/search.html?string=JOSEPH">JOSEPH</a>): Joseph of Arimathea—a place the locality of which is doubtful, but lying probably to the northwest of Jerusalem—was a "rich man" (<a onClick="return mV(\'Mat\',27,57);">Mt 27:57</a>), "a councilor of honorable estate," or member of the Sanhedrin (<a onClick="return mV(\'Mar\',15,43);">Mr 15:43</a>; <a onClick="return mV(\'Luk\',23,50);">Lu 23:50</a>), "a good and righteous man...who was looking for the kingdom of God" (<a onClick="return mV(\'Luk\',23,50);">Lu 23:50</a>; <a onClick="return mV(\'Mar\',15,43);">Mr 15:43</a>), and "himself was Jesus\' disciple" (<a onClick="return mV(\'Mat\',27,57);">Mt 27:57</a>; <a onClick="return mV(\'Jhn\',19,38);">Joh 19:38</a>). Although he kept his discipleship secret "for fear of the Jews" (<a onClick="return mV(\'Jhn\',19,38);">Joh 19:38</a>), he was yet faithful to his allegiance in that he absented himself from the meeting which found Jesus guilty of death (compare <a onClick="return mV(\'Luk\',23,51);">Lu 23:51</a>; <a onClick="return mV(\'Mar\',14,64);">Mr 14:64</a>). But the condemnation of his Lord awakened the courage and revealed the true faith of Joseph. On the evening after the crucifixion he went "boldly" to Pilate and begged the body of Jesus. There is a fine touch in that he himself took down the body from the cross. With the assistance of Nicodemus he wound it in fine linen with spices (compare <a onClick="return mV(\'Mat\',27,57);">Mt 27:57</a>, Joseph was a "rich man") and brought it to the new sepulcher in the garden near the place of His crucifixion. There they "laid him in a tomb that was hewn in stone, where never man had yet lain" and \'rolled a stone against the door of the tomb\' (compare <a onClick="return mV(\'Mat\',27,\'57-60\');">Mt 27:57-60</a>; <a onClick="return mV(\'Mar\',15,\'42-46\');">Mr 15:42-46</a>; <a onClick="return mV(\'Luk\',23,\'50-53\');">Lu 23:50-53</a>; <a onClick="return mV(\'Jhn\',19,\'38-42\');">Joh 19:38-42</a>). In this was held to be the fulfillment of the prophecy of <a onClick="return mV(\'Isa\',53,9);">Isa 53:9</a>.<P>The Gospel of Peter, written probably in Syria about the middle of the 2nd century, gives a slightly different account. According to this Joseph, "the friend of Pilate and the Lord," was present at the trial of Jesus, and immediately upon its conclusion besought of Pilate that he might have the body for burial. This was granted, and after the crucifixion the Jews handed the body over to Joseph (compare Hennecke, Neutestamentliche Apokryphen, 27-30). Legends of a later origin record that Joseph was sent by Philip from Gaul to Britain along with 11 other disciples in 63 AD, and built an oratory at Glastonbury (compare <a href="./study/isbe/search.html?string=PHILIP">PHILIP</a>, the Apostle), that he brought the Holy Grail to England, and that he freed Ireland from snakes.``88';
isbe[5150]='Joseph\'s Dream``<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>; <a href="./study/isbe/search.html?string=JOSEPH">JOSEPH</a>`1';
isbe[5151]='Joseph, Husband of Mary`1. References in New Testament:<P>(For etymology, etc., of Joseph, see <a href="./study/isbe/search.html?string=JOSEPH">JOSEPH</a>): Joseph, the carpenter (<a onClick="return mV(\'Mat\',13,55);">Mt 13:55</a>), was a "just man" (<a onClick="return mV(\'Mat\',1,19);">Mt 1:19</a> the King James Version), who belonged to Nazareth (<a onClick="return mV(\'Luk\',2,4);">Lu 2:4</a>). He was of Davidic descent (<a onClick="return mV(\'Mat\',1,20);">Mt 1:20</a>; <a onClick="return mV(\'Luk\',2,4);">Lu 2:4</a>), the son of Heli (<a onClick="return mV(\'Luk\',3,23);">Lu 3:23</a>) or Jacob (<a onClick="return mV(\'Mat\',1,16);">Mt 1:16</a>), the husband of Mary (<a onClick="return mV(\'Mat\',1,16);">Mt 1:16</a>), and the supposed father of Jesus (<a onClick="return mV(\'Mat\',13,55);">Mt 13:55</a>; <a onClick="return mV(\'Luk\',3,23);">Lu 3:23</a>; <a onClick="return mV(\'Luk\',4,22);">4:22</a>; <a onClick="return mV(\'Jhn\',1,45);">Joh 1:45</a>; <a onClick="return mV(\'Jhn\',6,42);">6:42</a>).<P>(1) Before the Nativity.<P>The Gospels of Matthew and Mark alone give any detailed reference to Joseph and the birth of Jesus, and their accounts vary in part. Luke begins with the Annunciation to Mary at Nazareth (<a onClick="return mV(\'Luk\',1,\'26-38\');">Lu 1:26-38</a>). Overwhelmed with the tidings, Mary departed "with haste" "into the hill country,...into a city of Judah," to seek communion with Elisabeth, with whom she had been coupled in the Annunciation by the angel Gabriel (<a onClick="return mV(\'Luk\',1,\'39-55\');">Lu 1:39-55</a>). After abiding with her about three months she returned "unto her own house" (<a onClick="return mV(\'Luk\',1,56);">Lu 1:56</a> the King James Version). The events recorded in <a onClick="return mV(\'Mat\',1,\'18-24\');">Mt 1:18-24</a> probably took place in the interval between this return and the birth of Jesus. During Mary\'s visit to Elisabeth, Joseph had likely remained in Nazareth. The abrupt and probably unexplained departure of his espoused wife for Judah (compare the phrase "with haste"), and her condition on her return, had caused him great mental distress (<a onClick="return mV(\'Mat\',1,\'18-20\');">Mt 1:18-20</a>). Though his indignation was tempered with mercy, he was minded to put her away "privily," but the visitation of the angel in his sleep relieved him from his dilemma, and he was reconciled to his wife (<a onClick="return mV(\'Mat\',1,24);">Mt 1:24</a>). The narrative is then continued by Luke. While Joseph and Mary still abode in Nazareth, "there went out a decree from Caesar Augustus, that all the world should be enrolled" (<a onClick="return mV(\'Luk\',2,1);">Lu 2:1</a>). "And all went to enroll themselves, every one to his own city" (<a onClick="return mV(\'Luk\',2,3);">Lu 2:3</a>). Being of the house and lineage of David, Joseph went up with Mary, who was "great with child," from Galilee, "out of the city of Nazareth, into Judea, to the city of David, which is called Bethlehem" (<a onClick="return mV(\'Luk\',2,4,5);">Lu 2:4,5</a>), and there Jesus was born (<a onClick="return mV(\'Luk\',2,7);">Lu 2:7</a>; compare <a onClick="return mV(\'Mat\',2,1);">Mt 2:1</a>).<P>(2) After the Nativity.<P>(a) Luke\'s Account:<P>The two accounts now diverge considerably. According to Luke, the Holy Family remained for a time at Bethlehem and were there visited by the shepherds (<a onClick="return mV(\'Luk\',2,\'8-20\');">Lu 2:8-20</a>). After a sojourn of 40 days for the purification (compare <a onClick="return mV(\'Luk\',2,21,22);">Lu 2:21,22</a>; <a onClick="return mV(\'Lev\',12,1);">Le 12</a>), Joseph departed with his wife for Jerusalem "to present" the infant Jesus "to the Lord" and to offer up sacrifice according to the ancient law (<a onClick="return mV(\'Luk\',2,24);">Lu 2:24</a>). There he was present at the prophesying of Simeon and Anna concerning Jesus, and received the blessing of the former (<a onClick="return mV(\'Luk\',2,34);">Lu 2:34</a>). After "they had accomplished all things according to the law of the Lord, they returned into Galilee, to their own city Nazareth" (<a onClick="return mV(\'Luk\',2,39);">Lu 2:39</a>). Every year, at the Passover, they made this journey to Jerusalem (<a onClick="return mV(\'Luk\',2,41);">Lu 2:41</a>). The care and solicitude of Joseph and Mary for the boy Jesus and their grief at His temporary loss aye also recorded (<a onClick="return mV(\'Luk\',2,45,48,51);">Lu 2:45,48,51</a>). There is evidence that, though Mary "kept all these things in her heart," Joseph at least had no understanding then of the Divine nature of the charge committed to his care (<a onClick="return mV(\'Luk\',2,50);">Lu 2:50</a>).<P>(b) Matthew\'s Account:<P>But according to Matthew it was from the Wise Men of the East that Jesus received homage at Bethlehem (<a onClick="return mV(\'Mat\',2,\'1-11\');">Mt 2:1-11</a>). There is no further mention of the dedicatory journey to Jerusalem, or of the return to Nazareth. Instead, it is stated that on the departure of the Wise Men from Bethlehem, Joseph was warned in a dream of the impending wrath of Herod, and escaped with his wife and the infant Jesus into Egypt (<a onClick="return mV(\'Mat\',2,13,14);">Mt 2:13,14</a>). Upon the death of Herod, an angel appeared to Joseph, and he returned to the land of Israel (<a onClick="return mV(\'Mat\',2,\'19-21\');">Mt 2:19-21</a>). His original intention was to settle once more in Judea, but on learning that Archelaus, the son of Herod, was ruler there, "he withdrew into the parts of Galilee, and came and dwelt in a city called Nazareth" (<a onClick="return mV(\'Mat\',2,22,23);">Mt 2:22,23</a>).<P>(c) The Proper Sequence of the Two Narratives:<P>The narrative of Matthew would thus imply that the Holy Family had no connection with Nazareth previous to their return from Egypt. It has, however, been suggested by Ramsay that Matthew merely reports what was common knowledge, and that Luke, while quite cognizant of this, supplemented it in his own Gospel with details known only to the Holy Family, and in part to the mother alone (compare Sir W. Ramsay, Was Christ Born at Bethlehem? 78-79). A comparison of the two Gospel narratives makes it clear that the visitation of the Wise Men fell on a later date than that of the shepherds. The latter took place immediately after the Nativity (compare <a onClick="return mV(\'Luk\',2,11,15,16);">Lu 2:11,15,16</a>, "is born...this day," "let us now go," "and they came with haste"). On the other hand, when the Wise Men came to Jerusalem, Christ was already born (compare <a onClick="return mV(\'Mat\',2,1);">Mt 2:1</a>). Time was required for this journey to Jerusalem and the consultation of Herod with the chief priests (<a onClick="return mV(\'Mat\',2,4);">Mt 2:4</a>); and during this interval the events recorded in <a onClick="return mV(\'Luk\',2,\'8-39\');">Lu 2:8-39</a> had taken place. That there was sufficient time for this is attested also by the fact that Herod\'s decree was directed against children up to two years of age (<a onClick="return mV(\'Mat\',2,16);">Mt 2:16</a>). Thus it was after the return of the Holy Family to Nazareth, and on a further visit to Bethlehem, implied by Matthew but not recorded by Luke, that the infant Jesus received the adoration of the Wise Men. Jesus being born in 6 BC, this took place in 5 BC, and as Herod died in 4 BC, Joseph may have missed only one of the Passovers (compare <a onClick="return mV(\'Luk\',2,41);">Lu 2:41</a>) by his flight into Egypt. (For a full discussion, compare Ramsay, op. cit.) As no mention is made of Joseph in the later parts of the Gospels where the Holy Family is referred to (compare <a onClick="return mV(\'Mat\',12,46);">Mt 12:46</a>; <a onClick="return mV(\'Luk\',8,19);">Lu 8:19</a>), it is commonly supposed that he died before the commencement of the public ministry of Christ.<P>2. Character:<P>If a type is to be sought in the character of Joseph, it is that of a simple, honest, hard-working, God-fearing man, who was possessed of large sympathies and a warm heart. Strict in the observance of Jewish law and custom, he was yet ready when occasion arose to make these subservient to the greater law of the Spirit. Too practical to possess any deep insight into the Divine mysteries or eternal significance of events which came within his knowledge (compare <a onClick="return mV(\'Luk\',2,50);">Lu 2:50</a>), he was quick to make answer to what he perceived to be the direct call of God (compare <a onClick="return mV(\'Mat\',1,24);">Mt 1:24</a>). Originally a "just man" (the King James Version), the natural clemency within his heart prevailed over mere justice, and by the promptings of the Holy Spirit that clemency was transferred into a strong and enduring love (compare <a onClick="return mV(\'Mat\',1,24);">Mt 1:24</a>). Joseph is known to us only as a dim figure in the background of the Gospel narratives, yet his whole-hearted reconciliation to Mary, even in the face of possible slanderings by his neighbors, his complete self-sacrifice, when he left all and fled into Egypt to save the infant Jesus, are indicative that he was not unworthy to fulfill the great trust which was imposed upon him by the Eternal Father.<P>3. References in Apocryphal Literature:<P>The Gospel of the Infancy according to James, a work composed originally in the 2nd century, but with later additions (compare Hennecke, Neutestamentliche Apokryphen, 47-63), gives a detailed account of the marriage of the aged Joseph with Mary, of their journey to Bethlehem, and of the birth of Jesus. A similar gospel, reputed to be by Thomas the philosopher, of later origin and Gnostic tendency (compare Hennecke, 63-73), narrates several fantastic, miraculous happenings in the domestic life of the Holy Family, and the dealings of Joseph with the teachers of the youthful Jesus. Other legends, from Syriac or Egyptian sources, also dealing with the Infancy, in which Joseph figures, are extant. The chief is The History of Joseph the Carpenter (compare Hennecke, Handbuch der neutestamentlichen Apokryphen, 95-105). This contains an account of the death and burial of Joseph at the age of 110, and of the entreaties of Mary to Christ to save him. Its aim was to show forth Christ as the Saviour, even at the last hour, and the rightful manner of Christian death. Joseph has received a high place in the Calendar of the Roman Catholic Saints, his feast being celebrated on March 19.``88';
isbe[5152]='Joseph, Prayer of`An Old Testament pseudepigraph, <span class="noTag">number 3</span> in the Stichometry of Nicephorus (Westcott, Canon of the New Testament(7), 571), with the length given as 1,100 lines, and <span class="noTag">number 5</span> in the List of Sixty Books (Westcott, 568). The work is lost, and the only quotations are in Origen (In Joan., ii.25, English in Ante-Nicene Fathers, IX, 341; In Gen., iii.9, 12). Abraham, Isaac, and Jacob are said to have been created before every work, but Jacob-Israel is the greatest, "the firstborn of every living creature," the "first minister in God\'s presence," greater than the angel with whom he wrestled. The purport may be anti-Christian, the patriarchs exalted in place of Christ; compare, perhaps, Enoch 71 (but not so in Charles\' 1912 text), but Origen\'s favorable opinion of the book proves that the polemic could not have been very direct.<P>LITERATURE.<P>GJV, 4th edition, III, 359-60; Dillmann in PRE, 2nd edition, XII, 362; compare Beer in 3rd edition, XVI, 256; Fabricius, Codex pseudep. Vet. Test., I, 761-71.``48';
isbe[5153]='Joseph, the Carpenter, Gospel of``<a href="./study/isbe/search.html?string=APOCRYPHAL+GOSPELS">APOCRYPHAL GOSPELS</a>`1';
isbe[5154]='Josephus`jo-se\'-fus (Iosephos; Codex Vaticanus reads Phosepos): In 1Esdras 9:34, corresponding to "Joseph" in <a onClick="return mV(\'Ezr\',10,42);">Ezr 10:42</a>.``1';
isbe[5155]='Josephus; Flavius`jo-se\'-fus, fla\'-vi-us:<P>1. Early Life and Beliefs:<P>Was born at Jerusalem 37-38 AD, and died at Rome early in the 2nd century, when is not known precisely. His father and mother belonged to families of the priestly aristocracy; consequently he received an excellent education, becoming familiar, not only with Jewish, but with Hellenistic, culture. When 16 years old he resorted to one Banus, an <a href="./study/isbe/search.html?string=ESSENES">ESSENES</a>, (which see), in the desert of Engedi, with whom he remained for 3 years, absorbing occult lore, and practicing the ascetic life. It might have been expected from his social position that, on his return to Jerusalem, he would join the <a href="./study/isbe/search.html?string=SADDUCEES">SADDUCEES</A> (which see); but, his Essene experience having indoctrinated him with ceremonialism, he preferred to become a Pharisee (see <a href="./study/isbe/search.html?string=PHARISEES">PHARISEES</a>). He evidently believed, too, that the Pharisees were akin to the Stoics, who were then influential in the Hellenistic world. During his absence in the desert, the misgovernment of the Roman procurators at Jerusalem had grown apace. And the ineptitudes and injustices of Felix, Albanus and Florus were succeeded by anarchy under Annas, the high priest (62). Accordingly, the Zealots (see <a href="./study/isbe/search.html?string=ZEALOTS">ZEALOTS</a>) plotted against Roman rule. Rebellion simmered, and many of the disaffected were transported to Rome to be dealt with there. Among these were several priests, whom Josephus knew. About the year 64, he went to Rome to plead for them, met shipwreck on the voyage, was rescued with a few survivors and was brought to port at Puteoli. Here he met Alityrus, a Jewish actor, who happened to be in the good graces of Poppea, Nero\'s consort. The empress, a Jewish proselyte, espoused his cause at Rome, and showed him many favors. At the capital, he also discerned the power of the Romans and, in all probability, grew convinced of the hopelessness of armed revolt. On his return to Jerusalem, he found his people set upon insurrection, and was forced, possibly against his better judgment, to make common cause with them. The first part of his public career is concerned with the great struggle that now began.<P>2. Public Career:<P>When war broke out, Josephus was appointed governor of Galilee, the province where the Roman attack would first fall. He had no military fitness for command, but the influence of his friends and the exigencies of politics thrust the office upon him. The Zealots soon found that he did not carry out the necessary preparations with thoroughness, and they tried to compass his removal. But he was too influential, too good a politician also, to be undermined. Surrounded by enemies among his own folk, who even attempted to assassinate him, he encountered several dangerous experiences, and, at length, flying from the Romans, was beleaguered with his army in Jotopata, near the Lake of Gennesaret, in May, 67 AD. The Jews withstood the siege for 47 days with splendid courage, till Titus, assaulting under cover of a mist, stormed the stronghold and massacred the weary defenders. Josephus escaped to a cave where, with his usual adroitness, he saved himself from death at the hands of his companions. The Romans soon discovered his hiding-place, and haled him before Vespasian, the commander-in-chief. Josephus worked upon the superstitions of the general, and so ingratiated himself that Vespasian took him to Alexandria in his train. Having been liberated by his captor, he adopted the family name of the Flavians, according to Roman custom. Returning to Palestine with Titus, he proceeded to mediate between the Romans and the Jews, earning the suspicion of the former, the hatred of the latter. His wonted diplomacy preserved him from anything more serious than a wound, and he was an eyewitness of the terrible events that marked the last days of Jerusalem. Then he accompanied Titus to Rome for the TRIUMPH (which see). Here he lived the remainder of his days, in high favor with the ruling house, and relieved from all anxiety about worldly goods by lavish imperial patronage. He was thus enabled to devote himself to literary pursuits.<P>3. Works:<P>The works of Josephus render him one of the most valuable authorities for the student of New Testament times. They are as follows:<P>(1) Concerning the Jewish War, written before 79; we have the Greek translation of this history by the author; there are 7 books: I, the period from Antiochus Epiphanes (175 BC) to Herod the Great (4 BC); II, from 4 BC to 66 AD, covering the early events of the War; III, occurrences in Galilee in 67 AD; IV, the course of the War till the siege of Jerusalem; V and VI, the investment and fall of Jerusalem; VII, the aftermath of the rebellion. While this work is not written with the objective accuracy of scientific history, it is credible on the whole, except where it concerns the role played by the author.<P>(2) The Antiquities of the Jews, written not later than 94 AD. In this Josephus purports to relate the entire history of his race, from the beginning till the War of 66 AD. The 20 books fall naturally into 5 divisions, thus:<P class="in15">(a) I-X, from prehistoric times till the Captivity, in other words, the period related in the Old Testament substantially;<P class="in15">(b) XI, the age of Cyrus;<P class="in15">(c) XII-XIV, the beginnings of the Hellenistic period, from Alexander the Great, including the Maccabean revolt, till the accession of Herod the Great;<P class="in15">(d) XV-XVII, the reign of Herod;<P class="in15">(e) XVIII-XX, from Herod\'s death till the War of 66.<P>While it cannot be called an apology for the Jews, this work betrays the author\'s consciousness of the disfavor with which his people were viewed throughout the Roman Empire. Josephus does what he can to disabuse the Greek-Roman educated classes, although he shows curious obliquity to the grandeur of Hebrew religion. All in all, the work is disappointing; but it contains many details and sidelights of first importance to investigators.<P>(3) The treatise called, since Jerome, Against Apion, is Josephus\' most inspiring performance. The older title, Concerning the High Antiquity of the Jews, tells us what it contains—a defense of Hebrew religion against the libels of heathendom. It is in two books. The vituperation with which Josephus visits Apion is unimportant in comparison with the defense of Mosaic religion and the criticism of paganism. Here the author\'s character is seen at its best; the air of Worldly Wiseman has been dropped, and he approaches enthusiasm.<P>(4) His last work is the Vita or Autobiography, a misleading title. It is an echo of old days in Galilee, directed against the traductions of an associate, Justus of Tiberias. We have Josephus at his worst here. He so colors the narrative as to convey a totally wrong impression of the part he played during the great crisis. In extenuation, it may be said that his relations with the imperial court rendered it difficult, perhaps impossible, for him to pursue another course.<P>LITERATURE.<P>W.D. Morrison, The Jews under Roman Rule (London, 1890); E. Schurer, History of the Jewish People in the Time of Jesus Christ, Div. I, Vol. I (Edinburgh, 1890); A. Hausrath, History of New Testament Times, IV, div VII, chapter ii (London, 1895); H. Graetz, History of the Jews from the Earliest Times to the Present Day, II, chapter x (London, 1891); article "Josephus" in Jewish Encyclopedia, Translations by Whiston (many editions), and of The War of the Jews, by Traill and Taylor (London, 1862).``190';
isbe[5156]='Joses`jo\'-sez, jo\'-zez (Ioses):<p>(1) One of the brethren of Jesus (<a onClick="return mV(\'Mar\',6,3);">Mr 6:3</a>; in <a onClick="return mV(\'Mat\',13,55);">Mt 13:55</a> the Greek is "Joseph," and the Revised Version (British and American) so renders).<P>(2) A son of Mary, perhaps identical with (1) (<a onClick="return mV(\'Mat\',27,56);">Mt 27:56</a>; <a onClick="return mV(\'Mar\',15,40,47);">Mr 15:40,47</a>).<P>See <a href="./study/isbe/search.html?string=BRETHREN+OF+THE+LORD">BRETHREN OF THE LORD</a>.<P>(3) A name of Barnabas (<a onClick="return mV(\'Act\',4,36);">Ac 4:36</a> the King James Version, where again Greek and the Revised Version (British and American) have "Joseph").`<a href="./study/isbe/search.html?string=BARNABAS">BARNABAS</a>`1';
isbe[5157]='Joshah`jo\'-sha (yoshah, "Yahweh\'s gift"): A descendant of Simeon, chief in his family (<a onClick="return mV(\'1Ch\',4,34,38);">1Ch 4:34,38</a>).``1';
isbe[5158]='Joshaphat`josh\'-a-fat (yoshaphat, "Yahweh has judged"; compare <a href="./study/isbe/search.html?string=JEHOSHAPHAT">JEHOSHAPHAT</a>):<P>(1) One of David\'s mighty men (<a onClick="return mV(\'1Ch\',11,43);">1Ch 11:43</a>), a "Mithnite," but not included in the list of <a onClick="return mV(\'2Sa\',23,1);">2Sa 23</a>.<P>(2) A priest and trumpeter of David\'s time (<a onClick="return mV(\'1Ch\',15,24);">1Ch 15:24</a>), the King James Version "Jehoshaphat."``1';
isbe[5159]='Joshaviah`josh-a-vi\'-a (yoshawyah, allied form to <a href="./study/isbe/search.html?string=JOSHAH">JOSHAH</a> (which see)): Son of Elnaam, one of the band of braves who served David (<a onClick="return mV(\'1Ch\',11,46);">1Ch 11:46</a>), omitted from the list of <a onClick="return mV(\'2Sa\',23,\'1-\');">2Sa 23</a>, which is less complete and differs in detail.``1';
isbe[5160]='Joshbekashah`josh-be-ka\'-sha, josh-be-kash\'-a (yoshbeqashah, "son" of Heman; <a onClick="return mV(\'1Ch\',25,4,24);">1Ch 25:4,24</a>): The last 8 or 9 names in per 4 are taken by commentators to be not names but the words of a prayer. See OTJ C2, 143, note; Curtis, Chron, 278, 280; SBOT.``1';
isbe[5161]='Josheb-Basshebeth`jo-sheb-ba-she\'-beth (yoshebh ba-shebheth): This proper name in the Revised Version (British and American) takes the place of the translation "that sat in the seat" in the King James Version (<a onClick="return mV(\'2Sa\',23,8);">2Sa 23:8</a>). The phrase so rendered is meaningless. The text has evidently suffered corruption. There can be no doubt that a proper name is intended. This, according to the parallel passage in <a onClick="return mV(\'1Ch\',11,11);">1Ch 11:11</a>, should be Jashobeam. Some scholars think that this also is a corruption, and by a process of emendation arrive at "Eshbaal" as the correct name (Driver, Hebrew Text of S; SBOT, at the place).``1';
isbe[5162]='Joshibiah`josh-i-bi\'-a (yoshibhyah, "Yahweh sets," or "causes to dwell"; the King James Version Josibiah): A Simeonite (<a onClick="return mV(\'1Ch\',4,35);">1Ch 4:35</a>).``1';
isbe[5163]='Joshua (1)`josh\'-u-a<P>(a) yehoshua\',<P>(b) yehoshua\', "Yahweh is deliverance" or "opulence"; compare <A href="./study/isbe/search.html?string=JESHUA;+JESHUAH">JESHUA</a>; Iesous:<P>(1) Joshua the son of Nun; the name has the Hebrew form (a) above in <a onClick="return mV(\'Deu\',3,21);">De 3:21</a>; <a onClick="return mV(\'Jdg\',2,7);">Jud 2:7</a>; elsewhere the form (b), except in <a onClick="return mV(\'Neh\',8,17);">Ne 8:17</a>, where it is of the form yeshua\' (See <A href="./study/isbe/search.html?string=JESHUA">JESHUA</a>); compare also <a onClick="return mV(\'Num\',13,8,16);">Nu 13:8,16</a>; <a onClick="return mV(\'Deu\',32,44);">De 32:44</a>. See following article [<A href="./study/isbe/search.html?string=JOSHUA+(2)">Joshua (2)</a>].<P>(2) In <a onClick="return mV(\'1Sa\',6,14,18);">1Sa 6:14,18</a> (form (b)), the Bethshemite in whose field stood the kine that brought the ark from the Philistines.<P>(3) In <a onClick="return mV(\'2Ki\',23,8);">2Ki 23:8</a> (form (b)), governor of Jerusalem in the time of Josiah.<P>(4) The high priest at Jerusalem after the return. See separate article [<A href="./study/isbe/search.html?string=JOSHUA+(3)">Joshua (3)</a>].``78';
isbe[5164]='Joshua (2)`<b>I. FORM AND SIGNIFICANCE OF NAME</b><P><b>II. HISTORY OF THE LIFE OF JOSHUA</b><P class="in15">1. First Appearance<P class="in15">2. The Minister of Moses<P class="in15">3. One of the Spies<P class="in15">4. The Head of the People<P class="in30">(1) His First Act—Sending of the Spies<P class="in30">(2) Crossing of the Jordan<P class="in30">(3) Capture of Jericho<P class="in30">(4) Conquest of Ai and Bethel<P class="in30">(5) Reading of the Law on Mt. Ebal<P class="in30">(6) The Gibeonites<P class="in30">(7) Conquest of the South<P class="in30">(8) Northern Conquests<P class="in30">(9) Allotment of Territory<P class="in30">(10) Cities of Refuge<P class="in30">(11) Final Address and Death<P><b>III. SOURCES OF HISTORY</b><P><b>IV. CHARACTER AND WORK OF JOSHUA</b><hr /><P>I. Form and Significance of Name.<P>The name Joshua, a contracted form of Jehoshua (yehoshua\'), which also appears in the form Jeshua (yeshua\', <a onClick="return mV(\'Neh\',8,17);">Ne 8:17</a>), signifies "Yahweh is deliverance" or "salvation," and is formed on the analogy of many Israelite names, as Jehoiakim (yehoyaqim), "Yahweh exalteth," Jehohanan (yehochanan), "Yahweh is gracious," Elishua or Elisha (\'elishua\', elisha\'), "God is deliverance," Elizur (\'elitsur), "God is a rock," etc. In the narrative of the mission of the spies in <a onClick="return mV(\'Num\',13,\'1-\');">Nu 13</a>, the name is given as Hoshea (hoshea\', <a onClick="return mV(\'Num\',13,8,16);">13:8,16</a>; compare <a onClick="return mV(\'Deu\',32,44);">De 32:44</a>), which is changed by Moses to Joshua (<a onClick="return mV(\'Num\',13,16);">Nu 13:16</a>). In the passage in Deuteronomy, however, the earlier form of the name is regarded by Dr. Driver (Commentary in the place cited.) as an erroneous reading.<P>The Greek form of the name is Jesus (Iesous, <a onClick="return mV(\'Act\',7,45);">Ac 7:45</a>; <a onClick="return mV(\'Hbr\',4,8);">Heb 4:8</a>, the Revised Version (British and American) "Joshua," but the King James Version "Jesus" in both passages), and this form appears even in the passages cited above from Nehemiah and Deuteronomy. In <a onClick="return mV(\'Num\',13,8,16);">Nu 13:8,16</a>, however, Septuagint has Hause. The name occurs in later Jewish history, e.g. as that of the owner of the field in which the ark rested after its return from the land of the Philistines (<a onClick="return mV(\'1Sa\',6,14,18);">1Sa 6:14,18</a>), and appears to have become especially frequent after the exile (<a onClick="return mV(\'Ezr\',2,40);">Ezr 2:40</a>; <a onClick="return mV(\'Zec\',3,1);">Zec 3:1ab</a>, etc.). It is also found (Jeshua) with a local signification as the name of one of the "villages" in Southern Judea, where the repatriated Jews dwelt after their return from Babylon (<a onClick="return mV(\'Neh\',11,26);">Ne 11:26</a>).<P>II. History of the Life of Joshua.<P>The narrative of the life of Joshua, the son of Nun, is naturally divided into two parts, in which he held entirely different positions with regard to the people of Israel, and discharged different duties. In the earlier period he is the servant and minister of Moses, loyal to his leader, and one of his most trusted and valiant captains. After the death of Moses he himself succeeds to the leadership of the Israelite host, and conducts them to a settlement in the Promised Land. The service of the earlier years of his life is a preparation and equipment for the office and responsibility that devolved upon him in the later period.<P>1. First Appearance:<P>The first appearance of Joshua in the history is at Rephidim, on the way from the wilderness of Sin to Horeb. Neither the exact site of Rephidim nor the meaning of the name can be determined; the Israelites, however, apparently came to Rephidim before they approached the rich oasis of Feiran, for at the former place "there was no water for the people to drink" (<a onClick="return mV(\'Exd\',17,\'1-\');">Ex 17:1</a>). The fact that the host encamped there seems to assume the existence of wells; either, therefore, these were found to be dry, or they failed before the wants of the great host were satisfied. The Amalekites, wandering desert tribes, claimed the ownership of the wells, and, resenting the Israelite intrusion, swooped down upon them to drive them away and to enrich themselves with the spoil of their possessions. Under the command of Joshua, the Israelites won a complete victory in a battle that seems to have been prolonged until sunset; the fortunes of the battle varying with the uplifting or falling of Moses\' hands, which were accordingly supported by Aaron and Hur throughout the day (<a onClick="return mV(\'Exd\',17,11);">Ex 17:11</a>). A curse and sentence of extermination pronounced against Amalek were formally written down and communicated to Joshua, apparently that, as the future leader of Israel, he might have it in charge to provide for their fulfillment.<P>It is evident also that at this period Joshua was no young and untried warrior. Although no indication of his previous history is given, his name is introduced into the narrative as of a man well known, who is sufficiently in the confidence of Moses to be given the chief command in the first conflict in which the Israelites had been engaged since leaving Egypt. The result justified the choice. And if, during the march, he had held the position of military commander and organizer under Moses, as the narrative seems to imply, to him was due in the first instance the remarkable change, by which within the brief space of a month the undisciplined crowd of serfs who had fled from Egypt became a force sufficiently resolute and compact to repel the onset of the Amalekite hordes.<P>2. The Minister of Moses:<P>In all the arrangements for the erection and service of the tabernacle, Joshua the warrior naturally has no place. He is briefly named (<a onClick="return mV(\'Exd\',24,13);">Ex 24:13</a>) as the minister of Moses, accompanying him apparently to the foot of the mount of God, but remaining behind with the elders and Aaron and Hur, when Moses commenced the ascent. A similar brief mention is in <a onClick="return mV(\'Exd\',32,17);">Ex 32:17</a>, where he has rejoined Moses on the return of the latter from the mount with the two tables of the testimony, and is unaware of the outbreak of the people and their idolatrous worship of the molten calf in the camp; compare <a onClick="return mV(\'Exd\',33,11);">33:11</A>, where again he is found in the closest attendance upon his leader and chief. No further reference is made to Joshua during the stay of the Israelites at Sinai, or their subsequent journeyings, until they found themselves at Kadesh-barnea on the southern border of the Promised Land (<a onClick="return mV(\'Num\',13,\'1-\');">Nu 13</a>). His name is once mentioned, however, in an earlier chapter of the same book (<a onClick="return mV(\'Num\',11,28);">Nu 11:28</a>), when the tidings are brought to Moses that two men in the camp of Israel, Eldad and Medad, had been inspired to prophesy. There he is described in harmony with the previous statements of his position, as Moses\' minister from his youth. Jealous of his leader\'s prerogative and honor, he would have the irregular prophesying stopped, but is himself checked by Moses, who rejoices that the, spirit of God should rest thus upon any of the Lord\'s people.<P>3. One of the Spies:<P>Of the 12 men, one from each tribe, sent forward by Moses from Kadesh to ascertain the character of the people and land before him, two only, Hoshea the Ephraimite, whose name is significantly changed to Joshua (<a onClick="return mV(\'Num\',13,8,16);">Nu 13:8,16</a>), and Caleb the Judahite, bring back a report encouraging the Israelites to proceed. The account of the mission of the spies is repeated substantially in <a onClick="return mV(\'Deu\',1,\'22-46\');">De 1:22-46</a>. There, however, the suggestion that spies should be commissioned to examine and report upon the land comes in the first instance from the people themselves. In the record of Numbers they are chosen and sent by Moses under Divine direction (<a onClick="return mV(\'Num\',13,1);">13:1</a>f). The two representations are not incompatible, still less contradictory. The former describes in an altogether natural manner the human initiative, probable enough in the circumstances in which the Israelites found themselves; the latter is the Divine control and direction, behind and above the affairs of men. The instructions given to the spies (<a onClick="return mV(\'Num\',13,17);">13:17</a>ff) evidently contemplated a hasty survey of the entire region of the Negeb or southern borderland of Palestine up to and including the hill country of Judea; the time allowed, 40 days (<a onClick="return mV(\'Num\',13,25);">13:25</a>), was too brief to accomplish more, hardly long enough for this purpose alone. They were, moreover, not only to ascertain the character of the towns and their inhabitants, the quality and products of the soil, but to bring back with them specimens of the fruits (<a onClick="return mV(\'Num\',13,20);">13:20</a>). An indication of the season of the year is given in the added clause that "the time was the time of first-ripe grapes." The usual months of the vintage are September and October (compare <a onClick="return mV(\'Lev\',23,39);">Le 23:39</a>); in the warm and sheltered valleys, however, in the neighborhood of Hebron, grapes may sometimes be gathered in August or even as early as July. The valley from which the fruits, grapes, figs and pomegranates were brought was known as the valley of Eshcol, or the "cluster" (<a onClick="return mV(\'Num\',13,23);">Nu 13:23</a>f; <a onClick="return mV(\'Num\',32,9);">32:9</a>; <a onClick="return mV(\'Deu\',1,24);">De 1:24</a>).<P>No hesitating or doubtful account is given by all the spies of the fertility and attractiveness of the country; but in view of the strength of its cities and inhabitants only Joshua and Caleb are confident of the ability of the Israelites to take possession of it. Their reports and exhortations, however, are overborne by the timidity and dissuasion of the others, who so entirely alarm the people that they refuse to essay the conquest of the land, desiring to return into Egypt (<a onClick="return mV(\'Num\',14,3);">Nu 14:3</a>f), and attempt to stone Joshua and Caleb (<a onClick="return mV(\'Num\',14,10);">Nu 14:10</a>). These two alone, therefore, were exempted from the sentence of exclusion from the Promised Land (<a onClick="return mV(\'Num\',14,24,30,38);">Nu 14:24,30,38</a>; <a onClick="return mV(\'Num\',26,65);">26:65</a>; <a onClick="return mV(\'Num\',32,12);">32:12</a>; <a onClick="return mV(\'Deu\',1,25);">De 1:25</a>). The remainder of the spies perished at once by a special visitation (<a onClick="return mV(\'Num\',14,36);">Nu 14:36</a>); and the people were condemned to a 40-year exile in the wilderness, a year for each day that the spies had been in Palestine, until all the men of that generation "from twenty years old and upward" were dead (<a onClick="return mV(\'Num\',14,29);">Nu 14:29</a>; <a onClick="return mV(\'Num\',26,64);">26:64</a>f; <a onClick="return mV(\'Num\',32,11);">32:11</a>). An abortive attempt was made to invade the land in defiance of the prohibition of Yahweh, and ended in failure and disastrous defeat (<a onClick="return mV(\'Num\',32,40);">Nu 32:40</a>ff; <a onClick="return mV(\'Deu\',1,41);">De 1:41</a>ff; compare <a onClick="return mV(\'Deu\',21,1-3);">21:1-3</a>).<P>Upon the events of the next 38 or 40 years in the life of Israel an almost unbroken silence falls. The wanderers in the wilderness have no history. Some few events, however, that are recorded without note of time, the rebellion of Korah, Dathan and Abiram, and the breaking out of the plague because of the people\'s murmuring, and probably others (<a onClick="return mV(\'Num\',15,\'32-36\');">Nu 15:32-36</a>; <a onClick="return mV(\'Num\',16,\'1-\');">16</a>f), appear to belong to this period. In none of them does Joshua take an active part, nor is his name mentioned in connection with the campaigns against Sihon and Og on the east of the Jordan. When the census of the people is taken in the plains of Moab opposite Jericho, Joshua and Caleb with Moses himself are found to be the only survivors of the host that 40 years previously came out of Egypt (<a onClick="return mV(\'Num\',26,63);">Nu 26:63</a>). As the time of the death of the great leader and lawgiver drew near, he was commissioned formally to appoint Joshua as his successor and to hand over to him and to Eleazar the priest the duty of finally apportioning the conquered territory among the several tribes (<a onClick="return mV(\'Num\',27,18);">Nu 27:18</a>ff; <a onClick="return mV(\'Num\',32,28);">32:28</a>; <a onClick="return mV(\'Num\',34,17);">34:17</a>; compare <a onClick="return mV(\'Deu\',1,38);">De 1:38</a>; <a onClick="return mV(\'Deu\',3,28);">3:28</a>; <a onClick="return mV(\'Deu\',31,3,7,23);">31:3,7,23</a>; <a onClick="return mV(\'Deu\',34,9);">34:9</a>). Some of these passages anticipate the direct Divine commission and encouragement recorded in Joshua (<a onClick="return mV(\'Jos\',1,1,5);">1:1,5</a>ff) and given to him after the death of Moses.<P>4. The Head of the People:<P>The history of Joshua in his new capacity as supreme head and leader of the people in several instances recapitulates as it were the history of his greater forerunner. It was not Head unnatural that it should be so; and the similarity of recorded events affords no real ground for doubt with regard to the reliability of the tradition concerned. The position in which Israel now found itself on the east of the Jordan was in some respects not unlike that which confronted Moses at Kadesh-barnea or before the crossing of the Red Sea. Joshua, however, was faced with a problem much less difficult, and in the war-tried and disciplined host at his command he possessed an instrument immensely more suitable and powerful for carrying out his purpose.<P>(1) His First Act—Sending of the Spies.<P>His first act was to send spies from Shittim to ascertain the character of the country immediately opposite on the west of the Jordan, and especially the position and strength of Jericho, the frontier and fortified city which first stands in the way of an invader from the East who proposes to cross the river by the fords near its mouth (<a onClick="return mV(\'Jos\',2,2);">Jos 2:2</a>). In Jericho the spies owed their lives to the quick inventiveness of Rahab (compare <a onClick="return mV(\'Hbr\',11,31);">Heb 11:31</a>), who concealed them on the roof of her house from the emissaries of the king; and returning to Joshua, they reported the prospects of an easy victory and conquest (<a onClick="return mV(\'Jos\',2,23);">Jos 2:23</a>f).<P>There were doubtless special reasons which induced Joshua to essay the crossing of the Jordan at the lower fords opposite Jericho. Higher up the river a probably easier crossing-place led directly into Central Palestine, a district in which apparently his advance would not have been obstructed by fortified cities such as confronted him farther south; which therefore would seem to offer the advantages of an open and ready entrance into the heart of the country. His decision was probably influenced by a desire to possess himself of a fortified base at Jericho and in the neighboring cities. The favorable report of the spies also proved that there would be no great difficulty in carrying out this plan.<P>(2) Crossing of the Jordan.<P>The actual crossing of the river is narrated in <a onClick="return mV(\'Jos\',3,\'1-\');">Joshua 3</a>; <a onClick="return mV(\'Jos\',4,\'1-\');">4</a>. The city of Jericho was built in a plain from 12 to 14 miles wide formed by the recession of the hills that border the valley of the Jordan from the Sea of Galilee to the Dead Sea, and stood at the mouth of the valley of Achor (<a onClick="return mV(\'Jos\',7,24,16);">7:24,26</a>; <a onClick="return mV(\'Jos\',15,7);">15:7</a>). The modern village of Eriha is built at a short distance southeast of the ancient site, and Gilgal lay half-way to the river. At the latter place the fixed camp was established after the taking of Jericho, and Gilgal formed for some considerable time the base of operations, where the women and children remained in safety while the men were absent on their warlike expeditions. There also the tabernacle was erected, as the symbol and center of national life, and there apparently it remained until the time came for the removal to Shiloh (<a onClick="return mV(\'Jos\',18,1);">18:1</a>).<P>Within the plain the stream has excavated a tortuous bed to a depth of 200 ft. below the surface, varying from an eighth of a mile to a mile in breadth. In ordinary seasons the waters are confined to a small portion of the channel, which is then crossed opposite Jericho by two fords where the depth does not exceed 2 or 3 ft. When the river is low it may be crossed elsewhere. In times of flood, however, the water rises and fills the entire channel from bank to bank, so that the fords become impracticable. It is expressly stated that it was at such a time of flood that the Israelites approached the river, at the "time of harvest," or in the early spring (<a onClick="return mV(\'Jos\',3,15);">Jos 3:15</a>). The priests were directed to carry the ark to the brink of the river, the waters of which, as soon as their feet touched them, would be cut off, and a dry passage afforded. The narrative therefore is not to be understood as though it indicated that a wall of water stood on the right and left of the people as they crossed; the entire breadth of the river bed was exposed by the failure of the waters from above.<P>See <a href="./study/isbe/search.html?string=JORDAN">JORDAN</a>.<P>An interesting parallel to the drying up of the Jordan before Joshua is recorded by an Arabic historian of the Middle Ages, who writes to explain a natural but extraordinary occurrence, without any thought of the miraculous or any apparent knowledge of the passage of the Israelites. During the years 1266-67 AD, a Mohammedan sultan named Beybars was engaged in building a bridge over the Jordan near Damieh, a place which some have identified with the city Adam (<a onClick="return mV(\'Jos\',3,16);">Jos 3:16</a>); but the force of the waters repeatedly carried away and destroyed his work. On one night, however, in December of the latter year, the river ceased entirely to flow. The opportunity was seized, and an army of workmen so strengthened the bridge that it resisted the flood which came down upon it the next day, and stood firm. It was found that at some distance up the river, where the valley was narrow, the banks had been undermined by the running water and had fallen in, thus completely damming back the stream. It seems not improbable that it was by agency of this character that a passage was secured for the Israelites; even as 40 years earlier a "strong east wind" had been employed to drive back the waters of the Red Sea before Moses.<P>At the command of Joshua, under Divine direction, the safe crossing of the Jordan was commemorated by the erection at Gilgal of 12 stones (<a onClick="return mV(\'Jos\',4,3,9,20);">4:3-9,20</A>ff), one for each of the tribes of Israel, taken from the bed of the river. In <a onClick="return mV(\'Jos\',4,9);">Jos 4:9</a> it is stated that 12 stones were set up in the midst of the river. The statement is probably a misunderstanding, and a mere confusion of the tradition. It is not likely that there would be a double commemoration, or an erection of stones in a place where they would never be seen. At Gilgal also the supply of manna ceased, when the natural resources of the country became available (<a onClick="return mV(\'Jos\',5,12);">5:12</a>). The date of the passage is given as the 10th day of the 1st month (<a onClick="return mV(\'Jos\',4,19);">4:19</A>); and on the 14th day the Passover was kept at Gilgal in the plains of Jericho (<a onClick="return mV(\'Jos\',5,10);">5:10</a>). For the 2nd time, also, at the crisis of the first entrance into the land, Joshua was encouraged for his work by a vision and Divine promise of assistance and direction (<a onClick="return mV(\'Jos\',5,13,14,15);">5:13-15</a>).<P>(3) Capture of Jericho.<P>The narrative that follows, of the taking of Jericho, illustrates, as would naturally be expected in the case of a city so situated the effeminate and unwarlike character of its inhabitants. There was apparently little or no fighting, while for a whole week Joshua with priests and people paraded before the walls. A brief reference (<a onClick="return mV(\'Jos\',6,1);">6:1</a>) seems to indicate that the citizens were quickly driven to take refuge behind their fortifications. Twice seven times the city was compassed, with the ark of the covenant borne in solemn procession, and at the 7th circuit on the 7th day, while the people shouted, the wall of the city fell "in its place" (<a onClick="return mV(\'Jos\',6,20);">6:20</a> margin), and Jericho was taken by assault. Only Rahab and her household were spared. All the treasure was devoted to the service of the Lord, but the city itself was burnt, and a solemn curse pronounced upon the site and upon the man who should venture to rebuild its walls (<a onClick="return mV(\'Jos\',6,26);">6:26</a>). The curse was braved, whether deliberately or not, by a citizen of Bethel in the time of King Ahab; and the disasters foretold fell upon him in the loss of his children (<a onClick="return mV(\'1Ki\',16,34);">1Ki 16:34</a>). Thenceforward Jericho appears to have been continuously inhabited. There was a settlement of the sons of the prophets there in Elisha\'s day (<a onClick="return mV(\'2Ki\',2,5,15);">2Ki 2:5,15</a>). The natural fertility of the site won for it the name of the city of palm trees (<a onClick="return mV(\'Deu\',34,3);">De 34:3</a>; <a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a>; <a onClick="return mV(\'Jdg\',3,13);">3:13</a>).<P>From the plains of Jericho two valleys lead up into the central hill country in directions northwest and southwest respectively. These form the two entrances or passes, by which the higher land is approached from the east. Along these lines, therefore, the invasion of the land was planned and carried out. The main advance under Joshua himself took place by the northernmost of the valleys, while the immediate southern invasion was entrusted to Caleb and the two tribes of Judah and Benjamin, the supreme control remaining always in the hands of Joshua (compare <a onClick="return mV(\'Jos\',14,\'1-\');">Jos 14</a>; <a onClick="return mV(\'Jos\',15,\'1-\');">15</a>; <a onClick="return mV(\'Jdg\',1,\'1-\');">Jud 1</a>). This seems on the whole to be the better way of explaining the narratives in general, which in detail present many difficulties.<P>(4) Conquest of Ai and Bethel.<P>At the head of the northern pass stood the city of Luz or Bethel (<a onClick="return mV(\'Gen\',28,19);">Ge 28:19</a>; <a onClick="return mV(\'Jos\',18,13);">Jos 18:13</a>; <a onClick="return mV(\'Jud\',1,23);">Jdg 1:23</a>). Ai lay close at hand, and was encountered by the invaders before reaching Bethel; its exact site, however, is undetermined. The two towns were in close alliance (compare <a onClick="return mV(\'Jos\',8,17);">Jos 8:17</a>), and the defeat and destruction of the one was quickly followed by the similar fate that overtook the other. Before Ai, the advance guard of the Israelites, a small party detached on the advice of the spies sent forward by Joshua from Jericho, suffered defeat and were driven back in confusion (<a onClick="return mV(\'Jos\',7,2);">7:2</a>ff). The disaster was due to the failure to obey the command to "devote" the whole spoil of Jericho, and to theft by one of the people of treasure which belonged rightfully to Yahweh (<a onClick="return mV(\'J
