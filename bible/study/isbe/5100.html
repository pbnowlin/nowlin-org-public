isbe[5170]='Josiphiah`jos-i-fi\'-a (yociphyah, "Yah adds"): Found in <a onClick="return mV(\'Ezr\',8,10);">Ezr 8:10</a>, where Massoretic Text is "and of the sons of...Shelomith the son of Josiphiah." With the help of Septuagint A and 1Esdras 8:36, the name "Bani" (which is the same in the unpointed text as "the sons of" and was omitted through haplography) can be supplied above before "Shelomith." Josiphia is thus the father of Shelomith, one of Ezra\'s companions. 1Esdras 8:36 has "Josaphias."``1';
isbe[5171]='Jot`jot: "Jot" (Revised Version, later editions of the King James Version) is a corruption of iote (early editions of the King James Version, Geneva, Rheims, Bishops\'—pronounced i-o\'te), an English transliteration of iota, the 9th letter of the Greek alphabet (<a onClick="return mV(\'Mat\',5,18);">Mt 5:18</a> parallel). "Iota," in turn, is the nearest Greek equivalent for the Hebrew yodh ("y"), the smallest letter of the Hebrew alphabet, in New Testament times being little larger than an English accent (\'). The <a href="./study/isbe/search.html?string=TITTLE">tittle</a> (which see) is the smallest part of a letter (not part of a y, however). Consequently, thinking of the law as written out, the sense of <a onClick="return mV(\'Mat\',5,17);">Mt 5:17</a>, is: "From this code, so written, not the smallest letter nor part of a letter—not an \'i\' nor the crossing of a \'t\'—shall be erased until all things come to pass." (For the meaning, see <a href="./study/isbe/search.html?string=LAW">LAW</a>.) The reference is to the synagogue rolls, which were written in Hebrew, so that the passage has no bearing on the language used by Christ. For the form of the "jot," compare the tables in HDB, article "Alphabet," more fully in Chwolson, Corp. Inscr. Hebrew. (1882).`<a href="./study/isbe/search.html?string=TITTLE">TITTLE</a>`48';
isbe[5172]='Jotapata`jo-tap\'-a-ta (BJ, III, iii, 7).`<a href="./study/isbe/search.html?string=JOTBATHAH">JOTBATHAH</a>`1';
isbe[5173]='Jotbah`jot\'-ba (yotbah, "pleasantness"): The home of Meshullemeth, the mother of King Amon, daughter of Haruz (<a onClick="return mV(\'2Ki\',21,19);">2Ki 21:19</a>). It may be the same as <a href="./study/isbe/search.html?string=JOTBATHAH">JOTBATHAH</a> (which see).``1';
isbe[5174]='Jotbathah`jot\'-ba-tha (yotbathah): A desert camp of the Israelites between Hor-hagidgad and Abronah (<a onClick="return mV(\'Num\',33,33,34);">Nu 33:33,34</a>; <a onClick="return mV(\'Deu\',10,7);">De 10:7</a>). It was "a land of brooks of water" (<a onClick="return mV(\'Deu\',10,7);">De 10:7</a>). Site is unknown.`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[5175]='Jotham`o\'-tham (yotham, "Yahweh is perfect"; Ioatham):<P>(1) The youngest son of Gideon-Jerubbaal, the sole survivor of the massacre of his seventy brothers by Abimelech (<a onClick="return mV(\'Jdg\',9,5);">Jud 9:5</a>), and (by <a onClick="return mV(\'Jdg\',8,22);">Jud 8:22</a>) the legitimate ruler of Shechem after their death. Recognizing, however, that he is powerless to assert his claim, Jotham delivers from the summit of Gerizim his famous fable (<a onClick="return mV(\'Jdg\',9,\'7-15\');">Jud 9:7-15</a>), applies it to the situation in hand, and then flees for his life to Beer (<a onClick="return mV(\'Jdg\',9,21);">Jud 9:21</a>). Nothing more is told of him, but the downfall of Abimelech is referred in part to his "curse" (<a onClick="return mV(\'Jdg\',9,57);">Jud 9:57</a>). The fable tells of the kingship of the trees which, after having been declined by all useful plants, was finally offered to the bramble. The latter, inflated by its unexpected dignity, pompously offers its "shade\' to its faithful subjects, while threatening all traitors with punishment (brambles carry forest fires), quite in the manner of an oriental monarch on assuming the throne. Having thus parodied the relationship of the worthless Abimelech to the Shechemites, Jotham ironically wishes both parties joy of their bargain, which will end in destruction for all concerned. Otherwise the connection between the fable and its application is loose, for, while the fable depicts the kingship as refused by all properly qualified persons, in the application the Shechemites are upbraided for their treachery and their murder of the rightful heirs. In fact, the fable taken by itself would seem rather to be a protest against kings as a class (compare <a onClick="return mV(\'1Sa\',8,\'10-18\');">1Sa 8:10-18</a>; <a onClick="return mV(\'1Sa\',12,19);">12:19</a>, etc.); so it is possible that either the fable or its application has become expanded in transmission. Or an older fable may have been used for the sake of a single salient point, for nothing is more common than such an imperfect reapplication of fables, allegories and parables.<P>Burton Scott Easton<P>(2) Twelfth king of Judah, son of Uzziah and Jerusha, daughter of Zadok (<a onClick="return mV(\'2Ki\',15,\'32-38\');">2Ki 15:32-38</a>; <a onClick="return mV(\'2Ch\',27,\'1-9\');">2Ch 27:1-9</a>).<P>1. Accession and Regency:<P>Jotham was 25 years of age at the time of his father\'s attack of leprosy, and was at once called upon to take the administration of the kingdom (<a onClick="return mV(\'2Ki\',15,5);">2Ki 15:5</a>; <a onClick="return mV(\'2Ch\',26,21);">2Ch 26:21</a>). In doing this he not only judged the people of the land by presiding at the administration of justice, but also was over the household of the king, showing how complete was the isolation of his father. He was thus king in all but name, and is invariably spoken of as reigning in Jerusalem. His reign lasted for 16 years (<a onClick="return mV(\'2Ki\',15,33);">2Ki 15:33</a>; <a onClick="return mV(\'2Ch\',27,1);">2Ch 27:1</a>), 759-744 (others put later). While the father loved husbandry and had much cattle (<a onClick="return mV(\'2Ch\',26,10);">2Ch 26:10</a>)—external affairs with which he could occupy himself in his retirement—to the son fell the sterner duties and heavier responsibilities of the state.<P>2. The War with Ammon:<P>The relation between father and son is well brought out in the Chronicler\'s account of the Ammonite war. In <a onClick="return mV(\'2Ch\',26,8);">2Ch 26:8</a> we are told that "the Ammonites gave tribute (the King James Version "gifts") to Uzziah," such gifts being compulsory, and of the nature of tribute. In <a onClick="return mV(\'2Ch\',27,5);">2Ch 27:5</a> we are told that the actual conquest of Ammon was made by Jotham, and that for 3 successive years he compelled them to pay an annual subsidy of 100 talents of silver and 10,000 "cors" each of wheat and barley (the cor (Hebrew kor) was about 10 bushels). The campaign on the east of the Jordan was the only one in which Jotham took part, but as the state suffered no loss of territory during his regency, the external provinces must have been strongly held and well governed.<P>3. Jotham\'s Building Operations:<P>It is probable that before attempting to win any extension of territory, Jotham had spent some years in completing the unfinished building schemes in which his father was engaged at the time of his affliction. Like him, he became an enthusiastic builder (<a onClick="return mV(\'2Ch\',27,3,4);">2Ch 27:3,4</a>). He is recorded to have built towers, castles and cities, and specifically to have completed the Ophel wall in Jerusalem, which is still standing to the south of the Haram area. But the crowning architectural glory of his reign was the completion of the temple court by erecting, or setting up, "the upper gate of the house of Yahweh" (<a onClick="return mV(\'2Ch\',27,3);">2Ch 27:3</a>; <a onClick="return mV(\'2Ki\',15,35);">2Ki 15:35</a>). This particular gate was the entrance to, and exit from, the upper or new court of the temple, which had been begun so long ago as the time of Asa (compare the writer\'s Solomon\'s Temple, Part II, chapter viii). Its situation is perfectly known, as it bore the same name and place in the Herodian temple as in each of its predecessors. It stood facing the south, and was on higher ground than any other of the temple gates. Hence, its name. It gave entrance to that upper court of the temple, mentioned in <a onClick="return mV(\'Jer\',36,10);">Jer 36:10</a>, where it is spoken of as "the new gate of Yahweh\'s house." As Jeremiah began his ministry about a century after Jotham\'s death, Jeremiah\'s use of the name commemorates the fact that the gate was not built till long after the other parts of the structure.<P>4. The Syrian League:<P>During Jotham\'s regency, a formidable combination of the Northern Kingdom and the Syrian state, with Damascus as capital, began to show signs of hostility to Judah. For 4 years before Jotham\'s death, Pekah occupied the throne of Samaria. The Assyrian king, Tiglath-pileser III, was then pushing his arms westward, and a Syrian league was formed to oppose them. Jotham may have refused to join this league. The political situation at his death is thus described: "In those days Yahweh began to send against Judah Rezin the king of Syria, and Pekah the son of Remaliah" (<a onClick="return mV(\'2Ki\',15,37);">2Ki 15:37</a>).<P>5. Condition of Judah:<P>Jotham\'s character is represented in a moderately favorable light, it being put to his credit that he did not enter the temple (<a onClick="return mV(\'2Ch\',27,2);">2Ch 27:2</a>). The wisdom and vigor of his administration, and of his policy for the defense of the country, are recognized. It was owing to his completion of his father\'s plans for the protection of Jerusalem, and of the building of country fortresses, that Hezekiah, a few years afterward, was able to show so stout a resistance to Sennacherib. But within the state itself corruption and oppression were rife. The great prophets, Isaiah, Hosea and Micah, exercised their ministries in Jotham\'s days, and in their pages we have graphic picture of the moral condition of the time. Isaiah does not name Jotham, except in the title (<a onClick="return mV(\'Isa\',1,1);">Isa 1:1</a>; compare <a onClick="return mV(\'Isa\',7,1);">7:1</a>), but <a onClick="return mV(\'Isa\',1,\'1-\');">Isaiah 1-5</a> of his book were probably written in this reign. Hosea\'s writings go back to the last years of Jeroboam II, who died the year Jotham came to the throne. Micah\'s evidence is valuable, telling us that Omri had formulated and published rules for the cult of the Zidonian Baal, and that these "statutes" were kept by some of the citizens of Samaria, and, possibly, of Jerusalem (<a onClick="return mV(\'Mic\',6,16);">Mic 6:16</a>).<P>Jotham\'s name appears in the royal genealogical list of <a onClick="return mV(\'1Ch\',3,12);">1Ch 3:12</a>, and in the genealogy of Jesus (<a onClick="return mV(\'Mat\',1,9);">Mt 1:9</a>).<P>(3) A Calebite (<a onClick="return mV(\'1Ch\',2,47);">1Ch 2:47</a> the King James Version).``17';
isbe[5176]='Journey`jur\'-ni.`<a href="./study/isbe/search.html?string=DAY\'s+journey">DAY\'S JOURNEY</a>; <a href="./study/isbe/search.html?string=SABBATH+DAY\'s+journey">SABBATH DAY\'S JOURNEY</a>`1';
isbe[5177]='Joy`joi (simchah; chara):<P>1. Terms:<P>The idea of joy is expressed in the Old Testament by a wealth of synonymous terms that cannot easily be differentiated. The commonest is simchah (<a onClick="return mV(\'1Sa\',18,6);">1Sa 18:6</a>, etc.), variously translated in English Versions of the Bible "joy," "gladness," "mirth"; from sameah, properly "to be bright," "to shine" (<a onClick="return mV(\'Pro\',13,9);">Pr 13:9</a>, "The light of the righteous rejoiceth," literally, "is bright"), but generally used figuratively "to rejoice," "be glad" (<a onClick="return mV(\'Lev\',23,40);">Le 23:40</a> and very frequent).<P>Other nouns are masos and sason, both from sus, properly "to spring," "leap," hence, "exult," "rejoice"; rinnah, "shouting." "joy"; gil, from verb gil or gul, "to go in a circle," hence, "be excited" (dancing round for joy), "rejoice." In the New Testament, far the commonest are chara, "joy," chairo, "to rejoice" (compare charis, "grace"). But we have also agalliasis, which expresses "exuberant joy," "exultation" (not used in classical Greek, but often in the Septuagint; in the New Testament, <a onClick="return mV(\'Luk\',1,14,44);">Lu 1:14,44</a>; <a onClick="return mV(\'Act\',2,46);">Ac 2:46</a>; <a onClick="return mV(\'Jud\',1,24);">Jude 1:24</a>; <a onClick="return mV(\'Hbr\',1,9);">Heb 1:9</a>), and the corresponding verb agalliaoo (-aomai), "to exult," "rejoice exceedingly" (<a onClick="return mV(\'Mat\',5,12);">Mt 5:12</a>, etc.). In English Versions of the Bible we have sometimes "to joy" (now obsolete as a verb), used in an intransitive sense = "to rejoice" (<a onClick="return mV(\'Hab\',3,18);">Hab 3:18</a>; <a onClick="return mV(\'2Cr\',7,13);">2Co 7:13</a>, etc.).<P>2. In the Old Testament:<P>Besides joy in a general sense, as the response of the mind to any pleasurable event or state (<a onClick="return mV(\'1Ki\',1,40);">1Ki 1:40</a>; <a onClick="return mV(\'Est\',8,17);">Es 8:17</a>, etc.), joy as a religious emotion is very frequently referred to in the Old Testament. Religion is conceived of as touching the deepest springs of emotion, including the feeling of exultant gladness which often finds outward expression in such actions as leaping, shouting, and singing. Joy is repeatedly shown to be the natural outcome of fellowship with God. "In thy presence is fullness of joy; in thy right hand there are pleasures for evermore" (<a onClick="return mV(\'Psa\',16,11);">Ps 16:11</a>; compare <a onClick="return mV(\'Psa\',16,8,9);">16:8,9</a>). God is at once the source (<a onClick="return mV(\'Psa\',4,7);">Ps 4:7</a>; <a onClick="return mV(\'Psa\',51,12);">51:12</a>) and the object (<a onClick="return mV(\'Psa\',35,9);">Ps 35:9</a>; <a onClick="return mV(\'Isa\',29,19);">Isa 29:19</a>) of religious joy. The phrase "rejoice (be glad) in Yahweh" and similar expressions are of frequent occurrence (e.g. <a onClick="return mV(\'Psa\',97,12);">Ps 97:12</a>; <a onClick="return mV(\'Psa\',149,2);">149:2</a>; <a onClick="return mV(\'Isa\',61,10);">Isa 61:10</a>; <a onClick="return mV(\'Zec\',10,7);">Zec 10:7</a>). Many aspects of the Divine character call forth this emotion, such as His lovingkindness (<a onClick="return mV(\'Psa\',21,6,7);">Ps 21:6,7</a>; <a onClick="return mV(\'Psa\',31,7);">31:7</a>), His salvation (<a onClick="return mV(\'Psa\',21,1);">Ps 21:1</a>; <a onClick="return mV(\'Isa\',25,9);">Isa 25:9</a>; <a onClick="return mV(\'Hab\',3,18);">Hab 3:18</a>), His laws and statutes (<a onClick="return mV(\'Psa\',12,\'1-\');">Ps 12</a>; <a onClick="return mV(\'Psa\',119,\'1-\');">119</a> passim), His judgments (<a onClick="return mV(\'Psa\',48,11);">Ps 48:11</a>), His words of comfort in dark days (<a onClick="return mV(\'Jer\',15,15,16);">Jer 15:15,16</a>). The fundamental fact of the sovereignty of God, of the equity of the Divine government of the world, gives to the pious a joyous sense of security in life (<a onClick="return mV(\'Psa\',93,1);">Ps 93:1</a>f; <a onClick="return mV(\'Psa\',96,10);">96:10</a>; <a onClick="return mV(\'Psa\',97,1);">97:1</a>) which breaks forth into songs of praises in which even inanimate Nature is poetically called upon to join (<a onClick="return mV(\'Psa\',96,\'11-13\');">Ps 96:11-13</a>; <a onClick="return mV(\'Psa\',98,\'4-9\');">98:4-9</a>). In the case of those who held such views of God, it was natural that the service of God should elicit a joyous spirit ("I will offer in his tabernacle sacrifices of joy," <a onClick="return mV(\'Psa\',27,6);">Ps 27:6</a>; compare <a onClick="return mV(\'1Ch\',29,9);">1Ch 29:9</a>), a spirit which is abundantly manifest in the jubilant shouting with which religious festivities were celebrated, and the trumpet-sound which accompanied certain sacrifices (<a onClick="return mV(\'2Sa\',6,15);">2Sa 6:15</a>; <a onClick="return mV(\'Psa\',33,\'1-3\');">Ps 33:1-3</a>; <a onClick="return mV(\'Num\',10,10);">Nu 10:10</a>; <a onClick="return mV(\'2Ch\',29,27);">2Ch 29:27</a>), and especially in psalms of praise, thanksgiving and adoration (<a onClick="return mV(\'Psa\',47,\'1-\');">Psalms 47</a>; <a onClick="return mV(\'Psa\',81,\'1-\');">81</a>; <a onClick="return mV(\'Psa\',100,\'1-\');">100</a>, etc.). "Rejoice before Yahweh your God" is an oft-repeated phrase in Deuteronomy with reference to the sacrificial feast (e.g. <a onClick="return mV(\'Deu\',12,12);">12:12</a>). But joy is a Divine, as well as a human, emotion; for God Himself is represented in the Old Testament, not as a rigid, impassible Being, but as susceptible to pleasure and pain. God may be conceived of as "rejoicing in his works" (<a onClick="return mV(\'Psa\',104,31);">Ps 104:31</a>; compare <a onClick="return mV(\'Gen\',1,31);">Ge 1:31</a>), and over His people "for good" (<a onClick="return mV(\'Deu\',30,9);">De 30:9</a>). "He will rejoice over thee (Zion) with joy; he will rest in his love; he will joy over thee with singing" (<a onClick="return mV(\'Zep\',3,17);">Ze 3:17</a>). Such noble and vivid anthropomorphisms are a nearer approach to the truth than the abstract doctrine of the impassibility of God which, owing to Platonic influences, dominated theology of the early Christian centuries.<P>3. In the New Testament:<P>The element of joy in religion is still more prominent in the New Testament. It is the appropriate response of the believer to the "good tidings of great joy" which constitute the gospel (<a onClick="return mV(\'Luk\',2,10);">Lu 2:10</a>). In the four Gospels, especially Luke, this element is conspicuous. It is seen in the canticles of <a onClick="return mV(\'Luk\',1,\'1-\');">Lu 1</a> and <a onClick="return mV(\'Luk\',2,\'1-\');">2</a>. It is both exemplified in the life and character, and set forth in the teaching of Jesus. There are many intimations that, in spite of the profound elements of grief and tragedy in His life, His habitual demeanor was gladsome and joyous, certainly not gloomy or ascetic: such as, His description of Himself as bridegroom, in defense of His disciples for not fasting (<a onClick="return mV(\'Mar\',2,\'18-20\');">Mr 2:18-20</a>); the fact that He came "eating and drinking," giving occasion to the charge that He was "a gluttonous man and a winebibber" (<a onClick="return mV(\'Mat\',11,19);">Mt 11:19</a>); His "rejoicing in the Holy Spirit" (<a onClick="return mV(\'Luk\',10,21);">Lu 10:21</a>); the fact that His presence was found to be congenial at social festivities (<a onClick="return mV(\'Mar\',14,3);">Mr 14:3</a>; <a onClick="return mV(\'Luk\',14,1);">Lu 14:1</a>; <a onClick="return mV(\'Jhn\',12,1);">Joh 12:1</a>), and at the wedding in Cana (<a onClick="return mV(\'Jhn\',2,1);">Joh 2:1</a>); His mention of "my joy" (<a onClick="return mV(\'Jhn\',15,11);">Joh 15:11</a>; <a onClick="return mV(\'Jhn\',17,13);">17:13</a>). His teaching with reference to His followers harmonizes with this. The Christian virtues confer on those who attain them not only beatitude, a calm and composed state of felicity (<a onClick="return mV(\'Mat\',5,\'3-11\');">Mt 5:3-11</a>), but also a more exuberant state of joy, which is in sharp contrast to the "sad countenance" of the hypocrites (<a onClick="return mV(\'Mat\',6,16);">Mt 6:16</a>) ("Rejoice, and be exceeding glad", <a onClick="return mV(\'Mat\',5,12);">Mt 5:12</a>). This spirit is reflected in many of the parables. The discovery of the true treasure of life brings joy (<a onClick="return mV(\'Mat\',13,44);">Mt 13:44</a>). The three parables in <a onClick="return mV(\'Luk\',15,\'1-\');">Lu 15</a> reveal the joy of the Divine heart itself at the repentance of sinners (see especially <a onClick="return mV(\'Luk\',15,5,6,7,9,10,22,23,24,32);">15:5-7,9,10,22-24,32</a>). The parable of the Talents lays stress on the "joy of the Lord" which is the reward of faithfulness (<a onClick="return mV(\'Mat\',25,21,22);">Mt 25:21,23</a>). Jesus confers on His followers not only peace (<a onClick="return mV(\'Jhn\',14,27);">Joh 14:27</a>; <a onClick="return mV(\'Jhn\',16,33);">16:33</a>), but participation in His own fullness of joy (<a onClick="return mV(\'Jhn\',15,11);">Joh 15:11</a>; <a onClick="return mV(\'Jhn\',16,24);">16:24</a>; <a onClick="return mV(\'Jhn\',17,13);">17:13</a>), a joy which is permanent, in contrast to the sorrow which is transient (<a onClick="return mV(\'Jhn\',16,22);">Joh 16:22</a>). In the dark days of disappointment that succeeded the crucifixion, the joy of the disciples passed under a cloud, but at the resurrection (<a onClick="return mV(\'Luk\',24,41);">Lu 24:41</a>) and still more on the day of Pentecost it emerged into light, and afterward remained a marked characteristic of the early church (<a onClick="return mV(\'Act\',2,46);">Ac 2:46</a>f; <a onClick="return mV(\'Act\',8,39);">8:39</a>; <a onClick="return mV(\'Act\',13,52);">13:52</a>; <a onClick="return mV(\'Act\',15,3);">15:3</a>). Paul speaks of joy as one of the fruits of the spirit (<a onClick="return mV(\'Gal\',5,22);">Ga 5:22</a>) and of "joy in the Holy Spirit" as an essential mark of the kingdom of God (<a onClick="return mV(\'Rom\',14,17);">Ro 14:17</a>). This joy is associated with faith (<a onClick="return mV(\'Phl\',1,25);">Php 1:25</a>), hope (<a onClick="return mV(\'Rom\',5,2);">Ro 5:2</a>; <a onClick="return mV(\'Rom\',12,12);">12:12</a>), brotherly fellowship and sympathy (<a onClick="return mV(\'Rom\',12,15);">Ro 12:15</a>; <a onClick="return mV(\'2Cr\',7,13);">2Co 7:13</a>; <a onClick="return mV(\'Phl\',2,1);">Php 2:1</a>f). To rejoice in the Lord is enjoined as a Christian duty (<a onClick="return mV(\'Phl\',3,1);">Php 3:1</a>; <a onClick="return mV(\'Phl\',4,4);">4:4</a>; compare <a onClick="return mV(\'Phl\',2,17);">2:17</A>f; <a onClick="return mV(\'1Th\',5,16);">1Th 5:16</a>). In Christ, the Christian "rejoices with joy unspeakable and full of glory" (<a onClick="return mV(\'1Pe\',1,8);">1Pe 1:8</a>), in spite of his temporary afflictions (<a onClick="return mV(\'1Pe\',1,6);">1Pe 1:6</a>). Christian joy is no mere gaiety that knows no gloom, but is the result of the triumph of faith over adverse and trying circumstances, which, instead of hindering, actually enhance it (<a onClick="return mV(\'Act\',5,41);">Ac 5:41</a>; <a onClick="return mV(\'Rom\',5,3);">Ro 5:3</a>f; <a onClick="return mV(\'Jam\',1,2,12);">Jas 1:2,12</a>; <a onClick="return mV(\'Jam\',5,11);">5:11</a>; <a onClick="return mV(\'1Pe\',4,13);">1Pe 4:13</a>; compare <a onClick="return mV(\'Mat\',5,11,12);">Mt 5:11,12</a>). Even our Lord Himself "for the joy that was set before him endured the cross, despising shame" (<a onClick="return mV(\'Hbr\',12,2);">Heb 12:2</a>).``49';
isbe[5178]='Jozabad`joz\'-a-bad (yozabhadh, "Yahweh has bestowed"):<P>(1) A Gederathite, and one of David\'s recruits at Ziklag (<a onClick="return mV(\'1Ch\',12,4);">1Ch 12:4 (Hebrew 5)</a>). He is named with the Benjamites, but possibly he was a native of the town Gedara in Southern Judah. See Curtis, Chronicles, 196.<P>(2), (3) Two Manassite captains who joined David at Ziklag (<a onClick="return mV(\'1Ch\',12,20);">1Ch 12:20 (Hebrew 21)</a>).<P>(4) A Levite overseer in Hezekiah\'s time (<a onClick="return mV(\'2Ch\',31,13);">2Ch 31:13</a>); may be the ancestor of the chief of the priests in <a onClick="return mV(\'2Ch\',35,9);">2Ch 35:9</a> = "Joram" of 1Esdras 1:9.<P>(5) A Levite (<a onClick="return mV(\'Ezr\',8,33);">Ezr 8:33</a>), mentioned again probably in <a onClick="return mV(\'Ezr\',10,23);">Ezr 10:23</a>; <a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>; <a onClick="return mV(\'Neh\',11,16);">11:16</a>. The name in 1Esdras 8:63 (= <a onClick="return mV(\'Ezr\',8,33);">Ezr 8:33</a>) is "Josabdus" (the King James Version "Josabad").<P>(6) A priest who had married a foreign wife <a onClick="return mV(\'Ezr\',10,22);">Ezr 10:22</a>) = "Ocidelus" of 1Esdras 9:22.``1';
isbe[5179]='Jozabdus`jo-zab\'-dus (Iozabdos):<P>(1) Son of Jeshua the Levite (1Esdras 8:63), called "Jozabad" in <a onClick="return mV(\'Ezr\',8,33);">Ezr 8:33</a>.<P>(2) Son of Bebai (1Esdras 9:29), called "Zabbai" in <a onClick="return mV(\'Ezr\',10,28);">Ezr 10:28</a>.``1';
isbe[5180]='Jozacar`joz\'-a-kar, jo-za\'-kar (yozakhar, "Yahweh has remembered"; the King James Version Jozachar): Servant and murderer (with Jehozabad)of Joash, king of Judah (<a onClick="return mV(\'2Ki\',12,21);">2Ki 12:21 (Hebrew 22)</a>); called "Zabad" in <a onClick="return mV(\'2Ch\',24,26);">2Ch 24:26</a>. Many manuscripts have "Jozabad" in 2 Kings.``1';
isbe[5181]='Jozadak`joz\'-a-dak.`<a href="./study/isbe/search.html?string=JEHOZADAK">JEHOZADAK</a>`1';
isbe[5182]='Jubal`joo\'-bal (yubhal; for meaning see <a href="./study/isbe/search.html?string=JABAL">JABAL</a>): Son of Lamech by Adah, and inventor of musical instruments (<a onClick="return mV(\'Gen\',4,21);">Ge 4:21</a>).``1';
isbe[5183]='Jubilee Year`(shenath ha-yobhel; etos tes apheseos; annus jubilaeus, "year of jubilee" (<a onClick="return mV(\'Lev\',25,13);">Le 25:13</a>), or simply ha-yobhel, "the jubilee" (<a onClick="return mV(\'Lev\',25,28);">Le 25:28</a>; compare <a onClick="return mV(\'Num\',36,4);">Nu 36:4</a>), the King James Version and the English Revised Version Jubile): The Hebrew word yobhel stands for qeren ha-yobhel, meaning the horn of a ram. Now, such a horn can be made into a trumpet, and thus the word yobhel came to be used as a synonym of trumpet. According to <a onClick="return mV(\'Lev\',25,9);">Le 25:9</a> a loud trumpet should proclaim liberty throughout the country on the 10th day of the 7th month (the Day of Atonement), after the lapse of 7 sabbaths of years = 49 years. In this manner, every 50th year was to be announced as a jubilee year. All real property should automatically revert to its original owner (<a onClick="return mV(\'Lev\',25,10);">Le 25:10</a>; compare <a onClick="return mV(\'Lev\',25,13);">25:13</A>), and those who, compelled by poverty, had sold themselves as slaves to their brothers, should regain their liberty (<a onClick="return mV(\'Lev\',25,10);">Le 25:10</a>; compare <a onClick="return mV(\'Lev\',25,39);">25:39</a>).<P>In addition to this, the Jubilee Year was to be observed after the manner of the sabbatic year, i.e. there should be neither sowing nor reaping nor pruning of vines, and everybody was expected to live on what the fields and the vineyards produced "of themselves," and no attempt should be made at storing up the products of the land (<a onClick="return mV(\'Lev\',25,11);">Le 25:11</a>f). Thus there are three distinct factors constituting the essential features of the Jubilee Year: personal liberty, restitution of property, and what we might call the simple life.<P>1. Personal Liberty:<P>The 50th year was to be a time in which liberty should be proclaimed to all the inhabitants of the country. We should, indeed, diminish the import of this institution if we should apply it only to those who were to be freed from the bonds of physical servitude. Undoubtedly, they must have been the foremost in realizing its beneficial effects. But the law was intended to benefit all, the masters as well as the servants. They should never lose sight of their being brothers and citizens of theocratic kingdom. They owed their life to God and were subject to His sovereign will. Only through loyalty to Him were they free and could ever hope to be free and independent of all other masters.<P>2. Restitution of Property:<P>The institution of the Jubilee Year should become the means of fixing the price of real property (<a onClick="return mV(\'Lev\',25,15);">Le 25:15</a>f; compare <a onClick="return mV(\'Lev\',25,\'25-28\');">25:25-28</a>); moreover, it should exclude the possibility of selling any piece of land permanently (<a onClick="return mV(\'Lev\',25,23);">Le 25:23</a>), the next verse furnishing the motive: "The land is mine: for ye are strangers and sojourners with me." The same rule was to be applied to dwelling-houses outside of the walled cities (<a onClick="return mV(\'Lev\',25,31);">Le 25:31</a>), and also to the houses owned by Levites, although they were built within walled cities (<a onClick="return mV(\'Lev\',25,32);">Le 25:32</a>).<P>In the same manner the price of Hebrew slaves was to vary according to the proximity of the Jubilee Year (<a onClick="return mV(\'Lev\',25,\'47-54\');">Le 25:47-54</a>). This passage deals with the enslaving of a Hebrew by a foreigner living among the Jews; it goes without saying that the same rule would hold good in the case of a Hebrew selling himself to one of his own people. In <a onClick="return mV(\'Lev\',27,\'17-25\');">Le 27:17-25</a> we find a similar arrangement respecting such lands that were "sanctified unto Yahweh." In all these cases the original owner was at liberty to redeem his property at any time, or have it redeemed by some of his nearest relatives (<a onClick="return mV(\'Lev\',25,25,26,27,29,48);">25:25-27,29,48ff</a>; <a onClick="return mV(\'Lev\',27,19);">27:19</a>).<P>The crowning feature, though, was the full restitution of all real property in the Jubilee Year. The primary object of this regulation was, of course, the reversion of all hereditary property to the family which originally possessed it, and the reestablishment of the original arrangement regarding the division of the land. But that was not all; for this legal disposition and regulation of external matters was closely connected with the high calling of the Jewish people. It was a part of the Divine plan looking forward to the salvation of mankind. "The deepest meaning of it (the Jubilee Year) is to be found in the apokatastasis tes basileias tou theou, i.e. in the restoring of all that which in the course of time was perverted by man\'s sin, in the removing of all slavery of sin, in the establishing of the true liberty of the children of God, and in the delivering of the creation from the bondage of corruption to which it was subjected on account of man\'s depravity" (<a onClick="return mV(\'Rom\',8,19);">Ro 8:19</a>) (compare Keil, Manual of Biblical Archaeology). In the Year of Jubilee a great future era of Yahweh\'s favor is foreshadowed, that period which, according to <a onClick="return mV(\'Isa\',61,\'1-3\');">Isa 61:1-3</a>, shall be ushered in to all those that labor and are heavy laden, by Him who was anointed by the spirit of the Lord Yahweh.<P>3. The Simple Life:<P>The Jubilee Year, being the crowning point of all sabbatical institutions, gave the finishing touch as it were to the whole cycle of sabbatic days, months and years. It is, therefore, quite appropriate that it should be a year of rest for the land like the preceding sabbatic year (<a onClick="return mV(\'Lev\',25,11);">Le 25:11</a>f). It follows, of course, that in this instance there were two years, one after the other, in which there should be no sowing or systematic ingathering. This seems to be clear from <a onClick="return mV(\'Lev\',25,\'18-22\');">Le 25:18-22</a>: "And ye shall sow the eighth year, and eat of the fruits, the old store; until the ninth year, until its fruits come in, ye shall eat the old store." Thus in the 7th and 8th years the people were to live on what the fields had produced in the 6th year and whatever grew spontaneously. This shows the reason why we may say that one of the factors constituting the Jubilee Year was the "simple life." They could not help but live simply for two consecutive years. Nobody can deny that this afforded ample opportunity to develop the habit of living within very limited means. And again we see that this external part of the matter did not fully come up to the intention of the Lawgiver. It was not the simple life as such that He had in view, but rather the laying down of its moral and religious foundations. In this connection we must again refer to <a onClick="return mV(\'Lev\',25,\'18-22\');">Le 25:18-22</a>, "What shall we eat the seventh year?" The answer is very simple and yet of surpassing grandeur: "Then I will command my blessing upon you," etc. Nothing was expected of the people but faith in Yahweh and confidence in His power, which was not to be shaken by any doubtful reflection. And right here we have found the root of the simple life: no life without the true God, and no simplicity of life without true faith in Him. "Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God" (<a onClick="return mV(\'Mat\',4,4);">Mt 4:4</a>; compare <a onClick="return mV(\'Deu\',8,3);">De 8:3</a>).<P>We may well ask: Did the Jewish people ever observe the Jubilee Year? There is no reason why they should not have observed it in pre-exilic times (compare Lotz in The New Schaff-Herzog Encyclopedia of Religious Knowledge, X, under the word "Sabbatical Year" and "Year of Jubilee"). Perhaps they signally failed in it, and if so, we should not be surprised at all. Not that the institution in itself was cumbered with any obstacles that could not have been overcome; but what is more common than unbelief and unwillingness to trust absolutely in Yahweh? Or, was it observed in post-exilic times? Here, too, we are in the dark. There is, indeed, a tradition according to which the Jubilee Year has never been observed—neither in the time of Ezra and Nehemiah nor at any later period. The truth of this seems to be corroborated by the silence of Josephus, who, while referring quite frequently to the sabbatic year, never once mentions the Year of Jubilee.``8';

isbe[5187]='Juda`joo\'-da: <a onClick="return mV(\'Luk\',1,39);">Lu 1:39</a> the King James Version,`<a href="./study/isbe/search.html?string=JUTTAH">JUTTAH</a>; <a href="./study/isbe/search.html?string=JODA">JODA</a>; <a href="./study/isbe/search.html?string=JUDAS">JUDAS</a>`1';
isbe[5188]='Judaea`joo-de\'-a, ju-de\'-a (Ioudaia): The "land of the Jews," the Greco-Roman equivalent of Judah. As most of the Israelites returning from the captivity belonged to the tribe of Judah, they came to be called Jews and their land Judea. In Tobit 1:18 the name is applied to the old kingdom of Judah. For a general description of the physical geography and early history of this region see <a href="./study/isbe/search.html?string=JUDAH">JUDAH</a>. The limits of this district varied greatly, extending as the Jewish population increased, but in many periods with very indefinite boundaries.<P>Under the Persian empire, Judea (or Judah) was a district administered by a governor who, like Zerubbabel (<a onClick="return mV(\'Hag\',1,14);">Hag 1:14</a>; <a onClick="return mV(\'Hag\',2,2);">2:2</a>), was probably usually a Jew. Even as late as Judas Maccabeus, Hebron and its surroundings—the very heart of old Judah was under the domination of the Edomites, whom, however, Judas conquered (1Macc 5:65); in the time of his brother Jonathan (145 BC), three tetrarchies of Samaria, Aphaerema, Lydda and Ramathaim, were added to Judea (1Macc 10:30,38; 11:34); in some passages it is referred to at this time as the "land of Judah" (Iouda) (1Macc 10:30,33,37). The land was then roughly limited by what may be called the "natural boundaries of Judah" (see <a href="./study/isbe/search.html?string=JUDAH">JUDAH</a>).<P>Strabo (xvi.11, 21) extends the name Judea to include practically all Palestine; as does Luke (<a onClick="return mV(\'Luk\',4,44);">4:44</a> margin; <a onClick="return mV(\'Luk\',23,5);">23:5</a>; <a onClick="return mV(\'Act\',2,9);">Ac 2:9</a>; <a onClick="return mV(\'Act\',10,37);">10:37</a>, etc.). In several New Testament references (<a onClick="return mV(\'Mat\',4,25);">Mt 4:25</a>; <a onClick="return mV(\'Mar\',1,5);">Mr 1:5</a>; <a onClick="return mV(\'Mar\',3,7);">3:7</a>; <a onClick="return mV(\'Luk\',5,17);">Lu 5:17</a>; <a onClick="return mV(\'Jhn\',3,22);">Joh 3:22</a>; <a onClick="return mV(\'Act\',1,8);">Ac 1:8</a>), Judea is contrasted with its capital Jerusalem. The country bordering on the shores of the Dead Sea for some miles inland was known as the Wilderness of Judea (see <a href="./study/isbe/search.html?string=JUDAH">JUDAH</a>; <a href="./study/isbe/search.html?string=JESHIMON">JESHIMON</a>) (<a onClick="return mV(\'Mat\',3,1);">Mt 3:1</a>), or "the wilderness" (<a onClick="return mV(\'Mar\',1,4);">Mr 1:4</a>; <a onClick="return mV(\'Luk\',3,2);">Lu 3:2</a>); here John the Baptist appeared as a preacher. According to <a onClick="return mV(\'Mat\',19,1);">Mt 19:1</a> (but compare <a onClick="return mV(\'Mar\',10,1);">Mr 10:1</a>, where the Revised Version (British and American) has "Judaea and beyond Jordan"), some cities beyond Jordan belonged to Judea. That this was an actual fact we know from Ptolemy (v.16,9) and Josephus (Ant., XII, iv, 11).<P>According to Josephus (BJ, III, iii, 5), Judea extended from Anuath-Borkaeos (i.e. Khan Berkit near Khan es Saweh, close to the most northerly frontier of Judah as described in <a href="./study/isbe/search.html?string=JUDAH">JUDAH</a> (which see)) to the village Jordan, possibly Tell \'Arad, near Arabia in the south. Its breadth was from Joppa in the west to Jordan in the east. The seacoast also as far north as Ptolemais (\'Akka), except Jamnia, Joppa and (according to the Talm) Caesarea, belonged to this province.<P>After the death of Herod the Great, Archelaus received Judea, Samaria and Idumea as his ethnarchy, but on his deposition Judea was absorbed into the Roman province of Syria, the procurator of which lived at Caesarea.<P>Of later history it is only necessary to notice that in the 5th century Judea became part of the land known as Palaestina Prima; that at the time of the Latin kingdom of Jerusalem (12th century) all the hill country of Judah from Sinjil to Tekoa was the royal domain, while the southern section to Beersheba belonged to the Seigneur de Abraham (i.e. of Hebron); and lastly that a district, the rough equivalent of the kingdom of Judah, though larger, and of the Judea described by Josephus (BJ, III, iii, 5), though slightly smaller, forms today the Mutaserraflic of el Kuds, an administrative area where more than in any spot in the world the problem of the "land of the Jews" is today increasingly acute.``117';
isbe[5189]='Judaea, Wilderness of`(<a onClick="return mV(\'Mat\',3,1);">Mt 3:1</a>).`<a href="./study/isbe/search.html?string=JUDAEA">JUDAEA</a>`1';
isbe[5190]='Judah (1)`joo\'-da (yehudhah, "praised"):<P>(1) 4th son of Jacob by Leah (see separate article [<A href="./study/isbe/search.html?string=JUDAH+(2)">Judah (2)</A>).<P>(2) An ancestor of Kadmiel, one of those who had the oversight of the rebuilding of the temple (<a onClick="return mV(\'Ezr\',3,9);">Ezr 3:9</a>). He is the same as Hodaviah (<a onClick="return mV(\'Ezr\',2,40);">Ezr 2:40</a>), and Hodevah (<a onClick="return mV(\'Neh\',7,43);">Ne 7:43</a>).<P>(3) A Levite who had taken a strange wife (Ezr, 10:23).<P>(4) A Levite who came up with Zerubbabel (<a onClick="return mV(\'Neh\',12,8);">Ne 12:8</a>).<P>(5) A priest and musician who took part in the dedication of the wall of Jerusalem (<a onClick="return mV(\'Neh\',12,36);">Ne 12:36</a>); (3), (4) and (5) may be the same person.<P>(6) A Benjamite, the son of Hassenuah, who was second over the city of Jerusalem in the days of Nehemiah (<a onClick="return mV(\'Neh\',11,9);">Ne 11:9</a>).<P>(7) One of the princes of Judah who took part in the dedication of the wall of Jerusalem (<a onClick="return mV(\'Neh\',12,34);">Ne 12:34</a>).``78';
isbe[5191]='Judah (2)`(yehudah; in <a onClick="return mV(\'Gen\',29,35);">Ge 29:35</a> Codex Vaticanus, Ioudan; Codex Alexandrinus, Iouda; elsewhere Codices Vaticanus and Alexandrinus, Ioudas):<P>1. Jacob\'s Son:<P>The 4th son born to Jacob by Leah in Paddan-aram (<a onClick="return mV(\'Gen\',29,35);">Ge 29:35</a>, etc.). Of this patriarch\'s life only scanty details remain to us. He turned his brethren from their purpose to slay Joseph, persuading them to sell him to the Midianites at Dothan (<a onClick="return mV(\'Gen\',37,26);">Ge 37:26</a>). A dark stain is left upon his memory by the disgraceful story told in <a onClick="return mV(\'Gen\',38,\'1-\');">Genesis 38</a>. Reuben forfeited the rights of primogeniture by an act of infamy; Simeon and Levi, who came next in order, were passed over because of their cruel and treacherous conduct at Shechem; to Judah, therefore, were assigned the honors and responsibilities of the firstborn (<a onClick="return mV(\'Gen\',34,\'1-\');">34</a>; <a onClick="return mV(\'Gen\',35,22);">35:22</A>; <a onClick="return mV(\'Gen\',49,\'5-12\');">49:5-12</A>). On the occasion of their first visit to Egypt, Reuben acted as spokesman for his brethren (<a onClick="return mV(\'Gen\',42,22,37);">42:22,37</a>). Then the leadership passed to Judah (<a onClick="return mV(\'Gen\',43,3);">43:3</A>, etc.). The sons of Joseph evidently looked askance upon Judah\'s promotion, and their own claims to hegemony were backed by considerable resources (<a onClick="return mV(\'Gen\',49,22);">49:22</A>ff). The rivalry between the two tribes, thus early visible, culminated in the disruption of the kingdom. To Judah, the "lion\'s whelp," a prolonged dominion was assured (<a onClick="return mV(\'Gen\',49,9);">49:9</A>ff).<P>2. Tribe of Judah:<P>The tribe of Judah, of which the patriarch was the name-father, at the first census in the wilderness numbered 74,600 fighting men; at Sinai the number "from 20 years old and upward" was 76,500 (<a onClick="return mV(\'Num\',1,27);">Nu 1:27</a>; <a onClick="return mV(\'Num\',26,22);">26:22</a>; see <a href="./study/isbe/search.html?string=NUMBERS">NUMBERS</a>). The standard of the camp of Judah, with which were also the tribes of Zebulun and Issachar, was to the east of the tabernacle "toward the sunrising," the prince of Judah being Nahshon, the son of Amminadab (<a onClick="return mV(\'Num\',2,3);">Nu 2:3</a>). Caleb, the son of Jephunneh, represented Judah among the spies (<a onClick="return mV(\'Num\',13,6);">Nu 13:6</a>); he also was told off to assist at the future allocation of the tribal portions (<a onClick="return mV(\'Num\',34,19);">Nu 34:19</a>).<P>3. Territory:<P>The land assigned to Judah lay in the south of Palestine (see <a href="./study/isbe/search.html?string=JUDAH,+TERRITORY+OF">JUDAH, TERRITORY OF</a>), comprising part of the mountain, the Shephelah, and the maritime plain. The information given of its conquest is meager and cannot be arranged in a self-consistent story. In <a onClick="return mV(\'Jos\',11,21);">Jos 11:21</a>ff, the conquest is ascribed to Joshua. Caleb is described as conquering at least a portion in <a onClick="return mV(\'Jos\',14,12);">Jos 14:12</a>; <a onClick="return mV(\'Jos\',15,13);">15:13</a>ff; while in <a onClick="return mV(\'Jdg\',1,\'1-\');">Jud 1</a> the tribes of Judah and Simeon play a conspicuous part; and the latter found a settlement in the south within the territory of Judah The tribal organization seems to have been maintained after the occupation of the land, and Judah was so loosely related to the northern tribes that it was not expected to help them against Sisera. Deborah has no reproaches for absent Judah. It is remarkable that no judge over Israel (except Othniel, <a onClick="return mV(\'Jdg\',3,\'9-11\');">Jud 3:9-11</a>) arose from the tribe of Judah. The first king of all Israel was chosen from the tribe of Benjamin. This made acquiescence on the part of Judah easier than it would have been had Saul sprung from the ancient rival, Ephraim. But the dignity of Judah was fully vindicated by the splendid reigns of David and Solomon, in lineal descent from whom the Saviour of the world should come. The further history of the tribe is merged in that of Israel.``54';
isbe[5192]='Judah At (Upon) the Jordan`(yehudhah ha-yarden): A place marking the eastern limit of the territory of Naphtali (<a onClick="return mV(\'Jos\',19,34);">Jos 19:34</a>). It is generally thought among scholars that the text is corrupt; but no very probable emendation has been suggested. Thomson (L B, II, 466) proposes to identify it with Seiyid Jehuda, a small white-domed sanctuary about 3 miles to the southeast of Tell el-Qady.``1';
isbe[5193]='Judah, Kingdom of`<b>I. CANAAN BEFORE THE MONARCHY</b><P class="in15">1. The Coming of the Semites<P class="in15">2. The Canaanites<P class="in15">3. The Israelite Confederacy<P class="in15">4. Migration into Canaan<P class="in15">5. The Bond of Union<P class="in15">6. Early Rulers<P class="in15">7. The Judges<P class="in15">8. Hereditary Kings<P><b>II. THE FIRST THREE KINGS</b><P class="in15">1. The Benjamite King<P class="in15">2. Rachel and Leah Tribes<P class="in15">3. The Disruption<P><b>III. THE DUAL MONARCHY</b><P class="in15">1. War between Two Kingdoms<P class="in15">2. First Reform of Religion<P class="in15">3. Two Kingdoms at Peace<P class="in15">4. Two Kingdoms Contrasted<P class="in15">5. Revolution in the Northern Kingdom<P class="in15">6. Effect on the Southern Kingdom<P class="in15">7. Davidic House at Lowest Ebb<P class="in15">8. Begins to Recover<P class="in15">9. Reviving Fortunes<P class="in15">10. Monarchy Still Elective<P class="in15">11. Government by Regents<P class="in15">12. Period of Great Prosperity<P class="in15">13. Rise of Priestly Caste<P class="in15">14. Advent of Assyria<P class="in15">15. Judah a Protectorate<P class="in15">16. Cosmopolitan Tendencies<P><b>IV. PERIOD OF DECLINE</b><P class="in15">1. Judah Independent<P class="in15">2. Reform of Religion<P class="in15">3. Egypt and Judah<P class="in15">4. Traffic in Horses<P class="in15">5. Reaction under Manasseh<P class="in15">6. Triumph of Reform Party<P class="in15">7. Babylonia and Judah<P class="in15">8. End of Assyrian Empire<P class="in15">9. After Scythian Invasion<P class="in15">10. Judah Again Dependent<P class="in15">11. Prophets Lose Influence<P class="in15">12. The Deportations<P class="in15">13. Summary<hr /><P>I. Canaan before the Monarchy.<P>1. The Coming of the Semites:<P>Some 4,000 years BC the land on either side of the valley of the Jordan was peopled by a race who, to whatever stock they belonged, were not Semites. It was not until about the year 2500 BC that the tide of Sere immigration began to flow from North Arabia into the countries watered by the Jordan and the Euphrates. One of the first waves in this human tide consisted of the Phoenicians who settled in the northwest, on the seashore; they were closely followed by other Canaan tribes who occupied the country which long bore their name.<P>2. The Canaanites:<P>The Canaanites are known to us chiefly from the famous letters found at Tell Amarna in Egypt which describe the political state of the country during the years 1415-1360 BC—the years of the reigns of Amenophis III and IV. Canaan was at this time slipping out of the hands of Egypt. The native princes were in revolt: tribute was withheld; and but few Egyptian garrisons remained. Meantime a fresh tide of invasion was hurling its waves against the eastern frontiers of the land. The newcomers were, like their predecessors, Semitic Bedouin from the Syrian desert. Among them the Tell el-Amarna Lettersname the Chabiri, who are, no doubt, the people known to us as the Hebrews.<P>3. The Israelite Confederacy:<P>The Hebrews are so named by those of other nationality after one of their remoter ancestors (<a onClick="return mV(\'Gen\',10,24);">Ge 10:24</a>), or because they had come from beyond (\'ebher) the Jordan or the Euphrates. Of themselves they spoke collectively as Israel. Israel was a name assumed by the eponymous hero of the nation whose real name was Jacob. Similarly the Arabian prophet belonged to the tribe called from its ancestor Koraish, whose name was Fihr. The people of Israel were a complex of some 12 or 13 tribes. These 12 tribes were divided into two main sections, one section tracing its descent from Leah, one of Jacob\'s wives, and the other section tracing its descent from Rachel, his other wife. The names of the tribes which claimed to be descended from Leah were Reuben, Simeon, Levi, Judah, Issachar, Zebulun, and, indirectly, Gad and Asher; those which claimed to be descended from Rachel were Joseph, which was divided into two clans; Ephraim and Manasseh, Benjamin, and, indirectly, Dan and Naphtali. The rivalry between these two great divisions runs all through the national history of the Hebrews, and was only brought to an end by the annihilation of one of the opposing factions (<a onClick="return mV(\'Isa\',11,13);">Isa 11:13</a>). But not only was the Israelite nation a combination of many clans; it was united also to other tribes which could not claim descent, from Israel or Jacob. Such tribes were the Kenites and the Calebites. Toward such the pure Israelite tribes formed a sort of aristocracy, very much as, to change the parallel, the tribe of Koraish did among the Arabs. It was rarely that a commander was appointed from the allied tribes, at least in the earlier years of the national life.<P>4. Migration into Canaan:<P>We find exactly the same state of things obtaining in the history of the Arabian conquests. All through that history there runs the rivalry between the south Arabian tribes descended from Kahtan (the Hebrew Joktan, <a onClick="return mV(\'Gen\',10,25);">Ge 10:25</a>, etc.) and the northern or Ishmaelite tribes of Modar. It is often stated that the Old Testament contains two separate and irreconcilable accounts of the conquest of Canaan by the Israelites. According to the Book of Joshua, it is said the invasion was a movement of the whole people of Israel under the leadership of Joshua; according to the Book of Judges, it consisted of a series of expeditions made by individual tribes each on its own account (<a onClick="return mV(\'Jdg\',1,2,10);">Jud 1:2,10</a>, etc.). But again, in the history of the Arabs we find precisely the same apparent discrepancy. For Persia, Syria and Egypt were conquered by the Arabs as a whole; but at the same time no tribe lost its individuality; each tribe made expeditions on its own account, and turned its arms against rival tribes even in the enemy\'s country. On the confines of China in the East and in Spain on the West, the arms of the Yemen\'s tribes were employed in the destruction of those of Modar as fiercely as ever they had been within Arabia itself.<P>5. The Bond of Union:<P>The bond which united the Israelite tribes, as well as those of Kayin (the eponym of the Kenites) and Caleb, was that of the common worship of Yahweh. As Mohammed united all the tribes of Arabia into one whole by the doctrine of monotheism, so did Moses the Israelite tribes by giving them a common object of worship. And the sherifs or descendants of \'Ali today occupy a position very like what the Levites and the descendants of Aaron must have maintained in Israel. In order to keep the Israelite nation pure, intermarriage with the inhabitants of the invaded country was forbidden, though the prohibition was not observed (<a onClick="return mV(\'Jdg\',3,5);">Jud 3:5</a>f). So too, the Arab women were not permitted to marry non-Arabs during the first years of conquest.<P>6. Early Rulers:<P>It is customary to date the beginning of monarchy in Israel from Saul the son of Kish, but in point of fact many early leaders were kings in fact if not in name. Moses and Joshua may be compared with Mohammed and his caliph (properly khalifa) or "successor," Abu Bekr. Their word was law; they reigned supreme over a united nation. Moreover, the word "king" (melekh) often means, both in Hebrew and Arabic, nothing more than governor of a town, or local resident. There was more than one "king" of Midinn (<a onClick="return mV(\'Jdg\',8,12);">Jud 8:12</a>). Balak seems to have been only a king of Moab (<a onClick="return mV(\'Num\',22,4);">Nu 22:4</a>).<P>7. The Judges:<P>Before the monarchy proper, the people of Israel formed, in theory, a theocracy, as did also the Arabs under the caliphs. In reality they were ruled by temporary kings called judges (shopheT, the Carthaginian sufes). Their office was not hereditary, though there were exceptions (compare <a onClick="return mV(\'Jdg\',9,\'1-\');">Jud 9</a>). On the other hand, the government of the Northern Kingdom of Israel was practically an elective monarchy, so rarely were there more than two of the same dynasty. The judge again was usually appointed in order to meet some special crises, and theoretically ideal state of things was one in which there was no visible head of the state—a republic without a president. These intervals, however, always ended in disaster, and the appointment of another judge. The first king also was elected to cope with a specially serious crisis. The main distinction between judge and king was that the former, less than the latter, obscured the fact of the true King, upon the recognition of whom alone the continued existence of the nation depended. The rulers then became the "elders" or sheikhs of the tribes, and as these did not act in unison, the nation lost its solidarity and became an easy prey to any invader.<P>8. Hereditary Kings:<P>During the period of the Judges a new factor entered into the disturbed politics of Canaan. This was an invader who came not from the eastern and southern deserts, but from the western sea. Driven out of Crete by invaders from the mainland, the last remnants of the race of Minos found refuge on the shores of the country which ever after took from them the name it still bears—Philistin or Palestine. At the same time the Ammonites and Midianites were pressing into the country from the east (<a onClick="return mV(\'1Sa\',11,\'1-\');">1Sa 11</a>). Caught between these two opposing forces, the tribes of Israel were threatened with destruction. It was felt that the temporary sovereignty of the judge was no longer equal to the situation. The supreme authority must be permanent. It was thus the monarchy was founded. Three motives are given by tradition as leading up to this step. The pretext alleged by the elders or sheikhs is the worthlessness and incapacity of Samuel\'s sons, who he intended should succeed him (<a onClick="return mV(\'1Sa\',8,\'1-\');">1Sa 8</a>). The immediate cause was the double pressure from the Philistines (<a onClick="return mV(\'1Sa\',9,16);">1Sa 9:16</a>) and the Ammonite king (<a onClick="return mV(\'1Sa\',12,12);">1Sa 12:12</a>). The real reason was that the system of government by elective kings or judges had proved a failure and had completely broken down. The times called for a hereditary monarchy.<P>II. The First Three Kings.<P>1. The Benjamite King:<P>The most warlike of the clans of Israel shortly before this had been that of Benjamin—one of the Rachel tribes. The national sanctuary, with the ark and the grandson of Aaron as priest, was at Bethel in their territory. Moreover, they had defeated the combined forces of the other tribes in two pitched battles. They had at last been defeated and almost exterminated, but they had recovered much of their strength and prestige (<a onClick="return mV(\'Jdg\',20,\'1-\');">Jud 20</a>; <a onClick="return mV(\'1Sa\',4,12);">1Sa 4:12</a>). From this tribe the first king was chosen (see <a href="./study/isbe/search.html?string=SAUL">SAUL</a>). He, however, proved unequal to his task. After some years spent in war with the Philistines and in repressing supposed disloyalty at home, he was defeated and killed.<P>Meantime, one of the less-known clans was coming to the front. The territory of the tribe of Judah lay in the south. After its occupation (compare <a onClick="return mV(\'Jdg\',1,2,3);">Jud 1:2,3</a>), the tribe of Judah appears to have settled down to the care of its flocks and herds. It is not mentioned in the So of Deborah. None of the judges belonged to it, unless Ibzan, who seems to have been of little account (<a onClick="return mV(\'Jdg\',12,8);">Jud 12:8</a>f). Under the leadership of <a href="./study/isbe/search.html?string=DAVID">DAVID</a> (which see), this tribe now came to the front, and proved in the end to be endowed with by far the greatest vitality of all the tribes. It outlived them all, and survives to this day.<P>2. Rachel and Leah Tribes:<P>The Rachel tribes, led by Benjamin and Ephraim (<a onClick="return mV(\'2Sa\',2,\'1-\');">2Sa 2</a>; <a onClick="return mV(\'2Sa\',3,\'1-\');">3</a>), resisted for some time the hegemony of Judah, but were obliged in the end to submit. Under David Israel became again a united whole. By making Jerusalem his capital on the borders of Judah and Benjamin, he did much to insure the continuance of this union (compare <a onClick="return mV(\'1Ch\',9,3);">1Ch 9:3</a>). The union, however, was only on the surface. By playing off the Rachel tribes, Benjamin and Ephraim, against the rest, Absalom was able to bring the whole structure to the ground (<a onClick="return mV(\'2Sa\',15,1);">2Sa 15</a>), the tribe to which Saul belonged being especially disloyal (<a onClick="return mV(\'2Sa\',16,5);">2Sa 16:5</a>). Nor was this the only occasion on which the smoldering enmity between the two houses burst out into flame (<a onClick="return mV(\'2Sa\',20,\'1-\');">2Sa 20</a>). As soon as the strong hand of David was removed, disaffection showed itself in several quarters (<a onClick="return mV(\'1Ki\',11,14);">1Ki 11:14</a>), and especially the aspiration of the tribe of Ephraim, after independence was fomented by the prophets (<a onClick="return mV(\'1Ki\',11,26);">1Ki 11:26</a>). Egypt afforded a convenient asylum for the disaffected until opportunity should ripen. They had not long to wait.<P>3. The Disruption:<P>Solomon was succeeded by Rehoboam, who found it politic to hold a coronation ceremony at Shechem as well, presumably, as at Jerusalem. The malcontents found themselves strong enough to dictate terms. These Rehoboam rejected, and the northern tribes at once threw off their allegiance to the dynasty of David. The disruption thus created in the Israelite nation was never again healed. The secession was like that of the Moors in Spain from the \'Abbhsid caliphs. Henceforth "Israel," except in the Chronicler, denotes the Northern Kingdom only. In that writer, who does not recognize the kingdom of the ten tribes, it means Judah. It is usual at the present day to recognize in the Northern Kingdom the true Israelite kingdom. Certainly in point of extent of territory and in resources it was far the greater of the two. But as regards intellectual power and influence, even down to the present day, not to mention continuity of dynasty, the smaller kingdom is by far the more important. It is, therefore, treated here as the true representative of the nation. Lying, as it did, in the immediate vicinity of Jerusalem, the tribe of Benjamin could hardly do otherwise than throw in its lot with that of Judah Bethel, which became one of the religious capitals of the Northern Kingdom, although nominally within their territory, in fact belonged to Ephraim (<a onClick="return mV(\'Jdg\',1,22);">Jud 1:22</a>). With this union of opposing interests may be compared that of the \'Alids and \'Abbhsids, both belonging to the house of Mohammed and both aspirants to the caliphate, against the house of Umeiya.<P>III. The Dual Monarchy.<P>1. War between Two Kingdoms:<P>Rehoboam made no decisive attempt to bring back the recalcitrant tribes to their allegiance (<a onClick="return mV(\'1Ki\',12,21);">1Ki 12:21</a>), though the two countries made raids, one upon the other (<a onClick="return mV(\'1Ki\',14,30);">1Ki 14:30</a>). For his own security he built numerous fortresses, the remains of some of which have, it is probable, been recovered within recent years (<a onClick="return mV(\'2Ch\',11,5);">2Ch 11:5</a>). These excited the suspicion of Shishak of Egypt, who invaded the country and reduced it to vassalage (<a onClick="return mV(\'1Ki\',14,25);">1Ki 14:25</a>). Under Rehoboam\'s son Abijah, actual war broke out between the two kingdoms (<a onClick="return mV(\'1Ki\',15,6);">1Ki 15:6</a> as corrected in <a onClick="return mV(\'1Ki\',15,7);">15:7</a>; <a onClick="return mV(\'2Ch\',13,\'1-\');">2Ch 13</a>). The war was continued during the long reign of his son Asa, whose opponent, Baasha, built a fort some 6 miles north of Jerusalem in order to cut off that city from communication with the north Asa confessed his weakness by appealing for help to Ben-hadad of Damascus. The end justified the means. The fort was demolished.<P>2. First Reform of Religion:<P>The reign of Asa is also remarkable for the first of those reformations of worship which recur at intervals throughout the history of the Southern Kingdom. The high places Reform of were not yet, however, considered illegitimate (<a onClick="return mV(\'1Ki\',15,14);">1Ki 15:14</a>; but compare <a onClick="return mV(\'2Ch\',14,5);">2Ch 14:5</a>). He also, like his grandfather, was a builder of castles, and with a similar, though more fortunate, result (<a onClick="return mV(\'2Ch\',14,6,9);">2Ch 14:6,9</a>). Asa\'s old age and illness helped to bring to the rival kingdoms a peace which lasted beyond his own reign (<a onClick="return mV(\'1Ki\',15,23);">1Ki 15:23</a>).<P>3. Two Kingdoms at Peace:<P>An effect of this peace is seen in the expanding foreign trade of the country under his successor Jehoshaphat. He rebuilt the navy as in the days of Solomon, but a storm ruined the enterprise (<a onClick="return mV(\'1Ki\',22,48);">1Ki 22:48</a>f). During this reign the two kingdoms came nearer being united than they had done since the disruption. This was no doubt largely due to the Northern Kingdom having been greatly weakened by the wars with Syria and Assyria, and having given up the idea of annexing the smaller country. Moreover, Jehoshaphat had married his son Joram (Jehoram) to Ahab\'s daughter Athaliah. From a religious point of view, the two states reacted upon one another. Jehoram of Israel inaugurated a reformation of worship in the Northern Kingdom, and at the same time that of Judah was brought into line with the practice of the sister kingdom (<a onClick="return mV(\'2Ki\',8,18);">2Ki 8:18</a>). The peace, from a political point of view, did much to strengthen both countries, and enabled them to render mutual assistance against the common foe.<P>4. Two Kingdoms Contrasted:<P>Up to the death of Jehoram of Israel, which synchronized with that of Joram and Ahaziah of Judah, 6 kings had reigned in Judah Of these the first 4 died in their beds and were buried in their own mausoleum. During the same period of about 90 years there were in Israel 9 kings divided into 4 dynasties. The second king of the Ist Dynasty was immediately assassinated and the entire family annihilated. Precisely the same fate overtook the IId Dynasty. Then followed a civil war in which two pretenders were killed, one perishing by his own hand. The IIIrd Dynasty lasted longer than the first two and counted 4 kings. Of these one was defeated and killed in battle and another assassinated. The fate of the kings of Israel is very like that of the middle and later \'Abbasid caliphs. The murder of his brothers by the Judean Jehoram, a proceeding once regular with the sultans of Turkey, must also be put down to the influence of his Israelite wife.<P>5. Revolution in the Northern Kingdom:<P>It was obvious that a crisis was impending. Edom and Libnah had thrown off their allegiance, and the Philistines had attacked and plundered Jerusalem, even the king\'s sons being taken prisoners, with the exception of the youngest (<a onClick="return mV(\'2Ch\',21,16);">2Ch 21:16</a>). Moreover, the two kingdoms had become so closely united, not only by intermarriage, but also in religion and politics, that they must stand and fall together. The hurricane which swept away the northern dynasty also carried off the members of the southern royal house more nearly connected with Ahab, and the fury of the queen-mother Athaliah made the destruction complete (<a onClick="return mV(\'2Ki\',11,1);">2Ki 11:1</a>).<P>6. Effect on the Southern Kingdom:<P>For 6 years the daughter of Ahab held sway in Jerusalem. The only woman who sat on the throne of David was a daughter of the hated Ahab. In her uniqueness, she thus holds a place similar to that of Shejered-Durr among the Memluk sultans of Egypt. The character of her reign is not described, but it can easily be imagined. She came to her inevitable end 6 years later.<P>7. Davidic House at Lowest Ebb:<P>Successive massacres had reduced the descendants of David until only one representative was left. Jehoram, the last king but one, had murdered all his brothers (<a onClick="return mV(\'2Ch\',21,4);">2Ch 21:4</a>); the Arab marauders had killed his sons except the youngest (<a onClick="return mV(\'2Ch\',22,1);">2Ch 22:1</a>; compare <a onClick="return mV(\'2Ch\',21,17);">21:17</A>). The youngest, Ahaziah, after the death of his father, was, with 42 of his "brethren," executed by Jehu (<a onClick="return mV(\'2Ki\',10,14);">2Ki 10:14</a>). Finally, Athaliah "destroyed all the seed royal." The entente with the Northern Kingdom had brought the Davidic dynasty to the brink of extinction.<P>8. Begins to Recover:<P>But just as \'Abd er-Rahman escaped from the slaughter of the Umeiyads to found a new dynasty in Spain, so the Davidic dynasty made a fresh start under Joash. The church had saved the state, and naturally the years that followed were years in which the religious factor bulked large. The temple of Baal which Athaliah had built and supported was wrecked, the idols broken, and the priest killed. A fund was inaugurated for the repair of the national temple. The religious enthusiasm, however, quickly cooled. The priests were found to be diverting the fund for the restoration of the temple to their own uses. A precisely similar diversion of public funds occurred in connection with the Qarawiyin mosque in Fez under the Almoravids in the 12th century. The reign which had begun with so much promise ended in clouds and darkness (<a onClick="return mV(\'2Ki\',12,17);">2Ki 12:17</a>ff; <a onClick="return mV(\'2Ch\',24,17);">2Ch 24:17</a>ff; <a onClick="return mV(\'Mat\',23,35);">Mt 23:35</a>), and Joash was the first of the Judean kings to be assassinated by his own people (<a onClick="return mV(\'2Ki\',12,20);">2Ki 12:20</a>f).<P>9. Reviving Fortunes:<P>By a curious coincidence, a new king ascended the throne of Syria, of Israel and of Judah about the same time. The death of Hazael, and accession of Ben-hadad III led to a revival in the fortunes of both of the Israelite kingdoms. The act of clemency with which Amaziah commenced his reign (<a onClick="return mV(\'2Ki\',14,5,6);">2Ki 14:5,6</a>; <a onClick="return mV(\'Deu\',24,16);">De 24:16</a>) presents a pleasing contrast to the moral code which had come to prevail in the sister kingdom; and the story of his hiring mercenaries from the Ephraimite kingdom (<a onClick="return mV(\'2Ch\',25,\'5-10\');">2Ch 25:5-10</a>) sheds a curious light on the relations subsisting between the two countries, and even on those times generally. It is still more curious to find him, some time after, sending, without provocation, a challenge to Jehoash; and the capture and release of Amaziah evinces some rudimentary ideas of chivalry (<a onClick="return mV(\'2Ki\',14,8);">2Ki 14:8</a>). The chief event of the reign was the reconquest of Edom and taking of Petra (<a onClick="return mV(\'2Ki\',14,7);">2Ki 14:7</a>).<P>10. Monarchy Still Elective:<P>The principle of the election of kings by the people was in force in Judah, although it seemed to be in abeyance since the people were content to limit their choice to the Davidic line. But it was exercised when occasion required. Joash had been chosen by the populace, and it was they who, when the public discontent culminated in the assassination of Amaziah, chose his 16-year-old son Uzziah (or Azariah) to succeed him.<P>11. Government by Regents:<P>The minority of the king involved something equivalent to a regency. As Jehoiada at first carried on the government for Joash, so Uzziah was at first under the tutelage of Zechariah (<a onClick="return mV(\'2Ch\',26,5);">2Ch 26:5</a>), and the latter part of his reign was covered by the regency of his son Jotham. It is obvious that with the unstable dynasties of the north, such government by deputy would have been impracticable.<P>12. Period of Great Prosperity:<P>The reign of Uzziah (<a onClick="return mV(\'2Ch\',26,\'1-\');">2Ch 26</a>) was one of the most glorious in the annals of the Judean kingdom. The Philistines and Southern Arabs, who had been so powerful in the reign of Jehoram, were subdued, and other Bedouin were held in check. The frontiers were strengthened with numerous castles. Now that Edom was again annexed, the Red Sea trade was resumed. Irrigation was attended to, and the agricultural resources of the country were developed. Uzziah also established a standing army, properly equipped and trained. Artillery, in the shape of catapults and other siege engines, was manufactured. It is obvious that in this reign we have advanced far beyond the earlier and ruder times.<P>13. Rise of Priestly Caste:<P>In this and the preceding reigns, we notice also how the priests are becoming a distinct and powerful caste. Zadok and Abiathar were no more than the domestic chaplains of David. The kings might at pleasure discharge the functions of the priest. But the all-powerful position of Jehoiada seems to have given the order new life; and in the latter part of the reign of Uzziah, king and priest come into conflict, and the king comes off second-best (<a onClick="return mV(\'2Ch\',26,16);">2Ch 26:16</a>).<P>14. Advent of Assyria:<P>Uzziah is the first king of Judah to be mentioned in the Assyrian annals. He was fighting against "Pul" in the years 742-740. The advent of the great eastern power upon the scene of Judean politics could end but in one way—as it was soon to do with Israel also. The reign of Jotham may be passed over as it coincided almost entirely with that of his father. But in the following reign we find Judah already paying tribute to Assyria in the year of the fall of Damascus and the conquest of the East-Jordan land, the year 734.<P>15. Judah a Protectorate:<P>During the regency of Jotham, the effeminacy and luxury of the Northern Kingdom had already begun to infect the Southern (<a onClick="return mV(\'Mic\',1,9);">Mic 1:9</a>; <a onClick="return mV(\'Mic\',6,16);">6:16</a>), and under the irresolute Ahaz the declension went on rapidly. This rapprochement in morals and customs did not prevent Israel under Pekah joining with Rezin of Syria against Judah, with no less an object than to subvert the dynasty by placing an Aramean on the throne (<a onClick="return mV(\'Isa\',7,6);">Isa 7:6</a>). What the result might have been, had not Isaiah taken the reins out of Ahaz\' hands, it is impossible to say. As it was, Judah felt the strain of the conflict for many a year. The country was invaded from other points, and many towns were lost, some of which were never recovered (<a onClick="return mV(\'2Ch\',28,17);">2Ch 28:17</a>). In despair Ahaz placed himself and his country under the protection of Assyria (<a onClick="return mV(\'2Ki\',16,7);">2Ki 16:7</a>).<P>16. Cosmopolitan Tendencies:<P>It was a part of the cosmopolitan tendencies of the time that the worship became tarnished with foreign innovations (<a onClick="return mV(\'2Ki\',16,10);">2Ki 16:10</a>). The temple for the first time in its history was closed (<a onClick="return mV(\'2Ch\',28,24);">2Ch 28:24</a>). Altars of Baal were set up in all the open spaces of Jerusalem, each representing some urban god (<a onClick="return mV(\'Jer\',11,13);">Jer 11:13</a>). About the closing of the temple Isaiah would not be greatly concerned. Perhaps it was his suggestion (compare <a onClick="return mV(\'Isa\',1,\'1-\');">Isa 1</a>). The priests who were supreme in the preceding reigns had lost their influence: their place had been taken by the prophets. The introduction of Baalism, however, was no doubt due to Ahaz alone.<P>IV. Period of Decline.<P>1. Judah Independent:<P>The following reign—that of Hezekiah—was, perhaps as a result of the disappearance of the Northern Kingdom, a period of reformation. Isaiah is now supreme, and the history of the times will be found in his biography. It must have been with a sigh of relief that Hezekiah saw the Northern Kingdom disappear forever from the scene. The relations of the two countries had been too uniformly hostile to make that event anything but an omen for good. It was no doubt due to Isaiah that Hezekiah sought to recover the old independence of his country. Their patriotism went near to be their own undoing. Sennacherib invaded Palestine, and Hezekiah found himself shorn of everything that was outside the walls of Jerusalem. Isaiah\'s patriotism rose to the occasion; the invading armies melted away as by a miracle; Judah was once more free (<a onClick="return mV(\'2Ki\',18,13);">2Ki 18:13</a>).<P>2. Reform of Religion:<P>A curious result of Sennacherib\'s invasion was the disappearance of the high places—local shrines where Levitical priests officiated in opposition to those of the temple. When the Judean territories were limited to the city, these of necessity vanished, and, when the siege was over, they were not restored. They were henceforward regarded as illegal. It is generally held by scholars that this reform occurred later under Josiah, on the discovery of the "Book of the Law" by Hilkiah in the temple (<a onClick="return mV(\'2Ki\',22,8);">2Ki 22:8</a>), and that this book was Deuteronomy. The high places, however, are not mentioned in the law book of Deuteronomy. The reform was probably the work of Isaiah, and due to considerations of morals.<P>3. Egypt and Judah:<P>The Judeans had always had a friendly feeling toward Egypt. When the great eastern power became threatening, it was to Egypt they turned for safety. Recent excavation has shown that the influence of Egypt upon the life and manners of Palestine was very great, and that that of Assyria and Babylonia was comparatively slight, and generally confined to the north. In the reign of Hezekiah a powerful party proposed an alliance with Egypt with the view of check-mating the designs of Assyria (<a onClick="return mV(\'2Ki\',17,4);">2Ki 17:4</a>; <a onClick="return mV(\'Isa\',30,2,3);">Isa 30:2,3</a>; <a onClick="return mV(\'Isa\',31,1);">31:1</a>). Hezekiah followed Isaiah\'s advice in rejecting all alliances.<P>4. Traffic in Horses:<P>The commercial and other ties which bound Palestine to Egypt were much stronger than those between Palestine and the East. One of the most considerable of these was the trade in horses. This traffic had been begun by Solomon (<a onClick="return mV(\'1Ki\',10,28);">1Ki 10:28</a>f). The chief seat of the trade in Palestine was Lachish (<a onClick="return mV(\'Mic\',1,13);">Mic 1:13</a>). In their nomadic state the Israelites had used camels and donkeys, and the use of the horse was looked upon with suspicion by the prophets (<a onClick="return mV(\'Deu\',17,16);">De 17:16</a>; <a onClick="return mV(\'Zec\',9,10);">Zec 9:10</a>). When the horse is spoken of in the Old Testament, it is as the chief weapon of the enemies of the nation (<a onClick="return mV(\'Exd\',15,1);">Ex 15:1</a>; <a onClick="return mV(\'Jdg\',5,22);">Jud 5:22</a>, etc.).<P>5. Reaction under Manasseh:<P>On the death of Hezekiah, the nation reverted to the culture and manners of the time of Ahaz and even went farther than he in corrupt practices. Especially at this time human sacrifice became common in Israel (<a onClick="return mV(\'Mic\',6,7);">Mic 6:7</a>). The influence for good of the prophets had gone (<a onClick="return mV(\'2Ki\',21,1);">2Ki 21</a>). There is a curious story in <a onClick="return mV(\'2Ch\',33,11);">2Ch 33:11</a>f that Manasseh was taken captive by the Assyrians, and, after spending some time in captivity in Babylon, reformed and was restored to his throne. His son, however, undid these reforms, and public discontent grew to such an extent that he was assassinated (<a onClick="return mV(\'2Ki\',21,19);">2Ki 21:19</a>).<P>6. Triumph of Reform Party:<P>Once more the tide turned in the direction of reform, and on this occasion it rose higher than ever before. The reformation under Josiah was never again wholly undone. The enthusiasm of the iconoclasts carried them far beyond the frontiers of Judah (<a onClick="return mV(\'2Ch\',34,6);">2Ch 34:6</a>), for on this occasion they were backed up by the newly found "Book of the Law." All boded well for a prosperous reign, but unforeseen disasters came from without. The Scythian invasion swept over southwestern Asia (<a onClick="return mV(\'Jer\',1,\'14-16\');">Jer 1:14-16</a>; <a onClick="return mV(\'Jer\',6,1);">6:1</a>, etc.). The storm passed, and hope rose higher than before, for the power of Assyria had been shattered forever.<P>7. Babylonia and Judah:<P>Already in 722, when Sargon seized the throne on the death of Shalmaneser, Babylonia had revolted, and crowned Marduk-baladan king (<a onClick="return mV(\'Isa\',39,1);">Isa 39:1</a>). Hezekiah received a deputation from Babylonia (<a onClick="return mV(\'2Ki\',20,12);">2Ki 20:12</a>), no doubt in the hope of freeing himself from the Assyrian danger by such an alliance. The revolt of Merodach-baladan was maintained for 12 years; then it was suppressed. There was, however, a second revolt of Babylonia on the accession of Sennacherib, Sargon\'s son, in 705, which went on till 691, and the events referred to in <a onClick="return mV(\'2Ki\',20,1);">2Ki 20</a> may have happened at this time, for Hezekiah\'s reign seems to have ended prosperously.<P>8. End of Assyrian Empire:<P>Sennacherib was assassinated in 681 (<a onClick="return mV(\'Isa\',37,38);">Isa 37:38</a>) and was succeeded by his son Esar-haddon, who rebuilt Babylon, razed to the ground by his father, and under whom the province remained quiet. In 674 hostilities with Egypt broke out, and that country was overrun, and <a href="./study/isbe/search.html?string=TIRHAKAH">TIRHAKAH</a> (which see) was expe
