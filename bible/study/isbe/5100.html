isbe[5103]='John, the Epistles of, Part 1-3`<b>I. GENERAL CHARACTER</b><P class="in15">1. A True Letter<P class="in15">2. Subject-Matter<P class="in15">3. Characteristics of the Writer<P class="in15">4. Style and Diction<P><b>II. POLEMICAL AIM</b><P class="in15">1. Gnosticism<P class="in15">2. Docetism<P class="in15">3. Antinomianism<P class="in15">4. Cerinthus<P><b>III. STRUCTURE AND SUMMARY</b><P class="in15">1. The Prologue, <span class="noTag">1 John 1:1-4</span><P class="in15">2. First Cycle, <span class="noTag">1 John 1:5-2:28</span><P class="in30">The Christian Life as Fellowship with God (Walking in the Light) Tested by Righteousness, Love and Belief<P class="in30">(a) Paragraph A, <span class="noTag">1 John 1:8-2:6</span><P class="in30">(b) Paragraph B, <span class="noTag">1 John 2:7-17</span><P class="in45">(i) Positively<P class="in45">(ii) Negatively<P class="in30">(c) Paragraph C, <span class="noTag">1 John 2:18-28</span><P class="in15">3. Second Cycle, <span class="noTag">1 John 2:29-4:6</span><P class="in30">Divine Sonship Tested by Righteousness, Love and Belief<P class="in30">(a) Paragraph A, <span class="noTag">1 John 2:29-3:10a</span><P class="in30">(b) Paragraph B, <span class="noTag">1 John 3:10b-24b</span><P class="in30">(c) Paragraph C, <span class="noTag">1 John 3:24b through 4:6</span><P class="in15">4. Third Cycle, <span class="noTag">1 John 4:7-5:21</span><P class="in30">Closer Correlation of Righteousness, Love and Belief<P class="in30">(a) Section I, <span class="noTag">1 John 4:7-5:3a</span><P class="in45">(i) Paragraph A, <span class="noTag">1 John 4:7-12</span><P class="in45">(ii) Paragraph B, <span class="noTag">1 John 4:13-16</span><P class="in45">(iii) Paragraph C, <span class="noTag">1 John 4:17-5:3a</span><P class="in30">(b) Section II, <span class="noTag">1 John 5:3b-21</span><P class="in45">(i) Paragraph A, <span class="noTag">1 John 5:3b-12</span><P class="in45">(ii) Paragraph B, <span class="noTag">1 John 5:13-21</span><P><b>IV. CANONICITY AND AUTHORSHIP</b><P class="in15">1. Traditional View<P class="in15">2. Critical Views<P class="in15">3. Internal Evidence<P><b>V. RELATIONSHIP TO THE FOURTH GOSPEL</b><P class="in15">1. Common Characteristics<P class="in15">2. Coincidences of Vocabulary<P class="in15">3. Divergences of Vocabulary<P class="in15">4. Arguments against Unity of Authorship<P class="in15">5. Conclusion<P class="in15">6. Question of Priority<P><b>LITERATURE</b><hr /><P>Among the 7 New Testament epistles which from ancient times have been called "catholic" (universal) there is a smaller group of three in which the style alike of thought and language points to a common authorship, and which are traditionally associated with the name of the apostle John. Of these, again, the first differs widely from the other two in respect not only of intrinsic importance, but of its early reception in the church and unquestioned canonicity.<P>THE FIRST EPISTLE<P>I. General Character.<P>1. A True Letter:<P>Not only is the Epistle an anonymous writing; one of its unique features among the books of the New Testament is that it does not contain a single proper name (except our Lord\'s), or a single definite allusion, personal, historical, or geographical. It is a composition, however, which a person calling himself "I" sends to certain other persons whom he calls "you," and is, in form at least, a letter. The criticism which has denied that it is more than formally so is unwarranted. It does not fall under either of Deissmann\'s categories—the true letter, intended only for the perusal of the person or persons to whom it is addressed, and the epistle, written with literary art and with an eye to the public. But it does possess that character of the New Testament epistles in general which is well described by Sir William Ramsay (Letters to the Seven Churches of Asia, 24): "They spring from the heart of the writer and speak direct to the heart of the readers. They were often called forth by some special crisis in the history of the persons addressed, so that they rise out of the actual situation in which the writer conceives the readers to be placed; they express the writer\'s keen and living sympathy with and participation in the fortunes of the whole class addressed, and are not affected by any thought of a wider public....On the other hand, the letters of this class express general principles of life and conduct, religion and ethics, applicable to a wider range of circumstances than those which called them forth; and they appeal as emphatically and intimately to all Christians in all time as they did to those addressed in the first instance." The 1st Epistle of John could not be more exactly characterized than by these words. Though its main features are didactic and controversial, the personal note is frequently struck, and with much tenderness and depth of feeling. Under special stress of emotion, the writer\'s paternal love, sympathy and solicitude break out in the affectionate appellation, "little children," or, yet more endearingly, "my little children." Elsewhere the prefatory "beloved" shows how deeply he is stirred by the sublimity of his theme and the sense of its supreme importance to his readers. He shows himself intimately acquainted with their religious environment (<a onClick="return mV(\'1Jo\',2,19);">1Joh 2:19</a>; <a onClick="return mV(\'1Jo\',4,1);">4:1</a>), dangers (<a onClick="return mV(\'1Jo\',2,26);">1Joh 2:26</a>; <a onClick="return mV(\'1Jo\',3,7);">3:7</a>; <a onClick="return mV(\'1Jo\',5,21);">5:21</a>), attainments (<a onClick="return mV(\'1Jo\',2,\'12-14\',21);">1Joh 2:12-14,21</a>), achievements (<a onClick="return mV(\'1Jo\',4,4);">1Joh 4:4</a>) and needs (<a onClick="return mV(\'1Jo\',3,19);">1Joh 3:19</a>; <a onClick="return mV(\'1Jo\',5,13);">5:13</a>). Further, the Epistle is addressed primarily to the circle of those among whom the author has habitually exercised his ministry as evangelist and teacher. He has been wont to announce to them the things concerning the Word of Life (<a onClick="return mV(\'1Jo\',1,1,2);">1Joh 1:1,2</a>), that they might have fellowship with him (<a onClick="return mV(\'1Jo\',1,3);">1Joh 1:3</a>), and now, that his (or their) joy may be full, he writes these things unto them (<a onClick="return mV(\'1Jo\',1,4);">1Joh 1:4</a>). He writes as light shines. Love makes the task a necessity, but also a delight.<P>2. Subject-Matter:<P>There is no New Testament writing which is throughout more vigorously controversial: for the satisfactory interpretation of the Epistle as a whole, recognition of the polemical aim that pervades it is indispensable. But it is true also that there is no such writing in which the presentation of the truth more widely overflows the limits of the immediate occasion. The writer so constantly lifts up against the error he combats, the simple, sublime and satisfying facts and principles of the Christian revelation, so lifts up every question at issue into the light of eternal truth, that the Epistle pursues its course through the ages, bringing to the church of God the vision and the inspiration of the Divine. The influence of the immediate polemical purpose, however, is manifest, not only in the contents of the Epistle, but in its limitations as well. In a sense it may be said that the field of thought is a narrow one. God is seen exclusively as the Father of Spirits, the Light and Life of the universe of souls. His creatorship and government of the world, the providential aspects and agencies of salvation, the joys and sorrows, hopes and fears that spring from the terrestrial conditions and changes of human life, their disciplinary purpose and effect—to all this the Epistle contains no reference. The themes are exclusively theological and ethical. The writer\'s immediate interest is confined to that region in which the Divine and human vitally and directly meet—to that in God which is communicable to man, to that in man by which he is capax Dei. The Divine nature as life and light, and love and righteousness; the Incarnation of this Divine nature in Jesus, with its presuppositions and consequences, metaphysical and ethical; the imparting of this Divine nature to men by regeneration; the antithesis to it—sin—and its removal by propitiation; the work of the Holy Spirit; the Christian life, the mutual indwelling of God and man, as tested by its beliefs, its antagonism to sin, its inevitable debt of love—such are the fundamental themes to which every idea in the Epistle is directly related. The topics, if few, are supremely great; and the limitations of the field of vision are more than compensated by the profundity and intensity of spiritual perception.<P>3. Characteristics of the Writer:<P>The Epistle is in a sense impersonal to the last degree, offering a strange contrast to that frankness of self-revelation which gives such charm to Paul\'s letters; yet few writings so clearly reveal the deepest characteristics of the writer. We feel in it the high serenity of a mind that lives in constant fellowship with the greatest thoughts and is nourished at the eternal fountain-head; but also the fervent indignation and vehement recoil of such a mind in contact with what is false and evil. It has been truly called "the most passionate" book in the New Testament. Popular instinct has not erred in giving to its author the title, "Apostle of Love." Of the various themes which are so wonderfully intertwined in it, that to which it most of all owes its unfading charm and imperishable value is love. It rises to its sublimest height, to the apex of all revelation, in those passages in which its author is so divinely inspired to write of the eternal life, in God and man, as love.<P>But it is an inveterate misconception which regards him solely as the exponent of love. Equally he reveals himself as one whose mind is dominated by the sense of truth. There are no words more characteristic of him than "true" (alethinos, denoting that which both ideally and really corresponds to the name it bears) and "the truth" (aletheia, the reality of things sub specie aeternitatis). To him Christianity is not only a principle of ethics, or even a way of salvation; it is both of them, because it is primarily the truth, the one true disclosure of the realities of the spiritual and eternal world. Thus it is that his thought so constantly develops itself by antithesis. Each conception has its fundamental opposite: light, darkness; life, death; love, hate; truth, falsehood; the Father, the world; God, the devil. There is no shading, no gradation in the picture. No sentence is more characteristic of the writer than this: "Ye know that no lie is of the truth" (<a onClick="return mV(\'1Jo\',2,21);">1Joh 2:21</a> margin). But again, his sense of these radical antagonisms is essentially moral, rather than intellectual. It seems impossible that any writing could display a more impassioned sense, than this Epistle does, of the tremendous imperative of righteousness, a more rigorous intolerance of all sin (<a onClick="return mV(\'1Jo\',2,4);">1Joh 2:4</a>; <a onClick="return mV(\'1Jo\',3,4,8,9,10);">3:4,8,9,10</a>). The absolute antagonism and incompatibility between the Christian life and sin of whatsoever kind or degree is maintained with a vehemence of utterance that verges at times upon the paradoxical (<a onClick="return mV(\'1Jo\',3,9);">1Joh 3:9</a>; <a onClick="return mV(\'1Jo\',5,18);">5:18</a>). So long as the church lays up this Epistle in its heart, it can never lack a moral tonic of wholesome severity.<P>4. Style and Diction:<P>The style is closely, though perhaps unconsciously, molded upon the Hebrew model, and especially upon the parallelistic forms of the Wisdom literature. One has only to read the Epistle with an attentive ear to perceive that, though using another language, the writer had in his own car, all the time, the swing and cadences of Hebrew verse. The diction is inartificial and unadorned. Not a simile, not a metaphor (except the most fundamental, like "walking in the light") occurs. The limitations in the range of ideas are matched by those of vocabulary and by the unvarying simplicity of syntactical form. Yet limited and austere as the literary medium is, the writer handles its resources often with consummate skill. The crystalline simplicity of the style perfectly expresses the simple profundity of the thought. Great spiritual intuitions shine like stars in sentences of clear-cut gnomic terseness. Historical (<a onClick="return mV(\'1Jo\',1,1);">1Joh 1:1</a>) and theological (<a onClick="return mV(\'1Jo\',1,2);">1Joh 1:2</a>; <a onClick="return mV(\'1Jo\',4,2);">4:2</a>) statements are made with exquisite precision. The frequent reiteration of nearly the same thoughts in nearly the same language, though always with variation and enrichment, gives a cumulative effect which is singularly impressive. Such passages as <a onClick="return mV(\'1Jo\',2,\'14-17\');">1Joh 2:14-17</a>, with its calm challenge to the arrogant materialism of the world—"And the world passeth away, and the lust thereof: but he that doeth the will of God abideth for ever"—or the closing verses of the Epistle, with their thrice-repeated triumphant "we know" and their last word of tender, urgent admonition, have a solemn magnificence of effect which nothing but such simplicity of language, carrying such weight of thought, could produce. If it has been true of any writer that "le style est l\'homme," it is true of the author of this Epistle.<P>II. Polemical Aim.<P>The polemical intention of the Epistle has been universally recognized; but there has been diversity of opinion as to its actual object. By the older commentators, generally, this was found in the perilous state of the church or churches addressed, which had left their first love and lapsed into Laodicean lukewarmness. But the Epistle gives no sign of this, and it contains many passages that are inconsistent with it (<a onClick="return mV(\'1Jo\',2,13,14,20,21,27);">1Joh 2:13,14,20,21,27</a>; <a onClick="return mV(\'1Jo\',4,4);">4:4</a>; <a onClick="return mV(\'1Jo\',5,\'18-20\');">5:18-20</a>). The danger which immediately threatens the church is from without, not from within. There is a "spirit of error" (<a onClick="return mV(\'1Jo\',4,6);">1Joh 4:6</a>) abroad in the world. From the church itself (<a onClick="return mV(\'1Jo\',2,18);">1Joh 2:18</a>), many "false prophets" have gone forth (<a onClick="return mV(\'1Jo\',4,1);">1Joh 4:1</a>), corrupters of the gospel, veritable antichrists (<a onClick="return mV(\'1Jo\',2,18);">1Joh 2:18</a>). And it may be asserted as beyond question that the peril against which the Epistle was intended to arm the church was the spreading influence of some form of Gnosticism.<P>1. Gnosticism:<P>The pretensions of Gnosticism to a higher esoteric knowledge of Divine things seems to be clearly referred to in several passages. In <a onClick="return mV(\'1Jo\',2,4,6,9);">1Joh 2:4,6,9</a>, e.g. one might suppose that they are almost verbally quoted ("He that saith"; "I know Him"; "I abide in Him"; "I am in the light"). When we observe, moreover, the prominence given throughout to the idea of knowledge and the special significance of some of these passages, the conviction grows that the writer\'s purpose is not only to refute the false, but to exhibit apostolic Christianity, believed and lived, as the true Gnosis—the Divine reality of which Gnosticism was but a fantastic caricature. The confidence he has concerning his readers is that they "know him who is from the beginning," that they "know the Father" (<a onClick="return mV(\'1Jo\',2,13);">2:13</a>). "Every one that loveth is begotten of God, and knoweth God" (<a onClick="return mV(\'1Jo\',4,7);">4:7</a>); and the final note upon which the Epistle closes is: "We know him that is true, and we are in him that is true" (<a onClick="return mV(\'1Jo\',5,20);">5:20</a>). The knowledge of the ultimate Reality, the Being who is the eternal life, is for Christian and Gnostic alike the goal of aspiration.<P>But it is against two closely related developments of Gnostic tendency, a docetic view of the incarnation, and an antinomian view of morals, that the Epistle is specifically directed. Both of these sprang naturally from the dualism which was the fundamental and formative principle of Gnosticism in all its many forms. According to the dualistic conception of existence, the moral schism of which we are conscious in experience is original, eternal, inherent in the nature of beings. There are two independent and antagonistic principles of being from which severally come all the good and all the evil that exist. The source and the seat of evil were found in the material element, in the body with its senses and appetites, and in its sensuous earthly environment; and it was held inconceivable that the Divine nature should have immediate contact with the material side of existence, or influence upon it.<P>2. Docetism:<P>To such a view of the universe Christianity could be adjusted only by a docetic interpretation of the Person of Christ. A real incarnation was unthinkable. The Divine could enter into no actual union with a corporeal organism. The human nature of Christ and the incidents of His earthly career were more or less an illusion. And it is with this docetic subversion of the truth of the incarnation that the "antichrists" are specially identified (<a onClick="return mV(\'1Jo\',2,22,23);">1Joh 2:22,23</a>; <a onClick="return mV(\'1Jo\',4,2,3);">4:2,3</a>), and against it that John directs with wholehearted fervor his central thesis—the complete, permanent, personal identification of the historical Jesus with the Divine Being who is the Word of Life (<a onClick="return mV(\'1Jo\',1,1);">1Joh 1:1</a>), the Christ (<a onClick="return mV(\'1Jo\',4,2);">1Joh 4:2</a>) and the Son of God (<a onClick="return mV(\'1Jo\',5,5);">1Joh 5:5</a>): "Jesus is the Christ come in the flesh." In <a onClick="return mV(\'Jhn\',5,6);">Joh 5:6</a> there is a still more definite reference to the special form which Gnostic Christology assumed in the teaching of Cerinthus and his school. According to Irenaeus (Adv. Haer., i.26, 1) this Cerinthus, who was John\'s prime antagonist in Ephesus, taught that Jesus was the son of Joseph and Mary, and was distinguished from other men only by superiority in justice, prudence and wisdom; that at His baptism the heavenly Christ descended upon Him in the form of a dove; that on the eve of His Passion, the Christ again left Jesus, so that Jesus died and rose again, but the Christ, being spiritual, did not suffer. That is to say, that, in the language of the Epistle, the Christ "came by water," but not, as John strenuously affirms, "by water and blood...not with the water only, but with the water and with the blood" (<a onClick="return mV(\'1Jo\',5,6);">1Joh 5:6</a>). He who was baptized of John in Jordan, and He whose life-blood was shed on Calvary, is the same Jesus and the same Christ, the same Son of God eternally.<P>3. Antinomianism:<P>A further consequence of the dualistic interpretation of existence is that sin, in the Christian meaning of sin, disappears. It is no longer a moral opposition (anomia), in the human personality, to good; it is a physical principle inherent in all nonspiritual being. Not the soul, but the flesh is its organ; and redemption consists, not in the renewal of the moral nature, but in its emancipation from the flesh. Thus it is no mere general contingency, but a definite tendency that is contemplated in the repeated warning: "If we say that we have no sin, we deceive ourselves, and the truth is not in us....If we say that we have not sinned, we make him a liar, and his word is not in us" (<a onClick="return mV(\'1Jo\',1,8,10);">1Joh 1:8,10</a>).<P>With the nobler and more earnest spirits the practical corollary of this irreconcilable dualism in human nature was the ascetic life; but to others the same principle readily suggested an opposite method of achieving the soul\'s deliverance from the yoke of the material—an attitude of moral indifference toward the deeds of the body. Let the duality of nature be boldly reduced to practice. Let body and spirit be regarded as separate entities, each obeying its own laws and acting according to its own nature, without mutual interference; the spiritual nature could not be involved in, nor affected by, the deeds of the flesh. Vehement opposition to this deadly doctrine is prominent in the Epistle—in such utterances as "Sin is lawlessness" (<a onClick="return mV(\'1Jo\',3,4);">1Joh 3:4</a>) and its converse "All unrighteousness is sin" (<a onClick="return mV(\'1Jo\',5,17);">1Joh 5:17</a>), but especially in the stringent emphasis laid upon actual conduct, "doing" righteousness or "doing" sin. The false spiritualism which regards the contemplation of heavenly things as of far superior importance to the requirements of commonplace morality is sternly reprobated: "Little children, let no man lead you astray: he that doeth righteousness is righteous, even as he is righteous" (<a onClick="return mV(\'1Jo\',3,7);">1Joh 3:7</a>); and the converse application of the same doctrine, that the mere "doing" of sin is of little or no moment to the "spiritual" man, is met with the trenchant declaration, "He that doeth sin is of the devil" (<a onClick="return mV(\'1Jo\',3,8);">1Joh 3:8</a>). The whole passage (<a onClick="return mV(\'1Jo\',2,\'29-\');">1Joh 2:29</a>-<a onClick="return mV(\'1Jo\',3,\'1-10\');">3:10</a>) presupposes, as familiar to its readers, a doctrine of moral indifferentism according to which the status of the spiritual man is not to be tested by the commonplace facts of moral conduct. It is only as a passionate contradiction of this hateful tenet that the paradoxical language of <a onClick="return mV(\'1Jo\',3,6,9);">1Joh 3:6,9</a> and <a onClick="return mV(\'1Jo\',5,18);">5:18</a> can be understood.<P>To the same polemical necessity is due the uniquely reiterated emphasis which the Epistle lays upon brotherly love, and the almost fierce tone in which the new commandment is promulgated. To the Gnostic, knowledge was the sum of attainment. "They give no heed to love," says Ignatius, "caring not for the widow, the orphan or the afflicted, neither for those who are in bonds nor for those who are released from bonds, neither for the hungry nor the thirsty." That a religion which banished or neglected love should call itself Christian or claim affinity with Christianity excites John\'s hottest indignation; against it he lifts up his supreme truth, God is love, with its immediate consequence that to be without love is to be without capacity for knowing God (<a onClick="return mV(\'1Jo\',4,7,8);">1Joh 4:7,8</a>). The assumption of a lofty mystical piety apart from dutiful conduct in the ordinary relations of life is ruthlessly underlined as the vaunt of a self-deceiver (<a onClick="return mV(\'1Jo\',4,20);">1Joh 4:20</a>); and the crucial test by which we may assure our self-accusing hearts that we are "of the truth" is love "not in word, neither with the tongue; but in deed and truth" (<a onClick="return mV(\'1Jo\',3,18);">1Joh 3:18</a>).<P>The question is raised whether the polemic of the Epistle is directed against the same persons throughout or whether in its two branches, the Christological and the ethical, it has different objects of attack. The latter view is maintained on the ground that no charge of libertine teaching or conduct is brought against the "antichrists," and there is no proof that docetism in Asia Minor lay open to such a charge. But the other view has greater probability. The Epistle suggests nothing else than that the same spirit of error which is assailing the faith of the church (<a onClick="return mV(\'1Jo\',4,6);">1Joh 4:6</a>) is also a peril to the moral integrity of its life (<a onClick="return mV(\'1Jo\',3,7);">1Joh 3:7</a>). And if there is no proof that docetism in Asia Minor was also antinomian, there is no proof that it was not. The probability is that it was. Docetism and the emancipation of the flesh were both natural fruits of the dualistic theory of life.<P>4. Cerinthus:<P>The name, which unvarying tradition associates with the Epistle, as John\'s chief antagonist in Ephesus, is that of Cerinthus. Unfortunately the accounts which have come down to us of Cerinthus and his teaching are fragmentary and confused, and those of his character, though unambiguous, come only from his opponents. But it is certain that he held a docetic view of the incarnation, and, according to the only accounts we possess, his character was that of a voluptuary. So far as they go, the historical data harmonize with the internal evidence of the Epistle itself in giving the impression that the different tendencies it combats are such as would be naturally evolved in the thought and practice of those who held, as Cerinthus did, that the material creation, and even the moral law, had its origin, not in the Supreme God, but in an inferior power.<P>III. Structure and Summary.<P>In the judgment of many critics, the Epistle possesses nothing that can be called an articulate structure of thought, its aphoristic method admitting of no logical development; and this estimate has a large measure of support in the fact that there is no New Testament writing regarding the plan of which there has been greater variety of opinion. The present writer believes, nevertheless, that it is erroneous, and that, in its own unique way, the Epistle is a finely articulated composition. The word that best describes the author\'s mode of thinking is "spiral." The course of thought does not move from point to point in a straight line. It is like a winding staircase—always revolving around the same center, always recurring to the same topics, but at a higher level.<P>Carefully following the topical order, one finds, e.g., a paragraph (<a onClick="return mV(\'1Jo\',2,\'3-6\');">1Joh 2:3-6</a>) insisting upon practical righteousness as a guaranty of the Christian life; then one finds this treated a second time in <a onClick="return mV(\'1Jo\',2,\'29-\');">1Joh 2:29</a>-<a onClick="return mV(\'1Jo\',3,\'1-10\');">3:10a</a>; and yet again in <a onClick="return mV(\'1Jo\',5,3);">5:3</a> and <a onClick="return mV(\'1Jo\',5,18);">5:18</a>. Similarly, we find a paragraph on the necessity of love in <a onClick="return mV(\'1Jo\',2,\'7-11\');">2:7-11</a>, and again in <a onClick="return mV(\'1Jo\',3,\'10-20\');">3:10b-20</a>, and yet again in <a onClick="return mV(\'1Jo\',4,\'7-13\');">4:7-13</a>, and also in <a onClick="return mV(\'1Jo\',4,\'17-\');">4:17</a>-<a onClick="return mV(\'1Jo\',5,1,2);">5:2</a>. So also, a paragraph concerning the necessity of holding the true belief in the incarnate Son of God in <a onClick="return mV(\'1Jo\',2,\'18-28\');">2:18-28</a>, in <a onClick="return mV(\'1Jo\',4,\'1-6\');">4:1-6</a>, and the same subject recurring in <a onClick="return mV(\'1Jo\',4,\'13-16\');">4:13-16</a> and <a onClick="return mV(\'1Jo\',5,\'4-12\');">5:4-12</a>. And we shall observe that everywhere these indispensable characteristics of the Christian life are applied as tests; that in effect the Epistle is an apparatus of tests, its definite object being to furnish its readers with the necessary criteria by which they may sift the false from the true, and satisfy themselves of their being "begotten of God." "These things have I written unto you, that ye may know that ye have eternal life" (<a onClick="return mV(\'1Jo\',5,13);">5:13</a>). These fundamental tests of the Christian life—doing righteousness, loving one another, believing that Jesus is the Christ come in the flesh—are the connecting themes that bind together the whole structure of the Epistle. Thus, if we divide the Epistle into 3 main sections, the first ending at <a onClick="return mV(\'1Jo\',2,28);">2:28</a>, the second at <a onClick="return mV(\'1Jo\',4,6);">4:6</a>, the result is that in the first and second of these sections we find precisely the same topics coming in precisely the same order; while in the third section (<a onClick="return mV(\'1Jo\',7,\'7-\');">4:7</a>-<a onClick="return mV(\'1Jo\',5,\'1-21\');">5:21</a>), though the sequence is somewhat different, the thought-material is exactly the same. The leading themes, the tests of righteousness, love, and belief, are all present; and they alone are present. There is, therefore, a natural division of the Epistle into these three main sections, or, as they might be descriptively called, "cycles," in each of which the same fundamental themes appear. On this basis we shall now give a brief analysis of its structure and summary of its contents.<P>1. The Prologue, <a onClick="return mV(\'1Jo\',1,\'1-4\');">1 John 1:1-4</a>:<P>The writer announces the source of the Christian revelation—the historical manifestation of the eternal Divine life in Jesus Christ—and declares himself a personal witness of the facts in which this manifestation has been given. Here, at the outset, he hoists the flag under which he fights. The incarnation is not seeming or temporary, but real. That which was from the beginning—"the eternal life, which was with the Father"—is identical with "that which we have heard, that which we have seen with our eyes, that which we beheld, and our hands handled."<P>2. First Cycle, <a onClick="return mV(\'1Jo\',1,\'5-\');">1 John 1:5</a>-<a onClick="return mV(\'1Jo\',2,\'1-28\');">2:28</a>:<P>The Christian life, as fellowship with God (walking in the Light) tested by righteousness, love and belief.—The basis of the whole section is the announcement: "God is light, and in him is no darkness at all" (<a onClick="return mV(\'1Jo\',1,5);">1Joh 1:5</a>). What God is at once determines the condition of fellowship with Him; and this, therefore, is set forth: first, negatively (<a onClick="return mV(\'1Jo\',1,6);">1Joh 1:6</a>): "if we say that we have fellowship with him and walk in the darkness"; then, positively (<a onClick="return mV(\'1Jo\',1,7);">1Joh 1:7</a>): "if we walk in the light, as he is in the light." What, then, is it to walk in the light, and what to walk in darkness? The answer is given in what follows.<P>(a) Paragraph A, <a onClick="return mV(\'1Jo\',1,\'8-\');">1 John 1:8</a>-<a onClick="return mV(\'1Jo\',2,\'1-6\');">2:6</a>:<P>(Walking in the Light tested by righteousness): First, in confession of sin (<a onClick="return mV(\'1Jo\',1,\'8-\');">1Joh 1:8</a>-<a onClick="return mV(\'1Jo\',2,1,2);">2:2</a>), then in actual obedience (<a onClick="return mV(\'1Jo\',2,\'3-6\');">1Joh 2:3-6</a>). The first fact upon which the light of God impinges in human life is sin; and the first test of walking in the light is the recognition and confession of this fact. Such confession is the first step into fellowship with God, because it brings us under the cleansing power of the blood of Jesus, His Son (<a onClick="return mV(\'1Jo\',1,7);">1Joh 1:7</a>), and makes His intercession available for us (<a onClick="return mV(\'1Jo\',2,1);">1Joh 2:1</a>). But the light not only reveals sin; its greater function is to reveal duty; and to walk in the light is to keep God\'s commandments (<a onClick="return mV(\'1Jo\',2,3);">1Joh 2:3</a>), His word (<a onClick="return mV(\'1Jo\',2,5);">1Joh 2:5</a>), and to walk even as Christ walked (<a onClick="return mV(\'1Jo\',2,6);">1Joh 2:6</a>).<P>(b) Paragraph B, <a onClick="return mV(\'1Jo\',2,\'7-17\');">1 John 2:7-17</a>:<P>(Walking in the Light tested by love):<P>(i) Positively:<P>The old-new commandment (<a onClick="return mV(\'1Jo\',2,\'7-11\');">1Joh 2:7-11</a>). Love is the commandment which is "old," because familiar to the readers of the Epistle from their first acquaintance with the rudiments of Christianity (<a onClick="return mV(\'1Jo\',2,7);">1Joh 2:7</a>); but also "new," because ever fresh and living to those who have fellowship with Christ in the true light which is now shining for them (<a onClick="return mV(\'1Jo\',2,8);">1Joh 2:8</a>). On the contrary, "He that saith he is in the light and hateth his brother, is in the darkness" (<a onClick="return mV(\'1Jo\',2,9);">1Joh 2:9</a>). The antithesis is then repeated with variation and enrichment of thought (<a onClick="return mV(\'1Jo\',2,10,11);">1Joh 2:10,11</a>). (Then follows a parenthetical address to the readers (<a onClick="return mV(\'1Jo\',2,\'12-14\');">1Joh 2:12-14</a>). This being treated as a parenthesis, the unity of the paragraph at once becomes apparent.)<P>(ii) Negatively:<P>If walking in the light has its guaranty in loving one\'s "brother," it is tested no less by not loving "the world." One cannot at the same time participate in the life of God and in a moral life which is governed by the lust of the flesh, the lust of the eyes, and the vain-glory of the world.<P>(c) Paragraph C, <a onClick="return mV(\'1Jo\',2,\'18-28\');">1 John 2:18-28</a>:<P>(Walking in the Light tested by belief): The light of God not only reveals sin and duty, the children of God (our "brother") and "the world" in their true character; it also reveals Jesus in His true character, as the Christ, the incarnate Son of God. And all that calls itself Christianity is to be tested by its reception or rejection of that truth. In this paragraph light and darkness are not expressly referred to; but the continuity of thought with the preceding paragraphs is unmistakable. Throughout this first division of the Epistle the point of view is that of fellowship with God, through receiving and acting according to the light which His self-revelation sheds upon all things in the spiritual realm. Unreal Christianity in every form is comprehensively a "lie." It may be the antinomian "lie" of him who says he has no sin (<a onClick="return mV(\'1Jo\',1,8);">1Joh 1:8</a>) yet is indifferent to keeping God\'s commandments (<a onClick="return mV(\'1Jo\',2,4);">1Joh 2:4</a>), the lie of lovelessness (<a onClick="return mV(\'1Jo\',2,9);">1Joh 2:9</a>), or the lie of Antichrist, who, claiming spiritual enlightenment, yet denies that Jesus is the Christ (<a onClick="return mV(\'1Jo\',2,22);">1Joh 2:22</a>).<P>3. Second Cycle, <a onClick="return mV(\'1Jo\',2,\'29-\');">1 John 2:29-4:6</a>:<P>Divine Sonship Tested by Righteousness, Love and Belief.<P>The first main division of the Epistle began with the assertion of what God is as self-revealing—light. He becomes to us the light in which we behold our sin, our duty, our brother, the world, Jesus the Christ; and only in acknowledging and loyally acting out the truth thus revealed can we have fellowship with God. This second division, on the other hand, begins with the assertion of what the Divine nature is in itself, and thence deduces the essential characteristics of those who are "begotten of God."<P>(a) Paragraph A, <a onClick="return mV(\'1Jo\',2,\'29-\');">1 John 2:29</a>-<a onClick="return mV(\'1Jo\',3,\'1-10\');">3:10a</a>:<P>(Divine sonship tested by righteousness): This test is inevitable. "If ye know that he is righteous, ye know that every one also that doeth righteousness is begotten of him" (<a onClick="return mV(\'1Jo\',2,29);">1Joh 2:29</a>). But this new idea, "Begotten of God," arrests for a time its orderly development. The writer is carried away by wonder and thanksgiving at the thought that sinful man should be brought into such a relation as this to God. "Behold what manner of love!" he exclaims. This leads him to contemplate, further, the present concealment of the glory of God\'s children, and the splendor of its future manifestation (<a onClick="return mV(\'1Jo\',3,1,2);">1Joh 3:1,2</a>). Then the thought that the fulfillment of this hope is necessarily conditioned by present endeavor after moral likeness to Christ (<a onClick="return mV(\'1Jo\',3,3);">1Joh 3:3</a>) leads back to the main theme, that the life of Divine sonship is by necessity of nature one of absolute antagonism to all sin. This necessity is exhibited<p class="in15">(1) in the light of the moral authority of God—sin is lawlessness (<a onClick="return mV(\'1Jo\',3,4);">1Joh 3:4</a>);<p class="in15">(2) in the light of Christ\'s character, in which there is no sin, and of the purpose of His mission, which is to take away sin (<a onClick="return mV(\'1Jo\',3,\'5-7\');">1Joh 3:5-7</a>);<p class="in15">(3) in the light of the diabolic origin of sin (<a onClick="return mV(\'1Jo\',3,8);">1Joh 3:8</a>);<p class="in15">(4) in the light of the God-begotten quality of the Christian life (<a onClick="return mV(\'1Jo\',3,9);">1Joh 3:9</a>).<p>Finally, in this is declared to be the manifest distinction between the children of God and the children of the devil (<a onClick="return mV(\'1Jo\',3,10);">1Joh 3:10</a>).<P>(b) Paragraph B, <a onClick="return mV(\'1Jo\',3,\'10-24\');">1 John 3:10b-24a</a>:<P>(Divine sonship tested by love): This test is inevitable (<a onClick="return mV(\'1Jo\',3,10,11);">1Joh 3:10,11</a>). The thought is then developed pictorially instead of dialectically. Cain is the prototype of hate (<a onClick="return mV(\'1Jo\',3,12);">1Joh 3:12</a>). Cain\'s spirit is reproduced in the world (<a onClick="return mV(\'1Jo\',3,13);">1Joh 3:13</a>). Love is the sign of having passed from death into life (<a onClick="return mV(\'1Jo\',3,14);">1Joh 3:14a</a>); the absence of it, the sign of abiding in death (<a onClick="return mV(\'1Jo\',3,14,15);">1Joh 3:14,15</a>). In glorious contrast to the sinister figure of Cain, who sacrifices his brother\'s life to his morbid self-love, is the figure of Christ, who sacrificed His own life in love to us His brethren (<a onClick="return mV(\'1Jo\',3,16);">1Joh 3:16a</a>); whence the inevitable inference that our life, if one with His, must obey the same law (<a onClick="return mV(\'1Jo\',3,16);">1Joh 3:16</a>). Genuine love consists not in words, but in deeds (<a onClick="return mV(\'1Jo\',3,17,18);">1Joh 3:17,18</a>); and from the evidence of such love alone can we rightly possess confidence toward God (<a onClick="return mV(\'1Jo\',3,19,20);">1Joh 3:19,20</a>) in prayer (<a onClick="return mV(\'1Jo\',3,22);">1Joh 3:22</a>). Then follows recapitulation (<a onClick="return mV(\'1Jo\',3,23,24);">1Joh 3:23,24b</a>), combining, under the category of "commandment," love and also belief on His Son Jesus Christ. Thus a transition is made to Paragraph C.<P>(c) Paragraph C, <a onClick="return mV(\'1Jo\',3,\'24-\');">1 John 3:24b</a> through <a onClick="return mV(\'1Jo\',4,\'1-6\');">4:6</a>:<P>(Divine sonship tested by belief): This test is inevitable (<a onClick="return mV(\'1Jo\',3,24);">1Joh 3:24</a>). "We know that he abideth in us, by the Spirit which he gave us"; and the Spirit "which he gave us" is the Spirit that "confesseth that Jesus Christ is come in the flesh" (<a onClick="return mV(\'1Jo\',4,2);">1Joh 4:2</a>). On the contrary, the Spirit that confesseth not Jesus is the spirit of Antichrist (<a onClick="return mV(\'1Jo\',4,3);">1Joh 4:3</a>) Then follows a characterization of those who receive the true and of those who receive the false teaching (<a onClick="return mV(\'1Jo\',4,\'4-6\');">1Joh 4:4-6</a>).<P>4. Third Cycle, <a onClick="return mV(\'1Jo\',4,\'7-\');">1 John 4:7</a>-<a onClick="return mV(\'1Jo\',5,\'1-21\');">5:21</a>:<P>Closer Correlation of Righteousness, Love and Belief.<P>In this closing part, the Epistle rises to its loftiest heights; but the logical analysis of it is more difficult. It may be divided into two main sections dealing respectively with love and belief.<P>(a) SECTION I, <a onClick="return mV(\'1Jo\',4,\'7-\');">1 John 4:7</a>-<a onClick="return mV(\'1Jo\',5,\'1-3\');">5:3a</a>.<P>(i) Paragraph A, <a onClick="return mV(\'1Jo\',4,\'7-12\');">1 John 4:7-12</a>:<P>This paragraph grounds more deeply than before the test of love. Love is indispensable, because God is love (<a onClick="return mV(\'1Jo\',4,7,8);">1Joh 4:7,8</a>). The proof that God is love is the mission of Christ (<a onClick="return mV(\'1Jo\',4,9);">1Joh 4:9</a>); which is also the absolute revelation of what love, truly so called, is (<a onClick="return mV(\'1Jo\',4,10);">1Joh 4:10</a>). But this love of God imposes upon us an unescapable obligation to love one another (<a onClick="return mV(\'1Jo\',4,11);">1Joh 4:11</a>); and only from the fulfillment of this can we obtain the assurance that "God abideth in us" (<a onClick="return mV(\'1Jo\',4,12);">1Joh 4:12</a>).<P>(ii) Paragraph B, <a onClick="return mV(\'1Jo\',4,\'13-16\');">1 John 4:13-16</a>:<P>This paragraph strives to show the inner relation between Christian belief and Christian love. The true belief is indispensable as a guaranty of Christian life, because the Spirit of God is its author (<a onClick="return mV(\'1Jo\',4,13);">1Joh 4:13</a>). The true belief is that "Jesus is the Son of God" (<a onClick="return mV(\'1Jo\',4,14,15);">1Joh 4:14,15</a>). In this is found the vital ground of Christian love (<a onClick="return mV(\'1Jo\',4,16);">1Joh 4:16</a>).<P>(iii) Paragraph C, <a onClick="return mV(\'1Jo\',4,\'17-\');">1 John 4:17</a>-<a onClick="return mV(\'1Jo\',5,\'1-3a\');">5:3a</a>:<P>Here the subject is the effect, motives and manifestations of brotherly love. The effect is confidence toward God (<a onClick="return mV(\'1Jo\',4,17,18);">1Joh 4:17,18</a>); the motives: <p class="in15">(1) God\'s love to us (<a onClick="return mV(\'1Jo\',4,19);">1Joh 4:19</a>);<p class="in15">(2) that the only possible response to this is to love our brother (<a onClick="return mV(\'1Jo\',4,20);">1Joh 4:20</a>);<p class="in15">(3) that this is Christ\'s commandment (<a onClick="return mV(\'1Jo\',4,21);">1Joh 4:21</a>);<p class="in15">(4) that it is the natural instinct of spiritual kinship (<a onClick="return mV(\'1Jo\',5,1);">1Joh 5:1</a>). But true love is inseparable from righteousness. We truly love the children of God only when we love God, and we love God only when we keep His commandments (<a onClick="return mV(\'1Jo\',5,2,3);">1Joh 5:2,3a</a>).<P>(b) SECTION II, <a onClick="return mV(\'1Jo\',5,\'3-21\');">1 John 5:3b-21</a>.<P>(i) Paragraph A, <a onClick="return mV(\'1Jo\',5,\'3-12\');">1 John 5:3b-12</a>:<P>Righteousness is possible only through belief. It is our faith that makes the commandments "not grievous" because it overcomes the world (<a onClick="return mV(\'1Jo\',5,3,4);">1Joh 5:3b, 4</a>). Then follows a restatement of the contents of the true belief, specially directed against the Cerinthian heresy (<a onClick="return mV(\'1Jo\',5,5,6);">1Joh 5:5,6</a>); then an exposition of the "witness" upon which this belief rests (<a onClick="return mV(\'1Jo\',5,\'7-10\');">1Joh 5:7-10</a>); then a reiterated declaration of its being the test and guaranty of possessing eternal life (<a onClick="return mV(\'1Jo\',5,11,12);">1Joh 5:11,12</a>).<P>(ii) Paragraph B, <a onClick="return mV(\'1Jo\',5,\'13-21\');">1 John 5:13-21</a>:<P>This closing paragraph sets forth the great triumphant certainties of Christian belief: its certainty of eternal life (<a onClick="return mV(\'1Jo\',5,13);">1Joh 5:13</a>), and of prevailing in prayer (<a onClick="return mV(\'1Jo\',5,14,15);">1Joh 5:14,15</a>). Then the writer guards himself by citing an instance in which such certainty is unattainable—prayer for those that sin unto death—and reminds his readers that all unrighteousness, though not sin unto death, is sin (<a onClick="return mV(\'1Jo\',5,16,17);">1Joh 5:16,17</a>). He then resumes the great certainties of Christian belief: the certainty that the Christian life stands always and everywhere for righteousness, absolute antagonism to all sin (<a onClick="return mV(\'1Jo\',5,18);">1Joh 5:18</a>); the certainty of the moral gulf between it and the life of the world (<a onClick="return mV(\'1Jo\',5,19);">1Joh 5:19</a>); its certainty of itself, of the facts on which it rests, and the supernatural power which has given perception of these facts (<a onClick="return mV(\'1Jo\',5,20);">1Joh 5:20</a>). With an abrupt, affectionate call to those who know the true God to beware of yielding their trust and dependence to "idols," the Epistle ends.``1';
isbe[5104]='John, the Epistles of, Part 4-9`IV. Canonicity and Authorship.<P>1. Traditional View:<P>As to the reception of the Epistle in the church, it is needless to cite any later witness than Eusebius (circa 325), who classes it among the books (homologoumena) whose canonical rank was undisputed. It is quoted by Dionysius, bishop of Alexandria (247-265), by the Muratorian Canon, Cyprian, Origen, Tertullian, Clement of Alexandria, and Irenaeus. Papias (who is described by Irenaeus as a "hearer of John and a companion of Polycarp") is stated by Eusebius to have "used some testimonies from John\'s former epistle"; and Polycarp\'s Epistle to the Philippians (circa 115) contains an almost verbal reproduction of <a onClick="return mV(\'1Jo\',4,3);">1Joh 4:3</a>. Reminiscences of it are traced in Athenagoras (circa 180), the Epistle to Diognetus, the Epistle of Barnabas, more distinctly in Justin (Dial. 123) and in the Didache; but it is possible that the earliest of these indicate the currency of Johannine expressions in certain Christian circles rather than acquaintance with the Epistle itself. The evidence, however, is indisputable that this Epistle, one of the latest of the New Testament books, took immediately and permanently an unchallenged position as a writing of inspired authority. It is no material qualification of this statement to add that, in common with the other Johannine writings, it was rejected, for dogmatic reasons, by Marcion and the so-called Alogi; and that, like all the catholic epistles, it was unknown to the Canon of the ancient Syrian church, and is stated to have been "abrogated" by Theodore (Bishop of Mopsuestia, 393-428 AD).<P>2. Critical Views:<P>The verdict of tradition is equally unanimous that the Fourth Gospel and the First Epistle are both the legacy of the apostle John in his old age to the church. All the Fathers already mentioned as quoting the Epistle (excepting Polycarp, but including Irenaeus) quote it as the work of John; and, until the end of the 16th century, this opinion was held as unquestionable. The first of modern scholars to challenge it was Joseph Scaliger (1540-1609), who rejected the entire trio of Johannine Epistles as unapostolic; and in later times a dual authorship of the Gospel and the First Epistle has been maintained by Baur, H.J. Holtzmann, Pfleiderer, von Soden, and others; although on this particular point other adherents of the critical school like Julicher, Wrede and Wernle, accept the traditional view.<P>3. Internal Evidence:<P>Thus two questions are raised: first, what light does the Epistle shed upon the personality of its own author? And second, whether or not, the Gospel and the Epistle are from the same hand. Now, while the Epistle furnishes no clue by which we can identify the writer, it enables us very distinctly to class him. His relation to his readers, as we have seen, is intimate. The absence of explicit reference to either writer or readers only shows how intimate it was. For the writer to declare his identity was superfluous. Thought, language, tone—all were too familiar to be mistaken. The Epistle bore its author\'s signature in every line. His position toward his readers was, moreover, authoritative. As has already been said, the natural interpretation of <a onClick="return mV(\'1Jo\',1,2,3);">1Joh 1:2,3</a> is that the relation between them was that of teacher and taught. (By this fact we may account for the enigmatic brevity of such a passage as that on the "three witnesses." The writer intended only to recall fuller oral expositions formerly given of the same topics.) The writer is at any rate a person of so distinctive eminence and recognized authority that it is not necessary to remind the readers either who he is or by what circumstances he is compelled now to address them through the medium of writing; their knowledge of both facts is taken for granted. And all this agrees with the traditional account of John\'s relation to the churches of Asia Minor in the last decades of the 1st century.<P>Further, the writer claims to be one of the original witnesses of the facts of the incarnate life: "That which was from the beginning, that which we have heard, that which we have seen with our eyes, that which we beheld, and our hands handled, concerning the Word of life (and the life was manifested, and we have seen, and bear witness, and declare unto you the life, the eternal life, which was with the Father, and was manifested unto us); that which we have seen and heard declare we unto you also, that ye also may have fellowship with us" (<a onClick="return mV(\'1Jo\',1,\'1-3\');">1Joh 1:1-3</a>). To understand the "Word of life" here as the gospel (Westcott, Rothe, Haupt) seems to the present writer frankly impossible; and not less so theories by which the words "what we have heard, what we have seen with our eyes," etc., are regarded as utterances of the "faith-mysticism" or the "collective testimony" of the early church. It is difficult to imagine words more studiously adapted to convey the impression that the writer is one of the original, first-hand witnesses of Christ\'s life and resurrection ("that what we beheld, and our hands handled"; compare <a onClick="return mV(\'Luk\',24,39);">Lu 24:39</a>). At furthest, the use of such language is otherwise compatible with veracity only on the supposition that the writer was recognized by the church as so closely identified with the original witnesses that he could speak of their testimony as virtually his own. But, apart from the presumption that he cannot have been one of the actual disciples of Jesus, there is really nothing to be said for this supposition. So far as the internal evidence is concerned, the ancient and unbroken tradition which assigns it to the apostle John must be regarded as holding the field, unless, indeed, the traditional authorship is disproved by arguments of the most convincing kind. Whether the arguments brought against the apostolic authorship of the Johannine writings as a whole possess this character is too large a question to be investigated here. Yet the kernel of it lies in small compass. It is whether room can be found within the 1st century for so advanced a stage of theological development as is reached in the Johannine writings, and whether this development can be conceivably attributed to one of Our Lord\'s original disciples. To neither of these questions, as it appears to the present writer, is a dogmatically negative answer warranted. If within a period comparatively so brief, Christian thought had already passed through the earlier and later Pauline developments, and through such a development as we find in the Epistle to the Hebrews, there is no obvious reason why it may not have attained to the Johannine, within the lifetime of the last survivor of the apostles. Nor, when we consider the nature of the intellectual influences, within and without the church, by which the apostle John was surrounded, if, as tradition says, he lived on to a green old age in Ephesus, is there any obvious reason why he may not have been the chief instrument of that development.<P>V. Relationship to the Fourth Gospel.<P>1. Common Characteristics:<P>The further question remains as to the internal evidence the Epistle supplies regarding its relation to the Fourth Gospel. Prima facie, the case for identity of authorship is overwhelmingly strong. The two writings are equally saturated with that spiritual and theological atmosphere; they are equally characterized by that type of thought which we call Johannine and which presents an interpretation of Christianity not less original and distinctive than Paulinism. Both exhibit the same mental and moral habit of viewing every subject with an eye that stedfastly beholds radical antagonisms and is blind to approximations. There is in both the same strongly Hebrew style of composition; the same development of ideas by parallelism or antithesis; the same repetition of keywords like "begotten of God," "abiding," "keeping his commandments"; the same monotonous simplicity in the construction of sentences, with avoidance of relative clauses and singular parsimony in the use of connecting particles; the same apparently tautological habit of resuming consideration of a subject from a slightly different point of view; the same restricted range of vocabulary, which, moreover, is identical to an extent unparalleled in two independent writings.<P>2. Coincidences of Vocabulary:<P>The evidence for these statements cannot be presented here in full; but the following are some of the words and phrases characteristic of both and not found elsewhere in the New Testament—the Word, joy fulfilled, to see (or behold) and bear witness, to do the truth, to have sin, Paraclete, to keep the word (of God or Christ), to abide (in God or in Christ), the true light, new commandment, little children (teknia), children (paidia), to abide for ever, begotten of God, to purify one\'s self, to do sin, to take away sins, works of the devil, to pass from death into life, murderer, to lay down one\'s life, to be of the truth, to give commandment, to hear (= to hear approvingly), no man hath beheld God at any time, knowing and believing, Saviour of the world, water and blood, to overcome the world, to receive witness, to give eternal life, to have eternal life (in present sense), to believe in the name. The following are some of the terms common to both, which are found very rarely elsewhere in the New Testament: Beginning (= past eternity), to be manifested (9 times in each), to bear witness (6 times in the Epistle, 33 times in the Gospel, once only in Matthew, once in Luke, not at all in Mark), light (metaphorical), walk (metaphorical), to lead astray, to know (God, Christ, or Spirit, 8 times in the Epistle, 10 times in the Gospel), true (alethinos), to confess Jesus (elsewhere only in <a onClick="return mV(\'Rom\',10,9);">Ro 10:9</a>), children of God, to destroy (lauein, elsewhere only in 2 Peter), the spirit of truth, to send (apostellein, of mission of Christ), only begotten son, to have the witness (elsewhere only in Apocrypha), to hear (= to answer prayer).<P>3. Divergences of Vocabulary:<P>On the other hand, the divergences of vocabulary are not more numerous than might be expected in two writings by the same author but of different literary form. The rather notable difference in the choice and use of particles is accounted for by the fact that dialogue and narrative, of which the Gospel is largely composed, are foreign to the Epistle. The discrepancy, when closely examined, sometimes turns out to be a point of real similarity. Thus the particle oun occurs nearly 200 times in the Gospel, not at all in the Epistle. But in the Gospel it is used only in narrative, no occurrence of it being found, e.g. in <a onClick="return mV(\'Jhn\',14,\'1-\');">John 14-16</a>.<P>Of the words and phrases contained in the Epistle, but not in the Gospel, the great majority are accounted for by the fact that they are used in connection with topics which are not dealt with in the Gospel. Apart from these, the following may be noted, the most important being italicized: Word of life, fellowship, to confess sins (nowhere else in the New Testament), to cleanse from sin, propitiation (hilasmos, nowhere else in the New Testament), perfected or perfect love, last hour, Antichrist, anointing, to give of the spirit, to have (Father, Son) boldness (Godward), Parousia, lawlessness, seed (of God), come in the flesh, God is love, Day, of Judgment, belief (pistis), to make God a liar, understanding. As regards style and diction, therefore, it seems impossible to conceive of two independent literary productions having a more intimate affinity. The relation between them in this respect is far closer than that between the Acts of the Apostles and the Third Gospel, or even any two of Paul\'s Epistles, except those to the Ephesians and the Colossians.<P>4. Arguments against Unity of Authorship:<P>Arguments for a dual authorship are based chiefly on certain theological emphasis and developments in the Epistle, which are absent from the Gospel; and invariably these arguments have been pressed with complete disregard of the fact that the one writing purports, at least, to be a Gospel, the other, an utterance of the writer in propria persona. If, for example, it is urged that the words "He is faithful and righteous to forgive us our sins" have a more Pauline ring than any utterance of the Fourth Gospel, or that the conceptions in the Epistle of propitiation, intercession, and cleansing, are presented in a more explicit and technical form than in the Gospel, it is a fair reply to ask, Why not? Is it to be accepted as a canon of criticism that the writer of that Gospel must necessarily have put all his own theological expressions into the mouth of Him whose teaching he proposed to report? Much is made of the assertion that in the matter of the last things the Epistle recedes from the idealism of the Gospel, placing itself more nearly in line with the traditional apocalyptic eschatology. Whereas the Gospel speaks of Christ\'s bodily departure as the necessary condition of His coming again in the Spirit to make His permanent abode with His disciples (<a onClick="return mV(\'Jhn\',16,7);">Joh 16:7</a>), the writer of the Epistle thinks of a visible Parousia as nigh at hand (<a onClick="return mV(\'1Jo\',2,28);">1Joh 2:28</a>); and whereas the Gospel conceives of judgment as a present spiritual fact (<a onClick="return mV(\'Jhn\',3,18,19);">Joh 3:18,19</a>), the Epistle clings to the "popular" idea of a Judgment Day. But it ought to be noted that in the Epistle, as compared with the Gospel, the eschatological perspective is foreshortened. The author writes under the conviction that "the world is passing away" and that the "last hour" of its day has come (<a onClick="return mV(\'1Jo\',2,17,18);">1Joh 2:17,18</a>). And it is an unwarrantable assumption that he must, if he wrote the Gospel, have been guilty of the manifest anachronism of importing this conviction into it also. Apart from this the fundamental similarities between the eschatology of the Epistle and that of the Gospel are far more striking than the differences. In both, eternal life is conceived of as a present and not merely a future possession. In both, Christ\'s presence is an abiding reality—"Our fellowship is with the Father, and with his Son Jesus Christ" (<a onClick="return mV(\'1Jo\',1,3);">1Joh 1:3</a>). If the Gospel speaks of the revelation of Christ as bringing present and inevitable "judgment" into the world, the Epistle is saturated with the same thought. If, on the other hand, the Epistle speaks of a visible future Parousia, this is plainly implied in <a onClick="return mV(\'Jhn\',5,28,29);">Joh 5:28,29</a>. If the Epistle makes a single reference to the Day of Judgment (<a onClick="return mV(\'1Jo\',4,17);">1Joh 4:17</a>), the Gospel has 6 passages which speak of the "last day," and in these the "last day" is explicitly the day of resurrection (<a onClick="return mV(\'Jhn\',11,24);">Joh 11:24</a>) and of judgment (<a onClick="return mV(\'Jhn\',12,48);">Joh 12:48</a>). In the two writings different features of the eschatological picture may be made more or less conspicuous; but there is no such diversity as to warrant the hypothesis of a separate authorship. Again, it is urged that in the Epistle the conception of the Logos is modified in the direction of conformity to traditional doctrine. The conception of the personal, preexistent Logos, who "in the beginning was," and "was with God," and "was God" (<a onClick="return mV(\'Jhn\',1,1);">Joh 1:1</a>) was new, it is said, and, because of its Gnostic tinge, suspect; and was therefore avoided and becomes in the Epistle the depersonalized "Word of life" (<a onClick="return mV(\'1Jo\',1,1);">1Joh 1:1</a>). But why should the "Word of life" necessarily signify anything less personal than the phraseology of the Gospel? The phraseology in both cases is exactly adapted to its purpose. In the Gospel, "in the beginning was the Word...and the Word became flesh" is right, because it sums up the contents of the Gospel, announces its subject, the history of the Incarnate Logos. In the Epistle, the "Word of life" is right, because theme is to be the life, not as to its historical manifestation in Jesus, but as to its essential characteristics, whether in God or in man.<P>5. Conclusion:<P>Other arguments of a similar kind which have been put forward need not be considered. On the whole, it seems clear that, while there are between the Gospel and the Epistle differences of emphasis, perspective and point of view, these cannot be held as at all counterbalancing, on the question of authorship, the unique similarity of the two writings in style and vocabulary and in the whole matter and manner of thought, together with the testimony of a tradition which is ancient, unanimous and unbroken.<P>6. Question of Priority:<P>Regarding the question of priority as between the two writings, the only certainty is that the Epistle presupposes its readers\' acquaintance with the substance of the Gospel (otherwise such expressions as "Word of life," "new commandment" would have been unintelligible); but that does not imply its subsequentness to the composition of the Gospel in literary form. By Lightfoot and others it is supposed to have been written simultaneously with the Gospel, and dispatched along with it as a covering letter to its original readers. In view, however, of the independence and first-rate importance of the Epistle, it is difficult to think of it as having originated in this way; and by the majority of scholars it is regarded as later than the Gospel and separated from it by an appreciable interval. That it was written with a "mediating" purpose (Pfleiderer), to "popularize" the ideas of the Gospel (Weizsacker), or to correct and tone down what in it was obnoxious to the feeling of the church, and at the same time to add certain links of connection (such as propitiation, Paraclete, Parousia) with the traditional type of doctrine, or to emphasize these where they existed (Holtzmann), is a theory which rests on an extremely slender basis; theory that it was written as a protest against Gnostic appropriation of the Fourth Gospel itself (Julicher) has no tangible basis at all.<P>That there was an appreciable interval between the two writings is probable enough. Gnostic tendencies have meanwhile hardened into more definite form. Many, false prophets have gone out into the world. The "antichrists" have declared themselves. The time has come for the evangelist to focus the rays of his Gospel upon the malignant growth which is acutely endangering the life of the church.<P>LITERATURE.<P>Commentaries are numerous and excellent. The most important are those by Calvin, Lucke, Ebrard, Haupt (of fine insight but grievous verbosity), Huther (specially valuable for its conspectus of all earlier exegesis), Westcott (a magazine of materials for the student of the Epistle), Alexander (in the Speaker\'s Commentary), Rothe (original, beautiful, profound), B. Weiss, H.J. Holtzmann, Plummer (in Cambridge Greek New Testament—scholarly and very serviceable); Brooke (in International Critical Commentary, excellent). Among the numerous expositions of the Epistle are those by Neander, Candlish, Maurice, Alexander (Expositor\'s Bible), Watson, J.M. Gibbon (Eternal Life), Findlay (Fellowship in the Life Eternal), Law (The Tests of Life—combined exposition and commentary); among books on Introduction, those by Weiss, Bleek, Hilgenfeld, Holtzmann, Julicher, Zahn, Salmon, Gloag, Peake; and, among books of other kinds, the relevant sections in Beyschlag, New Testament Theology; Pfleiderer, Urchristenthum; Harhack, Geschichte clef altchristl. Litteratur; Farrar, Early Days of Christianity; McGiffert, History of Christianity in the Apostolic Age; Stevens, Johannine Theology and Theology of the New Testament; articles by Salmond in Hastings, Dictionary of the Bible (five volumes); by Schmiedel in Encyclopedia Biblica, and by Haring in Theologische Abhandlungen, Carl von Weizsacker...gewidmet. In German, the fullest investigation of the relationship of the Epistle to the Fourth Gospel will be found in a series of articles by H.J. Holtzmann in the Jahrbucher fur protestantische Theologie (1882-83); in English, in Brooke\'s commentary in Law, Tests of Life, 339-63. See also Drummond, Character and Authorship of the Fourth Gospel, chapter iii.<P><b>THE SECOND AND THIRD EPISTLES</b><P>1. Canonicity and Authorship:<P>It is not surprising that these brief and fugitive Epistles are among the New Testament writings which have had the hardest struggle for canonical recognition. One is probably, the other certainly, a private letter; and neither the same reason nor the same opportunity for their circulation existed, as in the case of church letters. The 2nd Epistle contains little that is distinctive; the 3rd Epistle is occupied with a vexatious episode in the internal history of a single congregation. Both are written by a person who designates himself simply as "the Presbyter"; and the names of the person (or church) to which the one is addressed and of the church with whose affairs the other is concerned are alike unknown. The fact, therefore, that, in spite of such obstacles, these letters did become widely known and eventually attained to canonical rank is proof of a general conviction of the soundness of the tradition which assigned them to the apostle John.<P>Like all the catholic epistles, they were unknown to the early Syrian church; when 1 John, 1 Peter and James were received into its Canon, they were still excluded, nor are they found even in printed editions of the Syriac New Testament till 1630. They were not acknowledged by the school of Antioch. Jerome distinguishes their authorship from that of the 1st Epistle. They are classed among the disputed books by Eusebius, who indicates that it was questioned whether they belonged to the evangelist or "possibly to another of the same name as he." Origen remarks that "not all affirm them to be genuine"; and, as late as the middle of the 4th century, the effort to introduce them in the Latin church met with opposition in Africa (Zahn).<P>On the other hand, we find recognition of their Johannine authorship at an early date, in Gaul (Irenaeus); Rome (Muratorian Canon, where, however, the reading is corrupt, and it is doubtful whether their authorship is ascribed or denied to the apostle John); Alexandria (Clement, who is reputed by Eusebius to have commented upon them, and who in his extant works speaks of John\'s "larger epistle," implying the existence of one or more minor epistles); Africa (Cyprian reports that 2 John was appealed to at the Synod of Carthage, 256 AD). Dionysius, Origen\'s disciple and successor, speaks of John\'s calling himself in them "the Presbyter." Eusebius, though conscientiously placing them among the antilegomena, elsewhere writes in a way which indicates that he himself did not share the doubt of their authenticity.<P>The internal evidence confirms the ultimate decision of the early church regarding these letters. Quite evidently the 2nd Epistle must have been written by the author of the 1st, or was an arrant and apparently purposeless piece of plagiarism The 3rd Epistle is inevitably associated with the 2nd by the superscription, "\'the Presbyter," and by other links of thought and phraseology.<P>2. The Presbyter:<P>The mention of this title opens up a wide question. The famous extract from Papias (Eusebius, Historia Ecclesiastica, III, 39) vouches for the existence, among those who were or had been his contemporaries, of a certain "Presbyter" John (see <a href="./study/isbe/search.html?string=JOHN,+GOSPEL+OF">JOHN, GOSPEL OF, II, 5</a>). Jerome, moreover, speaks of the two smaller Epistles as, in contrast with the 1st, ascribed to the Presbyter (De Vir. Illustr., ix); Eusebius inclines to ascribe to him the Book of Revelation; and modern critics, like Weizsacker and Harnack, have improved upon the hint by finding in this shadowy personage the author of the Fourth Gospel. Into this far-reaching controversy, we cannot here enter. It may be noted, however, that whether, in the confusedly written passage referred to, Papias really intends to distinguish between John the Apostle and John the Presbyter is a point still in debate; and that Eusebius (Evangelica Demonstratio, III, 5) does not regard the title "Presbyter" as inapplicable to John, but observes that in his Epistles he "either makes no mention of himself or calls himself presbyter, nowhere apostle or evangelist." Dionysius, too, remarks that "in the 2nd and 3rd Epistles ascribed to him, he writes anonymously, as the Presbyter." These Fathers, both exceptionally learned men and presumably well acquainted with primitive usage, saw nothing anomalous, although they did see something characteristic, in the fact, or supposed fact, that an apostle should designate himself by the lowlier and vaguer title. In the very sentence from Papias already referred to, the apostles are called "presbyters"; not to say that in the New Testament itself we have an instance of an apostle\'s so styling himself (<a onClick="return mV(\'1Pe\',5,1);">1Pe 5:1</a>).<P>To sum up, it is evident that no one desiring falsely to secure apostolic prestige for his productions would have written under so indistinctive a title; also, that these brief and very occasional letters could never have won their way to general recognition and canonical rank unless through general conviction of their Johannine authorship—the very history of these Epistles proving that the early church did not arrive at a decision upon such matters without satisfying itself of the trustworthiness of the tradition upon which a claim to canonicity was rounded; finally, the internal evidence testifies to an authorship identical with that of the 1st Epistle, so that the evidence cited regarding this is available also for those. These letters, along with Paul\'s to Philemon, are the only extant remains of a private apostolic correspondence which must have included many such, and for this reason, apart from their intrinsic worth, possess an interest, material and biographical, peculiar to themselves. We proceed to consider the two Epistles separately, and since an interesting question arises as to whether the 2nd is that referred to in <a onClick="return mV(\'3Jo\',1,9);">3Joh 1:9</a>, it will be convenient to reverse the canonical order in dealing with them.<P>The Third Epistle.<P>This brief note gives a uniquely authentic and intimate glimpse of some aspects of church life as it existed in Asia Minor (this may be taken as certain) somewhere about the end of the 1st century. It concerns a certain episode in the history of one of the churches under the writer\'s supervision, and incidentally furnishes character-sketches of two of its members, the large-hearted and hospitable Gaius, to whom it is written (and whom it is merely fanciful to identify with any other Gaius mentioned in the New Testament), and the loquacious, overbearing Diotrephes; also of the faithful Demetrius, by whose hand probably the letter is sent. The story which may be gathered from the Epistle seems to be as follows. A band of itinerant teachers had been sent out, by the Presbyter\'s authority, no doubt, and furnished by him with letters of commendation to the various churches, and among others to that of which Gaius and Diotrephes were members. Diotrephes, however, whether through jealousy for the rights of the local community or for some personal reason, not only declined to receive the itinerant teachers, but exerted his authority to impose the same course of action upon the church as a whole, even to the<P>length of threatening with excommunication (<a onClick="return mV(\'3Jo\',1,10);">3Joh 1:10</a>) those who took a different view of their duty. Gaius alone had not been intimidated, but had welcomed to his home the repulsed and disheartened teachers, who when they returned (to Ephesus, probably) had testified to the church of his courageous and large-hearted behavior (<a onClick="return mV(\'3Jo\',1,6);">3Joh 1:6</a>). A 2nd time, apparently, the teachers are now sent forth (<a onClick="return mV(\'3Jo\',1,6);">3Joh 1:6</a>), with Demetrius as their leader, who brings this letter to Gaius, commending his past conduct (<a onClick="return mV(\'3Jo\',1,5);">3Joh 1:5</a>) and encouraging him to persevere in it (<a onClick="return mV(\'3Jo\',1,6);">3Joh 1:6</a>). The Presbyter adds that he has dispatched a letter to the church also (<a onClick="return mV(\'3Jo\',1,9);">3Joh 1:9</a>); but evidently he has little hope that it will be effectual in overcoming the headstrong opposition of Diotrephes; for he promises that he will speedily pay a personal visit to the church, when he will depose Diotrephes from his pride of place and bring him to account for his scornful "prating" and overbearing conduct (<a onClick="return mV(\'3Jo\',1,10);">3Joh 1:10</a>). So far as appears, the cause of friction was purely personal or administrative. There is no hint of heretical tendency in Diotrephes and his party. Pride of place is his sin, an inflated sense of his own importance and a violent jealousy for what he regarded as his own prerogative, which no doubt he identified with the autonomy of the local congregation.<P>The Second Epistle.<P>The letter is addressed to "the elect lady" (better, to "the lady Electa"). Its tone throughout is peculiarly affectionate; there is a warmer rush of emotion, especially in the opening verses, than is characteristic of John\'s usual reserve. But in these verses the keynote of the Epistle is struck—truth. The writer testifies his love for his correspondent and her children "in truth"; this love is shared by all who "know the truth" (<a onClick="return mV(\'2Jo\',1,1);">2Joh 1:1</a>), and it is "for the truth\'s sake which abideth in us, and it shall be with us for ever" (<a onClick="return mV(\'2Jo\',1,2);">2Joh 1:2</a>). What follows (<a onClick="return mV(\'2Jo\',1,\'4-9\');">2Joh 1:4-9</a>) is in effect an epitome of the 1st Epistle. After declaring his joy at finding certain of her children "walking in truth," he proceeds to expound, quite in the style of the 1st Epistle, what "walking in truth" is. It is to love one another (<a onClick="return mV(\'2Jo\',1,5);">2Joh 1:5</a>; compare <a onClick="return mV(\'1Jo\',2,\'7-11\');">1Joh 2:7-11</a>); but this love is manifested in keeping God\'s commandments (<a onClick="return mV(\'2Jo\',1,6);">2Joh 1:6a</a>; compare <a onClick="return mV(\'1Jo\',5,2,3);">1Joh 5:2,3</a>); and no less in stedfast adherence to the genuine doctrine of the Gospel (compare <a onClick="return mV(\'1Jo\',3,23);">1Joh 3:23</a>). "For many deceivers are gone forth into the world, even they that confess not that Jesus Christ cometh in the flesh" (<a onClick="return mV(\'2Jo\',1,7);">2Joh 1:7</a>; compare <a onClick="return mV(\'1Jo\',4,\'1-3\');">1Joh 4:1-3</a>). Then follows an exhortation to stedfastness (<a onClick="return mV(\'2Jo\',1,8);">2Joh 1:8</a>), and a warning that whoever in the name of progress departs from this teaching "hath not God," while he who abides in it "hath both the Father and the Son" (<a onClick="return mV(\'2Jo\',1,9);">2Joh 1:9</a>; compare <a onClick="return mV(\'1Jo\',2,23,24);">1Joh 2:23,24</a>). This leads up to the immediately practical point, a warning to extend no hospitality and show no friendliness to the false teachers (<a onClick="return mV(\'2Jo\',1,10,11);">2Joh 1:10,11</a>); and the Epistle closes with the hope of a speedy and joyful meeting "face to face" of the writer and his correspondent, to whom he conveys greetings from the children of her "elect sister." Whether the "elect lady," or "lady Electa" of his letter is a real person or the personification of a church is a point which has been debated from ancient times and is still unsolved. The solution has been found, it is true, if we can accept the hypothesis (put forward by Zahn and Schmiedel and adopted by Findlay) that this is the letter referred to in <a onClick="return mV(\'3Jo\',1,9);">3Joh 1:9</a>. It is urged on behalf of this supposition that the two Epistles are curiously identical in phraseology. In both the writer begins by describing his correspondent as one whom "I love in truth"; in both he uses a distinctive phrase (echaren lian), <a onClick="return mV(\'2Jo\',1,4);">2Joh 1:4</a>, "I rejoice greatly," not found elsewhere in the New Testament to declare his joy at finding "thy (my) children walking in the truth"; and in both he concludes by saying that he has "many things to write," but that, looking forward to an early interview "face to face," he will not commit these further thoughts to "paper and ink." It is argued that "none but a chancery clerk could have clung so closely to his epistolary formulas" in two private letters written at different periods. But the force of this argument largely vanishes when we look at the formulas in question. If a modern writer may conclude hundreds of friendly letters by subscribing himself "yours sincerely," or something equivalent, why may not the Presbyter have commenced these two and many similar letters by assuring his correspondents that he sincerely loved them? And again, one in his official position must often have had occasion to say that he hoped soon to pay a personal visit, in view of which, writing at greater length was unnecessary. Even if the likeness in phraseology makes it probable that the two letters were written simultaneously, this by no means proves that the one was written to Gaius, the other to the church of which Gaius and Diotrephes were members. Zahn calculates that 2 John would occupy 32 lines, and 3 John not quite 31
