os\',7,11);">7:11</a>). When the culprit Achan had been discovered and punished, a renewed attempt upon Ai, made with larger forces and more skillful dispositions, was crowned with success. The city was taken by a stratagem and destroyed by fire, its king being hanged outside the city gate (<a onClick="return mV(\'Jos\',8,28);">8:28</a>f). Unlike Jericho, it seems never to have been restored. Bethel also was captured, through the treachery apparently of one of its own citizens, and its inhabitants were put to the sword (<a onClick="return mV(\'Jdg\',1,24);">Jud 1:24</a>f).<P>(5) Reading of the Law on Mt. Ebal.<P>Of further campaigns undertaken by Joshua for the subjugation of Central Palestine no account has been preserved. It is possible, therefore, that the conquest of this part of the country was accomplished without further fighting (see <a href="./study/isbe/search.html?string=JOSHUA,+BOOK+OF">JOSHUA, BOOK OF</a>). In the list of the cities (<a onClick="return mV(\'Jos\',12,\'7-24\');">Jos 12:7-24</a>) whose kings were vanquished by Joshua, there are no names of towns that can be certainly identified as situated here; the greater part evidently belong to the north or south. The only record remaining is that of the formal erection of an altar on Mt. Ebal in the presence of all the people and the solemn reading of the law in their hearing (<a onClick="return mV(\'Jos\',8,\'30-35\');">8:30-35</a>). It is expressly noted that all this was done in accordance with the directions of Moses (compare <a onClick="return mV(\'Deu\',11,29);">De 11:29</a>; <a onClick="return mV(\'Deu\',27,\'2-8\',11);">27:2-8,11</a>ff). It would further appear probable that this ceremony really took place at the close of the conquest, when all the land was subdued, and is narrated here by anticipation.<P>(6) The Gibeonites.<P>The immediate effect of the Israelite victories under Joshua was very great. Especially were the Hivite inhabitants of Gibeon struck with fear (<a onClick="return mV(\'Jos\',9,3);">9:3</a>ff) lest the same fate should overtake them that had come upon the peoples of Jericho and Ai. With Gibeon, 3 other cities were confederate, namely, Chephirah, Beeroth and Kiriath-jearim, or the "city of groves" (<a onClick="return mV(\'Jos\',9,17);">9:17</a>). Gibeon, however, was the chief, and acted in the name of the others. It is usually identified with the modern village or township of el-Jib, 7 or 8 miles north by west of Jerusalem; and all four lay clustered around the head of the pass or valley of Aijalon, which led down from the plateau westward to the foothills of the Shephelah, toward the plain and the sea. Gibeon held therefore a position of natural strength and importance, the key to one of the few practicable routes from the west into the highlands of Judea, equally essential to be occupied as a defensive position against the incursions of the dwellers in the plains, and as affording to an army from the east a safe and protected road down from the mountains.<P>By a stratagem which threw Joshua and the leaders of Israel off their guard, representing themselves as jaded and wayworn travelers from a distance, the Gibeonites succeeded in making a compact with Israel, which assured their own lives and safety. They affirmed that they had heard of the Israelite victories beyond Jordan, and also of the gift to them by Yahweh of the whole land (<a onClick="return mV(\'Jos\',9,9,24);">Jos 9:9f; 24</a>). Joshua and the princes were deceived and entered too readily into covenant with them, a covenant and promise that was scrupulously observed when on the 3rd day of traveling the Israelites reached their cities and found them to be close at hand (<a onClick="return mV(\'Jos\',9,16);">9:16</a>ff). While, however, their lives were preserved, the men of Gibeon were reduced to the position of menial servants, "hewers of wood and drawers of water"; and the writer adds, it is thus "unto this day" (<a onClick="return mV(\'Jos\',9,21,27);">9:21,27</a>).<P>See <a href="./study/isbe/search.html?string=GIBEON">GIBEON</A>.<P>The treaty of peace with the Gibeonites and the indignation thereby aroused among the neighboring kings, who naturally regarded the independent action of the men of Gibeon as treachery toward themselves, gave rise to one of the most formidable coalitions and one of the most dramatic incidents of the whole war. The king of Jerusalem, Adoni-zedek ("the Lord of righteousness" or "the Lord is righteousness," <a onClick="return mV(\'Jos\',10,1);">Jos 10:1</a>; compare Melchizedek, "the king of righteousness," <a onClick="return mV(\'Gen\',14,18);">Ge 14:18</a>; in <a onClick="return mV(\'Jdg\',1,5);">Jud 1:5</a>ff the name appears as Adoni-bezek, and so Septuagint reads here), with the 4 kings of Hebron, Jarmuth, Lachish and Eglon (<a onClick="return mV(\'Jos\',10,3);">Jos 10:3</a>), formed a plan to destroy Gibeon in revenge, and the Gibeonites sent hastily for assistance to Joshua, who had returned with his army to Gilgal. The Israelites made a forced march from Gilgal, came upon the allied kings near Gibeon, and attacked and defeated them with great slaughter. The routed army fled westward "by the way of the ascent to Beth-horon" (<a onClick="return mV(\'Jos\',10,10);">Jos 10:10</a>), and in the pass was overtaken by a violent hailstorm, by which more perished than had fallen beneath the swords of the Israelites (<a onClick="return mV(\'Jos\',10,11);">Jos 10:11</a>). The 5 kings were shut up in a cave at Makkedah, in which they had taken refuge, whence they were subsequently brought forth and put to death. The actual pursuit, however, was not stayed until the remnant had found temporary security behind the walls of their fortified cities (<a onClick="return mV(\'Jos\',10,16);">Jos 10:16</a>). The victory of Israel was commemorated by Joshua in a song of which some words are preserved (<a onClick="return mV(\'Jos\',10,12);">Jos 10:12</a>f).<P>See <a href="./study/isbe/search.html?string=BETH-HORON,+THE+BATTLE+OF">BETH-HORON, THE BATTLE OF</a>.<P>(7) Conquest of the South.<P>With almost severe simplicity it is further recorded how the confederate cities in turn were captured by Joshua and utterly destroyed (<a onClick="return mV(\'Jos\',10,\'28-39\');">10:28-39</a>). And the account is closed by a summary statement of the conquest of the entire country from Kadesh-barnea in the extreme south as far as Gibeon, after which the people returned to their camp at Gilgal (<a onClick="return mV(\'Jos\',10,\'40-43\');">10:40-43</a>).<P>(8) Northern Conquests.<P>A hostile coalition of northern rulers had finally to be met and defeated before the occupation and pacification of the land could be said to be complete. Jabin, king of Hazor, the "fort," was at the head of an alliance of northern kings who gathered together to oppose Israel in the neighborhood of the waters of Merom (<a onClick="return mV(\'Jos\',11,1);">Jos 11:1</a>). Hazor has been doubtfully identified with the modern Jebel Hadireh, some 5 miles west of the lake. No details of the fighting that ensued are given. The victory, however, of the Israelites was decisive, although chariots and horses were employed against them apparently for the first time on Canaanite soil. The pursuit was maintained as far as Sidon, and Misrephoth-maim, perhaps the "boilings" or "tumults of the waters," the later Zarephath on the coast south of the former city (<a onClick="return mV(\'Jos\',11,8);">Jos 11:8</a>; compare <a onClick="return mV(\'Jos\',13,6);">13:6</a>); and the valley of Mizpeh must have been one of the many wadies leading down to the Phoenician coast land. The cities were taken, and their inhabitants put to the sword; but Hazor alone appears to have been burnt to the ground (<a onClick="return mV(\'Jos\',11,11);">Jos 11:11</a>). That the royal city recovered itself later is clear from the fact that a king of Hazor was among the oppressors of Israel in the days of the Judges (<a onClick="return mV(\'Jdg\',4,\'1-\');">Jud 4</a>). For the time being, however, the fruit of these victories was a widespread and much-needed peace. "The land had rest from war" (<a onClick="return mV(\'Jos\',11,23);">Jos 11:23</a>).<P>(9) Allotment of Territory.<P>Thus the work of conquest, as far as it was effected under Joshua\'s command, was now ended; but much yet remained to be done that was left over for future generations. The ideal limits of Israel\'s possession, as set forth by Yahweh in promise to Moses, from the Shihor or Brook of Egypt (compare <a onClick="return mV(\'1Ch\',13,5);">1Ch 13:5</a>) to Lebanon and the entering in of Hamath (<a onClick="return mV(\'Num\',34,\'1-\');">Nu 34</a>), had not been and indeed never were reached. In view, however, of Joshua\'s age (<a onClick="return mV(\'Jos\',13,\'1-\');">Jos 13:1</a>), it was necessary that an allotment of their inheritance west of the Jordan should at once be made to the remaining tribes. Reuben, Gad and half the tribe of Manasseh had been already provided for by Moses in Eastern Palestine (<a onClick="return mV(\'Jos\',13,\'15-32\');">Jos 13:15-32</a>). <a onClick="return mV(\'Jos\',14,\'1-\');">Joshua 14-21</a> accordingly contain a detailed account of the arrangements made by the Israelite leader for the settlement of the land and trace the boundaries of the several tribal possessions. The actual division appears to have been made on two separate occasions, and possibly from two distinct centers. Provision was first made for Judah and the children of Joseph; and between the northern border of the former tribe, recorded in detail in <a onClick="return mV(\'Jos\',15,\'5-11\');">15:5-11</a>, and the inheritance of the sons of Joseph, a tract of land for the present left unassigned was later given to the tribes of Benjamin and Dan. An extra portion also was promised by Joshua to the descendants of Joseph on the ground of their numbers and strength (<a onClick="return mV(\'Jos\',17,14);">17:14</a>ff).<P>For the 7 tribes that were yet without defined inheritance a rough survey of the land appears to have been made, and the unallotted districts were divided into 7 portions, for which lots were then cast at Shiloh in the presence of the assembled tribes (<a onClick="return mV(\'Jos\',18,\'1-\');">Joshua 18</a>; <a onClick="return mV(\'Jos\',19,\'1-\');">19</a>). The express mention of Shiloh here (<a onClick="return mV(\'Jos\',18,1,10);">Jos 18:1,10</a>) suggests that the previous division was carried out at some other place, and if so, probably at Gilgal, the earlier resting-place of the ark and the tabernacle. No definite statement, however, to that effect is made. Benjamin\'s portion was assigned between the territories of Judah and the children of Joseph (<a onClick="return mV(\'Jos\',18,11);">Jos 18:11</a>). Simeon received his inheritance out of the land given to Judah, a part on the south being taken away on the ground that the whole was too great for a single tribe (<a onClick="return mV(\'Jos\',19,\'1-9\');">Jos 19:1-9</a>). Zebulun, Issachar, Asher, and Naphtali were established in the north (<a onClick="return mV(\'Jos\',19,\'10-39\');">Jos 19:10-39</a>). And Dan was settled on the seacoast by Joppa, with additional territory in the extreme north, of which they apparently took independent and forcible possession, beyond the inheritance of the other tribes (<a onClick="return mV(\'Jos\',19,\'40-48\');">Jos 19:40-48</a>; compare <a onClick="return mV(\'Jdg\',18,\'27-29\');">Jud 18:27-29</a>).<P>(10) Cities of Refuge.<P>Finally the 6 cities of refuge were appointed, 3 on each side of the Jordan, and the 48 cities of the Levites taken out of the territories of the several tribes (<a onClick="return mV(\'Jos\',20,\'1-\');">Joshua 20</a>; <a onClick="return mV(\'Jos\',21,\'1-\');">21</a>; compare <a onClick="return mV(\'Num\',35,\'1-\');">Nu 35</a>; <a onClick="return mV(\'Deu\',4,\'41-43\');">De 4:41-43</a>). The two and a half tribes whose inheritance lay in Eastern Palestine were then dismissed, their promise of assistance to their brethren having been fulfilled (<a onClick="return mV(\'Jos\',22,\'1-\');">Joshua 22</a>); and an altar was erected by them on the right bank of the Jordan whose purpose is explained to be to serve as a standing witness to the common origin of all the tribes, and to frustrate any future attempt to cut off those on the east from the brotherhood of Israel.<P>(11) Final Address and Death.<P>In a closing assembly of the Israelites at Shechem, Joshua delivered to the people his final charge, as Moses had done before his death, reminding them of their own wonderful history, and of the promises and claims of God, and exhorting them to faithful and loyal obedience in His service (<a onClick="return mV(\'Jos\',23,\'1-\');">23</a>; <a onClick="return mV(\'Jos\',24,\'1-\');">24</a>). A stone also was set up under the oak in the sacred precinct of Yahweh, to be a memorial of the renewed covenant between God and His people (<a onClick="return mV(\'Jos\',24,26);">24:26</a>f). Then at the age of 110 the second great leader of Israel died, and was laid to his rest within his own inheritance in Timnath-serah (<a onClick="return mV(\'Jos\',24,29,30);">24:29,30</a>; in <a onClick="return mV(\'Jdg\',2,9);">Jud 2:9</a>, Timnath-heres), in the hill country of Ephraim. The site of his grave is unknown. Tradition has placed it at Kefr Haris, 9 miles south of Nablus or Shechem. But the localizing by tradition of the burying-place of hero or saint is often little more than accidental, nor can any reliance be placed upon it in this instance.<P>III. Sources of History. That the narratives concerning the life and work of Joshua rest in the main upon basis of tradition can hardly be doubted. How far the details have been modified, or a different coloring imparted in the course of a long transmission, it is impossible to determine. There is a remarkable similarity or parallelism between many of the leading events of Joshua\'s life as ruler and captain of Israel and the experiences of his predecessor Moses, which, apart from any literary criticism, suggests that the narratives have been drawn from the same general source, and subjected to the same conditions of environment and transmission. Thus both are called to and strengthened for their work by a special Divine revelation, Moses at Horeb in the burning bush, Joshua at Jericho. Both lead the people across the bed of waters miraculously driven back to afford them passage. And both at no long interval after the passage win a notable victory over their adversaries—a victory ascribed in each case to direct Divine intervention on their behalf, although in different ways. At the close of their life-work, moreover, both Moses and Joshua deliver stirring addresses of appeal and warning to the assembled Israelites; and both are laid in nameless graves. These all, however, are occurrences perfectly natural and indeed inevitable in the position in which each found himself. Nor do they afford adequate ground for the supposition that the achievements of the greater leader have been duplicated, or by mistake attributed to the less. To cross the Jordan and to defeat the Canaanite confederacy were as essential to the progress of Israel as the passage of the Red Sea and the breaking up of the gathering of Amalekite clans; and no true or sufficient history could have evaded the narration of these events. The position of Israel also on the east of the Jordan about to undertake the invasion and conquest of the Promised Land as imperatively demanded a specially qualified captain and guide, a mastermind to control the work, as did the oppressed people in Egypt or the wanderers in the desert. That Joshua was not so great a man as his predecessor the entire narrative testifies. Moses, however, must of necessity have had a successor to take up his unfinished work and to carry it to completion.<P>IV. Character and Work of Joshua.<P>As to the personal character of Joshua, there is little to be inferred from the narrative of his campaigns. In this respect indeed they are singularly colorless. In early life his loyalty to Moses was conspicuous and unswerving. As his successor, he seems to have faithfully acted upon his principles, and in the direction of the Israelite campaigns to have proved himself a brave and competent general, as wise in counsel as he was strong in fight. The putting to death of captives and the handing over to the sword of the inhabitants of hostile cities, which the historian so often records as the consequence of his victories, must evidently be judged by the customs of the times, and have perhaps lost nothing in the narration. They do not in any case justify the attribution to Joshua of an especially inhumane disposition, or a delight in slaughter for its own sake. After the death of Moses he would appear to have been reluctant to undertake the onerous position and duty assigned to him through mistrust of his own ability and lack of self-confidence, and needed more than once to be encouraged in his work and assured of Divine support. In the language of his closing discourse there is apparent a foresight and appreciation of the character and tendencies of the people who had followed him, which is hardly inferior to that of Moses himself.<P>In a real sense also his work was left unfinished at his death. The settlement of Canaan by the tribes of Israel within the appointed and promised limits was never more than partial. The new colonists failed to enjoy that absolute and undisturbed possession of the land to which they had looked forward; witness the unrest of the period of the Judges, prolonged and perpetuated through monarchical times. For all this, however, the blame cannot justly be laid to the account of Joshua. Many causes undoubtedly concurred to an issue which was fatal to the future unity and happiness and prosperity of Israel. The chief cause, as Joshua warned them would be the case, was the persistent idolatry of the people themselves, their neglect of duty, and disregard of the commands and claims of their God.``65';
isbe[5165]='Joshua (3)`Son of Jehozadak (<a onClick="return mV(\'Hag\',1,1,12,14);">Hag 1:1,12,14</a>; <a onClick="return mV(\'Hag\',2,2,4);">2:2,4</a>; <a onClick="return mV(\'Zec\',3,1,3,6,8,9);">Zec 3:1,3,6,8,9</a>; <a onClick="return mV(\'Zec\',6,11);">6:11</a> form (b)) and high priest in Jerusalem, called "Jeshua" in Ezra-Nehemiah. His father was among the captives at the fall of Jerusalem in 586 BC, and also his grandfather Seraiah, who was put to death at Riblah (<a onClick="return mV(\'2Ki\',25,18);">2Ki 25:18</a>ff; <a onClick="return mV(\'1Ch\',6,15);">1Ch 6:15</a>).<P>Joshua appears in <a onClick="return mV(\'Ezr\',3,2);">Ezr 3:2</a> with Zerubbabel at the head of the returned exiles and as leader in the work of building an altar and reestablishing sacrificial worship (538 or 537 BC). <a onClick="return mV(\'Ezr\',3,8);">Ezr 3:8</a> tells of their laying the foundation of the temple, and in 4:1ff the two heads of the community refuse to allow the Samaritans to cooperate in the building operations, with the result that the would-be helpers became active opponents of the work. Building then ceased until Haggai and Zechariah in 520 (<a onClick="return mV(\'Ezr\',5,\'1-\');">Ezr 5</a>; <a onClick="return mV(\'Hag\',1,\'1-11\');">Hag 1:1-11</a>) exhort the community to restart work, and the two leaders take the lead (<a onClick="return mV(\'Hag\',1,\'12-15\');">Hag 1:12-15</a>). The following are, in chronological order, the prophetic utterances in which Joshua is spoken of:<P>(1) <a onClick="return mV(\'Hag\',1,\'1-11\');">Hag 1:1-11</a>;<P>(2) <a onClick="return mV(\'Hag\',2,\'1-9\');">Hag 2:1-9</a>;<P>(3) <a onClick="return mV(\'Zec\',1,\'1-6\');">Zec 1:1-6</a>;<P>(4) <a onClick="return mV(\'Hag\',2,\'10-19\');">Hag 2:10-19</a>;<P>(5) <a onClick="return mV(\'Hag\',2,\'20-23\');">Hag 2:20-23</a>;<P>(6) the visions of <a onClick="return mV(\'Zec\',1,\'7-\');">Zec 1:7-6:8</a> together with<P>(7) the undated utterance of <a onClick="return mV(\'Zec\',6,\'9-15\');">Zec 6:9-15</a>.<P>1. The Vision of <a onClick="return mV(\'Zec\',3,\'1-10\');">Zechariah 3:1-10</a>:<P>Two of these call for special attention. First, the vision of a trial in which Joshua is prosecuted before the angel of Yahweh by Satan (ha-satan, "the adversary"), who is, according to one view, "not the spirit of evil who appears in later Jewish writings; he is only the officer of justice whose business is to see that the case against criminals is properly presented" in the heavenly court of justice (H.P. Smith, Old Testament History, 356); while others regard him as the enemy of God\'s people (compare Orelli, Minor Prophets, English translation, 327). We are not told what the charge against Joshua is: some hold him to be tried as in some way a representative of the people or the priesthood, and his filthy garments as symbolical of sin; while others explain the garments as put on to excite the court\'s pity. The adversary is rebuked by "the angel of Yahweh" (read at beginning of <a onClick="return mV(\'Zec\',3,2);">Zec 3:2</a>, "and the angel of Yahweh said," etc.), and Joshua is acquitted. He is then ordered to be stripped of his old clothes and to be arrayed in "rich apparel" (<a onClick="return mV(\'Zec\',3,4);">Zec 3:4</a>), while a "clean turban" (American Standard Revised Version margin) is to be put on his head. Conditional upon his walking in God\'s ways, he is promised the government of the temple and "free access" to God, being placed among the servants of the "angel of Yahweh." Joshua and his companions "are men that are a sign" (<a onClick="return mV(\'Zec\',3,8);">Zec 3:8</a>), i.e. a guaranty of the coming of the Messiah; there is set before Joshua a stone which is to be inscribed upon, and the iniquity of the land will be removed, an event to be followed by peace and plenty (<a onClick="return mV(\'Zec\',3,9);">Zec 3:9</a>f).<P>In <a onClick="return mV(\'Zec\',3,4);">Zec 3:4</a>ff Nowack and Wellhausen (with the Septuagint mostly) read, "And he answered and spake unto those that stood before him (i.e. his servants) thus: Take the filthy garments from off him, and clothe him with rich apparel, (<a onClick="return mV(\'Zec\',3,5);">5</a>) and set a clean turban upon his head. So they set a clean turban upon his head and clothed him with clean garments. And the angel of Yahweh stood up, (<a onClick="return mV(\'Zec\',3,6);">6</a>) and solemnly exhorted Joshua," etc. They also omit the first "for" in <a onClick="return mV(\'Zec\',3,8);">Zec 3:8</a> as a dittography.<P>Different interpretations are given of the vision:<P>(1) Some claim to see here a contest between the civil and religious powers as represented by Zerubbabel and Joshua respectively (<a onClick="return mV(\'Zec\',6,13);">Zec 6:13</a>), and that Zechariah decides for the supremacy of the latter. The Messiah-King is indeed in Jerusalem in the person of Zerubbabel, though as yet uncrowned; but Joshua is to be supreme (see G.A. Smith, Jerusalem, II, 303; H.P. Smith, Old Testament History, 356f). This explanation is dependent to a large extent upon <a onClick="return mV(\'Zec\',6,\'9-15\');">Zec 6:9-15</a>, and is not supported by <a onClick="return mV(\'Zec\',3,8);">3:8</a>. It is difficult to explain <a onClick="return mV(\'Zec\',3,2);">3:2</a> on this view, for Zerubbabel could also be described as a "brand plucked out of the fire." What the vision says is that the vindication of Joshua is a sign for the coming of Yahweh\'s "servant, the Branch," a title that is not given to Joshua (compare <a onClick="return mV(\'Zec\',3,7);">Zec 3:7</a>).<P>(2) Others maintain that the garments are symbolical of the sins of the predecessors of Joshua, who is tried for their offenses and himself regarded as being unworthy of the office because he had been brought up in a foreign and heathen land (so Keil, Orelli).<P>(3) Hitzig, followed by Nowack (Kleine Propheten, 325), holds that the idea which lies at the basis of the vision is that Satan is responsible for the ills which the community had suffered (compare <a onClick="return mV(\'Job\',1,\'1-\');">Job 1</a>; <a onClick="return mV(\'Job\',2,\'1-\');">2</a>). The people had begun to think that their offerings were not acceptable to God and that He would not have pity upon them. There was a feeling among the most pious ones that God\'s righteousness would not allow of their restoration to their former glory. This conflict between righteousness and mercy is decided by silencing the accuser and vindicating Joshua.<P>It is difficult to decide which view, if any, is correct. "The brand plucked out of the fire" seems to point to God\'s recognizing that the community, or perhaps the priestly succession, had almost been exterminated by the exile. It reminds us of the oak of which, after its felling, the stump remaineth (<a onClick="return mV(\'Isa\',6,13);">Isa 6:13</a>), and may perhaps point to God\'s pity being excited for the community. The people, attacked by their enemies and represented by. Joshua, are to be restored to their old glory: that act being symbolized by the clothing of Joshua in clean raiment; and that symbolical act (compare <a onClick="return mV(\'Isa\',8,18);">Isa 8:18</a>) is a sign, a guaranty, of the coming of the Messiah-King. The ritualistic tone of Malachi will then follow naturally after the high place given here to the high priest. It is noteworthy that the promise of <a onClick="return mV(\'Zec\',3,7);">Zec 3:7</a> is conditional.<P>One more point remains, namely, the meaning of the stone in <a onClick="return mV(\'Zec\',3,9);">Zec 3:9</a>. It has been differently explained as a jewel in the new king\'s crown (Nowack); a foundation stone of the temple, which, however, was already laid (Hitzig); the chief stone of <a onClick="return mV(\'Zec\',4,7);">4:7</a> (Ewald, Steiner); the Messiah Himself (Keil); the stone in the high priest\'s breastplate (Bredenkamp), and the stone which served as an altar (Orelli). Commentators tend to regard the words "upon one stone are seven eyes" as a parenthetical addition characteristic of the author of <a onClick="return mV(\'Zec\',9,\'1-\');">Zec 9</a>ff.<P>2. Joshua\'s Crown, <a onClick="return mV(\'Zec\',6,\'9-15\');">Zechariah 6:9-15</a>:<P>The utterance of <a onClick="return mV(\'Zec\',6,\'9-15\');">Zec 6:9-15</a> presents to us some more exiles coming from Babylon with silver and gold apparently for the temple. According to the present text, Zechariah is commanded to see that this is used to make a crown for Joshua who is to be a priest-king. This is taken to mean that he is to be given the crown that had been meant for Zerubbabel. But commentators hold that the text has been altered: that the context demands the crowning of Zerubbabel—the Branch of Davidic descent. This view is supported by <a onClick="return mV(\'Zec\',6,13);">Zec 6:13</a>, "And the counsel of peace shall be between them both"; and therefore the last clause of <a onClick="return mV(\'Zec\',6,11);">6:11</a> is omitted. Wellhausen keeps <a onClick="return mV(\'Zec\',6,9,10);">6:9 and 10</a>, and then reads: "(<a onClick="return mV(\'Zec\',6,11);">11</a>) Yea, take of them silver and gold and make a crown, (<a onClick="return mV(\'Zec\',6,13);">12</a>) and say to them: Thus saith Yahweh of hosts, saying, Behold the man whose name is the Branch, from whose root there will be a sprout, (<a onClick="return mV(\'Zec\',6,13);">13</a>) and he will build the Temple of Yahweh, and he will obtain glory and sit and rule upon his throne. And Joshua will be a priest on his right hand, and there will be friendly peace between them both. (<a onClick="return mV(\'Zec\',6,14);">14</A>) The crown shall be," etc.; <a onClick="return mV(\'Zec\',6,15);">Zec 6:15</a> is incomplete.<P>It will be objected that this does away with the idea of a priest-king, an idea found also in <a onClick="return mV(\'Psa\',110,\'1-\');">Ps 110</a>. But it seems fairly certain that <a onClick="return mV(\'Psa\',110,\'1-\');">Ps 110</a> (see Kirkpatrick, The Book of Psalms) does not refer to Joshua, the point there being that the king referred to was a priest, although not descended from Aaron, being a priest after the order of Melchizedek, while here the point is, if the present text be correct, that a priest is crowned king. What became of Zerubbabel after this is not known. See Ed. Meyer, Der Papyrusfund von Elephantine2, 70ff, 86ff. Joshua is called Jesus in Sirach 49:12.`<a href="./study/isbe/search.html?string=ZERUBBABEL">ZERUBBABEL</a>; <a href="./study/isbe/search.html?string=HAGGAI">HAGGAI</a>; <a href="./study/isbe/search.html?string=ZECHARIAH">ZECHARIAH</a>`149';
isbe[5166]='Joshua, Book of`<b>I. TITLE AND AUTHORSHIP</b><P><b>II. CONTENTS</b><P class="in15">1. Invasion and Conquest of Western Palestine<P class="in15">2. Allotment of the Country to the Tribes of Israel<P><b>II. HISTORICAL CHARACTER AND CHRONOLOGY</b><P class="in15">1. The Book of Joshua as History<P class="in15">2. Chronology<P><b>IV. SOURCES OF THE WRITTEN NARRATIVE</b><P><b>V. RELATION TO THE BOOK OF JUDGES</b><P class="in15">1. Parallel Narratives<P class="in15">2. Omissions in the History<P><b>VI. PLACE OF JOSHUA IN THE HEBREW CANON</b><P><b>VII. GREEK AND OTHER ANCIENT VERSIONS</b><P class="in15">1. The Greek<P class="in15">2. Other Ancient Versions<P><b>VIII. RELIGIOUS PURPOSE AND TEACHING</b><P><b>LITERATURE</b><hr /><P>I. Title and Authorship.<P>The name Joshua signifies "Yahweh is deliverance" or "salvation" (see <a href="./study/isbe/search.html?string=JOSHUA+(2)">JOSHUA (2)</a>). The Greek form of the name is Jesus (Iesous, <a onClick="return mV(\'Act\',7,45);">Ac 7:45</a>; <a onClick="return mV(\'Hbr\',4,8);">Heb 4:8</a>). In later Jewish history the name appears to have become popular, and is even found with a local significance, as the designation of a small town in Southern Palestine (yeshua\'), <a onClick="return mV(\'Neh\',11,26);">Ne 11:26</a>). The use of the title by the Jews to denote the Book of Joshua did not imply a belief that the book was actually written or dictated by him; or even that the narratives themselves were in substance derived from him, and owed their authenticity and reliability to his sanction and control. In the earliest Jewish literature the association of a name with a book was not intended in any case to indicate authorship. And the Book of Joshua is no exception to the rule that such early writings, especially when their contents are of a historical nature, are usually anonymous. The title is intended to describe, not authorship, but theme; and to represent that the life and deeds of Joshua form the main subject with which the book is concerned.<P>II. Contents.<P>With regard to the contents of Joshua, it will be found to consist of two well-marked divisions, in the first of which (<a onClick="return mV(\'Jos\',1,\'1-\');">Joshua 1</a>-<a onClick="return mV(\'Jos\',2,\'1-\');">2</a>) are narrated the invasion and gradual conquest under the command of Joshua of the land on the west of the Jordan; while the 2nd part describes in detail the allotment of the country to the several tribes with the boundaries of their territories, and concludes with a brief notice of the death and burial of Joshua himself.<P>1. Invasion and Conquest of Western Palestine:<P><a onClick="return mV(\'Jos\',1,\'1-\');">Joshua 1</a>: Renewal of the Divine promise to Joshua and exhortation to fearlessness and courage (<a onClick="return mV(\'Jos\',1,\'1-9\');">1:1-9</a>); directions to the people to prepare for the passage of the river, and a reminder to the eastern tribes (Reuben, Gad, and half and Manasseh) of the condition under which they held their possession beyond Jordan; the renewal by these tribes of their pledge of loyalty to Moses\' successor (<a onClick="return mV(\'Jos\',1,\'10-18\');">1:10-18</a>).<P><a onClick="return mV(\'Jos\',2,\'1-\');">Joshua 2</a>: The sending of the two spies from Shittim and their escape from Jericho through the stratagem of Rahab.<P><a onClick="return mV(\'Jos\',3,\'1-\');">Joshua 3</a>: The passage of Jordan by the people over against Jericho, the priests bearing the ark, and standing in the dry bed of the river until all the people had crossed over.<P><a onClick="return mV(\'Jos\',4,\'1-\');">Joshua 4</a>: Erection of 12 memorial stones on the other side of Jordan, where the people encamped after the passage of the river (4:1-14); the priests with the Ark of the Covenant ascend in their turn from out of the river-bed, and the waters return into their wonted course (<a onClick="return mV(\'Jos\',4,\'15-24\');">4:15-24</a>).<P><a onClick="return mV(\'Jos\',5,\'1-\');">Joshua 5</a>: Alarm excited among the kings on the west of Jordan by the news of the successful crossing of the river (<a onClick="return mV(\'Jos\',5,1);">5:1</A>); circumcision of the people at Gilgal (<a onClick="return mV(\'Jos\',5,\'2-9\');">5:2-9</a>); celebration of the Passover at Gilgal in the plains of Jericho (<a onClick="return mV(\'Jos\',5,10,11);">5:10,11</a>); cessation of the supply of the manna (<a onClick="return mV(\'Jos\',5,12);">5:12</A>); appearance to Joshua of the captain of the Lord\'s host (<a onClick="return mV(\'Jos\',5,13,14,15);">5:13-15</a>).<P><a onClick="return mV(\'Jos\',6,\'1-\');">Joshua 6</a>: Directions given to Joshua for the siege and taking of Jericho (<a onClick="return mV(\'Jos\',6,\'1-5\');">6:1-5</a>); capture of the city, which is destroyed by fire, Rahab and her household alone being saved (<a onClick="return mV(\'Jos\',6,\'6-25\');">6:6-25</a>); a curse is pronounced on the man who rebuilds Jericho (<a onClick="return mV(\'Jos\',6,26);">6:26</A>).<P><a onClick="return mV(\'Jos\',7,\'1-\');">Joshua 7</a>: The crime and punishment of Achan, who stole for himself part of the spoil of the captured city (<a onClick="return mV(\'Jos\',7,1,\'16-26\');">7:1,16-26</A>); incidentally his sin is the cause of a disastrous defeat before Ai (<a onClick="return mV(\'Jos\',7,\'2-12\');">7:2-12</a>).<P><a onClick="return mV(\'Jos\',8,\'1-\');">Joshua 8</a>: The taking of Ai by a stratagem, destruction of the city, and death of its king (<a onClick="return mV(\'Jos\',8,\'1-29\');">8:1-29</a>); erection of an altar on Mt. Ebal, and reading of the Law before the assembled people (<a onClick="return mV(\'Jos\',8,\'30-35\');">8:30-35</a>).<P><a onClick="return mV(\'Jos\',9,\'1-\');">Joshua 9</a>: Gathering of the peoples of Palestine to oppose Joshua (<a onClick="return mV(\'Jos\',9,1,2);">9:1-2</a>); a covenant of peace made with the Gibeonites, who represent themselves as strangers from a far country (<a onClick="return mV(\'Jos\',9,\'3-26\');">9:3-26</a>); they are, however, reduced to a condition of servitude (<a onClick="return mV(\'Jos\',9,27);">9:27</a>).<P><a onClick="return mV(\'Jos\',10,\'1-\');">Joshua 10</a>: Combination of 5 kings of the Amorites to punish the inhabitants of Gibeon for their defection, and defeat and rout of the kings by Joshua at Beth-horon (<a onClick="return mV(\'Jos\',10,\'1-14\');">10:1-14</a>); return of the Israelites to Gilgal (<a onClick="return mV(\'Jos\',10,15);">10:15</a>); capture and death by hanging of the 5 kings at Makkedah (<a onClick="return mV(\'Jos\',10,\'16-27\');">10:16-27</a>); taking and destruction of Makkedah (<a onClick="return mV(\'Jos\',10,28);">10:28</a>), Libnah (<a onClick="return mV(\'Jos\',10,29,30);">10:29,30</a>), Lachish (<a onClick="return mV(\'Jos\',10,31,32);">10:31,32</a>), Gezer (<a onClick="return mV(\'Jos\',10,33);">10:33</a>), Eglon (<a onClick="return mV(\'Jos\',10,34,35);">10:34,35</a>), Hebron (<a onClick="return mV(\'Jos\',10,36,37);">10:36,37</a>), Debir (<a onClick="return mV(\'Jos\',10,38,39);">10:38,39</a>), and summarily all the land, defined as from Kadesh-barnea unto Gaza, and as far north as Gibeon (<a onClick="return mV(\'Jos\',10,40,41,42);">10:40-42</a>); return to Gilgal (<a onClick="return mV(\'Jos\',10,43);">10:43</a>).<P><a onClick="return mV(\'Jos\',11,\'1-\');">Joshua 11</a>: Defeat of Jabin, king of Hazor, and allied kings at the waters of Merom (<a onClick="return mV(\'Jos\',11,\'1-9\');">11:1-9</a>); destruction of Hazor (<a onClick="return mV(\'Jos\',11,\'10-15\');">11:10-15</a>); reiterated summary of Joshua\'s conquests (<a onClick="return mV(\'Jos\',11,\'16-23\');">11:16-23</a>).<P><a onClick="return mV(\'Jos\',12,\'1-\');">Joshua 12</a>: Final summary of the Israelite conquests in Canaan, of Sihon and Og on the east of the Jordan under the leadership of Moses (<a onClick="return mV(\'Jos\',12,\'1-\');">12:1-6</a>); of 31 kings and their cities on the west of the river under Joshua (<a onClick="return mV(\'Jos\',12,\'7-24\');">12:7-24</a>).<P>2. Allotment of the Country to the Tribes of Israel:<P><a onClick="return mV(\'Jos\',13,\'1-\');">Joshua 13</a>: Command to Joshua to allot the land on the west of the Jordan, even that which was still unsubdued, to the nine and a half tribes (<a onClick="return mV(\'Jos\',13,\'1-7\');">13:1-7</a>); recapitulation of the inheritance given by Moses on the east of the river (<a onClick="return mV(\'Jos\',13,\'8-13\',32);">13:8-13,32</a>); the border of Reuben (<a onClick="return mV(\'Jos\',13,\'15-\');">13:15-23</a>), of Gad (<a onClick="return mV(\'Jos\',13,\'24-28\');">13:24-28</a>), of the half-tribe of Manasseh (<a onClick="return mV(\'Jos\',13,29,30,31);">13:29-31</a>); the tribe of Levi alone received no the landed inheritance (<a onClick="return mV(\'Jos\',13,14,33);">13:14,33</a>).<P><a onClick="return mV(\'Jos\',14,\'1-\');">Joshua 14</a>: Renewed statement of the principle on which the division of the land had been made (<a onClick="return mV(\'Jos\',14,\'1-5\');">14:1-5</a>); Hebron given to Caleb for his inheritance (<a onClick="return mV(\'Jos\',14,\'6-15\');">14:6-15</a>).<P><a onClick="return mV(\'Jos\',15,\'1-\');">Joshua 15</a>. The inheritance of Judah, and the boundaries of his territory (<a onClick="return mV(\'Jos\',15,\'1-20\');">15:1-20</a>), including that of Caleb (<a onClick="return mV(\'Jos\',15,\'13-19\');">15:13-19</a>); enumeration of the cities of Judah (<a onClick="return mV(\'Jos\',15,\'21-63\');">15:21-63</a>).<P><a onClick="return mV(\'Jos\',16,\'1-\');">Joshua 16</a>: Inheritance of the sons of Joseph (<a onClick="return mV(\'Jos\',16,\'1-4\');">16:1-4</a>); the border of Ephraim (<a onClick="return mV(\'Jos\',16,\'5-10\');">16:5-10</a>).<P><a onClick="return mV(\'Jos\',17,\'1-\');">Joshua 17</a>: Inheritance of Manasseh and the border of the half-tribe on the west of the Jordan (<a onClick="return mV(\'Jos\',17,\'1-13\');">17:1-13</a>); complaint of the sons of Joseph of the insufficiency of their inheritance, and grant to them by Joshua of an extension of territory (<a onClick="return mV(\'Jos\',17,\'14-18\');">17:14-18</a>).<P><a onClick="return mV(\'Jos\',18,\'1-\');">Joshua 18</a>: The land yet unsubdued divided by lot into 7 portions for the remaining 7 tribes (<a onClick="return mV(\'Jos\',18,\'1-10\');">18:1-10</a>); inheritance of the sons of Benjamin and the border of their territory (<a onClick="return mV(\'Jos\',18,\'11-20\');">18:11-20</a>); enumeration of their cities (<a onClick="return mV(\'Jos\',18,\'21-28\');">18:21-28</a>).<P><a onClick="return mV(\'Jos\',19,\'1-\');">Joshua 19</a>: Inheritance of Simeon and his border (<a onClick="return mV(\'Jos\',19,\'1-9\');">19:1-9</a>); of Zebulun and his border (<a onClick="return mV(\'Jos\',19,\'10-16\');">19:10-16</a>); of Issachar and his border (<a onClick="return mV(\'Jos\',19,\'17-23\');">19:17-23</a>); of Asher and his border (<a onClick="return mV(\'Jos\',19,\'24-31);">19:24-31</a>); of Naphtali and his border (<a onClick="return mV(\'Jos\',19,\'32-39\');">19:32-39</a>); and of Dan and his border (<a onClick="return mV(\'Jos\',19,\'40-48\');">19:40-48</a>); inheritance of Joshua (<a onClick="return mV(\'Jos\',19,49,50);">19:49,50</a>); concluding statement (<a onClick="return mV(\'Jos\',19,51);">19:51</a>).<P><a onClick="return mV(\'Jos\',20,\'1-\');">Joshua 20</a>: Cities of Refuge appointed, three on each side of the Jordan.<P><a onClick="return mV(\'Jos\',21,48);">Joshua 21:48</a> cities with their suburbs given to the Levites out of the territories of the several tribes (<a onClick="return mV(\'Jos\',21,\'1-41\');">21:1-41</a>); the people had rest in the land, their enemies being subdued, according to the Divine promise (<a onClick="return mV(\'Jos\',21,\'43,44,45);">21:43-45</a>).<P><a onClick="return mV(\'Jos\',22,\'1-\');">Joshua 22</a>: Dismissal of the eastern tribes to their inheritance, their duty to their brethren having been fulfilled (<a onClick="return mV(\'Jos\',22,\'1-9\');">22:1-9</a>); the erection by them of a great altar by the side of the Jordan aroused the suspicion of the western tribes, who feared that they intended to separate themselves from the common cause (<a onClick="return mV(\'Jos\',22,\'10-20\');">22:10-20</a>); their reply that the altar is to serve the purpose of a witness between themselves and their brethren (<a onClick="return mV(\'Jos\',22,\'21-34\');">22:21-34</a>).<P><a onClick="return mV(\'Jos\',23,\'1-\');">Joshua 23</a>: Joshua\'s address of encouragement and warning to the people.<P><a onClick="return mV(\'Jos\',24,\'1-\');">Joshua 24</a>: Second address of Joshua, recalling to the people their history, and the Divine interventions on their behalf (<a onClick="return mV(\'Jos\',24,\'1-23\');">24:1-23</A>); the people\'s pledge of loyalty to the Lord, and formal covenant in Shechem (<a onClick="return mV(\'Jos\',24,24,25);">24:24,25</a>); the book of the law of God is committed to writing, and a stone is erected as a permanent memorial (<a onClick="return mV(\'Jos\',24,26,27,28);">24:26-28</a>); death and burial of Joshua (<a onClick="return mV(\'Jos\',24,\'29-31\');">24:29-31</a>); burial in Shechem of the bones of Joseph, brought from Egypt (<a onClick="return mV(\'Jos\',24,32);">24:32</a>); death and burial of Eleazar, son of Aaron (<a onClick="return mV(\'Jos\',24,33);">24:33</a>).<P>III. Historical Character and Chronology.<P>1. The Book of Joshua as History:<P>As a historical narrative, therefore, detailing the steps taken to secure the conquest and possession of Canaan, Joshua is incomplete and is marked by many omissions, and in some instances at least includes phrases or expressions which seem to imply the existence of parallel or even divergent accounts of the same event, e.g. in the passage of the Jordan and the erection of memorial stones (<a onClick="return mV(\'Jos\',3,\'1-\');">Joshua 3</a>; <a onClick="return mV(\'Jos\',4,\'1-\');">4</a>), the summary of the conquests of Joshua (<a onClick="return mV(\'Jos\',10,\'40-43\');">10:40-43</a>; <a onClick="return mV(\'Jos\',11,\'16-23\');">11:16-23</a>), or the references to Moses\' victories over the Amorite kings on the east of the Jordan.<P>This last fact suggests, what is in itself sufficiently probable, that the writer or compiler of the book made use of previously existing records or narratives, not necessarily in every instance written, but probably also oral and traditional, upon which he relied and out of which by means of excerpts with modifications and omissions, the resultant history was composed. The incomplete and defective character of the book therefore, considered merely as a history of the conquest of Western Palestine and its allotment among the new settlers, would seem to indicate that the "sources" available for the writer\'s use were fragmentary also in their nature, and did not present a complete view either of the life of Joshua or of the experiences of Israel while under his direction.<P>2. Chronology:<P>Within the limits of the book itself, moreover, notifications of chronological sequence, or of the length of time occupied in the various campaigns, are almost entirely wanting. Almost the only references to date or period are the statements that Joshua himself was 110 years old at the time of his death (<a onClick="return mV(\'Jos\',24,29);">24:29</a>), and that his wars lasted "a long time" (<a onClick="return mV(\'Jos\',11,18);">11:18</a>; compare <a onClick="return mV(\'Jos\',23,1);">23:1</a>). Caleb also, the son of Jephunneh, companion of Joshua in the mission of the spies from Kadesh-barnea, describes himself as 85 years old, when he receives Hebron as his inheritance (<a onClick="return mV(\'Jos\',14,10);">14:10</a>; compare <a onClick="return mV(\'Jos\',15,13);">15:13</a>ff); the inference would be, assuming 40 years for the wanderings in the desert, that 5 years had then elapsed since the passage of the Jordan "on the tenth day of the first month" (<a onClick="return mV(\'Jos\',4,19);">4:19</a>). No indication, however, is given of the chronological relation of this event to the rest of the history; and 5 years would be too short a period for the conquest of Palestine, if it is to be understood that the whole was carried out in consecutive campaigns under the immediate command of Joshua himself. On the other hand, "very much land" remained still unsubdued at his death (<a onClick="return mV(\'Jos\',13,1);">13:1</a>). Christian tradition seems to have assumed that Joshua was about the same age as Caleb, although no definite statement to that effect is made in the book itself; and that, therefore, a quarter of a century, more or less, elapsed between the settlement of the latter at Hebron and Joshua\'s death (<a onClick="return mV(\'Jos\',14,10);">14:10</a>; <a onClick="return mV(\'Jos\',24,29);">24:29</A>). The entire period from the crossing of the Jordan would then be reckoned at from 28 to 30 years.<P>IV. Sources of the Written Narrative.<P>The attempt to define the "sources" of Joshua as it now exists, and to disentangle them one from another, presents considerably more difficulty than is to be encountered for the most part in the Pentateuch. The distinguishing criteria upon which scholars rely and which have led serious students of the book to conclude that there may be traced here also the use of the same "documents" or "documentary sources" as are to be found in the Pentateuch, are essentially the same. Existing and traditional accounts, however, have been used apparently with greater freedom, and the writer has allowed himself a fuller liberty of adaptation and combination, while the personal element has been permitted wider scope in molding the resultant form which the composition should take. For the most part, therefore, the broad line of distinction between the various "sources" which have been utilized may easily be discerned on the ground of their characteristic traits, in style, vocabulary or general conception; in regard to detail, however, the precise point at which one "source" has been abandoned for another, or the writer himself has supplied deficiencies and bridged over gaps, there is frequent uncertainty, and the evidence available is insufficient to justify an absolute conclusion. The fusion of material has been more complete than in the 5 books of the law, perhaps because the latter were hedged about with a more reverential regard for the letter, and at an earlier period attained the standing of canonicity.<P>A detailed analysis of the sources as they have been distinguished and related to one another by scholars is here unnecessary. A complete discussion of the subject will be found in Dr. Driver\'s LOT6, 105ff, in other Introductions, or in the Commentaries on Joshua. Not seldom in the ultimate detail the distinctions are precarious, and there are differences of opinion among scholars themselves as to the precise limit or limits of the use made of any given source, or at what point the dividing line should be drawn. It is only in a broad and general sense that in Joshua especially the literary theory of the use of "documents," as generally understood and as interpreted in the case of the Pentateuch, can be shown to be well founded. In itself, however, such a theory is eminently reasonable, and is both in harmony with the general usage and methods of ancient composition, and affords ground for additional confidence in the good faith and reliability of the narrative as a whole.<P>V. Relation to the Book of Judges.<P>1. Parallel Narratives:<P>A comparison moreover of the history recorded in Joshua with the brief parallel account in Judges furnishes ground for believing that a detailed or chronological narrative was not contemplated by the writer or writers themselves. The introductory verses of Judges (<a onClick="return mV(\'Jdg\',1,\'1-\');">1:1</a>-<a onClick="return mV(\'Jdg\',2,\'1-5\');">2:5</a>) are in part a summary of incidents recorded in Joshua, and in part supply new details or present a different view of the whole. The original notices that are added relate almost entirely to the invasion and conquest of Southern Palestine by the united or allied tribes of Judah and Simeon and the destruction of Bethel by the "house of Joseph." The action of the remaining tribes is narrated in a few words, the brief record closing in each case with reference to the condition of servitude to which the original inhabitants of the land were reduced. And the general scheme of the invasion as there represented is apparently that of a series of disconnected raids or campaigns undertaken by the several tribes independently, each having for its object the subjection of the territory assigned to the individual tribe. A general and comprehensive plan of conquest under the supreme leadership of Joshua appears to be entirely wanting. In detail, however, the only real inconsistency between the two narratives would appear to be that in Judges (<a onClick="return mV(\'Jdg\',1,21);">1:21</a>) the failure to expel the Jebusites from Jerusalem is laid to the account of the Benjamites, while in <a onClick="return mV(\'Jos\',15,63);">Jos 15:63</a> it is charged against the children of Judah. The difficulties in the way of the formation of a clear conception of the incidents attending the capture of Jerusalem are perhaps insuperable upon any hypothesis; and the variation of the tribal name in the two texts may be no more than a copyist\'s error.<P>2. Omissions in the History:<P>A perhaps more striking omission in both narratives is the absence of any reference to the conquest of Central Palestine. The narrative of the overthrow of Bethel and Ai (<a onClick="return mV(\'Jos\',6,\'1-\');">Jos 6:1-8:29</a>) is followed immediately by the record of the building of an altar on Mt. Ebal and the recitation of the Law before the people of Israel assembled in front of Mts. Ebal and Gerizim (<a onClick="return mV(\'Jos\',8,30);">Jos 8:30</a>). Joshua then turns aside to defeat at Beth-horon the combination of the Amorite kings, and completes the conquest of the southern country as far south as Kadesh-barnea (10:41). Immediately thereafter he is engaged in overthrowing a confederacy in the far north (<a onClick="return mV(\'Jos\',11,\'1-15\');">11:1-15</a>), a work which clearly could not have been undertaken or successfully accomplished, unless the central region had been already subdued; but of its reduction no account is given. It has been supposed that the silence of the narrator is an indication that at the period of the invasion this district was in the occupation of tribes friendly or even related to the Israelite clans; and in support of the conjecture reference has been made to the mention of Israel on the stele of Merenptah, the Egyptian ruler in whose reign, according to the most probable view, the exodus took place. In this record the nation or a part thereof is regarded as already settled in Palestine at a date earlier by half a century than their appearance under Moses and Joshua on the borders of the Promised Land. The explanation is possible, but perhaps hardly probable. The defects of the historical record are irremediable at this distance of time, and it must be acknowledged that with the available material no complete and consistent narrative of the events of the Israelite conquest of Palestine can be constructed.<P>VI. Place of Joshua in the Hebrew Canon.<P>In the Hebrew Canon Joshua is the first in order of the prophetical books, and the first of the group of 4, namely, Joshua, Judges, Samuel, Kings, which form the "Earlier Prophets" (nebhi\'im ri\'shonim). These books, the contents of which are history, not prophecy in the ordinary sense of the term, were assigned by the Jews to the 2nd division of their sacred Canon, and found a place by the side of the great writings of the "Later Prophets" (nebhi\'im \'acharonim). This position was given to them in part perhaps because they were believed to have been written or composed by prophets, but mainly because Jewish history was regarded as in purpose and intent "prophetic," being directed and presided over by Yahweh Himself, and conveying direct spiritual instruction and example. The Canon of the Law, moreover, was already closed; and however patent and striking might be the resemblance of Joshua in style and method of composition to the books of the Pentateuch, it was impossible to admit it therein, or to give a place within the Torah, a group of writings which were regarded as of Mosaic authorship, to a narrative of events which occurred after Moses\' death. Later criticism reviewed and reversed the verdict as to the true character of the book. In every Canon except the Hebrew, its historical nature was recognized, and the work was classified accordingly. Modern criticism has gone further, and, with increasing consciousness of its close literary relationship to the books of the Law, has united it with them in a Hexateuch, or even under the more comprehensive title of Octateuch combines together the Books of Judges and Ruth with the preceding six on the ground of similarity of origin and style. VII. Greek and Other Ancient Versions.<P>1. The Greek:<P>In the ancient versions of Joshua there is not much that is of interest. The Greek translation bears witness to a Hebrew original differing little from the Massoretic Text. In their renderings, however, and general treatment of the Hebrew text, the translators seem to have felt themselves at liberty to take up a position of greater independence and freedom than in dealing with the 5 books of the Law. Probably also the rendering of Joshua into Greek is not to be ascribed to the same authors as the translation of the Pentateuch. While faithful to the Hebrew, it is less constantly and exactly literal, and contains many slight variations, the most important of which are found in the last 6 chapters.<P><a onClick="return mV(\'Jos\',19,\'1-\');">Joshua 19</a>: The Septuagint transposes <a onClick="return mV(\'Jos\',19,47,48);">19:47,48</a>, and, omitting the first clause of <a onClick="return mV(\'Jos\',19,47);">19:47</a>, refers the whole to the sons of Judah, without mention of Dan; it further adds <a onClick="return mV(\'Jos\',19,147,48;">19:47a, 48a</a> on the relation between the Amorites and Ephraim, and the Amorites and the Danites respectively. With <a onClick="return mV(\'Jos\',19,47);">19:47a</a> compare <a onClick="return mV(\'Jos\',16,10);">16:10</a> and <a onClick="return mV(\'Jdg\',1,29);">Jud 1:29</a>, and with <a onClick="return mV(\'Jdg\',19,48);">19:48a</a> compare <a onClick="return mV(\'Jdg\',19,47);">19:47 (Hebrew)</a> and <a onClick="return mV(\'Jdg\',1,34);">Jud 1:34</a>.<P><a onClick="return mV(\'Jos\',20,\'4-6\');">Joshua 20:4-6</a> inclusive are omitted in B, except a clause from <a onClick="return mV(\'Jos\',20,6);">20:6</a>; A, however, inserts them in full. Compare Driver, LOT6,112,who, on the ground of their Deuteronomic tone, regards it as probable that the verses are an addition to the Priestly Code (P), and therefore did not form part of the original text as used by the Greek translators.<P><a onClick="return mV(\'Jos\',21,36,37);">Joshua 21:36,37</a>, which give the names of the Levitical cities in Judah, are omitted in the Hebrew printed text although found in many Hebrew manuscripts. Four verses also are added after <a onClick="return mV(\'Jos\',21,42);">21:42</a>, the first three of which repeat <a onClick="return mV(\'Jos\',19,50);">19:50</a>f; and the last is a reminiscence of <a onClick="return mV(\'Jos\',5,3);">5:3</a>.<P><a onClick="return mV(\'Jos\',24,29);">Joshua 24:29</a>f which narrate the death and burial of Joshua are placed in the Greek text after <a onClick="return mV(\'Jos\',24,31);">24:31</a>; and a verse is inserted after <a onClick="return mV(\'Jos\',24,30);">24:30</a> recording that the stone knives used for the purposes of the circumcision (<a onClick="return mV(\'Jos\',5,2);">5:2</a>ff) were buried with Joshua in his tomb (compare <a onClick="return mV(\'Jos\',21,42);">21:42</a>). After <a onClick="return mV(\'Jos\',24,33);">24:33</a> also two new verses appear, apparently a miscellany from <a onClick="return mV(\'Jdg\',2,6,\'11-15\');">Jud 2:6,11-15</a>; <a onClick="return mV(\'Jdg\',3,7,12,14);">3:7,12,14</a>, with a statement of the death and burial of Phinehas, son and successor of Eleazar, of the idolatrous worship by the children of Israel of Astarte and Ashtaroth, and the oppression under Eglon, king of Moab.<P>2. Other Ancient Versions:<P>The other VSS, with the exception of Jerome\'s translation from the Hebrew, are secondary, derived mediately through the Greek. The Old Latin is contained in a manuscript at Lyons, Cod. Lugdunensis, which is referred to the 6th century. Of the Coptic version only small portions are extant; they have been published by G. Maspero, Memoires de la mission archeologique frantsaise, tom. VI, fasc. 1, le Caire,1892,and elsewhere. A Samaritan translation also is known, for parts of which at least an early origin and an independent derivation from the Hebrew have been claimed. The ancient character of the version, however, is contested, and it has been shown that the arguments on which reliance was placed are insufficient to justify the conclusions drawn. The translation appears to be in reality of quite recent date, and to have been made originally from the Arabic, perhaps in part compared with and corrected by the Massoretic Text. The subject was fully and conclusively discussed by Dr. Yehuda of Berlin, at the Oriental Congress in the summer of 1908, and in a separate pamphlet subsequently published. It was even stated that the author of the version was still living, and his name was given. Dr. Gaster, the original discoverer of the Samaritan MS, in various articles and letters maintains his contention that the translation is really antique, and therefore of great value, but he has failed to convince scholars. (See M. Gaster in JRAS (1908), 795ff, 1148ff; E. N. Adler, ib, 1143ff. The text of the manuscript was published by Dr. Caster in ZDMG (1908), 209ff, and a specimen chapter with English rendering and notes in PSBA, XXXI (1909), 115ff, 149ff.)<P>VIII. Religious Purpose and Teaching. As a whole, then, Joshua is dominated by the same religious and hortatory purpose as the earlier writings of the Pentateuch; and in this respect as well as in authorship and structure the classification which assigns to it a place by the side of the 5 books of Moses and gives to the whole the title of Hexateuch is not unjustified. The author or authors had in view not merely the narration of incident, nor the record of events in the past history of their people of which they judged it desirable that a correct account should be preserved, but they endeavored in all to subserve a practical and religious aim. The history is not for its own sake, or for the sake of the literal facts which it enshrines, but for the sake of the moral and spiritual lessons which may be elucidated therein, and enforced from its teaching. The Divine leading in history is the first thought with the writer. And the record of Israel\'s past presents itself as of interest to him, not because it is a record of events that actually happened, but because he sees in it the ever-present guidance and overruling determination of God, and would draw from it instruction and warning for the men of his own time and for those that come after him. Not the history itself, but the meaning and interpretation of the history are of value. Its importance lies in the illustrations it affords of the controlling working of a Divine Ruler who is faithful to His promises, loving righteousness and hating iniquity, and swaying the destinies of men in truth. Thus the selection of materials, and the form and arrangement of the book are determined by a definite aim: to set forth and enforce moral lessons, and to exhibit Israel\'s past as the working out of a Divine purpose which has chosen the nation to be the recipient of the Divine favor, and the instrument for the carrying forward of His purposes upon earth.<P>LITERATURE.<P>A Complete bibliography of the literature up to date will be found in the dictionaries, under the word "Joshua," DB2,1893,HDB, II,1899,EB, II, 1901; compare W. H. Bennett, "The Book of Joshua," in SBOT, Leipzig, 1895; W.G. Blaikie, "Joshua," in Expositor\'s Bible, 1893; A. Dillmann, Numbers, Deuteronomy, Josua 2, Leipzig, 1886; H. Holzinger, "Das Buch Josua," in Kurzer Hand-Comm. zum A T, Tubingen, 1901; C. Steuernagel, "Josua," in Nowack\'s Handcommentar zum Altes Testament, 1899; S. Oettli, "Deuteronomy, Josua u. Richter," in Kurzgef. Komm, Munchen, 1893; W.J. Deane, Joshua, His Life and Times, in "Men of the Bible Series," London.``65';
isbe[5167]='Josiah`jo-si\'-a (yo\'shiyahu, "Yahweh supports him"; Ioseias; the King James Version <a href="./study/isbe/search.html?string=UPPERCASE">JOSIAS</a> (which see)):<P><b>I. SOURCES FOR HIS LIFE AND TIMES</b><P class="in15">1. Annalistic<P class="in15">2. Prophetic<P class="in15">3. Memorial<P><b>II. TRAITS OF HIS REIGN</b><P class="in15">1. Situation at the Beginning<P class="in15">2. Finding of the Law<P class="in15">3. The Great Reform<P class="in15">4. Disaster at Megiddo</a><P>The name given 6 years before the death of his grandfather Manasseh resumes the Judaic custom, suspended in the case of that king and Amon, of compounding royal names with that of Yahweh; perhaps a hint of the time, when, according to the Chronicler, Manasseh realized Yahweh\'s claim on his realm (<a onClick="return mV(\'2Ch\',33,12,13);">2Ch 33:12,13</a>). One of the most eminent of the kings of Judah; came to the throne at 8 years of age and reigned circa 637-608 BC.<P>I. Sources for His Life and Times.<P>1. Annalistic:<P>The earliest history is dispassionate in tone, betraying its prophetic feeling, however, in its acknowledgment of Yahweh\'s wrath, still menacing in spite of Josiah\'s unique piety (<a onClick="return mV(\'2Ki\',23,26,27);">2Ki 23:26,27</a>). For "the rest of his acts" (to which the rather bald account of his death is relegated as a kind of appendix), it refers to "the book of the chronicles of the kings of Judah." In the later history (<a onClick="return mV(\'2Ch\',34,\'1-\');">2Ch 34</a>; <a onClick="return mV(\'2Ch\',35,\'1-\');">35</a>), written from the developed ecclesiastical point of view, he is considerably idealized: the festal and ceremonial aspects of his reform are more fully detailed, and the story of his campaign and death is more sympathetically told in the sense of it as a great national calamity.<P>2. Prophetic:<P>For the spiritual atmosphere of his time and the prophetic consciousness of a day of wrath impending, the prophet Zephaniah is illuminating, especially for the first half of the reign. Jeremiah, born at about the same time as Josiah, began prophesying in the 13th year of the reign (<a onClick="return mV(\'Jer\',1,2);">Jer 1:2</a>). His intimate connection with state affairs, however, belongs to succeeding reigns; but some prophecies of his, notably those revealing his attitude toward the temple misuse (<a onClick="return mV(\'Jer\',7,\'1-15\');">7:1-15</a>) and toward the Deuteronomic reform (<a onClick="return mV(\'Jer\',11,\'1-13\');">11:1-13</a>), throw much light on the prevailing conditions. Nahum, writing near the end of the reign, and from an outlying village, is less concerned with home affairs than with the approaching end of Nineveh (fell 606 BC).<P>3. Memorial:<P>In Jesus Sirach\'s Praise of Famous Men there is a passage (Sirach 49:1-4), wholly eulogistic of Josiah, on the score that "in the days of wicked men he made godliness to prevail"; and along with David and Hezekiah he is one of the three who alone did not "commit trespass." Jeremiah\'s lamentation for Josiah, mentioned in <a onClick="return mV(\'2Ch\',35,25);">2Ch 35:25</a>, is not preserved to us; instead there is only an allusion (<a onClick="return mV(\'Jer\',22,10);">Jer 22:10</a>), naming his successor Shallum (Jehoahaz) as a fitter subject. The lamentations which became "an ordinance in Israel" (<a onClick="return mV(\'2Ch\',35,25);">2Ch 35:25</a>) are not to be referred to the Scripture book of that name; which has no hint of Josiah, unless <a onClick="return mV(\'Lam\',4,20);">La 4:20</a> be so construed.<P>II. Traits of His Reign.<P>1. Situation at the Beginning:<P>Until his 18th year 2 Kings gives no events of Josiah\'s reign; 2 Chronicles, however, relates that in his 8th year (at 16 years of age) he "began to seek after the God of David his father," and that in the 12th year he began the purgation of Judah and Jerusalem. The Chronicler may be mistaken in putting the completion of this work before the finding of the law (<a onClick="return mV(\'2Ch\',34,8);">2Ch 34:8</a>), but of his disposition and of his beginning without documentary warrant on a work which Hezekiah had attempted before him, there is no reason to doubt. And indeed various influences were working together to make his procedure natural. The staunch loyalty to the Davidic house, as emphasized by the popular movement which seated him (see under <a href="./study/isbe/search.html?string=AMON">AMON</a>), would in itself be an influence to turn his mind to the God of David his father. Manasseh\'s all-embracing idolatry had indeed reduced his aristocracy to a people "settled on their lees, that say in their heart, Yahweh will not do good, neither will he do evil" (<a onClick="return mV(\'Zep\',1,12);">Ze 1:12</a>); but these represented merely the inertia, not the intelligence, of the people. Over against them is to be reckoned the spiritually-minded "remnant" with which since Isaiah the prophets had been working; a remnant now seasoned by persecution, and already committed to the virtue of meekness (<a onClick="return mV(\'Zep\',2,3);">Ze 2:3</a>) and the willing acceptance of affliction as their appointed lot, as against the arrogance of the "proudly exulting ones" (<a onClick="return mV(\'Zep\',3,\'11-13\');">Ze 3:11-13</a>). To such courage and hope the redeeming element of Israel had grown in the midst of a blatant infidelity and worldliness. Nor were they so unconnected with the established order as formerly. The ministers of the temple-service, if not subjected to persecution, had been ranked on a level with devotees of other cults, and so had a common cause which would work to unite the sympathies of priests and prophets in one loyalty to Yahweh. All this is adduced as indicating how the better elements of the nation were ripening for a forward step in enlightened religious progress.<P>2. Finding of the Law:<P>The providential moment arrived when in the 18th year of his reign Josiah sent Shaphan the scribe to the temple to arrange with Hilkiah the high priest for the prescribed temple repairs. On giving his account of the funds for that purpose, Hilkiah also delivered to Shaphan a book which he had found in the "house of Yahweh," that is, in the temple proper; which book, when Shaphan read therefrom to the king, caused the latter to rend his robe in dismay and consternation. It was a book in which were commands of Yahweh that had long been unknown or disregarded, and along with these, fearful curses to follow the infraction of them. Such a discovery could not be treated lightly, as one might spurn a prophet or priest; nay, it immediately called the authority of the prophet into requisition. The king sent a deputation to Huldah the prophetess for her verdict on the book; and she, whether aware of its contents or not, assured him that the curses were valid, and that for impieties against which the prophets continually warned, all the woes written in the book were impending. One of the most voluminous discussions of Biblical scholarship has centered round the question what this book was, what its origin, and how it came there in the temple. The Chronicler says roundly it was "the book of the law of Yahweh by the hand of Moses." That it was from the nation\'s great first prophet and lawgiver was the implicit belief of the king and all his contemporaries. There can be little doubt, judging from the nature of the reforms it elicited and the fact that the curses it contained are still extant, that this "book of the law" was virtually identical with our Book of Deuteronomy. But is this the work of Moses, or the product of a later literary activity? In answer, it is fair to say that it is so true to the soundest interpretation of the spirit and power of Moses that there need be no hesitation in calling it genuinely Mosaic, whatever adaptations and supplementations its laws received after his time. Its highly developed style, however, and its imperfect conformity to the nomadic conditions of Moses\' time, make so remote an origin of its present form very doubtful. It comes to us written with the matured skill of Israel\'s literary prime, in a time too when, as we know (see under <a href="./study/isbe/search.html?string=HEZEKIAH">HEZEKIAH</a>), men of letters were keenly interested in rescuing and putting to present use the literary treasures of their past. As to how it came to be left in the temple at a time so much before its discovery that none questioned its being what it purported to be, each scholar must answer for himself. Some have conjectured that it may have been a product of Solomon\'s time, and deposited, according to immemorial custom in temple-building, in the foundation of Solomon\'s temple, where it was found when certain ruins made repairs necessary. To the present writer it seems likelier that it was one of the literary products of Hezekiah\'s time, compiled from scattered statutes, precedents, and customs long in the keeping—or neglect—of priests and judges, put into the attractive form of oratory, and left for its providential moment.<P>See further, <a href="./study/isbe/search.html?string=DEUTERONOMY">DEUTERONOMY</a>; <a href="./study/isbe/search.html?string=WRITING">WRITING</a>.<P>3. The Great Reform:<P>Josiah\'s immediate procedure was to call to the temple a representative assemblage—elders, prophets, priests, populace—and to read to them this "book of the covenant" (<a onClick="return mV(\'2Ki\',23,2);">2Ki 23:2</a>). Then he made a solemn covenant before Yahweh to obey it, and all the people stood to the covenant. So, perhaps for the first time, the people of Judah and Jerusalem had for their guidance not only the case decisions of judges and priests, nor only the emergency warnings and predictions of prophets, but a written and accessible document, covering in a large and liberal way the duties of their civic, social and religious life. One of the most momentous productions of all history, the book became the constitution of the Jewish race; nor were its noble provisions superseded when, centuries later, the tethers of race were broken and a Christian civilization came into its heritage. But the book that was destined to have so large a significance in all coming history had its immediate significance too, and never had this been so pressing. Josiah\'s consternation arose from the sense of how much of the nation\'s obvious duty had been left undone and unregarded. First of all, they had through heedless years and ages drifted into a medley of religious ideas and customs which had accumulated until all this lumber of Manasseh\'s idolatry was upon them. Hezekiah had tried to clear away some of its most crude and superstitious elements (see under <a href="./study/isbe/search.html?string=HEZEKIAH">HEZEKIAH</a>), but he was handicapped by the lack of its clear issue and objective, which now this book supplied. Zephaniah too was showing what Yahweh\'s will was (<a onClick="return mV(\'Zep\',1,\'2-6\');">Ze 1:2-6</a>); there must be a clean sweep of the debasing and obscuring cults, and the purgation must be done to stay. So Josiah\'s first reforming step was to break up the high places, the numerous centers of the evil, to destroy the symbols and utensils of the idolatrous shrines and rites, and to defile them past resuscitation. His zeal did not stop with Jerusalem and Judah; he went on to Bethel, which had been the chief sanctuary of the now defunct Northern Kingdom, and in his work here was recognized the fulfillment of an old prophecy dating from the time of its first king (<a onClick="return mV(\'2Ki\',23,17);">2Ki 23:17</a>; compare <a onClick="return mV(\'1Ki\',13,1,2);">1Ki 13:1,2</a>). This necessitated the concentration of public worship in the temple at Jerusalem, and in Deuteronomy was found the warrant for this, in the prescript, natural to Moses\' point of view, that the worship of Israel must have a single center as it had in the wilderness. From this negative procedure he went on to the positive measure of reviving the festival services inseparable from a religion requiring pilgrimage, instituting a grand Passover on a scale unheard of since the time of the Judges (<a onClick="return mV(\'2Ki\',23,21,22);">2Ki 23:21,22</a>), a feature of his reform on which the Chronicler dwells with peculiar zest (<a onClick="return mV(\'2Ch\',35,\'1-15\');">2Ch 35:1-15</a>). Thus both in the idolatries they must abolish and in the organized worship that they must maintain, the people were committed to a definite and documented issue; this it was which made Josiah\'s reform so momentous. That the reform seemed after Josiah\'s untimely death to have been merely outward, is what might reasonably be expected from the inveteracy of the unspirituality that it must encounter. Jeremiah had small faith in its saving power against the stubborn perversity of the people (<a onClick="return mV(\'Jer\',11,\'1-14\');">Jer 11:1-14</a>); and the historian of 2 Kings intimates that more than the piety of a zealous king was needed to turn away the stern decree of Yahweh\'s anger (<a onClick="return mV(\'2Ki\',23,26,27);">2Ki 23:26,27</a>). In spite of all hardness and apostasy, however, the nation that had once "stood to the covenant" of Deuteronomy could never again be at heart the nation it was before.<P>4. Disaster at Megiddo:<P>Ardent and pious as he was, there seems to have been a lack of balance in Josiah\'s character. His extreme dismay and dread of the curse pronounced on the realm\'s neglect of the law seems to have been followed, after his great reform had seemed to set things right, by an excess of confidence in Yahweh\'s restored favor which went beyond sound wisdom, and amounted to presumption. The power of Assyria was weakening, and Pharaoh-necoh of Egypt, ambitious to secure control of Mesopotamia, started on the campaign in which he was eventually to suffer defeat at Carchemish. Josiah, whose reforming zeal had already achieved success in Northern Israel, apparently cherished inordinate dreams of invincibility in Yahweh\'s name, and went forth with a little army to withstand the Egyptian monarch on his march through the northern provinces. At the first onset he was killed, and his expedition came to nothing. In his untimely death the fervid hopes of the pious received a set-back which was long lamented as one of the cardinal disasters of Israel. It was a sore calamity, but also a stern education. Israel must learn not only the enthusiasm but also the prudence and wisdom of its new-found faith.<P>(2) A contemporary of Zechariah (<a onClick="return mV(\'Zec\',6,10);">Zec 6:10</a>), at whose house in Jerusalem the prophet met some returned Jews from Babylon.``66';
isbe[5168]='Josias`jo-si\'-as (Textus Receptus, Iosias; Westcott and Hort, The New Testament in Greek Ioseias): <P>(1) Greek form in the King James Version of Josiah (<a onClick="return mV(\'Mat\',1,10,11);">Mt 1:10,11</a>; compare 1Esdras 1; Baruch 1:8), king of Judah.<P>(2) In 1Esdras 8:33 the King James Version for <a href="./study/isbe/search.html?string=JESIAS">JESIAS</a> (which see).``1';
