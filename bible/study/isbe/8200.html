isbe[8217]='Sirah, Well of`si\'-ra (bor hacirah, "the pit," "well" or "cistern of Sarah"): The spot from which Abner was enticed back to Hebron to his death (<a onClick="return mV(\'2Sa\',3,26);">2Sa 3:26</a>). Josephus (Ant., VII, i, 5) calls it Be(r)sira, implying that it was a "well." It is possible that this spot is now \'Ain Sarah, a spring which flows into a little tank near the west side of the road about a mile out of ancient Hebron, on the way to Jerusalem. There is, however, a curious cistern with steps known as Chamam Sarah ("Sarah\'s bath") near Ramet el-Khalil, which is also possibly the site (PEF, 314, Sh XXI).``1';
isbe[8218]='Sirion`sir\'-i-on (siryon; Sanior): The name of Mt. Hermon among the Phoenicians (<a onClick="return mV(\'Deu\',3,9);">De 3:9</a>). It is given as "Shirion" in <a onClick="return mV(\'Psa\',29,6);">Ps 29:6</a> (Hebrew "breastplate" or "body armor"). Here it is named with Lebanon. Sirion therefore probably did not denote a particular part of the Hermon Range, as did Senir, but may have been suggested by the conformation of the range itself, as seen from the heights above the Phoenician coast.``1';
isbe[8219]='Sisamai`sis\'-a-mi.`<a href="./study/isbe/search.html?string=SISMAI">SISMAI</a>`1';
isbe[8220]='Sisera`sis\'-er-a (cicera\', of doubtful meaning; S(e)isara):<P>(1) Given in <a onClick="return mV(\'Jdg\',4,\'1-\');">Judges 4</a> as the captain of the army of Jabin, king of Hazor. The accounts given of the battle of Sisera with Barak, as found in <a onClick="return mV(\'Jdg\',4,\'1-\');">Judges 4</a> and <a onClick="return mV(\'Jdg\',5,\'1-\');">5</a>, have important points of difference. The first is a prose, the second a poetic narrative. In the first only Naphtali and Zebulun are mentioned as being under the command of Barak; in the second 6 tribes are given as being under his command. In <a onClick="return mV(\'Jdg\',4,\'1-\');">Judges 4</a> Sisera is known as the captain of Jabin\'s forces, while in <a onClick="return mV(\'Jdg\',5,\'1-\');">Judges 5</a> he seems to have been an independent leader. There is also a difference as to the scene of the battle and as to the manner in which Sisera met his death at the hand of Jael. Because of these points of difference, added to the fact that this is the only account, in these early times, where a king did not lead his own forces, it is thought by many that there is here the combination of two traditions dealing with different and distinct events.<P>Sisera resided in Harosheth of the Gentiles, a place identified with el-Charithiyeh, on the right bank of the Kishon and commanding the way from the Central Plain to the sea. Taking the versions in the two chapters of Judges as being the account of a single campaign, we find Deborah urging Barak to combine the forces of Israel to wage war with Sisera as the representative of Jabin, the king of Hazor. The scene of the battle was on the plain at the foot of the slopes of Mt. Tabor (<a onClick="return mV(\'Jdg\',4,\'12-14\');">Jud 4:12-14</a>), or at the foot of the Carmel heights (<a onClick="return mV(\'Jdg\',5,19);">Jud 5:19</a>). The attack of Barak and Deborah was so furious, animated as it was by the hatred of Sisera and the Canaanites, that the hosts of Sisera were put to rout, and Sisera, deserting his troops, fled on foot to the northeast. He took refuge in the tent of Heber, near Kedesh, and here met death at the hands of Jael, the wife of Heber (see <a href="./study/isbe/search.html?string=JAEL">JAEL</a>). Sisera\'s name had long produced fear in Israel because of his oppression of the people, his vast army and his 900 chariots of iron. His overthrow was the cause of much rejoicing and was celebrated by the song in which Deborah led the people.<P>See <a href="./study/isbe/search.html?string=DEBORAH">DEBORAH</a>.<P>It is interesting to note that the great rabbi Aqiba, who fought so valiantly in the Jewish war for independence as standard bearer to Bar-cocheba, was descended from the ancient warlike Sisera of Harosheth.<P>(2) In <a onClick="return mV(\'Ezr\',2,53);">Ezr 2:53</a> and <a onClick="return mV(\'Neh\',7,55);">Ne 7:55</a> the name Sisera, after a long interval, reappears in a family of the Nethinim. There is no evidence that the latter Sisera is connected by family descent with the former.``158';
isbe[8221]='Sisinnes`si-sin\'-ez (Sisinnes): "The eparch (governor) of Syria and Phoenicia" under Darius Hystaspis (1Esdras 6:3,7,27; 7:1) circa 520 BC = "Tattenai the governor beyond the river" in <a onClick="return mV(\'Ezr\',5,3,6);">Ezr 5:3,6</a>; <a onClick="return mV(\'Ezr\',6,6,13);">6:6,13</a>. He took a prominent part in the efforts to prevent the rebuilding of the temple.``1';
isbe[8222]='Sismai`sis\'-mi (tsitsmay; the King James Version Sisamai): A Judahite, of the descendants of the daughter of Sheshan and Jarha, his Egyptian servant (<a onClick="return mV(\'1Ch\',2,40);">1Ch 2:40</a>). Commentators have compared the name to tstsm, a Phoenician god (compare Rudolph Kittel, Commentary at the place; BDB, under the word).``1';
isbe[8223]='Sister`sis\'-ter (\'achoth): Used repeatedly in the Old Testament of a female<P>(1) having the same parents as another; or<P>(2) having one parent in common, with another, half-sister (<a onClick="return mV(\'Gen\',20,12);">Ge 20:12</a>; <a onClick="return mV(\'Lev\',18,9);">Le 18:9</a>), and also<P>(3) of a female belonging to the same family or clan as another, so a kinswoman (<a onClick="return mV(\'Gen\',24,60);">Ge 24:60</a>; <a onClick="return mV(\'Job\',42,11);">Job 42:11</a>);<P>(4) also of a woman of the same country (<a onClick="return mV(\'Num\',25,18);">Nu 25:18</a>).<P>(5) Figuratively, the two kingdoms, Israel and Judah, are sisters (<a onClick="return mV(\'Eze\',23,7);">Eze 23:7</a>).<P>(6) Confederate cities are conceived of as sisters (<a onClick="return mV(\'Eze\',16,45);">Eze 16:45</a>).<P>(7) \'Achoth is used of objects which go in pairs, as curtains, each \'coupled to its sister\' (<a onClick="return mV(\'Exd\',26,3,6);">Ex 26:3,6</a>), and of wings in pairs (<a onClick="return mV(\'Eze\',1,9);">Eze 1:9</a>; <a onClick="return mV(\'Eze\',3,13);">3:13</a>);<P>(8) of virtues or conditions, with which one is closely related: "Say unto wisdom, thou art my sister" (<a onClick="return mV(\'Pro\',7,4);">Pr 7:4</a>; compare <a onClick="return mV(\'Job\',17,14);">Job 17:14</a>);<P>(9) of a lover concerning his spouse, as a term of endearment (<a onClick="return mV(\'Sgs\',4,9);">So 4:9</a>f; <a onClick="return mV(\'Sgs\',5,1);">5:1</a>f; <a onClick="return mV(\'Sgs\',8,8);">8:8</a>).<P>In the New Testament, adelphe, used<P>(1) in sense of physical or blood kinship (<a onClick="return mV(\'Mat\',12,50);">Mt 12:50</a>; <a onClick="return mV(\'Mat\',13,56);">13:56</a>; <a onClick="return mV(\'Mat\',19,29);">19:29</a>; <a onClick="return mV(\'Luk\',10,39);">Lu 10:39</a>f; <a onClick="return mV(\'Luk\',10,39);">14:26</a>; <a onClick="return mV(\'Jhn\',11,1);">Joh 11:1</a>ff; <a onClick="return mV(\'Jhn\',19,25);">19:25</a>; <a onClick="return mV(\'Act\',23,16);">Ac 23:16</a>);<P>(2) of fellow-members in Christ: "Phoebe, our sister" (<a onClick="return mV(\'Rom\',16,1);">Ro 16:1</a>; see also <a onClick="return mV(\'1Cr\',7,15);">1Co 7:15</a>; <a onClick="return mV(\'1Ti\',5,1);">1Ti 5:1</a>; <a onClick="return mV(\'Jam\',2,15);">Jas 2:15</a>);<P>(3) possibly, of a church, "thy elect sister" (<a onClick="return mV(\'2Jo\',1,13);">2Joh 1:13</a>).`<a href="./study/isbe/search.html?string=RELATIONSHIPS,+FAMILY">RELATIONSHIPS, FAMILY</a>`137';
isbe[8224]='Sister\'s Son`The King James Version translates rightly<P>(1) ben-\'achotho (<a onClick="return mV(\'Gen\',29,13);">Ge 29:13</a>); and<P>(2) huios tes adelphes (<a onClick="return mV(\'Act\',23,16);">Ac 23:16</a>), and wrongly,<P>(3) anepsios (<a onClick="return mV(\'Col\',4,10);">Col 4:10</a>), where, without doubt, the real meaning is "cousin," as in the Revised Version (British and American).`<a href="./study/isbe/search.html?string=RELATIONSHIPS,+FAMILY">RELATIONSHIPS, FAMILY</a>`1';
isbe[8225]='Sith`sith: An Anglo-Saxon word meaning "afterward," "since" (<a onClick="return mV(\'Eze\',35,6);">Eze 35:6</a> the King James Version and the English Revised Version, the American Standard Revised Version "since").``1';
isbe[8226]='Sithri`sith\'-ri (cithri): A grandson of Kohath (<a onClick="return mV(\'Exd\',6,22);">Ex 6:22</a>).``1';
isbe[8227]='Sitnah`sit\'-na (sitnah, "hatred," "hostility"; echthria): The name of the second of the two wells dug by the herdsmen of Isaac, the cause of further "enmity" with the herdsmen of Gerer (<a onClick="return mV(\'Gen\',26,21);">Ge 26:21</a>, margin "That is, Enmity"). The site is unknown, but Palmer (PEFS, 1871) finds an echo of the name in Shutnet er Rucheibeh, the name of a small valley near Rucheibeh.`<a href="./study/isbe/search.html?string=REHOBOTH">REHOBOTH</a>`1';
isbe[8228]='Sitting`sit\'-ing (yashabh, "to sit down or still," daghar, "to brood," "hatch"; kathezomai, "to sit down," anakeimai, "to lie back," "recline"): The favorite position of the Orientals (<a onClick="return mV(\'Mal\',3,3);">Mal 3:3</a>; <a onClick="return mV(\'Mat\',9,9);">Mt 9:9</a>; <a onClick="return mV(\'Mat\',26,55);">26:55</a> (compare <a onClick="return mV(\'Mat\',5,1);">Mt 5:1</a>; <a onClick="return mV(\'Luk\',4,20);">Lu 4:20</a>; <a onClick="return mV(\'Luk\',5,3);">5:3</a>); <a onClick="return mV(\'Mar\',14,18);">Mr 14:18</a>; <a onClick="return mV(\'Luk\',18,35);">Lu 18:35</a>; <a onClick="return mV(\'Jhn\',2,14);">Joh 2:14</a>, etc.).<P>"In Palestine people sit at all kinds of work; the carpenter saws, planes, and hews with his hand-adze, sitting upon the ground or upon the plank he is planing. The washerwoman sits by the tub, and, in a word, no one stands where it is possible to sit....On the low shopcounters the turbaned salesmen squat in the midst of the gay wares" (LB, II,144,275; III, 72, 75).<P>Figurative:<P>(1) To sit with denotes intimate fellowship (<a onClick="return mV(\'Psa\',1,1);">Ps 1:1</a>; <a onClick="return mV(\'Psa\',26,5);">26:5</a>; <a onClick="return mV(\'Luk\',13,29);">Lu 13:29</a>; <a onClick="return mV(\'Rev\',3,21);">Re 3:21</a>);<P>(2) to sit in the dust indicates poverty and contempt (<a onClick="return mV(\'Isa\',47,1);">Isa 47:1</a>), in darkness, ignorance (<a onClick="return mV(\'Mat\',4,16);">Mt 4:16</a>) and trouble (<a onClick="return mV(\'Mic\',7,8);">Mic 7:8</a>);<P>(3) to sit on thrones denotes authority, judgment, and glory (<a onClick="return mV(\'Mat\',19,28);">Mt 19:28</a>).``91';
isbe[8229]='Sivan`se-van\', si\'-van (ciwan): The third month of the Jewish year, corresponding to June (<a onClick="return mV(\'Est\',8,9);">Es 8:9</a>).`<a href="./study/isbe/search.html?string=CALENDAR">CALENDAR</a>`1';
isbe[8230]='Sixty`siks\'-ti (shishshim; hexekonta).`<a href="./study/isbe/search.html?string=NUMBER">NUMBER</a>`1';
isbe[8231]='Skill; Skilful`skil, skil\'-fool (forms of yadha\' (<a onClick="return mV(\'2Ch\',2,14);">2Ch 2:14</a>, etc.), bin (<a onClick="return mV(\'1Ch\',15,22);">1Ch 15:22</a>), sakhal (<a onClick="return mV(\'Dan\',1,4);">Da 1:4</a>, etc.), lamadh (<a onClick="return mV(\'1Ch\',5,18);">1Ch 5:18</a>), chakham (<a onClick="return mV(\'1Ch\',28,21);">1Ch 28:21</a>), charash (<a onClick="return mV(\'Eze\',21,31);">Eze 21:31</a>), yatabh (<a onClick="return mV(\'Psa\',33,3);">Ps 33:3</a>); in Apocrypha empeiria (<span class="noTag">The Wisdom of Solomon 13:13</span>), episteme (Sirach 1:19; 38:3,6); adverb eumathos (<span class="noTag">The Wisdom of Solomon 13:11</span>)): As a verb "to skill," meaning to have understanding or to be dexterous, common in Elizabethan English and in the King James Version and the English Revised Version (<a onClick="return mV(\'1Ki\',5,6);">1Ki 5:6</a>; <a onClick="return mV(\'2Ch\',2,7);">2Ch 2:7</a>f; <a onClick="return mV(\'2Ch\',34,12);">34:12</a>), is obsolete. The American Standard Revised Version substitutes such expressions as "knoweth how" (<a onClick="return mV(\'1Ki\',5,6);">1Ki 5:6</a>) and "were skillful with" (<a onClick="return mV(\'2Ch\',34,12);">2Ch 34:12</a>). As a noun the word is used in the sense of "knowledge" (<a onClick="return mV(\'Ecc\',9,11);">Ec 9:11</a>), "insight" (<a onClick="return mV(\'Dan\',1,17);">Da 1:17</a>), and "wisdom" (<a onClick="return mV(\'1Ch\',28,21);">1Ch 28:21</a>). The adjective skillful is used in corresponding senses, especially in the American Standard Revised Version, where it takes the place of "cunning" (<a onClick="return mV(\'Exd\',26,31);">Ex 26:31</a>; <a onClick="return mV(\'Exd\',31,4);">31:4</a>; <a onClick="return mV(\'Exd\',35,33,35);">35:33,35</a>; <a onClick="return mV(\'Exd\',38,23);">38:23</a>; <a onClick="return mV(\'2Ch\',2,7,13,14);">2Ch 2:7,13,14</a>; <a onClick="return mV(\'Sgs\',7,1);">So 7:1</a>; <a onClick="return mV(\'Isa\',40,20);">Isa 40:20</a>; <a onClick="return mV(\'Jer\',10,9);">Jer 10:9</a>) and of "curious" (<a onClick="return mV(\'Exd\',35,32);">Ex 35:32</a>), where the Hebrew chashabh suggests planning or devising, and thus what we should call "original" work. Both the English Revised Version and the American Standard Revised Version use the word in place of "eloquent" (<a onClick="return mV(\'Isa\',3,3);">Isa 3:3</a>), "right" (<a onClick="return mV(\'Ecc\',4,4);">Ec 4:4</a>) and "cunning" (<a onClick="return mV(\'1Ch\',25,7);">1Ch 25:7</a>). In the first of these instances the Hebrew word means "understanding"; in the second, it refers to the manner of doing a thing, and in the third, to the training that makes one "skilled." the Revised Version (British and American) uses the word "skilled" of those that "took the war upon them" (<a onClick="return mV(\'Num\',31,27);">Nu 31:27</a> the King James Version). Skillfulness (<a onClick="return mV(\'Psa\',78,72);">Ps 78:72</a>) is used with reference to the hands, not only in their work, but also in guiding (as, e.g., a pilot). To play well (Hebrew hetibhu naggen), is rendered "play skillfully" (<a onClick="return mV(\'Psa\',33,3);">Ps 33:3</a>). "Unskillful" is used with reference to the uninitiated in the sense of "inexperienced" (<a onClick="return mV(\'Hbr\',5,13);">Heb 5:13</a>, apeiros).``81';
isbe[8232]='Skin`(\'or, geledh, "human skin" (<a onClick="return mV(\'Job\',16,15);">Job 16:15</a>), basar, "flesh," in the sense of "nakedness" (<a onClick="return mV(\'Psa\',102,5);">Ps 102:5</a> the King James Version); derma):<P>Literal:<P>The word \'or designates the skin of both men and animals, the latter both raw and in tanned condition: "Yahweh God made for Adam and for his wife coats of skins (\'or), and clothed them" (<a onClick="return mV(\'Gen\',3,21);">Ge 3:21</a>); "She put the skins (\'or) of the kids of the goats upon his hands, and upon the smooth of his neck" (<a onClick="return mV(\'Gen\',27,16);">Ge 27:16</a>); "Can the Ethiopian change his skin, or the leopard his spots?" (<a onClick="return mV(\'Jer\',13,23);">Jer 13:23</a>). The Hebrew geledh is found in the sense of human skin: "I have sewed sackcloth upon my skin, and have laid my horn in the dust" (<a onClick="return mV(\'Job\',16,15);">Job 16:15</a>).<P>Figurative:<P>\'To escape by the skin of the teeth\' is equivalent to a narrow escape (<a onClick="return mV(\'Job\',19,20);">Job 19:20</a>). Satan says in his calumny of Job: "Skin for skin, yea, all that a man hath will he give for his life" (<a onClick="return mV(\'Job\',2,4);">Job 2:4</a>). The idea here is, that a man will endure or do the worst, even as it were the flaying of his body, to save his life. The Revised Version (British and American) has replaced "skin" as the translation of Hebrew basar by "flesh": "My bones cleave to my flesh" (<a onClick="return mV(\'Psa\',102,5);">Ps 102:5</a>). "The bars of his skin" is a poetical expression for "the members of his body" in <a onClick="return mV(\'Job\',18,13);">Job 18:13</a> margin, where the text interprets rather than translates the original.<P>Skins served for purposes of clothing from an early date (<a onClick="return mV(\'Gen\',3,21);">Ge 3:21</a>). In later days they were the raiment of prophets and hermits (<a onClick="return mV(\'Zec\',13,4);">Zec 13:4</a>; <a onClick="return mV(\'Hbr\',11,37);">Heb 11:37</a>). Septuagint translates \'addereth, "the mantle" of Elijah (<a onClick="return mV(\'1Ki\',19,13,19);">1Ki 19:13,19</a>; <a onClick="return mV(\'2Ki\',2,8,13);">2Ki 2:8,13</a>f), with melote, i.e. "sheepskin," the word in He being derived from these passages. It is not unlikely that the raiment of John the Baptist made "of camel\'s hair" and the "leathern girdle about his loins" are identical with the rough garb of Old Testament prophets. The skins of cattle were largely employed for technical uses; "rams\' skins and badgers\' skins" are especially mentioned in the construction of the tabernacle as material for the waterproof covering of the roof (<a onClick="return mV(\'Exd\',25,5);">Ex 25:5</a>; <a onClick="return mV(\'Num\',4,8,10);">Nu 4:8,10</a>).<P>The Revised Version, rejecting the translation "badgers\' skins," substitutes "sealskins" and adds "porpoise skins" in the margin. There is little doubt that the rendering of the King James Version is indeed incorrect. The Hebrew name of the animal (tachash) is the same as the Arabic tuchas, which means the dolphin and the "sea-cow" or halicore of the Red Sea, of which genus there are two species even now extant (H. tabernaculi Russ, and H. Helprichii Ehr.). It is probable that the Jews included various marine animals, seals, porpoises, dolphins and halicores, under the same expression.<P>See <a href="./study/isbe/search.html?string=SEALSKIN">SEALSKIN</a>.<P>In <a onClick="return mV(\'Eze\',16,10);">Eze 16:10</a> we find these skins mentioned as material for elegant shoes, and the Arabs of the Red Sea littoral use the same material in the manufacture of sandals. A quaint use was made of skins in the making of skin bottles, the qurbeh or qirbeh of modern Arabia. We find a great variety of Hebrew expressions, which possibly designated special varieties, all of which were rendered askos, in Septuagint and the New Testament (chemeth, no\'dh, no\'dhah, nebhel, nebhel, baqbuq, \'obh). the Revised Version (British and American) has rendered the Greek askos in the New Testament by "wineskin" (<a onClick="return mV(\'Mat\',9,17);">Mt 9:17</a>; <a onClick="return mV(\'Mar\',2,22);">Mr 2:22</a>; <a onClick="return mV(\'Luk\',5,37);">Lu 5:37</a>) with the marginal addition "that is, skins used as bottles." These skin bottles were made of the skins of goats, sheep, oxen or buffaloes; the former had more or less the shape of the animals, the holes of the extremities being closed by tying or sewing, and the neck of the skin being closed by a tap or a plug, while the larger ones were sewn together in various shapes. As a rule only the inside of the skin was tanned, the skin turned inside out, and the fluid or semi-fluid filled in, e.g. water, milk, butter, cheese. The hairy inside was not considered as in any way injurious to the contents. Only in the case of wine-and oil-skins was it thought advantageous to tan the skins inside and out.``106';
isbe[8233]='Skirt`skurt:<P>(1) kanaph, "wing" "extremity" (<a onClick="return mV(\'Rth\',3,9);">Ru 3:9</a>, etc.), is the usual word. But in <a onClick="return mV(\'1Sa\',24,4);">1Sa 24:4</a>ff perhaps "corner" is the best translation.<P>(2) shul, "loose hanging" (<a onClick="return mV(\'Exd\',28,33);">Ex 28:33</a>, etc.; in the King James Version often rendered "hem").<P>(3) peh, "mouth," "opening" (<a onClick="return mV(\'Psa\',133,2);">Ps 133:2</a>, "the precious oil...that came down upon the skirt"). But the "opening" is that for is that for the head, so that the Revised Version margin "collar" is the correct translation.<P>"Skirt" is frequently used in a euphemistic sense, for which the commentaries must be consulted.`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>; <a href="./study/isbe/search.html?string=TRAIN">TRAIN</a>`1';
isbe[8234]='Skull`skul (gulgoleth; kranion): The Hebrew word, which is well known to Bible readers in its Aramaic-Greek form "Golgotha," expresses the more or less globular shape of the human skull, being derived from a root meaning "to roll." It is often translated in English Versions of the Bible by "head," "poll," etc. In the meaning "skull" it is found twice (<a onClick="return mV(\'Jdg\',9,53);">Jud 9:53</a>; <a onClick="return mV(\'2Ki\',9,35);">2Ki 9:35</a>). In the New Testament the word is found only in connection with <a href="./study/isbe/search.html?string=GOLGOTHA">GOLGOTHA</a> (which see), "the place of a skull" (<a onClick="return mV(\'Mat\',27,33);">Mt 27:33</a>; <a onClick="return mV(\'Mar\',15,22);">Mr 15:22</a>; <a onClick="return mV(\'Jhn\',19,17);">Joh 19:17</a>), or "the skull" (<a onClick="return mV(\'Luk\',23,33);">Lu 23:33</a>).``1';
isbe[8235]='Sky`ski (shachaq, "fine dust" or "cloud," apparently from [?] shachaq, "to rub," "to pulverize"; Samaritan: shechaqayyah instead of Hebrew shamayim; sachq = "cloud," "small dust"):<P>1. In the Old Testament:<P>The Revised Version (British and American) has "skies" for the King James Version "clouds" in <a onClick="return mV(\'Job\',35,5);">Job 35:5</a>; <a onClick="return mV(\'Job\',36,28);">36:28</a>; <a onClick="return mV(\'Job\',37,21);">37:21</a>; <a onClick="return mV(\'Psa\',36,5);">Ps 36:5</a>; <a onClick="return mV(\'Psa\',57,10);">57:10</a>; <a onClick="return mV(\'Psa\',68,34);">68:34</a>; <a onClick="return mV(\'Psa\',78,23);">78:23</a>; <a onClick="return mV(\'Psa\',108,4);">108:4</a>; <a onClick="return mV(\'Pro\',3,20);">Pr 3:20</a>; <a onClick="return mV(\'Pro\',8,28);">8:28</a>, in which passages BDB supports the rendering of King James Version. In <a onClick="return mV(\'Psa\',89,6,37);">Ps 89:6,37</a> Revised Version (British and American) has "sky" for King James Version "heaven." English Versions has "sky" in <a onClick="return mV(\'Deu\',33,26);">De 33:26</a>; <a onClick="return mV(\'2Sa\',22,12);">2Sa 22:12</a>; <a onClick="return mV(\'Job\',37,18);">Job 37:18</a>; <a onClick="return mV(\'Psa\',18,11);">Ps 18:11</a>; <a onClick="return mV(\'Psa\',77,1);">77:1</a>; <a onClick="return mV(\'Isa\',45,8);">Isa 45:8</a>; <a onClick="return mV(\'Jer\',51,9);">Jer 51:9</a>. The word occurs mainly in poetical passages.<P>2. In the New Ttestament:<P>In the New Testament ouranos, is translated "heaven" (the King James Version "sky") in connection with the weather in <a onClick="return mV(\'Mat\',16,2,3);">Mt 16:2,3</a>; <a onClick="return mV(\'Luk\',12,56);">Lu 12:56</a>. In <a onClick="return mV(\'Hbr\',11,12);">Heb 11:12</a> we find "the stars of heaven" ("the sky") as a figure of multitude. The conception, however, that the visible "sky" is but the dome-like floor of a higher world often makes it hard to tell whether "heaven" in certain passages may or may not be identified with the sky.`<a href="./study/isbe/search.html?string=HEAVEN">HEAVEN</a>; <a href="./study/isbe/search.html?string=COSMOGONY">COSMOGONY</a>`37';
isbe[8236]='Slander`slan\'-der (substantive, dibbah, "slander"; diabolos, "slanderer"; verb raghal, "to slink about" as a talebearer, lashan, "to use the tongue," "to slander"; diaballo, "to calumniate," "to slander"; and other words): Slander (etymologically a doublet of "scandal," from OFr. esclandre, Latin scandalum, "stumblingblock") is an accusation maliciously uttered, with the purpose or effect of damaging the reputation of another. As a rule it is a false charge (compare <a onClick="return mV(\'Mat\',5,11);">Mt 5:11</a>); but it may be a truth circulated insidiously and with a hostile purpose (e.g. <a onClick="return mV(\'Dan\',3,8);">Da 3:8</a>, "brought accusation against," where Septuagint has diaballo, "slander"; <a onClick="return mV(\'Luk\',16,1);">Lu 16:1</a>, the same Greek word). Warnings, condemnations and complaints in reference to this sin are very frequent, both in the Old Testament and New Testament. Mischievous "tale-bearing" or "whispering" is condemned (<a onClick="return mV(\'Lev\',19,16);">Le 19:16</a>; <a onClick="return mV(\'Eze\',22,9);">Eze 22:9</a>). There are repeated warnings against evil-speaking (as in <a onClick="return mV(\'Psa\',34,13);">Ps 34:13</a>; <a onClick="return mV(\'Pro\',15,28);">Pr 15:28</a>; <a onClick="return mV(\'Eph\',4,31);">Eph 4:31</a>; <a onClick="return mV(\'Col\',3,8);">Col 3:8</a>; <a onClick="return mV(\'Jam\',4,11);">Jas 4:11</a>; <a onClick="return mV(\'1Pe\',3,10);">1Pe 3:10</a>), which is the cause of so much strife between man and man (<a onClick="return mV(\'Pro\',16,\'27-30\');">Pr 16:27-30</a>), and which recoils on the speaker himself to his destruction (<a onClick="return mV(\'Psa\',101,5);">Ps 101:5</a>; <a onClick="return mV(\'Psa\',140,11);">140:11</a>). Especially is false witness, which is "slander carried into a court of justice," to be condemned and punished (<a onClick="return mV(\'Exd\',20,16);">Ex 20:16</a>; <a onClick="return mV(\'Deu\',19,\'16-21\');">De 19:16-21</a>; compare <a onClick="return mV(\'Pro\',12,17);">Pr 12:17</a>; <a onClick="return mV(\'Pro\',14,5,25);">14:5,25</a>; <a onClick="return mV(\'Pro\',19,5);">19:5</a>; <a onClick="return mV(\'Pro\',21,28);">21:28</a>; <a onClick="return mV(\'Pro\',24,28);">24:28</a>). Special cases of slander more than usually mean are when a wife\'s chastity is falsely impeached by her husband (<a onClick="return mV(\'Deu\',22,\'13-19\');">De 22:13-19</a>), and when one slanders a servant to his master (<a onClick="return mV(\'Pro\',30,10);">Pr 30:10</a>). Even a land may be slandered as well as persons (<a onClick="return mV(\'Num\',14,36);">Nu 14:36</a>). Slanderers and backbiters are mentioned in some of Paul\'s darkest catalogues of evildoers (<a onClick="return mV(\'Rom\',1,29,30);">Ro 1:29,30</a>; <a onClick="return mV(\'2Cr\',12,20);">2Co 12:20</a>; <a onClick="return mV(\'2Ti\',3,3);">2Ti 3:3</a>). To refrain from slander is an important qualification for citizenship in theocracy (<a onClick="return mV(\'Psa\',15,1,3);">Ps 15:1,3</a>; <a onClick="return mV(\'Psa\',24,3,4);">24:3,4</a>) and for a place in the Christian church (<a onClick="return mV(\'1Ti\',3,11);">1Ti 3:11</a>; <a onClick="return mV(\'Tts\',2,3);">Tit 2:3</a>). Jesus Himself was the victim of slanders (<a onClick="return mV(\'Mat\',11,19);">Mt 11:19</a>) and of false testimony (<a onClick="return mV(\'Mat\',27,63);">Mt 27:63</a>). The apostles, too, came in for a full share of it (e.g. <a onClick="return mV(\'Act\',24,5);">Ac 24:5</a>f; <a onClick="return mV(\'Act\',28,22);">28:22</a>; <a onClick="return mV(\'2Cr\',6,8);">2Co 6:8</a>). In the case of Paul, even his central doctrine of justification was "slanderously reported" as if it encouraged immorality (<a onClick="return mV(\'Rom\',3,8);">Ro 3:8</a>). The devil (= "the calumniator") is represented as the great accuser of God\'s people (<a onClick="return mV(\'Rev\',12,10);">Re 12:10</a>), the slanderer par excellence (compare <a onClick="return mV(\'Job\',1,\'9-11\');">Job 1:9-11</a>; <a onClick="return mV(\'Zec\',3,1);">Zec 3:1</a>).`<a href="./study/isbe/search.html?string=CRIMES">CRIMES</a>; <a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`49';
isbe[8237]='Slaughter, of the Innocents`slo\'-ter.`<a href="./study/isbe/search.html?string=INNOCENTS,+MASSACRE+OF+THE">INNOCENTS, MASSACRE OF THE</a>`1';
isbe[8238]='Slaughter, Valley of`In <a onClick="return mV(\'Jer\',7,32);">Jer 7:32</a>; <a onClick="return mV(\'Jer\',19,6);">19:6</a>, a name given to the valley of Hinnom.`<a href="./study/isbe/search.html?string=HINNOM,+VALLEY+OF">HINNOM, VALLEY OF</a>; <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>`1';
isbe[8239]='Slave; Slavery`slav, slav\'-er-i:<P>1. Acquiring of Slaves<P>2. Hebrews as War Captives<P>3. Freedom of Slaves<P>4. Rights of Slaves<P>5. Rights of Slave Masters<P>6. The New Testament Conception<P>LITERATURE<hr /><P>The origin of the term "slave" is traced to the German sklave, meaning a captive of the Slavonic race who had been forced into servitude (compare Slav); French esclave, Dutch slaaf, Swedish slaf, Spanish esclavo. The word "slave" occurs only in <a onClick="return mV(\'Jer\',2,14);">Jer 2:14</a> and in <a onClick="return mV(\'Rev\',18,13);">Re 18:13</a>, where it is suggested by the context and not expressed in the original languages (Hebrew yelidh bayith, "one born in the house"; Greek soma, "body"). However, the Hebrew word \'ebhedh, in the Old Testament and the Greek word doulos, in the New Testament more properly might have been translated "slave" instead of "servant" or "bondservant," understanding though that the slavery of Judaism was not the cruel system of Greece, Rome, and later nations. The prime thought is service; the servant may render free service, the slave, obligatory, restricted service.<P>Scripture statement rather than philological study must form the basis of this article. We shall notice how slaves could be secured, sold and redeemed; also their rights and their masters\' rights, confining the study to Old Testament Scripture, noting in conclusion the New Testament conception. The word "slave" in this article refers to the Hebrew slave unless otherwise designated.<P>1. Acquiring of Slaves:<P>Slaves might be acquired in the following ways, namely:<P>(1) Bought.<P>There are many instances of buying slaves (<a onClick="return mV(\'Lev\',25,39);">Le 25:39</a>). Hebrew slavery broke into the ranks of every human relationship: a father could sell his daughter (<a onClick="return mV(\'Exd\',21,7);">Ex 21:7</a>; <a onClick="return mV(\'Neh\',5,5);">Ne 5:5</a>); a widow\'s children might be sold to pay their father\'s debt (<a onClick="return mV(\'2Ki\',4,1);">2Ki 4:1</a>); a man could sell himself (<a onClick="return mV(\'Lev\',25,39,47);">Le 25:39,47</a>); a woman could sell herself (<a onClick="return mV(\'Deu\',15,12,13,17);">De 15:12,13,17</a>), etc. Prices paid were somewhat indefinite. According to <a onClick="return mV(\'Exd\',21,32);">Ex 21:32</a> thirty shekels was a standard price, but <a onClick="return mV(\'Lev\',27,\'3-7\');">Le 27:3-7</a> gives a scale of from 3 to 50 shekels according to age and sex, with a provision for an appeal to the priest in case of uncertainty (<a onClick="return mV(\'Lev\',27,8);">27:8</A>). Twenty shekels is the price set for a young man (<a onClick="return mV(\'Lev\',27,5);">27:5</A>), and this corresponds with the sum paid for Joseph (<a onClick="return mV(\'Gen\',37,28);">Ge 37:28</a>).<P>But in 2Macc 8:11 the price on the average is 90 for a talent, i.e. 40 shekels each. The ransom of an entire talent for a single man (<a onClick="return mV(\'1Ki\',20,39);">1Ki 20:39</a>) means that unusual value (far more than that of a slave) was set on this particular captive.<P>There were certain limitations on the right of sale (<a onClick="return mV(\'Exd\',21,7);">Ex 21:7</a>).<P>(2) Exchange.<P>Slaves, i.e. non-Hebrew slaves, might be traded for other slaves, cattle, or provisions.<P>(3) Satisfaction of Debt.<P>It is probable that a debtor, reduced to extremity, could offer himself in payment of his debt (<a onClick="return mV(\'Lev\',25,39);">Le 25:39</a>), though this was forbidden in the Torath Kohanim; compare \'Otsar Yisra\'el, vii.292b. That a creditor could sell into slavery a debtor or any of his family, or make them his own slaves, has some foundation in the statement of the poor widow whose pathetic cry reached the ears of the prophet Elisha: "Thy servant my husband is dead;...and the creditor is come to take unto him my two children to be bondsmen" (<a onClick="return mV(\'2Ki\',4,1);">2Ki 4:1</a>).<P>(4) Gift.<P>The non-Hebrew slave, and possibly the Hebrew slave, could be acquired as a gift (<a onClick="return mV(\'Gen\',29,24);">Ge 29:24</a>).<P>(5) Inheritance.<P>Children could inherit non-Hebrew slaves as their own possessions (<a onClick="return mV(\'Lev\',25,46);">Le 25:46</a>).<P>(6) Voluntary Surrender.<P>In the case of a slave\'s release in the seventh year there was allowed a willing choice of indefinite slavery. The ceremony at such a time is interesting: "Then his master shall bring him unto the judges (margin), and shall bring him to the door, or unto the door-post; and his master shall bore his ear through with an awl; and he shall serve him for ever" (<a onClick="return mV(\'Exd\',21,6);">Ex 21:6</a>). A pierced ear probably meant obedience to the master\'s voice. History, however, does not record a single instance in which such a case occurred.<P>(7) Arrest.<P>"If the thief be found breaking in,...he shall make restitution: if he have nothing, then he shall be sold for his theft" (<a onClick="return mV(\'Exd\',22,2,3);">Ex 22:2,3</a>).<P>(8) Birth.<P>The children of slaves, born within the master\'s house of a wife given to the slave there, became slaves, and could be held, even if the father went free (<a onClick="return mV(\'Exd\',21,4);">Ex 21:4</a>; compare <a onClick="return mV(\'Lev\',25,54);">Le 25:54</a>).<P>(9) Capture in War.<P>Thousands of men, women and children were taken in war as captives and reduced, sometimes, to most menial slavery. Such slavery, however, was more humane than wholesale butchery according to the customs of earlier times (<a onClick="return mV(\'Num\',31,\'7-35\');">Nu 31:7-35</a>). Males were usually slain and females kept for slavery and concubinage (<a onClick="return mV(\'Deu\',21,10,11,14);">De 21:10,11,14</a>). Captive slaves and bought slaves, "from nations round about," forced moral ruin into Israel\'s early civilization.<P>See <a href="./study/isbe/search.html?string=SIEGE">SIEGE</a>, 3.<P>The two principal sources of slave supply were poverty in peace and plunder in war.<P>2. Hebrews as War Captives:<P>The Hebrews themselves were held as captive slaves at various times by<P>(1) Phoenicians (the greatest slave traders of ancient times),<P>(2) Philistines,<P>(3) Syrians (<a onClick="return mV(\'2Ki\',5,2);">2Ki 5:2</a>),<P>(4) Egyptians, and<P>(5) Romans.<P>There must have been thousands subjected to severest slavery.<P>See also <a href="./study/isbe/search.html?string=EGYPT">EGYPT</a>; <a href="./study/isbe/search.html?string=ISRAEL">ISRAEL</a>; <a href="./study/isbe/search.html?string=PHARAOH">PHARAOH</a>; <a href="./study/isbe/search.html?string=SERVANT">SERVANT</a>, etc.<P>3. Freedom of Slaves:<P>The freedom of slaves was possible in the following ways:<P>(1) By Redemption.<P>Manumission by redemption was common among the Hebrews. The slave\'s freedom might be bought, the price depending on<P>(a) the nearness to the seventh year or the Jubilee year,<P>(b) the first purchase price, and<P>(c) personal considerations as to age and ability of the one in bondage.<P>A slave could be redeemed as follows:<P>(a) by himself,<P>(b) by his uncle,<P>(c) by his nephew or cousin,<P>(d) or by any near relative (<a onClick="return mV(\'Lev\',25,\'48-55\');">Le 25:48-55</a>).<P>The price depended on certain conditions as indicated above.<P>(2) By the Lapse of Time.<P>The seventh year of service brought release from bondage. "If thou buy a Hebrew servant (margin "bondman"), six years he shall serve: and in the seventh he shall go out free for nothing" (<a onClick="return mV(\'Exd\',21,\'2-4\');">Ex 21:2-4</a>).<P>(3) By the Law of the Jubilee Year.<P>The year of Jubilee was the great year when slaves were no longer slaves but free. "He shall serve with thee unto the year of jubilee: then shall he go out from thee, he and his children...return unto his own family, and unto the possession of his fathers" (<a onClick="return mV(\'Lev\',25,40);">Le 25:40</a>f).<P>(4) By Injury.<P>A servant whose master maimed him (or her), in particular by causing the loss of an eye or even a tooth, was thereby freed (<a onClick="return mV(\'Exd\',21,26);">Ex 21:26</a>f).<P>(5) By Escape.<P>(<a onClick="return mV(\'Deu\',23,15);">De 23:15</a>f; <a onClick="return mV(\'1Ki\',2,39);">1Ki 2:39</a>). See "Code of Hammurabi" in HDB (extra vol, p. 600) and compare <a onClick="return mV(\'Phm\',1,12);">Phm 1:12</a>ff.<P>(6) By Indifference.<P>In case of a certain kind of female slave, the neglect or displeasure of her master in itself gave her the right to freedom (<a onClick="return mV(\'Exd\',21,\'7-11\');">Ex 21:7-11</a>; <a onClick="return mV(\'Deu\',21,14);">De 21:14</a>).<P>(7) By Restitution.<P>A caught thief, having become a bondsman, after making full restitution by his service as a slave, was set at liberty (<a onClick="return mV(\'Exd\',22,\'1-4\');">Ex 22:1-4</a>).<P>(8) By the Master\'s Death.<P>"And Abram said,...I go childless, and he that shall be possessor of my house is Eliezer of Damascus...and, lo, one born in my house is mine heir" (<a onClick="return mV(\'Gen\',15,2);">Ge 15:2</a>f). This passage has been mistakenly supposed to indicate that a master without children might give freedom to a slave by constituting the slave an heir to his possessions. But on the contrary, Abram seems to contemplate with horror the possibility that Eliezer will take possession of his goods in the absence of an heir. In view of the fact that adoption, the adrogatio of the Roman law, was unknown both to Biblical and Talmudic law (see Jewish Encyclopedia, under the word), the statement in <a onClick="return mV(\'Gen\',15,2);">Ge 15:2</a> does not seem to indicate any such custom as the adoption of slaves. If any method of emancipation is here suggested, it is by the death of the master without heir, a method thoroughly discussed in the Talmud (mithath ha-\'adhon).<P>(9) By Direct Command of Yahweh.<P>"The word that came unto Jeremiah from Yahweh,...that every man should let his man-servant, and...his maid-servant, that is a Hebrew or a Hebrewess, go free; that none should make bondsmen of them...they obeyed, and let them go" (<a onClick="return mV(\'Jer\',34,\'8-10\');">Jer 34:8-10</a>).<P>The nine methods here enumerated may be classified thus:<P>A. By operation of law:<P>1. By lapse of time.<P>(a) After serving six years or other contractual period. See (2) above.<P>(b) Upon the approach of the Jubilee year. See (3) above.<P>2. By death of the master without heirs. See (8) above.<P>B. By act of the parties:<P>1. By an act of the master.<P>(a) Voluntary manumission, including (9) above.<P>(b) Indifference in certain cases. See (6) above.<P>(c) Maiming servant. See (4) above.<P>2. By act of the servant.<P>(a) Redemption. See (1) above.<P>(b) Restitution. See (7) above.<P>(c) Escape. See (5) above.<P>3. By act of a third party.<P>Redemption—(1) above.<P>4. Rights of Slaves:<P>As noted in the beginning of this article, the Hebrew slaves fared far better than the Grecian, Roman and other slaves of later years. In general, the treatment they received and the rights they could claim made their lot reasonably good. Of course a slave was a slave, and there were masters who disobeyed God and even abused their "brothers in bonds." As usual the unfortunate female slave got the full measure of inhuman cruelty. Certain rights were discretionary, it is true, but many Hebrew slaves enjoyed valuable individual and social privileges. As far as Scripture statements throw light on this subject, the slaves of Old Testament times might claim the following rights, namely:<P>(1) Freedom.<P>Freedom might be gained in any one of the above-mentioned ways or at the master\'s will. The non-Hebrew could be held as a slave in perpetuity (<a onClick="return mV(\'Lev\',25,\'44-46\');">Le 25:44-46</a>).<P>(2) Good Treatment.<P>"Thou shalt not rule over him (Hebrew slave) with rigor, but shalt fear thy God....Ye shall not rule, one over another, with rigor" (<a onClick="return mV(\'Lev\',25,43,46);">Le 25:43,46</a>). The non-Hebrew seemed to be left unprotected.<P>(3) Justice.<P>An ancient writer raises the query of fairness to slaves. "If I have despised the cause of my man-servant or of my maid-servant, when they contended with me; what then shall I do when God riseth up?" (<a onClick="return mV(\'Job\',31,13);">Job 31:13</a>f). No doubt the true Hebrew master was considerate of the rights of his slaves. The very fact, however, that the Hebrew master could punish a Hebrew slave, "to within an inch of his life," gave ready opportunity for sham justice. "And if a man smite his servant, or his maid ("bondman or bondwoman"), with a rod, and he die under his hand; he shall surely be punished. Notwithstanding, if he continue a day or two, he shall not be punished; for he is his money" (<a onClick="return mV(\'Exd\',21,20);">Ex 21:20</a>f).<P>(4) Family.<P>The slave before his release might have his wife and children (<a onClick="return mV(\'Exd\',21,5);">Ex 21:5</a>).<P>(5) Voluntary Slavery.<P>Even when the seventh year came, the slave had a right to pledge himself, with awl-pierced ear, to perpetual service for his master (<a onClick="return mV(\'Exd\',21,5);">Ex 21:5</a>f; <a onClick="return mV(\'Deu\',15,16);">De 15:16</a>). The traditional interpretation of "forever" in these passages is "until the next Jubilee year" (compare Kiddushin 21).<P>(6) Money or Property.<P>Some cases at least indicate that slaves could have money of their own. Thus, if a poor slave "waxed rich" he could redeem himself (<a onClick="return mV(\'Lev\',25,49);">Le 25:49</a>). Compare <a onClick="return mV(\'1Sa\',9,\'5-10\');">1Sa 9:5-10</a>, where, however, the Hebrew throughout calls the "servant" na\'ar, "a youth," never \'ebhedh.<P>(7) Children.<P>If married when free, the slave could take wife and children with him when freedom came, but if he was married after becoming a slave, his wife and children must remain in possession of his master. This law led him often into perpetual slavery (<a onClick="return mV(\'Exd\',21,3);">Ex 21:3</a>f).<P>(8) Elevation.<P>A chance to rise was allowable in some instances, e.g. Eliezer, a foreign slave in a Hebrew household, and Joseph, a Hebrew slave in a foreign household. Each rose to a place of honor and usefulness (<a onClick="return mV(\'Gen\',15,2);">Ge 15:2</a>; <a onClick="return mV(\'Gen\',39,4);">39:4</a>).<P>(9) Religious Worship.<P>After being circumcised, slaves were allowed to participate in the paschal sacrifice (<a onClick="return mV(\'Exd\',12,44);">Ex 12:44</a>) and other religious occasions (<a onClick="return mV(\'Deu\',12,12);">De 12:12</a>).<P>(10) Gifts.<P>Upon obtaining freedom, slaves, at the discretion of masters, were given supplies of cattle, grain and wine (<a onClick="return mV(\'Deu\',15,13);">De 15:13</a>f).<P>5. Rights of Slave Masters:<P>The rights of a slave master may briefly be stated as follows:<P>(1) to hold as chattel possession his non-Hebrew slaves (<a onClick="return mV(\'Lev\',25,45);">Le 25:45</a>);<P>(2) to leave such slaves as an inheritance for his children (<a onClick="return mV(\'Lev\',25,46);">Le 25:46</a>);<P>(3) to hold as his own property the wife and children of all slaves who were unmarried at the time they became slaves (<a onClick="return mV(\'Exd\',21,4);">Ex 21:4</a>);<P>(4) to pursue and recover runaway slaves (<a onClick="return mV(\'1Ki\',2,\'39-41\');">1Ki 2:39-41</a>);<P>(5) to grant freedom at any time to any slave. This is implied rather than stated. Emancipation other than at the Sabbatical and Jubilee years was evidently the right of masters;<P>(6) to circumcise slaves, both Jew and Gentile, within his own household (<a onClick="return mV(\'Gen\',17,13,23,27);">Ge 17:13,23,27</a>);<P>(7) to sell, give away, or trade slaves (<a onClick="return mV(\'Gen\',29,24);">Ge 29:24</a>. According to Torath Kohanim a Hebrew servant could be sold only under certain restrictions. See 1, (1));<P>(8) to chastise male and female slaves, though not unto death (<a onClick="return mV(\'Exd\',21,20);">Ex 21:20</a>);<P>(9) to marry a slave himself, or give his female slaves in marriage to others (<a onClick="return mV(\'1Ch\',2,35);">1Ch 2:35</a>);<P>(10) to marry a daughter to a slave (<a onClick="return mV(\'1Ch\',2,34);">1Ch 2:34</a>f);<P>(11) to purchase slaves in foreign markets (<a onClick="return mV(\'Lev\',25,44);">Le 25:44</a>);<P>(12) to keep, though not as a slave, the runaway slave from a foreign master (<a onClick="return mV(\'Deu\',23,15,16);">De 23:15,16</a>. See 3, (5));<P>(13) to enslave or sell a caught thief (<a onClick="return mV(\'Gen\',44,\'8-33\');">Ge 44:8-33</a>; <a onClick="return mV(\'Exd\',22,3);">Ex 22:3</a>);<P>(14) to hold, in perpetuity, non-Hebrew slaves (<a onClick="return mV(\'Lev\',25,46);">Le 25:46</a>);<P>(15) to seek advice of slaves (<a onClick="return mV(\'1Sa\',25,14);">1Sa 25:14</a>ff; but the reference here is open to doubt. See 4, (6));<P>(16) to demand service (<a onClick="return mV(\'Gen\',14,14);">Ge 14:14</a>; <a onClick="return mV(\'Gen\',24,\'1-\');">24</a>).<P>Throughout Old Testament times the rights of both slaves and masters varied, but in general the above may be called the accepted code. In later times Zedekiah covenanted with the Hebrews never again to enslave their own brothers, but they broke the covenant (<a onClick="return mV(\'Jer\',34,8);">Jer 34:8</a>).<P>6. The New Testament Conception:<P>There were slaves during New Testament times. The church issued no edict sweeping away this custom of the old Judaism, but the gospel of Christ with its warm, penetrating love-message mitigated the harshness of ancient times and melted cruelty into kindness. The equality, justice and love of Christ\'s teachings changed the whole attitude of man to man and master to servant. This spirit of brotherhood quickened the conscience of the age, leaped the walls of Judaism, and penetrated the remotest regions. The great apostle proclaimed this truth: "There can be neither Jew nor Greek, there can be neither bond nor free,...ye all are one man in Christ Jesus" (<a onClick="return mV(\'Gal\',3,28);">Ga 3:28</a>). The Christian slaves and masters are both exhorted in Paul\'s letters to live godly lives and make Christ-like their relations one to the other—obedience to masters and forbearance with slaves. "Bondservants (m), be obedient unto...your masters,...as bondservants (m) of Christ...And, ye masters...forbear threatening:...their Master and yours is in heaven, and there is no respect of persons with him" (<a onClick="return mV(\'Eph\',6,\'5-9\');">Eph 6:5-9</a>).<P>Christ was a reformer, but not an anarchist. His gospel was dynamic but not dynamitic. It was leaven, electric with power, but permeated with love. Christ\'s life and teaching were against Judaistic slavery, Roman slavery and any form of human slavery. The love of His gospel and the light of His life were destined, in time, to make human emancipation earth-wide and human brotherhood as universal as His own benign presence.<P>LITERATURE.<P>Nowack, Hebrew Arch.; Ewald, Alterthumer, III, 280-88; Grunfeld, Die Stellung des Sklaven bei den Juden, nach bibl. und talmud. Quellen, 1886; Mielziner, Die Verhaltnisse der Sklaven bei den alter Hebrdern, 1859; Mandl, Das Sklavenrecht des Altes Testament, 1886; Kahn, L\'esclavagedans la Bible et le Talmud, 1867; Sayce, Social Life among the Assyrians and Babylonians; Lane, Manners and Customs of Modern Egyptians, 205; Arabian Nights, I, 64ff; Thomson, LB; McCurdy, HPM, 1894; Trumbull, Studies in Oriental Social Life, 1894. There is a wealth of material in the Talmudic tractate Kiddushin (pp. 17-22).``142';
isbe[8240]='Slaying`sla\'-ing (by spear, dart, or sword).`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[8241]='Sleep`slep: Represents many words in Hebrew and Greek. For the noun the most common are shenah, and hupnos; for the verb, yashen, shakhabh, and katheudo. The figurative uses for death (<a onClick="return mV(\'Deu\',31,16);">De 31:16</a>, etc.) and sluggishness (<a onClick="return mV(\'Eph\',5,14);">Eph 5:14</a>, etc.) are very obvious.`<a href="./study/isbe/search.html?string=DREAM">DREAM</a>`1';
isbe[8242]='Sleep, Deep`(tardemah, verb radham, from a root meaning "to be deaf"): The verb radham has no further meaning than "to be fast asleep" (<a onClick="return mV(\'Jdg\',4,21);">Jud 4:21</a>; <a onClick="return mV(\'Jon\',1,5);">Jon 1:5</a>), but the King James Version used "deep sleep" as a translation only in <a onClick="return mV(\'Dan\',8,18);">Da 8:18</a>; <a onClick="return mV(\'Dan\',10,9);">10:9</a>, where a sleep supernaturally caused (a "trance") is meant compare "dead sleep" in <a onClick="return mV(\'Psa\',76,6);">Ps 76:6</a>). The Revised Version\'s insertion of deep sleep in place of The King James Version\'s "fast asleep" in <a onClick="return mV(\'Jdg\',4,21);">Jud 4:21</a> is consequently unfortunate. The noun tardemah has the same meaning of "trance" in <a onClick="return mV(\'Gen\',2,21);">Ge 2:21</a>; <a onClick="return mV(\'Gen\',15,12);">15:12</a>; <a onClick="return mV(\'1Sa\',26,12);">1Sa 26:12</a>; <a onClick="return mV(\'Job\',4,13);">Job 4:13</a>; <a onClick="return mV(\'Job\',33,15);">33:15</a>, but in <a onClick="return mV(\'Pro\',19,15);">Pr 19:15</a>; <a onClick="return mV(\'Isa\',29,10);">Isa 29:10</a>, it is used figuratively of torpor. In <a onClick="return mV(\'Act\',20,9);">Ac 20:9</a> (huipnos bathtus), heavy natural sleep is meant.``48';
isbe[8243]='Sleeves`slevz (<a onClick="return mV(\'Gen\',37,3);">Ge 37:3</a> margin).`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>`1';
isbe[8244]='Sleight`slit: No connection with "slight," but from the same root as "sly" and so = "cunning." So in <a onClick="return mV(\'Eph\',4,14);">Eph 4:14</a>, "sleight of men," for kubeia, "dice-plalying" (compare "cube") "gamblers\' tricks" "trickery."``1';
isbe[8245]='Slime; Slime Pits`slim, slim\'-pits (chemar; Septuagint asphaltos; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) bitumen; the Revised Version margin "bitumen"; compare Arabic chummar, "bitumen"; and compare chomer, "clay," "mortar"): In the account of the ark in <a onClick="return mV(\'Gen\',6,14);">Ge 6:14</a>, kopher Septuagint asphaltos; Vulgate: bitumen; compare Arabic kufr, "pitch") does not necessarily denote vegetable pitch, but may well mean bitumen. The same may be said of zepheth, "pitch" (compare Arabic zift, "pitch"), in <a onClick="return mV(\'Exd\',2,3);">Ex 2:3</a> and <a onClick="return mV(\'Isa\',34,9);">Isa 34:9</a>. The word "slime" occurs in the following passages: "And they had brick for stone, and slime had they for mortar" (<a onClick="return mV(\'Gen\',11,3);">Ge 11:3</a>); "Now the vale of Siddim was full of slime pits" (<a onClick="return mV(\'Gen\',14,10);">Ge 14:10</a>, margin "bitumen pits"); "She took for him an ark of bulrushes, and daubed it with slime and with pitch" (<a onClick="return mV(\'Exd\',2,3);">Ex 2:3</a>).<P>Bitumen is a hydrocarbon allied to petroleum and natural gas. It is a lustrous black solid, breaking with a conchoidal fracture, burning with a yellow flame, and melting when ignited. It is probably derived from natural gas and petroleum by a process of oxidation and evaporation, and its occurrence may be taken as a sign that other hydrocarbons are or have been present in the strata. It is found in small lumps and larger masses in the cretaceous limestone on the west side of the Dead Sea, and there is reason to believe that considerable quantities of it rise to the surface of the Dead Sea during earthquakes. In ancient times it was exported to Egypt to be used in embalming mummies. Important mines of it exist at Chasbeiya near Mt. Hermon and in Northern Syria. Springs of liquid bituminous matter exist in Mesopotamia, where according to Herodotus and other classical writers it was used as mortar with sun-dried bricks. Various conjectures have been made as to the part played by bitumen in the destruction of Sodom and Gomorrah. Diodorus Siculus calls the Dead Sea limne asphalstitis, "lake of asphalt."`<a href="./study/isbe/search.html?string=SIDDIM">SIDDIM</a>; <a href="./study/isbe/search.html?string=CITIES+OF+THE+PLAIN">CITIES OF THE PLAIN</a>`37';
isbe[8246]='Sling``<a href="./study/isbe/search.html?string=ARMOR,+ARMS">ARMOR</a>`1';
isbe[8247]='Slip`As meaning "a cutting from a plant," it is still good English. In this sense in <a onClick="return mV(\'Isa\',17,10);">Isa 17:10</a> for zemorah, "branch," "twig." For the phrase "slip of the tongue" compare Sirach 14:1; 19:16; 20:18; 21:7; 25:8.``1';
isbe[8248]='Slopes`slops.`<a href="./study/isbe/search.html?string=ASHDOTH+PISGAH">ASHDOTH PISGAH</a>`1';
isbe[8249]='Slow`slo: Chiefly for \'erekh, literally, "long," in the phrase "slow to anger" (<a onClick="return mV(\'Neh\',9,17);">Ne 9:17</a>, etc.). In <a onClick="return mV(\'Exd\',4,10);">Ex 4:10</a>; <a onClick="return mV(\'Luk\',24,25);">Lu 24:25</a>; <a onClick="return mV(\'Jam\',1,19);">Jas 1:19</a>, for kabhedh; bradus, both meaning "heavy," "sluggish," while Sirach 7:35 uses "be slow" for okneo, "hesitate." In addition, the King James Version uses. "slow" for argos, "inactive," in <span class="noTag">The Wisdom of Solomon 15:15</span>, "slow to go" (the Revised Version (British and American) "helpless for walking"), and in <a onClick="return mV(\'Tts\',1,12);">Tit 1:12</a>, "slow bellies" (the Revised Version (British and American) "idle gluttons"). In Sirach 51:24, the King James Version has "be slow" for hustereo, "be lacking" (so the Revised Version (British and American)).``1';
isbe[8250]='Sluggard`slug\'-ard: Found only in the Old Testament, and there only in Proverbs. It is the rendering given the word \'atsel everywhere in the Revised Version (British and American), but in the King James Version only in <a onClick="return mV(\'Pro\',6,6,9);">Pr 6:6,9</a>; <a onClick="return mV(\'Pro\',10,26);">10:26</a>; <a onClick="return mV(\'Pro\',13,4);">13:4</a>; <a onClick="return mV(\'Pro\',20,4);">20:4</a>; <a onClick="return mV(\'Pro\',26,16);">26:16</a> (elsewhere the King James Version translates by "slothful"). The root meaning of [\'atsel] is "to be sluggish," "stupid." The English word "slug" is said to be "allied to slack" (Webster).``1';
isbe[8251]='Sluice`sloos (sekher, literally, "hire"): In <a onClick="return mV(\'Isa\',19,10);">Isa 19:10</a>, the King James Version reads, "all that make sluices and ponds for fish." the Revised Version (British and American) entirely alters the translation of the whole verse. It reads, "And the pillars of Egypt shall be broken in pieces; all they that work for hire (margin "that make dams") shall be grieved in soul."``1';
isbe[8252]='Smell`smel (Hebrew and Aramaic reach, as noun, "savor," "scent"; ruach, as verb, literally, "to breathe," "to inhale," thence "to smell"; osme, the "smell," "savor," euodia, "sweet smell" "fragrance" osphresis "the sense of smell"; verb osphrainomai): And he came near, and kissed him: and he smelled (way-yarach) the smell (reach) of his raiment, and blessed him, and said, See, the smell (reach) of my son is as the smell (reach) of a field which Yahweh hath blessed" (<a onClick="return mV(\'Gen\',27,27);">Ge 27:27</a>). Idols are described as "gods, the work of men\'s hands, wood and stone, which neither see, nor hear, nor eat, nor smell" (<a onClick="return mV(\'Deu\',4,28);">De 4:28</a>). Acceptable sacrifices and pious conduct are called a "sweet smell" or "savor" (<a onClick="return mV(\'Exd\',29,18);">Ex 29:18</a>; <a onClick="return mV(\'Eph\',5,2);">Eph 5:2</a>; <a onClick="return mV(\'Phl\',4,18);">Php 4:18</a>) well-pleasing to God. The godless life, which dishonors God, is hateful to Him: "I will not smell the savor of your sweet odors" (<a onClick="return mV(\'Lev\',26,31);">Le 26:31</a>). The phrase, "being in bad odor with a person," can be traced to Biblical language: "Ye have made our savor to be abhorred in the eyes of Pharaoh, and in the eyes of his servants" (<a onClick="return mV(\'Exd\',5,21);">Ex 5:21</a>). Thus "smell" is occasionally equivalent with "quality," "character": "His (Moab\'s) taste remaineth in him, and his scent is not changed" (<a onClick="return mV(\'Jer\',48,11);">Jer 48:11</a>). Character or quality is the most infallible test, the most manifest advertisement of a thing or a person; thus we find the following very instructive passage: "(God) maketh manifest through us the savor (osme) of his knowledge in every place. For we are a sweet savor (euodia) of Christ unto God, in (better: "among") them that are saved, and in (better: "among") them that perish; to the one a savor (osme) from death unto death; to the other a savor (osme) from life unto life" (<a onClick="return mV(\'2Cr\',2,\'14-16\');">2Co 2:14-16</a>). See <a href="./study/isbe/search.html?string=TRIUMPH">TRIUMPH</a>. In the passage <a onClick="return mV(\'Isa\',3,24);">Isa 3:24</a>, the King James Version "sweet smell" (besem, "balsam plant") has been changed to "sweet spices" in the Revised Version (British and American).``106';
