isbe[8291]='Sometime`sum\'-tim: In modern English means "occasionally," and is so used in Sirach 37:14 for eniote. Otherwise the word means "at some past time," and is the translation of pote. the Revised Version (British and American) changes to "aforetime" in The <span class="noTag">Wisdom of Solomon 5:3</span>; <a onClick="return mV(\'1Pe\',3,20);">1Pe 3:20</a>; to "once" in <a onClick="return mV(\'Eph\',2,13);">Eph 2:13</a>; <a onClick="return mV(\'Eph\',5,8);">5:8</a>; to "in time past" in <a onClick="return mV(\'Col\',1,21);">Col 1:21</a>; while in <a onClick="return mV(\'Col\',3,7);">Col 3:7</a> the English Revised Version has "aforetime," the American Standard Revised Version "once." the King James Version does not distinguish between "sometime" and "sometimes."``1';
isbe[8292]='Son of God, the`(ho huios theou):<P>1. Use of Title in the Synoptists<P>2. Meanings in the Old Testament<P>3. Sense as Applied to Jesus<P>4. Physical Reason<P>5. Alleged Equivalence to "Messiah"—Personal Sense Implied<P>6. Higher Use by Jesus Himself<P>7. The "Son" in <a onClick="return mV(\'Mat\',11,27);">Matthew 11:27</a><P>8. The "Son" in <a onClick="return mV(\'Mar\',13,32);">Mark 13:32</a><P>9. The "Son" in <a onClick="return mV(\'Mat\',28,\'18-20\');">Matthew 28:18-20</a><P>10. Apostolic Doctrine: Deity Affirmed<P>11. The Fourth Gospel: Deity, Preexistence, etc.<P>LITERATURE<hr /><P>1. Use of Title in the Synoptists:<P>While the title "the Son of man" is always, except once, applied by Jesus to Himself, "the Son of God" is never applied by Jesus to Himself in the Synoptists. When, however, it is applied to Him by others, He accepts it in such a way as to assert His claim to it. Now and then He Himself employs the abbreviated form, "the Son," with the same intention; and He often speaks of God as "the Father" or "my Father" or "my Father who is in heaven" in such a manner as to betray the consciousness that He is the Son of God.<P>2. Meanings in the Old Testament:<P>While to the common mind "the Son of man" is a title designating the human side of our Lord\'s person, "the Son of God" seems as obviously to indicate the divine side. But scholarship cannot take this for granted; and, indeed, it requires only a hasty glance at the facts to bring this home even to the general reader, because in Scripture the title is bestowed on a variety of persons for a variety of reasons. First, it is applied to angels, as when in <a onClick="return mV(\'Job\',2,1);">Job 2:1</a> it is said that "the sons of God came to present themselves before Yahweh"; they may be so called because they are the creatures of God\'s hands or because, as spiritual beings, they resemble God, who is a spirit. Secondly, in <a onClick="return mV(\'Luk\',3,38);">Lu 3:38</a> it is applied to the first man; and from the parable of the Prodigal Son it may be argued that it is applicable to all men. Thirdly, it is applied to the Hebrew nation, as when, in <a onClick="return mV(\'Exd\',4,22);">Ex 4:22</a>, Yahweh says to Pharaoh, "Israel is my son, my first-born," the reason being that Israel was the object of Yahweh\'s special love and gracious choice. Fourthly, it is applied to the kings of Israel, as representatives of the chosen nation. Thus, in <a onClick="return mV(\'2Sa\',7,14);">2Sa 7:14</a>, Yahweh says of Solomon, "I will be his father, and he shall be my son"; and, in <a onClick="return mV(\'Psa\',2,7);">Ps 2:7</a>, the coronation of a king is announced in an oracle from heaven, which says, "Thou art my son; this day have I begotten thee." Finally, in the New Testament, the title is applied to all saints, as in <a onClick="return mV(\'Jhn\',1,12);">Joh 1:12</a>, "But as many as received him, to them gave he the right to become children of God, even to them that believe on his name." When the title has such a range of application, it is obvious that the Divinity of Christ cannot be inferred from the mere fact that it is applied to Him.<P>3. Sense as Applied to Jesus:<P>It is natural to assume that its use in application to Jesus is derived from one or other of its Old Testament uses; and the one almost universally fixed upon by modern scholarship as that from which it was derived is the fourth mentioned above—that to the Jewish kings. Indeed, it is frequently asserted that in the Jewish literature between the Old Testament and the New Testament, it is found already coined as a title for the Messianic king; but the instances quoted by Dalman and others in proof of this are far from satisfactory.<P>4. Physical Reason:<P>When we come to examine its use in the New Testament as applied by others to Jesus, the facts are far from simple, and it is not applied in a uniform sense. In <a onClick="return mV(\'Luk\',1,35);">Lu 1:35</a>, the following reason for its use is given, "The Holy Spirit shall come upon thee, and the power of the Most High shall overshadow thee: wherefore also the holy thing which is begotten shall be called the Son of God." This is a physical reason, akin to that on account of which the angels or the first man received the title; but it is rather curious that this point of view does not seem to be adopted elsewhere, unless it be in the exclamation of the centurion at the foot of the cross, "Truly this was the Son of God" (<a onClick="return mV(\'Mat\',27,54);">Mt 27:54</a>). As a pagan this soldier might be thinking of Jesus as one of those heroes, born of human mothers but divine fathers, of whom the mythology of his country had so much to tell (compare the margin).<P>5. Alleged Equivalence to Messiah—Personal Sense Implied:<P>(1) Baptism, Temptation.<P>It has been contended, not without plausibility, that for Jesus Himself the source of the title may have been the employment of it in the voice from heaven at His Baptism, "This is my beloved Son, in whom I am well pleased" (<a onClick="return mV(\'Mat\',3,17);">Mt 3:17</a>). By these words, it is usually assumed, He was designated as the Messiah; but in the adjective "beloved," and the words "in whom I am well pleased," there is something personal, beyond the merely official recognition. The same may be said of the voice from heaven in the scene of the Transfiguration. Milton, in Paradise Regained, makes Satan become aware of the voice from heaven at the Baptism; but this is also implied in the terms with which he approached Him in the Temptation in the wilderness, "If thou art the Son of God" (<a onClick="return mV(\'Mat\',4,3);">Mt 4:3</a>, etc.); and, if this was the sense in which the prince of devils made use of the phrase, we may conclude that in the mouths of the demoniacs who hailed Jesus by the same title it must have had the same meaning.<P>(2) At Caesarea Philippi.<P>When, at Caesarea Philippi, Jesus evoked from the Twelve their great confession, this is given by two of the synoptists in the simple form, "Thou art the Christ" (<a onClick="return mV(\'Mar\',8,29);">Mr 8:29</a>; <a onClick="return mV(\'Luk\',9,20);">Lu 9:20</a>); but Matthew adds, "the Son of the living God" (<a onClick="return mV(\'Mat\',16,16);">Mt 16:16</a>). It is frequently said that Hebrew parallelism compels us to regard these words as a mere equivalent for "Messiah." But this is not the nature of parallelism, which generally includes in the second of the parallel terms something in excess of what is expressed in the first; it would be quite in accordance with the nature of parallelism if the second term supplied the reason for the first. That is to say, Jesus was the Messiah because He was the Son of God.<P>(3) Trial before Sanhedrin.<P>There is another passage where it is frequently contended that "the Christ" and "the Son of God" must be exactly parallel, but a close examination suggests the reverse. In the account of the ecclesiastical trial in the Gospel of Luke, He is charged, "If thou art the Christ, tell us"; and, when He replies, "If I tell you, ye will not believe: and if I ask you, ye will not answer. But from henceforth shall the Son of man be seated at the right hand of the power of God," they all say, "Art thou then the Son of God?" and, when He replies in the affirmative, they require no further witness (<a onClick="return mV(\'Luk\',22,\'67-71\');">Lu 22:67-71</a>), Matthew informing us that the high priest hereupon rent his garments, and they all agreed that He had spoken blasphemy and was worthy of death (<a onClick="return mV(\'Mat\',26,65);">Mt 26:65</a>f). The usual assumption is that the second question, "Art thou...the Son of God?" implies no more than the first, \'Art thou the Christ?\'; but is not the scene much more intelligible if the boldness of His answer to the first question suggested that He was making a still higher claim than to be the Christ, and that their second question applied to this? It was when Jesus affirmed this also that their angry astonishment knew no bounds, and their sentence was immediate and capital. It may be questioned whether it was blasphemy merely to claim to be the Messiah; but it was rank and undeniable blasphemy to claim to be the Son of God. This recalls the statement in <a onClick="return mV(\'Jhn\',5,18);">Joh 5:18</a>, "The Jews sought the more to kill him, because he not only brake the sabbath, but also called God his own Father, making himself equal with God"; to which may be added (<a onClick="return mV(\'Jhn\',10,33);">Joh 10:33</a>), "The Jews answered him, For a good work we stone thee not, but for blasphemy; and because that thou, being a man, makest thyself God."<P>6. Higher Use by Jesus Himself:<P>Naturally it is with the words of Jesus Himself on this subject that we are most concerned. He speaks of God as His Father, and to the disciples He speaks of God as their Father; but He never speaks to them of God as their common Father: what He says is, "My Father and your Father" (<a onClick="return mV(\'Jhn\',20,17);">Joh 20:17</a>). H. J. Holtzmann and others have attempted to make light of this, and even to speak of the opening words of the Lord\'s Prayer, "Our Father who art in heaven," as if Jesus might have uttered them in company with the disciples; but the distinction is a vital one, and we do not agree with those who can believe that Jesus could have uttered, for Himself along with others, the whole of the Lord\'s Prayer, including the petition, "Forgive us our debts, as we also have forgiven our debtors."<P>7. The "Son" in <a onClick="return mV(\'Mat\',11,27);">Matthew 11:27</a>:<P>Of the passages in the Synoptists where Jesus speaks about God as "the Father" and Himself as "the Son," a peculiar solemnity attaches to <a onClick="return mV(\'Mat\',11,27);">Mt 11:27</a> parallel <a onClick="return mV(\'Luk\',10,22);">Lu 10:22</a>, "All things have been delivered unto me of my Father: and no one knoweth the Son, save the Father; neither doth any know the Father, save the Son, and he to whomsoever the Son willeth to reveal him." There is a Johannine flavor in these words, and they reveal an intimacy of the Son with the Father, as well as a power over all things, which could not have been conferred by mere official appointment, unless there had been in the background a natural position warranting the official standing. Not infrequently has the word "Messianic" been allowed by scholars to blind them to the most obvious facts. The conferring of an office on a mere man could not enable him to do things beyond the reach of human powers; yet it is frequently assumed that, if only Jesus was Messiah, He was able for anything, even when the thing in question is something for which a mere man is wholly incompetent.<P>8. The "Son" in <a onClick="return mV(\'Mar\',13,32);">Mark 13:32</a>:<P>There is a saying of Jesus (<a onClick="return mV(\'Mar\',13,32);">Mr 13:32</a>) about His own Sonship which may seem to refute the church doctrine on the subject, as in it He confesses ignorance of the date of His Second Coming: "Of that day or that hour knoweth no one, not even the angels in heaven, neither the Son, but the Father." Yet, while there is much in this passage fitted to produce sane and sober views as to the real manhood of Jesus, there are few sayings of His that betray a stronger consciousness of His being more than man. Four planes of being and of knowledge are specified—that of men, that of angels, that of Himself, and that of God. Evidently the Son is above not only men but angels, and, if it is confessed that He is ignorant of anything, this is mentioned as a matter of surprise.<P>9. The "Son" in <a onClick="return mV(\'Mat\',28,\'18-20\');">Matthew 28:18-20</a>:<P>The conclusion would seem to be that He is a being intermediate between the angels and God; but this impression is corrected by the greatest of all the sayings in which He calls Himself the Son (<a onClick="return mV(\'Mat\',28,\'18-20\');">Mt 28:18-20</a>), "All authority hath been given unto me in heaven and on earth. Go ye therefore, and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit: teaching them to observe all things whatsoever I commanded you: and lo, I am with you always, even unto the end of the world." Here the Son is named along with the Father and the Holy Spirit in a way suggesting the equality of all three, an act of worship being directed to them jointly. By those who disbelieve in the Deity of Christ, the most strenuous attempts have been made to get rid of this passage, and in certain quarters it is taken for granted that it must have been an addition to the text of this Gospel. But for this there is no ground whatever; the passage is the climax of the Gospel in which it occurs, in the same way as the confession of Thomas is the climax of the Gospel of John; and to remove it would be an intolerable mutilation. Of course to those who disbelieve in the bodily resurrection of our Lord, this has no more substance than the other details of the Forty Days; but to those who believe in His risen glory the words appear to suit the circumstances, their greatness being congruous with the entire representation of the New Testament.<P>10. Apostolic Doctrine: Deity Affirmed:<P>Indeed, it is the Son of God, as He appears in this final scene in the First Gospel, who dominates the rest of the New Testament. Thus, in <a onClick="return mV(\'Act\',9,20);">Ac 9:20</a>, the beginning of Paul\'s testimony as a Christian is given in these words, "And straightway in the synagogues he proclaimed Jesus, that he is the Son of God"; and what this meant to Paul may be gathered from his own statement in the opening of Romans, "Paul, a servant of Jesus Christ, called to be an apostle, separated unto the gospel of God, which he promised afore through his prophets in the holy scriptures, concerning his Son, who was born of the seed of David according to the flesh, who was declared to be the Son of God with power, according to the spirit of holiness by the resurrection from the dead; even Jesus Christ our Lord" (<a onClick="return mV(\'Rom\',1,\'1-4\');">Ro 1:1-4</a>). In He the equality of the Son with the Father is theme throughout the entire book; and in <a onClick="return mV(\'Rev\',2,18);">Re 2:18</a>, "the Son of God, who hath his eyes like a flame of fire," speaks from the right hand of power to the church.<P>On this subject there was no division of opinion in the apostolic church. On many other questions the followers of Jesus were divided; but on this one they were unanimous. For this the authority of Paul is often assumed to be responsible; but there was a prior and higher authority. This was the self-testimony of Jesus in the Gospel of John. Though this may not have been put in literary form till all the other books of the New Testament had been completed, it was active and influential in the church all the time, affecting Paul and the other New Testament writers.<P>11. The Fourth Gospel: Deity, Preexistence, etc.:<P>There is no real disharmony between the expression of our Lord\'s self-consciousness in the Synoptists and that in John; only in the latter it is far ampler and more distinct. Here Jesus is not only called "the Son of God" by others, but applies the title to Himself in its full shape, as well as in the abbreviated form of "the Son." He further calls Himself the "only begotten Son of God" (<a onClick="return mV(\'Khn\',3,16,18);">3:16,18</A>), that is to say, He is Son in a sense in which no others can claim the title. This seems expressly to contradict the statement, so often made, that He makes others sons of God in the same sense as Himself, or that His Sonship is ethical, not metaphysical. No doubt it is ethical—that is to say, He is like the Father in feeling, mind and will—but it does not follow that it is not at the same time metaphysical. In fact, the perfection of ethical unity depends upon that which is metaphysical. Between a dog and a man there may be deep sympathy, yet it is limited by the difference of their natures; whereas between a woman and a man there is perfect sympathy, because they are identical in nature.<P>Another feature of Sonship in the Fourth Gospel is preexistence, though, strange to say, this is more than once connected with the title "Son of man." But the strongest and most frequent suggestions as to what is implied in Sonship are to be found in the deeds attributed to the Son; for these are far beyond the competence of any mere man. Thus, He executes judgment (<a onClick="return mV(\'Jhn\',5,22);">Joh 5:22</a>); He has life in Himself and quickeneth whom He will (<a onClick="return mV(\'Jhn\',5,21,26);">Joh 5:21,26</a>); He gives eternal life (<a onClick="return mV(\'Jhn\',10,10);">Joh 10:10</a>), and it is the will of the Father that all men should honor the Son, even as they do the Father (<a onClick="return mV(\'Jhn\',5,23);">Joh 5:23</a>). Nevertheless, the Son does nothing of Himself, but only what He hath seen the Father do (<a onClick="return mV(\'Jhn\',5,19);">Joh 5:19</a>); and only that which He hath heard of the Father does He speak (<a onClick="return mV(\'Jhn\',14,10);">Joh 14:10</a>). In short, God is not only His Father, but His God (<a onClick="return mV(\'Jhn\',20,17);">Joh 20:17</a>). To statements such as these a merely official Sonship is not adequate; the relation must be ethical and metaphysical as well; and to a perfect Sonship all three elements are essential.<P>LITERATURE.<P>See the books on the Theology of the New Testament by Weiss, Beyschlag, Holtzmann, Feine, Schlatter, Weinel, Bovon, Stevens, Sheldon; and on the Teaching of Jesus by Bruce, Wendt, Dalman; Gore, The Incarnation of the Son of God, Bampton Lectures,1891,and Dissertations on Subjects Connected with the Incarnation; Robertson, Teaching of Jesus concerning God the Father; full bibliography in Stalker, Christ\'s Teaching concerning Himself.``163';
isbe[8293]='Son of Man, the`(ho huios tou anthropou): <P>1. Use in the New Testament: Self-Designation of Jesus<P>2. Questions as to Meaning<P><b>I. SOURCE OF THE TITLE</b><P class="in15">1. The Phrase in the Old Testament—Psalms, Ezekiel, Daniel<P class="in15">2. "Son of Man" in <a onClick="return mV(\'Dan\',7,\'1-\');">Daniel 7</a>—New Testament Allusions<P class="in15">3. Expressive of Messianic Idea<P class="in15">4. Post-canonical Literature: Book of Enoch<P><b>II. WHY JESUS MADE USE OF THE TITLE</b><P class="in15">1. Consciousness of Being the Messiah<P class="in15">2. Half Concealed, Yet Half Revealed His Secret<P class="in15">3. Expressive of Identification with Men in Sympathy, Fortunes and Destiny<P class="in15">4. Speculations (Lietzmann, Wellhausen, etc.) on Aramaic Meaning: These Rejected (Dalman, etc.)<P><b>LITERATURE</b><hr /><P>1. Use in New Testament: Self-Designation of Jesus:<P>This is the favorite self-designation of Jesus in the Gospels. In Matthew it occurs over 30 times, in <span class="noTag">Mark 15</span> times, in Luke 25 times, and in John a dozen times. It is always in the mouth of Jesus Himself that it occurs, except once, when the bystanders ask what He means by the title (<a onClick="return mV(\'Jhn\',12,34);">Joh 12:34</a>). Outside the Gospels, it occurs only once in Acts, in Stephen\'s speech (<a onClick="return mV(\'Act\',7,56);">Ac 7:56</a>), and twice in the Book of Revelation (<a onClick="return mV(\'Rev\',1,13);">1:13</a>; <a onClick="return mV(\'Rev\',14,14);">14:14</a>).<P>2. Questions as to Meaning:<P>At first sight it appears so apt a term for the human element in our Lord\'s person, the divine element being similarly denoted by "the Son of God," that this was supposed to be its meaning, as it still is by the common man at the present day. As long as it was assumed that the meaning could be elicited by merely looking at the words as they stand and guessing what they must signify, this was substantially the view of all, although this common conception went in two directions—some noting especially the loftier and more ideal elements in the conception, while others emphasized what was lowly and painful in the human lot; and both could appeal to texts in support of their view. Thus, the view "that Christ by this phrase represented Himself as the head, the type, the ideal of the race" (Stanton, The Jewish and the Christian Messiah), could appeal to such a saying as, "The Son of man is Lord even of the sabbath" (<a onClick="return mV(\'Mar\',2,28);">Mr 2:28</a>); while the humbler view could quote such a saying as, "The foxes have holes, and the birds of the heaven have nests; but the Son of man hath not where to lay his head" (<a onClick="return mV(\'Mat\',8,20);">Mt 8:20</a>).<P>The more scientific investigation of the phrase began, however, when it was inquired, first, what the source was from which Jesus derived this title, and, secondly, why He made use of it.<P>I. Source of the Title.<P>1. The Phrase in the Old Testament—Psalms, Ezekiel, Daniel:<P>That the phrase was not one of Jesus\' own invention is manifest, because it occurs often in the Old Testament.<P>Thus, in <a onClick="return mV(\'Psa\',8,4);">Ps 8:4</a> it is used as an equivalent for "man" in the parallel lines,<P class="in15">"What is man, that thou art mindful of him?<br>And the son of man, that thou visitest him ?"<P>This passage has sometimes been regarded as the source whence Jesus borrowed the title; and for this a good deal might be said, the psalm being an incomparable exposition both of the lowliness and the loftiness of human nature. But there is another passage in the Psalms from which it is far from incredible that it may have been derived: in <a onClick="return mV(\'Psa\',80,17);">Ps 80:17</a> occur the words,<P class="in15">"Let thy hand be upon the man of thy right hand,<br>Upon the son of man whom thou maddest strong for thyself."<P>This is an appeal, in an age of national decline, for the raising up of a hero to redeem Israel; and it might well have kindled the spark of Messianic consciousness in the heart of the youthful Jesus.<P>There is a book of the Old Testament in which the phrase "the son of man" occurs no fewer than 90 times. This is the Book of Ezekiel, where it is always applied to the prophet himself and designates his prophetic mission. In the words of Nosgen (Christus der Menschenund Gotlessohn): "It expresses the contrast between what Ezekiel is in himself and what God will make out of him, and to make his mission appear to him not as his own, but as the work of God, and thus to lift him up, whenever the flesh threatens to faint and fail." Thus there was one before Jesus of Nazareth who bore the title, at least in certain moments of his life; and, after Ezekiel, there arose another Hebrew prophet who has put on record that he was addressed from the same high quarter in the same terms; for, in <a onClick="return mV(\'Dan\',8,17);">Da 8:17</a>, it is written, "So he came near where I stood; and when he came, I was affrighted, and fell upon my face: but he said unto me, Understand, O son of man"—words then following intended to raise the spirit of the trembling servant of God. By Weizsacker and others the suggestion has been made that Jesus may have borrowed the term from Ezekiel and Daniel to express His consciousness of belonging to the same prophetic line.<P>2. "Son of Man" in <a onClick="return mV(\'Dan\',7,\'1-\');">Daniel 7</a>—New Testament Allusions:<P>There is, however, in the same Book of Daniel another occurrence of the phrase, in a totally different sense, to which the attention of science is more and more being drawn. In <a onClick="return mV(\'Dan\',7,3);">7:3</a>ff, in one of the apocalyptic visions common to this prophet, four beasts are seen coming out of the sea—the first a lion with eagle\'s wings, the second a bear, the third a fourheaded leopard, and the fourth a terrible monster with ten heads. These beasts bear rule over the earth; but at last the kingdom is taken away from them and given to a fifth ruler, who is thus described, "I saw in the night-visions, and, behold, there came with the clouds of heaven one like unto a son of man, and he came even to the ancient of days, and they brought him near before him. And there was given him dominion, and glory, and a kingdom, that all the peoples, nations, and languages should serve him: his dominion is an everlasting dominion, which shall not pass away, and his kingdom that which shall not be destroyed" (<a onClick="return mV(\'Dan\',7,13,14);">Da 7:13,14</a>). Compare with these words from Daniel the words of Jesus to the high priest during His trial, "Henceforth ye shall see the Son of man sitting at the right hand of Power, and coming on the clouds of heaven" (<a onClick="return mV(\'Mat\',26,64);">Mt 26:64</a>), and the echo of the Old Testament words cannot be mistaken. Equally distinct is it in the great discourse in <a onClick="return mV(\'Mat\',24,30);">Mt 24:30</a>, "Then shall appear the sign of the Son of man in heaven: and then shall all the tribes of the earth mourn, and they shall see the Son of man coming on the clouds of heaven with power and great glory."<P>3. Expressive of Messianic Idea:<P>The use of this self-designation by Jesus is especially frequent and striking in passages referring to His future coming to judgment, in which there is necessarily a certain resemblance to the apocalyptic scene in Daniel. In such utterances the Messianic consciousness of Jesus is most emphatically expressed; and the passage in Daniel is also obviously Messianic. In another considerable series of passages in which this phrase is used by Jesus, the references are to His sufferings and death; but the assumption which explains these also most easily is that they are Messianic too; Jesus is speaking of the fortunes to which He must submit on account of His vocation. Even the more dignified passages, expressive of ideality, are best explained in the same way. In short, every passage where the phrase occurs is best understood from this point of view, whereas, from any other point of view, not a few appear awkward and out of place. How little, for example, does the idea that the phrase is expressive of lowliness or of brotherhood with suffering humanity accord with the opening of the judgment-scene in <a onClick="return mV(\'Mat\',25,31);">Mt 25:31</a>, "But when the Son of man shall come in his glory, and all the angels with him, then shall he sit on the throne of his glory"!<P>4. Post-canonical Literature: Book of Enoch:<P>The son of man, or rather "one like unto a son of man" mentioned in Daniel, is primarily the Hebrew people, as is expressly noted in the prophecy itself; but Jesus must have looked upon Himself as the representative of the people of God, in the same way as, in the Old Testament generally, the reigning sovereign was regarded as the representative of the nation. But the question has been raised whether this transference of the title from a collective body to an individual may have been mediated for Him through postcanonical religious literature or the prevalence among the people of ideas generated through this literature. In the Book of Enoch there occur numerous references to the son of man, which bear a remarkable resemblance to some of the sayings of Jesus. The date usually assigned to this production is some 200 years BC; and, if these passages in it actually existed as early as this, the book would almost require to be included in the canonical Scriptures, though for other reasons it is far from worthy of any such honor. The whole structure of the Book of Enoch is so loose and confused that it must always have invited interpolation; and interpolations in it are recognized as numerous. The probability, therefore, is that the passages referring to the son of man are of later date and of Christian origin.<P>II. Why Jesus Made Use of the Title.<P>The conclusion that this title expresses, not the personal qualities of Jesus as a man, but His functions as Messiah, may be disappointing; but there is a way of recovering what seems to have been lost; because we must now inquire for what reasons He made use of this term.<P>1. Consciousness of Being the Messiah:<P>The first reason, of course, is, that in Daniel it expressed Messiahship, and that Jesus was conscions of being the Messiah. In the Old Testament He was wont all His days to read His own history. He ranged over all the sacred books and found in them references to His own person and work. With divinatory glance He pierced into the secrets of Scripture and brought forth from the least as well as the best-known portions of the ancient oracles meanings which are now palpable to all readers of the Bible, but which He was the first to discover. From the passage in Daniel, or from some other passage of the Old Testament in which the phrase "the son of man" occurs, a hint flashed out upon Him, as He read or heard; and the suggestion grew in His brooding mind, until it rounded itself into the fit and satisfying expression for one side of His self-consciousness.<P>2. Half Concealed, Yet Half Revealed His Secret:<P>Another reason why He fixed upon this as His favorite self-designation may have been that it half concealed as well as half revealed His secret. Of the direct names for the Messiah He was usually shy, no doubt chiefly because His contemporaries were not prepared for an open declaration of Himself in this character; but at all stages of His ministry He called Himself the Son of man without hesitation. The inference seems to be, that, while the phrase expressed much to Himself, and must have meant more and more for those immediately associated with Him, it did not convey a Messianic claim to the public ear. With this accords well the perplexity once manifested by those listening to Him, when they asked, "Who is this Son of man?" (<a onClick="return mV(\'Jhn\',12,34);">Joh 12:34</a>); as it also explains the question of Jesus to the Twelve at Caesarea Philippi, "Who do men say that the Son of man is?" or, as it is in the margin, "that I the Son of man am?" (<a onClick="return mV(\'Mat\',16,13);">Mt 16:13</a>). That He was the Son of man did not evidently mean for all that He claimed to be the Messiah.<P>3. Expressive of Identification with Men in Sympathy, Fortunes and Destiny:<P>But when we try to realize for what reasons Jesus may have picked this name out from all which presented themselves to Him in His intimate and loving survey of the Old Testament, it is difficult to resist the belief that a third and the principal reason was because it gave expression to His sense of connection with all men in sympathy, fortunes and destiny. He felt Himself to be identified with all as their brother, their fellow-sufferer, their representative and champion; and, in some respects, the deepest word He ever spake was, "For the Son of man also came not to be ministered unto, but to minister, and to give his life a ransom for many" (<a onClick="return mV(\'Mar\',10,45);">Mr 10:45</a> parallel).<P>4. Speculations (Lietzmann, Wellhausen, etc.) on Aramaic Meaning: These Rejected (Dalman, etc.):<P>In 1896, Hans Lietzmann, a young German scholar, startled the learned World with a speculation on the "Son of man." Making the assumption that Aramaic was the language spoken by Jesus, he contended that Jesus could not have applied to Himself the Messianic title, because there is nothing corresponding with it in Aramaic. The only term approximating to it is barnash, which means something very vague, like "anyone" or "everyman" (in the sense of the old morality play thus entitled). Many supposed Lietzmann to be arguing that Jesus had called Himself Anyone or Everyman; but this was not his intention. He tried to prove that the Messianic title had been applied to Jesus in Asia Minor in the first half of the 2nd century and that the Gospels had been revised with the effect of substituting it for the first personal pronoun. But he failed to show how the manuscripts could have been so universally altered as to leave no traces of this operation, or how, if the text of the New Testament was then in so fluid a state as to admit of such a substitution, the phrase should not have overflowed into other books besides the Gospels. Although the hypothesis has secured wide attention through being partially adopted by Wellhausen, whose view is to be found in Skizzen und Vorarbeiten, VI, and at p. 66 of his Commentary on Mark, it may be reckoned among the ghosts which appear for an hour on the stage of learning, attracting attention and admiration, but have no permanent connection with the world of reality. Dalman, the leading authority on Aramaic, denies the foundation on which the views of both Lietzmann and Wellhausen rest, and holds that, had the Messianic title existed, the Aramaic language would have been quite capable of expressing it. And in 1911 Wellhausen himself explicitly admitted this (Einleitung in die drei eraten Evangelien(2), 130).<P>LITERATURE.<P>See the books on New Testament Theology by Weiss, Beyschlag, Holtzmann, Feine, Schlatter, Weinel, Stevens, Sheldon; and on the Teaching of Jesus by Wentit, Bruce, Dalman; Abbott, The Son of Man, 1910; very full bibliography in Stalker, The Teaching of Jesus concerning Himself.``163';

isbe[8295]='Son; Sons`sun, sunz:<P>(1) In Biblical language the word "son" is used first of all in its strictly literal sense of male issue or offspring of a man or woman. In a few cases in the Old Testament, as in <a onClick="return mV(\'Gen\',3,16);">Ge 3:16</a>; <a onClick="return mV(\'Jos\',17,2);">Jos 17:2</a>; <a onClick="return mV(\'Jer\',20,15);">Jer 20:15</a>, the Hebrew word ben, is translated correctly in the English by the word "child" or "children" as it includes both sexes, as in <a onClick="return mV(\'Gen\',3,16);">Ge 3:16</a>, or is limited to males by the use of the modifying term "male." Closely connected with this meaning of direct male issue or of children is its use to denote descendants, posterity in the more general sense. This usage which, as in the case of the sons (children) of Israel, may be regarded perhaps as originating in the conception of direct descent from the common ancestor Israel, came in the course of time to be a mere ethnographic designation, so that the term "the children of Israel" and "the children of Ammon" meant no more than Israelites or Ammonites, that is, inhabitants of the lands of Israel or Ammon respectively. An extension of this usage is to be found in the designation of a people as the sons or children of a land or city; so in <a onClick="return mV(\'Amo\',9,7);">Am 9:7</a> "children of the Ethiopians," or <a onClick="return mV(\'Eze\',16,28);">Eze 16:28</a>, where the literal rendering would be "sons of Asshur," instead of the Assyrians, and "the children of Jerus" in <a onClick="return mV(\'Joe\',3,6);">Joe 3:6</a>.<P>See <a href="./study/isbe/search.html?string=BAR+(1)">BAR (1) (prefix)</A>; <a href="./study/isbe/search.html?string=BEN-">BEN-</A>.<P>(2) More characteristic of Biblical usage is the employment of the word "son" to indicate membership in a class or guild, as in the common phrase "sons of the prophets," which implies nothing whatever as to the ancestry, but states that the individuals concerned are members of the prophetic guilds or schools. In the New Testament the word "sons" (huioi) in <a onClick="return mV(\'Luk\',11,19);">Lu 11:19</a>, rendered "children" in <a onClick="return mV(\'Mat\',12,27);">Mt 12:27</a> the King James Version, means, not physical descendants, but members of the class or sect; according to Matthew the Pharisees, who were attacking Christ.<P>(3) The word "son" is used with a following genitive of quality to indicate some characteristic of the person or persons described. In the English the word "son" is usually omitted and the phrase is paraphrased as in <a onClick="return mV(\'2Sa\',3,34);">2Sa 3:34</a>, where the words translated "wicked men" in the King James Version mean literally, sons or children of wickedness. Two examples of this usage may be cited: the familiar phrase "sons of Belial" in the Old Testament (<a onClick="return mV(\'Deu\',15,13);">De 15:13</a> the King James Version, and often), where the meaning is simply base or worthless fellows (compare <a onClick="return mV(\'Num\',24,17);">Nu 24:17</a>, margin "children of Sheth" (Expository Times, XIII, 64b)); and in the New Testament the phrase "sons of thunder," which is given in <a onClick="return mV(\'Mar\',3,17);">Mr 3:17</a> as the explanation of the epithet "Boanerges." This use is common in the New Testament, as the phrases "children of the kingdom," "children of light," etc., indicate, the general meaning being that the noun in the genitive following the word children indicates some quality of the persons under consideration. The special phrases "Son of man" and "Son of God" are considered in separate articles.`<a href="./study/isbe/search.html?string=RELATIONSHIPS,+FAMILY">RELATIONSHIPS, FAMILY</a>`13';
isbe[8296]='Song`(shir, shirah): Besides the great collection of sacred songs contained in the Psalter, as well as the lyric outbursts, marked by strong religious feeling, on great national occasions, it is natural to believe, and we have evidence to show, that the Hebrews possessed a large number of popular songs of a secular kind. <a href="./study/isbe/search.html?string=SONG+OF+SONGS">Song of Songs</a> (which see) of itself proves this. Probably the very oldest song or fragment of song in the Old Testament is that "To the well" (<a onClick="return mV(\'Num\',21,17);">Nu 21:17</a>). W. R. Smith (Religions of the Semites, 167) regards this invocation of the waters to rise as in its origin hardly a mere poetic figure. He compares what Cazwini 1, 189, records of the well of Ilabistan: "When the water failed, a feast was held at its source with music and dancing, to induce it to flow again." If, however, the song had its origin in an early form of religious belief, it must have been secularized later.<P>But it is in the headings of the Psalms that we find the most numerous traces of the popular songs of the Hebrews. Here there are a number of words and phrases which are now believed to be the names or initial words of such lyrics. In the King James Version they are prefaced with the prep. "on," in the Revised Version (British and American) with "set to," i.e. "to the tune of." We give a list:<P>(1) Aijeleth Shahar the King James Version, the Revised Version (British and American) Aijeleth hash-shahar, \'ayyeleth ha-shachar. The title means (Revised Version, margin) "The hind of the morning," but whether the original song so named was a hunting song or a morning serenade it is useless to conjecture. See <a href="./study/isbe/search.html?string=HIND+OF+THE+MORNING">HIND OF THE MORNING</a>.<P>(2) Al-taschith (the King James Version), Al-tashheth (Revised Version), \'al-tashcheth, i.e. "Destroy not," <a onClick="return mV(\'Psa\',57,\'1-\');">Psalms 57-59</a>; <a onClick="return mV(\'Psa\',75,\'1-\');">75</a>, is apparently quoted in <a onClick="return mV(\'Isa\',65,8);">Isa 65:8</a>, and in that case must refer to a vintage song.<P>(3) Jonah elem rehokim or Yonath\'elem rechoqim (<a onClick="return mV(\'Psa\',56,\'1-\');">Ps 56</a>), the Revised Version margin "The silent dove of them that are afar off," or—with a slightly different reading—"The dove of the distant terebinths."<P>(4) Machalath (<a onClick="return mV(\'Psa\',53,\'1-\');">Ps 53</a>) and Machalath le\'annoth (<a onClick="return mV(\'Psa\',88,\'1-\');">Ps 88</a>). Machalath may mean "sickness," and be the first word of a song. It might mean, on the other hand, a minor mode or rhythm. It has also been held to designate a musical instrument.<P>(5) Muthlabben (<a onClick="return mV(\'Psa\',9,\'1-\');">Ps 9</a>) has given rise to many conjectures. Literally, it may mean "Die for the son," or "Death of the son." An ancient tradition referred the words to Goliath (death at the hand of the son [?]), and they have been applied to the fate of Absalom. Such guesses need only be quoted to show their worthlessness.<P>(6) Lastly, we have Shoshannim = "Lilies" (<a onClick="return mV(\'Psa\',45,\'1-\');">Psalms 45</a>; <a onClick="return mV(\'Psa\',69,\'1-\');">69</a>), Shushan \'Edhuth = "The lily of testimony" (<a onClick="return mV(\'Psa\',60,\'1-\');">Ps 60</a>); and Shoshannim \'Edhuth = "Lilies, a testimony" (<a onClick="return mV(\'Psa\',80,\'1-\');">Ps 80</a>), probably to be explained like the others.<P>The music to which these songs were sung is irretrievably lost, but it was, no doubt, very similar in character to that of the Arabs at the present day. While the music of the temple was probably much more elaborate, and of wider range, both in notes and expression of feeling, the popular song was almost certainly limited in compass to a very few notes repeated over and over in long recitations or ballads. This is characteristic of the performances of Arab minstrels of today. The melodies are plaintive, in spite of the majority of them being in major keys, owing to the 7th being flattened, as in genuine Scottish music. Arabic music, further, is marked by great variety and emphasis of rhythm, the various kinds of which have special names.`<a href="./study/isbe/search.html?string=SPIRITUAL+SONGS">SPIRITUAL SONGS</a>`120';
isbe[8297]='Song of Songs`(shir hashirim; Septuagint Asma; Codices Sinaiticus, Alexandrinus, Ephraemi, Asma asmaton; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Canticum Canticorum):<P><b>I. CANONICITY</b><P><b>II. TEXT</b><P><b>III. AUTHORSHIP AND DATE</b><P><b>IV. HISTORY OF INTERPRETATION</b><P>1. The Allegorical Interpretation<P>2. The Typical Interpretation<P>3. The Literal Interpretation<P><b>V. CLOSING HINTS AND SUGGESTIONS</b><P><b>LITERATURE</b><hr /><P>The full title in Hebrew is "The Song of Songs, which is Solomon\'s." The book is called by some Canticles, and by others Solomon\'s Song. The Hebrew title implies that it is the choicest of all songs, in keeping with the dictum of Rabbi \'Aqiba (90-135 AD) that "the entire world, from the beginning until now, does not outweigh the day in which Canticles was given to Israel."<P>I. Canonicity.<P>Early Jewish and Christian writers are silent as to the So of Songs. No use is made of it by Philo. There is no quotation from it in the New Testament, nor is there any clear allusion to it on the part of our Lord or the apostles. The earliest distinct references to the So of Songs are found in Jewish writings of the 1st and 2nd centuries AD (4Esdras 5:24,26; 7:26; Ta\'anith 4:8). The question of the canonicity of the So was debated as late as the Synod of Jamnia (circa 90 AD), when it was decided that Canticles was rightly reckoned to "defile the hands," i.e. was an inspired book. It should be borne in mind that the So of Songs was already esteemed by the Jews as a sacred book, though prior to the Synod of Jamnia there was probably a goodly number of Jewish teachers who did not accept it as canonical. Selections from Canticles were sung at certain festivals in the temple at Jerusalem, prior to its destruction by Titus in 70 AD (Ta\'anith 4:8). The Mishna pronounces an anathema on all who treat Canticles as a secular song (Sanhedhrin, 101a). The latest date for the composition of the Song of Songs, according to critics of the advanced school, is toward the close of the 3rd century BC. We may be sure that it was included in the Kethubhim before the ministry of our Lord, and so was for Him a part of the Scriptures.<P>II. Text.<P>Most scholars regard the text of Canticles as comparatively free from corruption. Gratz, Bickell, Budde and Cheyne have suggested a good many emendations of the traditional text, a few of which commend themselves as probable corrections of a faulty text, but most of which are mere guesses without sufficient confirmation from either external or internal evidence. For details see Budde\'s able commentary, and articles by Cheyne in JQR and Expository Times for 1898-99 and in the The Expositor, February, 1899.<P>III. Authorship and Date.<P>The title in the Hebrew text ascribes the poem to Solomon. That this superscription was prefixed by an editor of Canticles and not by the original writer is evident from the fact that the relative pronoun employed in the title is different from that employed throughout the poem. The beauty and power of the book seemed to later students and editors to make the writing worthy of the gifted king, whose fame as a composer of both proverbs and songs was handed on to later times (<a onClick="return mV(\'1Ki\',4,32);">1Ki 4:32</a>). Moreover, the name of Solomon is prominent in the Song of Songs itself (<a onClick="return mV(\'Sgs\',1,5);">1:5</A>; <a onClick="return mV(\'Sgs\',3,7,9,11);">3:7,9,11</A>; <a onClick="return mV(\'Sgs\',8,11);">8:11</a>f). If the traditional view that Solomon wooed and won the Shulammite be true, the Solomonic authorship may even yet be defended, though the linguistic argument for a later date is quite strong.<P>The question in debate among recent critics is whether the Song was composed in North Israel in preexilic days, or whether it is post-exilic. The author is at home in Hebrew. His vocabulary is extensive, and the movement of the poem is graceful. There is no suggestion of the use of lexicon and grammar by a writer living in the period of the decadence of the Hebrew language. The author is familiar with cities and mountains all over Palestine, especially in the northern section. He speaks of the beauty of Tirzah, the capital of Northern Israel in the 10th century BC, along with the glory of Jerusalem, the capital of Judah (<a onClick="return mV(\'Sgs\',6,4);">So 6:4</a>). The recollection of Solomon\'s glory and pomp seems to be fresh in the mind of the writer and his contemporaries. W.R. Smith regarded Canticles as a protest against the luxury and the extensive harem of Solomon. True love could not exist in such an environment. The fidelity of the Shulammite to her shepherd lover, notwithstanding the blandishments of the wealthy and gifted king, stands as a rebuke to the notion that every woman has her price. Driver seems inclined to accept a preexilic date, though the arguments from vocabulary and philology cause him to waver in his opinion (LOT, 8th edition, 450). An increasing number of critics place the composition of Canticles in the post-exilic period, many bringing it down into the Greek period. Among scholars who date Canticles in the 3rd century BC we may name Gratz, Kuenen, Cornill, Budde, Kautzsch, Martineau and Cheyne. The chief argument for bringing the So into the time of the early Ptolemies is drawn from the language of the poem. There are many Hebrew words that are employed elsewhere only in later books of the Old Testament; the word pardec (<a onClick="return mV(\'Sgs\',4,13);">So 4:13</a>) is a Persian loan-word for "park"; the word for "palanquin" may be Indian, or possibly Greek. Moreover, the form of the relative pronoun is uniformly that which is found in some of the latest books of the Old Testament. The influence of Aramaic is apparent, both in the vocabulary and in a few constructions. This may be accounted for on theory of the northern origin of the Song, or on the hypothesis of a post-exilic date. The question of date is still open.<P>IV. History of Interpretation.<P>1. The Allegorical Interpretation:<P>All interpreters of all ages agree in saying that Canticles is a poem of love; but who the lovers are is a subject of keen debate, especially in modern times.<P>First in point of time and in the number of adherents it has had is theory that the So is a pure allegory of the love of Yahweh and His people. The Jewish rabbis, from the latter part of the 1st century AD down to our own day, taught that the poem celebrates a spiritual love, Yahweh being the bridegroom and Israel the bride. Canticles was supposed to be a vivid record of the loving intercourse between Israel and her Lord from the exodus on to the glad Messianic time. The So is read by the Jews at Passover, which celebrates Yahweh\'s choice of Israel to be His spouse. The Targum interprets Canticles as an allegory of the marital love of Yahweh and Israel. Origen made the allegorical theory popular in the early church. As a Christian he represented the bride as the church or the soul of the believer. In more recent centuries the Christian allegorical interpreters have favored the idea that the soul of the believer was the bride, though the other type of the allegorical view has all along had its advocates.<P>Bernard of Clairvaux wrote 86 sermons on the first two chapters of Canticles; and a host of writers in the Roman church and among Protestants have composed similar mystical treatises on the Song. Devout souls have expressed their fervent love to God in the sensuous imagery of Canticles. The imagery could not become too fervid or ecstatic for some of these devout men and women in their highest moments of beatific vision. Whatever may be the final verdict of sane criticism as to the original purpose of the author of the Song, it is a fact that must not be overlooked by the student of Canticles that some of the noblest religious souls, both Hebrew and Christian, have fed the flame of devotion by interpreting the So as an allegory.<P>What justification is there for theory that Canticles is an allegory of the love between Yahweh and His people, or of the love of Christ and the church, or of the love of the soul of the believer and Christ? It must be frankly confessed that there is not a hint in the So itself that it is an allegory. If the modern reader of Canticles had never heard of the allegorical interpretation, nothing in the beginning, middle or end of the poem would be likely to suggest to his mind such a conception of the poet\'s meaning. How, then, did the early Jewish interpreters come to make this the orthodox interpretation of the Song? The question is not easy to answer. In the forefront of our answer we must recall the fact that the great prophets frequently represent the mutual love of Yahweh and Israel under the symbolism of marriage (<a onClick="return mV(\'Hsa\',1,\'1-\');">Hosea 1-3</a>; <a onClick="return mV(\'Jer\',3,\'1-\');">Jeremiah 3</a>; <a onClick="return mV(\'Eze\',16,\'1-\');">Ezekiel 16</a>; <a onClick="return mV(\'Eze\',23,\'1-\');">23</a>; <a onClick="return mV(\'Isa\',50,1);">Isa 50:1</a>; <a onClick="return mV(\'Isa\',54,5,6);">54:5,6</a>). The Hebrew interpreter might naturally expect to find some echo of this bold imagery in the poetry of the Kethubhim. In the Torah the frequent command to love Yahweh might suggest the marital relation as well as that of the father and son (<a onClick="return mV(\'Deu\',6,5);">De 6:5</a>; <a onClick="return mV(\'Deu\',7,\'7-9\',13);">7:7-9,13</a>; <a onClick="return mV(\'Deu\',10,12,15);">10:12,15</a>; <a onClick="return mV(\'Deu\',30,16,20);">30:16,20</a>), though it must be said that the language of Deuteronomy suggests the high ethical and religious teaching of Jesus in the matter of love to God, in which the sexual does not appear.<P>Cheyne suggests (EB, I, 683f) that the So was too joyous to be used, in its natural sense, by the Jews after the destruction of Jerusalem, and hence, they consecrated it by allegorical interpretation. The suggestion may contain an element of truth.<P>It is an interesting fact that the Psalter has so few expressions in which love to Yahweh is expressed (<a onClick="return mV(\'Psa\',31,23);">Ps 31:23</a>; <a onClick="return mV(\'Psa\',97,10);">97:10</a>; <a onClick="return mV(\'Psa\',145,20);">145:20</a>; compare <a onClick="return mV(\'Psa\',18,1);">18:1</a>; <a onClick="return mV(\'Psa\',42,1);">42:1</a>; <a onClick="return mV(\'Psa\',63,1);">63:1</a>). In this manual of devotion one would not be suprised to find the expansion of the image of wedlock as expressive of the soul\'s relation to God; but we look in vain for such a poem, unless <a onClick="return mV(\'Psa\',45,\'1-\');">Ps 45</a> be capable of allegorical interpretation. Even that beautiful song of love and marriage contains no such highly sensuous imagery as is found in Canticles.<P>Christian scholars found it easy to follow the Jewish allegorical interpreters; for the figure of wedlock is employed in the New Testament by both Paul and John to represent the intimate and vital union of Christ and His church (<a onClick="return mV(\'2Cr\',11,2);">2Co 11:2</a>; <a onClick="return mV(\'Eph\',5,\'22-33\');">Eph 5:22-33</a>; <a onClick="return mV(\'Rev\',19,\'7-9\');">Re 19:7-9</a>; <a onClick="return mV(\'Rev\',21,2,9);">21:2,9</a>).<P>The entire body of true believers is conceived of as the bride of Christ. Naturally the purity of the church is sullied through the impure conduct of the individuals of whom it is composed. Hence, the appeal to individuals and to local churches to live pure lives (<a onClick="return mV(\'2Cr\',11,1);">2Co 11:1</a>). To the unmarried believer the Lord Jesus takes the place of the husband or wife as the person whom one is most eager to please (<a onClick="return mV(\'1Cr\',7,32);">1Co 7:32</a>f). It is not difficult to understand how the fervid, sensuous imagery of Canticles would appeal to the mind of a man like Origen as a proper vehicle for the expression of his passionate love for Christ.<P>Sober inquiry discovers no sufficient justification of the allegorical interpretation of the Song of Songs. The pages of the mystical commentators are filled with artificial interpretations and conceits. Many of them practice a familiarity with Christ that is without example in the Biblical devotional literature.<P>2. The Typical Interpretation:<P>The allegorical interpreters, for the most part, saw in the So of Songs no historic basis. Solomon and the Shulammite are introduced merely as figures through whom God and His people, or Christ and the soul, can express their mutual love. In modern times interpreters have arisen who regard the So as primarily the expression of strong and passionate human love between Solomon and a beautiful maiden, but by virtue of the typical relation of the old dispensation, secondarily, the fitting expression of the love of Christ and the church.<P>The way for this modern typical interpretation was prepared by Lowth (Sacred Poetry of the Hebrews, Lectionaries XXX, XXXI) in his modified allegorical view, which is thus described by Canon Driver: "Bishop Lowth, though not abandoning the allegorical view, sought to free it from its extravagances; and while refusing to press details, held that the poem, while describing the actual nuptials of Solomon with the daughter of Pharaoh, contained also an allegoric reference to Christ espousing a church chosen from among the Gentiles" (LOT, 451). Few interpreters have been found to follow Theodore of Mopsuestia and Lowth in their view that the So celebrates the marriage of Solomon and an Egyptian princess; and Lowth\'s notion of a reference to the espousal of a church chosen from among the Gentiles is one of the curiosities of criticism. Of the typical interpreters Delitzsch is perhaps the ablest (Commentary on Ecclesiastes and the So of Songs).<P>The typical commentators are superior to the allegorical in their recognition of Canticles as the expression of the mutual love of two human beings. The further application of the language to Yahweh and His people (Keil), or to Christ and the church (Delitzsch), or to God and the soul (M. Stuart) becomes largely a matter of individual taste, interpreters differing widely in details.<P>3. The Literal Interpretation:<P>Jewish interpreters were deterred from the literal interpretation of Canticles by the anathema in the Mishna upon all who should treat the poem as a secular song (Sanhedhrin, 101a). Cheyne says of Ibn Ezra, a great medieval Jewish scholar, he "is so thorough in his literal exegesis that it is doubtful whether he is serious when he proceeds to allegorize." Among Christian scholars Theodore of Mopsuestia interpreted Canticles as a song in celebration of the marriage of Solomon and Pharaoh\'s daughter. This strictly literal interpretation of the So was condemned at the second council of Constantinople (553 AD). For the next thousand years the allegorical theory reigned supreme among Christian interpreters. In 1544 Sebastian Castellio revived the literal theory of the Song, though the allegorical view remained dominant until the 19th century.<P>Herder in 1778 published a remarkable little treatise entitled Lieder der Liebe, die altesten und schonsten aus dem Morgenlande, in which he advanced theory that Canticles is a collection of independent erotic songs, about 21 in number, which have been so arranged by a collector as to trace "the gradual growth of true love in its various nuances and stages, till it finds its consummation in wedlock" (Cheyne). But the greatest and most influential advocate of the literal interpretation of Canticles was Heinrich Ewald, who published the 1st edition of his commentary in 1826. It was Ewald who first developed and made popular theory that two suitors compete for the hand of the Shulammite, the one a shepherd and poor, the other a wise and wealthy king. In the Songs he ascribes to Solomon <a onClick="return mV(\'Sgs\',1,\'9-11\',15);">1:9-11,15</a>; <a onClick="return mV(\'Sgs\',2,2);">2:2</a>; <a onClick="return mV(\'Sgs\',4,\'1-7\');">4:1-7</a>; <a onClick="return mV(\'Sgs\',6,\'4-13\');">6:4-13</a> (quoting the dialogue between the Shulammite and the ladies of the court in <a onClick="return mV(\'Sgs\',6,\'10-13\');">6:10-13</A>); <a onClick="return mV(\'Sgs\',7,\'1-9\');">7:1-9</A>. To the shepherd lover he assigns few verses, and these are repeated by the Shulammite in her accounts of imaginary or real interviews with her lover. In the following passages the lover described is supposed to be the shepherd to whom the Shulammite had plighted her troth: <a onClick="return mV(\'Sgs\',1,\'2-7\',\'9-14\');">1:2-7,9-14</A>; <a onClick="return mV(\'Sgs\',1,\'16-\');">1:16</A>-<a onClick="return mV(\'Sgs\',2,1);">2:1</A>; <a onClick="return mV(\'Sgs\',2,\'3-17\');">2:3-7,8-17</A>; <a onClick="return mV(\'Sgs\',3,\'1-5\');">3:1-5</A>; <a onClick="return mV(\'Sgs\',4,\'8-\');">4:8</A>-<a onClick="return mV(\'Sgs\',5,1);">5:1</A>; <a onClick="return mV(\'Sgs\',5,\'2-8\');">5:2-8</A>; <a onClick="return mV(\'Sgs\',5,\'10-16\');">5:10-16</A>; <a onClick="return mV(\'Sgs\',6,2);">6:2</A>f; <a onClick="return mV(\'Sgs\',7,\'10-\');">7:10</A>-<a onClick="return mV(\'Sgs\',8,\'1-4\');">8:4</a>; <a onClick="return mV(\'Sgs\',8,\'5-14\');">8:5-14</A>. The shepherd lover is thus supposed to be present in the Shulammite\'s dreams, and in her waking moments she is ever thinking of him and describing to herself and others his many charms. Not until the closing scene (<a onClick="return mV(\'Sgs\',8,\'5-14\');">So 8:5-14</a>) does Ewald introduce the shepherd as an actor in the drama. Ewald had an imperial imagination and a certain strength of mind and innate dignity of character which prevented him from dragging into the mud any section of the Biblical literature. While rejecting entirely the allegorical theory of Canticles, he yet attributed to it an ethical quality which made the Song worthy of a place in the Old Testament. A drama in praise of fidelity between human lovers may well hold a place beside Ecclesiastes and Proverbs in the Canon. Many of the ablest Old Testament critics have followed Ewald in his general theory that Canticles is a drama celebrating the loyalty of a lowly maiden to her shepherd lover. Not even Solomon in all his glory could persuade her to become his queen.<P>Within the past quarter of a century the unity of Canticles has been again sharply challenged. An account of the customs of the Syrian peasants in connection with weddings was given by the Prussian consul at Damascus, J. G. Wetzstein, in 1873, in an article in Bastian\'s Zeitschrift fur Ethnologie, 270ff, on "Die syrische Dreschtafel," in which he illustrated the Old Testament from modern Syrian customs. Driver thus describes the customs that are supposed to throw light upon Canticles: "In modern Syria, the first seven days after a wedding are called the \'king\'s week\'; the young pair play during this time king and queen; the \'threshing-board\' is turned into a mock-throne, on which they are seated, while songs are sung before them by the villagers and others, celebrating them on their happiness, among which the watsf, or poetical \'description\' of the physical beauty of the bride and bridegroom, holds a prominent place. The first of these watsfs is sung on the evening of the wedding-day itself: brandishing a naked sword in her right hand, and with a handkerchief in her left, the bride dances in her wedding array, lighted by fires, and surrounded by a circle of guests, half men and half women, accompanying her dance with a watsf in praise of her charms" (LOT, 452). Wetzstein suggested the view that Canticles was composed of the wedding-songs sung during "the king\'s week." This theory has been most fully elaborated by Budde in an article in the New World, March,1894,and in his commentary (1898). According to Budde, the bridegroom is called King Solomon, and the bride Shulammith. The companions of the bridegroom are the 60 valiant men who form his escort (<a onClick="return mV(\'Sgs\',3,7);">So 3:7</a>). As a bride, the maiden is called the most beautiful of women (<a onClick="return mV(\'Sgs\',1,8);">So 1:8</a>; <a onClick="return mV(\'Sgs\',5,9);">5:9</a>; <a onClick="return mV(\'Sgs\',6,1);">6:1</a>). The pictures of wedded bliss are sung by the men and women present, the words being attributed to the bride and the bridegroom. Thus the festivities continue throughout the week. Budde\'s theory has some decided advantages over Ewald\'s view that the poem is a drama; but the loss in moral quality is considerable; the book becomes a collection of wedding-songs in praise of the joys of wedlock.<P>V. Closing Hints and Suggestions.<P>Having given a good deal of attention to Canticles during the past 15 years, the author of this article wishes to record a few of his views and impressions.<P>(1) Canticles is lyric poetry touched with the dramatic spirit. It is not properly classed as drama, for the Hebrews had no stage, though much of the Old Testament is dramatic in spirit. The descriptions of the charms of the lovers were to be sung or chanted.<P>(2) The amount that has to be read between the lines by the advocates of the various dramatic theories is so great that, in the absence of any hints in the body of the book itself, reasonable certitude can never be attained. (3) The correct translation of the refrain in <a onClick="return mV(\'Sgs\',2,7);">So 2:7</a> and <a onClick="return mV(\'Sgs\',3,5);">3:5</a> (compare <a onClick="return mV(\'Sgs\',8,4);">8:4</A>) is important for an understanding of the purpose of Canticles. It should be rendered as follows:<P class="in15">\'I adjure you, O daughters of Jerusalem,<br>By the gazelles, or by the hinds of the field,<br>That ye stir not up, nor awaken love,<br>Until it please.\'<P>Love between man and woman should not be excited by unnatural stimulants, but should be free and spontaneous. In <a onClick="return mV(\'Sgs\',8,4);">So 8:4</a> it seems to be implied that the women of the capital are guilty of employing artifices to awaken love:<P class="in15">\'I adjure you, O daughters of Jerusalem,<br>Why do ye stir up, or awaken love,<br>Until it please?\'<P>That this refrain is in keeping with the purpose of the writer is clear from the striking words toward the close of the book:<P class="in15">"Set me as a seal upon thy heart,<br>As a seal upon thine arm:<br>For love is strong as death;<br>Jealousy is cruel as Sheol;<br>The flashes thereof are flashes of fire,<br>A very flame of Yahweh.<br>Many waters cannot quench love,<br>Neither can floods drown it:<br>If a man would give all the substance of his house for love,<br>He would utterly be contemned" (<a onClick="return mV(\'Sgs\',8,6);">So 8:6</a>f).<P>(4) Canticles discloses all the secret intimacies of wedded life without becoming obscene. The imagery is too sensuous for our taste in western lands, so that words of caution are often timely, lest the sensuous degenerate into the sensual; but I have been told by several Syrian and Palestinian students whom I have had the privilege of teaching, that Canticles is considered quite chaste among their people, the wedding-songs now in use among them being more minute in their description of the physical charms of the lovers.<P>(5) Canticles is by no means excluded from the Canon by the acceptance of the literal interpretation. Ewald\'s theory makes it an ethical treatise of great and permanent value. Even if Canticles is merely a collection of songs describing the bliss of true lovers in wedlock, it is not thereby rendered unworthy of a place in the Bible, unless marriage is to be regarded as a fall from a state of innocency. If Canticles should be rejected because of its sensuous imagery in describing the joys of passionate lovers, portions of Proverbs would also have to be excised (<a onClick="return mV(\'Pro\',5,\'15-20\');">Pr 5:15-20</a>). Perhaps most persons need to enlarge their conception of the Bible as a repository for all things that minister to the welfare of men. The entire range of man\'s legitimate joys finds sympathetic and appreciative description in the Bible. Two young lovers in Paradise need not fear to rise and meet their Creator, should He visit them in the cool of the day.<P>LITERATURE.<P>C. D. Ginsburg, The Song of Songs, with a Commentary, Historical and Critical, 1857; H. Ewald, Dichter des Alten Bundes, III, 333-426, 1867; F. C. Cook, in Biblical Commentary, 1874; Franz Delitzsch, Hoheslied u. Koheleth, 1875 (also translation); O. Zockler, in Lange\'s Comm., 1875; S. Oettli, Kurzgefasster Kommentar, 1889; W. E. Griffis, The Lily among Thorns, 1890; J. W. Rothstein, Das Hohe Lied, 1893; K. Budde, article in New World, March, 1894. and Kommentar, 1898; C. Siegfried, Prediger u. Hoheslied, 1898; A. Harper, in Cambridge Bible, 1902; G. C. Martin, in Century Bible, 1908; article on "Canticles" by Cheyne in EB, 1899.``156';
isbe[8298]='Song of the Three Children`1. Name<P>2. Canonicity<P>3. Contents<P>4. Author and Date<P>5. Original Language<P>6. Text and Versions<P>LITERATURE<hr /><P>For general remarks concerning the Additions to Daniel see <a href="./study/isbe/search.html?string=BEL+AND+THE+DRAGON">BEL AND THE DRAGON</a>.<P>1. Name:<P>This Addition has no separate title in any manuscript or version because in the Septuagint, Theod, Syriac and Latin (Old Latin and Vulgate) it follows <a onClick="return mV(\'Dan\',3,23);">Da 3:23</a> immediately, forming an integral portion of that chapter, namely, The Song of the Three Children (Azariah) 1:24-90 in the Septuagint and Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) It is the only one of the three Additions which has an organic connection with Daniel; as regards the others see preliminary remarks to <a href="./study/isbe/search.html?string=BEL+AND+THE+DRAGON">BEL AND THE DRAGON</A>. The title in English Versions of the Bible is "The Song of the Three Holy Children," a title describing its matter as formerly understood, though a more rigid analysis shows that in the 68 verses so designated, we have really two separate sections. See 3, below.<P>2. Canonicity:<P>See introductory remarks to <a href="./study/isbe/search.html?string=BEL+AND+THE+DRAGON">BEL AND THE DRAGON</a>. The order in which the three "Additions to Daniel" are found in the (Separate Protestant) Apocrypha is decided by their sequence in the Vulgate, the Song of the Three Children forming part of chapter 3, Susanna of chapter 13, and Bel and the Dragon of chapter 14 of Daniel.<P>3. Contents:<P>Though the English and other Protestant versions treat the 68 verses as one piece under the name given above, there are really two quite distinct compositions. These appear separately in the collection of Odes appended to the Psalter in Cod. A under the headings, "The Prayer of Azarias" (Proseuche Azariou, Azariah, <a onClick="return mV(\'Dan\',1,6);">Da 1:6</a>f) and "The Hymn of Our Fathers" (Humnos ton pateron hemon); see Swete, The Old Testament in Greek, 3804ff, and Introduction to the Old Testament in Greek, 253f. Luther with his usual independence makes each of these into a separate book under the titles, "The Prayer of Azaria" (Das Gebet Asarjas) and "The Song of the Three Men in the Fire" (Der Gesang der drei Manner im Feuerofen).<P>(1) The Prayer of Azarias (The Song of the Three Children (Azariah) 1:1-22) (<span class="noTag">Daniel 3:24-48</span>).<P>Azariah is the Hebrew name of Abed-nego (= Abednebo, "servant of Nebo"), the latter being the Babylonian name (see <a onClick="return mV(\'Dan\',1,7);">Da 1:7</a>; <a onClick="return mV(\'Dan\',2,49);">2:49</a>, etc.). This prayer joins on to <a onClick="return mV(\'Dan\',3,23);">Da 3:23</a>, where it is said that "Shadrach, Meshach and Abed-nego (Azariah) fell down bound into the midst of the burning fiery furnace." &#920; (the version of Theodotion; see "Text and Versions" below) adds, "And they walked (Syr adds "in their chains") in the midst of the fire, praising God, and blessing the Lord." This addition forms a suitable connecting link, and it has been adopted by the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) and in modern versions which are made from &#920; and not from the Septuagint, which last was lost for many centuries (see <a href="./study/isbe/search.html?string=BEL+AND+THE+DRAGON">BEL AND THE DRAGON</A>, III). In the Septuagint the words with which the Prayer was introduced are these: "Thus therefore prayed Hananias, and Azarias and Misael and sang praises (hymns) to the Lord when the king commanded that they should be cast into the furnace." The prayer (offered by Azarias) opens with words of adoration followed by an acknowledgment that the sufferings of the nation in Babylon were wholly deserved, and an earnest entreaty that God would intervene on behalf of His exiled and afflicted people. That this prayer was not composed for the occasion with which it is connected goes without saying. No one in a burning furnace could pray as Azarias does. There are no groans or sighs, nor prayer for help or deliverance of a personal nature. The deliverance sought is national.<P>(2) The Song of the Three Holy Children (The Song of the Three Children (Azariah) 1:28-68) (Da 3:51-90).<P>This is introduced by a brief connecting narrative (The Song of the Three Children (Azariah) 1:23-27). The king\'s servants continued to heat the furnace, but an angel came down and isolated an inner zone of the furnace within which no flames could enter; in this the three found safety. Rothstein (Kautzsch, Die Apok., 175) is inclined to think that this narrative section (The Song of the Three Children (Azariah) 1:23-27) stood between <a onClick="return mV(\'Dan\',3,23);">Da 3:23</a> and <a onClick="return mV(\'Dan\',3,24);">3:24</A> in the original Hebrew text. The "Song" is really a psalm, probably a translation of a Hebrew original. It has nothing to do with the incident—the three young men in the furnace—except in The Song of the Three Children (Azariah) 1:66 (EV) where the three martyrs call upon themselves by name to praise and bless the Lord for delivering them from the midst of the furnace. This verse is an interpolation, for the rest of the Song is a long litany recalling <a onClick="return mV(\'Psa\',103,\'1-\');">Ps 103</a> and especially <a onClick="return mV(\'Psa\',136,\'1-\');">Psalms 136</a>; <a onClick="return mV(\'Psa\',148,\'1-\');">148</a>, and Sirach 43. The Song, in fact, has nothing to do with the sufferings of the three young men, but is an ordinary hymn of praise. It is well known from the fact that it forms a part of the Anglican Prayer-book, as it had formed part of many early Christian liturgies.<P>4. Author and Date:<P>(1) Author.<P>We know nothing whatever of the author besides what may be gathered from this Addition. It is quite evident that none of the three Additions belong to the original text of Daniel, and that they were added because they contained legends in keeping with the spirit of that book, and a song in a slight degree (The Song of the Three Children (Azariah) 1:66 English Version of the Bible) adapted to the situation of the three Hebrew youths in the furnace, though itself of an independent liturgical origin.<P>For a long time the three Additions must have circulated independently. Polychronius says that "The Song of the Three Holy Children" was, even in the 5th century AD, absent from the text of Daniel, both in the Peshitta and in the Septuagint proper. Rothstein (Kautzsch, Die Apok., 176) contends that the Additions formed a part of the Septuagint from the beginning, from which he infers that they were all composed before the Septuagint was made. What was the date of this version of Daniel? Since its use seems implied in 1Macc 1:54 (compare <a onClick="return mV(\'Dan\',11,31);">Da 11:31</a>; <a onClick="return mV(\'Dan\',12,11);">12:11</a>), it would be safe to conclude that it existed about 100 BC.<P>(2) Date of the Prayer of Azarias.<P>In The Song of the Three Children (Azariah) 1:15 (English Versions of the Bible) it is said that at the time the prayer was offered, there was no prince, prophet or leader, nor sacrifice of any kind. This may point to the time between 168 and 165 BC, when Antiochus IV (Epiphanes) profaned the temple. If written in that interval, it must have been added to Daniel at a much later time. But on more occasions than one, in later times, the temple-services were suspended, as e.g. during the invasion of Jerusalem by the Egyptian king, Ptolemy IV (Philopater).<P>(3) Date of the Song.<P>We find references in the Song (The Song of the Three Children (Azariah) 1:62f English Versions of the Bible) to priests and temple-servants, and in The Song of the Three Children (Azariah) 1:31 to the temple itself, suggesting that when the So was written the temple-services were carried on. This, in itself, would suit a time soon after the purification of the temple, about 164 BC. But the terms of the Song are, except in verse 66 (English Versions of the Bible), so general that it is impossible to fix the date definitely. On the date of the historical connecting narrative (The Song of the Three Children (Azariah) 1:23-27) see 3, (2), above.<P>5. Original Language:<P>(1) Romanist scholars in general and several Protestants (Eichhorn, Einleit., in das Altes Testament, IV, 24f; Einleit. in die apok. Schriften, 419; Vatke; Delitzsch, De Habacuci, 50; Zockler, Bissell, Ball, Rothstein, etc.) hold that the original language was Hebrew. The evidence, which is weak, is as follows: (a) The style is Hebraistic throughout (not more so than in writings known to have been composed in Alexandrian Gr; the idiom kataischunesthai + apo = bosh min (The Song of the Three Children (Azariah) 1:44 English Versions of the Bible; the Septuagint 1:44), "to be ashamed of," occurs in parts of the Septuagint which are certainly not translations). (b) The three Hebrew martyrs bear Hebrew names (The Song of the Three Children (Azariah) 1:66 English Versions). This only shows that the tale is of Hebrew origin. (2) Most modern non-Romanist scholars hold that the original language of the So (and Prayer) was Greek. So Keil, Fritzsche, De Wette, Schurer, Konig, Cornill, Strack, etc.<P>Some grounds:<P>(1) The Hebraisms are comparatively few, and those which do exist can be paralleled in other writings composed in Hellenistic Greek<P>(2) It can be proved that in Daniel and also in Bel and the Dragon (see Introduction to Bel in the Oxford Apocrypha, edition R.H. Charles), Theodotion corrects the Septuagint from the Hebrew (lost in the case of Bel); but in Three, Theodotion corrects according to Greek idiom or grammar. It must be admitted, however, that the evidence is not very decisive either way.<P>6. Text and Versions:<P>As to the text and the various versions of the Song, see what is said in the article <a href="./study/isbe/search.html?string=BEL+AND+THE+DRAGON">BEL AND THE DRAGON</a>. It is important to note that the translations in English Versions of the Bible are made from Theodotion\'s Greek version, which occurs in ancient versions of the Septuagint (A B V Q dc) instead of the true Septuagint (Cod. 87).<P>LITERATURE.<P>See the article Bel and the Dragon; Marshall (Hastings Dictionary of the Bible, IV, 754); W. H. Bennett (Oxford Apocrypha, edition R.H. Charles, 625ff).``33';
