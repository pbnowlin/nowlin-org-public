isbe[8201]='Sinai`si\'-ni, si\'-na-i (cinay; Codex Alexandrinus Sina, Codex Vaticanus Seina):<P>1. The Name:<P>The name comes probably from a root meaning "to shine," which occurs in Syriac, and which in Babylonian is found in the name sinu for "the moon." The old explanation, "clayey," is inappropriate to any place in the Sinaitic desert, though it might apply to Sin (<a onClick="return mV(\'Eze\',30,15,16);">Eze 30:15,16</a>) or Pelusium; even there, however, the applicability is doubtful. The desert of Sin (<a onClick="return mV(\'Exd\',16,1);">Ex 16:1</a>; <a onClick="return mV(\'Exd\',17,1);">17:1</a>; <a onClick="return mV(\'Num\',33,11);">Nu 33:11</a>f) lay between Sinai and the Gulf of Suez, and may have been named from the "glare" of its white chalk. But at Sinai "the glory of Yahweh was like devouring fire on the top of the mount in the eyes of the children of Israel" (<a onClick="return mV(\'Exd\',24,17);">Ex 24:17</a>); and, indeed, the glory of the Lord still dyes the crags of Jebel Musa (the "mountain of Moses") with fiery red, reflected from its red granite and pink gneiss rocks, long after the shadows have fallen on the plain beneath. Sinai is mentioned, as a desert and a mountain, in 35 passages of the Old Testament. In 17 passages the same desert and mountain are called "Horeb," or "the waste." This term is chiefly used in Deuteronomy, though Sinai also occurs (<a onClick="return mV(\'Deu\',33,2);">De 33:2</a>). In the other books of the Pentateuch, Sinai is the usual name, though Horeb also occurs (<a onClick="return mV(\'Exd\',3,1);">Ex 3:1</a>; <a onClick="return mV(\'Exd\',17,6);">17:6</a>; <a onClick="return mV(\'Exd\',33,6);">33:6</a>), applying both to the "Mount of God" and to the desert of Rephidim, some 20 miles to the northwest.<P>2. Traditional Site:<P>The indications of position, in various passages of the Pentateuch, favor the identification with the traditional site, which has become generally accepted by all those explorers who have carefully considered the subject, though two other theories may need notice. Moses fled to the land of Midian (or "empty land"), which lay east of the Sinaitic peninsula (<a onClick="return mV(\'Num\',22,4);">Nu 22:4,7</a>; <a onClick="return mV(\'Num\',25,\'1-\');">25</a>; <a onClick="return mV(\'Num\',31,\'1-\');">31</a>), and when he wandered with his flocks to Horeb (<a onClick="return mV(\'Exd\',3,\'1-\');">Ex 3:1</a>) he is said to have reached the west side of the desert. In another note (<a onClick="return mV(\'Deu\',1,2);">De 1:2</a>) we read that the distance was "eleven days\' journey from Horeb by the way of Mount Seir unto Kadesh-barnea" or Petra (see <a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</A>), the distance being about 145 miles, or 14 miles of daily march, though Israel—with its flocks, women and children—made 16 marches between these points. Sinai again is described as being distant from Egypt "three days\' journey into the wilderness" (<a onClick="return mV(\'Exd\',5,3);">Ex 5:3</a>), the actual route being 117 miles, which Israel accomplished in 10 journeys. But, for Arabs not encumbered with families and herds, this distance could still be covered by an average march of 39 miles daily, on riding camels, or even, if necessary, on foot.<P>3. Identification with Jebel Musa:<P>These distances will not, however, allow of our placing Sinai farther east than Jebel Musa. Lofty mountains, in all parts of the world, have always been sacred and regarded as the mysterious abode of God; and Josephus says that Sinai is "the highest of all the mountains thereabout," and again is "the highest of all the mountains that are in that country, and is not only very difficult to be ascended by men, on account of its vast. altitude but because of the sharpness of its precipices: nay, indeed, it cannot be looked at without pain of the eyes, and besides this it was terrible and inaccessible, on account of the rumor that passed about, that God dwelt there" (Ant., II, xii, 1; III, v, 1). Evidently in his time Sinai was supposed to be one of the peaks of the great granitic block called et Tur—a term applying to any lofty mountain. This block has its highest peak in Jebel Katarin (so named from a legend of Catherine of Egypt), rising 8,550 ft. above the sea. Northeast of this is Jebel Musa (7,370 ft.), which, though less high, is more conspicuous because of the open plain called er Rachah ("the wide") to its northwest. This plain is about 4 miles long and has a width of over a mile, so that it forms, as Dr. E. Robinson (Biblical Researches,1838, I, 89) seems to have been the first to note, a natural camp at the foot of the mountain, large enough for the probable numbers (see <a href="./study/isbe/search.html?string=EXODUS">EXODUS, 3</a>) of Israel.<P>4. Description of Jebel Musu:<P>Jebel Musa has two main tops, that to the Southeast being crowned by a chapel. The other, divided by gorges into three precipitous crags, has the Convent to its north, and is called Ras-es-Cafcafeh, or "the willow top." North of the Convent is the lower top of Jebel edition Deir ("mountain of the monastery"). These heights were accurately determined by Royal Engineer surveyors in 1868 (Sir C. Wilson, Ordnance Survey of Sinai); and, though it is impossible to say which of the peaks Moses ascended, yet they are all much higher than any mountains in the Sinaitic desert, or in Midian. The highest tops in the Tih desert to the north are not much over 4,000 ft. Those in Midian, east of Elath, rise only to 4,200 ft. Even Jebel Serbal, 20 miles west of Sinai—a ridge with many crags, running 3 miles in length—is at its highest only 6,730 ft. above the sea. Horeb is not recorded to have been visited by any of the Hebrews after Moses, except by Elijah (<a onClick="return mV(\'1Ki\',19,8);">1Ki 19:8</a>) in a time of storm. In favor of the traditional site it may also be observed that clouds suddenly formed, or lasting for days (<a onClick="return mV(\'Exd\',24,15);">Ex 24:15</a>f), are apt to cap very lofty mountains. The Hebrews reached Sinai about the end of May (<a onClick="return mV(\'Exd\',19,1);">Ex 19:1</a>) and, on the 3rd day, "there were thunders and lightnings, and a thick cloud upon the mount" (<a onClick="return mV(\'Exd\',19,16);">Ex 19:16</a>). Such storms occur as a rule in the Sinaitic desert only in December and January, but thunderstorms are not unknown in Palestine even in May.<P>5. Patristic Evidence:<P>A constant tradition fixing the site is traceable back to the 4th century AD. Eusebius and Jerome (Onomasticon, under the word "Choreb") place Horeb near Paran, which in their time was placed (Onomasticon, under the word "Raphidim") in Wady Feiran. Anchorites lived at Paran, and at Sinai at least as early as 365 AD, and are noticed in 373 AD, and often later (Robinson, Biblical Res.,1838, I, 122-28); the monastery was first built for them by Justinian in 527 AD and his chapel still exists. Cosmas (Topogr. Christ.), in the same reign, says that Rephidim was then called Pharan, and (distinguishing Horeb from Sinai, as Eusebius also does) he places it "about 6 miles from Pharan," and "near Sinai." These various considerations may suffice to show that the tradition as to Horeb is at least as old as the time of Josephus, and that it agrees with all the indications given in the Old Testament.<P>6. Lepsius\' Theory:<P>Lepsius, it is true (Letters from Egypt, 1842-44), denying the existence of any unbroken tradition, and relying on his understanding of Cosmas, supposed Sinai to be the Jebel Serbal above mentioned, which lies immediately South of Wady Feiran. His main argument was that, visiting Sinai in March, he considered that the vicinity did not present sufficient water for Israel (Appendix B, 303-18). But, on this point, it is sufficient to give the opinion of the late F. W. Holland, based on the experience of four visits, in 1861,1865,1867-68.<P>He says (Recovery of Jerusalem, 524):<P>"With regard to water-supply there is no other spot in the whole Peninsula which is nearly so well supplied as the neighborhood of Jebel Musa. Four streams of running water are found there: one in Wady Leja; a second in Wady et Tl\'ah which waters a succession of gardens extending more than 3 miles in length, and forms pools in which I have often had a swim; a third stream rises to the north of the watershed of the plain of er Rachah and runs west into Wady et Tl\'ah; and a fourth, is formed by the drainage from the mountains of Umm Alawy, to the east of Wady Sebaiyeh and finds its way into that valley by a narrow ravine opposite Jebel edition Deir. In addition to these streams there are numerous wells and springs, affording excellent water throughout the whole of the granitie district. I have seldom found it necessary to carry water when making a mountain excursion, and the intermediate neighborhood of Jebel Masa would, I think, bear comparison with many mountain districts in Scotland with regard to its supply of water. There is also no other district in the Peninsula which affords such excellent pasturage."<P>This is important, as Israel encamped near Sinai from the end of May till April of the next year. There is also a well on the lower slope of Jebel Musa itself, where the ascent begins.<P>7. Greene\'s Theory:<P>Another theory, put forward by Mr. Baker Greene (The Hebrew Migration from Egypt), though accepted by Dr. Sayce (Higher Cricitism, 1894, 268), appears likewise to be entirely untenable. Mr. Greene supposed Elim (<a onClick="return mV(\'Exd\',15,27);">Ex 15:27</a>) to be Elath (<a onClick="return mV(\'Deu\',2,8);">De 2:8</a>), now \'Ailah at the head of the Gulf of \'Akabah; and that Sinai therefore was some unknown mountain in Midian. But in this case Israel would in 4 days (see <a onClick="return mV(\'Exd\',15,22,23,27);">Ex 15:22,23,27</a>) have traveled a distance of 200 miles to reach Elim, which cannot but be regarded as quite impossible for the Hebrews when accompanied by women, children, flocks and herds.``28';
isbe[8202]='Sincere; Sincerity`sin-ser\', sin-ser\'-i-ti (tamim; aphtharsia, eilikrineia): "Sincerity" occurs once in the Old Testament as the translation of tamim, "complete," "entire," "sincere," etc. (<a onClick="return mV(\'Jos\',24,14);">Jos 24:14</a>); the same word is translated "sincerity" (<a onClick="return mV(\'Jdg\',9,16,19);">Jud 9:16,19</a>, the Revised Version (British and American) "uprightly"). Four different words are rendered "sincere," "sincerely" "sincerity," in the New Testament: adolos, "without guile," "unadulterated," "desire the sincere milk of the word" (<a onClick="return mV(\'1Pe\',2,2);">1Pe 2:2</a> the King James Version, the Revised Version (British and American) "the spiritual," the American Revised Version margin "Greek, \'belonging to the reason\'; compare <a onClick="return mV(\'Rom\',12,1);">Ro 12:1</a>," the English Revised Version margin reasonable"), "milk which is without guile," with no other purpose but to nourish and benefit the soul (Alford); hagnos, "without blame," "pure," "preach Christ...not sincerely" (<a onClick="return mV(\'Phl\',1,17);">Php 1:17</a>); aphtharsia, "without corruption" (<a onClick="return mV(\'Eph\',6,24);">Eph 6:24</a>, the King James Version "that love our Lord Jesus Christ in sincerity," the American Standard Revised Version "with a love incorruptible," margin "\' in incorruption.\' See <a onClick="return mV(\'Rom\',2,7);">Ro 2:7</a>," the English Revised Version "uncorruptness"; <a onClick="return mV(\'Tts\',2,7);">Tit 2:7</a>, the King James Version "shewing uncorruptness...sincerity," the Revised Version (British and American) "uncorruptness"); gnesios, "not spurious" (<a onClick="return mV(\'2Cr\',8,8);">2Co 8:8</a>); eilikrines, literally, judged of in the sunlight, hence, "clear," "manifest" (<a onClick="return mV(\'Phl\',1,10);">Php 1:10</a>); eilikrineia, with same meaning, is translated "sincerity" (<a onClick="return mV(\'1Cr\',5,8);">1Co 5:8</a>; <a onClick="return mV(\'2Cr\',1,12);">2Co 1:12</a>; <a onClick="return mV(\'2Cr\',2,17);">2:17</a>).<P>The Revised Version (British and American) has "sincere" for "pure" (<a onClick="return mV(\'2Pe\',3,1);">2Pe 3:1</a>), "sincerely" for "clearly" (<a onClick="return mV(\'Job\',33,3);">Job 33:3</a>).<P>In <span class="noTag">The Wisdom of Solomon 7:25</span> we have eilikrines in the description of Wisdom as a "pure influence," the Revised Version (British and American) "clear effluence."``185';
isbe[8203]='Sinew`sin\'-u (gidh (<a onClick="return mV(\'Job\',10,11);">Job 10:11</a>, etc.)): The tendons and sinews of the body are uniformly (7 times) thus called. "Therefore the children of Israel eat not the sinew of the hip which is upon the hollow of the thigh, unto this day: because he touched the hollow of Jacob\'s thigh in the sinew of the hip" (<a onClick="return mV(\'Gen\',32,32);">Ge 32:32</a>). In the poetical description of Behemoth (hippopotamus) it is said: "He moveth his tail like a cedar: the sinews of his thighs are knit together" (<a onClick="return mV(\'Job\',40,17);">Job 40:17</a>). The prophet Ezekiel saw in his vision (<a onClick="return mV(\'Eze\',37,6,8);">37:6,8</a>) that the dry bones were gathered together, that they were covered with sinews, flesh and skin, and that they were revived by the spirit of the Lord. In figurative language the neck of the obstinate is compared to an "iron sinew" (<a onClick="return mV(\'Isa\',48,4);">Isa 48:4</a>). the King James Version "my sinews take no rest" (we\'oreqay lo\' yishkabhun, <a onClick="return mV(\'Job\',30,17);">Job 30:17</a>) has been corrected by the Revised Version (British and American) into "the pains that gnaw me take no rest," but the earlier version has been retained in the margin.``106';
isbe[8204]='Singers; Singing`sing\'-erz, sing\'-ing: Singing seems to have become a regular profession at quite early date among the Hebrews. David had his troupe of "singing men and singing women" at Jerusalem (<a onClick="return mV(\'2Sa\',19,35);">2Sa 19:35</a>), and no doubt Solomon added to their numbers. <a onClick="return mV(\'Isa\',23,16);">Isa 23:16</a> suggests that it was not uncommon for foreign female minstrels of questionable character to be heard making "sweet melody," singing songs along the streets and highways of Judea. Nor was the worship of the temple left to the usually incompetent and inconstant leadership of amateur choristers. The elaborate regulations drawn up for the constitution of the temple orchestra and chorus are referred to under <a href="./study/isbe/search.html?string=MUSIC">MUSIC</A> (which see). It has been inferred from <a onClick="return mV(\'Ezr\',2,65);">Ezr 2:65</a> that women were included among the temple singers, but this is erroneous, as the musicians there mentioned were of the class employed at banquets, festivals, etc. The temple choir consisted exclusively of Levites, one essential qualification of an active member of that order being a good voice.<P>Of the vocal method of the Hebrews we know nothing. Wellhausen imagines that he can detect one of the singers, in the portrayal of an Assyrian band, compressing his throat in order to produce a vibrato; and it is quite possible that in other respects as well as this, ancient and modern oriental vocalization resembled each other. But that is about all that can be said.<P>On the other hand, we cannot repeat too often that we are quite unable to identify any intervals, scales, or tunes as having been used in ancient Israel. Even those who hold that the early church took the Gregorian "tones" from the synagogue, confess that it was "certainly not without considerable modifications." And, of course, there was not the slightest affinity between the Hebrew and the Anglican chant.`<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>; <a href="./study/isbe/search.html?string=PRAISE">PRAISE</a>; <a href="./study/isbe/search.html?string=SONG">SONG</a>; <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</a>`120';
isbe[8205]='Single, Eye`sin\'-g\'-l:<a onClick="return mV(\'Mat\',6,22);">Mt 6:22</a>f parallel <a onClick="return mV(\'Luk\',11,34);">Lu 11:34</a>: "If therefore thine eye be single, thy whole body shall be full of light. But if thine eye be evil, thy whole body shall be full of darkness." "Single" and "evil" here represent haplouis, and poneros. Poneros elsewhere in the New Testament means "wicked"; haplous occurs only here in the New Testament, but is very common in ordinary Greek and always has the meaning "simple." But in view of the context, most commentators take haplous here as meaning "normal," "healthy," and poneros as "diseased," so rendering "Just as physical enlightenment depends on the condition of the eye, so does spiritual enlightenment depend on the condition of the heart." This is natural enough, but it is not satisfactory, as it gives to haplous a unique sense and to poneros a sense unique in the 73 New Testament examples of the word. Moreover, the same expression, "evil eye," is found also in <a onClick="return mV(\'Mat\',20,15);">Mt 20:15</a>; <a onClick="return mV(\'Mar\',7,22);">Mr 7:22</a>, where it means "jealousy" or "covetousness." With poneros = "covetous" haplous would = "generous"; and this rendition gives excellent sense in Matthew, where the further context deals with love of money. Yet in Luke it is meaningless, where the context is of a different sort, a fact perhaps indicating that Luke has placed the saying in a bad context. Or the Greek translation of Christ\'s words used by Matthew and Luke may have taken the moral terms haplous and poneros to translate physical terms ("healthy" and "diseased"?) employed in the original Aramaic. The Sinaitic Syriac version of <a onClick="return mV(\'Luk\',11,36);">Lu 11:36</a> may perhaps contain a trace of an older rendering. See Julicher, Die Gleichnisreden Jesu, II, 98-108.``48';
isbe[8206]='Singular`sin\'-gu-lar: "Pertaining to the single person," "individual," and so sometimes "unusual," "remarkable." So <span class="noTag">The Wisdom of Solomon 14:18</span>, the King James Version "the singular diligence of the artificer" (philotimia, "love of honor," the Revised Version (British and American) "ambition"). In <a onClick="return mV(\'Lev\',27,2);">Le 27:2</a> by "when a man shall make a singular vow" the King James Version seems to have understood a "personal" or "private" vow. the Revised Version (British and American) has "accomplish a vow," with margin "make a special vow." Compare the same phrase (yaphli\' (yephalle\') nedher) used of the Nazirite vow in <a onClick="return mV(\'Num\',6,2);">Nu 6:2</a>.``1';
isbe[8207]='Sinim, Land of`si\'-nim, sin\'-im (\'erets cinim; ge Person): The name occurs in Isaiah\'s prophecy of the return of the people from distant lands: "Lo, these shall come from far; and, lo, these from the north and from the west; and these from the land of Sinim" (<a onClick="return mV(\'Isa\',49,12);">Isa 49:12</a>). The land is clearly far off, and it must be sought either in the south or in the east. Septuagint points to an eastern country. Many scholars have favored identification with China, the classical Sinae. It seems improbable that Jews had already found their way to China; but from very early times trade relations were established with the Far East by way of Arabia and the Persian Gulf; and the name may have been used by the prophet simply as suggesting extreme remoteness. Against, this view are Dillmann (Commentary on Isaiah), Duhm, Cheyne and others. Some have suggested places in the south: e.g. Sin (Pelusium, <a onClick="return mV(\'Eze\',30,15);">Eze 30:15</a>) and Syene (Cheyne, Introduction to Isaiah, 275). But these seem to be too near. In harmony with his reconstruction of Biblical history, Cheyne finally concludes that the reference here is to the return from a captivity in Northern Arabia (EB, under the word). While no certain decision is possible, probability points to the East, and China cannot be quite ruled out. See article "China," Encyclopedia Brittanica (11th edition), 188b.``54';
isbe[8208]='Sinites`si\'-nits (cini): A Canaanite people mentioned in <a onClick="return mV(\'Gen\',10,17);">Ge 10:17</a>; <a onClick="return mV(\'1Ch\',1,15);">1Ch 1:15</a>. The identification is uncertain. Jerome mentions a ruined city, Sin, near Arka, at the foot of Lebanon.``1';
isbe[8209]='Sinlessness`sin\'-les-nes: The 15th Anglican article ("Of Christ Alone without Sin") may be quoted as a true summary of Scripture teaching on sinlessness: "Christ in the truth of our nature was made like unto us in all things, sin only excepted, from which He was clearly (prorsus) void, both in His flesh and in His spirit ..... Sin, as Saint John saith, was not in Him. But all we the rest, though baptized, and born again in Christ, yet offend in many things; and, if we say we have no sin, we deceive ourselves."<P>1. Christ Sinless:<P>Here the sinlessness of the Incarnate Son is affirmed. It needs no elaborate argument to show that this is the affirmation of Scripture. It is not only, as we are reminded above, definitely taught there. Yet more is it implied in the mysterious (and morally miraculous) phenomenon of the Lord\'s evidently total immunity from the sense of sin, His freedom from inward discord or imperfection, from the slightest discontent with self. It is not too much to say that this representation is self-evidential of its truth to fact. Had it been the invention of worshipping disciples, we may say with confidence that they (supposed thus capable of "flee handling") would have been certain to betray some moral aberrations in their portraiture of their Master. They must have failed to put before us the profound ethical paradox of a person who, on the one hand, enjoins penitence and (with a tenderness infinitely deep) loves the penitent, and, on the other hand, is never for a moment penitent Himself, and who all the while has proved, from the first, a supreme moral and spiritual magnet, "drawing all men to him." Meanwhile the Scripture represents the sinlessness of the Incarnate Lord as no mere automatic or effortless condition. He is sensitive to temptation, to a degree which makes it agony. His sinlessness, as to actual experience (we are not here considering the matter sub specie aeternitatis), lies in the perfect fidelity to the Father of a will, exercised under human conditions, filled absolutely with the Holy Spirit, willingly received.<P>2. Saints Not Sinless:<P>On the other hand, "we the rest," contemplated as true believers, are warned by the general teaching of Scripture never to affirm sinlessness as our condition. There are passages (e.g. <a onClick="return mV(\'1Jo\',3,9);">1Joh 3:9</a>; <a onClick="return mV(\'1Jo\',5,1);">5:1</a>f) which affirm of the regenerate man that he "sinneth not." But it seems obvious to remark that such words, taken without context and balance, would prove too much; they would make the smallest sense of sin a tremendous evidence against the person\'s regeneration at all. It would seem that such words practically mean that sin and the regenerate character are diametrical opposites, so that sinning is out of character, not in the man as such, but in the Christian as such. And the practical result is an unconquerable aversion and opposition in the regenerate will toward all known sin, and a readiness as sensitive as possible for confession of failure. Meanwhile such passages as 1 John are, to the unbiased reader, an urgent warning of the peril of affirming our perfect purity of will and character. But then, on the other hand, Scripture abounds in both precepts and promises bearing on the fact that in Christ and by the power of His Spirit, received by faith into a watchful soul, our weakness can be so lifted and transformed that a moral purification and emancipation is possible for the weakest Christian which, compared with the best efforts of unregenerate nature, is a "more than conquest" over evil (see e.g. <a onClick="return mV(\'2Cr\',12,9,10);">2Co 12:9,10</a>; <a onClick="return mV(\'Gal\',2,20);">Ga 2:20</a>; <a onClick="return mV(\'Eph\',6,16);">Eph 6:16</a>; <a onClick="return mV(\'Jud\',1,24);">Jude 1:24</a>).`<a href="./study/isbe/search.html?string=FLESH">FLESH</a>; <a href="./study/isbe/search.html?string=SPIRIT">SPIRIT</a>`46';
isbe[8210]='Sinner`sin\'-er (chatta; hamartolos, "devoted to sin," "erring one"): In the New Testament, in addition to its ordinary significance of one that sins (<a onClick="return mV(\'Luk\',5,8);">Lu 5:8</a>; <a onClick="return mV(\'Luk\',13,2);">13:2</a>; <a onClick="return mV(\'Rom\',5,8,19);">Ro 5:8,19</a>; <a onClick="return mV(\'1Ti\',1,15);">1Ti 1:15</a>; <a onClick="return mV(\'Hbr\',7,26);">Heb 7:26</a>), the term is applied to those who lived in disregard of ceremonial prescription (<a onClick="return mV(\'Mat\',9,10,11);">Mt 9:10,11</a>; <a onClick="return mV(\'Mar\',2,15);">Mr 2:15</a>ff; <a onClick="return mV(\'Luk\',5,30);">Lu 5:30</a>; <a onClick="return mV(\'Gal\',2,15);">Ga 2:15</a>); to those stained with certain definite vices or crimes, as the publicans (<a onClick="return mV(\'Luk\',15,2);">Lu 15:2</a>; <a onClick="return mV(\'Luk\',18,13);">18:13</a>; <a onClick="return mV(\'Luk\',19,7);">19:7</a>); to the heathen (<a onClick="return mV(\'Mat\',26,45);">Mt 26:45</a>; <a onClick="return mV(\'Gal\',2,15);">Ga 2:15</a>; compare Tobit 13:6; 1Macc 1:34; 2Macc 2:48,62); to the preeminently sinful (<a onClick="return mV(\'Mar\',8,38);">Mr 8:38</a>; <a onClick="return mV(\'Jhn\',9,24,31);">Joh 9:24,31</a>; <a onClick="return mV(\'Gal\',2,17);">Ga 2:17</a>; <a onClick="return mV(\'1Ti\',1,9);">1Ti 1:9</a>; <a onClick="return mV(\'Jud\',1,15);">Jude 1:15</a>). It was the Jewish term for a woman of ill-fame (<a onClick="return mV(\'Luk\',7,37);">Lu 7:37</a>; compare <a onClick="return mV(\'Mat\',21,32);">Mt 21:32</a>, where it is stated that such had come even to John\'s baptism also).`<a href="./study/isbe/search.html?string=SIN">SIN</a>`91';
isbe[8211]='Sion`si\'-un (si\'on; Seon):<P>(1) A name given to Mt. Hermon in <a onClick="return mV(\'Deu\',4,48);">De 4:48</a>. The name may mean "protuberance" or "peak," and may have denoted the lofty snow-covered horn of the mountain as seen from the South. It may, however, be a scribal error for Sirion, the name by which the mountain was known to the Zidonians. Syriac takes it in this sense, which, however, may be a correction of the Hebrew. It is possible that this name, like Senir, may have applied to some distinct part of the Hermon Range.<P>(2) Mt. Sion.`<a href="./study/isbe/search.html?string=ZION">ZION</a>`1';
isbe[8212]='Siphmoth`sif\'-moth, sif\'-moth (siphmoth (Ginsburg), shiphamoth (Baer); Saphei): One of the cities to which David sent presents from Ziklag (<a onClick="return mV(\'1Sa\',30,28);">1Sa 30:28</a>). It occurs between Aroer and Eshtemoa, so it must have been somewhere in Southern Judah. The site has not been recovered. Zabdi the Shiphmite (<a onClick="return mV(\'1Ch\',27,27);">1Ch 27:27</a>) may quite probably have been a native of this place.``1';
isbe[8213]='Sippai`sip\'-i, si-pa\'-i.`<a href="./study/isbe/search.html?string=SAPH">SAPH</a>`1';
isbe[8214]='Sir`sur: In the Old Testament this word in <a onClick="return mV(\'Gen\',43,20);">Ge 43:20</a> the King James Version (\'adhon) is changed in the Revised Version (British and American) into "my lord." In the New Testament the word sometimes represents aner, as in <a onClick="return mV(\'Act\',7,26);">Ac 7:26</a>; <a onClick="return mV(\'Act\',14,15);">14:15</a>; <a onClick="return mV(\'Act\',19,25);">19:25</a>, etc.; more frequently kurios, "lord," as in <a onClick="return mV(\'Mat\',13,27);">Mt 13:27</a>; <a onClick="return mV(\'Mat\',21,30);">21:30</a>; <a onClick="return mV(\'Mat\',27,36);">27:36</a>; <a onClick="return mV(\'Jhn\',4,11,15,19,49);">Joh 4:11,15,19,49</a> (the Revised Version margin "lord"); <a onClick="return mV(\'Jhn\',20,15);">Joh 20:15</a>. In <a onClick="return mV(\'Rev\',7,14);">Re 7:14</a>, the Revised Version (British and American) renders "my lord."``1';
isbe[8215]='Sirach, Book of`si\'-rak, or The Wisdom of Jesus the Son of Sirach:<P><b>I. NAME</b><P><b>II. CANONICITY</b><P><b>III. CONTENTS</b><P><b>IV. TEACHING</b><P class="in15">1. Religion<P class="in15">2. Morals<P class="in15">3. Manners<P class="in15">4. Counsels of Prudence<P><b>V. LITERARY FORM</b><P><b>VI. AUTHOR</b><P class="in15">1. Jesus, Son of Sirach<P class="in15">2. Other Views<P><b>VII. UNITY AND INTEGRITY</b><P><b>VIII. DATE</b><P class="in15">1. Most Probable Views<P class="in15">2. Brief Statement of Other Views<P><b>IX. ORIGINAL LANGUAGES</b><P class="in15">1. Composed in Hebrew<P class="in15">2. Margoliouth\'s View<P><b>X. VERSIONS</b><P class="in15">1. Greek<P class="in15">2. Syriac<P class="in15">3. Latin<P class="in15">4. English<P><b>LITERATURE</b><hr /><P>Sirach is the largest and most comprehensive example of Wisdom Literature (see WISDOM LITERATURE), and it has also the distinction of being the oldest book in the Apocrypha, being indeed older than at least two books (Daniel, Esther) which have found a place in the Canon alike of the Eastern and Western churches.<P>I. Name.<P>The Hebrew copy of the book which Jerome knew bore, according to his explicit testimony (see his preface to his version of Libri Sol.), the same title as the canonical Proverbs, i.e. meshalim, "Proverbs" (Parabolae is Jerome\'s word). It is quoted in rabbinical literally, by the sing. of this name, mashal = Aramaic mathla\', but in the Talmud it is cited by the author\'s name, "Ben Sira" (ben cira\'). The Hebrew fragments found in recent years have no title attached to them. In the Greek manuscripts the heading is Sophia Iesou huiou Sirach (or Seirach), "The Wisdom of Jesus, son of Sirach" (so "A"); or simply Sophia Seirach (B), "The Wisdom of Sirach." The Fathers called it either (as Euseb., etc.) he panaretos sophia, "the all virtuous wisdom," or simply he panaretos, "the all virtuous (one)," or (Clement of Alexandria) paidagogos, "teacher." The first Hebrew and the several Greek titles describe the subject-matter, one Hebrew title (ben cira\') the author. But the Latin name Ecclesiasticus was given the book because it was one of the books allowed to be read in the Ecclesia, or church, for edification (libri ecclesiastici), though not one of the books of the Canon (libra canonici) which could be quoted in proof or disproof of doctrine. The present book is called Ecclesiasticus by way of preeminence since the time of Cyprian (Testimon. 2, etc.). The Syriac (Peshitta) title as given in the London Polyglot is "The Book of Jesus the son of Simon \'Acira\', called also the Book of the Wisdom of Baruch (= Hebrew ben, "son of") \'Acira\'." There can be no doubt that Asira (sometimes translated "bound") is but a corrupted form of Sira. For other explanations see Ryssel in Kautzsch, AT Apocrypha, 234.<P>Lagarde in his corrected text prefixes the title, "The Wisdom of Baruch = Hebrew ben, "son of") Sira." How is that the Hebrew cira\', has in the Greek become Sirach (or Seirach)? How are we to explain the final chapter in the Greek? The present writer thinks it is due to an attempt to represent in writing the guttural sound of the final letter \'aleph (\') in the Hebrew name as in the Greek Akeldamach, for the Aramaic chaqal dema\' (<a onClick="return mV(\'Act\',1,19);">Ac 1:19</a>). Dalman, however (Aramaic Grammar, 161, note 6), followed by Ryssel, holds that the final chapter is simply a sign that the word is indeclinable; compare Iosech (<a onClick="return mV(\'Luk\',3,26);">Lu 3:26</a>), for Hebrew yoce.<P>II. Canonicity.<P>Though older than both Daniel and Esther, this book was never admitted into the Jewish Canon. There are numerous quotations from it, however, in Talmudic and rabbinic literature, (see a list in Zunz, Die Gottesdiensilichen Vortrage(2), 101f; Delitzsch, Zur Geschichte der jud. Poesie, 204f; Schechter, JQR, III, 682-706; Cowley and Neubauer, The Original Hebrew of a Portion of Ecclesiasticus, xix-xxx). It is not referred to explicitly in Scripture, yet it is always cited by Jewish and Christian writers with respect and perhaps sometimes as Scripture. It forms a part of the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) of the Tridentine Council and therefore of the Romanist Canon, but the Protestant churches have never recognized it as canonical, though the bulk of modern Protestant scholars set a much higher value upon it than they do upon many books in the Protestant Canon (Chronicles, Esther, etc.). It was accepted as of canonical rank by Augustine and by the Councils of Hippo (393) and Carthage (397, 419), yet it is omitted from the lists of accepted books given by Melito (circa 180 AD), Origen, in the Apostolic Canons and in the list of the Councils of Laodicea (341 and 381). Jerome writes in Libri Sol.: "Let the church read these two books (Wisdom and Sirach) for the instruction of the people, not for establishing the authority of the dogmas of the church." It suffered in the respect of many because it was not usually connected with a great name; compare the so-called "Proverbs of Solomon." Sirach is cited or referred to frequently in the Epistle of James (<a onClick="return mV(\'Jam\',1,\'2-4\');">Jas 1:2-4</a>—compare Sirach 2:1-5; <a onClick="return mV(\'Jam\',1,5);">Jas 1:5</a>—compare Sirach 1:26; 41:22; 51:13f; <a onClick="return mV(\'Jam\',1,8);">Jas 1:8</a> ("double minded")—compare Sirach 1:28, etc.). The book is often cited in the works of the Fathers (Clement of Alexandria, Origen, Augustine, etc.) and also in the Apostolical Constitutions with the formula that introduces Scripture passages: "The Scripture says," etc. The Reformers valued Sirach highly, and parts of it have been incorporated into the Anglican Prayer-book.<P>III. Contents.<P>It is quite impossible in the book as it stands to trace any one scheme of thought, for the author\'s mind moves lightly from topic to topic, recurring frequently to the same theme and repeating not seldom the same idea. It is, however, too much to say with Sonntag (De Jesu Siracidae, etc.) that the book is a farrago of sayings with no connection, or with Berthold that the "work is but a rhapsody," for the whole is informed and controlled by one master thought, the supreme value to everyone of Wisdom. By this last the writer means the Jewish religion as conceived by enlightened Jews toward the beginning of the 2nd century BC, and as reflected in the Law of Moses (see Sirach 24:23-34), and in a less degree in the books of the Prophets and in the other writings (see Prologue). The book follows the lines of the canonical Book of Proverbs, and is made up of short pithy sayings with occasional longer discussions, largely collected but in part composed, and all informed and governed by the dominant note of the book: true Wisdom, the chief end of man. Most of the book is poetical in form, and even in the prose parts the parallelism of Hebrew poetry is found. Many unsuccessful attempts have been made to trace a definite continuous line of reasoning in the book, but the vital differences in the schemes propounded suggest what an examination of the book itself confirms, that the compiler and author put his materials together with little or no regard to logical connection, though he never loses sight of his main theme—Wisdom, the chief thing.<P>Eichhorn (Einleitung, 50ff) divides the book into three parts (Sirach 1-23; 24-42:14; 42:15-50:24), and maintains that at first each of these was a separate work, united subsequently by the author. Julian divides the work into three, Scholz into twelve, Fritzsche (Einleitung, xxxii) and Ryssel (op. cit., 240) into seven, Edershelm (op. cit., 19f) and R.G. Moulton (Modern Reader\'s Bible: Ecclus, xviff) into five portions, and many other arrangements have been proposed and defended as by Ewald, Holzmann, Bissell, Zockler, etc. That there are small independent sections, essayettes, poems, etc., was seen by the early scribes to whom the Septuagint in its present form was largely due, for they have prefixed headings to the sections beginning with the following verses: Sirach 18:30 ("Temperance of Soul"); 20:27 ("Proverbs"); 23:7 ("Discipline of the Mouth"); 24:1 ("The Praise of Wisdom"); 30:1 ("Concerning Children"); 30:14 ("Concerning Health"); 30:16 ("Concerning Foods "; this is absent from many manuscripts, though retained by Swete who, however, omits the preceding heading); 30:24 (English Versions of the Bible 33:24, "Concerning Servants"); Sirach 35 (English Versions of the Bible 32:1, "Concerning Rulers"); 44:1 ("Praise of the Fathers"); 51:1 ("The Prayer of Jesus, Son of Sirach"). Probably the whole book possessed such headings at one time, and it is quite possible that they originated in the need to guide readers after the book had become one of the chief church reading-books (so W. J. Deane ii The Expositor, II, vi, 327). These headings are given in English in the King James Version proper (in the margin), though in modern reprints, as also in the Revised Version (British and American), they are unfortunately omitted. The whole book has been arranged in headed sections by H. J. Holzmann (Bunsen\'s Bibelwerk, IX, 392ff) and by R. G. Moulton (op. cit.).<P>IV. Teaching.<P>In general it may be said that the principles enunciated in this book agree with those of the Wisdom school of Palestinian Judaism about 200 BC, though there is not a word in the book about a Messianic hope or the setting up of a Messianic kingdom. None of the views characteristic of Alexandrian Judaism and absent from the teaching of Palestinian Judaism are to be found in this book, though some of them at least are represented in Wisdom (see <a href="./study/isbe/search.html?string=WISDOM+OF+SOLOMON">WISDOM OF SOLOMON, VI</a>; <a href="./study/isbe/search.html?string=Teach;+Teacher;+Teaching">TEACHING</a>). Girorer (Milo und die jud.-alex. Philo., II, 18ff) and Dahne (Gesch. der jud.-alex. rel. Phil., II, 141ff) hold that the book contains many Alexandrian expressions and numerous statements peculiar to the Alexandrian philosophy. But apart from some late interpolations, mostly Christian, what these German scholars say is untrue, as Drummond (Philo Judaeus, I, 144ff), Deane (Expos, II, v, 334ff) and others have shown. The outstanding features of Alexandrianism are the allegorical interpretation of the Scriptures, its conception of the ecstatic vision of God, its doctrine of mediating powers between man and God and its adoption of purely Greek ideas. None of these can be traced in Sir. The Hebrews never developed a theoretical or speculative theology or philosophy: all their thinking gathered about life and conduct; the duties that men owed to God and to one another; the hopes that they cherished and the fears by which they were animated. This is the only philosophy which the Bible and the so-called Apocrypha teach, and it is seen at its highest point in the so-called <a href="./study/isbe/search.html?string=WISDOM+LITERATURE">WISDOM LITERATURE</a> (which see). The main lines of the teaching of Sirach may be set out as follows, under the three heads of religion, morals, and manners.<P>1. Religion:<P>(1) God.<P>The view of God given in this book agrees generally with that put forth by the later writers of the Old Testament from the exile (Second Isaiah, Job, etc.) onward, though the God of this book lacks the love and tenderness of the Yahweh of the Old Testament prophets. God is present everywhere (Sirach 16:17-23); He created the world as an ordered whole (Sirach 16:26-30) and made man intelligent and supreme over all flesh. The expressions used are no doubt modeled on <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a>, and it may fairly be inferred that creation out of nothing is meant. Wisdom, on the other hand, teaches the Alexandrian doctrine that matter (hule) is eternal and that the Creator\'s work consisted of fashioning, adapting and beautifying. The world is a creature of God, not (as in Philo, etc.) an emanation from Him. Yet is He compassionate and forgiving (Sirach 17:24ff). His works are past finding out (Sirach 18:2ff); but His compassion is upon all flesh (Sirach 18:13), i.e. upon all that accept His chastening and seek to do His will (Sirach 18:14). In Sirach 43:27 God is said to be "the all" (to pan), which simply means that He pervades and is the ground of everything. It is not Alexandrian pantheism that is taught. Gfrorer and others take a contrary view.<P>(2) Revelation.<P>In harmony with other products of the "Wise Men," Sirach sets chief value upon natural religion, that revealed in the instincts, reason and conscience of man as well as by the sun, moon, stars, etc. Yet Sirach gives far more prominence than Proverbs to the idea that the Divine Will is specially made known in the Law of Moses (Sirach 24:23; 45:1-4). We do not meet once with the word "law" in Ecclesiastes, nor law in the technical sense (Law of Moses) in either Job, Wisdom or Proverbs. In the last-named it is simply one of many synonyms denoting "Wisdom." In Sirach the word occurs over 20 times, not, however, always, even when the expression "Law of Moses" is used, in the sense of the "five books" (Pentateuch). It generally includes in its connotation also "the prophecies and the rest of the books" (Prologue); see Sirach 32 (Septuagint 35):24; 33 (Septuagint 36):1-3.<P>(3) Sin.<P>Sin is due to the wrong exercise of man\'s free will. Men can, if they like, keep the commandments, and when they break from them they are themselves alone to be blamed (Sirach 15:14-17). Yet it was through a woman (Eve) that sin entered the world and death by sin (Sirach 25:24; compare <a onClick="return mV(\'1Ti\',2,14);">1Ti 2:14</a>). See <a onClick="return mV(\'Rom\',5,12);">Ro 5:12</a> where "one man," strictly "human being" (<a onClick="return mV(\'Rom\',5,14);">5:14</A>, "Adam"), is made the first cause of sin. But nowhere in Sirach is the doctrine of original sin taught.<P>(4) Predestination.<P>Notwithstanding the prominence given to "free will" (see (3), above), Sirach teaches the doctrine of predestination, for God has determined that some men should be high and some low, some blessed and others cursed (33:10ff).<P>(5) Satan.<P>The word "Satan" (Satanas) in Sirach 21:27 (it occurs nowhere else in the Apocrypha) denotes one\'s own wicked heart, as the parallelism shows.<P>(6) Salvation.<P>There is no salvation except by way of good works on man\'s part (Sirach 14:16f) and forgiveness on God\'s (Sirach 17:24-32). The only atonement is through one\'s own good works (Sirach 5:5f), honoring parents (Sirach 32:14f), almsgiving, etc. (Sirach 3:30; 17:19ff). There is no objective atonement ("expiation," literally, "propitiation"; the Greek verb exilaskomai, is the great Septuagint word for the Hebrew kipper, "to atone").<P>(7) Sacrifice.<P>The sacrifice of the wicked is an abomination to God (Sirach 34:18ff), though He Himself appointed sacrifices and first-fruits (Sirach 45:20f), and when the righteous offer sacrifices to God they are accepted and remembered in the time to come (Sirach 35:1-12).<P>(8) Feasts.<P>Festivals as well as seasons are ordained by God to be observed by man (Sirach 33 (Septuagint 36):8f; compare <a onClick="return mV(\'Gen\',1,14);">Ge 1:14</a>).<P>(9) Prayer.<P>The duty of prayer is often pointed out (Sirach 37:15, etc.), the necessary preparation defined (Sirach 17:25; 18:20,23), and its successful issue promised (Sirach 35:17). There must be no vain repetitions (Sirach 7:14; compare <a onClick="return mV(\'Mat\',6,7);">Mt 6:7</a>), nor should there be any faint-heartedness in the matter (Sirach 5:10; compare <a onClick="return mV(\'Jam\',1,6);">Jas 1:6</a>). Men are to pray in sickness (Sirach 38:9), but all the same the physician should be consulted and his advice followed (Sirach 38:1f; 12ff).<P>(10) Angelology.<P>Sirach nowhere clearly expresses his belief in angels or uses language which implies such a belief. For "an angel (ho aggelos) destroyed them" the Hebrew of the original passage (<a onClick="return mV(\'2Ki\',19,35);">2Ki 19:35</a>) has maggephah, "plague," and so the Syriac, though the Septuagint (followed by the Vulgate) has "angel."<P>(11) Eschatology.<P>Nowhere in this book is the doctrine of a future life taught, and the whole teaching of the book leaves no place for such a doctrine. Men will be indeed rewarded or punished according to their conduct, but in this world (see Sirach 2:10f; 9:12; 11:26f). The retribution is, however, not confined to the individuals in their lifetime; it extends to their children and involves their own glorious or inglorious name after death (see Sirach 11:28; 40:15; 41:6; 44:11-13). The passage concerning Gehenna (Sirach 7:17) is undoubtedly spurious and is lacking in the Syriac, Ethiopic, etc. Since the book is silent as to a future life, it is of necessity silent on the question of a resurrection. Nothing is hinted as to a life beyond the grave, even in Sirach 41:1-4, where the author deprecates the fear of death. In these matters Sirach agrees with the Pentateuch and the prophetic and poetical books of the Old Testament (Psalms, Job, etc.), none of which give any intimation of a life beyond the grave. Little or nothing is said of the Messianic hope which must have been entertained largely by Palestinian Jews living in the author\'s time, though in Sirach 36 (Septuagint 33):1-17 the writer prays for the restoration of Israel and Jerusalem, i.e. R.H. Charles thinks (Eschatology, etc., 65), for the bringing in of the Messianic kingdom.<P>(12) Sirach\'s Doctrine of Wisdom.<P>For a general discussion of the rise and development of the conception of Wisdom in the Old Testament and in the Apocrypha see <a href="./study/isbe/search.html?string=WISDOM+LITERATURE">WISDOM LITERATURE</a>. A brief statement as to what the word implies in Sirach is all that can here be attempted. It is in chapters 1 and 24 that Ben Sira\'s doctrine is chiefly contained.<P>Wisdom is from God: He created it and it must therefore have a separate existence. Yet it is dependent on Him. It is omnipresent, though it dwells in a peculiar sense with all flesh. The root and beginning of Wisdom, its fullness and crown, are the fear of God (Sirach 1:14,16,18,21); so that only the obedient and pious possess it (Sirach 1:10,26); indeed Wisdom is identified with the fear of the Lord and the observance of the Law (Sirach 19:20); it is even made one with the Law of Moses (Sirach 24:23), i.e. it consists of practical principles, of precepts regulating the life. In this doctrine we have a combination of universalism, principles of reason and Jewish particularism as the teaching of the revealed Law. We have the first in Sirach 24:3-21; the second in 24:23-34. Have we in this chapter, as in Proverbs, nothing outside the teaching of Palestinian Judaism? Gfrorer (op. cit., II, 18ff) denies this, maintaining that the whole of Sirach 24 was written by an Alexandrian Jew and adopted unchanged by Ben Sira. But what is there in this chapter which an orthodox, well-informed Palestinian Jew of Ben Sira\'s time might not well have written? It is quite another question whether this whole conception of Wisdom in the so-called Wisdom books is not due, in some measure, to Greek, though not Alexandrian, influence, unless indeed the Greek influence came by way of Alexandria. In the philosophy of Socrates, and in a less exclusive sense in that of Plato and Aristotle, the good man is the wise one. Cheyne (Job and Solomon, 190) goes probably too far when he says, "By Greek philosophy Sirach, as far as we can see, was wholly uninfluenced."<P>2. Morals:<P>The ethical principle of Sirach is Hedonism or individual utilitarianism, as is that of Proverbs and the Old Testament generally, though in the Psalms and in the prophetical writings gratitude to God for the love He has shown and the kind acts He has performed is the basis of endless appeals and vows. Moreover, the individual point of view is reached only in the late parts of the Old Testament. In the older Old Testament books, as in Plato, etc., it is the state that constitutes the unit, not the individual human being. The rewards and penalties of conduct, good and bad, belong to this present world. See what is said in (11) "Eschatology," above; see also Sirach 2:7f; 11:17; 16:6f; 40:13f; etc.<P>The hedonistic principle is carried so far that we are urged to help the good because they are most likely to prove serviceable to us (Sirach 12:2); to aid our fellow-man in distress, so that in his days of prosperity he may be our friend (Sirach 22:23); contrast the teaching of Jesus Christ (<a onClick="return mV(\'Luk\',6,\'30-36\');">Lu 6:30-36</a>). Friends are to be bemoaned for appearance\' sake (Sirach 38:17). Yet many of the precepts are lofty. We are exhorted to show kindness and forbearance to the poor and to give help to our fellow-man (Sirach 29:8,20); to give alms (Sirach 12:3); speak kindly (Sirach 18:15-18); masters should treat servants as brethren, nay as they would themselves be treated (Sirach 7:20-22; 33:30f); parents should give heed to the proper training of their children (Sirach 3:2; 7:23; 30:1-13); and children ought to respect and obey their parents (Sirach 3:1-16). It is men\'s duty to defend the truth and to fight for it. So shall the Lord fight for them (Sirach 4:25,28). Pride is denounced (Sirach 10:2ff), and humility (Sirach 3:18), as well as forgiveness (Sirach 28:2), commended.<P>3. Manners:<P>Sirach is as much a code of etiquette as one of ethics, the motive being almost invariably the individual\'s own good. Far more attention is given to "manners" in Sirach than in Proverbs, owing to the fact that a more complex and artificial state of society had arisen in Palestine. When one is invited to a banquet he is not to show greed or to be too forward in helping himself to the good things provided. He is to be the first to leave and not to be insatiable (Sirach 31:12-18). Moderation in eating is necessary for health as well as for appearance\' sake (Sirach 31:19-22). Mourning for the dead is a social propriety, and it should on that account be carefully carried out, since failure to do this brings bad repute (Sirach 38:16f). It is quite wrong to stand in front of people\'s doors, peeping and listening: only fools do this (Sirach 21:23f). Music and wine are praised: nay even a "concert of music" and a "banquet of wine" are good in their season and in moderation (Sirach 32 (Septuagint 35):5f). The author has not a high opinion of woman (Sirach 25:13). A man is to be on his strict guard against singing and dancing girls and harlots, and adultery is an evil to be feared and avoided (Sirach 36:18-26). From a woman sin began, and it is through her that we all die (Sirach 25:4). Yet no one has used more eulogistic terms in praising the good wife than Ben Sira (Sirach 26:1ff), or in extolling the happiness of the home when the husband and wife "walk together in agreement" (Sirach 25:1).<P>4. Counsels of Prudence:<P>Never lend money to a man more powerful than thyself or thou wilt probably lose it (Sirach 8:12). It is unwise to become surety for another (Sirach 29:18; 8:13), yet for a good man one would become surety (Sirach 29:14) and he would even lend to him (Sirach 29:1ff). It should be remembered that in those times lending and becoming financially liable were acts of kindness, pure and simple: the Jewish Law forbade the taking of interest in any form (see Century Bible, "Ezra," etc., 198). "A slip on, a pavement is better than a slip with the tongue," so guard thy mouth (Sirach 20:18); "He that is wise in words shall advance himself; and one that is prudent will please great men" (Sirach 20:27). The writer has the pride of his class, for he thinks the common untrained mind, that of the plowman, carpenter and the like, has little capacity for dealing with problems of the intellect (Sirach 38:24-34).<P>V. Literary Form.<P>The bulk of the book is poetical in form, abounding in that parallelism which characterizes Hebrew poetry, though it is less antithetic and regular than in Prov. No definite meter has been discovered, though Bickell, Margoliouth and others maintain the contrary (see <a href="./study/isbe/search.html?string=POETRY,+HEBREW">POETRY, HEBREW</a>). Even in the prose parts parallelism is found. The only strophic arrangement is that suggested by similarity of subject-matter.<P>Bickell (Zeitschr. far katholische Theol., 1882) translated Sirach 51:1-20 back into Hebrew and tried to prove that it is an alphabetic acrostic psalm, and Taylor supports this view by an examination of the lately discovered fragments of the Hebrew text (see The Wisdom of Ben Sira, etc., by S. Schechter and C. Taylor, lxxixff). After Sirach 51:12 of the Greek and other versions the Hebrew has a psalm of 15 verses closely resembling <a onClick="return mV(\'Psa\',136,\'1-\');">Ps 136</a>; but the Hebrew version of Sirach 51:1-20 does not favor Bickell\'s view, nor does the ps, found only in the Hebrew, lend much support to what either Bickell or Taylor says. Space precludes detailed proofs.<P>VI. Author.<P>1. Jesus, Son of Sirach:<P>The proper name of the author was Jesus (Jeshua, Greek Iesous(?)), the family name being "Ben Sira." The full name would be therefore "Jesus Ben Sirs." In the Talmud and other Jewish writings he is known as "Ben Sira," literally, "son (or descendant?) of Sira." Who Sira was is unknown. No other book in the Apocrypha gives the name of its author as the Prologue to Sirach does. In the best Greek manuscripts (Vaticanus, Sinaiticus, Alexandrinus) of Sirach 50:27, the author\'s name appears as \'Iesous huios Seirach Eleazar ho Hierosolumeites, "Jesus the son of Sirach (son of) Eleazar the Jerusalemite." For the last two words Codex Sinaiticus has by a copyist\'s error, ho hiereus ho Solumeites, "the Solomon-like priest." The Hebrew text of Sirach 50:27 and 51:30 gives the following genealogy: Simeon son of Jesus, son of Eleazar, son of Sira, making the author the grandson and not the son of Sira, and so he is called by Saadia; see HDB (Nestle) and EB, II, 1165 (Toy). We know nothing of Ben Sira beyond what can be gathered from the book itself. He was a resident in Palestine (24:10f), an orthodox Jew, well read in at least Jewish literature, a shrewd observer of life, with a philosophical bent, though true to the national faith. He had traveled far and seen much (34:11f). His interests were too general and his outlook too wide to allow of his being either a priest or a scribe.<P>2. Other Views:<P>Many suppositions have been put forward as to the author\'s identity.<P>(1) That the Author Was a Priest:<P>So in Codex Sinaiticus (Sirach 50:27). In Sirach 7:29-31 he speaks much of the priesthood, and there are numerous references to sacrifices in the book. In 45:6-26 he has a long poem in praise of Aaron and his high-priesthood. Yet on the whole Ben Sira does not write as a priest.<P>(2) That He Was a High Priest:<P>So Syncellus (Chronicles, edition Dindf., 1 525) through a misunderstanding of a passage in Eusebius. But the teaching and temper of the book make this supposition more improbable than the last.<P>(3) That He Was a Physician:<P>An inference drawn from Sirach 38:1f; 12ff and other references to the professional healer of the body (10:10). But this is a very small foundation on which to build so great an edifice.<P>(4) That He Was One of the 72 Translators (Septuagint):<P>So Lapide (Comm.), Calmer, Goldhager, a wholly unsupported hypothesis.<P>(5) No One of Course Believes that Solomon Wrote the Book:<P>Though many of the early Fathers held that he was the author of the five Wisdom Books—Proverbs, Ecclesiastes, Canticles, Sirach and Wisdom.<P>VII. Unity and Intergrity.<P>There is, on the whole, such a uniformity in the style and teaching of the book that most scholars agree in ascribing the whole book (except, the Prologue, which is the work of the translator) to Ben Sira. This does not mean that he composed every line; he must have adopted current sayings, written and oral, and this will account for the apparent contradictions, as about becoming surety (Sirach 29:14), and refusing to become surety (Sirach 8:13; 29:18); words in praise (Sirach 25:1; 26:1ff) and condemnation of women (Sirach 25:4,13; 36:18-26); the varying estimates of life (Sirach 36:16-35; 40:1-11), etc. But in these seeming opposites we have probably no more than complementary principles, the whole making up the complete truth. Nothing is more manifest in the book than the all-pervading thought of one dominant mind. Some have denied the genuineness of Sirach 51, but the evidence is at least indecisive. There is nothing in this chapter inconsistent with the rest of the book.<P>In the recently discovered fragments of Hebrew text there is a psalm between Sirach 51:12 and 13 of the Greek and English Versions of the Bible which seems a copy of <a onClick="return mV(\'Psa\',136,\'1-\');">Ps 136</a>. It is absent from the versions and its genuineness is doubtful. But in both the Hebrew and Greek texts there are undoubted additions and omissions. There are, in the Greek, frequent glosses by Christian editors or copyists and other changes (by the translators?) in the direction of Alexandrian Judaism; see Speaker\'s Apocrypha and other commentaries for details.<P>VIII. Date.<P>In the book itself there is one mark of definite date (Sirach 50:1), and in the Prologue there is another. Unfortunately both are ambiguous. In the Prologue the translator, whose grandfather or ancestor (Greek pappos) wrote the book (the younger Siracides, as he is called), says that he reached Egypt, where he found and translated this book in the reign of Euergetes, king of Egypt. But there were two Egyptian kings called Euergetes, namely, Ptolemy Euergetes, or Euergetes I (247-222 BC), and Ptolemy VII Physcon, or Euergetes II (218-198 BC). Sirach 50:1 mentions, among the great men whom he praises, Simon the high priest, son of Onias, who is named last in the list and lived probably near the time of the elder Siracidess. But there were two high priests called Simon and each of them was a son of Onias, namely, Simon I, son of Onias I (circa 310-290 BC), and Simon II, son of Onias II (circa 218-198 BC). Scholars differ as to which Euergetes is meant in the Prologue and which Simon in 50:1.<P>1. Most Probable Views:<P>The conclusions to which the evidence has brought the present writer are these: (1) that Simon I (died 290 BC) is the high priest meant; (2) that Ptolemy VII Physcon (218-198 BC) is the Euergetes meant.<P>(1) In Favor of the First Proposition Are the Following:<P>(a) The book must have been written some time after the death of Simon, for in the meantime an artificial fame had gathered around the name, and the very allusion to him as a hero of the past makes it clear that he had been long dead. Assuming that Simon had died in 290 BC, as seems likely, it is a reasonable conclusion that the original Hebrew work was composed somewhat later than 250 BC. If Simon II is the man intended, the book could hardly have been composed before 150 BC, an impossible date; see below.<P>(b) In the list of great men in Sirach 44-50 the praises of Simon (50:1ff) are sung after those of Nehemiah (Sirach 49:13), suggesting that the space of time between them was not very great.<P>(c) The "Simon the Just" of Josephus was certainly Simon I, he being so called, this Jewish historian says (Ant., XII, ii, 5), on account of his piety and kindness.<P>(d) It is probable that the "Simon the Just" of the Mishna (\'Abhoth i.2) is also Simon I, though this is not certain. It is said of him that he was one of the last members of the great synagogue and in the Talmud he is the hero of many glorifying legends. The so-called great synagogue never really existed, but the date assigned to it in Jewish tradition shows that it is Simon I that is thought of.<P>(e) In the Syriac version (Pesh) Sirach 50:23 reads thus: "Let it (peace) be established with Simon the Just," etc. Some manuscripts have "Simon the Kind." This text may of course be wrong, but Graetz and Edersheim support it. This is the exact title given to Simon I by Josephus (op. cit.), the Mishna and by Jewish tradition generally.<P>(f) The only references to Simon II in Jewish history and tradition depict him in an unfavorable light. In 2Macc 3 he is the betrayer of the temple to the Syrians. Even if the incident of the above chapter were unhistorical, there must have been some basis for the legend. Josephus (Ant., XII, iv, 10f) makes him side with the sons of Tobias against Hyrcanus, son of Joseph, the wrong side from the orthodox Jewish point of view.<P>(g) The high priest Simon is said (Sirach 50:1-13) to have repaired the temple and fortified the city. Edersheim says that the temple and city stood in need of what is here described in the time of Simon I, but not in the time of Simon II, for Ptolemy I (247-222 BC) in his wars with Demetrius destroyed many fortifications in Palestine to prevent their falling into the hands of the enemy, among which Acco, Joppa, Gaza are named, and it is natural to think that the capital and its sanctuary were included. This is, however, but a priori reasoning, and Derenbourg argues that Simon II must be meant, since according to Josephus (Ant., XII, iii, 3) Antiochus the Great (223-187 BC) wrote a letter in which he undertakes that the city and temple of Jerusalem shall be fully restored. This is not, however, to say that Simon II or anyone else did, at that time, restore either.<P>(h) Of the numerous errors in the Greek text some at least seem due to the fact that the version in that language was made so long after the composition of the original Hebrew that the sense of several Hebrew words had become lost among the Alexandrian Jews. If we assume that the Simon of chapter 50 was Simon I (died 290 BC), so that the Hebrew work was composed about 250 BC; if we further assume that the Euergetes of the Prologue was Ptolemy VII (died 198 BC), there is a reasonable space of time to allow the sense of the Hebrew to be lost in many instances (see Halevy, Revue semitique, July, 1899). It must be admitted that there is no decisive evidence on one side or the other, but the balance weighs in favor of Simon I in the opinion of the present writer.<P>(2) Euergetes of the Prologue:<P>That the Euergetes of the Prologue in whose reign the translation was made must have been Ptolemy VII Physcon, Euergetes II, seems proved by the translator\'s statement that he came to Egypt in the 38th year, epi tou Euergetou basileos, i.e. almost certainly of the reign of Euergetes, for what reason could the younger Siracides have for giving his own age? Now Euergetes I reigned but 25 years, but Euergetes II (Physcon) reigned in all 54 years, from 170 to 145 BC as regent with his father, and from 145 to 116 BC as sole monarch. If we accept this interpretation of the above words, the question is settled. Westcott, however (DB,1863, I, 479, note c), says "the words can only mean that the translator in his 38th year came to Egypt during the reign of Euergetes." The other rendering adopted by Eichhorn is, he adds, "absolutely set at variance with the grammatical structure of the sentence." In the second edition of DB (1893) this note has become expunged, and the article as edited by D.S. Margoliouth (I, 841) teaches the contrary view, which is now accepted by nearly all scholars (Schurer, etc.). We may therefore assume that the original Hebrew book was composed about 240-200 BC, or some 50 or more years after the death of Simon I, and that the translation was made about 130 BC, for the younger Siracides came to Egypt in 132 BC, and he gives us to understand in the Prologue that he translated the Hebrew work of his grandfather almost immediately after reaching that country. If Simon II (died 198 BC) is meant in Sirach 50, we are compelled to assume a date for the original work of about 150 BC in order to allow time for the growth of the halo of legend which had gathered about Simon. The translation must, in that case, have been completed some 20 years after the composition of the Hebrew, a conclusion which the evidence opposes. The teaching of the book belongs to 200 BC, or slightly earlier. The doctrine of the resurrection taught in Daniel (165 BC) is ignored in Sirach, as it has not yet become Jewish doctrine.<P>2. Brief Statement of Other Views:<P>(1) That the Euergetes of the Prologue and the Simon of chapter 50 are in both cases the first so called. So Hug, Scholz, Welt, Keil, Edersheim (Speaker\'s Apocrypha) and many others. The book was accordingly written after 290 BC, perhaps in 250 BC, or later, and the translation was made some time after 220 BC, say 200 BC.<P>(2) That Euergetes II (died 116 BC) and Simon II (died 198 BC) are the two persons referred to. So Eichhorn, De Wette, Ewald, Franz Delitzsch, Hitzig, Schurer.<P>(3) Hitzig (Psalms,1836,II, 118) made the original work a product of the Maccabean period—an impossible supposition, for the book says nothing at all about the Maccabees. Moreover, the priestly house of Zadok is praised in this book (Sirach 50, etc.); it was held in little respect during the time of the Maccabean wars, owing to the sympathy it showed toward the Hellenizing party.<P>IX. Original Languages.<P>1. Composed in Hebrew:<P>Even before the discovery of the substantial fragments of what is probably the original Hebrew text of this book, nearly all scholars had reached the conclusion that Sirach was composed in Hebrew.<P>(1) The fact of a Hebrew original is definitely stated in the Prologue.<P>(2) Jerome (Praef. in vers. libri Sol.) says that he had seen the Hebrew original—the same text probably that underlies the fragments recently published, though we cannot be sure of this.<P>(3) Citations apparently from the same Hebrew text are made not seldom in Talmudic and rabbinical literature.<P>(4) There are some word-plays in the book which in the Greek are lost, but which reappear in the discovered Hebrew text, e.g. (Sirach 43:8) ho men kata to onoma autes estin auxanomene (read ananeomene), "the month is called after her name," chodhesh kishemo hu\' mitchadhes, "the moon according to its name renews itself"; the Hebrew words for "moon" and "renews itself" come from one root, as if we said in English—what of course is not English—"the moon moons itself."<P>There are other cases where mistakes and omissions in the Greek are explained by a reference to the newly found Hebrew text C, or some 50 or more years after the death of Simon I, and that the translation was made about 130 BC, for the younger Siracides came to Egypt in 132 BC, and he gives us to understand in the Prologue that he translated the Hebrew work of his grandfather almost immediately after reaching that country. If Simon II (died 198 BC) is meant in Sirach 50, we are compelled to assume a date for the original work of about 150 BC in order to allow time for the growth of the halo of legend which had gathered about Simon. The translation must, in that case, have been completed some 20 years after the composition of the Hebrew, a conclusion which the evidence opposes. The teaching of the book belongs to 200 BC, or slightly earlier. The doctrine of the resurrection taught in Daniel (165 BC) is ignored in Sirach, as it has not yet become Jewish doctrine.<P>The strongly supported conjecture of former years that the book was composed in Hebrew was turned into a practical certainty through the discovery, by Dr. S. Schechter and others in 1896 and after, of the fragments of a (probably the) Hebrew text called now A B C and D. These contain much over half the whole book, and that the text in them, nearly always identical when the same passages are given in more than one, is the original one, is exceedingly likely, to say the least.<P>2. Margoliouth\'s View:<P>D. S. Margoliouth (Origin of the Original Hebrew of Ecclesiasticus, 1899) has tried to prove that the Hebrew text of the fragments is a translation of a Persian version which is itself derived from Greek and Syriac. The proofs he offers have not convinced scholars.<P>(1) He refers to words in Hebrew which in that language are senseless, and he endeavors to show that they are disguised Persian words. As a matter of fact, in such cases the copyist has gone wholly wrong or the word is undecipherable.<P>(2) There do appear to be Persian glosses, but they are no part of the original text, and there can be no reasonable doubt that they are due to a Persian reader or copyist.<P>(3) There are many cases in which the Hebrew can be proved to be a better and older text than the Greek or Syriac (see Konig, The Expository Times, XI, 170ff).<P>(4) As regards the character of the language, it may be said that in syntax it agrees in the main with the classical Hebrew of the Old Testament, but its vocabulary links it with the latest Old Testament books. Thus we have the use of the "waw-consecutive" with the imperfect (Sirach 43:23; 44:9,23; 45:2f; etc.) and with the perfect (Sirach 42:1,8,11), though the use of the simple waw with both tenses occurs also. This mixed usage is exactly what meets us in the latest part of the Old Testament (Ecclesiastes, Esther, etc.). As regards vocabulary, the word chephets, has the sense of "thing," "matter," in Sirach 20:9, as in <a onClick="return mV(\'Ecc\',3,1);">Ec 3:1</a>; <a onClick="return mV(\'Ecc\',5,7);">5:7</a>; <a onClick="return mV(\'Ecc\',8,6);">8:6</a>. In general it may be said that the Hebrew is that of early post-Biblical times. Margoliouth holds that the extant Hebrew version is no older than the 11th century, which is impossible. His mistake is due to confounding the age of the manuscripts with that of the version they contain.<P>(5) It is nevertheless admitted that in some cases the Syriac or the Greek or both together preserve an older and correcter text than the Hebrew, but this because the latter has sometimes been miscopied and intentionally changed.<P>(6) The numerous Hebraisms in the Greek version which in the Hebrew have their original expression point to the same conclusion—that this Hebrew text is the original form of the book.<P>Margoliouth has been answered by Smend (TLZ,1889, col. 506), Konig (Expository Times, X, XI, 1899-1900), Noldeke (ZATW, XX, 81-94), and by many others. Bickell (Zeitschrift fur katholische Theol., III, 387ff) holds also that the Hebrew Sirach extant is a translation from the Greek or Syriac or both.<P>X. Versions.<P>1. Greek:<P>The Septuagint translation was made from the Hebrew direct; it is fairly correct, though in all the extant manuscripts the text is very corrupt in several places. (1) The book occurs in the uncials Vaticanus, Sinaiticus, Ephraemi, and part of Alexandrinus fairly free from glosses, though abounding in obvious errors.<P>(2) The text is found in a much purer form in Codex Venetus and also in Codex Sinaiticus (ca) and part of Codex Alexandrinus.<P>All extant Greek manuscripts except the late cursive 248 seem to go back to one original MS, since in all of them the two sections Sirach 30:25-33:15 and 33:16-36:11 have changed places, so that 33:16-36:11 follows 30:24 and 30:25-33:15 comes after 36:11. Most scholars accept the explanation of Fritzsche (Exeg. Handbuch zu den Apok, V, 21f) that the two leaves on which these two parts (of similar size) were written got mixed, the wrong one being put first. On the other hand, the cursive 248 (14th century) has these sections in their proper order, and the same is true of the Syriac (Peshitta), Latin and Armenian versions and of the Greek version of the Complutensian Polyglot (which follows throughout 248 and not the uncials) and English Versions of the Bible which is made from this Polyglot. The superiority of 248 to the older manuscript (B S A C V) is seen in other parts of the Greek text. In the other Greek manuscripts, Sirach 3:25 is omitted, as it is by Edersheim and most commentators before the discovery of the Hebrew text. But this last supports 248 in retaining the verse, and it is now generally kept. In 43:23 "islands" is properly read by 248, Vulgate, Syriac, 23 and the Hebrew, but older Greek manuscripts read "Jesus," making nonsense ("And Jesus planted her" [auten] for "he planted islands therein"). The other manuscripts have a text which yields no sense in 43:26: English Versions of the Bible "By reason of him his end hath success." The Greek of 248 and the Hebrew give this sense: "The angel is equipped for his task," etc.<P>2. Syriac:<P>The Syriac (Peshitta) version is now almost universally acknowledged to have been made from the Hebrew, of which, on the whole, it is a faithful rendering. In some places, however, it agrees with the Septuagint against the Hebrew, probably under the influence of the inaccurate idea that the Greek text is the original one. In this version the two sections Sirach 30:25-33:5 and 33:16-36:11 are in proper order, as in the Hebrew, a fresh proof that the Syriac is not translated from the Greek<P>3. Latin:<P>The Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) agrees with the Old Latin which follows the Septuagint closely. Lapide, Sabatier and Bengel tried to prove that the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) was based on the lost original Hebrew, but the evidence they supply falls far short of proof, and recently discovered Hebrew fragments show that they were wrong. The two sections transposed in the Septuagint (except 248) are also transposed in the Latin, showing that the latter is based on the Greek text. The Latin text of both Sirach and Wisdom according to the codex Amiant is given by Lagarde in his Mittheilungen, I, 243-84. This closely follows the Greek text.<P>4. English:<P>The King James Version follows the cursives and often repeats their errors. the Revised Version (British and American) is based, for the most part, on the uncials and thus often departs from the Hebrew. Sirach 3:19 is retained by the King James Version but omitted by the Revised Version (British and American). For the latter clause of the verse ("mysteries are revealed unto the meek"), the King James Version is supported by codex 248, the Syriac and the Hebrew. Both English Versions of the Bible should be corrected by the Hebrew in Sirach 7:26 and 38:1,15.<P>For fuller details concerning versions see Speaker\'s Apocrypha, II, 23-32 (Edersheim); Kautzsch, Die Apok. des Altes Testament, I, 242ff (Ryssel), and the article by Nestle in HDB, IV, 544ff.<P>LITERATURE.<P>In addition to books mentioned under Apocrypha and in the course of the present article, note the following:<P>(1) The Text of the Hebrew Fragments:<P>For accounts of the discovery and decipherments of these see HDB, IV, 546f (Nestle); Bible Polyglotte (F. Vigoureux), V, 4ff; Schurer GJ V4, III, 221ff. The text of the Hebrew as yet known is conveniently printed in the following: H. L. Strack, Die Spruche Jesus, etc. (with notes and glossary), Leipzig, 1903; Isaac Levi, The Hebrew Text of Ecclesiasticus (with notes and glossary), Leiden, 1906; Rudolf Smend, Die Weisheit des Jesus Sirach, Hebrew und Deutsch (with notes and glossary), Berlin, 1906. The Hebrew appears also in the Bible Polyglotte, edition F. Vigoureux, with the Septuagint, Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) and a French translation in parallel columns. (No other Polyglot has appeared since the discovery of the Hebrew.) There are parallel texts in Hebrew, Syriac, Greek and English, and also useful notes and tables in The Original Hebrew of Sirach 39:15-49:11, by Cowles and Neubauer, Oxford, 1897. Still later and fuller is The Wisdom of Ben Sira in Hebrew and English, with notes on the Hebrew by Schechter and Taylor, Cambridge, 1899.<P>(2) Commentaries:<P>The works of Fritzsche (1859), who neglects the evidence of the Syriac and ignores the Hebrew idioms in the book, and of Bissell (1880) and Edersheim (1888) appeared before the discovery of the Hebrew fragments. The last-named shows both learning and ingenuity in tracking the Hebrew idioms and in explaining difficulties by means of Hebrew. The following commentaries take full note of the Hebrew text as far as discovered: Israel Levi, L\'Ecclesiastique ou la sagesse de Jesus fils de Sira: traduit et commente, Paris,1898,1901; Ryssel in Kautzsch\'s Apok. des Altes Testament, I, 280-475, exceedingly valuable, especially for the text and introduction, but he takes account of the Hebrew fragments published by Cowley and Neubauer only in this book. To complete his treatment of the Hebrew parts published after he wrote, see further articles by him in Stud. u. Krit., 1900-1-2; Knabenbaur, Commentarius in Ecclesiasticum, Paris, 1902; Peters, Der jungst wieder aufgefundene hebraische Text des Buches Ecclesiasticus, 1902 (compare the notice by Smend, Theologische Literaturzeitung,1903,72-77); Smend, Die Weisheit des Jesus Sirach erklart, 1906 (full discussion of the book in the newest light; compare notice by Julicher in TLZ,1908,323-29). The New Oxford Apocrypha (Introduction and Notes), edition by R. H. Charles (1913), contains a full Introduction and Commentary. J. H. A. Hart has published separately a critical edition of codex 248, in which he collates the principal authorities, manuscript and printed.<P>(3) Dictionaries:<P>Of the Dict. articles those in HDB (Nestle, strong in the critical, but weak and defective on the historical and exegetical side); Encyclopedia Biblica (C. H. Toy, sound and well balanced); see also Jewish Encyclopedia (Israel Levi) and Encyclopedia Britannica (11th edition) (W. Baxendale). For detailed register of the literature see HDB (Nestle); Jewish Encyclopedia, "Sirach" (Israel Levi); and especially Schurer, GJ V4, III, 219ff.``33';
isbe[8216]='Sirach, the Alphabet of`Usually called The Alphabet of Ben Sira. The compilation so designated consists of two lists of proverbs, 22 in Aramaic and 22 in Hebrew, arranged in each case as alphabet acrostics. Each of these proverbs is followed by a haggadic comm., with legends and tales, many of them indecent. Some of the proverbs in the Alphabets are probably genuine compositions by Ben Sira and are quoted as such in the Talmud, but in their present form the Alphabets are at least as late as the 11th century AD.<P>LITERATURE.<P>The only complete copy of the text known is in the British Museum, the copy in the Bodleian being defective. Steinschneider has published a reprint of this last with critical notes (Alphabeticum Syracidis, Berlin, 1854). Cowley and Neubauer (The Original Hebrew of a Portion of Ecclesiasticus), besides giving a general account of this work, add a translation into English of the Aramaic proverbs. In his brief but excellent articles in the Jewish Encyclopedia (Ben Sira, The Alphabet of), Dr. Louis Ginzberg (New York) also gives a translation of the 22 Aramaic proverbs with useful remarks after each. The work has been translated into Latin, Yiddish (often), Judeo-Spanish, French and German, but never, so far, completely into English.``33';
