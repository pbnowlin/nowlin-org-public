isbe[8255]='Smoke`smok: Used figuratively of the divine jealousy (<a onClick="return mV(\'Deu\',29,20);">De 29:20</a>) and anger (<a onClick="return mV(\'Psa\',74,1);">Ps 74:1</a>); symbolic of the glory of the divine holiness (<a onClick="return mV(\'Isa\',4,5);">Isa 4:5</a>; <a onClick="return mV(\'Isa\',6,4);">6:4</a>; <a onClick="return mV(\'Rev\',15,8);">Re 15:8</a>).``1';
isbe[8256]='Smyrna`smur\'-na (Smurna):<P>1. Ancient:<P>Smyrna, a large ancient city on the western coast of Asia Minor, at the head of a gulf which reaches 30 miles inland, was originally peopled by the Asiatics known as the Lelages. The city seems to have been taken from the Lelages by the Aeolian Greeks about 1100 BC; there still remain traces of the cyclopean masonry of that early time. In 688 BC it passed into the possession of the Ionian Greeks and was made one of the cities of the Ionian confederacy, but in 627 BC it was taken by the Lydians. During the years 301 to 281 BC, Lysimachus entirely rebuilt it on a new site to the Southwest of the earlier cities, and surrounded it by a wall. Standing, as it did, upon a good harbor, at the head of one of the chief highways to the interior, it early became a great trading-center and the chief port for the export trade. In Roman times, Smyrna was considered the most brilliant city of Asia Minor, successfully rivaling Pergamos and Ephesus. Its streets were wide and paved. Its system of coinage was old, and now about the city coins of every period are found. It was celebrated for its schools of science and medicine, and for its handsome buildings. Among them was the Homerium, for Smyrna was one of several places which claimed to be the birthplace of the poet. On the slope of Mt. Pagus was a theater which seated 20,000 spectators. In the 23 AD year a temple was built in honor of Tiberius and his mother Julia, and the Golden Street, connecting the temples of Zeus and Cybele, is said to have been the best in any ancient city. Smyrna early became a Christian city, for there was one of the Seven Churches of the Book of Revelation (<a onClick="return mV(\'Rev\',2,\'8-11\');">2:8-11</a>). There Polycarp, the bishop of Smyrna, was martyred, though without the sanction of the Roman government. It seems that the Jews of Smyrna were more antagonistic than were the Romans to the spread of Christianity, for it is said that even on Saturday, their sacred day, they brought wood for the fire in which Polycarp was burned. His grave is still shown in a cemetery there. Like many other cities of Asia Minor, Smyrna suffered frequently, especially during the years 178-80 AD, from earthquakes, but it always escaped entire destruction. During the Middle Ages the city was the scene of many struggles, the most fierce of which was directed by Timur against the Christians. Tradition relates that there he built a tower, using as stones the heads of a thousand captives which he put to death, yet Smyrna was the last of the Christian cities to hold out against the Mohammedans; in 1424 it fell into the hands of the Turks. It was the discovery of America and the resulting discovery of a sea route to India which ruined the Smyrna trade.<P>2. Modern:<P>Modern Smyrna is still the largest city in Asia Minor, with a population of about 250,000, of whom half are Greek and less than one-fourth are Mohammedans. Its modern name, Ismir, is but a Turkish corruption of the ancient name. Even under the Turkish government the city is progressive, and is the capital of the Aidin vilayet, and therefore the home of a governor. Several railroads follow the courses of the ancient routes into the distant interior. In its harbor ships from all parts of the world may be seen. The ancient harbor of Paul\'s time has been filled in, and there the modern bazaars stand. The old stadium has been destroyed to make room for modern buildings, and a large part of the ancient city lies buried beneath the modern houses and the 40 mosques of which the city boasts. The better of the modern buildings, belonging to the government and occupied by the foreign consuls, stand along the modern quay. Traces of the ancient walls are still to be found. West of Mt. Pagus is the Ephesian gate, and the Black-gate, as the Turks call it, is near the railroad station. The castle upon Mt. Pagus, 460 ft. above the sea, dates from Byzantine times. The prosperity of Smyrna is due, not only to the harbor and the port of entry to the interior, but partly to the perfect climate of spring and autumn—the winters are cold and the summers are hot; and also to the fertility of the surrounding country. Figs, grapes, valonia, opium, sponges, cotton and liquorice root are among the chief articles of trade.`<a href="./study/isbe/search.html?string=CHURCHES,+SEVEN">CHURCHES, SEVEN</a>`7';
isbe[8257]='Snail`snal<P>(1) chomet, the Revised Version (British and American) "sand-lizard," Septuagint saura, "lizard" (<a onClick="return mV(\'Lev\',11,30);">Le 11:30</a>);<P>(2) shabbelul, Septuagint keros, "wax" (<a onClick="return mV(\'Psa\',58,8);">Ps 58:8</a>)):<P>(1) Chomet is 7th in the list of unclean "creeping things" in <a onClick="return mV(\'Lev\',11,30);">Le 11:30</a>, and occurs nowhere else. "Snail" is not warranted by Septuagint or Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) the Revised Version (British and American) has "sand-lizard." It may be the skink or a species of Lacerta. See <a href="./study/isbe/search.html?string=LIZARD">LIZARD</a>.<P>(2) Shabbelul is translated "snail" in <a onClick="return mV(\'Psa\',58,8);">Ps 58:8</a>: "Let them be as a snail which melteth and passeth away." Mandelkern gives limax, "slug."<P>Gesenius derives shabbelul from balal, "to pour"; compare Arabic balla, "to wet," instancing leimax, "snail," or "slug," from leibo, "to pour." While Septuagint has keros, "wax," Talmud (Mo\'edh Qatan 6b) supports "snail." The ordinary explanation of the passage, which is not very satisfying, is that the snail leaves a trail of mucus (i.e. it melts) as it moves along. This does not in any way cause the snail to waste away, because its glands are continually manufacturing fresh mucous. Two large species of snail, Helix aspersa and Helix pomatia, are collected and eaten, boiled, by the Christians of Syria and Palestine, especially in Lent. The Jews and Moslems declare them to be unclean and do not eat them.``37';
isbe[8258]='Snare`snar (pach; pagis, but brochos, in <a onClick="return mV(\'1Cr\',7,35);">1Co 7:35</a>): Over half a dozen Hebrew words are used to indicate different methods of taking birds and animals, of which the snare (pach) is mentioned oftener than any other. It was a noose of hair for small birds, of wire for larger birds or smaller animals. The snares were set in a favorable location and grain scattered to attract the attention of feathered creatures. They accepted the bribe of good feeding and walked into the snare, not suspecting danger. For this reason the snare became particularly applicable in describing a tempting bribe offered by men to lead their fellows into trouble, and the list of references is a long one, all of the same nature. See <a onClick="return mV(\'Exd\',10,7);">Ex 10:7</a>; <a onClick="return mV(\'1Sa\',18,21);">1Sa 18:21</a>; <a onClick="return mV(\'1Sa\',28,9);">28:9</a>; <a onClick="return mV(\'Psa\',11,6);">Ps 11:6</a>; <a onClick="return mV(\'Psa\',18,5);">18:5</a>, "snares of death"; used symbolically of anything that may kill: <a onClick="return mV(\'Psa\',91,3);">91:3</A>; <a onClick="return mV(\'Psa\',124,7);">124:7</A>; <a onClick="return mV(\'Psa\',140,5);">140:5</A>; <a onClick="return mV(\'Psa\',141,9);">141:9</A>; <a onClick="return mV(\'Pro\',7,23);">Pr 7:23</a>; <a onClick="return mV(\'Pro\',13,14);">13:14</a>; <a onClick="return mV(\'Pro\',18,7);">18:7</a>; <a onClick="return mV(\'Pro\',20,25);">20:25</a>; <a onClick="return mV(\'Pro\',22,25);">22:25</a>; <a onClick="return mV(\'Pro\',29,25);">29:25</a>; <a onClick="return mV(\'Ecc\',9,12);">Ec 9:12</a>. But this is a people robbed and plundered; they are all of them snared in holes, and they are hid in prison-houses: they are for a prey, and none delivereth; for a spoil, and none saith, Restore" (<a onClick="return mV(\'Isa\',41,22);">Isa 41:22</a>). Here it is specified that the snare was in a hole so covered as to conceal it. <a onClick="return mV(\'Jer\',18,22);">Jer 18:22</a> clearly indicates that the digging of a pit to take prey was customary, and also the hiding of the snare for the feet. North American Indians in setting a snare usually figure on catching the bird around the neck. <a onClick="return mV(\'Jer\',50,24);">Jer 50:24</a>, "I have laid a snare for thee"; <a onClick="return mV(\'Hsa\',9,8);">Ho 9:8</a>, "A fowler\'s snare is in all his ways"; <a onClick="return mV(\'Amo\',3,5);">Am 3:5</a> seems to indicate that the snare was set for the feet; <a onClick="return mV(\'Luk\',21,34);">Lu 21:34</a>, "But take heed to yourselves, lest haply...that day come on you suddenly as a snare"; <a onClick="return mV(\'Rom\',11,9);">Ro 11:9</a>, "Let their table be made a snare, and a trap"; <a onClick="return mV(\'1Cr\',7,35);">1Co 7:35</a>, "not that I may cast a snare upon you"; <a onClick="return mV(\'1Ti\',3,7);">1Ti 3:7</a>, "the snare of the devil"; also <a onClick="return mV(\'1Ti\',6,9);">6:9</A> "But they that are minded to be rich fall into a temptation and a snare and many foolish and hurtful lusts, such as drown men in destruction and perdition."`<a href="./study/isbe/search.html?string=GIN">GIN</a>; <a href="./study/isbe/search.html?string=NET">NET</a>; <a href="./study/isbe/search.html?string=TRAP">TRAP</a>`167';
isbe[8259]='Sneeze`snez (zorer, Pho\'el-form zarar): "The child sneezed seven times, and the child opened his eyes" (<a onClick="return mV(\'2Ki\',4,35);">2Ki 4:35</a>). "Sneezing," better "snorting," is found in the description of Leviathan (the crocodile): "His sneezings (\'atsishah) flash forth light, and his eyes are like the eyelids of the morning" (<a onClick="return mV(\'Job\',41,18);">Job 41:18 (Hebrew 10)</a>).`<a href="./study/isbe/search.html?string=NEESING">NEESING</a>`1';
isbe[8260]='Snow`sno (shelegh, telagh (<a onClick="return mV(\'Dan\',7,9);">Da 7:9</a>); chion):<P>(1) Snow is not uncommon in the winter in Jerusalem, but it never reaches any depth and in many winters it is not seen at all. It usually disappears, for the most part, as soon as the sun appears, though it may "hide itself" for a time in the gorge cut by a stream (<a onClick="return mV(\'Job\',6,16);">Job 6:16</a>). On lower levels than Jerusalem there is never sufficient to cover the ground, though often there are some flakes seen in the air. Even at sea-level there is occasionally a sufficient fall of hail to cover the ground. A very exceptional snowfall is related in 1Macc 13:22 at Adora (near Hebron). It was heavy enough to prevent the movement of troops.<P>(2) The tops of the mountains of Lebanon are white with snow for most of the year, and snow may be found in large banks in the valleys and the northern slopes at any time in the summer. Mt. Hermon, 9,200 ft. high, has long streaks of snow in the valleys all the summer.<P>(3) The snow of the mountains is the source of the water of the springs which last throughout the drought of summer. In case the snow fails there is sure to be a lack of water in the fountains: "Shall the snow of Lebanon fail...or shall the cold waters that flow down from afar be dried up?" (<a onClick="return mV(\'Jer\',18,14);">Jer 18:14</a>).<P>(4) Large quantities of snow are stored in caves in the mountains in winter and are brought down to the cities in summer to be used in place of ice for cooling drinks and refrigerating purposes.<P>(5) God\'s power over the elements of Nature is often brought out in the Old Testament: "For he saith to the snow, Fall thou on the earth" (<a onClick="return mV(\'Job\',37,6);">Job 37:6</a>); but man cannot fathom the works of God: "Hast thou entered the treasuries of the snow?" (<a onClick="return mV(\'Job\',38,22);">Job 38:22</a>). "The snowy day" (<a onClick="return mV(\'1Ch\',11,22);">1Ch 11:22</a>; <a onClick="return mV(\'2Sa\',23,20);">2Sa 23:20</a>) and the "fear of snow" (<a onClick="return mV(\'Pro\',31,21);">Pr 31:21</a>) are figurative uses describing winter and cold. "Snow in summer" (<a onClick="return mV(\'Pro\',26,1);">Pr 26:1</a>) would be most out of place, yet it might be most refreshing to the tired workmen in the time of harvest.<P>(6) Snow is the symbol of purity and cleanness, giving us some of our most beautiful passages of Scripture: "Wash me and I shall be whiter than snow" (<a onClick="return mV(\'Psa\',51,7);">Ps 51:7</a>); "Though your sins be as scarlet, they shall be as white as snow" (<a onClick="return mV(\'Isa\',1,18);">Isa 1:18</a>). Carrying the figure farther, snow-water might be expected to have a special value for cleansing: "If I wash myself with snow-water" (<a onClick="return mV(\'Job\',9,30);">Job 9:30</a>). The most common use in Scripture is to denote whiteness in color and implying purity as well: "His raiment was white as snow" (<a onClick="return mV(\'Dan\',7,9);">Da 7:9</a>; <a onClick="return mV(\'Mat\',28,3);">Mt 28:3</a>; <a onClick="return mV(\'Mar\',9,3);">Mr 9:3</a>; <a onClick="return mV(\'Rev\',1,14);">Re 1:14</a>).<P>(7) The whiteness of leprosy is compared to snow (<a onClick="return mV(\'Exd\',4,6);">Ex 4:6</a>; <a onClick="return mV(\'Num\',12,10);">Nu 12:10</a>; <a onClick="return mV(\'2Ki\',5,27);">2Ki 5:27</a>).``85';
isbe[8261]='Snuffers; Snuffdishes`snuf\'-erz, snuf\'-dish-ez (melqachayim, machtoth): These two utensils are thrice mentioned in connection with the wilderness tabernacle (<a onClick="return mV(\'Exd\',25,38);">Ex 25:38</a>; <a onClick="return mV(\'Exd\',37,23);">37:23</a>; <a onClick="return mV(\'Num\',4,9);">Nu 4:9</a>). the American Standard Revised Version prefers to read "snuffers and snuffdishes" in place of "tongs and snuffdishes" (compare <a onClick="return mV(\'2Ch\',4,22);">2Ch 4:22</a>), the connection between the two utensils being indicated by the fact that both are said to belong to the seven lamps, and were to be made out of the talent of gold which was specified as the weight of the whole (<a onClick="return mV(\'Exd\',25,\'37-39\');">Ex 25:37-39</a>).<P>The seven-branched candlestick which stood in the holy place of both tabernacle and temple was surmounted, in each of its arms, by a removable lamp in which olive oil was burnt. From the requirement of keeping these lights brilliantly burning throughout each night of the year, arose the need for snuffers and snuffdishes. By the former, the burnt portions of the wick were removed; in the latter they were deposited previous to removal. The lamps may have required to be trimmed as often as every half-hour. For this purpose a priest would enter the outer chamber "accomplishing the services" (<a onClick="return mV(\'Hbr\',9,6);">Heb 9:6</a>).<P>In the time of Solomon\'s Temple another word than melqachayim was used to describe this utensil. It is mezammeroth, from a verb meaning "to prune" or "trim," and is found in <a onClick="return mV(\'1Ki\',7,50);">1Ki 7:50</a>; <a onClick="return mV(\'2Ki\',12,13);">2Ki 12:13</a>; <a onClick="return mV(\'2Ki\',25,14);">25:14</a>; <a onClick="return mV(\'2Ch\',4,22);">2Ch 4:22</a>; <a onClick="return mV(\'Jer\',52,18);">Jer 52:18</a>. In 4 of these passages, the English text reads, "the snuffers and the basins"; the 5th is merely a summary of things taken to Babylon (<a onClick="return mV(\'2Ki\',25,14);">2Ki 25:14</a>). In this constant later association of "basins" and "snuffers" it is seen that the basins referred to were used for the reception of the cast-off portions of the wicks of the seven lamps, and took the place of the snuffdishes of an earlier age.`<a href="./study/isbe/search.html?string=TONGS">TONGS</a>`17';
isbe[8262]='So`so (co\', although the Hebrew might be pointed cewe\'; Assyrian Sib\'u; Septuagint Segor, Soa; Manetho, Seuechos; Latin Sevechus; Herodotus (ii. 137ff), Sabakon): In all probability the "Sabaeo" of Herodotus, the Shabaka, who founded the Ethiopian dynasty, the XXVth of Egyptian kings. His date is given as 715-707 BC (Flinders Petrie, History of Egypt, III, 281ff), but we may suppose that before his accession to the throne he was entitled to be designated king, as being actually regent. To this So, Hoshea, king of Israel, made an appeal for assistance to enable him to throw off the yoke of the Assyrian Shalmaneser IV (<a onClick="return mV(\'2Ki\',17,3);">2Ki 17:3</a>). But Hoshea\'s submission to So brought him no advantage, for Shalmaneser came up throughout all the land and laid siege to Samaria. Not long after the fall of Samaria, So ventured upon an eastern campaign, and was defeated by Sargon, the successor of Shalmaneser, in the battle of Raphia in 720 BC.<P>LITERATURE.<P>Flinders Petrie, History of Egypt, III, 281ff; McCurdy, HPM, I, 422; Schrader, COT, I, 261.``128';
isbe[8263]='Soap`sop (borith; the King James Version sope): Borith is a derivative of bor, "purity," hence, something which cleanses or makes pure. Soap in the modern sense, as referring to a salt of a fatty acid, for example, that produced by treating olive oil with caustic soda, was probably unknown in Old Testament times. Even today there are districts in the interior of Syria where soap is never used. Cooking utensils, clothes, even the body are cleansed with ashes. The ashes of the household fires are carefully saved for this purpose. The cleansing material referred to in <a onClick="return mV(\'Jer\',2,22);">Jer 2:22</a> (compare Septuagint at the place, where borith is rendered by poia = "grass") and <a onClick="return mV(\'Mal\',3,2);">Mal 3:2</a> was probably the vegetable lye called in Arabic el qali (the origin of English alkali). This material, which is a mixture of crude sodium and potassium carbonates, is sold in the market in the form of grayish lumps. It is produced by burning the desert plants and adding enough water to the ashes to agglomerate them. Before the discovery of Leblanc\'s process large quantities of qali were exported from Syria to Europe.<P>For washing clothes the women sprinkle the powdered qali over the wet garments and then place them on a flat stone and pound them with a wooden paddle. For washing the body, oil is first smeared over the skin and then qali rubbed on and the whole slimy mixture rinsed off with water. Qali was also used in ancient times as a flux in refining precious metals (compare <a onClick="return mV(\'Mal\',3,2);">Mal 3:2</a>). At the present time many Syrian soap-makers prefer the qali to the imported caustic soda for soap-making.<P>In Susanna (verse 17) is a curious reference to "washing balls" (smegmata).``133';
isbe[8264]='Sober; Sobriety; Soberness`so\'-ber, sa-bri\'-e-ti, so\'-ber-nes (Greek adjective sophron, and its related nouns, sophrosune, sophronismos; verbs sophroneo and sophronizo; adverb sophronos, "of sound mind," and sophronizo; "self-possessed," "without excesses of any kind," "moderate and discreet"): In <a onClick="return mV(\'Mar\',5,15);">Mr 5:15</a>; <a onClick="return mV(\'Luk\',8,35);">Lu 8:35</a>, "sane," said of one out of whom demons had just been cast. In the Pastoral Epistles, this virtue is especially commended to certain classes, because of extravagances characterizing particular periods of life, that had to be guarded against, namely, to aged men, with reference to the querulousness of old age (<a onClick="return mV(\'Tts\',2,2);">Tit 2:2</a>); to young men, with reference to their sanguine views of life, and their tendency to disregard consequences (<a onClick="return mV(\'Tts\',2,6);">Tit 2:6</a>); enjoined upon young women, with reference to extravagance in dress and speech (<a onClick="return mV(\'Tts\',2,5);">Tit 2:5</a>; <a onClick="return mV(\'1Ti\',2,9);">1Ti 2:9</a>); and, in a similar manner, commended to ministers, because of the importance of their judgment and conduct, as teachers and exemplars (<a onClick="return mV(\'1Ti\',3,2);">1Ti 3:2</a>). "Words of soberness" (<a onClick="return mV(\'Act\',26,25);">Ac 26:25</a>) are contrasted with the "mania," "madness," that Festus had just declared to be the explanation of Paul\'s eloquence (<a onClick="return mV(\'Act\',26,24);">Ac 26:24</a>).<P>In a few passages, the Greek verb nepho and its derivative adjective nephalios are used in the same sense. The word originally had a physical meaning, as opposed to drunkenness, and is thus used in <a onClick="return mV(\'1Th\',5,6,8);">1Th 5:6,8</a>, as the foundation of the deeper meaning. Used metaphorically also in the Pastoral Epistles and 1 Peter, as sometimes in the classics, for "cool," "unimpassioned." Ellicott, on <a onClick="return mV(\'1Ti\',3,2,11);">1Ti 3:2,11</a>, distinguishes between the two words by regarding sophron "as pointing to the outward exhibition of the inward virtue" implied in nephalios.``84';
isbe[8265]='Socho`so\'-ko: Occurs in <a onClick="return mV(\'1Ch\',4,18);">1Ch 4:18</a>, the Revised Version (British and American) "Soco."`<a href="./study/isbe/search.html?string=SOCOH">SOCOH</a>`1';
isbe[8266]='Socket`sok\'-et (\'edhen): The tabernacle in the wilderness being constructed as a portable building without permanent foundation, its stability was attained by the use of "sockets" into which the pillars and boards forming its walls were sunk. The word therefore is used solely in relation to the tabernacle, except in one poetic passage (<a onClick="return mV(\'Sgs\',5,15);">So 5:15</a>), where the legs of the beloved are compared to "pillars of marble set upon sockets of fine gold." In all, the tabernacle with its court rested upon 165 bases or sockets, apportioned thus:<P>(1) silver sockets, each a talent (circa 95 lbs.) in weight (<a onClick="return mV(\'Exd\',38,27);">Ex 38:27</a>), namely, 96 to support the 48 boards of the tabernacle (<a onClick="return mV(\'Exd\',26,19);">Ex 26:19</a>); 4 for the pillars supporting the veil (<a onClick="return mV(\'Exd\',26,32);">Ex 26:32</a>) = 100;<P>(2) bronze sockets, weight not given, namely, 50 to support the 50 standards on which were hung the curtains of the tabernacle on north, south and west (<a onClick="return mV(\'Exd\',27,10);">Ex 27:10</a>), 10 to support 10 pillars on the east. (<a onClick="return mV(\'Exd\',27,13);">Ex 27:13</a>), and 5 to support the 5 pillars upholding the screen at the tabernacle entrance (<a onClick="return mV(\'Exd\',26,27);">Ex 26:27</a>) = 65. The site for the tabernacle being chosen and leveled, these sockets would be "laid" upon it (<a onClick="return mV(\'Exd\',40,18);">Ex 40:18</a>), and the tenons of the boards, or projecting base of the pillar, inserted into holes made for the purpose.``17';
isbe[8267]='Socoh; Soco`so\'-ko (sokkhoh, "branches"), (sokho (in Chronicles only); Socho, most usual, but many forms in Septuagint and in the King James Version: Socoh, Shochoh, Shoco, Shocho):<P>(1) A city in the Shephelah of Judah mentioned along with Jarmuth, Adullam, Azekah, etc. (<a onClick="return mV(\'Jos\',15,35);">Jos 15:35</a>); the Philistines "gathered together at Socoh, which belongeth to Judah, and encamped between Socoh and Azekah" (<a onClick="return mV(\'1Sa\',17,1);">1Sa 17:1</a>); it is mentioned as one of the districts from which Solomon drew his supplies (<a onClick="return mV(\'1Ki\',4,10);">1Ki 4:10</a>, the King James Version "Sochoh"); the association of Socoh in this verse with Hepher is worth noticing in connection with <a onClick="return mV(\'1Ch\',4,18);">1Ch 4:18</a> ("Heber"). Soco (the King James Version "Shoco") was one of the cities fortified by Rehoboam for the defense of Judah (<a onClick="return mV(\'2Ch\',11,7);">2Ch 11:7</a>); it was captured by the Philistines in the time of Ahaz (<a onClick="return mV(\'2Ch\',28,18);">2Ch 28:18</a>). The site is, without doubt, Khirbet esh Shuweikeh (Shuweikeh is a diminutive of Shaukeh, "a thorn"), a rounded, elongated hilltop, showing clear traces of ancient city walls. The situation is one of considerable natural strength on the south side of the Vale of Elah just where the Wady ec Cur makes a sweep to the west and becomes the Wady es Sunt. Like so many such ancient sites, the hill has very steep slopes on 3 sides (south, west, and north), and is isolated from the ridge of higher ground to the east by a narrow neck of lower ground. In the valley to the Southwest is a plentiful spring. The site was known to Jerome in the 4th century. He described it as 8 or 9 Roman miles from Eleutheropolis (Beit Jibrin) (PEF, III, 53,125, Sh XVII, BR, II, 21). The Sucathites (<a onClick="return mV(\'1Ch\',2,55);">1Ch 2:55</a>) were probably inhabitants of Soco.<P>(2) A city of Judah in the South, associated (<a onClick="return mV(\'Jos\',15,48);">Jos 15:48</a>) with Shamir and Jattir. This is doubtless Khirbet Shuweikeh, a large ruin occupying a low hill, 10 miles Southwest of Hebron; there are many caves and rock-cut cisterns as well as drafted stones. Cheyne doubtfully locates the Socoh of <a onClick="return mV(\'1Ki\',4,10);">1Ki 4:10</a> here. See PEF, 404, 410, Sh XXV; B R, I, 494.``117';
isbe[8268]='Sod, Sodden`sod\'-\'-n.`<a href="./study/isbe/search.html?string=SEETHE">SEETHE</a>`1';
isbe[8269]='Soda`so\'-da.`<a href="./study/isbe/search.html?string=NITRE">NITRE</a>`1';
isbe[8270]='Sodering`sod\'-er-ing (debheq): the King James Version in <a onClick="return mV(\'Isa\',41,7);">Isa 41:7</a>, the Revised Version (British and American) "soldering," of smith work.``1';
isbe[8271]='Sodi`so\'-di (codhi): One of the spies, representing the tribe of Zebulun (<a onClick="return mV(\'Num\',13,10);">Nu 13:10</a>).``1';
isbe[8272]='Sodom`sod\'-um (cedhom; Sodoma) One of the 5 <a href="./study/isbe/search.html?string=CITIES+OF+THE+PLAIN">CITIES OF THE PLAIN</a> (which see), destroyed by fire from heaven in the time of Abraham and Lot (<a onClick="return mV(\'Gen\',19,24);">Ge 19:24</a>). The wickedness of the city became proverbial. The sin of sodomy was an offense against nature frequently connected with idolatrous practices (see Rawlinson, History of Phoenicia). See <a href="./study/isbe/search.html?string=SODOMITE">SODOMITE</a>. The fate of Sodom and Gomorrah is used as a warning to those who reject the gospel (<a onClick="return mV(\'Mat\',10,15);">Mt 10:15</a>; <a onClick="return mV(\'Mat\',11,24);">11:24</a>; <a onClick="return mV(\'2Pe\',2,6);">2Pe 2:6</a>; <a onClick="return mV(\'Jud\',1,7);">Jude 1:7</a>). The word is used in a typical sense in <a onClick="return mV(\'Rev\',11,8);">Re 11:8</a>. Sodom was probably located in plain South of the Dead Sea, now covered with water. The name is still preserved in Jebel Usdum (Mt. Sodom).<P>LITERATURE.<P>Dillmann. Genesis, 111f; Robinson, BR, II, 187ff; G. A. Smith, HGHL, 505ff; Blanckenhorn, ZDPV, XIX,1896, 53ff; Baedeker-Socin, Palestine, 143; Buhl, GAP,117,271, 274.`<a href="./study/isbe/search.html?string=ARABAH">ARABAH</a>; <a href="./study/isbe/search.html?string=CITIES+OF+THE+PLAIN">CITIES OF THE PLAIN</a>; <a href="./study/isbe/search.html?string=DEAD+SEA">DEAD SEA</a>`198';
isbe[8273]='Sodom, Vine of`(gephen cedhom):<P class="in15">"For their vine is of the vine of Sodom,<br>And of the fields of Gomorrah:<br>Their grapes are grapes of gall,<br>Their clusters are bitter" (<a onClick="return mV(\'Deu\',32,32);">De 32:32</a>).<P>This must be distinguished from the "<a href="./study/isbe/search.html?string=APPLES+OF+SODOM">Apples of Sodom</a>" (which see), described by Josephus (BJ, IV, viii, 4), which appear to have been an actual species of fruit, probably either the colocynth or the fruit of the Usher tree, Calotropis procera. It would appear, however, from the above, the only passage referring to the Vine of Sodom, that this expression is metaphorical and does not refer to any particular plant.``117';
isbe[8274]='Sodomite`sod\'-om-it (qadhesh, feminine qedheshah): Qadhesh denotes properly a male temple prostitute, one of the class attached to certain sanctuaries of heathen deities, and "consecrated" to the impure rites of their worship. Such gross and degrading practices in Yahweh\'s land could only be construed as a flagrant outrage; and any association of these with His pure worship was abhorrent (<a onClick="return mV(\'Deu\',23,17);">De 23:17</a>f): The presence of Sodomites is noted as a mark of degeneracy in Rehoboam\'s time (<a onClick="return mV(\'1Ki\',14,24);">1Ki 14:24</a>). Asa endeavored to get rid of them (<a onClick="return mV(\'1Ki\',15,12);">1Ki 15:12</a>), and Jehoshaphat routed them out (<a onClick="return mV(\'1Ki\',22,46);">1Ki 22:46</a>). Subsequent corruptions opened the way for their return, and Josiah had to break down their houses which were actually "in the house of the Lord" (<a onClick="return mV(\'2Ki\',23,7);">2Ki 23:7</a>). The feminine qedheshah is translated "prostitute" in <a onClick="return mV(\'Gen\',38,21,22);">Ge 38:21,22</a>; <a onClick="return mV(\'Hsa\',4,14);">Ho 4:14</a>; in <a onClick="return mV(\'Deu\',23,17);">De 23:17</a> "prostitute" (the King James Version margin "sodomitess," the Revised Version margin transliterates). The English word is, of course, derived from Sodom, the inhabitants of which were in evil repute for unnatural vice.``54';
isbe[8275]='Sodomitish; Sea`sod\'-om-it-ish.`<a href="./study/isbe/search.html?string=DEAD+SEA">DEAD SEA</a>`1';
isbe[8276]='Sodomy`sod\'-o-mi.`<a href="./study/isbe/search.html?string=SODOM">SODOM</a>; <a href="./study/isbe/search.html?string=SODOMITE">SODOMITE</a>; <a href="./study/isbe/search.html?string=CRIMES">CRIMES</a>; <a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[8277]='Sojourner`soj\'-er-ner, so\'-jur-ner, suj\'-er-ner.`<a href="./study/isbe/search.html?string=STRANGER+AND+SOJOURNER">STRANGER AND SOJOURNER</a>`1';
isbe[8278]='Soldering`sod\'-er-ing.`<a href="./study/isbe/search.html?string=SODERING">SODERING</a>`1';
isbe[8279]='Soldier`sol\'-jer.`<a href="./study/isbe/search.html?string=ARMY">ARMY</a>`1';
isbe[8280]='Solemn Assembly (Meeting)``<a href="./study/isbe/search.html?string=CONGREGATION">CONGREGATION</a>; <a href="./study/isbe/search.html?string=FASTS+AND+FEASTS">FASTS AND FEASTS</a>; <a href="./study/isbe/search.html?string=SOLEMN,+SOLEMNITY">SOLEMN, SOLEMNITY</a>`1';
isbe[8281]='Solemn, Solemnity`sol\'-em, so-lem\'-ni-ti: The word "solemn" had<P>(1) at first the meaning "once in the year," through its derivation from Latin sollus, "whole," annus, "year." As, however, a regular annual occurrence is usually one of particular importance, the word took on<P>(2) the meaning "ceremonious." From this is derived<P>(3) the usual modern force of "grave" in opposition to "joyous."<P>This last meaning is not in Biblical English, and the meanings of "solemn" in English Versions of the Bible are either (1) or (2). Nor is there any certain case of (1), for the word is always a gloss in English Versions of the Bible and, although frequently introduced in references to annual events (<a onClick="return mV(\'Lev\',23,36);">Le 23:36</a>, etc.), it is even more often used where "annual" is foreign to the passage (<a onClick="return mV(\'2Ki\',10,20);">2Ki 10:20</a>; <a onClick="return mV(\'Psa\',92,3);">Ps 92:3</a>, etc.). The use of the word in the King James Version is unsystematic. It is always (except in <a onClick="return mV(\'Jer\',9,2);">Jer 9:2</a>) found in conjunction with "assembly" when (10 times) the latter word represents atsarah (\'atsereth) (<a onClick="return mV(\'Lev\',23,36);">Le 23:36</a>, etc.) (retained by the Revised Version (British and American) with margin "closing festival," <a onClick="return mV(\'Lev\',23,36);">Le 23:36</a>; <a onClick="return mV(\'2Ch\',7,9);">2Ch 7:9</a>; <a onClick="return mV(\'Neh\',8,18);">Ne 8:18</a>). the King James Version uses "solemnity" or "solemn day," "feast," etc., 17 times for the very common word mo\'edh ("appointed" time, etc.).<P>See <a href="./study/isbe/search.html?string=FASTS,+FEASTS">FEASTS</A>.<P>RV\'s treatment of these passages defies analysis. "Solemnity" is kept in <a onClick="return mV(\'Isa\',33,20);">Isa 33:20</a>; <a onClick="return mV(\'Eze\',46,11);">Eze 46:11</a>, and "solemn" in Lamentations (4 times); Hosea (3 times); <a onClick="return mV(\'Zep\',3,18);">Ze 3:18</a>. In <a onClick="return mV(\'Eze\',36,38);">Eze 36:38</a>; <a onClick="return mV(\'Eze\',45,17);">45:17</a>; <a onClick="return mV(\'Eze\',46,9);">46:9</a> it is replaced by "appointed," elsewhere (and for mo\'adhoth, <a onClick="return mV(\'2Ch\',8,13);">2Ch 8:13</a>) by "set." The margins further complicate the renderings. the King James Version also uses "solemn" with chagh, "feast," 4 times, and with chaghagh, "keep a feast," in <a onClick="return mV(\'Deu\',16,15);">De 16:15</a>. The word is dropped by the Revised Version (British and American), except the English Revised Version in <a onClick="return mV(\'Psa\',81,3);">Ps 81:3</a>. Finally, the King James Version and the Revised Version (British and American) have "solemn sound" for higgayon, in <a onClick="return mV(\'Psa\',92,3);">Ps 92:3</a>. The context, however, demands "resounding melody." And 11 times the Revised Version (British and American) has introduced "solemn" to represent the intensive in the form shabbath shabbathon (<a onClick="return mV(\'Exd\',16,23);">Ex 16:23</a>, etc.), where the King James Version has simply "sabbath" or "sabbath of rest." the Revised Version (British and American) here has imitated the adverbial "solemnly" in the similar intensified expressions in <a onClick="return mV(\'Gen\',43,3);">Ge 43:3</a>; <a onClick="return mV(\'1Sa\',8,9);">1Sa 8:9</a>.<P>The Revised Version (British and American) Apocrypha translates en hemerais kairou, "in the days of the season" (Baruch 1:14), by "on the days of the solemn assembly" (the King James Version "solemn days"), and both the King James Version and the Revised Version (British and American) have "solemn feast days" for dies festos (2Esdras 1:31). Otherwise the King James Version\'s use of "solemn" is dropped by the Revised Version (British and American).``48';
isbe[8282]='Solomon`sol\'-o-mun (shelomoh; New Testament Solomon):<P><b>I. EARLY LIFE</b><P class="in15">1. Name and Meaning<P class="in15">2. Sources<P class="in15">3. Birth and Upbringing<P class="in15">4. His Accession<P class="in15">5. Closing Days of David<P><b>II. REIGN OF SOLOMON</b><P class="in15">1. His Vision<P class="in15">2. His Policy<P class="in15">3. Its Results<P class="in15">4. Alliance with Tyre<P class="in15">5. Alliance with Egypt<P class="in15">6. Domestic Troubles<P><b>III. HIS BUILDINGS</b><P class="in15">1. The Temple<P class="in15">2. The Palace<P class="in15">3. Other Buildings<P class="in15">4. The Corvee<P><b>IV. HIS CHARACTER</b><P class="in15">1. Personal Qualities<P class="in15">2. His Wisdom<P class="in15">3. His Learning<P class="in15">4. Trade and Commerce<P class="in15">5. Officers of State<P class="in15">6. Wives<P class="in15">7. Revenues<P class="in15">8. Literary Works<P><b>LITERATURE</b><hr /><P>I. Early Life.<P>Solomon was the son of David and Bath-sheba, and became the 3rd king of Israel.<P>1. Name and Meaning:<P>He was so named by his mother (<a onClick="return mV(\'2Sa\',12,24);">2Sa 12:24</a>, Qere; see <a href="./study/isbe/search.html?string=TEXT+AND+MANUSCRIPTS+OF+THE+NEW+TESTAMENT">TEXT AND MANUSCRIPTS OF THE NEW TESTAMENT</a>; <a href="./study/isbe/search.html?string=TEXT+OF+THE+OLD+TESTAMENT">TEXT OF THE OLD TESTAMENT</a>), but by the prophet Nathan, or by his father (Vulgate), he was called Jedidiah—"loved of Yahweh." The name "Solomon" is derived from the root meaning "to be quiet" or "peaceful," and Solomon was certainly the least warlike of all the kings of Israel or Judah, and in that respect a remarkable contrast to his father (so <a onClick="return mV(\'1Ch\',22,9);">1Ch 22:9</a>). His name in Hebrew compares with Irenaeus in Greek, Friedrich in German, and Selim in Arabic; but it has been suggested that the name should be pronounced shillumah, from the word denoting "compensation," Bath-sheba\'s second son being given in compensation for the loss of the first (but see 3, below).<P>2. Sources:<P>The oldest sources for the biography of Solomon are doubtless the "Annals of Solomon" referred to in <a onClick="return mV(\'1Ki\',11,41);">1Ki 11:41</a>, the "history of Nathan the prophet," the "prophecy of Ahijah the Shilonite" and the "visions of Iddo the seer," mentioned in <a onClick="return mV(\'2Ch\',9,29);">2Ch 9:29</a>, all which may be merely the relative sections of the great book of the "Annals of the Kings" from which our Books of Kings and Chronicles are both derived. These ancient works are, of course, lost to us save in so far as they have been embodied in the Old Testament narrative. There the life of Solomon is contained in <a onClick="return mV(\'2Sa\',12,24);">2Sa 12:24</a>f; <a onClick="return mV(\'1Ki\',1,\'1-\');">1Ki 1-11</a>; <a onClick="return mV(\'1Ch\',22,\'1-\');">1Ch 22-2Ch 9</a>. Of these sources <a onClick="return mV(\'2Sa\',12,24);">2Sa 12:24</a>f and <a onClick="return mV(\'1Ki\',1,\'1-\');">1Ki 1</a>; <a onClick="return mV(\'1Ki\',2,1);">2</a> are much the oldest and in fact form part of one document, <a onClick="return mV(\'2Sa\',9,\'1-\');">2Sa 9-20</a>; <a onClick="return mV(\'1Ki\',1,\'1-\');">1Ki 1</a>; <a onClick="return mV(\'1Ki\',2,\'1-\');">2</a> dealing with the domestic affairs of David, which may well be contemporary with the events it describes. The date of the composition of the Books of Chronicles is about 300 BC—700 years after the time of Solomon—and the date of the Books of Kings, as a completed work, must, of course, be later than the exile. Nothing of importance is gained from citations from early historians in Josephus and later writers. Far and away the best source for, at least, the inner life of Solomon would be the writings ascribed to him in the Old Testament, could we be sure that these were genuine (see below).<P>3. Birth and Upbringing:<P>The children of David by Bath-sheba are given in <a onClick="return mV(\'1Ch\',3,5);">1Ch 3:5</a> as Shimea, Shobab, Nathan and Solomon. Compare also <a onClick="return mV(\'2Sa\',5,14);">2Sa 5:14</a>; <a onClick="return mV(\'1Ch\',14,4);">1Ch 14:4</a>, where the same persons evidently are named. It would thus appear that Solomon was the 4th son of Bath-sheba, supposing Shimea to be the child that died. Otherwise Solomon would be the 5th son. There are therefore some events omitted in <a onClick="return mV(\'2Sa\',12,24);">2Sa 12:24</a>f; or else the names Shobab and Nathan are remains of some clause which has been lost, and not proper names. Like the heir apparent of a Turkish sultan, Solomon seems to have spent his best years in the seclusion of the harem. There he was doubtless more influenced by his mother than by his father, and in close intimacy with his mother was the prophet Nathan, who had given him his by-name of fortunate import (<a onClick="return mV(\'2Sa\',12,25);">2Sa 12:25</a>).<P>4. His Accession:<P>It was not until David lay on his deathbed that Solomon left the women\'s quarters and made his appearance in public. That he had been selected by David, as the son of the favorite wife, to succeed him, is pre-supposed in the instructions which he received from his father regarding the building of the Temple. But as soon as it appeared that the life of David was nearing its end, it became evident that Solomon was not to have a "walk over." He found a rival in Adonijah the son of Haggith, who was apparently the eldest surviving son of his father, and who had the support of Joab, by far the strongest man of all, of Abiathar, the leading, if not the favorite, priest (compare <a onClick="return mV(\'2Sa\',15,24);">2Sa 15:24</a>ff), and of the princes of the royal house. Solomon, on the other hand, had the support of his mother Bath-sheba, David s favorite wife, of Nathan the court prophet, of Zadok who had eclipsed Abiathar, of Benaiah, the son of a priest, but one of the three bravest of David\'s soldiers, and captain of the bodyguard of Cherethites and Pelethites, and of the principal soldiers. It is especially noted that Shimei and Hushai (so Josephus) took no active part at any rate with Adonijah (<a onClick="return mV(\'1Ki\',1,8);">1Ki 1:8</a>). The conspiracy came to nothing, for, before it developed, Solomon was anointed at Gibeon (not Gihon, <a onClick="return mV(\'1Ki\',1,33,38,45);">1Ki 1:33,38,45</a>), and entered Jerusalem as king.<P>5. Closing Days of David:<P>The age of Solomon at his accession is unknown. The expression in <a onClick="return mV(\'1Ki\',3,7);">1Ki 3:7</a> is not, of course, to be taken literally (otherwise Ant, VIII, vii, 8). His reign opened, like that of many an oriental monarch, with a settlement in blood of the accounts of the previous reign. Joab, David\'s nephew, who had brought the house within the bounds of blood revenge, was executed. Adonijah, as soon as his father had breathed his last, was on a nominal charge put to death. Abiathar was relegated to his home at Anathoth (<a onClick="return mV(\'1Ki\',2,26);">1Ki 2:26</a>). Conditions were imposed on Shimei which he failed to keep and so forfeited his life (<a onClick="return mV(\'1Ki\',2,36);">1Ki 2:36</a>). These steps having been taken, Solomon began his reign, as it were, with a clean slate.<P>II. Reign of Solomon.<P>1. His Vision:<P>It was apparently at the very beginning of his reign that Solomon made his famous choice of a "hearing heart," i.e. an obedient heart, in preference to riches or long life. The vision took place at Gibeon (<a onClick="return mV(\'2Ch\',1,7);">2Ch 1:7</a>, but in <a onClick="return mV(\'1Ki\',3,4);">1Ki 3:4</a>f the ancient versions read "upon the altar that was in Gibeon. And the Lord appeared," etc.). The life of Solomon was a curious commentary on his early resolution. One of the first acts of his reign was apparently, in the style of the true oriental monarch, to build himself a new palace, that of his father being inadequate for his requirements. In regard to politics, however, the events of Solomon\'s reign may be regarded as an endorsement of his choice. Under him alone was the kingdom of Israel a great world-power, fit almost to rank beside Assyria and Egypt. Never again were the bounds of Israel so wide; never again were north and south united in one great nation. There is no doubt that the credit of this result is due to the wisdom of Solomon.<P>2. His Policy:<P>Solomon was by nature an unwarlike person, and his whole policy was in the direction of peace. He disbanded the above-mentioned foreign legion, the Cherethites and Pelethites, who had done such good service as bodyguard to his father. All his officers seem to have been mediocre persons who would not be likely to force his hand, as Joab had done that of David (<a onClick="return mV(\'2Sa\',3,39);">2Sa 3:39</a>). Even the fortification of Jerusalem and of the frontier towns was undertaken with a view to repel attack, not for the purposes of offense. Solomon did, no doubt, strengthen the army, especially the cavalry arm (<a onClick="return mV(\'1Ki\',4,26);">1Ki 4:26</a>; <a onClick="return mV(\'1Ki\',10,26);">10:26</a>), but he never made any use of this, and perhaps it existed largely on paper. At any rate Solomon seems to have been rather a breeder of and dealer in horse-flesh than a soldier. He appears also to have had a fine collection of armor (<a onClick="return mV(\'1Ki\',10,25);">1Ki 10:25</a>), but much of it was made of gold (<a onClick="return mV(\'1Ki\',10,16);">1Ki 10:16</a>f) and was intended for show, not for use. Both in his reputation for wisdom and in his aversion to war Solomon bears a striking resemblance to King James VI of Scotland and I of England, as depicted by the hand of Sir Walter Scott. It was fortunate for him that both the neighboring great powers were for the time in a decadent state, otherwise the history of the kingdom of Israel would have ended almost before it had begun. On the other hand, it has been remarked that if Solomon had had anything like the military genius of David and his enthusiasm for the religion of Yahweh, he might have extended the arms of Israel from the Nile to the Tigris and anticipated the advent of Islam. But his whole idea was to secure himself in peace, to amass wealth and indulge his love of grandeur with more than oriental splendor.<P>3. Its Results:<P>Solomon, in fact, was living on the achievements and reputation of his father, who laid the basis of security and peace on which the commercial genius of Solomon could raise the magnificent structure which he did. But he took the clay from the foundations in order to build the walls. The Hebrews were a military people and in that consisted their life. Solomon withdrew their energies from their natural bent and turned them to cornmerce, for which they were not yet ripe. Their soul rebelled under the irksome drudgery of an industry of which they did not reap the fruits. Solomon had in fact reduced a free people to slavery, and concentrated the wealth of the whole country in the capital. As soon as he was out of the way, his country subjects threw off the yoke and laid claim to their ancient freedom. His son found himself left with the city and a territory as small as an English county.<P>4. Alliance with Tyre:<P>Solomon\'s chief ally was Hiram, the king of Tyre, probably the friend and ally of David, who is to be distinguished from Hiram the artificer of <a onClick="return mV(\'1Ki\',7,13);">1Ki 7:13</a>ff. Hiram the king entered into a treaty with Solomon which was to the advantage of both parties. Hiram supplied Solomon with cedar and pine wood from Lebanon, as well as with skilled artisans for his building. Tyrian sailors were also drafted into the ships of Solomon, the Hebrews not being used to the sea (<a onClick="return mV(\'1Ki\',9,26);">1Ki 9:26</a>f), besides which Phoenician ships sailed along with those of Solomon. The advantages which Hiram received in return were that the Red Sea was open to his merchantmen, and he also received large supplies of corn and oil from the land of Israel (<a onClick="return mV(\'1Ki\',5,11);">1Ki 5:11</a> corrected by Septuagint and <a onClick="return mV(\'2Ch\',2,10);">2Ch 2:10</a>). At the conclusion of the building of the palace and Temple, which occupied 20 years, Solomon presented Hiram with 20 villages (<a onClick="return mV(\'1Ki\',9,11);">1Ki 9:11</a>; the converse, <a onClick="return mV(\'2Ch\',8,2);">2Ch 8:2</a>), and Hiram made Solomon a return present of gold (<a onClick="return mV(\'1Ki\',9,14);">1Ki 9:14</a>; omitted in 2 Chronicles).<P>5. Alliance with Egypt:<P>Second to Hiram was the Pharaoh of Egypt, whose daughter Solomon married, receiving as her dower the town of Gezer (<a onClick="return mV(\'1Ki\',9,16);">1Ki 9:16</a>). This Pharaoh is not named in the Old Testament. This alliance with Egypt led to the introduction of horses into Israel (<a onClick="return mV(\'1Ki\',10,28);">1Ki 10:28</a>f), though David had already made a beginning on a small scale (<a onClick="return mV(\'2Sa\',8,4);">2Sa 8:4</a>). Both these alliances lasted throughout the reign. There is no mention of an alliance with the eastern power, which was then in a decadent state.<P>6. Domestic Troubles:<P>It was probably nearer the beginning than the end of Solomon\'s reign that political trouble broke out within the realm. When David had annexed the territory of the Edomites at the cost of the butchery of the male population (compare <a onClick="return mV(\'2Sa\',8,14);">2Sa 8:14</a>; <a onClick="return mV(\'Psa\',60,1);">Ps 60, title</a>) one of the young princes of the reigning house effected his escape, and sought and found an asylum in Egypt, where he rose to occupy a high station. No sooner had he heard of the death of David and Joab than he returned to his native country and there stirred up disaffections against Solomon (<a onClick="return mV(\'1Ki\',11,14);">1Ki 11:14</a>ff; see <a href="./study/isbe/search.html?string=HADAD">HADAD</a>), without, however, restoring independence to Edom (<a onClick="return mV(\'1Ki\',9,26);">1Ki 9:26</a>). A second occasion of disaffection arose through a prophet having foretold that the successor of Solomon would have one of the Israelite tribes only and that the other ten clans would be under Solomon\'s master of works whom he had set over them. This officer also took refuge in Egypt and was protected by Shishak. He remained there until the death of Solomon (<a onClick="return mV(\'1Ki\',11,26);">1Ki 11:26</a>). A third adversary was Rezon who had fled from his master the king of Zobah (<a onClick="return mV(\'1Ki\',11,23);">1Ki 11:23</a>), and who established himself at Damascus and rounded a dynasty which was long a thorn in the side of Israel. These domestic troubles are regarded as a consequence of the falling away of Solomon from the path of rectitude, but this seems to be but a kind of anticipative consequence, that is, if it was not till the end of his reign that Solomon fell into idolatry and polytheism (<a onClick="return mV(\'1Ki\',11,4);">1Ki 11:4</a>).<P>III. His Buildings.<P>1. The Temple:<P>The great undertaking of the reign of Solomon was, of course, The <a href="./study/isbe/search.html?string=TEMPLE,+A1">TEMPLE</a> (which see), which was at first probably considered as the Chapel Royal and an adjunct of the palace. The Temple was begun in the 4th year of the reign and finished in the 11th, the work of the building occupying 7" years (<a onClick="return mV(\'1Ki\',6,\'1-\');">1Ki 6</a>; <a onClick="return mV(\'1Ki\',7,13);">7:13</a>). The delay in beginning is remarkable, if the material were all ready to hand (<a onClick="return mV(\'1Ch\',22,\'1-\');">1Ch 22</a>). Worship there was inaugurated with fitting ceremony and prayers (<a onClick="return mV(\'1Ki\',8,\'1-\');">1Ki 8</a>).<P>2. The Palace:<P>To Solomon, however, his own palace was perhaps a more interesting undertaking. It at any rate occupied more time, in fact 13 years (<a onClick="return mV(\'1Ki\',7,\'1-12\');">1Ki 7:1-12</a>; <a onClick="return mV(\'1Ki\',9,10);">9:10</a>; <a onClick="return mV(\'2Ch\',8,1);">2Ch 8:1</a>), the time of building both palace and Temple being 20 years. Possibly the building of the palace occupied the first four years of the reign and was then intermitted and resumed after the completion of the Temple; but of this there is no indication in the text. It was called the House of the Forest of Lebanon from the fact that it was lined with cedar wood (<a onClick="return mV(\'1Ki\',7,2);">1Ki 7:2</a>). A description of it is given in <a onClick="return mV(\'1Ki\',7,\'1-12\');">1Ki 7:1-12</a>.<P>3. Other Buildings:<P>Solomon also rebuilt the wall of the city and the citadel (see <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>; <a href="./study/isbe/search.html?string=MILLO">MILLO</a>). He likewise erected castles at the vulnerable points of the frontiers—Hazor, Megiddo and Gezer (<a onClick="return mV(\'1Ki\',9,15);">1Ki 9:15</a>), lower Beth-horon and <a href="./study/isbe/search.html?string=BAALATH">BAALATH</a> (which see). According to the Qere of <a onClick="return mV(\'1Ki\',9,18);">1Ki 9:18</a> and the ancient versions as well as <a onClick="return mV(\'2Ch\',8,4);">2Ch 8:4</a>, he was the founder of Tadmor (Palmyra); but the Kethibh of <a onClick="return mV(\'1Ki\',9,18);">1Ki 9:18</a> reads Tamar (compare <a onClick="return mV(\'Eze\',47,19);">Eze 47:19</a>). Some of the remains of buildings recently discovered at Megiddo and Gezer may go back to the time of Solomon.<P>4. The Corvee:<P>Solomon could not have built on the scale he did with the resources ordinarily at the command of a free ruler. Accordingly we find that one of the institutions fostered by him was the corvee, or forced labor. No doubt something of the kind always had existed (<a onClick="return mV(\'Jos\',9,21);">Jos 9:21</a>) and still exists in all despotic governments. Thus the people of a village will be called on to repair the neighboring roads, especially when the Pasha is making a progress in the neighborhood. But Solomon made the thing permanent and national (<a onClick="return mV(\'1Ki\',5,\'13-15\');">1Ki 5:13-15</a>; <a onClick="return mV(\'1Ki\',9,15);">9:15</a>). The immediate purpose of the levy was to supply laborers for work in the Lebanon in connection with his building operations. Thus 30,000 men were raised and drafted, 10,000 at a time, to the Lebanon, where they remained for a month, thus having two months out of every three at home. But even when the immediate cause had ceased, the practice once introduced was kept up and it became one of the chief grievances which levi to the dismemberment of the kingdom (<a onClick="return mV(\'1Ki\',12,18);">1Ki 12:18</a>, Adoram = Adoniram; compare <a onClick="return mV(\'2Sa\',20,24);">2Sa 20:24</a>), for hitherto the corvee had been confined to foreign slaves taken in war (<a onClick="return mV(\'1Ki\',9,21);">1Ki 9:21</a>). It is said the higher posts were reserved for Israelites, the laborers being foreigners (<a onClick="return mV(\'1Ki\',9,22);">1Ki 9:22</a>), that is, the Israelites acted as foremen. Some of the foreign slaves seem to have formed a guild in connection with the Temple which lasted down to the time of the exile (<a onClick="return mV(\'Ezr\',2,\'55-57\');">Ezr 2:55-57</a>; <a onClick="return mV(\'Neh\',7,\'57-59\');">Ne 7:57-59</a>).<P>See <a href="./study/isbe/search.html?string=NETHINIM">NETHINIM</a>.<P>IV. His Character.<P>1. Personal Qualities:<P>In Solomon we have the type of a Turkish sultan, rather than a king of Israel. The Hebrew kings, whether of Israel or Judah, were, in theory at least, elective monarchs like the kings of Poland. If one happened to be a strong ruler, he managed to establish his family it might be, for three or even four generations. In the case of the Judean dynasty the personality of the first king made such a deep impression upon the heart of the people that the question of a change of dynasty there never became pressing. But Solomon would probably have usurped the crown if he had not inherited it, and once on the throne he became a thoroughgoing despot. All political power was taken out of the hands of the sheiks, although outward respect was still paid to them (<a onClick="return mV(\'1Ki\',8,1);">1Ki 8:1</a>), and placed in the hands of officers who were simply creatures of Solomon. The resources of the nation were expended, not on works of public utility, but on the personal aggrandizement of the monarch (<a onClick="return mV(\'1Ki\',10,18);">1Ki 10:18</a>). In the means he took to gratify his passions he showed himself to be little better than a savage and if he did not commit such great crimes as David, it was perhaps because he had no occasion, or because he employed greater cunning in working out his ends.<P>2. His Wisdom:<P>The wisdom for which Solomon is so celebrated was not of a very high order; it was nothing more than practical shrewdness, or knowledge of the world and of human nature. The common example of it is that given in <a onClick="return mV(\'1Ki\',3,16);">1Ki 3:16</a>ff, to which there are innumerable parallels in Indian, Greek and other literatures. The same worldly wisdom lies at the back of the Book of Proverbs, and there is no reason why a collection of these should not have been made by Solomon just as it is more likely that he was a composer of verses than that he was not (<a onClick="return mV(\'1Ki\',4,32);">1Ki 4:32</a>). The statement that he had breadth of heart (<a onClick="return mV(\'1Ki\',4,29);">1Ki 4:29</a>) indicates that there was nothing known which did not come within his ken.<P>3. His Learning:<P>The word "wisdom," however, is used also in another connection, namely, in the sense of theoretical knowledge or book leaning, especially in the department of natural history. It is not to be supposed that Solomon had any scientific knowledge of botany or zoology, but he may have collected the facts of observation, a task in which the Oriental, who cannot generalize, excels. The wisdom and understanding (<a onClick="return mV(\'1Ki\',4,29);">1Ki 4:29</a>) for which Solomon was famous would consist largely in stories about beasts and trees like the well-known Fables of Pilpai. They included also the "wisdom" for which Egypt was famous (<a onClick="return mV(\'1Ki\',4,30);">1Ki 4:30</a>), that is, occult science. It results from this last statement that Solomon appears in post-Biblical and Arabian literature as a magician.<P>4. Trade and Commerce:<P>Solomon was very literally a merchant prince. He not only encouraged and protected commerce, but engaged in it himself. He was in fact the predominant, if not sole, partner in a great trading concern, which was nothing less than the Israelite nation. One of his enterprises was the horse trade with Egypt. His agents bought up horses which were again sold to the kings of the Hittites and the Arameans. The prices paid are mentioned (<a onClick="return mV(\'1Ki\',10,29);">1Ki 10:29</a>). The best of these Solomon no doubt retained for his own cavalry (<a onClick="return mV(\'1Ki\',10,26);">1Ki 10:26</a>). Another commodity imported from that country was linen yarn (<a onClick="return mV(\'1Ki\',10,28);">1Ki 10:28</a> the King James Version). The navy which Solomon built at the head of the Gulf of Akaba was not at all for military, but purely commercial ends. They were ships of Tarshish, that is, merchant ships, not ships to Tarshish, as <a onClick="return mV(\'2Ch\',9,21);">2Ch 9:21</a>. They traded to <a href="./study/isbe/search.html?string=OPHIR">OPHIR</a> (which see), from which they brought gold; silver, ivory, apes and peacocks, the round voyage lasting 3 years (<a onClick="return mV(\'1Ki\',9,26);">1Ki 9:26</a>ff; <a onClick="return mV(\'1Ki\',10,22);">10:22</a>). Special mention is made of "<a href="./study/isbe/search.html?string=ALMUG+OR+ALGUM">almug</a>" (<a onClick="return mV(\'1Ki\',10,11);">1Ki 10:11</a>) or "<a href="./study/isbe/search.html?string=ALMUG+OR+ALGUM">algum</a>" (<a onClick="return mV(\'2Ch\',9,10);">2Ch 9:10</a>f) trees (which see). The visit of the Queen of Sheba would point to the overland caravan routes from the Yemen being then open (<a onClick="return mV(\'1Ki\',10,15);">1Ki 10:15</a>). What with direct imports and the result of sales, silver and cedar wood became very plentiful in the capital (<a onClick="return mV(\'1Ki\',10,27);">1Ki 10:27</a>).<P>5. Officers of State:<P>The list of Solomon\'s officers of state is given in <a onClick="return mV(\'1Ki\',4,2);">1Ki 4:2</a>ff. These included a priest, two secretaries, a recorder, a commander-in-chief, a chief commissariat officer, a chief shepherd (if we may read ro\'eh for re\'eh), a master of the household, and the head of the corvee. The list should be compared with those of David\'s officers (<a onClick="return mV(\'2Sa\',8,16);">2Sa 8:16</a>ff; <a onClick="return mV(\'2Sa\',20,23);">20:23</a>). There is much resemblance, but we can see that the machine of state was becoming more complicated. The bodyguard of foreign mercenaries was abolished and the captain Benaiah promoted to be commander-in-chief. Two scribes were required instead of one. Twelve commissariat officers were appointed whose duty it was to forward from their districts the supplies for the royal household and stables. The list of these officials, a very curious one, is given in <a onClick="return mV(\'1Ki\',4,7);">1Ki 4:7</a>ff. It is to be noted that the 12 districts into which the country was divided did not coincide with the territories of the 12 tribes. It may be remarked that Solomon seems as far as possible to have retained the old servants of his father. It will be noticed also that in all the lists there is mention of more than one priest. These "priests" retained some of their original functions, since they acted as prognosticators and diviners.<P>6. Wives:<P>Solomon\'s principal wife was naturally the daughter of Pharaoh; it was for her that his palace was built (<a onClick="return mV(\'1Ki\',3,1);">1Ki 3:1</a>; <a onClick="return mV(\'1Ki\',7,8);">7:8</a>; <a onClick="return mV(\'1Ki\',9,16,24);">9:16,24</a>). But in addition to her he established marriage relations with the neighboring peoples. In some cases the object was no doubt to cement an alliance, as with the Zidonians and Hittites and the other nationalities (<a onClick="return mV(\'1Ki\',11,1);">1Ki 11:1</a>), some of which were forbidden to Israelites (<a onClick="return mV(\'Deu\',7,3);">De 7:3</a>). It may be that the daughter of Pharaoh was childless or died a considerable time before Solomon, but his favorite wife was latterly a grand-daughter of Nahash, the Ammonite king (<a onClick="return mV(\'1Ki\',14,21);">1Ki 14:21</a> Septuagint), and it was her son who succeeded to the throne. Many of Solomon\'s wives were no doubt daughters of wealthy or powerful citizens who wished by an alliance with the king to strengthen their own positions. Yet we do not read of his marrying an Israelite wife. According to the Arabian story Bilqis, the Queen of Sheba who visited Solomon (<a onClick="return mV(\'1Ki\',10,1);">1Ki 10:1</a>), was also married to him. He appears to have had only one son; we are not told of any other than Rehoboam. His daughters were married to his own officers (<a onClick="return mV(\'1Ki\',4,11,15);">1Ki 4:11,15</a>).<P>7. Revenues:<P>Solomon is said to have started his reign with a capital sum of 100,000 talents of gold and a million talents of silver, a sum greater than the national debt of Great Britain. Even so, this huge sum was ear-marked for the building of the Temple (<a onClick="return mV(\'1Ch\',22,14);">1Ch 22:14</a>). His income was, for one year, at any rate, 666 talents of gold (<a onClick="return mV(\'1Ki\',10,14);">1Ki 10:14</a>), or about twenty million dollars. This seems an immense sum, but it probably was not so much as it looks. The great mass of the people were too poor to have any commodities which they could exchange for gold. Its principal use was for the decoration of buildings. Its purchasing power was probably small, because so few could afford to buy it. It was in the same category as the precious stones which are of great rarity, but which are of no value unless there is a demand for them. In the time of Solomon there was no useful purpose to which gold could be put in preference to any other metal.<P>8. Literary Works:<P>It is not easy to believe that the age of Solomon, so glorious in other respects, had not a literature to correspond. Yet the reign of the sultan Ismail in Morocco, whom Solomon much resembles, might be cited in favor of such a supposition. Solomon himself is stated to have composed 3,000 animal stories and 1,005 songs (<a onClick="return mV(\'1Ki\',4,32);">1Ki 4:32</a>). In the Old Testament the following are ascribed to him: three collections of Proverbs, <a onClick="return mV(\'Pro\',1,1);">1:1</a>ff; <a onClick="return mV(\'Pro\',10,1);">10:1</a>ff; <a onClick="return mV(\'Pro\',25,1);">25:1</a>ff; The Song of Songs; <a onClick="return mV(\'Psa\',72,\'1-\');">Psalms 72</a> and <a onClick="return mV(\'Psa\',127,\'1-\');">127</a>; Ecclesiastes (although Solomon is not named). In <a onClick="return mV(\'Pro\',25,1);">Pr 25:1</a> the men of Hezekiah are said to have copied out the following proverbs.<P>LITERATURE.<P>The relative portions of the histories by Ewald, Stanley (who follows Ewald), Renan, Wellhausen and Kittel; also H. Winckler, Alttestamentliche Untersuchungen; and the commentaries on the Books of Kings and Chronicles.``189';

isbe[8284]='Solomon\'s Servants`(\'adbhedhe shelomoh; douloi Salomon): "The children of Solomon\'s servants" constituted a company or guild of the Jewish exiles who returned with Zerubbabel from Babylonia to Jerusalem in 537 BC, pursuant to the decree of Cyrus; they are mentioned 5 times (<a onClick="return mV(\'Ezr\',2,55,28);">Ezr 2:55,58</a> parallel <a onClick="return mV(\'Neh\',7,57,60);">Ne 7:57,60</a>; <a onClick="return mV(\'Neh\',11,3);">Ne 11:3</a>). As the prime purpose of the returning exiles was the rebuilding of the Temple and the restoration of Yahweh\'s worship (<a onClick="return mV(\'Ezr\',1,2,3);">Ezr 1:2,3</a>), it was important that those who held the privileges of sanctuary service as a family heritage should go back to their duties. This included, besides priests and Levites, the <a href="./study/isbe/search.html?string=NETHINIM">NETHINIM</a> (which see) and Solomon\'s Servants. In every reference to them, Solomon\'s Servants are connected with the Nethinim, who had been "given" or dedicated (nethinim or nethunim is pass. participle of nathan, "to give," "to appoint") by David "for the service of the Levites (<a onClick="return mV(\'Ezr\',8,20);">Ezr 8:20</a>); so Solomon\'s Servants traced their official beginning back to Solomon\'s appointment, as their name indicates. In the joint references they always fall into the natural chronological order, i.e. following the Nethinim. It is possible, therefore, that they are referred to in <a onClick="return mV(\'Ezr\',7,24);">Ezr 7:24</a> also, under the title "servants of this house of God," which immediately follows "Nethinim" in the list of those exempt from taxation and tolls.<P>What their duties in the house of God may have been is not stated in the records. These must have been more or less menial, the more formal and honorable duties being reserved for "the priests and Levites, the singers, (and) porters" (<a onClick="return mV(\'Ezr\',7,24);">Ezr 7:24</a>). When the ark was brought to Jerusalem by David and the ceremonial of the sacrificial system was more strictly observed, the services of priests and Levites were greatly increased, and to meet the needs of the new order David appointed the Nethinim (<a onClick="return mV(\'Ezr\',8,20);">Ezr 8:20</a>; compare <a onClick="return mV(\'1Ch\',9,2);">1Ch 9:2</a>). Likewise the much greater increase in such duties on the completion of Solomon\'s Temple was the occasion for the dedication of an additional number of these assistants to the Levites.<P>The number of those who returned with Zerubbabel was not great, together with the Nethinim being only 392. This does not appear to have been sufficient for the needs of the sanctuary, since Ezra, in preparation for his expedition in 458 BC, made special appeal for Nethinim to go with him, of whom 220 responded (<a onClick="return mV(\'Ezr\',8,\'15-20\');">Ezr 8:15-20</a>). No doubt at the first their service was considered to be lowly; but by the time of the exile, certainly after it, their position had developed into one of considerable honor and constituted them a privileged class in the nation. While many of the people were required by Nehemiah to live in Jerusalem, they were allowed to dwell in their possessions "in the cities of Judah" (<a onClick="return mV(\'Neh\',11,3);">Ne 11:3</a>).<P>A question of some interest and of difference of opinion is whether Solomon\'s Servants were Levites or non-Israelites. The latter view is the more generally held, for the following reasons; (1) After the completion of the Temple and his other great buildings a large body of workmen, whom Solomon had drafted from the non-Israelite population, were without occupation, and might well have been assigned to the menial duties of the Temple (<a onClick="return mV(\'1Ki\',9,\'1-\');">1Ki 9</a>), their name in Septuagint (douloi) properly indicating such a class; (2) Ezekiel excludes non-Israelites from the service of his ideal temple, as though they had been allowed in the preexilic Temple (<a onClick="return mV(\'Eze\',44,9);">44:9</A>); (3) they are always clearly distinguished from the Levites in the lists of religious bodies.<P>But, on the other hand, equally strong arguments favor their Levitical descent:<P>(1) Levites also are called douloi in 1Esdras; (2) it is more probable that Ezekiel refers to the abuses of Athaliah, Ahaz and Manasseh than to the institutions of David and Solomon;<P>(3) Ezra specifically classifies the Nethinim as Levites (<a onClick="return mV(\'Ezr\',8,\'15-20\');">8:15-20</A>);<P>(4) there is not the slightest intimation in the text of <a onClick="return mV(\'1Ki\',9,\'15-22\');">1Ki 9:15-22</a> that the Gentile bondservants were assigned to temple-service after completion of the great building operations; such an interpretation is wholly inferential, while, on the contrary, it is more probable that such an innovation would have been mentioned in the narrative; and<P>(5) it is not probable that Ezra and Nehemiah, or Zerubbabel, with their strict views of Israelite privilege (compare <a onClick="return mV(\'Ezr\',2,62);">Ezr 2:62</a>), would have admitted non-Israelites to sacred functions, the less so in view of Ezekiel\'s prohibition. There is more ground, then, for holding that Solomon\'s Servants, like the porters and singers, were an order of Levites.``109';
