isbe[5284]='Kerioth`ke\'-ri-oth, -oth (qeriyoth):<P>(1) A city of Moab, named with Beth-meon and Bozrah (<a onClick="return mV(\'Jer\',48,24,41);">Jer 48:24,41</a>). Here was a sanctuary of Chemosh, to which Mesha says (M S, l. 13) he dragged "the altar hearths of Davdoh." It may possibly be represented by the modern Kuraiat, between Diban and \'Attarus. Some (e.g. Driver on <a onClick="return mV(\'Amo\',2,2);">Am 2:2</a>) think it may be only another name for Ar-Moab. Buhl (GAP, 270) would identify it with Kir of Moab (Kerak). No certainty is yet possible.<P>(2) A city of Judah (<a onClick="return mV(\'Jos\',15,25);">Jos 15:25</a>; the Revised Version (British and American) <a href="./study/isbe/search.html?string=KERIOTH-HEZRON">KERIOTH-HEZRON</a> (which see)), possibly the modern el-Kuryatain, to the northeast of Tell \'Arad.``54';
isbe[5285]='Kerioth-Hezron`ke\'-ri-oth-hez\'-ron (qeriyoth chetsron; <a onClick="return mV(\'Jos\',15,25);">Jos 15:25</a> says, "The same is Hazor"; the King James Version "Kerioth and Hezron which is Hazor"): One of the cities in the "south" of Judah. Robinson (BR, II, 101) identifies it with the ruined site of Kuryatain, 4 1/2 miles north of Tell \'Arad. It has been suggested that Kerioth was the birth place of <a href="./study/isbe/search.html?string=JUDAS+ISCARIOT">JUDAS ISCARIOT</a> (which see).`<a href="./study/isbe/search.html?string=KERIOTH">KERIOTH</a>`1';
isbe[5286]='Kernel`kur\'-nel (chartsannim, English Versions of the Bible "kernels"; Septuagint reads stemphullon used by Aristophanes as olives from which oil has been pressed, later, in same, of raisin pulp): Mentioned in <a onClick="return mV(\'Num\',6,4);">Nu 6:4</a> along with zagh, translated "husks." This translates, "kernels" or "grape stones," is from the Targum and Talmud, but is doubtful, and it may be the word should be translated "sour grapes."``1';
isbe[5287]='Keros`ke\'-ros (qeroc, "fortress"(?)): One of the Nethinim (<a onClick="return mV(\'Ezr\',2,44);">Ezr 2:44</a>; <a onClick="return mV(\'Neh\',7,47);">Ne 7:47</a>), an order appointed to the liturgical offices of the temple.`<a href="./study/isbe/search.html?string=NETHINIM">NETHINIM</a>`1';
isbe[5288]='Kesil`ke\'-zil (Orion).`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[5289]='Kesitah`kes\'-i-ta, ke-se\'-ta (qesitah).`<a href="./study/isbe/search.html?string=PIECE+OF+MONEY">PIECE OF MONEY</a>`1';
isbe[5290]='Ketab`ke\'-tab (Ketab): Ancestor of a family of Nethinim (1Esdras 5:30).``1';
isbe[5291]='Kettle`ket\'-\'l: In English Versions of the Bible only in <a onClick="return mV(\'1Sa\',2,14);">1Sa 2:14</a> for dudh, "a vessel for cooking." The same word in <a onClick="return mV(\'2Ch\',35,13);">2Ch 35:13</a> is rendered "caldrons," and in <a onClick="return mV(\'Job\',41,20);">Job 41:20</a> (Hebrew 12)</a>, "pot." <a onClick="return mV(\'Psa\',81,6);">Ps 81:6 (Hebrew 7)</a> (the King James Version "pots") belongs rather to another signification of the word (the Revised Version (British and American) "basket," for carrying clay or bricks).``1';
isbe[5292]='Keturah`ke-tu\'-ra, ke-too\'-ra (qeturah; Chettoura, "incense"): The second wife of Abraham (<a onClick="return mV(\'Gen\',25,1);">Ge 25:1</a>; <a onClick="return mV(\'1Ch\',1,32);">1Ch 1:32</a>f). According to the Biblical tradition, he contracted this second marriage after the death of Sarah (compare <a onClick="return mV(\'Gen\',23,\'1-\');">Ge 23</a>), and very likely after the marriage of Isaac (compare <a onClick="return mV(\'Gen\',24,\'1-\');">Ge 24</a>). It is not improbable that, as some writers have suggested, this change in the life of his son prompted Abraham to remarry in order to overcome the feeling of lonesomeness caused by Isaac\'s entering the state of matrimony.<P><a onClick="return mV(\'1Ch\',1,32);">1Ch 1:32</a> (and also <a onClick="return mV(\'Gen\',25,6);">Ge 25:6</a>) shows us that Keturah was not considered to be of the same dignity as Sarah who, indeed, was the mother of the son of promise, and, for obvious reasons, the sons of Abraham\'s concubines were separated from Isaac. She was the mother of 6 sons representing Arab tribes south and east of Palestine (<a onClick="return mV(\'Gen\',25,\'1-6\');">Ge 25:1-6</a>), so that through the offspring of Keturah Abraham became "the father of many nations."``8';
isbe[5293]='Key`ke (maphteach, an "opener"; compare kleis, "that which shuts"): Made of wood, usually with nails which fitted into corresponding holes in the lock, or rather bolt (<a onClick="return mV(\'Jdg\',3,25);">Jud 3:25</a>). Same is rendered "opening" in <a onClick="return mV(\'1Ch\',9,27);">1Ch 9:27</a>.<P>See <a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>.<P>Figurative: Used figuratively for power, since the key was sometimes worn on the shoulder as a sign of official authority (<a onClick="return mV(\'Isa\',22,1);">Isa 22-22</a>). In the New Testament it is used several times thus figuratively: of Peter: "the keys of the kingdom of heaven" (<a onClick="return mV(\'Mat\',16,19);">Mt 16:19</a>); of Christ, in Revelation, having the "keys of death and of Hades" (<a onClick="return mV(\'Rev\',1,18);">Re 1:18</a>), also having "the key of David" (<a onClick="return mV(\'Rev\',3,7);">Re 3:7</a>). An angel was given "the key of the pit of the abyss" (<a onClick="return mV(\'Rev\',9,1);">Re 9:1</a>; <a onClick="return mV(\'Rev\',20,1);">20:1</a>). our Lord accused the teachers of the law of His day of taking away "the key of knowledge" from men, that is, locking the doors of truth against them (<a onClick="return mV(\'Luk\',11,52);">Lu 11:52</a>; compare <a onClick="return mV(\'Mat\',23,13);">Mt 23:13</a>).``137';
isbe[5294]='Keys, Power of the`kez<P><b>I. THE PROBLEMS INVOLVED</b><P class="in15">1. The Keys; and the Binding and Loosing<P class="in15">2. Meaning of the Statements<P class="in15">3. How Peter Is Related to These Powers<P class="in15">4. Is the Primary Idea that of Position and Authority?<P><b>II. VIEWS MAINTAINED</b><P class="in15">1. Agent of the Power<P class="in15">2. Nature of the Power<P class="in15">3. Scope of the Power<P><b>III. DATA FOR DECIDING THE QUESTIONS INVOLVED</b><P class="in15">1. Passages Employing the Terms "Key," "Binding and Loosing"<P class="in15">2. Related Passages<P class="in15">3. Examples of Exercise of This Power<P><b>IV. CONCLUSION</b><P class="in15">1. Nature of the Power<P class="in15">2. Agent of the Power<P class="in15">3. Scope of the Power<hr /><P>There is no more stubbornly contested conception in Christian terminology. The thought connects itself immediately with <a onClick="return mV(\'Mat\',16,19);">Mt 16:19</a>, but it is hardly correct to say that it originates there, for the controversy is one that grows out of the conflict of forces inherent in the institutional development of religion and of society. It must have arisen, in any event, if there had been no such word as that in <a onClick="return mV(\'Mat\',16,19);">Mt 16:19</a>, although not in the same terms as it is now found. Since the Reformation it has been recognized, by Catholic and Protestant, that on the interpretation of this passage depends the authority of the Church of Rome and its exclusive claims, so far as their foundation in Scripture is concerned; while on the other hand there is involved the "validity" of the "sacraments," "ordinances" and "orders" of Protestantism and the very hope of salvation of Protestants.<P>I. The Problems Involved.<P>1. The Keys; and the Binding and Loosing:<P>The crucial passage has two declarations, commonly spoken of as promises to Peter: to him Christ will give the keys of the kingdom of heaven; whatsoever he shall bind on earth shall be bound in heaven, while whatsoever he shall loose on earth shall be loosed in heaven. How are the facts of having committed to him the keys and the function of binding and loosing related? Are they two forms of one declaration? Is the first general, and the second a specific sphere of its application?<P>Both statements are made in figurative terms. That of the keys is supposed to be drawn from the duties of the chief steward of a house, or establishment. The idea of the keys of a city turned over to some distinguished person is advanced, but is hardly to be considered. We need, then, to know the functions of the chief steward and how they apply to the kingdom of heaven, and to Peter as its steward.<P>2. Meaning of the Statements:<P>What was Peter to bind and loose, men or things, persons or teachings? Numerous examples could be cited of the use of these terms to signify forbidding (binding) and permitting (loosing) conduct as legitimate under the law of the Old Testament (Lightfoot, McClintock and Strong, Schaff-Herzog, Hastings, etc.). The strict school of Shammai bound many things loosed by the laxer school of Hillel (Broadus, Matthew). Is this conclusive that Jesus is here giving Peter authority for "laying down the law for his fellow-disciples," "authority to say what the law of God allows, and what it forbids," "the power of legislation for the church"? (Compare Mason in Hastings, Dictionary of the Bible (five volumes), IV, 30.)<P>3. How Peter Is Related to These Powers:<P>Ecclesiastical contentions turn especially on Peter\'s relation to these words of Jesus. Do they signify powers and "privileges" conferred on Peter, exclusively or representatively? Are they official or personal? Do they belong to other apostles, and to other officers besides apostles? Can the powers be exercised by individuals or by the church alone? If any besides Peter have these powers, do they pass to them from Peter, and how?<P>4. Is the Primary Idea That of Position and Authority?:<P>What seems to the writer a fundamental question here is either passed over very lightly or entirely omitted in the discussions of this subject. Did Jesus mean by these words to confer on Peter, or on anyone to whom they may apply, authority, or obligation; privilege, or responsibility? Does He promise position, or does He impose duty? These alternatives are not necessarily exclusive, but the interpretation of the thought will be determined in no small measure by where the stress is laid.<P>II. Views Maintained.<P>1. Agent of the Power:<P>The possibilities have been exhausted in the interpretations and applications advocated. It is not possible to classify on lines of the creeds, except very generally, for there is little uniformity of view existing within the various communions.<P>(1) Generally speaking, the Roman Catholic church gives to Peter a unique position. Her theologians also agree that all the powers and privileges of Peter descend to his successors in the vicarate of Christ. When the question is raised of the extension of these prerogatives beyond Peter and the popes, all sorts of views are held, concerning both the fact and the method of that extension.<P>(2) Among Protestants there is general agreement that the church is the agent of this power, but there is not uniformity as to the nature of the authority or the manner of its exercise.<P>(3) Some think that Peter has no peculiar relation to the keys; that these words were spoken to him only as the first who gave expression to that conception and experience, on the basis of which Jesus commits the keys of the kingdom to any believer in Him as the Christ of God.<P>We may summarize the more important views as to Peter thus:<P class="in15">(a) the power committed to him alone and exercised,<P class="in30">(i) at Pentecost, or<P class="in30">(ii) at Pentecost, Caesarea and other places;<P class="in15">(b) the power committed to Peter and to the other apostles, including Paul, discharged by them, and descended to no others;<P class="in15">(c) the power conferred on Peter officially and on his official successors;<P class="in15">(d) the power conferred on Peter and the other apostles and to such as hold their place in the church;<P class="in15">(e) that the power belongs to Peter as representative of the church, and so to the church to be exercised<P class="in30">(i) by the officials of the church,<P class="in30">(ii) by the officials and those to whom they commit it,<P class="in30">(iii) by all priests and persons allowed to represent the church, de facto,<P class="in30">(iv) by the church in its councils, or other formal and official decisions,<P class="in30">(v) by the church in less formal way than (iv),<P class="in30">(vi) by all members the church as representing it without specific commission;<P class="in15">(f) that it belongs to the Christian as such, and so is imposed upon, or offered to, all Christians.<P>2. Nature of the Power:<P>There is general—not absolute—agreement that the holder of the keys is to admit men into the kingdom. It is not agreed that the holder of the keys may, or can, determine who are members of the kingdom. Both sides are-taken. Some think that the power is that of announcing authoritatively the conditions of entrance, while others insist that the holder of the keys also determines what individuals have accepted the conditions.<P>3. Scope of the Power:<P>(1) There is strong support for the view that the primary function of the keys lies in determining the teaching of the kingdom, maintaining purity of doctrine. Emphasis is laid on the use of the neuter, "whatsoever"—not "whomsoever"—with the binding and loosing. This would lead, however, to the secondary and implied function of declaring who had or had not accepted the teaching of the kingdom.<P>(2) In the Roman Catholic church we find insistence on distinguishing between the general authority of the keys in all affairs of the church and religion, and the binding and loosing which they specifically apply to absolution. Only on this last are Catholics in full agreement. That the church administers salvation is held by Roman and Greek Catholics and by not a few Protestants, although Protestants do not, as a rule, claim exclusive power in salvation as do the others. Absolution is held to be a general (derived) priestly function, while the authority of the keys resides in the pope alone.<P>(3) Eminent Catholic authorities admit that the Fathers generally understood the keys to signify the power of forgiving sins, and that they seldom make any reference to the supremacy of Peter. But they claim that rarely the Fathers do take "Christ\'s promise in the fuller meaning of the gift of authority over the church." Suarez was the first to develop the doctrine that it conferred on Peter and his successors authority in its widest sense, administrative and legislative.<P>(4) The extension of the authority of the keys to include civil matters is a contention of the Roman church, shared in modified form by some Protestants. Indeed the relation of ecclesiastical to civil authority must be said still to be awaiting clear definition in Protestantism. Macedo (De Clavibus Petri) claims theologians of the church for the civil authority of the keys. Joyce in the Catholic Encyclopedia affirms that he is unable to verify this claim, but, on the contrary, finds that the opponents of the extension of the authority of the church to civil matters use <a onClick="return mV(\'Mat\',16,19);">Mt 16:19</a> in support of their position on the ground that to Peter were committed the keys of the kingdom of heaven, not of the kingdoms of this world.<P>III. Data for Deciding the Questions Involved.<P>1. Passages Employing the Terms "Key," "Binding and Loosing":<P>We must first examine the Scriptures employing the terms we seek to define.<P>(1) <a onClick="return mV(\'Mat\',16,19);">Mt 16:19</a>, the crucial passage, is part of paragraph over which there is no end of controversy. The incident at Caesarea Philippi was understood then and afterward to mark an epoch in the life and teaching of Jesus. Having elicited Peter\'s confession, Jesus pronounces a benediction on him because his insight represented a Divinely mediated experience of fundamental significance in His own plan and mission. Jesus goes on to say: "And I also say unto thee, that thou art Peter ("a stone"), and upon this rock I will build my church; and the gates of Hades shall not prevail against it" (<a onClick="return mV(\'Mat\',16,18);">Mt 16:18</a>). The controversy rages about "Peter" (petros) and the "rock" (petra), "gates of Hades," and "prevail against it." Are the church to be built on the rock and the kingdom whose keys are to be given to Peter the same? Such a shifting of figure is not conclusive against the thought. Perhaps the church is the organic form of the kingdom, its personal content and expression on earth at any given time. This church exists wherever men consciously accept and are included in the kingdom. The kingdom will always embrace influences, institutions, individuals, not be reckoned in any organized or visible church. The church has never had—in the nature of the case can never have—one complete organization including all the organized life of the kingdom, or even of the church. Any claims to this are contradicted by facts obvious at every moment of history. The change in figure from <a onClick="return mV(\'Mat\',16,18);">Mt 16:18</a> to <a onClick="return mV(\'Mat\',16,19);">16:19</A> is not conclusive against supposing the church to be built in him. But it seems far better to understand that Peter is the first stone in the building, while the foundation is that vital experience in which Peter came to know Jesus as the Christ, the Son of God. On this is erected the church, out of those living stones (lithoi zontes, <a onClick="return mV(\'1Pe\',2,4);">1Pe 2:4</a>) that know and confess Jesus the Christ. The transition is thus easy to giving Peter the keys of the kingdom of heaven, and the reason for giving them to him rather than to any other may be found in the fact that he is now the first so to enter into the kingdom as to be fitted for church functions.<P>It is not needful to determine, for our purpose, the exact meaning of "gates of Hades" and their not prevailing against the church (compare various commentaries). It is clear that the church is to persist in the life of the world and so the kingdom will not lack organized and aggressive expression. Nor does the relation of binding and loosing depend at all upon the critical question of reading or omitting "and" between the two parts of the verse. The conviction could hardly be escaped that the latter function is intimately related to the former, and is either directly or indirectly involved within it.<P>(2) The plural "keys," occurs elsewhere only in <a onClick="return mV(\'Rev\',1,18);">Re 1:18</a>, where the Christ represents Himself as holding the keys of death and of Hades. The word "Hades" might connect this with <a onClick="return mV(\'Mat\',16,19);">Mt 16:19</a>. The immediate occasion for the statement is that He who was dead, is alive; He has not only overcome death in His own person but has conquered it and its realm, so that they can no more have power except as subject to Him, since He holds their keys. Men on earth will either fall under the power of death and Hades or they must enter the kingdom of heaven. If the living Christ has the keys of the kingdom in the hands of Peter, or other friends, and holds the keys of its enemies in His own hands, the work will go on with success. It is not certain that the two passages can properly be so closely connected, but they thus afford just the assurance that is contained for the churches in Revelation.<P>(3) In <a onClick="return mV(\'Rev\',3,7);">Re 3:7</a> Christ appears in the character, "he that is holy, he that is true, he that hath the key (singular) of David, he that openeth and none can shut, and that shutteth and none openeth." The idea is not restricted but indicates mastery over all things in the Messianic kingdom, its own operations and all forms of opposition. In the next verse, as a specific instance, He has set before the church at Philadelphia an open door (opportunity and progress) which none can shut. Compare as to this <a onClick="return mV(\'Eph\',1,22);">Eph 1:22</a>.<P>(4) It seems to be taken for granted that Jesus, in <a onClick="return mV(\'Mat\',16,19);">Mt 16:19</a>, had direct reference to <a onClick="return mV(\'Isa\',22,22);">Isa 22:22</a>, yet the passage is not Messianic except in a general sense and on the assumption that the power of Yahweh over the nations in the Old Testament is wielded by the Christ in the New Testament (see <a href="./study/isbe/search.html?string=JEHOVAH">JEHOVAH</a>; <a href="./study/isbe/search.html?string=LORD">LORD</a>). Eliakim is to have absolute power, holding the key of the house of David. The use of the words "open" and "shut," as well as the general conception, connects the passage rather with <a onClick="return mV(\'Rev\',3,7);">Re 3:7</a>.<P>(5) <a onClick="return mV(\'Rev\',9,1);">Re 9:1</a>; <a onClick="return mV(\'Rev\',20,1);">20:1</a> are to be taken together. "The key of the pit of the abyss" in the hands of the angel or angels signifies, in these specific circumstances, the same power as that indicated in <a onClick="return mV(\'Rev\',1,18);">1:18</a>.<P>(6) In <a onClick="return mV(\'Luk\',11,52);">Lu 11:52</a> Jesus pronounces a woe upon the "lawyers" who had "taken away the key of knowledge" from the people, neither entering in nor allowing those about to go in, to enter. The knowledge of God and Divine things was in the control, in great measure, of these scribes. This connects the figure directly with the idea of <a onClick="return mV(\'Mat\',16,19);">Mt 16:19</a>, and the connection is emphasized by comparing <a onClick="return mV(\'Mat\',23,2);">Mt 23:2</a>f; and is made definite by the word of Jesus in <a onClick="return mV(\'Mat\',13,52);">Mt 13:52</a> with which is to be compared <a onClick="return mV(\'Luk\',12,42);">Lu 12:42</a>, where it would not be allowable, to suppose that Jesus meant to limit the idea of "the faithful and wise steward" to Peter. This passage with the references seems to be highly important for our subject.<P>2. Related Passages:<P>Light is to be drawn from several passages that do not use the exact terms of <a onClick="return mV(\'Mat\',16,19);">Mt 16:19</a>, but that deal with the same general ideas.<P>(1) <a onClick="return mV(\'Mat\',18,18);">Mt 18:18</a> places the responsibility for binding and loosing on all disciples (<a onClick="return mV(\'Mat\',18,1);">18:1</a>), and the reason is explained in the assured presence of the Christ Himself in any company of two or three who have come together in prayer touching any matter in His name, i.e. as His representatives. The immediate reference is to matters of discipline in the effort to rescue any "brother" from sin. The passage is to be taken of sin generally, for the reading "against thee" (<a onClick="return mV(\'Mat\',18,15);">18:15</A>) is to be rejected, in spite of both revised versions. The reference of binding and loosing here to the man is conclusive against limiting the idea in <a onClick="return mV(\'Mat\',16,19);">16:19</a> to teaching (compare also <a onClick="return mV(\'Luk\',17,1);">Lu 17:1</a>ff). It is also to be noted that the responsibility is placed upon the individual Christian to cooperate with others when necessary.<P>(2) <a onClick="return mV(\'Mat\',9,8);">Mt 9:8</a> shows that the multitude recognized that God had given power on earth to pronounce forgiveness of sins, and apparently they do not limit this power to the Divine Person, for they do not yet know Him as such.<P>(3) <a onClick="return mV(\'Jam\',5,14);">Jas 5:14</a>ff recognizes the value of elders, and probably of others also, in securing the forgiveness of them that have sinned.<P>(4) What one must regard as the proper starting-point for studying this subject is <a onClick="return mV(\'Jhn\',20,21);">Joh 20:21</a>ff. Appearing to ten of the apostles and to others on the first night after the resurrection, Jesus says: "As the Father sent me, even so send I you. And when he had said this, he breathed on them, and saith unto them, Whose soever sins ye forgive, they are forgiven unto them; whose soever ye retain, they are retained." By comparing this with the corresponding account in <a onClick="return mV(\'Luk\',24,\'1-\');">Lu 24</a> we see that Jesus is directing that they shall carry on His work (see also <a onClick="return mV(\'Jhn\',14,\'12-14\');">Joh 14:12-14</a>; <a onClick="return mV(\'Jhn\',15,15,16);">15:15,16</a>), that He teaches them at length of the nature of His work as seen in the Old Testament, and that the method of their work is to be preaching repentance and remission of sins in His name among all nations. Significant for our purpose are the presence of others than the apostles, the gift of the Holy Spirit, His own self-projection in His messengers, and the solemn statement that the sins of men will be retained or forgiven as it is done through these followers.<P>3. Examples of Excercise of This Power:<P>(1) It is remarkable that there is no distinct reference to this authority of the keys in the records of the work of the apostles and others in the New Testament. Their consciousness seems most of all to have been dominated by the fact that they were witnesses of Jesus, and this corresponds exactly with the point of emphasis in all the various forms and occasions of the giving of the commission (see <a onClick="return mV(\'Act\',2,32);">Ac 2:32</a>; <a onClick="return mV(\'Act\',3,15);">3:15</a>; <a onClick="return mV(\'Act\',4,33);">4:33</a>; <a onClick="return mV(\'Act\',5,32);">5:32</a>; <a onClick="return mV(\'Act\',10,39,41);">10:39,41</a>; <a onClick="return mV(\'Act\',13,31);">13:31</a>; <a onClick="return mV(\'1Pe\',5,1);">1Pe 5:1</a>; compare Carver, Missions in the Plan of the Ages). It is said of Paul and Barnabas (<a onClick="return mV(\'Act\',14,27);">Ac 14:27</a>) that after their first missionary journey they rehearsed to the church at Antioch "all things that God had done with them, and that he had opened a door of faith unto the Gentiles." At Pentecost and at other times Peter was the chief speaker, and so opened the door of the kingdom. Referring to his preaching to Cornelius and his friends, Peter reminds the saints in the conference at Jerusalem (<a onClick="return mV(\'Act\',15,\'1-\');">Ac 15</a>) that God made choice among them, that by his mouth the Gentiles should hear the word of God and believe, but this was said by way of conciliating the Jewish party and not as claiming any priority in authority. It was Philip, the deacon-evangelist, who first preached to the Samaritans (<a onClick="return mV(\'Act\',8,\'1-\');">Ac 8</a>), and some "men of Cyprus and Cyrene, who, when they were come to Antioch, spake unto the Greeks also, preaching the Lord Jesus" (<a onClick="return mV(\'Act\',11,20);">Ac 11:20</a>), the first example of "opening a door of faith" to full heathen. Peter appears in the Jerusalem conference with no authority above that of other apostles and elders. By reference to <a onClick="return mV(\'Gal\',2,\'1-\');">Ga 2</a> we see that Paul was here only as a matter of prudence and fraternity, not recognizing any authority to legislate for his churches or his ministry. The decision there reached is promulgated as that of the brethren as a body, loosing all the law of Moses save four matters that were "necessary" on account of fundamental morals and of the universal presence of Jews in every city (<a onClick="return mV(\'Act\',15,20,28);">Ac 15:20f; 28f</a>). In the sense of teaching Christian conduct all Paul\'s letters are examples of binding and loosing.<P>(2) As to binding and loosing sins Peter speaks in the cases of Ananias and Sapphira (<a onClick="return mV(\'Act\',5,\'1-\');">Ac 5</a>), Simon Magus (<a onClick="return mV(\'Act\',8,\'1-\');">Ac 8</a>), and in deciding upon the baptism of Cornelius and his household (<a onClick="return mV(\'Act\',10,48);">Ac 10:48</a>). Paul speaks with equal boldness in the judgment of Elymas (<a onClick="return mV(\'Act\',13,10);">Ac 13:10</a>), where we are told that he was under the Spirit; passes upon the faith of a dozen men at Ephesus, and requires their new baptism after instruction (<a onClick="return mV(\'Act\',19,\'3-7\');">Ac 19:3-7</a>); commands the church at Corinth to turn over to Satan the incestuous man (<a onClick="return mV(\'1Cr\',5,5);">1Co 5:5</a>; compare <a onClick="return mV(\'1Ti\',1,20);">1Ti 1:20</a>), and later urges the man\'s restoration to loving fellowship, declaring that he has been forgiven (<a onClick="return mV(\'2Cr\',2,5);">2Co 2:5</a>). Obscure men like Philip (<a onClick="return mV(\'Act\',8,\'1-\');">Ac 8</a>) and Ananias of Damascus in the case of Paul himself (<a onClick="return mV(\'Act\',9,\'1-\');">Ac 9</a>) exercised the same sort of judgment as to the forgiveness and reception of men into the fellowship.<P>IV. Conclusion.<P>1. Nature of the Power:<P>We sum up what seems to be the teaching of Scripture. We conclude that the power is not a special privilege and extraordinary authority, but a responsibility entrusted by Jesus Christ as the method of extending His work. There is in it nothing magical, mysterious, or arbitrary; not ecclesiastical or official, but spiritual and primarily personal. The keys of the kingdom of heaven are first of all the gospel of salvation through Jesus Christ. By this means men are admitted into the kingdom. The fully attested method of using the keys is that of witnessing personally to an experience of Jesus Christ. He was conferring power for saving and not for barring from salvation. Let it be borne in mind always that Jesus was offering Peter not power but duty, not privilege but responsibility. Neither of these terms, "power" and "privilege," that have come to be associated with the gift of the keys occurs with that gift in the words of the Master. The keys are primarily for admitting to the kingdom of heaven, not for barring from the church.<P>2. Agent of the Power:<P>The holder of the keys is any man with that experience that called forth from Jesus the assurance that Peter should have the keys. Such a man will be in fellowship and cooperation with like men, in a church, and the Spirit of Jesus will be present in them, so that their decisions and their testimony will be His as well as theirs. There is a corporate, or church, agency, therefore, and the man who would ignore that lacks the experience or the Spirit needful for the use of the keys. Yet the church is never to overshadow or exclude the individual responsibility and authority.<P>3. Scope of the Power:<P>It is to be understood that the keys of the kingdom of heaven confer no political authority or power, save that of holy and redemptive influence. The kingdom of Jesus is not of this world. Its power is spiritual and is to be exercised always primarily in the saving of men. Men do not need to be locked out of the kingdom. They are out, and too contented to remain so. It does happen that evil men seek to take possession of the kingdom for evil ends, and then it is that the authority rests in spiritual men to exclude. Men that are to be brought into the kingdom of heaven are now in sin, and where the duty of releasing them is not discharged by Christians, the sinners are left bound in their sins.<P>There is also involved of necessity the duty of declaring not only the conditions of entrance into the kingdom, but the courses of conduct appropriate to the kingdom. It is thus that binding and loosing in teaching devolve upon the holders of the keys. To that extent, and in that sense, alone, is there the power of "legislating" within the kingdom. This is only interpreting and applying the principles that are given us in the Scriptures.``21';
isbe[5295]='Keziah`ke-zi\'-a (qetsi\'ah, "cassia"; Kasia, Codex Alexandrinus, Kassia): The 2nd daughter of Job (<a onClick="return mV(\'Job\',42,14);">Job 42:14</a>), born after his restoration from affliction. The word "cassia" became a feminine name from the fragrance of the flower.``1';

isbe[5298]='Kibroth-Hattaavah`kib-roth-ha-ta\'-a-va, kib-roth (qibhroth ha-ta\'awah "the graves of greed"): A desert camp of the Israelites, one day\'s journey from the wilderness of Sinai. There the people lusted for flesh to eat, and, a great number of quails being sent, a plague resulted; hence, the name (<a onClick="return mV(\'Num\',11,34);">Nu 11:34</a>; <a onClick="return mV(\'Num\',33,16);">33:16</a>; <a onClick="return mV(\'Deu\',9,22);">De 9:22</a>).``1';
isbe[5299]='Kibzaim`kib-za\'-im, kib\'-za-im`<a href="./study/isbe/search.html?string=JOKMEAM">JOKMEAM</a>`1';
isbe[5300]='Kick`(laktizo): In the famous vision on the road to Damascus the unseen voice said to Saul: "Why persecutest thou me? It is hard for thee to kick against the goad" (<a onClick="return mV(\'Act\',9,4);">Ac 9:4</a>f; <a onClick="return mV(\'Act\',26,14);">26:14</a>). The words are omitted from the best manuscripts in <a onClick="return mV(\'Act\',9,4);">Ac 9:4</a>. This was a familiar proverb in both Greek and Latin literature, and refers to the severer goading received by an ox which kicks back at the goad used to guide or urge him on. The words seem to mean that Paul\'s paroxysm of persecution was a painful as well as profitless resistance to the pricks of conscience by which God was leading him into the light.``1';
