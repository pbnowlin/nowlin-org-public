ctive gift of grace, not simply in the sense in which the Old Testament just one judged his position of salvation as a gift of grace, but as a righteousness specially reckoned and adjudicated by way of grace and acknowledged before the judgment (or court, Gericht) of God (<a onClick="return mV(\'Rom\',4,6);">Ro 4:6</a>; compare <a onClick="return mV(\'Rom\',4,\'1-8\',11);">Ro 4:1-8,11</a>; <a onClick="return mV(\'Rom\',3,23);">3:23</a>; <a onClick="return mV(\'Gal\',3,6);">Ga 3:6</a>). This is always the meaning of dikaioun, dikaiousthai, or dikaiosis in Paul. It consists in the not-reckoning of sins," etc. (p. 658). Of course justification is only a part of the process of salvation, which includes regeneration and sanctification, but these are one thing and justification is another.<P>(6) Justification Has to Do with the Individual.<P>Finally it is asked whether justification in Paul\'s mind has to do with the individual believer or with the society or Christian congregation. Ritschl (II, 217f) and Sanday-Headlam (The Epistle to the Romans, 122-23) say the latter; Weiss (I, 442), the former. It is indeed true that Paul refers to the church as purchased with Christ\'s blood (<a onClick="return mV(\'Act\',20,28);">Ac 20:28</a>, or God\'s blood, according to the two oldest manuscripts and ancient authorities; compare <a onClick="return mV(\'Eph\',5,25);">Eph 5:25</a>), and he uses the pronoun "we" as those who have received redemption, etc. (<a onClick="return mV(\'Col\',1,14);">Col 1:14</a>; <a onClick="return mV(\'Eph\',2,18);">Eph 2:18</a>); but it is evident on the other hand that faith is an individual matter, a thing first between man and his God, and only after a man has been united to Christ by faith can he enter into a spiritual fellowship with fellow-believers. Therefore the subject of justification must be in the first place the individual, and only in the second place and by consequence the society. Besides, those justified are not the cleansed and sanctified members of churches, but the ungodly (<a onClick="return mV(\'Rom\',4,5);">Ro 4:5</a>).<P>As to the argument from baptism urged by Sanday-Headlam, it must be said that Paul always conceives of baptism as taking place in the Christian community with believers and for believers, that that for and to which they are baptized is not justification, but the death and resurrection of Christ (<a onClick="return mV(\'Rom\',6,3,4);">Ro 6:3,4</a>), and that the righteousness of God has been manifested not through baptism but through faith in Jesus Christ unto all that believe (<a onClick="return mV(\'Rom\',3,22);">Ro 3:22</a>), being justified freely, not through baptism, but through the redemption that is in Christ Jesus (<a onClick="return mV(\'Rom\',3,24);">Ro 3:24</a>). With Paul baptism has always a mystical significance as symbolizing and externally actualizing union with the death of the Lord, and would be both impossible and impertinent in the case of those not already believers in Christ and thus inwardly united to His society.<P>II. The Other New Testament Writings.<P>So much for Paul. Let us now take a glance at the other New Testament books. It is a commonplace of theology that is called "modern" or "critical," that Paul and not Jesus is the founder of Christianity as we know it, that the doctrines of the Divinity of Christ, atonement, justification, etc., are Paul\'s work, and not his Master\'s. There is truth in this. It was part of the humiliation of Christ as well as His pedagogical method to live, teach and act under the conditions of His time and country, on the background of Palestine of 30 AD; and it was specially His method to do His work and not His disciples\', to live a life of love and light, to die for the sins of the world, and then go back to the Father that the Holy Spirit might come and lead His followers into all truth. A full statement of the doctrines of Christianity on His part would have been premature (<a onClick="return mV(\'Jhn\',16,12);">Joh 16:12</a>), would have been pedagogically unwise, if not worthless. First the blade, then the ear, then the full grain in the ear (<a onClick="return mV(\'Mar\',4,28);">Mr 4:28</a>). It would also have been spiritually and philosophically impossible, for Christianity was not a set of teachings by Christ—but a religion springing out of His life, death, resurrection, ascension, intercession, mediatorial activity in history through the Spirit who works in His disciples and on the world through and by that life, death, etc. The only question is whether the apostles were true to the spirit and content of His teachings in its moral and religious outlines. And especially in this matter of justification, a teaching by Christ is not to be looked for, because it is the very peculiarity of it that its middle point is the exalted Lord, who has become the mediator of salvation by His death and resurrection. Did the Pauline doctrine fit into the concrete situation made by the facts of Christ mentioned above, and was it the necessary consequence of His self-witness? Let us look into the Synoptic Gospels.<P>1. The Snyoptic Gospels:<P>So far is it from being true, as Harnack says (What Is Christianity? 2nd edition, revised, New York,1901,68), that the "whole of Jesus\' message may be reduced to these two heads: God as Father, and the human soul so ennobled that it can and does unite with Him," that an essential part of His message is omitted, namely, that salvation is bound up in His (Christ\'s) own person. (The reader is asked to verify the references for himself, as space will not allow quotation.) See <a onClick="return mV(\'Mat\',10,\'37-39\');">Mt 10:37-39</a>; <a onClick="return mV(\'Mat\',16,\'24-27\');">16:24-27</a>. Confession of Him (not simply of the Father) determines acknowledgment above (<a onClick="return mV(\'Mat\',10,32);">Mt 10:32</a>), where judgment is rendered according to our attitude to Him in His unfortunate ones <a onClick="return mV(\'Mat\',25,35);">Mt 25:35</a>ff). No sooner was His person rightly estimated than He began to unfold the necessity of His death and resurrection (<a onClick="return mV(\'Mat\',16,21);">Mt 16:21</a>). The evening before that death occurred, He brings out its significance, perpetuates the lesson in the institution of the Supper (<a onClick="return mV(\'Mar\',14,24);">Mr 14:24</a>), and reenforces it after His resurrection (<a onClick="return mV(\'Luk\',24,26);">Lu 24:26</a>). Paul himself could hardly have expressed the fact of the atonement through Christ\'s death more decisively than <a onClick="return mV(\'Mat\',20,28);">Mt 20:28</a>; <a onClick="return mV(\'Mat\',26,28);">26:28</a>. With this foundation, could the Christian doctrine of salvation take any other course than that it actually did take? Instead of referring men to the Father, Christ forgives sins Himself (<a onClick="return mV(\'Mat\',9,\'2-6\');">Mt 9:2-6</a>), and He reckons all men as needing this forgiveness (<a onClick="return mV(\'Mat\',6,12);">Mt 6:12</a>). While the time had not arrived for the Pauline doctrine of righteousness, Jesus prepared the way for it, negatively, in demanding a humble sense of sin (<a onClick="return mV(\'Mat\',5,3);">Mt 5:3</a>), inner fitness and perfection (<a onClick="return mV(\'Mat\',5,6,8,20);">Mt 5:6,8,20,48</a>), and positively in requiring recourse to Him by those who felt the burden of their sins (<a onClick="return mV(\'Mat\',11,28);">Mt 11:28</a>), to Him who was the rest-giver, and not simply to God the Father, a passage of which <a onClick="return mV(\'Rom\',5,1);">Ro 5:1</a> is an echo. For it was specially to those to whom, as to the awakened Paul, the law brought condemnation that He came, came to heal and to save (<a onClick="return mV(\'Mar\',2,17);">Mr 2:17</a>; <a onClick="return mV(\'Mat\',9,13);">Mt 9:13</a>; <a onClick="return mV(\'Luk\',15,7);">Lu 15:7</a>). It was for sinners and to sinners that He came (<a onClick="return mV(\'Luk\',15,2);">Lu 15:2</a>; <a onClick="return mV(\'Luk\',7,39);">7:39</a>; <a onClick="return mV(\'Luk\',19,7);">19:7</a>; <a onClick="return mV(\'Mat\',11,19);">Mt 11:19</a>), just as Paul understood; and the way for their salvation was not better law-keeping, but trusting prayer in the confession of sin (<a onClick="return mV(\'Luk\',18,13);">Lu 18:13</a>), really equivalent to faith, the humble heart and a hunger for righteousness = (faith). See <a onClick="return mV(\'Mat\',5,3,6);">Mt 5:3,6</a>. He who brings most of himself, of his own pride and works, is the least likely to obtain the kingdom of heaven (<a onClick="return mV(\'Mat\',18,3,4);">Mt 18:3,4</a>; <a onClick="return mV(\'Mar\',10,14);">Mr 10:14</a>). Not only entrance, but the final reward itself is of grace (<a onClick="return mV(\'Mat\',19,30);">Mt 19:30</a>; <a onClick="return mV(\'Mat\',20,\'1-16\');">20:1-16</a>), a parable in the true spirit of Paul, and in anticipation of whose message was the promise of Paradise to the penitent robber (<a onClick="return mV(\'Luk\',23,43);">Lu 23:43</a>). At the very beginning the message sounded out, "Repent ye, and believe in the gospel" (<a onClick="return mV(\'Mar\',1,15);">Mr 1:15</a>), the gospel which was summed up in Christ, who would gather the people, not directly to God the Father, but to Himself (<a onClick="return mV(\'Mat\',23,37);">Mt 23:37</a>). All this means justification through that faith in Himself, in His Divine-human manifestation (<a onClick="return mV(\'Mat\',16,\'13-16\');">Mt 16:13-16</a>), of which faith He expresses Himself with anxiety in <a onClick="return mV(\'Luk\',18,8);">Lu 18:8</a>, and the presence of which he greeted with joy in <a onClick="return mV(\'Mat\',8,10);">Mt 8:10</a>. Ihmels is right therefore in holding (RE3, XVI, 490) that Paul\'s proclamation was continuous with the self-witness of Jesus, which conversely pointed as a consequence to the witness of Paul.<P>2. John\'s Writings:<P>Justification by faith is not more implicit in John\'s Gospel than in the first three; it is only more explicit (<a onClick="return mV(\'Jhn\',3,\'14-16\');">Joh 3:14-16</a>). Eternal life is the blessing secured, but this of course is only possible to one not under condemnation (<a onClick="return mV(\'Jhn\',3,36);">Joh 3:36</a>). The new Sonship of God came also in the wake of the same faith (<a onClick="return mV(\'Jhn\',1,12);">Joh 1:12</a>). The Epistles of John vary from Paul in word rather than in substance. The atoning work of Jesus is still in the background; walking in the light is not conceivable in those under condemnation and without faith; and the confession of sins that leads to forgiveness seems only another name for the justification that brings peace (<a onClick="return mV(\'1Jo\',1,9,10);">1Joh 1:9,10</a>; compare <a onClick="return mV(\'1Jo\',2,1,2);">2:1,2</a>). Everything is, as with Paul (<a onClick="return mV(\'Eph\',2,7);">Eph 2:7</a>; <a onClick="return mV(\'Tts\',3,4);">Tit 3:4</a>), led back to the love of God (<a onClick="return mV(\'1Jo\',3,1);">1Joh 3:1</a>), who sent His Son to be the propitiation for our sins (<a onClick="return mV(\'1Jo\',4,10);">1Joh 4:10</a>).<P>3. 1 Peter and Hebrews:<P>Seeberg\'s point that the "Pauline doctrine of justification is not found in any other New Testament writer" (History of Doctrine, I, 48) is true when you emphasize the word "doctrine." Paul gave it full scientific treatment, the others presuppose the fact, but do not unfold the doctrine. Peter\'s "Repent ye, and be baptized...in the name of Jesus Christ" (<a onClick="return mV(\'Act\',2,38);">Ac 2:38</a>) is meaningless unless faith were exercised in Christ. It is He in whom, though we see Him not, yet believing, we rejoice greatly with joy unspeakable (<a onClick="return mV(\'1Pe\',1,8);">1Pe 1:8</a>), receiving the end of our faith, the salvation of our souls (<a onClick="return mV(\'1Pe\',1,9);">1Pe 1:9</a>). It is only, however, through the precious blood as of a lamb without blemish, even that of Christ (<a onClick="return mV(\'1Pe\',1,19);">1Pe 1:19</a>), and is only through Him that we are believers in God (<a onClick="return mV(\'1Pe\',1,21);">1Pe 1:21</a>). The familiar expression, "Come to Jesus," which simply means have faith in Jesus for justification and salvation, goes back to Peter (<a onClick="return mV(\'1Pe\',2,4);">1Pe 2:4</a>). The Epistle to the Hebrews has other interests to look after, but it does not deny faith, but rather exhorts us to draw near with a true heart in fullness of faith (<a onClick="return mV(\'Hbr\',10,22);">10:22</A>), which it lays at the foundation of all true religion, thinking and achievement (<a onClick="return mV(\'Hbr\',11,\'1-\');">Hebrews 11</a>). The writer can give no better exhortation than to look unto Jesus the author and perfecter of our faith (<a onClick="return mV(\'Hbr\',12,2);">12:2</a>), an exhortation in the true spirit of Paul, whose gospel of faith for justification is also summed up in <a onClick="return mV(\'Hbr\',4,16);">4:16</A>.<P>4. Epistle of James:<P>We come lastly to the core of the matter in regard to New Testament representations of justification—the famous passage in <a onClick="return mV(\'Jam\',2,\'14-26\');">Jas 2:14-26</a>, which at first sight seems a direct blow at Paul. Here we are met by the interesting question of the date of James. As we cannot enter into this (see <a href="./study/isbe/search.html?string=JAMES,+EPISTLE+OF">JAMES, EPISTLE OF</a>), what we say must be independent of this question. A careful look at this vigorous and most valuable letter (valuable in its own place, which is not that of Paul\'s letters, in comparison with which it is a "right strawy epistle," as Luther truthfully said (Erl. Ausg., 63, 115; see also pp. 156-57), in saying which he did not mean to reject it as useless (straw has most important uses), but as giving the doctrine of salvation, for which we must look to Paul) will show us that contradiction on the part of James to Paul is apparent and not real.<P>(1) In this section James uses the word faith simply for intellectual belief in God, and especially in the unity of God (<a onClick="return mV(\'Jam\',2,19);">2:19</A>; see also context), whereas Paul uses it for a saving trust in Christ. As Feine well says (Theol. d. New Testament, Leipzig, 2 1911, 660-63), for Paul faith is the appropriation of the life-power of the heavenly Christ. Therefore he knows no faith which does not bring forth good works corresponding to it. What does not come from faith is sin. For James faith is subordination of man to the heavenly Christ (<a onClick="return mV(\'Jam\',2,1);">2:1</a>), or it is theoretic acknowledgment of one God (<a onClick="return mV(\'Jam\',2,19);">2:19</a>). Justification is for James a speaking just of him who is righteous, an analytical judgment. (Feine also says that James did not understand Paul, but he did not fight him. It was left to Luther through his deep religious experience first to understand Paul\'s doctrine of justification.)<P>(2) James uses the word "works" as meaning practical morality, going back behind legalism, behind Pharisaism, to the position of the Old Testament prophets, whereas Paul uses the word as meritorious action deserving reward.<P>(3) When James is thinking of a deeper view, faith stands central in Christianity (<a onClick="return mV(\'Jam\',1,3,6);">1:3,6</a>; <a onClick="return mV(\'Jam\',2,1);">2:1</a>; <a onClick="return mV(\'Jam\',5,15);">5:15</A>).<P>(4) Paul also on his part is as anxious as James vitally to connect Christianity and good works through faith (<a onClick="return mV(\'1Th\',1,3);">1Th 1:3</a>; <a onClick="return mV(\'Gal\',5,6);">Ga 5:6</a>; <a onClick="return mV(\'1Cr\',13,2);">1Co 13:2</a>; <a onClick="return mV(\'Rom\',2,6,7);">Ro 2:6,7</a>; see Mayor, The Epistle of James, 1892, lxxxviiiff; Franks, in DCG, I, 919-20; Findlay in HDB, 1-vol edition, 511).<P>(5) The whole argument of James is bent on preserving a real practical Christianity that is not content with words merely (<a onClick="return mV(\'Jam\',2,15,16);">2:15-16</a>), but shows itself in deeds. He is not trying to show, as Paul, how men get rid of their guilt and become Christians, but how they prove the reality of their profession after they receive the faith. He is not only writing to Christians, as of course Paul was, but he was writing to them as Christians ("my brethren," <a onClick="return mV(\'Jam\',2,14);">2:14</a>), as already justified and standing on the "faith of our Lord Jesus Christ" (<a onClick="return mV(\'Jam\',2,1);">2:1</a>), whereas Paul was thinking of men, Gentile and Jew, shivering in their guilt before the Eternal Justice, and asking, How can we get peace with God? "There is not," says Beyschlag (New Testament Theology, Edinburgh,1895, I, 367-68), "an objective conflict between the Pauline and Jacobean doctrines; both forms of teaching exist peacefully beside each other. James thought of justification in the simple and most natural sense of justificatio justi, as the Divine recognition of an actually righteous man, and he thought of it as the final judgment of God upon a man who is to stand in the last judgment and become a partaker of the final soteria (\'salvation\'). Paul also demands as a requisite for this last judgment and the final soteria right works, the love that fulfills the law and the perfected sanctification, but he (except in <a onClick="return mV(\'Rom\',2,13);">Ro 2:13</a>) does not apply the expression dikaiousthai (\'to be justified\') to the final judgment of God, which recognizes this righteousness of life as actual. He applies it rather to that first sentence of God with which He graciously receives the believing sinner returning to Him, and takes him into fellowship with Himself." Beyschlag rightly insists that James undoubtedly taught with the first apostles that whoever believes in Christ and is baptized receives the forgiveness of sins (<a onClick="return mV(\'Act\',2,38);">Ac 2:38</a>; <a onClick="return mV(\'Act\',3,19);">3:19</a>; <a onClick="return mV(\'Act\',10,43);">10:43</a>), and that he would not have contested the Pauline idea of justification by grace on account of faith, insisting only that works must follow. Theologically, the chief if not the only difference is that James has not yet made the cross of Christ the center of his point of view, while the atonement was fundamental with all Paul\'s thinking.<P>See, further, <a href="./study/isbe/search.html?string=JAMES,+EPISTLE+OF">JAMES, EPISTLE OF</a>.<P>III. The Old Testament.<P>A word in conclusion as to the Old Testament. All the New Testament writers built on the Old Testament. That there should be a cleft or contradiction between the Old Testament and what we call the New Testament would have been to them inconceivable. But they realized that that was the early dawn, while they lived in the light of day. Abraham believed in Yahweh; and He reckoned it to him for righteousness (<a onClick="return mV(\'Gen\',15,6);">Ge 15:6</a>; <a onClick="return mV(\'Rom\',4,3);">Ro 4:3</a>). Who does not keep all parts of the law all the time is condemned (<a onClick="return mV(\'Deu\',27,26);">De 27:26</a> Septuagint; <a onClick="return mV(\'Gal\',3,10);">Ga 3:10</a>; compare <a onClick="return mV(\'Psa\',14,1);">Ps 14</a>; <a onClick="return mV(\'Psa\',143,2);">143:2</a>; <a onClick="return mV(\'Rom\',3,20);">Ro 3:20</a>; see <a onClick="return mV(\'Rom\',3,\'9-20\');">3:9-20</a>, and the references to the Old Testament in the American Standard Revised Version). The prophets insisted upon the practical works of righteousness—"What doth Yahweh require of thee, but to do justly, and to love kindness, and to walk humbly with thy God?" (<a onClick="return mV(\'Mic\',6,8);">Mic 6:8</a>). No religious attitude or services could take the place of uprightness of life. This does not mean that the Old Testament writers understood that men were justified simply by their good deeds, for it was always believed that underneath all was the mercy and lovingkindness of God, whose forgiving grace was toward the broken and contrite spirit, the iniquities of whom were to be carried by the Servant of Yahweh, who shall justify many (<a onClick="return mV(\'Psa\',103,\'8-13\');">Ps 103:8-13</a>; <a onClick="return mV(\'Psa\',85,10);">85:10</a>; <a onClick="return mV(\'Isa\',57,15);">Isa 57:15</a>; <a onClick="return mV(\'Isa\',53,11);">53:11</a>, and many other passages). IV. Later Development of the Doctrine.<P>1. Apostolic and Early Church Fathers:<P>A brief statement now on the development of the doctrine in the Christian church. It is humiliating to confess that the witness immediately after the apostles (the apostolic Fathers) did not reach the serene heights of Paul, or even the lower levels of his brethren. There are passages which remind one of him, but one feels at once that the atmosphere is different. Christianity is conceived as a new law rather than as a gospel of the grace of God. We cannot go into the reasons for this: suffice it to say that in GentileChristendom the presuppositions for that gospel failed, and the New Testament writings were not yet in the consciousness of the church to the extent that they dominated her thinking. The fine passage in Clement of Rome (97 AD, chapter xxxii: "They all therefore (i.e. Abraham and other early saints) were glorified and magnified, not through themselves or their own works or the righteous doings which they wrought, but through His (God\'s) will. And so we, having been called through His will in Christ Jesus, are not justified through ourselves or through our own wisdom or understanding or piety or works which we wrought in holiness of heart, but through faith, whereby the Almighty God justified all men that ever have been from the beginning; to whom be glory forever and ever. Amen.") is not at all on a paragraph with his whole Epistle, as he coordinates faith with other virtues in chapter xxxv, makes hospitality and godliness the saving virtues for Lot in chapter xi, couples hospitality and faith together as equal for Rahab in chapter xii, and represents forgiveness of sins through keeping commandments and love in chapter l. Ignatius (about 110-15 AD) speaks in one place about Jesus Christ dying for us, that believing on His death we might escape death (Tral. 2), but with him the real saving things are love, concord, obedience to bishops, and the indwelling God = Christ, though he has also the excellent passage: "None of these things is hidden from you if ye be perfect in your faith and love toward Jesus Christ, for these things are the beginning and end of life—faith is the beginning and love the end, and the two being found in unit are God, while all things else follow in their train unto true nobility" (<a onClick="return mV(\'Eph\',1,4);">Eph 1:4</a>). The so-called Barnabas (date uncertain) puts the death of Christ Jesus at the foundation of salvation, which is expressed by the remission of sins through His blood (<a onClick="return mV(\'Eph\',5,\'1-\');">Eph 5</a>), the kingdom of Jesus being on the cross, so that they who set their hope on Him shall live forever (<a onClick="return mV(\'Eph\',6,\'1-\');">Eph 6</a>), while at the time even believers are not yet justified (<a onClick="return mV(\'Eph\',4,\'1-\');">Eph 4</a>), for which finally a whole series of works of light must be done and works of darkness avoided (<a onClick="return mV(\'Eph\',1,9);">Eph 1:9</a>). The Shepherd of Hermas and the Ancient Homily = 2 Clem are even more moralistic, where with whatever praise of faith we have the beginning of merit. The same legalistic tone sounds through that invaluable little roll found by Bryennios in 1873 and first published by him in Constantinople in December,1883,The Teaching (Didache) of the Twelve Apostles. That Catholic trend went forward till it is almost full-fledged as early as Tertullian (fl. 200 AD) and Cyprian (250 AD). See a full statement in my Cyprian,1906,146ff. And thus it continued until—as far as our outline is concerned—it struck Augustine, bishop of Hippo (396ff), who in a masterly and living way united, so far as they could be united, the Pauline thoughts of sin, grace, and justification with the regular Catholic legalism. His book, De Spiritu et Litera (412 AD), was largely after Paul\'s own heart, and the Reformers hailed it with joy. But the Catholic elements he still kept, as for instance, that in justification a good concupiscence and a good-will are infused, that justification grows, that our merits must be taken into the account even though they are God\'s merits, that the faith which justifies is a faith which works by love, that faith is the holding true what God (and the church) says, though occasionally a deeper view of faith is seen, and that works are emphasized, as in De fide et operibus, in a Catholic fashion. With profound and thoroughly Christian thoughts, Augustine had not so worked himself clear of his Catholic inheritance that he could reproduce Paul purely. He made a bridge by which we could go either back to Paul or forward to Aquinas. As Harnack well says, Augustine experienced, on the one hand, the last revival in the ancient church of the principle that "faith alone saves," and, on the other, he silenced that principle for a thousand years. The very Catholic theologian who stood nearest to that principle overcame it (Zeitschrift f. Theol. u. Kirche,1891,177). His misunderstanding of Paul\'s "faith that worketh through love" had momentous consequences.<P>2. Council of Trent:<P>Those consequences are best seen in the decrees of the Council of Trent (Session 6, 1547), to which we now turn, and which are the definite and final crystallization of the medieval development, so far as that development was Catholic.<P>(1) Justification is a translation from a natural state to a state of grace. With this works prevenient grace, awakening and assisting, and with this in his man cooperates and prepares himself for justification. This cooperation has the merit of congruity, though the first call comes before any merit.<P>(2) Faith is an element in justification. "Receiving faith by hearing, they of free will draw near to God, believing those things to be true which have been Divinely revealed and promised." Faith as a living trust in a personal Saviour for salvation is lacking. Among the truths believed is the mercy of God and that He wishes to justify the sinner in Christ.<P>(3) This faith begets love to Christ and hatred to sin, which are elements also of the justifying process.<P>(4) Now follows justification itself, "which is not a bare remission of sins, but also sanctification and renewal of the inner man through the voluntary reception of grace and of gifts."<P>(5) But this renewal must take place through baptism, which, to the prepared adult, both gives and seals all the graces of salvation, forgiveness, cleansing, faith, hope and love.<P>(6) Justification is preserved by obeying the commandments and by good works, which also increase it.<P>(7) In case it is lost—and it can be lost, not by venial, but by mortal sin and by unbelief—it can be regained by the sacrament of penance.<P>(8) To get it, to keep or regain it, it is also necessary to believe the doctrines as thus laid down and to be laid down by this Council (see the decrees in any edition, or in Mirbt, Quellen zur Geschichte des Papsttums, 2. Aufl., 206-16, or in Buckley\'s or in Waterworth\'s translations, and for an admirable and objective summary see Seeberg, History of Doctrine, II, 433-38).<P>3. Luther:<P>Recent researches in Luther\'s early writings have shown that almost from the beginning of his earnest study of religious questions, he mounted up to Paul\'s view of justification by faith alone (Loofs, DG, 4. Aufl.,1906, 696-98). Faith is the trust in the mercy of God through Christ, and justification is the declaring righteous for His sake, which is followed by a real making righteous. From the beginning to the end of his life as a religious teacher these are the elements of his doctrine. Speaking of 1513-15, Loofs says (p. 697): "Upon these equations (to justify = to forgive, grace = mercy of the non-imputing God, faith = trust in His mercy) as the regulators of his religious self-judgment, Luther\'s piety rests, and corresponding to them his view of Christianity, and even later" (than 1513-15); and he adds that "to reckon as righteous" (reputari justum) must not be understood with Luther as an opposition "to make righteous," for his "to be justified without merits" in the sense of "to forgive" (absolvi) is at the same time the beginning of a new life: remissio peccati...ipsa resurrectio. "His constantly and firmly held view, even more deeply understood later than in 1513-15, that \'to be justified without merit\' =\' to be resurrected (to be born again)\' =\' to be sanctified\' is a pregnant formulation of his Christianity." So much being said, it is not necessary to draw out Luther\'s doctrine further, who in this respect "rediscovered Christianity as a religion," but it will suffice to refer to the Histories of Doctrine (Seeberg gives a full and brilliant exposition), to Kostlin, Luthers Theologie, 2. Aufl., 1901 (see Index under the word "Rechtfertigung," and I, 349), and especially to Thieme, Die sittliche Triebkraft des Glaubens: eine Untersuchung zu Luthers Theologie,1895,103-314.<P>From Luther and the other reformers the New Testament doctrine went over to the Protestant churches without essential modification, and has remained their nominal testimony until the present. A classic expression of it, which may be taken as representing evangelical Christendom, is the 11th of the 39 Articles of Religion of the Church of England: "We are accounted righteous before God only for the merit of our Lord and Saviour Jesus Christ by faith, and not for our own works or deservings: wherefore that we are justified by faith only is a most wholesome doctrine and very full of comfort; as more largely is expressed in the Homily of Justification." It is true that at one time Wesley\'s opponents accused him of departing from this doctrine, especially on account of his famous Minute of 1770, but this was due to a radical misunderstanding of that Minute, for to the last he held staunchly Paul\'s doctrine (for proof see my article in Lutheran Quarterly, April,1906,171-75).<P>4. Schleiermacher:<P>A new point of view was brought into modern theology by Schleiermacher, who starts from the fundamental fact of Christian experience that we have redemption and reconciliation with Christ, which fact becomes ours by union with Christ through faith. This union brings justification with other blessings, but justification is not considered as even in thought a separate act based on Christ\'s death, but as part of a great whole of salvation, historically realized step by step in Christ. The trend of his teaching is to break down the distinction between justification and regeneration, as they are simply different aspects of union with Christ.<P>Ritschl carried forward this thought by emphasizing the grace of the heavenly Father mediated in the first instance through the Son to the Christian community, "to which God imputes the position toward him of Christ its founder," and in the second instance to individuals "as by faith in the Gospel they attach themselves to this community. Faith is simply obedience to God and trust in the revelation of his grace in Christ." This brings sinners into fellowship with God which means eternal life, which is here and now realized, as the Fourth Gospel points out, in lordship over the world (compare Franks in DCG, I, 922-23). The judicial or forensic aspect of justification so thoroughly in-wrought in Paul\'s thought is denied by Ritschl. "In whatsoever way we view the matter," he says, "the attitude of God in the act of justification cannot be conceived as that of a judge" (Christian Doctrine of Justification and Reconciliation, English translation,1900,90). W.N. Clarke agrees with Schleiermacher in eliminating justification as a separate element in the work of salvation, and harks back to the Catholic view in making it dependent on the new life and subsequent to it (Christian Theology, 407-8). No book has had as much influence in destroying the New Testament conception of justification among English-speaking readers as that of J. H. Newman, Lectures on Justification,1838,3rd edition,1874,which contains some of the finest passages in religious literature (pp. 270-73, 302, 338-39), but which was so sympathetic to the Catholic view that the author had nothing essential to retract when he joined Rome in 1845. "Whether we say we are justified by faith, or by works, or by sacraments, all these but mean this one doctrine that we are justified by grace which is given through sacraments, impetrated by faith, manifested in works" (p. 303).<P>5. Meaning and Message to the Modern Man:<P>Lastly, has the New Testament conception of justification by faith any message to the modern man, or is it, as Lagarde held, dead in the Protestant churches, something which went overboard with the old doctrine of the Trinity and of Atonement? After an able historical, survey, Holl concludes (Die Rechtfertigungslehre im Licht der Geschichte d. Protestantismus, Tubingen, 1906, 40-42) that there are two principles thoroughly congenial to modern thought which favor this doctrine, namely, that of the sanctity and importance of personality, the "I" that stands face to face with God, responsible to Him alone; and second, the restoration of the Reformation-thought of an all-working God. Whoever feels the pressure of these two principles, for him the question of justification becomes a living one. "The standard on which he must measure himself is the Absolute God, and who can stand in this judgment? Not simply on account of single acts, but with his \'I\' and even with his good-willing. For that is just the curse which rests upon a man that his \'I\' is the thing with which alone he wills and can seek God, and that it is this very \'I\' which by its willfulness, vanity and self-love poisons all his willing. Accordingly, it remains true, what the Reformers said, that man is entirely corrupt, and that he can do no otherwise than to despair when the majesty of God dawns upon him" (p. 41). There is, then, no other solution than the venture of faith that the same God who crushes our self-deceit lifts up with His sovereign grace, that we live through Him and before Him. Luther is right that religiously we can find no hold except on the Divine act of grace, which through faith in the Divine love and power working in us and for us ever makes us new in Christ. To give up the doctrine of justification, says Holl rightly (p. 42), is to give up conscious personal religion. Holl writes as a liberal, and he quotes a stronger liberal still, Treitschke, as saying that in the 19th century it was the orthodox preachers who proclaimed this doctrine, who built better than the liberals. Nor, says Holl in another book (Was hat die Rechtfertigungslehre dem modernen Menschen zu sagen? Tubingen,1907,26), can anyone who has experienced justification as an inner transformation be misled into moral unconcern. A moral ideal becomes his, much stronger and more compelling than worldly ethics. The new attitude toward God constituted by justification impels to an unending movement in the service of God and man. The doctrine has not had its day. It is a part of the eternal gospel. As long as sinful man has to do with an all-holy God, the experience of Paul, Luther and Wesley becomes in a sense normative for the race.<P>LITERATURE.<P>Besides the books mentioned in the text, the following on justification itself may be consulted (those marked with a star are Protestant, those with a dagger are Catholic or High Church Anglican): Goodwin, new edition, with preface by Wesley, 1807; Junkins, 1839; Hare, new edition, 1839 (1st edition with preface by Jackson, 1817); Kerwick, 1841; Heurtley, 1846 (Bampton Lectures for 1845); McIlvaine,1861,3rd edition, 1868 (Righteousness of Faith, important); Buchanan, 1867 (important); Body, 1870; Bunyan, new edition, 1873; Harkey, 1875; Davies, 1878; Sadler, 1888; and Holden, 1901. Besides these, Laurence, Bampton Lectures for 1804, sermon 6; Drummond, Apostolic Teaching and Christ\'s Teaching (see index); Schlatter, New Testament Theology, 2 volumes, 1909-10; the various systematic Theologies; Theologies of the New Testament, and Commentaries may be consulted; also Menegoz, Die Rechtfertigungslehre nach Paulus und nach Jakobus, 1903; Kuhl, Die Stellung des Jakobusbriefes z. alttest. Gesetz u. z. Paulinischen Rechtfertigungslehre, 1905.``58';
isbe[5238]='Justle`jus\'-l (shaqaq): The word occurs once in <a onClick="return mV(\'Nah\',2,4);">Na 2:4</a> (in the King James Version and the Revised Version (British and American)), where the American Standard Revised Version has "rush to and fro."``1';
isbe[5239]='Justus`jus\'-tus (Ioustos): There are three of this name mentioned in the New Testament.<P>(1) It was the Roman surname of <a href="./study/isbe/search.html?string=JOSEPH+BARSABBAS">JOSEPH BARSABBAS</a> (which see) (<a onClick="return mV(\'Act\',1,23);">Ac 1:23</a>).<P>(2) A Corinthian proselyte (sebomenos ton Theon), whose house adjoined the synagogue and who received Paul when the Jews opposed him (<a onClick="return mV(\'Act\',18,7);">Ac 18:7</a>). He was probably a Roman citizen, one of the colonies, and so he would be of assistance to the apostle in his work among the better class of Corinth. There is some disagreement among manuscripts regarding the name. Textus Receptus of the New Testament gives "Justus" alone. the Revised Version (British and American) following Codex Sinaiticus, Codex E, Vulgate, Bohairic, Armenian, gives "Titus Justus"; Westcott and Hort, The New Testament in Greek, Tischendorf, Codex Vaticanus, Codex Bezae, give "Titius Justus"; Cheyne (EB, under the word "Justus") thinks these forms a corruption of "Tertius Justus," and that the bearer of the name was the "Tertius" of <a onClick="return mV(\'Rom\',16,22);">Ro 16:22</a>. Paul still continued his lodgings with Aquila and Priscilla, but made the house of Justus his own synagogue.<P>(3) A Jew, Jesus Justus, mentioned with Mark and Aristarchus by Paul in his letters to the Colossians (<a onClick="return mV(\'Col\',4,11);">Col 4:11</a>), is a fellow-worker and one that had been a comfort unto him.``78';
isbe[5240]='Juttah; Jutah`jut\'-a, joo\'-ta (yuttah, <a onClick="return mV(\'Jos\',21,16);">Jos 21:16</a>; Septuagint Tanu; and in <a onClick="return mV(\'Jos\',15,55);">Jos 15:55</a> the King James Version, Septuagint Itan, A, Ietta); ju\'-ta (Yatah, <a onClick="return mV(\'Jos\',15,55);">Jos 15:55</a>): A town in the hill country of Judah, mentioned with Maon, Carmel and Ziph; a Levitical city (<a onClick="return mV(\'Jos\',21,16);">Jos 21:16</a>). In some versions of Septuagint it occurs (Iota) in <a onClick="return mV(\'1Ch\',6,57);">1Ch 6:57</a>. In the Eusebius, Onomasticon (266 49; 133 10) a large village called "Juttah" is described as 18 Roman miles from Eleutheropolis. This agrees with the position of Yutta, a large and prosperous Moslem village, 3,740 ft. above sea-level, 5 1/3 miles south of Hebron and 15 1/2 miles from Beit Jebrin (Eleutheropolis). There are many rock-cut tombs and ancient winepresses all around the village.<P>Reland (Pal, 870) suggested (and many others have followed him) that the ... polis Iouda, translated "city of Judah," in <a onClick="return mV(\'Luk\',1,39);">Lu 1:39</a>, should be polis Iouta, "the city Yuta." The translation "city of Judah" is suspicious, because Iouda is without the article, which is usually put before the name of a district; the interchange of "t" and "d" is a very common one. Dr. Paterson, resident many years in Hebron, states that there is a local Moslem tradition in the district that Yutta was the home of John the Baptist. For Yutta see PEF, III, 310, Sh XXI.``117';
isbe[5241]='Kab`kab (qabh, "something hollowed out," <a onClick="return mV(\'2Ki\',6,25);">2Ki 6:25</a>; the King James Version Cab): A Hebrew dry measure and liquid measure equal to about 2 quarts.`<a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`1';
isbe[5242]='Kabzeel`kab\'-ze-el, kab\'-zel (kabhtse\'el "(whom) God collects"): One of the "uttermost cities" of Judah toward the border of Edom in the south (Negeb) (<a onClick="return mV(\'Jos\',15,21);">Jos 15:21</a>). It was the native place of Benaiah, the son of Jehoiada, one of David\'s mighty men (<a onClick="return mV(\'2Sa\',23,20);">2Sa 23:20</a>; <a onClick="return mV(\'1Ch\',11,22);">1Ch 11:22</a>). "Jekabzeel and the villages thereof," one of the places re-inhabited by the men of Judah (<a onClick="return mV(\'Neh\',11,25);">Ne 11:25</a>), appears to be the same place. The site is unknown.``1';
isbe[5243]='Kadesh`ka\'-desh (qadhesh; Kades, <a onClick="return mV(\'Psa\',29,8);">Ps 29:8</a>; Judith 1:9).`<a href="./study/isbe/search.html?string=KADESH+BARNEA">KADESH-BARNEA</a>`1';
isbe[5244]='Kadesh in Galilee``<a href="./study/isbe/search.html?string=KEDESH">KEDESH</a>`1';
isbe[5245]='Kadesh On the Orontes`o-ron\'-tez (in Massoretic Text of <a onClick="return mV(\'2Sa\',24,6);">2Sa 24:6</a>, under the corrupt form tachtim chodhshi, which should be corrected from the Septuagint (Luc.) reading: eis ten genitive Chettieim Kades, "to the land of the Hittites unto Kadesh," into \'erets ha-chittim qadheshah. Ewald and others, fixing the northern ideal boundary of Israel at the sources of the Jordan, would read "Hermon" for chodhshi, but the conjectures of Thenius and Hitzig of a reference to the northern Kadesh are fully confirmed by the reading given): Kadesh was the southern capital of the Hittites, and was situated on the upper waters of the Orontes, 80 miles north of Damascus. It is now represented by a large mound 5 miles south of what, till the Middle Ages, was called the Lake of Kades, but now the Lake of Homs. Here Thothmes III of Egypt (flourished circa 1650 BC), after the battle of Megiddo, met and received hostages from the Assyrians, and here too Rameses II defeated Hatesar, king of the Hittites (circa 1320 BC), and concluded with him a treaty, which was formally inscribed on a disk of silver. The incidents of the battle are depicted on the walls of the Ramesseum, and an Egyptian epic records the heroic deeds of Rameses. Under the name Kadytis, it is mentioned as being taken by Pharaoh-necoh (Herodotus ii.159) in 609 BC. In the only Bible reference (<a onClick="return mV(\'2Sa\',24,6);">2Sa 24:6</a>), it is named as the northern limit of the census made by David.``23';
isbe[5246]='Kadesh-Barnea`ka\'-desh-bar\'-ne-a (qadhesh barnea\'; Kades): Mentioned 10 times; called also "Kadesh" simply. The name perhaps means "the holy place of the desert of wandering." There are references to Kadesh in early history. At En-mishpat ("the same is Kadesh") Chedorlaomer and his allies smote the Amalekite and Amorite. Abraham dwelt near Kadesh, and it was at Beer-lahai-roi between Kadesh and Bered that the Angel of Yahweh appeared to Hagar (<a onClick="return mV(\'Gen\',14,7);">Ge 14:7</a>; <a onClick="return mV(\'Gen\',16,14);">16:14</a>; <a onClick="return mV(\'Gen\',20,1);">20:1</a>). It was an important camp of the Israelites during their wanderings, and seems to have been their headquarters for 38 years (<a onClick="return mV(\'Deu\',1,2);">De 1:2</a>; <a onClick="return mV(\'Deu\',2,14);">2:14</a>; Judith 5:14). There the returning spies found the camp (<a onClick="return mV(\'Num\',13,26);">Nu 13:26</a>); there Miriam died and was buried (<a onClick="return mV(\'Num\',20,1);">Nu 20:1</a>); from thence messengers were sent to the king of Edom (<a onClick="return mV(\'Num\',20,14);">Nu 20:14</a>; <a onClick="return mV(\'Jdg\',11,16);">Jud 11:16</a>). There the people rebelled because of the want of water, and Moses brought water from the rock (<a onClick="return mV(\'Num\',20,2);">Nu 20:2</a>); it was called therefore Meribath—or Meriboth-Kadesh (<a onClick="return mV(\'Num\',27,14);">Nu 27:14</a>; <a onClick="return mV(\'Eze\',47,19);">Eze 47:19</a>; <a onClick="return mV(\'Eze\',48,28);">48:28</a>). It was situated in the wilderness of Zin (<a onClick="return mV(\'Num\',20,1);">Nu 20:1</a>; <a onClick="return mV(\'Num\',33,36,37);">33:36,37</a>) in the hill country of the Amorites (<a onClick="return mV(\'Deu\',1,19);">De 1:19</a>), 11 days\' journey from Horeb, by the way of Mt. Seir (<a onClick="return mV(\'Deu\',1,2);">De 1:2</a>), "in the uttermost" of the border of Edom (<a onClick="return mV(\'Num\',20,16);">Nu 20:16</a>), and on the southern border, probably the southeast corner, of Judah (<a onClick="return mV(\'Eze\',47,19);">Eze 47:19</a>; compare Judith 19). See Cobern, Homiletic Review, April and May, 1914.``78';
isbe[5247]='Kadmiel`kad\'-mi-el (qadhmi\'el, "before God," "priest"(?); "Cadmiel" in parallel lists in 1Esdras 5:26,58 the King James Version; omitted in Septuagint Codex Vaticanus; Codex Alexandrinus reads kai Kadmielon): A Levite (<a onClick="return mV(\'Ezr\',2,40);">Ezr 2:40</a>; <a onClick="return mV(\'Neh\',7,43);">Ne 7:43</a>), founder of a family whose descendants returned from captivity with Zerubbabel (<a onClick="return mV(\'Ezr\',2,1);">Ezr 2:1</a>; <a onClick="return mV(\'Neh\',7,43);">Ne 7:43</a>; <a onClick="return mV(\'Neh\',12,1,8);">12:1,8</a>). He is named among those who praise God for the return (<a onClick="return mV(\'Neh\',9,4,5);">Ne 9:4,5</a>; <a onClick="return mV(\'Neh\',12,24);">12:24</a>); was of those who "set forward" the work of the Lord\'s house (<a onClick="return mV(\'Ezr\',3,9);">Ezr 3:9</a>; 1Esdras 5:26,58), and is again mentioned with those who "seal" the new Return Covenant (<a onClick="return mV(\'Neh\',10,28);">Ne 10:28</a>) after the re-establishment of worship (<a onClick="return mV(\'Neh\',10,1,9);">Ne 10:1,9</a>).``1';
isbe[5248]='Kadmonite`kad\'-mon-it (qadhmoni; Kedmonaioi, signifies "the Easterner," or, less probably, "one of the ancient race"): The Kadmonites are mentioned in <a onClick="return mV(\'Gen\',15,19);">Ge 15:19</a> along with the Kenites and Kenizzites of Edom, and are doubtless the same as "the children of the east," whose wisdom was celebrated (<a onClick="return mV(\'1Ki\',4,30);">1Ki 4:30</a>). qedhemah, "the East," was a son of Ishmael (<a onClick="return mV(\'Gen\',25,15);">Ge 25:15</a>; compare <a onClick="return mV(\'Gen\',25,6);">Ge 25:6</a>). In an Egyptian story describing the adventures of a political refugee who fled from Egypt in the time of the XIIth Dynasty, it is said that he found a refuge in Canaan in the land of Kaduma or Kedem.``157';
isbe[5249]='Kain (1)`kan (ha-qayin; the King James Version Cain): A town in the hill country of Judah (<a onClick="return mV(\'Jos\',15,57);">Jos 15:57</a>). There is, too, apparently a reference to this place in <a onClick="return mV(\'Num\',24,21,22);">Nu 24:21,22</a>:<P class="in15">"And he looked on the Kenite, and took up his parable, and said,<br>Strong is thy dwelling-place,<br>And thy nest is set in the rock.<br>Nevertheless Kain shall be wasted,<br>Until Asshur shall carry thee away captive."<P>This place has been very doubtfully identified as the ruin Yukin, a place on a lofty hill southeast of Hebron, overlooking the wilderness of Judah; the tomb of Cain is shown there. See PEF, III, 312, Sh XXI.``117';
isbe[5250]='Kain (2)`(qayin): A clan name, the King James Version "the Kenite" (<a onClick="return mV(\'Num\',24,22);">Nu 24:22</a>; <a onClick="return mV(\'Jdg\',4,11);">Jud 4:11</a>). In the first passage the Revised Version (British and American) has "Kain" and margin "the Kenites"; in the second, the Revised Version (British and American) has "the Kenite" in text and margin "Kain."`<a href="./study/isbe/search.html?string=KAIN+1">KAIN 1</a>`1';
isbe[5251]='Kallai`kal\'-a-i, kal\'-i (qallay, qal, "swift"): A priest among those who returned with Zerubbabel (<a onClick="return mV(\'Neh\',12,1);">Ne 12:1</a>). He represented the family of Sallai (<a onClick="return mV(\'Neh\',12,20);">Ne 12:20</a>).``1';
isbe[5252]='Kamon`ka\'-mon (qamon; the King James Version Camon): The place where Jair was buffed (<a onClick="return mV(\'Jdg\',10,\'3-5\');">Jud 10:3-5</a>). It is possibly represented either by Kamm or Kumeim, ruins which lie about 6 and 7 miles respectively to the south-southeast of Umm Keis. See further <a href="./study/isbe/search.html?string=HAVVOTH-JAIR">HAVVOTH-JAIR</a>. The ruins of Kamm, about 200 yds. square, crown a small elevation, and point to an important place in the past. There are large rock-hewn cisterns to the south. Among the ruins of Kumein, which are not considerable, a few mud huts are built, occupied today by about 200 souls (Schumacher, Northern \'Ajlun, 137).``1';
isbe[5253]='Kanah`ka\'-na (qanah, "reeds"):<P>(1) The name of a "brook," i.e. wady, or "torrent bed," which formed part of the boundary between Ephraim and Manasseh (<a onClick="return mV(\'Jos\',16,8);">Jos 16:8</a>; <a onClick="return mV(\'Jos\',17,9);">17:9</a>). The border of Ephraim went out westward from Tappuah to the brook Kanah, ending at the sea; the border of Manasseh from Tappuah, which belonged to Ephraim, "went down unto the brook of Kanah, southward of the brook." There seems no good reason to doubt the identification of "the brook Kanah" with the modern Wady Kanah. The transition from the heavy "q" to the lighter "k" is easy, so the phonetic difficulty is not serious. The stream rises in the southwest of Shechem, flows through Wady Ishkar, and, joining the \'Aujeh, reaches the sea not far to the north of Jaffa. Guerin, influenced, apparently, by the masses of reeds of various kinds which fill the river, argues in favor of Nahr el-Fallq, to the north of Arsuf. He identifies it with Nahr el-Kasab, "river of reeds," mentioned by Beha ed-Din, the Moslem historian. But this last must be identified with Nahr el-Mafjir, 13 miles farther north, too far north for "the brook Kanah."<P>(2) A town on the northern boundary of Asher (<a onClick="return mV(\'Jos\',19,28);">Jos 19:28</a>), probably identical with the village of Qana, about 7 miles southeast of Tyre (SWP, I,51,64, Sh I).``54';
isbe[5254]='Kaph`kaf "k": The 11th letter of the Hebrew alphabet; transliterated in this Encyclopedia as "k", with daghesh, and "kh" (= German ch) without daghesh. It came also to be used for the <span class="noTag">number 20</span>.`<a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>`1';
isbe[5255]='Kareah`ka-re\'-a (qareach, "bald head"): The father of Johanan and Jonathan, who after the fall of Jerusalem joined Gedaliah at Mizpah (<a onClick="return mV(\'2Ki\',25,23);">2Ki 25:23</a>; <a onClick="return mV(\'Jer\',40,8);">Jer 40:8</a>).``1';
isbe[5256]='Kariathiarius`ka-ri-ath-i-a\'-ri-us (Kariathiarios; Codex Vaticanus reads Kartatheiareios; the King James Version, Kiriathiarim (1Esdras 5:19))= Kiriath-jearim in <a onClick="return mV(\'Neh\',7,29);">Ne 7:29</a>.``1';
isbe[5257]='Karka`kar\'-ka (ha-qarqa\'ah—with the article and locale; the King James Version Karkaa): A place in the south of Judah, between Addar and Wady el-\'Arish (<a onClick="return mV(\'Jos\',15,3);">Jos 15:3</a>). Eusebius, Onomasticon speaks of a village in Judah lying toward the wilderness, named Akarka. It cannot now be identified. The name means "the pavement,"\' or "ground."``1';
isbe[5258]='Karkor`kar\'-kor (qarqor): An unidentified place where Gideon surprised and overwhelmed the remnants of the army of Zeba and Zalmunnah (<a onClick="return mV(\'Jdg\',8,10);">Jud 8:10</a>). It probably corresponds to Qarkar mentioned by Shalmaneser II, S. of Hamath (KB, I, 173).``1';
isbe[5259]='Kartah`kar\'-ta (qartah): A city in the territory of Zebulun, assigned to the Levites (<a onClick="return mV(\'Jos\',21,34);">Jos 21:34</a>). It is not identified. Possibly it is a variant of <a href="./study/isbe/search.html?string=KATTATH">KATTATH</a>, or of <a href="./study/isbe/search.html?string=KARTAN">KARTAN</a> (which see).``1';
isbe[5260]='Kartan`kar\'-tan (qartan): A city in the territory of Naphtali, given to the Gershonite Levites (<a onClick="return mV(\'Jos\',21,32);">Jos 21:32</a>). It is called Kiriathaim in <a onClick="return mV(\'1Ch\',6,76);">1Ch 6:76</a>. Kartan may be a contraction of this. Cheyne (EB, under the word) suggests that both names may be corruptions from "Chinnereth." Neither is mentioned in <a onClick="return mV(\'Jos\',19,32,38);">Jos 19:32,38</a>, in the list of Naphtalite cities, while Chinnereth is.``1';
isbe[5261]='Kattath`kat\'-ath (qattath): A city in the territory of Zebulun, named with Iphtah-el, Nahalel, and Shimron (<a onClick="return mV(\'Jos\',19,15);">Jos 19:15</a>), perhaps to be identified with Kitron (<a onClick="return mV(\'Jdg\',1,30);">Jud 1:30</a>), from which Zebulun did not expel the Canaanites; and with Kartah (<a onClick="return mV(\'Jos\',21,34);">Jos 21:34</a>), which was given to the Merarite Levites. The Babylonian Talmud (Meg. 6a) identifies Kattath with Sepphoris, the modern Seffuriyeh (but see Neubauer, Geographie du Talmud, 191). The Jerusalem Talmud takes it as identical with Ketunith, Kuteineh, to the west of Esdraelon. It should probably, however, be sought near to Shimron, the modern Semuniyeh.``54';
isbe[5262]='Kedar`ke\'-dar (qedhar; Kedar): Second in order of the sons of Ishmael (<a onClick="return mV(\'Gen\',25,13);">Ge 25:13</a> parallel <a onClick="return mV(\'1Ch\',1,29);">1Ch 1:29</a>). The name occurs as typical of a distant eastern country in opposition to the lands of the Mediterranean (<a onClick="return mV(\'Jer\',2,10);">Jer 2:10</a>). The author of Second Isaiah introduces this tribe in company with Nebaioth, and both are represented as owners of flocks (<a onClick="return mV(\'Isa\',60,7);">Isa 60:7</a>). Evidence of their nomadic habits appears in <a onClick="return mV(\'Jer\',49,28,29);">Jer 49:28,29</a>, where they are classed among the Bene-Qedhem, and mention is made of their flocks, camels, tents, curtains and furniture. They are spoken of (<a onClick="return mV(\'Isa\',42,11);">Isa 42:11</a>) as dwelling in chatserim ("villages"), from which it would appear that they were a somewhat settled tribe, corresponding to the Arabic chadariya or "town-dwellers," as distinct from wabariya or "nomads." Ezekiel (<a onClick="return mV(\'Eze\',27,21);">27:21</a>) gives another hint of their pastoral nature where, in his detailed picture of the wealth of Tyre, Kedar and Arabia provide the Tyrians with lambs, rams and goats. The fame of the tribe is further reflected in <a onClick="return mV(\'Isa\',21,16,17);">Isa 21:16,17</a> (the only allusion to their might in war), and in the figurative references to their tents (<a onClick="return mV(\'Psa\',120,5);">Ps 120:5</a>; <a onClick="return mV(\'Sgs\',1,5);">So 1:5</a>). In this last passage where the tents are made symbolic of dark beauty, the word qadhar ("to be black") may have been in the writer\'s mind.<P>The settlements of Kedar were probably in the northwest of Arabia, not far from the borders of Palestine. Assyrian inscriptions have thrown light upon the history of the tribe. There Kedar is mentioned along with the Arabs and Nebaioth, which decides its identity with Kedar of the Old Testament, and there is found also an account of the conflicts between the tribe and King Assurbanipal (see Margoliouth in HDB).<P>Of the Ishmaelite tribes, Kedar must have been one of the most important, and thus in later times the name came to be applied to all the wild tribes of the desert. It is through Kedar (Arabic, keidar) that Muslim genealogists trace the descent of Mohammed from Ishmael.``63';
isbe[5263]='Kedemah`ked\'-e-ma, ke-de\'-ma (qedhemah, "eastward"): Son of Ishmael (<a onClick="return mV(\'Gen\',25,16);">Ge 25:16</a>), head of a clan (<a onClick="return mV(\'1Ch\',1,31);">1Ch 1:31</a>).`<a href="./study/isbe/search.html?string=KADMONITE">KADMONITE</a>`1';
isbe[5264]='Kedemoth`ked\'-e-moth, ke-de\'-moth (qedhemoth, "eastern parts"): From the wilderness to which this town gave its name, Moses sent messengers to Sihon, king of the Amorites in Heshbon (<a onClick="return mV(\'Deu\',2,26);">De 2:26</a>). It was given by Moses to the tribe of Reuben (<a onClick="return mV(\'Jos\',13,18);">Jos 13:18</a>), and assigned to the Merarite Levites (<a onClick="return mV(\'Jos\',21,37);">Jos 21:37</a>; <a onClick="return mV(\'1Ch\',6,79);">1Ch 6:79</a>). It must probably be sought on the upper course of the Arnon. Buhl (GAP, 268) suggests that it may be identified with Umm er-Resas.`<a href="./study/isbe/search.html?string=JAHAZ">JAHAZ</a>`1';
isbe[5265]='Kedesh (1)`ke\'-desh (qedhesh; Kades):<P>(1) One of the "uttermost cities" of Judah "toward the border of Edom in the south" (<a onClick="return mV(\'Jos\',15,23);">Jos 15:23</a>). Possibly it is to be identified with <a href="./study/isbe/search.html?string=KADESH-BARNEA">KADESH-BARNEA</a> (which see); otherwise it is strange that this latter should be omitted from the list. Dillmann would identify it with Kadus, to the south of Hebron, mentioned by Muqaddasi.<P>(2) A town in the territory of Issachar, given to the Gershonite Levites (<a onClick="return mV(\'1Ch\',6,72);">1Ch 6:72</a>). In the list of Joshua (<a onClick="return mV(\'Jos\',21,28);">21:28</a>) its place is taken by <a href="./study/isbe/search.html?string=KISHION">KISHION</a> (which see). Conder suggests identification with Tell Abu Qades, near Megiddo.<P>(3) Kedesh-naphtali, the famous city of refuge in the uplands of Naphtali. It is called "Kedesh," simply, in <a onClick="return mV(\'Jos\',12,22);">Jos 12:22</a>, etc.; Kedesh-naphtali in <a onClick="return mV(\'Jdg\',4,6);">Jud 4:6</a>; Tobit 1:2; Kedesh in Galilee in <a onClick="return mV(\'Jos\',20,7);">Jos 20:7</a>, etc. It was assigned to the Gershonite Levites (<a onClick="return mV(\'1Ch\',6,76);">1Ch 6:76</a>). From the name "holy," we gather that it was a sanctuary from old time. It was therefore a place of asylum, and only preserved its ancient character in this respect when chosen as one of the cities of refuge. It was the home of Barak, and here his host assembled. When the Assyrians invaded the land under Tiglath-pileser, it was among the first cities to be captured, and its inhabitants were deported (<a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>). Near Kedesh was fought the great battle between Jonathan the Maccabee and Demetrius (1Macc 11:63ff). Josephus says that in his time it belonged to the Tyrians, lying between their land and that of Galilee (Ant., XIII, v, 6; B J, II, xviii, 1; IV, ii,3,etc.). Eusebius, Onomasticon places it 20 miles from Tyre, near to Paneas. It is represented by the modern village of Kedes, which lies on the plateau to the west of el-Chuleh. It crowns a tell which runs out in a low ridge into the little plain to the west. Near the fountain, which rises under the ridge to the north, are the most interesting of the ancient remains. There are many fine sarcophagi, some of them being used as watering-troughs. From its lofty situation, Kedesh commanded a spacious view over a richly varied landscape, With smiling cornfields, and hills clothed with oak and terebinth.``54';
isbe[5266]='Kedesh (2)`(1Maccc 11:63,73, Codex Alexandrinus, Kedes; the King James Version Cades): Scene of a battle between Judas Maccabeus and the forces of Demetrius.`<a href="./study/isbe/search.html?string=KEDESH">KEDESH</a>`1';
isbe[5267]='Kedesh-Naphtali`ke\'-desh-naf\'-ta-li.`<a href="./study/isbe/search.html?string=KEDESH">KEDESH</a>`1';
isbe[5268]='Keeper; Keepers`kep\'-er, (mostly from shamar; phulax): The word is used of keepers of sheep, vineyards, doors, prisons (in <a onClick="return mV(\'Gen\',39,21);">Ge 39:21</a>ff, car; compare <a onClick="return mV(\'Act\',5,23);">Ac 5:23</a>), etc. In <a onClick="return mV(\'Ecc\',12,3);">Ec 12:3</a>, "The keepers of the house shall tremble," the allusion is to the decay of bodily powers, the "keepers" being specially the arms, which had become feeble through age.``1';
isbe[5269]='Kehelathah`ke-he-la\'-tha, ke-hel\'-a-tha (qehlathah, "gathering," "assembly"): A desert camp of the Israelites between Rissah and Mt. Shepher (<a onClick="return mV(\'Num\',33,22,23);">Nu 33:22,23</a>). Situation is unknown.`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[5270]='Keilah`ke-i\'-la (qe\'ilah; Keeilam):<P>(1) A city of the Shephelah mentioned (<a onClick="return mV(\'Jos\',15,44);">Jos 15:44</a>) along with Nezib, Aehzib and Mareshah. Among those who repaired the walls of Jerusalem was "Hashabiah, the ruler of half the district of Keilah, for his district. After him repaired their brethren, Bavvai the son of Henadad, the ruler of half the district of Keilah" (<a onClick="return mV(\'Neh\',3,17,18);">Ne 3:17,18</a>).<P>1. David and Keilah:<P>It is, however, from the story of the wandering of David that we have most information regarding this place. It was a city with gates and bars (<a onClick="return mV(\'1Sa\',23,7);">1Sa 23:7</a>). The Philistines came against it and commenced robbing the threshing-floors. David, after twice inquiring of Yahweh, went down with his 600 men (<a onClick="return mV(\'1Sa\',23,13);">1Sa 23:13</a>) and "fought with the Philistines, and brought away their cattle, and slew them with great slaughter." Saul hearing that David and his men were within a fortified town "summoned all the people to war, to go down to Keilah, to besiege David and his men" (<a onClick="return mV(\'1Sa\',23,8);">1Sa 23:8</a>). Then David asked Abiathar the priest to bring him an ephod, and he inquired of Yahweh whether, if Saul came, the men of Keilah would surrender him to save that city; hearing from Yahweh, "They will deliver thee up," he and all his men escaped from Keilah and went into the wilderness. The reputed strength of Keilah is confirmed by its mention in 5 tablets in the Tell el-Amarna Letters under the name of Kilts (qilti, Petrie) with Gedor, Gath, Rabbah and Gezer.<P>2. Identification:<P>Although other identifications were proposed by the older topographers, there is now a general consensus of opinion that the site of this city is Khurbet Kila (Josephus, Ant, VI, xiii,1,in his account of David\'s adventure calls the place "Killa"). It is a hill covered with ruins in the higher part of Wady es Sur, 1,575 ft. above sea-level, whose terraced sides are covered with grainfields. The Eusebius, Onomasticon (Latin text) states that it was 8 miles from Eleutheropolis, which is about the distance of Khurbet Kila from Beit Jibrin. Beit Nusib (Nezib) is a couple of miles away, and Tell Sandahannah (Mareshah) but 7 miles to the west (<a onClick="return mV(\'Jos\',15,44);">Jos 15:44</a>). An early Christian tradition states that the prophet Habakkuk was buried at Keilah.<P>(2) The <a href="./study/isbe/search.html?string=GARMITE">Garmite</a> (which see), <a onClick="return mV(\'1Ch\',4,19);">1Ch 4:19</a>; see PEF, 314, Sh XXI.``117';
isbe[5271]='Kelaiah`ke-la\'-ya, ke-li\'-a (qelayah, "swift for Yah"[?]; Kolios; Codex Vaticanus, Konos): One of the priests who had "foreign wives" (<a onClick="return mV(\'Ezr\',10,23);">Ezr 10:23</a>, also "Kelita"). In parallel list of 1Esdras 9:23, he again has a double name—"Colius" and "Calitas." A "Kelita" is named as helping Ezra at the expounding of the law (<a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>; compare 1Es 9:48, "Calitas"), and also among the signatories of the covenant (<a onClick="return mV(\'Neh\',10,9);">Ne 10:9</a>; for nature of covenant see <a onClick="return mV(\'Neh\',10,28);">Ne 10:28</a>). They may not, however, be the same person.``1';
isbe[5272]='Kelita`kel\'-i-ta, ke-li\'-ta (qelita\' "dwarf").`<a href="./study/isbe/search.html?string=KELAIAH">KELAIAH</a>`1';
isbe[5273]='Kemuel`kem\'-u-el, ke-mu\'-el (qemu\'el, "God\'s mound"):<P>(1) Nephew of Abraham (<a onClick="return mV(\'Gen\',22,21);">Ge 22:21</a>), father of Aram, whom Ewald identifies with Ram of <a onClick="return mV(\'Job\',32,2);">Job 32:2</a>; but compare <a onClick="return mV(\'Gen\',10,22);">Ge 10:22</a>, where Aram is described as one of the children of Shem. They may not be the same person.<P>(2) Prince of Ephraim, one of the land commissioners who divided Canaan (<a onClick="return mV(\'Num\',34,24);">Nu 34:24</a>).<P>(3) A Levite, father of Hashabiah, one of the tribal princes of David\'s time, a ruler among the Levites (<a onClick="return mV(\'1Ch\',27,17);">1Ch 27:17</a>).``1';
isbe[5274]='Kenan`ke\'-nan (qenan; Kainan): A son of Enosh, the son of Seth (<a onClick="return mV(\'Gen\',5,9,10,12,13,14);">Ge 5:9,10,12,13,14</a>; <a onClick="return mV(\'1Ch\',1,2);">1Ch 1:2</a>). The King James Version form (except in <a onClick="return mV(\'1Ch\',1,2);">1Ch 1:2</a>), is "Cainan."``1';
isbe[5275]='Kenath`ke\'-nath (qenath; Kaath kaanath, in Septuagint, Codex Alexandrinus): A city in Bashan, taken along with its "daughters," i.e. "villages" from the Amorites by Nobah who gave it his own name (<a onClick="return mV(\'Num\',32,42);">Nu 32:42</a>). It was recaptured by Geshur and Aram (<a onClick="return mV(\'1Ch\',2,23);">1Ch 2:23</a>). It is probably identical with the modern Kanawat, which is built on the site, and largely from the materials of an ancient city. It lies about 16 miles to the north of Bosra eski Sham, the Bostra of the Romans, on both sides of Wady Kanawat, where, descending from the slopes of Jebel ed-Druze, it plunges over a precipice, forming a picturesque waterfall. On the plateau above the modern village, there is a striking collection of Roman and Christian remains, the shapely forms of many columns lending distinction to the scene. One large building is associated with the name of the patriarch Job—Maqam Ayyub. The position commands a spacious and interesting view over the whole of the Chauran. The identification has been rejected by Socin (Baedeker, Pal3, 207), but his reasons are not given. Moore (Judges, 222) also rejects it, but for reasons that are not convincing.``54';
isbe[5276]='Kenaz; Kenez`ke\'-naz, ke\'-nez (qenaz "hunting"):<P>(1) A "duke" of Edom, grandson of Esau (<a onClick="return mV(\'Gen\',36,11,15,42);">Ge 36:11,15,42</a>; <a onClick="return mV(\'1Ch\',1,36,53);">1Ch 1:36,53</a>).<P>(2) Father of Othniel (<a onClick="return mV(\'Jos\',15,17);">Jos 15:17</a>; <a onClick="return mV(\'Jdg\',1,13);">Jud 1:13</a>; <a onClick="return mV(\'Jdg\',3,9,11);">3:9,11</a>; <a onClick="return mV(\'1Ch\',4,13);">1Ch 4:13</a>).<P>(3) The unidentified qenaz of <a onClick="return mV(\'1Ch\',4,15);">1Ch 4:15</a>, who appears to be a descendant of (2). There is, however, some difficulty with the passage here.``1';
isbe[5277]='Kenezite`ke\'-nez-it (qenizzi; Kenezaios): the King James Version in <a onClick="return mV(\'Gen\',15,19);">Ge 15:19</a> and the Revised Version (British and American) uniformly, spell "Kenizzite." The Kenezites were the clan whose name-father was <a href="./study/isbe/search.html?string=KENAZ">KENAZ</a> (which see). Their land, along with that of their Canaanite tribes, was promised to Abram (<a onClick="return mV(\'Gen\',15,19);">Ge 15:19</a>). To this clan belonged Jephunneh, the father of Caleb (<a onClick="return mV(\'Num\',32,12);">Nu 32:12</a>; <a onClick="return mV(\'Jos\',14,6,14);">Jos 14:6,14</a>). It had evidently been absorbed by the tribe of Judah. If the Kenezites went down with Jacob into Egypt, they may have become identified with his family there.``1';
isbe[5278]='Kenites`ke\'-nits (ha-qeni, haqeni; in <a onClick="return mV(\'Num\',24,22);">Nu 24:22</a> and <a onClick="return mV(\'Jdg\',4,11);">Jud 4:11</a>, qayin; of hoi Kenaioi, hoi Kinaioi): A tribe of nomads named in association with various other peoples. They are first mentioned along with the Kadmonites and Kenizzites among the peoples whose land was promised to Abram (<a onClick="return mV(\'Gen\',15,19);">Ge 15:19</a>). Balaam, seeing them from the heights of Moab; puns upon their name, which resembles the Hebrew ken, "a nest," prophesying their destruction although their nest was "set in the rock"—possibly a reference to Sela, the city. Moses\' father-in-law, Jethro, is called "the priest of Midian" in <a onClick="return mV(\'Exd\',3,1);">Ex 3:1</a>; <a onClick="return mV(\'Exd\',18,1);">18:1</a>; but in <a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a> he is described as a Kenite, showing a close relation between the Kenites and Midian. At the time of Sisera\'s overthrow, Heber, a Kenite, at "peace" with Jabin, king of Hazor, pitched his tent far north of his ancestral seats (<a onClick="return mV(\'Jdg\',4,17);">Jud 4:17</a>). There were Kenites dwelling among the Amalekites in the time of Saul (<a onClick="return mV(\'1Sa\',15,6);">1Sa 15:6</a>). They were spared because they had "showed kindness to all the children of Israel, when they came up out of Egypt." David, in his answer to Achish, links the Kenites with the inhabitants of the south of Judah (<a onClick="return mV(\'1Sa\',27,10);">1Sa 27:10</a>). Among the ancestors of the tribe of Judah, the Chronicler includes the Kenite Hammath, the father of the Rechabites (<a onClick="return mV(\'1Ch\',2,55);">1Ch 2:55</a>). These last continued to live in tents, practicing the ancient nomadic customs (<a onClick="return mV(\'Jer\',35,6);">Jer 35:6</a>).ichly varied landscape, With smiling cornfields, and hills clothed with oak and terebinth.<P>The word qeni in Aramaic means "smith." Professor Sayce thinks they may really have been a tribe of smiths, resembling "the gipsies of modern Europe, as well as the traveling tinkers or blacksmiths of the Middle Ages" (HDB, under the word). This would account for their relations with the different peoples, among whom they would reside in pursuit of their calling.<P>In Josephus they appear as Kenetides, and in Ant, IV, vii, 3 he calls them "the race of the Shechemites."``54';
isbe[5279]='Kenizzite`ken\'-i-zit.`<a href="./study/isbe/search.html?string=KENEZITE">KENEZITE</a>`1';
isbe[5280]='Kenosis`ke-no\'-sis: The word "kenosis" (kenosis) has entered theological language from <a onClick="return mV(\'Phl\',2,7);">Php 2:7</a>, where in the sentence he "emptied himself" the Greek verb is ekenosen. "Kenosis," then, the corresponding noun, has become a technical term for the humiliation of the Son in the incarnation, but in recent years has acquired a still more technical sense, i.e. of the Son\'s emptying Himself of certain attributes, especially of omniscience.<P>1. The New Testament:<P>(1) The theological question involved was one about as far as possible from the minds of the Christians of the apostolic age and apparently one that never occurred to Paul. For in <a onClick="return mV(\'Phl\',2,7);">Php 2:7</a> the only "emptying" in point is that of the (external) change from the "form of God" to the "form of a servant." Elsewhere in the New Testament it is usually taken as a matter of course that Christ\'s knowledge was far higher than that of other men (<a onClick="return mV(\'Jhn\',2,24);">Joh 2:24</a> is the clearest example). But passages that imply a limitation of that knowledge do exist and are of various classes. Of not much importance are the entirely incidental references to the authorship of Old Testament passages where the traditional authorship is considered erroneous, as no other method of quotation would have been possible. Somewhat different are the references to the nearness of the Parousia (especially <a onClick="return mV(\'Mat\',10,23);">Mt 10:23</a>; <a onClick="return mV(\'Mat\',24,29);">24:29</a>). But with these it is always a question how far the exact phraseology has been framed by the evangelists and, apart from this, how far Christ may not have been consciously using current imagery for the impending spiritual revolution, although knowing that the details would be quite different (see <a href="./study/isbe/search.html?string=PAROUSIA">PAROUSIA</a>). Limitation of knowledge may perhaps be deduced from the fact that Christ could be amazed (<a onClick="return mV(\'Mat\',8,10);">Mt 8:10</a>, etc.), that He could be really tempted (especially <a onClick="return mV(\'Hbr\',4,15);">Heb 4:15</a>), or that He possessed faith (<a onClick="return mV(\'Hbr\',12,2);">Heb 12:2</a>; see commentary). More explicitly Christ is said to have learned in <a onClick="return mV(\'Luk\',2,52);">Lu 2:52</a>; <a onClick="return mV(\'Hbr\',5,8);">Heb 5:8</a>. And, finally, in <a onClick="return mV(\'Mar\',13,32);">Mr 13:32</a> parallel <a onClick="return mV(\'Mat\',24,36);">Mt 24:36</a>, Christ states categorically that He is ignorant of the exact time of the Parousia.<P>(2) An older exegesis felt only the last of these passages as a real difficulty. A distinction constructed between knowledge naturally possessed and knowledge gained by experience (i.e. although the child Jesus knew the alphabet naturally, He was obliged to learn it by experience) covered most of the others. For <a onClick="return mV(\'Mar\',13,32);">Mr 13:32</a> a variety of explanations were offered. The passage was translated "neither the Son, except the Father know it," a translation that can be borne by the Greek. But it simply transfers the difficulty by speaking of the Father\'s knowledge as hypothetical, and is an impossible translation of <a onClick="return mV(\'Mat\',24,36);">Mt 24:36</a>, where the word "only" is added. The explanations that assume that Christ knew the day but had no commission to reveal it are most unsatisfactory, for they place insincere words in His mouth; "It is not for you to know the day" would have been inevitable form of the saying (<a onClick="return mV(\'Act\',1,7);">Ac 1:7</a>).<P>2. Dogmatic:<P>(1) Yet the attempt so to misinterpret the verses is not the outcome of a barren dogmatic prejudice, but results from a dread lest real injury be done to the fundamentals of Christian consciousness. Not only does the mind of the Christian revolt from seeing in Christ anything less than true God, but it revolts from finding in Him two centers of personality—Christ was One. But as omniscience is an essential attribute of God, it is an essential attribute of the incarnate Son. So does not any limitation of Christ\'s human knowledge tend to vitiate a sound doctrine of the incarnation? Certainly, to say with the upholders of the kenosis in its "classical" form that the Son, by an exercise of His will, determined to be ignorant as man, is not helpful, as the abandonment by God of one of His own essential attributes would be the preposterous corollary.<P>(2) Yet the Biblical data are explicit, and an explanation of some kind must be found. And the solution seems to lie in an ambiguous use of the word "knowledge," as applied to Christ as God and as man. When we speak of a man\'s knowledge in the sense discussed in the kenotic doctrine, we mean the totality of facts present in his intellect, and by his ignorance we mean the absence of a fact or of facts from that intellect. Now in the older discussions of the subject, this intellectual knowledge was tacitly assumed (mystical theology apart) to be the only knowledge worthy of the name, and so it was at the same time also assumed that God\'s knowledge is intellectual also—"God geometrizes." Under this assumption God\'s knowledge is essentially of the same kind as man\'s, differing from man\'s only in its purity and extent. And this assumption is made in all discussions that speak of the knowledge of the Son as God illuminating His mind as man.<P>(3) Modern critical epistemology has, however, taught man a sharp lesson in humility by demonstrating that the intellect is by no means the perfect instrument that it has been assumed to be. And the faults are by no means faults due to lack of instruction, evil desires, etc., but are resident in the intellect itself, and inseparable from it\' as an intellect. Certain recent writers (Bergson, most notably) have even built up a case of great strength for regarding the intellect as a mere product of utilitarian development, with the defects resulting naturally from such an evolution. More especially does this restriction of the intellect seem to be true in religious knowledge, even if the contentions of Kant and (espescially) Ritschl be not fully admitted. Certain it is, in any case, that even human knowledge is something far wider than intellectual knowledge, for there are many things that we know that we never could have learned through the intellect, and, apparently, many elements of our knowledge are almost or quite incapable of translation into intellectual termsú Omniscience, then, is by no means intellectual omniscience, and it is not to be reached by any mere process of expansion of an intellect. An "omniscient intellect" is a contradiction in termsú<P>(4) In other words, God\'s omniscience is not merely human intellectual knowledge raised to the infinite power, but something of an entirely different quality, hardly conceivable to human thought—as different from human intellectual knowledge as the Divine omnipotence is different from muscular strength. Consequently, the passage of this knowledge into a human intellect is impossible, and the problem of the incarnation should be stated: What effect did Divine omniscience in the person have on the conscious intellect of the manhood? There is so little help from the past to be gained in answering this question, that it must remain open at present—if, indeed, it is ever capable of a full answer. But that ignorance in the intellect of the manhood is fully consistent with omniscience in the person seems to be not merely a safe answer to the question as stated, but an inevitable answer if the true humanity of Christ is to be maintained at all.<P>LITERATURE.<P>Sanday\'s Christology and Personality, 1911, and La Zouche, The Person of Christ in Modern Thought, 1912, are among the latest discussions of the subject, with very full references to the modern literature.``48';
isbe[5281]='Keras`ke\'-ras (Kiras): In 1Esdras 5:29, the head of a family of temple-servants, called "Keroz" in <a onClick="return mV(\'Ezr\',2,44);">Ezr 2:44</a>; <a onClick="return mV(\'Neh\',7,47);">Ne 7:47</a>.``1';
isbe[5282]='Kerchief`ker\'-chif (micpachoth; epibolaia): Occurs only in <a onClick="return mV(\'Eze\',13,18,21);">Eze 13:18,21</a>, in a passage which refers to some species of divination. Their exact shape or use is unknown. They were apparently long veils or coverings put over the heads of those consulting the false prophetesses and reaching down to the feet, for they were for "persons of every stature."``1';
isbe[5283]='Keren-Happuch`ker\'-en-hap\'-uk, ke\'-ren-hap\'-uk (qeren happukh, "horn of antimony," i.e. beautifier; Septuagint Amaltheias keras): The 3rd daughter of Job (<a onClick="return mV(\'Job\',42,14);">Job 42:14</a>), born after his restoration from affliction. Antimony, producing a brilliant black, was used among the Orientals for coloring the edges of the eyelids, making the eyes large and lustrous. Hence, the suggestiveness of this name of an article of the ladies\' toilet, a little horn or receptacle for the eye-paint.``1';
