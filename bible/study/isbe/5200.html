isbe[5202]='Judas of Galilee`(ho Galilaios): Mentioned in <a onClick="return mV(\'Act\',5,37);">Ac 5:37</a> as the leader of an insurrection occasioned by the census of Quirinius in 7 AD (see <a href="./study/isbe/search.html?string=QUIRINIUS">QUIRINIUS</a>). He, and those who obeyed him, it is said, perished in that revolt. Josephus also repeatedly mentions Judas by this same name, "the Galilean," and speaks of his revolt (Ant., XVIII, i, 6; XX, v, 2; BJ, II, viii, 1; xviii, 8; VII, viii, 1), but in Ant, XVIII, i, names him a Gaulonite, of the city of Gamala. As Gamala was in Gaulonitis, not far from the eastern shore of the Sea of Galilee, it may be regarded as belonging to that province. The party of Judas seems to have been identified with the Zealots.``132';
isbe[5203]='Judas of James`(Ioudas Iakobou): One of the twelve apostles (<a onClick="return mV(\'Luk\',6,16);">Lu 6:16</a>; <a onClick="return mV(\'Act\',1,13);">Ac 1:13</a>; for etymology, etc., see <a href="./study/isbe/search.html?string=JUDAS">JUDAS</a>). the King James Version has the reading "brother of James," and the Revised Version (British and American) reads "son of James." The latter is to be preferred. In <a onClick="return mV(\'Jhn\',14,22);">Joh 14:22</a> he is described as "Judas (not Iscariot)." The name corresponds with the "Thaddaeus" or "Lebbaeus whose surname was Thaddaeus" of <a onClick="return mV(\'Mat\',10,3);">Mt 10:3</a> the King James Version and <a onClick="return mV(\'Mar\',3,18);">Mr 3:18</a> (compare <a href="./study/isbe/search.html?string=THADDAEUS">THADDAEUS</a>). The identification of Thaddaeus with Judas is generally accepted, though Ewald and others hold that they were different). The identification of Thaddaeus with Judas is generally accepted, though Ewald and others hold that they were different persons, that Thaddeus died during Christ\'s lifetime, and that Judas was chosen in his place (compare Bruce, Training of the Twelve, 34). If the Revised Version (British and American) is accepted as the correct rendering of <a onClick="return mV(\'Luk\',6,16);">Lu 6:16</a> and <a onClick="return mV(\'Act\',1,13);">Ac 1:13</a>, this Judas cannot be identified either with the Juda (<a onClick="return mV(\'Mar\',6,3);">Mr 6:3</a> the King James Version), Judas (<a onClick="return mV(\'Mar\',6,3);">Mr 6:3</a> the Revised Version (British and American)), or Judas (<a onClick="return mV(\'Mat\',13,55);">Mt 13:55</a>), the brother of Jesus; or with the Judas (<a onClick="return mV(\'Jud\',1,1);">Jude 1:1</a> the Revised Version margin) or Jude (<a onClick="return mV(\'Jud\',1,1);">Jude 1:1</a> the King James Version), the brother of James, whether these two latter Judases are to be regarded as the same or not. The only incident recorded of Judas of James is in <a onClick="return mV(\'Jhn\',14,22);">Joh 14:22</a>, where during Christ\'s address to the disciples after the last supper he put the question, "Lord, what is come to pass that thou wilt manifest thyself unto us, and not unto the world?"``88';
isbe[5204]='Judas, Juda`(1) The name of an ancestor of Jesus (<a onClick="return mV(\'Luk\',3,30);">Lu 3:30</a>). In the King James Version it occurs also in <a onClick="return mV(\'Luk\',3,26);">Lu 3:26</a>, but the Revised Version (British and American) has "Joda" (Westcott-Hort, Ioda).<P>(2) <a href="./study/isbe/search.html?string=JUDAS+ISCARIOT">Judas Iscariot</a> (see separate article).<P>(3) One of the brothers of Jesus (<a onClick="return mV(\'Mat\',13,55);">Mt 13:55</a>; <a onClick="return mV(\'Mar\',6,3);">Mr 6:3</a>).<P>See <a href="./study/isbe/search.html?string=JUDE">JUDE</a>.<P>(4) An apostle, "not Iscariot" (<a onClick="return mV(\'Jhn\',14,22);">Joh 14:22</a>). He is generally identified with Lebbaeus (<a onClick="return mV(\'Mat\',10,3);">Mt 10:3</a>) and Thaddeus (<a onClick="return mV(\'Mar\',3,18);">Mr 3:18</a>). See <a href="./study/isbe/search.html?string=LEBBAEUS">LEBBAEUS</a>; <a href="./study/isbe/search.html?string=THADDAEUS">THADDAEUS</a>. He is called <a href="./study/isbe/search.html?string=JUDAS+OF+JAMES">JUDAS OF JAMES</a> (which see) (<a onClick="return mV(\'Luk\',6,16);">Lu 6:16</a>; <a onClick="return mV(\'Act\',1,13);">Ac 1:13</a>), which means "the son of James" not (the King James Version) "the brother of James."<P>(5) A Galilean who stirred up rebellion "in the days of the enrollment" (<a onClick="return mV(\'Act\',5,37);">Ac 5:37</a>).<P>See <a href="./study/isbe/search.html?string=JUDAS+OF+GALILEE">JUDAS OF GALILEE</a>.<P>(6) One with whom Paul lodged in Damascus, whose house was in "the street which is called Straight" (<a onClick="return mV(\'Act\',9,11);">Ac 9:11</a>). Nothing further is known of him. A house is pointed out as his, in a lane off the Straight Street.<P>(7) <A href="./study/isbe/search.html?string=JUDAS+BARSABBAS">Judas Barsabbas</a> (<a onClick="return mV(\'Act\',15,22,27,32);">Ac 15:22,27,32</a>; see separate article).``78';
isbe[5205]='Judas, Not Iscariot`(Ioudas ouch ho Iskariotes): One of the Twelve Apostles (<a onClick="return mV(\'Jhn\',14,22);">Joh 14:22</a>).`<a href="./study/isbe/search.html?string=JUDAS+OF+JAMES">JUDAS OF JAMES</a>; <a href="./study/isbe/search.html?string=LEBBAEUS">LEBBAEUS</a>; <a href="./study/isbe/search.html?string=THADDAEUS">THADDAEUS</a>`1';
isbe[5206]='Judas, the Lord\'s Brother``<a href="./study/isbe/search.html?string=JUDE">JUDE</a>`1';

isbe[5208]='Jude`jood (Ioudas): Brother of the Lord, and author of the Epistle of Jude.`<a href="./study/isbe/search.html?string=JUDAS+OF+JAMES">JUDAS OF JAMES</a>`1';
isbe[5209]='Jude, the Epistle of`<b>THE WRITER</b><P><b>I. JUDE\'S POSITION IN THE CANON</b><P><b>II. THE OCCASION OF ITS COMPOSITION</b><P><b>III. DESCRIPTION OF THE LIBERTINES AND APOSTATES</b><P><b>IV. RELATION OF JUDE TO THE SECOND EPISTLE OF PETER</b><P class="in15">1. Resemblances<P class="in15">2. Differences<P class="in15">3. Further Contrasts<P class="in15">4. Summary<P class="in15">5. Evidence of Priority of Peter<P class="in15">6. Corroborative References<P><b>V. DATE OF THE EPISTLE</b><P><b>VI. THE LIBERTINES OF JUDE\'S EPISTLE</b><P><b>LITERATURE</b><hr /><P>The Writer:<P>The writer of this short epistle calls himself Jude or Judas (Ioudas. His name was a common one among the Jews: there were few others of more frequent use. Two among the apostles bore it, namely, Judas, mentioned in <a onClick="return mV(\'Jhn\',14,22);">Joh 14:22</a> (compare <a onClick="return mV(\'Luk\',6,16);">Lu 6:16</a>), and Judas Iscariot. Jude describes himself as "a servant of Jesus Christ, and brother of James" (<a onClick="return mV(\'Jud\',1,1);">Jude 1:1</a>). The James here mentioned is no doubt the person who is called "the Lord\'s brother" (<a onClick="return mV(\'Gal\',1,19);">Ga 1:19</a>), the writer of the epistle that bears his name. Neither of the two was an apostle. The opening sentence of Jude simply affirms that the writer is a "servant of Jesus Christ." This, if anywhere, should be the appropriate place for the mention of his apostleship, if he were an apostle. The appellation "servant of Jesus Christ" "is never thus barely used in an address of an epistle to designate an apostle" (Alford). <a onClick="return mV(\'Phl\',1,1);">Php 1:1</a> has a similar expression, "Paul and Timothy, servants of Jesus Christ," but "the designation common to two persons necessarily sinks to the rank of the inferior one." In other instances "servant" is associated with "apostle" (<a onClick="return mV(\'Rom\',1,1);">Ro 1:1</a>; <a onClick="return mV(\'Tts\',1,1);">Tit 1:1</a>). <a onClick="return mV(\'Jud\',1,17,18);">Jude 1:17,18</a> speaks of the "apostles of our Lord Jesus Christ; that they said to you"—language which an apostle would hardly use of his fellow-apostles.<P>In <a onClick="return mV(\'Mar\',6,3);">Mr 6:3</a> are found the names of those of whom Jesus is said to be the brother, namely, James and Joses, and Judas and Simon. It is quite generally held by writers that the James and Judas here mentioned are the two whose epistles are found in the New Testament. It is noteworthy, however, that neither of them hints at his relationship with Jesus; their unaffected humility kept them silent. Jude mentions that he is the "brother of James," perhaps to give authority and weight to his words, for James was far more distinguished and influential than he. The inference seems legitimate that Jude addresses Christians among whom James was highly esteemed, or, if no longer living, among whom his memory was sacredly revered, and accordingly it is altogether probable that Jude writes to the same class of readers as James—Jewish Christians. James writes to the "Twelve Tribes of the Dispersion." Jude likewise addresses a wide circle of believers, namely, the "called, beloved in God the Father, and kept for Jesus Christ" (<a onClick="return mV(\'Jud\',1,1);">1:1</a>). While he does not designate a special and distinct class, yet as James\'s "brother," as belonging to the family of Joseph, and as in some true sense related to the Lord Jesus Himself, it seems probable, if not certain, that his Epistle was intended for Christian Hebrews who stood in urgent need of such testimony and appeal as Jude offers.<P>I. Jude\'s Position in the Canon.<P>It is now and for a long while has been an assured one. Its rank, though not altogether that of 1 Peter and 1 John, is high, for centuries indeed undoubted. Almost from the beginning of the Christian era men every way qualified to speak with authority on the question of genuineness and authenticity endorsed it as entitled to a place in the New Testament Scriptures. Origen repeatedly quotes it, in one place describing it as an "ep. of but few lines, but full of powerful words of heavenly grace" (Matt., tom. X, 17). But Origen knew that it was not universally received. Clement of Alexandria "gave concise expositions of all the canonical Scriptures, not omitting the disputed books—the Epistle of Jude and the other Catholic epp." (quoted by Westcott, Canaanite, 322-23 and Salmon, Intro, 493). Tertullian (Cult. Fem. i.3) in striving to establish the authority of the Book of Enoch urges as a crowning argument that it is quoted by "the apostle Jude." "We may infer that, Jude\'s Ep, was an unquestioned part of Tertullian\'s Canon. Athanasius inserted it in his list of New Testament books, but Eusebius placed it among the disputed books in his classification. The Canon of Muratori includes Jude among the books of Scripture, though it omits the Epistles of James, Peter and Hebrews. This is one of the earliest documents containing a list of the New Testament books now known. By the great majority of writers the date of the fragment is given as circa 170 AD, as it claims to have been written not long after Pius was bishop of Rome, and the latest date of Pius <span clas="noTag">is</span> 142-57 AD. The words of the document are, "The Shepherd was written very recently in our own time by Hermas, while his brother Pius sat in the chair of the Church of Rome." Twenty or twenty-five years would probably satisfy the period indicated by the words, "written very recently in our own time," which would fix the date of the fragment at circa 170 AD. Salmon, however, strongly inclines to a later date, namely, circa 200-210 AD, as does Zahn.<P>Zahn (Introduction to the New Testament, II,259,English Translation), and Professor Chase (H D B) are of the decided opinion that the Didache, ii. 7: "Thou shalt not hate anyone, but some thou shalt rebuke, and for some thou shalt pray, and some thou shalt love above thine own soul (or life)," is rounded on <a onClick="return mV(\'Jud\',1,22);">Jude 1:22</a>. Dr. Philip Schaff dates the Didache between 90-100 AD. L\'Abbe E. Jacquier (La doctrine des Douze Apotres, 1891) is persuaded that the famous document was written not later than 80 AD. It appears, therefore, more than probable that the Epistle of Jude was known and referred to as Scripture some time before the end of the 1st century. From the survey we have thus rapidly taken of the field in which the Epistle circulated, we may conclude that in Palestine, at Alexandria, in North Africa, and at Rome, it was received as the veritable letter of Jude, "the servant of Jesus Christ, and brother of James."<P>The chief reason why it was rejected by some and regarded with suspicion by others in primitive times is its quotation from the apocryphal Book of Enoch, so Jerome informs us (Vir. Ill., 4). It is possible that Jude had in mind another spurious writing, namely, the Assumption of Moses, when he spoke of the contention of Michael the archangel with the devil about the body of Moses (1:9). This, however, is not quite certain, for the date assigned to that writing is circa 44 AD, and although Jude might have seen and read it, yet its composition is so near his own day that it could hardly have exerted much influence on his mind. Besides, the brevity of the Epistle and its dealing with a special class of errorists would limit to a certain extent its circulation among Christians. All this serves to explain its refusal by some and the absence of reference to it by others.<P>II. The Occasion of Its Composition.<P>Jude, after his brief introduction (<a onClick="return mV(\'Jud\',1,1,2);">1:1,2</a>), explains very definitely why he writes as he does. He indicates distinctly his anxiety on behalf of the saints (<a onClick="return mV(\'Jud\',1,3);">1:3</a>): "Beloved, while I was giving all diligence to write unto you of our common salvation, I was constrained to write unto you exhorting you to contend earnestly for the faith which was once for all delivered unto the saints." He had received very distressing knowledge of the serious state into which the Christian brotherhood was rapidly drifting, and he must as a faithful servant of Jesus Christ exhort them to steadfastness and warn them of their danger. He had in mind to write them a doctrinal work on the salvation common to all Christians. Perhaps he contemplated the composition of a book or treatise that would have discussed the great subject in an exhaustive manner. But in face of the perils that threatened, of the evils already present in the community, his purpose was indefinitely postponed. We are not told how he became acquainted with the dangers which beset his fellow-believers, but the conjecture is probably correct that it was by means of his journeys as an evangelist. At any rate, he was thoroughly conversant with the evils in the churches, and he deals with them as befitted the enormities that were practiced and the ruin that impended.<P>The address of the Epistle is remarkable for the affection Jude expresses for these saints. Obviously they are distinct from the libertines of whom he speaks with such solemn condemnation. They were the faithful who kept aloof from the ungodly that surrounded them, and who held fast to the truth they had been taught. Jude describes them as those "that are called, beloved in God the Father, and kept for Jesus Christ: Mercy unto you and peace and love be multiplied." At the close of the Epistle he commends them "unto him that is able to guard you from stumbling, and to set you before the presence of his glory without blemish in exceeding joy." A separated and devoted band they certainly were, a noble and trustworthy company of believers for whose well-being Jude was supremely anxious.<P>III. Description of the Libertines and Apostates.<P>It is needful to gaze with steady vision on the portrait Jude furnishes of these depraved foes, if we are to appreciate in any measure the force of his language and the corruption already wrought in the brotherhood. Some of their foul teachings and their vicious practices, not all, are here set down.<P>1. Surreptitious Foes.<P>"For there are certain men crept in privily...ungodly men" (<a onClick="return mV(\'Jud\',1,4);">Jude 1:4</a>). They are enemies who feign to be friends, and hence, in reality are spies and traitors; like a stealthy beast of prey they creep into the company of the godly, actuated by evil intent.<P>2. Perverters of Grace and Deniers of Christ.<P>"Turning the grace of our God into lasciviousness, and denying our only Master and Lord, Jesus Christ" (<a onClick="return mV(\'Jud\',1,4);">Jude 1:4</a>). They are those who by a vile perverseness turn the grace and the liberty of the Gospel into a means for gratifying their unholy passions, and who in doctrine and life repudiate their Master and Lord.<P>3. Censorious and Arrogant Detractors.<P>"In their dreamings defile the flesh, and set at nought dominion, and rail at dignities" (<a onClick="return mV(\'Jud\',1,8);">Jude 1:8</a>). Destitute of true reverence, they rail at the holiest and best things, and sit in judgment on all rule and all authority. They have the proud tongue of the lawless: "Our lips are our own: who Is lord over us?" (<a onClick="return mV(\'Psa\',12,4);">Ps 12:4</a>).<P>4. Ignorant Calumniators and Brutish Sensualists.<P>"These rail at whatsoever things they know not: and what they understand naturally, like the creatures without reason, in these things are they destroyed" (<a onClick="return mV(\'Jud\',1,10);">Jude 1:10</a>). What they do not know, as something lofty and noble, they deride and denounce; what they know is that which ministers to their disordered appetites and their debased tastes.<P>5. Hypocrites and Deceivers.<P>"These are they who are hidden rocks in your love-feasts when they feast with you, shepherds that without fear feed themselves; clouds without water...autumn trees without fruit...wild waves of the sea...wandering stars, for whom the blackness of darkness hath been reserved forever" (<a onClick="return mV(\'Jud\',1,12,13);">Jude 1:12,13</a>). A most graphic picture of the insincerity, the depravity, and the doom of these insolents! And yet they are found in the bosom of the Christian body, even sitting with the saints at their love-feasts!<P>6. Grumblers, Fault-finders, Pleasure-seekers, Boasters, Parasites.<P>"These are murmurers, complainers, walking after their own lusts...showing respect of persons for the sake of advantage" (<a onClick="return mV(\'Jud\',1,16);">Jude 1:16</a>). They impeach Divine wisdom, are the foes of peace and quietness, boast of their capacities to manage things, and yet they can be servile, even sycophants, when thereby advantage is secured.<P>7. Schismatics and Sensualists.<P>"These are they who make separations, sensual, having not the Spirit" (<a onClick="return mV(\'Jud\',1,19);">Jude 1:19</a>). It was characteristic of the false teachers and mockers who had invaded the Christian church that they drew lines of demarcation between themselves and others, or between different classes of believers, which the Holy Spirit did not warrant, but which was the product of their own crafty and wicked wills. There seems to be a hint in these words of incipient Gnosticism, that fatal heresy that boasted of a recondite knowledge, a deep mystery which only the initiated possessed, of which the great mass of Christians were ignorant. Jude brands the pretension as the offspring of their own sensuality, not at all of God\'s Spirit.<P>Such is the forbidding portrait drawn of the libertines in the Epistle. But Jude adds other and even darker features. He furnishes a number of examples of apostates and of apostasy which disclose even more strikingly the spirit and the doom of them that pervert the truth, that deny the Lord Jesus Christ, and that mock at the things of God. These all mark a fatal degeneracy, a "falling away," which bodes nothing but evil and judgment. Against the corrupters and skeptics Jude writes with a vehemence that in the New Testament is without a parallel. Matters must have come to a dreadful pass when the Spirit of God is compelled to use such stern and awful language.<P>IV. Relation of Jude to the Second Epistle of Peter.<P>1. Resemblances:<P>The relation is confined to <a onClick="return mV(\'2Pe\',2,1);">2Pe 2-3:4</a>. A large portion of Peter\'s Epistle, namely, <a onClick="return mV(\'2Pe\',1,\'1-\');">2 Peter 1</a> and <a onClick="return mV(\'2Pe\',3,\'5-18\');">3:5-18</a>, bears no resemblance to Jude, at least no more than does James or 1 Peter. Between the sections of 2 Peter indicated above and Jude the parallelism is close, both as to the subjects treated and the historical illustrations introduced, and the language itself to some considerable extent is common to both. All readers must be impressed with the similarity. Accordingly, it is very generally held by interpreters that one of the writers copied from the other. There is not entire agreement as to which of the two epistles is the older, that is, whether Peter copied from Jude, or Jude from Peter. Perhaps a majority favor the former of the two alternatives, though some of the very latest and most learned of those who write on Introductions to the New Testament hold strongly to the view that Jude copied from 2 Peter. Reference is made particularly to Deuteronomy. Theodore v. Zahn, whose magnificent work on Introduction has been but recently translated into English, and who argues convincingly that Jude copied from 2 Petter.<P>2. Differences:<P>However, it must be admitted that there are in the two epistles as pronounced differences and divergences as there are resemblances. If one of the two did actually copy from the other, he was careful to add, subtract, and change what he found in his "source" as best suited his purpose. A servile copyist he certainly was not. He maintained his independence throughout, as an exact comparison of the one with the other will demonstrate.<P>If we bring them into close proximity, following the example of Professor Lumby in the "Bible Comm." (Intro to 2 Peter), we shall discover a marked difference between the two pictures drawn by the writers. We cannot fail to perceive how much darker and more sinister is that of Jude. The evil, alarming certainly in Peter, becomes appalling in Jude. Subjoined are proofs of the fact above stated:<P><a onClick="return mV(\'2Pe\',2,1);">2 Peter 2:1</a> But there arose false prophets also among the people, as among you also there shall be false teachers ....<P><a onClick="return mV(\'Jud\',1,4);">Jude 1:4</a> For there are certain men crept in privily...<P><a onClick="return mV(\'2Pe\',2,1);">2 Peter 2:1</a> who shall privily bring in destructive heresies, denying even the Master that bought them...<P><a onClick="return mV(\'Jud\',1,4);">Jude 1:4</a>...ungodly men, turning the grace of God into lasciviousness, and denying our only Master and Lord, Jesus Christ.<P><a onClick="return mV(\'2Pe\',2,3);">2 Peter 2:3</a> And in covetousness shall they with feigned words make merchandise of you...<P><a onClick="return mV(\'Jud\',1,16);">Jude 1:16</a>...murmerers, complainers, walking after their own lusts (and their mouth speaketh great swelling words), showing respect of persons for the sake of advantage.<P>These contrasts and comparisons between the two epistles prove<P>(1) that in Jude the false teachers are worse, more virulent than in Peter, and<P>(2) that in Peter the whole description is predictive, whereas in Jude the deplorable condition is actually present.<P>If 2Pe is dependent on Jude, if the apostle cited from Jude, how explain the strong predictive element in his opening verses (<a onClick="return mV(\'2Pe\',2,\'1-3\');">2Pe 2:1-3</a>)? If as Peter wrote he had lying before him Jude\'s letter, which represents the corrupters as already within the Christian community and doing their deadly work, his repeated use of the future tense is absolutely inexplicable. Assuming, however, that he wrote prior to Jude, his predictions become perfectly intelligible. No doubt the virus was working when he wrote, but it was latent, undeveloped; far worse would appear; but when Jude wrote the poison was widely diffused, as <a onClick="return mV(\'Jud\',1,12,19);">1:12,19</A> clearly show. The very life of the churches was endangered.<P><a onClick="return mV(\'2Pe\',2,4,5);">2 Peter 2:4,5</a> For if God spared not the angels when they sinned...and spared not the ancient world, but preserved Noah with seven others ....<P><a onClick="return mV(\'Jud\',1,5,6);">Jude 1:5,6</a> ...The Lord, having saved a people out of the land of Egypt, afterward destroyed them...and angels that...left their proper habitation...<P>3. Further Contrasts:<P>Peter speaks of the angels that sinned, Jude of their apostasy. Peter makes prominent the salvation of Noah and his family when the flood overwhelmed the world of the ungodly, while Jude tells of those who, delivered from bondage, afterward were destroyed because of their unbelief. He speaks of no rescue; we know of but two who survived the judgments of the wilderness and who entered the Land of Promise, Caleb and Joshua. Peter mentions the fate of the guilty cities of Sodom and Gomorrah, but he is careful to remind us of the deliverance of righteous Lot, while Jude makes prominent their nameless crimes and consigns them to "the punishment of eternal fire," but he is silent on the rescue of Lot. Manifestly Jude\'s illustrations are darker and more hopeless than Peter\'s.<P>Peter instances Balsam as an example of one who loved the hire of wrongdoing and who was rebuked for his transgression. But Jude cites three notable instances in the Old Testament to indicate how far in apostasy and rebellion the libertines had gone. Three words mark their course, rising into a climax, "way" "error" "gainsay." They went in the way of Cain, i.e. in the way of self-will, of hate, and the spirit of murder. Moreover, they "ran riotously in the error of Balsam for hire." The words denote an activity of viciousness that enlisted all their eagerness and all their might. Balaam\'s error was one that led into error, one that seduced others into the commission of the like sins. The reference seems to be to the whole career of this heathen prophet, and includes his betrayal of the Israelites through the women of Moab (<a onClick="return mV(\'Num\',31,16);">Nu 31:16</a>). Balsam is the prototype of Jude\'s libertines, both in his covetousness and his seductive counsel. Furthermore, they "perished in the gainsaying of Korah." This man with 250 followers rebelled against the Divinely appointed leaders and rulers of Israel, Moses and Aaron, and sought to share their authority in Israel, if not to displace them altogether. Comparable with these rebels in ancient Israel are the treacherous and malignant foes whom Jude so vigorously denounces.<P>Peter speaks of them as "daring, self-willed, they tremble not to rail at dignities: whereas angels, though greater in might and power, bring not a railing judgment against them before the Lord" (<a onClick="return mV(\'Jud\',1,10,11);">Jude 1:10,11</a>). Jude is more specific: These dreamers "defile the flesh, and set at nought dominion, and rail at dignities." They repudiate all authority, despise every form of lordship, and revile those in positions of power. He cites the contention of Michael the archangel with the devil about the body of Moses, and yet this loftiest of the heavenly spirits brought no railing judgment against the adversary. Jude\'s description is more vivid and definite: he describes an advanced stage of apostasy.<P>Very noteworthy is <a onClick="return mV(\'Jud\',1,22,23);">Jude 1:22,23</a>. He here turns again to the loyal and stedfast believers whom he addresses at the beginning of his letter, and he gives them directions how they are to deal with those who were ensnared by the wily foes. (The text in <a onClick="return mV(\'Jud\',1,22);">1:22</a> is somewhat uncertain, but the revision is followed.) There were some who were "in doubt." They were those who had been fascinated by the new teaching, and although not captured by it, they were engaged in its study, were drawn toward it and almost ready to yield. On these the faithful were to have mercy, were to convince them of their danger, show them the enormities to which the false system inevitably leads, and so win them back to Christ\'s allegiance. As if Jude said, Deal with the wavering in love and fidelity; but rescue them if possible.<P>There were others whose peril was greater: "And some save, snatching them out of the fire." These were identified with the wicked, were scorched by the fires of destruction and hence, almost beyond reach of rescue; but if possible they are to be saved, however seethed and blackened. Others still there were who were in worse state than the preceding, who were polluted and smirched by the foul contamination of the guilty seducers, and such were to be saved, and the rescuers were to fear lest they should be soiled by contact with the horrible defilement. This is Jude\'s tremendous summary of the shameful work and frightful evils wrought in the bosom of the church by the libertines. He discloses in these trenchant verses how deeply sunk in sin the false teachers were, and how awful the ruin they had wrought. The description is quite unparalleled in 2 Peter. The shadings in Jude are darker and deeper than those in 2 Peter.<P>4. Summary:<P>The comparison between the two writings warrants, we believe, the following conclusions:<P>(1) that Peter and Jude have in view the same corrupt parties;<P>(2) that Peter paints them as godless and extremely dangerous, though not yet at their worst; while Jude sets them forth as depraved and as lawless as they can well be;<P>(3) that Peter\'s is the older writing and that Jude was acquainted with what the apostle had written.<P>Stronger evidence than any yet produced of Peter\'s priority is now to be submitted, and here we avail ourselves in part of Zahn\'s array of evidence.<P>5. Evidence of Priority of Peter:<P>Jude asserts with great positiveness that (<a onClick="return mV(\'Jud\',1,4);">1:4</A>) certain men had crept in privily into the Christian fold, "even they who were of old written of beforehand unto this condemnation, ungodly men." Obviously Jude is here speaking of the enemies whom he afterward goes on to describe and denounce in his Epistle. He distinctly affirms that these foes had been of old written of and beforehand designated unto "this condemnation." He clearly has in mind an authoritative writing that spoke of the identical parties Jude himself deals with. He does not tell us whose writing it is that contains the "condemnation" of the errorists; he only declares that there is such a Scripture existing and that he is acquainted with it. Now, to what writing does he refer? Not to any Old Testament prophecy, for none can be found that answers to the words. Nor yet to the prediction of Enoch (<span class="noTag">1:14,15</A>), for it speaks of the advent of the Lord in judgment at the last day, whereas Jude applies his reference to the ungodly who were then present in the Christian assemblies, corrupting the churches with their wicked teaching and practices. "In <a onClick="return mV(\'2Pe\',2,\'1-\');">2Pe 2</a>-<a onClick="return mV(\'2Pe\',3,\'1-4);">3:4</a>, we have a prophecy which exactly suits, namely, the announcement that false teachers whose theory and practice exactly correspond to those godless bearers of the Christian name in Jude will appear among a certain group of Jewish Christian churches" (Zahn). Peter\'s account of them is so particular that Jude would encounter no difficulty in identifying them. He is furnished by the apostle with such characteristics of them, with such illustrations and even words and phrases that he has only to place the description alongside of the reality to see how completely they match.<P>It may be objected that the words, "were of old written of beforehand," denote a long period, longer than that which elapsed between the two epistles. But the objection is groundless. The original term for "of old" (palai) sometimes indicates but a brief space of time, e.g. <a onClick="return mV(\'Mar\',15,44);">Mr 15:44</a> (according to the text of Weymouth and Nestle, and the Revised Version (British and American)) relates that Pilate asked the centurion if Jesus had been "any while" (palai) dead, which limits the term to a few hours. In <a onClick="return mV(\'2Cr\',12,19);">2Co 12:19</a> the word occurs, and there it must be restricted to Paul\'s self-defense which occupies the part of the Epistle preceding, and hence, does not extend beyond a day or two. Probably some years lie between the composition of these two epp., ample time to justify Jude\'s use of the word if he is referring to <a onClick="return mV(\'2Pe\',2,1);">2Pe 2-3:4</a>, as we certainly believe he is.<P>6. Corroborative References:<P>This interpretation of <a onClick="return mV(\'Jud\',1,4);">Jude 1:4</a> is confirmed by <a onClick="return mV(\'Jud\',1,17,18);">Jude 1:17,18</a>. These verses are intimately connected with <a onClick="return mV(\'2Pe\',3,\'2-4\');">2Pe 3:2-4</a>. Jude\'s readers are told to keep in remembrance the words spoken by the apostles of Christ, namely, "In the last time there shall be mockers, walking after their own ungodly lusts." Peter writes, "that in the last days mockers shall come with mockery, walking after their own lusts." The resemblance of the one passage to the other is very close, indeed, they are almost identical. Both urge their readers to remember what had been said by the apostles of the Lord Jesus Christ, and both speak of the immoral scoffers who would invade or had invaded the Christian brotherhood. But Peter distinctly asserts that these mockers shall appear in the last days. His words are, "Knowing this first, that in the last days mockers shall come with mockery, walking after their own lusts." Jude writes that "in the last time there shall be mockers, walking after their own ungodly lusts." The phrases, "the last days," and "the last time," denote our age, the dispensation in which we live, as <a onClick="return mV(\'Hbr\',1,2);">Heb 1:2</a> proves. Peter puts the appearance of the scoffers in the future, whereas Jude, after quoting the words, significantly adds, "These are they who make separations, sensual, having not the Spirit." He means, of course the mockers just mentioned, and he affirms they are now present. With Peter they are yet to come when he wrote, but with Jude the prediction is already fulfilled, so far as the scoffers are concerned. Therefore Jude\'s writing is subsequent to Peter\'s, and if there be copying on the part of either, it is Jude who copies.<P>Peter mentions "your apostles," including himself in the phrase, but Jude does not employ the plural pronoun, for he was not of the apostolic body. But why the plural, "apostles"? Because at least one other apostle had spoken of the perilous times which were coming on the church of God. Paul unites his testimony with that of Peter, and writes, "But know this, that in the last days grievous times shall come" (<a onClick="return mV(\'2Ti\',3,\'1-5\');">2Ti 3:1-5</a>). His prediction is near akin to that of Peter; it belongs apparently to the same historic time and to the same perilous class of evil-doers and corrupters. In <a onClick="return mV(\'2Pe\',3,15);">2Pe 3:15</a> the apostle lovingly and tenderly speaks of his "brother Paul," and says suggestively that in his Epistle he speaks of these things—no doubt about the scoffers of the last days among the rest. He certainly seems to have Paul in mind when he penned the words. "Knowing this first, that in the last days mockers shall come."<P>Here, then, is positive ground for the reference in <a onClick="return mV(\'Jud\',1,4);">Jude 1:4</a> to a writing concerning those who had crept into the fold and who were of old doomed to this condemnation, with which writing his readers were acquainted; they had it in the writing of the apostles Peter and Paul both, and so were forewarned as to the impending danger. Jude\'s Epistle is subsequent to Peter\'s.<P>V. Date of the Epistle.<P>There is little or no agreement as to the year, yet the majority of writers hold that it belongs to the latter half of the 1st century. Zahn assigns it to 70-75 AD; Lumby, circa 80 AD; Salmon, before the reign of Domitian (81 AD); Sieffert, shortly. prior to Domitian; Chase, not later than 80 AD, probably within a year or two of the Pastoral Epistles. Zahn strongly insists on 64 AD as the date of Peter\'s death. If the 2nd Epistle bearing his name is authentic, the apostle could not possibly have copied from Jude, for Jude\'s letter was not in existence when he died. Even on the supposition that he suffered death 65-66 AD, there could have been no copying done save by Jude, for it is almost demonstrable that Jude was written after the destruction of Jerusalem in 70 AD. If 2 Peter is pseudonymous and written about the middle of the 2nd century, as some confidently affirm, it has no right to a place in the Canon nor any legitimate relation to Jude. If genuine, it antedates Jude.<P>VI. The Libertines of Jude\'s Epistle.<P>Their character is very forcibly exhibited, but no information is given us of their origin or to what particular region they belonged. They bore the Christian name, were of the loosest morals, and were guilty of shameful excesses. Their influence seems to have been widespread and powerful, else Jude would not denounce them in such severe language. Their guilty departure from the truth must not be confounded with the Gnosticism of the 2nd century, though it tended strongly in that direction; it was a 1st-century defection. Were they newly risen sensualists, without predecessors? To some extent their forerunners had already appeared. Sensuality in some of its greaser forms disgraced the church at Corinth (<a onClick="return mV(\'1Cr\',5,\'1-13\');">1Co 5:1-13</a>; <a onClick="return mV(\'1Cr\',6,\'13-20\');">6:13-20</a>). In the common meals of this congregation which ended in the celebration of the Lord\'s Supper, they indulged in revelry and gluttony, some of them even being intoxicated (<a onClick="return mV(\'1Cr\',11,\'17-22\');">1Co 11:17-22</a>). Participation in a heathen festival exposed the Christians to the danger of sharing in idolatry, and yet some of the Corinthians were addicted to it (<a onClick="return mV(\'1Cr\',8,\'1-\');">1Co 8</a>; <a onClick="return mV(\'1Cr\',10,\'14-32\');">10:14-32</a>). In reading of the state of things in the church at Colosse, one perceives how fatal certain views and practices there would soon become if suffered to grow (<a onClick="return mV(\'Col\',2,\'16-23\');">Col 2:16-23</a>; <a onClick="return mV(\'Col\',3,\'5-11\');">3:5-11</a>). Twenty years after the probable date of Jude, in some of the churches of Asia Minor, wicked parties flourished and dominated Christian assemblies that were closely allied in teaching and conduct with the ungodly of Jude. The Nicolaitans, and the "woman Jezebel, who calleth herself a prophetess; and she teacheth and seduceth my servants to commit fornication, and to eat things sacrificed to idols" (<a onClick="return mV(\'Rev\',2,20);">Re 2:20</a>) belong to the same company of libertines as those of Jude. It should be no surprise to us with these examples before us, that according to Jude there were found in the bosom of the Christian community moral delinquents and shameless profligates whose conduct shocks our sense of propriety and decency, for the like evils, though not so flagrant, troubled the churches in Paul\'s lifetime.<P>Jude brands them as enemies and apostates. He pronounces their doom in the words of Enoch: "Behold, the Lord came with ten thousands of his holy ones, to execute judgment upon all" (<a onClick="return mV(\'Jud\',1,14,15);">Jude 1:14,15</a>). It is generally believed that this prophecy of Enoch is quoted by Jude from the apocryphal Book of Enoch. Granting such quotation, that fact does not warrant us to affirm that he endorsed the book. Paul cites from three Greek poets: from Aratus (<a onClick="return mV(\'Act\',17,28);">Ac 17:28</a>), from Menander (<a onClick="return mV(\'1Cr\',15,33);">1Co 15:33</a>; see Earle, Euripides, "Medea," Intro,30,where this is attributed to Euripides), and from Epimenides (<a onClick="return mV(\'Tts\',1,12);">Tit 1:12</a>). Does anyone imagine that Paul endorses all that these poets wrote? To the quotation from Epimenides the apostle adds, "This testimony is true" (<a onClick="return mV(\'Tts\',1,13);">Tit 1:13</a>), but no one imagines he means to say the whole poem is true. So Jude cites a passage from a non-canonical book, not because he accepts the whole book as true, but this particular prediction he receives as from God. Whence the writer of Enoch derived it is unknown. It may have been cherished and transmitted from generation to generation, or in some other way faithfully preserved, but at any rate Jude accepted it as authentic. Paul quotes a saying of the Lord Jesus (<a onClick="return mV(\'Act\',20,35);">Ac 20:35</a>) not recorded in the Gospels, but whence he derived it is unknown. As much may be said of this of Enoch which Jude receives as true.<P>LITERATURE.<P>Zahn, Introduction to New Testament; Salmon, Introduction to New Testament; Westcott, Canon of New Testament; Purves, Apostolic Age; Alford, Greek Test.; Plumptre, Commentary, "Cambridge Bible Series"; Lillie, Commentary on 1 and 2 Pet; Bigg, ICC; Vincent, Word Studies.``123';
isbe[5210]='Judea`joo-de\'-a: In <a onClick="return mV(\'Ezr\',5,8);">Ezr 5:8</a> for "Judah"; thus the Revised Version (British and American). In the New Testament the form is <a href="./study/isbe/search.html?string=JUDAEA">JUDAEA</a> (which see).``1';
isbe[5211]='Judge`juj (shophet; New Testament dikastes, krites): In the early patriarchal times the heads of families and the elders of the tribes were the judges (compare <a onClick="return mV(\'Gen\',38,24);">Ge 38:24</a>), and their authority was based on custom. In the wilderness Moses alone was the judge until Jethro suggested a scheme of devolution. On his advice Moses divided the people into groups of thousands, hundreds, fifties, and tens, and over each group a wise and good man was set as a judge. Thereafter only the most important cases were brought before Moses (<a onClick="return mV(\'Exd\',18,\'13-26\');">Ex 18:13-26</a>; <a onClick="return mV(\'Deu\',1,\'9-17\');">De 1:9-17</a>). This arrangement ceased to be practicable when the children of Israel settled down in Canaan. Although David took counsel with the heads of thousands and hundreds (<a onClick="return mV(\'1Ch\',13,1);">1Ch 13:1</a>), it need not be assumed that this was a continuation of the plan adopted by Moses. Probably the local courts were not organized till the time of David. In the days of the Judges justice was ministered by those who had risen by wisdom or valor to that rank (<a onClick="return mV(\'Jdg\',4,5);">Jud 4:5</a>). An organized circuit court was established by Samuel, who judged cases himself, and also made his sons judges (<a onClick="return mV(\'1Sa\',7,16);">1Sa 7:16</a>; <a onClick="return mV(\'1Sa\',8,1);">8:1</a>). After the monarchy was instituted, the king tried all cases, when requested to do so by the wronged person, in the palace gate (<a onClick="return mV(\'1Ki\',7,7);">1Ki 7:7</a>; <a onClick="return mV(\'Pro\',20,8);">Pr 20:8</a>). There was no public prosecutor (<a onClick="return mV(\'2Sa\',14,4);">2Sa 14:4</a>; <a onClick="return mV(\'2Sa\',15,\'2-6\');">15:2-6</a>; <a onClick="return mV(\'1Ch\',18,14);">1Ch 18:14</a>; <a onClick="return mV(\'1Ki\',3,16);">1Ki 3:16</a>; <a onClick="return mV(\'2Ki\',15,5);">2Ki 15:5</a>). Under David and Solomon there were probably local courts (<a onClick="return mV(\'1Ch\',23,4);">1Ch 23:4</a>; <a onClick="return mV(\'1Ch\',26,29);">26:29</a>). Jehoshaphat organized a high court of justice (<a onClick="return mV(\'2Ch\',19,8);">2Ch 19:8</a>). The prophets often complain bitterly that the purity of justice is corrupted by bribery and false witness (<a onClick="return mV(\'Isa\',1,23);">Isa 1:23</a>; <a onClick="return mV(\'Isa\',5,23);">5:23</a>; <a onClick="return mV(\'Isa\',10,1);">10:1</a>; <a onClick="return mV(\'Amo\',5,12);">Am 5:12</a>; <a onClick="return mV(\'Amo\',6,12);">6:12</a>; <a onClick="return mV(\'Mic\',3,11);">Mic 3:11</a>; <a onClick="return mV(\'Mic\',7,3);">7:3</a>; <a onClick="return mV(\'Pro\',6,19);">Pr 6:19</a>; <a onClick="return mV(\'Pro\',12,17);">12:17</a>; <a onClick="return mV(\'Pro\',18,5);">18:5</a>). Even kings sometimes pronounced unjust sentences, especially in criminal cases (<a onClick="return mV(\'1Sa\',22,\'6-19\');">1Sa 22:6-19</a>; <a onClick="return mV(\'1Ki\',22,26);">1Ki 22:26</a>; <a onClick="return mV(\'2Ki\',21,16);">2Ki 21:16</a>; <a onClick="return mV(\'Jer\',36,26);">Jer 36:26</a>). An evil king could also bend local courts to do his will, as may be gathered from the case of Naboth\'s vineyard (<a onClick="return mV(\'1Ki\',21,\'1-13\');">1Ki 21:1-13</a>).<P>The first duty of a judge was to execute absolute justice, showing the same impartiality to rich and poor, to Jew and foreigner. He was forbidden to accept bribes or to wrest the judgment of the poor (<a onClick="return mV(\'Exd\',23,\'6-8\');">Ex 23:6-8</a>; <a onClick="return mV(\'Deu\',16,19);">De 16:19</a>). He must not let himself be swayed by popular opinion, or unduly favor the poor (<a onClick="return mV(\'Exd\',23,2,3);">Ex 23:2,3</a>).<P>The court was open to the public (<a onClick="return mV(\'Exd\',18,13);">Ex 18:13</a>; <a onClick="return mV(\'Rth\',4,1,2);">Ru 4:1,2</a>). Each party presented his view of the case to the judge (<a onClick="return mV(\'Deu\',1,16);">De 1:16</a>; <a onClick="return mV(\'Deu\',25,1);">25:1</a>). Possibly the accused appeared in court clad in mourning (<a onClick="return mV(\'Zec\',3,3);">Zec 3:3</a>). The accuser stood on the right hand of the accused (<a onClick="return mV(\'Zec\',3,1);">Zec 3:1</a>; <a onClick="return mV(\'Psa\',109,6);">Ps 109:6</a>). Sentence was pronounced after the hearing of the case, and the judgment carried out (<a onClick="return mV(\'Jos\',7,24,25);">Jos 7:24,25</a>). The only evidence considered by the court was that given by the witnesses. In criminal cases, not less than two witnesses were necessary (<a onClick="return mV(\'Deu\',19,15);">De 19:15</a>; <a onClick="return mV(\'Num\',35,30);">Nu 35:30</a>; <a onClick="return mV(\'Deu\',17,6);">De 17:6</a>; compare <a onClick="return mV(\'Mat\',18,16);">Mt 18:16</a>; <a onClick="return mV(\'2Cr\',13,1);">2Co 13:1</a>; <a onClick="return mV(\'1Ti\',5,19);">1Ti 5:19</a>). In cases other than criminal the oath (see <a href="./study/isbe/search.html?string=OATH">OATH</a>) was applied (<a onClick="return mV(\'Exd\',22,11);">Ex 22:11</a>; compare <a onClick="return mV(\'Hbr\',6,16);">Heb 6:16</a>). The lot was sometimes appealed to (<a onClick="return mV(\'Jos\',7,\'14-18\');">Jos 7:14-18</a>), especially in private disputes (<a onClick="return mV(\'Pro\',18,18);">Pr 18:18</a>), but this was exceptional. When the law was not quite definite, recourse was had to the Divine oracle (<a onClick="return mV(\'Lev\',24,12);">Le 24:12</a>; <a onClick="return mV(\'Num\',15,34);">Nu 15:34</a>).``98';
isbe[5212]='Judges, Book of`juj\'-iz, :<P>1. Title<P>2. Place in the Canon<P>3. Contents<P class="in15">(1) Introductory, <span class="noTag">Judges 1-2:5</span><P class="in15">(2) Central and Main Portion, <span class="noTag">Judges 2:6-16</span><P class="in15">(3) An Appendix, <span class="noTag">Judges 17-21</span><P>4. Chronology<P>5. Authorship and Sources<P>6. Relation to Preceding Books<P>7. Relation to Septuagint and Other versions<P>8. Religious Purpose and Value<P>LITERATURE<hr /><P>1. Title:<P>The English name of the Book of Judges is a translation of the Hebrew title (shophetim), which is reproduced in the Greek Kritai, and the Latin Liber Judicum. In the list of the canonical books of the Old Testament given by Origen (apud Euseb., HE, VI, 25) the name is transliterated Saphateim, which represents rather "judgments" (shephatim; krimata) than "judges." A passage also is quoted from Philo (De Confus. Linguarum, 26), which indicates that he recognized the same form of the name; compare the Greek title of "Kingdoms" (Basileiai) for the four Books of Samuel and Kings.<P>2. Place in the Canon:<P>In the order of the Hebrew Canon the Book of Judges invariably occupies the 7th place, following immediately upon Joshua and preceding Samuel and Kings. With these it formed the group of the four "earlier prophets" (nebhi\'im ri\'shonim), the first moiety of the 2nd great division of the Hebrew Scriptures. As such the Book of Judges was classified and regarded as "prophetical," equally with the other historical books, on the ground of the religious and spiritual teaching which its history conveyed. In the rearrangement of the books, which was undertaken for the purposes of the Greek translation and Canon, Judges maintained its position as 7th in order from the beginning, but the short historical Book of Ruth was removed from the place which it held among the Rolls (meghilloth) in the 3rd division of the Jewish Canon, and attached to Judges as a kind of appendix, probably because the narrative was understood to presuppose the same conditions and to have reference to the same period of time. The Greek order was followed in all later VSS, and has maintained itself in modern Bibles. Origen (loc. cit.) even states, probably by a mere misunderstanding, that Judges and Ruth were comprehended by the Jews under the one title Saphateim.<P>3. Contents:<P>The Book of Judges consists of 3 main parts or divisions, which are readily distinguished.<P>(1) Introductory, <a onClick="return mV(\'Jdg\',1,\'1-\');">Judges 1</a>-<a onClick="return mV(\'Jdg\',2,\'1-5\');">2:5</a>.<P>A brief summary and recapitulation of the events of the conquest of Western Palestine, for the most part parallel to the narrative of Joshua, but with a few additional details and some divergences from the earlier account, in particular emphasizing (<a onClick="return mV(\'Jdg\',1,\'27-36\');">Jud 1:27-36</a>) the general failure of the Israelites to expel completely the original inhabitants of the land, which is described as a violation of their covenant with Yahweh (<a onClick="return mV(\'Jdg\',2,\'1-3\');">Jud 2:1-3</a>), entailing upon them suffering and permanent weakness. The introductory verse (<a onClick="return mV(\'Jdg\',1,1);">Jud 1:1</a>), which refers to the death of Joshua as having already taken place, seems to be intended as a general indication of the historical period of the book as a whole; for some at least of the events narrated in <a onClick="return mV(\'Jud\',1,\'1-\');">Jud 1</a>-<a onClick="return mV(\'Jud\',2,\'2-5\');">2:5</a> took place during Joshua\'s lifetime.<P>(2) The Central and Main Portion, <a onClick="return mV(\'Jdg\',2,\'6-16\');">Judges 2:6-16</a>.<P>A series of narratives of 12 "judges," each of whom in turn, by his devotion and prowess, was enabled to deliver Israel from thralldom and oppression, and for a longer or shorter term ruled over the people whom he had thus saved from their enemies. Each successive repentance on the part of the people, however, and their deliverance are followed, on the death of the judge, by renewed apostasy, which entails upon them renewed misery and servitude, from which they are again rescued when in response to their prayer the Lord "raises up" for them another judge and deliverer. Thus the entire history is set as it were in a recurrent framework of moral and religious teaching and warning; and the lesson is enforced that it is the sin of the people, their abandonment of Yahweh and persistent idolatry, which entails upon them calamity, from which the Divine longsuffering and forbearance alone makes for them a way of escape.<P>(a) <a onClick="return mV(\'Jdg\',2,6);">Judges 2:6-3:6</a>:<P>A second brief introduction, conceived entirely in the spirit of the following narratives, which seems to attach itself to the close of the Book of Joshua, and in part repeats almost verbally the account there given of the death and burial of Israel\'s leader (<a onClick="return mV(\'Jdg\',2,\'6-9\');">Jud 2:6-9</a> parallel <a onClick="return mV(\'Jos\',24,\'28-31\');">Jos 24:28-31</a>), and proceeds to describe the condition of the land and people in the succeeding generation, ascribing their misfortunes to their idolatry and repeated neglect of the warnings and commands of the judges; closing with an enumeration of the peoples left in the land, whose presence was to be the test of Israel\'s willingness to obey Yahweh and at the same time to prevent the nation from sinking into a condition of lethargy and ease.<P>(b) <a onClick="return mV(\'Jdg\',3,\'7-11\');">Judges 3:7-3:11</a>:<P>Judgeship of Othniel who delivered Israel from the hand of Cushan-rishathaim.<P>(c) <a onClick="return mV(\'Jdg\',3,\'12-30\');">Judges 3:12-30</a>:<P>Victory of Ehud over the Moabites, to whom the Israelites had been in servitude 18 years. Ehud slew their king Eglon, and won for the nation a long period of tranquillity.<P>(d) <a onClick="return mV(\'Jdg\',3,31);">Judges 3:31</a>:<P>In a few brief words Shamgar is named as the deliverer of Israel from the Philistines. The title of "judge" is not accorded to him, nor is he said to have exercised authority in any way. It is doubtful, therefore, whether the writer intended him to be regarded as one of the judges.<P>(e) <a onClick="return mV(\'Jdg\',4,\'1-\');">Judges 4</a>; <a onClick="return mV(\'Jdg\',5,\'1-\');">5</a>:<P>Victory of Deborah and Barak over Jabin the Canaanite king, and death of Sisera, captain of his army, at the hands of Jael, the wife of Kenite chief; followed by a So of Triumph, descriptive and commemorative of the event.<P>(f) <a onClick="return mV(\'Jdg\',6,\'1-\');">Judges 6-8</a>:<P>A 7-year oppression at the hands of the Midianites, which is described as peculiarly severe, so that the land became desolate on account of the perpetual raids to which it was subject. After a period of hesitation and delay, Gideon defeats the combined forces of the Midianites and Amalekites and the "children of the east," i.e. the wandering Bedouin bands from the eastern deserts, in the valley of Jezreel. The locality and course of the battle are traced by the sacred writer, but it is not possible to follow his account in detail because of our inability to identify the places named. After the victory, Gideon is formally offered the position of ruler for himself and his descendants, but refuses; nevertheless, he seems to have exercised a measure of restraining influence over the people until his death, although he himself and his family apparently through covetousness fell away from their faithfulness to Yahweh (<a onClick="return mV(\'Jdg\',8,27,33);">Jud 8:27,33</a>).<P>(g) <a onClick="return mV(\'Jdg\',9,\'1-\');">Judges 9</a>:<P>Episode of Abimelech, son of Gideon by a concubine, who by the murder of all but one of his brethren, the legitimate sons of Gideon, secured the throne at Shechem for himself, and for 3 years ruled Israel. After successfully stamping out a revolt at Shechem against his authority, he is himself killed when engaged in the siege of the citadel or tower of Thebez by a stone thrown by woman.<P>(h) (i) <a onClick="return mV(\'Jdg\',10,\'1-5\');">Judges 10:1-5</a>:<P>Tola and Jair are briefly named as successive judges of Israel for 23 and 22 years respectively.<P>(j) <a onClick="return mV(\'Jdg\',10,\'6-\');">Judges 10:6-12:7</a>:<P>Oppression of Israel for 18 years by the Philistines and Ammonites. The national deliverance is effected by Jephthah, who is described as an illegitimate son of Gilead who had been on that account driven out from his home and had become the captain of a band of outlaws. Jephthah stipulates with the elders of Gilead that if he undertakes to do battle on their behalf with the Ammonites, he is afterward to be recognized as their ruler; and in accordance with the agreement, when the victory has been won, he becomes judge over Israel (<a onClick="return mV(\'Jdg\',11,9);">Jud 11:9</a>f; <a onClick="return mV(\'Jdg\',12,7);">12:7</a>).<P>See <a href="./study/isbe/search.html?string=JEPHTHAH">JEPHTHAH</a>.<P>(k) (l) (m) <a onClick="return mV(\'Jdg\',12,\'8-15\');">Judges 12:8-15</a>:<P>Three of the so-called "minor" judges, Ibzan, Elon and Abdon, judged Israel in succession for 7, 10 and 8 years respectively. As they are not said to have delivered the nation from any calamity or oppression, it is perhaps to be understood that the whole period was a time of rest and tranquillity.<P>(n) <a onClick="return mV(\'Jdg\',13,\'1-\');">Judges 13-16</a>:<P>The history of Samson (see separate article [<A href="./study/isbe/search.html?string=SAMSON">SAMSON</a>).<P>(3) An Appendix, <a onClick="return mV(\'Jdg\',17,\'1-\');">Judges 17-21</a>.<P>The final section, in the nature of an appendix, consisting of two narratives, independent apparently of the main portion of the book and of one another. They contain no indication of date, except the statement 4 times repeated that "in those days there was no king in Israel" <a onClick="return mV(\'Jdg\',6,\'1-\');">Jud 6</a>; <a onClick="return mV(\'Jdg\',18,1);">18:1</a>; <a onClick="return mV(\'Jdg\',19,1);">19:1</a>; <a onClick="return mV(\'Jdg\',21,25);">21:25</a>). The natural inference is that the narratives were committed to writing in the days of the monarchy; but the events themselves were understood by the compiler or historian to have taken place during the period of the Judges, or at least anterior to the establishment of the kingdom. The lawless state of society, the violence and disorder among the tribes, would suggest the same conclusion. No name of a judge appears, however, and there is no direct reference to the office or to any central or controlling authority. Josephus also seems to have known them in reverse order, and in a position preceding the histories of the judges themselves, and not at the close of the book (Ant., V, ii, 8-12; iii, 1; see E. Konig in HDB, II, 810). Even if the present form of the narratives is thus late, there can be little doubt that they contain elements of considerable antiquity.<P>(a) <a onClick="return mV(\'Jdg\',17,\'1-\');">Judges 17</a>-<a onClick="return mV(\'Jdg\',18,\'1-\');">18</a>:<P>The episode of Micah the Ephraimite and the young Levite who is consecrated as priest in his house. A war party, however, of the tribe of Dan during a migration northward, by threats and promises induced the Levite to accompany them, taking with him the priestly ephod, the household goods of his patron, and a costly image which Micah had caused to be made. These Micah in vain endeavors to recover from the Danites. The latter sack and burn Laish in the extreme north of Palestine, rebuilding the city on the same site and renaming it "Dan." There they set up the image which they had stolen, and establish a rival priesthood and worship, which is said to have endured "all the time that the house of God was in Shiloh" (<a onClick="return mV(\'Jdg\',18,31);">18:31</a>).<P>(b) <a onClick="return mV(\'Jdg\',19,\'1-\');">Judges 19-21</a>:<P>Outrage of the Benjamites of Gibeah against the concubine of a Levite lodging for a night in the city on his way from Bethlehem to the hill country of Ephraim. The united tribes, after twice suffering defeat at the hands of the men of Benjamin, exact full vengeance; the tribe of Benjamin is almost annihilated, and their cities, including Gibeah, are destroyed. In order that the tribe may not utterly perish, peace is declared with the 600 survivors, and they are provided with wives by stratagem and force, the Israelites having taken a solemn vow not to permit intermarriage between their own daughters and the members of the guilty tribe.<P>4. Chronology:<P>The period covered by the history of the Book of Judges extends from the death of Joshua to the death of Samson, and adds perhaps a later reference in <a onClick="return mV(\'Jdg\',18,31);">Jud 18:31</a>, "all the time that the house of God was in Shiloh" (compare <a onClick="return mV(\'1Sa\',1,3);">1Sa 1:3</a>). It is, however, difficult, perhaps impossible, to compute in years the length of time that the writer had in mind. That he proceeded upon a fixed chronological basis, supplied probably by tradition but modified or arranged on a systematic principle, seems evident. The difficulty may be due in part to the corruption which the figures have suffered in the course of the transmission of the text. In <a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a> an inclusive total of 480 years is given as the period from the Exodus to the building of the Temple in the 4th year of the reign of Solomon. This total, however, includes the 40 years\' wandering in the desert, the time occupied in the conquest and settlement of the Promised Land, and an uncertain period after the death of Joshua, referred to in the Book of Judges itself (<a onClick="return mV(\'Jdg\',2,10);">2:10</a>), until the older generation that had taken part in the invasion had passed away. There is also to be reckoned the 40 years\' judgeship of Eli (<a onClick="return mV(\'1Sa\',4,18);">1Sa 4:18</a>), the unknown length of the judgeship of Samuel (<a onClick="return mV(\'Jdg\',7,15);">Jud 7:15</a>), the years of the reign of Saul (compare <a onClick="return mV(\'1Sa\',13,1);">1Sa 13:1</a>, where, however, no statement is made as to the length of his reign), the 40 years during which David was king (<a onClick="return mV(\'1Ki\',2,11);">1Ki 2:11</a>), and the 4 years of Solomon before the building of the Temple. The recurrence of the number 40 is already noticeable; but if for the unknown periods under and after Joshua, of Samuel and of Saul, 50 or 60 years be allowed—a moderate estimate—there would remain from the total of 480 years a period of 300 years in round numbers for the duration of the times of the Judges. It may be doubted whether the writer conceived of the period of unsettlement and distress, of alternate oppression and peace, as lasting for so long a time.<P>The chronological data contained in the Book of Judges itself are as follows:<P>A total of 410 years, or, if the years of foreign oppression and of the usurpation of Abimelech are omitted, of 296.<P>It has been supposed that in some instances the rule of the several judges was contemporaneous, not successive, and that therefore the total period during which the judges ruled should be reduced accordingly. In itself this is sufficiently probable. It is evident, however, that this thought was not in the mind of the writer, for in each case he describes the rule of the judge as over "Israel" with no indication that "Israel" is to be understood in a partial and limited signification. His words must therefore be interpreted in their natural sense, that in his own belief the rulers whose deeds he related exercised control in the order named over the entire nation. Almost certainly, however, he did not intend to include in his scheme the years of oppression or the 3 years of Abimelech\'s rule. If these be deducted, the resultant number (296) is very near the total which the statement in <a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a> suggests.<P>No stress, however, must be laid upon this fact. The repeated occurrence of the number 40, with its double and half, can hardly be accidental. The same fact was noted above in connection with earlier and later rulers in Israel. It suggests that there is present an element of artificiality and conscious arrangement in the scheme of chronology, which makes it impossible to rely upon it as it stands for any definite or reliable historical conclusion.<P>5. Authorship and Sources:<P>Within the Book of Judges itself no author is named, nor is any indication given of the writer or writers who are responsible for the form in which the book appears; and it would seem evident, also, that the 3 parts or divisions of which the book is composed are on a different footing as regards the sources from which they are drawn. The Talmudic tradition which names Samuel as the author can hardly be seriously regarded. The historical introduction presents a form of the traditional narrative of the conquest of Palestine which is parallel to but not identical with that contained in the Book of Joshua. Brief and disconnected as it is, it is of the greatest value as a historical authority, and contains elements which in origin, if not in their present form, are of considerable antiquity. The main portion of the book, comprising the narratives of the judges, is based upon oral or written traditions of a local and perhaps a tribal character, the value of which it is difficult to estimate, but which undoubtedly in some instances have been more carefully preserved than in others. In particular, around the story of Samson there seem to have gathered elements derived from the folklore and the wonder-loving spirit of the countryside; and the exploits of a national hero have been enhanced and surrounded with a glamor of romance as the story of them has passed from lip to lip among a people who themselves or their forefathers owed so much to his prowess. Of this central part of Judges, the Song of Deborah (<a onClick="return mV(\'Jdg\',5,\'1-\');">Judges 5</a>) is the most ancient, and bears every mark of being a contemporary record of a remarkable conflict and victory. The text is often difficult, almost unintelligible, and has so greatly suffered in the course of transmission as in some passages to be beyond repair. As a whole the song is an eloquent and impassioned ode of triumph, ascribing to Yahweh the great deliverance which has been wrought for His people over their foes.<P>The narratives of Judgess, moreover, are set in a framework of chronology and of ethical comment and teaching, which are probably independent of one another. The moral exhortations and the lessons drawn from hardships and sufferings, which the people of Israel incur as the consequence of their idolatry and sin, are conceived entirely in the spirit of Deuteronomy, and even in the letter and form bear a considerable resemblance to the writings of that book. In the judgment of some scholars, therefore, they are to be ascribed to the same author or authors. Of this, however, there is no proof. It is possible, but perhaps hardly probable. They certainly belong to the same school of thought, of clear-sighted doctrine, of reverent piety, and of jealous concern for the honor of Yahweh. With the system of chronology, the figures and dates, the ethical commentary and inferences would seem to have no direct relation. The former is perhaps a later addition, based in part at least upon tradition, and applied to existing accounts, in order to give them their definite place and succession in the historical record. Finally, the three strands of traditional narrative, moral comment, and chronological framework were woven into one whole by a compiler or reviser who completed the book in the form in which it now exists. Concerning the absolute dates, however, at which these processes took place very little can be determined.<P>The two concluding episodes are distinct, both in form and character, from the rest of the book. They do not relate the life or deeds of a judge, nor do they, explicitly at least, convey any moral teaching or warning. They are also mutually independent. It would seem therefore that they are to be regarded as accounts of national events or experiences, preserved by tradition, which, because they were understood to have reference to the period of the Judges, were included in this book. The internal nature of the narratives themselves would suggest that they belong rather to the earlier than the later part of the time during which the judges held rule; and their ancient character is similarly attested. There is no clue, however, to the actual date of their composition, or to the time or circumstances under which they were incorporated in the Book of Judges.<P>6. Relation to Preceding Books:<P>The discussion of the relation of the Book of Judges to the generally recognized sources of the Pentateuch and to Joshua has been in part anticipated in the previous paragraph. In the earliest introductory section of the book, and in some of the histories of the judges, especially in that of Gideon (<a onClick="return mV(\'Jdg\',6,\'1-\');">Judges 6-8</a>), it is not difficult to distinguish two threads of narrative, which have been combined together in the account as it now stands; and by some scholars these are identified with the Jahwist (Jahwist) and the Elohist (E) in the Pentateuch. The conclusion, however, is precarious and uncertain, for the characteristic marks of the Pentateuch "sources" are in great measure absent. There is more to be said for the view that regards the introduction (<a onClick="return mV(\'Jud\',1,\'1-\');">Jud 1-<a onClick="return mV(\'Jud\',2,\'1-5\');">2:5</a>), with its verbal parallels to Joshua as derived ultimately from the history of JE, from which, however, very much has been omitted, and the remainder adapted and abbreviated. Even this moderate conclusion cannot be regarded as definitely established. The later author or compiler was in possession of ancient documents or traditions, of which he made use in his composite narrative, but whether these were parts of the same historical accounts that are present in the books of Moses and in Joshua must be regarded as undetermined. There is no trace, moreover, in Judges of extracts from the writing or school of P; nor do the two concluding episodes of the book (<a onClick="return mV(\'Jdg\',17,\'1-\');">Judges 17-21</a>) present any features which would suggest an identification with any of the leading "sources" of the Pentateuch.<P>The moral and religious teaching, on the other hand, which makes the varied national experiences in the times of the Judges a vehicle for ethical instruction and warning, is certainly derived from the same school as Deuteronomy, and reproduces the whole tone and spirit of that book. There is no evidence, however, to identify the writer or reviser who thus turned to spiritual profit the lessons of the age of the Judges with the author of Deuteronomy itself, but he was animated by the same principles, and endeavored in the same way to expound the same great truths of religion and the Providence of God.<P>7. Relation to Septuagint and Other Versions:<P>There are two early Greek translations of the Book of Judges, which seem to be on the whole independent of one another. These are represented by the two great uncial manuscripts, B (Codex Vaticanus) and A (Codex Alexandrinus). With the former is associated a group of cursive manuscripts and the Sahidic or Upper Egyptian version. It is therefore probable that the translation is of Egyptian origin, and by some it has been identified with that of Hesychius. It has been shown, moreover, that in this book, and probably elsewhere, the ancient character of the text of B is not always maintained, but in parts at least betrays a later origin. The other version is contained in AV and the majority of the uncial and cursive manuscripts of the Greek texts, and, while certainly a real and independent translation from the original, is thought by some to show acquaintance with the version of B. There is, however, no definite evidence that B\'s translation is really older. Some of the cursives which agree in general with A form sub-groups; thus the recension of Lucian is believed to be represented by a small number of cursives, the text of which is printed by Lagarde (Librorum VT Canonicorum, Pars Prior, 1883), and is substantially identical with that in the "Complutensian Polyglot" (see G. F. Moore, Critical and Exegetical Commentary on Judges, Edinburgh,1895,xliiiff). It is probable that the true original text of the Septuagint is not represented completely either by the one or the other version, but that it partially underlies both, and may be traced in the conflicting readings which must be judged each on its own merits.<P>Of the other principal versions, the Old Latin and the Hexaplar Syriac, together with the Armenian and the Ethiopic, attach themselves to a sub-group of the manuscripts associated with A. The Bohairic version of the Book of Judges has not hitherto been published, but, like the rest of the Old Testament, its text would no doubt be found to agree substantially with B. Jerome\'s translation follows closely the Massoretic Text, and is independent of both Greek VSS; and the Peshitta also is a direct rendering from the Hebrew.<P>8. Religious Purpose and Value:<P>Thus the main purpose of the Book of Judges in the form in which it has been preserved in the Old Testament is not to record Israel\'s past for its own sake, or to place before the writer\'s contemporaries a historical narrative of the achievements of their great men and rulers, but to use these events and the national experiences of adversity as a text from which to educe religious warning and instruction. With the author or authors spiritual edification is the first interest, and the facts or details of the history, worthy of faithful records, because it is the history of God\'s people, find their chief value in that they are and were designed to be admonitory, exhibiting the Divine judgments upon idolatry and sin, and conveying the lesson that disobedience and rebellion, a hard and defiant spirit that was forgetful of Yahweh, could not fail to entail the same disastrous consequences. The author is preeminently a preacher of righteousness to his fellow-countrymen, and to this aim all other elements in the book, whether chronological or historical, are secondary and subordinate. In his narrative he sets down the whole truth, so far as it has become known to him through tradition or written document, however discreditable it may be to his nation. There is no ground for believing that he either extenuates on the one hand, or on the other paints in darker colors than the record of the transgressions of the people deserved. Neither he nor they are to be judged by the standards of the 20th century, with its accumulated wealth of spiritual experience and long training in the principles of righteousness and truth. But he holds and asserts a lofty view of the character of Yahweh, of the immutability of His wrath against obstinate transgression and of the certainty of its punishment, and yet of the Divine pitifulness and mercy to the man or nation that turns to Him with a penitent heart. The Jews were not mistaken when they counted the Book of Judges among the Prophets. It is prophecy, more than history, because it exhibits and enforces the permanent lessons of the righteousness and justice and loving-kindness of God.<P>LITERATURE.<P>A complete bibliography of the literature up to date will be found in the Dicts. under the word "Judges," D B2, 1893; HDB, II, 1899; EB, II, 1901; compare G. F. Moore, Critical and Exegetical Commentary on Judges, Edinburgh, 1895; SBOT, Leipzig, 1900; R. A. Watson, "Jgs" and "Ruth," in Expositor\'s Bible, 1889; G. W. Thatcher, "Jgs" and "Ruth," in Century Bible; S. Oettli, "Das Deuteronomium und die Bucher Josua und Richter," in Kurzgefasster Kommentar, Munchen, 1893; K. Budde, "Das Buch der Richter," in Kurzer HandKommentar zum Altes Testament, Tubingen, 1897; W. Nowack, "Richter," in Hand-kommentar zum Altes Testament, 1900.``65';
isbe[5213]='Judges, Period of`<b>I. SOURCES</b><P><b>II. CHRONOLOGY</b><P><b>III. GENERAL POLITICAL SITUATION</b><P class="in15">1. The Canaanites<P class="in15">2. Foes Without<P><b>IV. MAIN EVENTS</b><P class="in15">1. Struggles of Individual Tribes<P class="in15">2. Civil Strife<P class="in15">3. The Six Invasions<P class="in15">4. Need of Central Government<P><b>V. RELIGIOUS CONDITIONS</b><P><b>VI. THEOLOGICAL INTERPRETATION</b><P><b>LITERATURE</b><hr /><P>I. Sources.<P>Our chief sources of information are the Book of Judges and <a onClick="return mV(\'1Sa\',1,1);">1Sa 1-12</a>. The material contained in these is not all of the same age. The oldest part, by common consent, is the Song of Deborah (<a onClick="return mV(\'Jdg\',5,\'1-\');">Jud 5</a>). It is a contemporaneous document. The prose narratives, however, are also early, and are generally regarded as presenting a faithful picture of the times with which they deal. The Book of Ruth, which also refers to this period, is probably in its present form a later composition, but there is no adequate ground for denying to it historical basis (Konig, Einleitung, 286ff; Kent, Student\'s Old Testament, I, 310f).<P>II. Chronology.<P>The period of the Judges extends from the death of Joshua to the establishment of the monarchy. How long a time elapsed between these limits is a matter of wide difference of opinion. The chronological data in the Book of Judges, i.e. omitting Eli and Samuel, make a total of 410 years. But this is inconsistent with <a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a>, where the whole period from the Exodus to the 4th year of Solomon is reckoned at 480 years. Various attempts have been made to harmonize these divergent figures, e.g. by eliminating the 70 years attributed to the Minor Judges (<a onClick="return mV(\'Jdg\',10,\'1-5\');">10:1-5</a>; <a onClick="return mV(\'Jdg\',12,\'7-15\');">12:7-15</a>), by not counting the 71 years of foreign domination, and by theory that some of the judges were contemporaneous. It is probable that the 480 years of <a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a> was a round number and did not rest on exact records. Indeed, it is doubtful if there was any fixed calendar in Israel before the time of the monarchy. The only way then to determine the length of the period of the Judges is from the date of the Exodus. The common view is that the Exodus took place during or just after the reign of Merenptah in the latter half of the 13th century BC. This, however, leaves hardly more than 150 years to the period of the Judges, for Saul\'s reign fell in the 2nd half of the 11th century BC. Hence, some, to whom this seems too short, assign the Exodus to the reign of Amenophis II, about 1450 BC. This harmonizes with the 480 years of <a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a>, and is supported by other considerations (POT, 422-24). Still others have connected the Exodus with the expulsion of the Hyksos about 1580 BC (G.A. Reisner); and this would fit in very well with the chronological data in the Book of Judges. The objection to the last two views is that they require a rather long period of subjection of the Israelites in Canaan to Egypt, of which there is no trace in the Book of Judges.<P>See, further, <a href="./study/isbe/search.html?string=JUDGES,+BOOK+OF">JUDGES, BOOK OF, IV</a>.<P>III. General Political Situation.<P>The death of Joshua left much land yet to be possessed by the Israelites.<P>1. The Canaanites:<P>The different tribes had received their respective allotments (<a onClick="return mV(\'Jdg\',1,3);">Jud 1:3</a>), but the actual possession of the territory assigned each still lay in the future and was only gradually achieved. The Canaanites remained in the land, and were for a time a serious menace to the power of Israel. They retained possession of the plains and many of the fortified cities, e.g. Gezer, Harheres, Aijalon, Shaalhim, and Jerusalem on the northern border of Judah (<a onClick="return mV(\'Jdg\
