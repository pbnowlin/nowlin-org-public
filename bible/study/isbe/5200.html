',1,21,29,35);">Jud 1:21,29,35</a>), and Bethshean, Ibleam, Taanach, Megiddo, and Dot along the northern border of Manasseh (<a onClick="return mV(\'Jdg\',1,27,28);">Jud 1:27,28</a>).<P>2. Foes Without:<P>Besides these foes within Canaan, the Israelites had enemies from without to contend with, namely, the Moabites, Midianites, Ammonites, and Philistines. The danger from each of these quarters, except that from the Philistines, was successfully warded off. The conflicts in which the Israelites were thus involved were all more or less local in character. In no case did all the tribes act together, though the duty of such united action is clearly taught in the Song of Deborah, at least so far as the 10 northern tribes are concerned. The omission of Judah and Simeon from this ancient song is strange, but may not be so significant as is sometimes supposed. The judges, who were raised up to meet the various emergencies, seem to have exercised jurisdiction only over limited areas. In general the different tribes and clans acted independently of each other. Local home rule prevailed. "Every man did that which was right in his own eyes" (<a onClick="return mV(\'Jdg\',17,6);">Jud 17:6</a>).<P>That Canaan was not during this period subdued and kept in subjection by one of the great world-powers, Egypt or Babylonia, is to be regarded as providential (HPM, I, 214f). Such subjection would have made impossible the development of a free national and religious life in Israel. The Cushan-rishathaim of <a onClick="return mV(\'Jdg\',3,\'7-10\');">Jud 3:7-10</a> was more likely a king of Edom than of Mesopotamia (Paton, Early History of Syria and Palestine, 161-62).<P>IV. Main Events.<P>1. Struggles of Individual Tribes:<P>Much of what took place during this period is unrecorded. Of the struggles through which the individual tribes passed before they succeeded in establishing themselves in the land, little is known. One interesting episode is preserved for us in <a onClick="return mV(\'Jdg\',17,\'1-\');">Jud 17</a>; <a onClick="return mV(\'Jdg\',18,\'1-\');">18</a>. A considerable portion of the tribe of Dan, hard pressed by the Amorites (<a onClick="return mV(\'Jdg\',1,34);">Jud 1:34</a>f), migrated from their allotted home west of Judah to Laish in the distant north, where they put the inhabitants to the sword, burnt the city and then rebuilt it under the name of Dan. This took place early in the period of the Judges, apparently during the first generation after the conquest (<a onClick="return mV(\'Jdg\',18,30);">Jud 18:30</a>).<P>2. Civil Strife:<P>At about the same time also (<a onClick="return mV(\'Jdg\',20,28);">Jud 20:28</a>) seems to have occurred the war with Benjamin (<a onClick="return mV(\'Jdg\',19,\'1-\');">Jud 19-21</a>), which grew out of an outrage perpetrated at Gibeah and the refusal of the Benjamites to surrender the guilty parties for punishment. The historicity of this war has been called in question, but it seems to be attested by <a onClick="return mV(\'Hsa\',9,9);">Ho 9:9</a>; <a onClick="return mV(\'Hsa\',10,9);">10:9</a>. And that civil strife in Israel was not otherwise unknown during this period is clear from the experiences of Gideon (<a onClick="return mV(\'Jdg\',8,\'1-3\');">Jud 8:1-3</a>) and Jephthah (<a onClick="return mV(\'Jdg\',12,\'1-6\');">Jud 12:1-6</a>), not to mention those of Abimelech (<a onClick="return mV(\'Jdg\',9,\'1-\');">Jud 9</a>). It is a current theory that the tribes of Simeon and Levi early in this period suffered a serious reverse (<a onClick="return mV(\'Gen\',49,\'5-7\');">Ge 49:5-7</a>), and that a reflection of this event is to be found in <a onClick="return mV(\'Gen\',34,\'1-\');">Ge 34</a>; but the data are too uncertain to warrant any confidence in this view.<P>3. The Six Invasions:<P>Six wars with other nations are recorded as taking place in this period, and each called forth its judge or judges. Othniel delivered the Israelites from the Mesopotamians or Edomites (<a onClick="return mV(\'Jdg\',3,\'7-11\');">Jud 3:7-11</a>), Ehud from the Moabites (<a onClick="return mV(\'Jdg\',3,\'12-30\');">Jud 3:12-30</a>), Deborah and Barak from the Canaanites (<a onClick="return mV(\'Jdg\',4,\'1-\');">Judges 4</a>; <a onClick="return mV(\'Jdg\',5,\'1-\');">5</a>), Gideon from the Midianites (<a onClick="return mV(\'Jdg\',6,\'1-\');">Judges 6-8</a>), and Jephthah from the Ammonites (<a onClick="return mV(\'Jdg\',10,\'6-12\',17);">Jud 10:6-12,17</a>). In the strife with the Philistines, which was not terminated during this period, Samson (<a onClick="return mV(\'Jdg\',13,\'1-\');">Judges 13-16</a>), Eli (<a onClick="return mV(\'1Sa\',4,\'1-\');">1Sa 4-6</a>), and Samuel (<a onClick="return mV(\'1Sa\',7,\'3-14\');">1Sa 7:3-14</a>; <a onClick="return mV(\'1Sa\',9,16);">9:16</a>) figure. Of these six wars those which brought Othniel, Ehud and Jephthah to the front were less serious and significant than the other three. The conflicts with the Canaanites, Midianites and Philistines mark distinct stages in the history of the period.<P>After the first successes of the Israelites in Canaan a period of weakness and disintegration set in. The Canaanites, who still held the fortified cities in the plain of Esdraelon, banded themselves together and terrorized the region round about. The Hebrews fled from their villages to the caves and dens. None had the heart to offer resistance (<a onClick="return mV(\'Jdg\',5,6,8);">Jud 5:6,8</a>). It seemed as though they were about to be subdued by the people they had a short time before dispossessed. Then it was that Deborah appeared on the scene. With her passionate appeals in the name of Yahweh she awakened a new sense of national unity, rallied the discouraged forces of the nation and administered a final crushing defeat upon the Canaanites in the plain of Megiddo.<P>But the flame thus kindled after a time went out. New enemies came from without. The Midianites invaded the land year after year, robbing it of its produce (<a onClick="return mV(\'Jdg\',6,1,3);">Jud 6:1,3</a>). This evil was suddenly put an end to by the bold stroke of Gideon, whose victory was long treasured in the public memory (<a onClick="return mV(\'Isa\',9,4);">Isa 9:4</a>; <a onClick="return mV(\'Isa\',10,26);">10:26</a>; <a onClick="return mV(\'Psa\',83,\'9-12\');">Ps 83:9-12</a>). But the people, at least of Manasseh and perhaps also of Ephraim, now realized that it was no longer safe to depend upon such temporary leadership. They needed a permanent organization to ward off the dangers that beset them. They therefore offered the kingship to Gideon. He formally declined it (<a onClick="return mV(\'Jdg\',8,22,23);">Jud 8:22,23</a>), but still set up a government at Ophrah which the people looked upon as hereditary (<a onClick="return mV(\'Jdg\',9,2);">Jud 9:2</a>). He was succeeded by his son Abimelech, who, after slaying all but one of his 70 brothers, assumed the title of king. The new kingdom, however, was of short duration. It ended after three years with the ignominious death of the king.<P>4. Need of Central Government:<P>A great danger was needed before the people of Israel could be welded into unity and made to see the necessity of a strong central government. This came eventually from the Philistines, who twice defeated the Israelites in battle, captured the ark, and overran a large part of the country (<a onClick="return mV(\'1Sa\',4,1);">1Sa 4-6</a>). In the face of such a foe as this it was clear that only a strong and permanent leadership of the whole people would suffice (<a onClick="return mV(\'1Sa\',9,15);">1Sa 9:15</a>; <a onClick="return mV(\'1Sa\',10,1);">10:1</a>); and thus the rule of the Judges gave way to the monarchy.<P>V. Religious Conditions.<P>The Hebrew mind to which Moses addressed himself was not a tabula rasa, and the Palestinian world into which the Israelites entered was not an intellectual blank. Formative influences had for ages been at work on the Hebrew mind, and Palestine had long been inhabited by people with fixed institutions, customs and ideas. When then Israel settled in Canaan, they had both a heathen inheritance and a heathen environment to contend with. It should therefore occasion no surprise to find during this period such lapses from the purity of the Mosaic faith as appear in the ephod of Gideon (<a onClick="return mV(\'Jdg\',8,\'24-27\');">Jud 8:24-27</a>), the images of Micah (<a onClick="return mV(\'Jdg\',17,\'1-\');">Judges 17</a>-<a onClick="return mV(\'Jdg\',18,\'1-\');">18</a>), and the sacrifice of Jephthah\'s daughter (<a onClick="return mV(\'Jdg\',11,\'34-40\');">Jud 11:34-40</a>). In the transition from a nomadic to an agricultural life it was inevitable that the Hebrews with their native heathen proclivities would adopt many of the crude and even immoral religious customs and beliefs of the people among whom they settled. But the purer Mosaic faith still had its representatives. The worship of the central sanctuary at Shiloh remained imageless. Leaders like Deborah and Samuel revived the spirit of Moses. And there can hardly be a doubt that in many a quiet home a true and earnest piety was cultivated like that in the home of Elimelech and Naomi.<P>VI. Theological Interpretation.<P>The Biblical historian was not content simply to narrate events. What concerned him most was the meaning lying back of them. And this meaning he was interested in, not for its own sake, but because of its application to the people of his own day. Hence, intermingled with the narratives of the period of the Judges are to be found religious interpretations of the events recorded and exhortations based upon them. The fundamental lesson thus inculcated is the same as that continually insisted upon by the prophets. The Divine government of the world is based upon justice. Disobedience to the moral law and disloyalty to Yahweh means, therefore, to Israel suffering and disaster. All the oppressions of the period of the Judges arose in this way. Relief and deliverance came only when the people turned unto Yahweh. This religious pragmatism, as it is called, does not lie on the surface of the events, so that a naturalistic historian might see it. But it is a correlate of the ethical monotheism of the prophets, and constitutes the one element in the Old Testament which makes the study of Israel\'s history supremely worth while.<P>LITERATURE.<P>Josephus, Ant, V, ii-vi, 5; Ottley, Short History of the Hebrews, 101-24; Kittel, History of the Hebrews, II, 60f; 2nd German edition, II, 52-135.``90';
isbe[5214]='Judging Judgment`juj\'-ing, juj\'-ment: Often in the Old Testament for "to act as a magistrate" (<a onClick="return mV(\'Exd\',18,13);">Ex 18:13</a>; <a onClick="return mV(\'Deu\',1,16);">De 1:16</a>; <a onClick="return mV(\'Deu\',16,18);">16:18</a>, etc.), justice being administered generally by "elders" (<a onClick="return mV(\'Exd\',18,\'13-27\');">Ex 18:13-27</a>), or "kings" (<a onClick="return mV(\'1Sa\',8,20);">1Sa 8:20</a>) or "priests" (<a onClick="return mV(\'Deu\',18,15);">De 18:15</a>); applied to God as the Supreme Judge (<a onClick="return mV(\'Psa\',9,7,8);">Ps 9:7,8</a>; <a onClick="return mV(\'Psa\',10,18);">10:18</a>; <a onClick="return mV(\'Psa\',96,13);">96:13</a>; <a onClick="return mV(\'Mic\',4,3);">Mic 4:3</a>, etc.; <a onClick="return mV(\'Psa\',7,8);">Ps 7:8</a> "Yahweh ministereth judgment," vividly describes a court scene, with Yahweh as Judge).<P>Often in the New Testament, ethically, for<P>(1) "to decide," "give a verdict," "declare an opinion" (Greek krino);<P>(2) "to investigate," "scrutinize" (Greek anakrino);<P>(3) "to discriminate," "distinguish" (Greek diakrino).<P>For (1), see <a onClick="return mV(\'Luk\',7,43);">Lu 7:43</a>; <a onClick="return mV(\'Act\',15,19);">Ac 15:19</a>;<P>for (2) see <a onClick="return mV(\'1Cr\',2,15);">1Co 2:15</a>; <a onClick="return mV(\'1Cr\',4,3);">4:3</a>;<P>for (3) see <a onClick="return mV(\'1Cr\',11,31);">1Co 11:31</a>; <a onClick="return mV(\'1Cr\',14,29);">14:29</a> margin.<P>Used also forensically in <a onClick="return mV(\'Luk\',22,30);">Lu 22:30</a>; <a onClick="return mV(\'Act\',25,10);">Ac 25:10</a>; and applied to God in <a onClick="return mV(\'Jhn\',5,22);">Joh 5:22</a>; <a onClick="return mV(\'Hbr\',10,30);">Heb 10:30</a>. The judgments of God are the expression of His justice, the formal declarations of His judgments, whether embodied in words (<a onClick="return mV(\'Deu\',5,1);">De 5:1</a> the King James Version, the Revised Version (British and American) "statutes"), or deeds (<a onClick="return mV(\'Exd\',6,6);">Ex 6:6</a>; <a onClick="return mV(\'Rev\',16,7);">Re 16:7</a>), or in decisions that are yet to be published (<a onClick="return mV(\'Psa\',36,6);">Ps 36:6</a>). Man\'s consciousness of guilt inevitably associates God\'s judgments as declarations of the Divine justice, with his own condemnation, i.e. he knows that a strict exercise of justice means his condemnation, and thus "judgment" and "condemnation" become in his mind synonymous (<a onClick="return mV(\'Rom\',5,16);">Ro 5:16</a>); hence, the prayer of <a onClick="return mV(\'Psa\',143,2);">Ps 143:2</a>, "Enter not into judgment"; also, <a onClick="return mV(\'Jhn\',6,29);">Joh 6:29</a>, "the resurrection of judgment" (the King James Version "damnation"); <a onClick="return mV(\'1Cr\',11,29);">1Co 11:29</a>, "eateth and drinketh judgment" (the King James Version "damnation").``84';
isbe[5215]='Judgment Hall`juj\'-ment hol (to praitorion, "Then led they Jesus...unto the hall of judgment...and they themselves went not into the judgment hall" (<a onClick="return mV(\'Jhn\',18,28);">Joh 18:28</a> the King James Version); "Then Pilate entered into the judgment hall again" (<a onClick="return mV(\'Jhn\',18,33);">Joh 18:33</a> the King James Version); "(Pilate) went again into the judgment hall" (<a onClick="return mV(\'Jhn\',19,9);">Joh 19:9</a>); "He commanded him to be kept in Herod\'s judgment hall" (<a onClick="return mV(\'Act\',23,35);">Ac 23:35</a>)):<P>"Judgment hall" is one of the ways in which the King James Version translates praitorion, which it elsewhere renders "Praetorium" (<a onClick="return mV(\'Mar\',15,16);">Mr 15:16</a>); "the common hall" (<a onClick="return mV(\'Mat\',27,27);">Mt 27:27</a>). In this passage the English Revised Version renders it "palace"; in <a onClick="return mV(\'Jhn\',18,33);">Joh 18:33</a>; <a onClick="return mV(\'Jhn\',19,9);">19:9</a>; <a onClick="return mV(\'Act\',23,35);">Ac 23:35</a>, "palace" is also given by the English Revised Version; in <a onClick="return mV(\'Phl\',1,13);">Php 1:13</a>, the King James Version renders, "palace," while the Revised Version (British and American) gives "the praetorian guard." Praitorion accordingly is translated in all these ways, "Praetorium," "the common hall," "the judgment hall," "the palace," "the praetorian guard." In the passages In the Gospels, the American Standard Revised Version renders uniformly "Praetorium."<P>The word originally meant the headquarters in the Roman camp, the space where the general\'s tent stood, with the camp altar; the tent of the commander-in-chief. It next came to mean the military council, meeting in the general\'s tent. Then it came to be applied to the palace in which the Roman governor or procurator of a province resided. In Jerusalem it was the magnificent palace which Herod the Great had built for himself, and which the Roman procurators seem to have occupied when they came from Caesarea to Jerusalem to transact public business.<P>Praitorion in <a onClick="return mV(\'Phl\',1,13);">Php 1:13</a> has been variously rendered, "the camp of the praetorian soldiers," "the praetorian guard," etc. For what is now believed to be its true meaning, see <a href="./study/isbe/search.html?string=PRAETORIUM">PRAETORIUM</a>.``155';
isbe[5216]='Judgment Seat`(bema, "a raised place," "platform," "tribune," <a onClick="return mV(\'Mat\',27,19);">Mt 27:19</a>; <a onClick="return mV(\'Jhn\',19,13);">Joh 19:13</a>; see <a href="./study/isbe/search.html?string=GABBATHA">GABBATHA</a>; <a onClick="return mV(\'Act\',12,21);">Ac 12:21</a> margin (text "throne"); <a onClick="return mV(\'Act\',18,12,16);">18:12,16</a>ff; <a onClick="return mV(\'Act\',25,6,17);">25:6,17</a>): In Greek law courts, one bema was provided for the accuser, another for the accused; but in the New Testament the word designates the official seat of a judge, usually of the Roman governor; also of the emperor (<a onClick="return mV(\'Act\',25,10);">Ac 25:10</a>); then of God (<a onClick="return mV(\'Rom\',14,10);">Ro 14:10</a>), of Christ (<a onClick="return mV(\'2Cr\',5,10);">2Co 5:10</a>). The word kriterion, "a tribunal," "bench of judges" (<a onClick="return mV(\'Jam\',2,6);">Jas 2:6</a>) occurs also in <a onClick="return mV(\'1Cr\',6,\'2-4\');">1Co 6:2-4</a>, and is there translated in the Revised Version margin by "tribunals."`<a href="./study/isbe/search.html?string=JUDGE">JUDGE</a>`1';
isbe[5217]='Judgment, Day of``<a href="./study/isbe/search.html?string=JUDGMENT+LAST">JUDGMENT, LAST</a>`1';
isbe[5218]='Judgment, Last`1. A Transcendental Doctrine:<P>In Christian theology the Last Judgment is an act in which God interposes directly into human history, brings the course of this world to a final close, determines the eternal fate of human beings, and places them in surroundings spiritually adapted to their final condition. The concept is purely transcendental, and is to be distinguished from the hope that God will interfere in the history of this world to determine it undeviatingly toward good. The transcendental doctrine is possible only when an exalted idea of God has been attained, although it may afterward be united with crasser theories, as in certain naive conceptions of Christianity at the present day.<P>2. The Doctrine in the Religion of Israel:<P>In the religion of Israel, the doctrine of the Last Judgment arose from "transcendentalizing" the concept of the "Day of the Lord." Just as hope of immortality replaced desire for length of days on earth, just the as for "the rejuvenation of Palestine" was substituted "an eternal abode in a new earth," so the ideal of a military victory over Israel\'s enemies expanded into God\'s solemn condemnation of evil. The concept thus strictly defined is hardly to be sought in the Old Testament, but <a onClick="return mV(\'Dan\',12,\'1-3\');">Da 12:1-3</a> may contain it. The first unequivocal assertion would appear to be in Enoch 91:17, where the final state is contrasted with a preceding reign of earthly happiness. (If there has been no redaction in the latter part of this section, its date is prior to 165 BC.) Hereafter the idea is so prevalent in the Jewish writings that detailed reference is needless. But it is by no means universal. Writings touched with Greek thought (En 108; 4 Macc; Philo) are content with an individual judgment at death. A unique theory is that of the Testament of the Twelve Patriarchs (<a onClick="return mV(\'Lev\',18,\'8-14\');">Levi 18:8-14</a>, e.g.), where the world grows into final blessedness without catastrophe. But much more common is the persistence of the non-transcendental ideas, ingrained as they were in the thought of the people (even in Philo; compare his prophecy of national earthly glory in Excr 9). This type of thought was so tenacious that it held its own alongside of the transcendental, and both points of view were accepted by more than one writer. Then the earthly happiness precedes the heavenly (as in Enoch 91), and there are two judgments, one by the Messiah and the other by God (2Esdras 7; Syriac Baruch 30). So in <a onClick="return mV(\'Rev\',19,\'1-\');">Revelation 19</a> where Christ overcomes the enemies in battle-symbolism and establishes the Millennium, while the Last Judgment is held by God (<a onClick="return mV(\'Rev\',20,11);">20:11</a>ff). Otherwise the Messiah is never the judge except in the Parables of Enoch, where He appears as God\'s vicar uniformly (in <span class="noTag">47:3</a> God fixes the time of judgment only). Possibly in The <span class="noTag">Wisdom of Solomon 4:16; 5:1</span> men share in the judgment-act but otherwise they (and angels) appear only as "assessors" or as executors of the sentence. In The <span class="noTag">Wisdom of Solomon 3:8</span>, "judging" is used in the Old Testament sense of "rule" (<a onClick="return mV(\'Jdg\',3,10);">Jud 3:10</a>, etc.), as is the case in <a onClick="return mV(\'Mat\',19,28);">Mt 19:28</a> parallel <a onClick="return mV(\'Luk\',22,30);">Lu 22:30</a>; <a onClick="return mV(\'1Cr\',6,2,3);">1Co 6:2,3</a> (in the last case with the word in two senses). Further studies in the variation of the (rather conventionally fixed) details of the judgment will interest the special student only.<P>For discussions of the relevant Biblical passages, see <a href="./study/isbe/search.html?string=DAY+OF+THE+LORD">DAY OF THE LORD</a>; <a href="./study/isbe/search.html?string=ESCHATOLOGY">ESCHATOLOGY</a>; <a href="./study/isbe/search.html?string=PAROUSIA">PAROUSIA</a>. The doctrine has real religious value, for it insists on a culmination in the evolution (or degeneration!) of the race as well as of the individual. So it is contrasted with the pessimism of natural science, which points only toward the gradual extinction of humanity through the cooling of the sun.<P>LITERATURE.<P>The variations of the concept are treated, fully only in Volz, Judische Eschatologie. For general literature see <a href="./study/isbe/search.html?string=ESCHATOLOGY">ESCHATOLOGY</a>; <a href="./study/isbe/search.html?string=PAROUSIA">PAROUSIA</a>.``48';

isbe[5222]='Judith`joo\'-dith (for etymology, see next article [<A href="./study/isbe/search.html?string=JUDITH,+BOOK+OF">Judith, Book of</a>]):<P>(1) A wife of Esau, daughter of Beeri the Hittite (<a onClick="return mV(\'Gen\',26,34);">Ge 26:34</a>).<P>(2) The heroine of the Book of Judith in Apocrypha—a pious, wealthy, courageous, and patriotic widow who delivered Jerusalem and her countrymen from the assault of Holofernes, the general of Nebuchadnezzar who had arranged the expedition which aimed at making Nebuchadnezzar the object of universal human worship.<P>The 8th and following chapters of the book describe her actions which resulted in the cutting off of the head of Holofernes, the rout of the Assyrian army, and the deliverance of the Jews.`<a href="./study/isbe/search.html?string=JUDITH,+BOOK+OF">JUDITH, BOOK OF</a>`1';
isbe[5223]='Judith, Book of`<b>I. NAME</b><P><b>II. CANONICITY</b><P><b>III. CONTENTS</b><P><b>IV. FACT OR FICTION?</b><P><b>V. DATE</b><P class="in15">1. Probably during the Maccabean Age<P class="in15">2. Other Opinions<P class="in30">(1) Invasion of Pompey<P class="in30">(2) Insurrection under Bar Cochba<P><b>VI. ORIGINAL LANGUAGE</b><P><b>VII. VERSIONS</b><P class="in15">1. Greek<P class="in15">2. Syriac<P class="in15">3. Latin<P class="in15">4. Hebrew<P></a>LITERATURE</a><hr /><P>I. Name.<P>This apocryphal book is called after the name of its principal character Judith (yehudhith], "a Jewess"; Ioudith, Ioudeth). The name occurs in <a onClick="return mV(\'Gen\',26,34);">Ge 26:34</a> and the corresponding masculine form (yehudhi, "a Jew") in <a onClick="return mV(\'Jer\',36,14,21,23);">Jer 36:14,21,23</a> (name of a scribe). In other great crises in Hebrew history women have played a great part (compare Deborah, <a onClick="return mV(\'Jdg\',5,\'1-\');">Jud 5</a>, and Esther). The Books of Ruth, Esther, Judith and Susannah are the only ones in the Bible (including the Apocrypha) called by the names of women, these women being the principal characters in each case.<P>II. Canonicity.<P>Though a tale of Jewish patriotism written originally in Hebrew, this book was never admitted into the Hebrew Canon, and the same applies to the Book of Tobit. But both Judith and Tobit were recognized as canonical by the Council of Carthage (397 AD) and by the Council of Trent (1545 AD). Though, however, all Romanists include these books in their Bible (the Vulgate), Protestant versions of the Bible, with very few exceptions, exclude the whole of the Apocrypha (see <a href="./study/isbe/search.html?string=APOCRYPHA">APOCRYPHA</a>). In the Septuagint and Vulgate, Tobit and Judith (in that order) follow Nehemiah and precede Esther. In the English Versions of the Bible of the Apocrypha, which unfortunately for its understanding stands alone, 1Esdras, 2Esdras, Tobit and Judith occupy the first place and in the order named. In his translation of the Apocrypha, Luther, for some unexplained reason, puts Judith at the head of the apocryphal books, Wisdom taking the next place.<P>III. Contents.<P>The book opens with an account of the immense power of Nebuchadnezzar, king of Assyria, whose capital was Nineveh. (In the days of the real Nebuchadnezzar, Assyria had ceased to be, and its capital was destroyed.) He calls upon the peoples living in the western country, including Palestine, to help him to subdue a rival king whose power he feared—Arphaxad, king of the Medes (otherwise quite unknown). But as they refused the help he demanded, he first conquered his rival, annexing his territory, and then sent his general Holofernes to subdue the western nations and to punish them for their defiance of his authority. The Assyrian general marched at the head of an army 132,000 strong and soon took possession of the lands north and east of Palestine, demolishing their idols and sanctuaries that Nebuchadnezzar alone might be worshipped as god (Judith 1-3). He now directed his forces against the Jews who had recently returned from exile and newly rebuilt and rededicated their temple. Having heard of the ruin of other temples caused by the invading foe, the Jews became greatly alarmed for the safety of their own, and fortified the mountains and villages in the south, providing themselves with food to meet their needs in the event of war. At the urgent request of Joakim ("Eliakim" in the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) and Peshitta), the inhabitants of Bethulia (so the Latin, English, and other VSS, but Betuloua is more correct according to the Greek) and of Betomestham (both places otherwise unknown) defended the adjoining mountain passes which commanded the way to Jerusalem. Holofernes at once laid siege to Bethulia, and by cutting off the water supply aimed at starving the people to submission. But he knows little of the people he is seeking to conquer, and asks the chiefs who are with him who and what these Jews are. Achior, the Ammonite chief, gives an account of the Israelites,<P>cluding that when faithful to their God they were invincible, but that when they disobeyed Him they were easily overcome. Achior is for this saying expelled and handed over to the Jews. After holding out for some days, the besieged people insisted that Onias their governor should surrender. This he promises to do if no relief comes in the course of five days. A rich, devout and beautiful widow called Judith (daughter of Merari, of the tribe of Simeon (Jth 8:1)), hearing of these things, rebukes the murmurers for their lack of faith and exhorts them to trust in God. As Onias abides by his promise to the people, she resolves to attempt another mode of deliverance. She obtains consent to leave the fortress in the dead of night, accompanied by her maidservant, in order to join the Assyrian camp. First of all she prays earnestly for guidance and success; then doffing her mourning garb, she puts on her most gorgeous attire together with jewels and other ornaments. She takes with her food allowed by Jewish law, that she might have no necessity to eat the forbidden meats of the Gentiles. Passing through the gates, she soon reaches the Assyrians. First of all, the soldiers on watch take her captive, but on her assuring them that she is a fugitive from the Hebrews and desires to put Holofernes in the way of achieving a cheap and easy victory over her fellow-countrymen, she is warmly welcomed and made much of. She reiterates to Holofernes the doctrine taught by Achior that these Jews can easily be conquered when they break the laws of their Deity, and she knows the necessities of their situation would lead them to eat food prohibited in their sacred laws, and when this takes place she informs him that he might at once attack them. Holofernes listens, applauds, and is at once captured by her personal charms. He agrees to her proposal and consents that she and her maid should be allowed each night to say their prayers out in the valley near the Hebrew fortress. On the 4th night after her arrival, Holofernes arranges a banquet to which only his household servants and the two Jewesses are invited. When all is over, by a preconcerted plan the Assyrian general and the beautiful Jewish widow are left alone. He, however, is dead drunk and heavily asleep. With his own scimitar she cuts off his head, calls her maid who puts it into the provision bag, and together they leave the camp as if for their usual prayers and join their Hebrew compatriots, still frantic about the immediate future. But the sight of the head of their arch foe puts new heart into them, and next day they march upon the enemy now in panic at what had happened, and win an easy victory. Judith became ever after a heroine in Jewish romance and poetry, a Hebrew Joan of Arc, and the tale of the deliverance she wrought for her people has been told in many languages. For later and shorter forms of the tale see VII, 4 (Hebrew Midrashes).<P>IV. Fact or Fiction?<P>The majority of theologians down to the 19th century regarded the story of Judith as pure history; but with the exception of O. Wolf (1861) and yon Gumpach, Protestant scholars in recent times are practically agreed that the Book of Judith is a historical novel with a purpose similar to Daniel, Esther and Tobit. Schurer classes it with "parenetic narratives" (paranetische Erzahlung). The Hebrew novel is perhaps the earliest of all novels, but it is always a didactic novel written to enforce some principle or principles. Roman Catholic scholars defend the literal historicity of the book, though they allow that the proper names are more or less disguised. But the book abounds with anachronisms, inconsistencies and impossibilities, and was evidently written for the lesson it teaches: obey God and trust Him, and all will be well. The author had no intention to teach history. Torrey, however, goes too far when he says (see Jewish Encyclopedia, "Book of Judith") that the writer aimed at nothing more than to write a tale that would amuse. A tone of religious fervor and of intense patriotism runs through the narrative, and no opportunity of enforcing the claims of the Jewish law is lost. Note especially what is taught in the speeches of Achior (Jth 5:12-21) and Judith (8:17-24; compare 11:10), that, trusting in God and keeping His commandments, the nation is invulnerable.<P>According to the narrative Nebuchadnezzar has been for 12 years king of Assyria and has his capital at Nineveh, though we know he never was or could be king of Assyria. He became king of Babylon in 604 BC, upon the death of his father Nabopolassar, who in 608 had destroyed Assyria. The Jews had but recently returned from exile (Jth 4:3; 5:19), but were independent, and Holofernes knew nothing about them (Jth 5:3). Nebuchadnezzar died in 561 BC and the Jews returned under Cyrus in 538. Bethulia to which Holofernes lay siege was otherwise quite unknown: it is probably a disguised form of Beth \'Elohim or Beth \'Eloah, "house of God," and means the place where God is with His people. The detailed description of the site is but part of the writer\'s art; it was the place which every army must pass on its way to Jerusalem. As a matter of fact, there is no such position in Palestine, and least of all Shechem, which Torrey identified with Bethulia. We know nothing besides what Judith 1 tells us of "Arphaxad who reigned over the Medes in Ecbatana"; on the contrary, in every other mention of the name it stands for a country or a race (see <a onClick="return mV(\'Gen\',10,22,24);">Ge 10:22,24</a>; <a onClick="return mV(\'Gen\',11,\'10-13\');">11:10-13</a>).<P>V. Date.<P>1. Probably during the Maccabean Age:<P>It is evident that this religious romance was prompted by some severe persecution in which the faith of the Jews was sorely tried, and the writer\'s dominant aim is identical with that of the author of Daniel, namely, to encourage those suffering for their religion by giving instances of Divine deliverance in the darkest hour. "Only trust and keep the law; then deliverance will unfailingly come"—that is the teaching. Judith might well have been written during the persecution of the Maccabean age, as was almost certainly the Book of Daniel. We have in this book that zeal for orthodox Judaism which marked the age of the Maccabees, and the same strong belief that the war in which the nation was engaged was a holy one. The high priest is head of the state (see Jth 4:6), as suiting a period when the religious interest is uppermost and politics are merged in religion, though some say wrongly that John Hyrcanus (135-106 BC) was the first to combine priestly and princely dignities. We have another support for a Maccabean date in the fact that Onias was high priest during the siege of Bethulia (Jth 4:6), the name being suggested almost certainly by Onias III, who became high priest in 195 (or 198) BC, and who died in 171 after consistently opposing the Hellenizing policy of the Syrians and their Jewish allies.<P>That the persecutions of Antiochus Epiphanes (175-164 BC) supply as good a background for this book as any other event in Jewish history is the least that can be said; but one may not be dogmatic on the matter, as similar conditions recurred in the nation\'s history, and there is no external or internal evidence that fixes the date definitely. The following scholars decide for a date in the Maccabean age: Fritzsche, Ewald, Hilgenfeld, Schurer, Ball, Cornill and Lohr. The author was certainly a resident in Palestine, as his local knowledge and interests show; and from his punctilious regard for the law one may judge that he belonged to the Hasidean (chacidhim) party. Since he so often mentions Dothan (Greek Dothae, Dothaim) (Jth 3:9; 4:6; 7:3,18; 8:3), it is probable that he belonged to that neighborhood. Though, however, the author wrote in the time of the Maccabees, he seems to set his history in a framework that is some 200 years earlier, as Noldeke (Die alttest. Lit.,1868,96; Aufsatze zur persischen Geschichte,1887,78) and Schurer (GJV, III, 323ff) show. In 350 BC, Artaxerxes Ochus (361-338 BC) invaded Phoenicia and Egypt, his chief generals being Holofernes (Jth 2:4, etc.) and Bagoas (Jth 12:11), both of whom are in Judith officials of King Nebuchadnezzar and take part in the expedition against the Jews. This was intended probably to disarm the criticism of enemies who might resent any writing in which they were painted in unfavorable colors.<P>2. Other Opinions:<P>(1) Invasion of Pompey.<P>That it was the invasion of Pompey which gave rise to the book is the opinion held by Gaster. If this were so, Judith and the Psalms of Solomon arose under the pressure of the same circumstances (see Ryle and James, The Psalms of Solomon, XL, and J. Rendel Harris, The Odes and Psalms of Solomon, XIII) But in the Psalms of Solomon the supreme ruler is a king (<span class="noTag">17:22</span>), not a high priest (Judith 4:6). Besides, anyone who reads the Psalm of Solomon and Judith will feel that in the former he has to do with a different and later age.<P>(2) Insurrection under Bar Cochba.<P>Hitzig (who held that the insurrection under Bar Cochba, 132 AD, is the event referred to), Volkmar and Graetz date this book in the days of the emperor Trajan (or Hadrian?). Volkmar gives himself much trouble in his attempt to prove that the campaigns of Nebuchadnezzar stand really for those of Trajan. But it is a sufficient refutation of this opinion that the book is quoted by Clement of Rome (55), who died in 100 AD, and whose reference to the book shows that it was regarded in his day as authoritative and even as canonical, so that it must have been written long before.<P>VI. Original Language.<P>That a Hebrew or (less likely) an Aramaic original once existed is the opinion of almost all modern scholars, and the evidence for this seems conclusive. There are many Hebraisms in the book, e.g. en tais hemerais ("in the days of," Jth 1:7, and 9 times besides); the frequent use of sphodra, in the sense of the Hebrew me\'odh, and even its repetition (also a Hebraism, Jth 4:8); compare epi polu sphodra (Jth 5:18) and plethos polu sphodra (Jth 2:17). Note further the following: "Let not thy eye spare" etc. (Jth 2:11; compare <a onClick="return mV(\'Eze\',5,11);">Eze 5:11</a>, etc.); "as I live" (in an oath, Jth 2:12); "God of heaven" (Jth 5:8; 11:17); "son of man," parallel with "man," and in the same sense (Jth 8:16); "and it came to pass when she had ceased crying," etc. (Jth 10:1); "the priests who serve in Jerusalem before the face of our God" (Jth 11:13). In Jth 16:3 we have the words: "For a god that shatters battle is (the) Lord." Now "Lord" without the article can be only the Hebrew "Yahweh," read always \'adhonay, "Lord." But the phrase, "to shatter battle," is not good Greek or good sense. The Hebrew words shabhath ("to rest"; compare shabbath, "Sabbath") and shabhar ("to break") are written much alike, and in the original Hebrew we must have had the causative form of the first vb.: "A God that makes war cease is (the) Lord" (see <a onClick="return mV(\'Psa\',46,9);">Ps 46:9</a>). Moreover, the Hebrew idiom which strengthens a finite verb by placing a cognate (absolute) infinitive before it is represented in the Greek of this book in the usual form in which it occurs in the Septuagint (and in Welsh), namely, a participle followed by a finite verb (see Jth 2:13). The present writer has noted other examples, but is prevented by lack of space from adding them here. That the original book was Hebrew and not Aramaic is made extremely likely by the fact that the above examples of Hebrew idiom are peculiar to this language. Note especially the idiom, "and it came to pass that," etc. (Jth 2:4), with the implied "waw consecutive," and what is said above about Jth 11:13, where the senseless Greek arose through the confusion of two similarly written Hebrew (not Aramaic) words. There are cases also of mistakes in the Greek text due to wrong translation from the Hebrew, as in Jth 1:8 (where for "nations" read "cities" or "mountains"); Jth 2:2 (where for "concluded," Hebrew wa-yekhal, read "revealed," wa-ye-ghal); Jth 3:1,9,10 (see Fritzsche, under the word), etc.<P>VII. Versions.<P>1. Greek:<P>The Greek text appears in three forms:<P>(1) that of the principal Greek uncials (A, B, agreeing closely), which is followed in printed editions of the Septuagint (Septuagint);<P>(2) that of codices 19, 108 (Lucian\'s text), an evident revision of (1);<P>(3) codex 58 which closely resembles (2) and with which the Old Latin and Peshitta agree in most points.<P>2. Syriac:<P>There are two extant Syriac VSS, both of them dependent on the Greek text (3) noted above. The Peshitta is given in Walton\'s Polyglot and in a critically revised form in Lagarde, Lib. Vet. Test Apocrypha Syriac, 104-26. The so-called Hexaplar Syriac text was made by Paul of Tella in the 6th century<P>3. Latin:<P>(1) The Old Latin seems to have been made from the Greek text, codex 58 (see above).<P>(2) Jerome made his Latin version (with which the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) is identical) from a lost Chaldee version. That this last is not the original text of the book is certain, because neither Origen nor his Jewish teachers knew anything of a Hebrew or Aramaic text of Judith.<P>4. Hebrew Midrashes<P>Several late Hebrew versions of the book have been found, no one of them with strong claims to be considered the original text, though Caster (see EB, II, <span class="noTag">col 2,642</span>) does make such a claim for the manuscript found, edited and translated by him (see PSBA, XVI, 156-63). The Hebrew midrashes were made to be read in Jewish homes and vary according to the circumstances of their origin. But they agree in these points: Proper names are often omitted. Jerusalem is the scene of action, the wars being those of the Maccabees. Judith is a Jewish maiden and daughter of Ahitah, according to the Gaster MS, and she belongs apparently to the Maccabean family. It is Nicanor who is beheaded, the occasion being the Feast of Dedication; in the Gaster manuscript it is the king who is killed. Translations of these midrashes may be seen in Jellinck, Beth Hammidrash, I, 130-41; II, 12f; Lepsius, Zeitschr. fur wiss. Theologie,1867,337ff; Ball, Speaker\'s Apocrypha, I, 25ff; Scholz, Comm.2, Anhange I and II; Gaster, in the work quoted Gaster argues that the much shorter form of the tale in his manuscript is older than the longer version. But if a writer were to expand a short story, he would hardly be likely to invent several proper names and to change others. It is probable that Judith came to be represented as a pure maiden (a virgin) under the influence of the low conception of marriage fostered in the medieval Christian church.<P>LITERATURE.<P>For the editions of the Greek text and for commentaries on the Apocrypha, see under <a href="./study/isbe/search.html?string=APOCRYPHA">APOCRYPHA</a>. But on Judith note in particular the commentaries by Fritzsche and Ball, the latter containing elaborate bibliography. But the following must in addition be mentioned: Scholz, Commentar uber das Buch Judith und uber Bel und Drache, 1896; a 2nd edition has appeared; A.S. Weissmann, Das Buch Judith historisch-kritisch beleuchtet, Wien, 1891; Schurer, GJV4, III, 230-37, with full bibliography; compare HJP, II, iii, 32-37; Pentin, The Apocrypha in English Lit., Judith, 1908; and the relevant articles in the Bible dicts., especially that by F. C. Porter in HDB.``33';
isbe[5224]='Juel`joo\'-el (1) Iouna; (2) Iouel:<P>(1) 1Esdras 9:34 = "Uel" in <a onClick="return mV(\'Ezr\',10,34);">Ezr 10:34</a>.<P>(2) 1Esdras 9:35 = "Joel" in <a onClick="return mV(\'Ezr\',10,43);">Ezr 10:43</a>.``1';
isbe[5225]='Jugglery`jug\'-ler-i goetia: The word occurs once in 2Macc 12:24 the Revised Version margin (the King James Version "craft," the Revised Version (British and American) "crafty guile").``1';
isbe[5226]='Juice`joos, jus: The word occurs once in <a onClick="return mV(\'Sgs\',8,2);">So 8:2</a> (translation of \'acic, the Revised Version margin "sweet wine"), and once in the Revised Version margin of <a onClick="return mV(\'Job\',6,6);">Job 6:6</a>, where for "the white of an egg" margin reads, "the juice of purslain." Septuagint has rhemasin kenois, "empty words."``1';
isbe[5227]='Julia`joo\'-li-a (Ioulia): The name of a Roman Christian to whom Paul sent greetings, the wife or sister of Philologus with whose name hers is coupled (<a onClick="return mV(\'Rom\',16,15);">Ro 16:15</a>). The name points to member of the imperial household.``1';
isbe[5228]='Julius`joo\'-li-us (Ioulios): The centurion of the Augustan cohort under whose charge Paul was sent a prisoner to Rome (<a onClick="return mV(\'Act\',27,1,3);">Ac 27:1,3</a>).`<a href="./study/isbe/search.html?string=ARMY,+ROMAN">ARMY, ROMAN</a>; <a href="./study/isbe/search.html?string=AUGUSTAN+BAND">AUGUSTAN BAND</a>`1';
isbe[5229]='Jumping`jum\'-ping.<P>See <a href="./study/isbe/search.html?string=GAMES">GAMES</a>.``1';
isbe[5230]='Junias; Junla`joo\'-ni-as or joo\'-ni-a (Iounias, Iounia): One to whom, with Andronicus, greetings are sent by Paul at the close of his letter to the Romans (<a onClick="return mV(\'Rom\',16,7);">Ro 16:7</a>). The name may be masculine, Junias, a contraction of Junianus, or feminine Junia; it is Iounian, the accus. form, that is given. In all probability this is the masc., Junias. Paul defines the two as<P class="in15">(1) "my kinsmen,"<P class="in15">(2) "my fellow-prisoners,"<P class="in15">(3) "who are of note among the apostles," and<P class="in15">(4) "who also have been in Christ before me."<P>(1) They were Jews. Paul calls the Jews "my brethren," "my kinsmen according to the flesh" (<a onClick="return mV(\'Rom\',9,3);">Ro 9:3</a>). Because Prisca and Aquila, a Jew and Jewess, are not designated as kinsfolk, Conybeare and Howson suppose "the epithet to denote that the persons mentioned were of the tribe of Benjamin."<P>(2) They had been companions of Paul in some unrecorded imprisonment. The phrase denotes more than the fact that they, like Paul, had suffered imprisonment for the sake of Christ.<P>(3) This may mean<P class="in15">(a) that they were well known to the apostolic circle (so Gifford and Weiss), or<P class="in15">(b) distinguished as apostles. The latter is probably correct, "apostle" being used in a wide sense (compare <a onClick="return mV(\'1Cr\',15,7);">1Co 15:7</a>).<P>The prophetic ministry of the early church consisted of apostles, prophets and teachers (<a onClick="return mV(\'1Cr\',12,28);">1Co 12:28</a>; <a onClick="return mV(\'Eph\',4,11);">Eph 4:11</a>), the apostles being missionaries in the modern sense (see Lindsay, Church and Ministry, chapter iii). Some apostles were missionaries sent out by particular churches (<a onClick="return mV(\'Act\',13,2,3);">Ac 13:2,3</a>; <a onClick="return mV(\'2Cr\',8,23);">2Co 8:23</a>; <a onClick="return mV(\'Phl\',2,25);">Php 2:25</a>).<P>(4) They were among the first converts, "early disciples" like Mnason of Cyprus (<a onClick="return mV(\'Act\',21,16);">Ac 21:16</a>).``78';
isbe[5231]='Juniper`joo\'-ni-per (rothem; rhathmen, <a onClick="return mV(\'1Ki\',19,4);">1Ki 19:4</a>f; margin "broom"; <a onClick="return mV(\'Psa\',120,4);">Ps 120:4</a>, m "broom"; <a onClick="return mV(\'Job\',30,4);">Job 30:4</a> translated "broom"): This is quite certainly the Arabic ratam (Retama retem, Natural Order, Leguminosae), a variety of broom which is one of the most characteristic shrubs of the deserts of Southern Palestine and southward to Egypt. Though the shade it affords is but scanty, in the absence of other shrubs it is frequently used by desert travelers as a refuge from the sun\'s scorching rays (compare <a onClick="return mV(\'1Ki\',19,4);">1Ki 19:4</a>). The root yields good charcoal, giving out much heat (<a onClick="return mV(\'Psa\',120,4);">Ps 120:4</a>). For people to be reduced to chew it for nourishment betokens the lowest depth of starvation (<a onClick="return mV(\'Job\',30,4);">Job 30:4</a>). Indeed so hopeless is this root as a source of food that many commentators believe that the accepted text is in error, and by altering a single letter, substituting the Hebrew letter, cheth, ("ch") for he ("h"), they get a reading, which has been adopted in the Revised Version margin, "to warm them" instead of "their meat," which certainly is much more probable.``117';
isbe[5232]='Jupiter`joo\'-pi-ter, ju\'-pi-ter (Zeus): "Jupiter" is mentioned in 2Macc 6:2; <a onClick="return mV(\'Act\',14,12,13);">Ac 14:12,13</a>, with "Zeus" in the Revised Version margin in all cases. In addition the Greek stem appears in diopetous, in <a onClick="return mV(\'Act\',19,35);">Ac 19:35</a>, English Versions of the Bible "which fell down from Jupiter"; but the word means "from the clear sky" (compare "from heaven" in the Revised Version margin). "Jupiter" was considered the Latin equivalent of the Greek "Zeus," the highest god in the developed Greek pantheon, and Zeus in turn, in accord with the syncretism of the period, was identified with countless deities in the local cults of Asia Minor and elsewhere. So in <a onClick="return mV(\'Act\',14,12,13);">Ac 14:12,13</a>, "Zeus" and "Hermes" are local deities that had been renamed. On the other hand, the Zeus of 2Macc 6:2 is the genuine Greek deity, who had been adopted as a special patron by Antiochus Epiphanes and to whose temple in Athens Antiochus had contributed largely. The title "Olympius" (2Macc 6:2) is derived from the early worship on Mt. Olympus, but had come to be thought one of the god\'s highest appellations; Xenios, "protector of strangers," was a title in a cult particularly popular with travelers.<P>See also Smith, HGHL, 333-34.`<a href="./study/isbe/search.html?string=ABOMINATION+OF+DESOLATION">ABOMINATION OF DESOLATION</a>`48';
isbe[5233]='Jupiter And Mercury``<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>; <a href="./study/isbe/search.html?string=MERCURY">MERCURY</a>; <a href="./study/isbe/search.html?string=JUPITER">JUPITER</a>`1';
isbe[5234]='Jurisdiction`joo-ris-dik\'-shun (exousia): The word exousia is well known in New Testament Greek. It is derived from the word exesti, and suggests the absence of any hindrance to an act. It contains the idea of right and might (Cremer). In the New Testament it means right, authority, capability (<a onClick="return mV(\'Rom\',9,21);">Ro 9:21</a>); power, strength (<a onClick="return mV(\'Mat\',9,8);">Mt 9:8</a>); right and might (<a onClick="return mV(\'Jhn\',5,27);">Joh 5:27</a>). Thus it gets the meaning of the powers of the magistrate, which it bears in later Greek (<a onClick="return mV(\'Tts\',3,1);">Tit 3:1</a>; <a onClick="return mV(\'Rom\',13,\'1-3\');">Ro 13:1-3</a>). And in this sense it is used in <a onClick="return mV(\'Luk\',23,7);">Lu 23:7</a>, where it is translated "jurisdiction."``1';
isbe[5235]='Jushab-Hesed`joo\'-shab-he\'-sed (yushabh checedh, "loving-kindness is returned"): Son of Zerubbabel. The name is probably symbolical (<a onClick="return mV(\'1Ch\',3,20);">1Ch 3:20</a>);`<a href="./study/isbe/search.html?string=SHEAR-JASHUB">SHEAR-JASHUB</a>`1';
isbe[5236]='Justice`jus\'-tis (tsedhaqah; tsedheq; dikaiosune): The original Hebrew and Greek words are the same as those rendered "righteousness." This is the common rendering, and in about half the cases where we have "just" and "justice" in the King James Version, the American Standard Revised Version has changed to "righteous" and "righteousness." It must be constantly borne in mind that the two ideas are essentially the same.<P>See <a href="./study/isbe/search.html?string=RIGHTEOUSNESS">RIGHTEOUSNESS</a>.<P>1. Human Justice:<P>Justice had primarily to do with conduct in relation to others, especially with regard to the rights of others. It is applied to business, where just weights and measures are demanded (<a onClick="return mV(\'Lev\',19,35,36);">Le 19:35,36</a>; <a onClick="return mV(\'Deu\',25,\'13-16\');">De 25:13-16</a>; <a onClick="return mV(\'Amo\',8,5);">Am 8:5</a>; <a onClick="return mV(\'Pro\',11,1);">Pr 11:1</a>; <a onClick="return mV(\'Pro\',16,11);">16:11</a>; <a onClick="return mV(\'Eze\',45,9,10);">Eze 45:9,10</a>). It is demanded in courts, where the rights of rich and poor, Israelite and sojourner, are equally to be regarded. Neither station nor bribe nor popular clamor shall influence judge or witness. "Justice, justice shalt thou follow" (<a onClick="return mV(\'Deu\',16,20);">De 16:20</a>; compare <a onClick="return mV(\'Deu\',16,\'18-20\');">De 16:18-20</a>; <a onClick="return mV(\'Exd\',23,\'1-3\',\'6-9\');">Ex 23:1-3,6-9</a>). In general this justice is contrasted with that wickedness which "feared not God, and regarded not man" (<a onClick="return mV(\'Luk\',18,2);">Lu 18:2</a>).<P>In a larger sense justice is not only giving to others their rights, but involves the active duty of establishing their rights. So Israel waits upon God\'s justice or cries out: "The justice due to me (literally, "my justice") is passed away from my God" (<a onClick="return mV(\'Isa\',40,27);">Isa 40:27</a>). Yahweh is to show her to be in the right as over against the nations. Justice here becomes mercy. To "seek justice" means to "relieve the oppressed, judge the fatherless, plead for the widow" (<a onClick="return mV(\'Isa\',1,17);">Isa 1:17</a>; compare <a onClick="return mV(\'Isa\',11,4);">Isa 11:4</a>; <a onClick="return mV(\'Jer\',22,15,16);">Jer 22:15,16</a>; <a onClick="return mV(\'Psa\',82,\'2-4\');">Ps 82:2-4</a>). The same idea appears in <a onClick="return mV(\'Deu\',24,12,13);">De 24:12,13</a>; <a onClick="return mV(\'Psa\',37,21,26);">Ps 37:21,26</a>; <a onClick="return mV(\'Psa\',112,\'4-6\');">112:4-6</a>, where the translation is "righteous" instead of "just."<P>In this conception of justice the full meaning of the New Testament is not yet reached. It does not mean sinlessness or moral perfection. Job knows the sin in his heart (<a onClick="return mV(\'Job\',13,23,26);">Job 13:23,26</a>; <a onClick="return mV(\'Job\',7,21);">7:21</a>), and yet speaks of himself as a just or righteous man (<a onClick="return mV(\'Job\',12,4);">12:4</a>; <a onClick="return mV(\'Job\',14,18);">13:18</a>). The Psalmist confidently depends upon the righteousness of God though he knows that no man is righteous in God\'s sight (<a onClick="return mV(\'Psa\',143,1,2);">Ps 143:1,2</a>; compare <a onClick="return mV(\'Psa\',7,8);">Ps 7:8</a>; <a onClick="return mV(\'Psa\',18,\'20-24\');">18:20-24</a>). It is not a lack of humility or dependence upon God when the Psalmist asks to be judged according to his righteousness. In relation to God, the just, or righteous, man is the one who holds to God and trusts in Him (<a onClick="return mV(\'Psa\',33,\'18-22\');">Ps 33:18-22</a>). This is not the later Judaistic legalism with its merit and reward, where God\'s justice is simply a matter of giving each man what he has earned.<P>The word "justice" does not occur in the New Testament, and in most cases where we find "just" in the King James Version it is changed to "righteous" in the American Standard Revised Version. The idea of justice or righteousness (remembering that these are essentially the same) becomes more spiritual and ethical in the New Testament. It is a matter of character, and God\'s own spirit is the standard (<a onClick="return mV(\'1Jo\',3,7);">1Joh 3:7</a>; <a onClick="return mV(\'Mat\',5,48);">Mt 5:48</a>). The mere give-and-take justice is not enough. We are to be merciful, and that to all. The ideal is righteousness, not rights. As Holtzmann says, "The keynote of the Sermon on the Mount is justitia and not jus."<P>2. Justice of God:<P>God\'s justice, or righteousness, is founded in His essential nature. But, just as with man, it is not something abstract, but is seen in His relation to the world. It is His kingship establishing and maintaining the right. It appears as retributive justice, "that reaction of His holy will, as grounded in His eternal being, against evil wherever found." He cannot be indifferent to good and evil (<a onClick="return mV(\'Hab\',1,13);">Hab 1:13</a>). The great prophets, Isaiah, Micah, Amos, Hosea, all insist upon Yahweh\'s demand for righteousness.<P>But this is not the main aspect of God\'s justice. Theology has been wont to set forth God\'s justice as the fundamental fact in His nature with which we must reconcile His mercy as best we may, the two being conceived as in conflict. As a matter of fact, the Scriptures most often conceive God\'s justice, or righteousness, as the action of His mercy. Just as with man justice means the relief of the oppressed and needy, so God\'s justice is His kingly power engaged on behalf of men, and justice and mercy are constantly joined together. He is "a just God and a Saviour" (<a onClick="return mV(\'Isa\',45,21);">Isa 45:21</a>). "I bring near my righteousness (or "justice")...and my salvation shall not tarry" (<a onClick="return mV(\'Isa\',46,13);">Isa 46:13</a>; compare <a onClick="return mV(\'Psa\',51,14);">Ps 51:14</a>; <a onClick="return mV(\'Psa\',103,17);">103:17</a>; <a onClick="return mV(\'Psa\',71,15);">71:15</a>; <a onClick="return mV(\'Psa\',116,5);">116:5</a>; <a onClick="return mV(\'Isa\',51,5,6);">Isa 51:5,6</a>). The "righteous acts of Yahweh" mean His deeds of deliverance (<a onClick="return mV(\'Jdg\',5,11);">Jud 5:11</a>). And so Israel sings of the justice, or judgments, or righteousness of Yahweh (they are the same), and proclaims her trust in these (<a onClick="return mV(\'Psa\',7,17);">Ps 7:17</a>; <a onClick="return mV(\'Psa\',35,23,24,28);">35:23,24,28</a>; <a onClick="return mV(\'Psa\',36,6);">36:6</a>; <a onClick="return mV(\'Psa\',140,12,13);">140:12,13</a>; <a onClick="return mV(\'Psa\',50,5,6);">50:5,6</a>; <a onClick="return mV(\'Psa\',94,14,15);">94:14,15</a>; <a onClick="return mV(\'Psa\',103,6);">103:6</a>; <a onClick="return mV(\'Psa\',143,1);">143:1</a>).<P>The New Testament, too, does not lack the idea of retributive justice. The Son of Man "shall render unto every man according to his deeds" (<a onClick="return mV(\'Mat\',16,27);">Mt 16:27</a>; compare <a onClick="return mV(\'Mat\',25,\'14-46\');">Mt 25:14-46</a>; <a onClick="return mV(\'Luk\',12,\'45-48\');">Lu 12:45-48</a>; <a onClick="return mV(\'Rom\',2,\'2-16\');">Ro 2:2-16</a>; <a onClick="return mV(\'Rom\',6,23);">6:23</a>; <a onClick="return mV(\'2Cr\',5,10);">2Co 5:10</a>; <a onClick="return mV(\'Col\',3,24,25);">Col 3:24,25</a>; <a onClick="return mV(\'2Th\',1,8,9);">2Th 1:8,9</a>; <a onClick="return mV(\'Hbr\',2,2,3);">Heb 2:2,3</a>; <a onClick="return mV(\'Hbr\',10,\'26-31\');">10:26-31</a>). But God\'s justice is far more than this. The idea of merit and reward is really superseded by a higher viewpoint in the teaching of Jesus. He speaks, indeed, of recompense, but it is the Father and not the judge that gives this (<a onClick="return mV(\'Mat\',6,1,4,6,18);">Mt 6:1,4,6,18</a>). And it is no mere justice of earth, because the reward transcends all merit (<a onClick="return mV(\'Mat\',24,46,47);">Mt 24:46,47</a>; <a onClick="return mV(\'Mar\',10,30);">Mr 10:30</a>; <a onClick="return mV(\'Luk\',12,37);">Lu 12:37</a>). This is grace not desert (<a onClick="return mV(\'Luk\',17,10);">Lu 17:10</a>). And the parable of <a onClick="return mV(\'Mat\',20,\'1-15\');">Mt 20:1-15</a> gives at length the deathblow to the whole Judaistic scheme of merit and reward.<P>And God\'s justice is not merely gracious, but redemptive. It not simply apportions rights, it establishes righteousness. Thus, just as in the Old Testament, the judge is the Saviour. The difference is simply here: in the Old Testament the salvation was more national and temporal, here it is personal and spiritual. But mercy is opposed to justice no more here than in the Old Testament. It is by the forgiveness of sins that God establishes righteousness, and this is the supreme task of justice. Thus it is that God is at the same time "just, and the justifier of him that hath faith in Jesus" (<a onClick="return mV(\'Rom\',3,26);">Ro 3:26</a>). "He is faithful and righteous (or "just"; see the King James Version) to forgive us our sins, and to cleanse us from all unrighteousness" (<a onClick="return mV(\'1Jo\',1,9);">1Joh 1:9</a>).<P>LITERATURE.<P>See Comm., and Biblical Theologies under "Justice" and "Righteousness," and especially Cremer, Biblical-Theol. Lex. of New Testament Greek``143';
isbe[5237]='Justification`jus-ti-fi-ka\'-shun (tsedheq, verb tsadheq; Septuagint and New Testament dikaioma, dikaiosis, verb dikaioo, "justification" "to justify," in a legal sense, the declaring just or righteous. In Biblical literature, dikaioun, without denying the real righteousness of a person, is used invariably or almost invariably in a declarative or forensic sense. See Simon, HDB, II, 826; Thayer, Grimm, and Cremer under the respective words):<P><b>I. THE WRITINGS OF PAUL</b><P class="in15">1. Universality of Sin<P class="in15">2. Perfection of the Law of God<P class="in15">3. Life, Work and Death of the Atoning Saviour<P class="in30">(1) Paul\'s Own Experience<P class="in30">(2) The Resurrection Connected with the Death<P class="in30">(3) Faith, Not Works, the Means of Justification<P class="in30">(4) Baptism Also Eliminated<P class="in30">(5) Elements of Justification<P class="in45">(a) Forgiveness of Sins<P class="in45">(b) Declaring or Approving as Righteous<P class="in30">(6) Justification Has to Do with the Individual<P><b>II. THE OTHER NEW TESTAMENT WRITINGS</b><P class="in15">1. The Synoptic Gospels<P class="in15">2. John\'s Writings<P class="in15">3. 1 Peter and Hebrews<P class="in15">4. Epistle of James<P><b>III. THE OLD TESTAMENT</b><P><b>IV. LATER DEVELOPMENT OF THE DOCTRINE</b><P class="in15">1. Apostolic and Early Church Fathers<P class="in15">2. Council of Trent<P class="in15">3. Luther<P class="in15">4. Schleiermacher<P class="in15">5. Meaning and Message to the Modern Man<P><b>LITERATURE</b><hr /><P>I. The Writings of Paul.<P>1. The Universality of Sin:<P>In this article reference will first be made to the writings of Paul, where justification receives its classic expression, and from there as a center, the other New Testament writers, and finally the Old Testament, will be drawn in. According to Paul, justification rests on the following presuppositions:<P>The universality of sin. All men are not only born in sin (<a onClick="return mV(\'Eph\',2,3);">Eph 2:3</a>), but they have committed many actual transgressions, which render them liable to condemnation. Paul proves this by an appeal to the Old Testament witnesses (<a onClick="return mV(\'Rom\',3,9);">Ro 3:9</a>), as well as by universal experience, both of the heathen (<a onClick="return mV(\'Rom\',1,\'18-32\');">Ro 1:18-32</a>) and Jews (<a onClick="return mV(\'Rom\',2,\'17-28\');">Ro 2:17-28</a>; <a onClick="return mV(\'Rom\',3,9);">3:9</a>).<P>2. Perfection of the Law of God:<P>The perfection of the Law of God and the necessity of its perfect observance, if justification is to come by it (<a onClick="return mV(\'Rom\',3,10);">Ro 3:10</a>). The modern notion of God as a good-natured, more or less nonchalant ruler, to whom perfect holiness is not inexorable, was not that of Paul. If one had indeed kept the law, God could not hold him guilty (<a onClick="return mV(\'Rom\',2,13);">Ro 2:13</a>), but such an obedience never existed. Paul had no trouble with the law as such. Those who have tried to find a difference here between Galatians and Romans have failed. The reminder that the law was ordained by angels (<a onClick="return mV(\'Gal\',3,19);">Ga 3:19</a>) does not mean that it was not also given by God. It might be reckoned in a sense among the elements of the world (kosmos, <a onClick="return mV(\'Gal\',4,3);">Ga 4:3</a>), as it is an essential part of an ordered universe, but that does not at all mean that it is not also holy, right and good (<a onClick="return mV(\'Rom\',7,12);">Ro 7:12</a>). It was added, of course, on account of transgressions (<a onClick="return mV(\'Gal\',3,19);">Ga 3:19</a>), for it is only a world of intelligent, free spirits capable of sin which needs it, and its high and beautiful sanctions make the sin seem all the more sinful (<a onClick="return mV(\'Rom\',7,13);">Ro 7:13</a>).<P>3. Life, Work and Death of the Atoning Savior:<P>It was fundamental in Paul\'s thinking that Christ died for our sins, according to the Scriptures (<a onClick="return mV(\'1Cr\',15,3);">1Co 15:3</a>). In due season He died for the ungodly (<a onClick="return mV(\'Rom\',5,6);">Ro 5:6</a>); while we were yet sinners He died for us (<a onClick="return mV(\'Rom\',5,8);">Ro 5:8</a>); we are justified in His blood (<a onClick="return mV(\'Rom\',5,9);">Ro 5:9</a>), and it is through Him that we are saved from the wrath (<a onClick="return mV(\'Rom\',5,9);">Ro 5:9</a>). While we were enemies we were reconciled to God through the death of His Son (<a onClick="return mV(\'Rom\',5,10);">Ro 5:10</a>), being justified freely by His grace through the redemption that is in Christ Jesus whom God set forth as a propitiation (<a onClick="return mV(\'Rom\',3,24,25);">Ro 3:24,25</a>). There is no reconciliation, no justification, except through and by and for Christ.<P>(1) Paul\'s Own Experience.<P>Paul\'s own experience cannot be left out of the account. He lived through the doctrine, as well as found it through illumination of the Spirit in the Old Testament. It was not that he had only outwardly kept the law. He had been jealous for it, and had been blameless in every requirement of its righteousness (<a onClick="return mV(\'Phl\',3,6);">Php 3:6</a>). What was borne in upon him was how little such blamelessness could stand before the absolute standard of God. Just how far he was shaken with doubts of this kind we cannot say with certainty; but it seems impossible to conceive the Damascus conversion scene in the case of such an upright man and strenuous zealot without supposing a psychological preparation, without supposing doubts as to whether his fulfilling of the law enabled him to stand before God. Now, for a Pharisaically educated man like himself, there was no way of overcoming these doubts but in a renewed struggle for his own righteousness shown in the fiery zeal of his Damascus journey, pressing on even in the blazing light of noonday. This conversion broke down his philosophy of life, his Lebensgewissheit, his assurance of salvation through works of the law done never so conscientiously and perfectly. The revelation of the glorified Christ, with the assurance that He, the God-sent Messiah, was the very one whom he was persecuting, destroyed his dependence on his own righteousness, a righteousness which had led him to such shocking consequences. Although this was for him an individual experience, yet it had universal applications. It showed him that there was an inherent weakness in the law through flesh, that is, through the whole physical, psychical and spiritual nature of man considered as sinful, as working only on this lower plane, and that the law needed bracing and illuminating by the Son, who, though sent in the likeness of the flesh of sin, yet (as an offering) for sin condemned sin and cast it out (<a onClick="return mV(\'Rom\',8,3);">Ro 8:3</a>), to the end that the law might be fulfilled in those who through Him walk not after the flesh but after the Spirit (<a onClick="return mV(\'Rom\',8,4);">Ro 8:4</a>). That was the glory of the new righteousness thus revealed. If the law had been able to do that, to give life, Christ need not have come, righteousness would have been by the law (<a onClick="return mV(\'Gal\',3,21);">Ga 3:21</a>). But the facts show that the law was not thus able, neither the law written on the heart given to all, nor the law given to Moses (<a onClick="return mV(\'Rom\',1,\'18-\');">Ro 1:18-3:19</a>). Therefore every mouth is stopped, and all flesh is silent before God. On the ground of law-keeping, what the modern man would call morality, our hope of salvation has been shattered. The law has spoken its judgment against us (<a onClick="return mV(\'Gal\',3,10);">Ga 3:10</a>). It cannot therefore lead us to righteousness and life, nor was that its supreme intention: it was a pedagogue or tutor ("paidagogos") to lead us to Christ that we might be justified by faith (<a onClick="return mV(\'Gal\',3,24);">Ga 3:24</a>; see Ihmels in RE3, 16, 483-84). What made Paul to differ from his companions in the faith was that his own bitter experience under the revelation of Christ had led him to these facts.<P>(2) The Resurrection Connected with the Death.<P>It was remarked above that the ground of justification according to Paul is the work of Christ. This means especially. His death as a sacrifice, in which, as Ritschl well says (Rechtfertigung und Versohnung, 3. Aufl.,1899, II 157), the apostles saw exercised the whole power of His redemption. But that death cannot be separated from His resurrection, which first awakened them to a knowledge of its decisive worth for salvation, as well as finally confirmed their faith in Jesus as the Son of God. "The objective salvation," says Ritschl (p. 158), "which was connected with the sacrificial death of Christ and which continued on for the church, was made secure by this, that it was asserted also as an attribute of the resurrected one," who was delivered up for our trespasses, and was raised for our justification (<a onClick="return mV(\'Rom\',4,25);">Ro 4:25</a>). But this last expression is not to be interpreted with literal preciseness, as though Paul intended to distinguish between the forgiveness of sins as brought about by the death, and justification, by the resurrection, for both forgiveness and justification are identified in <a onClick="return mV(\'Rom\',4,\'6-8\');">Ro 4:6-8</a>. It was the resurrection which gave Christians their assurance concerning Christ (<a onClick="return mV(\'Act\',17,31);">Ac 17:31</a>); by that resurrection He has been exalted to the right hand of God, where He maketh intercession for His people (<a onClick="return mV(\'Rom\',8,34);">Ro 8:34</a>), which mediatorship is founded upon His death—the Lamb slain from the foundation of the world (<a onClick="return mV(\'Rev\',13,8);">Re 13:8</a>; compare Greek text).<P>B. Weiss well says: "It was by the certainty of the exaltation of Christ to Messianic sovereignty brought about by the resurrection that Paul attained to faith in the saving significance of His death, and not conversely. Accordingly, the assurance that God cannot condemn us is owing primarily to the death of Christ, but still more to His resurrection and exaltation to God\'s right hand (<a onClick="return mV(\'Rom\',8,34);">Ro 8:34</a>), inasmuch as these first prove that His death was the death of the mediator of salvation, who has redeemed us from condemnation....The objective atonement was accomplished by the death of Christ, but the appropriation of it in justification is possible only if we believe in the saving significance of His death, and we can attain to faith in that only as it is sealed by the resurrection" (Biblical Theology of the New Testament, I, 436-37).<P>(3) Faith, Not Works, the Means of Justification.<P>The means or condition of justification is faith (<a onClick="return mV(\'Rom\',3,22,25,26,28);">Ro 3:22,25,26,28</a>, etc.) which rests upon the pure grace of God and is itself, therefore, His gift (<a onClick="return mV(\'Eph\',2,8);">Eph 2:8</a>). This making faith the only instrument of justification is not arbitrary, but because, being the receptive attitude of the soul, it is in the nature of the case the only avenue through which Divine blessing can come. The gifts of God are not against the laws of the soul which He has made, but rather are in and through those laws. Faith is the hand outstretched to the Divine Giver, who, though He sends rain without our consent, does not give salvation except through an appropriate spiritual response. This faith is not simply belief in historical facts, though this is presupposed as to the atoning death (<a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>), and the resurrection (<a onClick="return mV(\'Rom\',10,9);">Ro 10:9</a>) of Jesus, but is a real heart reception of the gift (<a onClick="return mV(\'Rom\',10,10);">Ro 10:10</a>), and is therefore able to bring peace in our relation to God (<a onClick="return mV(\'Rom\',5,1);">Ro 5:1</a>). The object of this faith is Jesus Christ (<a onClick="return mV(\'Rom\',3,22);">Ro 3:22</a>, etc.), through whom only comes the gift of righteousness and the reigning in life (<a onClick="return mV(\'Rom\',5,17);">Ro 5:17</a>), not Mary, not angels, not doctrine, not the church, but Jesus only. This, to be sure, does not exclude God the Father as an object of faith, as the redeeming act of Christ is itself the work of God (<a onClick="return mV(\'2Cr\',5,19);">2Co 5:19</a>), whose love expressed itself toward us in this way (<a onClick="return mV(\'Rom\',5,8);">Ro 5:8</a>). Faith in the only one God is always presupposed (<a onClick="return mV(\'1Cr\',8,6);">1Co 8:6</a>), but it was the apostolic custom rather to refer repentance to God and faith to Christ (<a onClick="return mV(\'Act\',20,21);">Ac 20:21</a>). But the oneness of God the Father and Christ the Son in a work of salvation is the best guaranty of the Divinity of the latter, both as an objective fact and as an inner experience of the Christian.<P>The justification being by faith, it is not by works or by love, or by both in one. It cannot be by the former, because they are lacking either in time or amount or quality, nor could they be accepted in any case until they spring from a heart renewed, for which faith is the necessary presupposition. It cannot be by the latter, for it exists only where the Spirit has shed it abroad in the heart (<a onClick="return mV(\'Rom\',5,5);">Ro 5:5</a>), the indispensable prerequisite for receiving which is faith. This does not mean that the crown of Christianity is not love, for it is (<a onClick="return mV(\'1Cr\',13,13);">1Co 13:13</a>); it means only that the root is faith. Nor can love be foisted in as a partial condition of justification on the strength of the word often quoted for that purpose, "faith working through love" (<a onClick="return mV(\'Gal\',5,6);">Ga 5:6</a>). The apostle is speaking here only of those who are already "in Christ," and he says that over against the Galatian believers bringing in a lot of legal observances, the only availing thing is not circumcision or its lack, but faith energizing through love. Here the interest is, as Ritschl says (II, 343), in the kingdom of God, but justification proper has reference to the sinner in relation to God and Christ. See the excellent remarks of Bruce, Paul\'s Conception of Christianity, 1894, 226-27. At the same time this text reveals the tremendous ethical religious force abiding in faith, according to Paul. It reminds us of the great sentence of Luther in his preface to the Epistles to the Romans, where he says: "Faith is a Divine work within us which changes and renews us in God according to <a onClick="return mV(\'Jhn\',1,13);">Joh 1:13</a>, \'who were born not of blood, nor of the will of the flesh, nor of the will of man, but of God.\' This destroys the old Adam and makes new creatures of us in heart, will, disposition, and all our powers. Oh, faith is a living, active, jealous, mighty thing, inasmuch as it cannot possibly remain unproductive of good works" (Werke, Erl. Ausg.,63,124-25).<P>(4) Baptism also Eliminated.<P>Not only are good works and love removed as conditions or means of justification of the sinner, but baptism is also eliminated. According to Paul, it is the office of baptism not to justify, but to cleanse, that is, symbolically to set forth and seal the washing away of sin and the entrance into the new life by a dramatic act of burial, which for the subject and all witnesses would mark a never-to-be-forgotten era in the history of the believer. "Baptism," says Weiss (I, 454), "presupposes faith in Him as the one whom the church designates as Lord, and also binds to adherence to Him which excludes every dependence upon any other, inasmuch as He has acquired a claim upon their devotion by the saving deed of His self-surrender on the cross." So important was baptism in the religious atmosphere at that time that hyperbolical expressions were used to express its cleansing and illuminating office, but these need not mislead us. We must interpret them according to the fundamental conceptions of Christianity as a religion of the Spirit, not of magic nor of material media. Baptism pointed to a complete parting with the old life by previous renewal through faith in Christ, which renewal baptism in its turn sealed and announced in a climax of self-dedication to him, and this, while symbolically and in contemporary parlance of both Jew and Gentile called a new birth, was probably often actually so in the psychological experience of the baptized. But while justification is often attributed to faith, it is never to baptism.<P>(5) Elements of Justification.<P>What are the elements of this justification? There are two:<P>(a) Forgiveness of Sins<P>Forgiveness of sins (<a onClick="return mV(\'Rom\',4,\'5-8\');">Ro 4:5-8</a>; compare <a onClick="return mV(\'Act\',13,38,39);">Ac 13:38,39</a>). With this are connected peace and reconciliation (<a onClick="return mV(\'Rom\',5,1,9,10);">Ro 5:1,9,10</a>; compare <a onClick="return mV(\'Rom\',10,11);">Ro 10:11</a>).<P>(b) The Declaring or Approving as Righteous<P>The declaring or approving as righteous or just (<a onClick="return mV(\'Rom\',3,\'21-30\');">Ro 3:21-30</a>; <a onClick="return mV(\'Rom\',4,\'2-9\',22);">4:2-9,22</a>; <a onClick="return mV(\'Rom\',5,1,9,10,11,\'16-21\');">5:1,9-11,16-21</a>, etc.). C.F. Schmid is perfectly right when he says that Paul (and James) always uses dikaioun in the sense of esteeming and pronouncing and treating as righteous, both according to the measure of the law (<a onClick="return mV(\'Rom\',2,13);">Ro 2:13</a>; <a onClick="return mV(\'Rom\',3,20);">3:20</a>) and also according to grace (Biblical Theology of the New Testament, 1870, 497). The word is a forensic one, and Godet goes so far as to say that the word is never used in all Greek literature for making righteous (Commentary on Romans, English translation, I, 157, American edition, 95). This is shown further by the fact that it is the ungodly who are justified (<a onClick="return mV(\'Rom\',4,5);">Ro 4:5</a>), and that the justification is a reckoning or imputation (logizesthai) of righteousness (<a onClick="return mV(\'Rom\',4,6,22);">Ro 4:6,22</a>), not an infusing or making righteous. The contrast of "to justify" is not "to be a sinner" but is "to accuse" or "to condemn" (<a onClick="return mV(\'Rom\',8,33,34);">Ro 8:33,34</a>), and the, contrast of "justification" is "condemnation" (<a onClick="return mV(\'Rom\',5,18);">Ro 5:18</a>). Besides, it is not the infusing of a new life, of a new holiness, which is counted for righteousness, but it is faith which is so counted (<a onClick="return mV(\'Rom\',4,5);">Ro 4:5</a>; <a onClick="return mV(\'Phl\',3,9);">Php 3:9</a>). That upon which God looks when He justifies is not the righteousness He has imparted or is to impart, but the atonement He has made in Christ. It is one of the truest paradoxes of Christianity that unless a righteous life follows, there has been no justification, while the justification itself is for the sake of Christ alone through faith alone. It is a "status, rather than a character," says Stevens (The Pauline Theology, 1892, 265); "it bears the stamp of a legal rather than of an ethical conception," and he refers to the elaborate and convincing proof of the forensic character of Paul\'s doctrine of justification," in Morison, Exposition of Romans, chapter III, 163-200. An interesting illustration of how further study may correct a wrong impression is given by Lipsius, who, in his Die Paulinische Rechfertigungslehre, 1853, maintained that righteousness or justification meant not "exclusively an objectively given external relation to God, but always at the same time a real inner condition of righteousness" (p. 10), whereas in his Lehrbuch der evangelisch-protestantischen Dogmatik, 1876, 3. Aufl.,1893, he makes the righteousness of God properly an "obje
