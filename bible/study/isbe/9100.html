isbe[9109]='Void`void: The uses of "void" in English Versions of the Bible are all modern, except for the phrase "void place" in the King James Version <a onClick="return mV(\'1Ki\',22,10);">1Ki 22:10</a> parallel <a onClick="return mV(\'2Ch\',18,9);">2Ch 18:9</a> (the Revised Version (British and American) "open"); 2Macc 14:44 (so the King James Version and the Revised Version margin). On the Old Testament passages see <a href="./study/isbe/search.html?string=OPEN+PLACE">OPEN PLACE</A>. In 2 Maccabees the Greek word is keneon, which may mean either "an open place," in general, or, specifically, "the hollow between the ribs and the hip," whence the Revised Version (British and American) "his side." Moffatt in Charles\' Apocrypha translates "the open street."``1';
isbe[9110]='Volume`vol\'-um: This word (from Latin volvere, "roll"), twice used in the King James Version (<a onClick="return mV(\'Psa\',40,7);">Ps 40:7</a> (Hebrew meghillah); <a onClick="return mV(\'Hbr\',10,7);">Heb 10:7</a>), is better in English as "roll" in the Revised Version (British and American).`<a href="./study/isbe/search.html?string=ROLL">ROLL</a>`1';
isbe[9111]='Voluntary`vol\'-un-ta-ri: For the sake of variety the King James Version in <a onClick="return mV(\'Lev\',7,16);">Le 7:16</a>; <a onClick="return mV(\'Eze\',46,12);">Eze 46:12</a> (bis) has rendered nedhabhah, by "voluntary offering" instead of the usual "freewill offering" (so the Revised Version (British and American)). The words "of his own voluntary will" in <a onClick="return mV(\'Lev\',1,3);">Le 1:3</a> the King James Version are a pure gloss, properly omitted in the Revised Version (British and American), as they represent nothing in the Hebrew text. 1Macc 2:42 has "voluntarily" as part of the translation of hekousiazo, the Revised Version (British and American) "willingly."``1';
isbe[9112]='Vophsi`vof\'-si (wophci, meaning unknown): Father of Nahbi the Naphtalite spy (<a onClick="return mV(\'Num\',13,14);">Nu 13:14</a>); but the text is doubtful. The Septuagint\'s Codex Vaticanus has Iabei; Codex Alexandrinus, Codex F, and Lucian Iabi.``1';
isbe[9113]='Vow`vou (nedher; euche; \'iccar, found only in <a onClick="return mV(\'Num\',30,6,8,10);">Nu 30:6,8,10</a> and translated horismos, by the Septuagint: A vow could be positive (nedher) and included all promises to perform certain things for, or bring certain offerings to, God, in return for certain benefits which were hoped for at His hand (<a onClick="return mV(\'Gen\',28,\'20-22\');">Ge 28:20-22</a>, Jacob; <a onClick="return mV(\'Lev\',27,2,8);">Le 27:2,8</a>; <a onClick="return mV(\'Num\',30,\'1-\');">Nu 30</a>; <a onClick="return mV(\'Jdg\',11,30);">Jud 11:30</a>, Jephthah; <a onClick="return mV(\'1Sa\',1,11);">1Sa 1:11</a>, Hannah; <a onClick="return mV(\'2Sa\',15,8);">2Sa 15:8</a>, Absalom; <a onClick="return mV(\'Jon\',1,16);">Jon 1:16</a>, vows of heathen); or negative (\'iccar), and included promises by which a person bound himself or herself to abstain from certain things (<a onClick="return mV(\'Num\',30,3);">Nu 30:3</a>). Nowhere in the Old Testament do we find the making of vows regarded as a religious duty (<a onClick="return mV(\'Deu\',23,22);">De 23:22</a>), but the fulfilling of a vow was considered as a sacred and binding duty (<a onClick="return mV(\'Deu\',23,\'21-23\');">De 23:21-23</a>; <a onClick="return mV(\'Jdg\',11,35);">Jud 11:35</a>; <a onClick="return mV(\'Ecc\',5,4);">Ec 5:4</a>; compare <a onClick="return mV(\'Psa\',22,25);">Ps 22:25</a>; <a onClick="return mV(\'Psa\',66,13);">66:13</a>; <a onClick="return mV(\'Psa\',76,11);">76:11</a>; <a onClick="return mV(\'Psa\',116,18);">116:18</a>). A vow was as binding as an oath (see <a href="./study/isbe/search.html?string=OATH">OATH</a>) and therefore to be kept to the letter; and it was not to be lightly made (<a onClick="return mV(\'Pro\',20,25);">Pr 20:25</a>). A father could veto a daughter\'s vow, and a husband a wife\'s. If a husband did not veto a wife\'s vow, and then caused her to break it, the sin was his and not hers (<a onClick="return mV(\'Num\',30,\'1-\');">Nu 30</a>, passim). It seems that vows were considered binding only when actually uttered (<a onClick="return mV(\'Deu\',23,23);">De 23:23</a>). Persons, including one\'s self, animals, land and other possessions, could be vowed, but all these could be redeemed with money (see <a href="./study/isbe/search.html?string=JEPHTHAH">JEPHTHAH</A>), which money was to be estimated by the priest, except in the case of a clean animal. In the case of land, houses and unclean animals a fifth part of the estimated value was to be added to make up the redemption money. In the case of land the sum was greater or smaller as the coming year of Jubilee was far off or near (<a onClick="return mV(\'Lev\',27,\'1-\');">Le 27</a>, passim). Nothing which was by nature holy could be made the object of a vow, e.g. firstlings, tithes, etc. (<a onClick="return mV(\'Lev\',27,26,28,30);">Le 27:26,28,30</a>); and, on the other hand, an abomination, e.g. the hire of a prostitute, could not be made the object of a vow (<a onClick="return mV(\'Deu\',23,18);">De 23:18</a>). In <a onClick="return mV(\'Mal\',1,14);">Mal 1:14</a> the offering of what was of less value than what had been vowed is vigorously condemned.<P>In the New Testament Jesus refers to vows only to condemn the abuse of them (<a onClick="return mV(\'Mat\',15,\'4-6\');">Mt 15:4-6</a>; <a onClick="return mV(\'Mar\',7,\'10-13\');">Mr 7:10-13</a>; compare Talmud, Nedharim, and see <a href="./study/isbe/search.html?string=CORBAN">CORBAN</a>). In <a onClick="return mV(\'Act\',18,18);">Ac 18:18</a> (compare <a onClick="return mV(\'Act\',21,23,24);">Ac 21:23,24</a>) Paul desires to show his Jewish brethren that he is willing to keep the forms of Jewish piety so long as they do not clash with his Christian conscience (compare <a onClick="return mV(\'1Cr\',9,21);">1Co 9:21</a>).`<a href="./study/isbe/search.html?string=NAZIRITE">NAZIRITE</a>`98';
isbe[9114]='Voyage And Shipwreck of Paul`voi\'-aj, ship\'-rek.`<a href="./study/isbe/search.html?string=PAUL,+THE+APOSTLE">PAUL, THE APOSTLE</a>; <a href="./study/isbe/search.html?string=PHOENIX">PHOENIX</a>; <a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';
isbe[9115]='Vulgate`vul\'-gat:<P><b>I. NAME AND ITS HISTORY</b><P class="in15">1. Present Usage<P class="in15">2. Earlier Usage<P class="in15">3. Post-Hieronymic<P class="in15">4. Historical Importance of the Vulgate<P><b>II. ORIGIN</b><P class="in15">1. Corruption and Confusion of Old Versions<P class="in15">2. Heresy<P class="in15">3. Inevitable Separation of East and West<P class="in15">4. Request of Pope Damasus<P><b>III. JEROME\'S TRANSLATIONS AND REVISIONS: METHOD</b><P class="in15">1. The New Testament Gospels or Whole New Testament?<P class="in15">2. Old Testament from the Septuagint<P class="in15">3. Translation of Old Testament from the Hebrew<P><b>IV. SUBSEQUENT RECENSIONS AND HISTORY OF VULGATE</b><P class="in15">1. In the Manuscripts<P class="in15">2. Printed Vulgate<P><b>V. MANUSCRIPTS OF VULGATE</b><P><b>VI. LATINITY</b><P><b>VII. USE OF VULGATE VERSIONS</b><P><b>LITERATURE</b><hr /><P>I. Name and Its History.<P>1. Present Usage:<P>The term "Vulgate" with us means but one thing—the standard authoritative Bible of the Latin or Roman church, prepared mostly by the labors of Jerome. But this is not the original use of the word and it was never so used by Jerome himself; indeed, it did not at first refer to a Latin version or translation at all. The word "Vulgate" comes from the adjective or participle vulgata which usually accompanied editio, and meant at first current or regularly used text. It was originally used as the equivalent of koine ekdosis = the Septuagint. Jerome and Augustine both use the term in this sense.<P>2. Earlier Usage:<P>Jerome (Commentary in <a onClick="return mV(\'Isa\',65,20);">Isa 65:20</a>), "<i>Hoc juxta Septuagint interpretes diximus, quorum editio toto orbe vulgata est</i>" (and same place <a onClick="return mV(\'Isa\',30,22);">Isa 30:22</a>), <i>vulgata editio</i> again refers to the Septuagint. Elsewhere Jerome actually gives the Greek words (of the Septuagint) as found in <i>editione vulgata</i> (Commentary in Osee 7 13). Augustine identifies the expression with the Septuagint (De doctr. christ., xvi. 10): "Secundum vulgatam editionem, hoc est interpretum Septuaginta." The term editio vulgata was next extended to the form in which the Septuagint was at first known to the West—the Old Latin versions (see <a href="./study/isbe/search.html?string=LATIN">LATIN</a>; <a href="./study/isbe/search.html?string=LATIN+VERSION,+THE+OLD">LATIN VERSION</A>), although, as Westcott remarks, there does not appear to be any instance in the age of Jerome of the application of the term to the Latin version of the Old Testament without regard to its derivation from the Septuagint or to that of the New Testament, so that Jerome usually intended the Septuagint though he quoted it in Latin form. <I>Vulgata editio</I>, having acquired the meaning of the current or ordinarily used text of Septuagint, was once again extended to mean a corrupt or uncorrected text as opposed to the standard emended Septuagint version of Origen\'s Hexapla, and in this sense is used by Jerome as synonymous with antiqua or vetus editio.<P>Epistle cvi.2 deserves citing in this connection: "<I>Admoneo alia m esse editionem quam Origenes et Caesariensis Eusebius omnesque Graeciae translatores (koinen), i.e. communem appellant atque vulgatam, et a plerisque (Loukianos) nunc dicitur: aliam Septuagint interpretum quae in (Hexaplois) (i.e. of Origen) codicibus reperitur, et a nobis in Latinum sermonem fideliter versa .....(koine) (communis editio)...vetus corrupta editio est, ea antem quae habetur in (Hexaplois) et quam nos vertimus, ipsa est quae in eruditorum libris incorrupta et immaculata Septuagint interpretum translatio reservatur.<I>" ("I recall that one is the text which Origen and Eusebius of Caesarea and all the Greek translators call the (koine), i.e. the common and current text, and is now called by most persons Lucian\'s (version); the other is the text of the translators of the Septuagint which is found in the codices (or books) of Origen (or the Hexapla), and has been faithfully translated by us into the Latin language...the koine (the ordinary text)...is the old corrupted text, but that which is found in the Hexapla, and which we are translating, is the same one which the version of the translators of the Septuagint has preserved unchanged and immaculate in the books of the scholars.")<P>3. Post-Hieronymic:<P>It was only very slowly that Jerome\'s version acquired this name, the phrase editio vulgata being applied to the Septuagint or the Old Latin versions of the Septuagint sometimes down to medieval times, while Jerome\'s translation was known as <I>editio nostra, codices nostri, translation emendatior, or translation quam tenet Rorn ecclesia</I>. The Tridentine Fathers were therefore guilty of an anachronism when they referred to Jerome\'s translation as <I>vetus et vulgata editio</I>. Roger Bacon was apparently the first, in the 13th century, to apply the term Vulgata in our sense (not exclusively, but also to the Septuagint), and this usage became classic through its acceptance by the Tridentine Council ("<I>vetus et vulgata editio</I>").<P>4. Historical Importance of the Vulgate:<P>The interest of the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) will be apparent when we reflect that this translation proved to be to the West what the Septuagint had been to the East, that it was prepared with great care by the greatest scholar whom Latin Christianity produced, that it was for hundreds of years the only Bible in universal use in Europe, that it has given to us much of our modern theological terminology as well as being the sponsor for many Greek words which have enriched our conceptions. It has also proved of primary importance as an early and excellent witness to the sacred text. Add to this that "directly or indirectly it is the real parent of all the vernacular versions of Western Europe" except the Gothic of Ulfilas. For English-speaking students it possesses peculiar interest as the source of the earlier translations made by the Venerable Bede, and portions of the Old Testament were translated in the 10th century from the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) by AElfric. Its greatest influence was exerted in the English version of Wycliffe—a literal translation from the Vulgate (1383). And Coverdale\'s Bible (1535) was "faithfully and truly translated out of Dutch (i.e. German of Luther) and Latin." The Rheims and Douay version was based on the Vulgate, though "diligently conferred with the Hebrew and Greek." The Vulgate exercised considerable influence upon Luther\'s version and through it upon our the King James Version.<P>II. Origin.<P>1. Corruption and Confusion of Old Versions:<P>Latin Christianity had not been without a Bible in its own language. Old Latin versions are found in North Africa as early as the middle of the 3rd century and are found in the texts of Cyprian and Tertullian. But these translations were characterized by "simplicity," "rudeness" and provincialism. There was not one standard authoritative version with any ecclesiastical recognition. Versions were rather due to "individual and successive efforts." Augustine says that anyone who got hold of a Greek manuscript and thought he knew Greek and Latin would venture on a translation. These versions originated in Africa and not from Rome, else they had been more authoritative. Besides, the first two centuries of the Roman church were rather Greek; the earliest Christian literature of Rome is Greek, its bishops bear Greek names, its earliest liturgy was Greek. When the church of Italy became Lat-speaking—probably at the end of the 3rd century—the provincialisms of the African version rendered it unfit for the more polished Romans, and so recensions were called for. Scholars now recognize a European type of Old Latin text. And Westcott thinks a Northern Italian recension (at least in the Gospels) was made in the 4th century. and known as the Itala (see <a href="./study/isbe/search.html?string=LATIN">LATIN</A>), and which he recognizes in the Itala mentioned in Aug., De doctr. christ., xv, as "<I>verborum tenacior cum perspicuitate sententiae</I>"; but F.C. Burkitt (The Old Latin and the Itala, 54ff) takes the Itala here as referring to Jerome\'s version. Amid such confusion and the appearance of national or provincial recensions, the Latin church became conscious of the need of a standard edition. There were almost as many types of texts as there were manuscripts: "Tot exemplaria paene quot codices," says Jerome (Preface to Gospels). Independent and unauthorized or anonymous translatitons"—especially of the New Testament—aided by the gross carelessness of scribes, made confusion worse confounded. Augustine complains of this "Latinorum interpretum infinita varietas."<P>2. Heresy:<P>In addition to the inconvenience in preaching and the liturgical variations, a greater demand for an authoritative version arose from the continual watch of the early church against heretics. Confusion of text abetted heresy, and the absence of a standard text made it harder to refute it. Besides, the Jews, with one authoritative text, laughed at the confusion of the Christian Scriptures.<P>3. Inevitable Separation of East and West:<P>The inevitable separation of East and West, both politically and ecclesiastically, and the split between Greek and Latin Christianity, rendered the existence of a standard Latin text imperative. Christianity was felt to be the religion of a book, and hence that book must be inspired and authoritative in every word—even in its order of words.<P>Pope Damasus determined to remedy this state of affairs, and with all the authority of the papal see commissioned Jerome to produce an authentic and standard authorized version<P>4. Request of Pope Damasus:<P>The pope\'s choice could not have fallen upon a more competent scholar—a man who had been providentially gifted and prepared for the task. Jerome—his Latin name was Eusebius Hieronymus—was born at Stridon on the borders of Dalmatia about 340 AD, or a little later, of Christian parentage. He had the advantages of the best classical education and became a devoted student of the best Latin writers. In a dream he saw a vision of judgment, and on claiming to be a Christian he was rebuked: "Mentiris, Ciceronianus es, non Christianus." He began his theological studies in Gaul; but later sought the seclusion of ascetic life in the desert near Antioch. Here he studied Hebrew from a converted rabbi in order to subdue fierce passions by the difficulties of that language. About 375 or 376 began his correspondence with Damasus. In 382 he came to Rome, and became the intimate friend and adviser of Damasus.<P>III. Jerome\'s Translations and Revisions: Method.<P>1. The New Testament:<P>These fall into three main groups:<P>(1) revision of the New Testament;<P>(2) Old Testament juxta the Septuagint;<P>(3) Old Testament from Hebrew.<P>The exact date of the pope\'s commission is not given: it was probably in 382—the year of Jerome\'s arrival in Rome—or early in 383, in which year the Gospels appeared in revised form. Damasus asked simply for a revision of the Old Latin versions by the help of the Greek rather than a new version Jerome collated Greek manuscripts, and carefully compared them with the "Italian" type of Old Latin texts; where possible the Old Latin was preserved. Thus, Jerome approached the task with a conservative spirit. Still the result was a considerable departure from the Old Latin version, the changes being<P>(1) linguistic, removal of provincialisms and rudeness,<P>(2) in interpretation, e.g. <I>supersubstantialis</I> for epiousion, in the Lord\'s Prayer,<P>(3) the removal of interpolations,<P>(4) the insertion of the Eusebian Canons.<P>Gospels or Whole New Testament?<P>It is disputed whether Jerome revised the whole New Testament or only the Gospels.<P>Against the revision of the whole New Testament the arguments briefly are:<P>(1) That Augustine, writing 20 years after the appearance of the revised Gospels, speaks only of "Gospel": "<I>Evangelium ex Graeco interpretatus est</I>" (Epistle civ.6); but Augustine may here be speaking generally or applying "Gospel" to the whole New Testament.<P>(2) Jerome in his preface apparently speaks of "only four Gospels" ("<I>quattuor tantum evangelia</I>").<P>(3) The rest of the New Testament does not show the same signs of revision as the Gospels.<P>(4) The absence of the prefaces usual ("<I>solita praefatione</I>") to Jerome\'s revised versions.<P>On the other hand, to more than counterbalance these,<P>(1) Damasus required a revision of the whole New Testament, not only of the Gospels (Preface of Damasus).<P>(2) In other statements of Jerome he expressly says he revised the New Testament (not Gospel or Gospels); in Epistle cxii.20, he seems to correct Augustine\'s evangelium by writing: "<I>Si me, ut dicis, in Novi Testamenti emendatione suspicis</I>," and in Epistle lxxi.5, "I translated the New Testament according to the Greek" ("<I>NT Graecae reddidi auctoritati</I>"); compare also De Vir. Ill., cxxxv.<P>(3) Jerome quotes passages outside the Gospels where his version differed from the Old Latin VSS, e.g. <a onClick="return mV(\'Rom\',12,11);">Ro 12:11</a>; <a onClick="return mV(\'1Ti\',1,15);">1Ti 1:15</a>; compare Epistle xxvii.<P>(4) Damasus died at the end of 384—perhaps before the rest of Jerome\'s revision was published, and so Jerome thought no further prefaces needed.<P>2. Old Testament from the Septuagint:<P>The more likely conclusion is that Jerome revised the whole New Testament, though not all with equal care. His revision was hasty and soon became more or less confused with the Old Latin versions to which the people clung as they do to all old versions. Having probably completed the New Testament from the Greek, Jerome began immediately on the Old Testament from the Greek of the Septuagint.<P>(1) Roman Psalter.<P>He commenced with the Psalms, which he simply emended only where imperatively required (compare preface), and cursorily (circa 384). This revision is called the Roman Psalter (Psalterium Romanum), which continued in use in Rome and Italy till it was displaced under the pontificate of Plus V by the Gallican Psalter, though the Roman Psalter is still used in Peter\'s, Rome, and in Mark\'s, Milan.<P>(2) Galliean Psalter.<P>This Psalter soon became so corrupted by the Old Latin version that Jerome (circa 387) undertook a second revision at the request of Paula and Eustochium. This became known as the Gallican Psalter because of its early popularity in Gaul. It was also made from the Septuagint, but with the aid of other Greek versions. Jerome adopted in it the critical signs used by Origen—a passage enclosed between an obelus and two points being absent from the Hebrew but present in the Septuagint, that between an asterisk and two points being absent from the Septuagint but supplied from Theodotion (Preface to Psalms).<P>(3) Rest of the Old Testament.<P>About the same time Jerome published translations of other Old Testament books from the Septuagint. Job was revised very soon after the Gallican Psalter. The preface to Proverbs, Ecclesiastes, Canticles and Chronicles is extant to show he had revised these books. Job and Psalms are the only books of this revision <I>juxta Septuagint</I> extant.<P>It is again disputed whether Jerome completed the whole Old Testament in this revision because (1) the usual prefaces are again lacking (except to the books already mentioned), and (2) in his prefaces to the revision from the Hebrew Jerome makes no reference to an earlier revision of his own; (3) the work implied was too great for the brief space possible and must have been done between 387 and 390 (or 391), for by this latter date he was already on the translation from the Hebrew. But Jerome was a phenomenal worker, as we learn that his translation of Proverbs, Ecclesiastes and Canticles from the Hebrew was made in three days. And his commentary on Ephesians was written at the rate of 1,000 lines a day.<P>Jerome probably completed the whole, as we infer from his own direct positive statements. He speaks of "<I>mea in libris canonicis interpretatio</I>" (Epistle cxii.19; see references in Westcott), and in the preface to the Books of Solomon after the Septuagint he states he did not correct Wisdom and Ecclesiasticus, "desiring only to emend the canonical books" ("<I>tantummodo canonicas scripturas vobis emendare desiderans</I>"). Once again, he speaks of having carefully translated the Septuagint into Latin (Con Ruf., ii.24; compare Epistle lxxi).<P>3. Translation of Old Testament from the Hebrew:<P>If the postscript to Epistle cxxxiv, to Augustine is genuine, Jerome complains he had lost the most of his former labors by fraud ("<I>pleraque enim prioris laboris fraude cuiusdam amisimus</I>"). And Augustine requests (Epistle xcvi.34) from Jerome his versions from the Septuagint ("<I>Nobis mittas, obsecro, interpretationem tuam de Septuagint quam te edidisse nesciebam</I>"). Having in the course of these labors discovered the unsatisfactory condition of the Septuagint text and his friends pleading the need of a translation direct from the Hebrew, Jerome began this huge task about 390 with Samuel and Kings, which he published with the <I>Prologus galeatus</I> ("helmeted prologue") next the Psalms (circa 392), Job and the Prophets (393), 1 and 2Esdras (circa 394) (3 and 4 being omitted), Chronicles (396). Then followed a severe illness until 398, when "<I>post longam aegrotationem</I>" he translated Proverbs, Ecclesiastes and Canticles. He then started on the Octateuch: "<I>Octateucho quem nunc in manibus habeo</I>" (Epistle lxxi.5), the Pentateuch being first translated in 401, Joshua, Judges, Ruth and Esther soon after (xl.4: "<I>post sanctae Paulae dormitionem</I>"). Tobit and Judith were translated for him from Chaldee into Hebrew from which he then translated them into Latin (circa 405), and shortly before or after these he added the apocryphal additions to Daniel and Esther. Baruch he passed over. Wisdom and Ecclesiasticus were not revised by him. Whether he revised Maccabees is doubtful. Thus was completed in 15 strenuous years (390-405) a work which has proved a <I>ktema es aei</I> (Thucydides i.22), "a possession for all time." The translation was largely undertaken at the request of friends and at no papal request. Indeed Jerome did not pretend to be working for publicity; he actually asked one friend not to show his translation.<P>Reception.<P>But human nature rarely recognizes merit in its own generation, and the spirit of conservatism rose in rebellion against beneficial innovation. Jerome was accused of slighting the Septuagint, which even in the eyes of Augustine was equally inspired with the Hebrew original. Jerome\'s fiery temper and his biting tongue were not calculated to conciliate.<P>IV. Subsequent Recensions and History of Vulgate.<P>1. In the Manuscripts:<P>By degrees the fierce opposition died down, and even by the time of Jerome\'s death men were beginning to perceive the merits of his version which Augustine used in the Gospels. Some parts of Jerome\'s Vulgate (390-405 A.D.) won their way to popularity much sooner than others—the Old Latin versions died hard and not without inflicting many a wound on the Vulgate. His Psalter from the Hebrew never ousted the Gallican which still holds its place in the Vulgate. Some scholars were able to appreciate Jerome\'s edition sooner than others. And it was at different dates that the different provinces and countries of the West adopted it. Pelagius used it in his commentary on the Pauline Epistles. As might be expected, the Old Latin versions retained their place longest in the place of their origin—North Africa. Britain proved the next most conservative. The old versions were never authoritatively deposed, and so Jerome\'s version was compelled to win its way by its own merits. In the 5th century—especially in Gaul—it continued to grow in popularity among scholars, being adopted by Vincent of Lerins, Eucherius of Lyons, Sedulius, and Claudianus Mamertus, and Prosper of Aquitaine. In the next century its use became almost universal except in Africa, where the Old Latin was retained by Junilius and Facundus. At the close of the 6th century. Pope Gregory the Great acknowledges that the new (i.e. the Vulgate) and the old are both equally used by the Apostolic See; and thus the Vulgate was at least on equal footing with the old. In the 7th century the Old Latin retreats, but traces of it survive down into the Middle Ages, affecting and corrupting the Jerome version. Mixed texts and conflated readings arose—the familiarity of the Old Latin in lectionaries and liturgies telling on the Vulgate. The New Testament, being only a revision and not a fresh translation, and being most in use, degenerated most.<P>(1) As early as the 6th century the need of an emendated Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) text was felt, and Cassidorius undertook to revise part of it. This was merely private enterprise and did little to stem the flood of corruption.<P>(2) About the close of the 8th century, Charlemagne commissioned an Englishman Alcuin, abbot of Martin, Tours, to produce a revised text on the basis of the best Latin manuscripts, without reference to the Greek text. Alcuin sent to York for his manuscripts and thus produced a text after British manuscripts. On Christmas Day, 801 AD, he presented the emperor with the emended text. The authority by which this text was prepared and its public use together with the class of manuscripts used did much to preserve a pure Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) text and stay interpolations: "The best manuscripts of his recension do not differ widely from the pure Hieronymian text" (Westcott).<P>(3) Another recension of about the same date—but a scholar\'s private enterprise—was produced by a Visigoth, Theodulf, bishop of Orleans. He made the Spanish family of manuscripts together with those of Southern France the basis of his text. His inscribing variant readings in the margin really helped the process of corruption. His text—though prepared at enormous labor—was far inferior to that of Alcuin and exerted little influence in face of the authoritative version of Alcuin. Manuscripts were rapidly multiplied in the 9th century on the Alcuinian model by the school of Tours, but with carelessness and haste which helped to a speedy degeneration of the text. Again the confusion called for remedy.<P>(4) In the 11th century Lanfranc, bishop of Canterbury (1069-89), attempted correction—apparently with little success. About the middle of the 12th century, Stephen Harding of Citeaux produced a revision—extant in manuscript in Dijon public library (<span class="noTag">number 9</span>), as did also Cardinal Nicolaus. The increased demand for Bibles in the 13th century gave opportunity for further corruption of the text—publishers and copyists being indifferent as to the character of manuscript chosen as a basis.<P>(5) In consequence of the fame of the University of Paris in the 13th century and the enormous activity in producing Bible manuscripts, there resulted a type of text called by Roger Bacon Exemplar Parisiense, for which he has nothing good to say.<P>(6) In the same century steps were taken toward a standard text and to stay corruption by the drawing up of correctoria, i.e. books in which the readings of Greek and Latin manuscripts were weighed to decide a text, the authority of Fathers cited, etc. Some of the principal correctoria are: Correctorium Parisiense known also as Senonense—one of the worst, following the Parisian type of text; Correotorium Vaticanum, the best; Correctorium Sorbonicum, in the Sorbonne; Correctorium Dominicanum.<P>2. Printed Vulgate:<P>(1) Early Editions.<P>Little more was done till the invention of printing, and the first products of the press were Latin Bibles. Unfortunately at first the current text was accepted without any critical labors, and so the earliest printed Vulgates only perpetuated an inferior text. Only a few from among some hundreds of early versions can be noted:<P>(a) the Mazarin Bible—one of the most beautiful and valuable books in the world—printed at Mainz about the middle of the 15th century (1455, Westcott) by Gutenberg, Schoffer or Fust;<P>(b) the first Bible published at Rome in 1471 by Sweynheym and Pannartz and reprinted in Nuremberg in 1475;<P>(c) 1504 a Paris edition with variant readings;<P>(d) an edition in Complutensian Polyglot (1514ff) from ancient manuscripts and from the Greek;<P>(e) practically the first critical edition, by Robertus Stephanus (1st edition 1528, 2nd 1532, reprinted later), of interest as being practically the basis of the standard Roman Vulgate;<P>(f) Hentenian critical edition (Louvain, 1547).<P>Attempts to produce a corrected text by aid of the original were made by Erasmus in 1516, Pagninus in 1518ff, Cardinal Cajetan, Steuchius in 1529, Clarius in 1542, etc. Even new translations were made by both Roman Catholic and Protestant scholars. This bewildering number of versions and the controversies of the 16th century called for a standard edition. The Council of Trent (1546) took up the matter and decreed that the "<i>ipsa vetus et vulgata editio quae Iongo tot saeculorum usu in ipsa ecclesia probata</i>" ("the same old and ordinarily used text which has been approved in the church itself by the long usage of so many centuries") should be regarded as authentic (<i>authentica</i>). By this they apparently meant the Jerome version, but did not state in which manuscript or printed edition it was to be found.<P>(2) Sixtine Edition (1590).<P>No further steps were taken for the present to secure a standard official Bible for the church—the private edition of John Hentenius of Louvain serving in the meanwhile until the pontificate of Sixtus V. This pope entrusted the work to a committee under Cardinal Caraffa, but he himself strenuously cooperated. Manuscripts and printed editions were examined, but the original Greek or Hebrew was to be regarded as decisive in difficulties. The result was published as the Sixtine edition of the Vulgate by the Vatican press in 1590 (see title on 1st and 2nd pages). The text resembles the Stephanus edition of 1540. A new puzzling method of verse enumeration was introduced. As one would expect, there was prefixed to the edition a Bull Aeternus ille, etc., in which the divines gave themselves credit for their painstaking labors, and the result was declared the authorized Vulgate of the Tridentine Council, "<i>pro vera, legitima, authentica et indubitata, in omnibus publicis privatisque disputationibus ....</i>"(" by virtue of truth, usage, authenticity and certainty, in all public and private disputes"). Errors of printing were corrected by the pen or by pasting a slip of paper with the correction over the error. This edition was not to be reprinted for 10 years except at the Vatican, and after that any edition must be compared with the Vatican edition, so that "not even the smallest particle should be altered, added or removed" under pain of the "greater excommunication." Sixtus died the same year, and the Jesuit Bellarmine persuaded Clement VIII to recall the Sixtine edition and prepare another standard Vulgate in 1592.<P>(3) Clementine Edition (1592).<P>In the same year appeared the Clementine edition with a preface by Bellarmine asserting that Sixtus had himself determined to recall his edition on account of printers\' errors (from which it was remarkably free). The pains and penalties of the Sixtine Bull were evaded by printing the book as a Sixtine edition, actually printing the name of Sixtus instead of Clement on the title-page: <i>Biblia Sacra Vulgatae Editionis Sixti Quinti Pont. Max. iussu recognita atque edita</i>. The awkward system of verse enumeration of the Sixtine was dropped. The text itself was rather of the Hentenian type. No future edition was to be printed except on the exact pattern, "even to the smallest particle" of the Vatican edition. Thanks largely to the papal Bull this Clementine edition of 1592 still remains the official version of the Roman Catholic church. A second edition appeared in 1593, and a third in 1598. Roman Catholic scholars were discouraged from undertaking a new version, and Protestant scholars were, until recently, too occupied with the original texts.<P>Bentley\'s projected edition of the New Testament never appeared. Under cover of the works of Jerome a corrected text was published by Vallarsi, 1734—really the completion and revision of the edition of Martianay of 1706. Little more was done in the way of critical editions till the latter half of the 19th century.<P>(4) Modern Critical Editions.<P>In 1861 Vercellone reprinted the Clementine Vulgate (with an excellent preface), the names of Sixtus and Clement both appearing on the title-page. In 1906 an edition—Biblical Sac Vulgatae edition by Hetzenauer—was published at Oeniponte. (The majority of recent editions have been confined to the New Testament or part of it: Tischendorf, Nov. Test. Latin: textum Hieronymi...restituit, Leipzig, 1864; Hetzenauer, Nov. Test. Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) ed.: ex Vat. editions earumque correctorio critice edidit P.M.H., Oeniponte, 1899.) The Oxford Vulg, prepared by Bishop J. Wordsworth and H.J. White, of which the first part was issued in 1889, is a comprehensive work of great value. P. Corssen published the first installment of a Vulgate New Testament (Epistle ad Gal, Berlin, 1885). This is exclusive of the printed editions of several important manuscripts. Pope Plus X entrusted the preparation of a revised edition of the Vulgate to the Benedictine order—but as yet nothing has appeared.<P>V. Manuscripts of Vulgate.<P>To give a satisfactory list would be impossible within our space limits. The number is legion—estimated at about 8,000. As yet the same order has not been called out of the chaos of Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) and Old Latin manuscripts in the manner in which Westcott and Hort have reduced the Greek manuscripts of the New Testament to a system. The student may conveniently approach the subject in White\'s list in the 4th edition of Scrivener, A Plain Introduction to the Criticism of the New Testament, II 67ff, or the longer one by Gregory in Tischendorf\'s New Testament Greek, 8th edition, III, 983ff, also in Westcott\'s article in DB or White\'s in HDB; Vercellone, Variae Lectiones, 1860; Berger, Histoire de la Vulgate, 374ff.<P>VI. Latinity.<P>Space permits only a few general remarks. The Latin of the old versions was simple, rude and vernacular, abounding in literalisms and provincialisms. In many ways, in vocabulary, diction and construction, it offended scholars. As was natural Jerome smoothed the roughness of the old versions and removed the most glaring solecisms and offensive provincialisms. His work is a masterpiece—like our the King James Version—in the harmonious blend of simple, popular, forceful language and a scholarly graceful translation. "As a monument of ancient linguistic power the translation of the Old Testament stands unrivaled and unique" (Westcott). The Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) has enriched our language by introducing many Greek words, "apostle," "evangel," "synagogue," "baptism," etc. It has also given us much of our theological vocabulary, "edification," "justification," "propitiation," "regeneration," "Scripture," etc. It still retains many marks of its birth in (1) Old Latin words elevated from the vernacular, (2) Africanisms: <i>clarifico</i>, etc., <i>saeculum</i> for <i>mundus</i>, long compound verbs like <i>obtenebrare</i>, etc., (3) Graecisms, like the use of the pronoun for the article, as <i>hic mundus<i> = <i>ho kosmos</i>, (4) Hebraisms, like <i>adposuit ut apprehenderet et Petrum</i> (<a onClick="return mV(\'Act\',12,3);">Ac 12:3</a>; see special works mentioned in "Literature").<P>VII. Use of Vulgate.<P>In the Old Testament the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) is not of much importance for the criticism of the Hebrew text, because of the freedom which Jerome permitted himself in translation, and because our present Massoretic Hebrew text had by that time taken on its present form. But on the Septuagint it often throws a very useful light. In the New Testament Jerome\'s version ranks practically in importance with our oldest and best Greek manuscripts in establishing (in conjunction with the Old Latin VSS) the received Greek text of the 4th century, both by way of supplementing and correcting our Greek authorities. It is in the Gospels that Jerome\'s work is most thorough and useful. His version also supplies many a hint for the interpretation of our Greek text.<P>VIII. Differences between Vulgate and Our English Versions.<P>Apart from differences of rendering and minor points, the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) text differs from the English in the order of the books, in the amount contained in some of them, in the occasional divergence of chapter and verse enumeration. The New Testament is practically the same in the Clementine text, though the order of books varies in many manuscripts—the Catholic Epistles being placed sometimes after Acts. In some manuscripts the Epistle to the Laodiceans is found. Most variety obtains in the Old Testament. The sequence of canonical books is the same, but the apocryphal books are interspersed among them and not placed at the end. Tobit and Judith are inserted between Nehemiah (2Esdras) and Esther, Wisdom and Ecclesiasticus between Canticles and Isaiah. Baruch follows Lamentaions, chapter 5 of which is called the "Prayer of Jeremiah the Prophet"; 1 and 2 Maccabees are placed after Malachi; 3 and 4 Esdras and Prayer of Manasses appear as an appendix after the New Testament. In Psalms the divergence is considerable, the Vulgate—like the Hebrew—counting the title as the first verse. <a onClick="return mV(\'Psa\',9,\'1-\');">Psalms 9</a>; <a onClick="return mV(\'Psa\',10,\'1-\');">10</a> of our version = <a onClick="return mV(\'Psa\',9,\'1-\');">Ps 9</a> in Vulgate, so that the Vulgate is one Psalm behind the English till <a onClick="return mV(\'Psa\',114,\'1-\');">Ps 114</a>, then <a onClick="return mV(\'Psa\',114,\'1-\');">Psalms 114</a>; <a onClick="return mV(\'Psa\',115,\'1-\');">115</a> again form one Psalm = <a onClick="return mV(\'Psa\',113,\'1-\');">Vulgate 113</A>. The Vulgate is now two behind. Matters are equalized by <a onClick="return mV(\'Psa\',116,\'1-\');">Ps 116</a> being divided into two in the Vulgate (= <a onClick="return mV(\'Psa\',114,\'1-\');">114</a>; <a onClick="return mV(\'Psa\',115,\'1-\');">115</a>), and 147 again = two Vulgate <a onClick="return mV(\'Psa\',146,1);">Psalms 146</a>; <a onClick="return mV(\'Psa\',147,\'1-\');">147</a>. Thus, only <a onClick="return mV(\'Psa\',1,\'1-\');">Psalms 1-8</span> and <a onClick="return mV(\'Psa\',148,\'1-\');">148-150</A> run the same. Against Jerome\'s advice the apocryphal parts of Daniel and Esther were accepted as integral parts of those books, the Song of Three Children being inserted at <a onClick="return mV(\'Dan\',3,23);">Da 3:23</a>, Susanna forming chapter 13 and Bel and the Dragon chapter 14. Ad Esther is linked on to the end of Esther. In conclusion, the present Vulgate, as Westcott remarks, is a composite of elements belonging to every period and form of the Latin version, including<P>(1) unrevised Old Latin (Wisdom, Ecclesiasticus, 1 and 2 Maccabees and Baruch);<P>(2) Old Latin corrected from the Septuagint (Psalter);<P>(3) Jerome\'s free translation from the original (Job and Judith);<P>(4) Jerome\'s translation from the original (the Old Testament except the Psalter);<P>(5) Old Latin revised from Greek manuscripts (the Gospels);<P>(6) Old Latin cursorily revised (the rest of the New Testament).<P>LITERATURE.<P>This is too vast to cite, but in some of the following works sufficient bibliographies will be found: Berger, Hist de la Vulgate pendant les premiers siecles du moyen age, 1893; H. Hody, De bib. textibus originalibus, 1705; F. Kaulen, Gesch. der Vulg, 1868; Van Ess, Pragmatisch-krit. Gesch. der Vulg, 1824; E. Nestle, Urtext u. Uebersetzungen der Bibel,1897,and Ein Jubilaum d. tat. Biblical, 1892. Two splendid articles—each by an authority—in DB (Westcott) and in HDB (White). A very readable account is in Kenyon, Our Bible and the Ancient manuscripts, 165ff, and in his Handbook to the Text Crit. of the New Testament, 168ff. For the language: Ronsch, Itala u. Vulgata, 2nd edition, 1875; A. Hartl, Sprachliche Eigentumlichkeiten d. Vulg, 1864.``5';
isbe[9116]='Vulture`vul’-tur (da’ah; Septuagint gups, and iktinos; Latin Vulturidae): Any member of a family of large birds that subsist wholly or in part on carrion. The largest vulture of Palestine was the Lammer-geier. This bird waited until smaller vultures, eagles and hawks stripped a carcass to the bone, then carried the skeleton aloft and dashed it on the rocks until the marrow could be secured. This was a favorite delicacy. This bird was fond of tortoise also, and is said to have dropped the one that struck the bald head of Aeschylus, which the bird mistook for a stone, so causing the death of the poet. Several smaller species, including "Pharaoh’s chickens," flocked all over Palestine. These were protected by a death penalty for their value as scavengers in cities. They fed on carcasses of animals that killed each other, ate putrid fish under the nests of pelican and cormorant, followed caravans across the desert, and were ready for offal thrown from animals dressed for feasting. They flocked over the altars for the entrails from sacrifice, and devoured scraps cast aside by tent-dwellers and residents of cities. They paired with affectionate courting and nested in crevices, in walls, hollow trees and on cliffs. They raised only one pair of young to the season, as the nestlings were over two months old before they took wing. The young were white at first, then black feathers enveloped them. On account of their steady diet of carrion, no one ever has been able to use their flesh for food, although some daring ornithologists have tried. For this reason the vulture was placed among the abominations and should by right have headed the lists (<a onClick="return mV(\'Lev\',11,18);">Le 11:18</a>; <a onClick="return mV(\'Deu\',14,13);">De 14:13</a>). The other references that used to be translated "vulture" in the King James Version, the Septuagint elaphos, Vulgate (Jerome’s Latin Bible, 390-405 A.D.) correctly milous) are changed to "falcon" and "kite." <a onClick="return mV(\'Isa\',34,15);">Isa 34:15</a> changes "vulture" to "kite." <a onClick="return mV(\'Job\',28,7);">Job 28:7</a> changes "vulture" to "falcon."``167';

isbe[9118]='Wages`wa\'-jez, wa\'-jiz (chinnam, maskoreth, pe\'ullah, sakhar, sakhar; misthos, opsonion):<P>(1) Chinnam means "gratis," without cost or any advantage, for nought, or in vain; wages in the sense of reasonable return. Jeremiah pronounces woe upon him who "useth his neighbor\'s service without wages, and giveth him not his hire" (<a onClick="return mV(\'Jer\',22,13);">Jer 22:13</a>; the only place where the word is used).<P>(2) Maskoreth means "reward" or "wages." Laban said to Jacob: "Shouldest thou therefore serve me for nought? Tell me, what shall thy wages be?" (<a onClick="return mV(\'Gen\',29,15);">Ge 29:15</a>). Jacob said, concerning Laban, speaking to Rachel and Leah: "Your father hath deceived me, and changed my wages ten times" (<a onClick="return mV(\'Gen\',31,7);">Ge 31:7</a>; compare <a onClick="return mV(\'Gen\',31,41);">31:41</a>).<P>(3) Pe\'ullah generally means "work," "labor," "reward," "wages." The old Levitical Law was insistent on honesty in wages and on promptness in payments: "The wages of a hired servant shall not abide with thee all night until the morning" (<a onClick="return mV(\'Lev\',19,13);">Le 19:13</a>).<P>(4) Mistakker means "earning," "hire," "reward," "wages," from root sakhar, meaning "to hire," and has in it the idea of temporary purchase: "He that earneth wages earneth wages to put it into a bag with holes" (<a onClick="return mV(\'Hag\',1,6);">Hag 1:6</a>).<P>(5) Sakhar means "payment of contract," in the material way of salary, maintenance, fare, and so compensation, reward, price, benefit, wages—seemingly wages received after an understanding as to time, manner and amount of payment. Laban (employer) said to Jacob (employee): "Appoint me thy wages, and I will give it" (<a onClick="return mV(\'Gen\',30,28);">Ge 30:28</a>); "If he said thus, The speckled shall be thy wages" (<a onClick="return mV(\'Gen\',31,8);">Ge 31:8</a>); Pharaoh\'s daughter said to Moses\' mother: "Take this child away, and nurse it for me, and I will give thee thy wages" (<a onClick="return mV(\'Exd\',2,9);">Ex 2:9</a>); Nebuchadrezzar and his army served against Tyre, "yet had he no wages, nor his army" (<a onClick="return mV(\'Eze\',29,18);">Eze 29:18</a>), and the prey of Egypt "shall be the wages for his army" (<a onClick="return mV(\'Eze\',29,19);">Eze 29:19</a>); swift and sure judgment is predicted against "those that oppress the hireling in his wages, the widow, and the fatherless" (<a onClick="return mV(\'Mal\',3,5);">Mal 3:5</a>).<P>(6) Misthos means either in a literal or figurative sense "pay for service," either primitive or beneficial, and so reward, hire, wages. In <a onClick="return mV(\'Jhn\',4,36);">Joh 4:36</a> Jesus said, "He that reapeth receiveth wages, and gathereth fruit unto life eternal." <a onClick="return mV(\'2Pe\',2,15);">2Pe 2:15</a> has changed "wages" (the King James Version) to "hire," reading "who loved the hire of wrongdoing."<P>(7) Opsonion, meaning primarily "rations for soldiers" (opson being the word for cooked meat) and so "pay" or stipend, provision wages. In <a onClick="return mV(\'Luk\',3,14);">Lu 3:14</a> John said to the soldiers, "Be content with your wages"; "The wages of sin is death" (<a onClick="return mV(\'Rom\',6,23);">Ro 6:23</a>); Paul said: "I robbed other churches, taking wages of them" (<a onClick="return mV(\'2Cr\',11,8);">2Co 11:8</a>); the same word in <a onClick="return mV(\'1Cr\',9,7);">1Co 9:7</a> is translated "charges."<P>The Bible refers to wages actual and wages figurative. Of actual wages there are three kinds:<P>(1) money wages,<P>(2) provision (usually food) wages, and<P>(3) what may be called "exchange" wages, wages in kind, sometimes "human-kind," e.g. Jacob\'s wages from Laban.<P>Often laborers and soldiers received both money and "keep" wages. The laborer in New Testament times received about 15 cents per day (the "shilling" of <a onClick="return mV(\'Mat\',20,2);">Mt 20:2</a>), besides in some cases his provisions. The old Law required daily payment, honesty in dealing, also sufficient food for the laborer.<P>It is practically impossible to test "Bible" wages by any of theories of modern economists. In this connection, however, mere mention of the six principal theories may be of interest. Concisely put, they are:<P>(1) the wage-fund theory,<P>(2) the standard-of-living theory,<P>(3) the German-socialistic theory,<P>(4) the production theory,<P>(5) Henry George\'s theory, and<P>(6) the laborer\'s value theory.<P>The incidents in the Old Testament of Jacob and in the New Testament of <a onClick="return mV(\'Mat\',20,1);">Mt 20</a> both show that the laborer was at the caprice of the employer. Therefore, we may designate the Bible law of wages as the "employer\'s theory."``142';

isbe[9121]='Wait`wat:<P>1. The Substantive:<P>The word is used in the Old Testament both as a substantive add as a verb. In the New Testament it appears as a verb only. \'erebh, ma\'arabh, mean a concealed hiding-place for purposes of sudden attack, an ambuscade.<P>(1) "Lie in wait": "Abimelech rose up...from lying in wait" (<a onClick="return mV(\'Jdg\',9,35);">Jud 9:35</a> the King James Version); "When they...abide in the covert to lie in wait" (<a onClick="return mV(\'Job\',38,40);">Job 38:40</a>).<P>(2) "Lay wait": "They compassed him in, and laid wait for him" (<a onClick="return mV(\'Jdg\',16,2);">Jud 16:2</a>).<P>2. The Verb:<P>(1) sharath, "to serve," "to minister," to act in the capacity of servant or attendant: "These waited on the king" (<a onClick="return mV(\'2Ch\',17,19);">2Ch 17:19</a>). Used especially in this sense with regard to the ceremonial service of the host: "They shall go in to wait upon the service in the work of the tent of meeting" (<a onClick="return mV(\'Num\',8,24);">Nu 8:24</a>; compare <a onClick="return mV(\'Num\',8,25);">8:25</A>); "The Levites wait upon their business" (<a onClick="return mV(\'2Ch\',13,10);">2Ch 13:10</a> the King James Version). "Wait at" occurs in the same sense in the New Testament: "They which wait at (the Revised Version (British and American) "wait upon") the altar," etc. (<a onClick="return mV(\'1Cr\',9,13);">1Co 9:13</a> the King James Version).<P>(2) The simple verb is used to describe the longsuffering and patience of God toward His willful people: "And therefore will Yahweh wait, that he may be gracious unto you" (<a onClick="return mV(\'Isa\',30,18);">Isa 30:18</a>); "When the longsuffering of God waited in the days of Noah" (apekdechomai, <a onClick="return mV(\'1Pe\',3,20);">1Pe 3:20</a>).<P>(3) The most important and frequent use of the word "wait," however, is to define the attitude of a soul God-ward. It implies the listening ear, a heart responsive to the wooing of God, a concentration of the spiritual faculties upon heavenly things, the patience of faith, "the earnest expectation of the creation" (<a onClick="return mV(\'Rom\',8,19);">Ro 8:19</a>). It describes an eager anticipation and yearning for the revelation of truth and love as it is in the Father. Thus: "My soul, wait thou...for God only" (<a onClick="return mV(\'Psa\',69,5);">Ps 69:5</a>); "Our soul hath waited for Yahweh" (<a onClick="return mV(\'Psa\',33,20);">Ps 33:20</a>); "Mine eyes fail while I wait for my God" (<a onClick="return mV(\'Psa\',69,3);">Ps 69:3</a>); "Wait for Yahweh, and he will save thee" (<a onClick="return mV(\'Pro\',20,22);">Pr 20:22</a>).<P>Also the New Testament thus: "Waiting for our adoption, to wit, the redemption of our body" (<a onClick="return mV(\'Rom\',8,23);">Ro 8:23</a>); "For we through the Spirit by faith wait for the hope of righteousness" (<a onClick="return mV(\'Gal\',5,5);">Ga 5:5</a>). From various references in the New Testament there seems to have been in the days of Jesus a sect in whose name the word "wait" played an important part. Of the aged Simeon, who met Mary and Joseph when they brought the infant Jesus to the temple, it is said that he was "waiting for (the Revised Version (British and American) "looking for") the consolation of Israel" (<a onClick="return mV(\'Luk\',2,25);">Lu 2:25</a>), that is, he was looking for the fulfillment of the Messianic promise. Again, after our Lord\'s crucifixion, when Joseph of Arimathea begged for the body of Jesus, we are told that he was one of those that "waited for the kingdom of God" (prosdechomai, <a onClick="return mV(\'Mar\',15,43);">Mr 15:43</a> the King James Version; <a onClick="return mV(\'Luk\',23,51);">Lu 23:51</a> the King James Version). It is thought by some authorities that this implies their having belonged to the sect of the Essenes. Epiphanius associates the sect with one which he names "Gortheni," whose title is derived from a word which means "to expect."``52';
isbe[9122]='Walk`wok (peripatein): Aside from its frequent occurrence in the usual sense, the word "walk" is used figuratively of conduct and of spiritual states.<p>(1) Observance of laws or customs: "Thou teachest all the Jews who are among the Gentiles to forsake Moses, telling them not to circumcise their children, neither to walk after the customs" (<a onClick="return mV(\'Act\',21,21);">Ac 21:21</a>).<p>(2) Of the spiritual life: "If we walk in the light, as he is in the light" (<a onClick="return mV(\'1Jo\',1,7);">1Joh 1:7</a>); "That like as Christ was raised from the dead through the glory of the Father, so we also might walk in newness of life" (<a onClick="return mV(\'Rom\',6,4);">Ro 6:4</a>); "Walk by the Spirit, and ye shall not fulfill the lust of the flesh" (<a onClick="return mV(\'Gal\',5,16);">Ga 5:16</a>); "For we walk by faith, not by sight" (<a onClick="return mV(\'2Cr\',5,7);">2Co 5:7</a>).``121';

isbe[9126]='Wanderings of Israel`won\'-der-ingz:<P><b>I. CONDITIONS</b><P class="in15">1. The Wilderness<P class="in15">2. Four Separate Regions Included<P class="in15">3. "The Sandy Tract"<P class="in15">4. Description of the Arabah<P class="in15">5. Physical Condition of the Wilderness<P class="in15">6. Difficulties Regarding the Numbers of Israel and Account of Tabernacle<P class="in15">7. Difficulty as to Number of Wagons<P class="in15">8. Fauna of the Desert<P class="in15">9. Characteristic Names of the Districts<P><b>II. FIRST JOURNEY</b><P class="in15">1. Mode of Traveling<P class="in15">2. The Route: the First Camp<P class="in15">3. Waters of Marah<P class="in15">4. Camp by the Red Sea<P class="in15">5. The Route to Sinai<P><b>III. SECOND JOURNEY</b><P class="in15">1. The Stay at Sinai<P class="in15">2. Site of Kadesh-barnea<P class="in15">3. The Route: Hazeroth to Moseroth<P class="in15">4. The Camps between Hazeroth and Moseroth<P><b>IV. THE THIRTY-EIGHT YEARS</b><P class="in15">1. The History<P class="in15">2. The Camps Visited<P><b>V. THE FINAL JOURNEY</b><P class="in15">1. The Route<P class="in15">2. The Five Stations to the Border of Moab<P class="in15">3. From Iyim to Arnon<P class="in15">4. The Message to Sihon<P class="in15">5. From the Arnon to Shittim<P class="in15">6. Review<hr /><P>I. Conditions.<P>1. The Wilderness:<P>A consideration of the geography and natural features of the desert between Egypt and Edom, in which the Hebrews are said to have wandered for 40 years, has a very important bearing on the question of the genuineness of the Pentateuch narrative. This wilderness forms a wedge between the Gulfs of Suez and \'Aqabah, tapering south to the granite mountains near Sinai. It has a base 175 miles long east and west on the north, and the distance north and south is 250 miles. The area is thus over 20,000 square miles, or double the size of the Promised Land east and west of Jordan. On the north of this desert lie the plains of Gaza and Gerar, and the Neghebh or "dry region" (the south; see <a onClick="return mV(\'Num\',13,17);">Nu 13:17</a> the Revised Version (British and American)), including the plateau and low hills round Beersheba.<P>2. Four Separate Regions Included:<P>There are four separate regions included in the area, the largest part (13,000 square miles) being a plateau which on the south rises 3,000 to 4,000 feet above the sea, and shelves gently toward the Philistine plains. It is drained into the broad Wady el-\'Arish, named from el-\'Arish ("the booth"), a station on the Mediterranean coast south of Gaza, where this valley enters the sea. In this direction several prominent mountains occur (Jebel Yeleq, Jebel Hilal, and Jebel Ikhrimm), while further east—near the site of the Western Kadesh—there is a step on the plateau culminating on the south in Jebel el-Mukhrah; but none of these ranges appears to be more than about 4,000 feet above the sea. The plateau is known as Badiet et-Tih ("the pathless waste"), and though some Arab geographers of the Middle Ages speak of it as the desert "of the wandering of the Beni Israil," they refer to the whole region as far as \'Aqabah, and not to the plateau alone. The elevation on the south forms a very steep ascent or "wall" (see <a href="./study/isbe/search.html?string=SHUR">SHUR</a>), bending round on the west and east, and rising above the shore plains near Suez and the \'Arabah near Edom. Near the center of the plateau is the small fort of Nakhl ("the palms"), where water is found; but, as a whole, the Tih is waterless, having very few springs, the most important being those near the western Kadesh (\'Ain Kadis); for Rehoboth belongs to the region of the Neghebh rather than to the Tih. In winter, when very heavy rains occur, the valleys are often flooded suddenly by a seil, or "torrent," which is sometimes 10 feet deep for a few hours. Such a seil has been known to sweep away trees, flocks, and human beings; yet, in consequence of the hard rocky surface, the flood rushes away to the sea and soon becomes a mere rivulet. Where soft soil is found, in the valleys, grass will grow and afford pasture, but even early in spring the Arabs begin to suffer from want of water, which only remains in pits and in water holes among rocks. They have then much difficulty in watering their goats and sheep.<P>3. "The Sandy Tract":<P>Below the Tih escarpment on the south is another region called Debbet er-ramleh ("the sandy tract"), which is only 20 miles across at its widest; and to the west are the sandy plains, with limestone foothills, stretching east of the Bitter Lakes and of the Gulf of Suez. The third region consists of the granite chain (see <a href="./study/isbe/search.html?string=SINAI">SINAI</a>) which rises to 8,550 feet above the sea, and some 6,000 feet above its valleys, near Jebel Musa. Parts of this region are better watered than is any part of the Tih, and the main route from Egypt to Edom has consequently always run through it.<P>4. Description of the Arabah:<P>The fourth region is that of the \'Arabah, or broad valley (10 miles wide) between the Gulf of \'Aqabah and the Dead Sea. It has a watershed some 700 feet high above the Gulf (south of the neighborhood of Petra); and north of this shed the water flows to the Dead Sea 1,292 feet below the Mediterranean. The total length of this valley is 120 miles, the watershed being (near the Edomite chain) about 45 miles north of \'Aqabah. The head of the Gulf was once farther north; and, near \'Ain Ghudian (probably Eziongeber) and \'Ain et-Tabah (probably Jotbath), there is a mud flat which becomes a lake in winter—about 20 miles from the sea. Lower down—at \'Ain edition Deffiyeh—there is another such flat, the head being 10 miles from \'Aqabah. The whole region is much better watered than either of the three preceding districts, having springs at the foot of the mountains on either side; and the \'Arabah is thus the best pastoral country within the limits described. It now supports a nomad population of about 2,000 or 3,000 souls (Chaiwatat and \'Alawin Arabs), while the region round Sinai has some 2,000 souls (Towarah Arabs): the whole of the Tih has probably not more than 5,000 inhabitants; for the stronger tribes (\'Azazimeh and Terabin) live chiefly between Gaza and Beersheba. These Arabs have goats, sheep and camels, but cattle are only found near Beersheba. The flocks are watered daily—as in Palestine generally—and are sometimes driven 20 miles in winter to find pasture and water. The water is also brought on donkeys and camels to the camps, and carried in goatskin bags on a journey through waterless districts.<P>See also <a href="./study/isbe/search.html?string=ARABAH">ARABAH</A>.<P>5. Physical Condition of the Wilderness:<P>There is no reason to think that the conditions at the time of the Exodus differed materially from those of the present time. The Arabs have cut down a good many acacia trees for firewood in recent times, but the population is too small materially to affect the vegetation. The annual rainfall—except in years of drought—is from 10 to 20 inches, and snow falls in winter on the Tih, and whitens Sinai and the Edomite mountains for many days. The acacia, tamarisk and palm grow in the valleys. At Wady Feiran there are said to be 5,000 date palms, and they occur also in the \'Arabah and the Edomite gorges, while the white broom (<a onClick="return mV(\'1Ki\',19,5);">1Ki 19:5</a>, the King James Version "juniper") grows on the Tih plateau. This Tih plateau is the bed of an ancient ocean which once surrounded the granite mountains of Sinai. It was upheaved probably in the Miocene age, long before man appeared on earth. The surface formation (Hull, Memoir on the Geology and Geography of Arabia-Petraea, etc., 1886) consists of Cretaceous limestones of the Eocene and Chalk ages, beneath which lies the Nubian sandstone of the Greensand period, which is also visible all along the route from Sinai to \'Aqabah, and on the east side of the Dead Sea, and even at the foot of the Gilead plateau. These beds are all visible in the Tih escarpment; and north of Sinai there are yet older formations of limestone, and the "desert sandstone" of the Carboniferous period. Since the conditions of natural water-supply depend entirely on geological formation and on rainfall, neither of which can be regarded as having changed since the time of Moses, the scientific conclusion is that the desert thus described represents that of his age, This, as we shall see, affects our conclusion as to the route followed by Israel from Egypt to the \'Arabah; for, on the direct route from Suez to Nakhl (about 70 miles), there is no water for the main part of the way, so it has to be carried on camels; while, east of Nakhl, in a distance of 80 miles, there is only one known supply in a well (Bir eth-Themed) a few miles south of the road. This route was thus practically impassable for the Hebrews and their beasts, whereas the Sinai route was passable. Thus when Wellhausen (History of Israel and Judah, 343) speaks of Israel as going straight to Kadesh, and not making a "digression to Sinai," he seems not to have considered the topography as described by many modern travelers. For not only was the whole object of their journey first to visit the "Mount of God," but it also lay on the most practicable route to Kadesh.<P>6. Difficulties Regarding the Numbers of Israel and Account of Tabernacle<P>It is true that there are certain difficulties as regards both the numbers of Israel and the account of the tabernacle. The first of these objections has been considered elsewhere (see <a href="./study/isbe/search.html?string=EXODUS">EXODUS</a>). The detailed account of the tabernacle (<span class="noTag">Ex 25-28; 36-39</span>) belongs to a part of the Pentateuch which many critical writers assign to a later date than that of the old narrative and laws (<span class="noTag">Ex 1-24</span>). The description may seem more applicable to the semi-permanent structure that existed at Shiloh and Nob, than to the original "tent of meeting" in the desert. On the other hand, living so long in civilized Egypt, the Hebrews no doubt had among them skilled artificers like Bezalel. The Egyptians used acacia wood for furniture; and though the desert acacia does not grow to the size which would furnish planks 1 1/4 cubits broad, it may be that these were made up by joiner\'s work such as the ancients were able to execute. There was plenty of gold in Egypt and Asia, but none near Sinai. It is suggested, however, that the ornaments of which the Hebrews spoiled the Egyptians were presented, like the stuffs (<a onClick="return mV(\'Exd\',36,6);">Ex 36:6</a>) prepared for the curtains—just as the Arabs weave stuffs for their tents—and they might have served to spread a thin layer of gold over acacia boards, and on the acacia altar. It is more difficult to understand (on our present information) where silver enough for the bases (<a onClick="return mV(\'Exd\',26,25);">Ex 26:25</a>) would be found. Copper (<a onClick="return mV(\'Exd\',27,4);">Ex 27:4</a>) presents less difficulty, since there were copper mines in Wady Nucb near Serabit el Khadim. The women gave gold earrings to Aaron (<a onClick="return mV(\'Exd\',32,3);">Ex 32:3</a>) for the Golden Calf, but this may have been a small object. Eusebius (in Onomasticon), referring to Dizahab, "the place of gold" (<a onClick="return mV(\'Deu\',1,1);">De 1:1</a>), now Dhahab ("gold") on the west shore of the Gulf of \'Aqabah, east of Sinai, mentions the copper mines of Punon; and thought that veins of gold might also have existed in the mountains of Edom in old times. A little gold is also found in Midian. We know that the Egyptians and Assyrians carried arks and portable altars with their armies, and a great leather tent of Queen Habasu actually exists. Thothmes III, before the Exodus, speaks of "seven tent poles covered with plates of gold from the tent of the hostile king" which he took as spoil at Megiddo. The art of engraving gems was also already ancient in the time of Moses.<P>See <a href="./study/isbe/search.html?string=NUMBERS,+BOOK+OF">NUMBERS, BOOK OF</A>.<P>7. Difficulty as to Number of Wagons:<P>Another difficulty is to understand how six ox wagons (<a onClick="return mV(\'Num\',7,3);">Nu 7:3</a>) sufficed to carry all the heavy planks and curtains, and vessels of the tabernacle; and though the use of ox carts, and of four-wheeled wagons also, is known to have been ancient in Asia, there are points on even the easiest route which it would seem impossible for wagons to pass, especially on the rough road through Edom and Moab. On the other hand, we know that an Egyptian Mohar did drive his chariot over the mountains in Palestine in the reign of Rameses II, though it was finally broken near Joppa.<P>8. Fauna of the Desert:<P>Whatever be thought as to these questions, there are indications in other passages of actual acquaintance with the desert fauna. Although the manna, as described (<a onClick="return mV(\'Exd\',16,31);">Ex 16:31</a>), is said not to resemble the sweet gum which exudes from the twigs of the tamarisk (to which it has been compared by some), which melts in the sun, and is regarded as a delicacy by the Arabs, yet the quail (<a onClick="return mV(\'Exd\',16,13);">Ex 16:13</a>; <a onClick="return mV(\'Num\',11,31);">Nu 11:31</a>) still migrate from the sea northward across the desert in spring, flying low by night. The birds noticed (<a onClick="return mV(\'Lev\',11,1);">Le 11</a>; <a onClick="return mV(\'Deu\',14,\'1-\');">De 14</a>) include—as Canon Tristram remarked—species found on the seashores and in the wilderness, such as the cormorant, pelican and gull; the ostrich (in the desert east of Moab); the stork, the crane and the heron which migrate from Africa to the Jordan valley. It is notable that, except the heron (Assyrian anpatu), the Hebrew names are not those used by later Assyrians. The mammals include the boar which loves the marshes, and the hyrax (the King James Version "coney") which still exists near Sinai and in the desert of Judah, with the desert hare. It is remarkable that in Deuteronomy (<a onClick="return mV(\'Deu\',14,5);">14:5</A>), besides the ibex and the bubak, two species are added (the fallow deer, Hebrew \'ayyal, the King James Version "hart," and the roebuck, Hebrew yachmur, Arabic yachmur, the King James Version "fallow deer") which are not desert animals. The former occurs at Tabor; the latter was found by the present writer in 1873 on Carmel, and is since known in Gilead and Lebanon. But Deuteronomy refers to conditions subsequent to the capture of Gilead and Bashan.<P>9. Characteristic Names of the Districts:<P>The various districts in the desert receive characteristic names in the account of the Exodus. Thus, Shur is the coast region under the "wall" of the Tih, and Sin (<a onClick="return mV(\'Exd\',17,1);">Ex 17:1</a>; <a onClick="return mV(\'Num\',33,11);">Nu 33:11</a>) was the "glaring" desert (see <a href="./study/isbe/search.html?string=SINAI">SINAI</A>) of white chalk, west of Sinai. Paran is noticed 10 times, as a desert and mountain region (<a onClick="return mV(\'Deu\',33,2);">De 33:2</a>; <a onClick="return mV(\'Hab\',3,3);">Hab 3:3</a>) between Sinai and Kadesh. The name seems to survive in Wady Feiran west of Sinai. It means some kind of "burrows," whether referring to mines, caves or water pits, according to the usual explanation; but in Arabic the root also means "hot," which is perhaps more likely. The term seems to be of very wide extension, and to refer to the Tih generally (<a onClick="return mV(\'Gen\',21,21);">Ge 21:21</a>); for David (<a onClick="return mV(\'1Sa\',25,1);">1Sa 25:1</a>) in Paran was not far from Maon and Carmel south of Hebron, and the same general application (<a onClick="return mV(\'1Ki\',11,18);">1Ki 11:18</a>) is suggested in another passage. Finally the desert of Zin (tsin) is noticed 9 times, and very clearly lay close to Kadesh-barnea and east of Paran (<a onClick="return mV(\'Num\',13,21);">Nu 13:21</a>; <a onClick="return mV(\'Num\',20,1);">20:1</a>; <a onClick="return mV(\'Num\',34,3);">34:3</a>; <a onClick="return mV(\'Deu\',32,51);">De 32:51</a>; <a onClick="return mV(\'Jos\',15,3);">Jos 15:3</a>). The rabbis rendered it "palm" (tsin), which is appropriate to the \'Arabah valley which still retains the old name mentioned in <a onClick="return mV(\'Deu\',1,1);">De 1:1</a>. These various considerations as to the conditions to be fulfilled may serve to show that the difficulties often raised, as to the historic character of the Exodus narrative, have been much overstated; and a further study of the various journeys serves to confirm this view.<P>II. First Journey.<P>1. Mode of Traveling:<P>Israel left Egypt in the early part of April (after the 14th of Abib) and reached Sinai about the 14th or 19th of the 3rd month (<a onClick="return mV(\'Exd\',19,1);">Ex 19:1</a>), or at the end of May. They thus took two months to accomplish a journey of about 117 miles; but from the first camp after crossing the Red Sea to that in the plain before the Mount ten marches are mentioned, giving intervals of less than 12 miles between each camp. Thus they evidently remained in camp for at least 50 days of the time, probably at the better supplied springs, including that of the starting-point, and those at Elim and Rephidim, in order to rest their flocks. The camps were probably not all crowded round one spring, but spread over a distance of some miles. The Arabs indeed do not camp or keep their flocks close to the waters, probably in order not to defile them, but send the women with donkeys to fetch water, and drive the sheep and goats to the spring or well in the cool of the afternoon. Thus we read that Amalek "smote the hindmost" (<a onClick="return mV(\'Deu\',25,18);">De 25:18</a>), which may either mean the stragglers unable to keep up when "weary," or perhaps those in the camp most in the rear.<P>2. The Route: the First Camp:<P>The route of Israel has been very carefully described by Robinson (BR,1838, I, 60-172; II, 95-195), and his account is mainly followed in this and the next sections. We may place the first camp (see <a href="./study/isbe/search.html?string=EXODUS">EXODUS</A>), between the springs which supply Suez (\'Ain Nab\'a and \'Ayyun Musa), which are about 4 miles apart. The first of these is scooped out among the sand hillocks, and bubbles up in a basin some 6 ft. deep. The water is brackish, but supplies as many as 200 camel loads at once for Suez. At \'Ayyun Musa ("the springs of Moses") there are seven springs, some being small and scooped in the sand. A few palms occur near the water (which is also brackish), and a little barley is grown, while in recent times gardens of pomegranates have been cultivated (A. E. Haynes, Man-Hunting in the Desert,1894,106), which, with the palms, give a grateful shade.<P>3. Waters of Marah:<P>From this base Israel marched "three days in the wilderness" of Shur, "and found no water" (<a onClick="return mV(\'Exd\',15,22);">Ex 15:22</a>). They no doubt carried it with them, and may have sent back camels to fetch it. Even when they reached the waters of Marah ("the bitter") they found them undrinkable till sweetened. The site of Marah seems clearly to have been at \'Ain Chawarah ("the white chalk spring"), named from the chalky mound beside it. This <span class="noTag">is</span> 36 miles from \'Ayyun Musa, giving an average daily march of 12 miles. There is no water on the route, though some might have been fetched from \'Ain Abu Jerad in Wady Sudr, and from the small spring of Abu Suweirah near the sea. Burckhardt thought that the water was sweetened from the berries of the Gharqad shrub (which have an acid juice) on the thorny bushes near the spring. This red berry ripens, however, in June. There is no doubt, on the other hand, that the best treatment for brack water is the addition of an acid taste. The Arabs consider the waters of this spring to be the most bitter in the country near.<P>4. Camp by the Red Sea:<P>From Marah, the next march led to Elim ("the palms"), where were "twelve springs (not "wells") of water and seventy palms." The site seems clearly to have been in Wady Gharandil, where a brook is found fed by springs of better water than that of Marah. The distance is only about 6 miles, or an easy march, and palm trees exist near the waters. Israel then entered the desert of Sin, stretching from Elim to Sinai, reaching a camp "by the Red Sea" (<a onClick="return mV(\'Num\',33,10);">Nu 33:10</a>) just a month after leaving Egypt (<a onClick="return mV(\'Exd\',16,1);">Ex 16:1</a>). The probable site is near the mouth of Wady et-Taiyibeh ("the goodly valley"), which is some 10 or 12 miles from the springs of Gharandil. The foothills here project close to the coast, and north of the valley is Jebel Chammam Far\'aun ("the mountain of Pharaoh\'s hot bath"), named from hot sulphur springs. The water in Wady et-Taiyibeh is said to be better than that of Marah, and this is the main Arab watering-place after passing Gharandil. A small pond is here described by Burckhardt at el-Murkhat, in the sandstone rock near the foot of the mountains, but the water is bitter and full of weeds, moss and mud. The site is close to a broad shore plain stretching south Here two roads diverge toward Sinai, which lies about 65 miles to the southeast, and in this interval (<a onClick="return mV(\'Num\',33,\'11-15\');">Nu 33:11-15</a>) five stations are named, giving a daily march of 13 miles. The Hebrews probably took the lower and easier road, especially as it avoided the Egyptian mines of Wady el-Maghdrah ("valley of the cave") and their station at Serabit el-Khadim ("pillars of the servant"), where—though this is not certain—there may have been a detachment of bowmen guarding the mines.<P>5. The Route to Sinai:<P>None of the five camps on this section of the route is certainly known. Dophkah apparently means "overdriving" of flocks, and Alush (according to the rabbis) "crowding," thus indicating the difficulties of the march. Rephidim ("refreshments") contrasts with these names and indicates a better camp. The site, ever since the 4th century AD, has always been shown in Wady Feiran (Eusebius, Onomasticon, under the word "Rephidim")—an oasis of date palms with a running stream. The distance from Sinai is about 18 miles, or 14 from the western end of the broad plain er-Rachah in which Israel camped in sight of Horeb; and the latter name (<a onClick="return mV(\'Exd\',17,6);">Ex 17:6</a>) included the Desert of Sinai even as far west as Rephidim. Here the rod of Moses, smiting the rock, revealed to the Hebrews an abundant supply, just as they despaired of water. Here apparently they could rest in comfort for some three weeks before the final march to the plain "before the mount" (<a onClick="return mV(\'Exd\',19,1,2);">Ex 19:1,2</a>), which they reached two months after leaving Egypt. Here Amalek—coming down probably from the mines—attacked them in the rear. Meanwhile there was ample time for the news of their journey to reach Midian, and for the family of Moses (<a onClick="return mV(\'Exd\',18,\'1-5\');">Ex 18:1-5</a>) to reach Sinai. On one of the low hills near Wady Feiran, Moses watched the doubtful fight and built his stone altar. A steep pass separates the oasis from the Rachah plain, and baggage camels usually round it on the north by Wady esh-Sheikh, which may have been the actual route. The Rephidim oasis has a fertile alluvial soil, and the spot was chosen by Christian hermits perhaps as early as the 3rd century AD.<P>III. Second Journey.<P>1. The Stay at Sinai:<P>Israel remained at Mt. Sinai for 10 months, leaving it after the Passover of the "second year" (<a onClick="return mV(\'Num\',9,\'1-3\');">Nu 9:1-3</a>), and apparently soon after the feast, since, when they again witnessed the
