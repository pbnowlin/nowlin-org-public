isbe[9144]='Water of Separation (or of Uncleanness)``<a href="./study/isbe/search.html?string=DEFILEMENT">DEFILEMENT</a>; <a href="./study/isbe/search.html?string=SEPARATION">SEPARATION</a>; <a href="./study/isbe/search.html?string=UNCLEANNESS">UNCLEANNESS</a>`1';
isbe[9145]='Watercourse`wo\'-ter-kors:<P>(1) \'aphiq (<a onClick="return mV(\'Eze\',6,3);">Eze 6:3</a>; <a onClick="return mV(\'Eze\',31,12);">31:12</a>; <a onClick="return mV(\'Eze\',32,6);">32:6</a>; <a onClick="return mV(\'Eze\',34,13);">34:13</a>; <a onClick="return mV(\'Eze\',35,8);">35:8</a>; <a onClick="return mV(\'Eze\',36,4,6);">36:4,6</a>), the King James Version "river," elsewhere "stream," "channel," or "brook."<P>(2) pelegh (<a onClick="return mV(\'Pro\',21,1);">Pr 21:1</a>). "The king\'s heart is in the hand of Yahweh as the watercourses," the King James Version "rivers," elsewhere "streams" or "rivers."<P>(3) yabhal, yibheley mayim, "watercourses" (English Versions of the Bible) (<a onClick="return mV(\'Isa\',44,4);">Isa 44:4</a>); in <a onClick="return mV(\'Isa\',30,25);">Isa 30:25</a>, English Versions of the Bible has "streams of water"; compare yubhal, "rivers" (<a onClick="return mV(\'Jer\',17,8);">Jer 17:8</a>); yubhal, "Jubal" (<a onClick="return mV(\'Gen\',4,21);">Ge 4:21</a>); \'ubhal, "the river Ulai" (<a onClick="return mV(\'Dan\',8,2,3,6);">Da 8:2,3,6</a>).<P>(4) te\'alah, "channel," the King James Version "watercourse" (<a onClick="return mV(\'Job\',38,25);">Job 38:25</a>); elsewhere "conduit," "the conduit of the upper pool" (<a onClick="return mV(\'2Ki\',18,17);">2Ki 18:17</a>; <a onClick="return mV(\'Isa\',7,3);">Isa 7:3</a>; <a onClick="return mV(\'Isa\',36,2);">36:2</a>).<P>(5) tsinnor, "watercourse," the King James Version "gutter" (<a onClick="return mV(\'2Sa\',5,8);">2Sa 5:8</a>).`<a href="./study/isbe/search.html?string=BROOK">BROOK</a>; <a href="./study/isbe/search.html?string=RIVER">RIVER</a>; <a href="./study/isbe/search.html?string=STREAM">STREAM</a>; <a href="./study/isbe/search.html?string=WATERFALL">WATERFALL</a>`37';
isbe[9146]='Waterfall`wo\'-ter-fol (tsinnor; only in the American Standard Revised Version (<a onClick="return mV(\'Psa\',42,7);">Ps 42:7</a>)):<P class="in15">"Deep calleth unto deep at the<br>noise of thy waterfalls;<br>All thy waves and thy billows<br>are gone over me."<P>The King James Version and the English Revised Version have "waterspouts," the English Revised Version margin "cataracts." The etymology of the word is uncertain. It occurs also in <a onClick="return mV(\'2Sa\',5,8);">2Sa 5:8</a>, translated "watercourse," the King James Version "gutter." Compare (tsanteroth), "spouts" (<a onClick="return mV(\'Zec\',4,12);">Zec 4:12</a>).``1';
isbe[9147]='Waterpot`wo\'-ter-pot (hudria; compare hudor, "water"): An earthen vessel, or jar, for carrying or holding water (in the Septuagint for kadh, "jar," or "pitcher"). It was usually carried by women upon the head, or upon the shoulder (<a onClick="return mV(\'Jhn\',4,28);">Joh 4:28</a>). Pots of larger size, holding eighteen or twenty gallons apiece, were used by the Jews for purposes of ceremonial purification (<a onClick="return mV(\'Jhn\',2,6);">Joh 2:6</a>).``1';
isbe[9148]='Waters`wo\'-terz (mayim, plural of may, "water"; in the New Testament hudor, "water"; kindunois potamon (<a onClick="return mV(\'2Cr\',11,26);">2Co 11:26</a>), the King James Version "perils of waters," is in the Revised Version (British and American) "perils of rivers"): In the New Testament there is frequent reference to the water of baptism. Pilate washes his hands with water to signify his guiltlessness. Jesus tells the Samaritan woman of the living water. The Lamb shall guide the redeemed unto fountains of waters of life.<P>The uses of mayim are well classified in BDB, especially the figurative references, as follows: a symbol of distress, "when thou passest through the waters" (<a onClick="return mV(\'Isa\',43,2);">Isa 43:2</a>); of force, "like the breach of waters" (<a onClick="return mV(\'2Sa\',5,20);">2Sa 5:20</a>); of that which is overwhelming, "a tempest of mighty waters overflowing" (<a onClick="return mV(\'Isa\',28,2);">Isa 28:2</a>); of fear, "The hearts of the people...became as water" (<a onClick="return mV(\'Jos\',7,5);">Jos 7:5</a>); of transitoriness, "Thou shalt remember it as waters that are passed away" (<a onClick="return mV(\'Job\',11,16);">Job 11:16</a>); of refreshment, "as streams of water in a dry place" (<a onClick="return mV(\'Isa\',32,2);">Isa 32:2</a>); of peace, "He leadeth me beside still waters" (<a onClick="return mV(\'Psa\',23,2);">Ps 23:2</a>); of legitimate pleasures, "waters out of thine own cistern" (<a onClick="return mV(\'Pro\',5,15);">Pr 5:15</a>); of illegitimate pleasures, "Stolen waters are sweet" (<a onClick="return mV(\'Pro\',9,17);">Pr 9:17</a>); of that which is poured out abundantly, blood (<a onClick="return mV(\'Psa\',79,3);">Ps 79:3</a>), wrath (<a onClick="return mV(\'Hsa\',5,10);">Ho 5:10</a>), justice (<a onClick="return mV(\'Amo\',5,24);">Am 5:24</a>), groanings (<a onClick="return mV(\'Job\',3,24);">Job 3:24</a>).``37';
isbe[9149]='Waters of Merom``<a href="./study/isbe/search.html?string=MEROM,+WATERS+OF">MEROM, WATERS OF</a>`1';
isbe[9150]='Waters of Strife`strif.`<a href="./study/isbe/search.html?string=MERIBAH">MERIBAH</a>`1';
isbe[9151]='Waterspout`wo\'-ter-spout:<P>(1) (tsinnor) (<a onClick="return mV(\'Psa\',42,7);">Ps 42:7</a>), the American Standard Revised Version "waterfalls," the King James Version and the English Revised Version "waterspouts," the English Revised Version margin "cataracts."<P>(2) (tannin) (<a onClick="return mV(\'Psa\',148,7);">Ps 148:7</a>), the American Standard Revised Version "sea-monsters," the King James Version and the English Revised Version "dragons," the English Revised Version margin, "sea-monsters" or "water-spouts."<P>"Praise Yahweh from the earth, Ye sea-monsters, and all deeps."`<a href="./study/isbe/search.html?string=DRAGON">DRAGON</a>; <a href="./study/isbe/search.html?string=SEA+MONSTER">SEA-MONSTER</a>; <a href="./study/isbe/search.html?string=WATERFALL">WATERFALL</a>`37';
isbe[9152]='Wave offering`wav of\'-er-ing.`<a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>`1';
isbe[9153]='Waw`waw "w": The sixth letter of the Hebrew alphabet; transliterated in this Encyclopedia "w" (or "v"). It came also to be used for the <span class="noTag">number 6</span>.`<a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>`1';
isbe[9154]='Wax`waks:<P>(1) Noun (donagh): Used only in a simile of melting (<a onClick="return mV(\'Psa\',22,14);">Ps 22:14</a>; <a onClick="return mV(\'Psa\',68,2);">68:2</a>; <a onClick="return mV(\'Psa\',97,5);">97:5</a>; <a onClick="return mV(\'Mic\',1,4);">Mic 1:4</a>).<P>See <a href="./study/isbe/search.html?string=WRITING">WRITING</a>.<P>(2) A now archaic verb, meaning "to grow," used freely in English Versions of the Bible as a translation of various terms in Greek and Hebrew. The past participle in the King James Version and the English Revised Version is "waxen," except in <a onClick="return mV(\'Gen\',18,12);">Ge 18:12</a>. There (and throughout in the American Standard Revised Version) the form is "waxed."``1';
isbe[9155]='Way`wa (\'orach, orcha\',\' erets, bo\', derekh, halikhah, ma\'galah, nathibh; hodos, parodos, poreia, tropos; "highway," mecillah, meclul; diexodoi ton hodon): The list just cited contains only a portion of the words translated "way" or "highway" in the King James Version. Most of them have the primary meaning of "road," "customary path," "course of travel" (<a onClick="return mV(\'Gen\',3,24);">Ge 3:24</a>; <a onClick="return mV(\'Exd\',23,20);">Ex 23:20</a>; <a onClick="return mV(\'Num\',20,17);">Nu 20:17</a>, etc.). By a very easy and natural figure "way" is applied to the course of human conduct, the manner of life which one lives (<a onClick="return mV(\'Exd\',18,20);">Ex 18:20</a>; <a onClick="return mV(\'Exd\',32,8);">32:8</a>; <a onClick="return mV(\'Num\',22,32);">Nu 22:32</a>; <a onClick="return mV(\'1Sa\',8,3);">1Sa 8:3</a>; <a onClick="return mV(\'1Ki\',13,33);">1Ki 13:33</a>, etc.; <a onClick="return mV(\'Act\',14,16);">Ac 14:16</a>; <a onClick="return mV(\'1Cr\',4,17);">1Co 4:17</a>; <a onClick="return mV(\'Jam\',5,20);">Jas 5:20</a>). "The way of an eagle...of a serpent...of a ship...and of a man" (<a onClick="return mV(\'Pro\',30,19);">Pr 30:19</a>) agree in that they leave no trace behind them (compare The <span class="noTag">Wisdom of Solomon 5:10,11</span>). In some cases the language may be such as to leave it indeterminate whether the way or course of conduct is good or bad (<a onClick="return mV(\'Deu\',28,29);">De 28:29</a>; <a onClick="return mV(\'1Sa\',18,14);">1Sa 18:14</a>; <a onClick="return mV(\'2Ch\',27,7);">2Ch 27:7</a>; <a onClick="return mV(\'Job\',13,15);">Job 13:15</a>; <a onClick="return mV(\'Pro\',3,6);">Pr 3:6</a>; <a onClick="return mV(\'Pro\',6,6);">6:6</a>; <a onClick="return mV(\'Jam\',1,8);">Jas 1:8</a>), though in most cases the Bible writers attach to every act an ethical evaluation. Sometimes this way of conduct is of purely human choice, without reference to either God or good (<a onClick="return mV(\'Jdg\',2,19);">Jud 2:19</a>; <a onClick="return mV(\'Job\',22,15);">Job 22:15</a>; <a onClick="return mV(\'Job\',34,21);">34:21</a>; <a onClick="return mV(\'Psa\',119,9);">Ps 119:9</a>; <a onClick="return mV(\'Pro\',12,15);">Pr 12:15</a>; <a onClick="return mV(\'Pro\',16,2);">16:2</a>). Such a course is evil (<a onClick="return mV(\'2Ch\',7,14);">2Ch 7:14</a>; <a onClick="return mV(\'Psa\',1,6);">Ps 1:6</a>; <a onClick="return mV(\'Psa\',119,101,104,128);">119:101,104,128</a>; <a onClick="return mV(\'Pro\',1,19);">Pr 1:19</a>, etc.) and will obtain such punishment as its lack of merit warrants (<a onClick="return mV(\'1Ki\',8,32,39);">1Ki 8:32,39</a>; <a onClick="return mV(\'2Ch\',6,23);">2Ch 6:23</a>; <a onClick="return mV(\'Job\',30,12);">Job 30:12</a>; <a onClick="return mV(\'Job\',34,11);">34:11</a>; <a onClick="return mV(\'Jer\',17,10);">Jer 17:10</a>; <a onClick="return mV(\'Eze\',7,3,9);">Ezk 7:3,9</A>; <a onClick="return mV(\'Hsa\',12,2);">Ho 12:2</a>). At the opposite extreme from this is the good way (<a onClick="return mV(\'Psa\',1,6);">Ps 1:6</a>; <a onClick="return mV(\'Pro\',8,20);">Pr 8:20</a>; <a onClick="return mV(\'Pro\',12,28);">12:28</a>; <a onClick="return mV(\'Pro\',15,10);">15:10</a>; <a onClick="return mV(\'Isa\',26,7);">Isa 26:7</a>), which is that course of conduct enjoined by God and exemplified in His perfect conduct (<a onClick="return mV(\'Gen\',6,12);">Ge 6:12</a>; <a onClick="return mV(\'Gen\',18,19);">18:19</a>; <a onClick="return mV(\'Deu\',8,6);">De 8:6</a>; <a onClick="return mV(\'Deu\',26,17);">26:17</a>; <a onClick="return mV(\'1Ki\',2,3);">1Ki 2:3</a>; <a onClick="return mV(\'Job\',23,11);">Job 23:11</a>; <a onClick="return mV(\'Psa\',51,13);">Ps 51:13</a>, etc.). These two ways briefly but graphically described by the Lord (<a onClick="return mV(\'Mat\',7,13,14);">Mt 7:13,14</a>; compare <a onClick="return mV(\'Luk\',13,24);">Lu 13:24</a>) became the subject of extended catechetical instruction in the early church. See the Epistle of Barnabas, xviii, and the Didache i.1. Frequently the way in this metaphorical sense is characterized by that quality which is its outstanding feature, e.g. mention is made of the way of life (<a onClick="return mV(\'Pro\',15,24);">Pr 15:24</a>; <a onClick="return mV(\'Jer\',21,8);">Jer 21:8</a>; <a onClick="return mV(\'Act\',2,28);">Ac 2:28</a>); of truth (<a onClick="return mV(\'Psa\',119,30);">Ps 119:30</a>; <a onClick="return mV(\'2Pe\',2,2);">2Pe 2:2</a>); of peace (<a onClick="return mV(\'Isa\',59,8);">Isa 59:8</a>; <a onClick="return mV(\'Luk\',1,79);">Lu 1:79</a>; <a onClick="return mV(\'Rom\',3,17);">Ro 3:17</a>); of justice (<a onClick="return mV(\'Pro\',17,23);">Pr 17:23</a>; <a onClick="return mV(\'Dan\',4,37);">Da 4:37</a>); of righteousness (<a onClick="return mV(\'Mat\',21,32);">Mt 21:32</a>; <a onClick="return mV(\'2Pe\',2,21);">2Pe 2:21</a>); of salvation (<a onClick="return mV(\'Act\',16,17);">Ac 16:17</a>); of lying (<a onClick="return mV(\'Psa\',119,29);">Ps 119:29</a>), and of death (<a onClick="return mV(\'Jer\',21,8);">Jer 21:8</a>). Frequently God\'s purpose or His customary action is described as His way (<a onClick="return mV(\'Psa\',103,7);">Ps 103:7</a>; <a onClick="return mV(\'Isa\',26,8);">Isa 26:8</a>; <a onClick="return mV(\'Mat\',22,16);">Mt 22:16</a>; <a onClick="return mV(\'Act\',13,10);">Ac 13:10</a>). Since all of God\'s plans and purposes tend toward man\'s salvation, His provisions to this end are frequently spoken of as His Way, and inasmuch as all of the divine plans center in Christ He is preeminently the Way (<a onClick="return mV(\'Jhn\',14,6);">Joh 14:6</a>). Out of this fact grew the title, "The Way," one of the earliest names applied to Christianity (<a onClick="return mV(\'Act\',9,2);">Ac 9:2</a>; <a onClick="return mV(\'Act\',18,25,26);">18:25,26</a>; <a onClick="return mV(\'Act\',19,9,23);">19:9,23</a>; <a onClick="return mV(\'Act\',22,4);">22:4</a>; <a onClick="return mV(\'Act\',24,22);">24:22</a>).<P>The word highway is used to denote a prominent road, such a one for example as was in ancient times maintained for royal travel and by royal authority. It is always used in the literal sense except in <a onClick="return mV(\'Pro\',15,19);">Pr 15:19</a>; <a onClick="return mV(\'Pro\',16,17);">16:17</a>, where it is a course of conduct.`<a href="./study/isbe/search.html?string=PATH,+PATHWAY">PATH, PATHWAY</a>`124';
isbe[9156]='Way, Covered``<a href="./study/isbe/search.html?string=COVERED+WAY">COVERED WAY</a>`1';
isbe[9157]='Way, Little`(kibhrah, "length," "a measure"): A technical measure of distance in the Hebrew; but it must be considered undefined (<a onClick="return mV(\'Gen\',35,16);">Ge 35:16</a>; <a onClick="return mV(\'Gen\',48,7);">48:7</a> the King James Version, the English Revised Version "some way," the American Standard Revised Version "some distance"; <a onClick="return mV(\'2Ki\',5,19);">2Ki 5:19</a>, the English Revised Version "some way," the American Revised Version margin "some distance"). The Hebrew term kibhrah is also found in Phoenician inscriptions as a measure of distance.``1';
isbe[9158]='Wayfaring Man`wa\'-far-ing, The translation in <a onClick="return mV(\'Jdg\',19,17);">Jud 19:17</a>; <a onClick="return mV(\'2Sa\',12,4);">2Sa 12:4</a>; <a onClick="return mV(\'Jer\',9,2);">Jer 9:2</a>; <a onClick="return mV(\'Jer\',14,8);">14:8</a> of (\'oreach), the participle of \'arach, "to journey." In <a onClick="return mV(\'Isa\',33,8);">Isa 33:8</a> of \'obher \'orach, "one passing on a path," and in <a onClick="return mV(\'Isa\',35,8);">Isa 35:8</a> of holekh derekh, "one walking on a road." "Traveler" is the meaning in all cases.``1';
isbe[9159]='Waymark`wa\'-mark (tsyun): In <a onClick="return mV(\'Jer\',31,21);">Jer 31:21</a>, "Set thee up waymarks," explained by the parallel, "Make thee guide-posts" (the King James Version "Make thee high heaps"). A sign or guiding mark on the highway.``1';
isbe[9160]='Wealth, Wealthy`welth, wel\'-thi (hon, chayil, nekhacim; euporia, "to possess riches," "to be in a position of ease" (<a onClick="return mV(\'Jer\',49,31);">Jer 49:31</a>)): The possession of wealth is not regarded as sinful, but, on the contrary, was looked upon as a sign of the blessing of God (<a onClick="return mV(\'Ecc\',5,19);">Ec 5:19</a>; <a onClick="return mV(\'Ecc\',6,2);">6:2</a>). The doctrine of "blessed are the poor, and cursed are the rich" finds no countenance in the Scriptures, for <a onClick="return mV(\'Luk\',6,20,24);">Lu 6:20,24</a> refers to concrete conditions (disciples and persecutors; note the "ye"). God is the maker of rich and poor alike (<a onClick="return mV(\'Pro\',22,2);">Pr 22:2</a>). But while it is not sinful to be rich it is very dangerous, and certainly perilous to one\'s salvation (<a onClick="return mV(\'Mat\',19,23);">Mt 19:23</a>). Of this fact the rich young ruler is a striking example (<a onClick="return mV(\'Luk\',18,22,23);">Lu 18:22,23</a>). It is because of the danger of losing the soul through the possession of wealth that so many exhortations are found in the Scriptures aimed especially at those who have an abundance of this world\'s goods (<a onClick="return mV(\'1Ti\',6,17);">1Ti 6:17</a>; <a onClick="return mV(\'Jam\',1,10,11);">Jas 1:10,11</a>; <a onClick="return mV(\'Jam\',5,1);">5:1</a>, etc.). Certain parables are especially worthy of note in this same connection, e.g. the Rich Fool (<a onClick="return mV(\'Luk\',12,\'16-21\');">Lu 12:16-21</a>), the Rich Man and Lazarus—if such can be called a parable—(<a onClick="return mV(\'Luk\',16,\'19-31\');">Lu 16:19-31</a>). That it is not impossible for men of wealth to be saved, however, is apparent from the narratives, in the Gospels, of such rich men as Nicodemus, and Joseph of Arimathea (<a onClick="return mV(\'Jhn\',19,38,39);">Joh 19:38,39</a>; <a onClick="return mV(\'Mat\',27,\'57-60\');">Mt 27:57-60</a>), and Zaccheus (<a onClick="return mV(\'Luk\',19,\'1-10\');">Lu 19:1-10</a>). It may fairly be inferred from the Gospel records that James and John, who were disciples of our Lord, were men of considerable means (<a onClick="return mV(\'Mar\',1,19,20);">Mr 1:19,20</a>; <a onClick="return mV(\'Jhn\',19,27);">Joh 19:27</a>).<P>Wealth may be the result of industry (<a onClick="return mV(\'Pro\',10,4);">Pr 10:4</a>), or the result of the special blessing of God (<a onClick="return mV(\'2Ch\',1,11,12);">2Ch 1:11,12</a>). We are warned to be careful lest at any time we should say "My power and the might of my hand hath gotten me this wealth. But thou shalt remember Yahweh thy God, for it is he that giveth thee power to get wealth" (<a onClick="return mV(\'Deu\',8,17,18);">De 8:17,18</a>).<P>Those possessing wealth are liable to certain kinds of sins against which they are frequently warned, e.g., highmindedness (<a onClick="return mV(\'1Ti\',6,17);">1Ti 6:17</a>); oppression of the poor (<a onClick="return mV(\'Jam\',2,6);">Jas 2:6</a>); selfishness (<a onClick="return mV(\'Luk\',12,\'1-\');">Lu 12</a> and <a onClick="return mV(\'Luk\',16,\'1-\');">16</A>); dishonesty (<a onClick="return mV(\'Luk\',19,\'1-10\');">Lu 19:1-10</a>); self-conceit (<a onClick="return mV(\'Pro\',28,11);">Pr 28:11</a>); self-trust (<a onClick="return mV(\'Pro\',18,11);">Pr 18:11</a>).<P>It is of interest to note that in the five places in the New Testament in which the word "lucre"—as applying to wealth—is used, it is prefaced by the word "filthy" (<a onClick="return mV(\'1Ti\',3,3);">1Ti 3:3</a> (the King James Version), <a onClick="return mV(\'1Ti\',3,8);">8</A>; <a onClick="return mV(\'Tts\',1,7,11);">Tit 1:7,11</a>; <a onClick="return mV(\'1Pe\',5,2);">1Pe 5:2</a>), and that in four of these five places it refers to the income of ministers of the gospel, as though they were particularly susceptible of being led away by the influences and power of money, and so needed special warning.<P>The Scriptures are not without instruction as to how we may use our wealth wisely and as well-pleasing to God. The parable of the Unjust Steward (<a onClick="return mV(\'Luk\',16,\'1-\');">Lu 16</a>) exhorts us to "make...friends by means of the mammon of unrighteousness," by which is meant that we should use the wealth which God has committed to us as stewards in order that we may win friends (souls) with it for Him and His kingdom, just as the unfaithful steward used the goods with which his master had entrusted him to make friends for himself. The parable of Dives and Lazarus gives us the sad picture of a selfish rich man who had abused his trust, who had failed to make friends with his money, and who, in the other world, would have given anything just for such a friend (<a onClick="return mV(\'Luk\',16,\'19-31\');">Lu 16:19-31</a>).`<a href="./study/isbe/search.html?string=RICHES">RICHES</a>`53';
isbe[9161]='Wean`wen: "To wean" in English Versions of the Bible is always the translation of (gamal), but gamal has a much wider force than merely "to wean," signifying "to deal fully with," as in <a onClick="return mV(\'Psa\',13,6);">Ps 13:6</a>, etc. Hence, as applied to a child, gamal covers the whole period of nursing and care until the weaning is complete (<a onClick="return mV(\'1Ki\',11,20);">1Ki 11:20</a>). This period in ancient Israel extended to about 3 years, and when it was finished the child was mature enough to be entrusted to strangers (<a onClick="return mV(\'1Sa\',1,24);">1Sa 1:24</a>). And, as the completion of the period marked the end of the most critical stage of the child\'s life, it was celebrated with a feast (<a onClick="return mV(\'Gen\',21,8);">Ge 21:8</a>), a custom still observed in the Orient. The weaned child, no longer fretting for the breast and satisfied with its mother\'s affection, is used in <a onClick="return mV(\'Psa\',131,2);">Ps 131:2</a> as a figure for Israel\'s contentment with God\'s care, despite the smallness of earthly possessions. In <a onClick="return mV(\'Isa\',28,9);">Isa 28:9</a> there is an ironical question, \'Is God to teach you knowledge as if you were children? You should have learned His will long ago!\'``48';
isbe[9162]='Weapons`wep\'-unz.`<a href="./study/isbe/search.html?string=ARMOR">ARMOR</a>`1';
isbe[9163]='Weasel`we\'-z\'-l (choledh; compare Arabic khuld, "mole-rat"):<P>(1) Choledh is found only in <a onClick="return mV(\'Lev\',11,29);">Le 11:29</a>, where it stands first in the list of eight unclean "creeping things that creep upon the earth." the King James Version and the Revised Version (British and American) agree in rendering choledh by "weasel," and the Septuagint has gale, "weasel" or "marten." According to Gesenius, the Vulgate, Targum, and Talmud support the same rendering. In spite of this array of authorities, it is worth while to consider the claims of the mole-rat, Spalax typhlus, Arabic khuld. This is a very common rodent, similar in appearance and habits to the mole, which does not exist in Palestine. The fact that it burrows may be considered against it, in view of the words, "that creepeth upon the earth." The term "creeping thing" is, however, very applicable to it, and the objection seems like a quibble, especially in view of the fact that there is no category of subterranean animals. See <a href="./study/isbe/search.html?string=MOLE">MOLE</a>.<P>(2) The weasel, Mustela vulgaris, has a wide range in Asia, Europe, and North America. It is from 8 to 10 inches long, including the short tail. It is brown above and white below. In the northern part of its range, its whole fur, except the tail, is white in winter. It is active and fearless, and preys upon all sorts of small mammals, birds and insects.`<a href="./study/isbe/search.html?string=LIZARD">LIZARD</a>`37';
isbe[9164]='Weather`weth\'-er (zahabh (<a onClick="return mV(\'Job\',37,22);">Job 37:22</a>), yom (<a onClick="return mV(\'Pro\',25,20);">Pr 25:20</a>), translated "day"; eudia, "clear sky," cheimon, "tempest"): In the East it is not customary to talk of the weather as in the West. There seems to be no word in the Hebrew corresponding to "weather." In <a onClick="return mV(\'Job\',37,22);">Job 37:22</a> the King James Version translates "Fair weather comes out of the north," but the Revised Version (British and American) translates more literally, "Out of the north cometh golden splendor." "As one that taketh off a garment in cold weather (or literally, "on a cold day"),...so is he that singeth songs to a heavy heart" (<a onClick="return mV(\'Pro\',25,20);">Pr 25:20</a>).<P>Jesus rebukes the Pharisees for their lack of spiritual foresight when they took such interest in natural foresight. He said, "When it is evening, ye say, It will be fair weather: for the heaven is red. And in the morning, It will be foul weather to-day: for the heaven is red and lowering" (<a onClick="return mV(\'Mat\',16,2,3);">Mt 16:2,3</a>). The general conditions of the weather in the different seasons are less variable in Palestine than in colder countries, but the precise weather for a given day is very hard to predict on account of the proximity of the mountains, the desert and the sea.``85';
isbe[9165]='Weaving`we\'-ving: Although weaving was one of the most important and best developed of the crafts of Bible times, yet we have but few Biblical references to enlighten us as to the processes used in those early days. A knowledge of the technique of weaving is necessary, however, if we are to understand some of the Biblical incidents. The principle of weaving in all ages is illustrated by the process of darning. The hole to be darned is laid over with parallel threads which correspond to the "warp" (shethi) of a woven fabric. Then, by means of a darning needle which takes the place of the shuttle in the loom, other threads are interlaced back and forth at right angles to the first set of strands. This second set corresponds to the woof (\'erebh) or weft of woven cloth. The result is a web of threads across the hole. If the warp threads, instead of being attached to the edges of a fabric, are fastened to two beams which can be stretched either on a frame or on the ground, and the woof is interlaced exactly as in darning, the result will be a web of cloth. The process is then called weaving (\'aragh), and the apparatus a loom. The most up-to-date loom of our modern mills differs from the above only in the devices for accelerating the process. The first of these improvements dates back some 5,000 years to the early Egyptians, who discovered what is technically known as shedding, i.e. dividing the warp into two sets of threads, every other thread being lifted so that the woof can run between, as is shown in the diagram of the Arabic loom.of considerable means (<a onClick="return mV(\'Mar\',1,19,20);">Mr 1:19,20</a>; <a onClick="return mV(\'Jhn\',19,27);">Joh 19:27</a>).<P>The looms are still commonly used among the Bedouins. Supppose only eight threads are used for an illustration. In reality the eight strands are made by passing one continuous thread back and forth between the two poles which are held apart by stakes driven into the ground. The even strands run through loops of string attached to a rod, and from there under a beam to the pole. By placing the ends upon stones, or by suspending it on loops, the even threads are raised above the odd threads, thus forming a shed through which the weft can be passed. The separating of odds and evens is assisted by a flat board of wedge-shaped cross-section, which is turned at right angles to the odd threads. After the shuttle has been passed across, this same stick is used to beat up the weft.<P>The threads are removed from the stones or loops, and allowed to lie loosely on the warp; it is pulled forward toward the weaver and raised on the stones in the position previously occupied by it. The flat spreader is passed through the new shed in which the odd threads are now above and the even threads below. The weft is run through and is beaten into place with the thin edge of it. The shuttle commonly used is a straight tree branch on which the thread is loosely wound "kite-string" fashion.<P>The loom used by Delilah was no doubt like the one described above (<a onClick="return mV(\'Jdg\',16,13,14);">Jud 16:13,14</a>). It would have been an easy matter for her to run in Samson\'s locks as strands of the weft while he lay sleeping on the ground near the loom adjacent to rod under the beam. The passage might be transposed thus: "And he said unto her, If thou weavest the seven locks of my head into the web. And she passed in his locks and beat them up with the batten (yathedh), and said unto him, The Philistines are upon thee, Samson. And he awakened out of his sleep and as he jumped up he pulled away the pins of the loom."<P>The counterpart of the Bedouin loom is shown on the ancient tombs at Beni Chasan (see EB, 5279,or Wilkinson, I, 317). As Dr. Kennedy points out, the artist of that ancient picture has unwittingly reversed the order of the beams. The shedding beam, of the two, should be nearer the weaver. At what period the crude shedding device described above was replaced by a double set of loops worked by pedals is unknown. Some writers believe that the Jews were acquainted with it. The "flying shuttle" of the modern loom is probably a comparatively recent invention.<P>The products of the Bedouin looms are coarse in texture. Such passages as <a onClick="return mV(\'Exd\',35,35);">Ex 35:35</a>; <a onClick="return mV(\'Isa\',19,9);">Isa 19:9</a>, and examples of ancient weaving, lead us to believe that in Bible times contemporaneous with the primitive loom were more highly developed machines, just as in the cities of Egypt and Palestine today, alongside of the crude Bedouin loom, are found the more intricate hand looms on which are produced the most delicate fabrics possible to the weaver\'s article. Examples of cloth comparing favorably with our best grades of muslin have been found among the Egyptian mummy wrappings.<P>Two other forms of looms have been used for weaving, in both of which the warp is upright. In one type the strands of the warp, singly or in bundles, are suspended from a beam and held taut by numerous small weights made of stones or pottery. Dr. Bliss found at Tel el-Chesy collections of weights, sometimes 60 or more together, individual examples of which showed marks where cords had been attached to them. These he assumed were weavers\' weights (see A Mound of Many Cities). In this form the weaving was necessarily from top to bottom.<P>The second type of upright loom is still used in some parts of Syria, especially for weaving coarse goat\'s hair cloth. In this form the warp is attached to the lower beam and passes vertically upward over another beam and thence to a wall where it is gathered in a rope and tied to a peg, or it is held taut by heavy stone weights. The manipulation is much the same as in the primitive loom, except that the weft is beaten up with an iron comb. The web is wound up on the lower beam as it is woven (compare <a onClick="return mV(\'Isa\',38,12);">Isa 38:12</a>).<P>Patterns are woven into the web<P>(1) by making the warp threads of different colors,<P>(2) by alternating colors in the weft,<P>(3) by a combination of (1) and (2); this produces checked work (shibbets, <a onClick="return mV(\'Exd\',28,39);">Ex 28:39</a> the Revised Version (British and American));<P>(4) by running special weft threads through only a portion of the warp. This requires much skill and is probably the kind of weaving referred to in <a onClick="return mV(\'Exd\',26,1);">Ex 26:1</a>ff; <a onClick="return mV(\'Eze\',16,13);">Eze 16:13</a>; <a onClick="return mV(\'Eze\',27,16);">27:16</a>;<P>(5) when metals are to be woven, they are rolled thin, cut into narrow strips, wound in spirals about threads of cotton or linen (compare <a onClick="return mV(\'Exd\',28,5);">Ex 28:5</a>ff; <a onClick="return mV(\'Exd\',39,3);">39:3</a>ff). In all these kinds of weaving the Syrian weavers of today are very skillful. If a cylindrical web is referred to in <a onClick="return mV(\'Jhn\',19,23);">Joh 19:23</a>, then Jesus\' tunic must have been woven with two sets of warp threads on an upright loom so arranged that the weft could be passed first through one shed and then around to the other side and back through the shed of the second set.<P>Goliath\'s spear was compared in thickness to that of the weaver\'s beam, i.e. 2 inches to 2 1/2 inches in diameter (<a onClick="return mV(\'1Sa\',17,7);">1Sa 17:7</a>; <a onClick="return mV(\'2Sa\',21,19);">2Sa 21:19</a>; <a onClick="return mV(\'1Ch\',11,23);">1Ch 11:23</a>; <a onClick="return mV(\'1Ch\',20,5);">20:5</a>).<P>In <a onClick="return mV(\'Job\',7,6);">Job 7:6</a>, if "shuttle" is the right rendering for \'eregh, the reference is to the rapidity with which the thread of the shuttle is used up, as the second part of the verse indicates.<P>For a very full discussion of the terms employed see A. R. S. Kennedy in EB, IV, 5276-90.``133';

isbe[9168]='Wedge, of Gold`wej, (lashon zahabh, literally, "tongue of gold"): A piece of gold in the form of a wedge found by Achan in the sack of Jericho. It was in one of the forms in which gold was used for money and was probably stamped or marked to indicate its weight, which was 50 shekels, i.e. one maneh, according to the Hebrew standard, or nearly two pounds troy. Its value would be 102 British pounds 10 shillings or $510.00 (in 1915). See <a href="./study/isbe/search.html?string=MONEY">MONEY</a>; <a href="./study/isbe/search.html?string=POUND">POUND</a>. A wedge, or rather, oblong rectangular strip of gold, of similar weight has been found in the excavations of Gezer (Macalister, Bible Side-Lights, 121). Along with metal rings they were doubtless used as an early form of currency. In <a onClick="return mV(\'Isa\',13,12);">Isa 13:12</a> the King James Version, kethem, "pure gold" (so the Revised Version (British and American)), is translated as "golden wedge" on insufficient grounds.``138';
isbe[9169]='Weeds`wedz (cuph, "a weed" (<a onClick="return mV(\'Jon\',2,5);">Jon 2:5</a>)).`<a href="./study/isbe/search.html?string=FLAG">FLAG</a>; <a href="./study/isbe/search.html?string=COCKLE">COCKLE</a>; <a href="./study/isbe/search.html?string=RED+SEA">RED SEA</a>`1';
isbe[9170]='Week`wek (shebhua\', from shebha\', "seven"; sabbaton-ta, "from sabbath to sabbath"): The seven-day division of time common to the Hebrews and Babylonians (<a onClick="return mV(\'Gen\',29,27,28);">Ge 29:27,28</a>; <a onClick="return mV(\'Luk\',18,12);">Lu 18:12</a>). See <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>; <a href="./study/isbe/search.html?string=TIME">TIME</a>. "Week" is used in the apocalyptic writings of Daniel for an unknown, prophetic period (<a onClick="return mV(\'Dan\',9,\'24-27\');">Da 9:24-27</a>). For the names of the days see <a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY, 12</a>.``1';

isbe[9174]='Weight`wat (Measure of quantity) mishqal, (mishqol (<a onClick="return mV(\'Eze\',4,10);">Eze 4:10</a>), from shaqkal, "to weigh" \'ebhen, "a stone" used for weighing in the balance): Weights were commonly of stone or bronze (or of lead, <a onClick="return mV(\'Zec\',5,7,8);">Zec 5:7,8</a>). They were of various forms, such as the lion-shaped weights of Babylonia and Assyria, or in the form of birds and other animals. The Hebrew and Phoenician weights, when made of stone, were barrel-shaped or spindle-shaped, but in bronze they were often cubical or octagonal or with numerous faces (see illustration under <a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>). Hemispherical or dome-shaped stone weights have been found in Palestine (PEFS, 1902, p. 344; 1903, p. 117; 1904, p. 209).<P>Figurative: The phrase "without weight" (<a onClick="return mV(\'2Ki\',25,16);">2Ki 25:16</a>) signifies a quantity too great to be estimated. "Weight of glory" (<a onClick="return mV(\'2Cr\',4,17);">2Co 4:17</a>, baros) has a similar meaning, but with a spiritual reference. "Weighty," "weightier" (<a onClick="return mV(\'Mat\',23,23);">Mt 23:23</a>; <a onClick="return mV(\'2Cr\',10,10);">2Co 10:10</a>, barus, baruteros), signify what is important. The Greek (ogkos) (<a onClick="return mV(\'Hbr\',12,1);">Heb 12:1</a>), is used in the sense of burden, hindrance, as is also the Hebrew netel (<a onClick="return mV(\'Pro\',27,3);">Pr 27:3</a>).``138';
isbe[9175]='Weights And Measures`wats me\'-zhur:The system of weights and measures in use among the Hebrews was derived from Babylonia and Egypt, especially from the former. The influence of these countries upon Palestine has long been recognized, but archaeological investigations in recent years have shown that the civilization of Babylonia impressed itself upon Syria and Palestine more profoundly in early times than did that of Egypt. The evidence of this has been most clearly shown by the discovery of the Tell el-Amarna Letters, which reveal the fact that the official correspondence between the Egyptian kings and their vassals in these lands was carried on in the language of Babylonia long after its political influence had been supplanted by that of Egypt. It is natural, then, that we should look to Babylonia for the origin of such important elements of civilization as a system of weights and measures.<P>1. Linear Measures:<P>It was quite natural that men should have found a standard for linear measures in the parts of the human body, and we find the cubit, originally the length of the forearm, taken as the standard, and the span, the palm and the digit, or finger-breadth, associated with it in linear measurement. They do not seem to have employed the foot, though it is represented in the two-thirds of the cubit, which was used by the Babylonians in the manufacture of building-brick.<P>This system, though adequate enough for man in the earliest times, was not so for an advanced stage of civilization, such as the Babylonians reached before the days of Abraham, and we find that they had introduced a far more accurate and scientific system (see <a href="./study/isbe/search.html?string=CUBIT">CUBIT</a>). They seem to have employed, however, two cubits, of different lengths, one for commercial purposes and one for building. We have no undoubted examples of either, but judging by the dimensions of their square building-bricks, which are regarded as being two-thirds of a cubit on a side, we judge the latter to have been of about 19 or 20 inches. Now we learn from investigations in Egypt that a similar cubit was employed there, being of from 20.6 to 20.77 inches, and it can hardly be doubted that the Hebrews were familiar with this cubit, but that in more common use was certainly shorter. We have no certain means of determining the length of the ordinary cubit among the Hebrews, but there are two ways by which we may approximate its value. The Siloam Inscription states that the tunnel in which it was found was 1,200 cubits long. The actual length has been found to be about 1,707 feet, which would give a cubit of about 17.1 in. (see PEFS, 1902, 179). Of course the given length may be a round number, but it gives a close approximation.<P>Again, the Mishna states that the height of a man <span class="noTag">is</span> 4 cubits, which we may thus regard as the average stature of a Jew in former times. By reference to Jewish tombs we find that they were of a length to give a cubit of something over 17 inches, supposing the stature to be as above, which approximates very closely to the cubit of the Siloam tunnel. The consensus of opinion at the present day inclines toward a cubit of 17.6 inches for commercial purposes and one of about 20 inches for building. This custom of having two standards is illustrated by the practice in Syria today, where the builder\'s measure, or dra\', is about 2 inches longer than the commercial.<P>Of multiples of the cubit we have the measuring-reed of 6 long cubits, which consisted of a cubit and a hand-breadth each (<a onClick="return mV(\'Eze\',40,5);">Eze 40:5</a>), or about 10 feet. Another measure was the Sabbath day\'s journey, which was reckoned at 2,000 cubits, or about 1,000 yards. The measuring-line was used also, but whether it had a fixed length we do not know.<P>See <a href="./study/isbe/search.html?string=SABBATH+DAY\'S+JOURNEY">SABBATH DAY\'S JOURNEY</a>; <a href="./study/isbe/search.html?string=MEASURING+LINE">MEASURING LINE</a>.<P>In the New Testament we have the fathom (orguia), about 6 feet, and the furlong (stadion), 600 Greek feet or 606 3/4 English feet, which is somewhat less than one-eighth of a mile. The mile (milion) was 5,000 Roman feet, or 4,854 English feet, somewhat less than the English mile.<P>2. Measures of Capacity:<P>Regarding the absolute value of the measures of capacity among the Hebrews there is rather more uncertainty than there is concerning those of length and weight, since no examples of the former have come down to us; but their relative value is known. Sir Charles Warren considers them to have been derived from the measures of length by cubing the cubit and its divisions, as also in the case of weight. We learn from <a onClick="return mV(\'Eze\',45,11);">Eze 45:11</a> that the bath and ephah were equivalent, and he (Warren) estimates the capacity of these as that of 1/30 of the cubit cubed, or about 2,333.3 cubic inches, which would correspond to about 9 gallons English measure. Assuming this as the standard, we get the following tables for liquid and dry measure: Ce\'ah and lethekh, in the above, occur in the Hebrew text, but only in the margin of the English. It will be noticed that the prevailing element in these tables is the duodecimal which corresponds to the sexagesimal of the Babylonian system, but it will be seen that in the case of weights there was a tendency on the part of the Hebrews to employ the decimal system, making the maneh 50 shekels instead of 60, and the talent 3,000 instead of 3,600, of the Babylonian, so here we see the same tendency in making the \'omer the tenth of the \'ephah and the \'ephah the tenth of the chomer or kor.<P>3. Weights:<P>Weights were probably based by the ancients upon grains of wheat or barley, but the Egyptians and Babylonians early adopted a more scientific method. Sir Charles Warren thinks that they took the cubes of the measures of length and ascertained how many grains of barley corresponded to the quantity of water these cubes would contain. Thus, he infers that the Egyptians fixed the weight of a cubic inch of rain water at 220 grains, and the Babylonians at 222 2/9. Taking the cubic palm at 25,928 cubic inches, the weight of that quantity of water would be 5,760 ancient grains. The talent he regards as the weight of 2/3 of a cubit cubed, which would be equal to 101,6 cubic palms, but assumes that for convenience it was taken at 100, the weight being 576,000 grains, deriving from this the maneh (1/60 of the talent) of 9,600 grains, and a shekel (1/50 of the maneh) 192 grains. But we have evidence that the Hebrew shekel differed from this and that they used different shekels at different periods. The shekel derived from Babylonia had a double standard: the light of 160 grains, or 1/3600 of the talent; and the heavy of just double this, of 320 grains. The former seems to have been used before the captivity and the latter after. The Babylonian system was sexagesimal, i.e. 60 shekels went to the maneh and 60 manehs to the talent, but the Hebrews reckoned only 50 shekels to the maneh, as appears from <a onClick="return mV(\'Exd\',38,25,26);">Ex 38:25,26</a>, where it is stated that the amount of silver collected from 603,550 males was 100 talents and 1,775 shekels, and, as each contributed a half-shekel, the whole amount must have been 301,775. Deducting the 1,775 shekels mentioned besides the 100 talents, we have 300,000 or 3,000 to the talent, and, as there were 60 manehs in the talent, there were 50 shekels to each maneh. When the Hebrews adopted this system we do not know, but it was in vogue at a very early date.<P>The shekel was divided into gerahs, 20 to a shekel (<a onClick="return mV(\'Exd\',30,13);">Ex 30:13</a>). The gerah (gerah) is supposed to be some kind of seed, perhaps a bean or some such plant. The shekel of which it formed a part was probably the royal or commercial shekel of 160 grains, derived from Babylon. But the Hebrews certainly had another shekel, called the Phoenician from its being the standard of the Phoenician traders. This would be natural on account of the close connection of the two peoples ever since the days of David and Solomon, but we have certain evidence of it from the extant examples of the monetary shekels of the Jews, which are of this standard, or very nearly so, allowing some loss from abrasion. The Phoenician shekel was about 224 grains, varying somewhat in different localities, and the Jewish shekels now in existence vary from 212 to 220 grains. They were coined after the captivity (see <a href="./study/isbe/search.html?string=COINS">COINS</A>), but whether this standard was in use before we have no means of knowing.<P>Examples of ancient weights have been discovered in Palestine by archaeological research during recent years, among them one from Samaria, obtained by Dr. Chaplin, bearing the inscription, in Hebrew rebha\' netseph. This is interpreted, by the help of the cognate Arabic, as meaning "quarter-half," i.e. of a shekel. The actual weight <span class="noTag">is</span> 39.2 grains, which, allowing a slight loss, would correspond quite closely to a quarter-shekel of the light Babylonian standard of 160 grains, or the quarter of the half of the double standard. Another specimen discovered at Tell Zakariyeh weighs 154 grains, which would seem to belong to the same standard. The weights, of which illustrations are given in the table, are all in the collection of the Syrian Protestant College, at Beirut, and were obtained from Palestine and Phoenicia and are of the Phoenician standard, which was the common commercial standard of Palestine. The largest, of the spindle or barrel type, weighs 1,350 grains, or 87.46 grams, evidently intended for a 6-shekel weight, and the smaller ones of the same type are fractions of the Phoenician shekel. They were of the same standard, one a shekel and the other a two-shekel weight. They each have 12 faces, and the smaller has a lion stamped on each face save one, reminding us of the lion-weights discovered in Assyria and Babylonia. The spindle weights are of black stone, the others of bronze.<P>The above is the Phoenician standard. In the Babylonian the shekel would be 160 or 320 grains; the maneh 8,000 or 16,000, and the talent 480,000 or 960,000 grains, according as it was of the light or heavy standard.``138';
isbe[9176]='Well`(1) (be\'er; compare Arabic bi\'r, "well" or "cistern"; usually artificial: "And Isaac\'s servants digged (dug) in the valley, and found there a well of springing (margin "living") water" (<a onClick="return mV(\'Gen\',26,19);">Ge 26:19</a>); some times covered: "Jacob...rolled the stone from the well\'s mouth" (<a onClick="return mV(\'Gen\',29,10);">Ge 29:10</a>). Be\'er may also be a pit: "The vale of Siddim was full of slime pits" (<a onClick="return mV(\'Gen\',14,10);">Ge 14:10</a>); "the pit of destruction" (<a onClick="return mV(\'Psa\',55,23);">Ps 55:23</a>).<P>(2) (bor), usually "pit": "Let us slay him, and cast him into one of the pits" (<a onClick="return mV(\'Gen\',37,20);">Ge 37:20</a>); may be "well": "drew water out of the well of Beth-lehem" (<a onClick="return mV(\'2Sa\',23,16);">2Sa 23:16</a>).<P>(3) (pege), usually "running water," "fount," or "source": "Doth the fountain send forth from the same opening sweet water and bitter?" (<a onClick="return mV(\'Jam\',3,11);">Jas 3:11</a>); may be "well"; compare "Jacob\'s well" (<a onClick="return mV(\'Jhn\',4,6);">Joh 4:6</a>).<P>(4) (phrear), usually "pit": "the pit of the abyss" (<a onClick="return mV(\'Rev\',9,1);">Re 9:1</a>); but "well"; compare "Jacob\'s well" (<a onClick="return mV(\'Jhn\',4,11,12);">Joh 4:11,12</a>): "Which of you shall have an ass or an ox fallen into a well" (the King James Version "pit") (<a onClick="return mV(\'Luk\',14,5);">Lu 14:5</a>).<P>(5) (krene), "wells" (Sirach 48:17), Latin, fons, "spring" (2Esdras 2:32).<P>(6) ayin), compare Arabic \'ain "fountain," "spring": "the fountain (English Versions of the Bible) which is in Jezreel" (<a onClick="return mV(\'1Sa\',29,1);">1Sa 29:1</a>); "In Elim were twelve springs (the King James Version "fountains") of water" (<a onClick="return mV(\'Num\',33,9);">Nu 33:9</a>); "She (Rebekah) went down to the fountain" (the King James Version "well") (<a onClick="return mV(\'Gen\',24,16);">Ge 24:16</a>); "the jackal\'s well" (the English Revised Version "the dragon\'s well," the King James Version "the dragon well") (<a onClick="return mV(\'Neh\',2,13);">Ne 2:13</a>).<P>(7) (ma\'yan), same root as (6); "the fountain (the King James Version "well") of the waters of Nephtoah" (<a onClick="return mV(\'Jos\',18,15);">Jos 18:15</a>); "Passing through the valley of Weeping (the King James Version "Baca") they make it a place of springs" (the King James Version "well") (<a onClick="return mV(\'Psa\',84,6);">Ps 84:6</a>); "Ye shall draw water out of the wells of salvation" (<a onClick="return mV(\'Isa\',12,3);">Isa 12:3</a>).<P>(8) (maqor), usually figurative: "With thee is the fountain of life" (<a onClick="return mV(\'Psa\',36,9);">Ps 36:9</a>); "The mouth of the righteous is a fountain (the King James Version "well") of life" (<a onClick="return mV(\'Pro\',10,11);">Pr 10:11</a>); "make her (Babylon\'s) fountain (the King James Version "spring") dry" (<a onClick="return mV(\'Jer\',51,36);">Jer 51:36</a>); "a corrupted spring" (<a onClick="return mV(\'Pro\',25,26);">Pr 25:26</a>).<P>(9) (mabbu\'), (nabha\', "to flow," "spring," "bubble up"; compare Arabic (nab\', manba\', yanbu\') "fountain": "or the pitcher is broken at the fountain" (<a onClick="return mV(\'Ecc\',12,6);">Ec 12:6</a>); "the thirsty ground springs of water" (<a onClick="return mV(\'Isa\',35,7);">Isa 35:7</a>).<P>(10) (motsa\')," spring," (yatsa\')," to go out," "the dry land springs of water" (<a onClick="return mV(\'Isa\',41,18);">Isa 41:18</a>); "a dry land into watersprings" (<a onClick="return mV(\'Psa\',107,35);">Ps 107:35</a>); "the upper spring of the waters of Gihon" (<a onClick="return mV(\'2Ch\',32,30);">2Ch 32:30</a>).<P>(11) (nebhekh), root uncertain, reading doubtful; only in <a onClick="return mV(\'Job\',38,16);">Job 38:16</a>, "Hast thou entered into the springs of the sea?"<P>(12) (tehom), "deep," "abyss"; compare <a onClick="return mV(\'Gen\',1,2);">Ge 1:2</a>; translated "springs," the King James Version "depths" (<a onClick="return mV(\'Deu\',8,7);">De 8:7</a>).<P>(13) (gal), (galal), "to roll"; compare Gilgal (<a onClick="return mV(\'Jos\',5,9);">Jos 5:9</a>); "a spring shut up" (<a onClick="return mV(\'Sgs\',4,12);">So 4:12</a>).<P>(14) (gullah), "bowl," "basin," "pool," same root: "Give me also springs of water. And he gave her the upper sprigs and the nether springs" (<a onClick="return mV(\'Jos\',15,19);">Jos 15:19</a>); compare Arabic (kullat), pronounced gullat, "a marble," "a cannon-ball."<P>As is clear from references cited above, wells and springs were not sharply distinguished in name, though be\'er, and phrear are used mainly of wells, and \'ayin, ma\'yan, motsa\', mabbua\' and (poetically) maqor are chiefly used of fountains. The Arabic bi\'r, the equivalent of the Hebrew be\'er, usually denotes a cistern for rain-water, though it may be qualified as bi\'r jam\', "well of gathering," i.e. for rain-water, or as bi\'r nab\', "well of springing water." A spring or natural fountain is called in Arabic \'ain or nab\' (compare Hebrew \'ayin and mabbua\'). These Arabic and Hebrew words for "well" and "spring" figure largely in place-names, modern and ancient: Beer (<a onClick="return mV(\'Num\',21,16);">Nu 21:16</a>); Beer-elim (<a onClick="return mV(\'Isa\',15,8);">Isa 15:8</a>), etc.; \'Ain<P>(a) on the northeast boundary of Palestine (<a onClick="return mV(\'Num\',34,11);">Nu 34:11</a>),<P>(b) in the south of Judah, perhaps = En-rimmon (<a onClick="return mV(\'Jos\',15,32);">Jos 15:32</a>); Enaim (<a onClick="return mV(\'Gen\',38,14);">Ge 38:14</a>); Enam (<a onClick="return mV(\'Jos\',15,34);">Jos 15:34</a>), etc.<P>Modern Arabic names with \'ain are very numerous, e.g. \'Ainul-fashkhah, \'Ain-ul-chajleh, \'Ain-karim, etc.`<a href="./study/isbe/search.html?string=CISTERN">CISTERN</a>; <a href="./study/isbe/search.html?string=FOUNTAIN">FOUNTAIN</a>; <a href="./study/isbe/search.html?string=PIT">PIT</a>; <a href="./study/isbe/search.html?string=POOL">POOL</a>`37';
isbe[9177]='Well, Jacob\'s``<a href="./study/isbe/search.html?string=JACOB\'s+well">JACOB\'S WELL</a>`1';
isbe[9178]='Wellspring`wel\'-spring (maqor): Usually "spring" or "fountain" (figuratively), translated "wellspring" only in two passages: "Understanding is a wellspring of life unto him that hath it" (<a onClick="return mV(\'Pro\',16,22);">Pr 16:22</a>); "The wellspring of wisdom is as a flowing brook" (<a onClick="return mV(\'Pro\',18,4);">Pr 18:4</a>). See Burroughs, Pepacton, p. 35; <a href="./study/isbe/search.html?string=WELL">WELL</A>.``1';
isbe[9179]='Wen`Only in <a onClick="return mV(\'Lev\',22,22);">Le 22:22</a>, "maimed" or "having a wen (margin "sores"), or scurvy," for (yabbal), "running," hence, "a suppurating sore" (compare the Revised Version margin). A "wen" is a non-inflamed indolent tumor, and so "wen" is about as far as possible from the meaning of the Hebrew.``1';
isbe[9180]='Wench`wench, wensh (shiphchah): The word "wench" is found only in <a onClick="return mV(\'2Sa\',17,17);">2Sa 17:17</a> the King James Version, where the Revised Version (British and American) has "maid-servant." The Hebrew word shiphchah here used is a common term for maid-servant, female slave. the King James Version used the word "wench" to convey the meaning maid-servant, which was a common use of the word at that time, but it is now practically obsolete.``1';
isbe[9181]='West`(1) Usually (yam), "sea" because the Mediterranean lies to the west of Palestine; not usually in figurative expressions; but compare <a onClick="return mV(\'Hsa\',11,10);">Ho 11:10</a>.<P>(2) Often (ma\'arabh); compare Arabic (gharb), and (maghrib), "west" (maghrib-ush-shems), or simply (maghrib), "sunset."<P>(3) (mebho\' ha-chemesh), "entrance of the sun," (mabho\', bo\')," to come in." (Just as mizrach, is the rising of the sun, or east, so mabho\' (or ma\'arabh], is the setting of the sun, or west: "From the rising of the sun (mizrach-shemesh) unto the going down (mabho) thereof" (<a onClick="return mV(\'Psa\',50,1);">Ps 50:1</a>; compare <a onClick="return mV(\'Psa\',113,3);">113:3</a>; <a onClick="return mV(\'Mal\',1,11);">Mal 1:11</a>).)<P>(4) (dusme, from duo), "to enter," "sink," "set." The Greek usage is parallel to the Hebrew just cited: "Many shall come from the east anatole, "rising") and the west" (dusme, "setting") (<a onClick="return mV(\'Mat\',8,11);">Mt 8:11</a>).<P>The chief figurative use of the word "west" is in combination with "east" to denote great or infinite distance, as:<P class="in15">"As far as the east is from the west,<br>So far hath he removed our transgressions from us" <br>(<a onClick="return mV(\'Psa\',103,12);">Ps 103:12</a>).``37';
isbe[9182]='Whale`hwal:<P>(1) ketos (Sirach 43:25 (the Revised Version (British and American) "sea-monster"); The Song of Three Children verse 57 (the Revised Version (British and American) "whale"); <a onClick="return mV(\'Mat\',12,40);">Mt 12:40</a> (the Revised Version (British and American) "whale," margin "sea-monster"; the King James Version "whale" throughout)).<P>(2) tannin (<a onClick="return mV(\'Gen\',1,21);">Ge 1:21</a>; <a onClick="return mV(\'Job\',7,12);">Job 7:12</a>), "sea-monster," the King James Version "whale."<P>(3) tannim (<a onClick="return mV(\'Eze\',32,2);">Eze 32:2</a>), "monster," the English Revised Version "dragon" the King James Version "whale" the King James Version margin "dragon."<P>It will be seen from the above references that the word "whale" does not occur in the Revised Version (British and American) except in The Song of Three Children verse 57 and <a onClick="return mV(\'Mat\',12,40);">Mt 12:40</a>. Ketos, the original word in these passages, is, according to Liddell and Scott, used by Aristotle for "whale," Aristotle using also the adjective ketodes, "cetacean"; Homer and Herodotus used ketos for any large fish or sea-monster or for a seal. It is used in Euripides of the monster to which Andromeda was exposed. In the Hebrew, in the Book of Jonah, we find dagh or daghah, the ordinary word for "fish": "And Yahweh prepared great fish to swallow up Jonah" (<a onClick="return mV(\'Jon\',1,17);">Jon 1:17</a>). Whales are found in the Mediterranean and are sometimes cast up on the shore of Palestine, but it is not likely that the ancient Greeks or Hebrews were very familiar with them, and it is by no means certain that whale is referred to, either in the original Jonah story or in the New Testament reference to it. If any particular animal is meant, it is more likely a shark. Sharks are much more familiar objects in the Mediterranean than whales, and some of them are of large size.<P>See <a href="./study/isbe/search.html?string=FISH">FISH</A>.<P>In <a onClick="return mV(\'Gen\',1,21);">Ge 1:21</a>, "And God created the great seamonsters" (the King James Version, "whales"), and <a onClick="return mV(\'Job\',7,12);">Job 7:12</a>,<P class="in15">"Am I a sea, or a sea-monster (the King James Version "whale"),<br>That thou settest a watch over me?"<P>The Hebrew has tannin, which word occurs 14 times in the Old Testament and in the American Standard Revised Version is translated "monster," "sea-monster," or "serpent," and, exceptionally, in <a onClick="return mV(\'Lam\',4,3);">La 4:3</a>, "jackals." the King James Version renders in several passages "dragon" (compare <a onClick="return mV(\'Eze\',29,3);">Eze 29:3</a> the English Revised Version).<P>Tannim in <a onClick="return mV(\'Eze\',29,3);">Eze 29:3</a> and <a onClick="return mV(\'Eze\',32,2);">32:2</A> is believed to stand for tannin. the American Standard Revised Version has "monster," the English Revised Version "dragon," the King James Version "whale," the King James Version margin "dragon," in <a onClick="return mV(\'Eze\',32,2);">Eze 32:2</a>, and "dragon" in <a onClick="return mV(\'Eze\',29,3);">29:3</a>. Tannim occurs in 11 other passages, where it is considered to be the plural of tan, and in the Revised Version (British and American) is translated "jackals," in the King James Version "dragons" (<a onClick="return mV(\'Job\',30,29);">Job 30:29</a>; <a onClick="return mV(\'Psa\',44,19);">Ps 44:19</a>; <a onClick="return mV(\'Isa\',13,22);">Isa 13:22</a>; <a onClick="return mV(\'Isa\',34,13);">34:13</a>; <a onClick="return mV(\'Isa\',35,7);">35:7</a>; <a onClick="return mV(\'Isa\',43,20);">43:20</a>; <a onClick="return mV(\'Jer\',9,11);">Jer 9:11</a>; <a onClick="return mV(\'Jer\',10,22);">10:22</a>; <a onClick="return mV(\'Jer\',14,6);">14:6</a>; <a onClick="return mV(\'Jer\',49,33);">49:33</a>; <a onClick="return mV(\'Jer\',51,37);">51:37</a>). In <a onClick="return mV(\'Mal\',1,3);">Mal 1:3</a> we find the feminine plural tannoth.`<a href="./study/isbe/search.html?string=DRAGON">DRAGON</a>; <a href="./study/isbe/search.html?string=JACKAL">JACKAL</a>`37';
isbe[9183]='Wheat`hwet<P>(1) chittah, the specific word for wheat (<a onClick="return mV(\'Gen\',30,14);">Ge 30:14</a>; <a onClick="return mV(\'Exd\',34,22);">Ex 34:22</a>, etc.), with puros (Judith 3:3; Sirach 39:26);<P>(2) bar, or bar (<a onClick="return mV(\'Jer\',23,28);">Jer 23:28</a>; <a onClick="return mV(\'Joe\',2,24);">Joe 2:24</a>; <a onClick="return mV(\'Amo\',5,11);">Am 5:11</a>; <a onClick="return mV(\'Amo\',8,6);">8:6</a>); in other passages translated "grain" or "corn";<P>(3) sitos (<a onClick="return mV(\'Mat\',3,12);">Mt 3:12</a>; <a onClick="return mV(\'Mat\',13,25,29,30);">13:25,29,30</a>; <a onClick="return mV(\'Luk\',3,17);">Lu 3:17</a>; <a onClick="return mV(\'Luk\',16,7);">16:7</a>; <a onClick="return mV(\'Luk\',22,31);">22:31</a>, etc.) (for other words translated occasionally "wheat" in the King James Version see <a href="./study/isbe/search.html?string=CORN">CORN</A>; <a href="./study/isbe/search.html?string=FOOD">FOOD</a>)): Wheat, usually the bearded variety, is cultivated all over Palestine, though less so than barley. The great plain of the Hauran is a vast expanse of wheat fields in the spring; considerable quantities are exported via Beirut, Haifa, and Gaza. The "wheat harvest" was in olden times one of the regular divisions of the year (<a onClick="return mV(\'Exd\',34,22);">Ex 34:22</a>; <a onClick="return mV(\'Jdg\',15,1);">Jud 15:1</a>; <a onClick="return mV(\'1Sa\',12,17);">1Sa 12:17</a>); it follows the barley harvest (<a onClick="return mV(\'Exd\',9,31,32);">Ex 9:31,32</a>), occurring in April, May or June, according to the altitude.``117';
isbe[9184]='Wheel`hwel:<P>(1) \'ophan, is the usual word (<a onClick="return mV(\'Exd\',14,25);">Ex 14:25</a>, etc.). In <a onClick="return mV(\'Pro\',20,26);">Pr 20:26</a>; <a onClick="return mV(\'Isa\',28,27);">Isa 28:27</a> the rollers of a threshing wagon are meant (see <a href="./study/isbe/search.html?string=AGRICULTURE">AGRICULTURE</a>).<P>(2) galgal, "rolling thing," generally in the sense of "wheel" (<a onClick="return mV(\'Isa\',5,28);">Isa 5:28</a>, etc.), but the Revised Version (British and American) in <a onClick="return mV(\'Eze\',10,2,6,13);">Eze 10:2,6,13</a> has "whirling wheels," an advantageous change. The "wheel...broken at the cistern" in <a onClick="return mV(\'Ecc\',12,6);">Ec 12:6</a> is the windlass for drawing the water, and by the figure the breakdown of the old man\'s breathing apparatus is probably meant. In <a onClick="return mV(\'Psa\',83,13);">Ps 83:13</a>, the King James Version has "wheel," but this translation (that of the Septuagint) is quite impossible; the Revised Version (British and American) "whirling dust" (sucked up by a miniature whirlwind) is perhaps right, but the translations proposed are end-less.<P>(3) gilgal, <a onClick="return mV(\'Isa\',28,28);">Isa 28:28</a>, the roller of a threshing wagon.<P>(4) \'obhnayim, <a onClick="return mV(\'Jer\',18,3);">Jer 18:3</a>. See <a href="./study/isbe/search.html?string=POTTER">POTTER</a>.<P>(5) pa\'am, <a onClick="return mV(\'Jdg\',5,28);">Jud 5:28</a>, literally, "step" (so the Revised Version margin), and the sound of horses\' hoofs is intended.<P>(6) trochos, Sirach 33:5; <a onClick="return mV(\'Jam\',3,6);">Jas 3:6</a> (the King James Version "course"). In the former passage, "The heart of a fool is as a cart-wheel," the changeableness of a light disposition is satirized. In James the figure is of a wheel in rotation, so that a flame starting at any point is quickly communicated to the whole. Just so an apparently insignificant sin of the tongue produces an incalculably destructive effect.<P>The phrase "wheel of nature" (trochos tes geneseos) is used here for "the world in progress." It is not a very natural figure and has given rise to much discussion. the King James Version accents trochos ("course") instead of trochos ("wheel"). but the language throughout is metaphorical and "course" is not a sufficiently metaphorical word. The translation "birth" for geneseos (so the Revised Version margin). i.e. "a wheel set in motion by birth." is out of the question. as the argument turns on results wider than any individual\'s existence. "Wheel of nature" is certainly right. But a comparison of life to a wheel in some sense or other (chiefly that of "Fortune\'s wheel") is common enough in Greek and Latin writers, and, indeed the exact combination trochos geneseos is found in at least one (Orphic) writer (full references in the commentaries of Mayor and W. Bauer). It would seem, then, that James had heard the phrase, and he used it as a striking figure, with entire indifference to any technical significance it might have. This supposition is preferable to that of an awkward translation from the Aramaic.`<a href="./study/isbe/search.html?string=COURSE">COURSE</a>`48';
isbe[9185]='Whelp`hwelp (gur, or gor; either absol. (<a onClick="return mV(\'Eze\',19,2,3,5);">Eze 19:2,3,5</a>; <a onClick="return mV(\'Nah\',2,12);">Nah 2:12</a>); or constr. with \'aryeh, "lion" (<a onClick="return mV(\'Gen\',49,9);">Ge 49:9</a>; <a onClick="return mV(\'Deu\',33,22);">De 33:22</a>; <a onClick="return mV(\'Jer\',51,38);">Jer 51:38</a>; <a onClick="return mV(\'Nah\',2,11);">Na 2:11</a>); also benelabhi\', literally, "sons of a lioness," translated "the whelps of the lioness" (<a onClick="return mV(\'Job\',4,11);">Job 4:11</a>). In <a onClick="return mV(\'Job\',28,8);">Job 28:8</a>, the King James Version has "lion\'s whelps" for bene shachats, which the Revised Version (British and American) renders "proud beasts," margin "sons of pride." In <a onClick="return mV(\'Lam\',4,3);">La 4:3</a> gur is used of the young of tannin the Revised Version (British and American) "jackal," the King James Version "sea-monsters," the King James Version margin "sea-calves"; it may possibly mean "wolves"; skumnos, the technical word for "lion\'s whelp" (1Macc 3:4)): These references are all figurative: "Judah is a lion\'s whelp" (<a onClick="return mV(\'Gen\',49,9);">Ge 49:9</a>); "Dan is a lion\'s whelp" (<a onClick="return mV(\'Deu\',33,22);">De 33:22</a>); it is said of the Babylonians, "They shall roar together like young lions; they shall growl as lions\' whelps" (<a onClick="return mV(\'Jer\',51,38);">Jer 51:38</a>); of the Assyrians, "Where is the den of the lions, and the feeding-place of the young lions, where the lion and the lioness walked, the lion\'s whelp, and none made them afraid? The lion did tear in pieces enough for his whelps, and strangled for his lionesses, and filled his caves with prey, and his dens with ravin" (<a onClick="return mV(\'Nah\',2,11,12);">Na 2:11,12</a>). In <a onClick="return mV(\'Eze\',19,\'2-9\');">Eze 19:2-9</a>, the princes of Israel are compared to lions\' whelps.`<a href="./study/isbe/search.html?string=DRAGON">DRAGON</a>; <a href="./study/isbe/search.html?string=LION">LION</a>`37';
isbe[9186]='Whirlwind`hwurl\'-wind (cuphah (<a onClick="return mV(\'Pro\',1,27);">Pr 1:27</a>; <a onClick="return mV(\'Pro\',10,25);">10:25</a>; <a onClick="return mV(\'Isa\',5,28);">Isa 5:28</a>; <a onClick="return mV(\'Isa\',17,13);">17:13</a>; <a onClick="return mV(\'Isa\',66,15);">66:15</a>; <a onClick="return mV(\'Hsa\',8,7);">Ho 8:7</a>; <a onClick="return mV(\'Amo\',1,14);">Am 1:14</a>; <a onClick="return mV(\'Nah\',1,3);">Nah 1:3</a>), ca\'ar (<a onClick="return mV(\'Hab\',3,14);">Hab 3:14</a>; <a onClick="return mV(\'Zec\',7,14);">Zec 7:14</a>; <a onClick="return mV(\'Hsa\',13,3);">Ho 13:3</a>; <a onClick="return mV(\'Psa\',58,9);">Ps 58:9</a>; <a onClick="return mV(\'Dan\',11,40);">Da 11:40</a>), ce\'arah (<a onClick="return mV(\'2Ki\',2,1);">2Ki 2:1</a>; <a onClick="return mV(\'Job\',38,1);">Job 38:1</a>; <a onClick="return mV(\'Job\',40,6);">40:6</a>; <a onClick="return mV(\'Isa\',40,24);">Isa 40:24</a>; <a onClick="return mV(\'Isa\',41,16);">41:16</a>; <a onClick="return mV(\'Zec\',9,14);">Zec 9:14</a>)): When two currents from opposite directions meet, a circular motion results called a whirlwind. On the sea this takes up small particles of water from the sea and condenses some of the moisture in the clouds above, forming a great funnel-shaped column. They are quite common off the coast of Syria. Considerable damage might be done to a small ship overtaken by them. In the desert sand is taken up in the same way, causing terrible sandstorms which are greatly dreaded by caravans. Most of the references in the Bible do not necessarily imply a circular motion, and the word "tempest" might be used in translation.<P>Storms usually come from the southwest. "Out of the...south cometh the storm" (<a onClick="return mV(\'Job\',37,9);">Job 37:9</a>); yet in Ezekiel\'s vision he saw a whirlwind coming out of the north (<a onClick="return mV(\'Eze\',1,4);">Eze 1:4</a>). Elijah "went up by a whirlwind into heaven" (<a onClick="return mV(\'2Ki\',2,11);">2Ki 2:11</a>). The whirlwind indicates the power and might of Yahweh: "Yahweh hath his way in the whirlwind and in the storm" (<a onClick="return mV(\'Nah\',1,3);">Na 1:3</a>); He "answered Job out of the whirlwind" (<a onClick="return mV(\'Job\',38,1);">Job 38:1</a>).<P>Most of the Scriptural uses are figurative; of destruction: "He will take them away with a whirlwind" (<a onClick="return mV(\'Psa\',58,9);">Ps 58:9</a>; <a onClick="return mV(\'Pro\',1,27);">Pr 1:27</a>; <a onClick="return mV(\'Pro\',10,25);">10:25</a>; <a onClick="return mV(\'Hsa\',13,3);">Ho 13:3</a>; <a onClick="return mV(\'Dan\',11,40);">Da 11:40</a>; <a onClick="return mV(\'Amo\',1,14);">Am 1:14</a>; <a onClick="return mV(\'Hab\',3,14);">Hab 3:14</a>; <a onClick="return mV(\'Zec\',7,14);">Zec 7:14</a>); of quickness: "wheels as a whirlwind" (<a onClick="return mV(\'Isa\',5,28);">Isa 5:28</a>; <a onClick="return mV(\'Isa\',66,15);">66:15</a>; <a onClick="return mV(\'Jer\',4,13);">Jer 4:13</a>); of the anger of God: "A whirlwind of the Lord is gone forth in fury" (<a onClick="return mV(\'Jer\',23,19);">Jer 23:19</a> the King James Version); of punishment to the wicked: "A continuing whirlwind...shall fall...on the wicked" (<a onClick="return mV(\'Jer\',30,23);">Jer 30:23</a> the King James Version).``85';
