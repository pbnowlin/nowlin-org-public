 spring migration of the quail (<a onClick="return mV(\'Num\',11,31);">Nu 11:31</a>) "from the sea"—as they had done in the preceding year (<a onClick="return mV(\'Exd\',16,13);">Ex 16:13</a>) farther west—they were already about 20 miles on their road, at Kibroth-hattaavah, or "the graves of lust."<P>2. Site of Kadesh-barnea:<P>(1) In order to follow their journey it is necessary to fix the site of Kadesh-barnea to which they were going, and there has been a good deal of confusion as to this city since, in 1844, John Rowlands discovered the site of the western Kadesh, at \'Ain Qadis in the northern part of the Tih. Robinson pointed out (BR, II, 194, note 3) that this site could not possibly be right for Kadesh-barnea; and, though it was accepted by Professor Palmer, who visited the vicinity in January, 1870, and has been advocated by Henry Clay Trumbull (Kadesh-barnea, 1884), the identification makes hopeless chaos of the Old Testament topography. The site of \'Ain Qadis is no doubt that of the Kadesh of Hagar (see <a href="./study/isbe/search.html?string=SHUR">SHUR</A>), and a tradition of her presence survives among the Arabs, probably derived from one of the early hermits, since a small hermitage was found by Palmer in the vicinity (Survey of Western Palestine, Special Papers, 1881, 19). But this spring is not said to have been at the "city" of Kadesh-barnea, which is clearly placed at the southeast corner of the land of Israel (<a onClick="return mV(\'Jos\',15,3);">Jos 15:3</a>), while, in the same chapter (<a onClick="return mV(\'Jos\',15,23);">Jos 15:23</a>), another site called Kedesh is mentioned, with Adadah (\'Ada\'deh 7 miles southeast of Arad) and Hazor (at Jebel Chadireh); this Kedesh may very well have been at the western Kadesh.<P>(2) Kadesh-barnea is noticed in 10 passages of the Old Testament, and in 16 other verses is called Kadesh only. The name probably means "the holy place of the desert of wandering," and—as we shall see—the wanderings of Israel were confined to the \'Arabah. The place is described as "a city in the uttermost...border" of Edom (<a onClick="return mV(\'Num\',20,16);">Nu 20:16</a>), Edom being the "red land" of Mt. Seir, so called from its red sandstones, as contrasted with the white Tih limestone. It is also very clearly placed (<a onClick="return mV(\'Num\',34,3,4);">Nu 34:3,4</a>) south of the Dead Sea (compare <a onClick="return mV(\'Jos\',15,3);">Jos 15:3</a>), while Ezekiel also (47:19) gives it as the southeastern limit of the land, opposed to Tamar (Tamrah near Gaza) as the southeastern border town. A constant tradition, among Jews and Christians alike, identifies Kadesh-barnea with Petra, and this as early as the time of Josephus, who says that Aaron died on a mountain near Petra (Ant., IV, iv, 7), and that the old name of Petra was Arekem (vii, 1). The Targum of Onkelos (on <a onClick="return mV(\'Num\',34,4);">Nu 34:4</a>) renders Kadesh-barnea by "Rekem of the G\'aia" and this name—meaning "many-colored"—was due to the many-colored rocks near Petra, while the g\'aia or "outcry" is probably that of Israel at Meribah-kadesh (<a onClick="return mV(\'Num\',27,14);">Nu 27:14</a>), and may have some connection with the name of the village el-Jii, at Petra, which is now called Wady Musa ("the valley of Moses") by the Arabs, who have a tradition that the gorge leading to Petra was cloven by the rod of Moses when he struck the rock at the "waters of strife" (<a onClick="return mV(\'Num\',27,14);">Nu 27:14</a>), forming the present stream which represents that of "Meribah of Kadesh." Eusebius also (in Onomasticon under the word "Barne") connects Kadesh with Petra, and this traditional site so fully answers the requirements of the journey in question that it may be accepted as one of the best-fixed points on the route, especially as the position of Hazeroth agrees with this conclusion. Hazeroth (<a onClick="return mV(\'Num\',11,35);">Nu 11:35</a>; <a onClick="return mV(\'Num\',12,16);">12:16</a>; <a onClick="return mV(\'Num\',33,17);">33:17</a>; <a onClick="return mV(\'Deu\',1,1);">De 1:1</a>) means "enclosures," and the name survives at \'Ain Chadrah ("spring of the enclosure") about 30 miles northeast of Mt. Sinai on the way to the \'Arabah. It was the 3rd camp from Sinai, the 1st being Taberah (<a onClick="return mV(\'Num\',11,3);">Nu 11:3</a>) and the 2nd Kibroth-hattaavah (<a onClick="return mV(\'Num\',11,35);">Nu 11:35</a>), giving a daily march of 10 miles.<P>See <a href="./study/isbe/search.html?string=KADESH-BARNEA">KADESH-BARNEA</a>.<P>3. The Route: Hazeroth to Moseroth:<P>After passing Hazeroth (<a onClick="return mV(\'Num\',12,16);">Nu 12:16</a>; <a onClick="return mV(\'Num\',13,3);">13:3</a>) the journey appears to have been leisurely, and Israel probably camped for some time in the best pastures of the \'Arabah. For the spies were sent from Paran near Hazeroth to explore the route to Kadesh, and to examine the "south country" through which Israel hoped to enter Palestine (<a onClick="return mV(\'Num\',13,17,21);">Nu 13:17,21</a>). They explored this district (<a onClick="return mV(\'Num\',13,21);">Nu 13:21</a>; <a onClick="return mV(\'Num\',32,8);">32:8</a>) from "the wilderness of Zin," or otherwise "from Kadesh-barnea," on the east, to Rehob—probably Rehoboth (now er-Ruheibeh)—on the west; and—having been absent 40 days (<a onClick="return mV(\'Num\',13,25);">Nu 13:25</a>)—after visiting Hebron (<a onClick="return mV(\'Num\',13,22);">Nu 13:22</a>) they returned by the direct route leading south of Arad (Tell \'Arad) to Petra, which road is called (<a onClick="return mV(\'Num\',21,1);">Nu 21:1</a>) the "way of the spies." On their return, in the season of "first-ripe grapes" (<a onClick="return mV(\'Num\',13,20);">Nu 13:20</a>), they found Israel at Kadesh (<a onClick="return mV(\'Num\',13,26);">Nu 13:26</a>). No place north of Hebron is mentioned in the account of their explorations, and it is difficult to suppose that, in 40 days, they could have reached the Syrian city of Hamath, which is some 350 miles north of Petra, and have returned thence. The definition of Rehob (mentioned before Hebron) as being \'on the coming to Hamath\' (<a onClick="return mV(\'Num\',13,21);">Nu 13:21</a>) is best explained as a scribe\'s error, due to an indistinct manuscript, the original reading being chalatseth, and referring to the classical Elussa (now Khalasah) which lies 10 miles north of Rehoboth on the main road to Beersheba and Hebron. Israel left Sinai in the spring, after the Passover, and was near Hazeroth in the time of the quail migration. Hazeroth possesses the only perennial supply of water in the region, from its vicinity the spies set forth in August.<P>4. The Camps between Hazeroth and Moseroth:<P>Most of the sites along this route are unknown, and their position can only be gathered from the meaning of the names; but the 6th station from Hazeroth was at Mt. Shepher (<a onClick="return mV(\'Num\',33,23);">Nu 33:23</a>), and may have left its name corrupted into Tell el-\'Acfar (or \'Asfar), the Hebrew meaning "the shining hill," and the Arabic either the same or else "the yellow." This site <span class="noTag">is</span> 60 miles from Hazeroth, giving a daily march of 10 miles. As regards the other stations, Rithmah means "broomy," referring to the white desert broom; Rimmon-perez was a "cloven height," and Libnab a "white" chalky place; Rissah means "dewy," and Kehelathah, "gathering." From Mt. Shepher the distance to the vicinity of Mt. Hor is about 55 miles, and seven stations are named, giving an average march of 8 miles. The names are Haradah (<a onClick="return mV(\'Num\',33,24);">Nu 33:24</a>), "fearful," referring to a mountain; Makheloth, "gatherings"; Tahath—probably "below"—marking the descent into the \'Arabah; Terah, "delay," referring to rest in the better pastures; Mithkah, "sweetness" of pasture or of water; Hashmonah, "fatness"; and Moseroth; probably meaning "the boundaries," near Mt. Hor. These names, though now lost, agree well with a journey through a rugged region of white limestone and yellow sandstone, followed by a descent into the pastoral valley of the \'Arabah. The distances also are all probable for flocks.<P>IV. The Thirty-eight Years.<P>1. The History:<P>From the time of their first arrival at Kadesh-barnea, in the autumn of the 2nd year, to the day that the Hebrews crossed the brook Zered in Moab on their final march, is said to have been a period of 38 years (<a onClick="return mV(\'Deu\',2,14);">De 2:14</a>), during which the first generation died out, and a strong race of desert warriors succeeded it. During this period Israel lived in the nomadic state, like modern Arabs who change camp according to the season within well-defined limits, visiting the higher pastures in summer, and wintering in the lower lands. On their first arrival near Kadesh-barnea, they were discouraged by the report of the spies, and rebelled; but when they were ordered to turn south "by the way of the Red Sea" or Gulf of \'Aqabah, they made an unsuccessful attempt to enter Palestine by the way of the spies (<a onClick="return mV(\'Num\',14,\'25-45\');">Nu 14:25-45</a>). They were discomfited by Amalekites at Hormah ("cutting off"), which place is otherwise called Zephath (<a onClick="return mV(\'Jdg\',1,17);">Jud 1:17</a>). Here also they were again defeated by the king of Arad (<a onClick="return mV(\'Num\',21,1,3);">Nu 21:1,3</a>) in the early autumn of the 40th year of wandering. This site may well be placed at the ascent now called Nuqb es-Cufah ("the pass of Zephath"), which preserves the Hebrew name, 45 miles northwest of Mt. Hor, on the main road from Hebron to Petra. The route is well watered, and \'Ain Yemen is a spring at the foot of this ascent leading to the higher terrace of the Tih. Arad lies north of the road, and its Canaanite king no doubt marched south some 40 miles, to defend the top of the ascent down which the Amalekites had driven the first generation of Hebrews, who returned to the Kadesh-barnea camp.<P>2. The Camps Visited:<P>We are not left without any notice of the stations which Israel visited, and no doubt revisited annually, during the 38 years of nomadic life. We have in fact three passages which appear to define the limits of their wanderings.<P>(1) In the first of these (<a onClick="return mV(\'Num\',33,\'31-36\');">Nu 33:31-36</a>) we find that they left Moseroth, near Mt. Hor, the site of which latter has always been shown—since the time of Josephus at least—at the remarkable mountain west of Petra, now called Jebel Haran ("Aaron\'s Mountain"); thence they proceeded to the wells of the Bene-jaakan, to Hor-haggidgad, and to Jotbathah. Hor-haggidgad (or Gudgodah, <a onClick="return mV(\'Deu\',10,7);">De 10:7</a>) signifies apparently the "hill of thunder," and the word is not in any way connected with the name of Wady Ghadaghid ("the valley of failing waters"), applying to a ravine west of the \'Arabah; for the Hebrew and Arabic words have not a letter in common. The site of Jotbathah, which was in "a land of brooks of waters" (<a onClick="return mV(\'Deu\',10,7);">De 10:7</a>), is, on the other hand, pretty clearly to be fixed at \'Ain et-Tabah ("the good spring"), 28 miles north of \'Aqabah, and about 40 along the road from Mt. Hor. This spring, near a palm grove, feeds the winter lake of et-Tabah to its west in the \'Arabah. The next station was Abronah ("the crossing"), and if this refers to crossing the \'Arabah to the western slopes, we are naturally brought—on the return journey—to Ezion-geber, at \'Ain-ghudian (the usual identification), which springs from the western slopes of the Tih on the side of the lake opposite to Jotbathah. Thence the migrants gradually returned to Kadesh.<P>(2) The second passage (<a onClick="return mV(\'Deu\',10,6,7);">De 10:6,7</a>). is one of many geographical notes added to the narrative of the wanderings, and gives the names in a different order—Wells of the Bene-jaakan, Moserah, Gudgodah, and Jotbathah—but this has little importance, as the camps, during 38 years, would often be at these springs.<P>(3) The third passage is in the preface to Deuteronomy (<a onClick="return mV(\'Deu\',1,1,2);">1:1,2</a>), which enumerates the various places where Moses spoke to Israel at various times after leaving Sinai. These include the region east of Jordan, the wilderness, the \'Arabah, "over against Suph," with all the district between Paran and Tophel (now Tufileh, on the southern border of Moab), as well as Laban (probably the Libnah of <a onClick="return mV(\'Num\',33,20);">Nu 33:20</a>), Hazeroth, and Dizahab which may be Dhahab on the seashore east of Sinai. This list, with the valuable notes added showing that Kadesh-barnea was 11 days from Horeb in the direction of Mt. Seir, refers to speeches down to the last days of Moses\' life. The wanderings of the 38 years do not include the march through Edom and Moab; and, though it is of course possible that they may have extended to Hazeroth and Sinai, it seems more probable that they were confined to the \'Arabah between Petra and Jotbathah. Elath (now \'Aqabah), on the eastern shore at the head of the gulfs, is not mentioned; for the raised beach south of the Lake of Jotbathah would not give pasture. In summer the camps would be on the western slopes of the valley, where grass might be found in April; and the annual migrations were thus within the limits of some 500 square miles, which is about the area now occupied by a strong tribe among Arabs.<P>V. The Final Journey.<P>1. The Route:<P>In the 1st month of the 40th year (<a onClick="return mV(\'Num\',20,1);">Nu 20:1</a>) Israel was at Kadesh in the desert of Zin, where Miriam was buried. They were troubled once more by want of water, till Moses smote the rock of Meribah ("strife"). They were commanded to keep peace with their relatives of Edom and Moab, whose lands were not attacked by the Hebrews till the time of Saul, and of David and his successors. They camped on the border of Kadesh, desiring to reach the main road to Moab through the city; and, when this was refused by the king of Edom, they withdrew a few miles west to Mt. Hor. Here Aaron was buried, and was mourned for 30 days (<a onClick="return mV(\'Num\',20,29);">Nu 20:29</a>), after which the 2nd attempt to reach Hebron by the main road (<a onClick="return mV(\'Num\',21,1);">Nu 21:1</a>) was also repulsed. Since, on this occasion, Israel remained "many days" in Kadesh (<a onClick="return mV(\'Deu\',1,46);">De 1:46</a>) and left it less than 38 years after they first reached it in autumn, it would seem that they may have started in August, and have taken about a month to reach the brook Zered; but only five stations are noticed (<a onClick="return mV(\'Num\',21,\'10-12\');">Nu 21:10-12</a>; <a onClick="return mV(\'Num\',33,\'41-44\');">33:41-44</a>) on the way. They are not said—in any passage—to have gone to Elath, but they turned "from mount Hor by the way to the Red Sea, to compass the land of Edom" (<a onClick="return mV(\'Num\',21,4);">Nu 21:4</a>), or, as otherwise stated (<a onClick="return mV(\'Deu\',2,8);">De 2:8</a>), they went "from the way of the Arabah" on the road which led "from Elath and from Ezion-geber"; and thus, starting on the "way to the Red Sea," they "compassed mount Seir many days," turning "northward" by the "way of the wilderness of Moab" (<a onClick="return mV(\'Deu\',2,1,8);">De 2:1,8</a>) after passing through the coast of Edom (<a onClick="return mV(\'Deu\',2,4);">De 2:4</a>).<P>2. The Five Stations to the Border of Moab:<P>If the list of five stations is complete, we may suppose that they left the \'Arabah road not many miles south of Petra, striking east by an existing road leading to Ma\'an, and thus gaining the high plateau above Petra to the east, and reaching the present Chaj route. This view is confirmed by the notice of Punon as the 2nd camp, if we accept the statement of Eusebius (Onomasticon, under the word "Phinon"); for he appears to have known it as an Edomite village north of Petra, in the desert, where convicts were employed digging copper. The name, however, has not been recovered. The preceding camp at Zalmonah suggests some "gloomy" valley leading up to the Edomite plateau. North of Punon, the 3rd camp was at Oboth ("water bags"), and the 4th was at Iyim or Iye-abarim ("the ruins" or "the ruins of the crossings"), the site of which is pretty certainly at \'Aimeh, a few miles north of Tophel. The total distance thus seems to have been about 60 miles for four marches, or 15 miles a day. Iyim was "in the border of Moab" (<a onClick="return mV(\'Num\',33,44);">Nu 33:44</a>) and in the desert facing Moab, in the east (<a onClick="return mV(\'Num\',21,11);">Nu 21:11</a>).<P>3. From Iyim to Arnon:<P>Here therefore Israel left Edom; and between Iyim and the river Arnon, in a distance of about 32 miles, only one station is mentioned, being at the valley of Zered (<a onClick="return mV(\'Num\',21,12);">Nu 21:12</a>; <a onClick="return mV(\'Deu\',2,13,14);">De 2:13,14</a>). This has usually been placed at Wady el-Chesy ("the pebbly valley"), which flows into the Dead Sea, having its head near Iyim; but this is evidently too far south, and it is no doubt the great gorge at Kerak that is intended, having its head close to the Chaj road, halfway from Iyim to Arnon, giving a daily march of 16 miles. The traditional identification of the Arnon with Wady Mojib is rendered certain by the positions of Diban (Dhiban) and Aroer (\'Ar\'air) close by. It was the border of the Amorites, who had driven the Moabites south of this river (<a onClick="return mV(\'Num\',21,13);">Nu 21:13</a>; <a onClick="return mV(\'Deu\',2,36);">De 2:36</a>), depriving them of their best lands which stretched to Heshbon. These Amorites were apparently recent intruders who, with the Hittites (see <a href="./study/isbe/search.html?string=HITTITES">HITTITES</a>), had invaded Damascus and Bashan from Northern Syria, and who no doubt had thus brought the fame of Balaam from Pethor (<a onClick="return mV(\'Num\',22,5);">Nu 22:5</a>), on the Euphrates near Carchemish.<P>4. The Message to Sihon:<P>The Hebrews were now a strong people fit for war, and Moses sent messengers from the "wilderness of Kedemoth" (<a onClick="return mV(\'Deu\',2,26);">De 2:26</a>) to Sihon in Heshbon, demanding a peaceful passage through his lands, such as had been accomplished through Edom and Moab. Kedemoth ("the Eastern Lands") was evidently the desert of Moab.<P>It was objected, by Colenso, to the narrative of the Pentateuch that, since Israel only reached the brook Zered in autumn of the 40th year, only six months are left for the conquest of Northern Moab, Gilead and Bashan. But it must be remembered that the Hebrews left all their impedimenta in the "plains of Moab" (<a onClick="return mV(\'Num\',22,1);">Nu 22:1</a>) opposite Jericho at Shittim, so that the advance of their army in Gilead and Bashan was unimpeded. The Assyrians, in later times, covered in a season much longer distances than are attributed to Hebrew conquerors, and the six months leave quite enough time for the two missions sent from Moab (<a onClick="return mV(\'Num\',22,\'5-36\');">Nu 22:5-36</a>) to fetch Balaam.<P>See <a href="./study/isbe/search.html?string=NUMBERS,+BOOK+OF">NUMBERS, BOOK OF</A>.<P>5. From the Arnon to Shittim:<P>(1) It is notable that, for the march from the Arnon to Shittim, we have two lists of stations. That which is said to have been written down by Moses himself (<a onClick="return mV(\'Num\',33,\'45-49\');">Nu 33:45-49</a>) mentions only four stations in a distance of about 25 miles—namely Dibon-gad, Almon-diblathaim, Nebo and the plains of Moab, where the camps were placed at various waters from Beth-jeshimoth (Sueimeh) on the northeastern shore of the Dead Sea to Abelshittim ("the Meadow of Acacias"), now called the Ghor es-Seiseban, or "Valley of Acacias." In this area of 50 square miles there were four running streams, besides springs, and excellent pasture for flocks. This therefore was the headquarters of the nation during the Amorite war.<P>(2) In the 2nd list (<a onClick="return mV(\'Num\',21,\'13-20\');">Nu 21:13-20</a>) we read of a still more gradual and cautious advance in the Amorite lands, and this may represent the march of the main body following the men of war. Leaving the Arnon, they reached "a well" (Beer), probably near Dibon, this being one of those shallow water pits which the Arabs still scoop out in the valleys when the water runs below the surface. Between Arnon and Pisgah (or Nebo) no less than five stations are noticed in about 20 miles, namely Beer, Mattanah ("the gift"), Nahaliel ("the valley of God"), Bamoth (or Bamoth-Baal (<a onClick="return mV(\'Num\',22,41);">Nu 22:41</a>), "the monuments of Baal"), and Pisgah (Jebel Neba). Of these only the last is certainly known, but the central station at Nahaliel may be placed at the great gorge of the Zerqa Ma\'ain, the road from Dibon to Nebo crossing its head near Beth-meon. There was plenty of water in this vicinity. The last stage of Israel\'s march thus seems to represent a program of only about 4 miles a day, covered by the more rapid advance of the fighting men; and no doubt the women, children and flocks were not allowed to proceed at all until, at least, Sihon had been driven from Heshbon (<a onClick="return mV(\'Num\',21,\'21-25\');">Nu 21:21-25</a>).<P>6. Review:<P>We have thus considered every march made by the Hebrews, from Egypt to Shittim, by the light of actual knowledge of their route. We have found no case in which the stations are too far apart for the passage of their beasts, and no discrepancies between any of the accounts when carefully considered. If, as some critical writers think, the story of the spies and the list of camps said to have been written down by Moses are to be attributed to a Hebrew priest writing in Babylonia, we cannot but wonder how he came to be so accurately informed as to the topography of the wilderness, its various regions, its water-supply and its natural products. It does not seem necessary to suppose a "double source," because, in the spring of two successive years, the manna is noticed, and Israel is recorded as having eaten the quail flying (as now) by night to the Jordan valley from Africa. The march was not continuous, and plenty of time is left, by the recorded dates, for the resting of the flocks at such waters as those of Elim, Rephidim and Hazeroth. The wanderings of the 38 years represent a nomadic life in the best pastures of the region, in and near the \'Arabah. Here the new race grew up—hardy as the Arabs of today. When they left Egypt the Pharaoh still had a firm hold on the "way of the Philistines," and the Canaanites owned his sway. But 40 years later Egypt was defeated by the Amorites, and the forces of the Pharaoh were withdrawn from Jerusalem after suffering defeat in Bashan (see Tell el-Amarna Letters, number 64, British Museum, where no less than nine known places near Ashteroth and Edrei are noticed); general chaos then resulted in Southern Palestine, when the \'Abiri (or Hebrews) appeared from Seir, and "destroyed all the rulers" (see <a href="./study/isbe/search.html?string=EXODUS">EXODUS</A>). This then, was the historic opportunity for the defeat of the Amorites, and for Joshua\'s conquest of the Promised Land.``28';
isbe[9127]='War, Man of`(\'ish milchamah):<P>"Yahweh is a man of war:<P>Yahweh is his name" (<a onClick="return mV(\'Exd\',15,3);">Ex 15:3</a>).<P>In early Israel the character of Yahweh as the war-God forms a prominent feature in the conception of God (<a onClick="return mV(\'Num\',10,35);">Nu 10:35</a>; <a onClick="return mV(\'Num\',21,14);">21:14</a>; <a onClick="return mV(\'Jos\',5,13);">Jos 5:13</a>; <a onClick="return mV(\'Jos\',10,11);">10:11</a>; <a onClick="return mV(\'Jdg\',5,4,13,20,23,31);">Jud 5:4,13,20,23,31</a>, etc.).`<a href="./study/isbe/search.html?string=GOD,+NAMES+OF">GOD, NAMES OF</a>; <a href="./study/isbe/search.html?string=LORD+OF+HOSTS">LORD OF HOSTS</a>`1';
isbe[9128]='War; Warfare`wor, wor\'-far (milchamah, \'anshe m., "men of war," "soldiers"; polemos, polemein, strateuesthai, stratia):<P>1. Religious Significance<P>2. Preliminaries<P>3. Operations of War<P>4. Strategy<P>5. Important Requisites<P>6. Characteristics<P>7. Defeat and Victory<P>8. Spoils and Trophies<P>9. Treaties of Peace<P>10. War in the New Testament<P>LITERATURE<hr /><P>1. Religious Significance:<P>From an early period of Hebrew history war had a religious significance. The Hebrews were the people of Yahweh, and they were reminded in their wars by the priest or priests who accompanied their armies that Yahweh was with them to fight their battles (<a onClick="return mV(\'Deu\',20,\'1-4\');">De 20:1-4</a>). It was customary to open a campaign, or to enter an engagement, with sacrificial rites (<a onClick="return mV(\'1Sa\',7,\'8-10\');">1Sa 7:8-10</a>; <a onClick="return mV(\'1Sa\',13,9);">13:9</a>). Hence, in the Prophets, to "prepare" war is to carry out the initiatory religious rites and therefore to "sanctify" war (<a onClick="return mV(\'Jer\',6,4);">Jer 6:4</a>; <a onClick="return mV(\'Jer\',22,7);">22:7</a>; <a onClick="return mV(\'Jer\',51,27,28);">51:27,28</a>; <a onClick="return mV(\'Mic\',3,5);">Mic 3:5</a>; <a onClick="return mV(\'Joe\',3,9);">Joe 3:9</a>; the Revised Version margin in each case); and Isaiah even speaks of Yahweh mustering His host and summoning to battle His "consecrated ones" (<a onClick="return mV(\'Isa\',13,3);">Isa 13:3</a>), the warriors consecrated by the sacrifices offered before the war actually opened. The religious character attaching to war explains also the taboo which we find associated with it (<a onClick="return mV(\'Deu\',20,7);">De 20:7</a>; <a onClick="return mV(\'Deu\',23,10);">23:10</a>; <a onClick="return mV(\'2Sa\',11,11);">2Sa 11:11</a>).<P>2. Preliminaries:<P>(1) Religious Preliminaries.<P>It was in keeping with this that the oracle should be consulted before a campaign, or an engagement (<a onClick="return mV(\'Jdg\',20,18);">Jud 20:18</a>ff; <a onClick="return mV(\'1Sa\',14,37);">1Sa 14:37</a>; <a onClick="return mV(\'1Sa\',23,2);">23:2</a>; <a onClick="return mV(\'1Sa\',28,6);">28:6</a>; <a onClick="return mV(\'1Sa\',30,8);">30:8</a>). The ark of God was believed to be possessed of special virtue in assuring victory, and, because it was identified in the eyes of the Israelites with the presence of Yahweh, it was taken into battle (<a onClick="return mV(\'1Sa\',4,3);">1Sa 4:3</a>). The people learned, however, by experience to put their trust in Yahweh Himself and not in any outward token of His presence. At the battle of Ebenezer the ark was taken into the fight with disastrous results to Israel (<a onClick="return mV(\'1Sa\',4,4);">1Sa 4:4</a>). On the other hand at the battle of Michmash, the sacred ephod at Saul\'s request accompanied the Israelites into the field, and there was a great discomfiture of the Philistines (<a onClick="return mV(\'1Sa\',14,18);">1Sa 14:18</a>). In the later history prophets were appealed to for guidance before a campaign (<a onClick="return mV(\'1Ki\',22,5);">1Ki 22:5</a>; <a onClick="return mV(\'2Ki\',3,11);">2Ki 3:11</a>), although fanatical members of the order sometimes gave fatal advice, as to Ahab at Ramoth-gilead, and probably to Josiah at Megiddo. Upon occasion the king addressed the host before engaging the enemy (<a onClick="return mV(\'2Ch\',20,\'20-22\');">2Ch 20:20-22</a>, where Jehoshaphat also had singers to go before the army into battle); and Judas Maccabeus did so, with prayer to God, on various occasions (1Macc 3:58; 4:30; 5:32).<P>(2) Military Preliminaries.<P>The call to arms was given by sound of trumpet throughout the land (<a onClick="return mV(\'Jdg\',3,27);">Jud 3:27</a>; <a onClick="return mV(\'Jdg\',6,34);">6:34</a>; <a onClick="return mV(\'1Sa\',13,3);">1Sa 13:3</a>; <a onClick="return mV(\'2Sa\',15,10);">2Sa 15:10</a>; <a onClick="return mV(\'2Sa\',20,1);">20:1</a>; compare <a onClick="return mV(\'Num\',10,2);">Nu 10:2</a>). It was the part of the priests to sound an alarm with the trumpets (<a onClick="return mV(\'2Ch\',13,\'12-16\');">2Ch 13:12-16</a>; compare 1Macc 4:40; 16:8), and the trumpets were to be blown in time of battle to keep God in remembrance of Israel that they might gain the victory. In the Prophets, we find the commencement of war described as the drawing of the sword from its sheath (<a onClick="return mV(\'Eze\',21,3);">Eze 21:3</a>), and the uncovering of the shield (<a onClick="return mV(\'Isa\',22,6);">Isa 22:6</a>). Graphic pictures of the mobilizing of forces, both for invasion and for defense, are found in <a onClick="return mV(\'Isa\',22,\'6-8\');">Isa 22:6-8</a> and <a onClick="return mV(\'Nah\',3,2);">Na 3:2</a> and other Prophets. It was in the springtime that campaigns were usually opened, or resumed after a cessation of hostilities in winter (<a onClick="return mV(\'2Sa\',11,1);">2Sa 11:1</a>; <a onClick="return mV(\'1Ki\',20,22,26);">1Ki 20:22,26</a>).<P>3. Operations of War:<P>Of the actual disposition of troops in battle there are no full accounts till the Maccabean time, but an examination of the Biblical battlefields by modern travelers with knowledge of military history has yielded valuable results in showing the position of the combatants and the progress of the fight (an excellent example in Dr. William Miller\'s Least of All Lands, 85ff, 116ff, 150ff, where the battles of Michmash, Elah and Gilboa are described with plans). With the Israelites the order of battle was simple. The force was drawn up, either in line, or in three divisions, a center and two wings. There was a rearguard (called in the King James Version "rereward," in the Revised Version (British and American) "rearward") to give protection on the march or to bring in stragglers (<a onClick="return mV(\'Jdg\',7,16);">Jud 7:16</a>; <a onClick="return mV(\'1Sa\',11,11);">1Sa 11:11</a>; <a onClick="return mV(\'2Sa\',18,2);">2Sa 18:2</a>; 1Macc 5:33; compare also <a onClick="return mV(\'Num\',10,25);">Nu 10:25</a>; <a onClick="return mV(\'Jos\',6,9);">Jos 6:9</a>; <a onClick="return mV(\'1Sa\',29,2);">1Sa 29:2</a>; <a onClick="return mV(\'Isa\',58,8);">Isa 58:8</a>). The signal for the charge and the retreat was given by sound of trumpet. There was a battle-cry to inspire courage and to impart confidence (<a onClick="return mV(\'Jdg\',7,20);">Jud 7:20</a>; <a onClick="return mV(\'Amo\',1,14);">Am 1:14</a>, etc.). The issue of the battle depended upon the personal courage and endurance of the combatants, fighting man against man, but there were occasions when the decision was left to single combat, as at the battle of Elah between the giant Goliath and the stripling David (<a onClick="return mV(\'1Sa\',17,\'1-\');">1Sa 17</a>). The combat at Gibeon between the men of Benjamin, twelve in number, followers of Ish-bosheth, and twelve of the servants of David, in which each slew his man and all fell together by mutual slaughter, was the prelude to "a very sore battle" in which Abner and the men of Israel were beaten before the servants of David (<a onClick="return mV(\'2Sa\',2,16);">2Sa 2:16</a>).<P>To the minor operations of war belong the raid, such as the Philistines made into the Valley of Rephaim (<a onClick="return mV(\'1Ch\',14,9);">1Ch 14:9</a>), the foray, the object of which was plunder (<a onClick="return mV(\'2Sa\',3,22);">2Sa 3:22</a>), the foraging to secure supplies (<a onClick="return mV(\'2Sa\',23,11);">2Sa 23:11</a> margin), and the movements of bands who captured defenseless inhabitants and sold them as slaves (<a onClick="return mV(\'2Ki\',5,2);">2Ki 5:2</a>).<P>4. Strategy:<P>Of strategical movements in war there was the ambush with liers-in-wait resorted to by Joshua at Ai (<a onClick="return mV(\'Jos\',8,3);">Jos 8:3</a>); the feint, resorted to by the Israelites against the tribe of Benjamin (<a onClick="return mV(\'Jdg\',20,20);">Jud 20:20</a>); the flank movement, adopted by David in the Valley of Rephaim to rout the Philistines (<a onClick="return mV(\'2Sa\',5,22);">2Sa 5:22</a>f); and the surprise, inflicted successfully at the Waters of Merom upon the Canaanites under Jabin by Joshua (<a onClick="return mV(\'Jos\',11,1);">Jos 11:1</a>f). Of all these the story of Judas Maccabeus, the great military leader of the Jewish nation, furnishes illustrations (1Macc 4:5 and elsewhere).<P>5. Important Requisites:<P>Among the requisites for the proper conduct of war the most important was the camp (machaneh). Of the exact configuration of the camp of the Israelites, it is not possible to speak with certainty. The camp of Israel in the wilderness seems to have been quadrilateral, although some have supposed it to be round or triangular (<a onClick="return mV(\'Num\',2,1);">Nu 2:1</a>). The camp in the wilderness was furnished with ensigns and standards—the family ensign (\'oth), and a standard (deghel) for the group of tribes occupying each of the four sides. The standard or banner (nec) is used of the signal for the mustering of troops, but standard-bearer, which occurs only once in the Bible, is a doubtful reading (<a onClick="return mV(\'Isa\',10,18);">Isa 10:18</a>, where the Revised Version margin, "sick man," is rather to be followed). In time of war the camp was surrounded by a barricade, or wagon-rampart (ma\'gal), as at Elah (<a onClick="return mV(\'1Sa\',17,20);">1Sa 17:20</a>); and Saul lay within such a barricade in the wilderness of Ziph with his people round about him when David surprised him and carried off his spear (<a onClick="return mV(\'1Sa\',26,5);">1Sa 26:5</a>). Tents were used for the shelter of troops, at any rate when occupied with a siege (<a onClick="return mV(\'2Ki\',7,7);">2Ki 7:7</a>), although at the siege of Rabbah we read of booths for the purpose (<a onClick="return mV(\'2Sa\',11,11);">2Sa 11:11</a>). Pickets were set to watch the camp, and the watch was changed three times in the course of the night (<a onClick="return mV(\'Jdg\',7,19);">Jud 7:19</a>; 1Macc 12:27). It was usual to leave a guard in charge of the camp when the force went into action or went off upon a raid (<a onClick="return mV(\'1Sa\',25,13);">1Sa 25:13</a>; <a onClick="return mV(\'1Sa\',30,10);">30:10</a>). Careful prescriptions were laid down for the preservation of the purity of the camp, "for Yahweh thy God walketh in the midst of thy camp,...therefore shall thy camp be holy" (<a onClick="return mV(\'Deu\',23,\'9-14\');">De 23:9-14</a>; compare <a onClick="return mV(\'Num\',5,\'1-4\');">Nu 5:1-4</a>). Garrisons (matstsabh) were placed in occupation of fortresses and strategical centers (<a onClick="return mV(\'2Ch\',17,2);">2Ch 17:2</a>). No doubt the caves in the hillsides and rocky fastnesses of the land, as at Michmash, would serve for their reception (<a onClick="return mV(\'1Sa\',13,1);">1Sa 13</a>). The garrisons, however, which are expressly mentioned, were for the most part military posts for the occupation of a subject country—Philistines in Israelite territory (<a onClick="return mV(\'1Sa\',13,23);">1Sa 13:23</a>; <a onClick="return mV(\'1Sa\',14,1,11);">14:1,11</a>), and Israelites in Syrian and Edomite territory (<a onClick="return mV(\'2Sa\',8,6,14);">2Sa 8:6,14</a>).<P>6. Characteristics:<P>Among the characteristic notes of war, the tumult and the shouting were often noticed by the sacred historians (<a onClick="return mV(\'1Sa\',4,6);">1Sa 4:6</a>; <a onClick="return mV(\'1Sa\',14,19);">14:19</a>; <a onClick="return mV(\'2Ki\',7,6);">2Ki 7:6</a>). In the figurative language of the prophets the terrors and horrors and devastation of war are set forth in lurid colors. "The snorting of his horses is heard from Dan," is Jeremiah\'s description of an invading army, "at the sound of the neighing of his strong ones the whole land trembleth" (<a onClick="return mV(\'Jer\',8,16);">Jer 8:16</a>). \'The crack of the whip and the noise of the rumbling wheel and the galloping horse, and the jolting chariot and the rearing horsemen; and the flash of the sword and the glitter of the spear, and the multitude of slain; and a mass of dead bodies and no end to the carcasses\' (<a onClick="return mV(\'Nah\',3,\'2-4\');">Na 3:2-4</a>: J. M. P. Smith\'s translation in ICC). Because of the devastation of territory and the slaughter of men which it entails, the sword is named with famine and "noisome beasts" (the American Standard Revised Version has "evil beasts") and "pestilence" as one of God\'s "four sore judgments" (<a onClick="return mV(\'Eze\',14,21);">Eze 14:21</a>, the King James Version). By a familiar figure "the sword" is often taken for all the operations of war, because it is characteristic of it to devour and to destroy (<a onClick="return mV(\'2Sa\',2,26);">2Sa 2:26</a>; <a onClick="return mV(\'Jer\',2,30);">Jer 2:30</a>).<P>7. Defeat and Victory:<P>While the treatment of the vanquished in the wars of Israel never reached the pitch of savagery common in Assyrian warfare, there are not wanting examples of excessive severity, such as David\'s treatment of his Moabite prisoners (<a onClick="return mV(\'2Sa\',8,2);">2Sa 8:2</a>) and of the Ammonites captured at Rabbah (<a onClick="return mV(\'2Sa\',12,31);">2Sa 12:31</a>), and Menahem\'s barbarous treatment of Tiphsah (<a onClick="return mV(\'2Ki\',15,16);">2Ki 15:16</a>; compare <a onClick="return mV(\'Num\',31,17);">Nu 31:17</a>; <a onClick="return mV(\'Jos\',6,21);">Jos 6:21</a>). That it was common for the Philistines to mutilate and abuse their prisoners is shown by Saul\'s determination not to fall into their hands (<a onClick="return mV(\'1Sa\',31,4);">1Sa 31:4</a>). On that occasion the Philistines not only stripped the slain, but cut off Saul\'s head and fixed his body to the wall of Bethshan (<a onClick="return mV(\'1Sa\',31,9,10);">1Sa 31:9,10</a>). It was usual to carry off prisoners and sell them as slaves (<a onClick="return mV(\'2Ki\',5,2);">2Ki 5:2</a>; 1Macc 3:41). The conquerors were wont to deport the population of the subjugated country (<a onClick="return mV(\'2Ki\',17,6);">2Ki 17:6</a>), to carry off treasure and impose tribute (<a onClick="return mV(\'2Ki\',16,8);">2Ki 16:8</a>), and even to take the gods into captivity (<a onClick="return mV(\'Isa\',46,1);">Isa 46:1</a>). On the other hand, the victors were hailed with acclamations and songs of rejoicing (<a onClick="return mV(\'1Sa\',18,6);">1Sa 18:6</a>), and victory was celebrated with public thanksgivings (<a onClick="return mV(\'Exd\',15,1);">Ex 15:1</a>; <a onClick="return mV(\'Jdg\',5,1);">Jud 5:1</a>; 1Macc 4:24).<P>The spoils of war, spoken of as booty also—armor, clothing, jewelry, money, captives and animals—falling to the victors, were divided equally between those who had taken part in the battle and those who had been left behind in camp (<a onClick="return mV(\'Num\',31,27);">Nu 31:27</a>; <a onClick="return mV(\'Jos\',22,8);">Jos 22:8</a>; <a onClick="return mV(\'1Sa\',30,24);">1Sa 30:24</a>f).<P>8. Spoils and Trophies:<P>A proportion of the spoils was reserved for the Levites, and "a tribute unto the Lord" was also levied before distribution was made of the collected booty (<a onClick="return mV(\'Num\',31,28,30);">Nu 31:28,30</a>). To the Lord, in the Israelite interpretation of war, the spoils truly belong, and we see this exemplified at the capture of Jericho when the silver and the gold and the vessels of brass were put into the treasury of the house of the Lord (<a onClick="return mV(\'Jos\',6,24);">Jos 6:24</a>). Under the monarchy, part of the spoils fell to the king who might in turn dedicate it to the Lord or use it for the purposes of war (<a onClick="return mV(\'2Ki\',14,14);">2Ki 14:14</a>; <a onClick="return mV(\'1Ch\',18,7,11);">1Ch 18:7,11</a>). The armor of the conquered was sometimes dedicated as a trophy of victory and placed in the temple of the heathen or preserved near the ark of God (<a onClick="return mV(\'1Sa\',21,9);">1Sa 21:9</a>; <a onClick="return mV(\'1Sa\',31,9);">31:9</a>).<P>9. Treaties of Peace:<P>As the blast of the war-horn summoned to war, so it intimated the cessation of hostilities (<a onClick="return mV(\'2Sa\',2,28);">2Sa 2:28</a>); and as to draw the sword was the token of the entrance upon a campaign, so to return it to its sheath, or to put it up into the scabbard, was emblematic of the establishment of peace (<a onClick="return mV(\'Jer\',47,6);">Jer 47:6</a>). As ambassadors were sent to summon to war (<a onClick="return mV(\'Jer\',49,14);">Jer 49:14</a>), or to dissuade from war (<a onClick="return mV(\'2Ch\',35,21);">2Ch 35:21</a>), so ambassadors were employed to negotiate peace (<a onClick="return mV(\'Isa\',33,7);">Isa 33:7</a>). Treaties of peace were made on occasion between combatants, as between Ahab and Ben-hadad II after the defeat of the latter and his fortunate escape from the hands of Ahab with his life (<a onClick="return mV(\'1Ki\',20,30,31);">1Ki 20:30,31</a>). By the appeal of Ben-hadad\'s representative to Ahab\'s clemency his life was spared, and in return therefor he granted to Ahab the right to have bazaars for trade in Damascus as his father had had in Samaria (<a onClick="return mV(\'1Ki\',20,34);">1Ki 20:34</a>). Alliances, offensive and defensive, were common, as Ahab and Jehoshaphat against Syria (<a onClick="return mV(\'1Ki\',22,2);">1Ki 22:2</a>), Jehoram and Jehoshaphat and the king of Edom against Moab (<a onClick="return mV(\'2Ki\',3,7);">2Ki 3:7</a>), and the kings of the west, including Ahab and Hadadezer of Damascus, to resist Shalmaneser II of Assyria, who routed the allies at the battle of Qarqar in 854 BC. It is among the wonderful works of Yahweh that He makes war to cease to the end of the earth, that He breaks the bow, and cuts the spear in sunder, and "burneth the chariots in the fire" (<a onClick="return mV(\'Psa\',46,9);">Ps 46:9</a>). And prophetic pictures of the peace of the latter days include the breaking of "the bow and the sword and the battle out of the land" (<a onClick="return mV(\'Hsa\',2,18);">Ho 2:18</a>), the beating of "swords into plowshares, and...spears into pruning-hooks" (<a onClick="return mV(\'Isa\',2,4);">Isa 2:4</a>; <a onClick="return mV(\'Mic\',4,3);">Mic 4:3</a>).<P>10. War in the New Testament:<P>Among the signs of the last days given by our Lord are "wars and rumors of wars" (<a onClick="return mV(\'Mat\',24,6);">Mt 24:6</a>; <a onClick="return mV(\'Mar\',13,7);">Mr 13:7</a>; <a onClick="return mV(\'Luk\',21,9);">Lu 21:9</a>; <a onClick="return mV(\'Luk\',21,24);">21:24</a>). Jesus accepts war as part of the present world-order, and draws from it an impressive illustration of the exacting conditions of Christian discipleship (<a onClick="return mV(\'Luk\',14,31);">Lu 14:31</a>). He foresees how Jerusalem is to be encompassed with armies and devoted to the bitterest extremities of war (<a onClick="return mV(\'Luk\',19,41);">Lu 19:41</a>). He conceives Himself come, not to send peace on earth, but a sword (<a onClick="return mV(\'Mat\',10,34);">Mt 10:34</a>); and declares that they who take the sword shall perish by the sword (<a onClick="return mV(\'Mat\',26,52);">Mt 26:52</a>). The apostles trace war to the selfishness and greed of men (<a onClick="return mV(\'Jam\',4,1);">Jas 4:1</a>); they see, speaking figuratively, in fleshly lusts enemies which war against the soul (<a onClick="return mV(\'1Pe\',2,11);">1Pe 2:11</a>); they find in war apt figures of the spiritual struggle and divine protection and ultimate victory of the Christian (<a onClick="return mV(\'Rom\',7,23);">Ro 7:23</a>; <a onClick="return mV(\'Rom\',8,37);">8:37</a>; <a onClick="return mV(\'2Cr\',10,3,5);">2Co 10:3,5</a>; <a onClick="return mV(\'1Ti\',1,18);">1Ti 1:18</a>; <a onClick="return mV(\'Hbr\',13,13);">Heb 13:13</a>; <a onClick="return mV(\'1Pe\',1,5);">1Pe 1:5</a>), and of the triumphs of Christ Himself (<a onClick="return mV(\'2Cr\',2,14);">2Co 2:14</a>; <a onClick="return mV(\'Col\',2,15);">Col 2:15</a>; <a onClick="return mV(\'Eph\',2,16,17);">Eph 2:16,17</a>). Paul made the acquaintance of the barracks, both at Jerusalem and at Caesarea (<a onClick="return mV(\'Act\',21,34,37);">Ac 21:34,37</a>; <a onClick="return mV(\'Act\',23,35);">23:35</a>); and at Rome his bonds became familiar to the members of the Praetorian guard who were from time to time detailed to have him in keeping (<a onClick="return mV(\'Phl\',1,13);">Php 1:13</a>). It is under the figures of battle and war that John in the Apocalypse conceives the age-long conflict between righteousness and sin, Christ and Satan, and the final triumph of the Lamb, who is King of kings, and Lord of lords (<a onClick="return mV(\'Rev\',16,\'14-16\');">Re 16:14-16</a>; <a onClick="return mV(\'Rev\',17,14);">17:14</a>; <a onClick="return mV(\'Rev\',19,14);">19:14</a>). For other references see <a href="./study/isbe/search.html?string=ARMY">ARMY</A>, 9; <a href="./study/isbe/search.html?string=PRAETORIAN+GUARD">PRAETORIAN GUARD</a>; <a href="./study/isbe/search.html?string=TREATY">TREATY</a>.<P>LITERATURE.<P>Benzinger, article "Kriegswesen" in Herzog, Realencyklopadie fur protestantische Theologie und Kirche(3), XI; Nowack, Hebraische Archaeologie, 72; Browne, Hebrew Antiquities, 44-47.``128';
isbe[9129]='Ward`word: "Ward" and "guard" are two different spellings of the same word, and in consequence no clear line can be drawn between them. English Versions of the Bible, however, has used "guard" only in the sense of "a special body of soldiers" (<a onClick="return mV(\'Gen\',37,36);">Ge 37:36</a>, etc.), while "ward" is used, not only in this sense (<a onClick="return mV(\'Jer\',37,13);">Jer 37:13</a>; contrast 39:9), but also in a variety of others. So a "ward" may mean "any body of men on special duty," as <a onClick="return mV(\'1Ch\',9,23);">1Ch 9:23</a>; the King James Version <a onClick="return mV(\'1Ch\',26,16);">1Ch 26:16</a>; <a onClick="return mV(\'Neh\',12,24,25);">Ne 12:24,25</a> (the Revised Version (British and American) "watch"), or the duty itself, as <a onClick="return mV(\'Isa\',21,8);">Isa 21:8</a>; <a onClick="return mV(\'1Ch\',12,29);">1Ch 12:29</a> the King James Version (the Revised Version (British and American) "allegiance"); <a onClick="return mV(\'1Ch\',25,8);">1Ch 25:8</a>; <a onClick="return mV(\'1Ch\',26,12);">26:12</a> (the Revised Version (British and American) "office," margin "ward"); <a onClick="return mV(\'Neh\',12,45);">Ne 12:45</a>; <a onClick="return mV(\'Neh\',13,30);">13:30</a> (the Revised Version (British and American) "charge"). Or "ward" may mean "guarded place," always in the phrase "put in ward." the Revised Version (British and American) has kept this phrase throughout (<a onClick="return mV(\'Gen\',40,3);">Ge 40:3</a>, etc.), changing it only in <a onClick="return mV(\'Eze\',19,9);">Eze 19:9</a>, where "cage" better carries out the figure of the context.<P>The distinction of the older English between "watch" and "ward," as applying respectively to the night and to the day seems unknown in English Versions of the Bible. Compare <a onClick="return mV(\'Isa\',21,8);">Isa 21:8</a>.<P>The affix "-ward," denoting direction and still used in such forms as "toward," "northward," etc., had a much wider range in Biblical English. So, "to God-ward" (<a onClick="return mV(\'Exd\',18,19);">Ex 18:19</a>; <a onClick="return mV(\'2Cr\',3,4);">2Co 3:4</a>; <a onClick="return mV(\'1Th\',1,8);">1Th 1:8</a>); "to thee-ward" (<a onClick="return mV(\'1Sa\',19,4);">1Sa 19:4</a>); "to us-ward" (<a onClick="return mV(\'Psa\',40,5);">Ps 40:5</a>; <a onClick="return mV(\'Eph\',1,19);">Eph 1:19</a>; <a onClick="return mV(\'2Pe\',3,9);">2Pe 3:9</a> the King James Version); "to you-ward" (<a onClick="return mV(\'2Cr\',1,12);">2Co 1:12</a>; <a onClick="return mV(\'2Cr\',13,3);">13:3</a>; <a onClick="return mV(\'Eph\',3,2);">Eph 3:2</a>; <a onClick="return mV(\'2Pe\',3,9);">2Pe 3:9</a> the Revised Version (British and American)); and in <a onClick="return mV(\'Exd\',37,9);">Ex 37:9</a>, the King James Version "even to the mercy seatward" (the Revised Version (British and American) "toward the mercy-seat").``48';
isbe[9130]='Wares`warz (maqqachah, mekher, mimkar, kin\'ah, ma\'aseh, \'izzabhon, keli):<P>(1) maqqachah, something received or purchased (<a onClick="return mV(\'Neh\',10,31);">Ne 10:31</a>);<P>(2) mekher, "price" or "pay," value, merchandise (<a onClick="return mV(\'Neh\',13,16);">Ne 13:16</a>);<P>(3) mimkar, a "selling," the thing sold (<a onClick="return mV(\'Neh\',13,20);">Ne 13:20</a>);<P>(4) kin\'ah, a "package," hence, wares (<a onClick="return mV(\'Jer\',10,17);">Jer 10:17</a>);<P>(5) ma\'aseh, "transaction," activity, property, possession, work, occupation, thing made, deed, business (<a onClick="return mV(\'Eze\',27,16,18);">Eze 27:16,18</a>);<P>(6) \'izzabhon, "selling," trade, revenue, mart, letting go for a price (<a onClick="return mV(\'Eze\',27,33);">Eze 27:33</a>);<P>(7) keli, a "prepared" something, as an implement, tool, weapon, utensil, armor, furniture, sack, vessel, hence, wares (<a onClick="return mV(\'Jon\',1,5);">Jon 1:5</a>).<P>In most cases the real sense is merchandise (see <a href="./study/isbe/search.html?string=MERCHANDISE">MERCHANDISE</A>). "That which did not a little amuse the Merchandizers (in Vanity-Fair) was, that these Pilgrims set very light by all their Wares; they cared not so much as to look upon them" (Bunyan, The Pilgrim\'s Progress).``142';
isbe[9131]='Warfare``<a href="./study/isbe/search.html?string=WAR,+WARFARE">WAR, WARFARE</a>`1';
isbe[9132]='Warp`worp (shethi (<a onClick="return mV(\'Lev\',13,\'48-59\');">Le 13:48-59</a>)): The long threads fixed into the loom to form the basis of the web, and into which the woof is wrought from the shuttle. The warp and the woof lying at right angles to one another have in their Hebrew form (shethi we\'erebh) given to modern Jewish speech a secret expression to designate the cross.`<a href="./study/isbe/search.html?string=WEAVING">WEAVING</a>`1';
isbe[9133]='Wars of Yahweh (the Lord) Book of the`worz.`<a href="./study/isbe/search.html?string=BIBLE">BIBLE</a>`1';
isbe[9134]='Wash; Washing`wosh, wosh\'-ing: The two usual Hebrew words for "wash" are rachats, and kabhac, the former being normally used of persons or of sacrificial animals (<a onClick="return mV(\'Gen\',18,4);">Ge 18:4</a>, etc., often translated "bathe"; <a onClick="return mV(\'Lev\',15,5);">Le 15:5</a>, etc.), and the latter of things (<a onClick="return mV(\'Gen\',49,11);">Ge 49:11</a>, etc.), the exceptions to this distinction being few (for rachats, <a onClick="return mV(\'1Ki\',22,38);">1Ki 22:38</a> margin; for kabhac, <a onClick="return mV(\'Psa\',51,2,7);">Ps 51:2,7</a>; <a onClick="return mV(\'Jer\',2,22);">Jer 2:22</a>; <a onClick="return mV(\'Jer\',4,14);">4:14</a>). Much less common are duach (<a onClick="return mV(\'2Ch\',4,6);">2Ch 4:6</a>; <a onClick="return mV(\'Isa\',4,4);">Isa 4:4</a>; <a onClick="return mV(\'Eze\',40,38);">Eze 40:38</a>) and shataph (<a onClick="return mV(\'1Ki\',22,38);">1Ki 22:38</a>; <a onClick="return mV(\'Job\',14,19);">Job 14:19</a>; <a onClick="return mV(\'Eze\',16,9);">Eze 16:9</a>), translated "rinse" in <a onClick="return mV(\'Lev\',6,28);">Le 6:28</a>; <a onClick="return mV(\'Lev\',15,11,12);">15:11,12</a>. In <a onClick="return mV(\'Neh\',4,23);">Ne 4:23</a> the King James Version has "washing" and the Revised Version (British and American) "water" for mayim, but the text is hopelessly obscure (compare the Revised Version margin). In the Apocrypha and New Testament the range of terms is wider. Most common is nipto (<a onClick="return mV(\'Mat\',6,17);">Mt 6:17</a>, etc.), with aponipto in <a onClick="return mV(\'Mat\',27,24);">Mt 27:24</a>. Of the other terms, louo (Susanna verses 15,17; <a onClick="return mV(\'Jhn\',13,10);">Joh 13:10</a>, etc.), with apolouo (<a onClick="return mV(\'Act\',22,16);">Ac 22:16</a>; <a onClick="return mV(\'1Cr\',6,11);">1Co 6:11</a>) and the noun loutron (Sirach 34:25b; <a onClick="return mV(\'Eph\',5,26);">Eph 5:26</a>; <a onClick="return mV(\'Tts\',3,5);">Tit 3:5</a>), usually has a sacral significance. On baptizo (Sirach 34:25a; <a onClick="return mV(\'Mar\',7,4);">Mr 7:4</a>; <a onClick="return mV(\'Luk\',11,38);">Lu 11:38</a>), with the noun baptismos (<a onClick="return mV(\'Mar\',7,4);">Mr 7:4</a> (text?); <a onClick="return mV(\'Hbr\',9,10);">Heb 9:10</a>), see <a href="./study/isbe/search.html?string=BAPTISM">BAPTISM</a>. In <a onClick="return mV(\'Luk\',5,2);">Lu 5:2</a>; <a onClick="return mV(\'Rev\',7,14);">Re 7:14</a>; <a onClick="return mV(\'Rev\',22,14);">22:14</a> the Revised Version (British and American) occurs pluno, while Judith 10:3 has perikluzo. Virtually, as far as meaning is concerned, all these words are interchangeable. Of the figurative uses of washing, the most common and obvious is that of cleansing from sin (<a onClick="return mV(\'Psa\',51,2);">Ps 51:2</a>; <a onClick="return mV(\'Isa\',1,16);">Isa 1:16</a>, etc.), but, with an entirely different figure, "to wash in" may signify "to enjoy in plenty" (<a onClick="return mV(\'Gen\',49,11);">Ge 49:11</a>; <a onClick="return mV(\'Job\',29,6);">Job 29:6</a>; the meaning in <a onClick="return mV(\'Sgs\',5,12);">So 5:12</a> is uncertain). Washing of the hands, in token of innocence, is found in <a onClick="return mV(\'Deu\',21,6);">De 21:6</a>; <a onClick="return mV(\'Mat\',27,24);">Mt 27:24</a>.<P>The "washing balls" of Susanna verse 17 (smegma, a very rare word) were of soap.`<a href="./study/isbe/search.html?string=SOAP">SOAP</a>`48';
isbe[9135]='Washing of Feet`The Old Testament references (<a onClick="return mV(\'Gen\',18,4);">Ge 18:4</a>; <a onClick="return mV(\'Gen\',19,2);">19:2:</a> 24: <a onClick="return mV(\'Gen\',43,24);">43:24</a>; <a onClick="return mV(\'Jdg\',19,21);">Jud 19:21</a>; <a onClick="return mV(\'1Sa\',25,41);">1Sa 25:41</a>; <a onClick="return mV(\'2Sa\',11,8);">2Sa 11:8</a>; <a onClick="return mV(\'Sgs\',5,3);">So 5:3</a>; <a onClick="return mV(\'Psa\',58,10);">Ps 58:10</a>) show that the washing of the feet was the first act on entering the tent or house after a journey. The Orientals wore only sandals, and this washing was refreshing as well as cleanly. In the case of ordinary people, the host furnished the water, and the guests washed their own feet, but in the richer houses, the washing was done by a slave. It was looked upon as the lowliest of all services (<a onClick="return mV(\'1Sa\',25,41);">1Sa 25:41</a>). Jesus pointedly contrasts Simon\'s neglect of even giving Him water for His feet with the woman\'s washing His feet with tears and wiping them with her hair (<a onClick="return mV(\'Luk\',7,44);">Lu 7:44</a>). On the last evening of His life, Jesus washed the disciples\' feet (<a onClick="return mV(\'Jhn\',13,\'1-16\');">Joh 13:1-16</a>). Their pride, heightened by the anticipations of place in the Messianic kingdom whose crisis they immediately expected, prevented their doing this service for each other. Possibly the same pride had expressed itself on this same evening in a controversy about places at table. Jesus, conscious of His divine dignity and against Peter\'s protest, performed for them this lowliest service. His act of humility actually cleansed their hearts of selfish ambition, killed their pride, and taught them the lesson of love. See also The Expository Times, XI, 536 f.<P>Was it meant to be a perpetual ordinance? <a onClick="return mV(\'Jhn\',13,15);">Joh 13:15</a>, with its "as" and the present tense of the verb "do," gives it a priori probability. It has been so understood by the Mennonites and the Dunkards. Bernard of Clairvaux advocated making it a sacrament. The Pope, the Czar, and the Patriarch of Constantinople wash the feet of 12 poor men on Maundy Thursday; so did the English kings till James II, and it is still practiced in the royal palaces of Madrid, Munich and Vienna. But the objections to such an interpretation are overwhelming: (1) It is never referred to in the Synoptic Gospels, the Acts or the Epistle; <a onClick="return mV(\'1Ti\',5,10);">1Ti 5:10</a> refers only to lowly service to the saints. (2) It was first in the 4th century (compare Ambrose and Augustine) that it became the custom to wash the feet of the baptized on Maundy Thursday. (3) Ritualizing such an act of love absolutely destroys its meaning. (4) No large body of Christians has ever received it as a sacrament or an ordinance.<P>F. L. Anderson<P>According to the Belief and Practice of the Church of the Brethren<P>1. Practice:<P>Feet-washing is always practiced in connection with the Agape and the Lord\'s Supper. This entire service is usually called "Love Feast." These Love Feasts are always held in the evening (in conformity to the time of Jesus\' Last Supper). Preparatory services on self-examination are held either at a previous service or at the opening of the Love Feast. Each church or congregation is supposed to hold one or two Love Feasts annually. No specified time of the year is set for these services. Before the supper is eaten all the communicants wash one another\'s feet; the brethren by themselves, and likewise the sisters by themselves.<P>(1) The Mode.<P>In earlier years the "Double Mode" was practiced, where one person would wash the feet of several persons and another would follow after and wipe them. At present the "Single Mode" is almost universal, wherein each communicant washes and wipes the feet of another. Hence, each one washes and wipes the feet of other, and in turn has this same service performed to himself.<P>(2) The Salutation.<P>Feet-washing is also accompanied with the "Holy Kiss." As soon as one has finished washing and wiping the feet of another, he takes him by the hand and greets him with the "holy kiss," usually with an appropriate benediction as: "God bless you," or "May the Lord bless us."<P>2. Scriptural Basis for Feet-Washing:<P>There are three texts in the New Testament referring to feet-washing (<a onClick="return mV(\'Luk\',7,\'36-50\');">Lu 7:36-50</a>; <a onClick="return mV(\'Jhn\',13,\'1-17\');">Joh 13:1-17</a>; <a onClick="return mV(\'1Ti\',5,10);">1Ti 5:10</a>).<P>(1) Jesus Washing the Disciples\' Feet (<a onClick="return mV(\'Jhn\',13,\'1-17\');">Joh 13:1-17</a>).<P>"At supper time" (deipnou genomenou) Jesus arose, laid aside His garments (himatia = "outer garments"), girded Himself with a towel, poured water into a basin, and began to wash and wipe the feet of the disciples.<P>(2) Peter\'s Objection.<P>"Simon Peter...saith unto him, Lord, dost thou wash my feet (su mou nipteis tous podas)? Jesus answered...What I do thou knowest not now; but thou shalt understand hereafter. Peter saith unto him, Thou shalt never wash my feet." Whereupon Jesus said: "If I wash thee not, thou hast no part with me."<P>(3) Jesus Explains.<P>Peter now goes to the other extreme and desires complete washing. Jesus answers "He that is bathed (leloumenos, from louo, "to bathe entire body") needeth not save to wash (niptein—"to wash a part of the body") his feet." Jesus was not instituting a new symbol to take the place of baptism, to cleanse the entire person, but clearly distinguishes between the bathing (louo) of the entire body and the partial cleansing needed after the bath (baptism or immersion).<P>(4) The Command.<P>"If I then, the Lord and the Teacher, have washed your feet, ye also ought to wash one another\'s feet" (<a onClick="return mV(\'Jhn\',13,14);">Joh 13:14</a>, kai humeis opheilete allelon niptein tous podas), "I have given you an example (sign, symbol, hupodeigma), that ye also should do as I have done to you" (<a onClick="return mV(\'Jhn\',13,15);">Joh 13:15</a>). "If ye know these things, happy (or "blessed" the Revised Version (British and American), makarioi) are ye if ye do them" (ean poiete auta). No language is clearer, and no command of Jesus is stronger than this. Furthermore, no symbol is accompanied with a greater promise. Note also, "If I wash thee not, thou hast no part with me."<P>3. The Meaning of the Symbol:<P>(1) Negatively.<P>(a) It cannot be explained as necessity or custom, i.e. that the dust must be washed from the feet of the disciples before proceeding with the supper. It was so cold that Peter had to warm himself, and this is sufficient evidence that they wore shoes instead of sandals at this time. Furthermore, Peter did not understand the action of Jesus, hence, it could not have been customary. Most of all, Jesus was not scrupulous about keeping the customs or practices of the Jews; compare Jesus\' breaking of the Jewish Sabbath (<a onClick="return mV(\'Mar\',2,\'23-26\');">Mr 2:23-26</a>); the Jewish fasts (<a onClick="return mV(\'Mar\',2,\'18-22\');">Mr 2:18-22</a>); the Jewish cleansings (<a onClick="return mV(\'Mar\',7,\'1-20\');">Mr 7:1-20</a>). (b) It was not customary for the host to wash the feet of the guests. Peter objected, and Jesus told him distinctly that he could not understand at the time (arti), but would afterward (meta tauta). The symbol had a deeper meaning.<P>(2) Positively.<P>(a) Feet-washing symbolizes humility and service. The apostles had been quarreling as to who would be greatest in the kingdom which they thought Jesus was about to set up (<a onClick="return mV(\'Luk\',22,\'24-30\');">Lu 22:24-30</a>). Most authorities agree that this quarrel took place before the supper. Peter\'s question. "Dost thou wash my feet?" shows clearly that his objection lay principally in this, that Jesus, the Lord and Master, should perform such humble service. But Jesus was trying all the time to teach His disciples that true greatness in His kingdom is humility and service. "I am in the midst of you as he that serveth" (<a onClick="return mV(\'Luk\',22,27);">Lu 22:27</a>; compare <a onClick="return mV(\'Mat\',5,5);">Mt 5:5</a>; <a onClick="return mV(\'Mat\',23,11,12);">23:11,12</a>). Humility and service are fundamental virtues in the Christian life. To wash the feet of another symbolizes these virtues in the same way that the Eucharist symbolizes other Christian virtues. (b) Cleansing: Jesus clearly distinguished between the first cleansing which cleanses the whole person, and the washing of a part of the body. Baptism is the new birth, which means complete cleansing. But after baptism we still commit sins, and need the partial cleansing as symbolized by feetwashing. Compare Bernard of Clairvaux: "Feet-washing is cleansing of those daily offenses which seem inevitable for those who walk in the dust of the world" (sed pedes (abluti sunt) qui aunt animae affectiones, dum in hac pulvere gradimur, ex toto mundi ease non possunt).<P>4. Practised by the Church of the Brethren:<P>Feet-washing is practiced by the Church of the Brethren for the following reasons:<P>(1) Jesus washed His disciples\' feet and said, "I have given you an example, that ye also should do as I have done to you" (<a onClick="return mV(\'Jhn\',13,15);">Joh 13:15</a>).<P>(2) Jesus said, "Ye also ought ("are bound," opheilete) to wash one another\'s feet" (<a onClick="return mV(\'Jhn\',13,14);">Joh 13:14</a>).<P>(3) "If I wash thee not, thou hast no part with me" (<a onClick="return mV(\'Jhn\',13,8);">Joh 13:8</a>),<P>(4) "If ye know these things, blessed are ye if ye do them" (<a onClick="return mV(\'Jhn\',13,17);">Joh 13:17</a>).<P>(5) Feet-washing symbolizes humility and service, which are fundamental virtues.<P>(6) Feet-washing symbolizes cleansing from the sins committed after baptism.<P>LITERATURE.<P>For the Church of the Brethren: C. F. Yoder, God\'s Means of Grace; R. H. Miller, The Doctrine of the Brethren Defended; tracts issued by the Brethren Publishing House, Elgin, III. For history of feet-washing, see ERE, V; New Sch-Herz Eric of Religious Knowledge, IV, 4; Smith and Cheetham, Dictionary of Christian Antiquities, articles "Baptism," "Maundy Thursday."``92';
isbe[9136]='Washpot`wosh\'-pot (sir rachats, "vessel for washing"): Only <a onClick="return mV(\'Psa\',60,8);">Ps 60:8</a> = <a onClick="return mV(\'Psa\',108,9);">108:9</a>, "Moab is my washpot"; i.e. "Moab is my chattel, to betreated contemptuously," as the vessel in which the conqueror\'s feet are washed.``1';
isbe[9137]='Wasp`wosp.`<a href="./study/isbe/search.html?string=HORNET">HORNET</a>`1';
isbe[9138]='Watch`woch (\'ashmurah, \'ashmoreth; phulake): A division of the night. The night was originally divided into three watches (<a onClick="return mV(\'Jdg\',7,19);">Jud 7:19</a>), but later into four, as we find in the New Testament (<a onClick="return mV(\'Mat\',14,25);">Mt 14:25</a>; <a onClick="return mV(\'Mar\',6,48);">Mr 6:48</a>). We do not know the limits of the watches in the first division, but the middle watch probably began two hours before midnight and ended two hours after. The fourfold division was according to the Roman system, each of which was a fourth part of the night.<P>See <a href="./study/isbe/search.html?string=TIME">TIME</a>.<P>"Watch" is also the guard placed on watch (mishmar, <a onClick="return mV(\'Neh\',4,9);">Ne 4:9</a>; koustodia, from Latin custodia, <a onClick="return mV(\'Mat\',27,65,66);">Mt 27:65,66</a>; <a onClick="return mV(\'Mat\',28,11);">28:11</a>). It sometimes refers to the act of watching, as in <a onClick="return mV(\'2Ki\',11,6,7);">2Ki 11:6,7</a> (mishmereth); <a onClick="return mV(\'Luk\',2,8);">Lu 2:8</a> (phulake).<P>"Watch" is also used figuratively, as in <a onClick="return mV(\'Psa\',141,3);">Ps 141:3</a> for restraint: "Set a watch, O Yahweh, before my mouth" (shomrah).<P>See <a href="./study/isbe/search.html?string=WARD">WARD</a>.``138';
isbe[9139]='Watch-Tour`woch\'-tou-er (mitspeh (<a onClick="return mV(\'Isa\',21,8);">Isa 21:8</a>; <a onClick="return mV(\'2Ch\',20,24);">2Ch 20:24</a>); bachan (<a onClick="return mV(\'Isa\',32,14);">Isa 32:14</a> the Revised Version (British and American))): In <a onClick="return mV(\'Isa\',2,16);">Isa 2:16</a> the words sekhiyoth ha-chemdah have puzzled the translators. the King James Version gives "pleasant pictures," the Revised Version (British and American) "pleasant imagery," while the Revised Version margin has "pleasant watchtowers." Guthe in Kautzsch\'s Bible translates Schaustucke, which practically agrees with the Revised Version (British and American).`<a href="./study/isbe/search.html?string=MIZPEH">MIZPEH</a>; <a href="./study/isbe/search.html?string=TOWER">TOWER</a>`1';
isbe[9140]='Watcher`woch\'-er (Aramaic \'ir, "wakeful one"): In Nebuchadnezzar\'s dream (<a onClick="return mV(\'Dan\',4,13,17,23);">Da 4:13,17,23</a> (<span class="noTag">Mas Text 10,14,20</span>)) a messenger who with "a holy one" descended from heaven, they having joint authority to issue decrees. In the apocryphal literature the doctrine of the "watchers" is much elaborated. In Jubilees they are regarded as angels sent to instruct mankind in righteousness. In Enoch they sometimes appear as archangels and at other times as fallen angels. In the latter condition only we find them in the Book of Adam and Eve. The place of descent was according to Enoch 6:6 the summit of Mt. Hermon.``23';
isbe[9141]='Watchman`woch\'-man (tsopheh, shomer, metsappeh, notser): Used to designate a sentinel on the city walls (<a onClick="return mV(\'2Sa\',18,25);">2Sa 18:25</a>; <a onClick="return mV(\'2Ki\',9,18);">2Ki 9:18</a>; <a onClick="return mV(\'Psa\',127,1);">Ps 127:1</a>; <a onClick="return mV(\'Isa\',62,6);">Isa 62:6</a>) or on the hilltops (<a onClick="return mV(\'Jer\',31,6);">Jer 31:6</a>). <a onClick="return mV(\'Sgs\',3,3);">So 3:3</a>; <a onClick="return mV(\'Sgs\',5,7);">5:7</a> introduces another class, "the watchmen that go about the city," and thus, it would seem, points to some system of municipal police. The distinction in meaning between the various words is clear, tsopheh having the idea of "outlooker" and notser that of "careful watcher" (being applied even to besiegers from outside: <a onClick="return mV(\'Jer\',4,16);">Jer 4:16</a>, "watchers"), while shomer also embraces the idea of "defending" or "guarding." In <a onClick="return mV(\'Isa\',21,6);">Isa 21:6</a> metsappeh is to be taken generally in the sense of "watch." In Sirach 37:14 skopos, means simply "looker."``23';
isbe[9142]='Water`wo\'-ter (mayim; hudor):<P>(1) The Greek philosophers believed water to be the original substance and that all things were made from it. The Koran states, "From water we have made all things." In the story of the creation (<a onClick="return mV(\'Gen\',1,2);">Ge 1:2</a>) water plays an elemental part.<P>(2) Because of the scarcity of water in Palestine it is especially appreciated by the people there. They love to go and sit by a stream of running water. Men long for a taste of the water of their native village (<a onClick="return mV(\'1Ch\',11,17);">1Ch 11:17</a>). A town or village is known throughout the country for the quality of its water, which is described by many adjectives, such as "light," "heavy," etc.<P>(3) The rainfall is the only source of supply of water for Palestine. The moisture is carried up from the sea in clouds and falls on the hills as rain or snow. This supplies the springs and fountains. The rivers are mostly small and have little or no water in summer. For the most part springs supply the villages, but in case this is not sufficient, cisterns are used. Most of the rain falls on the western slopes of the mountains, and most of the springs are found there. The limestone in many places does not hold the water, so wells are not very common, though there are many references to them in the Bible.<P>(4) Cisterns are usually on the surface of the ground and vary greatly in size. Jerusalem has always had to depend for the most part on water stored in this way, and carried to the city in aqueducts. A large number of cisterns have been found and partially explored under the temple-area itself. The water stored in the cisterns is surface water, and is a great menace to the health of the people. During the long, dry summer the water gets less and less, and becomes so stagnant and filthy that it is not fit to drink. In a few instances the cisterns or pools are sufficiently large to supply water for limited irrigation.<P>See <a href="./study/isbe/search.html?string=CISTERN">CISTERN</a>.<P>(5) During the summer when there is no rain, vegetation is greatly helped by the heavy dews. A considerable amount of irrigation is carried on in the country where there is sufficient water in the fountains and springs for the purpose. There was doubtless much more of it in the Roman period. Most of the fruit trees require water during the summer.<P>(6) Many particular wells or pools are mentioned in the Bible, as: Beersheba (<a onClick="return mV(\'Gen\',21,19);">Ge 21:19</a>), Isaac\'s well (<a onClick="return mV(\'Gen\',24,11);">Ge 24:11</a>), Jacob\'s well (<a onClick="return mV(\'Jhn\',4,6);">Joh 4:6</a>), Pool of Siloam (<a onClick="return mV(\'Jhn\',9,7);">Joh 9:7</a>), "waters of Nephtoah" (<a onClick="return mV(\'Jos\',15,9);">Jos 15:9</a>).<P>(7) Washing with water held a considerable place in the Jewish temple-ceremony (<a onClick="return mV(\'Lev\',11,32);">Le 11:32</a>; <a onClick="return mV(\'Lev\',16,4);">16:4</a>; <a onClick="return mV(\'Lev\',17,15);">17:15</a>; <a onClick="return mV(\'Lev\',22,6);">22:6</a>; <a onClick="return mV(\'Num\',19,7);">Nu 19:7</a>; <a onClick="return mV(\'Exd\',30,18);">Ex 30:18</a>; <a onClick="return mV(\'Exd\',40,7);">40:7</a>). Sacrifices were washed (<a onClick="return mV(\'Exd\',29,4);">Ex 29:4</a>; <a onClick="return mV(\'Lev\',1,9);">Le 1:9</a>; <a onClick="return mV(\'Lev\',6,28);">6:28</a>; <a onClick="return mV(\'Lev\',14,5);">14:5</a>).<P>(8) The lack of water caused great suffering (<a onClick="return mV(\'Exd\',15,22);">Ex 15:22</a>; <a onClick="return mV(\'Deu\',8,15);">De 8:15</a>; <a onClick="return mV(\'2Ki\',3,9);">2Ki 3:9</a>; <a onClick="return mV(\'Psa\',63,1);">Ps 63:1</a>; <a onClick="return mV(\'Pro\',9,17);">Pr 9:17</a>; <a onClick="return mV(\'Eze\',4,11);">Eze 4:11</a>; <a onClick="return mV(\'Lam\',5,4);">La 5:4</a>).`<a href="./study/isbe/search.html?string=FOUNTAIN">FOUNTAIN</a>; <a href="./study/isbe/search.html?string=PIT">PIT</a>; <a href="./study/isbe/search.html?string=POOL">POOL</a>; <a href="./study/isbe/search.html?string=SPRING">SPRING</a>; <a href="./study/isbe/search.html?string=WELL">WELL</a>`85';
