isbe[9189]='Whitewash`hwit\'wosh: the American Revised Version margin gives "whitewash" for "untempered mortar" in <a onClick="return mV(\'Eze\',13,10);">Eze 13:10</a> and <a onClick="return mV(\'Eze\',22,28);">22:28</A>. \'Her prophets have daubed for them,\' i.e. seconded them, "with whitewash," thus giving "a slight wall" (<a onClick="return mV(\'Eze\',13,10);">13:10</a> margin) a specious appearance of strength.`<a href="./study/isbe/search.html?string=MORTAR">MORTAR</a>; <a href="./study/isbe/search.html?string=UNTEMPERED">UNTEMPERED</a>`1';
isbe[9190]='Whole; Wholesome`hol, hol\'-sum: "Whole," originally "hale" (a word still in poetic use), had at first the meaning now expressed by its derivative "healthy." In this sense "whole" is fairly common (<a onClick="return mV(\'Job\',5,18);">Job 5:18</a>, etc.) in English Versions of the Bible, although much more common in the New Testament than in the Old Testament. From this meaning "healthy," the transition to the modern force. "complete," "perfect," "entire" (<a onClick="return mV(\'Exd\',12,6);">Ex 12:6</a>, ere) was not unnatural, and it is in this later sense alone that the adverb "wholly" (<a onClick="return mV(\'Lev\',6,22);">Le 6:22</a>, etc.) is used. "Wholesome," however, is derived from the earlier meaning of "whole." It occurs in <a onClick="return mV(\'Pro\',15,4);">Pr 15:4</a>, the King James Version, the English Revised Version, "a wholesome tongue" (rapha\', "heal," the Revised Version margin "the healing of the tongue," the American Standard Revised Version "a gentle tongue"), and in <a onClick="return mV(\'1Ti\',6,3);">1Ti 6:3</a>, the King James Version "wholesome words" (hugiaino, "be healthy," the Revised Version margin "healthful," the Revised Version (British and American) "sound").``48';
isbe[9191]='Whore; Whoredom`hor, hor\'-dum.`<a href="./study/isbe/search.html?string=CRIMES">CRIMES</a>; <a href="./study/isbe/search.html?string=HARLOT">HARLOT</a>; <a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[9192]='Wickedness`wik\'-ed-nes:<P>1. In the Old Testament:<P>The state of being wicked; a mental disregard for justice, righteousness, truth, honor, virtue; evil in thought and life; depravity; sinfulness; criminality. See <a href="./study/isbe/search.html?string=SIN">SIN</a>. Many words are rendered "wickedness." There are many synonyms for wickedness in English and also in the Hebrew. Pride and vanity lead to it: "All the proud, and all that work wickedness (rish\'ah) shall be stubble" (<a onClick="return mV(\'Mal\',4,1);">Mal 4:1</a>). Akin to this is the word \'awen, "iniquity," "vanity": "She eateth, and wipeth her mouth, and saith, I have done no wickedness" (<a onClick="return mV(\'Pro\',30,20);">Pr 30:20</a>). Then we have the word hawwah, meaning "mischief," "calamity," coming from inward intent upon evil: "Lo, this is the man that made not God his strength, but trusted in the abundance of his riches, and strengthened himself in his wickedness" (<a onClick="return mV(\'Psa\',52,7);">Ps 52:7</a>); zimmah, "wickedness" in thought, carnality or lust harbored: "And if a man take a wife and her mother, it is wickedness" (<a onClick="return mV(\'Lev\',20,14);">Le 20:14</a>); \'awlah, "perverseness," "Neither shall the children of wickedness afflict them any more, as at the first" (<a onClick="return mV(\'2Sa\',7,10);">2Sa 7:10</a>). The word for evil ra\' is many times employed to represent wickedness: "Remember all their wickedness" (<a onClick="return mV(\'Hsa\',7,2);">Ho 7:2</a>). Wickedness like all forms and thoughts of wrong, kept warm in mind, seems to be a thing of growth; it begins with a thought, then a deed, then a character, and finally a destiny. Even in this life men increase in wickedness till they have lost all desire for that which is good in the sight of God and good men; the men in the vision of Isaiah seem to be in a condition beyond which the human heart cannot go: "Woe unto them that call evil good, and good evil; that put darkness for light, and light for darkness" (<a onClick="return mV(\'Isa\',5,20);">Isa 5:20</a>). Shades of thought are added by such words as roa\', "evil," "badness": "Give them according to their work, and according to the wickedness of their doings" (<a onClick="return mV(\'Psa\',28,4);">Ps 28:4</a>). And resha\' or rish\'ah, also gives the common thought of wrong, wickedness. The prophets were strong in denunciations of all iniquity, perverseness, and in announcing the curse of God which would certainly follow.<P>2. In the New Testament:<P>Wickedness, malignity, evil in thought and purpose is presented by the word poneria: "But Jesus perceived their wickedness, and said, Why make ye trial of me, ye hypocrites?" (<a onClick="return mV(\'Mat\',22,18);">Mt 22:18</a>). Jesus points out the origin of all wrong: "For from within, out of the heart of men, evil thoughts proceed...wickednesses, deceit, lasciviousness...all these evil things proceed from within, and defile the man" (<a onClick="return mV(\'Mar\',7,\'21-23\');">Mr 7:21-23</a>). See Imitation of Christ, xiii, 5.``45';
isbe[9193]='Widow`wid\'-o (\'almanah; chera): In the Old Testament widows are considered to be under the special care of Yahweh (<a onClick="return mV(\'Psa\',68,5);">Ps 68:5</a>; <a onClick="return mV(\'Psa\',146,9);">146:9</a>; <a onClick="return mV(\'Pro\',15,25);">Pr 15:25</a>). Sympathetic regard for them comes to be viewed as a mark of true religion (<a onClick="return mV(\'Job\',31,16);">Job 31:16</a>; <a onClick="return mV(\'Jam\',1,27);">Jas 1:27</a>). Deuteronomy is rich in counsel in their behalf (<a onClick="return mV(\'Deu\',24,17);">24:17</a>, etc.).<P>The word is first mentioned in the New Testament in <a onClick="return mV(\'Act\',6,1);">Ac 6:1</a>: "There arose a murmuring of the Grecian Jews against the Hebrews, because their widows were neglected in the daily ministration." Paul charges that they be particularly cared for, especially those that are "widows indeed," i.e. poor, without support and old (<a onClick="return mV(\'1Ti\',5,\'2-16\');">1Ti 5:2-16</a>). Some try to find proof in this passage of that ecclesiastical order of widows mentioned in post-apostolic writings.`<a href="./study/isbe/search.html?string=LITERATURE,+SUB+APOSTOLIC">LITERATURE, SUB-APOSTOLIC</a>; <a href="./study/isbe/search.html?string=WOMAN">WOMAN</a>`47';
isbe[9194]='Wife`wif.`<a href="./study/isbe/search.html?string=MARRIAGE">MARRIAGE</a>; <a href="./study/isbe/search.html?string=RELATIONSHIPS,+FAMILY">RELATIONSHIPS, FAMILY</a>`1';
isbe[9195]='Wife, Brother\'s``<a href="./study/isbe/search.html?string=MARRIAGE">MARRIAGE</a>; <a href="./study/isbe/search.html?string=RELATIONSHIPS,+FAMILY">RELATIONSHIPS, FAMILY</a>`1';
isbe[9196]='Wild Beast`wild best:<P>(1) ziz, only with sadhay, "field," in the expression, ziz sadhay, translated "wild beasts of the field" (<a onClick="return mV(\'Psa\',50,11);">Ps 50:11</a>; <a onClick="return mV(\'Psa\',80,13);">80:13</a>); compare Targum to <a onClick="return mV(\'Psa\',80,13);">Ps 80:13</a>, ziza\', "worm" (BDB); Arabic ziz, "worm."<P>(2) tsiyim (<a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a>; <a onClick="return mV(\'Isa\',34,14);">34:14</a>; <a onClick="return mV(\'Jer\',50,39);">Jer 50:39</a>).<P>(3) \'iyim (<a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a>; <a onClick="return mV(\'Isa\',34,14);">34:14</a>; <a onClick="return mV(\'Jer\',50,39);">Jer 50:39</a>).<P>(4) chay, "living thing," often translated "wild beast" in English Versions of the Bible (<a onClick="return mV(\'1Sa\',17,46);">1Sa 17:46</a>, etc.).<P>(5) In Apocrypha (Additions to Esther 16:24, etc.) and the New Testament (<a onClick="return mV(\'Mar\',1,13);">Mr 1:13</a>), therion.<P>(6) <a onClick="return mV(\'Act\',10,12);">Ac 10:12</a> the King James Version; <a onClick="return mV(\'Act\',11,6);">Ac 11:6</a>, tetrapodon, the Revised Version (British and American) "four-rooted beast."<P>(1), (2) and (3) are of doubtful etymology, but the context makes it clear in each case that wild beasts of some sort are meant. The Targum ziza\', "worm," is possible in <a onClick="return mV(\'Psa\',80,13);">Ps 80:13</a>, though not probable in view of the parallel "boar": "The boar out of the wood doth ravage it, and the wild beasts of the field feed on it," i.e. on the vine (figurative) brought out of Egypt. In <a onClick="return mV(\'Psa\',50,11);">Ps 50:11</a>, however, such an interpretation is out of the question. All the references from <a onClick="return mV(\'Psa\',50,\8-13\');">50:8 to 50:13</a> are to large animals, bullocks, goats, cattle and birds. Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) and the Septuagint have in <a onClick="return mV(\'Psa\',80,13);">80:13</A> "wild beast" and in <a onClick="return mV(\'Psa\',50,11);">50:11</A> "beauty of the field" (translated)!<P>Tsiyim, doubtfully referred to tsiydh, "drought," occurs in prophecies of the desolation of Babylon in <a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a> ("wild beasts of the desert") and <a onClick="return mV(\'Jer\',50,39);">Jer 50:39</a>, of Edom in <a onClick="return mV(\'Isa\',34,14);">Isa 34:14</a>, of Assyria in <a onClick="return mV(\'Isa\',23,13);">Isa 23:13</a> ("them that dwell in the wilderness"). It is associated in these passages with names of wild beasts and birds, some of them of very doubtful meaning, such as tannim, \'ochim, \'iyim, se\'irim, benoth ya\'anah. Wild beasts of some sort are clearly meant, though the kind can only be conjectured. The word occurs in <a onClick="return mV(\'Psa\',74,14);">Ps 74:14</a> ("the people inhabiting the wilderness") where it is possible to understand "beasts" instead of people. It occurs also in <a onClick="return mV(\'Psa\',72,9);">Ps 72:9</a> ("they that dwell in the wilderness"), where it seems necessary to understand "men." If the reading stands, it is not easy to reconcile this passage with the others.<p>\'Iyim occurs in <a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a> and <a onClick="return mV(\'Isa\',34,14);">34:14</A> and in <a onClick="return mV(\'Jer\',50,39);">Jer 50:39</a>, three of the passages cited for tsiyim. the King James Version referring to \'i, "island," renders "wild beasts of the islands" (<a onClick="return mV(\'Isa\',13,22);">Isa 13:22</a>). the Revised Version (British and American) has "wolves," margin "howling creatures"; compare Arabic \'anwa\', "to howl," and ibn-\'awa\' or wawi, "jackal."`<a href="./study/isbe/search.html?string=JACKAL">JACKAL</a>`37';
isbe[9197]='Wild Ox`(re\'em): The word "unicorn" occurs in the King James Version in <a onClick="return mV(\'Num\',23,22);">Nu 23:22</a>; <a onClick="return mV(\'Num\',24,8);">24:8</a>; <a onClick="return mV(\'Deu\',33,17);">De 33:17</a>; <a onClick="return mV(\'Job\',39,9,10);">Job 39:9,10</a>; <a onClick="return mV(\'Psa\',22,21);">Ps 22:21</a>; <a onClick="return mV(\'Psa\',29,6);">29:6</a>; <a onClick="return mV(\'Psa\',92,10);">92:10</a>; <a onClick="return mV(\'Isa\',34,7);">Isa 34:7</a> (the King James Version margin "rhinoceros"). the Revised Version (British and American) has everywhere "wild-ox" (margin "ox-antelope," <a onClick="return mV(\'Num\',23,22);">Nu 23:22</a>). The Septuagint has monokeros, "one-horned," except in <a onClick="return mV(\'Isa\',34,7);">Isa 34:7</a>, where we find hoi hadroi, "the large ones," "the bulky ones." In this passage also the Septuagint has hoi krioi, "the rams," instead of English Versions of the Bible "bullocks." Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) has rhinoceros in <a onClick="return mV(\'Num\',23,22);">Nu 23:22</a>; <a onClick="return mV(\'Num\',24,8);">24:8</a>; <a onClick="return mV(\'Deu\',33,17);">De 33:17</a>; <a onClick="return mV(\'Job\',39,9,10);">Job 39:9,10</a>; and unicornis in <a onClick="return mV(\'Psa\',22,21);">Ps 22:21 (Hebrew 22)</a>; <a onClick="return mV(\'Psa\',29,6);">29:6 (Hebrew 28:6)</a>; <a onClick="return mV(\'Psa\',92,10);">92:10 (Hebrew 91:11)</a>; <a onClick="return mV(\'Isa\',34,7);">Isa 34:7</a>.<P>As stated in the articles on <a href="./study/isbe/search.html?string=ANTELOPE">ANTELOPE</a> and <a href="./study/isbe/search.html?string=CATTLE">CATTLE</a>, re\'em and te\'o (<a onClick="return mV(\'Deu\',14,5);">De 14:5</a>; <a onClick="return mV(\'Isa\',51,20);">Isa 51:20</a>) may both be the Arabian oryx (Oryx beatrix), of which the common vernacular name means "wild-ox." It may be presumed that "ox-antelope" of <a onClick="return mV(\'Num\',23,22);">Nu 23:22</a> the Revised Version margin is meant to indicate this animal, which is swift and fierce, and has a pair of very long, sharp and nearly straight horns. The writer feels, however, that more consideration should be given to the view of Tristram (Natural History of the Bible) that re\'em is the urus or aurochs, the primitive Bos taurus, which seems to be depicted in Assyrian monuments and referred to as remu (BDB). The etymology of re\'em is uncertain, but the word may be from a root signifying "to rise" or "to be high." At any rate, there is no etymological warrant for the assumption that it was a one-horned creature. The Arabic raim, is used of a light-colored gazelle. The great strength and fierceness implied in most of the references suit the wild-ox better than the oryx. On the other hand, Edom (<a onClick="return mV(\'Isa\',34,7);">Isa 34:7</a>) was adjacent to the present home of the oryx, while there is no reason to suppose that the wild-ox came nearer than Northern Assyria. There is possibly a reference to the long horns of the oryx in "But my horn hast thou exalted like the horn of the wild-ox" (<a onClick="return mV(\'Psa\',92,10);">Ps 92:10</a>). For te\'o, The Septuagint has orux, in <a onClick="return mV(\'Deu\',14,5);">De 14:5</a> (but seutlion hemiephthon, "half-boiled beet" (!) in <a onClick="return mV(\'Isa\',51,20);">Isa 51:20</a>). Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) has oryx in both passages. While we admit that both re\'em and te\'o may be the oryx, it is perhaps best to follow the Revised Version margin, rendering re\'em "wild-ox." The rendering of "antelope" (Revised Version) for te\'o is defensible, but "oryx" would be better, because the oryx is the only antelope that could possibly be meant, it and the gazelle (tsebhi), already mentioned in <a onClick="return mV(\'Deu\',14,5);">De 14:5</a>, being the only antelopes known to occur in Palestine and Arabia. In <a onClick="return mV(\'Isa\',34,7);">Isa 34:7</a> it seems to be implied that the re\'em might be used in sacrifice.<P>Figurative: The wild-ox is used as a symbol of the strength of Israel: "He hath as it were the strength of the wild-ox". (<a onClick="return mV(\'Num\',23,22);">Nu 23:22</a>; <a onClick="return mV(\'Num\',24,8);">24:8</a>). In the blessing of the children of Israel by Moses it is said of Joseph:<P class="in15">"And his horns are the horns of the wild-ox:<br>With them he shall push the peoples all of them,<br>even the ends of the earth" (<a onClick="return mV(\'Deu\',33,17);">De 33:17</a>).<P>The Psalmist (<a onClick="return mV(\'Psa\',29,5,6);">Ps 29:5,6</a>) in describing the power of Yahweh says:<P class="in15">"Yea, Yahweh breaketh in pieces the cedars of Lebanon.<br>He maketh them also to skip like a calf;<br>Lebanon and Sirion like a young wild-ox."<P>Again, in praise for Yahweh\'s goodness (<a onClick="return mV(\'Psa\',92,10);">Ps 92:10</a>): "But my horn hast thou exalted like the horn of the wildox."<P>In <a onClick="return mV(\'Job\',39,\'9-12\');">Job 39:9-12</a> the subduing and training of the wild-ox are cited among the things beyond man\'s power and understanding.`<a href="./study/isbe/search.html?string=ANTELOPE">ANTELOPE</a>; <a href="./study/isbe/search.html?string=CATTLE">CATTLE</a>`37';
isbe[9198]='Wilderness`wil\'-der-nes.`<a href="./study/isbe/search.html?string=DESERT">DESERT</a>; <a href="./study/isbe/search.html?string=JUDAEA,+WILDERNESS+OF">JUDAEA, WILDERNESS OF</a>; <a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[9199]='Will``<a href="./study/isbe/search.html?string=TESTAMENT">TESTAMENT</a>`1';
isbe[9200]='Will, Volition`vo-lish\'-un (\'abhah, ratson; thelo) boulomai, thelema: "Will" as noun and verb, transitive and intrans, carries in it the idea of "wish," "purpose," "volition." "Will" is also used as an auxiliary of the future tense of other words, but the independent verb is frequent, and it is often important to distinguish between it and the mere auxiliary, especially in the New Testament.<P>In the Old Testament the word chiefly rendered "to will" is \'abhah, "to breathe after," "to long for." With the exception of <a onClick="return mV(\'Job\',39,9);">Job 39:9</a>; <a onClick="return mV(\'Isa\',1,19);">Isa 1:19</a>, it is accompanied by a negation, and is used of both man and God. Several other words are employed, but only sparsely. "Will" as noun is the translation chiefly of ratson, "good-will," "willfulness" (<a onClick="return mV(\'Gen\',49,6);">Ge 49:6</a>), with emphasis on the voluntariness of action (<a onClick="return mV(\'Lev\',1,3);">Le 1:3</a>; <a onClick="return mV(\'Lev\',19,5);">19:5</a>; <a onClick="return mV(\'Lev\',22,19,29);">22:19,29</a>, etc.); also of nephesh, and a few other words. In the New Testament "will" is chiefly the translation of thelo and boulomai, the difference between the two being that thelo expresses an active choice or purpose, boulomai, "passive inclination or willingness, or the inward predisposition from which the active choice proceeds" (compare <a onClick="return mV(\'Mar\',15,9,12);">Mr 15:9,12</a> with <a onClick="return mV(\'Mar\',15,15);">15:15</a>). "Will," noun, is thelema. With the exception of a few passages, it is used of the will of God (over all, <a onClick="return mV(\'Mat\',18,14);">Mt 18:14</a>; in all things to be done, <a onClick="return mV(\'Mat\',6,10);">Mt 6:10</a>; <a onClick="return mV(\'Mat\',26,42);">26:42</a> parallel, etc.; ordering all things, <a onClick="return mV(\'Eph\',1,11);">Eph 1:11</a>, etc.); human will, however, may oppose itself to the will of God (<a onClick="return mV(\'Luk\',23,25);">Lu 23:25</a>; <a onClick="return mV(\'Jhn\',1,13);">Joh 1:13</a>; <a onClick="return mV(\'Rom\',7,18);">Ro 7:18</a>; here the capacity to will is distinguished from the power to do, etc.). Boulema is properly counsel or purpose. While it is possible to oppose the will of God, His counsel or purpose cannot be frustrated (<a onClick="return mV(\'Act\',2,23);">Ac 2:23</a>; <a onClick="return mV(\'Act\',4,28);">4:28</a>; <a onClick="return mV(\'Rom\',9,19);">Ro 9:19</a>; <a onClick="return mV(\'Eph\',1,11);">Eph 1:11</a>; <a onClick="return mV(\'Hbr\',6,17);">Heb 6:17</a>); it may, however, be resisted for a time (<a onClick="return mV(\'Luk\',7,30);">Lu 7:30</a>).<P>In Apocrypha, for "will" we have thelema (1Esdras 9:9 (of God); Ecclesiasticus 43:16; 1Macc 3:60; Ecclesiasticus 8:15, "his own will"); boule (<span class="noTag">The Wisdom of Solomon 9:13</a>, the Revised Version (British and American) "counsel); boulema (2Macc 15:5, "wicked will," the Revised Version (British and American) "cruel purpose"); "willful" (Ecclesiasticus 30:8) is proales, the Revised Version (British and American) "headstrong"; "willing" (<span class="noTag">The Wisdom of Solomon 14:19</span>), boulomai, the Revised Version (British and American) "wishing"; thelo (Ecclesiasticus 6:35); "wilt" (<span class="noTag">The Wisdom of Solomon 12:18</span>), thelo, the Revised Version (British and American) "hast the will" (compare 2Macc 7:16).<P>The Revised Version (British and American) has many changes, several of them of note as bringing out the distinction between the auxiliary and the independent verb. Thus, <a onClick="return mV(\'Mat\',11,27);">Mt 11:27</a>, "willeth to"; <a onClick="return mV(\'Jhn\',7,17);">Joh 7:17</a>, "if any man willeth to do his will"; <a onClick="return mV(\'1Ti\',6,9);">1Ti 6:9</a>, the American Standard Revised Version "they that are minded to be rich," the English Revised Version "desire," etc.<P>The words employed and passages cited show clearly that man is always regarded as a responsible being, free to will in harmony with the divine will or contrary to it. This is further shown by the various words denoting refusal. "Ye will not come to me, that ye may have life" (<a onClick="return mV(\'Jhn\',5,40);">Joh 5:40</a>). So with respect to temptation. We may even choose and act deliberately in opposition to the will of God. Yet God\'s counsel, His will in its completeness, ever prevails, and man, in resisting it, deprives himself of the good it seeks to confer upon him.<P>In modern psychology the tendency is to make will primary and distinctive of personality.``185';
