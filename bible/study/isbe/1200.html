isbe[1270]='Beer`be\'-er (be\'er; phrear; Latin puteus = "well"):<P>(1) A station on the march of the Israelites to the north of the Arnon (<a onClick="return mV(\'Num\',21,16);">Nu 21:16</a>). Here it was that they sang round the well this song: \' Spring up O well; greet it with song, Well, that the princes have dug, The nobles of the people have bored, With the scepter—with their staves\' (<a onClick="return mV(\'Num\',21,16);">Nu 21:16</a>ff). The place is not identified.<P>(2) The town to which Jotham fled from his brother Abimelech after declaring his parable from Mt. Gerizim (<a onClick="return mV(\'Jdg\',9,21);">Jud 9:21</a>). This may be identical with <a href="./study/isbe/search.html?string=BEEROTH">BEEROTH</a>, which see.``1';
isbe[1271]='Beer-Elim`be-er-e\'-lim (be\'er \'elim; phrear tou Aileim, literally "well of Elim"): Probably lay to the north of Moab, answering to Eglaim in the south (<a onClick="return mV(\'Isa\',15,8);">Isa 15:8</a>). It may possibly be identical with <a href="./study/isbe/search.html?string=BEER">BEER</a> (1); but there is no certainty.``1';
isbe[1272]='Beer-Lahai-Roi`be-er-la-hi\'-roi, be-er-la-hi-ro\'-i (be\'er lachai ro\'i, "well of the Living One that seeth me"): "A fountain of water in the wilderness," "the fountain in the way to Shur" (<a onClick="return mV(\'Gen\',16,\'7-14\');">Ge 16:7-14</a>). It was the scene of Hagar\'s theophany, and here Isaac dwelt for some time (<a onClick="return mV(\'Gen\',16,7);">Ge 16:7</a>f; <a onClick="return mV(\'Gen\',24,62);">24:62</a>; <a onClick="return mV(\'Gen\',25,11);">25:11</A>). The site is in The Negeb between Kadesh and Bered (<a onClick="return mV(\'Gen\',16,14);">Ge 16:14</a>). Rowland identifies the well with the modern \'Ain Moilaihhi, circa 50 miles south of Beersheba and 12 miles west of \'Ain Kadis. Cheyne thinks that Hagar\'s native country, to which she was fleeing and from which she took a wife for Ishmael, was not Egypt (mitsrayim), but a north Arabian district called by the Assyrians Mucri (Encyclopedia Biblica).``78';
isbe[1273]='Beera`be-e\'-ra, be\'-er-a (be\'era\', "expounder"): A descendant of Asher (<a onClick="return mV(\'1Ch\',7,37);">1Ch 7:37</a>).``1';
isbe[1274]='Beerah`be-e\'-ra, be\'-er-a (be\'erah; "expounder"): A prince of the house of Reuben whom Tiglath-pileser carried away captive (<a onClick="return mV(\'1Ch\',5,6);">1Ch 5:6</a>). Compare <a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>; <a onClick="return mV(\'2Ki\',16,7);">16:7</a>.``1';
isbe[1275]='Beeri`be-e\'-ri (be\'eri, "expounder"):<P>(1) Father of Judith, one of Esau\'s wives (<a onClick="return mV(\'Gen\',26,34);">Ge 26:34</a>).<P>(2) The father of the prophet Hosea (<a onClick="return mV(\'Hsa\',1,1);">Ho 1:1</a>).``1';
isbe[1276]='Beeroth`be-e\'-roth, be\'-er-oth (be\'eroth; Beroth): One of the cities of the Canaanites whose inhabitants succeeded in deceiving Israel, and in making a covenant with them (<a onClick="return mV(\'Jos\',9,3);">Jos 9:3</a>ff). Apparently they were Hivites (<a onClick="return mV(\'Jos\',9,7);">Jos 9:7</a>). The occasion on which the Beerothites fled to Gittaim where they preserved their communal identity is not indicated. The town was reckoned to Benjamin (<a onClick="return mV(\'2Sa\',4,2);">2Sa 4:2</a>f). Eusebius, Onomasticon places it under Gibeon, 7 Roman miles from Jerusalem on the way to Nicopolis (Amwas). If we follow the old road by way of Gibeon (el-Jib) and Bethhoron, Beeroth would lie probably to the Northwest of el-Jib. The traditional identification is with el-Bireh, about 8 miles from Jerusalem on the great north road. If the order in which the towns are mentioned (<a onClick="return mV(\'Jos\',9,17);">Jos 9:17</a>; <a onClick="return mV(\'Jos\',18,25);">18:25</a>) is any guide as to position, el-Bireh is too far to the Northwest. The identification is precarious. To Beeroth belonged the murderers of Ish-bosheth (<a onClick="return mV(\'2Sa\',4,2);">2Sa 4:2</a>), and Naharai, Joab\'s armor- bearer (<a onClick="return mV(\'2Sa\',23,37);">2Sa 23:37</a>; <a onClick="return mV(\'1Ch\',11,39);">1Ch 11:39</a>). It was reoccupied after the Exile (<a onClick="return mV(\'Ezr\',2,25);">Ezr 2:25</a>; <a onClick="return mV(\'Neh\',7,29);">Ne 7:29</a>).``54';
isbe[1277]='Beeroth Bene-Jaakan`ben\'-e-ja\'-a-kan (be\'eroth bene ya\'aqan; the Revised Version, margin "the wells of the children of Jaakan"): A desert camp of the Israelites mentioned before Moserah (<a onClick="return mV(\'Deu\',10,6);">De 10:6</a>). In <a onClick="return mV(\'Num\',33,31,32);">Nu 33:31-32</a> the name is given simply "Bene-jaakan," and the situation after Moseroth.`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[1278]='Beerothite; Berothite`be-e\'-roth-it, be\'-er-oth-it (be\'erothi; <a onClick="return mV(\'2Sa\',4,5,9);">2Sa 4:5, 9</a>; <a onClick="return mV(\'2Sa\',23,37);">2Sa 23:37</a>; shortened form, <a onClick="return mV(\'1Ch\',11,39);">1Ch 11:39</a>).`<a href="./study/isbe/search.html?string=BEEROTH">BEEROTH</a>`1';
isbe[1279]='Beersheba`be-er-she\'-ba (be\'er shebha\'; Bersabee): Allotted originally to Simeon (<a onClick="return mV(\'Jos\',19,2);">Jos 19:2</a>), one of "the uttermost cities of the tribe of the children of Judah" (<a onClick="return mV(\'Jos\',15,28);">Jos 15:28</a>).<P>1. The Meaning of the Name:<P>The most probable meaning of Beersheba is the "well of seven." "Seven wells" is improbable on etymological grounds; the numeral should in that case be first. In <a onClick="return mV(\'Gen\',21,31);">Ge 21:31</a> Abraham and Abimelech took an oath of witness that the former had dug the well and seven ewe lambs were offered in sacrifice, "Wherefore he called that place Beer-sheba; because there they sware both of them." Here the name is ascribed to the Hebrew root shabha\', "to swear," but this same root is connected with the idea of seven, seven victims being offered and to take an oath, meaning "to come under the influence of seven."<P>Another account is given (<a onClick="return mV(\'Gen\',26,\'23-33\');">Ge 26:23-33</a>), where Isaac takes an oath and just afterward, "the same day Isaac\'s servants came, and told him concerning the well which they had digged (dug), and said unto him, We have found water. And he called it Shibah: therefore the name of the city is Beer-sheba unto this day."<P>2. A Sacred Shrine: Beersheba was a sacred shrine. "Abraham planted a tamarisk tree in Beer-sheba, and called there on the name of Yahweh, the Everlasting God" Genesis (<a onClick="return mV(\'Gen\',21,33);">Ge 21:33</a>). Theophanies occurred there to Hagar (<a onClick="return mV(\'Gen\',21,17);">Ge 21:17</a>), to Isaac (<a onClick="return mV(\'Gen\',26,24);">Ge 26:24</a>), to Jacob (<a onClick="return mV(\'Gen\',46,2);">Ge 46:2</a>), and to Elijah (<a onClick="return mV(\'1Ki\',19,5);">1Ki 19:5</a>). By Amos (<a onClick="return mV(\'Amo\',5,5);">Am 5:5</a>) it is classed with Bethel and Gilgal as one of the rival shrines to the pure worship of Yahweh, and in another place (<a onClick="return mV(\'Amo\',8,14);">Am 8:14</a>) he writes "They shall fall, and never rise up again," who sware, "As the way (i.e. cult) of Beersheba liveth." The two unworthy sons of Samuel were Judges in Beersheba (<a onClick="return mV(\'1Sa\',8,2);">1Sa 8:2</a>) and Zibiah, mother of King Jehoash, was born there (<a onClick="return mV(\'2Ki\',12,1);">2Ki 12:1</a>; <a onClick="return mV(\'2Ch\',24,1);">2Ch 24:1</a>).<P>3. Its Position:<P>Geographically Beersheba marked the southern limit of Judah, though theoretically this extended to the "river of Egypt" (<a onClick="return mV(\'Gen\',15,18);">Ge 15:18</a>)—the modern Wady El\'avish—60 miles farther south. It was the extreme border of the cultivated land. From Dan to Beersheba (<a onClick="return mV(\'2Sa\',17,11);">2Sa 17:11</a>, etc.) or from Beersheba to Dan (<a onClick="return mV(\'1Ch\',21,2);">1Ch 21:2</a>; <a onClick="return mV(\'2Ch\',30,5);">2Ch 30:5</a>) were the proverbial expressions, though necessarily altered through the changed conditions in later years to "from Geba to Beer-sheba" (<a onClick="return mV(\'2Ki\',23,8);">2Ki 23:8</a>) or "from Beer-sheba to the hill-country of Ephraim" (<a onClick="return mV(\'2Ch\',19,4);">2Ch 19:4</a>).<P>4. Modern Beersheba:<P>Today Beersheba is Bir es-Seba\' in the Wady es Seba\', 28 miles southwest of Hebron on "the southern border of a vast rolling plain broken by the torrent beds of Wady Khalil and Wady Seba" (Robinson). The plain is treeless but is covered by verdure in the spring; it is dry and monotonous most of the year. Within the last few years this long-deserted spot—a wide stretch of shapeless ruins, the haunt of the lawless Bedouin—has been re-occupied; the Turks have stationed there an enlightened Kaimerkhan (subgovernor); government offices and shops have been built; wells have been cleared, and there is now an abundant water supply pumped even to the separate houses. Robinson (BW, XVII, 247ff) has described how he found seven ancient wells there—probably still more will yet be found. The whole neighborhood is strewn with the ruins of the Byzantine city which once flourished there; it was an episcopal see. It is probable that the city of Old Testament times stood where Tell es Seba\' now is, some 2 1/2 miles to the east; from the summit a commanding view can be obtained (PEF, III, 394, Sheet XXIV).``117';
isbe[1280]='Beeshterah`be-esh\'-te-ra (<a onClick="return mV(\'Jos\',21,27);">Jos 21:27</a>).`<a href="./study/isbe/search.html?string=ASHTAROTH">ASHTAROTH</a>`1';
isbe[1281]='Beetle`be\'-t\'-l (the Revised Version (British and American) <a href="./study/isbe/search.html?string=CRICKET">CRICKET</a>; chargol; See <a href="./study/isbe/search.html?string=LOCUST">LOCUST</a>): This name occurs only in <a onClick="return mV(\'Lev\',11,22);">Le 11:22</a> as one of four winged Jumping insects (sherets ha-\'oph) which may be eaten. It certainly is not a beetle and is probably not a cricket. Probably all four are names of locusts, of which more than 30 species have been described from Syria and Palestine, and for which there are at least 8 Arabic names in use, though with little distinction of species. Closely allied to chargol are the Arabic charjalet, a troop of horses or a flight of locusts, from charjal, "to gallop," and harjawan, "a wingless locust."``37';
isbe[1282]='Beeves`bevs (<a onClick="return mV(\'Lev\',22,21);">Le 22:21</a> the King James Version).`<a href="./study/isbe/search.html?string=CATTLE">CATTLE</a>`1';
isbe[1283]='Before`be-for\':The translation of a great variety of Hebrew and Greek words. "Haran died before (the English Revised Version "in the presence of," literally "before the face of") his father Terah" (<a onClick="return mV(\'Gen\',11,28);">Ge 11:28</a>). To be "before" God is to enjoy His favor (<a onClick="return mV(\'Psa\',31,22);">Ps 31:22</a>). "The Syrians before" (<a onClick="return mV(\'Isa\',9,12);">Isa 9:12</a> the Revised Version, margin "on the east," as "behind," owing to the position of Canaan, relative to Syria, implies the west).``1';
isbe[1284]='Beg; Beggar; Begging`1. No Law Concerning Beggars or Begging in Israel:<P>It is significant that the Mosaic law contains no enactment concerning beggars, or begging, though it makes ample provision for the relief and care of "the poor in the land." Biblical Hebrew seems to have no term for professional begging, the nearest approach to it being the expressions "to ask (or seek) bread" and "to wander." This omission certainly is not accidental; it comports with the very nature of the Mosaic law, the spirit of which is breathed in this, among other kindred provisions, that a poor Hebrew who even sold himself for debt to his wealthy brother was allowed to serve him only until the Jubilee (See <a href="./study/isbe/search.html?string=JUBILEE">JUBILEE</a>), and his master was forbidden to treat him as a slave (<a onClick="return mV(\'Lev\',25,39);">Le 25:39</a>). These laws, as far as actually practiced, have always virtually done away with beggars and begging among the Jews.<P>2. Begging Not Unknown to the Ancient Jews:<P>Begging, however, came to be known to the Jews in the course of time with the development of the larger cities, either as occurring among themselves, or among neighboring or intermingling peoples, as may be inferred from <a onClick="return mV(\'Psa\',59,15);">Ps 59:15</a>; compare <a onClick="return mV(\'Psa\',109,10);">Ps 109:10</a>, where Yahweh is besought that the children of the wicked may be cursed with beggary, in contra-distinction to the children of the righteous, who have never had to ask bread (<a onClick="return mV(\'Psa\',37,25);">Ps 37:25</a>, "I have been young, and now am old; yet have I not seen the righteous forsaken, nor his seed asking (English Versions, "begging") bread.") For the Hebrew expression not corresponding to "begging" see <a onClick="return mV(\'Psa\',59,15);">Ps 59:15</a>, "They shall wander up and down for food"; and compare <a onClick="return mV(\'Psa\',119,10);">Ps 119:10</a>, "Let me wander," etc.<P>3. Begging and Alms-taking Denounced in Jewish Literature:<P>The first clear denunciation of beggary and almstaking in Jewish literature is found in Ecclesiasticus (Sirach) 40:28-30, where the Hebrew for "begging" is to "wander," ete, as in <a onClick="return mV(\'Psa\',59,15);">Ps 59:15</a>, according to the edition of Cowley and Neubauer; Oxford, 1897. There as well as in Tobit, and in the New Testament, where beggars are specifically mentioned, the word eleemosune has assumed the special sense of alms given to the begging poor (compare Tobit 4:7,16,17; 12:8-11; Ecclesiasticus (Sirach) 3:14,30; 7:10; 16:14; <a onClick="return mV(\'Mat\',6,\'2-4\');">Mt 6:2-4</a>; <a onClick="return mV(\'Mat\',20,\'30-34\');">20:30-34</a>; <a onClick="return mV(\'Mar\',10,\'46-52\');">Mr 10:46-52</a>; <a onClick="return mV(\'Luk\',11,41);">Lu 11:41</a>; <a onClick="return mV(\'Luk\',12,33);">12:33</a>; <a onClick="return mV(\'Jhn\',9,\'1-41\');">Joh 9:1-41</a>; <a onClick="return mV(\'Act\',9,36);">Ac 9:36</a>; <a onClick="return mV(\'Act\',10,2,4,31);">10:2, 4, 31</a>; <a onClick="return mV(\'Act\',24,17);">24:17</a>).<P>4. Professional Beggars a Despised Class: As to professional beggars, originally, certainly, and for a long time, they were a despised class among the Hebrews; and the Jewish communities are forbidden to support them from the general charity fund (BB, 9a; Yoreh De\'ah, 250, 3). But the spirit of the law is evinced again in that it is likewise forbidden to drive a beggar away without an alms (ha-Yadh ha- Chazaqah, in the place cited 7 7).<P>5. In the Gospel Age:<P>Begging was well known and beggars formed a considerable class in the gospel age. Proof of this is found in the references to almsgiving in the Sermon on the Mount (<a onClick="return mV(\'Mat\',5,\'1-\');">Mt 5-7</a> and parallels), and in the accounts of beggars in connection with public places, e.g. the entrance to Jericho. (<a onClick="return mV(\'Mat\',20,30);">Mt 20:30</a> and parallels), which was a gateway to pilgrims going up to Jerusalem to the great festivals and in the neighborhood of rich men\'s houses (<a onClick="return mV(\'Luk\',16,20);">Lu 16:20</a>), and especially the gates of the Temple at Jerusalem (<a onClick="return mV(\'Act\',3,2);">Ac 3:2</a>). This prevalence of begging was due largely to the want of any adequate system of ministering relief, to the lack of any true medical science and the resulting ignorance of remedies for common diseases like ophthalmia, for instance, and to the impoverishment of the land under the excessive taxation of the Roman government (Hausrath, History of New Testament Times, I, 188 (Eng. translation Williams and Norgate), compare Edersheim, Life and Times of Jesus, II, 178). That begging was looked down upon is incidentally evidenced by the remark of the unjust steward, "To beg I am ashamed" (<a onClick="return mV(\'Luk\',16,3);">Lu 16:3</a>); and that, when associated with indolence, it was strongly condemned by public opinion appears from Sirach (40:28-30).<P>The words used for "beg," "beggar" of English Versions of the Bible in the New Testament differ radically in idea: in those formed from aiteo (<a onClick="return mV(\'Mar\',10,46);">Mr 10:46</a>; <a onClick="return mV(\'Luk\',16,3);">Lu 16:3</a>; <a onClick="return mV(\'Luk\',18,35);">18:35</a>; <a onClick="return mV(\'Jhn\',9,8);">Joh 9:8</a> the Revised Version (British and American)) the root idea is that of "asking," while ptochos (<a onClick="return mV(\'Luk\',16,20,22);">Lu 16:20, 22</a>) suggests the cringing or crouching of a beggar. But see <a onClick="return mV(\'Mat\',5,3);">Mt 5:3</a> where the word for "humble" is ptochos.<P>6. A Change in Modern Times:<P>A marked change has come over Jewish life in modern times, in this as well as in other respect. Since the 17th century the Jewish poor in many parts of the world have made it a practice, especially on Fridays and on the eves of certain festivals, to go systematically from house to house asking alms. In parts of Europe today it is a full-grown abuse: crowds of Jewish beggars push their way and ply their trade about the synagogue doors (Abrahams, EB, article "Alms," 310). So the Jewish beggar, in spite of the spirit of the law and ancient Jewish custom, has, under modern conditions too well known to require explanation here, become a troublesome figure and problem in modern Jewish society. For such beggars and begging, see Jewish Encyclopedia, articles "Schnorrers," "Alms," etc., and for another kind of begging among modern Jews, and collections for poverty-stricken Jewish settlers in Palestine, see the articles "Chalukah," "Charity," etc.<P>LITERATURE.<P>Saalschiutz, Arch. der Hebraer, II, chapter xviii (Konigsberg, 1855-56); Riehm Handworterbuch zu den Buchern des A T, under the word "Almosen "; compare Jewish Encyclopedia, HDB, and Encyclopedia B, arts, "Alms"; and Abrahams, Jewish Life in the Middle Ages, chapters xvii, xviii (Philadelphia, 1896); Mackie, Bible Manners and Customs; Day, The Social Life of the Hebrews.``47';
isbe[1285]='Beggarly`beg\'-er-li (ptochos): The word has the thought of "to crouch" or "cringe," such as is common with professional beggars. It is used in <a onClick="return mV(\'Mat\',5,3);">Mt 5:3</a> and <a onClick="return mV(\'Gal\',4,9);">Ga 4:9</a>, and in both cases means complete spiritual destitution. As used in Galatians it expresses the contrast between their present condition and the former estate, toward which he says they are again tending. Paul has in mind both the Jewish and heathen systems of religion with all their outward show. He therefore here emphasizes to the immeasurable superiority of the riches and liberty in Christ. He further expresses this same thought of the law in <a onClick="return mV(\'Rom\',8,3);">Ro 8:3</a> and <a onClick="return mV(\'Hbr\',7,18);">Heb 7:18</a>. In view of the wretchedness of the condition indicated by the word "beggarly," he states his astonishment that they should so little appreciate the liberty and riches which they now enjoy as even to think of going back the former condition.``87';
isbe[1286]='Begin`be-gin\':To make the first movement toward a given end (chalal; archomai). Those who interpret it in many passages pleonastically mean by this, that in such passages as "began to teach" or "began to speak," nothing more is intended than to express vividly and graphically the thought of the dependent infinitive. <a onClick="return mV(\'Mat\',4,17);">Mt 4:17</a>; <a onClick="return mV(\'Luk\',3,23);">Lu 3:23</a>; <a onClick="return mV(\'Act\',1,1);">Ac 1:1</a> are so understood. For contrary opinion, see Thayer\'s Lexicon and Winer\'s Grammar of New Testament Greek.<P>The noun, arche, "beginning," in the writings of John, is used sometimes in an abstract sense, to designate a previous stage (<a onClick="return mV(\'Jhn\',1,1,2);">Joh 1:1-2</a>; <a onClick="return mV(\'Jhn\',8,25);">8:25</a>; <a onClick="return mV(\'1Jo\',1,1);">1Jo 1:1</a>; <a onClick="return mV(\'1Jo\',3,8);">3:8</a>) and, sometimes, the Source or First Cause (<a onClick="return mV(\'Rev\',3,14);">Re 3:14</a>; <a onClick="return mV(\'Rev\',21,6);">21:6</a>; <a onClick="return mV(\'Rev\',22,13);">22:13</a>). Often used also, not for the absolute beginning, but, relatively, for the starting-point of some important movement (<a onClick="return mV(\'1Jo\',2,7,24);">1Jo 2:7, 24</a>; <a onClick="return mV(\'Act\',11,15);">Ac 11:15</a>; <a onClick="return mV(\'Phl\',4,15);">Php 4:15</a>).``84';
isbe[1287]='Beginning`be-gin\'-ing (re\'-shith; arche): The natural meaning of the word is with reference to time. The primitive Greek root means "to be long," "to draw out." Thus, it is used to refer to some point of time long drawn out, or long past (<a onClick="return mV(\'Gen\',1,1);">Ge 1:1</a>). It is used also to express the inauguration of a particular event (<a onClick="return mV(\'Exd\',12,2);">Ex 12:2</a>). The principal interest in the word centers in the use of it in <a onClick="return mV(\'Jhn\',1,1);">Joh 1:1</a>. It must be interpreted here by that which follows in the statement as to the relation of the Logos to the Eternal God and the use of the word "was." It is true that the word arche cannot be separated from the idea of time, but when time began He already was, and therefore He was from eternity.<P>Figurative: in a figurative sense it is used of that which is most excellent, the chief part (<a onClick="return mV(\'Pro\',1,7);">Pr 1:7</a>); of the most eminent person (<a onClick="return mV(\'Col\',1,18);">Col 1:18</a>); the author (<a onClick="return mV(\'Rev\',3,14);">Re 3:14</a>).`<a href="./study/isbe/search.html?string=TIME">TIME</a>; <a href="./study/isbe/search.html?string=ETERNITY">ETERNITY</a>`87';
isbe[1288]='Begotten`be-got\'-\'-n (yaladh; "to bear," "bring forth," "beget"; denotes the physical relation of either parent to a child, <a onClick="return mV(\'Gen\',3,16);">Ge 3:16</a>; <a onClick="return mV(\'Gen\',4,18);">4:18</a>): Used metaphorically of God\'s relation to Israel (<a onClick="return mV(\'Deu\',32,18);">De 32:18</a>) and to the Messianic king (<a onClick="return mV(\'Psa\',2,7);">Ps 2:7</a>); (gennao, "to beget," or "bear"): generally used of a father (<a onClick="return mV(\'Mat\',1,\'1-16\');">Mt 1:1-16</a>); more rarely of a mother (<a onClick="return mV(\'Luk\',1,13,57);">Lu 1:13, 57</a>); used metaphorically of causing or engendering moral and spiritual relations and states (<a onClick="return mV(\'1Cr\',4,15);">1Co 4:15</a>; <a onClick="return mV(\'Phm\',1,10);">Phm 1:10</a>); of the new birth the Holy Spirit (<a onClick="return mV(\'Jhn\',3,3);">Joh 3:3</a>ff). Men who obey and love God as sons are begotten of Him (<a onClick="return mV(\'Jhn\',1,13);">Joh 1:13</a>; <a onClick="return mV(\'1Jo\',2,29);">1Jo 2:29</a>; <a onClick="return mV(\'1Jo\',3,9);">3:9</a>; <a onClick="return mV(\'1Jo\',4,7);">4:7</a>; <a onClick="return mV(\'1Jo\',5,1,4,18);">5:1, 4, 18</a>; compare <a onClick="return mV(\'1Pe\',1,23);">1Pe 1:23</a>). Used especially of God\'s act in making Christ His Son: "Thou art my Son; this day have I begotten thee" (<a onClick="return mV(\'Psa\',2,7);">Ps 2:7</a>) quoted in <a onClick="return mV(\'Act\',13,33);">Ac 13:33</a> in reference to His resurrection (compare <a onClick="return mV(\'Rom\',1,4);">Ro 1:4</a>). The same passage is cited (<a onClick="return mV(\'Hbr\',1,5);">Heb 1:5</a>) as proving Christ\'s filial dignity, transcending the angels in that "he hath inherited a more excellent name than they," i.e. the name of son; and again (<a onClick="return mV(\'Hbr\',5,5);">Heb 5:5</a>) of God conferring upon Christ the glory of the priestly office.<P>Commentators differ as to whether the act of begetting the Son in these two passages is<P>(a) the eternal generation, or<P>(b) the incarnation in time, or<P>(c) the resurrection and ascension.<P>The immediate context of <a onClick="return mV(\'Hbr\',1,5);">Heb 1:5</a> (see <a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a>) seems to favor the last view (Westcott). The first view would not be foreign to the author\'s thought: with <a onClick="return mV(\'Hbr\',5,5);">Heb 5:5</a> compare <a onClick="return mV(\'Hbr\',6,20);">Heb 6:20</a>, "a high priest forever" (Alford). The author of Heb thinks of the eternal and essential sonship of Christ as realized in history in His ascension to the "right hand of the Majesty" (<a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a>). And what is emphatic is the fact and status of sonship, rather than the time of begetting.``145';
isbe[1289]='Beguile`be-gil\':In <a onClick="return mV(\'2Pe\',2,14);">2Pe 2:14</a> the King James Version (compare <a onClick="return mV(\'Jam\',1,14);">Jas 1:14</a>) the word deleazo, is translated "beguile," and means particularly to "entice," "catch by bait." Doubtless Peter got this idea from his old business of fishing, baiting the hook to beguile the fish. In <a onClick="return mV(\'Rom\',7,11);">Ro 7:11</a>; <a onClick="return mV(\'Rom\',16,18);">16:18</a>; <a onClick="return mV(\'1Cr\',3,18);">1Co 3:18</a> the word is exapatao, and means "to cheat" or "to thoroughly deceive." The thought is to be so completely deceived as to accept falsehood for the truth, believing it to be the truth. In <a onClick="return mV(\'Col\',2,4,18);">Col 2:4, 18</a> the King James Version; <a onClick="return mV(\'Jam\',1,22);">Jas 1:22</a> the word is paralogizomai, and means "to miscalculate," "to be imposed upon." It refers particularly to being beguiled by mere probability.`<a href="./study/isbe/search.html?string=DECEIT">DECEIT</a>; <a href="./study/isbe/search.html?string=DELUSION">DELUSION</a>`87';
isbe[1290]='Behalf`be-haf\':"On the part of" (<a onClick="return mV(\'Exd\',27,21);">Ex 27:21</a>, i.e. so far as it affects them); "on the side of" (<a onClick="return mV(\'Job\',36,2);">Job 36:2</a>). For huper, "over," in the sense of furnishing assistance, as in <a onClick="return mV(\'2Cr\',5,20);">2Co 5:20</a>, "in the interest of Christ" (<a onClick="return mV(\'2Cr\',5,21);">2Co 5:21</a>); "for our good," "in his cause" (<a onClick="return mV(\'Phl\',1,29);">Php 1:29</a>); also, often in 2 Corinthians, in general sense of "concerning" (<a onClick="return mV(\'2Cr\',5,12);">2Co 5:12</a>; <a onClick="return mV(\'2Cr\',7,4);">7:4</a>; <a onClick="return mV(\'2Cr\',8,24);">8:24</a>; <a onClick="return mV(\'2Cr\',9,2);">9:2</a>; <a onClick="return mV(\'2Cr\',12,5);">12:5</a>). Huper does not of itself indicate substitution, although one who shelters ("is over") another, suffers "in his stead" (the King James Version <a onClick="return mV(\'2Cr\',5,20);">2Co 5:20</a>), as well as "in his behalf."``1';
isbe[1291]='Behavior`be-hav\'-yer (Ta\'am, "taste," "flavor," hence, "intellectual taste," i.e. judgment, reason, understanding): Of significance as referring to David\'s feigning madness before Aehish, king of Gath, being "sore afraid." Gesenius renders it "changed his understanding," i.e. his mental behavior and outward manner (<a onClick="return mV(\'1Sa\',21,13);">1Sa 21:13</a>, and title to <a onClick="return mV(\'Psa\',34,1);">Ps 34</a>).<P>Twice used in the New Testament (the King James Version) of the well-ordered life of the Christian (kosmios, "well-arranged," "modest," i.e. living with decorum: <a onClick="return mV(\'1Ti\',3,2);">1Ti 3:2</a>), defining the blameless life expected of a minister (overseer), "A bishop must be....of good behavior," the Revised Version (British and American) "orderly" (katastema, "demeanor," "deportment"), including, according to Dean Alford, "gesture and habit" as the outward expression of a reverent spirit (<a onClick="return mV(\'1Pe\',3,1,2);">1Pe 3:1-2</a>). "Aged women...in behavior as becometh holiness" (<a onClick="return mV(\'Tts\',2,3);">Tit 2:3</a>; the Revised Version (British and American) "reverent in demeanor").``139';
isbe[1292]='Beheading`be-hed\'-ing.`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[1293]='Behemoth`be\'-he-moth, be-he\'-moth (behemoth: <a onClick="return mV(\'Job\',40,15);">Job 40:15</a>): Apparently the plural of behemah, "a beast," used of domestic or wild animals. The same form, behemoth, occurs in other passages, e.g. <a onClick="return mV(\'Deu\',28,26);">De 28:26</a>; <a onClick="return mV(\'Deu\',32,24);">32:24</a>; <a onClick="return mV(\'Isa\',18,6);">Isa 18:6</a>; <a onClick="return mV(\'Hab\',2,17);">Hab 2:17</a>, where it is not rendered "behemoth" but "beasts." According to some, the word behemoth, occurring in <a onClick="return mV(\'Job\',40,15);">Job 40:15</a>, is not a Hebrew word, the plural of behemah, but a word of Egyptian origin signifying "water ox." This etymology is denied by Cheyne and others. The word has by various writers been understood to mean rhinoceros and elephant, but the description (<a onClick="return mV(\'Job\',40,\'15-24\');">Job 40:15-24</a>) applies on the whole very well to the hippopotamus (Hippopotamus arnphibius) which inhabits the Nile and other rivers of Africa. Especially applicable are the references to its great size, its eating grass, the difficulty with which weapons penetrate its hide, and its frequenting of streams. " He lieth under the lotus-trees, In the covert of the reed, and the fen. The lotus-trees cover him with their shade; The willows of the brook compass him about." The remains of a fossil hippopotamus of apparently the same species are found over most of Europe, so that it may have inhabited Palestine in early historical times, although we have no record of it. There is a smaller living species in west Africa, and there are several other fossil species in Europe and India. The remains of Hippopotamus minutus have been found in enormous quantities in caves in Malta and Sicily.<P>For an elaborate explanation of behemoth and <a href="./study/isbe/search.html?string=LEVIATHAN">LEVIATHAN</a> (which see) as mythical creatures, see Cheyne, EB, under the word``37';
isbe[1294]='Beholding`be-hold\'-ing: Many Hebrew and Greek words are so rendered in English Versions of the Bible, but epopteusantes, "your good works, which they behold" (<a onClick="return mV(\'1Pe\',2,12);">1Pe 2:12</a>); "beholding your chaste behavior" (<a onClick="return mV(\'1Pe\',3,2);">1Pe 3:2</a>), and epoptai, "We were eyewitnesses of his majesty" (<a onClick="return mV(\'2Pe\',1,16);">2Pe 1:16</a>) are peculiar to Peter. The fact that this word is used only by Peter and is used in both epistles is an argument for identity of authorship. The word epoptes denotes one who had been initiated into the innermost secrets of his faith and who enjoyed the highest religious privileges; but now in contradiction to the secrecy of all pagan "mysteries" (Eleusinian, etc.) the apostles would share with all the faithful every spiritual vision which they enjoyed ("we made known unto you").<P>In <a onClick="return mV(\'2Cr\',3,18);">2Co 3:18</a>, for katoptrizomenoi, the English Revised Version gives "reflecting (as a mirror) the glory of the Lord," the American Standard Revised Version "beholding (as in mirror," etc.). Katoptron was a mirror of polished metal. We cannot clearly and fully behold the outshining of spiritual grandeur in Christ Jesus, but in the gospel God accommodates and adjusts the vision as we are able to bear it, and the glory beheld becomes glory imparted to (and reflected by) the beholder.<P>John\'s Gospel gives us theaomai ("to look closely at"), and theoreo ("to discern"). "We beheld (etheasametha) his glory" (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>), "that they may behold (theorosin) my glory" (<a onClick="return mV(\'Jhn\',17,24);">Joh 17:24</a>). In classic literature, the former word is closely associated with theatrical spectacles, and the latter with athletic games, and they both convey the idea of unceasing interest, deepening in this connection into love and joy.``91';
isbe[1295]='Behoove`be-hoov\':Used in the New Testament for two Greek words dei (<a onClick="return mV(\'Luk\',24,26);">Lu 24:26</a>; <a onClick="return mV(\'Act\',17,3);">Ac 17:3</a>) and opheilo (<a onClick="return mV(\'Hbr\',2,17);">Heb 2:17</a>); the former referring to a physical, and the latter to a moral, necessity (Bengelon, <a onClick="return mV(\'1Cr\',11,10);">1Co 11:10</a>). The former means "must," that is, it is required by the order which God has ordained; the latter, "ought," that is, it is required as a debt.``1';
isbe[1296]='Beirut`ba\'-root\'.`<a href="./study/isbe/search.html?string=BERYTUS">BERYTUS</a>`1';
isbe[1297]='Beka`be\'-ka (beqa\', "half"): Half a shekel, the amount contributed by each male of the Israelites for the use of the Sanctuary (<a onClick="return mV(\'Exd\',38,26);">Ex 38:26</a>). Its value varied according to the standard used, but on the ordinary, or Phoenician, standard it would represent about 122 grams.`<a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`1';
isbe[1298]='Bel`bel, bal (bel): Appellative name of a Bah god (compare <a href="./study/isbe/search.html?string=BAAL">BAAL</a>), in the Old Testament and Apocrypha identified with Marduk or Merodach, the tutelary deity of Babylon (compare <a onClick="return mV(\'Isa\',46,1);">Isa 46:1</a>; <a onClick="return mV(\'Jer\',51,44);">Jer 51:44</a>; Baruch 6:41).`<a href="./study/isbe/search.html?string=BABYLONIA+AND+ASSYRIA,+RELIGION+OF">BABYLONIA AND ASSYRIA, RELIGION OF</a>`1';
isbe[1299]='Bel and the Dragon``<a href="./study/isbe/search.html?string=DANIEL,+BOOK+OF">DANIEL, BOOK OF</a>`1';
isbe[1300]='Bel, and the Dragon`bel, bal, drag\'-un (Greek words: drakon, "dragon," "serpent"; ektos, "except"; horasis "vision," "prophecy"; ophis, "serpent"; sphragisamenos, "having sealed"; choris, "except," Hebrew or Aramaic words: chatham, "to seal"; zepha\', "pitch"; za\'apha\', "storm," "wind"; nachash, "snake"; tannin, "serpent," "sea monster"):<P><b>I. INTRODUCTORY</b><P><b>II. NAME OF BEL AND THE DRAGON</b><P><b>III. CONTENTS</b><P class="in15">1. The Bel Story: the God of Bel<P class="in15">2. The Dragon Story; Meaning of "Dragon"; Serpent-Worship in Babylon<P><b>IV. TEXTUAL AUTHORITIES</b><P class="in15">1. Manuscripts<P class="in30">(1) Greek<P class="in30">(2) Syriac<P class="in15">2. Recensions or Versions<P class="in30">(1) Greek<P class="in30">(2) Syriac<P class="in30">(3) Latin<P class="in30">(4) Aramaic<P><b>V. ORIGINAL LANGUAGE: PRINCIPAL OPINIONS</b><P><b>VI. TEACHING</b> <p>Little in this work that is distinctly Jewish. God is great, absolute and ever-living; angels intervene for special ends; the absurdity of idol-worship<P><b>VII. AUTHOR, PLACE AND DATE OF COMPOSITION</b><P>Probably not in Babylon; perhaps the Hebrew text originated in Palestine about 146 BC or later. The Septuagint version produced in Egypt about 100 BC, which may be the date and language of the Book. Theta (Theodotion\'s version) was produced probably at Ephesus about 180 AD<P><b>VIII. CANONICITY AND AUTHENTICITY</b><P>Accepted as canonical by the Jews of Egypt but rejected by the Jews of Palestine Accepted as part of the Bible by Greek and Latin church Fathers, by the Council of Trent and therefore by the Roman church; denied by Protestants to be canonical<P><b>LITERATURE</b><hr /><P>I. Introductory.<P>Bel and the Dragon is the third of the three Apocryphal additions to Daniel, The <a href="./study/isbe/search.html?string=SONG+ OF+THE+THREE+CHILDREN">SONG OF THE THREE CHILDREN</a> and <a href="./study/isbe/search.html?string=SUSANNA">SUSANNA</a> (which see) being the other two. In the Greek and Latin versions (see below, "IV. Textual Authorities") these "additions" form an integral part of the canonical Book of Daniel, and they are recognized as such and therefore as themselves canonical by the Council of Trent. But the Song of the Three Children is the only piece having a necessary connection with the Hebrew canonical Book of Daniel; in the Greek and Latin texts it follows <a onClick="return mV(\'Dan\',3,24);">Da 3:24</a>. The other two are appended and appear to have an origin independent of the book to which they are appended and also of each other, though in all three as also in the Hebrew Book of Daniel the name and fame of Daniel stand out prominently.<p>II. Name of Bel and the Dragon.<P>Since in the Greek and Latin recensions or versions Bel and the Dragon forms a portion of the Book of Daniel it does not bear a special name. But in the only two known manuscripts of the Septuagint in Syro-Hexaplar (see below, "IV. Textual Authorities") these words stand at the head of the "addition" now under consideration: "From (or "a part of") the prophecy of Habakkuk son of Joshua of the tribe of Levi." That the Biblical writing prophet of that name is meant is beyond question. In Theta (Theodotian) this fact is distinctly stated (see Bel and the Dragon verse 33); and it is equally beyond question that these tales could never have come from the prophet so called (see below "VIII. Canonicity and Authenticity").<P>In codices Alexandrinus and Vaticanus of Theodotian (Theta) the title is: Horasis 12, i.e. <a onClick="return mV(\'Dan\',12,\'1-\');">Da 12</a>, canonical Daniel being comprised in 11 chapters. In the Vulgate, Bel and the Dragon forms chapter 14, but, as in the case of the earlier chapters, it has no heading.<P>In the Syriac Peshitta (W) the story of Bel and the Dragon is preceded by "Bel the idol," and that of the Dragon by "Then follows the Dragon." Bel and the Dragon is the title in all Protestant versions of the Apocrypha, which rigidly keep the latter separate from the books of the Hebrew canon.<p>III. Contents.<P>The stories of Bel and of the Dragon have a separate origin and existed apart: they are brought together because they both agree in holding up idolatry to ridicule and in encouraging Jewish believers to be true to their religion. The glorification of Daniel is also another point in which both agree, though while the Daniel of the Bel and the Dragon story appears as a shrewd Judge corresponding to the etymology of that name, he of the Dragon story is but a fearless puritan who will die rather than be faithless to his religion.<P>It is evident, however that the editor of the "additions" has fused both stories into one, making the Dragon story depend on that which precedes (See Bel and of the Dragon verses 23f). It seems very likely that, in a Nestorian list mentioned by Churton (Uncanonical and Apocryphal Scriptures, 391), Bel and the Dragon is comprised under the title, The Little Daniel.<P>The two stories as told in common by Septuagint and Theodotion may be thus summarized:<P>1. The Story of Bel: the God of Bel:<P>There is in Babylon an image of Bel which Daniel refuses to worship, though no form of worship is mentioned except that of supplying the god with food. The king (Cyrus according to Theodotion) remonstrates with the delinquent Hebrew, pointing Out to him the immense amount of food consumed daily by Bel, who thus proves himself to be a living god. Daniel, doubting the king\'s statement as to the food, asks to be allowed to test the alleged fact. His request being granted, he is shown by expressed desire th e lectisternia, the sacred tables being covered by food which the god is to consume during the night. The doors are all sealed by arrangement, and after the priests have departed Daniel has the temple floor strewn with light ashes. When the morning breaks it is found that the doors are still sealed, but the food has disappeared. Upon examination the tracks of bare feet are found on the ash-strewn floor, showing that the priests have entered the temple by a secret way and removed the food. Angered by the trick played on him the king has the priests put to death and the image destroyed.<P>The word Bel, a short form of Baal, occurs in the Old Testament in <a onClick="return mV(\'Isa\',46,1);">Isa 46:1</a>; <a onClick="return mV(\'Jer\',50,2);">Jer 50:2</a>; <a onClick="return mV(\'Jer\',51,44);">51:44</a>, where it stands for Merodach or Marduk, chief of the Babylonian deities. Originally however it denotes any one of the Babylonian local deities, and especially the principal deity worshipped at Nippur (for similar use of the Hebrew "<a href="./study/isbe/search.html?string=BAAL">Baal</a>" see the article on this word). In Theodotion Cyrus appears as an abettor of Bel-worship, which is quite in accordance with the practice of the early Persian kings to show favor to the worship of the countries they conquered. See Century Bible, "Ezra, Nehemiah, and Esther," 40.<P>2. The Dragon Story; Meaning of "Dragon"; Serpent-Worship in Babylon:<P>There is in Babylon a great live dragon worshipped by a large number of the inhabitants, who lavishly feed it. In the present case the god is or is represented by a living creature which can be fed, and, indeed, needs feeding. Daniel refuses to bow down before the dragon and makes an offer to the king to kill it. Believing the god well able to care for himself, the king accepts Daniel\'s challenge. Daniel makes a mixture of which pitch forms the principal ingredient and thrusts it down the dragon\'s throat, so that "it bursts asunder and dies." The people are infuriated at the death of their god and demand that the king shall have the god-murderer put to death, a demand to which the royal master yields by having Daniel cast into a den of lions, as was done to other culprits found guilty of capital charges. But though the prophet remained in the company of 7 lions for 6 days he suffered no injury. On the last day when Daniel, without food, was naturally hungry, a miracle was performed by way of supplying him with food. Habakkuk (see above, "II. Name"), when cooking food for his reapers, heard an angel\'s voice commanding him to carry the food he had prepared to Daniel in the lions\' den in Babylon. Upon his replying that he did not know where the den, or even Babylon, was, the angel laid hold of his hair and by it carried the prophet to the very part of the den where Daniel was. Having handed the latter the meal intended for the reapers, he was safely brought back by the angel to his own home. It would seem that Habakkuk was protected from the lions as well as Daniel. Seeing all this the king worshipped God, set Daniel free, and in his stead east his accusers into the lions\' den, where they were instantly devoured,<P>Zockler in his commentary (p. 215) speaks of the "fluidity" of the Dragon myth, and he has been followed by Marshall and Daubney. But what in reality does the Greek word drakon, rendered "dragon," mean? In the Septuagint the word is used generally (15 times) to translate the Hebrew tannin which denotes a serpent or sea monster. It is this word (tannin) which in the Aramaic version of the Dragon story translates the Greek drakon. Now in <a onClick="return mV(\'Exd\',4,3);">Ex 4:3</a> and <a onClick="return mV(\'Exd\',7,9);">Ex 7:9</a> the Hebrew tannin and nachash ("serpent") seem identified as are the Greek drakon and ophis in <a onClick="return mV(\'Rev\',12,9);">Re 12:9</a>. We may therefore take drakon in the present story to stand for a serpent. We know that in Babylon the god Nina was worshipped in the form of a serpent (see Sayce, Hibbert Lectures, 281f), and it is more probable that it is the worship of this god or of some other serpent deity that is here meant, than that there is any allusion to the Babylonian story according to which Marduk the supreme deity of Babylon engaged in a conflict with Tiamat the monster—foe to light and order.<P>(1) The dragon of the present story is a god and not as Tiamat, a kind of devil, and a male, not a female.<P>(2) The dragon in the present story is a serpent, which is not true of Tiamat.<P>(3) Apsu (male) and Tiamat (female) are Babylonian deities who give birth to the gods of heaven; these gods subsequently led by their mother Tiamat engaged in a fierce contest with Marduk.<P>Since Gunkel published his book, Schopfung und Chaos (1895), it has been the fashion to see reflections of the Marduk-Tiamat conflict throughout the Old Testament. But recent investigations tend to show that Babylonian mythology has not dominated Hebrew thought to the extent that was formerly thought, and with this statement Gunkel himself now agrees, as the last edition of his commentary on Genesis proves.<p>IV. Textual Authorities.<P>1. Manuscripts:<P>(1) Greek.<P>There exist in Greek two forms of the text (see below).<P>(a) The Septuagint text has been preserved in but one original MS, the codex Christianus (from the Chigi family who owned it, published in Rome in 1772). This belongs to about the 9th century. This text has been printed also in Cozza\'s Sacrorum Bibliorum vestustissima fragmenta Graeca et Latina, part iii, Romae,1877,and in Swete\'s edition of the Septuagint side by side with Theodotion. In Tischendorf\'s Septuagint it occurs at the close of the ordinary text of the Septuagint.<P>(b) Of Theta (the text of Theodotion) we have the following important manuscripts: Codex Vaticanus, Codex Alexandrinus, Q (codex Marchalianus), Gamma (verses 1,2-4 only) and Delta (from verse 21 to verse 41).<P>(2) Syriac.<P>There exists in the Ambrosian Library at Milan, a manuscript of the 8th century of the Syro-Hexaplar version made by Paul of Tella in 617 AD at Alexandria from col vi (Septuagint) of Origen\'s Hexapla. This most valuable manuscript has been edited and published by Ceriani.<P>2. Recensions or Versions:<P>(1) Greek.<P>(a) The Septuagint:<P>Of this we have but one manuscript (see above under "Manuscripts") and until its publication at Rome in 1772 what is now known as Theta was believed to be the real Septuagint version, notwithstanding hints to the contrary by early Christian writers.<P>(b) Theta, or the Version of Theodotion:<P>This version appears to be a revision of the Septuagint, with the help, perhaps, as in the case of the canonical Daniel, of a Hebrew (or Aramaic) original, now lost. It is much less pedantic than Aquila\'s Greek translation which preceded it, and its Greek is better. It is also a better translation than the Septuagint; yet it has many transliterations of Hebrew words instead of translations. This version of Daniel displaced that of the Septuagint at a very early time, for though Origen gave place to the Septuagint in his Hexapla, in his writings he almost always cites from Theta. In his preface to Daniel Jerome points to the fact that in his own time the church had rejected the Septuagint in favor of Theodotion, mentioning the defectiveness of the former as the ground. Even Irenaeus (died 202) and Porphyry (died 305) preferred Theodotion to the Septuagint. Field was the first to point out that it is the work of Theodotion (not the Septuagint) that we have in 1Esdras, etc.<P>(2) Syriac.<P>In addition to the Syro-Hexaplar version (see above, under "Manuscript") the Peshitta version must be noted. It follows Theodotion closely, and is printed in Walton\'s Polyglot (in one recension only of Bel and the Dragon) and in a revised text edited by Lagarde in 1861; not as R. H. Charles (Enc Brit, VII, 807) erroneously says in The Book of Tobit by Neubauer.<P>(3) Latin.<P>(a) The old Latin version, which rests on Theodotion, fragments of which occur in Sabatier\'s work, Bibliorum sacrorum Latinae versiones antiquae (1743, etc., II).<P>(b) The Vulgate, which follows Jerome\'s translation, is also based on Theodotion, and follows it closely.<P>(4) Aramaic.<P>For the Aramaic version published by M. Caster and claimed to be the text of the book as first written, see below, "V. Original Language." V. The Original Language: Principal Opinions.<P>It has been until recent years most generally maintained that Bel and the Dragon was composed and first edited in the Greek language. So Eichhorn, de Wette, Schrader, Fritzsche, Schurer and Konig. In favor of this the following reasons have been given:<P>(1) No Semitic original with reasonable claims has been discovered. Origen, Eusebius and Jerome distinctly say that no Hebrew (or Aramaic) form of this tract existed or was known in their time.<P>(2) The Hebraisms with which this work undoubtedly abounds are no more numerous or more crucial than can be found in works by Jewish authors which are known to have been composed in the Greek language, such as the continual recurrence of kai (= "and"), kai eipe ("and he said"), etc.<P>On the other hand, the opinion has been growing among recent scholars that this work was written first of all either in Hebrew or Aramaic Some of the grounds are the following:<P>(1) It is known that Theodotion in making his translation of other parts of the Old Testament (Daniel) endeavored to correct the Septuagint with the aid of the Massoretic Text. A comparison of the Septuagint and of Theodotion of Bel and the Dragon reveal differences of a similar character. How can we account for them unless we assume that Theodotion had before him a Semitic original? A very weak argument, however, for the translator might have corrected on a priori principles, using his own Judgment; or there might well have been in his time different recensions of the Septuagint. Westcott (DB, I, 397a; 2nd edition, 714a) holds that some of Theodotion\'s changes are due to a desire to give consistency to the facts.<P>(2) Much has been made of the Semiticisms in the work, and it must be admitted that they are numerous and striking. But are these Hebraisms or Aramaisms? The commonest and most undoubted Semiticism is the repeated use of kai and kai egeneto with the force of the waw-consecutive and only to be explained and understood in the light of that construction. But the waw- consecutive exists only in classical Hebrew; Aramaic and post-Biblical. Hebrew, including late parts of the Old Testament (parts of Ecclesiastes, etc.), know nothing of it. It must be assumed then that if the Semiticisms of this work imply a Semitic original, that original was Hebrew, not Aramaic<P>The following Hebraisms found in the Septuagint and in Theodotion may briefly be noted:<P>(1) The use of the Greek kai with all the varied meanings of the waw-consecutive. (see below, under "VI. Teaching"). The beginning of a sentence with kai en ("and there was") Bel and the Dragon (verses 1,3 in the Septuagint; 2f; etc., in Theodotion) agrees with the Hebrew waw-consecutive construction, but makes poor Greek. In verse 15 kai egeneto can be understood only in the light of the Hebrew for which it stands.<P>(2) The syntactical feature called parataxy (coordination) presents itself throughout the Greek of this piece, and it has been reproduced in the English translations (the King James Version, the Revised Version (British and American)) as any English reader can see. In the classical languages it is hypotaxy that prevails. If, as seems likely, those responsible for Septuagint and Theodotion followed a Hebrew original, they failed to make sufficient allowance for the peculiar force of the waw-consecutive idiom, for this does not involve hypotaxy to an y considerable extent.<P>(3) The constant occurrence of Kurios ("Lord") without the article implies the Hebrew Yahweh; and the phrase the "Lord God" is also Hebrew.<P>(4) There are difficulties and differences best explained by assuming a Hebrew origin. The Greek word sphragisamenos has no sense in verse 14 (Septuagint) for, retaining it, we should read of a sealing of the temple (of Bel) and also of a sealing with signet rings of the doors. The Hebrew word "shut" (catham) is written much like that for "seal" (chatham), and was probably, as Marshal suggests, mistaken for the latter. The temple was "shut" and the doors "sealed." In verse 10 the Septuagint (choris) and Theodotion (ektos) have 2 words of similar sense, which are best explained as independent renderings of one Hebrew word.<P>Marshall, identifying this dragon story with the Babylonian creation-myth of Marduk and Tiamat, thinks that instead of "pitch" used in making the obolus with which Daniel destroyed the dragon, the original Aramaic document has "storm wind," the two words being in Aramaic written much alike (za\'apha\' = "storm wind," and zepha\' = pitch). But the fact is quite overlooked that the obolus contained not only pitch, but also "fat" and "hair" (see Bel and the Dragon, verse 27). Besides, in the Aramaic version, published by Gaster, to which Marshall attaches great importance as at least a real source, we have four ingredients, namely, pitch (zepetha\'), fat, flax (kittan) and hair. Dr. Marshall\'s suggestion involves therefore not only the confusion of two words spelled differently in Aramaic, but the substitution of 3 or 4 terms for one in the original draft. Moreover, in Bel and the Dragon the several ingredients are made up into a cake with which the dragon was gorged. Dr. Marshall\'s view assumes also an Aramaic original which is a gainst the evidence. But the suggestion would not have been made but for a desire to assimilate the dragon story to the Babylonian creation-myth, though in motive and details both differ so essentially.<P>In favor of a Semitic original many writers have cited the fact that forms of the story have been found in Hebrew and Aramaic in the 13th century. Raymund Martini in his Pugio Fidei (written against the Jews) quotes Bel and the Dragon from a Hebrew Midrash on Genesis which Neubauer discovered and which is almost verbatim identical with the unique manuscript containing Midrash Rabba de Rabba (see Neubauer, Tobit, viii, and Franz Delitzsch, de Habacuci, 82). Still other Hebrew forms of these stories have been found. All the "additions" to Daniel "occur in Hebrew in the remains of Yosippon," the "Hebrew Josephus," as he has been called. He wrote in the 10th century.<P>But most important of all is the discovery by Dr. M. Gaster of the dragon story in Aramaic, imbedded in the Chronicles of Yerahmeel, a work of the 10th century. Dr. Gaster maintains that in this Aramaic fragment we have a portion of the original Bel and the Dragon (see PSBA, 1894, 280ff (Introduction), 312 (Text) and 1895 (for notes and translation)). The present writer does not think Dr. Gaster has made out his case.<P>(1) If such an Aramaic original did really exist at any time we should have learned something definite about it from early writers, Jewish and Christian.<P>(2) Dr. Gaster has discovered an Aramaic form of only two of the three "additions," those of the Song of the Three Children and of the dragon story. What of the rest of the Aramaic document?<P>(3) It has already been pointed out that the waw-consecutive constructions implied in the Greek texts go back to a Hebrew, not an Aramaic original.<P>(4) The Aramaic text of the Dragon story not seldom differs both from the Septuagint and Theodotion as in the following and many other cases: The two Greek versions have in Bel and the Dragon, verse 24 "The king (said)," which the Aramaic omits: in verse 35 the Aramaic after "And Habakkuk said" adds "to the angel," which the Septuagint and Theodotion are without.<P>(5) The compiler of the Yerahmeel Chronicle says distinctly that he had taken the Song of the Three Children and the dragon story from the writings of Theodotion (see PSBA,1895, 283), he having, it is quite evident, himself put them into Aramaic. Dr. Gaster lays stress on the words of the compiler, that what he gives in Aramaic is that which "Theodotion found" (loc. cit.). But the reference can be only to the Septuagint which this translator made the basis of his own version; it is far too much to assume that the Chronicler means an Aramaic form of the stories.<p>VI. Teaching.<P>The two stories teach the doctrine of the oneness and absoluteness of Yahwe, called throughout Kurios ("Lord"), a literal rendering of the Hebrew word \'adhonai ("Lord") which the Jews substituted for Yahwe in reading the Hebrew as do now-a-day Jews. In the Greek and Latin versions it is the word read (the Qere perpetuum, not that written Kethibh), which is translated. It would have been more consonant with universal practice if the proper name Yahweh had been transliterated as proper names usually are.<P>But very little is said of the character of Yahweh. He is great and the only (true) God in Bel and the Dragon (verse 41), the living God in contrast with Bel (verse 57). Of the nature of His demands on His worshippers, ritualistic and ethical, nothing is said. There is no reference to any distinctly Jewish beliefs or practices; nothing about the torah or about any Divine revelation to men, about sacrifice or the temple or even a priesthood, except that in the Septuagint (not in Theodotion) Daniel the prophet is spoken of as a priest—strong evidence of the low place assigned by the writer to the external side of the religion he professed. We do however find mention of an angel, a sort of deus ex machina in the Dragon story (verses 34ff); compare <a onClick="return mV(\'Dan\',6,22);">Da 6:22</a>.<P>The incident of the transportation of Habakkuk to Babylon shows that the writer had strong faith in supernatural intervention on behalf of the pious. Apart from this incident the two stories steer fairly clear of anything that is supernatural. But Bel and the Dragon verses 33-39 are a late interpolation.<p>VII. Author, Place and Date of Composition.<P>Nothing whatever is known of the author of the book and nothing definite or certain of the place or date of composition. It has been commonly felt, as by Bissell, etc., that it reflects a Babylonian origin. Clay (see Bel and the Dragon, verse 7) abounded in Babylon (but surely not only in Babylon); bronze (Bel and the Dragon, verse 7) was often used in that country for the manufacturing of images, and the lion, it is known, was native to the country (but that was the case also in Palestine in Biblical, and even post-Biblical times). None of the arguments for a Babylonian origin have much weight, and there are contrary arguments of considerable force.<P>The anachronisms and inconsistencies are more easily explained on the assumption of a non-Babylonian origin. Besides, the Judaism of Babylon was of a very strict and regulation kind, great attention being given to the law and to matters of ritual. There is nothing in Bel and the Dragon regarding these points (see above under "Teaching").<P>If we assume a Hebrew original, as there are good grounds for doing, it is quite possible that these legends were written in Palestine at a time when the Jewish religion was severely persecuted: perhaps when Antiochus VII (Sidetes, 139-128 BC) reconquered Judah for Syria and sorely oppressed the subject people. Yet nothing very dogmatic can be said as to this. We cannot infer much from the style of the Hebrew (or Aramaic?), since no Semitic original has come down to us. It is quite clear that these "additions" imply the existence of the canonical Book of Daniel and belong to a subsequent date, for they contain later developments of traditions respecting Daniel. The canonical Book of Daniel is dated by modern scholars about 160 BC, so that a date about 136 BC (see above) could not be far amiss.<P>If, on the other hand, we take for granted that the Septuagint is the original text of the book, the date of that recension is the date of the work itself. It seems probable that this recension of Daniel was made in Egypt about 150 BC (see 1Macc 1:54; 2:59), and we have evidence that up to that date the "three additions" formed no part of the book, though they exist in all Greek and Syriac manuscripts of Daniel, which have come down to us. Probably the "additions" existed as separate compositions for some time before they were joined to Daniel proper, but it is hardly too much to assume that they were united no later than 100 BC. Yet the data for reaching a conclusion are very slight. It may be added that the Greek of the Septuagint is distinctly Alexandrian in its character, as Westcott, Bissell and others have pointed out. Theodotion\'s version is supposed to have been made at Ephesus toward the end of the 2nd century AD.<p>VIII. Canonicity and Authenticity.<P>The Alexandrian Jews, recognizing the Septuagint as their Bible, accepted the whole of the Apocrypha as canonical. The Palestine Jews, on the other hand, limited their canonical Scriptures to the Hebrew Old Testament. There is, of course, some uncertainty (largely no doubt because it was originally a translation from the Hebrew) as to whether the Septuagint at the first included the Apocrypha in its whole extent or not, but all the evidence points to the fact that it did, though individual books like Daniel existed apart before they formed a portion of the Greek or Egyptian canon.<P>In the early Christian church all the three "additions" are quoted as integral parts of Daniel by Greek and by Latin Fathers, as e.g. by Irenaeus (IV,5,2f); Tertullian (De idololatria c.18); Cyprian (Ad fortunatum, c.11).<P>By a decree of the Council of Trent these "additions" were for the Roman church made as much a part of the Bible canon as the Hebrew Book of Daniel. Protestant churches have as a rule excluded the whole of the Apocrypha from their Bibles, regarding its books as either "Deutero-canonical" or "non-canonical." In consequence of this attitude among Protestants the Apocrypha has until lately been greatly neglected by Protestant writers. But a great change is setting in, and some of the best commentaries by Protestant scholars produced in recent years deal with the Apocrypha and its teaching.<P>Julius Africanus (flourished about first half of 3rd century AD) was the first to impugn the truth of the stories embodied in the "additions" to Daniel. This he did in a letter to Origen to which the recipient vigorously replied.<P>The improbabilities and contradictions of these three pieces have often been pointed out from the time of Julius Africanus down to the present day. The following points may be set down as specimens:<P>(1) Daniel is called a priest in the Septuagint (Bel and the Dragon, verse 1), and yet he is identified with the prophet of that name.<P>(2) Habakkuk the prophet (he is so called in Theodotion (see Bel and the Dragon, verse 33), and no other can be intended) is made to be a contemporary of Daniel and also of the Persian king Cyrus (see Bel and the Dragon, verses 1 and 33 in the English Bible). Now Cyrus conquered Babylon in 538 BC, the principal Jews in Babylon returning to Palestine the following year. The events narrated in Bel and the Dragon could not have occurred during the time Cyrus was king of Babylon, but the Septuagint speaks of "the king" without naming him.<P>(3) It was not Cyrus but Xerxes who destroyed the image of Bel, this being in 475 BC (see Herodotus i.183; Strabo xvi.1; Arrian, Exped. Alex., vii.1).<P>(4) It is further objected that dragon-worship in Babylon, such as is implied in the dragon story, is contrary to fact. Star-worship, it has been said, did exist, but not animal-worship. So Eichhorn and Fritzsche. But there is every reason for believing that the worship of living animals as representing deity, and especially of the living serpent, existed in Babylon as among other nations of antiquity, including the Greeks and Romans (see Herzog, 1st edition, article "Drache zu Babylon," by J. G. Muller). It has already been pointed out (see list of meanings) that the word "dragon" denotes a serpent.<P>LITERATURE.<P>Eichhorn, Einleitung in die apoc. Schriften des Alten Testaments (1795), 431ff (remarkable for its time: compares the Septuagint and Theodotion); W. H. Daubney, The Three Additions to Daniel (Cambridge, 1906; contains much matter though rather uncritically treated); the commentaries of Fritzsche (Vol I: still very rich in material; it forms part of the Kurzgefasstes exegetisches Handbuch); Bissell (in Lange\'s series, but not a translation); Ball Speaker\'s Commentary (this is the best English commentary on the Apocrypha). See also Schurer, Geschichte3, III, 333, and his article in RE3, I, 639; and the articles by Kamphausen in EB, I, 1014; Toy, in Jewish Encyclopedia, II, 650; R. H. Charles, Encyclopedia Brittanica, VII, 807, and especially that by J. Turner Marshall in HDB, I, 267. Fritzsche Libri Veteris Testamenti Graece (1871), and Swete, The Old Testament in Greek, III, 1894, and later editions, give the Septuagint and Theodotion on parallel pages. In the edition of the Septuagint edited by Tischendorf, the Septuagint is given in the text and Theodotion in an appendix.``33';
