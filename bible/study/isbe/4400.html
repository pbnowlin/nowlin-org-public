n the invitation of the gospel (<a onClick="return mV(\'1Jo\',2,17);">1Joh 2:17</a>).<P>(3) In Acts.<P>The Book of Acts contains the record of the beginning of the Dispensation of the Holy Spirit. There is at the outset the closest connection with the recorded predictions of the Holy Spirit in the Gospels. Particularly does Luke make clear the continuity of his own thought regarding the Spirit in his earlier and later writing. Jesus in the first chapter of Acts gives commandment through the Holy Spirit and predicts the reception of power as the result of the baptism in the Holy Spirit which the disciples are soon to receive.<P>The form of the Spirit\'s activities in Acts is chiefly charismatic, that is, the miraculous endowment of disciples with power or wisdom for their work in extending the Messianic kingdom. As yet the work of the Spirit within disciples as the chief sanctifying agency is not fully developed, and is later described with great fullness in Paul\'s writings. Some recent writers have overemphasized the contrast between the earlier and the more developed view of the Spirit with regard to the moral life. In Acts the ethical import of the Spirit\'s action appears at several points (see <a onClick="return mV(\'Act\',5,3,9);">Ac 5:3, 9</a>; <a onClick="return mV(\'Act\',7,51);">7:51</a>; <a onClick="return mV(\'Act\',8,18);">8:18</a>f; <a onClick="return mV(\'Act\',13,9);">13:9</a>; <a onClick="return mV(\'Act\',15,28);">15:28</a>). The chief interest in Acts is naturally the Spirit\'s agency in founding the Messianic kingdom, since here is recorded the early history of the expansion of that kingdom. The phenomenal rather than the inner moral aspects of that great movement naturally come chiefly into view. But everywhere the ethical implications are present. Gunkel is no doubt correct in the statement that Paul\'s conception of the Spirit as inward and moral and acting in the daily life of the Christian opens the way for the activity of the Spirit as a historical principle in subsequent ages. After all, this is the fundamental and universal import of the Spirit (see Gunkel, Die Wirkungen des heiligen Geistes, etc., 76; compare Pfleiderer, Paulinismus, 200).<P>We now proceed to give a brief summary of the Holy Spirit\'s activities as recorded in Acts, and follow this with a discussion of one or two special points. The great event is of course the outpouring or baptism of the Holy Spirit at Pentecost followed by the completion of the baptism in the Holy Spirit by the baptism of the household of Cornelius (<a onClick="return mV(\'Act\',2,1);">Ac 2:1</a>ff; <a onClick="return mV(\'Act\',10,\'17-48\');">Ac 10:17-48</a>). Speaking with tongues, and other striking manifestations attended this baptism, as also witnessing to the gospel with power by the apostles. See <a href="study/isbe/search.html?string=BAPTISM+OF+THE+HOLY+SPIRIT">BAPTISM OF THE HOLY SPIRIT</A>. This outpouring is declared to be in fulfillment of Old Testament prophecy, and the assertion is also made that it is the gift of the exalted Lord Jesus Christ (<a onClick="return mV(\'Act\',2,17,33);">Ac 2:17, 33</a>). Following this baptism of the Holy Spirit the disciples are endued with miraculous power for their work. Miracles are wrought (<a onClick="return mV(\'Act\',2,43);">Ac 2:43</a>), and all necessary gifts of wisdom and Divine guidance are bestowed. A frequent form of expression describing the actors in the history is, "filled with the Holy Spirit." It is applied to Peter (<a onClick="return mV(\'Act\',4,8);">Ac 4:8</a>); to disciples (<a onClick="return mV(\'Act\',4,31);">Ac 4:31</a>); to the seven deacons (<a onClick="return mV(\'Act\',6,3);">Ac 6:3</a>); to Stephen (<a onClick="return mV(\'Act\',6,5);">Ac 6:5</a>; <a onClick="return mV(\'Act\',7,55);">Ac 7:55</a>); to Saul who becomes Paul (<a onClick="return mV(\'Act\',13,9);">Ac 13:9</a>).<P>The presence of the Spirit and His immediate and direct superintendence of affairs are seen in the fact that Ananias and Sapphira are represented as lying to the Holy Spirit (<a onClick="return mV(\'Act\',5,3,9);">Ac 5:3, 9</a>); the Jews are charged by Stephen with resisting the Holy Spirit (<a onClick="return mV(\'Act\',7,51);">Ac 7:51</a>); and Simon Magus is rebuked for attempting to purchase the Spirit with money (<a onClick="return mV(\'Act\',8,18);">Ac 8:18</a>f).<P>The Holy Spirit is connected with the act of baptism, but there does not seem to be any fixed order as between the two. In <a onClick="return mV(\'Act\',9,17);">Ac 9:17</a> the Spirit comes before baptism; and after baptism in <a onClick="return mV(\'Act\',8,17);">8:17</a> and <a onClick="return mV(\'Act\',19,6);">19:6</a>. In these cases the coming of the Spirit was in connection with the laying on of hands also. But in <a onClick="return mV(\'Act\',10,44);">Ac 10:44</a> the Holy Spirit falls upon the hearers while Peter is speaking prior to baptism and with no laying on of hands. These instances in which the order of baptism, the laying on of hands and the gift of the Spirit seem to be a matter of indifference, are a striking indication of the non-sacramentarian character of the teaching of the Book of Acts, and indeed in the New Testament generally. Certainly no particular efficacy seems to be attached to the laying on of hands or baptism except as symbolic representations of spiritual facts. Gunkel, in his excellent work on the Holy Spirit, claims <a onClick="return mV(\'Act\',2,38);">Ac 2:38</a> as an instance when the Spirit is bestowed during baptism (Die Wirkungen des heiligen Geistes, etc., 7). The words of Peter, however, may refer to a reception of the Spirit subsequent to baptism, although evidently in immediate connection with it. The baptism of the Holy Spirit clearly then was not meant to supplant water baptism. Moreover, in the strict sense the baptism of the Holy Spirit was a historical event or events completed at the outset when the extension of the kingdom of God, beginning at Pentecost, began to reach out to the Gentile world.<P>See <a href="study/isbe/search.html?string=BAPTISM+OF+THE+HOLY+SPIRIT">BAPTISM OF THE HOLY SPIRIT</a>.<P>In Acts the entire historical movement is represented by Luke as being under the direction of the Spirit. He guides Philip to the Ethiopian and then "catches away" Philip (<a onClick="return mV(\'Act\',8,29,39);">Ac 8:29,39</a>). He guides Peter at Joppa through the vision and then leads him to Cornelius at Caesarea (<a onClick="return mV(\'Act\',10,19);">Ac 10:19</a>f; <a onClick="return mV(\'Act\',11,12);">Ac 11:12</a>f). The Spirit commands the church at Antioch to separate Saul and Barnabas for missionary work (<a onClick="return mV(\'Act\',13,2);">Ac 13:2</a>ff). He guides the church at Jerusalem (<a onClick="return mV(\'Act\',15,28);">Ac 15:28</a>). He forbids the apostle to go to Asia (<a onClick="return mV(\'Act\',16,6);">Ac 16:6</a>f). The Spirit enables Agabus to prophesy that Paul will be bound by the Jews at Jerusalem (<a onClick="return mV(\'Act\',21,11);">Ac 21:11</a>; compare also <a onClick="return mV(\'Act\',20,23);">Ac 20:23</a>). The Spirit appointed the elders at Ephesus (<a onClick="return mV(\'Act\',20,28);">Ac 20:28</a>).<P>One or two points require notice before passing from Acts. The impression we get of the Spirit\'s action here very strongly suggests a Divine purpose moving on the stage of history in a large and comprehensive way. In Jesus that purpose was individualized. Here the supplementary thought of a vast historic movement is powerfully suggested. Gunkel asserts that usually the Spirit\'s action is not conceived by the subjects of it in terms of means (Mittel) and end (Zweck), but rather as cause (Ursache) and activity (Wirkung) (see Die Wirkungen des heiligen Geistes, etc., 20). There is an element of truth in this, but the idea of purpose is by no means confined to the historian who later recorded the Spirit\'s action. The actors in the spiritual drama were everywhere conscious of the great movement of which they as individuals were a part. In some passages the existence of purpose in the Spirit\'s action is clearly recognized, as in His restraining of Paul at certain points and in the appointment of Saul and Barnabas as missionaries. Divine purpose is indeed implied at all points, and while the particular end in view was not always clear in a given instance, the subjects of the Spirit\'s working were scarcely so naive in their apprehension of the matter as to think of their experiences merely as so many extraordinary phenomena caused in a particular way.<P>We note next the glossolalia, or speaking with tongues, recorded in <a onClick="return mV(\'Act\',2,\'1-\');">Ac 2</a>, as well as in later chapters and in Paul\'s Epistles. The prevailing view at present is that "speaking with tongues" does not mean speaking actual intelligible words in a foreign language, but rather the utterance of meaningless sounds, as was customary among the heathen and as is sometimes witnessed today where religious life becomes highly emotional in its manifestation. To support this view the account in <a onClick="return mV(\'Act\',2,\'1-\');">Acts 2</a> is questioned, and Paul\'s instructions in <a onClick="return mV(\'1Cr\',14,\'1-\');">1 Corinthians 14</a> are cited. Of course a man\'s world-view will be likely to influence his interpretation in this as in other matters. Philosophically an antisupernatural world-view makes it easy to question the glossolalia of the New Testament. Candid exegesis, however, rather requires the recognition of the presence in the apostolic church of a speaking in foreign tongues, even if alongside of it there existed (which is open to serious doubt) the other phenomenon mentioned above. <a onClick="return mV(\'Act\',2,3);">Ac 2:3</a>ff is absolutely conclusive taken by itself, and no valid critical grounds have been found for rejecting the passage. <a onClick="return mV(\'1Cr\',14,\'1-\');">1Co 14</a> confirms this view when its most natural meaning is sought. Paul is here insisting upon the orderly conduct of worship and upon edification as the important thing. To this end he insists that they who speak with tongues pray that they may also interpret (<a onClick="return mV(\'1Cr\',14,5);">1Co 14:5</a>; chapter <a onClick="return mV(\'1Cr\',13,\'-\');">13</a>). It is difficult to conceive what he means by "interpret" if the speaking with tongues was a meaningless jargon of sounds uttered under emotional excitement, and nothing more. Paul\'s whole exposition in this chapter implies that "tongues" may be used for edification. He ranks it below prophecy simply because without an interpreter "tongues" would not edify the hearer. Paul himself spoke with tongues more than they all (<a onClick="return mV(\'1Cr\',14,18);">1Co 14:18</a>). It seems scarcely in keeping with Paul\'s character to suppose that he refers here to a merely emotional volubility in meaningless and disconnected sounds.<P>See <a href="study/isbe/search.html?string=TONGUES,+GIFT+OF">TONGUES, GIFT OF</A>.<P>(4) In Paul\'s Writings.<P>The teachings of Paul on the Holy Spirit are so rich and abundant that space forbids an exhaustive presentation. In his writings the Biblical representations reach their climax. Mr. Wood says correctly that Paul grasped the idea of the unity of the Christian life. All the parts exist in a living whole and the Holy Spirit constitutes and maintains it (Wood, The Spirit of God in Biblical Literature, 268). In fact a careful study of Paul\'s teachings discloses three parallel lines, one relating to faith, another to Christ, and the third to the Holy Spirit. That is to say, his teachings coalesce, as it were, point by point, in reference to these three subjects. Faith is the human side of the Divine activity carried on by the Holy Spirit. Faith is therefore implied in the Spirit\'s action and is the result of or response to it in its various forms. But faith is primarily and essentially faith in Jesus Christ. Hence, we find in Paul that Christ is represented as doing substantially everything that the Spirit does. Now we are not to see in this any conflicting conceptions as to Christ and the Spirit, but rather Paul\'s intense feeling of the unity of the work of Christ and the Spirit. The "law" of the Spirit\'s action is the revelation and glorification of Christ. In his Gospel, which came later, John, as we have seen, defined the Spirit\'s function in precisely these terms. Whether or not John was influenced by Paul in the matter we need not here consider.<P>(a) The Spirit and Jesus<P>We begin with a brief reference to the connection in Paul\'s thought between the Spirit and Jesus. The Holy Spirit is described as the Spirit of God\'s Son (<a onClick="return mV(\'Rom\',8,14);">Ro 8:14</a>ff; <a onClick="return mV(\'Gal\',4,6);">Ga 4:6</a>), as the Spirit of Christ (<a onClick="return mV(\'Rom\',8,9);">Ro 8:9</a>). He who confesses Jesus does so by the Holy Spirit, and no one can say that Jesus is anathema in the Holy Spirit (<a onClick="return mV(\'1Cr\',12,3);">1Co 12:3</a>). Christ is called a life-giving Spirit (<a onClick="return mV(\'1Cr\',15,45);">1Co 15:45</a>); and in <a onClick="return mV(\'2Cr\',3,17);">2Co 3:17</a> the statement appears, "Now the Lord is the Spirit." All of this shows how completely one Paul regarded the work of Christ and the Spirit, not because they were identical in the sense in which Beyschlag has contended, but because their task and aim being identical, there was no sense of discord in Paul\'s mind in explaining their activities in similar terms.<P>(b) In Bestowing Charismatic Gifts<P>The Spirit appears in Paul as in Acts imparting all kinds of charismatic gifts for the ends of the Messianic kingdom. He enumerates a long list of spiritual gifts which cannot receive separate treatment here, such as prophecy (<a onClick="return mV(\'1Th\',5,19);">1Th 5:19</a>f); tongues (<a onClick="return mV(\'1Cr\',12,\'1-\');">1Co 12-14</a>); wisdom (<a onClick="return mV(\'1Cr\',2,6);">1Co 2:6</a>); knowledge (<a onClick="return mV(\'1Cr\',12,8);">1Co 12:8</a>); power to work miracles (<a onClick="return mV(\'1Cr\',12,9);">1Co 12:9</a>f); discerning of spirits (<a onClick="return mV(\'1Cr\',12,10);">1Co 12:10</a>); interpretation of tongues (<a onClick="return mV(\'1Cr\',12,10);">1Co 12:10</a>); faith (<a onClick="return mV(\'1Cr\',12,9);">1Co 12:9</a>); boldness in Christian testimony (<a onClick="return mV(\'2Cr\',3,17);">2Co 3:17</a>f); charismata generally (<a onClick="return mV(\'1Th\',1,5);">1Th 1:5</a>; <a onClick="return mV(\'1Th\',4,8);">4:8</a>, etc.). See <a href="study/isbe/search.html?string=SPIRITUAL+GIFTS">SPIRITUAL GIFTS</a>. In addition to the above list, Paul especially emphasizes the Spirit\'s action in revealing to himself and to Christians the mind of God (<a onClick="return mV(\'1Cr\',2,\'10-12\');">1Co 2:10-12</a>; <a onClick="return mV(\'Eph\',3,5);">Eph 3:5</a>). He speaks in words taught by the Spirit (<a onClick="return mV(\'1Cr\',2,13);">1Co 2:13</a>). He preaches in demonstration of the Spirit and of power (<a onClick="return mV(\'1Cr\',2,4);">1Co 2:4</a>; <a onClick="return mV(\'1Th\',1,5);">1Th 1:5</a>).<P>In the above manifestations of the Spirit, as enumerated in Paul\'s writings, we have presented in very large measure what we have already seen in Acts, but with some additions. In <a onClick="return mV(\'1Cr\',14,\'1-\');">1 Corinthians  14</a> and elsewhere Paul gives a new view as to the charismatic gifts which was greatly needed in view of the tendency to extravagant and intemperate indulgence in emotional excitement, due to the mighty action of God\'s Spirit in the Corinthian church. He insists that all things be done unto edification, that spiritual growth is the true aim of all spiritual endowments. This may be regarded as the connecting link between the earlier and later New Testament teaching as to the Holy Spirit, between the charismatic and moral-religious significance of the Spirit. To the latter we now direct attention.<P>(c) In the Beginnings of the Christian Life<P>We note the Spirit in the beginnings of the Christian life. From beginning to end the Christian life is regarded by Paul as under the power of the Holy Spirit, in its inner moral and religious aspects as well as in its charismatic forms. It is a singular fact that Paul does not anywhere expressly declare that the Holy Spirit originates the Christian life. Gunkel is correct in this so far as specific and direct teaching is concerned. But Wood who asserts the contrary is also right, if regard is had to clear implications and legitimate inferences from Paul\'s statements (op. cit., 202). <a onClick="return mV(\'Rom\',8,2);">Ro 8:2</a> does not perhaps refer to the act of regeneration, and yet it is hard to conceive of the Christian life as thus constituted by the "law of the Spirit of life" apart from its origin through the Spirit. There are other passages which seem to imply very clearly, if they do not directly assert, that the Christian life is originated by the Holy Spirit (<a onClick="return mV(\'1Th\',1,6);">1Th 1:6</a>; <a onClick="return mV(\'Rom\',5,5);">Ro 5:5</a>; <a onClick="return mV(\'Rom\',8,9);">8:9</a>; <a onClick="return mV(\'1Cr\',2,4);">1Co 2:4</a>; <a onClick="return mV(\'1Cr\',6,11);">6:11</a>; <a onClick="return mV(\'Tts\',3,5);">Tit 3:5</a>).<P>The Holy Spirit in the beginnings of the Christian life itself is set forth in many forms of statement. They who have the Spirit belong to Christ (<a onClick="return mV(\'Rom\',8,9);">Ro 8:9</a>). We received not the Spirit of bondage but of adoption, "whereby we cry, Abba, Father" (<a onClick="return mV(\'Rom\',8,15);">Ro 8:15</a>). "The Spirit himself beareth witness with our spirit, that we are children of God" (<a onClick="return mV(\'Rom\',8,16);">Ro 8:16</a>). The Spirit is received by the hearing of faith (<a onClick="return mV(\'Gal\',3,2);">Ga 3:2</a>). See also <a onClick="return mV(\'Rom\',5,5);">Ro 5:5</a>; <a onClick="return mV(\'Rom\',8,2);">8:2</a>; <a onClick="return mV(\'1Cr\',16,11);">1Co 16:11</a>; <a onClick="return mV(\'Gal\',3,3,14);">Ga 3:3, 14</a>; <a onClick="return mV(\'Eph\',2,18);">Eph 2:18</a>. There are two or three expressions employed by Paul which express some particular aspect of the Spirit\'s work in believers. One of these is "first-fruits" (<a onClick="return mV(\'Rom\',8,23);">Ro 8:23</a>, aparche), which means that the present possession of the Spirit by the believer is the guarantee of the full redemption which is to come, as the first-fruits were the guarantee of the full harvest. Another of these words is "earnest" (<a onClick="return mV(\'2Cr\',1,22);">2Co 1:22</a>; <a onClick="return mV(\'2Cr\',5,5);">5:5</a>, arrabon), which also means a pledge or guarantee. Paul also speaks of the "sealing" of the Christians with the Holy Spirit of promise, as in <a onClick="return mV(\'Eph\',1,13);">Eph 1:13</a> (esphragisthete, "ye were sealed"). This refers to the seal by which a king stamped his mark of authorization or ownership upon a document.<P>(d) In the Religious and Moral Life<P>Paul gives a great variety of expressions indicating the presence and activity of the Holy Spirit in the religious and moral life of the Christian. In fact at every point that life is under the guidance and sustaining energy of the Spirit. If we live after the flesh, we die; if after the Spirit, we live (<a onClick="return mV(\'Rom\',8,6);">Ro 8:6</a>). The Spirit helps the Christian to pray (<a onClick="return mV(\'Rom\',8,26);">Ro 8:26</a>f). The kingdom of God is righteousness and peace and joy in the Holy Spirit (<a onClick="return mV(\'Rom\',14,17);">Ro 14:17</a>). Christians are to abound in hope through the Holy Spirit (<a onClick="return mV(\'Rom\',15,13);">Ro 15:13</a>). "The fruit of the Spirit is love, joy, peace, longsuffering, kindness, goodness, faithfulness, meekness, self-control" (<a onClick="return mV(\'Gal\',5,22);">Ga 5:22</a>). Christians are warned to grieve not the Holy Spirit (<a onClick="return mV(\'Eph\',4,30);">Eph 4:30</a>), and are urged to take the sword of the Spirit (<a onClick="return mV(\'Eph\',6,17);">Eph 6:17</a>). The flesh is contrasted with the Spirit at a number of points in Paul\'s writings (e.g. <a onClick="return mV(\'Rom\',8,5);">Ro 8:5</a>f; <a onClick="return mV(\'Gal\',5,17);">Ga 5:17</a>ff). The Spirit in these passages probably means either the Spirit of God or man\'s spirit as under the influence of the Spirit of God. Flesh is a difficult word to define, as it seems to be used in several somewhat different senses. When the flesh is represented as lusting against the Spirit, however, it seems equivalent to the "carnal mind," i.e. the mind of the sinful natural man as distinct from the mind of the spiritual man. This carnal or fleshly mind is thus described because the flesh is thought of as the sphere in which the sinful impulses in large part, though not altogether (<a onClick="return mV(\'Gal\',5,19);">Ga 5:19</a>), take their rise.<P>Paul contrasts the Spirit with the letter (<a onClick="return mV(\'2Cr\',3,6);">2Co 3:6</a>) and puts strong emphasis on the Spirit as the source of Christian liberty. As Gunkel points out, spirit and freedom with Paul are correlatives, like spirit and life. Freedom must needs come of the Spirit\'s presence because He is superior to all other authorities and powers (Die Wirkungen des heiligen Geistes, etc., 95). See also an excellent passage on the freedom of the Christian from statutory religious requirements in DCG, article "Holy Spirit" by Dr. James Denney, I, 739.<P>(e) In the Church.<P>Toward the end of his ministry and in his later group of epistles, Paul devoted much thought to the subject of the church, and one of his favorite figures was of the church as the body of Christ. The Holy Spirit is represented as animating this body, as communicating to it life, and directing all its affairs. As in the case of the individual believer, so also in the body of believers the Spirit is the sovereign energy which rules completely. By one Spirit all are baptized into one body and made to drink of one Spirit (<a onClick="return mV(\'1Cr\',12,13);">1Co 12:13</a>). All the gifts of the church, charismatic and otherwise, are from the Spirit (<a onClick="return mV(\'1Cr\',12,4);">1Co 12:4</a>,<a onClick="return mV(\'1Cr\',12,\'8-11\');">8-11</a>). All spiritual gifts in the church are for edification (<a onClick="return mV(\'1Cr\',14,12);">1Co 14:12</a>). Prayer is to be in the Spirit (<a onClick="return mV(\'1Cr\',14,15);">1Co 14:15</a>). The church is to preserve the unity of the Spirit in the bond of peace (<a onClick="return mV(\'Eph\',4,3);">Eph 4:3</a>). Love (<a onClick="return mV(\'Col\',1,8);">Col 1:8</a>); fellowship (<a onClick="return mV(\'Phl\',2,1);">Php 2:1</a>); worship (<a onClick="return mV(\'Phl\',3,3);">Php 3:3</a>) are in the Spirit. The church is the habitation of the Spirit (<a onClick="return mV(\'Eph\',2,22);">Eph 2:22</a>). The church is an epistle of Christ written by the Spirit (<a onClick="return mV(\'2Cr\',3,3);">2Co 3:3</a>). Thus the whole life of the church falls under the operation of the Holy Spirit.<P>(f) In the Resurrection of Believers<P>The Spirit also carries on His work in believers in raising the body from the dead. In <a onClick="return mV(\'Rom\',8,11);">Ro 8:11</a> Paul asserts that the present indwelling in believers of the Spirit that raised up Jesus from the dead is the guarantee of the quickening of their mortal bodies by the power of the same Spirit. See also <a onClick="return mV(\'1Cr\',15,44);">1Co 15:44</a>f; <a onClick="return mV(\'Gal\',5,5);">Ga 5:5</a>.<P>We have thus exhibited Paul\'s teachings as to the Holy Spirit in some detail in order to make clear their scope and comprehensiveness. And we have not exhausted the material supplied by his writings. It will be observed that Paul nowhere elaborates a doctrine of the Spirit, as he does in a number of instances his doctrine of the person of Christ. The references to the Spirit are in connection with other subjects usually. This, however, only serves to indicate how very fundamental the work of the Spirit was in Paul\'s assumptions as to the Christian life. The Spirit is the Christian life, just as Christ is that life.<P>The personality of the Spirit appears in Paul as in John. The benediction in <a onClick="return mV(\'2Cr\',13,14);">2Co 13:14</a> distinguishes clearly Father, Son and Spirit (compare also <a onClick="return mV(\'Eph\',4,4);">Eph 4:4</a>). In many connections the Spirit is distinguished from the Son and Father, and the work of the Spirit is set forth in personal terms. It is true, references are often made to the Holy Spirit by Paul as if the Spirit were an impersonal influence, or at least without clearly personal attributes. This distinguishes his usage as to the Spirit from that as to Christ and God, who are always personal. It is a natural explanation of this fact if we hold that in the case of the impersonal references we have a survival of the current Old Testament conception of the Spirit, while in those which are personal we have the developed conception as found in both Paul and John. Personal attributes are ascribed to the Spirit in so many instances, it would seem unwarranted in us to make the earlier and lower conception determinative of the later and higher.<P>In Paul\'s writings we have the crowning factor in the Biblical doctrine of the Holy Spirit. He gathers up most of the preceding elements, and adds to them his own distinctive teaching or emphasis. Some of the earlier Old Testament elements are lacking, but all those which came earlier in the New Testament are found in Paul. The three points which Paul especially brought into full expression were first, the law of edification in the use of spiritual gifts, second, the Holy Spirit in the moral life of the believer, and third, the Holy Spirit in the church. Thus Paul enables us to make an important distinction as to the work of the Spirit in founding the kingdom of God, namely, the distinction between means and ends. Charismatic gifts of the Spirit were, after all, means to ethical ends. God\'s kingdom is moral in its purpose, "righteousness and peace and joy in the Holy Spirit." Christianity is, according to Paul, inherently and essentially supernatural. But its permanent and abiding significance is to be found, not in extraordinary phenomena in the form of "mighty works," "wonders," "tongues" and other miracles in the ordinary sense, but in the creation of a new moral order in time and eternity. The supernatural is to become normal and "natural" in human history, therefore, in the building up of this ethical kingdom on the basis of a redemption that is in and through Jesus Christ, and wrought out in all its details by the power of the Holy Spirit.<P>(5) The Holy Spirit in Other New Testament Writings.<P>There is little to add to the New Testament teaching as to the Holy Spirit. Paul and John practically cover all the aspects of His work which are presented. There are a few passages, however, we may note in concluding Our general survey. In He the Holy Spirit is referred to a number of times as inspiring the Old Testament Scriptures (<a onClick="return mV(\'Hbr\',3,7);">Heb 3:7</a>; <a onClick="return mV(\'Hbr\',9,8);">9:8</a>; <a onClick="return mV(\'Hbr\',10,15);">10:15</a>). We have already referred to the remarkable statement in <a onClick="return mV(\'Hbr\',9,14);">Heb 9:14</a> to the effect that the blood of Christ was offered through the eternal Spirit. In <a onClick="return mV(\'Hbr\',10,29);">Heb 10:29</a> doing "despite unto the Spirit of grace" seems to be closely akin to the sin against the Holy Spirit in the Gospels. In <a onClick="return mV(\'Hbr\',4,12);">Heb 4:12</a> there is a very remarkable description of the "word of God" in personal terms, as having all the energy and activity of an actual personal presence of the Spirit, and recalls Paul\'s language in <a onClick="return mV(\'Eph\',6,17);">Eph 6:17</a>. In 1 Peter we need only refer to <a onClick="return mV(\'1Pe\',1,11);">1Pe 1:11</a> in which Peter declares that the "Spirit of Christ" was in the Old Testament prophets, pointing forward to the sufferings and glories of Christ.<P>LITERATURE.<P>I. F. Wood, The Spirit of God in Biblical Literature; article "Spiritual Gifts" in EB; Gunkel, Die Wirkungen des heiligen Gelstea; Gloel, Der heilige Geist in der Heilsverkundigung des Paulus; Wendt, Die Begriffe Fleisch und Geist im biblischen Sprachgebrauch; Weinel, Die Wirkungen des Geistes und der Geister; Dickson, Paul\'s Use of the Terms Flesh and Spirit; Smeaton, Doctrine of the Holy Spirit; Walker, The Spirit and the Incarnation; Denio, The Supreme Leader; Moberly, Administration of the Holy Spirit in the Body of Christ; Hutchings, Person and Work of the Holy Spirit; Owen, Pneumatologia; Webb, Person and Office of the Holy Spirit; Hare, The Mission of the Comforter; Candlish, The Work of the Holy Spirit; Wirgman, The Sevenfold Gifts; Heber, Personality and Offices of the Holy Spirit; Swete, The Holy Spirit in the New Testament; Moule, Veni Creator; Johnson, The Holy Spirit Then and Now; Kuyper, The Work of the Holy Spirit; Biblical Theologies of Schultz, Davidson, Weiss, Beyschlag, Stevens; list appended to the article on "Holy Spirit" in HDB and DCG; extensive bibliography in Denio\'s The Supreme Leader, 239ff.``127';
isbe[4404]='Holyday`ho\'-li-da: This word occurs twice in the King James Version, namely, <a onClick="return mV(\'Psa\',42,4);">Ps 42:4</a>, "a multitude that kept (the Revised Version (British and American) "keeping") holyday," and <a onClick="return mV(\'Col\',2,16);">Col 2:16</a>. In the latter case it is a rendering of the Greek word heorte, the ordinary term for a religious festival. the Revised Version (British and American) translates "feast day." In the former instance "keeping holyday" renders choghegh. The verb means to "make a pilgrimage," or "keep a religious festival." Occasionally the idea of merrymaking prevails, as in <a onClick="return mV(\'1Sa\',30,16);">1Sa 30:16</a>—"eating and drinking," and enjoying themselves merrily. The Psalmist (who was perhaps an exiled priest) remembers with poignant regret how he used to lead religious processions on festival occasions.``103';
isbe[4405]='Homam`ho\'-mam (chomam, "destruction"): A Horite descendant of Esau (<a onClick="return mV(\'1Ch\',1,39);">1Ch 1:39</a>). The name appears in <a onClick="return mV(\'Gen\',36,22);">Ge 36:22</a> as "Heman."``1';
isbe[4406]='Home`hom (bayith, "house," maqom, "place," \'ohel, "tent" (<a onClick="return mV(\'Jdg\',19,9);">Jud 19:9</a>), shubh, "to cause to turn back," tawekh, tokh, "middle," "midst" (<a onClick="return mV(\'Deu\',21,12);">De 21:12</a>); oikos, "house," "household," endemeo, "to be among one\'s people," oikos idios, "one\'s own proper (house)"): This term in Scripture does not stand for a single specific word of the original, but for a variety of phrases. Most commonly it is a translation of the Hebrew bayith, Greek oikos "house," which means either the building or the persons occupying it. In <a onClick="return mV(\'Gen\',43,26);">Ge 43:26</a> "home" and "into the house" represent the same phase, "to the house" (ha-bayethah). In <a onClick="return mV(\'Rth\',1,21);">Ru 1:21</a>, "hath brought me home again" means "has caused me to return." In <a onClick="return mV(\'2Ch\',25,10);">2Ch 25:10</a> "home again" means "to their place." In <a onClick="return mV(\'Ecc\',12,5);">Ec 12:5</a> "long home," the Revised Version (British and American) "everlasting home," means "eternal house." In <a onClick="return mV(\'Jhn\',19,27);">Joh 19:27</a> "unto his own home" means "unto his own things" (so <a onClick="return mV(\'Jhn\',1,11);">Joh 1:11</a>). In <a onClick="return mV(\'2Cr\',5,6);">2Co 5:6</a> (and the Revised Version (British and American) <a onClick="return mV(\'2Cr\',5,8,9);">5:8,9</A>) "be at home" is a translation of endemeo, "to be among one\'s own people," as opposed to ekdemeo, "to be or live abroad."``44';
isbe[4407]='Home-Born`hom\'-born (\'ezrach): A native-born Hebrew, as contrasted with a foreigner of different blood. The same Hebrew word is found in <a onClick="return mV(\'Lev\',16,29);">Le 16:29</a>; <a onClick="return mV(\'Lev\',18,26);">18:26</a> and elsewhere, but is translated differently. Home-born in <a onClick="return mV(\'Jer\',2,14);">Jer 2:14</a> is a translation of the phrase yelidh bayith, where it means a person free-born as contrasted with a slave.``1';
isbe[4408]='Homer`ho\'-mer (chomer): A dry measure containing about 11 bushels. It was equal to 10 ephas.`<a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`1';
isbe[4409]='Homicide`hom\'-i-sid (rotseach): Hebrew has no word for killing or murder; rotseach is the word for manslayer. The Greek for murder is phonos. Homicide was every conscious violent action against a human being with the immediate result of death. It was always to be punished by death, being considered a crime against the image of God. Killing is definitely forbidden in the sixth commandment (<a onClick="return mV(\'Gen\',9,5);">Ge 9:5</a>f; <a onClick="return mV(\'Exd\',20,13);">Ex 20:13</a>; <a onClick="return mV(\'Exd\',21,12);">21:12</a>; <a onClick="return mV(\'Lev\',24,17,21);">Le 24:17, 21</a>; <a onClick="return mV(\'Num\',35,\'16-21\');">Nu 35:16-21</a>; <a onClick="return mV(\'Deu\',19,\'11-13\');">De 19:11-13</a>). The penalty of death was not inflicted when the killing was unintentional or unpremeditated (<a onClick="return mV(\'Exd\',21,13);">Ex 21:13</a>; <a onClick="return mV(\'Num\',35,\'22-25\');">Nu 35:22-25</a>; <a onClick="return mV(\'Jos\',20,\'3-5\');">Jos 20:3-5</a>; compare Mishna, Makkoth, xi. 5). Cities of Refuge were founded to which the manslayer could escape from the "avenger of blood." There he had to abide till after the death of the officiating high priest. If he left the city before that event, the avenger who should kill him was free from punishment (<a onClick="return mV(\'Exd\',21,13);">Ex 21:13</a>; <a onClick="return mV(\'Num\',35,\'10-15\',\'25-28\',32);">Nu 35:10-15, 25-28, 32</a>; <a onClick="return mV(\'Deu\',19,\'1-13\');">De 19:1-13</a>; <a onClick="return mV(\'Jos\',20,2);">Jos 20:2</a>). See <a href="study/isbe/search.html?string=REFUGE,+CITIES+OF">CITIES OF REFUGE</A>. Killing a thief who broke in during the night was not accounted murder (<a onClick="return mV(\'Exd\',22,2);">Ex 22:2</a>). Unintentional killing of the pregnant woman in a fray was punished according to the lexicon talionis, i.e. the husband of the woman killed could kill the wife of the man who committed the offense without being punished (<a onClick="return mV(\'Exd\',21,22);">Ex 21:22</a>f). This was not usually carried out, but it gave the judge a standard by which to fine the offender. If a man failed to build a battlement to his house, and anyone fell over and was killed, blood-guiltiness came upon that man\'s house (<a onClick="return mV(\'Deu\',22,8);">Dt 22:8</A>). He who killed a thief in the daytime was guilty in the same way (<a onClick="return mV(\'Exd\',22,3);">Ex 22:3</a>; compare the King James Version). Where a body was found, but the murderer was unknown, the elders of the city nearest to the place where it was found were ordered by a prescribed ceremony to declare that they were not guilty of neglecting their duties, and were therefore innocent of the man\'s blood (<a onClick="return mV(\'Deu\',21,\'1-9\');">Dt 21:1-9</a>). Two witnesses were necessary for a conviction of murder (<a onClick="return mV(\'Num\',35,30);">Nu 35:30</a>). If a slave died under chastisement, the master was to be punished according to the principle that "he that smiteth a man, so that he dieth, shall surely be put to death" (<a onClick="return mV(\'Exd\',21,20);">Ex 21:20</a>; compare <a onClick="return mV(\'Exd\',21,12);">Ex 21:12</a>). According to the rabbis the master was to be killed by the sword. Since in this passage the phrase "he shall die" is not used, some have supposed that punishment by death is not indicated. If the slave punished by the master died after one or two days, the master was not liable to punishment (<a onClick="return mV(\'Exd\',21,21);">Ex 21:21</a>). Because of the words, "for he is his money," the rabbis held that non-Israelite slaves were meant. In ancient times the avenger of blood was himself to be the executioner of the murderer (<a onClick="return mV(\'Num\',35,19,21);">Nu 35:19, 21</a>). According to Sanhedhrin <span class="noTag">9:1</a> the murderer was to be beheaded. Nothing is said in the law about suicide.``98';
isbe[4410]='Honest; Honesty`on\'-est, on\'-es-ti: The word "honest" in the New Testament in the King James Version generally represents the adjective kalos, "good," "excellent," "honorable," and, with the exception of <a onClick="return mV(\'Luk\',8,15);">Lu 8:15</a>, "honest and good heart," is changed in the Revised Version (British and American) into the more correct "honorable" (<a onClick="return mV(\'Rom\',12,17);">Ro 12:17</a>; <a onClick="return mV(\'2Cr\',8,21);">2Co 8:21</a>; <a onClick="return mV(\'2Cr\',13,7);">13:7</a>; <a onClick="return mV(\'Phl\',4,8);">Php 4:8</a>); in <a onClick="return mV(\'1Pe\',2,12);">1Pe 2:12</a>, into "seemly." In the American Standard Revised Version "honestly" in <a onClick="return mV(\'Hbr\',13,18);">Heb 13:18</a> is rendered "honorably," and in <a onClick="return mV(\'1Th\',4,12);">1Th 4:12</a> (here euschemonos) is rendered "becomingly." The noun "honesty" occurs but once in the King James Version as the translation of semnotes (<a onClick="return mV(\'1Ti\',2,2);">1Ti 2:2</a>), and in the Revised Version (British and American) is more appropriately rendered "gravity."``132';
isbe[4411]='Honey`hun\'-i (debhash; meli): One familiar with life in Palestine will recognize in debhash the Arabic dibs, which is the usual term for a sweet syrup made by boiling down the juice of grapes, raisins, carob beans, or dates. Dibs is seldom, if ever, used as a name for honey (compare Arabic \'asal), whereas in the Old Testament debhash probably had only that meaning. The honey referred to was in most cases wild honey (<a onClick="return mV(\'Deu\',32,13);">De 32:13</a>; <a onClick="return mV(\'Jdg\',14,8,9);">Jud 14:8-9</a>; <a onClick="return mV(\'1Sa\',14,25,26,29,43);">1Sa 14:25-26, 29, 43</a>), although the offering of honey with the first-fruits would seem to indicate that the bees were also domesticated (<a onClick="return mV(\'2Ch\',31,5);">2Ch 31:5</a>). The bees constructed their honeycomb and deposited their honey in holes in the ground (<a onClick="return mV(\'1Sa\',14,25);">1Sa 14:25</a>); under rocks or in crevices between the rocks (<a onClick="return mV(\'Deu\',32,13);">De 32:13</a>; <a onClick="return mV(\'Psa\',81,16);">Ps 81:16</a>). They do the same today. When domesticated they are kept in cylindrical basket hives which are plastered on the outside with mud. The Syrian bee is an especially hardy type and a good honey producer. It is carried to Europe and America for breeding purposes.<P>In Old Testament times, as at present, honey was rare enough to be considered a luxury (<a onClick="return mV(\'Gen\',43,11);">Ge 43:11</a>; <a onClick="return mV(\'1Ki\',14,3);">1Ki 14:3</a>). Honey was used in baking sweets (<a onClick="return mV(\'Exd\',16,31);">Ex 16:31</a>). It was forbidden to be offered with the meal offering (<a onClick="return mV(\'Lev\',2,11);">Le 2:11</a>), perhaps because it was fermentable, but was presented with the fruit offering (<a onClick="return mV(\'2Ch\',31,5);">2Ch 31:5</a>). Honey was offered to David\'s army (<a onClick="return mV(\'2Sa\',17,29);">2Sa 17:29</a>). It was sometimes stored in the fields (<a onClick="return mV(\'Jer\',41,8);">Jer 41:8</a>). It was also exchanged as merchandise (<a onClick="return mV(\'Eze\',27,17);">Eze 27:17</a>). In New Testament times wild honey was an article of food among the lowly (<a onClick="return mV(\'Mat\',3,4);">Mt 3:4</a>; <a onClick="return mV(\'Mar\',1,6);">Mr 1:6</a>).<P>Figurative: "A land flowing with milk and honey" suggested a land filled with abundance of good things (<a onClick="return mV(\'Exd\',3,8,17);">Ex 3:8, 17</a>; <a onClick="return mV(\'Lev\',20,24);">Le 20:24</a>; <a onClick="return mV(\'Num\',13,27);">Nu 13:27</a>; <a onClick="return mV(\'Deu\',6,3);">De 6:3</a>; <a onClick="return mV(\'Jos\',5,6);">Jos 5:6</a>; <a onClick="return mV(\'Jer\',11,5);">Jer 11:5</a>; <a onClick="return mV(\'Eze\',20,6,15);">Eze 20:6, 15</a>). "A land of olive trees and honey" had the same meaning (<a onClick="return mV(\'Deu\',8,8);">De 8:8</a>; <a onClick="return mV(\'2Ki\',18,32);">2Ki 18:32</a>), and similarly "streams of honey and butter" (<a onClick="return mV(\'Job\',20,17);">Job 20:17</a>). Honey was a standard of sweetness (<a onClick="return mV(\'Sgs\',4,11);">So 4:11</a>; <a onClick="return mV(\'Eze\',3,3);">Eze 3:3</a>; <a onClick="return mV(\'Rev\',10,9,10);">Re 10:9-10</a>). It typified sumptuous fare (<a onClick="return mV(\'Sgs\',5,1);">So 5:1</a>; <a onClick="return mV(\'Isa\',7,15,22);">Isa 7:15, 22</a>; <a onClick="return mV(\'Eze\',16,13,19);">Eze 16:13, 19</a>). The ordinances of Yahweh were "sweeter than honey and the droppings of the honeycomb" (<a onClick="return mV(\'Psa\',19,10);">Ps 19:10</a>; <a onClick="return mV(\'Psa\',119,103);">119:103</a>). "Thou didst eat...honey" (<a onClick="return mV(\'Eze\',16,13);">Eze 16:13</a>) expressed Yahweh\'s goodness to Jerusalem.``133';
isbe[4412]='Honorable`on\'-er-a-b\'-l (kabhedh; euschemon): In the Old Testament "honorable" is for the most part the translation of kabhedh, properly, "to be heavy," "weighty" (<a onClick="return mV(\'Gen\',34,19);">Ge 34:19</a>, the Revised Version (British and American) "honored"; <a onClick="return mV(\'Num\',22,15);">Nu 22:15</a>; <a onClick="return mV(\'1Sa\',9,6);">1Sa 9:6</a>; <a onClick="return mV(\'Isa\',3,5);">Isa 3:5</a>, etc.); kabhodh, "weight," "heaviness," etc., occurs in <a onClick="return mV(\'Isa\',5,13);">Isa 5:13</a>; hodh, "beauty," "majesty," "honor" (<a onClick="return mV(\'Psa\',111,3);">Ps 111:3</a>, the Revised Version (British and American) "honor"); \'adhar, "to make honorable," "illustrious" (<a onClick="return mV(\'Isa\',42,21);">Isa 42:21</a>, "magnify the law, and make it honorable," the Revised Version margin "make the teaching great and glorious"); yaqar}, "precious" (<a onClick="return mV(\'Psa\',45,9);">Ps 45:9</a>); nasa\' panim, "lifted up of face" (<a onClick="return mV(\'2Ki\',5,1);">2Ki 5:1</a>; <a onClick="return mV(\'Isa\',3,3);">Isa 3:3</a>; <a onClick="return mV(\'Isa\',9,15);">9:15</a>); nesu phanim (<a onClick="return mV(\'Job\',22,8);">Job 22:8</a>, the Revised Version margin "he whose person is accepted"); euschemon, literally, "well fashioned," is translated <a onClick="return mV(\'Mar\',15,43);">Mr 15:43</a>, the King James Version "honorable," the Revised Version (British and American) "of honorable estate"; compare <a onClick="return mV(\'Act\',13,50);">Ac 13:50</a>; <a onClick="return mV(\'Act\',17,12);">17:12</a>; endoxos, "in glory," occurs <a onClick="return mV(\'1Cr\',4,10);">1Co 4:10</a>, the Revised Version (British and American) "glory"; timios, "weighty" (<a onClick="return mV(\'Hbr\',13,4);">Heb 13:4</a>, the Revised Version (British and American) "had in honor"); atimos, "without weight or honor" (<a onClick="return mV(\'1Cr\',12,23);">1Co 12:23</a>, "less honorable"); entimos, "in honor" (<a onClick="return mV(\'Luk\',14,8);">Lu 14:8</a>), "more honorable."<P>The Revised Version (British and American) gives for "honorable" (<a onClick="return mV(\'1Sa\',9,6);">1Sa 9:6</a>), "held in honor"; for "Yet shall I be glorious" (<a onClick="return mV(\'Isa\',49,5);">Isa 49:5</a>), "I am honorable"; "honorable" for "honest" (<a onClick="return mV(\'Rom\',12,17);">Ro 12:17</a>; <a onClick="return mV(\'2Cr\',13,7);">2Co 13:7</a>; <a onClick="return mV(\'Phl\',4,8);">Php 4:8</a>, margin "reverend"); for "honestly" (<a onClick="return mV(\'Hbr\',13,18);">Heb 13:18</a>) the American Standard Revised Version has "honorably."<P>In Apocrypha we have endoxos translated "honorable" (Tobit 12:7, the Revised Version (British and American) "gloriously"); endoxos (Judith 16:21), timios (The <span class="noTag">Wisdom of Solomon 4:8</span>), doxazo (Ecclesiasticus 24:12, the Revised Version (British and American) "glorified"), doxa (<span class="noTag">29:27</span>, the Revised Version (British and American) "honor"), etc.``185';
isbe[4413]='Hood`hood (zeniphoth): The ladies\' "hoods" of <a onClick="return mV(\'Isa\',3,23);">Isa 3:23</a> the King James Version appear as "turbans" the Revised Version (British and American); and "mitre" of <a onClick="return mV(\'Zec\',3,5);">Zec 3:5</a> is "turban, or diadem" the English Revised Version, margin. The word is from the verb zanaph, "to wrap round." It connotes a head-covering, not a permanent article of dress.`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>; <a href="./study/isbe/search.html?string=HAT">HAT</a>`1';
isbe[4414]='Hoof`hoof.`<a href="./study/isbe/search.html?string=CHEW;+CUD">CHEW</a>; <a href="./study/isbe/search.html?string=CLOVEN">CLOVEN</a>`1';
isbe[4415]='Hook`hook:<P>(1) chakkah, is rendered "fishhook" in <a onClick="return mV(\'Job\',41,1);">Job 41:1</a> the Revised Version (British and American) (the King James Version "hook"). the Revised Version (British and American) is correct here and should have used the same translation for the same word in <a onClick="return mV(\'Isa\',19,8);">Isa 19:8</a>; <a onClick="return mV(\'Hab\',1,15);">Hab 1:15</a>, instead Of retaining AV\'s "angle." Similarly in <a onClick="return mV(\'Amo\',4,2);">Am 4:2</a>, tsinnah, and ciroth dughah, appear to be synonyms for "fishhook," although the former may mean the barb of a fisher\'s spear. In the New Testament "fishhook" occurs in <a onClick="return mV(\'Mat\',17,27);">Mt 17:27</a> (agkistron).<P>(2) The "flesh-hook." (mazlegh, mizlaghah) of <a onClick="return mV(\'Exd\',27,3);">Ex 27:3</a>, etc., was probably a small pitchfork, with two or three tines.<P>(3) The "pruning-hook" (mazmerah), used in the culture of the vine (<a onClick="return mV(\'Isa\',18,5);">Isa 18:5</a>), was a sickle-shaped knife, small enough to be made from the metal of a spear-point (<a onClick="return mV(\'Isa\',2,4);">Isa 2:4</a>; <a onClick="return mV(\'Joe\',3,10);">Joe 3:10</a>; <a onClick="return mV(\'Mic\',4,3);">Mic 4:3</a>).<P>(4) waw, is the name given the supports of certain hangings of the tabernacle (<a onClick="return mV(\'Exd\',26,32);">Ex 26:32</a>, etc.). Their form is entirely obscure.<P>(5) chach, is rendered "hook" in <a onClick="return mV(\'2Ki\',19,28);">2Ki 19:28</a> = <a onClick="return mV(\'Isa\',37,29);">Isa 37:29</a>; <a onClick="return mV(\'Eze\',29,4);">Eze 29:4</a>; <a onClick="return mV(\'Eze\',38,4);">38:4</a>, and <a onClick="return mV(\'Eze\',19,4,9);">Eze 19:4, 9</a> the Revised Version (British and American) (the King James Version "chain"). A ring (compare <a onClick="return mV(\'Exd\',35,22);">Ex 35:22</a>), put in the nose of a tamed beast and through which a rope is passed to lead him, is probably meant.<P>(6) \'aghmon, is rendered "hook" in <a onClick="return mV(\'Job\',41,2);">Job 41:2</a> the King James Version, but should be "a rope" of rushes or rush-fiber as in the Revised Version (British and American), or, simply, "a rush" (on which small fish are strung).<P>(7) choach, is "hook" in <a onClick="return mV(\'Job\',41,2);">Job 41:2</a> the Revised Version (British and American) (the King James Version "thorn," perhaps right) and <a onClick="return mV(\'2Ch\',33,11);">2Ch 33:11</a> the Revised Version margin (text chains," Ay "thorns,"). On both verses see the commentaries<P>(8) shephattayim, is "hooks" in <a onClick="return mV(\'Eze\',40,43);">Eze 40:43</a> (the Revised Version margin "ledges"), but the meaning of this word is completely unknown, and "hook" is a mere guess.``48';
isbe[4416]='Hoopoe`hoo\'-po; -poo (dukhiphath; epops; Latin Upupa epops): One of the peculiar and famous birds of Palestine, having a curved bill and beautiful plumage. It is about the size of a thrush. Its back is a rich cinnamon color, its head golden buff with a crest of feathers of gold, banded with white and tipped with black, that gradually lengthen as they cover the head until, when folded, they lie in lines of black and white, and, when erect, each feather shows its exquisite marking. Its wings and tail are black banded with white and buff. It nests in holes and hollow trees. All ornithologists agree that it is a "nasty, filthy bird" in its feeding and breeding habits. The nest, being paid no attention by the elders, soon becomes soiled and evil smelling. The bird is mentioned only in the lists of abomination (<a onClick="return mV(\'Lev\',11,19);">Le 11:19</a>; and <a onClick="return mV(\'Deu\',14,18);">De 14:18</a>). One reason why Moses thought it unfit for food was on account of its habits. Quite as strong a one lay in the fact that it was one of the sacred birds of Egypt. There the belief was prevalent that it could detect water and indicate where to dig a well; that it could hear secrets and cure diseases. Its head was a part of the charms used by witches. The hoopoe was believed to have wonderful medicinal powers and was called the "Doctor Bird" by the arabs. Because it is almost the size of a hoopoe and somewhat suggestive of it in its golden plumage, the lapwing was used in the early translations of the Bible instead of hoopoe. But when it was remembered that the lapwing is a plover, its flesh and eggs especially dainty food, that it was eaten everywhere it was known, modern commentators rightly decided that the hoopoe was the bird intended by the Mosaic law. It must be put on record, however, that where no superstition attaches to the hoopoe and where its nesting habits are unknown and its feeding propensities little understood, as it passes in migration it is killed, eaten and considered delicious, especially by residents of Southern Europe.``167';
isbe[4417]='Hope`hop:<P>1. In the Old Testament:<P>In the Revised Version (British and American) the New Testament "hope" represents the noun elpis (52 times), and the verb elpizo (31 times). King James Version, however, renders the noun in <a onClick="return mV(\'Hbr\',10,23);">Heb 10:23</a> by "faith," and for the verb gives "trust" in 18 cases (apparently without much system, e.g. in <a onClick="return mV(\'Phl\',2,\'1-\');">Php 2</a> compare <a onClick="return mV(\'Phl\',2,19);">2:19</A> and <a onClick="return mV(\'Phl\',2,23);">23</A>; see <a href="study/isbe/search.html?string=TRUST,+BREACH+OF">TRUST</a>), while in <a onClick="return mV(\'Luk\',6,35);">Lu 6:35</a> it translates apelpizo, by "hoping for nothing again" (the Revised Version (British and American) "never despairing"). But in the Old Testament there is no Hebrew word that has the exact force of "expectation of some good thing," so that in the King James Version "hope" (noun and vb.) stands for some 15 Hebrew words, nearly all of which in other places are given other translation (e.g. mibhtach, is rendered "hope" in <a onClick="return mV(\'Jer\',17,17);">Jer 17:17</a>, "trust" in <a onClick="return mV(\'Psa\',40,4);">Ps 40:4</a>, "confidence" in <a onClick="return mV(\'Psa\',65,5);">Ps 65:5</a>). the Revised Version (British and American) has attempted to be more systematic and has, for the most part, kept "hope" for the noun tiqwah, and the verb yachal, but complete consistency was not possible (e.g. <a onClick="return mV(\'Pro\',10,28);">Pr 10:28</a>; <a onClick="return mV(\'Pro\',11,23);">11:23</a>; <a onClick="return mV(\'Pro\',23,18);">23:18</a>). This lack of a specific word for hope has nothing to do with any undervaluation of the virtue among the Hebrews. For the religion of the Old Testament is of all things a religion of hope, centered in God, from whom all deliverance and blessings are confidently expected (<a onClick="return mV(\'Jer\',17,17);">Jer 17:17</a>; <a onClick="return mV(\'Joe\',3,16);">Joe 3:16</a>; <a onClick="return mV(\'Psa\',31,24);">Ps 31:24</a>; <a onClick="return mV(\'Psa\',33,18,22);">33:18, 22</a>; <a onClick="return mV(\'Psa\',39,7);">39:7</a>, etc.). The varieties of this hope arc countless (see <a href="study/isbe/search.html?string=ISRAEL,+RELIGION+OF,+1">ISRAEL, RELIGION OF</a>; <a href="study/isbe/search.html?string=SALVATION">SALVATION</a>, etc.), but the form most perfected and with fundamental significance for the New Testament is the firm trust that at a time appointed God, in person or through His representative (see <a href="study/isbe/search.html?string=MESSIAH">MESSIAH</a>), will establish a kingdom of righteousness.<P>2. In the New Testament:<P>(1) The proclamation of this coming kingdom of God was the central element in the teaching of Jesus, and the message of its near advent (<a onClick="return mV(\'Mar\',1,15);">Mr 1:15</a>, etc.), with the certainty of admission to it for those who accepted His teaching (<a onClick="return mV(\'Luk\',12,32);">Lu 12:32</a>, etc.), is the substance of His teaching as to hope. This teaching, though, is delivered in the language of One to whom the realities of the next world and of the future are perfectly familiar; the tone is not that of prediction so much as it is that of the statement of obvious facts. In other words, "hope" to Christ is "certainty," and the word "hope" is never on His lips (<a onClick="return mV(\'Luk\',6,34);">Lu 6:34</a> and <a onClick="return mV(\'Jhn\',5,45);">Joh 5:45</a> are naturally not exceptions). For the details see <a href="study/isbe/search.html?string=KINGDOM+OF+GOD">KINGDOM OF GOD</A>; <a href="study/isbe/search.html?string=FAITH">FAITH</a>; <a href="study/isbe/search.html?string=FORGIVENESS">FORGIVENESS</a>, etc. And however far He may have taught that the kingdom was present in His lifetime, none the less the full consummation of that kingdom, with Himself as Messiah, was made by Him a matter of the future (see <a href="study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT,+I-V">ESCHATOLOGY OF THE NEW TESTAMENT</a>; <a href="study/isbe/search.html?string=PAROUSIA">PAROUSIA</a>).<P>(2) Hence, after the ascension the early church was left with an eschatological expectation that was primarily and almost technically the "hope" of the New Testament—"looking for the blessed hope and appearing of the glory of the great God and our Saviour Jesus Christ" (<a onClick="return mV(\'Tts\',2,13);">Tit 2:13</a>), "unto a living hope ...., unto an inheritance incorruptible, and undefiled,...reserved in heaven for you, who by the power of God are guarded through faith unto a salvation ready to be revealed in the last time" (<a onClick="return mV(\'1Pe\',13,\'1-\');">1Pe 13-5</a>; compare <a onClick="return mV(\'Rom\',5,2);">Ro 5:2</a>; <a onClick="return mV(\'Rom\',8,\'20-24\');">8:20-24</a>; <a onClick="return mV(\'2Cr\',3,12);">2Co 3:12</a>; <a onClick="return mV(\'Eph\',1,\'18-21\');">Eph 1:18-21</a>; <a onClick="return mV(\'Col\',1,5,,23,27);">Col 1:5, 23, 27</a>; <a onClick="return mV(\'Tts\',1,2);">Tit 1:2</a>; <a onClick="return mV(\'Tts\',3,7);">3:7</a>; <a onClick="return mV(\'1Jo\',3,2,3);">1Joh 3:2-3</a>). The foundations of this hope were many:<P>(a) Primarily, of course, the promises of the Old Testament, which were the basis of Christ\'s teaching. Such are often quoted at length (<a onClick="return mV(\'Act\',2,16);">Ac 2:16</a>, etc.), while they underlie countless other passages. These promises are the "anchor of hope" that holds the soul fast (<a onClick="return mV(\'Hbr\',6,\'18-20\');">Heb 6:18-20</a>). In part, then, the earliest Christian expectations coincided with the Jewish, and the "hope of Israel" (<a onClick="return mV(\'Act\',28,20);">Ac 28:20</a>; compare <a onClick="return mV(\'Act\',26,6,7);">26:6,7</a>; <a onClick="return mV(\'Eph\',2,12);">Eph 2:12</a>, and especially <a onClick="return mV(\'Rom\',11,\'25-32\');">Ro 11:25-32</a>) was a common ground on which Jew and Christian might meet. Still, through the confidence of forgiveness and purification given in the atonement (<a onClick="return mV(\'Hbr\',9,14);">Heb 9:14</a>, etc.), the Christian felt himself to have a "better hope" (<a onClick="return mV(\'Hbr\',7,19);">Heb 7:19</a>), which the Jew could not know.<P>(b) Specifically Christian, however, was the pledge given in the resurrection of Christ. This sealed His Messiahship and proved His lordship (<a onClick="return mV(\'Rom\',1,4);">Ro 1:4</a>; <a onClick="return mV(\'Eph\',1,\'18-20\');">Eph 1:18-20</a>; <a onClick="return mV(\'1Pe\',3,21);">1Pe 3:21</a>, etc.), so sending forth His followers with the certainty of victory. In addition, Christ\'s resurrection was felt to be the first step in the general resurrection, and hence, a proof that the consummation of all things had begun (<a onClick="return mV(\'1Cr\',15,23);">1Co 15:23</a>; compare <a onClick="return mV(\'Act\',23,6);">Ac 23:6</a>; <a onClick="return mV(\'Act\',24,15);">24:15</a>; <a onClick="return mV(\'Act\',26,6,7);">26:6-7</a>; <a onClick="return mV(\'1Th\',4,13,14);">1Th 4:13-14</a>, etc.).<P>(c) But more than all, devotion to Christ produced a religious experience that gave certainty to hope. "Hope putteth not to shame; because the love of God hath been shed abroad in our hearts through the Holy Spirit which was given unto us" (<a onClick="return mV(\'Rom\',5,5);">Ro 5:5</a>; compare <a onClick="return mV(\'Rom\',8,16,17);">8:16,17</A>; <a onClick="return mV(\'2Cr\',1,22);">2Co 1:22</a>; <a onClick="return mV(\'2Cr\',5,5);">5:5</a>; <a onClick="return mV(\'Eph\',1,14);">Eph 1:14</a>, etc., and see <a href="study/isbe/search.html?string=HOLY+SPIRIT,+1">HOLY SPIRIT</a>). Even visible miracles were wrought by the Spirit that were signs of the end (<a onClick="return mV(\'Act\',2,17);">Ac 2:17</a>) as well as of the individual\'s certainty of partaking in the final happiness (<a onClick="return mV(\'Act\',10,47);">Ac 10:47</a>; <a onClick="return mV(\'Act\',19,6);">19:6</a>, etc.).<P>(3) Yet, certain though the hope might be, it was not yet attained, and the interim was an opportunity to develop faith, "the substance of the things hoped for" (<a onClick="return mV(\'Hbr\',11,1);">Heb 11:1</a>). Indeed, hope is simply faith directed toward the future, and no sharp distinction between faith and hope is attainable. It is easy enough to see how the King James Version felt "confession of our faith" clearer than "confession of our hope" in <a onClick="return mV(\'Hbr\',10,23);">Heb 10:23</a>, although the rendition of elpis by "faith" was arbitrary. So in <a onClick="return mV(\'Rom\',8,\'20-24\');">Ro 8:20-24</a>, "hope" is scarcely more than "faith" in this specialized aspect. In particular, in <a onClick="return mV(\'Rom\',8,24);">8:24</a> we have as the most natural translation (compare <a onClick="return mV(\'Eph\',2,5,8);">Eph 2:5, 8</a>), "By hope we were saved" (so the King James Version, the English Revised Version, the American Revised Version margin), only a pedantic insistence on words can find in this any departure from the strictest Pauline theology (compare the essential outlook on the future of the classic example of "saving faith" in <a onClick="return mV(\'Rom\',4,\'18-22\');">Ro 4:18-22</a>, especially verse <a onClick="return mV(\'Rom\',4,18);">18</a>). Still, the combination is unusual, and the Greek may be rendered equally well "For hope we were saved" ("in hope" of the American Standard Revised Version is not so good); i.e. our salvation, in so far as it is past, is but to prepare us for what is to come (compare <a onClick="return mV(\'Eph\',4,4);">Eph 4:4</a>; <a onClick="return mV(\'1Pe\',1,3);">1Pe 1:3</a>). But this postponement of the full attainment, through developing faith, gives stedfastness (<a onClick="return mV(\'Rom\',8,25);">Ro 8:25</a>; compare <a onClick="return mV(\'1Th\',1,3);">1Th 1:3</a>; <a onClick="return mV(\'1Th\',5,8);">5:8</a>; <a onClick="return mV(\'Hbr\',3,6);">Heb 3:6</a>; <a onClick="return mV(\'Hbr\',6,11);">6:11</a>), which could be gained in no other way. On the other hand this stedfastness, produced by hope, reacts again on hope and increases it (<a onClick="return mV(\'Rom\',5,4);">Ro 5:4</a>; <a onClick="return mV(\'Rom\',15,4);">15:4</a>). and so on. But no attempt is made in the New Testament to give a catalogue of the "fruits of hope," and, indeed, such lists are inevitably artificial.<P>(4) One passage that deserves special attention is <a onClick="return mV(\'1Cr\',13,13);">1Co 13:13</a>, "Now abideth faith, hope, love, these three." "Abideth" is in contrast to "shall be done away" in <a onClick="return mV(\'1Cr\',13,8,9);">13:8,9</a>, and the time of the abiding is consequently after the Parousia; i.e. while many gifts are for the present world only, faith, hope and love are eternal and endure in the next world. <a onClick="return mV(\'1Cr\',13,\'1-\');">1Co 13</a> is evidently a very carefully written section, and the permanence of faith and hope cannot be set down to any mere carelessness on Paul\'s part, but the meaning is not very clear. Probably he felt that the triad of virtues was so essentially a part of the Christian\'s character that the existence of the individual without them was unthinkable, without trying to define what the object of faith and hope would be in the glorified state. If any answer is to be given, it must be found in the doctrine that even in heaven life will not be static but will have opportunities of unlimited growth. Never will the finite soul be able to dispense entirely with faith, while at each stage the growth into the next can be anticipated through hope.<P>3. Practical:<P>Only adventist bodies can use all the New Testament promises literally, and the translation of the eschatological language into modern practical terms is not always easy. The simplest method is that already well developed in the Fourth Gospel, where the phrase "kingdom of God" is usually replaced by the words "eternal life," i.e. for a temporal relation between this world and the next is substituted a local, so that the accent is laid on the hope that awaits the individual beyond the grave. On the other hand, the cataclysmic imagery of the New Testament may be interpreted in evolutionary form. God, by sending into the world the supernatural power seen in the Christian church, is working for the race as well as for the individual, and has for His whole creation, as well as for individual souls, a goal in store. The individual has for his support the motives of the early church and, in particular, learns through the cross that even his own sins shall not disappoint him of his hope. But both of the above interpretations are needed if religion is fairly to represent the spirit of the New Testament. A pure individualism that looks only beyond the grave for its hope empties the phrase "kingdom of God" of its meaning and tends inevitably to asceticism. And, in contrast, the religion of Jesus cannot be reduced to a mere hope of ethical advance for the present world. A Christianity that loses a transcendent, eschatological hope ceases to be Christianity.``48';
isbe[4418]='Hophni And Phinehas`hof\'-ni, fin\'-e-as, -az (chophni, "pugilist" (?), pinechac, probably "face of brass"): Sons of Eli, priests of the sanctuary at Shiloh. Their character was wicked enough to merit the double designation "sons of Eli" and (the King James Version) "sons of Belial" (the Revised Version, margin "base men," <a onClick="return mV(\'1Sa\',2,12);">1Sa 2:12</a>). Their evil practices are described (<a onClick="return mV(\'1Sa\',2,\'12-17\');">1Sa 2:12-17</a>). Twice is Eli warned concerning them, once by an unknown prophet (<a onClick="return mV(\'1Sa\',2,27);">1Sa 2:27</a>) and again by the lips of the young Samuel (<a onClick="return mV(\'1Sa\',3,\'11-18\');">1Sa 3:11-18</a>). The curse fell at the battle of Aphek (<a onClick="return mV(\'1Sa\',4,\'1-18\');">1Sa 4:1-18</a>) at which the brothers were slain, the ark was taken and the disaster occurred which caused Eli\'s death. Phinehas was father of the posthumous Ichabod, whose name marks the calamity (see <a href="study/isbe/search.html?string=ICHABOD">ICHABOD</a>). A remoter sequel to the prophetic warnings is seen in the deposition of Abiathar, of the house of Eli, from the priestly office (<a onClick="return mV(\'1Ki\',2,26,27,35);">1Ki 2:26-27, 35</a>).``186';
isbe[4419]='Hophra`hof\'-ra.`<a href="./study/isbe/search.html?string=PHARAOH+HOPHRA">PHARAOH HOPHRA</a>`1';
isbe[4420]='Hor, Mount`hor (hor ha-har; literally, "Hor, the mountain"):<P>1. Not Jebel Neby Harun:<P>(1) a tradition identifying this mountain with Jebel Neby Harun may be traced from the time of Josephus (Ant., IV, iv, 7) downward. Eusebius, Onomasticon (s.v. Hor) favors this identification, which has been accepted by many travelers and scholars. In HDB, while noting the fact that it has been questioned, Professor Hull devotes all the space at his disposal to a description of Jebel Neby Harun. It is now recognized, however, that this identification is impossible. Niebuhr (Reise nach Arabic, 238), Pocoke (Description of the East, I, 157), Robinson (BR, I, 185), Ewald (Hist. of Israel, II, 201, note), and others had pointed out difficulties in the way, but the careful discussion of Dr. H. Clay Trumbull (Kadesh Barnea, 127ff) finally disposed of the claims of Jebel Neby Harun.<P>2. Suggested Identification:<P>From <a onClick="return mV(\'Num\',20,22);">Nu 20:22</a>; <a onClick="return mV(\'Num\',33,37);">33:37</a> we may perhaps infer that Mt. Hor, "in the edge of the land of Edom," was about a day\'s journey from Kadesh. The name "Hor the mountain" suggests a prominent feature of the landscape. Aaron was buried there (<a onClick="return mV(\'Num\',20,28);">Nu 20:28</a>; <a onClick="return mV(\'Deu\',32,50);">De 32:50</a>). It was therefore not in Mt. Seir (<a onClick="return mV(\'Deu\',2,5);">De 2:5</a>), of which not even a foot-breadth was given to Israel. Jebel Neby Harun is certainly a prominent feature of the landscape, towering over the tumbled hills that form the western edges of the Edom plateau to a height of 4,800 ft. But it is much more than a day\'s journey from Kadesh, while it is well within the boundary of Mt. Seir. The king of Arad was alarmed at the march to Mt. Hor. Had Israel marched toward Jebel Neby Harun, away to the southeast, it could have caused him no anxiety, as he dwelt in the north.<P>3. Jebel Maderah:<P>This points to some eminence to the north or northeast of Kadesh. A hill meeting sufficiently all these conditions is Jebel Maderah (see <a href="study/isbe/search.html?string=HALAK,+MOUNT">HALAK, MOUNT</a>), which rises to the northeast of \'Ain qadis (Kadeshbarnea). It stands at the extreme northwest boundary of the land of Edom, yet not within that boundary. Above the barrenness of the surrounding plain this "large, singular-looking, isolated chalk hill" rises "alone like a lofty citadel," "steep-sided" and "quite naked." Here the solemn transactions described in <a onClick="return mV(\'Num\',20,22);">Nu 20:22</a>ff could have been carried out literally, "in the sight of all the congregation." While certainty is impossible, no more likely suggestion has been made.<P>(2) A mountain named only in <a onClick="return mV(\'Num\',34,7);">Nu 34:7</a>f as on the north boundary of the land of Israel. No success has attended the various attempts made to identify this particular height. Some would make it Mt. Hermon (Hull, HDB, under the word); others Jebel Akkar, an outrunner on the northeast of Lebanon (Furrer, ZDPV, VIII, 27), and others the mountain at the "knee of" Nahr el-Qasimiyeh (van Kasteren, Rev. Biblical,1895,30f). In <a onClick="return mV(\'Eze\',47,15);">Eze 47:15</a> ha-derekh, should certainly be amended to chadhrakh, a proper name, instead of "the way." Possibly then Mt. Hor should disappear from <a onClick="return mV(\'Num\',34,7);">Nu 34:7</a>f; and we should read, with slight emendation, "From the great sea ye shall draw a line for you as far as Hadrach, and from Hadrach ...."``54';
isbe[4421]='Hor-Haggidgad`hor-ha-gid\'-gad (chor ha-gidhgadh): A desert camp of the Israelites between Beeroth Bene-jaakan and Jotbathah (<a onClick="return mV(\'Num\',33,32);">Nu 33:32</a>f). In <a onClick="return mV(\'Deu\',10,7);">De 10:7</a> it is called Gudgodah.`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[4422]='Horam`ho\'-ram (horam, "height"): a king of Gezer defeated by Joshua when he came to the help of Lachish, which Joshua was besieging (<a onClick="return mV(\'Jos\',10,33);">Jos 10:33</a>).``1';
isbe[4423]='Horeb`ho\'-reb.`<a href="./study/isbe/search.html?string=SINAI">SINAI</a>`1';
isbe[4424]='Horem`ho\'-rem (chorem, "consecrated"): One of the fenced cities in the territory of Naphtali (<a onClick="return mV(\'Jos\',19,38);">Jos 19:38</a>), named with Iron and Migdal-el. It may possibly be identified with the modern Hurah, which lies on a mound at the south end of Wady el-\'Ain, to the west of Qedes.``1';
isbe[4425]='Horesh`ho\'-resh (choreshah, <a onClick="return mV(\'1Sa\',23,15,18);">1Sa 23:15, 18</a>, margin only; Septuagint en Te Kaine, "in the New"; English Versions of the Bible "in the wood" (ba-choreshdh), the particle "in" being combined with the article): Choresh in other passages is translated "forest" (compare <a onClick="return mV(\'2Ch\',27,4);">2Ch 27:4</a>; <a onClick="return mV(\'Isa\',17,9);">Isa 17:9</a>; <a onClick="return mV(\'Eze\',31,3);">Eze 31:3</a>) and it is most probable that it should be so translated here.``1';
isbe[4426]='Hori`ho\'-ri (chori, "cave-dweller"):<P>(1) A Horite descendant of Esau (<a onClick="return mV(\'Gen\',36,22);">Ge 36:22</a>; <a onClick="return mV(\'1Ch\',1,39);">1Ch 1:39</a>).<P>(2) A Simonite, father of Shaphat, one of the twelve spies (<a onClick="return mV(\'Num\',13,5);">Nu 13:5</a>).``1';
isbe[4427]='Horite; Horim`ho\'-rit, ho\'-rim (chori, chorim; Chorraioi): Denoted the inhabitants of Mt. Seir before its occupation by the Edomites (<a onClick="return mV(\'Deu\',2,12);">De 2:12</a>). Seir is accordingly called Horite in <a onClick="return mV(\'Gen\',36,20,30);">Ge 36:20, 30</a>, where a list of his descendants is given, who afterward mixed with the invading Edomites. Esau himself married the daughter of the Horite chieftain Anah (<a onClick="return mV(\'Gen\',36,25);">Ge 36:25</a>; see <a onClick="return mV(\'Gen\',36,2);">36:2</A>, where "Hivite" must be corrected into "Horite"). The "Horites" in their "Mt. Seir" were among the nations defeated by the army of Chedorlaomer in the age of Abraham (<a onClick="return mV(\'Gen\',14,6);">Ge 14:6</a>). The Hebrew Horitc, however, is the Khar of the Egyptian inscriptions, a name given to the whole of Southern Palestine and Edom as well as to the adjacent sea. In accordance with this we find in the Old Testament also traces of the existence of the Horites in other parts of the country besides Mt. Seir. In <a onClick="return mV(\'Gen\',34,2);">Ge 34:2</a>; <a onClick="return mV(\'Jos\',9,7);">Jos 9:7</a>, the Septuagint (Cod. A) more correctly reads "Horite" instead of "Hivite" for the inhabitants of Shechem and Gibeon, and Caleb is said to be "the son of Hur, the first-born of Ephratah" or Bethlehem (<a onClick="return mV(\'1Ch\',2,50);">1Ch 2:50</a>; <a onClick="return mV(\'1Ch\',4,4);">4:4</a>). Hor or Horite has sometimes been explained to mean "cave-dweller"; it more probably, however, denotes the "white" race. The Horites were Semites, and consequently are distinguished in <a onClick="return mV(\'Deu\',2,12);">De 2:12</a> from the tall race of Rephaim.``157';
isbe[4428]='Hormah`hor\'-ma (chormah): A city first mentioned in connection with the defeat of the Israelites by the Amalekites and the Canaanites, when, after the ten spies who brought an evil report of the land had died of plague, the people persisted, against the will of Moses, in going "up unto the place which Yahweh hath promised" (<a onClick="return mV(\'Num\',14,45);">Nu 14:45</a>; <a onClick="return mV(\'Deu\',1,44);">De 1:44</a>). after the injury done them by the king of Arad, Israel took the city, utterly destroyed it, and called it Hormah, i, e. "accursed" (<a onClick="return mV(\'Num\',21,3);">Nu 21:3</a>). To this event probably the reference is in <a onClick="return mV(\'Jdg\',1,17);">Jud 1:17</a>; where Judah and Simeon are credited with the work. In <a onClick="return mV(\'Jos\',12,14);">Jos 12:14</a> it is named between Geder and Arad; in <a onClick="return mV(\'Jos\',15,30);">Jos 15:30</a> between Chesil and Ziklag, among the uttermost cities toward the border of Edom in the south; and in <a onClick="return mV(\'Jos\',19,4);">Jos 19:4</a> between Bethul and Ziklag (compare <a onClick="return mV(\'1Ch\',4,30);">1Ch 4:30</a>). To it David sent a share of the spoil taken from the Amalekites who had raided Ziklag (<a onClick="return mV(\'1Sa\',30,30);">1Sa 30:30</a>). The city must have lain not far from Kadesh, probably to the northeast. No name resembling Hormah has been recovered in that district. The ancient name was Zephath (<a onClick="return mV(\'Jdg\',1,17);">Jud 1:17</a>). It is not unlikely that in popular use this name outlived Hormah: and in some form it may survive to this day. In that case it may be represented by the modern ec-Cabaita between el-Khalaca in the north and \'Ain Qadis in the south, about 23 miles from the latter. If we may identify Ziklag with \'Asluj, about 14 miles north of ec-Cabaita, the probability is heightened. Robinson (BR, III, 150) compares the name Zephath with that of Naqb ec-Cafa, to the north of Wady el-Fiqrah; but this appears to be too far—about 40 miles—from Kadesh.``54';
isbe[4429]='Horn`horn (Hebrew and Aramaic qeren; keras; for the "ram\'s horn" (yobhel) of <a onClick="return mV(\'Jos\',6,\'1-\');">Jos 6</a> see <a href="study/isbe/search.html?string=MUSIC">MUSIC</a>, and for the "<a href="./study/isbe/search.html?string=INK-HORN">inkhorn</a>" of <a onClick="return mV(\'Eze\',9,\'1-\');">Ezekiel 9</a> (qeceth) see separate article):<P>(1) Qeren and keras represent the English "horn" exactly, whether on the animal (<a onClick="return mV(\'Gen\',22,13);">Ge 22:13</a>), or used for musical purposes (<a onClick="return mV(\'Jos\',6,5);">Jos 6:5</a>; <a onClick="return mV(\'1Ch\',25,5);">1Ch 25:5</a>), or for containing a liquid (<a onClick="return mV(\'1Sa\',16,1,13);">1Sa 16:1, 13</a>; <a onClick="return mV(\'1Ki\',1,39);">1Ki 1:39</a>), but in <a onClick="return mV(\'Eze\',27,15);">Eze 27:15</a> the horns of ivory are of course tusks and the "horns" of ebony are small (pointed?) logs. Consequently most of the usages require no explanation.<P>(2) Both the altar of burnt offering (<a onClick="return mV(\'Exd\',27,2);">Ex 27:2</a>; <a onClick="return mV(\'Exd\',38,2);">38:2</a>; compare <a onClick="return mV(\'Eze\',43,15);">Eze 43:15</a>) and the incense altar (<a onClick="return mV(\'Exd\',30,2);">Ex 30:2</a>; <a onClick="return mV(\'Exd\',37,25,26);">37:25-26</a>; compare <a onClick="return mV(\'Rev\',9,13);">Re 9:13</a>) had "horns," which are explained to be projections "of one piece with" the wooden framework and covered with the brass (or gold) that covered the altar. They formed the most sacred part of the altar and were anointed with the blood of the most solemn sacrifices (only) (<a onClick="return mV(\'Exd\',30,10);">Ex 30:10</a>; <a onClick="return mV(\'Lev\',4,7,18,25,30,34);">Le 4:7, 18, 25, 30, 34</a>; <a onClick="return mV(\'Lev\',16,18);">16:18</a>; compare <a onClick="return mV(\'Eze\',43,20);">Eze 43:20</a>), and according to <a onClick="return mV(\'Lev\',8,15);">Le 8:15</a>; <a onClick="return mV(\'Lev\',9,9);">9:9</a>, the first official sacrifices began by anointing them. Consequently cutting off the horns effectually desecrated the altar (<a onClick="return mV(\'Amo\',3,14);">Am 3:14</a>), while "sin graven on them" (<a onClick="return mV(\'Jer\',17,1);">Jer 17:1</a>) took all efficacy from the sacrifice. On the other hand they offered the highest sanctuary (<a onClick="return mV(\'1Ki\',1,50,51);">1Ki 1:50-51</a>; <a onClick="return mV(\'1Ki\',2,28);">2:28</a>). Of their symbolism nothing whatever is said, and the eventual origin is quite obscure. "Remnants of a bull-cult" and "miniature sacred towers" have been suggested, but are wholly uncertain. A more likely origin is from an old custom of draping the altar with skins of sacrificed animals (RS, 436). That, however, the "horns" were mere conveniences for binding the sacrificial animals (<a onClick="return mV(\'Psa\',118,27);">Ps 118:27</a>, a custom referred to nowhere else in the Old Testament), is most unlikely.<P>See <a href="study/isbe/search.html?string=ALTAR">ALTAR</a>.<P>(3) The common figurative use of "horn" is taken from the image of battling animals (literal use in <a onClick="return mV(\'Dan\',8,7);">Da 8:7</a>, etc.) to denote aggressive strength. So Zedekiah ben Chenaanah illustrates the predicted defeat of the enemies by pushing with iron horns (<a onClick="return mV(\'1Ki\',22,11);">1Ki 22:11</a>; <a onClick="return mV(\'2Ch\',18,10);">2Ch 18:10</a>), while "horns of the wild ox" (<a onClick="return mV(\'Deu\',33,17);">De 33:17</a>; <a onClick="return mV(\'Psa\',22,21);">Ps 22:21</a>; <a onClick="return mV(\'Psa\',92,10);">92:10</a>, the King James Version "unicorn") represent the magnitude of power, and in <a onClick="return mV(\'Zec\',1,\'18-21\');">Zec 1:18-21</a> "horns" stand for power in general. In <a onClick="return mV(\'Hab\',3,4);">Hab 3:4</a> the "horns coming out of his hand" denote the potency of Yahweh\'s gesture (the Revised Version (British and American) "rays" may be smoother, but is weak). So to "exalt the horn" (<a onClick="return mV(\'1Sa\',2,1,10);">1Sa 2:1, 10</a>; <a onClick="return mV(\'Psa\',75,4);">Ps 75:4</a>, etc.) is to clothe with strength, and to "cut off the horn" (not to be explained by <a onClick="return mV(\'Amo\',3,14);">Am 3:14</a>) is to rob of power (<a onClick="return mV(\'Psa\',75,10);">Ps 75:10</a>; <a onClick="return mV(\'Jer\',48,25);">Jer 48:25</a>). Hence, the "horn of salvation" in <a onClick="return mV(\'2Sa\',22,3);">2Sa 22:3</a>; <a onClick="return mV(\'Psa\',18,2);">Ps 18:2</a>; <a onClick="return mV(\'Luk\',1,69);">Lu 1:69</a> is a means of active defense and not a place of sanctuary as in <a onClick="return mV(\'1Ki\',1,50);">1Ki 1:50</a>. When, in <a onClick="return mV(\'Dan\',7,\'7-24\');">Da 7:7-24</a>; <a onClick="return mV(\'Dan\',8,3,8,9,20,21);">8:3, 8-9, 20-21</a>; <a onClick="return mV(\'Rev\',13,1);">Re 13:1</a>; <a onClick="return mV(\'Rev\',17,3,7,12,16);">17:3, 7, 12, 16</a>, many horns are given to the same animal, they figure successive nations or rulers. But the seven horns in <a onClick="return mV(\'Rev\',5,6);">Re 5:6</a>; <a onClick="return mV(\'Rev\',12,3);">12:3</a> denote the completeness of the malevolent or righteous power. In <a onClick="return mV(\'Rev\',13,11);">Re 13:11</a>, however, the two horns point only to the external imitation of the harmless lamb, the "horns" being mere stubs.``48';
