 so, it is quite conceivable that his words would be treasured by the God-fearing men among his followers and successors, in that unbroken line of prophetic men to whose existence both Amos and Hosea appealed, and that they should be found coming to expression at the very dawn of written prophecy. Undoubtedly these two prophets took such a view, and regarded Moses as the first and greatest Deuteronomist.<P>LITERATURE.<P>Harper, "Minor Prophets," in ICC; Keil, "Minor Prophets," in Clark\'s For. Theol. Library; Huxtable, "Hosea," in Speaker\'s Comm.; Cheyne, "Hosea," in Cambridge Bible; Pusey, Minor Prophets; Robertson Smith, Prophets of Israel; G. A. Smith, "The Book of the Twelve," in Expositor\'s Bible; Horton, "\'Hosea," in Century Bible; Farrar, "Minor Prophets," in Men of the Bible; A. B. Davidson, article "Hosea" in HDB; Cornill, The Prophets of Israel, English translation, Chicago, 1897; Valeton, Amos en Hosea; Nowack, "Die kleinen Propheten," in Hand-Comm. z. Altes Testament; Marti, Dodekapropheton in Kurz. Hand-Comm.``151';
isbe[4448]='Hosen`ho\'-z\'-n.`<a href="./study/isbe/search.html?string=BREECHES">BREECHES</a>`1';
isbe[4449]='Hoshaiah`ho-sha\'-ya (hosha\'yah, "whom Yahweh helpeth"):<P>(1) Father of Jezaniah (probably = Azariah, so the Septuagint; compare <a onClick="return mV(\'Jer\',42,1);">Jer 42:1</a> and <a onClick="return mV(\'Jer\',43,2);">43:2</A> with <a onClick="return mV(\'2Ki\',25,23);">2Ki 25:23</a> and note similar letters in names in Hebrew), who with other leaders antagonized the policy and counsel of Jeremiah after the fall of Jerusalem (<a onClick="return mV(\'Jer\',42,\'1-\');">Jer 42:1</a>-<a onClick="return mV(\'Jer\',43,\'1-7\');">43:7</a>).<P>(2) A man, probably of Judah, who led half of the princes of Judah in procession at the dedication of the wall of Jerusalem (<a onClick="return mV(\'Neh\',12,32);">Ne 12:32</a>).``1';
isbe[4450]='Hoshama`hosh\'-a-ma, ho-sha\'-ma (hoshama\', abbreviated from yehoshama\', "whom Yahweh heareth"): One of the sons or descendants of Jeconiah, the captive king of Judah (<a onClick="return mV(\'1Ch\',3,18);">1Ch 3:18</a>).``1';
isbe[4451]='Hoshea`ho-she\'-a (hoshea\', "salvation"; Hosee, <a onClick="return mV(\'2Ki\',17,\'1-9\');">2Ki 17:1-9</a>):<P>1. A Satrap of Assyria:<P>Son of Elah, the 19th and last king of Israel. The time was one of social revolution and dynastic change. Of the last five kings of Israel, four had met their deaths by violence. Hoshea himself was one of these assassins (<a onClick="return mV(\'2Ki\',15,30);">2Ki 15:30</a>), and the nominee of Tiglath-pileser III, whose annals read, "Pekah I slew, Hoshea I appointed over them." Though called king, Hoshea was thus really a satrap of Assyria and held his appointment only during good behavior. The realm which he administered was but the shadow of its former self. Tiglath-pileser had already carried into captivity the northern tribes of Zebulun, Naphtali, Asher and Dan; as also the two and a half tribes east of the Jordan (<a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>). Apart from those forming the kingdom of Judah, there remained only Ephraim, Issachar, and the half-tribe of Manasseh.<P>2. The Reduced Kingdom of Israel:<P>Isaiah refers to the fall of Syria in the words, "Damascus is taken away from being a city" (<a onClick="return mV(\'Isa\',17,1);">Isa 17:1</a>), and to the foreign occupations of Northern Israel in the words, "He brought into contempt the land of Zebulun and the land of Naphtali...by the way of the sea, beyond the Jordan, Galilee of the nations" (<a onClick="return mV(\'Isa\',9,1);">Isa 9:1</a>).<P>3. Hosea and Ephraim:<P>But Hosea is the prophet in whose writings we see most clearly the reflection of the politics of the day, and the altered condition of things in Israel. In the 2nd division of his and book, chapters <a onClick="return mV(\'Hsa\',42,\'1-\');">4-14</A>, Hosea deals with a state of things which can only be subsequent to the first great deportation of Israelites, and therefore belongs to the reigns of Pekah and Hoshea. The larger part of the nation being removed, he addresses his utterances no longer to all Israel, but to Ephraim, the chief of the remaining tribes. This name he uses no less than 35 times, though not to the total exclusion of the term "Israel," as in <a onClick="return mV(\'Hsa\',11,1);">11:1</A>, "When Israel was a child, then I loved him," the whole nation in such cases being meant. Of the 35 uses of "Ephraim," the first is, "Ephraim is joined to idols; let him alone" (<a onClick="return mV(\'Hsa\',4,17);">4:17</A>), and the last, "Ephraim shall say, What have I to do any more with idols?" (<a onClick="return mV(\'Hsa\',14,8);">14:8</A>), showing that, in the prophet\'s estimation, the idolatrous worship of Yahweh, as associated with the golden calves of Dan and Bethel, lay at the root of the nation\'s calamities.<P>4. Hosea\'s Dependent Position:<P>Over this shrunken and weakened kingdom—corresponding generally with the Samaritan district of the New Testament—Hoshea was placed as the viceroy of a foreign power. The first official year of his governorship was 729, though he may have been appointed a few months earlier. Tiglath-pileser III died in 727, so that three years\' tribute was probably paid to Nineveh. There was, however, a political party in Samaria, which, ground down by cruel exactions, was for making an alliance with Egypt, hoping that, in the jealousy and antipathies of the two world-powers, it might find some relief or even a measure of independence. Hosea, himself a prophet of the north, allows us to see beneath the surface of court life in Samaria. "They call unto Egypt, they go to Assyria" (<a onClick="return mV(\'Hsa\',7,11);">Ho 7:11</a>), and again, "They make a covenant with Assyria, and oil is carried into Egypt" (<a onClick="return mV(\'Hsa\',12,1);">Ho 12:1</a>). This political duplicity from which it was the king\'s prime duty to save his people, probably took its origin about the time of Tiglath-pileser\'s death in 727.<P>5. His Treasonable Action:<P>That event either caused or promoted the treasonable action, and the passage of large quantities of oil on the southward road was an object-lesson to be read of all men. On the accession of Shalmaneser IV—who is the Shalmaneser of the Bible (<a onClick="return mV(\'2Ki\',17,3);">2Ki 17:3</a>; <a onClick="return mV(\'2Ki\',18,9);">18:9</a>)—Hoshea would seem to have carried, or sent, the annual tribute for 726 to the treasury at Nineveh (<a onClick="return mV(\'2Ki\',17,3);">2Ki 17:3</a>). The text is not clear as to who was the bearer of this tribute, but from the statement that Shalmaneser came up against him, and Hoshea became his servant, it may be presumed that the tribute for the first year after Tiglath-pileser\'s death was at first refused, then, when a military demonstration took place, was paid, and obedience promised. In such a case Hoshea would be required to attend at his suzerain\'s court and do homage to the sovereign.<P>6. His Final Arrest:<P>This is what probably took place, not without inquiry into the past. Grave suspicions were thus aroused as to the loyalty of Hoshea, and on these being confirmed by the confession or discovery that messengers had passed to "So king of Egypt," and the further withholding of the tribute (<a onClick="return mV(\'2Ki\',17,4);">2Ki 17:4</a>), Hoshea was arrested and shut up in prison. Here he disappears from history. Such was the ignominious end of a line of kings, not one of whom had, in all the vicissitudes of two and a quarter centuries, been in harmony with theocratic spirit, or realized that the true welfare and dignity of the state lay in the unalloyed worship of Yahweh.<P>7. Battle of Beth-arbel:<P>With Hoshea in his hands, Shalmaneser\'s troops marched, in the spring or summer of 725, to the completion of Assyria\'s work in Palestine. Isaiah has much to say in his <a onClick="return mV(\'Isa\',10,\'1-\');">10th</a> and <a onClick="return mV(\'Isa\',11,\'1-\');">11th</a> chapters on the divinely sanctioned mission of "the Assyrian" and of the ultimate fate that should befall him for his pride and cruelty in carrying out his mission. The campaign was not a bloodless one. At Beth-arbel—at present unidentified—the hostile forces met, with the result that might have been expected. "Shalman spoiled Beth-arbel in the day of battle" (<a onClick="return mV(\'Hsa\',10,14);">Ho 10:14</a>). The defeated army took refuge behind the walls of Samaria, and the siege began. The city was well placed for purposes of defense, being built on the summit of a lonely hill, which was Omri\'s reason for moving the capital from Tirzah (<a onClick="return mV(\'1Ki\',16,24);">1Ki 16:24</a>). It was probably during the continuance of the siege that Isaiah wrote his prophecy, "Woe to the crown of pride of the drunkards of Ephraim," etc. (<a onClick="return mV(\'Isa\',28,\'1-\');">Isa 28</a>), in which the hill of Samaria with its coronet of walls is compared to a diadem of flowers worn in a scene of revelry, which should fade and die. Micah\'s elegy on the fall of Samaria (chapter <a onClick="return mV(\'Mic\',1,\'1-\');">1</A>) has the same topographical note, "I will pour down the stones thereof into the valley, and I will uncover the foundations thereof" (<a onClick="return mV(\'Mic\',1,6);">1:6</A>).<P>8. Fall of Samaria in 721:<P>Shalmaneser\'s reign was one of exactly five years, December, 727 to December, 722, and the city fell in the 1st month of his successor\'s reign. The history of its fall is summarized in Sargon\'s great Khorsabad inscription in these words, "Samaria I besieged, I captured. 27,290 of her inhabitants I carried away. 50 chariots I collected from their midst. The rest of their property I caused to be taken."<P>9. Hoshea\'s Character:<P>Hoshea\'s character is summed up in the qualified phrase, "He did evil in the sight of the Lord, yet not as the kings of Israel that were before him." The meaning may be that, while not a high-principled man or of irreproachable life, he did not give to the idolatry of Bethel the official sanction and prominence which each of his 18 predecessors had done. According to <a onClick="return mV(\'Hsa\',10,6);">Ho 10:6</a> the golden calf of Samaria was to be taken to Assyria, to the shame of its erstwhile worshippers.``17';
isbe[4452]='Hospitality; Host`hos-pi-tal\'-i-ti, host (philoxenia, "love of strangers," xenos, "guest," "friend"; pandocheus, "innkeeper"):<P>1. Among Nomads:<P>When the civilization of a people has advanced so far that some traveling has become necessary, but not yet so far that traveling by individuals is a usual thing, then hospitality is a virtue indispensable to the life of the people. This stage of culture was that represented in ancient Palestine and the stage whose customs are still preserved among the present-day Arabs of the desert. Hospitality is regarded as a right by the traveler, to whom it never occurs to thank his host as if for a favor. And hospitality is granted as a duty by the host, who himself may very soon be dependent on some one else\'s hospitality. But none the less, both in Old Testament times and today, the granting of that right is surrounded by an etiquette that has made Arabian hospitality so justly celebrated. The traveler is made the literal master of the house during his stay; his host will perform for him the most servile offices, and will not even sit in his presence without express request. To the use of the guest is given over all that his host possesses, stopping not even short of the honor of wife or daughter. "\' Be we not all,\' say the poor nomads, \'guests of Ullah? Has God given unto them, God\'s guest shall partake with them thereof: if they will not for God render his own, it should not go well with them\'" (Doughty, Arabia Deserta, I, 228). The host is in duty bound to defend his guest against all comers and to lay aside any personal hatred—the murderer of father is safe as the guest of the son.<P>2. In the Old Testament:<P>An exquisite example of the etiquette of hospitality is found in <a onClick="return mV(\'Gen\',18,\'1-8\');">Ge 18:1-8</a>. The very fact that the three strangers have passed by Abraham\'s door gives him the privilege of entertaining them. When he sees them approaching he runs to beg the honor of their turning in to him, with oriental courtesy depreciates the feast that he is about to lay before them as "a morsel of bread," and stands by them while they eat. Manoah (<a onClick="return mV(\'Jdg\',13,15);">Jud 13:15</a>) is equally pressing although more matter-of-fact, while Jethro (<a onClick="return mV(\'Exd\',2,20);">Ex 2:20</a>) sends out that the stranger may be brought in. And Job (<a onClick="return mV(\'Job\',31,32);">31:32</A>) repels the very thought that he could let the sojourner be unprovided for. The one case where a breach of hospitality receives praise is that of Jael (<a onClick="return mV(\'Jdg\',4,\'1-\');">Jud 4</a>-<a onClick="return mV(\'Jdg\',5,\'1-\');">5</a>), perhaps to be referred to degeneration of customs in the conflicts with the Canaanites or (perhaps more plausibly) to literary-critical considerations, according to which in <a onClick="return mV(\'Jdg\',5,\'1-\');">Jud 5</a> Sisera is not represented as entering Jael\'s tent or possibly not as actually tasting the food, a state of affairs misunderstood in <a onClick="return mV(\'Jdg\',4,\'1-\');">Jud 4</a>, written under later circumstances of city life. (For contrasting opinions see "Jael" in Encyclopedia Biblica and HDB.)<P>3. The Table-Bond:<P>It is well to understand that to secure the right to hospitality it is not necessary, even in modern times, for the guest to eat with his host, still less to eat salt specifically. Indeed, guests arriving after sunset and departing the next morning do not, as a rule, eat at all in the tent of the host. It is sufficient to enter the tent, to grasp a tent-pin, or even, under certain circumstances, to invoke the name of a man as host. On the other hand, the bond of hospitality is certainly strengthened by eating with one\'s host, or the bond may actually be created by eating food belonging to him, even by stealth or in an act of theft. Here a quite different set of motives is at work. The idea here is that of kinship arising from participation in a common sacrificial meal, and the modern Arab still terms the animal killed for his guest the dhabichah or "sacrifice" (compare HDB, II, 428). This concept finds its rather materialistic expression in theory that after the processes of digestion are completed (a time estimated as two nights and the included day), the bond lapses if it is not renewed. There seem to be various references in the Bible to some such idea of a "table-bond" (<a onClick="return mV(\'Psa\',41,9);">Ps 41:9</a>, e.g.), but hardly in connection directly with hospitality. For a discussion of them see <a href="study/isbe/search.html?string=BREAD">BREAD</a>; <a href="study/isbe/search.html?string=GUEST">GUEST</a>; <a href="study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>.<P>4. In the City:<P>In the city, naturally, the exercise of hospitality was more restricted. Where travel was great, doubtless commercial provision for the travelers was made from a very early day (compare <a onClick="return mV(\'Luk\',10,34);">Lu 10:34</a> and see <a href="study/isbe/search.html?string=INN">INN</A>), and at all events free hospitality to all comers would have been unbearably abused. Lot in Sodom (<a onClick="return mV(\'Gen\',19,\'1-\');">Ge 19</a>) is the nomad who has preserved his old ideas, although settled in the city, and who thinks of the "shadow of his roof" (<a onClick="return mV(\'Gen\',19,8);">19:8</A>) as his tent. The same is true of the old man in Gibeah of <a onClick="return mV(\'Jdg\',19,16);">Jud 19:16</a>ff. And the sin of Sodom and of Gibeah is not that wanderers cannot find hospitality so much as it is that they are unsafe in the streets at night. Both Lot and "the old man," however, are firm in their duty and willing to sacrifice their daughters for the safety of their guests. (Later ideas as to the position of woman should not be read back into these narratives.) However, when the city-dweller Rahab refuses to surrender her guests (<a onClick="return mV(\'Jos\',2,\'1-\');">Jos 2</a>), her reason is not the breach of hospitality involved but her fear of Yahweh (<a onClick="return mV(\'Jos\',2,9);">Jos 2:9</a>). When Abraham\'s old slave is in Nahor, and begs a night\'s lodging for himself and his camels, he accompanies the request with a substantial present, evidently conceived of as pay for the same (<a onClick="return mV(\'Gen\',24,22);">Ge 24:22</a>f). Such also are the modern conditions; compare Benzinger-Socin in Baedeker\'s Palestine(3), xxxv, who observe that "inmates" of private houses "are aware that Franks always pay, and therefore receive them gladly." None the less, in New Testament times, if not earlier, and even at present, a room was set apart in each village for the use of strangers, whose expenses were borne by the entire community. Most interpreters consider that the kataluma of <a onClick="return mV(\'Luk\',2,7);">Lu 2:7</a> was a room of this sort, but this opinion cannot be regarded as quite certain. But many of the wealthier city-dwellers still strive to attain a reputation for hospitality, a zeal that naturally was found in the ancient world as well.<P>5. Christ and Hospitality:<P>Christ\'s directions to the apostles to "take nothing for their journey" (<a onClick="return mV(\'Mar\',6,8);">Mr 6:8</a>, etc.) presupposes that they were sure of always finding hospitality. Indeed, it is assumed that they may even make their own choice of hosts (<a onClick="return mV(\'Mat\',10,11);">Mt 10:11</a>) and may stay as long as they choose (<a onClick="return mV(\'Luk\',10,7);">Lu 10:7</a>). In this case, however, the claims of the travelers to hospitality are accentuated by the fact that they are bearers of good tidings for the people, and it is in view of this latter fact that hospitality to them becomes so great a virtue—the "cup of cold water" becomes so highly meritorious because it is given "in the name of a disciple" (<a onClick="return mV(\'Mat\',10,42);">Mt 10:42</a>; compare <a onClick="return mV(\'Mat\',10,41);">10:41</A>, and <a onClick="return mV(\'Mar\',9,41);">Mr 9:41</a>). Rejection of hospitality to one of Christ\'s "least brethren" (almost certainly to be understood as disciples) is equivalent to the rejection of Christ Himself (<a onClick="return mV(\'Mat\',25,43);">Mt 25:43</a>; compare <a onClick="return mV(\'Mat\',25,35);">25:35</a>). It is not quite clear whether in <a onClick="return mV(\'Mat\',10,14);">Mt 10:14</a> and parallels, simple refusal of hospitality is the sin in point or refusal to hear the message or both.<P>6. First Missionaries:<P>In the Dispersion, the Jew who was traveling seemed always to be sure of finding entertainment from the Jews resident in whatever city he might happen to be passing through. The importance of this fact for the spread of early Christianity is incalculable. To be sure, some of the first missionaries may have been men who were able to bear their own traveling expenses or who were merchants that taught the new religion when on business tours. In the case of soldiers or slaves their opportunity to carry the gospel into new fields came often through the movements of the army or of their masters. And it was by an "infiltration" of this sort, probably, rather than by any specific missionary effort that the church of Rome, at least, was rounded. See <a href="study/isbe/search.html?string=ROMANS,+EPISTLE+TO+THE">ROMANS, EPISTLE TO THE</A>. But the ordinary missionary, whether apostle (in any sense of the word) or evangelist, would have been helpless if it had not been that he could count so confidently on the hospitality everywhere. From this fact comes one reason why Paul, for instance, could plan tours of such magnitude with such assurance: he knew that he would not have to face any problem of sustenance in a strange city (<a onClick="return mV(\'Rom\',16,23);">Ro 16:23</a>).<P>7. In the Churches:<P>As the first Christian churches were founded, the exercise of hospitality took on a new aspect, especially after the breach with the Jews had begun. Not only did the traveling Christian look naturally to his brethren for hospitality, but the individual churches looked to the traveler for fostering the sense of the unity of the church throughout the world. Hospitality became a virtue indispensable to the well-being of the church—one reason for the emphasis laid on it (<a onClick="return mV(\'Rom\',12,13);">Ro 12:13</a>; <a onClick="return mV(\'Rom\',16,1);">16:1</a>f; <a onClick="return mV(\'Hbr\',13,2);">Heb 13:2</a>). As the organization of the churches became more perfected, the exercise of hospitality grew to be an official duty of the ministry and a reputation for hospitality was a prerequisite in some cases (<a onClick="return mV(\'1Ti\',3,2);">1Ti 3:2</a>; <a onClick="return mV(\'1Ti\',5,10);">5:10</a>; <a onClick="return mV(\'Tts\',1,8);">Tit 1:8</a>). The exercise of such hospitality must have become burdensome at times (<a onClick="return mV(\'1Pe\',4,9);">1Pe 4:9</a>), and as false teachers began to appear in the church a new set of problems was created in discriminating among applicants for hospitality. 2 and 3 John reflect some of the difficulties. For the later history of hospitality in the church interesting matter will be found in the Didache, chapters xi, xii, Apology of Aristides, chapter xv, and Lucian\'s Death of Peregrinus, chapter xvi. The church certainly preferred to err by excess of the virtue.<P>An evaluation of the Biblical directions regarding hospitality for modern times is extremely difficult on account of the utterly changed conditions. Be it said at once, especially, that certain well-meant criticism of modern missionary methods, with their boards, organized finance, etc., on the basis of Christ\'s directions to the Twelve, is a woeful misapplication of Biblical teaching. The hospitality that an apostle could count on in his own day is something that the modern missionary simply cannot expect and something that it would be arrant folly for him to expect (Weinel, Die urchristliche und die heutige Mission, should be read by everyone desiring to compare modern missions with the apostolic). In general, the basis for hospitality has become so altered that the special virtue has become merged in the larger field of charitable enterprise of various sorts. The modern problem nearest related to the old virtue is the question of providing for the necessities of the indigent traveler, a distinctly minor problem, although a very real one, in the general field of social problems that the modern church has to study. In so far as the New Testament exhortations are based on missionary motives there has been again a merging into general appeals for missions, perhaps specialized occasionally as appeals for traveling expense. The "hospitality" of today, by which is meant the entertainment of friends or relatives, hardly comes within the Biblical use of the term as denoting a special virtue.<P>LITERATURE.<P>For hospitality in the church, Harnack, Mission and Expansion of Christianity, II, chapter iv (10).``48';
isbe[4453]='Host of Heaven`(tsebha\' hashamayim): The expression is employed in the Old Testament to denote<P>(1) the stars, frequently as objects of idolatry (<a onClick="return mV(\'Deu\',4,19);">De 4:19</a>; <a onClick="return mV(\'Deu\',17,3);">17:3</a>; <a onClick="return mV(\'2Ki\',17,16);">2Ki 17:16</a>; <a onClick="return mV(\'2Ki\',21,3,5);">21:3, 5</a>; <a onClick="return mV(\'2Ki\',23,4);">23:4</a>f; <a onClick="return mV(\'Jer\',8,2);">Jer 8:2</a>; <a onClick="return mV(\'Jer\',19,13);">19:13</a>; <a onClick="return mV(\'Zep\',1,5);">Ze 1:5</a>), but also as witnesses in their number, order and splendor, to the majesty and providential rule and care of Yahweh (<a onClick="return mV(\'Isa\',34,4);">Isa 34:4</a>; <a onClick="return mV(\'Isa\',40,26);">40:26</a>, "calleth them all by name"; <a onClick="return mV(\'Isa\',45,12);">45:12</a>; <a onClick="return mV(\'Jer\',33,22);">Jer 33:22</a>); and<P>(2) the angels (<a onClick="return mV(\'1Ki\',22,19);">1Ki 22:19</a>; <a onClick="return mV(\'2Ch\',18,18);">2Ch 18:18</a>; <a onClick="return mV(\'Neh\',9,6);">Ne 9:6</a>; compare <a onClick="return mV(\'Psa\',103,21);">Ps 103:21</a>).<P>(1) Star-worship seems to have been an enticement to Israel from the first (<a onClick="return mV(\'Deu\',4,19);">De 4:19</a>; <a onClick="return mV(\'Deu\',17,3);">17:3</a>; <a onClick="return mV(\'Amo\',5,26);">Am 5:26</a>; compare <a onClick="return mV(\'Act\',7,42,43);">Ac 7:42-43</a>), but attained special prominence in the days of the later kings of Judah. The name of Manasseh is particularly connected with it. This king built altars for "all the host of heaven" in the courts of the temple (<a onClick="return mV(\'2Ki\',21,3,5);">2Ki 21:3, 5</a>). Josiah destroyed these altars, and cleansed the temple from the idolatry by putting down the priests and burning the vessels associated with it (<a onClick="return mV(\'2Ki\',23,4,5,12);">2Ki 23:4-5, 12</a>).<P>(2) In the other meaning of the expression, the angels are regarded as forming Yahweh\'s "host" or army, and He himself is the leader of them—"Yahweh of hosts" (<a onClick="return mV(\'Isa\',31,4);">Isa 31:4</a>, etc.)—though this designation has a much wider reference.`<a href="./study/isbe/search.html?string=ANGEL">ANGEL</a>; <a href="./study/isbe/search.html?string=ASTRONOMY,+I">ASTRONOMY</a>; <a href="./study/isbe/search.html?string=LORD+OF+HOSTS">LORD OF HOSTS</a>`132';

isbe[4456]='Hotham; Hothan`ho\'-tham, ho\'-than (chotham, "seal"):<P>(1) An Asherite, son of Heber, family of Beriah (<a onClick="return mV(\'1Ch\',7,32);">1Ch 7:32</a>).<P>(2) An Aroerite, father of two of the mighty men of David (<a onClick="return mV(\'1Ch\',11,44);">1Ch 11:44</a>). the King James Version, following Septuagint Chothan, has, incorrectly, Hothan.``1';
isbe[4457]='Hothir`ho\'-thir (hothir, "abundance"): Mentioned in <a onClick="return mV(\'1Ch\',25,4,28);">1Ch 25:4, 28</a> among the sons of Heman, and one of those set apart by David for the musical service of the house of God (compare <a onClick="return mV(\'1Ch\',25,6);">25:6</A>).``1';

isbe[4459]='Hour`our (sha\'atha\', she\'a\'; hora): Hour as a division of the day does not occur in the Old Testament; the term she\'a\' (sha\'atha\') found in Daniel, is Aramaic, and as used there denotes a short period or point of time of no definite length (<a onClick="return mV(\'Dan\',3,6,15);">Da 3:6, 15</a>; <a onClick="return mV(\'Dan\',4,33);">4:33 (Hebrew 30)</a>; <a onClick="return mV(\'Dan\',5,5);">5:5</A>). The Greek hora is commonly used in the New Testament in the same way, as "that same hour," "from that hour," etc., but it also occurs as a division of the day, as, "the third hour," "the ninth hour," etc. The Hebrews would seem to have become acquainted with this division of time through the Babylonians, but whether before the captivity we are not certain. The mention of the sun dial of Ahaz would seem to indicate some such reckoning of time during the monarchy.`<a href="./study/isbe/search.html?string=TIME">TIME</a>`138';
isbe[4460]='Hours of Prayer`The Mosaic law did not regulate the offering of prayer, but fully recognized its spontaneous character. In what manner or how far back in Jewish history the sacrificial prayer, mentioned in <a onClick="return mV(\'Luk\',1,10);">Lu 1:10</a>, originated no one knows. In the days of Christ it had evidently become an institution. But ages before that, stated hours of prayer were known and religiously observed by all devout Jews. It evidently belonged to the evolutionary process of Jewish worship, in connection with the temple-ritual. Devout Jews, living at Jerusalem, went to the temple to pray (<a onClick="return mV(\'Luk\',18,10);">Lu 18:10</a>; <a onClick="return mV(\'Act\',3,1);">Ac 3:1</a>). The pious Jews of the Diaspora opened their windows "toward Jerus" and prayed "toward" the place of God\'s presence (<a onClick="return mV(\'1Ki\',8,48);">1Ki 8:48</a>; <a onClick="return mV(\'Dan\',6,10);">Da 6:10</a>; <a onClick="return mV(\'Psa\',5,7);">Ps 5:7</a>). The regular hours of prayer, as we may infer from <a onClick="return mV(\'Psa\',55,17);">Ps 55:17</a> and <a onClick="return mV(\'Dan\',6,10);">Da 6:10</a>, were three in number. The first coincided with the morning sacrifice, at the 3rd hour of the morning, at 9 AM therefore (<a onClick="return mV(\'Act\',2,15);">Ac 2:15</a>). The second was at the 6th hour, or at noon, and may have coincided with the thanksgiving for the chief meal of the day, a religious custom apparently universally observed (<a onClick="return mV(\'Mat\',15,36);">Mt 15:36</a>; <a onClick="return mV(\'Act\',27,35);">Ac 27:35</a>). The 3rd hour of prayer coincided with the evening sacrifice, at the ninth hour (<a onClick="return mV(\'Act\',3,1);">Ac 3:1</a>; <a onClick="return mV(\'Act\',10,30);">10:30</a>). Thus every day, as belonging to God, was religiously subdivided, and regular seasons of prayer were assigned to the devout believer. Its influence on the development of the religious spirit must have been incalculable, and it undoubtedly is, at least in part, the solution of the riddle of the preservation of the Jewish faith in the cruel centuries of its bitter persecution. Mohammedanism borrowed this feature of worship from the Jews and early Christians, and made it one of the chief pillars of its faith.``42';
isbe[4461]='House`hous (bayith; oikos, in classical Greek generally "an estate," oikia, oikema (literally, "habitation"), in <a onClick="return mV(\'Act\',12,1);">Ac 12:1</a>, "prison"):<P><b>I. CAVE DWELLINGS</b><P><b>II. STONE-BUILT AND MUD/BRICK-BUILT HOUSES</b><p class="in15">1. Details of Plan and Construction<p class="in30">(1) Corner-Stone<p class="in30">(2) Floor<p class="in30">(3) Gutter<p class="in30">(4) Door<p class="in30">(5) Hinge<p class="in30">(6) Lock and Key<p class="in30">(7) Threshold<p class="in30">(8) Hearth<p class="in30">(9) Window<p class="in30">(10) Roof<p class="in15">2. Houses of More than One Story<p class="in30">(1) Upper Chambers and Stairs<p class="in30">(2) Palaces and Castles<p class="in15">3. Internal Appearance<P><b>III. OTHER MEANINGS</b><P><b>LITERATURE</b><hr /><P>I. Cave Dwellings.<P>The earliest permanent habitations of the prehistoric inhabitants of Palestine were the natural caves which abound throughout the country. As the people increased and grouped themselves into communities, these abodes were supplemented by systems of artificial caves which, in some cases, developed into extensive burrowings of many adjoining compartments, having in each system several entrances. These entrances were usually cut through the roof down a few steps, or simply dropped to the floor from the rock surface. The sinking was shallow and the headroom low but sufficient for the undersized troglodites who were the occupiers.<P>II. Stone-built and Mud/Brick-built Houses.<P>There are many references to the use of caves as dwellings in the Old Testament. Lot dwelt with his two daughters in cave (<a onClick="return mV(\'Gen\',19,30);">Ge 19:30</a>). Elijah, fleeing from Jezebel, lodged in a cave (<a onClick="return mV(\'1Ki\',19,9);">1Ki 19:9</a>). The natural successor to the cave was the stone-built hut, and just as the loose field-bowlders and the stones, quarried from the caves, served their first and most vital uses in the building of defense walls, so did they later become material for the first hut. Caves, during the rainy season, were faulty dwellings, as at the time when protection was most needed, they were being flooded through the surface openings which formed their entrances. The rudest cell built of rough stones in mud and covered a with roof of brushwood and mud was at first sufficient. More elaborate plans of several apartments, entering from what may be called a living-room, followed as a matter of course, and these, huddled together, constituted the homes of the people. Mud-brick buildings (<a onClick="return mV(\'Job\',4,19);">Job 4:19</a>) of similar plan occur, and to protect this friable material from the weather, the walls were sometimes covered with a casing of stone slabs, as at Lachish. (See Bliss, A Mound of Many Cities.) Generally speaking, this rude type of building prevailed, although, in some of the larger buildings, square dressed and jointed stones were used. There is little or no sign of improvement until the period of the Hellenistic influence, and even then the improvement was slight, so far as the homes of the common people were concerned.<P>1. Details of Plan and Construction:<P>One should observe an isometric sketch and plan showing construction of a typical small house from Gezer. The house is protected and approached from the street by an open court, on one side of which is a covered way. The doors enter into a living-room from which the two very small inner private rooms, bedchambers, are reached. Builders varied the plan to suit requirements, but in the main, this plan may be taken as typical. When members of a family married, extra accommodation was required. Additions were made as well as could be arranged on the cramped site, and in consequence, plans often became such a meaningless jumble that it is impossible to identify the respective limits of adjoining houses. The forecourt was absorbed and crushed out of existence, so that in many of the plans recovered the arrangement is lost.<P>(1) Corner-stone:<P>Corner-stone (pinnah, <a onClick="return mV(\'Isa\',28,16);">Isa 28:16</a>; <a onClick="return mV(\'Jer\',51,26);">Jer 51:26</a>; lithos akrogoniaios, <a onClick="return mV(\'1Pe\',2,6);">1Pe 2:6</a>).—In the construction of rude boulder walls, more especially on a sloping site, as can be seen today in the highlands of Scotland and Wales, a large projecting boulder was built into the lower angle-course. It tied together the return angles and was one of the few bond-stones used in the building. This most necessary support claimed chief importance and as such assumed a figurative meaning frequently used (<a onClick="return mV(\'Isa\',28,16);">Isa 28:16</a>; <a onClick="return mV(\'1Pe\',2,6);">1Pe 2:6</a>; see <a href="study/isbe/search.html?string=CORNER-STONE">CORNER-STONE</a>). The importance given to the laying of a sure foundation is further emphasized by the dedication rites in common practice, evidence of which has been found on various sites in Palestine (see Excavations of Gezer). The discovery of human remains placed diagonally below the foundations of the returning angle of the house gives proof of the exercise of dedication rites both before and after the Conquest. Hiel sacrificed his firstborn to the foundations of Jericho and his youngest son to the gates thereof (<a onClick="return mV(\'1Ki\',16,34);">1Ki 16:34</a>). But this was in a great cause compared with a similar sacrifice to a private dwelling. The latter manifests a respect scarcely borne out by the miserable nature of the houses so dedicated. At the same time, it gives proof of the frequent collapse of structures which the winter rains made inevitable and at which superstition trembled. The fear of pending disaster to the man who failed to make his sacrifice is recorded in <a onClick="return mV(\'Deu\',20,5);">De 20:5</a>: "What man is there that hath built a new house, and hath not dedicated it? let him go and return to his house, lest he die in the battle." <!-- See illustration, p. 550.--><P>(2) Floor:<P>Floor (qarqa\').—When houses were built on the rock outcrop, the floor was roughly leveled on the rock surface, but it is more common to find floors of beaten clay similar to the native floor of the present day. Stone slabs were sparingly used, and only appear in the houses of the great. It is unlikely that wood was much used as a flooring to houses, although Solomon used it for his temple floor (<a onClick="return mV(\'1Ki\',6,15);">1Ki 6:15</a>).<P>(3) Gutter:<P>Gutter (tsinnor).—The "gutter" in <a onClick="return mV(\'2Sa\',5,8);">2Sa 5:8</a> the King James Version is obviously difficult to associate with the gutter of a house, except in so far as it may have a similar meaning to the water duct or "water course" (Revised Version (British and American)) leading to the private cistern, which formed part of the plan. Remains of open channels for this purpose have been found of rough stones set in clay, sometimes leading through a silt pit into the cistern.<P>(4) Door:<P>Door (deleth, pethach; thura).—Doorways were simple, square, entering openings in the wall with a stone or wood lintel (mashqoph, <a onClick="return mV(\'Exd\',12,22,23);">Ex 12:22-23</a>; \'ayil, <a onClick="return mV(\'1Ki\',6,31);">1Ki 6:31</a>) and a stone threshold raised slightly above the floor. It is easy to imagine the earliest wooden door as a simple movable boarded cover with back bars, fixed vertically by a movable bar slipped into sockets in the stone jambs. Doorposts (caph, <a onClick="return mV(\'Eze\',41,16);">Eze 41:16</a>) appear to have been in use, but, until locks were introduced, it is difficult to imagine a reason for them. Posts, when introduced, were probably let into the stone at top and bottom, and, unlike our present door frame, had no head-piece. When no wood was used, the stone jambs of the opening constituted the doorposts. To the present day the post retains its function as commanded in <a onClick="return mV(\'Deu\',6,9);">De 6:9</a>; <a onClick="return mV(\'Deu\',11,20);">11:20</a>, and in it is fitted a small case containing a parchment on which is written the exhortation to obedience.<P>(5) Hinge:<P>Hinge (poth, <a onClick="return mV(\'1Ki\',7,50);">1Ki 7:50</a>; tsir, <a onClick="return mV(\'Pro\',26,14);">Pr 26:14</a>).—Specimens of sill and head sockets of stone have been discovered which suggest the use of the pivot hinge, the elongated swinging stile of the door being let into the sockets at top and bottom. A more advanced form of construction was necessary to this type of door than in the previous instance, and some little skill was required to brace it so that it would hold together. The construction of doors and windows is an interesting question, as it is in these two details that the joinery craft first claimed development. There is no indication, however, of anything of the nature of advancement, and it seems probable that there was none.<P>(6) Lock and key:<P>Lock and key ("lock," man\'ul, <a onClick="return mV(\'Neh\',3,3);">Ne 3:3</a>ff; <a onClick="return mV(\'Sgs\',5,5);">So 5:5</a>; "key," maphteach, <a onClick="return mV(\'Jdg\',3,25);">Jud 3:25</a>; figurative. <a onClick="return mV(\'Isa\',22,22);">Isa 22:22</a>; kleis, <a onClick="return mV(\'Mat\',16,19);">Mt 16:19</a>, etc.).—In later Hellenic times a sort of primitive lock and key appeared, similar to the Arabic type. See Excavations of Gezer, I, 197, and illustration in article <a href="study/isbe/search.html?string=KEY">KEY</a>.<P>(7) Threshold:<P>Threshold (caph, <a onClick="return mV(\'1Ki\',14,17);">1Ki 14:17</a>; <a onClick="return mV(\'Eze\',40,6);">Eze 40:6</a>ff; miphtan, <a onClick="return mV(\'1Sa\',5,4,5);">1Sa 5:4-5</a>; <a onClick="return mV(\'Eze\',9,3);">Eze 9:3</a>, etc.).—Next to the corner-stone, the threshold was specially sacred, and in many instances foundation-sacrifices have been found buried under the threshold. In later times, when the Hebrews became weaned of this unholy practice, the rite remained with the substitution of a lamp enclosed between two bowls as a symbol of the life.<P>See <a href="study/isbe/search.html?string=GEZER">GEZER</a>.<P>(8) Hearth:<P>Hearth (\'ach, <a onClick="return mV(\'Jer\',36,22,23);">Jer 36:22-23</a>, the Revised Version (British and American) "brazier"; kiyyor).—The references in the Old Testament and the frequent discovery of hearths make it clear that so much provision for heating had been made. It is unlikely, however, that chimneys were provided. The smoke from the wood or charcoal fuel was allowed to find its way through the door and windows and the many interstices occurring in workmanship of the worst possible description. The "chimney" referred to (<a onClick="return mV(\'Hsa\',13,3);">Ho 13:3</a>) is a doubtful translation. The "fire in the brazier" (<a onClick="return mV(\'Jer\',36,22);">Jer 36:22</a> the Revised Version (British and American)) which burned before the king of Judah in his "winter house" was probably of charcoal. The modern natives, during the cold season, huddle around and warm their hands at a tiny glow in much the same way as their ancient predecessors. The use of cow and camel dung for baking-oven (tannur) fires appears to have continued from the earliest time to the present day (<a onClick="return mV(\'Eze\',4,15);">Eze 4:15</a>).<P>See also <a href="study/isbe/search.html?string=HEARTH">HEARTH</a>.<P>(9) Window:<P>Window (thuris, <a onClick="return mV(\'Act\',20,9);">Ac 20:9</a>; <a onClick="return mV(\'2Cr\',11,33);">2Co 11:33</a>).—It would appear that windows were often simple openings in the wall which were furnished with some method of closing, which, it may be conjectured, was somewhat the same as the primitive door previously mentioned. The window of the ark (challon, <a onClick="return mV(\'Gen\',8,6);">Ge 8:6</a>), the references in <a onClick="return mV(\'Gen\',26,8);">Ge 26:8</a>; <a onClick="return mV(\'Jos\',2,15);">Jos 2:15</a>, and the window from which Jezebel looked (<a onClick="return mV(\'2Ki\',9,30);">2Ki 9:30</a>), were presumably of the casement class. Ahaziah fell through a lattice (cebhakhah) in the same palace, and the same word is used for the "networks" (<a onClick="return mV(\'1Ki\',7,41);">1Ki 7:41</a>) "covering the bowls of the capitals," and in <a onClick="return mV(\'Sgs\',2,9);">So 2:9</a>, "through the lattice" (charakkim). It would appear, therefore, that some variety of treatment existed, and that the simple window opening with casement and the opening filled in with a lattice or grill were distinct. Windows were small, and, according to the Mishna, were kept not less than 6 ft. from floor to sill. The lattice was open, without glass filling, and in this connection there is the interesting figurative reference in <a onClick="return mV(\'Isa\',54,12);">Isa 54:12</a> the King James Version, "windows of agates," translated in the Revised Version (British and American) "pinnacles of rubies." Heaven is spoken of as having "windows" (\'arubbah) for rain (<a onClick="return mV(\'Gen\',7,11);">Ge 7:11</a>; <a onClick="return mV(\'Gen\',8,2);">8:2</a>; <a onClick="return mV(\'2Ki\',7,2);">2Ki 7:2</a>, etc.).<P>(10) Roof:<P>Roof (gagh; stege).—These were flat. Compare "The beams of our house are cedars, and our rafters are firs" (<a onClick="return mV(\'Sgs\',1,17);">So 1:17</a>). To get over the difficulty of the larger spans, a common practice was to introduce a main beam (qurah) carried on the walls and strengthened by one or more intermediate posts let into stone sockets laid on the floor. Smaller timbers as joists ("rafters," rahit) were spaced out and covered in turn with brushwood; the final covering, being of mud mixed with chopped straw, was beaten and rolled. A tiny stone roller is found on every modern native roof, and is used to roll the mud into greater solidity every year on the advent of the first rains. Similar rollers have been found among the ancient remains throughout the country; see Excavations of Gezer, I, 190; PEFS, Warren\'s letters, 46. "They let him down through the tiles (keramos) with his couch into the midst before Jesus" (<a onClick="return mV(\'Luk\',5,19);">Lu 5:19</a>) refers to the breaking through of a roof similar to this. The roof ("housetop," gagh; doma) was an important part of every house and was subjected to many uses. It was used for worship (<a onClick="return mV(\'2Ki\',23,12);">2Ki 23:12</a>; <a onClick="return mV(\'Jer\',19,13);">Jer 19:13</a>; <a onClick="return mV(\'Jer\',32,29);">32:29</a>; <a onClick="return mV(\'Zep\',1,5);">Ze 1:5</a>; <a onClick="return mV(\'Act\',10,9);">Ac 10:9</a>). Absalom spread his tent on the "top of the house" (<a onClick="return mV(\'2Sa\',16,22);">2Sa 16:22</a>). In the Feast of the Tabernacles temporary booths (cukkah) were erected on the housetops. The people, as is their habit today, gathered together on the roof as a common meeting-place on high days and holidays (<a onClick="return mV(\'Jdg\',16,27);">Jud 16:27</a>). The wild wranglings which can be heard in any modern native village, resulting in vile accusations and exposure of family secrets hurled from the housetops of the conflicting parties, illustrate the passage, "And what ye have spoken in the ear in the inner chambers shall be proclaimed upon the housetops" (<a onClick="return mV(\'Luk\',12,3);">Lu 12:3</a>).<P>2. Houses of More than One Story:<P>(1) Upper Chambers and Stairs:<P>It is certain that there were upper chambers (\'aliyah; huperoon, <a onClick="return mV(\'Act\',9,37);">Ac 9:37</a>, etc.) to some of the houses. Ahaziah was fatally injured by falling from the window of his palace, and a somewhat similar fate befell his mother, Jezebel (<a onClick="return mV(\'2Ki\',1,2);">2Ki 1:2</a>; <a onClick="return mV(\'2Ki\',9,33);">9:33</a>). The escape of the spies from the house on the wall at Jericho (<a onClick="return mV(\'Jos\',2,15);">Jos 2:15</a>) and that of Paul from Damascus (<a onClick="return mV(\'2Cr\',11,33);">2Co 11:33</a>) give substantial evidence of window openings at a considerable height. Elijah carried the son of the widow of Zarephath "up into the chamber." The Last Supper was held in an upper chamber (<a onClick="return mV(\'Mar\',14,15);">Mr 14:15</a>). Some sort of stairs (ma\'alah) of stone or wood must have existed, and the lack of the remains of stone steps suggests that they were wood steps, probably in the form of ladders.<P>(2) Palaces and Castles:<P>Palaces and castles (\'armon, birah, hekhal; aule, parembole).—These were part of every city and were more elaborate in plan, raised in all probability to some considerable height. The Canaanite castle discovered by Macalister at Gezer shows a building of enormously thick walls and small rooms. Reisner has unearthed Ahab\'s palace at Samaria, revealing a plan of considerable area. Solomon\'s palace is detailed in <a onClick="return mV(\'1Ki\',7,\'1-\');">1Ki 7</a> (see <a href="study/isbe/search.html?string=TEMPLE,+A1">TEMPLE</A>). In this class may also be included the megalithic fortified residences with the beehive guard towers of an earlier date, described by Dr. Mackenzie (PEF, I) .<P>3. Internal Appearance:<P>Walls were plastered (<a onClick="return mV(\'Lev\',14,43,48);">Le 14:43, 48</a>), and small fragments of painted (<a onClick="return mV(\'Jer\',22,14);">Jer 22:14</a>) plaster discovered from time to time show that some attempt at mural decoration was made, usually in the form of crudely painted line ornament. Walls were recessed here and there into various forms of cupboards (which see) at various levels. The smaller cuttings in the wall were probably for lamps, and in the larger and deeper recesses bedmats may have been kept and garments stored.<P>III. Other Meanings.<P>The word has often the sense of "household," and this term is frequently substituted in the Revised Version (British and American) for "house" of the King James Version (e.g. <a onClick="return mV(\'Exd\',12,3);">Ex 12:3</a>; <a onClick="return mV(\'2Ki\',7,11);">2Ki 7:11</a>; <a onClick="return mV(\'2Ki\',10,5);">10:5</a>; <a onClick="return mV(\'2Ki\',15,5);">15:5</a>; <a onClick="return mV(\'Isa\',36,3);">Isa 36:3</a>; <a onClick="return mV(\'1Cr\',1,11);">1Co 1:11</a>; <a onClick="return mV(\'1Ti\',5,14);">1Ti 5:14</a>); in certain cases for phrases with "house" the Revised Version (British and American) has "at home". (<a onClick="return mV(\'Act\',2,46);">Ac 2:46</a>; <a onClick="return mV(\'Act\',5,42);">5:42</a>).<P>LITERATURE.<P>Macalister, Excavations at Gezer; PEFS; Sellin, Excavations at Taanach; Schumacher, Excavations at Tell Mutesellim; Bliss, Mound of Many Cities; articles in Dictionaries and Encyclopedias.`<a href="./study/isbe/search.html?string=HOUSE+OF+GOD">HOUSE OF GOD</a>; <a href="./study/isbe/search.html?string=HOUSEHOLD">HOUSEHOLD</a>`39';
isbe[4462]='House of God`In <a onClick="return mV(\'Gen\',28,17,22);">Ge 28:17, 22</a> = <a href="study/isbe/search.html?string=BETHEL">BETHEL</a> (which see). In Judges, 1 and 2 Chronicles, Ezra, Nehemiah, Psalms, etc. (beth ha-\'elohim), a designation of the sanctuary = "house of Yahweh" (of the tabernacle, <a onClick="return mV(\'Jdg\',18,31);">Jud 18:31</a>; <a onClick="return mV(\'Jdg\',20,18,26);">20:18, 26</a> the King James Version; of the temple, <a onClick="return mV(\'1Ch\',9,11);">1Ch 9:11</a>; <a onClick="return mV(\'1Ch\',24,5);">24:5</a> the King James Version; <a onClick="return mV(\'2Ch\',5,14);">2Ch 5:14</a>; <a onClick="return mV(\'Psa\',42,4);">Ps 42:4</a>; <a onClick="return mV(\'Isa\',2,3);">Isa 2:3</a>, etc.; of the 2nd temple, <a onClick="return mV(\'Ezr\',5,8,15);">Ezr 5:8, 15</a>; <a onClick="return mV(\'Neh\',6,10);">Ne 6:10</a>; <a onClick="return mV(\'Neh\',13,11);">13:11</a>; compare <a onClick="return mV(\'Mat\',12,4);">Mt 12:4</a>). Spiritually, in the New Testament, the "house of God" (oikos theou) is the church or community of believers (<a onClick="return mV(\'1Ti\',3,15);">1Ti 3:15</a>; <a onClick="return mV(\'Hbr\',10,21);">Heb 10:21</a>; <a onClick="return mV(\'1Pe\',4,17);">1Pe 4:17</a>; compare <a onClick="return mV(\'1Cr\',3,9,16,17);">1Co 3:9, 16-17</a>; <a onClick="return mV(\'1Pe\',2,5);">1Pe 2:5</a>).``1';
