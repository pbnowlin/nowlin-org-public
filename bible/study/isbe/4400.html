isbe[4401]='Holy Place`(ha-qodhesh, <a onClick="return mV(\'Exd\',26,33);">Ex 26:33</a>, ha-hekhal, <a onClick="return mV(\'1Ki\',6,17);">1Ki 6:17</a>, etc.; he prote skene, <a onClick="return mV(\'Hbr\',9,6);">Heb 9:6</a>f):<P>1. The Terms:<P>The tabernacle consisted of two divisions to which a graduated scale of holiness is attached: "The veil shall separate unto you between the holy place and the most holy" (<a onClick="return mV(\'Exd\',26,33);">Ex 26:33</a>). This distinction was never abrogated. In the Epistle to the Hebrews these divisions are called the "first" and "second" tabernacles (<a onClick="return mV(\'Hbr\',9,6);">Heb 9:6</a>f). The term "holy place" is not indeed confined to the outer chamber of the sanctuary; in <a onClick="return mV(\'Lev\',6,16);">Le 6:16</a>, it is applied to "the court of the tent of meeting." But the other is its technical use. In Solomon\'s temple we have a different usage. The word hekhal, "temple," is not at first applied, as after, to the whole building, but is the designation specifically of the holy place, in distinction from the debhir, or "oracle" (compare <a onClick="return mV(\'1Ki\',6,3,5,16,17,33);">1Ki 6:3, 5, 16-17, 33</a>, etc.; so in <a onClick="return mV(\'Eze\',41,1,2,4);">Eze 41:1-2, 4</a>, etc.). The wider usage is later (compare <a onClick="return mV(\'2Ki\',11,10,11,13);">2Ki 11:10-11, 13</a>, etc.).<P>2. Size of the Holy Place:<P>The size of the holy place differed at different times. The holy place of the tabernacle was 20 cubits long by 10 broad and 10 high (30 x 15 x 15 ft.); that of Solomon\'s temple was twice this in length and breadth—40 by 20 cubits; but it is contended by many (Bahr, etc.) that in height it was the full internal height of the building—30 cubits; the Herodian temple has the same dimensions of length and breadth, but Josephus and Middoth give largely increased, though differing, numbers for the height (see <a href="study/isbe/search.html?string=TEMPLE,+HEROD\'S">TEMPLE, HEROD\'S</A>).<P>3. Contents of Holy Place:<P>The contents of the holy place were from the beginning ordered to be these (<a onClick="return mV(\'Exd\',25,23);">Ex 25:23</a>ff; <a onClick="return mV(\'Exd\',30,\'1-10\');">30:1-10</a>): the altar of incense, a golden candlestick (in Solomon\'s temple increased to ten, <a onClick="return mV(\'1Ki\',7,49);">1Ki 7:49</a>), and a table of showbread (likewise increased to ten, <a onClick="return mV(\'2Ch\',4,8);">2Ch 4:8</a>). For the construction, position, history and uses of these objects, see <a href="study/isbe/search.html?string=TABERNACLE,+A">TABERNACLE</A>; <a href="study/isbe/search.html?string=TEMPLE,+A1">TEMPLE</a>, and articles under the several headings. This, as shown by Josephus and by the sculptures on the Arch of Titus, continued to be the furniture of the holy place till the end.<P>4. Symbolism:<P>As the outer division of the sanctuary, into which, as yet, not the people, but only their representatives in the priesthood, were admitted while yet the symbols of the people\'s consecrated life (prayer, light, thanksgiving) were found in it, the holy place may be said to represent the people\'s relation to God in the earthly life, as the holy of holies represented God\'s relation to the people in a perfected communion. In the Epistle to the Hebrews, the holy place is not largely dwelt on as compared with the court in which the perfect sacrifice was offered, and the holiest of all into which Christ has now entered (Christ passes "through" the tabernacle into the holiest, <a onClick="return mV(\'Hbr\',9,11);">9:11</A>). It pertains, however, evidently to the earthly sphere of Christ\'s manifestation, even as earth is the present scene of the church\'s fellowship. Through earth, by the way which Christ has opened up, the believer, already in spirit, finally in fact, passes with Him into the holiest (<a onClick="return mV(\'Hbr\',10,19);">Heb 10:19</a>; compare <a onClick="return mV(\'Hbr\',9,8);">Heb 9:8</a>; see Westcott, Hebrews, 233ff).``17';
isbe[4402]='Holy Spirit, 1`ho\'-li spir\'-it:<P><b>I. OLD TESTAMENT TEACHINGS AS TO THE SPIRIT</b><P class="in15">1. Meaning of the Word<P class="in15">2. The Spirit in Relation to the Godhead<P class="in15">3. The Spirit in External Nature<P class="in15">4. The Spirit of God In Man<P class="in15">5. Imparting Powers for Service<p class="in30">(1) Judges and Warriors<p class="in30">(2) Wisdom for Various Purposes<p class="in30">(3) In Prophecy<P class="in15">6. Imparting Moral Character<P class="in15">7. The Spirit in in the Messiah<P class="in15">8. Predictions of Future Outpouring of the Spirit<P><b>II. THE SPIRIT IN THE NON-CANONICAL LITERATURE</b><P class="in15">1. The Spirit in Josephus<P class="in15">2. The Spirit in the Pseudepigrapha<P class="in15">3. The Spirit in the Wisdom of Solomon<P class="in15">4. The Spirit in Philo<P><b>III. THE HOLY SPIRIT IN THE NEW TESTAMENT</b><P class="in15">1. In Relation to the Person and Work of Christ<p class="in30">(1) Birth of Jesus<p class="in30">(2) Baptism of Jesus<p class="in30">(3) Temptation of Jesus<p class="in30">(4) Public Ministry of Jesus<p class="in30">(5) Death and Resurrection and Pentecostal Gift<P class="in15">2. The Holy Spirit in the Kingdom of God<p class="in30">(1) Synoptic Teachings<p class="in30">(2) In the Writings of John<p class="in30">(3) In Acts<p class="in30">(4) In Paul\'s Writings<p class="in45">(a) The Spirit and Jesus<p class="in45">(b) In Bestowing Charismatic Gifts<p class="in45">(c) In the Beginnings of the Christian Life<p class="in45">(d) In the Religious and Moral Life<p class="in45">(e) In the Church<p class="in45">(f) In the Resurrection of Believers<p class="in30">(5) The Holy Spirit in Other New Testament Writings<P><b>LITERATURE</b><hr /><P>The expression Spirit, or Spirit of God, or Holy Spirit, is found in the great majority of the books of the Bible. In the Old Testament the Hebrew word uniformly employed for the Spirit as referring to God\'s Spirit is ruach meaning "breath," "wind" or "breeze." The verb form of the word is ruach, or riach used only in the Hiphil and meaning "to breathe," "to blow." A kindred verb is rawach, meaning "to breathe" "having breathing room," "to be spacious," etc. The word always used in the New Testament for the Spirit is the Greek neuter noun pneuma, with or without the article, and for Holy Spirit, pneuma hagion, or to pneuma to hagion. In the New Testament we find also the expressions, "the Spirit of God," "the Spirit of the Lord," "the Spirit of the Father," "the Spirit of Jesus," "of Christ." The word for Spirit in the Greek is from the verb pneo, "to breathe," "to blow." The corresponding word in the Latin is spiritus, meaning "spirit."<P>I. Old Testament Teachings as to the Spirit.<P>1. Meaning of the Word:<P>At the outset we note the significance of the term itself. From the primary meaning of the word which is "wind," as referring to Nature, arises the idea of breath in man and thence the breath, wind or Spirit of God. We have no way of tracing exactly how the minds of the Biblical writers connected the earlier literal meaning of the word with the Divine Spirit. Nearly all shades of meaning from the lowest to the highest appear in the Old Testament, and it is not difficult to conceive how the original narrower meaning was gradually expanded into the larger and wider. The following are some of the shades of Old Testament usage. From the notion of wind or breath, ruach came to signify:<P>(1) the principle of life itself; spirit in this sense indicated the degree of vitality: "My spirit is consumed, my days are extinct" (<a onClick="return mV(\'Job\',17,1);">Job 17:1</a>; also <a onClick="return mV(\'Jdg\',15,19);">Jud 15:19</a>; <a onClick="return mV(\'1Sa\',30,12);">1Sa 30:12</a>);<P>(2) human feelings of various kinds, as anger (<a onClick="return mV(\'Jdg\',8,3);">Jud 8:3</a>; <a onClick="return mV(\'Pro\',29,11);">Pr 29:11</a>), desire (<a onClick="return mV(\'Isa\',26,9);">Isa 26:9</a>), courage (<a onClick="return mV(\'Jos\',2,11);">Jos 2:11</a>);<P>(3) intelligence (<a onClick="return mV(\'Exd\',28,3);">Ex 28:3</a>; <a onClick="return mV(\'Isa\',29,24);">Isa 29:24</a>);<P>(4) general disposition (<a onClick="return mV(\'Psa\',34,18);">Ps 34:18</a>; <a onClick="return mV(\'Psa\',51,17);">Psa 51:17</a>; <a onClick="return mV(\'Pro\',14,29);">Pr 14:29</a>; <a onClick="return mV(\'Pro\',16,18);">16:18</a>; <a onClick="return mV(\'Pro\',29,23);">29:23</a>).<P>No doubt the Biblical writers thought of man as made in the image of God (<a onClick="return mV(\'Gen\',1,27);">Ge 1:27</a>f), and it was easy for them to think of God as being like man. It is remarkable that their anthropomorphism did not go farther. They preserve, however, a highly spiritual conception of God as compared with that of surrounding nations. But as the human breath was an invisible part of man, and as it represented his vitality, his life and energy, it was easy to transfer the conception to God in the effort to represent His energetic and transitive action upon man and Nature. The Spirit of God, therefore, as based upon the idea of the ruach or breath of man, originally stood for the energy or power of God (<a onClick="return mV(\'Isa\',31,3);">Isa 31:3</a>; compare A. B. Davidson, Theology of the Old Testament, 117-18), as contrasted with the weakness of the flesh.<P>2. The Spirit in Relation to the Godhead:<P>We consider next the Spirit of God in relation to God Himself in the Old Testament. Here there are several points to be noted. The first is that there is no indication of a belief that the Spirit of God was a material particle or emanation from God. The point of view of Biblical writers is nearly always practical rather than speculative. They did not philosophize about the Divine nature. Nevertheless, they retained a very clear distinction between spirit and flesh or other material forms. Again we observe in the Old Testament both an identification of God and the Spirit of God, and also a clear distinction between them. The identification is seen in <a onClick="return mV(\'Psa\',139,7);">Ps 139:7</a> where the omni-presence of the Spirit is declared, and in <a onClick="return mV(\'Isa\',63,10);">Isa 63:10</a>; <a onClick="return mV(\'Jer\',31,33);">Jer 31:33</a>; <a onClick="return mV(\'Eze\',36,27);">Eze 36:27</a>. In a great number of passages, however, God and the Spirit of God are not thought of as identical, as in <a onClick="return mV(\'Gen\',1,2);">Ge 1:2</a>; <a onClick="return mV(\'Gen\',6,3);">6:3</a>; <a onClick="return mV(\'Neh\',9,20);">Ne 9:20</a>; <a onClick="return mV(\'Psa\',51,11);">Ps 51:11</a>; <a onClick="return mV(\'Psa\',104,29);">104:29</a>f. Of course this does not mean that God and the Spirit of God were two distinct beings in the thought of Old Testament writers, but only that the Spirit had functions of His own in distinction from God. The Spirit was God in action, particularly when the action was specific, with a view to accomplishing some particular end or purpose of God. The Spirit came upon individuals for special purposes. The Spirit was thus God immanent in man and in the world. As the angel of the Lord, or angel of the Covenant in certain passages, represents both Yahweh Himself and one sent by Yahweh, so in like manner the Spirit of Yahweh was both Yahweh within or upon man, and at the same time one sent by Yahweh to man.<P>Do the Old Testament teachings indicate that in the view of the writers the Spirit of Yahweh was a distinct person in the Divine nature? The passage in <a onClick="return mV(\'Gen\',1,26);">Ge 1:26</a> is scarcely conclusive. The idea and importance of personality were but slowly developed in Israelite thought. Not until some of the later prophets did it receive great emphasis, and even then scarcely in the fully developed form. The statement in <a onClick="return mV(\'Gen\',1,26);">Ge 1:26</a> may be taken as the plural of majesty or as referring to the Divine council, and on this account is not conclusive for the Trinitarian view. Indeed, there are no Old Testament passages which compel us to understand the complete New Testament doctrine of the Trinity and the distinct personality of the Spirit in the New Testament sense. There are, however, numerous Old Testament passages which are in harmony with the Trinitarian conception and prepare the way for it, such as <a onClick="return mV(\'Psa\',139,7);">Ps 139:7</a>; <a onClick="return mV(\'Isa\',63,10);">Isa 63:10</a>; <a onClick="return mV(\'Isa\',48,16);">48:16</a>; <a onClick="return mV(\'Hag\',2,5);">Hag 2:5</a>; <a onClick="return mV(\'Zec\',4,6);">Zec 4:6</a>. The Spirit is grieved, vexed, etc., and in other ways is conceived of personally, but as He is God in action, God exerting power, this was the natural way for the Old Testament writers to think of the Spirit.<P>The question has been raised as to how the Biblical writers were able to hold the conception of the Spirit of God without violence to their monotheism. A suggested reply is that the idea of the Spirit came gradually and indirectly from the conception of subordinate gods which prevailed among some of the surrounding nations (I.F. Wood, The Spirit of God in Biblical Literature, 30). But the best Israelite thought developed in opposition to, rather than in analogy with, polytheism. A more natural explanation seems to be that their simple anthropomorphism led them to conceive the Spirit of God as the breath of God parallel with the conception of man\'s breath as being part of man and yet going forth from him.<P>3. The Spirit in External Nature:<P>We consider next the Spirit of God in external Nature. "And the Spirit of God moved (was brooding or hovering) upon the face of the waters" (<a onClick="return mV(\'Gen\',1,2);">Ge 1:2</a>). The figure is that of a brooding or hovering bird (compare <a onClick="return mV(\'Deu\',32,11);">De 32:11</a>). Here the Spirit brings order and beauty out of the primeval chaos and conducts the cosmic forces toward the goal of an ordered universe. Again in <a onClick="return mV(\'Psa\',104,\'28-30\');">Ps 104:28-30</a>, God sends forth His Spirit, and visible things are called into being: "Thou sendest forth thy Spirit, they are created; and thou renewest the face of the ground." In <a onClick="return mV(\'Job\',26,13);">Job 26:13</a> the beauty of the heavens is ascribed to the Spirit: "By his Spirit the heavens are garnished." In <a onClick="return mV(\'Isa\',32,15);">Isa 32:15</a> the wilderness becomes a fruitful field as the result of the outpouring of the Spirit. The Biblical writers scarcely took into their thinking the idea of second causes, certainly not in the modern scientific sense. They regarded the phenomena of Nature as the result of God\'s direct action through His Spirit. At every point their conception of the Spirit saved them from pantheism on the one hand and polytheism on the other.<P>4. The Spirit of God in Man:<P>The Spirit may next be considered in imparting natural powers both physical and intellectual. In <a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a> God originates man\'s personal and intellectual life by breathing into his nostrils "the breath of life." In <a onClick="return mV(\'Num\',16,22);">Nu 16:22</a> God is "the God of the spirits of all flesh." In <a onClick="return mV(\'Exd\',28,3);">Ex 28:3</a>; <a onClick="return mV(\'Exd\',31,3);">31:3</a>; <a onClick="return mV(\'Exd\',35,31);">35:31</a>, wisdom for all kinds of workmanship is declared to be the gift of God. So also physical life is due to the presence of the Spirit of God (<a onClick="return mV(\'Job\',27,3);">Job 27:3</a>); and Elihu declares (<a onClick="return mV(\'Job\',33,4);">Job 33:4</a>) that the Spirit of God made him. See also <a onClick="return mV(\'Eze\',37,14);">Eze 37:14</a> and <a onClick="return mV(\'Eze\',39,29);">Eze 39:29</a>. Thus man is regarded by the Old Testament writers, in all the parts of his being, body, mind and spirit, as the direct result of the action of the Spirit of God. In <a onClick="return mV(\'Gen\',6,3);">Ge 6:3</a> the Spirit of God "strives" with or "rules" in or is "humbled" in man in the antediluvian world. Here reference is not made to the Spirit\'s activity over and above, but within the moral nature of man.<P>5. Imparting Powers for Service:<P>The greater part of the Old Testament passages which refer to the Spirit of God deal with the subject from the point of view of the covenant relations between Yahweh and Israel. And the greater portion of these, in turn, have to do with gifts and powers conferred by the Spirit for service in the ongoing of the kingdom of God. We fail to grasp the full meaning of very many statements of the Old Testament unless we keep constantly in mind the fundamental assumption of all the Old Testament, namely, the covenant relations between God and Israel. Extraordinary powers exhibited by Israelites of whatever kind were usually attributed to the Spirit. These are so numerous that our limits of space forbid an exhaustive presentation. The chief points we may notice.<P>(1) Judges and Warriors.<P>The children of Israel cried unto Yahweh and He raised up a savior for them, Othniel, the son of Kenaz: "And the Spirit of Yahweh came upon him, and he judged Israel" (<a onClick="return mV(\'Jdg\',3,10);">Jud 3:10</a>). So also Gideon (<a onClick="return mV(\'Jdg\',6,34);">Jud 6:34</a>): "The Spirit of Yahweh came upon (literally, clothed itself with) Gideon." In <a onClick="return mV(\'Jdg\',11,29);">11:29</a> "the spirit of Yahweh came upon Jephthah"; and in <a onClick="return mV(\'Jdg\',13,25);">Jud 13:25</a> "the Spirit of Yahweh began to move" Samson. In <a onClick="return mV(\'Jdg\',14,6);">14:6</a> "the Spirit of Yahweh came mightily upon him." In <a onClick="return mV(\'1Sa\',16,14);">1Sa 16:14</a> we read "the Spirit of Yahweh departed from Saul, and an evil spirit from Yahweh troubled him." In all this class of passages, the Spirit imparts special endowments of power without necessary reference to the moral character of the recipient. The end in view is not personal, merely to the agent, but concerns theocratic kingdom and implies the covenant between God and Israel. In some cases the Spirit exerts physical energy in a more direct way (<a onClick="return mV(\'2Ki\',2,16);">2Ki 2:16</a>; <a onClick="return mV(\'Eze\',2,1);">Eze 2:1</a>f; <a onClick="return mV(\'Eze\',3,12);">3:12</a>).<P>(2) Wisdom for Various Purposes.<P>Bezalel is filled with the Spirit of God in wisdom and in understanding to work in gold, and silver and brass, etc., in the building of the tabernacle (<a onClick="return mV(\'Exd\',31,\'2-4\');">Ex 31:2-4</a>; <a onClick="return mV(\'Exd\',35,31);">35:31</a>); and the Spirit of wisdom is given to others in making Aaron\'s garments (<a onClick="return mV(\'Exd\',28,3);">Ex 28:3</a>). So also of one of the builders of Solomon\'s temple (<a onClick="return mV(\'1Ki\',7,14);">1Ki 7:14</a>; <a onClick="return mV(\'2Ch\',2,14);">2Ch 2:14</a>). In these cases there seems to be a combination of the thought of natural talents and skill to which is superadded a special endowment of the Spirit. Pharaoh refers to Joseph as one in whom the Spirit of God is, as fitting him for administration and government (<a onClick="return mV(\'Gen\',41,38);">Ge 41:38</a>). Joshua is qualified for leadership by the Spirit (<a onClick="return mV(\'Num\',27,18);">Nu 27:18</a>). In this and in <a onClick="return mV(\'Deu\',34,9);">De 34:9</a>, Joshua is represented as possessing the Spirit through the laying on of the hands of Moses. This is an interesting Old Testament parallel to the bestowment of the Spirit by laying on of hands in the New Testament (<a onClick="return mV(\'Act\',8,17);">Ac 8:17</a>; <a onClick="return mV(\'Act\',19,6);">19:6</a>). Daniel is represented as having wisdom to interpret dreams through the Spirit, and afterward because of the Spirit he is exalted to a position of authority and power (<a onClick="return mV(\'Dan\',4,8);">Da 4:8</a>; <a onClick="return mV(\'Dan\',5,\'11-14\');">5:11-14</a>; <a onClick="return mV(\'Dan\',6,3);">6:3</a>). The Spirit qualifies Zerubbabel to rebuild the temple (<a onClick="return mV(\'Zec\',4,6);">Zec 4:6</a>). The Spirit was given to the people for instruction and strengthening during the wilderness wanderings (<a onClick="return mV(\'Neh\',9,20);">Ne 9:20</a>), and to the elders along with Moses (<a onClick="return mV(\'Num\',11,17,25);">Nu 11:17, 25</a>). It thus appears how very widespread were the activities of the redemptive Spirit, or the Spirit in the covenant. All these forms of the Spirit\'s action bore in some way upon the national life of the people, and were directed in one way or another toward theocratic ends.<P>(3) In Prophecy.<P>The most distinctive and important manifestation of the Spirit\'s activity in the Old Testament was in the sphere of prophecy. In the earlier period the prophet was called seer (ro\'eh), and later he was called prophet (nabhi\'). The word "prophet" (prophetes) means one who speaks for God. The prophets were very early differentiated from the masses of the people into a prophetic class or order, although Abraham himself was called a prophet, as were Moses and other leaders (<a onClick="return mV(\'Gen\',20,7);">Ge 20:7</a>; <a onClick="return mV(\'Deu\',18,15);">De 18:15</a>). The prophet was especially distinguished from others as the man who possessed the Spirit of God (<a onClick="return mV(\'Hsa\',9,7);">Ho 9:7</a>). The prophets ordinarily began their messages with the phrase, "thus saith Yahweh," or its equivalent. But they ascribed their messages directly also to the Spirit of God (<a onClick="return mV(\'Eze\',2,2);">Eze 2:2</a>; <a onClick="return mV(\'Eze\',8,3);">8:3</a>; <a onClick="return mV(\'Eze\',11,1,24);">11:1, 24</a>; <a onClick="return mV(\'Eze\',13,3);">13:3</a>). The case of Balaam presents some difficulties (<a onClick="return mV(\'Num\',24,2);">Nu 24:2</a>). He does not seem to have been a genuine prophet, but rather a diviner, although it is declared that the Spirit of God came upon him. Balaam serves, however, to illustrate the Old Testament point of view. The chief interest was the national or theocratic or covenant ideal, not that of the individual. The Spirit was bestowed at times upon unworthy men for the achievement of these ends. Saul presents a similar example. The prophet was God\'s messenger speaking God\'s message by the Spirit. His message was not his own. It came directly from God, and at times overpowered the prophet with its urgency, as in the case of Jeremiah (<a onClick="return mV(\'Jer\',1,4);">1:4</a>ff).<P>There are quite perceptible stages in the development of the Old Testament prophecy. In the earlier period the prophet was sometimes moved, not so much to intelligible speech, as by a sort of enthusiasm or prophetic ecstasy. In <a onClick="return mV(\'1Sa\',10,\'1-\');">1Sa 10</a> we have an example of this earlier form of prophecy, where a company with musical instruments prophesied together. To what extent this form of prophetic enthusiasm was attended by warnings and exhortations, if so attended at all, we do not know. There was more in it than in the excitement of the diviners and devotees of the surrounding nations. For the Spirit of Yahweh was its source.<P>In the later period we have prophecy in its highest forms in the Old Testament. The differences between earlier and later prophecy are probably due in part to the conditions. The early period required action, the later required teaching. The judges on whom the Spirit came were deliverers in a turbulent age. There was not need for, nor could the people have borne, the higher ethical and spiritual truths which came in later revelations through the prophets Isaiah, Jeremiah and others. See <a onClick="return mV(\'2Sa\',23,2);">2Sa 23:2</a>; <a onClick="return mV(\'Eze\',2,2);">Eze 2:2</a>; <a onClick="return mV(\'Eze\',8,3);">8:3</a>; <a onClick="return mV(\'Eze\',11,24);">11:24</a>; <a onClick="return mV(\'Eze\',13,3);">13:3</a>; .<a onClick="return mV(\'Mic\',3,8);">Mic 3:8</a>; <a onClick="return mV(\'Hsa\',9,7);">Ho 9:7</a>.<P>A difficulty arises from statements such as the following: A lying spirit was sometimes present in the prophet (<a onClick="return mV(\'1Ki\',22,21);">1Ki 22:21</a>f); Yahweh puts a spirit in the king of Assyria and turns him back to his destruction (<a onClick="return mV(\'Isa\',37,7);">Isa 37:7</a>); because of sin, a lying prophet should serve the people (<a onClick="return mV(\'Mic\',2,11);">Mic 2:11</a>); in Micaiah\'s vision Yahweh sends a spirit to entice Ahab through lying prophets (<a onClick="return mV(\'1Ki\',22,19);">1Ki 22:19</a>); an evil spirit from Yahweh comes upon Saul (<a onClick="return mV(\'1Sa\',16,14);">1Sa 16:14</a>; <a onClick="return mV(\'1Sa\',18,10);">18:10</a>; <a onClick="return mV(\'1Sa\',19,9);">19:9</a>). The following considerations may be of value in explaining these passages. Yahweh was the source of things generally in Old Testament thought. Its pronounced monotheism appears in this as in so many other ways. Besides this, Old Testament writers usually spoke phenomenally. Prophecy was a particular form of manifestation with certain outward marks and signs. Whatever presented these outward marks was called prophecy, whether the message conveyed was true or false. The standard of discrimination here was not the outward signs of the prophet, but the truth or right of the message as shown by the event. As to the evil spirit from Yahweh, it may be explained in either of two ways. First, it may have referred to the evil disposition of the man upon whom God\'s Spirit was acting, in which case he would resist the Spirit and his own spirit would be the evil spirit. Or the "evil spirit from Yahweh" may have referred, in the prophet\'s mind, to an actual spirit of evil which Yahweh sent or permitted to enter the man. The latter is the more probable explanation, in accordance with which the prophet would conceive that Yahweh\'s higher will was accomplished, even through the action of the evil spirit upon man\'s spirit. Yahweh\'s judicial anger against transgression would, to the prophet\'s mind, justify the sending of an evil spirit by Yahweh.<P>6. Imparting Moral Character:<P>The activity of the Spirit in the Old Testament is not limited to gifts for service. Moral and spiritual character is traced to the Spirit\'s operations as well. "Thy holy Spirit" (<a onClick="return mV(\'Psa\',51,11);">Ps 51:11</a>); "his holy spirit" (<a onClick="return mV(\'Isa\',63,10);">Isa 63:10</a>); "thy good Spirit" (<a onClick="return mV(\'Neh\',9,20);">Ne 9:20</a>); "Thy Spirit is good" (<a onClick="return mV(\'Psa\',143,10);">Ps 143:10</a>) are expressions pointing to the ethical quality of the Spirit\'s action. "Holy" is from the verb form (qadhash), whose root meaning is doubtful, but which probably meant "to be separated" from which it comes to mean to be exalted, and this led to the conception to be Divine. And as Yahweh is morally good, the conception of "the holy (= Divine) one" came to signify the holy one in the moral sense. Thence the word was applied to the Spirit of Yahweh. Yahweh gives His good Spirit for instruction (<a onClick="return mV(\'Neh\',9,20);">Ne 9:20</a>); the Spirit is called good because it teaches to do God\'s will (<a onClick="return mV(\'Psa\',143,10);">Ps 143:10</a>); the Spirit gives the fear of the Lord (<a onClick="return mV(\'Isa\',11,\'2-5\');">Isa 11:2-5</a>); judgment and righteousness (<a onClick="return mV(\'Isa\',32,15);">Isa 32:15</a>); devotion to the Lord (<a onClick="return mV(\'Isa\',44,\'3-5\');">Isa 44:3-5</a>); hearty obedience and a new heart (<a onClick="return mV(\'Eze\',36,26);">Eze 36:26</a>f); penitence and prayer (<a onClick="return mV(\'Zec\',12,10);">Zec 12:10</a>). In <a onClick="return mV(\'Psa\',51,11);">Ps 51:11</a> there is an intense sense of guilt and sin coupled with the prayer, "Take not thy holy Spirit from me." Thus, we see that the Old Testament in numerous ways recognizes the Holy Spirit as the source of inward moral purity, although the thought is not so developed as in the New Testament.<P>7. The Spirit in the Messiah:<P>In both the first and the second sections of Isaiah, there are distinct references to the Spirit in connection with the Messiah, although the Messiah is conceived as the ideal King who springs from the root of David in some instances, and in others as the Suffering Servant of Yahweh. This is not the place to discuss the Messianic import of the latter group of passages which has given rise to much difference of opinion. As in the case of the ideal Davidic King which, in the prophet\'s mind, passes from the lower to the higher and Messianic conception, so, under the form of the Suffering Servant, the "remnant" of Israel becomes the basis for an ideal which transcends in the Messianic sense the original nucleus of the conception derived from the historic events in the history of Israel. The prophet rises in the employment of both conceptions to the thought of the Messiah who is the "anointed" of Yahweh as endued especially with the power and wisdom of the Spirit. In <a onClick="return mV(\'Isa\',11,\'1-5\');">Isa 11:1-5</a> a glowing picture is given of the "shoot out of the stock of Jesse." The Spirit imparts "wisdom and understanding" and endows him with manifold gifts through the exercise of which he shall bring in the kingdom of righteousness and peace. In <a onClick="return mV(\'Isa\',42,1);">Isa 42:1</a>ff, the "servant" is in like manner endowed most richly with the gifts of the Spirit by virtue of which he shall bring forth "justice to the Gentiles." In <a onClick="return mV(\'Isa\',61,1);">Isa 61:1</a>ff occur the notable words cited by Jesus in <a onClick="return mV(\'Luk\',4,18);">Lu 4:18</a>f; beginning, "The Spirit of the Lord is upon me" etc. In these passages the prophet describes elaborately and minutely the Messiah\'s endowment with a wide range of powers, all of which are traced to the action of God\'s Spirit.<P>8. Predictions of Future Outpouring of the Spirit:<P>In the later history of Israel, when the sufferings of the exile pressed heavily, there arose a tendency to idealize a past age as the era of the special blessing of the Spirit, coupled with a very marked optimism as to a future outpouring of the Spirit. In <a onClick="return mV(\'Hag\',2,5);">Hag 2:5</a> reference is made to the Mosaic period as the age of the Spirit, "when ye came out of Egypt, and my Spirit abode among you." In <a onClick="return mV(\'Isa\',44,3);">Isa 44:3</a> the Spirit is to be poured out on Jacob and his seed; and in <a onClick="return mV(\'Isa\',59,20);">Isa 59:20</a> a Redeemer is to come to Zion under the covenant of Yahweh, and the Spirit is to abide upon the people. The passage, however, which especially indicates the transition from Old Testament to New Testament times is that in <a onClick="return mV(\'Joe\',2,28,32);">Joe 2:28, 32</a> which is cited by Peter in <a onClick="return mV(\'Act\',2,\'17-21\');">Ac 2:17-21</a>. In this prophecy the bestowal of the Spirit is extended to all classes, is attended by marvelous signs and is accompanied by the gift of salvation. Looking back from the later to the earlier period of Old Testament history, we observe a twofold tendency of teaching in relation to the Spirit. The first is from the outward gift of the Spirit for various uses toward a deepening sense of inner need of the Spirit for moral purity, and consequent emphasis upon the ethical energy of the Spirit. The second tendency is toward a sense of the futility of the merely human or theocratic national organization in and of itself to achieve the ends of Yahweh, along with a sense of the need for the Spirit of God upon the people generally, and a prediction of the universal diffusion of the Spirit.<P>II. The Spirit in Non-Canonical Jewish Literature.<P>In the Palestinian and Alexandrian literature of the Jews there are comparatively few references to the Spirit of God. The two books in which the teachings as to the Spirit are most explicit and most fully developed are of Alexandrian origin, namely, The Wisdom of Solomon and the writings of Philo.<P>In the Old Testament Apocrypha and in Josephus the references to the Spirit are nearly always merely echoes of a long-past age when the Spirit was active among men. In no particular is the contrast between the canonical and noncanonical literature more striking than in the teaching as to the Spirit of God.<p>1. The Spirit of Josephus:<P>Josephus has a number of references to the Holy Spirit, but nearly always they have to do with the long-past history of Israel. He refers to 22 books of the Old Testament which are of the utmost reliability. There are other books, but none "of like authority," because there has "not been an exact succession of prophets" (Josephus, Against Apion I, 8). Samuel is described as having a large place in the affairs of the kingdom because he is a prophet (Ant., VI, v, 6). God appears to Solomon in sleep and teaches him wisdom (ibid., VIII, ii); Balaam prophesies through the Spirit\'s power (ibid., IV, v, 6); and Moses was such a prophet that his words were God\'s words (ibid., IV, viii, 49). In Josephus we have then simply a testimony to the inspiration and power of the prophets and the books written by them, in so far as we have in him teachings regarding the Spirit of God. Even here the action of the Spirit is usually implied rather than expressed.<P>2. The Spirit in the Pseudepigrapha:<P>In the pseudepigraphic writings the Spirit of God is usually referred to as acting in the long-past history of Israel or in the future Messianic age. In the apocalyptic books, the past age of power, when the Spirit wrought mightily, becomes the ground of the hopes of the future. The past is glorified, and out of it arises the hope of a future kingdom of glory and power. Enoch says to Methuselah: "The word calls me and the Spirit is poured out upon me" (En 91:1). In <span class="noTag">49:1-4</span> the Messiah has the Spirit of wisdom, understanding and might. Enoch is represented as describing his own translation. "He was carried aloft in the chariots of the Spirit" (En 70:2). In Jubilees 31:16 Isaac is represented as prophesying, and in <span class="noTag">25:13</span> it is said of Rebekah that the" Holy Spirit descended into her mouth." Sometimes the action of the Spirit is closely connected with the moral life, although this is rare. "The Spirit of God rests" on the man of pure and loving heart (XII the Priestly Code (P), Benj. 8). In Simeon 4 it is declared that Joseph was a good man and that the Spirit of God rested on him. There appears at times a lament for the departed age of prophecy (1Macc 9:27; 14:41). The future is depicted in glowing colors. The Spirit is to come in a future judgment (XII the Priestly Code (P), <span class="noTag">Levi 18</span>); and the spirit of holiness shall rest upon the redeemed in Paradise (<span class="noTag">Levi 18</span>); and in <span class="noTag">Levi 2</span> the spirit of insight is given, and the vision of the sinful world and its salvation follows. Generally speaking, this literature is far below that of the Old Testament, both in moral tone and religious insight. Much of it seems childish, although at times we encounter noble passages. There is lacking in it the prevailing Old Testament mood which is best described as prophetic, in which the writer feels constrained by the power of God\'s Spirit to speak or write. The Old Testament literature thus possesses a vitality and power which accounts for the strength of its appeal to our religious consciousness.<P>3. The Spirit in the Wisdom of Solomon:<P>We note in the next place a few teachings as to the Spirit of God in Wisd. Here the ethical element in character is a condition of the Spirit\'s indwelling. "Into a malicious soul wisdom shall not enter: nor dwell in the body that is subject unto sin. For the holy spirit of discipline will flee deceit, and will not abide when unrighteousness cometh in" (The <span class="noTag">Wisdom of Solomon 1:4f</span>). This "holy spirit of discipline" is evidently God\'s Holy Spirit, for in <span class="noTag">1:7</span> the writer proceeds to assert, "For the Spirit of the Lord filleth the world," and in <span class="noTag">1:8,9</span> there is a return to the conception of unrighteousness as a hindrance to right speaking. In The <span class="noTag">Wisdom of Solomon 7:7</span> the Spirit of Wisdom comes in response to prayer. In <span class="noTag">7:22-30</a> is an elaborate and very beautiful description of wisdom: "In her is an understanding spirit, holy, one only, manifold, subtle, lively, clear, undefiled, plain, not subject to hurt, loving the thing that is good, quick, which cannot be letted, ready to do good, kind to man, steadfast, sure," etc. "She is the brightness of the everlasting light, the unspotted mirror of the power of God, and the image of his goodness," etc. No one can know God\'s counsel except by the Holy Spirit (<span class="noTag">9:17</span>). The writer of The Wisdom of Solomon was deeply possessed of the sense of the omnipresence of the Spirit of God, as seen in <span class="noTag">1:7 and in 12:1</span>. In the latter passage we read: "For thine incorruptible spirit is in all things."<P>4. The Spirit in Philo:<P>In Philo we have what is almost wholly wanting in other Jewish literature, namely, analytic and reflective thought upon the work of the Spirit of God. The interest in Philo is primarily philosophic, and his teachings on the Spirit possess special interest on this account in contrast with Biblical and other extra-Biblical literature. In his Questions and Solutions, 27, 28, he explains the expression in <a onClick="return mV(\'Gen\',8,1);">Ge 8:1</a>: "He brought a breath over the earth and the wind ceased." He argues that water is not diminished by wind, but only agitated and disturbed. Hence, there must be a reference to God\'s Spirit or breath by which the whole universe obtains security. He has a similar discussion of the point why the word "Spirit" is not used instead of "breath" in Gen in the account of man\'s creation, and concludes that "to breathe into" here means to "inspire," and that God by His Spirit imparted to man mental and moral life and capacity for Divine things (Allegories, xiii). In several passages Philo discusses prophecy and the prophetic office. One of the most interesting relates to the prophetic office of Moses (Life of Moses, xxiiiff). He also describes a false prophet who claims to be "inspired and possessed by the Holy Spirit" (On Those Who Offer Sacrifice, xi). In a very notable passage, Philo describes in detail his own subjective experiences under the influence of the Holy Spirit, and his language is that of the intellectual mystic. He says that at times he found himself devoid of impulse or capacity for mental activity, when suddenly by the coming of the Spirit of God, his intellect was rendered very fruitful: "and sometimes when I have come to my work empty I have suddenly become full, ideas being, in an invisible manner, showered upon me and implanted in me from on high; so that through the influence of Divine inspiration I have become greatly excited and have known neither the place in which I was, nor those who were present, nor myself, nor what I was saying, nor what I was writing," etc. (Migrations of Abraham, vii).<P>In Philo, as in the non-canonical literature generally, we find little metaphysical teaching as to the Spirit and His relations to the Godhead. On this point there is no material advance over the Old Testament teaching. The agency of the Holy Spirit in shaping and maintaining the physical universe and as the source of man\'s capacities and powers is clearly recognized in Philo. In Philo, as in Josephus, the conception of inspiration as the complete occupation and domination of the prophet\'s mind by the Spirit of God, even to the extent of suspending the operation of the natural powers, comes clearly into view. This is rather in contrast with, than in conformity to, the Old Testament and New Testament conception of inspiration, in which the personality of the prophet remains intensely active while under the influence of the Spirit, except possibly in cases of vision and trance.``127';
isbe[4403]='Holy Spirit, 2`III. The Holy Spirit in the New Testament.<P>In the New Testament there is unusual symmetry and completeness of teaching as to the work of the Spirit of God in relation to the Messiah Himself, and to the founding of the Messianic kingdom. The simplest mode of presentation will be to trace the course of the progressive activities of the Spirit, or teachings regarding these activities, as these are presented to us in the New Testament literature as we now have it, so far as the nature of the subject will permit. This will, of course, disturb to some extent the chronological order in which the New Testament books were written, since in some cases, as in John\'s Gospel, a very late book contains early teachings as to the Spirit.<P>1. In Relation to the Person and Work of Christ:<P>(1) Birth of Jesus.<P>In <a onClick="return mV(\'Mat\',1,18);">Mt 1:18</a> Mary is found with child "of the Holy Spirit" (ek pneumatos hagiou); an angel tells Joseph that that "which is conceived in her is of the Holy Spirit" (<a onClick="return mV(\'Mat\',1,20);">Mt 1:20</a>), all of which is declared to be in fulfillment of the prophecy that a virgin shall bring forth a son whose name shall be called Immanuel (<a onClick="return mV(\'Isa\',7,14);">Isa 7:14</a>). In <a onClick="return mV(\'Luk\',1,35);">Lu 1:35</a> the angel says to Mary that the Holy Spirit (pneuma hagion) shall come upon her, and the power of the Most High (dunamis Hupsistou) shall overshadow her. Here "Holy Spirit" and "power of the Most High" are parallel expressions meaning the same thing; in the one case emphasizing the Divine source and in the other the holiness of "the holy thing which is begotten" (<a onClick="return mV(\'Luk\',1,35);">Lu 1:35</a>). In connection with the presentation of the babe in the temple, Simeon is described as one upon whom the Holy Spirit rested, to whom revelation was made through the Spirit and who came into the temple in the Spirit (<a onClick="return mV(\'Luk\',2,\'25-28\');">Lu 2:25-28</a>). So also Anna the prophetess speaks concerning the babe, evidently in Luke\'s thought, under the influence of the Holy Spirit (<a onClick="return mV(\'Luk\',2,36);">Lu 2:36</a>).<P>It is clear from the foregoing that the passages in Matthew and Luke mean to set forth, first, the supernatural origin, and secondly, the sinlessness of the babe born of Mary. The act of the Holy Spirit is regarded as creative, although the words employed signify "begotten" or "born" (gennethen, <a onClick="return mV(\'Mat\',1,20);">Mt 1:20</a>; and gennomenon, <a onClick="return mV(\'Luk\',1,35);">Lu 1:35</a>). There is no hint in the stories of the nativity concerning the pretemporal existence of Christ. This doctrine was developed later. Nor is there any suggestion of the immaculate conception or sinlessness of Mary, the mother of our Lord. Dr. C.A. Briggs has set forth a theory of the sinlessness of Mary somewhat different from the Roman Catholic view, to the effect that the Old Testament prophecies foretell the purification of the Davidic line, and that Mary was the culminating point in the purifying process, who thereby became sinless (Incarnation of the Lord, 230-34). This, however, is speculative and without substantial Biblical warrant. The sinlessness of Jesus was not due to the sinlessness of His mother, but to the Divine origin of His human nature, the Spirit of God.<P>In <a onClick="return mV(\'Hbr\',10,5);">Heb 10:5</a>ff the writer makes reference to the sinless body of Christ as affording a perfect offering for sins. No direct reference is made to the birth of Jesus, but the origin of His body is ascribed to God (<a onClick="return mV(\'Hbr\',10,5);">Heb 10:5</a>), though not specifically to the Holy Spirit.<P>(2) Baptism of Jesus.<P>The New Testament records give us very little information regarding the growth of Jesus to manhood. In <a onClick="return mV(\'Luk\',2,40);">Lu 2:40</a>ff a picture is given of the boyhood, exceedingly brief, but full of significance. The "child grew, and waxed strong, filled with wisdom (m "becoming full of wisdom"): and the grace of God was upon him." Then follows the account of the visit to the temple. Evidently in all these experiences, the boy is under the influence and guidance of the Spirit. This alone would supply an adequate explanation, although Luke does not expressly name the Spirit as the source of these particular experiences. The Spirit\'s action is rather assumed.<P>Great emphasis, however, is given to the descent of the Spirit upon Jesus at His baptism. <a onClick="return mV(\'Mat\',3,16);">Mt 3:16</a> declares that after His baptism "the heavens were opened unto him, and he saw the Spirit of God descending as a dove, and coming upon him." <a onClick="return mV(\'Mar\',1,10);">Mr 1:10</a> repeats the statement in substantially equivalent terms. <a onClick="return mV(\'Luk\',3,22);">Lu 3:22</a> declares that the Spirit descended in "bodily form, as a dove" (somatiko eidei hos peristeran). In <a onClick="return mV(\'Jhn\',1,32,33);">Joh 1:32-33</a> the Baptist testifies that he saw the Spirit descending upon Jesus as a dove out of heaven, and that it abode upon Him, and, further, that this descent of the Spirit was the mark by which he was to recognize Jesus as "he that baptizeth in the Holy Spirit."<P>We gather from these passages that at the baptism there was a new communication of the Spirit to Jesus in great fullness, as a special anointing for His Messianic vocation. The account declares that the dovelike appearance was seen by Jesus as well as John, which is scarcely compatible with a subjective experience merely. Of course, the dove here is to be taken as a symbol, and not as an assertion that God\'s Spirit assumed the form of a dove actually. Various meanings have been assigned to the symbol. One connects it with the creative power, according to a Gentile usage; others with the speculative philosophy of Alexandrian Judaism, according to which the dove symbolized the Divine wisdom or reason. But the most natural explanation connects the symbolism of the dove with the brooding or hovering of the Spirit in <a onClick="return mV(\'Gen\',1:2);">Ge 1:2</a>. In this new spiritual creation of humanity, as in the first physical creation, the Spirit of God is the energy through which the work is carried on. Possibly the dove, as a living organism, complete in itself, may suggest the totality and fullness of the gift of the Spirit to Jesus. At Pentecost, on the contrary, the Spirit is bestowed distributively and partially at least to individuals as such, as suggested by the cloven tongues as of fire which "sat upon each one of them" (<a onClick="return mV(\'Act\',2,3);">Ac 2:3</a>). <a onClick="return mV(\'Jhn\',3,34);">Joh 3:34</a> emphasizes the fullness of the bestowal upon Jesus: "For he whom God hath sent speaketh the words of God: for he giveth not the Spirit by measure." In the witness of the Baptist the permanence of the anointing of Jesus is declared: "Upon whomsoever thou shalt see the Spirit descending, and abiding" (<a onClick="return mV(\'Jhn\',1,33);">1:33</a>).<P>It is probable that the connection of the bestowal of the Spirit with water baptism, as seen later in the Book of Acts, is traceable to the reception of the Spirit by Jesus at His own baptism. Baptism in the Spirit did not supersede water baptism.<P>The gift of the Spirit in fullness to Jesus at His baptism was no doubt His formal and public anointing for His Messianic work (<a onClick="return mV(\'Act\',10,38);">Ac 10:38</a>). The baptism of Jesus could not have the same significance with that of sinful men. For the symbolic cleansing from sin had no meaning for the sinless one. Yet as an act of formal public consecration it was appropriate to the Messiah. It brought to a close His private life and introduced Him to His public Messianic career. The conception of an anointing for public service was a familiar one in the Old Testament writings and applied to the priest (<a onClick="return mV(\'Exd\',28,41);">Ex 28:41</a>; <a onClick="return mV(\'Exd\',40,13);">40:13</a>; <a onClick="return mV(\'Lev\',4,3,5,16);">Le 4:3, 5, 16</a>; <a onClick="return mV(\'Lev\',6,20,22);">6:20, 22</a>); to kings (<a onClick="return mV(\'1Sa\',9,16);">1Sa 9:16</a>; <a onClick="return mV(\'1Sa\',10,1);">10:1</a>; <a onClick="return mV(\'1Sa\',15,1);">15:1</a>; <a onClick="return mV(\'1Sa\',16,3,13);">16:3, 13</a>); sometimes to prophets (<a onClick="return mV(\'1Ki\',19,16);">1Ki 19:16</a>; compare <a onClick="return mV(\'Isa\',61,1);">Isa 61:1</a>; <a onClick="return mV(\'Psa\',2,2);">Ps 2:2</a>; <a onClick="return mV(\'Psa\',20,6);">20:6</a>). These anointings were with oil, and the oil came to be regarded as a symbol of the Spirit of God.<P>The anointing of Jesus with the Holy Spirit qualified Him in two particulars for His Messianic office.<P>(a) It was the source of His own endowments of power for the endurance of temptation, for teaching, for casting out demons, and healing the sick, for His sufferings and death, for His resurrection and ascension. The question is often raised, why Jesus, the Divine one, should have needed the Holy Spirit for His Messianic vocation. The reply is that His human nature, which was real, required the Spirit\'s presence. Man, made in God\'s image, is constituted in dependence upon the Spirit of God. Apart from God\'s Spirit man fails of his true destiny, simply because our nature is constituted as dependent upon the indwelling Spirit of God for the performance of our true functions. Jesus as human, therefore, required the presence of God\'s Spirit, notwithstanding His Divine-human consciousness.<P>(b) The Holy Spirit\'s coming upon Jesus in fullness also qualified Him to bestow the Holy Spirit upon His disciples. John the Baptist especially predicts that it is He who shall baptize in the Holy Spirit (<a onClick="return mV(\'Mat\',3,11);">Mt 3:11</a>; <a onClick="return mV(\'Mar\',1:8);">Mr 1:8</a>; <a onClick="return mV(\'Luk\',3,16);">Lu 3:16</a>; see also <a onClick="return mV(\'Jhn\',20,22);">Joh 20:22</a>; <a onClick="return mV(\'Act\',1,5);">Ac 1:5</a>). It was especially true of the king that He was anointed for His office, and the term Messiah (mashiach, equivalent to the Greek ho Christos), meaning the Anointed One, points to this fact.<P>(3) Temptation of Jesus.<P>The facts as to the temptation are as follows: In <a onClick="return mV(\'Mat\',4,1);">Mt 4:1</a> we are told that Jesus was led by the Spirit into the wilderness to be tempted of the devil. <a onClick="return mV(\'Mar\',1,12);">Mr 1:12</a> declares in his graphic way that after the baptism "straightway the Spirit driveth (ekballei) him forth into the wilderness." <a onClick="return mV(\'Luk\',4,1);">Lu 4:1</a> more fully declares that Jesus was "full of the Holy Spirit," and that He was "led in the Spirit in the wilderness during 40 days." The impression which the narratives of the temptation give is of energetic spiritual conflict. As the Messiah confronted His life task He was subject to the ordinary conditions of other men in an evil world. Not by sheer divinity and acting from without as God, but as human also and a part of the world, He must overcome, so that while He was sinless, it was nevertheless true that the righteousness of Jesus was also an achieved righteousness. The temptations were no doubt such as were peculiar to His Messianic vocation, the misuse of power, the presumption of faith and the appeal of temporal splendor. To these He opposes the restraint of power, the poise of faith and the conception of a kingdom wholly spiritual in its origin, means and ends. Jesus is hurled, as it were, by the Spirit into this terrific conflict with the powers of evil, and His conquest, like the temptations themselves, was not final, but typical and representative. It is a mistake to suppose that the temptations of Jesus ended at the close of the forty days. Later in His ministry, He refers to the disciples as those who had been with Him in His temptations (<a onClick="return mV(\'Luk\',22,28);">Lu 22:28</a>). The temptations continued throughout His life, though, of course, the wilderness temptations were the severest test of all, and the victory there contained in principle and by anticipation later victories. Comment has been made upon the absence of reference to the Holy Spirit\'s influence upon Jesus in certain remarkable experiences, which in the case of others would ordinarily have been traced directly to the Spirit, as in <a onClick="return mV(\'Luk\',11,14);">Lu 11:14</a>ff, etc. (compare the article by James Denney in DCG, I, 732, 734). Is it not true, however, that the point of view of the writers of the Gospels is that Jesus is always under the power of the Spirit? At His baptism, in the temptation, and at the beginning of His public ministry (<a onClick="return mV(\'Luk\',4,14);">Lu 4:14</a>) very special stress is placed upon the fact. Thenceforward the Spirit\'s presence and action are assumed. From time to time, reference is made to the Spirit for special reasons, but the action of the Spirit in and through Jesus is always assumed.<P>(4) Public Ministry of Jesus.<P>Here we can select only a few points to illustrate a much larger truth. The writers of the Gospels, and especially Luke, conceived of the entire ministry of Jesus as under the power of the Holy Spirit. After declaring that Jesus was "full of the Holy Spirit" and that He was led about by the Spirit in the wilderness forty days in <a onClick="return mV(\'Luk\',4,1);">Luk 4:1</a>, he declares, in <a onClick="return mV(\'Luk\',11,14);">4:14</a>, that Jesus "returned in the power of the Spirit into Galilee." This is followed in the next verse [<a onClick="return mV(\'Luk\',4,15);">Luk 4:15</a>] by a general summary of His activities: "And he taught in their synagogues, being glorified of all." Then, as if to complete his teaching as to the relation of the Spirit to Jesus, he narrates the visit to Nazareth and the citation by Jesus in the synagogue there of Isaiah\'s words beginning, "The Spirit of the Lord is upon me," with the detailed description of His Messianic activity, namely, preaching to the poor, announcement of release to the captives, recovering of sight to the blind, and to proclaim the acceptable year of the Lord (<a onClick="return mV(\'Isa\',61,1);">Isa 61:1</a>f). Jesus proclaims the fulfillment of this prophecy in Himself (<a onClick="return mV(\'Luk\',4,21);">Lu 4:21</a>). In <a onClick="return mV(\'Mat\',12,18);">Mt 12:18</a>ff a citation from <a onClick="return mV(\'Isa\',42,\'1-3\');">Isa 42:1-3</a> is given in connection with the miraculous healing work of Jesus. It is a passage of exquisite beauty and describes the Messiah as a quiet and unobtrusive and tender minister to human needs, possessed of irresistible power and infinite patience. Thus the highest Old Testament ideals as to the operations of the Spirit of God come to realization, especially in the public ministry of Jesus. The comprehensive terms of the description make it incontestably clear that the New Testament writers thought of the entire public life of Jesus as directed by the Spirit of God. We need only to read the evangelic records in order to fill in the details.<P>The miracles of Jesus were wrought through the power of the Holy Spirit. Occasionally He is seized as it were by a sense of the urgency of His work in some such way as to impress beholders with the presence of a strange power working in Him. In one case men think He is beside Himself (<a onClick="return mV(\'Mar\',3,21);">Mr 3:21</a>); in another they are impressed with the authoritativeness of His teaching (<a onClick="return mV(\'Mar\',1,22);">Mr 1:22</a>); in another His intense devotion to His task makes Him forget bodily needs (<a onClick="return mV(\'Jhn\',4,31);">Joh 4:31</a>); again men think He has a demon (<a onClick="return mV(\'Jhn\',8,48);">Joh 8:48</a>); at one time He is seized with a rapturous joy when the 70 return from their successful evangelistic tour, and Luke declares that at that hour Jesus rejoiced in the Holy Spirit (<a onClick="return mV(\'Luk\',10,21);">Lu 10:21</a>; compare <a onClick="return mV(\'Mat\',11,25);">Mt 11:25</a>). This whole passage is a remarkable one, containing elements which point to the Johannine conception of Jesus, on which account Harnack is disposed to discredit it at certain points (Sayings of Jesus, 302). One of the most impressive aspects of this activity of Jesus in the Spirit is its suppressed intensity. Nowhere is there lack of self-control. Nowhere is there evidence of a coldly didactic attitude, on the one hand, or of a loose rein upon the will, on the other. Jesus is always an intensely human Master wrapped in Divine power. The miracles contrast strikingly with the miracles of the apocryphal gospels. In the latter all sorts of capricious deeds of power are ascribed to Jesus as a boy. In our Gospels, on the contrary, no miracle is wrought until after His anointing with the Spirit at baptism.<P>A topic of especial interest is that of blasphemy against the Holy Spirit. Jesus cast out demons by the power of God\'s Spirit. In <a onClick="return mV(\'Mat\',12,31);">Mt 12:31</a>; <a onClick="return mV(\'Mar\',3,28);">Mr 3:28</a>f; <a onClick="return mV(\'Luk\',12,10);">Lu 12:10</a>, we have the declaration that blasphemy against the Holy Spirit is an unpardonable sin. Mark particularizes the offense of the accusers of Jesus by saying that they said of Jesus, "He hath an unclean spirit." The blasphemy against the Spirit seems to have been not merely rejection of Jesus and His words, which might be due to various causes. It was rather the sin of ascribing works of Divine mercy and power-works which had all the marks of their origin in the goodness of God—to a diabolic source. The charge was that He cast out devils by Beelzebub the prince of devils. We are not to suppose that the unpardonable nature of the sin against the Holy Spirit was due to anything arbitrary in God\'s arrangements regarding sin. The moral and spiritual attitude involved in the charge against Jesus was simply a hopeless one. It presupposed a warping or wrenching of the moral nature from the truth in such degree, a deep-seated malignity and insusceptibility to Divine influences so complete, that no moral nucleus remained on which the forgiving love of God might work.<P>See <a href="study/isbe/search.html?string=BLASPHEMY">BLASPHEMY</A>.<P>(5) Death, Resurrection and Pentecostal Gift.<P>It is not possible to give here a complete outline of the activities of Jesus in the Holy Spirit. We observe one or two additional points as to the relations of the Holy Spirit to Him. In <a onClick="return mV(\'Hbr\',9,14);">Heb 9:14</a> it is declared that Christ "through the eternal Spirit offered himself without blemish unto God," and in <a onClick="return mV(\'Rom\',1,4);">Ro 1:4</a>, Paul says He was "declared to be the Son of God with power, according to the spirit of holiness, by the resurrection from the dead" (compare also <a onClick="return mV(\'Rom\',8,11);">Ro 8:11</a>).<P>As already noted, John the Baptist gave as a particular designation of Jesus that it was He who should baptize with the Holy Spirit, in contrast with his own baptism in water. In <a onClick="return mV(\'Jhn\',20,22);">Joh 20:22</a>, after the resurrection and before the ascension, Jesus breathed on the disciples and said "Receive ye the Holy Spirit." There was probably a real communication of the Spirit in this act of Jesus in anticipation of the outpouring in fullness on the day of Pentecost. In <a onClick="return mV(\'Act\',1,2);">Ac 1:2</a> it is declared that He gave commandment through the Holy Spirit, and in <a onClick="return mV(\'Act\',1,5);">Ac 1:5</a> it is predicted by Him that the disciples should "be baptized in the Holy Spirit not many days hence"; and in <a onClick="return mV(\'Act\',1,8);">Ac 1:8</a> it is declared, "Ye shall receive power, when the Holy Spirit is come upon you."<P>It is clear from the preceding that in the thought of the New Testament writers Jesus is completely endued with the power of the Holy Spirit. It is in large measure the Old Testament view of the Spirit; that is to say, the operation of the Spirit in and through Jesus is chiefly with a view to His official Messianic work, the charismatic Spirit imparting power rather than the Spirit for holy living merely. Yet there is a difference between the Old Testament and New Testament representations here. In the Old Testament the agency of the Spirit is made very prominent when mighty works are performed by His power. In the Gospels the view is concentrated less upon the Spirit than upon Jesus Himself, though it is always assumed that He is acting in the power of the Spirit. In the case of Jesus also, the moral quality of His words and deeds is always assumed.<P>2. The Holy Spirit in the Kingdom of God:<P>Our next topic in setting forth the New Testament teaching is the Holy Spirit in relation to the kingdom of God. Quite in harmony with the plenary endowment of Jesus, the founder of the kingdom, with the power of the Spirit, is the communication of the Spirit to the agents employed by Providence in the conduct of the affairs of the kingdom. We need, at all points, in considering the subject in the New Testament to keep in view the Old Testament background. The covenant relations between God and Israel were the presupposition of all the blessings of the Old Testament. In the New Testament there is not an identical but an analogous point of view. God is continuing His work among men. Indeed in a real sense He has begun a new work, but this new work is the fulfillment of the old. The new differs from the old in some very important respects, chiefly indeed in this, that now the national and theocratic life is wholly out of sight. Prophecy no longer deals with political questions. The power of the Spirit no longer anoints kings and judges for their duties. The action of the Spirit upon the cosmos now ceases to receive attention. In short, the kingdom of God is intensely spiritualized, and the relation of the Spirit to the individual or the church is nearly always that which is dealt with.<P>(1) Synoptic Teachings.<P>We consider briefly the synoptic teachings as to the Holy Spirit in relation to the kingdom of God. The forerunner of Jesus goes before His face in the Spirit and power of Elijah (<a onClick="return mV(\'Luk\',1,17);">Lu 1:17</a>). Of him it had been predicted that he should be filled with the Holy Spirit from His mother\'s womb (<a onClick="return mV(\'Luk\',1,15);">Lu 1:15</a>). The Master expressly predicts that the Holy Spirit will give the needed wisdom when the disciples are delivered up. "It is not ye that speak, but the Holy Spirit" (<a onClick="return mV(\'Mar\',13,11);">Mr 13:11</a>). In <a onClick="return mV(\'Luk\',12,12);">Lu 12:12</a> it is also declared that "The Holy Spirit shall teach you in that very hour what ye ought to say." Likewise in <a onClick="return mV(\'Mat\',10,20);">Mt 10:20</a>, "It is not ye that speak, but the Spirit of your Father that speaketh in you." In <a onClick="return mV(\'Luk\',11,13);">Lu 11:13</a> is a beautiful saying: If we who are evil give good gifts to our children, how much more shall the "heavenly Father give the Holy Spirit to them that ask him." This is a variation from the parallel passage in Matthew (<a onClick="return mV(\'Mat\',7,11);">7:11</a>), and illustrates Luke\'s marked emphasis upon the operations of the Spirit. In <a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>, the disciples are commanded to baptize in the name of the Father, the Son and the Holy Spirit. This passage has been called in question, but there is not sufficient ground for its rejection. Hitherto there has been almost no hint directly of the personality of the Spirit or the Trinitarian implications in the teaching as to the Spirit. Here, however, we have a very suggestive hint toward a doctrine of the Spirit which attains more complete development later.<P>(2) In the Writings of John<P>In the Gospel of John there is a more elaborate presentation of the office and work of the Holy Spirit, particularly in <a onClick="return mV(\'Jhn\',14,\'1-\');">Joh 14-17</a>. Several earlier passages, however, must be noticed. The passage on the new birth in <a onClick="return mV(\'Jhn\',3,5);">Joh 3:5</a>ff we notice first. The expression, "except one be born of water and the Spirit," seems to contain a reference to baptism along with the action of the Spirit of God directly on the soul. In the light of other New Testament teachings, however, we are not warranted in ascribing saving efficacy to baptism here. The "birth," in so far as it relates to baptism, is symbolic simply, not actual. The outward act is the fitting symbolic accompaniment of the spiritual regeneration by the Spirit. Symbolism and spiritual fact move on parallel lines. The entrance into the kingdom is symbolically effected by means of baptism, just as the "new birth" takes place symbolically by the same means.<P>In <a onClick="return mV(\'Jhn\',6,51);">Joh 6:51</a>ff we have the very difficult words attributed to Jesus concerning the eating of His flesh and the drinking of His blood. The disciples were greatly distressed by these words, and in <a onClick="return mV(\'Jhn\',6,63);">Joh 6:63</a> Jesus insists that "it is the spirit that giveth life; the flesh profiteth nothing." One\'s view of the meaning of this much-discussed passage will turn largely on his point of view in interpreting it. If he adopts the view that John is reading back into the record much that came later in the history, the inference will probably follow that Jesus is here referring to the Lord\'s Supper. If on the other hand it is held that John is seeking to reproduce substantially what was said, and to convey an impression of the actual situation, the reference to the Supper will not be inferred. Certainly the language fits the later teaching in the establishment of the Supper, although John omits a detailed account of the Supper. But Jesus was meeting a very real situation in the carnal spirit of the multitude which followed Him for the loaves and fishes. His deeply mystical words seem to have been intended to accomplish the result which followed, namely, the separation of the true from the false disciples. There is no necessary reference to the Lord\'s Supper specifically, therefore, in His words. Spiritual meat and drink, not carnal, are the true food of man. He Himself was that food, but only the spiritually susceptible would grasp His meaning. It is difficult to assign any sufficient reason why Jesus should have here referred to the Supper, or why John should have desired to introduce such reference into the story at this stage.<P>In <a onClick="return mV(\'Jhn\',7,37);">Joh 7:37</a>ff we have a saying of Jesus and its interpretation by John which accords with the synoptic reference to a future baptism in the Holy Spirit to be bestowed by Jesus: "He that believeth on me, as the scripture hath said, from within him shall flow rivers of living water." John adds: "But this spake he of the Spirit, which they that believed on him were to receive: for the Spirit was not yet given; because Jesus was not yet glorified." No doubt John\'s Gospel is largely a reproduction of the facts and teachings of Jesus in the evangelist\'s own words. This passage indicates, however, that John discriminated between his own constructions of Christ\'s teachings and the teachings themselves, and warns us against the custom of many exegetes who broadly assume that John employed his material with slight regard for careful and correct statement, passing it through his own consciousness in such manner as to leave us his own subjective Gospel, rather than a truly historical record. The ethical implications of such a process on John\'s part would scarcely harmonize with his general tone and especially the teachings of his Epistles. No doubt John\'s Gospel contains much meaning which he could not have put into it prior to the coming of the Spirit. But what John seeks to give is the teaching of Jesus and not his own theory of Jesus.<P>We give next an outline of the teachings in the great <a onClick="return mV(\'Jhn\',14,\'1-\');">Joh 14 to 17</a>, the farewell discourse of Jesus. In <a onClick="return mV(\'Jhn\',14,16);">Joh 14:16</a> Jesus says, "I will pray the Father, and he shall give you another Comforter" (parakletos; see <a href="study/isbe/search.html?string=PARACLETE">PARACLETE</A>). Next Jesus describes this Comforter as one whom the world cannot receive. Disciples know Him because He abides in them. The truth of Christianity is spiritually discerned, i.e. it is discerned by the power and indwelling of the Holy Spirit. In the name of "reality," science sometimes repudiates these inner experiences as "mystical." But Christians cling to them as most real, data of experience as true and reliable as any other forms of human experience. To repudiate them would be for them to repudiate reality itself. The Father and Son shall make their abode in Christians (<a onClick="return mV(\'Jhn\',14,23);">Joh 14:23</a>). This is probably another form of assertion of the Spirit\'s presence, and not a distinct line of mystical teaching. (Compare Woods, The Spirit of God in Biblical Literature, 243.) For in <a onClick="return mV(\'Jhn\',14,26);">Joh 14:26</a> the promise of the Spirit is repeated. The Father is to send the Spirit in the name of Christ, and He is to teach the disciples all things, quickening also their memories. In the New Testament generally, and especially in John\'s and Paul\'s writings, there is no sense of conflict between Father, Son and Spirit in their work in the Christian. All proceeds from the Father, through the Son, and is accomplished in the Christian by the Holy Spirit. As will appear, Christ in the believer is represented as being practically all that the Spirit does without identifying Christ with the Spirit. So far there are several notes suggesting the personality of the Holy Spirit. The designation "another Comforter," taken in connection with the description of his work, is one. The fact that He is sent or given is another. And another is seen in the specific work which the Spirit is to do. Another is the masculine pronoun employed here (ekeinos). In <a onClick="return mV(\'Jhn\',14,26);">Joh 14:26</a> the function of the Spirit is indicated. He is to bring to "remembrance all that I said unto you." In <a onClick="return mV(\'Jhn\',15,26);">15:26</a> this is made even more comprehensive: "He shall bear witness of me," and yet more emphatically in <a onClick="return mV(\'Jhn\',16,14);">Joh 16:14</a>, "He shall glorify me: for he shall take of mine, and shall declare it unto you." The sphere of the Spirit\'s activity is the heart of the individual believer and of the church. His chief function is to illumine the teaching and glorify the person of Jesus. <a onClick="return mV(\'Jhn\',15,26);">Joh 15:26</a> is the passage which has been used in support of the doctrine of the procession of the Spirit. Jesus says, "I will send" (pempso), future tense, referring to the "Spirit of truth which proceedeth from the Father" (ekporeuetai); present tense. The present tense here suggests timeless action and has been taken to indicate an essential relation of the Spirit to God the Father (compare Godet, Commentary on John, in the place cited.). The hazard of such an interpretation lies chiefly in the absence of other corroborative Scriptures and in the possibility of another and simpler meaning of the word. However, the language is unusual, and the change of tense in the course of the sentence is suggestive. Perhaps it is one of the many instances where we must admit we do not know the precise import of the language of Scripture.<P>In <a onClick="return mV(\'Jhn\',16,\'7-15\');">Joh 16:7-15</a> we have a very important passage. Jesus declares to the anxious disciples that it is expedient for Him to go away, because otherwise the Spirit will not come. "He, when he is come, will convict the world in respect of sin, and of righteousness, and of judgment" (<a onClick="return mV(\'Jhn\',16,8);">Joh 16:8</a>). The term translated "convict" (elegksei) involves a cognitive along with a moral process. The Spirit who deals in truth, and makes His appeal through the truth, shall convict, shall bring the mind on which He is working into a sense of self-condemnation on account of sin. The word means more than reprove, or refute, or convince. It signifies up to a certain point a moral conquest of the mind: "of sin, because they believe not on me" (<a onClick="return mV(\'Jhn\',16,9);">16:9</a>). Unbelief is the root sin. The revelation of God in Christ is, broadly speaking, His condemnation of all sin. The Spirit may convict of particular sins, but they will all be shown to consist essentially in the rejection of God\'s love and righteousness in Christ, i.e. in unbelief. "Of righteousness, because I go to the Father, and ye behold me no more" (<a onClick="return mV(\'Jhn\',16,10);">Joh 16:10</a>). What does this mean? Does Jesus mean that His going to the Father will be the proof of His righteousness to those who put Him to death, or that this going to the Father will be the consummating or crowning act of His righteousness which the Spirit is to carry home to the hearts of men? Or does He mean that because He goes away the Spirit will take His place in convicting men of righteousness? The latter meaning seems implied in the words, "and ye behold me no more." Probably, however, the meanings are not mutually exclusive. "Of judgment because the prince of this world hath been judged" (<a onClick="return mV(\'Jhn\',16,11);">16:11</a>). In His incarnation and death the prince of this world, the usurper, is conquered and cast out.<P>We may sum up the teachings as to the Spirit in these four chapters as follows: He is the Spirit of truth; He guides into all truth; He brings to memory Christ\'s teachings; He shows things to come; He glorifies Christ; He speaks not of Himself but of Christ; He, like believers, bears witness to Christ; He enables Christians to do greater works than those of Christ; He convicts the world of sin, of righteousness, and of judgment; He comes because Christ goes away; He is "another Comforter"; He is to abide with disciples forever.<P>These teachings cover a very wide range of needs. The Holy Spirit is the subject of the entire discourse. In a sense it is the counterpart of the Sermon on the Mount. There the laws of the kingdom are expounded. Here the means of realization of all the ends of that kingdom are presented. The kingdom now becomes the kingdom of the Spirit. The historical revelation of truth in the life, death, resurrection and glorification of Jesus being completed, the Spirit of truth comes in fullness. The gospel as history is now to become the gospel as experience. The Messiah as a fact is now to become the Messiah as a life through the Spirit\'s action. All the elements of the Spirit\'s action are embraced: the charismatic for mighty works; the intellectual for guidance into truth; the moral and spiritual for producing holy lives. This discourse transfers the kingdom, so to speak, from the shoulders of the Master to those of the disciples, but the latter are empowered for their tasks by the might of the indwelling and abiding Spirit. The method of the kingdom\'s growth and advance is clearly indicated as spiritual, conviction of sin, righteousness and judgment, and obedient and holy lives of Christ\'s disciples.<P>Before passing to the next topic, one remark should be made as to the Trinitarian suggestions of these chapters in John. The personality of the Spirit is clearly implied in much of the language here. It is true we have no formal teaching on the metaphysical side, no ontology in the strict sense of the word. This fact is made much of by writers who are slow to recognize the personality of the Holy Spirit in the light of the teachings of John and Paul. These writers have no difficulty, however, in asserting that the New Testament writers hold that God is a personal being (see I. F. Woods, The Spirit of God in Biblical Literature, 256, 268). It must be insisted, however, that in the New Testament, as in the Old Testament, there is little metaphysics, little ontological teaching as to God. His personality is deduced from the same kind of sayings as those relating to the Spirit. From the ontological point of view, therefore, we should also have to reject the personality of God on the basis of the Biblical teachings. The Trinitarian formulations may not be correct at all points, but the New Testament warrants the Trinitarian doctrine, just as it warrants belief in the personality of God. We are not insisting on finding metaphysics in Scripture where it is absent, but we do insist upon consistency in construing the popular and practical language of Scripture as to the second and third as well as the first Person of the Trinity.<P>We add a few lines as to John\'s teachings in the Epistles and Revelation. In general they are in close harmony with the teachings in his Gospel and do not require extended treatment. The Spirit imparts assurance (<a onClick="return mV(\'1Jo\',3,24);">1Joh 3:24</a>); incites to confession of Christ (<a onClick="return mV(\'1Jo\',4,2);">1Joh 4:2</a>); bears witness to Christ (<a onClick="return mV(\'1Jo\',5,6);">1Joh 5:6</a>ff). In <a onClick="return mV(\'Rev\',1,4);">Re 1:4</a> the "seven Spirits" is an expression for the completeness of the Spirit. The Spirit speaks to the churches (<a onClick="return mV(\'1Jo\',2,7,11);">1Joh 2:7, 11</a>; <a onClick="return mV(\'1Jo\',3,6);">3:6</a>). The seer is "in the Spirit" (<a onClick="return mV(\'1Jo\',4,2);">1Joh 4:2</a>). The Spirit joins the church i
