isbe[4465]='Household`hous\'-hold: Three words are usually found in the Bible where the family is indicated. These three are the Hebrew word bayith and the Greek words oikia and oikos. The unit of the national life of Israel, from the very beginning, was found in the family. In the old patriarchal days each family was complete within itself, the oldest living sire being the unquestioned head of the whole, possessed of almost arbitrary powers. The house and the household are practically synonymous. God had called Abraham "that he might command his children and household after him" (<a onClick="return mV(\'Gen\',18,19);">Ge 18:19</a>). The Passover-lamb was to be eaten by the "household" (<a onClick="return mV(\'Exd\',12,3);">Ex 12:3</a>). The "households" of the rebels in the camp of Israel shared their doom (<a onClick="return mV(\'Num\',16,\'31-33\');">Nu 16:31-33</a>; <a onClick="return mV(\'Deu\',11,6);">De 11:6</a>). David\'s household shares his humiliation (<a onClick="return mV(\'2Sa\',15,16);">2Sa 15:16</a>); the children everywhere in the Old Testament are the bearers of the sins of the fathers. Human life is not a conglomerate of individuals; the family is its center and unit.<P>Nor is it different in the New Testament. The curse and the blessing of the apostles are to abide on a house, according to its attitude (<a onClick="return mV(\'Mat\',10,13);">Mt 10:13</a>). A divided house falls (<a onClick="return mV(\'Mar\',3,25);">Mr 3:25</a>). The household believes with the head thereof (<a onClick="return mV(\'Jhn\',4,53);">Joh 4:53</a>; <a onClick="return mV(\'Act\',16,15,34);">Ac 16:15, 34</a>). Thus the households became the nuclei for the early life of the church, e.g. the house of Prisca and Aquila at Rome (<a onClick="return mV(\'Rom\',16,5);">Ro 16:5</a>), of Stephanas (<a onClick="return mV(\'1Cr\',16,15);">1Co 16:15</a>), of Onesiphorus (<a onClick="return mV(\'2Ti\',1,16);">2Ti 1:16</a>), etc. No wonder that the early church made so much of the family life. And in the midst of all our modern, rampant individualism, the family is still the throbbing heart of the church as well as of the nation.``42';
isbe[4466]='Household, Caesar\'s``<a href="./study/isbe/search.html?string=CAESAR\'S+HOUSEHOLD">CAESAR\'S HOUSEHOLD</a>`1';
isbe[4467]='Householder`hous\'-hol-der (oikodespotes): The word occurs in <a onClick="return mV(\'Mat\',13,27,52);">Mt 13:27, 52</a>; <a onClick="return mV(\'Mat\',20,1);">20:1</a>; <a onClick="return mV(\'Mat\',21,33);">21:33</a>, for the master or owner of a "household," i.e. of servants (douloi). The Greek word emphasizes the authority of the master.``1';
isbe[4468]='Housetop`hous\'-top.`<a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>`1';
isbe[4469]='How`Represents various Hebrew and Greek words, interrogative, interjectional and relative. Its different uses refer to<P>(1) the manner or way, e.g. <a onClick="return mV(\'Gen\',44,34);">Ge 44:34</a>, "How shall I go up to my father?" (\'ekh); <a onClick="return mV(\'Mat\',6,28);">Mt 6:28</a>, "how they grow" (pos); <a onClick="return mV(\'1Cr\',15,35);">1Co 15:35</a>, "How are the dead raised?";<P>(2) degree, extent, frequently, "how great" (<a onClick="return mV(\'Dan\',4,3);">Da 4:3</a>, mah; <a onClick="return mV(\'Mar\',5,19);">Mr 5:19</a>, hosos, "how much"); "how many" (<a onClick="return mV(\'Mat\',27,13);">Mt 27:13</a>, posos); "how much" (<a onClick="return mV(\'Act\',9,13);">Ac 9:13</a>, hosos); "how much more" (<a onClick="return mV(\'Mat\',7,11);">Mt 7:11</a>, posos; <a onClick="return mV(\'1Sa\',14,30);">1Sa 14:30</a>, \'aph ki); "how oft" (<a onClick="return mV(\'Psa\',78,40);">Ps 78:40</a>, kammah; <a onClick="return mV(\'Mat\',18,21);">Mt 18:21</a>, posakis); "how long" (<a onClick="return mV(\'Job\',7,19);">Job 7:19</a>, kammah; <a onClick="return mV(\'Mat\',17,17);">Mt 17:17</a>, heos pote), etc.;<P>(3) the reason, wherefore, etc. (<a onClick="return mV(\'Mat\',18,12);">Mt 18:12</a>; <a onClick="return mV(\'Luk\',12,49);">Lu 12:49</a>, tis);<P>(4) means—by what means? (<a onClick="return mV(\'Jhn\',3,4,9);">Joh 3:4, 9</a>, pos);<P>(5) cause (<a onClick="return mV(\'Jhn\',12,34);">Joh 12:34</a>; <a onClick="return mV(\'Act\',2,8);">Ac 2:8</a>; <a onClick="return mV(\'Act\',4,21);">4:21</a>, pos);<P>(6) condition, in what state, etc. (<a onClick="return mV(\'Luk\',23,55);">Lu 23:55</a>, hos; <a onClick="return mV(\'Act\',15,36);">Ac 15:36</a>, pos; <a onClick="return mV(\'Eph\',6,21);">Eph 6:21</a>, tis); "how" is sometimes used to emphasize a statement or exclamation (<a onClick="return mV(\'2Sa\',1,19,25,27);">2Sa 1:19, 25, 27</a>, "How are the mighty fallen!"); "how" is also used for "that" (<a onClick="return mV(\'Gen\',30,29);">Ge 30:29</a>, \'eth \'asher, frequently "how that"; <a onClick="return mV(\'Exd\',9,29);">Ex 9:29</a>, ki most frequently, in the New Testament, hoti, <a onClick="return mV(\'Mat\',12,5);">Mt 12:5</a>; <a onClick="return mV(\'Mat\',16,12,21);">16:12, 21</a>; <a onClick="return mV(\'Act\',7,25);">Ac 7:25</a>; <a onClick="return mV(\'Rom\',7,1);">Ro 7:1</a>, etc., in the King James Version).<P>The Revised Version (British and American) has "wherefore" for "how" (<a onClick="return mV(\'Gen\',38,29);">Ge 38:29</a>, margin "how"); has "what" (<a onClick="return mV(\'Jdg\',13,12);">Jud 13:12</a>; <a onClick="return mV(\'1Ki\',12,6);">1Ki 12:6</a>; <a onClick="return mV(\'Job\',13,\'1-\');">Job 13</a>; <a onClick="return mV(\'1Cr\',14,26);">1Co 14:26</a>), omits (<a onClick="return mV(\'2Cr\',13,5);">2Co 13:5</a>); has "how that" (<a onClick="return mV(\'1Sa\',2,22);">1Sa 2:22</a>); "that" (<a onClick="return mV(\'1Ch\',18,9);">1Ch 18:9</a>; <a onClick="return mV(\'Luk\',1,58);">Lu 1:58</a>; <a onClick="return mV(\'Gal\',4,13);">Ga 4:13</a>; <a onClick="return mV(\'Jam\',2,22);">Jas 2:22</a>; <a onClick="return mV(\'Rev\',2,2);">Re 2:2</a>); has "that even" for "how that" (<a onClick="return mV(\'Hbr\',12,17);">Heb 12:17</a>);" What is this?" for "How is it that?" (<a onClick="return mV(\'Luk\',16,2);">Lu 16:2</a>); omits "How is it?" (<a onClick="return mV(\'Mar\',2,16);">Mr 2:16</a>, different text); has "Do ye not yet," for "How is it that?" (<a onClick="return mV(\'Mar\',8,21);">Mr 8:21</a>); "Have ye not yet" (<a onClick="return mV(\'Mar\',4,40);">Mr 4:40</a>, different text); "what" for "how much" (<a onClick="return mV(\'Luk\',19,15);">Lu 19:15</a>, different text); omits "how that" (<a onClick="return mV(\'Luk\',7,22);">Lu 7:22</a>); "then how" (<a onClick="return mV(\'Jam\',2,24);">Jas 2:24</a>); has "cannot" for "How can he" (<a onClick="return mV(\'1Jo\',4,20);">1Joh 4:20</a>); omits "How hast thou" (<a onClick="return mV(\'Job\',26,3);">Job 26:3</a>), "how is" (<a onClick="return mV(\'Jer\',51,41);">Jer 51:41</a>); has "how" for "the fashion which" (<a onClick="return mV(\'Gen\',6,15);">Ge 6:15</a>), for "and" (<a onClick="return mV(\'Exd\',18,1);">Ex 18:1</a>), for "what" (<a onClick="return mV(\'Jdg\',18,24);">Jud 18:24</a>; <a onClick="return mV(\'1Sa\',4,16);">1Sa 4:16</a>; <a onClick="return mV(\'1Cr\',7,16);">1Co 7:16</a>), for "why" (<a onClick="return mV(\'Job\',19,28);">Job 19:28</a>; <a onClick="return mV(\'Job\',31,1);">31:1</a>; <a onClick="return mV(\'Jer\',2,33);">Jer 2:33</a>; <a onClick="return mV(\'Gal\',2,14);">Ga 2:14</a>), for "when" (<a onClick="return mV(\'Job\',37,15);">Job 37:15</a>), for "for" (<a onClick="return mV(\'Psa\',42,4);">Ps 42:4</a>), for "but God" (<a onClick="return mV(\'Pro\',21,12);">Pr 21:12</a>), for "whereunto" (<a onClick="return mV(\'Mar\',4,30);">Mr 4:30</a>); for "by what means" (<a onClick="return mV(\'Luk\',8,36);">Lu 8:36</a>; <a onClick="return mV(\'Jhn\',9,21);">Joh 9:21</a>), for "how greatly" (<a onClick="return mV(\'Phl\',1,8);">Php 1:8</a>); "how that" for "because" (<a onClick="return mV(\'Eze\',6,9);">Eze 6:9</a>; <a onClick="return mV(\'1Th\',1,5);">1Th 1:5</a>), for "and how" (<a onClick="return mV(\'Act\',20,20);">Ac 20:20</a>); "know how to" for "can" (<a onClick="return mV(\'Mat\',16,3);">Mt 16:3</a>); "how" for "by whom" (<a onClick="return mV(\'Amo\',7,2,5);">Am 7:2, 5</a>).<P>"How" in compounds gives us howbeit (how be it). It is the translation of \'ulam, "but," "truly," "yet" (<a onClick="return mV(\'Jdg\',18,29);">Jud 18:29</a>); of \'akh, "certainly," "only" (<a onClick="return mV(\'1Sa\',8,9);">1Sa 8:9</a>); of \'ephes, "moreover," etc. (<a onClick="return mV(\'2Sa\',12,14);">2Sa 12:14</a>); of ken, "so," "thus" (<a onClick="return mV(\'2Ch\',32,31);">2Ch 32:31</a>); of rak, "only," "surely" "nevertheless" (<a onClick="return mV(\'1Ki\',11,13);">1Ki 11:13</a>); of alla, "but," etc. (<a onClick="return mV(\'Jhn\',7,27);">Joh 7:27</a>; <a onClick="return mV(\'Act\',7,48);">Ac 7:48</a>; <a onClick="return mV(\'1Cr\',8,7);">1Co 8:7</a>, etc.); of de, "but," etc. (<a onClick="return mV(\'Jhn\',6,23);">Joh 6:23</a>); of mentoi (<a onClick="return mV(\'Jhn\',7,13);">Joh 7:13</a> the King James Version); many other instances.<P>For "howbeit," the Revised Version (British and American) has frequently "but" (<a onClick="return mV(\'2Ki\',12,13);">2Ki 12:13</a>, etc.), "and" (<a onClick="return mV(\'2Ch\',21,20);">2Ch 21:20</a>; <a onClick="return mV(\'Mar\',5,19);">Mr 5:19</a>), "surely" (ERV) (<a onClick="return mV(\'Job\',30,24);">Job 30:24</a>), "now" (<a onClick="return mV(\'Jhn\',11,13);">Joh 11:13</a>), "yet" (<a onClick="return mV(\'2Cr\',11,21);">2Co 11:21</a>), "nay, did" (<a onClick="return mV(\'Hbr\',3,16);">Heb 3:16</a>); omits (<a onClick="return mV(\'Mat\',17,21);">Mt 17:21</a>, different text); it has "howbeit" for "but" (<a onClick="return mV(\'2Ki\',12,3);">2Ki 12:3</a>; <a onClick="return mV(\'Luk\',19,27);">Lu 19:27</a>; <a onClick="return mV(\'Jhn\',5,34);">Joh 5:34</a>, etc.), for "also" (<a onClick="return mV(\'Lev\',23,27,39);">Le 23:27, 39</a>), for "nevertheless" (<a onClick="return mV(\'Num\',13,28);">Nu 13:28</a>; <a onClick="return mV(\'1Ki\',22,43);">1Ki 22:43</a>; <a onClick="return mV(\'Mar\',14,36);">Mr 14:36</a>; <a onClick="return mV(\'Luk\',13,33);">Lu 13:33</a> the English Revised Version; <a onClick="return mV(\'Luk\',18,8);">Lu 18:8</a>; <a onClick="return mV(\'2Ti\',2,19);">2Ti 2:19</a>), for "notwithstanding" (<a onClick="return mV(\'Jos\',22,19);">Jos 22:19</a>; <a onClick="return mV(\'Luk\',10,20);">Lu 10:20</a> the English Revised Version, "nevertheless" the American Standard Revised Version; (<a onClick="return mV(\'Phl\',4,14);">Php 4:14</a>), for "nay" (<a onClick="return mV(\'Rom\',7,7);">Ro 7:7</a>).<P>Howsoever (in what manner soever, although, however) is the translation of kol \'asher, "all that which," etc. (<a onClick="return mV(\'Zep\',3,7);">Ze 3:7</a>, "howsoever I punished them," the Revised Version (British and American) "according to all that I have appointed concerning her," margin "howsoever I have punished her"; the English Revised Version omits "have"); of raq, "only," "surely," "nevertheless" (<a onClick="return mV(\'Jdg\',19,20);">Jud 19:20</a>); of yehi-mah, "let be what" (<a onClick="return mV(\'2Sa\',18,22,23);">2Sa 18:22-23</a>, the Revised Version (British and American) "but come what may"); in <a onClick="return mV(\'2Sa\',24,3);">2Sa 24:3</a> "how" and "soever" are separated (kahem), "how many soever they may be," literally, "as they and as they."``185';
isbe[4470]='Hozai`ho\'-za-i (chozay, or as it stands at the close of the verse in question, <a onClick="return mV(\'2Ch\',33,19);">2Ch 33:19</a>, chozay; Septuagint ton horonton; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) "Hozai"; the King James Version the seers; the King James Version margin "Hosai"; the American Standard Revised Version "Hozia," the American Revised Version margin "the seers." Septuagint not improbably reads ha-chozim, as in <a onClick="return mV(\'2Ch\',33,18);">2Ch 33:18</a>; an easy error, since there we find we-dhibhere ha-chozim, "the words of the seers," and here dibhere chozay, "the words of Hozai." Kittel, following Budde, conjectures as the original reading chozayw, "his (Manasseh\'s) seers"): A historiographer of Manasseh, king of Judah. Thought by many of the Jews, incorrectly, to be the prophet Isaiah, who, as we learn from <a onClick="return mV(\'2Ch\',26,22);">2Ch 26:22</a>, was historiographer of a preceding king, Uzziah. This "History of Hozai" has not come down to us. The prayer of Manasseh, mentioned in <a onClick="return mV(\'2Ch\',33,12);">33:12</A>f; <a onClick="return mV(\'2Ch\',33,18);">18</A>f and included in this history, suggested the apocryphal book, "The Prayer of Manasses," written, probably, in the 1st century BC.`<a href="./study/isbe/search.html?string=APOCRYPHA">APOCRYPHA</a>`108';
isbe[4471]='Huckster`huk\'-ster: A retailer of small wares, provisions, or the like; a peddler. "A huckster shall not be acquitted of sin" (Sirach 26:29). Neither a merchant nor a huckster is without sin.``1';
isbe[4472]='Hukkok`huk\'-ok (chuqqoq): A town on the border of Naphtali named with Aznoth-tabor (<a onClick="return mV(\'Jos\',19,34);">Jos 19:34</a>). It is usually identified with the village of yaquq, which stands on the west of Wady el-\'Amud, to the northwest of Gennesaret, about 4 miles from the sea. This would fall on the boundary of Zebulun and Naphtali, between Tabor and Hannathon (<a onClick="return mV(\'Jos\',19,14);">Jos 19:14</a>). The identification may be correct; but it seems too far from Tabor.``1';
isbe[4473]='Hukok`hu\'-kok.`<a href="./study/isbe/search.html?string=HELKATH">HELKATH</a>`1';
isbe[4474]='Hul`hul (chul): The name of one of the "sons of Aram" in the list of nations descended from Noah, but a people of uncertain identity and location (<a onClick="return mV(\'Gen\',10,23);">Ge 10:23</a>; <a onClick="return mV(\'1Ch\',1,17);">1Ch 1:17</a>).``1';
isbe[4475]='Huldah`hul\'-da (chuldah, "weasel"; Holda): A prophetess who lived in Jerusalem during the reign of Josiah. She was the wife of Shallum, keeper of the wardrobe, and resided in the "Mishneh" or second part or quarter of Jerusalem (location unknown). Cheyne says it should read, "She was sitting in the upper part of the gate of the Old City," i.e. in a public central place ready to receive any who wished to inquire of Yahweh. He gives no reason for such a change of text. The standing and reputation of Huldah in the city are attested by the fact that she was consulted when the Book of the Law was discovered. The king, high priest, counselors, etc., appealed to her rather than to Jeremiah, and her word was accepted by all as the word of Yahweh (<a onClick="return mV(\'2Ki\',22,\'14-20\');">2Ki 22:14-20</a>; <a onClick="return mV(\'2Ch\',34,\'22-29\');">2Ch 34:22-29</a>)``146';
isbe[4476]='Human Sacrifice``<a href="./study/isbe/search.html?string=SACRIFICE,+HUMAN">SACRIFICE, HUMAN</a>`1';
isbe[4477]='Humiliation of Christ`hu-mil-i-a\'-shun (<a onClick="return mV(\'Act\',8,33);">Ac 8:33</a>; <a onClick="return mV(\'Phl\',2,8);">Php 2:8</a>).`<a href="./study/isbe/search.html?string=KENOSIS">KENOSIS</a>; <a href="./study/isbe/search.html?string=PERSON+OF+CHRIST,+1-3">PERSON OF CHRIST</a>`1';
isbe[4478]='Humility`hu-mil\'-i-ti ([\'anawah]; tapeinophrosune):<P>(1) The noun occurs in the Old Testament only in <a onClick="return mV(\'Pro\',15,33);">Pr 15:33</a>; <a onClick="return mV(\'Pro\',18,12);">18:12</a>; <a onClick="return mV(\'Pro\',22,4);">22:4</a>, but the adjective "humble" appears frequently as the translation of \'ani, \'anaw, shaphal, meaning also "poor," "afflicted"; the verb, as the translation of \'anah, "to afflict," "to humble," and of kana\', "to be or become humbled"; tsana\', "to be lowly," occurs in <a onClick="return mV(\'Mic\',6,8);">Mic 6:8</a>. For "humble" (<a onClick="return mV(\'Psa\',9,12);">Ps 9:12</a>; <a onClick="return mV(\'Psa\',10,12);">10:12</a>) the Revised Version (British and American) has "poor"; <a onClick="return mV(\'Psa\',10,17);">Ps 10:17</a>; <a onClick="return mV(\'Psa\',34,2);">34:2</a>; <a onClick="return mV(\'Psa\',69,32);">69:32</a>, "meek"; for "humbled" (<a onClick="return mV(\'Psa\',35,13);">Ps 35:13</a>), "afflicted" (<a onClick="return mV(\'Isa\',2,11);">Isa 2:11</a>; <a onClick="return mV(\'Isa\',10,33);">10:33</a>), "brought low"; for "He humbleth himself" (<a onClick="return mV(\'Isa\',2,9);">Isa 2:9</a>) "is brought low," margin "humbleth himself"; <a onClick="return mV(\'Psa\',10,10);">Ps 10:10</a>, "boweth down"; tapeinophrosune is translated "humility" (<a onClick="return mV(\'Col\',2,18,23);">Col 2:18, 23</a>; <a onClick="return mV(\'1Pe\',5,5);">1Pe 5:5</a>); in several other places it is translated "lowliness" and "lowliness of mind"; tapeinos is translated "humble" (<a onClick="return mV(\'Jam\',4,6);">Jas 4:6</a>; <a onClick="return mV(\'1Pe\',5,5);">1Pe 5:5</a>; elsewhere "lowly," etc.; <a onClick="return mV(\'1Pe\',3,8);">1Pe 3:8</a>, tapeinophron), the Revised Version (British and American) "humble-minded"; tapeinoo, "to humble," occurs frequently (<a onClick="return mV(\'Mat\',18,4);">Mt 18:4</a>; <a onClick="return mV(\'Mat\',23,12);">23:12</a>, etc.); tapeinosis is "humiliation" (<a onClick="return mV(\'Act\',8,33);">Ac 8:33</a>); for "vile body" (<a onClick="return mV(\'Phl\',3,21);">Php 3:21</a>) the Revised Version (British and American) gives "body of our humiliation."<P>(2) (a) In the Old Testament as well as in the New Testament, humility is an essential characteristic of true piety, or of the man who is right with God. God humbles men in order to bring them to Himself (<a onClick="return mV(\'Deu\',8,2,3);">De 8:2-3</a>, etc.), and it is when men humble themselves before Him that they are accepted (<a onClick="return mV(\'1Ki\',21,29);">1Ki 21:29</a>; <a onClick="return mV(\'2Ch\',7,14);">2Ch 7:14</a>, etc.); to "walk humbly with thy God" completes the Divine requirements (<a onClick="return mV(\'Mic\',6,8);">Mic 6:8</a>). In <a onClick="return mV(\'Psa\',18,35);">Ps 18:35</a> (<a onClick="return mV(\'2Sa\',22,36);">2Sa 22:36</a>) the quality is ascribed to God Himself, "Thy gentleness (or condescension) hath made me great." Of "him that hath his seat on high" it is said, (Hebrew) "humbleth (shaphel) himself to behold the things that are in heaven and in the earth" (<a onClick="return mV(\'Psa\',113,6);">Ps 113:6</a>). It is in the humble heart that "the high and lofty One,...whose name is Holy" dwells (<a onClick="return mV(\'Isa\',57,15);">Isa 57:15</a>; compare <a onClick="return mV(\'Isa\',66,2);">Isa 66:2</a>).<P>(b) The word tapeinophrosune is not found in classical Greek (Lightfoot); in the New Testament (with the exception of <a onClick="return mV(\'1Pe\',5,5);">1Pe 5:5</a>) it is Pauline. In Greek pre-Christian writers tapeinos is, with a few exceptions in Plato and Platonic writers, used in a bad or inferior sense—as denoting something evil or unworthy. The prominence it gained in Christian thought indicates the new conception of man in relation to God, to himself, and to his fellows, which is due to Christianity. It by no means implies slavishness or servility; nor is it inconsistent with a right estimate of oneself, one\'s gifts and calling of God, or with proper self-assertion when called for. But the habitual frame of mind of a child of God is that of one who feels not only that he owes all his natural gifts, etc., to God, but that he has been the object of undeserved redeeming love, and who regards himself as being not his own, but God\'s in Christ. He cannot exalt himself, for he knows that he has nothing of himself. The humble mind is thus at the root of all other graces and virtues. Self-exaltation spoils everything. There can be no real love without humility. "Love," said Paul, "vaunteth not itself, is not puffed up" (<a onClick="return mV(\'1Cr\',13,4);">1Co 13:4</a>). As Augustine said, humility is first, second and third in Christianity.<P>(c) Jesus not only strongly impressed His disciples with the need of humility, but was in Himself its supreme example. He described Himself as "meek and lowly (tapeinos) in heart" (<a onClick="return mV(\'Mat\',11,29);">Mt 11:29</a>). The first of the Beatitudes was to "the poor in spirit" (<a onClick="return mV(\'Mat\',5,3);">Mt 5:3</a>), and it was "the meek" who should "inherit the earth. Humility is the way to true greatness: he who should "humble himself as this little child" should be "the greatest in the kingdom of heaven"; "Whosoever shall exalt himself shall be humbled; and whosoever shall humble himself shall be exalted" (<a onClick="return mV(\'Mat\',18,4);">Mt 18:4</a>; <a onClick="return mV(\'Mat\',23,12);">23:12</a>; <a onClick="return mV(\'Luk\',14,11);">Lu 14:11</a>; <a onClick="return mV(\'Luk\',18,14);">18:14</a>). To the humble mind truth is revealed (<a onClick="return mV(\'Mat\',11,25);">Mt 11:25</a>; <a onClick="return mV(\'Luk\',10,21);">Lu 10:21</a>). Jesus set a touching example of humility in His washing His disciples\' feet (<a onClick="return mV(\'Jhn\',13,\'1-17\');">Joh 13:1-17</a>).<P>(d) Paul, therefore, makes an earnest appeal to Christians (<a onClick="return mV(\'Phl\',2,\'1-11\');">Php 2:1-11</a>) that they should cherish and manifest the Spirit of their Lord\'s humility—"in lowliness of mind each counting other better than himself," and adduces the supreme example of the self-emptying (kenosis) of Christ: "Have this mind in you, which was also in Christ Jesus," etc. The rendering of heauton ekenosen (<a onClick="return mV(\'Phl\',2,7);">Php 2:7</a> the King James Version) by "he humbled himself" has given rise to the designation of the Incarnation as "the Humiliation of Christ."<P>(e) There is a false humility which Paul warns against, a self-sought, "voluntary humility" (<a onClick="return mV(\'Col\',2,18,23);">Col 2:18, 23</a>). This still exists in many forms, and has to be guarded against. It is not genuine humility when we humble ourselves with the feeling that we are greater than others, but only when we do not think of self at all. It is not alone the sense of sin that should create the humble spirit: Jesus had no sin. It belongs not merely to the creature, but even to a son in relation to God. There may be much self-satisfaction where sinfulness is confessed. We may be proud of our humility. It is necessary also always to beware of "the pride that apes humility."``185';
isbe[4479]='Humps`humps: Appears in <a onClick="return mV(\'Isa\',30,6);">Isa 30:6</a> in the American Standard Revised Version for "bunches" in the King James Version.``1';
isbe[4480]='Humtah`hum\'-ta (chumtah): An unidentified place mentioned between Aphekah and Hebron in the mountain of Judah (<a onClick="return mV(\'Jos\',15,54);">Jos 15:54</a>).``1';
isbe[4481]='Hundred`hun\'-dred (me\'-ah; hekaton).`<a href="./study/isbe/search.html?string=NUMBER">NUMBER</a>`1';
isbe[4482]='Hunger`hun\'-ger (ra\'abh; limos (subs.), peinao (vb.):<P>(1) The desire for food, a physiological sensation associated with emptiness of the stomach, and dependent on some state of the mucous membrane;<P>(2) starvation as the effect of want of food, as <a onClick="return mV(\'Exd\',16,3);">Ex 16:3</a>; <a onClick="return mV(\'Isa\',49,10);">Isa 49:10</a>;<P>(3) to feel the craving for food as <a onClick="return mV(\'Deu\',8,3);">De 8:3</a>; when used to indicate the condition due to general scarcity of food as <a onClick="return mV(\'Jer\',38,9);">Jer 38:9</a>; <a onClick="return mV(\'Eze\',34,29);">Eze 34:29</a> it is replaced in the Revised Version (British and American) by "famine." The word is used to express the poverty which follows idleness and sloth (<a onClick="return mV(\'Pro\',19,15);">Pr 19:15</a>). The absence of this condition is given as one of the characteristics of the future state of happiness (<a onClick="return mV(\'Isa\',49,10);">Isa 49:10</a>; <a onClick="return mV(\'Eze\',34,29);">Eze 34:29</a>; <a onClick="return mV(\'Rev\',7,16);">Re 7:16</a>). Metaphorically the passionate striving for moral and spiritual rectitude is called hungering and thirsting after righteousness (<a onClick="return mV(\'Mat\',5,6);">Mt 5:6</a>); and the satisfaction of the soul which receives Christ is described as a state in which "he shall not hunger" (<a onClick="return mV(\'Jhn\',6,35);">Joh 6:35</a>).<P>On two occasions it is said of our Lord that He hungered (<a onClick="return mV(\'Mat\',21,18);">Mt 21:18</a>; <a onClick="return mV(\'Luk\',4,2);">Lu 4:2</a>); 9 times the old English expression "an hungred" is used, the "an" being a prefix which indicates that the condition is being continued (<a onClick="return mV(\'Mat\',12,1,3);">Mt 12:1, 3</a>; <a onClick="return mV(\'Mat\',25,35,37,42,44);">25:35, 37, 42, 44</a>; <a onClick="return mV(\'Mar\',2,25);">Mr 2:25</a>; <a onClick="return mV(\'Luk\',6,3);">Lu 6:3</a> the King James Version). In <a onClick="return mV(\'Mat\',4,2);">Mt 4:2</a> the King James Version, "an hungred" has been changed to "hungered" in the Revised Version (British and American). "Hard bestead and hungry" in <a onClick="return mV(\'Isa\',8,21);">Isa 8:21</a> means bested (that is, placed) in a condition of hardship, "sore distressed," the American Standard Revised Version. The word occurs in Spenser, "Thus ill bestedd and fearful more of shame" (I, i, 24). The reference of the aggravation of the sensation of hunger when one who is starving awakes from a dream of food (<a onClick="return mV(\'Isa\',29,8);">Isa 29:8</a>) is graphically illustrated by the experience of the antarctic voyager (Shackleton, Heart of the Antarctic, II, 9).``107';
isbe[4483]='Hunting`hunt\'-ing (tsayidh): The hunting of wild animals for sport, or for the defense of men and flocks, or for food, was common in Western Asia and Egypt, especially in early times. Some of the Egyptian and Assyrian kings were great hunters in the first sense, for example Amenhotep III (1411-1375 BC) "a lion-hunting and bull-baiting Pharaoh," who boasted of having slain 76 bulls in the course of one expedition, and of having killed at one time or other 102 lions; and the Assyrian conqueror, Tiglath-pileser I (circa 1100 BC), who claimed 4 wild bulls, 14 elephants and 920 lions as the trophies of his skill and courage.<P>1. Nimrod and His Like:<P>The Biblical prototype of these heroes of war and the chase is Nimrod, "a mighty hunter before Yahweh" (<a onClick="return mV(\'Gen\',10,9);">Ge 10:9</a>), that is perhaps "a hunter who had no equal," a figure not yet clearly identifiable with any historical or mythical character in the Assyro-Bab monuments, but possibly the Gilgamesh of the great epic, who may be the hero represented on seals and reliefs as victorious over the lion (Skinner, "Gen," ICC, 208). We are reminded also of Samson\'s exploit at Timnah (<a onClick="return mV(\'Jdg\',14,5);">Jud 14:5</a>f), but this, like David\'s encounter with the lion and the bear (<a onClick="return mV(\'1Sa\',17,34);">1Sa 17:34</a>f) and Benaiah\'s struggle with a lion in a pit on a snowy day (<a onClick="return mV(\'2Sa\',23,20);">2Sa 23:20</a>), was an occasional incident and scarcely comes under the category of hunting. There is no evidence that hunting for sport was ever practiced by the kings of Judah and Israel. Not until the time of Herod the Great, who had a hunting establishment and was a great hunter of boars, stags, and wild asses (Josephus, BJ, I, xxi, 13), mastering as many as 40 beasts in one day, do we find a ruler of Palestine indulging in this pastime.<P>2. Hunting in the Old Testament:<P>Hunting, however, for the two other purposes mentioned above was probably as frequent among the Israelites, even after they had ceased to be nomads, as among their neighbors. We know indeed of only two personal examples, both in the patriarchal period and both outside the direct line of Israelite descent: Esau (<a onClick="return mV(\'Gen\',25,27);">Ge 25:27</a>) and Ishmael (<a onClick="return mV(\'Gen\',21,20);">Ge 21:20</a>); but there are several references and many figurative allusions to the pursuit and its methods and instruments. Hunting (inclusive of following) is mentioned in the Pentateuch in the regulation about pouring out the blood and covering it with dust (<a onClick="return mV(\'Lev\',17,13);">Le 17:13</a>); and there is a general reference in the proverb (<a onClick="return mV(\'Pro\',12,27);">Pr 12:27</a>): "The slothful man roasteth not that which he took in hunting." The hunting of the lion is assumed in Ezekiel\'s allegory of the lioness and her two whelps (<a onClick="return mV(\'Eze\',19,\'1-9\');">Eze 19:1-9</a>; compare <a onClick="return mV(\'Job\',10,16);">Job 10:16</a>); of the antelope or oryx (<a onClick="return mV(\'Deu\',14,5);">De 14:5</a>; <a onClick="return mV(\'Isa\',51,20);">Isa 51:20</a>); of the roe (<a onClick="return mV(\'Pro\',6,5);">Pr 6:5</a>); of the partridge in the mountains (<a onClick="return mV(\'1Sa\',26,20);">1Sa 26:20</a>), and of birds in general in many passages. Hunting is probably implied in the statement about the provision of harts, gazelles and roebucks for Solomon\'s kitchen (<a onClick="return mV(\'1Ki\',4,23);">1Ki 4:23</a>), and to some extent in the reference to the den of lions in Babylon (<a onClick="return mV(\'Dan\',6,7);">Da 6:7</a>).<P>3. Methods of Hunters:<P>The weapons most frequently employed by hunters seem to have been bows and arrows. Isaac (<a onClick="return mV(\'Gen\',27,3);">Ge 27:3</a>) commands Esau to take his bow and quiver and procure him venison or game (compare also <a onClick="return mV(\'Isa\',7,24);">Isa 7:24</a>; <a onClick="return mV(\'Job\',41,28);">Job 41:28</a>). This method is amply illustrated by the monuments. Ashur-nazir-pal lII (885-860 BC) and Darius (circa 500 BC), for example, are depicted shooting at lions from the chariot. Use was also made of the sword, the spear, the dart or javelin, the sling and the club (<a onClick="return mV(\'Job\',41,26,28);">Job 41:26, 28</a>f; where the application of these weapons to hunting is implied). The larger animals were sometimes caught in a pit. The classical reference is in Ezekiel\'s allegory, "He was taken in their pit" (shachath, <a onClick="return mV(\'Eze\',19,4,8);">Eze 19:4, 8</a>; compare also <a onClick="return mV(\'Isa\',24,17);">Isa 24:17</a>f; <a onClick="return mV(\'Jer\',48,43);">Jer 48:43</a>f; <a onClick="return mV(\'Psa\',35,7);">Ps 35:7</a>, etc.). The details of this mode of capture as practiced at the present day, and probably in ancient times, are described by Tristram in his Natural History of the Bible (118f). A more elaborate method is described by Maspero in Lectures historiques (285). To make the pit-capture more effective, nets were also employed: "They spread their net over him" (<a onClick="return mV(\'Eze\',19,8);">Eze 19:8</a>; compare <a onClick="return mV(\'Psa\',35,7);">Ps 35:7</a>). When caught, the lion was sometimes placed in a large wooden cage (<a onClick="return mV(\'Eze\',19,9);">Eze 19:9</a>, cughar, the Assyrian shigaru; for the word and the thing compare SBOT, "Ezk," English, 132; Heb, 71). The lion (or any other large animal) was led about by a ring or hook (chach) inserted in the jaws or nose (<a onClick="return mV(\'2Ki\',19,28);">2Ki 19:28</a> equals <a onClick="return mV(\'Isa\',37,29);">Isa 37:29</a>; <a onClick="return mV(\'Eze\',19,4,9);">Eze 19:4, 9</a>; <a onClick="return mV(\'Eze\',29,4);">29:4</a>; <a onClick="return mV(\'Eze\',38,4);">38:4</a>). From wild animals the brutal Assyrians transferred the custom to their human captives, as the Israelites were well aware (<a onClick="return mV(\'2Ch\',33,11);">2Ch 33:11</a> the Revised Version margin, Hebrew choach; for monumental illustrations compare SBOT, "Ezkekiel," English, 132f). Nets were also used for other animals such as the oryx or antelope (<a onClick="return mV(\'Isa\',51,20);">Isa 51:20</a>). The Egyptian and Assyrian monuments show that dogs were employed in hunting in the ancient East, and it is not improbable that they were put to this service by the Hebrews also, but there is no clear Biblical evidence, as "greyhound" in <a onClick="return mV(\'Pro\',30,31);">Pr 30:31</a> is a questionable rendering. Josephus indeed (Ant., IV, viii, 9) mentions the hunting dog in a law ascribed to Moses, but the value of the allusion is uncertain.<P>4. Fowlers and Their Snares:<P>The hunting of birds or fowling is so often referred or alluded to that it must have been very widely practiced (compare <a onClick="return mV(\'Psa\',91,3);">Ps 91:3</a>; <a onClick="return mV(\'Psa\',124,7);">124:7</a>; <a onClick="return mV(\'Pro\',1,17);">Pr 1:17</a>; <a onClick="return mV(\'Pro\',6,5);">6:5</a>; <a onClick="return mV(\'Ecc\',9,12);">Ec 9:12</a>; <a onClick="return mV(\'Amo\',3,5);">Am 3:5</a>, etc.). The only bird specifically mentioned is the partridge, said to be hunted on the mountains (<a onClick="return mV(\'1Sa\',26,20);">1Sa 26:20</a>). The method of hunting is supposed by Tristram (N H B, 225) to be that still prevalent—continual pursuit until the creature is struck down by sticks thrown along the ground—but the interpretation is uncertain. Birds were generally caught by snares or traps. Two passages are peculiarly instructive on this point: <a onClick="return mV(\'Job\',18,\'8-10\');">Job 18:8-10</a>, where six words are used for such contrivances, represented respectively by "net," "toils," "gin," "snare," "noose," "trap "; and <a onClick="return mV(\'Amo\',3,5);">Am 3:5</a>, which is important enough to be cited in full: "Can a bird fall in a snare upon the earth, where no gin is set for him? shall a snare spring up from the ground, and have taken nothing at all?" The word for "snare" in this passage (pach) probably describes a net laid on the ground, perhaps a circular net like the Egyptian bird-trap represented in the Cambridge Bible, "Amos," 157. The word for "gin," usually ira in the Revised Version (British and American) "snare" (moqesh, literally, "fowling instrument") is supposed to refer either to the bait (ibid., 158) or to the catch connected with it which causes the net to collapse (Siegfried). For a full account of Egyptian modes of following which probably illustrate ancient Palestinian methods, compare Wilkinson, Popular Account, II, 178-83. The two words (moqesh and pach) mentioned above are used figuratively in many Old Testament passages, the former repeatedly of the deadly influence of Canaanitish idolatry on Israel, as in <a onClick="return mV(\'Exd\',23,33);">Ex 23:33</a>, "For if thou serve their gods, it will surely be a snare unto thee" (compare <a onClick="return mV(\'Exd\',34,12);">Ex 34:12</a>; <a onClick="return mV(\'Deu\',7,16);">De 7:16</a>; <a onClick="return mV(\'Jos\',23,13);">Jos 23:13</a>). The use of the hawk in fowling, which is attested for Northern Syria by a bas-relief found in 1908 at Sakje-Geuzi, is not mentioned in the Old Testament, but there may perhaps be an allusion in Apocrypha (Baruch 3:17, "they that had their pastime with the fowls of the air"). A reference to the use of decoys has been found in <a onClick="return mV(\'Jer\',5,27);">Jer 5:27</a>, "a cage...full of birds," but that is a doubtful interpretation, and in the Greek of Sirach 11:30, "As a decoy partridge in a cage, so is the heart of a proud man," but the Hebrew text of the latter is less explicit.<P>See <a href="study/isbe/search.html?string=FOWLER">FOWLER</a>.<P>5. Allusions in the New Testament:<P>The New Testament has a few figurative allusions to hunting. The words for "catch" in <a onClick="return mV(\'Mar\',12,13);">Mr 12:13</a> and <a onClick="return mV(\'Luk\',11,54);">Lu 11:54</a> (agreuo and thereuo) mean literally, "hunt." The verb "ensnare" (pagideuo) occurs in the Gospels (<a onClick="return mV(\'Mat\',22,15);">Mt 22:15</a>), and the noun "snare" (pagis) is met with in 5 passages (<a onClick="return mV(\'Luk\',21,34);">Lu 21:34</a>; <a onClick="return mV(\'Rom\',11,9);">Ro 11:9</a>; <a onClick="return mV(\'1Ti\',3,7);">1Ti 3:7</a>; <a onClick="return mV(\'1Ti\',6,9);">6:9</a>; <a onClick="return mV(\'2Ti\',2,26);">2Ti 2:26</a>). Another word for "snare" (brochos), which means literally, "noose" (Revised Version margin), is used in <a onClick="return mV(\'1Cr\',7,35);">1Co 7:35</a>. The words for "things that cause stumbling" and "stumble" (skandalon and skandalizo) may possibly conceal in some passages an allusion to a hunter\'s trap or snare. Skandalon is closely allied to skandalethron, "the stick in a trap on which the bait is placed," and is used in Septuagint for moqesh. The abundant use of imagery taken from hunting in the Bible is remarkable, in view of the comparative rarity of literal references.<P>LITERATURE.<P>In addition to the works cited in the course of the article, the article "Hunting" in DB2, HDB large and small, EB, Jewish Encyclopedia; and "Jagd" in German Bible Diets. of Guthe, Riehm2, and Wiener, and in RE3.``162';
isbe[4484]='Hupham`hu\'-fam (chupham, "coast-inhabitant"): One of Benjamin\'s sons and head of the Huphamite family (<a onClick="return mV(\'Num\',26,39);">Nu 26:39</a>).`<a href="./study/isbe/search.html?string=HUPPIM">HUPPIM</a>`1';
isbe[4485]='Huppah`hup\'-a (chuppah, "protection"): The priest in charge of the 13th course as prescribed under David (<a onClick="return mV(\'1Ch\',24,13);">1Ch 24:13</a>).``1';
isbe[4486]='Huppim`hup\'-im (chuppim, "coast-people"): Probably a variant form of <a href="study/isbe/search.html?string=HUPHAM">HUPHAM</a> (which see). From the only mention made of him (<a onClick="return mV(\'Gen\',46,21);">Ge 46:21</a>; <a onClick="return mV(\'1Ch\',7,12,15);">1Ch 7:12, 15</a>), his direct descent is difficult to establish.``1';
isbe[4487]='Hur`hur (chur):<P>(1) A prominent official in Israel. With Aaron he held up Moses\' hands during the battle against the Amalekites (<a onClick="return mV(\'Exd\',17,10,12);">Ex 17:10, 12</a>) and assisted him as judicial head of the people during Moses\' stay in the mount (<a onClick="return mV(\'Exd\',24,14);">Ex 24:14</a>).<P>(2) Grandfather of Bezalel, the head artificer in the construction of the Tabernacle (<a onClick="return mV(\'Exd\',31,2);">Ex 31:2</a>; <a onClick="return mV(\'Exd\',35,30);">35:30</a>; <a onClick="return mV(\'Exd\',38,22);">38:22</a>; <a onClick="return mV(\'2Ch\',1,5);">2Ch 1:5</a>). He is here assigned to the tribe of Judah, and in 1Ch is connected with the same by descent through Caleb (<a onClick="return mV(\'1Ch\',2,19,20,50);">2:19,20,50</a>; <a onClick="return mV(\'1Ch\',4,1,4);">4:1,4</a>). Josephus (Ant., III, ii, 4; vi, 1) makes him identical with (1) and the husband of Miriam.<P>(3) One of the five kings of Midian slain along with Balaam when Israel avenged the "matter of Peor" upon this people (<a onClick="return mV(\'Num\',31,8);">Nu 31:8</a>; compare <a onClick="return mV(\'Num\',31,1,2,16);">Nu 31:1-2, 16</a>). In <a onClick="return mV(\'Jos\',13,21);">Jos 13:21</a> these kings are spoken of as "chiefs (nesi\'im) of Midian" and "princes (necikhim) of Sihon," king of the Amorites.<P>(4) According to <a onClick="return mV(\'1Ki\',4,8);">1Ki 4:8</a> the King James Version, the father of one of Solomon\'s twelve officers who provided food for the king\'s household, and whose district was the hill country of Ephraim. Here the Revised Version (British and American) has "Ben-hur," taking the Hebrew ben, "son of," as part of the proper name; and the same is true in reference to the names of four others of these officers (compare <a onClick="return mV(\'1Ki\',4,9,10,11,13);">1Ki 4:9, 10-11, 13</a>).<P>(5) Father of Rephaiah, who was one of the builders of the wall under Nehemiah, and ruler of half the district of Jerusalem (<a onClick="return mV(\'Neh\',3,9);">Ne 3:9</a>).``44';
isbe[4488]='Hurai`hu\'-ri, hu\'-ra-i, hu-ra\'-i (churay, "linen-weaver"): One of David\'s "mighty men" mentioned in <a onClick="return mV(\'1Ch\',11,32);">1Ch 11:32</a> as of the brooks of Gaash, i.e. from Mt. Gash. In the parallel <a onClick="return mV(\'2Sa\',23,30);">2Sa 23:30</a>, the orthography is Hiddai.``1';
isbe[4489]='Huram`hu\'-ram (churam, "noble-born"):<P>(1) Grandson of Benjamin (<a onClick="return mV(\'1Ch\',8,5);">1Ch 8:5</a>).<P>(2) King of Tyre in alliance with David and Solomon. So named in <a onClick="return mV(\'2Ch\',2,3,11,12);">2Ch 2:3, 11-12</a>; <a onClick="return mV(\'2Ch\',8,2);">8:2</a>; <a onClick="return mV(\'2Ch\',9,10,21);">9:10, 21</a>, but elsewhere written <a href="study/isbe/search.html?string=HIRAM">HIRAM</a> (which see).<P>(3) The Tyrian artisan who is so named in <a onClick="return mV(\'2Ch\',2,13);">2Ch 2:13</a>; <a onClick="return mV(\'2Ch\',4,11,16);">4:11, 16</a>, but elsewhere called "Hiram."``1';
isbe[4490]='Huri`hu\'-ri (churi, "linen weaver"): One of the immediate descendants of Gad, and father of Abihail, a chief man of his family (<a onClick="return mV(\'1Ch\',5,14);">1Ch 5:14</a>).``1';
isbe[4491]='Hurt`hurt: The term (noun and verb) represents a large number of Hebrew words, of which the chief are ra\' (verb ra\'a\'), "evil" (<a onClick="return mV(\'Gen\',26,29);">Ge 26:29</a>; <a onClick="return mV(\'1Sa\',24,9);">1Sa 24:9</a>; <a onClick="return mV(\'Psa\',35,4);">Ps 35:4</a>, etc.), and shebher or shebher (from shabhar), "a fracture" or "breaking" (<a onClick="return mV(\'Jer\',6,14);">Jer 6:14</a>; <a onClick="return mV(\'Jer\',8,11,21);">8:11, 21</a>; <a onClick="return mV(\'Jer\',10,19);">10:19</a>; compare <a onClick="return mV(\'Exd\',22,10,14);">Ex 22:10, 14</a>). In Greek a principal verb is adikeo, "to do injustice" (<a onClick="return mV(\'Luk\',10,19);">Lu 10:19</a>; <a onClick="return mV(\'Rev\',2,11);">Re 2:11</a>; <a onClick="return mV(\'Rev\',6,6);">6:6</a>, etc.); once the word "hurt" is used in the King James Version (<a onClick="return mV(\'Act\',27,10);">Ac 27:10</a>, story of Paul\'s shipwreck) for hubris, "injury" (thus the Revised Version (British and American)). In the Revised Version (British and American) "hurt" sometimes takes the place of other words in the King James Version, as "sick" (<a onClick="return mV(\'Pro\',23,35);">Pr 23:35</a>), "breach" (<a onClick="return mV(\'Isa\',30,26);">Isa 30:26</a>), "bruise" (<a onClick="return mV(\'Jer\',30,12);">Jer 30:12</a>; <a onClick="return mV(\'Nah\',3,19);">Na 3:19</a>); sometimes, on the other hand, the word in the King James Version is exchanged in the Revised Version (British and American) for "evil" (<a onClick="return mV(\'Jos\',24,20);">Jos 24:20</a>), "harm" (<a onClick="return mV(\'Act\',18,10);">Ac 18:10</a>), or, as above, "injury" (<a onClick="return mV(\'Act\',27,10);">Ac 27:10</a>). These references sufficiently show the meaning of the word—harm, bruise, breaking, etc. In Jeremiah (ut supra) the word is used figuratively for moral disease or corruption.``132';
isbe[4492]='Husband`huz\'-band (\'ish; aner): In the Hebrew household the husband and father was the chief personage of an institution which was regarded as more than a social organism, inasmuch as the family in primitive Semitic society had a distinctively religious character and significance. It was through it that the cult of the household and tribal deities was practiced and perpetuated. The house-father, by virtue of being the family head, was priest of the household, and as such, responsible for the religious life of the family and the maintenance of the family altar. As priest he offered sacrifices to the family gods, as at first, before the centralization of worship, he did to Yahweh as the tribal or national Deity. We see this reflected in the stories of Abraham, Isaac and Jacob, and in the Book of Job. This goes far to explain such records as we have in <a onClick="return mV(\'Gen\',31,53);">Ge 31:53</a>; <a onClick="return mV(\'Gen\',32,9);">32:9</a>, and the exceptional reverence that was paid the paternal sepulchers (<a onClick="return mV(\'1Sa\',20,6);">1Sa 20:6</a>). Abraham was regarded as being the father of a nation. It was customary, it would seem, to assign a "father" to every known tribe and nation (<a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10</a>). So the family came to play an important and constructive part in Hebrew thought and life, forming the base upon which the social structure was built, merging gradually into the wider organism of the clan or tribe, and vitally affecting at last the political and religious life of the nation itself.<P>The husband from the first had supreme authority over his wife, or wives, and children. In his own domain his rule was well-nigh absolute. The wife, or wives, looked up to him as their lord (<a onClick="return mV(\'Gen\',18,12);">Ge 18:12</a>). He was chief (compare Arabic sheik), and to dishonor him was a crime to be punished by death (<a onClick="return mV(\'Exd\',21,15,17);">Ex 21:15, 17</a>). He was permitted to divorce his wife with little reason, and divorces were all too common (<a onClick="return mV(\'Deu\',22,13,19,28,29);">De 22:13, 19, 28-29</a>; <a onClick="return mV(\'Isa\',50,1);">Isa 50:1</a>; <a onClick="return mV(\'Jer\',3,8);">Jer 3:8</a>; <a onClick="return mV(\'Jer\',5,8);">5:8</a>; <a onClick="return mV(\'Mal\',2,16);">Mal 2:16</a>, etc.). The wife seems to have had no redress if wronged by him. Absolute faithfulness, though required of the wife, was apparently not expected or exacted of the husband, so long as he did not violate the rights of another husband. In general among Eastern people women were lightly esteemed, as in the Japhetic nations they came to be. Plato counted a state "disorganized" "where slaves are disobedient to their masters, and wives are on equality with their husbands." "Is there a human being," asks Socrates, "with whom you talk less than with your wife?" But from the first, among the Hebrews the ideal husband trained his household in the way they should go religiously, as well as instructed them in the traditions of the family, the tribe, and the nation (<a onClick="return mV(\'Gen\',18,19);">Ge 18:19</a>; <a onClick="return mV(\'Exd\',12,26);">Ex 12:26</a>; <a onClick="return mV(\'Exd\',13,8);">13:8</a>; <a onClick="return mV(\'Deu\',6,7);">De 6:7</a>, etc.). It was due to this, in part at least, that, in spite of the discords and evils incident to polygamy, the Hebrew household was nursery of virtue and piety to an unusual degree, and became a genuine anticipation of the ideal realized later in the Christian home (<a onClick="return mV(\'1Cr\',7,2);">1Co 7:2</a>ff; <a onClick="return mV(\'Eph\',5,25);">Eph 5:25</a>; <a onClick="return mV(\'1Pe\',3,7);">1Pe 3:7</a>).<P>Used figuratively of the relation (1) between Yahweh and His people (<a onClick="return mV(\'Isa\',54,5);">Isa 54:5</a>; <a onClick="return mV(\'Jer\',3,14);">Jer 3:14</a>; <a onClick="return mV(\'Hsa\',2,19);">Ho 2:19</a>f); (2) between Christ and His church (<a onClick="return mV(\'Mat\',9,15);">Mt 9:15</a>; <a onClick="return mV(\'2Cr\',11,2);">2Co 11:2</a>; <a onClick="return mV(\'Eph\',5,25);">Eph 5:25</a>; <a onClick="return mV(\'Rev\',19,7);">Re 19:7</a>; <a onClick="return mV(\'Rev\',21,2);">21:2</a>).``47';
isbe[4493]='Husband\'s Brother`(yabham, "brother-in-law"; epigambreuo; Late Latin levir): He was required (<a onClick="return mV(\'Deu\',25,\'5-10\');">De 25:5-10</a>; <a onClick="return mV(\'Mat\',22,24);">Mt 22:24</a>) "to perform the duty of a husband\'s brother" (yibbemah); that is, if his brother, living with him on the paternal estate, died without male issue, he should take the widow to wife, and "raise up seed unto his brother," the firstborn of the new marriage inheriting the deceased brother\'s estate. Refusal of the duty was possible, but entailed public ceremonial disgrace and lasting reproach. This provision for a specific case modified the general law which forbade the marriage of a sister-in-law (<a onClick="return mV(\'Lev\',18,16,18);">Le 18:16, 18</a>). It was a patriarchal custom (<a onClick="return mV(\'Gen\',38,\'1-\');">Ge 38</a>; Judah and Tamar), and is alluded to in <a onClick="return mV(\'Rth\',1,\'11-13\');">Ru 1:11-13</a>. A related custom is found in <a onClick="return mV(\'Rth\',4,1);">Ru 4:1</a>, Boaz playing; however, the part, not of levir ("brother-in-law"), but of go\'el ("redeemer"). It was at least theoretically in force in our Lord\'s time (<a onClick="return mV(\'Mat\',22,\'23-28\');">Mt 22:23-28</a>; the question of the Sadducees concerning the resurrection).`<a href="./study/isbe/search.html?string=FAMILY">FAMILY</a>; <a href="./study/isbe/search.html?string=MARRIAGE">MARRIAGE</a>`31';
isbe[4494]='Husbandman; Husbandry`huz\'-band-man, huz\'-band-ri: Husbandman, originally a "householder" or "master of the house," is now limited in its meaning to "farmer" or "tiller of the soil." In this sense it is the correct translation of the various Biblical words: ish \'adahamah, literally, "man of the soil" (<a onClick="return mV(\'Gen\',9,20);">Ge 9:20</a>); \'ikkar, literally, "digger," "a farmer" (<a onClick="return mV(\'2Ch\',26,10);">2Ch 26:10</a>; <a onClick="return mV(\'Jer\',31,24);">Jer 31:24</a>; <a onClick="return mV(\'Jer\',51,23);">51:23</a>; <a onClick="return mV(\'Amo\',5,16);">Am 5:16</a>; <a onClick="return mV(\'Joe\',1,11);">Joe 1:11</a>); gubh, "to dig" (<a onClick="return mV(\'2Ki\',25,12);">2Ki 25:12</a>); yaghabh, "to dig" (<a onClick="return mV(\'Jer\',52,16);">Jer 52:16</a>); georgos, "cultivator" (<a onClick="return mV(\'Mat\',21,33);">Mt 21:33</a>ff; <a onClick="return mV(\'Jhn\',15,1);">Joh 15:1</a>; <a onClick="return mV(\'Jam\',5,7);">Jas 5:7</a>).<P>It is a common practice in Palestine and Syria today for a rich man to own lands in many different parts of the country. He sets farmers over these different tracts who, with the helpers, do the plowing, planting, reaping, etc.; or he lets out his lands to farmers who pay him an annual rental or return to him a certain percentage of the crop. Much of the plain of Esdraelon, for example, was until recently owned by Beirut proprietors and farmed in this way. The writer while riding on the plain near ancient Dan, was surprised to overtake an acquaintance from Beirut (3 days\' journey away), who had just dismounted at one of his farms to inspect it and to receive the annual account of his farmer. The pride with which the husbandman pointed out the abundant harvest will not be forgotten. All the difficulties of the owner with his husbandmen described by Jesus are often repeated today.<P>Figurative: Jesus said "I am the true vine, and my father is the husbandman" (<a onClick="return mV(\'Jhn\',15,1);">Joh 15:1</a>). He sows, cultivates, prunes and expects fruits from His church. In the parable of the Householder (<a onClick="return mV(\'Mat\',21,33);">Mt 21:33</a>), the wicked husbandmen were the Jews. The church is referred to as "God\'s husbandry" in <a onClick="return mV(\'1Cr\',3,9);">1Co 3:9</a> (margin "tilled land").`<a href="./study/isbe/search.html?string=AGRICULTURE">AGRICULTURE</a>`133';
isbe[4495]='Hushah`hu\'-sha (chushah, "haste"): Mentioned in <a onClick="return mV(\'1Ch\',4,4);">1Ch 4:4</a> as probably an individual, a Judahite, or a family name; but may possibly be a place.``1';
isbe[4496]='Hushai`hut\'-shi, hus\'-sha-i (chushay, Chousei; Josephus, Chousi): An Archite, native of Archi or Erech(?), west of Bethel on the northern border of Benjamin and southern border of Joseph (<a onClick="return mV(\'Jos\',16,2);">Jos 16:2</a>). Hushai was one of David\'s most faithful and wise counselors. When David was fleeing from Jerusalem and Absalom, Hushai met him, having his coat rent and earth on his head. The king persuaded him to return to Jerusalem, feign submission to Absalom, and try to defeat the counsel of Ahithophel (<a onClick="return mV(\'2Sa\',15,32);">2Sa 15:32</a>f). Whatever Absalom decided on, Hushai was to send word to David through two young men, sons of the priests Zadok and Abiathar (<a onClick="return mV(\'2Sa\',15,\'34-36\');">2Sa 15:34-36</a>). Hushai obeyed, and succeeded in persuading Absalom to adopt his counsel rather than that of Ahithophel (<a onClick="return mV(\'2Sa\',16,\'16-\');">2Sa 16:16</a>-<a onClick="return mV(\'2Sa\',17,\'1-14\');">17:14</a>). He sent word to David of the nature of Ahithophel\'s counsel, and the king made good his escape that night across the Jordan. The result was the suicide of Ahithophel and the ultimate defeat and death of Absalom.``146';
isbe[4497]='Husham`hu\'-sham (chusham, <a onClick="return mV(\'Gen\',36,34);">Ge 36:34</a>; chusham, <a onClick="return mV(\'1Ch\',1,\'45-46\');">1Ch 1:45-46</a>, "alert"): According to the former reference, Husham was one of the kings of Edom, and according to the latter he was "of the land of the Temanites" and (<a onClick="return mV(\'1Ch\',1,35);">1Ch 1:35</a>f) descended from Esau.``1';
isbe[4498]='Hushathite`hu\'-shath-it, (chushathi, "a dweller in Hushah"?): The patronymic given in two forms, but probably of the same man, Sibbeccai, one of David\'s thirty heroes (<a onClick="return mV(\'2Sa\',21,18);">2Sa 21:18</a>; <a onClick="return mV(\'1Ch\',11,29);">1Ch 11:29</a>; <a onClick="return mV(\'1Ch\',20,4);">20:4</a>; <a onClick="return mV(\'1Ch\',27,11);">27:11</a>), or Mebunnai as named in the parallel passage (<a onClick="return mV(\'2Sa\',23,27);">2Sa 23:27</a>).``1';
isbe[4499]='Hushim`hu\'-shim (chusim, "hasters”):<P>(1) Family name of the children of Dan (<a onClick="return mV(\'Gen\',46,23);">Ge 46:23</a>), but of form "Shuham" in <a onClick="return mV(\'Num\',26,42);">Nu 26:42</a>.<P>(2) The sons of Aher of the lineage of Benjamin (<a onClick="return mV(\'1Ch\',7,12);">1Ch 7:12</a>).<P>(3) One of the wives of Shaharaim, of the family of Benjamin (<a onClick="return mV(\'1Ch\',8,8,11);">1Ch 8:8, 11</a>).``1';
isbe[4500]='Hushshathite`hush\'-shath-it (chushshathi). Same as <a href="study/isbe/search.html?string=HUSHATHITE">HUSHATHITE</A> (which see), except in reduplicated form (<a onClick="return mV(\'1Ch\',27,11);">1Ch 27:11</a>; compare <a onClick="return mV(\'1Ch\',11,29);">1Ch 11:29</a>, Hebrew pronunciation).``1';
