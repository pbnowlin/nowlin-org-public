isbe[4430]='Hornet`hor\'-net (tsir\'ah; compare tsor\'ah, "Zorah" (<a onClick="return mV(\'Jdg\',13,2);">Jud 13:2</a>, etc.); also compare tsara\'ath, "leprosy" (<a onClick="return mV(\'Lev\',13,2);">Le 13:2</a>, etc.); from tsara\', "to smite"; Septuagint sphekia, literally, "wasp\'s nest"): Hornets are mentioned only in <a onClick="return mV(\'Exd\',23,28);">Ex 23:28</a>; <a onClick="return mV(\'Deu\',7,20);">De 7:20</a>; <a onClick="return mV(\'Jos\',24,12);">Jos 24:12</a>. All three references are to the miraculous interposition of God in driving out before the Israelites the original inhabitants of the promised land. There has been much speculation as to whether hornets are literally meant. The following seems to throw some light on this question (<a onClick="return mV(\'Exd\',23,20,27,28);">Ex 23:20, 27-28</a>): "Behold, I send an angel before thee, to keep thee by the way, and to bring thee into the place which I have prepared....I will send my terror before thee, and will discomfit all the people to whom thou shalt come, and I will make all thine enemies turn their backs unto thee. And I will send the hornet before thee, which shall drive out the Hivite, the Canaanite, and the Hittite, from before thee." The "terror" of <a onClick="return mV(\'Exd\',23,27);">Ex 23:27</a> may well be considered to be typified by the "hornet" of <a onClick="return mV(\'Exd\',23,28);">23:28</a>, the care for the Israelites (<a onClick="return mV(\'Exd\',23,20);">23:20</A>) being thrown into marked contrast with the confusion of their enemies. Compare <a onClick="return mV(\'Isa\',7,18);">Isa 7:18</a>, where the fly and the bee symbolize the military forces of Egypt and Assyria: "And it shall come to pass in that day, that Yahweh will hiss for the fly that is in the uttermost part of the rivers of Egypt, and for the bee that is in the land of Assyria."<P>Hornets and wasps belong to the family Vespidae of the order Hymenoptera. Both belong to the genus Vespa, the hornets being distinguished by their large size. Both hornets and wasps are abundant in Palestine (compare Zorah, which may mean "town of hornets"). a large kind is called in Arabic debbur, which recalls the Hebrew debhorah, "bee." They sting fiercely, but not unless molested.``37';
isbe[4431]='Horns of the Altar`(qare-noth ha-mizbeach):<P>1. The Brazen Altar:<P>These projections at the four corners of the altar of burnt offering were of one piece with the altar, and were made of acacia wood overlaid with brass (<a onClick="return mV(\'Exd\',27,2);">Ex 27:2</a>, "bronze"). In Ezekiel\'s altar-specifications their position is described as being on a level with the altar hearth (<a onClick="return mV(\'Eze\',43,15);">Eze 43:15</a>). Fugitives seeking asylum might cling to the horns of the altar, as did Adonijah (<a onClick="return mV(\'1Ki\',1,50);">1Ki 1:50</a>), which is one proof among many that worshippers had at all times access to the neighborhood of the altar. On certain occasions, as at the consecration of Aaron and his sons (<a onClick="return mV(\'Exd\',29,12);">Ex 29:12</a>), and a sin offering for one of the people of the land (<a onClick="return mV(\'Lev\',4,30);">Le 4:30</a>), the horns were touched with sacrificial blood.<P>2. The Golden Altar:<P>The altar of incense, standing in the outer chamber of the sanctuary, had also four horns, which were covered with gold (<a onClick="return mV(\'Exd\',37,25);">Ex 37:25</a>). These were touched with blood in the case of a sin offering for a high priest, or for the whole congregation, if they had sinned unwittingly (<a onClick="return mV(\'Lev\',4,7,18);">Le 4:7, 18</a>).`<a href="./study/isbe/search.html?string=ALTAR">ALTAR</a>; <a href="./study/isbe/search.html?string=HORN">HORN</a>`17';
isbe[4432]='Horns, Rams\'``<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>`1';
isbe[4433]='Horonaim`hor-o-na\'-im [choronayim]; Aronieim; in Jeremiah Oronaim, "the two hollows"): an unidentified place in the south of Moab. It is named in <a onClick="return mV(\'Jer\',48,5);">Jer 48:5</a>. Isaiah (<a onClick="return mV(\'Isa\',15,5);">15:5</A>) and Jeremiah (<a onClick="return mV(\'Jer\',48,3);">48:3</A>) speak of "the way to Horanaim"; and Jeremiah (<a onClick="return mV(\'Jer\',48,5);">48:5</A>) of the, "descent," or "going down" of Horonaim. Mesha (MS) says he was bidden by Chemosh to "go down" and fight against Choronem. Probably, therefore, it lay on one of the roads leading down from the Moabite plateau to the Arabah. It is mentioned by Josephus as having been taken by Alexander Janneus (Ant., XIII, xv, 4). Hyrcanus promised to restore it and the rest to Aretas (XIV, i, 4). There is no indication that in early times it was ever possessed by Israel. Buhl (GAP 272f) thinks it may be represented by some significant ruins near Wady ed-Dera\'a (Wady Kerak).``54';
isbe[4434]='Horonite`hor\'-o-nit, ho\'-ro-nit (ha-choroni): an appellation of Sanballat (<a onClick="return mV(\'Neh\',2,10,19);">Ne 2:10, 19</a>; <a onClick="return mV(\'Neh\',13,28);">13:28</a>), as an inhabitant of <a href="study/isbe/search.html?string=BETH-HORON">BETH-HORON</a> (which see).``1';
isbe[4435]='Horrible`hor\'-i-b\'-l (sha\'arur, sha\'aruri): In <a onClick="return mV(\'Jer\',5,30);">Jer 5:30</a> sha\'arur, "vile," "horrible," is translated "horrible," "a wonderful and horrible thing" the Revised Version margin "astonishment and horror"; also <a onClick="return mV(\'Jer\',23,14);">Jer 23:14</a>; in <a onClick="return mV(\'Jer\',18,13);">18:13</A>; <a onClick="return mV(\'Hsa\',6,10);">Ho 6:10</a> it is sha\'aruri; in <a onClick="return mV(\'Psa\',11,6);">Ps 11:6</a> we have zil\'aphah, "heat," the Revised Version (British and American) "burning wind"; in <a onClick="return mV(\'Psa\',40,2);">Ps 40:2</a> sha\'on, "noise," "tumult," "He brought me up...out of a horrible pit," the Revised Version margin "a pit of tumult" (or destruction). Horribly is the translation of sa\'ar, "to shudder," "to be whirled away," in <a onClick="return mV(\'Jer\',2,12);">Jer 2:12</a>, and of sa\'ar, "fear," "trembling," in <a onClick="return mV(\'Eze\',32,10);">Eze 32:10</a>; in <a onClick="return mV(\'Eze\',27,35);">Eze 27:35</a> the Revised Version (British and American) has "horribly afraid" (sa\'ar) for "sore afraid." "Horrible" occurs frequently in Apocrypha (2Esdras 11:45; 15:28,34; The <span class="noTag">Wisdom of Solomon 3:19</span>, "For horrible (chalepos) is the end of the unrighteous generation" the Revised Version (British and American) "grievous" etc.).``185';
isbe[4436]='Horror`hor\'-er (\'emah, pallatsuth): In <a onClick="return mV(\'Gen\',15,12);">Ge 15:12</a> \'emah (often rendered "terror") is translated "horror," "a horror of great darkness"; pallatsuth, "trembling," "horror" (<a onClick="return mV(\'Psa\',55,5);">Ps 55:5</a>; <a onClick="return mV(\'Eze\',7,18);">Eze 7:18</a>); zal\'aphah, "glow," "heat" (<a onClick="return mV(\'Psa\',119,53);">Ps 119:53</a>, the Revised Version (British and American) "hot indignation," margin "horror"); compare <a onClick="return mV(\'Psa\',11,6);">Ps 11:6</a>; <a onClick="return mV(\'Lam\',5,10);">La 5:10</a>. For "trembling" (<a onClick="return mV(\'Job\',21,6);">Job 21:6</a>) and for "fearfulness" (<a onClick="return mV(\'Isa\',21,4);">Isa 21:4</a>) the Revised Version (British and American) has "horror." "Horror" does not occur in the New Testament, but in 2Macc 3:17 we have "The man was so compassed with horror" (phrikasmos), the Revised Version (British and American) "shuddering."``1';
isbe[4437]='Horse`hors:<P>1. Names:<P>The common names are (1) cuc, and (2) hippos.<P>(3) The word parash, "horseman," occurs often, and in several cases is translated "horse" or "warhorse" (<a onClick="return mV(\'Isa\',28,28);">Isa 28:28</a>; <a onClick="return mV(\'Eze\',27,14);">Eze 27:14</a>; <a onClick="return mV(\'Joe\',2,4);">Joe 2:4</a> the Revised Version, margin); also in <a onClick="return mV(\'2Sa\',16,\'1-\');">2Sa 16</a>, where the "horsemen" of English Versions of the Bible is ba\'ale ha-parashim, "owners of horses"; compare Arabic faris, "horseman," and faras, "horse".<P>(4) The feminine form cucah, occurs in <a onClick="return mV(\'Sgs\',1,9);">So 1:9</a>, and is rendered as follows: Septuagint he hippos; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) equitatum; the King James Version "company of horses," the Revised Version (British and American) "steed." It is not clear why English Versions of the Bible does not have "mare."<P>(5) The word \'abbirim, "strong ones," is used for horses in <a onClick="return mV(\'Jdg\',5,22);">Jud 5:22</a>; <a onClick="return mV(\'Jer\',8,16);">Jer 8:16</a>; <a onClick="return mV(\'Jer\',47,3);">47:3</a>; <a onClick="return mV(\'Jer\',50,11);">50:11</a> (the King James Version "bulls"). In <a onClick="return mV(\'Psa\',22,12);">Ps 22:12</a> the same word is translated "strong bulls" (of Bashan).<P>(6) For rekhesh (compare Arabic rakad, "to run"), in <a onClick="return mV(\'1Ki\',4,28);">1Ki 4:28</a>; <a onClick="return mV(\'Est\',8,10,14);">Es 8:10, 14</a>; <a onClick="return mV(\'Mic\',1,13);">Mic 1:13</a>, the Revised Version (British and American) has "swift steeds," while the King James Version gives "dromedaries" in 1Ki and "mules" in Est.<P>(7) For kirkaroth (<a onClick="return mV(\'Isa\',66,20);">Isa 66:20</a>), the King James Version and the English Revised Version have "swift beasts"; the English Revised Version margin and the American Standard Revised Version "dromedaries"; Septuagint skiddia, perhaps "covered carriages." In <a onClick="return mV(\'Est\',8,10,14);">Es 8:10, 14</a> we find the doubtful words<P>(8) \'achashteranim, and<P>(9) bene ha-rammakim, which have been variously translated. the King James Version has respectively "camels" and "young dromedaries," the Revised Version (British and American) "used in the king\'s service" and "bred of the stud," the Revised Version margin "mules" and "young dromedaries."<P>See <a href="study/isbe/search.html?string=CAMEL">CAMEL</a>.<P>2. Origin:<P>The Hebrew and Egyptian names for the horse are alike akin to the Assyrian. The Jews may have obtained horses from Egypt (<a onClick="return mV(\'Deu\',17,16);">De 17:16</a>), but the Canaanites before them had horses (<a onClick="return mV(\'Jos\',17,16);">Jos 17:16</a>), and in looking toward the northeast for the origin of the horse, philologists are in agreement with zoologists who consider that the plains of Central Asia, and also of Europe, were the original home of the horse. At least one species of wild horse is still found in Central Asia.<P>3. Uses:<P>The horses of the Bible are almost exclusively war-horses, or at least the property of kings and not of the common people. A doubtful reference to the use of horses in threshing grain is found in <a onClick="return mV(\'Isa\',28,28);">Isa 28:28</a>. Horses are among the property which the Egyptians gave to Joseph in exchange for grain (<a onClick="return mV(\'Gen\',47,17);">Ge 47:17</a>). In <a onClick="return mV(\'Deu\',17,16);">De 17:16</a> it is enjoined that the king "shall not multiply horses to himself, nor cause the people to return to Egypt, to the end that he may multiply horses." This and other injunctions failed to prevent the Jews from borrowing from the neighboring civilizations their customs, idolatries, and vices. Solomon\'s horses are enumerated in <a onClick="return mV(\'1Ki\',4,\'1-\');">1Ki 4</a>, and the se\'irim and tebhen of <a onClick="return mV(\'1Ki\',4,28);">1Ki 4:28 (Hebrew 5:8</a>) are identical with the sha\'ir ("barley") and tibn ("straw") with which the Arab feeds his horse today. In war, horses were ridden and were driven in chariots (<a onClick="return mV(\'Exd\',14,9);">Ex 14:9</a>; <a onClick="return mV(\'Jos\',11,4);">Jos 11:4</a>; <a onClick="return mV(\'2Sa\',15,1);">2Sa 15:1</a>, etc.).<P>4. Figurative and Descriptive:<P>The horse is referred to figuratively chiefly in Zechariah and Revelation. A chariot and horses of fire take Elijah up to heaven (<a onClick="return mV(\'2Ki\',2,11);">2Ki 2:11</a>f). In <a onClick="return mV(\'Psa\',20,7);">Ps 20:7</a>; <a onClick="return mV(\'Psa\',33,17);">33:17</a>; and <a onClick="return mV(\'Psa\',76,6);">76:6</a>, the great strength of the horse is recalled as a reminder of the greater strength of God. In <a onClick="return mV(\'Jam\',3,3);">Jas 3:3</a>, the small bridle by which the horse can be managed is compared to the tongue (compare <a onClick="return mV(\'Psa\',32,9);">Ps 32:9</a>). In <a onClick="return mV(\'Job\',39,\'19-25\');">Job 39:19-25</a> we have a magnificent description of a spirited war-horse.``37';
isbe[4438]='Horse Gate``<a href="./study/isbe/search.html?string=JERUSALEM,+1">JERUSALEM</a>`1';
isbe[4439]='Horse, Black`(hippos melas): Symbolic of famine ("balance...measure of wheat for a shilling," etc., <a onClick="return mV(\'Rev\',6,5,6);">Re 6:5-6</a>; compare <a onClick="return mV(\'Zec\',6,2,6);">Zec 6:2, 6</a>).`<a href="./study/isbe/search.html?string=REVELATION+OF+JOHN">REVELATION OF JOHN</a>`1';
isbe[4440]='Horse, Red`(hippos purros): Symbolic of war, bloodshed ("slay one another," etc., <a onClick="return mV(\'Rev\',6,4);">Re 6:4</a>; compare <a onClick="return mV(\'Zec\',18,\'1-\');">Zec 18</A>; <a onClick="return mV(\'Zec\',6,2);">6:2</a>).`<a href="./study/isbe/search.html?string=REVELATION+OF+JOHN">REVELATION OF JOHN</a>`1';
isbe[4441]='Horse, White`(hippos leukos): Symbolic of victory, conquest ("bow...conquering and to conquer," <a onClick="return mV(\'Rev\',6,2);">Re 6:2</a>; <a onClick="return mV(\'Rev\',19,11,14);">19:11, 14</a>; compare <a onClick="return mV(\'Zec\',1,8);">Zec 1:8</a>; <a onClick="return mV(\'Zec\',6,3,6);">6:3, 6</a>).`<a href="./study/isbe/search.html?string=REVELATION+OF+JOHN">REVELATION OF JOHN</a>`1';
isbe[4442]='Horseleach`hors\'-lech (\'aluqah; compare Arabic \'aluqah, "ghoul," and \'alaqah, "leech," from root \'aliq, "to cling"; Septuagint bdella, "leech"): The word occurs only once, in <a onClick="return mV(\'Pro\',30,15);">Pr 30:15</a>, the Revised Version margin "vampire." In Arabic \'alaqah is a leech of any kind, not only a horse-leech. The Arabic \'aluqah, which, it may be noted, is almost identical with the Hebrew form, is a ghoul (Arabic ghul), an evil spirit which seeks to injure men and which preys upon the dead. The mythical vampire is similar to the ghoul. In zoology the name "vampire" is applied to a family of bats inhabiting tropical America, some, but not all, of which suck blood. In the passage cited the Arabic Bible has \'aluqah, "ghoul." If leech is meant, there can be no good reason for specifying "horseleach." At least six species of leech are known in Palestine and Syria, and doubtless others exist. They are common in streams, pools, and fountains where animals drink. They enter the mouth, attach themselves to the interior of the mouth or pharynx, and are removed only with difficulty.``37';

isbe[4444]='Horses of the Sun`(<a onClick="return mV(\'2Ki\',23,11);">2Ki 23:11</a>): In connection with the sun-worship practiced by idolatrous kings in the temple at Jerusalem (<a onClick="return mV(\'2Ki\',23,5);">2Ki 23:5</a>; compare <a onClick="return mV(\'Eze\',8,16);">Eze 8:16</a>), horses dedicated to the sun, with chariots, had been placed at the entrance of the sacred edifice. These Josiah, in his great reformation, "took away," and burned the chariots with fire. Horses sacred to the sun were common among oriental peoples (Bochart, Heiroz., I,2,10).``1';
isbe[4445]='Hosah`ho\'-sa (chocah): A city on the border of Asher, in the neighborhood of Tyre (<a onClick="return mV(\'Jos\',19,29);">Jos 19:29</a>). Septuagint reads Iaseiph, which might suggest identification with Kefr Yasif, to the northeast of Acre. Possibly, however, as Sayce (HCM, 429) and Moore (Judges, 51) suggest, Hosah may represent the Assyrian Usu. Some scholars think that Usu was the Assyrian name for Palaetyrus. If "the fenced city of Tyre" were that on the island, while the city on the mainland lay at Ras el-\'Ain, 30 stadia to the south (Strabo xvi.758), this identification is not improbable.``1';
isbe[4446]='Hosanna`ho-zan\'-a (hosanna): This Greek transliteration of a Hebrew word occurs 6 times in the Gospels as the cry of the people when our Lord entered Jerusalem as the Messiah represented by Zec (<a onClick="return mV(\'Zec\',9,9);">9:9</a>), and of "the children" when He cleansed the temple (<a onClick="return mV(\'Mat\',21,9);">Mt 21:9</a> bis, <a onClick="return mV(\'Mat\',21,15);">15</a>; <a onClick="return mV(\'Mar\',11,9);">Mr 11:9</a>f; <a onClick="return mV(\'Jhn\',12,13);">Joh 12:13</a>). In <a onClick="return mV(\'Mat\',21,9);">Mt 21:9</a> it is "Hosanna to the son of David!" followed by "Blessed is he that cometh in the name of the Lord; Hosanna in the highest!"; in <a onClick="return mV(\'Mat\',21,15);">21:15</a> it is also "Hosanna to the Son of David!"; in <a onClick="return mV(\'Mar\',11,9);">Mr 11:9</a>f it is "Hosanna; Blessed is he that cometh in the name of the Lord; Blessed is the kingdom that cometh, the kingdom of our father David: Hosanna in the highest"; and in <a onClick="return mV(\'Jhn\',12,13);">Joh 12:13</a> it is "Hosanna: Blessed is he that cometh in the name of the Lord, even the King of Israel." Thus in all the evangelists it is an acclamation or ascription of praise. This has raised the question whether the supposed derivation from <a onClick="return mV(\'Psa\',118,25);">Ps 118:25</a>, beginning with \'annah YHWH hoshi\'ah nna\', "Save now, pray" (which is followed (<a onClick="return mV(\'Psa\',118,26);">118:26</a>) by "Blessed be he that cometh (the Revised Version margin "or entereth") in the name of Yahweh") is correct. (See Thayer, HDB; Cheyne, EB; Dalman, Words of Jesus.) Various other explanations have been suggested. Thayer remarks, "It is most natural to regard the word Hosanna, as respects its form, as neither syncopated nor contracted, but the shorter Hiphil imperative with the appended enclitic" (hosha\'na\'; compare <a onClick="return mV(\'Psa\',86,2);">Ps 86:2</a>; <a onClick="return mV(\'Jer\',31,7);">Jer 31:7</a>), for which there is Talmudic warrant. "As respects its force, we must for...contextual reasons, assume that it had already lost its primary supplicatory sense and become an ejaculation of joy or shout of welcome." It is said to have been so used in this sense at the joyous Feast of Tabernacles, the 7th day of which came to be called "the Great Hosanna," or "Hosanna Day." But, while the word is certainly an ejaculation of praise and not one of supplication, the idea of salvation need not be excluded. As in <a onClick="return mV(\'Rev\',7,10);">Re 7:10</a> (compare <a onClick="return mV(\'Rev\',19,1);">19:1</a>), we have the acclamation, "Salvation unto God...and unto the Lamb," so we might have the cry, "Salvation to the son of David"; and "Hosanna in the Highest," might be the equivalent of "Salvation unto our God!" He who was "coming in the name of the Lord" was the king who was bringing salvation from God to the people.``185';
isbe[4447]='Hosea`ho-ze\'-a:<P><b>I. THE PROPHET</b><P class="in15">1. Name<P class="in15">2. Native Place<P class="in15">3. Date<P class="in15">4. Personal History (Marriage)<P class="in30">(1) Allegorical View<<P class="in30">(2) Literal View<P><b>II. THE BOOK</b><P class="in15">1. Style and Scope<P class="in15">2. Historical Background<P class="in15">3. Contents and Divisions<P class="in30">(1) <span class="noTag">Hosea 1-3</span><P class="in30">(2) <span class="noTag">Hosea 4-14</span><P class="in15">4. Testimony to Earlier History<P class="in15">5. Testimony to Law<P class="in15">6. Affinity with Deuteronomy<P><b>LITERATURE</b><hr /><P>I. The Prophet.<P>1. Name:<P>The name (hoshea Septuagint Osee-; for other forms see note in DB), probably meaning "help," seems to have been not uncommon, being derived from the auspicious verb from which we have the frequently recurring word "salvation." It may be a contraction of a larger form of which the Divine name or its abbreviation formed a part, so as to signify "God is help," or "Help, God." according to <a onClick="return mV(\'Num\',13,8,16);">Nu 13:8, 16</a> that was the original name of Joshua son of Nun, till Moses gave him the longer name (compounded with the name of Yahweh) which he continued to bear (yehoshua\'), "Yahweh is salvation." The last king of the Northern Kingdom was also named Hosea (<a onClick="return mV(\'2Ki\',15,30);">2Ki 15:30</a>), and we find the same name borne by a chief of the tribe of Ephraim under David (<a onClick="return mV(\'1Ch\',27,20);">1Ch 27:20</a>) and by a chief under Nehemiah (<a onClick="return mV(\'Neh\',10,23);">Ne 10:23</a>).<P>2. Native Place:<P>Although it is not directly stated in the book, there can be little doubt that he exercised his ministry in the kingdom of the Ten Tribes. Whereas his references to Judah are of a general kind, Ephraim or Samaria being sometimes mentioned in the same connection or more frequently alone, the situation implied throughout and the whole tone of the addresses agree with what we know of the Northern Kingdom at the time, and his references to places and events in that kingdom are so numerous and minute as to lead to the conclusion that he not only prophesied there, but that he was a native of that part of the country. Gilead, e.g. a district little named in the prophets, is twice mentioned in Ho (<a onClick="return mV(\'Hsa\',6,8);">6:8</a>; <a onClick="return mV(\'Hsa\',12,11);">12:11</a>) and in such a manner as to suggest that he knew it by personal observation; and Mizpah (mentioned in a>; <a onClick="return mV(\'Hsa\',5,1);">5:1</a>) is no doubt the Mizpah in Gilead (<a onClick="return mV(\'Jdg\',10,17);">Jud 10:17</a>). Then we find Tabor (<a onClick="return mV(\'Hsa\',5,1);">Ho 5:1</a>), Shechem (<a onClick="return mV(\'Hsa\',6,9);">Ho 6:9</a> the Revised Version (British and American)), Gilgal and Bethel (<a onClick="return mV(\'Hsa\',4,15);">Ho 4:15</a>; <a onClick="return mV(\'Hsa\',9,15);">9:15</a>; <a onClick="return mV(\'Hsa\',10,5,8,15);">10:5, 8, 15</a>; <a onClick="return mV(\'Hsa\',12,11);">12:11</a>). Even Lebanon in the distant north is spoken of with a minuteness of detail which could be expected only from one very familiar with Northern Palestine (<a onClick="return mV(\'Hsa\',14,\'5-8\');">Ho 14:5-8</a>). In a stricter sense, therefore, than amos who, though a native of Tekoah, had a prophetic mission to the north, Hosea may be called the prophet of Northern Israel, and his book, as Ewald has said, is the prophetic voice wrung from the bosom of the kingdom itself.<P>3. Date:<P>All that we are told directly as to the time when Hosea prophesied is the statement in the first verse that the word of the Lord came to him "in the days of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah, and in the days of Jeroboam the son of Joash, king of Israel." It is quite evident that his ministry did not extend over the combined reigns of all these kings; for, from the beginning of the reign of Uzziah to the beginning of that of Hezekiah, according to the now usually received chronology (Kautzsch, Literature of the Old Testament, English Translation), there is a period of 52 years, and Jeroboam came to his throne a few years before the accession of Uzziah.<P>When we examine the book itself for more precise indications of date, we find that the prophet threatens in God\'s name that in "a little while" He will "avenge the blood of Jezreel upon the house of Jehu." Now Jeroboam was the great-grandson of Jehu, and his son Zechariah, who succeeded him, reigned only six months and was the last of the line of Jehu. We may, therefore, place the beginning of Hosea\'s ministry a short time before the death of Jeroboam which took place 743 BC. as to the other limit, it is to be observed that, though the downfall of "the kingdom of the house of Israel" is threatened (<a onClick="return mV(\'Hsa\',1,4);">Ho 1:4</a>), the catastrophe had not occurred when the prophet ceased his ministry. The date of that event is fixed in the year 722 BC, and it is said to have happened in the 6th year of King Hezekiah. This does not give too long a time for Hosea\'s activity, and it leaves the accuracy of the superscription unchallenged, whoever may have written it. If it is the work of a later editor, it may be that Hosea\'s ministry ceased before the reign of Hezekiah, though he may have lived on into that king\'s reign. It should be added, however, that there seems to be no reference to another event which might have been expected to find an echo in the book, namely, the conspiracy in the reign of Ahaz (735 BC) by Pekah of Israel and Rezin of Damascus against the kingdom of Judah (<a onClick="return mV(\'2Ki\',16,5);">2Ki 16:5</a>; <a onClick="return mV(\'Isa\',7,1);">Isa 7:1</a>).<P>Briefly we may say that, though there is uncertainty as to the precise dates of the beginning and end of his activity, he began his work before the middle of the 8th century, and that he saw the rise and fall of several kings. He would thus be a younger contemporary of amos whose activity seems to have been confined to the reign of Jeroboam.<P>4. Personal History (Marriage):<P>Hosea is described as the son of Beeri, who is otherwise unknown. Of his personal history we are told either absolutely nothing or else a very great deal, according as we interpret chapters <a onClick="return mV(\'Hsa\',1,\'1-\');">1</a> and <a onClick="return mV(\'Hsa\',3,\'1-\');">3</a> of his book. In ancient and in modern times, opinions have been divided as to whether in these chapters we have a recital of actual facts, or the presentation of prophetic teaching in the form of parable or allegory.<P>(1) Allegorical View.<P>The Jewish interpreters as a rule took the allegorical view, and Jerome, in the early Christian church, no doubt following Origen the great allegorizer, states it at length, and sees an intimation of the view in the closing words of Hosea\'s book: "Who is wise, that he may understand these things? prudent, that he may know them?" (<a onClick="return mV(\'Hsa\',14,9);">Ho 14:9</a>).<P>It is a mystery, he says; for it is a scandal to think of Hosea being commanded to take an unchaste wife and without any reluctance obeying the command. It is a figure, like that of Jeremiah going to the Euphrates (when Jerusalem was closely besieged) and hiding a girdle in the bed of the river (<a onClick="return mV(\'Jer\',13,\'1-\');">Jer 13</a>). So Ezekiel is commanded to represent, by means of a tile, the siege of Jerusalem, and to lie 390 days on his side to indicate the years of their iniquity (<a onClick="return mV(\'Eze\',4,\'1-\');">Eze 4</a>); and there are other symbolical acts. Jerome then proceeds to apply the allegory first to Israel, which is the Gomer of chapter <a onClick="return mV(\'Hsa\',1,\'1-\');">1</a>, and then to Judah, the wife in chapter <a onClick="return mV(\'Hsa\',3,\'1-\');">3</a>, and finally to Christ and the church, the representations being types from beginning to end.<P>Calvin took the same view. Among modern commentators we find holding the allegorical view not only Hengstenberg, Havernick and Keil, but also Eichhorn, Rosenmuller and Hitzig. Reuss also (Das Altes Testament, II, 88ff) protests against the literal interpretation as impossible, and that on no moral or reverential considerations, but entirely on exegetical grounds. He thinks it enough to say that, when the prophet calls his children "children of whoredom," he indicates quite clearly that he uses the words in a figurative sense; and he explains the allegory as follows: The prophet is the representative of Yahweh; Israel is the wife of Yahweh, but faithless to her husband, going after other gods; the children are the Israelites, who are therefore called children of whoredoms because they practice the idolatry of the nation. So they receive names which denote the consequences of their sin. In accordance with the allegory, the children are called the children of the prophet (for Israel is God\'s own) but this is not the main point; the essential thing is the naming of the children as they are named. In the third chapter, according to this interpretation, allegory again appears, but with a modification and for another purpose. Idolatrous Israel is again the unfaithful wife of the prophet as the representative of Yahweh. This relation can again be understood only as figurative; for, if the prophet stands for Yahweh, the marriage of Israel to the prophet cannot indicate infidelity to Yahweh. The sense is evident: the marriage still subsists; God does not give His people up, but they are for the present divorced "from bed and board"; it is a prophecy of the time when Yahweh will leave the people to their fate, till the day of reconciliation comes.<P>(2) Literal View.<P>The literal interpretation, adopted by Theodore of Mopsucstia in the ancient church, was followed, after the Reformation, by the chief theologians of the Lutheran church, and has been held, in modern times, by many leading expositors, including Delitzsch, Kurtz, Hofmann, Wellhausen, Cheyne, Robertson Smith, G. A. Smith and others. In this view, as generally held, chapters <a onClick="return mV(\'Hsa\',1,\'1-\');">1</a> and <a onClick="return mV(\'Hsa\',3,\'1-\');">3</A> go together and refer to the same person. The idea is that Hosea married a woman named Gomer, who had the three children here named. Whether it was that she was known to be a worthless woman before the marriage and that the prophet hoped to reclaim her, or that she proved faithless after the marriage, she finally left him and sank deeper and deeper into sin, until, at some future time, the prophet bought her from her paramour and brought her to his own house, keeping her secluded, however, and deprived of all the privileges of a wife. In support of this view it is urged that the details are related in so matter-of-fact a manner that they must be matters of fact. Though the children receive symbolical names (as Isaiah gave such names to his children), the meanings of these are clear and are explained, whereas the name of the wife cannot thus be explained. Then there are details, such as the weaning of one child before the conception of another (<a onClick="return mV(\'Hsa\',1,8);">Ho 1:8</a>) and the precise price paid for the erring wife (<a onClick="return mV(\'Hsa\',3,2);">Ho 3:2</a>), which are not needed to keep up the allegory, and are not invested with symbolical meaning by the prophet. What is considered a still stronger argument is relied on by modern advocates of this view, the psychological argument that there is always a proportion between a revelation vouchsafed and the mental state of the person receiving it. Hosea dates the beginning of his prophetic work from the time of his marriage; it was the unfaithfulness of his wife that brought home to him the apostasy of Israel; and, as his heart went after his wayward wife, so the Divine love was stronger than Israel\'s sin; and thus through his own domestic experience he was prepared to be a prophet to his people.<P>The great difficulty in the way of accepting the literal interpretation lies, as Reuss has pointed out, in the statement at the beginning, that the prophet was commanded to take a wife of whoredoms and children of whoredoms. And the advocates of the view meet the difficulties in some way like this: The narrative as it stands is manifestly later than the events. On looking back, the prophet describes his wife as she turned out to be, not as she was at the beginning of the history. It is urged with some force that it was necessary to the analogy (even if the story is only a parable) that the wife should have been first of all chaste; for, in Hosea\'s representation, Israel at the time of its election in the wilderness was faithful and fell away only afterward (<a onClick="return mV(\'Hsa\',2,15);">Ho 2:15</a>; <a onClick="return mV(\'Hsa\',9,10);">9:10</a>; <a onClick="return mV(\'Hsa\',11,1);">11:1</a>). The narrative does not require us to assume that Gomer was an immoral person or that she was the mother of children before her marriage. The children receive symbolic names, but these names do not reflect upon Gomer but upon Israel. Why, then, is she described as a woman of whoredoms? It is answered that the expression \'esheth zenunim is a class-descriptive, and is different from the expression "a woman who is a harlot" (\'ishshdh zonah). A Jewish interpreter quoted by Aben Ezra says: "Hosea was commanded to take a wife of whoredoms because an honest woman was not to be had. The whole people had gone astray—was an \'adulterous generation\'; and she as one of them was a typical example, and the children were involved in the common declension (see <a onClick="return mV(\'Hsa\',4,1);">Ho 4:1</a>f) ." The comment of Umbreit is worthy of notice: "as the covenant of Yahweh with Israel is viewed as a marriage bond, so is the prophetic bond with Israel a marriage, for he is the messenger and mediator. Therefore, if he feels an irresistible impulse to enter into the marriage-bond with Israel, he is bound to unite himself with a bride of an unchaste character. Yea, his own wife Gomer is involved in the universal guilt" (Prak. Commentary uber die Propheten, Hamburg, 1844). It is considered, then, on this view, that Gomer, after her marriage, being in heart addicted to the prevailing idolatry, which we know was often associated with gross immorality (see <a onClick="return mV(\'Hsa\',4,13);">Ho 4:13</a>), felt the irksomeness of restraint in the prophet\'s house, left him and sank into open profligacy, from which (<a onClick="return mV(\'Hsa\',3,\'1-\');">Ho 3</a>) the prophet reclaimed her so far as to bring her back and keep her secluded in his own house.<P>Quite recently this view has been advocated by Riedel (Alttest. Untersuchungen, Leipzig, 1902), who endeavors to enforce it by giving a symbolic meaning to Gomer\'s name, Bath-Diblaim. The word is the dual (or might be pointed as a plural) of a word, debhelah, meaning a fruitcake, i.e. raisins or figs pressed together. It is the word used in the story of Hezekiah\'s illness (<a onClick="return mV(\'2Ki\',20,7);">2Ki 20:7</a>), and is found in the list of things furnished by abigail to David (<a onClick="return mV(\'1Sa\',25,18);">1Sa 25:18</a>). See also <a onClick="return mV(\'1Sa\',30,12);">1Sa 30:12</a>; <a onClick="return mV(\'1Ch\',12,40);">1Ch 12:40</a>. Another name for the same thing, ashishah, occurs in <a onClick="return mV(\'Hsa\',3,1);">Ho 3:1</a>, rendered in the King James Version "flagons of wine," but in the Revised Version (British and American) "cakes of raisins." It seems clear that this word, at least here, denotes fruit-cakes offered to the heathen deities, as was the custom in Jeremiah\'s time (<a onClick="return mV(\'Jer\',7,18);">Jer 7:18</a>; <a onClick="return mV(\'Jer\',44,17);">44:17</a>). So Riedel argues that Gomer may have been described as a "daughter of fruit-cakes" according to the Hebrew idiom in such expressions as "daughters of song," etc. (<a onClick="return mV(\'Ecc\',12,4);">Ec 12:4</a>; <a onClick="return mV(\'Pro\',31,2);">Pr 31:2</a>; <a onClick="return mV(\'2Sa\',7,10);">2Sa 7:10</a>; <a onClick="return mV(\'Gen\',37,3);">Ge 37:3</a>, etc.).<P>It will be perceived that the literal interpretation as thus stated does not involve the supposition that Hosea became aware of his wife\'s infidelity before the birth of the second child, as Robertson Smith and G. A. Smith suppose. The names given to the children all refer to the infidelity of Israel as a people; and the renderings of Lo\'-ruchamah, "she that never knew a father\'s love," and of Lo-\'ammi, "no kin of mine," are too violent in this connection. Nor does the interpretation demand that it was first through his marriage and subsequent experience that the prophet received his call; although no doubt the experience through which he passed deepened the conviction of Israel\'s apostasy in his mind.<P>II. The Book.<P>1. Style and Scope:<P>Scarcely any book in the Old Testament is more difficult of exposition than the Book of Hosea. This does not seem to be owing to any exceptional defect in the transmitted text, but rather to the peculiarity of the style; and partly also, no doubt, to the fact that the historical situation of the prophet was one of bewildering and sudden change of a violent kind, which seems to reflect itself in the book. The style here is preeminently the man. Whatever view we may take of his personal history, it is evident that he is deeply affected by the situation in which he is placed. He is controlled by his subject, instead of controlling it. It is his heart that speaks; he is not careful to concentrate his thoughts or to mark his transitions; the sentences fall from him like the sobs of a broken heart. Mournful as Jeremiah, he does not indulge in the pleasure of melancholy as that prophet seems to do. Jeremiah broods over his sorrow, nurses it, and tells us he is weeping. Hosea does not say he is weeping, but we hear it in his broken utterances. Instead of laying out his plaint in measured form, he ejaculates it in short, sharp sentences, as the stabs of his people\'s sin pierce his heart.<P>The result is the absence of that rhythmic flow and studied parallelism which are such common features of Hebrew oratory, and are often so helpful to the expositor. His imagery, while highly poetical, is not elaborated; his figures are not so much carried out as thrown out; nor does he dwell long on the same figure. His sentences are like utterances of an oracle, and he forgets himself in identifying himself with the God in whose name he speaks—a feature which is not without significance in its bearing on the question of his personal history. The standing expression "Thus saith the Lord" ("It is the utterance of Yahweh" the Revised Version (British and American)), so characteristic of the prophetic style, very rarely occurs (only in <a onClick="return mV(\'Hsa\',2,13,16,21);">Ho 2:13, 16, 21</a>; <a onClick="return mV(\'Hsa\',11,11);">11:11</a>); whereas the words that he speaks are the very words of the Lord; and without any formal indication of the fact, he passes from speaking in his own name to speaking in the name of Yahweh (see, e.g. <a onClick="return mV(\'Hsa\',6,4);">Ho 6:4</a>; <a onClick="return mV(\'Hsa\',7,12);">7:12</a>; <a onClick="return mV(\'Hsa\',8,13);">8:13</a>; <a onClick="return mV(\'Hsa\',9,9,10,\'14-17\');">9:9-10, 14-17</a>, etc.). Never was speaker so absorbed in his theme, or more identified with Him for whom he speaks. He seems to be oblivious of his hearers, if indeed his chapters are the transcript or summary of spoken addresses. They certainly want to a great extent the directness and point which are so marked a feature of prophetic diction, so much so that some (e.g. Reuss and Marti) suppose they are the production of one who had readers and not hearers in view.<P>But, though the style appears in this abrupt form, there is one clear note on divers strings sounding through the whole. The theme is twofold: the love of Yahweh, and the indifference of Israel to that love; and it would be hard to say which of the two is more vividly conceived and more forcibly expressed. Under the figures of the tenderest affection, sometimes that of the pitying, solicitous care of the parent (<a onClick="return mV(\'Hsa\',11,1,3,8);">Ho 11:1, 3, 8</a>; <a onClick="return mV(\'Hsa\',14,3);">14:3</a>), but more prominently as the affection of the husband (<a onClick="return mV(\'Hsa\',1,\'1-\');">Ho 1</a>; <a onClick="return mV(\'Hsa\',3,\'1-\');">3</a>), the Divine love is represented as ever enduring in spite of all indifference and opposition; and, on the other hand, the waywardness, unblushing faithlessness of the loved one is painted in colors so repulsive as almost to shock the moral sense, but giving thereby evidence of the painful abhorrence it had produced on the prophet\'s mind. Thus early does he take the sacred bond of husband and wife as the type of the Divine electing love—a similitude found elsewhere in prophetic literature, and most fully elaborated by Ezekiel (<a onClick="return mV(\'Eze\',16,\'1-\');">Eze 16</a>; compare <a onClick="return mV(\'Jer\',3,\'1-\');">Jer 3</a>). Hosea is the prophet of love, and not without propriety has been called the John of the Old Testament.<P>2. Historical Background:<P>For the reasons just stated, it is very difficult to give a systematic analysis of the Book of Hos. It may, however, be helpful to that end to recall the situation of the time as furnishing a historical setting for the several sections of the book.<P>At the commencement of the prophet\'s ministry, the Northern Kingdom was enjoying the prosperity and running into the excesses consequent on the victories of Jeroboam II. The glaring social corruptions of the times are exhibited and castigated by Amos, as they would most impress a stranger from the south; but Hosea, a native, as we are led suppose, of the Northern Kingdom, saw more deeply into the malady, and traced all the crime and vice of the nation to the fundamental evil of idolatry and apostasy from the true God. What he describes under the repulsive figure of whoredom was the rampant Worship of the be\'alim, which had practically obscured the recognition of the sole claims to worship of the national Yahweh. This worship of the be\'alim is to be distinguished from that of which we read at the earlier time of Elijah. Ahab\'s Tyrian wife Jezebel had introduced the worship of her native country, that of the Sidonian Baal, which amounted to the setting up of a foreign deity; and Elijah\'s contention that it must be a choice between Yahweh and Baal appealed to the sense of patriotism and the sentiment of national existence. The worship of the ba\'als, however, was an older and more insidious form of idolatry. The worship of the Canaanite tribes, among whom the Israelites found themselves on the occupation of Palestine, was a reverence of local divinities, known by the names of the places where each had his shrine or influence. The generic name of ba\'al or "lord" was applied naturally as a common word to each of these, with the addition of the name of place or potency to distinguish them. Thus we have Baal-hermon, Baal-gad, Baal-berith, etc. The insidiousness of this kind of worship is proved by its wide prevalence, especially among people at a low stage of intelligence, when the untutored mind is brought face to face with the mysterious and unseen forces of Nature. And the tenacity of the feeling is proved by the prevalence of such worship, even among people whose professed religion condemns idolatry of every kind. The veneration of local shrines among Christians of the East and in many parts of Europe is well known; and Mohammedans make pilgrimages to the tombs of saints who, though not formally worshipped as deities, are believed to have the power to confer such benefits as the Canaanites expected from the ba\'als. The very name ba\'al, originally meaning simply lord and master, as in such expressions as "master of a house," "lord of a wife," "owner of an ox," would be misleading; for the Israelites could quite innocently call Yahweh their ba\'al or Lord, as we can see they did in the formation of proper names. We can, without much difficulty, conceive what would happen among a people like the Israelite tribes, of no high grade of religious intelligence, and with the prevailing superstitions in their blood, when they found themselves in Palestine. From a nomad and pastoral people they became, and had to become, agriculturists; the natives of the land would be their instructors, in many or in most cases the actual labor would be done by them. The Book of Judges tells us emphatically that several of the Israelite tribes "did not drive out" the native inhabitants; the northern tribes in particular, where the land was most fertile, tolerated a large native admixture. We are also told (<a onClick="return mV(\'Jdg\',2,7);">Jud 2:7</a>) that the people served the Lord all the days of Joshua and of the elders who outlived Joshua; and this hint of a gradual declension no doubt points to what actually took place. For a time they remembered and thought of Yahweh as the God who had done for them great things in Egypt and in the wilderness; and then, as time went on, they had to think of Him as the giver of the land in which they found themselves, with all its varied produce. But this was the very thing the Canaanites ascribed to their ba\'als. And so, imperceptibly, by naming places as the natives named them, by observing the customs which the natives followed, and celebrating the festivals of the agricultural year, they were gliding into conformity with the religion of their neighbors; for, in such a state of society, custom is more or less based on religion and passes for religion. Almost before they were aware, they were doing homage to the various ba\'als in celebrating their festival days and offering to them the produce of the ground.<P>Such was the condition which Hosea describes as an absence of the knowledge of God (<a onClick="return mV(\'Hsa\',4,1);">Ho 4:1</a>). And the consequence cannot be better described than in the words of Paul: "As they refused to have God in their knowledge, God gave them up unto a reprobate mind, to do those things which are not fitting" (<a onClick="return mV(\'Rom\',1,28);">Ro 1:28</a>). Both Hosea and Amos tell us in no ambiguous terms how the devotees of the impure worship gave themselves up "to work all uncleanness with greediness" (<a onClick="return mV(\'Eph\',4,19);">Eph 4:19</a>; compare <a onClick="return mV(\'Amo\',2,7);">Am 2:7</a>f; <a onClick="return mV(\'Hsa\',4,14);">Ho 4:14</a>); and how deeply the canker had worked into the body politic is proved by the rapid collapse and irretrievable ruin which followed soon after the strong hand of Jeroboam was removed. The 21 years that followed his death in 743 BC saw no fewer than six successive occupants of the throne, and the final disappearance of the kingdom of the ten tribes. Zechariah, his son, had reigned only six months when "Shallum the son of Jabesh conspired against him...and slew him, and reigned in his stead" (<a onClick="return mV(\'2Ki\',15,10);">2Ki 15:10</a>). Shallum himself reigned only a month when he was in the same bloody manner removed by Menahem. After a reign of 10 years, according to <a onClick="return mV(\'2Ki\',15,17);">2Ki 15:17</a> (although the chronology here is uncertain), he was succeeded by his son Pekahiah (<a onClick="return mV(\'2Ki\',15,22);">2Ki 15:22</a>), and after two years Pekah "his captain" conspired against him and reigned in his stead (<a onClick="return mV(\'2Ki\',15,25);">2Ki 15:25</a>). This king also was assassinated, and was succeeded by Hoshea (<a onClick="return mV(\'2Ki\',15,30);">2Ki 15:30</a>), the last king of the ten tribes, for the kingdom came to an end in 722 BC. Hosea must have lived during a great part of those troubled times; and we may expect to hear echoes of the events in his book.<P>3. Contents and Divisions:<P>(1) <span class="noTag">Hosea 1-3</span>.<P>We should naturally expect that the order of the chapters would correspond in the main with the progress of events; and there is at least a general agreement among expositors that <a onClick="return mV(\'Hsa\',1,\'1-\');">Hosea 1-3</a> refer to an earlier period than those that follow. In favor of this is the reference in <a onClick="return mV(\'Hsa\',1,2);">1:2</A> to the commencement of the prophet\'s ministry, as also the threatening of the impending extirpation of the house of Jehu (<a onClick="return mV(\'Hsa\',1,4);">1:4</A>), implying that it was still in existence; and finally the hints of the abundance amounting to luxury which marked the prosperous time of Jeroboam\'s reign. These three chapters are to be regarded as going together; and, however they may be viewed as reflecting the prophet\'s personal experience, they leave no room for doubt in regard to the national apostasy that weighed so heavily on his heart. And this, in effect, is what he says: Just as the wife, espoused to a loving husband, enjoys the protection of home and owes all her provision to her husband, so Israel, chosen by Yahweh and brought by Him into a fertile land, has received all she has from Him alone. The giving of recognition to the ba\'als for material prosperity was tantamount to a wife\'s bestowing her affection on another; the accepting of these blessings as bestowed on condition of homage rendered to the ba\'als was tantamount to the receiving of hire by an abandoned woman. This being so, the prophet, speaking in God\'s name, declares what He will do, in a series of a thrice repeated "therefore" (<a onClick="return mV(\'Hsa\',2,6,9,14);">2:6,9,14</A>), marking three stages of His discipline. First of all, changing the metaphor to that of a straying heifer, the prophet in God\'s name declares (<a onClick="return mV(\'Hsa\',2,6);">2:6</A>ff) that He will hedge up her way with thorns, so that she will not be able to reach her lovers—meaning, no doubt, that whether by drought or blight, or some national misfortune, there would be such a disturbance of the processes of Nature that the usual rites of homage to the ba\'als would prove ineffectual. The people would fail to find the "law of the god of the land" (<a onClick="return mV(\'2Ki\',17,26);">2Ki 17:26</a>). In their perplexity they would bethink themselves, begin to doubt the power of the ba\'als, and resolve to pay to Yahweh the homage they had been giving to the local gods. But this is still the same low conception of Yahweh that had led them astray. To exchange one God for another simply in the hope of enjoying material prosperity is not the service which He requires. And then comes the second "therefore" (<a onClick="return mV(\'Hsa\',2,9);">Ho 2:9</a>). Instead of allowing them to enjoy their corn and wine and oil on the terms of a mere lip allegiance or ritual service, Yahweh will take these away, will reduce Israel to her original poverty, causing all the mirth of her festival days to cease, and giving garments of mourning for festal attire. Her lovers will no longer own her, her own husband\'s hand is heavy upon her, and what remains? The third "therefore" tells us (<a onClick="return mV(\'Hsa\',2,14);">Ho 2:14</a>). Israel, now bereft of all, helpless, homeless, is at last convinced that, as her God could take away all, so it was from Him she had received all: she is shut up to His love and His mercy alone. And here the prophet\'s thoughts clothe themselves in language referring to the early betrothal period of national life. A new beginning will be made, she will again lead the wilderness life of daily dependence on God, cheerfully and joyfully she will begin a new journey, out of trouble will come a new hope, and the very recollection of the past will be a pain to her. As all the associations of the name ba\'al have been degrading, she shall think of her Lord in a different relation, not as the mere giver of material blessing, but as the husband and desire of her heart, the One Source of all good, as distinguished from one of many benefactors. In all this Hosea does not make it clear how he expected these changes to be brought about, nor do we detect any references to the political history of the time. He mentions no foreign enemy at this stage, or, at most, hints at war in a vague manner (<a onClick="return mV(\'Hsa\',2,14);">Ho 2:14</a>f). In the second chapter the thing that is emphasized is the heavy hand of God laid on the things through which Israel had been led astray, the paralyzing of Nature\'s operations, so as to cut at the root of Nature-worship; but the closing stage of the Divine discipline (<a onClick="return mV(\'Hsa\',3,\'1-\');">Hosea 3</a>), when Israel, like the wife kept in seclusion, neither enjoying the privileges of the lawful spouse nor able to follow after idols, seems to point to, and certainly was not reached till, the captivity when the people, on a foreign soil, could not exercise their ancestral worship, but yet were finally cured of idolatry.<P>The references to Judah in these chapters are not to be overlooked. Having said (<a onClick="return mV(\'Hsa\',1,6);">Ho 1:6</a>) that Israel would be utterly taken away (which seems to point to exile), the prophet adds that Judah would be saved from that fate, though not by warlike means. Farther down (<a onClick="return mV(\'Hsa\',1,11);">Ho 1:11</a>) he predicts the union of Israel and Judah under one head, and finally in <a onClick="return mV(\'Hsa\',3,\'1-\');">Ho 3</a> it is said that in the latter day the children of Israel would seek the Lord their God and David their king. Many critics suppose that <a onClick="return mV(\'Hsa\',1,10);">1:10</A>f are out of place (though they cannot find a better place for them); and not a few declare that all the references to Judah must be taken as from a later hand, the usual reason for this conclusion being that the words "disturb the connection." In the case of a writer like Hosea, however, whose transitions are so sharp and sudden, we are not safe in speaking of disturbing the connection: what may to us appear abrupt, because we are not expecting it, may have flashed across the mind of the original writer; and Hosea, in forecasting the future of his people, can scarcely be debarred from having thought of the whole nation. It was Israel as a whole that was the original bride of Yahweh, and surely therefore the united Israel would be the partaker of the final glory. As a matter of fact, Judah was at the time in better case than Israel, and the old promise to the Davidic house (<a onClick="return mV(\'2Sa\',7,16);">2Sa 7:16</a>) was deeply cherished to the end.<P>(2) <span class="noTag">Hosea 4-14</span>.<P>If it is admissible to consider <a onClick="return mV(\'Hsa\',1,\'1-\');">Hosea 1-3</a> as one related piece (though possibly the written deposit of several addresses) it is quite otherwise with <a onClick="return mV(\'Hsa\',4,\'1-\');">Ho 4-14</a>. These are, in a manner, a counterpart of the history. When the strong hand of Jeroboam was relaxed, the kingdom rapidly fell to pieces; a series of military usurpers follows with bewildering rapidity; but who can tell how much political disorder and social disintegration lie behind those brief and grim notices: So and So "conspired against him and slew him and reigned in his stead"? So with these chapters. The wail of grief, the echo of violence and excess, is heard through all, but it is very difficult to assign each lament, each reproof, each denunciation to the primary occasion that called it forth. The chapters seem like the recital of the confused, hideous dream through which the nation passed till its rude awakening by the sharp shock of the Assyrian invasion and the exile that followed. The political condition of the time was one of party strife and national impotence. Sometimes Assyria or Egypt is mentioned alone (<a onClick="return mV(\'Hsa\',5,13);">5:13</A>; <a onClick="return mV(\'Hsa\',8,9,13);">8:9,13</a>; <a onClick="return mV(\'Hsa\',9,6);">9:6</a>; <a onClick="return mV(\'Hsa\',10,6);">10:6</a>; <a onClick="return mV(\'Hsa\',14,3);">14:3</A>), at other times Assyria and Egypt together (<a onClick="return mV(\'Hsa\',7,11);">7:11</A>; <a onClick="return mV(\'Hsa\',9,3);">9:3</A>; <a onClick="return mV(\'Hsa\',11,5,11);">11:5,11</A>; <a onClick="return mV(\'Hsa\',12,1);">12:1</a>); but in such a way as to show too plainly that the spirit of self-reliance—not to speak of reliance on Yahweh—had departed from a race that was worm-eaten with social sins and rendered selfish and callous by the indulgence of every vice. These foreign powers, which figure as false refuges, are also in the view of the prophet destined to be future scourges (see <a onClick="return mV(\'Hsa\',5,13);">5:13</A>; <a onClick="return mV(\'Hsa\',8,9);">8:9</a>f; <a onClick="return mV(\'Hsa\',7,11);">7:11</A>; <a onClick="return mV(\'Hsa\',12,1);">12:1</A>); and we know, from the Book of Kings and also from the Assyrian monuments, how much the kings of Israel at this time were at the mercy of the great conquering empires of the East. Such passages as speak of Assyria and Egypt in the same breath may point to the rival policies which were in vogue in the Northern Kingdom (as they appeared also somewhat later in Judah) of making alliances with one or other of these great rival powers. It was in fact the Egyptianizing policy of Hoshea that finally occasioned the ruin of the kingdom (<a onClick="return mV(\'2Ki\',17,4);">2Ki 17:4</a>). Thus it is that, in the last chapter, when the prophet indulges in hope no more mixed with boding fear, he puts into the mouth of repentant Ephraim the words: "Assyria shall not save us; we will not ride upon horses" (<a onClick="return mV(\'Hsa\',14,3);">Ho 14:3</a>), thus alluding to the two foreign powers between which Israel had lost its independence.<P>It is not possible to give a satisfactory analysis of the chapters under consideration. They are not marked off, as certain sections of other prophetical books are, by headings or refrains, nor are the references to current events sufficiently clear to enable us to assign different parts to different times, nor, in fine, is the matter so distinctly laid out that we can arrange the book under subjects treated. Most expositors accordingly content themselves with indicating the chief topics or lines of thought, and arranging the chapters according to the tone pervading them.<P>Keil, e.g., would divide all these chapters into three great sections, each forming a kind of prophetical cycle, in which the three great prophetic tones of reproof, threatening, and promise, are heard in succession. His first section embraces <a onClick="return mV(\'Hsa\',4,\'1-\);">Hosea 4 to 6:3</a>, ending with the gracious promise: "Come, and let us return unto Yahweh," etc. The second section, <a onClick="return mV(\'Hsa\',6,\'4-\);">6:4 to 11:11</A>, ends with the promise: "They shall come trembling as a bird...and I will make them to dwell in their houses, saith Yahweh." The third section, <a onClick="return mV(\'Hsa\',11,\'12-\);">11:12 to 14:9</A>, ends: "Take with you words, and return unto Yahweh," etc. Ewald\'s arrangement proceeds on the idea that the whole book consists of one narrative piece (chapters <a onClick="return mV(\'Hsa\',1,\'1-\);">1-3</A>) and one long address (chapters <a onClick="return mV(\'Hsa\',4,\'1-\);">4-14</A>), which, however, is marked off by resting points into smaller sections or addresses. The progress of thought is marked by the three great items of arraignment, punishment, and consolation. Thus: from <a onClick="return mV(\'Hsa\',4,\'1-\);">4:1-6:11</A> there is arraignment; from <a onClick="return mV(\'Hsa\',6,\'11-\);">6:11 to 9:9</A> punishment, and from <a onClick="return mV(\'Hsa\',9,\'10-\);">9:10-14:10</A> exhortation and comfort. Driver says of chapters <a onClick="return mV(\'Hsa\',4,\'1-\);">4-14</A>: "These chapters consist of a series of discourses, a summary arranged probably by the prophet himself at the close of his ministry, of the prophecies delivered by him in the years following the death of Jeroboam II. Though the argument is not continuous, or systematically developed, they may be divided into three sections:<P>(a) chapters <a onClick="return mV(\'Hsa\',4,\'1-\);">4-8</A> in which the thought of Israel\'s guilt predominates;<P>(b) chapter <a onClick="return mV(\'Hsa\',9,\'1-\);">9-11:11</A>, in which the prevailing thought is that of Israel\'s punishment;<P>(c) <a onClick="return mV(\'Hsa\',11,\'12-\);">11:12 through Ho 14</a> in which these two lines of thought are both continued (chapters <a onClick="return mV(\'Hsa\',12,\'1-\);">12</A>, <a onClick="return mV(\'Hsa\',13,\'1-\);">13</A>), but are followed (in chapter <a onClick="return mV(\'Hsa\',14,\'1-\);">14</a>) by a glance at the brighter future which may ensue provided Israel repents."<P>A. B. Davidson, after mentioning the proposed analyses of Ewald and Driver, adds: "But in truth the passage is scarcely divisible; it consists of multitude of variations all executed on one theme, Israel\'s apostasy or unfaithfulness to her God. This unfaithfulness is a condition of the mind, a \'spirit of whoredoms,\' and is revealed in all the aspects of Israel\'s life, though particularly in three things:<P>(1) the cult, which, though ostensibly service of Yahweh, is in truth worship of a being altogether different from Him;<P>(2) the internal political disorders, the changes of dynasty, all of which have been effected with no thought of Yahweh in the people\'s minds; and<P>(3) the foreign politics, the making of covenants with Egypt and Assyria, in the hope that they might heal the internal hurt of the people, instead of relying on Yahweh their God.<P>The three things," he adds, "are not independent; the one leads to the other. The fundamental evil is that there is no knowledge of God in the land, no true conception of Deity. He is thought of as a Nature-god, and His conception exercises no restraint on the passions or life of the people: hence, the social immoralities, and the furious struggles of rival factions, and these again lead to the appeal for foreign intervention."<P>Some expositors, however (e.g. Maurer, Hitzig, Delitzsch and Volck), recognizing what they consider as direct references or brief allusions to certain outstanding events in the history, perceive a chronological order in the chapters. Volck, who has tempted a full analysis on this line (PRE2) thinks that chapters <a onClick="return mV(\'Hsa\',4,\'1-\);">4-14</a> arrange themselves into 6 consecutive sections as follows:<P>(1) chapter <a onClick="return mV(\'Hsa\',4,\'1-\);">4</A> constitutes a section by itself, determined by the introductory words "Hear the word of Yahweh" (<a onClick="return mV(\'Hsa\',4,1);">4:1</A>), and a similar call at the beginning of chapter <a onClick="return mV(\'Hsa\',5,\'1-\);">5</A>. He assigns this chapter to the reign of Zechariah, as a description of the low condition to which the nation had fallen, the priests, the leaders, being involved in the guilt and reproof (<a onClick="return mV(\'Hsa\',5,6);">Ho 5:6</a>).<P>(2) The second section extends from <a onClick="return mV(\'Hsa\',5,\'1-\');">Ho 5:1</a> to <a onClick="return mV(\'Hsa\',6,\'1-3\');">6:3</a>, and is addressed directly to the priests and the royal house, who ought to have been guides but were snares. The prophet in the spirit sees Divine judgment already breaking over the devoted land (<a onClick="return mV(\'Hsa\',5,8);">5:8</A>). This prophecy, which Hitzig referred to the time of Zechariah, and Maurer to the reign of Pekah, is assigned by Volck to the one month\'s reign of Shallum, on the ground of <a onClick="return mV(\'Hsa\',5,7);">Ho 5:7</a>: "Now shall a month (the King James Version and the Revised Version margin, but the Revised Version (British and American) "the new moon") devour them." It is by inference from this that Volck puts <a onClick="return mV(\'Hsa\',4,\'1-\');">Ho 4</a> in the preceding reign of Zechariah.<P>(3) The third section, <a onClick="return mV(\'Hsa\',6,\'4-\');">Ho 6:4</a>-<a onClick="return mV(\'Hsa\',7,\'1-16\');">7:16</a>, is marked off by the new beginning made at <a onClick="return mV(\'Hsa\',8,\'1-\);">8:1</A>: "Set the trumpet to thy mouth." The passage which determines its date <span class="noTag">is</span> <a onClick="return mV(\'Hsa\',7,7);">7:7</a>: "All their kings are fallen," which, agreeing with Hitzig, he thinks could not have been said after the fall of one king, Zechariah, and so he assigns it to the beginning of the reign of Menahem who killed Shallum.<P>(4) The next halting place, giving a fourth section, is at <a onClick="return mV(\'Hsa\',9,9);">Ho 9:9</a>, at the end of which there is a break in the Massoretic Text, and a new subject begins. Accordingly, the section embraces <a onClick="return mV(\'Hsa\',8,\'1-\);">8:1</A> to <a onClick="return mV(\'Hsa\',9,\'1-9\');">9:9</A>, and Volck, agreeing with Hitzig, assigns it to the reign of Menahem, on the ground of <a onClick="return mV(\'Hsa\',8,4);">8:4</A>: "They have set up kings, but not by me," referring to the support given to Menahem by the king of Assyria (<a onClick="return mV(\'2Ki\',15,19);">2Ki 15:19</a>).<P>(5) The fifth section extends from <a onClick="return mV(\'Hsa\',9,\'10-\');">9:10 to 11:11</A>, and is marked by the peculiarity that the prophet three times refers to the early history of Israel (<a onClick="return mV(\'Hsa\',9,10);">9:10</A>; <a onClick="return mV(\'Hsa\',10,1);">10:1</a>; <a onClick="return mV(\'Hsa\',11,1);">11:1</A>). Identifying Shalman in <a onClick="return mV(\'Hsa\',10,14);">10:14</a> with Shalmaneser, Volck refers the section to the opening years of the reign of Hoshea, against whom (as stated in <a onClick="return mV(\'2Ki\',17,3);">2Ki 17:3</a>) Shalmaneser came up and Hoshea became his servant.<P>(6) Lastly there is a sixth section, extending from <a onClick="return mV(\'Hsa\',12,\'1-\');">Ho 12:1</a> to the end, which looks to the future recovery of the people (<a onClick="return mV(\'Hsa\',13,14);">13:14</A>) and closes with words of gracious promise. This portion also Volck assigns to the reign of Hoshea, just as the ruin of Samaria was impending, and there was no prospect of any earthly hope. In this way Volck thinks that the statement in the superscription of the Book of Hosea is confirmed, and that we have before us, in chronological order if not in precisely their original oral form, the utterances of the prophet during his ministry. Ewald also was strongly of opinion that the book (in its second part at least) has come down to us substantially in the form in which the prophet himself left it.<P>The impression one receives from this whole section is one of sadness, for the prevailing tone is one of denunciation and doom. And yet Hosea is not a prophet of despair; and, in fact, he bursts forth into hope just at the point where, humanly speaking, there is no ground of hope. But this hope is produced, not by what he sees in the condition of the people: it is enkindled and sustained by his confident faith in the unfailing love of Yahweh. And so he ends on theme on which he began, the love of God prevailing over man\'s sin.<P>4. Testimony to Earlier History:<P>The references in Hosea to the earlier period of history are valuable, seeing that we know his date, and that the dates of the books recording that history are so much in dispute. These references are particularly valuable from the way in which they occur; for it is the manner of the prophet to introduce them indirectly, and allusively, without dwelling on particulars. Thus every single reference can be understood only by assuming its implications; and, taken together, they do not merely amount to a number of isolated testimonies to single events, but are rather dissevered links of a continuous chain of history. For they do not occur by way of rhetorical illustration of some theme that may be in hand, they are of the very essence of the prophet\'s address. The events of the past are, in the prophet\'s view, so many elements in the arraignment or threatening, or whatever it may be that is the subject of address for the moment: in a word, the whole history is regarded by him, not as a series of episodes, strung together in a collection of popular stories, but a course of Divine discipline with a moral and religious significance, and recorded or referred to for a high purpose. There is this also to be remembered: that, in referring briefly and by way of allusion to past events, the prophet is taking for granted that his hearers understand what he is referring to, and will not call in question the facts to which he alludes. This implies that the mass of the people, even in degenerate Israel, were well acquainted with such incidents or episodes as the prophet introduces into his discourses, as well as the links which were necessary to bind them into a connected whole. It is necessary to bear all this in mind in forming an estimate of the historical value of other books. It seems to be taken by many modern writers as certain that those parts of the Pentateuch (JE) which deal with the earlier history were not written till a comparatively short time before Hosea. It is plain, however, that the accounts must be of much earlier date, before they could have become, in an age when books could not have been numerous, the general possession of the national consciousness. Further, the homiletic manner in which Hosea handles these ancient stories makes one suspicious of the modern theory that a number of popular stories were supplied with didactic "frameworks" by later Deuteronomic or other "redactors," and makes it more probable that these accounts were invested with a moral and religious meaning from the beginning. With these considerations in mind, and particularly in view of the use he makes of his references, it is interesting to note the wide range of the prophet\'s historical survey. If we read with the Revised Version (British and American) "Adam" for "men" (the King James Version <a onClick="return mV(\'Hsa\',6,7);">Ho 6:7</a>), we have a clear allusion to the Fall, implying in its connection the view which, as all admit, Hosea held of the religious history of his people as a declension and not an upward evolution. This view is more clearly brought out in the reference to the period of the exodus and the desert life (<a onClick="return mV(\'Hsa\',2,15);">2:15</A>; <a onClick="return mV(\'Hsa\',9,10);">9:10</A>; <a onClick="return mV(\'Hsa\',11,1);">11:1</A>). Equally suggestive are the allusions to the patriarchal history, as the references to Admah and\' Zeboiim (<a onClick="return mV(\'Hsa\',11,8);">11:8</A>), and the repeated references to the weak and the strong points in the character of Jacob (<a onClick="return mV(\'Hsa\',12,3,12);">12:3,12</A>). Repeatedly he declares that Yahweh is the God of Israel "from the land of Egypt" (<a onClick="return mV(\'Hsa\',12,9);">12:9</A>; <a onClick="return mV(\'Hsa\',13,4);">13:4</A>), alludes to the sin of Achan and the valley of Achor (<a onClick="return mV(\'Hsa\',2,15);">2:15</A>), asserts that God had in time past "spoken unto the prophets" (<a onClick="return mV(\'Hsa\',12,10);">12:10</A>), "hewed" His people by prophets (<a onClick="return mV(\'Hsa\',6,5);">6:5</a>), and by a prophet brought His people out of Egypt (<a onClick="return mV(\'Hsa\',12,13);">12:13</a>). There are also references to incidents nearer to the prophet\'s time, some of them not very clear (<a onClick="return mV(\'Hsa\',1,4);">1:4</a>; <a onClick="return mV(\'Hsa\',5,1);">5:1</a>; <a onClick="return mV(\'Hsa\',9,5,15);">9:5,15</A>; <a onClick="return mV(\'Hsa\',10,9);">10:9</a>); and if, as seems probable, "the sin of Israel" (<a onClick="return mV(\'Hsa\',10,8);">10:8</a>) refers to the schism of the ten tribes, the prominence given to the Davidic kingship, which, along with the references to Judah, some critics reject on merely subjective grounds, is quite intelligible (<a onClick="return mV(\'Hsa\',3,5);">3:5</a>; <a onClick="return mV(\'Hsa\',4,15);">4:15</a>).<P>5. Testimony to the Law:<P>We do not expect to find in a prophetic writing the same frequency of reference to the law as to the history; for it is of the essence of prophecy to appeal to history and to interpret it. Of course, the moral and social aspects of the law are as much the province of the prophet as of the priest; but the ceremonial part of the law, which was under the care of the priests, though it was designed to be the expression of the same ideas that lay at the foundation of prophecy, is mainly touched upon by the prophets when, as was too frequently the case, it ceased to express those ideas and became an offense. The words of the prophets on this subject, when fairly interpreted, are not opposed to law in any of its authorized forms, but only to its abuses; and there are expressions and allusions in Hosea, although he spoke to the Northern Kingdom, where from the time of the schism there had been a wide departure from the authorized law, which recognize its ancient existence and its Divine sanction. The much-debated passage in Ho (<a onClick="return mV(\'Hsa\',8,12);">8:12</a>), "Though I write for him my law in ten thousand precepts" (the Revised Version (British and American) or the Revised Version margin "I wrote for him the ten thousand things of my law"), on any understanding of the words or with any reasonable emendation of the text (for which see the comm.), points to written law, and that of considerable compass, and seems hardly consistent with the supposition that in the prophet\'s time the whole of the written law was confined to a few chapters in Exodus, the so-called Book of the Covenant. And the very next verse (<a onClick="return mV(\'Hsa\',8,13);">Ho 8:13</a>), "As for the sacrifices of mine offerings, they sacrifice flesh and eat it; but Yahweh accepteth them not," is at once an acknowledgment of the Divine institution of sacrifice, and an illustration of the kind of opposition the prophets entertained to sacrificial service as it was practiced. So when it is said, "I will also cause all her mirth to cease, her feasts, her new moons, and her sabbaths, and all her solemn assemblies" (<a onClick="return mV(\'Hsa\',2,11);">Ho 2:11</a>; compare <a onClick="return mV(\'Hsa\',9,5);">9:5</A>), the reference, as the context shows, is to a deprivation of what were national distinctive privileges; and the allusions to transgressions and trespasses against the law (<a onClick="return mV(\'Hsa\',8,1);">Ho 8:1</a>; compare <a onClick="return mV(\'Deu\',17,2);">De 17:2</a>) point in the same direction. We have a plain reference to the Feast of Tabernacles (<a onClick="return mV(\'Hsa\',12,9);">Ho 12:9</a>): "I will yet again make thee to dwell in tents, as in the days of the solemn feast" (compare <a onClick="return mV(\'Lev\',23,\'39-43\');">Le 23:39-43</a>); and there are phrases which are either in the express language of the law-books or evident allusions to them, as "Thy people are as they that strive with the priest" (<a onClick="return mV(\'Hsa\',4,4);">Ho 4:4</a>; compare <a onClick="return mV(\'Deu\',17,12);">De 17:12</a>); "The princes of Judah are like them that remove the landmark" (<a onClick="return mV(\'Hsa\',5,10);">Ho 5:10</a>; compare <a onClick="return mV(\'Deu\',19,14);">De 19:14</a>); "Their sacrifices shall be unto them as the bread of mourners" (<a onClick="return mV(\'Hsa\',9,4);">Ho 9:4</a>; compare <a onClick="return mV(\'Deu\',26,14);">De 26:14</a>); "They (the priests) feed on the sin of my people" (<a onClick="return mV(\'Hsa\',4,8);">Ho 4:8</a>; compare <a onClick="return mV(\'Lev\',6,25);">Le 6:25</a>f; <a onClick="return mV(\'Hsa\',10,17);">10:17</A>). In one verse the prophet combines the fundamental fact in the nation\'s history and the fundamental principle of the law: "I am Yahweh thy God from the land of Egypt; and thou shalt know no god but me" (<a onClick="return mV(\'Hsa\',13,4);">Ho 13:4</a>; compare <a onClick="return mV(\'Exd\',20,3);">Ex 20:3</a>).<P>6. Affinity with Deuteronomy:<P>It is, however, with the Book of Deuteronomy more than with any other portion of the Pentateuch that the Book of Hosea shows affinity; and the resemblances here are so striking, that the critics who hold to the late date of Deuteronomy speak of the author of that book as "the spiritual heir of Hosea" (Driver, Commentary on Deuteronomy, Intro, xxvii), or of Hosea as "the great spiritual predecessor of the Deuteronomist" (Cheyne, Jeremiah, His Life and Times, 66). The resemblance is seen, not only in the homiletical manner in which historical events are treated, but chiefly in the great underlying principles implied or insisted upon in both books. The choice of Israel to be a peculiar people is the fundamental note in both (<a onClick="return mV(\'Deu\',4,37);">De 4:37</a>; <a onClick="return mV(\'Deu\',7,6);">7:6</a>; <a onClick="return mV(\'Deu\',10,15);">10:15</a>; <a onClick="return mV(\'Deu\',14,2);">14:2</a>; <a onClick="return mV(\'Deu\',26,18);">26:18</a>; <a onClick="return mV(\'Hsa\',12,9);">Ho 12:9</a>; <a onClick="return mV(\'Hsa\',13,4);">13:4</a>). God\'s tender care and fatherly discipline are central ideas in both (<a onClick="return mV(\'Deu\',8,2,3,5,16);">De 8:2-3, 5, 16</a>; <a onClick="return mV(\'Hsa\',9,15);">Ho 9:15</a>; <a onClick="return mV(\'Hsa\',11,\'1-4\');">11:1-4</a>; <a onClick="return mV(\'Hsa\',14,4);">14:4</a>); and, conversely, the supreme duty of love to God, or reproof of the want of it, is everywhere emphasized (<a onClick="return mV(\'Deu\',6,5);">De 6:5</a>; <a onClick="return mV(\'Deu\',10,12);">10:12</a>; <a onClick="return mV(\'Deu\',11,1,13,22);">11:1, 13, 22</a>; <a onClick="return mV(\'Deu\',13,3);">13:3</a>; <a onClick="return mV(\'Deu\',19,9);">19:9</a>; <a onClick="return mV(\'Deu\',30,6,16,20);">30:6, 16, 20</a>; <a onClick="return mV(\'Hsa\',4,1);">Ho 4:1</a>; <a onClick="return mV(\'Hsa\',6,4,6);">6:4, 6</a>). Now, when points of resemblance are found in two different books, it is not always easy to say on merely literary grounds which has the claim to priority. But it does seem remarkable, on the one hand, that a writer so late as the time of Josiah should take his keynote from one of the very earliest of the writing prophets two centuries before him; and, on the other hand, that these so-called "prophetic ideas," so suitable to the time of \'the kindness of youth and love of espousals\' (<a onClick="return mV(\'Jer\',2,2);">Jer 2:2</a>), should have found no place in the mind of that "prophet" by whom the Lord brought Israel out of Egypt (<a onClick="return mV(\'Hsa\',12,13);">Ho 12:13</a>). The ministry of Moses was to enforce the duty of whole-hearted allegiance to the God who had made special choice of Israel and claimed them as His own. Nor was Hosea the first, as it is sometimes alleged, to represent the religious history of Israel as a defection. Moses had experience of their apostasy under the very shadow of Sinai, and all his life long had to bear with a stiff-necked and rebellious people. Then, again, if these "Deuteronomic" ideas are found so clearly expressed in Hosea, why should it be necessary to postulate a late Deuteronomist going back upon older books, and editing and supplementing them with Deuteronomic matter? If Moses sustained anything like the function which all tradition assigned to him, and if, as all confess, he was the instrument of molding the tribes into one people, those addresses contained in the Book of Deuteronomy are precisely in the tone which would be adopted by a great leader in taking farewell of the people. And, if he did
