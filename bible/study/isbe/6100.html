isbe = [];

isbe[6101]='Mite`mit (lepton): The smallest copper or bronze coin current among the Jews. They were first struck by the Maccabean princes with Hebrew legends, and afterward by the Herods and the Roman procurators with Greek legends. The "widow\'s mite" mentioned in <a onClick="return mV(\'Mar\',12,42);">Mr 12:42</a> and <a onClick="return mV(\'Luk\',21,2);">Lu 21:2</a> was probably of the first kind, since those with Greek legends were regarded as unlawful in the temple service. According to Mark, the lepton was only half a kodrantes (Latin quadrans), which would indicate a value of about one-fourth of a cent or half an English farthing.`<a href="./study/isbe/search.html?string=MONEY">MONEY</a>`138';
isbe[6102]='Mithkah`mith\'-ka (mithqah "sweetness"; the King James Version Mithcah): Name given owing to sweetness of pasture or water. A desert camp of the Israelites between Terah and Hashmonah (<a onClick="return mV(\'Num\',33,28);">Nu 33:28</a>f).`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[6103]='Mithnite`mith\'-nit (ha-mithni): Designation of Jehoshaphat, one of David\'s officers (<a onClick="return mV(\'1Ch\',11,43);">1Ch 11:43</a>).``1';
isbe[6104]='Mithradates`mith-ra-da\'-tez (Codex Alexandrinus Mithradates; Codex Vaticanus Mithridates; the King James Version Mithridates):<P>(1) The treasurer of Cyrus to whom the king committed the vessels which had been taken from the temple and who delivered them to the governor, Sanabassar (1Esdras 2:11 equals "Mithredath" of <a onClick="return mV(\'Ezr\',1,8);">Ezr 1:8</a>).<P>(2) Apparently another person of the same name—one of the commissioners stationed in Samaria who wrote a letter to Artaxerxes persuading him to put a stop to the rebuilding of Jerusalem (1Esdras 2:16 equals "Mithredath" of <a onClick="return mV(\'Ezr\',4,7);">Ezr 4:7</a>).``5';
isbe[6105]='Mithredath`mith\'-re-dath (mithredhath; Persian equals "gift of Mithra" or "consecrated to Mithra"):<P>(1) The Persian treasurer through whom Cyrus restored the sacred vessels to the returning Jewish exiles (<a onClick="return mV(\'Ezr\',1,8);">Ezr 1:8</a>).<P>(2) A Persian, perhaps an official, who was associated with Bishlam and Tabeel in corresponding with Artaxerxes concerning the restoration of Jerusalem (<a onClick="return mV(\'Ezr\',4,7);">Ezr 4:7</a>). In 1Esdras 2:11,16, the name is written <a href="./study/isbe/search.html?string=MITHRADATES">MITHRADATES</a> (which see).``1';
isbe[6106]='Mitre`mi\'-ter In the King James Version this word renders two Hebrew words, both of which, however, come from the same stem, namely, tsanaph, "to coil" or "to wrap round." In <a onClick="return mV(\'Exd\',28,\'1-\');">Ex 28</a>, a mitre (the Revised Version margin "turban") is enumerated among Aaron\'s articles of dress, which were to be made by tailors of recognized skill. On the forefront of the mitre was a "plate of pure gold" with the words "Holy to Yahweh" (i.e. consecrated to Yahweh) inscribed upon it. This gold plate was fastened to the mitre by a blue ribbon. The material of the mitre was fine linen or silk. The word for the headtire (the King James Version "bonnet") of the ordinary priest was a different word. Ezekiel uses the word in connection with Zedekiah (<a onClick="return mV(\'Eze\',21,26);">21:26</A>); the prophet associated regal and priestly functions with the throne. It is possible, however, that the two sentences—"remove the mitre," and "take off the crown"—refer to the degradation of the priesthood and of the throne which the downfall of Jerusalem will involve. The Septuagint varies between kidaris and mitra, the former word being used in Sirach 45:12.``100';
isbe[6107]='Mitylene`mit-i-le\'-ne, mit-i-lye\'-nye (Mitulene, or Mutilene as usually on coins):<P>1. Importance and History:<P>In antiquity the most important city of the Asiatic Aeolians and of the island of Lesbos. It had 2 harbors and strong fortresses. The city was noted for its high culture and for its zeal for art and science from the earliest times. The island, under the leadership of Mitylene, revolted in 428 BC from the Athenian confederacy. The city was besieged by the Athenians and finally taken. The inhabitants of Mitylene were treated with great severity; the walls were dismantled, and the city was deprived of its power on the sea. In the time of Alexander the Great, Mitylene suffered most through the Persians, and later by the occupation of the Macedonians, but afterward regained its power and prosperity, and still later was favored by the Roman emperors, being made a free city by Pompey.<P>In the Middle Ages, the name Mitylene was applied to the whole island. The present capital, often called simply Castro, has a large castle built on the site of the ancient acropolis (in 1373). The city was conquered by the Turks in 1462. It contains 14 mosques, 7 churches, and has a population of about 15,000.<P>2. Paul\'s Visit:<P>On his third missionary journey, Paul traveled to the Hellespont from Philippi, thence through the Troad by land to Assos on the southern side—where extensive excavations were carried on in 1881 by an American archaeological expedition—thence by ship to Mitylene (<a onClick="return mV(\'Act\',20,14);">Ac 20:14</a>), where he spent the night. Leaving Lesbos, he sailed southward to a point opposite the island of Chios (<a onClick="return mV(\'Act\',20,15);">Ac 20:15</a>). There is no record that a Christian church had been established in Mitylene at this time.<P>LITERATURE.<P>Tozer, Islands of the Aegean,121,134f; 136; Ramsay, Paul the Traveler, 291ff.``71';
isbe[6108]='Mixed, Multitude`mikst, mul\'-ti-tud.`<a href="./study/isbe/search.html?string=MINGLED+PEOPLE">MINGLED PEOPLE</a>`1';
isbe[6109]='Mizar, the Hill`mi\'-zar, (har mits\'ar; oros mikros): The name of a mountain found only in <a onClick="return mV(\'Psa\',42,6);">Ps 42:6</a>; "I remember thee from the land of Jordan, and the Hermons, from the hill Mizar." The term may be taken as an appellative meaning "littleness" and the phrase mehar mits\'ar would then mean "from the little mountain," i.e. the little mountain of Zion. Some scholars think that the "m" in mehar may have arisen from dittography, and that we should read, "from the land of Jordan, and the Hermons, O thou little mountain (of Zion)." G.A. Smith discusses the question in a note (HGHL, 477). He suggests that certain names found in the district (za\'ura, wady za\'arah, and Khirbet Mazara) may be a reminiscence of the name of a hill in the district called Mits\'ar; and surly none other would have been put by the Psalmist in apposition to the Hermons. Cheyne says: "To me this appendage to Hermonim seems a poetic loss. Unless the little mountain has a symbolic meaning I could wish it away." I cannot see this: the symbolic meanings suggested for Hermonim and Mits\'ar are all forced, and even if we got a natural one, it would be out of place after the literal land of Jordan. To employ all as proper names is suitable to a lyric. No identification is at present possible.``54';
isbe[6110]='Mizpah; Mizpeh`miz\'-pa, miz\'-pe: This name is pointed both ways in the Hebrew, and is found usually with the article. The meaning seems to be "outlook" or "watchtower." It is natural, therefore, to look for the places so named in high positions commanding wide prospects.<P>(1) (ha-mitspah (<a onClick="return mV(\'Gen\',31,49);">Ge 31:49</a>; <a onClick="return mV(\'Jdg\',11,11,34);">Jud 11:11,34</a>), mitspah (<a onClick="return mV(\'Hsa\',5,1);">Ho 5:1</a>), mitspeh ghil\'adh (<a onClick="return mV(\'Jdg\',11,29);">Jud 11:29</a>); Massepha, ten skopian, and other forms): It seems probable that the same place is intended in all these passages, and that it is identical with Ramath-mizpeh of <a onClick="return mV(\'Jos\',13,26);">Jos 13:26</a>. It is the place where Jacob and Laban parted in Mt. Gilead; consequently it lay to the north of Mahanaim. Here was the home of Jephthah, to which he returned after the defeat of the Aremonites, only to realize how his rash vow had brought desolation to his house. It was taken by Judas Maccabeus, who destroyed the inhabitants and burned the city (1Macc 5:35). Jerash, and Kal\'at er-Rabad; but these seem all to lie south of any possible site for Mahanaim. A ruined site was discovered by Dr. Schumacher (M und NPDV, 1897, 86), with the name Macfa, which is just the Arabic equivalent of the Hebrew Mitspah. It lies some distance to the northwest of Jerash and claims consideration in any attempt to fix the site of Mizpah.<P>(2) (\'erets ha-mitspah (<a onClick="return mV(\'Jos\',11,3);">Jos 11:3</a>), biq\'ath mitspeh (verse <a onClick="return mV(\'Jos\',11,8);">8</A>); Masseuman, Massephath, and other forms): The "land of Mizpah" and the "valley of Mizpah" may be taken as applying to the same district. It lay on the southwest slopes of Hermon northeast of the Waters of Merom. The site must be looked for on one of the heights in the region indicated, from which a wide view is obtained. Mutallah, a Druze village standing on a hill to the north of \'Abil and east of Nahr el-Chasbany, was suggested by Robinson. The present writer agrees with Buhl (GAP, 240) that the ancient castle above Banias, Kal\'at ec-Cubeibeh, occupies a more likely position.<P>(3) (mitspeh; Maspha): A town in the Shephelah of Judah named with Dilan, Joktheel and Lachish (Tell el-Hesy). Eusebius, Onomasticon mentions a Macfa in the neighborhood of Eleutheropolis, to the north. The identification proposed by Van de Velde and Guerin would suit this description. They would locate Mizeph at Tell ec-Cafiyeh, about 7 1/2 miles northwest of Beit Jibrin, "a conspicuous hill with a glittering white cliff rising like an isolated block above the adjacent country" (PEFS, 1903, 276). Many identify this site with Gath, but the name and character of the place point rather to identification with Mizpeh, the Blanche Guarde or Alba Specula of the Middle Ages.<P>(4) (ha-mitspah; Massema, Maspha): A town in the territory of Benjamin (<a onClick="return mV(\'Jos\',18,26);">Jos 18:26</a>). Hither came the men of Israel to deal with the Benjamites after the outrage on the Levite\'s concubine (<a onClick="return mV(\'Jdg\',20,1,3);">Jud 20:1,3</a>; <a onClick="return mV(\'Jdg\',21,1,5,8);">21:1,5,8</a>). At Mizpah, Samuel gathered his countrymen. While there crying to God in their distress, they were attacked by the Philistines, whom they defeated with great slaughter (<a onClick="return mV(\'1Sa\',7,5);">1Sa 7:5</a>, etc.). Here also Saul, the son of Kish, was chosen king, after which Samuel told the people the "manner of the kingdom" (<a onClick="return mV(\'1Sa\',10,17);">10:17</A>, etc.). Mizpah was fortified by Asa, king of Judah, with materials which Baasha, king of Israel, had used to fortify Ramah (<a onClick="return mV(\'1Ki\',15,22);">1Ki 15:22</a>; <a onClick="return mV(\'2Ch\',16,6);">2Ch 16:6</a>). When Nebuchadnezzar captured Jerusalem and made Gedaliah, the son of Ahikam, governor of the remnant of the people left in the land of Judah, the governor\'s residence was fixed at Mizpah (<a onClick="return mV(\'2Ki\',25,23);">2Ki 25:23</a>). Here he was joined by Jeremiah, whom Nebuzaradan, captain of the Babylonian guard, had set free. At Mizpah, Ishmael, son of Nathaiah, treacherously slew Gedaliah and many who were with him. Two days later he murdered a company of pilgrims, throwing their dead bodies into the great cistern which Asa had made when strengthening the place against possible attack by Baasha of Samaria. He then made prisoners of the people, including the king\'s daughters, and attempted to convey them away to the Ammonites, an attempt that was frustrated by Johanan, son of Kareah (<a onClick="return mV(\'Jer\',40,\'1-\');">Jer 40</a>; <a onClick="return mV(\'Jer\',41,\'1-\');">41</a>). Mizpah was the scene of memorable assembly in a day of sore anxiety for Judah, when Judas Maccabeus called the warriors of Judah together for counsel and prayer (1Macc 3:46). From this passage we also learn that the place was an ancient sanctuary—"for in Mizpah there was a place of prayer aforetime for Israel."<P>It has been proposed to identify Mizpah with Tell Nasbeh, a site on the watershed south of Bireh. The Abbe Raboisson established the fact that Jerusalem can be seen from this point. In this respect it agrees with Maundeville\'s description. "It is a very fair and delicious place, and it is called Mt. Joy because it gives joy to pilgrims\' hearts, for from that place men first see Jerusalem." But <a onClick="return mV(\'Jer\',41,10);">Jer 41:10</a> may be taken as decisive against this identification. Ishmael departed to go east. From Tell Nasbeh this would never have brought him to the great waters that are in Gibeon (PEFS, 1898, 169, 251; 1903, 267). A more probable identification is with Neby Samwil, a village on high ground 4 1/2 miles northwest of Jerusalem, the traditional burying-place of Samuel. It <span class="noTag">is</span> 2,935 ft. above sea-level, and 500 ft. higher than the surrounding land. Here the pilgrims coming up by way of Beth-heron from Jaffa, the ancient route, first saw the Holy City. The mosque of the village was formerly a church, dating from Crusading times; and here the tomb of Samuel is shown. If this is the ancient Mizpah, a very slight detour to the north would bring Ishmael to the great waters that are in Gibeon, el-Jib (Gibeon) being only a mile and a quarter distant.<P>(5) (mitspeh mo\'abh "Mizpeh of Moab"; Masepha): A town in Moab to which David took his parents for safety during Saul\'s pursuit of him (<a onClick="return mV(\'1Sa\',22,3);">1Sa 22:3</a>). It is possibly to be identified with Kir-moab, the modern Kerak, whither David would naturally go to interview the king. But there is no certainty. Possibly we should read "Mizpah" instead of "the hold" in <a onClick="return mV(\'1Sa\',22,5);">1Sa 22:5</a>.<P>(6) In <a onClick="return mV(\'2Ch\',20,24);">2Ch 20:24</a>, probably we should read "Mizpah" instead of "watch-tower": ha-mitspeh la-midhbar would then point to a Mizpeh of the Wilderness to be sought in the district of Tekoa (<a onClick="return mV(\'2Ch\',20,20);">20:20</A>).``54';
isbe[6111]='Mizpar`miz\'-par.`<a href="./study/isbe/search.html?string=MISPAR">MISPAR</a>`1';
isbe[6112]='Mizraim`miz\'-ra-im (mitsrayim):<P>(1) A son of Ham, and ancestor of various peoples, Ludim, Anamim, etc. (<a onClick="return mV(\'Gen\',10,6,13);">Ge 10:6,13</a>; <a onClick="return mV(\'1Ch\',1,8,11);">1Ch 1:8,11</a>).<P>See <a href="./study/isbe/search.html?string=TABLE+OF+NATIONS">TABLE OF NATIONS</a>.<P>(2) The name of Egypt.<P>See <a href="./study/isbe/search.html?string=EGYPT">EGYPT</a>.<P>The land of Ham.—cham, was another name for the land of Egypt. It occurs only in <a onClick="return mV(\'Psa\',105,23,27);">Ps 105:23,27</a>; <a onClick="return mV(\'Psa\',106,22);">106:22</a>; <a onClick="return mV(\'Psa\',78,51);">Ps 78:51</a> probably refers to the land of Ham, though it may refer to the children of Ham. The origin and significance of this name are involved in much obscurity. Two improbable etymologies and one probable etymology for Ham as a name of Egypt have been proposed, and the improbable ones very much urged:<P>(1) Ham is often thought to be a Hebrew appropriation of the Egyptian name "Kemt," a name for the "black land" as distinguished from "desherr," the red land of the desert which surrounded it. This etymology is very attractive, but phonetically very improbable to say the least.<P>(2) Ham has sometimes been connected directly with cham, the second son of Noah whose descendants under the name Mitsraim occupied a part of northeastern Africa. But as there is no trace of this name among the Egyptians and no use of it in the historical books of the Old Testament, this can hardly be said to be a probable derivation of the word.<P>(3) There is a third proposed etymology for Ham which connects it ultimately but indirectly with Ham, the second son of Noah. Some of the earliest sculptures yet found in Egypt represent the god Min (Menu; compare Koptos by Professor Petrie). This god seems also to have been called Khem, a very exact Egyptian equivalent for Cham, Ham, the second son of Noah and the ancestor of the Hamitic people of Egypt. That Ham the son of Noah should be deified in the Egyptian pantheon is not surprising. The sensuality of this god Min or Khem also accords well with the reputation for licentiousness borne by Ham the son of Noah. These facts suggest very strongly a trace in Egyptian mythology of the actual history of the movements of Hamitic people.<P>(4) While the preceding division (3) probably states the real explanation of the early name of Egypt, it still remains to be noted that the use of the name Ham by the Psalmist may be entirely poetic. Until it be found that the name Ham was applied to Egypt by other writers of that period it will ever be in some measure unlikely that the Psalmist was acquainted with the mythological use of the name Ham in Egypt, and so, in equal measure, probable that he meant nothing more than to speak of the land of the descendants of Ham the son of Noah.`<a href="./study/isbe/search.html?string=HAM">HAM</a>`93';
isbe[6113]='Mizzah`miz\'-a (mizzah, "strong," "firm"): Grandson of Esau, one of the "dukes" of Edom (<a onClick="return mV(\'Gen\',36,13,17);">Ge 36:13,17</a>; <a onClick="return mV(\'1Ch\',1,37);">1Ch 1:37</a>).``1';
isbe[6114]='Mnason`na\'-son, m\'-na\'-son (Mnason): All that we know of Mnason is found in <a onClick="return mV(\'Act\',21,16);">Ac 21:16</a>.<P>(1) He accompanied Paul and his party from Caesarea on Paul\'s last visit to Jerusalem;<P>(2) he was a Cyprian;<P>(3) "an early disciple," an early convert to Christianity, and<P>(4) the one with whom Paul\'s company was to lodge.<P>The "Western" text of this passage is very interesting. Blass, following Codex Bezae (D), the Syriac, reads, for "bringing," etc., "And they brought us to those with whom one should lodge, and when we had come into a certain village we stayed with Mnason a Cyprian, an early disciple, and having departed thence we came to Jerusalem and the brethren," etc. Meyer-Wendt, Page and Rendell render the accepted text, "bringing us to the house of Mnason," etc. However, giving the imperfect transitive of anebainomen, "we were going up" to Jerusalem (<a onClick="return mV(\'Act\',21,15);">21:15</A>), we might understand that the company lodged with Mnason on the 1st night of their journey to Jerusalem, and not at the city itself. "<a onClick="return mV(\'Act\',21,15);">Ac 21:15</a>, they set about the journey; <a onClick="return mV(\'Act\',21,16);">21:16</A>, they lodged with Mnason on the introduction of the Cesarean disciples; <a onClick="return mV(\'Act\',21,17);">21:17,</A> they came to Jerus" (Expositor\'s Greek Testament, in the place cited.).``78';
isbe[6115]='Moab; Moabites`mo\'-ab, mo\'-ab-its (Moab, mo\'abh, Moabite Stone, M-\'-B; Greek (Septuagint) Moab, he Moabeitis, Moabitis; Moabite, mo\'abhi; Moabites, bene mo\'abh):<P>1. The Land:<P>Moab was the district east of the Dead Sea, extending from a point some distance north of it to its southern end. The eastern boundary was indefinite, being the border of the desert which is irregular. The length of the territory was about 50 miles and the average width about 30. It is a high tableland, averaging some 3,000 ft. above the level of the Mediterranean and 4,300 ft. above that of the Dead Sea. The aspect of the land, as one looks at it from the western side of the Dead Sea, is that of a range of mountains with a very precipitous frontage, but the elevation of this ridge above the interior is very slight. Deep chasms lead down from the tableland to the Dead Sea shore, the principal one being the gorge of the river Arnon, which is about 1,700 ft. deep and 2 or more miles in width at the level of the tableland, but very narrow at the bottom and with exceedingly precipitous banks. About 13 miles back from the mouth of the river the gorge divides, and farther back it subdivides, so that several valleys are formed of diminishing depth as they approach the desert border. These are referred to in <a onClick="return mV(\'Num\',21,14);">Nu 21:14</a> as the "valleys of the Arnon." The "valley of Zered" (<a onClick="return mV(\'Num\',21,12);">Nu 21:12</a>), which was on the southern border, drops down to the southern end of the Dead Sea, and although not so long or deep as the Arnon, is of the same nature in its lower reaches, very difficult to cross, dividing into two branches, but at a point much nearer the sea. The stream is not so large as the Arnon, but is quite copious, even in summer. These gorges have such precipitous sides that it would be very difficult for an army to cross them, except in their upper courses near the desert where they become shallow. The Israelites passed them in that region, probably along the present Hajj road and the line of the Mecca Railway. The tableland is fertile but lacks water. The fountains and streams in the valleys and on the slopes toward the Dead Sea are abundant, but the uplands are almost destitute of flowing water. The inhabitants supply themselves by means of cisterns, many of which are ancient, but many of those used in ancient times are ruined. The population must have been far greater formerly than now. The rainfall is usually sufficient to mature the crops, although the rain falls in winter only. The fertility of the country in ancient times is indicated by the numerous towns and villages known to have existed there, mentioned in Scripture and on the Moabite Stone, the latter giving some not found elsewhere. The principal of these were: Ar (<a onClick="return mV(\'Num\',21,15);">Nu 21:15</a>); Ataroth, Dibon, Jazer, Nimrah, Nebo (<a onClick="return mV(\'Num\',32,3);">Nu 32:3</a>); Beth-peor (<a onClick="return mV(\'Deu\',3,29);">De 3:29</a>); Beth-diblaim, Bozrah, Kerioth (<a onClick="return mV(\'Jer\',48,\'22-24\');">Jer 48:22-24</a>); Kir (<a onClick="return mV(\'Isa\',15,1);">Isa 15:1</a>); Medeba, Elealeh, Zoar (<a onClick="return mV(\'Isa\',15,2,4,5);">Isa 15:2,4,5</a>); Kirheres (<a onClick="return mV(\'Isa\',16,11);">Isa 16:11</a>); Sibmah (<a onClick="return mV(\'Jos\',13,19);">Jos 13:19</a>); in all, some 45 place-names in Moab are known, most of the towns being in ruins. Kir of Moab is represented in the modern Kerak, the most important of all and the government center of the district. Madeba now represents the ancient Medeba, and has become noted for the discovery of a medieval map of Palestine, in mosaic, of considerable archaeological value. Rabbath-moab and Heshbon (modern Rabba and Hesban) are miserable villages, and the country is subject to the raids of the Bedouin tribes of the neighboring desert, which discourages agriculture. But the land is still good pasture ground for cattle and sheep, as in ancient times (<a onClick="return mV(\'Num\',32,3,4);">Nu 32:3,4</a>).<P>2. The People:<P>The Moabites were of Semitic stock and of kin to the Hebrews, as is indicated by their descent from Lot, the nephew of Abraham (<a onClick="return mV(\'Gen\',19,\'30-37\');">Ge 19:30-37</a>), and by their language which is practically the same as the Hebrew. This is clear from the inscription on the Moabite Stone, a monument of Mesha, king of Moab, erected about 850 BC, and discovered among the ruins of Dibon in 1868. It contains 34 lines of about 9 words each, written in the old Phoenician and Hebrew characters, corresponding to the Siloam inscription and those found in Phoenicia, showing that it is a dialect of the Semitic tongue prevailing in Palestine. The original inhabitants of Moab were the Emim (<a onClick="return mV(\'Deu\',2,10);">De 2:10</a>), "a people great...and tall, as the Anakim." When these were deposed by the Moabites we do not know. The latter are not mentioned in the Tell el-Amarna Letters and do not appear on the Egyptian monuments before the 14th century BC, when they seem to be referred to under the name of Ruten, or Luten or Lotan, i.e. Lot (Paton, Syria and Pal); Muab appears in a list of names on a monument of Rameses III of the XXth Dynasty. The country lay outside the line of march of the Egyptian armies, and this accounts for the silence of its monuments in regard to them.<P>3. Religion:<P>The chief deity of Moab was Chemosh (kemosh), frequently mentioned in the Old Testament and on the Moabite Stone, where King Mesha speaks of building a high place in his honor because he was saved by him from his enemies. He represents the oppression of Moab by Omri as the result of the anger of Chemosh, and Mesha made war against Israel by command of Chemosh. He was the national god of Moab, as Molech was of Ammon, and it is pretty certain that he was propitiated by human sacrifices (<a onClick="return mV(\'2Ki\',3,27);">2Ki 3:27</a>). But he was not the only god of Moab, as is clear from the account in <a onClick="return mV(\'Num\',25,\'1-\');">Nu 25</a>, where it is also clear that their idolatrous worship was corrupt. They had their Baalim like the nations around, as may be inferred from the place-names compounded with Baal, such as Bamoth-baal, Beth-baal-meon and Baal-peor.<P>4. History:<P>We know scarcely anything of the history of the Moabites after the account of their origin in <a onClick="return mV(\'Gen\',19,\'1-\');">Ge 19</a> until the time of the exodus. It would seem, however, that they had suffered from the invasions of the Amorites, who, under their king Sihon, had subdued the northern part of Moab as far as the Arnon (<a onClick="return mV(\'Num\',21,\'21-31\');">Nu 21:21-31</a>). This conquest was no doubt a result of the movement of the Amorites southward, when they were pressed by the great wave of Hittite invasion that overran Northern Syria at the end of the 15th and the early part of the 14th centuries BC. The Amorites were forced to seek homes in Palestine, and it would seem that a portion of them crossed the Jordan and occupied Northern Moab, and here the Israelites found them as they approached the Promised Land. They did not at first disturb the Moabites in the south, but passed around on the eastern border (<a onClick="return mV(\'Deu\',2,8,9);">De 2:8,9</a>) and came into conflict with the Amorites in the north (<a onClick="return mV(\'Num\',21,\'21-26\');">Nu 21:21-26</a>), defeating them and occupying the territory (<a onClick="return mV(\'Num\',21,\'31-32\');">Nu 21:31-32</a>). But when Balak son of Zippor, king of Moab, saw what a powerful people was settling on his border, he made alliance with the Midianites against them and called in the aid of Balaam, but as he could not induce the latter to curse them he refrained from attacking the Israelites (<a onClick="return mV(\'Num\',22,\'1-\');">Nu 22</a>; <a onClick="return mV(\'Num\',24,\'1-\');">24</a>). The latter, however, suffered disaster from the people of Moab through their intercourse with them (<a onClick="return mV(\'Num\',25,\'1-\');">Nu 25</a>). Some time before the establishment of the kingdom in Israel the Midianites overran Moab, as would appear from the passage in <a onClick="return mV(\'Gen\',36,35);">Ge 36:35</a>, but the conquest was not permanent, for Moab recovered its lost territory and became strong enough to encroach upon Israel across the Jordan. Eglon of Moab oppressed Israel with the aid of Ammon and Amalek (<a onClick="return mV(\'Jdg\',3,\'13-14\');">Jud 3:13-14</a>), but Eglon was assassinated by Ehud, and the Moabite yoke was cast off after 18 years. Saul smote Moab, but did not subdue it (<a onClick="return mV(\'1Sa\',14,47);">1Sa 14:47</a>), for we find David putting his father and mother under the protection of the king of Moab when persecuted by Saul (<a onClick="return mV(\'1Sa\',22,3,4);">1Sa 22:3,4</a>). But this friendship between David and Moab did not continue. When David became king he made war upon Moab and completely subjugated it (<a onClick="return mV(\'2Sa\',8,2);">2Sa 8:2</a>). On the division of the kingdom between Rehoboam and Jeroboam the latter probably obtained possession of Moab (<a onClick="return mV(\'1Ki\',12,20);">1Ki 12:20</a>), but it revolted and Omri had to reconquer it (M S), and it was tributary to Ahab (<a onClick="return mV(\'2Ki\',1,1);">2Ki 1:1</a>). It revolted again in the reign of Ahaziah (<a onClick="return mV(\'2Ki\',1,1);">2Ki 1:1</a>; <a onClick="return mV(\'2Ki\',3,5);">3:5</a>), and Moab and Ammon made war on Jehoshaphat and Mt. Seir and destroyed the latter, but they afterward fell out among themselves and destroyed each other (<a onClick="return mV(\'2Ch\',20,\'1-\');">2Ch 20</a>). Jehoshaphat and Jehoram together made an expedition into Moab and defeated the Moabites with great slaughter (<a onClick="return mV(\'2Ki\',3,\'1-\');">2Ki 3</a>). But Mesha, king of Moab, was not subdued (<a onClick="return mV(\'2Ki\',3,27);">2Ki 3:27</a>), and afterward completely freed his land from the dominion of Israel (M S). This was probably at the time when Israel and Judah were at war with Hazael of Damascus (<a onClick="return mV(\'2Ki\',8,28,29);">2Ki 8:28,29</a>). Bands of Moabites ventured to raid the land of Israel when weakened by the conflict with Hazael (<a onClick="return mV(\'2Ki\',13,20);">2Ki 13:20</a>), but Moab was probably subdued again by Jeroboam II (<a onClick="return mV(\'2Ki\',14,25);">2Ki 14:25</a>), which may be the disaster to Moab recounted in <a onClick="return mV(\'Isa\',15,\'1-\');">Isa 15</a>. After Mesha we find a king of the name of Salamanu and another called Chemosh-nadab, the latter being subject to Sargon of Assyria. He revolted against Sennacherib, in alliance with other kings of Syria and Palestine and Egypt, but was subdued by him, and another king, Mutsuri, was subject to Esarhaddon. These items come to us from the Assyrian monuments. When Babylon took the place of Assyria in the suzerainty, Moab joined other tribes in urging Judah to revolt but seems to have come to terms with Nebuchadnezzar before Jerusalem was taken, as we hear nothing of any expedition of that king against her. On the war described in Judith, in which Moab (1:12, etc.) plays a part.<P>See <a href="./study/isbe/search.html?string=JUDITH">JUDITH</a>.<P>At a later date Moab was overrun by the Nabathean Arabs who ruled in Petra and extended their authority on the east side of Jordan even as far as Damascus (Josephus, Ant, XIII, xv, 1,2). The Moabites lost their identity as a nation and were afterward confounded with the Arabs, as we see in the statement of Josephus (XIII, xiii, 5), where he says that Alexander (Janneus) overcame the Arabians, such as the Moabites and the Gileadites. Alexander built the famous stronghold of Macherus in Moab, on a hill overlooking the Dead Sea, which afterward became the scene of the imprisonment and tragical death of John the Baptist (Josephus, BJ, VII, vi, 2; Ant, XVIII, v, 2; <a onClick="return mV(\'Mar\',6,\'21-28\');">Mr 6:21-28</a>). It was afterward destroyed by the Romans. Kir became a fortress of the Crusaders under the name of Krak (Kerak), which held out against the Moslems until the time of Saladin, who captured it in 1188 AD.<P>LITERATURE.<P>Commentaries on the passages in the Old Testament relating to Moab, and histories of Israel; Paton, Early History of Syria and Palestine; Rawlinson, Ancient Monarchies, especially Assyria and Babylonia; Conder, Heth and Moab; G. A. Smith, HGHL; the Moabite Stone; Josephus.``138';
isbe[6116]='Moabite Stone`A monument erected at Dibon (Dhiban) by Mesha, king of Moab (<a onClick="return mV(\'2Ki\',3,4,5);">2Ki 3:4,5</a>), to commemorate his successful revolt from Israel and his conquest of Israelite territory. It was discovered, August 19,1868,by a German missionary, V. Klein, who unfortunately took neither copy nor squeeze of it. It was 3 ft. 10 inches high and 2 ft. broad, with a semicircular top. The Berlin Museum entered into negotiations for the purchase of it, but while these were proceeding slowly, M. Clermont-Ganneau, then dragoman of the French consulate at Jerusalem, sent agents to take squeezes and tempt the Arabs to sell it for a large sum of money. This led to interference on the part of the Turkish officials, with the result that in 1869 the Arabs lighted a fire under the Stone, and by pouring cold water on it broke it into pieces which they carried away as charms. M. Clermont-Ganneau, however, succeeded in recovering a large proportion of these, and with the help of the squeezes was able to rewrite the greater part of the inscription. The last and most definitive edition of the text was published by Professors Smend and Socin in 1886 from a comparison of the fragments of the original (now in the Louvre) with the squeezes (in Paris and Bale) and photographs.<P>The following is (with some unimportant corrections) Dr. Neubauer\'s translation of the inscription, based upon Smend and Socin\'s text:<P>(1) I (am) Mesha, son of Chemosh-melech, king of Moab, the Dibonite.<P>(2) My father reigned over Moab 30 years and I reigned<P>(3) after my father. I have made this monument (or high place) for Chemosh at Qorchah, a monument of salvation,<P>(4) for he saved me from all invaders (or kings), and let me see my desire upon all my enemies. Omri<P>(5) was king of Israel, and he oppressed Moab many days, for Chemosh was angry with his<P>(6) land. His son (Ahab) followed him and he also said: I will oppress Moab. In my days (Chemosh) said:<P>(7) I will see (my desire) on him and his house, and Israel surely shall perish for ever. Omri took the land of<P>(8) Medeba (<a onClick="return mV(\'Num\',21,30);">Nu 21:30</a>), and (Israel) dwelt in it during his days and half the days of his son, altogether 40 years. But Chemosh (gave) it back<P>(9) in my days. I built Baal-Meon (<a onClick="return mV(\'Jos\',13,17);">Jos 13:17</a>) and made therein the ditches (or wells); I built<P>(10) Kirjathaim (<a onClick="return mV(\'Num\',32,37);">Nu 32:37</a>). The men of Gad dwelt in the land of Ataroth (<a onClick="return mV(\'Num\',32,3);">Nu 32:3</a>) from of old, and the king of Israel built there<P>(11) (the city of) Ataroth; but I made war against the city and took it. And I slew all the (people of)<P>(12) the city, for the pleasure of Chemosh and of Moab, and I brought back from them the Arel (\'-r-\'-l of Dodah (d-w-d-h) and bore<P>(13) him before Chemosh in Qerioth (<a onClick="return mV(\'Jer\',48,24);">Jer 48:24</a>). And I placed therein the men of Sharon and the men<P>(14) of Mehereth. And Chemosh said unto me: Go, seize Nebo of Israel and<P>(15) I went in the night and fought against it from the break of dawn till noon; and I took<P>(16) it, slew all of them, 7,000 men and (boys?), women and (girls?),<P>(17) and female slaves, for to Ashtar-Chemosh I devoted them. And I took from thence the Arels (\'-r-\'-l-y)<P>(18) of Yahweh and bore them before Chemosh. Now the king of Israel had built<P>(19) Jahaz (<a onClick="return mV(\'Isa\',15,4);">Isa 15:4</a>), and he dwelt in it while he waged war against me, but Chemosh drove him out from before me. And<P>(20) I took from Moab 200 men, all chiefs, and transported them to Jahaz which I took<P>(21) to add to Dibon. I built Qorchah, the Wall of the Forests and the Wall<P>(22) of the Ophel, and I built its gates and I built its towers. And<P>(23) I built the House of Moloch, and I made sluices for the water-ditches in the midst<P>(24) of the city. And there was no cistern within the city of Qorchah, and I said to all the people: Make for<P>(25) yourselves every man a cistern in his house. And I dug the canals (or conduits) for Qorchah by means of the prisoners<P>(26) from Israel. I built Aroer (<a onClick="return mV(\'Deu\',2,36);">De 2:36</a>), and I made the road in Arnon. And<P>(27) I built Beth-Bamoth (<a onClick="return mV(\'Num\',26,19);">Nu 26:19</a>) for it was destroyed. I built Bezer (<a onClick="return mV(\'Deu\',4,43);">De 4:43</a>), for in ruins<P>(28) (it was. And all the chiefs?) of Dibon were 50, for all Dibon is loyal, and I<P>(29) placed 100 (chiefs?) in the cities which I added to the land; I built<P>(30) (Beth)-Mede(b)a (<a onClick="return mV(\'Num\',21,30);">Nu 21:30</a>) and Beth-diblathaim (<a onClick="return mV(\'Jer\',48,22);">Jer 48:22</a>), and Beth-Baal-Meon (<a onClick="return mV(\'Jer\',48,23);">Jer 48:23</a>), and transported the shepherds (?)<P>(31) ....(with) the flock(s) of the land. Now in Choronaim (<a onClick="return mV(\'Isa\',15,5);">Isa 15:5</a>) there dwelt (the children?) ....<P>(32) ....(and) Chemosh said unto me: Go down, make war upon Choronaim. So I went down (and made war<P>(33) upon the city, and took it, and) Chemosh dwelt in it during my days. And I went up (?) from thence; I made ....<P>(34) ... And I..."<P>The Biblical character of the language of the inscription will be noticed as well as the use of "forty" to signify an indefinite period of time. As in Israel, no goddess seems to have been worshipped in Moab, since the goddess Ashtoreth is deprived of the feminine suffix, and is identified with the male Chemosh (Ashtar-Chemosh). Dodah appears to have been a female divinity worshipped by the side of Yahweh; the root of the name is the same as that of David and the Carthaginian Dido. The Arels were "the champions" of the deity (Assyrian qurart), translated "lion-like men" in the King James Version (<a onClick="return mV(\'2Sa\',23,20);">2Sa 23:20</a>; compare <a onClick="return mV(\'Isa\',33,7);">Isa 33:7</a>). There was an Ophel in the Moabite capital as well as at Jerusalem.<P>The alphabet of the inscription is an early form of the Phoenician, and resembles that of the earliest Greek inscriptions. The words are divided from one another by dots, and the curved forms of some of the letters (b, k, l, margin, n) presuppose writing with ink upon papyrus, parchment or potsherds.<P>The revolt of Mesha took place after Ahab\'s death (<a onClick="return mV(\'2Ki\',3,5);">2Ki 3:5</a>). At the battle of Qarqar in 854 BC, when the Syrian kings were defeated by Shalmaneser II, no mention is made of Moab, as it was included in Israel. It would seem from the inscription, however, that Medeba had already been restored to Mesha, perhaps in return for the regular payment of his tribute of 100,000 lambs and 100,000 rams with their wool (<a onClick="return mV(\'2Ki\',3,4);">2Ki 3:4</a>).<P>LITERATURE.<P>Clermont-Ganneau, La stele de Mesa, 1870; Ginsburg, Moabite Stone, 1871; R. Sinend and A. Socin, Die Inschrift des Konigs Mesa von Moab, 1886; A. Neubauer in Records of the Past, 2nd series, II, 1889; Lidzbarski, Handbuch der nordsemitischen Epigraphik,1898, 4-83, 415.``157';
isbe[6117]='Moabitess`mo\'-ab-it-es, mo-ab-i\'-tes (mo\'abhiyah): A woman, or in plural women, of Moab. The term is applied to Ruth (<a onClick="return mV(\'Rth\',1,22);">1:22</A>; <a onClick="return mV(\'Rth\',2,2,6,21);">2:2,6,21</A>; <a onClick="return mV(\'Rth\',4,5,10);">4:5,10</A>); to some of Solomon\'s wives (<a onClick="return mV(\'1Ki\',11,1);">1Ki 11:1</a>); and to Shimrith, whose son shared in the murder of King Joash (<a onClick="return mV(\'2Ch\',24,26);">2Ch 24:26</a>).`<a href="./study/isbe/search.html?string=MOAB">MOAB</a>`1';
isbe[6118]='Moadiah`mo-a-di\'-a.`<a href="./study/isbe/search.html?string=MAADIAH">MAADIAH</a>`1';
isbe[6119]='Mochmur, the Brook`mok\'-mur, ho cheimarrhos Mochmour): The torrent bed in a valley on which stood Chusi, not far from Ekrebel (Judith 7:18). The latter may be identified with \'Aqrabeh, east of Nablus. Wady Makhfuriyeh runs to the south of \'Aqrabeh, and probably represents the ancient Mochmur.``1';
isbe[6120]='Mock; Mocker; Mocking`mok, mok\'er, mok\'-ing (hathal, la\'agh, empaizo): To mock is the translation of hathal, "to play upon," "mock," "deride" (<a onClick="return mV(\'Jdg\',16,10,13,15);">Jud 16:10,13,15</a>; <a onClick="return mV(\'1Ki\',18,27);">1Ki 18:27</a>, "Elijah mocked them"; <a onClick="return mV(\'Job\',13,9);">Job 13:9</a> twice, the Revised Version (British and American) "deceiveth," "deceive," margin "mocketh," "mock"); of la\'agh, "to stammer" or "babble in mimicry," "to mock" or "scorn" (<a onClick="return mV(\'2Ch\',30,10);">2Ch 30:10</a>; <a onClick="return mV(\'Neh\',4,1);">Ne 4:1</a>; <a onClick="return mV(\'Job\',11,3);">Job 11:3</a>; <a onClick="return mV(\'Job\',21,3);">21:3</a>; <a onClick="return mV(\'Pro\',1,26);">Pr 1:26</a>; <a onClick="return mV(\'Pro\',17,5);">17:5</a>; <a onClick="return mV(\'Pro\',30,17);">30:17</a>; <a onClick="return mV(\'Jer\',20,7);">Jer 20:7</a>). Other words are tsachaq, "to laugh," etc. (<a onClick="return mV(\'Gen\',19,14);">Ge 19:14</a>; <a onClick="return mV(\'Gen\',21,9);">21:9</a>; <a onClick="return mV(\'Gen\',39,14,17);">39:14,17</a>); qalac, "to call out," or "cry after," "to scoff" or "mock at" (<a onClick="return mV(\'2Ki\',2,23);">2Ki 2:23</a>; <a onClick="return mV(\'Eze\',22,5);">Eze 22:5</a>); sachaq, "to laugh," "mock" (<a onClick="return mV(\'Job\',39,22);">Job 39:22</a>; <a onClick="return mV(\'Lam\',1,7);">La 1:7</a>); luts, "to scorn" (<a onClick="return mV(\'Pro\',14,9);">Pr 14:9</a>); sechoq, "laughter," "derision" (<a onClick="return mV(\'Job\',12,4);">Job 12:4</a>); empaizo, "to treat as a child," "mock" (<a onClick="return mV(\'Mat\',2,16);">Mt 2:16</a>; <a onClick="return mV(\'Mat\',20,19);">20:19</a>; <a onClick="return mV(\'Mat\',27,29,31,41);">27:29,31,41</a>; <a onClick="return mV(\'Luk\',14,29);">Lu 14:29</a>, etc.); diachleuazo, "to mock," "laugh," etc. (<a onClick="return mV(\'Act\',2,13);">Ac 2:13</a>; <a onClick="return mV(\'Act\',17,32);">17:32</a>); mukterizo, "to sneer at," "mock," literally, "to turn up the nose" (<a onClick="return mV(\'Gal\',6,7);">Ga 6:7</a>, "God is not mocked," "will not let himself be mocked"); epigelao, "laugh" (<a onClick="return mV(\'Job\',2,8);">Job 2:8</a>; 1Ma 7:34; compare 2Ma 7:39; 8:17).<P>Mocker, hathulim, "deceivers," "mockers" (<a onClick="return mV(\'Job\',17,2);">Job 17:2</a>); luts (<a onClick="return mV(\'Pro\',20,1);">Pr 20:1</a>; <a onClick="return mV(\'Isa\',28,22);">Isa 28:22</a> the King James Version); la\'egh, "stammering," "mocking" (<a onClick="return mV(\'Psa\',35,16);">Ps 35:16</a>; compare <a onClick="return mV(\'Isa\',28,11);">Isa 28:11</a>); sachaq (<a onClick="return mV(\'Jer\',15,17);">Jer 15:17</a>); empaiktes, "a mocker," "scoffer," literally, "sporting as children" (<a onClick="return mV(\'Jud\',1,18);">Jude 1:18</a>; compare <a onClick="return mV(\'2Pe\',3,3);">2Pe 3:3</a>).<P>Mocking is the translation of qallacah "mocking," "derision" (<a onClick="return mV(\'Eze\',22,4);">Eze 22:4</a>); of empaigmos the Septuagint for qallacah) (<a onClick="return mV(\'Hbr\',11,36);">Heb 11:36</a>; Wis 12:25; Ecclesiasticus 27:28, "mockery"; 2Ma 7:7, "mocking-stock," the Revised Version (British and American) "the mocking"; 2Macc 7:10, "made a mocking-stock" (empaizo)); of mokos (Ecclesiasticus 33:6).<P>For "mocked of" (<a onClick="return mV(\'Job\',12,4);">Job 12:4</a>) the Revised Version (British and American) has "a laughing-stock to"; for "mockers" (<a onClick="return mV(\'Isa\',28,22);">Isa 28:22</a>), the English Revised Version "scorner," the American Standard Revised Version "scoffer"; for "the mockers" (<a onClick="return mV(\'Jer\',15,17);">Jer 15:17</a>), "them that made merry"; for "scorneth" (<a onClick="return mV(\'Pro\',19,28);">Pr 19:28</a>), "mocketh at"; for "As one man mocketh another, do ye so mock him?" (<a onClick="return mV(\'Job\',13,9);">Job 13:9</a>), "As one deceiveth a man will ye deceive him?" (margin, "mocketh," "mock"); "mock" for "laugh" (<a onClick="return mV(\'Job\',9,23);">Job 9:23</a>); for "There shall come in the last days scoffers" (<a onClick="return mV(\'2Pe\',3,3);">2Pe 3:3</a>), "In the last days (margin, "Greek in the last of the days") mockers shall come with mockery" (empaigmone empaiktai).``185';
isbe[6121]='Modad, Book of Eldad And``<a href="./study/isbe/search.html?string=ELDAD+AND+MODAD,+BOOK+OF">ELDAD AND MODAD, BOOK OF</a>`1';
isbe[6122]='Moderately`mod\'-er-at-li (litsedhaqah): "Moderately" is the King James Version translation of litsedhaqah, "righteousness" (<a onClick="return mV(\'Joe\',2,23);">Joe 2:23</a>, "for he hath given you the former rain moderately," margin "according to righteousness," the Revised Version (British and American) "in just measure," margin "in (or for) righteousness"). In <a onClick="return mV(\'Phl\',4,5);">Php 4:5</a> the King James Version, toe pieikes is translated moderation: "Let your moderation be known unto all men. The Lord is at hand," the Revised Version (British and American) "forbearance," margin "or gentleness"; compare <a onClick="return mV(\'2Cr\',10,1);">2Co 10:1</a>. The proper meaning of this word has been the subject of considerable discussion; epieikeia is translated "clemency" (<a onClick="return mV(\'Act\',24,4);">Ac 24:4</a>), "gentleness" (of Christ) (<a onClick="return mV(\'2Cr\',10,1);">2Co 10:1</a>); epieikes is "gentle" (<a onClick="return mV(\'1Ti\',3,3);">1Ti 3:3</a>; <a onClick="return mV(\'Tts\',3,2);">Tit 3:2</a>; <a onClick="return mV(\'Jam\',3,17);">Jas 3:17</a>; <a onClick="return mV(\'1Pe\',2,18);">1Pe 2:18</a>).<P>Trench says (Synonyms of the New Testament, 151): "It expresses exactly that moderation which recognizes the impossibility cleaving to formal law, of anticipating and providing for all cases that will emerge and present themselves to it for decision; which, with this, recognizes the danger that ever waits upon the assertion of legal rights, lest they should be pushed into moral wrongs, lest the \'summum jus\' should in practice prove the \'summa injuria,\' which therefore, pushes not its own rights to the uttermost, but going back in part or in the whole from these, rectifies and redresses the injustices of justice. It is thus more truly just than strict justice would have been; no Latin word exactly and adequately renders it; clementia sets forth one side of it, aequitas another, and perhaps modestia (by which the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) translations it in <a onClick="return mV(\'2Cr\',10,1);">2Co 10:1</a>) a third; but the word is wanting which should set forth all these excellences reconciled in a single and higher one." Its archetype and pattern, he points out, is found in God, who does not stand upon or assert strict rights in His relations to men.<P>Lightfoot has "forbearance": "Let your gentle and forbearing spirit be recognized by all men. The judgment is drawing nigh." Hastings prefers "considerateness" or "sweet reasonableness" (HDB, III, 413); "\' Gentleness\' and \'forbearance\' are too passive. The \'considerateness\' of the Bible, whether applied to God or man, is an active virtue. It is the Spirit of the Messiah Himself, who will not break the bruised reed nor quench the smoking flax, and it is the spirit of every follower who realizes that \'the Lord is at hand.\'" The want of this "considerateness" too often mars our religious life and spoils its influence.``185';
isbe[6123]='Moderation`mod-er-a\'-shun (to epieikes): The word occurs once in the King James Version, <a onClick="return mV(\'Phl\',4,5);">Php 4:5</a>.``1';
isbe[6124]='Modin`mo\'-din (Modeein, Modein, Modeeim, and other forms; in the Talmud it is called modhi\'im, and modhi\'ith (Neubauer, Geographie du Talmud, 99)): This place owes its interest to the part it played in the history of the Maccabees. It was the ancestral home of their family (1Macc 2:17,70). Hither Mattathias, a priest of the sons of Joarib, retired when he had seen with a burning heart "the blasphemies that were committed in Judah and in Jerus" under the orders of Antiochus Epiphanes. But the king\'s officer followed him, and by offers of the king\'s friendship and great rewards sought to seduce the people into idolatry. This only fed the indignation of Mattathias, and when a Jew went forward to sacrifice, Mattathias slew him on the altar together with the king\'s officer. From such a step there could be no going back. Thus began the patriotic enterprise which, led by the old priest\'s heroic sons, was destined to make illustrious the closing days of the nation\'s life (1Macc 2:1ff; Ant, VI, i, 2; BJ, I, i, 3). Mattathias, his wife and sons were all buried in Modin (1Macc 2:70; 9:19; 13:25-30; Ant, XII, xi, 2; XIII, vi, 6). Near Modin Judas pitched his camp, whence issuing by night with the watchword "Victory is God\'s," he and a chosen band of warriors overwhelmed the army of Antiochus Eupator (2Macc 13:14). In Modin Judas and John, the sons of Simon, slept before the battle in which they defeated Cendebaeus (1Macc 16:4).<P>Of the impressive monument erected by Simon over the tombs of his parents and brethren Stanley (History of the Jewish Church, III, 318) gives the following account: "It was a square structure surrounded by colonnades of monolith pillars, of which the front and back were of white polished stone. Seven pyramids were erected by Simon on the summit, for the father and mother and four brothers who now lay there, with the seventh for himself when his time should come. On the faces of the monuments were bas-reliefs, representing the accouterments of sword and spear and shield \'for an eternal memorial\' of their many battles. There were also sculptures of ships—no doubt to record their interest in that long seaboard of the Philistine coast, which they were the first to use for their country\'s good. A monument at once so Jewish in idea and so Gentile in execution was worthy of the combination of patriotic fervor and high philosophic enlargement of soul which raised the Maccabean heroes so high above their age." Guerin (La Samarie, II, 401; Galilee, I, 47) thought he had discovered the remains of this monument at Khirbet el-Gharbawi near Medyeh, in 1870. In this, however, he was mistaken, the remains being of Christian origin.<P>Various identifications have been proposed. Coba, about 6 miles west of Jerusalem, was for a time generally accepted. Robinson (BR, III, 151f) suggested Latrun. There is now a consensus of opinion in favor of el-Medyeh, a village to the east of Wady Mulaki, 13 miles west of Bethel. It occupies a strong position in the hills 6 miles east of Lydda, thus meeting the condition of Eusebius, Onomasticon, which places it near Lydda. The identification was suggested by Dr. Sandreczki of Jerusalem in 1869. From el-Medyeh itself the sea is not visible; but to the south rises a rocky height, er-Ras, which commands a wide view, including the plain and the sea. The latter <span class="noTag">is</span> 16 miles distant. If the monument of Simon stood on er-Ras, which from the rock cuttings seems not improbable, it would be seen very clearly by overlooking from the sea, especially toward sunset (1Macc 13:29). About 1/4 mile west of el-Medyeh are tombs known as Qubur el-Yehud, one bearing the name of Sheikh el-Gharbawi, whose name attaches to the ruins. This is the tomb referred to above.``54';
isbe[6125]='Moeth`mo\'-eth (Moeth): Called "son of Sabannus," one of the Levites to whom, with the priest Mermoth, the silver and gold brought by Ezra from Babylon were committed (1Esdras 8:63) = "Noadiah" of <a onClick="return mV(\'Ezr\',8,33);">Ezr 8:33</a>, but there styled "son of Binnui."``1';
isbe[6126]='Moladah`mol\'-a-da, mo-la\'-da (moladhah; Molada): A place in the far south (Negebh) of Judah, toward Edom (<a onClick="return mV(\'Jos\',15,26);">Jos 15:26</a>), reckoned to Simeon (<a onClick="return mV(\'Jos\',19,2);">Jos 19:2</a>; <a onClick="return mV(\'1Ch\',4,28);">1Ch 4:28</a>). It was repopulated after the captivity (<a onClick="return mV(\'Neh\',11,26);">Ne 11:26</a>). It is mentioned always in close proximity to Beersheba. Moladah is probably identical with Malatha, a city in Idumea to which Agrippa at one time withdrew himself (Josephus, Ant, XVIII, vi, 2). The site of this latter city has by Robinson and others been considered to be the ruins and wells of Tell el-Milch, some 13 miles to the east of Beersheba and some 7 miles southwest of Arad. The chief difficulty is the statement of Eusebius and Jerome that Malatha was "by Jattir," i.e. \'Attir; if this is correct the Tell el-Milch is impossible, as it <span class="noTag">is<span> 10 miles from \'Attir, and we have no light at all on the site. See <a href="./study/isbe/search.html?string=SALT,+CITY+OF">SALT, CITY OF</a>. For Tell el-Milch see PEF, III, 415-16, Sh XXV.``117';
isbe[6127]='Mole`mol:<P>(1) tinshemeth, the King James Version "mole," the Revised Version (British and American) "chameleon"; Septuagint aspalax = spalax, "mole," Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) talpa, "mole" (<a onClick="return mV(\'Lev\',11,30);">Le 11:30</a>);<P>(2) choledh, English Versions of the Bible "weasel"; Septuagint gale, "weasel" or "pole-cat"; compare Arabic khuld, "mole-rat" (<a onClick="return mV(\'Lev\',11,29);">Le 11:29</a>);<P>(3) chaphar-peroth, English Versions of the Bible "moles"; from chaphar, "to dig"; compare Arabic chafar, "to dig," and perah, "mole" or "rat," for pe\'erah, from the root pa\'ar, "to dig"; compare Arabic fa\'rat, or farat, "rat," "mouse," from the root fa\'ar, "to dig"; Septuagint tois mataiois, "vain, idle, or profane persons" (<a onClick="return mV(\'Isa\',2,20);">Isa 2:20</a>):<P>(1) Tinshemeth is the last of 8 unclean "creeping things" in <a onClick="return mV(\'Lev\',11,29,30);">Le 11:29,30</a>. The word occurs also in <a onClick="return mV(\'Lev\',11,18);">Le 11:18</a> and <a onClick="return mV(\'Deu\',14,16);">De 14:16</a>, translated the King James Version "swan," the Revised Version (British and American) "horned owl," Septuagint porphurion, "coot" or "heron." See <a href="./study/isbe/search.html?string=CHAMELEON">CHAMELEON</a>.<P>(2) Choledh is the first in the same list. The word occurs nowhere else, and is translated "weasel" in English Versions of the Bible, but comparison with the Arabic khuld has led to the suggestion that "mole-rat" would be a better translation. See <a href="./study/isbe/search.html?string=WEASEL">WEASEL</a>.<P>(3) In <a onClick="return mV(\'Isa\',2,20);">Isa 2:20</a>, "In that day men shall cast away their idols...to the moles and to the bats," chaphar-peroth, variously written as one word or two, is translated "moles" in English Versions of the Bible, but has given rise to much conjecture.<P>The European "mole," Talpa europea, is extensively distributed in the temperate parts of Europe and Asia, but is absent from Syria and Palestine, its place being taken by the mole-rat, Spalax typhlus. The true mole belongs to the Insectivora, and feeds on earth-worms and insect larvae, but in making its tunnels and nests, it incidentally injures gardens and lawns. The mole-rat belongs to the Rodentia, and has teeth of the same general type as those of a rat or squirrel, large, chisel-shaped incisors behind which is a large vacant space, no canines, and praemolars and molars with grinding surfaces. It is larger than the mole, but of the same color, and, like the mole, is blind. It makes tunnels much like those of the mole. It is herbivorous and has been observed to seize growing plants and draw them down into its hole. In one of its burrows a central chamber has been found filled with entire plants of the chummuc or chick-pea, and two side chambers containing pods plucked from the plants in the central chamber. While the mole digs with its powerful and peculiarly shaped front feet, the mole-rat digs with its nose, its feet being normal in shape.`<a href="./study/isbe/search.html?string=LIZARD">LIZARD</a>`37';
isbe[6128]='Molech; Moloch`mo\'-lek, mo\'-lok (ha-molekh, always with the article, except in <a onClick="return mV(\'1Ki\',11,7);">1Ki 11:7</a>; Septuagint ho Moloch, sometimes also Molchom, Melchol; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Moloch):<P>1. The Name<P>2. The Worship in Old Testament History<P>3. The Worship in the Prophets<P>4. Nature of the Worship<P>5. Origin and Extent of the Worship<P>LITERATURE<hr /><P>1. The Name:<P>The name of a heathen divinity whose worship figures largely in the later history of the kingdom of Judah. As the national god of the Ammonites, he is known as "Milcom" (<a onClick="return mV(\'1Ki\',11,5,7);">1Ki 11:5,7</a>), or "Malcam" ("Malcan" is an alternative reading in <a onClick="return mV(\'2Sa\',12,30,31);">2Sa 12:30,31</a>; compare <a onClick="return mV(\'Jer\',49,1,3);">Jer 49:1,3</a>; <a onClick="return mV(\'Zep\',1,5);">Ze 1:5</a>, where the Revised Version margin reads "their king"). The use of basileus, and archon, as a translation of the name by the Septuagint suggests that it may have been originally the Hebrew word for "king," melekh. Molech is obtained from melekh by the substitution of the vowel points of Hebrew bosheth, signifying "shame." From the obscure and difficult passage, <a onClick="return mV(\'Amo\',5,26);">Am 5:26</a>, the Revised Version (British and American) has removed "your Moloch" and given "your king," but Septuagint had here translated "Moloch," and from the Septuagint it found its way into the Acts (<a onClick="return mV(\'Act\',7,43);">7:43</A>), the only occurrence of the name in the New Testament.<P>2. The Worship in Old Testament History:<P>In the Levitical ordinances delivered to the Israelites by Moses there are stern prohibitions of Molech-worship (<a onClick="return mV(\'Lev\',18,21);">Le 18:21</a>; <a onClick="return mV(\'Lev\',20,\'2-5\');">20:2-5</a>). Parallel to these prohibitions, although the name of the god is not mentioned, are those of the Deuteronomic Code where the abominations of the Canaanites are forbidden, and the burning of their sons and daughters in the fire (to Molech) is condemned as the climax of their wickedness (<a onClick="return mV(\'Deu\',12,31);">De 12:31</a>; <a onClick="return mV(\'Deu\',18,\'10-13\');">18:10-13</a>). The references to Malcam, and to David\'s causing the inhabitants of Rabbath Ammon to pass through the brick kiln (<a onClick="return mV(\'2Sa\',12,30,31);">2Sa 12:30,31</a>), are not sufficiently clear to found upon, because of the uncertainty of the readings. Solomon, under the influence of his idolatrous wives, built high places for Chemosh, the abomination of Moab, and for Milcom, the abomination of the children of Ammon. See <a href="./study/isbe/search.html?string=CHEMOSH">CHEMOSH</a>. Because of this apostasy it was intimated by the prophet Ahijah, that the kingdom was to be rent out of the hand of Solomon, and ten tribes given to Jeroboam (<a onClick="return mV(\'1Ki\',11,\'31-33\');">1Ki 11:31-33</a>). These high places survived to the time of Josiah, who, among his other works of religious reformation, destroyed and defiled them, filling their places with the bones of men (<a onClick="return mV(\'2Ki\',23,\'12-14\');">2Ki 23:12-14</a>). Molech-worship had evidently received a great impulse from Ahaz, who, like Ahab of Israel, was a supporter of foreign religions (<a onClick="return mV(\'2Ki\',16,12);">2Ki 16:12</a>). He also "made his son to pass through the fire, according to the abominations of the nations, whom Yahweh cast out from before the children of Israel" (<a onClick="return mV(\'2Ki\',16,3);">2Ki 16:3</a>). His grandson Manasseh, so far from following in the footsteps of his father Hezekiah, who had made great reforms in the worship, reared altars for Baal, and besides other abominations which he practiced, made his son to pass through the fire (<a onClick="return mV(\'2Ki\',21,6);">2Ki 21:6</a>). The chief site of this worship, of which Ahaz and Manasseh were the promoters, was Topheth in the Valley of Hinnom, or, as it is also called, the Valley of the Children, or of the Son of Hinnom, lying to the southwest of Jerusalem (see <a href="./study/isbe/search.html?string=GEHENNA">GEHENNA</a>). Of Josiah\'s reformation it is said that "he defiled Topheth...that no man might make his son or his daughter to pass through the fire to Molech" (<a onClick="return mV(\'2Ki\',23,10);">2Ki 23:10</a>).<P>3. The Worship in the Prophets:<P>Even Josiah\'s thorough reformation failed to extirpate the Molech-worship, and it revived and continued till the destruction of Jerusalem, as we learn from the prophets of the time. From the beginning, the prophets maintained against it a loud and persistent protest. The testimony of Amos (<a onClick="return mV(\'Amo\',1,15);">1:15</a>; <a onClick="return mV(\'Amo\',5,26);">5:26</a>) is ambiguous, but most of the ancient versions for malkam, "their king," in the former passage, read milkom, the national god of Ammon (see Davidson, in the place cited.). Isaiah was acquainted with Topheth and its abominations (<a onClick="return mV(\'Isa\',30,33);">Isa 30:33</a>; <a onClick="return mV(\'Isa\',57,5);">57:5</a>). Over against his beautiful and lofty description of spiritual religion, Micah sets the exaggerated zeal of those who ask in the spirit of the Molech-worshipper: "Shall I give my firstborn for my transgression, the fruit of my body for the sin of my soul?" (<a onClick="return mV(\'Mic\',6,6);">Mic 6:6</a>). That Molech-worship had increased in the interval may account for the frequency and the clearness of the references to it in tile later Prophets. In Jeremiah we find the passing of sons and daughters through the fire to Molech associated with the building of "the high places of Baal, which are in the Valley of the Son of Hinnom" (<a onClick="return mV(\'Jer\',32,35);">32:35</A>; compare <a onClick="return mV(\'Jer\',7,31);">7:31</A>ff; <a onClick="return mV(\'Jer\',19,5);">19:5</A>ff). In his oracle against the children of Ammon, the same prophet, denouncing evil against their land, predicts (almost in the very words of Amos above) that Malcam shall go into captivity, his priests and his princes together (<a onClick="return mV(\'Jer\',49,1,3);">Jer 49:1,3</a>). Ezekiel, speaking to the exiles in Babylon, refers to the practice of causing children to pass through the fire to heathen divinities as long established, and proclaims the wrath of God against it (<a onClick="return mV(\'Eze\',16,20);">Eze 16:20</a>f; <a onClick="return mV(\'Eze\',20,26,31);">20:26,31</a>; <a onClick="return mV(\'Eze\',23,37);">23:37</a>). That this prophet regarded the practice as among the "statutes that were not good, and ordinances wherein they should not live" (<a onClick="return mV(\'Eze\',20,25);">Eze 20:25</a>) given by God to His people, by way of deception and judicial punishment, as some hold, is highly improbable and inconsistent with the whole prophetic attitude toward it. Zephaniah, who prophesied to the men who saw the overthrow of the kingdom of Judah, denounces God\'s judgments upon the worshippers of false gods (<a onClick="return mV(\'Zep\',1,5);">Ze 1:5</a>f). He does not directly charge his countrymen with having forsaken Yahweh for Malcam, but blames them, because worshipping Him they also swear to Malcam, like those Assyrian colonists in Samaria who feared Yahweh and served their own gods, or like those of whom Ezekiel elsewhere speaks who, the same day on which they had slain their children to their idols, entered the sanctuary of Yahweh to profane it (<a onClick="return mV(\'Eze\',23,39);">Eze 23:39</a>). The captivity in Babylon put an end to Molech-worship, since it weaned the people from all their idolatries. We do not hear of it in the post-exilic Prophets, and, in the great historical psalm of Israel\'s rebelliousness and God\'s deliverances (<a onClick="return mV(\'Psa\',106,\'1-\');">Ps 106</a>), it is only referred to in retrospect (<a onClick="return mV(\'Psa\',106,37,38);">Ps 106:37,38</a>).<P>4. The Nature of the Worship:<P>When we come to consider the nature of this worship it is remarkable how few details are given regarding it in Scripture. The place where it was practiced from the days of Ahaz and Manasseh was the Valley of Hinnom where Topheth stood, a huge altar-pyre for the burning of the sacrificial victims. There is no evidence connecting the worship with the temple in Jerusalem. Ezekiel\'s vision of sun-worshippers in the temple is purely ideal (<a onClick="return mV(\'Eze\',8,\'1-\');">Eze 8</a>). A priesthood is spoken of as attached to the services (<a onClick="return mV(\'Jer\',49,3);">Jer 49:3</a>; compare <a onClick="return mV(\'Zep\',1,4,5);">Ze 1:4,5</a>). The victims offered to the divinity were not burnt alive, but were killed as sacrifices, and then presented as burnt offerings. "To pass through the fire" has been taken to mean a lustration or purification of the child by fire, not involving death. But the prophets clearly speak of slaughter and sacrifice, and of high places built to burn the children in the fire as burnt offerings (<a onClick="return mV(\'Jer\',19,5);">Jer 19:5</a>; <a onClick="return mV(\'Eze\',16,20,21);">Eze 16:20,21</a>).<P>The popular conception, molded for English readers largely by Milton\'s "Moloch, horrid king" as described in Paradise Lost, Book I, is derived from the accounts given in late Latin and Greek writers, especially the account which Diodorus Siculus gives in his History of the Carthaginian Kronos or Moloch. The image of Moloch was a human figure with a bull\'s head and outstretched arms, ready to receive the children destined for sacrifice. The image of metal was heated red hot by a fire kindled within, and the children laid on its arms rolled off into the fiery pit below. In order to drown the cries of the victims, flutes were played, and drums were beaten; and mothers stood by without tears or sobs, to give the impression of the voluntary character of the offering (see Rawlinson\'s Phoenicia, 113f; for fuller details).<P>On the question of the origin of this worship there is great variety of views. Of a non-Sem origin there is no evidence; and there is no trace of human sacrifices in the old Babylonian religion. That it prevailed widely among Semitic peoples is clear.<P>5. Origin and Extent of the Worship:<P>While Milcom or Malcam is peculiarly the national god of the Ammonites, as is Chemosh of the Moabites, the name Molech or Melech was recognized among the Phoenicians, the Philistines, the Arameans, and other Semitic peoples, as a name for the divinity they worshipped from a very early time. That it was common among the Canaanites when the Israelites entered the land is evident from the fact that it was among the abominations from which they were to keep themselves free. That it was identical at first with the worship of Yahweh, or that the prophets and the best men of the nation ever regarded it as the national worship of Israel, is a modern theory which does not appear to the present writer to have been substantiated. It has been inferred from Abraham\'s readiness to offer up Isaac at the command of God, from the story of Jephthah and his daughter, and even from the sacrifice of Hiel the Bethelite (<a onClick="return mV(\'1Ki\',16,34);">1Ki 16:34</a>), that human sacrifice to Yahweh was an original custom in Israel, and that therefore the God of Israel was no other than Moloch, or at all events a deity of similar character. But these incidents are surely too slender a foundation to support such a theory. "The fundamental idea of the heathen rite was the same as that which lay at the foundation of Hebrew ordinance: the best to God; but by presenting to us this story of the offering of Isaac, and by presenting it in this precise form, the writer simply teaches the truth, taught by all the prophets, that to obey is better than sacrifice—in other words that the God worshipped in Abraham\'s time was a God who did not delight in destroying life, but in saving and sanctifying it" (Robertson, Early Religion of Israel, 254). While there is no ground for identifying Yahweh with Moloch, there are good grounds for seeing a community of origin between Moloch and Baal. The name, the worship, and the general characteristics are so similar that it is natural to assign them a common place of origin in Phoenicia. The fact that Moloch-worship reached the climax of its abominable cruelty in the Phoenician colonies of which Carthage was the center shows that it had found among that people a soil suited to its peculiar genius.<P>LITERATURE.<P>Wolf Baudissin, "Moloch" in PRE3; G. F. Moore, "Moloch" in EB; Robertson, Early Religion of Israel, 241-65; Robertson Smith, Religion of the Semites, 352ff; Buchanan Gray, Hebrew Proper Names, 138ff.``128';
isbe[6129]='Moli`mo\'-li.`<a href="./study/isbe/search.html?string=MOOLI">MOOLI</a>`1';
isbe[6130]='Molid`mo\'-lid (molidh): A Judahite (<a onClick="return mV(\'1Ch\',2,29);">1Ch 2:29</a>).``1';
isbe[6131]='Mollify`mol\'-i-fi (from rakhakh, "to be soft"): "To make soft," used in modern English only figuratively, as "His anger was mollified." English Versions of the Bible, however, uses the word literally in its two occurrences: <a onClick="return mV(\'Isa\',1,6);">Isa 1:6</a>, "wounds, and bruises...neither bound up, neither mollified with oil"; The <span class="noTag">Wisdom of Solomon 16:12</span>, "mollifying plaister." Neither occurrence of the word is changed by the Revised Version (British and American).``1';
isbe[6132]='Moloch`mo\'-lok: A deity of the Ammonites, like the planet Saturn, a representative of the sun-god in the particular aspect of a god of time.`<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>; <a href="./study/isbe/search.html?string=MOLECH">MOLECH</a>`1';
isbe[6133]='Molten Sea`See <a href="./study/isbe/search.html?string=LAVER">LAVER</a>.``1';
isbe[6134]='Molten, Image`mol\'-t\'-n.`<a href="./study/isbe/search.html?string=IMAGES">IMAGES</a>`1';
isbe[6135]='Momdis`mom\'-dis (Codex Alexandrinus Momdeis; Codex Vaticanus Momdeios): One of those who had taken "strange wives" (1Esdras 9:34) equals "Maadai" in <a onClick="return mV(\'Ezr\',10,34);">Ezr 10:34</a>.``1';
isbe[6136]='Moment`mo\'-ment (regha\', "a wink"; atomos, "an atom," stigme, "a point," parautika, immediately," "forthwith"): "Moment" is not used in Scripture for a division of time, but for an instant of time, as the wink or twinkling of the eye (<a onClick="return mV(\'Exd\',33,5);">Ex 33:5</a>; <a onClick="return mV(\'Num\',16,21,45);">Nu 16:21,45</a>; <a onClick="return mV(\'Lam\',4,6);">La 4:6</a>; <a onClick="return mV(\'1Cr\',15,52);">1Co 15:52</a>), or for a short period of time (<a onClick="return mV(\'Job\',20,5);">Job 20:5</a>; <a onClick="return mV(\'Psa\',30,5);">Ps 30:5</a>; <a onClick="return mV(\'Isa\',26,20);">Isa 26:20</a>; <a onClick="return mV(\'2Cr\',4,17);">2Co 4:17</a>). The division of the hour into sixty minutes was certainly known in Babylonia, and the Jews were made acquainted with it, at least during the captivity, but they do not seem to have adopted it very extensively.``138';
isbe[6137]='Money`mun\'-i: Various terms are used for money in the Bible, but the most common are the Hebrew keceph, and Greek argurion, both meaning silver. We find also qesitah, rendered by Septuagint "lambs," probably referring to money in a particular form; chalkos, is used for money in <a onClick="return mV(\'Mat\',10,9);">Mt 10:9</a>; <a onClick="return mV(\'Mar\',6,8);">Mr 6:8</a>; <a onClick="return mV(\'Mar\',12,41);">12:41</a>. It was the name of a small coin of Agrippa II (Madden, Coins of the Jews); chrema, "price," is rendered money in <a onClick="return mV(\'Act\',4,37);">Ac 4:37</a>; <a onClick="return mV(\'Act\',8,18,20);">8:18,20</a>; <a onClick="return mV(\'Act\',24,26);">24:26</a>; kerma, "piece," i.e. piece of money (<a onClick="return mV(\'Jhn\',2,15);">Joh 2:15</a>); didrachmon, "tribute money" (<a onClick="return mV(\'Mat\',17,24);">Mt 17:24</a> the King James Version, the Revised Version (British and American) "half-shekel"); kensos, "census," "tribute money" (<a onClick="return mV(\'Mat\',22,19);">Mt 22:19</a>).<P>1. Material and Form:<P>Gold and silver were the common medium of exchange in Syria and Palestine in the earliest times of which we have any historical record. The period of mere barter had passed before Abraham. The close connection of the country with the two great civilized centers of antiquity, Egypt and Babylonia, had led to the introduction of a currency for the purposes of trade. We have abundant evidence of the use of these metals in the Biblical records, and we know from the monuments that they were used as money before the time of Abraham. The patriarch came back from his visit to Egypt "rich in cattle, in silver, and in gold" (<a onClick="return mV(\'Gen\',13,2);">Ge 13:2</a>). There was no system of coinage, but they had these metals cast in a convenient form for use in exchange, such as bars or rings, the latter being a common form and often represented or mentioned on the monuments of Egypt. In Babylonia the more common form seems to have been the former, such as the bar, or wedge, that Achan found in the sack of Jericho (<a onClick="return mV(\'Jos\',7,21);">Jos 7:21</a>). This might indicate that the pieces were too large for ordinary use, but we have indications of the use of small portions also (<a onClick="return mV(\'2Ki\',12,9);">2Ki 12:9</a>; <a onClick="return mV(\'Job\',42,11);">Job 42:11</a>). But the pieces were not so accurately divided as to pass for money without weighing, as we see in the case of the transaction between Abraham and the children of Heth for the purchase of the field of Machpelah (<a onClick="return mV(\'Gen\',23,\'1-\');">Ge 23</a>). This transaction indicates also the common use of silver as currency, for it was "current money with the merchant," and earlier than this we have mention of the use of silver by Abraham as money: "He that is born in thy house and he that is bought with thy money" (<a onClick="return mV(\'Gen\',17,13);">Ge 17:13</a>).<P>Jewels of silver and gold were probably made to conform to the shekel weight, so that they might be used for money in case of necessity. Thus Abraham\'s servant gave to Rebecca a gold ring of half a shekel weight and bracelets of ten shekels weight (<a onClick="return mV(\'Gen\',24,22);">Ge 24:22</a>). The bundles of money carried by the sons of Jacob to Egpyt for the purchase of grain (<a onClick="return mV(\'Gen\',42,35);">Ge 42:35</a>) were probably silver rings tied together in bundles. The Hebrew for "talent," kikkar, signifies something round or circular, suggesting a ring of this weight to be used as money. The ordinary term for money was keceph, "silver," and this word preceded by a numeral always refers to money, either with or without "shekel," which we are probably to supply where it is not expressed after the numeral, at least wherever value is involved, as the shekel (sheqel) was the standard of value as well as of weight (see <a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>). Thus the value of the field of Ephron was in shekels, as was also the estimation of offerings for sacred purposes (<a onClick="return mV(\'Lev\',5,15);">Le 5:15</a>; <a onClick="return mV(\'Lev\',27,\'1-\');">27</a>, passim). Solomon purchased chariots at 600 (shekels) each and horses at 150 (<a onClick="return mV(\'1Ki\',10,29);">1Ki 10:29</a>). Large sums were expressed in talents, which were a multiple of the shekel. Thus Menahem gave Pul 1,000 talents of silver (<a onClick="return mV(\'2Ki\',15,19);">2Ki 15:19</a>), which was made up by the exaction of 50 shekels from each rich man. Hezekiah paid the war indemnity to Sennacherib with 300 talents of silver and 30 of gold (<a onClick="return mV(\'2Ki\',18,14);">2Ki 18:14</a>). The Assyrian account gives 800 talents of silver, and the discrepancy may not be an error in the Hebrew text, as some would explain it, but probably a different kind of talent (see Madden, Coins of the Jews, 4). Solomon\'s revenue is stated in talents (<a onClick="return mV(\'1Ki\',10,14);">1Ki 10:14</a>), and the amount (666 of gold) indicates that money was abundant, for this was in addition to what he obtained from the vassal states and by trade. His partnership with the Phoenicians in commerce brought him large amounts of the precious metals, so that silver was said to have been as plentiful in Jerusalem as stones (<a onClick="return mV(\'1Ki\',10,27);">1Ki 10:27</a>).<P>Besides the forms of rings and bars, in which the precious metals were cast for commercial use, some other forms were perhaps current. Thus the term qesitah has been referred to as used for money, and the Septuagint translation has "lambs." It is used in <a onClick="return mV(\'Gen\',33,19);">Ge 33:19</a>; <a onClick="return mV(\'Jos\',24,32);">Jos 24:32</a>; <a onClick="return mV(\'Job\',42,11);">Job 42:11</a>, and the Septuagint rendering is supposed to indicate a piece in the form of a lamb or stamped with a lamb, used at first as a weight, later the same weight of the precious metals being used for money. We are familiar with lion weights and weights in the form of bulls and geese from the monuments, and it would not be strange to find them in the form of sheep. Qesitah is cognate with the Arabic qasaT, which means "to divide exactly" or "justly," and the noun qist means "a portion" or "a measure."<P>Another word joined with silver in monetary use is \'aghorah, the term being translated "a piece of silver" in <a onClick="return mV(\'1Sa\',2,36);">1Sa 2:36</a>. \'Aghorah is cognate with the Arabic ujrat, "a wage," and it would seem that the piece of silver in this passage might refer to the same usage.<P>Another word used in a similar way is rats, from ratsats, "to break in pieces," hence, rats is "a piece" or "fragment of silver" used as money. These terms were in use before the introduction of coined money and continued after coins became common.<P>2. Coined Money:<P>After the exile we begin to find references to coined money. It was invented in Lydia or perhaps in Aegina. Herodotus assigns the invention to the Lydians (i.94). The earliest Lydian coins were struck by Gyges in the 7th century BC. These coins were of electrum and elliptical in form, smooth on the reverse but deeply stamped with incuse impressions on the obverse. They were called staters, but were of two standards; one for commercial use with the Babylonians, weighing about 164,4 grains, and the other of 224 grains (see Madden, op. cit.). Later, gold was coined, and, by the time of Croesus, gold and silver. The Persians adopted the Lydian type, and coined both gold and silver darics, the name being derived from Darius Hystaspis (521-485 BC) who is reputed to have introduced the system into his empire. But the staters of Lydia were current there under Cyrus (Madden, op. cit.), and it was perhaps with these that the Jews first became acquainted in Babylon. Ezra states (<a onClick="return mV(\'Ezr\',2,69);">2:69</a>) that "they (the Jews) g
