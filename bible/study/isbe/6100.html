ave after their ability into the treasury of the work threescore and one thousand darics (the Revised Version (British and American)) of gold, and five thousand pounds of silver." The term here rendered "daric" is darkemonim, and this word is used in three passages in Nehemiah (<a onClick="return mV(\'Neh\',7,70,71,72);">7:70-72</A>), and \'adharkonim occurs in <a onClick="return mV(\'1Ch\',29,7);">1Ch 29:7</a> and <a onClick="return mV(\'Ezr\',8,27);">Ezr 8:27</a>. Both are of the same origin as the Greek drachma, probably, though some derive both from Darius (a Phoenician inscription from the Piraeus tells us that darkemon corresponds to drachma). At all events they refer to the gold coins which we know as darics. The weight of the daric was 130 grains, though double darics were struck.<P>Besides the gold daric there was a silver coin circulating in Persia that must have been known to the Jews. This was the siglos, supposed to be referred to in <a onClick="return mV(\'Neh\',5,15);">Ne 5:15</a>, where it is translated "shekel." These were the so-called silver darics, 20 of which were equivalent to the gold daric. Besides these Persian coins the Jews must have used others derived from their intercourse with the Phoenician cities, which were allowed to strike coins under the suzerainty of the Persians. These coins were of both silver and bronze, the suzerain not permitting them to coin gold. We have abundant examples of these coins and trade must have made them familiar to the Jews.<P>The issues of Aradus, Sidon and Tyre were especially noteworthy, and were of various types and sizes suited to the commercial transactions of the Phoenicians. The Tyrian traders were established in Jerusalem as early as the time of Nehemiah (<a onClick="return mV(\'Neh\',13,16);">13:16</A>), and their coins date back to about that period. Among the finest specimens we have of early coinage are the tetradrachms of Tyre and the double shekels or staters of Sidon. The latter represent the Persian king, on the obverse, as he rides in his chariot, driven by his charioteer and followed by an attendant. On the reverse is a Phoenician galley. The weight of these coins is from 380 to 430 grains, and they are assigned to the 4th and 5th centuries BC. From Tyre we have a tetradrachm which corresponds to the shekel of the Phoenician standard of about 220 grains, which represents, on the obverse, the god Melkarth, the Tyrian Hercules, tiding on a seahorse, and, beneath, a dolphin. The reverse bears an owl with the Egyptian crook and a flail, symbols of Osiris. The early coins of Aradus bear, on the obverse, the head of Baal or Dagon, and on the reverse a galley. The inscription has "M.A." in Phoenician letters, followed by a date. The inscription signifies "Melek Aradus," i.e. "king of Aradus."<P>When Alexander overthrew the Persian empire in 331 BC, a new coinage, on the Attic standard, was introduced, and the silver drachms and tetradrachms struck by him circulated in large numbers, as is attested by the large number of examples still in existence. After his death, these coins, the tetradrachms especially, continued to be struck in the provinces, with his name and type, in his honor. We have examples of these struck at Aradus, Tyre, Sidon, Damascus and Acre, bearing the mint marks of these towns. They bear on the obverse the head of Alexander as Hercules, and, on the reverse, Zeus seated on his throne holding an eagle in the extended right hand and a scepter in the left. The legend is BASILEOS ALEXANDROU, or ALEXANDROU, only, with various symbols of the towns or districts where they were struck, together with mint marks.<P>The successors of Alexander established kingdoms with a coinage of their own, such as the Ptolemies in Egypt and the Seleucids in Syria, and these coins, as well as those of Alexander, circulated among the Jews. The Ptolemies of Egypt controlled Palestine for about a century after Alexander, and struck coins, not only in Egypt, but in some of the Phoenician towns, especially at Acre, which was, from that time, known as Ptolemais. Their coins were based upon the Phoenician standard. But the Seleucid kings of Syria had the most influence in Phoenicia and Palestine, and their monetary issues are very various and widely distributed, bearing the names and types of the kings, and the symbols and mint marks of the different towns where they were struck, and are on the Alexandrine or Attic standard in contrast to those of the Ptolemies. They are both silver and bronze, gold being struck in the capital, Antioch, usually. The coins of Antiochus IV, Epiphanes, are especially interesting on account of his connection with Jewish affairs. It was he who made the futile attempt to hellenize the Jews, which led to the revolt that resulted, under his successors, in the independence of the country of Syrian control, and the institution of a native coinage in the time of the Maccabees.<P>The struggle caused by the persecution of Antiochus commenced in 165 BC and continued more than 20 years. Judas, the son of Mattathias, defeated Antiochus, who died in 164, but the war was continued by his successors until dynastic dissensions among them led to treaties with the Jews to gain their support. At last Simon, who espoused the cause of Demetrius II, obtained from him, as a reward, the right to rule Judea under the title of high priest, with practical independence, 142-143 BC. Later Antiochus VII, his successor, confirmed Simon in his position and added some privileges, and among them the right to coin money (138-139 BC). Both silver and bronze coins exist ascribed to Simon, but some numismatists have recently doubted this, and have assigned them to another Simon in the time of the first revolt of the Jews under the Romans. The coins in question are the shekels and half-shekels with the legends, in Hebrew, sheqel yisra\'el and yerushalem qedhoshah ("Jerusalem the holy"), bearing dates ranging from the 1st to the 5th year, as well as bronze pieces of the 4th.<P>The reason for denying the ascription of these coins to Simon the Maccabee is the difficulty in finding room for the years indicated in his reign which closed in 135 BC. He received the commission to coin in 139-138, which would allow only 4 years for his coinage, whereas we have coins of the 5th year. Moreover, no shekels and half-shekels of any of the Maccabees later than Simon have come to light, which is, at least, singular since we should have supposed that all would have coined them as long as they remained independent, especially since they coined in bronze, examples of the latter being quite abundant. The fact also that they bore the title of king, while Simon was high priest only, would seem to have furnished an additional reason for claiming the prerogative of coinage in silver as well as bronze. But this argument is negative only, and such coins may have existed but have not come to light, and there are reasons which seem to the present writer sufficient to assign them to Simon the Maccabee. In the first place, the chronological difficulty is removed if we consider that Simon was practically independent for three or four years before he obtained the explicit commission to coin money. We learn from Josephus (Ant., XIII, vi, 7) and from 1Macc (13:41,42) that in the 170th year of the Seleucid era, that is, 143-142 BC, the Jews began to use the era of Simon in their contracts and public records. Now it would not have been strange if Simon, seeing the anarchy that prevailed in the kingdom of Syria, should have assumed some prerogatives of an independent ruler before they were distinctly granted to him, and among them that of coining money. If he had commenced in the latter part of 139 BC, he would have been able to strike coins of the 5th year before he died, and this would satisfy the conditions (see Madden\'s Jewish Coinage). There is a difficulty quite as great in attributing these coins to Simon of the first revolt under the Romans. That broke out in 66 AD, and was suppressed by the taking of Jerusalem in 70. This would allow a date of the 5th year, but it is hardly supposable that in the terrible distress and anarchy that prevailed in the city during that last year any silver coins would have been struck. There is another fact bearing upon this question which is worthy of notice. The coins of the first revolt bear personal appellations, such as "Eleazar the priest," and "Simon," while those assigned to Simon the Maccabee bear no personal designation whatever. This is significant, for it is not likely that Eleazar and Simon would have commenced coining silver shekels and half-shekels with their names inscribed upon them in the 1st year of their reign and then have omitted them on later issues. Another point which has some force is this: We find mention, in the New Testament, of money-changers in connection with the temple, whose business it was to change the current coin, which was Roman or Greek, and bore heathen types and legends, for Jewish coins, which the strict Pharisaic rules then in force required from worshippers paying money into the temple treasury. It is inferred that they could furnish the shekels and half-shekels required for the yearly dues from every adult male (compare <a onClick="return mV(\'Mat\',17,\'24-27\');">Mt 17:24-27</a>). Now the only shekels and half-shekels bearing Jewish emblems and legends, at that time, must have been those issued by the Maccabean princes, that is, such as we have under discussion. In view of these facts the Maccabean origin of these pieces seems probable.<P>The shekels under discussion have on one side a cup, or chalice (supposed to represent the pot of manna), with the legend in Hebrew around the margin, sheqel yisra\'el, with a letter above the cup indicating the year of the reign. The reverse bears the sprig of a plant (conjectured to be Aaron\'s rod) having three buds or fruits, and on the margin the legend, yerushalem ha-qedhoshah, "Jerusalem the holy." The half-shekel has the same type, but the reverse bears the inscription, chatsi sheqel (half-shekel). The letters indicating the year have the letter called "shin" (Shenath, "year") prefixed, except for the first. This also omits the Hebrew letter "waw" (w) from qedhoshah and the second letter, "yodh" (y) from yerushalem. The term "holy" for Jerusalem is found in <a onClick="return mV(\'Isa\',48,2);">Isa 48:2</a> and other passages of the Old Testament, and is still preserved in the Arabic qudus by which the city is known today in Syria.<P>Copper, or bronze, half-and quarter-shekels are also attributed to Simon, bearing date of the 4th year. The obverse of the half-shekel has two bundles of thick-leaved branches with a citron between, and on the reverse a palm tree with two baskets filled with fruit. The legend on the obverse is shenath \'arba\' chatsi, "the fourth year a half," and on the reverse, li-ghe\'ullath tsiyon, "the redemption of Zion." The quarter-shekel has a similar type, except that the obverse lacks the baskets and the reverse has the citron only. The legend has rebhia\', "quarter," instead of "half." Another type is a cup with a margin of jewels on the obverse and a single bunch of branches with two citrons on the reverse.<P>The palm is a very common type on the coins of Judea and a very appropriate one, since it is grown there. Jericho was called the city of palms. The branches of trees in bundles illustrate the custom of carrying branches at the Feast of Tabernacles and the erection of booths made of branches for use during this feast (see <a onClick="return mV(\'Lev\',23,40);">Le 23:40</a>). The baskets of fruit may refer to the offerings of first-fruits (<a onClick="return mV(\'Deu\',26,2);">De 26:2</a>). One of the above series of coins published by Madden bears the countermark of an elephant, which was a symbol adopted by the Seleucid kings, and this is an evidence of its early date. But whatever doubts there may be as to the coins of Simon, there can be none as to those of his successor, John Hyrcanus, who reigned 135-106 BC, since they bear his name. They are all of bronze and bear the following inscription with a great number of variations, Yehochanan hacohen hagadel wachabar heyhudim, "Johanan the high priest and senate of the Jews." The reverse has a two-branched cornucopia with a poppy head rising from the center. There is some doubt as to the meaning of the word hebher in the above. It is commonly rendered "senate," taking it in the sense it seems to bear in <a onClick="return mV(\'Hsa\',6,9);">Ho 6:9</a>, "a company" or "band," here the company of elders representing the people. Judas Aristobulus (106-105 BC) issued similar coins with Hebrew legends, but with the accession of Alexander Janneus (105-78 BC) we find bilingual inscriptions on the coins, Hebrew and Greek. The obverse bears the words yehonathan ha-melekh, "Jehonathan the king," and the reverse, BASILEOS ALEXANDROU, "King Alexander." Most of his coins, however, bear Hebrew inscriptions only. All are of copper or bronze, like those of Hyrcanus and Aristobulus, and are of the denomination known to us in the New Testament as "mites" weighing from 25 to 35 grains.<P>When the Romans took possession of Palestine in 63 BC, the independent rule of the Hasmoneans came to an end, but Pompey confirmed John Hyrcanus as governor of Judea under the title of high priest. Dissensions between him and other members of his family called for interference several times on the part of the Romans. Hyrcanus was again confirmed by Julius Caesar in 47 and continued in authority until 40. It is uncertain what coins he issued, but whatever they were, they bore the type found on those of Alexander Janneus. In 40 BC, the Parthians temporarily overthrew the Roman authority in Syria and Palestine, and set Antigonus on the throne of the latter, and he reigned until 37. The coins he issued bore bilingual inscriptions like the bilinguals of Alexander. He calls himself Antigonus in Greek, and Mattathias in Hebrew, the type being a wreath on the obverse and a double cornucopia on the reverse, though some have it single. They are much heavier coins than the preceding issues. The legends are: obverse, BASILEOS ANTIGONOU, "of King Antigonus"; reverse (mattithyah ha-kohen gadhol ha-yeh(udhim), "Mattathias the high priest of the Jews."<P>The Hasmonean dynasty ended with Antigonus and that of the Herods followed. Herod the Great was the first to attain the title of king, and his coins are numerous and bear only Greek legends and are all of bronze. The earliest have the type of a helmet with cheek pieces on the obverse and the legend: BASILEOS HRODOU, and in the field to the left gamma (year 3), and on the right, a monogram. The reverse has a Macedonian shield with rays. The coin here illustrated is another type: a rude tripod on the obverse, and a cross within a wreath on the reverse, the legend being the same as given above.<P>Herod Archelaus, who reigned from 4 BC to 6 AD, issued coins with the title of ethnarch, the only coins of Palestine to bear this title. They are all of small size and some of them have the type of a galley, indicating his sovereignty over some of the coast cities, such as Caesarea and Joppa.<P>The coins of Herod Antipas (4 BC-40 AD) bear the title of tetrarch, many of them being struck at Tiberias, which he founded on the Sea of Galilee and named after the emperor Tiberius. The following is an example: obverse HER. TETR. (HERODOU TETRACHOU), with the type of a palm branch; reverse, <a href="./study/isbe/search.html?string=TIBERIAS">TIBERIAS</a>, within a wreath. Others have a palm tree entire with the date lambda-gamma (LG) and lambda-delta (LD): 33 and 34 of his reign, 29-30 AD. There are coins of Herod Philip, 4 BC-34 AD, though somewhat rare, but those of Agrippa, 37-44 AD, are numerous, considering the shortness of his reign. The most common type is a small coin ("mite") with an umbrella having a tassel-like border, on the obverse, and three ears of wheat on one stalk on the reverse. The legend reads: Basileos Agrippa, and the date is LS (year 6). Larger coins of Agrippa bear the head of the emperor (Caligula or Claudius) with the title of Sebastos (Augustus) in Greek.<P>Agrippa II was the last of the Herodian line to strike coins (48-100 AD). They were issued under Nero, whose head they sometimes bear with his name as well as that of Agrippa. They are all of the denomination of the mite (lepton).<P>In 6 AD, Judea was made a Roman province and was governed by procurators, and their coins are numerous, being issued during the reigns of Augustus, Tiberius, Claudius and Nero. They are all small and bear on the obverse the legends: <a href="./study/isbe/search.html?string=KAISAROS">KAISAROS</a> (Caesar), or <a href="./study/isbe/search.html?string=IOULIA">IOULIA</a> (Julia), or the emperor\'s name joined with Caesar. The coins of the Jews struck during the first and second revolts, 66-70 AD, and 132-135 AD, have already been alluded to with the difficulty of distinguishing them, and some have been described. They all have the types common to the purely Jewish issues; the date palm, the vine, bunches of fruit, the laurel or olive wreath, the cup or chalice, the lyre and a temple with columns. Types of animals or men they regarded as forbidden by their law. Most of them are bronze, but some are silver shekels and half-shekels, dated in the lat, 2nd and 3rd years, if we assign those of higher date to Simon the Maccabee. Those of the 1st year bear the name of Eleazar the priest, on the obverse, and on the reverse the date "first year of the redemption of Israel," shenath \'achath li-ghe\'ullath yisra\'el. Others bear the name of Simon and some that of "Simon Nesi\' Israel" ("Simon Prince of Israel"). The coins of the 2nd and 3rd years are rare. They have the type of the cup and vine leaf, or temple and lulabh. Those supposed to belong to the second revolt bear the name of Simon without Nesi\' Israel, and are therefore assigned to Simon Bar-Cochba. The example here given has the type of the temple on the obverse with what is thought to be a representation of the "beautiful gate," between the columns, and a star above. The name Simon is on the margin, the first two letters on the right of the temple and the others on the left. The legend of the reverse is: lecheruth yerushalem ("the deliverance of Jerusalem").<P>Some of the coins struck by the Romans to commemorate their victory over the Jews were struck in Palestine and some at Rome, and all bear the head of the Roman emperor on the obverse, but the reverse often exhibits Judea as a weeping captive woman, seated at the foot of a palm tree or of a Roman standard bearing a trophy. The legend is sometimes Judea capta and sometimes Judea devicta. The example given has the inscription in Greek: IOUDIAS EALOKUIAS, Judea capta.<P>There are coins of Agrippa II (the "king Agrippa" of <a onClick="return mV(\'Act\',25,26);">Ac 25:26</a>, struck in the reign of Vespasian, with his name and title on the obverse and with a deity on the reverse, holding ears of wheat in the right hand and a cornucopia in the left. The inscription reads: ETOU KSBA AGRI PPA (year 26, King Agrippa) in two lines.<P>After the revolt of Bar-Cochba and the final subjugation of the Jews by Hadrian, Jerusalem was made a Roman colony and the name was changed to Aelia Capitolina. A series of coins was struck, having this title, which continued until the reign of Valerianus, 253-260 AD. These coins were all of copper or bronze, but silver pieces were in circulation, struck at Rome or at some of the more favored towns in Syria, such as Antioch. These were denarii and tetradrachms, the former being about one-fourth the weight of the latter which were known as staters (<a onClick="return mV(\'Mat\',17,27);">Mt 17:27</a>). The piece referred to was the amount of tribute for two persons, and as the amount paid by one was the half-shekel (<a onClick="return mV(\'Mat\',17,24);">Mt 17:24</a>), this piece must have been the equivalent of the shekel or tetradrachm.``138';
isbe[6138]='Money, Current`kur\'-ent (\'obher, "passing," <a onClick="return mV(\'Gen\',28,16);">Ge 28:16</a>; <a onClick="return mV(\'2Ki\',12,4);">2Ki 12:4 (Hebrew 5)</a>): The text and translation in <a onClick="return mV(\'2Ki\',12,4);">2Ki 12:4</a> are uncertain and difficult. See the Revised Version margin. The reference is probably not to a money standard, but to a poll tax which was levied in addition to the free-will offering. <a onClick="return mV(\'Gen\',23,16);">Ge 23:16</a> implies the existence of a standard shekel and also probably the use of the precious metals in stamped bars or ingots of an approximately fixed weight or value, a primitive coinage. Code of Hammurabi presupposes these pieces, and records in cuneiform writing discovered in Cappadocia indicate that shekel pieces with a seal stamp were in use in Asia Minor in the time of Hammurabi (Sayce, Contemporary Review, August, 1907, XCII, 259ff). The existence of these pieces did not do away with the custom of weighing money, a practice which obtained in Israel down to the time of the exile (<a onClick="return mV(\'Jer\',32,10);">Jer 32:10</a>).``13';
isbe[6139]='Money, Love of`(philarguria, <a onClick="return mV(\'1Ti\',6,10);">1Ti 6:10</a>, literally, "love of silver"; compare corresponding "lovers of money" (<a onClick="return mV(\'Luk\',16,14);">Lu 16:14</a>; <a onClick="return mV(\'2Ti\',3,2);">2Ti 3:2</a>), equivalent to "avarice"): The vice that seeks to retain and hoard all that is acquired (Trench, Synonyms of the New Testament, xxiv); described as "a root of all kinds of evil."`<a href="./study/isbe/search.html?string=COVETOUSNESS">COVETOUSNESS</a>`1';
isbe[6140]='Money, Sin``<a href="./study/isbe/search.html?string=SIN+MONEY">SIN MONEY</a>; <a href="./study/isbe/search.html?string=SIN+OFFERING">SIN OFFERING</a>`1';
isbe[6141]='Money-Changers`chan\'-jers (kollubistes, from kollubos, "a small coin," so "a money-changer," or "banker" (<a onClick="return mV(\'Mat\',21,12);">Mt 21:12</a>; <a onClick="return mV(\'Mar\',11,15);">Mr 11:15</a>; "changers" in <a onClick="return mV(\'Jhn\',2,15);">Joh 2:15</a>; compare <a onClick="return mV(\'Jhn\',2,14);">Joh 2:14</a>, where kermatistes, "a dealer in small bits," or "change," is also rendered "changers"); compare trapezites, "one who sits at a table," "a money-changer," "a banker" or "broker"; one who both exchanges money for a small fee and pays interest on deposits (<a onClick="return mV(\'Mat\',25,27);">Mt 25:27</a>, the King James Version "exchangers," the American Standard Revised Version "bankers")): The profession of money-changer in Palestine was made necessary by the law requiring every male Israelite who had reached the age of 20 years to pay into the treasury of the sanctuary a half-shekel at every numbering of the people, an offering to Yahweh, not even the poor being exempt. It seems to have become an annual tax, and was to be paid in the regular Jewish half-shekel (<a onClick="return mV(\'Exd\',30,\'11-15\');">Ex 30:11-15</a>). Since the Jews, coming up to the feasts, would need to exchange the various coins in common circulation for this Jewish piece, there were money-changers who exacted a premium for the exchange. This fee was a kollubos (about 31 cents in U.S. money, i.e. in 1915), hence, the name kollubistes. The Jews of Christ\'s day came from many parts of the world, and the business of exchanging foreign coins for various purposes became a lucrative one, the exchangers exacting whatever fee they might. Because of their greed and impiety, Jesus drove them from the courts of the temple.``137';
isbe[6142]='Monster`mon\'-ster.`<a href="./study/isbe/search.html?string=DRAGON">DRAGON</a>; <a href="./study/isbe/search.html?string=SEA+MONSTER">SEA-MONSTER</a>`1';
isbe[6143]='Month`munth (chodhesh, yerach; men): Chodhesh is strictly the "new moon," the appearance of which marked the beginning of the month, commonly indicated by ro\'sh ha-chodhesh. Yerach is derived from yareach, "moon," which comes from the verb that means "to wander," "to make a circuit." Thus the month was lunar, the period of the moon\'s circuit. The Greek men also meant "moon," from the Sanskrit ma, "to measure," the Latin mensis and our "moon" being derived from the same root.<P>Chodhesh, or rather ro\'sh ha-chodhesh, was observed as a festival (<a onClick="return mV(\'1Sa\',20,5,18,24);">1Sa 20:5,18,24</a>; <a onClick="return mV(\'Isa\',1,14);">Isa 1:14</a>).`<a href="./study/isbe/search.html?string=CALENDAR">CALENDAR</a>; <a href="./study/isbe/search.html?string=TIME">TIME</a>; <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`138';
isbe[6144]='Monthly; Prognosticators`munth\'-li, prog-nos\'-ti-ka-terz.`<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>`1';
isbe[6145]='Monument`mon\'-u-ment (<a onClick="return mV(\'Isa\',65,4);">Isa 65:4</a> the King James Version).`<a href="./study/isbe/search.html?string=VAULT">VAULT</a>`1';
isbe[6146]='Mooli`mo\'-o-li (Codex Alexandrinus Mooli; Codex Vaticanus Moolei; the King James Version Moli): Son of Merari and grandson of Levi (1Esdras 8:47) equals "Mahli" in <a onClick="return mV(\'Ezr\',8,18);">Ezr 8:18</a> (see <a onClick="return mV(\'Exd\',6,16,19);">Ex 6:16,19</a>).``1';
isbe[6147]='Moon`moon (yareach; meaning obscure—probably "wanderer"; by some given as "paleness"; selene): The moon was very early worshipped by the nations of the Far East as a divinity or the representative of one or more deities. These deities were both masculine and feminine. In Assyria and Babylonia the most common name for the moon-god was Sin or Sen. In Babylonia he was also called Aku and Nannara. In Egypt the moon was representative of several deities, all masculine. The chief of these was Thoth the god of knowledge, so called because the moon was the measurer of time. Babylonia has, also, Aa, the goddess of the moon, as the consort of the sun, while her equivalent was known in Phoenicia as Ashtaroth-karnaim. This personification and worship of the moon among the nations who were neighbors to Palestine was but part of an elaborate Nature-worship found among these people. Nor was this worship always separated from Palestine by geographical lines. It crept into the thought and customs of the Hebrews and in a sense affected their religious conceptions and ceremonies. They fell into the habit of making direct homage to sun, moon and stars, as is evidenced by <a onClick="return mV(\'Job\',31,26,27);">Job 31:26,27</a>; <a onClick="return mV(\'Jer\',44,17);">Jer 44:17</a>, and even <a onClick="return mV(\'Isa\',8,18);">Isa 8:18</a> (see <a href="./study/isbe/search.html?string=CRESCENTS">CRESCENTS</a>). Moses seems to have forewarned his people against the danger of this form of worship (<a onClick="return mV(\'Deu\',4,19);">De 4:19</a>).<P>The actual worship of the moon and the idolatry consequent thereon seems to have touched the Hebrews, though this is disputed by some. It would seem difficult to explain <a onClick="return mV(\'2Ki\',21,3);">2Ki 21:3</a> upon any other supposition, and in <a onClick="return mV(\'2Ki\',23,4,5);">2Ki 23:4,5</a> we have a clear statement that Josiah put down the worship of the moon among the people and silenced the priests of this form of worship.<P>Certain forms of the adoration of the moon, or superstitious fear of baneful influences as coming from the moon, still abound in some sections of the world. In fact in nearly all sections modified forms of old superstitions still hold sway and yield but slowly to scientific knowledge.<P>The eclipses of the moon were naturally given a religious significance inasmuch as the Hebrew knowledge of them did not rise much above awe and wonder (<a onClick="return mV(\'Isa\',13,10);">Isa 13:10</a>; <a onClick="return mV(\'Joe\',2,31);">Joe 2:31</a>; <a onClick="return mV(\'Mat\',24,29);">Mt 24:29</a>; <a onClick="return mV(\'Mar\',13,24);">Mr 13:24</a>). Other passages causing interference with the constancy of the moon to foreshadow great events can be found in <a onClick="return mV(\'Jer\',13,16);">Jer 13:16</a>; <a onClick="return mV(\'Eze\',32,7,8);">Eze 32:7,8</a>; <a onClick="return mV(\'Rev\',8,12);">Re 8:12</a>. An interesting passage and most difficult of interpretation is <a onClick="return mV(\'Rev\',12,1);">Re 12:1</a>. It is frequently interpreted as a revelation in symbolism of the glory of the church clothed with the light and radiating the truth of God.`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>; <a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>`158';
isbe[6148]='Moon, New``<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>; <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>; <a href="./study/isbe/search.html?string=FASTS+AND+FEASTS">FASTS AND FEASTS</a>`1';
isbe[6149]='Moossias`mo-os\'-i-as (Codex Vaticanus Moosseias; Codex Alexandrinus Moos Sias; the King James Version, Moosias, mo-o-si\'as): One of those who had taken a "strange wife" (1Esdras 9:31) equals "Maaseiah" in <a onClick="return mV(\'Ezr\',10,30);">Ezr 10:30</a>.``1';
isbe[6150]='Moph`mof.`<a href="./study/isbe/search.html?string=MEMPHIS">MEMPHIS</a>`1';
isbe[6151]='Morality`mo-ral\'-i-ti.`<a href="./study/isbe/search.html?string=ETHICS">ETHICS</a>`1';
isbe[6152]='Morashtite`mo-rash\'-tit (hamorashti; the King James Version, Morasthite, mo-ras\'-thit): Gentilic designation of the prophet Micah (<a onClick="return mV(\'Jer\',26,18);">Jer 26:18</a>; <a onClick="return mV(\'Mic\',1,1);">Mic 1:1</a>).`<a href="./study/isbe/search.html?string=MORESHETH+GATH">MORESHETH-GATH</a>`1';
isbe[6153]='Mordecai`mor\'-de-ki, mor-de-ka\'-i (mordekhay; Mardochaios): An Israelite of the tribe of Benjamin, whose fate it has been to occupy a distinguished place in the annals of his people. His great-grandfather, Kish, had been carried to Babylon along with Jeconiah, king of Judah (<a onClick="return mV(\'Est\',2,\'5-6\');">Es 2:5-6</a>). For nearly 60 years before the scenes narrated in Esther, in which Mordecai was greatly concerned, took place, the way to Palestine had been open to the Israelites; but neither his father, Jair, nor afterward himself chose to return to the ancient heritage. This seems to have been the case also with the rest of his house, as it was with the vast majority of the Israelite people; for his uncle died in Persia leaving his motherless daughter, Hadassah, to the care of Mordecai. Employed in the royal palace at Susa, he attracted, through the timely discovery of a plot to assassinate the king, the favorable notice of Xerxes, and in a short time became the grand vizier of the Persian empire. He has been believed by many to have been the author of the Book of Esther; and in the earliest known notice of the Feast of Purim, outside of the book just mentioned, that festival is closely associated with his name. It is called "the day of Mordecai" (2Macc 15:36). The apocryphal additions to Esther expatiate upon his greatness, and are eloquent of the deep impression which his personality and power had made upon the Jewish people. Lord Arthur Hervey has suggested the identification of Mordecai with Matacas, or Natacas, the powerful favorite and minister of Xerxes who is spoken of by Ctesias, the Greek historian. Few have done more to earn a nation\'s lasting gratitude than Mordecai, to whom, under God, the Jewish people owe their preservation.``180';
isbe[6154]='Moreh, Hill of`mo\'-re (gibh\'ath ha-moreh, "hill of the teacher"; Codex Vaticanus Gabaathamora; Codex Alexandrinus, tou bomou tou Abor): The Hebrew moreh is derived from the verb yarah, "to teach," "to direct," and indicates one who directs, or gives oracular answers. We might therefore read "hill of the teacher," the height being associated with such a person who had his seat here. The hill is named only in describing the position of the Midianites before Gideon\'s attack (<a onClick="return mV(\'Jdg\',7,1);">Jud 7:1</a>). If the identification of the Well of Harod with \'Ain Jalud is correct, Gideon must have occupied the slopes to the east of Jezreel. The Midianite camp was in the valley of Jezreel (<a onClick="return mV(\'Jdg\',6,33);">Jud 6:33</a>). The Hebrew text in <a onClick="return mV(\'Jdg\',7,1);">Jud 7:1</a>, which has probably suffered some corruption, seems to mean that the Midianites lay north of the position held by Gideon, their lines running from the hill of Moreh in the plain. The hill can hardly have been other than Jebel ed-Duchy, often called Little Hermon, which rises boldly from the northern edge of the vale of Jezreel, with Shunem (Solam) lying at its western foot. Moore ("Judges," ICC, 200) would lay the scene in the neighborhood of Shechem, but there is no good reason to doubt the accuracy of the tradition which places it at the eastern end of the plain of Esdraelon.``54';
isbe[6155]='Moreh, Oak of`(\'elon moreh, "terebinth of the teacher"; ten drun ten hupselen; the King James Version Plain of Moreh): It seems probable that the place here intended may be the same as that mentioned in <a onClick="return mV(\'Deu\',11,30);">De 11:30</a> (\'elone moreh, "terebinths of Moreh," the King James Version "plains," the Revised Version (British and American) "oaks," the Revised Version margin "terebinths"). Both are defined as near to Shechem. The position cannot be identified today. The tree or trees were evidently a place of resort for those who wished to consult a moreh. See <a href="./study/isbe/search.html?string=MOREH,+HILL+OF">MOREH, HILL OF</a>. To this day in Palestine trees are often regarded with a certain religious awe as the habitation of spirits. Isolated terebinths receive much veneration. The present writer has often seen such trees with multitudinous rags of all colors attached to them by the peasantry as evidence of their homage.`<a href="./study/isbe/search.html?string=MEONENIM">MEONENIM</a>`54';
isbe[6156]='Moresheth-Gath`mo\'-resh-eth-gath, mo-resh\'-eth-gath (moresheth gath, "inheritance or possession of Gath"; Septuagint kleronomias Geth): A place mentioned only in <a onClick="return mV(\'Mic\',1,14);">Mic 1:14</a>. It must have been in the vicinity of Gath as the meaning of the name would indicate, and was the home of the prophet Micah (<a onClick="return mV(\'Mic\',1,1);">Mic 1:1</a>; <a onClick="return mV(\'Jer\',26,18);">Jer 26:18</a>). It was probably in the vicinity of Mareshah (<a onClick="return mV(\'Mic\',1,15);">Mic 1:15</a>). Jerome, in his preface to his work on Micah, places it a little to the east of Eleutheropolis (Beit Jibrin), and it would be natural to find it there if the latter place was Gath as some think. Robinson (BR, II, 68) found ruins of a village between one and two miles east of Beit Jibrin. It must have been among the foot-hills of Judah between the hill country and the Philistine plain on the route from Jerusalem to Lachish, Gaza and Egypt. Mareshah was certainly in that region, and the prophecy of Micah mentions towns and villages in the Shephelah and the Philistine country as though they were familiar to him (see HGHL and G. A. Smith, "Micah," in his Minor Prophets).``138';
isbe[6157]='Moriah, Land of`mo-ri\'-a (\'erec ha-moriyah; eis ten genitive ten hupselen): Abraham was directed by God to take his son Isaac, to go into the land of Moriah, and there to offer him for a burnt offering (<a onClick="return mV(\'Gen\',22,2);">Ge 22:2</a>) upon a mountain which God would show him. This land is mentioned only here, and there is little to guide us in trying to identify it. A late writer (<a onClick="return mV(\'2Ch\',3,1);">2Ch 3:1</a>) applies the name of Moriah to the mount on which Solomon\'s Temple was built, possibly associating it with the sacrifice of Isaac. A similar association with this mountain may have been in the mind of the writer of <a onClick="return mV(\'Gen\',22,\'1-\');">Ge 22</a> (see <a onClick="return mV(\'Gen\',22,14);">22:14</A>), who, of course, wrote long after the events described (Driver). But in <a onClick="return mV(\'Gen\',22,2);">22:2</A> no special mountain is indicated.<P>Abraham journeyed from the land of the Philistines, and on the 3rd day he saw the place afar off (<a onClick="return mV(\'Gen\',22,4);">Ge 22:4</a>). This naturally suggests some prominent mountain farther north than Jerusalem. The description could hardly apply to Jerusalem in any case, as it could not be seen "afar off" by one approaching either from the south or the west. The Samaritans lay the scene of sacrifice on Mt. <a href="./study/isbe/search.html?string=GERIZIM">GERIZIM</a> (which see).<P>Instead of "Moriah" in this passage Peshitta reads "Amorites." This suggests a possible emendation of the text, which, if it be accepted, furnishes a more definite idea of the land within which that memorable scene was enacted. Both Jerusalem and Gerizim, however, lay within the boundaries of the land of the Amorites. No doubt the enmity existing between the Jews and the Samaritans led them each to glorify their own holy places to the detriment of those of their rivals. Little stress can therefore be laid upon their identifications. With our present knowledge we must be content to leave the question open.``54';
isbe[6158]='Morning`mor\'-ning: There are several Hebrew and Greek words which are rendered "morning," the most common in Hebrew being boqer, which occurs 180 times. It properly means "the breaking forth of the light," "the dawn," as in <a onClick="return mV(\'Gen\',19,27);">Ge 19:27</a>; <a onClick="return mV(\'Jdg\',19,8,25,27);">Jud 19:8,25,27</a>. Another word with the same meaning is shachar (<a onClick="return mV(\'Gen\',19,15);">Ge 19:15</a>; <a onClick="return mV(\'Neh\',4,21);">Ne 4:21</a>; <a onClick="return mV(\'Isa\',58,8);">Isa 58:8</a>). mishchar ("womb of the morning," <a onClick="return mV(\'Psa\',110,3);">Ps 110:3</a>) is a poetical term derived from. the same root. See <a href="./study/isbe/search.html?string=HIND+OF+THE+MORNING">HIND OF THE MORNING</a>. noghah, naghha\' (<a onClick="return mV(\'Dan\',6,19);">Da 6:19 (Hebrew 20)</a>), mean "brightness." hashkem, comes from hishkim, "to load an animal" (for a journey), and as the nomads are accustomed to do this early in the morning it came to mean early morning (<a onClick="return mV(\'1Sa\',17,16);">1Sa 17:16</a>).<P>In the New Testament orthros, is properly "dawn," and is used for early morning (<a onClick="return mV(\'Jhn\',8,2);">Joh 8:2</a>; <a onClick="return mV(\'Act\',5,21);">Ac 5:21</a>), and<P>proia signifies the same (<a onClick="return mV(\'Mat\',27,1);">Mt 27:1</a>). proi, "early," is an adverb and means early in the morning (<a onClick="return mV(\'Mar\',1,35);">Mr 1:35</a>). Morning as an adjective is orthrinos (<a onClick="return mV(\'Rev\',22,16);">Re 22:16</a>), or proinos (1Esdras 1:11; 5:50; <a onClick="return mV(\'Rev\',2,28);">Re 2:28</a>; <a onClick="return mV(\'Rev\',22,16);">22:16</a>).`<a href="./study/isbe/search.html?string=BETIMES">BETIMES</a>`138';
isbe[6159]='Morning Watch`\'ash-moreth ha-boker (<a onClick="return mV(\'Exd\',14,24);">Ex 14:24</a>; <a onClick="return mV(\'1Sa\',11,11);">1Sa 11:11</a>); in Judith 12:5 for heothine phulake; compare Sirach 55:6; 1Macc 5:30): The last portion of the night.`<a href="./study/isbe/search.html?string=WATCH">WATCH</a>`1';
isbe[6160]='Morning, Wings of``<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[6161]='Morrow After the Sabbath`(mochorath, or mochoratham, "the morrow," or "tomorrow," "the day following"; mochorath ha-shabbath, "the day after the Sabbath," i.e. the first day of the week): The first day of the week was designated for the formal offering of the first-fruits in the form of wave-sheaves (<a onClick="return mV(\'Lev\',23,11);">Le 23:11</a>), and of the wave-loaves 50 days later (<a onClick="return mV(\'Lev\',23,16,17);">Le 23:16,17</a>). This recognition of an after-Sabbath during festive periods has its counterpart in the later ecclesiastical practice of celebrating not only Easter Sunday, but also Easter Monday, etc., and undoubtedly was a factor in establishing the custom which transferred the sanctity of the Sabbath to the first day of the week after the resurrection of our Lord.``77';
isbe[6162]='Morrow, Tomorrow`mor\'-o, too-mor\'-o: Two words are used in the Old Testament in this meaning: boqer, which properly means "dawn," or "morning," and machar, properly the same, but used for the next morning and hence, "tomorrow," like the German morgen. The derivative mo-chorath, is "the following day," "all the next day," especially after yom ("day"), but usually coupled with a noun following, as in <a onClick="return mV(\'Lev\',23,11);">Le 23:11</a>, mochorath ha-shabbath "day after the Sabbath." It is also used adverbially for "on the morrow," as in <a onClick="return mV(\'Gen\',19,34);">Ge 19:34</a>.<P>In the Greek of the New Testament we find aurion (<a onClick="return mV(\'Mat\',6,34);">Mt 6:34</a>, etc.), commonly used, but hexes, also occurs (<a onClick="return mV(\'Act\',25,17);">Ac 25:17</a> the King James Version, where the Revised Version (British and American) renders more exactly "the next day"); epaurion, is "on the morrow" (<a onClick="return mV(\'Act\',10,9,23,24);">Ac 10:9,23,24</a>).``138';
isbe[6163]='Morsel`mor\'-sel (brosis): Found only in <a onClick="return mV(\'Hbr\',12,16);">Heb 12:16</a> the King James Version, "For one morsel of meat (the Revised Version (British and American) "mess of meat") sold his birthright," literally, "for one eating," i.e. one meal. The Great Bible (Cranmer\'s) has "for one mease of meat."``1';
isbe[6164]='Mortal; Mortality`mor\'-tal, mor-tal\'-i-ti (thnetos to thneton): The meaning is "subject to death" (<a onClick="return mV(\'Rom\',6,12);">Ro 6:12</a>; <a onClick="return mV(\'Rom\',8,11);">8:11</a>; <a onClick="return mV(\'1Cr\',15,53,54);">1Co 15:53,54</a>; in <a onClick="return mV(\'2Cr\',5,4);">2Co 5:4</a> the Revised Version (British and American) has "what is mortal"). In <a onClick="return mV(\'Job\',4,17);">Job 4:17</a>, the Hebrew word is \'enosh, "mortal man."`<a href="./study/isbe/search.html?string=IMMORTAL">IMMORTAL</a>`1';
isbe[6165]='Mortar`mor\'-ter (medhokhah (<a onClick="return mV(\'Num\',11,8);">Nu 11:8</a>), makhtesh (<a onClick="return mV(\'Pro\',27,22);">Pr 27:22</a>)): A hollowed stone or vessel in which grain or other substance was pounded or beaten with a pestle. The Israelites used a mortar in which to beat the manna in the wilderness (<a onClick="return mV(\'Num\',11,8);">Nu 11:8</a>), and <a onClick="return mV(\'Pro\',27,22);">Pr 27:22</a> declares, "Though thou shouldst bray a fool in a mortar with a pestle...yet will not his foolishness depart from him," i.e. it is inherent and ineradicable. Some have supposed an allusion to an oriental mode of punishment by pounding the criminal to death in a mortar, but this is unlikely. In illustration of <a onClick="return mV(\'Pro\',27,22);">Pr 27:22</a> such proverbs are quoted as "Though you beat that loose woman in a mortar, she will not leave her ways." See also <a href="./study/isbe/search.html?string=BRAY">BRAY</a>. For "mortar" (the King James Version "morter").`<a href="./study/isbe/search.html?string=BITUMEN">BITUMEN</a>`132';
isbe[6166]='Mortgage`mor\'-gaj (arabh): To give or be security as a part of bartering, give pledges, become surety. In time of great need for food, "Some also there were that said, We are mortgaging (the King James Version "have mortgaged") our fields," etc. (<a onClick="return mV(\'Neh\',5,3);">Ne 5:3</a>).`<a href="./study/isbe/search.html?string=SURETY">SURETY</a>`1';
isbe[6167]='Mortify`mor\'-ti-fi (<a onClick="return mV(\'Rom\',8,13);">Ro 8:13</a> the King James Version and the English Revised Version, thanatoo, the English Revised Version margin "make to die," and <a onClick="return mV(\'Col\',3,5);">Col 3:5</a>, nekroo, the English Revised Version margin "make dead"): This sense of mortify is obsolete in modern English, and the American Standard Revised Version in both places substitutes "put to death," with great advantage. The context in both passages goes to the heart of Paul\'s doctrine of the union of the believer with Christ. This union has given the soul a new life, flowing (through the Spirit) from Christ in the heavenly world, so that the remnants of the old corrupt life-principle are now dangerous excrescences. Hence, they are to be destroyed, just as a surgeon removes the remnants of a diseased condition after the reestablishment of healthy circulation. The interpreter must guard against weakening Paul\'s language into some such phrase as "subdue all that is inconsistent with the highest ideals," for Paul views the union with Christ as an intensely real, quasi-physical relation.``48';
isbe[6168]='Moserah`mo-se\'-ra, mo\'-se-ra (mocerah, "bond"): Perhaps Moser with the "he" of locale (direction), "to Moser" (<a onClick="return mV(\'Deu\',10,6);">De 10:6</a>).`<a href="./study/isbe/search.html?string=MOSEROTH">MOSEROTH</a>`1';
isbe[6169]='Moseroth`mo-se\'-roth, mo\'-se-roth, -roth (moceroth, "bonds"): A desert camp of the Israelites between Hashmonah and Bene-jaakan (<a onClick="return mV(\'Num\',33,30,31);">Nu 33:30,31</a>). It is probably the same as Moserah (<a onClick="return mV(\'Deu\',10,6);">De 10:6</a>), though in that passage the name follows Bene-jaakan. There Aaron died and was buried.`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[6170]='Moses`mo\'-zez, mo\'-ziz (mosheh; Egyptian mes, "drawn out," "born"; Septuagint Mouse(s)). The great Hebrew national hero, leader, author, law-giver and prophet.<P><b>I. LIFE</b><P class="in15">1. Son of Levi<P class="in15">2. Foundling Prince<P class="in15">3. Friend of the People<P class="in15">4. Refuge in Midian<P class="in15">5. Leader of Israel<P><b>II. WORK AND CHARACTER</b><P class="in15">1. The Author<P class="in15">2. The Lawgiver<P class="in15">3. The Prophet<P><b>LITERATURE</b><hr /><P>The traditional view of the Jewish church and of the Christian church, that Moses was a person and that the narrative with which his life-story is interwoven is real history, is in the main sustained by commentators and critics of all classes.<P>It is needless to mention the old writers among whom these questions were hardly under discussion. Among the advocates of the current radical criticism may be mentioned Stade and Renan, who minimize the historicity of the Bible narrative at this point. Renan thinks the narrative "may be very probable." Ewald, Wellhausen, Robertson Smith, and Driver, while finding many flaws in the story, make much generally of the historicity of the narrative.<P>The critical analysis of the Pentateuch divides this life-story of Moses into three main parts, J, E, and the Priestly Code (P), with a fourth, D, made up mainly from the others. Also some small portions here and there are given to R, especially the account of Aaron\'s part in the plagues of Egypt, where his presence in a J-document is very troublesome for the analytical theory. It is unnecessary to encumber this biography with constant cross-references to the strange story of Moses pieced together out of the rearranged fragments into which the critical analysis of the Pentateuch breaks up the narrative. It is recognized that there are difficulties in the story of Moses. In what ancient life-story are there not difficulties? If we can conceive of the ancients being obliged to ponder over a modern life-story, we can easily believe that they would have still more difficulty with it. But it seems to very many that the critical analysis creates more difficulties in the narrative than it relieves. It is a little thing to explain by such analysis some apparent discrepancy between two laws or two events or two similar incidents which we do not clearly understand. It is a far greater thing so to confuse, by rearranging, a beautiful, well-articulated biography that it becomes disconnected—indeed, in parts, scarcely makes sense.<P>The biographical narrative of the Hebrew national hero, Moses, is a continuous thread of history in the Pentateuch. That story in all its simplicity and symmetry, but with acknowledgment of its difficulties as they arise, is here to be followed.<P>I. Life.<P>1. Son of Levi:<P>The recorded story of Moses\' life falls naturally into five rather unequal parts: "And there went a man of the house of Levi, and took to wife a daughter of Levi" (<a onClick="return mV(\'Exd\',2,1);">Ex 2:1</a>). The son of Levi born of that union became the greatest man among mere men in the whole history of the world. How far he was removed in genealogy from Levi it is impossible to know. The genealogical lists (<a onClick="return mV(\'Gen\',46,11);">Ge 46:11</a>; <a onClick="return mV(\'Exd\',6,\'16-20\');">Ex 6:16-20</a>; <a onClick="return mV(\'Num\',3,\'14-28\');">Nu 3:14-28</a>; <a onClick="return mV(\'Num\',26,\'57-59\');">26:57-59</a>; <a onClick="return mV(\'1Ch\',6,\'1-3\');">1Ch 6:1-3</a>) show only 4 generations from Levi to Moses, while the account given of the numbers of Israel at the exodus (<a onClick="return mV(\'Exd\',12,37);">Ex 12:37</a>; <a onClick="return mV(\'Exd\',38,26);">38:26</a>; <a onClick="return mV(\'Num\',1,46);">Nu 1:46</a>; <a onClick="return mV(\'Num\',11,21);">11:21</a>) imperatively demand at least 10 or 12 generations. The males alone of the sons of Kohath "from a month old and upward" numbered at Sinai 8,600 (<a onClick="return mV(\'Num\',3,27,28);">Nu 3:27,28</a>). It is evident that the extract from the genealogy here, as in many other places (<a onClick="return mV(\'1Ch\',23,15);">1Ch 23:15</a>; <a onClick="return mV(\'1Ch\',26,24);">26:24</a>; <a onClick="return mV(\'Ezr\',7,\'1-5\');">Ezr 7:1-5</a>; <a onClick="return mV(\'Ezr\',8,1,2);">8:1,2</a>; compare <a onClick="return mV(\'1Ch\',6,\'3-14\');">1Ch 6:3-14</a>; <a onClick="return mV(\'Mat\',1,\'1-17\');">Mt 1:1-17</a>; <a onClick="return mV(\'Luk\',3,\'23-38\');">Lu 3:23-38</a>) is not complete, but follows the common method of giving important heads of families. The statement concerning Jochebed: "And she bare unto Amram Aaron and Moses, and Miriam their sister" (<a onClick="return mV(\'Num\',26,59);">Nu 26:59</a>) really creates no difficulty, as it is likewise said of Zilpah, after the mention of her grandsons, "And these she bare unto Jacob" (<a onClick="return mV(\'Gen\',46,17,18);">Ge 46:17,18</a>; compare <a onClick="return mV(\'Gen\',46,24,25);">46:24,25</A>).<P>The names of the immediate father and mother of Moses are not certainly known. The mother "saw him that he was a goodly child" (<a onClick="return mV(\'Exd\',2,2);">Ex 2:2</a>). So they defied the commandment of the king (<a onClick="return mV(\'Exd\',1,22);">Ex 1:22</a>), and for 3 months hid him instead of throwing him into the river.<P>2. Foundling Prince:<P>The time soon came when it was impossible longer to hide the child (Josephus, Ant, II, ix, 3-6). The mother resolved upon a plan which was at once a pathetic imitation of obedience to the commandment of the king, an adroit appeal to womanly sympathy, and, if it succeeded, a subtle scheme to bring the cruelty of the king home to his own attention. Her faith succeeded. She took an ark of bulrushes (<a onClick="return mV(\'Exd\',2,3,4);">Ex 2:3,4</a>; compare <a href="./study/isbe/search.html?string=ARK+OF+BULRUSHES">ARK OF BULRUSHES</a>), daubed it with bitumen mixed with the sticky slime of the river, placed in this floating vessel the child of her love and faith, and put it into the river at a place among the sedge in the shallow water where the royal ladies from the palace would be likely to come down to bathe. A sister, probably Miriam, stood afar off to watch (<a onClick="return mV(\'Exd\',2,3,4);">Ex 2:3,4</a>). The daughter of Pharaoh came down with her great ladies to the river (<a onClick="return mV(\'Exd\',2,\'5-10\');">Ex 2:5-10</a>). The princess saw the ark among the sedge and sent a maid to fetch it. The expectation of the mother was not disappointed. The womanly sympathy of the princess was touched. She resolved to save this child by adopting him. Through the intervention of the watching sister, he was given to his own mother to be nursed (<a onClick="return mV(\'Exd\',2,\'7-9\');">Ex 2:7-9</a>). "And the child grew, and she brought him unto Pharaoh\'s daughter, and he became her son" (<a onClick="return mV(\'Exd\',2,10);">Ex 2:10</a>). Thus, he would receive her family name.<P>Royal family names in Egypt then were usually compounded of some expression of reverence or faith or submission and the name of a god, e.g. "loved of," "chosen of," "born of," Thoth, Ptah, Ra or Amon. At this period of Egyptian history, "born of" (Egyptian mes, "drawn out") was joined sometimes to Ah, the name of the moon-god, making Ahmes, or Thoth, the scribe-god, so Thothmes, but usually with Ra, the sun-god, giving Rames, usually anglicized Rameses or Ramoses.<P>It was the time of the Ramesside dynasty, and the king on the throne was Rameses II. Thus the foundling adopted by Pharaoh\'s daughter would have the family name Mes or Moses. That it would be joined in the Egyptian to the name of the sungod Ra is practically certain. His name at court would be Ramoses. But to the oriental mind a name must mean something. The usual meaning of this royal name was that the child was "born of" a princess through the intervention of the god Ra. But this child was not "born of" the princess, so falling back upon the primary meaning of the word, "drawn out," she said, "because I drew him out of the water" (<a onClick="return mV(\'Exd\',2,10);">Ex 2:10</a>). Thus, Moses received his name. Pharaoh\'s daughter may have been the eldest daughter of Rameses II, but more probably was the daughter and eldest child of Seti Merenptah I, and sister of the king on the throne. She would be lineal heir to the crown but debarred by her sex. Instead, she bore the title "Pharaoh\'s Daughter," and, according to Egyptian custom, retained the right to the crown for her first-born son. A not improbable tradition (Josephus, Ant, II, ix, 7) relates that she had no natural son, and Moses thus became heir to the throne, not with the right to supplant the reigning Pharaoh, but to supersede any of his sons.<P>Very little is known of Moses\' youth and early manhood at the court of Pharaoh. He would certainly be educated as a prince, whose right it probably was to be initiated into the mysteries. Thus he was "instructed in all the wisdom of the Egyptians" (<a onClick="return mV(\'Act\',7,22);">Ac 7:22</a>), included in which, according to many Egyptologists, was the doctrine of one Supreme God.<P>Many curious things, whose value is doubtful, are told of Moses by Josephus and other ancient writers (Josephus, Ant, II, ix, 3; xi; CAp, I, 31; compare DB; for Mohammedan legends, see Palmer, The Desert of the Exodus, Appendix; for rabbinical legends, see Jewish Encyclopedia). Some of these traditions are not incredible but lack authentication. Others are absurd. Egyptologists have searched with very indifferent success for some notice of the great Hebrew at the Egyptian court.<P>3. Friend of the People:<P>But the faith of which the Epistle to the Hebrews speaks (<a onClick="return mV(\'Hbr\',11,\'23-28\');">Heb 11:23-28</a>) was at work. Moses "refused to be called the son of Pharaoh\'s daughter" (<a onClick="return mV(\'Exd\',2,\'11-14\');">Ex 2:11-14</a>; <a onClick="return mV(\'Act\',7,24);">Ac 7:24</a>). Whether he did so in word, by definite renunciation, or by his espousal of the cause of the slave against the oppressive policy of Pharaoh is of little importance. In either case he became practically a traitor, and greatly imperiled his throne rights and probably his civil rights as well. During some intervention to ameliorate the condition of the state slaves, an altercation arose and he slew an Egyptian (<a onClick="return mV(\'Exd\',2,11,12);">Ex 2:11,12</a>). Thus, his constructive treason became an overt act. Discovering through the ungrateful reproaches of his own kinsmen (<a onClick="return mV(\'Act\',7,25);">Ac 7:25</a>) that his act was known, he quickly made decision, "choosing rather to share ill treatment with the people of God," casting in his lot with slaves of the empire, rather than "to enjoy the pleasures of sin for a season," amid the riotous living of the young princes at the Egyptian court; "accounting the reproach of Christ" his humiliation, being accounted a nobody ("Can any good thing come out of Nazareth?") as "greater riches than the treasures of Egypt" (<a onClick="return mV(\'Hbr\',11,25,26);">Heb 11:25,26</a>; <a onClick="return mV(\'Act\',7,\'25-28\');">Ac 7:25-28</a>). He thought to be a nobody and do right better than to be a tyrant and rule Egypt.<P>4. Refuge in Midian:<P>Moses fled, "not fearing the wrath of the king" (<a onClick="return mV(\'Hbr\',11,27);">Heb 11:27</a>), not cringing before it or submitting to it, but defying it and braving all that it could bring upon him, degradation from his high position, deprivation of the privileges and comforts of the Egyptian court. He went out a poor wanderer (<a onClick="return mV(\'Exd\',2,15);">Ex 2:15</a>). We are told nothing of the escape and the journey, how he eluded the vigilance of the court guards and of the frontier-line of sentinels. The friend of slaves is strangely safe while within their territory. At last he reached the Sinaitic province of the empire and hid himself away among its mountain fastnesses (<a onClick="return mV(\'Exd\',2,15);">Ex 2:15</a>). The romance of the well and the shepherdesses and the grateful father and the future wife is all quite in accord with the simplicity of desert life (<a onClick="return mV(\'Exd\',2,\'16-22\');">Ex 2:16-22</a>). The "Egyptian" saw the rude, selfish herdsmen of the desert imposing upon the helpless shepherd girls, and, partly by the authority of a manly man, partly, doubtless, by the authority of his Egyptian appearance in an age when "Egypt" was a word with which to frighten men in all that part of the world, he compelled them to give way. The "Egyptian" was called, thanked, given a home and eventually a wife. There in Midian, while the anguish of Israel continued under the taskmaster\'s lash, and the weakening of Israel\'s strength by the destruction of the male children went on, with what more or less rigor we know not, Moses was left by Providence to mellow and mature, that the haughty, impetuous prince, "instructed in all the wisdom of the Egyptians," might be transformed into the wise, well-poised, masterful leader, statesman, lawgiver, poet and prophet. God usually prepares His great ones in the countryside or about some of the quiet places of earth, farthest away from the busy haunts of men and nearest to the "secret place of the Most High." David keeping his father\'s flocks, Elijah on the mountain slopes of Gilead, the Baptist in the wilderness of Judea, Jesus in the shop of a Galilean carpenter; so Moses a shepherd in the Bedouin country, in the "waste, howling wilderness."<P>5. Leader of Israel:<P>(1) The Commission.<P>One day Moses led the flocks to "the back of the wilderness" (<a onClick="return mV(\'Exd\',3,\'1-12\');">Ex 3:1-12</a>; see <a href="./study/isbe/search.html?string=BUSH,+BURNING">BUSH, BURNING</a>. Moses received his commission, the most appalling commission ever given to a mere man (<a onClick="return mV(\'Exd\',3,10);">Ex 3:10</a>)—a commission to a solitary man, and he a refugee—to go back home and deliver his kinsmen from a dreadful slavery at the hand of the most powerful nation on earth. Let not those who halt and stumble over the little difficulties of most ordinary lives think hardly of the faltering of Moses\' faith before such a task (<a onClick="return mV(\'Exd\',3,\'11-13\');">Ex 3:11-13</a>; <a onClick="return mV(\'Exd\',4,1,\'10-13\');">4:1,10-13</a>). "Thus shalt thou say unto the children of Israel, I AM hath sent me unto you" (<a onClick="return mV(\'Exd\',3,14);">Ex 3:14</a>), was the encouragement God gave him. He gave him also Aaron for a spokesman (<a onClick="return mV(\'Exd\',4,\'14-16\');">Ex 4:14-16</a>), the return to the Mount of God as a sign (<a onClick="return mV(\'Exd\',3,12);">Ex 3:12</a>), and the rod of power for working wonders (<a onClick="return mV(\'Exd\',4,17);">Ex 4:17</a>).<P>One of the curious necessities into which the critical analysis drives its advocates is the opinion concerning Aaron that "he scarcely seems to have been a brother and almost equal partner of Moses, perhaps not even a priest" (Bennett, HDB, III, 441). Interesting and curious speculations have been instituted concerning the way in which Israel and especially Pharaoh were to understand the message, "I AM hath sent me unto you" (<a onClick="return mV(\'Exd\',3,13,14);">Ex 3:13,14</a>; compare <a onClick="return mV(\'Exd\',6,3);">6:3</A>). They were evidently expected to understand this message. Were they to so do by translating or by transliterating it into Egyptian? Some day Egyptologists may be able to answer positively, but not yet.<P>With the signs for identification (<a onClick="return mV(\'Exd\',4,\'1-10\');">Ex 4:1-10</a>), Moses was ready for his mission. He went down from the "holy ground" to obey the high summons and fulfill the great commission (<a onClick="return mV(\'Exd\',4,\'18-23\');">Ex 4:18-23</a>). After the perplexing controversy with his wife, a controversy of stormy ending (<a onClick="return mV(\'Exd\',4,\'24-26\');">Ex 4:24-26</a>), he seems to have left his family to his father-in-law\'s care while he went to respond to the call of God (<a onClick="return mV(\'Exd\',18,6);">Ex 18:6</a>). He met Aaron, his brother, at the Mount of God (<a onClick="return mV(\'Exd\',4,27,28);">Ex 4:27,28</a>), and together they returned to Egypt to collect the elders of Israel (<a onClick="return mV(\'Exd\',4,\'29-31\');">Ex 4:29-31</a>), who were easily won over to the scheme of emancipation. Was ever a slave people not ready to listen to plans for freedom?<P>(2) The Conflict with Pharaoh.<P>The next move was the bold request to the king to allow the people to go into the wilderness to hold a feast unto Yahweh (<a onClick="return mV(\'Exd\',5,1);">Ex 5:1</a>). How did Moses gain admittance past the jealous guards of an Egyptian court to the presence of the Pharaoh himself? And why was not the former traitorous refugee at once arrested? Egyptology affords a not too distinct answer. Rameses II was dead (<a onClick="return mV(\'Exd\',4,19);">Ex 4:19</a>); Merenptah II was on the throne with an insecure tenure, for the times were troubled. Did some remember the "son of Pharaoh\'s daughter" who, had he remained loyal, would have been the Pharaoh? Probably so. Thus he would gain admittance, and thus, too, in the precarious condition of the throne, it might well not be safe to molest him. The original form of the request made to the king, with some slight modification, was continued throughout (<a onClick="return mV(\'Exd\',8,27);">Ex 8:27</a>; <a onClick="return mV(\'Exd\',10,9);">10:9</a>), though God promised that the Egyptians should thrust them out altogether when the end should come, and it was so (<a onClick="return mV(\'Exd\',11,1);">Ex 11:1</a>; <a onClick="return mV(\'Exd\',12,31,33,39);">12:31,33,39</a>). Yet Pharaoh remembered the form of their request and bestirred himself when it was reported that they had indeed gone "from serving" them (<a onClick="return mV(\'Exd\',14,5);">Ex 14:5</a>). The request for temporary departure upon which the contest was made put Pharaoh\'s call to duty in the easiest form and thus, also, his obstinacy appears as the greater heinousness. Then came the challenge of Pharaoh in his contemptuous demand, "Who is Yahweh?" (<a onClick="return mV(\'Exd\',5,2);">Ex 5:2</a>), and Moses\' prompt acceptance of the challenge, in the beginning of the long series of plagues (see <a href="./study/isbe/search.html?string=PLAGUE">PLAGUE</a>) (<a onClick="return mV(\'Exd\',8,1);">Ex 8:1</a>ff; <a onClick="return mV(\'Exd\',12,\'29-39\');">12:29-36</a>; <a onClick="return mV(\'Exd\',14,31);">14:31</a>; compare Lamb, Miracle of Science). Pharaoh, having made the issue, was justly required to afford full presentation of it. So Pharaoh\'s heart was "hardened" (<a onClick="return mV(\'Exd\',4,21);">Ex 4:21</a>; <a onClick="return mV(\'Exd\',7,3,13);">7:3,13</a>; <a onClick="return mV(\'Exd\',9,12,35);">9:12,35</a>; <a onClick="return mV(\'Exd\',10,1);">10:1</a>; <a onClick="return mV(\'Exd\',14,8);">14:8</a>; see <a href="./study/isbe/search.html?string=PLAGUE">PLAGUE</A>) until the vindication of Yahweh as God of all the earth was complete. This proving of Yahweh was so conducted that the gods of Egypt were shown to be of no avail against Him, but that He is God of all the earth, and until the faith of the people of Israel was confirmed (<a onClick="return mV(\'Exd\',14,31);">Ex 14:31</a>).<P>(3) Institution of the Passover.<P>It was now time for the next step in revelation (<a onClick="return mV(\'Exd\',12,\'1-\');">Ex 12</a>; <a onClick="return mV(\'Exd\',13,\'1-16\');">13:1-16</a>). At the burning bush God had declared His purpose to be a saviour, not a destroyer. In this contest in Egypt, His absolute sovereignty was being established; and now the method of deliverance by Him, that He might not be a destroyer, was to be revealed. Moses called together the elders (<a onClick="return mV(\'Exd\',12,\'21-28\');">Ex 12:21-28</a>) and instituted the Passover feast. As God always in revelation chooses the known and the familiar—the tree, the bow, circumcision, baptism, and the Supper—by which to convey the unknown, so the Passover was a combination of the household feast with the widespread idea of safety through blood-sacrifice, which, however it may have come into the world, was not new at that time. Some think there is evidence of an old Semitic festival at that season which was utilized for the institution of the Passover.<P>The lamb was chosen and its use was kept up (<a onClick="return mV(\'Exd\',12,\'3-6\');">Ex 12:3-6</a>). On the appointed night it was killed and "roasted with fire" and eaten with bitter herbs (<a onClick="return mV(\'Exd\',12,8);">Ex 12:8</a>), while they all stood ready girded, with their shoes on their feet and their staff in hand (<a onClick="return mV(\'Exd\',12,11);">Ex 12:11</a>). They ate in safety and in hope, because the blood of the lamb was on the door (<a onClick="return mV(\'Exd\',12,23);">Ex 12:23</a>). That night the firstborn of Egypt were slain. Among the Egyptians "there was not a house where there was not one dead" (<a onClick="return mV(\'Exd\',12,30);">Ex 12:30</a>), from the house of the maid-servant, who sat with her handmill before her, to the palace of the king that "sat on the throne," and even among the cattle in the pasture. If the plague was employed as the agency of the angel of Yahweh, as some think, its peculiarity is that it takes the strongest and the best and culminates in one great stunning blow and then immediately subsides (see <a href="./study/isbe/search.html?string=PLAGUE">PLAGUE</a>). Who can tell the horror of that night when the Israelites were thrust out of the terror-stricken land (<a onClick="return mV(\'Exd\',12,39);">Ex 12:39</a>)?<P>As they went out, they "asked," after the fashion of departing servants in the East, and God gave them favor in the sight of the over-awed Egyptians that they lavished gifts upon them in extravagance. Thus "they despoiled the Egyptians" (<a onClick="return mV(\'Exd\',12,36);">Ex 12:36</a>). "Moreover the man Moses was very great in the land of Egypt, in the sight of Pharaoh\'s servants, and in the sight of the people" (<a onClick="return mV(\'Exd\',11,3);">Ex 11:3</a>; <a onClick="return mV(\'Exd\',12,35,36);">12:35,36</a>).<P>(4) The Exodus.<P>"At the end of 430 years, even the selfsame day it came to pass, that all the hosts of Yahweh went out from the land of Egypt" (<a onClick="return mV(\'Exd\',12,41);">Ex 12:41</a>). The great oppressor was Rameses II, and the culmination and the revolution came, most probably, in connection with the building of Pithom and Raamses, as these are the works of Israel mentioned in the Bible narrative (<a onClick="return mV(\'Exd\',1,11);">Ex 1:11</a>). Rameses said that he built Pithom at the "mouth of the east" (Budge, History of Exodus, V, 123). All efforts to overthrow that statement have failed and for the present, at least, it must stand. Israel built Pithom, Rameses built Pithom; there is a synchronism that cannot in the present knowledge of Egyptian history even be doubted, much less separated. The troubled times which came to Egypt with the beginning of the reign of Merenptah II afforded the psychological moment for the return of the "son of Pharaoh\'s daughter" and his access to the royal court. The presence and power of Yahweh vindicated His claim to be the Lord of all the earth, and Merenptah let the children of Israel go. A little later when Israel turned back from the border of Khar (Palestine) into the wilderness and disappeared, and Merenptah\'s affairs were somewhat settled in the empire, he set up the usual boastful tablet claiming as his own many of the victories of his royal ancestors, added a few which he himself could truly boast, and inserted, near the end, an exultation over Israel\'s discomfiture, accounting himself as having finally won the victory:<P>"Tehennu is devastation, Kheta peace, the Canaan the prisoner of all ills;<P>"Asgalon led out, taken with Gezer, Yenoamam made naught;<P>"The People of Israel is ruined, his posterity is not; Khar is become as the widows of Egypt."<P>The synchronisms of this period are well established and must stand until, if it should ever be, other facts of Egyptian history shall be obtained to change them. Yet it is impossible to determine with certainty the precise event from which the descent into Egypt should be reckoned, or to fix the date BC of Moses, Rameses and Merenptah, and the building of Pithom, and so, likewise, the date of the exodus and of all the patriarchal movements. The ancients were more concerned about the order of events, their perspective and their synchronisms than about any epochal date. For the present we must be content with these chronological uncertainties. Astronomical science may sometimes fix the epochal dates for these events; otherwise there is little likelihood that they will ever be known.#<P>They went out from Succoth (Egyptian "Thuku," Budge, History of Egypt, V,122,129), carrying the bones of Joseph with them as he had commanded (<a onClick="return mV(\'Exd\',13,19);">Ex 13:19</a>; <a onClick="return mV(\'Gen\',50,25);">Ge 50:25</a>). The northeast route was the direct way to the promised land, but it was guarded. Pithom itself was built at "the mouth of the East," as a part of the great frontier defenses (Budge, op. cit., V, 123). The "wall" on this frontier was well guarded (<a onClick="return mV(\'Exd\',14,\'1-\');">Ex 14</a>), and attempts might be made to stop them. So they went not "by the way of the land of the Philistines...lest peradventure the people repent when they see war" (<a onClick="return mV(\'Exd\',13,17);">Ex 13:17</a>). The Lord Himself took the leadership and went ahead of the host of Israel in a pillar of cloud by day and a pillar of fire by night (<a onClick="return mV(\'Exd\',13,21);">Ex 13:21</a>). He led them by "the way of the wilderness by the Red Sea" (<a onClick="return mV(\'Exd\',13,18);">Ex 13:18</a>). They pitched before Pi-hahiroth, over against Baal-zephon between Migdol and the sea (<a onClick="return mV(\'Exd\',14,2);">Ex 14:2</a>). Not one of these places has been positively identified. But the Journeys before and after the crossing, the time, and the configuration of the land and the coast-line of the sea, together with all the necessities imposed by the narrative, are best met by a crossing near the modern town of Suez (Naville, Route of the Exodus; Palmer, The Desert of the Exodus), where Ras \'Ataka comes down to the sea, upon whose heights a migdhol or "watch-tower," as the southern outpost of the eastern line of Egyptian defenses, would most probably be erected.<P>Word was carried from the frontier to Pharaoh, probably at Tanis, that the Israelites had "fled" (<a onClick="return mV(\'Exd\',14,5);">Ex 14:5</a>), had taken the impassioned thrusting out by the frenzied people of Egypt in good faith and had gone never to return. Pharaoh took immediate steps to arrest and bring back the fugitives. The troops at hand (<a onClick="return mV(\'Exd\',14,6);">Ex 14:6</a>) and the chariot corps, including 600 "chosen chariots," were sent at once in pursuit, Pharaoh going out in person at least to start the expedition (<a onClick="return mV(\'Exd\',14,6,7);">Ex 14:6,7</a>). The Israelites seemed to be "entangled in the land," and, since "the wilderness (had) shut them in" (<a onClick="return mV(\'Exd\',4,3);">Ex 4:3</a>), must easily fall a prey to the Egyptian army. The Israelites, terror-stricken, cried to Moses. God answered and commanded the pillar of cloud to turn back from its place before the host of Israel and stand between them and the approaching Egyptians, so that while the Egyptians were in the darkness Israel had the light (<a onClick="return mV(\'Exd\',14,19,20);">Ex 14:19,20</a>). The mountain came down on their right, the sea on the left to meet the foot of the mountain in front of them; the Egyptians were hastening on after them and the pillar of cloud and fire was their rearward. Moses with the rod of God stood at the head of the fleeing host. Then God wrought. Moses stretched out the rod of God over the sea and "Yahweh caused the sea to go back by a strong east wind all the night" (<a onClick="return mV(\'Exd\',14,\'16-21\');">Ex 14:16-21</a>). A pathway was before them and the sea on the right hand, and on the left was a "wall unto them," and they passed through (<a onClick="return mV(\'Exd\',14,21,22);">Ex 14:21,22</a>). Such heaping up of the waters by the wind is well known and sometimes amounts to 7 or 8 ft. in Lake Erie (Wright, Scientific Confirmations of the Old Testament, 106). No clearer statement could possibly be made of the means used and of the miraculous timing of God\'s providence with the obedience of the people to His command to Moses. The host of Israel passed over on the hard, sandy bottom of the sea. The Egyptians coming up in the dark and finding it impossible to tell exactly where the coastline had been on this beach, and where the point of safety would lie when the wind should abate and the tide come in again, impetuously rushed on after the fleeing slaves. In the morning, Yahweh looked forth and troubled the Egyptians "and took off their chariot wheels, and they drove them heavily" (<a onClick="return mV(\'Exd\',14,24,25);">Ex 14:24,25</a>). The wind had abated, the tide was returning and the infiltration that goes before the tide made the beach like a quicksand. The Egyptians found that they had gone too far and tried to escape (<a onClick="return mV(\'Exd\',14,27);">Ex 14:27</a>), but it was too late. The rushing tide caught them (<a onClick="return mV(\'Exd\',14,28);">Ex 14:28</a>). When the day had come, "horse and rider" were but the subject of a minstrel\'s song of triumph (<a onClick="return mV(\'Exd\',15,\'1-19\');">Ex 15:1-19</a>; <a onClick="return mV(\'Psa\',106,\'9-12\');">Ps 106:9-12</a>) which Miriam led with her timbrel (<a onClick="return mV(\'Exd\',15,20);">Ex 15:20</a>). The Bible does not say, and there is no reason to believe, that Pharaoh led the Egyptian hosts in person further than at the setting off and for the giving of general direction to the campaign (<a onClick="return mV(\'Exd\',15,4);">Ex 15:4</a>). Pharaoh and his host were overthrown in the Red Sea (<a onClick="return mV(\'Psa\',136,15);">Ps 136:15</a>). So Napoleon and his host were overthrown at Waterloo, but Napoleon lived to die at Helena. And Merenptah lived to erect his boastful inscription concerning the failure of Israel, when turned back from Kadesh-barnea, and their disappearance in the wilderness of Paran. His mummy, identified by the lamented Professor Groff, lies among the royal mummies in the Cairo Museum. Thus at the Red Sea was wrought the final victory of Yahweh over Pharaoh; and the people believed (<a onClick="return mV(\'Exd\',14,31);">Ex 14:31</a>).<P>(5) Special Providences.<P>Now proceeded that long course of special providences, miraculous timing of events, and multiplying of natural agencies which began with the crossing of the Red Sea and ended only when they "did eat of the fruit of the land" (<a onClick="return mV(\'Jos\',5,12);">Jos 5:12</a>). God promised freedom from the diseases of the Egyptians (<a onClick="return mV(\'Exd\',15,26);">Ex 15:26</a>) at the bitter waters of Marah, on the condition of obedience. Moses was directed to a tree, the wood of which should counteract the alkaline character of the water (<a onClick="return mV(\'Exd\',15,\'23-25\');">Ex 15:23-25</a>). A little later they were at Elim (Wady Gharandel, in present-day geography), where were "twelve springs of water and three score and ten palm trees" (<a onClick="return mV(\'Exd\',15,27);">Ex 15:27</a>). The enumeration of the trees signifies nothing but their scarcity, and is understood by everyone who has traveled in that desert and counted, again and again, every little clump of trees that has appeared. The course of least resistance here is to turn a little to the right and come out again at the Red Sea in order to pass around the point of the plateau into the wilderness of Sin. This is the course travel takes now, and it took the same course then (<a onClick="return mV(\'Exd\',16,1);">Ex 16:1</a>). Here Israel murmured (<a onClick="return mV(\'Exd\',16,2);">Ex 16:2</a>), and every traveler who crosses this blistering, dusty, wearisome, hungry wilderness joins in the murmuring, and wishes, at least a little, that he had stayed in the land of Egypt (<a onClick="return mV(\'Exd\',16,3);">Ex 16:3</a>). Provisions brought from Egypt were about exhausted and the land supplied but little. Judging from the complaints of the people about the barrenness of the land, it was not much different then from what it is now (<a onClick="return mV(\'Num\',20,\'1-6\');">Nu 20:1-6</a>). Now special providential provision began. "At even...the quails came up, and covered the camp," and in the morning, after the dew, the manna was found (<a onClick="return mV(\'Exd\',16,\'4-36\');">Ex 16:4-36</a>).<P>See <a href="./study/isbe/search.html?string=MANNA">MANNA</a>; <a href="./study/isbe/search.html?string=QUAIL">QUAIL</a>.<P>At Rephidim was the first of the instances when Moses was called upon to help the people to some water. He smote the rock with the rod of God, and there came forth an abundant supply of water (<a onClick="return mV(\'Exd\',17,\'1-6\');">Ex 17:1-6</a>). There is plenty of water in the wady near this point now. The Amalekites, considering the events immediately following, had probably shut the Israelites off from the springs, so God opened some hidden source in the mountain side. "Then came Amalek, and fought with Israel" (<a onClick="return mV(\'Exd\',17,8);">Ex 17:8</a>). Whether the hand which Moses lifted up during the battle was his own hand or a symbolical hand (<a onClick="return mV(\'Exd\',17,\'9-12\
