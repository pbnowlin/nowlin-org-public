');">Ex 17:9-12</a>), thought to have been carried in battle then, as sometimes even yet by the Bedouin, is of no importance. It was in either case a hand stretched up to God in prayer and allegiance, and the battle with Amalek, then as now, fluctuates according as the hand is lifted up or lowered (<a onClick="return mV(\'Exd\',17,\'8-16\');">Ex 17:8-16</a>).<P>Here Jethro, Moses\' father-in-law, met him and brought his wife and children to him (<a onClick="return mV(\'Exd\',18,5,6);">Ex 18:5,6</a>; compare <a onClick="return mV(\'Num\',10,29);">Nu 10:29</a>). A sacrificial feast was held with the distinguished guest (<a onClick="return mV(\'Exd\',18,\'7-12\');">Ex 18:7-12</a>). In the wise counsel of this great desert-priest we see one of the many natural sources of supply for Moses\' legal lore and statesmanship. A suggestion of Jethro gave rise to one of the wisest and most far-reaching elements in the civil institutions of Israel, the elaborate system of civil courts (<a onClick="return mV(\'Exd\',18,\'13-26\');">Ex 18:13-26</a>).<P>(6) Receiving the Law.<P>At Sinai Moses reached the pinnacle of his career, though perhaps not the pinnacle of his faith. (For a discussion of the location of Sinai, see <a href="./study/isbe/search.html?string=SINAI">SINAI</a>; <a href="./study/isbe/search.html?string=EXODUS">EXODUS</a>.) It is useless to speculate about the nature of the flames in theophany by fire at Sinai. Some say there was a thunderstorm (HDB); others think a volcanic eruption. The time, the stages of the journey, the description of the way, the topography of this place, especially its admirable adaptability to be the cathedral of Yahweh upon earth, and, above all, the collocation of all the events of the narrative along this route to this spot and to no other—all these exercise an overwhelming influence upon one (compare Palmer, The Desert of the Exodus). If they do not conclusively prove, they convincingly persuade, that here the greatest event between Creation and Calvary took place<P>Here the people assembled. "And Mount Sinai, the whole of it, smoked," and above appeared the glory of God. Bounds were set about the mountain to keep the people back (<a onClick="return mV(\'Exd\',19,12,13);">Ex 19:12,13</a>). God was upon the mountain: "Under his feet as it were a paved work of a sapphire stone, and as it were the very heaven for clearness" (<a onClick="return mV(\'Exd\',19,\'16-19\');">Ex 19:16-19</a>; <a onClick="return mV(\'Exd\',24,10,16,17);">24:10,16,17</a>), "and God spake all these words" (<a onClick="return mV(\'Exd\',20,\'1-17\');">Ex 20:1-17</a>). Back over the summit of the plain between these two mountain ridges in front, the people fled in terror to the place "afar off" (<a onClick="return mV(\'Exd\',20,18);">Ex 20:18</a>), and somewhere about the foot of this mountain a little later the tabernacle of grace was set up (<a onClick="return mV(\'Exd\',40,17);">Ex 40:17</a>). At this place the affairs of Moses mounted up to such a pinnacle of greatness in the religious history of the world as none other among men has attained unto. He gave formal announcement of the perfect law of God as a rule of life, and the redeeming mercy of God as the hope through repentance for a world of sinners that "fall short." Other men have sought God and taught men to seek God, some by the works of the Law and some by the way of propitiation, but where else in the history of the world has any one man caught sight of both great truths and given them out?<P>Moses gathered the people together to make the covenant (<a onClick="return mV(\'Exd\',24,\'1-8\');">Ex 24:1-8</a>), and the nobles of Israel ate a covenant meal there before God (<a onClick="return mV(\'Exd\',24,11);">Ex 24:11</a>). God called Moses again to the mountain with the elders of Israel (<a onClick="return mV(\'Exd\',24,12);">Ex 24:12</a>). There Moses was with God, fasting 40 days (<a onClick="return mV(\'Exd\',34,28);">Ex 34:28</a>). Joshua probably accompanied Moses into the mount (<a onClick="return mV(\'Exd\',24,13);">Ex 24:13</a>). There God gave directions concerning the plan of the tabernacle: "See...that thou make all things according to the pattern that was showed thee in the mount" (<a onClick="return mV(\'Hbr\',8,\'5-12\');">Heb 8:5-12</a>, summing up <a onClick="return mV(\'Exd\',25,40);">Ex 25:40</a>; <a onClick="return mV(\'Exd\',26,30);">26:30</a>; <a onClick="return mV(\'Exd\',27,8);">27:8</a>). This was the statement of the architect to the builder. We can only learn what the pattern was by studying the tabernacle (see <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>). It was an Egyptian plan (compare Bible Student, January, 1902). While Moses was engaged in his study of the things of the tabernacle on the mount, the people grew restless and appealed to Aaron (<a onClick="return mV(\'Exd\',32,1);">Ex 32:1</a>). In weakness Aaron yielded to them and made them a golden calf and they said, "These are thy gods, O Israel, which brought thee up out of the land of Egypt" (<a onClick="return mV(\'Exd\',32,\'2-6\');">Ex 32:2-6</a>; compare <a href="./study/isbe/search.html?string=CALF,+GOLDEN">CALF, GOLDEN</a>). This was probably, like the later calf-worship at Bethel and Dan, ancient Semitic bull-worship and a violation of the second commandment <a onClick="return mV(\'Exd\',20,5);">Ex 20:5</a>; compare Bible Student, August, 1902). The judgment of God was swift and terrible (<a onClick="return mV(\'Exd\',32,\'7-35\');">32:7-35</A>), and Levi was made the Divine agent (<a onClick="return mV(\'Exd\',32,\'25-29\');">32:25-29</a>). Here first the "tent of meeting" comes into prominence as the official headquarters of the leader of Israel (<a onClick="return mV(\'Exd\',33,\'7-11\');">33:7-11</A>). Henceforth independent and distinct from the tabernacle, though on account of the similarity of names liable to be confused with that building, it holds its place and purpose all through the wanderings to the plain of Moab by Jordan (<a onClick="return mV(\'Deu\',31,14);">De 31:14</a>). Moses is given a vision of God to strengthen his own faith (<a onClick="return mV(\'Exd\',33,\'12-23\');">Ex 33:12-23</a>; <a onClick="return mV(\'Exd\',34,\'1-35\');">34:1-35</a>). On his return from communion with God, he had such glory within that it shone out through his face to the terror of the multitude, an adumbration of that other and more glorious transfiguration at which Moses should also appear, and that reflection of it which is sometimes seen in the life of many godly persons (<a onClick="return mV(\'Mat\',17,\'1-13\');">Mt 17:1-13</a>; <a onClick="return mV(\'Mar\',9,\'2-10\');">Mr 9:2-10</a>; <a onClick="return mV(\'Luk\',9,\'28-36\');">Lu 9:28-36</a>).<P>Rationalistic attempts to account for the phenomena at Sinai have been frequent, but usually along certain lines. The favorite hypothesis is that of volcanic action. God has often used natural agencies in His revelation and in His miracles, and there is no necessary obstacle to His doing so here. But there are two seemingly insuperable difficulties in the way of this naturalistic explanation: one, that since geologic time this has not been a volcanic region; the other, that volcanic eruptions are not conducive to literary inspiration. It is almost impossible to get a sane account from the beholders of an eruption, much less has it a tendency to result in the greatest literature, the most perfect code of laws and the profoundest statesmanship in the world. The human mind can easily believe that God could so speak from Sinai and direct the preparation of such works of wisdom as the Book of the Covenant. Not many will be able to think that Moses could do so during a volcanic eruption at Sinai. For it must be kept in mind that the historical character of the narrative at this point, and the Mosaic authorship of the Book of the Covenant, are generally admitted by those who put forward this naturalistic explanation.<P>(7) Uncertainties of History.<P>From this time on to the end of Moses\' life, the materials are scant, there are long stretches of silence, and a biographer may well hesitate. The tabernacle was set up at the foot of the "mountain of the law" (<a onClick="return mV(\'Exd\',40,\'17-19\');">Ex 40:17-19</a>), and the world from that day to this has been able to find a mercy-seat at the foot of the mountain of the law. Nadab and Abihu presumptuously offered strange fire and were smitten (<a onClick="return mV(\'Lev\',10,\'1-7\');">Le 10:1-7</a>). The people were numbered (<a onClick="return mV(\'Num\',1,1);">Nu 1:1</a>). The Passover was kept (<a onClick="return mV(\'Num\',9,\'1-5\');">Nu 9:1-5</a>).<P>(8) Journey to Canaan Resumed.<P>The journey to Canaan began again (<a onClick="return mV(\'Num\',10,\'11-13\');">Nu 10:11-13</a>). From this time until near the close of the life of Moses the events associated with his name belong for the most part to the story of the wanderings in the wilderness and other subjects, rather than to a biography of Moses. (compare <a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>; <a href="./study/isbe/search.html?string=AARON">AARON</a>; <a href="./study/isbe/search.html?string=MIRIAM">MIRIAM</a>; <a href="./study/isbe/search.html?string=JOSHUA">JOSHUA</a>; <a href="./study/isbe/search.html?string=CALEB">CALEB</a>; <a href="./study/isbe/search.html?string=BRAZEN+SERPENT">BRAZEN SERPENT</a>, etc.). The subjects and references are as follows:<P class="in15">The March (<a onClick="return mV(\'Num\',2,\'10-18\');">Nu 2:10-18</a>; <a onClick="return mV(\'Num\',9,\'15-23\');">9:15-23</a>)<P class="in15">The Complaining (<a onClick="return mV(\'Num\',11,\'1-3\');">Nu 11:1-3</a>)<P class="in15">The Lusting (<a onClick="return mV(\'Num\',11,\'4-6\',\'18-35\');">Nu 11:4-6,18-35</a>)<P class="in15">The Prophets (<a onClick="return mV(\'Num\',11,16);">Nu 11:16</a>)<P class="in15">Leprosy of Miriam (<a onClick="return mV(\'Num\',12,\'1-16\');">Nu 12:1-16</a>)<P>(9) The Border of the Land:<P class="in15">Kadesh-barnea (<a onClick="return mV(\'Num\',13,\'3-26\');">Nu 13:3-26</a>)<P class="in15">The Spies (<a onClick="return mV(\'Deu\',1,22);">De 1:22</a>; <a onClick="return mV(\'Num\',13,2,21);">Nu 13:2,21</a>; <a onClick="return mV(\'Num\',23,\'27-33\');">23:27,28-33</a>; <a onClick="return mV(\'Num\',14,\'1-38\');">14:1-38</a>)<P class="in15">The Plagues (<a onClick="return mV(\'Num\',14,36,37);">Nu 14:36,37</a>,<a onClick="return mV(\'Num\',14,\'40-45\');">40-45</a>)<P>(10) The Wanderings:<P class="in15">Korah, Dathan and Abiram (<a onClick="return mV(\'Num\',16,\'1-35\');">Nu 16:1-35</a>)<P class="in15">The Plague (<a onClick="return mV(\'Num\',16,\'41-50\');">Nu 16:41-50</a>; <a onClick="return mV(\'Num\',17,\'1-\');">17</a>)<P class="in15">Death of Miriam (<a onClick="return mV(\'Num\',20,1);">Nu 20:1</a>)<P class="in15">Sin of Moses and Aaron (<a onClick="return mV(\'Num\',20,\'2-13\');">Nu 20:2-13</a>; <a onClick="return mV(\'Psa\',106,32);">Ps 106:32</a>)<P class="in15">Unfriendliness of Edom (<a onClick="return mV(\'Num\',20,\'14-21\');">Nu 20:14-21</a>)<P class="in15">Death of Aaron (<a onClick="return mV(\'Num\',20,\'22-29\');">Nu 20:22-29</a>)<P class="in15">Arad (<a onClick="return mV(\'Num\',21,\'1-3\');">Nu 21:1-3</a>)<P class="in15">Compassing of Edom (<a onClick="return mV(\'Num\',21,4);">Nu 21:4</a>)<P class="in15">Murmuring (<a onClick="return mV(\'Num\',21,\'5-7\');">Nu 21:5-7</a>)<P class="in15">Brazen Serpent (<a onClick="return mV(\'Num\',21,8,9);">Nu 21:8,9</a>; <a onClick="return mV(\'Jhn\',3,14);">Joh 3:14</a>)<P>(11) Edom:<P class="in15">The Jordan (<a onClick="return mV(\'Num\',21,\'10-20\');">Nu 21:10-20</a>)<P class="in15">Sihon (<a onClick="return mV(\'Num\',21,\'21-32\');">Nu 21:21-32</a>)<P class="in15">Og (<a onClick="return mV(\'Num\',21,\'33-35\');">Nu 21:33-35</a>)<P class="in15">Balak and Balaam (<a onClick="return mV(\'Num\',22,4);">Nu 22:4</a>; <a onClick="return mV(\'Num\',24,25);">24:25</a>)<P class="in15">Pollution of the People (<a onClick="return mV(\'Num\',25,\'6-15\');">Nu 25:6-15</a>)<P class="in15">Numbering of the People (<a onClick="return mV(\'Num\',26,\'1-\');">Nu 26</a>)<P class="in15">Joshua Chosen (<a onClick="return mV(\'Num\',27,\'15-23\');">Nu 27:15-23</a>)<P class="in15">Midianites Punished (<a onClick="return mV(\'Num\',31,\'1-\');">Nu 31</a>)<p>(12) Tribes East of Jordan (<a onClick="return mV(\'Num\',32,\'1-\');">Numbers 32</a>)<P>(13) Moses\' Final Acts.<P>Moses was now ready for the final instruction of the people. They were assembled and a great farewell address was given (<a onClick="return mV(\'Deu\',1,\'1-\');">De 1-30:20</a>). Joshua was formally inducted into office (<a onClick="return mV(\'Deu\',31,\'1-8\');">De 31:1-8</a>), and to the priests was delivered a written copy of this last announcement of the Law now adapted to the progress made during 40 years (<a onClick="return mV(\'Deu\',31,\'9-13\');">De 31:9-13</a>; compare <a onClick="return mV(\'Deu\',31,\'24-29\');">31:24-29</A>). Moses then called Joshua into the tabernacle for a final charge (<a onClick="return mV(\'Deu\',31,\'14-23\');">De 31:14-23</a>), gave to the assembled elders of the people "the words of this song" (<a onClick="return mV(\'Deu\',31,30);">De 31:30</a>; <a onClick="return mV(\'Deu\',32,\'1-43\');">32:1-43</a>) and blessed the people (<a onClick="return mV(\'Deu\',33,\'1-\');">De 33</a>). And then Moses, who "by faith" had triumphed in Egypt, had been the great revelator at Sinai, had turned back to walk with the people of little faith for 40 years, reached the greatest triumph of his faith, when, from the top of Nebo, the towering pinnacle of Pisgah, he lifted up his eyes to the goodly land of promise and gave way to Joshua to lead the people in (<a onClick="return mV(\'Deu\',34,\'1-\');">De 34</a>). And there Moses died and was buried, "but no man knoweth of his sepulchre unto this day" (<a onClick="return mV(\'Deu\',34,5,6);">De 34:5,6</a>), "and Moses was a hundred and twenty years old when he died" (<a onClick="return mV(\'Deu\',34,7);">De 34:7</a>).<P>This biography of Moses is the binding-thread of the Pentateuch from the beginning of Exodus to the end of Deuteronomy, without disastrous breaks or disturbing repetitions. There are, indeed, silences, but they occur where nothing great or important in the narrative is to be expected. And there are, in the eyes of some, repetitions, so-called doublets, but they do not seem to be any more real than may be expected in any biography that is only incidental to the main purpose of the writer. No man can break apart this narrative of the books without putting into confusion this life-story; the one cannot be treated as independent of the other; any more than the narrative of the English Commonwealth and the story of Cromwell, or the story of the American Revolution and the career of Washington.<P>Later references to Moses as leader, lawgiver and prophet run all through the Bible; only the most important will be mentioned: <a onClick="return mV(\'Jos\',8,\'30-35\');">Jos 8:30-35</a>; <a onClick="return mV(\'Jos\',24,5);">24:5</a>; <a onClick="return mV(\'1Sa\',12,\'6-8\');">1Sa 12:6-8</a>; <a onClick="return mV(\'1Ch\',23,\'14-17\');">1Ch 23:14-17</a>; <a onClick="return mV(\'Psa\',77,20);">Ps 77:20</a>; <a onClick="return mV(\'Psa\',99,6);">99:6</a>; <a onClick="return mV(\'Psa\',105,\'1-\');">105</a>; <a onClick="return mV(\'Psa\',106,\'1-\');">106</a>; <a onClick="return mV(\'Isa\',63,11,12);">Isa 63:11,12</a>; <a onClick="return mV(\'Jer\',15,1);">Jer 15:1</a>; <a onClick="return mV(\'Dan\',9,\'11-13\');">Da 9:11-13</a>; <a onClick="return mV(\'Hsa\',12,13);">Ho 12:13</a>; <a onClick="return mV(\'Mic\',6,4);">Mic 6:4</a>; <a onClick="return mV(\'Mal\',4,4);">Mal 4:4</a>.<P>The place held by Moses in the New Testament is as unique as in the Old Testament, though far less prominent. Indeed, he holds the same place, though presented in a different light. In the Old Testament he is the type of the Prophet to be raised up "like unto" him. It is the time of types, and Moses, the type, is most conspicuous. In the New Testament the Prophet "like unto Moses" has come. He now stands out the greatest One in human history, while Moses, the type, fades away in the shadow. It is thus he appears in Christ\'s remarkable reference to him: "He wrote of me" (<a onClick="return mV(\'Jhn\',5,46);">Joh 5:46</a>). The principal thing which Moses wrote specifically of Christ is this passage: "Yahweh thy God will raise up unto thee a prophet from the midst of thee, of thy brethren, like unto me" (<a onClick="return mV(\'Deu\',18,15,18);">De 18:15,18</a>f). Again in the Epistle to the Hebrews, which is the formal passing over from the types of the Old Testament to the fulfillment in the New Testament, Jesus is made to stand out as the Moses of the new dispensation (<a onClick="return mV(\'Hbr\',3,\'1-\');">Heb 3</a>; <a onClick="return mV(\'Hbr\',12,\'24-29\');">12:24-29</a>). Other most important New Testament references to Moses are <a onClick="return mV(\'Mat\',17,3);">Mt 17:3</a>; <a onClick="return mV(\'Mar\',9,4);">Mr 9:4</a>; <a onClick="return mV(\'Luk\',9,30);">Lu 9:30</a>; <a onClick="return mV(\'Jhn\',1,17,45);">Joh 1:17,45</a>; <a onClick="return mV(\'Jhn\',3,14);">3:14</a>; <a onClick="return mV(\'Rom\',5,14);">Ro 5:14</a>; <a onClick="return mV(\'Jud\',1,9);">Jude 1:9</a>; <a onClick="return mV(\'Rev\',15,3);">Re 15:3</a>.<P>II. Work and Character.<P>So little is known of the private life of Moses that his personal character can scarcely be separated from the part which he bore in public affairs. It is the work he wrought for Israel and for mankind which fixes his place among the great ones of earth. The life which we have just sketched as the life of the leader of Israel is also the life of the author, the lawgiver, and the prophet.<P>1. The Author:<P>It is not within the province of this article to discuss in full the great critical controversies concerning the authorship of Moses which have been summed up against him thus: "It is doubtful whether we can regard Moses as an author in the literary sense" (HDB, III, 446; see <a href="./study/isbe/search.html?string=PENTATEUCH">PENTATEUCH</a>; <a href="./study/isbe/search.html?string=DEUTERONOMY">DEUTERONOMY</a>). It will only be in place here to present a brief statement of the evidence in the case for Moses. There is no longer any question concerning the literary character of the age in which Moses lived. That Moses might have written is indisputable. But did he write, and how much? What evidence bears at these points?<P>(1) "Moses Wrote."<P>The idea of writing or of writings is found 60 times in the Pentateuch It is definitely recorded in writing purporting to be by Moses. 7 times that Moses wrote or was commanded to write (<a onClick="return mV(\'Exd\',17,14);">Ex 17:14</a>; <a onClick="return mV(\'Exd\',34,27);">34:27</a>; <a onClick="return mV(\'Exd\',39,30);">39:30</a>; <a onClick="return mV(\'Num\',17,2,3);">Nu 17:2,3</a>; <a onClick="return mV(\'Deu\',10,4);">De 10:4</a>; <a onClick="return mV(\'Deu\',31,24);">31:24</a>) and frequently of others in his times (<a onClick="return mV(\'Deu\',6,9);">De 6:9</a>; <a onClick="return mV(\'Deu\',27,3);">27:3</a>; <a onClick="return mV(\'Deu\',31,19);">31:19</a>; <a onClick="return mV(\'Jos\',8,32);">Jos 8:32</a>). Joshua at the great convocation at Shechem for the taking of the covenant wrote "these words in the book of the law of God" (<a onClick="return mV(\'Jos\',24,26);">Jos 24:26</a>). Thus is declared the existence of such a book but 25 years after the death of Moses (compare Bible Student, 1901, 269-74). It is thus clearly asserted by the Scriptures as a fact that Moses in the wilderness a little after the exodus was "writing" "books."<P>(2) Moses\' Library.<P>There are many library marks in the Pentateuch, even in those portions which by nearly all, even the most radical, critics are allowed to be probably the writings of Moses. The Pentateuch as a whole has such library marks all over it.<P>On the one hand this is entirely consistent with the known literary character of the age in which Moses lived. One who was "instructed in all the wisdom of the Egyptians" might have had in his possession Egyptian records. And the author of this article is of that class to whom Professor Clay refers, who believe "that Hebraic (or Amoraic) literature, as well as Aramaic, has a great antiquity prior to the 1st millennium BC" (Clay, Amurru, 32).<P>On the other hand, the use of a library to the extent indicated by the abiding marks upon the Pentateuch does not in the least militate against the claim of Moses for authorship of the same. The real library marks, aside from the passages which are assigned by the critics to go with them, are far less numerous and narrower in scope than in Gibbon or in Kurtz. The use of a library no more necessarily endangers authorship in the one case than in the other.<P>(3) The Moses-Tradition.<P>A tradition from the beginning universally held, and for a long time and without inherent absurdity, has very great weight. Such has been the Moses-tradition of authorship. Since Moses is believed to have been such a person living in such an age and under such circumstances as might suitably provide the situation and the occasion for such historical records, so that common sense does not question whether he could have written "a" Pentateuch, but only whether he did write "the" Pentateuch which we have, it is easier to believe the tradition concerning his authorship than to believe that such a tradition arose with nothing so known concerning his ability and circumstances. But such a tradition did arise concerning Moses. It existed in the days of Josiah. Without it, by no possibility could the people have been persuaded to receive with authority a book purporting to be by him. The question of the truthfulness of the claim of actually finding the Book of the Law altogether aside, there must have been such a national hero as Moses known to the people and believed in by them, as well as a confident belief in an age of literature reaching back to his days, else the Book of the Law would not have been received by the people as from Moses. Archaeology does not supply actual literary material from Israel much earlier than the time of Josiah, but the material shows a method of writing and a literary advancement of the people which reaches far back for its origin, and which goes far to justify the tradition in Josiah\'s day. Moreover, to the present time, there is no archaeological evidence to cast doubt upon that tradition.<P>(4) The Pentateuch in the Northern Kingdom.<P>The evidence of the Pentateuch in the Northern Kingdom before the fall of Samaria is very strong—this entirely aside from any evidence from the Samaritan Pentateuch. Although some few insist upon an early date for that book, it is better to omit it altogether from this argument, as the time of its composition is not absolutely known and is probably not very far from the close of the Babylonian exile of Judah. But the prophets supply indubitable evidence of the Pentateuch in the Northern Kingdom (<a onClick="return mV(\'Hsa\',1,10);">Ho 1:10</a>; <a onClick="return mV(\'Hsa\',4,6);">4:6</a>; <a onClick="return mV(\'Hsa\',8,1,13);">8:1,13</a>; <a onClick="return mV(\'Hsa\',9,11);">9:11</a>; <a onClick="return mV(\'Hsa\',12,9);">12:9</a>; <a onClick="return mV(\'Amo\',5,21,22);">Am 5:21,22</a>; <a onClick="return mV(\'Amo\',8,5);">8:5</a>; compare Green, Higher Criticism and the Pentateuch, 56-58).<P>(5) Evidence for the Mosaic Age.<P>Beyond the limit to which historical evidence reaches concerning the Mosaic authorship of the Pentateuch, internal evidence for the Mosaic age as the time of its composition carries us back to the very days of Moses. Egyptian words in the Pentateuch attest its composition in the Mosaic age, not because they are Egyptian words, for it is quite supposable that later authors might have known Egyptian words, but because they are Egyptian words of such marked peculiarities in meaning and history and of such absolutely accurate use in the Pentateuch, that their employment by later authors in such a way is incredible. The list of such words is a long one. Only a few can be mentioned here. For a complete list the authorities cited must be consulted. There is ye\'or, for the streams of Egypt; achu, for the marshy pasture lands along the Nile; shesh, for the "fine white linen" of the priests; "the land of Rameses" for a local district in lower Egypt; tsaphenath pa\'neach, Joseph\'s Egyptian name, and acenath, the name of Joseph\'s Egyptian wife, and many other Egyptian words (see Lieblein, in PSBA, May,1898, 202-10; also The Bible Student, 1901, 36-40).<P>(6) The Obscurity of the Doctrine of the Resurrection in the Pentateuch.<P>This obscurity has been urged against the Mosaic authorship of the Pentateuch. Because of the popular belief concerning the doctrine of the resurrection among the Egyptians, this objection to the Mosaic authorship of the Pentateuch becomes the most forcible of all the objections urged by critics. If the Pentateuch was written by Moses when Israel had just come out of Egypt, why did he leave the doctrine of the resurrection in such obscurity? The answer is very simple. The so-called Egyptian doctrine of the resurrection was not a doctrine of resurrection at all, but a doctrine of resuscitation. The essential idea of resurrection, as it runs through Scripture from the first glimpse of it until the declaration of Paul: "It is sown a natural body; it is raised a spiritual body. If there is a natural body, there is also a spiritual body" (<a onClick="return mV(\'1Cr\',15,\'35-45\');">1Co 15:35-45</a>), is almost absolutely beyond the Egyptian vision of the future life. With the Egyptians the risen body was to live the same old life on "oxen, geese, bread, beer, wine and all good things" (compare for abundant illustration Maspero\'s Guide to Cairo Museum). The omission of the doctrine of the resurrection from the Pentateuch at the later date assigned by criticism is very hard to account for. In view of some passages from the Psalms and the Prophets, it appears inexplicable (<a onClick="return mV(\'Job\',19,\'25-27\');">Job 19:25-27</a>; <a onClick="return mV(\'Psa\',16,10);">Ps 16:10</a>; <a onClick="return mV(\'Psa\',49,15);">49:15</a>; <a onClick="return mV(\'Isa\',26,19);">Isa 26:19</a>; <a onClick="return mV(\'Eze\',37,\'1-\');">Eze 37</a>; <a onClick="return mV(\'Dan\',12,2);">Da 12:2</a>). The gross materialism of the Egyptian doctrine of the rising from the dead makes the obscurity of the doctrine of the resurrection in the Pentateuch in Moses\' day perfectly natural. Any direct mention of the subject at that time among a people just come out of Egypt would have carried at once into Israel\'s religion the materialism of the Egyptian conception of the future life. The only way by which the people could be weaned away from these Egyptian ideas was by beginning, as the Pentateuch does, with more spiritual ideas of God, of the other world and of worship. The obscurity of the doctrine of the resurrection in the Pentateuch, so far from being against the Mosaic authorship, is very cogent reason for believing the Pentateuch to have come from that age, as the only known time when such an omission is reasonably explicable. Lord, in his lectures, though not an Egyptologist, caught sight of this truth which later work of Egyptologists has made clear (Moses, 45). Warburton had a less clear vision of it (see Divine Legation).<P>(7) The Unity of the Pentateuch.<P>Unity in the Pentateuch, abstractly considered, cannot be indicative of particular time for its composition. Manifestly, unity can be given a book at any time. There is indisputably a certain appearance of unity in narrative in the Pentateuch, and when this unity is examined somewhat carefully, it is found to have such peculiarity as does point to the Mosaic age for authorship. The making of books which have running through them such a narrative as is contained in the Pentateuch which, especially from the end of Genesis, is entangled and interwoven with dates and routes and topographical notes, the history of experiences, all so accurately given that in large part to this day the route and the places intended can be identified, all this, no matter when the books were written, certainly calls for special conditions of authorship. A narrative which so provides for all the exigencies of desert life and so anticipates the life to which Israel looked forward, exhibits a realism which calls for very special familiarity with all the circumstances. And when the narrative adds to all this the life of a man without breaks or repetitions adverse to the purpose of a biography, and running through from beginning to end, and not a haphazard, unsymmetrical man such as might result from the piecing together of fragments, but a colossal and symmetrical man, the foremost man of the world until a greater than Moses should appear, it demands to be written near the time and place of the events narrated. That a work of fiction, struck off at one time by one hand, might meet all these requirements at a later date, no one can doubt, but a scrap-book, even though made up of facts, cannot do so. In fact, the scraps culled. out by the analysis of the Pentateuch do not make a connected life-story at all, but three fragmentary and disconnected stories, and turn a biography, which is the binding-thread of the books, into what is little better than nonsense.<P>The unity of the Law, which also can be well sustained, is to the same effect as the unity of the narrative in certifying the narrative near to the time and place of the events narrated. The discussion of the unity of the Law, which involves nearly the whole critical controversy of the day, would be too much of a digression for an article on Moses (see <a href="./study/isbe/search.html?string=LAW">LAW</a>; <a href="./study/isbe/search.html?string=LEVITICUS">LEVITICUS</a>; <a href="./study/isbe/search.html?string=DEUTERONOMY">DEUTERONOMY</a>; also Green, Higher Criticism and the Pent; Orr, POT; Wiener, Biblical Sac., 1909-10).<P>Neither criticism nor archaeology has yet produced the kind or degree of evidence which rationalism demands for the Mosaic authorship of the Pentateuch. No trace has yet been found either of the broken tablets at Mt. Sinai or of the autograph copy of the Law of the Lord "by the hand of Moses" brought out of the house of the Lord in the days of Josiah. Nor are these things likely to be found, nor anything else that will certify authorship like a transcription of the records in the copyright office. Such evidence is not reasonably demanded. The foregoing indications point very strongly to the production of the Pentateuch in the Mosaic age by someone as familiar with the circumstances and as near the heart of the nation as Moses was. That here and there a few slight additions may have been made and that, perhaps, a few explanations made by scribes may have slipped into the text from the margin are not unlikely (<a onClick="return mV(\'Num\',12,3);">Nu 12:3</a>; <a onClick="return mV(\'Deu\',34,\'1-\');">De 34</a>), but this does not affect the general claim of authorship.<P><a onClick="return mV(\'Psa\',90,\'1-\');">Ps 90</a> is also attributed to Moses, though attempts have been made to discredit his authorship here also (Delitzsch, Commentary on the Psalms). There are those who perhaps still hold to the Mosaic authorship of the Book of Job. But that view was never more than a speculation.<P>2. The Lawgiver:<P>The character of Moses as lawgiver is scarcely separable from that of Moses as author, but calls for some separate consideration.<P>(1) The extent of the Mosaic element in the Pentateuch legislation has been so variously estimated that for any adequate idea of the discussion the reader must consult not only other articles (<a href="./study/isbe/search.html?string=LAW">LAW</a>; <a href="./study/isbe/search.html?string=COVENANT,+BOOK+OF+THE">COVENANT, BOOK OF THE</a>; <a href="./study/isbe/search.html?string=PENTATEUCH">PENTATEUCH</a>) but special works on this subject. In accord with the reasons presented above for the authorship of the Pentateuch in Mosaic times, the great statesman seems most naturally the author of the laws so interwoven with his life and leadership. Moses first gave laws concerning the Passover (<a onClick="return mV(\'Exd\',13,\'1-\');">Ex 13</a>). At Sinai, after the startling revelation from the summit of the mountain, it is most reasonable that Moses should gather the people together to covenant with God, and should record that event in the short code of laws known as the Book of the Covenant (<a onClick="return mV(\'Exd\',24,7);">Ex 24:7</a>). This code contains the Moral Law (<a onClick="return mV(\'Exd\',20,\'1-17\');">Ex 20:1-17</a>) as fundamental, the constitution of theocracy and of all ethical living. This is followed by a brief code suitable to their present condition and immediate prospects (<a onClick="return mV(\'Exd\',20,\'24-26\');">Ex 20:24-26</a>; <a onClick="return mV(\'Exd\',21,\'1-\');">21-23</a>). Considering the expectations of both leader and people that they would immediately proceed to the promised land and take possession, it is quite in order that there should be laws concerning vineyards and olive orchards (<a onClick="return mV(\'Exd\',23,11);">Ex 23:11</a>), and harvests (<a onClick="return mV(\'Exd\',23,\'10-16\');">Ex 23:10-16</a>) and the first-fruits (<a onClick="return mV(\'Exd\',23,19);">Ex 23:19</a>). Upon the completion of the tabernacle, a priest-code became a necessity. Accordingly, such a code follows with great minutiae of directions. This part of the Law is composed almost entirely of "laws of procedure" intended primarily for the priests, that they might know their own duties and give oral instruction to the people, and probably was never meant for the whole people except in the most general way. When Israel was turned back into the wilderness, these two codes were quite sufficient for the simple life of the wanderings. But Israel developed. The rabble became a nation. Forty years of life under law, under the operation of the Book of the Covenant in the moralities of life, the Priestly Code in their religious exercises, and the brief statutes of Leviticus for the simple life of the desert, prepared the people for a more elaborate code as they entered the promised land with its more complex life. Accordingly, in Deuteronomy that code was recorded and left for the guidance of the people. That these various codes contain some things not now understood is not at all surprising. It would be surprising if they did not. Would not Orientals of today find some things in Western laws quite incomprehensible without explanation?<P>That some few items of law may have been added at a later time, as some items of history were added to the narrative, is not at all unreasonable, and does in no way invalidate the claim of Moses as the lawgiver, any more than later French legislation has invalidated the Corsican\'s claim to the Napoleonic Code.<P>The essential value of the Mosaic legislation is beyond comparison. Some of the laws of Moses, relating as they did to passing problems, have themselves passed away; some of them were definitely abrogated by Christ and others explicitly fulfilled; but much of his legislation, moral, industrial, social and political, is the warp and woof of the best in the great codes of the world to this day. The morality of the Decalogue is unapproached among collections of moral precepts. Its divinity, like the divinity of the teachings of Jesus, lies not only in what it includes, but also in what it omits. The precepts of Ptah-hotep, of Confucius, of Epictetus include many things found in the Decalogue; the Decalogue omits many things found among the maxims of these moralists. Thus, in what it excludes, as in what it includes, the perfection of the Decalogue lies.<P>(2) It should be emphasized that the laws of Moses were codes, not a collection of court decisions known to lawyers as common law, but codes given abstractly, not in view of any particular concrete case, and arranged in systematic order (Wiener, Biblical Sac., 1909-10). This is entirely in harmony with the archaeological indications of the Mosaic and preceding ages. The Code of Hammurabi, given at least 5 centuries before, is one of the most orderly, methodical and logical codes ever constructed (Lyon, JAOS, XXV, 254).<P>3. The Prophet:<P>The career and the works and the character of Moses culminate in the prophetic office. It was as prophet that Moses was essentially leader. It was as prophet that he held the place of highest eminence in the world until a greater than Moses came.<P>(1) The statesman-prophet framed a civil government which illustrated the kingdom of God upon earth. The theocracy did not simulate any government of earth, monarchy, republic or socialistic state. It combined the best elements in all of these and set up the most effective checks which have ever been devised against the evils of each.<P>(2) The lawgiver-prophet inculcated maxims and laws which set the feet of the people in the way of life, so that, while failing as a law of life in a sinful world, these precepts ever remain as a rule of conduct.<P>(3) The priest-prophet prepared and gave to Israel a ritual of worship which most completely typified the redemptive mercy of God and which is so wonderfully unfolded in the Epistle to the Hebrews, as it has been more wonderfully fulfilled in the life and atoning death of Christ.<P>(4) In all the multiform activities of the prophetic career he was a type of Christ, the type of Christ whose work was a "tutor unto Christ."<P>Moses\' revelation of God ever transcends the speculations of theologians about God as a sunrise transcends a treatise on the solar spectrum. While the speculations are cold and lifeless, the revelation is vital and glorious. As an analysis of Raphael\'s painting of the transfiguration belittles its impression upon the beholder, while a sight of the picture exalts that scene in the mind and heart, so the attempts of theologians to analyze God and bring Him within the grasp of the human mind belittle the conception of God, dwarf it to the capacity of the human intellect, while such a vision of Him as Moses gives exalts and glorifies Him beyond expression. Thus, while theologians of every school from Athanasius to Ritschl come and go, Moses goes on forever; while they stand cold on library shelves, he lives warm in the hearts of men.<P>Such was the Hebrew leader, lawgiver, prophet, poet; among mere men, "the foremost man of all this world."<P>LITERATURE.<P>Commentaries on the Pentateuch; for rabbinical traditions, compare Lauterbach in Jewish Encyclopedia; for pseudepigraphical books ascribed to Moses, see Charles, Assumption of Moses; for Mohammedan legends, compare DB; Ebers, Egypten und die Bucher Mosis; for critical partition of books of Moses, compare the Polychrome Bible and Bennett in HDB; for comprehensive discussion of the critical problems, compare POT.``93';
isbe[6171]='Moses, Assumption of`a-sump\'-shun.`<a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</a>`1';
isbe[6172]='Moses, Song of`The name given to the song of triumph sung by Moses and the Israelites after the crossing of the Red Sea and the destruction of the hosts of Pharaoh (<a onClick="return mV(\'Exd\',15,\'1-18\');">Ex 15:1-18</a>). The sublimity of this noble ode is universally admitted. In magnificent strains it celebrates the deliverance just experienced, extolling the attributes of Yahweh revealed in the triumph (<a onClick="return mV(\'Exd\',15,\'1-12\');">Ex 15:1-12</a>), then anticipates the astonishing effects which would flow from this deliverance in the immediate future and later (<a onClick="return mV(\'Exd\',15,\'13-18\');">Ex 15:13-18</a>). There seems no reason to doubt that at least the basis of the song—possibly the whole—is genuinely Mosaic. In the allusions to the guidance of the people to God\'s holy habitation, and to the terror of the surrounding peoples and of the Canaanites (<a onClick="return mV(\'Exd\',15,\'13-18\');">Ex 15:13-18</a>), it is thought that traces are manifest of a later revision and expansion. This, however, is by no means a necessary conclusion.<P>Driver, who in LOT, 8th edition,30,goes with the critics on this point, wrote more guardedly in the 1st edition (p. 27): "Probably, however, the greater part of the song is Mosaic, and the modification or expansion is limited to the closing verses; for the general style is antique. and the triumphant tone which pervades it is just such as might naturally have been inspired by the event which it celebrates."<P>The song of Moses is made the model in the Apocalypse of "the song of Moses the servant of God, and the song of the Lamb," which those standing by the sea of glass, who have "come off victorious from the beast, and from his image, and from the number of his name," sing to God\'s praise, "Great and marvelous are thy works, O Lord God, the Almighty," etc. (<a onClick="return mV(\'Rev\',15,\'2-4\');">Re 15:2-4</a>). The church having experienced a deliverance similar to that experienced by Israel at the Red Sea, but infinitely greater, the old song is recast, and its terms are readapted to express both victories, the lower and the higher, at once.``132';
isbe[6173]='Mosollamon`mo-sol\'-a-mon.`<a href="./study/isbe/search.html?string=MOSOLLAMUS">MOSOLLAMUS</a>`1';
isbe[6174]='Mosollamus`mo-sol\'-a-mus:<P>(1) the King James Version "Mosollam" (Mosollamos), one of the three "assessors" appointed to the two commissioners in the inquiry made about "strange wives" (1Esdras 9:14) = "Meshullam" in <a onClick="return mV(\'Ezr\',10,15);">Ezr 10:15</a>.<P>(2) the King James Version "Mosollamon," one of those sent by Ezra to the captain Loddeus to obtain men who could execute the priest\'s office (1Esdras 8:44 (Septuagint 43)) = "Meshullam" in <a onClick="return mV(\'Ezr\',8,16);">Ezr 8:16</a> (Codex Vaticanus reads also Mesolabon, in 1Esdras 8:44).``1';
isbe[6175]='Most High, Most Holy``<a href="./study/isbe/search.html?string=GOD,+NAMES+OF">GOD, NAMES OF</a>`1';
isbe[6176]='Mote`mot (karphos): A minute piece of anything dry or light, as straw, chaff, a splinter of wood, that might enter the eye. Used by Jesus in <a onClick="return mV(\'Mat\',7,3);">Mt 7:3</a>ff; <a onClick="return mV(\'Luk\',6,41);">Lu 6:41</a>f in contrast with "beam," to rebuke officiousness in correcting small faults of others, while cherishing greater ones of our own.``1';
isbe[6177]='Moth`moth (\'ash; compare Arabic \'uththat, "moth"; colloquial, \'itt; cac, "worm" (<a onClick="return mV(\'Isa\',51,8);">Isa 51:8</a>); compare Arabic sus, "worm," especially an insect larva in flesh, wood or grain; ses, "moth" (<a onClick="return mV(\'Mat\',6,19,20);">Mt 6:19,20</a>; <a onClick="return mV(\'Luk\',12,33);">Lu 12:33</a>); setobrotos, "moth-eaten" (<a onClick="return mV(\'Jam\',5,2);">Jas 5:2</a>)):<P>The moths constitute the larger division of the order Lepidoptera. Two of the points by which they are distinguished from butterflies are that they are generally nocturnal and that their antennae are not club-shaped. Further, the larva in many cases spins a cocoon for the protection of the pupa or chrysalis, which is never the case with butterflies. The Biblical references are to the clothes-moth, i.e. various species of the genus Tinea, tiny insects which lay their eggs in woolen clothes, upon which the larvae later feed. As the larva feeds it makes a cocoon of its silk together with fibers of the cloth on which it is feeding, so that the color of the cocoon depends upon the color of the fabric. The adult is only indirectly harmful, as it is only in the larval stage that the insect injures clothing. Therefore in <a onClick="return mV(\'Isa\',51,8);">Isa 51:8</a>, "For the moth (\'ash) shall eat them up like a garment, and the worm (cac) shall eat them like wool," both words must refer to the larva, the distich demanding such a word as cac to balance \'ash in the first half. The word "moth" occurs 7 times in the Old Testament, in Job, Psalms, Isaiah and Hosea, always in figurative expressions, typifying either that which is destructive (<a onClick="return mV(\'Job\',13,28);">Job 13:28</a>; <a onClick="return mV(\'Psa\',39,11);">Ps 39:11</a>; <a onClick="return mV(\'Isa\',50,9);">Isa 50:9</a>; <a onClick="return mV(\'Isa\',51,8);">51:8</a>; <a onClick="return mV(\'Hsa\',5,12);">Ho 5:12</a>) or that which is frail (<a onClick="return mV(\'Job\',4,19);">Job 4:19</a>; <a onClick="return mV(\'Job\',27,18);">27:18</a>).`<a href="./study/isbe/search.html?string=INSECTS">INSECTS</a>`37';
isbe[6178]='Mother`muth\'-er (\'em, "mother," "dam," "ancestress"; meter):<P>1. Her Position in the Old Testament:<P>In vain do we look in the Scriptures for traces of the low position which woman occupies in many eastern lands. A false impression has been created by her present position in the East, especially under Mohammedan rule. Her place as depicted in the Scriptures is a totally different one. Women there move on the same social plane with men. They often occupy leading public positions (<a onClick="return mV(\'Exd\',15,20);">Ex 15:20</a>; <a onClick="return mV(\'Jdg\',4,4);">Jud 4:4</a>; <a onClick="return mV(\'2Ki\',22,14);">2Ki 22:14</a>). The love of offspring was deeply imbedded in the heart of Hebrew women, and thus motherhood was highly respected. Among the patriarchs women, and especially mothers, occupy a prominent place. In Rebekah\'s marriage, her mother seems to have had equal voice with her father and Laban, her brother (<a onClick="return mV(\'Gen\',24,28,50,53,55);">Ge 24:28,50,53,55</a>). Jacob "obeyed his father and his mother" (<a onClick="return mV(\'Gen\',28,7);">Ge 28:7</a>), and his mother evidently was his chief counselor. The Law places the child under obligation of honoring father and mother alike (<a onClick="return mV(\'Exd\',20,12);">Ex 20:12</a>). The child that strikes father or mother or curses either of them is punished by death (<a onClick="return mV(\'Exd\',21,15,17);">Ex 21:15,17</a>). The same fate overtakes the habitually disobedient (<a onClick="return mV(\'Deu\',21,\'18-21\');">De 21:18-21</a>).<P>In one place in the Law, the mother is even placed before the father as the object of filial reverence (<a onClick="return mV(\'Lev\',19,3);">Le 19:3</a>). The Psalmist depicts deepest grief as that of one who mourneth for his mother (<a onClick="return mV(\'Psa\',35,14);">Ps 35:14</a>). In the entire Book of Proverbs the duty of reverence, love and obedience of sons to their mothers is unceasingly inculcated. The greatest comfort imaginable is that wherewith a mother comforts her son (<a onClick="return mV(\'Isa\',66,13);">Isa 66:13</a>).<P>2. Position in the New Testament:<P>And what is true of the Old Testament is equally true of the New Testament. The same high type of womanhood, the same reverence for one\'s mother is in evidence in both books. The birth of Christ lifted motherhood to the highest possible plane and idealized it for all time. The last thing Jesus did on the Cross was to bestow His mother on John "the beloved" as his special inheritance. What woman is today, what she is in particular in her motherhood, she owes wholly to the position in which the Scriptures have placed her. Sometimes the stepmother is spoken of as the real mother (<a onClick="return mV(\'Gen\',37,10);">Ge 37:10</a>). Sometimes the grandmother or other female relative is thus spoken of (<a onClick="return mV(\'Gen\',3,20);">Ge 3:20</a>; <a onClick="return mV(\'1Ki\',15,10);">1Ki 15:10</a>).<P>Tropically the nation is spoken of as a mother and the people are her children (<a onClick="return mV(\'Isa\',50,1);">Isa 50:1</a>; <a onClick="return mV(\'Jer\',50,12);">Jer 50:12</a>; <a onClick="return mV(\'Hsa\',2,4);">Ho 2:4</a>; <a onClick="return mV(\'Hsa\',4,5);">4:5</a>). Large cities also are "mothers" (<a onClick="return mV(\'2Sa\',20,19);">2Sa 20:19</a>; compare <a onClick="return mV(\'Gal\',4,26);">Ga 4:26</a>; 2Esdras 10:7), and Job even depicts the earth as such (<a onClick="return mV(\'Job\',1,21);">Job 1:21</a>).``42';
isbe[6179]='Mother-In-Law``<a href="./study/isbe/search.html?string=RELATIONSHIPS,+FAMILY">RELATIONSHIPS, FAMILY</a>`1';
isbe[6180]='Motion`mo\'-shun: In 2Esdras 6:14, the King James Version "motion" represents the Latin commotio, "commotion," "disturbance" (the Revised Version (British and American) has revised entirely here). In <a onClick="return mV(\'Rom\',7,5);">Ro 7:5</a>, "the motions of sins, which were by the law," "motion" is used in the sense of "impulse," and "impulses" would probably give the best translation. But the Greek noun (pathemata) is hard to translate exactly, and the Revised Version (British and American) has preferred "passions," as in <a onClick="return mV(\'Gal\',5,24);">Ga 5:24</a>. Sanday (ICC) paraphrases "the impressions of sense, suggestive of sin, stimulated into perverse activity by their legal prohibition." See <a href="./study/isbe/search.html?string=PASSION">PASSION</a>. "Motion" is found also in The <span class="noTag">Wisdom of Solomon 5:11</span> (the King James Version and the Revised Version margin) and The <span class="noTag">Wisdom of Solomon 7:24</span> (the King James Version and the Revised Version (British and American)) in a modern sense.``48';

isbe[6186]='Mount of the Amalekites`("Hill-country of the Amalekites" (<a onClick="return mV(\'Jdg\',12,15);">Jud 12:15</a>)): The Amalekites are usually connected with the valley (<a onClick="return mV(\'Num\',14,25);">Nu 14:25</a>; <a onClick="return mV(\'Jdg\',7,12);">Jud 7:12</a>), but appear from this passage to have had a settlement in the hill country of Ephraim.`<a href="./study/isbe/search.html?string=AMALEKITE">AMALEKITE</a>`1';
isbe[6187]='Mount of the Amorites`("Hill-country of the Amorites" (<a onClick="return mV(\'Deu\',1,7,20,24);">De 1:7,20,24</a>; compare <a onClick="return mV(\'Num\',13,29);">Nu 13:29</a>; <a onClick="return mV(\'Jos\',10,6);">Jos 10:6</a>, etc.)): The region intended is that afterward known as the hill country of Judah and Ephraim, but sometimes "Amorites" is used as a general designation for all the inhabitants of Canaan (<a onClick="return mV(\'Gen\',15,16);">Ge 15:16</a>; <a onClick="return mV(\'Jos\',24,8,18);">Jos 24:8,18</a>, etc.).`<a href="./study/isbe/search.html?string=AMORITES">AMORITES</a>`1';
isbe[6188]='Mount of the Valley`Zereth-shahar is said to be situated in or on the "mount of the valley" (behar ha\'emeq (<a onClick="return mV(\'Jos\',13,19);">Jos 13:19</a>)). Cheyne (EB, under the word) says "i.e. on one of the mountains east of the Jordan valley (compare Josephus 13 27), and not impossibly on that described at length in BJ, VII, vi, 1-3." To the northwest of this mountain is Wady ec-Cara, wherein there may be a reminiscence of Zereth-shahar. There is no certainty.``1';

isbe[6190]='Mourning`morn\'-ing.`<a href="./study/isbe/search.html?string=BURIAL">BURIAL</a>; <a href="./study/isbe/search.html?string=GRIEF">GRIEF</a>`1';
isbe[6191]='Mouse; Mice`mous, mis (\'akhbar; Septuagint mus, "mouse"; compare Arabic \'akbar, "jerboa" not \'akbar, "greater"; compare also proper noun, \'akhbor, "Achbor" (<a onClick="return mV(\'Gen\',36,38);">Ge 36:38</a>; <a onClick="return mV(\'1Ch\',1,49);">1Ch 1:49</a>; also <a onClick="return mV(\'2Ki\',22,12,14);">2Ki 22:12,14</a>; <a onClick="return mV(\'Jer\',26,22);">Jer 26:22</a>; <a onClick="return mV(\'Jer\',36,12);">36:12</a>)): The word occurs in the list of unclean "creeping things" (<a onClick="return mV(\'Lev\',11,29);">Le 11:29</a>), in the account of the golden mice and tumors (the King James Version and the American Revised Version margin "emerods") sent by the Philistines (<a onClick="return mV(\'1Sa\',6,\'4-18\');">1Sa 6:4-18</a>), and in the phrase, "eating swine\'s flesh, and the abomination, and the mouse" (<a onClick="return mV(\'Isa\',66,17);">Isa 66:17</a>). The cosmopolitan housemouse, Mus musculus, is doubtless the species referred to. The jerboa or jumping mouse, Arabic yarbu, is eaten by the Arabs of the Syrian desert, northeast of Damascus. Possibly allied to \'akhbar is the Arabic \'akbar (generally in plural, \'akabir), used for the male of the jerboa.``37';
isbe[6192]='Mouth`mowth (peh, chekh, garon (<a onClick="return mV(\'Psa\',149,6);">Ps 149:6</a>); Aramaic pum, tera (<a onClick="return mV(\'Dan\',3,26);">Da 3:26</a>); stoma, 71 times, once logos, i.e. "word of mouth," "speech" (<a onClick="return mV(\'Act\',15,27);">Ac 15:27</a>); once we find the verb epistomizo, "to silence," "to stop the mouth" (<a onClick="return mV(\'Tts\',1,11);">Tit 1:11</a>)):<P>1. Literal Sense:<P>In addition to frequent references to man and animals, "Their food was yet in their mouths" (<a onClick="return mV(\'Psa\',78,30);">Ps 78:30</a>); "And Yahweh opened the mouth of the ass" (<a onClick="return mV(\'Num\',22,28);">Nu 22:28</a>); "Save me from the lion\'s mouth" (<a onClick="return mV(\'Psa\',22,21);">Ps 22:21</a>), etc., the term is often used in connection with inanimate things: mouth of a sack (<a onClick="return mV(\'Gen\',42,27);">Ge 42:27</a>); of the earth (<a onClick="return mV(\'Gen\',4,11);">Ge 4:11</a>; <a onClick="return mV(\'Num\',26,10);">Nu 26:10</a>); of a well (<a onClick="return mV(\'Num\',29,2,3,8,10);">Nu 29:2,3,8,10</a>); of a cave (<a onClick="return mV(\'Jos\',10,18,22,27);">Jos 10:18,22,27</a>); of Sheol (<a onClick="return mV(\'Psa\',141,7);">Ps 141:7</a>); of the abyss (<a onClick="return mV(\'Jer\',48,28);">Jer 48:28</a>); of furnace (Aramaic tera\', <a onClick="return mV(\'Dan\',3,26);">Da 3:26</a>); of idols (<a onClick="return mV(\'Psa\',115,5);">Ps 115:5</a>; <a onClick="return mV(\'Psa\',135,16,17);">135:16,17</a>).<P>2. Figurative Sense:<P>(1) The "mouth" denotes language, speech, declaration (compare "lips," "<a href="./study/isbe/search.html?string=TONGUE">tongue</a>," which see): "By the mouth of" is "by means of," "on the declaration of" (<a onClick="return mV(\'Luk\',1,70);">Lu 1:70</a>; <a onClick="return mV(\'Act\',1,16);">Ac 1:16</a>); "Whoso killeth any person, the murderer shall be slain at the mouth of witnesses" (<a onClick="return mV(\'Num\',35,30);">Nu 35:30</a>; compare <a onClick="return mV(\'Deu\',17,6);">De 17:6</a>; <a onClick="return mV(\'Mat\',18,16);">Mt 18:16</a>; <a onClick="return mV(\'Hbr\',10,28);">Heb 10:28</a>); "I will give you mouth and wisdom" (<a onClick="return mV(\'Luk\',21,15);">Lu 21:15</a>); "fool\'s mouth" (<a onClick="return mV(\'Pro\',18,7);">Pr 18:7</a>).<P>(2) "Mouth" also denotes "spokesman": "He shall be to thee a mouth" (<a onClick="return mV(\'Exd\',4,16);">Ex 4:16</a>).<P>Numerous are the idiomatic phrases which have, in part, been introduced into English by means of the language of the Bible. "To put into the mouth," if said of God, denotes Divine inspiration (<a onClick="return mV(\'Deu\',18,18);">De 18:18</a>; <a onClick="return mV(\'Mic\',3,5);">Mic 3:5</a>). "To have words put into the mouth" means to have instructions given (<a onClick="return mV(\'Deu\',31,19);">De 31:19</a>; <a onClick="return mV(\'2Sa\',14,3);">2Sa 14:3</a>; <a onClick="return mV(\'Jer\',1,9);">Jer 1:9</a>; <a onClick="return mV(\'Exd\',4,\'11-16\');">Ex 4:11-16</a>). "The fruit of the mouth" (<a onClick="return mV(\'Pro\',18,20);">Pr 18:20</a>) is synonymical with wisdom, the mature utterance of the wise. "To put one\'s mouth into the dust" is equivalent with humbling one\'s self (<a onClick="return mV(\'Lam\',3,29);">La 3:29</a>; compare "to lay one\'s horn in the dust," <a onClick="return mV(\'Job\',16,15);">Job 16:15</a>). Silent submission is expressed by "laying the hand upon the mouth" (<a onClick="return mV(\'Jdg\',18,19);">Jud 18:19</a>; <a onClick="return mV(\'Job\',29,9);">Job 29:9</a>; <a onClick="return mV(\'Job\',40,4);">40:4</a>; <a onClick="return mV(\'Mic\',7,16);">Mic 7:16</a>); compare "to refrain the lips"; see <a href="./study/isbe/search.html?string=LIP">LIP</a>. "To open the mouth wide" against a person is to accuse him wildly and often wrongfully (<a onClick="return mV(\'Psa\',35,21);">Ps 35:21</a>; <a onClick="return mV(\'Isa\',57,4);">Isa 57:4</a>), otherwise "to open one\'s mouth wide," "to have an enlarged mouth" means to have great confidence and joy in speaking or accepting good things (<a onClick="return mV(\'1Sa\',2,1);">1Sa 2:1</a>; <a onClick="return mV(\'Eze\',33,22);">Eze 33:22</a>; <a onClick="return mV(\'2Cr\',6,11);">2Co 6:11</a>; <a onClick="return mV(\'Eph\',6,19);">Eph 6:19</a>). "To gape upon one with the mouth" means to threaten a person (<a onClick="return mV(\'Job\',16,10);">Job 16:10</a>). Divine rebuke is expressed by the "rod of God\'s mouth" (<a onClick="return mV(\'Isa\',11,4);">Isa 11:4</a>), and the Messiah declares "He hath made my mouth like a sharp sword" (<a onClick="return mV(\'Isa\',49,2);">Isa 49:2</a>; compare <a onClick="return mV(\'Rev\',2,16);">Re 2:16</a>; <a onClick="return mV(\'Rev\',19,15,21);">19:15,21</a>). Great anguish, such as dying with thirst, is expressed by "the tongue cleaving to the roof of the mouth" (Hebrew chekh, <a onClick="return mV(\'Job\',29,10);">Job 29:10</a>; <a onClick="return mV(\'Psa\',137,6);">Ps 137:6</a>; compare <a onClick="return mV(\'Psa\',22,15);">22:15</A>).``106';
isbe[6193]='Mowing; Mown Grass`mo\'-ing, (gez, "a shearing," "cut grass"): In <a onClick="return mV(\'Psa\',72,6);">Ps 72:6</a> the good king\'s rule is said to be "like rain upon the mown grass," to start the new growth (compare <a onClick="return mV(\'2Sa\',23,4);">2Sa 23:4</a>; <a onClick="return mV(\'Hsa\',6,3);">Ho 6:3</a>). "The king\'s mowings" (<a onClick="return mV(\'Amo\',7,1);">Am 7:1</a>) were the portion of the spring herbage taken as tribute by the kings of Israel to feed their horses (compare <a onClick="return mV(\'1Sa\',8,15);">1Sa 8:15</a>ff; <a onClick="return mV(\'1Sa\',18,5);">18:5</a>). "After the king\'s mowings" would denote the time when everybody else might turn to reap their greenstuffs (BTP, II, 109). The term "mower" (qatsar, "to dock off," "shorten") in <a onClick="return mV(\'Psa\',129,7);">Ps 129:7</a> the King James Version is rendered "reaper" in the Revised Version (British and American), and in <a onClick="return mV(\'Jam\',5,4);">Jas 5:4</a> the Revised Version (British and American) has "mow" for amao (the King James Version "reap").`<a href="./study/isbe/search.html?string=HARVEST">HARVEST</a>; <a href="./study/isbe/search.html?string=REAPING">REAPING</a>`91';
isbe[6194]='Moza`mo\'-za (motsah):<P>(1) Son of Caleb and Ephah (<a onClick="return mV(\'1Ch\',2,46);">1Ch 2:46</a>).<P>(2) A descendant of Saul (<a onClick="return mV(\'1Ch\',8,36,37);">1Ch 8:36,37</a>; <a onClick="return mV(\'1Ch\',9,42,43);">9:42,43</a>).``1';
isbe[6195]='Mozah`mo\'-za (ha-motsah; Codex Vaticanus Amoke; Codex Alexandrinus Amosa): A town in the territory of Benjamin named after Mizpeh and Chephirah (<a onClick="return mV(\'Jos\',18,26);">Jos 18:26</a>). It may be represented by the modern Beit Mizzeh, the heavy "ts" of the Hebrew letter (tsade) passing into the light "z" of the Arabic, a not unusual change. The name means "place of hard stone." The village lies to the north of Quloniyeh (possibly Emmaus), about 4 miles northwest of Jerusalem.``1';
isbe[6196]='Muffler`muf\'-ler (re\'alah): The name given to an article of woman\'s dress in <a onClick="return mV(\'Isa\',3,19);">Isa 3:19</a>. It describes a veil more elaborate and costly than the ordinary. A cognate word in the sense of "veiled" is applied in the Mishna (Shabbath, vi.6) to Jewesses from Arabia.`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>`1';
isbe[6197]='Mulberry; Trees`mul\'-ber-i, (bekha\'im; Septuagint apioi, "pear trees" (<a onClick="return mV(\'2Sa\',5,23);">2Sa 5:23</a>f; <a onClick="return mV(\'1Ch\',14,14);">1Ch 14:14</a>f; margin "balsam-trees"; <a onClick="return mV(\'Psa\',84,6);">Ps 84:6</a>, the King James Version "Baca," margin "mulberry trees," the Revised Version (British and American) "weeping," margin "balsam-trees"): According to Arabic writers the Baca tree is similar to the balsam (Balsamodendron opobalsamum), and grows near Mecca; no such tree is, however, known in Palestine. The name may, in Hebrew, have been applied to some species of <a href="./study/isbe/search.html?string=ACACIA">ACACIA</a> (which see). The idea of "weeping" implied in the root, both in Hebrew and Arabic, may be explained by the exudation of gum. "The sound of marching in the tops of the mulberry trees" has been explained to refer to the quivering of the leaves of poplars, but there is not much to support this view (see <a href="./study/isbe/search.html?string=POPLAR">POPLAR</a>). The translation "mulberry trees" is, however, even more improbable, as this tree, though very plentiful today, had not been introduced into Palestine in Old Testament times.<P>Mulberry (moron, (1Macc 6:34)): The Syrians at Bathzacharias "to the end they might provoke the elephants to fight, they, shewed them the blood of grapes and mulberries." This reference must be to the deep red juice of the black mulberry (Morus nigra), the tut shami of Palestine, a variety cultivated all over the land\' for its luscious, juicy fruit.`<a href="./study/isbe/search.html?string=SYCOMORE">SYCOMORE</a>`117';
isbe[6198]='Mulcted`mulk\'-ted (\'anash, "to be punished," "fined"): "The simple pass on, and are mulcted" (<a onClick="return mV(\'Pro\',22,3);">Pr 22:3</a> the Revised Version margin, the Revised Version (British and American) "suffer for it," the King James Version "are punished").``1';
isbe[6199]='Mule`mul (peredh (<a onClick="return mV(\'1Ki\',10,25);">1Ki 10:25</a>; <a onClick="return mV(\'1Ki\',18,5);">18:5</a>; <a onClick="return mV(\'Ezr\',2,66);">Ezr 2:66</a>; <a onClick="return mV(\'Isa\',66,20);">Isa 66:20</a>; <a onClick="return mV(\'Zec\',14,15);">Zec 14:15</a>), the feminine pirdah (<a onClick="return mV(\'1Ki\',1,33,38,44);">1Ki 1:33,38,44</a>), rekhesh, "swift steeds," the King James Version "mules" (<a onClick="return mV(\'Est\',8,10,14);">Es 8:10,14</a>), \'achashteranim, "used in the king\'s service," the King James Version "camels," the Revised Version margin "mules" (<a onClick="return mV(\'Est\',8,10,14);">Es 8:10,14</a>), yemim, "hot springs," the King James Version "mules" (<a onClick="return mV(\'Gen\',36,24);">Ge 36:24</a>); hemionos, "half-ass," "mule" (1Esdras 5:43; Judith 15:11)): Mules are mentioned as riding animals for princes (<a onClick="return mV(\'2Sa\',13,29);">2Sa 13:29</a>; <a onClick="return mV(\'2Sa\',18,9);">18:9</a>; <a onClick="return mV(\'1Ki\',1,33,38,44);">1Ki 1:33,38,44</a>); in the tribute brought to Solomon (<a onClick="return mV(\'2Ch\',9,24);">2Ch 9:24</a>); as beasts of burden (<a onClick="return mV(\'2Ki\',5,17);">2Ki 5:17</a>; <a onClick="return mV(\'1Ch\',12,40);">1Ch 12:40</a>); horses and mules are obtained from the "house of Togarmah" in the distant north (<a onClick="return mV(\'Eze\',27,14);">Eze 27:14</a>). The injunction of <a onClick="return mV(\'Psa\',32,9);">Ps 32:9</a>, "Be ye not as the horse, or as the mule, which have no understanding," need not be understood as singling out the horse and mule as more in need of guidance than the rest of the brute creation, but rather as offering familiar examples to contrast with man who should use his intelligence.<P>At the present day mules are used as pack animals and for drawing freight wagons, rarely for riding. One does not often see in Palestine mules as large and fine as are common in Europe and America. This may be because most of the mares and many of the donkeys are small.``37';
isbe[6200]='Multitude; Mixed`mul\'-ti-tud, mikst.`<a href="./study/isbe/search.html?string=MINGLED+PEOPLE">MINGLED PEOPLE</a>`1';
