<script>var eastonArray = new Array ();
eastonArray["$$T0000400"] = "<b>Baal-shalisha:</b> lord of Shalisha, a place from which a man came with provisions for Elisha, apparently not far from Gilgal (<a href=\"#\" onClick=\"return mV('2Ki',4,42);\">2Ki 4:42</a>). It has been identified with Sirisia, 13 miles north of Lydda.";
eastonArray["$$T0000401"] = "<b>Baal-tamar:</b> lord of palm trees, a place in the tribe of Benjamin near Gibeah of Saul (<a href=\"#\" onClick=\"return mV('Jdg',20,33);\">Jdg 20:33</a>). It was one of the sanctuaries or groves of Baal. Probably the palm tree of Deborah (<a href=\"#\" onClick=\"return mV('Jdg',4,5);\">Jdg 4:5</a>) is alluded to in the name.";
eastonArray["$$T0000402"] = "<b>Baal-zebub:</b> fly-lord, the god of the Philistines at Ekron (<a href=\"#\" onClick=\"return mV('2Ki',1,2,3,16);\">2Ki 1:2-3, 16</a>). This name was given to the god because he was supposed to be able to avert the plague of flies which in that region was to be feared. He was consulted by Ahaziah as to his recovery.";
eastonArray["$$T0000403"] = "<b>Baal-zephon:</b> Baal of the north, an Egyptian town on the shores of the Gulf of Suez (<a href=\"#\" onClick=\"return mV('Exd',14,2);\">Exd 14:2</a>; <a href=\"#\" onClick=\"return mV('Num',33,7);\">Num 33:7</a>), over against which the children of Israel encamped before they crossed the Red Sea. It is probably to be identified with the modern Jebel Deraj or Kulalah, on the western shore of the Gulf of Suez. Baal-zapuna of the Egyptians was a place of worship.";
eastonArray["$$T0000404"] = "<b>Baana:</b> son of affliction.<br><br>(1.) One of Solomon's purveyors (<a href=\"#\" onClick=\"return mV('1Ki',4,12);\">1Ki 4:12</a>).<br><br>(2.) Son of Hushai, another of Solomon's purveyors (<a href=\"#\" onClick=\"return mV('1Ki',4,16);\">1Ki 4:16</a>).<br><br>(3.) Father of Zadok (<a href=\"#\" onClick=\"return mV('Neh',3,4);\">Neh 3:4</a>).";
eastonArray["$$T0000405"] = "<b>Baanah:</b> son of affliction.<br><br>(1.) One of the two sons of Rimmon the Beerothite, a captain in Saul's army. He and his brother Rechab assassinated Ishbosheth (<a href=\"#\" onClick=\"return mV('2Sa',4,2);\">2Sa 4:2</a>), and were on this account slain by David, and their mutilated bodies suspended over the pool at Hebron (<a href=\"#\" onClick=\"return mV('2Sa',4,5,6,12);\">5, 6, 12</a>).<br><br>(2.) The father of Heled, who was one of David's thirty heroes (<a href=\"#\" onClick=\"return mV('2Sa',23,29);\">2Sa 23:29</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,30);\">1Ch 11:30</a>).";
eastonArray["$$T0000406"] = "<b>Baasha:</b> bravery, the third king of the separate kingdom of Israel, and founder of its second dynasty (<a href=\"#\" onClick=\"return mV('1Ki',15,'1-')\">1Ki 15</a>; <a href=\"#\" onClick=\"return mV('1Ki',16,'1-')\">16; <a href=\"#\" onClick=\"return mV('2Ch',16,'1-6');\">2Ch 16:1-6</a>). He was the son of Ahijah of the tribe of Issachar. The city of Tirzah he made the capital of his kingdom, and there he was buried, after an eventful reign of twenty-four years (<a href=\"#\" onClick=\"return mV('1Ki',15,33);\">1Ki 15:33</a>). On account of his idolatries his family was exterminated, according to the word of the prophet Jehu (<a href=\"#\" onClick=\"return mV('1Ki',16,3,4,'10-13');\">1Ki 16:3-4, 10-13</a>).";
eastonArray["$$T0000407"] = "<b>Babe:</b> used of children generally (<a href=\"#\" onClick=\"return mV('Mat',11,25);\">Mat 11:25</a>; <a href=\"#\" onClick=\"return mV('Mat',21,16);\">21:16</a>; <a href=\"#\" onClick=\"return mV('Luk',10,21);\">Luk 10:21</a>; <a href=\"#\" onClick=\"return mV('Rom',2,20);\">Rom 2:20</a>). It is used also of those who are weak in Christian faith and knowledge (<a href=\"#\" onClick=\"return mV('1Cr',3,1);\">1Cr 3:1</a>; <a href=\"#\" onClick=\"return mV('Hbr',5,13);\">Hbr 5:13</a>; <a href=\"#\" onClick=\"return mV('1Pe',2,2);\">1Pe 2:2</a>). In <a href=\"#\" onClick=\"return mV('Isa',3,4);\">Isa 3:4</a> the word \"babes\" refers to a succession of weak and wicked princes who reigned over Judah from the death of Josiah downward to the destruction of Jerusalem.";
eastonArray["$$T0000408"] = "<b>Babel, Tower of:</b> the name given to the tower which the primitive fathers of our race built in the land of Shinar after the Deluge (<a href=\"#\" onClick=\"return mV('Gen',11,'1-9');\">Gen 11:1-9</a>). Their object in building this tower was probably that it might be seen as a rallying-point in the extensive plain of Shinar, to which they had emigrated from the uplands of Armenia, and so prevent their being scattered abroad. But God interposed and defeated their design by confounding their language, and hence the name Babel, meaning \"confusion.\" In the Babylonian tablets there is an account of this event, and also of the creation and the deluge. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000758');\">CHALDEA</a>.)<br><br>The Temple of Belus, which is supposed to occupy its site, is described by the Greek historian Herodotus as a temple of great extent and magnificence, erected by the Babylonians for their god Belus. The treasures Nebuchadnezzar brought from Jerusalem were laid up in this temple (<a href=\"#\" onClick=\"return mV('2Ch',36,7);\">2Ch 36:7</a>).<br><br>The Birs Nimrud, at ancient Borsippa, about 7 miles south-west of Hillah, the modern town which occupies a part of the site of ancient Babylon, and 6 miles from the Euphrates, is an immense mass of broken and fire-blasted fragments, of about 2,300 feet in circumference, rising suddenly to the height of 235 feet above the desert-plain, and is with probability regarded as the ruins of the tower of Babel. This is \"one of the most imposing ruins in the country.\" Others think it to be the ruins of the Temple of Belus.";
eastonArray["$$T0000409"] = "<b>Babylon:</b> the Greek form of BABEL; Semitic form Babilu, meaning \"The Gate of God.\" In the Assyrian tablets it means \"The city of the dispersion of the tribes.\" The monumental list of its kings reaches back to B.C. 2300, and includes Khammurabi, or Amraphel (q.v.), the contemporary of Abraham. It stood on the Euphrates, about 200 miles above its junction with the Tigris, which flowed through its midst and divided it into two almost equal parts. The Elamites invaded Chaldea (i.e., Lower Mesopotamia, or Shinar, and Upper Mesopotamia, or Accad, now combined into one) and held it in subjection. At length Khammu-rabi delivered it from the foreign yoke, and founded the new empire of Chaldea (q.v.), making Babylon the capital of the united kingdom. This city gradually grew in extent and grandeur, but in process of time it became subject to Assyria. On the fall of Nineveh (B.C. 606) it threw off the Assyrian yoke, and became the capital of the growing Babylonian empire. Under Nebuchadnezzar it became one of the most splendid cities of the ancient world.<br><br>After passing through various vicissitudes the city was occupied by Cyrus, \"king of Elam,\" B.C. 538, who issued a decree permitting the Jews to return to their own land (606) it threw off the Assyrian yoke, and became the capital of <a href=\"#\" onClick=\"return mV('Ezr',1,'1-')\">Ezr 1</a>). It then ceased to be the capital of an empire. It was again and again visited by hostile armies, till its inhabitants were all driven from their homes, and the city became a complete desolation, its very site being forgotten from among men.<br><br>On the west bank of the Euphrates, about 50 miles south of Bagdad, there is found a series of artificial mounds of vast extent. These are the ruins of this once famous proud city. These ruins are principally<br><br>(1.) the great mound called Babil by the Arabs. This was probably the noted Temple of Belus, which was a pyramid about 480 feet high.<br><br>(2.) The Kasr (i.e., \"the palace\"). This was the great palace of Nebuchadnezzar. It is almost a square, each side of which is about 700 feet long. The little town of Hillah, near the site of Babylon, is built almost wholly of bricks taken from this single mound.<br><br>(3.) A lofty mound, on the summit of which stands a modern tomb called Amran ibn-Ali. This is probably the most ancient portion of the remains of the city, and represents the ruins of the famous hanging-gardens, or perhaps of some royal palace. The utter desolation of the city once called \"The glory of kingdoms\" (<a href=\"#\" onClick=\"return mV('Isa',13,19);\">Isa 13:19</a>) was foretold by the prophets (<a href=\"#\" onClick=\"return mV('Isa',13,'4-22');\">Isa 13:4-22</a>; <a href=\"#\" onClick=\"return mV('Jer',25,12);\">Jer 25:12</a>; <a href=\"#\" onClick=\"return mV('Jer',50,2,3);\">50:2-3</a>; <a href=\"#\" onClick=\"return mV('Dan',2,'31-38');\">Dan 2:31-38</a>).<br><br>The Babylon mentioned in <a href=\"#\" onClick=\"return mV('1Pe',5,13);\">1Pe 5:13</a> was not Rome, as some have thought, but the literal city of Babylon, which was inhabited by many Jews at the time Peter wrote.<br><br>In <a href=\"#\" onClick=\"return mV('Rev',14,8);\">Rev 14:8</a>; <a href=\"#\" onClick=\"return mV('Rev',16,19);\">Rev 16:19</a>; <a href=\"#\" onClick=\"return mV('Rev',17,5);\">Rev 17:5</a>; and <a href=\"#\" onClick=\"return mV('Rev',18,2);\">Rev 18:2</a>, \"Babylon\" is supposed to mean Rome, not considered as pagan, but as the prolongation of the ancient power in the papal form. Rome, pagan and papal, is regarded as one power. \"The literal Babylon was the beginner and supporter of tyranny and idolatry...This city and its whole empire were taken by the Persians under Cyrus; the Persians were subdued by the Macedonians, and the Macedonians by the Romans; so that Rome succeeded to the power of old Babylon. And it was her method to adopt the worship of the false deities she had conquered; so that by her own act she became the heiress and successor of all the Babylonian idolatry, and of all that was introduced into it by the immediate successors of Babylon, and consequently of all the idolatry of the earth.\" Rome, or \"mystical Babylon,\" is \"that great city which reigneth over the kings of the earth\" (<a href=\"#\" onClick=\"return mV('Rev',17,18);\">Rev 17:18</a>).";
eastonArray["$$T0000410"] = "<b>Babylonish garment:</b> a robe of rich colours fabricated at Babylon, and hence of great value (<a href=\"#\" onClick=\"return mV('Jos',7,21);\">Jos 7:21</a>).";
eastonArray["$$T0000411"] = "<b>Babylon, kingdom of:</b> called \"the land of the Chaldeans\" (<a href=\"#\" onClick=\"return mV('Jer',24,5);\">Jer 24:5</a>; <a href=\"#\" onClick=\"return mV('Jer',12,13);\">12:13</a>), was an extensive province in Central Asia along the valley of the Tigris from the Persian Gulf northward for some 300 miles. It was famed for its fertility and its riches. Its capital was the city of Babylon, a great commercial centre (<a href=\"#\" onClick=\"return mV('Eze',17,4);\">Eze 17:4</a>; <a href=\"#\" onClick=\"return mV('Isa',43,14);\">Isa 43:14</a>). Babylonia was divided into the two districts of Accad in the north, and Summer (probably the Shinar of the Old Testament) in the south. Among its chief cities may be mentioned Ur (now Mugheir or Mugayyar), on the western bank of the Euphrates; Uruk, or Erech (<a href=\"#\" onClick=\"return mV('Gen',10,10);\">Gen 10:10</a>) (now Warka), between Ur and Babylon; Larsa (now Senkereh), the Ellasar of <a href=\"#\" onClick=\"return mV('Gen',14,1);\">Gen 14:1</a>, a little to the east of Erech; Nipur (now Niffer), south-east of Babylon; Sepharvaim (<a href=\"#\" onClick=\"return mV('2Ki',17,24);\">2Ki 17:24</a>), \"the two Sipparas\" (now Abu-Habba), considerably to the north of Babylon; and Eridu, \"the good city\" (now Abu-Shahrein), which lay originally on the shore of the Persian Gulf, but is now, owing to the silting up of the sand, about 100 miles distant from it. Another city was Kulunu, or Calneh (<a href=\"#\" onClick=\"return mV('Gen',10,10);\">Gen 10:10</a>).<br><br>The salt-marshes at the mouths of the Euphrates and Tigris were called Marratu, \"the bitter\" or \"salt\", the Merathaim of <a href=\"#\" onClick=\"return mV('Jer',50,21);\">Jer 50:21</a>. They were the original home of the Kalda, or Chaldeans.<br><br>The most famous of the early kings of Babylonia were Sargon of Accad (B.C. 3800) and his son, Naram-Sin, who conquered a large part of Western Asia, establishing their power in Palestine, and even carrying their arms to the Sinaitic peninsula. A great Babylonian library was founded in the reign of Sargon. Babylonia was subsequently again broken up into more than one state, and at one time fell under the domination of Elam. This was put an end to by Khammu-rabi (Amraphel), who drove the Elamites out of the country, and overcame Arioch, the son of an Elamite prince. From this time forward Babylonia was a united monarchy. About B.C. 1750 it was conquered by the Kassi, or Kosseans, from the mountains of Elam, and a Kassite dynasty ruled over it for 576 years and 9 months.<br><br>In the time of Khammu-rabi, Syria and Palestine were subject to Babylonia and its Elamite suzerain; and after the overthrow of the Elamite supremacy, the Babylonian kings continued to exercise their influence and power in what was called \"the land of the Amorites.\" In the epoch of the Kassite dynasty, however, Canaan passed into the hands of Egypt.<br><br>In B.C. 729, Babylonia was conquered by the Assyrian king Tiglath-pileser III.; but on the death of Shalmaneser IV. it was seized by the Kalda or \"Chaldean\" prince Merodach-baladan (<a href=\"#\" onClick=\"return mV('2Ki',20,'12-19');\">2Ki 20:12-19</a>), who held it till B.C. 709, when he was driven out by Sargon.<br><br>Under Sennacherib, Babylonia revolted from Assyria several times, with the help of the Elamites, and after one of these revolts Babylon was destroyed by Sennacherib, B.C. 689. It was rebuilt by Esarhaddon, who made it his residence during part of the year, and it was to Babylon that Manasseh was brought a prisoner (<a href=\"#\" onClick=\"return mV('2Ch',33,11);\">2Ch 33:11</a>). After the death of Esarhaddon, Saul-sumyukin, the viceroy of Babylonia, revolted against his brother the Assyrian king, and the revolt was suppressed with difficulty.<br><br>When Nineveh was destroyed, B.C. 606, Nabopolassar, the viceroy of Babylonia, who seems to have been of Chaldean descent, made himself independent. His son Nebuchadrezzar (Nabu-kudur-uzur), after defeating the Egyptians at Carchemish, succeeded him as king, B.C. 604, and founded the Babylonian empire. He strongly fortified Babylon, and adorned it with palaces and other buildings. His son, Evil-merodach, who succeeded him in B.C. 561, was murdered after a reign of two years. The last monarch of the Babylonian empire was Nabonidus (Nabu-nahid), B.C. 555-538, whose eldest son, Belshazzar (Bilu-sar-uzur), is mentioned in several inscriptions. Babylon was captured by Cyrus, B.C. 538, and though it revolted more than once in later years, it never succeeded in maintaining its independence.";
eastonArray["$$T0000412"] = "<b>Baca, Valley of:</b> (<a href=\"#\" onClick=\"return mV('Psa',84,6);\">Psa 84:6</a>; R.V., \"valley of weeping,\" marg., \"or balsam trees\"), probably a valley in some part of Palestine, or generally some one of the valleys through which pilgrims had to pass on their way to the sanctuary of Jehovah on Zion; or it may be figuratively \"a valley of weeping.\"";
eastonArray["$$T0000413"] = "<b>Backbite:</b> In <a href=\"#\" onClick=\"return mV('Psa',15,3);\">Psa 15:3</a>, the rendering of a word which means to run about tattling, calumniating; in <a href=\"#\" onClick=\"return mV('Pro',25,23);\">Pro 25:23</a>, secret talebearing or slandering; in <a href=\"#\" onClick=\"return mV('Rom',1,30);\">Rom 1:30</a> and <a href=\"#\" onClick=\"return mV('2Cr',12,20);\">2Cr 12:20</a>, evil-speaking, maliciously defaming the absent.";
eastonArray["$$T0000414"] = "<b>Backslide:</b> to draw back or apostatize in matters of religion (<a href=\"#\" onClick=\"return mV('Act',21,21);\">Act 21:21</a>; <a href=\"#\" onClick=\"return mV('2Th',2,3);\">2Th 2:3</a>; <a href=\"#\" onClick=\"return mV('1Ti',4,1);\">1Ti 4:1</a>). This may be either partial (<a href=\"#\" onClick=\"return mV('Pro',14,14);\">Pro 14:14</a>) or complete (<a href=\"#\" onClick=\"return mV('Hbr',6,'4-6');\">Hbr 6:4-6</a>; <a href=\"#\" onClick=\"return mV('Hbr',10,'38-39');\">10:38-39</a>). The apostasy may be both doctrinal and moral.";
eastonArray["$$T0000415"] = "<b>Badger:</b> this word is found in <a href=\"#\" onClick=\"return mV('Exd',25,5);\">Exd 25:5</a>; <a href=\"#\" onClick=\"return mV('Exd',26,14);\">26:14</a>; <a href=\"#\" onClick=\"return mV('Exd',35,7,23);\">35:7, 23</a>; <a href=\"#\" onClick=\"return mV('Exd',36,19);\">36:19</a>; <a href=\"#\" onClick=\"return mV('Exd',39,34);\">39:34</a>; <a href=\"#\" onClick=\"return mV('Num',4,6);\">Num 4:6</a>, etc. The tabernacle was covered with badgers' skins; the shoes of women were also made of them (<a href=\"#\" onClick=\"return mV('Eze',16,10);\">Eze 16:10</a>). Our translators seem to have been misled by the similarity in sound of the Hebrew <i>tachash</i> and the Latin <i>taxus</i>, \"a badger.\" The revisers have correctly substituted \"seal skins.\" The Arabs of the Sinaitic peninsula apply the name <i>tucash</i> to the seals and dugongs which are common in the Red Sea, and the skins of which are largely used as leather and for sandals. Though the badger is common in Palestine, and might occur in the wilderness, its small hide would have been useless as a tent covering. The dugong, very plentiful in the shallow waters on the shores of the Red Sea, is a marine animal from 12 to 30 feet long, something between a whale and a seal, never leaving the water, but very easily caught. It grazes on seaweed, and is known by naturalists as <i>Halicore tabernaculi</i>.";
eastonArray["$$T0000416"] = "<b>Bag:</b><br><br>(1.) A pocket of a cone-like shape in which Naaman bound two pieces of silver for Gehazi (<a href=\"#\" onClick=\"return mV('2Ki',5,23);\">2Ki 5:23</a>). The same Hebrew word occurs elsewhere only in <a href=\"#\" onClick=\"return mV('Isa',3,22);\">Isa 3:22</a>, where it is rendered \"crisping-pins,\" but denotes the reticules (or as R.V., \"satchels\") carried by Hebrew women.<br><br>(2.) Another word (kees) so rendered means a bag for carrying weights (<a href=\"#\" onClick=\"return mV('Deu',25,13);\">Deu 25:13</a>; <a href=\"#\" onClick=\"return mV('Pro',16,11);\">Pro 16:11</a>; <a href=\"#\" onClick=\"return mV('Mic',6,11);\">Mic 6:11</a>). It also denotes a purse (<a href=\"#\" onClick=\"return mV('Pro',1,14);\">Pro 1:14</a>) and a cup (<a href=\"#\" onClick=\"return mV('Pro',23,31);\">23:31</a>).<br><br>(3.) Another word rendered \"bag\" in <a href=\"#\" onClick=\"return mV('1Sa',17,40);\">1Sa 17:40</a> is rendered \"sack\" in <a href=\"#\" onClick=\"return mV('Gen',42,25);\">Gen 42:25</a>; and in <a href=\"#\" onClick=\"return mV('1Sa',9,7);\">1Sa 9:7</a>; <a href=\"#\" onClick=\"return mV('1Sa',21,5);\">21:5</a> \"vessel,\" or wallet for carrying food.<br><br>(4.) The word rendered in the Authorized Version \"bags,\" in which the priests bound up the money contributed for the restoration of the temple (<a href=\"#\" onClick=\"return mV('2Ki',12,10);\">2Ki 12:10</a>), is also rendered \"bundle\" (<a href=\"#\" onClick=\"return mV('Gen',42,35);\">Gen 42:35</a>; <a href=\"#\" onClick=\"return mV('1Sa',25,29);\">1Sa 25:29</a>). It denotes bags used by travellers for carrying money during a journey (<a href=\"#\" onClick=\"return mV('Pro',7,20);\">Pro 7:20</a>; <a href=\"#\" onClick=\"return mV('Hag',1,6);\">Hag 1:6</a>).<br><br>(5.) The \"bag\" of Judas was a small box (<a href=\"#\" onClick=\"return mV('Jhn',12,6);\">Jhn 12:6</a>; <a href=\"#\" onClick=\"return mV('Jhn',13,29);\">13:29</a>).";
eastonArray["$$T0000417"] = "<b>Bahurim:</b> young men, a place east of Jerusalem (<a href=\"#\" onClick=\"return mV('2Sa',3,16);\">2Sa 3:16</a>; <a href=\"#\" onClick=\"return mV('2Sa',19,16);\">19:16</a>), on the road to the Jordan valley. Here Shimei resided, who poured forth vile abuse against David, and flung dust and stones at him and his party when they were making their way down the eastern slopes of Olivet toward Jordan (<a href=\"#\" onClick=\"return mV('2Sa',16,5);\">16:5</a>); and here Jonathan and Ahimaaz hid themselves (<a href=\"#\" onClick=\"return mV('2Sa',17,18);\">17:18</a>).<br><br>With the exception of Shimei, Azmaveth, one of David's heroes, is the only other native of the place who is mentioned (<a href=\"#\" onClick=\"return mV('2Sa',23,31);\">2Sa 23:31</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,33);\">1Ch 11:33</a>).";
eastonArray["$$T0000418"] = "<b>Bajith:</b> house, probably a city of Moab, which had a celebrated idol-temple (<a href=\"#\" onClick=\"return mV('Isa',15,2);\">Isa 15:2</a>). It has also been regarded as denoting simply the temple of the idol of Moab as opposed to the \"high place.\"";
eastonArray["$$T0000419"] = "<b>Bake:</b> The duty of preparing bread was usually, in ancient times, committed to the females or the slaves of the family (<a href=\"#\" onClick=\"return mV('Gen',18,6);\">Gen 18:6</a>; <a href=\"#\" onClick=\"return mV('Lev',26,26);\">Lev 26:26</a>; <a href=\"#\" onClick=\"return mV('1Sa',8,13);\">1Sa 8:13</a>); but at a later period we find a class of public bakers mentioned (<a href=\"#\" onClick=\"return mV('Hsa',7,4,6);\">Hsa 7:4, 6</a>; <a href=\"#\" onClick=\"return mV('Jer',37,21);\">Jer 37:21</a>).<br><br>The bread was generally in the form of long or round cakes (<a href=\"#\" onClick=\"return mV('Exd',29,23);\">Exd 29:23</a>; <a href=\"#\" onClick=\"return mV('1Sa',2,36);\">1Sa 2:36</a>), of a thinness that rendered them easily broken (<a href=\"#\" onClick=\"return mV('Isa',58,7);\">Isa 58:7</a>; <a href=\"#\" onClick=\"return mV('Mat',14,19);\">Mat 14:19</a>; <a href=\"#\" onClick=\"return mV('Mat',26,26);\">26:26</a>; <a href=\"#\" onClick=\"return mV('Act',20,11);\">Act 20:11</a>). Common ovens were generally used; at other times a jar was half-filled with hot pebbles, and the dough was spread over them. Hence we read of \"cakes baken on the coals\" (<a href=\"#\" onClick=\"return mV('1Ki',19,6);\">1Ki 19:6</a>), and \"baken in the oven\" (<a href=\"#\" onClick=\"return mV('Lev',2,4);\">Lev 2:4</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000644');\">BREAD</a>.)";
eastonArray["$$T0000420"] = "<b>Bake-meats:</b> baked provisions (<a href=\"#\" onClick=\"return mV('Gen',40,17);\">Gen 40:17</a>), literally \"works of the baker,\" such as biscuits and cakes.";
eastonArray["$$T0000421"] = "<b>Balaam:</b> lord of the people; foreigner or glutton, as interpreted by others, the son of Beor, was a man of some rank among the Midianites (<a href=\"#\" onClick=\"return mV('Num',31,8);\">Num 31:8</a>; <a href=\"#\" onClick=\"return mV('Num',31,16);\">Num 31:16</a>). He resided at Pethor (<a href=\"#\" onClick=\"return mV('Deu',23,4);\">Deu 23:4</a>), in Mesopotamia (<a href=\"#\" onClick=\"return mV('Num',23,7);\">Num 23:7</a>). It is evident that though dwelling among idolaters he had some knowledge of the true God; and was held in such reputation that it was supposed that he whom he blessed was blessed, and he whom he cursed was cursed. When the Israelites were encamped on the plains of Moab, on the east of Jordan, by Jericho, Balak sent for Balaam \"from Aram, out of the mountains of the east,\" to curse them; but by the remarkable interposition of God he was utterly unable to fulfil Balak's wish, however desirous he was to do so. The apostle Peter refers (<a href=\"#\" onClick=\"return mV('2Pe',2,15,16);\">2Pe 2:15-16</a>) to this as an historical event. In <a href=\"#\" onClick=\"return mV('Mic',6,5);\">Mic 6:5</a> reference also is made to the relations between Balaam and Balak. Though Balaam could not curse Israel, yet he suggested a mode by which the divine displeasure might be caused to descend upon them (In <a href=\"#\" onClick=\"return mV('Num',25,'1-')\">Num 25</a>). In a battle between Israel and the Midianites (q.v.) Balaam was slain while fighting on the side of Balak (<a href=\"#\" onClick=\"return mV('Num',31,8);\">Num 31:8</a>).<br><br>The \"doctrine of Balaam\" is spoken of in <a href=\"#\" onClick=\"return mV('Rev',2,14);\">Rev 2:14</a>, in allusion to the fact that it was through the teaching of Balaam that Balak learned the way by which the Israelites might be led into sin. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002725');\">NICOLAITANES</a>.) Balaam was constrained to utter prophecies regarding the future of Israel of wonderful magnificence and beauty of expression (<a href=\"#\" onClick=\"return mV('Num',24,'5-9',17);\">Num 24:5-9, 17</a>).";
eastonArray["$$T0000422"] = "<b>Baladan:</b> he has given a son, the father of the Babylonian king (<a href=\"#\" onClick=\"return mV('2Ki',20,12);\">2Ki 20:12</a>; <a href=\"#\" onClick=\"return mV('Isa',39,1);\">Isa 39:1</a>) Merodach-baladan (q.v.).";
eastonArray["$$T0000423"] = "<b>Balah:</b> a city in the tribe of Simeon (<a href=\"#\" onClick=\"return mV('Jos',19,3);\">Jos 19:3</a>), elsewhere called Bilhah (<a href=\"#\" onClick=\"return mV('1Ch',4,29);\">1Ch 4:29</a>) and Baalah (<a href=\"#\" onClick=\"return mV('Jos',15,29);\">Jos 15:29</a>).";
eastonArray["$$T0000424"] = "<b>Balak:</b> empty; spoiler, a son of Zippor, and king of the Moabites (<a href=\"#\" onClick=\"return mV('Num',22,2,4);\">Num 22:2, 4</a>). From fear of the Israelites, who were encamped near the confines of his territory, he applied to Balaam (q.v.) to curse them; but in vain (<a href=\"#\" onClick=\"return mV('Jos',24,9);\">Jos 24:9</a>).";
eastonArray["$$T0000425"] = "<b>Balance:</b> occurs in <a href=\"#\" onClick=\"return mV('Lev',19,36);\">Lev 19:36</a> and <a href=\"#\" onClick=\"return mV('Isa',46,6);\">Isa 46:6</a>, as the rendering of the Hebrew <i>kanch'</i>, which properly means \"a reed\" or \"a cane,\" then a rod or beam of a balance. This same word is translated \"measuring reed\" in <a href=\"#\" onClick=\"return mV('Eze',40,3,5);\">Eze 40:3, 5</a>; <a href=\"#\" onClick=\"return mV('Eze',42,'16-18');\">42:16-18</a>. There is another Hebrew word, <i>mozena'yim</i>, i.e., \"two poisers\", also so rendered (<a href=\"#\" onClick=\"return mV('Dan',5,27);\">Dan 5:27</a>). The balances as represented on the most ancient Egyptian monuments resemble those now in use. A \"pair of balances\" is a symbol of justice and fair dealing (<a href=\"#\" onClick=\"return mV('Job',31,6);\">Job 31:6</a>; <a href=\"#\" onClick=\"return mV('Psa',62,9);\">Psa 62:9</a>; <a href=\"#\" onClick=\"return mV('Pro',11,1);\">Pro 11:1</a>). The expression denotes great want and scarcity in <a href=\"#\" onClick=\"return mV('Rev',6,5);\">Rev 6:5</a>.";
eastonArray["$$T0000426"] = "<b>Baldness:</b> from natural causes was uncommon (<a href=\"#\" onClick=\"return mV('2Ki',2,23);\">2Ki 2:23</a>; <a href=\"#\" onClick=\"return mV('Isa',3,24);\">Isa 3:24</a>). It was included apparently under \"scab\" and \"scurf,\" which disqualified for the priesthood (<a href=\"#\" onClick=\"return mV('Lev',21,20);\">Lev 21:20</a>). The Egyptians were rarely subject to it. This probably arose from their custom of constantly shaving the head, only allowing the hair to grow as a sign of mourning. With the Jews artificial baldness was a sign of mourning (<a href=\"#\" onClick=\"return mV('Isa',22,12);\">Isa 22:12</a>; <a href=\"#\" onClick=\"return mV('Jer',7,29);\">Jer 7:29</a>; <a href=\"#\" onClick=\"return mV('Jer',16,6);\">16:6</a>); it also marked the conclusion of a Nazarite's vow (<a href=\"#\" onClick=\"return mV('Act',18,18);\">Act 18:18</a>; <a href=\"#\" onClick=\"return mV('Act',21,24);\">21:24</a>; <a href=\"#\" onClick=\"return mV('Num',6,9);\">Num 6:9</a>). It is often alluded to (<a href=\"#\" onClick=\"return mV('Mic',1,16);\">Mic 1:16</a>; <a href=\"#\" onClick=\"return mV('Amo',8,10);\">Amo 8:10</a>; <a href=\"#\" onClick=\"return mV('Jer',47,5);\">Jer 47:5</a>). The Jews were forbidden to follow the customs of surrounding nations in making themselves bald (<a href=\"#\" onClick=\"return mV('Deu',14,1);\">Deu 14:1</a>).";
eastonArray["$$T0000427"] = "<b>Balm:</b> contracted from Bal'sam, a general name for many oily or resinous substances which flow or trickle from certain trees or plants when an incision is made through the bark.<br><br>(1.) This word occurs in the Authorized Version (<a href=\"#\" onClick=\"return mV('Gen',37,25);\">Gen 37:25</a>; <a href=\"#\" onClick=\"return mV('Gen',43,11);\">43:11</a>; <a href=\"#\" onClick=\"return mV('Jer',8,22);\">Jer 8:22</a>; <a href=\"#\" onClick=\"return mV('Jer',46,11);\">46:11</a>; <a href=\"#\" onClick=\"return mV('Jer',51,8);\">51:8</a>; <a href=\"#\" onClick=\"return mV('Eze',27,17);\">Eze 27:17</a>) as the rendering of the Hebrew word <i>tsori</i> or <i>tseri</i>, which denotes the gum of a tree growing in Gilead (q.v.), which is very precious. It was celebrated for its medicinal qualities, and was circulated as an article of merchandise by Arab and Phoenician merchants. The shrub so named was highly valued, and was almost peculiar to Palestine. In the time of Josephus it was cultivated in the neighbourhood of Jericho and the Dead Sea. There is an Arab tradition that the tree yielding this balm was brought by the queen of Sheba as a present to Solomon, and that he planted it in his gardens at Jericho.<br><br>(2.) There is another Hebrew word, <i>basam</i> or <i>bosem</i>, from which our word \"balsam,\" as well as the corresponding Greek balsamon, is derived. It is rendered \"spice\" (<a href=\"#\" onClick=\"return mV('Sgs',5,1,13);\">Sgs 5:1, 13</a>; <a href=\"#\" onClick=\"return mV('Sgs',6,2);\">6:2</a>; margin of Revised Version, \"balsam; <a href=\"#\" onClick=\"return mV('Exd',35,28);\">Exd 35:28</a>; <a href=\"#\" onClick=\"return mV('1Ki',10,10);\">1Ki 10:10</a>), and denotes fragrance in general. <i>Basam</i> also denotes the true balsam-plant, a native of South Arabia (Cant. l.c.).";
eastonArray["$$T0000428"] = "<b>Bamah:</b> a height, a name used simply to denote a high place where the Jews worshipped idols (<a href=\"#\" onClick=\"return mV('Eze',20,29);\">Eze 20:29</a>). The plural is translated \"high places\" in <a href=\"#\" onClick=\"return mV('Num',22,41);\">Num 22:41</a> and <a href=\"#\" onClick=\"return mV('Eze',36,2);\">Eze 36:2</a>.";
eastonArray["$$T0000429"] = "<b>Bamoth:</b> heights, the forty-seventh station of the Israelites (<a href=\"#\" onClick=\"return mV('Num',21,'19-20');\">Num 21:19-20</a>) in the territory of the Moabites.";
eastonArray["$$T0000430"] = "<b>Bamoth-baal:</b> heights of Baal, a place on the river Arnon, or in the plains through which it flows, east of Jordan (<a href=\"#\" onClick=\"return mV('Jos',13,17);\">Jos 13:17</a>; <a href=\"#\" onClick=\"return mV('Num',21,28);\">Num 21:28</a>). It has been supposed to be the same place as Bamoth.";
eastonArray["$$T0000431"] = "<b>Bands:</b><br><br>(1.) of love (<a href=\"#\" onClick=\"return mV('Hsa',11,4);\">Hsa 11:4</a>);</b><br>(2.) of Christ (<a href=\"#\" onClick=\"return mV('Psa',2,3);\">Psa 2:3</a>);</b><br>(3.) uniting together Christ's body the church (<a href=\"#\" onClick=\"return mV('Col',2,19);\">Col 2:19</a>; <a href=\"#\" onClick=\"return mV('Col',3,14);\">3:14</a>; <a href=\"#\" onClick=\"return mV('Eph',4,3);\">Eph 4:3</a>);</b><br>(4.) the emblem of the captivity of Israel (<a href=\"#\" onClick=\"return mV('Eze',34,27);\">Eze 34:27</a>; <a href=\"#\" onClick=\"return mV('Isa',28,22);\">Isa 28:22</a>; <a href=\"#\" onClick=\"return mV('Isa',52,2);\">52:2</a>);</b><br>(5.) of brotherhood (<a href=\"#\" onClick=\"return mV('Eze',37,'15-28');\">Eze 37:15-28</a>);</b><br>(6.) no bands to the wicked in their death (<a href=\"#\" onClick=\"return mV('Psa',73,4);\">Psa 73:4</a>; <a href=\"#\" onClick=\"return mV('Job',21,7);\">Job 21:7</a>; <a href=\"#\" onClick=\"return mV('Psa',10,6);\">Psa 10:6</a>). Also denotes chains (<a href=\"#\" onClick=\"return mV('Luk',8,29);\">Luk 8:29</a>); companies of soldiers (<a href=\"#\" onClick=\"return mV('Act',21,31);\">Act 21:31</a>); a shepherd's staff, indicating the union between Judah and Israel (<a href=\"#\" onClick=\"return mV('Zec',11,7);\">Zec 11:7</a>).";
eastonArray["$$T0000432"] = "<b>Bani:</b> built.<br><br>(1.) <a href=\"#\" onClick=\"return mV('1Ch',6,46);\">1Ch 6:46</a>.</b><br>(2.) One of David's thirty-seven warriors, a Gadite (<a href=\"#\" onClick=\"return mV('2Sa',23,36);\">2Sa 23:36</a>).</b><br>(3.) <a href=\"#\" onClick=\"return mV('Ezr',2,10);\">Ezr 2:10</a>; <a href=\"#\" onClick=\"return mV('Ezr',10,29,34,38);\">10:29, 34, 38</a>.<br><br>(4.) A Levite who was prominent in the reforms on the return from Babylon (<a href=\"#\" onClick=\"return mV('Neh',8,7);\">Neh 8:7</a>; <a href=\"#\" onClick=\"return mV('Neh',9,4,5);\">9:4-5</a>). His son Rehum took part in rebuilding the wall of Jerusalem (<a href=\"#\" onClick=\"return mV('Neh',3,17);\">Neh 3:17</a>).";
eastonArray["$$T0000433"] = "<b>Banner:</b><br><br>(1.) The flag or banner of the larger kind, serving for three tribes marching together. These standards, of which there were four, were worked with embroidery and beautifully ornamented (<a href=\"#\" onClick=\"return mV('Num',1,52);\">Num 1:52</a>; <a href=\"#\" onClick=\"return mV('Num',2,2,3,10,18,25);\">2:2-3, 10,18,25</a>; <a href=\"#\" onClick=\"return mV('Sgs',2,4);\">Sgs 2:4</a>; <a href=\"#\" onClick=\"return mV('Sgs',6,4,10);\">6:4, 10</a>).<br><br>(2.) The flag borne by each separate tribe, of a smaller form. Probably it bore on it the name of the tribe to which it belonged, or some distinguishing device (<a href=\"#\" onClick=\"return mV('Num',2,2,34);\">Num 2:2, 34</a>).<br><br>(3.) A lofty signal-flag, not carried about, but stationary. It was usually erected on a mountain or other lofty place. As soon as it was seen the war-trumpets were blown (<a href=\"#\" onClick=\"return mV('Psa',60,4);\">Psa 60:4</a>; <a href=\"#\" onClick=\"return mV('Isa',5,26);\">Isa 5:26</a>; <a href=\"#\" onClick=\"return mV('Isa',11,12);\">11:12</a>; <a href=\"#\" onClick=\"return mV('Isa',13,2);\">13:2</a>; <a href=\"#\" onClick=\"return mV('Isa',18,3);\">18:3</a>; <a href=\"#\" onClick=\"return mV('Isa',30,17);\">30:17</a>; <a href=\"#\" onClick=\"return mV('Jer',4,6,21);\">Jer 4:6, 21</a>; <a href=\"#\" onClick=\"return mV('Eze',27,7);\">Eze 27:7</a>).<br><br>(4.) A \"sign of fire\" (<a href=\"#\" onClick=\"return mV('Jer',6,1);\">Jer 6:1</a>) was sometimes used as a signal.<br><br>The banners and ensigns of the Roman army had idolatrous images upon them, and hence they are called the \"abomination of desolation\" (q.v.). The principal Roman standard, however, was an eagle. (See <a href=\"#\" onClick=\"return mV('Mat',24,28);\">Mat 24:28</a>; <a href=\"#\" onClick=\"return mV('Luk',17,37);\">Luk 17:37</a>, where the Jewish nation is compared to a dead body, which the eagles gather together to devour.)<br><br>God's setting up or giving a banner (<a href=\"#\" onClick=\"return mV('Psa',20,5);\">Psa 20:5</a>; <a href=\"#\" onClick=\"return mV('Psa',60,4);\">60:4</a>; <a href=\"#\" onClick=\"return mV('Sgs',2,4);\">Sgs 2:4</a>) imports his presence and protection and aid extended to his people.";
eastonArray["$$T0000434"] = "<b>Banquet:</b> a feast provided for the entertainment of a company of guests (<a href=\"#\" onClick=\"return mV('Est',5,'1-')\">Est 5</a>; <a href=\"#\" onClick=\"return mV('Est',7,'1-')\">7</a>; <a href=\"#\" onClick=\"return mV('1Pe',4,3);\">1Pe 4:3</a>); such as was provided for our Lord by his friends in Bethany (<a href=\"#\" onClick=\"return mV('Mat',26,6);\">Mat 26:6</a>; <a href=\"#\" onClick=\"return mV('Mar',14,3);\">Mar 14:3</a>; <a href=\"#\" onClick=\"return mV('Jhn',12,2);\">Jhn 12:2</a>). These meals were in the days of Christ usually called \"suppers,\" after the custom of the Romans, and were partaken of toward the close of the day. It was usual to send a second invitation (<a href=\"#\" onClick=\"return mV('Mat',22,3);\">Mat 22:3</a>; <a href=\"#\" onClick=\"return mV('Luk',14,17);\">Luk 14:17</a>) to those who had been already invited. When the whole company was assembled, the master of the house shut the door with his own hands (<a href=\"#\" onClick=\"return mV('Luk',13,25);\">Luk 13:25</a>; <a href=\"#\" onClick=\"return mV('Mat',25,10);\">Mat 25:10</a>).<br><br>The guests were first refreshed with water and fragrant oil (<a href=\"#\" onClick=\"return mV('Luk',7,38);\">Luk 7:38</a>; <a href=\"#\" onClick=\"return mV('Mar',7,4);\">Mar 7:4</a>). A less frequent custom was that of supplying each guest with a robe to be worn during the feast (<a href=\"#\" onClick=\"return mV('Ecc',9,8);\">Ecc 9:8</a>; <a href=\"#\" onClick=\"return mV('Rev',3,4,5);\">Rev 3:4-5</a>; <a href=\"#\" onClick=\"return mV('Mat',22,11);\">Mat 22:11</a>). At private banquets the master of the house presided; but on public occasions a \"governor of the feast\" was chosen (<a href=\"#\" onClick=\"return mV('Jhn',2,8);\">Jhn 2:8</a>). The guests were placed in order according to seniority (<a href=\"#\" onClick=\"return mV('Gen',43,33);\">Gen 43:33</a>), or according to the rank they held (<a href=\"#\" onClick=\"return mV('Pro',25,6,7);\">Pro 25:6-7</a>; <a href=\"#\" onClick=\"return mV('Mat',23,6);\">Mat 23:6</a>; <a href=\"#\" onClick=\"return mV('Luk',14,7);\">Luk 14:7</a>).<br><br>As spoons and knives and forks are a modern invention, and were altogether unknown in the East, the hands alone were necessarily used, and were dipped in the dish, which was common to two of the guests (<a href=\"#\" onClick=\"return mV('Jhn',13,26);\">Jhn 13:26</a>). In the days of our Lord the guests reclined at table; but the ancient Israelites sat around low tables, cross-legged, like the modern Orientals. Guests were specially honoured when extra portions were set before them (<a href=\"#\" onClick=\"return mV('Gen',43,34);\">Gen 43:34</a>), and when their cup was filled with wine till it ran over (<a href=\"#\" onClick=\"return mV('Psa',23,5);\">Psa 23:5</a>). The hands of the guests were usually cleaned by being rubbed on bread, the crumbs of which fell to the ground, and were the portion for dogs (<a href=\"#\" onClick=\"return mV('Mat',15,27);\">Mat 15:27</a>; <a href=\"#\" onClick=\"return mV('Luk',16,21);\">Luk 16:21</a>).<br><br>At the time of the three annual festivals at Jerusalem family banquets were common. To these the \"widow, and the fatherless, and the stranger\" were welcome (<a href=\"#\" onClick=\"return mV('Deu',16,11);\">Deu 16:11</a>). Sacrifices also included a banquet (<a href=\"#\" onClick=\"return mV('Exd',34,15);\">Exd 34:15</a>; <a href=\"#\" onClick=\"return mV('Jdg',16,23);\">Jdg 16:23</a>). Birthday banquets are mentioned (<a href=\"#\" onClick=\"return mV('Gen',40,20);\">Gen 40:20</a>; <a href=\"#\" onClick=\"return mV('Mat',14,6);\">Mat 14:6</a>). They were sometimes protracted, and attended with revelry and excess (<a href=\"#\" onClick=\"return mV('Gen',21,8);\">Gen 21:8</a>; <a href=\"#\" onClick=\"return mV('Gen',29,22);\">29:22</a>; <a href=\"#\" onClick=\"return mV('1Sa',25,2,36);\">1Sa 25:2, 36</a>; <a href=\"#\" onClick=\"return mV('2Sa',13,23);\">2Sa 13:23</a>). Portions were sometimes sent from the table to poorer friends (<a href=\"#\" onClick=\"return mV('Neh',8,10);\">Neh 8:10</a>; <a href=\"#\" onClick=\"return mV('Est',9,19,22);\">Est 9:19, 22</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002451');\">MEALS</a>.)";
eastonArray["$$T0000435"] = "<b>Baptism, Christian:</b> an ordinance immediately instituted by Christ (<a href=\"#\" onClick=\"return mV('Mat',28,19,20);\">Mat 28:19-20</a>), and designed to be observed in the church, like that of the Supper, \"till he come.\" The words \"baptize\" and \"baptism\" are simply Greek words transferred into English. This was necessarily done by the translators of the Scriptures, for no literal translation could properly express all that is implied in them.<br><br>The mode of baptism can in no way be determined from the Greek word rendered \"baptize.\" Baptists say that it means \"to dip,\" and nothing else. That is an incorrect view of the meaning of the word. It means both<br><br>(1.) to dip a thing into an element or liquid, and<br><br>(2.) to put an element or liquid over or on it. Nothing therefore as to the mode of baptism can be concluded from the mere word used. The word has a wide latitude of meaning, not only in the New Testament, but also in the LXX. Version of the Old Testament, where it is used of the ablutions and baptisms required by the Mosaic law. These were effected by immersion, and by affusion and sprinkling; and the same word, \"washings\" (<a href=\"#\" onClick=\"return mV('Hbr',9,10,13,19,21);\">Hbr 9:10, 13, 19, 21</a>) or \"baptisms,\" designates them all. In the New Testament there cannot be found a single well-authenticated instance of the occurrence of the word where it necessarily means immersion. Moreover, none of the instances of baptism recorded in the Acts of the Apostles (<a href=\"#\" onClick=\"return mV('Act',2,'38-41');\">Act 2:38-41</a>; <a href=\"#\" onClick=\"return mV('Act',8,'26-39');\">8:26-39</a>; <a href=\"#\" onClick=\"return mV('Act',9,'17-18');\">9:17-18</a>; <a href=\"#\" onClick=\"return mV('Act',22,'12-16');\">22:12-16</a>; <a href=\"#\" onClick=\"return mV('Act',10,'44-48');\">10:44-48</a>; <a href=\"#\" onClick=\"return mV('Act',16,'32-34');\">16:32-34</a>) favours the idea that it was by dipping the person baptized, or by immersion, while in some of them such a mode was highly improbable.<br><br>The gospel and its ordinances are designed for the whole world, and it cannot be supposed that a form for the administration of baptism would have been prescribed which would in any place (as in a tropical country or in polar regions) or under any circumstances be inapplicable or injurious or impossible.<br><br>Baptism and the Lord's Supper are the two symbolical ordinances of the New Testament. The Supper represents the work of Christ, and Baptism the work of the Spirit. As in the Supper a small amount of bread and wine used in this ordinance exhibits in symbol the great work of Christ, so in Baptism the work of the Holy Spirit is fully seen in the water poured or sprinkled on the person in the name of the Father, Son, and Holy Ghost. That which is essential in baptism is only \"washing with water,\" no mode being specified and none being necessary or essential to the symbolism of the ordinance.<br><br>The apostles of our Lord were baptized with the Holy Ghost (<a href=\"#\" onClick=\"return mV('Mat',3,11);\">Mat 3:11</a>) by his coming upon them (<a href=\"#\" onClick=\"return mV('Act',1,8);\">Act 1:8</a>). The fire also with which they were baptized sat upon them. The extraordinary event of Pentecost was explained by Peter as a fulfilment of the ancient promise that the Spirit would be poured out in the last days (<a href=\"#\" onClick=\"return mV('Act',2,17);\">Act 2:17</a>). He uses also with the same reference the expression shed forth as descriptive of the baptism of the Spirit (<a href=\"#\" onClick=\"return mV('Act',2,33);\">Act 2:33</a>). In the Pentecostal baptism \"the apostles were not dipped into the Spirit, nor plunged into the Spirit; but the Spirit was shed forth, poured out, fell on them (<a href=\"#\" onClick=\"return mV('Act',11,15);\">11:15</a>), came upon them, sat on them.\" That was a real and true baptism. We are warranted from such language to conclude that in like manner when water is poured out, falls, comes upon or rests upon a person when this ordinance is administered, that person is baptized. Baptism is therefore, in view of all these arguments \"rightly administered by pouring or sprinkling water upon the person.\"<br><br>The subjects of baptism. This raises questions of greater importance than those relating to its mode.<br><br>1. The controversy here is not about \"believers' baptism,\" for that is common to all parties. Believers were baptized in apostolic times, and they have been baptized in all time by all the branches of the church. It is altogether a misrepresentation to allege, as is sometimes done by Baptists, that their doctrine is \"believers' baptism.\" Every instance of adult baptism, or of \"believers' baptism,\" recorded in the New Testament (<a href=\"#\" onClick=\"return mV('Act',2,41);\">Act 2:41</a>; <a href=\"#\" onClick=\"return mV('Act',8,37);\">8:37</a>; <a href=\"#\" onClick=\"return mV('Act',9,17,18);\">9:17-18</a>; <a href=\"#\" onClick=\"return mV('Act',10,47);\">10:47</a>; <a href=\"#\" onClick=\"return mV('Act',16,15);\">16:15</a>; <a href=\"#\" onClick=\"return mV('Act',19,5);\">19:5</a>, etc.) is just such as would be dealt with in precisely the same way by all branches of the Protestant Church, a profession of faith or of their being \"believers\" would be required from every one of them before baptism. The point in dispute is not the baptism of believers, but whether the infant children of believers, i.e., of members of the church, ought to be baptized.<br><br>2. In support of the doctrine of infant baptism, i.e., of the baptism of the infants, or rather the \"children,\" of believing parents, the following considerations may be adduced:<br><br>The Church of Christ exists as a divinely organized community. It is the \"kingdom of God,\" one historic kingdom under all dispensations. The commonwealth of Israel was the \"church\" (<a href=\"#\" onClick=\"return mV('Act',7,38);\">Act 7:38</a>; <a href=\"#\" onClick=\"return mV('Rom',9,4);\">Rom 9:4</a>) under the Mosaic dispensation. The New Testament church is not a new and different church, but one with that of the Old Testament. The terms of admission into the church have always been the same viz., a profession of faith and a promise of subjection to the laws of the kingdom. Now it is a fact beyond dispute that the children of God's people under the old dispensation were recognized as members of the church. Circumcision was the sign and seal of their membership. It was not because of carnal descent from Abraham, but as being the children of God's professing people, that this rite was administered (<a href=\"#\" onClick=\"return mV('Rom',4,11);\">Rom 4:11</a>). If children were members of the church under the old dispensation, which they undoubtedly were, then they are members of the church now by the same right, unless it can be shown that they have been expressly excluded. Under the Old Testament parents acted for their children and represented them. (See <a href=\"#\" onClick=\"return mV('Gen',9,9);\">Gen 9:9</a>; <a href=\"#\" onClick=\"return mV('Gen',17,10);\">17:10</a>; <a href=\"#\" onClick=\"return mV('Exd',24,7,8);\">Exd 24:7-8</a>; <a href=\"#\" onClick=\"return mV('Deu',29,'9-13');\">Deu 29:9-13</a>.) When parents entered into covenant with God, they brought their children with them. This was a law in the Hebrew Church. When a proselyte was received into membership, he could not enter without bringing his children with him. The New Testament does not exclude the children of believers from the church. It does not deprive them of any privilege they enjoyed under the Old Testament. There is no command or statement of any kind, that can be interpreted as giving any countenance to such an idea, anywhere to be found in the New Testament. The church membership of infants has never been set aside. The ancient practice, orginally appointed by God himself, must remain a law of his kingdom till repealed by the same divine authority. There are lambs in the fold of the Good Shepherd (<a href=\"#\" onClick=\"return mV('Jhn',21,15);\">Jhn 21:15</a>; <a href=\"#\" onClick=\"return mV('Luk',1,15);\">Luk 1:15</a>; <a href=\"#\" onClick=\"return mV('Mat',19,14);\">Mat 19:14</a>; <a href=\"#\" onClick=\"return mV('1Cr',7,14);\">1Cr 7:14</a>).<br><br>\"In a company of converts applying for admission into Christ's house there are likely to be some heads of families. How is their case to be treated? How, for example, are Lydia and her neighbour the keeper of the city prison to be treated? Both have been converted. Both are heads of families. They desire to be received into the infant church of Philippi. What is Christ's direction to them? Shall we say that it is to this effect: 'Arise, and wash away your sins, and come into my house. But you must come in by yourselves. These babes in your arms, you must leave them outside. They cannot believe yet, and so they cannot come in. Those other little ones by your side, their hearts may perhaps have been touched with the love of God; still, they are not old enough to make a personal profession, so they too must be left outside...For the present you must leave them where they are and come in by yourselves.' One may reasonably demand very stringent proofs before accepting this as a fair representation of the sort of welcome Christ offers to parents who come to his door bringing their children with them. Surely it is more consonant with all we know about him to suppose that his welcome will be more ample in its scope, and will breathe a more gracious tone. Surely it would be more like the Good Shepherd to say, 'Come in, and bring your little ones along with you. The youngest needs my salvation; and the youngest is accessible to my salvation. You may be unable as yet to deal with them about either sin or salvation, but my gracious power can find its way into their hearts even now. I can impart to them pardon and a new life. From Adam they have inherited sin and death; and I can so unite them to myself that in me they shall be heirs of righteousness and life. You may without misgiving bring them to me. And the law of my house requires that the same day which witnesses your reception into it by baptism must witness their reception also'\" (The Church, by Professor Binnie, D.D.).";
eastonArray["$$T0000436"] = "<b>Baptism for the dead:</b> only mentioned in <a href=\"#\" onClick=\"return mV('1Cr',15,29);\">1Cr 15:29</a>. This expression as used by the apostle may be equivalent to saying, \"He who goes through a baptism of blood in order to join a glorified church which has no existence [i.e., if the dead rise not] is a fool.\" Some also regard the statement here as an allusion to the strange practice which began, it is said, to prevail at Corinth, in which a person was baptized in the stead of others who had died before being baptized, to whom it was hoped some of the benefits of that rite would be extended. This they think may have been one of the erroneous customs which Paul went to Corinth to \"set in order.\"";
eastonArray["$$T0000437"] = "<b>Baptism, John's:</b> was not Christian baptism, nor was that which was practised by the disciples previous to our Lord's crucifixion. Till then the New Testament economy did not exist. John's baptism bound its subjects to repentance, and not to the faith of Christ. It was not administered in the name of the Trinity, and those whom John baptized were rebaptized by Paul (<a href=\"#\" onClick=\"return mV('Act',18,24);\">Act 18:24</a>; <a href=\"#\" onClick=\"return mV('Act',19,7);\">19:7</a>).";
eastonArray["$$T0000438"] = "<b>Baptism of Christ:</b> Christ had to be formally inaugurated into the public discharge of his offices. For this purpose he came to John, who was the representative of the law and the prophets, that by him he might be introduced into his offices, and thus be publicly recognized as the Messiah of whose coming the prophecies and types had for many ages borne witness.<br><br>John refused at first to confer his baptism on Christ, for he understood not what he had to do with the \"baptism of repentance.\" But Christ said, \"'Suffer it to be so now,' NOW as suited to my state of humiliation, my state as a substitute in the room of sinners.\" His reception of baptism was not necessary on his own account. It was a voluntary act, the same as his act of becoming incarnate. Yet if the work he had engaged to accomplish was to be completed, then it became him to take on him the likeness of a sinner, and to fulfil all righteousness (<a href=\"#\" onClick=\"return mV('Mat',3,15);\">Mat 3:15</a>).<br><br>The official duty of Christ and the sinless person of Christ are to be distinguished. It was in his official capacity that he submitted to baptism. In coming to John our Lord virtually said, \"Though sinless, and without any personal taint, yet in my public or official capacity as the Sent of God, I stand in the room of many, and bring with me the sin of the world, for which I am the propitiation.\" Christ was not made under the law on his own account. It was as surety of his people, a position which he spontaneously assumed. The administration of the rite of baptism was also a symbol of the baptism of suffering before him in this official capacity (<a href=\"#\" onClick=\"return mV('Luk',12,50);\">Luk 12:50</a>). In thus presenting himself he in effect dedicated or consecrated himself to the work of fulfilling all righteousness.";
eastonArray["$$T0000439"] = "<b>Bar:</b> used to denote the means by which a door is bolted (<a href=\"#\" onClick=\"return mV('Neh',3,3);\">Neh 3:3</a>); a rock in the sea (<a href=\"#\" onClick=\"return mV('Jon',2,6);\">Jon 2:6</a>); the shore of the sea (<a href=\"#\" onClick=\"return mV('Job',38,10);\">Job 38:10</a>); strong fortifications and powerful impediments, etc. (<a href=\"#\" onClick=\"return mV('Isa',45,2);\">Isa 45:2</a>; <a href=\"#\" onClick=\"return mV('Amo',1,5);\">Amo 1:5</a>); defences of a city (<a href=\"#\" onClick=\"return mV('1Ki',4,13);\">1Ki 4:13</a>). A bar for a door was of iron (<a href=\"#\" onClick=\"return mV('Isa',45,2);\">Isa 45:2</a>), brass (<a href=\"#\" onClick=\"return mV('Psa',107,16);\">Psa 107:16</a>), or wood (<a href=\"#\" onClick=\"return mV('Nah',3,13);\">Nah 3:13</a>).";
eastonArray["$$T0000440"] = "<b>Barabbas:</b> i.e., son of Abba or of a father, a notorious robber whom Pilate proposed to condemn to death instead of Jesus, whom he wished to release, in accordance with the Roman custom (<a href=\"#\" onClick=\"return mV('Jhn',18,40);\">Jhn 18:40</a>; <a href=\"#\" onClick=\"return mV('Mar',15,7);\">Mar 15:7</a>; <a href=\"#\" onClick=\"return mV('Luk',23,19);\">Luk 23:19</a>). But the Jews were so bent on the death of Jesus that they demanded that Barabbas should be pardoned (<a href=\"#\" onClick=\"return mV('Mat',27,'16-26');\">Mat 27:16-26</a>; <a href=\"#\" onClick=\"return mV('Act',3,14);\">Act 3:14</a>). This Pilate did.";
eastonArray["$$T0000441"] = "<b>Barachel:</b> whom God has blessed, a Buzite, the father of Elihu, one of Job's friends (<a href=\"#\" onClick=\"return mV('Job',32,2,6);\">Job 32:2, 6</a>).";
eastonArray["$$T0000442"] = "<b>Barachias, Berechiah:</b> 4 (q.v.), whom Jehovah hath blessed, father of the prophet Zechariah (<a href=\"#\" onClick=\"return mV('Zec',1,1,7);\">Zec 1:1, 7</a>; <a href=\"#\" onClick=\"return mV('Mat',23,35);\">Mat 23:35</a>).";
eastonArray["$$T0000443"] = "<b>Barak:</b> lightning, the son of Abinoam (<a href=\"#\" onClick=\"return mV('Jdg',4,6);\">Jdg 4:6</a>). At the summons of Deborah he made war against Jabin. She accompanied him into the battle, and gave the signal for the little army to make the attack; in which the host of Jabin was completely routed. The battle was fought (<a href=\"#\" onClick=\"return mV('Jdg',4,16);\">Jdg 4:16</a>) in the plain of Jezreel (q.v.). This deliverance of Israel is commemorated in <a href=\"#\" onClick=\"return mV('Jdg',5,'1-');\">Jdg 5</a>. Barak's faith is commended (<a href=\"#\" onClick=\"return mV('Hbr',11,32);\">Hbr 11:32</a>). \"The character of Barak, though pious, does not seem to have been heroic. Like Gideon, and in a sense Samson, he is an illustration of the words in <a href=\"#\" onClick=\"return mV('Hbr',11,34);\">Hbr 11:34</a>, 'Out of weakness were made strong.'\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0000996');\">DEBORAH</a>.)";
eastonArray["$$T0000444"] = "<b>Barbarian:</b> a Greek word used in the New Testament (<a href=\"#\" onClick=\"return mV('Rom',1,14);\">Rom 1:14</a>) to denote one of another nation. In <a href=\"#\" onClick=\"return mV('Col',3,11);\">Col 3:11</a>, the word more definitely designates those nations of the Roman empire that did not speak Greek. In <a href=\"#\" onClick=\"return mV('1Cr',14,11);\">1Cr 14:11</a>, it simply refers to one speaking a different language. The inhabitants of Malta are so called (<a href=\"#\" onClick=\"return mV('Act',28,1,2,4);\">Act 28:1-2, 4</a>). They were originally a Carthaginian colony. This word nowhere in Scripture bears the meaning it does in modern times.";
eastonArray["$$T0000445"] = "<b>Barber:</b> Found only once, in <a href=\"#\" onClick=\"return mV('Eze',5,1);\">Eze 5:1</a>, where reference is made to the Jewish custom of shaving the head as a sign of mourning. The Nazarites were untouched by the razor from their birth (<a href=\"#\" onClick=\"return mV('Num',6,5);\">Num 6:5</a>). Comp. <a href=\"#\" onClick=\"return mV('Jdg',16,19);\">Jdg 16:19</a>.";
eastonArray["$$T0000446"] = "<b>Barefoot:</b> To go barefoot was a sign of great distress (<a href=\"#\" onClick=\"return mV('Isa',20,'2-4');\">Isa 20:2-4</a>), or of some great calamity having fallen on a person (<a href=\"#\" onClick=\"return mV('2Sa',15,30);\">2Sa 15:30</a>).";
eastonArray["$$T0000447"] = "<b>Bariah:</b> fugitive, one of Shemaiah's five sons. Their father is counted along with them in <a href=\"#\" onClick=\"return mV('1Ch',3,22);\">1Ch 3:22</a>.";
eastonArray["$$T0000448"] = "<b>Bar-jesus:</b> son of Joshua, the patronymic of Elymas the sorcerer (<a href=\"#\" onClick=\"return mV('Act',13,6);\">Act 13:6</a>), who met Paul and Barnabas at Paphos. Elymas is a word of Arabic origin meaning \"wise.\"";
eastonArray["$$T0000449"] = "<b>Bar-jona:</b> son of Jonah, the patronymic of Peter (<a href=\"#\" onClick=\"return mV('Mat',16,17);\">Mat 16:17</a>; <a href=\"#\" onClick=\"return mV('Jhn',1,42);\">Jhn 1:42</a>), because his father's name was Jonas. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002911');\">PETER</a>.)";
</script>
