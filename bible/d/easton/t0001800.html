<script>
var eastonArray = new Array ();
eastonArray["$$T0001800"] = "<strong>Hodijah:</strong> majesty of Jehovah.<b /><b />(1.) One of the Levites who assisted Ezra in expounding the law (<a href=\"#\" onClick=\"return mV('Neh',8,7);\">Neh 8:7</a>; <a href=\"#\" onClick=\"return mV('Neh',9,5);\">9:5</a>).<b /><b />(2.) <a href=\"#\" onClick=\"return mV('Neh',10,18);\">Neh 10:18</a>, a Levite who sealed the covenant.";
eastonArray["$$T0001801"] = "<strong>Hoglah:</strong> partridge, one of the daughters of Zelophehad the Gileadite, to whom portions were assigned by Moses (<a href=\"#\" onClick=\"return mV('Num',26,33);\">Num 26:33</a>; <a href=\"#\" onClick=\"return mV('Num',27,1);\">27:1</a>; <a href=\"#\" onClick=\"return mV('Num',36,11);\">36:11</a>).";
eastonArray["$$T0001802"] = "<strong>Hoham:</strong> Jehovah impels, the king of Hebron who joined the league against Gibeon. He and his allies were defeated (<a href=\"#\" onClick=\"return mV('Jos',10,3,5,'16-27');\">Jos 10:3, 5, 16-27</a>).";
eastonArray["$$T0001803"] = "<strong>Hold:</strong> a fortress, the name given to David's lurking-places (<a href=\"#\" onClick=\"return mV('1Sa',22,4,5);\">1Sa 22:4-5</a>; <a href=\"#\" onClick=\"return mV('1Sa',24,22);\">24:22</a>).";
eastonArray["$$T0001804"] = "<strong>Holiness:</strong> in the highest sense belongs to God (<a href=\"#\" onClick=\"return mV('Isa',6,3);\">Isa 6:3</a>; <a href=\"#\" onClick=\"return mV('Rev',15,4);\">Rev 15:4</a>), and to Christians as consecrated to God's service, and in so far as they are conformed in all things to the will of God (<a href=\"#\" onClick=\"return mV('Rom',6,19,22);\">Rom 6:19, 22</a>; <a href=\"#\" onClick=\"return mV('Eph',1,4);\">Eph 1:4</a>; <a href=\"#\" onClick=\"return mV('Tts',1,8);\">Tts 1:8</a>; <a href=\"#\" onClick=\"return mV('1Pe',1,15);\">1Pe 1:15</a>). Personal holiness is a work of gradual development. It is carried on under many hindrances, hence the frequent admonitions to watchfulness, prayer, and perseverance (<a href=\"#\" onClick=\"return mV('1Cr',1,30);\">1Cr 1:30</a>; <a href=\"#\" onClick=\"return mV('2Cr',7,1);\">2Cr 7:1</a>; <a href=\"#\" onClick=\"return mV('Eph',4,23,24);\">Eph 4:23-24</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0003212');\">SANCTIFICATION</a>.)";
eastonArray["$$T0001805"] = "<strong>Holy Ghost:</strong> the third Person of the adorable Trinity.<br><br>His personality is proved<br><br>(1) from the fact that the attributes of personality, as intelligence and volition, are ascribed to him (<a href=\"#\" onClick=\"return mV('Jhn',14,17,26);\">Jhn 14:17, 26</a>; <a href=\"#\" onClick=\"return mV('Jhn',15,26);\">15:26</a>; <a href=\"#\" onClick=\"return mV('1Cr',2,10,11);\">1Cr 2:10-11</a>; <a href=\"#\" onClick=\"return mV('1Cr',12,11);\">12:11</a>). He reproves, helps, glorifies, intercedes (<a href=\"#\" onClick=\"return mV('Jhn',16,'7-13');\">Jhn 16:7-13</a>; <a href=\"#\" onClick=\"return mV('Rom',8,26);\">Rom 8:26</a>).<br><br>(2) He executes the offices peculiar only to a person. The very nature of these offices involves personal distinction (<a href=\"#\" onClick=\"return mV('Luk',12,12);\">Luk 12:12</a>; <a href=\"#\" onClick=\"return mV('Act',5,32);\">Act 5:32</a>; <a href=\"#\" onClick=\"return mV('Act',15,28);\">15:28</a>; <a href=\"#\" onClick=\"return mV('Act',16,6);\">16:6</a>; <a href=\"#\" onClick=\"return mV('Act',28,25);\">28:25</a>; <a href=\"#\" onClick=\"return mV('1Cr',2,13);\">1Cr 2:13</a>; <a href=\"#\" onClick=\"return mV('Hbr',2,4);\">Hbr 2:4</a>; <a href=\"#\" onClick=\"return mV('Hbr',3,7);\">3:7</a>; <a href=\"#\" onClick=\"return mV('2Pe',1,21);\">2Pe 1:21</a>).<br><br>His divinity is established<br><br>(1) from the fact that the names of God are ascribed to him (<a href=\"#\" onClick=\"return mV('Exd',17,7);\">Exd 17:7</a>; <a href=\"#\" onClick=\"return mV('Psa',95,7);\">Psa 95:7</a>; <a href=\"#\" onClick=\"return mV('Hbr',3,'7-11');\">Hbr 3:7-11</a>); and<br><br>(2) that divine attributes are also ascribed to him, omnipresence (<a href=\"#\" onClick=\"return mV('Psa',139,7);\">Psa 139:7</a>; <a href=\"#\" onClick=\"return mV('Eph',2,17,18);\">Eph 2:17-18</a>; <a href=\"#\" onClick=\"return mV('1Cr',12,13);\">1Cr 12:13</a>); omniscience (<a href=\"#\" onClick=\"return mV('1Cr',2,10,11);\">1Cr 2:10-11</a>); omnipotence (<a href=\"#\" onClick=\"return mV('Luk',1,35);\">Luk 1:35</a>; <a href=\"#\" onClick=\"return mV('Rom',8,11);\">Rom 8:11</a>); eternity (<a href=\"#\" onClick=\"return mV('Hbr',9,4);\">Hbr 9:4</a>).<br><br>(3) Creation is ascribed to him (<a href=\"#\" onClick=\"return mV('Gen',1,2);\">Gen 1:2</a>; <a href=\"#\" onClick=\"return mV('Job',26,13);\">Job 26:13</a>; <a href=\"#\" onClick=\"return mV('Psa',104,30);\">Psa 104:30</a>), and the working of miracles (<a href=\"#\" onClick=\"return mV('Mat',12,28);\">Mat 12:28</a>; <a href=\"#\" onClick=\"return mV('1Cr',12,'9-11');\">1Cr 12:9-11</a>>).<br><br>(4) Worship is required and ascribed to him (<a href=\"#\" onClick=\"return mV('Isa',6,3);\">Isa 6:3</a>; <a href=\"#\" onClick=\"return mV('Act',28,25);\">Act 28:25</a>; <a href=\"#\" onClick=\"return mV('Rom',9,1);\">Rom 9:1</a>; <a href=\"#\" onClick=\"return mV('Rev',1,4);\">Rev 1:4</a>; <a href=\"#\" onClick=\"return mV('Mat',28,19);\">Mat 28:19</a>).";
eastonArray["$$T0001806"] = "<strong>Holy of holies:</strong> the second or interior portion of the tabernacle. It was left in total darkness. No one was permitted to enter it except the high priest, and that only once a year. It contained the ark of the covenant only (<a href=\"#\" onClick=\"return mV('Exd',25,'10-16');\">Exd 25:10-16</a>). It was in the form of a perfect cube of 20 cubits. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003559');\">TABERNACLE</a>.)";
eastonArray["$$T0001807"] = "<strong>Holy place:</strong> one of the two portions into which the tabernacle was divided (<a href=\"#\" onClick=\"return mV('Exd',26,31);\">Exd 26:31</a>; <a href=\"#\" onClick=\"return mV('Exd',37,'17-25');\">37:17-25</a>; <a href=\"#\" onClick=\"return mV('Hbr',9,2);\">Hbr 9:2</a>). It was 20 cubits long and 10 in height and breadth. It was illuminated by the golden candlestick, as it had no opening to admit the light. It contained the table of showbread (<a href=\"#\" onClick=\"return mV('Exd',25,'23-29');\">Exd 25:23-29</a>) and the golden altar of incense (<a href=\"#\" onClick=\"return mV('Exd',30,'1-11');\">30:1-11</a>). It was divided from the holy of holies by a veil of the most costly materials and the brightest colours.<br><br>The arrangement of the temple (q.v.) was the same in this respect. In it the walls of hewn stone were wainscotted with cedar and overlaid with gold, and adorned with beautiful carvings. It was entered from the porch by folding doors overlaid with gold and richly embossed. Outside the holy place stood the great tank or \"sea\" of molten brass, supported by twelve oxen, three turned each way, capable of containing two thousand baths of water. Besides this there were ten lavers and the brazen altar of burnt sacrifice.";
eastonArray["$$T0001808"] = "<strong>Homer:</strong> heap, the largest of dry measures, containing about 8 bushels or 1 quarter English = 10 ephahs (<a href=\"#\" onClick=\"return mV('Lev',27,16);\">Lev 27:16</a>; <a href=\"#\" onClick=\"return mV('Num',11,32);\">Num 11:32</a>) = a COR. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002784');\">OMER</a>.)<br><br>\"Half a homer,\" a grain measure mentioned only in <a href=\"#\" onClick=\"return mV('Hsa',3,2);\">Hsa 3:2</a>.";
eastonArray["$$T0001809"] = "<strong>Honey:</strong><br><br>(1.) Heb. ya'ar, occurs only <a href=\"#\" onClick=\"return mV('1Sa',14,25,27,29);\">1Sa 14:25, 27, 29</a>; <a href=\"#\" onClick=\"return mV('Sgs',5,1);\">Sgs 5:1</a>, where it denotes the honey of bees. Properly the word signifies a forest or copse, and refers to honey found in woods.<br><br>(2.) Nopheth, honey that drops (<a href=\"#\" onClick=\"return mV('Psa',19,10);\">Psa 19:10</a>; <a href=\"#\" onClick=\"return mV('Pro',5,3);\">Pro 5:3</a>; <a href=\"#\" onClick=\"return mV('Sgs',4,11);\">Sgs 4:11</a>).<br><br>(3.) Debash denotes bee-honey (<a href=\"#\" onClick=\"return mV('Jdg',14,8);\">Jdg 14:8</a>); but also frequently a vegetable honey distilled from trees (<a href=\"#\" onClick=\"return mV('Gen',43,11);\">Gen 43:11</a>; <a href=\"#\" onClick=\"return mV('Eze',27,17);\">Eze 27:17</a>). In these passages it may probably mean \"dibs,\" or syrup of grapes, i.e., the juice of ripe grapes boiled down to one-third of its bulk.<br><br>(4.) Tsuph, the cells of the honey-comb full of honey (<a href=\"#\" onClick=\"return mV('Pro',16,24);\">Pro 16:24</a>; <a href=\"#\" onClick=\"return mV('Psa',19,10);\">Psa 19:10</a>).<br><br>(5.) \"Wild honey\" (<a href=\"#\" onClick=\"return mV('Mat',3,4);\">Mat 3:4</a>) may have been the vegetable honey distilled from trees, but rather was honey stored by bees in rocks or in trees (<a href=\"#\" onClick=\"return mV('Deu',32,13);\">Deu 32:13</a>; <a href=\"#\" onClick=\"return mV('Psa',81,16);\">Psa 81:16</a>; <a href=\"#\" onClick=\"return mV('1Sa',14,'25-29');\">1Sa 14:25-29</a>).<br><br>Canaan was a \"land flowing with milk and honey\" (<a href=\"#\" onClick=\"return mV('Exd',3,8);\">Exd 3:8</a>). Milk and honey were among the chief dainties in the earlier ages, as they are now among the Bedawin; and butter and honey are also mentioned among articles of food (<a href=\"#\" onClick=\"return mV('Isa',7,15);\">Isa 7:15</a>). The ancients used honey instead of sugar (<a href=\"#\" onClick=\"return mV('Psa',119,103);\">Psa 119:103</a>; <a href=\"#\" onClick=\"return mV('Pro',24,13);\">Pro 24:13</a>); but when taken in great quantities it caused nausea, a fact referred to in <a href=\"#\" onClick=\"return mV('Pro',25,16,17);\">Pro 25:16-17</a> to inculcate moderation in pleasures. Honey and milk also are put for sweet discourse (<a href=\"#\" onClick=\"return mV('Sgs',4,11);\">Sgs 4:11</a>).";
eastonArray["$$T0001810"] = "<strong>Hood:</strong> (Heb. tsaniph) a tiara round the head (<a href=\"#\" onClick=\"return mV('Isa',3,23);\">Isa 3:23</a>; R.V., pl., \"turbans\"). Rendered \"diadem,\" <a href=\"#\" onClick=\"return mV('Job',29,14);\">Job 29:14</a>; high priest's \"mitre,\" <a href=\"#\" onClick=\"return mV('Zec',3,5);\">Zec 3:5</a>; \"royal diadem,\" <a href=\"#\" onClick=\"return mV('Isa',62,3);\">Isa 62:3</a>.";
eastonArray["$$T0001811"] = "<strong>Hoof:</strong> a cleft hoof as of neat cattle (<a href=\"#\" onClick=\"return mV('Exd',10,26);\">Exd 10:26</a>; <a href=\"#\" onClick=\"return mV('Eze',32,13);\">Eze 32:13</a>); hence also of the horse, though not cloven (<a href=\"#\" onClick=\"return mV('Isa',5,28);\">Isa 5:28</a>). The \"parting of the hoof\" is one of the distinctions between clean and unclean animals (<a href=\"#\" onClick=\"return mV('Lev',11,3);\">Lev 11:3</a>; <a href=\"#\" onClick=\"return mV('Deu',14,7);\">Deu 14:7</a>).";
eastonArray["$$T0001812"] = "<strong>Hook:</strong><br><br>(1.) Heb. hah, a \"ring\" inserted in the nostrils of animals to which a cord was fastened for the purpose of restraining them (<a href=\"#\" onClick=\"return mV('2Ki',19,28);\">2Ki 19:28</a>; <a href=\"#\" onClick=\"return mV('Isa',37,28,29);\">Isa 37:28-29</a>; <a href=\"#\" onClick=\"return mV('Eze',29,4);\">Eze 29:4</a>; <a href=\"#\" onClick=\"return mV('Eze',38,4);\">38:4</a>). \"The Orientals make use of this contrivance for curbing their work-beasts...When a beast becomes unruly they have only to draw the cord on one side, which, by stopping his breath, punishes him so effectually that after a few repetitions he fails not to become quite tractable whenever he begins to feel it\" (Michaelis). So God's agents are never beyond his control.<br><br>(2.) Hakkah, a fish \"hook\" (<a href=\"#\" onClick=\"return mV('Job',41,2);\">Job 41:2</a>, Heb. Text, <a href=\"#\" onClick=\"return mV('Job',40,25);\">40:25</a>; <a href=\"#\" onClick=\"return mV('Isa',19,8);\">Isa 19:8</a>; <a href=\"#\" onClick=\"return mV('Hab',1,15);\">Hab 1:15</a>).<br><br>(3.) Vav, a \"peg\" on which the curtains of the tabernacle were hung (<a href=\"#\" onClick=\"return mV('Exd',26,32);\">Exd 26:32</a>).<br><br>(4.) Tsinnah, a fish-hooks (<a href=\"#\" onClick=\"return mV('Amo',4,2);\">Amo 4:2</a>).<br><br>(5.) Mazleg, flesh-hooks (<a href=\"#\" onClick=\"return mV('1Sa',2,13,14);\">1Sa 2:13-14</a>), a kind of fork with three teeth for turning the sacrifices on the fire, etc.<br><br>(6.) Mazmeroth, pruning-hooks (<a href=\"#\" onClick=\"return mV('Isa',2,4);\">Isa 2:4</a>; <a href=\"#\" onClick=\"return mV('Joe',3,10);\">Joe 3:10</a>).<br><br>(7.) 'Agmon (<a href=\"#\" onClick=\"return mV('Job',41,2);\">Job 41:2</a>, Heb. Text <a href=\"#\" onClick=\"return mV('Job',40,26);\">40:26</a>), incorrectly rendered in the Authorized Version. Properly a rush-rope for binding animals, as in Revised Version margin.";
eastonArray["$$T0001813"] = "<strong>Hope:</strong> one of the three main elements of Christian character (<a href=\"#\" onClick=\"return mV('1Cr',13,13);\">1Cr 13:13</a>). It is joined to faith and love, and is opposed to seeing or possessing (<a href=\"#\" onClick=\"return mV('Rom',8,24);\">Rom 8:24</a>; <a href=\"#\" onClick=\"return mV('1Jo',3,2);\">1Jo 3:2</a>). \"Hope is an essential and fundamental element of Christian life, so essential indeed, that, like faith and love, it can itself designate the essence of Christianity (<a href=\"#\" onClick=\"return mV('1Pe',3,15);\">1Pe 3:15</a>; <a href=\"#\" onClick=\"return mV('Hbr',10,23);\">Hbr 10:23</a>). In it the whole glory of the Christian vocation is centred (<a href=\"#\" onClick=\"return mV('Eph',1,18);\">Eph 1:18</a>; <a href=\"#\" onClick=\"return mV('Eph',4,4);\">4:4</a>).\" Unbelievers are without this hope (<a href=\"#\" onClick=\"return mV('Eph',2,12);\">Eph 2:12</a>; <a href=\"#\" onClick=\"return mV('1Th',4,13);\">1Th 4:13</a>). Christ is the actual object of the believer's hope, because it is in his second coming that the hope of glory will be fulfilled (<a href=\"#\" onClick=\"return mV('1Ti',1,1);\">1Ti 1:1</a>; <a href=\"#\" onClick=\"return mV('Col',1,27);\">Col 1:27</a>; <a href=\"#\" onClick=\"return mV('Tts',2,13);\">Tts 2:13</a>). It is spoken of as \"lively\", i.e., a living, hope, a hope not frail and perishable, but having a perennial life (<a href=\"#\" onClick=\"return mV('1Pe',1,3);\">1Pe 1:3</a>). In (<a href=\"#\" onClick=\"return mV('Rom',5,2);\">Rom 5:2</a>) the \"hope\" spoken of is probably objective, i.e., \"the hope set before us,\" namely, eternal life (<a href=\"#\" onClick=\"return mV('Rom',12,12);\">Rom 12:12</a>). In (<a href=\"#\" onClick=\"return mV('1Jo',3,3);\">1Jo 3:3</a>) the expression \"hope in him\" ought rather to be, as in the Revised Version, \"hope on him,\" i.e., a hope based on God.";
eastonArray["$$T0001814"] = "<strong>Hophni:</strong> pugilist or client, one of the two sons of Eli, the high priest (<a href=\"#\" onClick=\"return mV('1Sa',1,3);\">1Sa 1:3</a>; <a href=\"#\" onClick=\"return mV('1Sa',2,34);\">2:34</a>), who, because he was \"very old,\" resigned to them the active duties of his office. By their scandalous conduct they brought down a curse on their father's house (<a href=\"#\" onClick=\"return mV('1Sa',2,22);\">2:22</a>;, <a href=\"#\" onClick=\"return mV('1Sa',2,'12-36');\">12-36</a>; <a href=\"#\" onClick=\"return mV('1Sa',3,'11-14');\">3:11-14</a>). For their wickedness they were called \"sons of Belial,\" i.e., worthless men (<a href=\"#\" onClick=\"return mV('1Sa',2,12);\">2:12</a>). They both perished in the disastrous battle with the Philistines at Aphek (<a href=\"#\" onClick=\"return mV('1Sa',4,11);\">4:11</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002941');\">PHINEHAS</a>.)";
eastonArray["$$T0001815"] = "<strong>Hophra:</strong> i.e., PHARAOH-HOPHRA (called Apries by the Greek historian Herodotus) king of Egypt (B.C. 591-572) in the time of Zedekiah, king of Judah (<a href=\"#\" onClick=\"return mV('Jer',37,5);\">Jer 37:5</a>; <a href=\"#\" onClick=\"return mV('Jer',44,30);\">44:30</a>; <a href=\"#\" onClick=\"return mV('Eze',29,6,7);\">Eze 29:6-7</a>).";
eastonArray["$$T0001816"] = "<strong>Hor:</strong> mountain.<br><br>(1.) One of the mountains of the chain of Seir or Edom, on the confines of Idumea (<a href=\"#\" onClick=\"return mV('Num',20,'22-29');\">Num 20:22-29</a>; <a href=\"#\" onClick=\"return mV('Num',33,37);\">33:37</a>). It was one of the stations of the Israelites in the wilderness (<a href=\"#\" onClick=\"return mV('Num',33,37);\">33:37</a>), which they reached in the circuitous route they were obliged to take because the Edomites refused them a passage through their territory. It was during the encampment here that Aaron died (<a href=\"#\" onClick=\"return mV('Num',33,'37-41');\">Num 33:37-41</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000002');\">AARON</a>.) The Israelites passed this mountain several times in their wanderings. It bears the modern name of Jebel Harun, and is the highest and most conspicious of the whole range. It stands about midway between the Dead Sea and the Elanitic gulf. It has two summits, in the hallow between which it is supposed that Aaron died. Others, however, suppose that this mountain is the modern Jebel Madurah, on the opposite, i.e., the western, side of the Arabah.<br><br>(2.) One of the marks of the northern boundary of Palestine (<a href=\"#\" onClick=\"return mV('Num',34,7,8);\">Num 34:7-8</a>). Nowhere else mentioned. Perhaps it is one of the peaks of Lebanon.";
eastonArray["$$T0001817"] = "<strong>Horeb:</strong> desert or mountain of the dried-up ground, a general name for the whole mountain range of which Sinai was one of the summits (<a href=\"#\" onClick=\"return mV('Exd',3,1);\">Exd 3:1</a>; <a href=\"#\" onClick=\"return mV('Exd',17,6);\">17:6</a>; <a href=\"#\" onClick=\"return mV('Exd',33,6);\">33:6</a>; <a href=\"#\" onClick=\"return mV('Psa',106,19);\">Psa 106:19</a>, etc.). The modern name of the whole range is Jebel Musa. It is a huge mountain block, about 2 miles long by about 1 in breadth, with a very spacious plain at its north-east end, called the Er Rahah, in which the Israelites encamped for nearly a whole year. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003442');\">SINAI</a>.)";
eastonArray["$$T0001818"] = "<strong>Horem:</strong> consecrated, one of the fenced cities of Naphtali (<a href=\"#\" onClick=\"return mV('Jos',19,38);\">Jos 19:38</a>).";
eastonArray["$$T0001819"] = "<strong>Horites:</strong> cave-men, a race of Troglodytes who dwelt in the limestone caves which abounded in Edom. Their ancestor was \"Seir,\" who probably gave his name to the district where he lived. They were a branch of the Hivites (<a href=\"#\" onClick=\"return mV('Gen',14,6);\">Gen 14:6</a>; <a href=\"#\" onClick=\"return mV('Gen',36,'20-30');\">36:20-30</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,38,39);\">1Ch 1:38-39</a>). They were dispossessed by the descendants of Esau, and as a people gradually became extinct (<a href=\"#\" onClick=\"return mV('Deu',2,'12-22');\">Deu 2:12-22</a>).";
eastonArray["$$T0001820"] = "<strong>Hormah:</strong> banning; i.e., placing under a \"ban,\" or devoting to utter destruction. After the manifestation of God's anger against the Israelites, on account of their rebellion and their murmurings when the spies returned to the camp at Kadesh, in the wilderness of Paran, with an evil report of the land, they quickly repented of their conduct, and presumed to go up \"to the head of the mountain,\" seeking to enter the Promised Land, but without the presence of the Lord, without the ark of the convenant, and without Moses. The Amalekites and the Canaanites came down and \"smote and discomfited them even unto Hormah\" (<a href=\"#\" onClick=\"return mV('Num',14,45);\">Num 14:45</a>). This place, or perhaps the watch-tower commanding it, was originally called Zephath (<a href=\"#\" onClick=\"return mV('Jdg',1,17);\">Jdg 1:17</a>), the modern Sebaiteh. Afterwards (<a href=\"#\" onClick=\"return mV('Num',21,'1-3');\">Num 21:1-3</a>) Arad, the king of the Canaanites, at the close of the wanderings, when the Israelites were a second time encamped at Kadesh, \"fought against them, and took some of them prisoners.\" But Israel vowed a vow unto the Lord utterly to destroy the cities of the Canaanites; they \"banned\" them, and hence the place was now called Hormah. But this \"ban\" was not fully executed till the time of Joshua, who finally conquered the king of this district, so that the ancient name Zephath became \"Hormah\" (<a href=\"#\" onClick=\"return mV('Jos',12,14);\">Jos 12:14</a>; <a href=\"#\" onClick=\"return mV('Jdg',1,17);\">Jdg 1:17</a>).";
eastonArray["$$T0001821"] = "<strong>Horn:</strong> Trumpets were at first horns perforated at the tip, used for various purposes (<a href=\"#\" onClick=\"return mV('Jos',6,4,5);\">Jos 6:4-5</a>).<br><br>Flasks or vessels were made of horn (<a href=\"#\" onClick=\"return mV('1Sa',16,1,13);\">1Sa 16:1, 13</a>; <a href=\"#\" onClick=\"return mV('1Ki',1,39);\">1Ki 1:39</a>).<br><br>But the word is used also metaphorically to denote the projecting corners of the altar of burnt offerings (<a href=\"#\" onClick=\"return mV('Exd',27,2);\">Exd 27:2</a>) and of incense (<a href=\"#\" onClick=\"return mV('Exd',30,2);\">30:2</a>). The horns of the altar of burnt offerings were to be smeared with the blood of the slain bullock (<a href=\"#\" onClick=\"return mV('Exd',29,12);\">29:12</a>; <a href=\"#\" onClick=\"return mV('Lev',4,'7-18');\">Lev 4:7-18</a>). The criminal, when his crime was accidental, found an asylum by laying hold of the horns of the altar (<a href=\"#\" onClick=\"return mV('1Ki',1,50);\">1Ki 1:50</a>; <a href=\"#\" onClick=\"return mV('1Ki',2,28);\">2:28</a>).<br><br>The word also denotes the peak or summit of a hill (<a href=\"#\" onClick=\"return mV('Isa',5,1);\">Isa 5:1</a>, where the word \"hill\" is the rendering of the same Hebrew word).<br><br>This word is used metaphorically also for strength (<a href=\"#\" onClick=\"return mV('Deu',33,17);\">Deu 33:17</a>) and honour (<a href=\"#\" onClick=\"return mV('Job',16,15);\">Job 16:15</a>; <a href=\"#\" onClick=\"return mV('Lam',2,3);\">Lam 2:3</a>). Horns are emblems of power, dominion, glory, and fierceness, as they are the chief means of attack and defence with the animals endowed with them (<a href=\"#\" onClick=\"return mV('Dan',8,5,9);\">Dan 8:5, 9</a>; <a href=\"#\" onClick=\"return mV('1Sa',2,1);\">1Sa 2:1</a>; <a href=\"#\" onClick=\"return mV('1Sa',16,1,13);\">16:1, 13</a>; <a href=\"#\" onClick=\"return mV('1Ki',1,39);\">1Ki 1:39</a>; <a href=\"#\" onClick=\"return mV('1Ki',22,11);\">22:11</a>; <a href=\"#\" onClick=\"return mV('Jos',6,4,5);\">Jos 6:4-5</a>; <a href=\"#\" onClick=\"return mV('Psa',75,5,10);\">Psa 75:5, 10</a>; <a href=\"#\" onClick=\"return mV('Psa',132,17);\">132:17</a>; <a href=\"#\" onClick=\"return mV('Luk',1,69);\">Luk 1:69</a>, etc.). The expression \"horn of salvation,\" applied to Christ, means a salvation of strength, or a strong Saviour (<a href=\"#\" onClick=\"return mV('Luk',1,69);\">Luk 1:69</a>). To have the horn \"exalted\" denotes prosperity and triumph (<a href=\"#\" onClick=\"return mV('Psa',89,17,24);\">Psa 89:17, 24</a>). To \"lift up\" the horn is to act proudly (<a href=\"#\" onClick=\"return mV('Zec',1,21);\">Zec 1:21</a>).<br><br>Horns are also the symbol of royal dignity and power (<a href=\"#\" onClick=\"return mV('Jer',48,25);\">Jer 48:25</a>; <a href=\"#\" onClick=\"return mV('Zec',1,18);\">Zec 1:18</a>; <a href=\"#\" onClick=\"return mV('Dan',8,24);\">Dan 8:24</a>).";
eastonArray["$$T0001822"] = "<strong>Hornet:</strong> Heb. tsir'ah, \"stinging\", (<a href=\"#\" onClick=\"return mV('Exd',23,28);\">Exd 23:28</a>; <a href=\"#\" onClick=\"return mV('Deu',7,20);\">Deu 7:20</a>; <a href=\"#\" onClick=\"return mV('Jos',24,12);\">Jos 24:12</a>). The word is used in these passages as referring to some means by which the Canaanites were to be driven out from before the Israelites. Some have supposed that the word is used in a metaphorical sense as the symbol of some panic which would seize the people as a \"terror of God\" (<a href=\"#\" onClick=\"return mV('Gen',35,5);\">Gen 35:5</a>), the consternation with which God would inspire the Canaanites. In Palestine there are four species of hornets, differing from our hornets, being larger in size, and they are very abundant. They \"attack human beings in a very furious manner.\" \"The furious attack of a swarm of hornets drives cattle and horses to madness, and has even caused the death of the animals.\"";
eastonArray["$$T0001823"] = "<strong>Horonaim:</strong> two caverns, a city of Moab to the south of the Arnon, built, apparently, upon an eminence, and a place of some importance (<a href=\"#\" onClick=\"return mV('Isa',15,5);\">Isa 15:5</a>; <a href=\"#\" onClick=\"return mV('Jer',48,3,5,24);\">Jer 48:3, 5, 24</a>).";
eastonArray["$$T0001824"] = "<strong>Horonite:</strong> the designation of Sanballat (<a href=\"#\" onClick=\"return mV('Neh',2,10,19);\">Neh 2:10, 19</a>), a native of Horonaim, or of one of the two Beth-horons, the \"upper\" or the \"nether,\" mentioned in <a href=\"#\" onClick=\"return mV('Jos',16,3,5);\">Jos 16:3, 5</a>.";
eastonArray["$$T0001825"] = "<strong>Horse:</strong> always referred to in the Bible in connection with warlike operations, except <a href=\"#\" onClick=\"return mV('Isa',28,28);\">Isa 28:28</a>. The war-horse is described <a href=\"#\" onClick=\"return mV('Job',39,'19-25');\">Job 39:19-25</a>. For a long period after their settlement in Canaan the Israelites made no use of horses, according to the prohibition, <a href=\"#\" onClick=\"return mV('Deu',17,16);\">Deu 17:16</a>. David was the first to form a force of cavalry (<a href=\"#\" onClick=\"return mV('2Sa',8,4);\">2Sa 8:4</a>). But Solomon, from his connection with Egypt, greatly multiplied their number (<a href=\"#\" onClick=\"return mV('1Ki',4,26);\">1Ki 4:26</a>; <a href=\"#\" onClick=\"return mV('1Ki',10,26,29);\">10:26, 29</a>). After this, horses were freely used in Israel (<a href=\"#\" onClick=\"return mV('1Ki',22,4);\">1Ki 22:4</a>; <a href=\"#\" onClick=\"return mV('2Ki',3,7);\">2Ki 3:7</a>; <a href=\"#\" onClick=\"return mV('2Ki',9,21,33);\">9:21, 33</a>; <a href=\"#\" onClick=\"return mV('2Ki',11,16);\">11:16</a>). The furniture of the horse consisted simply of a bridle (<a href=\"#\" onClick=\"return mV('Isa',30,28);\">Isa 30:28</a>) and a curb (<a href=\"#\" onClick=\"return mV('Psa',32,9);\">Psa 32:9</a>).";
eastonArray["$$T0001826"] = "<strong>Horse-gate:</strong> a gate in the wall of Jerusalem, at the west end of the bridge, leading from Zion to the temple (<a href=\"#\" onClick=\"return mV('Neh',3,28);\">Neh 3:28</a>; <a href=\"#\" onClick=\"return mV('Jer',31,40);\">Jer 31:40</a>).";
eastonArray["$$T0001827"] = "<strong>Horse-leech:</strong> occurs only in <a href=\"#\" onClick=\"return mV('Pro',30,15);\">Pro 30:15</a> (Heb. 'alukah); the generic name for any blood-sucking annelid. There are various species in the marshes and pools of Palestine. That here referred to, the Hoemopis, is remarkable for the coarseness of its bite, and is therefore not used for medical purposes. They are spoken of in the East with feelings of aversion and horror, because of their propensity to fasten on the tongue and nostrils of horses when they come to drink out of the pools. The medicinal leech (Hirudo medicinalis), besides other species of leeches, are common in the waters of Syria.";
eastonArray["$$T0001828"] = "<strong>Horseman:</strong> Heb. ba'al parash, \"master of a horse.\" The \"horsemen\" mentioned <a href=\"#\" onClick=\"return mV('Exd',14,9);\">Exd 14:9</a> were \"mounted men\", i.e., men who rode in chariots. The army of Pharaoh consisted of a chariot and infantry force. We find that at a later period, however, the Egyptians had cavalry (<a href=\"#\" onClick=\"return mV('2Ch',12,3);\">2Ch 12:3</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001825');\">HORSE</a>.)";
eastonArray["$$T0001829"] = "<strong>Hosah:</strong> refuge.<br><br>(1.) A place on the border of the tribe of Asher (<a href=\"#\" onClick=\"return mV('Jos',19,29);\">Jos 19:29</a>), a little to the south of Zidon.<br><br>(2.) A Levite of the family of Merari (<a href=\"#\" onClick=\"return mV('1Ch',16,38);\">1Ch 16:38</a>).";
eastonArray["$$T0001830"] = "<strong>Hosanna:</strong> Save now! or Save, we beseech, (<a href=\"#\" onClick=\"return mV('Mat',21,9);\">Mat 21:9</a>). This was a customary form of acclamation at the feast of Tabernacles. (<a href=\"#\" onClick=\"return mV('Psa',118,25);\">Psa 118:25</a>.)";
eastonArray["$$T0001831"] = "<strong>Hose:</strong> (<a href=\"#\" onClick=\"return mV('Dan',3,21);\">Dan 3:21</a>), a tunic or undergarment.";
eastonArray["$$T0001832"] = "<strong>Hosea:</strong> salvation, the son of Beeri, and author of the book of prophecies bearing his name. He belonged to the kingdom of Israel. \"His Israelitish origin is attested by the peculiar, rough, Aramaizing diction, pointing to the northern part of Palestine; by the intimate acquaintance he evinces with the localities of Ephraim (<a href=\"#\" onClick=\"return mV('Hsa',5,1);\">Hsa 5:1</a>; <a href=\"#\" onClick=\"return mV('Hsa',6,8,9);\">6:8-9</a>; <a href=\"#\" onClick=\"return mV('Hsa',12,12);\">12:12</a>; <a href=\"#\" onClick=\"return mV('Hsa',14,6);\">14:6</a>, etc.); by passages like <a href=\"#\" onClick=\"return mV('Hsa',1,2);\">Hsa 1:2</a>, where the kingdom is styled 'the land', and <a href=\"#\" onClick=\"return mV('Hsa',7,5);\">Hsa 7:5</a>, where the Israelitish king is designated as 'our' king.\" The period of his ministry (extending to some sixty years) is indicated in the superscription (<a href=\"#\" onClick=\"return mV('Hsa',1,1,2);\">Hsa 1:1-2</a>). He is the only prophet of Israel who has left any written prophecy.";
eastonArray["$$T0001833"] = "<strong>Hosea, Prophecies of:</strong> This book stands first in order among the \"Minor Prophets.\" \"The probable cause of the location of Hosea may be the thoroughly national character of his oracles, their length, their earnest tone, and vivid representations.\" This was the longest of the prophetic books written before the Captivity. Hosea prophesied in a dark and melancholy period of Israel's history, the period of Israel's decline and fall. Their sins had brought upon them great national disasters. \"Their homicides and fornication, their perjury and theft, their idolatry and impiety, are censured and satirized with a faithful severity.\" He was a contemporary of Isaiah. The book may be divided into two parts, the first containing chapters <a href=\"#\" onClick=\"return mV('Hsa',1,'1-');\">Hsa 1-3</a>, and symbolically representing the idolatry of Israel under imagery borrowed from the matrimonial relation. The figures of marriage and adultery are common in the Old Testament writings to represent the spiritual relations between Jehovah and the people of Israel. Here we see the apostasy of Israel and their punishment, with their future repentance, forgiveness, and restoration.<br><br>The second part, containing <a href=\"#\" onClick=\"return mV('Hsa',4,'1-');\">Hsa 4-14</a>, is a summary of Hosea's discourses, filled with denunciations, threatenings, exhortations, promises, and revelations of mercy.<br><br>Quotations from Hosea are found in <a href=\"#\" onClick=\"return mV('Mat',2,15);\">Mat 2:15</a>; <a href=\"#\" onClick=\"return mV('Mat',9,15);\">9:15</a>; <a href=\"#\" onClick=\"return mV('Mat',12,7);\">12:7</a>; <a href=\"#\" onClick=\"return mV('Rom',9,25,26);\">Rom 9:25-26</a>. There are, in addition, various allusions to it in other places (<a href=\"#\" onClick=\"return mV('Luk',23,30);\">Luk 23:30</a>; <a href=\"#\" onClick=\"return mV('Rev',6,16);\">Rev 6:16</a>, comp. <a href=\"#\" onClick=\"return mV('Hsa',10,8);\">Hos 10:8</a>; <a href=\"#\" onClick=\"return mV('Rom',9,25,26);\">Rom 9:25-26</a>; <a href=\"#\" onClick=\"return mV('1Pe',2,10);\">1Pe 2:10</a>, comp. <a href=\"#\" onClick=\"return mV('Hsa',1,10);\">Hos. 1:10</a>, etc.).<br><br>As regards the style of this writer, it has been said that \"each verse forms a whole for itself, like one heavy toll in a funeral knell.\" \"Inversions (<a href=\"#\" onClick=\"return mV('Hsa',7,8);\">Hsa 7:8</a>; <a href=\"#\" onClick=\"return mV('Hsa',9,11,13);\">9:11, 13</a>; <a href=\"#\" onClick=\"return mV('Hsa',12,8);\">12:8</a>), anacolutha (<a href=\"#\" onClick=\"return mV('Hsa',9,6);\">Hsa 9:6</a>; <a href=\"#\" onClick=\"return mV('Hsa',12,8);\">12:8</a>, etc.), ellipses (<a href=\"#\" onClick=\"return mV('Hsa',9,4);\">Hsa 9:4</a>; <a href=\"#\" onClick=\"return mV('Hsa',13,9);\">13:9</a>, etc.), paranomasias, and plays upon words, are very characteristic of Hosea (<a href=\"#\" onClick=\"return mV('Hsa',8,7);\">Hsa 8:7</a>; <a href=\"#\" onClick=\"return mV('Hsa',9,15);\">9:15</a>; <a href=\"#\" onClick=\"return mV('Hsa',10,5);\">10:5</a>; <a href=\"#\" onClick=\"return mV('Hsa',11,5);\">11:5</a>; <a href=\"#\" onClick=\"return mV('Hsa',12,11);\">12:11</a>).\"";
eastonArray["$$T0001834"] = "<strong>Hoshea:</strong> salvation.<br><br>(1.) The original name of the son of Nun, afterwards called Joshua (<a href=\"#\" onClick=\"return mV('Num',13,8,16);\">Num 13:8, 16</a>; <a href=\"#\" onClick=\"return mV('Deu',32,44);\">Deu 32:44</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('1Ch',27,20);\">1Ch 27:20</a>. The ruler of Ephraim in David's time.<br><br>(3.) The last king of Israel. He conspired against and slew his predecessor, Pekah (<a href=\"#\" onClick=\"return mV('Isa',7,16);\">Isa 7:16</a>), but did not ascend the throne till after an interregnum of warfare of eight years (<a href=\"#\" onClick=\"return mV('2Ki',17,1,2);\">2Ki 17:1-2</a>). Soon after this he submitted to Shalmaneser, the Assyrian king, who a second time invaded the land to punish Hoshea, because of his withholding tribute which he had promised to pay. A second revolt brought back the Assyrian king Sargon, who besieged Samaria, and carried the ten tribes away beyond the Euphrates, B.C. 720 (<a href=\"#\" onClick=\"return mV('2Ki',17,5,6);\">2Ki 17:5-6</a>; <a href=\"#\" onClick=\"return mV('2Ki',18,'9-12');\">18:9-12</a>). No more is heard of Hoshea. He disappeared like \"foam upon the water\" (<a href=\"#\" onClick=\"return mV('Hsa',10,7);\">Hsa 10:7</a>; <a href=\"#\" onClick=\"return mV('Hsa',13,11);\">13:11</a>).";
eastonArray["$$T0001835"] = "<strong>Host:</strong> an entertainer (<a href=\"#\" onClick=\"return mV('Rom',16,23);\">Rom 16:23</a>); a tavern-keeper, the keeper of a caravansary (<a href=\"#\" onClick=\"return mV('Luk',10,35);\">Luk 10:35</a>).<br><br>In warfare, a troop or military force. This consisted at first only of infantry. Solomon afterwards added cavalry (<a href=\"#\" onClick=\"return mV('1Ki',4,26);\">1Ki 4:26</a>; <a href=\"#\" onClick=\"return mV('1Ki',10,26);\">10:26</a>). Every male Israelite from twenty to fifty years of age was bound by the law to bear arms when necessary (<a href=\"#\" onClick=\"return mV('Num',1,3);\">Num 1:3</a>; <a href=\"#\" onClick=\"return mV('Num',26,2);\">26:2</a>; <a href=\"#\" onClick=\"return mV('2Ch',25,5);\">2Ch 25:5</a>).<br><br>Saul was the first to form a standing army (<a href=\"#\" onClick=\"return mV('1Sa',13,2);\">1Sa 13:2</a>; <a href=\"#\" onClick=\"return mV('1Sa',24,2);\">24:2</a>). This example was followed by David (<a href=\"#\" onClick=\"return mV('1Ch',27,1);\">1Ch 27:1</a>), and Solomon (<a href=\"#\" onClick=\"return mV('1Ki',4,26);\">1Ki 4:26</a>), and by the kings of Israel and Judah (<a href=\"#\" onClick=\"return mV('2Ch',17,14);\">2Ch 17:14</a>; <a href=\"#\" onClick=\"return mV('2Ch',26,11);\">26:11</a>; <a href=\"#\" onClick=\"return mV('2Ki',11,4);\">2Ki 11:4</a>, etc.).";
eastonArray["$$T0001836"] = "<strong>Hostage:</strong> a person delivered into the hands of another as a security for the performance of some promise, etc. (<a href=\"#\" onClick=\"return mV('2Ki',14,14);\">2Ki 14:14</a>; <a href=\"#\" onClick=\"return mV('2Ch',25,24);\">2Ch 25:24</a>).";
eastonArray["$$T0001837"] = "<strong>Host of heaven:</strong> The sun, moon, and stars are so designated (<a href=\"#\" onClick=\"return mV('Gen',2,1);\">Gen 2:1</a>). When the Jews fell into idolatry they worshipped these (<a href=\"#\" onClick=\"return mV('Deu',4,19);\">Deu 4:19</a>; <a href=\"#\" onClick=\"return mV('2Ki',17,16);\">2Ki 17:16</a>; <a href=\"#\" onClick=\"return mV('2Ki',21,3,5);\">21:3, 5</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,5);\">23:5</a>; <a href=\"#\" onClick=\"return mV('Jer',19,13);\">Jer 19:13</a>; <a href=\"#\" onClick=\"return mV('Zep',1,5);\">Zep 1:5</a>; <a href=\"#\" onClick=\"return mV('Act',7,42);\">Act 7:42</a>).";
eastonArray["$$T0001838"] = "<strong>Hough:</strong> to hamstring, i.e., sever the \"tendon of Achilles\" of the hinder legs of captured horses (<a href=\"#\" onClick=\"return mV('Jos',11,6);\">Jos 11:6</a>; <a href=\"#\" onClick=\"return mV('2Sa',8,4);\">2Sa 8:4</a>; <a href=\"#\" onClick=\"return mV('1Ch',18,4);\">1Ch 18:4</a>), so as to render them useless.";
eastonArray["$$T0001839"] = "<strong>Hour:</strong> First found in <a href=\"#\" onClick=\"return mV('Dan',3,6);\">Dan 3:6</a>; <a href=\"#\" onClick=\"return mV('Dan',4,19,33);\">4:19, 33</a>; <a href=\"#\" onClick=\"return mV('Dan',5,5);\">5:5</a>. It is the rendering of the Chaldee shaah, meaning a \"moment,\" a \"look.\" It is used in the New Testament frequently to denote some determinate season (<a href=\"#\" onClick=\"return mV('Mat',8,13);\">Mat 8:13</a>; <a href=\"#\" onClick=\"return mV('Luk',12,39);\">Luk 12:39</a>).<br><br>With the ancient Hebrews the divisions of the day were \"morning, evening, and noon-day\" (<a href=\"#\" onClick=\"return mV('Psa',55,17);\">Psa 55:17</a>, etc.). The Greeks, following the Babylonians, divided the day into twelve hours. The Jews, during the Captivity, learned also from the Babylonians this method of dividing time. When Judea became subject to the Romans, the Jews adopted the Roman mode of reckoning time. The night was divided into four watches (<a href=\"#\" onClick=\"return mV('Luk',12,38);\">Luk 12:38</a>; <a href=\"#\" onClick=\"return mV('Mat',14,25);\">Mat 14:25</a>; <a href=\"#\" onClick=\"return mV('Mat',13,25);\">13:25</a>). Frequent allusion is also made to hours (<a href=\"#\" onClick=\"return mV('Mat',25,13);\">Mat 25:13</a>; <a href=\"#\" onClick=\"return mV('Mat',26,40);\">26:40</a>, etc.). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000984');\">DAY</a>.)<br><br>An hour was the twelfth part of the day, reckoning from sunrise to sunset, and consequently it perpetually varied in length.";
eastonArray["$$T0001840"] = "<strong>House:</strong> Till their sojourn in Egypt the Hebrews dwelt in tents. They then for the first time inhabited cities (<a href=\"#\" onClick=\"return mV('Gen',47,3);\">Gen 47:3</a>; <a href=\"#\" onClick=\"return mV('Exd',12,7);\">Exd 12:7</a>; <a href=\"#\" onClick=\"return mV('Hbr',11,9);\">Hbr 11:9</a>). From the earliest times the Assyrians and the Canaanites were builders of cities. The Hebrews after the Conquest took possession of the captured cities, and seem to have followed the methods of building that had been pursued by the Canaanites. Reference is made to the stone (<a href=\"#\" onClick=\"return mV('1Ki',7,9);\">1Ki 7:9</a>; <a href=\"#\" onClick=\"return mV('Isa',9,10);\">Isa 9:10</a>) and marble (<a href=\"#\" onClick=\"return mV('1Ch',29,2);\">1Ch 29:2</a>) used in building, and to the internal wood-work of the houses (<a href=\"#\" onClick=\"return mV('1Ki',6,15);\">1Ki 6:15</a>; <a href=\"#\" onClick=\"return mV('1Ki',7,2);\">7:2</a>; <a href=\"#\" onClick=\"return mV('1Ki',10,11,12);\">10:11-12</a>; <a href=\"#\" onClick=\"return mV('2Ch',3,5);\">2Ch 3:5</a>; <a href=\"#\" onClick=\"return mV('Jer',22,14);\">Jer 22:14</a>). \"Ceiled houses\" were such as had beams inlaid in the walls to which wainscotting was fastened (<a href=\"#\" onClick=\"return mV('Ezr',6,4);\">Ezr 6:4</a>; <a href=\"#\" onClick=\"return mV('Jer',22,14);\">Jer 22:14</a>; <a href=\"#\" onClick=\"return mV('Hag',1,4);\">Hag 1:4</a>). \"Ivory houses\" had the upper parts of the walls adorned with figures in stucco with gold and ivory (<a href=\"#\" onClick=\"return mV('1Ki',22,39);\">1Ki 22:39</a>; <a href=\"#\" onClick=\"return mV('2Ch',3,6);\">2Ch 3:6</a>; <a href=\"#\" onClick=\"return mV('Psa',45,8);\">Psa 45:8</a>).<br><br>The roofs of the dwelling-houses were flat, and are often alluded to in Scripture (<a href=\"#\" onClick=\"return mV('2Sa',11,2);\">2Sa 11:2</a>; <a href=\"#\" onClick=\"return mV('Isa',22,1);\">Isa 22:1</a>; <a href=\"#\" onClick=\"return mV('Mat',24,17);\">Mat 24:17</a>). Sometimes tents or booths were erected on them (<a href=\"#\" onClick=\"return mV('2Sa',16,22);\">2Sa 16:22</a>). They were protected by parapets or low walls (<a href=\"#\" onClick=\"return mV('Deu',22,8);\">Deu 22:8</a>). On the house-tops grass sometimes grew (<a href=\"#\" onClick=\"return mV('Pro',19,13);\">Pro 19:13</a>; <a href=\"#\" onClick=\"return mV('Pro',27,15);\">27:15</a>; <a href=\"#\" onClick=\"return mV('Psa',129,6,7);\">Psa 129:6-7</a>). They were used, not only as places of recreation in the evening, but also sometimes as sleeping-places at night (<a href=\"#\" onClick=\"return mV('1Sa',9,25,26);\">1Sa 9:25-26</a>; <a href=\"#\" onClick=\"return mV('2Sa',11,2);\">2Sa 11:2</a>; <a href=\"#\" onClick=\"return mV('2Sa',16,22);\">16:22</a>; <a href=\"#\" onClick=\"return mV('Dan',4,29);\">Dan 4:29</a>; <a href=\"#\" onClick=\"return mV('Job',27,18);\">Job 27:18</a>; <a href=\"#\" onClick=\"return mV('Pro',21,9);\">Pro 21:9</a>), and as places of devotion (<a href=\"#\" onClick=\"return mV('Jer',32,29);\">Jer 32:29</a>; <a href=\"#\" onClick=\"return mV('Jer',19,13);\">19:13</a>).";
eastonArray["$$T0001841"] = "<strong>Hukkok:</strong> decreed, a town near Zebulun, not far from Jordan, on the border of Naphtali (<a href=\"#\" onClick=\"return mV('Jos',19,34);\">Jos 19:34</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001729');\">HELKATH</a>.)";
eastonArray["$$T0001842"] = "<strong>Hul:</strong> circle, the second son of Aram (<a href=\"#\" onClick=\"return mV('Gen',10,23);\">Gen 10:23</a>), and grandson of Shem.";
eastonArray["$$T0001843"] = "<strong>Huldah:</strong> weasel, a prophetess; the wife of Shallum. She was consulted regarding the \"book of the law\" discovered by the high priest Hilkiah (<a href=\"#\" onClick=\"return mV('2Ki',22,'14-20');\">2Ki 22:14-20</a>; <a href=\"#\" onClick=\"return mV('2Ch',34,'22-28');\">2Ch 34:22-28</a>). She resided in that part of Jerusalem called the Mishneh (A.V., \"the college; \" R.V., \"the second quarter\"), supposed by some to be the suburb between the inner and the outer wall, the second or lower city, Akra. Miriam (<a href=\"#\" onClick=\"return mV('Exd',15,20);\">Exd 15:20</a>) and Deborah (<a href=\"#\" onClick=\"return mV('Jdg',4,4);\">Jdg 4:4</a>) are the only others who bear the title of \"prophetess,\" for the word in <a href=\"#\" onClick=\"return mV('Isa',8,3);\">Isa 8:3</a> means only the prophet's wife.";
eastonArray["$$T0001844"] = "<strong>Humiliation of Christ:</strong> (<a href=\"#\" onClick=\"return mV('Phl',2,8);\">Phl 2:8</a>), seen in<br><br>(1) his birth (<a href=\"#\" onClick=\"return mV('Gal',4,4);\">Gal 4:4</a>; <a href=\"#\" onClick=\"return mV('Luk',2,7);\">Luk 2:7</a>; <a href=\"#\" onClick=\"return mV('Jhn',1,46);\">Jhn 1:46</a>; <a href=\"#\" onClick=\"return mV('Hbr',2,9);\">Hbr 2:9</a>),<br><br>(2) his circumstances,<br>(3) his reputation (<a href=\"#\" onClick=\"return mV('Isa',53,'1-')\">Isa 53</a>; <a href=\"#\" onClick=\"return mV('Mat',26,59,67);\">Mat 26:59, 67</a>; <a href=\"#\" onClick=\"return mV('Psa',22,6);\">Psa 22:6</a>; <a href=\"#\" onClick=\"return mV('Mat',26,68);\">Mat 26:68</a>),<br><br>(4) his soul (<a href=\"#\" onClick=\"return mV('Psa',22,1);\">Psa 22:1</a>; <a href=\"#\" onClick=\"return mV('Mat',4,'1-11');\">Mat 4:1-11</a>; <a href=\"#\" onClick=\"return mV('Luk',22,44);\">Luk 22:44</a>; <a href=\"#\" onClick=\"return mV('Hbr',2,17,18);\">Hbr 2:17-18</a>; <a href=\"#\" onClick=\"return mV('Hbr',4,15);\">4:15</a>),<br><br>(5) is death (<a href=\"#\" onClick=\"return mV('Luk',23,'1-')\">Luk 23</a>; <a href=\"#\" onClick=\"return mV('Jhn',19,'1-')\">Jhn 19</a>; <a href=\"#\" onClick=\"return mV('Mar',15,24,25);\">Mar 15:24-25</a>),<br><br>(6) and his burial (<a href=\"#\" onClick=\"return mV('Isa',53,9);\">Isa 53:9</a>; <a href=\"#\" onClick=\"return mV('Mat',27,57,58,60);\">Mat 27:57-58, 60</a>).<br><br>His humiliation was necessary<br><br>(1) to execute the purpose of God (<a href=\"#\" onClick=\"return mV('Act',2,23,24);\">Act 2:23-24</a>; <a href=\"#\" onClick=\"return mV('Psa',40,'6-8');\">Psa 40:6-8</a>),<br><br>(2) fulfil the Old Testament types and prophecies,<br><br>(3) satisfy the law in the room of the guilty (<a href=\"#\" onClick=\"return mV('Isa',53,'1-')\">Isa 53</a>; <a href=\"#\" onClick=\"return mV('Hbr',9,12,15);\">Hbr 9:12, 15</a>), procure for them eternal redemption,<br><br>(4) and to show us an example.";
eastonArray["$$T0001845"] = "<strong>Humility:</strong> a prominent Christian grace (<a href=\"#\" onClick=\"return mV('Rom',12,3);\">Rom 12:3</a>; <a href=\"#\" onClick=\"return mV('Rom',15,17,18);\">15:17-18</a>; <a href=\"#\" onClick=\"return mV('1Cr',3,'5-7');\">1Cr 3:5-7</a>; <a href=\"#\" onClick=\"return mV('2Cr',3,5);\">2Cr 3:5</a>; <a href=\"#\" onClick=\"return mV('Phl',4,'11-13');\">Phl 4:11-13</a>). It is a state of mind well pleasing to God (<a href=\"#\" onClick=\"return mV('1Pe',3,4);\">1Pe 3:4</a>); it preserves the soul in tranquillity (<a href=\"#\" onClick=\"return mV('Psa',69,32,33);\">Psa 69:32-33</a>), and makes us patient under trials (<a href=\"#\" onClick=\"return mV('Job',1,22);\">Job 1:22</a>).<br><br>Christ has set us an example of humility (<a href=\"#\" onClick=\"return mV('Phl',2,'6-8');\">Phl 2:6-8</a>). We should be led thereto by a remembrance of our sins (<a href=\"#\" onClick=\"return mV('Lam',3,39);\">Lam 3:39</a>), and by the thought that it is the way to honour (<a href=\"#\" onClick=\"return mV('Pro',16,18);\">Pro 16:18</a>), and that the greatest promises are made to the humble (<a href=\"#\" onClick=\"return mV('Psa',147,6);\">Psa 147:6</a>; <a href=\"#\" onClick=\"return mV('Isa',57,15);\">Isa 57:15</a>; <a href=\"#\" onClick=\"return mV('Isa',66,2);\">66:2</a>; <a href=\"#\" onClick=\"return mV('1Pe',5,5);\">1Pe 5:5</a>). It is a \"great paradox in Christianity that it makes humility the avenue to glory.\"";
eastonArray["$$T0001846"] = "<strong>Hunting:</strong> mentioned first in <a href=\"#\" onClick=\"return mV('Gen',10,9);\">Gen 10:9</a> in connection with Nimrod. Esau was \"a cunning hunter\" (<a href=\"#\" onClick=\"return mV('Gen',25,27);\">Gen 25:27</a>). Hunting was practised by the Hebrews after their settlement in the \"Land of Promise\" (<a href=\"#\" onClick=\"return mV('Lev',17,15);\">Lev 17:15</a>; <a href=\"#\" onClick=\"return mV('Pro',12,27);\">Pro 12:27</a>). The lion and other ravenous beasts were found in Palestine (<a href=\"#\" onClick=\"return mV('1Sa',17,34);\">1Sa 17:34</a>; <a href=\"#\" onClick=\"return mV('2Sa',23,20);\">2Sa 23:20</a>; <a href=\"#\" onClick=\"return mV('1Ki',13,24);\">1Ki 13:24</a>; <a href=\"#\" onClick=\"return mV('Eze',19,'3-8');\">Eze 19:3-8</a>), and it must have been necessary to hunt and destroy them. Various snares and gins were used in hunting (<a href=\"#\" onClick=\"return mV('Psa',91,3);\">Psa 91:3</a>; <a href=\"#\" onClick=\"return mV('Amo',3,5);\">Amo 3:5</a>; <a href=\"#\" onClick=\"return mV('2Sa',23,20);\">2Sa 23:20</a>).<br><br>War is referred to under the idea of hunting (<a href=\"#\" onClick=\"return mV('Jer',16,16);\">Jer 16:16</a>; <a href=\"#\" onClick=\"return mV('Eze',32,30);\">Eze 32:30</a>).";
eastonArray["$$T0001847"] = "<strong>Hur:</strong> a hole, as of a viper, etc.<br><br>(1.) A son of Caleb (<a href=\"#\" onClick=\"return mV('1Ch',2,19,50);\">1Ch 2:19, 50</a>; <a href=\"#\" onClick=\"return mV('1Ch',4,1,4);\">4:1, 4</a>; <a href=\"#\" onClick=\"return mV('2Ch',1,5);\">2Ch 1:5</a>).<br><br>(2.) The husband of Miriam, Moses' sister (<a href=\"#\" onClick=\"return mV('Exd',17,'10-12');\">Exd 17:10-12</a>). He was associated with Aaron in charge of the people when Moses was absent on Sinai (<a href=\"#\" onClick=\"return mV('Exd',24,14);\">Exd 24:14</a>). He was probably of the tribe of Judah, and grandfather of Bezaleel (<a href=\"#\" onClick=\"return mV('Exd',31,2);\">Exd 31:2</a>; <a href=\"#\" onClick=\"return mV('Exd',35,30);\">35:30</a>; <a href=\"#\" onClick=\"return mV('1Ch',2,19);\">1Ch 2:19</a>).<br><br>(3.) One of the five princes of Midian who were defeated and slain by the Israelites under the command of Phinehas (<a href=\"#\" onClick=\"return mV('Num',31,8);\">Num 31:8</a>).";
eastonArray["$$T0001848"] = "<strong>Hurai:</strong> linen-worker, one of David's heroes, a native of the valley of Mount Gaash (<a href=\"#\" onClick=\"return mV('1Ch',11,32);\">1Ch 11:32</a>).";
eastonArray["$$T0001849"] = "<strong>Husband:</strong> i.e., the \"house-band,\" connecting and keeping together the whole family. A man when betrothed was esteemed from that time a husband (<a href=\"#\" onClick=\"return mV('Mat',1,16,20">Mat 1:16, 20; <a href=\"#\" onClick=\"return mV('Luk',2,5);\">Luk 2:5</a>). A recently married man was exempt from going to war for \"one year\" (<a href=\"#\" onClick=\"return mV('Deu',20,7);\">Deu 20:7</a>; <a href=\"#\" onClick=\"return mV('Deu',24,5);\">24:5</a>).";
