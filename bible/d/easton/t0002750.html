<script>var eastonArray = new Array ();
eastonArray["$$T0002750"] = "<strong>North country:</strong> a general name for the countries that lay north of Palestine. Most of the invading armies entered Palestine from the north (<a href=\"#\" onClick=\"return mV('Isa',41,25);\">Isa 41:25</a>; <a href=\"#\" onClick=\"return mV('Jer',1,14,15);\">Jer 1:14-15</a>; <a href=\"#\" onClick=\"return mV('Jer',50,3,9,41);\">50:3, 9, 41</a>; <a href=\"#\" onClick=\"return mV('Jer',51,48);\">51:48</a>; <a href=\"#\" onClick=\"return mV('Eze',26,7);\">Eze 26:7</a>).";
eastonArray["$$T0002751"] = "<strong>Northward:</strong> (Heb. tsaphon), a \"hidden\" or \"dark place,\" as opposed to the sunny south (<a href=\"#\" onClick=\"return mV('Deu',3,27);\">Deu 3:27</a>). A Hebrew in speaking of the points of the compass was considered as always having his face to the east, and hence \"the left hand\" (<a href=\"#\" onClick=\"return mV('Gen',14,15);\">Gen 14:15</a>; <a href=\"#\" onClick=\"return mV('Job',23,9);\">Job 23:9</a>) denotes the north. The \"kingdoms of the north\" are Chaldea, Assyria, Media, etc.";
eastonArray["$$T0002752"] = "<strong>Nose-jewels:</strong> Only mentioned in <a href=\"#\" onClick=\"return mV('Isa',3,21);\">Isa 3:21</a>, although referred to in <a href=\"#\" onClick=\"return mV('Gen',24,47);\">Gen 24:47</a>; <a href=\"#\" onClick=\"return mV('Pro',11,22);\">Pro 11:22</a>; <a href=\"#\" onClick=\"return mV('Hsa',2,13);\">Hsa 2:13</a>. They were among the most valued of ancient female ornaments. They \"were made of ivory or metal, and occasionally jewelled. They were more than an inch in diameter, and hung upon the mouth. Eliezer gave one to Rebekah which was of gold and weighed half a shekel...At the present day the women in the country and in the desert wear these ornaments in one of the sides of the nostrils, which droop like the ears in consequence.\"";
eastonArray["$$T0002753"] = "<strong>Numbering of the people:</strong> Besides the numbering of the tribes mentioned in the history of the wanderings in the wilderness, we have an account of a general census of the whole nation from Dan to Beersheba, which David gave directions to Joab to make (<a href=\"#\" onClick=\"return mV('1Ch',21,1);\">1Ch 21:1</a>). Joab very reluctantly began to carry out the king's command.<br><br>This act of David in ordering a numbering of the people arose from pride and a self-glorifying spirit. It indicated a reliance on his part on an arm of flesh, an estimating of his power not by the divine favour but by the material resources of his kingdom. He thought of military achievement and of conquest, and forgot that he was God's vicegerent. In all this he sinned against God. While Joab was engaged in the census, David's heart smote him, and he became deeply conscious of his fault; and in profound humiliation he confessed, \"I have sinned greatly in what I have done.\" The prophet Gad was sent to him to put before him three dreadful alternatives (<a href=\"#\" onClick=\"return mV('2Sa',24,13);\">2Sa 24:13</a>; and <a href=\"#\" onClick=\"return mV('1Ch',21,12);\">1Ch 21:12</a> have \"three years\"), three of Jehovah's four sore judgments (<a href=\"#\" onClick=\"return mV('Eze',14,21);\">Eze 14:21</a>). Two of these David had already experienced. He had fled for some months before Absalom, and had suffered three years' famine on account of the slaughter of the Gibeonites. In his \"strait\" David said, \"Let me fall into the hands of the Lord.\" A pestilence broke out among the people, and in three days swept away 70,000. At David's intercession the plague was stayed, and at the threshing-floor of Araunah (q.v.), where the destroying angel was arrested in his progress, David erected an altar, and there offered up sacrifies to God (<a href=\"#\" onClick=\"return mV('2Ch',3,1);\">2Ch 3:1</a>).<br><br>The census, so far as completed, showed that there were at least 1,300,000 fighting men in the kingdom, indicating at that time a population of about six or seven millions in all. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000751');\">CENSUS</a>.)";
eastonArray["$$T0002754"] = "<strong>Numbers, Book of:</strong> the fourth of the books of the Pentateuch, called in the Hebrew be-midbar, i.e., \"in the wilderness.\" In the LXX. version it is called \"Numbers,\" and this name is now the usual title of the book. It is so called because it contains a record of the numbering of the people in the wilderness of Sinai (<a href=\"#\" onClick=\"return mV('Num',1,'1-4')\">1-4</a>), and of their numbering afterwards on the plain of Moab (<a href=\"#\" onClick=\"return mV('Num',26,'1-)\">26</a>).<br><br>This book is of special historical interest as furnishing us with details as to the route of the Israelites in the wilderness and their principal encampments. It may be divided into three parts:<br><br>1. The numbering of the people at Sinai, and preparations for their resuming their march (<a href=\"#\" onClick=\"return mV('Num',1,'1-')\">Num 1</a>-<a href=\"#\" onClick=\"return mV('Num',10,'1-10')\">10:10</a>). The sixth chapter gives an account of the vow of a Nazarite.<br><br>2. An account of the journey from Sinai to Moab, the sending out of the spies and the report they brought back, and the murmurings (eight times) of the people at the hardships by the way (<a href=\"#\" onClick=\"return mV('Num',10,'11-');\">Num 10:11</a>-<a href=\"#\" onClick=\"return mV('Num',21,'1-20'-');\">21:20</a>).<br><br>3. The transactions in the plain of Moab before crossing the Jordan (<a href=\"#\" onClick=\"return mV('Num',21,'21-');\">Num 21:21</a>-ch. <a href=\"#\" onClick=\"return mV('Num',36,'1-');\">36</a>).<br><br>The period comprehended in the history extends from the second month of the second year after the Exodus to the beginning of the eleventh month of the fortieth year, in all about thirty-eight years and ten months; a dreary period of wanderings, during which that disobedient generation all died in the wilderness. They were fewer in number at the end of their wanderings than when they left the land of Egypt. We see in this history, on the one hand, the unceasing care of the Almighty over his chosen people during their wanderings; and, on the other hand, the murmurings and rebellions by which they offended their heavenly Protector, drew down repeated marks of his displeasure, and provoked him to say that they should \"not enter into his rest\" because of their unbelief (<a href=\"#\" onClick=\"return mV('Hbr',3,19);\">Hbr 3:19</a>).<br><br>This, like the other books of the Pentateuch, bears evidence of having been written by Moses.<br><br>The expression \"the book of the wars of the Lord,\" occurring in (<a href=\"#\" onClick=\"return mV('Num',21,14);\">Num 21:14</a>), has given rise to much discussion. But, after all, \"what this book was is uncertain, whether some writing of Israel not now extant, or some writing of the Amorites which contained songs and triumphs of their king Sihon's victories, out of which Moses may cite this testimony, as Paul sometimes does out of heathen poets (<a href=\"#\" onClick=\"return mV('Act',17,28);\">Act 17:28</a>; <a href=\"#\" onClick=\"return mV('Tts',1,12);\">Tts 1:12</a>).\"";
eastonArray["$$T0002755"] = "<strong>Nun:</strong> Beyond the fact that he was the father of Joshua nothing more is known of him (<a href=\"#\" onClick=\"return mV('Exd',33,11);\">Exd 33:11</a>).";
eastonArray["$$T0002756"] = "<strong>Nuts:</strong> were among the presents Jacob sent into Egypt for the purpose of conciliating Joseph (<a href=\"#\" onClick=\"return mV('Gen',43,11);\">Gen 43:11</a>). This was the fruit of the pistachio tree, which resembles the sumac. It is of the size of an olive. In <a href=\"#\" onClick=\"return mV('Sgs',6,11);\">Sgs 6:11</a> a different Hebrew word ('egoz), which means \"walnuts,\" is used.";
eastonArray["$$T0002757"] = "<strong>Nymphas:</strong> nymph, saluted by Paul in his Epistle to the Colossians as a member of the church of Laodicea (<a href=\"#\" onClick=\"return mV('Col',4,15);\">Col 4:15</a>).";
eastonArray["$$T0002758"] = "<strong>Oak:</strong> There are six Hebrew words rendered \"oak.\"<br><br>(1.) 'El occurs only in the word El-paran (<a href=\"#\" onClick=\"return mV('Gen',14,6);\">Gen 14:6</a>). The LXX. renders by \"terebinth.\" In the plural form this word occurs in <a href=\"#\" onClick=\"return mV('Isa',1,29);\">Isa 1:29</a>; <a href=\"#\" onClick=\"return mV('Isa',57,5);\">57:5</a> (A.V. marg. and R.V., \"among the oaks\"); <a href=\"#\" onClick=\"return mV('Isa',61,3);\">61:3</a> (\"trees\"). The word properly means strongly, mighty, and hence a strong tree.<br><br>(2.) 'Elah, <a href=\"#\" onClick=\"return mV('Gen',35,4);\">Gen 35:4</a>, \"under the oak which was by Shechem\" (R.V. marg., \"terebinth\"). <a href=\"#\" onClick=\"return mV('Isa',6,13);\">Isa 6:13</a>, A.V., \"teil-tree;\" R.V., \"terebinth.\" <a href=\"#\" onClick=\"return mV('Isa',1,30);\">Isa 1:30</a>, R.V. marg., \"terebinth.\" Absalom in his flight was caught in the branches of a \"great oak\" (<a href=\"#\" onClick=\"return mV('2Sa',18,9);\">2Sa 18:9</a>; R.V. marg., \"terebinth\").<br><br>(3.) 'Elon, <a href=\"#\" onClick=\"return mV('Jdg',4,11);\">Jdg 4:11</a>; <a href=\"#\" onClick=\"return mV('Jdg',9,6);\">9:6</a> (R.V., \"oak; \" A.V., following the Targum, \"plain\") properly the deciduous species of oak shedding its foliage in autumn.<br><br>(4.) 'Elan, only in <a href=\"#\" onClick=\"return mV('Dan',4,11,14, 20);\">Dan 4:11, 14, 20</a>, rendered \"tree\" in Nebuchadnezzar's dream. Probably some species of the oak is intended.<br><br>(5.) 'Allah, <a href=\"#\" onClick=\"return mV('Jos',24,26);\">Jos 24:26</a>. The place here referred to is called Allon-moreh (\"the oak of Moreh,\" as in R.V.) in <a href=\"#\" onClick=\"return mV('Gen',12,6);\">Gen 12:6</a> and <a href=\"#\" onClick=\"return mV('Gen',35,4);\">35:4</a>.<br><br>(6.) 'Allon, always rendered \"oak.\" Probably the evergreen oak (called also ilex and holm oak) is intended. The oak woods of Bashan are frequently alluded to (<a href=\"#\" onClick=\"return mV('Isa',2,13);\">Isa 2:13</a>; <a href=\"#\" onClick=\"return mV('Eze',27,6);\">Eze 27:6</a>). Three species of oaks are found in Palestine, of which the \"prickly evergreen oak\" (Quercus coccifera) is the most abundant. \"It covers the rocky hills of Palestine with a dense brushwood of trees from 8 to 12 feet high, branching from the base, thickly covered with small evergreen rigid leaves, and bearing acorns copiously.\" The so-called Abraham's oak at Hebron is of this species. Tristram says that this oak near Hebron \"has for several centuries taken the place of the once renowned terebinth which marked the site of Mamre on the other side of the city. The terebinth existed at Mamre in the time of Vespasian, and under it the captive Jews were sold as slaves. It disappeared about A.D. 330, and no tree now marks the grove of Mamre. The present oak is the noblest tree in Southern Palestine, being 23 feet in girth, and the diameter of the foliage, which is unsymmetrical, being about 90 feet.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0001712');\">HEBRON</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0003597');\">TEIL-TREE</a>.)";
eastonArray["$$T0002759"] = "<strong>Oath:</strong> a solemn appeal to God, permitted on fitting occasions (<a href=\"#\" onClick=\"return mV('Deu',6,13);\">Deu 6:13</a>; <a href=\"#\" onClick=\"return mV('Jer',4,2);\">Jer 4:2</a>), in various forms (<a href=\"#\" onClick=\"return mV('Gen',16,5);\">Gen 16:5</a>; <a href=\"#\" onClick=\"return mV('2Sa',12,5);\">2Sa 12:5</a>; <a href=\"#\" onClick=\"return mV('Rth',1,17);\">Rth 1:17</a>; <a href=\"#\" onClick=\"return mV('Hsa',4,15);\">Hsa 4:15</a>; <a href=\"#\" onClick=\"return mV('Rom',1,9);\">Rom 1:9</a>), and taken in different ways (<a href=\"#\" onClick=\"return mV('Gen',14,22);\">Gen 14:22</a>; <a href=\"#\" onClick=\"return mV('Gen',24,2);\">24:2</a>; <a href=\"#\" onClick=\"return mV('2Ch',6,22);\">2Ch 6:22</a>). God is represented as taking an oath (<a href=\"#\" onClick=\"return mV('Hbr',6,'16-18');\">Hbr 6:16-18</a>), so also Christ (<a href=\"#\" onClick=\"return mV('Mat',26,64);\">Mat 26:64</a>), and Paul (<a href=\"#\" onClick=\"return mV('Rom',9,1);\">Rom 9:1</a>; <a href=\"#\" onClick=\"return mV('Gal',1,20);\">Gal 1:20</a>; <a href=\"#\" onClick=\"return mV('Phl',1,8);\">Phl 1:8</a>). The precept, \"Swear not at all,\" refers probably to ordinary conversation between man and man (<a href=\"#\" onClick=\"return mV('Mat',5,34,37);\">Mat 5:34, 37</a>). But if the words are taken as referring to oaths, then their intention may have been to show \"that the proper state of Christians is to require no oaths; that when evil is expelled from among them every yea and nay will be as decisive as an oath, every promise as binding as a vow.\"";
eastonArray["$$T0002760"] = "<strong>Obadiah:</strong> servant of the Lord. (<a href=\"#\" onClick=\"return mV('Oba',1,'1-');\">Oba 1</a>.) An Israelite who was chief in the household of King Ahab (<a href=\"#\" onClick=\"return mV('1Ki',18,3);\">1Ki 18:3</a>). Amid great spiritual degeneracy he maintained his fidelity to God, and interposed to protect The Lord's prophets, an hundred of whom he hid at great personal risk in a cave (<a href=\"#\" onClick=\"return mV('1Ki',18,4,13);\">1Ki 18:4, 13</a>). Ahab seems to have held Obadiah in great honour, although he had no sympathy with his piety (<a href=\"#\" onClick=\"return mV('Oba',1,'5-7');\">5-7</a>). The last notice of him is his bringing back tidings to Ahab that Elijah, whom he had so long sought for, was at hand (<a href=\"#\" onClick=\"return mV('1Ki',18,'9-16');\">1Ki 18:9-16</a>). \"Go,\" said Elijah to him, when he met him in the way, \"go tell thy lord, Behold, Elijah is here.\"<br><br>(2.) A chief of the tribe of Issachar (<a href=\"#\" onClick=\"return mV('1Ch',7,3);\">1Ch 7:3</a>).<br><br>(3.) A descendant of Saul (<a href=\"#\" onClick=\"return mV('1Ch',8,38);\">1Ch 8:38</a>).<br><br>(4.) A Levite, after the Captivity (<a href=\"#\" onClick=\"return mV('1Ch',9,16);\">1Ch 9:16</a>).<br><br>(5.) A Gadite who joined David at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,9);\">1Ch 12:9</a>).<br><br>(6.) A prince of Zebulun in the time of David (<a href=\"#\" onClick=\"return mV('1Ch',27,19);\">1Ch 27:19</a>).<br><br>(7.) One of the princes sent by Jehoshaphat to instruct the people in the law (<a href=\"#\" onClick=\"return mV('2Ch',17,7);\">2Ch 17:7</a>).<br><br>(8.) A Levite who superintended the repairs of the temple under Josiah (<a href=\"#\" onClick=\"return mV('2Ch',34,12);\">2Ch 34:12</a>).<br><br>(9.) One who accompanied Ezra on the return from Babylon (<a href=\"#\" onClick=\"return mV('Ezr',8,9);\">Ezr 8:9</a>).<br><br>(10.) A prophet, fourth of the minor prophets in the Hebrew canon, and fifth in the LXX. He was probably contemporary with Jeremiah and Ezekiel. Of his personal history nothing is known.";
eastonArray["$$T0002761"] = "<strong>Obadiah, Book of:</strong> consists of one chapter, \"concerning Edom,\" its impending doom (<a href=\"#\" onClick=\"return mV('Oba',1,'1-16');\">Oba 1:1-16</a>), and the restoration of Israel (<a href=\"#\" onClick=\"return mV('Oba',1,'17-21');\">1:17-21</a>). This is the shortest book of the Old Testament.<br><br>There are on record the account of four captures of Jerusalem,<br><br>(1) by Shishak in the reign of Rehoboam (<a href=\"#\" onClick=\"return mV('1Ki',14,25);\">1Ki 14:25</a>);<br><br>(2) by the Philistines and Arabians in the reign of Jehoram (<a href=\"#\" onClick=\"return mV('2Ch',21,16);\">2Ch 21:16</a>);<br><br>(3) by Joash, the king of Israel, in the reign of Amaziah (<a href=\"#\" onClick=\"return mV('2Ki',14,13);\">2Ki 14:13</a>); and<br><br>(4) by the Babylonians, when Jerusalem was taken and destroyed by Nebuchadnezzar (B.C. 586). Obadiah (<a href=\"#\" onClick=\"return mV('Oba',1,'11-14');\">Oba 1:11-14</a>) speaks of this capture as a thing past. He sees the calamity as having already come on Jerusalem, and the Edomites as joining their forces with those of the Chaldeans in bringing about the degradation and ruin of Israel. We do not indeed read that the Edomites actually took part with the Chaldeans, but the probabilities are that they did so, and this explains the words of Obadiah in denouncing against Edom the judgments of God. The date of his prophecies was thus in or about the year of the destruction of Jerusalem.<br><br>Edom is the type of Israel's and of God's last foe (<a href=\"#\" onClick=\"return mV('Isa',63,'1-4');\">Isa 63:1-4</a>). These will finally all be vanquished, and the kingdom will be the Lord's (<a href=\"#\" onClick=\"return mV('Psa',22,28);\">Psa 22:28</a>).";
eastonArray["$$T0002762"] = "<strong>Obal:</strong> stripped, the eight son of Joktan (<a href=\"#\" onClick=\"return mV('Gen',10,28);\">Gen 10:28</a>); called also Ebal (<a href=\"#\" onClick=\"return mV('1Ch',1,22);\">1Ch 1:22</a>).";
eastonArray["$$T0002763"] = "<strong>Obed:</strong> serving; worshipping.<br><br>(1.) A son of Boaz and Ruth (<a href=\"#\" onClick=\"return mV('Rth',4,21,22);\">Rth 4:21-22</a>), and the grandfather of David (<a href=\"#\" onClick=\"return mV('Mat',1,5);\">Mat 1:5</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('1Ch',2,'34-38');\">1Ch 2:34-38</a>.<br><br>(3.) <a href=\"#\" onClick=\"return mV('1Ch',26,7);\">1Ch 26:7</a>.<br><br>(4.) <a href=\"#\" onClick=\"return mV('2Ch',23,1);\">2Ch 23:1</a>.";
eastonArray["$$T0002764"] = "<strong>Obed-Edom:</strong> servant of Edom.<br><br>(1.) \"The Gittite\" (probably so called because he was a native of Gath-rimmon), a Levite of the family of the Korhites (<a href=\"#\" onClick=\"return mV('1Ch',26,1,'4-8');\">1Ch 26:1, 4-8</a>), to whom was specially intrusted the custody of the ark (<a href=\"#\" onClick=\"return mV('1Ch',15,18);\">1Ch 15:18</a>). When David was bringing up the ark \"from the house of Abinadab, that was in Gibeah\" (probably some hill or eminence near Kirjath-jearim), and had reached Nachon's threshing-floor, he became afraid because of the \"breach upon Uzzah,\" and carried it aside into the house of Obededom (<a href=\"#\" onClick=\"return mV('2Sa',6,'1-12');\">2Sa 6:1-12</a>). There it remained for six months, and was to him and his house the occasion of great blessing. David then removed it with great rejoicing to Jerusalem, and set it in the midst of the tabernacle he had pitched for it.<br><br>(2.) A Merarite Levite, a temple porter, who with his eight sons guarded the southern gate (<a href=\"#\" onClick=\"return mV('1Ch',15,18,21);\">1Ch 15:18, 21</a>; <a href=\"#\" onClick=\"return mV('1Ch',26,4,8,15);\">26:4, 8, 15</a>).<br><br>(3.) One who had charge of the temple treasures (<a href=\"#\" onClick=\"return mV('2Ch',25,24);\">2Ch 25:24</a>).";
eastonArray["$$T0002765"] = "<strong>Obeisance:</strong> homage or reverence to any one (<a href=\"#\" onClick=\"return mV('Gen',37,7);\">Gen 37:7</a>; <a href=\"#\" onClick=\"return mV('Gen',43,28);\">43:28</a>).";
eastonArray["$$T0002766"] = "<strong>Obil:</strong> a keeper of camels, an Ishmaelite who was \"over the camels\" in the time of David (<a href=\"#\" onClick=\"return mV('1Ch',27,30);\">1Ch 27:30</a>).";
eastonArray["$$T0002767"] = "<strong>Oboth:</strong> bottles, an encampment of the Israelites during the wanderings in the wilderness (<a href=\"#\" onClick=\"return mV('Num',33,43);\">Num 33:43</a>), the first after the setting up of the brazen serpent.";
eastonArray["$$T0002768"] = "<strong>Oded:</strong> restoring, or setting up.<br>,br />(1.) Father of the prophet Azariah (<a href=\"#\" onClick=\"return mV('2Ch',15,1,8);\">2Ch 15:1, 8</a>).<br><br>(2.) A prophet in the time of Ahaz and Pekah (<a href=\"#\" onClick=\"return mV('2Ch',28,'9-15');\">2Ch 28:9-15</a>).";
eastonArray["$$T0002769"] = "<strong>Offence:</strong><br><br>(1.) An injury or wrong done to one (<a href=\"#\" onClick=\"return mV('1Sa',25,31);\">1Sa 25:31</a>; <a href=\"#\" onClick=\"return mV('Rom',5,15);\">Rom 5:15</a>).<br><br>(2.) A stumbling-block or cause of temptation (<a href=\"#\" onClick=\"return mV('Isa',8,14);\">Isa 8:14</a>; <a href=\"#\" onClick=\"return mV('Mat',16,23);\">Mat 16:23</a>; <a href=\"#\" onClick=\"return mV('Mat',18,7);\">18:7</a>). Greek skandalon, properly that at which one stumbles or takes offence. The \"offence of the cross\" (<a href=\"#\" onClick=\"return mV('Gal',5,11);\">Gal 5:11</a>) is the offence the Jews took at the teaching that salvation was by the crucified One, and by him alone. Salvation by the cross was a stumbling-block to their national pride.";
eastonArray["$$T0002770"] = "<strong>Offering:</strong> an oblation, dedicated to God. Thus Cain consecrated to God of the first-fruits of the earth, and Abel of the firstlings of the flock (<a href=\"#\" onClick=\"return mV('Gen',4,3,4);\">Gen 4:3-4</a>). Under the Levitical system different kinds of offerings are specified, and laws laid down as to their presentation. These are described under their distinctive names.";
eastonArray["$$T0002771"] = "<strong>Og:</strong> gigantic, the king of Bashan, who was defeated by Moses in a pitched battle at Edrei, and was slain along with his sons (<a href=\"#\" onClick=\"return mV('Deu',1,4);\">Deu 1:4</a>), and whose kingdom was given to the tribes of Reuben and Gad and half the tribe of Manasseh (<a href=\"#\" onClick=\"return mV('Num',21,'32-35');\">Num 21:32-35</a>; <a href=\"#\" onClick=\"return mV('Deu',3,'1-13');\">Deu 3:1-13</a>). His bedstead (or rather sarcophagus) was of iron (or ironstone), 9 cubits in length and 4 cubits in breadth. His overthrow was afterwards celebrated in song (<a href=\"#\" onClick=\"return mV('Psa',135,11);\">Psa 135:11</a>; <a href=\"#\" onClick=\"return mV('Psa',136,20);\">136:20</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0003427');\">SIHON</a>.)";
eastonArray["$$T0002772"] = "<strong>Ohad:</strong> united, or power, the third son of Simeon (<a href=\"#\" onClick=\"return mV('Gen',46,10);\">Gen 46:10</a>).";
eastonArray["$$T0002773"] = "<strong>Ohel:</strong> a house; tent, the fourth son of Zerubbabel (<a href=\"#\" onClick=\"return mV('1Ch',3,20);\">1Ch 3:20</a>).";
eastonArray["$$T0002774"] = "<strong>Oil:</strong> Only olive oil seems to have been used among the Hebrews. It was used for many purposes: for anointing the body or the hair (<a href=\"#\" onClick=\"return mV('Exd',29,7);\">Exd 29:7</a>; <a href=\"#\" onClick=\"return mV('2Sa',14,2);\">2Sa 14:2</a>; <a href=\"#\" onClick=\"return mV('Psa',23,5);\">Psa 23:5</a>; <a href=\"#\" onClick=\"return mV('Psa',92,10);\">92:10</a>; <a href=\"#\" onClick=\"return mV('Psa',104,15);\">104:15</a>; <a href=\"#\" onClick=\"return mV('Luk',7,46);\">Luk 7:46</a>); in some of the offerings (<a href=\"#\" onClick=\"return mV('Exd',29,40);\">Exd 29:40</a>; <a href=\"#\" onClick=\"return mV('Lev',7,12);\">Lev 7:12</a>; <a href=\"#\" onClick=\"return mV('Num',6,15);\">Num 6:15</a>; <a href=\"#\" onClick=\"return mV('Num',15,4);\">15:4</a>), but was excluded from the sin-offering (<a href=\"#\" onClick=\"return mV('Lev',5,11);\">Lev 5:11</a>) and the jealousy-offering (<a href=\"#\" onClick=\"return mV('Num',5,15);\">Num 5:15</a>); for burning in lamps (<a href=\"#\" onClick=\"return mV('Exd',25,6);\">Exd 25:6</a>; <a href=\"#\" onClick=\"return mV('Exd',27,20);\">27:20</a>; <a href=\"#\" onClick=\"return mV('Mat',25,3);\">Mat 25:3</a>); for medicinal purposes (<a href=\"#\" onClick=\"return mV('Isa',1,6);\">Isa 1:6</a>; <a href=\"#\" onClick=\"return mV('Luk',10,34);\">Luk 10:34</a>; <a href=\"#\" onClick=\"return mV('Jam',5,14);\">Jam 5:14</a>); and for anointing the dead (<a href=\"#\" onClick=\"return mV('Mat',26,12);\">Mat 26:12</a>; <a href=\"#\" onClick=\"return mV('Luk',23,56);\">Luk 23:56</a>).<br><br>It was one of the most valuable products of the country (<a href=\"#\" onClick=\"return mV('Deu',32,13);\">Deu 32:13</a>; <a href=\"#\" onClick=\"return mV('Eze',16,13);\">Eze 16:13</a>), and formed an article of extensive commerce with Tyre (<a href=\"#\" onClick=\"return mV('Eze',27,17);\">27:17</a>).<br><br>The use of it was a sign of gladness (<a href=\"#\" onClick=\"return mV('Psa',92,10);\">Psa 92:10</a>; <a href=\"#\" onClick=\"return mV('Isa',61,3);\">Isa 61:3</a>), and its omission a token of sorrow (<a href=\"#\" onClick=\"return mV('2Sa',14,2);\">2Sa 14:2</a>; <a href=\"#\" onClick=\"return mV('Mat',6,17);\">Mat 6:17</a>). It was very abundant in Galilee. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002778');\">OLIVE</a>.)";
eastonArray["$$T0002775"] = "<strong>Oil-tree:</strong> (<a href=\"#\" onClick=\"return mV('Isa',41,19);\">Isa 41:19</a>; R.V. marg., \"oleaster\"), Heb. 'etz shemen, rendered \"olive tree\" in <a href=\"#\" onClick=\"return mV('1Ki',6,23,'31-33');\">1Ki 6:23, 31-33</a> (R.V., \"olive wood\") and \"pine branches\" in <a href=\"#\" onClick=\"return mV('Neh',8,15);\">Neh 8:15</a> (R.V., \"branches of wild olive\"), was some tree distinct from the olive. It was probably the oleaster (<i>Eleagnus angustifolius</i>), which grows abundantly in almost all parts of Palestine, especially about Hebron and Samaria. \"It has a fine hard wood,\" says Tristram, \"and yields an inferior oil, but it has no relationship to the olive, which, however, it resembles in general appearance.\"";
eastonArray["$$T0002776"] = "<strong>Ointment:</strong> Various fragrant preparations, also compounds for medical purposes, are so called (<a href=\"#\" onClick=\"return mV('Exd',30,25);\">Exd 30:25</a>; <a href=\"#\" onClick=\"return mV('Psa',133,2);\">Psa 133:2</a>; <a href=\"#\" onClick=\"return mV('Isa',1,6);\">Isa 1:6</a>; <a href=\"#\" onClick=\"return mV('Amo',6,6);\">Amo 6:6</a>; <a href=\"#\" onClick=\"return mV('Jhn',12,3);\">Jhn 12:3</a>; <a href=\"#\" onClick=\"return mV('Rev',18,13);\">Rev 18:13</a>).";
eastonArray["$$T0002777"] = "<strong>Old gate:</strong> one of the gates in the north wall of Jerusalem, so called because built by the Jebusites (<a href=\"#\" onClick=\"return mV('Neh',3,6);\">Neh 3:6</a>; <a href=\"#\" onClick=\"return mV('Neh',12,39);\">12:39</a>).";
eastonArray["$$T0002778"] = "<strong>Olive:</strong> the fruit of the olive-tree. This tree yielded oil which was highly valued. The best oil was from olives that were plucked before being fully ripe, and then beaten or squeezed (<a href=\"#\" onClick=\"return mV('Deu',24,20);\">Deu 24:20</a>; <a href=\"#\" onClick=\"return mV('Isa',17,6);\">Isa 17:6</a>; <a href=\"#\" onClick=\"return mV('Isa',24,13);\">24:13</a>). It was called \"beaten,\" or \"fresh oil\" (<a href=\"#\" onClick=\"return mV('Exd',27,20);\">Exd 27:20</a>). There were also oil-presses, in which the oil was trodden out by the feet (<a href=\"#\" onClick=\"return mV('Mic',6,15);\">Mic 6:15</a>). James (<a href=\"#\" onClick=\"return mV('Jam',3,12);\">Jam 3:12</a>) calls the fruit \"olive berries.\" The phrase \"vineyards and olives\" (<a href=\"#\" onClick=\"return mV('Jdg',15,5);\">Jdg 15:5</a>, A.V.) should be simply \"olive-yard,\" or \"olive-garden,\" as in the Revised Version. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002774');\">OIL</a>.)";
eastonArray["$$T0002779"] = "<strong>Olive-tree:</strong> is frequently mentioned in Scripture. The dove from the ark brought an olive-branch to Noah (<a href=\"#\" onClick=\"return mV('Gen',8,11);\">Gen 8:11</a>). It is mentioned among the most notable trees of Palestine, where it was cultivated long before the time of the Hebrews (<a href=\"#\" onClick=\"return mV('Deu',6,11);\">Deu 6:11</a>; <a href=\"#\" onClick=\"return mV('Deu',8,8);\">8:8</a>). It is mentioned in the first Old Testament parable, that of Jotham (<a href=\"#\" onClick=\"return mV('Jdg',9,9);\">Jdg 9:9</a>), and is named among the blessings of the \"good land,\" and is at the present day the one characteristic tree of Palestine. The oldest olive-trees in the country are those which are enclosed in the Garden of Gethsemane. It is referred to as an emblem of prosperity and beauty and religious privilege (<a href=\"#\" onClick=\"return mV('Psa',52,8);\">Psa 52:8</a>; <a href=\"#\" onClick=\"return mV('Jer',11,16);\">Jer 11:16</a>; <a href=\"#\" onClick=\"return mV('Hsa',14,6);\">Hsa 14:6</a>). The two \"witnesses\" mentioned in <a href=\"#\" onClick=\"return mV('Rev',11,4);\">Rev 11:4</a> are spoken of as \"two olive trees standing before the God of the earth.\" (<a href=\"#\" onClick=\"return mV('Zec',4,3,'11-14');\">Zec 4:3, 11-14</a>.)<br><br>The \"olive-tree, wild by nature\" (<a href=\"#\" onClick=\"return mV('Rom',11,24);\">Rom 11:24</a>), is the shoot or cutting of the good olive-tree which, left ungrafted, grows up to be a \"wild olive.\" In <a href=\"#\" onClick=\"return mV('Rom',11,17);\">Rom 11:17</a> Paul refers to the practice of grafting shoots of the wild olive into a \"good\" olive which has become unfruitful. By such a process the sap of the good olive, by pervading the branch which is \"graffed in,\" makes it a good branch, bearing good olives. Thus the Gentiles, being a \"wild olive,\" but now \"graffed in,\" yield fruit, but only through the sap of the tree into which they have been graffed. This is a process \"contrary to nature\" (<a href=\"#\" onClick=\"return mV('Rom',11,24);\">11:24</a>).";
eastonArray["$$T0002780"] = "<strong>Olves, Mount of:</strong> so called from the olive trees with which its sides are clothed, is a mountain ridge on the east of Jerusalem (<a href=\"#\" onClick=\"return mV('1Ki',11,7);\">1Ki 11:7</a>; <a href=\"#\" onClick=\"return mV('Eze',11,23);\">Eze 11:23</a>; <a href=\"#\" onClick=\"return mV('Zec',14,4);\">Zec 14:4</a>), from which it is separated by the valley of Kidron. It is first mentioned in connection with David's flight from Jerusalem through the rebellion of Absalom (<a href=\"#\" onClick=\"return mV('2Sa',15,30);\">2Sa 15:30</a>), and is only once again mentioned in the Old Testament, in <a href=\"#\" onClick=\"return mV('Zec',14,4);\">Zec 14:4</a>. It is, however, frequently alluded to (<a href=\"#\" onClick=\"return mV('1Ki',11,7);\">1Ki 11:7</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,13);\">2Ki 23:13</a>; <a href=\"#\" onClick=\"return mV('Neh',8,15);\">Neh 8:15</a>; <a href=\"#\" onClick=\"return mV('Eze',11,23);\">Eze 11:23</a>).<br><br>It is frequently mentioned in the New Testament (<a href=\"#\" onClick=\"return mV('Mat',21,1);\">Mat 21:1</a>; <a href=\"#\" onClick=\"return mV('Mat',26,30);\">26:30</a>, etc.). It now bears the name of Jebel et-Tur, i.e., \"Mount of the Summit;\" also sometimes called Jebel ez-Zeitun, i.e., \"Mount of Olives.\" It is about 200 feet above the level of the city. The road from Jerusalem to Bethany runs as of old over this mount. It was on this mount that Jesus stood when he wept over Jerusalem. \"No name in Scripture,\" says Dr. Porter, \"calls up associations at once so sacred and so pleasing as that of Olivet. The 'mount' is so intimately connected with the private, the devotional life of the Saviour, that we read of it and look at it with feelings of deepest interest and affection. Here he often sat with his disciples, telling them of wondrous events yet to come, of the destruction of the Holy City; of the sufferings, the persecution, and the final triumph of his followers (<a href=\"#\" onClick=\"return mV('Mat',24,'1-')\">Mat 24</a>). Here he gave them the beautiful parables of the ten virgins and the five talents (<a href=\"#\" onClick=\"return mV('Mat',25,'1-')\">25</a>); here he was wont to retire on each evening for meditation, and prayer, and rest of body, when weary and harassed by the labours and trials of the day (<a href=\"#\" onClick=\"return mV('Luk',21,37);\">Luk 21:37</a>); and here he came on the night of his betrayal to utter that wonderful prayer, 'O my Father, if it be possible, let this cup pass from me: nevertheless not as I will, but as thou wilt' (<a href=\"#\" onClick=\"return mV('Mat',26,39);\">Mat 26:39</a>). And when the cup of God's wrath had been drunk, and death and the grave conquered, he led his disciples out again over Olivet as far as to Bethany, and after a parting blessing ascended to heaven (<a href=\"#\" onClick=\"return mV('Luk',24,50,51);\">Luk 24:50-51</a>; <a href=\"#\" onClick=\"return mV('Act',1,12);\">Act 1:12</a>).\"<br><br>This mount, or rather mountain range, has four summits or peaks:<br><br>(1) the \"Galilee\" peak, so called from a tradition that the angels stood here when they spoke to the disciples (<a href=\"#\" onClick=\"return mV('Act',1,11);\">Act 1:11</a>);<br><br>(2) the \"Mount of Ascension,\" the supposed site of that event, which was, however, somewhere probably nearer Bethany (<a href=\"#\" onClick=\"return mV('Luk',24,51,52);\">Luk 24:51-52</a>);<br><br>(3) the \"Prophets,\" from the catacombs on its side, called \"the prophets' tombs;\" and<br><br>(4) the \"Mount of Corruption,\" so called because of the \"high places\" erected there by Solomon for the idolatrous worship of his foreign wives (<a href=\"#\" onClick=\"return mV('1Ki',11,7);\">1Ki 11:7</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,13);\">2Ki 23:13</a>; Vulg., \"Mount of Offence\").";
eastonArray["$$T0002781"] = "<strong>Olympas:</strong> a Roman Christian whom Paul salutes (<a href=\"#\" onClick=\"return mV('Rom',16,15);\">Rom 16:15</a>).";
eastonArray["$$T0002782"] = "<strong>Omar:</strong> eloquent, the son of Eliphaz, who was Esau's eldest son (<a href=\"#\" onClick=\"return mV('Gen',36,'11-15');\">Gen 36:11-15</a>).";
eastonArray["$$T0002783"] = "<strong>Omega:</strong> (<a href=\"#\" onClick=\"return mV('Rev',1,8);\">Rev 1:8</a>), the last letter in the Greek alphabet. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000001');\">A</a>.)";
eastonArray["$$T0002784"] = "<strong>Omer:</strong> a handful, one-tenth of an ephah=half a gallon dry measure (<a href=\"#\" onClick=\"return mV('Exd',16,22,32,33,36);\">Exd 16:22, 32-33, 36</a>)=\"tenth deal.\"";
eastonArray["$$T0002785"] = "<strong>Omri:</strong> servant of Jehovah. When Elah was murdered by Zimri at Tirzah (<a href=\"#\" onClick=\"return mV('1Ki',16,'15-27');\">1Ki 16:15-27</a>), Omri, his captain, was made king (B.C. 931). For four years there was continued opposition to his reign, Tibni, another claimant to the throne, leading the opposing party; but at the close of that period all his rivals were defeated, and he became king of Israel, \"Tibni died and Omri reigned\" (B.C. 927). By his vigour and power he gained great eminence and consolidated the kingdom. He fixed his dynasty on the throne so firmly that it continued during four succeeding reigns. Tirza was for six years the seat of his government. He then removed the capital to Samaria (q.v.), where he died, and was succeeded by his son Ahab. \"He wrought evil in the eyes of the Lord, and did worse than all that were before him.\"<br><br>Beth-omri, \"the house\" or \"city of Omri,\" is the name usually found on Assyrian inscriptions for Samaria. In the stele of Mesha (the \"Moabite stone\"), which was erected in Moab about twenty or thirty years after Omri's death, it is recorded that Omri oppressed Moab till Mesha delivered the land: \"Omri, king of Israel, oppressed Moab many days, for Chemosh was angry with his land. His son succeeded him, and he also said, I will oppress Moab\" (<a href=\"#\" onClick=\"return mV('2Ki',1,1);\">2Ki 1:1</a>; <a href=\"#\" onClick=\"return mV('2Ki',3,4,5);\">3:4-5</a>). The \"Moabite stone\" also records that \"Omri took the land of Medeba, and occupied it in his day and in the days of his son forty years.\"";
eastonArray["$$T0002786"] = "<strong>On:</strong> light; the sun, (<a href=\"#\" onClick=\"return mV('Gen',41,45,50);\">Gen 41:45, 50</a>), the great seat of sun-worship, called also Bethshemesh (<a href=\"#\" onClick=\"return mV('Jer',43,13);\">Jer 43:13</a>) and Aven (<a href=\"#\" onClick=\"return mV('Eze',30,17);\">Eze 30:17</a>), stood on the east bank of the Nile, a few miles north of Memphis, and near Cairo, in the north-east. The Vulgate and the LXX. Versions have \"Heliopolis\" (\"city of the sun\") instead of On in Genesis and of Aven in Ezekiel. The \"city of destruction\" Isaiah speaks of (<a href=\"#\" onClick=\"return mV('Isa',19,18);\">Isa 19:18</a>, marg. \"of Heres; \" Heb. 'Ir-ha-heres, which some MSS. read Ir-ha-heres, i.e., \"city of the sun\") may be the name given to On, the prophecy being that the time will come when that city which was known as the \"city of the sun-god\" shall become the \"city of destruction\" of the sun-god, i.e., when idolatry shall cease, and the worship of the true God be established.<br><br>In ancient times this city was full of obelisks dedicated to the sun. Of these only one now remains standing. \"Cleopatra's Needle\" was one of those which stood in this city in front of the Temple of Tum, i.e., \"the sun.\" It is now erected on the Thames Embankment, London.<br><br>\"It was at On that Joseph wooed and won the dark-skinned Asenath, the daughter of the high priest of its great temple.\" This was a noted university town, and here Moses gained his acquaintance with \"all the wisdom of the Egyptians.\"";
eastonArray["$$T0002787"] = "<strong>Onan:</strong> strong, the second son of Judah (<a href=\"#\" onClick=\"return mV('Gen',38,'4-10');\">Gen 38:4-10</a>; <a href=\"#\" onClick=\"return mV('Deu',25,5);\">Deu 25:5</a>; <a href=\"#\" onClick=\"return mV('Mat',22,24);\">Mat 22:24</a>). He died before the going down of Jacob and his family into Egypt.";
eastonArray["$$T0002788"] = "<strong>Onesimus:</strong> useful, a slave who, after robbing his master Philemon (q.v.) at Colosse, fled to Rome, where he was converted by the apostle Paul, who sent him back to his master with the epistle which bears his name. In it he beseeches Philemon to receive his slave as a \"faithful and beloved brother.\" Paul offers to pay to Philemon anything his slave had taken, and to bear the wrong he had done him. He was accompanied on his return by Tychicus, the bearer of the Epistle to the Colossians (<a href=\"#\" onClick=\"return mV('Phm',1,16,18);\">Phm 1:16, 18</a>).<br><br>The story of this fugitive Colossian slave is a remarkable evidence of the freedom of access to the prisoner which was granted to all, and \"a beautiful illustration both of the character of St. Paul and the transfiguring power and righteous principles of the gospel.\"";
eastonArray["$$T0002789"] = "<strong>Onesiphorus:</strong> bringing profit, an Ephesian Christian who showed great kindness to Paul at Rome. He served him in many things, and had oft refreshed him. Paul expresses a warm interest in him and his household (<a href=\"#\" onClick=\"return mV('2Ti',1,'16-18');\">2Ti 1:16-18</a>; <a href=\"#\" onClick=\"return mV('2Ti',4,19);\">4:19</a>).";
eastonArray["$$T0002790"] = "<strong>Onion:</strong> The Israelites in the wilderness longed for the \"onions and garlick of Egypt\" (<a href=\"#\" onClick=\"return mV('Num',11,5);\">Num 11:5</a>). This was the <i>betsel</i> of the Hebrews, the <i>Allium cepe</i> of botanists, of which it is said that there are some thirty or forty species now growing in Palestine. The onion is \"the 'undivided' leek, <i>unio</i>, <i>unus</i>, one.\"";
eastonArray["$$T0002791"] = "<strong>Ono:</strong> a town of Benjamin, in the \"plain of Ono\" (<a href=\"#\" onClick=\"return mV('1Ch',8,12);\">1Ch 8:12</a>; <a href=\"#\" onClick=\"return mV('Ezr',2,33);\">Ezr 2:33</a>); now Kefr 'Ana, 5 miles north of Lydda, and about 30 miles north-west of Jerusalem. Not succeeding in their attempts to deter Nehemiah from rebuilding the walls of Jerusalem, Sanballat and Tobiah resorted to strategem, and pretending to wish a conference with him, they invited him to meet them at Ono. Four times they made the request, and every time Nehemiah refused to come. Their object was to take him prisoner.";
eastonArray["$$T0002792"] = "<strong>Onycha:</strong> a nail; claw; hoof, (Heb. sheheleth; <a href=\"#\" onClick=\"return mV('Exd',30,34);\">Exd 30:34</a>), a Latin word applied to the operculum, i.e., the claw or nail of the strombus or wing-shell, a univalve common in the Red Sea. The opercula of these shell-fish when burned emit a strong odour \"like castoreum.\" This was an ingredient in the sacred incense.";
eastonArray["$$T0002793"] = "<strong>Onyx:</strong> a hail; claw; hoof, (Heb. shoham), a precious stone adorning the breast-plate of the high priest and the shoulders of the ephod (<a href=\"#\" onClick=\"return mV('Exd',28,'9-12',20);\">Exd 28:9-12, 20</a>; <a href=\"#\" onClick=\"return mV('Exd',35,27);\">35:27</a>; <a href=\"#\" onClick=\"return mV('Job',28,16);\">Job 28:16</a>; <a href=\"#\" onClick=\"return mV('Eze',28,13);\">Eze 28:13</a>). It was found in the land of Havilah (<a href=\"#\" onClick=\"return mV('Gen',2,12);\">Gen 2:12</a>). The LXX. translates the Hebrew word by smaragdos, an emerald. Some think that the sardonyx is meant. But the onyx differs from the sardonyx in this, that while the latter has two layers (black and white) the former has three (black, white, and red).";
eastonArray["$$T0002794"] = "<strong>Open place:</strong> <a href=\"#\" onClick=\"return mV('Gen',38,14,21);\">Gen 38:14, 21</a>, mar. Enaim; the same probably as Enam (<a href=\"#\" onClick=\"return mV('Jos',15,34);\">Jos 15:34</a>), a city in the lowland or Shephelah.";
eastonArray["$$T0002795"] = "<strong>Ophel:</strong> hill; mound, the long, narrow, rounded promontory on the southern slope of the temple hill, between the Tyropoeon and the Kedron valley (<a href=\"#\" onClick=\"return mV('2Ch',27,3);\">2Ch 27:3</a>; <a href=\"#\" onClick=\"return mV('2Ch',33,14);\">33:14</a>; <a href=\"#\" onClick=\"return mV('Neh',3,26,27);\">Neh 3:26-27</a>). It was surrounded by a separate wall, and was occupied by the Nethinim after the Captivity. This wall has been discovered by the engineers of the Palestine Exploration Fund at the south-eastern angle of the temple area. It is 4 feet below the present surface. In <a href=\"#\" onClick=\"return mV('2Ki',5,24);\">2Ki 5:24</a> this word is translated \"tower\" (R.V., \"hill\"), denoting probably some eminence near Elisha's house.";
eastonArray["$$T0002796"] = "<strong>Ophir:</strong><br><br>(1.) One of the sons of Joktan (<a href=\"#\" onClick=\"return mV('Gen',10,29);\">Gen 10:29</a>).<br><br>(2.) Some region famous for its gold (<a href=\"#\" onClick=\"return mV('1Ki',9,28);\">1Ki 9:28</a>; <a href=\"#\" onClick=\"return mV('1Ki',10,11);\">10:11</a>; <a href=\"#\" onClick=\"return mV('1Ki',22,48);\">22:48</a>; <a href=\"#\" onClick=\"return mV('Job',22,24);\">Job 22:24</a>; <a href=\"#\" onClick=\"return mV('Job',28,16);\">28:16</a>; <a href=\"#\" onClick=\"return mV('Isa',13,12);\">Isa 13:12</a>). In the LXX. this word is rendered \"Sophir,\" and \"Sofir\" is the Coptic name for India, which is the rendering of the Arabic version, as also of the Vulgate. Josephus has identified it with the Golden Chersonese, i.e., the Malay peninsula. It is now generally identified with Abhira, at the mouth of the Indus. Much may be said, however, in favour of the opinion that it was somewhere in Arabia.";
eastonArray["$$T0002797"] = "<strong>Ophni:</strong> mouldy, a city of Benjamin (<a href=\"#\" onClick=\"return mV('Jos',18,24);\">Jos 18:24</a>).";
eastonArray["$$T0002798"] = "<strong>Ophrah:</strong> a fawn. <a href=\"#\" onClick=\"return mV('1Ch',4,14);\">1Ch 4:14</a>.<br><br>(1.) A city of Benjamin (<a href=\"#\" onClick=\"return mV('Jos',18,23);\">Jos 18:23</a>); probably identical with Ephron (<a href=\"#\" onClick=\"return mV('2Ch',13,19);\">2Ch 13:19</a>) and Ephraim (<a href=\"#\" onClick=\"return mV('Jhn',11,54);\">Jhn 11:54</a>).<br><br>(2.) \"Of the Abi-ezrites.\" A city of Manasseh, 6 miles south-west of Shechem, the residence of Gideon (<a href=\"#\" onClick=\"return mV('Jdg',6,11);\">Jdg 6:11</a>; <a href=\"#\" onClick=\"return mV('Jdg',8,27,32);\">8:27, 32</a>). After his great victory over the Midianites, he slew at this place the captive kings (<a href=\"#\" onClick=\"return mV('Jdg',8,'18-21');\">8:18-21</a>). He then assumed the function of high priest, and sought to make Ophrah what Shiloh should have been. This thing \"became a snare\" to Gideon and his house. After Gideon's death his family resided here till they were put to death by Abimelech (<a href=\"#\" onClick=\"return mV('Jdg',9,5);\">Jdg 9:5</a>). It is identified with Ferata.";
eastonArray["$$T0002799"] = "<strong>Oracle:</strong> In the Old Testament used in every case, except <a href=\"#\" onClick=\"return mV('2Sa',16,23);\">2Sa 16:23</a>, to denote the most holy place in the temple (<a href=\"#\" onClick=\"return mV('1Ki',6,5,'19-23');\">1Ki 6:5, 19-23</a>; <a href=\"#\" onClick=\"return mV('1Ki',8,6);\">8:6</a>). In <a href=\"#\" onClick=\"return mV('2Sa',16,23);\">2Sa 16:23</a> it means the Word of God. A man inquired \"at the oracle of God\" by means of the Urim and Thummim in the breastplate on the high priest's ephod. In the New Testament it is used only in the plural, and always denotes the Word of God (<a href=\"#\" onClick=\"return mV('Rom',3,2);\">Rom 3:2</a>; <a href=\"#\" onClick=\"return mV('Hbr',5,12);\">Hbr 5:12</a>, etc.). The Scriptures are called \"living oracles\" (<a href=\"#\" onClick=\"return mV('Hbr',4,12);\">Hbr 4:12</a>) because of their quickening power (<a href=\"#\" onClick=\"return mV('Act',7,38);\">Act 7:38</a>).";
</script>
