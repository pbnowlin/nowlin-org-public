<script>var eastonArray = new Array ();
eastonArray["$$T0002700"] = "<strong>Nehushtan:</strong> of copper; a brazen thing a name of contempt given to the serpent Moses had made in the wilderness (<a href=\"#\" onClick=\"return mV('Num',21,8);\">Num 21:8</a>), and which Hezekiah destroyed because the children of Israel began to regard it as an idol and \"burn incense to it.\" The lapse of nearly one thousand years had invested the \"brazen serpent\" with a mysterious sanctity; and in order to deliver the people from their infatuation, and impress them with the idea of its worthlessness, Hezekiah called it, in contempt, \"Nehushtan,\" a brazen thing, a mere piece of brass (<a href=\"#\" onClick=\"return mV('2Ki',18,4);\">2Ki 18:4</a>).";
eastonArray["$$T0002701"] = "<strong>Neiel:</strong> dwelling-place of God, a town in the territory of Asher, near its southern border (<a href=\"#\" onClick=\"return mV('Jos',19,27);\">Jos 19:27</a>). It has been identified with the ruin Y'anin, near the outlet of the Wady esh Sha-ghur, less than 2 miles north of Kabul, and 16 miles east of Caesarea.";
eastonArray["$$T0002702"] = "<strong>Nekeb:</strong> cavern, a town on the boundary of Naphtali (<a href=\"#\" onClick=\"return mV('Jos',19,33);\">Jos 19:33</a>). It has with probability, been identified with Seiyadeh, nearly 2 miles east of Bessum, a ruin half way between Tiberias and Mount Tabor.";
eastonArray["$$T0002703"] = "<strong>Nemuel:</strong> day of God.<br><br>(1.) One of Simeon's five sons (<a href=\"#\" onClick=\"return mV('1Ch',4,24);\">1Ch 4:24</a>), called also Jemuel (<a href=\"#\" onClick=\"return mV('Gen',46,10);\">Gen 46:10</a>).<br><br>(2.) A Reubenite, a son of Eliab, and brother of Dathan and Abiram (<a href=\"#\" onClick=\"return mV('Num',26,9);\">Num 26:9</a>).";
eastonArray["$$T0002704"] = "<strong>Nephilim:</strong> (<a href=\"#\" onClick=\"return mV('Gen',6,4);\">Gen 6:4</a>; <a href=\"#\" onClick=\"return mV('Num',13,33);\">Num 13:33</a>, R.V.), giants, the Hebrew word left untranslated by the Revisers, the name of one of the Canaanitish tribes. The Revisers have, however, translated the Hebrew gibborim, in <a href=\"#\" onClick=\"return mV('Gen',6,4);\">Gen 6:4</a>, \"mighty men.\"";
eastonArray["$$T0002705"] = "<strong>Nephtoah:</strong> opened, a fountain and a stream issuing from it on the border between Judah and Benjamin (<a href=\"#\" onClick=\"return mV('Jos',15,8,9);\">Jos 15:8-9</a>; <a href=\"#\" onClick=\"return mV('Jos',18,15);\">18:15</a>). It has been identified with 'Ain Lifta, a spring about 2 1/2 miles north-west of Jerusalem. Others, however, have identified it with 'Ain' Atan, on the south-west of Bethlehem, whence water is conveyed through \"Pilate's aqueduct\" to the Haram area at Jerusalem.";
eastonArray["$$T0002706"] = "<strong>Ner:</strong> light, the father of Kish (<a href=\"#\" onClick=\"return mV('1Ch',8,33);\">1Ch 8:33</a>). <a href=\"#\" onClick=\"return mV('1Sa',14,51);\">1Sa 14:51</a> should be read, \"Kish, the father of Saul, and Ner, the father of Abner, were the sons of Abiel.\" And hence this Kish and Ner were brothers, and Saul and Abner were first cousins (<a href=\"#\" onClick=\"return mV('1Ch',9,36);\">1Ch 9:36</a>).";
eastonArray["$$T0002707"] = "<strong>Nereus:</strong> a Christian at Rome to whom Paul sent his salutation (<a href=\"#\" onClick=\"return mV('Rom',16,15);\">Rom 16:15</a>).";
eastonArray["$$T0002708"] = "<strong>Nergal:</strong> the great dog; that is, lion, one of the chief gods of the Assyrians and Babylonians (<a href=\"#\" onClick=\"return mV('2Ki',17,30);\">2Ki 17:30</a>), the god of war and hunting. He is connected with Cutha as its tutelary deity.";
eastonArray["$$T0002709"] = "<strong>Nergal-sharezer:</strong> Nergal, protect the king!<br><br>(1.) One of the \"princes of the king of Babylon who accompanied him in his last expedition against Jerusalem\" (<a href=\"#\" onClick=\"return mV('Jer',39,3,13);\">Jer 39:3, 13</a>).<br><br>(2.) Another of the \"princes,\" who bore the title of \"Rabmag.\" He was one of those who were sent to release Jeremiah from prison (<a href=\"#\" onClick=\"return mV('Jer',39,13);\">Jer 39:13</a>) by \"the captain of the guard.\" He was a Babylonian grandee of high rank. From profane history and the inscriptions, we are led to conclude that he was the Neriglissar who murdered Evil-merodach, the son of Nebuchadnezzar, and succeeded him on the throne of Babylon (B.C. 559-556). He was married to a daughter of Nebuchadnezzar. The ruins of a palace, the only one on the right bank of the Euphrates, bear inscriptions denoting that it was built by this king. He was succeeded by his son, a mere boy, who was murdered after a reign of some nine months by a conspiracy of the nobles, one of whom, Nabonadius, ascended the vacant throne, and reigned for a period of seventeen years (B.C. 555-538), at the close of which period Babylon was taken by Cyrus. Belshazzar, who comes into notice in connection with the taking of Babylon, was by some supposed to have been the same as Nabonadius, who was called Nebuchadnezzar's son (<a href=\"#\" onClick=\"return mV('Dan',5,11,18,22);\">Dan 5:11, 18, 22</a>), because he had married his daughter. But it is known from the inscriptions that Nabonadius had a son called Belshazzar, who may have been his father's associate on the throne at the time of the fall of Babylon, and who therefore would be the grandson of Nebuchadnezzar. The Jews had only one word, usually rendered \"father,\" to represent also such a relationship as that of \"grandfather\" or \"great-grandfather.\"";
eastonArray["$$T0002710"] = "<strong>Nero:</strong> occurs only in the superscription (which is probably spurious, and is altogether omitted in the R.V.) to the Second Epistle to Timothy. He became emperor of Rome when he was about seventeen years of age (A.D. 54), and soon began to exhibit the character of a cruel tyrant and heathen debauchee. In May A.D. 64, a terrible conflagration broke out in Rome, which raged for six days and seven nights, and totally destroyed a great part of the city. The guilt of this fire was attached to him at the time, and the general verdict of history accuses him of the crime. \"Hence, to suppress the rumour,\" says Tacitus (Annals, xv. 44), \"he falsely charged with the guilt, and punished with the most exquisite tortures, the persons commonly called Christians, who are hated for their enormities. Christus, the founder of that name, was put to death as a criminal by Pontius Pilate, procurator of Judea, in the reign of Tiberius; but the pernicious superstition, repressed for a time, broke out again, not only throughout Judea, where the mischief originated, but through the city of Rome also, whither all things horrible and disgraceful flow, from all quarters, as to a common receptacle, and where they are encouraged. Accordingly, first three were seized, who confessed they were Christians. Next, on their information, a vast multitude were convicted, not so much on the charge of burning the city as of hating the human race. And in their deaths they were also made the subjects of sport; for they were covered with the hides of wild beasts and worried to death by dogs, or nailed to crosses, or set fire to, and, when day declined, burned to serve for nocturnal lights. Nero offered his own gardens for that spectacle, and exhibited a Circensian game, indiscriminately mingling with the common people in the habit of a charioteer, or else standing in his chariot; whence a feeling of compassion arose toward the sufferers, though guilty and deserving to be made examples of by capital punishment, because they seemed not to be cut off for the public good, but victims to the ferocity of one man.\" Another Roman historian, Suetonius (Nero, xvi.), says of him: \"He likewise inflicted punishments on the Christians, a sort of people who hold a new and impious superstition\" (Forbes's Footsteps of St. Paul, p. 60).<br><br>Nero was the emperor before whom Paul was brought on his first imprisonment at Rome, and the apostle is supposed to have suffered martyrdom during this persecution. He is repeatedly alluded to in Scripture (<a href=\"#\" onClick=\"return mV('Act',25,11);\">Act 25:11</a>; <a href=\"#\" onClick=\"return mV('Phl',1,12,13);\">Phl 1:12-13</a>; <a href=\"#\" onClick=\"return mV('Phl',4,22);\">4:22</a>). He died A.D. 68.";
eastonArray["$$T0002711"] = "<strong>Net:</strong> in use among the Hebrews for fishing, hunting, and fowling. The fishing-net was probably constructed after the form of that used by the Egyptians (<a href=\"#\" onClick=\"return mV('Isa',19,8);\">Isa 19:8</a>). There were three kinds of nets.<br><br>(1.) The drag-net or hauling-net (Gr. sagene), of great size, and requiring many men to work it. It was usually let down from the fishing-boat, and then drawn to the shore or into the boat, as circumstances might require (<a href=\"#\" onClick=\"return mV('Mat',13,47,48);\">Mat 13:47-48</a>).<br><br>(2.) The hand-net or casting-net (Gr. amphiblestron), which was thrown from a rock or a boat at any fish that might be seen (<a href=\"#\" onClick=\"return mV('Mat',4,18);\">Mat 4:18</a>; <a href=\"#\" onClick=\"return mV('Mar',1,16);\">Mar 1:16</a>). It was called by the Latins funda. It was of circular form, \"like the top of a tent.\"<br><br>(3.) The bag-net (Gr. diktyon), used for enclosing fish in deep water (<a href=\"#\" onClick=\"return mV('Luk',5,'4-9');\">Luk 5:4-9</a>).<br><br>The fowling-nets were<br><br>(1) the trap, consisting of a net spread over a frame, and supported by a stick in such a way that it fell with the slightest touch (<a href=\"#\" onClick=\"return mV('Amo',3,5);\">Amo 3:5</a>, \"gin; <a href=\"#\" onClick=\"return mV('Psa',69,22);\">Psa 69:22</a>; <a href=\"#\" onClick=\"return mV('Job',18,9);\">Job 18:9</a>; <a href=\"#\" onClick=\"return mV('Ecc',9,12);\">Ecc 9:12</a>).<br><br>(2) The snare, consisting of a cord to catch birds by the leg (<a href=\"#\" onClick=\"return mV('Job',18,10);\">Job 18:10</a>; <a href=\"#\" onClick=\"return mV('Psa',18,5);\">Psa 18:5</a>; <a href=\"#\" onClick=\"return mV('Psa',116,3);\">116:3</a>; <a href=\"#\" onClick=\"return mV('Psa',140,5);\">140:5</a>).<br><br>(3.) The decoy, a cage filled with birds as decoys (<a href=\"#\" onClick=\"return mV('Jer',5,26,27);\">Jer 5:26-27</a>). Hunting-nets were much in use among the Hebrews.";
eastonArray["$$T0002712"] = "<strong>Nethaneel:</strong> given of God.<br><br>(1.) The son of Zuar, chief of the tribe of Issachar at the Exodus (<a href=\"#\" onClick=\"return mV('Num',1,8);\">Num 1:8</a>; <a href=\"#\" onClick=\"return mV('Num',2,5);\">2:5</a>).<br><br>(2.) One of David's brothers (<a href=\"#\" onClick=\"return mV('1Ch',2,14);\">1Ch 2:14</a>).<br><br>(3.) A priest who blew the trumpet before the ark when it was brought up to Jerusalem (<a href=\"#\" onClick=\"return mV('1Ch',15,24);\">1Ch 15:24</a>).<br><br>(4.) A Levite (<a href=\"#\" onClick=\"return mV('1Ch',24,6);\">1Ch 24:6</a>).<br><br>(5.) A temple porter, of the family of the Korhites (<a href=\"#\" onClick=\"return mV('1Ch',26,4);\">1Ch 26:4</a>).<br><br>(6.) One of the \"princes\" appointed by Jehoshaphat to teach the law through the cities of Judah (<a href=\"#\" onClick=\"return mV('2Ch',17,7);\">2Ch 17:7</a>).<br><br>(7.) A chief Levite in the time of Josiah (<a href=\"#\" onClick=\"return mV('2Ch',35,9);\">2Ch 35:9</a>).<br><br>(8.) <a href=\"#\" onClick=\"return mV('Ezr',10,22);\">Ezr 10:22</a>.<br><br>(9.) <a href=\"#\" onClick=\"return mV('Neh',12,21);\">Neh 12:21</a>.<br><br>(10.) A priest's son who bore a trumpet at the dedication of the walls of Jerusalem (<a href=\"#\" onClick=\"return mV('Neh',12,36);\">Neh 12:36</a>).";
eastonArray["$$T0002713"] = "<strong>Nethaniah:</strong> given of Jehovah.<br><br>(1.) One of Asaph's sons, appointed by David to minister in the temple (<a href=\"#\" onClick=\"return mV('1Ch',25,2,12);\">1Ch 25:2, 12</a>).<br><br>(2.) A Levite sent by Jehoshaphat to teach the law (<a href=\"#\" onClick=\"return mV('2Ch',17,8);\">2Ch 17:8</a>).<br><br>(3.) <a href=\"#\" onClick=\"return mV('Jer',36,14);\">Jer 36:14</a>.<br><br>(4.) <a href=\"#\" onClick=\"return mV('2Ki',25,23,25);\">2Ki 25:23, 25</a>.";
eastonArray["$$T0002714"] = "<strong>Nethinim:</strong> the name given to the hereditary temple servants in all the post-Exilian books of Scripture. The word means given, i.e., \"those set apart\", viz., to the menial work of the sanctuary for the Levites. The name occurs seventeen times, and in each case in the Authorized Version incorrectly terminates in \"s\", \"Nethinims;\" in the Revised Version, correctly without the \"s\" (<a href=\"#\" onClick=\"return mV('Ezr',2,70);\">Ezr 2:70</a>; <a href=\"#\" onClick=\"return mV('Ezr',7,7,24);\">7:7, 24</a>; <a href=\"#\" onClick=\"return mV('Ezr',8,20);\">8:20</a>, etc.). The tradition is that the Gibeonites (<a href=\"#\" onClick=\"return mV('Jos',9,27);\">Jos 9:27</a>) were the original caste, afterwards called Nethinim. Their numbers were added to afterwards from captives taken in battle; and they were formally given by David to the Levites (<a href=\"#\" onClick=\"return mV('Ezr',8,20);\">Ezr 8:20</a>), and so were called Nethinim, i.e., the given ones, given to the Levites to be their servants. Only 612 Nethinim returned from Babylon (<a href=\"#\" onClick=\"return mV('Ezr',2,58);\">Ezr 2:58</a>; <a href=\"#\" onClick=\"return mV('Ezr',8,20);\">8:20</a>). They were under the control of a chief from among themselves (<a href=\"#\" onClick=\"return mV('Ezr',2,43);\">2:43</a>; <a href=\"#\" onClick=\"return mV('Neh',7,46);\">Neh 7:46</a>). No reference to them appears in the New Testament, because it is probable that they became merged in the general body of the Jewish people.";
eastonArray["$$T0002715"] = "<strong>Netophah:</strong> distillation; dropping, a town in Judah, in the neighbourhood, probably, of Bethlehem (<a href=\"#\" onClick=\"return mV('Neh',7,26);\">Neh 7:26</a>; <a href=\"#\" onClick=\"return mV('1Ch',2,54);\">1Ch 2:54</a>). Two of David's guards were Netophathites (<a href=\"#\" onClick=\"return mV('1Ch',27,13,15);\">1Ch 27:13, 15</a>). It has been identified with the ruins of Metoba, or Um Toba, to the north-east of Bethlehem.";
eastonArray["$$T0002716"] = "<strong>Nettle:</strong><br><br>(1.) Heb. haral, \"pricking\" or \"burning,\" <a href=\"#\" onClick=\"return mV('Pro',24,30,31);\">Pro 24:30-31</a> (R.V. marg., \"wild vetches\"); <a href=\"#\" onClick=\"return mV('Job',30,7);\">Job 30:7</a>; <a href=\"#\" onClick=\"return mV('Zep',2,9);\">Zep 2:9</a>. Many have supposed that some thorny or prickly plant is intended by this word, such as the bramble, the thistle, the wild plum, the cactus or prickly pear, etc. It may probably be a species of mustard, the <i>Sinapis arvensis</i>, which is a pernicious weed abounding in corn-fields. Tristram thinks that this word \"designates the prickly acanthus (<i>Acanthus spinosus</i>), a very common and troublesome weed in the plains of Palestine.\"<br><br>(2.) Heb. qimmosh, <a href=\"#\" onClick=\"return mV('Isa',34,13);\">Isa 34:13</a>; <a href=\"#\" onClick=\"return mV('Hsa',9,6);\">Hsa 9:6</a>; <a href=\"#\" onClick=\"return mV('Pro',24,31);\">Pro 24:31</a> (in both versions, \"thorns\"). This word has been regarded as denoting thorns, thistles, wild camomile; but probably it is correctly rendered \"nettle,\" the <i>Urtica pilulifera</i>, \"a tall and vigorous plant, often 6 feet high, the sting of which is much more severe and irritating than that of our common nettle.\"";
eastonArray["$$T0002717"] = "<strong>New Moon, Feast of:</strong> Special services were appointed for the commencement of a month (<a href=\"#\" onClick=\"return mV('Num',28,'11-15');\">Num 28:11-15</a>; <a href=\"#\" onClick=\"return mV('Num',10,10);\">10:10</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001325');\">FESTIVALS</a>.)";
eastonArray["$$T0002718"] = "<strong>New Testament:</strong> (<a href=\"#\" onClick=\"return mV('Luk',22,20);\">Luk 22:20</a>), rather \"New Covenant,\" in contrast to the old covenant of works, which is superseded. \"The covenant of grace is called new; it succeeds to the old broken covenant of works. It is ever fresh, flourishing, and excellent; and under the gospel it is dispensed in a more clear, spiritual, extensive, and powerful manner than of old\" (Brown of Haddington). Hence is derived the name given to the latter portion of the Bible. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003623');\">TESTAMENT</a>.)";
eastonArray["$$T0002719"] = "<strong>Neziah:</strong> victory; pure, <a href=\"#\" onClick=\"return mV('Ezr',2,54);\">Ezr 2:54</a>; <a href=\"#\" onClick=\"return mV('Neh',7,56);\">Neh 7:56</a>.";
eastonArray["$$T0002720"] = "<strong>Nezib:</strong> a town in the \"plain\" of Judah. It has been identified with Beit Nuzib, about 14 miles south-west of Jerusalem, in the Wady Sur (<a href=\"#\" onClick=\"return mV('Jos',15,43);\">Jos 15:43</a>).";
eastonArray["$$T0002721"] = "<strong>Nibhaz:</strong> barker, the name of an idol, supposed to be an evil demon of the Zabians. It was set up in Samaria by the Avites (<a href=\"#\" onClick=\"return mV('2Ki',17,31);\">2Ki 17:31</a>), probably in the form of a dog.";
eastonArray["$$T0002722"] = "<strong>Nibshan:</strong> fertile; light soil, a city somewhere \"in the wilderness\" of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,62);\">Jos 15:62</a>), probably near Engedi.";
eastonArray["$$T0002723"] = "<strong>Nicanor:</strong> conqueror, one of the seven deacons appointed in the apostolic Church (<a href=\"#\" onClick=\"return mV('Act',6,'1-6');\">Act 6:1-6</a>). Nothing further is known of him.";
eastonArray["$$T0002724"] = "<strong>Nicodemus:</strong> the people is victor, a Pharisee and a member of the Sanhedrin. He is first noticed as visiting Jesus by night (<a href=\"#\" onClick=\"return mV('Jhn',3,'1-21');\">Jhn 3:1-21</a>) for the purpose of learning more of his doctrines, which our Lord then unfolded to him, giving prominence to the necessity of being \"born again.\" He is next met with in the Sanhedrin (<a href=\"#\" onClick=\"return mV('Jhn',7,'50-52');\">7:50-52</a>), where he protested against the course they were taking in plotting against Christ. Once more he is mentioned as taking part in the preparation for the anointing and burial of the body of Christ (<a href=\"#\" onClick=\"return mV('Jhn',19,39);\">Jhn 19:39</a>). We hear nothing more of him. There can be little doubt that he became a true disciple.";
eastonArray["$$T0002725"] = "<strong>Nicolaitanes:</strong> The church at Ephesus (<a href=\"#\" onClick=\"return mV('Rev',2,6);\">Rev 2:6</a>) is commended for hating the \"deeds\" of the Nicolaitanes, and the church of Pergamos is blamed for having them who hold their \"doctrines\" (<a href=\"#\" onClick=\"return mV('Rev',2,15);\">15</a>). They were seemingly a class of professing Christians, who sought to introduce into the church a false freedom or licentiousness, thus abusing Paul's doctrine of grace (<a href=\"#\" onClick=\"return mV('2Pe',2,15,16,19);\">2Pe 2:15-16, 19</a>), and were probably identical with those who held the doctrine of Baalam (q.v.), <a href=\"#\" onClick=\"return mV('Rev',2,14);\">Rev 2:14</a>.";
eastonArray["$$T0002726"] = "<strong>Nicolas:</strong> the victory of the people, a proselyte of Antioch, one of the seven deacons (<a href=\"#\" onClick=\"return mV('Act',6,5);\">Act 6:5</a>).";
eastonArray["$$T0002727"] = "<strong>Nicopolis:</strong> city of victory, where Paul intended to winter (<a href=\"#\" onClick=\"return mV('Tts',3,12);\">Tts 3:12</a>). There were several cities of this name. The one here referred to was most probably that in Epirus, which was built by Augustus Caesar to commemorate his victory at the battle of Actium (B.C. 31). It is the modern Paleoprevesa, i.e., \"Old Prevesa.\" The subscription to the epistle to Titus calls it \"Nicopolis of Macedonia\", i.e., of Thrace. This is, however, probably incorrect.";
eastonArray["$$T0002728"] = "<strong>Niger:</strong> black, a surname of Simeon (<a href=\"#\" onClick=\"return mV('Act',13,1);\">Act 13:1</a>). He was probably so called from his dark complexion.";
eastonArray["$$T0002729"] = "<strong>Night-hawk:</strong> (Heb. tahmas) occurs only in the list of unclean birds (<a href=\"#\" onClick=\"return mV('Lev',11,16);\">Lev 11:16</a>; <a href=\"#\" onClick=\"return mV('Deu',14,15);\">Deu 14:15</a>). This was supposed to be the night-jar (Caprimulgus), allied to the swifts. The Hebrew word is derived from a root meaning \"to scratch or tear the face,\" and may be best rendered, in accordance with the ancient versions, \"an owl\" (<i>Strix flammea</i>). The Revised Version renders \"night-hawk.\"";
eastonArray["$$T0002730"] = "<strong>Nile:</strong> dark; blue, not found in Scripture, but frequently referred to in the Old Testament under the name of Sihor, i.e., \"the black stream\" (<a href=\"#\" onClick=\"return mV('Isa',23,3);\">Isa 23:3</a>; <a href=\"#\" onClick=\"return mV('Jer',2,18);\">Jer 2:18</a>) or simply \"the river\" (<a href=\"#\" onClick=\"return mV('Gen',41,1);\">Gen 41:1</a>; <a href=\"#\" onClick=\"return mV('Exd',1,22);\">Exd 1:22</a>, etc.) and the \"flood of Egypt\" (<a href=\"#\" onClick=\"return mV('Amo',8,8);\">Amo 8:8</a>). It consists of two rivers, the White Nile, which takes its rise in the Victoria Nyanza, and the Blue Nile, which rises in the Abyssinian Mountains. These unite at the town of Khartoum, whence it pursues its course for 1,800 miles, and falls into the Mediterranean through its two branches, into which it is divided a few miles north of Cairo, the Rosetta and the Damietta branch. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001137');\">EGYPT</a>.)";
eastonArray["$$T0002731"] = "<strong>Nimrah:</strong> pure, a city on the east of Jordan (<a href=\"#\" onClick=\"return mV('Num',32,3);\">Num 32:3</a>); probably the same as Beth-nimrah (<a href=\"#\" onClick=\"return mV('Jos',13,27);\">Jos 13:27</a>). It has been identified with the Nahr Nimrin, at one of the fords of Jordan, not far from Jericho.";
eastonArray["$$T0002732"] = "<strong>Nimrim, Waters of:</strong> the stream of the leopards, a stream in Moab (<a href=\"#\" onClick=\"return mV('Isa',15,6);\">Isa 15:6</a>; <a href=\"#\" onClick=\"return mV('Jer',48,34);\">Jer 48:34</a>); probably the modern Wady en-Nemeirah, a rich, verdant spot at the south-eastern end of the Dead Sea.";
eastonArray["$$T0002733"] = "<strong>Nimrod:</strong> firm, a descendant of Cush, the son of Ham. He was the first who claimed to be a \"mighty one in the earth.\" Babel was the beginning of his kingdom, which he gradually enlarged (<a href=\"#\" onClick=\"return mV('Gen',10,'8-10');\">Gen 10:8-10</a>). The \"land of Nimrod\" (<a href=\"#\" onClick=\"return mV('Mic',5,6);\">Mic 5:6</a>) is a designation of Assyria or of Shinar, which is a part of it.";
eastonArray["$$T0002734"] = "<strong>Nimshi:</strong> saved. Jehu was \"the son of Jehoshaphat, the son of Nimshi\" (<a href=\"#\" onClick=\"return mV('2Ki',9,2);\">2Ki 9:2</a>; <a href=\"#\" onClick=\"return mV('1Ki',19,16);\">1Ki 19:16</a>).";
eastonArray["$$T0002735"] = "<strong>Nineveh:</strong> First mentioned in <a href=\"#\" onClick=\"return mV('Gen',10,11);\">Gen 10:11</a>, which is rendered in the Revised Version, \"He [i.e., Nimrod] went forth into Assyria and builded Nineveh.\" It is not again noticed till the days of Jonah, when it is described (<a href=\"#\" onClick=\"return mV('Jon',3,3);\">Jon 3:3</a>; <a href=\"#\" onClick=\"return mV('Jon',4,11);\">4:11</a>) as a great and populous city, the flourishing capital of the Assyrian empire (<a href=\"#\" onClick=\"return mV('2Ki',19,36);\">2Ki 19:36</a>; <a href=\"#\" onClick=\"return mV('Isa',37,37);\">Isa 37:37</a>). The book of the prophet Nahum is almost exclusively taken up with prophetic denunciations against this city. Its ruin and utter desolation are foretold (<a href=\"#\" onClick=\"return mV('Nah',1,14);\">Nah 1:14</a>; <a href=\"#\" onClick=\"return mV('Nah',3,19);\">3:19</a>, etc.). Zephaniah also (<a href=\"#\" onClick=\"return mV('Zep',2,'13-15');\">Zep 2:13-15</a>) predicts its destruction along with the fall of the empire of which it was the capital. From this time there is no mention of it in Scripture till it is named in gospel history (<a href=\"#\" onClick=\"return mV('Mat',12,41);\">Mat 12:41</a>; <a href=\"#\" onClick=\"return mV('Luk',11,32);\">Luk 11:32</a>).<br><br>This \"exceeding great city\" lay on the eastern or left bank of the river Tigris, along which it stretched for some 30 miles, having an average breadth of 10 miles or more from the river back toward the eastern hills. This whole extensive space is now one immense area of ruins. Occupying a central position on the great highway between the Mediterranean and the Indian Ocean, thus uniting the East and the West, wealth flowed into it from many sources, so that it became the greatest of all ancient cities.<br><br>About B.C. 633 the Assyrian empire began to show signs of weakness, and Nineveh was attacked by the Medes, who subsequently, about B.C. 625, being joined by the Babylonians and Susianians, again attacked it, when it fell, and was razed to the ground. The Assyrian empire then came to an end, the Medes and Babylonians dividing its provinces between them. \"After having ruled for more than six hundred years with hideous tyranny and violence, from the Caucasus and the Caspian to the Persian Gulf, and from beyond the Tigris to Asia Minor and Egypt, it vanished like a dream\" (<a href=\"#\" onClick=\"return mV('Nah',2,'6-11');\">Nah 2:6-11</a>). Its end was strange, sudden, tragic. It was God's doing, his judgement on Assyria's pride (<a href=\"#\" onClick=\"return mV('Isa',10,'5-19');\">Isa 10:5-19</a>).<br><br>Forty years ago our knowledge of the great Assyrian empire and of its magnificent capital was almost wholly a blank. Vague memories had indeed survived of its power and greatness, but very little was definitely known about it. Other cities which had perished, as Palmyra, Persepolis, and Thebes, had left ruins to mark their sites and tell of their former greatness; but of this city, imperial Nineveh, not a single vestige seemed to remain, and the very place on which it had stood was only matter of conjecture. In fulfilment of prophecy, God made \"an utter end of the place.\" It became a \"desolation.\"<br><br>In the days of the Greek historian Herodotus, B.C. 400, it had become a thing of the past; and when Xenophon the historian passed the place in the \"Retreat of the Ten Thousand,\" the very memory of its name had been lost. It was buried out of sight, and no one knew its grave. It is never again to rise from its ruins.<br><br>At length, after being lost for more than two thousand years, the city was disentombed. A little more than forty years ago the French consul at Mosul began to search the vast mounds that lay along the opposite bank of the river. The Arabs whom he employed in these excavations, to their great surprise, came upon the ruins of a building at the mound of Khorsabad, which, on further exploration, turned out to be the royal palace of Sargon, one of the Assyrian kings. They found their way into its extensive courts and chambers, and brought forth from its hidden depths many wonderful sculptures and other relics of those ancient times.<br><br>The work of exploration has been carried on almost continuously by M. Botta, Sir Henry Layard, George Smith, and others, in the mounds of Nebi-Yunus, Nimrud, Koyunjik, and Khorsabad, and a vast treasury of specimens of old Assyrian art has been exhumed. Palace after palace has been discovered, with their decorations and their sculptured slabs, revealing the life and manners of this ancient people, their arts of war and peace, the forms of their religion, the style of their architecture, and the magnificence of their monarchs. The streets of the city have been explored, the inscriptions on the bricks and tablets and sculptured figures have been read, and now the secrets of their history have been brought to light.<br><br>One of the most remarkable of recent discoveries is that of the library of King Assur-bani-pal, or, as the Greek historians call him, Sardanapalos, the grandson of Sennacherib (q.v.). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000347');\">ASNAPPER</a>.) This library consists of about ten thousand flat bricks or tablets, all written over with Assyrian characters. They contain a record of the history, the laws, and the religion of Assyria, of the greatest value. These strange clay leaves found in the royal library form the most valuable of all the treasuries of the literature of the old world. The library contains also old Accadian documents, which are the oldest extant documents in the world, dating as far back as probably about the time of Abraham. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003227');\">SARGON</a>.)<br><br>\"The Assyrian royalty is, perhaps, the most luxurious of our century [reign of Assur-bani-pa]...Its victories and conquests, uninterrupted for one hundred years, have enriched it with the spoil of twenty peoples. Sargon has taken what remained to the Hittites; Sennacherib overcame Chaldea, and the treasures of Babylon were transferred to his coffers; Esarhaddon and Assur-bani-pal himself have pillaged Egypt and her great cities, Sais, Memphis, and Thebes of the hundred gates...Now foreign merchants flock into Nineveh, bringing with them the most valuable productions from all countries, gold and perfume from South Arabia and the Chaldean Sea, Egyptian linen and glass-work, carved enamels, goldsmiths' work, tin, silver, Phoenician purple; cedar wood from Lebanon, unassailable by worms; furs and iron from Asia Minor and Armenia\" (Ancient Egypt and Assyria, by G. Maspero, page 271).<br><br>The bas-reliefs, alabaster slabs, and sculptured monuments found in these recovered palaces serve in a remarkable manner to confirm the Old Testament history of the kings of Israel. The appearance of the ruins shows that the destruction of the city was due not only to the assailing foe but also to the flood and the fire, thus confirming the ancient prophecies concerning it. \"The recent excavations,\" says Rawlinson, \"have shown that fire was a great instrument in the destruction of the Nineveh palaces. Calcined alabaster, charred wood, and charcoal, colossal statues split through with heat, are met with in parts of the Nineveh mounds, and attest the veracity of prophecy.\"<br><br>Nineveh in its glory was (<a href=\"#\" onClick=\"return mV('Jon',3,4);\">Jon 3:4</a>) an \"exceeding great city of three days' journey\", i.e., probably in circuit. This would give a circumference of about 60 miles. At the four corners of an irregular quadrangle are the ruins of Kouyunjik, Nimrud, Karamless and Khorsabad. These four great masses of ruins, with the whole area included within the parallelogram they form by lines drawn from the one to the other, are generally regarded as composing the whole ruins of Nineveh.";
eastonArray["$$T0002736"] = "<strong>Nisan:</strong> month of flowers, (<a href=\"#\" onClick=\"return mV('Neh',2,1);\">Neh 2:1</a>) the first month of the Jewish sacred year. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000026');\">ABIB</a>.) Assyrian nisannu, \"beginning.\"";
eastonArray["$$T0002737"] = "<strong>Nisroch:</strong> probably connected with the Hebrew word <i>nesher</i>, an eagle. An Assyrian god, supposed to be that represented with the head of an eagle. Sennacherib was killed in the temple of this idol (<a href=\"#\" onClick=\"return mV('2Ki',19,37);\">2Ki 19:37</a>; <a href=\"#\" onClick=\"return mV('Isa',37,38);\">Isa 37:38</a>).";
eastonArray["$$T0002738"] = "<strong>Nitre:</strong> (<a href=\"#\" onClick=\"return mV('Pro',25,20);\">Pro 25:20</a>; R.V. marg., \"soda\"), properly \"natron,\" a substance so called because, rising from the bottom of the Lake Natron in Egypt, it becomes dry and hard in the sun, and is the soda which effervesces when vinegar is poured on it. It is a carbonate of soda, not saltpetre, which the word generally denotes (<a href=\"#\" onClick=\"return mV('Jer',2,22);\">Jer 2:22</a>; R.V. \"lye\").";
eastonArray["$$T0002739"] = "<strong>No:</strong> or No-A'mon, the home of Amon, the name of Thebes, the ancient capital of what is called the Middle Empire, in Upper or Southern Egypt. \"The multitude of No\" (<a href=\"#\" onClick=\"return mV('Jer',46,25);\">Jer 46:25</a>) is more correctly rendered, as in the Revised Version, \"Amon of No\", i.e., No, where Jupiter Amon had his temple. In <a href=\"#\" onClick=\"return mV('Eze',30,14,16);\">Eze 30:14, 16</a> it is simply called \"No;\" but in ver. <a href=\"#\" onClick=\"return mV('Eze',30,15);\">15</a> the name has the Hebrew Hamon prefixed to it, \"Hamon No.\" This prefix is probably the name simply of the god usually styled Amon or Ammon. In <a href=\"#\" onClick=\"return mV('Nah',3,8);\">Nah 3:8</a> the \"populous No\" of the Authorized Version is in the Revised Version correctly rendered \"No-Amon.\"<br><br>It was the Diospolis or Thebes of the Greeks, celebrated for its hundred gates and its vast population. It stood on both sides of the Nile, and is by some supposed to have included Karnak and Luxor. In grandeur and extent it can only be compared to Nineveh. It is mentioned only in the prophecies referred to, which point to its total destruction. It was first taken by the Assyrians in the time of Sargon (In <a href=\"#\" onClick=\"return mV('Isa',20,'1-')\">Isa 20</a>). It was afterwards \"delivered into the hand\" of Nebuchadnezzar and Assurbani-pal (<a href=\"#\" onClick=\"return mV('Jer',46,25,26);\">Jer 46:25-26</a>). Cambyses, king of the Persians (B.C. 525), further laid it waste by fire. Its ruin was completed (B.C. 81) by Ptolemy Lathyrus. The ruins of this city are still among the most notable in the valley of the Nile. They have formed a great storehouse of interesting historic remains for more than two thousand years. \"As I wandered day after day with ever-growing amazement amongst these relics of ancient magnificence, I felt that if all the ruins in Europe, classical, Celtic, and medieval, were brought together into one centre, they would fall far short both in extent and grandeur of those of this single Egyptian city.\" Manning, The Land of the Pharaohs.";
eastonArray["$$T0002740"] = "<strong>Noadiah:</strong> meeting with the Lord.<br><br>(1.) A Levite who returned from Babylon (<a href=\"#\" onClick=\"return mV('Ezr',8,33);\">Ezr 8:33</a>).<br><br>(2.) A false prophetess who assisted Tobiah and Sanballat against the Jews (<a href=\"#\" onClick=\"return mV('Neh',6,14);\">Neh 6:14</a>). Being bribed by them, she tried to stir up discontent among the inhabitants of Jerusalem, and so to embarrass Nehemiah in his great work of rebuilding the ruined walls of the city.";
eastonArray["$$T0002741"] = "<strong>Noah:</strong> rest, (Heb. Noah) the grandson of Methuselah (<a href=\"#\" onClick=\"return mV('Gen',5,'25-29');\">Gen 5:25-29</a>), who was for two hundred and fifty years contemporary with Adam, and the son of Lamech, who was about fifty years old at the time of Adam's death. This patriarch is rightly regarded as the connecting link between the old and the new world. He is the second great progenitor of the human family.<br><br>The words of his father Lamech at his birth (<a href=\"#\" onClick=\"return mV('Gen',5,29);\">Gen 5:29</a>) have been regarded as in a sense prophetical, designating Noah as a type of Him who is the true \"rest and comfort\" of men under the burden of life (<a href=\"#\" onClick=\"return mV('Mat',11,28);\">Mat 11:28</a>).<br><br>He lived five hundred years, and then there were born unto him three sons, Shem, Ham, and Japheth (<a href=\"#\" onClick=\"return mV('Gen',5,32);\">Gen 5:32</a>). He was a \"just man and perfect in his generations,\" and \"walked with God\" (<a href=\"#\" onClick=\"return mV('Eze',14,14,20);\">Eze 14:14, 20</a>). But now the descendants of Cain and of Seth began to intermarry, and then there sprang up a race distinguished for their ungodliness. Men became more and more corrupt, and God determined to sweep the earth of its wicked population (<a href=\"#\" onClick=\"return mV('Gen',6,7);\">Gen 6:7</a>). But with Noah, God entered into a covenant, with a promise of deliverance from the threatened deluge (<a href=\"#\" onClick=\"return mV('Gen',6,18);\">18</a>). He was accordingly commanded to build an ark (<a href=\"#\" onClick=\"return mV('Gen',6,'14-16');\">6:14-16</a>) for the saving of himself and his house. An interval of one hundred and twenty years elapsed while the ark was being built (<a href=\"#\" onClick=\"return mV('Gen',6,3);\">6:3</a>), during which Noah bore constant testimony against the unbelief and wickedness of that generation (<a href=\"#\" onClick=\"return mV('1Pe',3,'18-20');\">1Pe 3:18-20</a>; <a href=\"#\" onClick=\"return mV('2Pe',2,5);\">2Pe 2:5</a>).<br><br>When the ark of \"gopher-wood\" (mentioned only here) was at length completed according to the command of the Lord, the living creatures that were to be preserved entered into it; and then Noah and his wife and sons and daughters-in-law entered it, and the \"Lord shut him in\" (<a href=\"#\" onClick=\"return mV('Gen',7,16);\">Gen 7:16</a>). The judgment-threatened now fell on the guilty world, \"the world that then was, being overflowed with water, perished\" (<a href=\"#\" onClick=\"return mV('2Pe',3,6);\">2Pe 3:6</a>). The ark floated on the waters for one hundred and fifty days, and then rested on the mountains of Ararat (<a href=\"#\" onClick=\"return mV('Gen',8,3,4);\">Gen 8:3-4</a>); but not for a considerable time after this was divine permission given him to leave the ark, so that he and his family were a whole year shut up within it (Gen 8:6-14).<br><br>On leaving the ark Noah's first act was to erect an altar, the first of which there is any mention, and offer the sacrifices of adoring thanks and praise to God, who entered into a covenant with him, the first covenant between God and man, granting him possession of the earth by a new and special charter, which remains in force to the present time (<a href=\"#\" onClick=\"return mV('Gen',8,'21-');\">Gen 8:21</a>-<a href=\"#\" onClick=\"return mV('Gen',9,'1-17');\">9:17</a>). As a sign and witness of this covenant, the rainbow was adopted and set apart by God, as a sure pledge that never again would the earth be destroyed by a flood.<br><br>But, alas! Noah after this fell into grievous sin (<a href=\"#\" onClick=\"return mV('Gen',9,21);\">Gen 9:21</a>); and the conduct of Ham on this sad occasion led to the memorable prediction regarding his three sons and their descendants. Noah \"lived after the flood three hundred and fifty years, and he died\" (<a href=\"#\" onClick=\"return mV('Gen',28,29);\">28:29</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001011');\">DELUGE</a>).<br><br>Noah, motion, (Heb. No'ah) one of the five daughters of Zelophehad (<a href=\"#\" onClick=\"return mV('Num',26,33);\">Num 26:33</a>; <a href=\"#\" onClick=\"return mV('Num',27,1);\">27:1</a>; <a href=\"#\" onClick=\"return mV('Num',36,11);\">36:11</a>; <a href=\"#\" onClick=\"return mV('Jos',17,3);\">Jos 17:3</a>).";
eastonArray["$$T0002742"] = "<strong>Nob:</strong> high place, a city of the priests, first mentioned in the history of David's wanderings (<a href=\"#\" onClick=\"return mV('1Sa',21,1);\">1Sa 21:1</a>). Here the tabernacle was then standing, and here Ahimelech the priest resided. (See  <a href=\"#\" onClick=\"return doDictLookup('ET0000143');\">AHIMELECH</a>.) From <a href=\"#\" onClick=\"return mV('Isa',10,'28-32');\">Isa 10:28-32</a> it seems to have been near Jerusalem. It has been identified by some with el-Isawiyeh, one mile and a half to the north-east of Jerusalem. But according to <a href=\"#\" onClick=\"return mV('Isa',10,'28-32');\">Isa 10:28-32</a> it was on the south of Geba, on the road to Jerusalem, and within sight of the city. This identification does not meet these conditions, and hence others (as Dean Stanley) think that it was the northern summit of Mount Olivet, the place where David \"worshipped God\" when fleeing from Absalom (<a href=\"#\" onClick=\"return mV('2Sa',15,32);\">2Sa 15:32</a>), or more probably (Conder) that it was the same as Mizpeh (q.v.), <a href=\"#\" onClick=\"return mV('Jdg',20,1);\">Jdg 20:1</a>; <a href=\"#\" onClick=\"return mV('Jos',18,26);\">Jos 18:26</a>; <a href=\"#\" onClick=\"return mV('1Sa',7,16);\">1Sa 7:16</a>, at Nebi Samwil, about 5 miles north-west of Jerusalem.<br><br>After being supplied with the sacred loaves of showbread, and girding on the sword of Goliath, which was brought forth from behind the ephod, David fled from Nob and sought refuge at the court of Achish, the king of Gath, where he was cast into prison. (Comp. titles of <a href=\"#\" onClick=\"return mV('Psa',34,'1-');\">Psa. 34</a> and <a href=\"#\" onClick=\"return mV('Psa',56,'1-');\">56</a>.)";
eastonArray["$$T0002743"] = "<strong>Nobah:</strong> howling.<br><br>(1.) <a href=\"#\" onClick=\"return mV('Num',32,42);\">Num 32:42</a>.<br><br>(2.) The name given to Kenath (q.v.) by Nobah when he conquered it. It was on the east of Gilead (<a href=\"#\" onClick=\"return mV('Jdg',8,11);\">Jdg 8:11</a>).";
eastonArray["$$T0002744"] = "<strong>Nobleman:</strong> (Gr. basilikos, i.e., \"king's man\"), an officer of state (<a href=\"#\" onClick=\"return mV('Jhn',4,49);\">Jhn 4:49</a>) in the service of Herod Antipas. He is supposed to have been the Chuza, Herod's steward, whose wife was one of those women who \"ministered unto the Lord of their substance\" (<a href=\"#\" onClick=\"return mV('Luk',8,3);\">Luk 8:3</a>). This officer came to Jesus at Cana and besought him to go down to Capernaum and heal his son, who lay there at the point of death. Our Lord sent him away with the joyful assurance that his son was alive.";
eastonArray["$$T0002745"] = "<strong>Nod:</strong> exile; wandering; unrest, a name given to the country to which Cain fled (<a href=\"#\" onClick=\"return mV('Gen',4,16);\">Gen 4:16</a>). It lay on the east of Eden.";
eastonArray["$$T0002746"] = "<strong>Nodab:</strong> noble, probably a tribe descended from one of the sons of Ishmael, with whom the trans-Jordanic tribes made war (<a href=\"#\" onClick=\"return mV('1Ch',5,19);\">1Ch 5:19</a>).";
eastonArray["$$T0002747"] = "<strong>Nogah:</strong> splendour, one of David's sons, born at Jerusalem (<a href=\"#\" onClick=\"return mV('1Ch',3,7);\">1Ch 3:7</a>).";
eastonArray["$$T0002748"] = "<strong>Noph:</strong> the Hebrew name of an Egyptian city (<a href=\"#\" onClick=\"return mV('Isa',19,13);\">Isa 19:13</a>; <a href=\"#\" onClick=\"return mV('Jer',2,16);\">Jer 2:16</a>; <a href=\"#\" onClick=\"return mV('Jer',44,1);\">44:1</a>; <a href=\"#\" onClick=\"return mV('Jer',46,14,19);\">46:14, 19</a>; <a href=\"#\" onClick=\"return mV('Eze',30,13,16);\">Eze 30:13, 16</a>). In <a href=\"#\" onClick=\"return mV('Hsa',9,6);\">Hsa 9:6</a> the Hebrew name is Moph, and is translated \"Memphis,\" which is its Greek and Latin form. It was one of the most ancient and important cities of Egypt, and stood a little to the south of the modern Cairo, on the western bank of the Nile. It was the capital of Lower Egypt. Among the ruins found at this place is a colossal statue of Rameses the Great. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002478');\">MEMPHIS</a>.)";
eastonArray["$$T0002749"] = "<strong>Nophah:</strong> blast, a city of Moab which was occupied by the Amorites (<a href=\"#\" onClick=\"return mV('Num',21,30);\">Num 21:30</a>).";
</script>
