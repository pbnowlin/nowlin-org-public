<script>
var eastonArray = new Array ();
eastonArray["$$T0003150"] = "<strong>Rogelim:</strong> fullers, a town of Gilead, the residence of Barzillai the Gileadite (<a href=\"#\" onClick=\"return mV('2Sa',17,27);\">2Sa 17:27</a>; <a href=\"#\" onClick=\"return mV('2Sa',19,31);\">19:31</a>), probably near to Mahanaim.";
eastonArray["$$T0003151"] = "<strong>Roll:</strong> the common form of ancient books. The Hebrew word rendered \"roll\" or \"volume\" is <i>meghillah</i>, found in <a href=\"#\" onClick=\"return mV('Ezr',6,2);\">Ezr 6:2</a>; <a href=\"#\" onClick=\"return mV('Psa',40,7);\">Psa 40:7</a>; <a href=\"#\" onClick=\"return mV('Jer',36,2,6,23,28,29);\">Jer 36:2, 6, 23, 28-29</a>; <a href=\"#\" onClick=\"return mV('Eze',2,9);\">Eze 2:9</a>; <a href=\"#\" onClick=\"return mV('Eze',3,'1-3');\">3:1-3</a>; <a href=\"#\" onClick=\"return mV('Zec',5,1,2);\">Zec 5:1-2</a>. \"Rolls\" (Chald. pl. of sephar, corresponding to Heb. sepher) in <a href=\"#\" onClick=\"return mV('Ezr',6,1);\">Ezr 6:1</a> is rendered in the Revised Version \"archives.\" In the New Testament the word \"volume\" (<a href=\"#\" onClick=\"return mV('Hbr',10,7);\">Hbr 10:7</a>; R.V., \"roll\") occurs as the rendering of the Greek kephalis, meaning the head or top of the stick or cylinder on which the manuscript was rolled, and hence the manuscript itself. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000622');\">BOOK</a>.)";
eastonArray["$$T0003152"] = "<strong>Romamti-ezer:</strong> elevation of help, one of the sons of Heman, \"the king's seer in the words of God, to lift up the horn.\" He was head of the \"four-and-twentieth\" course of singers (<a href=\"#\" onClick=\"return mV('1Ch',25,4,31);\">1Ch 25:4, 31</a>).";
eastonArray["$$T0003153"] = "<strong>Romans, Epistle to the:</strong> This epistle was probably written at Corinth. Phoebe (<a href=\"#\" onClick=\"return mV('Rom',16,1);\">Rom 16:1</a>) of Cenchrea conveyed it to Rome, and Gaius of Corinth entertained the apostle at the time of his writing it (<a href=\"#\" onClick=\"return mV('Rom',16,23);\">16:23</a>; <a href=\"#\" onClick=\"return mV('1Cr',1,14);\">1Cr 1:14</a>), and Erastus was chamberlain of the city, i.e., of Corinth (<a href=\"#\" onClick=\"return mV('2Ti',4,20);\">2Ti 4:20</a>).<br><br>The precise time at which it was written is not mentioned in the epistle, but it was obviously written when the apostle was about to \"go unto Jerusalem to minister unto the saints\", i.e., at the close of his second visit to Greece, during the winter preceding his last visit to that city (<a href=\"#\" onClick=\"return mV('Rom',15,25);\">Rom 15:25</a>; <a href=\"#\" onClick=\"return mV('Act',19,21);\">Act 19:21</a>; <a href=\"#\" onClick=\"return mV('Act',20,2,3,16);\">20:2-3, 16</a>; <a href=\"#\" onClick=\"return mV('1Cr',16,'1-4');\">1Cr 16:1-4</a>), early in A.D. 58.<br><br>It is highly probable that Christianity was planted in Rome by some of those who had been at Jerusalem on the day of Pentecost (<a href=\"#\" onClick=\"return mV('Act',2,10);\">Act 2:10</a>). At this time the Jews were very numerous in Rome, and their synagogues were probably resorted to by Romans also, who in this way became acquainted with the great facts regarding Jesus as these were reported among the Jews. Thus a church composed of both Jews and Gentiles was formed at Rome. Many of the brethren went out to meet Paul on his approach to Rome. There are evidences that Christians were then in Rome in considerable numbers, and had probably more than one place of meeting (<a href=\"#\" onClick=\"return mV('Rom',16,14,15);\">Rom 16:14-15</a>).<br><br>The object of the apostle in writing to this church was to explain to them the great doctrines of the gospel. His epistle was a \"word in season.\" Himself deeply impressed with a sense of the value of the doctrines of salvation, he opens up in a clear and connected form the whole system of the gospel in its relation both to Jew and Gentile. This epistle is peculiar in this, that it is a systematic exposition of the gospel of universal application. The subject is here treated argumentatively, and is a plea for Gentiles addressed to Jews. In the Epistle to the Galatians, the same subject is discussed, but there the apostle pleads his own authority, because the church in Galatia had been founded by him.<br><br>After the introduction (<a href=\"#\" onClick=\"return mV('Rom',1,'1-15');\">Rom 1:1-15</a>), the apostle presents in it divers aspects and relations the doctrine of justification by faith (<a href=\"#\" onClick=\"return mV('Rom',1,'16-');\">Rom 1:16-11:36</a>) on the ground of the imputed righteousness of Christ. He shows that salvation is all of grace, and only of grace. This main section of his letter is followed by various practical exhortations (<a href=\"#\" onClick=\"return mV('Rom',12,'1-');\">Rom 12:1-15:13</a>), which are followed by a conclusion containing personal explanations and salutations, which contain the names of twenty-four Christians at Rome, a benediction, and a doxology (<a href=\"#\" onClick=\"return mV('Rom',15,'14-');\">Rom 15:14-ch. 16</a>).";
eastonArray["$$T0003154"] = "<strong>Rome:</strong> the most celebrated city in the world at the time of Christ. It is said to have been founded B.C. 753. When the New Testament was written, Rome was enriched and adorned with the spoils of the world, and contained a population estimated at 1,200,000, of which the half were slaves, and including representatives of nearly every nation then known. It was distinguished for its wealth and luxury and profligacy. The empire of which it was the capital had then reached its greatest prosperity.<br><br>On the day of Pentecost there were in Jerusalem \"strangers from Rome,\" who doubtless carried with them back to Rome tidings of that great day, and were instrumental in founding the church there. Paul was brought to this city a prisoner, where he remained for two years (<a href=\"#\" onClick=\"return mV('Act',28,30,31);\">Act 28:30-31</a>) \"in his own hired house.\" While here, Paul wrote his epistles to the Philippians, to the Ephesians, to the Colossians, to Philemon, and probably also to the Hebrews. He had during these years for companions Luke and Aristarchus (<a href=\"#\" onClick=\"return mV('Act',27,2);\">Act 27:2</a>), Timothy (<a href=\"#\" onClick=\"return mV('Phl',1,1);\">Phl 1:1</a>; <a href=\"#\" onClick=\"return mV('Col',1,1);\">Col 1:1</a>), Tychicus (<a href=\"#\" onClick=\"return mV('Eph',6,21);\">Eph 6:21</a>), Epaphroditus (<a href=\"#\" onClick=\"return mV('Phl',4,18);\">Phl 4:18</a>), and John Mark (<a href=\"#\" onClick=\"return mV('Col',4,10);\">Col 4:10</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002871');\">PAUL</a>.)<br><br>Beneath this city are extensive galleries, called \"catacombs,\" which were used from about the time of the apostles (one of the inscriptions found in them bears the date A.D. 71) for some three hundred years as places of refuge in the time of persecution, and also of worship and burial. About four thousand inscriptions have been found in the catacombs. These give an interesting insight into the history of the church at Rome down to the time of Constantine.";
eastonArray["$$T0003155"] = "<strong>Rose:</strong> Many varieties of the rose proper are indigenous to Syria. The famed rose of Damascus is white, but there are also red and yellow roses. In <a href=\"#\" onClick=\"return mV('Sgs',2,1);\">Sgs 2:1</a> and <a href=\"#\" onClick=\"return mV('Isa',35,1);\">Isa 35:1</a> the Hebrew word <i>habatstseleth</i> (found only in these passages), rendered \"rose\" (R.V. marg., \"autumn crocus\"), is supposed by some to mean the oleander, by others the sweet-scented narcissus (a native of Palestine), the tulip, or the daisy; but nothing definite can be affirmed regarding it.<br><br>The \"rose of Sharon\" is probably the cistus or rock-rose, several species of which abound in Palestine. \"Mount Carmel especially abounds in the cistus, which in April covers some of the barer parts of the mountain with a glow not inferior to that of the Scottish heather.\" (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002632');\">MYRRH [2]</a>.)";
eastonArray["$$T0003156"] = "<strong>Rosh:</strong> (<a href=\"#\" onClick=\"return mV('Eze',38,2,3);\">Eze 38:2-3</a>; <a href=\"#\" onClick=\"return mV('Eze',39,1);\">39:1</a>) is rendered \"chief\" in the Authorized Version. It is left untranslated as a proper name in the Revised Version. Some have supposed that the Russians are here meant, as one of the three Scythian tribes of whom Magog was the prince. They invaded the land of Judah in the days of Josiah. Herodotus, the Greek historian, says: \"For twenty-eight years the Scythians ruled over Asia, and things were turned upside down by their violence and contempt.\" (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000568');\">BETHSHEAN</a>.)";
eastonArray["$$T0003157"] = "<strong>Rosin:</strong> found only in Authorized Version, margin, <a href=\"#\" onClick=\"return mV('Eze',27,17);\">Eze 27:17</a>, Heb. tsori, uniformly rendered elsewhere \"balm\" (q.v.), as here in the text. The Vulgate has resinam, rendered \"rosin\" in the Douay Version. As used, however, by Jerome, the Lat. resina denotes some odoriferous gum or oil.";
eastonArray["$$T0003158"] = "<strong>Ruby:</strong> (Heb. peninim), only in plural (<a href=\"#\" onClick=\"return mV('Lam',4,7);\">Lam 4:7</a>). The ruby was one of the stones in the high priest's breastplate (<a href=\"#\" onClick=\"return mV('Exd',28,17);\">Exd 28:17</a>). A comparison is made between the value of wisdom and rubies (<a href=\"#\" onClick=\"return mV('Job',28,18);\">Job 28:18</a>; <a href=\"#\" onClick=\"return mV('Pro',3,15);\">Pro 3:15</a>; <a href=\"#\" onClick=\"return mV('Pro',8,11);\">8:11</a>). The price of a virtuous woman is said to be \"far above rubies\" (<a href=\"#\" onClick=\"return mV('Pro',31,10);\">Pro 31:10</a>). The exact meaning of the Hebrew word is uncertain. Some render it \"red coral;\" others, \"pearl\" or \"mother-of-pearl.\"";
eastonArray["$$T0003159"] = "<strong>Rudder bands:</strong> Ancient ships had two great broad-bladed oars for rudders. These, when not in use, were lifted out of the water and bound or tied up. When required for use, these bands were unloosed and the rudders allowed to drop into the water (<a href=\"#\" onClick=\"return mV('Act',27,40);\">Act 27:40</a>).";
eastonArray["$$T0003160"] = "<strong>Rue:</strong> a garden herb (Ruta graveolens) which the Pharisees were careful to tithe (<a href=\"#\" onClick=\"return mV('Luk',11,42);\">Luk 11:42</a>), neglecting weightier matters. It is omitted in the parallel passage of <a href=\"#\" onClick=\"return mV('Mat',23,23);\">Mat 23:23</a>. There are several species growing wild in Palestine. It is used for medicinal and culinary purposes. It has a powerful scent, and is a stimulant. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002560');\">MINT</a>.)";
eastonArray["$$T0003161"] = "<strong>Rufus:</strong> red, the son of Simon the Cyrenian (<a href=\"#\" onClick=\"return mV('Mar',15,21);\">Mar 15:21</a>), whom the Roman soldiers compelled to carry the cross on which our Lord was crucified. Probably it is the same person who is again mentioned in <a href=\"#\" onClick=\"return mV('Rom',16,13);\">Rom 16:13</a> as a disciple at Rome, whose mother also was a Christian held in esteem by the apostle. Mark mentions him along with his brother Alexander as persons well known to his readers (<a href=\"#\" onClick=\"return mV('Mar',15,21);\">Mar 15:21</a>).";
eastonArray["$$T0003162"] = "<strong>Ruhamah:</strong> having obtained mercy, a symbolical name given to the daughter of Hosea (<a href=\"#\" onClick=\"return mV('Hsa',2,1);\">Hsa 2:1</a>).";
eastonArray["$$T0003163"] = "<strong>Rumah:</strong> elevation, probably the same as Arumah (<a href=\"#\" onClick=\"return mV('Jdg',9,41);\">Jdg 9:41</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,36);\">2Ki 23:36</a>), near Shechem. Others identify it with Tell Rumeh, in Galilee, about 6 miles north of Nazareth.";
eastonArray["$$T0003164"] = "<strong>Rush:</strong> the papyrus (<a href=\"#\" onClick=\"return mV('Job',8,11);\">Job 8:11</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000662');\">BULRUSH</a>.) The expression \"branch and rush\" in <a href=\"#\" onClick=\"return mV('Isa',9,14);\">Isa 9:14</a>; <a href=\"#\" onClick=\"return mV('Isa',19,15);\">19:15</a> means \"utterly.\"";
eastonArray["$$T0003165"] = "<strong>Ruth:</strong> a friend, a Moabitess, the wife of Mahlon, whose father, Elimelech, had settled in the land of Moab. On the death of Elimelech and Mahlon, Naomi came with Ruth, her daughter-in-law, who refused to leave her, to Bethlehem, the old home from which Elimelech had migrated. There she had a rich relative, Boaz, to whom Ruth was eventually married. She became the mother of Obed, the grandfather of David. Thus Ruth, a Gentile, is among the maternal progenitors of our Lord (<a href=\"#\" onClick=\"return mV('Mat',1,5);\">Mat 1:5</a>). The story of \"the gleaner Ruth illustrates the friendly relations between the good Boaz and his reapers, the Jewish land system, the method of transferring property from one person to another, the working of the Mosaic law for the relief of distressed and ruined families; but, above all, handing down the unselfishness, the brave love, the unshaken trustfulness of her who, though not of the chosen race, was, like the Canaanitess Tamar (<a href=\"#\" onClick=\"return mV('Gen',38,29);\">Gen 38:29</a>; <a href=\"#\" onClick=\"return mV('Mat',1,3);\">Mat 1:3</a>) and the Canaanitess Rahab (<a href=\"#\" onClick=\"return mV('Mat',1,5);\">Mat 1:5</a>), privileged to become the ancestress of David, and so of 'great David's greater Son'\" (<a href=\"#\" onClick=\"return mV('Rth',4,'18-22');\">Rth 4:18-22</a>).";
eastonArray["$$T0003166"] = "<strong>Ruth The Book of:</strong> was originally a part of the Book of Judges, but it now forms one of the twenty-four separate books of the Hebrew Bible.<br><br>The history it contains refers to a period perhaps about one hundred and twenty-six years before the birth of David. It gives (<a href=\"#\" onClick=\"return mV('Rth',1,'1-')\">Rth 1</a>) an account of Naomi's going to Moab with her husband, Elimelech, and of her subsequent return to Bethlehem with her daughter-in-law;<br><br>(2) the marriage of Boaz and Ruth; and<br><br>(3) the birth of Obed, of whom David sprang.<br><br>The author of this book was probably Samuel, according to Jewish tradition.<br><br>\"Brief as this book is, and simple as is its story, it is remarkably rich in examples of faith, patience, industry, and kindness, nor less so in indications of the care which God takes of those who put their trust in him.\"";
eastonArray["$$T0003167"] = "<strong>Rye:</strong> =Rie, (Heb. kussemeth), found in <a href=\"#\" onClick=\"return mV('Exd',9,32);\">Exd 9:32</a>; <a href=\"#\" onClick=\"return mV('Isa',28,25);\">Isa 28:25</a>, in all of which the margins of the Authorized and of the Revised Versions have \"spelt.\" This Hebrew word also occurs in <a href=\"#\" onClick=\"return mV('Eze',4,9);\">Eze 4:9</a>, where the Authorized Version has \"fitches' (q.v.) and the Revised Version \"spelt.\" This, there can be no doubt, was the <i>Triticum spelta</i>, a species of hard, rough-grained wheat.";
eastonArray["$$T0003168"] = "<strong>Sabachthani:</strong> thou hast forsaken me, one of the Aramaic words uttered by our Lord on the cross (<a href=\"#\" onClick=\"return mV('Mat',27,46);\">Mat 27:46</a>; <a href=\"#\" onClick=\"return mV('Mar',15,34);\">Mar 15:34</a>).";
eastonArray["$$T0003169"] = "<strong>Sabaoth:</strong> the transliteration of the Hebrew word <i>tsebha'oth</i>, meaning \"hosts,\" \"armies\" (<a href=\"#\" onClick=\"return mV('Rom',9,29);\">Rom 9:29</a>; <a href=\"#\" onClick=\"return mV('Jam',5,4);\">Jam 5:4</a>). In the LXX. the Hebrew word is rendered by \"Almighty.\" (See <a href=\"#\" onClick=\"return mV('Rev',4,8);\">Rev 4:8</a>; <a href=\"#\" onClick=\"return mV('Isa',6,3);\">Isa 6:3</a>.) It may designate Jehovah as either<br><br>(1) God of the armies of earth, or<br><br>(2) God of the armies of the stars, or<br><br>(3) God of the unseen armies of angels; or perhaps it may include all these ideas.";
eastonArray["$$T0003170"] = "<strong>Sabbath:</strong> (Heb. verb shabbath, meaning \"to rest from labour\"), the day of rest. It is first mentioned as having been instituted in Paradise, when man was in innocence (<a href=\"#\" onClick=\"return mV('Gen',2,2);\">Gen 2:2</a>). \"The sabbath was made for man,\" as a day of rest and refreshment for the body and of blessing to the soul.<br><br>It is next referred to in connection with the gift of manna to the children of Israel in the wilderness (<a href=\"#\" onClick=\"return mV('Exd',16,23);\">Exd 16:23</a>); and afterwards, when the law was given from Sinai (<a href=\"#\" onClick=\"return mV('Exd',20,11);\">20:11</a>), the people were solemnly charged to \"remember the sabbath day, to keep it holy.\" Thus it is spoken of as an institution already existing.<br><br>In the Mosaic law strict regulations were laid down regarding its observance (<a href=\"#\" onClick=\"return mV('Exd',35,2,3);\">Exd 35:2-3</a>; <a href=\"#\" onClick=\"return mV('Lev',23,3);\">Lev 23:3</a>; <a href=\"#\" onClick=\"return mV('Lev',26,34);\">26:34</a>). These were peculiar to that dispensation.<br><br>In the subsequent history of the Jews frequent references are made to the sanctity of the Sabbath (<a href=\"#\" onClick=\"return mV('Isa',56,2,4,6,7);\">Isa 56:2, 4, 6-7</a>; <a href=\"#\" onClick=\"return mV('Isa',58,13,14);\">58:13-14</a>; <a href=\"#\" onClick=\"return mV('Jer',17,'20-22');\">Jer 17:20-22</a>; <a href=\"#\" onClick=\"return mV('Neh',13,19);\">Neh 13:19</a>). In later times they perverted the Sabbath by their traditions. Our Lord rescued it from their perversions, and recalled to them its true nature and intent (<a href=\"#\" onClick=\"return mV('Mat',12,'10-13');\">Mat 12:10-13</a>; <a href=\"#\" onClick=\"return mV('Mar',2,27);\">Mar 2:27</a>; <a href=\"#\" onClick=\"return mV('Luk',13,'10-17');\">Luk 13:10-17</a>).<br><br>The Sabbath, originally instituted for man at his creation, is of permanent and universal obligation. The physical necessities of man require a Sabbath of rest. He is so constituted that his bodily welfare needs at least one day in seven for rest from ordinary labour. Experience also proves that the moral and spiritual necessities of men also demand a Sabbath of rest. \"I am more and more sure by experience that the reason for the observance of the Sabbath lies deep in the everlasting necessities of human nature, and that as long as man is man the blessedness of keeping it, not as a day of rest only, but as a day of spiritual rest, will never be annulled. I certainly do feel by experience the eternal obligation, because of the eternal necessity, of the Sabbath. The soul withers without it. It thrives in proportion to its observance. The Sabbath was made for man. God made it for men in a certain spiritual state because they needed it. The need, therefore, is deeply hidden in human nature. He who can dispense with it must be holy and spiritual indeed. And he who, still unholy and unspiritual, would yet dispense with it is a man that would fain be wiser than his Maker\" (F. W. Robertson).<br><br>The ancient Babylonian calendar, as seen from recently recovered inscriptions on the bricks among the ruins of the royal palace, was based on the division of time into weeks of seven days. The Sabbath is in these inscriptions designated Sabattu, and defined as \"a day of rest for the heart\" and \"a day of completion of labour.\"<br><br>The change of the day. Originally at creation the seventh day of the week was set apart and consecrated as the Sabbath. The first day of the week is now observed as the Sabbath. Has God authorized this change? There is an obvious distinction between the Sabbath as an institution and the particular day set apart for its observance. The question, therefore, as to the change of the day in no way affects the perpetual obligation of the Sabbath as an institution. Change of the day or no change, the Sabbath remains as a sacred institution the same. It cannot be abrogated.<br><br>If any change of the day has been made, it must have been by Christ or by his authority. Christ has a right to make such a change (<a href=\"#\" onClick=\"return mV('Mar',2,'23-28');\">Mar 2:23-28</a>). As Creator, Christ was the original Lord of the Sabbath (<a href=\"#\" onClick=\"return mV('Jhn',1,3);\">Jhn 1:3</a>; <a href=\"#\" onClick=\"return mV('Hbr',1,10);\">Hbr 1:10</a>). It was originally a memorial of creation. A work vastly greater than that of creation has now been accomplished by him, the work of redemption. We would naturally expect just such a change as would make the Sabbath a memorial of that greater work.<br><br>True, we can give no text authorizing the change in so many words. We have no express law declaring the change. But there are evidences of another kind. We know for a fact that the first day of the week has been observed from apostolic times, and the necessary conclusion is, that it was observed by the apostles and their immediate disciples. This, we may be sure, they never would have done without the permission or the authority of their Lord.<br><br>After his resurrection, which took place on the first day of the week (<a href=\"#\" onClick=\"return mV('Mat',28,1);\">Mat 28:1</a>; <a href=\"#\" onClick=\"return mV('Mar',16,2);\">Mar 16:2</a>; <a href=\"#\" onClick=\"return mV('Luk',24,1);\">Luk 24:1</a>; <a href=\"#\" onClick=\"return mV('Jhn',20,1);\">Jhn 20:1</a>), we never find Christ meeting with his disciples on the seventh day. But he specially honoured the first day by manifesting himself to them on four separate occasions (<a href=\"#\" onClick=\"return mV('Mat',28,9);\">Mat 28:9</a>; <a href=\"#\" onClick=\"return mV('Luk',24,18-34);\">Luk 24:'18-34</a>; <a href=\"#\" onClick=\"return mV('Jhn',20,'19-23');\">Jhn 20:19-23</a>). Again, on the next first day of the week, Jesus appeared to his disciples (<a href=\"#\" onClick=\"return mV('Jhn',20,26);\">Jhn 20:26</a>).<br><br>Some have calculated that Christ's ascension took place on the first day of the week. And there can be no doubt that the descent of the Holy Ghost at Pentecost was on that day (<a href=\"#\" onClick=\"return mV('Act',2,1);\">Act 2:1</a>). Thus Christ appears as instituting a new day to be observed by his people as the Sabbath, a day to be henceforth known amongst them as the \"Lord's day.\" The observance of this \"Lord's day\" as the Sabbath was the general custom of the primitive churches, and must have had apostolic sanction (<a href=\"#\" onClick=\"return mV('Act',20,'3-7');\">Act 20:3-7</a>; <a href=\"#\" onClick=\"return mV('1Cr',16,1,2);\">1Cr 16:1-2</a>) and authority, and so the sanction and authority of Jesus Christ.<br><br>The words \"at her sabbaths\" (<a href=\"#\" onClick=\"return mV('Lam',1,7);\">Lam 1:7</a>, A.V.) ought probably to be, as in the Revised Version, \"at her desolations.\"";
eastonArray["$$T0003171"] = "<strong>Sabbath day's journey:</strong> supposed to be a distance of 2,000 cubits, or less than half-a-mile, the distance to which, according to Jewish tradition, it was allowable to travel on the Sabbath day without violating the law (<a href=\"#\" onClick=\"return mV('Act',1,12);\">Act 1:12</a>; <a href=\"#\" onClick=\"return mV('Exd',16,29);\">Exd 16:29</a>; <a href=\"#\" onClick=\"return mV('Num',35,5);\">Num 35:5</a>; <a href=\"#\" onClick=\"return mV('Jos',3,4);\">Jos 3:4</a>).";
eastonArray["$$T0003172"] = "<strong>Sabbatical year:</strong> every seventh year, during which the land, according to the law of Moses, had to remain uncultivated (<a href=\"#\" onClick=\"return mV('Lev',25,'2-7');\">Lev 25:2-7</a>; <a href=\"#\" onClick=\"return mV('Exd',23,'10,12');\">Exd 23:10-12</a>; <a href=\"#\" onClick=\"return mV('Lev',26,34,35);\">Lev 26:34-35</a>). Whatever grew of itself during that year was not for the owner of the land, but for the poor and the stranger and the beasts of the field. All debts, except those of foreigners, were to be remitted (<a href=\"#\" onClick=\"return mV('Deu',15,'1-11');\">Deu 15:1-11</a>). There is little notice of the observance of this year in Biblical history. It appears to have been much neglected (<a href=\"#\" onClick=\"return mV('2Ch',36,20,21);\">2Ch 36:20-21</a>).";
eastonArray["$$T0003173"] = "<strong>Sabeans:</strong> descendants of Seba (<a href=\"#\" onClick=\"return mV('Gen',10,7);\">Gen 10:7</a>); Africans (<a href=\"#\" onClick=\"return mV('Isa',43,3);\">Isa 43:3</a>). They were \"men of stature,\" and engaged in merchandise (<a href=\"#\" onClick=\"return mV('Isa',45,14);\">Isa 45:14</a>). Their conversion to the Lord was predicted (<a href=\"#\" onClick=\"return mV('Psa',72,10);\">Psa 72:10</a>). This word, in <a href=\"#\" onClick=\"return mV('Eze',23,42);\">Eze 23:42</a>, should be read, as in the margin of the Authorized Version, and in the Revised Version, \"drunkards.\" Another tribe, apparently given to war, is mentioned in <a href=\"#\" onClick=\"return mV('Job',1,15);\">Job 1:15</a>.";
eastonArray["$$T0003174"] = "<strong>Sabtah:</strong> rest, the third son of Cush (<a href=\"#\" onClick=\"return mV('Gen',10,7);\">Gen 10:7</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,9);\">1Ch 1:9</a>).";
eastonArray["$$T0003175"] = "<strong>Sabtecha:</strong> the fifth son of Cush (id.).";
eastonArray["$$T0003176"] = "<strong>Sachar:</strong> hire.<br><br>(1.) One of David's heroes (<a href=\"#\" onClick=\"return mV('1Ch',11,35);\">1Ch 11:35</a>); called also Sharar (<a href=\"#\" onClick=\"return mV('2Sa',23,33);\">2Sa 23:33</a>).<br><br>(2.) A son of Obed-edom the Gittite, and a temple porter (<a href=\"#\" onClick=\"return mV('1Ch',26,4);\">1Ch 26:4</a>).";
eastonArray["$$T0003177"] = "<strong>Sackbut:</strong> (Chald. sabkha; Gr. sambuke), a Syrian stringed instrument resembling a harp (<a href=\"#\" onClick=\"return mV('Dan',3,5,7,10,15);\">Dan 3:5, 7, 10, 15</a>); not the modern sackbut, which is a wind instrument.";
eastonArray["$$T0003178"] = "<strong>Sackcloth:</strong> cloth made of black goats' hair, coarse, rough, and thick, used for sacks, and also worn by mourners (<a href=\"#\" onClick=\"return mV('Gen',37,34);\">Gen 37:34</a>; <a href=\"#\" onClick=\"return mV('Gen',42,25);\">42:25</a>; <a href=\"#\" onClick=\"return mV('2Sa',3,31);\">2Sa 3:31</a>; <a href=\"#\" onClick=\"return mV('Est',4,1,2);\">Est 4:1-2</a>; <a href=\"#\" onClick=\"return mV('Psa',30,11);\">Psa 30:11</a>, etc.), and as a sign of repentance (<a href=\"#\" onClick=\"return mV('Mat',11,21);\">Mat 11:21</a>). It was put upon animals by the people of Nineveh (<a href=\"#\" onClick=\"return mV('Jon',3,8);\">Jon 3:8</a>).";
eastonArray["$$T0003179"] = "<strong>Sacrifice:</strong> The offering up of sacrifices is to be regarded as a divine institution. It did not originate with man. God himself appointed it as the mode in which acceptable worship was to be offered to him by guilty man. The language and the idea of sacrifice pervade the whole Bible.<br><br>Sacrifices were offered in the ante-diluvian age. The Lord clothed Adam and Eve with the skins of animals, which in all probability had been offered in sacrifice (<a href=\"#\" onClick=\"return mV('Gen',3,21);\">Gen 3:21</a>). Abel offered a sacrifice \"of the firstlings of his flock\" (<a href=\"#\" onClick=\"return mV('Gen',4,4);\">4:4</a>; <a href=\"#\" onClick=\"return mV('Hbr',11,4);\">Hbr 11:4</a>). A distinction also was made between clean and unclean animals, which there is every reason to believe had reference to the offering up of sacrifices (<a href=\"#\" onClick=\"return mV('Gen',7,2,8);\">Gen 7:2, 8</a>), because animals were not given to man as food till after the Flood.<br><br>The same practice is continued down through the patriarchal age (<a href=\"#\" onClick=\"return mV('Gen',8,20);\">Gen 8:20</a>; <a href=\"#\" onClick=\"return mV('Gen',12,7);\">12:7</a>; <a href=\"#\" onClick=\"return mV('Gen',13,4,18);\">13:4, 18</a>; <a href=\"#\" onClick=\"return mV('Gen',15,'9-11');\">15:9-11</a>; <a href=\"#\" onClick=\"return mV('Gen',22,'1-18');\">22:1-18</a>, etc.). In the Mosaic period of Old Testament history definite laws were prescribed by God regarding the different kinds of sacrifices that were to be offered and the manner in which the offering was to be made. The offering of stated sacrifices became indeed a prominent and distinctive feature of the whole period (<a href=\"#\" onClick=\"return mV('Exd',12,'3-27');\">Exd 12:3-27</a>>; <a href=\"#\" onClick=\"return mV('Lev',23,'5-8');\">Lev 23:5-8</a>; <a href=\"#\" onClick=\"return mV('Num',9,'2-14');\">Num 9:2-14</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000185');\">ALTAR</a>.)<br><br>We learn from the Epistle to the Hebrews that sacrifices had in themselves no value or efficacy. They were only the \"shadow of good things to come,\" and pointed the worshippers forward to the coming of the great High Priest, who, in the fullness of the time, \"was offered once for all to bear the sin of many.\" Sacrifices belonged to a temporary economy, to a system of types and emblems which served their purposes and have now passed away. The \"one sacrifice for sins\" hath \"perfected for ever them that are sanctified.\"<br><br>Sacrifices were of two kinds:<br><br>1. Unbloody, such as<br><br>(1) first-fruits and tithes;<br><br>(2) meat and drink-offerings; and<br><br>(3) incense.<br><br>2. Bloody, such as<br><br>(1) burnt-offerings;<br><br>(2) peace-offerings; and<br><br>(3) sin and trespass offerings. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002770');\">OFFERINGS</a>.)";
eastonArray["$$T0003180"] = "<strong>Sadducees:</strong> The origin of this Jewish sect cannot definitely be traced. It was probably the outcome of the influence of Grecian customs and philosophy during the period of Greek domination. The first time they are met with is in connection with John the Baptist's ministry. They came out to him when on the banks of the Jordan, and he said to them, \"O generation of vipers, who hath warned you to flee from the wrath to come?\" (<a href=\"#\" onClick=\"return mV('Mat',3,7);\">Mat 3:7</a>.) The next time they are spoken of they are represented as coming to our Lord tempting him. He calls them \"hypocrites\" and \"a wicked and adulterous generation\" (<a href=\"#\" onClick=\"return mV('Mat',16,'1-4');\">Mat 16:1-4</a>; <a href=\"#\" onClick=\"return mV('Mat',22,23);\">22:23</a>). The only reference to them in the Gospels of Mark (<a href=\"#\" onClick=\"return mV('Mar',12,'18-27');\">Mar 12:18-27</a>) and Luke (<a href=\"#\" onClick=\"return mV('Luk',20,'27-38');\">Luk 20:27-38</a>) is their attempting to ridicule the doctrine of the resurrection, which they denied, as they also denied the existence of angels. They are never mentioned in John's Gospel.<br><br>There were many Sadducees among the \"elders\" of the Sanhedrin. They seem, indeed, to have been as numerous as the Pharisees (<a href=\"#\" onClick=\"return mV('Act',23,6);\">Act 23:6</a>). They showed their hatred of Jesus in taking part in his condemnation (<a href=\"#\" onClick=\"return mV('Mat',16,21);\">Mat 16:21</a>; <a href=\"#\" onClick=\"return mV('Mat',26,'1-3',59);\">26:1-3, 59</a>; <a href=\"#\" onClick=\"return mV('Mar',8,31);\">Mar 8:31</a>; <a href=\"#\" onClick=\"return mV('Mar',15,1);\">15:1</a>; <a href=\"#\" onClick=\"return mV('Luk',9,22);\">Luk 9:22</a>; <a href=\"#\" onClick=\"return mV('Luk',22,66);\">22:66</a>). They endeavoured to prohibit the apostles from preaching the resurrection of Christ (<a href=\"#\" onClick=\"return mV('Act',2,24,31,32);\">Act 2:24, 31-32</a>; <a href=\"#\" onClick=\"return mV('Act',4,1,2);\">4:1-2</a>; <a href=\"#\" onClick=\"return mV('Act',5,17, '24-28');\">5:17, 24-28</a>). They were the deists or sceptics of that age. They do not appear as a separate sect after the destruction of Jerusalem.";
eastonArray["$$T0003181"] = "<strong>Sadoc:</strong> just, mentioned in the genealogy of our Lord (<a href=\"#\" onClick=\"return mV('Mat',1,14);\">Mat 1:14</a>).";
eastonArray["$$T0003182"] = "<strong>Saffron:</strong> Heb. karkom, Arab. zafran (i.e., \"yellow\"), mentioned only in <a href=\"#\" onClick=\"return mV('Sgs',4,13,14);\">Sgs 4:13-14</a>; the <i>Crocus sativus</i>. Many species of the crocus are found in Palestine. The pistils and stigmata, from the centre of its flowers, are pressed into \"saffron cakes,\" common in the East. \"We found,\" says Tristram, \"saffron a very useful condiment in travelling cookery, a very small pinch of it giving not only a rich yellow colour but an agreable flavour to a dish of rice or to an insipid stew.\"";
eastonArray["$$T0003183"] = "<strong>Saint:</strong> one separated from the world and consecrated to God; one holy by profession and by covenant; a believer in Christ (<a href=\"#\" onClick=\"return mV('Psa',16,3);\">Psa 16:3</a>; <a href=\"#\" onClick=\"return mV('Rom',1,7);\">Rom 1:7</a>; <a href=\"#\" onClick=\"return mV('Rom',8,27);\">8:27</a>; <a href=\"#\" onClick=\"return mV('Phl',1,1);\">Phl 1:1</a>; <a href=\"#\" onClick=\"return mV('Hbr',6,10);\">Hbr 6:10</a>).<br><br>The \"saints\" spoken of in <a href=\"#\" onClick=\"return mV('Jud',1,14);\">Jud 1:14</a> are probably not the disciples of Christ, but the \"innumerable company of angels\" (<a href=\"#\" onClick=\"return mV('Hbr',12,22);\">Hbr 12:22</a>; <a href=\"#\" onClick=\"return mV('Psa',68,17);\">Psa 68:17</a>), with reference to <a href=\"#\" onClick=\"return mV('Deu',33,2);\">Deu 33:2</a>.<br><br>This word is also used of the holy dead (<a href=\"#\" onClick=\"return mV('Mat',27,52);\">Mat 27:52</a>; <a href=\"#\" onClick=\"return mV('Rev',18,24);\">Rev 18:24</a>). It was not used as a distinctive title of the apostles and evangelists and of a \"spiritual nobility\" till the fourth century. In that sense it is not a scriptural title.";
eastonArray["$$T0003184"] = "<strong>Sala:</strong> a shoot, a descendant of Arphaxed (<a href=\"#\" onClick=\"return mV('Luk',3,35,36);\">Luk 3:35-36</a>); called also Shelah (<a href=\"#\" onClick=\"return mV('1Ch',1,18,24);\">1Ch 1:18, 24</a>).";
eastonArray["$$T0003185"] = "<strong>Salamis:</strong> a city on the south-east coast of Cyprus (<a href=\"#\" onClick=\"return mV('Act',13,5);\">Act 13:5</a>), where Saul and Barnabas, on their first missionary journey, preached the word in one of the Jewish synagogues, of which there seem to have been several in that place. It is now called Famagusta.";
eastonArray["$$T0003186"] = "<strong>Salathiel:</strong> whom I asked of God, the son of Jeconiah (<a href=\"#\" onClick=\"return mV('Mat',1,12);\">Mat 1:12</a>; <a href=\"#\" onClick=\"return mV('1Ch',3,17);\">1Ch 3:17</a>); also called the son of Neri (<a href=\"#\" onClick=\"return mV('Luk',3,27);\">Luk 3:27</a>). The probable explanation of the apparent discrepancy is that he was the son of Neri, the descendant of Nathan, and thus heir to the throne of David on the death of Jeconiah (<a href=\"#\" onClick=\"return mV('Jer',22,30);\">Jer 22:30</a>).";
eastonArray["$$T0003187"] = "<strong>Salcah:</strong> wandering, a city of Bashan assigned to the half tribe of Manasseh (<a href=\"#\" onClick=\"return mV('Deu',3,10);\">Deu 3:10</a>; <a href=\"#\" onClick=\"return mV('Jos',12,5);\">Jos 12:5</a>; <a href=\"#\" onClick=\"return mV('Jos',13,11);\">13:11</a>), identified with Salkhad, about 56 miles east of Jordan.";
eastonArray["$$T0003188"] = "<strong>Salem:</strong> peace, commonly supposed to be another name of Jerusalem (<a href=\"#\" onClick=\"return mV('Gen',14,18);\">Gen 14:18</a>; <a href=\"#\" onClick=\"return mV('Psa',76,2);\">Psa 76:2</a>; <a href=\"#\" onClick=\"return mV('Hbr',7,1,2);\">Hbr 7:1-2</a>).";
eastonArray["$$T0003189"] = "<strong>Salim:</strong> peaceful, a place near AEnon (q.v.), on the west of Jordan, where John baptized (<a href=\"#\" onClick=\"return mV('Jhn',3,23);\">Jhn 3:23</a>). It was probably the Shalem mentioned in <a href=\"#\" onClick=\"return mV('Gen',33,18);\">Gen 33:18</a>, about 7 miles south of AEnon, at the head of the great Wady Far'ah, which formed the northern boundary of Judea in the Jordan valley.";
eastonArray["$$T0003190"] = "<strong>Sallai:</strong> basket-maker.<br><br>(1.) A Benjamite (<a href=\"#\" onClick=\"return mV('Neh',11,8);\">Neh 11:8</a>).<br><br>(2.) A priest in the days of Joshua and Zerubbabel (<a href=\"#\" onClick=\"return mV('Neh',12,20);\">Neh 12:20</a>).";
eastonArray["$$T0003191"] = "<strong>Sallu:</strong> weighed.<br><br>(1.) A priest (<a href=\"#\" onClick=\"return mV('Neh',12,7);\">Neh 12:7</a>).<br><br>(2.) A Benjamite (<a href=\"#\" onClick=\"return mV('1Ch',9,7);\">1Ch 9:7</a>; <a href=\"#\" onClick=\"return mV('Neh',11,7);\">Neh 11:7</a>).";
eastonArray["$$T0003192"] = "<strong>Salmon:</strong> garment, the son of Nashon (<a href=\"#\" onClick=\"return mV('Rth',4,20);\">Rth 4:20</a>; <a href=\"#\" onClick=\"return mV('Mat',1,4,5);\">Mat 1:4-5</a>), possibly the same as Salma in <a href=\"#\" onClick=\"return mV('1Ch',2,51);\">1Ch 2:51</a>.";
eastonArray["$$T0003193"] = "<strong>Salmon:</strong> shady; or Zalmon (q.v.), a hill covered with dark forests, south of Shechem, from which Abimelech and his men gathered wood to burn that city (<a href=\"#\" onClick=\"return mV('Jdg',9,48);\">Jdg 9:48</a>). In <a href=\"#\" onClick=\"return mV('Psa',68,14);\">Psa 68:14</a> the change from war to peace is likened to snow on the dark mountain, as some interpret the expression. Others suppose the words here mean that the bones of the slain left unburied covered the land, so that it seemed to be white as if covered with snow. The reference, however, of the psalm is probably to <a href=\"#\" onClick=\"return mV('Jos',11,'1-');\">Jos 11</a> and <a href=\"#\" onClick=\"return mV('Jos',12,'1-');\">12</a>. The scattering of the kings and their followers is fitly likened unto the snow-flakes rapidly falling on the dark Salmon. It is the modern Jebel Suleiman.";
eastonArray["$$T0003194"] = "<strong>Salmone:</strong> a promontory on the east of Crete, under which Paul sailed on his voyage to Rome (<a href=\"#\" onClick=\"return mV('Act',27,7);\">Act 27:7</a>); the modern Cape Sidero.";
eastonArray["$$T0003195"] = "<strong>Salome:</strong> perfect.<br><br>(1.) The wife of Zebedee and mother of James and John (<a href=\"#\" onClick=\"return mV('Mat',27,56);\">Mat 27:56</a>), and probably the sister of Mary, the mother of our Lord (<a href=\"#\" onClick=\"return mV('Jhn',19,25);\">Jhn 19:25</a>). She sought for her sons places of honour in Christ's kingdom (<a href=\"#\" onClick=\"return mV('Mat',20,20,21);\">Mat 20:20-21</a>; <a href=\"#\" onClick=\"return mV('Mat',19,28);\">Mat 19:28</a>). She witnessed the crucifixion (<a href=\"#\" onClick=\"return mV('Mar',15,40);\">Mar 15:40</a>), and was present with the other women at the sepulchre (<a href=\"#\" onClick=\"return mV('Mat',27,56);\">Mat 27:56</a>).<br><br>(2.) \"The daughter of Herodias,\" not named in the New Testament. On the occasion of the birthday festival held by Herod Antipas, who had married her mother Herodias, in the fortress of Machaerus, she \"came in and danced, and pleased Herod\" (<a href=\"#\" onClick=\"return mV('Mar',6,'14-19');\">Mar 6:14-29</a>). John the Baptist, at that time a prisoner in the dungeons underneath the castle, was at her request beheaded by order of Herod, and his head given to the damsel in a charger, \"and the damsel gave it to her mother,\" whose revengeful spirit was thus gratified. \"A luxurious feast of the period\" (says Farrar, Life of Christ) \"was not regarded as complete unless it closed with some gross pantomimic representation; and doubtless Herod had adopted the evil fashion of his day. But he had not anticipated for his guests the rare luxury of seeing a princess, his own niece, a grand-daughter of Herod the Great and of Mariamne, a descendant, therefore, of Simon the high priest and the great line of Maccabean princes, a princess who afterwards became the wife of a tetrarch [Philip, tetrarch of Trachonitis] and the mother of a king, honouring them by degrading herself into a scenic dancer.\"";
eastonArray["$$T0003196"] = "<strong>Salt:</strong> used to season food (<a href=\"#\" onClick=\"return mV('Job',6,6);\">Job 6:6</a>), and mixed with the fodder of cattle (<a href=\"#\" onClick=\"return mV('Isa',30,24);\">Isa 30:24</a>, \"clean; \" in marg. of R.V. \"salted\"). All meat-offerings were seasoned with salt (<a href=\"#\" onClick=\"return mV('Lev',2,13);\">Lev 2:13</a>). To eat salt with one is to partake of his hospitality, to derive subsistence from him; and hence he who did so was bound to look after his host's interests (<a href=\"#\" onClick=\"return mV('Ezr',4,14);\">Ezr 4:14</a>, \"We have maintenance from the king's palace; \" A.V. marg., \"We are salted with the salt of the palace; \" R.V., \"We eat the salt of the palace\").<br><br>A \"covenant of salt\" (<a href=\"#\" onClick=\"return mV('Num',18,19);\">Num 18:19</a>; <a href=\"#\" onClick=\"return mV('2Ch',13,5);\">2Ch 13:5</a>) was a covenant of perpetual obligation. New-born children were rubbed with salt (<a href=\"#\" onClick=\"return mV('Eze',16,4);\">Eze 16:4</a>). Disciples are likened unto salt, with reference to its cleansing and preserving uses (<a href=\"#\" onClick=\"return mV('Mat',5,13);\">Mat 5:13</a>). When Abimelech took the city of Shechem, he sowed the place with salt, that it might always remain a barren soil (<a href=\"#\" onClick=\"return mV('Jdg',9,45);\">Jdg 9:45</a>). Sir Lyon Playfair argues, on scientific grounds, that under the generic name of \"salt,\" in certain passages, we are to understand petroleum or its residue asphalt. Thus in <a href=\"#\" onClick=\"return mV('Gen',19,26);\">Gen 19:26</a> he would read \"pillar of asphalt;\" and in <a href=\"#\" onClick=\"return mV('Mat',5,13);\">Mat 5:13</a>, instead of \"salt,\" \"petroleum,\" which loses its essence by exposure, as salt does not, and becomes asphalt, with which pavements were made.<br><br>The Jebel Usdum, to the south of the Dead Sea, is a mountain of rock salt about 7 miles long and from 2 to 3 miles wide and some hundreds of feet high.";
eastonArray["$$T0003197"] = "<strong>Salt Sea:</strong> (<a href=\"#\" onClick=\"return mV('Jos',3,16);\">Jos 3:16</a>). See <a href=\"#\" onClick=\"return doDictLookup ('ET0000991');\">DEAD SEA</a>.";
eastonArray["$$T0003198"] = "<strong>Salt, The city of:</strong> one of the cities of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,62);\">Jos 15:62</a>), probably in the Valley of Salt, at the southern end of the Dead Sea.";
eastonArray["$$T0003199"] = "<strong>Salt, Valley of:</strong> a place where it is said David smote the Syrians (<a href=\"#\" onClick=\"return mV('2Sa',8,13);\">2Sa 8:13</a>). This valley (the' Arabah) is between Judah and Edom on the south of the Dead Sea. Hence some interpreters would insert the words, \"and he smote Edom,\" after the words, \"Syrians\" in the above text. It is conjectured that while David was leading his army against the Ammonites and Syrians, the Edomites invaded the south of Judah, and that David sent Joab or Abishai against them, who drove them back and finally subdued Edom. (Comp. title to <a href=\"#\" onClick=\"return mV('Psa',60,'1-');\">Psa 60</a>.)<br><br>Here also Amaziah \"slew of Edom ten thousand men\" (<a href=\"#\" onClick=\"return mV('2Ki',14,7);\">2Ki 14:7</a>; <a href=\"#\" onClick=\"return mV('2Ki',8,'20-22');\">2Ki 8:20-22</a> and <a href=\"#\" onClick=\"return mV('2Ch',25,'5-11');\">2 Chr. 25:5-11</a>).";
</script>
