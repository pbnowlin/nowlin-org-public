<script>
var eastonArray = new Array ();
eastonArray["$$T0003300"] = "<strong>Shadow:</strong> used in <a href=\"#\" onClick=\"return mV('Col',2,17);\">Col 2:17</a>; <a href=\"#\" onClick=\"return mV('Hbr',8,5);\">Hbr 8:5</a>; <a href=\"#\" onClick=\"return mV('Hbr',10,1);\">10:1</a> to denote the typical relation of the Jewish to the Christian dispensation.";
eastonArray["$$T0003301"] = "<strong>Shadrach:</strong> Aku's command, the Chaldean name given to Hananiah, one of the Hebrew youths whom Nebuchadnezzar carried captive to Babylon (<a href=\"#\" onClick=\"return mV('Dan',1,6,7);\">Dan 1:6-7</a>; <a href=\"#\" onClick=\"return mV('Dan',3,'12-30');\">3:12-30</a>). He and his two companions refused to bow down before the image which Nebuchadnezzar had set up on the plains of Dura. Their conduct filled the king with the greatest fury, and he commanded them to be cast into the burning fiery furnace. Here, amid the fiery flames, they were miraculously preserved from harm. Over them the fire had no power, \"neither was a hair of their head singed, neither had the smell of fire passed on them.\" Thus Nebuchadnezzar learned the greatness of the God of Israel. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000014');\">ABEDNEGO</a>.)";
eastonArray["$$T0003302"] = "<strong>Shalem:</strong> perfect, a place (probably the village of Salim) some 2 miles east of Jacob's well. There is an abundant supply of water, which may have been the reason for Jacob's settling at this place (<a href=\"#\" onClick=\"return mV('Gen',33,'18-20');\">Gen 33:18-20</a>). The Revised Version translates this word, and reads, \"Jacob came in peace to the city of Shechem,\" thus not regarding it as a proper name at all.";
eastonArray["$$T0003303"] = "<strong>Shalim, Land of:</strong> land of foxes, a place apparently to the north-west of Jerusalem (<a href=\"#\" onClick=\"return mV('1Sa',9,4);\">1Sa 9:4</a>), perhaps in the neighbourhood of Shaalabbin in Dan (<a href=\"#\" onClick=\"return mV('Jos',19,42);\">Jos 19:42</a>).";
eastonArray["$$T0003304"] = "<strong>Shalisha, Land of:</strong> probably the district of Baal-shalisha (<a href=\"#\" onClick=\"return mV('2Ki',4,42);\">2Ki 4:42</a>), lying about 12 miles north of Lydda (<a href=\"#\" onClick=\"return mV('1Sa',9,4);\">1Sa 9:4</a>).";
eastonArray["$$T0003305"] = "<strong>Shallecheth, The gate of:</strong> i.e., \"the gate of casting out,\" hence supposed to be the refuse gate; one of the gates of the house of the Lord, \"by the causeway of the going up\" i.e., the causeway rising up from the Tyropoeon valley = valley of the cheesemakers (<a href=\"#\" onClick=\"return mV('1Ch',26,16);\">1Ch 26:16</a>).";
eastonArray["$$T0003306"] = "<strong>Shallum:</strong> retribution.<br><br>(1.) The son of Jabesh, otherwise unknown. He \"conspired against Zachariah, and smote him before the people, and slew him, and reigned in his stead\" (<a href=\"#\" onClick=\"return mV('2Ki',15,10);\">2Ki 15:10</a>). He reigned only \"a month of days in Samaria\" (<a href=\"#\" onClick=\"return mV('2Ki',15,13);\">15:13</a>, marg.). Menahem rose up against Shallum and put him to death (<a href=\"#\" onClick=\"return mV('2Ki',15,14,15,17);\">2Ki 15:14-15, 17</a>), and became king in his stead.<br><br>(2.) Keeper of the temple vestments in the reign of Josiah (<a href=\"#\" onClick=\"return mV('2Ki',22,14);\">2Ki 22:14</a>).<br><br>(3.) One of the posterity of Judah (<a href=\"#\" onClick=\"return mV('1Ch',2,40,41);\">1Ch 2:40-41</a>).<br><br>(4.) A descendant of Simeon (<a href=\"#\" onClick=\"return mV('1Ch',4,25);\">1Ch 4:25</a>).<br><br>(5.) One of the line of the high priests (<a href=\"#\" onClick=\"return mV('1Ch',6,13);\">1Ch 6:13</a>).<br><br>(6.) <a href=\"#\" onClick=\"return mV('1Ch',7,13);\">1Ch 7:13</a>.<br><br>(7.) A keeper of the gate in the reign of David (<a href=\"#\" onClick=\"return mV('1Ch',9,17);\">1Ch 9:17</a>).<br><br>(8.) A Levite porter (<a href=\"#\" onClick=\"return mV('1Ch',9,19,31);\">1Ch 9:19, 31</a>; <a href=\"#\" onClick=\"return mV('Jer',35,4);\">Jer 35:4</a>).<br><br>(9.) An Ephraimite chief (<a href=\"#\" onClick=\"return mV('2Ch',28,12);\">2Ch 28:12</a>).<br><br>(10.) The uncle of the prophet Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',32,7);\">Jer 32:7</a>).<br><br>(11.) A son of king Josiah (<a href=\"#\" onClick=\"return mV('1Ch',3,15);\">1Ch 3:15</a>; <a href=\"#\" onClick=\"return mV('Jer',22,11);\">Jer 22:11</a>), who was elected to succeed his father on the throne, although he was two years younger than his brother Eliakim. He assumed the crown under the name of Jehoahaz (q.v.). He did not imitate the example of his father (<a href=\"#\" onClick=\"return mV('2Ki',23,32);\">2Ki 23:32</a>), but was \"a young lion, and it learned to catch the prey; it devoured men\" (<a href=\"#\" onClick=\"return mV('Eze',19,3);\">Eze 19:3</a>). His policy was anti-Egyptian therefore. Necho, at that time at Riblah, sent an army against Jerusalem, which at once yielded, and Jehoahaz was carried captive to the Egyptian camp, Eliakim being appointed king in his stead. He remained a captive in Egypt till his death, and was the first king of Judah that died in exile.";
eastonArray["$$T0003307"] = "<strong>Shalman:</strong> an Assyrian king (<a href=\"#\" onClick=\"return mV('Hsa',10,14);\">Hsa 10:14</a>), identified with Shalmaneser II. (Sayce) or IV. (Lenormant), the successor of Pul on the throne of Assyria (B.C. 728). He made war against Hoshea, the king of Israel, whom he subdued and compelled to pay an annual tribute. Hoshea, however, soon after rebelled against his Assyrian conquerer. Shalmaneser again marched against Samaria, which, after a siege of three years, was taken (<a href=\"#\" onClick=\"return mV('2Ki',17,'3-5');\">2Ki 17:3-5</a>; <a href=\"#\" onClick=\"return mV('2Ki',18,9);\">18:9</a>) by Sargon (q.v.). A revolution meantime had broken out in Assyria, and Shalmaneser was deposed. Sargon usurped the vacant throne. Schrader thinks that this is probably the name of a king of Moab mentioned on an inscription of Tiglath-pileser as Salamanu.";
eastonArray["$$T0003308"] = "<strong>Shamgar:</strong> The Philistines from the maritime plain had made incursions into the Hebrew upland for the purposes of plunder, when one of this name, the son of Anath, otherwise unknown, headed a rising for the purpose of freeing the land from this oppression. He repelled the invasion, slaying 600 men with an \"ox goad\" (q.v.). The goad was a formidable sharpointed instrument, sometimes ten feet long. He was probably contemporary for a time with Deborah and Barak (<a href=\"#\" onClick=\"return mV('Jdg',3,31);\">Jdg 3:31</a>; <a href=\"#\" onClick=\"return mV('Jdg',5,6);\">5:6</a>).";
eastonArray["$$T0003309"] = "<strong>Shamir:</strong> a sharp thorn.<br><br>(1.) One of the sons of Michah (<a href=\"#\" onClick=\"return mV('1Ch',24,24);\">1Ch 24:24</a>).<br><br>(2.) A town among the mountains of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,48);\">Jos 15:48</a>); probably Somerah, 2 1/2 miles north-west of Debir.<br><br>(3.) The residence of Tola, one of the judges, on Mount Ephraim (<a href=\"#\" onClick=\"return mV('Jdg',10,1,2);\">Jdg 10:1-2</a>).";
eastonArray["$$T0003310"] = "<strong>Shammah:</strong> desert.<br><br>(1.) One of the \"dukes\" of Edom (<a href=\"#\" onClick=\"return mV('Gen',36,13,17);\">Gen 36:13, 17</a>).<br><br>(2.) One of the sons of Jesse (<a href=\"#\" onClick=\"return mV('1Sa',16,9);\">1Sa 16:9</a>). He is also called Shimeah (<a href=\"#\" onClick=\"return mV('2Sa',13,3);\">2Sa 13:3</a>) and Shimma (<a href=\"#\" onClick=\"return mV('1Ch',2,13);\">1Ch 2:13</a>).<br><br>(3.) One of David's three mighty men (<a href=\"#\" onClick=\"return mV('2Sa',23,11,12);\">2Sa 23:11-12</a>).<br><br>(4.) One of David's mighties (<a href=\"#\" onClick=\"return mV('2Sa',23,25);\">2Sa 23:25</a>); called also Shammoth (<a href=\"#\" onClick=\"return mV('1Ch',11,27);\">1Ch 11:27</a>) and Shamhuth (<a href=\"#\" onClick=\"return mV('1Ch',27,8);\">27:8</a>).";
eastonArray["$$T0003311"] = "<strong>Shammua:</strong> heard.<br><br>(1.) One of the spies sent out by Moses to search the land (<a href=\"#\" onClick=\"return mV('Num',13,4);\">Num 13:4</a>). He represented the tribe of Reuben.<br><br>(2.) One of David's sons (<a href=\"#\" onClick=\"return mV('1Ch',14,4);\">1Ch 14:4</a>; <a href=\"#\" onClick=\"return mV('1Ch',3,5);\">3:5</a>, \"Shimea; <a href=\"#\" onClick=\"return mV('2Sa',5,14);\">2Sa 5:14</a>).<br><br>(3.) A Levite under Nehemiah (<a href=\"#\" onClick=\"return mV('Neh',11,17);\">Neh 11:17</a>).";
eastonArray["$$T0003312"] = "<strong>Shaphan:</strong> a coney, a scribe or secretary of king Josiah (<a href=\"#\" onClick=\"return mV('2Ki',22,'3-7');\">2Ki 22:3-7</a>). He consulted Huldah concerning the newly-discovered copy of the law which was delivered to him by Hilkiah the priest (<a href=\"#\" onClick=\"return mV('2Ki',22,'8-14');\">8-14</a>). His grandson Gedaliah was governor of Judea (<a href=\"#\" onClick=\"return mV('2Ki',25,22);\">25:22</a>).";
eastonArray["$$T0003313"] = "<strong>Shaphat:</strong> judge.<br><br>(1.) One of the spies. He represented the tribe of Simeon (<a href=\"#\" onClick=\"return mV('Num',13,5);\">Num 13:5</a>).<br><br>(2.) The father of Elisha (<a href=\"#\" onClick=\"return mV('1Ki',19,'16-19');\">1Ki 19:16-19</a>).<br><br>(3.) One of David's chief herdsmen (<a href=\"#\" onClick=\"return mV('1Ch',27,29);\">1Ch 27:29</a>).";
eastonArray["$$T0003314"] = "<strong>Shapher:</strong> brightness, one of the stations where Israel encamped in the wilderness (<a href=\"#\" onClick=\"return mV('Num',33,'23-24');\">Num 33:23-24</a>).";
eastonArray["$$T0003315"] = "<strong>Sharaim:</strong> two gates (<a href=\"#\" onClick=\"return mV('Jos',15,36);\">Jos 15:36</a>), more correctly Shaaraim (<a href=\"#\" onClick=\"return mV('1Sa',17,52);\">1Sa 17:52</a>), probably Tell Zakariya and Kefr Zakariya, in the valley of Elah, 3 1/2 miles north-west of Socoh.";
eastonArray["$$T0003316"] = "<strong>Sharezer:</strong> (god) protect the king!, a son of Sennacherib, king of Assyria. He and his brother Adrammelech murdered their father, and then fled into the land of Armenia (<a href=\"#\" onClick=\"return mV('2Ki',19,37);\">2Ki 19:37</a>).";
eastonArray["$$T0003317"] = "<strong>Sharon, Saron:</strong> a plain, a level tract extending from the Mediterranean to the hill country to the west of Jerusalem, about 30 miles long and from 8 to 15 miles broad, celebrated for its beauty and fertility (<a href=\"#\" onClick=\"return mV('1Ch',27,29);\">1Ch 27:29</a>; <a href=\"#\" onClick=\"return mV('Isa',33,9);\">Isa 33:9</a>; <a href=\"#\" onClick=\"return mV('Isa',35,2);\">35:2</a>; <a href=\"#\" onClick=\"return mV('Isa',65,10);\">65:10</a>). The \"rose of Sharon\" is celebrated (<a href=\"#\" onClick=\"return mV('Sgs',2,1);\">Sgs 2:1</a>). It is called Lasharon (the article la being here a part of the word) in <a href=\"#\" onClick=\"return mV('Jos',12,18);\">Jos 12:18</a>.";
eastonArray["$$T0003318"] = "<strong>Shaveh-Kiriathaim:</strong> plain of Kirja-thaim where Chedorlaomer defeated the Emims, the original inhabitants (<a href=\"#\" onClick=\"return mV('Gen',14,5);\">Gen 14:5</a>). Now Kureiyat, north of Dibon, in the land of Moab.";
eastonArray["$$T0003319"] = "<strong>Shaveh, Valley of:</strong> valley of the plain the ancient name of the \"king's dale\" (q.v.), or Kidron, on the north side of Jerusalem (<a href=\"#\" onClick=\"return mV('Gen',14,17);\">Gen 14:17</a>).";
eastonArray["$$T0003320"] = "<strong>Shavsha:</strong> (<a href=\"#\" onClick=\"return mV('2Sa',8,17);\">2Sa 8:17</a>; <a href=\"#\" onClick=\"return mV('1Ki',4,3);\">1Ki 4:3</a>), one of David's secretaries (<a href=\"#\" onClick=\"return mV('1Ch',18,16);\">1Ch 18:16</a>).";
eastonArray["$$T0003321"] = "<strong>Shealtiel:</strong> asked for of God, father of Zerubbabel (<a href=\"#\" onClick=\"return mV('Ezr',3,2,8);\">Ezr 3:2, 8</a>; <a href=\"#\" onClick=\"return mV('Neh',12,1);\">Neh 12:1</a>).";
eastonArray["$$T0003322"] = "<strong>Shearing-house:</strong> (<a href=\"#\" onClick=\"return mV('2Ki',10,12,14);\">2Ki 10:12, 14</a>; marg., \"house of shepherds binding sheep.\" R.V., \"the shearing-house of the shepherds; \" marg., \"house of gathering\"), some place between Samaria and Jezreel, where Jehu slew \"two and forty men\" of the royal family of Judah. The Heb. word Beth-eked so rendered is supposed by some to be a proper name.";
eastonArray["$$T0003323"] = "<strong>Shear-Jashub:</strong> a remnant shall escape or return (i.e., to God), a symbolical name which the prophet Isaiah gave to his son (<a href=\"#\" onClick=\"return mV('Isa',7,3);\">Isa 7:3</a>), perhaps his eldest son.";
eastonArray["$$T0003324"] = "<strong>Sheba:</strong> an oath, seven.<br><br>(1.) Heb. shebha, the son of Raamah (<a href=\"#\" onClick=\"return mV('Gen',10,7);\">Gen 10:7</a>), whose descendants settled with those of Dedan on the Persian Gulf.<br><br>(2.) Heb. id. A son of Joktan (<a href=\"#\" onClick=\"return mV('Gen',10,28);\">Gen 10:28</a>), probably the founder of the Sabeans.<br><br>(3.) Heb. id. A son of Jokshan, who was a son of Abraham by Keturah (<a href=\"#\" onClick=\"return mV('Gen',25,3);\">Gen 25:3</a>).<br><br>(4.) Heb. id. A kingdom in Arabia Felix. Sheba, in fact, was Saba in Southern Arabia, the Sabaeans of classical geography, who carried on the trade in spices with the other peoples of the ancient world. They were Semites, speaking one of the two main dialects of Himyaritic or South Arabic. Sheba had become a monarchy before the days of Solomon. Its queen brought him gold, spices, and precious stones (<a href=\"#\" onClick=\"return mV('1Ki',10,'1-13');\">1Ki 10:1-13</a>). She is called by our Lord the \"queen of the south\" (<a href=\"#\" onClick=\"return mV('Mat',12,42);\">Mat 12:42</a>).<br><br>(5.) Heb. shebha', \"seven\" or \"an oak.\" A town of Simeon (<a href=\"#\" onClick=\"return mV('Jos',19,2);\">Jos 19:2</a>).<br><br>(6.) Heb. id. A \"son of Bichri,\" of the family of Becher, the son of Benjamin, and thus of the stem from which Saul was descended (<a href=\"#\" onClick=\"return mV('2Sa',20,'1-22');\">2Sa 20:1-22</a>). When David was returning to Jerusalem after the defeat of Absalom, a strife arose between the ten tribes and the tribe of Judah, because the latter took the lead in bringing back the king. Sheba took advantage of this state of things, and raised the standard of revolt, proclaiming, \"We have no part in David.\" With his followers he proceeded northward. David seeing it necessary to check this revolt, ordered Abishai to take the gibborim, \"mighty men,\" and the body-guard and such troops as he could gather, and pursue Sheba. Joab joined the expedition, and having treacherously put Amasa to death, assumed the command of the army. Sheba took refuge in Abel-Bethmaachah, a fortified town some miles north of Lake Merom. While Joab was engaged in laying siege to this city, Sheba's head was, at the instigation of a \"wise woman\" who had held a parley with him from the city walls, thrown over the wall to the besiegers, and thus the revolt came to an end.";
eastonArray["$$T0003325"] = "<strong>Shebaniah:</strong> whom Jehovah hides, or has made grow up.<br><br>(1.) A Levite appointed to blow the trumpet before the ark of God (<a href=\"#\" onClick=\"return mV('1Ch',15,24);\">1Ch 15:24</a>).<br><br>(2.) Another Levite (<a href=\"#\" onClick=\"return mV('Neh',9,4,5);\">Neh 9:4-5</a>).<br><br>(3.) A priest (<a href=\"#\" onClick=\"return mV('Neh',10,12);\">Neh 10:12</a>).<br><br>(4.) A Levite (<a href=\"#\" onClick=\"return mV('Neh',10,4);\">Neh 10:4</a>).";
eastonArray["$$T0003326"] = "<strong>Shebarim:</strong> breaks; ruins, a place near Ai (<a href=\"#\" onClick=\"return mV('Jos',7,5);\">Jos 7:5</a>; R.V. marg., \"the quarries\").";
eastonArray["$$T0003327"] = "<strong>Shebna:</strong> tender youth, \"treasurer\" over the house in the reign of Hezekiah, i.e., comptroller or governor of the palace. On account of his pride he was ejected from his office, and Eliakim was promoted to it (<a href=\"#\" onClick=\"return mV('Isa',22,'15-25');\">Isa 22:15-25</a>). He appears to have been the leader of the party who favoured an alliance with Egypt against Assyria. It is conjectured that \"Shebna the scribe,\" who was one of those whom the king sent to confer with the Assyrian ambassador (<a href=\"#\" onClick=\"return mV('2Ki',18,18,26,37);\">2Ki 18:18, 26, 37</a>; <a href=\"#\" onClick=\"return mV('2Ki',19,2);\">19:2</a>; <a href=\"#\" onClick=\"return mV('Isa',36,3,11,22);\">Isa 36:3, 11, 22</a>; <a href=\"#\" onClick=\"return mV('Isa',37,2);\">37:2</a>), was a different person.";
eastonArray["$$T0003328"] = "<strong>Shebuel:</strong> captive of God.<br><br>(1.) One of the descendants of Gershom, who had charge of the temple treasures in the time of David (<a href=\"#\" onClick=\"return mV('1Ch',23,16);\">1Ch 23:16</a>; <a href=\"#\" onClick=\"return mV('1Ch',26,24);\">26:24</a>).<br><br>(2.) One of the sons of Heman; one of those whose duty it was to \"lift up the horn\" in the temple service (<a href=\"#\" onClick=\"return mV('1Ch',25,4,5);\">1Ch 25:4-5</a>); called also Shubael (ver. <a href=\"#\" onClick=\"return mV('1Ch',25,20);\">20</a>).";
eastonArray["$$T0003329"] = "<strong>Shecaniah:</strong> one intimate with Jehovah.<br><br>(1.) A priest to whom the tenth lot came forth when David divided the priests (<a href=\"#\" onClick=\"return mV('1Ch',24,11);\">1Ch 24:11</a>).<br><br>(2.) One of the priests who were set \"to give to their brethren by courses\" of the daily portion (<a href=\"#\" onClick=\"return mV('2Ch',31,15);\">2Ch 31:15</a>).<br><br>Shechani'ah, id.<br><br>(1.) A priest whose sons are mentioned in <a href=\"#\" onClick=\"return mV('1Ch',3,21,22);\">1Ch 3:21-22</a>.<br><br>(2.) <a href=\"#\" onClick=\"return mV('Ezr',8,5);\">Ezr 8:5</a>.<br><br>(3.) <a href=\"#\" onClick=\"return mV('Ezr',10,'2-4');\">Ezr 10:2-4</a>.<br><br>(4.) The father of Shemaiah, who repaired the wall of Jerusalem (<a href=\"#\" onClick=\"return mV('Neh',3,29);\">Neh 3:29</a>).<br><br>(5.) The father-in-law of Tobiah (<a href=\"#\" onClick=\"return mV('Neh',6,18);\">Neh 6:18</a>).<br><br>(6.) A priest who returned from the Captivity with Zerubbabel (<a href=\"#\" onClick=\"return mV('Neh',12,3);\">Neh 12:3</a>; marg., or Shebaniah).";
eastonArray["$$T0003330"] = "<strong>Shechem:</strong> shoulder.<br><br>(1.) The son of Hamor the Hivite (<a href=\"#\" onClick=\"return mV('Gen',33,19);\">Gen 33:19</a>; <a href=\"#\" onClick=\"return mV('Gen',34,'1-');\">34</a>).<br><br>(2.) A descendant of Manasseh (<a href=\"#\" onClick=\"return mV('Num',26,31);\">Num 26:31</a>; <a href=\"#\" onClick=\"return mV('Jos',17,2);\">Jos 17:2</a>).<br><br>(3.) A city in Samaria (<a href=\"#\" onClick=\"return mV('Gen',33,18);\">Gen 33:18</a>), called also Sichem (<a href=\"#\" onClick=\"return mV('Gen',12,6);\">12:6</a>), Sychem (<a href=\"#\" onClick=\"return mV('Act',7,16);\">Act 7:16</a>). It stood in the narrow sheltered valley between Ebal on the north and Gerizim on the south, these mountains at their base being only some 500 yards apart. Here Abraham pitched his tent and built his first altar in the Promised Land, and received the first divine promise (<a href=\"#\" onClick=\"return mV('Gen',12,6,7);\">Gen 12:6-7</a>). Here also Jacob \"bought a parcel of a field at the hands of the children of Hamor\" after his return from Mesopotamia, and settled with his household, which he purged from idolatry by burying the teraphim of his followers under an oak tree, which was afterwards called \"the oak of the sorcerer\" (<a href=\"#\" onClick=\"return mV('Gen',33,19);\">Gen 33:19</a>; <a href=\"#\" onClick=\"return mV('Gen',35,4);\">35:4</a>; <a href=\"#\" onClick=\"return mV('Jdg',9,37);\">Jdg 9:37</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002483');\">MEONENIM</a>.) Here too, after a while, he dug a well, which bears his name to this day (<a href=\"#\" onClick=\"return mV('Jhn',4,5,'39-42');\">Jhn 4:5, 39-42</a>). To Shechem Joshua gathered all Israel \"before God,\" and delivered to them his second parting address (<a href=\"#\" onClick=\"return mV('Jos',24,'1-15');\">Jos 24:1-15</a>). He \"made a covenant with the people that day\" at the very place where, on first entering the land, they had responded to the law from Ebal and Gerizim (<a href=\"#\" onClick=\"return mV('Jos',24,25);\">Jos 24:25</a>), the terms of which were recorded \"in the book of the law of God\", i.e., in the roll of the law of Moses; and in memory of this solemn transaction a great stone was set up \"under an oak\" (<a href=\"#\" onClick=\"return mV('Gen',28,18);\">Gen 28:18</a>; <a href=\"#\" onClick=\"return mV('Gen',31,'44-48');\">31:44-48</a>; <a href=\"#\" onClick=\"return mV('Exd',24,4);\">Exd 24:4</a>; <a href=\"#\" onClick=\"return mV('Jos',4,3,8,9);\">Jos 4:3, 8-9</a>), possibly the old \"oak of Moreh,\" as a silent witness of the transaction to all coming time.<br><br>Shechem became one of the cities of refuge, the central city of refuge for Western Palestine (<a href=\"#\" onClick=\"return mV('Jos',20,7);\">Jos 20:7</a>), and here the bones of Joseph were buried (<a href=\"#\" onClick=\"return mV('Jos',24,32);\">24:32</a>). Rehoboam was appointed king in Shechem (<a href=\"#\" onClick=\"return mV('1Ki',12,1,19);\">1Ki 12:1, 19</a>), but Jeroboam afterwards took up his residence here. This city is mentioned in connection with our Lord's conversation with the woman of Samaria (<a href=\"#\" onClick=\"return mV('Jhn',4,5);\">Jhn 4:5</a>); and thus, remaining as it does to the present day, it is one of the oldest cities of the world. It is the modern Nablus, a contraction for Neapolis, the name given to it by Vespasian. It lies about a mile and a half up the valley on its southern slope, and on the north of Gerizim, which rises about 1,100 feet above it, and is about 34 miles north of Jerusalem. It contains about 10,000 inhabitants, of whom about 160 are Samaritans and 100 Jews, the rest being Christians and Mohammedans.<br><br>The site of Shechem is said to be of unrivalled beauty. Stanley says it is \"the most beautiful, perhaps the only very beautiful, spot in Central Palestine.\"<br><br>Gaza, near Shechem, only mentioned <a href=\"#\" onClick=\"return mV('1Ch',7,28);\">1Ch 7:28</a>, has entirely disappeared. It was destroyed at the time of the Conquest, and its place was taken by Shechem. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003542');\">SYCHAR</a>.)";
eastonArray["$$T0003331"] = "<strong>Shechinah:</strong> a Chaldee word meaning resting-place, not found in Scripture, but used by the later Jews to designate the visible symbol of God's presence in the tabernacle, and afterwards in Solomon's temple. When the Lord led Israel out of Egypt, he went before them \"in a pillar of a cloud.\" This was the symbol of his presence with his people. For references made to it during the wilderness wanderings, see <a href=\"#\" onClick=\"return mV('Exd',14,20);\">Exd 14:20</a>; <a href=\"#\" onClick=\"return mV('Exd',40,'34-38');\">40:34-38</a>; <a href=\"#\" onClick=\"return mV('Lev',9,23,24);\">Lev 9:23-24</a>; <a href=\"#\" onClick=\"return mV('Num',14,10);\">Num 14:10</a>; <a href=\"#\" onClick=\"return mV('Num',16,19,42);\">16:19, 42</a>.<br><br>It is probable that after the entrance into Canaan this glory-cloud settled in the tabernacle upon the ark of the covenant in the most holy place. We have, however, no special reference to it till the consecration of the temple by Solomon, when it filled the whole house with its glory, so that the priests could not stand to minister (<a href=\"#\" onClick=\"return mV('1Ki',8,'10-13');\">1Ki 8:10-13</a>; <a href=\"#\" onClick=\"return mV('2Ch',5,13,14);\">2Ch 5:13-14</a>; <a href=\"#\" onClick=\"return mV('2Ch',7,'1-3');\">7:1-3</a>). Probably it remained in the first temple in the holy of holies as the symbol of Jehovah's presence so long as that temple stood. It afterwards disappeared. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000849');\">CLOUD</a>.)";
eastonArray["$$T0003332"] = "<strong>Sheep:</strong> are of different varieties. Probably the flocks of Abraham and Isaac were of the wild species found still in the mountain regions of Persia and Kurdistan. After the Exodus, and as a result of intercourse with surrounding nations, other species were no doubt introduced into the herds of the people of Israel. They are frequently mentioned in Scripture. The care of a shepherd over his flock is referred to as illustrating God's care over his people (<a href=\"#\" onClick=\"return mV('Psa',23,1,2);\">Psa 23:1-2</a>; <a href=\"#\" onClick=\"return mV('Psa',74,1);\">74:1</a>; <a href=\"#\" onClick=\"return mV('Psa',77,20);\">77:20</a>; <a href=\"#\" onClick=\"return mV('Isa',40,11);\">Isa 40:11</a>; <a href=\"#\" onClick=\"return mV('Isa',53,6);\">53:6</a>; <a href=\"#\" onClick=\"return mV('Jhn',10,'1-5','7-16');\">Jhn 10:1-5, 7-16</a>).<br><br>\"The sheep of Palestine are longer in the head than ours, and have tails from 5 inches broad at the narrowest part to 15 inches at the widest, the weight being in proportion, and ranging generally from 10 to 14 lbs., but sometimes extending to 30 lbs. The tails are indeed huge masses of fat\" (Geikie's Holy Land, etc.). The tail was no doubt the \"rump\" so frequently referred to in the Levitical sacrifices (<a href=\"#\" onClick=\"return mV('Exd',29,22);\">Exd 29:22</a>; <a href=\"#\" onClick=\"return mV('Lev',3,9);\">Lev 3:9</a>; <a href=\"#\" onClick=\"return mV('Lev',7,3);\">7:3</a>; <a href=\"#\" onClick=\"return mV('Lev',9,19);\">9:19</a>). Sheep-shearing was generally an occasion of great festivity (<a href=\"#\" onClick=\"return mV('Gen',31,19);\">Gen 31:19</a>; <a href=\"#\" onClick=\"return mV('Gen',38,12,13);\">38:12-13</a>; <a href=\"#\" onClick=\"return mV('1Sa',25,'4-8',36);\">1Sa 25:4-8, 36</a>; <a href=\"#\" onClick=\"return mV('2Sa',13,'23-28');\">2Sa 13:23-28</a>).";
eastonArray["$$T0003333"] = "<strong>Sheep-fold:</strong> a strong fenced enclosure for the protection of the sheep gathered within it (<a href=\"#\" onClick=\"return mV('Num',32,24);\">Num 32:24</a>; <a href=\"#\" onClick=\"return mV('1Ch',17,7);\">1Ch 17:7</a>; <a href=\"#\" onClick=\"return mV('Psa',50,9);\">Psa 50:9</a>; <a href=\"#\" onClick=\"return mV('Psa',78,70);\">78:70</a>). In <a href=\"#\" onClick=\"return mV('Jhn',10,16);\">Jhn 10:16</a> the Authorized Version renders by \"fold\" two distinct Greek words, aule and poimne, the latter of which properly means a \"flock,\" and is so rendered in the Revised Version. (See also <a href=\"#\" onClick=\"return mV('Mat',26,31);\">Mat 26:31</a>; <a href=\"#\" onClick=\"return mV('Luk',2,8);\">Luk 2:8</a>; <a href=\"#\" onClick=\"return mV('1Cr',9,7);\">1Cr 9:7</a>.) (See <a href=\"#\" onClick=\"return doDictLookup ('ET0001365');\">FOLD</a>.)";
eastonArray["$$T0003334"] = "<strong>Sheep-gate:</strong> one of the gates of Jerusalem mentioned by Nehemiah (<a href=\"#\" onClick=\"return mV('Neh',3,1,32);\">Neh 3:1, 32</a>; <a href=\"#\" onClick=\"return mV('Neh',12,39);\">12:39</a>). It was in the eastern wall of the city.";
eastonArray["$$T0003335"] = "<strong>Sheep-market:</strong> occurs only in <a href=\"#\" onClick=\"return mV('Jhn',5,2);\">Jhn 5:2</a> (marg., also R.V., \"sheep-gate\"). The word so rendered is an adjective, and it is uncertain whether the noun to be supplied should be \"gate\" or, following the Vulgate Version, \"pool.\"";
eastonArray["$$T0003336"] = "<strong>Shekel:</strong> weight, the common standard both of weight and value among the Hebrews. It is estimated at 220 English grains, or a little more than half an ounce avoirdupois. The \"shekel of the sanctuary\" (<a href=\"#\" onClick=\"return mV('Exd',30,13);\">Exd 30:13</a>; <a href=\"#\" onClick=\"return mV('Num',3,47);\">Num 3:47</a>) was equal to twenty gerahs (<a href=\"#\" onClick=\"return mV('Eze',45,12);\">Eze 45:12</a>). There were shekels of gold (<a href=\"#\" onClick=\"return mV('1Ch',21,25);\">1Ch 21:25</a>), of silver (<a href=\"#\" onClick=\"return mV('1Sa',9,8);\">1Sa 9:8</a>), of brass (<a href=\"#\" onClick=\"return mV('1Sa',17,5);\">17:5</a>), and of iron (<a href=\"#\" onClick=\"return mV('1Sa',17,7);\">7</a>). When it became a coined piece of money, the shekel of gold was equivalent to about 2 pound of our money. Six gold shekels, according to the later Jewish system, were equal in value to fifty silver ones.<br><br>The temple contribution, with which the public sacrifices were bought (<a href=\"#\" onClick=\"return mV('Exd',30,13);\">Exd 30:13</a>; <a href=\"#\" onClick=\"return mV('2Ch',24,6);\">2Ch 24:6</a>), consisted of one common shekel, or a sanctuary half-shekel, equal to two Attic drachmas. The coin, a stater (q.v.), which Peter found in the fish's mouth paid this contribution for both him and Christ (<a href=\"#\" onClick=\"return mV('Mat',17,24,27);\">Mat 17:24, 27</a>). A zuza, or quarter of a shekel, was given by Saul to Samuel (<a href=\"#\" onClick=\"return mV('1Sa',9,8);\">1Sa 9:8</a>).";
eastonArray["$$T0003337"] = "<strong>Shelah:</strong> petition.<br><br>(1.) Judah's third son (<a href=\"#\" onClick=\"return mV('Gen',38,2,5,11,14);\">Gen 38:2, 5, 11, 14</a>).<br><br>(2.) A son of Arphaxad (<a href=\"#\" onClick=\"return mV('1Ch',1,18);\">1Ch 1:18</a>).";
eastonArray["$$T0003338"] = "<strong>Shelemiah:</strong> whom Jehovah repays.<br><br>(1.) <a href=\"#\" onClick=\"return mV('Ezr',10,39);\">Ezr 10:39</a>.<br><br>(2.) The father of Hananiah (<a href=\"#\" onClick=\"return mV('Neh',3,30);\">Neh 3:30</a>).<br><br>(3.) A priest in the time of Nehemiah (<a href=\"#\" onClick=\"return mV('Neh',13,13);\">Neh 13:13</a>).<br><br>(4.) Father of one of those who accused Jeremiah to Zedekiah (<a href=\"#\" onClick=\"return mV('Jer',37,3);\">Jer 37:3</a>; <a href=\"#\" onClick=\"return mV('Jer',38,1);\">38:1</a>).<br><br>(5.) Father of a captain of the ward (<a href=\"#\" onClick=\"return mV('Jer',37,13);\">Jer 37:13</a>).<br><br>(6.) <a href=\"#\" onClick=\"return mV('Jer',36,14);\">Jer 36:14</a>.";
eastonArray["$$T0003339"] = "<strong>Shem:</strong> a name; renown, the first mentioned of the sons of Noah (<a href=\"#\" onClick=\"return mV('Gen',5,32);\">Gen 5:32</a>; <a href=\"#\" onClick=\"return mV('Gen',6,10);\">6:10</a>). He was probably the eldest of Noah's sons. The words \"brother of Japheth the elder\" in <a href=\"#\" onClick=\"return mV('Gen',10,21);\">Gen 10:21</a> are more correctly rendered \"the elder brother of Japheth,\" as in the Revised Version. Shem's name is generally mentioned first in the list of Noah's sons. He and his wife were saved in the ark (<a href=\"#\" onClick=\"return mV('Gen',7,13);\">7:13</a>). Noah foretold his preeminence over Canaan (<a href=\"#\" onClick=\"return mV('Gen',9,'23-27');\">9:23-27</a>). He died at the age of six hundred years, having been for many years contemporary with Abraham, according to the usual chronology. The Israelitish nation sprang from him (<a href=\"#\" onClick=\"return mV('Gen',11,'10-26');\">Gen 11:10-26</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,'24-27');\">1Ch 1:24-27</a>).";
eastonArray["$$T0003340"] = "<strong>Shema:</strong> rumour.<br><br>(1.) A Reubenite (<a href=\"#\" onClick=\"return mV('1Ch',5,8);\">1Ch 5:8</a>).<br><br>(2.) A Benjamite (<a href=\"#\" onClick=\"return mV('1Ch',8,13);\">1Ch 8:13</a>).<br><br>(3.) One who stood by Ezra when he read the law (<a href=\"#\" onClick=\"return mV('Neh',8,4);\">Neh 8:4</a>).<br><br>(4.) A town in the south of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,26);\">Jos 15:26</a>); the same as Sheba (ver. 5).";
eastonArray["$$T0003341"] = "<strong>Shemaah:</strong> rumour, a Benjamite whose sons \"came to David to Ziklag\" (<a href=\"#\" onClick=\"return mV('1Ch',12,3);\">1Ch 12:3</a>).";
eastonArray["$$T0003342"] = "<strong>Shemaiah:</strong> whom Jehovah heard.<br><br>(1.) A prophet in the reign of Rehoboam (<a href=\"#\" onClick=\"return mV('1Ki',12,'22-24');\">1Ki 12:22-24</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('Neh',3,29);\">Neh 3:29</a>.<br><br>(3.) A Simeonite (<a href=\"#\" onClick=\"return mV('1Ch',4,37);\">1Ch 4:37</a>).<br><br>(4.) A priest (<a href=\"#\" onClick=\"return mV('Neh',12,42);\">Neh 12:42</a>).<br><br>(5.) A Levite (<a href=\"#\" onClick=\"return mV('1Ch',9,16);\">1Ch 9:16</a>).<br><br>(6.) <a href=\"#\" onClick=\"return mV('1Ch',9,14);\">1Ch 9:14</a>; <a href=\"#\" onClick=\"return mV('Neh',11,15);\">Neh 11:15</a>.<br><br>(7.) A Levite in the time of David, who with 200 of his brethren took part in the bringing up of the ark from Obed-edom to Hebron (<a href=\"#\" onClick=\"return mV('1Ch',15,8);\">1Ch 15:8</a>).<br><br>(8.) A Levite (<a href=\"#\" onClick=\"return mV('1Ch',24,6);\">1Ch 24:6</a>).<br><br>(9.) The eldest son of Obed-edom (<a href=\"#\" onClick=\"return mV('1Ch',26,'4-8');\">1Ch 26:4-8</a>).<br><br>(10.) A Levite (<a href=\"#\" onClick=\"return mV('2Ch',29,14);\">2Ch 29:14</a>).<br><br>(11.) A false prophet who hindered the rebuilding of Jerusalem (<a href=\"#\" onClick=\"return mV('Neh',6,10);\">Neh 6:10</a>).<br><br>(12.) A prince of Judah who assisted at the dedication of the wall of Jerusalem (<a href=\"#\" onClick=\"return mV('Neh',12,'34-36');\">Neh 12:34-36</a>).<br><br>(13.) A false prophet who opposed Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',29,'24-32');\">Jer 29:24-32</a>).<br><br>(14.) One of the Levites whom Jehoshaphat appointed to teach the law (<a href=\"#\" onClick=\"return mV('2Ch',17,8);\">2Ch 17:8</a>).<br><br>(15.) A Levite appointed to \"distribute the oblations of the Lord\" (<a href=\"#\" onClick=\"return mV('2Ch',31,15);\">2Ch 31:15</a>).<br><br>(16.) A Levite (<a href=\"#\" onClick=\"return mV('2Ch',35,9);\">2Ch 35:9</a>).<br><br>(17.) The father of Urijah the prophet (<a href=\"#\" onClick=\"return mV('Jer',26,20);\">Jer 26:20</a>).<br><br>(18.) The father of a prince in the reign of Jehoiakim (<a href=\"#\" onClick=\"return mV('Jer',36,12);\">Jer 36:12</a>).";
eastonArray["$$T0003343"] = "<strong>Shemariah:</strong> whom Jehovah guards.<br><br>(1.) One who joined David at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,5);\">1Ch 12:5</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('Ezr',10,32,41);\">Ezr 10:32, 41</a>.";
eastonArray["$$T0003344"] = "<strong>Shemeber:</strong> soaring on high, the king of Zeboiim, who joined with the other kings in casting off the yoke of Chedorlaomer. After having been reconquered by him, he was rescued by Abraham (<a href=\"#\" onClick=\"return mV('Gen',14,2);\">Gen 14:2</a>).";
eastonArray["$$T0003345"] = "<strong>Sheminith:</strong> eight; octave, a musical term, supposed to denote the lowest note sung by men's voices (<a href=\"#\" onClick=\"return mV('1Ch',15,21);\">1Ch 15:21</a>; <a href=\"#\" onClick=\"return mV('Psa',6,'1-')\">Psa 6</a>; <a href=\"#\" onClick=\"return mV('Psa',12,1)\">12, title</a>).";
eastonArray["$$T0003346"] = "<strong>Shemiramoth:</strong> most high name.<br><br>(1.) A Levite in the reign of Jehoshaphat (<a href=\"#\" onClick=\"return mV('2Ch',17,8);\">2Ch 17:8</a>).<br><br>(2.) A Levite in David's time (<a href=\"#\" onClick=\"return mV('1Ch',15,18,20);\">1Ch 15:18, 20</a>).";
eastonArray["$$T0003347"] = "<strong>Shemuel:</strong> heard of God.<br><br>(1.) The son of Ammihud. He represented Simeon in the division of the land (<a href=\"#\" onClick=\"return mV('Num',34,20);\">Num 34:20</a>).<br><br>(2.) Used for \"Samuel\" (<a href=\"#\" onClick=\"return mV('1Ch',6,33);\">1Ch 6:33</a>, R.V.).<br><br>(3.) A prince of the tribe of Issachar (<a href=\"#\" onClick=\"return mV('1Ch',7,2);\">1Ch 7:2</a>).";
eastonArray["$$T0003348"] = "<strong>Shen:</strong> a tooth, probably some conspicuous tooth-shaped rock or crag (<a href=\"#\" onClick=\"return mV('1Sa',7,12);\">1Sa 7:12</a>), a place between which and Mizpeh Samuel set up his \"Ebenezer.\" In the Hebrew the word has the article prefixed, \"the Shen.\" The site is unknown.";
eastonArray["$$T0003349"] = "<strong>Shenir:</strong> =Senir, (<a href=\"#\" onClick=\"return mV('Deu',3,9);\">Deu 3:9</a>; <a href=\"#\" onClick=\"return mV('Sgs',4,8);\">Sgs 4:8</a>), the name given to Mount Hermon (q.v.) by the Sidonians.";
</script>
