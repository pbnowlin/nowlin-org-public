<script>
var eastonArray = new Array ();
eastonArray["$$T0003850"] = "<strong>Zaavan:</strong> terror, one of the \"dukes of Edom\" (<a href=\"#\" onClick=\"return mV('Gen',36,27);\">Gen 36:27</a>); called also Zavan (<a href=\"#\" onClick=\"return mV('1Ch',1,42);\">1Ch 1:42</a>).";
eastonArray["$$T0003851"] = "<strong>Zabad:</strong> gift.<br><br>(1.) One of David's valiant men (<a href=\"#\" onClick=\"return mV('1Ch',11,41);\">1Ch 11:41</a>), the descendant of Ahlai, of the \"children of Sheshan\" (<a href=\"#\" onClick=\"return mV('1Ch',2,31);\">2:31</a>).<br><br>(2.) A descendant of Tahath (<a href=\"#\" onClick=\"return mV('1Ch',7,21);\">7:21</a>).<br><br>(3.) The son of Shemath. He conspired against Joash, king of Judah, and slew him (<a href=\"#\" onClick=\"return mV('2Ch',24,25,26);\">2Ch 24:25-26</a>). He is called also Jozachar (<a href=\"#\" onClick=\"return mV('2Ki',12,21);\">2Ki 12:21</a>).<br><br>(4.) <a href=\"#\" onClick=\"return mV('Ezr',10,27);\">Ezr 10:27</a>.<br><br>(5.) <a href=\"#\" onClick=\"return mV('Ezr',10,33);\">Ezr 10:33</a>.<br><br>(6.) <a href=\"#\" onClick=\"return mV('Ezr',10,43);\">Ezr 10:43</a>.";
eastonArray["$$T0003852"] = "<strong>Zabbai:</strong> wanderer; pure.<br><br>(1.) <a href=\"#\" onClick=\"return mV('Ezr',10,28);\">Ezr 10:28</a>.<br><br>(2.) The father of Baruch, who \"earnestly repaired\" part of the wall of Jerusalem (<a href=\"#\" onClick=\"return mV('Neh',3,20);\">Neh 3:20</a>; marg., \"Zaccai\").";
eastonArray["$$T0003853"] = "<strong>Zabbud:</strong> gift, <a href=\"#\" onClick=\"return mV('Ezr',8,14);\">Ezr 8:14</a>.";
eastonArray["$$T0003854"] = "<strong>Zabdi:</strong> gift of Jehovah.<br><br>(1.) An ancestor of Achan (<a href=\"#\" onClick=\"return mV('Jos',7,1,17,18);\">Jos 7:1, 17-18</a>). He is probably the \"Zimri\" of <a href=\"#\" onClick=\"return mV('1Ch',2,6);\">1Ch 2:6</a>.<br><br>(2.) A Benjamite (<a href=\"#\" onClick=\"return mV('1Ch',8,19);\">1Ch 8:19</a>).<br><br>(3.) Called \"the Shiphmite,\" one of David's officers, who had charge of his vineyards (<a href=\"#\" onClick=\"return mV('1Ch',27,27);\">1Ch 27:27</a>).<br><br>(4.) A Levite, one of the sons of Asaph (<a href=\"#\" onClick=\"return mV('Neh',11,17);\">Neh 11:17</a>); probably the same as Zichri (<a href=\"#\" onClick=\"return mV('1Ch',9,15);\">1Ch 9:15</a>), and Zaccur (<a href=\"#\" onClick=\"return mV('Neh',12,35);\">Neh 12:35</a>).";
eastonArray["$$T0003855"] = "<strong>Zabdiel:</strong> gift of God.<br><br>(1.) The father of Jashobeam, who was one of David's officers (<a href=\"#\" onClick=\"return mV('1Ch',27,2);\">1Ch 27:2</a>).<br><br>(2.) An overseer of the priests after the Captivity (<a href=\"#\" onClick=\"return mV('Neh',11,14);\">Neh 11:14</a>).";
eastonArray["$$T0003856"] = "<strong>Zabud:</strong> gift, the son of Nathan, who was \"king's friend\" in the court of Solomon (<a href=\"#\" onClick=\"return mV('1Ki',4,5);\">1Ki 4:5</a>).";
eastonArray["$$T0003857"] = "<strong>Zabulon:</strong> (<a href=\"#\" onClick=\"return mV('Mat',4,13,15);\">Mat 4:13, 15</a>; <a href=\"#\" onClick=\"return mV('Rev',7,8);\">Rev 7:8</a>). See <a href=\"#\" onClick=\"return doDictLookup ('ET0003889');\">ZEBULUN</a>.";
eastonArray["$$T0003858"] = "<strong>Zaccai:</strong> pure, one whose \"sons\" returned with Zerubbabel to Jerusalem (<a href=\"#\" onClick=\"return mV('Ezr',2,9);\">Ezr 2:9</a>; <a href=\"#\" onClick=\"return mV('Neh',7,14);\">Neh 7:14</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003852');\">ZABBAI</a>.)";
eastonArray["$$T0003859"] = "<strong>Zacchaeus:</strong> pure, a superintendant of customs; a chief tax-gather (publicanus) at Jericho (<a href=\"#\" onClick=\"return mV('Luk',19,'1-10');\">Luk 19:1-10</a>). \"The collection of customs at Jericho, which at this time produced and exported a considerable quantity of balsam, was undoubtedly an important post, and would account for Zacchaeus being a rich man.\" Being short of stature, he hastened on before the multitude who were thronging about Christ as he passed through Jericho on his way to Jerusalem, and climbed up a sycamore tree that he might be able to see him. When our Lord reached the spot he looked up to the publican among the branches, and addressing him by name, told him to make haste and come down, as he intended that day to abide at his house. This led to the remarkable interview recorded by the evangelist, and to the striking parable of the ten pounds (<a href=\"#\" onClick=\"return mV('Luk',19,'12-27');\">Luk 19:12-27</a>). At Er-riha (Jericho) there is a large, venerable looking square tower, which goes by the traditional name of the House of Zacchaeus.";
eastonArray["$$T0003860"] = "<strong>Zaccur:</strong> mindful.<br><br>(1.) Father of Shammua, who was one of the spies sent out by Moses (<a href=\"#\" onClick=\"return mV('Num',13,4);\">Num 13:4</a>).<br><br>(2.) A Merarite Levite (<a href=\"#\" onClick=\"return mV('1Ch',24,27);\">1Ch 24:27</a>).<br><br>(3.) A son of Asaph, and chief of one of the courses of singers as arranged by David (<a href=\"#\" onClick=\"return mV('1Ch',25,2,10);\">1Ch 25:2, 10</a>).<br><br>(4.) Son of Imri (<a href=\"#\" onClick=\"return mV('Neh',3,2);\">Neh 3:2</a>).<br><br>(5.) A Levite (<a href=\"#\" onClick=\"return mV('Neh',10,12);\">Neh 10:12</a>).<br><br>(6.) The son of Mattaniah (<a href=\"#\" onClick=\"return mV('Neh',13,13);\">Neh 13:13</a>).";
eastonArray["$$T0003861"] = "<strong>Zachariah:</strong> remembered by the Lord.<br><br>(1.) Son of Jeroboam II., king of Israel. On the death of his father there was an interregnum of ten years, at the end of which he succeeded to the throne, which he occupied only six months, having been put to death by Shallum, who usurped the throne. \"He did that which was evil in the sight of the Lord, as his fathers had done\" (<a href=\"#\" onClick=\"return mV('2Ki',14,29);\">2Ki 14:29</a>; <a href=\"#\" onClick=\"return mV('2Ki',15,'8-12');\">15:8-12</a>). In him the dynasty of Jehu came to an end.<br><br>(2.) The father of Abi, who was the mother of Hezekiah (<a href=\"#\" onClick=\"return mV('2Ki',18,2);\">2Ki 18:2</a>).";
eastonArray["$$T0003862"] = "<strong>Zacharias:</strong><br><br>(1.) A priest of the course of Abia, the eighth of the twenty-four courses into which the priests had been originally divided by David (<a href=\"#\" onClick=\"return mV('1Ch',23,'1-19');\">1Ch 23:1-19</a>). Only four of these courses or \"families\" of the priests returned from the Exile (<a href=\"#\" onClick=\"return mV('Ezr',2,'36-39');\">Ezr 2:36-39</a>); but they were then re-distributed under the old designations. The priests served at the temple twice each year, and only for a week each time. Zacharias' time had come for this service. During this period his home would be one of the chambers set apart for the priests on the sides of the temple ground. The offering of incense was one of the most solemn parts of the daily worship of the temple, and lots were drawn each day to determine who should have this great honour, an honour which no priest could enjoy more than once during his lifetime.<br><br>While Zacharias ministered at the golden altar of incense in the holy place, it was announced to him by the angel Gabriel that his wife Elisabeth, who was also of a priestly family, now stricken in years, would give birth to a son who was to be called John, and that he would be the forerunner of the long-expected Messiah (<a href=\"#\" onClick=\"return mV('Luk',1,'12-17');\">Luk 1:12-17</a>). As a punishment for his refusing to believe this message, he was struck dumb and \"not able to speak until the day that these things should be performed\" (<a href=\"#\" onClick=\"return mV('Luk',1,20);\">20</a>). Nine months passed away, and Elisabeth's child was born, and when in answer to their inquiry Zacharias wrote on a \"writing tablet,\" \"His name is John,\" his mouth was opened, and he praised God (<a href=\"#\" onClick=\"return mV('Luk',1,'60-79');\">60-79</a>). The child (John the Baptist), thus \"born out of due time,\" \"waxed strong in spirit\" (<a href=\"#\" onClick=\"return mV('Luk',1,80);\">1:80</a>).<br><br>(2.) The \"son of Barachias,\" mentioned as having been slain between the temple and the altar (<a href=\"#\" onClick=\"return mV('Mat',23,35);\">Mat 23:35</a>; <a href=\"#\" onClick=\"return mV('Luk',11,51);\">Luk 11:51</a>). \"Barachias\" here may be another name for Jehoiada, as some think. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003892');\">ZECHARIAH</a>.)";
eastonArray["$$T0003863"] = "<strong>Zacher:</strong> memorial, a son of Jehiel (<a href=\"#\" onClick=\"return mV('1Ch',8,31);\">1Ch 8:31</a>; <a href=\"#\" onClick=\"return mV('1Ch',9,35);\">9:35</a>); called Zechariah (<a href=\"#\" onClick=\"return mV('Zec',9,37);\">Zec 9:37</a>).";
eastonArray["$$T0003864"] = "<strong>Zadok:</strong> righteous.<br><br>(1.) A son of Ahitub, of the line of Eleazer (<a href=\"#\" onClick=\"return mV('2Sa',8,17);\">2Sa 8:17</a>; <a href=\"#\" onClick=\"return mV('1Ch',24,3);\">1Ch 24:3</a>), high priest in the time of David (<a href=\"#\" onClick=\"return mV('2Sa',20,25);\">2Sa 20:25</a>) and Solomon (<a href=\"#\" onClick=\"return mV('1Ki',4,4);\">1Ki 4:4</a>). He is first mentioned as coming to take part with David at Hebron (<a href=\"#\" onClick=\"return mV('1Ch',12,27,28);\">1Ch 12:27-28</a>). He was probably on this account made ruler over the Aaronites (<a href=\"#\" onClick=\"return mV('1Ch',27,17);\">27:17</a>). Zadok and Abiathar acted as high priests on several important occasions (<a href=\"#\" onClick=\"return mV('1Ch',15,11);\">1Ch 15:11</a>; <a href=\"#\" onClick=\"return mV('2Sa',15,'24-29',35,36);\">2Sa 15:24-29, 35-36</a>); but when Adonijah endeavoured to secure the throne, Abiathar went with him, and therefore Solomon \"thrust him out from being high priest,\" and Zadok, remaining faithful to David, became high priest alone (<a href=\"#\" onClick=\"return mV('1Ki',2,27,35);\">1Ki 2:27, 35</a>; <a href=\"#\" onClick=\"return mV('1Ch',29,22);\">1Ch 29:22</a>). In him the line of Phinehas resumed the dignity, and held it till the fall of Jerusalem. He was succeeded in his sacred office by his son Azariah (<a href=\"#\" onClick=\"return mV('1Ki',4,2);\">1Ki 4:2</a>; <a href=\"#\" onClick=\"return mV('1Ch',6,'3-9');\">1Ch 6:3-9</a>).<br><br>(2.) The father of Jerusha, who was wife of King Uzziah, and mother of King Jotham (<a href=\"#\" onClick=\"return mV('2Ki',15,33);\">2Ki 15:33</a>; <a href=\"#\" onClick=\"return mV('2Ch',27,1);\">2Ch 27:1</a>).<br><br>(3.) \"The scribe\" set over the treasuries of the temple by Nehemiah along with a priest and a Levite (<a href=\"#\" onClick=\"return mV('Neh',13,13);\">Neh 13:13</a>).<br><br>(4.) The sons of Baana, one of those who assisted in rebuilding the wall of Jerusalem (<a href=\"#\" onClick=\"return mV('Neh',3,4);\">Neh 3:4</a>).";
eastonArray["$$T0003865"] = "<strong>Zair:</strong> little, a place probably east of the Dead Sea, where Joram discomfited the host of Edom who had revolted from him (<a href=\"#\" onClick=\"return mV('2Ki',8,21);\">2Ki 8:21</a>).";
eastonArray["$$T0003866"] = "<strong>Zalmon:</strong> shady.<br><br>(1.) One of David's warriors, called the Ahohite (<a href=\"#\" onClick=\"return mV('2Sa',23,28);\">2Sa 23:28</a>); called also Ilai (<a href=\"#\" onClick=\"return mV('1Ch',11,29);\">1Ch 11:29</a>).<br><br>(2.) A wood near Shechem, from which Abimelech and his party brought boughs and \"put them to the hold\" of Shechem, \"and set the hold on fire\" (<a href=\"#\" onClick=\"return mV('Jdg',9,48);\">Jdg 9:48</a>). Probably the southern peak of Gerizim, now called Jebel Sulman. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003192');\">SALMON</a>.)";
eastonArray["$$T0003867"] = "<strong>Zalmonah:</strong> shady, one of the stations of the Israelites in the wilderness (<a href=\"#\" onClick=\"return mV('Num',33,41,42);\">Num 33:41-42</a>).";
eastonArray["$$T0003868"] = "<strong>Zalmunna:</strong> one of the two kings of Midian whom the \"Lord delivered\" into the hands of Gideon. He was slain afterwards with Zebah (<a href=\"#\" onClick=\"return mV('Jdg',8,'5-21');\">Jdg 8:5-21</a>). (See  <a href=\"#\" onClick=\"return doDictLookup ('ET0003882');\">ZEBAH</a>.)";
eastonArray["$$T0003869"] = "<strong>Zamzummims:</strong> a race of giants; \"a people great, and many, and tall, as the Anakims\" (<a href=\"#\" onClick=\"return mV('Deu',2,20,21);\">Deu 2:20-21</a>). They were overcome by the Ammonites, \"who called them Zamzummims.\" They belonged to the Rephaim, and inhabited the country afterwards occupied by the Ammonites. It has been conjectured that they might be Ham-zuzims, i.e., Zuzims dwelling in Ham, a place apparently to the south of Ashteroth (<a href=\"#\" onClick=\"return mV('Gen',14,5);\">Gen 14:5</a>), the ancient Rabbath-ammon.";
eastonArray["$$T0003870"] = "<strong>Zanoah:</strong> marsh.<br><br>(1.) A town in the low country or shephelah of Judah, near Zorah (<a href=\"#\" onClick=\"return mV('Jos',15,34);\">Jos 15:34</a>). It was re-occupied after the return from the Captivity (<a href=\"#\" onClick=\"return mV('Neh',11,30);\">Neh 11:30</a>). Zanu'ah in Wady Ismail, 10 miles west of Jerusalem, occupies probably the same site.<br><br>(2.) A town in the hill country of Judah, some 10 miles to the south-west of Hebron (<a href=\"#\" onClick=\"return mV('Jos',15,56);\">Jos 15:56</a>).";
eastonArray["$$T0003871"] = "<strong>Zaphnath-paaneah:</strong> the name which Pharaoh gave to Joseph when he raised him to the rank of prime minister or grand vizier of the kingdom (<a href=\"#\" onClick=\"return mV('Gen',41,45);\">Gen 41:45</a>). This is a pure Egyptian word, and has been variously explained. Some think it means \"creator,\" or \"preserver of life.\" Brugsch interprets it as \"governor of the district of the place of life\", i.e., of Goshen, the chief city of which was Pithom, \"the place of life.\" Others explain it as meaning \"a revealer of secrets,\" or \"the man to whom secrets are revealed.\"";
eastonArray["$$T0003872"] = "<strong>Zarephath:</strong> smelting-shop, \"a workshop for the refining and smelting of metals\", a small Phoenician town, now Surafend, about a mile from the coast, almost midway on the road between Tyre and Sidon. Here Elijah sojourned with a poor widow during the \"great famine,\" when the \"heaven was shut up three years and six months\" (<a href=\"#\" onClick=\"return mV('Luk',4,26);\">Luk 4:26</a>; <a href=\"#\" onClick=\"return mV('1Ki',17,10);\">1Ki 17:10</a>). It is called Sarepta in the New Testament (<a href=\"#\" onClick=\"return mV('Luk',4,26);\">Luk 4:26</a>).";
eastonArray["$$T0003873"] = "<strong>Zaretan:</strong> When the Hebrews crossed the Jordan, as soon as the feet of the priests were dipped in the water, the flow of the stream was arrested. The point of arrest was the \"city of Adam beside Zaretan,\" probably near Succoth, at the mouth of the Jabbok, some 30 miles up the river from where the people were encamped. There the water \"stood and rose upon an heap.\" Thus the whole space of 30 miles of the river-bed was dry, that the tribes might pass over (<a href=\"#\" onClick=\"return mV('Jos',3,16,17);\">Jos 3:16-17</a>; <a href=\"#\" onClick=\"return mV('Psa',104,3);\">Psa 104:3</a>).";
eastonArray["$$T0003874"] = "<strong>Zareth-shahar:</strong> the splendour of the dawn, a city \"in the mount of the valley\" (<a href=\"#\" onClick=\"return mV('Jos',13,19);\">Jos 13:19</a>). It is identified with the ruins of Zara, near the mouth of the Wady Zerka Main, on the eastern shore of the Dead Sea, some 3 miles south of the Callirrhoe. Of this town but little remains. \"A few broken basaltic columns and pieces of wall about 200 yards back from the shore, and a ruined fort rather nearer the sea, about the middle of the coast line of the plain, are all that are left\" (Tristram's Land of Moab).";
eastonArray["$$T0003875"] = "<strong>Zarthan:</strong> a place near Succoth, in the plain of the Jordan, \"in the clay ground,\" near which Hiram cast the brazen utensils for the temple (<a href=\"#\" onClick=\"return mV('1Ki',7,46);\">1Ki 7:46</a>); probably the same as Zartan. It is also called Zeredathah (<a href=\"#\" onClick=\"return mV('2Ch',4,17);\">2Ch 4:17</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003909');\">ZEREDA</a>.)";
eastonArray["$$T0003876"] = "<strong>Zatthu:</strong> a sprout, <a href=\"#\" onClick=\"return mV('Neh',10,14);\">Neh 10:14</a>.";
eastonArray["$$T0003877"] = "<strong>Zattu:</strong> id., one whose descendants returned from the Captivity with Zerubbabel (<a href=\"#\" onClick=\"return mV('Ezr',2,8);\">Ezr 2:8</a>; <a href=\"#\" onClick=\"return mV('Neh',7,13);\">Neh 7:13</a>); probably the same as Zatthu.";
eastonArray["$$T0003878"] = "<strong>Zaza:</strong> plenty, a descendant of Judah (<a href=\"#\" onClick=\"return mV('1Ch',2,33);\">1Ch 2:33</a>).";
eastonArray["$$T0003879"] = "<strong>Zeal:</strong> an earnest temper; may be enlightened (<a href=\"#\" onClick=\"return mV('Num',25,'11-13');\">Num 25:11-13</a>; <a href=\"#\" onClick=\"return mV('2Cr',7,11);\">2Cr 7:11</a>; <a href=\"#\" onClick=\"return mV('2Cr',9,2);\">9:2</a>), or ignorant and misdirected (<a href=\"#\" onClick=\"return mV('Rom',10,2);\">Rom 10:2</a>; <a href=\"#\" onClick=\"return mV('Phl',3,6);\">Phl 3:6</a>). As a Christian grace, it must be grounded on right principles and directed to right ends (<a href=\"#\" onClick=\"return mV('Gal',4,18);\">Gal 4:18</a>). It is sometimes ascribed to God (<a href=\"#\" onClick=\"return mV('2Ki',19,31);\">2Ki 19:31</a>; <a href=\"#\" onClick=\"return mV('Isa',9,7);\">Isa 9:7</a>; <a href=\"#\" onClick=\"return mV('Isa',37,32);\">37:32</a>; <a href=\"#\" onClick=\"return mV('Eze',5,13);\">Eze 5:13</a>).";
eastonArray["$$T0003880"] = "<strong>Zealots:</strong> a sect of Jews which originated with Judas the Gaulonite (<a href=\"#\" onClick=\"return mV('Act',5,37);\">Act 5:37</a>). They refused to pay tribute to the Romans, on the ground that this was a violation of the principle that God was the only king of Israel. They rebelled against the Romans, but were soon scattered, and became a lawless band of mere brigands. They were afterwards called Sicarii, from their use of the sica, i.e., the Roman dagger.";
eastonArray["$$T0003881"] = "<strong>Zebadiah:</strong> gift of Jehovah.<br><br>(1.) A son of Asahel, Joab's brother (<a href=\"#\" onClick=\"return mV('1Ch',27,7);\">1Ch 27:7</a>).<br><br>(2.) A Levite who took part as one of the teachers in the system of national education instituted by Jehoshaphat (<a href=\"#\" onClick=\"return mV('2Ch',17,7,8);\">2Ch 17:7-8</a>).<br><br>(3.) The son of Ishmael, \"the ruler of the house of Judah in all the king's matters\" (<a href=\"#\" onClick=\"return mV('2Ch',19,'8-11');\">2Ch 19:8-11</a>).<br><br>(4.) A son of Beriah (<a href=\"#\" onClick=\"return mV('1Ch',8,15);\">1Ch 8:15</a>).<br><br>(5.) A Korhite porter of the Lord's house (<a href=\"#\" onClick=\"return mV('1Ch',26,2);\">1Ch 26:2</a>). Three or four others of this name are also mentioned.";
eastonArray["$$T0003882"] = "<strong>Zebah:</strong> man-killer, or sacrifice, one of the two kings who led the vast host of the Midianites who invaded the land of Israel, and over whom Gideon gained a great and decisive victory (<a href=\"#\" onClick=\"return mV('Jdg',8,'1-')\">Jdg 8</a>). Zebah and Zalmunna had succeeded in escaping across the Jordan with a remnant of the Midianite host, but were overtaken at Karkor, probably in the Hauran, and routed by Gideon. The kings were taken alive and brought back across the Jordan; and confessing that they had personally taken part in the slaughter of Gideon's brothers, they were put to death (<a href=\"#\" onClick=\"return mV('1Sa',12,11);\">1Sa 12:11</a>; <a href=\"#\" onClick=\"return mV('Isa',10,26);\">Isa 10:26</a>; <a href=\"#\" onClick=\"return mV('Psa',83,11);\">Psa 83:11</a>).";
eastonArray["$$T0003883"] = "<strong>Zebaim:</strong> (<a href=\"#\" onClick=\"return mV('Ezr',2,57);\">Ezr 2:57</a>; <a href=\"#\" onClick=\"return mV('Neh',7,59);\">Neh 7:59</a>). \"Pochereth of Zebaim\" should be read as in the Revised Version, \"Pochereth-hazzebaim\" (\"snaring the antelopes\"), probably the name of some hunter.";
eastonArray["$$T0003884"] = "<strong>Zebedee:</strong> a Galilean fisherman, the husband of Salome (q.v.), and the father of James and John, two of our Lord's disciples (<a href=\"#\" onClick=\"return mV('Mat',4,21);\">Mat 4:21</a>; <a href=\"#\" onClick=\"return mV('Mat',27,56);\">27:56</a>; <a href=\"#\" onClick=\"return mV('Mar',15,40);\">Mar 15:40</a>). He seems to have been a man of some position in Capernaum, for he had two boats (<a href=\"#\" onClick=\"return mV('Luk',5,4);\">Luk 5:4</a>) and \"hired servants\" (<a href=\"#\" onClick=\"return mV('Mar',1,20);\">Mar 1:20</a>) of his own. No mention is made of him after the call of his two sons by Jesus.";
eastonArray["$$T0003885"] = "<strong>Zeboim:</strong> gazelles or roes.<br><br>(1.) One of the \"five cities of the plain\" of Sodom, generally coupled with Admah (<a href=\"#\" onClick=\"return mV('Gen',10,19);\">Gen 10:19</a>; <a href=\"#\" onClick=\"return mV('Gen',14,2);\">14:2</a>; <a href=\"#\" onClick=\"return mV('Deu',29,23);\">Deu 29:23</a>; <a href=\"#\" onClick=\"return mV('Hsa',11,8);\">Hsa 11:8</a>). It had a king of its own (Shemeber), and was therefore a place of some importance. It was destroyed along with the other cities of the plain.<br><br>(2.) A valley or rugged glen somewhere near Gibeah in Benjamin (<a href=\"#\" onClick=\"return mV('1Sa',13,18);\">1Sa 13:18</a>). It was probably the ravine now bearing the name Wady Shakh-ed-Dub'a, or \"ravine of the hyena,\" north of Jericho.<br><br>(3.) A place mentioned only in <a href=\"#\" onClick=\"return mV('Neh',11,34);\">Neh 11:34</a>, inhabited by the Benjamites after the Captivity.";
eastonArray["$$T0003886"] = "<strong>Zebudah:</strong> given, the wife of Josiah and mother of Jehoiakim (<a href=\"#\" onClick=\"return mV('2Ki',23,36);\">2Ki 23:36</a>).";
eastonArray["$$T0003887"] = "<strong>Zebul:</strong> habitation, the governor of Shechem under Abimelech (<a href=\"#\" onClick=\"return mV('Jdg',9,28,30,36);\">Jdg 9:28, 30, 36</a>). He informed his master of the intention of the people of Shechem to transfer their allegiance to the Hivite tribe of Hamor. This led to Abimelech's destroying the city, when he put its entire population to the sword, and sowed the ruins with salt (<a href=\"#\" onClick=\"return mV('Jdg',9,'28-45');\">Jdg 9:28-45</a>).";
eastonArray["$$T0003888"] = "<strong>Zebulonite:</strong> the designation of Elon, the judge who belonged to the tribe of Zebulun (<a href=\"#\" onClick=\"return mV('Jdg',12,11,12);\">Jdg 12:11-12</a>).";
eastonArray["$$T0003889"] = "<strong>Zebulun:</strong> dwelling, the sixth and youngest son of Jacob and Leah (<a href=\"#\" onClick=\"return mV('Gen',30,20);\">Gen 30:20</a>). Little is known of his personal history. He had three sons (<a href=\"#\" onClick=\"return mV('Gen',46,14);\">46:14</a>).";
eastonArray["$$T0003890"] = "<strong>Zebulun, Lot of:</strong> in Galilee, to the north of Issachar and south of Asher and Naphtali (<a href=\"#\" onClick=\"return mV('Jos',19,'10-16');\">Jos 19:10-16</a>), and between the Sea of Galilee and the Mediterranean. According to ancient prophecy this part of Galilee enjoyed a large share of our Lord's public ministry (<a href=\"#\" onClick=\"return mV('Isa',9,1,2);\">Isa 9:1-2</a>; <a href=\"#\" onClick=\"return mV('Mat',4,'12-16');\">Mat 4:12-16</a>).";
eastonArray["$$T0003891"] = "<strong>Zebulun, Tribe of:</strong> numbered at Sinai (<a href=\"#\" onClick=\"return mV('Num',1,31);\">Num 1:31</a>) and before entering Canaan (<a href=\"#\" onClick=\"return mV('Num',26,27);\">26:27</a>). It was one of the tribes which did not drive out the Canaanites, but only made them tributary (<a href=\"#\" onClick=\"return mV('Jdg',1,30);\">Jdg 1:30</a>). It took little interest in public affairs. It responded, however, readily to the summons of Gideon (<a href=\"#\" onClick=\"return mV('Jdg',6,35);\">6:35</a>), and afterwards assisted in enthroning David at Hebron (<a href=\"#\" onClick=\"return mV('1Ch',12,33,40);\">1Ch 12:33, 40</a>). Along with the other northern tribes, Zebulun was carried away into the land of Assyria by Tiglath-pileser (<a href=\"#\" onClick=\"return mV('2Ki',15,29);\">2Ki 15:29</a>).<br><br>In Deborah's song the words, \"Out of Zebulun they that handle the pen of the writer\" (<a href=\"#\" onClick=\"return mV('Jdg',5,14);\">Jdg 5:14</a>) has been rendered in the R.V., \"They that handle the marshal's staff.\" This is a questionable rendering. \"The word <i>sopher</i> ('scribe' or 'writer') defines the word <i>shebhet</i> ('rod' or 'pen') with which it is conjoined. The 'rod of the scribe' on the Assyrian monuments was the stylus of wood or metal, with the help of which the clay tablet was engraved, or the papyrus inscribed with characters. The scribe who wielded it was the associate and assistant of the 'lawgivers.'\" (Sayce).";
eastonArray["$$T0003892"] = "<strong>Zechariah:</strong> Jehovah is renowned or remembered.<br><br>(1.) A prophet of Judah, the eleventh of the twelve minor prophets. Like Ezekiel, he was of priestly extraction. He describes himself (<a href=\"#\" onClick=\"return mV('Zec',1,1);\">Zec 1:1</a>) as \"the son of Berechiah.\" In (<a href=\"#\" onClick=\"return mV('Ezr',5,1);\">Ezr 5:1</a>; and <a href=\"#\" onClick=\"return mV('Ezr',6,14);\">Ezr 6:14</a>) he is called \"the son of Iddo,\" who was properly his grandfather. His prophetical career began in the second year of Darius (B.C. 520), about sixteen years after the return of the first company from exile. He was contemporary with Haggai (<a href=\"#\" onClick=\"return mV('Ezr',5,1);\">Ezr 5:1</a>).<br><br>His book consists of two distinct parts,<br><br>(1) chapters 1 to 8, inclusive, and<br><br>(2) 9 to the end. It begins with a preface (<a href=\"#\" onClick=\"return mV('Zec',1,'1-6');\">Zec 1:1-6</a>), which recalls the nation's past history, for the purpose of presenting a solemn warning to the present generation. Then follows a series of eight visions (<a href=\"#\" onClick=\"return mV('Zec',1,'7-');\">Zec 1:7-6:8</a>), succeeding one another in one night, which may be regarded as a symbolical history of Israel, intended to furnish consolation to the returned exiles and stir up hope in their minds. The symbolical action, the crowning of Joshua (<a href=\"#\" onClick=\"return mV('Zec',6,'9-15');\">Zec 6:9-15</a>), describes how the kingdoms of the world become the kingdom of God's Christ.<br><br>Chapters <a href=\"#\" onClick=\"return mV('Zec',7,'1-');\">7</a> and <a href=\"#\" onClick=\"return mV('Zec',8,'1-');\">8</a>, delivered two years later, are an answer to the question whether the days of mourning for the destruction of the city should be any longer kept, and an encouraging address to the people, assuring them of God's presence and blessing.<br><br>The second part of the book (<a href=\"#\" onClick=\"return mV('Zec',9,'1-');\">Zec 9-14</a>) bears no date. It is probable that a considerable interval separates it from the first part. It consists of two burdens.<br><br>The first burden (<a href=\"#\" onClick=\"return mV('Zec',9,'1-');\">Zec 9-11</a>) gives an outline of the course of God's providential dealings with his people down to the time of the Advent.<br><br>The second burden (<a href=\"#\" onClick=\"return mV('Zec',12,'1-');\">Zec 12-14</a>) points out the glories that await Israel in \"the latter day\", the final conflict and triumph of God's kingdom.<br><br>(2.) The son or grandson of Jehoiada, the high priest in the times of Ahaziah and Joash. After the death of Jehoiada he boldly condemned both the king and the people for their rebellion against God (<a href=\"#\" onClick=\"return mV('2Ch',24,20);\">2Ch 24:20</a>), which so stirred up their resentment against him that at the king's commandment they stoned him with stones, and he died \"in the court of the house of the Lord\" (<a href=\"#\" onClick=\"return mV('2Ch',24,21);\">24:21</a>). Christ alludes to this deed of murder in (<a href=\"#\" onClick=\"return mV('Mat',23,35);\">Mat 23:35</a>; <a href=\"#\" onClick=\"return mV('Luk',11,51);\">Luk 11:51</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003862');\">ZACHARIAS [2]</a>.)<br><br>(3.) A prophet, who had \"understanding in the seeing of God,\" in the time of Uzziah, who was much indebted to him for his wise counsel (<a href=\"#\" onClick=\"return mV('2Ch',26,5);\">2Ch 26:5</a>).<br><br>Besides these, there is a large number of persons mentioned in Scripture bearing this name of whom nothing is known.<br><br>(4.) One of the chiefs of the tribe of Reuben (<a href=\"#\" onClick=\"return mV('1Ch',5,7);\">1Ch 5:7</a>).<br><br>(5.) One of the porters of the tabernacle (<a href=\"#\" onClick=\"return mV('1Ch',9,21);\">1Ch 9:21</a>).<br><br>(6.) <a href=\"#\" onClick=\"return mV('1Ch',9,37);\">1Ch 9:37</a>.<br><br>(7.) A Levite who assisted at the bringing up of the ark from the house of Obededom (<a href=\"#\" onClick=\"return mV('1Ch',15,'20-24');\">1Ch 15:20-24</a>).<br><br>(8.) A Kohathite Levite (<a href=\"#\" onClick=\"return mV('1Ch',24,25);\">1Ch 24:25</a>).<br><br>(9.) A Merarite Levite (<a href=\"#\" onClick=\"return mV('1Ch',27,21);\">1Ch 27:21</a>).<br><br>(10.) The father of Iddo (<a href=\"#\" onClick=\"return mV('1Ch',27,21);\">1Ch 27:21</a>).<br><br>(11.) One who assisted in teaching the law to the people in the time of Jehoshaphat (<a href=\"#\" onClick=\"return mV('2Ch',17,7);\">2Ch 17:7</a>).<br><br>(12.) A Levite of the sons of Asaph (<a href=\"#\" onClick=\"return mV('2Ch',20,14);\">2Ch 20:14</a>).<br><br>(13.) One of Jehoshaphat's sons (<a href=\"#\" onClick=\"return mV('2Ch',21,2);\">2Ch 21:2</a>).<br><br>(14.) The father of Abijah, who was the mother of Hezekiah (<a href=\"#\" onClick=\"return mV('2Ch',29,1);\">2Ch 29:1</a>).<br><br>(15.) One of the sons of Asaph (<a href=\"#\" onClick=\"return mV('2Ch',29,13);\">2Ch 29:13</a>).<br><br>(16.) One of the \"rulers of the house of God\" (<a href=\"#\" onClick=\"return mV('2Ch',35,8);\">2Ch 35:8</a>).<br><br>(17.) A chief of the people in the time of Ezra, who consulted him about the return from captivity (<a href=\"#\" onClick=\"return mV('Ezr',8,16);\">Ezr 8:16</a>); probably the same as mentioned in (<a href=\"#\" onClick=\"return mV('Neh',8,4);\">Neh 8:4</a>),<br><br>(18.) <a href=\"#\" onClick=\"return mV('Neh',11,12);\">Neh 11:12</a>.<br><br>(19.) <a href=\"#\" onClick=\"return mV('Neh',12,16);\">Neh 12:16</a>.<br><br>(20.) <a href=\"#\" onClick=\"return mV('Neh',12,35,41);\">Neh 12:35, 41</a>.<br><br>(21.) <a href=\"#\" onClick=\"return mV('Isa',8,2);\">Isa 8:2</a>.";
eastonArray["$$T0003893"] = "<strong>Zedad:</strong> side; sloping place, a town in the north of Palestine, near Hamath (<a href=\"#\" onClick=\"return mV('Num',34,8);\">Num 34:8</a>; <a href=\"#\" onClick=\"return mV('Eze',47,15);\">Eze 47:15</a>). It has been identified with the ruins of Sudud, between Emesa (Hums) and Baalbec, but that is uncertain.";
eastonArray["$$T0003894"] = "<strong>Zedekiah:</strong> righteousness of Jehovah.<br><br>(1.) The last king of Judah. He was the third son of Josiah, and his mother's name was Hamutal, the daughter of Jeremiah of Libnah, and hence he was the brother of Jehoahaz (<a href=\"#\" onClick=\"return mV('2Ki',23,31);\">2Ki 23:31</a>; <a href=\"#\" onClick=\"return mV('2Ki',24,17,18);\">24:17-18</a>). His original name was Mattaniah; but when Nebuchadnezzar placed him on the throne as the successor to Jehoiachin he changed his name to Zedekiah. The prophet Jeremiah was his counsellor, yet \"he did evil in the sight of the Lord\" (<a href=\"#\" onClick=\"return mV('2Ki',24,19,20);\">2Ki 24:19-20</a>; <a href=\"#\" onClick=\"return mV('Jer',52,2,3);\">Jer 52:2-3</a>). He ascended the throne at the age of twenty-one years. The kingdom was at that time tributary to Nebuchadnezzar; but, despite the strong remonstrances of Jeremiah and others, as well as the example of Jehoiachin, he threw off the yoke of Babylon, and entered into an alliance with Hophra, king of Egypt. This brought up Nebuchadnezzar, \"with all his host\" (<a href=\"#\" onClick=\"return mV('2Ki',25,1);\">2Ki 25:1</a>), against Jerusalem. During this siege, which lasted about eighteen months, \"every worst woe befell the devoted city, which drank the cup of God's fury to the dregs\" (<a href=\"#\" onClick=\"return mV('2Ki',25,3);\">2Ki 25:3</a>; <a href=\"#\" onClick=\"return mV('Lam',4,4,5,10);\">Lam 4:4-5, 10</a>). The city was plundered and laid in ruins. Zedekiah and his followers, attempting to escape, were made captive and taken to Riblah. There, after seeing his own children put to death, his own eyes were put out, and, being loaded with chains, he was carried captive (B.C. 588) to Babylon (<a href=\"#\" onClick=\"return mV('2Ki',25,'1-7');\">2Ki 25:1-7</a>; <a href=\"#\" onClick=\"return mV('2Ch',36,12);\">2Ch 36:12</a>; <a href=\"#\" onClick=\"return mV('Jer',32,4,5);\">Jer 32:4-5</a>; <a href=\"#\" onClick=\"return mV('Jer',34,2,3);\">34:2-3</a>; <a href=\"#\" onClick=\"return mV('Jer',39,'1-7');\">39:1-7</a>; <a href=\"#\" onClick=\"return mV('Jer',52,'4-11');\">52:4-11</a>; <a href=\"#\" onClick=\"return mV('Eze',12,12);\">Eze 12:12</a>), where he remained a prisoner, how long is unknown, to the day of his death.<br><br>After the fall of Jerusalem, Nebuzaraddan was sent to carry out its complete destruction. The city was razed to the ground. Only a small number of vinedressers and husbandmen were permitted to remain in the land (<a href=\"#\" onClick=\"return mV('Jer',52,16);\">Jer 52:16</a>). Gedaliah, with a Chaldean guard stationed at Mizpah, ruled over Judah (<a href=\"#\" onClick=\"return mV('2Ki',25,22,24);\">2Ki 25:22, 24</a>; <a href=\"#\" onClick=\"return mV('Jer',40,1,2,5,6);\">Jer 40:1-2, 5-6</a>).<br><br>(2.) The son of Chenaanah, a false prophet in the days of Ahab (<a href=\"#\" onClick=\"return mV('1Ki',22,11,24);\">1Ki 22:11, 24</a>; <a href=\"#\" onClick=\"return mV('2Ch',18,10,23);\">2Ch 18:10, 23</a>).<br><br>(3.) The son of Hananiah, a prince of Judah in the days of Jehoiakim (<a href=\"#\" onClick=\"return mV('Jer',36,12);\">Jer 36:12</a>).";
eastonArray["$$T0003895"] = "<strong>Zeeb:</strong> the wolf, one of the two leaders of the great Midianite host which invaded Israel and was utterly routed by Gideon. The division of that host, which attempted to escape across the Jordan, under Oreb and Zeeb, was overtaken by the Ephraimites, who, in a great battle, completely vanquished them, their leaders being taken and slain (<a href=\"#\" onClick=\"return mV('Jdg',7,25);\">Jdg 7:25</a>; <a href=\"#\" onClick=\"return mV('Psa',83,11);\">Psa 83:11</a>; <a href=\"#\" onClick=\"return mV('Isa',10,26);\">Isa 10:26</a>).";
eastonArray["$$T0003896"] = "<strong>Zelah:</strong> slope; side, a town in Benjamin, where Saul and his son Jonathan were buried (<a href=\"#\" onClick=\"return mV('2Sa',21,14);\">2Sa 21:14</a>). It was probably Saul's birthplace.";
eastonArray["$$T0003897"] = "<strong>Zelek:</strong> cleft, an Ammonite; one of David's valiant men (<a href=\"#\" onClick=\"return mV('2Sa',23,37);\">2Sa 23:37</a>).";
eastonArray["$$T0003898"] = "<strong>Zelophehad:</strong> first-born, of the tribe of Manasseh, and of the family of Gilead; died in the wilderness. Having left no sons, his daughters, concerned lest their father's name should be \"done away from among his family,\" made an appeal to Moses, who, by divine direction, appointed it as \"a statute of judgment\" in Israel that daughters should inherit their father's portion when no sons were left (<a href=\"#\" onClick=\"return mV('Num',27,'1-11');\">Num 27:1-11</a>). But that the possession of Zelophehad might not pass away in the year of jubilee from the tribe to which he belonged, it was ordained by Moses that his daughters should not marry any one out of their father's tribe; and this afterwards became a general law (<a href=\"#\" onClick=\"return mV('Num',36,'1-')\">Num 36</a>).";
eastonArray["$$T0003899"] = "<strong>Zelotes:</strong> (<a href=\"#\" onClick=\"return mV('Luk',6,15);\">Luk 6:15</a>). See <a href=\"#\" onClick=\"return doDictLookup ('ET0003439');\">SIMON</a>; <a href=\"#\" onClick=\"return doDictLookup ('ET0003880');\">ZEALOTS</a>.";
</script>
