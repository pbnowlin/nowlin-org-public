<script>
var eastonArray = new Array ();
eastonArray["$$T0001700"] = "<strong>Hearth:</strong> Heb. ah (<a href=\"#\" onClick=\"return mV('Jer',36,22,23);\">Jer 36:22-23</a>; R.V., \"brazier\"), meaning a large pot like a brazier, a portable furnace in which fire was kept in the king's winter apartment.<br><br>Heb. kiyor (<a href=\"#\" onClick=\"return mV('Zec',12,6);\">Zec 12:6</a>; R.V., \"pan\"), a fire-pan.<br><br>Heb. moqed (<a href=\"#\" onClick=\"return mV('Psa',102,3);\">Psa 102:3</a>; R.V., \"fire-brand\"), properly a fagot.<br><br>Heb. yaqud (<a href=\"#\" onClick=\"return mV('Isa',30,14);\">Isa 30:14</a>), a burning mass on a hearth.";
eastonArray["$$T0001701"] = "<strong>He-ass:</strong> Heb. hamor, (<a href=\"#\" onClick=\"return mV('Gen',12,16);\">Gen 12:16</a>), the general designation of the donkey used for carrying burdens (<a href=\"#\" onClick=\"return mV('Gen',42,26);\">Gen 42:26</a>) and for ploughing (<a href=\"#\" onClick=\"return mV('Isa',30,24);\">Isa 30:24</a>). It is described in <a href=\"#\" onClick=\"return mV('Gen',49,14);\">Gen 49:14</a>; <a href=\"#\" onClick=\"return mV('2Sa',19,26);\">2Sa 19:26</a>. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000349');\">ASS</a>.)";
eastonArray["$$T0001702"] = "<strong>Heath:</strong> Heb. 'arar, (<a href=\"#\" onClick=\"return mV('Jer',17,6);\">Jer 17:6</a>; <a href=\"#\" onClick=\"return mV('Jer',48,6);\">48:6</a>), a species of juniper called by the Arabs by the same name ('arar), the <i>Juniperus sabina</i> or savin. \"Its gloomy, stunted appearance, with its scale-like leaves pressed close to its gnarled stem, and cropped close by the wild goats, as it clings to the rocks about Petra, gives great force to the contrast suggested by the prophet, between him that trusteth in man, naked and destitute, and the man that trusteth in the Lord, flourishing as a tree planted by the waters\" (Tristram, Natural History of the Bible).";
eastonArray["$$T0001703"] = "<strong>Heathen:</strong> (Heb. plural goyum). At first the word <i>goyim</i> denoted generally all the nations of the world (<a href=\"#\" onClick=\"return mV('Gen',18,18);\">Gen 18:18</a>; <a href=\"#\" onClick=\"return mV('Gal',3,8);\">Gal 3:8</a>). The Jews afterwards became a people distinguished in a marked manner from the other <i>goyim</i>. They were a separate people (<a href=\"#\" onClick=\"return mV('Lev',20,23);\">Lev 20:23</a>; <a href=\"#\" onClick=\"return mV('Lev',26,'14-45');\">26:14-45</a>; <a href=\"#\" onClick=\"return mV('Deu',28,'1-')\">Deu 28</a>), and the other nations, the Amorites, Hittites, etc., were the <i>goyim</i>, the heathen, with whom the Jews were forbidden to be associated in any way (<a href=\"#\" onClick=\"return mV('Jos',23,7);\">Jos 23:7</a>; <a href=\"#\" onClick=\"return mV('1Ki',11,2);\">1Ki 11:2</a>). The practice of idolatry was the characteristic of these nations, and hence the word came to designate idolaters (<a href=\"#\" onClick=\"return mV('Psa',106,47);\">Psa 106:47</a>; <a href=\"#\" onClick=\"return mV('Jer',46,28);\">Jer 46:28</a>; <a href=\"#\" onClick=\"return mV('Lam',1,3);\">Lam 1:3</a>; <a href=\"#\" onClick=\"return mV('Isa',36,18);\">Isa 36:18</a>), the wicked (<a href=\"#\" onClick=\"return mV('Psa',9,5,15,17);\">Psa 9:5, 15, 17</a>).<br><br>The corresponding Greek word in the New Testament, <i>ethne</i>, has similar shades of meaning. In <a href=\"#\" onClick=\"return mV('Act',22,21);\">Act 22:21</a>; <a href=\"#\" onClick=\"return mV('Gal',3,14);\">Gal 3:14</a>, it denotes the people of the earth generally; and in <a href=\"#\" onClick=\"return mV('Mat',6,7);\">Mat 6:7</a>, an idolater. In modern usage the word denotes all nations that are strangers to revealed religion.";
eastonArray["$$T0001704"] = "<strong>Heaven:</strong><br><br>(1.) Definitions. The phrase \"heaven and earth\" is used to indicate the whole universe (<a href=\"#\" onClick=\"return mV('Gen',1,1);\">Gen 1:1</a>; <a href=\"#\" onClick=\"return mV('Jer',23,24);\">Jer 23:24</a>; <a href=\"#\" onClick=\"return mV('Act',17,24);\">Act 17:24</a>). According to the Jewish notion there were three heavens,<br><br>(a) The firmament, as \"fowls of the heaven\" (<a href=\"#\" onClick=\"return mV('Gen',2,19);\">Gen 2:19</a>; <a href=\"#\" onClick=\"return mV('Gen',7,3,23);\">7:3, 23</a>; <a href=\"#\" onClick=\"return mV('Psa',8,8);\">Psa 8:8</a>, etc.), \"the eagles of heaven\" (<a href=\"#\" onClick=\"return mV('Lam',4,19);\">Lam 4:19</a>), etc.<br><br>(b) The starry heavens (<a href=\"#\" onClick=\"return mV('Deu',17,3);\">Deu 17:3</a>; <a href=\"#\" onClick=\"return mV('Jer',8,2);\">Jer 8:2</a>; <a href=\"#\" onClick=\"return mV('Mat',24,29);\">Mat 24:29</a>).<br><br>(c) \"The heaven of heavens,\" or \"the third heaven\" (<a href=\"#\" onClick=\"return mV('Deu',10,14);\">Deu 10:14</a>; <a href=\"#\" onClick=\"return mV('1Ki',8,27);\">1Ki 8:27</a>; <a href=\"#\" onClick=\"return mV('Psa',115,16);\">Psa 115:16</a>; <a href=\"#\" onClick=\"return mV('Psa',148,4);\">148:4</a>; <a href=\"#\" onClick=\"return mV('2Cr',12,2);\">2Cr 12:2</a>).<br><br>(2.) Meaning of words in the original,<br><br>(a) The usual Hebrew word for \"heavens\" is <i>shamayim</i>, a plural form meaning \"heights,\" \"elevations\" (<a href=\"#\" onClick=\"return mV('Gen',1,1);\">Gen 1:1</a>; <a href=\"#\" onClick=\"return mV('Gen',2,1);\">2:1</a>).<br><br>(b) The Hebrew word <i>marom</i> is also used (<a href=\"#\" onClick=\"return mV('Psa',68,18);\">Psa 68:18</a>; <a href=\"#\" onClick=\"return mV('Psa',93,4);\">93:4</a>; <a href=\"#\" onClick=\"return mV('Psa',102,19);\">102:19</a>, etc.) as equivalent to <i>shamayim</i>, \"high places,\" \"heights.\"<br><br>(c) Heb. galgal, literally a \"wheel,\" is rendered \"heaven\" in <a href=\"#\" onClick=\"return mV('Psa',77,18);\">Psa 77:18</a> (R.V., \"whirlwind\").<br><br>(d) Heb. shahak, rendered \"sky\" (<a href=\"#\" onClick=\"return mV('Deu',33,26);\">Deu 33:26</a>; <a href=\"#\" onClick=\"return mV('Job',37,18);\">Job 37:18</a>; <a href=\"#\" onClick=\"return mV('Psa',18,11);\">Psa 18:11</a>), plural \"clouds\" (<a href=\"#\" onClick=\"return mV('Job',35,5);\">Job 35:5</a>; <a href=\"#\" onClick=\"return mV('Job',36,28);\">36:28</a>; <a href=\"#\" onClick=\"return mV('Psa',68,34);\">Psa 68:34</a>, marg. \"heavens\"), means probably the firmament.<br><br>(e) Heb. rakia is closely connected with (d), and is rendered \"firmamentum\" in the Vulgate, whence our \"firmament\" (<a href=\"#\" onClick=\"return mV('Gen',1,6);\">Gen 1:6</a>; <a href=\"#\" onClick=\"return mV('Deu',33,26);\">Deu 33:26</a>, etc.), regarded as a solid expanse.<br><br>(3.) Metaphorical meaning of term. <a href=\"#\" onClick=\"return mV('Isa',14,13,14);\">Isa 14:13-14</a>; \"doors of heaven\" (<a href=\"#\" onClick=\"return mV('Psa',78,23);\">Psa 78:23</a>); heaven \"shut\" (<a href=\"#\" onClick=\"return mV('1Ki',8,35);\">1Ki 8:35</a>); \"opened\" (<a href=\"#\" onClick=\"return mV('Eze',1,1);\">Eze 1:1</a>). (See <a href=\"#\" onClick=\"return mV('1Ch',21,16);\">1Ch 21:16</a>.)<br><br>(4.) Spiritual meaning. The place of the everlasting blessedness of the righteous; the abode of departed spirits.<br><br>(a) Christ calls it his \"Father's house\" (<a href=\"#\" onClick=\"return mV('Jhn',14,2);\">Jhn 14:2</a>).<br><br>(b) It is called \"paradise\" (<a href=\"#\" onClick=\"return mV('Luk',23,43);\">Luk 23:43</a>; <a href=\"#\" onClick=\"return mV('2Cr',12,4);\">2Cr 12:4</a>; <a href=\"#\" onClick=\"return mV('Rev',2,7);\">Rev 2:7</a>).<br><br>(c) \"The heavenly Jerusalem\" (<a href=\"#\" onClick=\"return mV('Gal',4,26);\">Gal 4:26</a>; <a href=\"#\" onClick=\"return mV('Hbr',12,22);\">Hbr 12:22</a>; <a href=\"#\" onClick=\"return mV('Rev',3,12);\">Rev 3:12</a>).<br><br>(d) The \"kingdom of heaven\" (<a href=\"#\" onClick=\"return mV('Mat',25,1);\">Mat 25:1</a>; <a href=\"#\" onClick=\"return mV('Jam',2,5);\">Jam 2:5</a>).<br><br>(e) The \"eternal kingdom\" (<a href=\"#\" onClick=\"return mV('2Pe',1,11);\">2Pe 1:11</a>).<br><br>(f) The \"eternal inheritance\" (<a href=\"#\" onClick=\"return mV('1Pe',1,4);\">1Pe 1:4</a>; <a href=\"#\" onClick=\"return mV('Hbr',9,15);\">Hbr 9:15</a>).<br><br>(g) The \"better country\" (<a href=\"#\" onClick=\"return mV('Hbr',11,14,16);\">Hbr 11:14, 16</a>).<br><br>(h) The blessed are said to \"sit down with Abraham, Isaac, and Jacob,\" and to be \"in Abraham's bosom\" (<a href=\"#\" onClick=\"return mV('Luk',16,22);\">Luk 16:22</a>; <a href=\"#\" onClick=\"return mV('Mat',8,11);\">Mat 8:11</a>); to \"reign with Christ\" (<a href=\"#\" onClick=\"return mV('2Ti',2,12);\">2Ti 2:12</a>); and to enjoy \"rest\" (<a href=\"#\" onClick=\"return mV('Hbr',4,10,11);\">Hbr 4:10-11</a>).<br><br>In heaven the blessedness of the righteous consists in the possession of \"life everlasting,\" \"an eternal weight of glory\" (<a href=\"#\" onClick=\"return mV('2Cr',4,17);\">2Cr 4:17</a>), an exemption from all sufferings for ever, a deliverance from all evils (<a href=\"#\" onClick=\"return mV('2Cr',5,1,2);\">2Cr 5:1-2</a>) and from the society of the wicked (<a href=\"#\" onClick=\"return mV('2Ti',4,18);\">2Ti 4:18</a>), bliss without termination, the \"fulness of joy\" for ever (<a href=\"#\" onClick=\"return mV('Luk',20,36);\">Luk 20:36</a>; <a href=\"#\" onClick=\"return mV('2Cr',4,16,18);\">2Cr 4:16, 18</a>; <a href=\"#\" onClick=\"return mV('1Pe',1,4);\">1Pe 1:4</a>; <a href=\"#\" onClick=\"return mV('1Pe',5,10);\">5:10</a>; <a href=\"#\" onClick=\"return mV('1Jo',3,2);\">1Jo 3:2</a>). The believer's heaven is not only a state of everlasting blessedness, but also a \"place\", a place \"prepared\" for them (<a href=\"#\" onClick=\"return mV('Jhn',14,2);\">Jhn 14:2</a>).";
eastonArray["$$T0001705"] = "<strong>Heave offering:</strong> Heb. terumah, (<a href=\"#\" onClick=\"return mV('Exd',29,27);\">Exd 29:27</a>) means simply an offering, a present, including all the offerings made by the Israelites as a present. This Hebrew word is frequently employed. Some of the rabbis attach to the word the meaning of elevation, and refer it to the heave offering, which consisted in presenting the offering by a motion up and down, distinguished from the wave offering, which consisted in a repeated movement in a horizontal direction, a \"wave offering to the Lord as ruler of earth, a heave offering to the Lord as ruler of heaven.\" The right shoulder, which fell to the priests in presenting thank offerings, was called the heave shoulder (<a href=\"#\" onClick=\"return mV('Lev',7,34);\">Lev 7:34</a>; <a href=\"#\" onClick=\"return mV('Num',6,20);\">Num 6:20</a>). The first fruits offered in harvest-time (<a href=\"#\" onClick=\"return mV('Num',15,20,21);\">Num 15:20-21</a>) were heave offerings.";
eastonArray["$$T0001706"] = "<strong>Heber:</strong> passing over.<br><br>(1.) Son of Beriah and grandson of Asher (<a href=\"#\" onClick=\"return mV('Gen',46,17);\">Gen 46:17</a>; <a href=\"#\" onClick=\"return mV('1Ch',7,31,32);\">1Ch 7:31-32</a>).<br><br>(2.) The Kenite (<a href=\"#\" onClick=\"return mV('Jdg',4,11,17);\">Jdg 4:11, 17</a>; <a href=\"#\" onClick=\"return mV('Jdg',5,24);\">5:24</a>), a descendant of Hobab. His wife Jael received Sisera (q.v.) into her tent and then killed him.<br><br>(3.) <a href=\"#\" onClick=\"return mV('1Ch',4,18);\">1Ch 4:18</a>.<br><br>(4.) A Benjamite (<a href=\"#\" onClick=\"return mV('1Ch',8,17);\">1Ch 8:17</a>).<br><br>(5.) A Gadite (<a href=\"#\" onClick=\"return mV('1Ch',5,13);\">5:13</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001119');\">EBER</a>.)";
eastonArray["$$T0001707"] = "<strong>Hebrew:</strong> a name applied to the Israelites in Scripture only by one who is a foreigner (<a href=\"#\" onClick=\"return mV('Gen',39,14,17);\">Gen 39:14, 17</a>; <a href=\"#\" onClick=\"return mV('Gen',41,12);\">41:12</a>, etc.), or by the Israelites when they speak of themselves to foreigners (<a href=\"#\" onClick=\"return mV('Gen',40,15);\">40:15</a>; <a href=\"#\" onClick=\"return mV('Exd',1,19);\">Exd 1:19</a>), or when spoken of an contrasted with other peoples (<a href=\"#\" onClick=\"return mV('Gen',43,32);\">Gen 43:32</a>; <a href=\"#\" onClick=\"return mV('Exd',1,3,7,15);\">Exd 1:3, 7, 15</a>; <a href=\"#\" onClick=\"return mV('Deu',15,12);\">Deu 15:12</a>). In the New Testament there is the same contrast between Hebrews and foreigners (<a href=\"#\" onClick=\"return mV('Act',6,1);\">Act 6:1</a>; <a href=\"#\" onClick=\"return mV('Phl',3,5);\">Phl 3:5</a>).<br><br>Derivation.<br><br>(1.) The name is derived, according to some, from Eber (<a href=\"#\" onClick=\"return mV('Gen',10,24);\">Gen 10:24</a>), the ancestor of Abraham. The Hebrews are \"sons of Eber\" (<a href=\"#\" onClick=\"return mV('Gen',10,21);\">10:21</a>).<br><br>(2.) Others trace the name of a Hebrew root-word signifying \"to pass over,\" and hence regard it as meaning \"the man who passed over,\" viz., the Euphrates; or to the Hebrew word meaning \"the region\" or \"country beyond,\" viz., the land of Chaldea. This latter view is preferred. It is the more probable origin of the designation given to Abraham coming among the Canaanites as a man from beyond the Euphrates (<a href=\"#\" onClick=\"return mV('Gen',14,13);\">Gen 14:13</a>).<br><br>(3.) A third derivation of the word has been suggested, viz., that it is from the Hebrew word <i>'abhar</i>, \"to pass over,\" whence <i>'ebher</i>, in the sense of a \"sojourner\" or \"passer through\" as distinct from a \"settler\" in the land, and thus applies to the condition of Abraham (<a href=\"#\" onClick=\"return mV('Hbr',11,13);\">Hbr 11:13</a>).";
eastonArray["$$T0001708"] = "<strong>Hebrew language:</strong> the language of the Hebrew nation, and that in which the Old Testament is written, with the exception of a few portions in Chaldee. In the Old Testament it is only spoken of as \"Jewish\" (<a href=\"#\" onClick=\"return mV('2Ki',18,26,28);\">2Ki 18:26, 28</a>; <a href=\"#\" onClick=\"return mV('Isa',36,11,13);\">Isa 36:11, 13</a>; <a href=\"#\" onClick=\"return mV('2Ch',32,18);\">2Ch 32:18</a>). This name is first used by the Jews in times subsequent to the close of the Old Testament.<br><br>It is one of the class of languages called Semitic, because they were chiefly spoken among the descendants of Shem.<br><br>When Abraham entered Canaan it is obvious that he found the language of its inhabitants closely allied to his own. Isaiah (<a href=\"#\" onClick=\"return mV('Isa',19,18);\">Isa 19:18</a>) calls it \"the language of Canaan.\" Whether this language, as seen in the earliest books of the Old Testament, was the very dialect which Abraham brought with him into Canaan, or whether it was the common tongue of the Canaanitish nations which he only adopted, is uncertain; probably the latter opinion is the correct one. For the thousand years between Moses and the Babylonian exile the Hebrew language underwent little or no modification. It preserves all through a remarkable uniformity of structure. From the first it appears in its full maturity of development. But through intercourse with Damascus, Assyria, and Babylon, from the time of David, and more particularly from the period of the Exile, it comes under the influence of the Aramaic idiom, and this is seen in the writings which date from this period. It was never spoken in its purity by the Jews after their return from Babylon. They now spoke Hebrew with a large admixture of Aramaic or Chaldee, which latterly became the predominant element in the national language.<br><br>The Hebrew of the Old Testament has only about six thousand words, all derived from about five hundred roots. Hence the same word has sometimes a great variety of meanings. So long as it was a living language, and for ages after, only the consonants of the words were written. This also has been a source of difficulty in interpreting certain words, for the meaning varies according to the vowels which may be supplied. The Hebrew is one of the oldest languages of which we have any knowledge. It is essentially identical with the Phoenician language. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002586');\">MOABITE STONE</a>.) The Semitic languages, to which class the Hebrew and Phoenician belonged, were spoken over a very wide area: in Babylonia, Mesopotamia, Syria, Palestine and Arabia, in all the countries from the Mediterranean to the borders of Assyria, and from the mountains of Armenia to the Indian Ocean. The rounded form of the letters, as seen in the Moabite stone, was probably that in which the ancient Hebrew was written down to the time of the Exile, when the present square or Chaldean form was adopted.";
eastonArray["$$T0001709"] = "<strong>Hebrew of the Hebrews:</strong> one whose parents are both Hebrews (<a href=\"#\" onClick=\"return mV('Phl',3,5);\">Phl 3:5</a>; <a href=\"#\" onClick=\"return mV('2Cr',11,22);\">2Cr 11:22</a>); a genuine Hebrew.";
eastonArray["$$T0001710"] = "<strong>Hebrews:</strong> (<a href=\"#\" onClick=\"return mV('Act',6,1);\">Act 6:1</a>) were the Hebrew-speaking Jews, as distinguished from those who spoke Greek. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001552');\">GREEKS</a>.)";
eastonArray["$$T0001711"] = "<strong>Hebrews, Epistle to:</strong><br><br>(1.) Its canonicity. All the results of critical and historical research to which this epistle has been specially subjected abundantly vindicate its right to a place in the New Testament canon among the other inspired books.<br><br>(2.) Its authorship. A considerable variety of opinions on this subject has at different times been advanced. Some have maintained that its author was Silas, Paul's companion. Others have attributed it to Clement of Rome, or Luke, or Barnabas, or some unknown Alexandrian Christian, or Apollos; but the conclusion which we think is best supported, both from internal and external evidence, is that Paul was its author. There are, no doubt, many difficulties in the way of accepting it as Paul's; but we may at least argue with Calvin that there can be no difficulty in the way of \"embracing it without controversy as one of the apostolical epistles.\"<br><br>(3.) Date and place of writing. It was in all probability written at Rome, near the close of Paul's two years' imprisonment (<a href=\"#\" onClick=\"return mV('Hbr',13,19,24);\">Hbr 13:19, 24</a>). It was certainly written before the destruction of Jerusalem (<a href=\"#\" onClick=\"return mV('Hbr',13,10);\">Hbr 13:10</a>).<br><br>(4.) To whom addressed. Plainly it was intended for Jewish converts to the faith of the gospel, probably for the church at Jerusalem. The subscription of this epistle is, of course, without authority. In this case it is incorrect, for obviously Timothy could not be the bearer of it (<a href=\"#\" onClick=\"return mV('Hbr',13,23);\">Hbr 13:23</a>).<br><br>(5.) Its design was to show the true end and meaning of the Mosaic system, and its symbolical and transient character. It proves that the Levitical priesthood was a \"shadow\" of that of Christ, and that the legal sacrifices prefigured the great and all-perfect sacrifice he offered for us. It explains that the gospel was designed, not to modify the law of Moses, but to supersede and abolish it. Its teaching was fitted, as it was designed, to check that tendency to apostatize from Christianity and to return to Judaism which now showed itself among certain Jewish Christians. The supreme authority and the transcendent glory of the gospel are clearly set forth, and in such a way as to strengthen and confirm their allegiance to Christ.<br><br>(6.) It consists of two parts: (a) doctrinal (<a href=\"#\" onClick=\"return mV('Hbr',1,'1-')\">Hbr 1 - Hbr 10:18</a>), (b) and practical (<a href=\"#\" onClick=\"return mV('Hbr',10,19);\">Hbr 10:19 - Hbr 13). There are found in it many references to portions of the Old Testament. It may be regarded as a treatise supplementary to the Epistles to the Romans and Galatians, and as an inspired commentary on the book of Leviticus.";
eastonArray["$$T0001712"] = "<strong>Hebron:</strong> a community; alliance.<br><br>(1.) A city in the south end of the valley of Eshcol, about midway between Jerusalem and Beersheba, from which it is distant about 20 miles in a straight line. It was built \"seven years before Zoan in Egypt\" (<a href=\"#\" onClick=\"return mV('Gen',13,18);\">Gen 13:18</a>; <a href=\"#\" onClick=\"return mV('Num',13,22);\">Num 13:22</a>). It still exists under the same name, and is one of the most ancient cities in the world. Its earlier name was Kirjath-arba (<a href=\"#\" onClick=\"return mV('Gen',23,2);\">Gen 23:2</a>; <a href=\"#\" onClick=\"return mV('Jos',14,15);\">Jos 14:15</a>; <a href=\"#\" onClick=\"return mV('Jos',15,3);\">15:3</a>). But \"Hebron would appear to have been the original name of the city, and it was not till after Abraham's stay there that it received the name Kirjath-arba, who [i.e., Arba] was not the founder but the conqueror of the city, having led thither the tribe of the Anakim, to which he belonged. It retained this name till it came into the possession of Caleb, when the Israelites restored the original name Hebron\" (Keil, Com.). The name of this city does not occur in any of the prophets or in the New Testament. It is found about forty times in the Old. It was the favorite home of Abraham. Here he pitched his tent under the oaks of Mamre, by which name it came afterwards to be known; and here Sarah died, and was buried in the cave of Machpelah (<a href=\"#\" onClick=\"return mV('Gen',23,'17-20');\">Gen 23:17-20</a>), which he bought from Ephron the Hittite. From this place the patriarch departed for Egypt by way of Beersheba (<a href=\"#\" onClick=\"return mV('Gen',37,14);\">37:14</a>; <a href=\"#\" onClick=\"return mV('Gen',46,1);\">46:1</a>). It was taken by Joshua and given to Caleb (<a href=\"#\" onClick=\"return mV('Jos',10,36,37);\">Jos 10:36-37</a>; <a href=\"#\" onClick=\"return mV('Jos',12,10);\">12:10</a>; <a href=\"#\" onClick=\"return mV('Jos',14,13);\">14:13</a>). It became a Levitical city and a city of refuge (<a href=\"#\" onClick=\"return mV('Jos',20,7);\">20:7</a>; <a href=\"#\" onClick=\"return mV('Jos',21,11);\">21:11</a>). When David became king of Judah this was his royal residence, and he resided here for seven and a half years (<a href=\"#\" onClick=\"return mV('2Sa',5,5);\">2Sa 5:5</a>); and here he was anointed as king over all Israel (<a href=\"#\" onClick=\"return mV('2Sa',2,'1-4',11);\">2Sa 2:1-4, 11</a>; <a href=\"#\" onClick=\"return mV('1Ki',2,11);\">1Ki 2:11</a>). It became the residence also of the rebellious Absalom (<a href=\"#\" onClick=\"return mV('2Sa',15,10);\">2Sa 15:10</a>), who probably expected to find his chief support in the tribe of Judah, now called el-Khulil.<br><br>In one part of the modern city is a great mosque, which is built over the grave of Machpelah. The first European who was permitted to enter this mosque was the Prince of Wales in 1862. It was also visited by the Marquis of Bute in 1866, and by the late Emperor Frederick of Germany (then Crown-Prince of Prussia) in 1869.<br><br>One of the largest oaks in Palestine is found in the valley of Eshcol, about 3 miles north of the town. It is supposed by some to be the tree under which Abraham pitched his tent, and is called \"Abraham's oak.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0002758');\">OAK</a>.)<br><br>(2.) The third son of Kohath the Levite (<a href=\"#\" onClick=\"return mV('Exd',6,18);\">Exd 6:18</a>; <a href=\"#\" onClick=\"return mV('1Ch',6,2,18);\">1Ch 6:2,18</a>).<br><br>(3.) <a href=\"#\" onClick=\"return mV('1Ch',2,42,43);\">1Ch 2:42-43</a>.<br><br>(4.) A town in the north border of Asher (<a href=\"#\" onClick=\"return mV('Jos',19,28);\">Jos 19:28</a>).";
eastonArray["$$T0001713"] = "<strong>Hegai:</strong> eunuch, had charge of the harem of Ahasuerus (<a href=\"#\" onClick=\"return mV('Est',2,8);\">Est 2:8</a>).";
eastonArray["$$T0001714"] = "<strong>Heifer:</strong> Heb. 'eglah, (<a href=\"#\" onClick=\"return mV('Deu',21,4,6);\">Deu 21:4, 6</a>; <a href=\"#\" onClick=\"return mV('Jer',46,20);\">Jer 46:20</a>). Untrained to the yoke (<a href=\"#\" onClick=\"return mV('Hsa',10,11);\">Hsa 10:11</a>); giving milk (<a href=\"#\" onClick=\"return mV('Isa',7,21);\">Isa 7:21</a>); ploughing (<a href=\"#\" onClick=\"return mV('Jdg',14,18);\">Jdg 14:18</a>); treading out grain (<a href=\"#\" onClick=\"return mV('Jer',50,11);\">Jer 50:11</a>); unsubdued to the yoke an emblem of Judah (<a href=\"#\" onClick=\"return mV('Isa',15,5);\">Isa 15:5</a>; <a href=\"#\" onClick=\"return mV('Jer',48,34);\">Jer 48:34</a>).<br><br>Heb. parah (<a href=\"#\" onClick=\"return mV('Gen',41,2);\">Gen 41:2</a>; <a href=\"#\" onClick=\"return mV('Num',19,2);\">Num 19:2</a>). Bearing the yoke (<a href=\"#\" onClick=\"return mV('Hsa',4,16);\">Hsa 4:16</a>); \"heifers of Bashan\" (<a href=\"#\" onClick=\"return mV('Amo',4,1);\">Amo 4:1</a>), metaphorical for the voluptuous females of Samaria. The ordinance of sacrifice of the \"red heifer\" described in <a href=\"#\" onClick=\"return mV('Num',19,'1-10');\">Num 19:1-10</a>; comp. <a href=\"#\" onClick=\"return mV('Hbr',9,13);\">Hbr 9:13</a>.";
eastonArray["$$T0001715"] = "<strong>Heir:</strong> Under the patriarchs the property of a father was divided among the sons of his legitimate wives (<a href=\"#\" onClick=\"return mV('Gen',21,10);\">Gen 21:10</a>; <a href=\"#\" onClick=\"return mV('Gen',24,36);\">24:36</a>; <a href=\"#\" onClick=\"return mV('Gen',25,5);\">25:5</a>), the eldest son getting a larger portion than the rest. The Mosaic law made specific regulations regarding the transmission of real property, which are given in detail in <a href=\"#\" onClick=\"return mV('Deu',21,17);\">Deu 21:17</a>; <a href=\"#\" onClick=\"return mV('Num',27,8);\">Num 27:8</a>; <a href=\"#\" onClick=\"return mV('Num',36,6);\">36:6</a>; <a href=\"#\" onClick=\"return mV('Num',27,'9-11');\">27:9-11</a>. Succession to property was a matter of right and not of favour. Christ is the \"heir of all things\" (<a href=\"#\" onClick=\"return mV('Hbr',1,2);\">Hbr 1:2</a>; <a href=\"#\" onClick=\"return mV('Col',1,15);\">Col 1:15</a>). Believers are heirs of the \"promise,\" \"of righteousness,\" \"of the kingdom,\" \"of the world,\" \"of God,\" \"joint heirs\" with Christ (<a href=\"#\" onClick=\"return mV('Gal',3,29);\">Gal 3:29</a>; <a href=\"#\" onClick=\"return mV('Hbr',6,17);\">Hbr 6:17</a>; <a href=\"#\" onClick=\"return mV('Hbr',11,7);\">11:7</a>; <a href=\"#\" onClick=\"return mV('Jam',2,5);\">Jam 2:5</a>; <a href=\"#\" onClick=\"return mV('Rom',4,13);\">Rom 4:13</a>; <a href=\"#\" onClick=\"return mV('Rom',8,17);\">8:17</a>).";
eastonArray["$$T0001716"] = "<strong>Helah:</strong> rust, (<a href=\"#\" onClick=\"return mV('1Ch',4,5,7);\">1Ch 4:5, 7</a>), one of the wives of Ashur.";
eastonArray["$$T0001717"] = "<strong>Helam:</strong> place of abundance, a place on the east of Jordan and west of the Euphrates where David gained a great victory over the Syrian army (<a href=\"#\" onClick=\"return mV('2Sa',10,16);\">2Sa 10:16</a>), which was under the command of Shobach. Some would identify it with Alamatta, near Nicephorium.";
eastonArray["$$T0001718"] = "<strong>Helbah:</strong> fatness, a town of the tribe of Asher (<a href=\"#\" onClick=\"return mV('Jdg',1,31);\">Jdg 1:31</a>), in the plain of Phoenicia.";
eastonArray["$$T0001719"] = "<strong>Helbon:</strong> fat; i.e., \"fertile\", (<a href=\"#\" onClick=\"return mV('Eze',27,18);\">Eze 27:18</a> only), a place whence wine was brought to the great market of Tyre. It has been usually identified with the modern Aleppo, called Haleb by the native Arabs, but is more probably to be found in one of the villages in the Wady Helbon, which is celebrated for its grapes, on the east slope of Anti-Lebanon, north of the river Barada (Abana).";
eastonArray["$$T0001720"] = "<strong>Heldai:</strong> wordly.<br><br>(1.) <a href=\"#\" onClick=\"return mV('1Ch',27,15);\">1Ch 27:15</a>; called also Heleb (<a href=\"#\" onClick=\"return mV('2Sa',23,29);\">2Sa 23:29</a>); one of David's captains.<br><br>(2.) <a href=\"#\" onClick=\"return mV('Zec',6,10);\">Zec 6:10</a>, one who returned from Babylon.";
eastonArray["$$T0001721"] = "<strong>Heleb:</strong> fatness, one of David's warriors (<a href=\"#\" onClick=\"return mV('2Sa',23,29);\">2Sa 23:29</a>).";
eastonArray["$$T0001722"] = "<strong>Heled:</strong> this world, (<a href=\"#\" onClick=\"return mV('1Ch',11,30);\">1Ch 11:30</a>); called Heleb (<a href=\"#\" onClick=\"return mV('2Sa',23,29);\">2Sa 23:29</a>).";
eastonArray["$$T0001723"] = "<strong>Helek:</strong> a portion, (<a href=\"#\" onClick=\"return mV('Jos',17,2);\">Jos 17:2</a>), descended from Manasseh.";
eastonArray["$$T0001724"] = "<strong>Helem:</strong> a stroke, great-grandson of Asher (<a href=\"#\" onClick=\"return mV('1Ch',7,35);\">1Ch 7:35</a>).";
eastonArray["$$T0001725"] = "<strong>Heleph:</strong> exchange, a city on the north border of Naphtali (<a href=\"#\" onClick=\"return mV('Jos',19,33);\">Jos 19:33</a>).";
eastonArray["$$T0001726"] = "<strong>Helez:</strong> strong, or loin (?)<br><br>(1.) One of Judah's posterity (<a href=\"#\" onClick=\"return mV('1Ch',2,39);\">1Ch 2:39</a>).<br><br>(2.) One of David's warriors (<a href=\"#\" onClick=\"return mV('2Sa',23,26);\">2Sa 23:26</a>).";
eastonArray["$$T0001727"] = "<strong>Heli:</strong> elevation, father of Joseph in the line of our Lord's ancestry (<a href=\"#\" onClick=\"return mV('Luk',3,23);\">Luk 3:23</a>).";
eastonArray["$$T0001728"] = "<strong>Helkai:</strong> smooth-tongued, one of the chief priests in the time of Joiakim (<a href=\"#\" onClick=\"return mV('Neh',12,15);\">Neh 12:15</a>).";
eastonArray["$$T0001729"] = "<strong>Helkath:</strong> smoothness, a town of Asher, on the east border (<a href=\"#\" onClick=\"return mV('Jos',19,25);\">Jos 19:25</a>; <a href=\"#\" onClick=\"return mV('Jos',21,31);\">21:31</a>); called also Hukok (<a href=\"#\" onClick=\"return mV('1Ch',6,75);\">1Ch 6:75</a>).";
eastonArray["$$T0001730"] = "<strong>Helkath-hazzurim:</strong> plot of the sharp blades, or the field of heroes, (<a href=\"#\" onClick=\"return mV('2Sa',2,16);\">2Sa 2:16</a>). After the battle of Gilboa, so fatal to Saul and his house, David, as divinely directed, took up his residence in Hebron, and was there anointed king over Judah. Among the fugitives from Gilboa was Ish-bosheth, the only surviving son of Saul, whom Abner, Saul's uncle, took across the Jordan to Mahanaim, and there had him proclaimed king. Abner gathered all the forces at his command and marched to Gibeon, with the object of wresting Judah from David. Joab had the command of David's army of trained men, who encamped on the south of the pool, which was on the east of the hill on which the town of Gibeon was built, while Abner's army lay on the north of the pool. Abner proposed that the conflict should be decided by twelve young men engaging in personal combat on either side. So fiercely did they encounter each other that \"they caught every man his fellow by the head, and thrust his sword in his fellow's side; so they fell down together: wherefore that place was called Helkath-hazzurim.\" The combat of the champions was thus indecisive, and there followed a severe general engagement between the two armies, ending in the total rout of the Israelites under Abner. The general result of this battle was that \"David waxed stronger and stronger, and the house of Saul waxed weaker and weaker\" (<a href=\"#\" onClick=\"return mV('2Sa',3,1);\">2Sa 3:1</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001480');\">GIBEON</a>.)";
eastonArray["$$T0001731"] = "<strong>Hell:</strong> derived from the Saxon helan, to cover; hence the covered or the invisible place. In Scripture there are three words so rendered:<br><br>(1.) Sheol, occurring in the Old Testament sixty-five times. This word sheol is derived from a root-word meaning \"to ask,\" \"demand;\" hence insatiableness (<a href=\"#\" onClick=\"return mV('Pro',30,15,16);\">Pro 30:15-16</a>). It is rendered \"grave\" thirty-one times (<a href=\"#\" onClick=\"return mV('Gen',37,35);\">Gen 37:35</a>; <a href=\"#\" onClick=\"return mV('Gen',42,38);\">42:38</a>; <a href=\"#\" onClick=\"return mV('Gen',44,29);\">44:29,31</a>; <a href=\"#\" onClick=\"return mV('1Sa',2,6);\">1Sa 2:6</a>, etc.). The Revisers have retained this rendering in the historical books with the original word in the margin, while in the poetical books they have reversed this rule.<br><br>In thirty-one cases in the Authorized Version this word is rendered \"hell,\" the place of disembodied spirits. The inhabitants of sheol are \"the congregation of the dead\" (<a href=\"#\" onClick=\"return mV('Pro',21,16);\">Pro 21:16</a>). It is<br><br>(a) the abode of the wicked (<a href=\"#\" onClick=\"return mV('Num',16,33);\">Num 16:33</a>; <a href=\"#\" onClick=\"return mV('Job',24,19);\">Job 24:19</a>; <a href=\"#\" onClick=\"return mV('Psa',9,17);\">Psa 9:17</a>; <a href=\"#\" onClick=\"return mV('Psa',31,17);\">31:17</a>, etc.);<br><br>(b) of the good (<a href=\"#\" onClick=\"return mV('Psa',16,10);\">Psa 16:10</a>; <a href=\"#\" onClick=\"return mV('Psa',30,3);\">30:3</a>; <a href=\"#\" onClick=\"return mV('Psa',49,15);\">49:15</a>; <a href=\"#\" onClick=\"return mV('Psa',86,13);\">86:13</a>, etc.).<br><br>Sheol is described as deep (<a href=\"#\" onClick=\"return mV('Job',11,8);\">Job 11:8</a>), dark (<a href=\"#\" onClick=\"return mV('Job',10,21,22);\">10:21-22</a>), with bars (<a href=\"#\" onClick=\"return mV('Job',17,16);\">17:16</a>). The dead \"go down\" to it (<a href=\"#\" onClick=\"return mV('Num',16,30,33);\">Num 16:30,33</a>; <a href=\"#\" onClick=\"return mV('Eze',31,'15-17');\">Eze 31:15-17</a>).<br><br>(2.) The Greek word hades of the New Testament has the same scope of signification as sheol of the Old Testament. It is a prison (<a href=\"#\" onClick=\"return mV('1Pe',3,19);\">1Pe 3:19</a>), with gates and bars and locks (<a href=\"#\" onClick=\"return mV('Mat',16,18);\">Mat 16:18</a>; <a href=\"#\" onClick=\"return mV('Rev',1,18);\">Rev 1:18</a>), and it is downward (<a href=\"#\" onClick=\"return mV('Mat',11,23);\">Mat 11:23</a>; <a href=\"#\" onClick=\"return mV('Luk',10,15);\">Luk 10:15</a>).<br><br>The righteous and the wicked are separated. The blessed dead are in that part of hades called paradise (<a href=\"#\" onClick=\"return mV('Luk',23,43);\">Luk 23:43</a>). They are also said to be in Abraham's bosom (<a href=\"#\" onClick=\"return mV('Luk',16,22);\">Luk 16:22</a>).<br><br>(3.) Gehenna, in most of its occurrences in the Greek New Testament, designates the place of the lost (<a href=\"#\" onClick=\"return mV('Mat',23,33);\">Mat 23:33</a>). The fearful nature of their condition there is described in various figurative expressions (<a href=\"#\" onClick=\"return mV('Mat',8,12);\">Mat 8:12</a>; <a href=\"#\" onClick=\"return mV('Mat',13,42);\">13:42</a>; <a href=\"#\" onClick=\"return mV('Mat',22,13);\">22:13</a>; <a href=\"#\" onClick=\"return mV('Mat',25,30);\">25:30</a>; <a href=\"#\" onClick=\"return mV('Luk',16,24);\">Luk 16:24</a>, etc.). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001790');\">HINNOM</a>.)";
eastonArray["$$T0001732"] = "<strong>Helmet:</strong> (Heb. kob'a), a cap for the defence of the head (<a href=\"#\" onClick=\"return mV('1Sa',17,5,38);\">1Sa 17:5, 38</a>). In the New Testament the Greek equivalent is used (<a href=\"#\" onClick=\"return mV('Eph',6,17);\">Eph 6:17</a>; <a href=\"#\" onClick=\"return mV('1Th',5,8);\">1Th 5:8</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000315');\">ARMS</a>.)";
eastonArray["$$T0001733"] = "<strong>Helon:</strong> strong, father of Eliab, who was \"captain of the children of Zebulun\" (<a href=\"#\" onClick=\"return mV('Num',1,9);\">Num 1:9</a>; <a href=\"#\" onClick=\"return mV('Num',2,7);\">2:7</a>).";
eastonArray["$$T0001734"] = "<strong>Help-meet:</strong> (Heb. 'ezer ke-negdo; i.e., \"a help as his counterpart\" = a help suitable to him), a wife (<a href=\"#\" onClick=\"return mV('Gen',2,'18-20');\">Gen 2:18-20</a>).";
eastonArray["$$T0001735"] = "<strong>Helps:</strong> (<a href=\"#\" onClick=\"return mV('1Cr',12,28);\">1Cr 12:28</a>) may refer to help (i.e., by interpretation) given to him who speaks with tongues, or more probably simply help which Christians can render to one another, such as caring for the poor and needy, etc.";
eastonArray["$$T0001736"] = "<strong>Hem:</strong> of a garment, the fringe of a garment. The Jews attached much importance to these, because of the regulations in <a href=\"#\" onClick=\"return mV('Num',15,38,39);\">Num 15:38-39</a>. These borders or fringes were in process of time enlarged so as to attract special notice (<a href=\"#\" onClick=\"return mV('Mat',23,5);\">Mat 23:5</a>). The hem of Christ's garment touched (<a href=\"#\" onClick=\"return mV('Mat',9,20);\">9:20</a>; <a href=\"#\" onClick=\"return mV('Mat',14,36);\">14:36</a>; <a href=\"#\" onClick=\"return mV('Luk',8,44);\">Luk 8:44</a>).";
eastonArray["$$T0001737"] = "<strong>Heman:</strong> faithful.<br><br>(1.) <a href=\"#\" onClick=\"return mV('1Ki',4,31);\">1Ki 4:31</a>; <a href=\"#\" onClick=\"return mV('1Ch',2,6);\">1Ch 2:6</a>, a son of Zerah, noted for his wisdom.<br><br>(2.) Grandson of Samuel (<a href=\"#\" onClick=\"return mV('1Ch',6,33);\">1Ch 6:33</a>; <a href=\"#\" onClick=\"return mV('1Ch',15,17);\">15:17</a>), to whom the <a href=\"#\" onClick=\"return mV('Psa',88,'1-');\">88th Psalm</a> probably was inscribed. He was one of the \"seers\" named in <a href=\"#\" onClick=\"return mV('2Ch',29,14,30);\">2Ch 29:14, 30</a>, and took a leading part in the administration of the sacred services.";
eastonArray["$$T0001738"] = "<strong>Hemath:</strong> a Kenite (<a href=\"#\" onClick=\"return mV('1Ch',2,55);\">1Ch 2:55</a>), the father of the house of Rechab.";
eastonArray["$$T0001739"] = "<strong>Hemlock:</strong><br><br>(1.) Heb. rosh (<a href=\"#\" onClick=\"return mV('Hsa',10,4);\">Hsa 10:4</a>; in <a href=\"#\" onClick=\"return mV('Deu',29,18);\">Deu 29:18</a>; <a href=\"#\" onClick=\"return mV('Deu',32,32);\">32:32</a>; <a href=\"#\" onClick=\"return mV('Psa',69,21);\">Psa 69:21</a>; <a href=\"#\" onClick=\"return mV('Jer',9,15);\">Jer 9:15</a>; <a href=\"#\" onClick=\"return mV('Jer',23,15);\">23:15</a>; <a href=\"#\" onClick=\"return mV('Job',20,16);\">Job 20:16</a>; <a href=\"#\" onClick=\"return mV('Deu',32,33);\">Deu 32:33</a>). \"Rosh is the name of some poisonous plant which grows quickly and luxuriantly; of a bitter taste, and therefore coupled with wormwood (<a href=\"#\" onClick=\"return mV('Deu',29,18);\">Deu 29:18</a>; <a href=\"#\" onClick=\"return mV('Lam',3,19);\">Lam 3:19</a>). Hence it would seem to be not the <i>hemlock cicuta</i>, nor the colocynth or wild gourd, nor <i>lolium darnel</i>, but the poppy so called from its heads\" (Gesenius, Lex.).<br><br>(2.) Heb. la'anah, generally rendered \"wormwood\" (q.v.), <a href=\"#\" onClick=\"return mV('Deu',29,18);\">Deu 29:18</a>, [Text 17]; <a href=\"#\" onClick=\"return mV('Pro',5,4);\">Pro 5:4</a>; <a href=\"#\" onClick=\"return mV('Jer',9,15);\">Jer 9:15</a>; <a href=\"#\" onClick=\"return mV('Jer',23,15);\">23:15</a>. Once it is rendered \"hemlock\" (<a href=\"#\" onClick=\"return mV('Amo',6,12);\">Amo 6:12</a>; R.V., \"wormwood\"). This Hebrew word is from a root meaning \"to curse,\" hence the accursed.";
eastonArray["$$T0001740"] = "<strong>Hen:</strong> common in later times among the Jews in Palestine (<a href=\"#\" onClick=\"return mV('Mat',23,37);\">Mat 23:37</a>; <a href=\"#\" onClick=\"return mV('Luk',13,34);\">Luk 13:34</a>). It is noticeable that this familiar bird is only mentioned in these passages in connection with our Lord's lamentation over the impenitence of Jerusalem.";
eastonArray["$$T0001741"] = "<strong>Hena:</strong> one of the cities of Mesopotamia destroyed by Sennacherib (<a href=\"#\" onClick=\"return mV('2Ki',18,34);\">2Ki 18:34</a>; <a href=\"#\" onClick=\"return mV('2Ki',19,13);\">19:13</a>). It is identified with the modern Anah, lying on the right bank of the Euphrates, not far from Sepharvaim.";
eastonArray["$$T0001742"] = "<strong>Henadad:</strong> favour of Hadad, the name of a Levite after the Captivity (<a href=\"#\" onClick=\"return mV('Ezr',3,9);\">Ezr 3:9</a>).";
eastonArray["$$T0001743"] = "<strong>Henoch:</strong> See <a href=\"#\" onClick=\"return doDictLookup('ET0001212');\">ENOCH</a>.";
eastonArray["$$T0001744"] = "<strong>Hepher:</strong> a well or stream.<br><br>(1.) A royal city of the Canaanites taken by Joshua (<a href=\"#\" onClick=\"return mV('Jos',12,17);\">Jos 12:17</a>).<br><br>(2.) The youngest son of Gilead (<a href=\"#\" onClick=\"return mV('Num',26,32);\">Num 26:32</a>; <a href=\"#\" onClick=\"return mV('Num',27,1);\">27:1</a>).<br><br>(3.) The second son of Asher (<a href=\"#\" onClick=\"return mV('1Ch',4,6);\">1Ch 4:6</a>).<br><br>(4.) One of David's heroes (<a href=\"#\" onClick=\"return mV('1Ch',11,36);\">1Ch 11:36</a>).";
eastonArray["$$T0001745"] = "<strong>Hephzibah:</strong> my delight is in her.<br><br>(1.) The wife of Hezekiah and mother of king Manasseh (<a href=\"#\" onClick=\"return mV('2Ki',21,1);\">2Ki 21:1</a>).<br><br>(2.) A symbolical name of Zion, as representing the Lord's favour toward her (<a href=\"#\" onClick=\"return mV('Isa',62,4);\">Isa 62:4</a>).";
eastonArray["$$T0001746"] = "<strong>Herb:</strong><br><br>(1.) Heb. 'eseb, any green plant; herbage (<a href=\"#\" onClick=\"return mV('Gen',1,11,12,29,30);\">Gen 1:11-12, 29-30</a>; <a href=\"#\" onClick=\"return mV('Gen',2,5);\">2:5</a>; <a href=\"#\" onClick=\"return mV('Gen',3,18);\">3:18</a>, etc.); comprehending vegetables and all green herbage (<a href=\"#\" onClick=\"return mV('Amo',7,1,2);\">Amo 7:1-2</a>).<br><br>(2.) <i>Yarak</i>, green; any green thing; foliage of trees (<a href=\"#\" onClick=\"return mV('2Ki',19,26);\">2Ki 19:26</a>; <a href=\"#\" onClick=\"return mV('Psa',37,2);\">Psa 37:2</a>); a plant; herb (<a href=\"#\" onClick=\"return mV('Deu',11,10);\">Deu 11:10</a>).<br><br>(3.) <i>Or</i>, meaning \"light\" In <a href=\"#\" onClick=\"return mV('Isa',26,19);\">Isa 26:19</a> it means \"green herbs;\" in <a href=\"#\" onClick=\"return mV('2Ki',4,39);\">2Ki 4:39</a> probably the fruit of some plant.<br><br>(4.) <i>Merorim</i>, plural, \"bitter herbs,\" eaten by the Israelites at the Passover (<a href=\"#\" onClick=\"return mV('Exd',12,8);\">Exd 12:8</a>; <a href=\"#\" onClick=\"return mV('Num',9,11);\">Num 9:11</a>). They were bitter plants of various sorts, and referred symbolically to the oppression in Egypt.";
eastonArray["$$T0001747"] = "<strong>Herd:</strong> <a href=\"#\" onClick=\"return mV('Gen',13,5);\">Gen 13:5</a>; <a href=\"#\" onClick=\"return mV('Deu',7,14);\">Deu 7:14</a>. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000740');\">CATTLE</a>.)";
eastonArray["$$T0001748"] = "<strong>Herdsman:</strong> In Egypt herdsmen were probably of the lowest caste. Some of Joseph's brethren were made rulers over Pharaoh's cattle (<a href=\"#\" onClick=\"return mV('Gen',47,6,17);\">Gen 47:6, 17</a>). The Israelites were known in Egypt as \"keepers of cattle;\" and when they left it they took their flocks and herds with them (<a href=\"#\" onClick=\"return mV('Exd',12,38);\">Exd 12:38</a>). Both David and Saul came from \"following the herd\" to occupy the throne (<a href=\"#\" onClick=\"return mV('1Sa',9,'1-')\">1Sa 9</a>; <a href=\"#\" onClick=\"return mV('1Sa',11,5);\">11:5</a>; <a href=\"#\" onClick=\"return mV('Psa',78,70);\">Psa 78:70</a>). David's herd-masters were among his chief officers of state. The daughters also of wealthy chiefs were wont to tend the flocks of the family (<a href=\"#\" onClick=\"return mV('Gen',29,9);\">Gen 29:9</a>; <a href=\"#\" onClick=\"return mV('Exd',2,16);\">Exd 2:16</a>). The \"chief of the herdsmen\" was in the time of the monarchy an officer of high rank (<a href=\"#\" onClick=\"return mV('1Sa',21,7);\">1Sa 21:7</a>; <a href=\"#\" onClick=\"return mV('1Ch',27,29);\">1Ch 27:29</a>). The herdsmen lived in tents (<a href=\"#\" onClick=\"return mV('Isa',38,12);\">Isa 38:12</a>; <a href=\"#\" onClick=\"return mV('Jer',6,3);\">Jer 6:3</a>); and there were folds for the cattle (<a href=\"#\" onClick=\"return mV('Num',32,16);\">Num 32:16</a>), and watch-towers for the herdsmen, that he might therefrom observe any coming danger (<a href=\"#\" onClick=\"return mV('Mic',4,8);\">Mic 4:8</a>; <a href=\"#\" onClick=\"return mV('Nah',3,8);\">Nah 3:8</a>).";
eastonArray["$$T0001749"] = "<strong>Heres:</strong> sun.<br><br>(1.) \"Mount Heres\" (<a href=\"#\" onClick=\"return mV('Jdg',1,35);\">Jdg 1:35</a>), Heb. Har-heres, i.e., \"sun-mountain;\" probably identical with Irshemesh in <a href=\"#\" onClick=\"return mV('Jos',19,41);\">Jos 19:41</a>.<br><br>(2.) <a href=\"#\" onClick=\"return mV('Isa',19,18);\">Isa 19:18</a>, marg. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002786');\">ON</a>.)";
</script>
