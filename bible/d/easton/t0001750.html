<TITLE>Dictionary Info Blue Letter Bible</TITLE>

<script src="./js/NoNavHeader.js"  type="text/javascript"></script>
<script>
var eastonArray = new Array ();
eastonArray["$$T0001750"] = "<strong>Heresy:</strong> from a Greek word signifying (1) a choice, (2) the opinion chosen, and (3) the sect holding the opinion. In the Acts of the Apostles (<a href=\"#\" onClick=\"return mV('Act',5,17);\">Act 5:17</a>; <a href=\"#\" onClick=\"return mV('Act',15,5);\">15:5</a>; <a href=\"#\" onClick=\"return mV('Act',24,5,15);\">24:5, 15</a>; <a href=\"#\" onClick=\"return mV('Act',26,5);\">26:5</a>) it denotes a sect, without reference to its character. Elsewhere, however, in the New Testament it has a different meaning attached to it. Paul ranks \"heresies\" with crimes and seditions (<a href=\"#\" onClick=\"return mV('Gal',5,20);\">Gal 5:20</a>). This word also denotes divisions or schisms in the church (<a href=\"#\" onClick=\"return mV('1Cr',11,19);\">1Cr 11:19</a>). In <a href=\"#\" onClick=\"return mV('Tts',3,10);\">Tts 3:10</a> a \"heretical person\" is one who follows his own self-willed \"questions,\" and who is to be avoided. Heresies thus came to signify self-chosen doctrines not emanating from God (<a href=\"#\" onClick=\"return mV('2Pe',2,1);\">2Pe 2:1</a>).";
eastonArray["$$T0001751"] = "<strong>Hermas:</strong> Mercury, a Roman Christian to whom Paul sends greetings (<a href=\"#\" onClick=\"return mV('Rom',16,14);\">Rom 16:14</a>). Some suppose him to have been the author of the celebrated religious romance called The Shepherd, but it is very probable that that work is the production of a later generation.";
eastonArray["$$T0001752"] = "<strong>Hermes:</strong> Mercury, a Roman Christian (<a href=\"#\" onClick=\"return mV('Rom',16,14);\">Rom 16:14</a>).";
eastonArray["$$T0001753"] = "<strong>Hermogenes:</strong> Mercury-born, at one time Paul's fellow-labourer in Asia Minor, who, however, afterwards abandoned him, along with one Phygellus, probably on account of the perils by which they were beset (<a href=\"#\" onClick=\"return mV('2Ti',1,15);\">2Ti 1:15</a>).";
eastonArray["$$T0001754"] = "<strong>Hermon:</strong> a peak, the eastern prolongation of the Anti-Lebanon range, reaching to the height of about 9,200 feet above the Mediterranean. It marks the north boundary of Palestine (<a href=\"#\" onClick=\"return mV('Deu',3,8);\">Deu 3:8</a>; <a href=\"#\" onClick=\"return mV('Deu',4,48);\">4:48</a>; <a href=\"#\" onClick=\"return mV('Jos',11,3,17);\">Jos 11:3, 17</a>; <a href=\"#\" onClick=\"return mV('Jos',13,11);\">13:11</a>; <a href=\"#\" onClick=\"return mV('Jos',12,1);\">12:1</a>), and is seen from a great distance. It is about 40 miles north of the Sea of Galilee. It is called \"the Hermonites\" (<a href=\"#\" onClick=\"return mV('Psa',42,6);\">Psa 42:6</a>) because it has more than one summit. The Sidonians called it Sirion, and the Amorites Shenir (<a href=\"#\" onClick=\"return mV('Deu',3,9);\">Deu 3:9</a>; <a href=\"#\" onClick=\"return mV('Sgs',4,8);\">Sgs 4:8</a>). It is also called Baal-hermon (<a href=\"#\" onClick=\"return mV('Jdg',3,3);\">Jdg 3:3</a>; <a href=\"#\" onClick=\"return mV('1Ch',5,23);\">1Ch 5:23</a>) and Sion (<a href=\"#\" onClick=\"return mV('Deu',4,48);\">Deu 4:48</a>). There is every probability that one of its three summits was the scene of the transfiguration (q.v.). The \"dew of Hermon\" is referred to (<a href=\"#\" onClick=\"return mV('Psa',89,12);\">Psa 89:12</a>). Its modern name is Jebel-esh-Sheikh, \"the chief mountain.\" It is one of the most conspicuous mountains in Palestine or Syria. \"In whatever part of Palestine the Israelite turned his eye northward, Hermon was there, terminating the view. From the plain along the coast, from the Jordan valley, from the heights of Moab and Gilead, from the plateau of Bashan, the pale, blue, snow-capped cone forms the one feature in the northern horizon.\"<br><br>Our Lord and his disciples climbed this \"high mountain apart\" one day, and remained on its summit all night, \"weary after their long and toilsome ascent.\" During the night \"he was transfigured before them; and his face did shine as the sun.\" The next day they descended to Caesarea Philippi.";
eastonArray["$$T0001755"] = "<strong>Hermonites, the:</strong> (<a href=\"#\" onClick=\"return mV('Psa',42,6,7);\">Psa 42:6-7</a>) = \"the Hermons\", i.e., the three peaks or summits of Hermon, which are about a quarter of a mile apart.";
eastonArray["$$T0001756"] = "<strong>Herod Agrippa I.:</strong> son of Aristobulus and Bernice, and grandson of Herod the Great. He was made tetrarch of the provinces formerly held by Lysanias II., and ultimately possessed the entire kingdom of his grandfather, Herod the Great, with the title of king. He put the apostle James the elder to death, and cast Peter into prison (<a href=\"#\" onClick=\"return mV('Luk',3,1);\">Luk 3:1</a>; <a href=\"#\" onClick=\"return mV('Act',12,'1-19');\">Act 12:1-19</a>). On the second day of a festival held in honour of the emperor Claudius, he appeared in the great theatre of Caesarea. \"The king came in clothed in magnificent robes, of which silver was the costly brilliant material. It was early in the day, and the sun's rays fell on the king, so that the eyes of the beholders were dazzled with the brightness which surrounded him. Voices here and there from the crowd exclaimed that it was the apparition of something divine. And when he spoke and made an oration to them, they gave a shout, saying, 'It is the voice of a god, and not of a man.' But in the midst of this idolatrous ostentation an angel of God suddenly smote him. He was carried out of the theatre a dying man.\" He died (A.D. 44) of the same loathsome malady which slew his grandfather (<a href=\"#\" onClick=\"return mV('Act',12,'21-23');\">Act 12:21-23</a>), in the fifty-fourth year of his age, having reigned four years as tetrarch and three as king over the whole of Palestine. After his death his kingdom came under the control of the prefect of Syria, and Palestine was now fully incorporated with the empire.";
eastonArray["$$T0001757"] = "<strong>Herod Antipas:</strong> Herod's son by Malthace (<a href=\"#\" onClick=\"return mV('Mat',14,1);\">Mat 14:1</a>; <a href=\"#\" onClick=\"return mV('Luk',3,1,19);\">Luk 3:1, 19</a>; <a href=\"#\" onClick=\"return mV('Luk',9,7);\">9:7</a>; <a href=\"#\" onClick=\"return mV('Act',13,1);\">Act 13:1</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000252');\">ANTIPAS</a>.)";
eastonArray["$$T0001758"] = "<strong>Herod Archelaus:</strong> (<a href=\"#\" onClick=\"return mV('Mat',2,22);\">Mat 2:22</a>), the brother of Antipas (q.v.).";
eastonArray["$$T0001759"] = "<strong>Herod Arippa II.:</strong> the son of Herod Agrippa I. and Cypros. The emperor Claudius made him tetrarch of the provinces of Philip and Lysanias, with the title of king (<a href=\"#\" onClick=\"return mV('Act',25,13);\">Act 25:13</a>; <a href=\"#\" onClick=\"return mV('Act',26,2,7);\">26:2, 7</a>). He enlarged the city of Caesarea Philippi, and called it Neronias, in honour of Nero. It was before him and his sister that Paul made his defence at Caesarea (<a href=\"#\" onClick=\"return mV('Act',25,'12-27');\">Act 25:12-27</a>). He died at Rome A.D. 100, in the third year of the emperor Trajan.";
eastonArray["$$T0001760"] = "<strong>Herodians:</strong> a Jewish political party who sympathized with (<a href=\"#\" onClick=\"return mV('Mar',3,6);\">Mar 3:6</a>; <a href=\"#\" onClick=\"return mV('Mar',12,13);\">12:13</a>; <a href=\"#\" onClick=\"return mV('Mat',22,16);\">Mat 22:16</a>; <a href=\"#\" onClick=\"return mV('Luk',20,20);\">Luk 20:20</a>) the Herodian rulers in their general policy of government, and in the social customs which they introduced from Rome. They were at one with the Sadducees in holding the duty of submission to Rome, and of supporting the Herods on the throne. (<a href=\"#\" onClick=\"return mV('Mar',8,15);\">Mar 8:15</a>; <a href=\"#\" onClick=\"return mV('Mat',16,6);\">Mat 16:6</a>.)";
eastonArray["$$T0001761"] = "<strong>Herodias:</strong> (<a href=\"#\" onClick=\"return mV('Mat',14,'3-11');\">Mat 14:3-11</a>; <a href=\"#\" onClick=\"return mV('Mar',6,'17-28');\">Mar 6:17-28</a>; <a href=\"#\" onClick=\"return mV('Luk',3,19);\">Luk 3:19</a>), the daughter of Aristobulus and Bernice. While residing at Rome with her husband Herod Philip I. and her daughter, Herod Antipas fell in with her during one of his journeys to that city. She consented to leave her husband and become his wife. Some time after, Herod met John the Baptist, who boldly declared the marriage to be unlawful. For this he was \"cast into prison,\" in the castle probably of Machaerus (q.v.), and was there subsequently beheaded.";
eastonArray["$$T0001762"] = "<strong>Herodion:</strong> a Christian at Rome whom Paul salutes and calls his \"kinsman\" (<a href=\"#\" onClick=\"return mV('Rom',16,11);\">Rom 16:11</a>).";
eastonArray["$$T0001763"] = "<strong>Herod Philip I.:</strong> (<a href=\"#\" onClick=\"return mV('Mar',6,17);\">Mar 6:17</a>), the son of Herod the Great by Mariamne, the daughter of Simon, the high priest. He is distinguished from another Philip called \"the tetrarch.\" He lived at Rome as a private person with his wife Herodias and his daughter Salome.";
eastonArray["$$T0001764"] = "<strong>Herod Philip II.:</strong> the son of Herod the Great and Cleopatra of Jerusalem. He was \"tetrarch\" of Batanea, Iturea, Trachonitis, and Auranitis. He rebuilt the city of Caesarea Philippi, calling it by his own name to distinguish it from the Caesarea on the sea-coast which was the seat of the Roman government. He married Salome, the daughter of Herodias (<a href=\"#\" onClick=\"return mV('Mat',16,13);\">Mat 16:13</a>; <a href=\"#\" onClick=\"return mV('Mar',8,27);\">Mar 8:27</a>; <a href=\"#\" onClick=\"return mV('Luk',3,1);\">Luk 3:1</a>).";
eastonArray["$$T0001765"] = "<strong>Herod the Great:</strong> (<a href=\"#\" onClick=\"return mV('Mat',2,'1-22');\">Mat 2:1-22</a>; <a href=\"#\" onClick=\"return mV('Luk',1,5);\">Luk 1:5</a>; <a href=\"#\" onClick=\"return mV('Act',23,35);\">Act 23:35</a>), the son of Antipater, an Idumaean, and Cypros, an Arabian of noble descent. In the year B.C. 47 Julius Caesar made Antipater, a \"wily Idumaean,\" procurator of Judea, who divided his territories between his four sons, Galilee falling to the lot of Herod, who was afterwards appointed tetrarch of Judea by Mark Antony (B.C. 40), and also king of Judea by the Roman senate.<br><br>He was of a stern and cruel disposition. \"He was brutish and a stranger to all humanity.\" Alarmed by the tidings of one \"born King of the Jews,\" he sent forth and \"slew all the children that were in Bethlehem, and in all the coasts thereof, from two years old and under\" (<a href=\"#\" onClick=\"return mV('Mat',2,16);\">Mat 2:16</a>). He was fond of splendour, and lavished great sums in rebuilding and adorning the cities of his empire. He rebuilt the city of Caesarea (q.v.) on the coast, and also the city of Samaria (q.v.), which he called Sebaste, in honour of Augustus. He restored the ruined temple of Jerusalem, a work which was begun B.C. 20, but was not finished till after Herod's death, probably not till about A.D. 50 (<a href=\"#\" onClick=\"return mV('Jhn',2,20);\">Jhn 2:20</a>). After a troubled reign of thirty-seven years, he died at Jericho amid great agonies both of body and mind, B.C. 4, i.e., according to the common chronology, in the year in which Jesus was born.<br><br>After his death his kingdom was divided among three of his sons. Of these, Philip had the land east of Jordan, between Caesarea Philippi and Bethabara, Antipas had Galilee and Peraea, while Archelaus had Judea and Samaria.";
eastonArray["$$T0001766"] = "<strong>Heron:</strong> (<a href=\"#\" onClick=\"return mV('Lev',11,19);\">Lev 11:19</a>; <a href=\"#\" onClick=\"return mV('Deu',14,18);\">Deu 14:18</a>), ranked among the unclean birds. The Hebrew name is <i>'anaphah</i>, and indicates that the bird so named is remarkable for its angry disposition. \"The herons are wading-birds, peculiarly irritable, remarkable for their voracity, frequenting marshes and oozy rivers, and spread over the regions of the East.\" The <i>Ardea russeta</i>, or little golden egret, is the commonest species in Asia.";
eastonArray["$$T0001767"] = "<strong>Heshbon:</strong> intelligence, a city ruled over by Sihon, king of the Amorites (<a href=\"#\" onClick=\"return mV('Jos',3,10);\">Jos 3:10</a>; <a href=\"#\" onClick=\"return mV('Jos',13,17);\">13:17</a>). It was taken by Moses (<a href=\"#\" onClick=\"return mV('Num',21,'23-26');\">Num 21:23-26</a>), and became afterwards a Levitical city (<a href=\"#\" onClick=\"return mV('Jos',21,39);\">Jos 21:39</a>) in the tribe of Reuben (<a href=\"#\" onClick=\"return mV('Num',32,37);\">Num 32:37</a>). After the Exile it was taken possession of by the Moabites (<a href=\"#\" onClick=\"return mV('Isa',15,4);\">Isa 15:4</a>; <a href=\"#\" onClick=\"return mV('Jer',48,2,34,45);\">Jer 48:2, 34, 45</a>). The ruins of this town are still seen about 20 miles east of Jordan from the north end of the Dead Sea. There are reservoirs in this district, which are probably the \"fishpools\" referred to in <a href=\"#\" onClick=\"return mV('Sgs',7,4);\">Sgs 7:4</a>.";
eastonArray["$$T0001768"] = "<strong>Heshmon:</strong> fatness, a town in the south of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,27);\">Jos 15:27</a>).";
eastonArray["$$T0001769"] = "<strong>Heth:</strong> dread, a descendant of Canaan, and the ancestor of the Hittites (<a href=\"#\" onClick=\"return mV('Gen',10,18);\">Gen 10:18</a>; <a href=\"#\" onClick=\"return mV('Deu',7,1);\">Deu 7:1</a>), who dwelt in the vicinity of Hebron (<a href=\"#\" onClick=\"return mV('Gen',23,3,7);\">Gen 23:3, 7</a>). The Hittites were a Hamitic race. They are called \"the sons of Heth\" (<a href=\"#\" onClick=\"return mV('Gen',23,3,5,7,10,16,18,20);\">Gen 23:3, 5, 7, 10, 16, 18, 20</a>).";
eastonArray["$$T0001770"] = "<strong>Hethlon:</strong> wrapped up, a place on the north border of Palestine. The \"way of Hethlon\" (<a href=\"#\" onClick=\"return mV('Eze',47,15);\">Eze 47:15</a>; <a href=\"#\" onClick=\"return mV('Eze',48,1);\">48:1</a>) is probably the pass at the end of Lebanon from the Mediterranean to the great plain of Hamath (q.v.), or the \"entrance of Hamath.\"";
eastonArray["$$T0001771"] = "<strong>Hezekiah:</strong> whom Jehovah has strengthened.<br><br>(1.) Son of Ahaz (<a href=\"#\" onClick=\"return mV('2Ki',18,1);\">2Ki 18:1</a>; <a href=\"#\" onClick=\"return mV('2Ch',29,1);\">2Ch 29:1</a>), whom he succeeded on the throne of the kingdom of Judah. He reigned twenty-nine years (B.C. 726-697). The history of this king is contained in <a href=\"#\" onClick=\"return mV('2Ki',18,20);\">2Ki 18:20</a>; <a href=\"#\" onClick=\"return mV('Isa',36,'1-');\">Isa. 36-39</a>, and <a href=\"#\" onClick=\"return mV('2Ch',29,'1-');\">2Ch 29-32</a>. He is spoken of as a great and good king. In public life he followed the example of his great-granfather Uzziah. He set himself to abolish idolatry from his kingdom, and among other things which he did for this end, he destroyed the \"brazen serpent,\" which had been removed to Jerusalem, and had become an object of idolatrous worship (<a href=\"#\" onClick=\"return mV('Num',21,9);\">Num 21:9</a>). A great reformation was wrought in the kingdom of Judah in his day (<a href=\"#\" onClick=\"return mV('2Ki',18,4);\">2Ki 18:4</a>; <a href=\"#\" onClick=\"return mV('2Ch',29,'3-36');\">2Ch 29:3-36</a>).<br><br>On the death of Sargon and the accession of his son Sennacherib to the throne of Assyria, Hezekiah refused to pay the tribute which his father had paid, and \"rebelled against the king of Assyria, and served him not,\" but entered into a league with Egypt (<a href=\"#\" onClick=\"return mV('Isa',30,'1-')\">Isa 30</a>; <a href=\"#\" onClick=\"return mV('Isa',31,'1-')\">31</a>; <a href=\"#\" onClick=\"return mV('Isa',36,'6-9');\">36:6-9</a>). This led to the invasion of Judah by Sennacherib (<a href=\"#\" onClick=\"return mV('2Ki',18,'13-16');\">2Ki 18:13-16</a>), who took forty cities, and besieged Jerusalem with mounds. Hezekiah yielded to the demands of the Assyrian king, and agreed to pay him three hundred talents of silver and thirty of gold (<a href=\"#\" onClick=\"return mV('2Ki',18,14);\">18:14</a>).<br><br>But Sennacherib dealt treacherously with Hezekiah (<a href=\"#\" onClick=\"return mV('Isa',33,1);\">Isa 33:1</a>), and a second time within two years invaded his kingdom (<a href=\"#\" onClick=\"return mV('2Ki',18,17);\">2Ki 18:17</a>; <a href=\"#\" onClick=\"return mV('2Ch',32,9);\">2Ch 32:9</a>; <a href=\"#\" onClick=\"return mV('Isa',36,'1-')\">Isa 36</a>). This invasion issued in the destruction of Sennacherib's army. Hezekiah prayed to God, and \"that night the angel of the Lord went out, and smote in the camp of the Assyrians 185,000 men.\" Sennacherib fled with the shattered remnant of his forces to Nineveh, where, seventeen years after, he was assassinated by his sons Adrammelech and Sharezer (<a href=\"#\" onClick=\"return mV('2Ki',19,37);\">2Ki 19:37</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0003273');\">SENNACHERIB</a>.)<br><br>The narrative of Hezekiah's sickness and miraculous recovery is found in <a href=\"#\" onClick=\"return mV('2Ki',20,1);\">2Ki 20:1</a>; <a href=\"#\" onClick=\"return mV('2Ch',32,24);\">2Ch 32:24</a>; <a href=\"#\" onClick=\"return mV('Isa',38,1);\">Isa 38:1</a>. Various ambassadors came to congratulate him on his recovery, and among them Merodach-baladan, the viceroy of Babylon (<a href=\"#\" onClick=\"return mV('2Ch',32,23);\">2Ch 32:23</a>; <a href=\"#\" onClick=\"return mV('2Ki',20,12);\">2Ki 20:12</a>). He closed his days in peace and prosperity, and was succeeded by his son Manasseh. He was buried in the \"chiefest of the sepulchres of the sons of David\" (<a href=\"#\" onClick=\"return mV('2Ch',32,'27-33');\">2Ch 32:27-33</a>). He had \"after him none like him among all the kings of Judah, nor any that were before him\" (<a href=\"#\" onClick=\"return mV('2Ki',18,5);\">2Ki 18:5</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001895');\">ISAIAH</a>.)";
eastonArray["$$T0001772"] = "<strong>Hezion:</strong> vision, the father of Tabrimon, and grandfather of Ben-hadad, king of Syria (<a href=\"#\" onClick=\"return mV('1Ki',15,18);\">1Ki 15:18</a>).";
eastonArray["$$T0001773"] = "<strong>Hezir:</strong> swine or strong.<br><br>(1.) The head of the seventeenth course of the priests (<a href=\"#\" onClick=\"return mV('1Ch',24,15);\">1Ch 24:15</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('Neh',10,20);\">Neh 10:20</a>, one who sealed Nehemiah's covenant.";
eastonArray["$$T0001774"] = "<strong>Hezro:</strong> a Carmelite, one of David's warriors (<a href=\"#\" onClick=\"return mV('1Ch',11,37);\">1Ch 11:37</a>).";
eastonArray["$$T0001775"] = "<strong>Hezron:</strong> enclosed.<br><br>(1.) One of the sons of Reuben (<a href=\"#\" onClick=\"return mV('Gen',46,9);\">Gen 46:9</a>; <a href=\"#\" onClick=\"return mV('Exd',6,14);\">Exd 6:14</a>).<br><br>(2.) The older of the two sons of Pharez (<a href=\"#\" onClick=\"return mV('Gen',46,12);\">Gen 46:12</a>).<br><br>(3.) A plain in the south of Judah, west of Kadesh-barnea (<a href=\"#\" onClick=\"return mV('Jos',15,3);\">Jos 15:3</a>).";
eastonArray["$$T0001776"] = "<strong>Hiddai:</strong> rejoicing of Jehovah, one of David's thirty-seven guards (<a href=\"#\" onClick=\"return mV('2Sa',23,30);\">2Sa 23:30</a>).";
eastonArray["$$T0001777"] = "<strong>Hiddekel:</strong> called by the Accadians id Idikla; i.e., \"the river of Idikla\", the third of the four rivers of Paradise (<a href=\"#\" onClick=\"return mV('Gen',2,14);\">Gen 2:14</a>). Gesenius interprets the word as meaning \"the rapid Tigris.\" The Tigris rises in the mountains of Armenia, 15 miles south of the source of the Euphrates, which, after pursuing a south-east course, it joins at Kurnah, about 50 miles above Bassorah. Its whole length is about 1,150 miles.";
eastonArray["$$T0001778"] = "<strong>Hiel:</strong> life of (i.e., from) God, a native of Bethel, who built (i.e., fortified) Jericho some seven hundred years after its destruction by the Israelites. There fell on him for such an act the imprecation of Joshua (<a href=\"#\" onClick=\"return mV('Jos',6,26);\">Jos 6:26</a>). He laid the foundation in his first-born, and set up the gates in his youngest son (<a href=\"#\" onClick=\"return mV('1Ki',16,34);\">1Ki 16:34</a>), i.e., during the progress of the work all his children died.";
eastonArray["$$T0001779"] = "<strong>Hierapolis:</strong> sacred city, a city of Phrygia, where was a Christian church under the care of Epaphras (<a href=\"#\" onClick=\"return mV('Col',4,12,13);\">Col 4:12-13</a>). This church was founded at the same time as that of Colosse. It now bears the name of Pambuk-Kalek, i.e., \"Cotton Castle\", from the white appearance of the cliffs at the base of which the ruins are found.";
eastonArray["$$T0001780"] = "<strong>Higgaion:</strong> in <a href=\"#\" onClick=\"return mV('Psa',92,3);\">Psa 92:3</a> means the murmuring tone of the harp. In <a href=\"#\" onClick=\"return mV('Psa',9,16);\">Psa 9:16</a> it is a musical sign, denoting probably a pause in the instrumental interlude. In <a href=\"#\" onClick=\"return mV('Psa',19,14);\">Psa 19:14</a> the word is rendered \"meditation;\" and in <a href=\"#\" onClick=\"return mV('Lam',3,62);\">Lam 3:62</a>, \"device\" (R.V., \"imagination\").";
eastonArray["$$T0001781"] = "<strong>High place:</strong> an eminence, natural or artificial, where worship by sacrifice or offerings was made (<a href=\"#\" onClick=\"return mV('1Ki',13,32);\">1Ki 13:32</a>; <a href=\"#\" onClick=\"return mV('2Ki',17,29);\">2Ki 17:29</a>). The first altar after the Flood was built on a mountain (<a href=\"#\" onClick=\"return mV('Gen',8,20);\">Gen 8:20</a>). Abraham also built an altar on a mountain (<a href=\"#\" onClick=\"return mV('Gen',12,7,8);\">12:7-8</a>). It was on a mountain in Gilead that Laban and Jacob offered sacrifices (<a href=\"#\" onClick=\"return mV('Gen',31,54);\">31:54</a>). After the Israelites entered the Promised Land they were strictly enjoined to overthrow the high places of the Canaanites (<a href=\"#\" onClick=\"return mV('Exd',34,13);\">Exd 34:13</a>; <a href=\"#\" onClick=\"return mV('Deu',7,5);\">Deu 7:5</a>; <a href=\"#\" onClick=\"return mV('Deu',12,2,3);\">12:2-3</a>), and they were forbidden to worship the Lord on high places (<a href=\"#\" onClick=\"return mV('Deu',12,'11-14');\">Deu 12:11-14</a>), and were enjoined to use but one altar for sacrifices (<a href=\"#\" onClick=\"return mV('Lev',17,3,4);\">Lev 17:3-4</a>; <a href=\"#\" onClick=\"return mV('Deu',12,'1-')\">Deu 12</a>; <a href=\"#\" onClick=\"return mV('Deu',16,21);\">16:21</a>). The injunction against high places was, however, very imperfectly obeyed, and we find again and again mention made of them (<a href=\"#\" onClick=\"return mV('2Ki',14,4);\">2Ki 14:4</a>; <a href=\"#\" onClick=\"return mV('2Ch',15,17);\">2Ch 15:17</a>, etc.).";
eastonArray["$$T0001782"] = "<strong>High priest:</strong> Aaron was the first who was solemnly set apart to this office (<a href=\"#\" onClick=\"return mV('Exd',29,7);\">Exd 29:7</a>; <a href=\"#\" onClick=\"return mV('Exd',30,23);\">30:23</a>; <a href=\"#\" onClick=\"return mV('Lev',8,12);\">Lev 8:12</a>). He wore a peculiar dress, which on his death passed to his successor in office (<a href=\"#\" onClick=\"return mV('Exd',29,29,30);\">Exd 29:29-30</a>). Besides those garments which he wore in common with all priests, there were four that were peculiar to himself as high priest:<br><br>(1.) The \"robe\" of the ephod, all of blue, of \"woven work,\" worn immediately under the ephod. It was without seam or sleeves. The hem or skirt was ornamented with pomegranates and golden bells, seventy-two of each in alternate order. The sounding of the bells intimated to the people in the outer court the time when the high priest entered into the holy place to burn incense before the Lord (<a href=\"#\" onClick=\"return mV('Exd',28,'1-')\">Exd 28</a>).<br><br>(2.) The \"ephod\" consisted of two parts, one of which covered the back and the other the breast, which were united by the \"curious girdle.\" It was made of fine twined linen, and ornamented with gold and purple. Each of the shoulder-straps was adorned with a precious stone, on which the names of the twelve tribes were engraved. This was the high priest's distinctive vestment (<a href=\"#\" onClick=\"return mV('1Sa',2,28);\">1Sa 2:28</a>; <a href=\"#\" onClick=\"return mV('1Sa',14,3);\">14:3</a>; <a href=\"#\" onClick=\"return mV('1Sa',21,9);\">21:9</a>; <a href=\"#\" onClick=\"return mV('1Sa',23,6,9);\">23:6, 9</a>; <a href=\"#\" onClick=\"return mV('1Sa',30,7);\">30:7</a>).<br><br>(3.) The \"breastplate of judgment\" (<a href=\"#\" onClick=\"return mV('Exd',28,'6-12','25-28');\">Exd 28:6-12, 25-28</a>; <a href=\"#\" onClick=\"return mV('Exd',39,'2-7');\">39:2-7</a>) of \"cunning work.\" It was a piece of cloth doubled, of one span square. It bore twelve precious stones, set in four rows of three in a row, which constituted the Urim and Thummim (q.v.). These stones had the names of the twelve tribes engraved on them. When the high priest, clothed with the ephod and the breastplate, inquired of the Lord, answers were given in some mysterious way by the Urim and Thummim (<a href=\"#\" onClick=\"return mV('1Sa',14,3,18,19);\">1Sa 14:3, 18-19</a>; <a href=\"#\" onClick=\"return mV('1Sa',23,2,4,9,11,12);\">23:2, 4, 9, 11-12</a>; <a href=\"#\" onClick=\"return mV('1Sa',28,6);\">28:6</a>; <a href=\"#\" onClick=\"return mV('2Sa',5,23);\">2Sa 5:23</a>).<br><br>(4.) The \"mitre,\" or upper turban, a twisted band of eight yards of fine linen coiled into a cap, with a gold plate in front, engraved with \"Holiness to the Lord,\" fastened to it by a ribbon of blue.<br><br>To the high priest alone it was permitted to enter the holy of holies, which he did only once a year, on the great Day of Atonement, for \"the way into the holiest of all was not yet made manifest\" (<a href=\"#\" onClick=\"return mV('Hbr',9,'1-')\">Hbr 9</a>; <a href=\"#\" onClick=\"return mV('Hbr',10,'1-')\">10</a>). Wearing his gorgeous priestly vestments, he entered the temple before all the people, and then, laying them aside and assuming only his linen garments in secret, he entered the holy of holies alone, and made expiation, sprinkling the blood of the sin offering on the mercy seat, and offering up incense. Then resuming his splendid robes, he reappeared before the people (<a href=\"#\" onClick=\"return mV('Lev',16,'1-')\">Lev 16</a>). Thus the wearing of these robes came to be identified with the Day of Atonement.<br><br>The office, dress, and ministration of the high priest were typical of the priesthood of our Lord (<a href=\"#\" onClick=\"return mV('Hbr',4,14);\">Hbr 4:14</a>; <a href=\"#\" onClick=\"return mV('Hbr',7,25);\">7:25</a>; <a href=\"#\" onClick=\"return mV('Hbr',9,12);\">9:12</a>, etc.).<br><br>It is supposed that there were in all eighty-three high priests, beginning with Aaron (B.C. 1657) and ending with Phannias (A.D. 70). At its first institution the office of high priest was held for life (<a href=\"#\" onClick=\"return mV('1Ki',2,27);\">1Ki 2:27</a>), and was hereditary in the family of Aaron (<a href=\"#\" onClick=\"return mV('Num',3,10);\">Num 3:10</a>). The office continued in the line of Eleazar, Aaron's eldest son, for two hundred and ninety-six years, when it passed to Eli, the first of the line of Ithamar, who was the fourth son of Aaron. In this line it continued to Abiathar, whom Solomon deposed, and appointed Zadok, of the family of Eleazar, in his stead (<a href=\"#\" onClick=\"return mV('1Ki',2,35);\">1Ki 2:35</a>), in which it remained till the time of the Captivity. After the Return, Joshua, the son of Josedek, of the family of Eleazar, was appointed to this office. After him the succession was changed from time to time under priestly or political influences.";
eastonArray["$$T0001783"] = "<strong>Highway:</strong> a raised road for public use. Such roads were not found in Palestine; hence the force of the language used to describe the return of the captives and the advent of the Messiah (<a href=\"#\" onClick=\"return mV('Isa',11,16);\">Isa 11:16</a>; <a href=\"#\" onClick=\"return mV('Isa',35,8);\">35:8</a>; <a href=\"#\" onClick=\"return mV('Isa',40,3);\">40:3</a>; <a href=\"#\" onClick=\"return mV('Isa',62,10);\">62:10</a>) under the figure of the preparation of a grand thoroughfare for their march.<br><br>During their possession of Palestine the Romans constructed several important highways, as they did in all countries which they ruled.";
eastonArray["$$T0001784"] = "<strong>Hilkiah:</strong> portion of Jehovah.<br><br>(1.) <a href=\"#\" onClick=\"return mV('1Ch',6,54);\">1Ch 6:54</a>.<br><br>(2.) <a href=\"#\" onClick=\"return mV('1Ch',26,11);\">1Ch 26:11</a>.<br><br>(3.) The father of Eliakim (<a href=\"#\" onClick=\"return mV('2Ki',18,18,26,37);\">2Ki 18:18, 26, 37</a>).<br><br>(4.) The father of Gemariah (<a href=\"#\" onClick=\"return mV('Jer',29,3);\">Jer 29:3</a>).<br><br>(5.) The father of the prophet Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',1,1);\">Jer 1:1</a>).<br><br>(6.) The high priest in the reign of Josiah (<a href=\"#\" onClick=\"return mV('1Ch',6,13);\">1Ch 6:13</a>; <a href=\"#\" onClick=\"return mV('Ezr',7,1);\">Ezr 7:1</a>). To him and his deputy (<a href=\"#\" onClick=\"return mV('2Ki',23,5);\">2Ki 23:5</a>), along with the ordinary priests and the Levites who had charge of the gates, was entrusted the purification of the temple in Jerusalem. While this was in progress, he discovered in some hidden corner of the building a book called the \"book of the law\" (<a href=\"#\" onClick=\"return mV('2Ki',22,8);\">2Ki 22:8</a>) and the \"book of the covenant\" (<a href=\"#\" onClick=\"return mV('2Ki',23,2);\">23:2</a>). Some have supposed that this \"book\" was nothing else than the original autograph copy of the Pentateuch written by Moses (<a href=\"#\" onClick=\"return mV('Deu',31,'9-26');\">Deu 31:9-26</a>). This remarkable discovery occurred in the eighteenth year of Josiah's reign (B.C. 624), a discovery which permanently affected the whole subsequent history of Israel. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002116');\">JOSIAH</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0003312');\">SHAPHAN</a>.)<br><br>(7.) <a href=\"#\" onClick=\"return mV('Neh',12,7);\">Neh 12:7</a>.<br><br>(8.) <a href=\"#\" onClick=\"return mV('Neh',8,4);\">Neh 8:4</a>.";
eastonArray["$$T0001785"] = "<strong>Hill:</strong><br><br>(1.) Heb. gib'eah, a curved or rounded hill, such as are common to Palestine (<a href=\"#\" onClick=\"return mV('Psa',65,12);\">Psa 65:12</a>; <a href=\"#\" onClick=\"return mV('Psa',72,3);\">72:3</a>; <a href=\"#\" onClick=\"return mV('Psa',114,4,6);\">114:4, 6</a>).<br><br>(2.) Heb. har, properly a mountain range rather than an individual eminence (<a href=\"#\" onClick=\"return mV('Exd',24,4,12,13,18);\">Exd 24:4, 12-13, 18</a>; <a href=\"#\" onClick=\"return mV('Num',14,40,44,45);\">Num 14:40, 44-45</a>). In <a href=\"#\" onClick=\"return mV('Deu',1,7);\">Deu 1:7</a>; <a href=\"#\" onClick=\"return mV('Jos',9,1);\">Jos 9:1</a>; <a href=\"#\" onClick=\"return mV('Jos',10,40);\">10:40</a>; <a href=\"#\" onClick=\"return mV('Jos',11,16);\">11:16</a>, it denotes the elevated district of Judah, Benjamin, and Ephraim, which forms the watershed between the Mediterranean and the Dead Sea.<br><br>(3.) Heb. ma'aleh in <a href=\"#\" onClick=\"return mV('1Sa',9,11);\">1Sa 9:11</a>. Authorized Version \"hill\" is correctly rendered in the Revised Version \"ascent.\"<br><br>(4.) In <a href=\"#\" onClick=\"return mV('Luk',9,37);\">Luk 9:37</a> the \"hill\" is the Mount of Transfiguration.";
eastonArray["$$T0001786"] = "<strong>Hillel:</strong> praising, a Pirathonite, father of the judge Abdon (<a href=\"#\" onClick=\"return mV('Jdg',12,13,15);\">Jdg 12:13, 15</a>).";
eastonArray["$$T0001787"] = "<strong>Hill of Evil Counsel:</strong> on the south of the Valley of Hinnom. It is so called from a tradition that the house of the high priest Caiaphas, when the rulers of the Jews resolved to put Christ to death, stood here.";
eastonArray["$$T0001788"] = "<strong>Hind:</strong> Heb. 'ayalah (<a href=\"#\" onClick=\"return mV('2Sa',22,34);\">2Sa 22:34</a>; <a href=\"#\" onClick=\"return mV('Psa',18,33);\">Psa 18:33</a>, etc.) and 'ayeleth (<a href=\"#\" onClick=\"return mV('Psa',22,1);\">Psa. 22, title</a>), the female of the hart or stag. It is referred to as an emblem of activity (<a href=\"#\" onClick=\"return mV('Gen',49,21);\">Gen 49:21</a>), gentleness (<a href=\"#\" onClick=\"return mV('Pro',5,19);\">Pro 5:19</a>), feminine modesty (<a href=\"#\" onClick=\"return mV('Sgs',2,7);\">Sgs 2:7</a>; <a href=\"#\" onClick=\"return mV('Sgs',3,5);\">3:5</a>), earnest longing (<a href=\"#\" onClick=\"return mV('Psa',42,1);\">Psa 42:1</a>), timidity (<a href=\"#\" onClick=\"return mV('Psa',29,9);\">Psa 29:9</a>). In the title of <a href=\"#\" onClick=\"return mV('Psa',22,'1-');\">Psa 22</a>, the word probably refers to some tune bearing that name.";
eastonArray["$$T0001789"] = "<strong>Hinge:</strong> (Heb. tsir), that on which a door revolves. \"Doors in the East turn rather on pivots than on what we term hinges. In Syria, and especially in the Hauran, there are many ancient doors, consisting of stone slabs with pivots carved out of the same piece inserted in sockets above and below, and fixed during the building of the house\" (<a href=\"#\" onClick=\"return mV('Pro',26,14);\">Pro 26:14</a>).";
eastonArray["$$T0001790"] = "<strong>Hinnom:</strong> a deep, narrow ravine separating Mount Zion from the so-called \"Hill of Evil Counsel.\" It took its name from \"some ancient hero, the son of Hinnom.\" It is first mentioned in <a href=\"#\" onClick=\"return mV('Jos',15,8);\">Jos 15:8</a>. It had been the place where the idolatrous Jews burned their children alive to Moloch and Baal. A particular part of the valley was called Tophet, or the \"fire-stove,\" where the children were burned. After the Exile, in order to show their abhorrence of the locality, the Jews made this valley the receptacle of the offal of the city, for the destruction of which a fire was, as is supposed, kept constantly burning there.<br><br>The Jews associated with this valley these two ideas,<br><br>(1) that of the sufferings of the victims that had there been sacrificed; and<br><br>(2) that of filth and corruption.<br><br> It became thus to the popular mind a symbol of the abode of the wicked hereafter. It came to signify hell as the place of the wicked. \"It might be shown by infinite examples that the Jews expressed hell, or the place of the damned, by this word. The word Gehenna [the Greek contraction of Hinnom] was never used in the time of Christ in any other sense than to denote the place of future punishment.\" About this fact there can be no question. In this sense the word is used eleven times in our Lord's discourses (<a href=\"#\" onClick=\"return mV('Mat',23,33);\">Mat 23:33</a>; <a href=\"#\" onClick=\"return mV('Luk',12,5);\">Luk 12:5</a>; <a href=\"#\" onClick=\"return mV('Mat',5,22);\">Mat 5:22</a>, etc.).";
eastonArray["$$T0001791"] = "<strong>Hiram:</strong> high-born.<br><br>(1.) Generally \"Huram,\" one of the sons of Bela (<a href=\"#\" onClick=\"return mV('1Ch',8,5);\">1Ch 8:5</a>).<br><br>(2.) Also \"Huram\" and \"Horam,\" king of Tyre. He entered into an alliance with David, and assisted him in building his palace by sending him able workmen, and also cedar-trees and fir-trees from Lebanon (<a href=\"#\" onClick=\"return mV('2Sa',5,11);\">2Sa 5:11</a>; <a href=\"#\" onClick=\"return mV('1Ch',14,1);\">1Ch 14:1</a>). After the death of David he entered into a similar alliance with Solomon, and assisted him greatly in building the temple (<a href=\"#\" onClick=\"return mV('1Ki',5,1);\">1Ki 5:1</a>; <a href=\"#\" onClick=\"return mV('1Ki',9,11);\">9:11</a>; <a href=\"#\" onClick=\"return mV('2Ch',2,3);\">2Ch 2:3</a>). He also took part in Solomon's traffic to the Eastern Seas (<a href=\"#\" onClick=\"return mV('1Ki',9,27);\">1Ki 9:27</a>; <a href=\"#\" onClick=\"return mV('1Ki',10,11);\">10:11</a>; <a href=\"#\" onClick=\"return mV('2Ch',8,18);\">2Ch 8:18</a>; <a href=\"#\" onClick=\"return mV('2Ch',9,10);\">9:10</a>).<br><br>(3.) The \"master workman\" whom Hiram sent to Solomon. He was the son of a widow of Dan, and of a Tyrian father. In <a href=\"#\" onClick=\"return mV('2Ch',2,13);\">2Ch 2:13</a> \"Huram my father\" should be Huram Abi, the word \"Abi\" (rendered here \"my father\") being regarded as a proper name, or it may perhaps be a title of distinction given to Huram, and equivalent to \"master.\" (<a href=\"#\" onClick=\"return mV('1Ki',7,14);\">1Ki 7:14</a>; <a href=\"#\" onClick=\"return mV('2Ch',4,16);\">2Ch 4:16</a>.) He cast the magnificent brazen works for Solomon's temple in clay-beds in the valley of Jordan, between Succoth and Zarthan.";
eastonArray["$$T0001792"] = "<strong>Hireling:</strong> a labourer employed on hire for a limited time (<a href=\"#\" onClick=\"return mV('Job',7,1);\">Job 7:1</a>; <a href=\"#\" onClick=\"return mV('Job',14,6);\">14:6</a>; <a href=\"#\" onClick=\"return mV('Mar',1,20);\">Mar 1:20</a>). His wages were paid as soon as his work was over (<a href=\"#\" onClick=\"return mV('Lev',19,13);\">Lev 19:13</a>). In the time of our Lord a day's wage was a \"penny\" (q.v.) i.e., a Roman denarius (<a href=\"#\" onClick=\"return mV('Mat',20,'1-14');\">Mat 20:1-14</a>).";
eastonArray["$$T0001793"] = "<strong>Hiss:</strong> to express contempt (<a href=\"#\" onClick=\"return mV('Job',27,23);\">Job 27:23</a>). The destruction of the temple is thus spoken of (<a href=\"#\" onClick=\"return mV('1Ki',9,8);\">1Ki 9:8</a>). Zechariah (<a href=\"#\" onClick=\"return mV('Zec',10,8);\">Zec 10:8</a>) speaks of the Lord gathering the house of Judah as it were with a hiss: \"I will hiss for them.\" This expression may be \"derived from the noise made to attract bees in hiving, or from the sound naturally made to attract a person's attention.\"";
eastonArray["$$T0001794"] = "<strong>Hittites:</strong> Palestine and Syria appear to have been originally inhabited by three different tribes.<br><br>(1.) The Semites, living on the east of the isthmus of Suez. They were nomadic and pastoral tribes.<br><br>(2.) The Phoenicians, who were merchants and traders; and<br><br>(3.) the Hittites, who were the warlike element of this confederation of tribes.<br><br>They inhabited the whole region between the Euphrates and Damascus, their chief cities being Carchemish on the Euphrates, and Kadesh, now Tell Neby Mendeh, in the Orontes valley, about six miles south of the Lake of Homs. These Hittites seem to have risen to great power as a nation, as for a long time they were formidable rivals of the Egyptian and Assyrian empires. In the book of Joshua they always appear as the dominant race to the north of Galilee.<br><br>Somewhere about the twenty-third century B.C. the Syrian confederation, led probably by the Hittites, arched against Lower Egypt, which they took possession of, making Zoan their capital. Their rulers were the Hyksos, or shepherd kings. They were at length finally driven out of Egypt. Rameses II. sought vengeance against the \"vile Kheta,\" as he called them, and encountered and defeated them in the great battle of Kadesh, four centuries after Abraham. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002114');\">JOSHUA</a>.)<br><br>They are first referred to in Scripture in the history of Abraham, who bought from Ephron the Hittite the field and the cave of Machpelah (<a href=\"#\" onClick=\"return mV('Gen',15,20);\">Gen 15:20</a>; <a href=\"#\" onClick=\"return mV('Gen',23,'3-18');\">23:3-18</a>). They were then settled at Kirjath-arba. From this tribe Esau took his first two wives (<a href=\"#\" onClick=\"return mV('Gen',26,34);\">26:34</a>; <a href=\"#\" onClick=\"return mV('Gen',36,2);\">36:2</a>).<br><br>They are afterwards mentioned in the usual way among the inhabitants of the Promised Land (<a href=\"#\" onClick=\"return mV('Exd',23,28);\">Exd 23:28</a>). They were closely allied to the Amorites, and are frequently mentioned along with them as inhabiting the mountains of Palestine. When the spies entered the land they seem to have occupied with the Amorites the mountain region of Judah (<a href=\"#\" onClick=\"return mV('Num',13,29);\">Num 13:29</a>). They took part with the other Canaanites against the Israelites (<a href=\"#\" onClick=\"return mV('Jos',9,1);\">Jos 9:1</a>; <a href=\"#\" onClick=\"return mV('Jos',11,3);\">11:3</a>).<br><br>After this there are few references to them in Scripture. Mention is made of \"Ahimelech the Hittite\" (<a href=\"#\" onClick=\"return mV('1Sa',26,6);\">1Sa 26:6</a>), and of \"Uriah the Hittite,\" one of David's chief officers (<a href=\"#\" onClick=\"return mV('2Sa',23,39);\">2Sa 23:39</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,41);\">1Ch 11:41</a>). In the days of Solomon they were a powerful confederation in the north of Syria, and were ruled by \"kings.\" They are met with after the Exile still a distinct people (<a href=\"#\" onClick=\"return mV('Ezr',9,1);\">Ezr 9:1</a>; <a href=\"#\" onClick=\"return mV('Neh',13,'23-28');\">Neh 13:23-28</a>).<br><br>The Hebrew merchants exported horses from Egypt not only for the kings of Israel, but also for the Hittites (<a href=\"#\" onClick=\"return mV('1Ki',10,28,29);\">1Ki 10:28-29</a>). From the Egyptian monuments we learn that \"the Hittites were a people with yellow skins and 'Mongoloid' features, whose receding foreheads, oblique eyes, and protruding upper jaws are represented as faithfully on their own monuments as they are on those of Egypt, so that we cannot accuse the Egyptian artists of caricaturing their enemies. The Amorites, on the contrary, were a tall and handsome people. They are depicted with white skins, blue eyes, and reddish hair, all the characteristics, in fact, of the white race\" (Sayce's The Hittites). The original seat of the Hittite tribes was the mountain ranges of Taurus. They belonged to Asia Minor, and not to Syria.";
eastonArray["$$T0001795"] = "<strong>Hivites:</strong> one of the original tribes scattered over Palestine, from Hermon to Gibeon in the south. The name is interpreted as \"midlanders\" or \"villagers\" (<a href=\"#\" onClick=\"return mV('Gen',10,17);\">Gen 10:17</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,15);\">1Ch 1:15</a>). They were probably a branch of the Hittites. At the time of Jacob's return to Canaan, Hamor the Hivite was the \"prince of the land\" (<a href=\"#\" onClick=\"return mV('Gen',24,'2-28');\">Gen 24:2-28</a>).<br><br>They are next mentioned during the Conquest (<a href=\"#\" onClick=\"return mV('Jos',9,7);\">Jos 9:7</a>; <a href=\"#\" onClick=\"return mV('Jos',11,19);\">11:19</a>). They principally inhabited the northern confines of Western Palestine (<a href=\"#\" onClick=\"return mV('Jos',11,3);\">Jos 11:3</a>; <a href=\"#\" onClick=\"return mV('Jdg',3,3);\">Jdg 3:3</a>). A remnant of them still existed in the time of Solomon (<a href=\"#\" onClick=\"return mV('1Ki',9,20);\">1Ki 9:20</a>).";
eastonArray["$$T0001796"] = "<strong>Hizkiah:</strong> an ancestor of the prophet Zephaniah (<a href=\"#\" onClick=\"return mV('Zep',1,1);\">Zep 1:1</a>).";
eastonArray["$$T0001797"] = "<strong>Hizkijah:</strong> (<a href=\"#\" onClick=\"return mV('Neh',10,17);\">Neh 10:17</a>), one who sealed the covenant.";
eastonArray["$$T0001798"] = "<strong>Hobab:</strong> beloved, the Kenite, has been usually identified with Jethro (q.v.), <a href=\"#\" onClick=\"return mV('Exd',18,5,27);\">Exd 18:5, 27</a>; comp. <a href=\"#\" onClick=\"return mV('Num',10,29,30);\">Num 10:29-30</a>. In <a href=\"#\" onClick=\"return mV('Jdg',4,11);\">Jdg 4:11</a>, the word rendered \"father-in-law\" means properly any male relative by marriage (<a href=\"#\" onClick=\"return mV('Gen',19,14);\">Gen 19:14</a>, \"son-in-law,\" A.V.), and should be rendered \"brother-in-law,\" as in the R.V. His descendants followed Israel to Canaan (<a href=\"#\" onClick=\"return mV('Num',10,29);\">Num 10:29</a>), and at first pitched their tents near Jericho, but afterwards settled in the south in the borders of Arad (<a href=\"#\" onClick=\"return mV('Jdg',1,'8-11',16);\">Jdg 1:8-11, 16</a>).";
eastonArray["$$T0001799"] = "<strong>Hobah:</strong> hiding-place, a place to the north of Damascus, to which Abraham pursued Chedorlaomer and his confederates (<a href=\"#\" onClick=\"return mV('Gen',14,15);\">Gen 14:15</a>).";
