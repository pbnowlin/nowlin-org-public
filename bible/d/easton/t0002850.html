<script>var eastonArray = new Array ();
eastonArray["$$T0002850"] = "<strong>Pardon:</strong> the forgiveness of sins granted freely (<a href=\"#\" onClick=\"return mV('Isa',43,25);\">Isa 43:25</a>), readily (<a href=\"#\" onClick=\"return mV('Neh',9,17);\">Neh 9:17</a>; <a href=\"#\" onClick=\"return mV('Psa',86,5);\">Psa 86:5</a>), abundantly (<a href=\"#\" onClick=\"return mV('Isa',55,7);\">Isa 55:7</a>; <a href=\"#\" onClick=\"return mV('Rom',5,20);\">Rom 5:20</a>). Pardon is an act of a sovereign, in pure sovereignty, granting simply a remission of the penalty due to sin, but securing neither honour nor reward to the pardoned. Justification (q.v.), on the other hand, is the act of a judge, and not of a sovereign, and includes pardon and, at the same time, a title to all the rewards and blessings promised in the covenant of life.";
eastonArray["$$T0002851"] = "<strong>Parlour:</strong> (from the Fr. parler, \"to speak\") denotes an \"audience chamber,\" but that is not the import of the Hebrew word so rendered. It corresponds to what the Turks call a kiosk, as in <a href=\"#\" onClick=\"return mV('Jdg',3,20);\">Jdg 3:20</a> (the \"summer parlour\"), or as in the margin of the Revised Version (\"the upper chamber of cooling\"), a small room built on the roof of the house, with open windows to catch the breeze, and having a door communicating with the outside by which persons seeking an audience may be admitted. While Eglon was resting in such a parlour, Ehud, under pretence of having a message from God to him, was admitted into his presence, and murderously plunged his dagger into his body (<a href=\"#\" onClick=\"return mV('Jdg',3,21,22);\">Jdg 3:21-22</a>).<br><br>The \"inner parlours\" in <a href=\"#\" onClick=\"return mV('1Ch',28,11);\">1Ch 28:11</a> were the small rooms or chambers which Solomon built all round two sides and one end of the temple (<a href=\"#\" onClick=\"return mV('1Ki',6,5);\">1Ki 6:5</a>), \"side chambers;\" or they may have been, as some think, the porch and the holy place.<br><br>In <a href=\"#\" onClick=\"return mV('1Sa',9,22);\">1Sa 9:22</a> the Revised Version reads \"guest chamber,\" a chamber at the high place specially used for sacrificial feasts.";
eastonArray["$$T0002852"] = "<strong>Parmashta:</strong> strong-fisted, a son of Haman, slain in Shushan (<a href=\"#\" onClick=\"return mV('Est',9,9);\">Est 9:9</a>).";
eastonArray["$$T0002853"] = "<strong>Parmenas:</strong> constant, one of the seven \"deacons\" (<a href=\"#\" onClick=\"return mV('Act',6,5);\">Act 6:5</a>).";
eastonArray["$$T0002854"] = "<strong>Parshandatha:</strong> an interpreter of the law, the eldest of Haman's sons, slain in Shushan (<a href=\"#\" onClick=\"return mV('Est',9,7);\">Est 9:7</a>).";
eastonArray["$$T0002855"] = "<strong>Parthians:</strong> were present in Jerusalem at Pentecost (<a href=\"#\" onClick=\"return mV('Act',2,9);\">Act 2:9</a>). Parthia lay on the east of Media and south of Hyrcania, which separated it from the Caspian Sea. It corresponded with the western half of the modern Khorasan, and now forms a part of Persia.";
eastonArray["$$T0002856"] = "<strong>Partridge:</strong> (Heb. kore, i.e., \"caller\"). This bird, unlike our own partridge, is distinguished by \"its ringing call-note, which in early morning echoes from cliff to cliff amidst the barrenness of the wilderness of Judea and the glens of the forest of Carmel\" hence its Hebrew name. This name occurs only twice in Scripture.<br><br>In <a href=\"#\" onClick=\"return mV('1Sa',26,20);\">1Sa 26:20</a> \"David alludes to the mode of chase practised now, as of old, when the partridge, continuously chased, was at length, when fatigued, knocked down by sticks thrown along the ground.\" It endeavours to save itself \"by running, in preference to flight, unless when suddenly startled. It is not an inhabitant of the plain or the corn-field, but of rocky hill-sides\" (Tristram's Nat. Hist.).<br><br>In <a href=\"#\" onClick=\"return mV('Jer',17,11);\">Jer 17:11</a> the prophet is illustrating the fact that riches unlawfully acquired are precarious and short-lived. The exact nature of the illustration cannot be precisely determined. Some interpret the words as meaning that the covetous man will be as surely disappointed as the partridge which gathers in eggs, not of her own laying, and is unable to hatch them; others (Tristram), with more probability, as denoting that the man who enriches himself by unjust means \"will as surely be disappointed as the partridge which commences to sit, but is speedily robbed of her hopes of a brood\" by her eggs being stolen away from her.<br><br>The commonest partridge in Palestine is the <i>Caccabis saxatilis</i>, the Greek partridge. The partridge of the wilderness (<i>Ammo-perdix heyi</i>) is a smaller species. Both are essentially mountain and rock birds, thus differing from the English partridge, which loves cultivated fields.";
eastonArray["$$T0002857"] = "<strong>Paruah:</strong> flourishing, the father of Jehoshaphat, appointed to provide monthly supplies for Solomon from the tribe of Issachar (<a href=\"#\" onClick=\"return mV('1Ki',4,17);\">1Ki 4:17</a>).";
eastonArray["$$T0002858"] = "<strong>Parvaim:</strong> the name of a country from which Solomon obtained gold for the temple (<a href=\"#\" onClick=\"return mV('2Ch',3,6);\">2Ch 3:6</a>). Some have identified it with Ophir, but it is uncertain whether it is even the name of a place. It may simply, as some think, denote \"Oriental regions.\"";
eastonArray["$$T0002859"] = "<strong>Pasach:</strong> clearing, one of the sons of Japhlet, of the tribe of Asher (<a href=\"#\" onClick=\"return mV('1Ch',7,33);\">1Ch 7:33</a>).";
eastonArray["$$T0002860"] = "<strong>Pas-dammim:</strong> the border of blood = Ephes-dammim (q.v.), between Shochoh and Azekah (<a href=\"#\" onClick=\"return mV('1Sa',17,1);\">1Sa 17:1</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,13);\">1Ch 11:13</a>).";
eastonArray["$$T0002861"] = "<strong>Pashur:</strong> release.<br><br>(1.) The son of Immer (<a href=\"#\" onClick=\"return mV('Neh',10,3);\">Neh 10:3</a>; <a href=\"#\" onClick=\"return mV('Neh',12,2);\">12:2</a>), the head of one of the priestly courses, was \"chief governor [Heb. paqid nagid, meaning \"deputy governor\"] of the temple\" (<a href=\"#\" onClick=\"return mV('Jer',20,1,2);\">Jer 20:1-2</a>). At this time the <i>nagid</i>, or \"governor,\" of the temple was Seraiah the high priest (<a href=\"#\" onClick=\"return mV('1Ch',6,14);\">1Ch 6:14</a>), and Pashur was his <i>paqid</i>, or \"deputy.\" Enraged at the plainness with which Jeremiah uttered his solemn warnings of coming judgements, because of the abounding iniquity of the times, Pashur ordered the temple police to seize him, and after inflicting on him corporal punishment (<a href=\"#\" onClick=\"return mV('Deu',25,3);\">Deu 25:3</a>; <a href=\"#\" onClick=\"return mV('2Cr',11,24);\">2Cr 11:24</a>), to put him in the stocks in the high gate of Benjamin, where he remained all night. On being set free in the morning, Jeremiah went to Pashur (<a href=\"#\" onClick=\"return mV('Jer',20,3,5);\">Jer 20:3, 5</a>), and announced to him that God had changed his name to Magor-missabib, i.e., \"terror on every side.\" The punishment that fell upon him was probably remorse, when he saw the ruin he had brought upon his country by advising a close alliance with Egypt in opposition to the counsels of Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',20,'4-6');\">Jer 20:4-6</a>). He was carried captive to Babylon, and died there.<br><br>(2.) A priest sent by king Zedekiah to Jeremiah to inquire of the Lord (<a href=\"#\" onClick=\"return mV('1Ch',24,9);\">1Ch 24:9</a>; <a href=\"#\" onClick=\"return mV('Jer',21,1);\">Jer 21:1</a>; <a href=\"#\" onClick=\"return mV('Jer',38,'1-6');\">38:1-6</a>). He advised that the prophet should be put to death.<br><br>(3.) The father of Gedaliah. He was probably the same as (1).";
eastonArray["$$T0002862"] = "<strong>Passage:</strong> denotes in <a href=\"#\" onClick=\"return mV('Jos',22,11);\">Jos 22:11</a>, as is generally understood, the place where the children of Israel passed over Jordan. The words \"the passage of\" are, however, more correctly rendered \"by the side of,\" or \"at the other side of,\" thus designating the position of the great altar erected by the eastern tribes on their return home. This word also designates the fords of the Jordan to the south of the Sea of Galilee (<a href=\"#\" onClick=\"return mV('Jdg',12,'5-6');\">Jdg 12:5-6</a>), and a pass or rocky defile (<a href=\"#\" onClick=\"return mV('1Sa',13,23);\">1Sa 13:23</a>; <a href=\"#\" onClick=\"return mV('1Sa',14,4);\">14:4</a>). \"Passages\" in <a href=\"#\" onClick=\"return mV('Jer',22,20);\">Jer 22:20</a> is in the Revised Version more correctly \"Abarim\" (q.v.), a proper name.";
eastonArray["$$T0002863"] = "<strong>Passion:</strong> Only once found, in <a href=\"#\" onClick=\"return mV('Act',1,3);\">Act 1:3</a>, meaning suffering, referring to the sufferings of our Lord.";
eastonArray["$$T0002864"] = "<strong>Passover:</strong> the name given to the chief of the three great historical annual festivals of the Jews. It was kept in remembrance of the Lord's passing over the houses of the Israelites (<a href=\"#\" onClick=\"return mV('Exd',12,13);\">Exd 12:13</a>) when the first born of all the Egyptians were destroyed. It is called also the \"feast of unleavened bread\" (<a href=\"#\" onClick=\"return mV('Exd',23,15);\">Exd 23:15</a>; <a href=\"#\" onClick=\"return mV('Mar',14,1);\">Mar 14:1</a>; <a href=\"#\" onClick=\"return mV('Act',12,3);\">Act 12:3</a>), because during its celebration no leavened bread was to be eaten or even kept in the household (<a href=\"#\" onClick=\"return mV('Exd',12,15);\">Exd 12:15</a>). The word afterwards came to denote the lamb that was slain at the feast (<a href=\"#\" onClick=\"return mV('Mar',14,'12-14');\">Mar 14:12-14</a>; <a href=\"#\" onClick=\"return mV('1Cr',5,7);\">1Cr 5:7</a>).<br><br>A detailed account of the institution of this feast is given in <a href=\"#\" onClick=\"return mV('Exd',12,'1-');\">Exd 12</a> and <a href=\"#\" onClick=\"return mV('Exd',13,'1-');\">13. It was afterwards incorporated in the ceremonial law (<a href=\"#\" onClick=\"return mV('Lev',23,'4-8');\">Lev 23:4-8</a>) as one of the great festivals of the nation. In after times many changes seem to have taken place as to the mode of its celebration as compared with its first celebration (<a href=\"#\" onClick=\"return mV('Deu',16,2,5,6);\">Deu 16:2, 5-6</a>; <a href=\"#\" onClick=\"return mV('2Ch',30,16);\">2Ch 30:16</a>; <a href=\"#\" onClick=\"return mV('Lev',23,'10-14');\">Lev 23:10-14</a>; <a href=\"#\" onClick=\"return mV('Num',9,10,11);\">Num 9:10-11</a>; <a href=\"#\" onClick=\"return mV('Num',28,'16-24');\">28:16-24</a>). Again, the use of wine (<a href=\"#\" onClick=\"return mV('Luk',22,17,20);\">Luk 22:17, 20</a>), of sauce with the bitter herbs (<a href=\"#\" onClick=\"return mV('Jhn',13,26);\">Jhn 13:26</a>), and the service of praise were introduced.<br><br>There is recorded only one celebration of this feast between the Exodus and the entrance into Canaan, namely, that mentioned in <a href=\"#\" onClick=\"return mV('Num',9,5);\">Num 9:5</a>. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002116');\">JOSIAH</a>.) It was primarily a commemorative ordinance, reminding the children of Israel of their deliverance out of Egypt; but it was, no doubt, also a type of the great deliverance wrought by the Messiah for all his people from the doom of death on account of sin, and from the bondage of sin itself, a worse than Egyptian bondage (<a href=\"#\" onClick=\"return mV('1Cr',5,7);\">1Cr 5:7</a>; <a href=\"#\" onClick=\"return mV('Jhn',1,29);\">Jhn 1:29</a>; <a href=\"#\" onClick=\"return mV('Jhn',19,'32-36');\">19:32-36</a>; <a href=\"#\" onClick=\"return mV('1Pe',1,19);\">1Pe 1:19</a>; <a href=\"#\" onClick=\"return mV('Gal',4,4,5);\">Gal 4:4-5</a>). The appearance of Jerusalem on the occasion of the Passover in the time of our Lord is thus fittingly described: \"The city itself and the neighbourhood became more and more crowded as the feast approached, the narrow streets and dark arched bazaars showing the same throng of men of all nations as when Jesus had first visited Jerusalem as a boy. Even the temple offered a strange sight at this season, for in parts of the outer courts a wide space was covered with pens for sheep, goats, and cattle to be used for offerings. Sellers shouted the merits of their beasts, sheep bleated, oxen lowed. Sellers of doves also had a place set apart for them. Potters offered a choice from huge stacks of clay dishes and ovens for roasting and eating the Passover lamb. Booths for wine, oil, salt, and all else needed for sacrifices invited customers. Persons going to and from the city shortened their journey by crossing the temple grounds, often carrying burdens...Stalls to change foreign money into the shekel of the temple, which alone could be paid to the priests, were numerous, the whole confusion making the sanctuary like a noisy market\" (Geikie's Life of Christ).";
eastonArray["$$T0002865"] = "<strong>Patara:</strong> a city on the south-west coast of Lycia at which Paul landed on his return from his third missionary journey (<a href=\"#\" onClick=\"return mV('Act',21,1,2);\">Act 21:1-2</a>). Here he found a larger vessel, which was about to sail across the open sea to the coast of Phoenicia. In this vessel he set forth, and reached the city of Tyre in perhaps two or three days.";
eastonArray["$$T0002866"] = "<strong>Pathros:</strong> the name generally given to Upper Egypt (the Thebaid of the Greeks), as distinguished from Matsor, or Lower Egypt (<a href=\"#\" onClick=\"return mV('Isa',11,11);\">Isa 11:11</a>; <a href=\"#\" onClick=\"return mV('Jer',44,1,15);\">Jer 44:1, 15</a>; <a href=\"#\" onClick=\"return mV('Eze',30,14);\">Eze 30:14</a>), the two forming Mizraim. After the destruction of Jerusalem by Nebuchadnezzar, colonies of Jews settled \"in the country of Pathros\" and other parts of Egypt.";
eastonArray["$$T0002867"] = "<strong>Patmos:</strong> a small rocky and barren island, one of the group called the \"Sporades,\" in the AEgean Sea. It is mentioned in Scripture only in <a href=\"#\" onClick=\"return mV('Rev',1,9);\">Rev 1:9</a>. It was on this island, to which John was banished by the emperor Domitian (A.D. 95), that he received from God the wondrous revelation recorded in his book. This has naturally invested it with the deepest interest for all time. It is now called Patmo. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002088');\">JOHN</a>.)";
eastonArray["$$T0002868"] = "<strong>Patriarch:</strong> a name employed in the New Testament with reference to Abraham (<a href=\"#\" onClick=\"return mV('Hbr',7,4);\">Hbr 7:4</a>), the sons of Jacob (<a href=\"#\" onClick=\"return mV('Act',7,8,9);\">Act 7:8-9</a>), and to David (<a href=\"#\" onClick=\"return mV('Act',2,29);\">2:29</a>). This name is generally applied to the progenitors of families or \"heads of the fathers\" (<a href=\"#\" onClick=\"return mV('Jos',14,1);\">Jos 14:1</a>) mentioned in Scripture, and they are spoken of as antediluvian (from Adam to Noah) and post-diluvian (from Noah to Jacob) patriachs. But the expression \"the patriarch,\" by way of eminence, is applied to the twelve sons of Jacob, or to Abraham, Isaac, and Jacob.<br><br>\"Patriachal longevity presents itself as one of the most striking of the facts concerning mankind which the early history of the Book of Genesis places before us...There is a large amount of consentient tradition to the effect that the life of man was originally far more prolonged than it is at present, extending to at least several hundred years. The Babylonians, Egyptians, and Chinese exaggerated these hundreds into thousands. The Greeks and Romans, with more moderation, limited human life within a thousand or eight hundred years. The Hindus still farther shortened the term. Their books taught that in the first age of the world man was free from diseases, and lived ordinarily four hundred years; in the second age the term of life was reduced from four hundred to three hundred; in the third it became two hundred; in the fourth and last it was brought down to one hundred\" (Rawlinson's Historical Illustrations).";
eastonArray["$$T0002869"] = "<strong>Patrobas:</strong> a Christian at Rome to whom Paul sent salutations (<a href=\"#\" onClick=\"return mV('Rom',16,14);\">Rom 16:14</a>).";
eastonArray["$$T0002870"] = "<strong>Pau:</strong> (<a href=\"#\" onClick=\"return mV('Gen',36,39);\">Gen 36:39</a>) or Pai (<a href=\"#\" onClick=\"return mV('1Ch',1,50);\">1Ch 1:50</a>), bleating, an Edomitish city ruled over by Hadar.";
eastonArray["$$T0002871"] = "<strong>Paul:</strong> =Saul (q.v.) was born about the same time as our Lord. His circumcision-name was Saul, and probably the name Paul was also given to him in infancy \"for use in the Gentile world,\" as \"Saul\" would be his Hebrew home-name. He was a native of Tarsus, the capital of Cilicia, a Roman province in the south-east of Asia Minor. That city stood on the banks of the river Cydnus, which was navigable thus far; hence it became a centre of extensive commercial traffic with many countries along the shores of the Mediterranean, as well as with the countries of central Asia Minor. It thus became a city distinguished for the wealth of its inhabitants.<br><br>Tarsus was also the seat of a famous university, higher in reputation even than the universities of Athens and Alexandria, the only others that then existed. Here Saul was born, and here he spent his youth, doubtless enjoying the best education his native city could afford. His father was of the straitest sect of the Jews, a Pharisee, of the tribe of Benjamin, of pure and unmixed Jewish blood (<a href=\"#\" onClick=\"return mV('Act',23,6);\">Act 23:6</a>; <a href=\"#\" onClick=\"return mV('Phl',3,5);\">Phl 3:5</a>). We learn nothing regarding his mother; but there is reason to conclude that she was a pious woman, and that, like-minded with her husband, she exercised all a mother influence in moulding the character of her son, so that he could afterwards speak of himself as being, from his youth up, \"touching the righteousness which is in the law, blameless\" (<a href=\"#\" onClick=\"return mV('Phl',3,6);\">Phl 3:6</a>).<br><br>We read of his sister and his sister's son (<a href=\"#\" onClick=\"return mV('Act',23,16);\">Act 23:16</a>), and of other relatives (<a href=\"#\" onClick=\"return mV('Rom',16,7,11,12);\">Rom 16:7, 11-12</a>). Though a Jew, his father was a Roman citizen. How he obtained this privilege we are not informed. \"It might be bought, or won by distinguished service to the state, or acquired in several other ways; at all events, his son was freeborn. It was a valuable privilege, and one that was to prove of great use to Paul, although not in the way in which his father might have been expected to desire him to make use of it.\" Perhaps the most natural career for the youth to follow was that of a merchant. \"But it was decided that...he should go to college and become a rabbi, that is, a minister, a teacher, and a lawyer all in one.\"<br><br>According to Jewish custom, however, he learned a trade before entering on the more direct preparation for the sacred profession. The trade he acquired was the making of tents from goats' hair cloth, a trade which was one of the commonest in Tarsus.<br><br>His preliminary education having been completed, Saul was sent, when about thirteen years of age probably, to the great Jewish school of sacred learning at Jerusalem as a student of the law. Here he became a pupil of the celebrated rabbi Gamaliel, and here he spent many years in an elaborate study of the Scriptures and of the many questions concerning them with which the rabbis exercised themselves. During these years of diligent study he lived \"in all good conscience,\" unstained by the vices of that great city.<br><br>After the period of his student-life expired, he probably left Jerusalem for Tarsus, where he may have been engaged in connection with some synagogue for some years. But we find him back again at Jerusalem very soon after the death of our Lord. Here he now learned the particulars regarding the crucifixion, and the rise of the new sect of the \"Nazarenes.\"<br><br>For some two years after Pentecost, Christianity was quietly spreading its influence in Jerusalem. At length Stephen, one of the seven deacons, gave forth more public and aggressive testimony that Jesus was the Messiah, and this led to much excitement among the Jews and much disputation in their synagogues. Persecution arose against Stephen and the followers of Christ generally, in which Saul of Tarsus took a prominent part. He was at this time probably a member of the great Sanhedrin, and became the active leader in the furious persecution by which the rulers then sought to exterminate Christianity.<br><br>But the object of this persecution also failed. \"They that were scattered abroad went everywhere preaching the word.\" The anger of the persecutor was thereby kindled into a fiercer flame. Hearing that fugitives had taken refuge in Damascus, he obtained from the chief priest letters authorizing him to proceed thither on his persecuting career. This was a long journey of about 130 miles, which would occupy perhaps six days, during which, with his few attendants, he steadily went onward, \"breathing out threatenings and slaughter.\" But the crisis of his life was at hand. He had reached the last stage of his journey, and was within sight of Damascus. As he and his companions rode on, suddenly at mid-day a brilliant light shone round them, and Saul was laid prostrate in terror on the ground, a voice sounding in his ears, \"Saul, Saul, why persecutest thou me?\" The risen Saviour was there, clothed in the vesture of his glorified humanity. In answer to the anxious inquiry of the stricken persecutor, \"Who art thou, Lord?\" he said, \"I am Jesus whom thou persecutest\" (<a href=\"#\" onClick=\"return mV('Act',9,5);\">Act 9:5</a>; <a href=\"#\" onClick=\"return mV('Act',22,8);\">22:8</a>; <a href=\"#\" onClick=\"return mV('Act',26,15);\">26:15</a>).<br><br>This was the moment of his conversion, the most solemn in all his life. Blinded by the dazzling light (<a href=\"#\" onClick=\"return mV('Act',9,8);\">Act 9:8</a>), his companions led him into the city, where, absorbed in deep thought for three days, he neither ate nor drank (<a href=\"#\" onClick=\"return mV('Act',9,11);\">9:11</a>). Ananias, a disciple living in Damascus, was informed by a vision of the change that had happened to Saul, and was sent to him to open his eyes and admit him by baptism into the Christian church (<a href=\"#\" onClick=\"return mV('Act',9,'11-16');\">9:11-16</a>). The whole purpose of his life was now permanently changed.<br><br>Immediately after his conversion he retired into the solitudes of Arabia (<a href=\"#\" onClick=\"return mV('Gal',1,17);\">Gal 1:17</a>), perhaps of \"Sinai in Arabia,\" for the purpose, probably, of devout study and meditation on the marvellous revelation that had been made to him. \"A veil of thick darkness hangs over this visit to Arabia. Of the scenes among which he moved, of the thoughts and occupations which engaged him while there, of all the circumstances of a crisis which must have shaped the whole tenor of his after-life, absolutely nothing is known. 'Immediately,' says St. Paul, 'I went away into Arabia.' The historian passes over the incident [comp. <a href=\"#\" onClick=\"return mV('Act',9,23);\">Act 9:23</a> and <a href=\"#\" onClick=\"return mV('1Ki',11,38,39);\">1Ki 11:38-39</a>]. It is a mysterious pause, a moment of suspense, in the apostle's history, a breathless calm, which ushers in the tumultuous storm of his active missionary life.\" Coming back, after three years, to Damascus, he began to preach the gospel \"boldly in the name of Jesus\" (<a href=\"#\" onClick=\"return mV('Act',9,27);\">Act 9:27</a>), but was soon obliged to flee (<a href=\"#\" onClick=\"return mV('Act',9,25);\">9:25</a>; <a href=\"#\" onClick=\"return mV('2Cr',11,33);\">2Cr 11:33</a>) from the Jews and betake himself to Jerusalem. Here he tarried for three weeks, but was again forced to flee (<a href=\"#\" onClick=\"return mV('Act',9,28,29);\">Act 9:28-29</a>) from persecution. He now returned to his native Tarsus (<a href=\"#\" onClick=\"return mV('Gal',1,21);\">Gal 1:21</a>), where, for probably about three years, we lose sight of him. The time had not yet come for his entering on his great life-work of preaching the gospel to the Gentiles.<br><br>At length the city of Antioch, the capital of Syria, became the scene of great Christian activity. There the gospel gained a firm footing, and the cause of Christ prospered. Barnabas (q.v.), who had been sent from Jerusalem to superintend the work at Antioch, found it too much for him, and remembering Saul, he set out to Tarsus to seek for him. He readily responded to the call thus addressed to him, and came down to Antioch, which for \"a whole year\" became the scene of his labours, which were crowned with great success. The disciples now, for the first time, were called \"Christians\" (<a href=\"#\" onClick=\"return mV('Act',11,26);\">Act 11:26</a>).<br><br>The church at Antioch now proposed to send out missionaries to the Gentiles, and Saul and Barnabas, with John Mark as their attendant, were chosen for this work. This was a great epoch in the history of the church. Now the disciples began to give effect to the Master's command: \"Go ye into all the world, and preach the gospel to every creature.\"<br><br>The three missionaries went forth on the first missionary tour. They sailed from Seleucia, the seaport of Antioch, across to Cyprus, some 80 miles to the south-west. Here at Paphos, Sergius Paulus, the Roman proconsul, was converted, and now Saul took the lead, and was ever afterwards called Paul. The missionaries now crossed to the mainland, and then proceeded 6 or 7 miles up the river Cestrus to Perga (<a href=\"#\" onClick=\"return mV('Act',13,13);\">Act 13:13</a>), where John Mark deserted the work and returned to Jerusalem. The two then proceeded about 100 miles inland, passing through Pamphylia, Pisidia, and Lycaonia. The towns mentioned in this tour are the Pisidian Antioch, where Paul delivered his first address of which we have any record (<a href=\"#\" onClick=\"return mV('Act',13,'16-51');\">Act 13:16-51</a>; <a href=\"#\" onClick=\"return mV('Act',10,'30-43');\">Act 10:30-43</a>), Iconium, Lystra, and Derbe. They returned by the same route to see and encourage the converts they had made, and ordain elders in every city to watch over the churches which had been gathered. From Perga they sailed direct for Antioch, from which they had set out.<br><br>After remaining \"a long time\", probably till A.D. 50 or 51, in Antioch, a great controversy broke out in the church there regarding the relation of the Gentiles to the Mosaic law. For the purpose of obtaining a settlement of this question, Paul and Barnabas were sent as deputies to consult the church at Jerusalem. The council or synod which was there held (<a href=\"#\" onClick=\"return mV('Act',15,'1-')\">Act 15</a>) decided against the Judaizing party; and the deputies, accompanied by Judas and Silas, returned to Antioch, bringing with them the decree of the council.<br><br>After a short rest at Antioch, Paul said to Barnabas: \"Let us go again and visit our brethren in every city where we have preached the word of the Lord, and see how they do.\" Mark proposed again to accompany them; but Paul refused to allow him to go. Barnabas was resolved to take Mark, and thus he and Paul had a sharp contention. They separated, and never again met. Paul, however, afterwards speaks with honour of Barnabas, and sends for Mark to come to him at Rome (<a href=\"#\" onClick=\"return mV('Col',4,10);\">Col 4:10</a>; <a href=\"#\" onClick=\"return mV('2Ti',4,11);\">2Ti 4:11</a>).<br><br>Paul took with him Silas, instead of Barnabas, and began his second missionary journey about A.D. 51. This time he went by land, revisiting the churches he had already founded in Asia. But he longed to enter into \"regions beyond,\" and still went forward through Phrygia and Galatia (<a href=\"#\" onClick=\"return mV('Act',16,6);\">Act 16:6</a>). Contrary to his intention, he was constrained to linger in Galatia (q.v.), on account of some bodily affliction (<a href=\"#\" onClick=\"return mV('Gal',4,13,14);\">Gal 4:13-14</a>). Bithynia, a populous province on the shore of the Black Sea, lay now before him, and he wished to enter it; but the way was shut, the Spirit in some manner guiding him in another direction, till he came down to the shores of the AEgean and arrived at Troas, on the north-western coast of Asia Minor (<a href=\"#\" onClick=\"return mV('Act',16,8);\">Act 16:8</a>). Of this long journey from Antioch to Troas we have no account except some references to it in his Epistle to the Galatians (<a href=\"#\" onClick=\"return mV('Gal',4,13);\">Gal 4:13</a>).<br><br>As he waited at Troas for indications of the will of God as to his future movements, he saw, in the vision of the night, a man from the opposite shores of Macedonia standing before him, and heard him cry, \"Come over, and help us\" (<a href=\"#\" onClick=\"return mV('Act',16,9);\">Act 16:9</a>). Paul recognized in this vision a message from the Lord, and the very next day set sail across the Hellespont, which separated him from Europe, and carried the tidings of the gospel into the Western world. In Macedonia, churches were planted in Philippi, Thessalonica, and Berea. Leaving this province, Paul passed into Achaia, \"the paradise of genius and renown.\" He reached Athens, but quitted it after, probably, a brief sojourn (<a href=\"#\" onClick=\"return mV('Act',17,'17-31');\">17:17-31</a>). The Athenians had received him with cold disdain, and he never visited that city again. He passed over to Corinth, the seat of the Roman government of Achaia, and remained there a year and a half, labouring with much success. While at Corinth, he wrote his two epistles to the church of Thessalonica, his earliest apostolic letters, and then sailed for Syria, that he might be in time to keep the feast of Pentecost at Jerusalem. He was accompanied by Aquila and Priscilla, whom he left at Ephesus, at which he touched, after a voyage of thirteen or fifteen days. He landed at Caesarea, and went up to Jerusalem, and having \"saluted the church\" there, and kept the feast, he left for Antioch, where he abode \"some time\" (<a href=\"#\" onClick=\"return mV('Act',18,'20-23');\">Act 18:20-23</a>).<br><br>He then began his third missionary tour. He journeyed by land in the \"upper coasts\" (the more eastern parts) of Asia Minor, and at length made his way to Ephesus, where he tarried for no less than three years, engaged in ceaseless Christian labour. \"This city was at the time the Liverpool of the Mediterranean. It possessed a splendid harbour, in which was concentrated the traffic of the sea which was then the highway of the nations; and as Liverpool has behind her the great towns of Lancashire, so had Ephesus behind and around her such cities as those mentioned along with her in the epistles to the churches in the book of Revelation, Smyrna, Pergamos, Thyatira, Sardis, Philadelphia, and Laodicea. It was a city of vast wealth, and it was given over to every kind of pleasure, the fame of its theatres and race-course being world-wide\" (Stalker's Life of St. Paul). Here a \"great door and effectual\" was opened to the apostle. His fellow-labourers aided him in his work, carrying the gospel to Colosse and Laodicea and other places which they could reach.<br><br>Very shortly before his departure from Ephesus, the apostle wrote his First Epistle to the Corinthians (q.v.). The silversmiths, whose traffic in the little images which they made was in danger (see <a href=\"#\" onClick=\"return doDictLookup('ET0001013');\">DEMETRIUS</a>), organized a riot against Paul, and he left the city, and proceeded to Troas (<a href=\"#\" onClick=\"return mV('2Cr',2,12);\">2Cr 2:12</a>), whence after some time he went to meet Titus in Macedonia. Here, in consequence of the report Titus brought from Corinth, he wrote his second epistle to that church. Having spent probably most of the summer and autumn in Macedonia, visiting the churches there, specially the churches of Philippi, Thessalonica, and Berea, probably penetrating into the interior, to the shores of the Adriatic (<a href=\"#\" onClick=\"return mV('Rom',15,19);\">Rom 15:19</a>), he then came into Greece, where he abode three months, spending probably the greater part of this time in Corinth (<a href=\"#\" onClick=\"return mV('Act',20,2);\">Act 20:2</a>). During his stay in this city he wrote his Epistle to the Galatians, and also the great Epistle to the Romans. At the end of the three months he left Achaia for Macedonia, thence crossed into Asia Minor, and touching at Miletus, there addressed the Ephesian presbyters, whom he had sent for to meet him (<a href=\"#\" onClick=\"return mV('Act',20,17);\">Act 20:17</a>), and then sailed for Tyre, finally reaching Jerusalem, probably in the spring of A.D. 58.<br><br>While at Jerusalem, at the feast of Pentecost, he was almost murdered by a Jewish mob in the temple. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003611');\">TEMPLE, HEROD'S</a>.) Rescued from their violence by the Roman commandant, he was conveyed as a prisoner to Caesarea, where, from various causes, he was detained a prisoner for two years in Herod's praetorium (<a href=\"#\" onClick=\"return mV('Act',23,35);\">Act 23:35</a>). \"Paul was not kept in close confinement; he had at least the range of the barracks in which he was detained. There we can imagine him pacing the ramparts on the edge of the Mediterranean, and gazing wistfully across the blue waters in the direction of Macedonia, Achaia, and Ephesus, where his spiritual children were pining for him, or perhaps encountering dangers in which they sorely needed his presence. It was a mysterious providence which thus arrested his energies and condemned the ardent worker to inactivity; yet we can now see the reason for it. Paul was needing rest. After twenty years of incessant evangelization, he required leisure to garner the harvest of experience...During these two years he wrote nothing; it was a time of internal mental activity and silent progress\" (Stalker's Life of St. Paul).<br><br>At the end of these two years Felix (q.v.) was succeeded in the governorship of Palestine by Porcius Festus, before whom the apostle was again heard. But judging it right at this crisis to claim the privilege of a Roman citizen, he appealed to the emperor (<a href=\"#\" onClick=\"return mV('Act',25,11);\">Act 25:11</a>). Such an appeal could not be disregarded, and Paul was at once sent on to Rome under the charge of one Julius, a centurion of the \"Augustan cohort.\" After a long and perilous voyage, he at length reached the imperial city in the early spring, probably, of A.D. 61. Here he was permitted to occupy his own hired house, under constant military custody. This privilege was accorded to him, no doubt, because he was a Roman citizen, and as such could not be put into prison without a trial. The soldiers who kept guard over Paul were of course changed at frequent intervals, and thus he had the opportunity of preaching the gospel to many of them during these \"two whole years,\" and with the blessed result of spreading among the imperial guards, and even in Caesar's household, an interest in the truth (<a href=\"#\" onClick=\"return mV('Phl',1,13);\">Phl 1:13</a>). His rooms were resorted to by many anxious inquirers, both Jews and Gentiles (<a href=\"#\" onClick=\"return mV('Act',28,23,30,31);\">Act 28:23, 30-31</a>), and thus his imprisonment \"turned rather to the furtherance of the gospel,\" and his \"hired house\" became the centre of a gracious influence which spread over the whole city. According to a Jewish tradition, it was situated on the borders of the modern Ghetto, which has been the Jewish quarters in Rome from the time of Pompey to the present day. During this period the apostle wrote his epistles to the Colossians, Ephesians, Philippians, and to Philemon, and probably also to the Hebrews.<br><br>This first imprisonment came at length to a close, Paul having been acquitted, probably because no witnesses appeared against him. Once more he set out on his missionary labours, probably visiting western and eastern Europe and Asia Minor. During this period of freedom he wrote his First Epistle to Timothy and his Epistle to Titus. The year of his release was signalized by the burning of Rome, which Nero saw fit to attribute to the Christians. A fierce persecution now broke out against the Christians. Paul was siezed, and once more conveyed to Rome a prisoner. During this imprisonment he probably wrote the Second Epistle to Timothy, the last he ever wrote. \"There can be little doubt that he appered again at Nero's bar, and this time the charge did not break down. In all history there is not a more startling illustration of the irony of human life than this scene of Paul at the bar of Nero. On the judgment-seat, clad in the imperial purple, sat a man who, in a bad world, had attained the eminence of being the very worst and meanest being in it, a man stained with every crime, a man whose whole being was so steeped in every nameable and unnameable vice, that body and soul of him were, as some one said at the time, nothing but a compound of mud and blood; and in the prisoner's dock stood the best man the world possessed, his hair whitened with labours for the good of men and the glory of God. The trial ended: Paul was condemned, and delivered over to the executioner. He was led out of the city, with a crowd of the lowest rabble at his heels. The fatal spot was reached; he knelt beside the block; the headsman's axe gleamed in the sun and fell; and the head of the apostle of the world rolled down in the dust\" (probably A.D. 66), four years before the fall of Jerusalem.";
eastonArray["$$T0002872"] = "<strong>Pavement:</strong> It was the custom of the Roman governors to erect their tribunals in open places, as the market-place, the circus, or even the highway. Pilate caused his seat of judgment to be set down in a place called \"the Pavement\" (<a href=\"#\" onClick=\"return mV('Jhn',19,13);\">Jhn 19:13</a>) i.e., a place paved with a mosaic of coloured stones. It was probably a place thus prepared in front of the \"judgment hall.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0001403');\">GABBATHA</a>.)";
eastonArray["$$T0002873"] = "<strong>Pavilion:</strong> a tent or tabernacle (<a href=\"#\" onClick=\"return mV('2Sa',22,12);\">2Sa 22:12</a>; <a href=\"#\" onClick=\"return mV('1Ki',20,'12-16');\">1Ki 20:12-16</a>), or enclosure (<a href=\"#\" onClick=\"return mV('Psa',18,11);\">Psa 18:11</a>; <a href=\"#\" onClick=\"return mV('Psa',27,5);\">27:5</a>). In <a href=\"#\" onClick=\"return mV('Jer',43,10);\">Jer 43:10</a> it probably denotes the canopy suspended over the judgement-seat of the king.";
eastonArray["$$T0002874"] = "<strong>Peace offerings:</strong> (Heb. shelamim), detailed regulations regarding given in <a href=\"#\" onClick=\"return mV('Jer',3,'1-');\">Lev 3</a>; <a href=\"#\" onClick=\"return mV('Jer',7,'11-21','29-34');\">7:11-21, 29-34</a>. They were of three kinds,<br><br>(1) eucharistic or thanksgiving offerings, expressive of gratitude for blessings received;<br><br>(2) in fulfilment of a vow, but expressive also of thanks for benefits recieved; and<br><br>(3) free-will offerings, something spontaneously devoted to God.";
eastonArray["$$T0002875"] = "<strong>Peacock:</strong> (Heb. tuk, apparently borrowed from the Tamil tokei). This bird is indigenous to India. It was brought to Solomon by his ships from Tarshish (<a href=\"#\" onClick=\"return mV('1Ki',10,22);\">1Ki 10:22</a>; <a href=\"#\" onClick=\"return mV('2Ch',9,21);\">2Ch 9:21</a>), which in this case was probably a district on the Malabar coast of India, or in Ceylon. The word so rendered in <a href=\"#\" onClick=\"return mV('Job',39,13);\">Job 39:13</a> literally means wild, tumultuous crying, and properly denotes the female ostrich (q.v.).";
eastonArray["$$T0002876"] = "<strong>Pearl:</strong> (<a href=\"#\" onClick=\"return mV('Job',28,18);\">Job 28:18</a>; <a href=\"#\" onClick=\"return mV('Mat',7,6);\">Mat 7:6</a>; <a href=\"#\" onClick=\"return mV('Mat',13,46);\">13:46</a>; <a href=\"#\" onClick=\"return mV('Rev',21,21);\">Rev 21:21</a>). The pearl oyster is found in the Persian Gulf and the Red Sea. Its shell is the \"mother of pearl,\" which is of great value for ornamental purposes (<a href=\"#\" onClick=\"return mV('1Ti',2,9);\">1Ti 2:9</a>; <a href=\"#\" onClick=\"return mV('Rev',17,4);\">Rev 17:4</a>). Each shell contains eight or ten pearls of various sizes.";
eastonArray["$$T0002877"] = "<strong>Peculiar:</strong> as used in the phrase \"peculiar people\" in <a href=\"#\" onClick=\"return mV('1Pe',2,9);\">1Pe 2:9</a>, is derived from the Lat. peculium, and denotes, as rendered in the Revised Version (\"a people for God's own possession\"), a special possession or property. The church is the \"property\" of God, his \"purchased possession\" (<a href=\"#\" onClick=\"return mV('Eph',1,14);\">Eph 1:14</a>; R.V., \"God's own possession\").";
eastonArray["$$T0002878"] = "<strong>Pedahel:</strong> redeemed of God, the son of Ammihud, a prince of Naphtali (<a href=\"#\" onClick=\"return mV('Num',34,28);\">Num 34:28</a>).";
eastonArray["$$T0002879"] = "<strong>Pedahzur:</strong> rock of redemption, the father of Gamaliel and prince of Manasseh at the time of the Exodus (<a href=\"#\" onClick=\"return mV('Num',1,10);\">Num 1:10</a>; <a href=\"#\" onClick=\"return mV('Num',2,20);\">2:20</a>).";
eastonArray["$$T0002880"] = "<strong>Pedaiah:</strong> redemption of the Lord.<br><br>(1.) The father of Zebudah, who was the wife of Josiah and mother of king Jehoiakim (<a href=\"#\" onClick=\"return mV('2Ki',23,36);\">2Ki 23:36</a>).<br><br>(2.) The father of Zerubbabel (<a href=\"#\" onClick=\"return mV('1Ch',3,'17-19');\">1Ch 3:17-19</a>).<br><br>(3.). The father of Joel, ruler of the half-tribe of Manasseh (<a href=\"#\" onClick=\"return mV('1Ch',27,20);\">1Ch 27:20</a>).<br><br>(4.) <a href=\"#\" onClick=\"return mV('Neh',3,25);\">Neh 3:25</a>.<br><br>(5.) A Levite (<a href=\"#\" onClick=\"return mV('Neh',8,4);\">8:4</a>).<br><br>(6.) A Benjamite (<a href=\"#\" onClick=\"return mV('Neh',11,7);\">11:7</a>).<br><br>(7.) A Levite (<a href=\"#\" onClick=\"return mV('Neh',13,13);\">13:13</a>).";
eastonArray["$$T0002881"] = "<strong>Pekah:</strong> open-eyed, the son of Remaliah a captain in the army of Pekahiah, king of Israel, whom he slew, with the aid of a band of Gileadites, and succeeded (B.C. 758) on the throne (<a href=\"#\" onClick=\"return mV('2Ki',15,25);\">2Ki 15:25</a>). Seventeen years after this he entered into an alliance with Rezin, king of Syria, and took part with him in besieging Jerusalem (<a href=\"#\" onClick=\"return mV('2Ki',15,37);\">2Ki 15:37</a>; <a href=\"#\" onClick=\"return mV('2Ki',16,5);\">16:5</a>). But Tiglath-pilser, who was in alliance with Ahaz, king of Judah, came up against Pekah, and carried away captive many of the inhabitants of his kingdom (<a href=\"#\" onClick=\"return mV('2Ki',15,29);\">2Ki 15:29</a>). This was the beginning of the \"Captivity.\" Soon after this Pekah was put to death by Hoshea, the son of Elah, who usurped the throne (<a href=\"#\" onClick=\"return mV('2Ki',15,30);\">2Ki 15:30</a>; <a href=\"#\" onClick=\"return mV('Isa',7,16);\">Isa 7:16</a>; <a href=\"#\" onClick=\"return mV('Isa',8,4);\">8:4</a>; <a href=\"#\" onClick=\"return mV('Isa',9,12);\">9:12</a>). He is supposed by some to have been the \"shephard\" mentioned in <a href=\"#\" onClick=\"return mV('Zec',11,16);\">Zec 11:16</a>.";
eastonArray["$$T0002882"] = "<strong>Pekahiah:</strong> the Lord opened his eyes, the son and successor of Menahem on the throne of Israel. He was murdered in the royal palace of Samaria by Pekah, one of the captains of his army (<a href=\"#\" onClick=\"return mV('2Ki',15,'23-26');\">2Ki 15:23-26</a>), after a reign of two years (B.C. 761-759). He \"did that which was evil in the sight of the Lord.\"";
eastonArray["$$T0002883"] = "<strong>Pekod:</strong> probably a place in Babylonia (<a href=\"#\" onClick=\"return mV('Jer',50,21);\">Jer 50:21</a>; <a href=\"#\" onClick=\"return mV('Eze',23,23);\">Eze 23:23</a>). It is the opinion, however, of some that this word signifies \"visitation,\" \"punishment,\" and allegorically \"designates Babylon as the city which was to be destroyed.\"";
eastonArray["$$T0002884"] = "<strong>Pelaiah:</strong> distinguished of the Lord.<br><br>(1.) One of David's posterity (<a href=\"#\" onClick=\"return mV('1Ch',3,24);\">1Ch 3:24</a>).<br><br>(2.) A Levite who expounded the law (<a href=\"#\" onClick=\"return mV('Neh',8,7);\">Neh 8:7</a>).";
eastonArray["$$T0002885"] = "<strong>Pelatiah:</strong> deliverance of the Lord.<br><br>(1.) A son of Hananiah and grandson of Zerubbabel (<a href=\"#\" onClick=\"return mV('1Ch',3,21);\">1Ch 3:21</a>).<br><br>(2.) A captain of \"the sons of Simeon\" (<a href=\"#\" onClick=\"return mV('1Ch',4,42);\">4:42</a>).<br><br>(3.) <a href=\"#\" onClick=\"return mV('Neh',10,22);\">Neh 10:22</a>.<br><br>(4.) One of the twenty-five princes of the people against whom Ezekiel prophesied on account of their wicked counsel (<a href=\"#\" onClick=\"return mV('Eze',11,'1-13');\">Eze 11:1-13</a>).";
eastonArray["$$T0002886"] = "<strong>Peleg:</strong> division, one of the sons of Eber; so called because \"in his days was the earth divided\" (<a href=\"#\" onClick=\"return mV('Gen',10,25);\">Gen 10:25</a>). Possibly he may have lived at the time of the dispersion from Babel. But more probably the reference is to the dispersion of the two races which sprang from Eber, the one spreading towards Mesopotamia and Syria, and the other southward into Arabia.";
eastonArray["$$T0002887"] = "<strong>Pelet:</strong> deliverance.<br><br>(1.) A descendant of Judah (<a href=\"#\" onClick=\"return mV('1Ch',2,47);\">1Ch 2:47</a>).<br><br>(2.) A Benjamite who joined David at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,3);\">1Ch 12:3</a>).";
eastonArray["$$T0002888"] = "<strong>Peleth:</strong> swiftness.<br><br>(1.) A Reubenite whose son was one of the conspirators against Moses and Aaron (<a href=\"#\" onClick=\"return mV('Num',16,1);\">Num 16:1</a>).<br><br>(2.) One of the sons of Jonathan (<a href=\"#\" onClick=\"return mV('1Ch',2,33);\">1Ch 2:33</a>).";
eastonArray["$$T0002889"] = "<strong>Pelethites:</strong> mentioned always along with the Cherethites, and only in the time of David. The word probably means \"runners\" or \"couriers,\" and may denote that while forming part of David's bodyguard, they were also sometimes employed as couriers (<a href=\"#\" onClick=\"return mV('2Sa',8,18);\">2Sa 8:18</a>; <a href=\"#\" onClick=\"return mV('2Sa',20,7,23);\">20:7, 23</a>; <a href=\"#\" onClick=\"return mV('1Ki',1,38,44);\">1Ki 1:38, 44</a>; <a href=\"#\" onClick=\"return mV('1Ch',18,17);\">1Ch 18:17</a>). Some, however, think that these are the names simply of two Philistine tribes from which David selected his body-guard. They are mentioned along with the Gittites (<a href=\"#\" onClick=\"return mV('2Sa',15,18);\">2Sa 15:18</a>), another body of foreign troops whom David gathered round him.";
eastonArray["$$T0002890"] = "<strong>Pelicans:</strong> are frequently met with at the waters of Merom and the Sea of Galilee. The pelican is ranked among unclean birds (<a href=\"#\" onClick=\"return mV('Lev',11,18);\">Lev 11:18</a>; <a href=\"#\" onClick=\"return mV('Deu',14,17);\">Deu 14:17</a>). It is of an enormous size, being about 6 feet long, with wings stretching out over 12 feet. The Hebrew name (kaath, i.e., \"vomiter\") of this bird is incorrectly rendered \"cormorant\" in the Authorized Version of <a href=\"#\" onClick=\"return mV('Isa',34,11);\">Isa 34:11</a> and <a href=\"#\" onClick=\"return mV('Zep',2,14);\">Zep 2:14</a>, but correctly in the Revised Version. It receives its Hebrew name from its habit of storing in its pouch large quantities of fish, which it disgorges when it feeds its young. Two species are found on the Syrian coast, the <i>Pelicanus onocrotalus</i>, or white pelican, and the <i>Pelicanus crispus</i>, or Dalmatian pelican.";
eastonArray["$$T0002891"] = "<strong>Penny:</strong> (Gr. denarion), a silver coin of the value of about 7 1/2d. or 8d. of our present money. It is thus rendered in the New Testament, and is more frequently mentioned than any other coin (<a href=\"#\" onClick=\"return mV('Mat',18,28);\">Mat 18:28</a>; <a href=\"#\" onClick=\"return mV('Mat',20,2,9,13);\">20:2, 9, 13</a>; <a href=\"#\" onClick=\"return mV('Mar',6,37);\">Mar 6:37</a>; <a href=\"#\" onClick=\"return mV('Mar',14,5);\">14:5</a>, etc.). It was the daily pay of a Roman soldier in the time of Christ. In the reign of Edward III. an English penny was a labourer's day's wages. This was the \"tribute money\" with reference to which our Lord said, \"Whose image and superscription is this?\" When they answered, \"Caesar's,\" he replied, \"Render therefore to Caesar the things that are Caesar's; and to God the things that are God's\" (<a href=\"#\" onClick=\"return mV('Mat',22,19);\">Mat 22:19</a>; <a href=\"#\" onClick=\"return mV('Mar',12,15);\">Mar 12:15</a>).";
eastonArray["$$T0002892"] = "<strong>Pentateuch:</strong> the five-fold volume, consisting of the first five books of the Old Testament. This word does not occur in Scripture, nor is it certainly known when the roll was thus divided into five portions Genesis, Exodus, Leviticus, Numbers, Deuteronomy. Probably that was done by the LXX. translators. Some modern critics speak of a Hexateuch, introducing the Book of Joshua as one of the group. But this book is of an entirely different character from the other books, and has a different author. It stands by itself as the first of a series of historical books beginning with the entrance of the Israelites into Canaan. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002114');\">JOSHUA</a>.)<br><br>The books composing the Pentateuch are properly but one book, the \"Law of Moses,\" the \"Book of the Law of Moses,\" the \"Book of Moses,\" or, as the Jews designate it, the \"Torah\" or \"Law.\" That in its present form it \"proceeds from a single author is proved by its plan and aim, according to which its whole contents refer to the covenant concluded between Jehovah and his people, by the instrumentality of Moses, in such a way that everything before his time is perceived to be preparatory to this fact, and all the rest to be the development of it. Nevertheless, this unity has not been stamped upon it as a matter of necessity by the latest redactor: it has been there from the beginning, and is visible in the first plan and in the whole execution of the work.\", Keil, Einl. i.d. A. T.<br><br>A certain school of critics have set themselves to reconstruct the books of the Old Testament. By a process of \"scientific study\" they have discovered that the so-called historical books of the Old Testament are not history at all, but a miscellaneous collection of stories, the inventions of many different writers, patched together by a variety of editors! As regards the Pentateuch, they are not ashamed to attribute fraud, and even conspiracy, to its authors, who sought to find acceptance to their work which was composed partly in the age of Josiah, and partly in that of Ezra and Nehemiah, by giving it out to be the work of Moses! This is not the place to enter into the details of this controversy. We may say frankly, however, that we have no faith in this \"higher criticism.\" It degrades the books of the Old Testament below the level of fallible human writings, and the arguments on which its speculations are built are altogether untenable.<br><br>The evidences in favour of the Mosaic authorship of the Pentateuch are conclusive. We may thus state some of them briefly:<br><br>(1.) These books profess to have been written by Moses in the name of God (<a href=\"#\" onClick=\"return mV('Exd',17,14);\">Exd 17:14</a>; <a href=\"#\" onClick=\"return mV('Exd',24,3,4,7);\">24:3-4, 7</a>; <a href=\"#\" onClick=\"return mV('Exd',32,'7-10','30-34');\">32:7-10, 30-34; <a href=\"#\" onClick=\"return mV('Exd',34,27);\">34:27</a>; <a href=\"#\" onClick=\"return mV('Lev',26,46);\">Lev 26:46</a>; <a href=\"#\" onClick=\"return mV('Lev',27,34);\">27:34</a>; <a href=\"#\" onClick=\"return mV('Deu',31,9,24,25);\">Deu 31:9, 24-25</a>).<br><br>(2.) This also is the uniform and persistent testimony of the Jews of all sects in all ages and countries (<a href=\"#\" onClick=\"return mV('Jos',8,31,32);\">Jos 8:31-32</a>; <a href=\"#\" onClick=\"return mV('1Ki',2,3);\">1Ki 2:3</a>; <a href=\"#\" onClick=\"return mV('Jer',7,22);\">Jer 7:22</a>; <a href=\"#\" onClick=\"return mV('Ezr',6,18);\">Ezr 6:18</a>; <a href=\"#\" onClick=\"return mV('Neh',8,1);\">Neh 8:1</a>; <a href=\"#\" onClick=\"return mV('Mal',4,4);\">Mal 4:4</a>; <a href=\"#\" onClick=\"return mV('Mat',22,24);\">Mat 22:24</a>; <a href=\"#\" onClick=\"return mV('Act',15,21);\">Act 15:21</a>).<br><br>(3.) Our Lord plainly taught the Mosaic authorship of these books (<a href=\"#\" onClick=\"return mV('Mat',5,17,18);\">Mat 5:17-18</a>; <a href=\"#\" onClick=\"return mV('Mat',19,8);\">19:8</a>; <a href=\"#\" onClick=\"return mV('Mat',22,31,32);\">22:31-32</a>; <a href=\"#\" onClick=\"return mV('Mat',23,2);\">23:2</a>; <a href=\"#\" onClick=\"return mV('Mar',10,9);\">Mar 10:9</a>; <a href=\"#\" onClick=\"return mV('Mar',12,26);\">12:26</a>; <a href=\"#\" onClick=\"return mV('Luk',16,31);\">Luk 16:31</a>; <a href=\"#\" onClick=\"return mV('Luk',20,37);\">20:37</a>; <a href=\"#\" onClick=\"return mV('Luk',24,26,27,44);\">24:26-27, 44</a>; <a href=\"#\" onClick=\"return mV('Jhn',3,14);\">Jhn 3:14</a>; <a href=\"#\" onClick=\"return mV('Jhn',5,'45-47');\">5:45-47</a>; <a href=\"#\" onClick=\"return mV('Jhn',6,32,49);\">6:32, 49</a>; <a href=\"#\" onClick=\"return mV('Jhn',7,19,22);\">7:19, 22</a>). In the face of this fact, will any one venture to allege either that Christ was ignorant of the composition of the Bible, or that, knowing the true state of the case, he yet encouraged the people in the delusion they clung to?<br><br>(4.) From the time of Joshua down to the time of Ezra there is, in the intermediate historical books, a constant reference to the Pentateuch as the \"Book of the Law of Moses.\" This is a point of much importance, inasmuch as the critics deny that there is any such reference; and hence they deny the historical character of the Pentateuch. As regards the Passover, e.g., we find it frequently spoken of or alluded to in the historical books following the Pentateuch, showing that the \"Law of Moses\" was then certainly known. It was celebrated in the time of Joshua (<a href=\"#\" onClick=\"return mV('Jos',5,10);\">Jos 5:10</a>, cf. <a href=\"#\" onClick=\"return mV('Jos',4,19);\">4:19</a>), Hezekiah (<a href=\"#\" onClick=\"return mV('2Ch',30,'1-')\">2Ch 30</a>), Josiah (<a href=\"#\" onClick=\"return mV('2Ki',23,'1-')\">2Ki 23</a>; <a href=\"#\" onClick=\"return mV('2Ch',35,'1-')\">2Ch 35</a>), and Zerubbabel (<a href=\"#\" onClick=\"return mV('Ezr',6,'19-22');\">Ezr 6:19-22</a>), and is referred to in such passages as <a href=\"#\" onClick=\"return mV('2Ki',23,22);\">2Ki 23:22</a>; <a href=\"#\" onClick=\"return mV('2Ch',35,18);\">2Ch 35:18</a>; <a href=\"#\" onClick=\"return mV('1Ki',9,25);\">1Ki 9:25</a> (\"three times in a year\"); <a href=\"#\" onClick=\"return mV('2Ch',8,13);\">2Ch 8:13</a>. Similarly we might show frequent references to the Feast of Tabernacles and other Jewish institutions, although we do not admit that any valid argument can be drawn from the silence of Scripture in such a case. An examination of the following texts, <a href=\"#\" onClick=\"return mV('1Ki',2,9);\">1Ki 2:9</a>; <a href=\"#\" onClick=\"return mV('2Ki',14,6);\">2Ki 14:6</a>; <a href=\"#\" onClick=\"return mV('2Ch',23,18);\">2Ch 23:18</a>; <a href=\"#\" onClick=\"return mV('2Ch',25,4);\">25:4</a>; <a href=\"#\" onClick=\"return mV('2Ch',34,14);\">34:14</a>; <a href=\"#\" onClick=\"return mV('Ezr',3,2);\">Ezr 3:2</a>; <a href=\"#\" onClick=\"return mV('Ezr',7,6);\">7:6</a>; <a href=\"#\" onClick=\"return mV('Dan',9,11,13);\">Dan 9:11, 13</a>, will also plainly show that the \"Law of Moses\" was known during all these centuries.<br><br>Granting that in the time of Moses there existed certain oral traditions or written records and documents which he was divinely led to make use of in his history, and that his writing was revised by inspired successors, this will fully account for certain peculiarities of expression which critics have called \"anachronisms\" and \"contradictions,\" but in no way militates against the doctrine that Moses was the original author of the whole of the Pentateuch. It is not necessary for us to affirm that the whole is an original composition; but we affirm that the evidences clearly demonstrate that Moses was the author of those books which have come down to us bearing his name. The Pentateuch is certainly the basis and necessary preliminary of the whole of the Old Testament history and literature. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001024');\">DEUTERONOMY</a>.)";
eastonArray["$$T0002893"] = "<strong>Pentecost:</strong> i.e., \"fiftieth\", found only in the New Testament (<a href=\"#\" onClick=\"return mV('Act',2,1);\">Act 2:1</a>; <a href=\"#\" onClick=\"return mV('Act',20,16);\">20:16</a>; <a href=\"#\" onClick=\"return mV('1Cr',16,8);\">1Cr 16:8</a>). The festival so named is first spoken of in <a href=\"#\" onClick=\"return mV('Exd',23,16);\">Exd 23:16</a> as \"the feast of harvest,\" and again in <a href=\"#\" onClick=\"return mV('Exd',34,22);\">Exd 34:22</a> as \"the day of the firstfruits\" (<a href=\"#\" onClick=\"return mV('Num',28,26);\">Num 28:26</a>). From the sixteenth of the month of Nisan (the second day of the Passover), seven complete weeks, i.e., forty-nine days, were to be reckoned, and this feast was held on the fiftieth day. The manner in which it was to be kept is described in <a href=\"#\" onClick=\"return mV('Lev',23,'15-19');\">Lev 23:15-19</a>; <a href=\"#\" onClick=\"return mV('Num',28,'27-29');\">Num 28:27-29</a>. Besides the sacrifices prescribed for the occasion, every one was to bring to the Lord his \"tribute of a free-will offering\" (<a href=\"#\" onClick=\"return mV('Deu',16,'9-11');\">Deu 16:9-11</a>). The purpose of this feast was to commemorate the completion of the grain harvest. Its distinguishing feature was the offering of \"two leavened loaves\" made from the new corn of the completed harvest, which, with two lambs, were waved before the Lord as a thank offering.<br><br>The day of Pentecost is noted in the Christian Church as the day on which the Spirit descended upon the apostles, and on which, under Peter's preaching, so many thousands were converted in Jerusalem (<a href=\"#\" onClick=\"return mV('Act',2,'1-')\">Act 2</a>).";
eastonArray["$$T0002894"] = "<strong>Penuel:</strong> face of God, a place not far from Succoth, on the east of the Jordan and north of the river Jabbok. It is also called \"Peniel.\" Here Jacob wrestled (<a href=\"#\" onClick=\"return mV('Gen',32,'24-32');\">Gen 32:24-32</a>) \"with a man\" (<a href=\"#\" onClick=\"return mV('Hsa',12,4);\">Hsa 12:4</a>. Jacob says of him, \"I have seen God face to face\") \"till the break of day.\"<br><br>A town was afterwards built there (<a href=\"#\" onClick=\"return mV('Jdg',8,8);\">Jdg 8:8</a>; <a href=\"#\" onClick=\"return mV('1Ki',12,25);\">1Ki 12:25</a>). The men of this place refused to succour Gideon and his little army when they were in pursuit of the Midianites (<a href=\"#\" onClick=\"return mV('Jdg',8,'1-21');\">Jdg 8:1-21</a>). On his return, Gideon slew the men of this city and razed its lofty watch-tower to the ground.";
eastonArray["$$T0002895"] = "<strong>Peor:</strong> opening.<br><br>(1.) A mountain peak (<a href=\"#\" onClick=\"return mV('Num',23,28);\">Num 23:28</a>) to which Balak led Balaam as a last effort to induce him to pronounce a curse upon Israel. When he looked on the tribes encamped in the acacia groves below him, he could not refrain from giving utterance to a remarkable benediction (<a href=\"#\" onClick=\"return mV('Num',24,'1-9');\">24:1-9</a>). Balak was more than ever enraged at Balaam, and bade him flee for his life. But before he went he gave expression to that wonderful prediction regarding the future of this mysterious people, whose \"goodly tents\" were spread out before him, and the coming of a \"Star\" out of Jacob and a \"Sceptre\" out of Israel (<a href=\"#\" onClick=\"return mV('Num',24,'14-17');\">24:14-17</a>).<br><br>(2.) A Moabite divinity, called also \"Baal-peor\" (<a href=\"#\" onClick=\"return mV('Num',25,3,5,18);\">Num 25:3, 5, 18</a>; <a href=\"#\" onClick=\"return mV('Deu',3,29);\">Deu 3:29</a>).";
eastonArray["$$T0002896"] = "<strong>Perazim, Mount:</strong> mount of breaches, only in <a href=\"#\" onClick=\"return mV('Isa',28,21);\">Isa 28:21</a>. It is the same as BAAL-PERAZIM (q.v.), where David gained a victory over the Philistines (<a href=\"#\" onClick=\"return mV('2Sa',5,20);\">2Sa 5:20</a>).";
eastonArray["$$T0002897"] = "<strong>Peres:</strong> divided, one of the mysterious words \"written over against the candlestick upon the plaster of the wall\" of king Belshazzar's palace (<a href=\"#\" onClick=\"return mV('Dan',5,28);\">Dan 5:28</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002481');\">MENE</a>.)";
eastonArray["$$T0002898"] = "<strong>Perez:</strong> = Pharez, (q.v.), breach, the son of Judah (<a href=\"#\" onClick=\"return mV('Neh',11,4);\">Neh 11:4</a>). \"The chief of all the captains of the host for the first month\" in the reign of David was taken from his family (<a href=\"#\" onClick=\"return mV('1Ch',27,3);\">1Ch 27:3</a>). Four hundred and sixty-eight of his \"sons\" came back from captivity with Zerubbabel, who himself was one of them (<a href=\"#\" onClick=\"return mV('1Ch',9,4);\">1Ch 9:4</a>; <a href=\"#\" onClick=\"return mV('Neh',11,6);\">Neh 11:6</a>).";
eastonArray["$$T0002899"] = "<strong>Perez-uzzah:</strong> the breach of Uzzah, a place where God \"burst forth upon Uzzah, so that he died,\" when he rashly \"took hold\" of the ark (<a href=\"#\" onClick=\"return mV('2Sa',6,'6-8');\">2Sa 6:6-8</a>). It was not far from Kirjath-jearim (q.v.).";
</script>
