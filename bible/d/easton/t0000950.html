<script>
var eastonArray = new Array ();
eastonArray["$$T0000950"] = "<strong>Cypress:</strong> (Heb. tirzah, \"hardness\"), mentioned only in <a href=\"#\" onClick=\"return mV('Isa',44,14);\">Isa 44:14</a> (R.V., \"holm tree\"). The oldest Latin version translates this word by ilex, i.e., the evergreen oak, which may possibly have been the tree intended; but there is great probability that our Authorized Version is correct in rendering it \"cypress.\" This tree grows abundantly on the mountains of Hermon. Its wood is hard and fragrant, and very durable. Its foliage is dark and gloomy. It is an evergreen (<i>Cupressus sempervirens</i>). \"Throughout the East it is used as a funereal tree; and its dark, tall, waving plumes render it peculiarly appropriate among the tombs.\"";
eastonArray["$$T0000951"] = "<strong>Cyprus:</strong> one of the largest islands of the Mediterranean, about 148 miles long and 40 broad. It is distant about 60 miles from the Syrian coast. It was the \"Chittim\" of the Old Testament (<a href=\"#\" onClick=\"return mV('Num',24,24);\">Num 24:24</a>). The Greek colonists gave it the name of Kypros, from the cyprus, i.e., the henna (see <a href=\"#\" onClick=\"return doDictLookup('ET0000701');\">CAMPHIRE</a>), which grew on this island. It was originally inhabited by Phoenicians. In B.C. 477 it fell under the dominion of the Greeks; and became a Roman province B.C. 58. In ancient times it was a centre of great commercial activity. Corn and wine and oil were produced here in the greatest perfection. It was rich also in timber and in mineral wealth.<br><br>It is first mentioned in the New Testament (<a href=\"#\" onClick=\"return mV('Act',4,36);\">Act 4:36</a>) as the native place of Barnabas. It was the scene of Paul's first missionary labours (<a href=\"#\" onClick=\"return mV('Act',13,'4-13');\">13:4-13</a>), when he and Barnabas and John Mark were sent forth by the church of Antioch. It was afterwards visited by Barnabas and Mark alone (<a href=\"#\" onClick=\"return mV('Act',15,39);\">Act 15:39</a>). Mnason, an \"old disciple,\" probaly one of the converts of the day of Pentecost belonging to this island, is mentioned (<a href=\"#\" onClick=\"return mV('Act',21,16);\">21:16</a>). It is also mentioned in connection with the voyages of Paul (<a href=\"#\" onClick=\"return mV('Act',21,3);\">Act 21:3</a>; <a href=\"#\" onClick=\"return mV('Act',27,4);\">27:4</a>). After being under the Turks for three hundred years, it was given up to the British Government in 1878.";
eastonArray["$$T0000952"] = "<strong>Cyrene:</strong> a city (now Tripoli) in Upper Libya, North Africa, founded by a colony of Greeks (B.C. 630). It contained latterly a large number of Jews, who were introduced into the city by Ptolemy, the son of Lagus, because he thought they would contribute to the security of the place. They increased in number and influence; and we are thus prepared for the frequent references to them in connection with the early history of Christianity. Simon, who bore our Lord's cross, was a native of this place (<a href=\"#\" onClick=\"return mV('Mat',27,32);\">Mat 27:32</a>; <a href=\"#\" onClick=\"return mV('Mar',15,21);\">Mar 15:21</a>). Jews from Cyrene were in Jerusalem at Pentecost (<a href=\"#\" onClick=\"return mV('Act',2,10);\">Act 2:10</a>); and Cyrenian Jews had a synagogue at Jerusalem (<a href=\"#\" onClick=\"return mV('Act',6,9);\">6:9</a>). Converts belonging to Cyrene contributed to the formation of the first Gentile church at Antioch (<a href=\"#\" onClick=\"return mV('Act',11,20);\">11:20</a>). Among \"the prophets and teachers\" who \"ministered to the Lord at Antioch\" was Lucius of Cyrene (<a href=\"#\" onClick=\"return mV('Act',13,1);\">13:1</a>).";
eastonArray["$$T0000953"] = "<strong>Cyrenius:</strong> the Grecized form of Quirinus. His full name was Publius Sulpicius Quirinus. Recent historical investigation has proved that Quirinus was governor of Cilicia, which was annexed to Syria at the time of our Lord's birth. Cilicia, which he ruled, being a province of Syria, he is called the governor, which he was <i>de jure</i>, of Syria. Some ten years afterwards he was appointed governor of Syria for the second time. During his tenure of office, at the time of our Lord's birth (<a href=\"#\" onClick=\"return mV('Luk',2,2);\">Luk 2:2</a>), a \"taxing\" (R.V., \"enrolment; \" i.e., a registration) of the people was \"first made;\" i.e., was made for the first time under his government. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003595');\">TAXING</a>.)";
eastonArray["$$T0000954"] = "<strong>Cyrus:</strong> (Heb. Ko'resh), the celebrated \"King of Persia\" (Elam) who was conqueror of Babylon, and issued the decree of liberation to the Jews (<a href=\"#\" onClick=\"return mV('Ezr',1,1,2);\">Ezr 1:1-2</a>). He was the son of Cambyses, the prince of Persia, and was born about B.C. 599. In the year B.C. 559 he became king of Persia, the kingdom of Media being added to it partly by conquest. Cyrus was a great military leader, bent on universal conquest. Babylon fell before his army (B.C. 538) on the night of Belshazzar's feast (<a href=\"#\" onClick=\"return mV('Dan',5,30);\">Dan 5:30</a>), and then the ancient dominion of Assyria was also added to his empire (<a href=\"#\" onClick=\"return mV('Isa',21,2);\">Isa 21:2</a>).<br><br>Hitherto the great kings of the earth had only oppressed the Jews. Cyrus was to them as a \"shepherd\" (<a href=\"#\" onClick=\"return mV('Isa',44,28);\">Isa 44:28</a>; <a href=\"#\" onClick=\"return mV('Isa',45,1);\">45:1</a>). God employed him in doing service to his ancient people. He may posibly have gained, through contact with the Jews, some knowledge of their religion.<br><br>The \"first year of Cyrus\" (<a href=\"#\" onClick=\"return mV('Ezr',1,1);\">Ezr 1:1</a>) is not the year of his elevation to power over the Medes, nor over the Persians, nor the year of the fall of Babylon, but the year succeeding the two years during which \"Darius the Mede\" was viceroy in Babylon after its fall. At this time only (B.C. 536) Cyrus became actual king over Palestine, which became a part of his Babylonian empire. The edict of Cyrus for the rebuilding of Jerusalem marked a great epoch in the history of the Jewish people (<a href=\"#\" onClick=\"return mV('2Ch',36,22,23);\">2Ch 36:22-23</a>; <a href=\"#\" onClick=\"return mV('Ezr',1,'1-4');\">Ezr 1:1-4</a>; <a href=\"#\" onClick=\"return mV('Ezr',4,3);\">4:3</a>; <a href=\"#\" onClick=\"return mV('Ezr',5,'13-17');\">5:13-17</a>; <a href=\"#\" onClick=\"return mV('Ezr',6,'3-5');\">6:3-5</a>).<br><br>This decree was discovered \"at Achmetha [R.V. marg., \"Ecbatana\"], in the palace that is in the province of the Medes\" (<a href=\"#\" onClick=\"return mV('Ezr',6,2);\">Ezr 6:2</a>). A chronicle drawn up just after the conquest of Babylonia by Cyrus, gives the history of the reign of Nabonidus (Nabunahid), the last king of Babylon, and of the fall of the Babylonian empire. In B.C. 538 there was a revolt in Southern Babylonia, while the army of Cyrus entered the country from the north. In June the Babylonian army was completely defeated at Opis, and immediately afterwards Sippara opened its gates to the conqueror. Gobryas (Ugbaru), the governor of Kurdistan, was then sent to Babylon, which surrendered \"without fighting,\" and the daily services in the temples continued without a break. In October, Cyrus himself arrived, and proclaimed a general amnesty, which was communicated by Gobryas to \"all the province of Babylon,\" of which he had been made governor. Meanwhile, Nabonidus, who had concealed himself, was captured, but treated honourably; and when his wife died, Cambyses, the son of Cyrus, conducted the funeral. Cyrus now assumed the title of \"king of Babylon,\" claimed to be the descendant of the ancient kings, and made rich offerings to the temples. At the same time he allowed the foreign populations who had been deported to Babylonia to return to their old homes, carrying with them the images of their gods. Among these populations were the Jews, who, as they had no images, took with them the sacred vessels of the temple.";
eastonArray["$$T0000955"] = "<strong>Daberath:</strong> pasture, a Levitical town of Issachar (<a href=\"#\" onClick=\"return mV('Jos',19,12);\">Jos 19:12</a>; <a href=\"#\" onClick=\"return mV('Jos',21,28);\">21:28</a>), near the border of Zebulum. It is the modern small village of Deburich, at the base of Mount Tabor. Tradition has incorrectly made it the scene of the miracle of the cure of the lunatic child (<a href=\"#\" onClick=\"return mV('Mat',17,14);\">Mat 17:14</a>).";
eastonArray["$$T0000956"] = "<strong>Daemon:</strong> the Greek form, rendered \"devil\" in the Authorized Version of the New Testament. Daemons are spoken of as spiritual beings (<a href=\"#\" onClick=\"return mV('Mat',8,16);\">Mat 8:16</a>; <a href=\"#\" onClick=\"return mV('Mat',10,1);\">10:1</a>; <a href=\"#\" onClick=\"return mV('Mat',12,'43-45');\">12:43-45</a>) at enmity with God, and as having a certain power over man (<a href=\"#\" onClick=\"return mV('Jam',2,19);\">Jam 2:19</a>; <a href=\"#\" onClick=\"return mV('Rev',16,14);\">Rev 16:14</a>). They recognize our Lord as the Son of God (<a href=\"#\" onClick=\"return mV('Mat',8,20);\">Mat 8:20</a>; <a href=\"#\" onClick=\"return mV('Luk',4,41);\">Luk 4:41</a>). They belong to the number of those angels that \"kept not their first estate,\" \"unclean spirits,\" \"fallen angels,\" the angels of the devil (<a href=\"#\" onClick=\"return mV('Mat',25,41);\">Mat 25:41</a>; <a href=\"#\" onClick=\"return mV('Rev',12,'7-9');\">Rev 12:7-9</a>). They are the \"principalities and powers\" against which we must \"wrestle\" (<a href=\"#\" onClick=\"return mV('Eph',6,12);\">Eph 6:12</a>).";
eastonArray["$$T0000957"] = "<strong>Daemoniac:</strong> one \"possessed with a devil.\" In the days of our Lord and his apostles, evil spirits, \"daemons,\" were mysteriously permitted by God to exercise an influence both over the souls and bodies of men, inflicting dumbness (<a href=\"#\" onClick=\"return mV('Mat',9,32);\">Mat 9:32</a>), blindness (<a href=\"#\" onClick=\"return mV('Mat',12,22);\">12:22</a>), epilepsy (<a href=\"#\" onClick=\"return mV('Mar',9,'17-27');\">Mar 9:17-27</a>), insanity (<a href=\"#\" onClick=\"return mV('Mat',8,28);\">Mat 8:28</a>; <a href=\"#\" onClick=\"return mV('Mar',5,'1-5');\">Mar 5:1-5</a>). Daemoniacs are frequently distinguished from those who are afflicted with ordinary bodily maladies (<a href=\"#\" onClick=\"return mV('Mar',1,32);\">Mar 1:32</a>; <a href=\"#\" onClick=\"return mV('Mar',16,17,18);\">16:17-18</a>; <a href=\"#\" onClick=\"return mV('Luk',6,17,18);\">Luk 6:17-18</a>). The daemons speak in their own persons (<a href=\"#\" onClick=\"return mV('Mat',8,29);\">Mat 8:29</a>; <a href=\"#\" onClick=\"return mV('Mar',1,23,24);\">Mar 1:23-24</a>; <a href=\"#\" onClick=\"return mV('Mar',5,7);\">5:7</a>). This influence is clearly distinguished from the ordinary power of corruption and of temptation over men. In the daemoniac his personality seems to be destroyed, and his actions, words, and even thoughts to be overborne by the evil spirit (Mark, </i>l.c.</i>; <a href=\"#\" onClick=\"return mV('Act',19,15);\">Act 19:15</a>).";
eastonArray["$$T0000958"] = "<strong>Dagon:</strong> little fish; diminutive from dag = a fish, the fish-god; the national god of the Philistines (<a href=\"#\" onClick=\"return mV('Jdg',16,23);\">Jdg 16:23</a>). This idol had the body of a fish with the head and hands of a man. It was an Assyrio-Babylonian deity, the worship of which was introduced among the Philistines through Chaldea. The most famous of the temples of Dagon were at Gaza (<a href=\"#\" onClick=\"return mV('Jdg',16,'23-30');\">Jdg 16:23-30</a>) and Ashdod (<a href=\"#\" onClick=\"return mV('1Sa',5,'1-7');\">1Sa 5:1-7</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001343');\">FISH</a>.)";
eastonArray["$$T0000959"] = "<strong>Dagon's house:</strong> (<a href=\"#\" onClick=\"return mV('1Sa',5,2);\">1Sa 5:2</a>), or Beth-dagon, as elsewhere rendered (<a href=\"#\" onClick=\"return mV('Jos',15,41);\">Jos 15:41</a>; <a href=\"#\" onClick=\"return mV('Jos',19,27);\">19:27</a>), was the sanctuary or temple of Dagon.<br><br>The Beth-dagon of <a href=\"#\" onClick=\"return mV('Jos',15,41);\">Jos 15:41</a> was one of the cities of the tribe of Judah, in the lowland or plain which stretches westward. It has not been identified.<br><br>The Beth-dagon of <a href=\"#\" onClick=\"return mV('Jos',19,27);\">Jos 19:27</a> was one of the border cities of Asher.<br><br>That of <a href=\"#\" onClick=\"return mV('1Ch',10,10);\">1Ch 10:10</a> was in the western half-tribe of Manasseh, where the Philistines, after their victory at Gilboa, placed Saul's head in the temple of their god. (<a href=\"#\" onClick=\"return mV('1Sa',31,'8-13');\">1Sa 31:8-13</a>).";
eastonArray["$$T0000960"] = "<strong>Daily sacrifice:</strong> (<a href=\"#\" onClick=\"return mV('Dan',8,12);\">Dan 8:12</a>; <a href=\"#\" onClick=\"return mV('Dan',11,31);\">11:31</a>; <a href=\"#\" onClick=\"return mV('Dan',12,11);\">12:11</a>), a burnt offering of two lambs of a year old, which were daily sacrificed in the name of the whole Israelitish people upon the great altar, the first at dawn of day, and the second at evening (<a href=\"#\" onClick=\"return mV('Dan',9,21);\">Dan 9:21</a>), or more correctly, \"between the two evenings.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0003179');\">SACRIFICE</a>.)";
eastonArray["$$T0000961"] = "<strong>Dale, the king's:</strong> the name of a valley, the alternative for \"the valley of Shaveh\" (q.v.), near the Dead Sea, where the king of Sodom met Abraham (<a href=\"#\" onClick=\"return mV('Gen',14,17);\">Gen 14:17</a>). Some have identified it with the southern part of the valley of Jehoshaphat, where Absalom reared his family monument (<a href=\"#\" onClick=\"return mV('2Sa',18,18);\">2Sa 18:18</a>).";
eastonArray["$$T0000962"] = "<strong>Dalmanutha:</strong> a place on the west of the Sea of Galilee, mentioned only in <a href=\"#\" onClick=\"return mV('Mar',8,10);\">Mar 8:10</a>. In the parallel passage it is said that Christ came \"into the borders of Magdala\" (<a href=\"#\" onClick=\"return mV('Mat',15,39);\">Mat 15:39</a>). It is plain, then, that Dalmanutha was near Magdala, which was probably the Greek name of one of the many Migdols (i.e., watch-towers) on the western side of the lake of Gennesaret. It has been identified in the ruins of a village about a mile from Magdala, in the little open valley of 'Ain-el-Barideh, \"the cold fountain,\" called el-Mejdel, possibly the \"Migdal-el\" of <a href=\"#\" onClick=\"return mV('Jos',19,38);\">Jos 19:38</a>.";
eastonArray["$$T0000963"] = "<strong>Dalmatia:</strong> a mountainous country on the eastern shore of the Adriatic, a part of the Roman province of Illyricum. It still bears its ancient name. During Paul's second imprisonment at Rome, Titus left him to visit Dalmatia (<a href=\"#\" onClick=\"return mV('2Ti',4,10);\">2Ti 4:10</a>) for some unknown purpose. Paul had himself formerly preached in that region (<a href=\"#\" onClick=\"return mV('Rom',15,19);\">Rom 15:19</a>).<br><br>The present Emperor of Austria bears, among his other titles, that of \"King of Dalmatia.\"";
eastonArray["$$T0000964"] = "<strong>Damaris:</strong> a heifer, an Athenian woman converted to Christianity under the preaching of Paul (<a href=\"#\" onClick=\"return mV('Act',17,34);\">Act 17:34</a>). Some have supposed that she may have been the wife of Dionysius the Areopagite.";
eastonArray["$$T0000965"] = "<strong>Damascus:</strong> activity, the most ancient of Oriental cities; the capital of Syria (<a href=\"#\" onClick=\"return mV('Isa',7,8);\">Isa 7:8</a>; <a href=\"#\" onClick=\"return mV('Isa',17,3);\">17:3</a>); situated about 133 miles to the north of Jerusalem. Its modern name is Esh-Sham; i.e., \"the East.\"<br><br>The situation of this city is said to be the most beautiful of all Western Asia. It is mentioned among the conquests of the Egyptian king Thothmes III. (B.C. 1500), and in the Amarna tablets (B.C. 1400).<br><br>It is first mentioned in Scripture in connection with Abraham's victory over the confederate kings under Chedorlaomer (<a href=\"#\" onClick=\"return mV('Gen',14,15);\">Gen 14:15</a>). It was the native place of Abraham's steward (<a href=\"#\" onClick=\"return mV('Gen',15,2);\">15:2</a>). It is not again noticed till the time of David, when \"the Syrians of Damascus came to succour Hadadezer\" (q.v.), <a href=\"#\" onClick=\"return mV('2Sa',8,5);\">2Sa 8:5</a>; <a href=\"#\" onClick=\"return mV('1Ch',18,5);\">1Ch 18:5</a>. In the reign of Solomon, Rezon became leader of a band who revolted from Hadadezer (<a href=\"#\" onClick=\"return mV('1Ki',11,23);\">1Ki 11:23</a>), and betaking themselves to Damascus, settled there and made their leader king. There was a long war, with varying success, between the Israelites and Syrians, who at a later period became allies of Israel against Judah (<a href=\"#\" onClick=\"return mV('2Ki',15,37);\">2Ki 15:37</a>).<br><br>The Syrians were at length subdued by the Assyrians, the city of Damascus was taken and destroyed, and the inhabitants carried captive into Assyria (<a href=\"#\" onClick=\"return mV('2Ki',16,'7-9');\">2Ki 16:7-9</a>; <a href=\"#\" onClick=\"return mV('Isa',7,8);\">Isa 7:8</a>). In this, prophecy was fulfilled (<a href=\"#\" onClick=\"return mV('Isa',17,1);\">Isa 17:1</a>; <a href=\"#\" onClick=\"return mV('Amo',1,4);\">Amo 1:4</a>; <a href=\"#\" onClick=\"return mV('Jer',49,24);\">Jer 49:24</a>). The kingdom of Syria remained a province of Assyria till the capture of Nineveh by the Medes (B.C. 625), when it fell under the conquerors. After passing through various vicissitudes, Syria was invaded by the Romans (B.C. 64), and Damascus became the seat of the government of the province. In A.D. 37 Aretas, the king of Arabia, became master of Damascus, having driven back Herod Antipas.<br><br>This city is memorable as the scene of Saul's conversion (<a href=\"#\" onClick=\"return mV('Act',9,'1-25');\">Act 9:1-25</a>). The street called \"Straight,\" in which Judas lived, in whose house Saul was found by Ananias, is known by the name Sultany, or \"Queen's Street.\" It is the principal street of the city. Paul visited Damascus again on his return from Arabia (<a href=\"#\" onClick=\"return mV('Gal',1,16,17);\">Gal 1:16-17</a>). Christianity was planted here as a centre (<a href=\"#\" onClick=\"return mV('Act',9,20);\">Act 9:20</a>), from which it spread to the surrounding regions.<br><br>In A.D. 634 Damascus was conquered by the growing Mohammedan power. In A.D. 1516 it fell under the dominion of the Turks, its present rulers. It is now the largest city in Asiatic Turkey. Christianity has again found a firm footing within its walls.";
eastonArray["$$T0000966"] = "<strong>Damnation:</strong> in <a href=\"#\" onClick=\"return mV('Rom',13,2);\">Rom 13:2</a>, means \"condemnation,\" which comes on those who withstand God's ordinance of magistracy. This sentence of condemnation comes not from the magistrate, but from God, whose authority is thus resisted.<br><br>In <a href=\"#\" onClick=\"return mV('1Cr',11,29);\">1Cr 11:29</a> (R.V., \"judgment\") this word means condemnation, in the sense of exposure to severe temporal judgements from God, as the following verse explains.<br><br>In <a href=\"#\" onClick=\"return mV('Rom',14,23);\">Rom 14:23</a> the word \"damned\" means \"condemned\" by one's own conscience, as well as by the Word of God. The apostle shows here that many things which are lawful are not expedient; and that in using our Christian liberty the question should not simply be, Is this course I follow lawful? but also, Can I follow it without doing injury to the spiritual interests of a brother in Christ? He that \"doubteth\", i.e., is not clear in his conscience as to \"meats\", will violate his conscience \"if he eat,\" and in eating is condemned; and thus one ought not so to use his liberty as to lead one who is \"weak\" to bring upon himself this condemnation.";
eastonArray["$$T0000967"] = "<strong>Dan:</strong> a judge.<br><br>(1.) The fifth son of Jacob. His mother was Bilhah, Rachel's maid (<a href=\"#\" onClick=\"return mV('Gen',30,6);\">Gen 30:6</a>, \"God hath judged me\", Heb. dananni). The blessing pronounced on him by his father was, \"Dan shall judge his people\" (<a href=\"#\" onClick=\"return mV('Gen',49,16);\">49:16</a>), probably in allusion to the judgeship of Samson, who was of the tribe of Dan.<br><br>The tribe of Dan had their place in the march through the wilderness on the north side of the tabernacle (<a href=\"#\" onClick=\"return mV('Num',2,25,31);\">Num 2:25, 31</a>; <a href=\"#\" onClick=\"return mV('Num',10,25);\">10:25</a>). It was the last of the tribes to receive a portion in the Land of Promise. Its position and extent are described in <a href=\"#\" onClick=\"return mV('Jos',19,'40-48');\">Jos 19:40-48</a>.<br><br>The territory of Dan extended from the west of that of Ephraim and Benjamin to the sea. It was a small territory, but was very fertile. It included in it, among others, the cities of Lydda, Ekron, and Joppa, which formed its northern boundary. But this district was too limited. \"Squeezed into the narrow strip between the mountains and the sea, its energies were great beyond its numbers.\" Being pressed by the Amorites and the Philistines, whom they were unable to conquer, they longed for a wider space. They accordingly sent out five spies from two of their towns, who went north to the sources of the Jordan, and brought back a favourable report regarding that region. \"Arise,\" they said, \"be not slothful to go, and to possess the land,\" for it is \"a place where there is no want of any thing that is in the earth\" (<a href=\"#\" onClick=\"return mV('Jdg',18,10);\">Jdg 18:10</a>). On receiving this report, 600 Danites girded on their weapons of war, and taking with them their wives and their children, marched to the foot of Hermon, and fought against Leshem, and took it from the Sidonians, and dwelt therein, and changed the name of the conquered town to Dan (<a href=\"#\" onClick=\"return mV('Jos',19,47);\">Jos 19:47</a>). This new city of Dan became to them a new home, and was wont to be spoken of as the northern limit of Palestine, the length of which came to be denoted by the expression \"from Dan to Beersheba\", i.e., about 144 miles.<br><br>\"But like Lot under a similar temptation, they seem to have succumbed to the evil influences around them, and to have sunk down into a condition of semi-heathenism from which they never emerged. The mounds of ruins which mark the site of the city show that it covered a considerable extent of ground. But there remains no record of any noble deed wrought by the degenerate tribe. Their name disappears from the roll-book of the natural and the spiritual Israel.\", Manning's Those Holy Fields.<br><br>This old border city was originally called Laish. Its modern name is Tell el-Kady, \"Hill of the Judge.\" It stands about four miles below Caesarea Philippi, in the midst of a region of surpassing richness and beauty.<br><br>(2.) This name occurs in <a href=\"#\" onClick=\"return mV('Eze',27,19);\">Eze 27:19</a>, Authorized Version; but the words there, \"Dan also,\" should be simply, as in the Revised Version, \"Vedan,\" an Arabian city, from which various kinds of merchandise were brought to Tyre. Some suppose it to have been the city of Aden in Arabia. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002375');\">MAHANEH-DAN</a>.)";
eastonArray["$$T0000968"] = "<strong>Dance:</strong> found in <a href=\"#\" onClick=\"return mV('Jdg',21,21,23);\">Jdg 21:21, 23</a>; <a href=\"#\" onClick=\"return mV('Psa',30,11);\">Psa 30:11</a>; <a href=\"#\" onClick=\"return mV('Psa',149,3);\">149:3</a>; <a href=\"#\" onClick=\"return mV('Psa',150,4);\">150:4</a>; <a href=\"#\" onClick=\"return mV('Jer',31,4,13);\">Jer 31:4, 13</a>, etc., as the translation of <i>hul</i>, which points to the whirling motion of Oriental sacred dances. It is the rendering of a word (rakad') which means to skip or leap for joy, in <a href=\"#\" onClick=\"return mV('Ecc',3,4);\">Ecc 3:4</a>; <a href=\"#\" onClick=\"return mV('Job',21,11);\">Job 21:11</a>; <a href=\"#\" onClick=\"return mV('Isa',13,21);\">Isa 13:21</a>, etc.<br><br>In the New Testament it is in like manner the translation of different Greek words, circular motion (<a href=\"#\" onClick=\"return mV('Luk',15,25);\">Luk 15:25</a>); leaping up and down in concert (<a href=\"#\" onClick=\"return mV('Mat',11,17);\">Mat 11:17</a>), and by a single person (<a href=\"#\" onClick=\"return mV('Mat',14,6);\">Mat 14:6</a>).<br><br>It is spoken of as symbolical of rejoicing (<a href=\"#\" onClick=\"return mV('Ecc',3,4);\">Ecc 3:4</a>. Comp. <a href=\"#\" onClick=\"return mV('Psa',30,11);\">Pss 30:11</a>; <a href=\"#\" onClick=\"return mV('Mat',11,17);\">Mat 11:17</a>). The Hebrews had their sacred dances expressive of joy and thanksgiving, when the performers were usually females (<a href=\"#\" onClick=\"return mV('Exd',15,20);\">Exd 15:20</a>; <a href=\"#\" onClick=\"return mV('1Sa',18,6);\">1Sa 18:6</a>).<br><br>The ancient dance was very different from that common among Western nations. It was usually the part of the women only (<a href=\"#\" onClick=\"return mV('Exd',15,20);\">Exd 15:20</a>; <a href=\"#\" onClick=\"return mV('Jdg',11,34);\">Jdg 11:34</a>; <a href=\"#\" onClick=\"return mV('Jdg',5,1);\">Jdg 5:1</a>). Hence the peculiarity of David's conduct in dancing before the ark of the Lord (<a href=\"#\" onClick=\"return mV('2Sa',6,14);\">2Sa 6:14</a>). The women took part in it with their timbrels. Michal should, in accordance with the example of Miriam and others, have herself led the female choir, instead of keeping aloof on the occasion and \"looking through the window.\" David led the choir \"uncovered\", i.e., wearing only the ephod or linen tunic. He thought only of the honour of God, and forgot himself.<br><br>From being reserved for occasions of religious worship and festivity, it came gradually to be practised in common life on occasions of rejoicing (<a href=\"#\" onClick=\"return mV('Jer',31,4);\">Jer 31:4</a>). The sexes among the Jews always danced separately. The daughter of Herodias danced alone (<a href=\"#\" onClick=\"return mV('Mat',14,6);\">Mat 14:6</a>).";
eastonArray["$$T0000969"] = "<strong>Daniel:</strong> God is my judge, or judge of God.<br><br>(1.) David's second son, \"born unto him in Hebron, of Abigail the Carmelitess\" (<a href=\"#\" onClick=\"return mV('1Ch',3,1);\">1Ch 3:1</a>). He is called also Chileab (<a href=\"#\" onClick=\"return mV('2Sa',3,3);\">2Sa 3:3</a>).<br><br>(2.) One of the four great prophets, although he is not once spoken of in the Old Testament as a prophet. His life and prophecies are recorded in the Book of Daniel. He was descended from one of the noble families of Judah (<a href=\"#\" onClick=\"return mV('Dan',1,3);\">Dan 1:3</a>), and was probably born in Jerusalem about B.C. 623, during the reign of Josiah. At the first deportation of the Jews by Nebuchadnezzar (the kingdom of Israel had come to an end nearly a century before), or immediately after his victory over the Egyptians at the second battle of Carchemish, in the fourth year of the reign of Jehoiakim (B.C. 606), Daniel and other three noble youths were carried off to Babylon, along with part of the vessels of the temple. There he was obliged to enter into the service of the king of Babylon, and in accordance with the custom of the age received the Chaldean name of Belteshazzar, i.e., \"prince of Bel,\" or \"Bel protect the king!\" His residence in Babylon was very probably in the palace of Nebuchadnezzar, now identified with a mass of shapeless mounds called the Kasr, on the right bank of the river.<br><br>His training in the schools of the wise men in Babylon (<a href=\"#\" onClick=\"return mV('Dan',1,4);\">Dan 1:4</a>) was to fit him for service to the empire. He was distinguished during this period for his piety and his stict observance of the Mosaic law (<a href=\"#\" onClick=\"return mV('Dan',1,'8-16');\">Dan 1:8-16</a>), and gained the confidence and esteem of those who were over him. His habit of attention gained during his education in Jerusalem enabled him soon to master the wisdom and learning of the Chaldeans, and even to excel his compeers.<br><br>At the close of his three years of discipline and training in the royal schools, Daniel was distinguished for his proficiency in the \"wisdom\" of his day, and was brought out into public life. He soon became known for his skill in the interpretation of dreams (<a href=\"#\" onClick=\"return mV('Dan',1,17);\">Dan 1:17</a>; <a href=\"#\" onClick=\"return mV('Dan',2,14);\">2:14</a>), and rose to the rank of governor of the province of Babylon, and became \"chief of the governors\" (Chald. Rab-signin) over all the wise men of Babylon. He made known and also interpreted Nebuchadnezzar's dream; and many years afterwards, when he was now an old man, amid the alarm and consternation of the terrible night of Belshazzar's impious feast, he was called in at the instance of the queen-mother (perhaps Nitocris, the daughter of Nebuchadnezzar) to interpret the mysterious handwriting on the wall. He was rewarded with a purple robe and elevation to the rank of \"third ruler.\" The place of \"second ruler\" was held by Belshazzar as associated with his father, Nabonidus, on the throne (<a href=\"#\" onClick=\"return mV('Dan',5,16);\">Dan 5:16</a>). Daniel interpreted the handwriting, and \"in that night was Belshazzar the king of the Chaldeans slain.\"<br><br>After the taking of Babylon, Cyrus, who was now master of all Asia from India to the Dardanelles, placed Darius (q.v.), a Median prince, on the throne, during the two years of whose reign Daniel held the office of first of the \"three presidents\" of the empire, and was thus practically at the head of affairs, no doubt interesting himself in the prospects of the captive Jews (<a href=\"#\" onClick=\"return mV('Dan',9,'1-')\">Dan 9</a>), whom he had at last the happiness of seeing restored to their own land, although he did not return with them, but remained still in Babylon. His fidelity to God exposed him to persecution, and he was cast into a den of lions, but was miraculously delivered; after which Darius issued a decree enjoining reverence for \"the God of Daniel\" (<a href=\"#\" onClick=\"return mV('Dan',6,26);\">Dan 6:26</a>). He \"prospered in the reign of Darius, and in the reign of Cyrus the Persian,\" whom he probably greatly influenced in the matter of the decree which put an end to the Captivity (B.C. 536).<br><br>He had a series of prophetic visions vouch-safed to him which opened up the prospect of a glorious future for the people of God, and must have imparted peace and gladness to his spirit in his old age as he waited on at his post till the \"end of the days.\" The time and circumstances of his death are not recorded. He probably died at Susa, about eighty-five years of age.<br><br>Ezekiel, with whom he was contemporary, mentions him as a pattern of righteousness (<a href=\"#\" onClick=\"return mV('Eze',14,14,20);\">Eze 14:14, 20</a>) and wisdom (<a href=\"#\" onClick=\"return mV('Eze',28,3);\">Eze 28:3</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002684');\">NEBUCHADNEZZAR</a>.)";
eastonArray["$$T0000970"] = "<strong>Daniel, Book of:</strong> is ranked by the Jews in that division of their Bible called the Hagiographa (Heb. Khethubim). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000580');\">BIBLE</a>.) It consists of two distinct parts. The first part, consisting of the first six chapters, is chiefly historical; and the second part, consisting of the remaining six chapters, is chiefly prophetical.<br><br>The historical part of the book treats of the period of the Captivity. Daniel is \"the historian of the Captivity, the writer who alone furnishes any series of events for that dark and dismal period during which the harp of Israel hung on the trees that grew by the Euphrates. His narrative may be said in general to intervene between Kings and Chronicles on the one hand and Ezra on the other, or (more strictly) to fill out the sketch which the author of the Chronicles gives in a single verse in his last chapter: 'And them that had escaped from the sword carried he [i.e., Nebuchadnezzar] away to Babylon; where they were servants to him and his sons until the reign of the kingdom of Persia'\" (<a href=\"#\" onClick=\"return mV('2Ch',36,20);\">2Ch 36:20</a>).<br><br>The prophetical part consists of three visions and one lengthened prophetical communication.<br><br>The genuineness of this book has been much disputed, but the arguments in its favour fully establish its claims.<br><br>(1.) We have the testimony of Christ (<a href=\"#\" onClick=\"return mV('Mat',24,15);\">Mat 24:15</a>; <a href=\"#\" onClick=\"return mV('Mat',25,31);\">25:31</a>; <a href=\"#\" onClick=\"return mV('Mat',26,64);\">26:64</a>) and his apostles (<a href=\"#\" onClick=\"return mV('1Cr',6,2);\">1Cr 6:2</a>; <a href=\"#\" onClick=\"return mV('2Th',2,3);\">2Th 2:3</a>) for its authority; and<br><br>(2) the important testimony of Ezekiel (<a href=\"#\" onClick=\"return mV('Eze',14,14,20);\">Eze 14:14, 20</a>; <a href=\"#\" onClick=\"return mV('Eze',28,3);\">28:3</a>).<br><br>(3.) The character and records of the book are also entirely in harmony with the times and circumstances in which the author lived.<br><br>(4.) The linguistic character of the book is, moreover, just such as might be expected. Certain portions (<a href=\"#\" onClick=\"return mV('Dan',2,'4-49');\">Dan 2:4; <a href=\"#\" onClick=\"return mV('Dan',7,'1-');\">7</a>) are written in the Chaldee language; and the portions written in Hebrew are in a style and form having a close affinity with the later books of the Old Testament, especially with that of Ezra. The writer is familiar both with the Hebrew and the Chaldee, passing from the one to the other just as his subject required. This is in strict accordance with the position of the author and of the people for whom his book was written. That Daniel is the writer of this book is also testified to in the book itself (<a href=\"#\" onClick=\"return mV('Dan',7,1,28);\">Dan 7:1, 28</a>; <a href=\"#\" onClick=\"return mV('Dan',8,2);\">8:2</a>; <a href=\"#\" onClick=\"return mV('Dan',9,2);\">9:2</a>; <a href=\"#\" onClick=\"return mV('Dan',10,1,2);\">10:1-2</a>; <a href=\"#\" onClick=\"return mV('Dan',12,4,5);\">12:4-5</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000519');\">BELSHAZZAR</a>.)";
eastonArray["$$T0000971"] = "<strong>Dan-jaan:</strong> woodland Dan, a place probably somewhere in the direction of Dan, near the sources of the Jordan (<a href=\"#\" onClick=\"return mV('2Sa',24,6);\">2Sa 24:6</a>). The LXX. and the Vulgate read \"Dan-ja'ar\", i.e., \"Dan in the forest.\"";
eastonArray["$$T0000972"] = "<strong>Dannah:</strong> murmuring, a city (<a href=\"#\" onClick=\"return mV('Jos',15,49);\">Jos 15:49</a>) in the mountains of Judah about 8 miles south-west of Hebron.";
eastonArray["$$T0000973"] = "<strong>Darda:</strong> pearl of wisdom, one of the four who were noted for their wisdom, but whom Solomon excelled (<a href=\"#\" onClick=\"return mV('1Ki',4,31);\">1Ki 4:31</a>).";
eastonArray["$$T0000974"] = "<strong>Daric:</strong> in the Revised Version of <a href=\"#\" onClick=\"return mV('1Ch',29,7);\">1Ch 29:7</a>; <a href=\"#\" onClick=\"return mV('Ezr',2,69);\">Ezr 2:69</a>; <a href=\"#\" onClick=\"return mV('Ezr',8,27);\">8:27</a>; <a href=\"#\" onClick=\"return mV('Neh',7,'70-72');\">Neh 7:70-72</a>, where the Authorized Version has \"dram.\" It is the rendering of the Hebrew darkemon and the Greek dareikos. It was a gold coin, bearing the figure of a Persian King with his crown and armed with bow and arrow. It was current among the Jews after their return from Babylon, i.e., while under the Persian domination. It weighed about 128 grains troy, and was of the value of about one guinea or rather more of our money. It is the first coin mentioned in Scripture, and is the oldest that history makes known to us.";
eastonArray["$$T0000975"] = "<strong>Darius:</strong> the holder or supporter, the name of several Persian kings.<br><br>(1.) Darius the Mede (<a href=\"#\" onClick=\"return mV('Dan',11,1);\">Dan 11:1</a>), \"the son of Ahasuerus, of the seed of the Medes\" (<a href=\"#\" onClick=\"return mV('Dan',9,1);\">9:1</a>). On the death of Belshazzar the Chaldean he \"received the kingdom\" of Babylon as viceroy from Cyrus. During his brief reign (B.C. 538-536) Daniel was promoted to the highest dignity (<a href=\"#\" onClick=\"return mV('Dan',6,1,2);\">Dan 6:1-2</a>); but on account of the malice of his enemies he was cast into the den of lions. After his miraculous escape, a decree was issued by Darius enjoining \"reverence for the God of Daniel\" (<a href=\"#\" onClick=\"return mV('Dan',6,26);\">Dan 6:26</a>). This king was probably the \"Astyages\" of the Greek historians. Nothing can, however, be with certainty affirmed regarding him. Some are of opinion that the name \"Darius\" is simply a name of office, equivalent to \"governor,\" and that the \"Gobryas\" of the inscriptions was the person intended by the name.<br><br>(2.) Darius, king of Persia, was the son of Hystaspes, of the royal family of the Achaemenidae. He did not immediately succeed Cyrus on the throne. There were two intermediate kings, viz., Cambyses (the Ahasuerus of Ezra), the son of Cyrus, who reigned from B.C. 529-522, and was succeeded by a usurper named Smerdis, who occupied the throne only ten months, and was succeeded by this Darius (B.C. 521-486). Smerdis was a Margian, and therefore had no sympathy with Cyrus and Cambyses in the manner in which they had treated the Jews. He issued a decree prohibiting the restoration of the temple and of Jerusalem (<a href=\"#\" onClick=\"return mV('Ezr',4,'17-22');\">Ezr 4:17-22</a>). But soon after his death and the accession of Darius, the Jews resumed their work, thinking that the edict of Smerdis would be now null and void, as Darius was in known harmony with the religious policy of Cyrus. The enemies of the Jews lost no time in bringing the matter under the notice of Darius, who caused search to be made for the decree of Cyrus (q.v.). It was not found at Babylon, but at Achmetha (<a href=\"#\" onClick=\"return mV('Ezr',6,2);\">Ezr 6:2</a>); and Darius forthwith issued a new decree, giving the Jews full liberty to prosecute their work, at the same time requiring the Syrian satrap and his subordinates to give them all needed help. It was with the army of this king that the Greeks fought the famous battle of Marathon (B.C. 490). During his reign the Jews enjoyed much peace and prosperity. He was succeeded by Ahasuerus, known to the Greeks as Xerxes, who reigned for twenty-one years.<br><br>(3.) Darius the Persian (<a href=\"#\" onClick=\"return mV('Neh',12,22);\">Neh 12:22</a>) was probably the Darius II. (Ochus or Nothus) of profane history, the son of Artaxerxes Longimanus, who was the son and successor of Ahasuerus (Xerxes). There are some, however, who think that the king here meant was Darius III. (Codomannus), the antagonist of Alexander the Great (B.C. 336-331).";
eastonArray["$$T0000976"] = "<strong>Darkness:</strong> The plague (the ninth) of darkness in Egypt (<a href=\"#\" onClick=\"return mV('Exd',10,21);\">Exd 10:21</a>) is described as darkness \"which may be felt.\" It covered \"all the land of Egypt,\" so that \"they saw not one another.\" It did not extend to the land of Goshen (ver. <a href=\"#\" onClick=\"return mV('Exd',10,23);\">23</a>).<br><br>When Jesus hung upon the cross (<a href=\"#\" onClick=\"return mV('Mat',27,45);\">Mat 27:45</a>; <a href=\"#\" onClick=\"return mV('Luk',23,44);\">Luk 23:44</a>), from the \"sixth hour there was darkness over all the land unto the ninth hour.\"<br><br>On Mount Sinai, Moses (<a href=\"#\" onClick=\"return mV('Exd',20,21);\">Exd 20:21</a>) \"drew near unto the thick darkness where God was.\" This was the \"thick cloud upon the mount\" in which Jehovah was when he spake unto Moses there. The Lord dwelt in the cloud upon the mercy-seat (<a href=\"#\" onClick=\"return mV('1Ki',8,12);\">1Ki 8:12</a>), the cloud of glory. When the psalmist (<a href=\"#\" onClick=\"return mV('Psa',97,2);\">Psa 97:2</a>) describes the inscrutable nature of God's workings among the sons of men, he says, \"Clouds and darkness are round about him.\" God dwells in thick darkness.<br><br>Darkness (<a href=\"#\" onClick=\"return mV('Isa',13,9,10);\">Isa 13:9-10</a>; <a href=\"#\" onClick=\"return mV('Mat',24,29);\">Mat 24:29</a>) also is a symbol of the judgments that attend on the coming of the Lord. It is a symbol of misery and adversity (<a href=\"#\" onClick=\"return mV('Job',18,6);\">Job 18:6</a>; <a href=\"#\" onClick=\"return mV('Psa',107,10);\">Psa 107:10</a>; <a href=\"#\" onClick=\"return mV('Isa',8,22);\">Isa 8:22</a>; <a href=\"#\" onClick=\"return mV('Eze',30,18);\">Eze 30:18</a>). The \"day of darkness\" in <a href=\"#\" onClick=\"return mV('Joe',2,2);\">Joe 2:2</a>, caused by clouds of locusts, is a symbol of the obscurity which overhangs all divine proceedings. \"Works of darkness\" are impure actions (<a href=\"#\" onClick=\"return mV('Eph',5,11);\">Eph 5:11</a>). \"Outer darkness\" refers to the darkness of the streets in the East, which are never lighted up by any public or private lamps after nightfall, in contrast with the blaze of cheerful light in the house. It is also a symbol of ignorance (<a href=\"#\" onClick=\"return mV('Isa',9,2);\">Isa 9:2</a>; <a href=\"#\" onClick=\"return mV('Isa',60,2);\">60:2</a>; <a href=\"#\" onClick=\"return mV('Mat',6,23);\">Mat 6:23</a>) and of death (<a href=\"#\" onClick=\"return mV('Job',10,21);\">Job 10:21</a>; <a href=\"#\" onClick=\"return mV('Job',17,13);\">17:13</a>).";
eastonArray["$$T0000977"] = "<strong>Darling:</strong> <a href=\"#\" onClick=\"return mV('Psa',22,20);\">Psa 22:20</a>; <a href=\"#\" onClick=\"return mV('Psa',35,17);\">35:17</a>) means an \"only one.\"";
eastonArray["$$T0000978"] = "<strong>Dart:</strong> an instrument of war; a light spear. \"Fiery darts\" (<a href=\"#\" onClick=\"return mV('Eph',6,16);\">Eph 6:16</a>) are so called in allusion to the habit of discharging darts from the bow while they are on fire or armed with some combustible material. Arrows are compared to lightning (<a href=\"#\" onClick=\"return mV('Deu',32,23,42);\">Deu 32:23, 42</a>; <a href=\"#\" onClick=\"return mV('Psa',7,13);\">Psa 7:13</a>; <a href=\"#\" onClick=\"return mV('Psa',120,4);\">120:4</a>).";
eastonArray["$$T0000979"] = "<strong>Date:</strong> the fruit of a species of palm (q.v.), the Phoenix dactilifera. This was a common tree in Palestine (<a href=\"#\" onClick=\"return mV('Joe',1,12);\">Joe 1:12</a>; <a href=\"#\" onClick=\"return mV('Neh',8,15);\">Neh 8:15</a>). Palm branches were carried by the Jews on festive occasions, and especially at the feast of Tabernacles (<a href=\"#\" onClick=\"return mV('Lev',23,40);\">Lev 23:40</a>; <a href=\"#\" onClick=\"return mV('Neh',8,15);\">Neh 8:15</a>).";
eastonArray["$$T0000980"] = "<strong>Dathan:</strong> welled; belonging to a fountain, a son of Eliab, a Reubenite, who joined Korah (q.v.) in his conspiracy, and with his accomplices was swallowed up by an earthquake (<a href=\"#\" onClick=\"return mV('Num',16,1);\">Num 16:1</a>; <a href=\"#\" onClick=\"return mV('Num',26,9);\">26:9</a>; <a href=\"#\" onClick=\"return mV('Deu',11,6);\">Deu 11:6</a>; <a href=\"#\" onClick=\"return mV('Psa',106,17);\">Psa 106:17</a>).";
eastonArray["$$T0000981"] = "<strong>Daughter:</strong> This word, besides its natural and proper sense, is used to designate,<br><br>(1.) A niece or any female descendant (<a href=\"#\" onClick=\"return mV('Gen',20,12);\">Gen 20:12</a>; <a href=\"#\" onClick=\"return mV('Gen',24,48);\">24:48</a>; <a href=\"#\" onClick=\"return mV('Gen',28,6);\">28:6</a>).<br><br>(2.) Women as natives of a place, or as professing the religion of a place; as, \"the daughters of Zion\" (<a href=\"#\" onClick=\"return mV('Isa',3,16);\">Isa 3:16</a>), \"daughters of the Philistines\" (<a href=\"#\" onClick=\"return mV('2Sa',1,20);\">2Sa 1:20</a>).<br><br>(3.) Small towns and villages lying around a city are its \"daughters,\" as related to the metropolis or mother city. Tyre is in this sense called the daughter of Sidon (<a href=\"#\" onClick=\"return mV('Isa',23,12);\">Isa 23:12</a>).<br><br>(4.) The people of Jerusalem are spoken of as \"the daughters of Zion\" (<a href=\"#\" onClick=\"return mV('Isa',37,22);\">Isa 37:22</a>).<br><br>(5.) The daughters of a tree are its boughs (<a href=\"#\" onClick=\"return mV('Gen',49,22);\">Gen 49:22</a>).<br><br>(6.) The \"daughters of music\" (<a href=\"#\" onClick=\"return mV('Ecc',12,4);\">Ecc 12:4</a>) are singing women.";
eastonArray["$$T0000982"] = "<strong>David:</strong> beloved, the eighth and youngest son of Jesse, a citizen of Bethlehem. His father seems to have been a man in humble life. His mother's name is not recorded. Some think she was the Nahash of <a href=\"#\" onClick=\"return mV('2Sa',17,25);\">2Sa 17:25</a>. As to his personal appearance, we only know that he was red-haired, with beautiful eyes and a fair face (<a href=\"#\" onClick=\"return mV('1Sa',16,12);\">1Sa 16:12</a>; <a href=\"#\" onClick=\"return mV('1Sa',17,42);\">17:42</a>).<br><br>His early occupation was that of tending his father's sheep on the uplands of Judah. From what we know of his after history, doubtless he frequently beguiled his time, when thus engaged, with his shepherd's flute, while he drank in the many lessons taught him by the varied scenes spread around him. His first recorded exploits were his encounters with the wild beasts of the field. He mentions that with his own unaided hand he slew a lion and also a bear, when they came out against his flock, beating them to death in open conflict with his club (<a href=\"#\" onClick=\"return mV('1Sa',17,34,35);\">1Sa 17:34-35</a>).<br><br>While David, in the freshness of ruddy youth, was thus engaged with his flocks, Samuel paid an unexpected visit to Bethlehem, having been guided thither by divine direction (<a href=\"#\" onClick=\"return mV('1Sa',16,'1-13');\">1Sa 16:1-13</a>). There he offered up sacrifice, and called the elders of Israel and Jesse's family to the sacrificial meal. Among all who appeared before him he failed to discover the one he sought. David was sent for, and the prophet immediately recognized him as the chosen of God, chosen to succeed Saul, who was now departing from the ways of God, on the throne of the kingdom. He accordingly, in anticipation, poured on his head the anointing oil. David went back again to his shepherd life, but \"the Spirit of the Lord came upon David from that day forward,\" and \"the Spirit of the Lord departed from Saul\" (<a href=\"#\" onClick=\"return mV('1Sa',16,'13-14');\">1Sa 16:13-14</a>).<br><br>Not long after this David was sent for to soothe with his harp the troubled spirit of Saul, who suffered from a strange melancholy dejection. He played before the king so skilfully that Saul was greatly cheered, and began to entertain great affection for the young shepherd. After this he went home to Bethlehem. But he soon again came into prominence. The armies of the Philistines and of Israel were in battle array in the valley of Elah, some 16 miles south-west of Bethlehem; and David was sent by his father with provisions for his three brothers, who were then fighting on the side of the king. On his arrival in the camp of Israel, David (now about twenty years of age) was made aware of the state of matters when the champion of the Philistines, Goliath of Gath, came forth to defy Israel. David took his sling, and with a well-trained aim threw a stone \"out of the brook,\" which struck the giant's forehead, so that he fell senseless to the ground. David then ran and slew him, and cut off his head with his own sword (<a href=\"#\" onClick=\"return mV('1Sa',17,'1-')\">1Sa 17</a>). The result was a great victory to the Israelites, who pursued the Philistines to the gates of Gath and Ekron.<br><br>David's popularity consequent on this heroic exploit awakened Saul's jealousy (<a href=\"#\" onClick=\"return mV('1Sa',18,'6-16');\">1Sa 18:6-16</a>), which he showed in various ways. He conceived a bitter hatred toward him, and by various stratagems sought his death (<a href=\"#\" onClick=\"return mV('1Sa',18,'1-');\">1Sa 18-30</a>). The deep-laid plots of the enraged king, who could not fail to observe that David \"prospered exceedingly,\" all proved futile, and only endeared the young hero the more to the people, and very specially to Jonathan, Saul's son, between whom and David a life-long warm friendship was formed.<br><br>A fugitive.<br><br>To escape from the vengeance of Saul, David fled to Ramah (<a href=\"#\" onClick=\"return mV('1Sa',19,'12-18');\">1Sa 19:12-18</a>) to Samuel, who received him, and he dwelt among the sons of the prophets, who were there under Samuel's training. It is supposed by some that the sixth, seventh, and eleventh Psalms were composed by him at this time. This place was only 3 miles from the residence of Saul, who soon discovered whither the fugitive had gone, and tried ineffectually to bring him back. Jonathan made a fruitless effort to bring his father to a better state of mind toward David (<a href=\"#\" onClick=\"return mV('1Sa',20,'1-')\">1Sa 20</a>), who, being made aware of the fact, saw no hope of safety but in flight to a distance. We accordingly find him first at Nob (<a href=\"#\" onClick=\"return mV('1Sa',21,'1-9');\">21:1-9</a>) and then at Gath, the chief city of the Philistines. The king of the Philistines would not admit him into his service, as he expected that he would, and David accordingly now betook himself to the stronghold of Adullam (<a href=\"#\" onClick=\"return mV('1Sa',22,'1-4');\">22:1-4</a>; <a href=\"#\" onClick=\"return mV('1Ch',12,'8-18');\">1Ch 12:8-18</a>). Here in a short time 400 men gathered around him and acknowledged him as their leader. It was at this time that David, amid the harassment and perils of his position, cried, \"Oh that one would give me drink of the water of the well of Bethlehem;\" when three of his heroes broke through the lines of the Philistines and brought him the water for which he longed (<a href=\"#\" onClick=\"return mV('2Sa',23,'13-17');\">2Sa 23:13-17</a>), but which he would not drink.<br><br>In his rage at the failure of all his efforts to seize David, Saul gave orders for the massacre of the entire priestly family at Nob, \"persons who wore a linen ephod\", to the number of eighty-five persons, who were put to death by Doeg the Edomite. The sad tidings of the massacre were brought to David by Abiathar, a son of Ahimelech, the only one who escaped. Comp. <a href=\"#\" onClick=\"return mV('Psa',52,'1-');\">Psa 52</a>.<br><br>Hearing that Keilah, a town on the western frontier, was harassed by the Philistines, David with his men relieved it (<a href=\"#\" onClick=\"return mV('1Sa',23,'1-14');\">1Sa 23:1-14</a>); and then, for fear of Saul, he fled to the strongholds in the \"hill country\" of Judah. Comp. <a href=\"#\" onClick=\"return mV('Psa',52,'1-');\">Psa 31</a>. While encamped there, in the forest in the district of Ziph, he was visited by Jonathan, who spoke to him words of encouragement (<a href=\"#\" onClick=\"return mV('1Sa',23,'16-18');\">23:16-18</a>). The two now parted never to meet again. Saul continued his pursuit of David, who narrowly escaped from him at this time, and fled to the crags and ravines of Engedi, on the western shore of the Dead Sea (<a href=\"#\" onClick=\"return mV('1Sa',23,29);\">1Sa 23:29</a>). Here Saul, who still pursued him with his army, narrowly escaped, through the generous forbearance of David, and was greatly affected by what David had done for him. He returned home from pursuing him, and David betook himself to Maon, where, with his 600 men, he maintained himself by contributions gathered from the district. Here occurred the incident connected with Nabal and his wife Abigail (<a href=\"#\" onClick=\"return mV('1Sa',25,'1-')\">1Sa 25</a>), whom David married after Nabal's death.<br><br>Saul again went forth (<a href=\"#\" onClick=\"return mV('1Sa',26,'1-')\">1Sa 26</a>) in pursuit of David, who had hid himself \"in the hill Hachilah, which is before Jeshimon,\" in the wilderness of Ziph, and was a second time spared through his forbearance. He returned home, professing shame and penitence for the way in which he had treated David, and predicting his elevation to the throne.<br><br>Fighting against Israel.<br><br>Harassed by the necessity of moving from place to place through fear of Saul, David once more sought refuge among the Philistines (<a href=\"#\" onClick=\"return mV('1Sa',27,'1-')\">1Sa 27</a>). He was welcomed by the king, who assigned him Ziklag as his residence. Here David lived among his followers for some time as an independent chief engaged in frequent war with the Amalekites and other tribes on the south of Judah.<br><br>Achish summoned David with his men to join his army against Saul; but the lords of the Philistines were suspicious of David's loyalty, and therefore he was sent back to Ziklag, which he found to his dismay may had been pillaged and burnt during his brief absence. David pursued after the raiders, the Amalekites, and completely routed them. On his return to Ziklag tidings reached him of Saul's death (<a href=\"#\" onClick=\"return mV('2Sa',1,'1-')\">2Sa 1</a>). An Amalekite brought Saul's crown and bracelet and laid them at his feet. David and his men rent their clothes and mourned for Saul, who had been defeated in battle near Mount Gilboa. David composed a beautiful elegy, the most beautiful of all extant Hebrew odes, a \"lamentation over Saul and over Jonathan his son\" (<a href=\"#\" onClick=\"return mV('2Sa',1,'18-27');\">2Sa 1:18-27</a>). It bore the title of \"The Bow,\" and was to be taught to the children, that the memory of Saul and Jonathan might be preserved among them. \"Behold, it is written in the book of Jasher\" (q.v.).<br><br>David king over Judah.<br><br> David and his men now set out for Hebron under divine direction (<a href=\"#\" onClick=\"return mV('2Sa',2,'1-4');\">2Sa 2:1-4</a>). There they were cordially welcomed, and he was at once anointed as king. He was now about thirty years of age.<br><br>But his title to the throne was not undisputed. Abner took Ish-bosheth, Saul's only remaining son, over the Jordan to Mahanaim, and there crowned him as king. Then began a civil war in Israel. The first encounter between the two opposing armies, led on the one side by Abner, and on the other by Joab, took place at the pool of Gibeon. It resulted in the defeat of Abner. Other encounters, however, between Israel and Judah followed (<a href=\"#\" onClick=\"return mV('2Sa',3,1,5);\">2Sa 3:1, 5</a>), but still success was on the side of David. For the space of seven and a half years David reigned in Hebron. Abner now sided with David, and sought to promote his advancement; but was treacherously put to death by Joab in revenge for his having slain his brother Asahel at Gibeon (<a href=\"#\" onClick=\"return mV('2Sa',3,'22-39');\">3:22-39</a>). This was greatly to David's regret. He mourned for the death of Abner. Shortly after this Ish-bosheth was also treacherously put to death by two Canaanites of Beeroth; and there being now no rival, David was anointed king over all Israel (<a href=\"#\" onClick=\"return mV('2Sa',4,'1-12');\">4:1-12</a>).<br><br>David king over all Israel (<a href=\"#\" onClick=\"return mV('2Sa',5,'1-5');\">2Sa 5:1-5</a>>).<br><br>The elders of Israel now repaired to Hebron and offered allegiance to David in name of all the people, among whom the greatest enthusiasm prevailed. He was anointed king over all Israel, and sought out a new seat of government, more suitable than Hebron, as the capital of his empire. At this time there was a Jebusite fortress, \"the stronghold\", on the hill of Zion, called also Jebus. This David took from the Jebusites, and made it Israel's capital, and established here his residence, and afterwards built for himself a palace by the aid of Tyrian tradesmen. The Philistines, who had for some time observed a kind of truce, now made war against David; but were defeated in battle at a place afterwards called, in remembrance of the victory, Baal-perazim. Again they invaded the land, and were a second time routed by him. He thus delivered Israel from their enemies.<br><br>David now resolved to bring up the ark of the covenant to his new capital (<a href=\"#\" onClick=\"return mV('2Sa',6,'1-')\">2Sa 6</a>). It was in the house of Abinadab at Kirjath-jearim, about 7 miles from Jerusalem, where it had been for many years, from the time when the Philistines had sent it home (ark, <a href=\"#\" onClick=\"return mV('Num',4,'1-')\">Num 4</a>), who had put forth his hand to steady the ark when <a href=\"#\" onClick=\"return mV('1Sa',6,'1-')\">1Sa 6</a>; <a href=\"#\" onClick=\"return mV('1Sa',7,'1-')\">7</a>). In consequence of the death of Uzzah (for it was a divine ordinance that only the Levites should handle the ark, <a href=\"#\" onClick=\"return mV('Num',4,'1-')\">Num 4</a>), who had put forth his hand to steady the ark when the cart in which it was being conveyed shook by reason of the roughness of the road, David stayed the procession, and conveyed the ark into the house of Obed-edom, a Philistine from Gath. After three months David brought the ark from the house of Obed-edom up to Jerusalem. Comp. <a href=\"#\" onClick=\"return mV('Psa',24,'1-')\">Psa 24</a>. Here it was placed in a new tent or tabernacle which David erected for the purpose. About seventy years had passed since it had stood in the tabernacle at Shiloh. The old tabernacle was now at Gibeah, at which Zadok ministered. David now (ark, <a href=\"#\" onClick=\"return mV('Num',4,'1-')\">Num 4</a>), who had put forth his hand to steady the ark when <a href=\"#\" onClick=\"return mV('1Ch',16,'1-')\">1Ch 16</a>) carefully set in order all the ritual of divine worship at Jerusalem, along with Abiathar the high priest. A new religious era began. The service of praise was for the first time introduced into public worship. Zion became henceforth \"God's holy hill.\"<br><br>David's wars.<br><br>David now entered on a series of conquests which greatly extended and strengthened his kingdom (ark, <a href=\"#\" onClick=\"return mV('Num',4,'1-')\">Num 4</a>), who had put forth his hand to steady the ark when <a href=\"#\" onClick=\"return mV('2Sa',8,'1-')\">2Sa 8</a>). In a few years the whole territory from the Euphrates to the river of Egypt, and from Gaza on the west to Thapsacus on the east, was under his sway (<a href=\"#\" onClick=\"return mV('2Sa',8,'3-13');\">2Sa 8:3-13</a>; <a href=\"#\" onClick=\"return mV('2Sa',8,10);\">10</a>).<br><br>David's fall. He had now reached the height of his glory. He ruled over a vast empire, and his capital was enriched with the spoils of many lands. But in the midst of all this success he fell, and his character became stained with the sin of adultery (<a href=\"#\" onClick=\"return mV('2Sa',11,'2-27');\">2Sa 11:2-27</a>). It has been noted as characteristic of the Bible that while his military triumphs are recorded in a few verses, the sad story of his fall is given in detail, a story full of warning, and therefore recorded. This crime, in the attempt to conceal it, led to anoter. He was guilty of murder. Uriah, whom he had foully wronged, an officer of the Gibborim, the corps of heros (<a href=\"#\" onClick=\"return mV('2Sa',23,39);\">23:39</a>), was, by his order, \"set in the front of the hottest battle\" at the siege of Rabbah, in order that he might be put to death. Nathan the prophet (<a href=\"#\" onClick=\"return mV('2Sa',7,'1-17');\">2Sa 7:1-17</a>; <a href=\"#\" onClick=\"return mV('2Sa',12,'1-23');\">12:1-23</a>) was sent by God to bring home his crimes to the conscience of the guilty monarch. He became a true penitent. He bitterly bewailed his sins before God. The thirty-second and fifty-first Psalms reveal the deep struggles of his soul, and his spiritual recovery.<br><br>Bathsheba became his wife after Uriah's death. Her first-born son died, according to the word of the prophet. She gave birth to a second son, whom David called Solomon, and who ultimately succeeded him on the throne (<a href=\"#\" onClick=\"return mV('2Sa',12,24,25);\">2Sa 12:24-25</a>).<br><br>Peace. After the successful termination of all his wars, David formed the idea of building a temple for the ark of God. This he was not permitted to carry into execution, because he had been a man of war. God, however, sent Nathan to him with a gracious message (<a href=\"#\" onClick=\"return mV('2Sa',7,'1-16');\">2Sa 7:1-16</a>). On receiving it he went into the sanctuary, the tent where the ark was, and sat before the Lord, and poured out his heart in words of devout thanksgiving (<a href=\"#\" onClick=\"return mV('2Sa',7,'18-29');\">18-29</a>). The building of the temple was reserved for his son Solomon, who would be a man of peace (<a href=\"#\" onClick=\"return mV('1Ch',22,9);\">1Ch 22:9</a>; <a href=\"#\" onClick=\"return mV('1Ch',28,3);\">28:3</a>).<br><br>A cloudy evening.<br><br>Hitherto David's career had been one of great prosperity and success. Now cloudy and dark days came. His eldest son Amnon, whose mother was Ahinoam of Jezreel, was guilty of a great and shameful crime (<a href=\"#\" onClick=\"return mV('2Sa',13,'1-')\">2Sa 13</a>). This was the beginning of the disasters of his later years. After two years Absalom terribly avenged the crime against Tamar, and put Amnon to death. This brought sore trouble to David's heart. Absalom, afraid of the consequences of his guilt, fled to Geshur beyond Jordan, where he remained for three years, when he was brought back through the intrigue of Joab (<a href=\"#\" onClick=\"return mV('2Sa',14,'1-')\">2Sa 14</a>).<br><br>After this there fell upon the land the calamity of three years' famine (<a href=\"#\" onClick=\"return mV('2Sa',21,'1-14');\">2Sa 21:1-14</a>). This was soon after followed by a pestilence, brought upon the land as a punishment for David's sinful pride in numbering the people (<a href=\"#\" onClick=\"return mV('2Sa',24,'1-')\">2Sa 24</a>), in which no fewer than 70,000 perished in the space of three days.<br><br>Rebellion of Absalom.<br><br>The personal respect for David was sadly lowered by the incident of Bathsheba. There was a strong popular sentiment against the taking of the census, and the outburst of the plague in connection with it deepened the feeling of jealously that had begun to manifest itself among some of the tribes against David. Absalom, taking full advantage of this state of things, gradually gained over the people, and at length openly rebelled against his father, and usurped the throne. Ahithophel was Absalom's chief counsellor. The revolt began in Hebron, the capital of Judah. Absalom was there proclaimed king. David was now in imminent danger, and he left Jerusalem (<a href=\"#\" onClick=\"return mV('2Sa',15,'13-20');\">2Sa 15:13-20</a>), and once more became a fugitive. It was a momentous day in Israel. The incidents of it are recorded with a fulness of detail greater than of any other day in Old Testament history. David fled with his followers to Mahanarm, on the east of Jordan. An unnatural civil war broke out. After a few weeks the rival armies were mustered and organized. They met in hostile array at the wood of Ephraim (<a href=\"#\" onClick=\"return mV('2Sa',18,'1-8');\">2Sa 18:1-8</a>). Absalom's army was defeated, and himself put to death by the hand of Joab (<a href=\"#\" onClick=\"return mV('2Sa',18,'9-18');\">9-18</a>). The tidings of the death of his rebellious son filled the heart of David with the most poignant grief. He \"went up to the chamber over the gate, and wept\" (<a href=\"#\" onClick=\"return mV('2Sa',18,33);\">33</a>), giving utterance to the heart-broken cry, \"Would God I had died for thee, O Absalom, my son, my son!\" Peace was now restored, and David returned to Jerusalem and resumed the direction of affairs. An unhappy dispute arose between the men of Judah and the men of Israel (<a href=\"#\" onClick=\"return mV('2Sa',19,'41-43');\">19:41-43</a>). Sheba, a Benjamite, headed a revolt of the men of Israel. He was pursued to Abelbeth-maachah, and was there put to death, and so the revolt came to an end.<br><br>The end.<br><br>After the suppression of the rebellion of Absalom and that of Sheba, ten comparatively peaceful years of David's life passed away. During those years he seems to have been principally engaged in accumulating treasures of every kind for the great temple at Jerusalem, which it was reserved to his successor to build (<a href=\"#\" onClick=\"return mV('1Ch',22,'1-')\">1Ch 22</a>; <a href=\"#\" onClick=\"return mV('1Ch',28,'1-')\">28</a>; <a href=\"#\" onClick=\"return mV('1Ch',29,'1-')\">29</a>), a house which was to be \"exceeding magnifical, of fame and of glory throughout all countries\" (<a href=\"#\" onClick=\"return mV('1Ch',22,5);\">22:5</a>). The exciting and laborious life he had spent, and the dangers and trials through which he had passed, had left him an enfeebled man, prematurely old. It became apparent that his life was now drawing to its close. A new palace conspiracy broke out as to who should be his successor. Joab favoured Adonijah. The chiefs of his party met at the \"Fuller's spring,\" in the valley of Kidron, to proclaim him king; but Nathan hastened on a decision on the part of David in favour of Solomon, and so the aim of Adonijah's party failed. Solomon was brought to Jerusalem, and was anointed king and seated on his father's throne (<a href=\"#\" onClick=\"return mV('1Ki',1,'11-53');\">1Ki 1:11-53</a>). David's last words are a grand utterance, revealing his unfailing faith in God, and his joyful confidence in his gracious covenant promises (<a href=\"#\" onClick=\"return mV('2Sa',23,'1-7');\">2Sa 23:1-7</a>).<br><br>After a reign of forty years and six months (<a href=\"#\" onClick=\"return mV('2Sa',5,5);\">2Sa 5:5</a>; <a href=\"#\" onClick=\"return mV('1Ch',3,4);\">1Ch 3:4</a>) David died (B.C. 1015) at the age of seventy years, \"and was buried in the city of David.\" His tomb is still pointed out on Mount Zion.<br><br>Both in his prophetical and in his regal character David was a type of the Messiah (<a href=\"#\" onClick=\"return mV('1Sa',16,13);\">1Sa 16:13</a>). The book of Psalms commonly bears the title of the \"Psalms of David,\" from the circumstance that he was the largest contributor (about eighty psalms) to the collection. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003013');\">PSALMS</a>.)<br><br>\"The greatness of David was felt when he was gone. He had lived in harmony with both the priesthood and the prophets; a sure sign that the spirit of his government had been throughly loyal to the higher aims of the theocracy. The nation had not been oppressed by him, but had been left in the free enjoyment of its ancient liberties. As far as his power went he had striven to act justly to all (<a href=\"#\" onClick=\"return mV('2Sa',8,15);\">2Sa 8:15</a>). His weak indulgence to his sons, and his own great sin besides, had been bitterly atoned, and were forgotten at his death in the remembrance of his long-tried worth. He had reigned thirty-three years in Jerusalem and seven and a half at Hebron (<a href=\"#\" onClick=\"return mV('2Sa',5,5);\">2Sa 5:5</a>). Israel at his accession had reached the lowest point of national depression; its new-born unity rudely dissolved; its territory assailed by the Philistines. But he had left it an imperial power, with dominions like those of Egypt or Assyria. The sceptre of Solomon was already, before his father's death, owned from the Mediterranean to the Euphrates, and from the Orontes to the Red Sea.\", Geikie's Hours etc., iii.";
eastonArray["$$T0000983"] = "<strong>David, City of:</strong><br><br>(1.) David took from the Jebusites the fortress of Mount Zion. He \"dwelt in the fort, and called it the city of David\" (<a href=\"#\" onClick=\"return mV('1Ch',11,7);\">1Ch 11:7</a>). This was the name afterwards given to the castle and royal palace on Mount Zion, as distinguished from Jerusalem generally (<a href=\"#\" onClick=\"return mV('1Ki',3,1);\">1Ki 3:1</a>; <a href=\"#\" onClick=\"return mV('1Ki',8,1);\">8:1</a>), It was on the south-west side of Jerusalem, opposite the temple mount, with which it was connected by a bridge over the Tyropoeon valley.<br><br>(2) Bethlehem is called the \"city of David\" (<a href=\"#\" onClick=\"return mV('Luk',2,4,11);\">Luk 2:4, 11</a>), because it was David's birth-place and early home (<a href=\"#\" onClick=\"return mV('1Sa',17,12);\">1Sa 17:12</a>).";
eastonArray["$$T0000984"] = "<strong>Day:</strong> The Jews reckoned the day from sunset to sunset (<a href=\"#\" onClick=\"return mV('Lev',23,32);\">Lev 23:32</a>). It was originally divided into three parts (<a href=\"#\" onClick=\"return mV('Psa',55,17);\">Psa 55:17</a>). \"The heat of the day\" (<a href=\"#\" onClick=\"return mV('1Sa',11,11);\">1Sa 11:11</a>; <a href=\"#\" onClick=\"return mV('Neh',7,3);\">Neh 7:3</a>) was at our nine o'clock, and \"the cool of the day\" just before sunset (<a href=\"#\" onClick=\"return mV('Gen',3,8);\">Gen 3:8</a>). Before the Captivity the Jews divided the night into three watches,<br><(1) from sunset to midnight (<a href=\"#\" onClick=\"return mV('Lam',2,19);\">Lam 2:19</a>);<br>(2) from midnight till the cock-crowing (<a href=\"#\" onClick=\"return mV('Jdg',7,19);\">Jdg 7:19</a>); and<br /<br>(3) from the cock-crowing till sunrise (<a href=\"#\" onClick=\"return mV('Exd',14,24);\">Exd 14:24</a>). In the New Testament the division of the Greeks and Romans into four watches was adopted (<a href=\"#\" onClick=\"return mV('Mar',13,35);\">Mar 13:35</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0003789');\">WATCHES</a>.)<br><br>The division of the day by hours is first mentioned in <a href=\"#\" onClick=\"return mV('Dan',3,6,15);\">Dan 3:6, 15</a>; <a href=\"#\" onClick=\"return mV('Dan',4,19);\">4:19</a>; <a href=\"#\" onClick=\"return mV('Dan',5,5);\">5:5</a>. This mode of reckoning was borrowed from the Chaldeans. The reckoning of twelve hours was from sunrise to sunset, and accordingly the hours were of variable length (<a href=\"#\" onClick=\"return mV('Jhn',11,9);\">Jhn 11:9</a>).<br><br>The word \"day\" sometimes signifies an indefinite time (<a href=\"#\" onClick=\"return mV('Gen',2,4);\">Gen 2:4</a>; <a href=\"#\" onClick=\"return mV('Isa',22,5);\">Isa 22:5</a>; <a href=\"#\" onClick=\"return mV('Hbr',3,8);\">Hbr 3:8</a>, etc.). In <a href=\"#\" onClick=\"return mV('Job',3,1);\">Job 3:1</a> it denotes a birthday, and in <a href=\"#\" onClick=\"return mV('Isa',2,12);\">Isa 2:12</a>; <a href=\"#\" onClick=\"return mV('Act',17,31);\">Act 17:31</a>, and <a href=\"#\" onClick=\"return mV('2Ti',1,18);\">2Ti 1:18</a>, the great day of final judgment.";
eastonArray["$$T0000985"] = "<strong>Day's journey:</strong> The usual length of a day's journey in the East, on camel or horseback, in six or eight hours, is about 25 or 30 miles. The \"three days' journey\" mentioned in <a href=\"#\" onClick=\"return mV('Exd',3,18);\">Exd 3:18</a> is simply a journey which would occupy three days in going and returning.";
eastonArray["$$T0000986"] = "<strong>Daysman:</strong> an umpire or arbiter or judge (<a href=\"#\" onClick=\"return mV('Job',9,33);\">Job 9:33</a>). This word is formed from the Latin diem dicere, i.e., to fix a day for hearing a cause. Such an one is empowered by mutual consent to decide the cause, and to \"lay his hand\", i.e., to impose his authority, on both, and enforce his sentence.";
eastonArray["$$T0000987"] = "<strong>Dayspring:</strong> (<a href=\"#\" onClick=\"return mV('Job',38,12);\">Job 38:12</a>; <a href=\"#\" onClick=\"return mV('Luk',1,78);\">Luk 1:78</a>), the dawn of the morning; daybreak. (<a href=\"#\" onClick=\"return mV('Isa',60,1,2);\">Isa 60:1-2</a>; <a href=\"#\" onClick=\"return mV('Mal',4,2);\">Mal 4:2</a>; <a href=\"#\" onClick=\"return mV('Rev',22,16);\">Rev 22:16</a>.)";
eastonArray["$$T0000988"] = "<strong>Daystar:</strong> which precedes and accompanies the sun-rising. It is found only in <a href=\"#\" onClick=\"return mV('2Pe',1,19);\">2Pe 1:19</a>, where it denotes the manifestation of Christ to the soul, imparting spiritual light and comfort. He is the \"bright and morning star\" of <a href=\"#\" onClick=\"return mV('Rev',2,28);\">Rev 2:28</a>; <a href=\"#\" onClick=\"return mV('Rev',22,16);\">22:16</a>. (<a href=\"#\" onClick=\"return mV('Num',24,17);\">Num 24:17</a>.)";
eastonArray["$$T0000989"] = "<strong>Deacon:</strong> Anglicized form of the Greek word diaconos, meaning a \"runner,\" \"messenger,\" \"servant.\" For a long period a feeling of mutual jealousy had existed between the \"Hebrews,\" or Jews proper, who spoke the sacred language of palestine, and the \"Hellenists,\" or Jews of the Grecian speech, who had adopted the Grecian language, and read the Septuagint version of the Bible instead of the Hebrew. This jealousy early appeared in the Christian community. It was alleged by the Hellenists that their widows were overlooked in the daily distribution of alms. This spirit must be checked. The apostles accordingly advised the disciples to look out for seven men of good report, full of the Holy Ghost, and men of practical wisdom, who should take entire charge of this distribution, leaving them free to devote themselves entirely to the spiritual functions of their office (<a href=\"#\" onClick=\"return mV('Act',6,'1-6');\">Act 6:1-6</a>). This was accordingly done. Seven men were chosen, who appear from their names to have been Hellenists. The name \"deacon\" is nowhere applied to them in the New Testament; they are simply called \"the seven\" (<a href=\"#\" onClick=\"return mV('Act',21,8);\">21:8</a>). Their office was at first secular, but it afterwards became also spiritual; for among other qualifications they must also be \"apt to teach\" (<a href=\"#\" onClick=\"return mV('1Ti',3,'8-12');\">1Ti 3:8-12</a>). Both Philip and Stephen, who were of \"the seven,\" preached; they did \"the work of evangelists.\"";
eastonArray["$$T0000990"] = "<strong>Deaconess:</strong> <a href=\"#\" onClick=\"return mV('Rom',16,1,3,12);\">Rom 16:1, 3, 12</a>; <a href=\"#\" onClick=\"return mV('Phl',4,2,3);\">Phl 4:2-3</a>; <a href=\"#\" onClick=\"return mV('1Ti',3,11);\">1Ti 3:11</a>; <a href=\"#\" onClick=\"return mV('1Ti',5,9,10);\">5:9-10</a>; <a href=\"#\" onClick=\"return mV('Tts',2,'3-4');\">Tts 2:3-4</a>). In these passages it is evident that females were then engaged in various Christian ministrations. Pliny makes mention of them also in his letter to Trajan (A.D. 110).";
eastonArray["$$T0000991"] = "<strong>Dead Sea:</strong> the name given by Greek writers of the second century to that inland sea called in Scripture the \"salt sea\" (<a href=\"#\" onClick=\"return mV('Gen',14,3);\">Gen 14:3</a>; <a href=\"#\" onClick=\"return mV('Num',34,12);\">Num 34:12</a>), the \"sea of the plain\" (<a href=\"#\" onClick=\"return mV('Deu',3,17);\">Deu 3:17</a>), the \"east sea\" (<a href=\"#\" onClick=\"return mV('Eze',47,18);\">Eze 47:18</a>; <a href=\"#\" onClick=\"return mV('Joe',2,20);\">Joe 2:20</a>), and simply \"the sea\" (<a href=\"#\" onClick=\"return mV('Eze',47,8);\">Eze 47:8</a>). The Arabs call it Bahr Lut, i.e., the Sea of Lot. It lies about 16 miles in a straight line to the east of Jerusalem. Its surface is 1,292 feet below the surface of the Mediterranean Sea. It covers an area of about 300 square miles. Its depth varies from 1,310 to 11 feet. From various phenomena that have been observed, its bottom appears to be still subsiding. It is about 53 miles long, and of an average breadth of 10 miles. It has no outlet, the great heat of that region causing such rapid evaporation that its average depth, notwithstanding the rivers that run into it (see <a href=\"#\" onClick=\"return doDictLookup('ET0002112');\">JORDAN</a>), is maintained with little variation. The Jordan alone discharges into it no less than six million tons of water every twenty-four hours.<br><br>The waters of the Dead Sea contain 24.6 per cent. of mineral salts, about seven times as much as in ordinary sea-water; thus they are unusually buoyant. Chloride of magnesium is most abundant; next to that chloride of sodium (common salt). But terraces of alluvial deposits in the deep valley of the Jordan show that formerly one great lake extended from the Waters of Merom to the foot of the watershed in the Arabah. The waters were then about 1,400 feet above the present level of the Dead Sea, or slightly above that of the Mediterranean, and at that time were much less salt.<br><br>Nothing living can exist in this sea. \"The fish carried down by the Jordan at once die, nor can even mussels or corals live in it; but it is a fable that no bird can fly over it, or that there are no living creatures on its banks. Dr. Tristram found on the shores three kinds of kingfishers, gulls, ducks, and grebes, which he says live on the fish which enter the sea in shoals, and presently die. He collected one hundred and eighteen species of birds, some new to science, on the shores, or swimming or flying over the waters. The cane-brakes which fringe it at some parts are the homes of about forty species of mammalia, several of them animals unknown in England; and innumerable tropical or semi-tropical plants perfume the atmosphere wherever fresh water can reach. The climate is perfect and most delicious, and indeed there is perhaps no place in the world where a sanatorium could be established with so much prospect of benefit as at Ain Jidi (Engedi).\", Geikie's Hours, etc.";
eastonArray["$$T0000992"] = "<strong>Deal, Tenth:</strong> See <a href=\"#\" onClick=\"return doDictLookup('ET0002784');\">OMER</a>.";
eastonArray["$$T0000993"] = "<strong>Dearth:</strong> a scarcity of provisions (<a href=\"#\" onClick=\"return mV('1Ki',17,'1-')\">1Ki 17</a>). There were frequent dearths in Palestine. In the days of Abram there was a \"famine in the land\" (<a href=\"#\" onClick=\"return mV('Gen',12,10);\">Gen 12:10</a>), so also in the days of Jacob (<a href=\"#\" onClick=\"return mV('Gen',47,4,13);\">47:4, 13</a>). We read also of dearths in the time of the judges (<a href=\"#\" onClick=\"return mV('Rth',1,1);\">Rth 1:1</a>), and of the kings (<a href=\"#\" onClick=\"return mV('2Sa',21,1);\">2Sa 21:1</a>; <a href=\"#\" onClick=\"return mV('1Ki',18,2);\">1Ki 18:2</a>; <a href=\"#\" onClick=\"return mV('2Ki',4,38);\">2Ki 4:38</a>; <a href=\"#\" onClick=\"return mV('2Ki',8,1);\">8:1</a>).<br><br>In New Testament times there was an extensive famine in Palestine (<a href=\"#\" onClick=\"return mV('Act',11,28);\">Act 11:28</a>) in the fourth year of the reign of the emperor Claudius (A.D. 44 and 45).";
