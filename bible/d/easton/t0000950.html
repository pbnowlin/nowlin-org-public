eastonArray["$$T0000994"] = "<strong>Death:</strong> may be simply defined as the termination of life. It is represented under a variety of aspects in Scripture:<br><br>(1.) \"The dust shall return to the earth as it was\" (<a href=\"#\" onClick=\"return mV('Ecc',12,7);\">Ecc 12:7</a>).<br><br>(2.) \"Thou takest away their breath, they die\" (<a href=\"#\" onClick=\"return mV('Psa',104,29);\">Psa 104:29</a>).<br><br>(3.) It is the dissolution of \"our earthly house of this tabernacle\" (<a href=\"#\" onClick=\"return mV('2Cr',5,1);\">2Cr 5:1</a>); the \"putting off this tabernacle\" (<a href=\"#\" onClick=\"return mV('2Pe',1,13,14);\">2Pe 1:13-14</a>).<br><br>(4.) Being \"unclothed\" (<a href=\"#\" onClick=\"return mV('2Cr',5,3,4);\">2Cr 5:3-4</a>).<br><br>(5.) \"Falling on sleep\" (<a href=\"#\" onClick=\"return mV('Psa',76,5);\">Psa 76:5</a>; <a href=\"#\" onClick=\"return mV('Jer',51,39);\">Jer 51:39</a>; <a href=\"#\" onClick=\"return mV('Act',13,36);\">Act 13:36</a>; <a href=\"#\" onClick=\"return mV('2Pe',3,9);\">2Pe 3:9</a>).<br><br>(6.) \"I go whence I shall not return\" (<a href=\"#\" onClick=\"return mV('Job',10,21);\">Job 10:21</a>); \"Make me to know mine end\" (<a href=\"#\" onClick=\"return mV('Psa',39,4);\">Psa 39:4</a>); \"to depart\" (<a href=\"#\" onClick=\"return mV('Phl',1,23);\">Phl 1:23</a>).<br><br>The grave is represented as \"the gates of death\" (<a href=\"#\" onClick=\"return mV('Job',38,17);\">Job 38:17</a>; <a href=\"#\" onClick=\"return mV('Psa',9,13);\">Psa 9:13</a>; <a href=\"#\" onClick=\"return mV('Psa',107,18);\">107:18</a>). The gloomy silence of the grave is spoken of under the figure of the \"shadow of death\" (<a href=\"#\" onClick=\"return mV('Jer',2,6);\">Jer 2:6</a>).<br><br>Death is the effect of sin (<a href=\"#\" onClick=\"return mV('Hbr',2,14);\">Hbr 2:14</a>), and not a \"debt of nature.\" It is but once (<a href=\"#\" onClick=\"return mV('Hbr',9,27);\">9:27</a>), universal (<a href=\"#\" onClick=\"return mV('Gen',3,19);\">Gen 3:19</a>), necessary (<a href=\"#\" onClick=\"return mV('Luk',2,'28-30');\">Luk 2:28-30</a>). Jesus has by his own death taken away its sting for all his followers (<a href=\"#\" onClick=\"return mV('1Cr',15,'55-57');\">1Cr 15:55-57</a>).<br><br>There is a spiritual death in trespasses and sins, i.e., the death of the soul under the power of sin (<a href=\"#\" onClick=\"return mV('Rom',8,6);\">Rom 8:6</a>; <a href=\"#\" onClick=\"return mV('Eph',2,1,3);\">Eph 2:1, 3</a>; <a href=\"#\" onClick=\"return mV('Col',2,13);\">Col 2:13</a>).<br><br>The \"second death\" (<a href=\"#\" onClick=\"return mV('Rev',2,11);\">Rev 2:11</a>) is the everlasting perdition of the wicked (<a href=\"#\" onClick=\"return mV('Rev',21,8);\">Rev 21:8</a>), and \"second\" in respect to natural or temporal death.<br><br>THE DEATH OF CHRIST is the procuring cause incidentally of all the blessings men enjoy on earth. But specially it is the procuring cause of the actual salvation of all his people, together with all the means that lead thereto. It does not make their salvation merely possible, but certain (<a href=\"#\" onClick=\"return mV('Mat',18,11);\">Mat 18:11</a>; <a href=\"#\" onClick=\"return mV('Rom',5,10);\">Rom 5:10</a>; <a href=\"#\" onClick=\"return mV('2Cr',5,21);\">2Cr 5:21</a>; <a href=\"#\" onClick=\"return mV('Gal',1,4);\">Gal 1:4</a>; <a href=\"#\" onClick=\"return mV('Gal',3,13);\">3:13</a>; <a href=\"#\" onClick=\"return mV('Eph',1,7);\">Eph 1:7</a>; <a href=\"#\" onClick=\"return mV('Eph',2,16);\">2:16</a>; <a href=\"#\" onClick=\"return mV('Rom',8,'32-35');\">Rom 8:32-35</a>).";
eastonArray["$$T0000995"] = "<strong>Debir:</strong> oracle town; sanctuary.<br><br>(1.) One of the eleven cities to the west of Hebron, in the highlands of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,49);\">Jos 15:49</a>; <a href=\"#\" onClick=\"return mV('Jdg',1,'11-15');\">Jdg 1:11-15</a>). It was originally one of the towns of the Anakim (<a href=\"#\" onClick=\"return mV('Jos',15,15);\">Jos 15:15</a>), and was also called Kirjath-sepher (q.v.) and Kirjath-sannah (<a href=\"#\" onClick=\"return mV('Jos',15,49);\">49</a>). Caleb, who had conquered and taken possession of the town and district of Hebron (<a href=\"#\" onClick=\"return mV('Jos',14,'6-15');\">Jos 14:6-15</a>), offered the hand of his daughter to any one who would successfully lead a party against Debir. Othniel, his younger brother (<a href=\"#\" onClick=\"return mV('Jdg',1,13);\">Jdg 1:13</a>; <a href=\"#\" onClick=\"return mV('Jdg',3,9);\">3:9</a>), achieved the conquest, and gained Achsah as his wife. She was not satisfied with the portion her father gave her, and as she was proceeding toward her new home, she \"lighted from off her ass\" and said to him, \"Give me a blessing [i.e., a dowry]: for thou hast given me a south land\" (<a href=\"#\" onClick=\"return mV('Jos',15,19);\">Jos 15:19</a>, A.V.); or, as in the Revised Version, \"Thou hast set me in the land of the south\", i.e., in the Negeb, outside the rich valley of Hebron, in the dry and barren land. \"Give me also springs of water. And he gave her the upper springs, and the nether springs.\"<br><br>Debir has been identified with the modern Edh-Dhaheriyeh, i.e., \"the well on the ridge\", to the south of Hebron.<br><br>(2.) A place near the \"valley of Achor\" (<a href=\"#\" onClick=\"return mV('Jos',15,7);\">Jos 15:7</a>), on the north boundary of Judah, between Jerusalem and Jericho.<br><br>(3.) The king of Eglon, one of the five Canaanitish kings who were hanged by Joshua (<a href=\"#\" onClick=\"return mV('Jos',10,3,32);\">Jos 10:3, 32</a>) after the victory at Gibeon. These kings fled and took refuge in a cave at Makkedah. Here they were kept confined till Joshua returned from the pursuit of their discomfited armies, when he caused them to be brought forth, and \"Joshua smote them, and slew them, and hanged them on five trees\" (<a href=\"#\" onClick=\"return mV('Jos',10,26);\">26</a>).";
eastonArray["$$T0000996"] = "<strong>Deborah:</strong> a bee.<br><br>(1.) Rebekah's nurse. She accompanied her mistress when she left her father's house in Padan-aram to become the wife of Isaac (<a href=\"#\" onClick=\"return mV('Gen',24,59);\">Gen 24:59</a>). Many years afterwards she died at Bethel, and was buried under the \"oak of weeping\", Allon-bachuth (<a href=\"#\" onClick=\"return mV('Gen',35,8);\">35:8</a>).<br><br>(2.) A prophetess, \"wife\" (woman?) of Lapidoth. Jabin, the king of Hazor, had for twenty years held Israel in degrading subjection. The spirit of patriotism seemed crushed out of the nation. In this emergency Deborah roused the people from their lethargy. Her fame spread far and wide. She became a \"mother in Israel\" (<a href=\"#\" onClick=\"return mV('Jdg',4,6,14);\">Jdg 4:6, 14</a>; <a href=\"#\" onClick=\"return mV('Jdg',5,7);\">5:7</a>), and \"the children of Israel came up to her for judgment\" as she sat in her tent under the palm tree \"between Ramah and Bethel.\" Preparations were everywhere made by her direction for the great effort to throw off the yoke of bondage. She summoned Barak from Kadesh to take the command of 10,000 men of Zebulun and Naphtali, and lead them to Mount Tabor on the plain of Esdraelon at its north-east end. With his aid she organized this army. She gave the signal for attack, and the Hebrew host rushed down impetuously upon the army of Jabin, which was commanded by Sisera, and gained a great and decisive victory. The Canaanitish army almost wholly perished. That was a great and ever-memorable day in Israel. In <a href=\"#\" onClick=\"return mV('Jdg',5,'1-');\">Jdg 5</a> is given the grand triumphal ode, the \"song of Deborah,\" which she wrote in grateful commemoration of that great deliverance. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002240');\">LAPIDOTH</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0001938');\">JABIN [2]</a>.)";
eastonArray["$$T0000997"] = "<strong>Debt:</strong> The Mosaic law encouraged the practice of lending (<a href=\"#\" onClick=\"return mV('Deu',15,7);\">Deu 15:7</a>; <a href=\"#\" onClick=\"return mV('Psa',37,26);\">Psa 37:26</a>; <a href=\"#\" onClick=\"return mV('Mat',5,42);\">Mat 5:42</a>); but it forbade the exaction of interest except from foreigners. Usury was strongly condemned (<a href=\"#\" onClick=\"return mV('Pro',28,8);\">Pro 28:8</a>; <a href=\"#\" onClick=\"return mV('Eze',18,8,13,17);\">Eze 18:8,13,17</a>; <a href=\"#\" onClick=\"return mV('Eze',22,12);\">22:12</a>; <a href=\"#\" onClick=\"return mV('Psa',15,5);\">Psa 15:5</a>). On the Sabbatical year all pecuniary obligations were cancelled (<a href=\"#\" onClick=\"return mV('Deu',15,'1-11');\">Deu 15:1-11</a>). These regulations prevented the accumulation of debt.";
eastonArray["$$T0000998"] = "<strong>Debtor:</strong> Various regulations as to the relation between debtor and creditor are laid down in the Scriptures.<br><br>(1.) The debtor was to deliver up as a pledge to the creditor what he could most easily dispense with (<a href=\"#\" onClick=\"return mV('Deu',24,10,11);\">Deu 24:10-11</a>).<br><br>(2.) A mill, or millstone, or upper garment, when given as a pledge, could not be kept over night (<a href=\"#\" onClick=\"return mV('Exd',22,26,27);\">Exd 22:26-27</a>).<br><br>(3.) A debt could not be exacted during the Sabbatic year (<a href=\"#\" onClick=\"return mV('Deu',15,'1-15');\">Deu 15:1-15</a>).<br><br>For other laws bearing on this relation see <a href=\"#\" onClick=\"return mV('Lev',25,14,32,39);\">Lev 25:14, 32, 39</a>; <a href=\"#\" onClick=\"return mV('Mat',18,25,34);\">Mat 18:25, 34</a>.<br><br>(4.) A surety was liable in the same way as the original debtor (<a href=\"#\" onClick=\"return mV('Pro',11,15);\">Pro 11:15</a>; <a href=\"#\" onClick=\"return mV('Pro',17,18);\">17:18</a>).";
eastonArray["$$T0000999"] = "<strong>Decalogue:</strong> the name given by the Greek fathers to the ten commandments; \"the ten words,\" as the original is more literally rendered (<a href=\"#\" onClick=\"return mV('Exd',20,'3-17');\">Exd 20:3-17</a>). These commandments were at first written on two stone slabs (<a href=\"#\" onClick=\"return mV('Exd',31,18);\">31:18</a>), which were broken by Moses throwing them down on the ground (<a href=\"#\" onClick=\"return mV('Exd',32,19);\">32:19</a>). They were written by God a second time (<a href=\"#\" onClick=\"return mV('Exd',34,1);\">34:1</a>). The decalogue is alluded to in the New Testament five times (<a href=\"#\" onClick=\"return mV('Mat',5,'17-19');\">Mat 5:17-19</a>; <a href=\"#\" onClick=\"return mV('Mar',10,19);\">Mar 10:19</a>; <a href=\"#\" onClick=\"return mV('Luk',18,20);\">Luk 18:20</a>; <a href=\"#\" onClick=\"return mV('Rom',7,7,8);\">Rom 7:7-8</a>; <a href=\"#\" onClick=\"return mV('Rom',13,9);\">13:9</a>; <a href=\"#\" onClick=\"return mV('1Ti',1,9,10);\">1Ti 1:9-10</a>).<br><br>These commandments have been divided since the days of Origen the Greek father, as they stand in the Confession of all the Reformed Churches except the Lutheran. The division adopted by Luther, and which has ever since been received in the Lutheran Church, makes the first two commandments one, and the third the second, and so on to the last, which is divided into two. \"Thou shalt not covet thy neighbour's house\" being ranked as ninth, and \"Thou shalt not covet thy neighbour's wife,\" etc., the tenth. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000871');\">COMMANDMENTS</a>.)";
