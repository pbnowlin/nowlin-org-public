<script>
var eastonArray = new Array ();
eastonArray["$$T0003600"] = "<strong>Tel-abib:</strong> hill of corn, a place on the river Chebar, the residence of Ezekiel (<a href=\"#\" onClick=\"return mV('Eze',3,15);\">Eze 3:15</a>). The site is unknown.";
eastonArray["$$T0003601"] = "<strong>Telaim:</strong> young lambs, a place at which Saul gathered his army to fight against Amalek (<a href=\"#\" onClick=\"return mV('1Sa',15,4);\">1Sa 15:4</a>); probably the same as Telem<br><br>(2).";
eastonArray["$$T0003602"] = "<strong>Telassar:</strong> or Thelasar, (<a href=\"#\" onClick=\"return mV('Isa',37,12);\">Isa 37:12</a>; <a href=\"#\" onClick=\"return mV('2Ki',19,12);\">2Ki 19:12</a>), a province in the south-east of Assyria, probably in Babylonia. Some have identified it with Tel Afer, a place in Mesopotamia, some 30 miles from Sinjar.";
eastonArray["$$T0003603"] = "<strong>Telem:</strong> oppression.<br><br>(1.) A porter of the temple in the time of Ezra (<a href=\"#\" onClick=\"return mV('Ezr',10,24);\">Ezr 10:24</a>).<br><br>(2.) A town in the southern border of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,24);\">Jos 15:24</a>); probably the same as Telaim.";
eastonArray["$$T0003604"] = "<strong>Tel-haresha:</strong> hill of the wood, a place in Babylon from which some captive Jews returned to Jerusalem (<a href=\"#\" onClick=\"return mV('Ezr',2,59);\">Ezr 2:59</a>; <a href=\"#\" onClick=\"return mV('Neh',7,61);\">Neh 7:61</a>).";
eastonArray["$$T0003605"] = "<strong>Tel-melah:</strong> hill of salt, a place in Babylon from which the Jews returned (id.).";
eastonArray["$$T0003606"] = "<strong>Tema:</strong> south; desert, one of the sons of Ishmael, and father of a tribe so called (<a href=\"#\" onClick=\"return mV('Gen',25,15);\">Gen 25:15</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,30);\">1Ch 1:30</a>; <a href=\"#\" onClick=\"return mV('Job',6,19);\">Job 6:19</a>; <a href=\"#\" onClick=\"return mV('Isa',21,14);\">Isa 21:14</a>; <a href=\"#\" onClick=\"return mV('Jer',25,23);\">Jer 25:23</a>) which settled at a place to which he gave his name, some 250 miles south-east of Edom, on the route between Damascus and Mecca, in the northern part of the Arabian peninsula, toward the Syrian desert; the modern Teyma'.";
eastonArray["$$T0003607"] = "<strong>Teman:</strong> id.<br><br>(1.) A grandson of Esau, one of the \"dukes of Edom\" (<a href=\"#\" onClick=\"return mV('Gen',36,11,15,42);\">Gen 36:11, 15, 42</a>).<br><br>(2.) A place in Southern Idumea, the land of \"the sons of the east,\" frequently mentioned in the Old Testament. It was noted for the wisdom of its inhabitants (<a href=\"#\" onClick=\"return mV('Amo',1,12);\">Amo 1:12</a>; <a href=\"#\" onClick=\"return mV('Oba',1,8);\">Oba 1:8</a>; <a href=\"#\" onClick=\"return mV('Jer',49,7);\">Jer 49:7</a>; <a href=\"#\" onClick=\"return mV('Eze',25,13);\">Eze 25:13</a>). It was divided from the hills of Paran by the low plain of Arabah (<a href=\"#\" onClick=\"return mV('Hab',3,3);\">Hab 3:3</a>).";
eastonArray["$$T0003608"] = "<strong>Temanite:</strong> a man of Teman, the designation of Eliphaz, one of Job's three friends (<a href=\"#\" onClick=\"return mV('Job',2,11);\">Job 2:11</a>; <a href=\"#\" onClick=\"return mV('Job',22,1);\">22:1</a>).";
eastonArray["$$T0003609"] = "<strong>Temeni:</strong> one of the sons of Ashur, the father of Tekoa (<a href=\"#\" onClick=\"return mV('1Ch',4,6);\">1Ch 4:6</a>).";
eastonArray["$$T0003610"] = "<strong>Temple:</strong> first used of the tabernacle, which is called \"the temple of the Lord\" (<a href=\"#\" onClick=\"return mV('1Sa',1,9);\">1Sa 1:9</a>). In the New Testament the word is used figuratively of Christ's human body (<a href=\"#\" onClick=\"return mV('Jhn',2,19,21);\">Jhn 2:19, 21</a>). Believers are called \"the temple of God\" (<a href=\"#\" onClick=\"return mV('1Cr',3,16,17);\">1Cr 3:16-17</a>). The Church is designated \"an holy temple in the Lord\" (<a href=\"#\" onClick=\"return mV('Eph',2,21);\">Eph 2:21</a>). Heaven is also called a temple (<a href=\"#\" onClick=\"return mV('Rev',7,5);\">Rev 7:5</a>). We read also of the heathen \"temple of the great goddess Diana\" (<a href=\"#\" onClick=\"return mV('Act',19,27);\">Act 19:27</a>).<br><br>This word is generally used in Scripture of the sacred house erected on the summit of Mount Moriah for the worship of God. It is called \"the temple\" (<a href=\"#\" onClick=\"return mV('1Ki',6,17);\">1Ki 6:17</a>); \"the temple [R.V., 'house'] of the Lord\" (<a href=\"#\" onClick=\"return mV('2Ki',11,10);\">2Ki 11:10</a>); \"thy holy temple\" (<a href=\"#\" onClick=\"return mV('Psa',79,1);\">Psa 79:1</a>); \"the house of the Lord\" (<a href=\"#\" onClick=\"return mV('2Ch',23,5,12);\">2Ch 23:5, 12</a>); \"the house of the God of Jacob\" (<a href=\"#\" onClick=\"return mV('Isa',2,3);\">Isa 2:3</a>); \"the house of my glory\" (<a href=\"#\" onClick=\"return mV('Isa',60,7);\">60:7</a>); an \"house of prayer\" (<a href=\"#\" onClick=\"return mV('Isa',56,7);\">56:7</a>; <a href=\"#\" onClick=\"return mV('Mat',21,13);\">Mat 21:13</a>); \"an house of sacrifice\" (<a href=\"#\" onClick=\"return mV('2Ch',7,12);\">2Ch 7:12</a>); \"the house of their sanctuary\" (<a href=\"#\" onClick=\"return mV('2Ch',36,17);\">2Ch 36:17</a>); \"the mountain of the Lord's house\" (<a href=\"#\" onClick=\"return mV('Isa',2,2);\">Isa 2:2</a>); \"our holy and our beautiful house\" (<a href=\"#\" onClick=\"return mV('Isa',64,11);\">64:11</a>); \"the holy mount\" (<a href=\"#\" onClick=\"return mV('Isa',27,13);\">27:13</a>); \"the palace for the Lord God\" (<a href=\"#\" onClick=\"return mV('1Ch',29,1);\">1Ch 29:1</a>); \"the tabernacle of witness\" (<a href=\"#\" onClick=\"return mV('2Ch',24,6);\">2Ch 24:6</a>); \"Zion\" (<a href=\"#\" onClick=\"return mV('Psa',74,2);\">Psa 74:2</a>; <a href=\"#\" onClick=\"return mV('Psa',84,7);\">84:7</a>). Christ calls it \"my Father's house\" (<a href=\"#\" onClick=\"return mV('Jhn',2,16);\">Jhn 2:16</a>).";
eastonArray["$$T0003611"] = "<strong>Temple, Herod's:</strong> The temple erected by the exiles on their return from Babylon had stood for about five hundred years, when Herod the Great became king of Judea. The building had suffered considerably from natural decay as well as from the assaults of hostile armies, and Herod, desirous of gaining the favour of the Jews, proposed to rebuild it. This offer was accepted, and the work was begun (B.C. 18), and carried out at great labour and expense, and on a scale of surpassing splendour. The main part of the building was completed in ten years, but the erection of the outer courts and the embellishment of the whole were carried on during the entire period of our Lord's life on earth (<a href=\"#\" onClick=\"return mV('Jhn',2,16,'19-21');\">Jhn 2:16, 19-21</a>), and the temple was completed only A.D. 65. But it was not long permitted to exist. Within forty years after our Lord's crucifixion, his prediction of its overthrow was accomplished (<a href=\"#\" onClick=\"return mV('Luk',19,'41-44');\">Luk 19:41-44</a>). The Roman legions took the city of Jerusalem by storm, and notwithstanding the strenuous efforts Titus made to preserve the temple, his soldiers set fire to it in several places, and it was utterly destroyed (A.D. 70), and was never rebuilt.<br><br>Several remains of Herod's stately temple have by recent explorations been brought to light. It had two courts, one intended for the Israelites only, and the other, a large outer court, called \"the court of the Gentiles,\" intended for the use of strangers of all nations. These two courts were separated by a low wall, as Josephus states, some 4 1/2 feet high, with thirteen openings. Along the top of this dividing wall, at regular intervals, were placed pillars bearing in Greek an inscription to the effect that no stranger was, on the pain of death, to pass from the court of the Gentiles into that of the Jews. At the entrance to a graveyard at the north-western angle of the Haram wall, a stone was discovered by M. Ganneau in 1871, built into the wall, bearing the following inscription in Greek capitals: \"No stranger is to enter within the partition wall and enclosure around the sanctuary. Whoever is caught will be responsible to himself for his death, which will ensue.\"<br><br>There can be no doubt that the stone thus discovered was one of those originally placed on the boundary wall which separated the Jews from the Gentiles, of which Josephus speaks.<br><br>It is of importance to notice that the word rendered \"sanctuary\" in the inscription was used in a specific sense of the inner court, the court of the Israelites, and is the word rendered \"temple\" in <a href=\"#\" onClick=\"return mV('Jhn',2,15);\">Jhn 2:15</a> and <a href=\"#\" onClick=\"return mV('Act',21,28,29);\">Act 21:28-29</a>. When Paul speaks of the middle wall of partition (<a href=\"#\" onClick=\"return mV('Eph',2,14);\">Eph 2:14</a>), he probably makes allusion to this dividing wall. Within this partition wall stood the temple proper, consisting of,<br><br>(1) the court of the women, 8 feet higher than the outer court;<br><br>(2) 10 feet higher than this court was the court of Israel;<br><br>(3) the court of the priests, again 3 feet higher; and lastly<br><br>(4) the temple floor, 8 feet above that; thus in all 29 feet above the level of the outer court.<br><br>The summit of Mount Moriah, on which the temple stood, is now occupied by the Haram esh-Sherif, i.e., \"the sacred enclosure.\" This enclosure is about 1,500 feet from north to south, with a breadth of about 1,000 feet, covering in all a space of about 35 acres. About the centre of the enclosure is a raised platform, 16 feet above the surrounding space, and paved with large stone slabs, on which stands the Mohammedan mosque called Kubbet es-Sahkra i.e., the \"Dome of the Rock,\" or the Mosque of Omar. This mosque covers the site of Solomon's temple. In the centre of the dome there is a bare, projecting rock, the highest part of Moriah (q.v.), measuring 60 feet by 40, standing 6 feet above the floor of the mosque, called the sahkra, i.e., \"rock.\" Over this rock the altar of burnt-offerings stood. It was the threshing-floor of Araunah the Jebusite. The exact position on this \"sacred enclosure\" which the temple occupied has not been yet definitely ascertained. Some affirm that Herod's temple covered the site of Solomon's temple and palace, and in addition enclosed a square of 300 feet at the south-western angle. The temple courts thus are supposed to have occupied the southern portion of the \"enclosure,\" forming in all a square of more than 900 feet. It is argued by others that Herod's temple occupied a square of 600 feet at the south-west of the \"enclosure.\"";
eastonArray["$$T0003612"] = "<strong>Temple, Solomon's:</strong> Before his death David had \"with all his might\" provided materials in great abundance for the building of the temple on the summit of Mount Moriah (<a href=\"#\" onClick=\"return mV('1Ch',22,14);\">1Ch 22:14</a>; <a href=\"#\" onClick=\"return mV('1Ch',29,4);\">29:4</a>; <a href=\"#\" onClick=\"return mV('2Ch',3,1);\">2Ch 3:1</a>), on the east of the city, on the spot where Abraham had offered up Isaac (<a href=\"#\" onClick=\"return mV('Gen',22,'1-14);\">Gen 22:1-14</a>). In the beginning of his reign Solomon set about giving effect to the desire that had been so earnestly cherished by his father, and prepared additional materials for the building. From subterranean quarries at Jerusalem he obtained huge blocks of stone for the foundations and walls of the temple. These stones were prepared for their places in the building under the eye of Tyrian master-builders. He also entered into a compact with Hiram II., king of Tyre, for the supply of whatever else was needed for the work, particularly timber from the forests of Lebanon, which was brought in great rafts by the sea to Joppa, whence it was dragged to Jerusalem <a href=\"#\" onClick=\"return mV('1Ki',5,'1-')\">1Ki 5</a>). As the hill on which the temple was to be built did not afford sufficient level space, a huge wall of solid masonry of great height, in some places more than 200 feet high, was raised across the south of the hill, and a similar wall on the eastern side, and in the spaces between were erected many arches and pillars, thus raising up the general surface to the required level. Solomon also provided for a sufficient water supply for the temple by hewing in the rocky hill vast cisterns, into which water was conveyed by channels from the \"pools\" near Bethlehem. One of these cisterns, the \"great sea,\" was capable of containing three millions of gallons. The overflow was led off by a conduit to the Kidron. <br><br>In all these preparatory undertakings a space of about three years was occupied; and now the process of the erection of the great building began, under the direction of skilled Phoenician builders and workmen, in the fourth year of Solomon's reign, 480 years after the Exodus (<a href=\"#\" onClick=\"return mV('1Ki',6,'1-')\">1Ki 6</a>; <a href=\"#\" onClick=\"return mV('2Ch',3,'1-')\">2Ch 3</a>). Many thousands of labourers and skilled artisans were employed in the work. Stones prepared in the quarries underneath the city (<a href=\"#\" onClick=\"return mV('1Ki',5,17,18);\">1Ki 5:17-18</a>) of huge dimension (see <a href=\"#\" onClick=\"return doDictLookup ('ET0003032');\">QUARRIES</a>) were gradually placed on the massive walls, and closely fitted together without any mortar between, till the whole structure was completed. No sound of hammer or axe or any tool of iron was heard as the structure arose (<a href=\"#\" onClick=\"return mV('1Ki',6,7);\">6:7</a>). \"Like some tall palm the noiseless fabric sprang.\" The building was 60 cubits long, 20 cubits wide, and 30 cubits high. The engineers of the Palestine Exploration Fund, in their explorations around the temple area, discovered what is believed to have been the \"chief corner stone\" of the temple, \"the most interesting stone in the world.\" It lies at the bottom of the south-eastern angle, and is 3 feet 8 inches high by 14 feet long. It rests on the solid rock at a depth of 79 feet 3 inches below the present surface. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002957');\">PINNACLE</a>.) In examining the walls the engineers were \"struck with admiration at the vastness of the blocks and the general excellence of the workmanship.\"<br><br>At length, in the autumn of the eleventh year of his reign, seven and a half years after it had been begun, the temple was completed in all its architectural magnificence and beauty. For thirteen years there it stood, on the summit of Moriah, silent and unused. The reasons for this strange delay in its consecration are unknown. At the close of these thirteen years preparations for the dedication of the temple were made on a scale of the greatest magnificence. The ark was solemnly brought from the tent in which David had deposited it to the place prepared for it in the temple, and the glory-cloud, the symbol of the divine presence, filled the house. Then Solomon ascended a platform which had been erected for him, in the sight of all the people, and lifting up his hands to heaven poured out his heart to God in prayer (<a href=\"#\" onClick=\"return mV('1Ki',8,'1-')\">1Ki 8</a>; <a href=\"#\" onClick=\"return mV('2Ch',6,'1-')\">2Ch 6; <a href=\"#\" onClick=\"return mV('2Ch',7,'1-')\">7</a>). The feast of dedication, which lasted seven days, followed by the feast of tabernacles, marked a new era in the history of Israel. On the eighth day of the feast of tabernacles, Solomon dismissed the vast assemblage of the people, who returned to their homes filled with joy and gladness, \"Had Solomon done no other service beyond the building of the temple, he would still have influenced the religious life of his people down to the latest days. It was to them a perpetual reminder and visible symbol of God's presence and protection, a strong bulwark of all the sacred traditions of the law, a witness to duty, an impulse to historic study, an inspiration of sacred song.\"<br><br>The temple consisted of,<br><br>(1.) The oracle or most holy place (<a href=\"#\" onClick=\"return mV('1Ki',6,19);\">1Ki 6:19</a>; <a href=\"#\" onClick=\"return mV('1Ki',8,6);\">8:6</a>), called also the \"inner house\" (<a href=\"#\" onClick=\"return mV('1Ki',6,27);\">6:27</a>), and the \"holiest of all\" (<a href=\"#\" onClick=\"return mV('Hbr',9,3);\">Hbr 9:3</a>). It was 20 cubits in length, breadth, and height. It was floored and wainscotted with cedar (<a href=\"#\" onClick=\"return mV('1Ki',6,16);\">1Ki 6:16</a>), and its walls and floor were overlaid with gold (<a href=\"#\" onClick=\"return mV('1Ki',6,20,21,30);\">6:20-21, 30</a>). There was a two-leaved door between it and the holy place overlaid with gold (<a href=\"#\" onClick=\"return mV('2Ch',4,22);\">2Ch 4:22</a>); also a veil of blue purple and crimson and fine linen (<a href=\"#\" onClick=\"return mV('2Ch',3,14);\">2Ch 3:14</a>; <a href=\"#\" onClick=\"return mV('Exd',26,33);\">Exd 26:33</a>). It had no windows (<a href=\"#\" onClick=\"return mV('1Ki',8,12);\">1Ki 8:12</a>). It was indeed the dwelling-place of God.<br><br>(2.) The holy place (q.v.), (<a href=\"#\" onClick=\"return mV('1Ki',8,'8-10');\">1Ki 8:8-10</a>), called also the \"greater house\" (<a href=\"#\" onClick=\"return mV('2Ch',3,5);\">2Ch 3:5</a>) and the \"temple\" (<a href=\"#\" onClick=\"return mV('1Ki',6,17);\">1Ki 6:17</a>).<br><br>(3.) The porch or entrance before the temple on the east (<a href=\"#\" onClick=\"return mV('1Ki',6,3);\">1Ki 6:3</a>; <a href=\"#\" onClick=\"return mV('2Ch',3,4);\">2Ch 3:4</a>; <a href=\"#\" onClick=\"return mV('2Ch',29,7);\">29:7</a>). In the porch stood the two pillars Jachin and Boaz (<a href=\"#\" onClick=\"return mV('1Ki',7,21);\">1Ki 7:21</a>; <a href=\"#\" onClick=\"return mV('2Ki',11,14);\">2Ki 11:14</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,3);\">23:3</a>).<br><br>(4.) The chambers, which were built about the temple on the southern, western, and northern sides (<a href=\"#\" onClick=\"return mV('1Ki',6,'5-10');\">1Ki 6:5-10</a>). These formed a part of the building.<br><br>Round about the building were,<br><br>(1.) The court of the priests (<a href=\"#\" onClick=\"return mV('2Ch',4,9);\">2Ch 4:9</a>), called the \"inner court\" (<a href=\"#\" onClick=\"return mV('1Ki',6,36);\">1Ki 6:36</a>). It contained the altar of burnt-offering (<a href=\"#\" onClick=\"return mV('2Ch',15,8);\">2Ch 15:8</a>), the brazen sea (<a href=\"#\" onClick=\"return mV('2Ch',4,'2-5',10);\">4:2-5, 10</a>), and ten lavers (<a href=\"#\" onClick=\"return mV('1Ki',7,38,39);\">1Ki 7:38-39</a>).<br><br>(2.) The great court, which surrounded the whole temple (<a href=\"#\" onClick=\"return mV('2Ch',4,9);\">2Ch 4:9</a>). Here the people assembled to worship God (<a href=\"#\" onClick=\"return mV('Jer',19,14);\">Jer 19:14</a>; <a href=\"#\" onClick=\"return mV('Jer',26,2);\">26:2</a>).<br><br>This temple erected by Solomon was many times pillaged during the course of its history,<br><br>(1) (<a href=\"#\" onClick=\"return mV('1Ki',14,25,26);\">1Ki 14:25-26</a>);<br><br>(2) (<a href=\"#\" onClick=\"return mV('2Ki',14,14);\">2Ki 14:14</a>);<br><br>(3) (<a href=\"#\" onClick=\"return mV('2Ki',16,8,17,18);\">2Ki 16:8, 17-18</a>);<br><br>(4) (<a href=\"#\" onClick=\"return mV('2Ki',18,15,16);\">2Ki 18:15-16</a>). At last it was pillaged and destroyed by Nebuchadnezzar (<a href=\"#\" onClick=\"return mV('2Ki',24,13);\">2Ki 24:13</a>; <a href=\"#\" onClick=\"return mV('2Ch',36,7);\">2Ch 36:7</a>). He burned the temple, and carried all its treasures with him to Babylon (<a href=\"#\" onClick=\"return mV('2Ki',25,'9-17');\">2Ki 25:9-17</a>; <a href=\"#\" onClick=\"return mV('2Ch',36,19);\">2Ch 36:19</a>; <a href=\"#\" onClick=\"return mV('Isa',64,11);\">Isa 64:11</a>). These sacred vessels were at length, at the close of the Captivity, restored to the Jews by Cyrus (<a href=\"#\" onClick=\"return mV('Ezr',1,'7-11');\">Ezr 1:7-11</a>).";
eastonArray["$$T0003613"] = "<strong>Temple, the Second:</strong> After the return from captivity, under Zerubbabel (q.v.) and the high priest Jeshua, arrangements were almost immediately made to reorganize the long-desolated kingdom. The body of pilgrims, forming a band of 42,360, including children, having completed the long and dreary journey of some four months, from the banks of the Euphrates to Jerusalem, were animated in all their proceeding by a strong religious impulse, and therefore one of their first cares was to restore their ancient worship by rebuilding the temple. On the invitation of Zerubbabel, the governor, who showed them a remarkable example of liberality by contributing personally 1,000 golden darics (probably about $6,000), besides other gifts, the people with great enthusiasm <a href=\"#\" onClick=\"return mV('Ezr',2,'1-')\">Ezr 2</a>). First they erected and dedicated the altar of Jehovah on the exact spot where it had formerly stood, and they then cleared away the charred heaps of debris which occupied the site of the old temple; and in the second month of the second year (B.C. 535), amid great public excitement and rejoicing <a href=\"#\" onClick=\"return mV('Psa',116,'1-')\">Psa 116</a>; <a href=\"#\" onClick=\"return mV('Psa',117,'1-')\">117</a>; <a href=\"#\" onClick=\"return mV('Psa',1186,'1-')\">118</a>), the foundations of the second temple were laid. A wide interest was felt in this great movement, although it was regarded with mingled feelings by the spectators (<a href=\"#\" onClick=\"return mV('Hag',2,3);\">Hag 2:3</a>; <a href=\"#\" onClick=\"return mV('Zec',4,10);\">Zec 4:10</a>). The Samaritans made proposals for a co-operation in the work. Zerubbabel and Jeshua and the elders, however, declined all such cooperation: Judah must build the temple without help. Immediately evil reports were spread regarding the Jews. The Samaritans sought to \"frustrate their purpose\" (<a href=\"#\" onClick=\"return mV('Ezr',4,5);\">Ezr 4:5</a>), and sent messengers to Ecbatana and Susa, with the result that the work was suspended. Seven years after this Cyrus died ingloriously, having killed himself in Syria when on his way back from Egypt to the east, and was succeeded by his son Cambyses (B.C. 529-522), on whose death the \"false Smerdis,\" an imposter, occupied the throne for some seven or eight months, and then Darius Hystaspes became king (B.C. 522). In the second year of this monarch the work of rebuilding the temple was resumed and carried forward to its completion (<a href=\"#\" onClick=\"return mV('Ezr',5,'6-17');\">Ezr 5:6-17</a>; <a href=\"#\" onClick=\"return mV('Ezr',6,'1-15');\">6:1-15</a>), under the stimulus of the earnest counsels and admonitions of the prophets Haggai and Zechariah. It was ready for consecration in the spring of B.C. 516, twenty years after the return from captivity.<br><br>This second temple had not the ark, the Urim and Thummim, the holy oil, the sacred fire, the tables of stone, the pot of manna, and Aaron's rod. As in the tabernacle, there was in it only one golden lamp for the holy place, one table of shewbread, and the incense altar, with golden censers, and many of the vessels of gold that had belonged to Solomon's temple that had been carried to Babylon but restored by Cyrus (<a href=\"#\" onClick=\"return mV('Ezr',1,'7-11');\">Ezr 1:7-11</a>).<br><br>This second temple also differed from the first in that, while in the latter there were numerous \"trees planted in the courts of the Lord,\" there were none in the former. The second temple also had for the first time a space, being a part of the outer court, provided for proselytes who were worshippers of Jehovah, although not subject to the laws of Judaism.<br><br>The temple, when completed, was consecrated amid great rejoicings on the part of all the people (<a href=\"#\" onClick=\"return mV('Ezr',6,16);\">Ezr 6:16</a>), although there were not wanting outward evidences that the Jews were no longer an independent people, but were subject to a foreign power.<br><br>(<a href=\"#\" onClick=\"return mV('Hag',2,9);\">Hag 2:9</a>) is rightly rendered in the Revised Version, \"The latter glory of this house shall be greater than the former,\" instead of, \"The glory of this latter house,\" etc., in the Authorized Version. The temple, during the different periods of its existence, is regarded as but one house, the one only house of God (<a href=\"#\" onClick=\"return mV('Hag',2,3);\">Hag 2:3</a>). The glory here predicted is spiritual glory and not material splendour. \"Christ himself, present bodily in the temple on Mount Zion during his life on earth, present spiritually in the Church now, present in the holy city, the heavenly Jerusalem, of which he is the temple, calling forth spiritual worship and devotion is the glory here predicted\" (Perowne).";
eastonArray["$$T0003614"] = "<strong>Temptation:</strong><br><br>(1.) Trial; a being put to the test. Thus God \"tempted [<a href=\"#\" onClick=\"return mV('Gen',22,1);\">Gen 22:1</a>; R.V., 'did prove'] Abraham;\" and afflictions are said to tempt, i.e., to try, men (<a href=\"#\" onClick=\"return mV('Jam',1,2,12);\">Jam 1:2, 12</a>; <a href=\"#\" onClick=\"return mV('Deu',8,2);\">Deu 8:2</a>), putting their faith and patience to the test.<br><br>(2.) Ordinarily, however, the word means solicitation to that which is evil, and hence Satan is called \"the tempter\" (<a href=\"#\" onClick=\"return mV('Mat',4,3);\">Mat 4:3</a>). Our Lord was in this way tempted in the wilderness. That temptation was not internal, but by a real, active, subtle being. It was not self-sought. It was submitted to as an act of obedience on his part. \"Christ was led, driven. An unseen personal force bore him a certain violence is implied in the words\" (<a href=\"#\" onClick=\"return mV('Mat',4,'1-11');\">Mat 4:1-11</a>).<br><br>The scene of the temptation of our Lord is generally supposed to have been the mountain of Quarantania (q.v.), \"a high and precipitous wall of rock, 1,200 or 1,500 feet above the plain west of Jordan, near Jericho.\"<br><br>Temptation is common to all (<a href=\"#\" onClick=\"return mV('Dan',12,10);\">Dan 12:10</a>; <a href=\"#\" onClick=\"return mV('Zec',13,9);\">Zec 13:9</a>; <a href=\"#\" onClick=\"return mV('Psa',66,10);\">Psa 66:10</a>; <a href=\"#\" onClick=\"return mV('Luk',22,31,40);\">Luk 22:31, 40</a>; <a href=\"#\" onClick=\"return mV('Hbr',11,17);\">Hbr 11:17</a>; <a href=\"#\" onClick=\"return mV('Jam',1,12);\">Jam 1:12</a>; <a href=\"#\" onClick=\"return mV('1Pe',1,7);\">1Pe 1:7</a>; <a href=\"#\" onClick=\"return mV('1Pe',4,12);\">4:12</a>). We read of the temptation of Joseph (<a href=\"#\" onClick=\"return mV('Gen',39,'1-')\">Gen 39</a>), of David (<a href=\"#\" onClick=\"return mV('2Sa',24,'1-')\">2Sa 24</a>; <a href=\"#\" onClick=\"return mV('1Ch',21,'1-')\">1Ch 21</a>), of Hezekiah (<a href=\"#\" onClick=\"return mV('2Ch',32,31);\">2Ch 32:31</a>), of Daniel (<a href=\"#\" onClick=\"return mV('Dan',6,'1-')\">Dan 6</a>), etc. So long as we are in this world we are exposed to temptations, and need ever to be on our watch against them.";
eastonArray["$$T0003615"] = "<strong>Tent:</strong><br><br>(1.) Heb. 'ohel (<a href=\"#\" onClick=\"return mV('Gen',9,21,27);\">Gen 9:21, 27</a>). This word is used also of a dwelling or habitation (<a href=\"#\" onClick=\"return mV('1Ki',8,66);\">1Ki 8:66</a>; <a href=\"#\" onClick=\"return mV('Isa',16,5);\">Isa 16:5</a>; <a href=\"#\" onClick=\"return mV('Jer',4,20);\">Jer 4:20</a>), and of the temple (<a href=\"#\" onClick=\"return mV('Eze',41,1);\">Eze 41:1</a>). When used of the tabernacle, as in <a href=\"#\" onClick=\"return mV('1Ki',1,39);\">1Ki 1:39</a>, it denotes the covering of goat's hair which was placed over the mishcan.<br><br>(2.) Heb. mishcan (<a href=\"#\" onClick=\"return mV('Sgs',1,8);\">Sgs 1:8</a>), used also of a dwelling (<a href=\"#\" onClick=\"return mV('Job',18,21);\">Job 18:21</a>; <a href=\"#\" onClick=\"return mV('Psa',87,2);\">Psa 87:2</a>), the grave (<a href=\"#\" onClick=\"return mV('Isa',22,16);\">Isa 22:16</a>; <a href=\"#\" onClick=\"return mV('Isa',14,18);\">Isa 14:18</a>), the temple (<a href=\"#\" onClick=\"return mV('Psa',46,4);\">Psa 46:4</a>; <a href=\"#\" onClick=\"return mV('Psa',84,2);\">84:2</a>; <a href=\"#\" onClick=\"return mV('Psa',132,5);\">132:5</a>), and of the tabernacle (<a href=\"#\" onClick=\"return mV('Exd',25,9);\">Exd 25:9</a>; <a href=\"#\" onClick=\"return mV('Exd',26,1);\">26:1</a>; <a href=\"#\" onClick=\"return mV('Exd',40,9);\">40:9</a>; <a href=\"#\" onClick=\"return mV('Num',1,50,53);\">Num 1:50, 53</a>; <a href=\"#\" onClick=\"return mV('Num',10,11);\">10:11</a>). When distinguished from 'ohel, it denotes the twelve interior curtains which lay upon the framework of the tabernacle (q.v.).<br><br>(3.) Heb. kubbah (<a href=\"#\" onClick=\"return mV('Num',25,8);\">Num 25:8</a>), a dome-like tent devoted to the impure worship of Baal-peor.<br><br>(4.) Heb. succah (<a href=\"#\" onClick=\"return mV('2Sa',11,11);\">2Sa 11:11</a>), a tent or booth made of green boughs or branches (see <a href=\"#\" onClick=\"return mV('Gen',33,17);\">Gen 33:17</a>; <a href=\"#\" onClick=\"return mV('Lev',23,34,42);\">Lev 23:34, 42</a>; <a href=\"#\" onClick=\"return mV('Psa',18,11);\">Psa 18:11</a>; <a href=\"#\" onClick=\"return mV('Jon',4,5);\">Jon 4:5</a>; <a href=\"#\" onClick=\"return mV('Isa',4,6);\">Isa 4:6</a>; <a href=\"#\" onClick=\"return mV('Neh',8,'15-17');\">Neh 8:15-17</a>, where the word is variously rendered).<br><br>Jubal was \"the father of such as dwell in tents\" (<a href=\"#\" onClick=\"return mV('Gen',4,20);\">Gen 4:20</a>). The patriarchs were \"dwellers in tents\" (<a href=\"#\" onClick=\"return mV('Gen',9,21,27);\">Gen 9:21, 27</a>; <a href=\"#\" onClick=\"return mV('Gen',12,8);\">12:8</a>; <a href=\"#\" onClick=\"return mV('Gen',13,12);\">13:12</a>; <a href=\"#\" onClick=\"return mV('Gen',26,17);\">26:17</a>); and during their wilderness wanderings all Israel dwelt in tents (<a href=\"#\" onClick=\"return mV('Exd',16,16);\">Exd 16:16</a>; <a href=\"#\" onClick=\"return mV('Deu',33,18);\">Deu 33:18</a>; <a href=\"#\" onClick=\"return mV('Jos',7,24);\">Jos 7:24</a>). Tents have always occupied a prominent place in Eastern life (<a href=\"#\" onClick=\"return mV('1Sa',17,54);\">1Sa 17:54</a>; <a href=\"#\" onClick=\"return mV('2Ki',7,7);\">2Ki 7:7</a>; <a href=\"#\" onClick=\"return mV('Psa',120,5);\">Psa 120:5</a>; <a href=\"#\" onClick=\"return mV('Sgs',1,5);\">Sgs 1:5</a>). Paul the apostle's occupation was that of a tent-maker (<a href=\"#\" onClick=\"return mV('Act',18,3);\">Act 18:3</a>); i.e., perhaps a maker of tent cloth.";
eastonArray["$$T0003616"] = "<strong>Tenth deal:</strong> i.e., the tenth part of an ephah (as in the R.V.), equal to an omer or six pints. The recovered leper, to complete his purification, was required to bring a trespass, a sin, and a burnt offering, and to present a meal offering, a tenth deal or an omer of flour for each, with oil to make it into bread or cakes (<a href=\"#\" onClick=\"return mV('Lev',14,10, 21);\">Lev 14:10, 21</a>; <a href=\"#\" onClick=\"return mV('Exd',16,36);\">Exd 16:36</a>; <a href=\"#\" onClick=\"return mV('Exd',29,40);\">29:40</a>).";
eastonArray["$$T0003617"] = "<strong>Terah:</strong> the wanderer; loiterer, for some unknown reason emigrated with his family from his native mountains in the north to the plains of Mesopotamia. He had three sons, Haran, Nahor, and Abraham, and one daughter, Sarah. He settled in \"Ur of the Chaldees,\" where his son Haran died, leaving behind him his son Lot. Nahor settled at Haran, a place on the way to Ur. Terah afterwards migrated with Abraham (probably his youngest son) and Lot (his grandson), together with their families, from Ur, intending to go with them to Canaan; but he tarried at Haran, where he spent the remainder of his days, and died at the age of two hundred and five years (<a href=\"#\" onClick=\"return mV('Gen',11,'24-32');\">Gen 11:24-32</a>; <a href=\"#\" onClick=\"return mV('Jos',24,2);\">Jos 24:2</a>). What a wonderful part the descendants of this Chaldean shepherd have played in the history of the world!";
eastonArray["$$T0003618"] = "<strong>Teraphim:</strong> givers of prosperity, idols in human shape, large or small, analogous to the images of ancestors which were revered by the Romans. In order to deceive the guards sent by Saul to seize David, Michal his wife prepared one of the household teraphim, putting on it the goat's-hair cap worn by sleepers and invalids, and laid it in a bed, covering it with a mantle. She pointed it out to the soldiers, and alleged that David was confined to his bed by a sudden illness (<a href=\"#\" onClick=\"return mV('1Sa',19,'13-16');\">1Sa 19:13-16</a>). Thus she gained time for David's escape. It seems strange to read of teraphim, images of ancestors, preserved for superstitious purposes, being in the house of David. Probably they had been stealthily brought by Michal from her father's house. \"Perhaps,\" says Bishop Wordsworth, \"Saul, forsaken by God and possessed by the evil spirit, had resorted to teraphim (as he afterwards resorted to witchcraft); and God overruled evil for good, and made his very teraphim (by the hand of his own daughter) to be an instrument for David's escape.\", Deane's David, p. 32. Josiah attempted to suppress this form of idolatry (<a href=\"#\" onClick=\"return mV('2Ki',23,24);\">2Ki 23:24</a>). The ephod and teraphim are mentioned together in <a href=\"#\" onClick=\"return mV('Hsa',3,4);\">Hsa 3:4</a>. It has been supposed by some (Cheyne's Hosea) that the \"ephod\" here mentioned, and also in <a href=\"#\" onClick=\"return mV('Jdg',8,'24-27');\">Jdg 8:24-27</a>, was not the part of the sacerdotal dress so called (<a href=\"#\" onClick=\"return mV('Exd',28,'6-14');\">Exd 28:6-14</a>), but an image of Jehovah overlaid with gold or silver (comp. <a href=\"#\" onClick=\"return mV('Jdg',17,'1-');\">Jdg 17</a>; <a href=\"#\" onClick=\"return mV('Jdg',18,'1-');\">Jdg 18</a>; <a href=\"#\" onClick=\"return mV('1Sa',21,9);\">1Sa 21:9</a>; <a href=\"#\" onClick=\"return mV('1Sa',23,6,9);\">23:6, 9</a>; <a href=\"#\" onClick=\"return mV('1Sa',30,7,8);\">30:7-8</a>), and is thus associated with the teraphim. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003648');\">THUMMIM</a>.)";
eastonArray["$$T0003619"] = "<strong>Terebinth:</strong> (of <a href=\"#\" onClick=\"return mV('Deu',11,30);\">Deu 11:30</a>, etc.), the <i>Pistacia terebinthus</i> of botanists; a tree very common in the south and east of Palestine. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002758');\">OAK</a>.)";
eastonArray["$$T0003620"] = "<strong>Teresh:</strong> severe, a eunuch or chamberlain in the palace of Ahasuerus, who conspired with another to murder him. The plot was detected by Mordecai, and the conspirators were put to death (<a href=\"#\" onClick=\"return mV('Est',2,21);\">Est 2:21</a>; <a href=\"#\" onClick=\"return mV('Est',6,2);\">6:2</a>).";
eastonArray["$$T0003621"] = "<strong>Tertius:</strong> the third, a Roman Christian whom Paul employed as his amanuensis in writing his epistle to the Romans (<a href=\"#\" onClick=\"return mV('Rom',16,22);\">Rom 16:22</a>).";
eastonArray["$$T0003622"] = "<strong>Tertullus:</strong> a modification of \"Tertius;\" a Roman advocate, whom the Jews employed to state their case against Paul in the presence of Felix (<a href=\"#\" onClick=\"return mV('Act',24,'1-9');\">Act 24:1-9</a>). The charges he adduced against the apostle were, \"First, that he created disturbances among the Romans throughout the empire, an offence against the Roman government (<i>crimen majestatis</i>). Secondly, that he was a ringleader of the sect of the Nazarenes; disturbed the Jews in the exercise of their religion, guaranteed by the state; introduced new gods, a thing prohibited by the Romans. And thirdly, that he attempted to profane the temple, a crime which the Jews were permitted to punish.\"";
eastonArray["$$T0003623"] = "<strong>Testament:</strong> occurs twelve times in the New Testament (<a href=\"#\" onClick=\"return mV('Hbr',9,15);\">Hbr 9:15</a>, etc.) as the rendering of the Gr. diatheke, which is twenty times rendered \"covenant\" in the Authorized Version, and always so in the Revised Version. The Vulgate translates incorrectly by <i>testamentum</i>, whence the names \"Old\" and \"New Testament,\" by which we now designate the two sections into which the Bible is divided. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000580');\">BIBLE</a>.)";
eastonArray["$$T0003624"] = "<strong>Testimony:</strong><br><br>(1.) Witness or evidence (<a href=\"#\" onClick=\"return mV('2Th',1,10);\">2Th 1:10</a>).<br><br>(2.) The Scriptures, as the revelation of God's will (<a href=\"#\" onClick=\"return mV('2Ki',11,12);\">2Ki 11:12</a>; <a href=\"#\" onClick=\"return mV('Psa',19,7);\">Psa 19:7</a>; <a href=\"#\" onClick=\"return mV('Psa',119,88);\">119:88</a>; <a href=\"#\" onClick=\"return mV('Isa',8,16,20);\">Isa 8:16, 20</a>).<br><br>(3.) The altar raised by the Gadites and Reubenites (<a href=\"#\" onClick=\"return mV('Jos',22,10);\">Jos 22:10</a>).";
eastonArray["$$T0003625"] = "<strong>Testimony, Tabernacle of:</strong> the tabernacle, the great glory of which was that it contained \"the testimony\", i.e., the \"two tables\" (<a href=\"#\" onClick=\"return mV('Exd',38,21);\">Exd 38:21</a>). The ark in which these tables were deposited was called the \"ark of the testimony\" (<a href=\"#\" onClick=\"return mV('Exd',40,3);\">40:3</a>), and also simply the \"testimony\" (<a href=\"#\" onClick=\"return mV('Exd',27,21);\">27:21</a>; <a href=\"#\" onClick=\"return mV('Exd',30,6);\">30:6</a>).";
eastonArray["$$T0003626"] = "<strong>Tetrarch:</strong> strictly the ruler over the fourth part of a province; but the word denotes a ruler of a province generally (<a href=\"#\" onClick=\"return mV('Mat',14,1);\">Mat 14:1</a>; <a href=\"#\" onClick=\"return mV('Luk',3,1,19);\">Luk 3:1, 19</a>; <a href=\"#\" onClick=\"return mV('Luk',9,7);\">9:7</a>; <a href=\"#\" onClick=\"return mV('Act',13,1);\">Act 13:1</a>). Herod and Phasael, the sons of Antipater, were the first tetrarchs in Palestine. Herod the tetrarch had the title of king (<a href=\"#\" onClick=\"return mV('Mat',14,9);\">Mat 14:9</a>).";
eastonArray["$$T0003627"] = "<strong>Thaddaeus:</strong> breast, the name of one of the apostles (<a href=\"#\" onClick=\"return mV('Mar',3,18);\">Mar 3:18</a>), called \"Lebbaeus\" in (<a href=\"#\" onClick=\"return mV('Mat',10,3);\">Mat 10:3</a>; and in <a href=\"#\" onClick=\"return mV('Luk',6,16);\">Luk 6:16</a>), \"Judas the brother of James;\" while John (<a href=\"#\" onClick=\"return mV('Jhn',14,22);\">Jhn 14:22</a>), probably referring to the same person, speaks of \"Judas, not Iscariot.\" These different names all designate the same person, viz., Jude or Judas, the author of the epistle.";
eastonArray["$$T0003628"] = "<strong>Thahash:</strong> a badger, a son of Nahor, Abraham's brother (<a href=\"#\" onClick=\"return mV('Gen',22,24);\">Gen 22:24</a>).";
eastonArray["$$T0003629"] = "<strong>Tharshish:</strong> (<a href=\"#\" onClick=\"return mV('1Ki',10,22);\">1Ki 10:22</a>; <a href=\"#\" onClick=\"return mV('1Ki',22,48);\">22:48</a>). See <a href=\"#\" onClick=\"return doDictLookup ('ET0003588');\">TARSHISH</a>.";
eastonArray["$$T0003630"] = "<strong>Theatre:</strong> only mentioned in <a href=\"#\" onClick=\"return mV('Act',19,29,31);\">Act 19:29, 31</a>. The ruins of this theatre at Ephesus still exist, and they show that it was a magnificent structure, capable of accommodating some 56,700 persons. It was the largest structure of the kind that ever existed. Theatres, as places of amusement, were unknown to the Jews.";
eastonArray["$$T0003631"] = "<strong>Thebez:</strong> brightness, a place some 11 miles north-east of Shechem, on the road to Scythopolis, the modern Tabas. Abimelech led his army against this place, because of its participation in the conspiracy of the men of Shechem; but as he drew near to the strong tower to which its inhabitants had fled for safety, and was about to set fire to it, a woman cast a fragment of millstone at him, and \"all to brake his skull\" i.e., \"altogether brake,\" etc. His armourbearer thereupon \"thrust him through, and he died\" (<a href=\"#\" onClick=\"return mV('Jdg',9,'50-55');\">Jdg 9:50-55</a>).";
eastonArray["$$T0003632"] = "<strong>Theft:</strong> Punished by restitution, the proportions of which are noted in <a href=\"#\" onClick=\"return mV('2Sa',12,6);\">2Sa 12:6</a>. If the thief could not pay the fine, he was to be sold to a Hebrew master till he could pay (<a href=\"#\" onClick=\"return mV('Exd',22,'1-4');\">Exd 22:1-4</a>). A night-thief might be smitten till he died, and there would be no blood-guiltiness for him (<a href=\"#\" onClick=\"return mV('Exd',22,2);\">22:2</a>). A man-stealer was to be put to death (<a href=\"#\" onClick=\"return mV('Exd',21,16);\">21:16</a>). All theft is forbidden (<a href=\"#\" onClick=\"return mV('Exd',20,15);\">Exd 20:15</a>; <a href=\"#\" onClick=\"return mV('Exd',21,16);\">21:16</a>; <a href=\"#\" onClick=\"return mV('Lev',19,11);\">Lev 19:11</a>; <a href=\"#\" onClick=\"return mV('Deu',5,19);\">Deu 5:19</a>; <a href=\"#\" onClick=\"return mV('Deu',24,7);\">24:7</a>; <a href=\"#\" onClick=\"return mV('Psa',50,18);\">Psa 50:18</a>; <a href=\"#\" onClick=\"return mV('Zec',5,3);\">Zec 5:3</a>; <a href=\"#\" onClick=\"return mV('Mat',19,18);\">Mat 19:18</a>; <a href=\"#\" onClick=\"return mV('Rom',13,9);\">Rom 13:9</a>; <a href=\"#\" onClick=\"return mV('Eph',4,28);\">Eph 4:28</a>; <a href=\"#\" onClick=\"return mV('1Pe',4,15);\">1Pe 4:15</a>).";
eastonArray["$$T0003633"] = "<strong>Theocracy:</strong> a word first used by Josephus to denote that the Jews were under the direct government of God himself. The nation was in all things subject to the will of their invisible King. All the people were the servants of Jehovah, who ruled over their public and private affairs, communicating to them his will through the medium of the prophets. They were the subjects of a heavenly, not of an earthly, king. They were Jehovah's own subjects, ruled directly by him (<a href=\"#\" onClick=\"return mV('1Sa',8,'6-9');\">1Sa 8:6-9</a>).";
eastonArray["$$T0003634"] = "<strong>Theophilus:</strong> lover of God, a Christian, probably a Roman, to whom Luke dedicated both his Gospel (<a href=\"#\" onClick=\"return mV('Luk',1,3);\">Luk 1:3</a>) and the Acts of the Apostles (<a href=\"#\" onClick=\"return mV('Luk',1,1);\">1:1</a>). Nothing beyond this is known of him. From the fact that Luke applies to him the title \"most excellent\", the same title Paul uses in addressing Felix (<a href=\"#\" onClick=\"return mV('Act',23,26);\">Act 23:26</a>; <a href=\"#\" onClick=\"return mV('Act',24,3);\">24:3</a>) and Festus (<a href=\"#\" onClick=\"return mV('Act',26,25);\">26:25</a>), it has been concluded that Theophilus was a person of rank, perhaps a Roman officer.";
eastonArray["$$T0003635"] = "<strong>Thessalonians, Epistles to the:</strong> The first epistle to the Thessalonians was the first of all Paul's epistles. It was in all probability written from Corinth, where he abode a \"long time\" (<a href=\"#\" onClick=\"return mV('Act',18,11,18);\">Act 18:11, 18</a>), early in the period of his residence there, about the end of A.D. 52.<br><br>The occasion of its being written was the return of Timotheus from Macedonia, bearing tidings from Thessalonica regarding the state of the church there (<a href=\"#\" onClick=\"return mV('Act',18,'1-5');\">Act 18:1-5</a>; <a href=\"#\" onClick=\"return mV('1Th',3,6);\">1Th 3:6</a>). While, on the whole, the report of Timothy was encouraging, it also showed that divers errors and misunderstandings regarding the tenor of Paul's teaching had crept in amongst them. He addresses them in this letter with the view of correcting these errors, and especially for the purpose of exhorting them to purity of life, reminding them that their sanctification was the great end desired by God regarding them.<br><br>The subscription erroneously states that this epistle was written from Athens.<br><br>The second epistle to the Thessalonians was probably also written from Corinth, and not many months after the first.<br><br>The occasion of the writing of this epistle was the arrival of tidings that the tenor of the first epistle had been misunderstood, especially with reference to the second advent of Christ. The Thessalonians had embraced the idea that Paul had taught that \"the day of Christ was at hand\", that Christ's coming was just about to happen. This error is corrected (<a href=\"#\" onClick=\"return mV('1Th',2,'1-12');\">1Th 2:1-12</a>), and the apostle prophetically announces what first must take place. \"The apostasy\" was first to arise. Various explanations of this expression have been given, but that which is most satisfactory refers it to the Church of Rome.";
eastonArray["$$T0003636"] = "<strong>Thessalonica:</strong> a large and populous city on the Thermaic bay. It was the capital of one of the four Roman districts of Macedonia, and was ruled by a praetor. It was named after Thessalonica, the wife of Cassander, who built the city. She was so called by her father, Philip, because he first heard of her birth on the day of his gaining a victory over the Thessalians. On his second missionary journey, Paul preached in the synagogue here, the chief synagogue of the Jews in that part of Macedonia, and laid the foundations of a church (<a href=\"#\" onClick=\"return mV('Act',17,'1-4');\">Act 17:1-4</a>; <a href=\"#\" onClick=\"return mV('1Th',1,9);\">1Th 1:9</a>). The violence of the Jews drove him from the city, when he fled to Berea (<a href=\"#\" onClick=\"return mV('Act',17,'5-10');\">Act 17:5-10</a>). The \"rulers of the city\" before whom the Jews \"drew Jason,\" with whom Paul and Silas lodged, are in the original called politarchai, an unusual word, which was found, however, inscribed on an arch in Thessalonica. This discovery confirms the accuracy of the historian. Paul visited the church here on a subsequent occasion (<a href=\"#\" onClick=\"return mV('Act',20,'1-3');\">20:1-3</a>). This city long retained its importance. It is the most important town of European Turkey, under the name of Saloniki, with a mixed population of about 85,000.";
eastonArray["$$T0003637"] = "<strong>Theudas:</strong> thanksgiving, referred to by Gamaliel in his speech before the council at Jerusalem (<a href=\"#\" onClick=\"return mV('Act',5,36);\">Act 5:36</a>). He headed an insurrection against the Roman authority. Beyond this nothing is known of him.";
eastonArray["$$T0003638"] = "<strong>Thick clay:</strong> (<a href=\"#\" onClick=\"return mV('Hab',2,6);\">Hab 2:6</a>) is correctly rendered in the Revised Version \"pledges.\" The Chaldean power is here represented as a rapacious usurer, accumulating the wealth that belonged to others.";
eastonArray["$$T0003639"] = "<strong>Thieves, The two:</strong> (<a href=\"#\" onClick=\"return mV('Luk',23,32,'39-43');\">Luk 23:32, 39-43</a>), robbers, rather brigands, probably followers of Barabbas. Our Lord's cross was placed between those of the \"malefactors,\" to add to the ignominy of his position. According to tradition, Demas or Dismas was the name of the penitent thief hanging on the right, and Gestas of the impenitent on the left.";
eastonArray["$$T0003640"] = "<strong>Thistle:</strong><br><br>(1.) Heb. hoah (<a href=\"#\" onClick=\"return mV('2Ki',14,9);\">2Ki 14:9</a>; <a href=\"#\" onClick=\"return mV('Job',31,40);\">Job 31:40</a>). In <a href=\"#\" onClick=\"return mV('Job',41,2);\">Job 41:2</a> the Hebrew word is rendered \"thorn,\" but in the Revised Version \"hook.\" It is also rendered \"thorn\" in <a href=\"#\" onClick=\"return mV('2Ch',33,11);\">2Ch 33:11</a>; <a href=\"#\" onClick=\"return mV('Pro',26,9);\">Pro 26:9</a>; <a href=\"#\" onClick=\"return mV('Sgs',2,2);\">Sgs 2:2</a>; \"brambles\" in <a href=\"#\" onClick=\"return mV('Isa',34,13);\">Isa 34:13</a>. It is supposed to be a variety of the wild plum-tree, but by some it is regarded as the common thistle, of which there are many varieties in Palestine.<br><br>(2.) Heb. dardar, meaning \"a plant growing luxuriantly\" (<a href=\"#\" onClick=\"return mV('Gen',3,18);\">Gen 3:18</a>; <a href=\"#\" onClick=\"return mV('Hsa',10,8);\">Hsa 10:8</a>); Gr. tribolos, \"a triple point\" (<a href=\"#\" onClick=\"return mV('Mat',7,16);\">Mat 7:16</a>; <a href=\"#\" onClick=\"return mV('Hbr',6,8);\">Hbr 6:8</a>, \"brier,\" R.V. \"thistle\"). This was probably the star-thistle, called by botanists <i>Centaurea calcitropa</i>, or \"caltrops,\" a weed common in corn-fields. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003642');\">THORNS</a>.)";
eastonArray["$$T0003641"] = "<strong>Thomas:</strong> twin, one of the twelve (<a href=\"#\" onClick=\"return mV('Mat',10,3);\">Mat 10:3</a>; <a href=\"#\" onClick=\"return mV('Mar',3,18);\">Mar 3:18</a>, etc.). He was also called Didymus (<a href=\"#\" onClick=\"return mV('Jhn',11,16);\">Jhn 11:16</a>; <a href=\"#\" onClick=\"return mV('Jhn',20,24);\">20:24</a>), which is the Greek equivalent of the Hebrew name. All we know regarding him is recorded in the fourth Gospel (<a href=\"#\" onClick=\"return mV('Jhn',11,15,16);\">Jhn 11:15-16</a>; <a href=\"#\" onClick=\"return mV('Jhn',14,4,5);\">14:4-5</a>; <a href=\"#\" onClick=\"return mV('Jhn',20,'24-29');\">20:24-29</a>). From the circumstance that in the lists of the apostles he is always mentioned along with Matthew, who was the son of Alphaeus (<a href=\"#\" onClick=\"return mV('Mar',3,18);\">Mar 3:18</a>), and that these two are always followed by James, who was also the son of Alphaeus, it has been supposed that these three, Matthew, Thomas, and James, were brothers.";
eastonArray["$$T0003642"] = "<strong>Thorn:</strong><br><br>(1.) Heb. hedek (<a href=\"#\" onClick=\"return mV('Pro',15,19);\">Pro 15:19</a>), rendered \"brier\" in <a href=\"#\" onClick=\"return mV('Mic',7,4);\">Mic 7:4</a>. Some thorny plant, of the Solanum family, suitable for hedges. This is probably the so-called \"apple of Sodom,\" which grows very abundantly in the Jordan valley. \"It is a shrubby plant, from 3 to 5 feet high, with very branching stems, thickly clad with spines, like those of the English brier, with leaves very large and woolly on the under side, and thorny on the midriff.\"<br><br>(2.) Heb. kotz (<a href=\"#\" onClick=\"return mV('Gen',3,18);\">Gen 3:18</a>; <a href=\"#\" onClick=\"return mV('Hsa',10,8);\">Hsa 10:8</a>), rendered <i>akantha</i> by the LXX. In the New Testament this word <i>akantha</i> is also rendered \"thorns\" (<a href=\"#\" onClick=\"return mV('Mat',7,16);\">Mat 7:16</a>; <a href=\"#\" onClick=\"return mV('Mat',13,7);\">13:7</a>; <a href=\"#\" onClick=\"return mV('Hbr',6,8);\">Hbr 6:8</a>). The word seems to denote any thorny or prickly plant (<a href=\"#\" onClick=\"return mV('Jer',12,13);\">Jer 12:13</a>). It has been identified with the <i>Ononis spinosa</i> by some.<br><br>(3.) Heb. na'atzutz (<a href=\"#\" onClick=\"return mV('Isa',7,19);\">Isa 7:19</a>; <a href=\"#\" onClick=\"return mV('Isa',55,13);\">55:13</a>). This word has been interpreted as denoting the <i>Zizyphus spina Christi</i>, or the jujube-tree. It is supposed by some that the crown of thorns placed in wanton cruelty by the Roman soldiers on our Saviour's brow before his crucifixion was plaited of branches of this tree. It overruns a great part of the Jordan valley. It is sometimes called the lotus-tree. \"The thorns are long and sharp and recurved, and often create a festering wound.\" It often grows to a great size. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000930');\">CROWN OF THORNS</a>.)<br><br>(4.) Heb. atad (<a href=\"#\" onClick=\"return mV('Psa',58,9);\">Psa 58:9</a>) is rendered in the LXX. and Vulgate by Rhamnus, or <i>Lycium Europoeum</i>, a thorny shrub, which is common all over Palestine. From its resemblance to the box it is frequently called the box-thorn.";
eastonArray["$$T0003643"] = "<strong>Thorn in the flesh:</strong> (<a href=\"#\" onClick=\"return mV('2Cr',12,'7-10');\">2Cr 12:7-10</a>). Many interpretations have been given of this passage.<br><br>(1.) Roman Catholic writers think that it denotes suggestions to impiety.<br><br>(2.) Luther, Calvin, and other Reformers interpret the expression as denoting temptation to unbelief.<br><br>(3.) Others suppose the expression refers to \"a pain in the ear or head,\" epileptic fits, or, in general, to some severe physical infirmity, which was a hindrance to the apostle in his work (<a href=\"#\" onClick=\"return mV('1Cr',2,3);\">1Cr 2:3</a>; <a href=\"#\" onClick=\"return mV('2Cr',10,10);\">2Cr 10:10</a>; <a href=\"#\" onClick=\"return mV('2Cr',11,30);\">11:30</a>; <a href=\"#\" onClick=\"return mV('Gal',4,13,14);\">Gal 4:13-14</a>; <a href=\"#\" onClick=\"return mV('Gal',6,17);\">6:17</a>). With a great amount of probability, it has been alleged that his malady was defect of sight, consequent on the dazzling light which shone around him at his conversion, acute opthalmia. This would account for the statements in <a href=\"#\" onClick=\"return mV('Gal',4,14);\">Gal 4:14</a>; <a href=\"#\" onClick=\"return mV('2Cr',10,10);\">2Cr 10:10</a>; also <a href=\"#\" onClick=\"return mV('Act',23,5);\">Act 23:5</a>, and for his generally making use of the help of an amanuensis (<a href=\"#\" onClick=\"return mV('Rom',16,22);\">Rom 16:22</a>, etc.).<br><br>(4.) Another view which has been maintained is that this \"thorn\" consisted in an infirmity of temper, to which he occasionally gave way, and which interfered with his success (<a href=\"#\" onClick=\"return mV('Act',15,39);\">Act 15:39</a>; <a href=\"#\" onClick=\"return mV('Act',23,'2-5');\">23:2-5</a>). If we consider the fact, \"which the experience of God's saints in all ages has conclusively established, of the difficulty of subduing an infirmity of temper, as well as the pain, remorse, and humiliation such an infirmity is wont to cause to those who groan under it, we may be inclined to believe that not the least probable hypothesis concerning the 'thorn' or 'stake' in the flesh is that the loving heart of the apostle bewailed as his sorest trial the misfortune that, by impatience in word, he had often wounded those for whom he would willingly have given his life\" (Lias's Second Cor., Introd.).";
eastonArray["$$T0003644"] = "<strong>Thousands:</strong> (<a href=\"#\" onClick=\"return mV('Mic',5,2);\">Mic 5:2</a>), another name for \"families\" or \"clans\" (see <a href=\"#\" onClick=\"return mV('Num',1,16);\">Num 1:16</a>; <a href=\"#\" onClick=\"return mV('Num',10,4);\">10:4</a>; <a href=\"#\" onClick=\"return mV('Jos',22,14,21);\">Jos 22:14,21</a>). Several \"thousands\" or \"families\" made up a \"tribe.\"";
eastonArray["$$T0003645"] = "<strong>Threshing:</strong> See <a href=\"#\" onClick=\"return doDictLookup ('ET0000124');\">AGRICULTURE</a>.";
eastonArray["$$T0003646"] = "<strong>Threshold:</strong><br><br>(1.) Heb. miphtan, probably a projecting beam at a higher point than the threshold proper (<a href=\"#\" onClick=\"return mV('1Sa',5,4,5);\">1Sa 5:4-5</a>; <a href=\"#\" onClick=\"return mV('Eze',9,3);\">Eze 9:3</a>; <a href=\"#\" onClick=\"return mV('Eze',10,4,18);\">10:4, 18</a>; <a href=\"#\" onClick=\"return mV('Eze',46,2);\">46:2</a>; <a href=\"#\" onClick=\"return mV('Eze',47,1);\">47:1</a>); also rendered \"door\" and \"door-post.\"<br><br>(2.) 'Asuppim, pl. (<a href=\"#\" onClick=\"return mV('Neh',12,25);\">Neh 12:25</a>), rendered correctly \"storehouses\" in the Revised Version. In <a href=\"#\" onClick=\"return mV('1Ch',26,15,17);\">1Ch 26:15, 17</a> the Authorized Version retains the word as a proper name, while in the Revised Version it is translated \"storehouses.\"";
eastonArray["$$T0003647"] = "<strong>Throne:</strong> (Heb. kiss'e), a royal chair or seat of dignity (<a href=\"#\" onClick=\"return mV('Deu',17,18);\">Deu 17:18</a>; <a href=\"#\" onClick=\"return mV('2Sa',7,13);\">2Sa 7:13</a>; <a href=\"#\" onClick=\"return mV('Psa',45,6);\">Psa 45:6</a>); an elevated seat with a canopy and hangings, which cover it. It denotes the seat of the high priest in <a href=\"#\" onClick=\"return mV('1Sa',1,9);\">1Sa 1:9</a>; <a href=\"#\" onClick=\"return mV('1Sa',4,13);\">4:13</a>, and of a provincial governor in <a href=\"#\" onClick=\"return mV('Neh',3,7);\">Neh 3:7</a> and <a href=\"#\" onClick=\"return mV('Psa',122,5);\">Psa 122:5</a>. The throne of Solomon is described at length in <a href=\"#\" onClick=\"return mV('1Ki',10,'18-20');\">1Ki 10:18-20</a>.";
eastonArray["$$T0003648"] = "<strong>Thummim:</strong> perfection (LXX., \"truth; \" Vulg., \"veritas\"), <a href=\"#\" onClick=\"return mV('Exd',28,30);\">Exd 28:30</a>; <a href=\"#\" onClick=\"return mV('Deu',33,8);\">Deu 33:8</a>; <a href=\"#\" onClick=\"return mV('Jdg',1,1);\">Jdg 1:1</a>; <a href=\"#\" onClick=\"return mV('Jdg',20,18);\">20:18</a>; <a href=\"#\" onClick=\"return mV('1Sa',14,3,18);\">1Sa 14:3, 18</a>; <a href=\"#\" onClick=\"return mV('1Sa',23,9);\">23:9</a>; <a href=\"#\" onClick=\"return mV('2Sa',21,1);\">2Sa 21:1</a>. What the \"Urim and Thummim\" were cannot be determined with any certainty. All we certainly know is that they were a certain divinely-given means by which God imparted, through the high priest, direction and counsel to Israel when these were needed. The method by which this was done can be only a matter of mere conjecture. They were apparently material objects, quite distinct from the breastplate, but something added to it after all the stones had been set in it, something in addition to the breastplate and its jewels. They may have been, as some suppose, two small images, like the teraphim (<a href=\"#\" onClick=\"return mV('Jdg',17,5);\">Jdg 17:5</a>; <a href=\"#\" onClick=\"return mV('Jdg',18,14,17,20);\">18:14, 17, 20</a>; <a href=\"#\" onClick=\"return mV('Hsa',3,4);\">Hsa 3:4</a>), which were kept in the bag of the breastplate, by which, in some unknown way, the high priest could give forth his divinely imparted decision when consulted. They were probably lost at the destruction of the temple by Nebuchadnezzar. They were never seen after the return from captivity.";
eastonArray["$$T0003649"] = "<strong>Thunder:</strong> often referred to in Scripture (<a href=\"#\" onClick=\"return mV('Job',40,9);\">Job 40:9</a>; <a href=\"#\" onClick=\"return mV('Psa',77,18);\">Psa 77:18</a>; <a href=\"#\" onClick=\"return mV('Psa',104,7);\">104:7</a>). James and John were called by our Lord \"sons of thunder\" (<a href=\"#\" onClick=\"return mV('Mar',3,17);\">Mar 3:17</a>). In <a href=\"#\" onClick=\"return mV('Job',39,19);\">Job 39:19</a>, instead of \"thunder,\" as in the Authorized Version, the Revised Version translates (ra'amah) by \"quivering main\" (marg., \"shaking\"). Thunder accompanied the giving of the law at Sinai (<a href=\"#\" onClick=\"return mV('Exd',19,16);\">Exd 19:16</a>). It was regarded as the voice of God (<a href=\"#\" onClick=\"return mV('Job',37,2);\">Job 37:2</a>; <a href=\"#\" onClick=\"return mV('Psa',18,13);\">Psa 18:13</a>; <a href=\"#\" onClick=\"return mV('Psa',81,7);\">81:7</a>; <a href=\"#\" onClick=\"return mV('Jhn',12,29);\">Jhn 12:29</a>). In answer to Samuel's prayer (<a href=\"#\" onClick=\"return mV('1Sa',12,17,18);\">1Sa 12:17-18</a>), God sent thunder, and \"all the people greatly feared,\" for at such a season (the wheat-harvest) thunder and rain were almost unknown in Palestine.";
