eastonArray["$$T0002135"] = "<strong>Judgment hall:</strong> Gr. praitorion (<a href=\"#\" onClick=\"return mV('Jhn',18,28,33);\">Jhn 18:28,33</a>; <a href=\"#\" onClick=\"return mV('Jhn',19,9);\">19:9</a>; <a href=\"#\" onClick=\"return mV('Mat',27,27);\">Mat 27:27</a>), \"common hall.\" In all these passages the Revised Version renders \"palace.\" In <a href=\"#\" onClick=\"return mV('Mar',15,16);\">Mar 15:16</a> the word is rendered \"Praetorium\" (q.v.), which is a Latin word, meaning literally the residence of the praetor, and then the governor's residence in general, though not a praetor. Throughout the Gospels the word \"praitorion\" has this meaning (<a href=\"#\" onClick=\"return mV('Act',23,35);\">Act 23:35</a>). Pilate's official residence when he was in Jerusalem was probably a part of the fortress of Antonia.<br><br>The trial of our Lord was carried on in a room or office of the palace. The \"whole band\" spoken of by Mark were gathered together in the palace court.";
eastonArray["$$T0002136"] = "<strong>Judgment seat:</strong> (<a href=\"#\" onClick=\"return mV('Mat',27,19);\">Mat 27:19</a>), a portable tribunal (Gr. bema) which was placed according as the magistrate might direct, and from which judgment was pronounced. In this case it was placed on a tesselated pavement, probably in front of the procurator's residence. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001403');\">GABBATHA</a>.)";
eastonArray["$$T0002137"] = "<strong>Judgments of God:</strong><br><br>(1.) The secret decisions of God's will (<a href=\"#\" onClick=\"return mV('Psa',110,5);\">Psa 110:5</a>; <a href=\"#\" onClick=\"return mV('Psa',36,6);\">36:6</a>).<br><br>(2.) The revelations of his will (<a href=\"#\" onClick=\"return mV('Exd',21,1);\">Exd 21:1</a>; <a href=\"#\" onClick=\"return mV('Deu',6,20);\">Deu 6:20</a>; <a href=\"#\" onClick=\"return mV('Psa',119,'7-175');\">Psa 119:7-175</a>).<br><br>(3.) The infliction of punishment on the wicked (<a href=\"#\" onClick=\"return mV('Exd',6,6);\">Exd 6:6</a>; <a href=\"#\" onClick=\"return mV('Exd',12,12);\">12:12</a>; <a href=\"#\" onClick=\"return mV('Eze',25,11);\">Eze 25:11</a>; <a href=\"#\" onClick=\"return mV('Rev',16,7);\">Rev 16:7</a>), such as is mentioned in <a href=\"#\" onClick=\"return mV('Gen',7,'1-');\">Gen 7</a>; <a href=\"#\" onClick=\"return mV('Gen',19,24,25);\">19:24-25</a>; <a href=\"#\" onClick=\"return mV('Jdg',1,6,7);\">Jdg 1:6-7</a>; <a href=\"#\" onClick=\"return mV('Act',5,'1-10');\">Act 5:1-10</a>, etc.";
eastonArray["$$T0002138"] = "<strong>Judgment, The final:</strong> the sentence that will be passed on our actions at the last day (<a href=\"#\" onClick=\"return mV('Mat',25,'1-')\">Mat 25</a>; <a href=\"#\" onClick=\"return mV('Rom',14,10,11);\">Rom 14:10-11</a>; <a href=\"#\" onClick=\"return mV('2Cr',5,10);\">2Cr 5:10</a>; <a href=\"#\" onClick=\"return mV('2Th',1,'7-10');\">2Th 1:7-10</a>).<br><br>The judge is Jesus Christ, as mediator. All judgment is committed to him (<a href=\"#\" onClick=\"return mV('Act',17,31);\">Act 17:31</a>; <a href=\"#\" onClick=\"return mV('Jhn',5,22,27);\">Jhn 5:22, 27</a>; <a href=\"#\" onClick=\"return mV('Rev',1,7);\">Rev 1:7</a>). \"It pertains to him as mediator to complete and publicly manifest the salvation of his people and the overthrow of his enemies, together with the glorious righteousness of his work in both respects.\"<br><br>The persons to be judged are,<br><br>(1) the whole race of Adam without a single exception (<a href=\"#\" onClick=\"return mV('Mat',25,'31-46');\">Mat 25:31-46</a>; <a href=\"#\" onClick=\"return mV('1Cr',15,51,52);\">1Cr 15:51-52</a>; <a href=\"#\" onClick=\"return mV('Rev',20,'11-15');\">Rev 20:11-15</a>); and<br><br>(2) the fallen angels (<a href=\"#\" onClick=\"return mV('2Pe',2,4);\">2Pe 2:4</a>; <a href=\"#\" onClick=\"return mV('Jud',1,6);\">Jud 1:6</a>).<br><br>The rule of judgment is the standard of God's law as revealed to men, the heathen by the law as written on their hearts (<a href=\"#\" onClick=\"return mV('Luk',12,47,48);\">Luk 12:47-48</a>; <a href=\"#\" onClick=\"return mV('Rom',2,'12-16');\">Rom 2:12-16</a>); the Jew who \"sinned in the law shall be judged by the law\" (<a href=\"#\" onClick=\"return mV('Rom',2,12);\">Rom 2:12</a>); the Christian enjoying the light of revelation, by the will of God as made known to him (<a href=\"#\" onClick=\"return mV('Mat',11,'20-24');\">Mat 11:20-24</a>; <a href=\"#\" onClick=\"return mV('Jhn',3,19);\">Jhn 3:19</a>). Then the secrets of all hearts will be brought to light (<a href=\"#\" onClick=\"return mV('1Cr',4,5);\">1Cr 4:5</a>; <a href=\"#\" onClick=\"return mV('Luk',8,17);\">Luk 8:17</a>; <a href=\"#\" onClick=\"return mV('Luk',12,2,3);\">12:2-3</a>) to vindicate the justice of the sentence pronounced.<br><br>The time of the judgment will be after the resurrection (<a href=\"#\" onClick=\"return mV('Hbr',9,27);\">Hbr 9:27</a>; <a href=\"#\" onClick=\"return mV('Act',17,31);\">Act 17:31</a>).<br><br>As the Scriptures represent the final judgment \"as certain [ <a href=\"#\" onClick=\"return mV('Ecc',11,9);\">Ecc 11:9</a>], universal [ <a href=\"#\" onClick=\"return mV('2Cr',5,10);\">2Cr 5:10</a>], righteous [ <a href=\"#\" onClick=\"return mV('Rom',2,5);\">Rom 2:5</a>], decisive [ <a href=\"#\" onClick=\"return mV('1Cr',15,52);\">1Cr 15:52</a>], and eternal as to its consequences [ <a href=\"#\" onClick=\"return mV('Hbr',6,2);\">Hbr 6:2</a>], let us be concerned for the welfare of our immortal interests, flee to the refuge set before us, improve our precious time, depend on the merits of the Redeemer, and adhere to the dictates of the divine word, that we may be found of him in peace.\"";
eastonArray["$$T0002139"] = "<strong>Judith:</strong> Jewess, the daughter of Beeri the Hittite, and one of Esau's wives (<a href=\"#\" onClick=\"return mV('Gen',26,34);\">Gen 26:34</a>), elsewhere called Aholibamah (<a href=\"#\" onClick=\"return mV('Gen',36,'2-14');\">36:2-14</a>).";
eastonArray["$$T0002140"] = "<strong>Julia:</strong> a Christian woman at Rome to whom Paul sent his salutations (<a href=\"#\" onClick=\"return mV('Rom',16,15);\">Rom 16:15</a>), supposed to be the wife of Philologus.";
eastonArray["$$T0002141"] = "<strong>Julius:</strong> the centurion of the Augustan cohort, or the emperor's body-guard, in whose charge Paul was sent prisoner to Rome (<a href=\"#\" onClick=\"return mV('Act',27,1,3,43);\">Act 27:1, 3, 43</a>). He entreated Paul \"courteously,\" showing in many ways a friendly regard for him.";
eastonArray["$$T0002142"] = "<strong>Junia:</strong> (<a href=\"#\" onClick=\"return mV('Rom',16,7);\">Rom 16:7</a>), a Christian at Rome to whom Paul sends salutations along with Andronicus.";
eastonArray["$$T0002143"] = "<strong>Juniper:</strong> (Heb. rothem), called by the Arabs retem, and known as Spanish broom; ranked under the genus genista. It is a desert shrub, and abounds in many parts of Palestine. In the account of his journey from Akabah to Jerusalem, Dr. Robinson says: \"This is the largest and most conspicuous shrub of these deserts, growing thickly in the water-courses and valleys. Our Arabs always selected the place of encampment, if possible, in a spot where it grew, in order to be sheltered by it at night from the wind; and during the day, when they often went on in advance of the camels, we found them not unfrequently sitting or sleeping under a bush of retem to shelter them from the sun. It was in this very desert, a day's journey from Beersheba, that the prophet Elijah lay down and slept beneath the same shrub\" (<a href=\"#\" onClick=\"return mV('1Ki',19,4,5);\">1Ki 19:4-5</a>). It afforded material for fuel, and also in cases of extremity for human food (<a href=\"#\" onClick=\"return mV('Psa',120,4);\">Psa 120:4</a>; <a href=\"#\" onClick=\"return mV('Job',30,4);\">Job 30:4</a>). One of the encampments in the wilderness of Paran is called Rithmah, i.e., \"place of broom\" (<a href=\"#\" onClick=\"return mV('Num',33,18);\">Num 33:18</a>).<br><br>\"The Bedawin of Sinai still burn this very plant into a charcoal which throws out the most intense heat.\"";
eastonArray["$$T0002144"] = "<strong>Jupiter:</strong> the principal deity of the ancient Greeks and Romans. He was worshipped by them under various epithets. Barnabas was identified with this god by the Lycaonians (<a href=\"#\" onClick=\"return mV('Act',14,12);\">Act 14:12</a>), because he was of stately and commanding presence, as they supposed Jupiter to be. There was a temple dedicated to this god outside the gates of Lystra (<a href=\"#\" onClick=\"return mV('Act',14,13);\">14:13</a>).";
eastonArray["$$T0002145"] = "<strong>Justice:</strong> is rendering to every one that which is his due. It has been distinguished from equity in this respect, that while justice means merely the doing what positive law demands, equity means the doing of what is fair and right in every separate case.";
eastonArray["$$T0002146"] = "<strong>Justice of God:</strong> that perfection of his nature whereby he is infinitely righteous in himself and in all he does, the righteousness of the divine nature exercised in his moral government. At first God imposes righteous laws on his creatures and executes them righteously. Justice is not an optional product of his will, but an unchangeable principle of his very nature. His legislative justice is his requiring of his rational creatures conformity in all respects to the moral law. His rectoral or distributive justice is his dealing with his accountable creatures according to the requirements of the law in rewarding or punishing them (<a href=\"#\" onClick=\"return mV('Psa',89,14);\">Psa 89:14</a>). In remunerative justice he distributes rewards (<a href=\"#\" onClick=\"return mV('Jam',1,12);\">Jam 1:12</a>; <a href=\"#\" onClick=\"return mV('2Ti',4,8);\">2Ti 4:8</a>); in vindictive or punitive justice he inflicts punishment on account of transgression (<a href=\"#\" onClick=\"return mV('2Th',1,6);\">2Th 1:6</a>). He cannot, as being infinitely righteous, do otherwise than regard and hate sin as intrinsically hateful and deserving of punishment. \"He cannot deny himself\" (<a href=\"#\" onClick=\"return mV('2Ti',2,13);\">2Ti 2:13</a>). His essential and eternal righteousness immutably determines him to visit every sin as such with merited punishment.";
eastonArray["$$T0002147"] = "<strong>Justification:</strong> a forensic term, opposed to condemnation. As regards its nature, it is the judicial act of God, by which he pardons all the sins of those who believe in Christ, and accounts, accepts, and treats them as righteous in the eye of the law, i.e., as conformed to all its demands. In addition to the pardon (q.v.) of sin, justification declares that all the claims of the law are satisfied in respect of the justified. It is the act of a judge and not of a sovereign. The law is not relaxed or set aside, but is declared to be fulfilled in the strictest sense; and so the person justified is declared to be entitled to all the advantages and rewards arising from perfect obedience to the law (<a href=\"#\" onClick=\"return mV('Rom',5,'1-10');\">Rom 5:1-10</a>).<br><br>It proceeds on the imputing or crediting to the believer by God himself of the perfect righteousness, active and passive, of his Representative and Surety, Jesus Christ (<a href=\"#\" onClick=\"return mV('Rom',10,'3-9');\">Rom 10:3-9</a>). Justification is not the forgiveness of a man without righteousness, but a declaration that he possesses a righteousness which perfectly and for ever satisfies the law, namely, Christ's righteousness (<a href=\"#\" onClick=\"return mV('2Cr',5,21);\">2Cr 5:21</a>; <a href=\"#\" onClick=\"return mV('Rom',4,'6-8');\">Rom 4:6-8</a>).<br><br>The sole condition on which this righteousness is imputed or credited to the believer is faith in or on the Lord Jesus Christ. Faith is called a \"condition,\" not because it possesses any merit, but only because it is the instrument, the only instrument by which the soul appropriates or apprehends Christ and his righteousness (<a href=\"#\" onClick=\"return mV('Rom',1,17);\">Rom 1:17</a>; <a href=\"#\" onClick=\"return mV('Rom',3,25,26);\">3:25-26</a>; <a href=\"#\" onClick=\"return mV('Rom',4,20,22);\">4:20, 22</a>; <a href=\"#\" onClick=\"return mV('Phl',3,'8-11');\">Phl 3:8-11</a>; <a href=\"#\" onClick=\"return mV('Gal',2,16);\">Gal 2:16</a>).<br><br>The act of faith which thus secures our justification secures also at the same time our sanctification (q.v.); and thus the doctrine of justification by faith does not lead to licentiousness (<a href=\"#\" onClick=\"return mV('Rom',6,'2-7');\">Rom 6:2-7</a>). Good works, while not the ground, are the certain consequence of justification (<a href=\"#\" onClick=\"return mV('Rom',6,14);\">6:14</a>; <a href=\"#\" onClick=\"return mV('Rom',7,6);\">7:6</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001413');\">GALATIANS, EPISTLE TO</a>.)";
eastonArray["$$T0002148"] = "<strong>Justus:</strong><br><br>(1.) Another name for Joseph, surnamed Barsabas. He and Matthias are mentioned only in <a href=\"#\" onClick=\"return mV('Act',1,23);\">Act 1:23</a>. \"They must have been among the earliest disciples of Jesus, and must have been faithful to the end; they must have been well known and esteemed among the brethren. What became of them afterwards, and what work they did, are entirely unknown\" (Lindsay's Acts of the Apostles).<br><br>(2.) A Jewish proselyte at Corinth, in whose house, next door to the synagogue, Paul held meetings and preached after he left the synagogue (<a href=\"#\" onClick=\"return mV('Act',18,7);\">Act 18:7</a>).<br><br>(3.) A Jewish Christian, called Jesus, Paul's only fellow-labourer at Rome, where he wrote his Epistle to the Colossians (<a href=\"#\" onClick=\"return mV('Col',4,11);\">Col 4:11</a>).";
eastonArray["$$T0002149"] = "<strong>Juttah:</strong> extended, a Levitical city in the mountains or hill-country of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,55);\">Jos 15:55</a>; <a href=\"#\" onClick=\"return mV('Jos',21,16);\">21:16</a>). Its modern name is Yutta, a place about 5 1/2 miles south of Hebron. It is supposed to have been the residence of Zacharias and Elisabeth, and the birthplace of John the Baptist, and on this account is annually visited by thousands of pilgrims belonging to the Greek Church (<a href=\"#\" onClick=\"return mV('Luk',1,39);\">Luk 1:39</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002428');\">MARY</a>.)";
</script>
