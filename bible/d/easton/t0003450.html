<script>
var eastonArray = new Array ();
eastonArray["$$T0003450"] = "<strong>Sirah:</strong> retiring, a well from which Joab's messenger brought back Abner (<a href=\"#\" onClick=\"return mV('2Sa',3,26);\">2Sa 3:26</a>). It is now called 'Ain Sarah, and is situated about a mile from Hebron, on the road to the north.";
eastonArray["$$T0003451"] = "<strong>Sirion:</strong> a breastplate, the Sidonian name of Hermon (q.v.), <a href=\"#\" onClick=\"return mV('Deu',3,9);\">Deu 3:9</a>; <a href=\"#\" onClick=\"return mV('Psa',29,6);\">Psa 29:6</a>.";
eastonArray["$$T0003452"] = "<strong>Sisera:</strong> (Egypt. Ses-Ra, \"servant of Ra\").<br><br>(1.) The captain of Jabin's army (<a href=\"#\" onClick=\"return mV('Jdg',4,2);\">Jdg 4:2</a>), which was routed and destroyed by the army of Barak on the plain of Esdraelon. After all was lost he fled to the settlement of Heber the Kenite in the plain of Zaanaim. Jael, Heber's wife, received him into her tent with apparent hospitality, and \"gave him butter\" (i.e., lebben, or curdled milk) \"in a lordly dish.\" Having drunk the refreshing beverage, he lay down, and soon sank into the sleep of the weary. While he lay asleep Jael crept stealthily up to him, and taking in her hand one of the tent pegs, with a mallet she drove it with such force through his temples that it entered into the ground where he lay, and \"at her feet he bowed, he fell; where he bowed, there he fell down dead.\" The part of Deborah's song (<a href=\"#\" onClick=\"return mV('Jdg',5,'24-27');\">Jdg 5:24-27</a>) referring to the death of Sisera [which is a \"mere patriotic outburst,\" and \"is no proof that purer eyes would have failed to see gross sin mingling with Jael's service to Israel\"] is thus rendered by Professor Roberts (Old Testament Revision):<br><br>\"Extolled above women be Jael, The wife of Heber the Kenite, Extolled above women in the tent. He asked for water, she gave him milk; She brought him cream in a lordly dish. She stretched forth her hand to the nail, Her right hand to the workman's hammer, And she smote Sisera; she crushed his head, She crashed through and transfixed his temples. At her feet he curled himself, he fell, he lay still; At her feet he curled himself, he fell; And where he curled himself, there he fell dead.\"<br><br>(2.) The ancestor of some of the Nethinim who returned with Zerubbabel (<a href=\"#\" onClick=\"return mV('Ezr',2,53);\">Ezr 2:53</a>; <a href=\"#\" onClick=\"return mV('Neh',7,55);\">Neh 7:55</a>).";
eastonArray["$$T0003453"] = "<strong>Sitnah:</strong> strife, the second of the two wells dug by Isaac, whose servants here contended with the Philistines (<a href=\"#\" onClick=\"return mV('Gen',26,21);\">Gen 26:21</a>). It has been identified with the modern Shutneh, in the valley of Gerar, to the west of Rehoboth, about 20 miles south of Beersheba.";
eastonArray["$$T0003454"] = "<strong>Sitting:</strong> the attitude generally assumed in Palestine by those who were engaged in any kind of work. \"The carpenter saws, planes, and hews with his hand-adze, sitting on the ground or upon the plank he is planning. The washerwoman sits by the tub; and, in a word, no one stands when it is possible to sit. Shopkeepers always sit, and Levi sitting at the receipt of custom (<a href=\"#\" onClick=\"return mV('Mat',9,9);\">Mat 9:9</a>) is the exact way to state the case.\", Thomson, Land and Book.";
eastonArray["$$T0003455"] = "<strong>Sivan:</strong> a Persian word (Assyr, sivanu, \"bricks\"), used after the Captivity as the name of the third month of the Jewish year, extending from the new moon in June to the new moon in July (<a href=\"#\" onClick=\"return mV('Est',8,9);\">Est 8:9</a>).";
eastonArray["$$T0003456"] = "<strong>Skin, Coats made of:</strong> (<a href=\"#\" onClick=\"return mV('Gen',3,21);\">Gen 3:21</a>). Skins of rams and badgers were used as a covering for the tabernacle (<a href=\"#\" onClick=\"return mV('Exd',25,5);\">Exd 25:5</a>; <a href=\"#\" onClick=\"return mV('Num',4,'8-14');\">Num 4:8-14</a>).";
eastonArray["$$T0003457"] = "<strong>Skull, The place of a:</strong> See <a href=\"#\" onClick=\"return doDictLookup ('ET0001522');\">GOLGOTHA</a>.";
eastonArray["$$T0003458"] = "<strong>Slave:</strong> <a href=\"#\" onClick=\"return mV('Jer',2,14);\">Jer 2:14</a> (A.V.), but not there found in the original. In <a href=\"#\" onClick=\"return mV('Rev',18,13);\">Rev 18:13</a> the word \"slaves\" is the rendering of a Greek word meaning \"bodies.\" The Hebrew and Greek words for slave are usually rendered simply \"servant,\" \"bondman,\" or \"bondservant.\" Slavery as it existed under the Mosaic law has no modern parallel. That law did not originate but only regulated the already existing custom of slavery (<a href=\"#\" onClick=\"return mV('Exd',21,20,21,26,27);\">Exd 21:20-21, 26-27</a>; <a href=\"#\" onClick=\"return mV('Lev',25,'44-46');\">Lev 25:44-46</a>; <a href=\"#\" onClick=\"return mV('Jos',9,'6-27');\">Jos 9:6-27</a>). The gospel in its spirit and genius is hostile to slavery in every form, which under its influence is gradually disappearing from among men.";
eastonArray["$$T0003459"] = "<strong>Slime:</strong> (<a href=\"#\" onClick=\"return mV('Gen',11,3);\">Gen 11:3</a>; LXX., \"asphalt; \" R.V. marg., \"bitumen\"). The vale of Siddim was full of slime pits (<a href=\"#\" onClick=\"return mV('Gen',14,10);\">14:10</a>). Jochebed daubed the \"ark of bulrushes\" with slime (<a href=\"#\" onClick=\"return mV('Exd',2,3);\">Exd 2:3</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002966');\">PITCH</a>.)";
eastonArray["$$T0003460"] = "<strong>Sling:</strong> With a sling and a stone David smote the Philistine giant (<a href=\"#\" onClick=\"return mV('1Sa',17,40,49);\">1Sa 17:40, 49</a>). There were 700 Benjamites who were so skilled in its use that with the left hand they \"could sling stones at a hair breadth, and not miss\" (<a href=\"#\" onClick=\"return mV('Jdg',20,16);\">Jdg 20:16</a>; <a href=\"#\" onClick=\"return mV('1Ch',12,2);\">1Ch 12:2</a>). It was used by the Israelites in war (<a href=\"#\" onClick=\"return mV('2Ki',3,25);\">2Ki 3:25</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000315');\">ARMS</a>.)<br><br>The words in <a href=\"#\" onClick=\"return mV('Pro',26,8);\">Pro 26:8</a>, \"As he that bindeth a stone in a sling,\" etc. (Authorized Version), should rather, as in the Revised Version, be \"As a bag of gems in a heap of stones,\" etc.";
eastonArray["$$T0003461"] = "<strong>Smith:</strong> The Hebrews were not permitted by the Philistines in the days of Samuel to have a smith amongst them, lest they should make them swords and spears (<a href=\"#\" onClick=\"return mV('1Sa',13,19);\">1Sa 13:19</a>). Thus the Philistines sought to make their conquest permanent (<a href=\"#\" onClick=\"return mV('2Ki',24,16);\">2Ki 24:16</a>).";
eastonArray["$$T0003462"] = "<strong>Smyrna:</strong> myrrh, an ancient city of Ionia, on the western coast of Asia Minor, about 40 miles to the north of Ephesus. It is now the chief city of Anatolia, having a mixed population of about 200,000, of whom about one-third are professed Christians. The church founded here was one of the seven addressed by our Lord (<a href=\"#\" onClick=\"return mV('Rev',2,'8-11');\">Rev 2:8-11</a>). The celebrated Polycarp, a pupil of the apostle John, was in the second century a prominent leader in the church of Smyrna. Here he suffered martyrdom, A.D. 155.";
eastonArray["$$T0003463"] = "<strong>Snail:</strong><br><br>(1.) Heb. homit, among the unclean creeping things (<a href=\"#\" onClick=\"return mV('Lev',11,30);\">Lev 11:30</a>). This was probably the sand-lizard, of which there are many species in the wilderness of Judea and the Sinai peninsula.<br><br>(2.) Heb. shablul (<a href=\"#\" onClick=\"return mV('Psa',58,8);\">Psa 58:8</a>), the snail or slug proper. Tristram explains the allusions of this passage by a reference to the heat and drought by which the moisture of the snail is evaporated. \"We find,\" he says, \"in all parts of the Holy Land myriads of snail-shells in fissures still adhering by the calcareous exudation round their orifice to the surface of the rock, but the animal of which is utterly shrivelled and wasted, 'melted away.'\"";
eastonArray["$$T0003464"] = "<strong>Snare:</strong> The expression (<a href=\"#\" onClick=\"return mV('Amo',3,5);\">Amo 3:5</a>), \"Shall one take up a snare from the earth?\" etc. (Authorized Version), ought to be, as in the Revised Version, \"Shall a snare spring up from the ground?\" etc. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0001492');\">GIN</a>.)";
eastonArray["$$T0003465"] = "<strong>Snow:</strong> Common in Palestine in winter (<a href=\"#\" onClick=\"return mV('Psa',147,16);\">Psa 147:16</a>). The snow on the tops of the Lebanon range is almost always within view throughout the whole year. The word is frequently used figuratively by the sacred writers (<a href=\"#\" onClick=\"return mV('Job',24,19);\">Job 24:19</a>; <a href=\"#\" onClick=\"return mV('Psa',51,7);\">Psa 51:7</a>; <a href=\"#\" onClick=\"return mV('Psa',68,14);\">68:14</a>; <a href=\"#\" onClick=\"return mV('Isa',1,18);\">Isa 1:18</a>). It is mentioned only once in the historical books (<a href=\"#\" onClick=\"return mV('2Sa',23,20);\">2Sa 23:20</a>). It was \"carried to Tyre, Sidon, and Damascus as a luxury, and labourers sweltering in the hot harvest-fields used it for the purpose of cooling the water which they drank (<a href=\"#\" onClick=\"return mV('Pro',25,13);\">Pro 25:13</a>; <a href=\"#\" onClick=\"return mV('Jer',18,14);\">Jer 18:14</a>). No doubt Herod Antipas, at his feasts in Tiberias, enjoyed also from this very source the modern luxury of ice-water.\"";
eastonArray["$$T0003466"] = "<strong>So:</strong> (Nubian, Sabako), an Ethiopian king who brought Egypt under his sway. He was bribed by Hoshea to help him against the Assyrian monarch Shalmaneser (<a href=\"#\" onClick=\"return mV('2Ki',17,4);\">2Ki 17:4</a>). This was a return to the policy that had been successful in the reign of Jeroboam I.";
eastonArray["$$T0003467"] = "<strong>Soap:</strong> (<a href=\"#\" onClick=\"return mV('Jer',2,22);\">Jer 2:22</a>; <a href=\"#\" onClick=\"return mV('Mal',3,2);\">Mal 3:2</a>; Heb. borith), properly a vegetable alkali, obtained from the ashes of certain plants, particularly the <i>salsola kali</i> (saltwort), which abounds on the shores of the Dead Sea and of the Mediterranean. It does not appear that the Hebrews were acquainted with what is now called \"soap,\" which is a compound of alkaline carbonates with oleaginous matter. The word \"purely\" in <a href=\"#\" onClick=\"return mV('Isa',1,25);\">Isa 1:25</a> (R.V., \"throughly; \" marg., \"as with lye\") is lit. \"as with <i>bor</i>.\" This word means \"clearness,\" and hence also that which makes clear, or pure, alkali. \"The ancients made use of alkali mingled with oil, instead of soap (<a href=\"#\" onClick=\"return mV('Job',9,30);\">Job 9:30</a>), and also in smelting metals, to make them melt and flow more readily and purely\" (Gesenius).";
eastonArray["$$T0003468"] = "<strong>Socho:</strong> a fence; hedge, (<a href=\"#\" onClick=\"return mV('1Ch',4,18);\">1Ch 4:18</a>; R.V., Soco)=So'choh (<a href=\"#\" onClick=\"return mV('1Ki',4,10);\">1Ki 4:10</a>; R.V., Socoh), Sho'choh (<a href=\"#\" onClick=\"return mV('1Sa',17,1);\">1Sa 17:1</a>; R.V., Socoh), Sho'co (<a href=\"#\" onClick=\"return mV('2Ch',11,7);\">2Ch 11:7</a>; R.V., Soco), Sho'cho (<a href=\"#\" onClick=\"return mV('2Ch',28,18);\">2Ch 28:18</a>; R.V., Soco), a city in the plain or lowland of Judah, where the Philistines encamped when they invaded Judah after their defeat at Michmash. It lay on the northern side of the valley of Elah (Wady es-Sunt). It has been identified with the modern Khurbet Shuweikeh, about 14 miles south-west of Jerusalem. In this campaign Goliath was slain, and the Philistines were completely routed.";
eastonArray["$$T0003469"] = "<strong>Sodom:</strong> burning; the walled, a city in the vale of Siddim (<a href=\"#\" onClick=\"return mV('Gen',13,10);\">Gen 13:10</a>; <a href=\"#\" onClick=\"return mV('Gen',14,'1-16');\">14:1-16</a>). The wickedness of its inhabitants brought down upon it fire from heaven, by which it was destroyed (<a href=\"#\" onClick=\"return mV('Gen',18,'16-33');\">18:16-33</a>; <a href=\"#\" onClick=\"return mV('Gen',19,'1-29');\">19:1</a>; <a href=\"#\" onClick=\"return mV('Deu',23,17);\">Deu 23:17</a>). This city and its awful destruction are frequently alluded to in Scripture (<a href=\"#\" onClick=\"return mV('Deu',29,23);\">Deu 29:23</a>; <a href=\"#\" onClick=\"return mV('Deu',32,32);\">32:32</a>; <a href=\"#\" onClick=\"return mV('Isa',1,9,10);\">Isa 1:9-10</a>; <a href=\"#\" onClick=\"return mV('Isa',3,9);\">3:9</a>; <a href=\"#\" onClick=\"return mV('Isa',13,19);\">13:19</a>; <a href=\"#\" onClick=\"return mV('Jer',23,14);\">Jer 23:14</a>; <a href=\"#\" onClick=\"return mV('Eze',16,'46-56');\">Eze 16:46-56</a>; <a href=\"#\" onClick=\"return mV('Zep',2,9);\">Zep 2:9</a>; <a href=\"#\" onClick=\"return mV('Mat',10,15);\">Mat 10:15</a>; <a href=\"#\" onClick=\"return mV('Rom',9,29);\">Rom 9:29</a>; <a href=\"#\" onClick=\"return mV('2Pe',2,6);\">2Pe 2:6</a>, etc.). No trace of it or of the other cities of the plain has been discovered, so complete was their destruction. Just opposite the site of Zoar, on the south-west coast of the Dead Sea, is a range of low hills, forming a mass of mineral salt called Jebel Usdum, \"the hill of Sodom.\" It has been concluded, from this and from other considerations, that the cities of the plain stood at the southern end of the Dead Sea. Others, however, with much greater probability, contend that they stood at the northern end of the sea. [in 1897].";
eastonArray["$$T0003470"] = "<strong>Sodoma:</strong> (<a href=\"#\" onClick=\"return mV('Rom',9,29);\">Rom 9:29</a>; R.V., \"Sodom\"), the Greek form for Sodom.";
eastonArray["$$T0003471"] = "<strong>Sodomites:</strong> those who imitated the licentious wickedness of Sodom (<a href=\"#\" onClick=\"return mV('Deu',23,17);\">Deu 23:17</a>; <a href=\"#\" onClick=\"return mV('1Ki',14,24);\">1Ki 14:24</a>; <a href=\"#\" onClick=\"return mV('Rom',1,26,27);\">Rom 1:26-27</a>). Asa destroyed them \"out of the land\" (<a href=\"#\" onClick=\"return mV('1Ki',15,12);\">1Ki 15:12</a>), as did also his son Jehoshaphat (<a href=\"#\" onClick=\"return mV('1Ki',22,46);\">22:46</a>).";
eastonArray["$$T0003472"] = "<strong>Solemn meeting:</strong> (<a href=\"#\" onClick=\"return mV('Isa',1,13);\">Isa 1:13</a>), the convocation on the eighth day of the Feast of Tabernacles (<a href=\"#\" onClick=\"return mV('Lev',23,36);\">Lev 23:36</a>; <a href=\"#\" onClick=\"return mV('Num',29,35);\">Num 29:35</a>, R.V., \"solemn assembly; \" marg., \"closing festival\"). It is the name given also to the convocation held on the seventh day of the Passover (<a href=\"#\" onClick=\"return mV('Deu',16,8);\">Deu 16:8</a>).";
eastonArray["$$T0003473"] = "<strong>Solomon:</strong> peaceful, (Heb. Shelomoh), David's second son by Bathsheba, i.e., the first after their legal marriage (<a href=\"#\" onClick=\"return mV('2Sa',12,'1-')\">2Sa 12</a>). He was probably born about B.C. 1035 (<a href=\"#\" onClick=\"return mV('1Ch',22,5);\">1Ch 22:5</a>; <a href=\"#\" onClick=\"return mV('1Ch',29,1);\">29:1</a>). He succeeded his father on the throne in early manhood, probably about sixteen or eighteen years of age. Nathan, to whom his education was intrusted, called him Jedidiah, i.e., \"beloved of the Lord\" (<a href=\"#\" onClick=\"return mV('2Sa',12,24,25);\">2Sa 12:24-25</a>). He was the first king of Israel \"born in the purple.\" His father chose him as his successor, passing over the claims of his elder sons: \"Assuredly Solomon my son shall reign after me.\" His history is recorded in 1 Kings 1-11 and 2 Chr. 1-9. His elevation to the throne took place before his father's death, and was hastened on mainly by Nathan and Bathsheba, in consequence of the rebellion of Adonijah (<a href=\"#\" onClick=\"return mV('1Ki',1,'5-40');\">1Ki 1:5-40</a>). During his long reign of forty years the Hebrew monarchy gained its highest splendour. This period has well been called the \"Augustan age\" of the Jewish annals. The first half of his reign was, however, by far the brighter and more prosperous; the latter half was clouded by the idolatries into which he fell, mainly from his heathen intermarriages (<a href=\"#\" onClick=\"return mV('1Ki',11,'1-8');\">1Ki 11:1-8</a>; <a href=\"#\" onClick=\"return mV('1Ki',14,21,31);\">14:21, 31</a>).<br><br>Before his death David gave parting instructions to his son (<a href=\"#\" onClick=\"return mV('1Ki',2,'1-9');\">1Ki 2:1-9</a>; <a href=\"#\" onClick=\"return mV('1Ch',22,'7-16');\">1Ch 22:7-16</a>; <a href=\"#\" onClick=\"return mV('1Ch',28,'1-');\">28</a>). As soon as he had settled himself in his kingdom, and arranged the affairs of his extensive empire, he entered into an alliance with Egypt by the marriage of the daughter of Pharaoh (<a href=\"#\" onClick=\"return mV('1Ki',3,1);\">1Ki 3:1</a>), of whom, however, nothing further is recorded. He surrounded himself with all the luxuries and the external grandeur of an Eastern monarch, and his government prospered. He entered into an alliance with Hiram, king of Tyre, who in many ways greatly assisted him in his numerous undertakings. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0001791');\">HIRAM</a>.)<br><br>For some years before his death David was engaged in the active work of collecting materials (<a href=\"#\" onClick=\"return mV('1Ch',29,'6-9');\">1Ch 29:6-9</a>; <a href=\"#\" onClick=\"return mV('2Ch',2,'3-7');\">2Ch 2:3-7</a>) for building a temple in Jerusalem as a permanent abode for the ark of the covenant. He was not permitted to build the house of God (<a href=\"#\" onClick=\"return mV('1Ch',22,8);\">1Ch 22:8</a>); that honour was reserved to his son Solomon. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003610');\">TEMPLE</a>.)<br><br>After the completion of the temple, Solomon engaged in the erection of many other buildings of importance in Jerusalem and in other parts of his kingdom. For the long space of thirteen years he was engaged in the erection of a royal palace on Ophel (<a href=\"#\" onClick=\"return mV('1Ki',7,'1-12');\">1Ki 7:1-12</a>). It was 100 cubits long, 50 broad, and 30 high. Its lofty roof was supported by forty-five cedar pillars, so that the hall was like a forest of cedar wood, and hence probably it received the name of \"The House of the Forest of Lebanon.\" In front of this \"house\" was another building, which was called the Porch of Pillars, and in front of this again was the \"Hall of Judgment,\" or Throne-room (<a href=\"#\" onClick=\"return mV('1Ki',7,7);\">1Ki 7:7</a>; <a href=\"#\" onClick=\"return mV('1Ki',10,'18-20');\">10:18-20</a>; <a href=\"#\" onClick=\"return mV('2Ch',9,'17-19');\">2Ch 9:17-19</a>), \"the King's Gate,\" where he administered justice and gave audience to his people. This palace was a building of great magnificence and beauty. A portion of it was set apart as the residence of the queen consort, the daughter of Pharaoh. From the palace there was a private staircase of red and scented sandal wood which led up to the temple.<br><br>Solomon also constructed great works for the purpose of securing a plentiful supply of water for the city (<a href=\"#\" onClick=\"return mV('Ecc',2,'4-6');\">Ecc 2:4-6</a>). He then built Millo (LXX., \"Acra\") for the defence of the city, completing a line of ramparts around it (<a href=\"#\" onClick=\"return mV('1Ki',9,15,24);\">1Ki 9:15, 24</a>; <a href=\"#\" onClick=\"return mV('1Ki',11,27);\">11:27</a>). He erected also many other fortifications for the defence of his kingdom at various points where it was exposed to the assault of enemies (<a href=\"#\" onClick=\"return mV('1Ki',9,'15-19');\">1Ki 9:15-19</a>; <a href=\"#\" onClick=\"return mV('2Ch',8,'2-6');\">2Ch 8:2-6</a>). Among his great undertakings must also be mentioned the building of Tadmor (q.v.) in the wilderness as a commercial depot, as well as a military outpost.<br><br>During his reign Palestine enjoyed great commercial prosperity. Extensive traffic was carried on by land with Tyre and Egypt and Arabia, and by sea with Spain and India and the coasts of Africa, by which Solomon accumulated vast stores of wealth and of the produce of all nations (<a href=\"#\" onClick=\"return mV('1Ki',9,'26-28');\">1Ki 9:26-28</a>; <a href=\"#\" onClick=\"return mV('1Ki',10,11,12);\">10:11-12</a>; <a href=\"#\" onClick=\"return mV('2Ch',8,17,18);\">2Ch 8:17-18</a>; <a href=\"#\" onClick=\"return mV('2Ch',9,21);\">9:21</a>). This was the \"golden age\" of Israel. The royal magnificence and splendour of Solomon's court were unrivalled. He had seven hundred wives and three hundred concubines, an evidence at once of his pride, his wealth, and his sensuality. The maintenance of his household involved immense expenditure. The provision required for one day was \"thirty measures of fine flour, and threescore measures of meal, ten fat oxen, and twenty oxen out of the pastures, and an hundred sheep, beside harts, and roebucks, and fallow-deer, and fatted fowl\" (<a href=\"#\" onClick=\"return mV('1Ki',4,22,23);\">1Ki 4:22-23</a>).<br><br>Solomon's reign was not only a period of great material prosperity, but was equally remarkable for its intellectual activity. He was the leader of his people also in this uprising amongst them of new intellectual life. \"He spake three thousand proverbs: and his songs were a thousand and five. And he spake of trees, from the cedar tree that is in Lebanon even unto the hyssop that springeth out of the wall: he spake also of beasts, and of fowl, and of creeping things, and of fishes\" (<a href=\"#\" onClick=\"return mV('1Ki',4,32,33);\">1Ki 4:32-33</a>).<br><br>His fame was spread abroad through all lands, and men came from far and near \"to hear the wisdom of Solomon.\" Among others thus attracted to Jerusalem was \"the queen of the south\" (<a href=\"#\" onClick=\"return mV('Mat',12,42);\">Mat 12:42</a>), the queen of Sheba, a country in Arabia Felix. \"Deep, indeed, must have been her yearning, and great his fame, which induced a secluded Arabian queen to break through the immemorial custom of her dreamy land, and to put forth the energy required for braving the burdens and perils of so long a journey across a wilderness. Yet this she undertook, and carried it out with safety.\" (<a href=\"#\" onClick=\"return mV('1Ki',10,'1-13');\">1Ki 10:1-13</a>; <a href=\"#\" onClick=\"return mV('2Ch',9,'1-12');\">2Ch 9:1-12</a>.) She was filled with amazement by all she saw and heard: \"there was no more spirit in her.\" After an interchange of presents she returned to her native land.<br><br>But that golden age of Jewish history passed away. The bright day of Solomon's glory ended in clouds and darkness. His decline and fall from his high estate is a sad record. Chief among the causes of his decline were his polygamy and his great wealth. \"As he grew older he spent more of his time among his favourites. The idle king living among these idle women, for 1,000 women, with all their idle and mischievous attendants, filled the palaces and pleasure-houses which he had built (<a href=\"#\" onClick=\"return mV('1Ki',11,3);\">1Ki 11:3</a>), learned first to tolerate and then to imitate their heathenish ways. He did not, indeed, cease to believe in the God of Israel with his mind. He did not cease to offer the usual sacrifices in the temple at the great feasts. But his heart was not right with God; his worship became merely formal; his soul, left empty by the dying out of true religious fervour, sought to be filled with any religious excitement which offered itself. Now for the first time a worship was publicly set up amongst the people of the Lord which was not simply irregular or forbidden, like that of Gideon (<a href=\"#\" onClick=\"return mV('Jdg',8,27);\">Jdg 8:27</a>), or the Danites (<a href=\"#\" onClick=\"return mV('Jdg',18,30,31);\">Jdg 18:30-31</a>), but was downright idolatrous.\" (<a href=\"#\" onClick=\"return mV('1Ki',11,7);\">1Ki 11:7</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,13);\">2Ki 23:13</a>.)<br><br>This brought upon him the divine displeasure. His enemies prevailed against him (<a href=\"#\" onClick=\"return mV('1Ki',11,'14-40');\">1Ki 11:14-40</a>), and one judgment after another fell upon the land. And now the end of all came, and he died, after a reign of forty years, and was buried in the city of David, and \"with him was buried the short-lived glory and unity of Israel.\" \"He leaves behind him but one weak and worthless son, to dismember his kingdom and disgrace his name.\"<br><br>\"The kingdom of Solomon,\" says Rawlinson, \"is one of the most striking facts in the Biblical history. A petty nation, which for hundreds of years has with difficulty maintained a separate existence in the midst of warlike tribes, each of which has in turn exercised dominion over it and oppressed it, is suddenly raised by the genius of a soldier-monarch to glory and greatness. An empire is established which extends from the Euphrates to the borders of Egypt, a distance of 450 miles; and this empire, rapidly constructed, enters almost immediately on a period of peace which lasts for half a century. Wealth, grandeur, architectural magnificence, artistic excellence, commercial enterprise, a position of dignity among the great nations of the earth, are enjoyed during this space, at the end of which there is a sudden collapse. The ruling nation is split in twain, the subject-races fall off, the pre-eminence lately gained being wholly lost, the scene of struggle, strife, oppression, recovery, inglorious submission, and desperate effort, re-commences.\", Historical Illustrations.";
eastonArray["$$T0003474"] = "<strong>Solomon, Song of:</strong> called also, after the Vulgate, the \"Canticles.\" It is the \"song of songs\" (<a href=\"#\" onClick=\"return mV('Sgs',1,1);\">Sgs 1:1</a>), as being the finest and most precious of its kind; the noblest song, \"das Hohelied,\" as Luther calls it. The Solomonic authorship of this book has been called in question, but evidences, both internal and external, fairly establish the traditional view that it is the product of Solomon's pen. It is an allegorical poem setting forth the mutual love of Christ and the Church, under the emblem of the bridegroom and the bride. (Compare <a href=\"#\" onClick=\"return mV('Mat',9,15);\">Mat 9:15</a>; <a href=\"#\" onClick=\"return mV('Jhn',3,29);\">Jhn 3:29</a>; <a href=\"#\" onClick=\"return mV('Eph',5,23,27,29);\">Eph 5:23, 27, 29</a>; <a href=\"#\" onClick=\"return mV('Rev',19,'7-9');\">Rev 19:7-9</a>; <a href=\"#\" onClick=\"return mV('Rev',21,2,9);\">21:2, 9</a>; <a href=\"#\" onClick=\"return mV('Rev',22,17);\">22:17</a>. Compare also <a href=\"#\" onClick=\"return mV('Psa',45,'1-');\">Psa 45</a>; <a href=\"#\" onClick=\"return mV('Isa',54,'4-6');\">Isa 54:4-6</a>; <a href=\"#\" onClick=\"return mV('Isa',62,4,5);\">62:4-5</a>; <a href=\"#\" onClick=\"return mV('Jer',2,2);\">Jer 2:2</a>; <a href=\"#\" onClick=\"return mV('Jer',3,1,20);\">3:1, 20</a>; <a href=\"#\" onClick=\"return mV('Eze',16,'1-')\">Eze 16</a>; <a href=\"#\" onClick=\"return mV('Hsa',2,16,19,20);\">Hsa 2:16, 19-20</a>.)";
eastonArray["$$T0003475"] = "<strong>Solomon's Porch:</strong> (<a href=\"#\" onClick=\"return mV('Jhn',10,23);\">Jhn 10:23</a>; <a href=\"#\" onClick=\"return mV('Act',3,11);\">Act 3:11</a>; <a href=\"#\" onClick=\"return mV('Act',5,12);\">5:12</a>), a colonnade, or cloister probably, on the eastern side of the temple. It is not mentioned in connection with the first temple, but Josephus mentions a porch, so called, in Herod's temple (q.v.).";
eastonArray["$$T0003476"] = "<strong>Songs:</strong> of Moses (<a href=\"#\" onClick=\"return mV('Exd',15,'1-')\">Exd 15</a>; <a href=\"#\" onClick=\"return mV('Num',21,17);\">Num 21:17</a>; <a href=\"#\" onClick=\"return mV('Deu',32,'1-')\">Deu 32</a>; <a href=\"#\" onClick=\"return mV('Rev',15,3);\">Rev 15:3</a>), Deborah (<a href=\"#\" onClick=\"return mV('Jdg',5,'1-')\">Jdg 5</a>), Hannah (<a href=\"#\" onClick=\"return mV('1Sa',2,'1-')\">1Sa 2</a>), David (<a href=\"#\" onClick=\"return mV('2Sa',22,'1-')\">2Sa 22</a>, and Psalms), Mary (<a href=\"#\" onClick=\"return mV('Luk',1,'46-55');\">Luk 1:46-55</a>), Zacharias (<a href=\"#\" onClick=\"return mV('Luk',1,'68-79');\">Luk 1:68-79</a>), the angels (<a href=\"#\" onClick=\"return mV('Luk',2,13);\">Luk 2:13</a>), Simeon (<a href=\"#\" onClick=\"return mV('Luk',2,29);\">Luk 2:29</a>), the redeemed (<a href=\"#\" onClick=\"return mV('Rev',5,9);\">Rev 5:9, 19</a>), Solomon (see <a href=\"#\" onClick=\"return doDictLookup ('ET0003474');\">SOLOMON, SONGS OF</a>).";
eastonArray["$$T0003477"] = "<strong>Son of God:</strong> The plural, \"sons of God,\" is used (<a href=\"#\" onClick=\"return mV('Gen',6,2,4);\">Gen 6:2, 4</a>) to denote the pious descendants of Seth. In (<a href=\"#\" onClick=\"return mV('Job',1,6);\">Job 1:6</a>; <a href=\"#\" onClick=\"return mV('Job',38,7);\">38:7</a>) this name is applied to the angels. Hosea uses the phrase (<a href=\"#\" onClick=\"return mV('Hsa',1,10);\">Hsa 1:10</a>) to designate the gracious relation in which men stand to God.<br><br>In the New Testament this phrase frequently denotes the relation into which we are brought to God by adoption (<a href=\"#\" onClick=\"return mV('Rom',8,14,19);\">Rom 8:14, 19</a>; <a href=\"#\" onClick=\"return mV('2Cr',6,18);\">2Cr 6:18</a>; <a href=\"#\" onClick=\"return mV('Gal',4,5,6);\">Gal 4:5-6</a>; <a href=\"#\" onClick=\"return mV('Phl',2,15);\">Phl 2:15</a>; <a href=\"#\" onClick=\"return mV('1Jo',3,1,2);\">1Jo 3:1-2</a>). It occurs thirty-seven times in the New Testament as the distinctive title of our Saviour. He does not bear this title in consequence of his miraculous birth, nor of his incarnation, his resurrection, and exaltation to the Father's right hand. This is a title of nature and not of office. The sonship of Christ denotes his equality with the Father. To call Christ the Son of God is to assert his true and proper divinity. The second Person of the Trinity, because of his eternal relation to the first Person, is the Son of God. He is the Son of God as to his divine nature, while as to his human nature he is the Son of David (<a href=\"#\" onClick=\"return mV('Rom',1,3,4);\">Rom 1:3-4</a>; <a href=\"#\" onClick=\"return mV('Gal',4,4);\">Gal 4:4</a>; <a href=\"#\" onClick=\"return mV('Jhn',1,'1-14');\">Jhn 1:1-14</a>; <a href=\"#\" onClick=\"return mV('Jhn',5,'18-25');\">5:18-25</a>; <a href=\"#\" onClick=\"return mV('Jhn',10,'30-38');\">10:30-38</a>), which prove that Christ was the Son of God before his incarnation, and that his claim to this title is a claim of equality with God.<br><br>When used with reference to creatures, whether men or angels, this word is always in the plural. In the singular it is always used of the second Person of the Trinity, with the single exception of <a href=\"#\" onClick=\"return mV('Luk',3,38);\">Luk 3:38</a>, where it is used of Adam.";
eastonArray["$$T0003478"] = "<strong>Son of man:</strong><br><br>(1.) Denotes mankind generally, with special reference to their weakness and frailty (<a href=\"#\" onClick=\"return mV('Job',25,6);\">Job 25:6</a>; <a href=\"#\" onClick=\"return mV('Psa',8,4);\">Psa 8:4</a>; <a href=\"#\" onClick=\"return mV('Psa',144,3);\">144:3</a>; <a href=\"#\" onClick=\"return mV('Psa',146,3);\">146:3</a>; <a href=\"#\" onClick=\"return mV('Isa',51,12);\">Isa 51:12</a>, etc.).<br><br>(2.) It is a title frequently given to the prophet Ezekiel, probably to remind him of his human weakness.<br><br>(3.) In the New Testament it is used forty-three times as a distinctive title of the Saviour. In the Old Testament it is used only in <a href=\"#\" onClick=\"return mV('Psa',80,17);\">Psa 80:17</a> and <a href=\"#\" onClick=\"return mV('Dan',7,13);\">Dan 7:13</a> with this application. It denotes the true humanity of our Lord. He had a true body (<a href=\"#\" onClick=\"return mV('Hbr',2,14);\">Hbr 2:14</a>; <a href=\"#\" onClick=\"return mV('Luk',24,39);\">Luk 24:39</a>) and a rational soul. He was perfect man.";
eastonArray["$$T0003479"] = "<strong>Soothsayer:</strong> one who pretends to prognosticate future events. Baalam is so called (<a href=\"#\" onClick=\"return mV('Jos',13,22);\">Jos 13:22</a>; rendered <a href=\"#\" onClick=\"return mV('1Sa',6,2);\">1Sa 6:2</a>; <a href=\"#\" onClick=\"return mV('Isa',3,2);\">Isa 3:2</a>). In <a href=\"#\" onClick=\"return mV('Isa',2,6);\">Isa 2:6</a> and <a href=\"#\" onClick=\"return mV('Mic',5,12);\">Mic 5:12</a> (Heb. yonenim, i.e., \"diviners of the clouds\") the word is used of the Chaldean diviners who studied the clouds. In <a href=\"#\" onClick=\"return mV('Dan',2,27);\">Dan 2:27</a>; <a href=\"#\" onClick=\"return mV('Dan',5,7);\">5:7</a> the word is the rendering of the Chaldee gazrin, i.e., \"deciders\" or \"determiners\", here applied to Chaldean astrologers, \"who, by casting nativities from the place of the stars at one's birth, and by various arts of computing and divining, foretold the fortunes and destinies of individuals.\", Gesenius, Lex. Heb. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003482');\">SORCERER</a>.)";
eastonArray["$$T0003480"] = "<strong>Sop:</strong> a morsel of bread (<a href=\"#\" onClick=\"return mV('Jhn',13,26);\">Jhn 13:26</a>; <a href=\"#\" onClick=\"return mV('Rth',2,14);\">Rth 2:14</a>). Our Lord took a piece of unleavened bread, and dipping it into the broth of bitter herbs at the Paschal meal, gave it to Judas. (<a href=\"#\" onClick=\"return mV('Rth',2,14);\">Rth 2:14</a>.)";
eastonArray["$$T0003481"] = "<strong>Sopater:</strong> the father who saves, probably the same as Sosipater, a kinsman of Paul (<a href=\"#\" onClick=\"return mV('Rom',16,21);\">Rom 16:21</a>), a Christian of the city of Berea who accompanied Paul into Asia (<a href=\"#\" onClick=\"return mV('Act',20,'4-6');\">Act 20:4-6</a>).";
eastonArray["$$T0003482"] = "<strong>Sorcerer:</strong> from the Latin sortiarius, one who casts lots, or one who tells the lot of others. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0001047');\">DIVINATION</a>.)<br><br>In <a href=\"#\" onClick=\"return mV('Dan',2,2);\">Dan 2:2</a> it is the rendering of the Hebrew mekhashphim, i.e., mutterers, men who professed to have power with evil spirits. The practice of sorcery exposed to severest punishment (<a href=\"#\" onClick=\"return mV('Mal',3,5);\">Mal 3:5</a>; <a href=\"#\" onClick=\"return mV('Rev',21,8);\">Rev 21:8</a>; <a href=\"#\" onClick=\"return mV('Rev',22,15);\">22:15</a>).";
eastonArray["$$T0003483"] = "<strong>Sorek:</strong> choice vine, the name of a valley, i.e., a torrent-bed, now the Wady Surar, \"valley of the fertile spot,\" which drains the western Judean hills, and flowing by Makkedah and Jabneel, falls into the sea some eight miles south of Joppa. This was the home of Deliah, whom Samson loved (<a href=\"#\" onClick=\"return mV('Jdg',16,4);\">Jdg 16:4</a>).";
eastonArray["$$T0003484"] = "<strong>Sosipater:</strong> (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003481');\">SOPATER</a>.)";
eastonArray["$$T0003485"] = "<strong>Sosthenes:</strong> safe in strength, the chief ruler of the synagogue at Corinth, who was seized and beaten by the mob in the presence of Gallio, the Roman governor, when he refused to proceed against Paul at the instigation of the Jews (<a href=\"#\" onClick=\"return mV('Act',18,'12-17');\">Act 18:12-17</a>). The motives of this assault against Sosthenes are not recorded, nor is it mentioned whether it was made by Greeks or Romans. Some identify him, but without sufficient grounds, with one whom Paul calls \"Sosthenes our brother,\" a convert to the faith (<a href=\"#\" onClick=\"return mV('1Cr',1,1);\">1Cr 1:1</a>).";
eastonArray["$$T0003486"] = "<strong>South:</strong> Heb. Negeb, that arid district to the south of Palestine through which lay the caravan route from Central Palestine to Egypt (<a href=\"#\" onClick=\"return mV('Gen',12,9);\">Gen 12:9</a>; <a href=\"#\" onClick=\"return mV('Gen',13,1,3);\">13:1, 3</a>; <a href=\"#\" onClick=\"return mV('Gen',46,'1-6');\">46:1-6</a>). \"The Negeb comprised a considerable but irregularly-shaped tract of country, its main portion stretching from the mountains and lowlands of Judah in the north to the mountains of Azazemeh in the south, and from the Dead Sea and southern Ghoron the east to the Mediterranean on the west.\" In <a href=\"#\" onClick=\"return mV('Eze',20,46);\">Eze 20:46</a> (<a href=\"#\" onClick=\"return mV('Eze',21,1);\">21:1</a> in Heb.) three different Hebrew words are all rendered \"south.\"<br><br>(1) \"Set thy face toward the south\" (<a href=\"#\" onClick=\"return mV('1Sa',23,24);\">1Sa 23:24</a>);<br><br>(2) \"Drop thy word toward the south\" (<a href=\"#\" onClick=\"return mV('Jos',15,4);\">Jos 15:4</a>);<br><br>(3) \"Prophesy against the forest of the south field\" (<a href=\"#\" onClick=\"return mV('Deu',33,23);\">Deu 33:23</a>). In (<a href=\"#\" onClick=\"return mV('Job',37,9);\">Job 37:9</a>) the word \"south\" is literally \"chamber,\" used here in the sense of treasury (<a href=\"#\" onClick=\"return mV('Job',38,22);\">Job 38:22</a>; <a href=\"#\" onClick=\"return mV('Psa',135,7);\">Psa 135:7</a>). This verse is rendered in the Revised Version \"out of the chamber of the south.\"";
eastonArray["$$T0003487"] = "<strong>Sovereignty:</strong> of God, his absolute right to do all things according to his own good pleasure (<a href=\"#\" onClick=\"return mV('Dan',4,25,35);\">Dan 4:25, 35</a>; <a href=\"#\" onClick=\"return mV('Rom',9,'15-23');\">Rom 9:15-23</a>; <a href=\"#\" onClick=\"return mV('1Ti',6,15);\">1Ti 6:15</a>; <a href=\"#\" onClick=\"return mV('Rev',4,11);\">Rev 4:11</a>).";
eastonArray["$$T0003488"] = "<strong>Spain:</strong> Paul expresses his intention (<a href=\"#\" onClick=\"return mV('Rom',15,24,28);\">Rom 15:24, 28</a>) to visit Spain. There is, however, no evidence that he ever carried it into effect, although some think that he probably did so between his first and second imprisonment. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003588');\">TARSHISH</a>.)";
eastonArray["$$T0003489"] = "<strong>Sparrow:</strong> Mentioned among the offerings made by the very poor. Two sparrows were sold for a farthing (<a href=\"#\" onClick=\"return mV('Mat',10,29);\">Mat 10:29</a>), and five for two farthings (<a href=\"#\" onClick=\"return mV('Luk',12,6);\">Luk 12:6</a>). The Hebrew word thus rendered is <i>tsippor</i>, which properly denotes the whole family of small birds which feed on grain (<a href=\"#\" onClick=\"return mV('Lev',14,4);\">Lev 14:4</a>; <a href=\"#\" onClick=\"return mV('Psa',84,3);\">Psa 84:3</a>; <a href=\"#\" onClick=\"return mV('Psa',102,7);\">102:7</a>). The Greek word of the New Testament is <i>strouthion</i> (<a href=\"#\" onClick=\"return mV('Mat',10,'29-31');\">Mat 10:29-31</a>), which is thus correctly rendered.";
eastonArray["$$T0003490"] = "<strong>Spicery:</strong> Heb. nechoth, identified with the Arabic naka'at, the gum tragacanth, obtained from the astralagus, of which there are about twenty species found in Palestine. The tragacanth of commerce is obtained from the A. tragacantha. \"The gum exudes plentifully under the heat of the sun on the leaves, thorns, and exteremity of the twigs.\"";
eastonArray["$$T0003491"] = "<strong>Spices:</strong> aromatic substances, of which several are named in <a href=\"#\" onClick=\"return mV('Exd',30,'1-');\">Exd 30</a>. They were used in the sacred anointing oil (<a href=\"#\" onClick=\"return mV('Exd',25,6);\">Exd 25:6</a>; <a href=\"#\" onClick=\"return mV('Exd',35,8);\">35:8</a>; <a href=\"#\" onClick=\"return mV('1Ch',9,29);\">1Ch 9:29</a>), and in embalming the dead (<a href=\"#\" onClick=\"return mV('2Ch',16,14);\">2Ch 16:14</a>; <a href=\"#\" onClick=\"return mV('Luk',23,56);\">Luk 23:56</a>; <a href=\"#\" onClick=\"return mV('Luk',24,1);\">24:1</a>; <a href=\"#\" onClick=\"return mV('Jhn',19,39,40);\">Jhn 19:39-40</a>). Spices were stored by Hezekiah in his treasure-house (<a href=\"#\" onClick=\"return mV('2Ki',20,13);\">2Ki 20:13</a>; <a href=\"#\" onClick=\"return mV('Isa',39,2);\">Isa 39:2</a>).";
eastonArray["$$T0003492"] = "<strong>Spider:</strong> The trust of the hypocrite is compared to the spider's web or house (<a href=\"#\" onClick=\"return mV('Job',8,14);\">Job 8:14</a>). It is said of the wicked by Isaiah that they \"weave the spider's web\" (<a href=\"#\" onClick=\"return mV('Isa',59,5);\">Isa 59:5</a>), i.e., their works and designs are, like the spider's web, vain and useless. The Hebrew word here used is <i>'akkabish</i>, \"a swift weaver.\"<br><br>In <a href=\"#\" onClick=\"return mV('Pro',30,28);\">Pro 30:28</a> a different Hebrew word (semamith) is used. It is rendered in the Vulgate by stellio, and in the Revised Version by \"lizard.\" It may, however, represent the spider, of which there are, it is said, about seven hundred species in Palestine.";
eastonArray["$$T0003493"] = "<strong>Spies:</strong> When the Israelites reached Kadesh for the first time, and were encamped there, Moses selected twelve spies from among the chiefs of the divisions of the tribes, and sent them forth to spy the land of Canaan (In <a href=\"#\" onClick=\"return mV('Num',13,'1-')\">Num 13</a>), and to bring back to him a report of its actual condition. They at once proceeded on their important errand, and went through the land as far north as the district round Lake Merom. After about six weeks' absence they returned. Their report was very discouraging, and the people were greatly alarmed, and in a rebellious spirit proposed to elect a new leader and return to Egypt. Only two of the spies, Caleb and Joshua, showed themselves on this occasion stout-hearted and faithful. All their appeals and remonstrances were in vain. Moses announced that as a punishment for their rebellion they must now wander in the wilderness till a new generation should arise which would go up and posses the land. The spies had been forty days absent on their expedition, and for each day the Israelites were to be wanderers for a year in the desert. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0001248');\">ESHCOL</a>.)<br><br>Two spies were sent by Joshua \"secretly\" i.e., unknown to the people (<a href=\"#\" onClick=\"return mV('Jos',2,1);\">Jos 2:1</a>), \"to view the land and Jericho\" after the death of Moses, and just before the tribes under his leadership were about to cross the Jordan. They learned from Rahab (q.v.), in whose house they found a hiding-place, that terror had fallen on all the inhabitants of the land because of the great things they had heard that Jehovah had done for them (<a href=\"#\" onClick=\"return mV('Exd',15,'14-16');\">Exd 15:14-16</a>; <a href=\"#\" onClick=\"return mV('Exd',23,27);\">Exd 23:27</a>; <a href=\"#\" onClick=\"return mV('Deu',2,25);\">Deu 2:25</a>; <a href=\"#\" onClick=\"return mV('Deu',11,25);\">11:25</a>). As the result of their mission they reported: \"Truly Jehovah hath delivered into our hands all the land; for even all the inhabitants of the country do faint because of us.\"";
eastonArray["$$T0003494"] = "<strong>Spikenard:</strong> (Heb. nerd), a much-valued perfume (<a href=\"#\" onClick=\"return mV('Sgs',1,12);\">Sgs 1:12</a>; <a href=\"#\" onClick=\"return mV('Sgs',4,13,14);\">4:13-14</a>). It was \"very precious\", i.e., very costly (<a href=\"#\" onClick=\"return mV('Mar',14,3);\">Mar 14:3</a>; <a href=\"#\" onClick=\"return mV('Jhn',12,3,5);\">Jhn 12:3, 5</a>). It is the root of an Indian plant, the <i>Nardostachys jatamansi</i>, of the family of Valeriance, growing on the Himalaya mountains. It is distinguished by its having many hairy spikes shooting out from one root. It is called by the Arabs sunbul Hindi, \"the Indian spike.\" In the New Testament this word is the rendering of the Greek nardos pistike. The margin of the Revised Version in these passages has \"pistic nard,\" pistic being perhaps a local name. Some take it to mean genuine, and others liquid. The most probable opinion is that the word pistike designates the nard as genuine or faithfully prepared.";
eastonArray["$$T0003495"] = "<strong>Spirit:</strong> (Heb. ruah; Gr. pneuma), properly wind or breath. In <a href=\"#\" onClick=\"return mV('2Th',2,8);\">2Th 2:8</a> it means \"breath,\" and in <a href=\"#\" onClick=\"return mV('Ecc',8,8);\">Ecc 8:8</a> the vital principle in man. It also denotes the rational, immortal soul by which man is distinguished (<a href=\"#\" onClick=\"return mV('Act',7,59);\">Act 7:59</a>; <a href=\"#\" onClick=\"return mV('1Cr',5,5);\">1Cr 5:5</a>; <a href=\"#\" onClick=\"return mV('1Cr',6,20);\">6:20</a>; <a href=\"#\" onClick=\"return mV('1Cr',7,34);\">7:34</a>), and the soul in its separate state (<a href=\"#\" onClick=\"return mV('Hbr',12,23);\">Hbr 12:23</a>), and hence also an apparition (<a href=\"#\" onClick=\"return mV('Job',4,15);\">Job 4:15</a>; <a href=\"#\" onClick=\"return mV('Luk',24,37,39);\">Luk 24:37, 39</a>), an angel (<a href=\"#\" onClick=\"return mV('Hbr',1,14);\">Hbr 1:14</a>), and a demon (<a href=\"#\" onClick=\"return mV('Luk',4,36);\">Luk 4:36</a>; <a href=\"#\" onClick=\"return mV('Luk',10,20);\">10:20</a>). This word is used also metaphorically as denoting a tendency (<a href=\"#\" onClick=\"return mV('Zec',12,10);\">Zec 12:10</a>; <a href=\"#\" onClick=\"return mV('Luk',13,11);\">Luk 13:11</a>).<br><br>In <a href=\"#\" onClick=\"return mV('Rom',1,4);\">Rom 1:4</a>; <a href=\"#\" onClick=\"return mV('1Ti',3,16);\">1Ti 3:16</a>; <a href=\"#\" onClick=\"return mV('2Cr',3,17);\">2Cr 3:17</a>; <a href=\"#\" onClick=\"return mV('1Pe',3,18);\">1Pe 3:18</a>, it designates the divine nature.";
eastonArray["$$T0003496"] = "<strong>Spirit, Holy:</strong> See <a href=\"#\" onClick=\"return doDictLookup ('ET0001805');\">HOLY GHOST</a>.";
eastonArray["$$T0003497"] = "<strong>Sponge:</strong> occurs only in the narrative of the crucifixion (<a href=\"#\" onClick=\"return mV('Mat',27,48);\">Mat 27:48</a>; <a href=\"#\" onClick=\"return mV('Mar',15,36);\">Mar 15:36</a>; <a href=\"#\" onClick=\"return mV('Jhn',19,29);\">Jhn 19:29</a>). It is ranked as a zoophyte. It is found attached to rocks at the bottom of the sea.";
eastonArray["$$T0003498"] = "<strong>Spouse:</strong> (<a href=\"#\" onClick=\"return mV('Sgs',4,'8-12');\">Sgs 4:8-12</a>; <a href=\"#\" onClick=\"return mV('Hsa',4,13,14);\">Hsa 4:13-14</a>) may denote either husband or wife, but in the Scriptures it denotes only the latter.";
eastonArray["$$T0003499"] = "<strong>Spring:</strong> (Heb. 'ain, \"the bright open source, the eye of the landscape\"). To be carefully distinguished from \"well\" (q.v.). \"Springs\" mentioned in <a href=\"#\" onClick=\"return mV('Jos',10,40);\">Jos 10:40</a> (Heb. 'ashdoth) should rather be \"declivities\" or \"slopes\" (R.V.), i.e., the undulating ground lying between the lowlands (the shephelah) and the central range of hills.";
</script>
