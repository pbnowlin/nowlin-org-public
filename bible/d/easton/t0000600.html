<TITLE>Dictionary Info Blue Letter Bible</TITLE>
<script src="../../js/basepath.js"  type="text/javascript"></script>
<script src="./js/nav.js"  type="text/javascript"></script>
<script src="./js/NoNavHeader.js"  type="text/javascript"></script>
<script>var eastonArray = new Array ();
eastonArray["$$T0000600"] = "<strong>Black:</strong> properly the absence of all colour. In <a href=\"#\" onClick=\"return mV('Pro',7,9);\">Pro 7:9</a> the Hebrew word means, as in the margin of the Revised Version, \"the pupil of the eye.\" It is translated \"apple\" of the eye in <a href=\"#\" onClick=\"return mV('Deu',32,10);\">Deu 32:10</a>; <a href=\"#\" onClick=\"return mV('Psa',17,8);\">Psa 17:8</a>; <a href=\"#\" onClick=\"return mV('Pro',7,2);\">Pro 7:2</a>. It is a different word which is rendered \"black\" in <a href=\"#\" onClick=\"return mV('Lev',13,31,37);\">Lev 13:31, 37</a>; <a href=\"#\" onClick=\"return mV('Sgs',1,5);\">Sgs 1:5</a>; <a href=\"#\" onClick=\"return mV('Sgs',1,5);\">Sgs 1:5</a>; <a href=\"#\" onClick=\"return mV('Sgs',5,11);\">5:11; and <a href=\"#\" onClick=\"return mV('Zec',6,2,6);\">Zec 6:2, 6</a>. It is uncertain what the \"black marble\" of <a href=\"#\" onClick=\"return mV('Est',1,6);\">Est 1:6</a> was which formed a part of the mosaic pavement.";
eastonArray["$$T0000601"] = "<strong>Blade:</strong> applied to the glittering point of a spear (<a href=\"#\" onClick=\"return mV('Job',39,23);\">Job 39:23</a>) or sword (<a href=\"#\" onClick=\"return mV('Nah',3,3);\">Nah 3:3</a>), the blade of a dagger (<a href=\"#\" onClick=\"return mV('Jdg',3,22);\">Jdg 3:22</a>); the \"shoulder blade\" (<a href=\"#\" onClick=\"return mV('Job',31,22);\">Job 31:22</a>); the \"blade\" of cereals (<a href=\"#\" onClick=\"return mV('Mat',13,26);\">Mat 13:26</a>).";
eastonArray["$$T0000602"] = "<strong>Blains:</strong> occurs only in connection with the sixth plague of Egypt (<a href=\"#\" onClick=\"return mV('Exd',9,9,10);\">Exd 9:9-10</a>). In <a href=\"#\" onClick=\"return mV('Deu',28,27,35);\">Deu 28:27, 35</a>, it is called \"the botch of Egypt.\" It seems to have been the fearful disease of black leprosy, a kind of elephantiasis, producing burning ulcers.";
eastonArray["$$T0000603"] = "<strong>Blasphemy:</strong> In the sense of speaking evil of God this word is found in <a href=\"#\" onClick=\"return mV('Psa',74,18);\">Psa 74:18</a>; <a href=\"#\" onClick=\"return mV('Isa',52,5);\">Isa 52:5</a>; <a href=\"#\" onClick=\"return mV('Rom',2,24);\">Rom 2:24</a>; <a href=\"#\" onClick=\"return mV('Rev',13,1,6);\">Rev 13:1, 6</a>; <a href=\"#\" onClick=\"return mV('Rev',16,9,11,21);\">16:9, 11, 21</a>. It denotes also any kind of calumny, or evil-speaking, or abuse (<a href=\"#\" onClick=\"return mV('1Ki',21,10);\">1Ki 21:10</a>; <a href=\"#\" onClick=\"return mV('Act',13,45);\">Act 13:45</a>; <a href=\"#\" onClick=\"return mV('Act',18,6);\">18:6</a>, etc.). Our Lord was accused of blasphemy when he claimed to be the Son of God (<a href=\"#\" onClick=\"return mV('Mat',26,65);\">Mat 26:65</a>; <a href=\"#\" onClick=\"return mV('Mat',9,3);\">Mat 9:3</a>; <a href=\"#\" onClick=\"return mV('Mar',2,7);\">Mar 2:7</a>). They who deny his Messiahship blaspheme Jesus (<a href=\"#\" onClick=\"return mV('Luk',22,65);\">Luk 22:65</a>; <a href=\"#\" onClick=\"return mV('Jhn',10,36);\">Jhn 10:36</a>).<br><br>Blasphemy against the Holy Ghost (<a href=\"#\" onClick=\"return mV('Mat',12,31,32);\">Mat 12:31-32</a>; <a href=\"#\" onClick=\"return mV('Mar',3,28,29);\">Mar 3:28-29</a>; <a href=\"#\" onClick=\"return mV('Luk',12,10);\">Luk 12:10</a>) is regarded by some as a continued and obstinate rejection of the gospel, and hence is an unpardonable sin, simply because as long as a sinner remains in unbelief he voluntarily excludes himself from pardon. Others regard the expression as designating the sin of attributing to the power of Satan those miracles which Christ performed, or generally those works which are the result of the Spirit's agency.";
eastonArray["$$T0000604"] = "<strong>Blastus:</strong> chamberlain to king Herod Agrippa I. (<a href=\"#\" onClick=\"return mV('Act',12,20);\">Act 12:20</a>). Such persons generally had great influence with their masters.";
eastonArray["$$T0000605"] = "<strong>Blemish:</strong> imperfection or bodily deformity excluding men from the priesthood, and rendering animals unfit to be offered in sacrifice (<a href=\"#\" onClick=\"return mV('Lev',21,'17-23');\">Lev 21:17-23</a>; <a href=\"#\" onClick=\"return mV('Lev',22,'19-25');\">22:19-25</a>). The Christian church, as justified in Christ, is \"without blemish\" (<a href=\"#\" onClick=\"return mV('Eph',5,27);\">Eph 5:27</a>). Christ offered himself a sacrifice \"without blemish,\" acceptable to God (<a href=\"#\" onClick=\"return mV('1Pe',1,19);\">1Pe 1:19</a>).";
eastonArray["$$T0000606"] = "<strong>Bless:</strong><br>br />(1.) God blesses his people when he bestows on them some gift temporal or spiritual (<a href=\"#\" onClick=\"return mV('Gen',1,22);\">Gen 1:22</a>; <a href=\"#\" onClick=\"return mV('Gen',24,35);\">24:35</a>; <a href=\"#\" onClick=\"return mV('Job',42,12);\">Job 42:12</a>; <a href=\"#\" onClick=\"return mV('Psa',45,2);\">Psa 45:2</a>; <a href=\"#\" onClick=\"return mV('Psa',104,24,35);\">104:24, 35</a>).<br><br>(2.) We bless God when we thank him for his mercies (<a href=\"#\" onClick=\"return mV('Psa',103,1,2);\">Psa 103:1-2</a>; <a href=\"#\" onClick=\"return mV('Psa',145,1,2);\">145:1-2</a>).<br><br>(3.) A man blesses himself when he invokes God's blessing (<a href=\"#\" onClick=\"return mV('Isa',65,16);\">Isa 65:16</a>), or rejoices in God's goodness to him (<a href=\"#\" onClick=\"return mV('Deu',29,19);\">Deu 29:19</a>; <a href=\"#\" onClick=\"return mV('Psa',49,18);\">Psa 49:18</a>).<br><br>(4.) One blesses another when he expresses good wishes or offers prayer to God for his welfare (<a href=\"#\" onClick=\"return mV('Gen',24,60);\">Gen 24:60</a>; <a href=\"#\" onClick=\"return mV('Gen',31,55);\">31:55</a>; <a href=\"#\" onClick=\"return mV('1Sa',2,20);\">1Sa 2:20</a>). Sometimes blessings were uttered under divine inspiration, as in the case of Noah, Isaac, Jacob, and Moses (<a href=\"#\" onClick=\"return mV('Gen',9,26,27);\">Gen 9:26-27</a>; <a href=\"#\" onClick=\"return mV('Gen',27,28,29,40);\">27:28-29, 40</a>; <a href=\"#\" onClick=\"return mV('Gen',48,'15-20');\">48:15-20</a>; <a href=\"#\" onClick=\"return mV('Gen',49,'1-28');\">49:1-28</a>; <a href=\"#\" onClick=\"return mV('Deu',33,'1-')\">Deu 33</a>). The priests were divinely authorized to bless the people (<a href=\"#\" onClick=\"return mV('Deu',10,8);\">Deu 10:8</a>; <a href=\"#\" onClick=\"return mV('Num',6,'22-27');\">Num 6:22-27</a>). We have many examples of apostolic benediction (<a href=\"#\" onClick=\"return mV('2Cr',13,14);\">2Cr 13:14</a>; <a href=\"#\" onClick=\"return mV('Eph',6,23,24);\">Eph 6:23-24</a>; <a href=\"#\" onClick=\"return mV('2Th',3,16,18);\">2Th 3:16, 18</a>; <a href=\"#\" onClick=\"return mV('Hbr',13,20,21);\">Hbr 13:20-21</a>; <a href=\"#\" onClick=\"return mV('1Pe',5,10,11);\">1Pe 5:10-11</a>).<br><br>(5.) Among the Jews in their thank-offerings the master of the feast took a cup of wine in his hand, and after having blessed God for it and for other mercies then enjoyed, handed it to his guests, who all partook of it. <a href=\"#\" onClick=\"return mV('Psa',116,13);\">Psa 116:13</a> refers to this custom. It is also alluded to in <a href=\"#\" onClick=\"return mV('1Cr',10,16);\">1Cr 10:16</a>, where the apostle speaks of the \"cup of blessing.\"";
eastonArray["$$T0000607"] = "<strong>Blind:</strong> Blind beggars are frequently mentioned (<a href=\"#\" onClick=\"return mV('Mat',9,27);\">Mat 9:27</a>; <a href=\"#\" onClick=\"return mV('Mat',12,22);\">12:22</a>; <a href=\"#\" onClick=\"return mV('Mat',20,30);\">20:30</a>; <a href=\"#\" onClick=\"return mV('Jhn',5,3);\">Jhn 5:3</a>). The blind are to be treated with compassion (<a href=\"#\" onClick=\"return mV('Lev',19,14);\">Lev 19:14</a>; <a href=\"#\" onClick=\"return mV('Deu',27,18);\">Deu 27:18</a>). Blindness was sometimes a punishment for disobedience (<a href=\"#\" onClick=\"return mV('1Sa',11,2);\">1Sa 11:2</a>; <a href=\"#\" onClick=\"return mV('Jer',39,7);\">Jer 39:7</a>), sometimes the effect of old age (<a href=\"#\" onClick=\"return mV('Gen',27,1);\">Gen 27:1</a>; <a href=\"#\" onClick=\"return mV('1Ki',14,4);\">1Ki 14:4</a>; <a href=\"#\" onClick=\"return mV('1Sa',4,15);\">1Sa 4:15</a>). Conquerors sometimes blinded their captives (<a href=\"#\" onClick=\"return mV('2Ki',25,7);\">2Ki 25:7</a>; <a href=\"#\" onClick=\"return mV('1Sa',11,2);\">1Sa 11:2</a>). Blindness denotes ignorance as to spiritual things (<a href=\"#\" onClick=\"return mV('Isa',6,10);\">Isa 6:10</a>; <a href=\"#\" onClick=\"return mV('Isa',42,18,19);\">42:18-19</a>; <a href=\"#\" onClick=\"return mV('Mat',15,14);\">Mat 15:14</a>; <a href=\"#\" onClick=\"return mV('Eph',4,18);\">Eph 4:18</a>). The opening of the eyes of the blind is peculiar to the Messiah (<a href=\"#\" onClick=\"return mV('Isa',29,18);\">Isa 29:18</a>). Elymas was smitten with blindness at Paul's word (<a href=\"#\" onClick=\"return mV('Act',13,11);\">Act 13:11</a>).";
eastonArray["$$T0000608"] = "<strong>Blood:</strong><br><br>(1.) As food, prohibited in <a href=\"#\" onClick=\"return mV('Gen',9,4);\">Gen 9:4</a>, where the use of animal food is first allowed. Comp. <a href=\"#\" onClick=\"return mV('Deu',12,23);\">Deu 12:23</a>; <a href=\"#\" onClick=\"return mV('Lev',3,17);\">Lev 3:17</a>; <a href=\"#\" onClick=\"return mV('Lev',7,26);\">7:26</a>; <a href=\"#\" onClick=\"return mV('Lev',17,'10-14');\">17:10-14</a>. The injunction to abstain from blood is renewed in the decree of the council of Jerusalem (<a href=\"#\" onClick=\"return mV('Act',15,29);\">Act 15:29</a>). It has been held by some, and we think correctly, that this law of prohibition was only ceremonial and temporary; while others regard it as still binding on all. Blood was eaten by the Israelites after the battle of Gilboa (<a href=\"#\" onClick=\"return mV('1Sa',14,'32-34');\">1Sa 14:32-34</a>).<br><br>(2.) The blood of sacrifices was caught by the priest in a basin, and then sprinkled seven times on the altar; that of the passover on the doorposts and lintels of the houses (<a href=\"#\" onClick=\"return mV('Lev',4,'5-7');\">Lev. 4:5-7</a>; <a href=\"#\" onClick=\"return mV('1Sa',16,'14-19');\">16:14-19</a>). At the giving of the law (<a href=\"#\" onClick=\"return mV('Exd',24,8);\">Exd 24:8</a>) the <a href=\"#\" onClick=\"return mV('Exd',12,'1-')\">Exd 12</a>; <a href=\"#\" onClick=\"return mV('Lev',4,'5-7');\">Lev 4:5-7</a>; <a href=\"#\" onClick=\"return mV('Lev',16,'14-19');\">16:14-19</a>). At the giving of the law (<a href=\"#\" onClick=\"return mV('Exd',24,8);\">Exd 24:8</a>) the blood of the sacrifices was sprinkled on the people as well as on the altar, and thus the people were consecrated to God, or entered into covenant with him, hence the blood of the covenant (<a href=\"#\" onClick=\"return mV('Mat',26,28);\">Mat 26:28</a>; <a href=\"#\" onClick=\"return mV('Hbr',9,19,20);\">Hbr 9:19-20</a>; <a href=\"#\" onClick=\"return mV('Hbr',10,29);\">10:29</a>; <a href=\"#\" onClick=\"return mV('Hbr',13,20);\">13:20</a>).<br><br>(3.) Human blood. The murderer was to be punished (<a href=\"#\" onClick=\"return mV('Gen',9,5);\">Gen 9:5</a>). The blood of the murdered \"crieth for vengeance\" (<a href=\"#\" onClick=\"return mV('Gen',4,10);\">Gen 4:10</a>). The \"avenger of blood\" was the nearest relative of the murdered, and he was required to avenge his death (<a href=\"#\" onClick=\"return mV('Num',35,24,27);\">Num 35:24, 27</a>). No satisfaction could be made for the guilt of murder (<a href=\"#\" onClick=\"return mV('Num',35,31);\">Num 35:31</a>).<br><br>(4.) Blood used metaphorically to denote race (<a href=\"#\" onClick=\"return mV('Act',17,26);\">Act 17:26</a>), and as a symbol of slaughter (<a href=\"#\" onClick=\"return mV('Isa',34,3);\">Isa 34:3</a>). To \"wash the feet in blood\" means to gain a great victory (<a href=\"#\" onClick=\"return mV('Psa',58,10);\">Psa 58:10</a>). Wine, from its red colour, is called \"the blood of the grape\" (<a href=\"#\" onClick=\"return mV('Gen',49,11);\">Gen 49:11</a>). Blood and water issued from our Saviour's side when it was pierced by the Roman soldier (<a href=\"#\" onClick=\"return mV('Jhn',19,34);\">Jhn 19:34</a>). This has led pathologists to the conclusion that the proper cause of Christ's death was rupture of the heart. (<a href=\"#\" onClick=\"return mV('Psa',69,20);\">Psa 69:20</a>.)";
eastonArray["$$T0000609"] = "<strong>Bloody sweat:</strong> the sign and token of our Lord's great agony (<a href=\"#\" onClick=\"return mV('Luk',22,44);\">Luk 22:44</a>).";
eastonArray["$$T0000610"] = "<strong>Blot:</strong> a stain or reproach (<a href=\"#\" onClick=\"return mV('Job',31,7);\">Job 31:7</a>; <a href=\"#\" onClick=\"return mV('Pro',9,7);\">Pro 9:7</a>). To blot out sin is to forgive it (<a href=\"#\" onClick=\"return mV('Psa',51,1,9);\">Psa 51:1, 9</a>; <a href=\"#\" onClick=\"return mV('Isa',44,22);\">Isa 44:22</a>; <a href=\"#\" onClick=\"return mV('Act',3,19);\">Act 3:19</a>). Christ's blotting out the handwriting of ordinances was his fulfilling the law in our behalf (<a href=\"#\" onClick=\"return mV('Col',2,14);\">Col 2:14</a>).";
eastonArray["$$T0000611"] = "<strong>Blue:</strong> generally associated with purple (<a href=\"#\" onClick=\"return mV('Exd',25,4);\">Exd 25:4</a>; <a href=\"#\" onClick=\"return mV('Exd',26,1,31,36);\">26:1, 31, 36</a>, etc.). It is supposed to have been obtained from a shellfish of the Mediterranean, the <e>Helix ianthina</i> of Linnaeus. The robe of the high priest's ephod was to be all of this colour (<a href=\"#\" onClick=\"return mV('Exd',28,31);\">Exd 28:31</a>), also the loops of the curtains (<a href=\"#\" onClick=\"return mV('Exd',26,4);\">26:4</a>) and the ribbon of the breastplate (<a href=\"#\" onClick=\"return mV('Exd',28,28);\">28:28</a>). Blue cloths were also made for various sacred purposes (<a href=\"#\" onClick=\"return mV('Num',4,6,7,9,11,12);\">Num 4:6-7, 9, 11-12</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000868');\">COLOUR</a>.)";
eastonArray["$$T0000612"] = "<strong>Boanerges:</strong> sons of thunder, a surname given by our Lord to James and John (<a href=\"#\" onClick=\"return mV('Mar',3,17);\">Mar 3:17</a>) on account of their fervid and impetuous temper (<a href=\"#\" onClick=\"return mV('Luk',9,54);\">Luk 9:54</a>).";
eastonArray["$$T0000613"] = "<strong>Boar:</strong> occurs only in <a href=\"#\" onClick=\"return mV('Psa',80,13);\">Psa 80:13</a>. The same Hebrew word is elsewhere rendered \"swine\" (<a href=\"#\" onClick=\"return mV('Lev',11,7);\">Lev 11:7</a>; <a href=\"#\" onClick=\"return mV('Deu',14,8);\">Deu 14:8</a>; <a href=\"#\" onClick=\"return mV('Pro',11,22);\">Pro 11:22</a>; <a href=\"#\" onClick=\"return mV('Isa',65,4);\">Isa 65:4</a>; <a href=\"#\" onClick=\"return mV('Isa',66,3,17);\">66:3, 17</a>). The Hebrews abhorred swine's flesh, and accordingly none of these animals were reared, except in the district beyond the Sea of Galilee. In the psalm quoted above the powers that destroyed the Jewish nation are compared to wild boars and wild beasts of the field.";
eastonArray["$$T0000614"] = "<strong>Boaz:</strong> alacrity.<br><br>(1.) The husband of Ruth, a wealthy Bethlehemite. By the \"levirate law\" the duty devolved on him of marrying Ruth the Moabitess (<a href=\"#\" onClick=\"return mV('Rth',4,'1-13');\">Rth 4:1-13</a>). He was a kinsman of Mahlon, her first husband.<br><br>(2.) The name given (for what reason is unknown) to one of the two (the other was called Jachin) brazen pillars which Solomon erected in the court of the temple (<a href=\"#\" onClick=\"return mV('1Ki',7,21);\">1Ki 7:21</a>; <a href=\"#\" onClick=\"return mV('2Ch',3,17);\">2Ch 3:17</a>). These pillars were broken up and carried to Babylon by Nebuchadnezzar.";
eastonArray["$$T0000615"] = "<strong>Bochim:</strong> weepers, a place where the angel of the Lord reproved the Israelites for entering into a league with the people of the land. This caused them bitterly to weep, and hence the name of the place (<a href=\"#\" onClick=\"return mV('Jdg',2,1,5);\">Jdg 2:1, 5</a>). It lay probably at the head of one of the valleys between Gilgal and Shiloh.";
eastonArray["$$T0000616"] = "<strong>Boil:</strong> (in <a href=\"#\" onClick=\"return mV('Deu',28,27,35);\">Deu 28:27, 35</a>), an aggravated ulcer, as in the case of Hezekiah (<a href=\"#\" onClick=\"return mV('2Ki',20,7);\">2Ki 20:7</a>; <a href=\"#\" onClick=\"return mV('Isa',38,21);\">Isa 38:21</a>) or of the Egyptians (<a href=\"#\" onClick=\"return mV('Exd',9,'9-11');\">Exd 9:9-11</a>; <a href=\"#\" onClick=\"return mV('Deu',28,27,35);\">Deu 28:27, 35</a>). It designates the disease of Job (<a href=\"#\" onClick=\"return mV('Job',2,7);\">Job 2:7</a>), which was probably the black leprosy.";
eastonArray["$$T0000617"] = "<strong>Bolled:</strong> (<a href=\"#\" onClick=\"return mV('Exd',9,31);\">Exd 9:31</a>), meaning \"swollen or podded for seed,\" was adopted in the Authorized Version from the version of Coverdale (1535). The Revised Version has in the margin \"was in bloom,\" which is the more probable rendering of the Hebrew word. It is the fact that in Egypt when barley is in ear (about February) flax is blossoming.";
eastonArray["$$T0000618"] = "<strong>Bolster:</strong> The Hebrew word <i>kebir</i>, rendered \"pillow\" in <a href=\"#\" onClick=\"return mV('1Sa',19,13,16);\">1Sa 19:13, 16</a>, but in Revised Version marg. \"quilt\" or \"network,\" probably means some counterpane or veil intended to protect the head of the sleeper. A different Hebrew word (meraashoth') is used for \"bolster\" (<a href=\"#\" onClick=\"return mV('1Sa',26,7,11,16);\">1Sa 26:7, 11, 16</a>). It is rightly rendered in Revised Version \"at his head.\" In <a href=\"#\" onClick=\"return mV('Gen',28,11,18);\">Gen 28:11, 18</a>, the Authorized Version renders it \"for his pillows,\" and the Revised Version \"under his head.\" In <a href=\"#\" onClick=\"return mV('Eze',13,18,20);\">Eze 13:18, 20</a>, another Hebrew word (kesathoth) is used, properly denoting \"cushions\" or \"pillows,\" as so rendered both in the Authorized and the Revised Version.";
eastonArray["$$T0000619"] = "<strong>Bond:</strong> an obligation of any kind (<a href=\"#\" onClick=\"return mV('Num',30,2,4,12);\">Num 30:2, 4, 12</a>). The word means also oppression or affliction (<a href=\"#\" onClick=\"return mV('Psa',116,16);\">Psa 116:16</a>; <a href=\"#\" onClick=\"return mV('Phl',1,7);\">Phl 1:7</a>). Christian love is the \"bond of perfectness\" (<a href=\"#\" onClick=\"return mV('Col',3,14);\">Col 3:14</a>), and the influences of the Spirit are the \"bond of peace\" (<a href=\"#\" onClick=\"return mV('Eph',4,3);\">Eph 4:3</a>).";
eastonArray["$$T0000620"] = "<strong>Bondage:</strong> of Israel in Egypt (<a href=\"#\" onClick=\"return mV('Exd',2,23,25);\">Exd 2:23, 25</a>; <a href=\"#\" onClick=\"return mV('Deu',5,6);\">5:6</a>), which is called the \"house of bondage\" (<a href=\"#\" onClick=\"return mV('Exd',13,3);\">13:3</a>; <a href=\"#\" onClick=\"return mV('Exd',20,2);\">20:2</a>). This word is used also with reference to the captivity in Babylon (<a href=\"#\" onClick=\"return mV('Isa',14,3);\">Isa 14:3</a>), and the oppression of the Persian king (<a href=\"#\" onClick=\"return mV('Ezr',9,8,9);\">Ezr 9:8-9</a>).";
eastonArray["$$T0000621"] = "<strong>Bonnet:</strong> (Heb. peer), <a href=\"#\" onClick=\"return mV('Exd',39,28);\">Exd 39:28</a> (R.V., \"head-tires\"); <a href=\"#\" onClick=\"return mV('Eze',44,18);\">Eze 44:18</a> (R.V., \"tires\"), denotes properly a turban worn by priests, and in <a href=\"#\" onClick=\"return mV('Isa',3,20);\">Isa. 3:20</a> (R.V., \"head-tires\") a head-dress or tiara worn by females. The Hebrew word so rendered literally means an ornament, as in <a href=\"#\" onClick=\"return mV('Isa',61,10);\">Isa 61:10</a> (R.V., \"garland\"), and in <a href=\"#\" onClick=\"return mV('Eze',24,17,23);\">Eze 24:17, 23</a>, \"tire\" (R.V., \"head-tire\"). It consisted of a piece of cloth twisted about the head. In <a href=\"#\" onClick=\"return mV('Exd',28,40);\">Exd 28:40</a>; <a href=\"#\" onClick=\"return mV('Exd',29,9);\">29:9</a>, it is the translation of a different Hebrew word (migba'ah), which denotes the turban (R.V., \"head-tire\") of the common priest as distinguished from the mitre of the high priest. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002575');\">MITRE</a>.)";
eastonArray["$$T0000622"] = "<strong>Book:</strong> This word has a comprehensive meaning in Scripture. In the Old Testament it is the rendering of the Hebrew word <i>sepher</i>, which properly means a \"writing,\" and then a \"volume\" (<a href=\"#\" onClick=\"return mV('Exd',17,14);\">Exd 17:14</a>; <a href=\"#\" onClick=\"return mV('Deu',28,58);\">Deu 28:58</a>; <a href=\"#\" onClick=\"return mV('Deu',29,20);\">29:20</a>; <a href=\"#\" onClick=\"return mV('Job',19,23);\">Job 19:23</a>) or \"roll of a book\" (<a href=\"#\" onClick=\"return mV('Jer',36,2,4);\">Jer 36:2, 4</a>).<br><br>Books were originally written on skins, on linen or cotton cloth, and on Egyptian papyrus, whence our word \"paper.\" The leaves of the book were generally written in columns, designated by a Hebrew word properly meaning \"doors\" and \"valves\" (<a href=\"#\" onClick=\"return mV('Jer',36,23);\">Jer 36:23</a>, R.V., marg. \"columns\").<br><br>Among the Hebrews books were generally rolled up like our maps, or if very long they were rolled from both ends, forming two rolls (<a href=\"#\" onClick=\"return mV('Luk',4,17,20);\">Luk 4:17-20</a>). Thus they were arranged when the writing was on flexible materials; but if the writing was on tablets of wood or brass or lead, then the several tablets were bound together by rings through which a rod was passed.<br><br>A sealed book is one whose contents are secret (<a href=\"#\" onClick=\"return mV('Isa',29,11);\">Isa 29:11</a>; <a href=\"#\" onClick=\"return mV('Rev',5,'1-3');\">Rev 5:1-3</a>). To \"eat\" a book (<a href=\"#\" onClick=\"return mV('Jer',15,16);\">Jer 15:16</a>; <a href=\"#\" onClick=\"return mV('Eze',2,'8-10');\">Eze 2:8-10</a>; <a href=\"#\" onClick=\"return mV('Eze',3,'1-3');\">3:1-3</a>; <a href=\"#\" onClick=\"return mV('Rev',10,9);\">Rev 10:9</a>) is to study its contents carefully.<br><br>The book of judgment (<a href=\"#\" onClick=\"return mV('Dan',7,10);\">Dan 7:10</a>) refers to the method of human courts of justice as illustrating the proceedings which will take place at the day of God's final judgment.<br><br>The book of the wars of the Lord (<a href=\"#\" onClick=\"return mV('Num',21,14);\">Num 21:14</a>), the book of Jasher (<a href=\"#\" onClick=\"return mV('Jos',10,13);\">Jos 10:13</a>), and the book of the chronicles of the kings of Judah and Israel (<a href=\"#\" onClick=\"return mV('2Ch',25,26);\">2Ch 25:26</a>), were probably ancient documents known to the Hebrews, but not forming a part of the canon.<br><br>The book of life (<a href=\"#\" onClick=\"return mV('Psa',69,28);\">Psa 69:28</a>) suggests the idea that as the redeemed form a community or citizenship (<a href=\"#\" onClick=\"return mV('Phl',3,20);\">Phl 3:20</a>; <a href=\"#\" onClick=\"return mV('Phl',4,3);\">4:3</a>), a catalogue of the citizens' names is preserved (<a href=\"#\" onClick=\"return mV('Luk',10,20);\">Luk 10:20</a>; <a href=\"#\" onClick=\"return mV('Rev',20,15);\">Rev 20:15</a>). Their names are registered in heaven (<a href=\"#\" onClick=\"return mV('Luk',10,20);\">Luk 10:20</a>; <a href=\"#\" onClick=\"return mV('Rev',3,5);\">Rev 3:5</a>).<br><br>The book of the covenant (<a href=\"#\" onClick=\"return mV('Exd',24,7);\">Exd 24:7</a>), containing <a href=\"#\" onClick=\"return mV('Exd',20,'22-');\">Exd. 20:22-31; <a href=\"#\" onClick=\"return mV('Exd',21,'1-');\">21</a>; <a href=\"#\" onClick=\"return mV('Exd',22,'1-');\">22</a>; <a href=\"#\" onClick=\"return mV('Exd',23,'1-33');\">23:1-33</a>, is the first book actually mentioned as a part of the written word. It contains a series of laws, civil, social, and religious, given to Moses at Sinai immediately after the delivery of the decalogue. These were written in this \"book.\"";
eastonArray["$$T0000623"] = "<strong>Booth:</strong> a hut made of the branches of a tree. In such tabernacles Jacob sojourned for a season at a place named from this circumstance Succoth (<a href=\"#\" onClick=\"return mV('Gen',33,17);\">Gen 33:17</a>). Booths were erected also at the feast of Tabernacles (q.v.), <a href=\"#\" onClick=\"return mV('Lev',23,42,43);\">Lev 23:42-43</a>, which commemorated the abode of the Israelites in the wilderness.";
eastonArray["$$T0000624"] = "<strong>Booty:</strong> captives or cattle or objects of value taken in war. In Canaan all that breathed were to be destroyed (<a href=\"#\" onClick=\"return mV('Deu',20,16);\">Deu 20:16</a>). The \"pictures and images\" of the Canaanites were to be destroyed also (<a href=\"#\" onClick=\"return mV('Num',33,52);\">Num 33:52</a>). The law of booty as to its division is laid down in <a href=\"#\" onClick=\"return mV('Num',31,'26-47');\">Num 31:26-47</a>. David afterwards introduced a regulation that the baggage-guard should share the booty equally with the soldiers engaged in battle. He also devoted of the spoils of war for the temple (<a href=\"#\" onClick=\"return mV('1Sa',30,'24-26');\">1Sa 30:24-26</a>; <a href=\"#\" onClick=\"return mV('2Sa',8,11);\">2Sa 8:11</a>; <a href=\"#\" onClick=\"return mV('1Ch',26,27);\">1Ch 26:27</a>).";
eastonArray["$$T0000625"] = "<strong>Borrow:</strong> The Israelites \"borrowed\" from the Egyptians (<a href=\"#\" onClick=\"return mV('Exd',12,35);\">Exd 12:35</a>, R.V., \"asked\") in accordance with a divine command (<a href=\"#\" onClick=\"return mV('Exd',3,22);\">3:22</a>; <a href=\"#\" onClick=\"return mV('Exd',11,2);\">11:2</a>). But the word (sha'al) so rendered here means simply and always to \"request\" or \"demand.\" The Hebrew had another word which is properly translated \"borrow\" in <a href=\"#\" onClick=\"return mV('Deu',28,12);\">Deu 28:12</a>; <a href=\"#\" onClick=\"return mV('Psa',37,21);\">Psa 37:21</a>. It was well known that the parting was final. The Egyptians were so anxious to get the Israelites away out of their land that \"they let them have what they asked\" (<a href=\"#\" onClick=\"return mV('Exd',12,36);\">Exd 12:36</a>, R.V.), or literally \"made them to ask,\" urged them to take whatever they desired and depart. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002307');\">LOAN</a>.)";
eastonArray["$$T0000626"] = "<strong>Bosom:</strong> In the East objects are carried in the bosom which Europeans carry in the pocket. To have in one's bosom indicates kindness, secrecy, or intimacy (<a href=\"#\" onClick=\"return mV('Gen',16,5);\">Gen 16:5</a>; <a href=\"#\" onClick=\"return mV('2Sa',12,8);\">2Sa 12:8</a>). Christ is said to have been in \"the bosom of the Father,\" i.e., he had the most perfect knowledge of the Father, had the closest intimacy with him (<a href=\"#\" onClick=\"return mV('Jhn',1,18);\">Jhn 1:18</a>). John (<a href=\"#\" onClick=\"return mV('Jhn',13,23);\">Jhn 13:23</a>) was \"leaning on Jesus' bosom\" at the last supper. Our Lord carries his lambs in his bosom, i.e., has a tender, watchful care over them (<a href=\"#\" onClick=\"return mV('Isa',40,11);\">Isa 40:11</a>).";
eastonArray["$$T0000627"] = "<strong>Bosor:</strong> the Chaldee or Aramaic form of the name Beor, the father of Balaam (<a href=\"#\" onClick=\"return mV('2Pe',2,15);\">2Pe 2:15</a>).";
eastonArray["$$T0000628"] = "<strong>Bosses:</strong> the projecting parts of a shield (<a href=\"#\" onClick=\"return mV('Job',15,26);\">Job 15:26</a>). The Hebrew word thus rendered means anything convex or arched, and hence the back, as of animals.";
eastonArray["$$T0000629"] = "<strong>Botch:</strong> the name given in <a href=\"#\" onClick=\"return mV('Deu',28,27,35);\">Deu 28:27, 35</a>, to one of the Egyptian plagues (<a href=\"#\" onClick=\"return mV('Exd',9,9);\">Exd 9:9</a>). The word so translated is usually rendered \"boil\" (q.v.).";
eastonArray["$$T0000630"] = "<strong>Bottle:</strong> a vessel made of skins for holding wine (<a href=\"#\" onClick=\"return mV('Jos',9,4,13);\">Jos 9:4, 13</a>; <a href=\"#\" onClick=\"return mV('1Sa',16,20);\">1Sa 16:20</a>; <a href=\"#\" onClick=\"return mV('Mat',9,17);\">Mat 9:17</a>; <a href=\"#\" onClick=\"return mV('Mar',2,22);\">Mar 2:22</a>; <a href=\"#\" onClick=\"return mV('Luk',5,37,38);\">Luk 5:37-38</a>), or milk (<a href=\"#\" onClick=\"return mV('Jdg',4,19);\">Jdg 4:19</a>), or water (<a href=\"#\" onClick=\"return mV('Gen',21,14,15,19);\">Gen 21:14-15, 19</a>), or strong drink (<a href=\"#\" onClick=\"return mV('Hab',2,15);\">Hab 2:15</a>).<br><br>Earthenware vessels were also similarly used (<a href=\"#\" onClick=\"return mV('Jer',19,'1-10');\">Jer 19:1-10</a>; <a href=\"#\" onClick=\"return mV('1Ki',14,3);\">1Ki 14:3</a>; <a href=\"#\" onClick=\"return mV('Isa',30,14);\">Isa 30:14</a>). In <a href=\"#\" onClick=\"return mV('Job',32,19);\">Job 32:19</a> (<a href=\"#\" onClick=\"return mV('Mat',9,17);\">Mat 9:17</a>; <a href=\"#\" onClick=\"return mV('Luk',5,37,38);\">Luk 5:37-38</a>; <a href=\"#\" onClick=\"return mV('Mar',2,22);\">Mar 2:22</a>) the reference is to a wine-skin ready to burst through the fermentation of the wine. \"Bottles of wine\" in the Authorized Version of <a href=\"#\" onClick=\"return mV('Hsa',7,5);\">Hsa 7:5</a> is properly rendered in the Revised Version by \"the heat of wine,\" i.e., the fever of wine, its intoxicating strength.<br><br>The clouds are figuratively called the \"bottles of heaven\" (<a href=\"#\" onClick=\"return mV('Job',38,37);\">Job 38:37</a>). A bottle blackened or shrivelled by smoke is referred to in <a href=\"#\" onClick=\"return mV('Psa',119,83);\">Psa 119:83</a> as an image to which the psalmist likens himself.";
eastonArray["$$T0000631"] = "<strong>Bow:</strong> The bow was in use in early times both in war and in the chase (<a href=\"#\" onClick=\"return mV('Gen',21,20);\">Gen 21:20</a>; <a href=\"#\" onClick=\"return mV('Gen',27,3);\">27:3</a>; <a href=\"#\" onClick=\"return mV('Gen',48,22);\">48:22</a>). The tribe of Benjamin were famous for the use of the bow (<a href=\"#\" onClick=\"return mV('1Ch',8,40);\">1Ch 8:40</a>; <a href=\"#\" onClick=\"return mV('1Ch',12,2);\">12:2</a>; <a href=\"#\" onClick=\"return mV('2Ch',14,8);\">2Ch 14:8</a>; <a href=\"#\" onClick=\"return mV('2Ch',17,17);\">17:17</a>); so also were the Elamites (<a href=\"#\" onClick=\"return mV('Isa',22,6);\">Isa 22:6</a>) and the Lydians (<a href=\"#\" onClick=\"return mV('Jer',46,9);\">Jer 46:9</a>). The Hebrew word commonly used for bow means properly to tread (<a href=\"#\" onClick=\"return mV('1Ch',5,18);\">1Ch 5:18</a>; <a href=\"#\" onClick=\"return mV('1Ch',8,40);\">8:40</a>), and hence it is concluded that the foot was employed in bending the bow. Bows of steel (correctly \"copper\") are mentioned (<a href=\"#\" onClick=\"return mV('2Sa',22,35);\">2Sa 22:35</a>; <a href=\"#\" onClick=\"return mV('Psa',18,34);\">Psa 18:34</a>).<br><br>The arrows were carried in a quiver (<a href=\"#\" onClick=\"return mV('Gen',27,3);\">Gen 27:3</a>; <a href=\"#\" onClick=\"return mV('Isa',22,6);\">Isa 22:6</a>; <a href=\"#\" onClick=\"return mV('Isa',49,2);\">49:2</a>; <a href=\"#\" onClick=\"return mV('Psa',127,5);\">Psa 127:5</a>). They were apparently sometimes shot with some burning material attached to them (<a href=\"#\" onClick=\"return mV('Psa',120,4);\">Psa 120:4</a>).<br><br>The bow is a symbol of victory (<a href=\"#\" onClick=\"return mV('Psa',7,12);\">Psa 7:12</a>). It denotes also falsehood, deceit (<a href=\"#\" onClick=\"return mV('Psa',64,3,4);\">Psa 64:3-4</a>; <a href=\"#\" onClick=\"return mV('Hsa',7,16);\">Hsa 7:16</a>; <a href=\"#\" onClick=\"return mV('Jer',9,3);\">Jer 9:3</a>).<br><br>\"The use of the bow\" in <a href=\"#\" onClick=\"return mV('2Sa',1,18);\">2Sa 1:18</a> (A.V.) ought to be \"the song of the bow,\" as in the Revised Version.";
eastonArray["$$T0000632"] = "<strong>Bowels:</strong> (<a href=\"#\" onClick=\"return mV('Phl',1,8);\">Phl 1:8</a>; <a href=\"#\" onClick=\"return mV('Phl',2,1);\">2:1</a>; <a href=\"#\" onClick=\"return mV('Col',3,12);\">Col 3:12</a>), compassionate feelings; R.V., \"tender mercies.\"";
eastonArray["$$T0000633"] = "<strong>Bowing:</strong> a mode of showing respect. Abraham \"bowed himself to the people of the land\" (<a href=\"#\" onClick=\"return mV('Gen',23,7);\">Gen 23:7</a>); so Jacob to Esau (<a href=\"#\" onClick=\"return mV('Gen',33,3);\">Gen 33:3</a>); and the brethren of Joseph before him as the governor of the land (<a href=\"#\" onClick=\"return mV('Gen',43,28);\">Gen 43:28</a>). Bowing is also frequently mentioned as an act of adoration to idols (<a href=\"#\" onClick=\"return mV('Jos',23,7);\">Jos 23:7</a>; <a href=\"#\" onClick=\"return mV('2Ki',5,18);\">2Ki 5:18</a>; <a href=\"#\" onClick=\"return mV('Jdg',2,19);\">Jdg 2:19</a>; <a href=\"#\" onClick=\"return mV('Isa',44,15);\">Isa 44:15</a>), and to God (<a href=\"#\" onClick=\"return mV('Jos',5,14);\">Jos 5:14</a>; <a href=\"#\" onClick=\"return mV('Psa',22,29);\">Psa 22:29</a>; <a href=\"#\" onClick=\"return mV('Psa',72,9);\">72:9</a>; <a href=\"#\" onClick=\"return mV('Mic',6,6);\">Mic 6:6</a>; <a href=\"#\" onClick=\"return mV('Psa',95,6);\">Psa 95:6</a>; <a href=\"#\" onClick=\"return mV('Eph',3,14);\">Eph 3:14</a>).";
eastonArray["$$T0000634"] = "<strong>Bowl:</strong> The sockets of the lamps of the golden candlestick of the tabernacle are called bowls (<a href=\"#\" onClick=\"return mV('Exd',25,31,33,34);\">Exd 25:31, 33-34</a>; <a href=\"#\" onClick=\"return mV('Exd',37,17,19,20);\">37:17, 19-20</a>); the same word so rendered being elsewhere rendered \"cup\" (<a href=\"#\" onClick=\"return mV('Gen',44,2,12,16);\">Gen 44:2, 12, 16</a>), and wine \"pot\" (<a href=\"#\" onClick=\"return mV('Jer',35,5);\">Jer 35:5</a>). The reservoir for oil, from which pipes led to each lamp in Zechariah's vision of the candlestick, is called also by this name (<a href=\"#\" onClick=\"return mV('Zec',4,2,3);\">Zec 4:2-3</a>); so also are the vessels used for libations (<a href=\"#\" onClick=\"return mV('Exd',25,29);\">Exd 25:29</a>; <a href=\"#\" onClick=\"return mV('Exd',37,16);\">37:16</a>).";
eastonArray["$$T0000635"] = "<strong>Box:</strong> for holding oil or perfumery (<a href=\"#\" onClick=\"return mV('Mar',14,3);\">Mar 14:3</a>). It was of the form of a flask or bottle. The Hebrew word (pak) used for it is more appropriately rendered \"vial\" in <a href=\"#\" onClick=\"return mV('1Sa',10,1);\">1Sa 10:1</a>, and should also be so rendered in <a href=\"#\" onClick=\"return mV('2Ki',9,1);\">2Ki 9:1</a>, where alone else it occurs.";
eastonArray["$$T0000636"] = "<strong>Box-tree:</strong> (Heb. teashshur), mentioned in <a href=\"#\" onClick=\"return mV('Isa',60,13);\">Isa 60:13</a>; <a href=\"#\" onClick=\"return mV('Isa',41,19);\">41:19</a>, was, according to some, a species of cedar growing in Lebanon. The words of <a href=\"#\" onClick=\"return mV('Eze',27,6);\">Eze 27:6</a> literally translated are, \"Thy benches they have made of ivory, the daughter of the ashur tree,\" i.e., inlaid with ashur wood. The ashur is the box-tree, and accordingly the Revised Version rightly reads \"inlaid in box wood.\" This is the <i>Buxus sempervirens</i> of botanists. It is remarkable for the beauty of its evergreen foliage and for the utility of its hard and durable wood.";
eastonArray["$$T0000637"] = "<strong>Bozrah:</strong> enclosure; fortress.<br><br>(1.) The city of Jobab, one of the early Edomite kings (<a href=\"#\" onClick=\"return mV('Gen',36,33);\">Gen 36:33</a>). This place is mentioned by the prophets in later times (<a href=\"#\" onClick=\"return mV('Isa',34,6);\">Isa 34:6</a>; <a href=\"#\" onClick=\"return mV('Jer',49,13);\">Jer 49:13</a>; <a href=\"#\" onClick=\"return mV('Amo',1,12);\">Amo 1:12</a>; <a href=\"#\" onClick=\"return mV('Mic',2,12);\">Mic 2:12</a>). Its modern representative is el-Busseireh. It lies in the mountain district of Petra, 20 miles to the south-east of the Dead Sea.<br><br>(2.) A Moabite city in the \"plain country\" (<a href=\"#\" onClick=\"return mV('Jer',48,24);\">Jer 48:24</a>), i.e., on the high level down on the east of the Dead Sea. It is probably the modern Buzrah.";
eastonArray["$$T0000638"] = "<strong>Bracelet:</strong><br><br>(1.) Anklets (<a href=\"#\" onClick=\"return mV('Num',31,50);\">Num 31:50</a>; <a href=\"#\" onClick=\"return mV('2Sa',1,10);\">2Sa 1:10</a>), and with reference to men.<br><br>(2.) The rendering of a Hebrew word meaning fasteners, found in <a href=\"#\" onClick=\"return mV('Gen',24,22,30,47);\">Gen 24:22, 30, 47</a>.<br><br>(3.) In <a href=\"#\" onClick=\"return mV('Isa',3,19);\">Isa 3:19</a>, the rendering of a Hebrew word meaning chains, i.e., twisted or chain-like bracelets.<br><br>(4.) In <a href=\"#\" onClick=\"return mV('Exd',35,22);\">Exd 35:22</a> it designates properly a clasp for fastening the dress of females. Some interpret it as a nose-ring.<br><br>(5.) In <a href=\"#\" onClick=\"return mV('Gen',38,18,25);\">Gen 38:18, 25</a>, the rendering of a Hebrew word meaning \"thread,\" and may denote the ornamental cord with which the signet was suspended from the neck of the wearer.<br><br>Bracelets were worn by men as well as by women (<a href=\"#\" onClick=\"return mV('Sgs',5,14);\">Sgs 5:14</a>, R.V.). They were of many various forms. The weight of those presented by Eliezer to Rebekah was ten shekels (<a href=\"#\" onClick=\"return mV('Gen',24,22);\">Gen 24:22</a>).";
eastonArray["$$T0000639"] = "<strong>Bramble:</strong><br><br>(1.) Hebrew <i>atad</i>, <a href=\"#\" onClick=\"return mV('Jdg',9,14);\">Jdg 9:14</a>; rendered \"thorn,\" <a href=\"#\" onClick=\"return mV('Psa',58,9);\">Psa 58:9</a>. The LXX. and Vulgate render by rhamnus, a thorny shrub common in Palestine, resembling the hawthorn.<br><br>(2.) Hebrew <i>hoah</i>, <a href=\"#\" onClick=\"return mV('Isa',34,13);\">Isa 34:13</a> (R.V. \"thistles\"); \"thickets\" in <a href=\"#\" onClick=\"return mV('1Sa',13,6);\">1Sa 13:6</a>; \"thistles\" in <a href=\"#\" onClick=\"return mV('2Ki',14,9);\">2Ki 14:9</a>; <a href=\"#\" onClick=\"return mV('2Ch',25,18);\">2Ch 25:18</a>; <a href=\"#\" onClick=\"return mV('Job',31,40);\">Job 31:40</a>; \"thorns\" in <a href=\"#\" onClick=\"return mV('2Ch',33,11);\">2Ch 33:11</a>; <a href=\"#\" onClick=\"return mV('Sgs',2,2);\">Sgs 2:2</a>; <a href=\"#\" onClick=\"return mV('Hsa',9,6);\">Hsa 9:6</a>. The word may be regarded as denoting the common thistle, of which there are many species which encumber the corn-fields of Palestine. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003642');\">THORNS</a>.)";
eastonArray["$$T0000640"] = "<strong>Branch:</strong> a symbol of kings descended from royal ancestors (<a href=\"#\" onClick=\"return mV('Eze',17,3,10);\">Eze 17:3, 10</a>; <a href=\"#\" onClick=\"return mV('Dan',11,7);\">Dan 11:7</a>); of prosperity (<a href=\"#\" onClick=\"return mV('Job',8,16);\">Job 8:16</a>); of the Messiah, a branch out of the root of the stem of Jesse (<a href=\"#\" onClick=\"return mV('Isa',11,1);\">Isa 11:1</a>), the \"beautiful branch\" (<a href=\"#\" onClick=\"return mV('Isa',4,2);\">4:2</a>), a \"righteous branch\" (<a href=\"#\" onClick=\"return mV('Jer',23,5);\">Jer 23:5</a>), \"the Branch\" (<a href=\"#\" onClick=\"return mV('Zec',3,8);\">Zec 3:8</a>; <a href=\"#\" onClick=\"return mV('Zec',6,12);\">6:12</a>).<br><br>Disciples are branches of the true vine (<a href=\"#\" onClick=\"return mV('Jhn',15,5,6);\">Jhn 15:5-6</a>). \"The branch of the terrible ones\" (<a href=\"#\" onClick=\"return mV('Isa',25,5);\">Isa 25:5</a>) is rightly translated in the Revised Version \"the song of the terrible ones,\" i.e., the song of victory shall be brought low by the destruction of Babylon and the return of the Jews from captivity.<br><br>The \"abominable branch\" is a tree on which a malefactor has been hanged (<a href=\"#\" onClick=\"return mV('Isa',14,19);\">Isa 14:19</a>). The \"highest branch\" in <a href=\"#\" onClick=\"return mV('Eze',17,3);\">Eze 17:3</a> represents Jehoiakim the king.";
eastonArray["$$T0000641"] = "<strong>Brass:</strong> which is an alloy of copper and zinc, was not known till the thirteenth century. What is designated by this word in Scripture is properly copper (<a href=\"#\" onClick=\"return mV('Deu',8,9);\">Deu 8:9</a>). It was used for fetters (<a href=\"#\" onClick=\"return mV('Jdg',16,21);\">Jdg 16:21</a>; <a href=\"#\" onClick=\"return mV('2Ki',25,7);\">2Ki 25:7</a>), for pieces of armour (<a href=\"#\" onClick=\"return mV('1Sa',17,5,6);\">1Sa 17:5-6</a>), for musical instruments (<a href=\"#\" onClick=\"return mV('1Ch',15,19);\">1Ch 15:19</a>; <a href=\"#\" onClick=\"return mV('1Cr',13,1);\">1Cr 13:1</a>), and for money (<a href=\"#\" onClick=\"return mV('Mat',10,9);\">Mat 10:9</a>).<br><br>It is a symbol of insensibility and obstinacy in sin (<a href=\"#\" onClick=\"return mV('Isa',48,4);\">Isa 48:4</a>; <a href=\"#\" onClick=\"return mV('Jer',6,28);\">Jer 6:28</a>; <a href=\"#\" onClick=\"return mV('Eze',22,18);\">Eze 22:18</a>), and of strength (<a href=\"#\" onClick=\"return mV('Psa',107,16);\">Psa 107:16</a>; <a href=\"#\" onClick=\"return mV('Mic',4,13);\">Mic 4:13</a>).<br><br>The Macedonian empire is described as a kingdom of brass (<a href=\"#\" onClick=\"return mV('Dan',2,39);\">Dan 2:39</a>). The \"mountains of brass\" Zechariah (<a href=\"#\" onClick=\"return mV('Zec',6,1);\">Zec 6:1</a>) speaks of have been supposed to represent the immutable decrees of God.<br><br>The serpent of brass was made by Moses at the command of God (<a href=\"#\" onClick=\"return mV('Num',21,'4-9');\">Num 21:4-9</a>), and elevated on a pole, so that it might be seen by all the people when wounded by the bite of the serpents that were sent to them as a punishment for their murmurings against God and against Moses. It was afterwards carried by the Jews into Canaan, and preserved by them till the time of Hezekiah, who caused it to be at length destroyed because it began to be viewed by the people with superstitious reverence (<a href=\"#\" onClick=\"return mV('2Ki',18,4);\">2Ki 18:4</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002700');\">NEHUSHTAN</a>.)<br><br>The brazen serpent is alluded to by our Lord in <a href=\"#\" onClick=\"return mV('Jhn',3,14,15);\">Jhn 3:14-15</a>. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003287');\">SERPENT</a>.)";
eastonArray["$$T0000642"] = "<strong>Bravery:</strong> (<a href=\"#\" onClick=\"return mV('Isa',3,18);\">Isa 3:18</a>), an old English word meaning comeliness or beauty.";
eastonArray["$$T0000643"] = "<strong>Breach:</strong> an opening in a wall (<a href=\"#\" onClick=\"return mV('1Ki',11,27);\">1Ki 11:27</a>; <a href=\"#\" onClick=\"return mV('2Ki',12,5);\">2Ki 12:5</a>); the fracture of a limb (<a href=\"#\" onClick=\"return mV('Lev',24,20);\">Lev 24:20</a>), and hence the expression, \"Heal, etc.\" (<a href=\"#\" onClick=\"return mV('Psa',60,2);\">Psa 60:2</a>). <a href=\"#\" onClick=\"return mV('Jdg',5,17);\">Jdg 5:17</a>, a bay or harbour; R.V., \"by his creeks.\"";
eastonArray["$$T0000644"] = "<strong>Bread:</strong> among the Jews was generally made of wheat (<a href=\"#\" onClick=\"return mV('Exd',29,2);\">Exd 29:2</a>; <a href=\"#\" onClick=\"return mV('Jdg',6,19);\">Jdg 6:19</a>), though also sometimes of other grains (<a href=\"#\" onClick=\"return mV('Gen',14,18);\">Gen 14:18</a>; <a href=\"#\" onClick=\"return mV('Jdg',7,13);\">Jdg 7:13</a>). Parched grain was sometimes used for food without any other preparation (<a href=\"#\" onClick=\"return mV('Rth',2,14);\">Rth 2:14</a>).<br><br>Bread was prepared by kneading in wooden bowls or \"kneading troughs\" (<a href=\"#\" onClick=\"return mV('Gen',18,6);\">Gen 18:6</a>; <a href=\"#\" onClick=\"return mV('Exd',12,34);\">Exd 12:34</a>; <a href=\"#\" onClick=\"return mV('Jer',7,18);\">Jer 7:18</a>). The dough was mixed with leaven and made into thin cakes, round or oval, and then baked. The bread eaten at the Passover was always unleavened (<a href=\"#\" onClick=\"return mV('Exd',12,'15-20');\">Exd 12:15-20</a>; <a href=\"#\" onClick=\"return mV('Deu',16,3);\">Deu 16:3</a>). In the towns there were public ovens, which were much made use of for baking bread; there were also bakers by trade (<a href=\"#\" onClick=\"return mV('Hsa',7,4);\">Hsa 7:4</a>; <a href=\"#\" onClick=\"return mV('Jer',37,21);\">Jer 37:21</a>). Their ovens were not unlike those of modern times. But sometimes the bread was baked by being placed on the ground that had been heated by a fire, and by covering it with the embers (<a href=\"#\" onClick=\"return mV('1Ki',19,6);\">1Ki 19:6</a>). This was probably the mode in which Sarah prepared bread on the occasion referred to in <a href=\"#\" onClick=\"return mV('Gen',18,6);\">Gen 18:6</a>.<br><br>In <a href=\"#\" onClick=\"return mV('Lev',2,'1-'6);\">Lev 2</a> there is an account of the different kinds of bread and cakes used by the Jews. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000419');\">BAKE</a>.)<br><br>The shew-bread (q.v.) consisted of twelve loaves of unleavened bread prepared and presented hot on the golden table every Sabbath. They were square or oblong, and represented the twelve tribes of Israel. The old loaves were removed every Sabbath, and were to be eaten only by the priests in the court of the sanctuary (<a href=\"#\" onClick=\"return mV('Exd',25,30);\">Exd 25:30</a>; <a href=\"#\" onClick=\"return mV('Lev',24,8);\">Lev 24:8</a>; <a href=\"#\" onClick=\"return mV('1Sa',21,'1-6');\">1Sa 21:1-6</a>; <a href=\"#\" onClick=\"return mV('Mat',12,4);\">Mat 12:4</a>).<br><br>The word bread is used figuratively in such expressions as \"bread of sorrows\" (<a href=\"#\" onClick=\"return mV('Psa',127,2);\">Psa 127:2</a>), \"bread of tears\" (<a href=\"#\" onClick=\"return mV('Psa',80,5);\">80:5</a>), i.e., sorrow and tears are like one's daily bread, they form so great a part in life. The bread of \"wickedness\" (<a href=\"#\" onClick=\"return mV('Pro',4,17);\">Pro 4:17</a>) and \"of deceit\" (<a href=\"#\" onClick=\"return mV('Pro',20,17);\">20:17</a>) denote in like manner that wickedness and deceit are a part of the daily life.";
eastonArray["$$T0000645"] = "<strong>Breastplate:</strong><br><br>(1.) That piece of ancient armour that protected the breast. This word is used figuratively in <a href=\"#\" onClick=\"return mV('Eph',6,14);\">Eph 6:14</a> and <a href=\"#\" onClick=\"return mV('Isa',59,17);\">Isa 59:17</a>. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000315');\">ARMOUR</a>.)<br><br>(2.) An ornament covering the breast of the high priest, first mentioned in <a href=\"#\" onClick=\"return mV('Exd',25,7);\">Exd 25:7</a>. It was made of embroidered cloth, set with four rows of precious stones, three in each row. On each stone was engraved the name of one of the twelve tribes (<a href=\"#\" onClick=\"return mV('Exd',28,'15-29');\">Exd 28:15-29</a>; <a href=\"#\" onClick=\"return mV('Exd',39,'8-21');\">39:8-21</a>). It was in size about ten inches square. The two upper corners were fastened to the ephod by blue ribbons. It was not to be \"loosed from the ephod\" (<a href=\"#\" onClick=\"return mV('Exd',28,28);\">Exd 28:28</a>). The lower corners were fastened to the girdle of the priest. As it reminded the priest of his representative character, it was called the memorial (<a href=\"#\" onClick=\"return mV('Exd',28,29);\">28:29</a>). It was also called the breastplate of judgment (<a href=\"#\" onClick=\"return mV('Exd',28,15);\">28:15</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0003001');\">PRIEST</a>.)";
eastonArray["$$T0000646"] = "<strong>Breeches:</strong> (<a href=\"#\" onClick=\"return mV('Exd',28,42);\">Exd 28:42</a>), rather linen drawers, reaching from the waist to a little above the knee, worn by the priests (<a href=\"#\" onClick=\"return mV('Eze',44,17,18);\">Eze 44:17-18</a>).";
eastonArray["$$T0000647"] = "<strong>Bribe:</strong> None to be taken; \"for the gift maketh open eyes blind, and perverteth the cause of the righteous\" (<a href=\"#\" onClick=\"return mV('Exd',23,8);\">Exd 23:8</a>, literally rendered).";
eastonArray["$$T0000648"] = "<strong>Bricks:</strong> the making of, formed the chief labour of the Israelites in Egypt (<a href=\"#\" onClick=\"return mV('Exd',1,13,14);\">Exd 1:13-14</a>). Those found among the ruins of Babylon and Nineveh are about a foot square and four inches thick. They were usually dried in the sun, though also sometimes in kilns (<a href=\"#\" onClick=\"return mV('2Sa',12,31);\">2Sa 12:31</a>; <a href=\"#\" onClick=\"return mV('Jer',43,9);\">Jer 43:9</a>; <a href=\"#\" onClick=\"return mV('Nah',3,14);\">Nah 3:14</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002684');\">NEBUCHADNEZZAR</a>.)<br><br>The bricks used in the tower of Babel were burnt bricks, cemented in the building by bitumen (<a href=\"#\" onClick=\"return mV('Gen',11,3);\">Gen 11:3</a>).";
eastonArray["$$T0000649"] = "<strong>Bride:</strong> frequently used in the ordinary sense (<a href=\"#\" onClick=\"return mV('Isa',49,18);\">Isa 49:18</a>; <a href=\"#\" onClick=\"return mV('Isa',61,10);\">61:10</a>, etc.). The relation between Christ and his church is set forth under the figure of that between a bridegroom and bride (<a href=\"#\" onClick=\"return mV('Jhn',3,29);\">Jhn 3:29</a>). The church is called \"the bride\" (<a href=\"#\" onClick=\"return mV('Rev',21,9);\">Rev 21:9</a>; <a href=\"#\" onClick=\"return mV('Rev',22,17);\">22:17</a>). Compare parable of the Ten Virgins (<a href=\"#\" onClick=\"return mV('Mat',25,'1-13');\">Mat 25:1-13</a>).";
