<script>
 var eastonArray = new Array ();
 eastonArray["$$T0000001"] = "<b>A:</b> Alpha, the first letter of the Greek alphabet, as Omega is the last. These letters occur in the text of (<a href=\"#\" onClick=\"return mV('Rev',1,8,11);\">Rev 1:8, 11</a>; <a href=\"#\" onClick=\"return mV('Rev',21,6);\">21:6</a>; <a href=\"#\" onClick=\"return mV('Rev',22,13);\">22:13</a>), and are represented by \"Alpha\" and \"Omega\" respectively [omitted in R.V.] (<a href=\"#\" onClick=\"return mV('Rev',1,11);\">1:11</a>). They mean \"the first and last.\" (<a href=\"#\" onClick=\"return mV('Hbr',12,2);\">Hbr 12:2</a>; <a href=\"#\" onClick=\"return mV('Isa',41,4);\">Isa 41:4</a>; <a href=\"#\" onClick=\"return mV('Isa',44,6);\">44:6</a>; <a href=\"#\" onClick=\"return mV('Rev',1,11,17);\">Rev 1:11, 17</a>; <a href=\"#\" onClick=\"return mV('Rev',2,8);\">2:8</a>.) In the symbols of the early Christian Church these two letters are frequently combined with the cross or with Christ's monogram to denote his divinity.";
 eastonArray["$$T0000002"] = "<b>Aaron:</b> the eldest son of Amram and Jochebed, a daughter of Levi (<a href=\"#\" onClick=\"return mV('Exd',6,20);\">Exd 6:20</a>). Some explain the name as meaning mountaineer, others mountain of strength, illuminator. He was born in Egypt three years before his brother Moses, and a number of years after his sister Miriam (<a href=\"#\" onClick=\"return mV('Exd',2,1,4);\">2:1, 4</a>; <a href=\"#\" onClick=\"return mV('Exd',7,7);\">7:7</a>). He married Elisheba, the daughter of Amminadab of the house of Judah (<a href=\"#\" onClick=\"return mV('Exd',6,23);\">6:23</a>; <a href=\"#\" onClick=\"return mV('1Ch',2,10);\">1Ch 2:10</a>), by whom he had four sons, Nadab and Abihu, Eleazar and Ithamar. When the time for the deliverance of Israel out of Egypt drew nigh, he was sent by God (<a href=\"#\" onClick=\"return mV('Exd',4,14,'27-30');\">Exd 4:14, 27-30</a>) to meet his long-absent brother, that he might co-operate with him in all that they were required to do in bringing about the Exodus. He was to be the \"mouth\" or \"prophet\" of Moses, i.e., was to speak for him, because he was a man of a ready utterance (<a href=\"#\" onClick=\"return mV('Exd',7,'1-2','9-10',19);\">7:1-2, 9-10, 19</a>). He was faithful to his trust, and stood by Moses in all his interviews with Pharaoh.<br><br>When the ransomed tribes fought their first battle with Amalek in Rephidim, Moses stood on a hill overlooking the scene of the conflict with the rod of God in his outstretched hand. On this occasion he was attended by Aaron and Hur, his sister's husband, who held up his wearied hands till Joshua and the chosen warriors of Israel gained the victory (<a href=\"#\" onClick=\"return mV('Exd',17,'8-13');\">17:8-13</a>).<br><br>Afterwards, when encamped before Sinai, and when Moses at the command of God ascended the mount to receive the tables of the law, Aaron and his two sons, Nadab and Abihu, along with seventy of the elders of Israel, were permitted to accompany him part of the way, and to behold afar off the manifestation of the glory of Israel's God (<a href=\"#\" onClick=\"return mV('Exd',19,24);\">Exd 19:24</a>; <a href=\"#\" onClick=\"return mV('Exd',24,'9-11');\">24:9-11</a>). While Moses remained on the mountain with God, Aaron returned unto the people; and yielding through fear, or ignorance, or instability of character, to their clamour, made unto them a golden calf, and set it up as an object of worship (<a href=\"#\" onClick=\"return mV('Exd',32,4);\">Exd 32:4</a>; <a href=\"#\" onClick=\"return mV('Psa',106,19);\">Psa 106:19</a>). On the return of Moses to the camp, Aaron was sternly rebuked by him for the part he had acted in this matter; but he interceded for him before God, who forgave his sin (<a href=\"#\" onClick=\"return mV('Deu',9,20);\">Deu 9:20</a>).<br><br>On the mount, Moses received instructions regarding the system of worship which was to be set up among the people; and in accordance therewith Aaron and his sons were consecrated to the priest's office (<a href=\"#\" onClick=\"return mV('Lev',8,'1-')\">Lev 8</a>; <a href=\"#\" onClick=\"return mV('Lev',9,'1-')\">9</a>). Aaron, as high priest, held henceforth the prominent place appertaining to that office.<br><br>When Israel had reached Hazeroth, in \"the wilderness of Paran,\" Aaron joined with his sister Miriam in murmuring against Moses, \"because of the Ethiopian woman whom he had married,\" probably after the death of Zipporah. But the Lord vindicated his servant Moses, and punished Miriam with leprosy (<a href=\"#\" onClick=\"return mV('Num',12,'1-')\">Num 12</a>). Aaron acknowledged his own and his sister's guilt, and at the intercession of Moses they were forgiven.<br><br>Twenty years after this, when the children of Israel were encamped in the wilderness of Paran, Korah, Dathan, and Abiram conspired against Aaron and his sons; but a fearful judgment from God fell upon them, and they were destroyed, and the next day thousands of the people also perished by a fierce pestilence, the ravages of which were only stayed by the interposition of Aaron (<a href=\"return mV('Num',16,'1-')\">Num 16</a>). That there might be further evidence of the divine appointment of Aaron to the priestly office, the chiefs of the tribes were each required to bring to Moses a rod bearing on it the name of his tribe. And these, along with the rod of Aaron for the tribe of Levi, were laid up overnight in the tabernacle, and in the morning it was found that while the other rods remained unchanged, that of Aaron \"for the house of Levi\" budded, blossomed, and yielded almonds (<a href=\"#\" onClick=\"return mV('Num',17,'1-10');\">Num 17:1-10</a>). This rod was afterwards preserved in the tabernacle (<a href=\"#\" onClick=\"return mV('Hbr',9,4);\">Hbr 9:4</a>) as a memorial of the divine attestation of his appointment to the priesthood.<br><br>Aaron was implicated in the sin of his brother at Meribah (<a href=\"#\" onClick=\"return mV('Num',20,'8-13');\">Num 20:8-13</a>), and on that account was not permitted to enter the Promised Land. When the tribes arrived at Mount Hor, \"in the edge of the land of Edom,\" at the command of God, Moses led Aaron and his son Eleazar to the top of that mountain, in the sight of all the people. There he stripped Aaron of his priestly vestments, and put them upon Eleazar; and there Aaron died on the top of the mount, being 123 years old (<a href=\"#\" onClick=\"return mV('Num',20,'23-29');\">Num 20:23-29</a>; <a href=\"#\" onClick=\"return mV('Deu',10,6);\">Deu 10:6</a>; <a href=\"#\" onClick=\"return mV('Deu',32,50);\">32:50</a>), and was \"gathered unto his people.\" The people, \"even all the house of Israel,\" mourned for him thirty days. Of Aaron's sons two survived him, Eleazar, whose family held the high-priesthood till the time of Eli; and Ithamar, in whose family, beginning with Eli, the high-priesthood was held till the time of Solomon. Aaron's other two sons had been struck dead (<a href=\"#\" onClick=\"return mV('Lev',10,'1-2');\">Lev 10:1-2</a>) for the daring impiety of offering \"strange fire\" on the alter of incense.<br><br>The Arabs still show with veneration the traditionary site of Aaron's grave on one of the two summits of Mount Hor, which is marked by a Mohammedan chapel. His name is mentioned in the Koran, and there are found in the writings of the rabbins many fabulous stories regarding him.<br><br>He was the first anointed priest. His descendants, \"the house of Aaron,\" constituted the priesthood in general. In the time of David they were very numerous (<a href=\"#\" onClick=\"return mV('1Ch',12,27);\">1Ch 12:27</a>). The other branches of the tribe of Levi held subordinate positions in connection with the sacred office. Aaron was a type of Christ in his official character as the high priest. His priesthood was a \"shadow of heavenly things,\" and was intended to lead the people of Israel to look forward to the time when \"another priest\" would arise \"after the order of Melchizedek\" (<a href=\"#\" onClick=\"return mV('Hbr',6,20);\">Hbr 6:20</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002602');\">MOSES</a>.)";
 eastonArray["$$T0000003"] = "<b>Aaronites:</b> the descendants of Aaron, and therefore priests. Jehoiada, the father of Benaiah, led 3,700 Aaronites as \"fighting men\" to the support of David at Hebron (<a href=\"#\" onClick=\"return mV('1Ch',12,27);\">1Ch 12:27</a>). Eleazar (<a href=\"#\" onClick=\"return mV('Num',3,32);\">Num 3:32</a>), and at a later period Zadok (<a href=\"#\" onClick=\"return mV('1Ch',27,17);\">1Ch 27:17</a>), was their chief.";
 eastonArray["$$T0000004"] = "<b>Abaddon:</b> destruction, the Hebrew name (equivalent to the Greek Apollyon, i.e., destroyer) of \"the angel of the bottomless pit\" (<a href=\"#\" onClick=\"return mV('Rev',9,11);\">Rev 9:11</a>). It is rendered \"destruction\" in (<a href=\"#\" onClick=\"return mV('Job',28,22);\">Job 28:22</a>; <a href=\"#\" onClick=\"return mV('Job',31,12);\">31:12</a>; <a href=\"#\" onClick=\"return mV('Job',26,6);\">26:6</a>; <a href=\"#\" onClick=\"return mV('Pro',15,11);\">Pro 15:11</a>; <a href=\"#\" onClick=\"return mV('Pro',27,20);\">27:20</a>). In the last three of these passages the Revised Version retains the word \"Abaddon.\" We may regard this word as a personification of the idea of destruction, or as Sheol, the realm of the dead.";
 eastonArray["$$T0000005"] = "<b>Abagtha:</b> one of the seven eunuchs in Ahasuerus's court (<a href=\"#\" onClick=\"return mV('Est',1,10);\">Est 1:10</a>; <a href=\"#\" onClick=\"return mV('Est',2,21);\">2:21</a>).";
 eastonArray["$$T0000006"] = "<b>Abana:</b> stony (Heb. marg. \"Amanah,\" perennial), the chief river of Damascus (<a href=\"#\" onClick=\"return mV('2Ki',5,12);\">2Ki 5:12</a>). Its modern name is Barada, the Chrysorrhoas, or \"golden stream,\" of the Greeks. It rises in a cleft of the Anti-Lebanon range, about 23 miles north-west of Damascus, and after flowing southward for a little way parts into three smaller streams, the central one flowing through Damascus, and the other two on each side of the city, diffusing beauty and fertility where otherwise there would be barrenness.";
 eastonArray["$$T0000007"] = "<b>Abarim:</b> regions beyond; i.e., on the east of Jordan, a mountain, or rather a mountain-chain, over against Jericho, to the east and south-east of the Dead Sea, in the land of Moab. From \"the top of Pisgah\", i.e., Mount Nebo (q.v.), one of its summits, Moses surveyed the Promised Land (<a href=\"#\" onClick=\"return mV('Deu',3,27);\">Deu 3:27</a>; <a href=\"#\" onClick=\"return mV('Deu',32,49);\">32:49</a>), and there he died (<a href=\"#\" onClick=\"return mV('Deu',34,1,5);\">34:1, 5</a>). The Israelites had one of their encampments in the mountains of Abarim (<a href=\"#\" onClick=\"return mV('Num',33,47,48);\">Num 33:47-48</a>) after crossing the Arnon.";
 eastonArray["$$T0000008"] = "<b>Abba:</b> This Syriac or Chaldee word is found three times in the New Testament (<a href=\"#\" onClick=\"return mV('Mar',14,36);\">Mar 14:36</a>; <a href=\"#\" onClick=\"return mV('Rom',8,15);\">Rom 8:15</a>; <a href=\"#\" onClick=\"return mV('Gal',4,6);\">Gal 4:6</a>), and in each case is followed by its Greek equivalent, which is translated \"father.\" It is a term expressing warm affection and filial confidence. It has no perfect equivalent in our language. It has passed into European languages as an ecclesiastical term, \"abbot.\"";
 eastonArray["$$T0000009"] = "<b>Abda:</b> servant.<br><br>(1.) The father of Adoniram, whom Solomon set over the tribute (<a href=\"#\" onClick=\"return mV('1Ki',4,6);\">1Ki 4:6</a>); i.e., the forced labour (R.V., \"levy\").<br><br>(2.) A Levite of the family of Jeduthun (<a href=\"#\" onClick=\"return mV('Neh',11,17);\">Neh 11:17</a>), also called Obadiah (<a href=\"#\" onClick=\"return mV('1Ch',9,16);\">1Ch 9:16</a>).";
 eastonArray["$$T0000010"] = "<b>Abdeel:</b> servant of God, (<a href=\"#\" onClick=\"return mV('Jer',36,26);\">Jer 36:26</a>), the father of Shelemiah.";
 eastonArray["$$T0000011"] = "<b>Abdi:</b> my servant.<br><br>(1.) <a href=\"#\" onClick=\"return mV('1Ch',6,44);\">1Ch 6:44</a>.<br><br>(2.) <a href=\"#\" onClick=\"return mV('2Ch',29,12);\">2Ch 29:12</a>. (3.) Ezra 10:26.";
 eastonArray["$$T0000012"] = "<b>Abdiel:</b> servant of God, (<a href=\"#\" onClick=\"return mV('1Ch',5,15);\">1Ch 5:15</a>), a Gadite chief.";
 eastonArray["$$T0000013"] = "<b>Abdon:</b> servile.<br><br>(1.) The son of Hillel, a Pirathonite, the tenth judge of Israel (<a href=\"#\" onClick=\"return mV('Jdg',12,'13-15');\">Jdg 12:13-15</a>). He is probably the Bedan of <a href=\"#\" onClick=\"return mV('1Sa',12,11);\">1Sa 12:11</a>.<br><br>(2.) The first-born of Gibeon of the tribe of Benjamin (<a href=\"#\" onClick=\"return mV('1Ch',8,30);\">1Ch 8:30</a>; <a href=\"#\" onClick=\"return mV('1Ch',9,36);\">9:36</a>).<br><br>(3.) The son of Micah, one of those whom Josiah sent to the prophetess Huldah to ascertain from her the meaning of the recently discovered book of the law (<a href=\"#\" onClick=\"return mV('2Ch',34,20);\">2Ch 34:20</a>). He is called Achbor in <a href=\"#\" onClick=\"return mV('2Ki',22,12);\">2Ki 22:12</a>.<br><br>(4.) One of the \"sons\" of Shashak (<a href=\"#\" onClick=\"return mV('1Ch',8,23);\">1Ch 8:23</a>).<br><br>This is the name also of a Levitical town of the Gershonites, in the tribe of Asher (<a href=\"#\" onClick=\"return mV('Jos',21,30);\">Jos 21:30</a>; <a href=\"#\" onClick=\"return mV('1Ch',6,74);\">1Ch 6:74</a>). The ruins of Abdeh, some 8 miles north-east of Accho, probably mark its site.";
 eastonArray["$$T0000014"] = "<b>Abednego:</b> servant of Nego=Nebo, the Chaldee name given to Azariah, one of Daniel's three companions (<a href=\"#\" onClick=\"return mV('Dan',2,49);\">Dan 2:49</a>). With Shadrach and Meshach, he was delivered from the burning fiery furnace (<a href=\"#\" onClick=\"return mV('Dan',3,'12-30');\">Dan 3:12-30</a>).";
 eastonArray["$$T0000015"] = "<b>Abel:</b> (Heb. Hebhel), a breath, or vanity, the second son of Adam and Eve. He was put to death by his brother Cain (<a href=\"#\" onClick=\"return mV('Gen',4,'1-16');\">Gen 4:1-16</a>). Guided by the instruction of their father, the two brothers were trained in the duty of worshipping God. \"And in process of time\" (marg. \"at the end of days\", i.e., on the Sabbath) each of them offered up to God of the first-fruits of his labours. Cain, as a husbandman, offered the fruits of the field; Abel, as a shepherd, of the firstlings of his flock. \"The Lord had respect unto Abel and his offering; but unto Cain and his offering he had not respect\" (<a href=\"#\" onClick=\"return mV('Gen',4,'3-5');\">Gen 4:3-5</a>). On this account Cain was angry with his brother, and formed the design of putting him to death; a design which he at length found an opportunity of carrying into effect (<a href=\"#\" onClick=\"return mV('Gen',4,'8-9');\">Gen 4:8-9</a>. Comp. <a href=\"#\" onClick=\"return mV('1Jo',3,12);\">1Jo 3:12</a>). There are several references to Abel in the New Testament. Our Saviour speaks of him as \"righteous\" (<a href=\"#\" onClick=\"return mV('Mat',23,35);\">Mat 23:35</a>). \"The blood of sprinkling\" is said to speak \"better things than that of Abel\" (<a href=\"#\" onClick=\"return mV('Hbr',12,24);\">Hbr 12:24</a>); i.e., the blood of Jesus is the reality of which the blood of the offering made by Abel was only the type. The comparison here is between the sacrifice offered by Christ and that offered by Abel, and not between the blood of Christ calling for mercy and the blood of the murdered Abel calling for vengeance, as has sometimes been supposed. It is also said (<a href=\"#\" onClick=\"return mV('Hbr',11,4);\">Hbr 11:4</a>) that \"Abel offered unto God a more excellent sacrifice than Cain.\" This sacrifice was made \"by faith;\" this faith rested in God, not only as the Creator and the God of providence, but especially in God as the great Redeemer, whose sacrifice was typified by the sacrifices which, no doubt by the divine institution, were offered from the days of Adam downward. On account of that \"faith\" which looked forward to the great atoning sacrifice, Abel's offering was accepted of God. Cain's offering had no such reference, and therefore was rejected. Abel was the first martyr, as he was the first of our race to die.<br><br>Abel (Heb. 'abhel), lamentation (<a href=\"#\" onClick=\"return mV('1Sa',6,18);\">1Sa 6:18</a>), the name given to the great stone in Joshua's field whereon the ark was \"set down.\" The Revised Version, however, following the Targum and the LXX., reads in the Hebrew text <i>'ebhen</i> (= a stone), and accordingly translates \"unto the great stone, whereon they set down the ark.\" This reading is to be preferred.<br><br>Abel (Heb. <i>'abhel</i>), a grassy place, a meadow. This word enters into the composition of the following words:";
 eastonArray["$$T0000016"] = "<b>Abel-beth-maachah:</b> meadow of the house of Maachah, a city in the north of Palestine, in the neighbourhood of Dan and Ijon, in the tribe of Naphtali. It was a place of considerable strength and importance. It is called a \"mother in Israel\", i.e., a metropolis (<a href=\"#\" onClick=\"return mV('2Sa',20,19);\">2Sa 20:19</a>). It was besieged by Joab (<a href=\"#\" onClick=\"return mV('2Sa',20,14);\">2Sa 20:14</a>), by Benhadad (<a href=\"#\" onClick=\"return mV('1Ki',15,20);\">1Ki 15:20</a>), and by Tiglath-pileser (<a href=\"#\" onClick=\"return mV('2Ki',15,29);\">2Ki 15:29</a>) about B.C. 734. It is elsewhere called Abel-maim, meadow of the waters, (<a href=\"#\" onClick=\"return mV('2Ch',16,4);\">2Ch 16:4</a>). Its site is occupied by the modern Abil or Abil-el-kamh, on a rising ground to the east of the brook Derdarah, which flows through the plain of Huleh into the Jordan, about 6 miles to the west-north-west of Dan.";
 eastonArray["$$T0000017"] = "<b>Abel-cheramim:</b> (<a href=\"#\" onClick=\"return mV('Jdg',11,33);\">Jdg 11:33</a>, R.V.; A. V., \"plain of the vineyards\"), a village of the Ammonites, whither Jephthah pursued their forces.";
 eastonArray["$$T0000018"] = "<b>Abel-meholah:</b> meadow of dancing, or the dancing-meadow, the birth-place and residence of the prophet Elisha, not far from Beth-shean (<a href=\"#\" onClick=\"return mV('1Ki',4,12);\">1Ki 4:12</a>), in the tribe of Issachar, near where the Wady el-Maleh emerges into the valley of the Jordan, \"the rich meadow-land which extends about 4 miles south of Beth-shean; moist and luxuriant.\" Here Elisha was found at his plough by Elijah on his return up the Jordan valley from Horeb (<a href=\"#\" onClick=\"return mV('1Ki',19,16);\">1Ki 19:16</a>). It is now called 'Ain Helweh.";
 eastonArray["$$T0000019"] = "<b>Abel-mizraim:</b> meadow of Egypt, or mourning of Egypt, a place \"beyond,\" i.e., on the west of Jordan, at the \"threshing-floor of Atad.\" Here the Egyptians mourned seventy days for Jacob (<a href=\"#\" onClick=\"return mV('Gen',50,'4-11');\">Gen 50:4-11</a>). Its site is unknown.";
 eastonArray["$$T0000020"] = "<b>Abel-shittim:</b> meadow of the acacias, frequently called simply \"Shittim\" (<a href=\"#\" onClick=\"return mV('Num',25,1);\">Num 25:1</a>; <a href=\"#\" onClick=\"return mV('Jos',2,1);\">Jos 2:1</a>; <a href=\"#\" onClick=\"return mV('Mic',6,5);\">Mic 6:5</a>), a place on the east of Jordan, in the plain of Moab, nearly opposite Jericho. It was the forty-second encampment of the Israelites, their last resting-place before they crossed the Jordan (<a href=\"#\" onClick=\"return mV('Num',33,49);\">Num 33:49</a>; <a href=\"#\" onClick=\"return mV('Num',22,1);\">22:1</a>; <a href=\"#\" onClick=\"return mV('Num',26,3);\">26:3</a>; <a href=\"#\" onClick=\"return mV('Num',31,12);\">31:12</a>; <a href=\"#\" onClick=\"return mV('Num',25,1);\">Num 25:1</a>; <a href=\"#\" onClick=\"return mV('Num',31,16);\">31:16</a>).";
 eastonArray["$$T0000021"] = "<b>Abez:</b> tin, or white, a town in the tribe of Issachar (<a href=\"#\" onClick=\"return mV('Jos',19,20);\">Jos 19:20</a>), at the north of the plain of Esdraelon. It is probably identified with the ruins of el-Beida.";
 eastonArray["$$T0000022"] = "<b>Abia:</b> my father is the Lord, the Greek form of Abijah, or Abijam (<a href=\"#\" onClick=\"return mV('Mat',1,7);\">Mat 1:7</a>), instead of Abiah (<a href=\"#\" onClick=\"return mV('1Ch',7,8);\">1Ch 7:8</a>). In <a href=\"#\" onClick=\"return mV('Luk',1,5);\">Luk 1:5</a>, the name refers to the head of the eighth of the twenty-four courses into which David divided the priests (<a href=\"#\" onClick=\"return mV('1Ch',24,10);\">1Ch 24:10</a>).";
 eastonArray["$$T0000023"] = "<b>Abi-albon:</b> father of strength; i.e., \"valiant\", one of David's body-guard of thirty mighty men (<a href=\"#\" onClick=\"return mV('2Sa',23,31);\">2Sa 23:31</a>); called also Abiel (<a href=\"#\" onClick=\"return mV('1Ch',11,32);\">1Ch 11:32</a>).";
 eastonArray["$$T0000024"] = "<b>Abiasaph:</b> father of gathering; the gatherer, the youngest of the three sons of Korah the Levite, head of a family of Korhites (<a href=\"#\" onClick=\"return mV('Exd',6,24);\">Exd 6:24</a>); called Ebisaph (<a href=\"#\" onClick=\"return mV('1Ch',6,37);\">1Ch 6:37</a>).";
 eastonArray["$$T0000025"] = "<b>Abiathar:</b> father of abundance, or my father excels, the son of Ahimelech the high priest. He was the tenth high priest, and the fourth in descent from Eli. When his father was slain with the priests of Nob, he escaped, and bearing with him the ephod, he joined David, who was then in the cave of Adullam (<a href=\"#\" onClick=\"return mV('1Sa',22,'20-23');\">1Sa 22:20-23</a>; <a href=\"#\" onClick=\"return mV('1Sa',23,6);\">23:6</a>). He remained with David, and became priest of the party of which he was the leader (<a href=\"#\" onClick=\"return mV('1Sa',30,7);\">1Sa 30:7</a>). When David ascended the throne of Judah, Abiathar was appointed high priest (<a href=\"#\" onClick=\"return mV('1Ch',15,11);\">1Ch 15:11</a>; <a href=\"#\" onClick=\"return mV('1Ki',2,26);\">1Ki 2:26</a>) and the \"king's companion\" (<a href=\"#\" onClick=\"return mV('1Ch',27,34);\">1Ch 27:34</a>). Meanwhile Zadok, of the house of Eleazar, had been made high priest. These appointments continued in force till the end of David's reign (<a href=\"#\" onClick=\"return mV('1Ki',4,4);\">1Ki 4:4</a>). Abiathar was deposed (the sole historical instance of the deposition of a high priest) and banished to his home at Anathoth by Solomon, because he took part in the attempt to raise Adonijah to the throne. The priesthood thus passed from the house of Ithamar (<a href=\"#\" onClick=\"return mV('1Sa',2,'30-36');\">1Sa 2:30-36</a>; <a href=\"#\" onClick=\"return mV('1Ki',1,19);\">1Ki 1:19</a>; <a href=\"#\" onClick=\"return mV('1Ki',2,'26-27');\">2:26-27</a>). Zadok now became sole high priest. In <a href=\"#\" onClick=\"return mV('Mar',2,26);\">Mar 2:26</a>, reference is made to an occurrence in \"the days of Abiathar the high priest.\" But from <a href=\"#\" onClick=\"return mV('1Sa',22,'1-');\">1Sa 22</a>, we learn explicitly that this event took place when Ahimelech, the father of Abiathar, was high priest. The apparent discrepancy is satisfactorily explained by interpreting the words in Mark as referring to the life-time of Abiathar, and not to the term of his holding the office of high priest. It is not implied in Mark that he was actual high priest at the time referred to. Others, however, think that the loaves belonged to Abiathar, who was at that time (<a href=\"#\" onClick=\"return mV('Lev',24,9);\">Lev 24:9</a>) a priest, and that he either himself gave them to David, or persuaded his father to give them.";
 eastonArray["$$T0000026"] = "<b>Abib:</b> an ear of corn, the month of newly-ripened grain (<a href=\"#\" onClick=\"return mV('Exd',13,4);\">Exd 13:4</a>; <a href=\"#\" onClick=\"return mV('Exd',23,15);\">23:15</a>); the first of the Jewish ecclesiastical year, and the seventh of the civil year. It began about the time of the vernal equinox, on 21st March. It was called Nisan, after the Captivity (<a href=\"#\" onClick=\"return mV('Neh',2,1);\">Neh 2:1</a>). On the fifteenth day of the month, harvest was begun by gathering a sheaf of barley, which was offered unto the Lord on the sixteenth (<a href=\"#\" onClick=\"return mV('Lev',23,'4-11');\">Lev 23:4-11</a>).";
 eastonArray["$$T0000027"] = "<b>Abida:</b> or Abi'dah, father of knowledge; knowing, one of the five sons of Midian, who was the son of Abraham by Keturah (<a href=\"#\" onClick=\"return mV('1Ch',1,33);\">1Ch 1:33</a>), and apparently the chief of an Arab tribe.";
 eastonArray["$$T0000028"] = "<b>Abidan:</b> father of judgment; judge, head of the tribe of Benjamin at the Exodus (<a href=\"#\" onClick=\"return mV('Num',1,11);\">Num 1:11</a>; <a href=\"#\" onClick=\"return mV('Num',2,22);\">2:22</a>).";
 eastonArray["$$T0000029"] = "<b>Abieezer:</b> father of help; i.e., \"helpful.\"<br><br>(1.) The second of the three sons of Hammoleketh, the sister of Gilead. He was the grandson of Manasseh (<a href=\"#\" onClick=\"return mV('1Ch',7,18);\">1Ch 7:18</a>). From his family Gideon sprang (<a href=\"#\" onClick=\"return mV('Jos',17,2);\">Jos 17:2</a>; <a href=\"#\" onClick=\"return mV('Jdg',6,34);\">Jdg 6:34</a>; <a href=\"#\" onClick=\"return mV('Jdg',8,2);\">8:2</a>). He was also called Jeezer (<a href=\"#\" onClick=\"return mV('Num',26,30);\">Num 26:30</a>).<br><br>(2.) One of David's thirty warriors (<a href=\"#\" onClick=\"return mV('2Sa',23,27);\">2Sa 23:27</a>; <a href=\"#\" onClick=\"return mV('1Ch',27,12);\">1Ch 27:12</a>).<br><br>(3.) The prince of the tribe of Dan at the Exodus (<a href=\"#\" onClick=\"return mV('Num',1,12);\">Num 1:12</a>).";
 eastonArray["$$T0000030"] = "<b>Abiel:</b> father (i.e., \"possessor\") of God = \"pious.\"<br><br>(1.) The son of Zeror and father of Ner, who was the grandfather of Saul (<a href=\"#\" onClick=\"return mV('1Sa',14,51);\">1Sa 14:51</a>; <a href=\"#\" onClick=\"return mV('1Ch',8,33);\">1Ch 8:33</a>; <a href=\"#\" onClick=\"return mV('1Ch',9,39);\">9:39</a>). In <a href=\"#\" onClick=\"return mV('1Sa',9,1);\">1Sa 9:1</a>, he is called the \"father,\" probably meaning the grandfather, of Kish.<br><br>(2.) An Arbathite, one of David's warriors (<a href=\"#\" onClick=\"return mV('1Ch',11,32);\">1Ch 11:32</a>); called also Abi-albon (<a href=\"#\" onClick=\"return mV('2Sa',23,31);\">2Sa 23:31</a>).";
 eastonArray["$$T0000031"] = "<b>Abiezrite:</b> father of help, a descendant of Abiezer (<a href=\"#\" onClick=\"return mV('Jdg',6,11,24);\">Jdg 6:11, 24</a>; <a href=\"#\" onClick=\"return mV('Jdg',8,32);\">8:32</a>).";
 eastonArray["$$T0000032"] = "<b>Abigail:</b> father (i.e., \"leader\") of the dance, or \"of joy.\"<br><br>(1.) The sister of David, and wife of Jether an Ishmaelite (<a href=\"#\" onClick=\"return mV('1Ch',2,16,17);\">1Ch 2:16-17</a>). She was the mother of Amasa (<a href=\"#\" onClick=\"return mV('2Sa',17,25);\">2Sa 17:25</a>).<br><br>(2.) The wife of the churlish Nabal, who dwelt in the district of Carmel (<a href=\"#\" onClick=\"return mV('1Sa',25,3);\">1Sa 25:3</a>). She showed great prudence and delicate management at a critical period of her husband's life. She was \"a woman of good understanding, and of a beautiful countenance.\" After Nabal's death she became the wife of David (<a href=\"#\" onClick=\"return mV('1Sa',25,'14-42');\">1Sa 25:14-42</a>), and was his companion in all his future fortunes (<a href=\"#\" onClick=\"return mV('1Sa',27,3);\">1Sa 27:3</a>; <a href=\"#\" onClick=\"return mV('1Sa',30,5);\">30:5</a>; <a href=\"#\" onClick=\"return mV('2Sa',2,2);\">2Sa 2:2</a>). By her David had a son called Chileab (<a href=\"#\" onClick=\"return mV('2Sa',3,3);\">2Sa 3:3</a>), elsewhere called Daniel (<a href=\"#\" onClick=\"return mV('1Ch',3,1);\">1Ch 3:1</a>).";
 eastonArray["$$T0000033"] = "<b>Abihail:</b> father of might.<br><br>(1.) <a href=\"#\" onClick=\"return mV('Num',3,35);\">Num 3:35</a>.<br><br>(2.) <a href=\"#\" onClick=\"return mV('1Ch',2,29);\">1Ch 2:29</a>.<br><br>(3.) 1 Chr. 5:14.<br><br>(4.) The second wife of King Rehoboam (<a href=\"#\" onClick=\"return mV('2Ch',11,18);\">2Ch 11:18</a>), a descendant of Eliab, David's eldest brother.<br><br>(5.) The father of Esther and uncle of Mordecai (<a href=\"#\" onClick=\"return mV('Est',2,15);\">Est 2:15</a>).";
 eastonArray["$$T0000034"] = "<b>Abihu:</b> father of Him; i.e., \"worshipper of God\", the second of the sons of Aaron (<a href=\"#\" onClick=\"return mV('Exd',6,23);\">Exd 6:23</a>; <a href=\"#\" onClick=\"return mV('Num',3,2);\">Num 3:2</a>; <a href=\"#\" onClick=\"return mV('Num',26,60);\">26:60</a>; <a href=\"#\" onClick=\"return mV('1Ch',6,3);\">1Ch 6:3</a>). Along with his three brothers he was consecrated to the priest's office (<a href=\"#\" onClick=\"return mV('Exd',28,1);\">Exd 28:1</a>). With his father and elder brother he accompanied the seventy elders part of the way up the mount with Moses (<a href=\"#\" onClick=\"return mV('Exd',24,1,9);\">Exd 24:1, 9</a>). On one occasion he and Nadab his brother offered incense in their censers filled with \"strange\" (i.e., common) fire, i.e., not with fire taken from the great brazen altar (<a href=\"#\" onClick=\"return mV('Lev',6,9);\">Lev 6:9</a>, etc.), and for this offence they were struck dead, and were taken out and buried without the camp (<a href=\"#\" onClick=\"return mV('Lev',10,'1-11');\">Lev 10:1-11</a>; <a href=\"#\" onClick=\"return mV('Num',3,4);\">Num 3:4</a>; <a href=\"#\" onClick=\"return mV('Num',26,61);\">26:61</a>; <a href=\"#\" onClick=\"return mV('1Ch',24,2);\">1Ch 24:2</a>). It is probable that when they committed this offence they were intoxicated, for immediately after is given the law prohibiting the use of wine or strong drink to the priests.";
 eastonArray["$$T0000035"] = "<b>Abihud:</b> father (i.e., \"possessor\") of renown. (1.) One of the sons of Bela, the son of Benjamin (<a href=\"#\" onClick=\"return mV('1Ch',8,3);\">1Ch 8:3</a>); called also Ahihud (ver. <a href=\"#\" onClick=\"return mV('1Ch',8,7);\">7</a>).<br><br>(2.) A descendant of Zerubbabel and father of Eliakim (<a href=\"#\" onClick=\"return mV('Mat',1,13);\">Mat 1:13</a>, \"Abiud\"); called also Juda (<a href=\"#\" onClick=\"return mV('Luk',3,26);\">Luk 3:26</a>), and Obadiah (<a href=\"#\" onClick=\"return mV('1Ch',3,21);\">1Ch 3:21</a>).";
 eastonArray["$$T0000036"] = "<b>Abijah:</b> father (i.e., \"possessor or worshipper\") of Jehovah.<br><br>(1.) 1Ch 7:8.<br><br>(2.) <a href=\"#\" onClick=\"return mV('1Ch',2,24);\">1Ch 2:24</a>.<br><br>(3.) The second son of Samuel (<a href=\"#\" onClick=\"return mV('1Sa',8,2);\">1Sa 8:2</a>; <a href=\"#\" onClick=\"return mV('1Ch',6,28);\">1Ch 6:28</a>). His conduct, along with that of his brother, as a judge in Beer-sheba, to which office his father had appointed him, led to popular discontent, and ultimately provoked the people to demand a royal form of government.<br><br>(4.) A descendant of Eleazar, the son of Aaron, a chief of one of the twenty-four orders into which the priesthood was divided by David (<a href=\"#\" onClick=\"return mV('1Ch',24,10);\">1Ch 24:10</a>). The order of Abijah was one of those which did not return from the Captivity (<a href=\"#\" onClick=\"return mV('Ezr',2,'36-39');\">Ezr 2:36-39</a>; <a href=\"#\" onClick=\"return mV('Neh',7,'39-42');\">Neh 7:39-42</a>; <a href=\"#\" onClick=\"return mV('Neh',12,1);\">12:1</a>).<br><br>(5.) The son of Rehoboam, whom he succeeded on the throne of Judah (<a href=\"#\" onClick=\"return mV('1Ch',3,10);\">1Ch 3:10</a>). He is also called Abijam (<a href=\"#\" onClick=\"return mV('1Ki',14,31);\">1Ki 14:31</a>; <a href=\"#\" onClick=\"return mV('1Ki',15,'1-8');\">15:1-8</a>). He began his three years' reign (<a href=\"#\" onClick=\"return mV('2Ch',12,16);\">2Ch 12:16</a>; <a href=\"#\" onClick=\"return mV('2Ch',13,'1-2');\">13:1-2</a>) with a strenuous but unsuccessful effort to bring back the ten tribes to their allegiance. His address to \"Jeroboam and all Israel,\" before encountering them in battle, is worthy of being specially noticed (<a href=\"#\" onClick=\"return mV('2Ch',13,'5-12');\">2Ch 13:5-12</a>). It was a very bloody battle, no fewer than 500,000 of the army of Israel having perished on the field. He is described as having walked \"in all the sins of his father\" (<a href=\"#\" onClick=\"return mV('1Ki',15,3);\">1Ki 15:3</a>; <a href=\"#\" onClick=\"return mV('2Ch',11,'20-22');\">2Ch 11:20-22</a>). It is said in <a href=\"#\" onClick=\"return mV('1Ki',15,2);\">1Ki 15:2</a> that \"his mother's name was Maachah, the daughter of Abishalom;\" but in <a href=\"#\" onClick=\"return mV('2Ch',13,2);\">2Ch 13:2</a> we read, \"his mother's name was Michaiah, the daughter of Uriel of Gibeah.\" The explanation is that Maachah is just a variation of the name Michaiah, and that Abishalom is probably the same as Absalom, the son of David. It is probable that \"Uriel of Gibeah\" married Tamar, the daughter of Absalom (<a href=\"#\" onClick=\"return mV('2Sa',14,27);\">2Sa 14:27</a>), and by her had Maachah. The word \"daughter\" in <a href=\"#\" onClick=\"return mV('1Ki',15,2);\">1Ki 15:2</a> will thus, as it frequently elsewhere does, mean grand-daughter.<br><br>(6.) A son of Jeroboam, the first king of Israel. On account of his severe illness when a youth, his father sent his wife to consult the prophet Ahijah regarding his recovery. The prophet, though blind with old age, knew the wife of Jeroboam as soon as she approached, and under a divine impulse he announced to her that inasmuch as in Abijah alone of all the house of Jeroboam there was found \"some good thing toward the Lord,\" he only would come to his grave in peace. As his mother crossed the threshold of the door on her return, the youth died, and \"all Israel mourned for him\" (<a href=\"#\" onClick=\"return mV('1Ki',14,'1-18');\">1Ki 14:1-18</a>).<br><br>(7.) The daughter of Zechariah (<a href=\"#\" onClick=\"return mV('2Ch',29,1);\">2Ch 29:1</a>; <a href=\"#\" onClick=\"return mV('Isa',8,2);\">Isa 8:2</a>), and afterwards the wife of Ahaz. She is also called Abi (<a href=\"#\" onClick=\"return mV('2Ki',18,2);\">2Ki 18:2</a>).<br><br>(8.) One of the sons of Becher, the son of Benjamin (<a href=\"#\" onClick=\"return mV('1Ch',7,8);\">1Ch 7:8</a>). \"Abiah,\" A.V.";
 eastonArray["$$T0000037"] = "<b>Abijam:</b> father of the sea; i.e., \"seaman\" the name always used in Kings of the king of Judah, the son of Rehoboam, elsewhere called Abijah (<a href=\"#\" onClick=\"return mV('1Ki',15,1,7,8);\">1Ki 15:1, 7-8</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000036');\">ABIJAH, 5</a>.)";
 eastonArray["$$T0000038"] = "<b>Abilene:</b> a plain, a district lying on the east slope of the Anti-Lebanon range; so called from its chief town, Abila (<a href=\"#\" onClick=\"return mV('Luk',3,1);\">Luk 3:1</a>), which stood in the Suk Wady Barada, between Heliopolis (Baalbec) and Damascus, 38 miles from the former and 18 from the latter. Lysanias was governor or tetrarch of this province.";
 eastonArray["$$T0000039"] = "<b>Abimael:</b> father of Mael, one of the sons or descendants of Joktan, in Northern Arabia (<a href=\"#\" onClick=\"return mV('Gen',10,28);\">Gen 10:28</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,22);\">1Ch 1:22</a>).";
 eastonArray["$$T0000040"] = "<b>Abimelech:</b> my father a king, or father of a king, a common name of the Philistine kings, as \"Pharaoh\" was of the Egyptian kings.<br><br>(1.) The Philistine king of Gerar in the time of Abraham (<a href=\"#\" onClick=\"return mV('Gen',20,'1-18');\">Gen 20:1-18</a>). By an interposition of Providence, Sarah was delivered from his harem, and was restored to her husband Abraham. As a mark of respect he gave to Abraham valuable gifts, and offered him a settlement in any part of his country; while at the same time he delicately and yet severely rebuked him for having practised a deception upon him in pretending that Sarah was only his sister. Among the gifts presented by the king were a thousand pieces of silver as a \"covering of the eyes\" for Sarah; i.e., either as an atoning gift and a testimony of her innocence in the sight of all, or rather for the purpose of procuring a veil for Sarah to conceal her beauty, and thus as a reproof to her for not having worn a veil which, as a married woman, she ought to have done. A few years after this Abimelech visited Abraham, who had removed southward beyond his territory, and there entered into a league of peace and friendship with him. This league was the first of which we have any record. It was confirmed by a mutual oath at Beer-sheba (<a href=\"#\" onClick=\"return mV('Gen',21,'22-34');\">Gen 21:22-34</a>).<br><br>(2.) A king of Gerar in the time of Isaac, probably the son of the preceeding (<a href=\"#\" onClick=\"return mV('Gen',26,'1-22');\">Gen 26:1-22</a>). Isaac sought refuge in his territory during a famine, and there he acted a part with reference to his wife Rebekah similar to that of his father Abraham with reference to Sarah. Abimelech rebuked him for the deception, which he accidentally discovered. Isaac settled for a while here, and prospered. Abimelech desired him, however, to leave his territory, which Isaac did. Abimelech afterwards visited him when he was encamped at Beer-sheba, and expressed a desire to renew the covenant which had been entered into between their fathers (<a href=\"#\" onClick=\"return mV('Gen',26,'26-31');\">Gen 26:26-31</a>).<br><br>(3.) A son of Gideon (<a href=\"#\" onClick=\"return mV('Jdg',9,1);\">Jdg 9:1</a>), who was proclaimed king after the death of his father (<a href=\"#\" onClick=\"return mV('Jdg',8,'33-35');\">Jdg 8:33</a>-<a href=\"#\" onClick=\"return mV('Jdg',9,'1-6');\">9:6</a>). One of his first acts was to murder his brothers, seventy in number, \"on one stone,\" at Ophrah. Only one named Jotham escaped. He was an unprincipled, ambitious ruler, often engaged in war with his own subjects. When engaged in reducing the town of Thebez, which had revolted, he was struck mortally on his head by a mill-stone, thrown by the hand of a woman from the wall above. Perceiving that the wound was mortal, he desired his armour-bearer to thrust him through with his sword, that it might not be said he had perished by the hand of a woman (<a href=\"#\" onClick=\"return mV('Jdg',9,'50-57');\">Jdg 9:50-57</a>).<br><br>(4.) The son of Abiathar, and high priest in the time of David (<a href=\"#\" onClick=\"return mV('1Ch',18,16);\">1Ch 18:16</a>). In the parallel passage, <a href=\"#\" onClick=\"return mV('2Sa',8,17);\">2Sa 8:17</a>, we have the name Ahimelech, and Abiathar, the son of Ahimelech. This most authorities consider the more correct reading.<br><br>(5.) Achish, king of Gath, in the title of <a href=\"#\" onClick=\"return mV('Psa',34,'1-');\">Psa 34</a>. (<a href=\"#\" onClick=\"return mV('1Sa',21,'10-15');\">1Sa 21:10-15</a>.)";
 eastonArray["$$T0000041"] = "<b>Abinadab:</b> father of nobleness; i.e., \"noble.\"<br><br>(1.) A Levite of Kirjath-jearim, in whose house the ark of the covenant was deposited after having been brought back from the land of the Philistines (<a href=\"#\" onClick=\"return mV('1Sa',7,1);\">1Sa 7:1</a>). It remained there twenty years, till it was at length removed by David (<a href=\"#\" onClick=\"return mV('1Sa',7,'1-2');\">1Sa 7:1-2</a>; <a href=\"#\" onClick=\"return mV('1Ch',13,7);\">1Ch 13:7</a>).<br><br>(2.) The second of the eight sons of Jesse (<a href=\"#\" onClick=\"return mV('1Sa',16,8);\">1Sa 16:8</a>). He was with Saul in the campaign against the Philistines in which Goliath was slain (<a href=\"#\" onClick=\"return mV('1Sa',17,13);\">1Sa 17:13</a>).<br><br>(3.) One of Saul's sons, who peristed with his father in the battle of Gilboa (<a href=\"#\" onClick=\"return mV('1Sa',31,2);\">1Sa 31:2</a>; <a href=\"#\" onClick=\"return mV('1Ch',10,2);\">1Ch 10:2</a>).<br><br>(4.) One of Solomon's officers, who \"provided victuals for the king and his household.\" He presided, for this purpose, over the district of Dor (<a href=\"#\" onClick=\"return mV('1Ki',4,11);\">1Ki 4:11</a>).";
 eastonArray["$$T0000042"] = "<b>Abinoam:</b> father of kindness, the father of Barak (<a href=\"#\" onClick=\"return mV('Jdg',4,6);\">Jdg 4:6</a>; <a href=\"#\" onClick=\"return mV('Jdg',5,1);\">5:1</a>).";
 eastonArray["$$T0000043"] = "<b>Abiram:</b> father of height; i.e., \"proud.\"<br><br>(1.) One of the sons of Eliab, who joined Korah in the conspiracy against Moses and Aaron. He and all the conspirators, with their families and possessions (except the children of Korah), were swallowed up by an earthquake (<a href=\"#\" onClick=\"return mV('Num',16,'1-27');\">Num 16:1-27</a>; <a href=\"#\" onClick=\"return mV('Num',26,9);\">26:9</a>; <a href=\"#\" onClick=\"return mV('Psa',106,17);\">Psa 106:17</a>).<br><br>(2.) The eldest son of Hiel the Bethelite, who perished prematurely in consequence of his father's undertaking to rebuild Jericho (<a href=\"#\" onClick=\"return mV('1Ki',16,34);\">1Ki 16:34</a>), according to the words of Joshua (<a href=\"#\" onClick=\"return mV('Jos',6,26);\">Jos 6:26</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002036');\">JERICHO</a>.)";
 eastonArray["$$T0000044"] = "<b>Abishag:</b> father of (i.e., \"given to\") error, a young woman of Shunem, distinguished for her beauty. She was chosen to minister to David in his old age. She became his wife (<a href=\"#\" onClick=\"return mV('1Ki',1,'3-4',15);\">1Ki 1:3-4, 15</a>). After David's death Adonijah persuaded Bathsheba, Solomon's mother, to entreat the king to permit him to marry Abishag. Solomon suspected in this request an aspiration to the throne, and therefore caused him to be put to death (<a href=\"#\" onClick=\"return mV('1Ki',2,'17-25');\">1Ki 2:17-25</a>).";
 eastonArray["$$T0000045"] = "<b>Abishai:</b> father of (i.e., \"desirous of\") a gift, the eldest son of Zeruiah, David's sister. He was the brother of Joab and Asahel (<a href=\"#\" onClick=\"return mV('2Sa',2,18);\">2Sa 2:18</a>; <a href=\"#\" onClick=\"return mV('1Ch',2,16);\">1Ch 2:16</a>). Abishai was the only one who accompanied David when he went to the camp of Saul and took the spear and the cruse of water from Saul's bolster (<a href=\"#\" onClick=\"return mV('1Sa',26,'5-12');\">1Sa 26:5-12</a>). He had the command of one of the three divisions of David's army at the battle with Absalom (<a href=\"#\" onClick=\"return mV('2Sa',18,2,5,12);\">2Sa 18:2, 5, 12</a>). He slew the Philistine giant Ishbi-benob, who threatened David's life (<a href=\"#\" onClick=\"return mV('2Sa',21,'15-17');\">2Sa 21:15-17</a>). He was the chief of the second rank of the three \"mighties\" (<a href=\"#\" onClick=\"return mV('2Sa',23,'18-19');\">2Sa 23:18-19</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,'20-21');\">1Ch 11:20-21</a>); and on one occasion withstood 300 men, and slew them with his own spear (<a href=\"#\" onClick=\"return mV('2Sa',23,18);\">2Sa 23:18</a>). Abishai is the name of the Semitic chief who offers gifts to the lord of Beni-Hassan.";
 eastonArray["$$T0000046"] = "<b>Abishua:</b> father of welfare; i.e., \"fortunate.\"<br><br>(1.) The grandson of Benjamin (<a href=\"#\" onClick=\"return mV('1Ch',8,4);\">1Ch 8:4</a>).<br><br>(2.) The son of Phinehas the high priest (<a href=\"#\" onClick=\"return mV('1Ch',6,'4-5',50);\">1Ch 6:4-5, 50</a>; <a href=\"#\" onClick=\"return mV('Ezr',7,5);\">Ezr 7:5</a>).";
 eastonArray["$$T0000047"] = "<b>Abishur:</b> father of the wall; i.e., \"mason\", one of the two sons of Shammai of the tribe of Judah (<a href=\"#\" onClick=\"return mV('1Ch',2,'28-29');\">1Ch 2:28-29</a>>).";
 eastonArray["$$T0000048"] = "<b>Abital:</b> father of dew; i.e., \"fresh\", David's fifth wife (<a href=\"#\" onClick=\"return mV('2Sa',3,4);\">2Sa 3:4</a>).";
 eastonArray["$$T0000049"] = "<b>Abitub:</b> father of goodness, a Benjamite (<a href=\"#\" onClick=\"return mV('1Ch',8,11);\">1Ch 8:11</a>).";
</script>
