<script src="./js/NoNavHeader.js"  type="text/javascript"></script>
<script>
var eastonArray = new Array ();
eastonArray["$$T0001500"] = "<strong>Glass:</strong> was known to the Egyptians at a very early period of their national history, at least B.C. 1500. Various articles both useful and ornamental were made of it, as bottles, vases, etc. A glass bottle with the name of Sargon on it was found among the ruins of the north-west palace of Nimroud. The Hebrew word <i>zekukith</i> (<a href=\"#\" onClick=\"return mV('Job',28,17);\">Job 28:17</a>), rendered in the Authorized Version \"crystal,\" is rightly rendered in the Revised Version \"glass.\" This is the only allusion to glass found in the Old Testament. It is referred to in the New Testament in <a href=\"#\" onClick=\"return mV('Rev',4,6);\">Rev 4:6</a>; <a href=\"#\" onClick=\"return mV('Rev',15,2);\">15:2</a>; <a href=\"#\" onClick=\"return mV('Rev',21,18,21);\">21:18, 21</a>. In <a href=\"#\" onClick=\"return mV('Job',37,18);\">Job 37:18</a>, the word rendered \"looking-glass\" is in the Revised Version properly rendered \"mirror,\" formed, i.e., of some metal. (<a href=\"#\" onClick=\"return mV('Exd',38,8);\">Exd 38:8</a>: \"looking-glasses\" are brazen mirrors, R.V.). A mirror is referred to also in <a href=\"#\" onClick=\"return mV('Jam',1,23);\">Jam 1:23</a>.";
eastonArray["$$T0001501"] = "<strong>Glean:</strong> The corners of fields were not to be reaped, and the sheaf accidentally left behind was not to be fetched away, according to the law of Moses (<a href=\"#\" onClick=\"return mV('Lev',19,9);\">Lev 19:9</a>; <a href=\"#\" onClick=\"return mV('Lev',23,22);\">23:22</a>; <a href=\"#\" onClick=\"return mV('Deu',24,21);\">Deu 24:21</a>). They were to be left for the poor to glean. Similar laws were given regarding vineyards and oliveyards. (<a href=\"#\" onClick=\"return mV('Rth',2,2);\">Rth 2:2</a>.)";
eastonArray["$$T0001502"] = "<strong>Glede:</strong> an Old English name for the common kite, mentioned only in <a href=\"#\" onClick=\"return mV('Deu',14,13);\">Deu 14:13</a> (Heb. ra'ah), the <i>Milvus ater</i> or black kite. The Hebrew word does not occur in the parallel passage in Leviticus (<a href=\"#\" onClick=\"return mV('Lev',11,14);\">Lev 11:14</a>, da'ah, rendered \"vulture; \" in R.V., \"kite\"). It was an unclean bird. The Hebrew name is from a root meaning \"to see,\" \"to look,\" thus designating a bird with a keen sight. The bird intended is probably the buzzard, of which there are three species found in Palestine. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003778');\">VULTURE</a>.)";
eastonArray["$$T0001503"] = "<strong>Glorify:</strong><br><br>(1.) To make glorious, or cause so to appear (<a href=\"#\" onClick=\"return mV('Jhn',12,28);\">Jhn 12:28</a>; <a href=\"#\" onClick=\"return mV('Jhn',13,31,32);\">13:31-32</a>; <a href=\"#\" onClick=\"return mV('Jhn',17,4);\">17:4-5</a>).<br><br>(2.) Spoken of God to \"shew forth his praise\" (<a href=\"#\" onClick=\"return mV('1Cr',6,20);\">1Cr 6:20</a>; <a href=\"#\" onClick=\"return mV('1Cr',10,31);\">10:31</a>).";
eastonArray["$$T0001504"] = "<strong>Glory:</strong> (Heb. kabhod; Gr. doxa).<br><br>(1.) Abundance, wealth, treasure, and hence honour (<a href=\"#\" onClick=\"return mV('Psa',49,12);\">Psa 49:12</a>); glory (<a href=\"#\" onClick=\"return mV('Gen',31,1);\">Gen 31:1</a>; <a href=\"#\" onClick=\"return mV('Mat',4,8);\">Mat 4:8</a>; <a href=\"#\" onClick=\"return mV('Rev',21,24,26);\">Rev 21:24, 26</a>).<br><br>(2.) Honour, dignity (<a href=\"#\" onClick=\"return mV('1Ki',3,13);\">1Ki 3:13</a>; <a href=\"#\" onClick=\"return mV('Hbr',2,7);\">Hbr 2:7</a>; <a href=\"#\" onClick=\"return mV('1Pe',1,24);\">1Pe 1:24</a>); of God (<a href=\"#\" onClick=\"return mV('Psa',19,1);\">Psa 19:1</a>; <a href=\"#\" onClick=\"return mV('Psa',29,1);\">29:1</a>); of the mind or heart (<a href=\"#\" onClick=\"return mV('Gen',49,6);\">Gen 49:6</a>; <a href=\"#\" onClick=\"return mV('Psa',7,5);\">Psa 7:5</a>; <a href=\"#\" onClick=\"return mV('Act',2,46);\">Act 2:46</a>).<br><br>(3.) Splendour, brightness, majesty (<a href=\"#\" onClick=\"return mV('Gen',45,13);\">Gen 45:13</a>; <a href=\"#\" onClick=\"return mV('Isa',4,5);\">Isa 4:5</a>; <a href=\"#\" onClick=\"return mV('Act',22,11);\">Act 22:11</a>; <a href=\"#\" onClick=\"return mV('2Cr',3,7);\">2Cr 3:7</a>); of Jehovah (<a href=\"#\" onClick=\"return mV('Isa',59,19);\">Isa 59:19</a>; <a href=\"#\" onClick=\"return mV('Isa',60,1);\">60:1</a>; <a href=\"#\" onClick=\"return mV('2Th',1,9);\">2Th 1:9</a>).<br><br>(4.) The glorious moral attributes, the infinite perfections of God (<a href=\"#\" onClick=\"return mV('Isa',40,5);\">Isa 40:5</a>; <a href=\"#\" onClick=\"return mV('Act',7,2);\">Act 7:2</a>; <a href=\"#\" onClick=\"return mV('Rom',1,23);\">Rom 1:23</a>; <a href=\"#\" onClick=\"return mV('Rom',9,23);\">9:23</a>; <a href=\"#\" onClick=\"return mV('Eph',1,12);\">Eph 1:12</a>). Jesus is the \"brightness of the Father's glory\" (<a href=\"#\" onClick=\"return mV('Hbr',1,3);\">Hbr 1:3</a>; <a href=\"#\" onClick=\"return mV('Jhn',1,14);\">Jhn 1:14</a>; <a href=\"#\" onClick=\"return mV('Jhn',2,11);\">2:11</a>).<br><br>(5.) The bliss of heaven (<a href=\"#\" onClick=\"return mV('Rom',2,7,10);\">Rom 2:7, 10</a>; <a href=\"#\" onClick=\"return mV('Rom',5,2);\">5:2</a>; <a href=\"#\" onClick=\"return mV('Rom',8,18);\">8:18</a>; <a href=\"#\" onClick=\"return mV('Hbr',2,10);\">Hbr 2:10</a>; <a href=\"#\" onClick=\"return mV('1Pe',5,1,10);\">1Pe 5:1, 10</a>).<br><br>(6.) The phrase \"Give glory to God\" (<a href=\"#\" onClick=\"return mV('Jos',7,19);\">Jos 7:19</a>; <a href=\"#\" onClick=\"return mV('Jer',13,16);\">Jer 13:16</a>) is a Hebrew idiom meaning, \"Confess your sins.\" The words of the Jews to the blind man, \"Give God the praise\" (<a href=\"#\" onClick=\"return mV('Jhn',9,24);\">Jhn 9:24</a>), are an adjuration to confess. They are equivalent to, \"Confess that you are an impostor,\" \"Give God the glory by speaking the truth;\" for they denied that a miracle had been wrought.";
eastonArray["$$T0001505"] = "<strong>Glutton:</strong> (<a href=\"#\" onClick=\"return mV('Deu',21,20);\">Deu 21:20</a>), Heb. zolel, from a word meaning \"to shake out,\" \"to squander;\" and hence one who is prodigal, who wastes his means by indulgence. In <a href=\"#\" onClick=\"return mV('Pro',23,21);\">Pro 23:21</a>, the word means debauchees or wasters of their own body. In <a href=\"#\" onClick=\"return mV('Pro',28,7);\">Pro 28:7</a>, the word (pl.) is rendered Authorized Version \"riotous men;\" Revised Version, \"gluttonous.\" <a href=\"#\" onClick=\"return mV('Mat',11,19);\">Mat 11:19</a>; <a href=\"#\" onClick=\"return mV('Luk',7,34);\">Luk 7:34</a>, Greek phagos, given to eating, gluttonous.";
eastonArray["$$T0001506"] = "<strong>Gnash:</strong> Heb. harak, meaning \"to grate the teeth\", (<a href=\"#\" onClick=\"return mV('Job',16,9);\">Job 16:9</a>; <a href=\"#\" onClick=\"return mV('Psa',112,10);\">Psa 112:10</a>; <a href=\"#\" onClick=\"return mV('Lam',2,16);\">Lam 2:16</a>), denotes rage or sorrow. (See also <a href=\"#\" onClick=\"return mV('Act',7,54);\">Act 7:54</a>; <a href=\"#\" onClick=\"return mV('Mar',9,18);\">Mar 9:18</a>.)";
eastonArray["$$T0001507"] = "<strong>Gnat:</strong> only in <a href=\"#\" onClick=\"return mV('Mat',23,24);\">Mat 23:24</a>, a small two-winged stinging fly of the genus Culex, which includes mosquitoes. Our Lord alludes here to the gnat in a proverbial expression probably in common use, \"who strain out the gnat;\" the words in the Authorized Version, \"strain at a gnat,\" being a mere typographical error, which has been corrected in the Revised Version. The custom of filtering wine for this purpose was common among the Jews. It was founded on <a href=\"#\" onClick=\"return mV('Lev',11,23);\">Lev 11:23</a>. It is supposed that the \"lice,\" <a href=\"#\" onClick=\"return mV('Exd',8,16);\">Exd 8:16</a> (marg. R.V., \"sand-flies\"), were a species of gnat.";
eastonArray["$$T0001508"] = "<strong>Goad:</strong> (only in <a href=\"#\" onClick=\"return mV('Jdg',3,31);\">Jdg 3:31</a>), an instrument used by ploughmen for guiding their oxen. Shamgar slew six hundred Philistines with an ox-goad. \"The goad is a formidable weapon. It is sometimes ten feet long, and has a sharp point. We could now see that the feat of Shamgar was not so very wonderful as some have been accustomed to think.\"<br><br>In <a href=\"#\" onClick=\"return mV('1Sa',13,21);\">1Sa 13:21</a>, a different Hebrew word is used, <i>dorban</i>, meaning something pointed. The expression (<a href=\"#\" onClick=\"return mV('Act',9,5);\">Act 9:5</a>, omitted in the R.V.), \"It is hard for thee to kick against the pricks\", i.e., against the goad, was proverbial for unavailing resistance to superior power.";
eastonArray["$$T0001509"] = "<strong>Goat:</strong><br><br>(1.) Heb. 'ez, the she-goat (<a href=\"#\" onClick=\"return mV('Gen',15,9);\">Gen 15:9</a>; <a href=\"#\" onClick=\"return mV('Gen',30,35);\">30:35</a>; <a href=\"#\" onClick=\"return mV('Gen',31,38);\">31:38</a>). This Hebrew word is also used for the he-goat (<a href=\"#\" onClick=\"return mV('Exd',12,5);\">Exd 12:5</a>; <a href=\"#\" onClick=\"return mV('Lev',4,23);\">Lev 4:23</a>; <a href=\"#\" onClick=\"return mV('Num',28,15);\">Num 28:15</a>), and to denote a kid (<a href=\"#\" onClick=\"return mV('Gen',38,17,20);\">Gen 38:17, 20</a>). Hence it may be regarded as the generic name of the animal as domesticated. It literally means \"strength,\" and points to the superior strength of the goat as compared with the sheep.<br><br>(2.) Heb. 'attud, only in plural; rendered \"rams\" (<a href=\"#\" onClick=\"return mV('Gen',31,10,12);\">Gen 31:10, 12</a>); he-goats (<a href=\"#\" onClick=\"return mV('Num',7,'17-88');\">Num 7:17-88</a>; <a href=\"#\" onClick=\"return mV('Isa',1,11);\">Isa 1:11</a>); goats (<a href=\"#\" onClick=\"return mV('Deu',32,14);\">Deu 32:14</a>; <a href=\"#\" onClick=\"return mV('Psa',50,13);\">Psa 50:13</a>). They were used in sacrifice (<a href=\"#\" onClick=\"return mV('Psa',66,15);\">Psa 66:15</a>). This word is used metaphorically for princes or chiefs in <a href=\"#\" onClick=\"return mV('Isa',14,9);\">Isa 14:9</a>, and in <a href=\"#\" onClick=\"return mV('Zec',10,3);\">Zec 10:3</a> as leaders. (<a href=\"#\" onClick=\"return mV('Jer',50,8);\">Jer 50:8</a>.)<br><br>(3.) Heb. gedi, properly a kid. Its flesh was a delicacy among the Hebrews (<a href=\"#\" onClick=\"return mV('Gen',27,9,14,17);\">Gen 27:9, 14, 17</a>; <a href=\"#\" onClick=\"return mV('Jdg',6,19);\">Jdg 6:19</a>).<br><br>(4.) Heb. sa'ir, meaning the \"shaggy,\" a hairy goat, a he-goat (<a href=\"#\" onClick=\"return mV('2Ch',29,23);\">2Ch 29:23</a>); \"a goat\" (<a href=\"#\" onClick=\"return mV('Lev',4,24);\">Lev 4:24</a>); \"satyr\" (<a href=\"#\" onClick=\"return mV('Isa',13,21);\">Isa 13:21</a>); \"devils\" (<a href=\"#\" onClick=\"return mV('Lev',17,7);\">Lev 17:7</a>). It is the goat of the sin-offering (<a href=\"#\" onClick=\"return mV('Lev',9,3,15);\">Lev 9:3, 15</a>; <a href=\"#\" onClick=\"return mV('Lev',10,16);\">10:16</a>).<br><br>(5.) Heb. tsaphir, a he-goat of the goats (<a href=\"#\" onClick=\"return mV('2Ch',29,21);\">2Ch 29:21</a>). In <a href=\"#\" onClick=\"return mV('Dan',8,5,8);\">Dan 8:5, 8</a> it is used as a symbol of the Macedonian empire.<br><br>(6.) Heb. tayish, a \"striker\" or \"butter,\" rendered \"he-goat\" (<a href=\"#\" onClick=\"return mV('Gen',30,35);\">Gen 30:35</a>; <a href=\"#\" onClick=\"return mV('Gen',32,14);\">32:14</a>).<br><br>(7.) Heb. 'azazel (q.v.), the \"scapegoat\" (<a href=\"#\" onClick=\"return mV('Lev',16,8,10,26);\">Lev 16:8, 10, 26</a>).<br><br>(8.) There are two Hebrew words used to denote the undomesticated goat:, <i>Yael</i>, only in plural mountain goats (<a href=\"#\" onClick=\"return mV('1Sa',24,2);\">1Sa 24:2</a>; <a href=\"#\" onClick=\"return mV('Job',39,1);\">Job 39:1</a>; <a href=\"#\" onClick=\"return mV('Psa',104,18);\">Psa 104:18</a>). It is derived from a word meaning \"to climb.\" It is the ibex, which abounded in the mountainous parts of Moab. And <i>'akko</i>, only in <a href=\"#\" onClick=\"return mV('Deu',14,5);\">Deu 14:5</a>, the wild goat.<br><br>Goats are mentioned in the New Testament in <a href=\"#\" onClick=\"return mV('Mat',25,32,33);\">Mat 25:32-33</a>; <a href=\"#\" onClick=\"return mV('Hbr',9,12,13,19);\">Hbr 9:12-13, 19</a>; <a href=\"#\" onClick=\"return mV('Hbr',10,4);\">10:4</a>. They represent oppressors and wicked men (<a href=\"#\" onClick=\"return mV('Eze',34,17);\">Eze 34:17</a>; <a href=\"#\" onClick=\"return mV('Eze',39,18);\">39:18</a>; <a href=\"#\" onClick=\"return mV('Mat',25,33);\">Mat 25:33</a>).<br><br>Several varieties of the goat were familiar to the Hebrews. They had an important place in their rural economy on account of the milk they afforded and the excellency of the flesh of the kid. They formed an important part of pastoral wealth (<a href=\"#\" onClick=\"return mV('Gen',31,10,12);\">Gen 31:10, 12</a>; <a href=\"#\" onClick=\"return mV('Gen',32,14);\">32:14</a>; <a href=\"#\" onClick=\"return mV('1Sa',25,2);\">1Sa 25:2</a>).";
eastonArray["$$T0001510"] = "<strong>Goath:</strong> a lowing, a place near Jerusalem, mentioned only in <a href=\"#\" onClick=\"return mV('Jer',31,39);\">Jer 31:39</a>.";
eastonArray["$$T0001511"] = "<strong>Gob:</strong> a pit, a place mentioned in <a href=\"#\" onClick=\"return mV('2Sa',21,18,19);\">2Sa 21:18-19</a>; called also Gezer, in <a href=\"#\" onClick=\"return mV('1Ch',20,4);\">1Ch 20:4</a>.";
eastonArray["$$T0001512"] = "<strong>Goblet:</strong> a laver or trough for washing garments. In <a href=\"#\" onClick=\"return mV('Sgs',7,2);\">Sgs 7:2</a>, a bowl or drinking vessel, a bowl for mixing wine; in <a href=\"#\" onClick=\"return mV('Exd',24,6);\">Exd 24:6</a>, a sacrificial basin. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000938');\">CUP</a>.)";
eastonArray["$$T0001513"] = "<strong>God:</strong> (A.S. and Dutch God; Dan. Gud; Ger. Gott), the name of the Divine Being. It is the rendering (1) of the Hebrew <i>'El</i>, from a word meaning to be strong; (2) of <i>'Eloah</i>, plural <i>'Elohim</i>. The singular form, <i>Eloah</i>, is used only in poetry. The plural form is more commonly used in all parts of the Bible, The Hebrew word Jehovah (q.v.), the only other word generally employed to denote the Supreme Being, is uniformly rendered in the Authorized Version by \"LORD,\" printed in small capitals. The existence of God is taken for granted in the Bible. There is nowhere any argument to prove it. He who disbelieves this truth is spoken of as one devoid of understanding (<a href=\"#\" onClick=\"return mV('Psa',14,1);\">Psa 14:1</a>).<br><br>The arguments generally adduced by theologians in proof of the being of God are:<br><br>(1.) The <i>a priori</i> argument, which is the testimony afforded by reason.<br><br>(2.) The <i>a posteriori</i> argument, by which we proceed logically from the facts of experience to causes. These arguments are,<br><br>(a) The cosmological, by which it is proved that there must be a First Cause of all things, for every effect must have a cause.<br><br>(b) The teleological, or the argument from design. We see everywhere the operations of an intelligent Cause in nature.<br><br>(c) The moral argument, called also the anthropological argument, based on the moral consciousness and the history of mankind, which exhibits a moral order and purpose which can only be explained on the supposition of the existence of God. Conscience and human history testify that \"verily there is a God that judgeth in the earth.\"<br><br>The attributes of God are set forth in order by Moses in <a href=\"#\" onClick=\"return mV('Exd',34,6,7);\">Exd 34:6-7</a>. (see also <a href=\"#\" onClick=\"return mV('Deu',6,4);\">Deu 6:4</a>; <a href=\"#\" onClick=\"return mV('Deu',10,17);\">10:17</a>; <a href=\"#\" onClick=\"return mV('Num',16,22);\">Num 16:22</a>; <a href=\"#\" onClick=\"return mV('Exd',15,11);\">Exd 15:11</a>; <a href=\"#\" onClick=\"return mV('Exd',33,19);\">33:19</a>; <a href=\"#\" onClick=\"return mV('Isa',44,6);\">Isa 44:6</a>; <a href=\"#\" onClick=\"return mV('Hab',3,6);\">Hab 3:6</a>; <a href=\"#\" onClick=\"return mV('Psa',102,26);\">Psa 102:26</a>; <a href=\"#\" onClick=\"return mV('Job',34,12);\">Job 34:12</a>.) They are also systematically classified in <a href=\"#\" onClick=\"return mV('Rev',5,12);\">Rev 5:12</a> and and <a href=\"#\" onClick=\"return mV('Rev',7,12);\">Rev 7:12</a>.<br><br>God's attributes are spoken of by some as absolute, i.e., such as belong to his essence as Jehovah, Jah, etc.; and relative, i.e., such as are ascribed to him with relation to his creatures. Others distinguish them into communicable, i.e., those which can be imparted in degree to his creatures: goodness, holiness, wisdom, etc.; and incommunicable, which cannot be so imparted: independence, immutability, immensity, and eternity. They are by some also divided into natural attributes, eternity, immensity, etc.; and moral, holiness, goodness, etc.";
eastonArray["$$T0001514"] = "<strong>Godhead:</strong> (<a href=\"#\" onClick=\"return mV('Act',17,29);\">Act 17:29</a>; <a href=\"#\" onClick=\"return mV('Rom',1,20);\">Rom 1:20</a>; <a href=\"#\" onClick=\"return mV('Col',2,9);\">Col 2:9</a>), the essential being or the nature of God.";
eastonArray["$$T0001515"] = "<strong>Godliness:</strong> the whole of practical piety (<a href=\"#\" onClick=\"return mV('1Ti',4,8);\">1Ti 4:8</a>; <a href=\"#\" onClick=\"return mV('2Pe',1,6);\">2Pe 1:6</a>). \"It supposes knowledge, veneration, affection, dependence, submission, gratitude, and obedience.\" In <a href=\"#\" onClick=\"return mV('1Ti',3,16);\">1Ti 3:16</a> it denotes the substance of revealed religion.";
eastonArray["$$T0001516"] = "<strong>Goel:</strong> in Hebrew the participle of the verb <i>gaal</i>, \"to redeem.\" It is rendered in the Authorized Version \"kinsman,\" <a href=\"#\" onClick=\"return mV('Num',5,8);\">Num 5:8</a>; <a href=\"#\" onClick=\"return mV('Rut',3,12);\">Ruth 3:12</a>; <a href=\"#\" onClick=\"return mV('Rut',4,1,6,8);\">4:1, 6, 8</a>; \"redeemer,\" <a href=\"#\" onClick=\"return mV('Job',19,25);\">Job 19:25</a>; \"avenger,\" <a href=\"#\" onClick=\"return mV('Num',35,12);\">Num 35:12</a>; <a href=\"#\" onClick=\"return mV('Deu',19,6);\">Deu 19:6</a>, etc. The Jewish law gave the right of redeeming and repurchasing, as well as of avenging blood, to the next relative, who was accordingly called by this name. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003083');\">REDEEMER</a>.)";
eastonArray["$$T0001517"] = "<strong>Gog:</strong><br><br>(1.) A Reubenite (<a href=\"#\" onClick=\"return mV('1Ch',5,4);\">1Ch 5:4</a>), the father of Shimei.<br><br>(2.) The name of the leader of the hostile party described in <a href=\"#\" onClick=\"return mV('Eze',38,'1-');\">Eze 38</a>; <a href=\"#\" onClick=\"return mV('Eze',39,'1-');\">39</a>, as coming from the \"north country\" and assailing the people of Israel to their own destruction. This prophecy has been regarded as fulfilled in the conflicts of the Maccabees with Antiochus, the invasion and overthrow of the Chaldeans, and the temporary successes and destined overthrow of the Turks. But \"all these interpretations are unsatisfactory and inadequate. The vision respecting Gog and Magog in the Apocalypse (<a href=\"#\" onClick=\"return mV('Rev',20,8);\">Rev 20:8</a>) is in substance a reannouncement of this prophecy of Ezekiel. But while Ezekiel contemplates the great conflict in a more general light as what was certainly to be connected with the times of the Messiah, and should come then to its last decisive issues, John, on the other hand, writing from the commencement of the Messiah's times, describes there the last struggles and victories of the cause of Christ. In both cases alike the vision describes the final workings of the world's evil and its results in connection with the kingdom of God, only the starting-point is placed further in advance in the one case than in the other.\"<br><br>It has been supposed to be the name of a district in the wild north-east steppes of Central Asia, north of the Hindu-Kush, now a part of Turkestan, a region about 2,000 miles north-east of Nineveh.";
eastonArray["$$T0001518"] = "<strong>Golan:</strong> exile, a city of Bashan (<a href=\"#\" onClick=\"return mV('Deu',4,43);\">Deu 4:43</a>), one of the three cities of refuge east of Jordan, about 12 miles north-east of the Sea of Galilee (<a href=\"#\" onClick=\"return mV('Jos',20,8);\">Jos 20:8</a>). There are no further notices of it in Scripture. It became the head of the province of Gaulanitis, one of the four provinces into which Bashan was divided after the Babylonish captivity, and almost identical with the modern Jaulan, in Western Hauran, about 39 miles in length and 18 in breath.";
eastonArray["$$T0001519"] = "<strong>Gold:</strong><br><br>(1.) Heb. zahab, so called from its yellow colour (<a href=\"#\" onClick=\"return mV('Exd',25,11);\">Exd 25:11</a>; <a href=\"#\" onClick=\"return mV('1Ch',28,18);\">1Ch 28:18</a>; <a href=\"#\" onClick=\"return mV('2Ch',3,5);\">2Ch 3:5</a>).<br><br>(2.) Heb. segor, from its compactness, or as being enclosed or treasured up; thus precious or \"fine gold\" (<a href=\"#\" onClick=\"return mV('1Ki',6,20);\">1Ki 6:20</a>; <a href=\"#\" onClick=\"return mV('1Ki',7,49);\">7:49</a>).<br><br>(3.) Heb. paz, native or pure gold (<a href=\"#\" onClick=\"return mV('Job',28,17);\">Job 28:17</a>; <a href=\"#\" onClick=\"return mV('Psa',19,10);\">Psa 19:10</a>; <a href=\"#\" onClick=\"return mV('Psa',21,3);\">21:3</a>, etc.).<br><br>(4.) Heb. betzer, \"ore of gold or silver\" as dug out of the mine (<a href=\"#\" onClick=\"return mV('Job',36,19);\">Job 36:19</a>, where it means simply riches).<br><br>(5.) Heb. kethem, i.e., something concealed or separated (<a href=\"#\" onClick=\"return mV('Job',28,16,19);\">Job 28:16, 19</a>; <a href=\"#\" onClick=\"return mV('Psa',45,9);\">Psa 45:9</a>; <a href=\"#\" onClick=\"return mV('Pro',25,12);\">Pro 25:12</a>). Rendered \"golden wedge\" in <a href=\"#\" onClick=\"return mV('Isa',13,12);\">Isa 13:12</a>.<br><br>(6.) Heb. haruts, i.e., dug out; poetic for gold (<a href=\"#\" onClick=\"return mV('Pro',8,10);\">Pro 8:10</a>; <a href=\"#\" onClick=\"return mV('Pro',16,16);\">16:16</a>; <a href=\"#\" onClick=\"return mV('Zec',9,3);\">Zec 9:3</a>).<br><br>Gold was known from the earliest times (<a href=\"#\" onClick=\"return mV('Gen',2,11);\">Gen 2:11</a>). It was principally used for ornaments (<a href=\"#\" onClick=\"return mV('Gen',24,22);\">Gen 24:22</a>). It was very abundant (<a href=\"#\" onClick=\"return mV('1Ch',22,14);\">1Ch 22:14</a>; <a href=\"#\" onClick=\"return mV('Nah',2,9);\">Nah 2:9</a>; <a href=\"#\" onClick=\"return mV('Dan',3,1);\">Dan 3:1</a>). Many tons of it were used in connection with the temple (<a href=\"#\" onClick=\"return mV('2Ch',1,15);\">2Ch 1:15</a>). It was found in Arabia, Sheba, and Ophir (<a href=\"#\" onClick=\"return mV('1Ki',9,28);\">1Ki 9:28</a>; <a href=\"#\" onClick=\"return mV('1Ki',10,1);\">10:1</a>; <a href=\"#\" onClick=\"return mV('Job',28,16);\">Job 28:16</a>), but not in Palestine.<br><br>In <a href=\"#\" onClick=\"return mV('Dan',2,38);\">Dan 2:38</a>, the Babylonian Empire is spoken of as a \"head of gold\" because of its great riches; and Babylon was called by Isaiah (<a href=\"#\" onClick=\"return mV('Isa',14,4);\">Isa 14:4</a>) the \"golden city\" (R.V. marg., \"exactress,\" adopting the reading <i>marhebah</i>, instead of the usual word <i>madhebah</i>).";
eastonArray["$$T0001520"] = "<strong>Golden calf:</strong> (<a href=\"#\" onClick=\"return mV('Exd',32,4,8);\">Exd 32:4, 8</a>; <a href=\"#\" onClick=\"return mV('Deu',9,16);\">Deu 9:16</a>; <a href=\"#\" onClick=\"return mV('Neh',9,18);\">Neh 9:18</a>). This was a molten image of a calf which the idolatrous Israelites formed at Sinai. This symbol was borrowed from the custom of the Egyptians. It was destroyed at the command of Moses (<a href=\"#\" onClick=\"return mV('Exd',32,20);\">Exd 32:20</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000002');\">AARON</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0002602');\">MOSES</a>.)";
eastonArray["$$T0001521"] = "<strong>Goldsmith:</strong> (<a href=\"#\" onClick=\"return mV('Neh',3,8,32);\">Neh 3:8, 32</a>; <a href=\"#\" onClick=\"return mV('Isa',40,19);\">Isa 40:19</a>; <a href=\"#\" onClick=\"return mV('Isa',41,7);\">41:7</a>; <a href=\"#\" onClick=\"return mV('Isa',46,6);\">46:6</a>). The word so rendered means properly a founder or finer.";
eastonArray["$$T0001522"] = "<strong>Golgotha:</strong> the common name of the spot where Jesus was crucified. It is interpreted by the evangelists as meaning \"the place of a skull\" (<a href=\"#\" onClick=\"return mV('Mat',27,33);\">Mat 27:33</a>; <a href=\"#\" onClick=\"return mV('Mar',15,22);\">Mar 15:22</a>; <a href=\"#\" onClick=\"return mV('Jhn',19,17);\">Jhn 19:17</a>). This name represents in Greek letters the Aramaic word Gulgaltha, which is the Hebrew Gulgoleth (<a href=\"#\" onClick=\"return mV('Num',1,2);\">Num 1:2</a>; <a href=\"#\" onClick=\"return mV('1Ch',23,3,24);\">1Ch 23:3, 24</a>; <a href=\"#\" onClick=\"return mV('2Ki',9,35);\">2Ki 9:35</a>), meaning \"a skull.\" It is identical with the word Calvary (q.v.). It was a little knoll rounded like a bare skull. It is obvious from the evangelists that it was some well-known spot outside the gate (<a href=\"#\" onClick=\"return mV('Hbr',13,12);\">Hbr 13:12</a>), and near the city (<a href=\"#\" onClick=\"return mV('Luk',23,26);\">Luk 23:26</a>), containing a \"garden\" (<a href=\"#\" onClick=\"return mV('Jhn',19,41);\">Jhn 19:41</a>), and on a thoroughfare leading into the country. Hence it is an untenable idea that it is embraced within the present \"Church of the Holy Sepulchre.\" The hillock above Jeremiah's Grotto, to the north of the city, is in all probability the true site of Calvary. The skull-like appearance of the rock in the southern precipice of the hillock is very remarkable.";
eastonArray["$$T0001523"] = "<strong>Goliath:</strong> great.<br><br>(1.) A famous giant of Gath, who for forty days openly defied the armies of Israel, but was at length slain by David with a stone from a sling (<a href=\"#\" onClick=\"return mV('1Sa',17,4);\">1Sa 17:4</a>). He was probably descended from the Rephaim who found refuge among the Philistines after they were dispersed by the Ammonites (<a href=\"#\" onClick=\"return mV('Deu',2,20,21);\">Deu 2:20-21</a>). His height was \"six cubits and a span,\" which, taking the cubit at 21 inches, is equal to 10 1/2 feet. David cut off his head (<a href=\"#\" onClick=\"return mV('1Sa',17,51);\">1Sa 17:51</a>) and brought it to Jerusalem, while he hung the armour which he took from him in his tent. His sword was preserved at Nob as a religious trophy (<a href=\"#\" onClick=\"return mV('1Sa',21,9);\">21:9</a>). David's victory over Goliath was the turning point in his life. He came into public notice now as the deliverer of Israel and the chief among Saul's men of war (<a href=\"#\" onClick=\"return mV('1Sa',18,5);\">18:5</a>), and the devoted friend of Jonathan.<br><br>(2.) In <a href=\"#\" onClick=\"return mV('2Sa',21,19);\">2Sa 21:19</a> there is another giant of the same name mentioned as slain by Elhanan. The staff of his spear \"was like a weaver's beam.\" The Authorized Version interpolates the words \"the brother of\" from <a href=\"#\" onClick=\"return mV('1Ch',20,5);\">1Ch 20:5</a>, where this giant is called Lahmi.";
eastonArray["$$T0001524"] = "<strong>Gomer:</strong> complete; vanishing.<br><br>(1.) The daughter of Diblaim, who (probably in vision only) became the wife of Hosea (<a href=\"#\" onClick=\"return mV('Hsa',1,3);\">Hsa 1:3</a>).<br><br>(2.) The eldest son of Japheth, and father of Ashkenaz, Riphath, and Togarmah (<a href=\"#\" onClick=\"return mV('Gen',10,2,3);\">Gen 10:2-3</a>), whose descendants formed the principal branch of the population of South-eastern Europe. He is generally regarded as the ancestor of the Celtae and the Cimmerii, who in early times settled to the north of the Black Sea, and gave their name to the Crimea, the ancient Chersonesus Taurica. Traces of their presence are found in the names Cimmerian Bosphorus, Cimmerian Isthmus, etc. In the seventh century B.C. they were driven out of their original seat by the Scythians, and overran western Asia Minor, whence they were afterwards expelled. They subsequently reappear in the times of the Romans as the Cimbri of the north and west of Europe, whence they crossed to the British Isles, where their descendants are still found in the Gaels and Cymry. Thus the whole Celtic race may be regarded as descended from Gomer.";
eastonArray["$$T0001525"] = "<strong>Gomorrah:</strong> submersion, one of the five cities of the plain of Siddim (q.v.) which were destroyed by fire (<a href=\"#\" onClick=\"return mV('Gen',10,19);\">Gen 10:19</a>; <a href=\"#\" onClick=\"return mV('Gen',13,10);\">13:10</a>; <a href=\"#\" onClick=\"return mV('Gen',19,24,28);\">19:24, 28</a>). These cities probably stood close together, and were near the northern extremity of what is now the Dead Sea. This city is always mentioned next after Sodom, both of which were types of impiety and wickedness (<a href=\"#\" onClick=\"return mV('Gen',18,20);\">Gen 18:20</a>; <a href=\"#\" onClick=\"return mV('Rom',9,29);\">Rom 9:29</a>). Their destruction is mentioned as an \"ensample unto those that after should live ungodly\" (<a href=\"#\" onClick=\"return mV('2Pe',2,6);\">2Pe 2:6</a>; <a href=\"#\" onClick=\"return mV('Jud',1,'4-7');\">Jud 1:4-7</a>). Their wickedness became proverbial (<a href=\"#\" onClick=\"return mV('Deu',32,32);\">Deu 32:32</a>; <a href=\"#\" onClick=\"return mV('Isa',1,9,10);\">Isa 1:9-10</a>; <a href=\"#\" onClick=\"return mV('Jer',23,14);\">Jer 23:14</a>). But that wickedness may be exceeded (<a href=\"#\" onClick=\"return mV('Mat',10,15);\">Mat 10:15</a>; <a href=\"#\" onClick=\"return mV('Mar',6,11);\">Mar 6:11</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000991');\">DEAD SEA</a>).";
eastonArray["$$T0001526"] = "<strong>Goodly trees:</strong> boughs of, were to be carried in festive procession on the first day of the feast of Tabernacles (<a href=\"#\" onClick=\"return mV('Lev',23,40);\">Lev 23:40</a>). This was probably the olive tree (<a href=\"#\" onClick=\"return mV('Neh',8,15);\">Neh 8:15</a>), although no special tree is mentioned.";
eastonArray["$$T0001527"] = "<strong>Goodness:</strong> in man is not a mere passive quality, but the deliberate preference of right to wrong, the firm and persistent resistance of all moral evil, and the choosing and following of all moral good.";
eastonArray["$$T0001528"] = "<strong>Goodness of God:</strong> a perfection of his character which he exercises towards his creatures according to their various circumstances and relations (<a href=\"#\" onClick=\"return mV('Psa',145,8,9);\">Psa 145:8-9</a>; <a href=\"#\" onClick=\"return mV('Psa',103,8);\">103:8</a>; <a href=\"#\" onClick=\"return mV('1Jo',4,8);\">1Jo 4:8</a>). Viewed generally, it is benevolence; as exercised with respect to the miseries of his creatures it is mercy, pity, compassion, and in the case of impenitent sinners, long-suffering patience; as exercised in communicating favour on the unworthy it is grace. \"Goodness and justice are the several aspects of one unchangeable, infinitely wise, and sovereign moral perfection. God is not sometimes merciful and sometimes just, but he is eternally infinitely just and merciful.\" God is infinitely and unchangeably good (<a href=\"#\" onClick=\"return mV('Zep',3,17);\">Zep 3:17</a>), and his goodness is incomprehensible by the finite mind (<a href=\"#\" onClick=\"return mV('Rom',11,35,36);\">Rom 11:35-36</a>). \"God's goodness appears in two things, giving and forgiving.\"";
eastonArray["$$T0001529"] = "<strong>Gopher:</strong> a tree from the wood of which Noah was directed to build the ark (<a href=\"#\" onClick=\"return mV('Gen',6,14);\">Gen 6:14</a>). It is mentioned only there. The LXX. render this word by \"squared beams,\" and the Vulgate by \"planed wood.\" Other versions have rendered it \"pine\" and \"cedar;\" but the weight of authority is in favour of understanding by it the cypress tree, which grows abundantly in Chaldea and Armenia.";
eastonArray["$$T0001530"] = "<strong>Goshen:</strong><br><br>(1.) A district in Egypt where Jacob and his family settled, and in which they remained till the Exodus (<a href=\"#\" onClick=\"return mV('Gen',45,10);\">Gen 45:10</a>; <a href=\"#\" onClick=\"return mV('Gen',46,28,29,31);\">46:28-29, 31</a>, etc.). It is called \"the land of Goshen\" (<a href=\"#\" onClick=\"return mV('Gen',47,27);\">47:27</a>), and also simply \"Goshen\" (<a href=\"#\" onClick=\"return mV('Gen',46,28);\">46:28</a>), and \"the land of Rameses\" (<a href=\"#\" onClick=\"return mV('Gen',47,11);\">47:11</a>; <a href=\"#\" onClick=\"return mV('Exd',12,37);\">Exd 12:37</a>), for the towns Pithom and Rameses lay within its borders; also Zoan or Tanis (<a href=\"#\" onClick=\"return mV('Psa',78,12);\">Psa 78:12</a>). It lay on the east of the Nile, and apparently not far from the royal residence. It was \"the best of the land\" (<a href=\"#\" onClick=\"return mV('Gen',47,6,11);\">Gen 47:6, 11</a>), but is now a desert. It is first mentioned in Joseph's message to his father. It has been identified with the modern Wady Tumilat, lying between the eastern part of the Delta and the west border of Palestine. It was a pastoral district, where some of the king's cattle were kept (<a href=\"#\" onClick=\"return mV('Gen',47,6);\">Gen 47:6</a>). The inhabitants were not exclusively Israelites (<a href=\"#\" onClick=\"return mV('Exd',3,22);\">Exd 3:22</a>; <a href=\"#\" onClick=\"return mV('Exd',11,2);\">11:2</a>; <a href=\"#\" onClick=\"return mV('Exd',12,35,36);\">12:35-36</a>).<br><br>(2.) A district in Palestine (<a href=\"#\" onClick=\"return mV('Jos',10,41);\">Jos 10:41</a>; <a href=\"#\" onClick=\"return mV('Jos',11,16);\">11:16</a>). It was a part of the maritime plain of Judah, and lay between Gaza and Gibeon.<br><br>(3.) A town in the mountains of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,51);\">Jos 15:51</a>).";
eastonArray["$$T0001531"] = "<strong>Gospel:</strong> a word of Anglo-Saxon origin, and meaning \"God's spell\", i.e., word of God, or rather, according to others, \"good spell\", i.e., good news. It is the rendering of the Greek <i>evangelion</i>, i.e., \"good message.\" It denotes<br><br>(1.) \"the welcome intelligence of salvation to man as preached by our Lord and his followers.<br><br>(2.) It was afterwards transitively applied to each of the four histories of our Lord's life, published by those who are therefore called 'Evangelists', writers of the history of the gospel (the evangelion).<br><br>(3.) The term is often used to express collectively the gospel doctrines; and 'preaching the gospel' is often used to include not only the proclaiming of the good tidings, but the teaching men how to avail themselves of the offer of salvation, the declaring of all the truths, precepts, promises, and threatenings of Christianity.\" It is termed \"the gospel of the grace of God\" (<a href=\"#\" onClick=\"return mV('Act',20,24);\">Act 20:24</a>), \"the gospel of the kingdom\" (<a href=\"#\" onClick=\"return mV('Mat',4,23);\">Mat 4:23</a>), \"the gospel of Christ\" (<a href=\"#\" onClick=\"return mV('Rom',1,16);\">Rom 1:16</a>), \"the gospel of peace (<a href=\"#\" onClick=\"return mV('Eph',6,15);\">Eph 6:15</a>), \"the glorious gospel,\" \"the everlasting gospel,\" \"the gospel of salvation\" (<a href=\"#\" onClick=\"return mV('Eph',1,13);\">Eph 1:13</a>).";
eastonArray["$$T0001532"] = "<strong>Gospels:</strong> The central fact of Christian preaching was the intelligence that the Saviour had come into the world (<a href=\"#\" onClick=\"return mV('Mat',4,23);\">Mat 4:23</a>; <a href=\"#\" onClick=\"return mV('Rom',10,15);\">Rom 10:15</a>); and the first Christian preachers who called their account of the person and mission of Christ by the term <i>evangelion</i> (= good message) were called <i>evangelistai</i> (= evangelists) (<a href=\"#\" onClick=\"return mV('Eph',4,11);\">Eph 4:11</a>; <a href=\"#\" onClick=\"return mV('Act',21,8);\">Act 21:8</a>).<br><br>There are four historical accounts of the person and work of Christ: \"the first by Matthew, announcing the Redeemer as the promised King of the kingdom of God; the second by Mark, declaring him 'a prophet, mighty in deed and word'; the third by Luke, of whom it might be said that he represents Christ in the special character of the Saviour of sinners (<a href=\"#\" onClick=\"return mV('Luk',7,36);\">Luk 7:36</a>; <a href=\"#\" onClick=\"return mV('Luk',15,18);\">15:18</a>); the fourth by John, who represents Christ as the Son of God, in whom deity and humanity become one. The ancient Church gave to Matthew the symbol of the lion, to Mark that of a man, to Luke that of the ox, and to John that of the eagle: these were the four faces of the cherubim\" (<a href=\"#\" onClick=\"return mV('Eze',1,10);\">Eze 1:10</a>).<br><br>Date. The Gospels were all composed during the latter part of the first century, and there is distinct historical evidence to show that they were used and accepted as authentic before the end of the second century.<br><br>Mutual relation. \"If the extent of all the coincidences be represented by 100, their proportionate distribution will be: Matthew, Mark, and Luke, 53; Matthew and Luke, 21; Matthew and Mark, 20; Mark and Luke, 6. Looking only at the general result, it may be said that of the contents of the synoptic Gospels [i.e., the first three Gospels] about two-fifths are common to the three, and that the parts peculiar to one or other of them are little more than one-third of the whole.\"<br><br>Origin. Did the evangelists copy from one another? The opinion is well founded that the Gospels were published by the apostles orally before they were committed to writing, and that each had an independent origin. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002443');\">MATTHEW, GOSPEL OF</a>.)";
eastonArray["$$T0001533"] = "<strong>Gourd:</strong><br><br>(1.) Jonah's gourd (<a href=\"#\" onClick=\"return mV('Jon',4,'6-10');\">Jon 4:6-10</a>), bearing the Hebrew name <i>kikayon</i> (found only here), was probably the kiki of the Egyptians, the croton. This is the castor-oil plant, a species of ricinus, the <i>palma Christi</i>, so called from the palmate division of its leaves. Others with more probability regard it as the cucurbita the el-keroa of the Arabs, a kind of pumpkin peculiar to the East. \"It is grown in great abundance on the alluvial banks of the Tigris and on the plain between the river and the ruins of Nineveh.\" At the present day it is trained to run over structures of mud and brush to form booths to protect the gardeners from the heat of the noon-day sun. It grows with extraordinary rapidity, and when cut or injured withers away also with great rapidity.<br><br>(2.) Wild gourds (<a href=\"#\" onClick=\"return mV('2Ki',4,'38-40');\">2Ki 4:38-40</a>), Heb. pakkuoth, belong to the family of the cucumber-like plants, some of which are poisonous. The species here referred to is probably the colocynth (Cucumis colocynthus). The LXX. render the word by \"wild pumpkin.\" It abounds in the desert parts of Syria, Egypt, and Arabia. There is, however, another species, called the Cucumis prophetarum, from the idea that it afforded the gourd which \"the sons of the prophets\" shred by mistake into their pottage.";
eastonArray["$$T0001534"] = "<strong>Government of God:</strong> See <a href=\"#\" onClick=\"return doDictLookup('ET0003012');\">PROVIDENCE</a>.";
eastonArray["$$T0001535"] = "<strong>Governments:</strong> (<a href=\"#\" onClick=\"return mV('1Cr',12,28);\">1Cr 12:28</a>), the powers which fit a man for a place of influence in the church; \"the steersman's art; the art of guiding aright the vessel of church or state.\"";
eastonArray["$$T0001536"] = "<strong>Governor:</strong><br><br>(1.) Heb. nagid, a prominent, conspicuous person, whatever his capacity; as, chief of the royal palace (<a href=\"#\" onClick=\"return mV('2Ch',28,7);\">2Ch 28:7</a>; <a href=\"#\" onClick=\"return mV('1Ki',4,6);\">1Ki 4:6</a>), chief of the temple (<a href=\"#\" onClick=\"return mV('1Ch',9,11);\">1Ch 9:11</a>; <a href=\"#\" onClick=\"return mV('Jer',20,1);\">Jer 20:1</a>), the leader of the Aaronites (<a href=\"#\" onClick=\"return mV('1Ch',12,27);\">1Ch 12:27</a>), keeper of the sacred treasury (<a href=\"#\" onClick=\"return mV('1Ch',26,24);\">26:24</a>), captain of the army (<a href=\"#\" onClick=\"return mV('1Ch',13,1);\">13:1</a>), the king (<a href=\"#\" onClick=\"return mV('1Sa',9,16);\">1Sa 9:16</a>), the Messiah (<a href=\"#\" onClick=\"return mV('Dan',9,25);\">Dan 9:25</a>).<br><br>(2.) Heb. nasi, raised; exalted. Used to denote the chiefs of families (<a href=\"#\" onClick=\"return mV('Num',3,24,30,32,35);\">Num 3:24, 30, 32, 35</a>); also of tribes (<a href=\"#\" onClick=\"return mV('Num',2,3);\">2:3</a>; <a href=\"#\" onClick=\"return mV('Num',7,2);\">7:2</a>; <a href=\"#\" onClick=\"return mV('Num',3,32);\">3:32</a>). These dignities appear to have been elective, not hereditary.<br><br>(3.) Heb. pakid, an officer or magistrate. It is used of the delegate of the high priest (<a href=\"#\" onClick=\"return mV('2Ch',24,11);\">2Ch 24:11</a>), the Levites (<a href=\"#\" onClick=\"return mV('Neh',11,22);\">Neh 11:22</a>), a military commander (<a href=\"#\" onClick=\"return mV('2Ki',25,19);\">2Ki 25:19</a>), Joseph's officers in Egypt (<a href=\"#\" onClick=\"return mV('Gen',41,34);\">Gen 41:34</a>).<br><br>(4.) Heb. shallit, one who has power, who rules (<a href=\"#\" onClick=\"return mV('Gen',42,6);\">Gen 42:6</a>; <a href=\"#\" onClick=\"return mV('Ezr',4,20);\">Ezr 4:20</a>; <a href=\"#\" onClick=\"return mV('Ecc',8,8);\">Ecc 8:8</a>; <a href=\"#\" onClick=\"return mV('Dan',2,15);\">Dan 2:15</a>; <a href=\"#\" onClick=\"return mV('Dan',5,29);\">5:29</a>).<br><br>(5.) Heb. aluph, literally one put over a thousand, i.e., a clan or a subdivision of a tribe. Used of the \"dukes\" of Edom (<a href=\"#\" onClick=\"return mV('Gen',36,'1-')\">Gen 36</a>), and of the Jewish chiefs (<a href=\"#\" onClick=\"return mV('Zec',9,7);\">Zec 9:7</a>).<br><br>(6.) Heb. moshel, one who rules, holds dominion. Used of many classes of rulers (<a href=\"#\" onClick=\"return mV('Gen',3,16);\">Gen 3:16</a>; <a href=\"#\" onClick=\"return mV('Gen',24,2);\">24:2</a>; <a href=\"#\" onClick=\"return mV('Gen',45,8);\">45:8</a>; <a href=\"#\" onClick=\"return mV('Psa',105,20);\">Psa 105:20</a>); of the Messiah (<a href=\"#\" onClick=\"return mV('Mic',5,2);\">Mic 5:2</a>); of God (<a href=\"#\" onClick=\"return mV('1Ch',29,12);\">1Ch 29:12</a>; <a href=\"#\" onClick=\"return mV('Psa',103,19);\">Psa 103:19</a>).<br><br>(7.) Heb. sar, a ruler or chief; a word of very general use. It is used of the chief baker of Pharaoh (<a href=\"#\" onClick=\"return mV('Gen',40,16);\">Gen 40:16</a>); of the chief butler (See also <a href=\"#\" onClick=\"return mV('Gen',47,6);\">Gen 47:6</a>; <a href=\"#\" onClick=\"return mV('Exd',1,11);\">Exd 1:11</a>; <a href=\"#\" onClick=\"return mV('Dan',1,7);\">Dan 1:7</a>; <a href=\"#\" onClick=\"return mV('Jdg',10,18);\">Jdg 10:18</a>; <a href=\"#\" onClick=\"return mV('1Ki',22,26);\">1Ki 22:26</a>; <a href=\"#\" onClick=\"return mV('1Ki',20,15);\">20:15</a>; <a href=\"#\" onClick=\"return mV('2Ki',1,9);\">2Ki 1:9</a>; <a href=\"#\" onClick=\"return mV('2Sa',24,2);\">2Sa 24:2</a>). It is used also of angels, guardian angels (<a href=\"#\" onClick=\"return mV('Dan',10,13,20,21);\">Dan 10:13, 20-21</a>; <a href=\"#\" onClick=\"return mV('Dan',12,1);\">12:1</a>; <a href=\"#\" onClick=\"return mV('Dan',10,13);\">10:13</a>; <a href=\"#\" onClick=\"return mV('Dan',8,25);\">8:25</a>).<br><br>(8.) Pehah, whence <i>pasha</i>, i.e., friend of the king; adjutant; governor of a province (<a href=\"#\" onClick=\"return mV('2Ki',18,24);\">2Ki 18:24</a>; <a href=\"#\" onClick=\"return mV('Isa',36,9);\">Isa 36:9</a>; <a href=\"#\" onClick=\"return mV('Jer',51,57);\">Jer 51:57</a>; <a href=\"#\" onClick=\"return mV('Eze',23,6,23);\">Eze 23:6, 23</a>; <a href=\"#\" onClick=\"return mV('Dan',3,2);\">Dan 3:2</a>; <a href=\"#\" onClick=\"return mV('Est',3,12);\">Est 3:12</a>), or a prefect (<a href=\"#\" onClick=\"return mV('Neh',3,7);\">Neh 3:7</a>; <a href=\"#\" onClick=\"return mV('Neh',5,14);\">5:14</a>; <a href=\"#\" onClick=\"return mV('Ezr',5,3);\">Ezr 5:3</a>; <a href=\"#\" onClick=\"return mV('Hag',1,1);\">Hag 1:1</a>). This is a foreign word, Assyrian, which was early adopted into the Hebrew idiom (<a href=\"#\" onClick=\"return mV('1Ki',10,15);\">1Ki 10:15</a>).<br><br>(9.) The Chaldean word <i>segan</i> is applied to the governors of the Babylonian satrapies (<a href=\"#\" onClick=\"return mV('Dan',3,2,27);\">Dan 3:2, 27</a>; <a href=\"#\" onClick=\"return mV('Dan',6,7);\">6:7</a>); the prefects over the Magi (<a href=\"#\" onClick=\"return mV('Dan',2,48);\">2:48</a>). The corresponding Hebrew word <i>segan</i> is used of provincial rulers (<a href=\"#\" onClick=\"return mV('Jer',51,23,28,57);\">Jer 51:23, 28, 57</a>); also of chiefs and rulers of the people of Jerusalem (<a href=\"#\" onClick=\"return mV('Ezr',9,2);\">Ezr 9:2</a>; <a href=\"#\" onClick=\"return mV('Neh',2,16);\">Neh 2:16</a>; <a href=\"#\" onClick=\"return mV('Neh',4,14,19);\">4:14, 19</a>; <a href=\"#\" onClick=\"return mV('Neh',5,7,17);\">5:7, 17</a>; <a href=\"#\" onClick=\"return mV('Neh',7,5);\">7:5</a>; <a href=\"#\" onClick=\"return mV('Neh',12,40);\">12:40</a>).<br><br>In the New Testament there are also different Greek words rendered thus.<br><br>(1.) Meaning an ethnarch (<a href=\"#\" onClick=\"return mV('2Cr',11,32);\">2Cr 11:32</a>), which was an office distinct from military command, with considerable latitude of application.<br><br>(2.) The procurator of Judea under the Romans (<a href=\"#\" onClick=\"return mV('Mat',27,2);\">Mat 27:2</a>). (<a href=\"#\" onClick=\"return mV('Luk',2,2);\">Luk 2:2</a>, where the verb from which the Greek word so rendered is derived is used.)<br><br>(3.) Steward (<a href=\"#\" onClick=\"return mV('Gal',4,2);\">Gal 4:2</a>).<br><br>(4.) Governor of the feast (<a href=\"#\" onClick=\"return mV('Jhn',2,9);\">Jhn 2:9</a>), who appears here to have been merely an intimate friend of the bridegroom, and to have presided at the marriage banquet in his stead.<br><br>(5.) A director, i.e., helmsman; Lat. gubernator, (<a href=\"#\" onClick=\"return mV('Jam',3,4);\">Jam 3:4</a>).";
eastonArray["$$T0001537"] = "<strong>Gozan:</strong> a region in Central Asia to which the Israelites were carried away captive (<a href=\"#\" onClick=\"return mV('2Ki',17,6);\">2Ki 17:6</a>; <a href=\"#\" onClick=\"return mV('1Ch',5,26);\">1Ch 5:26</a>; <a href=\"#\" onClick=\"return mV('2Ki',19,12);\">2Ki 19:12</a>; <a href=\"#\" onClick=\"return mV('Isa',37,12);\">Isa 37:12</a>). It was situated in Mesopotamia, on the river Habor (<a href=\"#\" onClick=\"return mV('2Ki',17,6);\">2Ki 17:6</a>; <a href=\"#\" onClick=\"return mV('2Ki',18,11);\">18:11</a>), the Khabur, a tributary of the Euphrates. The \"river of Gozan\" (<a href=\"#\" onClick=\"return mV('1Ch',5,26);\">1Ch 5:26</a>) is probably the upper part of the river flowing through the province of Gozan, now Kizzel-Ozan.";
eastonArray["$$T0001538"] = "<strong>Grace:</strong><br><br>(1.) Of form or person (<a href=\"#\" onClick=\"return mV('Pro',1,9);\">Pro 1:9</a>; <a href=\"#\" onClick=\"return mV('Pro',3,22);\">3:22</a>; <a href=\"#\" onClick=\"return mV('Psa',45,2);\">Psa 45:2</a>).<br><br>(2.) Favour, kindness, friendship (<a href=\"#\" onClick=\"return mV('Gen',6,8);\">Gen 6:8</a>; <a href=\"#\" onClick=\"return mV('Gen',18,3);\">18:3</a>; <a href=\"#\" onClick=\"return mV('Gen',19,19);\">19:19</a>; <a href=\"#\" onClick=\"return mV('2Ti',1,9);\">2Ti 1:9</a>).<br><br>(3.) God's forgiving mercy (<a href=\"#\" onClick=\"return mV('Rom',11,6);\">Rom 11:6</a>; <a href=\"#\" onClick=\"return mV('Eph',2,5);\">Eph 2:5</a>).<br><br>(4.) The gospel as distinguished from the law (<a href=\"#\" onClick=\"return mV('Jhn',1,17);\">Jhn 1:17</a>; <a href=\"#\" onClick=\"return mV('Rom',6,14);\">Rom 6:14</a>; <a href=\"#\" onClick=\"return mV('1Pe',5,12);\">1Pe 5:12</a>).<br><br>(5.) Gifts freely bestowed by God; as miracles, prophecy, tongues (<a href=\"#\" onClick=\"return mV('Rom',15,15);\">Rom 15:15</a>; <a href=\"#\" onClick=\"return mV('1Cr',15,10);\">1Cr 15:10</a>; <a href=\"#\" onClick=\"return mV('Eph',3,8);\">Eph 3:8</a>).<br><br>(6.) Christian virtues (<a href=\"#\" onClick=\"return mV('2Cr',8,7);\">2Cr 8:7</a>; <a href=\"#\" onClick=\"return mV('2Pe',3,18);\">2Pe 3:18</a>).<br><br>(7.) The glory hereafter to be revealed (<a href=\"#\" onClick=\"return mV('1Pe',1,13);\">1Pe 1:13</a>).";
eastonArray["$$T0001539"] = "<strong>Grace, means of:</strong> an expression not used in Scripture, but employed<br><br>(1.) to denote those institutions ordained by God to be the ordinary channels of grace to the souls of men. These are the Word, Sacraments, and Prayer.<br><br>(2.) But in popular language the expression is used in a wider sense to denote those exercises in which we engage for the purpose of obtaining spiritual blessing; as hearing the gospel, reading the Word, meditation, self-examination, Christian conversation, etc.";
eastonArray["$$T0001540"] = "<strong>Graft:</strong> the process of inoculating fruit-trees (<a href=\"#\" onClick=\"return mV('Rom',11,'17-24');\">Rom 11:17-24</a>). It is peculiarly appropriate to olive-trees. The union thus of branches to a stem is used to illustrate the union of true believers to the true Church.";
eastonArray["$$T0001541"] = "<strong>Grain:</strong> used, in <a href=\"#\" onClick=\"return mV('Amo',9,9);\">Amo 9:9</a>, of a small stone or kernel; in <a href=\"#\" onClick=\"return mV('Mat',13,31);\">Mat 13:31</a>, of an individual seed of mustard; in <a href=\"#\" onClick=\"return mV('Jhn',12,24);\">Jhn 12:24</a>; <a href=\"#\" onClick=\"return mV('1Cr',15,37);\">1Cr 15:37</a>, of wheat. The Hebrews sowed only wheat, barley, and spelt; rye and oats are not mentioned in Scripture.";
eastonArray["$$T0001542"] = "<strong>Grape:</strong> the fruit of the vine, which was extensively cultivated in Palestine. Grapes are spoken of as \"tender\" (<a href=\"#\" onClick=\"return mV('Sgs',2,13,15);\">Sgs 2:13, 15</a>), \"unripe\" (<a href=\"#\" onClick=\"return mV('Job',15,33);\">Job 15:33</a>), \"sour\" (<a href=\"#\" onClick=\"return mV('Isa',18,5);\">Isa 18:5</a>), \"wild\" (<a href=\"#\" onClick=\"return mV('Isa',5,2,4);\">Isa 5:2, 4</a>). (See <a href=\"#\" onClick=\"return mV('Rev',14,18);\">Rev 14:18</a>; <a href=\"#\" onClick=\"return mV('Mic',7,1);\">Mic 7:1</a>; <a href=\"#\" onClick=\"return mV('Jer',6,9);\">Jer 6:9</a>; <a href=\"#\" onClick=\"return mV('Eze',18,2);\">Eze 18:2</a>, for figurative use of the word.) (See <a href=\"#\" onClick=\"return doDictLookup('ET0003770');\">VINE</a>.)";
eastonArray["$$T0001543"] = "<strong>Grass:</strong><br><br>(1.) Heb. hatsir, ripe grass fit for mowing (<a href=\"#\" onClick=\"return mV('1Ki',18,5);\">1Ki 18:5</a>; <a href=\"#\" onClick=\"return mV('Job',40,15);\">Job 40:15</a>; <a href=\"#\" onClick=\"return mV('Psa',104,14);\">Psa 104:14</a>). As the herbage rapidly fades under the scorching sun, it is used as an image of the brevity of human life (<a href=\"#\" onClick=\"return mV('Isa',40,6,7);\">Isa 40:6-7</a>; <a href=\"#\" onClick=\"return mV('Psa',90,5);\">Psa 90:5</a>). In <a href=\"#\" onClick=\"return mV('Num',11,5);\">Num 11:5</a> this word is rendered \"leeks.\"<br><br>(2.) Heb. deshe', green grass (<a href=\"#\" onClick=\"return mV('Gen',1,11,12);\">Gen 1:11-12</a>; <a href=\"#\" onClick=\"return mV('Isa',66,14);\">Isa 66:14</a>; <a href=\"#\" onClick=\"return mV('Deu',32,2);\">Deu 32:2</a>). \"The sickly and forced blades of grass which spring up on the flat plastered roofs of houses in the East are used as an emblem of speedy destruction, because they are small and weak, and because, under the scorching rays of the sun, they soon wither away\" (<a href=\"#\" onClick=\"return mV('2Ki',19,26);\">2Ki 19:26</a>; <a href=\"#\" onClick=\"return mV('Psa',129,6);\">Psa 129:6</a>; <a href=\"#\" onClick=\"return mV('Isa',37,27);\">Isa 37:27</a>).<br><br>The dry stalks of grass were often used as fuel for the oven (<a href=\"#\" onClick=\"return mV('Mat',6,30);\">Mat 6:30</a>; <a href=\"#\" onClick=\"return mV('Mat',13,30);\">13:30</a>; <a href=\"#\" onClick=\"return mV('Luk',12,28);\">Luk 12:28</a>).";
eastonArray["$$T0001544"] = "<strong>Grasshopper:</strong> belongs to the class of neuropterous insects called Gryllidae. This insect is not unknown in Palestine.<br><br>In <a href=\"#\" onClick=\"return mV('Jdg',6,5);\">Jdg 6:5</a>; <a href=\"#\" onClick=\"return mV('Jdg',7,12);\">7:12</a>; <a href=\"#\" onClick=\"return mV('Job',39,30);\">Job 39:30</a>; <a href=\"#\" onClick=\"return mV('Jer',46,23);\">Jer 46:23</a>, where the Authorized Version has \"grasshopper,\" the Revised Version more correctly renders the Hebrew word ('arbeh) by \"locust.\" This is the case also in <a href=\"#\" onClick=\"return mV('Amo',7,1);\">Amo 7:1</a>; <a href=\"#\" onClick=\"return mV('Nah',3,17);\">Nah 3:17</a>, where the Hebrew word <i>gob</i> is used; and in <a href=\"#\" onClick=\"return mV('Lev',11,22);\">Lev 11:22</a>; <a href=\"#\" onClick=\"return mV('Num',13,33);\">Num 13:33</a>; <a href=\"#\" onClick=\"return mV('Ecc',12,5);\">Ecc 12:5</a>; <a href=\"#\" onClick=\"return mV('Isa',40,22);\">Isa 40:22</a>, where <i>hagab</i> is used. In all these instances the proper rendering is probably \"locust\" (q.v.).";
eastonArray["$$T0001545"] = "<strong>Grate:</strong> a network of brass for the bottom of the great altar of sacrifice (<a href=\"#\" onClick=\"return mV('Exd',27,4);\">Exd 27:4</a>; <a href=\"#\" onClick=\"return mV('Exd',35,16);\">35:16</a>; <a href=\"#\" onClick=\"return mV('Exd',38,4,5,30);\">38:4-5, 30</a>).";
eastonArray["$$T0001546"] = "<strong>Grave:</strong> Among the ancient Hebrews graves were outside of cities in the open field (<a href=\"#\" onClick=\"return mV('Luk',7,12);\">Luk 7:12</a>; <a href=\"#\" onClick=\"return mV('Jhn',11,30);\">Jhn 11:30</a>). Kings (<a href=\"#\" onClick=\"return mV('1Ki',2,10);\">1Ki 2:10</a>) and prophets (<a href=\"#\" onClick=\"return mV('1Sa',25,1);\">1Sa 25:1</a>) were generally buried within cities. Graves were generally grottoes or caves, natural or hewn out in rocks (<a href=\"#\" onClick=\"return mV('Isa',22,16);\">Isa 22:16</a>; <a href=\"#\" onClick=\"return mV('Mat',27,60);\">Mat 27:60</a>). There were family cemeteries (<a href=\"#\" onClick=\"return mV('Gen',47,29);\">Gen 47:29</a>; <a href=\"#\" onClick=\"return mV('Gen',50,5);\">50:5</a>; <a href=\"#\" onClick=\"return mV('2Sa',19,37);\">2Sa 19:37</a>). Public burial-places were assigned to the poor (<a href=\"#\" onClick=\"return mV('Jer',26,23);\">Jer 26:23</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,6);\">2Ki 23:6</a>). Graves were usually closed with stones, which were whitewashed, to warn strangers against contact with them (<a href=\"#\" onClick=\"return mV('Mat',23,27);\">Mat 23:27</a>), which caused ceremonial pollution (<a href=\"#\" onClick=\"return mV('Num',19,16);\">Num 19:16</a>).<br><br>There were no graves in Jerusalem except those of the kings, and according to tradition that of the prophetess Huldah.";
eastonArray["$$T0001547"] = "<strong>Graven image:</strong> <a href=\"#\" onClick=\"return mV('Deu',27,15);\">Deu 27:15</a>; <a href=\"#\" onClick=\"return mV('Psa',97,7);\">Psa 97:7</a> (Heb. pesel), refers to the household gods of idolaters. \"Every nation and city had its own gods...Yet every family had its separate household or tutelary god.\"";
eastonArray["$$T0001548"] = "<strong>Graving:</strong><br><br>(1.) Heb. hatsabh. <a href=\"#\" onClick=\"return mV('Job',19,24);\">Job 19:24</a>, rendered \"graven,\" but generally means hewn stone or wood, in quarry or forest.<br><br>(2.) Heb. harush. <a href=\"#\" onClick=\"return mV('Jer',17,1);\">Jer 17:1</a>, rendered \"graven,\" and indicates generally artistic work in metal, wood, and stone, effected by fine instruments.<br><br>(3.) Heb. haqaq. <a href=\"#\" onClick=\"return mV('Eze',4,1);\">Eze 4:1</a>, engraving a plan or map, rendered \"pourtray;\" <a href=\"#\" onClick=\"return mV('Job',19,23);\">Job 19:23</a>, \"written.\"<br><br>(4.) Heb. pasal points rather to the sculptor's or the carver's art (<a href=\"#\" onClick=\"return mV('Isa',30,22);\">Isa 30:22</a>; <a href=\"#\" onClick=\"return mV('Isa',40,19);\">40:19</a>; <a href=\"#\" onClick=\"return mV('Isa',41,7);\">41:7</a>; <a href=\"#\" onClick=\"return mV('Isa',44,'12-15');\">44:12-15</a>).<br><br>(5.) Pathah refers to intaglio work, the cutting and engraving of precious stones (<a href=\"#\" onClick=\"return mV('Exd',28,'9-11',21);\">Exd 28:9-11, 21</a>; <a href=\"#\" onClick=\"return mV('Zec',3,9);\">Zec 3:9</a>; <a href=\"#\" onClick=\"return mV('Sgs',1,10,11);\">Sgs 1:10-11</a>).<br><br>(6.) Heret. In <a href=\"#\" onClick=\"return mV('Exd',32,4);\">Exd 32:4</a> rendered \"graving tool;\" and in <a href=\"#\" onClick=\"return mV('Isa',8,1);\">Isa 8:1</a>, \"a pen.\"";
eastonArray["$$T0001549"] = "<strong>Greaves:</strong> only in <a href=\"#\" onClick=\"return mV('1Sa',17,6);\">1Sa 17:6</a>, a piece of defensive armour (q.v.) reaching from the foot to the knee; from French greve, \"the shin.\" They were the Roman cothurni.";
</script>
