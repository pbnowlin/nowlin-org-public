<script>
var eastonArray = new Array ();
eastonArray["$$T0002200"] = "<strong>Kirjath-arba:</strong> city of Arba, the original name of Hebron (q.v.), so called from the name of its founder, one of the Anakim (<a href=\"#\" onClick=\"return mV('Gen',23,2);\">Gen 23:2</a>; <a href=\"#\" onClick=\"return mV('Gen',35,27);\">35:27</a>; <a href=\"#\" onClick=\"return mV('Jos',15,13);\">Jos 15:13</a>). It was given to Caleb by Joshua as his portion. The Jews interpret the name as meaning \"the city of the four\", i.e., of Abraham, Isaac, Jacob, and Adam, who were all, as they allege, buried there.";
eastonArray["$$T0002201"] = "<strong>Kirjath-huzoth:</strong> city of streets, <a href=\"#\" onClick=\"return mV('Num',22,39);\">Num 22:39</a>, a Moabite city, which some identify with Kirjathaim. Balak here received and entertained Balaam, whom he had invited from Pethor, among the \"mountains of the east,\" beyond the Euphrates, to lay his ban upon the Israelites, whose progress he had no hope otherwise of arresting. It was probably from the summit of Attarus, the high place near the city, that the soothsayer first saw the encampments of Israel.";
eastonArray["$$T0002202"] = "<strong>Kirjath-jearim:</strong> city of jaars; i.e., of woods or forests, a Gibeonite town (<a href=\"#\" onClick=\"return mV('Jos',9,17);\">Jos 9:17</a>) on the border of Benjamin, to which tribe it was assigned (<a href=\"#\" onClick=\"return mV('Jos',18,15,28);\">18:15, 28</a>). The ark was brought to this place (<a href=\"#\" onClick=\"return mV('1Sa',7,1,2);\">1Sa 7:1-2</a>) from Beth-shemesh and put in charge of Abinadab, a Levite. Here it remained till it was removed by David to Jerusalem (<a href=\"#\" onClick=\"return mV('2Sa',6,2,3,12);\">2Sa 6:2-3, 12</a>; <a href=\"#\" onClick=\"return mV('1Ch',15,'1-29');\">1Ch 15:1-29</a>; comp. <a href=\"#\" onClick=\"return mV('Psa',132,'1-');\">Psa 132</a>). It was also called Baalah (<a href=\"#\" onClick=\"return mV('Jos',15,9);\">Jos 15:9</a>) and Kirjath-baal (<a href=\"#\" onClick=\"return mV('Jos',15,60);\">60</a>). It has been usually identified with Kuriet el-'Enab (i.e., \"city of grapes\"), among the hills, about 8 miles north-east of 'Ain Shems (i.e., Beth-shemesh). The opinion, however, that it is to be identified with 'Erma, 4 miles east of 'Ain Shems, on the edge of the valley of Sorek, seems to be better supported. (See KIRJATH <a href=\"#\" onClick=\"return doDictLookup('ET0002198');\">T0002198</a>.)<br/><br/>The words of <a href=\"#\" onClick=\"return mV('Psa',132,6);\">Psa 132:6</a>, \"We found it in the fields of the wood,\" refer to the sojourn of the ark at Kirjath-jearim. \"Wood\" is here the rendering of the Hebrew word <i>jaar</i>, which is the singular of <i>jearim</i>.";
eastonArray["$$T0002203"] = "<strong>Kirjath-sannah:</strong> city of the sannah; i.e., of the palm (?), <a href=\"#\" onClick=\"return mV('Jos',15,49);\">Jos 15:49</a>; the same as Kirjath-sepher (<a href=\"#\" onClick=\"return mV('Jos',15,16);\">Jos 15:16</a>; <a href=\"#\" onClick=\"return mV('Jdg',1,11);\">Jdg 1:11</a>) and Debir (q.v.), a Canaanitish royal city included in Judah (<a href=\"#\" onClick=\"return mV('Jos',10,38);\">Jos 10:38</a>; <a href=\"#\" onClick=\"return mV('Jos',15,49);\">15:49</a>), and probably the chief seat of learning among the Hittites. It was about 12 miles to the south-west of Hebron.";
eastonArray["$$T0002204"] = "<strong>Kirjath-sepher:</strong> city of books, <a href=\"#\" onClick=\"return mV('Jos',15,15);\">Jos 15:15</a>; same as Kirjath-sannah (q.v.), now represented by the valley of ed-Dhaberiyeh, south-west of Hebron. The name of this town is an evidence that the Canaanites were acquainted with writing and books. \"The town probably contained a noted school, or was the site of an oracle and the residence of some learned priest.\" The \"books\" were probably engraved stones or bricks.";
eastonArray["$$T0002205"] = "<strong>Kir of Moab:</strong> <a href=\"#\" onClick=\"return mV('Isa',15,1);\">Isa 15:1</a>. The two strongholds of Moab were Ar and Kir, which latter is probably the Kir-haraseth (<a href=\"#\" onClick=\"return mV('Isa',16,7);\">Isa 16:7</a>) following.";
eastonArray["$$T0002206"] = "<strong>Kish:</strong> a bow.<br><br>(1.) A Levite of the family of Merari (<a href=\"#\" onClick=\"return mV('1Ch',23,21);\">1Ch 23:21</a>; <a href=\"#\" onClick=\"return mV('1Ch',24,29);\">24:29</a>).<br/><br/>(2.) A Benjamite of Jerusalem (<a href=\"#\" onClick=\"return mV('1Ch',8,30);\">1Ch 8:30</a>; <a href=\"#\" onClick=\"return mV('1Ch',9,36);\">9:36</a>).<br/><br/>(3.) A Levite in the time of Hezekiah (<a href=\"#\" onClick=\"return mV('2Ch',29,12);\">2Ch 29:12</a>).<br/><br/>(4.) The great-grandfather of Mordecai (<a href=\"#\" onClick=\"return mV('Est',2,5);\">Est 2:5</a>).<br/><br/>(5.) A Benjamite, the son of Abiel, and father of king Saul (<a href=\"#\" onClick=\"return mV('1Sa',9,1,3);\">1Sa 9:1, 3</a>; <a href=\"#\" onClick=\"return mV('1Sa',10,11,21);\">10:11, 21</a>; <a href=\"#\" onClick=\"return mV('1Sa',14,51);\">14:51</a>; <a href=\"#\" onClick=\"return mV('2Sa',21,14);\">2Sa 21:14</a>). All that is recorded of him is that he sent his son Saul in search of his asses that had strayed, and that he was buried in Zelah. Called Cis, <a href=\"#\" onClick=\"return mV('Act',13,21);\">Act 13:21</a> (R.V., Kish).";
eastonArray["$$T0002207"] = "<strong>Kishion:</strong> hardness, a city of Issachar assigned to the Gershonite Levites (<a href=\"#\" onClick=\"return mV('Jos',19,20);\">Jos 19:20</a>), the same as Kishon (<a href=\"#\" onClick=\"return mV('Jos',21,28);\">21:28</a>).";
eastonArray["$$T0002208"] = "<strong>Kishon:</strong> winding, a winter torrent of Central Palestine, which rises about the roots of Tabor and Gilboa, and passing in a northerly direction through the plains of Esdraelon and Acre, falls into the Mediterranean at the north-eastern corner of the bay of Acre, at the foot of Carmel. It is the drain by which the waters of the plain of Esdraelon and of the mountains that surround it find their way to the sea. It bears the modern name of Nahr el-Mokattah, i.e., \"the river of slaughter\" (<a href=\"#\" onClick=\"return mV('1Ki',18,40);\">1Ki 18:40</a>). In the triumphal song of Deborah (<a href=\"#\" onClick=\"return mV('Jdg',5,21);\">Jdg 5:21</a>) it is spoken of as \"that ancient river,\" either<br><br>(1) because it had flowed on for ages, or<br><br>(2), according to the Targum, because it was \"the torrent in which were shown signs and wonders to Israel of old;\" or<br><br>(3) probably the reference is to the exploits in that region among the ancient Canaanites, for the adjoining plain of Esdraelon was the great battle-field of Palestine.<br/><br/>This was the scene of the defeat of Sisera (<a href=\"#\" onClick=\"return mV('Jdg',4,7,13);\">Jdg 4:7, 13</a>), and of the destruction of the prophets of Baal by Elijah (<a href=\"#\" onClick=\"return mV('1Ki',18,40);\">1Ki 18:40</a>). \"When the Kishon was at its height, it would be, partly on account of its quicksands, as impassable as the ocean itself to a retreating army.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0000996');\">DEBORAH</a>.)";
eastonArray["$$T0002209"] = "<strong>Kiss:</strong> of affection (<a href=\"#\" onClick=\"return mV('Gen',27,26,27);\">Gen 27:26-27</a>; <a href=\"#\" onClick=\"return mV('Gen',29,13);\">29:13</a>; <a href=\"#\" onClick=\"return mV('Luk',7,38,45);\">Luk 7:38, 45</a>); reconciliation (<a href=\"#\" onClick=\"return mV('Gen',33,4);\">Gen 33:4</a>; <a href=\"#\" onClick=\"return mV('2Sa',14,33);\">2Sa 14:33</a>); leave-taking (<a href=\"#\" onClick=\"return mV('Gen',31,28,55);\">Gen 31:28, 55</a>; <a href=\"#\" onClick=\"return mV('Rth',1,14);\">Rth 1:14</a>; <a href=\"#\" onClick=\"return mV('2Sa',19,39);\">2Sa 19:39</a>); homage (<a href=\"#\" onClick=\"return mV('Psa',2,12);\">Psa 2:12</a>; <a href=\"#\" onClick=\"return mV('1Sa',10,1);\">1Sa 10:1</a>); spoken of as between parents and children (<a href=\"#\" onClick=\"return mV('Gen',27,26);\">Gen 27:26</a>; <a href=\"#\" onClick=\"return mV('Gen',31,28,55);\">31:28, 55</a>; <a href=\"#\" onClick=\"return mV('Gen',48,10);\">48:10</a>; <a href=\"#\" onClick=\"return mV('Gen',50,1);\">50:1</a>; <a href=\"#\" onClick=\"return mV('Exd',18,7);\">Exd 18:7</a>; <a href=\"#\" onClick=\"return mV('Rth',1,9,14);\">Rth 1:9, 14</a>); between male relatives (<a href=\"#\" onClick=\"return mV('Gen',29,13);\">Gen 29:13</a>; <a href=\"#\" onClick=\"return mV('Gen',33,4);\">33:4</a>; <a href=\"#\" onClick=\"return mV('Gen',45,15);\">45:15</a>). It accompanied social worship as a symbol of brotherly love (<a href=\"#\" onClick=\"return mV('Rom',16,16);\">Rom 16:16</a>; <a href=\"#\" onClick=\"return mV('1Cr',16,20);\">1Cr 16:20</a>; <a href=\"#\" onClick=\"return mV('2Cr',13,12);\">2Cr 13:12</a>; <a href=\"#\" onClick=\"return mV('1Th',5,26);\">1Th 5:26</a>; <a href=\"#\" onClick=\"return mV('1Pe',5,14);\">1Pe 5:14</a>). The worship of idols was by kissing the image or the hand toward the image (<a href=\"#\" onClick=\"return mV('1Ki',19,18);\">1Ki 19:18</a>; <a href=\"#\" onClick=\"return mV('Hsa',13,2);\">Hsa 13:2</a>).";
eastonArray["$$T0002210"] = "<strong>Kite:</strong> an unclean and keen-sighted bird of prey (<a href=\"#\" onClick=\"return mV('Lev',11,14);\">Lev 11:14</a>; <a href=\"#\" onClick=\"return mV('Deu',14,13);\">Deu 14:13</a>). The Hebrew word used, <i>'ayet</i>, is rendered \"vulture\" in <a href=\"#\" onClick=\"return mV('Job',28,7);\">Job 28:7</a> in Authorized Version, \"falcon\" in Revised Version. It is probably the red kite (Milvus regalis), a bird of piercing sight and of soaring habits found all over Palestine.";
eastonArray["$$T0002211"] = "<strong>Kithlish:</strong> a man's wall, a town in the plain of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,40);\">Jos 15:40</a>). It has been identified with Jelameh.";
eastonArray["$$T0002212"] = "<strong>Kitron:</strong> knotty, a city of Zebulun (<a href=\"#\" onClick=\"return mV('Jdg',1,30);\">Jdg 1:30</a>), called also Kattath (<a href=\"#\" onClick=\"return mV('Jos',19,15);\">Jos 19:15</a>); supposed to be \"Cana of Galilee.\"";
eastonArray["$$T0002213"] = "<strong>Kittim:</strong> (<a href=\"#\" onClick=\"return mV('Gen',10,4);\">Gen 10:4</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000811');\">CHITTIM</a>.)";
eastonArray["$$T0002214"] = "<strong>Knead:</strong> to prepare dough in the process of baking (<a href=\"#\" onClick=\"return mV('Gen',18,6);\">Gen 18:6</a>; <a href=\"#\" onClick=\"return mV('1Sa',28,24);\">1Sa 28:24</a>; <a href=\"#\" onClick=\"return mV('Hsa',7,4);\">Hsa 7:4</a>).";
eastonArray["$$T0002215"] = "<strong>Kneading-trough:</strong> the vessel in which the dough, after being mixed and leavened, was left to swell or ferment (<a href=\"#\" onClick=\"return mV('Exd',8,3);\">Exd 8:3</a>; <a href=\"#\" onClick=\"return mV('Exd',12,34);\">12:34</a>; <a href=\"#\" onClick=\"return mV('Deu',28,5,7);\">Deu 28:5, 7</a>). The dough in the vessels at the time of the Exodus was still unleavened, because the people were compelled to withdraw in haste.";
eastonArray["$$T0002216"] = "<strong>Knife:</strong><br><br>(1.) Heb. hereb, \"the waster,\" a sharp instrument for circumcision (<a href=\"#\" onClick=\"return mV('Jos',5,2,3);\">Jos 5:2-3</a>, lit. \"knives of flint; <a href=\"#\" onClick=\"return mV('Exd',4,25);\">Exd 4:25</a>); a razor (<a href=\"#\" onClick=\"return mV('Eze',5,1);\">Eze 5:1</a>); a graving tool (<a href=\"#\" onClick=\"return mV('Exd',20,25);\">Exd 20:25</a>); an axe (<a href=\"#\" onClick=\"return mV('Eze',26,9);\">Eze 26:9</a>).<br/><br/>(2.) Heb. maakeleth, a large knife for slaughtering and cutting up food (<a href=\"#\" onClick=\"return mV('Gen',22,6,10);\">Gen 22:6, 10</a>; <a href=\"#\" onClick=\"return mV('Pro',30,14);\">Pro 30:14</a>).<br/><br/>(3.) Heb. sakkin, a knife for any purpose, a table knife (<a href=\"#\" onClick=\"return mV('Pro',23,2);\">Pro 23:2</a>).<br/><br/>(4.) Heb. mahalaph, a butcher's knife for slaughtering the victims offered in sacrifice (<a href=\"#\" onClick=\"return mV('Ezr',1,9);\">Ezr 1:9</a>).<br/><br/>(5.) Smaller knives (<a href=\"#\" onClick=\"return mV('Jer',36,26);\">Jer 36:26</a>) were used for sharpening pens. The pruning-knives mentioned in <a href=\"#\" onClick=\"return mV('Isa',18,5);\">Isa 18:5</a> (Heb. mizmaroth) were probably curved knives.";
eastonArray["$$T0002217"] = "<strong>Knock:</strong> \"Though Orientals are very jealous of their privacy, they never knock when about to enter your room, but walk in without warning or ceremony. It is nearly impossible to teach an Arab servant to knock at your door. They give warning at the outer gate either by calling or knocking. To stand and call is a very common and respectful mode. Thus Moses commanded the holder of a pledge to stand without and call to the owner to come forth (<a href=\"#\" onClick=\"return mV('Deu',24,10);\">Deu 24:10</a>). This was to avoid the violent intrusion of cruel creditors. Peter stood knocking at the outer door (<a href=\"#\" onClick=\"return mV('Act',12,13,16);\">Act 12:13, 16</a>), and the three men sent to Joppa by Cornelius made inquiry and 'stood before the gate' (<a href=\"#\" onClick=\"return mV('Act',10,17,18);\">10:17-18</a>). The idea is that the guard over your privacy is to be placed at the entrance.\"<br/><br/>Knocking is used as a sign of importunity (<a href=\"#\" onClick=\"return mV('Mat',7,7,8);\">Mat 7:7-8</a>; <a href=\"#\" onClick=\"return mV('Luk',13,25);\">Luk 13:25</a>), and of the coming of Christ (<a href=\"#\" onClick=\"return mV('Luk',12,36);\">Luk 12:36</a>; <a href=\"#\" onClick=\"return mV('Rev',3,20);\">Rev 3:20</a>).";
eastonArray["$$T0002218"] = "<strong>Knop:</strong> some architectural ornament.<br><br>(1.) Heb. kaphtor (<a href=\"#\" onClick=\"return mV('Exd',25,'31-36');\">Exd 25:31-36</a>), occurring in the description of the candlestick. It was an ornamental swell beneath the cups of the candlestick, probably an imitation of the fruit of the almond.<br/><br/>(2.) Heb. peka'im, found only in <a href=\"#\" onClick=\"return mV('1Ki',6,18);\">1Ki 6:18</a> and <a href=\"#\" onClick=\"return mV('1Ki',7,24);\">1Ki 7:24</a>, an ornament resembling a small gourd or an egg, on the cedar wainscot in the temple and on the castings on the brim of the brazen sea.";
eastonArray["$$T0002219"] = "<strong>Koa:</strong> he-camel, occurs only in <a href=\"#\" onClick=\"return mV('Eze',23,23);\">Eze 23:23</a>, some province or place in the Babylonian empire, used in this passage along with Shoa (q.v.).";
eastonArray["$$T0002220"] = "<strong>Kohath:</strong> assembly, the second son of Levi, and father of Amram (<a href=\"#\" onClick=\"return mV('Gen',46,11);\">Gen 46:11</a>). He came down to Egypt with Jacob, and lived to the age of one hundred and thirty-three years (<a href=\"#\" onClick=\"return mV('Exd',6,18);\">Exd 6:18</a>).";
eastonArray["$$T0002221"] = "<strong>Kohathites:</strong> the descendants of Kohath. They formed the first of the three divisions of the Levites (<a href=\"#\" onClick=\"return mV('Exd',6,16,18);\">Exd 6:16, 18</a>; <a href=\"#\" onClick=\"return mV('Num',3,17);\">Num 3:17</a>). In the journeyings of the Israelites they had the charge of the most holy portion of the vessels of the tabernacle, including the ark (<a href=\"#\" onClick=\"return mV('Num',4,'1-')\">Num 4</a>). Their place in the marching and encampment was south of the tabernacle (<a href=\"#\" onClick=\"return mV('Num',3,29,31);\">Num 3:29, 31</a>). Their numbers at different times are specified (<a href=\"#\" onClick=\"return mV('Num',3,28);\">3:28</a>; <a href=\"#\" onClick=\"return mV('Num',4,36);\">4:36</a>; <a href=\"#\" onClick=\"return mV('Num',26,57,62);\">26:57, 62</a>). Samuel was of this division.";
eastonArray["$$T0002222"] = "<strong>Korah:</strong> ice, hail.<br><br>(1.) The third son of Esau, by Aholibamah (<a href=\"#\" onClick=\"return mV('Gen',36,14);\">Gen 36:14</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,35);\">1Ch 1:35</a>).<br/><br/>(2.) A Levite, the son of Izhar, the brother of Amram, the father of Moses and Aaron (<a href=\"#\" onClick=\"return mV('Exd',6,21);\">Exd 6:21</a>). The institution of the Aaronic priesthood and the Levitical service at Sinai was a great religious revolution. The old priesthood of the heads of families passed away. This gave rise to murmurings and discontent, while the Israelites were encamped at Kadesh for the first time, which came to a head in a rebellion against Moses and Aaron, headed by Korah, Dathan, and Abiram. Two hundred and fifty princes, \"men of renown\" i.e., well-known men from among the other tribes, joined this conspiracy. The whole company demanded of Moses and Aaron that the old state of things should be restored, alleging that \"they took too much upon them\" (<a href=\"#\" onClick=\"return mV('Num',16,'1-3');\">Num 16:1-3</a>). On the morning after the outbreak, Korah and his associates presented themselves at the door of the tabernacle, and \"took every man his censer, and put fire in them, and laid incense thereon.\" But immediately \"fire from the Lord\" burst forth and destroyed them all (<a href=\"#\" onClick=\"return mV('Num',16,35);\">Num 16:35</a>). Dathan and Abiram \"came out and stood in the door of their tents, and their wives, and their sons, and their little children,\" and it came to pass \"that the ground clave asunder that was under them; and the earth opened her mouth and swallowed them up.\" A plague thereafter began among the people who sympathized in the rebellion, and was only stayed by Aaron's appearing between the living and the dead, and making \"an atonement for the people\" (<a href=\"#\" onClick=\"return mV('Num',16,47);\">16:47</a>).<br/><br/>The descendants of the sons of Korah who did not participate in the rebellion afterwards rose to eminence in the Levitical service.";
eastonArray["$$T0002223"] = "<strong>Korahites:</strong> that portion of the Kohathites that descended from Korah.<br><br>(1.) They were an important branch of the singers of the Kohathite division (<a href=\"#\" onClick=\"return mV('2Ch',20,19);\">2Ch 20:19</a>). There are eleven psalms (<a href=\"#\" onClick=\"return mV('Psa',42,'1-');\">42</a>; <a href=\"#\" onClick=\"return mV('Psa',43,'1-');\">43</a>; <a href=\"#\" onClick=\"return mV('Psa',44,'1-');\">44</a>; <a href=\"#\" onClick=\"return mV('Psa',45,'1-');\">45</a>; <a href=\"#\" onClick=\"return mV('Psa',49,'1-');\">49</a>; <a href=\"#\" onClick=\"return mV('Psa',84,'1-');\">84</a>; <a href=\"#\" onClick=\"return mV('Psa',85,'1-');\">85</a>; <a href=\"#\" onClick=\"return mV('Psa',87,'1-');\">87</a>; <a href=\"#\" onClick=\"return mV('Psa',88,'1-');\">88</a>) dedicated to the sons of Korah.<br/><br/>(2.) Some of the sons of Korah also were \"porters\" of the temple (<a href=\"#\" onClick=\"return mV('1Ch',9,'17-19');\">1Ch 9:17-19</a>); one of them was over \"things that were made in the pans\" (<a href=\"#\" onClick=\"return mV('1Ch',9,31);\">31</a>), i.e., the baking in pans for the meat-offering (<a href=\"#\" onClick=\"return mV('Lev',2,5);\">Lev 2:5</a>).";
eastonArray["$$T0002224"] = "<strong>Kore:</strong> partridge.<br><br>(1.) A Levite and temple-warder of the Korahites, the son of Asaph. He was father of Shallum and Meshelemiah, temple-porters (<a href=\"#\" onClick=\"return mV('1Ch',9,19);\">1Ch 9:19</a>; <a href=\"#\" onClick=\"return mV('1Ch',26,1);\">26:1</a>).<br/><br/>(2.) A Levitical porter at the east gate of the temple (<a href=\"#\" onClick=\"return mV('2Ch',31,14);\">2Ch 31:14</a>).<br/><br/>(3.) In <a href=\"#\" onClick=\"return mV('1Ch',26,19);\">1Ch 26:19</a> the word should be \"Korahites,\" as in the Revised Version.";
eastonArray["$$T0002225"] = "<strong>Korhites:</strong> a Levitical family descended from Korah (<a href=\"#\" onClick=\"return mV('Exd',6,24);\">Exd 6:24</a>; <a href=\"#\" onClick=\"return mV('1Ch',12,6);\">1Ch 12:6</a>; <a href=\"#\" onClick=\"return mV('1Ch',26,1);\">26:1</a>; <a href=\"#\" onClick=\"return mV('2Ch',20,19);\">2Ch 20:19</a>).";
eastonArray["$$T0002226"] = "<strong>Koz:</strong> thorn.<br><br>(1.) A descendant of Judah. <a href=\"#\" onClick=\"return mV('1Ch',4,8);\">1Ch 4:8</a>, \"Coz;\" R.V., \"Hakkoz.\"<br/><br/>(2.) A priest, the head of the seventh division of the priests (<a href=\"#\" onClick=\"return mV('Ezr',2,61);\">Ezr 2:61</a>; <a href=\"#\" onClick=\"return mV('Neh',3,4,21);\">Neh 3:4, 21</a>; <a href=\"#\" onClick=\"return mV('Neh',7,63);\">7:63</a>). In <a href=\"#\" onClick=\"return mV('1Ch',24,10);\">1Ch 24:10</a> the word has the article prefixed, and it is taken as a part of the word \"Hakkoz.\"";
eastonArray["$$T0002227"] = "<strong>Laban:</strong> white.<br><br>(1.) The son of Bethuel, who was the son of Nahor, Abraham's brother. He lived at Haran in Mesopotamia. His sister Rebekah was Isaac's wife (In <a href=\"#\" onClick=\"return mV('Gen',24,'1-')\">Gen 24</a>). Jacob, one of the sons of this marriage, fled to the house of Laban, whose daughters Leah and Rachel <a href=\"#\" onClick=\"return mV('Gen',29,'1-')\">Gen 29</a>) he eventually married. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001945');\">JACOB</a>.)<br/><br/>(2.) A city in the Arabian desert in the route of the Israelites (<a href=\"#\" onClick=\"return mV('Deu',1,1);\">Deu 1:1</a>), probably identical with Libnah (<a href=\"#\" onClick=\"return mV('Num',33,20);\">Num 33:20</a>).";
eastonArray["$$T0002228"] = "<strong>Lachish:</strong> impregnable, a royal Canaanitish city in the Shephelah, or maritime plain of Palestine (<a href=\"#\" onClick=\"return mV('Jos',10,3,5);\">Jos 10:3, 5</a>; <a href=\"#\" onClick=\"return mV('Jos',12,11);\">12:11</a>). It was taken and destroyed by the Israelites (<a href=\"#\" onClick=\"return mV('Jos',10,'31-33');\">Jos 10:31-33</a>). It afterwards became, under Rehoboam, one of the strongest fortresses of Judah (<a href=\"#\" onClick=\"return mV('2Ch',10,9);\">2Ch 10:9</a>). It was assaulted and probably taken by Sennacherib (<a href=\"#\" onClick=\"return mV('2Ki',18,14,17);\">2Ki 18:14, 17</a>; <a href=\"#\" onClick=\"return mV('2Ki',19,8);\">19:8</a>; <a href=\"#\" onClick=\"return mV('Isa',36,2);\">Isa 36:2</a>). An account of this siege is given on some slabs found in the chambers of the palace of Koyunjik, and now in the British Museum. The inscription has been deciphered as follows:, \"Sennacherib, the mighty king, king of the country of Assyria, sitting on the throne of judgment before the city of Lachish: I gave permission for its slaughter.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0002735');\">NINEVEH</a>.)<br/><br/>Lachish has been identified with Tell-el-Hesy, where a cuneiform tablet has been found, containing a letter supposed to be from Amenophis at Amarna in reply to one of the Amarna tablets sent by Zimrida from Lachish. This letter is from the chief of Atim (<a href=\"#\" onClick=\"return mV('1Ch',4,32);\">1Ch 4:32</a>) to the chief of Lachish, in which the writer expresses great alarm at the approach of marauders from the Hebron hills. \"They have entered the land,\" he says, \"to lay waste...strong is he who has come down. He lays waste.\" This letter shows that \"the communication by tablets in cuneiform script was not only usual in writing to Egypt, but in the internal correspondence of the country. The letter, though not so important in some ways as the Moabite stone and the Siloam text, is one of the most valuable discoveries ever made in Palestine\" (Conder's Tell Amarna Tablets, p. 134).<br/><br/>Excavations at Lachish are still going on, and among other discoveries is that of an iron blast-furnace, with slag and ashes, which is supposed to have existed B.C. 1500. If the theories of experts are correct, the use of the hot-air blast instead of cold air (an improvement in iron manufacture patented by Neilson in 1828) was known fifteen hundred years before Christ. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001398');\">FURNACE</a>.)";
eastonArray["$$T0002229"] = "<strong>Ladder:</strong> occurs only once, in the account of Jacob's vision (<a href=\"#\" onClick=\"return mV('Gen',28,12);\">Gen 28:12</a>).";
eastonArray["$$T0002230"] = "<strong>Laish:</strong> a lion.<br><br>(1.) A city of the Sidonians, in the extreme north of Palestine (<a href=\"#\" onClick=\"return mV('Jdg',18,7,14);\">Jdg 18:7, 14</a>); called also Leshem (<a href=\"#\" onClick=\"return mV('Jos',19,47);\">Jos 19:47</a>) and Dan (<a href=\"#\" onClick=\"return mV('Jdg',18,7,29);\">Jdg 18:7, 29</a>; <a href=\"#\" onClick=\"return mV('Jer',8,16);\">Jer 8:16</a>). It lay near the sources of the Jordan, about 4 miles from Paneas. The restless and warlike tribe of Dan (q.v.), looking out for larger possessions, invaded this country and took Laish with its territory. It is identified with the ruin Tell-el-Kady, \"the mound of the judge,\" to the north of the Waters of Merom (<a href=\"#\" onClick=\"return mV('Jos',11,5);\">Jos 11:5</a>).<br/><br/>(2.) A place mentioned in <a href=\"#\" onClick=\"return mV('Isa',10,30);\">Isa 10:30</a>. It has been supposed to be the modern el-Isawiyeh, about a mile north-east of Jerusalem.<br/><br/>(3.) The father of Phalti (<a href=\"#\" onClick=\"return mV('1Sa',25,44);\">1Sa 25:44</a>).";
eastonArray["$$T0002231"] = "<strong>Lama:</strong> (<a href=\"#\" onClick=\"return mV('Mat',27,46);\">Mat 27:46</a>), a Hebrew word meaning why, quoted from <a href=\"#\" onClick=\"return mV('Psa',22,1);\">Psa 22:1</a>.";
eastonArray["$$T0002232"] = "<strong>Lamb:</strong><br><br>(1.) Heb. kebes, a male lamb from the first to the third year. Offered daily at the morning and the evening sacrifice (<a href=\"#\" onClick=\"return mV('Exd',29,'38-42');\">Exd 29:38-42</a>), on the Sabbath day (<a href=\"#\" onClick=\"return mV('Num',28,9);\">Num 28:9</a>), at the feast of the New Moon (<a href=\"#\" onClick=\"return mV('Num',28,11);\">28:11</a>), of Trumpets (<a href=\"#\" onClick=\"return mV('Num',29,2);\">29:2</a>), of Tabernacles (<a href=\"#\" onClick=\"return mV('Num',29,'13-40');\">13-40</a>), of Pentecost (<a href=\"#\" onClick=\"return mV('Lev',23,'18-20');\">Lev 23:18-20</a>), and of the Passover (<a href=\"#\" onClick=\"return mV('Exd',12,5);\">Exd 12:5</a>), and on many other occasions (<a href=\"#\" onClick=\"return mV('1Ch',29,21);\">1Ch 29:21</a>; <a href=\"#\" onClick=\"return mV('2Ch',29,21);\">2Ch 29:21</a>; <a href=\"#\" onClick=\"return mV('Lev',9,3);\">Lev 9:3</a>; <a href=\"#\" onClick=\"return mV('Lev',14,'10-25');\">14:10-25</a>).<br/><br/>(2.) Heb. taleh, a young sucking lamb (<a href=\"#\" onClick=\"return mV('1Sa',7,9);\">1Sa 7:9</a>; <a href=\"#\" onClick=\"return mV('Isa',65,25);\">Isa 65:25</a>). In the symbolical language of Scripture the lamb is the type of meekness and innocence (<a href=\"#\" onClick=\"return mV('Isa',11,6);\">Isa 11:6</a>; <a href=\"#\" onClick=\"return mV('Isa',65,25);\">65:25</a>; <a href=\"#\" onClick=\"return mV('Luk',10,3);\">Luk 10:3</a>; <a href=\"#\" onClick=\"return mV('Jhn',21,15);\">Jhn 21:15</a>).<br/><br/>The lamb was a symbol of Christ (<a href=\"#\" onClick=\"return mV('Gen',4,4);\">Gen 4:4</a>; <a href=\"#\" onClick=\"return mV('Exd',12,3);\">Exd 12:3</a>; <a href=\"#\" onClick=\"return mV('Exd',29,38);\">29:38</a>; <a href=\"#\" onClick=\"return mV('Isa',16,1);\">Isa 16:1</a>; <a href=\"#\" onClick=\"return mV('Isa',53,7);\">53:7</a>; <a href=\"#\" onClick=\"return mV('Jhn',1,36);\">Jhn 1:36</a>; <a href=\"#\" onClick=\"return mV('Rev',13,8);\">Rev 13:8</a>).<br/><br/>Christ is called the Lamb of God (<a href=\"#\" onClick=\"return mV('Jhn',1,29,36);\">Jhn 1:29, 36</a>), as the great sacrifice of which the former sacrifices were only types (<a href=\"#\" onClick=\"return mV('Num',6,12);\">Num 6:12</a>; <a href=\"#\" onClick=\"return mV('Lev',14,'12-17');\">Lev 14:12-17</a>; <a href=\"#\" onClick=\"return mV('Isa',53,7);\">Isa 53:7</a>; <a href=\"#\" onClick=\"return mV('1Cr',5,7);\">1Cr 5:7</a>).";
eastonArray["$$T0002233"] = "<strong>Lamech:</strong> the strikerdown; the wild man.<br><br>(1.) The fifth in descent from Cain. He was the first to violate the primeval ordinance of marriage (<a href=\"#\" onClick=\"return mV('Gen',4,'18-24');\">Gen 4:18-24</a>). His address to his two wives, Adah and Zillah (<a href=\"#\" onClick=\"return mV('Gen',4,23,24);\">4:23-24</a>), is the only extant example of antediluvian poetry. It has been called \"Lamech's sword-song.\" He was \"rude and ruffianly,\" fearing neither God nor man. With him the curtain falls on the race of Cain. We know nothing of his descendants.<br/><br/>(2.) The seventh in descent from Seth, being the only son of Methuselah. Noah was the oldest of his several sons (<a href=\"#\" onClick=\"return mV('Gen',5,'25-31');\">Gen 5:25-31</a>; <a href=\"#\" onClick=\"return mV('Luk',3,36);\">Luk 3:36</a>).";
eastonArray["$$T0002234"] = "<strong>Lamentation:</strong> (Heb. qinah), an elegy or dirge. The first example of this form of poetry is the lament of David over Saul and Jonathan (<a href=\"#\" onClick=\"return mV('2Sa',1,'17-27');\">2Sa 1:17-27</a>). It was a frequent accompaniment of mourning (<a href=\"#\" onClick=\"return mV('Amo',8,10);\">Amo 8:10</a>). In <a href=\"#\" onClick=\"return mV('2Sa',3,33,34);\">2Sa 3:33-34</a> is recorded David's lament over Abner. Prophecy sometimes took the form of a lament when it predicted calamity (<a href=\"#\" onClick=\"return mV('Eze',27,2,32);\">Eze 27:2, 32</a>; <a href=\"#\" onClick=\"return mV('Eze',28,12);\">28:12</a>; <a href=\"#\" onClick=\"return mV('Eze',32,2,16);\">32:2, 16</a>).";
eastonArray["$$T0002235"] = "<strong>Lamentations, Book of:</strong> called in the Hebrew canon <i>'Ekhah</i>, meaning \"How,\" being the formula for the commencement of a song of wailing. It is the first word of the book (see <a href=\"#\" onClick=\"return mV('2Sa',1,'19-27');\">2Sa 1:19-27</a>). The LXX. adopted the name rendered \"Lamentations\" (Gr. threnoi = Heb. qinoth) now in common use, to denote the character of the book, in which the prophet mourns over the desolations brought on the city and the holy land by Chaldeans. In the Hebrew Bible it is placed among the Khethubim. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000580');\">BIBLE</a>.)<br/><br/>As to its authorship, there is no room for hesitancy in following the LXX. and the Targum in ascribing it to Jeremiah. The spirit, tone, language, and subject-matter are in accord with the testimony of tradition in assigning it to him. According to tradition, he retired after the destruction of Jerusalem by Nebuchadnezzar to a cavern outside the Damascus gate, where he wrote this book. That cavern is still pointed out. \"In the face of a rocky hill, on the western side of the city, the local belief has placed 'the grotto of Jeremiah.' There, in that fixed attitude of grief which Michael Angelo has immortalized, the prophet may well be supposed to have mourned the fall of his country\" (Stanley, Jewish Church).<br/><br/>The book consists of five separate poems. In (see <a href=\"#\" onClick=\"return mV('Lam',1,'1-')\">Lam 1</a>) the prophet dwells on the manifold miseries oppressed by which the city sits as a solitary widow weeping sorely. In chapter <a href=\"#\" onClick=\"return mV('Lam',2,'1-')\">2</a> these miseries are described in connection with the national sins that had caused them. Chapter <a href=\"#\" onClick=\"return mV('Lam',3,'1-')\">3</a> speaks of hope for the people of God. The chastisement would only be for their good; a better day would dawn for them. Chapter <a href=\"#\" onClick=\"return mV('Lam',4,'1-')\">4</a> laments the ruin and desolation that had come upon the city and temple, but traces it only to the people's sins. Chapter <a href=\"#\" onClick=\"return mV('Lam',5,'1-')\">5</a> is a prayer that Zion's reproach may be taken away in the repentance and recovery of the people.<br/><br/>The first four poems (chapters) are acrostics, like some of the Psalms (see <a href=\"#\" onClick=\"return mV('Psa',25,'1-')\">Psa 25</a>; see <a href=\"#\" onClick=\"return mV('Psa',34,'1-')\">Psa 34</a>; see <a href=\"#\" onClick=\"return mV('Psa',37,'1-')\">Psa 37</a>; see <a href=\"#\" onClick=\"return mV('Psa',119,'1-')\">Psa 119</a>), i.e., each verse begins with a letter of the Hebrew alphabet taken in order. The first, second, and fourth have each twenty-two verses, the number of the letters in the Hebrew alphabet. The third has sixty-six verses, in which each three successive verses begin with the same letter. The fifth is not acrostic.<br/><br/>Speaking of the \"Wailing-place (q.v.) of the Jews\" at Jerusalem, a portion of the old wall of the temple of Solomon, Schaff says: \"There the Jews assemble every Friday afternoon to bewail the downfall of the holy city, kissing the stone wall and watering it with their tears. They repeat from their well-worn Hebrew Bibles and prayer-books the Lamentations of Jeremiah and suitable Psalms.\"";
eastonArray["$$T0002236"] = "<strong>Lamp:</strong><br><br>(1.) That part of the candle-sticks of the tabernacle and the temple which bore the light (<a href=\"#\" onClick=\"return mV('Exd',25,37);\">Exd 25:37</a>; <a href=\"#\" onClick=\"return mV('1Ki',7,49);\">1Ki 7:49</a>; <a href=\"#\" onClick=\"return mV('2Ch',4,20);\">2Ch 4:20</a>; <a href=\"#\" onClick=\"return mV('2Ch',13,11);\">13:11</a>; <a href=\"#\" onClick=\"return mV('Zec',4,2);\">Zec 4:2</a>). Their form is not described. Olive oil was generally burned in them (<a href=\"#\" onClick=\"return mV('Exd',27,20);\">Exd 27:20</a>).<br/><br/>(2.) A torch carried by the soliders of Gideon (<a href=\"#\" onClick=\"return mV('Jdg',7,16,20);\">Jdg 7:16, 20</a>). (R.V., \"torches.\")<br/><br/>(3.) Domestic lamps (A.V., \"candles\") were in common use among the Hebrews (<a href=\"#\" onClick=\"return mV('Mat',5,15);\">Mat 5:15</a>; <a href=\"#\" onClick=\"return mV('Mar',4,21);\">Mar 4:21</a>, etc.).<br/><br/>(4.) Lamps or torches were used in connection with marriage ceremonies (<a href=\"#\" onClick=\"return mV('Mat',25,1);\">Mat 25:1</a>).<br/><br/>This word is also frequently metaphorically used to denote life, welfare, guidance, etc. (<a href=\"#\" onClick=\"return mV('2Sa',21,17);\">2Sa 21:17</a>; <a href=\"#\" onClick=\"return mV('Psa',119,105);\">Psa 119:105</a>; <a href=\"#\" onClick=\"return mV('Pro',6,23);\">Pro 6:23</a>; <a href=\"#\" onClick=\"return mV('Pro',13,9);\">13:9</a>).";
eastonArray["$$T0002237"] = "<strong>Landmark:</strong> a boundary line indicated by a stone, stake, etc. (<a href=\"#\" onClick=\"return mV('Deu',19,14);\">Deu 19:14</a>; <a href=\"#\" onClick=\"return mV('Deu',27,17);\">27:17</a>; <a href=\"#\" onClick=\"return mV('Pro',22,28);\">Pro 22:28</a>; <a href=\"#\" onClick=\"return mV('Pro',23,10);\">23:10</a>; <a href=\"#\" onClick=\"return mV('Job',24,2);\">Job 24:2</a>). Landmarks could not be removed without incurring the severe displeasure of God.";
eastonArray["$$T0002238"] = "<strong>Laodicea:</strong> The city of this name mentioned in Scripture lay on the confines of Phrygia and Lydia, about 40 miles east of Ephesus (<a href=\"#\" onClick=\"return mV('Rev',3,14);\">Rev 3:14</a>), on the banks of the Lycus. It was originally called Diospolis and then Rhoas, but afterwards Laodicea, from Laodice, the wife of Antiochus II., king of Syria, who rebuilt it. It was one of the most important and flourishing cities of Asia Minor. At a very early period it became one of the chief seats of Christianity (<a href=\"#\" onClick=\"return mV('Col',2,1);\">Col 2:1</a>; <a href=\"#\" onClick=\"return mV('Col',4,15);\">4:15</a>; <a href=\"#\" onClick=\"return mV('Rev',1,11);\">Rev 1:11</a>, etc.). It is now a deserted place, called by the Turks Eski-hissar or \"old castle.\"";
eastonArray["$$T0002239"] = "<strong>Laodicea, Epistle from:</strong> (<a href=\"#\" onClick=\"return mV('Col',4,16);\">Col 4:16</a>), was probably the Epistle to the Ephesians, as designed for general circulation. It would reach the Colossians by way of Laodicea.";
eastonArray["$$T0002240"] = "<strong>Lapidoth:</strong> torches. Deborah is called \"the wife of Lapidoth\" (<a href=\"#\" onClick=\"return mV('Jdg',4,4);\">Jdg 4:4</a>). Some have rendered the expression \"a woman of a fiery spirit,\" under the supposition that Lapidoth is not a proper name, a woman of a torch-like spirit.";
eastonArray["$$T0002241"] = "<strong>Lapping:</strong> of water like a dog, i.e., by putting the hand filled with water to the mouth. The dog drinks by shaping the end of his long thin tongue into the form of a spoon, thus rapidly lifting up water, which he throws into his mouth. The three hundred men that went with Gideon thus employed their hands and lapped the water out of their hands (<a href=\"#\" onClick=\"return mV('Jdg',7,7);\">Jdg 7:7</a>).";
eastonArray["$$T0002242"] = "<strong>Lapwing:</strong> the name of an unclean bird, mentioned only in <a href=\"#\" onClick=\"return mV('Lev',11,19);\">Lev 11:19</a> and <a href=\"#\" onClick=\"return mV('Deu',14,18);\">Deu 14:18</a>. The Hebrew name of this bird, <i>dukiphath</i>, has been generally regarded as denoting the hoope (<i>Upupa epops</i>), an onomatopoetic word derived from the cry of the bird, which resembles the word \"hoop;\" a bird not uncommon in Palestine. Others identify it with the English peewit.";
eastonArray["$$T0002243"] = "<strong>Lasaea:</strong> a city in the island of Crete (<a href=\"#\" onClick=\"return mV('Act',27,8);\">Act 27:8</a>). Its ruins are still found near Cape Leonda, about 5 miles east of \"Fair Havens.\"";
eastonArray["$$T0002244"] = "<strong>Lasha:</strong> fissure, a place apparently east of the Dead Sea (<a href=\"#\" onClick=\"return mV('Gen',10,19);\">Gen 10:19</a>). It was afterwards known as Callirhoe, a place famous for its hot springs.";
eastonArray["$$T0002245"] = "<strong>Latchet:</strong> a thong (<a href=\"#\" onClick=\"return mV('Act',22,25);\">Act 22:25</a>), cord, or strap fastening the sandal on the foot (<a href=\"#\" onClick=\"return mV('Isa',5,27);\">Isa 5:27</a>; <a href=\"#\" onClick=\"return mV('Mar',1,7);\">Mar 1:7</a>; <a href=\"#\" onClick=\"return mV('Luk',3,16);\">Luk 3:16</a>).";
eastonArray["$$T0002246"] = "<strong>Latin:</strong> the vernacular language of the ancient Romans (<a href=\"#\" onClick=\"return mV('Jhn',19,20);\">Jhn 19:20</a>).";
eastonArray["$$T0002247"] = "<strong>Lattice:</strong><br><br>(1.) Heb. 'eshnabh, a latticed opening through which the cool breeze passes (<a href=\"#\" onClick=\"return mV('Jdg',5,28);\">Jdg 5:28</a>). The flat roofs of the houses were sometimes enclosed with a parapet of lattice-work on wooden frames, to screen the women of the house from the gaze of the neighbourhood.<br/><br/>(2.) Heb. harakim, the network or lattice of a window (<a href=\"#\" onClick=\"return mV('Sgs',2,9);\">Sgs 2:9</a>).<br/><br/>(3.) Heb. sebakhah, the latticed balustrade before a window or balcony (<a href=\"#\" onClick=\"return mV('2Ki',1,2);\">2Ki 1:2</a>). The lattice window is frequently used in Eastern countries.";
eastonArray["$$T0002248"] = "<strong>Laver:</strong> (Heb. kiyor), a \"basin\" for boiling in, a \"pan\" for cooking (<a href=\"#\" onClick=\"return mV('1Sa',2,14);\">1Sa 2:14</a>), a \"fire-pan\" or hearth (<a href=\"#\" onClick=\"return mV('Zec',12,6);\">Zec 12:6</a>), the sacred wash-bowl of the tabernacle and temple (<a href=\"#\" onClick=\"return mV('Exd',30,18,28);\">Exd 30:18, 28</a>; <a href=\"#\" onClick=\"return mV('Exd',31,9);\">31:9</a>; <a href=\"#\" onClick=\"return mV('Exd',35,16);\">35:16</a>; <a href=\"#\" onClick=\"return mV('Exd',38,8);\">38:8</a>; <a href=\"#\" onClick=\"return mV('Exd',39,39);\">39:39</a>; <a href=\"#\" onClick=\"return mV('Exd',40,7,11,30);\">40:7, 11, 30</a>, etc.), a basin for the water used by the priests in their ablutions.<br/><br/>That which was originally used in the tabernacle was of brass (rather copper; Heb. nihsheth), made from the metal mirrors the women brought out of Egypt (<a href=\"#\" onClick=\"return mV('Exd',38,8);\">Exd 38:8</a>). It contained water wherewith the priests washed their hands and feet when they entered the tabernacle (<a href=\"#\" onClick=\"return mV('Exd',40,32);\">40:32</a>). It stood in the court between the altar and the door of the tabernacle (<a href=\"#\" onClick=\"return mV('Exd',30,19,21);\">30:19, 21</a>).<br/><br/>In the temple there were ten lavers used for the sacrifices, and the molten sea for the ablutions of the priests (<a href=\"#\" onClick=\"return mV('2Ch',4,6);\">2Ch 4:6</a>). The position and uses of these are described <a href=\"#\" onClick=\"return mV('1Ki',7,'23-39');\">1 Kings 7:23-39</a>; <a href=\"#\" onClick=\"return mV('2Ch',4,6);\">2Ch 4:6</a>. The \"molten sea\" was made of copper, taken from Tibhath and Chun, cities of Hadarezer, king of Zobah (<a href=\"#\" onClick=\"return mV('1Ch',18,8);\">1Ch 18:8</a>; <a href=\"#\" onClick=\"return mV('1Ki',7,'23-26');\">1Ki 7:23-26</a>).<br/><br/>No lavers are mentioned in the second temple.";
eastonArray["$$T0002249"] = "<strong>Law:</strong> a rule of action.<br><br>(1.) The Law of Nature is the will of God as to human conduct, founded on the moral difference of things, and discoverable by natural light (<a href=\"#\" onClick=\"return mV('Rom',1,20);\">Rom 1:20</a>; <a href=\"#\" onClick=\"return mV('Rom',2,14,15);\">2:14-15</a>). This law binds all men at all times. It is generally designated by the term conscience, or the capacity of being influenced by the moral relations of things.<br/><br/>(2.) The Ceremonial Law prescribes under the Old Testament the rites and ceremonies of worship. This law was obligatory only till Christ, of whom these rites were typical, had finished his work (<a href=\"#\" onClick=\"return mV('Hbr',7,9,11);\">Hbr 7:9, 11</a>; <a href=\"#\" onClick=\"return mV('Hbr',10,1);\">10:1</a>; <a href=\"#\" onClick=\"return mV('Eph',2,16);\">Eph 2:16</a>). It was fulfilled rather than abrogated by the gospel.<br/><br/>(3.) The Judicial Law, the law which directed the civil policy of the Hebrew nation.<br/><br/>(4.) The Moral Law is the revealed will of God as to human conduct, binding on all men to the end of time. It was promulgated at Sinai. It is perfect (<a href=\"#\" onClick=\"return mV('Psa',19,7);\">Psa 19:7</a>), perpetual (<a href=\"#\" onClick=\"return mV('Mat',5,17,18);\">Mat 5:17-18</a>), holy (<a href=\"#\" onClick=\"return mV('Rom',7,12);\">Rom 7:12</a>), good, spiritual (<a href=\"#\" onClick=\"return mV('Rom',7,14);\">14), and exceeding broad (<a href=\"#\" onClick=\"return mV('Psa',119,96);\">Psa 119:96</a>). Although binding on all, we are not under it as a covenant of works (<a href=\"#\" onClick=\"return mV('Gal',3,17);\">Gal 3:17</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000871');\">COMMANDMENTS</a>.)<br/><br/>(5.) Positive Laws are precepts founded only on the will of God. They are right because God commands them.<br/><br/>(6.) Moral positive laws are commanded by God because they are right.";
</script>
