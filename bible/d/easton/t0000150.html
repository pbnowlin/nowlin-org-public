<script>var eastonArray = new Array ();
eastonArray["$$T0000150"] = "<b>Ahitub:</b> brother of goodness = good.<br><br>(1.) The son of Phinehas. On the death of his grandfather Eli he succeeded to the office of high priest, and was himself succeeded by his son Ahijah (<a href=\"#\" onClick=\"return mV('1Sa',14,3);\">1Sa 14:3</a>; <a href=\"#\" onClick=\"return mV('1Sa',22,9,11,12,20);\">22:9, 11-12, 20</a>).<br><br>(2.) The father of Zadok, who was made high priest by Saul after the extermination of the family of Ahimelech (<a href=\"#\" onClick=\"return mV('1Ch',6,7,8);\">1Ch 6:7-8</a>; <a href=\"#\" onClick=\"return mV('2Sa',8,17);\">2Sa 8:17</a>).";
eastonArray["$$T0000151"] = "<b>Ahlab:</b> fatness, a town of Asher lying within the unconquered Phoenician border (<a href=\"#\" onClick=\"return mV('Jdg',1,31);\">Jdg 1:31</a>), north-west of the Sea of Galilee; commonly identified with Giscala, now el-Jish.";
eastonArray["$$T0000152"] = "<b>Ahoah:</b> brotherly, one of the sons of Bela, the son of Benjamin (<a href=\"#\" onClick=\"return mV('1Ch',8,4);\">1Ch 8:4</a>). He is also called Ahiah (ver. <a href=\"#\" onClick=\"return mV('1Ch',8,7);\">7</a>) and Iri (<a href=\"#\" onClick=\"return mV('1Ch',7,7);\">1Ch 7:7</a>). His descendants were called Ahohites (<a href=\"#\" onClick=\"return mV('2Sa',23,9,28);\">2Sa 23:9, 28</a>).";
eastonArray["$$T0000153"] = "<b>Ahohite:</b> an epithet applied to Dodo, one of Solomon's captains (<a href=\"#\" onClick=\"return mV('1Ch',27,4);\">1Ch 27:4</a>); to his son Eleazar, one of David's three mightiest heroes (<a href=\"#\" onClick=\"return mV('2Sa',23,9);\">2Sa 23:9</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,12);\">1Ch 11:12</a>); and to Zalmon, one of the thirty (<a href=\"#\" onClick=\"return mV('2Sa',23,28);\">2Sa 23:28</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,29);\">1Ch 11:29</a>), from their descent from Ahoah.";
eastonArray["$$T0000154"] = "<b>Aholah:</b> she has her own tent, a name used by Ezekiel (<a href=\"#\" onClick=\"return mV('Eze',23,4,5,36,44);\">Eze 23:4-5, 36, 44</a>) as a symbol of the idolatry of the kingdom of Israel. This kingdom is described as a lewdwoman, an adulteress, given up to the abominations and idolatries of the Egyptians and Assyrians. Because of her crimes, she was carried away captive, and ceased to be a kingdom. (<a href=\"#\" onClick=\"return mV('Psa',78,'67-69');\">Psa 78:67-69</a>; <a href=\"#\" onClick=\"return mV('1Ki',12,'25-33');\">1Ki 12:25-33</a>; <a href=\"#\" onClick=\"return mV('2Ch',11,'13-16');\">2Ch 11:13-16</a>.)";
eastonArray["$$T0000155"] = "<b>Aholiab:</b> tent of the father, an artist of the tribe of Dan, appointed to the work of preparing materials for the tabernacle (<a href=\"#\" onClick=\"return mV('Exd',31,6);\">Exd 31:6</a>; <a href=\"#\" onClick=\"return mV('Exd',35,34);\">35:34</a>; <a href=\"#\" onClick=\"return mV('Exd',36,1,2);\">36:1-2</a>; <a href=\"#\" onClick=\"return mV('Exd',38,23);\">38:23</a>).";
eastonArray["$$T0000156"] = "<b>Aholibah:</b> my tent is in her, the name of an imaginary harlot, applied symbolically to Jerusalem, because she had abandoned the worship of the true God and given herself up to the idolatries of foreign nations. (<a href=\"#\" onClick=\"return mV('Eze',23,4,11,22,36,44);\">Eze 23:4, 11, 22, 36, 44</a>).";
eastonArray["$$T0000157"] = "<b>Aholibamah:</b> tent of the height, the name given to Judith, the daughter of Beeri = Anah (<a href=\"#\" onClick=\"return mV('Gen',26,34);\">Gen 26:34</a>; <a href=\"#\" onClick=\"return mV('Gen',36,2);\">36:2</a>), when she became the wife of Esau. A district among the mountains of Edom, probably near Mount Hor, was called after her name, or it may be that she received her name from the district. From her descended three tribes of Edomites, founded by her three sons.";
eastonArray["$$T0000158"] = "<b>Ai:</b> ruins.<br><br>(1.) One of the royal cities of the Canaanites (<a href=\"#\" onClick=\"return mV('Jos',10,1);\">Jos 10:1</a>; <a href=\"#\" onClick=\"return mV('Gen',12,8);\">Gen 12:8</a>; <a href=\"#\" onClick=\"return mV('Gen',13,3);\">13:3</a>). It was the scene of Joshua's defeat, and afterwards of his victory. It was the second Canaanite city taken by Israel (<a href=\"#\" onClick=\"return mV('Jos',7,'2-5');\">Jos 7:2-5</a>; <a href=\"#\" onClick=\"return mV('Jos',8,'1-29');\">8:1-29</a>). It lay rebuilt and inhibited by the Benjamites (<a href=\"#\" onClick=\"return mV('Ezr',2,28);\">Ezr 2:28</a>; <a href=\"#\" onClick=\"return mV('Neh',7,32);\">Neh 7:32</a>; <a href=\"#\" onClick=\"return mV('Neh',11,31);\">11:31</a>). It lay to the east of Bethel, \"beside Beth-aven.\" The spot which is most probably the site of this ancient city is Haiyan, 2 miles east from Bethel. It lay up the Wady Suweinit, a steep, rugged valley, extending from the Jordan valley to Bethel.<br><br>(2.) A city in the Ammonite territory (<a href=\"#\" onClick=\"return mV('Jer',49,3);\">Jer 49:3</a>). Some have thought that the proper reading of the word is Ar (<a href=\"#\" onClick=\"return mV('Isa',15,1);\">Isa 15:1</a>).";
eastonArray["$$T0000159"] = "<b>Aijeleth Shahar:</b> hind of the dawn, a name found in the title of <a href=\"#\" onClick=\"return mV('Psa',22,'1-');\">Psa 22</a>. It is probably the name of some song or tune to the measure of which the psalm was to be chanted. Some, however, understand by the name some instrument of music, or an allegorical allusion to the subject of the psalm.";
eastonArray["$$T0000160"] = "<b>Air:</b> the atmosphere, as opposed to the higher regions of the sky (<a href=\"#\" onClick=\"return mV('1Th',4,17);\">1Th 4:17</a>; <a href=\"#\" onClick=\"return mV('Rev',9,2);\">Rev 9:2</a>; <a href=\"#\" onClick=\"return mV('Rev',16,17);\">16:17</a>). This word occurs once as the rendering of the Hebrew <i>ruah</i> (<a href=\"#\" onClick=\"return mV('Job',41,16);\">Job 41:16</a>); elsewhere it is the rendering of <i>shamaiyim</i>, usually translated \"heavens.\"<br><br>The expression \"to speak into the air\" (<a href=\"#\" onClick=\"return mV('1Cr',14,9);\">1Cr 14:9</a>) is a proverb denoting to speak in vain, as to \"beat the air\" (<a href=\"#\" onClick=\"return mV('1Cr',9,26);\">1Cr 9:26</a>) denotes to labour in vain.";
eastonArray["$$T0000161"] = "<b>Ajalon:</b> and Aij'alon, place of deer.<br><br>(1.) A town and valley originally assigned to the tribe of Dan, from which, however, they could not drive the Amorites (<a href=\"#\" onClick=\"return mV('Jdg',1,35);\">Jdg 1:35</a>). It was one of the Levitical cities given to the Kohathites (<a href=\"#\" onClick=\"return mV('1Ch',6,69);\">1Ch 6:69</a>). It was not far from Beth-shemesh (<a href=\"#\" onClick=\"return mV('2Ch',28,18);\">2Ch 28:18</a>). It was the boundary between the kingdoms of Judah and Israel, and is frequently mentioned in Jewish history (<a href=\"#\" onClick=\"return mV('2Ch',11,10);\">2Ch 11:10</a>; <a href=\"#\" onClick=\"return mV('1Sa',14,31);\">1Sa 14:31</a>; <a href=\"#\" onClick=\"return mV('1Ch',8,13);\">1Ch 8:13</a>). With reference to the valley named after the town, Joshua uttered the celebrated command, \"Sun, stand thou still on Gibeon; and thou, Moon, in the valley of Ajalon\" (<a href=\"#\" onClick=\"return mV('Jos',10,12);\">Jos 10:12</a>). It has been identified as the modern Yalo, at the foot of the Beth-horon pass (q.v.). In the Tell Amarna letters Adoni-zedek (q.v.) speaks of the destruction of the \"city of Ajalon\" by the invaders, and describes himself as \"afflicted, greatly afflicted\" by the calamities that had come on the land, urging the king of Egypt to hasten to his help.<br><br>(2.) A city in the tribe of Zebulun (<a href=\"#\" onClick=\"return mV('Jdg',12,12);\">Jdg 12:12</a>), the modern Jalun, three miles north of Cabul.";
eastonArray["$$T0000162"] = "<b>Akkub:</b> (another form of Jacob).<br><br>(1.) The head of one of the families of Nethinim (<a href=\"#\" onClick=\"return mV('Ezr',2,45);\">Ezr 2:45</a>).<br><br>(2.) A Levite who kept the gate of the temple after the return from Babylon (<a href=\"#\" onClick=\"return mV('1Ch',9,17);\">1Ch 9:17</a>; <a href=\"#\" onClick=\"return mV('Ezr',2,42);\">Ezr 2:42</a>; <a href=\"#\" onClick=\"return mV('Neh',7,45);\">Neh 7:45</a>).<br><br>(3.) A descendant of David (<a href=\"#\" onClick=\"return mV('1Ch',3,24);\">1Ch 3:24</a>).";
eastonArray["$$T0000163"] = "<b>Akrabbim:</b> scorpions, probably the general name given to the ridge containing the pass between the south of the Dead Sea and Zin, es-Sufah, by which there is an ascent to the level of the land of Palestine. Scorpions are said to abound in this whole district, and hence the name (<a href=\"#\" onClick=\"return mV('Num',34,4);\">Num 34:4</a>). It is called \"Maaleh-acrabbim\" in <a href=\"#\" onClick=\"return mV('Jos',15,3);\">Jos 15:3</a>, and \"the ascent of Akrabbim\" in <a href=\"#\" onClick=\"return mV('Num',34,4);\">Num 34:4</a>.";
eastonArray["$$T0000164"] = "<b>Alabaster:</b> occurs only in the New Testament in connection with the box of \"ointment of spikenard very precious,\" with the contents of which a woman anointed the head of Jesus as he sat at supper in the house of Simon the leper (<a href=\"#\" onClick=\"return mV('Mat',26,7);\">Mat 26:7</a>; <a href=\"#\" onClick=\"return mV('Mar',14,3);\">Mar 14:3</a>; <a href=\"#\" onClick=\"return mV('Luk',7,37);\">Luk 7:37</a>). These boxes were made from a stone found near Alabastron in Egypt, and from this circumstance the Greeks gave them the name of the city where they were made. The name was then given to the stone of which they were made; and finally to all perfume vessels, of whatever material they were formed. The woman \"broke\" the vessel; i.e., she broke off, as was usually done, the long and narrow neck so as to reach the contents. This stone resembles marble, but is softer in its texture, and hence very easily wrought into boxes. Mark says (<a href=\"#\" onClick=\"return mV('Mar',14,5);\">Mar 14:5</a>) that this box of ointment was worth more than 300 pence, i.e., denarii, each of the value of sevenpence halfpenny of our money, and therefore worth about 10 pounds. But if we take the denarius as the day's wage of a labourer (<a href=\"#\" onClick=\"return mV('Mat',20,2);\">Mat 20:2</a>), say two shillings of our money, then the whole would be worth about 30 pounds, so costly was Mary's offering.";
eastonArray["$$T0000165"] = "<b>Alamoth:</b> virgins, a musical term (<a href=\"#\" onClick=\"return mV('1Ch',15,20);\">1Ch 15:20</a>), denoting that the psalm which bears this inscription (<a href=\"#\" onClick=\"return mV('Psa',46,'1-')\">Psa 46</a>) was to be sung by soprano or female voices.";
eastonArray["$$T0000166"] = "<b>Alarm:</b> a particular quivering sound of the silver trumpets to give warning to the Hebrews on their journey through the wilderness (<a href=\"#\" onClick=\"return mV('Num',10,5,6);\">Num 10:5-6</a>), a call to arms, or a war-note (<a href=\"#\" onClick=\"return mV('Jer',4,19);\">Jer 4:19</a>; <a href=\"#\" onClick=\"return mV('Jer',49,2);\">49:2</a>; <a href=\"#\" onClick=\"return mV('Zep',1,16);\">Zep 1:16</a>).";
eastonArray["$$T0000167"] = "<b>Alemeth:</b> covering.<br><br>(1.) One of the nine sons of Becher, the son of Benjamin (<a href=\"#\" onClick=\"return mV('1Ch',7,8);\">1Ch 7:8</a>).<br><br>(2.) One of the sons of Jehoadah, or Jarah, son of Ahaz (<a href=\"#\" onClick=\"return mV('1Ch',8,36);\">1Ch 8:36</a>).<br><br>(3.) A sacerdotal city of Benjamin (<a href=\"#\" onClick=\"return mV('1Ch',6,60);\">1Ch 6:60</a>), called also Almon (<a href=\"#\" onClick=\"return mV('Jos',21,18);\">Jos 21:18</a>), now Almit, a mile north-east of the ancient Anathoth.";
eastonArray["$$T0000168"] = "<b>Alexander:</b> man-defender.<br><br>(1.) A relative of Annas the high priest, present when Peter and John were examined before the Sanhedrim (<a href=\"#\" onClick=\"return mV('Act',4,6);\">Act 4:6</a>).<br><br>(2.) A man whose father, Simon the Cyrenian, bore the cross of Christ (<a href=\"#\" onClick=\"return mV('Mar',15,21);\">Mar 15:21</a>).<br><br>(3.) A Jew of Ephesus who took a prominent part in the uproar raised there by the preaching of Paul (<a href=\"#\" onClick=\"return mV('Act',19,33);\">Act 19:33</a>). The Jews put him forward to plead their cause before the mob. It was probably intended that he should show that he and the other Jews had no sympathy with Paul any more than the Ephesians had. It is possible that this man was the same as the following.<br><br>(4.) A coppersmith who, with Hymenaeus and others, promulgated certain heresies regarding the resurrection (<a href=\"#\" onClick=\"return mV('1Ti',1,19);\">1Ti 1:19</a>; <a href=\"#\" onClick=\"return mV('2Ti',4,14);\">2Ti 4:14</a>), and made shipwreck of faith and of a good conscience. Paul excommunicated him (<a href=\"#\" onClick=\"return mV('1Ti',1,20);\">1Ti 1:20</a>; <a href=\"#\" onClick=\"return mV('1Cr',5,5);\">1Cr 5:5</a>).";
eastonArray["$$T0000169"] = "<b>Alexander the Great:</b> the king of Macedonia, the great conqueror; probably represented in Daniel by the \"belly of brass\" (<a href=\"#\" onClick=\"return mV('Dan',2,32);\">Dan 2:32</a>), and the leopard and the he-goat (<a href=\"#\" onClick=\"return mV('Dan',7,6);\">Dan 7:6</a>; <a href=\"#\" onClick=\"return mV('Dan',11,3,4);\">11:3-4</a>). He succeeded his father Philip, and died at the age of thirty-two from the effects of intemperance, B.C. 323. His empire was divided among his four generals.";
eastonArray["$$T0000170"] = "<b>Alexandria:</b> the ancient metropolis of Lower Egypt, so called from its founder, Alexander the Great (about B.C. 333). It was for a long period the greatest of existing cities, for both Nineveh and Babylon had been destroyed, and Rome had not yet risen to greatness. It was the residence of the kings of Egypt for 200 years. It is not mentioned in the Old Testament, and only incidentally in the New. Apollos, eloquent and mighty in the Scriptures, was a native of this city (<a href=\"#\" onClick=\"return mV('Act',18,24);\">Act 18:24</a>). Many Jews from Alexandria were in Jerusalem, where they had a synagogue (<a href=\"#\" onClick=\"return mV('Act',6,9);\">Act 6:9</a>), at the time of Stephen's martyrdom. At one time it is said that as many as 10,000 Jews resided in this city. It possessed a famous library of 700,000 volumes, which was burned by the Saracens (A.D. 642). It was here that the Hebrew Bible was translated into Greek. This is called the Septuagint version, from the tradition that seventy learned men were engaged in executing it. It was, however, not all translated at one time. It was begun B.C. 280, and finished about B.C. 200 or 150. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003768');\">VERSION</a>.)";
eastonArray["$$T0000171"] = "<b>Algum:</b> (<a href=\"#\" onClick=\"return mV('2Ch',2,8);\">2Ch 2:8</a>; <a href=\"#\" onClick=\"return mV('2Ch',9,10,11);\">9:10-11</a>), the same as almug (<a href=\"#\" onClick=\"return mV('1Ki',10,11);\">1Ki 10:11</a>).";
eastonArray["$$T0000172"] = "<b>Alien:</b> a foreigner, or person born in another country, and therefore not entitled to the rights and privileges of the country where he resides. Among the Hebrews there were two classes of aliens.<br><br>(1.) Those who were strangers generally, and who owned no landed property.<br><br>(2.) Strangers dwelling in another country without being naturalized (<a href=\"#\" onClick=\"return mV('Lev',22,10);\">Lev 22:10</a>; <a href=\"#\" onClick=\"return mV('Psa',39,12);\">Psa 39:12</a>).<br><br>Both of these classes were to enjoy, under certain conditions, the same rights as other citizens (<a href=\"#\" onClick=\"return mV('Lev',19,33,34);\">Lev 19:33-34</a>; <a href=\"#\" onClick=\"return mV('Deu',10,19);\">Deu 10:19</a>). They might be naturalized and permitted to enter into the congregation of the Lord by submitting to circumcision and abandoning idolatry (<a href=\"#\" onClick=\"return mV('Deu',23,'3-8');\">Deu 23:3-8</a>).<br><br>This term is used (<a href=\"#\" onClick=\"return mV('Eph',2,12);\">Eph 2:12</a>) to denote persons who have no interest in Christ.";
eastonArray["$$T0000173"] = "<b>Allegory:</b> used only in <a href=\"#\" onClick=\"return mV('Gal',4,24);\">Gal 4:24</a>, where the apostle refers to the history of Isaac the free-born, and Ishmael the slave-born, and makes use of it allegorically.<br><br>Every parable is an allegory. Nathan (<a href=\"#\" onClick=\"return mV('2Sa',12,'1-4');\">2Sa 12:1-4</a>) addresses David in an allegorical narrative. In the eightieth Psalm there is a beautiful allegory: \"Thou broughtest a vine out of Egypt,\" etc. In <a href=\"#\" onClick=\"return mV('Ecc',12,'2-6');\">Ecc 12:2-6</a>, there is a striking allegorical description of old age.";
eastonArray["$$T0000174"] = "<b>Alleluia:</b> the Greek form (<a href=\"#\" onClick=\"return mV('Rev',19,1,3,4,6);\">Rev 19:1, 3-4, 6</a>) of the Hebrew Hallelujah = Praise ye Jehovah, which begins or ends several of the Psalms (<a href=\"#\" onClick=\"return mV('Psa',106,1,48);\">Psa 106:1, 48</a>; <a href=\"#\" onClick=\"return mV('Psa',111,1);\">Psa 111:1</a>; <a href=\"#\" onClick=\"return mV('Psa',112,1);\">Psa 112:1</a>; <a href=\"#\" onClick=\"return mV('Psa',13,1,9);\">Psa 113:1, 9</a> etc.).";
eastonArray["$$T0000175"] = "<b>Alliance:</b> a treaty between nations, or between individuals, for their mutual advantage.<br><br>Abraham formed an alliance with some of the Canaanitish princes (<a href=\"#\" onClick=\"return mV('Gen',14,13);\">Gen 14:13</a>), also with Abimelech (<a href=\"#\" onClick=\"return mV('Gen',21,'22-32');\">21:22-32</a>). Joshua and the elders of Israel entered into an alliance with the Gibeonites (<a href=\"#\" onClick=\"return mV('Jos',9,'3-27');\">Jos 9:3-27</a>). When the Israelites entered Palestine they were forbidden to enter into alliances with the inhabitants of the country (<a href=\"#\" onClick=\"return mV('Lev',18,3,4);\">Lev 18:3-4</a>; <a href=\"#\" onClick=\"return mV('Lev',20,'22-23');\">20:22-23</a>).<br><br>Solomon formed a league with Hiram (<a href=\"#\" onClick=\"return mV('1Ki',5,12);\">1Ki 5:12</a>). This \"brotherly covenant\" is referred to 250 years afterwards (<a href=\"#\" onClick=\"return mV('Amo',1,9);\">Amo 1:9</a>). He also appears to have entered into an alliance with Pharaoh (<a href=\"#\" onClick=\"return mV('1Ki',10,28,29);\">1Ki 10:28-29</a>).<br><br>In the subsequent history of the kingdoms of Judah and Israel various alliances were formed between them and also with neighbouring nations at different times.<br><br>From patriarchal times a covenant of alliance was sealed by the blood of some sacrificial victim. The animal sacrificed was cut in two (except birds), and between these two parts the persons contracting the alliance passed (<a href=\"#\" onClick=\"return mV('Gen',15,10);\">Gen 15:10</a>). There are frequent allusions to this practice (<a href=\"#\" onClick=\"return mV('Jer',34,18);\">Jer 34:18</a>). Such alliances were called \"covenants of salt\" (<a href=\"#\" onClick=\"return mV('Num',18,19);\">Num 18:19</a>; <a href=\"#\" onClick=\"return mV('2Ch',13,5);\">2Ch 13:5</a>), salt being the symbol of perpetuity. A pillar was set up as a memorial of the alliance between Laban and Jacob (<a href=\"#\" onClick=\"return mV('Gen',31,52);\">Gen 31:52</a>). The Jews throughout their whole history attached great importance to fidelity to their engagements. Divine wrath fell upon the violators of them (<a href=\"#\" onClick=\"return mV('Jos',9,18);\">Jos 9:18</a>; <a href=\"#\" onClick=\"return mV('2Sa',21,1,2);\">2Sa 21:1-2</a>; <a href=\"#\" onClick=\"return mV('Eze',17,16);\">Eze 17:16</a>).";
eastonArray["$$T0000176"] = "<b>Allon:</b> oak.<br><br>(1.) The expression in the Authorized Version of Josh. 19:33, \"from Allon to Zaanannim,\" is more correctly rendered in the Revised Version, \"from the oak in Zaanannim.\" The word denotes some remarkable tree which stood near Zaanannim, and which served as a landmark.<br><br>(2.) The son of Jedaiah, of the family of the Simeonites, who expelled the Hamites from the valley of Gedor (<a href=\"#\" onClick=\"return mV('1Ch',4,37);\">1Ch 4:37</a>).";
eastonArray["$$T0000177"] = "<b>Allon-bachuth:</b> oak of weeping, a tree near Bethel, at the spot where Deborah, Rebekah's nurse, was buried (<a href=\"#\" onClick=\"return mV('Gen',35,8);\">Gen 35:8</a>). Large trees, from their rarity in the plains of Palestine, were frequently designated as landmarks. This particular tree was probably the same as the \"palm tree of Deborah\" (<a href=\"#\" onClick=\"return mV('Jdg',4,5);\">Jdg 4:5</a>).";
eastonArray["$$T0000178"] = "<b>Almodad:</b> immeasurable, the first named of the sons of Joktan (<a href=\"#\" onClick=\"return mV('Gen',10,26);\">Gen 10:26</a>), the founder of an Arabian tribe.";
eastonArray["$$T0000179"] = "<b>Almon:</b> hidden, one of the sacerdotal cities of Benjamin (<a href=\"#\" onClick=\"return mV('Jos',21,18);\">Jos 21:18</a>), called also Alemeth (<a href=\"#\" onClick=\"return mV('1Ch',6,60);\">1Ch 6:60</a>).";
eastonArray["$$T0000180"] = "<b>Almond:</b> a native of Syria and Palestine. In form, blossoms, and fruit it resembles the peach tree. Its blossoms are of a very pale pink colour, and appear before its leaves. Its Hebrew name, <i>shaked</i>, signifying \"wakeful, hastening,\" is given to it on account of its putting forth its blossoms so early, generally in February, and sometimes even in January. In <a href=\"#\" onClick=\"return mV('Ecc',12,5);\">Ecc 12:5</a>, it is referred to as illustrative, probably, of the haste with which old age comes. There are others, however, who still contend for the old interpretation here. \"The almond tree bears its blossoms in the midst of winter, on a naked, leafless stem, and these blossoms (reddish or flesh-coloured in the beginning) seem at the time of their fall exactly like white snow-flakes. In this way the almond blossom is a very fitting symbol of old age, with its silvery hair and its wintry, dry, barren, unfruitful condition.\" In <a href=\"#\" onClick=\"return mV('Jer',1,11);\">Jer 1:11</a> \"I see a rod of an almond tree [shaked]...for I will hasten [shaked] my word to perform it\" the word is used as an emblem of promptitude. Jacob desired his sons (<a href=\"#\" onClick=\"return mV('Gen',43,11);\">Gen 43:11</a>) to take with them into Egypt of the best fruits of the land, almonds, etc., as a present to Joseph, probably because this tree was not a native of Egypt. Aaron's rod yielded almonds (<a href=\"#\" onClick=\"return mV('Num',17,8);\">Num 17:8</a>; <a href=\"#\" onClick=\"return mV('Hbr',9,4);\">Hbr 9:4</a>). Moses was directed to make certain parts of the candlestick for the ark of carved work \"like unto almonds\" (<a href=\"#\" onClick=\"return mV('Exd',25,33,34);\">Exd 25:33-34</a>). The Hebrew word <i>luz</i>, translated \"hazel\" in the Authorized Version (<a href=\"#\" onClick=\"return mV('Gen',30,37);\">Gen 30:37</a>), is rendered in the Revised Version \"almond.\" It is probable that <i>luz</i> denotes the wild almond, while <i>shaked</i> denotes the cultivated variety.";
eastonArray["$$T0000181"] = "<b>Alms:</b> Not found in the Old Testament, but repeatedly in the New. The Mosaic legislation (<a href=\"#\" onClick=\"return mV('Lev',25,35);\">Lev 25:35</a>; <a href=\"#\" onClick=\"return mV('Deu',15,7);\">Deu 15:7</a>) tended to promote a spirit of charity, and to prevent the occurrence of destitution among the people. Such passages as these, <a href=\"#\" onClick=\"return mV('Psa',41,1);\">Psa 41:1</a>; <a href=\"#\" onClick=\"return mV('Psa',112,9);\">Psa 112:9</a>; <a href=\"#\" onClick=\"return mV('Pro',41,31);\">Pro 14:31</a>; <a href=\"#\" onClick=\"return mV('Isa',10,2);\">Isa 10:2</a>; <a href=\"#\" onClick=\"return mV('Amo',2,7);\">Amo 2:7</a>; <a href=\"#\" onClick=\"return mV('Jer',5,28);\">Jer 5:28</a>; <a href=\"#\" onClick=\"return mV('Eze',22,29);\">Eze 22:29</a>, would also naturally foster the same benevolent spirit.<br><br>In the time of our Lord begging was common (<a href=\"#\" onClick=\"return mV('Mar',10,46);\">Mar 10:46</a>; <a href=\"#\" onClick=\"return mV('Act',3,2);\">Act 3:2</a>). The Pharisees were very ostentatious in their almsgivings (<a href=\"#\" onClick=\"return mV('Mat',6,2);\">Mat 6:2</a>). The spirit by which the Christian ought to be actuated in this duty is set forth in <a href=\"#\" onClick=\"return mV('1Jo',3,17);\">1Jo 3:17</a>. A regard to the state of the poor and needy is enjoined as a Christian duty (<a href=\"#\" onClick=\"return mV('Luk',3,11);\">Luk 3:11</a>; <a href=\"#\" onClick=\"return mV('Luk',6,30);\">6:30</a>; <a href=\"#\" onClick=\"return mV('Mat',6,1);\">Mat 6:1</a>; <a href=\"#\" onClick=\"return mV('Act',9,36);\">Act 9:36</a>; <a href=\"#\" onClick=\"return mV('Act',10,2,4);\">10:2, 4</a>), a duty which was not neglected by the early Christians (<a href=\"#\" onClick=\"return mV('Luk',14,13);\">Luk 14:13</a>; <a href=\"#\" onClick=\"return mV('Act',20,35);\">Act 20:35</a>; <a href=\"#\" onClick=\"return mV('Gal',2,10);\">Gal 2:10</a>; <a href=\"#\" onClick=\"return mV('Rom',15,'25-27');\">Rom 15:25-27</a>; <a href=\"#\" onClick=\"return mV('1Cr',16,'1-4');\">1Cr 16:1-4</a>). They cared not only for the poor among themselves, but contributed also to the necessities of those at a distance (<a href=\"#\" onClick=\"return mV('Act',11,29);\">Act 11:29</a>; <a href=\"#\" onClick=\"return mV('Act',24,17);\">24:17</a>; <a href=\"#\" onClick=\"return mV('2Cr',9,12);\">2Cr 9:12</a>). Our Lord and his attendants showed an example also in this (<a href=\"#\" onClick=\"return mV('Jhn',13,29);\">Jhn 13:29</a>).<br><br>In modern times the \"poor-laws\" have introduced an element which modifies considerably the form in which we may discharge this Christian duty.";
eastonArray["$$T0000182"] = "<b>Almug:</b> (<a href=\"#\" onClick=\"return mV('1Ki',10,11,12);\">1Ki 10:11-12</a>) = algum (<a href=\"#\" onClick=\"return mV('2Ch',2,8);\">2Ch 2:8</a>; <a href=\"#\" onClick=\"return mV('2Ch',9,10,11);\">9:10-11</a>), in the Hebrew occurring only in the plural <i>almuggim</i> (indicating that the wood was brought in planks), the name of a wood brought from Ophir to be used in the building of the temple, and for other purposes. Some suppose it to have been the white sandal-wood of India, the Santalum album of botanists, a native of the mountainous parts of the Malabar coasts. It is a fragrant wood, and is used in China for incense in idol-worship. Others, with some probability, think that it was the Indian red sandal-wood, the <i>pterocarpus santalinus</i>, a heavy, fine-grained wood, the Sanscrit name of which is valguka. It is found on the Coromandel coast and in Ceylon.";
eastonArray["$$T0000183"] = "<b>Aloes:</b> (Heb. 'ahalim), a fragrant wood (<a href=\"#\" onClick=\"return mV('Num',24,6);\">Num 24:6</a>; <a href=\"#\" onClick=\"return mV('Psa',45,8);\">Psa 45:8</a>; <a href=\"#\" onClick=\"return mV('Pro',7,17);\">Pro 7:17</a>; <a href=\"#\" onClick=\"return mV('Sgs',4,14);\">Sgs 4:14</a>), the <i>Aquilaria agallochum</i> of botanists, or, as some suppose, the costly gum or perfume extracted from the wood. It is found in China, Siam, and Northern India, and grows to the height sometimes of 120 feet. This species is of great rarity even in India. There is another and more common species, called by Indians aghil, whence Europeans have given it the name of Lignum aquile, or eagle-wood. Aloewood was used by the Egyptians for embalming dead bodies. Nicodemus brought it (pounded aloe-wood) to embalm the body of Christ (<a href=\"#\" onClick=\"return mV('Jhn',19,39);\">Jhn 19:39</a>); but whether this was the same as that mentioned elsewhere is uncertain.<br><br>The bitter aloes of the apothecary is the dried juice of the leaves Aloe vulgaris.";
eastonArray["$$T0000184"] = "<b>Alphaeus:</b><br><br>(1.) The father of James the Less, the apostle and writer of the epistle (<a href=\"#\" onClick=\"return mV('Mat',10,3);\">Mat 10:3</a>; <a href=\"#\" onClick=\"return mV('Mar',3,18);\">Mar 3:18</a>; <a href=\"#\" onClick=\"return mV('Luk',6,15);\">Luk 6:15</a>; <a href=\"#\" onClick=\"return mV('Act',1,13);\">Act 1:13</a>), and the husband of Mary (<a href=\"#\" onClick=\"return mV('Jhn',19,25);\">Jhn 19:25</a>). The Hebrew form of this name is Cleopas, or Clopas (q.v.).<br><br>(2.) The father of Levi, or Matthew (<a href=\"#\" onClick=\"return mV('Mar',2,14);\">Mar 2:14</a>).";
eastonArray["$$T0000185"] = "<b>Altar:</b> (Heb. mizbe'ah, from a word meaning \"to slay\"), any structure of earth (<a href=\"#\" onClick=\"return mV('Exd',20,24);\">Exd 20:24</a>) or unwrought stone (<a href=\"#\" onClick=\"return mV('Exd',20,25);\">20:25</a>) on which sacrifices were offered. Altars were generally erected in conspicuous places (<a href=\"#\" onClick=\"return mV('Gen',22,9);\">Gen 22:9</a>; <a href=\"#\" onClick=\"return mV('Eze',6,3);\">Eze 6:3</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,12);\">2Ki 23:12</a>; <a href=\"#\" onClick=\"return mV('2Ki',16,4);\">16:4</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,8);\">23:8</a>; <a href=\"#\" onClick=\"return mV('Act',14,13);\">Act 14:13</a>). The word is used in <a href=\"#\" onClick=\"return mV('Hbr',13,10);\">Hbr 13:10</a> for the sacrifice offered upon it--the sacrifice Christ offered.<br><br>Paul found among the many altars erected in Athens one bearing the inscription, \"To the unknown God\" (<a href=\"#\" onClick=\"return mV('Act',17,23);\">Act 17:23</a>), or rather \"to an [i.e., some] unknown God.\" The reason for this inscription cannot now be accurately determined. It afforded the apostle the occasion of proclaiming the gospel to the \"men of Athens.\"<br><br>The first altar we read of is that erected by Noah (<a href=\"#\" onClick=\"return mV('Gen',8,20);\">Gen 8:20</a>). Altars were erected by Abraham (<a href=\"#\" onClick=\"return mV('Gen',12,7);\">Gen 12:7</a>; <a href=\"#\" onClick=\"return mV('Gen',13,4);\">13:4</a>; <a href=\"#\" onClick=\"return mV('Gen',22,9);\">22:9</a>), by Isaac (<a href=\"#\" onClick=\"return mV('Gen',26,25);\">Gen 26:25</a>), by Jacob (<a href=\"#\" onClick=\"return mV('Gen',33,20);\">33:20</a>; <a href=\"#\" onClick=\"return mV('Gen',35,1,3);\">35:1, 3</a>), and by Moses (<a href=\"#\" onClick=\"return mV('Exd',17,15);\">Exd 17:15</a>, \"Jehovah-nissi\").<br><br>In the tabernacle, and afterwards in the temple, two altars were erected.<br><br>(1.) The altar of burnt offering (<a href=\"#\" onClick=\"return mV('Exd',30,28);\">Exd 30:28</a>), called also the \"brasen altar\" (<a href=\"#\" onClick=\"return mV('Exd',39,39);\">Exd 39:39</a>) and \"the table of the Lord\" (<a href=\"#\" onClick=\"return mV('Mal',1,7);\">Mal 1:7</a>).<br><br>This altar, as erected in the tabernacle, is described in <a href=\"#\" onClick=\"return mV('Exd',27,'1-8');\">Exd 27:1-8</a>. It was a hollow square, 5 cubits in length and in breadth, and 3 cubits in height. It was made of shittim wood, and was overlaid with plates of brass. Its corners were ornamented with \"horns\" (<a href=\"#\" onClick=\"return mV('Exd',29,12);\">Exd 29:12</a>; <a href=\"#\" onClick=\"return mV('Lev',4,18);\">Lev 4:18</a>).<br><br>In <a href=\"#\" onClick=\"return mV('Exd',27,3);\">Exd 27:3</a> the various utensils appertaining to the altar are enumerated. They were made of brass. (<a href=\"#\" onClick=\"return mV('1Sa',2,13,14);\">1Sa 2:13-14</a>; <a href=\"#\" onClick=\"return mV('Lev',16,12);\">Lev 16:12</a>; <a href=\"#\" onClick=\"return mV('Num',16,6);\">Num 16:6-7</a>)<br><br>In Solomon's temple the altar was of larger dimensions (<a href=\"#\" onClick=\"return mV('2Ch',4,1);\">2Ch 4:1</a>. Comp. <a href=\"#\" onClick=\"return mV('1Ki',8,22,64);\">1Ki 8:22, 64</a>; <a href=\"#\" onClick=\"return mV('1Ki',9,25);\">9:25</a>), and was made wholly of brass, covering a structure of stone or earth. This altar was renewed by Asa (<a href=\"#\" onClick=\"return mV('2Ch',15,8);\">2Ch 15:8</a>). It was removed by Ahaz (<a href=\"#\" onClick=\"return mV('2Ki',16,14);\">2Ki 16:14</a>), and \"cleansed\" by Hezekiah, in the latter part of whose reign it was rebuilt. It was finally broken up and carried away by the Babylonians (<a href=\"#\" onClick=\"return mV('Jer',52,17);\">Jer 52:17</a>).<br><br>After the return from captivity it was re-erected (<a href=\"#\" onClick=\"return mV('Ezr',3,3,6);\">Ezr 3:3, 6</a>) on the same place where it had formerly stood. (1 Macc. 4:47.) When Antiochus Epiphanes pillaged Jerusalem the altar of burnt offering was taken away.<br><br>Again the altar was erected by Herod, and remained in its place till the destruction of Jerusalem by the Romans (70 A.D.).<br><br>The fire on the altar was not permitted to go out (<a href=\"#\" onClick=\"return mV('Lev',6,9);\">Lev 6:9</a>).<br><br>In the Mosque of Omar, immediately underneath the great dome, which occupies the site of the old temple, there is a rough projection of the natural rock, of about 60 feet in its extreme length, and 50 in its greatest breadth, and in its highest part about 4 feet above the general pavement. This rock seems to have been left intact when Solomon's temple was built. It was in all probability the site of the altar of burnt offering. Underneath this rock is a cave, which may probably have been the granary of Araunah's threshing-floor (<a href=\"#\" onClick=\"return mV('1Ch',21,22);\">1Ch 21:22</a>).<br><br>(2.) The altar of incense (<a href=\"#\" onClick=\"return mV('Exd',30,'1-10');\">Exd 30:1-10</a>), called also \"the golden altar\" (<a href=\"#\" onClick=\"return mV('Exd',39,38);\">39:38</a>; <a href=\"#\" onClick=\"return mV('Num',4,11);\">Num 4:11</a>), stood in the holy place \"before the vail that is by the ark of the testimony.\" On this altar sweet spices were continually burned with fire taken from the brazen altar. The morning and the evening services were commenced by the high priest offering incense on this altar. The burning of the incense was a type of prayer (<a href=\"#\" onClick=\"return mV('Psa',141,2);\">Psa 141:2</a>; <a href=\"#\" onClick=\"return mV('Rev',5,8);\">Rev 5:8</a>; <a href=\"#\" onClick=\"return mV('Rev',8,3,4);\">8:3-4</a>).<br><br>This altar was a small movable table, made of acacia wood overlaid with gold (<a href=\"#\" onClick=\"return mV('Exd',37,25,26);\">Exd 37:25-26</a>). It was 1 cubit in length and breadth, and 2 cubits in height.<br><br>In Solomon's temple the altar was similar in size, but was made of cedar-wood (<a href=\"#\" onClick=\"return mV('1Ki',6,20);\">1Ki 6:20</a>; <a href=\"#\" onClick=\"return mV('1Ki',7,48);\">7:48</a>) overlaid with gold. In <a href=\"#\" onClick=\"return mV('Eze',41,22);\">Eze 41:22</a> it is called \"the altar of wood.\" (<a href=\"#\" onClick=\"return mV('Exd',30,'1-6');\">Exd 30:1-6</a>.)<br><br>In the temple built after the Exile the altar was restored. Antiochus Epiphanes took it away, but it was afterwards restored by Judas Maccabaeus (1 Macc. 1:23; 4:49). Among the trophies carried away by Titus on the destruction of Jerusalem the altar of incense is not found, nor is any mention made of it in <a href=\"#\" onClick=\"return mV('Heb',9,'1-');\">Heb 9</a>. It was at this altar Zacharias ministered when an angel appeared to him (<a href=\"#\" onClick=\"return mV('Luk',1,11);\">Luk 1:11</a>). It is the only altar which appears in the heavenly temple (<a href=\"#\" onClick=\"return mV('Isa',6,6);\">Isa 6:6</a>; <a href=\"#\" onClick=\"return mV('Rev',8,3,4);\">Rev 8:3-4</a>).";
eastonArray["$$T0000186"] = "<b>Altaschith:</b> destroy not, the title of <a href=\"#\" onClick=\"return mV('Psa',57,'1-');\">Psa 57</a>; <a href=\"#\" onClick=\"return mV('Psa',58,'1-');\">58</a>; <a href=\"#\" onClick=\"return mV('Psa',59,'1-');\">59</a>, and <a href=\"#\" onClick=\"return mV('Psa',75,'1-');\">75</a>. It was probably the name of some song to the melody of which these psalms were to be chanted.";
eastonArray["$$T0000187"] = "<b>Alush:</b> one of the places, the last before Rephidim, at which the Hebrews rested on their way to Sinai (<a href=\"#\" onClick=\"return mV('Num',33,13,14);\">Num 33:13-14</a>). It was probably situated on the shore of the Red Sea.";
eastonArray["$$T0000188"] = "<b>Amalek:</b> dweller in a valley, the son of Eliphaz and grandson of Esau (<a href=\"#\" onClick=\"return mV('Gen',36,12);\">Gen 36:12</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,36);\">1Ch 1:36</a>); the chief of an Idumean tribe (<a href=\"#\" onClick=\"return mV('Gen',36,16);\">Gen 36:16</a>). His mother was a Horite, a tribe whose territory the descendants of Esau had seized.";
eastonArray["$$T0000189"] = "<b>Amalekite:</b> a tribe that dwelt in Arabia Petraea, between the Dead Sea and the Red Sea. They were not the descendants of Amalek, the son of Eliphaz, for they existed in the days of Abraham (<a href=\"#\" onClick=\"return mV('Gen',14,7);\">Gen 14:7</a>). They were probably a tribe that migrated from the shores of the Persian Gulf and settled in Arabia. \"They dwelt in the land of the south...from Havilah until thou comest to Shur\" (<a href=\"#\" onClick=\"return mV('Num',13,29);\">Num 13:29</a>; <a href=\"#\" onClick=\"return mV('1Sa',15,7);\">1Sa 15:7</a>). They were a pastoral, and hence a nomadic race. Their kings bore the hereditary name of Agag (<a href=\"#\" onClick=\"return mV('Num',24,7);\">Num 24:7</a>; <a href=\"#\" onClick=\"return mV('1Sa',15,8);\">1Sa 15:8</a>). They attempted to stop the Israelites when they marched through their territory (<a href=\"#\" onClick=\"return mV('Deu',25,18);\">Deu 25:18</a>), attacking them at Rephidim (<a href=\"#\" onClick=\"return mV('Exd',17,'8-13');\">Exd 17:8-13</a>; <a href=\"#\" onClick=\"return mV('Deu',25,17);\">Deu 25:17</a>; <a href=\"#\" onClick=\"return mV('1Sa',15,2);\">1Sa 15:2</a>). They afterwards attacked the Israelites at Hormah (<a href=\"#\" onClick=\"return mV('Num',14,45);\">Num 14:45</a>). We read of them subsequently as in league with the Moabites (<a href=\"#\" onClick=\"return mV('Jdg',3,13);\">Jdg 3:13</a>) and the Midianites (<a href=\"#\" onClick=\"return mV('Jdg',6,3);\">Jdg 6:3</a>). Saul finally desolated their territory and destroyed their power (<a href=\"#\" onClick=\"return mV('1Sa',14,48);\">1Sa 14:48</a>; <a href=\"#\" onClick=\"return mV('1Sa',15,3);\">15:3</a>), and David recovered booty from them (<a href=\"#\" onClick=\"return mV('1Sa',30,'18-20');\">1Sa 30:18-20</a>). In the Babylonian inscriptions they are called Sute, in those of Egypt Sittiu, and the Amarna tablets include them under the general name of Khabbati, or \"plunderers.\"";
eastonArray["$$T0000190"] = "<b>Amana:</b> perennial.<br><br>(1.) The Hebrew margin of <a href=\"#\" onClick=\"return mV('2Ki',5,12);\">2Ki 5:12</a> gives this as another reading of Abana (q.v.), a stream near Damascus.<br><br>(2.) A mountain (<a href=\"#\" onClick=\"return mV('Sgs',4,8);\">Sgs 4:8</a>), probably the southern summit of Anti-Libanus, at the base of which are the sources of the Abana.";
eastonArray["$$T0000191"] = "<b>Amariah:</b> said by Jehovah.<br><br>(1.) One of the descendants of Aaron by Eleazar (<a href=\"#\" onClick=\"return mV('1Ch',6,7,52);\">1Ch 6:7, 52</a>). He was probably the last of the high priests of Eleazar's line prior to the transfer of that office to Eli, of the line of Ithamar.<br><br>(2.) A Levite, son of Hebron, of the lineage of Moses (<a href=\"#\" onClick=\"return mV('1Ch',23,19);\">1Ch 23:19</a>; <a href=\"#\" onClick=\"return mV('1Ch',24,23);\">24:23</a>).<br><br>(3.) A \"chief priest\" who took an active part in the reformation under Jehoshaphat (<a href=\"#\" onClick=\"return mV('2Ch',19,11);\">2Ch 19:11</a>); probably the same as mentioned in <a href=\"#\" onClick=\"return mV('1Ch',6,9);\">1Ch 6:9</a>.<br><br>(4.) <a href=\"#\" onClick=\"return mV('1Ch',6,11);\">1Ch 6:11</a>; <a href=\"#\" onClick=\"return mV('Ezr',7,3);\">Ezr 7:3</a>.<br><br>(5.) One of the high priests in the time of Hezekiah (<a href=\"#\" onClick=\"return mV('2Ch',31,15);\">2Ch 31:15</a>).<br><br>(6.) <a href=\"#\" onClick=\"return mV('Zep',1,1);\">Zep 1:1</a>.<br><br>(7.) <a href=\"#\" onClick=\"return mV('Neh',11,4);\">Neh 11:4</a>.<br><br>(8.) <a href=\"#\" onClick=\"return mV('Neh',10,3);\">Neh 10:3</a>.<br><br>(9.) <a href=\"#\" onClick=\"return mV('Ezr',10,42);\">Ezr 10:42</a>.";
eastonArray["$$T0000192"] = "<b>Amasa:</b> burden.<br><br>(1.) The son of Abigail, a sister of king David (<a href=\"#\" onClick=\"return mV('1Ch',2,17);\">1Ch 2:17</a>; <a href=\"#\" onClick=\"return mV('2Sa',17,25);\">2Sa 17:25</a>). He was appointed by David to command the army in room of his cousin Joab (<a href=\"#\" onClick=\"return mV('2Sa',19,13);\">2Sa 19:13</a>), who afterwards treacherously put him to death as a dangerous rival (<a href=\"#\" onClick=\"return mV('2Sa',20,'4-12');\">2Sa 20:4-12</a>).<br><br>(2.) A son of Hadlai, and chief of Ephraim (<a href=\"#\" onClick=\"return mV('2Ch',28,12);\">2Ch 28:12</a>) in the reign of Ahaz.";
eastonArray["$$T0000193"] = "<b>Amasai:</b> burdensome.<br><br>(1.) A Levite, son of Elkanah, of the ancestry of Samuel (<a href=\"#\" onClick=\"return mV('1Ch',6,25,35);\">1Ch 6:25, 35</a>).<br><br>(2.) The leader of a body of men who joined David in the \"stronghold,\" probably of Adullam (<a href=\"#\" onClick=\"return mV('1Ch',12,18);\">1Ch 12:18</a>).<br><br>(3.) One of the priests appointed to precede the ark with blowing of trumpets on its removal from the house of Obed-edom (<a href=\"#\" onClick=\"return mV('1Ch',15,24);\">1Ch 15:24</a>).<br><br>(4.) The father of a Levite, one of the two Kohathites who took a prominent part at the instance of Hezekiah in the cleansing of the temple (<a href=\"#\" onClick=\"return mV('2Ch',29,12);\">2Ch 29:12</a>).";
eastonArray["$$T0000194"] = "<b>Amashai:</b> the son of Azareel, appointed by Nehemiah to reside at Jerusalem and do the work of the temple (<a href=\"#\" onClick=\"return mV('Neh',11,13);\">Neh 11:13</a>).";
eastonArray["$$T0000195"] = "<b>Amasiah:</b> burden of (i.e., \"sustained by\") Jehovah, the \"son of Zichri, who willingly offered himself unto the Lord,\" a captain over thousands under Jehoshaphat (<a href=\"#\" onClick=\"return mV('2Ch',17,16);\">2Ch 17:16</a>; <a href=\"#\" onClick=\"return mV('Jdg',5,9);\">Jdg 5:9</a>).";
eastonArray["$$T0000196"] = "<b>Amaziah:</b> strengthened by Jehovah.<br><br>(1.) A Levite, son of Hilkiah, of the descendants of Ethan the Merarite (<a href=\"#\" onClick=\"return mV('1Ch',6,45);\">1Ch 6:45</a>).<br><br>(2.) The son and successor of Joash, and eighth king of the separate kingdom of Judah (<a href=\"#\" onClick=\"return mV('2Ki',14,'1-4');\">2Ki 14:1-4</a>). He began his reign by punishing the murderers of his father (<a href=\"#\" onClick=\"return mV('2Ki',14,'5-7');\">2Ki 14:5-7</a>; <a href=\"#\" onClick=\"return mV('2Ch',25,'3-5');\">2Ch 25:3-5</a>). He was the first to employ a mercenary army of 100,000 Israelite soldiers, which he did in his attempt to bring the Edomites again under the yoke of Judah (<a href=\"#\" onClick=\"return mV('2Ch',25,5,6);\">2Ch 25:5-6</a>). He was commanded by a prophet of the Lord to send back the mercenaries, which he did (<a href=\"#\" onClick=\"return mV('2Ch',25,'7-10',13);\">2Ch 25:7-10, 13</a>), much to their annoyance. His obedience to this command was followed by a decisive victory over the Edomites (<a href=\"#\" onClick=\"return mV('2Ch',25,'14-16');\">2Ch 25:14-16</a>). Amaziah began to worship some of the idols he took from the Edomites, and this was his ruin, for he was vanquished by Joash, king of Israel, whom he challenged to battle. The disaster he thus brought upon Judah by his infatuation in proclaiming war against Israel probably occasioned the conspiracy by which he lost his life (<a href=\"#\" onClick=\"return mV('2Ki',14,'8-14',19);\">2Ki 14:8-14, 19</a>). He was slain at Lachish, whither he had fled, and his body was brought upon horses to Jerusalem, where it was buried in the royal sepulchre (<a href=\"#\" onClick=\"return mV('2Ki',14,19,20);\">2Ki 14:19-20</a>; <a href=\"#\" onClick=\"return mV('2Ch',25,27,28);\">2Ch 25:27-28</a>).<br><br>(3.) A priest of the golden calves at Bethel (<a href=\"#\" onClick=\"return mV('Amo',7,'10-17');\">Amo 7:10-17</a>).<br><br>(4.) The father of Joshah, one of the Simeonite chiefs in the time of Hezekiah (<a href=\"#\" onClick=\"return mV('1Ch',4,34);\">1Ch 4:34</a>).";
eastonArray["$$T0000197"] = "<b>Ambassador:</b> In the Old Testament the Hebrew word <i>tsir</i>, meaning \"one who goes on an errand,\" is rendered thus (<a href=\"#\" onClick=\"return mV('Jos',9,4);\">Jos 9:4</a>; <a href=\"#\" onClick=\"return mV('Pro',13,17);\">Pro 13:17</a>; <a href=\"#\" onClick=\"return mV('Isa',18,2);\">Isa 18:2</a>; <a href=\"#\" onClick=\"return mV('Jer',49,14);\">Jer 49:14</a>; <a href=\"#\" onClick=\"return mV('Oba',1,1);\">Oba 1:1</a>). This is also the rendering of <i>melits</i>, meaning \"an interpreter,\" in <a href=\"#\" onClick=\"return mV('2Ch',32,31);\">2Ch 32:31</a>; and of <i>malak</i>, a \"messenger,\" in <a href=\"#\" onClick=\"return mV('2Ch',35,21);\">2Ch 35:21</a>; <a href=\"#\" onClick=\"return mV('Isa',30,4);\">Isa 30:4</a>; <a href=\"#\" onClick=\"return mV('Isa',33,7);\">33:7</a>; <a href=\"#\" onClick=\"return mV('Eze',17,15);\">Eze 17:15</a>. This is the name used by the apostle as designating those who are appointed by God to declare his will (<a href=\"#\" onClick=\"return mV('2Cr',5,20);\">2Cr 5:20</a>; <a href=\"#\" onClick=\"return mV('Eph',6,20);\">Eph 6:20</a>).<br><br>The Hebrews on various occasions and for various purposes had recourse to the services of ambassadors, e.g., to contract alliances (<a href=\"#\" onClick=\"return mV('Jos',9,4);\">Jos 9:4</a>), to solicit favours (<a href=\"#\" onClick=\"return mV('Num',20,14);\">Num 20:14</a>), to remonstrate when wrong was done (<a href=\"#\" onClick=\"return mV('Jdg',11,12);\">Jdg 11:12</a>), to condole with a young king on the death of his father (<a href=\"#\" onClick=\"return mV('2Sa',10,2);\">2Sa 10:2</a>), and to congratulate a king on his accession to the throne (<a href=\"#\" onClick=\"return mV('1Ki',5,1);\">1Ki 5:1</a>).<br><br>To do injury to an ambassador was to insult the king who sent him (<a href=\"#\" onClick=\"return mV('2Sa',10,5);\">2Sa 10:5</a>).";
eastonArray["$$T0000198"] = "<b>Amber:</b> (<a href=\"#\" onClick=\"return mV('Eze',1,4,27);\">Eze 1:4, 27</a>; <a href=\"#\" onClick=\"return mV('Eze',8,2);\">8:2</a>. Heb., hashmal, rendered by the LXX. elektron, and by the Vulgate electrum), a metal compounded of silver and gold. Some translate the word by \"polished brass,\" others \"fine brass,\" as in <a href=\"#\" onClick=\"return mV('Rev',1,15);\">Rev 1:15</a>; <a href=\"#\" onClick=\"return mV('Rev',1218);\">2:18</a>. It was probably the mixture now called electrum. The word has no connection, however, with what is now called amber, which is a gummy substance, reckoned as belonging to the mineral kingdom though of vegetable origin, a fossil resin.";
eastonArray["$$T0000199"] = "<b>Ambush:</b> Joshua at the capture of Ai lay in ambush, and so deceived the inhabitants that he gained an easy victory (<a href=\"#\" onClick=\"return mV('Jos',8,'4-26');\">Jos 8:4-26</a>). Shechem was taken in this manner (<a href=\"#\" onClick=\"return mV('Jdg',9,'30-45');\">Jdg 9:30-45</a>. Comp. <a href=\"#\" onClick=\"return mV('Jer',51,12);\">Jer 51:12</a>).";
