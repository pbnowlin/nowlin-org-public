<script>
var eastonArray = new Array ();
eastonArray["$$T0001100"] = "<strong>Dye:</strong> The art of dyeing is one of great antiquity, although no special mention is made of it in the Old Testament. The Hebrews probably learned it from the Egyptians (see <a href=\"#\" onClick=\"return mV('Exd',26,1);\">Exd 26:1</a>; <a href=\"#\" onClick=\"return mV('Exd',28,'5-8');\">28:5-8</a>), who brought it to great perfection. In New Testament times Thyatira was famed for its dyers (<a href=\"#\" onClick=\"return mV('Act',16,14);\">Act 16:14</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000868');\">COLOUR</a>.)";
eastonArray["$$T0001101"] = "<strong>Eagle:</strong> (Herb. nesher; properly the griffon vulture or great vulture, so called from its tearing its prey with its beak), referred to for its swiftness of flight (<a href=\"#\" onClick=\"return mV('Deu',28,49);\">Deu 28:49</a>; <a href=\"#\" onClick=\"return mV('2Sa',1,23);\">2Sa 1:23</a>), its mounting high in the air (<a href=\"#\" onClick=\"return mV('Job',39,27);\">Job 39:27</a>), its strength (<a href=\"#\" onClick=\"return mV('Psa',103,5);\">Psa 103:5</a>), its setting its nest in high places (<a href=\"#\" onClick=\"return mV('Jer',49,16);\">Jer 49:16</a>), and its power of vision (<a href=\"#\" onClick=\"return mV('Job',39,'27-30');\">Job 39:27-30</a>).<br><br>This \"ravenous bird\" is a symbol of those nations whom God employs and sends forth to do a work of destruction, sweeping away whatever is decaying and putrescent (<a href=\"#\" onClick=\"return mV('Mat',24,28);\">Mat 24:28</a>; <a href=\"#\" onClick=\"return mV('Isa',46,11);\">Isa 46:11</a>; <a href=\"#\" onClick=\"return mV('Eze',39,4);\">Eze 39:4</a>; <a href=\"#\" onClick=\"return mV('Deu',28,49);\">Deu 28:49</a>; <a href=\"#\" onClick=\"return mV('Jer',4,13);\">Jer 4:13</a>; <a href=\"#\" onClick=\"return mV('Jer',48,40);\">48:40</a>). It is said that the eagle sheds his feathers in the beginning of spring, and with fresh plumage assumes the appearance of youth. To this, allusion is made in <a href=\"#\" onClick=\"return mV('Psa',103,5);\">Psa 103:5</a> and <a href=\"#\" onClick=\"return mV('Isa',40,31);\">Isa 40:31</a>. God's care over his people is likened to that of the eagle in training its young to fly (<a href=\"#\" onClick=\"return mV('Exd',19,4);\">Exd 19:4</a>; <a href=\"#\" onClick=\"return mV('Deu',32,11,12);\">Deu 32:11-12</a>). An interesting illustration is thus recorded by Sir Humphry Davy:, \"I once saw a very interesting sight above the crags of Ben Nevis. Two parent eagles were teaching their offspring, two young birds, the maneuvers of flight. They began by rising from the top of the mountain in the eye of the sun. It was about mid-day, and bright for the climate. They at first made small circles, and the young birds imitated them. They paused on their wings, waiting till they had made their flight, and then took a second and larger gyration, always rising toward the sun, and enlarging their circle of flight so as to make a gradually ascending spiral. The young ones still and slowly followed, apparently flying better as they mounted; and they continued this sublime exercise, always rising till they became mere points in the air, and the young ones were lost, and afterwards their parents, to our aching sight.\" (See <a href=\"#\" onClick=\"return mV('Isa',40,31);\">Isa 40:31</a>.)<br><br>There have been observed in Palestine four distinct species of eagles, (1) the golden eagle (<i>Aquila chrysaetos</i>); (2) the spotted eagle (<i>Aquila naevia</i>); (3) the common species, the imperial eagle (<i>Aquila heliaca</i>); and (4) the <i>Circaetos gallicus</i>, which preys on reptiles. The eagle was unclean by the Levitical law (<a href=\"#\" onClick=\"return mV('Lev',11,13);\">Lev 11:13</a>; <a href=\"#\" onClick=\"return mV('Deu',14,12);\">Deu 14:12</a>).";
eastonArray["$$T0001102"] = "<strong>Ear:</strong> used frequently in a figurative sense (<a href=\"#\" onClick=\"return mV('Psa',34,15);\">Psa 34:15</a>). To \"uncover the ear\" is to show respect to a person (<a href=\"#\" onClick=\"return mV('1Sa',20,2);\">1Sa 20:2</a> marg.). To have the \"ear heavy\", or to have \"uncircumcised ears\" (<a href=\"#\" onClick=\"return mV('Isa',6,10);\">Isa 6:10</a>), is to be inattentive and disobedient. To have the ear \"bored\" through with an awl was a sign of perpetual servitude (<a href=\"#\" onClick=\"return mV('Exd',21,6);\">Exd 21:6</a>).";
eastonArray["$$T0001103"] = "<strong>Earing:</strong> an Old English word (from the Latin aro, I plough), meaning \"ploughing.\" It is used in the Authorized Version in <a href=\"#\" onClick=\"return mV('Gen',45,6);\">Gen 45:6</a>; <a href=\"#\" onClick=\"return mV('Exd',34,21);\">Exd 34:21</a>; <a href=\"#\" onClick=\"return mV('1Sa',8,12);\">1Sa 8:12</a>; <a href=\"#\" onClick=\"return mV('Deu',21,4);\">Deu 21:4</a>; <a href=\"#\" onClick=\"return mV('Isa',30,24);\">Isa 30:24</a>; but the Revised Version has rendered the original in these places by the ordinary word to plough or till.";
eastonArray["$$T0001104"] = "<strong>Earnest:</strong> The Spirit is the earnest of the believer's destined inheritance (<a href=\"#\" onClick=\"return mV('2Cr',1,22);\">2Cr 1:22</a>; <a href=\"#\" onClick=\"return mV('2Cr',5,5);\">5:5</a>; <a href=\"#\" onClick=\"return mV('Eph',1,14);\">Eph 1:14</a>). The word thus rendered is the same as that rendered \"pledge\" in <a href=\"#\" onClick=\"return mV('Gen',38,'17-20');\">Gen 38:17-20</a>; \"indeed, the Hebrew word has simply passed into the Greek and Latin languages, probably through commercial dealings with the Phoenicians, the great trading people of ancient days. Originally it meant no more than a pledge; but in common usage it came to denote that particular kind of pledge which is a part of the full price of an article paid in advance; and as it is joined with the figure of a seal when applied to the Spirit, it seems to be used by Paul in this specific sense.\" The Spirit's gracious presence and working in believers is a foretaste to them of the blessedness of heaven. God is graciously pleased to give not only pledges but foretastes of future blessedness.";
eastonArray["$$T0001105"] = "<strong>Earrings:</strong> rings properly for the ear (<a href=\"#\" onClick=\"return mV('Gen',35,4);\">Gen 35:4</a>; <a href=\"#\" onClick=\"return mV('Num',31,50);\">Num 31:50</a>; <a href=\"#\" onClick=\"return mV('Eze',16,12);\">Eze 16:12</a>). In <a href=\"#\" onClick=\"return mV('Gen',24,47);\">Gen 24:47</a> the word means a nose-jewel, and is so rendered in the Revised Version. In <a href=\"#\" onClick=\"return mV('Isa',3,20);\">Isa 3:20</a> the Authorized Version has \"ear-rings,\" and the Revised Version \"amulets,\" which more correctly represents the original word (lehashim), which means incantations; charms, thus remedies against enchantment, worn either suspended from the neck or in the ears of females. Ear-rings were ornaments used by both sexes (<a href=\"#\" onClick=\"return mV('Exd',32,2);\">Exd 32:2</a>).";
eastonArray["$$T0001106"] = "<strong>Earth:</strong><br><br>(1.) In the sense of soil or ground, the translation of the word <i>adamah'</i>. In <a href=\"#\" onClick=\"return mV('Gen',9,20);\">Gen 9:20</a> \"husbandman\" is literally \"man of the ground or earth.\" Altars were to be built of earth (<a href=\"#\" onClick=\"return mV('Exd',20,24);\">Exd 20:24</a>). Naaman asked for two mules' burden of earth (<a href=\"#\" onClick=\"return mV('2Ki',5,17);\">2Ki 5:17</a>), under the superstitious notion that Jehovah, like the gods of the heathen, could be acceptably worshipped only on his own soil.<br><br>(2). As the rendering of <i>'erets</i>, it means the whole world (<a href=\"#\" onClick=\"return mV('Gen',1,2);\">Gen 1:2</a>); the land as opposed to the sea (<a href=\"#\" onClick=\"return mV('Gen',1,10);\">1:10</a>). <i>Erets</i> also denotes a country (<a href=\"#\" onClick=\"return mV('Gen',21,32);\">21:32</a>); a plot of ground (<a href=\"#\" onClick=\"return mV('Gen',23,15);\">23:15</a>); the ground on which a man stands (<a href=\"#\" onClick=\"return mV('Gen',33,3);\">33:3</a>); the inhabitants of the earth (<a href=\"#\" onClick=\"return mV('Gen',6,1);\">6:1</a>; <a href=\"#\" onClick=\"return mV('Gen',11,1);\">11:1</a>); all the world except Israel (<a href=\"#\" onClick=\"return mV('2Ch',13,9);\">2Ch 13:9</a>). In the New Testament \"the earth\" denotes the land of Judea (<a href=\"#\" onClick=\"return mV('Mat',23,35);\">Mat 23:35</a>); also things carnal in contrast with things heavenly (<a href=\"#\" onClick=\"return mV('Jhn',3,31);\">Jhn 3:31</a>; <a href=\"#\" onClick=\"return mV('Col',3,1,2);\">Col 3:1-2</a>).";
eastonArray["$$T0001107"] = "<strong>Earthquake:</strong> mentioned among the extraordinary phenomena of Palestine (<a href=\"#\" onClick=\"return mV('Psa',18,7);\">Psa 18:7</a>; <a href=\"#\" onClick=\"return mV('Hab',3,6);\">Hab 3:6</a>; <a href=\"#\" onClick=\"return mV('Nah',1,5);\">Nah 1:5</a>; <a href=\"#\" onClick=\"return mV('Isa',5,25);\">Isa 5:25</a>).<br><br>The first earthquake in Palestine of which we have any record happened in the reign of Ahab (<a href=\"#\" onClick=\"return mV('1Ki',19,11,12);\">1Ki 19:11-12</a>). Another took place in the days of Uzziah, King of Judah (<a href=\"#\" onClick=\"return mV('Zec',14,5);\">Zec 14:5</a>). The most memorable earthquake taking place in New Testament times happened at the crucifixion of our Lord (<a href=\"#\" onClick=\"return mV('Mat',27,54);\">Mat 27:54</a>). An earthquake at Philippi shook the prison in which Paul and Silas were imprisoned (<a href=\"#\" onClick=\"return mV('Act',16,26);\">Act 16:26</a>).<br><br>It is used figuratively as a token of the presence of the Lord (<a href=\"#\" onClick=\"return mV('Jdg',5,4);\">Jdg 5:4</a>; <a href=\"#\" onClick=\"return mV('2Sa',22,8);\">2Sa 22:8</a>; <a href=\"#\" onClick=\"return mV('Psa',77,18);\">Psa 77:18</a>; <a href=\"#\" onClick=\"return mV('Psa',97,4);\">97:4</a>; <a href=\"#\" onClick=\"return mV('Psa',104,32);\">104:32</a>).";
eastonArray["$$T0001108"] = "<strong>East:</strong><br><br>(1.) The orient (mizrah); the rising of the sun. Thus \"the east country\" is the country lying to the east of Syria, the Elymais (<a href=\"#\" onClick=\"return mV('Zec',8,7);\">Zec 8:7</a>).<br><br>(2). Properly what is in front of one, or a country that is before or in front of another; the rendering of the word <i>kedem</i>. In pointing out the quarters, a Hebrew always looked with his face toward the east. The word <i>kedem</i> is used when the four quarters of the world are described (<a href=\"#\" onClick=\"return mV('Gen',13,14);\">Gen 13:14</a>; <a href=\"#\" onClick=\"return mV('Gen',28,14);\">28:14</a>); and <i>mizrah</i> when the east only is distinguished from the west (<a href=\"#\" onClick=\"return mV('Jos',11,3);\">Jos 11:3</a>; <a href=\"#\" onClick=\"return mV('Psa',50,1);\">Psa 50:1</a>; <a href=\"#\" onClick=\"return mV('Psa',103,12);\">103:12</a>, etc.). In <a href=\"#\" onClick=\"return mV('Gen',25,6);\">Gen 25:6</a> \"eastward\" is literally \"unto the land of kedem;\" i.e., the lands lying east of Palestine, namely, Arabia, Mesopotamia, etc.";
eastonArray["$$T0001109"] = "<strong>East, Children of the:</strong> the Arabs as a whole, known as the Nabateans or Kedarenes, nomad tribes (<a href=\"#\" onClick=\"return mV('Jdg',6,3,33);\">Jdg 6:3, 33</a>; <a href=\"#\" onClick=\"return mV('Jdg',7,12);\">7:12</a>; <a href=\"#\" onClick=\"return mV('Jdg',8,10);\">8:10</a>).";
eastonArray["$$T0001110"] = "<strong>Easter:</strong> originally a Saxon word (Eostre), denoting a goddess of the Saxons, in honour of whom sacrifices were offered about the time of the Passover. Hence the name came to be given to the festival of the Resurrection of Christ, which occured at the time of the Passover. In the early English versions this word was frequently used as the translation of the Greek pascha (the Passover). When the Authorized Version (1611) was formed, the word \"passover\" was used in all passages in which this word pascha occurred, except in <a href=\"#\" onClick=\"return mV('Act',12,4);\">Act 12:4</a>. In the Revised Version the proper word, \"passover,\" is always used.";
eastonArray["$$T0001111"] = "<strong>East gate:</strong> (<a href=\"#\" onClick=\"return mV('Jer',19,2);\">Jer 19:2</a>), properly the Potter's gate, the gate which led to the potter's field, in the valley of Hinnom.";
eastonArray["$$T0001112"] = "<strong>East sea:</strong> (<a href=\"#\" onClick=\"return mV('Joe',2,20);\">Joe 2:20</a>; <a href=\"#\" onClick=\"return mV('Eze',47,18);\">Eze 47:18</a>), the Dead Sea, which lay on the east side of the Holy Land. The Mediterranean, which lay on the west, was hence called the \"great sea for the west border\" (<a href=\"#\" onClick=\"return mV('Num',34,6);\">Num 34:6</a>).";
eastonArray["$$T0001113"] = "<strong>East wind:</strong> the wind coming from the east (<a href=\"#\" onClick=\"return mV('Job',27,21);\">Job 27:21</a>; <a href=\"#\" onClick=\"return mV('Isa',27,8);\">Isa 27:8</a>, etc.). Blight caused by this wind, \"thin ears\" (<a href=\"#\" onClick=\"return mV('Gen',41,6);\">Gen 41:6</a>); the withered \"gourd\" (<a href=\"#\" onClick=\"return mV('Jon',4,8);\">Jon 4:8</a>). It was the cause and also the emblem of evil (<a href=\"#\" onClick=\"return mV('Eze',17,10);\">Eze 17:10</a>; <a href=\"#\" onClick=\"return mV('Eze',19,12);\">19:12</a>; <a href=\"#\" onClick=\"return mV('Hsa',13,15);\">Hsa 13:15</a>). In Palestine this wind blows from a burning desert, and hence is destitute of moisture necessary for vegetation.";
eastonArray["$$T0001114"] = "<strong>Eating:</strong> The ancient Hebrews would not eat with the Egyptians (<a href=\"#\" onClick=\"return mV('Gen',43,32);\">Gen 43:32</a>). In the time of our Lord they would not eat with Samaritans (<a href=\"#\" onClick=\"return mV('Jhn',4,9);\">Jhn 4:9</a>), and were astonished that he ate with publicans and sinners (<a href=\"#\" onClick=\"return mV('Mat',9,11);\">Mat 9:11</a>). The Hebrews originally sat at table, but afterwards adopted the Persian and Chaldean practice of reclining (<a href=\"#\" onClick=\"return mV('Luk',7,'36-50');\">Luk 7:36-50</a>). Their principal meal was at noon (<a href=\"#\" onClick=\"return mV('Gen',43,16);\">Gen 43:16</a>; <a href=\"#\" onClick=\"return mV('1Ki',20,16);\">1Ki 20:16</a>; <a href=\"#\" onClick=\"return mV('Rth',2,14);\">Rth 2:14</a>; <a href=\"#\" onClick=\"return mV('Luk',14,12);\">Luk 14:12</a>). The word \"eat\" is used metaphorically in <a href=\"#\" onClick=\"return mV('Jer',15,16);\">Jer 15:16</a>; <a href=\"#\" onClick=\"return mV('Eze',3,1);\">Eze 3:1</a>; <a href=\"#\" onClick=\"return mV('Rev',10,9);\">Rev 10:9</a>. In <a href=\"#\" onClick=\"return mV('Jhn',6,'53-58');\">Jhn 6:53-58</a>, \"eating and drinking\" means believing in Christ. Women were never present as guests at meals (q.v.).";
eastonArray["$$T0001115"] = "<strong>Ebal:</strong> stony.<br><br>(1.) A mountain 3,076 feet above the level of the sea, and 1,200 feet above the level of the valley, on the north side of which stood the city of Shechem (q.v.). On this mountain six of the tribes (<a href=\"#\" onClick=\"return mV('Deu',27,12,13);\">Deu 27:12-13</a>) were appointed to take their stand and respond according to a prescribed form to the imprecations uttered in the valley, where the law was read by the Levites (<a href=\"#\" onClick=\"return mV('Deu',11,29);\">11:29</a>; <a href=\"#\" onClick=\"return mV('Deu',29,4,13);\">29:4, 13</a>). This mountain was also the site of the first great altar erected to Jehovah (<a href=\"#\" onClick=\"return mV('Deu',27,'5-8');\">Deu 27:5-8</a>; <a href=\"#\" onClick=\"return mV('Jos',8,'30-35');\">Jos 8:30-35</a>). After this the name of Ebal does not again occur in Jewish history. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001465');\">GERIZIM</a>.)<br><br>(2.) A descendant of Eber (<a href=\"#\" onClick=\"return mV('1Ch',1,22);\">1Ch 1:22</a>), called also Obal (<a href=\"#\" onClick=\"return mV('Gen',10,28);\">Gen 10:28</a>).<br><br>(3.) A descendant of Seir the Horite (<a href=\"#\" onClick=\"return mV('Gen',36,23);\">Gen 36:23</a>).";
eastonArray["$$T0001116"] = "<strong>Ebed:</strong> slave, the father of Gaal, in whom the men of Shechem \"put confidence\" in their conspiracy against Abimelech (<a href=\"#\" onClick=\"return mV('Jdg',9,26,27,30,31);\">Jdg 9:26-27, 30-31</a>).";
eastonArray["$$T0001117"] = "<strong>Ebed-melech:</strong> a servant of the king; probably an official title, an Ethiopian, \"one of the eunuchs which was in the king's house;\" i.e., in the palace of Zedekiah, king of Judah. He interceded with the king in Jeremiah's behalf, and was the means of saving him from death by famine (<a href=\"#\" onClick=\"return mV('Jer',38,'7-13');\">Jer 38:7-13</a>: comp. <a href=\"#\" onClick=\"return mV('Jer',39,'15-18');\">39:15-18).";
eastonArray["$$T0001118"] = "<strong>Eben-ezer:</strong> stone of help, the memorial stone set up by Samuel to commemorate the divine assistance to Israel in their great battle against the Philistines, whom they totally routed (<a href=\"#\" onClick=\"return mV('1Sa',7,'7-12');\">1Sa 7:7-12</a>) at Aphek, in the neighbourhood of Mizpeh, in Benjamin, near the western entrance of the pass of Beth-horon. On this very battle-field, twenty years before, the Philistines routed the Israelites, \"and slew of the army in the field about four thousand men\" (<a href=\"#\" onClick=\"return mV('1Sa',4,1,2);\">1Sa 4:1-2</a>; and at <a href=\"#\" onClick=\"return mV('1Sa',5,1);\">1Sa 5:1</a>, called \"Eben-ezer\" by anticipation). In this extremity the Israelites fetched the ark out of Shiloh and carried it into their camp. The Philistines a second time immediately attacked them, and smote them with a very great slaughter, \"for there fell of Israel thirty thousand footmen. And the ark of God was taken\" (<a href=\"#\" onClick=\"return mV('1Sa',4,10);\">1Sa 4:10</a>). And now in the same place the Philistines are vanquished, and the memorial stone is erected by Samuel (q.v.). The spot where the stone was erected was somewhere \"between Mizpeh and Shen.\" Some have identified it with the modern Beit Iksa, a conspicuous and prominent position, apparently answering all the necessary conditions; others with Dier Aban, 3 miles east of 'Ain Shems.";
eastonArray["$$T0001119"] = "<strong>Eber:</strong> beyond.<br><br>(1.). The third post-duluvian patriach after Shem (<a href=\"#\" onClick=\"return mV('Gen',10,24);\">Gen 10:24</a>; <a href=\"#\" onClick=\"return mV('Gen',11,14);\">11:14</a>). He is regarded as the founder of the Hebrew race (<a href=\"#\" onClick=\"return mV('Gen',10,21);\">10:21</a>; <a href=\"#\" onClick=\"return mV('Num',24,24);\">Num 24:24</a>). In <a href=\"#\" onClick=\"return mV('Luk',3,35);\">Luk 3:35</a> he is called Heber.<br><br>(2.) One of the seven heads of the families of the Gadites (<a href=\"#\" onClick=\"return mV('1Ch',5,13);\">1Ch 5:13</a>).<br><br>(3.) The oldest of the three sons of Elpaal the Benjamite (<a href=\"#\" onClick=\"return mV('1Ch',8,12);\">8:12</a>).<br><br>(4.) One of the heads of the familes of Benjamites in Jerusalem (<a href=\"#\" onClick=\"return mV('1Ch',8,22);\">22</a>).<br><br>(5.) The head of the priestly family of Amok in the time of Zerubbabel (<a href=\"#\" onClick=\"return mV('Neh',12,20);\">Neh 12:20</a>).";
eastonArray["$$T0001120"] = "<strong>Ebony:</strong> a black, hard wood, brought by the merchants from India to Tyre (<a href=\"#\" onClick=\"return mV('Eze',27,15);\">Eze 27:15</a>). It is the heart-wood, brought by <i>Diospyros ebenus</e>, which grows in Ceylon and Southern India.";
eastonArray["$$T0001121"] = "<strong>Ebronah:</strong> passage, one of the stations of the Israelites in their wanderings (<a href=\"#\" onClick=\"return mV('Num',33,34,35);\">Num 33:34-35</a>). It was near Ezion-geber.";
eastonArray["$$T0001122"] = "<strong>Ecbatana:</strong> (<a href=\"#\" onClick=\"return mV('Ezr',6,2);\">Ezr 6:2</a> marg.). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000069');\">ACHMETHA</a>.)";
eastonArray["$$T0001123"] = "<strong>Ecclesiastes:</strong> the Greek rendering of the Hebrew <i>Koheleth</i>, which means \"Preacher.\" The old and traditional view of the authorship of this book attributes it to Solomon. This view can be satisfactorily maintained, though others date it from the Captivity. The writer represents himself implicitly as Solomon (<a href=\"#\" onClick=\"return mV('Ecc',1,12);\">Ecc 1:12</a>). It has been appropriately styled The Confession of King Solomon. \"The writer is a man who has sinned in giving way to selfishness and sensuality, who has paid the penalty of that sin in satiety and weariness of life, but who has through all this been under the discipline of a divine education, and has learned from it the lesson which God meant to teach him.\" \"The writer concludes by pointing out that the secret of a true life is that a man should consecrate the vigour of his youth to God.\" The key-note of the book is sounded in (<a href=\"#\" onClick=\"return mV('Ecc',1,2);\">Ecc 1:2</a>),<br><br>\"Vanity of vanities! saith the Preacher, Vanity of vanities! all is vanity!\"<br><br>i.e., all man's efforts to find happiness apart from God are without result.";
eastonArray["$$T0001124"] = "<strong>Eclipse:</strong> of the sun alluded to in <a href=\"#\" onClick=\"return mV('Amo',8,9);\">Amo 8:9</a>; <a href=\"#\" onClick=\"return mV('Mic',3,6);\">Mic 3:6</a>; <a href=\"#\" onClick=\"return mV('Zec',14,6);\">Zec 14:6</a>; <a href=\"#\" onClick=\"return mV('Joe',2,10);\">Joe 2:10</a>. Eclipses were regarded as tokens of God's anger (<a href=\"#\" onClick=\"return mV('Joe',3,15);\">Joe 3:15</a>; <a href=\"#\" onClick=\"return mV('Job',9,7);\">Job 9:7</a>). The darkness at the crucifixion has been ascribed to an eclipse (<a href=\"#\" onClick=\"return mV('Mat',27,45);\">Mat 27:45</a>); but on the other hand it is argued that the great intensity of darkness caused by an eclipse never lasts for more than six minutes, and this darkness lasted for three hours. Moreover, at the time of the Passover the moon was full, and therefore there could not be an eclipse of the sun, which is caused by an interposition of the moon between the sun and the earth.";
eastonArray["$$T0001125"] = "<strong>Ed:</strong> witness, a word not found in the original Hebrew, nor in the LXX. and Vulgate, but added by the translators in the Authorized Version, also in the Revised Version, of <a href=\"#\" onClick=\"return mV('Jos',22,34);\">Jos 22:34</a>. The words are literally rendered: \"And the children of Reuben and the children of Gad named the altar. It is a witness between us that Jehovah is God.\" This great altar stood probably on the east side of the Jordan, in the land of Gilead, \"over against the land of Canaan.\" After the division of the Promised Land, the tribes of Reuben and Gad and the half-tribe of Manasseh, on returning to their own settlements on the east of Jordan (<a href=\"#\" onClick=\"return mV('Jos',22,'1-6');\">Jos 22:1-6</a>), erected a great altar, which they affirmed, in answer to the challenge of the other tribes, was not for sacrifice, but only as a witness ('Ed) or testimony to future generations that they still retained the same interest in the nation as the other tribes.";
eastonArray["$$T0001126"] = "<strong>Edar:</strong> tower of the flock, a tower between Bethlehem and Hebron, near which Jacob first halted after leaving Bethlehem (<a href=\"#\" onClick=\"return mV('Gen',35,21);\">Gen 35:21</a>). In <a href=\"#\" onClick=\"return mV('Mic',4,8);\">Mic 4:8</a> the word is rendered \"tower of the flock\" (marg., \"Edar\"), and is used as a designation of Bethlehem, which figuratively represents the royal line of David as sprung from Bethlehem.";
eastonArray["$$T0001127"] = "<strong>Eden:</strong> delight.<br><br>(1.) The garden in which our first parents dewlt (<a href=\"#\" onClick=\"return mV('Gen',2,'8-17');\">Gen 2:8-17</a>). No geographical question has been so much discussed as that bearing on its site. It has been placed in Armenia, in the region west of the Caspian Sea, in Media, near Damascus, in Palestine, in Southern Arabia, and in Babylonia. The site must undoubtedly be sought for somewhere along the course of the great streams the Tigris and the Euphrates of Western Asia, in \"the land of Shinar\" or Babylonia. The region from about lat. 33 degrees 30' to lat. 31 degrees, which is a very rich and fertile tract, has been by the most competent authorities agreed on as the probable site of Eden. \"It is a region where streams abound, where they divide and re-unite, where alone in the Mesopotamian tract can be found the phenomenon of a single river parting into four arms, each of which is or has been a river of consequence.\"<br><br>Among almost all nations there are traditions of the primitive innocence of our race in the garden of Eden. This was the \"golden age\" to which the Greeks looked back. Men then lived a \"life free from care, and without labour and sorrow. Old age was unknown; the body never lost its vigour; existence was a perpetual feast without a taint of evil. The earth brought forth spontaneously all things that were good in profuse abundance.\"<br><br>(2.) One of the markets whence the merchants of Tyre obtained richly embroidered stuffs (<a href=\"#\" onClick=\"return mV('Eze',27,23);\">Eze 27:23</a>); the same, probably, as that mentioned in <a href=\"#\" onClick=\"return mV('2Ki',19,12);\">2Ki 19:12</a>, and <a href=\"#\" onClick=\"return mV('Isa',37,12);\">Isa 37:12</a>, as the name of a region conquered by the Assyrians.<br><br>(3.) Son of Joah, and one of the Levites who assisted in reforming the public worship of the sanctuary in the time of Hezekiah (<a href=\"#\" onClick=\"return mV('2Ch',29,12);\">2Ch 29:12</a>).";
eastonArray["$$T0001128"] = "<strong>Eder:</strong> flock.<br><br>(1.) A city in the south of Judah, on the border of Idumea (<a href=\"#\" onClick=\"return mV('Jos',15,21);\">Jos 15:21</a>).<br><br>(2.) The second of the three sons of Mushi, of the family of Merari, appointed to the Levitical office (<a href=\"#\" onClick=\"return mV('1Ch',23,23);\">1Ch 23:23</a>; <a href=\"#\" onClick=\"return mV('1Ch',24,30);\">24:30</a>).";
eastonArray["$$T0001129"] = "<strong>Edom:</strong><br><br>(1.) The name of Esau (q.v.), <a href=\"#\" onClick=\"return mV('Gen',25,30);\">Gen 25:30</a>, \"Feed me, I pray thee, with that same red pottage [Heb. haadom, haadom, i.e., 'the red pottage, the red pottage'] ...Therefore was his name called Edom\", i.e., Red.<br><br>(2.) Idumea (<a href=\"#\" onClick=\"return mV('Isa',34,5,6);\">Isa 34:5-6</a>; <a href=\"#\" onClick=\"return mV('Eze',35,15);\">Eze 35:15</a>). \"The field of Edom\" (<a href=\"#\" onClick=\"return mV('Gen',32,3);\">Gen 32:3</a>), \"the land of Edom\" (<a href=\"#\" onClick=\"return mV('Gen',36,16);\">Gen 36:16</a>), was mountainous (<a href=\"#\" onClick=\"return mV('Oba',1,8,9,19,21);\">Oba 1:8-9, 19, 21</a>). It was called the land, or \"the mountain of Seir,\" the rough hills on the east side of the Arabah. It extended from the head of the Gulf of Akabah, the Elanitic gulf, to the foot of the Dead Sea (<a href=\"#\" onClick=\"return mV('1Ki',9,26);\">1Ki 9:26</a>), and contained, among other cities, the rock-hewn Sela (q.v.), generally known by the Greek name Petra (<a href=\"#\" onClick=\"return mV('2Ki',14,7);\">2Ki 14:7</a>). It is a wild and rugged region, traversed by fruitful valleys. Its old capital was Bozrah (<a href=\"#\" onClick=\"return mV('Isa',63,1);\">Isa 63:1</a>). The early inhabitants of the land were Horites. They were destroyed by the Edomites (<a href=\"#\" onClick=\"return mV('Deu',2,12);\">Deu 2:12</a>), between whom and the kings of Israel and Judah there was frequent war (<a href=\"#\" onClick=\"return mV('2Ki',8,20);\">2Ki 8:20</a>; <a href=\"#\" onClick=\"return mV('2Ch',28,17);\">2Ch 28:17</a>).<br><br>At the time of the Exodus they churlishly refused permission to the Israelites to pass through their land (<a href=\"#\" onClick=\"return mV('Num',20,'14-21');\">Num 20:14-21</a>), and ever afterwards maintained an attitude of hostility toward them. They were conquered by David (<a href=\"#\" onClick=\"return mV('2Sa',8,14);\">2Sa 8:14</a>; <a href=\"#\" onClick=\"return mV('1Ki',9,26);\">1Ki 9:26</a>), and afterwards by Amaziah (<a href=\"#\" onClick=\"return mV('2Ch',25,11,12);\">2Ch 25:11-12</a>). But they regained again their independence, and in later years, during the decline of the Jewish kingdom (<a href=\"#\" onClick=\"return mV('2Ki',16,6);\">2Ki 16:6</a>; R.V. marg., \"Edomites\"), made war against Israel. They took part with the Chaldeans when Nebuchadnezzar captured Jerusalem, and afterwards they invaded and held possession of the south of Palestine as far as Hebron. At length, however, Edom fell under the growing Chaldean power (<a href=\"#\" onClick=\"return mV('Jer',27,3,6);\">Jer 27:3, 6</a>).<br><br>There are many prophecies concerning Edom (<a href=\"#\" onClick=\"return mV('Isa',34,'5-6');\">Isa 34:5-6</a>; <a href=\"#\" onClick=\"return mV('Jer',49,'7-18');\">Jer 49:7-18</a>; <a href=\"#\" onClick=\"return mV('Eze',25,13);\">Eze 25:13</a>; <a href=\"#\" onClick=\"return mV('Eze',35,'1-15');\">35:1-15</a>; <a href=\"#\" onClick=\"return mV('Joe',3,19);\">Joe 3:19</a>; <a href=\"#\" onClick=\"return mV('Amo',1,11);\">Amo 1:11</a>; <a href=\"#\" onClick=\"return mV('Oba',1,'1-');\">Oba</a>; <a href=\"#\" onClick=\"return mV('Mal',1,3,4);\">Mal 1:3-4</a>) which have been remarkably fulfilled. The present desolate condition of that land is a standing testimony to the inspiration of these prophecies. After an existence as a people for above seventeen hundred years, they have utterly disappeared, and their language even is forgotten for ever. In Petra, \"where kings kept their court, and where nobles assembled, there no man dwells; it is given by lot to birds, and beasts, and reptiles.\"<br><br>The Edomites were Semites, closely related in blood and in language to the Israelites. They dispossessed the Horites of Mount Seir; though it is clear, from <a href=\"#\" onClick=\"return mV('Gen',36,'1-');\">Gen 36</a>, that they afterwards intermarried with the conquered population. Edomite tribes settled also in the south of Judah, like the Kenizzites (<a href=\"#\" onClick=\"return mV('Gen',36,11);\">Gen 36:11</a>), to whom Caleb and Othniel belonged (<a href=\"#\" onClick=\"return mV('Jos',15,17);\">Jos 15:17</a>). The southern part of Edom was known as Teman.";
eastonArray["$$T0001130"] = "<strong>Edrei:</strong> mighty; strength.<br><br>(1.) One of the chief towns of the kingdom of Bashan (<a href=\"#\" onClick=\"return mV('Jos',12,4,5);\">Jos 12:4-5</a>). Here Og was defeated by the Israelites, and the strength of the Amorites broken (<a href=\"#\" onClick=\"return mV('Num',21,'33-35');\">Num 21:33-35</a>). It subsequently belonged to Manasseh, for a short time apparently, and afterwards became the abode of banditti and outlaws (<a href=\"#\" onClick=\"return mV('Jos',13,31);\">Jos 13:31</a>). It has been identified with the modern Edr'a, which stands on a rocky promontory on the south-west edge of the Lejah (the Argob of the Hebrews, and Trachonitis of the Greeks). The ruins of Edr'a are the most extensive in the Hauran. They are 3 miles in circumference. A number of the ancient houses still remain; the walls, roofs, and doors being all of stone. The wild region of which Edrei was the capital is thus described in its modern aspect: \"Elevated about 20 feet above the plain, it is a labyrinth of clefts and crevasses in the rock, formed by volcanic action; and owing to its impenetrable condition, it has become a refuge for outlaws and turbulent characters, who make it a sort of Cave of Adullam...It is, in fact, an impregnable natural fortress, about 20 miles in length and 15 in breadth\" (Porter's Syria, etc.). Beneath this wonderful city there is also a subterranean city, hollowed out probably as a refuge for the population of the upper city in times of danger. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000461');\">BASHAN</a>.)<br><br>(2.) A town of Naphtali (<a href=\"#\" onClick=\"return mV('Jos',19,37);\">Jos 19:37</a>).";
eastonArray["$$T0001131"] = "<strong>Effectual call:</strong> See <a href=\"#\" onClick=\"return doDictLookup('ET0000694');\">CALL</a>.";
eastonArray["$$T0001132"] = "<strong>Effectual prayer:</strong> occurs in Authorized Version, <a href=\"#\" onClick=\"return mV('Jam',5,16);\">Jam 5:16</a>. The Revised Version renders appropriately: \"The supplication of a righteous man availeth much in its working\", i.e., \"it moves the hand of Him who moves the world.\"";
eastonArray["$$T0001133"] = "<strong>Egg:</strong> (Heb. beytsah, \"whiteness\"). Eggs deserted (<a href=\"#\" onClick=\"return mV('Isa',10,14);\">Isa 10:14</a>), of a bird (<a href=\"#\" onClick=\"return mV('Deu',22,6);\">Deu 22:6</a>), an ostrich (<a href=\"#\" onClick=\"return mV('Job',39,14);\">Job 39:14</a>), the cockatrice (<a href=\"#\" onClick=\"return mV('Isa',59,5);\">Isa 59:5</a>). In <a href=\"#\" onClick=\"return mV('Luk',11,12);\">Luk 11:12</a>, an egg is contrasted with a scorpion, which is said to be very like an egg in its appearance, so much so as to be with difficulty at times distinguished from it. In <a href=\"#\" onClick=\"return mV('Job',6,6);\">Job 6:6</a> (\"the white of an egg\") the word for egg (hallamuth') occurs nowhere else. It has been translated \"purslain\" (R.V. marg.), and the whole phrase \"purslain-broth\", i.e., broth made of that herb, proverbial for its insipidity; and hence an insipid discourse. Job applies this expression to the speech of Eliphaz as being insipid and dull. But the common rendering, \"the white of an egg\", may be satisfactorily maintained.";
eastonArray["$$T0001134"] = "<strong>Eglah:</strong> a heifer, one of David's wives, and mother of Ithream (<a href=\"#\" onClick=\"return mV('2Sa',3,5);\">2Sa 3:5</a>; <a href=\"#\" onClick=\"return mV('1Ch',3,3);\">1Ch 3:3</a>). According to a Jewish tradition she was Michal.";
eastonArray["$$T0001135"] = "<strong>Eglaim:</strong> two ponds, (<a href=\"#\" onClick=\"return mV('Isa',15,8);\">Isa 15:8</a>), probably En-eglaim of <a href=\"#\" onClick=\"return mV('Eze',47,10);\">Eze 47:10</a>.";
eastonArray["$$T0001136"] = "<strong>Eglon:</strong> the bullock; place of heifers.<br><br>(1.) Chieftain or king of one of the Moabite tribes (<a href=\"#\" onClick=\"return mV('Jdg',3,'12-14');\">Jdg 3:12-14</a>). Having entered into an alliance with Ammon and Amalek, he overran the trans-Jordanic region, and then crossing the Jordan, seized on Jericho, the \"city of palm trees,\" which had been by this time rebuilt, but not as a fortress. He made this city his capital, and kept Israel in subjection for eighteen years. The people at length \"cried unto the Lord\" in their distress, and he \"raised them up a deliverer\" in Ehud (q.v.), the son of Gera, a Benjamite.<br><br>(2.) A city in Judah, near Lachish (<a href=\"#\" onClick=\"return mV('Jos',15,39);\">Jos 15:39</a>). It was destroyed by Joshua (<a href=\"#\" onClick=\"return mV('Jos',10,5,6);\">Jos 10:5-6</a>). It has been identified with Tell Nejileh, 6 miles south of Tell Hesy or Ajlan, north-west of Lachish. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002228');\">LACHISH</a>.)";
eastonArray["$$T0001137"] = "<strong>Egypt:</strong> the land of the Nile and the pyramids, the oldest kingdom of which we have any record, holds a place of great significance in Scripture.<br><br>The Egyptians belonged to the white race, and their original home is still a matter of dispute. Many scholars believe that it was in Southern Arabia, and recent excavations have shown that the valley of the Nile was originally inhabited by a low-class population, perhaps belonging to the Nigritian stock, before the Egyptians of history entered it. The ancient Egyptian language, of which the latest form is Coptic, is distantly connected with the Semitic family of speech.<br><br>Egypt consists geographically of two halves, the northern being the Delta, and the southern Upper Egypt, between Cairo and the First Cataract. In the Old Testament, Northern or Lower Egypt is called Mazor, \"the fortified land\" (<a href=\"#\" onClick=\"return mV('Isa',19,6);\">Isa 19:6</a>; <a href=\"#\" onClick=\"return mV('Isa',37,25);\">37:25</a>, where the A.V. mistranslates \"defence\" and \"besieged places\"); while Southern or Upper Egypt is Pathros, the Egyptian Pa-to-Res, or \"the land of the south\" (<a href=\"#\" onClick=\"return mV('Isa',11,11);\">Isa 11:11</a>). But the whole country is generally mentioned under the dual name of Mizraim, \"the two Mazors.\"<br><br>The civilization of Egypt goes back to a very remote antiquity. The two kingdoms of the north and south were united by Menes, the founder of the first historical dynasty of kings. The first six dynasties constitute what is known as the Old Empire, which had its capital at Memphis, south of Cairo, called in the Old Testament Moph (<a href=\"#\" onClick=\"return mV('Hsa',9,6);\">Hsa 9:6</a>) and Noph. The native name was Mennofer, \"the good place.\"<br><br>The Pyramids were tombs of the monarchs of the Old Empire, those of Gizeh being erected in the time of the Fourth Dynasty. After the fall of the Old Empire came a period of decline and obscurity. This was followed by the Middle Empire, the most powerful dynasty of which was the Twelfth. The Fayyum was rescued for agriculture by the kings of the Twelfth Dynasty; and two obelisks were erected in front of the temple of the sun-god at On or Heliopolis (near Cairo), one of which is still standing. The capital of the Middle Empire was Thebes, in Upper Egypt.<br><br>The Middle Empire was overthrown by the invasion of the Hyksos, or shepherd princes from Asia, who ruled over Egypt, more especially in the north, for several centuries, and of whom there were three dynasties of kings. They had their capital at Zoan or Tanis (now San), in the north-eastern part of the Delta. It was in the time of the Hyksos that Abraham, Jacob, and Joseph entered Egypt. The Hyksos were finally expelled about B.C. 1600, by the hereditary princes of Thebes, who founded the Eighteenth Dynasty, and carried the war into Asia. Canaan and Syria were subdued, as well as Cyprus, and the boundaries of the Egyptian Empire were fixed at the Euphrates. The Soudan, which had been conquered by the kings of the Twelfth Dynasty, was again annexed to Egypt, and the eldest son of the Pharaoh took the title of \"Prince of Cush.\"<br><br>One of the later kings of the dynasty, Amenophis IV., or Khu-n-Aten, endeavoured to supplant the ancient state religion of Egypt by a new faith derived from Asia, which was a sort of pantheistic monotheism, the one supreme god being adored under the image of the solar disk. The attempt led to religious and civil war, and the Pharaoh retreated from Thebes to Central Egypt, where he built a new capital, on the site of the present Tell-el-Amarna. The cuneiform tablets that have been found there represent his foreign correspondence (about B.C. 1400). He surrounded himself with officials and courtiers of Asiatic, and more especially Canaanitish, extraction; but the native party succeeded eventually in overthrowing the government, the capital of Khu-n-Aten was destroyed, and the foreigners were driven out of the country, those that remained being reduced to serfdom.<br><br>The national triumph was marked by the rise of the Nineteenth Dynasty, in the founder of which, Rameses I., we must see the \"new king, who knew not Joseph.\" His grandson, Rameses II., reigned sixty-seven years (B.C. 1348-1281), and was an indefatigable builder. As Pithom, excavated by Dr. Naville in 1883, was one of the cities he built, he must have been the Pharaoh of the Oppression. The Pharaoh of the Exodus may have been one of his immediate successors, whose reigns were short. Under them Egypt lost its empire in Asia, and was itself attacked by barbarians from Libya and the north.<br><br>The Nineteenth Dynasty soon afterwards came to an end; Egypt was distracted by civil war; and for a short time a Canaanite, Arisu, ruled over it.<br><br>Then came the Twentieth Dynasty, the second Pharaoh of which, Rameses III., restored the power of his country. In one of his campaigns he overran the southern part of Palestine, where the Israelites had not yet settled. They must at the time have been still in the wilderness. But it was during the reign of Rameses III. that Egypt finally lost Gaza and the adjoining cities, which were seized by the Pulista, or Philistines.<br><br>After Rameses III., Egypt fell into decay. Solomon married the daughter of one of the last kings of the Twenty-first Dynasty, which was overthrown by Shishak I., the general of the Libyan mercenaries, who founded the Twenty-second Dynasty (<a href=\"#\" onClick=\"return mV('1Ki',11,40);\">1Ki 11:40</a>; <a href=\"#\" onClick=\"return mV('1Ki',14,25,26);\">14:25-26</a>). A list of the places he captured in Palestine is engraved on the outside of the south wall of the temple of Karnak.<br><br>In the time of Hezekiah, Egypt was conquered by Ethiopians from the Soudan, who constituted the Twenty-fifth Dynasty. The third of them was Tirhakah (<a href=\"#\" onClick=\"return mV('2Ki',19,9);\">2Ki 19:9</a>). In B.C. 674 it was conquered by the Assyrians, who divided it into twenty satrapies, and Tirhakah was driven back to his ancestral dominions. Fourteen years later it successfully revolted under Psammetichus I. of Sais, the founder of the Twenty-sixth Dynasty. Among his successors were Necho (<a href=\"#\" onClick=\"return mV('2Ki',23,29);\">2Ki 23:29</a>) and Hophra, or Apries (<a href=\"#\" onClick=\"return mV('Jer',37,5,7,11);\">Jer 37:5, 7, 11</a>). The dynasty came to an end in B.C. 525, when the country was subjugated by Cambyses. Soon afterwards it was organized into a Persian satrapy.<br><br>The title of Pharaoh, given to the Egyptian kings, is the Egyptian Per-aa, or \"Great House,\" which may be compared to that of \"Sublime Porte.\" It is found in very early Egyptian texts.<br><br>The Egyptian religion was a strange mixture of pantheism and animal worship, the gods being adored in the form of animals. While the educated classes resolved their manifold deities into manifestations of one omnipresent and omnipotent divine power, the lower classes regarded the animals as incarnations of the gods.<br><br>Under the Old Empire, Ptah, the Creator, the god of Memphis, was at the head of the Pantheon; afterwards Amon, the god of Thebes, took his place. Amon, like most of the other gods, was identified with Ra, the sun-god of Heliopolis.<br><br>The Egyptians believed in a resurrection and future life, as well as in a state of rewards and punishments dependent on our conduct in this world. The judge of the dead was Osiris, who had been slain by Set, the representative of evil, and afterwards restored to life. His death was avenged by his son Horus, whom the Egyptians invoked as their \"Redeemer.\" Osiris and Horus, along with Isis, formed a trinity, who were regarded as representing the sun-god under different forms.<br><br>Even in the time of Abraham, Egypt was a flourishing and settled monarchy. Its oldest capital, within the historic period, was Memphis, the ruins of which may still be seen near the Pyramids and the Sphinx. When the Old Empire of Menes came to an end, the seat of empire was shifted to Thebes, some 300 miles farther up the Nile. A short time after that, the Delta was conquered by the Hyksos, or shepherd kings, who fixed their capital at Zoan, the Greek Tanis, now San, on the Tanic arm of the Nile. All this occurred before the time of the new king \"which knew not Joseph\" (<a href=\"#\" onClick=\"return mV('Exd',1,8);\">Exd 1:8</a>). In later times Egypt was conquered by the Persians (B.C. 525), and by the Greeks under Alexander the Great (B.C. 332), after whom the Ptolemies ruled the country for three centuries. Subsequently it was for a time a province of the Roman Empire; and at last, in A.D. 1517, it fell into the hands of the Turks, of whose empire it still forms nominally a part. Abraham and Sarah went to Egypt in the time of the shepherd kings. The exile of Joseph and the migration of Jacob to \"the land of Goshen\" occurred about 200 years later. On the death of Solomon, Shishak, king of Egypt, invaded Palestine (<a href=\"#\" onClick=\"return mV('1Ki',14,25);\">1Ki 14:25</a>). He left a list of the cities he conquered.<br><br>A number of remarkable clay tablets, discovered at Tell-el-Amarna in Upper Egypt, are the most important historical records ever found in connection with the Bible. They most fully confirm the historical statements of the Book of Joshua, and prove the antiquity of civilization in Syria and Palestine. As the clay in different parts of Palestine differs, it has been found possible by the clay alone to decide where the tablets come from when the name of the writer is lost. The inscriptions are cuneiform, and in the Aramaic language, resembling Assyrian. The writers are Phoenicians, Amorites, and Philistines, but in no instance Hittites, though Hittites are mentioned. The tablets consist of official dispatches and letters, dating from B.C. 1480, addressed to the two Pharaohs, Amenophis III. and IV., the last of this dynasty, from the kings and governors of Phoenicia and Palestine. There occur the names of three kings killed by Joshua, Adoni-zedec, king of Jerusalem, Japhia, king of Lachish (<a href=\"#\" onClick=\"return mV('Jos',10,3);\">Jos 10:3</a>), and Jabin, king of Hazor (<a href=\"#\" onClick=\"return mV('Jos',11,1);\">11:1</a>); also the Hebrews (Abiri) are said to have come from the desert.<br><br>The principal prophecies of Scripture regarding Egypt are these, <a href=\"#\" onClick=\"return mV('Isa',19,'1-');\">Isa 19</a>; <a href=\"#\" onClick=\"return mV('Jer',43,'8-13');\">Jer 43:8-13</a>; <a href=\"#\" onClick=\"return mV('Jer',44,30);\">44:30</a>; <a href=\"#\" onClick=\"return mV('Jer',46,'1-');\">46</a>; <a href=\"#\" onClick=\"return mV('Eze',29,'1-');\">Eze 29-32</a>; and it might be easily shown that they have all been remarkably fulfilled. For example, the singular disappearance of Noph (i.e., Memphis) is a fulfilment of <a href=\"#\" onClick=\"return mV('Jer',46,19);\">Jer 46:19</a>; <a href=\"#\" onClick=\"return mV('Eze',30,13);\">Eze 30:13</a>.";
eastonArray["$$T0001138"] = "<strong>Ehud:</strong> union.<br><br>(1.) A descendant of Benjamin (<a href=\"#\" onClick=\"return mV('1Ch',7,10);\">1Ch 7:10</a>), his great-grandson.<br><br>(2.) The son of Gera, of the tribe of Benjamin (<a href=\"#\" onClick=\"return mV('Jdg',3,15);\">Jdg 3:15</a>). After the death of Othniel the people again fell into idolatry, and Eglon, the king of Moab, uniting his bands with those of the Ammonites and the Amalekites, crossed the Jordan and took the city of Jericho, and for eighteen years held that whole district in subjection, exacting from it an annual tribute. At length Ehud, by a stratagem, put Eglon to death with a two-edged dagger a cubit long, and routed the Moabites at the fords of the Jordan, putting 10,000 of them to death. Thenceforward the land, at least Benjamin, enjoyed rest \"for fourscore years\" (<a href=\"#\" onClick=\"return mV('Jdg',3,'12-30');\">Jdg 3:12-30</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0003032');\">QUARRIES [2]</a>.) But in the south-west the Philistines reduced the Israelites to great straits (<a href=\"#\" onClick=\"return mV('Jdg',5,6);\">Jdg 5:6</a>). From this oppression Shamgar was raised up to be their deliverer.";
eastonArray["$$T0001139"] = "<strong>Ekron:</strong> firm-rooted, the most northerly of the five towns belonging to the lords of the Philistines, about 11 miles north of Gath. It was assigned to Judah (<a href=\"#\" onClick=\"return mV('Jos',13,3);\">Jos 13:3</a>), and afterwards to Dan (<a href=\"#\" onClick=\"return mV('Jos',19,43);\">19:43</a>), but came again into the full possession of the Philistines (<a href=\"#\" onClick=\"return mV('1Sa',5,10);\">1Sa 5:10</a>). It was the last place to which the Philistines carried the ark before they sent it back to Israel (<a href=\"#\" onClick=\"return mV('1Sa',5,10);\">1Sa 5:10</a>; <a href=\"#\" onClick=\"return mV('1Sa',6,'1-8');\">6:1-8</a>). There was here a noted sanctuary of Baal-zebub (<a href=\"#\" onClick=\"return mV('2Ki',1,2,3,6,16);\">2Ki 1:2-3, 6, 16</a>). Now the small village Akir. It is mentioned on monuments in B.C. 702, when Sennacherib set free its king, imprisoned by Hezekiah in Jerusalem, according to the Assyrian record.";
eastonArray["$$T0001140"] = "<strong>Elah:</strong> terebinth or oak.<br><br>(1.) Valley of, where the Israelites were encamped when David killed Goliath (<a href=\"#\" onClick=\"return mV('1Sa',17,2,19);\">1Sa 17:2, 19</a>). It was near Shochoh of Judah and Azekah (<a href=\"#\" onClick=\"return mV('1Sa',17,1);\">17:1</a>). It is the modern Wady es-Sunt, i.e., \"valley of the acacia.\" \"The terebinths from which the valley of Elah takes its name still cling to their ancient soil. On the west side of the valley, near Shochoh, there is a very large and ancient tree of this kind known as the 'terebinth of Wady Sur,' 55 feet in height, its trunk 17 feet in circumference, and the breadth of its shade no less than 75 feet. It marks the upper end of the Elah valley, and forms a noted object, being one of the largest terebinths in Palestine.\" Geikie's, The Holy Land, etc.<br><br>(2.) One of the Edomite chiefs or \"dukes\" of Mount Seir (<a href=\"#\" onClick=\"return mV('Gen',36,41);\">Gen 36:41</a>).<br><br>(3.) The second of the three sons of Caleb, the son of Jephunneh (<a href=\"#\" onClick=\"return mV('1Ch',4,15);\">1Ch 4:15</a>).<br><br>(4.) The son and successor of Baasha, king of Israel (<a href=\"#\" onClick=\"return mV('1Ki',16,'8-10');\">1Ki 16:8-10</a>). He was killed while drunk by Zimri, one of the captains of his chariots, and was the last king of the line of Baasha. Thus was fullfilled the prophecy of Jehu (<a href=\"#\" onClick=\"return mV('1Ki',16,6,7,'11-14');\">6, 7, 11-14</a>).<br><br>(5.) The father of Hoshea, the last king of Israel (<a href=\"#\" onClick=\"return mV('2Ki',15,30);\">2Ki 15:30</a>; <a href=\"#\" onClick=\"return mV('2Ki',17,1);\">17:1</a>).";
eastonArray["$$T0001141"] = "<strong>Elam:</strong> highland, the son of Shem (<a href=\"#\" onClick=\"return mV('Gen',10,22);\">Gen 10:22</a>), and the name of the country inhabited by his descendants (<a href=\"#\" onClick=\"return mV('Gen',14,1,9);\">14:1, 9</a>; <a href=\"#\" onClick=\"return mV('Isa',11,11);\">Isa 11:11</a>; <a href=\"#\" onClick=\"return mV('Isa',21,2);\">21:2</a>, etc.) lying to the east of Babylonia, and extending to the shore of the Mediterranean, a distance in a direct line of about 1,000 miles. The name Elam is an Assyrian word meaning \"high.\"<br><br>\"The inhabitants of Elam, or 'the Highlands,' to the east of Babylon, were called Elamites. They were divided into several branches, speaking different dialects of the same agglutinative language. The race to which they belonged was brachycephalic, or short-headed, like the pre-Semitic Sumerians of Babylonia.<br><br>\"The earliest Elamite kingdom seems to have been that of Anzan, the exact site of which is uncertain; but in the time of Abraham, Shushan or Susa appears to have already become the capital of the country. Babylonia was frequently invaded by the Elamite kings, who at times asserted their supremacy over it (as in the case of Chedorlaomer, the Kudur-Lagamar, or 'servant of the goddess Lagamar,' of the cuneiform texts).<br><br>\"The later Assyrian monarchs made several campaigns against Elam, and finally Assur-bani-pal (about B.C. 650) succeeded in conquering the country, which was ravaged with fire and sword. On the fall of the Assyrian Empire, Elam passed into the hands of the Persians\" (A.H. Sayce).<br><br>This country was called by the Greeks Cissia or Susiana.";
eastonArray["$$T0001142"] = "<strong>Elasah:</strong> God made.<br><br>(1.) One of the descendants of Judah, of the family of Hezron (<a href=\"#\" onClick=\"return mV('1Ch',2,39);\">1Ch 2:39</a>, \"Eleasah\").<br><br>(2.) A descendant of king Saul (<a href=\"#\" onClick=\"return mV('1Ch',8,37);\">1Ch 8:37</a>; <a href=\"#\" onClick=\"return mV('1Ch',9,43);\">9:43</a>).<br><br>(3.) The son of Shaphan, one of the two who were sent by Zedekiah to Nebuchadnezzar, and also took charge of Jeremiah's letter to the captives in Babylon (<a href=\"#\" onClick=\"return mV('Jer',29,3);\">Jer 29:3</a>).";
eastonArray["$$T0001143"] = "<strong>Elath:</strong> grove; trees, (<a href=\"#\" onClick=\"return mV('Deu',2,8);\">Deu 2:8</a>), also in plural form Eloth (<a href=\"#\" onClick=\"return mV('1Ki',9,26);\">1Ki 9:26</a>, etc.); called by the Greeks and Romans Elana; a city of Idumea, on the east, i.e., the Elanitic, gulf, or the Gulf of Akabah, of the Red Sea. It is first mentioned in <a href=\"#\" onClick=\"return mV('Deu',2,8);\">Deu 2:8</a>. It is also mentioned along with Ezion-geber in <a href=\"#\" onClick=\"return mV('1Ki',9,26);\">1Ki 9:26</a>. It was within the limits of Solomon's dominion, but afterwards revolted. It was, however, recovered and held for a time under king Uzziah (<a href=\"#\" onClick=\"return mV('2Ki',14,22);\">2Ki 14:22</a>). Now the ruin Aila.";
eastonArray["$$T0001144"] = "<strong>El-Bethel:</strong> God of Bethel, the name of the place where Jacob had the vision of the ladder, and where he erected an altar (<a href=\"#\" onClick=\"return mV('Gen',31,13);\">Gen 31:13</a>; <a href=\"#\" onClick=\"return mV('Gen',35,7);\">35:7</a>).";
eastonArray["$$T0001145"] = "<strong>Eldad:</strong> whom God has loved, one of the seventy elders whom Moses appointed (<a href=\"#\" onClick=\"return mV('Num',11,26,27);\">Num 11:26-27</a>) to administer justice among the people. He, with Medad, prophesied in the camp instead of going with the rest to the tabernacle, as Moses had commanded. This incident was announced to Moses by Joshua, who thought their conduct in this respect irregular. Moses replied, \"Enviest thou for my sake? would God that all the Lord's people were prophets\" (<a href=\"#\" onClick=\"return mV('Num',11,'24-30');\">Num 11:24-30</a>; <a href=\"#\" onClick=\"return mV('Mar',9,38);\">Mar 9:38</a>; <a href=\"#\" onClick=\"return mV('Luk',9,49);\">Luk 9:49</a>).";
eastonArray["$$T0001146"] = "<strong>Elder:</strong> a name frequently used in the Old Testament as denoting a person clothed with authority, and entitled to respect and reverence (<a href=\"#\" onClick=\"return mV('Gen',50,7);\">Gen 50:7</a>). It also denoted a political office (<a href=\"#\" onClick=\"return mV('Num',22,7);\">Num 22:7</a>). The \"elders of Israel\" held a rank among the people indicative of authority. Moses opened his commission to them (<a href=\"#\" onClick=\"return mV('Exd',3,16);\">Exd 3:16</a>). They attended Moses on all important occasions. Seventy of them attended on him at the giving of the law (<a href=\"#\" onClick=\"return mV('Exd',24,1);\">Exd 24:1</a>). Seventy also were selected from the whole number to bear with Moses the burden of the people (<a href=\"#\" onClick=\"return mV('Num',11,16,17);\">Num 11:16-17</a>). The \"elder\" is the keystone of the social and political fabric wherever the patriarchal system exists. At the present day this is the case among the Arabs, where the sheik (i.e., \"the old man\") is the highest authority in the tribe. The body of the \"elders\" of Israel were the representatives of the people from the very first, and were recognized as such by Moses. All down through the history of the Jews we find mention made of the elders as exercising authority among the people. They appear as governors (<a href=\"#\" onClick=\"return mV('Deu',31,28);\">Deu 31:28</a>), as local magistrates (<a href=\"#\" onClick=\"return mV('Deu',16,18);\">16:18</a>), administering justice (<a href=\"#\" onClick=\"return mV('Deu',19,12);\">19:12</a>). They were men of extensive influence (<a href=\"#\" onClick=\"return mV('1Sa',30,'26-31');\">1Sa 30:26-31</a>). In New Testament times they also appear taking an active part in public affairs (<a href=\"#\" onClick=\"return mV('Mat',16,21);\">Mat 16:21</a>; <a href=\"#\" onClick=\"return mV('Mat',21,23);\">21:23</a>; <a href=\"#\" onClick=\"return mV('Mat',26,59);\">26:59</a>).<br><br>The Jewish eldership was transferred from the old dispensation to the new. \"The creation of the office of elder is nowhere recorded in the New Testament, as in the case of deacons and apostles, because the latter offices were created to meet new and special emergencies, while the former was transmitted from the earlies times. In other words, the office of elder was the only permanent essential office of the church under either dispensation.\"<br><br>The \"elders\" of the New Testament church were the \"pastors\" (<a href=\"#\" onClick=\"return mV('Eph',4,11);\">Eph 4:11</a>), \"bishops or overseers\" (<a href=\"#\" onClick=\"return mV('Act',20,28);\">Act 20:28</a>), \"leaders\" and \"rulers\" (<a href=\"#\" onClick=\"return mV('Hbr',13,7);\">Hbr 13:7</a>; <a href=\"#\" onClick=\"return mV('1Th',5,12);\">1Th 5:12</a>) of the flock. Everywhere in the New Testament bishop and presbyter are titles given to one and the same officer of the Christian church. He who is called presbyter or elder on account of his age or gravity is also called bishop or overseer with reference to the duty that lay upon him (<a href=\"#\" onClick=\"return mV('Tts',1,'5-7');\">Tts 1:5-7</a>; <a href=\"#\" onClick=\"return mV('Act',20,'17-28');\">Act 20:17-28</a>; <a href=\"#\" onClick=\"return mV('Phl',1,1);\">Phl 1:1</a>).";
eastonArray["$$T0001147"] = "<strong>Elealeh:</strong> God has ascended, a place in the pastoral country east of Jordan, in the tribe of Reuben (<a href=\"#\" onClick=\"return mV('Num',32,3,37);\">Num 32:3, 37</a>). It is not again mentioned till the time of Isaiah (<a href=\"#\" onClick=\"return mV('Isa',15,4);\">Isa 15:4</a>; <a href=\"#\" onClick=\"return mV('Isa',16,9);\">16:9</a>) and Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',48,34);\">Jer 48:34</a>). It is now an extensive ruin called el-A'al, about one mile north-east of Heshbon.";
eastonArray["$$T0001148"] = "<strong>Eleazar:</strong> God has helped.<br><br>(1.) The third son of Aaron (<a href=\"#\" onClick=\"return mV('Exd',6,23);\">Exd 6:23</a>). His wife, a daughter of Putiel, bore him Phinehas (<a href=\"#\" onClick=\"return mV('Exd',6,25);\">Exd 6:25</a>). After the death of Nadab and Abihu (<a href=\"#\" onClick=\"return mV('Lev',10,12);\">Lev 10:12</a>; <a href=\"#\" onClick=\"return mV('Num',3,4);\">Num 3:4</a>) he was appointed to the charge of the sanctuary (<a href=\"#\" onClick=\"return mV('Num',3,32);\">Num 3:32</a>). On Mount Hor he was clothed with the sacred vestments, which Moses took from off his brother Aaron and put upon him as successor to his father in the high priest's office, which he held for more than twenty years (<a href=\"#\" onClick=\"return mV('Num',20,'25-29');\">Num 20:25-29</a>). He took part with Moses in numbering the people (<a href=\"#\" onClick=\"return mV('Num',26,3,4);\">26:3-4</a>), and assisted at the inauguration of Joshua. He assisted in the distribution of the land after the conquest (<a href=\"#\" onClick=\"return mV('Jos',14,1);\">Jos 14:1</a>). The high-priesthood remained in his family till the time of Eli, into whose family it passed, till it was restored to the family of Eleazar in the person of Zadok (<a href=\"#\" onClick=\"return mV('1Sa',2,35);\">1Sa 2:35</a>; <a href=\"#\" onClick=\"return mV('1Ki',2,27);\">1Ki 2:27</a>). \"And Eleazar the son of Aaron died; and they buried him in a hill that pertained to Phinehas his son\" (<a href=\"#\" onClick=\"return mV('Jos',24,33);\">Jos 24:33</a>). The word here rendered \"hill\" is Gibeah, the name of several towns in Palestine which were generally on or near a hill. The words may be more suitably rendered, \"They buried him in Gibeah of Phinehas\", i.e., in the city of Phinehas, which has been identified, in accordance with Jewish and Samaritan traditions, with Kefr Ghuweirah='Awertah, about 7 miles north of Shiloh, and a few miles south-east of Nablus. \"His tomb is still shown there, overshadowed by venerable terebinths.\" Others, however, have identified it with the village of Gaba or Gebena of Eusebius, the modern Khurbet Jibia, 5 miles north of Guphna towards Nablus.<br><br>(2.) An inhabitant of Kirjath-jearim who was \"sanctified\" to take charge of the ark, although not allowed to touch it, while it remained in the house of his father Abinadab (<a href=\"#\" onClick=\"return mV('1Sa',7,1,2);\">1Sa 7:1-2</a>; <a href=\"#\" onClick=\"return mV('Num',3,31);\">Num 3:31</a>; <a href=\"#\" onClick=\"return mV('Num',4,15);\">4:15</a>).<br><br>(3.) The son of Dodo the Ahohite, of the tribe of Benjamin, one of the three most eminent of David's thirty-seven heroes (<a href=\"#\" onClick=\"return mV('1Ch',11,12);\">1Ch 11:12</a>) who broke through the Philistine host and brought him water from the well of Bethlehem (<a href=\"#\" onClick=\"return mV('2Sa',23,9,16);\">2Sa 23:9, 16</a>).<br><br>(4.) A son of Phinehas associated with the priests in taking charge of the sacred vessels brought back to Jerusalem after the Exile (<a href=\"#\" onClick=\"return mV('Ezr',8,33);\">Ezr 8:33</a>).<br><br>(5.) A Levite of the family of Merari (<a href=\"#\" onClick=\"return mV('1Ch',23,21,22);\">1Ch 23:21-22</a>).";
eastonArray["$$T0001149"] = "<strong>Election of Grace:</strong> The Scripture speaks<br><br>(1) of the election of individuals to office or to honour and privilege, e.g., Abraham, Jacob, Saul, David, Solomon, were all chosen by God for the positions they held; so also were the apostles.<br><br>(2) There is also an election of nations to special privileges, e.g., the Hebrews (<a href=\"#\" onClick=\"return mV('Deu',7,6);\">Deu 7:6</a>; <a href=\"#\" onClick=\"return mV('Rom',9,4);\">Rom 9:4</a>).<br><br>(3) But in addition there is an election of individuals to eternal life (<a href=\"#\" onClick=\"return mV('2Th',2,13);\">2Th 2:13</a>; <a href=\"#\" onClick=\"return mV('Eph',1,4);\">Eph 1:4</a>; <a href=\"#\" onClick=\"return mV('1Pe',1,2);\">1Pe 1:2</a>; <a href=\"#\" onClick=\"return mV('Jhn',13,18);\">Jhn 13:18</a>).<br><br>The ground of this election to salvation is the good pleasure of God (<a href=\"#\" onClick=\"return mV('Eph',1,5,11);\">Eph 1:5, 11</a>; <a href=\"#\" onClick=\"return mV('Mat',11,25,26);\">Mat 11:25-26</a>; <a href=\"#\" onClick=\"return mV('Jhn',15,16,19);\">Jhn 15:16, 19</a>). God claims the right so to do (<a href=\"#\" onClick=\"return mV('Rom',9,16,21);\">Rom 9:16, 21</a>).<br><br>It is not conditioned on faith or repentance, but is of soverign grace (<a href=\"#\" onClick=\"return mV('Rom',11,'4-6');\">Rom 11:4-6</a>; <a href=\"#\" onClick=\"return mV('Eph',1,'3-6');\">Eph 1:3-6</a>). All that pertain to salvation, the means (<a href=\"#\" onClick=\"return mV('Eph',2,8);\">Eph 2:8</a>; <a href=\"#\" onClick=\"return mV('2Th',2,13);\">2Th 2:13</a>) as well as the end, are of God (<a href=\"#\" onClick=\"return mV('Act',5,31);\">Act 5:31</a>; <a href=\"#\" onClick=\"return mV('2Ti',2,25);\">2Ti 2:25</a>; <a href=\"#\" onClick=\"return mV('1Cr',1,30);\">1Cr 1:30</a>; <a href=\"#\" onClick=\"return mV('Eph',2,5,10);\">Eph 2:5, 10</a>). Faith and repentance and all other graces are the exercises of a regenerated soul; and regeneration is God's work, a \"new creature.\"<br><br>Men are elected \"to salvation,\" \"to the adoption of sons,\" \"to be holy and without blame before him in love\" (<a href=\"#\" onClick=\"return mV('2Th',2,13);\">2Th 2:13</a>; <a href=\"#\" onClick=\"return mV('Gal',4,4,5);\">Gal 4:4-5</a>; <a href=\"#\" onClick=\"return mV('Eph',1,4);\">Eph 1:4</a>). The ultimate end of election is the praise of God's grace (<a href=\"#\" onClick=\"return mV('Eph',1,6,12);\">Eph 1:6, 12</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002999');\">PREDESTINATION</a>.)";
