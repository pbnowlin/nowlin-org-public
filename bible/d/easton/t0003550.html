<script>
var eastonArray = new Array ();
eastonArray["$$T0003550"] = "<strong>Syrophenician:</strong> \"a Greek, a Syrophenician by nation\" (<a href=\"#\" onClick=\"return mV('Mar',7,26);\">Mar 7:26</a>), i.e., a Gentile born in the Phoenician part of Syria. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002930');\">PHENICIA</a>.)<br><br>When our Lord retired into the borderland of Tyre and Sidon (<a href=\"#\" onClick=\"return mV('Mat',15,21);\">Mat 15:21</a>), a Syro-phoenician woman came to him, and earnestly besought him, in behalf of her daughter, who was grievously afflicted with a demon. Her faith in him was severely tested by his silence (<a href=\"#\" onClick=\"return mV('Mat',15,23);\">Mat 15:23</a>), refusal (<a href=\"#\" onClick=\"return mV('Mat',15,24);\">24</a>), and seeming reproach that it was not meet to cast the children's bread to dogs (<a href=\"#\" onClick=\"return mV('Mat',15,26);\">26</a>). But it stood the test, and her petition was graciously granted, because of the greatness of her faith (<a href=\"#\" onClick=\"return mV('Mat',15,28);\">28</a>).";
eastonArray["$$T0003551"] = "<strong>Taanach:</strong> a sandy place, an ancient royal city of the Canaanites, on the south-western border of the plain of Esdraelon, 4 miles south of Megiddo. Its king was conquered by Joshua (<a href=\"#\" onClick=\"return mV('Jos',12,21);\">Jos 12:21</a>). It was assigned to the Levites of the family of Kohath (<a href=\"#\" onClick=\"return mV('Jos',17,'11-18');\">Jos 17:11-18</a>; <a href=\"#\" onClick=\"return mV('Jos',21,25);\">21:25</a>). It is mentioned in the song of Deborah (<a href=\"#\" onClick=\"return mV('Jdg',5,19);\">Jdg 5:19</a>). It is identified with the small modern village of Ta'annuk.";
eastonArray["$$T0003552"] = "<strong>Taanath-shiloh:</strong> approach to Shiloh, a place on the border of Ephraim (<a href=\"#\" onClick=\"return mV('Jos',16,6);\">Jos 16:6</a>), probably the modern T'ana, a ruin 7 miles south-east of Shechem, on the ridge east of the Mukhnah plain.";
eastonArray["$$T0003553"] = "<strong>Tabbaoth:</strong> impressions; rings, \"the children of,\" returned from the Captivity (<a href=\"#\" onClick=\"return mV('Ezr',2,43);\">Ezr 2:43</a>).";
eastonArray["$$T0003554"] = "<strong>Tabbath:</strong> famous, a town in the tribe of Ephraim (<a href=\"#\" onClick=\"return mV('Jdg',7,22);\">Jdg 7:22</a>), to the south of Bethshean, near the Jordan.";
eastonArray["$$T0003555"] = "<strong>Tabeal:</strong> goodness of God, the father of one whom the kings of Syria and Samaria in vain attempted to place on the throne of Ahaz (<a href=\"#\" onClick=\"return mV('Isa',7,6);\">Isa 7:6</a>).";
eastonArray["$$T0003556"] = "<strong>Tabeel:</strong> a Persian governor of Samaria, who joined others in the attempt to prevent the rebuilding of Jerusalem (<a href=\"#\" onClick=\"return mV('Ezr',4,7);\">Ezr 4:7</a>).";
eastonArray["$$T0003557"] = "<strong>Taberah:</strong> burning, a place in the wilderness of Paran, where the \"fire of the Lord\" consumed the murmuring Israelites (<a href=\"#\" onClick=\"return mV('Num',11,3);\">Num 11:3</a>; <a href=\"#\" onClick=\"return mV('Deu',9,22);\">Deu 9:22</a>). It was also called Kibroth-hattaavah (q.v.).";
eastonArray["$$T0003558"] = "<strong>Tabering:</strong> playing on a small drum or tabret. In <a href=\"#\" onClick=\"return mV('Nah',2,7);\">Nah 2:7</a>, where alone it occurs, it means beating on the breast, as players beat on the tabret.";
eastonArray["$$T0003559"] = "<strong>Tabernacle:</strong><br><br>(1.) A house or dwelling-place (<a href=\"#\" onClick=\"return mV('Job',5,24);\">Job 5:24</a>; <a href=\"#\" onClick=\"return mV('Job',18,6);\">18:6</a>, etc.).<br><br>(2.) A portable shrine (<a href=\"#\" onClick=\"return mV('Act',19,24);\">Act 19:24</a>) containing the image of Moloch (<a href=\"#\" onClick=\"return mV('Amo',5,26);\">Amo 5:26</a>; marg. and R.V., \"Siccuth\").<br><br>(3.) The human body (<a href=\"#\" onClick=\"return mV('2Cr',5,1,4);\">2Cr 5:1, 4</a>); a tent, as opposed to a permanent dwelling.<br><br>(4.) The sacred tent (Heb. mishkan, \"the dwelling-place\"); the movable tent-temple which Moses erected for the service of God, according to the \"pattern\" which God himself showed to him on the mount (<a href=\"#\" onClick=\"return mV('Exd',25,9);\">Exd 25:9</a>; <a href=\"#\" onClick=\"return mV('Hbr',8,5);\">Hbr 8:5</a>). It is called \"the tabernacle of the congregation,\" rather \"of meeting\", i.e., where God promised to meet with Israel (<a href=\"#\" onClick=\"return mV('Exd',29,42);\">Exd 29:42</a>); the \"tabernacle of the testimony\" (<a href=\"#\" onClick=\"return mV('Exd',38,21);\">Exd 38:21</a>; <a href=\"#\" onClick=\"return mV('Num',1,50);\">Num 1:50</a>), which does not, however, designate the whole structure, but only the enclosure which contained the \"ark of the testimony\" (<a href=\"#\" onClick=\"return mV('Exd',25,16);\">Exd 25:16,22</a>; <a href=\"#\" onClick=\"return mV('Num',9,15);\">Num 9:15</a>); the \"tabernacle of witness\" (<a href=\"#\" onClick=\"return mV('Num',17,8);\">Num 17:8</a>); the \"house of the Lord\" (<a href=\"#\" onClick=\"return mV('Deu',23,18);\">Deu 23:18</a>); the \"temple of the Lord\" (<a href=\"#\" onClick=\"return mV('Jos',6,24);\">Jos 6:24</a>); a \"sanctuary\" (<a href=\"#\" onClick=\"return mV('Exd',25,8);\">Exd 25:8</a>).<br><br>A particular account of the materials which the people provided for the erection and of the building itself is recorded in Exd 25-40. The execution of the plan mysteriously given to Moses was intrusted to Bezaleel and Aholiab, who were specially endowed with wisdom and artistic skill, probably gained in Egypt, for this purpose (<a href=\"#\" onClick=\"return mV('Exd',35,'30-35');\">Exd 35:30-35</a>). The people provided materials for the tabernacle so abundantly that Moses was under the necessity of restraining them (<a href=\"#\" onClick=\"return mV('Exd',36,6);\">36:6</a>). These stores, from which they so liberally contributed for this purpose, must have consisted in a great part of the gifts which the Egyptians so readily bestowed on them on the eve of the Exodus (<a href=\"#\" onClick=\"return mV('Exd',12,35,36);\">Exd 12:35-36</a>).<br><br>The tabernacle was a rectangular enclosure, in length about 45 feet (i.e., reckoning a cubit at 18 inches) and in breadth and height about 15. Its two sides and its western end were made of boards of acacia wood, placed on end, resting in sockets of brass, the eastern end being left open (<a href=\"#\" onClick=\"return mV('Exd',26,22);\">Exd 26:22</a>). This framework was covered with four coverings, the first of linen, in which figures of the symbolic cherubim were wrought with needlework in blue and purple and scarlet threads, and probably also with threads of gold (<a href=\"#\" onClick=\"return mV('Exd',26,'1-6');\">Exd 26:1-6</a>; <a href=\"#\" onClick=\"return mV('Exd',36,'8-13');\">36:8-13</a>). Above this was a second covering of twelve curtains of black goats'-hair cloth, reaching down on the outside almost to the ground (<a href=\"#\" onClick=\"return mV('Exd',26,'7-11');\">Exd 26:7-11</a>). The third covering was of rams' skins dyed red, and the fourth was of badgers' skins (Heb. tahash, i.e., the dugong, a species of seal), <a href=\"#\" onClick=\"return mV('Exd',25,5);\">Exd 25:5</a>; <a href=\"#\" onClick=\"return mV('Exd',26,14);\">26:14</a>; <a href=\"#\" onClick=\"return mV('Exd',35,7,23);\">35:7, 23</a>; <a href=\"#\" onClick=\"return mV('Exd',36,19);\">36:19</a>; <a href=\"#\" onClick=\"return mV('Exd',39,34);\">39:34</a>.<br><br>Internally it was divided by a veil into two chambers, the exterior of which was called the holy place, also \"the sanctuary\" (<a href=\"#\" onClick=\"return mV('Hbr',9,2);\">Hbr 9:2</a>) and the \"first tabernacle\" (<a href=\"#\" onClick=\"return mV('Hbr',9,6);\">6</a>); and the interior, the holy of holies, \"the holy place,\" \"the Holiest,\" the \"second tabernacle\" (<a href=\"#\" onClick=\"return mV('Exd',28,29);\">Exd 28:29</a>; <a href=\"#\" onClick=\"return mV('Hbr',9,7);\">Hbr 9:3,7</a>). The veil separating these two chambers was a double curtain of the finest workmanship, which was never passed except by the high priest once a year, on the great Day of Atonement. The holy place was separated from the outer court which enclosed the tabernacle by a curtain, which hung over the six pillars which stood at the east end of the tabernacle, and by which it was entered.<br><br>The order as well as the typical character of the services of the tabernacle are recorded in <a href=\"#\" onClick=\"return mV('Hbr',9,'1-');\">Heb 9</a>; <a href=\"#\" onClick=\"return mV('Hbr',10,'19-22');\">10:19-22</a>.<br><br>The holy of holies, a cube of 10 cubits, contained the \"ark of the testimony\", i.e., the oblong chest containing the two tables of stone, the pot of manna, and Aaron's rod that budded.<br><br>The holy place was the western and larger chamber of the tabernacle. Here were placed the table for the shewbread, the golden candlestick, and the golden altar of incense.<br><br>Round about the tabernacle was a court, enclosed by curtains hung upon sixty pillars (<a href=\"#\" onClick=\"return mV('Exd',27,'9-18');\">Exd 27:9-18</a>). This court was 150 feet long and 75 feet broad. Within it were placed the altar of burnt offering, which measured 7 1/2 feet in length and breadth and 4 1/2 feet high, with horns at the four corners, and the laver of brass (<a href=\"#\" onClick=\"return mV('Exd',30,18);\">Exd 30:18</a>), which stood between the altar and the tabernacle.<br><br>The whole tabernacle was completed in seven months. On the first day of the first month of the second year after the Exodus, it was formally set up, and the cloud of the divine presence descended on it (<a href=\"#\" onClick=\"return mV('Exd',39,'22-43');\">Exd 39:22-43</a>; <a href=\"#\" onClick=\"return mV('Exd',40,'1-38');\">40:1-38</a>). It cost 29 talents 730 shekels of gold, 100 talents 1,775 shekels of silver, 70 talents 2,400 shekels of brass (<a href=\"#\" onClick=\"return mV('Exd',38,'24-31');\">Exd 38:24-31</a>).<br><br>The tabernacle was so constructed that it could easily be taken down and conveyed from place to place during the wanderings in the wilderness. The first encampment of the Israelites after crossing the Jordan was at Gilgal, and there the tabernacle remained for seven years (<a href=\"#\" onClick=\"return mV('Jos',4,19);\">Jos 4:19</a>). It was afterwards removed to Shiloh (<a href=\"#\" onClick=\"return mV('Jos',18,1);\">Jos 18:1</a>), where it remained during the time of the Judges, till the days of Eli, when the ark, having been carried out into the camp when the Israelites were at war with the Philistines, was taken by the enemy (<a href=\"#\" onClick=\"return mV('1Sa',4,'1-')\">1Sa 4</a>), and was never afterwards restored to its place in the tabernacle. The old tabernacle erected by Moses in the wilderness was transferred to Nob (<a href=\"#\" onClick=\"return mV('1Sa',21,1);\">1Sa 21:1</a>), and after the destruction of that city by Saul (<a href=\"#\" onClick=\"return mV('1Sa',22,9);\">22:9</a>; <a href=\"#\" onClick=\"return mV('1Ch',16,39,40);\">1Ch 16:39-40</a>), to Gibeon. It is mentioned for the last time in <a href=\"#\" onClick=\"return mV('1Ch',21,29);\">1Ch 21:29</a>. A new tabernacle was erected by David at Jerusalem (<a href=\"#\" onClick=\"return mV('2Sa',6,17);\">2Sa 6:17</a>; <a href=\"#\" onClick=\"return mV('1Ch',16,1);\">1Ch 16:1</a>), and the ark was brought from Perez-uzzah and deposited in it (<a href=\"#\" onClick=\"return mV('2Sa',6,'8-17');\">2Sa 6:8-17</a>; <a href=\"#\" onClick=\"return mV('2Ch',1,4);\">2Ch 1:4</a>).<br><br>The word thus rendered ('ohel) in <a href=\"#\" onClick=\"return mV('Exd',33,7);\">Exd 33:7</a> denotes simply a tent, probably Moses' own tent, for the tabernacle was not yet erected.";
eastonArray["$$T0003560"] = "<strong>Tabernacles, Feast of:</strong> the third of the great annual festivals of the Jews (<a href=\"#\" onClick=\"return mV('Lev',23,'33-43');\">Lev 23:33-43</a>). It is also called the \"feast of ingathering\" (<a href=\"#\" onClick=\"return mV('Exd',23,16);\">Exd 23:16</a>; <a href=\"#\" onClick=\"return mV('Deu',16,13);\">Deu 16:13</a>). It was celebrated immediately after the harvest, in the month Tisri, and the celebration lasted for eight days (<a href=\"#\" onClick=\"return mV('Lev',23,'33-43');\">Lev 23:33-43</a>). During that period the people left their homes and lived in booths formed of the branches of trees. The sacrifices offered at this time are mentioned in <a href=\"#\" onClick=\"return mV('Num',29,'13-38');\">Num 29:13-38</a>. It was at the time of this feast that Solomon's temple was dedicated (<a href=\"#\" onClick=\"return mV('1Ki',8,2);\">1Ki 8:2</a>). Mention is made of it after the return from the Captivity. This feast was designed<br><br>(1) to be a memorial of the wilderness wanderings, when the people dwelt in booths (<a href=\"#\" onClick=\"return mV('Lev',23,43);\">Lev 23:43</a>), and<br><br>(2) to be a harvest thanksgiving (<a href=\"#\" onClick=\"return mV('Neh',8,'9-18');\">Neh 8:9-18</a>). The Jews, at a later time, introduced two appendages to the original festival, viz.,<br><br>(1) that of drawing water from the Pool of Siloam, and pouring it upon the altar (<a href=\"#\" onClick=\"return mV('Jhn',7,2,37);\">Jhn 7:2, 37</a>), as a memorial of the water from the rock in Horeb; and<br><br>(2) of lighting the lamps at night, a memorial of the pillar of fire by night during their wanderings.<br><br>\"The feast of Tabernacles, the harvest festival of the Jewish Church, was the most popular and important festival after the Captivity. At Jerusalem it was a gala day. It was to the autumn pilgrims, who arrived on the 14th (of the month Tisri, the feast beginning on the 15th) day, like entrance into a silvan city. Roofs and courtyards, streets and squares, roads and gardens, were green with boughs of citron and myrtle, palm and willow. The booths recalled the pilgrimage through the wilderness. The ingathering of fruits prophesied of the spiritual harvest.\", Valling's Jesus Christ, p. 133.";
eastonArray["$$T0003561"] = "<strong>Tabitha:</strong> (in Greek called Dorcas), gazelle, a disciple at Joppa. She was distinguished for her alms-deeds and good works. Peter, who was sent for from Lydda on the occasion of her death, prayed over the dead body, and said, \"Tabitha, arise.\" And she opened her eyes and sat up; and Peter \"gave her his hand, and raised her up; and calling the saints and widows, he presented her alive\" (<a href=\"#\" onClick=\"return mV('Act',9,'36-43');\">Act 9:36-43</a>).";
eastonArray["$$T0003562"] = "<strong>Tables:</strong> (<a href=\"#\" onClick=\"return mV('Mar',7,4);\">Mar 7:4</a>) means banqueting-couches or benches, on which the Jews reclined when at meals. This custom, along with the use of raised tables like ours, was introduced among the Jews after the Captivity. Before this they had, properly speaking, no table. That which served the purpose was a skin or piece of leather spread out on the carpeted floor. Sometimes a stool was placed in the middle of this skin. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000055');\">ABRAHAM'S BOSOM</a>; <a href=\"#\" onClick=\"return doDictLookup ('ET0000434');\">BANQUET</a>; <a href=\"#\" onClick=\"return doDictLookup ('ET0002451');\">MEALS</a>.)";
eastonArray["$$T0003563"] = "<strong>Tablet:</strong> probably a string of beads worn round the neck (<a href=\"#\" onClick=\"return mV('Exd',35,22);\">Exd 35:22</a>; <a href=\"#\" onClick=\"return mV('Num',31,50);\">Num 31:50</a>). In <a href=\"#\" onClick=\"return mV('Isa',3,20);\">Isa 3:20</a> the Hebrew word means a perfume-box, as it is rendered in the Revised Version.";
eastonArray["$$T0003564"] = "<strong>Tabor:</strong> a height.<br><br>(1.) Now Jebel et-Tur, a cone-like prominent mountain, 11 miles west of the Sea of Galilee. It is about 1,843 feet high. The view from the summit of it is said to be singularly extensive and grand. This is alluded to in <a href=\"#\" onClick=\"return mV('Psa',89,12);\">Psa 89:12</a>; <a href=\"#\" onClick=\"return mV('Jer',46,18);\">Jer 46:18</a>. It was here that Barak encamped before the battle with Sisera (q.v.) <a href=\"#\" onClick=\"return mV('Jdg',4,'6-14');\">Jdg 4:6-14</a>. There is an old tradition, which, however, is unfounded, that it was the scene of the transfiguration of our Lord. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0001754');\">HERMON</a>.) \"The prominence and isolation of Tabor, standing, as it does, on the border-land between the northern and southern tribes, between the mountains and the central plain, made it a place of note in all ages, and evidently led the psalmist to associate it with Hermon, the one emblematic of the south, the other of the north.\" There are some who still hold that this was the scene of the transfiguration (q.v.).<br><br>(2.) A town of Zebulum (<a href=\"#\" onClick=\"return mV('1Ch',6,77);\">1Ch 6:77</a>).<br><br>(3.) The \"plain of Tabor\" (<a href=\"#\" onClick=\"return mV('1Sa',10,3);\">1Sa 10:3</a>) should be, as in the Revised Version, \"the oak of Tabor.\" This was probably the Allon- bachuth of <a href=\"#\" onClick=\"return mV('Gen',35,8);\">Gen 35:8</a>.";
eastonArray["$$T0003565"] = "<strong>Tabret:</strong> (Heb. toph), a timbrel (q.v.) or tambourine, generally played by women (<a href=\"#\" onClick=\"return mV('Gen',31,27);\">Gen 31:27</a>; <a href=\"#\" onClick=\"return mV('1Sa',10,5);\">1Sa 10:5</a>; <a href=\"#\" onClick=\"return mV('1Sa',18,6);\">18:6</a>). In <a href=\"#\" onClick=\"return mV('Job',17,6);\">Job 17:6</a> the word (Heb. topheth) \"tabret\" should be, as in the Revised Version, \"an open abhorring\" (marg., \"one in whose face they spit; \" lit., \"a spitting in the face\").";
eastonArray["$$T0003566"] = "<strong>Tabrimon:</strong> good is Rimmon, the father of Benhadad, king of Syria (<a href=\"#\" onClick=\"return mV('1Ki',15,18);\">1Ki 15:18</a>).";
eastonArray["$$T0003567"] = "<strong>Taches:</strong> hooks or clasps by which the tabernacle curtains were connected (<a href=\"#\" onClick=\"return mV('Exd',26,6,11,33);\">Exd 26:6, 11, 33</a>; <a href=\"#\" onClick=\"return mV('Exd',35,11);\">35:11</a>).";
eastonArray["$$T0003568"] = "<strong>Tachmonite:</strong> =Hach'monite, a name given to Jashobeam (<a href=\"#\" onClick=\"return mV('2Sa',23,8);\">2Sa 23:8</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,11);\">1Ch 11:11</a>).";
eastonArray["$$T0003569"] = "<strong>Tackling:</strong> (<a href=\"#\" onClick=\"return mV('Isa',33,23);\">Isa 33:23</a>), the ropes attached to the mast of a ship. In (<a href=\"#\" onClick=\"return mV('Act',27,19);\">Act 27:19</a>) this word means generally the furniture of the ship or the \"gear\" (<a href=\"#\" onClick=\"return mV('Act',27,17);\">27:17</a>), all that could be removed from the ship.";
eastonArray["$$T0003570"] = "<strong>Tadmor:</strong> palm, a city built by Solomon \"in the wilderness\" (<a href=\"#\" onClick=\"return mV('2Ch',8,4);\">2Ch 8:4</a>). In <a href=\"#\" onClick=\"return mV('1Ki',9,18);\">1Ki 9:18</a>, where the word occurs in the Authorized Version, the Hebrew text and the Revised Version read \"Tamar,\" which is properly a city on the southern border of Palestine and toward the wilderness (<a href=\"#\" onClick=\"return mV('Eze',47,19);\">Eze 47:19</a>; <a href=\"#\" onClick=\"return mV('Eze',48,28);\">48:28</a>). In <a href=\"#\" onClick=\"return mV('2Ch',8,14);\">2Ch 8:14</a> Tadmor is mentioned in connection with Hamath-zobah. It is called Palmyra by the Greeks and Romans. It stood in the great Syrian wilderness, 176 miles from Damascus and 130 from the Mediterranean and was the centre of a vast commercial traffic with Western Asia. It was also an important military station. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003473');\">SOLOMON</a>.) \"Remains of ancient temples and palaces, surrounded by splendid colonnades of white marble, many of which are yet standing, and thousands of prostrate pillars, scattered over a large extent of space, attest the ancient magnificence of this city of palms, surpassing that of the renowned cities of Greece and Rome.\"";
eastonArray["$$T0003571"] = "<strong>Tahapanes:</strong> =Tahpanhes=Tehaphnehes, (called \"Daphne\" by the Greeks, now Tell Defenneh), an ancient Egyptian city, on the Tanitic branch of the Nile, about 16 miles from Pelusium. The Jews from Jerusalem fled to this place after the death of Gedaliah (q.v.), and settled there for a time (<a href=\"#\" onClick=\"return mV('Jer',2,16);\">Jer 2:16</a>; <a href=\"#\" onClick=\"return mV('Jer',43,7);\">43:7</a>; <a href=\"#\" onClick=\"return mV('Jer',44,1);\">44:1</a>; <a href=\"#\" onClick=\"return mV('Jer',46,14);\">46:14</a>). A platform of brick-work, which there is every reason to believe was the pavement at the entry of Pharaoh's palace, has been discovered at this place. \"Here,\" says the discoverer, Mr. Petrie, \"the ceremony described by Jeremiah (Jer <a href=\"#\" onClick=\"return mV('Jer',43,'8-10');\">43:8-10</a>); \"brick-kiln\", i.e., pavement of brick] took place before the chiefs of the fugitives assembled on the platform, and here Nebuchadnezzar spread his royal pavilion\" (R.V., \"brickwork\").";
eastonArray["$$T0003572"] = "<strong>Tahpenes:</strong> the wife of Pharaoh, who gave her sister in marriage to Hadad the Edomite (<a href=\"#\" onClick=\"return mV('1Ki',11,19,20);\">1Ki 11:19-20</a>).";
eastonArray["$$T0003573"] = "<strong>Tahtim-hodshi:</strong> the land of the newly inhabited, (<a href=\"#\" onClick=\"return mV('2Sa',24,6);\">2Sa 24:6</a>). It is conjectured that, instead of this word, the reading should be, \"the Hittites of Kadesh,\" the Hittite capital, on the Orontes. It was apparently some region east of the Jordan and north of Gilead.";
eastonArray["$$T0003574"] = "<strong>Tale:</strong><br><br>(1.) Heb. tokhen, \"a task,\" as weighed and measured out = tally, i.e., the number told off; the full number (<a href=\"#\" onClick=\"return mV('Exd',5,18);\">Exd 5:18</a>; see <a href=\"#\" onClick=\"return mV('1Sa',18,27);\">1Sa 18:27</a>; <a href=\"#\" onClick=\"return mV('1Ch',9,28);\">1Ch 9:28</a>). In <a href=\"#\" onClick=\"return mV('Eze',45,11);\">Eze 45:11</a> rendered \"measure.\"<br><br>(2.) Heb. hegeh, \"a thought;\" \"meditation\" (<a href=\"#\" onClick=\"return mV('Psa',90,9);\">Psa 90:9</a>); meaning properly \"as a whisper of sadness,\" which is soon over, or \"as a thought.\" The LXX. and Vulgate render it \"spider;\" the Authorized Version and Revised Version, \"as a tale\" that is told. In <a href=\"#\" onClick=\"return mV('Job',37,2);\">Job 37:2</a> this word is rendered \"sound;\" Revised Version margin, \"muttering;\" and in <a href=\"#\" onClick=\"return mV('Eze',2,10);\">Eze 2:10</a>, \"mourning.\"";
eastonArray["$$T0003575"] = "<strong>Talent:</strong> of silver contained 3,000 shekels (<a href=\"#\" onClick=\"return mV('Exd',38,25,26);\">Exd 38:25-26</a>), and was equal to 94 3/7 lbs. avoirdupois. The Greek talent, however, as in the LXX., was only 82 1/4 lbs. It was in the form of a circular mass, as the Hebrew name <i>kikkar</i> denotes. A talent of gold was double the weight of a talent of silver (<a href=\"#\" onClick=\"return mV('2Sa',12,30);\">2Sa 12:30</a>). Parable of the talents (<a href=\"#\" onClick=\"return mV('Mat',18,24);\">Mat 18:24</a>; <a href=\"#\" onClick=\"return mV('Mat',25,15);\">25:15</a>).";
eastonArray["$$T0003576"] = "<strong>Talitha cumi:</strong> (<a href=\"#\" onClick=\"return mV('Mar',5,41);\">Mar 5:41</a>), a Syriac or Aramaic expression, meaning, \"Little maid, arise.\" Peter, who was present when the miracle was wrought, recalled the actual words used by our Lord, and told them to Mark.";
eastonArray["$$T0003577"] = "<strong>Talmai:</strong> abounding in furrows.<br><br>(1.) One of the Anakim of Hebron, who were slain by the men of Judah under Caleb (<a href=\"#\" onClick=\"return mV('Num',13,22);\">Num 13:22</a>; <a href=\"#\" onClick=\"return mV('Jos',15,14);\">Jos 15:14</a>; <a href=\"#\" onClick=\"return mV('Jdg',1,10);\">Jdg 1:10</a>).<br><br>(2.) A king of Geshur, to whom Absalom fled after he had put Amnon to death (<a href=\"#\" onClick=\"return mV('2Sa',3,3);\">2Sa 3:3</a>; <a href=\"#\" onClick=\"return mV('2Sa',13,37);\">13:37</a>). His daughter, Maachah, was one of David's wives, and the mother of Absalom (<a href=\"#\" onClick=\"return mV('1Ch',3,2);\">1Ch 3:2</a>).";
eastonArray["$$T0003578"] = "<strong>Talmon:</strong> oppressed.<br><br>(1.) A Levite porter (<a href=\"#\" onClick=\"return mV('1Ch',9,17);\">1Ch 9:17</a>; <a href=\"#\" onClick=\"return mV('Neh',11,19);\">Neh 11:19</a>).<br><br>(2.) One whose descendants returned with Zerubbabel to Jerusalem (<a href=\"#\" onClick=\"return mV('Ezr',2,42);\">Ezr 2:42</a>; <a href=\"#\" onClick=\"return mV('Neh',7,45);\">Neh 7:45</a>); probably the same as<br><br>(1).";
eastonArray["$$T0003579"] = "<strong>Tamar:</strong> palm.<br><br>(1.) A place mentioned by Ezekiel (<a href=\"#\" onClick=\"return mV('Eze',47,19);\">Eze 47:19</a>; <a href=\"#\" onClick=\"return mV('Eze',48,28);\">48:28</a>), on the southeastern border of Palestine. Some suppose this was \"Tadmor\" (q.v.).<br><br>(2.) The daughter-in-law of Judah, to whose eldest son, Er, she was married (<a href=\"#\" onClick=\"return mV('Gen',38,6);\">Gen 38:6</a>). After her husband's death, she was married to Onan, his brother (<a href=\"#\" onClick=\"return mV('Gen',38,8);\">8</a>), and on his death, Judah promised to her that his third son, Shelah, would become her husband. This promise was not fulfilled, and hence Tamar's revenge and Judah's great guilt (<a href=\"#\" onClick=\"return mV('Gen',38,'12-30');\">38:12-30</a>).<br><br>(3.) A daughter of David (<a href=\"#\" onClick=\"return mV('2Sa',13,'1-32');\">2Sa 13:1-32</a>; <a href=\"#\" onClick=\"return mV('1Ch',3,9);\">1Ch 3:9</a>), whom Amnon shamefully outraged and afterwards \"hated exceedingly,\" thereby illustrating the law of human nature noticed even by the heathen, \"Proprium humani ingenii est odisse quem laeseris\", i.e., \"It is the property of human nature to hate one whom you have injured.\"<br><br>(4.) A daughter of Absalom (<a href=\"#\" onClick=\"return mV('2Sa',14,27);\">2Sa 14:27</a>).";
eastonArray["$$T0003580"] = "<strong>Tamarisk:</strong> Heb. 'eshel (<a href=\"#\" onClick=\"return mV('Gen',21,33);\">Gen 21:33</a>; <a href=\"#\" onClick=\"return mV('1Sa',22,6);\">1Sa 22:6</a>; <a href=\"#\" onClick=\"return mV('1Sa',31,13);\">31:13</a>, in the R.V.; but in A.V., \"grove,\" \"tree\"); Arab. asal. Seven species of this tree are found in Palestine. It is a \"very graceful tree, with long feathery branches and tufts closely clad with the minutest of leaves, and surmounted in spring with spikes of beautiful pink blosoms, which seem to envelop the whole tree in one gauzy sheet of colour\" (Tristram's Nat. Hist.).";
eastonArray["$$T0003581"] = "<strong>Tammuz:</strong> a corruption of Dumuzi, the Accadian sun-god (the Adonis of the Greeks), the husband of the goddess Ishtar. In the Chaldean calendar there was a month set apart in honour of this god, the month of June to July, the beginning of the summer solstice. At this festival, which lasted six days, the worshippers, with loud lamentations, bewailed the funeral of the god, they sat \"weeping for Tammuz\" (<a href=\"#\" onClick=\"return mV('Eze',8,14);\">Eze 8:14</a>).<br><br>The name, also borrowed from Chaldea, of one of the months of the Hebrew calendar.";
eastonArray["$$T0003582"] = "<strong>Tanhumeth:</strong> consolation, a Netophathite; one of the captains who supported Gedaliah (<a href=\"#\" onClick=\"return mV('2Ki',25,23);\">2Ki 25:23</a>; <a href=\"#\" onClick=\"return mV('Jer',40,8);\">Jer 40:8</a>).";
eastonArray["$$T0003583"] = "<strong>Tanis:</strong> (<a href=\"#\" onClick=\"return mV('Eze',30,14);\">Eze 30:14</a>, marg.). See <a href=\"#\" onClick=\"return doDictLookup ('ET0003949');\">ZOAN</a>.";
eastonArray["$$T0003584"] = "<strong>Tappuah:</strong> apple-region.<br><br>(1.) A town in the valley or lowland of Judah; formerly a royal city of the Canaanites (<a href=\"#\" onClick=\"return mV('Jos',12,17);\">Jos 12:17</a>; <a href=\"#\" onClick=\"return mV('Jos',15,34);\">15:34</a>). It is now called Tuffuh, about 12 miles west of Jerusalem.<br><br>(2.) A town on the border of Ephraim (<a href=\"#\" onClick=\"return mV('Jos',16,8);\">Jos 16:8</a>). The \"land\" of Tappuah fell to Manasseh, but the \"city\" to Ephraim (<a href=\"#\" onClick=\"return mV('Jos',17,8);\">17:8</a>).<br><br>(3.) En-tappuah, the well of the apple, probably one of the springs near Yassuf (<a href=\"#\" onClick=\"return mV('Jos',17,7);\">Jos 17:7</a>).";
eastonArray["$$T0003585"] = "<strong>Tarah:</strong> stopping; station, an encampment of the Hebrews in the wilderness (<a href=\"#\" onClick=\"return mV('Num',33,27,28);\">Num 33:27-28</a>).";
eastonArray["$$T0003586"] = "<strong>Tares:</strong> the bearded darnel, mentioned only in <a href=\"#\" onClick=\"return mV('Mat',13,'25-30');\">Mat 13:25-30</a>. It is the <i>Lolium temulentum</i>, a species of rye-grass, the seeds of which are a strong soporific poison. It bears the closest resemblance to wheat till the ear appears, and only then the difference is discovered. It grows plentifully in Syria and Palestine.";
eastonArray["$$T0003587"] = "<strong>Target:</strong> (<a href=\"#\" onClick=\"return mV('1Sa',17,6);\">1Sa 17:6</a>, A.V., after the LXX. and Vulg.), a kind of small shield. The margin has \"gorget,\" a piece of armour for the throat. The Revised Version more correctly renders the Hebrew word (kidon) by \"javelin.\" The same Hebrew word is used in <a href=\"#\" onClick=\"return mV('Jos',8,18);\">Jos 8:18</a> (A.V., \"spear; \" R.V., \"javelin\"); <a href=\"#\" onClick=\"return mV('Job',39,23);\">Job 39:23</a> (A.V., \"shield; \" R.V., \"javelin\"); <a href=\"#\" onClick=\"return mV('Job',41,29);\">41:29</a> (A.V., \"spear; \" R.V., \"javelin\").";
eastonArray["$$T0003588"] = "<strong>Tarshish:</strong> a Sanscrit or Aryan word, meaning \"the sea coast.\"<br><br>(1.) One of the \"sons\" of Javan (<a href=\"#\" onClick=\"return mV('Gen',10,4);\">Gen 10:4</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,7);\">1Ch 1:7</a>).<br><br>(2.) The name of a place which first comes into notice in the days of Solomon. The question as to the locality of Tarshish has given rise to not a little discussion. Some think there was a Tarshish in the East, on the Indian coast, seeing that \"ships of Tarshish\" sailed from Eziongeber, on the Red Sea (<a href=\"#\" onClick=\"return mV('1Ki',9,26);\">1Ki 9:26</a>; <a href=\"#\" onClick=\"return mV('1Ki',22,48);\">22:48</a>; <a href=\"#\" onClick=\"return mV('2Ch',9,21);\">2Ch 9:21</a>). Some, again, argue that Carthage was the place so named. There can be little doubt, however, that this is the name of a Phoenician port in Spain, between the two mouths of the Guadalquivir (the name given to the river by the Arabs, and meaning \"the great wady\" or water-course). It was founded by a Carthaginian colony, and was the farthest western harbour of Tyrian sailors. It was to this port Jonah's ship was about to sail from Joppa. It has well been styled \"the Peru of Tyrian adventure;\" it abounded in gold and silver mines.<br><br>It appears that this name also is used without reference to any locality. \"Ships of Tarshish\" is an expression sometimes denoting simply ships intended for a long voyage (<a href=\"#\" onClick=\"return mV('Isa',23,1,14);\">Isa 23:1, 14</a>), ships of a large size (sea-going ships), whatever might be the port to which they sailed. Solomon's ships were so styled (<a href=\"#\" onClick=\"return mV('1Ki',10,22);\">1Ki 10:22</a>; <a href=\"#\" onClick=\"return mV('1Ki',22,49);\">22:49</a>).";
eastonArray["$$T0003589"] = "<strong>Tarsus:</strong> the chief city of Cilicia. It was distinguished for its wealth and for its schools of learning, in which it rivalled, nay, excelled even Athens and Alexandria, and hence was spoken of as \"no mean city.\" It was the native place of the Apostle Paul (<a href=\"#\" onClick=\"return mV('Act',21,39);\">Act 21:39</a>). It stood on the banks of the river Cydnus, about 12 miles north of the Mediterranean. It is said to have been founded by Sardanapalus, king of Assyria. It is now a filthy, ruinous Turkish town, called Tersous. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002871');\">PAUL</a>.)";
eastonArray["$$T0003590"] = "<strong>Tartak:</strong> prince of darkness, one of the gods of the Arvites, who colonized part of Samaria after the deportation of Israel by Shalmaneser (<a href=\"#\" onClick=\"return mV('2Ki',17,31);\">2Ki 17:31</a>).";
eastonArray["$$T0003591"] = "<strong>Tartan:</strong> an Assyrian word, meaning \"the commander-in-chief.\"<br><br>(1.) One of Sennacherib's messengers to Hezekiah (<a href=\"#\" onClick=\"return mV('2Ki',18,17);\">2Ki 18:17</a>).<br><br>(2.) One of Sargon's generals (<a href=\"#\" onClick=\"return mV('Isa',20,1);\">Isa 20:1</a>).";
eastonArray["$$T0003592"] = "<strong>Tatnai:</strong> gift, a Persian governor (Heb. pehah, i.e., \"satrap; \" modern \"pasha\") \"on this side the river\", i.e., of the whole tract on the west of the Euphrates. This Hebrew title <i>pehah</i> is given to governors of provinces generally. It is given to Nehemiah (<a href=\"#\" onClick=\"return mV('Neh',5,14);\">Neh 5:14</a>) and to Zerubbabel (<a href=\"#\" onClick=\"return mV('Hag',1,1);\">Hag 1:1</a>). It is sometimes translated \"captain\" (<a href=\"#\" onClick=\"return mV('1Ki',20,24);\">1Ki 20:24</a>; <a href=\"#\" onClick=\"return mV('Dan',3,2,3);\">Dan 3:2-3</a>), sometimes also \"deputy\" (<a href=\"#\" onClick=\"return mV('Est',8,9);\">Est 8:9</a>; <a href=\"#\" onClick=\"return mV('Est',9,3);\">9:3</a>). With others, Tatnai opposed the rebuilding of the temple (<a href=\"#\" onClick=\"return mV('Ezr',5,6);\">Ezr 5:6</a>); but at the command of Darius, he assisted the Jews (<a href=\"#\" onClick=\"return mV('Ezr',6,'1-13');\">6:1-13</a>).";
eastonArray["$$T0003593"] = "<strong>Taverns, The three:</strong> a place on the great \"Appian Way,\" about 11 miles from Rome, designed for the reception of travellers, as the name indicates. Here Paul, on his way to Rome, was met by a band of Roman Christians (<a href=\"#\" onClick=\"return mV('Act',28,15);\">Act 28:15</a>). The \"Tres Tabernae was the first mansio or mutatio, that is, halting-place for relays, from Rome, or the last on the way to the city. At this point three roads run into the Via Appia, that from Tusculum, that from Alba Longa, and that from Antium; so necessarily here would be a halting-place, which took its name from the three shops there, the general store, the blacksmith's, and the refreshment-house...Tres Tabernae is translated as Three Taverns, but it more correctly means three shops\" (Forbes's Footsteps of St. Paul, p.20).";
eastonArray["$$T0003594"] = "<strong>Taxes:</strong> first mentioned in the command (<a href=\"#\" onClick=\"return mV('Exd',30,'11-16');\">Exd 30:11-16</a>) that every Jew from twenty years and upward should pay an annual tax of \"half a shekel for an offering to the Lord.\" This enactment was faithfully observed for many generations (<a href=\"#\" onClick=\"return mV('2Ch',24,6);\">2Ch 24:6</a>; <a href=\"#\" onClick=\"return mV('Mat',17,24);\">Mat 17:24</a>).<br><br>Afterwards, when the people had kings to reign over them, they began, as Samuel had warned them (<a href=\"#\" onClick=\"return mV('1Sa',8,'10-18');\">1Sa 8:10-18</a>), to pay taxes for civil purposes (<a href=\"#\" onClick=\"return mV('1Ki',4,7);\">1Ki 4:7</a>; <a href=\"#\" onClick=\"return mV('1Ki',9,15);\">9:15</a>; <a href=\"#\" onClick=\"return mV('1Ki',12,4);\">12:4</a>). Such taxes, in increased amount, were afterwards paid to the foreign princes that ruled over them.<br><br>In the New Testament the payment of taxes, imposed by lawful rulers, is enjoined as a duty (<a href=\"#\" onClick=\"return mV('Rom',13,'1-7');\">Rom 13:1-7</a>; <a href=\"#\" onClick=\"return mV('1Pe',2,13,14);\">1Pe 2:13-14</a>). Mention is made of the tax (telos) on merchandise and travellers (<a href=\"#\" onClick=\"return mV('Mat',17,25);\">Mat 17:25</a>); the annual tax (phoros) on property (<a href=\"#\" onClick=\"return mV('Luk',20,22);\">Luk 20:22</a>; <a href=\"#\" onClick=\"return mV('Luk',23,2);\">23:2</a>); the poll-tax (<a href=\"#\" onClick=\"return mV('Mat',17,25);\">Mat 17:25</a>; <a href=\"#\" onClick=\"return mV('Mat',22,17);\">22:17</a>; <a href=\"#\" onClick=\"return mV('Mar',12,14);\">Mar 12:14</a>); and the temple-tax (<a href=\"#\" onClick=\"return mV('Mat',17,'24-27');\">Mat 17:24-27</a>; <a href=\"#\" onClick=\"return mV('Exd',30,13);\">Exd 30:13</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003722');\">TRIBUTE</a>.)";
eastonArray["$$T0003595"] = "<strong>Taxing:</strong> (<a href=\"#\" onClick=\"return mV('Luk',2,2);\">Luk 2:2</a>; R.V., \"enrolment\"), \"when Cyrenius was governor of Syria,\" is simply a census of the people, or an enrolment of them with a view to their taxation. The decree for the enrolment was the occasion of Joseph and Mary's going up to Bethlehem. It has been argued by some that Cyrenius (q.v.) was governor of Cilicia and Syria both at the time of our Lord's birth and some years afterwards. This decree for the taxing referred to the whole Roman world, and not to Judea alone. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000751');\">CENSUS</a>.)";
eastonArray["$$T0003596"] = "<strong>Tebeth:</strong> (<a href=\"#\" onClick=\"return mV('Est',2,16);\">Est 2:16</a>), a word probably of Persian origin, denoting the cold time of the year; used by the later Jews as denoting the tenth month of the year. Assyrian tebituv, \"rain.\"";
eastonArray["$$T0003597"] = "<strong>Teil tree:</strong> (an old name for the lime-tree, the tilia), <a href=\"#\" onClick=\"return mV('Isa',6,13);\">Isa 6:13</a>, the terebinth, or turpentine-tree, the <i>Pistacia terebinthus</i> of botanists. The Hebrew word here used (elah) is rendered oak (q.v.) in <a href=\"#\" onClick=\"return mV('Gen',35,4);\">Gen 35:4</a>; <a href=\"#\" onClick=\"return mV('Jdg',6,11,19);\">Jdg 6:11, 19</a>; <a href=\"#\" onClick=\"return mV('Isa',1,29);\">Isa 1:29</a>, etc. In <a href=\"#\" onClick=\"return mV('Isa',61,3);\">Isa 61:3</a> it is rendered in the plural \"trees;\" <a href=\"#\" onClick=\"return mV('Hsa',4,13);\">Hsa 4:13</a>, \"elm\" (R.V., \"terebinth\"). <a href=\"#\" onClick=\"return mV('Hsa',4,13);\">Hsa 4:13</a>, \"elm\" (R.V., \"terebinth\"). In <a href=\"#\" onClick=\"return mV('1Sa',17,2,19);\">1Sa 17:2, 19</a> it is taken as a proper name, \"Elah\" (R.V. marg., \"terebinth\").<br><br>\"The terebinth of Mamre, or its lineal successor, remained from the days of Abraham till the fourth century of the Christian era, and on its site Constantine erected a Christian church, the ruins of which still remain.\"<br><br>This tree \"is seldom seen in clumps or groves, never in forests, but stands isolated and weird-like in some bare ravine or on a hill-side where nothing else towers above the low brushwood\" (Tristram).";
eastonArray["$$T0003598"] = "<strong>Tekel:</strong> weighed (<a href=\"#\" onClick=\"return mV('Dan',5,27);\">Dan 5:27</a>).";
eastonArray["$$T0003599"] = "<strong>Tekoa, Tekoah:</strong> pitching of tents; fastening down, a town of Judah, about 12 miles south of Jerusalem, and visible from the city. From this place Joab procured a \"wise woman,\" who pretended to be in great affliction, and skilfully made her case known to David. Her address to the king was in the form of an apologue, similar to that of Nathan (<a href=\"#\" onClick=\"return mV('2Sa',12,'1-6');\">2Sa 12:1-6</a>). The object of Joab was, by the intervention of this woman, to induce David to bring back Absalom to Jerusalem (<a href=\"#\" onClick=\"return mV('2Sa',14,2,4,9);\">2Sa 14:2, 4, 9</a>).<br><br>This was also the birth-place of the prophet Amos (<a href=\"#\" onClick=\"return mV('Amo',1,1);\">Amo 1:1</a>).<br><br>It is now the village of Teku'a, on the top of a hill among ruins, 5 miles south of Bethlehem, and close to Beth-haccerem (\"Herod's mountain\").";
