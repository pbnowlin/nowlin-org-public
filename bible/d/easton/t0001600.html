<script src="./js/NoNavHeader.js"  type="text/javascript"></script>
<script>
var eastonArray = new Array ();
eastonArray["$$T0001600"] = "<strong>Halt:</strong> lame on the feet (<a href=\"#\" onClick=\"return mV('Gen',32,31);\">Gen 32:31</a>; <a href=\"#\" onClick=\"return mV('Psa',38,17);\">Psa 38:17</a>). To \"halt between two opinions\" (<a href=\"#\" onClick=\"return mV('1Ki',18,21);\">1Ki 18:21</a>) is supposed by some to be an expression used in \"allusion to birds, which hop from spray to spray, forwards and backwards.\" The LXX. render the expression \"How long go ye lame on both knees?\" The Hebrew verb rendered \"halt\" is used of the irregular dance (\"leaped upon\") around the altar (ver. <a href=\"#\" onClick=\"return mV('1Ki',18,26);\">26</a>). It indicates a lame, uncertain gait, going now in one direction, now in another, in the frenzy of wild leaping.";
eastonArray["$$T0001601"] = "<strong>Ham:</strong> warm, hot, and hence the south; also an Egyptian word meaning \"black\", the youngest son of Noah (<a href=\"#\" onClick=\"return mV('Gen',5,32);\">Gen 5:32</a>; <a href=\"#\" onClick=\"return mV('Gen',9,22,24);\">Gen 9:22, 24</a>). The curse pronounced by Noah against Ham, properly against Canaan his fourth son, was accomplished when the Jews subsequently exterminated the Canaanites.<br><br>One of the most important facts recorded in <a href=\"#\" onClick=\"return mV('Gen',10,'1-');\">Gen 10</a> is the foundation of the earliest monarchy in Babylonia by Nimrod the grandson of Ham (<a href=\"#\" onClick=\"return mV('Gen',10,6,8,10);\">6, 8, 10</a>). The primitive Babylonian empire was thus Hamitic, and of a cognate race with the primitive inhabitants of Arabia and of Ethiopia. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000060');\">ACCAD</a>.)<br><br>The race of Ham were the most energetic of all the descendants of Noah in the early times of the post-diluvian world.";
eastonArray["$$T0001602"] = "<strong>Haman:</strong> (of Persian origin), magnificent, the name of the vizier (i.e., the prime minister) of the Persian king Ahasuerus (<a href=\"#\" onClick=\"return mV('Est',3,1);\">Est 3:1</a>, etc.). He is called an \"Agagite,\" which seems to denote that he was descended from the royal family of the Amalekites, the bitterest enemies of the Jews, as Agag was one of the titles of the Amalekite kings. He or his parents were brought to Persia as captives taken in war. He was hanged on the gallows which he had erected for Mordecai the Jew (<a href=\"#\" onClick=\"return mV('Est',7,10);\">Est 7:10</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001254');\">ESTHER</a>.)";
eastonArray["$$T0001603"] = "<strong>Hamath:</strong> fortress, the capital of one of the kingdoms of Upper Syria of the same name, on the Orontes, in the valley of Lebanon, at the northern boundary of Palestine (<a href=\"#\" onClick=\"return mV('Num',13,21);\">Num 13:21</a>; <a href=\"#\" onClick=\"return mV('Num',34,8);\">34:8</a>), at the foot of Hermon (<a href=\"#\" onClick=\"return mV('Jos',13,5);\">Jos 13:5</a>) towards Damascus (<a href=\"#\" onClick=\"return mV('Zec',9,2);\">Zec 9:2</a>; <a href=\"#\" onClick=\"return mV('Jer',49,23);\">Jer 49:23</a>). It is called \"Hamath the great\" in <a href=\"#\" onClick=\"return mV('Amo',6,2);\">Amo 6:2</a>, and \"Hamath-zobah\" in <a href=\"#\" onClick=\"return mV('2Ch',8,3);\">2Ch 8:3</a>.<br><br>Hamath, now Hamah, had an Aramaean population, but Hittite monuments discovered there show that it must have been at one time occupied by the Hittites. It was among the conquests of the Pharaoh Thothmes III. Its king, Tou or Toi, made alliance with David (<a href=\"#\" onClick=\"return mV('2Sa',8,10);\">2Sa 8:10</a>), and in B.C. 740 Azariah formed a league with it against Assyria. It was, however, conquered by the Assyrians, and its nineteen districts placed under Assyrian governors. In B.C. 720 it revolted under a certain Yahu-bihdi, whose name, compounded with that of the God of Israel (Yahu), perhaps shows that he was of Jewish origin. But the revolt was suppressed, and the people of Hamath were transported to Samaria (<a href=\"#\" onClick=\"return mV('2Ki',17,24,30);\">2Ki 17:24, 30</a>), where they continued to worship their god Ashima. Hamah is beautifully situated on the Orontes, 32 miles north of Emesa, and 36 south of the ruins of Assamea.<br><br>The kingdom of Hamath comprehended the great plain lying on both banks of the Orontes from the fountain near Riblah to Assamea on the north, and from Lebanon on the west to the desert on the east. The \"entrance of Hamath\" (<a href=\"#\" onClick=\"return mV('Num',34,8);\">Num 34:8</a>), which was the north boundary of Palestine, led from the west between the north end of Lebanon and the Nusairiyeh mountains.";
eastonArray["$$T0001604"] = "<strong>Hamath-zobah:</strong> fortress of Zobah, (<a href=\"#\" onClick=\"return mV('2Ch',8,3);\">2Ch 8:3</a>) is supposed by some to be a different place from the foregoing; but this is quite uncertain.";
eastonArray["$$T0001605"] = "<strong>Hammath:</strong> warm springs, one of the \"fenced cities\" of Naphtali (<a href=\"#\" onClick=\"return mV('Jos',19,35);\">Jos 19:35</a>). It is identified with the warm baths (the heat of the water ranging from 136 degrees to 144 degrees) still found on the shore a little to the south of Tiberias under the name of Hummam Tabariyeh (\"Bath of Tiberias\").";
eastonArray["$$T0001606"] = "<strong>Hammedatha:</strong> father of Haman, designated usually \"the Agagite\" (<a href=\"#\" onClick=\"return mV('Est',3,1,10);\">Est 3:1, 10</a>; <a href=\"#\" onClick=\"return mV('Est',8,5);\">8:5</a>).";
eastonArray["$$T0001607"] = "<strong>Hammelech:</strong> the king's, the father of Jerahmeel, mentioned in <a href=\"#\" onClick=\"return mV('Jer',36,26);\">Jer 36:26</a>. Some take this word as a common noun, \"the king\", and understand that Jerahmeel was Jehoiakim's son. Probably, however, it is to be taken as a proper name.";
eastonArray["$$T0001608"] = "<strong>Hammer:</strong><br><br>(1.) Heb. pattish, used by gold-beaters (<a href=\"#\" onClick=\"return mV('Isa',41,7);\">Isa 41:7</a>) and by quarry-men (<a href=\"#\" onClick=\"return mV('Jer',23,29);\">Jer 23:29</a>). Metaphorically of Babylon (<a href=\"#\" onClick=\"return mV('Jer',50,23);\">Jer 50:23</a>) or Nebuchadnezzar.<br><br>(2.) Heb. makabah, a stone-cutter's mallet (<a href=\"#\" onClick=\"return mV('1Ki',6,7);\">1Ki 6:7</a>), or of any workman (<a href=\"#\" onClick=\"return mV('Jdg',4,21);\">Jdg 4:21</a>; <a href=\"#\" onClick=\"return mV('Isa',44,12);\">Isa 44:12</a>).<br><br>(3.) Heb. halmuth, a poetical word for a workman's hammer, found only in <a href=\"#\" onClick=\"return mV('Jdg',5,26);\">Jdg 5:26</a>, where it denotes the mallet with which the pins of the tent of the nomad are driven into the ground.<br><br>(4.) Heb. mappets, rendered \"battle-axe\" in <a href=\"#\" onClick=\"return mV('Jer',51,20);\">Jer 51:20</a>. This was properly a \"mace,\" which is thus described by Rawlinson: \"The Assyrian mace was a short, thin weapon, and must either have been made of a very tough wood or (and this is more probable) of metal. It had an ornamented head, which was sometimes very beautifully modelled, and generally a strap or string at the lower end by which it could be grasped with greater firmness.\"";
eastonArray["$$T0001609"] = "<strong>Hammoleketh:</strong> the queen, the daughter of Machir and sister of Gilead (<a href=\"#\" onClick=\"return mV('1Ch',7,17,18);\">1Ch 7:17-18</a>). Abiezer was one of her three children.";
eastonArray["$$T0001610"] = "<strong>Hammon:</strong> warm springs.<br>br />(1.) A town in the tribe of Asher, near Zidon (<a href=\"#\" onClick=\"return mV('Jos',19,28);\">Jos 19:28</a>), identified with 'Ain Hamul.<br><br>(2.) A Levitical city of Naphtali (<a href=\"#\" onClick=\"return mV('1Ch',6,76);\">1Ch 6:76</a>).";
eastonArray["$$T0001611"] = "<strong>Hammoth-dor:</strong> warm springs, a Levitical city of Naphtali (<a href=\"#\" onClick=\"return mV('Jos',21,32);\">Jos 21:32</a>); probably Hammath in <a href=\"#\" onClick=\"return mV('Jos',19,35);\">Jos 19:35</a>.";
eastonArray["$$T0001612"] = "<strong>Hamon:</strong> See <a href=\"#\" onClick=\"return doDictLookup('ET0000390');\">BAAL-HAMON</a>.";
eastonArray["$$T0001613"] = "<strong>Hamonah:</strong> multitude, a name figuratively assigned to the place in which the slaughter and burial of the forces of Gog were to take place (<a href=\"#\" onClick=\"return mV('Eze',39,16);\">Eze 39:16</a>).";
eastonArray["$$T0001614"] = "<strong>Hamon-gog:</strong> multitude of Gog, the name of the valley in which the slaughtered forces of Gog are to be buried (<a href=\"#\" onClick=\"return mV('Eze',39,11,15);\">Eze 39:11, 15</a>), \"the valley of the passengers on the east of the sea.\"";
eastonArray["$$T0001615"] = "<strong>Hamor:</strong> he-ass, a Hivite from whom Jacob purchased the plot of ground in which Joseph was afterwards buried (<a href=\"#\" onClick=\"return mV('Gen',33,19);\">Gen 33:19</a>). He is called \"Emmor\" in <a href=\"#\" onClick=\"return mV('Act',7,16);\">Act 7:16</a>. His son Shechem founded the city of that name which Simeon and Levi destroyed because of his crime in the matter of Dinah, Jacob's daughter (<a href=\"#\" onClick=\"return mV('Gen',34,20);\">Gen 34:20</a>). Hamor and Shechem were also slain (ver. <a href=\"#\" onClick=\"return mV('Gen',34,26);\">26</a>).";
eastonArray["$$T0001616"] = "<strong>Hamul:</strong> spared, one of the sons of Pharez, son of Judah (<a href=\"#\" onClick=\"return mV('1Ch',2,5);\">1Ch 2:5</a>). His descendants are called Hamulites (<a href=\"#\" onClick=\"return mV('Num',26,21);\">Num 26:21</a>).";
eastonArray["$$T0001617"] = "<strong>Hamutal:</strong> kinsman of the dew, the daughter of Jeremiah of Libnah, wife of king Josiah, and mother of king Jehoahaz (<a href=\"#\" onClick=\"return mV('2Ki',23,31);\">2Ki 23:31</a>), also of king Zedekiah (<a href=\"#\" onClick=\"return mV('2Ki',24,18);\">2Ki 24:18</a>).";
eastonArray["$$T0001618"] = "<strong>Hanameel:</strong> whom God has graciously given, the cousin of Jeremiah, to whom he sold the field he possessed in Anathoth, before the siege of Jerusalem (<a href=\"#\" onClick=\"return mV('Jer',32,'6-12');\">Jer 32:6-12</a>).";
eastonArray["$$T0001619"] = "<strong>Hanan:</strong> merciful.<br><br>(1.) A Benjamite (<a href=\"#\" onClick=\"return mV('1Ch',8,23);\">1Ch 8:23</a>).<br><br>(2.) One of David's heroes (<a href=\"#\" onClick=\"return mV('1Ch',11,43);\">1Ch 11:43</a>).<br><br>(3.) <a href=\"#\" onClick=\"return mV('Jer',35,4);\">Jer 35:4</a>.<br><br>(4.) A descendant of Saul (<a href=\"#\" onClick=\"return mV('1Ch',8,38);\">1Ch 8:38</a>).<br><br>(5.) One of the Nethinim (<a href=\"#\" onClick=\"return mV('Ezr',2,46);\">Ezr 2:46</a>).<br><br>(6.) One of the Levites who assisted Ezra (<a href=\"#\" onClick=\"return mV('Neh',8,7);\">Neh 8:7</a>).<br><br>(7.) One of the chiefs who subscribed the covenant (<a href=\"#\" onClick=\"return mV('Neh',10,22);\">Neh 10:22</a>).";
eastonArray["$$T0001620"] = "<strong>Hananeel:</strong> God has graciously given, a tower in the wall of Jerusalem (<a href=\"#\" onClick=\"return mV('Neh',3,1);\">Neh 3:1</a>; <a href=\"#\" onClick=\"return mV('Neh',12,39);\">12:39</a>). It is mentioned also in <a href=\"#\" onClick=\"return mV('Jer',31,38);\">Jer 31:38</a>; <a href=\"#\" onClick=\"return mV('Zec',14,10);\">Zec 14:10</a>.";
eastonArray["$$T0001621"] = "<strong>Hanani:</strong> God has gratified me, or is gracious.<br><br>(1.) One of the sons of Heman (<a href=\"#\" onClick=\"return mV('1Ch',25,4,25);\">1Ch 25:4, 25</a>).<br><br>(2.) A prophet who was sent to rebuke king Asa for entering into a league with Benhadad I., king of Syria, against Judah (<a href=\"#\" onClick=\"return mV('2Ch',16,'1-10');\">2Ch 16:1-10</a>). He was probably the father of the prophet Jehu (<a href=\"#\" onClick=\"return mV('1Ki',16,7);\">1Ki 16:7</a>).<br><br>(3.) Probably a brother of Nehemiah (<a href=\"#\" onClick=\"return mV('Neh',1,2);\">Neh 1:2</a>; <a href=\"#\" onClick=\"return mV('Neh',7,2);\">7:2</a>), who reported to him the melancholy condition of Jerusalem. Nehemiah afterwards appointed him to have charge of the city gates.";
eastonArray["$$T0001622"] = "<strong>Hananiah:</strong> Jehovah has given.<br><br>(1.) A chief of the tribe of Benjamin (<a href=\"#\" onClick=\"return mV('1Ch',8,24);\">1Ch 8:24</a>).<br><br>(2.) One of the sons of Heman (<a href=\"#\" onClick=\"return mV('1Ch',25,4,23);\">1Ch 25:4, 23</a>).<br><br>(3.) One of Uzziah's military officers (<a href=\"#\" onClick=\"return mV('2Ch',26,11);\">2Ch 26:11</a>).<br><br>(4.) Grandfather of the captain who arrested Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',37,13);\">Jer 37:13</a>).<br><br>(5.) <a href=\"#\" onClick=\"return mV('Jer',36,12);\">Jer 36:12</a>.<br><br>(6.) <a href=\"#\" onClick=\"return mV('Neh',10,23);\">Neh 10:23</a>.<br><br>(7.) Shadrach, one of the \"three Hebrew children\" (21). <a href=\"#\" onClick=\"return mV('Dan',1,'1-')\">Dan 1</a>; <a href=\"#\" onClick=\"return mV('Dan',6,7);\">6:7</a>).<br><br>(8.) Son of Zerubbabel (<a href=\"#\" onClick=\"return mV('1Ch',3,19,21);\">1Ch 3:19,21</a>).<br><br>(9.) <a href=\"#\" onClick=\"return mV('Ezr',10,28);\">Ezr 10:28</a>.<br><br>(10.) The \"ruler of the palace; he was a faithful man, and feared God above many\" (<a href=\"#\" onClick=\"return mV('Neh',7,2);\">Neh 7:2</a>).<br><br>(11.) <a href=\"#\" onClick=\"return mV('Neh',3,8);\">Neh 3:8</a>.<br><br>(12.) <a href=\"#\" onClick=\"return mV('Neh',3,30);\">Neh 3:30</a>.<br><br>(13.) A priest, son of Jeremiah (<a href=\"#\" onClick=\"return mV('Neh',12,12);\">Neh 12:12</a>).<br><br>(14.) A false prophet contemporary with Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',28,3,17);\">Jer 28:3, 17</a>).";
eastonArray["$$T0001623"] = "<strong>Hand:</strong> Called by Galen \"the instrument of instruments.\" It is the symbol of human action (<a href=\"#\" onClick=\"return mV('Psa',9,16);\">Psa 9:16</a>; <a href=\"#\" onClick=\"return mV('Job',9,30);\">Job 9:30</a>; <a href=\"#\" onClick=\"return mV('Isa',1,15);\">Isa 1:15</a>; <a href=\"#\" onClick=\"return mV('1Ti',2,8);\">1Ti 2:8</a>). Washing the hands was a symbol of innocence (<a href=\"#\" onClick=\"return mV('Psa',26,6);\">Psa 26:6</a>; <a href=\"#\" onClick=\"return mV('Psa',73,13);\">73:13</a>; <a href=\"#\" onClick=\"return mV('Mat',27,24);\">Mat 27:24</a>), also of sanctification (<a href=\"#\" onClick=\"return mV('1Cr',6,11);\">1Cr 6:11</a>; <a href=\"#\" onClick=\"return mV('Isa',51,16);\">Isa 51:16</a>; <a href=\"#\" onClick=\"return mV('Psa',24,3,4);\">Psa 24:3-4</a>). In <a href=\"#\" onClick=\"return mV('Psa',77,2);\">Psa 77:2</a> the correct rendering is, as in the Revised Version, \"My hand was stretched out,\" etc., instead of, as in the Authorized Version, \"My sore ran in the night,\" etc.<br><br>The right hand denoted the south, and the left the north (<a href=\"#\" onClick=\"return mV('Job',23,9);\">Job 23:9</a>; <a href=\"#\" onClick=\"return mV('1Sa',23,19);\">1Sa 23:19</a>). To give the right hand was a pledge of fidelity (<a href=\"#\" onClick=\"return mV('2Ki',10,15);\">2Ki 10:15</a>; <a href=\"#\" onClick=\"return mV('Ezr',10,19);\">Ezr 10:19</a>); also of submission to the victors (<a href=\"#\" onClick=\"return mV('Eze',17,18);\">Eze 17:18</a>; <a href=\"#\" onClick=\"return mV('Jer',50,15);\">Jer 50:15</a>). The right hand was lifted up in taking an oath (<a href=\"#\" onClick=\"return mV('Gen',14,22);\">Gen 14:22</a>, etc.). The hand is frequently mentioned, particularly the right hand, as a symbol of power and strength (<a href=\"#\" onClick=\"return mV('Psa',60,5);\">Psa 60:5</a>; <a href=\"#\" onClick=\"return mV('Isa',28,2);\">Isa 28:2</a>). To kiss the hand is an act of homage (<a href=\"#\" onClick=\"return mV('1Ki',19,18);\">1Ki 19:18</a>; <a href=\"#\" onClick=\"return mV('Job',31,27);\">Job 31:27</a>), and to pour water on one's hands is to serve him (<a href=\"#\" onClick=\"return mV('2Ki',3,11);\">2Ki 3:11</a>). The hand of God is the symbol of his power; its being upon one denotes favour (<a href=\"#\" onClick=\"return mV('Ezr',7,6,28);\">Ezr 7:6, 28</a>; <a href=\"#\" onClick=\"return mV('Isa',1,25);\">Isa 1:25</a>; <a href=\"#\" onClick=\"return mV('Luk',1,66);\">Luk 1:66</a>, etc.) or punishment (<a href=\"#\" onClick=\"return mV('Exd',9,3);\">Exd 9:3</a>; <a href=\"#\" onClick=\"return mV('Jdg',2,15);\">Jdg 2:15</a>; <a href=\"#\" onClick=\"return mV('Act',13,11);\">Act 13:11</a>, etc.). A position at the right hand was regarded as the chief place of honour and power (<a href=\"#\" onClick=\"return mV('Psa',45,9);\">Psa 45:9</a>; <a href=\"#\" onClick=\"return mV('Psa',80,17);\">80:17</a>; <a href=\"#\" onClick=\"return mV('Psa',110,1);\">110:1</a>; <a href=\"#\" onClick=\"return mV('Mat',26,64);\">Mat 26:64</a>).";
eastonArray["$$T0001624"] = "<strong>Handbreadth:</strong> a measure of four fingers, equal to about four inches (<a href=\"#\" onClick=\"return mV('Exd',25,25);\">Exd 25:25</a>; <a href=\"#\" onClick=\"return mV('Exd',37,12);\">37:12</a>; <a href=\"#\" onClick=\"return mV('Psa',39,5);\">Psa 39:5</a>, etc.).";
eastonArray["$$T0001625"] = "<strong>Handkerchief:</strong> Only once in Authorized Version (<a href=\"#\" onClick=\"return mV('Act',19,12);\">Act 19:12</a>). The Greek word (sudarion) so rendered means properly \"a sweat-cloth.\" It is rendered \"napkin\" in <a href=\"#\" onClick=\"return mV('Jhn',11,44);\">Jhn 11:44</a>; <a href=\"#\" onClick=\"return mV('Jhn',20,7);\">20:7</a>; <a href=\"#\" onClick=\"return mV('Luk',19,20);\">Luk 19:20</a>.";
eastonArray["$$T0001626"] = "<strong>Handmaid:</strong> servant (<a href=\"#\" onClick=\"return mV('Gen',16,1);\">Gen 16:1</a>; <a href=\"#\" onClick=\"return mV('Rth',3,9);\">Rth 3:9</a>; <a href=\"#\" onClick=\"return mV('Luk',1,48);\">Luk 1:48</a>). It is probable that Hagar was Sarah's personal attendant while she was in the house of Pharaoh, and was among those maid-servants whom Abram had brought from Egypt.";
eastonArray["$$T0001627"] = "<strong>Handwriting:</strong> (<a href=\"#\" onClick=\"return mV('Col',2,14);\">Col 2:14</a>). The \"blotting out the handwriting\" is the removal by the grace of the gospel of the condemnation of the law which we had broken.";
eastonArray["$$T0001628"] = "<strong>Hanes:</strong> a place in Egypt mentioned only in <a href=\"#\" onClick=\"return mV('Isa',30,4);\">Isa 30:4</a> in connection with a reproof given to the Jews for trusting in Egypt. It was considered the same as Tahpanhes, a fortified town on the eastern frontier, but has been also identified as Ahnas-el-Medeeneh, 70 miles from Cairo.";
eastonArray["$$T0001629"] = "<strong>Hanging:</strong> (as a punishment), a mark of infamy inflicted on the dead bodies of criminals (<a href=\"#\" onClick=\"return mV('Deu',21,23);\">Deu 21:23</a>) rather than our modern mode of punishment. Criminals were first strangled and then hanged (<a href=\"#\" onClick=\"return mV('Num',25,4);\">Num 25:4</a>; <a href=\"#\" onClick=\"return mV('Deu',21,22);\">Deu 21:22</a>). (See <a href=\"#\" onClick=\"return mV('2Sa',21,6);\">2Sa 21:6</a> for the practice of the Gibeonites.)<br><br>Hanging (as a curtain).<br><br>(1.) Heb. masak, (a) before the entrance to the court of the tabernacle (<a href=\"#\" onClick=\"return mV('Exd',35,17);\">Exd 35:17</a>);<br><br>(b) before the door of the tabernacle (<a href=\"#\" onClick=\"return mV('Exd',26,36,37);\">26:36-37</a>);<br><br>(c) before the entrance to the most holy place, called \"the veil of the covering\" (<a href=\"#\" onClick=\"return mV('Exd',35,12);\">35:12</a>; <a href=\"#\" onClick=\"return mV('Exd',39,34);\">39:34</a>), as the word properly means.<br><br>(2.) Heb. kelaim, tapestry covering the walls of the tabernacle (<a href=\"#\" onClick=\"return mV('Exd',27,9);\">Exd 27:9</a>; <a href=\"#\" onClick=\"return mV('Exd',35,17);\">35:17</a>; <a href=\"#\" onClick=\"return mV('Num',3,26);\">Num 3:26</a>) to the half of the height of the wall (<a href=\"#\" onClick=\"return mV('Exd',27,18);\">Exd 27:18</a>; <a href=\"#\" onClick=\"return mV('Exd',26,16);\">Exd 26:16</a>). These hangings were fastened to pillars.<br><br>(3.) Heb. bottim (<a href=\"#\" onClick=\"return mV('2Ki',23,7);\">2Ki 23:7</a>), \"hangings for the grove\" (R.V., \"for the Asherah\"); marg., instead of \"hangings,\" has \"tents\" or \"houses.\" Such curtained structures for idolatrous worship are also alluded to in <a href=\"#\" onClick=\"return mV('Eze',16,16);\">Eze 16:16</a>.";
eastonArray["$$T0001630"] = "<strong>Hannah:</strong> favour, grace, one of the wives of Elkanah the Levite, and the mother of Samuel (to in <a href=\"#\" onClick=\"return mV('1Sa',1,'1-')\">1Sa '1-'</a>; <a href=\"#\" onClick=\"return mV('1Sa',2,'1-')\">2</a>). Her home was at Ramathaim-zophim, whence she was wont every year to go to Shiloh, where the tabernacle had been pitched by Joshua, to attend the offering of sacrifices there according to the law (<a href=\"#\" onClick=\"return mV('Exd',23,15);\">Exd 23:15</a>; <a href=\"#\" onClick=\"return mV('Exd',34,18);\">34:18</a>; <a href=\"#\" onClick=\"return mV('Deu',16,16);\">Deu 16:16</a>), probably at the feast of the Passover (<a href=\"#\" onClick=\"return mV('Exd',13,10);\">Exd 13:10</a>). On occasion of one of these \"yearly\" visits, being grieved by reason of Peninnah's conduct toward her, she went forth alone, and kneeling before the Lord at the sanctuary she prayed inaudibly. Eli the high priest, who sat at the entrance to the holy place, observed her, and misunderstanding her character he harshly condemned her conduct (<a href=\"#\" onClick=\"return mV('1Sa',1,'14-16');\">1Sa 1:14-16</a>). After hearing her explanation he retracted his injurious charge and said to her, \"Go in peace: and the God of Israel grant thee thy petition.\" Perhaps the story of the wife of Manoah was not unknown to her. Thereafter Elkanah and his family retired to their quiet home, and there, before another Passover, Hannah gave birth to a son, whom, in grateful memory of the Lord's goodness, she called Samuel, i.e., \"heard of God.\" After the child was weaned (probably in his third year) she brought him to Shiloh into the house of the Lord, and said to Eli the aged priest, \"Oh my lord, I am the woman that stood by thee here, praying unto the Lord. For this child I prayed; and the Lord hath given me my petition which I asked of him: therefore I also have granted him to the Lord; as long as he liveth he is granted to the Lord\" (<a href=\"#\" onClick=\"return mV('1Sa',1,27,28);\">1Sa 1:27-28</a>, R.V.). Her gladness of heart then found vent in that remarkable prophetic song (<a href=\"#\" onClick=\"return mV('1Sa',2,'1-10');\">2:1-10</a>; <a href=\"#\" onClick=\"return mV('Luk',1,'46-55');\">Luk 1:46-55</a>) which contains the first designation of the Messiah under that name (<a href=\"#\" onClick=\"return mV('1Sa',2,10);\">1Sa 2:10</a>, \"Annointed\" = \"Messiah\"). And so Samuel and his parents parted. He was left at Shiloh to minister \"before the Lord.\" And each year, when they came up to Shiloh, Hannah brought to her absent child \"a little coat\" (<a href=\"#\" onClick=\"return mV('Exd',28,31);\">Exd 28:31</a>), a priestly robe, a long upper tunic (<a href=\"#\" onClick=\"return mV('1Ch',15,27);\">1Ch 15:27</a>), in which to minister in the tabernacle (<a href=\"#\" onClick=\"return mV('1Sa',2,19);\">1Sa 2:19</a>; <a href=\"#\" onClick=\"return mV('1Sa',15,27);\">15:27</a>; <a href=\"#\" onClick=\"return mV('Job',2,12);\">Job 2:12</a>). \"And the child Samuel grew before the Lord.\" After Samuel, Hannah had three sons and two daughters.";
eastonArray["$$T0001631"] = "<strong>Hanniel:</strong> grace of God.<br><br>(1.) A chief of the tribe of Manasseh (<a href=\"#\" onClick=\"return mV('Num',34,23);\">Num 34:23</a>).<br><br>(2.) A chief of the tribe of Asher (<a href=\"#\" onClick=\"return mV('1Ch',7,39);\">1Ch 7:39</a>).";
eastonArray["$$T0001632"] = "<strong>Hanun:</strong> graciously given..<br><br>(1.) The son and successor of Nahash, king of Moab. David's messengers, sent on an embassy of condolence to him to Rabbah Ammon, his capital, were so grossly insulted that he proclaimed war against Hanun. David's army, under the command of Joab, forthwith crossed the Jordan, and gained a complete victory over the Moabites and their allies (<a href=\"#\" onClick=\"return mV('2Sa',10,'1-14');\">2Sa 10:1-14</a>) at Medeba (q.v.).<br><br>(2.) <a href=\"#\" onClick=\"return mV('Neh',3,13);\">Neh 3:13</a>.<br><br>(<a href=\"#\" onClick=\"return mV('Neh',3,13);\">Neh 3:30</a>).";
eastonArray["$$T0001633"] = "<strong>Hara:</strong> mountainous land, a province of Assyria (<a href=\"#\" onClick=\"return mV('1Ch',5,26);\">1Ch 5:26</a>), between the Tigris and the Euphrates, along the banks of the Khabur, to which some of the Israelite captives were carried. It has not been identified. Some think the word a variation of Haran.";
eastonArray["$$T0001634"] = "<strong>Haradah:</strong> fright; fear, the twenty-fifth station of the Israelites in their wanderings (<a href=\"#\" onClick=\"return mV('Num',33,24);\">Num 33:24</a>).";
eastonArray["$$T0001635"] = "<strong>Haran:</strong><br><br>(1.) Heb. haran; i.e., \"mountaineer.\" The eldest son of Terah, brother of Abraham and Nahor, and father of Lot, Milcah, and Iscah. He died before his father (<a href=\"#\" onClick=\"return mV('Gen',11,27);\">Gen 11:27</a>), in Ur of the Chaldees.<br><br>(2.) Heb. haran, i.e., \"parched;\" or probably from the Accadian charana, meaning \"a road.\" A celebrated city of Western Asia, now Harran, where Abram remained, after he left Ur of the Chaldees, till his father Terah died (<a href=\"#\" onClick=\"return mV('Gen',11,31,32);\">Gen 11:31-32</a>), when he continued his journey into the land of Canaan. It is called \"Charran\" in the LXX. and in <a href=\"#\" onClick=\"return mV('Act',7,2);\">Act 7:2</a>. It is called the \"city of Nahor\" (<a href=\"#\" onClick=\"return mV('Gen',24,10);\">Gen 24:10</a>), and Jacob resided here with Laban (<a href=\"#\" onClick=\"return mV('Gen',30,43);\">30:43</a>). It stood on the river Belik, an affluent of the Euphrates, about 70 miles above where it joins that river in Upper Mesopotamia or Padan-aram, and about 600 miles northwest of Ur in a direct line. It was on the caravan route between the east and west. It is afterwards mentioned among the towns taken by the king of Assyria (<a href=\"#\" onClick=\"return mV('2Ki',19,12);\">2Ki 19:12</a>; <a href=\"#\" onClick=\"return mV('Isa',37,12);\">Isa 37:12</a>). It was known to the Greeks and Romans under the name Carrhae.<br><br>(3.) The son of Caleb of Judah (<a href=\"#\" onClick=\"return mV('1Ch',2,46);\">1Ch 2:46</a>) by his concubine Ephah.";
eastonArray["$$T0001636"] = "<strong>Harbona:</strong> (a Persian word meaning \"ass-driver\"), one of the seven eunuchs or chamberlains of king Ahasuerus (<a href=\"#\" onClick=\"return mV('Est',1,10);\">Est 1:10</a>; <a href=\"#\" onClick=\"return mV('Est',7,9);\">7:9</a>).";
eastonArray["$$T0001637"] = "<strong>Hare:</strong> (Heb. 'arnebeth) was prohibited as food according to the Mosaic law (<a href=\"#\" onClick=\"return mV('Lev',11,6);\">Lev 11:6</a>; <a href=\"#\" onClick=\"return mV('Deu',14,7);\">Deu 14:7</a>), \"because he cheweth the cud, but divideth not the hoof.\" The habit of this animal is to grind its teeth and move its jaw as if it actually chewed the cud. But, like the cony (q.v.), it is not a ruminant with four stomachs, but a rodent like the squirrel, rat, etc. Moses speaks of it according to appearance. It is interdicted because, though apparently chewing the cud, it did not divide the hoof.<br><br>There are two species in Syria,<br><br>(1) the <i>Lepus Syriacus</i> or Syrian hare, which is like the English hare; and<br><br>(2) the <i>Lepus Sinaiticus</i>, or hare of the desert. No rabbits are found in Syria.";
eastonArray["$$T0001638"] = "<strong>Hareth:</strong> thicket, a wood in the mountains of Judah where David hid when pursued by Saul (<a href=\"#\" onClick=\"return mV('1Sa',22,5);\">1Sa 22:5</a>). It was possibly while he was here that the memorable incident narrated in <a href=\"#\" onClick=\"return mV('2Sa',23,'14-47');\">2Sa 23:14-17</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,'16-19');\">1Ch 11:16-19</a> occurred. This place has not been identified, but perhaps it may be the modern Kharas, on the borders of the chain of mountains some 3 miles east of Keilah.";
eastonArray["$$T0001639"] = "<strong>Harhaiah:</strong> zeal of Jehovah, (<a href=\"#\" onClick=\"return mV('Neh',3,8);\">Neh 3:8</a>) \"of the goldsmiths,\" one whose son helped to repair the wall of Jerusalem.";
eastonArray["$$T0001640"] = "<strong>Harhur:</strong> fever, one of the Nethinim (<a href=\"#\" onClick=\"return mV('Ezr',2,51);\">Ezr 2:51</a>).";
eastonArray["$$T0001641"] = "<strong>Harim:</strong> flat-nosed.<br><br>(1.) The head of the second course of priests (<a href=\"#\" onClick=\"return mV('1Ch',24,8);\">1Ch 24:8</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('Ezr',2,32,39);\">Ezr 2:32, 39</a>; <a href=\"#\" onClick=\"return mV('Neh',7,35,42);\">Neh 7:35, 42</a>.<br><br>(3.) <a href=\"#\" onClick=\"return mV('Neh',3,11);\">Neh 3:11</a>.<br><br>(4.) <a href=\"#\" onClick=\"return mV('Neh',12,3);\">Neh 12:3</a>.<br><br>(5.) <a href=\"#\" onClick=\"return mV('Neh',10,5);\">Neh 10:5</a>";
eastonArray["$$T0001642"] = "<strong>Hariph:</strong> autumnal rain.<br><br>(1.) <a href=\"#\" onClick=\"return mV('Neh',7,24);\">Neh 7:24</a>.<br><br>(2.) <a href=\"#\" onClick=\"return mV('Neh',10,19);\">Neh 10:19</a>.";
eastonArray["$$T0001643"] = "<strong>Harlot:</strong><br><br>(1.) Heb. zonah (<a href=\"#\" onClick=\"return mV('Gen',34,31);\">Gen 34:31</a>; <a href=\"#\" onClick=\"return mV('Gen',38,15);\">38:15</a>). In verses <a href=\"#\" onClick=\"return mV('Gen',38,21,22);\">21-22</a> the Hebrew word used in <i>kedeshah</i>, i.e., a woman consecrated or devoted to prostitution in connection with the abominable worship of Asherah or Astarte, the Syrian Venus. This word is also used in <a href=\"#\" onClick=\"return mV('Deu',23,17);\">Deu 23:17</a>; <a href=\"#\" onClick=\"return mV('Hsa',4,14);\">Hsa 4:14</a>. Thus Tamar sat by the wayside as a consecrated kedeshah.<br><br>It has been attempted to show that Rahab, usually called a \"harlot\" (<a href=\"#\" onClick=\"return mV('Jos',2,1);\">Jos 2:1</a>; <a href=\"#\" onClick=\"return mV('Jos',6,17);\">6:17</a>; <a href=\"#\" onClick=\"return mV('Hbr',11,31);\">Hbr 11:31</a>; <a href=\"#\" onClick=\"return mV('Jam',2,25);\">Jam 2:25</a>), was only an innkeeper. This interpretation, however, cannot be maintained.<br><br>Jephthah's mother is called a \"strange woman\" (<a href=\"#\" onClick=\"return mV('Jdg',11,2);\">Jdg 11:2</a>). This, however, merely denotes that she was of foreign extraction.<br><br>In the time of Solomon harlots appeared openly in the streets, and he solemnly warns against association with them (<a href=\"#\" onClick=\"return mV('Pro',7,12);\">Pro 7:12</a>; See also <a href=\"#\" onClick=\"return mV('Jer',3,2);\">Jer 3:2</a>; <a href=\"#\" onClick=\"return mV('Eze',16,24,25,31);\">Eze 16:24-25, 31</a>). The Revised Version, following the LXX., has \"and the harlots washed,\" etc., instead of the rendering of the Authorized Version, \"now they washed,\" of <a href=\"#\" onClick=\"return mV('1Ki',22,38);\">1Ki 22:38</a>.<br><br>To commit fornication is metaphorically used for to practice idolatry (<a href=\"#\" onClick=\"return mV('Jer',3,1);\">Jer 3:1</a>; <a href=\"#\" onClick=\"return mV('Eze',16,15);\">Eze 16:15</a>; Hos. throughout); hence Jerusalem is spoken of as a harlot (<a href=\"#\" onClick=\"return mV('Isa',1,21);\">Isa 1:21</a>).<br><br>(2.) Heb. nokriyah, the \"strange woman\" (<a href=\"#\" onClick=\"return mV('1Ki',11,1);\">1Ki 11:1</a>; <a href=\"#\" onClick=\"return mV('Pro',5,20);\">Pro 5:20</a>; <a href=\"#\" onClick=\"return mV('Pro',7,5);\">7:5</a>; <a href=\"#\" onClick=\"return mV('Pro',23,27);\">23:27</a>). Those so designated were Canaanites and other Gentiles (<a href=\"#\" onClick=\"return mV('Jos',23,13);\">Jos 23:13</a>). To the same class belonged the \"foolish\", i.e., the sinful, \"woman.\"<br><br>In the New Testament the Greek pornai, plural, \"harlots,\" occurs in <a href=\"#\" onClick=\"return mV('Mat',21,31,32);\">Mat 21:31-32</a>, where they are classed with publicans; <a href=\"#\" onClick=\"return mV('Luk',15,30);\">Luk 15:30</a>; <a href=\"#\" onClick=\"return mV('1Cr',6,15,16);\">1Cr 6:15-16</a>; <a href=\"#\" onClick=\"return mV('Hbr',11,31);\">Hbr 11:31</a>; <a href=\"#\" onClick=\"return mV('Jam',2,25);\">Jam 2:25</a>. It is used symbolically in <a href=\"#\" onClick=\"return mV('Rev',17,1,5,15,16);\">Rev 17:1, 5, 15-16</a>; <a href=\"#\" onClick=\"return mV('Rev',19,2);\">19:2</a>.";
eastonArray["$$T0001644"] = "<strong>Harnepher:</strong> a chief of the tribe of Asher (<a href=\"#\" onClick=\"return mV('1Ch',7,36);\">1Ch 7:36</a>).";
eastonArray["$$T0001645"] = "<strong>Harness:</strong><br><br>(1.) Heb. 'asar, \"to bind;\" hence the act of fastening animals to a cart (<a href=\"#\" onClick=\"return mV('1Sa',6,7,10);\">1Sa 6:7, 10</a>; <a href=\"#\" onClick=\"return mV('Jer',46,4);\">Jer 46:4</a>, etc.).<br><br>(2.) An Old English word for \"armour;\" Heb. neshek (<a href=\"#\" onClick=\"return mV('2Ch',9,24);\">2Ch 9:24</a>).<br><br>(3.) Heb. shiryan, a coat of mail (<a href=\"#\" onClick=\"return mV('1Ki',22,34);\">1Ki 22:34</a>; <a href=\"#\" onClick=\"return mV('2Ch',18,33);\">2Ch 18:33</a>; in <a href=\"#\" onClick=\"return mV('Isa',59,17);\">Isa 59:17</a>).<br><br>(4.) The children of Israel passed out of Egypt \"harnessed\" (<a href=\"#\" onClick=\"return mV('Exd',13,18);\">Exd 13:18</a>), i.e., in an orderly manner, and as if to meet a foe. The word so rendered is probably a derivative from Hebrew <i>hamesh</i> (i.e., \"five\"), and may denote that they went up in five divisions, viz., the van, centre, two wings, and rear-guard.";
eastonArray["$$T0001646"] = "<strong>Harod:</strong> palpitation, a fountain near which Gideon and his army encamped on the morning of the day when they encountered and routed the Midianites (<a href=\"#\" onClick=\"return mV('Jdg',7,'1-')\">Jdg 7</a>). It was south of the hill Moreh. The present 'Ain Jalud (\"Goliath's Fountain\"), south of Jezreel and nearly opposite Shunem, is probably the fountain here referred to (<a href=\"#\" onClick=\"return mV('Jdg',7,4,5);\">7:4-5</a>).";
eastonArray["$$T0001647"] = "<strong>Harodite:</strong> an epithet applied to two of David's heroes (<a href=\"#\" onClick=\"return mV('2Sa',23,25);\">2Sa 23:25</a>). (<a href=\"#\" onClick=\"return mV('1Ch',11,27);\">1Ch 11:27</a>.)";
eastonArray["$$T0001648"] = "<strong>Harosheth of the Gentiles:</strong> (<a href=\"#\" onClick=\"return mV('Jdg',4,2);\">Jdg 4:2</a>) or nations, a city near Hazor in Galilee of the Gentiles, or Upper Galilee, in the north of Palestine. It was here that Jabin's great army was marshalled before it went forth into the great battlefield of Esdraelon to encounter the army of Israel, by which it was routed and put to flight (<a href=\"#\" onClick=\"return mV('Jdg',4,'1-')\">Jdg 4</a>). It was situated \"at the entrance of the pass to Esdraelon from the plain of Acre\" at the base of Carmel. The name in the Hebrew is <i>Harosheth ha Gojim</i>, i.e., \"the smithy of the nations;\" probably, as is supposed, so called because here Jabin's iron war-chariots, armed with scythes, were made. It is identified with el-Harithiyeh.";
eastonArray["$$T0001649"] = "<strong>Harp:</strong> (Heb. kinnor), the national instrument of the Hebrews. It was invented by Jubal (<a href=\"#\" onClick=\"return mV('Gen',4,21);\">Gen 4:21</a>). Some think the word <i>kinnor</i> denotes the whole class of stringed instruments. It was used as an accompaniment to songs of cheerfulness as well as of praise to God (<a href=\"#\" onClick=\"return mV('Gen',31,27);\">Gen 31:27</a>; <a href=\"#\" onClick=\"return mV('1Sa',16,23);\">1Sa 16:23</a>; <a href=\"#\" onClick=\"return mV('2Ch',20,28);\">2Ch 20:28</a>; <a href=\"#\" onClick=\"return mV('Psa',33,2);\">Psa 33:2</a>; <a href=\"#\" onClick=\"return mV('Psa',137,2);\">137:2</a>).<br><br>In Solomon's time harps were made of almug-trees (<a href=\"#\" onClick=\"return mV('1Ki',10,11,12);\">1Ki 10:11-12</a>). In <a href=\"#\" onClick=\"return mV('1Ch',15,21);\">1Ch 15:21</a> mention is made of \"harps on the Sheminith;\" Revised Version, \"harps set to the Sheminith;\" better perhaps \"harps of eight strings.\" The soothing effect of the music of the harp is referred to <a href=\"#\" onClick=\"return mV('1Sa',16,16,23);\">1Sa 16:16, 23</a>; <a href=\"#\" onClick=\"return mV('1Sa',18,10);\">18:10</a>; <a href=\"#\" onClick=\"return mV('1Sa',19,9);\">19:9</a>. The church in heaven is represented as celebrating the triumphs of the Redeemer \"harping with their harps\" (<a href=\"#\" onClick=\"return mV('Rev',14,2);\">Rev 14:2</a>).";
</script>
