<script>var eastonArray = new Array ();
eastonArray["$$T0002650"] = "<strong>Nahallal:</strong> pasture, a city in Zebulun on the border of Issachar (<a href=\"#\" onClick=\"return mV('Jos',19,15);\">Jos 19:15</a>), the same as Nahalol (<a href=\"#\" onClick=\"return mV('Jdg',1,30);\">Jdg 1:30</a>). It was given to the Levites. It has been by some identified with Malul in the plain of Esdraelon, 4 miles from Nazareth.";
eastonArray["$$T0002651"] = "<strong>Naharai:</strong> snorer, a Berothite, one of David's heroes, and armour-bearer of Joab (<a href=\"#\" onClick=\"return mV('1Ch',11,39);\">1Ch 11:39</a>).";
eastonArray["$$T0002652"] = "<strong>Nahash:</strong> serpent.<br><br>(1.) King of the Ammonites in the time of Saul. The inhabitants of Jabesh-Gilead having been exposed to great danger from Nahash, sent messengers to Gibeah to inform Saul of their extremity. He promptly responded to the call, and gathering together an army he marched against Nahash. \"And it came to pass that they which remained were scattered, so that two of them [the Ammonites] were not left together\" (<a href=\"#\" onClick=\"return mV('1Sa',11,'1-11');\">1Sa 11:1-11</a>).<br><br>(2.) Another king of the Ammonites of the same name is mentioned, who showed kindness to David during his wanderings (<a href=\"#\" onClick=\"return mV('2Sa',10,2);\">2Sa 10:2</a>). On his death David sent an embassy of sympathy to Hanun, his son and successor, at Rabbah Ammon, his capital. The grievous insult which was put upon these ambassadors led to a war against the Ammonites, who, with their allies the Syrians, were completely routed in a battle fought at \"the entering in of the gate,\" probably of Medeba (<a href=\"#\" onClick=\"return mV('2Sa',10,'6-14');\">2Sa 10:6-14</a>). Again Hadarezer rallied the Syrian host, which was totally destroyed by the Israelite army under Joab in a decisive battle fought at Helam (<a href=\"#\" onClick=\"return mV('2Sa',10,17);\">2Sa 10:17</a>), near to Hamath (<a href=\"#\" onClick=\"return mV('1Ch',18,3);\">1Ch 18:3</a>). \"So the Syrians feared to help the children of Ammon any more\" (<a href=\"#\" onClick=\"return mV('2Sa',10,19);\">2Sa 10:19</a>).<br><br>(3.) The father of Amasa, who was commander-in-chief of Abasolom's army (<a href=\"#\" onClick=\"return mV('2Sa',17,25);\">2Sa 17:25</a>). Jesse's wife had apparently been first married to this man, to whom she bore Abigail and Zeruiah, who were thus David's sisters, but only on the mother's side (<a href=\"#\" onClick=\"return mV('1Ch',2,16);\">1Ch 2:16</a>).";
eastonArray["$$T0002653"] = "<strong>Nahath:</strong> rest.<br><br>(1.) One of the four sons of Reuel, the son of Esau (<a href=\"#\" onClick=\"return mV('Gen',36,13,17);\">Gen 36:13, 17</a>).<br><br>(2.) A Kohathite Levite (<a href=\"#\" onClick=\"return mV('1Ch',6,26);\">1Ch 6:26</a>).<br><br>(3.) A Levite, one of the overseers of the sacred offerings of the temple (<a href=\"#\" onClick=\"return mV('2Ch',31,13);\">2Ch 31:13</a>).";
eastonArray["$$T0002654"] = "<strong>Nahbi:</strong> hidden, one of the twelve spies sent out to explore the land of Canaan (<a href=\"#\" onClick=\"return mV('Num',13,14);\">Num 13:14</a>).";
eastonArray["$$T0002655"] = "<strong>Nahor:</strong> snorting.<br><br>(1.) The father of Terah, who was the father of Abraham (<a href=\"#\" onClick=\"return mV('Gen',11,'22-25');\">Gen 11:22-25</a>; <a href=\"#\" onClick=\"return mV('Luk',3,34);\">Luk 3:34</a>).<br><br>(2.) A son of Terah, and elder brother of Abraham (<a href=\"#\" onClick=\"return mV('Gen',11,26,27);\">Gen 11:26-27</a>; <a href=\"#\" onClick=\"return mV('Jos',24,2);\">Jos 24:2</a>, R.V.). He married Milcah, the daughter of his brother Haran, and remained in the land of his nativity on the east of the river Euphrates at Haran (<a href=\"#\" onClick=\"return mV('Gen',11,'27-32');\">Gen 11:27-32</a>). A correspondence was maintained between the family of Abraham in Canaan and the relatives in the old ancestral home at Haran till the time of Jacob. When Jacob fled from Haran all intercourse between the two branches of the family came to an end (<a href=\"#\" onClick=\"return mV('Gen',31,55);\">Gen 31:55</a>). His grand-daughter Rebekah became Isaac's wife (<a href=\"#\" onClick=\"return mV('Gen',24,67);\">24:67</a>).";
eastonArray["$$T0002656"] = "<strong>Nahshon:</strong> sorcerer, the son of Aminadab, and prince of the children of Judah at the time of the first numbering of the tribes in the wilderness (<a href=\"#\" onClick=\"return mV('Exd',6,23);\">Exd 6:23</a>). His sister Elisheba was the wife of Aaron. He died in the wilderness (<a href=\"#\" onClick=\"return mV('Num',26,64,65);\">Num 26:64-65</a>). His name occurs in the Greek form Naasson in the genealogy of Christ (<a href=\"#\" onClick=\"return mV('Num',1,4);\">1:4</a>; <a href=\"#\" onClick=\"return mV('Luk',3,32);\">Luk 3:32</a>).";
eastonArray["$$T0002657"] = "<strong>Nahum:</strong> consolation, the seventh of the so-called minor prophets, an Elkoshite. All we know of him is recorded in the book of his prophecies. He was probably a native of Galilee, and after the deportation of the ten tribes took up his residence in Jerusalem. Others think that Elkosh was the name of a place on the east bank of the Tigris, and that Nahum dwelt there.";
eastonArray["$$T0002658"] = "<strong>Nahum, Book of:</strong> Nahum prophesied, according to some, in the beginning of the reign of Ahaz (B.C. 743). Others, however, think that his prophecies are to be referred to the latter half of the reign of Hezekiah (about B.C. 709). This is the more probable opinion, internal evidences leading to that conclusion. Probably the book was written in Jerusalem (soon after B.C. 709), where he witnessed the invasion of Sennacherib and the destruction of his host (<a href=\"#\" onClick=\"return mV('2Ki',19,35);\">2Ki 19:35</a>).<br><br>The subject of this prophecy is the approaching complete and final destruction of Nineveh, the capital of the great and at that time flourishing Assyrian empire. Assur-bani-pal was at the height of his glory. Nineveh was a city of vast extent, and was then the centre of the civilzation and commerce of the world, a \"bloody city all full of lies and robbery\" (<a href=\"#\" onClick=\"return mV('Nah',3,1);\">Nah 3:1</a>), for it had robbed and plundered all the neighbouring nations. It was strongly fortified on every side, bidding defiance to every enemy; yet it was to be utterly destroyed as a punishment for the great wickedness of its inhabitants.<br><br>Jonah had already uttered his message of warning, and Nahum was followed by Zephaniah, who also predicted (<a href=\"#\" onClick=\"return mV('Zep',2,'4-15');\">Zep 2:4-15</a>) the destruction of the city, predictions which were remarkably fulfilled (B.C. 625) when Nineveh was destroyed apparently by fire, and the Assyrian empire came to an end, an event which changed the face of Asia. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002735');\">NINEVEH</a>.)";
eastonArray["$$T0002659"] = "<strong>Nail:</strong> for fastening.<br><br>(1.) Hebrew yathed, \"piercing,\" a peg or nail of any material (<a href=\"#\" onClick=\"return mV('Eze',15,3);\">Eze 15:3</a>), more especially a tent-peg (<a href=\"#\" onClick=\"return mV('Exd',27,19);\">Exd 27:19</a>; <a href=\"#\" onClick=\"return mV('Exd',35,18);\">35:18</a>; <a href=\"#\" onClick=\"return mV('Exd',38,20);\">38:20</a>), with one of which Jael (q.v.) pierced the temples of Sisera (<a href=\"#\" onClick=\"return mV('Jdg',4,21,22);\">Jdg 4:21-22</a>). This word is also used metaphorically (<a href=\"#\" onClick=\"return mV('Zec',10,4);\">Zec 10:4</a>) for a prince or counsellor, just as \"the battle-bow\" represents a warrior.<br><br>(2.) Masmer, a \"point,\" the usual word for a nail. The words of the wise are compared to \"nails fastened by the masters of assemblies\" (<a href=\"#\" onClick=\"return mV('Ecc',12,11);\">Ecc 12:11</a>, A.V.). The Revised Version reads, \"as nails well fastened are the words of the masters,\" etc. Others (as Plumptre) read, \"as nails fastened are the masters of assemblies\" (<a href=\"#\" onClick=\"return mV('Isa',22,23);\">Isa 22:23</a>; <a href=\"#\" onClick=\"return mV('Ezr',9,8);\">Ezr 9:8</a>). David prepared nails for the temple (<a href=\"#\" onClick=\"return mV('1Ch',22,3);\">1Ch 22:3</a>; <a href=\"#\" onClick=\"return mV('2Ch',3,9);\">2Ch 3:9</a>). The nails by which our Lord was fixed to the cross are mentioned (<a href=\"#\" onClick=\"return mV('Jhn',20,25);\">Jhn 20:25</a>; <a href=\"#\" onClick=\"return mV('Col',2,14);\">Col 2:14</a>).<br><br>Nail of the finger (Heb. tsipporen, \"scraping\"). To \"pare the nails\" is in <a href=\"#\" onClick=\"return mV('Deu',21,12);\">Deu 21:12</a> (marg., \"make,\" or \"dress,\" or \"suffer to grow\") one of the signs of purification, separation from former heathenism (<a href=\"#\" onClick=\"return mV('Lev',14,8);\">Lev 14:8</a>; <a href=\"#\" onClick=\"return mV('Num',8,7);\">Num 8:7</a>). In <a href=\"#\" onClick=\"return mV('Jer',17,1);\">Jer 17:1</a> this word is rendered \"point.\"";
eastonArray["$$T0002660"] = "<strong>Nain:</strong> (from Heb. nain, \"green pastures,\" \"lovely\"), the name of a town near the gate of which Jesus raised to life a widow's son (<a href=\"#\" onClick=\"return mV('Luk',7,'11-17');\">Luk 7:11-17</a>). It is identified with the village called Nein, standing on the north-western slope of Jebel ed-Duhy (=the \"hill Moreh\" = \"Little hermon\"), about 4 miles from Tabor and 25 southwest of Capernaum. At the foot of the slope on which it stands is the great plain of Esdraelon.<br><br>This was the first miracle of raising the dead our Lord had wrought, and it excited great awe and astonishment among the people.";
eastonArray["$$T0002661"] = "<strong>Naioth:</strong> dwellings, the name given to the prophetical college established by Samuel near Ramah. It consisted of a cluster of separate dwellings, and hence its name. David took refuge here when he fled from Saul (<a href=\"#\" onClick=\"return mV('1Sa',19,18,19,22,23);\">1Sa 19:18-19, 22-23</a>), and here he passed a few weeks in peace (comp. <a href=\"#\" onClick=\"return mV('Psa',11,'1-');\">Psa 11</a>). It was probably the common residence of the \"sons of the prophets.\"";
eastonArray["$$T0002662"] = "<strong>Naked:</strong> This word denotes<br><br>(1) absolute nakedness (<a href=\"#\" onClick=\"return mV('Gen',2,25);\">Gen 2:25</a>; <a href=\"#\" onClick=\"return mV('Job',1,21);\">Job 1:21</a>; <a href=\"#\" onClick=\"return mV('Ecc',5,15);\">Ecc 5:15</a>; <a href=\"#\" onClick=\"return mV('Mic',1,8);\">Mic 1:8</a>; <a href=\"#\" onClick=\"return mV('Amo',2,16);\">Amo 2:16</a>);<br><br>(2) being poorly clad (<a href=\"#\" onClick=\"return mV('Isa',58,7);\">Isa 58:7</a>; <a href=\"#\" onClick=\"return mV('Jam',2,15);\">Jam 2:15</a>). It denotes also<br><br>(3) the state of one who has laid aside his loose outer garment (Lat. nudus), and appears clothed only in a long tunic or under robe worn next the skin (<a href=\"#\" onClick=\"return mV('1Sa',19,24);\">1Sa 19:24</a>; <a href=\"#\" onClick=\"return mV('Isa',47,3);\">Isa 47:3</a>; <a href=\"#\" onClick=\"return mV('Mar',14,52);\">Mar 14:52</a>; <a href=\"#\" onClick=\"return mV('Jhn',21,7);\">Jhn 21:7</a>). It is used figuratively, meaning \"being discovered\" or \"made manifest\" (<a href=\"#\" onClick=\"return mV('Job',26,6);\">Job 26:6</a>; <a href=\"#\" onClick=\"return mV('Hbr',4,13);\">Hbr 4:13</a>). In <a href=\"#\" onClick=\"return mV('Exd',32,25);\">Exd 32:25</a> the expression \"the people were naked\" (A.V.) is more correctly rendered in the Revised Version \"the people were broken loose\", i.e., had fallen into a state of lawlessness and insubordination. In <a href=\"#\" onClick=\"return mV('2Ch',28,19);\">2Ch 28:19</a> the words \"he made Judah naked\" (A.V.), but Revised Version \"he had dealt wantonly in Judah,\" mean \"he had permitted Judah to break loose from all the restraints of religion.\"";
eastonArray["$$T0002663"] = "<strong>Naomi:</strong> the lovable; my delight, the wife of Elimelech, and mother of Mahlon and Chilion, and mother-in-law of Ruth (<a href=\"#\" onClick=\"return mV('Rth',1,2,20,21);\">Rth 1:2, 20-21</a>; <a href=\"#\" onClick=\"return mV('Rth',2,1);\">2:1</a>). Elimelech and his wife left the district of Bethlehem-Judah, and found a new home in the uplands of Moab. In course of time he died, as also his two sons Mahlon and Chilion, who had married women of Moab, and three widows were left mourning the loss of their husbands. Naomi longs to return now to her own land, to Bethlehem. One of her widowed daughters-in-law, Ruth, accompanies her, and is at length married to Boaz (q.v.).";
eastonArray["$$T0002664"] = "<strong>Naphish:</strong> refresher, one of the sons of Ishmael (<a href=\"#\" onClick=\"return mV('Gen',25,15);\">Gen 25:15</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,31);\">1Ch 1:31</a>). He was the father of an Arab tribe.";
eastonArray["$$T0002665"] = "<strong>Naphtali:</strong> my wrestling, the fifth [actually sixth - BLB] son of Jacob. His mother was Bilhah, Rachel's handmaid (<a href=\"#\" onClick=\"return mV('Gen',30,8);\">Gen 30:8</a>). When Jacob went down into Egypt, Naphtali had four sons (<a href=\"#\" onClick=\"return mV('Gen',46,24);\">Gen 46:24</a>). Little is known of him as an individual.";
eastonArray["$$T0002666"] = "<strong>Naphtali, Mount:</strong> the mountainous district of Naphtali (<a href=\"#\" onClick=\"return mV('Jos',20,7);\">Jos 20:7</a>).";
eastonArray["$$T0002667"] = "<strong>Naphtali, Tribe of:</strong> On this tribe Jacob pronounced the patriarchal blessing, \"Naphtali is a hind let loose: he giveth goodly words\" (<a href=\"#\" onClick=\"return mV('Gen',49,21);\">Gen 49:21</a>). It was intended thus to set forth under poetic imagery the future character and history of the tribe.<br><br>At the time of the Exodus this tribe numbered 53,400 adult males (<a href=\"#\" onClick=\"return mV('Num',1,43);\">Num 1:43</a>), but at the close of the wanderings they numbered only 45,400 (<a href=\"#\" onClick=\"return mV('Num',26,'48-50');\">26:48-50</a>). Along with Dan and Asher they formed \"the camp of Dan,\" under a common standard (<a href=\"#\" onClick=\"return mV('Num',2,'25-31');\">2:25-31</a>), occupying a place during the march on the north side of the tabernacle.<br><br>The possession assigned to this tribe is set forth in <a href=\"#\" onClick=\"return mV('Jos',19,'32-39');\">Jos 19:32-39</a>. It lay in the north-eastern corner of the land, bounded on the east by the Jordan and the lakes of Merom and Galilee, and on the north it extended far into Coele-Syria, the valley between the two Lebanon ranges. It comprehended a greater variety of rich and beautiful scenery and of soil and climate than fell to the lot of any other tribe. The territory of Naphtali extended to about 800 square miles, being the double of that of Issachar. The region around Kedesh, one of its towns, was originally called Galil, a name afterwards given to the whole northern division of Canaan. A large number of foreigners settled here among the mountains, and hence it was called \"Galilee of the Gentiles\" (q.v.), <a href=\"#\" onClick=\"return mV('Mat',4,15,16);\">Mat 4:15-16</a>. The southern portion of Naphtali has been called the \"Garden of Palestine.\" It was of unrivalled fertility. It was the principal scene of our Lord's public ministry. Here most of his parables were spoken and his miracles wrought.<br><br>This tribe was the first to suffer from the invasion of Benhadad, king of Syria, in the reigns of Baasha, king of Israel, and Asa, king of Judah (<a href=\"#\" onClick=\"return mV('1Ki',15,20);\">1Ki 15:20</a>; <a href=\"#\" onClick=\"return mV('2Ch',16,4);\">2Ch 16:4</a>). In the reign of Pekah, king of Israel, the Assyrians under Tiglath-pileser swept over the whole north of Israel, and carried the people into captivity (<a href=\"#\" onClick=\"return mV('2Ki',15,29);\">2Ki 15:29</a>). Thus the kingdom of Israel came to an end (B.C. 722).<br><br>Naphtali is now almost wholly a desert, the towns of Tiberias, on the shore of the Lake of Galilee, and Safed being the only places in it of any importance.";
eastonArray["$$T0002668"] = "<strong>Naphtuhim:</strong> a Hamitic tribe descended from Mizraim (<a href=\"#\" onClick=\"return mV('Gen',10,13);\">Gen 10:13</a>). Others identify this word with Napata, the name of the city and territory on the southern frontier of Mizraim, the modern Meroe, at the great bend of the Nile at Soudan. This city was the royal residence, it is said, of Queen Candace (<a href=\"#\" onClick=\"return mV('Act',8,27);\">Act 8:27</a>). Here there are extensive and splendid ruins.";
eastonArray["$$T0002669"] = "<strong>Napkin:</strong> (<a href=\"#\" onClick=\"return mV('Jhn',11,44);\">Jhn 11:44</a>; <a href=\"#\" onClick=\"return mV('Jhn',20,7);\">20:7</a>; Lat. sudarium, a \"sweat-cloth\"), a cloth for wiping the sweat from the face. But the word is used of a wrapper to fold money in (<a href=\"#\" onClick=\"return mV('Luk',19,20);\">Luk 19:20</a>), and as an article of dress, a \"handkerchief\" worn on the head (<a href=\"#\" onClick=\"return mV('Act',19,12);\">Act 19:12</a>).";
eastonArray["$$T0002670"] = "<strong>Narcissus:</strong> daffodil, a Roman whom Paul salutes (<a href=\"#\" onClick=\"return mV('Rom',16,11);\">Rom 16:11</a>). He is supposed to have been the private secretary of the emperor Claudius. This is, however, quite uncertain.";
eastonArray["$$T0002671"] = "<strong>Nathan:</strong> given.<br><br>(1.) A prophet in the reigns of David and Solomon (<a href=\"#\" onClick=\"return mV('2Ch',9,29);\">2Ch 9:29</a>). He is first spoken of in connection with the arrangements David made for the building of the temple (<a href=\"#\" onClick=\"return mV('2Sa',7,2,3,17);\">2Sa 7:2-3, 17</a>), and next appears as the reprover of David on account of his sin with Bathsheba (<a href=\"#\" onClick=\"return mV('2Sa',12,'1-14');\">12:1-14</a>). He was charged with the education of Solomon (<a href=\"#\" onClick=\"return mV('2Sa',12,25);\">12:25</a>), at whose inauguration to the throne he took a prominent part (<a href=\"#\" onClick=\"return mV('1Ki',1,8,10,11,'22-45');\">1Ki 1:8, 10-11, 22-45</a>). His two sons, Zabad (<a href=\"#\" onClick=\"return mV('1Ch',2,36);\">1Ch 2:36</a>) and Azariah (<a href=\"#\" onClick=\"return mV('1Ki',4,5);\">1Ki 4:5</a>) occupied places of honour at the king's court. He last appears in assisting David in reorganizing the public worship (<a href=\"#\" onClick=\"return mV('2Ch',29,25);\">2Ch 29:25</a>). He seems to have written a life of David, and also a life of Solomon (<a href=\"#\" onClick=\"return mV('1Ch',29,29);\">1Ch 29:29</a>; <a href=\"#\" onClick=\"return mV('2Ch',9,29);\">2Ch 9:29</a>).<br><br>(2.) A son of David, by Bathsheba (<a href=\"#\" onClick=\"return mV('2Sa',5,14);\">2Sa 5:14</a>), whose name appears in the genealogy of Mary, the mother of our Lord (<a href=\"#\" onClick=\"return mV('Luk',3,31);\">Luk 3:31</a>).<br><br>(3.) <a href=\"#\" onClick=\"return mV('Ezr',8,16);\">Ezr 8:16</a>.";
eastonArray["$$T0002672"] = "<strong>Nathanael:</strong> given or gift of God, one of our Lord's disciples, \"of Cana in Galilee\" (<a href=\"#\" onClick=\"return mV('Jhn',21,2);\">Jhn 21:2</a>). He was \"an Israelite indeed, in whom was no guile\" (<a href=\"#\" onClick=\"return mV('Jhn',1,47,48);\">1:47-48</a>). His name occurs only in the Gospel of John, who in his list of the disciples never mentions Bartholomew, with whom he has consequently been identified. He was one of those to whom the Lord showed himself alive after his resurrection, at the Sea of Tiberias.";
eastonArray["$$T0002673"] = "<strong>Nativity of Christ:</strong> The birth of our Lord took place at the time and place predicted by the prophets (<a href=\"#\" onClick=\"return mV('Gen',49,10);\">Gen 49:10</a>; <a href=\"#\" onClick=\"return mV('Isa',7,14);\">Isa 7:14</a>; <a href=\"#\" onClick=\"return mV('Jer',31,15);\">Jer 31:15</a>; <a href=\"#\" onClick=\"return mV('Mic',5,2);\">Mic 5:2</a>; <a href=\"#\" onClick=\"return mV('Hag',2,'6-9');\">Hag 2:6-9</a>; <a href=\"#\" onClick=\"return mV('Dan',9,24,25);\">Dan 9:24-25</a>). Joseph and Mary were providentially led to go up to Bethlehem at this period, and there Christ was born (<a href=\"#\" onClick=\"return mV('Mat',2,1,6);\">Mat 2:1, 6</a>; <a href=\"#\" onClick=\"return mV('Luk',2,1,7);\">Luk 2:1, 7</a>). The exact year or month or day of his birth cannot, however, now be exactly ascertained. We know, however, that it took place in the \"fulness of the time\" (<a href=\"#\" onClick=\"return mV('Gal',4,4);\">Gal 4:4</a>), i.e., at the fittest time in the world's history. Chronologists are now generally agreed that the year 4 before the Christian era was the year of Christ's nativity, and consequently that he was about four years old in the year 1 A.D.";
eastonArray["$$T0002674"] = "<strong>Naughty figs:</strong> (<a href=\"#\" onClick=\"return mV('Jer',24,2);\">Jer 24:2</a>). \"The bad figs may have been such either from having decayed, and thus been reduced to a rotten condition, or as being the fruit of the sycamore, which contains a bitter juice\" (Tristram, Nat. Hist.). The inferiority of the fruit is here referred to as an emblem of the rejected Zedekiah and his people.";
eastonArray["$$T0002675"] = "<strong>Nazarene:</strong> This epithet (Gr. Nazaraios) is applied to Christ only once (<a href=\"#\" onClick=\"return mV('Mat',2,23);\">Mat 2:23</a>). In all other cases the word is rendered \"of Nazareth\" (<a href=\"#\" onClick=\"return mV('Mar',1,24);\">Mar 1:24</a>; <a href=\"#\" onClick=\"return mV('Mar',10,47);\">10:47</a>; <a href=\"#\" onClick=\"return mV('Mar',14,67);\">14:67</a>, etc.). When this Greek designation was at first applied to our Lord, it was meant simply to denote the place of his residence. In course of time the word became a term of reproach. Thus the word \"Nazarene\" carries with it an allusion to those prophecies which speak of Christ as \"despised of men\" (<a href=\"#\" onClick=\"return mV('Isa',53,3);\">Isa 53:3</a>). Some, however, think that in this name there is an allusion to the Hebrew <i>netser</i>, which signifies a branch or sprout. It is so applied to the Messiah (<a href=\"#\" onClick=\"return mV('Isa',11,1);\">Isa 11:1</a>), i.e., he whom the prophets called the <i>Netse</i>, the \"Branch.\"<br><br>The followers of Christ were called \"the sect of Nazarenes\" (<a href=\"#\" onClick=\"return mV('Act',24,5);\">Act 24:5</a>). All over Palestine and Syria this name is still given to Christians. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002676');\">NAZARETH</a>.)";
eastonArray["$$T0002676"] = "<strong>Nazareth:</strong> separated, generally supposed to be the Greek form of the Hebrew <i>netser</i>, a \"shoot\" or \"sprout.\" Some, however, think that the name of the city must be connected with the name of the hill behind it, from which one of the finest prospects in Palestine is obtained, and accordingly they derive it from the Hebrew <i>notserah<i>, i.e., one guarding or watching, thus designating the hill which overlooks and thus guards an extensive region.<br><br>This city is not mentioned in the Old Testament. It was the home of Joseph and Mary (<a href=\"#\" onClick=\"return mV('Luk',2,39);\">Luk 2:39</a>), and here the angel announced to the Virgin the birth of the Messiah (<a href=\"#\" onClick=\"return mV('Luk',1,'26-28');\">1:26-28</a>). Here Jesus grew up from his infancy to manhood (<a href=\"#\" onClick=\"return mV('Luk',4,16);\">4:16</a>); and here he began his public ministry in the synagogue (<a href=\"#\" onClick=\"return mV('Mat',13,54);\">Mat 13:54</a>), at which the people were so offended that they sought to cast him down from the precipice whereon their city was built (<a href=\"#\" onClick=\"return mV('Luk',4,29);\">Luk 4:29</a>). Twice they expelled him from their borders (<a href=\"#\" onClick=\"return mV('Luk',4,'16-29');\">4:16-29</a>; <a href=\"#\" onClick=\"return mV('Mat',13,'54-58');\">Mat 13:54-58</a>); and he finally retired from the city, where he did not many mighty works because of their unbelief (<a href=\"#\" onClick=\"return mV('Mat',13,58);\">Mat 13:58</a>), and took up his residence in Capernaum.<br><br>Nazareth is situated among the southern ridges of Lebanon, on the steep slope of a hill, about 14 miles from the Sea of Galilee and about 6 west from Mount Tabor. It is identified with the modern village en-Nazirah, of six or ten thousand inhabitants. It lies \"as in a hollow cup\" lower down upon the hill than the ancient city. The main road for traffic between Egypt and the interior of Asia passed by Nazareth near the foot of Tabor, and thence northward to Damascus.<br><br>It is supposed from the words of Nathanael in <a href=\"#\" onClick=\"return mV('Jhn',1,46);\">Jhn 1:46</a> that the city of Nazareth was held in great disrepute, either because, it is said, the people of Galilee were a rude and less cultivated class, and were largely influenced by the Gentiles who mingled with them, or because of their lower type of moral and religious character. But there seems to be no sufficient reason for these suppositions. The Jews believed that, according to <a href=\"#\" onClick=\"return mV('Mic',5,2);\">Mic 5:2</a>, the birth of the Messiah would take place at Bethlehem, and nowhere else. Nathanael held the same opinion as his countrymen, and believed that the great \"good\" which they were all expecting could not come from Nazareth. This is probably what Nathanael meant. Moreover, there does not seem to be any evidence that the inhabitants of Galilee were in any respect inferior, or that a Galilean was held in contempt, in the time of our Lord. (See Dr. Merrill's Galilee in the Time of Christ.)<br><br>The population of this city (now about 10,000) in the time of Christ probably amounted to 15,000 or 20,000 souls.<br><br>\"The so-called 'Holy House' is a cave under the Latin church, which appears to have been originally a tank. The 'brow of the hill', site of the attempted precipitation, is probably the northern cliff: the traditional site has been shown since the middle ages at some distance to the south. None of the traditional sites are traceable very early, and they have no authority. The name Nazareth perhaps means 'a watch tower' (now en-Nasrah), but is connected in the New Testament with Netzer, 'a branch' (<a href=\"#\" onClick=\"return mV('Isa',4,2);\">Isa 4:2</a>; <a href=\"#\" onClick=\"return mV('Jer',23,5);\">Jer 23:5</a>; <a href=\"#\" onClick=\"return mV('Zec',3,8);\">Zec 3:8</a>; <a href=\"#\" onClick=\"return mV('Zec',6,12);\">6:12</a>; <a href=\"#\" onClick=\"return mV('Mat',2,23);\">Mat 2:23</a>), Nazarene being quite a different word from Nazarite.\"";
eastonArray["$$T0002677"] = "<strong>Nazarite:</strong> (Heb. form Nazirite), the name of such Israelites as took on them the vow prescribed in <a href=\"#\" onClick=\"return mV('Num',6,'2-21');\">Num 6:2-21</a>. The word denotes generally one who is separated from others and consecrated to God. Although there is no mention of any Nazarite before Samson, yet it is evident that they existed before the time of Moses. The vow of a Nazarite involved these three things,<br><br>(1) abstinence from wine and strong drink,<br><br>(2) refraining from cutting the hair off the head during the whole period of the continuance of the vow, and <br><br>(3) the avoidance of contact with the dead.<br><br>When the period of the continuance of the vow came to an end, the Nazarite had to present himself at the door of the sanctuary with<br><br>(1) a he lamb of the first year for a burnt-offering,<br><br>(2) a ewe lamb of the first year for a sin-offering, and<br><br>(3) a ram for a peace-offering.<br><br>After these sacrifices were offered by the priest, the Nazarite cut off his hair at the door and threw it into the fire under the peace-offering.<br><br>For some reason, probably in the midst of his work at Corinth, Paul took on himself the Nazarite vow. This could only be terminated by his going up to Jerusalem to offer up the hair which till then was to be left uncut. But it seems to have been allowable for persons at a distance to cut the hair, which was to be brought up to Jerusalem, where the ceremony was completed. This Paul did at Cenchrea just before setting out on his voyage into Syria (<a href=\"#\" onClick=\"return mV('Act',18,18);\">Act 18:18</a>).<br><br>On another occasion (<a href=\"#\" onClick=\"return mV('Act',21,'23-26');\">Act 21:23-26</a>), at the feast of Pentecost, Paul took on himself again the Nazarite vow. \"The ceremonies involved took a longer time than Paul had at his disposal, but the law permitted a man to share the vow if he could find companions who had gone through the prescribed ceremonies, and who permitted him to join their company. This permission was commonly granted if the new comer paid all the fees required from the whole company (fee to the Levite for cutting the hair and fees for sacrifices), and finished the vow along with the others. Four Jewish Christians were performing the vow, and would admit Paul to their company, provided he paid their expenses. Paul consented, paid the charges, and when the last seven days of the vow began he went with them to live in the temple, giving the usual notice to the priests that he had joined in regular fashion, was a sharer with the four men, and that his vow would end with theirs. Nazarites retired to the temple during the last period of seven days, because they could be secure there against any accidental defilement\" (Lindsay's Acts).<br><br>As to the duration of a Nazarite's vow, every one was left at liberty to fix his own time. There is mention made in Scripture of only three who were Nazarites for life, Samson, Samuel, and John the Baptist (<a href=\"#\" onClick=\"return mV('Jdg',13,4,5);\">Jdg 13:4-5</a>; <a href=\"#\" onClick=\"return mV('1Sa',1,11);\">1Sa 1:11</a>; <a href=\"#\" onClick=\"return mV('Luk',1,15);\">Luk 1:15</a>). In its ordinary form, however, the Nazarite's vow lasted only thirty, and at most one hundred, days. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003080');\">RECHABITES</a>.)<br><br>This institution was a symbol of a life devoted to God and separated from all sin, a holy life.";
eastonArray["$$T0002678"] = "<strong>Neah:</strong> shaking, or settlement, or descent, a town on the east side of Zebulun, not far from Rimmon (<a href=\"#\" onClick=\"return mV('Jos',19,13);\">Jos 19:13</a>).";
eastonArray["$$T0002679"] = "<strong>Neapolis:</strong> new city, a town in Thrace at which Paul first landed in Europe (<a href=\"#\" onClick=\"return mV('Act',16,11);\">Act 16:11</a>). It was the sea-port of the inland town of Philippi, which was distant about 10 miles. From this port Paul embarked on his last journey to Jerusalem (<a href=\"#\" onClick=\"return mV('Act',20,6);\">Act 20:6</a>). It is identified with the modern Turco-Grecian Kavalla.";
eastonArray["$$T0002680"] = "<strong>Nebaioth:</strong> height.<br><br>(1.) Ishmael's eldest son (<a href=\"#\" onClick=\"return mV('Gen',25,13);\">Gen 25:13</a>), and the prince of an Israelitish tribe (<a href=\"#\" onClick=\"return mV('Gen',25,16);\">16</a>). He had a sister, Mahalath, who was one of Esau's wives (<a href=\"#\" onClick=\"return mV('Gen',28,9);\">Gen 28:9</a>; <a href=\"#\" onClick=\"return mV('Gen',36,3);\">36:3</a>).<br><br>(2.) The name of the Ishmaelite tribe descended from the above (<a href=\"#\" onClick=\"return mV('Gen',25,13,18);\">Gen 25:13, 18</a>). The \"rams of Nebaioth\" (<a href=\"#\" onClick=\"return mV('Isa',60,7);\">Isa 60:7</a>) are the gifts which these wandering tribes of the desert would consecrate to God.";
eastonArray["$$T0002681"] = "<strong>Neballat:</strong> wickedness in secret, (<a href=\"#\" onClick=\"return mV('Neh',11,34);\">Neh 11:34</a>), probably the village of Beit Nebala, about 4 miles north of Lydda.";
eastonArray["$$T0002682"] = "<strong>Nebat:</strong> sight; aspect, the father of Jeroboam, the king of Israel (<a href=\"#\" onClick=\"return mV('1Ki',11,26);\">1Ki 11:26</a>, etc.).";
eastonArray["$$T0002683"] = "<strong>Nebo:</strong> proclaimer; prophet.<br><br>(1.) A Chaldean god whose worship was introduced into Assyria by Pul (<a href=\"#\" onClick=\"return mV('Isa',46,1);\">Isa 46:1</a>; <a href=\"#\" onClick=\"return mV('Jer',48,1);\">Jer 48:1</a>). To this idol was dedicated the great temple whose ruins are still seen at Birs Nimrud. A statue of Nebo found at Calah, where it was set up by Pul, king of Assyria, is now in the British Museum.<br><br>(2.) A mountain in the land of Moab from which Moses looked for the first and the last time on the Promised Land (<a href=\"#\" onClick=\"return mV('Deu',32,49);\">Deu 32:49</a>; <a href=\"#\" onClick=\"return mV('Deu',34,1);\">34:1</a>). It has been identified with Jebel Nebah, on the eastern shore of the Dead Sea, near its northern end, and about 5 miles south-west of Heshbon. It was the summit of the ridge of Pisgah (q.v.), which was a part of the range of the \"mountains of Abarim.\" It is about 2,643 feet in height, but from its position it commands a view of Western Palestine. Close below it are the plains of Moab, where Balaam, and afterwards Moses, saw the tents of Israel spread along.<br><br>(3.) A town on the east of Jordan which was taken possession of and rebuilt by the tribe of Reuben (<a href=\"#\" onClick=\"return mV('Num',32,3,38);\">Num 32:3, 38</a>; <a href=\"#\" onClick=\"return mV('1Ch',5,8);\">1Ch 5:8</a>). It was about 8 miles south of Heshbon.<br><br>(4.) The \"children of Nebo\" (<a href=\"#\" onClick=\"return mV('Ezr',2,29);\">Ezr 2:29</a>; <a href=\"#\" onClick=\"return mV('Neh',7,33);\">Neh 7:33</a>) were of those who returned from Babylon. It was a town in Benjamin, probably the modern Beit Nubah, about 7 miles north-west of Hebron.";
eastonArray["$$T0002684"] = "<strong>Nebuchadnezzar:</strong> in the Babylonian orthography Nabu-kudur-uzur, which means \"Nebo, protect the crown!\" or the \"frontiers.\" In an inscription he styles himself \"Nebo's favourite.\" He was the son and successor of Nabopolassar, who delivered Babylon from its dependence on Assyria and laid Nineveh in ruins. He was the greatest and most powerful of all the Babylonian kings. He married the daughter of Cyaxares, and thus the Median and Babylonian dynasties were united.<br><br>Necho II., the king of Egypt, gained a victory over the Assyrians at Carchemish. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002116');\">JOSIAH</a>;  <a href=\"#\" onClick=\"return doDictLookup('ET0002463');\">MEGIDDO</a>.) This secured to Egypt the possession of the Syrian provinces of Assyria, including Palestine. The remaining provinces of the Assyrian empire were divided between Babylonia and Media. But Nabopolassar was ambitious of reconquering from Necho the western provinces of Syria, and for this purpose he sent his son with a powerful army westward (<a href=\"#\" onClick=\"return mV('Dan',1,1);\">Dan 1:1</a>). The Egyptians met him at Carchemish, where a furious battle was fought, resulting in the complete rout of the Egyptians, who were driven back (<a href=\"#\" onClick=\"return mV('Jer',46,'2-12');\">Jer 46:2-12</a>), and Syria and Phoenicia brought under the sway of Babylon (B.C. 606). From that time \"the king of Egypt came not again any more out of his land\" (<a href=\"#\" onClick=\"return mV('2Ki',24,7);\">2Ki 24:7</a>). Nebuchadnezzar also subdued the whole of Palestine, and took Jerusalem, carrying away captive a great multitude of the Jews, among whom were Daniel and his companions (<a href=\"#\" onClick=\"return mV('Dan',1,1,2);\">Dan 1:1-2</a>; <a href=\"#\" onClick=\"return mV('Jer',27,19);\">Jer 27:19</a>; <a href=\"#\" onClick=\"return mV('Jer',40,1);\">40:1</a>).<br><br>Three years after this, Jehoiakim, who had reigned in Jerusalem as a Babylonian vassal, rebelled against the oppressor, trusting to help from Egypt (<a href=\"#\" onClick=\"return mV('2Ki',24,1);\">2Ki 24:1</a>). This led Nebuchadnezzar to march an army again to the conquest of Jerusalem, which at once yielded to him (B.C. 598). A third time he came against it, and deposed Jehoiachin, whom he carried into Babylon, with a large portion of the population of the city, and the sacred vessels of the temple, placing Zedekiah on the throne of Judah in his stead. He also, heedless of the warnings of the prophet, entered into an alliance with Egypt, and rebelled against Babylon. This brought about the final siege of the city, which was at length taken and utterly destroyed (B.C. 586). Zedekiah was taken captive, and had his eyes put out by order of the king of Babylon, who made him a prisoner for the remainder of his life.<br><br>An onyx cameo, now in the museum of Florence, bears on it an arrow-headed inscription, which is certainly ancient and genuine. The helmeted profile is said (Schrader) to be genuine also, but it is more probable that it is the portrait of a usurper in the time of Darius (Hystaspes), called Nidinta-Bel, who took the name of \"Nebuchadrezzar.\" The inscription has been thus translated:, \"In honour of Merodach, his lord, Nebuchadnezzar, king of Babylon, in his lifetime had this made.\"<br><br>A clay tablet, now in the British Museum, bears the following inscription, the only one as yet found which refers to his wars: \"In the thirty-seventh year of Nebuchadnezzar, king of the country of Babylon, he went to Egypt [Misr] to make war. Amasis, king of Egypt, collected [his army], and marched and spread abroad.\" Thus were fulfilled the words of the prophet (<a href=\"#\" onClick=\"return mV('Jer',46,'13-26');\">Jer 46:13-26</a>; <a href=\"#\" onClick=\"return mV('Eze',29,'2-20');\">Eze 29:2-20</a>). Having completed the subjugation of Phoenicia, and inflicted chastisement on Egypt, Nebuchadnezzar now set himself to rebuild and adorn the city of Babylon (<a href=\"#\" onClick=\"return mV('Dan',4,30);\">Dan 4:30</a>), and to add to the greatness and prosperity of his kingdom by constructing canals and aqueducts and reservoirs surpassing in grandeur and magnificence everything of the kind mentioned in history (<a href=\"#\" onClick=\"return mV('Dan',2,37);\">Dan 2:37</a>). He is represented as a \"king of kings,\" ruling over a vast kingdom of many provinces, with a long list of officers and rulers under him, \"princes, governors, captains,\" etc. (<a href=\"#\" onClick=\"return mV('Dan',3,2,3,27);\">3:2-3, 27</a>). He may, indeed, be said to have created the mighty empire over which he ruled.<br><br>\"Modern research has shown that Nebuchadnezzar was the greatest monarch that Babylon, or perhaps the East generally, ever produced. He must have possessed an enormous command of human labour, nine-tenths of Babylon itself, and nineteen-twentieths of all the other ruins that in almost countless profusion cover the land, are composed of bricks stamped with his name. He appears to have built or restored almost every city and temple in the whole country. His inscriptions give an elaborate account of the immense works which he constructed in and about Babylon itself, abundantly illustrating the boast, 'Is not this great Babylon which I have build?'\" Rawlinson, Hist. Illustrations.<br><br>After the incident of the \"burning fiery furnace\" (<a href=\"#\" onClick=\"return mV('Dan',3,'1-')\">Dan 3</a>) into which the three Hebrew confessors were cast, Nebuchadnezzar was afflicted with some peculiar mental aberration as a punishment for his pride and vanity, probably the form of madness known as lycanthropy (i.e, \"the change of a man into a wolf\"). A remarkable confirmation of the Scripture narrative is afforded by the recent discovery of a bronze door-step, which bears an inscription to the effect that it was presented by Nebuchadnezzar to the great temple at Borsippa as a votive offering on account of his recovery from a terrible illness. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000969');\">DANIEL</a>.)<br><br>He survived his recovery for some years, and died B.C. 562, in the eighty-third or eighty-fourth year of his age, after a reign of forty-three years, and was succeeded by his son Evil-merodach, who, after a reign of two years, was succeeded by Neriglissar (559-555), who was succeeded by Nabonadius (555-538), at the close of whose reign (less than a quarter of a century after the death of Nebuchadnezzar) Babylon fell under Cyrus at the head of the combined armies of Media and Persia.<br><br>\"I have examined,\" says Sir H. Rawlinson, \"the bricks belonging perhaps to a hundred different towns and cities in the neighbourhood of Baghdad, and I never found any other legend than that of Nebuchadnezzar, son of Nabopolassar, king of Babylon.\" Nine-tenths of all the bricks amid the ruins of Babylon are stamped with his name.";
eastonArray["$$T0002685"] = "<strong>Nebuchadrezzar:</strong> =Nebuchadnezzar (<a href=\"#\" onClick=\"return mV('Jer',21,2,7);\">Jer 21:2, 7</a>; <a href=\"#\" onClick=\"return mV('Jer',22,25);\">22:25</a>; <a href=\"#\" onClick=\"return mV('Jer',24,1);\">24:1</a>, etc.), a nearer approach to the correct spelling of the word.";
eastonArray["$$T0002686"] = "<strong>Nebushasban:</strong> adorer of Nebo, or Nebo saves me, the \"Rabsaris,\" or chief chamberlain, of the court of Babylon. He was one of those whom the king sent to release Jeremiah from prison in Jerusalem (<a href=\"#\" onClick=\"return mV('Jer',39,13);\">Jer 39:13</a>).";
eastonArray["$$T0002687"] = "<strong>Nebuzaradan:</strong> \"the captain of the guard,\" in rank next to the king, who appears prominent in directing affairs at the capture of Jerusalem (<a href=\"#\" onClick=\"return mV('2Ki',25,'8-20');\">2Ki 25:8-20</a>; <a href=\"#\" onClick=\"return mV('Jer',39,11);\">Jer 39:11</a>; <a href=\"#\" onClick=\"return mV('Jer',40,'2-5');\">40:2-5</a>). He showed kindness toward Jeremiah, as commanded by Nebuchadnezzar (<a href=\"#\" onClick=\"return mV('Jer',40,1);\">40:1</a>). Five years after this he again came to Jerusalem and carried captive seven hundred and forty-five more Jews.";
eastonArray["$$T0002688"] = "<strong>Necho II:</strong> an Egyptian king, the son and successor of Psammetichus (B.C. 610-594), the contemporary of Josiah, king of Judah. For some reason he proclaimed war against the king of Assyria. He led forth a powerful army and marched northward, but was met by the king of Judah at Megiddo, who refused him a passage through his territory. Here a fierce battle was fought and Josiah was slain (<a href=\"#\" onClick=\"return mV('2Ch',35,'20-24');\">2Ch 35:20-24</a>). Possibly, as some suppose, Necho may have brought his army by sea to some port to the north of Dor (<a href=\"#\" onClick=\"return mV('Jos',11,2);\">Jos 11:2</a>; <a href=\"#\" onClick=\"return mV('Jos',12,23);\">12:23</a>), a Phoenician town at no great distance from Megiddo. After this battle Necho marched on to Carchemish (q.v.), where he met and conquered the Assyrian army, and thus all the Syrian provinces, including Palestine, came under his dominion.<br><br>On his return march he deposed Jehoahaz, who had succeeded his father Josiah, and made Eliakim, Josiah's eldest son, whose name he changed into Jehoiakim, king. Jehoahaz he carried down into Egypt, where he died (<a href=\"#\" onClick=\"return mV('2Ki',23,31);\">2Ki 23:31</a>; <a href=\"#\" onClick=\"return mV('2Ch',36,'1-4');\">2Ch 36:1-4</a>). Four years after this conquest Necho again marched to the Euphrates; but here he was met and his army routed by the Chaldeans (B.C. 606) under Nebuchadnezzar, who drove the Egyptians back, and took from them all the territory they had conquered, from the Euphrates unto the \"river of Egypt\" (<a href=\"#\" onClick=\"return mV('Jer',46,2);\">Jer 46:2</a>; <a href=\"#\" onClick=\"return mV('2Ki',24,7,8);\">2Ki 24:7-8</a>). Soon after this Necho died, and was succeeded by his son, Psammetichus II. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002684');\">NEBUCHADNEZZAR</a>.)";
eastonArray["$$T0002689"] = "<strong>Neck:</strong> used sometimes figuratively. To \"lay down the neck\" (<a href=\"#\" onClick=\"return mV('Rom',16,4);\">Rom 16:4</a>) is to hazard one's life. Threatenings of coming judgments are represented by the prophets by their laying bands upon the people's necks (<a href=\"#\" onClick=\"return mV('Deu',28,48);\">Deu 28:48</a>; <a href=\"#\" onClick=\"return mV('Isa',10,27);\">Isa 10:27</a>; <a href=\"#\" onClick=\"return mV('Jer',27,2);\">Jer 27:2</a>). Conquerors put their feet on the necks of their enemies as a sign of their subjection (<a href=\"#\" onClick=\"return mV('Jos',10,24);\">Jos 10:24</a>; <a href=\"#\" onClick=\"return mV('2Sa',22,41);\">2Sa 22:41</a>).";
eastonArray["$$T0002690"] = "<strong>Necromancer:</strong> (<a href=\"#\" onClick=\"return mV('Deu',15,11);\">Deu 15:11</a>), i.e., \"one who interrogates the dead,\" as the word literally means, with the view of discovering the secrets of futurity (<a href=\"#\" onClick=\"return mV('1Sa',28,7);\">1Sa 28:7</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001047');\">DIVINATION</a>.)";
eastonArray["$$T0002691"] = "<strong>Nedabiah:</strong> moved of Jehovah, one of the sons of Jeconiah (<a href=\"#\" onClick=\"return mV('1Ch',3,18);\">1Ch 3:18</a>).";
eastonArray["$$T0002692"] = "<strong>Needle:</strong> used only in the proverb, \"to pass through a needle's eye\" (<a href=\"#\" onClick=\"return mV('Mat',19,24);\">Mat 19:24</a>; <a href=\"#\" onClick=\"return mV('Mar',10,25);\">Mar 10:25</a>; <a href=\"#\" onClick=\"return mV('Luk',18,25);\">Luk 18:25</a>). Some interpret the expression as referring to the side gate, close to the principal gate, usually called the \"eye of a needle\" in the East; but it is rather to be taken literally. The Hebrew females were skilled in the use of the needle (<a href=\"#\" onClick=\"return mV('Exd',28,39);\">Exd 28:39</a>; <a href=\"#\" onClick=\"return mV('Exd',26,36);\">26:36</a>; <a href=\"#\" onClick=\"return mV('Jdg',5,30);\">Jdg 5:30</a>).";
eastonArray["$$T0002693"] = "<strong>Neginah:</strong> in the title of <a href=\"#\" onClick=\"return mV('Psa',61,'1-');\">Psa 61</a>, denotes the music of stringed instruments (<a href=\"#\" onClick=\"return mV('1Sa',16,16);\">1Sa 16:16</a>; <a href=\"#\" onClick=\"return mV('Isa',38,20);\">Isa 38:20</a>). It is the singular form of Neginoth.";
eastonArray["$$T0002694"] = "<strong>Neginoth:</strong> i.e., songs with instrumental accompaniment, found in the titles of <a href=\"#\" onClick=\"return mV('Psa',4,'1-');\">Psa 4</a>; <a href=\"#\" onClick=\"return mV('Psa',6,'1-');\">6</a>; <a href=\"#\" onClick=\"return mV('Psa',54,'1-');\">54</a>; <a href=\"#\" onClick=\"return mV('Psa',55,'1-');\">55</a>; <a href=\"#\" onClick=\"return mV('Psa',67,'1-');\">67</a>; <a href=\"#\" onClick=\"return mV('Psa',76,'1-');\">76</a>; rendered \"stringed instruments,\" <a href=\"#\" onClick=\"return mV('Hab',3,19);\">Hab 3:19</a>, A.V. It denotes all kinds of stringed instruments, as the \"harp,\" \"psaltery,\" \"viol,\" etc. The \"chief musician on Neginoth\" is the leader of that part of the temple choir which played on stringed instruments.";
eastonArray["$$T0002695"] = "<strong>Nehelamite:</strong> the name given to a false prophet Shemaiah, who went with the captives to Babylon (<a href=\"#\" onClick=\"return mV('Jer',29,24,31,32);\">Jer 29:24, 31-32</a>). The origin of the name is unknown. It is rendered in the marg, \"dreamer.\"";
eastonArray["$$T0002696"] = "<strong>Nehemiah:</strong> comforted by Jehovah.<br><br>(1.) <a href=\"#\" onClick=\"return mV('Ezr',2,2);\">Ezr 2:2</a>; <a href=\"#\" onClick=\"return mV('Neh',7,7);\">Neh 7:7</a>.<br><br>(2.) <a href=\"#\" onClick=\"return mV('Neh',3,16);\">Neh 3:16</a>.<br><br>(3.) The son of Hachaliah (<a href=\"#\" onClick=\"return mV('Neh',1,1);\">Neh 1:1</a>), and probably of the tribe of Judah. His family must have belonged to Jerusalem (<a href=\"#\" onClick=\"return mV('Neh',2,3);\">Neh 2:3</a>). He was one of the \"Jews of the dispersion,\" and in his youth was appointed to the important office of royal cup-bearer at the palace of Shushan. The king, Artaxerxes Longimanus, seems to have been on terms of friendly familiarity with his attendant. Through his brother Hanani, and perhaps from other sources (<a href=\"#\" onClick=\"return mV('Neh',1,2);\">Neh 1:2</a>; <a href=\"#\" onClick=\"return mV('Neh',2,3);\">2:3</a>), he heard of the mournful and desolate condition of the Holy City, and was filled with sadness of heart. For many days he fasted and mourned and prayed for the place of his fathers' sepulchres. At length the king observed his sadness of countenance and asked the reason of it. Nehemiah explained it all to the king, and obtained his permission to go up to Jerusalem and there to act as <i>tirshatha</i>, or governor of Judea. He went up in the spring of B.C. 446 (eleven years after Ezra), with a strong escort supplied by the king, and with letters to all the pashas of the provinces through which he had to pass, as also to Asaph, keeper of the royal forests, directing him to assist Nehemiah. On his arrival he set himself to survey the city, and to form a plan for its restoration; a plan which he carried out with great skill and energy, so that the whole was completed in about six months. He remained in Judea for thirteen years as governor, carrying out many reforms, notwithstanding much opposition that he encountered (<a href=\"#\" onClick=\"return mV('Neh',13,11);\">Neh 13:11</a>). He built up the state on the old lines, \"supplementing and completing the work of Ezra,\" and making all arrangements for the safety and good government of the city. At the close of this important period of his public life, he returned to Persia to the service of his royal master at Shushan or Ecbatana. Very soon after this the old corrupt state of things returned, showing the worthlessness to a large extent of the professions that had been made at the feast of the dedication of the walls of the city (<a href=\"#\" onClick=\"return mV('Neh',12,'1-');\">Neh 12</a>. See <a href=\"#\" onClick=\"return doDictLookup('ET0001294');\">EZRA</a>). Malachi now appeared among the people with words of stern reproof and solemn warning; and Nehemiah again returned from Persia (after an absence of some two years), and was grieved to see the widespread moral degeneracy that had taken place during his absence. He set himself with vigour to rectify the flagrant abuses that had sprung up, and restored the orderly administration of public worship and the outward observance of the law of Moses. Of his subsequent history we know nothing. Probably he remained at his post as governor till his death (about B.C. 413) in a good old age. The place of his death and burial is, however, unknown. \"He resembled Ezra in his fiery zeal, in his active spirit of enterprise, and in the piety of his life: but he was of a bluffer and a fiercer mood; he had less patience with transgressors; he was a man of action rather than a man of thought, and more inclined to use force than persuasion. His practical sagacity and high courage were very markedly shown in the arrangement with which he carried through the rebuilding of the wall and balked the cunning plans of the 'adversaries.' The piety of his heart, his deeply religious spirit and constant sense of communion with and absolute dependence upon God, are strikingly exhibited, first in the long prayer recorded in (<a href=\"#\" onClick=\"return mV('Neh',1,'5-11');\">Neh 1:5-11</a>), and secondly and most remarkably in what have been called his 'interjectional prayers', those short but moving addresses to Almighty God which occur so frequently in his writings, the instinctive outpouring of a heart deeply moved, but ever resting itself upon God, and looking to God alone for aid in trouble, for the frustration of evil designs, and for final reward and acceptance\" (Rawlinson). Nehemiah was the last of the governors sent from the Persian court. Judea after this was annexed to the satrapy of Coele-Syria, and was governed by the high priest under the jurisdiction of the governor of Syria, and the internal government of the country became more and more a hierarchy.";
eastonArray["$$T0002697"] = "<strong>Nehemiah, Book of:</strong> The author of this book was no doubt Nehemiah himself. There are portions of the book written in the first person (<a href=\"#\" onClick=\"return mV('Neh',1,'1-7');\">Neh 1:1-7</a>; <a href=\"#\" onClick=\"return mV('Neh',12,'27-47');\">12:27-47</a>, and <a href=\"#\" onClick=\"return mV('Neh',12,'1-');\">Neh 13</a>). But there are also portions of it in which Nehemiah is spoken of in the third person (<a href=\"#\" onClick=\"return mV('Neh',8,'1-')\">Neh 8</a>; <a href=\"#\" onClick=\"return mV('Neh',9,'1-')\">9</a>; <a href=\"#\" onClick=\"return mV('Neh',10,'1-')\">10</a>). It is supposed that these portions may have been written by Ezra; of this, however, there is no distinct evidence. These portions had their place assigned them in the book, there can be no doubt, by Nehemiah. He was the responsible author of the whole book, with the exception of (<a href=\"#\" onClick=\"return mV('Neh',12,11,22,23);\">Neh 12:11, 22-23</a>).<br><br>The date at which the book was written was probably about B.C. 431-430, when Nehemiah had returned the second time to Jerusalem after his visit to Persia.<br><br>The book, which may historically be regarded as a continuation of the book of Ezra, consists of four parts.<br><br>(1.) An account of the rebuilding of the wall of Jerusalem, and of the register Nehemiah had found of those who had returned from Babylon (ch. 1-7).<br><br>(2.) An account of the state of religion among the Jews during this time (8-10).<br><br>(3.) Increase of the inhabitants of Jerusalem; the census of the adult male population, and names of the chiefs, together with lists of priests and Levites (<a href=\"#\" onClick=\"return mV('Neh',11,'1-')\">Neh 11</a>-<a href=\"#\" onClick=\"return mV('Neh',12,'1-26')\">12:1-26</a>).<br><br>(4.) Dedication of the wall of Jerusalem, the arrangement of the temple officers, and the reforms carried out by Nehemiah (<a href=\"#\" onClick=\"return mV('Neh',12,'27-');\">Neh 12:27</a>-<a href=\"#\" onClick=\"return mV('Neh',13,'1-');\">Neh 13</a>).<br><br>This book closes the history of the Old Testament. Malachi the prophet was contemporary with Nehemiah.";
eastonArray["$$T0002698"] = "<strong>Nehiloth:</strong> only in the title of <a href=\"#\" onClick=\"return mV('Psa',5,'1-');\">Psa 5</a>. It is probably derived from a root meaning \"to bore,\" \"perforate,\" and hence denotes perforated wind instruments of all kinds. The psalm may be thus regarded as addressed to the conductor of the temple choir which played on flutes and such-like instruments.";
eastonArray["$$T0002699"] = "<strong>Nehushta:</strong> copper, the daughter of Elnathan of Jerusalem, and the wife of Jehoiakin (<a href=\"#\" onClick=\"return mV('2Ki',24,8);\">2Ki 24:8</a>), king of Judah.";
