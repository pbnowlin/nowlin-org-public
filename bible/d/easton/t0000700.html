<script>
var eastonArray = new Array ();
eastonArray["$$T0000700"] = "<strong>Camp:</strong> During their journeys across the wilderness, the twelve tribes formed encampments at the different places where they halted (<a href=\"#\" onClick=\"return mV('Exd',16,13);\">Exd 16:13</a>; <a href=\"#\" onClick=\"return mV('Num',2,3);\">Num 2:3</a>). The diagram here given shows the position of the different tribes and the form of the encampment during the wanderings, according to <a href=\"#\" onClick=\"return mV('Num',1,53);\">Num 1:53</a>; <a href=\"#\" onClick=\"return mV('Num',2,'2-31');\">2:2-31</a>; <a href=\"#\" onClick=\"return mV('Num',3,29,35,38);\">3:29, 35, 38</a>; <a href=\"#\" onClick=\"return mV('Num',10,'13-28');\">10:13-28</a>.<br><br>The area of the camp would be in all about 3 square miles. After the Hebrews entered Palestine, the camps then spoken of were exclusively warlike (<a href=\"#\" onClick=\"return mV('Jos',11,5,7);\">Jos 11:5, 7</a>; <a href=\"#\" onClick=\"return mV('Jdg',5,19,21);\">Jdg 5:19, 21</a>; <a href=\"#\" onClick=\"return mV('Jdg',7,1);\">7:1</a>; <a href=\"#\" onClick=\"return mV('1Sa',29,1);\">1Sa 29:1</a>; <a href=\"#\" onClick=\"return mV('1Sa',30,9);\">30:9</a>, etc.).";
eastonArray["$$T0000701"] = "<strong>Camphire:</strong> (Heb. copher), mentioned in <a href=\"#\" onClick=\"return mV('Sgs',1,14);\">Sgs 1:14</a> (R.V., \"henna-flowers\"); <a href=\"#\" onClick=\"return mV('Sgs',4,13);\">4:13</a> (R.V., \"henna\"), is the al-henna of the Arabs, a native of Egypt, producing clusters of small white and yellow odoriferous flowers, whence is made the Oleum Cyprineum. From its leaves is made the peculiar auburn dye with which Eastern women stain their nails and the palms of their hands. It is found only at Engedi, on the shore of the Dead Sea. It is known to botanists by the name <i>Lawsonia alba</i> or inermis, a kind of privet, which grows 6 or 8 feet high. The margin of the Authorized Version of the passages above referred to has \"or cypress,\" not with reference to the conifer so called, but to the circumstance that one of the most highly appreciated species of this plant grew in the island of Cyprus.";
eastonArray["$$T0000702"] = "<strong>Cana:</strong> reedy, a town of Galilee, near Capernaum. Here our Lord wrought his first miracle, the turning of water into wine (<a href=\"#\" onClick=\"return mV('Jhn',2,'1-11');\">Jhn 2:1-11</a>; <a href=\"#\" onClick=\"return mV('Jhn',4,46);\">4:46</a>). It is also mentioned as the birth-place of Nathanael (<a href=\"#\" onClick=\"return mV('Jhn',21,2);\">21:2</a>). It is not mentioned in the Old Testament. It has been identified with the modern Kana el-Jelil, also called Khurbet Kana, a place 8 or 9 miles north of Nazareth. Others have identified it with Kefr Kenna, which lies on the direct road to the Sea of Galilee, about 5 miles north-east of Nazareth, and 12 in a direct course from Tiberias. It is called \"Cana of Galilee,\" to distinguish it from Cana of Asher (<a href=\"#\" onClick=\"return mV('Jos',19,28);\">Jos 19:28</a>).";
eastonArray["$$T0000703"] = "<strong>Canaan:</strong><br><br>(1.) The fourth son of Ham (<a href=\"#\" onClick=\"return mV('Gen',10,6);\">Gen 10:6</a>). His descendants were under a curse in consequence of the transgression of his father (<a href=\"#\" onClick=\"return mV('Gen',9,'22-27');\">9:22-27</a>). His eldest son, Zidon, was the father of the Sidonians and Phoenicians. He had eleven sons, who were the founders of as many tribes (<a href=\"#\" onClick=\"return mV('Gen',10,'15-18');\">10:15-18</a>).<br><br>(2.) The country which derived its name from the preceding. The name as first used by the Phoenicians denoted only the maritime plain on which Sidon was built. But in the time of Moses and Joshua it denoted the whole country to the west of the Jordan and the Dead Sea (<a href=\"#\" onClick=\"return mV('Deu',11,30);\">Deu 11:30</a>). In <a href=\"#\" onClick=\"return mV('Jos',5,12);\">Jos 5:12</a> the LXX. read, \"land of the Phoenicians,\" instead of \"land of Canaan.\"<br><br>The name signifies \"the lowlands,\" as distinguished from the land of Gilead on the east of Jordan, which was a mountainous district. The extent and boundaries of Canaan are fully set forth in different parts of Scripture (<a href=\"#\" onClick=\"return mV('Gen',10,19);\">Gen 10:19</a>; <a href=\"#\" onClick=\"return mV('Gen',17,8);\">17:8</a>; <a href=\"#\" onClick=\"return mV('Num',13,29);\">Num 13:29</a>; <a href=\"#\" onClick=\"return mV('Num',34,8);\">34:8</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000705');\">CANAANITES</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0002828');\">PALESTINE</a>.)";
eastonArray["$$T0000704"] = "<strong>Canaanite:</strong> a name given to the apostle Simon (<a href=\"#\" onClick=\"return mV('Mat',10,4);\">Mat 10:4</a>; <a href=\"#\" onClick=\"return mV('Mar',3,18);\">Mar 3:18</a>). The word here does not, however, mean a descendant of Canaan, but is a translation, or rather almost a transliteration, of the Syriac word Kanenyeh (R.V. rendered \"Cananaen\"), which designates the Jewish sect of the Zealots. Hence he is called elsewhere (<a href=\"#\" onClick=\"return mV('Luk',6,15);\">Luk 6:15</a>) \"Simon Zelotes;\" i.e., Simon of the sect of the Zealots. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003439');\">SIMON</a>.)";
eastonArray["$$T0000705"] = "<strong>Canaanites:</strong> the descendants of Canaan, the son of Ham. Migrating from their original home, they seem to have reached the Persian Gulf, and to have there sojourned for some time. They thence \"spread to the west, across the mountain chain of Lebanon to the very edge of the Mediterranean Sea, occupying all the land which later became Palestine, also to the north-west as far as the mountain chain of Taurus. This group was very numerous, and broken up into a great many peoples, as we can judge from the list of nations (<a href=\"#\" onClick=\"return mV('Gen',10,'1-')\">Gen 10</a>), the 'sons of Canaan.'\" Six different tribes are mentioned in <a href=\"#\" onClick=\"return mV('Exd',3,8,17);\">Exd 3:8, 17</a>; <a href=\"#\" onClick=\"return mV('Exd',23,23);\">23:23</a>; <a href=\"#\" onClick=\"return mV('Exd',32,2);\">33:2</a>; <a href=\"#\" onClick=\"return mV('Exd',34,11);\">34:11</a>. In <a href=\"#\" onClick=\"return mV('Exd',13,5);\">Exd 13:5</a> the \"Perizzites\" are omitted. The \"Girgashites\" are mentioned in addition to the foregoing in <a href=\"#\" onClick=\"return mV('Deu',7,1);\">Deu 7:1</a>; <a href=\"#\" onClick=\"return mV('Jos',3,10);\">Jos 3:10</a>.<br><br>The \"Canaanites,\" as distinguished from the Amalekites, the Anakim, and the Rephaim, were \"dwellers in the lowlands\" (<a href=\"#\" onClick=\"return mV('Num',13,29);\">Num 13:29</a>), the great plains and valleys, the richest and most important parts of Palestine. Tyre and Sidon, their famous cities, were the centres of great commercial activity; and hence the name \"Canaanite\" came to signify a \"trader\" or \"merchant\" (<a href=\"#\" onClick=\"return mV('Job',41,6);\">Job 41:6</a>; <a href=\"#\" onClick=\"return mV('Pro',31,24);\">Pro 31:24</a>, lit. \"Canaanites; <a href=\"#\" onClick=\"return mV('Zep',1,11);\">Zep 1:11</a>; <a href=\"#\" onClick=\"return mV('Eze',17,4);\">Eze 17:4</a>). The name \"Canaanite\" is also sometimes used to designate the non-Israelite inhabitants of the land in general (<a href=\"#\" onClick=\"return mV('Gen',12,6);\">Gen 12:6</a>; <a href=\"#\" onClick=\"return mV('Num',21,3);\">Num 21:3</a>; <a href=\"#\" onClick=\"return mV('Jdg',1,10);\">Jdg 1:10</a>).<br><br>The Israelites, when they were led to the Promised Land, were commanded utterly to destroy the descendants of Canaan then possessing it (<a href=\"#\" onClick=\"return mV('Exd',23,23);\">Exd 23:23</a>; <a href=\"#\" onClick=\"return mV('Num',33,52,53);\">Num 33:52-53</a>; <a href=\"#\" onClick=\"return mV('Deu',20,16,17);\">Deu 20:16-17</a>). This was to be done \"by little and little,\" lest the beasts of the field should increase (<a href=\"#\" onClick=\"return mV('Exd',23,29);\">Exd 23:29</a>; <a href=\"#\" onClick=\"return mV('Deu',7,22,23);\">Deu 7:22-23</a>). The history of these wars of conquest is given in the Book of Joshua. The extermination of these tribes, however, was never fully carried out. Jerusalem was not taken till the time of David (<a href=\"#\" onClick=\"return mV('2Sa',5,6,7);\">2Sa 5:6-7</a>). In the days of Solomon bond-service was exacted from the fragments of the tribes still remaining in the land (<a href=\"#\" onClick=\"return mV('1Ki',9,20,21);\">1Ki 9:20-21</a>). Even after the return from captivity survivors of five of the Canaanitish tribes were still found in the land.<br><br>In the Tell-el-Amarna tablets Canaan is found under the forms of Kinakhna and Kinakhkhi. Under the name of Kanana the Canaanites appear on Egyptian monuments, wearing a coat of mail and helmet, and distinguished by the use of spear and javelin and the battle-axe. They were called Phoenicians by the Greeks and Poeni by the Romans. By race the Canaanites were Semitic. They were famous as merchants and seamen, as well as for their artistic skill. The chief object of their worship was the sun-god, who was addressed by the general name of Baal, \"lord.\" Each locality had its special Baal, and the various local Baals were summed up under the name of Baalim, \"lords.\"";
eastonArray["$$T0000706"] = "<strong>Canaan, the language of:</strong> mentioned in <a href=\"#\" onClick=\"return mV('Isa',19,18);\">Isa 19:18</a>, denotes the language spoken by the Jews resident in Palestine. The language of the Canaanites and of the Hebrews was substantially the same. This is seen from the fragments of the Phoenician language which still survive, which show the closest analogy to the Hebrew. Yet the subject of the language of the \"Canaanites\" is very obscure. The cuneiform writing of Babylon, as well as the Babylonian language, was taught in the Canaanitish schools, and the clay tablets of Babylonian literature were stored in the Canaanitish libraries. Even the Babylonian divinities were borrowed by the Canaanites.";
eastonArray["$$T0000707"] = "<strong>Candace:</strong> the queen of the Ethiopians whose \"eunuch\" or chamberlain was converted to Christianity by the instrumentality of Philip the evangelist (<a href=\"#\" onClick=\"return mV('Act',8,27);\">Act 8:27</a>). The country which she ruled was called by the Greeks Meroe, in Upper Nubia. It was long the centre of commercial intercourse between Africa and the south of Asia, and hence became famous for its wealth (<a href=\"#\" onClick=\"return mV('Isa',45,14);\">Isa 45:14</a>).<br><br>It is somewhat singular that female sovereignty seems to have prevailed in Ethiopia, the name Candace (compare \"Pharaoh,\" \"Ptolemy,\" \"Caesar\") being a title common to several successive queens. It is probable that Judaism had taken root in Ethiopia at this time, and hence the visit of the queen's treasurer to Jerusalem to keep the feast. There is a tradition that Candace was herself converted to Christianity by her treasurer on his return, and that he became the apostle of Christianity in that whole region, carrying it also into Abyssinia. It is said that he also preached the gospel in Arabia Felix and in Ceylon, where he suffered martyrdom. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002936');\">PHILIP</a>.)";
eastonArray["$$T0000708"] = "<strong>Candle:</strong> Heb. ner, <a href=\"#\" onClick=\"return mV('Job',18,6);\">Job 18:6</a>; <a href=\"#\" onClick=\"return mV('Job',29,3);\">29:3</a>; <a href=\"#\" onClick=\"return mV('Psa',18,28);\">Psa 18:28</a>; <a href=\"#\" onClick=\"return mV('Pro',24,20);\">Pro 24:20</a>, in all which places the Revised Version and margin of Authorized Version have \"lamp,\" by which the word is elsewhere frequently rendered. The Hebrew word denotes properly any kind of candle or lamp or torch. It is used as a figure of conscience (<a href=\"#\" onClick=\"return mV('Pro',20,27);\">Pro 20:27</a>), of a Christian example (<a href=\"#\" onClick=\"return mV('Mat',5,14,15);\">Mat 5:14-15</a>), and of prosperity (<a href=\"#\" onClick=\"return mV('Job',21,17);\">Job 21:17</a>; <a href=\"#\" onClick=\"return mV('Pro',13,9);\">Pro 13:9</a>).";
eastonArray["$$T0000709"] = "<strong>Candlestick:</strong> the lamp-stand, \"candelabrum,\" which Moses was commanded to make for the tabernacle, according to the pattern shown him. Its form is described in <a href=\"#\" onClick=\"return mV('Exd',25,'31-40');\">Exd 25:31-40</a>; <a href=\"#\" onClick=\"return mV('Exd',37,'17-24');\">37:17-24</a>, and may be seen represented on the Arch of Titus at Rome. It was among the spoils taken by the Romans from the temple of Jerusalem (A.D. 70). It was made of fine gold, and with the utensils belonging to it was a talent in weight.<br><br>The tabernacle was a tent without windows, and thus artificial light was needed. This was supplied by the candlestick, which, however, served also as a symbol of the church or people of God, who are \"the light of the world.\" The light which \"symbolizes the knowledge of God is not the sun or any natural light, but an artificial light supplied with a specially prepared oil; for the knowledge of God is in truth not natural nor common to all men, but furnished over and above nature.\"<br><br>This candlestick was placed on the south side of the Holy Place, opposite the table of shewbread (<a href=\"#\" onClick=\"return mV('Exd',27,21);\">Exd 27:21</a>; <a href=\"#\" onClick=\"return mV('Exd',30,7,8);\">30:7-8</a>; <a href=\"#\" onClick=\"return mV('Lev',24,3);\">Lev 24:3</a>; <a href=\"#\" onClick=\"return mV('1Sa',3,3);\">1Sa 3:3</a>). It was lighted every evening, and was extinguished in the morning. In the morning the priests trimmed the seven lamps, borne by the seven branches, with golden snuffers, carrying away the ashes in golden dishes (<a href=\"#\" onClick=\"return mV('Exd',25,38);\">Exd 25:38</a>), and supplying the lamps at the same time with fresh oil. What ultimately became of the candlestick is unknown.<br><br>In Solomon's temple there were ten separate candlesticks of pure gold, five on the right and five on the left of the Holy Place (<a href=\"#\" onClick=\"return mV('1Ki',7,49);\">1Ki 7:49</a>; <a href=\"#\" onClick=\"return mV('2Ch',4,7);\">2Ch 4:7</a>). Their structure is not mentioned. They were carried away to Babylon (<a href=\"#\" onClick=\"return mV('Jer',52,19);\">Jer 52:19</a>).<br><br>In the temple erected after the Exile there was again but one candlestick, and like the first, with seven branches. It was this which was afterwards carried away by Titus to Rome, where it was deposited in the Temple of Peace. When Genseric plundered Rome, he is said to have carried it to Carthage (A.D. 455). It was recaptured by Belisarius (A.D. 533), and carried to Constantinople and thence to Jerusalem, where it finally disappeared.";
eastonArray["$$T0000710"] = "<strong>Cane:</strong> a tall sedgy plant with a hollow stem, growing in moist places. In <a href=\"#\" onClick=\"return mV('Isa',43,24);\">Isa 43:24</a>; <a href=\"#\" onClick=\"return mV('Jer',6,20);\">Jer 6:20</a>, the Hebrew word <i>kaneh</i> is thus rendered, giving its name to the plant. It is rendered \"reed\" in <a href=\"#\" onClick=\"return mV('1Ki',14,15);\">1Ki 14:15</a>; <a href=\"#\" onClick=\"return mV('Job',40,21);\">Job 40:21</a>; <a href=\"#\" onClick=\"return mV('Isa',19,6);\">Isa 19:6</a>; <a href=\"#\" onClick=\"return mV('Isa',35,7);\">35:7</a>. In <a href=\"#\" onClick=\"return mV('Psa',68,30);\">Psa 68:30</a> the expression \"company of spearmen\" is in the margin and the Revised Version \"beasts of the reeds,\" referring probably to the crocodile or the hippopotamus as a symbol of Egypt. In <a href=\"#\" onClick=\"return mV('2Ki',18,21);\">2Ki 18:21</a>; <a href=\"#\" onClick=\"return mV('Isa',36,6);\">Isa 36:6</a>; <a href=\"#\" onClick=\"return mV('Eze',29,6,7);\">Eze 29:6-7</a>, the reference is to the weak, fragile nature of the reed. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000689');\">CALAMUS</a>.)";
eastonArray["$$T0000711"] = "<strong>Canker:</strong> a gangrene or mortification which gradually spreads over the whole body (<a href=\"#\" onClick=\"return mV('2Ti',2,17);\">2Ti 2:17</a>). In <a href=\"#\" onClick=\"return mV('Jam',5,3);\">Jam 5:3</a> \"cankered\" means \"rusted\" (R.V.) or tarnished.";
eastonArray["$$T0000712"] = "<strong>Cankerworm:</strong> (Heb. yelek), \"the licking locust,\" which licks up the grass of the field; probably the locust at a certain stage of its growth, just as it emerges from the caterpillar state (<a href=\"#\" onClick=\"return mV('Joe',1,4);\">Joe 1:4</a>; <a href=\"#\" onClick=\"return mV('Joe',2,25);\">2:25</a>). The word is rendered \"caterpillar\" in <a href=\"#\" onClick=\"return mV('Psa',105,34);\">Psa 105:34</a>; <a href=\"#\" onClick=\"return mV('Jer',51,14,17);\">Jer 51:14, 17</a> (but R.V. \"canker-worm\"). \"It spoileth and fleeth away\" (<a href=\"#\" onClick=\"return mV('Nah',3,16);\">Nah 3:16</a>), or as some read the passage, \"The cankerworm putteth off [i.e., the envelope of its wings], and fleeth away.\"";
eastonArray["$$T0000713"] = "<strong>Canneh:</strong> Mentioned only in <a href=\"#\" onClick=\"return mV('Eze',27,23);\">Eze 27:23</a>. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000696');\">CALNEH</a>.)";
eastonArray["$$T0000714"] = "<strong>Canon:</strong> This word is derived from a Hebrew and Greek word denoting a reed or cane. Hence it means something straight, or something to keep straight; and hence also a rule, or something ruled or measured. It came to be applied to the Scriptures, to denote that they contained the authoritative rule of faith and practice, the standard of doctrine and duty. A book is said to be of canonical authority when it has a right to take a place with the other books which contain a revelation of the Divine will. Such a right does not arise from any ecclesiastical authority, but from the evidence of the inspired authorship of the book. The canonical (i.e., the inspired) books of the Old and New Testaments, are a complete rule, and the only rule, of faith and practice. They contain the whole supernatural revelation of God to men. The New Testament Canon was formed gradually under divine guidance. The different books as they were written came into the possession of the Christian associations which began to be formed soon after the day of Pentecost; and thus slowly the canon increased till all the books were gathered together into one collection containing the whole of the twenty-seven New Testament inspired books. Historical evidence shows that from about the middle of the second century this New Testament collection was substantially such as we now possess. Each book contained in it is proved to have, on its own ground, a right to its place; and thus the whole is of divine authority.<br><br>The Old Testament Canon is witnessed to by the New Testament writers. Their evidence is conclusive. The quotations in the New from the Old are very numerous, and the references are much more numerous. These quotations and references by our Lord and the apostles most clearly imply the existence at that time of a well-known and publicly acknowledged collection of Hebrew writings under the designation of \"The Scriptures;\" \"The Law and the Prophets and the Psalms;\" \"Moses and the Prophets,\" etc. The appeals to these books, moreover, show that they were regarded as of divine authority, finally deciding all questions of which they treat; and that the whole collection so recognized consisted only of the thirty-nine books which we now posses. Thus they endorse as genuine and authentic the canon of the Jewish Scriptures. The Septuagint Version (q.v.) also contained every book we now have in the Old Testament Scriptures. As to the time at which the Old Testament canon was closed, there are many considerations which point to that of Ezra and Nehemiah, immediately after the return from Babylonian exile. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000580');\">BIBLE</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0001294');\">EZRA</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0003039');\">QUOTATIONS</a>.)";
eastonArray["$$T0000715"] = "<strong>Capernaum:</strong> Nahum's town, a Galilean city frequently mentioned in the history of our Lord. It is not mentioned in the Old Testament. After our Lord's expulsion from Nazareth (<a href=\"#\" onClick=\"return mV('Mat',4,'13-16');\">Mat 4:13-16</a>; <a href=\"#\" onClick=\"return mV('Luk',4,'16-31');\">Luk 4:16-31</a>), Capernaum became his \"own city.\" It was the scene of many acts and incidents of his life (<a href=\"#\" onClick=\"return mV('Mat',8,514,15);\">Mat 8:5, 14-15</a>; <a href=\"#\" onClick=\"return mV('Mat',9,'2-6','10-17');\">9:2-6, 10-17</a>; <a href=\"#\" onClick=\"return mV('Mat',15,'1-20');\">15:1-20</a>; <a href=\"#\" onClick=\"return mV('Mar',1,'32-34');\">Mar 1:32-34</a>, etc.). The impenitence and unbelief of its inhabitants after the many evidences our Lord gave among them of the truth of his mission, brought down upon them a heavy denunciation of judgement (<a href=\"#\" onClick=\"return mV('Mat',11,23);\">Mat 11:23</a>).<br><br>It stood on the western shore of the Sea of Galilee. The \"land of Gennesaret,\" near, if not in, which it was situated, was one of the most prosperous and crowded districts of Palestine. This city lay on the great highway from Damascus to Acco and Tyre. It has been identified with Tell Hum, about two miles south-west of where the Jordan flows into the lake. Here are extensive ruins of walls and foundations, and also the remains of what must have been a beautiful synagogue, which it is conjectured may have been the one built by the centurion (<a href=\"#\" onClick=\"return mV('Luk',7,5);\">Luk 7:5</a>), in which our Lord frequently taught (<a href=\"#\" onClick=\"return mV('Jhn',6,59);\">Jhn 6:59</a>; <a href=\"#\" onClick=\"return mV('Mar',1,21);\">Mar 1:21</a>; <a href=\"#\" onClick=\"return mV('Luk',4,33);\">Luk 4:33</a>). Others have conjectured that the ruins of the city are to be found at Khan Minyeh, some three miles further to the south on the shore of the lake. \"If Tell Hum be Capernaum, the remains spoken of are without doubt the ruins of the synagogue built by the Roman centurion, and one of the most sacred places on earth. It was in this building that our Lord gave the well-known discourse in <a href=\"#\" onClick=\"return mV('Jhn',6,'1-');\">John 6</a>; and it was not without a certain strange feeling that on turning over a large block we found the pot of manna engraved on its face, and remembered the words, 'I am that bread of life: your fathers did eat manna in the wilderness, and are dead.'\", (The Recovery of Jerusalem.)";
eastonArray["$$T0000716"] = "<strong>Caphtor:</strong> a chaplet, the original seat of the Philistines (<a href=\"#\" onClick=\"return mV('Deu',2,23);\">Deu 2:23</a>; <a href=\"#\" onClick=\"return mV('Jer',47,4);\">Jer 47:4</a>; <a href=\"#\" onClick=\"return mV('Amo',9,7);\">Amo 9:7</a>). The name is found written in hieroglyphics in the temple of Kom Ombos in Upper Egypt. But the exact situation of Caphtor is unknown, though it is supposed to be Crete, since the Philistines seem to be meant by the \"Cherethites\" in <a href=\"#\" onClick=\"return mV('1Sa',30,14);\">1Sa 30:14</a> (also <a href=\"#\" onClick=\"return mV('2Sa',8,18);\">2Sa 8:18</a>). It may, however, have been a part of Egypt, the Caphtur in the north Delta, since the Caphtorim were of the same race as the Mizraite people (<a href=\"#\" onClick=\"return mV('Gen',10,14);\">Gen 10:14</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,12);\">1Ch 1:12</a>).";
eastonArray["$$T0000717"] = "<strong>Cappadocia:</strong> the easternmost and the largest province of Asia Minor. Christianity very early penetrated into this country (<a href=\"#\" onClick=\"return mV('1Pe',1,1);\">1Pe 1:1</a>). On the day of Pentecost there were Cappadocians at Jerusalem (<a href=\"#\" onClick=\"return mV('Act',2,9);\">Act 2:9</a>).";
eastonArray["$$T0000718"] = "<strong>Captain:</strong><br><<br>(1.) Heb. sar (<a href=\"#\" onClick=\"return mV('1Sa',22,2);\">1Sa 22:2</a>; <a href=\"#\" onClick=\"return mV('2Sa',23,19);\">2Sa 23:19</a>). Rendered \"chief,\" <a href=\"#\" onClick=\"return mV('Gen',40,2);\">Gen 40:2</a>; <a href=\"#\" onClick=\"return mV('Gen',41,9);\">41:9</a>; rendered also \"prince,\" <a href=\"#\" onClick=\"return mV('Dan',1,7);\">Dan 1:7</a>; \"ruler,\" <a href=\"#\" onClick=\"return mV('Jdg',9,30);\">Jdg 9:30</a>; \"governor,' <a href=\"#\" onClick=\"return mV('1Ki',22,26);\">1Ki 22:26</a>. This same Hebrew word denotes a military captain (<a href=\"#\" onClick=\"return mV('Exd',18,21);\">Exd 18:21</a>; <a href=\"#\" onClick=\"return mV('2Ki',1,9);\">2Ki 1:9</a>; <a href=\"#\" onClick=\"return mV('Deu',1,15);\">Deu 1:15</a>; <a href=\"#\" onClick=\"return mV('1Sa',18,13);\">1Sa 18:13</a>, etc.), the \"captain of the body-guard\" (<a href=\"#\" onClick=\"return mV('Gen',37,36);\">Gen 37:36</a>; <a href=\"#\" onClick=\"return mV('Gen',39,1);\">39:1</a>; <a href=\"#\" onClick=\"return mV('Gen',41,10);\">41:10</a>; <a href=\"#\" onClick=\"return mV('Jer',40,1);\">Jer 40:1</a>), or, as the word may be rendered, \"chief of the executioners\" (marg.). The officers of the king's body-guard frequently acted as executioners. Nebuzar-adan (<a href=\"#\" onClick=\"return mV('Jer',39,13);\">Jer 39:13</a>) and Arioch (<a href=\"#\" onClick=\"return mV('Dan',2,14);\">Dan 2:14</a>) held this office in Babylon.<br><br>The \"captain of the guard\" mentioned in <a href=\"#\" onClick=\"return mV('Act',28,16);\">Act 28:16</a> was the Praetorian prefect, the commander of the Praetorian troops.<br><br>(2.) Another word (Heb. katsin) so translated denotes sometimes a military (<a href=\"#\" onClick=\"return mV('Jos',10,24);\">Jos 10:24</a>; <a href=\"#\" onClick=\"return mV('Jdg',11,6,11);\">Jdg 11:6, 11</a>; <a href=\"#\" onClick=\"return mV('Isa',22,3);\">Isa 22:3</a> \"rulers; <a href=\"#\" onClick=\"return mV('Dan',11,18);\">Dan 11:18</a>) and sometimes a civil command, a judge, magistrate, Arab. <i>kady</i>, (<a href=\"#\" onClick=\"return mV('Isa',1,10);\">Isa 1:10</a>; <a href=\"#\" onClick=\"return mV('Isa',3,6);\">3:6</a>; <a href=\"#\" onClick=\"return mV('Mic',3,1,9);\">Mic 3:1, 9</a>).<br><br>(3.) It is also the rendering of a Hebrew word (shalish) meaning \"a third man,\" or \"one of three.\" The LXX. render in plural by <i>tristatai</i>; i.e., \"soldiers fighting from chariots,\" so called because each war-chariot contained three men, one of whom acted as charioteer while the other two fought (<a href=\"#\" onClick=\"return mV('Exd',14,7);\">Exd 14:7</a>; <a href=\"#\" onClick=\"return mV('Exd',15,4);\">15:4</a>; <a href=\"#\" onClick=\"return mV('1Ki',9,22);\">1Ki 9:22</a>; <a href=\"#\" onClick=\"return mV('2Ki',9,25);\">2Ki 9:25</a>). This word is used also to denote the king's body-guard (<a href=\"#\" onClick=\"return mV('2Ki',10,25);\">2Ki 10:25</a>; <a href=\"#\" onClick=\"return mV('1Ch',12,18);\">1Ch 12:18</a>; <a href=\"#\" onClick=\"return mV('2Ch',11,11);\">2Ch 11:11</a>) or aides-de-camp.<br><br>(4.) The \"captain of the temple\" mentioned in <a href=\"#\" onClick=\"return mV('Act',4,1);\">Act 4:1</a> and <a href=\"#\" onClick=\"return mV('Act',5,24);\">5:24</a> was not a military officer, but superintendent of the guard of priests and Levites who kept watch in the temple by night. (<a href=\"#\" onClick=\"return mV('1Ch',9,11);\">1Ch 9:11</a>; <a href=\"#\" onClick=\"return mV('2Ch',31,13);\">2Ch 31:13</a>; <a href=\"#\" onClick=\"return mV('Neh',11,11);\">Neh 11:11</a>.)<br><br>(5.) The Captain of our salvation is a name given to our Lord (<a href=\"#\" onClick=\"return mV('Hbr',2,10);\">Hbr 2:10</a>), because he is the author and source of our salvation, the head of his people, whom he is conducting to glory. The \"captain of the Lord's host\" (<a href=\"#\" onClick=\"return mV('Jos',5,14,15);\">Jos 5:14-15</a>) is the name given to that mysterious person who manifested himself to Abraham (<a href=\"#\" onClick=\"return mV('Gen',12,7);\">Gen 12:7</a>), and to Moses in the bush (<a href=\"#\" onClick=\"return mV('Exd',3,2,6);\">Exd 3:2, 6</a>, etc.) the Angel of the covenant. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000240');\">ANGEL</a>.)";
eastonArray["$$T0000719"] = "<strong>Captive:</strong> one taken in war. Captives were often treated with great cruelty and indignity (<a href=\"#\" onClick=\"return mV('1Ki',20,32);\">1Ki 20:32</a>; <a href=\"#\" onClick=\"return mV('Jos',10,24);\">Jos 10:24</a>; <a href=\"#\" onClick=\"return mV('Jdg',1,7);\">Jdg 1:7</a>; <a href=\"#\" onClick=\"return mV('2Sa',4,12);\">2Sa 4:12</a>; <a href=\"#\" onClick=\"return mV('Jdg',8,7);\">Jdg 8:7</a>; <a href=\"#\" onClick=\"return mV('2Sa',12,31);\">2Sa 12:31</a>; <a href=\"#\" onClick=\"return mV('1Ch',20,3);\">1Ch 20:3</a>). When a city was taken by assault, all the men were slain, and the women and children carried away captive and sold as slaves (<a href=\"#\" onClick=\"return mV('2Ch',28,'9-15');\">2Ch 28:9-15</a>; <a href=\"#\" onClick=\"return mV('Psa',44,12);\">Psa 44:12</a>; <a href=\"#\" onClick=\"return mV('Joe',3,3);\">Joe 3:3</a>), and exposed to the most <a href=\"#\" onClick=\"return mV('Isa',20,'1-')\">Isa 20</a>; <a href=\"#\" onClick=\"return mV('Isa',47,3);\">47:3</a>; <a href=\"#\" onClick=\"return mV('2Ch',28,'9-15');\">2Ch 28:9-15</a>; <a href=\"#\" onClick=\"return mV('Psa',44,12);\">Psa 44:12</a>; <a href=\"#\" onClick=\"return mV('Joe',3,3);\">Joe 3:3</a>), and exposed to the most cruel treatment (<a href=\"#\" onClick=\"return mV('Nah',3,10);\">Nah 3:10</a>; <a href=\"#\" onClick=\"return mV('Zec',14,2);\">Zec 14:2</a>; <a href=\"#\" onClick=\"return mV('Est',3,13);\">Est 3:13</a>; <a href=\"#\" onClick=\"return mV('2Ki',8,12);\">2Ki 8:12</a>; <a href=\"#\" onClick=\"return mV('Isa',13,16,18);\">Isa 13:16, 18</a>). Captives were sometimes carried away into foreign countries, as was the case with the Jews (<a href=\"#\" onClick=\"return mV('Jer',20,5);\">Jer 20:5</a>; <a href=\"#\" onClick=\"return mV('Jer',39,9,10);\">39:9-10</a>; <a href=\"#\" onClick=\"return mV('Jer',40,7);\">40:7</a>).";
eastonArray["$$T0000720"] = "<strong>Captivity:</strong><br><br>(1.) Of Israel. The kingdom of the ten tribes was successively invaded by several Assyrian kings. Pul (q.v.) imposed a tribute on Menahem of a thousand talents of silver (<a href=\"#\" onClick=\"return mV('2Ki',15,19,20);\">2Ki 15:19-20</a,; <a href=\"#\" onClick=\"return mV('1Ch',5,26);\">1Ch 5:26</a>) (B.C. 762), and Tiglath-pileser, in the days of Pekah (B.C. 738), carried away the trans-Jordanic tribes and the inhabitants of Galilee into Assyria (<a href=\"#\" onClick=\"return mV('2Ki',15,29);\">2Ki 15:29</a>; <a href=\"#\" onClick=\"return mV('Isa',9,1);\">Isa 9:1</a>). Subsequently Shalmaneser invaded Israel and laid siege to Samaria, the capital of the kingdom. During the siege he died, and was succeeded by Sargon, who took the city, and transported the great mass of the people into Assyria (B.C. 721), placing them in Halah and in Habor, and in the cities of the Medes (<a href=\"#\" onClick=\"return mV('2Ki',17,3,5);\">2Ki 17:3, 5</a>). Samaria was never again inhabited by the Israelites. The families thus removed were carried to distant cities, many of them not far from the Caspian Sea, and their place was supplied by colonists from Babylon and Cuthah, etc. (<a href=\"#\" onClick=\"return mV('2Ki',17,24);\">2Ki 17:24</a>). Thus terminated the kingdom of the ten tribes, after a separate duration of two hundred and fifty-five years (B.C. 975-721).<br><br>Many speculations have been indulged in with reference to these ten tribes. But we believe that all, except the number that probably allied themselves with Judah and shared in their restoration under Cyrus, are finally lost.<br><br>\"Like the dew on the mountain, Like the foam on the river, Like the bubble on the fountain, They are gone, and for ever.\"<br><br>(2.) Of Judah. In the third year of Jehoiachim, the eighteenth king of Judah (B.C. 605), Nebuchadnezzar having overcome the Egyptians at Carchemish, advanced to Jerusalem with a great army. After a brief siege he took that city, and carried away the vessels of the sanctuary to Babylon, and dedicated them in the Temple of Belus (<a href=\"#\" onClick=\"return mV('2Ki',24,1);\">2Ki 24:1</a>; <a href=\"#\" onClick=\"return mV('2Ch',36,6,7);\">2Ch 36:6-7</a>; <a href=\"#\" onClick=\"return mV('Dan',1,1,2);\">Dan 1:1-2</a>). He also carried away the treasures of the king, whom he made his vassal. At this time, from which is dated the \"seventy years\" of captivity (<a href=\"#\" onClick=\"return mV('Jer',25,'1-')\">Jer 25</a>; <a href=\"#\" onClick=\"return mV('Dan',9,1,2);\">Dan 9:1-2</a>), Daniel and his companions were carried to Babylon, there to be brought up at the court and trained in all the learning of the Chaldeans. After this, in the fifth year of Jehoiakim, a great national fast was appointed (<a href=\"#\" onClick=\"return mV('Jer',36,9);\">Jer 36:9</a>), during which the king, to show his defiance, cut up the leaves of the book of Jeremiah's prophecies as they were read to him in his winter palace, and threw them into the fire. In the same spirit he rebelled against Nebuchadnezzar (<a href=\"#\" onClick=\"return mV('2Ki',24,1);\">2Ki 24:1</a>), who again a second time (B.C. 598) marched against Jerusalem, and put Jehoiachim to death, placing his son Jehoiachin on the throne in his stead. But Jehoiachin's counsellors displeasing Nebuchadnezzar, he again a third time turned his army against Jerusalem, and carried away to Babylon a second detachment of Jews as captives, to the number of 10,000 (<a href=\"#\" onClick=\"return mV('2Ki',24,13);\">2Ki 24:13</a>; <a href=\"#\" onClick=\"return mV('Jer',24,1);\">Jer 24:1</a>; <a href=\"#\" onClick=\"return mV('2Ch',36,10);\">2Ch 36:10</a>), among whom were the king, with his mother and all his princes and officers, also Ezekiel, who with many of his companions were settled on the banks of the river Chebar (q.v.). He also carried away all the remaining treasures of the temple and the palace, and the golden vessels of the sanctuary.<br><br>Mattaniah, the uncle of Jehoiachin, was now made king over what remained of the kingdom of Judah, under the name of Zedekiah (<a href=\"#\" onClick=\"return mV('2Ki',24,17);\">2Ki 24:17</a>; <a href=\"#\" onClick=\"return mV('2Ch',36,10);\">2Ch 36:10</a>). After a troubled reign of eleven years his kingdom came to an end (<a href=\"#\" onClick=\"return mV('2Ch',36,11);\">2Ch 36:11</a>). Nebuchadnezzar, with a powerful army, besieged Jerusalem, and Zedekiah became a prisoner in Babylon. His eyes were put out, and he was kept in close confinement till his death (<a href=\"#\" onClick=\"return mV('2Ki',25,7);\">2Ki 25:7</a>). The city was spoiled of all that was of value, and then given up to the flames. The temple and palaces were consumed, and the walls of the city were levelled with the ground (B.C. 586), and all that remained of the people, except a number of the poorest class who were left to till the ground and dress the vineyards, were carried away captives to Babylon. This was the third and last deportation of Jewish captives. The land was now utterly desolate, and was abondoned to anarchy.<br><br>In the first year of his reign as king of Babylon (B.C. 536), Cyrus issued a decree liberating the Jewish captives, and permitting them to return to Jerusalem and rebuild the city and the temple (<a href=\"#\" onClick=\"return mV('2Ch',36,22,23);\">2Ch 36:22-23</a>; <a href=\"#\" onClick=\"return mV('Ezr',1,'1-')\">Ezr 1</a>; <a href=\"#\" onClick=\"return mV('Ezr',2,'1-')\">2</a>). The number of the people forming the first caravan, under Zerubbabel, amounted in all to 42,360 (<a href=\"#\" onClick=\"return mV('Ezr',2,64,65);\">Ezr 2:64-65</a>), besides 7,337 men-servants and maid-servants. A considerable number, 12,000 probably, from the ten tribes who had been carried away into Assyria no doubt combined with this band of liberated captives.<br><br>At a later period other bands of the Jews returned <br><br>(1) under Ezra (<a href=\"#\" onClick=\"return mV('Ezr',7,7);\">Ezr 7:7</a>) (B.C. 458), and<br><br>(2) Nehemiah (<a href=\"#\" onClick=\"return mV('Neh',7,66);\">Neh 7:66</a>) (B.C. 445). But the great mass of the people remained still in the land to which they had been carried, and became a portion of the Jews of the \"dispersion\" (<a href=\"#\" onClick=\"return mV('Jhn',7,35);\">Jhn 7:35</a>; <a href=\"#\" onClick=\"return mV('1Pe',1,1);\">1Pe 1:1</a>). The whole number of the exiles that chose to remain was probably about six times the number of those who returned.";
eastonArray["$$T0000721"] = "<strong>Carbuncle:</strong> (<a href=\"#\" onClick=\"return mV('Exd',28,17);\">Exd 28:17</a>; <a href=\"#\" onClick=\"return mV('Exd',39,10);\">39:10</a>; <a href=\"#\" onClick=\"return mV('Eze',28,13);\">Eze 28:13</a>). Heb. barkath; LXX. smaragdos; Vulgate, smaragdus; Revised Version, marg., \"emerald.\" The Hebrew word is from a root meaning \"to glitter,\" \"lighten,\" \"flash.\" When held up to the sun, this gem shines like a burning coal, a dark-red glowing coal, and hence is called \"carbunculus\", i.e., a little coal. It was one of the jewels in the first row of the high priest's breastplate. It has been conjectured by some that the garnet is meant. In <a href=\"#\" onClick=\"return mV('Isa',54,12);\">Isa 54:12</a> the Hebrew word is <i>'ekdah</i>, used in the prophetic description of the glory and beauty of the mansions above. Next to the diamond it is the hardest and most costly of all precious stones.";
eastonArray["$$T0000722"] = "<strong>Carcase:</strong> contact with a, made an Israelite ceremonially unclean, and made whatever he touched also unclean, according to the Mosaic law (<a href=\"#\" onClick=\"return mV('Hag',2,13);\">Hag 2:13</a>; <a href=\"#\" onClick=\"return mV('Num',19,16,22);\">Num 19:16, 22</a>; <a href=\"#\" onClick=\"return mV('Lev',11,39);\">Lev 11:39</a>).";
eastonArray["$$T0000723"] = "<strong>Carchemish:</strong> fortress of Chemosh, a city on the west bank of the Euphrates (<a href=\"#\" onClick=\"return mV('Jer',46,2);\">Jer 46:2</a>; <a href=\"#\" onClick=\"return mV('2Ch',35,20);\">2Ch 35:20</a>), not, as was once supposed, the Circesium at the confluence of the Chebar and the Euphrates, but a city considerably higher up the river, and commanding the ordinary passage of the Euphrates; probably identical with Hierapolis. It was the capital of the kingdom of the northern Hittites. The Babylonian army, under Nebuchadnezzar, the son of Nabopolassar, here met and conquered the army of Pharaoh-necho, king of Egypt (B.C. 607). It is mentioned in monuments in B.C. 1600 and down to B.C. 717.";
eastonArray["$$T0000724"] = "<strong>Carmel:</strong> a park; generally with the article, \"the park.\"<br><br>(1.) A prominent headland of Central Palestine, consisting of several connected hills extending from the plain of Esdraelon to the sea, a distance of some 12 miles or more. At the east end, in its highest part, it is 1,728 feet high, and at the west end it forms a promontory to the bay of Acre about 600 feet above the sea. It lay within the tribe of Asher. It was here, at the east end of the ridge, at a place called el-Mukhrakah (i.e., the place of burning), that Elijah brought back the people to their allegiance to God, and slew the prophets of Baal (place of burning), that Elijah brought back the people to their <a href=\"#\" onClick=\"return mV('1Ki',18,'1-')\">1Ki 18</a>). Here were consumed the \"fifties\" of the royal guard; and here also Elisha received the visit of the bereaved mother whose son was restored by him to life (<a href=\"#\" onClick=\"return mV('2Ki',4,'25-37');\">2Ki 4:25-37</a>). \"No mountain in or around Palestine retains its ancient beauty so much as Carmel. Two or three villages and some scattered cottages are found on it; its groves are few but luxuriant; it is no place for crags and precipices or rocks of wild goats; but its surface is covered with a rich and constant verdure.\" \"The whole mountain-side is dressed with blossom, and flowering shrubs, and fragrant herbs.\" The western extremity of the ridge is, however, more rocky and bleak than the eastern. The head of the bride in <a href=\"#\" onClick=\"return mV('Sgs',7,5);\">Sgs 7:5</a> is compared to Carmel. It is ranked with Bashan on account of its rich pastures (<a href=\"#\" onClick=\"return mV('Isa',33,9);\">Isa 33:9</a>; <a href=\"#\" onClick=\"return mV('Jer',50,19);\">Jer 50:19</a>; <a href=\"#\" onClick=\"return mV('Amo',1,2);\">Amo 1:2</a>). The whole ridge is deeply furrowed with rocky ravines filled with dense jungle. There are many caves in its sides, which at one time were inhabited by swarms of monks. These caves are referred to in <a href=\"#\" onClick=\"return mV('Amo',9,3);\">Amo 9:3</a>. To them Elijah and Elisha often resorted (<a href=\"#\" onClick=\"return mV('1Ki',18,19,42);\">1Ki 18:19, 42</a>; <a href=\"#\" onClick=\"return mV('2Ki',2,25);\">2Ki 2:25</a>). On its north-west summit there is an ancient establishment of Carmelite monks. Vineyards have recently been planted on the mount by the German colonists of Haifa. The modern Arabic name of the mount is Kurmul, but more commonly Jebel Mar Elyas, i.e., Mount St. Elias, from the Convent of Elias.<br><br>(2.) A town in the hill country of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,55);\">Jos 15:55</a>), the residence of Nabal (<a href=\"#\" onClick=\"return mV('1Sa',25,2,5,7,40);\">1Sa 25:2, 5, 7, 40</a>), and the native place of Abigail, who became David's wife (<a href=\"#\" onClick=\"return mV('1Sa',27,3);\">1Sa 27:3</a>). Here king Uzziah had his vineyards (<a href=\"#\" onClick=\"return mV('2Ch',26,10);\">2Ch 26:10</a>). The ruins of this town still remain under the name of Kurmul, about 10 miles south-south-east of Hebron, close to those of Maon.";
eastonArray["$$T0000725"] = "<strong>Carmi:</strong> vine-dresser.<br><br>(1.) The last named of the four sons of Reuben (<a href=\"#\" onClick=\"return mV('Gen',46,9);\">Gen 46:9</a>).<br><br>(2.) A descendant of Judah (<a href=\"#\" onClick=\"return mV('1Ch',4,1);\">1Ch 4:1</a>). He is elsewhere (<a href=\"#\" onClick=\"return mV('1Ch',2,18);\">2:18</a>) called Caleb (q.v.).<br><br>(3.) The son of Zimri, and the father of Achan (<a href=\"#\" onClick=\"return mV('Jos',7,1);\">Jos 7:1</a>), \"the troubler of Israel.\"";
eastonArray["$$T0000726"] = "<strong>Carnal:</strong> Unconverted men are so called (<a href=\"#\" onClick=\"return mV('1Cr',3,3);\">1Cr 3:3</a>). They are represented as of a \"carnal mind, which is enmity against God\" (<a href=\"#\" onClick=\"return mV('Rom',8,6,7);\">Rom 8:6-7</a>). Enjoyments that minister to the wants and desires of man's animal nature are so called (<a href=\"#\" onClick=\"return mV('Rom',15,27);\">Rom 15:27</a>; <a href=\"#\" onClick=\"return mV('1Cr',9,11);\">1Cr 9:11</a>). The ceremonial of the Mosaic law is spoken of as \"carnal,\" because it related to things outward, the bodies of men and of animals, and the purification of the flesh (<a href=\"#\" onClick=\"return mV('Hbr',7,16);\">Hbr 7:16</a>; <a href=\"#\" onClick=\"return mV('Hbr',9,10);\">9:10</a>). The weapons of Christian warfare are \"not carnal\", that is, they are not of man's device, nor are wielded by human power (<a href=\"#\" onClick=\"return mV('2Cr',10,4);\">2Cr 10:4</a>).";
eastonArray["$$T0000727"] = "<strong>Carpenter:</strong> an artificer in stone, iron, and copper, as well as in wood (<a href=\"#\" onClick=\"return mV('2Sa',5,11);\">2Sa 5:11</a>; <a href=\"#\" onClick=\"return mV('1Ch',14,1);\">1Ch 14:1</a>; <a href=\"#\" onClick=\"return mV('Mar',6,3);\">Mar 6:3</a>). The tools used by carpenters are mentioned in <a href=\"#\" onClick=\"return mV('1Sa',13,19,20);\">1Sa 13:19-20</a>; <a href=\"#\" onClick=\"return mV('Jdg',4,21);\">Jdg 4:21</a>; <a href=\"#\" onClick=\"return mV('Isa',10,15);\">Isa 10:15</a>; <a href=\"#\" onClick=\"return mV('Isa',44,13);\">44:13</a>. It was said of our Lord, \"Is not this the carpenter's son?\" (<a href=\"#\" onClick=\"return mV('Mat',13,55);\">Mat 13:55</a>); also, \"Is not this the carpenter?\" (<a href=\"#\" onClick=\"return mV('Mar',6,3);\">Mar 6:3</a>). Every Jew, even the rabbis, learned some handicraft: Paul was a tentmaker. \"In the cities the carpenters would be Greeks, and skilled workmen; the carpenter of a provincial village could only have held a very humble position, and secured a very moderate competence.\"";
eastonArray["$$T0000728"] = "<strong>Carriage:</strong> In the Authorized Version this word is found as the rendering of many different words. In <a href=\"#\" onClick=\"return mV('Jdg',18,21);\">Jdg 18:21</a> it means valuables, wealth, or booty. In <a href=\"#\" onClick=\"return mV('Isa',46,1);\">Isa 46:1</a> (R.V., \"the things that ye carried about\") the word means a load for a beast of burden. In <a href=\"#\" onClick=\"return mV('1Sa',17,22);\">1Sa 17:22</a> and <a href=\"#\" onClick=\"return mV('Isa',10,28);\">Isa 10:28</a> it is the rendering of a word (in <a href=\"#\" onClick=\"return mV('1Sa',10,22);\">1Sa 10:22</a>) meaning implements, equipments, baggage. The phrase in <a href=\"#\" onClick=\"return mV('Act',21,15);\">Act 21:15</a>, \"We took up our carriages,\" means properly, \"We packed up our baggage,\" as in the Revised Version.";
eastonArray["$$T0000729"] = "<strong>Cart:</strong> a vehicle moving on wheels, and usually drawn by oxen (<a href=\"#\" onClick=\"return mV('2Sa',6,3);\">2Sa 6:3</a>). The Hebrew word thus rendered, <i>'agalah</i> (<a href=\"#\" onClick=\"return mV('1Sa',6,7,8);\">1Sa 6:7-8</a>), is also rendered \"wagon\" (<a href=\"#\" onClick=\"return mV('Gen',45,19);\">Gen 45:19</a>). It is used also to denote a war-chariot (<a href=\"#\" onClick=\"return mV('Psa',46,9);\">Psa 46:9</a>). Carts were used for the removal of the ark and its sacred utensils (<a href=\"#\" onClick=\"return mV('Num',7,3,6);\">Num 7:3, 6</a>). After retaining the ark amongst them for seven months, the Philistines sent it back to the Israelites. On this occasion they set it in a new cart, probably a rude construction, with solid wooden wheels like that still used in Western Asia, which was drawn by two milch cows, which conveyed it straight to Beth-shemesh.<br><br>A \"cart rope,\" for the purpose of fastening loads on carts, is used (<a href=\"#\" onClick=\"return mV('Isa',5,18);\">Isa 5:18</a>) as a symbol of the power of sinful pleasures or habits over him who indulges them. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000898');\">CORD</a>.) In Syria and Palestine wheel-carriages for any other purpose than the conveyance of agricultural produce are almost unknown.";
eastonArray["$$T0000730"] = "<strong>Carve:</strong> The arts of engraving and carving were much practised among the Jews. They were practised in connection with the construction of the tabernacle and the temple (<a href=\"#\" onClick=\"return mV('Exd',31,2,5);\">Exd 31:2, 5</a>; <a href=\"#\" onClick=\"return mV('Exd',35,33);\">35:33</a>; <a href=\"#\" onClick=\"return mV('1Ki',6,18,35);\">1Ki 6:18, 35</a>; <a href=\"#\" onClick=\"return mV('Psa',74,6);\">Psa 74:6</a>), as well as in the ornamentation of the priestly dresses (<a href=\"#\" onClick=\"return mV('Exd',28,'9-36');\">Exd 28:9-36</a>; <a href=\"#\" onClick=\"return mV('Zec',3,9);\">Zec 3:9</a>; <a href=\"#\" onClick=\"return mV('2Ch',2,7,14);\">2Ch 2:7, 14</a>). Isaiah (<a href=\"#\" onClick=\"return mV('Isa',44,'13-17');\">Isa 44:13-17</a>) gives a minute description of the process of carving idols of wood.";
eastonArray["$$T0000731"] = "<strong>Casement:</strong> a barrier of open-work placed before windows (<a href=\"#\" onClick=\"return mV('Pro',7,6);\">Pro 7:6</a>). In <a href=\"#\" onClick=\"return mV('Jdg',5,28);\">Jdg 5:28</a> the Hebrew word is rendered \"lattice,\" in the LXX. \"network,\" an opening through which cool air is admitted.";
eastonArray["$$T0000732"] = "<strong>Casiphia:</strong> silver, a place between Babylon and Jerusalem, where Iddo resided (<a href=\"#\" onClick=\"return mV('Ezr',8,17);\">Ezr 8:17</a>); otherwise unknown.";
eastonArray["$$T0000733"] = "<strong>Casluhim:</strong> fortified, a people descended from Mizraim (<a href=\"#\" onClick=\"return mV('Gen',10,14);\">Gen 10:14</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,12);\">1Ch 1:12</a>). Their original seat was probably somewhere in Lower Egypt, along the sea-coast to the south border of Palestine.";
eastonArray["$$T0000734"] = "<strong>Cassia:</strong><br><br>(1.) Hebrew <i>kiddah'</i>, i.e., \"split.\" One of the principal spices of the holy anointing oil (<a href=\"#\" onClick=\"return mV('Exd',30,24);\">Exd 30:24</a>), and an article of commerce (<a href=\"#\" onClick=\"return mV('Eze',27,19);\">Eze 27:19</a>). It is the inner bark of a tree resembling the cinnamon (q.v.), the Cinnamomum cassia of botanists, and was probably imported from India.<br><br>(2.) Hebrew pl. <i>ketzi'oth</i> (<a href=\"#\" onClick=\"return mV('Psa',45,8);\">Psa 45:8</a>). Mentioned in connection with myrrh and aloes as being used to scent garments. It was probably prepared from the peeled bark, as the Hebrew word suggests, of some kind of cinnamon.";
eastonArray["$$T0000735"] = "<strong>Castaway:</strong> Gr. adokimos, (<a href=\"#\" onClick=\"return mV('1Cr',9,27);\">1Cr 9:27</a>), one regarded as unworthy (R.V., \"rejected\"); elsewhere rendered \"reprobate\" (<a href=\"#\" onClick=\"return mV('2Ti',3,8);\">2Ti 3:8</a>, etc.); \"rejected\" (<a href=\"#\" onClick=\"return mV('Hbr',6,8);\">Hbr 6:8</a>, etc.).";
eastonArray["$$T0000736"] = "<strong>Castle:</strong> a military fortress (<a href=\"#\" onClick=\"return mV('1Ch',11,7);\">1Ch 11:7</a>), also probably a kind of tower used by the priests for making known anything discovered at a distance (<a href=\"#\" onClick=\"return mV('1Ch',6,54);\">1Ch 6:54</a>). Castles are also mentioned (<a href=\"#\" onClick=\"return mV('Gen',25,16);\">Gen 25:16</a>) as a kind of watch-tower, from which shepherds kept watch over their flocks by night. The \"castle\" into which the chief captain commanded Paul to be brought was the quarters of the Roman soldiers in the fortress of Antonia (so called by Herod after his patron Mark Antony), which was close to the north-west corner of the temple (<a href=\"#\" onClick=\"return mV('Act',21,34);\">Act 21:34</a>), which it commanded.";
eastonArray["$$T0000737"] = "<strong>Castor and Pollux:</strong> the \"Dioscuri\", two heroes of Greek and Roman mythology. Their figures were probably painted or sculptured on the prow of the ship which Luke refers to (<a href=\"#\" onClick=\"return mV('Act',28,11);\">Act 28:11</a>). They were regarded as the tutelary divinities of sailors. They appeared in the heavens as the constellation Gemini.";
eastonArray["$$T0000738"] = "<strong>Caterpillar:</strong> the consumer. Used in the Old Testament (<a href=\"#\" onClick=\"return mV('1Ki',8,37);\">1Ki 8:37</a>; <a href=\"#\" onClick=\"return mV('2Ch',6,28);\">2Ch 6:28</a>; <a href=\"#\" onClick=\"return mV('Psa',78,46);\">Psa 78:46</a>; <a href=\"#\" onClick=\"return mV('Isa',33,4);\">Isa 33:4</a>) as the translation of a word (hasil) the root of which means \"to devour\" or \"consume,\" and which is used also with reference to the locust in <a href=\"#\" onClick=\"return mV('Deu',28,38);\">Deu 28:38</a>. It may have been a species of locust, or the name of one of the transformations through which the locust passes, locust-grub. It is also found (<a href=\"#\" onClick=\"return mV('Psa',105,34);\">Psa 105:34</a>; <a href=\"#\" onClick=\"return mV('Jer',51,14,27);\">Jer 51:14, 27</a>; R.V., \"cankerworm\") as the rendering of a different Hebrew word, <i>yelek</i>, a word elsewhere rendered \"cankerworm\" (q.v.), <a href=\"#\" onClick=\"return mV('Joe',1,4);\">Joe 1:4</a>; <a href=\"#\" onClick=\"return mV('Joe',2,25);\">2:25</a>. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002309');\">LOCUST</a>.)";
eastonArray["$$T0000739"] = "<strong>Catholic epistles:</strong> the epistles of James, Peter, John, and Jude; so called because they are addressed to Christians in general, and not to any church or person in particular.";
eastonArray["$$T0000740"] = "<strong>Cattle:</strong> abounded in the Holy Land. To the rearing and management of them the inhabitants chiefly devoted themselves (<a href=\"#\" onClick=\"return mV('Deu',8,13);\">Deu 8:13</a>; <a href=\"#\" onClick=\"return mV('Deu',12,21);\">12:21</a>; <a href=\"#\" onClick=\"return mV('1Sa',11,5);\">1Sa 11:5</a>; <a href=\"#\" onClick=\"return mV('1Sa',12,3);\">12:3</a>; <a href=\"#\" onClick=\"return mV('Psa',144,14);\">Psa 144:14</a>; <a href=\"#\" onClick=\"return mV('Jer',3,24);\">Jer 3:24</a>). They may be classified as,<br><br>(1.) Neat cattle. Many hundreds of these were yearly consumed in sacrifices or used for food. The finest herds were found in Bashan, beyond Jordan (<a href=\"#\" onClick=\"return mV('Num',32,4);\">Num 32:4</a>). Large herds also pastured on the wide fertile plains of Sharon. They were yoked to the plough (<a href=\"#\" onClick=\"return mV('1Ki',19,19);\">1Ki 19:19</a>), and were employed for carrying burdens (<a href=\"#\" onClick=\"return mV('1Ch',12,40);\">1Ch 12:40</a>). They were driven with a pointed rod (<a href=\"#\" onClick=\"return mV('Jdg',3,31);\">Jdg 3:31</a>) or goad (q.v.).<br><br>According to the Mosaic law, the mouths of cattle employed for the threshing-floor were not to be muzzled, so as to prevent them from eating of the provender over which they trampled (<a href=\"#\" onClick=\"return mV('Deu',25,4);\">Deu 25:4</a>). Whosoever stole and sold or slaughtered an ox must give five in satisfaction (<a href=\"#\" onClick=\"return mV('Exd',22,1);\">Exd 22:1</a>); but if it was found alive in the possession of him who stole it, he was required to make double restitution only (<a href=\"#\" onClick=\"return mV('Exd',22,4);\">22:4</a>). If an ox went astray, whoever found it was required to bring it back to its owner (<a href=\"#\" onClick=\"return mV('Exd',23,4);\">23:4</a>; <a href=\"#\" onClick=\"return mV('Deu',22,1,4);\">Deu 22:1, 4</a>). An ox and an ass could not be yoked together in the plough (<a href=\"#\" onClick=\"return mV('Deu',22,10);\">Deu 22:10</a>).<br><br>(2.) Small cattle. Next to herds of neat cattle, sheep formed the most important of the possessions of the inhabitants of Palestine (<a href=\"#\" onClick=\"return mV('Gen',12,16);\">Gen 12:16</a>; <a href=\"#\" onClick=\"return mV('Gen',13,5);\">13:5</a>; <a href=\"#\" onClick=\"return mV('Gen',26,14);\">26:14</a>; <a href=\"#\" onClick=\"return mV('Gen',21,27);\">21:27</a>; <a href=\"#\" onClick=\"return mV('Gen',29,2,3);\">29:2-3</a>). They are frequently mentioned among the booty taken in war (<a href=\"#\" onClick=\"return mV('Num',31,32);\">Num 31:32</a>; <a href=\"#\" onClick=\"return mV('Jos',6,21);\">Jos 6:21</a>; <a href=\"#\" onClick=\"return mV('1Sa',14,32);\">1Sa 14:32</a>; <a href=\"#\" onClick=\"return mV('1Sa',15,3);\">15:3</a>). There were many who were owners of large flocks (<a href=\"#\" onClick=\"return mV('1Sa',25,2);\">1Sa 25:2</a>; <a href=\"#\" onClick=\"return mV('2Sa',12,2);\">2Sa 12:2</a>, comp. <a href=\"#\" onClick=\"return mV('Job',1,3);\">Job 1:3</a>). Kings also had shepherds \"over their flocks\" (<a href=\"#\" onClick=\"return mV('1Ch',27,31);\">1Ch 27:31</a>), from which they derived a large portion of their revenue (<a href=\"#\" onClick=\"return mV('2Sa',17,29);\">2Sa 17:29</a>; <a href=\"#\" onClick=\"return mV('1Ch',12,40);\">1Ch 12:40</a>). The districts most famous for their flocks of sheep were the plain of Sharon (<a href=\"#\" onClick=\"return mV('Isa',65,10);\">Isa 65:10</a>), Mount Carmel (<a href=\"#\" onClick=\"return mV('Mic',7,14);\">Mic 7:14</a>), Bashan and Gilead (<a href=\"#\" onClick=\"return mV('Mic',7,14);\">Mic 7:14</a>). In patriarchal times the flocks of sheep were sometimes tended by the daughters of the owners. Thus Rachel, the daughter of Laban, kept her father's sheep (<a href=\"#\" onClick=\"return mV('Gen',29,9);\">Gen 29:9</a>); as also Zipporah and her six sisters had charge of their father Jethro's flocks (<a href=\"#\" onClick=\"return mV('Exd',2,16);\">Exd 2:16</a>). Sometimes they were kept by hired shepherds (<a href=\"#\" onClick=\"return mV('Jhn',10,12);\">Jhn 10:12</a>), and sometimes by the sons of the family (<a href=\"#\" onClick=\"return mV('1Sa',16,11);\">1Sa 16:11</a>; <a href=\"#\" onClick=\"return mV('1Sa',17,15);\">17:15</a>). The keepers so familiarized their sheep with their voices that they knew them, and followed them at their call. Sheep, but more especially rams and lambs, were frequently offered in sacrifice. The shearing of sheep was a great festive occasion (<a href=\"#\" onClick=\"return mV('1Sa',25,4);\">1Sa 25:4</a>; <a href=\"#\" onClick=\"return mV('2Sa',13,23);\">2Sa 13:23</a>). They were folded at night, and guarded by their keepers against the attacks of the lion (<a href=\"#\" onClick=\"return mV('Mic',5,8);\">Mic 5:8</a>), the bear (<a href=\"#\" onClick=\"return mV('1Sa',17,34);\">1Sa 17:34</a>), and the wolf (<a href=\"#\" onClick=\"return mV('Mat',10,16);\">Mat 10:16</a>; <a href=\"#\" onClick=\"return mV('Jhn',10,12);\">Jhn 10:12</a>). They were liable to wander over the wide pastures and go astray (<a href=\"#\" onClick=\"return mV('Psa',119,176);\">Psa 119:176</a>; <a href=\"#\" onClick=\"return mV('Isa',53,6);\">Isa 53:6</a>; <a href=\"#\" onClick=\"return mV('Hsa',4,16);\">Hsa 4:16</a>; <a href=\"#\" onClick=\"return mV('Mat',18,12);\">Mat 18:12</a>).<br><br>Goats also formed a part of the pastoral wealth of Palestine (<a href=\"#\" onClick=\"return mV('Gen',15,9);\">Gen 15:9</a>; <a href=\"#\" onClick=\"return mV('Gen',32,14);\">32:14</a>; <a href=\"#\" onClick=\"return mV('Gen',37,31);\">37:31</a>). They were used both for sacrifice and for food (<a href=\"#\" onClick=\"return mV('Deu',14,4);\">Deu 14:4</a>), especially the young males (<a href=\"#\" onClick=\"return mV('Gen',27,9,14,17);\">Gen 27:9, 14, 17</a>; <a href=\"#\" onClick=\"return mV('Jdg',6,19);\">Jdg 6:19</a>; <a href=\"#\" onClick=\"return mV('Jdg',13,15);\">13:15</a>; <a href=\"#\" onClick=\"return mV('1Sa',16,20);\">1Sa 16:20</a>). Goat's hair was used for making tent cloth (<a href=\"#\" onClick=\"return mV('Exd',26,7);\">Exd 26:7</a>; <a href=\"#\" onClick=\"return mV('Exd',36,14);\">36:14</a>), and for mattresses and bedding (<a href=\"#\" onClick=\"return mV('1Sa',19,13);\">1Sa 19:13, 16</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001509');\">GOAT</a>.)";
eastonArray["$$T0000741"] = "<strong>Caul:</strong> (Heb. yothe'reth; i.e., \"something redundant\"), the membrane which covers the upper part of the liver (<a href=\"#\" onClick=\"return mV('Exd',29,13,22);\">Exd 29:13, 22</a>; <a href=\"#\" onClick=\"return mV('Lev',3,4,10,15);\">Lev 3:4, 10, 15</a>; <a href=\"#\" onClick=\"return mV('Lev',4,9);\">4:9</a>; <a href=\"#\" onClick=\"return mV('Lev',7,4);\">7:4</a>; marg., \"midriff\"). In <a href=\"#\" onClick=\"return mV('Hsa',13,8);\">Hsa 13:8</a> (Heb. seghor; i.e., \"an enclosure\") the pericardium, or parts about the heart, is meant.";
eastonArray["$$T0000742"] = "<strong>Cauls:</strong> In <a href=\"#\" onClick=\"return mV('Isa',3,18);\">Isa 3:18</a> this word (Heb. shebisim), in the marg. \"networks,\" denotes network caps to contain the hair, worn by females. Others explain it as meaning \"wreaths worn round the forehead, reaching from one ear to the other.\"";
eastonArray["$$T0000743"] = "<strong>Causeway:</strong> a raised way, an ascent by steps, or a raised slope between Zion and the temple (<a href=\"#\" onClick=\"return mV('1Ch',26,16,18);\">1Ch 26:16, 18</a>). In <a href=\"#\" onClick=\"return mV('2Ch',9,11);\">2Ch 9:11</a> the same word is translated \"terrace.\"";
eastonArray["$$T0000744"] = "<strong>Cave:</strong> There are numerous natural caves among the limestone rocks of Syria, many of which have been artificially enlarged for various purposes.<br><br>The first notice of a cave occurs in the history of Lot (<a href=\"#\" onClick=\"return mV('Gen',19,30);\">Gen 19:30</a>).<br><br>The next we read of is the cave of Machpelah (q.v.), which Abraham purchased from the sons of Heth (<a href=\"#\" onClick=\"return mV('Gen',25,9,10);\">Gen 25:9-10</a>). It was the burying-place of Sarah and of Abraham himself, also of Isaac, Rebekah, Leah, and Jacob (<a href=\"#\" onClick=\"return mV('Gen',49,31);\">Gen 49:31</a>; <a href=\"#\" onClick=\"return mV('Gen',50,13);\">50:13</a>).<br><br>The cave of Makkedah, into which the five Amorite kings retired after their defeat by Joshua (<a href=\"#\" onClick=\"return mV('Jos',10,16,27);\">Jos 10:16, 27</a>).<br><br>The cave of Adullam (q.v.), an immense natural cavern, where David hid himself from Saul (<a href=\"#\" onClick=\"return mV('1Sa',22,1,2);\">1Sa 22:1-2</a>).<br><br>The cave of Engedi (q.v.), now called 'Ain Jidy, i.e., the \"Fountain of the Kid\", where David cut off the skirt of Saul's robe (<a href=\"#\" onClick=\"return mV('1Sa',24,4);\">24:4</a>). Here he also found a shelter for himself and his followers to the number of 600 (<a href=\"#\" onClick=\"return mV('1Sa',23,29);\">23:29</a>; <a href=\"#\" onClick=\"return mV('1Sa',24,1);\">24:1</a>). \"On all sides the country is full of caverns which might serve as lurking-places for David and his men, as they do for outlaws at the present day.\"<br><br>The cave in which Obadiah hid the prophets (<a href=\"#\" onClick=\"return mV('1Ki',18,4);\">1Ki 18:4</a>) was probably in the north, but it cannot be identified.<br><br>The cave of Elijah (<a href=\"#\" onClick=\"return mV('1Ki',19,9);\">1Ki 19:9</a>), and the \"cleft\" of Moses on Horeb (<a href=\"#\" onClick=\"return mV('Exd',33,22);\">Exd 33:22</a>), cannot be determined.<br><br>In the time of Gideon the Israelites took refuge from the Midianites in dens and caves, such as abounded in the mountain regions of Manasseh (<a href=\"#\" onClick=\"return mV('Jdg',6,2);\">Jdg 6:2</a>).<br><br>Caves were frequently used as dwelling-places (<a href=\"#\" onClick=\"return mV('Num',24,21);\">Num 24:21</a>; <a href=\"#\" onClick=\"return mV('Sgs',2,14);\">Sgs 2:14</a>; <a href=\"#\" onClick=\"return mV('Jer',49,16);\">Jer 49:16</a>; <a href=\"#\" onClick=\"return mV('Oba',1,3);\">Oba 1:3</a>). \"The excavations at Deir Dubban, on the south side of the wady leading to Santa Hanneh, are probably the dwellings of the Horites,\" the ancient inhabitants of Idumea Proper. The pits or cavities in rocks were also sometimes used as prisons (<a href=\"#\" onClick=\"return mV('Isa',24,22);\">Isa 24:22</a>; <a href=\"#\" onClick=\"return mV('Isa',51,14);\">51:14</a>; <a href=\"#\" onClick=\"return mV('Zec',9,11);\">Zec 9:11</a>). Those which had niches in their sides were occupied as burying-places (<a href=\"#\" onClick=\"return mV('Eze',32,23);\">Eze 32:23</a>; <a href=\"#\" onClick=\"return mV('Jhn',11,38);\">Jhn 11:38</a>).";
eastonArray["$$T0000745"] = "<strong>Cedar:</strong> (Heb. e'rez, Gr. kedros, Lat. cedrus), a tree very frequently mentioned in Scripture. It was stately (<a href=\"#\" onClick=\"return mV('Eze',31,'3-5');\">Eze 31:3-5</a>), long-branched (<a href=\"#\" onClick=\"return mV('Psa',80,10);\">Psa 80:10</a>; <a href=\"#\" onClick=\"return mV('Psa',92,12);\">92:12</a>; <a href=\"#\" onClick=\"return mV('Eze',31,'6-9');\">Eze 31:6-9</a>), odoriferous (<a href=\"#\" onClick=\"return mV('Sgs',4,11);\">Sgs 4:11</a>; <a href=\"#\" onClick=\"return mV('Hsa',14,6);\">Hsa 14:6</a>), durable, and therefore much used for boards, pillars, and ceilings (<a href=\"#\" onClick=\"return mV('1Ki',6,9,10);\">1Ki 6:9-10</a>; <a href=\"#\" onClick=\"return mV('1Ki',7,2);\">7:2</a>; <a href=\"#\" onClick=\"return mV('Jer',22,14);\">Jer 22:14</a>), for masts (<a href=\"#\" onClick=\"return mV('Eze',27,5);\">Eze 27:5</a>), and for carved images (<a href=\"#\" onClick=\"return mV('Isa',44,14);\">Isa 44:14</a>).<br><br>It grew very abundantly in Palestine, and particularly on Lebanon, of which it was \"the glory\" (<a href=\"#\" onClick=\"return mV('Isa',35,2);\">Isa 35:2</a>; <a href=\"#\" onClick=\"return mV('Isa',60,13);\">60:13</a>). Hiram supplied Solomon with cedar trees from Lebanon for various purposes connected with the construction of the temple and the king's palace (<a href=\"#\" onClick=\"return mV('2Sa',5,11);\">2Sa 5:11</a>; <a href=\"#\" onClick=\"return mV('2Sa',7,2,7);\">7:2, 7</a>; <a href=\"#\" onClick=\"return mV('1Ki',5,6,8,10);\">1Ki 5:6, 8, 10</a>; <a href=\"#\" onClick=\"return mV('1Ki',6,9,10,15,16,18,20);\">6:9-10, 15-16, 18, 20</a>; <a href=\"#\" onClick=\"return mV('1Ki',7,2,3,7,11,12);\">7:2-3, 7, 11-12</a>; <a href=\"#\" onClick=\"return mV('1Ki',9,11);\">9:11</a>, etc.). Cedars were used also in the building of the second temple under Zerubbabel (<a href=\"#\" onClick=\"return mV('Ezr',3,7);\">Ezr 3:7</a>).<br><br>Of the ancient cedars of Lebanon there remain now only some seven or eight. They are not standing together. But beside them there are found between three hundred and four hundred of younger growth. They stand in an amphitheatre fronting the west, about 6,400 feet above the level of the sea.<br><br>The cedar is often figuratively alluded to in the sacred Scriptures. \"The mighty conquerors of olden days, the despots of Assyria and the Pharaohs of Egypt, the proud and idolatrous monarchs of Judah, the Hebrew commonwealth itself, the war-like Ammonites of patriarchal times, and the moral majesty of the Messianic age, are all compared to the towering cedar, in its royal loftiness and supremacy (<a href=\"#\" onClick=\"return mV('Isa',2,13);\">Isa 2:13</a>; <a href=\"#\" onClick=\"return mV('Eze',17,3,22,23);\">Eze 17:3, 22-23</a>; <a href=\"#\" onClick=\"return mV('Eze',31,'3-9');\">31:3-9</a>; <a href=\"#\" onClick=\"return mV('Amo',2,9);\">Amo 2:9</a>; <a href=\"#\" onClick=\"return mV('Zec',11,1,2);\">Zec 11:1-2</a>; <a href=\"#\" onClick=\"return mV('Job',40,17);\">Job 40:17</a>; <a href=\"#\" onClick=\"return mV('Psa',29,5);\">Psa 29:5</a>; <a href=\"#\" onClick=\"return mV('Psa',80,10);\">80:10</a>; <a href=\"#\" onClick=\"return mV('Psa',92,12);\">92:12</a>, etc).\", Groser's Scrip. Nat. Hist. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000636');\">BOX-TREE</a>.)";
eastonArray["$$T0000746"] = "<strong>Cedron:</strong> the black torrent, the brook flowing through the ravine below the eastern wall of Jerusalem (<a href=\"#\" onClick=\"return mV('Jhn',18,1);\">Jhn 18:1</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002187');\">KIDRON</a>.)";
eastonArray["$$T0000747"] = "<strong>Ceiling:</strong> the covering (<a href=\"#\" onClick=\"return mV('1Ki',7,3,7);\">1Ki 7:3, 7</a>) of the inside roof and walls of a house with planks of wood (<a href=\"#\" onClick=\"return mV('2Ch',3,5);\">2Ch 3:5</a>; <a href=\"#\" onClick=\"return mV('Jer',22,14);\">Jer 22:14</a>). Ceilings were sometimes adorned with various ornaments in stucco, gold, silver, gems, and ivory. The ceilings of the temple and of Solomon's palace are described <a href=\"#\" onClick=\"return mV('1Ki',6,9,15);\">1Ki 6:9, 15</a>; <a href=\"#\" onClick=\"return mV('1Ki',7,3);\">7:3</a>; <a href=\"#\" onClick=\"return mV('2Ch',3,5,9);\">2Ch 3:5, 9</a>.";
eastonArray["$$T0000748"] = "<strong>Cellar:</strong> a subterranean vault (<a href=\"#\" onClick=\"return mV('1Ch',27,28);\">1Ch 27:28</a>), a storehouse. The word is also used to denote the treasury of the temple (<a href=\"#\" onClick=\"return mV('1Ki',7,51);\">1Ki 7:51</a>) and of the king (<a href=\"#\" onClick=\"return mV('1Ki',14,26);\">14:26</a>). The Hebrew word is rendered \"garner\" in <a href=\"#\" onClick=\"return mV('Joe',1,17);\">Joe 1:17</a>, and \"armoury\" in <a href=\"#\" onClick=\"return mV('Jer',50,25);\">Jer 50:25</a>.";
eastonArray["$$T0000749"] = "<strong>Cenchrea:</strong> millet, the eastern harbour of Corinth, from which it was distant about 9 miles east, and the outlet for its trade with the Asiatic shores of the Mediterranean. When Paul returned from his second missionary journey to Syria, he sailed from this port (<a href=\"#\" onClick=\"return mV('Act',18,18);\">Act 18:18</a>). In <a href=\"#\" onClick=\"return mV('Rom',16,1);\">Rom 16:1</a> he speaks as if there were at the time of his writing that epistle an organized church there. The western harbour of Corinth was Lechaeum, about a mile and a half from the city. It was the channel of its trade with Italy and the west.";
