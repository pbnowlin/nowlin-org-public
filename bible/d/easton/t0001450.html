<script>
var eastonArray = new Array ();
eastonArray["$$T0001450"] = "<strong>Gederathite:</strong> an epithet applied to Josabad, one of David's warriors at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,4);\">1Ch 12:4</a>), a native of Gederah.";
eastonArray["$$T0001451"] = "<strong>Gedor:</strong> a wall.<br><br>(1.) A city in the mountains or hill country of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,58);\">Jos 15:58</a>), identified with Jedar, between Jerusalem and Hebron.<br><br>(2.) <a href=\"#\" onClick=\"return mV('1Ch',4,39);\">1Ch 4:39</a>, the Gederah of <a href=\"#\" onClick=\"return mV('Jos',15,36);\">Jos 15:36</a>, or the well-known Gerar, as the LXX. read, where the patriarchs of old had sojourned and fed their flocks (<a href=\"#\" onClick=\"return mV('Gen',20,1,14,15);\">Gen 20:1, 14-15</a>; <a href=\"#\" onClick=\"return mV('Gen',26,1,6,14);\">26:1, 6, 14</a>).<br><br>(3.) A town apparently in Benjamin (<a href=\"#\" onClick=\"return mV('1Ch',12,7);\">1Ch 12:7</a>), the same probably as Geder (<a href=\"#\" onClick=\"return mV('Jos',12,13);\">Jos 12:13</a>).";
eastonArray["$$T0001452"] = "<strong>Gehazi:</strong> valley of vision, Elisha's trusted servant (<a href=\"#\" onClick=\"return mV('2Ki',4,31);\">2Ki 4:31</a>; <a href=\"#\" onClick=\"return mV('2Ki',5,25);\">5:25</a>; <a href=\"#\" onClick=\"return mV('2Ki',8,4,5);\">8:4-5</a>). He appears in connection with the history of the Shunammite (<a href=\"#\" onClick=\"return mV('2Ki',4,14,31);\">2Ki 4:14, 31</a>) and of Naaman the Syrian. On this latter occasion he was guilty of duplicity and dishonesty of conduct, causing Elisha to denounce his crime with righteous sternness, and pass on him the terrible doom that the leprosy of Naaman would cleave to him and his for ever (<a href=\"#\" onClick=\"return mV('2Ki',5,'20-27');\">5:20-27</a>).<br><br>He afterwards appeared before king Joram, to whom he recounted the great deeds of his master (<a href=\"#\" onClick=\"return mV('2Ki',8,'1-6');\">2Ki 8:1-6</a>).";
eastonArray["$$T0001453"] = "<strong>Gehenna:</strong> (originally Ge bene Hinnom; i.e., \"the valley of the sons of Hinnom\"), a deep, narrow glen to the south of Jerusalem, where the idolatrous Jews offered their children in sacrifice to Molech (<a href=\"#\" onClick=\"return mV('2Ch',28,3);\">2Ch 28:3</a>; <a href=\"#\" onClick=\"return mV('2Ch',33,6);\">33:6</a>; <a href=\"#\" onClick=\"return mV('Jer',7,31);\">Jer 7:31</a>; <a href=\"#\" onClick=\"return mV('Jer',19,'2-6');\">19:2-6</a>). This valley afterwards became the common receptacle for all the refuse of the city. Here the dead bodies of animals and of criminals, and all kinds of filth, were cast and consumed by fire kept always burning. It thus in process of time became the image of the place of everlasting destruction. In this sense it is used by our Lord in <a href=\"#\" onClick=\"return mV('Mat',5,22,29,30);\">Mat 5:22, 29-30</a>; <a href=\"#\" onClick=\"return mV('Mat',10,28);\">10:28</a>; <a href=\"#\" onClick=\"return mV('Mat',18,9);\">18:9</a>; <a href=\"#\" onClick=\"return mV('Mat',23,15,33);\">23:15, 33</a>; <a href=\"#\" onClick=\"return mV('Mar',9,43,45,47);\">Mark 9:43, 45, 47</a>; <a href=\"#\" onClick=\"return mV('Luk',12,5);\">Luk 12:5</a>. In these passages, and also in <a href=\"#\" onClick=\"return mV('Jam',3,6);\">Jam 3:6</a>, the word is uniformly rendered \"hell,\" the Revised Version placing \"Gehenna\" in the margin. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001731');\">HELL</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0001790');\">HINNOM</a>.)";
eastonArray["$$T0001454"] = "<strong>Geliloth:</strong> circles; regions, a place in the border of Benjamin (<a href=\"#\" onClick=\"return mV('Jos',18,17);\">Jos 18:17</a>); called Gilgal in <a href=\"#\" onClick=\"return mV('Jos',15,7);\">Jos 15:7</a>.";
eastonArray["$$T0001455"] = "<strong>Gemariah:</strong> Jehovah has made perfect.<br><br>(1.) The son of Shaphan, and one of the Levites of the temple in the time of Jehoiakim (<a href=\"#\" onClick=\"return mV('Jer',36,10);\">Jer 36:10</a>; <a href=\"#\" onClick=\"return mV('2Ki',22,12);\">2Ki 22:12</a>). Baruch read aloud to the people from Gemariah's chamber, and again in the hearing of Gemariah and other scribes, the prophecies of Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',36,'11-20');\">Jer 36:11-20</a>), which filled him with terror. He joined with others in entreating the king not to destroy the roll of the prophecies which Baruch had read (<a href=\"#\" onClick=\"return mV('Jer',36,'21-25');\">21-25</a>).<br><br>(2.) The son of Hilkiah, who accompanied Shaphan with the tribute-money from Zedekiah to Nebuchadnezzar, and was the bearer at the same time of a letter from Jeremiah to the Jewish captives at Babylon (<a href=\"#\" onClick=\"return mV('Jer',29,3,4);\">Jer 29:3-4</a>).";
eastonArray["$$T0001456"] = "<strong>Generation:</strong> <a href=\"#\" onClick=\"return mV('Gen',2,4);\">Gen 2:4</a>, \"These are the generations,\" means the \"history.\" <a href=\"#\" onClick=\"return mV('Gen',5,1);\">Gen 5:1</a>, \"The book of the generations,\" means a family register, or history of Adam. <a href=\"#\" onClick=\"return mV('Gen',37,2);\">Gen 37:2</a>, \"The generations of Jacob\" = the history of Jacob and his descendants. <a href=\"#\" onClick=\"return mV('Gen',7,1);\">Gen 7:1</a>, \"In this generation\" = in this age. <a href=\"#\" onClick=\"return mV('Psa',49,19);\">Psa 49:19</a>, \"The generation of his fathers\" = the dwelling of his fathers, i.e., the grave. <a href=\"#\" onClick=\"return mV('Psa',73,15);\">Psa 73:15</a>, \"The generation of thy children\" = the contemporary race. <a href=\"#\" onClick=\"return mV('Isa',53,8);\">Isa 53:8</a>, \"Who shall declare his generation?\" = His manner of life who shall declare? or rather = His race, posterity, shall be so numerous that no one shall be able to declare it.<br><br>In <a href=\"#\" onClick=\"return mV('Mat',1,17);\">Mat 1:17</a>, the word means a succession or series of persons from the same stock. <a href=\"#\" onClick=\"return mV('Mat',3,7);\">Mat 3:7</a>, \"Generation of vipers\" = brood of vipers. <a href=\"#\" onClick=\"return mV('Mat',24,34);\">Mat 24:34</a>, \"This generation\" = the persons then living contemporary with Christ. <a href=\"#\" onClick=\"return mV('1Pe',2,9);\">1Pe 2:9</a>, \"A chosen generation\" = a chosen people.<br><br>The Hebrews seem to have reckoned time by the generation. In the time of Abraham a generation was an hundred years, thus: <a href=\"#\" onClick=\"return mV('Gen',15,16);\">Gen 15:16</a>, \"In the fourth generation\" = in four hundred years (<a href=\"#\" onClick=\"return mV('Gen',15,16);\">Gen 15:13</a> and <a href=\"#\" onClick=\"return mV('Exd',12,40);\">Exd 12:40</a>). In <a href=\"#\" onClick=\"return mV('Deu',1,35);\">Deu 1:35</a> and <a href=\"#\" onClick=\"return mV('Deu',2,14);\">Deu 2:14</a> a generation is a period of thirty-eight years.";
eastonArray["$$T0001457"] = "<strong>Genesis:</strong> The five books of Moses were collectively called the Pentateuch, a word of Greek origin meaning \"the five-fold book.\" The Jews called them the Torah, i.e., \"the law.\" It is probable that the division of the Torah into five books proceeded from the Greek translators of the Old Testament. The names by which these several books are generally known are Greek.<br><br>The first book of the Pentateuch (q.v.) is called by the Jews Bereshith, i.e., \"in the beginning\", because this is the first word of the book. It is generally known among Christians by the name of Genesis, i.e., \"creation\" or \"generation,\" being the name given to it in the LXX. as designating its character, because it gives an account of the origin of all things. It contains, according to the usual computation, the history of about two thousand three hundred and sixty-nine years.<br><br>Genesis is divided into two principal parts. The first part (<a href=\"#\" onClick=\"return mV('Gen',1,'1-');\">Gen 1-11</a>) gives a general history of mankind down to the time of the Dispersion. The second part presents the early history of Israel down to the death and burial of Joseph (<a href=\"#\" onClick=\"return mV('Gen',12,'1-');\">Gen 12-50).<br><br>There are five principal persons brought in succession under our notice in this book, and around these persons the history of the successive periods is grouped, viz., Adam (<a href=\"#\" onClick=\"return mV('Gen',1,'1-');\">Gen 1-3</a>), Noah (<a href=\"#\" onClick=\"return mV('Gen',4,'1-');\">Gen 4-9</a>), Abraham (<a href=\"#\" onClick=\"return mV('Gen',10,'1-')\">Gen 10-25:18</a>), Isaac (<a href=\"#\" onClick=\"return mV('Gen',25,'19-');\">Gen 25:19-35:29</a>), and Jacob (<a href=\"#\" onClick=\"return mV('Gen',36,'1-');\">Gen 36-50</a>).<br><br>In this book we have several prophecies concerning Christ (<a href=\"#\" onClick=\"return mV('Gen',3,15);\">Gen 3:15</a>; <a href=\"#\" onClick=\"return mV('Gen',12,3);\">12:3</a>; <a href=\"#\" onClick=\"return mV('Gen',18,18);\">18:18</a>; <a href=\"#\" onClick=\"return mV('Gen',22,18);\">22:18</a>; <a href=\"#\" onClick=\"return mV('Gen',26,4);\">26:4</a>; <a href=\"#\" onClick=\"return mV('Gen',28,14);\">28:14</a>; <a href=\"#\" onClick=\"return mV('Gen',49,10);\">49:10</a>). The author of this book was Moses. Under divine guidance he may indeed have been led to make use of materials already existing in primeval documents, or even of traditions in a trustworthy form that had come down to his time, purifying them from all that was unworthy; but the hand of Moses is clearly seen throughout in its composition.";
eastonArray["$$T0001458"] = "<strong>Gennesaret:</strong> a garden of riches.<br><br>(1.) A town of Naphtali, called Chinnereth (<a href=\"#\" onClick=\"return mV('Jos',19,35);\">Jos 19:35</a>), sometimes in the plural form Chinneroth (<a href=\"#\" onClick=\"return mV('Jos',11,2);\">11:2</a>). In later times the name was gradually changed to Genezar and Gennesaret (<a href=\"#\" onClick=\"return mV('Luk',5,1);\">Luk 5:1</a>). This city stood on the western shore of the lake to which it gave its name. No trace of it remains. The plain of Gennesaret has been called, from its fertility and beauty, \"the Paradise of Galilee.\" It is now called el-Ghuweir.<br><br>(2.) The Lake of Gennesaret, the Grecized form of CHINNERETH (q.v.). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001418');\">GALILEE, SEA OF</a>.)";
eastonArray["$$T0001459"] = "<strong>Gentiles:</strong> (Heb., usually in plural, goyim), meaning in general all nations except the Jews. In course of time, as the Jews began more and more to pride themselves on their peculiar privileges, it acquired unpleasant associations, and was used as a term of contempt.<br><br>In the New Testament the Greek word Hellenes, meaning literally Greek (as in <a href=\"#\" onClick=\"return mV('Act',16,1,3);\">Act 16:1, 3</a>; <a href=\"#\" onClick=\"return mV('Act',18,17);\">18:17</a>; <a href=\"#\" onClick=\"return mV('Rom',1,14);\">Rom 1:14</a>), generally denotes any non-Jewish nation.";
eastonArray["$$T0001460"] = "<strong>Genubath:</strong> theft, the son of Hadad, of the Edomitish royal family. He was brought up in Pharaoh's household. His mother was a sister of Tahpenes, the king of Egypt's wife, mentioned in <a href=\"#\" onClick=\"return mV('1Ki',11,20);\">1Ki 11:20</a>.";
eastonArray["$$T0001461"] = "<strong>Gera:</strong> grain.<br><br>(1.) The son of Bela and grandson of Benjamin (<a href=\"#\" onClick=\"return mV('1Ch',8,3,5,7);\">1Ch 8:3, 5, 7</a>).<br><br>(2.) The father of Ehud the judge (<a href=\"#\" onClick=\"return mV('Jdg',3,15);\">Jdg 3:15</a>).<br><br>(3.) The father of Shimei, who so grossly abused David (<a href=\"#\" onClick=\"return mV('2Sa',16,5);\">2Sa 16:5</a>; <a href=\"#\" onClick=\"return mV('2Sa',19,16,18);\">19:16, 18</a>).";
eastonArray["$$T0001462"] = "<strong>Gerah:</strong> a bean, probably of the carob tree, the smallest weight, and also the smallest piece of money, among the Hebrews, equal to the twentieth part of a shekel (<a href=\"#\" onClick=\"return mV('Exd',30,13);\">Exd 30:13</a>; <a href=\"#\" onClick=\"return mV('Lev',27,25);\">Lev 27:25</a>; <a href=\"#\" onClick=\"return mV('Num',3,47);\">Num 3:47</a>). This word came into use in the same way as our word \"grain,\" from a grain of wheat.";
eastonArray["$$T0001463"] = "<strong>Gerar:</strong> a region; lodging-place, a very ancient town and district in the south border of Palestine, which was ruled over by a king named Abimelech (<a href=\"#\" onClick=\"return mV('Gen',10,19);\">Gen 10:19</a>; <a href=\"#\" onClick=\"return mV('Gen',20,1,2);\">20:1-2</a>). Abraham sojourned here, and perhaps Isaac was born in this place. Both of these patriarchs were guilty of the sin of here denying their wives, and both of them entered into a treaty with the king before they departed to Beersheba (<a href=\"#\" onClick=\"return mV('Gen',21,'23-34');\">21:23-34</a>; <a href=\"#\" onClick=\"return mV('Gen',26,'1-');\">26</a>). It seems to have been a rich pastoral country (<a href=\"#\" onClick=\"return mV('2Ch',14,'12-18');\">2Ch 14:12-18</a>). Isaac here reaped an hundred-fold, and was blessed of God (<a href=\"#\" onClick=\"return mV('Gen',26,12);\">Gen 26:12</a>). The \"valley of Gerar\" (<a href=\"#\" onClick=\"return mV('Gen',26,17);\">Gen 26:17</a>) was probably the modern Wady el-Jerdr.";
eastonArray["$$T0001464"] = "<strong>Gergesa:</strong> =Gerasa, identified with the modern Khersa, \"over against Galilee,\" close to the lake. This was probably the scene of the miracle, <a href=\"#\" onClick=\"return mV('Mar',5,'1-20');\">Mar 5:1-20</a>, etc. \"From the base of the great plateau of Bashan, 2,000 feet or more overhead, the ground slopes down steeply, in places precipitously, to the shore. And at the foot of the declivity a bold spur runs out to the water's edge. By it the frantic swine would rush on headlong into the lake and perish.\" Porter's Through Samaria. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001406');\">GADARA</a>.)";
eastonArray["$$T0001465"] = "<strong>Gerizim:</strong> a mountain of Samaria, about 3,000 feet above the Mediterranean. It was on the left of the valley containing the ancient town of Shechem (q.v.), on the way to Jerusalem. It stood over against Mount Ebal, the summits of these mountains being distant from each other about 2 miles (<a href=\"#\" onClick=\"return mV('Deu',27,'1-')\">Deu 27</a>; <a href=\"#\" onClick=\"return mV('Jos',8,'30-35');\">Jos 8:30-35</a>). On the slopes of this mountain the tribes descended from the handmaids of Leah and Rachel, together with the tribe of Reuben, were gathered together, and gave the responses to the blessing pronounced as the reward of obedience, when Joshua in the valley below read the whole law in the hearing of all the people; as those gathered on Ebal responded with a loud Amen to the rehearsal of the curses pronounced on the disobedient. It was probably at this time that the coffin containing the embalmed body of Joseph was laid in the \"parcel of ground which Jacob bought of the sons of Hamor\" (<a href=\"#\" onClick=\"return mV('Gen',33,19);\">Gen 33:19</a>; <a href=\"#\" onClick=\"return mV('Gen',50,25);\">50:25</a>).<br><br>Josephus relates (Ant. 11:8, 2-4) that Sanballat built a temple for the Samaritans on this mountain, and instituted a priesthood, as rivals to those of the Jews at Jerusalem. This temple was destroyed after it had stood two hundred years. It was afterwards rebuilt by Herod the Great. There is a Samaritan tradition that it was the scene of the incident recorded in <a href=\"#\" onClick=\"return mV('Gen',22,'1-');\">Gen 22</a>. There are many ruins on this mountain, some of which are evidently of Christian buildings. To this mountain the woman of Sychar referred in <a href=\"#\" onClick=\"return mV('Jhn',4,20);\">Jhn 4:20</a>. For centuries Gerizim was the centre of political outbreaks. The Samaritans (q.v.), a small but united body, still linger here, and keep up their ancient ceremonial worship.";
eastonArray["$$T0001466"] = "<strong>Gershom:</strong> expulsion.<br><br>(1.) The eldest son of Levi (<a href=\"#\" onClick=\"return mV('1Ch',6,16,17,20,43,62,71);\">1Ch 6:16-17, 20, 43, 62, 71</a>; <a href=\"#\" onClick=\"return mV('1Ch',15,7);\">15:7</a>)=GERSHON (q.v.).<br><br>(2.) The elder of the two sons of Moses born to him in Midian (<a href=\"#\" onClick=\"return mV('Exd',2,22);\">Exd 2:22</a>; <a href=\"#\" onClick=\"return mV('Exd',18,3);\">18:3</a>). On his way to Egypt with his family, in obedience to the command of the Lord, Moses was attacked by a sudden and dangerous illness (<a href=\"#\" onClick=\"return mV('Exd',4,24,26);\">4:24, 26</a>), which Zipporah his wife believed to have been sent because he had neglected to circumcise his son. She accordingly took a \"sharp stone\" and circumcised her son Gershom, saying, \"Surely a bloody husband art thou to me\", i.e., by the blood of her child she had, as it were, purchased her husband, had won him back again.<br><br>(3.) A descendant of Phinehas who returned with Ezra from Babylon (<a href=\"#\" onClick=\"return mV('Ezr',8,2);\">Ezr 8:2</a>).<br><br>(4.) The son of Manasseh (<a href=\"#\" onClick=\"return mV('Jdg',18,30);\">Jdg 18:30</a>), in R.V. \"of Moses.\"";
eastonArray["$$T0001467"] = "<strong>Gershon:</strong> =Ger'shom expulsion, the eldest of Levi's three sons (<a href=\"#\" onClick=\"return mV('Gen',46,11);\">Gen 46:11</a>; <a href=\"#\" onClick=\"return mV('Exd',6,16);\">Exd 6:16</a>).<br><br>In the wilderness the sons of Gershon had charge of the fabrics of the tabernacle when it was moved from place to place, the curtains, veils, tent-hangings (<a href=\"#\" onClick=\"return mV('Num',3,'21-26');\">Num 3:21-26</a>). Thirteen Levitical cities fell to the lot of the Gershonites (<a href=\"#\" onClick=\"return mV('Jos',21,'27-33');\">Jos 21:27-33</a>).";
eastonArray["$$T0001468"] = "<strong>Geshem:</strong> or Gashmu, firmness, probably chief of the Arabs south of Palestine, one of the enemies of the Jews after the return from Babylon (<a href=\"#\" onClick=\"return mV('Neh',2,19);\">Neh 2:19</a>; <a href=\"#\" onClick=\"return mV('Neh',6,1,2);\">6:1-2</a>). He united with Sanballat and Tobiah in opposing the rebuilding of the wall of Jerusalem.";
eastonArray["$$T0001469"] = "<strong>Geshur:</strong> bridge, the name of a district or principality of Syria near Gilead, between Mount Hermon and the Lake of Tiberias (<a href=\"#\" onClick=\"return mV('2Sa',15,8);\">2Sa 15:8</a>; <a href=\"#\" onClick=\"return mV('1Ch',2,23);\">1Ch 2:23</a>). The Geshurites probably inhabited the rocky fastness of Argob, the modern Lejah, in the north-east corner of Bashan. In the time of David it was ruled by Talmai, whose daughter he married, and who was the mother of Absalom, who fled to Geshur after the murder of Amnon (<a href=\"#\" onClick=\"return mV('2Sa',13,37);\">2Sa 13:37</a>).";
eastonArray["$$T0001470"] = "<strong>Geshurites:</strong><br><br>(1.) The inhabitants of Geshur. They maintained friendly relations with the Israelites on the east of Jordan (<a href=\"#\" onClick=\"return mV('Jos',12,5);\">Jos 12:5</a>; <a href=\"#\" onClick=\"return mV('Jos',13,11,13);\">13:11, 13</a>).<br><br>(2.) Another aboriginal people of Palestine who inhabited the south-west border of the land. Geshuri in <a href=\"#\" onClick=\"return mV('Jos',13,2);\">Jos 13:2</a> should be \"the Geshurite,\" not the Geshurites mentioned in ver. <a href=\"#\" onClick=\"return mV('Jos',13,11,13);\">11, 13</a>, but the tribe mentioned in <a href=\"#\" onClick=\"return mV('1Sa',27,8);\">1Sa 27:8</a>.";
eastonArray["$$T0001471"] = "<strong>Gethsemane:</strong> oil-press, the name of an olive-yard at the foot of the Mount of Olives, to which Jesus was wont to retire (<a href=\"#\" onClick=\"return mV('Luk',22,39);\">Luk 22:39</a>) with his disciples, and which is specially memorable as being the scene of his agony (<a href=\"#\" onClick=\"return mV('Mar',14,32);\">Mar 14:32</a>; <a href=\"#\" onClick=\"return mV('Jhn',18,1);\">Jhn 18:1</a>; <a href=\"#\" onClick=\"return mV('Luk',22,44);\">Luk 22:44</a>). The plot of ground pointed out as Gethsemane is now surrounded by a wall, and is laid out as a modern European flower-garden. It contains eight venerable olive-trees, the age of which cannot, however, be determined. The exact site of Gethsemane is still in question. Dr. Thomson (The Land and the Book) says: \"When I first came to Jerusalem, and for many years afterward, this plot of ground was open to all whenever they chose to come and meditate beneath its very old olivetrees. The Latins, however, have within the last few years succeeded in gaining sole possession, and have built a high wall around it...The Greeks have invented another site a little to the north of it...My own impression is that both are wrong. The position is too near the city, and so close to what must have always been the great thoroughfare eastward, that our Lord would scarcely have selected it for retirement on that dangerous and dismal night...I am inclined to place the garden in the secluded vale several hundred yards to the north-east of the present Gethsemane.\"";
eastonArray["$$T0001472"] = "<strong>Gezer:</strong> a precipice, an ancient royal Canaanitish city (<a href=\"#\" onClick=\"return mV('Jos',10,33);\">Jos 10:33</a>; <a href=\"#\" onClick=\"return mV('Jos',12,12);\">12:12</a>). It was allotted with its suburbs to the Kohathite Levites (<a href=\"#\" onClick=\"return mV('Jos',21,21);\">21:21</a>; <a href=\"#\" onClick=\"return mV('1Ch',6,67);\">1Ch 6:67</a>). It stood between the lower Beth-horon and the sea (<a href=\"#\" onClick=\"return mV('Jos',16,3);\">Jos 16:3</a>; <a href=\"#\" onClick=\"return mV('1Ki',9,17);\">1Ki 9:17</a>). It was the last point to which David pursued the Philistines (<a href=\"#\" onClick=\"return mV('2Sa',5,25);\">2Sa 5:25</a>; <a href=\"#\" onClick=\"return mV('1Ch',14,16);\">1Ch 14:16</a>) after the battle of Baal-perazim. The Canaanites retained possession of it till the time of Solomon, when the king of Egypt took it and gave it to Solomon as a part of the dowry of the Egyptian princess whom he married (<a href=\"#\" onClick=\"return mV('1Ki',9,'15-17');\">1Ki 9:15-17</a>). It is identified with Tell el-Jezer, about 10 miles south-west of Beth-horon. It is mentioned in the Amarna tablets.";
eastonArray["$$T0001473"] = "<strong>Ghost:</strong> an old Saxon word equivalent to soul or spirit. It is the translation of the Hebrew <i>nephesh</i> and the Greek <i>pneuma</i>, both meaning \"breath,\" \"life,\" \"spirit,\" the \"living principle\" (<a href=\"#\" onClick=\"return mV('Job',11,20);\">Job 11:20</a>; <a href=\"#\" onClick=\"return mV('Jer',15,9);\">Jer 15:9</a>; <a href=\"#\" onClick=\"return mV('Mat',27,50);\">Mat 27:50</a>; <a href=\"#\" onClick=\"return mV('Jhn',19,30);\">Jhn 19:30</a>). The expression \"to give up the ghost\" means to die (<a href=\"#\" onClick=\"return mV('Lam',1,19);\">Lam 1:19</a>; <a href=\"#\" onClick=\"return mV('Gen',25,17);\">Gen 25:17</a>; <a href=\"#\" onClick=\"return mV('Gen',35,29);\">35:29</a>; <a href=\"#\" onClick=\"return mV('Gen',49,33);\">49:33</a>; <a href=\"#\" onClick=\"return mV('Job',3,11);\">Job 3:11</a>). (See  <a href=\"#\" onClick=\"return doDictLookup('ET0001805');\">HOLY GHOST</a>.)";
eastonArray["$$T0001474"] = "<strong>Giants:</strong><br><br>(1.) Heb. nephilim, meaning \"violent\" or \"causing to fall\" (<a href=\"#\" onClick=\"return mV('Gen',6,4);\">Gen 6:4</a>). These were the violent tyrants of those days, those who fell upon others. The word may also be derived from a root signifying \"wonder,\" and hence \"monsters\" or \"prodigies.\" In <a href=\"#\" onClick=\"return mV('Num',13,33);\">Num 13:33</a> this name is given to a Canaanitish tribe, a race of large stature, \"the sons of Anak.\" The Revised Version, in these passages, simply transliterates the original, and reads \"Nephilim.\"<br><br>(2.) Heb. rephaim, a race of giants (<a href=\"#\" onClick=\"return mV('Deu',3,11);\">Deu 3:11</a>) who lived on the east of Jordan, from whom Og was descended. They were probably the original inhabitants of the land before the immigration of the Canaanites. They were conquered by Chedorlaomer (<a href=\"#\" onClick=\"return mV('Gen',14,5);\">Gen 14:5</a>), and their territories were promised as a possession to Abraham (<a href=\"#\" onClick=\"return mV('Gen',15,20);\">15:20</a>). The Anakim, Zuzim, and Emim were branches of this stock.<br><br>In <a href=\"#\" onClick=\"return mV('Job',26,5);\">Job 26:5</a> (R.V., \"they that are deceased; \" marg., \"the shades,\" the \"Rephaim\") and <a href=\"#\" onClick=\"return mV('Isa',14,9);\">Isa 14:9</a> this Hebrew word is rendered (A.V.) \"dead.\" It means here \"the shades,\" the departed spirits in Sheol. In <a href=\"#\" onClick=\"return mV('2Sa',21,16,18,20,33);\">2Sa 21:16, 18, 20, 33</a>, \"the giant\" is (A.V.) the rendering of the singular form <i>ha raphah</i>, which may possibly be the name of the father of the four giants referred to here, or of the founder of the Rephaim. The Vulgate here reads \"Arapha,\" whence Milton (in Samson Agonistes) has borrowed the name \"Harapha.\" (also <a href=\"#\" onClick=\"return mV('1Ch',20,5,6,8);\">1Ch 20:5-6, 8</a>; <a href=\"#\" onClick=\"return mV('Deu',2,11,20);\">Deu 2:11, 20</a>; <a href=\"#\" onClick=\"return mV('Deu',3,13);\">3:13</a>; <a href=\"#\" onClick=\"return mV('Jos',15,8);\">Jos 15:8</a>, etc., where the word is similarly rendered \"giant.\") It is rendered \"dead\" in (A.V.) (<a href=\"#\" onClick=\"return mV('Psa',88,10);\">Psa 88:10</a>; <a href=\"#\" onClick=\"return mV('Pro',2,18);\">Pro 2:18</a>; <a href=\"#\" onClick=\"return mV('Pro',9,18);\">9:18</a>; <a href=\"#\" onClick=\"return mV('Pro',21,16);\">21:16</a>); in all these places the Revised Version marg. has \"the shades.\" (See also <a href=\"#\" onClick=\"return mV('Isa',26,14);\">Isa 26:14</a>.)<br><br>(3.) Heb. 'Anakim (<a href=\"#\" onClick=\"return mV('Deu',2,10,11,21);\">Deu 2:10-11, 21</a>; <a href=\"#\" onClick=\"return mV('Jos',11,21,22);\">Jos 11:21-22</a>; <a href=\"#\" onClick=\"return mV('Jos',14,12,15);\">14:12, 15</a>; <a href=\"#\" onClick=\"return mV('Num',13,33);\">Num 13:33</a>; <a href=\"#\" onClick=\"return mV('Num',13,22);\">13:22</a>; <a href=\"#\" onClick=\"return mV('Jos',15,14);\">Jos 15:14</a>), a nomad race of giants descended from Arba (<a href=\"#\" onClick=\"return mV('Jos',14,15);\">Jos 14:15</a>), the father of Anak, that dwelt in the south of Palestine near Hebron (<a href=\"#\" onClick=\"return mV('Gen',23,2);\">Gen 23:2</a>; <a href=\"#\" onClick=\"return mV('Jos',15,13);\">Jos 15:13</a>). They were a Cushite tribe of the same race as the Philistines and the Egyptian shepherd kings. David on several occasions encountered them (<a href=\"#\" onClick=\"return mV('2Sa',21,'15-22');\">2Sa 21:15-22</a>). From this race sprung Goliath (<a href=\"#\" onClick=\"return mV('1Sa',17,4);\">1Sa 17:4</a>).<br><br>(4.) Heb. 'emin, a warlike tribe of the ancient Canaanites. They were \"great, and many, and tall, as the Anakims\" (<a href=\"#\" onClick=\"return mV('Gen',14,5);\">Gen 14:5</a>; <a href=\"#\" onClick=\"return mV('Deu',2,10,11);\">Deu 2:10-11</a>).<br><br>(5.) Heb. Zamzummim (q.v.), <a href=\"#\" onClick=\"return mV('Deu',2,20);\">Deu 2:20</a> so called by the Amorites.<br><br>(6.) Heb. gibbor (<a href=\"#\" onClick=\"return mV('Job',16,14);\">Job 16:14</a>), a mighty one, i.e., a champion or hero. In its plural form (gibborim) it is rendered \"mighty men\" (<a href=\"#\" onClick=\"return mV('2Sa',23,'8-39');\">2Sa 23:8-39</a>; <a href=\"#\" onClick=\"return mV('1Ki',1,8);\">1Ki 1:8</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,'9-47');\">1Ch 11:9-47</a>; <a href=\"#\" onClick=\"return mV('1Ch',29,24);\">29:24</a>.) The band of six hundred whom David gathered around him when he was a fugitive were so designated. They were divided into three divisions of two hundred each, and thirty divisions of twenty each. The captians of the thirty divisions were called \"the thirty,\" the captains of the two hundred \"the three,\" and the captain over the whole was called \"chief among the captains\" (<a href=\"#\" onClick=\"return mV('2Sa',23,8);\">2Sa 23:8</a>). The sons born of the marriages mentioned in <a href=\"#\" onClick=\"return mV('Gen',6,4);\">Gen 6:4</a> are also called by this Hebrew name.";
eastonArray["$$T0001475"] = "<strong>Gibbethon:</strong> a height, a city of the Philistines in the territory of Dan, given to the Kohathites (<a href=\"#\" onClick=\"return mV('Jos',19,44);\">Jos 19:44</a>; <a href=\"#\" onClick=\"return mV('Jos',21,23);\">21:23</a>). Nadab the king of Israel, while besieging it, was slain under its walls by Baasha, one of his own officers (<a href=\"#\" onClick=\"return mV('1Ki',15,27);\">1Ki 15:27</a>). It was in the possession of the Philistines after the secession of the ten tribes (<a href=\"#\" onClick=\"return mV('2Ch',11,13,14);\">2Ch 11:13-14</a>).";
eastonArray["$$T0001476"] = "<strong>Gibeah:</strong> a hill or hill-town, \"of Benjamin\" (<a href=\"#\" onClick=\"return mV('1Sa',13,15);\">1Sa 13:15</a>), better known as \"Gibeah of Saul\" (<a href=\"#\" onClick=\"return mV('1Sa',11,4);\">11:4</a>; <a href=\"#\" onClick=\"return mV('Isa',10,29);\">Isa 10:29</a>). It was here that the terrible outrage was committed on the Levite's concubine which led to the almost utter extirpation of the tribe of Benjamin (<a href=\"#\" onClick=\"return mV('Jdg',19,'1-')\">Jdg 19</a>; <a href=\"#\" onClick=\"return mV('Jdg',20,'1-')\">20</a>), only six hundred men surviving after a succession of disastrous battles. This was the birthplace of Saul, and continued to be his residence after he became king (<a href=\"#\" onClick=\"return mV('1Sa',10,26);\">1Sa 10:26</a>; <a href=\"#\" onClick=\"return mV('1Sa',11,4);\">11:4</a>; <a href=\"#\" onClick=\"return mV('1Sa',15,34);\">15:34</a>). It was reckoned among the ancient sanctuaries of Palestine (<a href=\"#\" onClick=\"return mV('1Sa',10,26);\">10:26</a>; <a href=\"#\" onClick=\"return mV('1Sa',15,34);\">15:34</a>; <a href=\"#\" onClick=\"return mV('1Sa',23,19);\">23:19</a>; <a href=\"#\" onClick=\"return mV('1Sa',26,1);\">26:1</a>; <a href=\"#\" onClick=\"return mV('2Sa',21,'6-10');\">2Sa 21:6-10</a>), and hence it is called \"Gibeah of God\" (<a href=\"#\" onClick=\"return mV('1Sa',10,5);\">1Sa 10:5</a>, R.V. marg.). It has been identified with the modern Tell el-Ful (i.e., \"hill of the bean\"), about 3 miles north of Jerusalem.";
eastonArray["$$T0001477"] = "<strong>Gibeah-haaraloth:</strong> (<a href=\"#\" onClick=\"return mV('Jos',5,3);\">Jos 5:3</a>, marg.), hill of the foreskins, a place at Gilgal where those who had been born in the wilderness were circumcised. All the others, i.e., those who were under twenty years old at the time of the sentence at Kadesh, had already been circumcised.";
eastonArray["$$T0001478"] = "<strong>Gibeah of Judah:</strong> (<a href=\"#\" onClick=\"return mV('Jos',15,57);\">Jos 15:57</a>), a city in the mountains of Judah, the modern Jeba, on a hill in the Wady Musurr, about 7 1/2 miles west-south-west of Bethlehem.";
eastonArray["$$T0001479"] = "<strong>Gibeah of Phinehas:</strong> (<a href=\"#\" onClick=\"return mV('Jos',15,57);\">Jos 15:57</a>, R.V. marg.), a city on Mount Ephraim which had been given to Phinehas (<a href=\"#\" onClick=\"return mV('Jos',24,33);\">24:33</a> \"hill,\" A.V.; R.V. marg. and Heb., \"Gibeah.\"). Here Eleazar the son of Aaron was buried. It has been identified with the modern Khurbet Jibia, 5 miles north of Guphna towards Shechem.";
eastonArray["$$T0001480"] = "<strong>Gibeon:</strong> hill-city, \"one of the royal cities, greater than Ai, and all the men thereof were mighty\" (<a href=\"#\" onClick=\"return mV('Jos',10,2);\">Jos 10:2</a>). Its inhabitants were Hivites (<a href=\"#\" onClick=\"return mV('Jos',11,19);\">11:19</a>). It lay within the territory of Benjamin, and became a priest-city (<a href=\"#\" onClick=\"return mV('Jos',18,25);\">18:25</a>; <a href=\"#\" onClick=\"return mV('Jos',21,17);\">21:17</a>). Here the tabernacle was set up after the destruction of Nob, and here it remained many years till the temple was built by Solomon. It is represented by the modern el-Jib, to the south-west of Ai, and about 5 1/2 miles north-north-west of Jerusalem.<br><br>A deputation of the Gibeonites, with their allies from three other cities (<a href=\"#\" onClick=\"return mV('Jos',9,'1-')\">Jos 9</a>; <a href=\"#\" onClick=\"return mV('Jos',17,'1-')\">Jos 17</a>), visited the camp at Gilgal, and by false representations induced Joshua to enter into a league with them, although the Israelites had been specially warned against any league with the inhabitants of Canaan (<a href=\"#\" onClick=\"return mV('Exd',23,32);\">Exd 23:32</a>; <a href=\"#\" onClick=\"return mV('Exd',34,12);\">34:12</a>; <a href=\"#\" onClick=\"return mV('Num',33,55);\">Num 33:55</a>; <a href=\"#\" onClick=\"return mV('Deu',7,2);\">Deu 7:2</a>). The deception practised on Joshua was detected three days later; but the oath rashly sworn \"by Jehovah God of Israel\" was kept, and the lives of the Gibeonites were spared. They were, however, made \"bondmen\" to the sanctuary (<a href=\"#\" onClick=\"return mV('Jos',9,23);\">Jos 9:23</a>).<br><br>The most remarkable incident connected with this city was the victory Joshua gained over the kings of Palestine (<a href=\"#\" onClick=\"return mV('Jos',10,'16-27');\">Jos 10:16-27</a>). The battle here fought has been regarded as \"one of the most important in the history of the world.\" The kings of southern Canaan entered into a confederacy against Gibeon (because it had entered into a league with Joshua) under the leadership of Adoni-zedec, king of Jerusalem, and marched upon Gibeon with the view of taking possession of it. The Gibeonites entreated Joshua to come to their aid with the utmost speed. His army came suddenly upon that of the Amorite kings as it lay encamped before the city. It was completely routed, and only broken remnants of their great host found refuge in the fenced cities. The five confederate kings who led the army were taken prisoners, and put to death at Makkedah (q.v.). This eventful battle of Beth-horon sealed the fate of all the cities of Southern Palestine. Among the Amarna tablets is a letter from Adoni-zedec (q.v.) to the king of Egypt, written probably at Makkedah after the defeat, showing that the kings contemplated flight into Egypt.<br><br>This place is again brought into notice as the scene of a battle between the army of Ish-bosheth under Abner and that of David led by Joab. At the suggestion of Abner, to spare the effusion of blood twelve men on either side were chosen to decide the battle. The issue was unexpected; for each of the men slew his fellow, and thus they all perished. The two armies then engaged in battle, in which Abner and his host were routed and put to flight (<a href=\"#\" onClick=\"return mV('2Sa',2,'12-17');\">2Sa 2:12-17</a>). This battle led to a virtual truce between Judah and Israel, Judah, under David, increasing in power; and Israel, under Ish-bosheth, continually losing ground.<br><br>Soon after the death of Absalom and David's restoration to his throne his kingdom was visited by a grievous famine, which was found to be a punishment for Saul's violation (<a href=\"#\" onClick=\"return mV('2Sa',21,2,5);\">2Sa 21:2, 5</a>) of the covenant with the Gibeonites (<a href=\"#\" onClick=\"return mV('Jos',9,'3-27');\">Jos 9:3-27</a>). The Gibeonites demanded blood for the wrong that had been done to them, and accordingly David gave up to them the two sons of Rizpah (q.v.) and the five sons of Michal, and these the Gibeonites took and hanged or crucified \"in the hill before the Lord\" (<a href=\"#\" onClick=\"return mV('2Sa',21,9);\">2Sa 21:9</a>); and there the bodies hung for six months (<a href=\"#\" onClick=\"return mV('2Sa',21,10);\">21:10</a>), and all the while Rizpah watched over the blackening corpses and \"suffered neither the birds of the air to rest on them by day, nor the beasts of the field by night.\" David afterwards removed the bones of Saul and Jonathan at Jabeshgilead (<a href=\"#\" onClick=\"return mV('2Sa',21,12,13);\">21:12-13</a>).<br><br>Here, \"at the great stone,\" Amasa was put to death by Joab (<a href=\"#\" onClick=\"return mV('2Sa',20,'5-10');\">2Sa 20:5-10</a>). To the altar of burnt-offering which was at Gibeon, Joab (<a href=\"#\" onClick=\"return mV('1Ki',2,'28-34');\">1Ki 2:28-34</a>), who had taken the side of Adonijah, fled for sanctuary in the beginning of Solomon's reign, and was there also slain by the hand of Benaiah.<br><br>Soon after he came to the throne, Solomon paid a visit of state to Gibeon, there to offer sacrifices (<a href=\"#\" onClick=\"return mV('1Ki',3,4);\">1Ki 3:4</a>; <a href=\"#\" onClick=\"return mV('2Ch',1,3);\">2Ch 1:3</a>). On this occasion the Lord appeared to him in a memorable dream, recorded in <a href=\"#\" onClick=\"return mV('1Ki',3,'5-15');\">1Ki 3:5-15</a>; <a href=\"#\" onClick=\"return mV('2Ch',1,'7-12');\">2Ch 1:7-12</a>. When the temple was built \"all the men of Israel assembled themselves\" to king Solomon, and brought up from Gibeon the tabernacle and \"all the holy vessels that were in the tabernacle\" to Jerusalem, where they remained till they were carried away by Nebuchadnezzar (<a href=\"#\" onClick=\"return mV('2Ki',24,13);\">2Ki 24:13</a>).";
eastonArray["$$T0001481"] = "<strong>Gideon:</strong> called also Jerubbaal (<a href=\"#\" onClick=\"return mV('Jdg',6,29,32);\">Jdg 6:29, 32</a>), was the first of the judges whose history is circumstantially narrated (<a href=\"#\" onClick=\"return mV('Jdg',6,'1-');\">Jdg 6-8</a>). His calling is the commencement of the second period in the history of the judges. After the victory gained by Deborah and Barak over Jabin, Israel once more sank into idolatry, and the Midianites (q.v.) and Amalekites, with other \"children of the east,\" crossed the Jordan each year for seven successive years for the purpose of plundering and desolating the land. Gideon received a direct call from God to undertake the task of delivering the land from these warlike invaders. He was of the family of Abiezer (<a href=\"#\" onClick=\"return mV('Jos',17,2);\">Jos 17:2</a>; <a href=\"#\" onClick=\"return mV('1Ch',7,18);\">1Ch 7:18</a>), and of the little township of Ophrah (<a href=\"#\" onClick=\"return mV('Jdg',6,11);\">Jdg 6:11</a>). First, with ten of his servants, he overthrew the altars of Baal and cut down the asherah which was upon it, and then blew the trumpet of alarm, and the people flocked to his standard on the crest of Mount Gilboa to the number of twenty-two thousand men. These were, however, reduced to only three hundred. These, strangely armed with torches and pitchers and trumpets, rushed in from three different points on the camp of Midian at midnight, in the valley to the north of Moreh, with the terrible war-cry, \"For the Lord and for Gideon\" (<a href=\"#\" onClick=\"return mV('Jdg',7,18);\">Jdg 7:18</a>, R.V.). Terror-stricken, the Midianites were put into dire confusion, and in the darkness slew one another, so that only fifteen thousand out of the great army of one hundred and twenty thousand escaped alive. The memory of this great deliverance impressed itself deeply on the mind of the nation (<a href=\"#\" onClick=\"return mV('1Sa',12,11);\">1Sa 12:11</a>; <a href=\"#\" onClick=\"return mV('Psa',83,11);\">Psa 83:11</a>; <a href=\"#\" onClick=\"return mV('Isa',9,4);\">Isa 9:4</a>; <a href=\"#\" onClick=\"return mV('Isa',10,26);\">10:26</a>; <a href=\"#\" onClick=\"return mV('Hbr',11,32);\">Hbr 11:32</a>). The land had now rest for forty years. Gideon died in a good old age, and was buried in the sepulchre of his fathers. Soon after his death a change came over the people. They again forgot Jehovah, and turned to the worship of Baalim, \"neither shewed they kindness to the house of Jerubbaal\" (<a href=\"#\" onClick=\"return mV('Jdg',8,35);\">Jdg 8:35</a>). Gideon left behind him seventy sons, a feeble, sadly degenerated race, with one exception, that of Abimelech, who seems to have had much of the courage and energy of his father, yet of restless and unscrupulous ambition. He gathered around him a band who slaughtered all Gideon's sons, except Jotham, upon one stone. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002798');\">OPHRAH</a>.)";
eastonArray["$$T0001482"] = "<strong>Gier eagle:</strong> Heb. raham = \"parental affection,\" <a href=\"#\" onClick=\"return mV('Lev',11,18);\">Lev 11:18</a>; <a href=\"#\" onClick=\"return mV('Deu',14,17);\">Deu 14:17</a>; R.V., \"vulture\"), a species of vulture living entirely on carrion. \"It is about the size of a raven; has an almost triangular, bald, and wrinkled head, a strong pointed beak, black at the tip, large eyes and ears, the latter entirely on the outside, and long feet.\" It is common in Egypt, where it is popularly called \"Pharaoh's chicken\" (the <i>Neophron percnopterus</i>), and is found in Palestine only during summer. Tristram thinks that the Hebrew name, which is derived from a root meaning \"to love,\" is given to it from the fact that the male and female bird never part company.";
eastonArray["$$T0001483"] = "<strong>Gift:</strong><br><br>(1.) An gratuity (<a href=\"#\" onClick=\"return mV('Pro',19,6);\">Pro 19:6</a>) to secure favour (<a href=\"#\" onClick=\"return mV('Pro',18,16);\">18:16</a>; <a href=\"#\" onClick=\"return mV('Pro',21,14);\">21:14</a>), a thank-offering (<a href=\"#\" onClick=\"return mV('Num',18,11);\">Num 18:11</a>), or a dowry (<a href=\"#\" onClick=\"return mV('Gen',34,12);\">Gen 34:12</a>).<br><br>(2.) An oblation or propitatory gift (<a href=\"#\" onClick=\"return mV('2Sa',8,2,6);\">2Sa 8:2, 6</a>; <a href=\"#\" onClick=\"return mV('1Ch',18,2,6);\">1Ch 18:2, 6</a>; <a href=\"#\" onClick=\"return mV('2Ch',26,8);\">2Ch 26:8</a>; <a href=\"#\" onClick=\"return mV('Psa',45,12);\">Psa 45:12</a>; <a href=\"#\" onClick=\"return mV('Psa',72,10);\">72:10</a>).<br><br>(3.) A bribe to a judge to obtain a favourable verdict (<a href=\"#\" onClick=\"return mV('Exd',23,8);\">Exd 23:8</a>; <a href=\"#\" onClick=\"return mV('Deu',16,19);\">Deu 16:19</a>).<br><br>(4.) Simply a thing given (<a href=\"#\" onClick=\"return mV('Mat',7,11);\">Mat 7:11</a>; <a href=\"#\" onClick=\"return mV('Luk',11,13);\">Luk 11:13</a>; <a href=\"#\" onClick=\"return mV('Eph',4,8);\">Eph 4:8</a>); sacrifical (<a href=\"#\" onClick=\"return mV('Mat',5,23,24);\">Mat 5:23-24</a>; <a href=\"#\" onClick=\"return mV('Mat',8,4);\">8:4</a>); eleemosynary (<a href=\"#\" onClick=\"return mV('Luk',21,1);\">Luk 21:1</a>); a gratuity (<a href=\"#\" onClick=\"return mV('Jhn',4,10);\">Jhn 4:10</a>; <a href=\"#\" onClick=\"return mV('Act',8,20);\">Act 8:20</a>). In <a href=\"#\" onClick=\"return mV('Act',2,38);\">Act 2:38</a> the generic word dorea is rendered \"gift.\" It differs from the charisma (<a href=\"#\" onClick=\"return mV('1Cr',12,4);\">1Cr 12:4</a>) as denoting not miraculous powers but the working of a new spirit in men, and that spirit from God.<br><br>The giving of presents entered largely into the affairs of common life in the East. The nature of the presents was as various as were the occasions: food (<a href=\"#\" onClick=\"return mV('1Sa',9,7);\">1Sa 9:7</a>; <a href=\"#\" onClick=\"return mV('1Sa',16,20);\">16:20</a>), sheep and cattle (<a href=\"#\" onClick=\"return mV('Gen',32,'13-15');\">Gen 32:13-15</a>), gold (<a href=\"#\" onClick=\"return mV('2Sa',18,11);\">2Sa 18:11</a>), jewels (<a href=\"#\" onClick=\"return mV('Gen',24,53);\">Gen 24:53</a>), furniture, and vessels for eating and drinking (<a href=\"#\" onClick=\"return mV('2Sa',17,28);\">2Sa 17:28</a>); delicacies, as spices, honey, etc. (<a href=\"#\" onClick=\"return mV('1Ki',10,25);\">1Ki 10:25</a>; <a href=\"#\" onClick=\"return mV('2Ki',5,22);\">2Ki 5:22</a>). The mode of presentation was with as much parade as possible: the presents were conveyed by the hands of servants (<a href=\"#\" onClick=\"return mV('Jdg',3,18);\">Jdg 3:18</a>), or still better, on the backs of beasts of burden (<a href=\"#\" onClick=\"return mV('2Ki',8,9);\">2Ki 8:9</a>). The refusal of a present was regarded as a high indignity; and this constituted the aggravated insult noticed in <a href=\"#\" onClick=\"return mV('Mat',22,11);\">Mat 22:11</a>, the marriage robe having been offered and refused.";
eastonArray["$$T0001484"] = "<strong>Gifts, spiritual:</strong> (Gr. charismata), gifts supernaturally bestowed on the early Christians, each having his own proper gift or gifts for the edification of the body of Christ. These were the result of the extraordinary operation of the Spirit, as on the day of Pentecost. They were the gifts of speaking with tongues, casting out devils, healing, etc. (<a href=\"#\" onClick=\"return mV('Mar',16,17,18);\">Mar 16:17-18</a>), usually communicated by the medium of the laying on of the hands of the apostles (<a href=\"#\" onClick=\"return mV('Act',8,17);\">Act 8:17</a>; <a href=\"#\" onClick=\"return mV('Act',19,6);\">19:6</a>; <a href=\"#\" onClick=\"return mV('1Ti',4,14);\">1Ti 4:14</a>). These charismata were enjoyed only for a time. They could not continue always in the Church. They were suited to its infancy and to the necessities of those times.";
eastonArray["$$T0001485"] = "<strong>Gihon:</strong> a stream.<br><br>(1.) One of the four rivers of Eden (<a href=\"#\" onClick=\"return mV('Gen',2,13);\">Gen 2:13</a>). It has been identified with the Nile. Others regard it as the Oxus, or the Araxes, or the Ganges. But as, according to the sacred narrative, all these rivers of Eden took their origin from the head-waters of the Euphrates and the Trigris, it is probable that the Gihon is the ancient Araxes, which, under the modern name of the Arras, discharges itself into the Caspian Sea. It was the Asiatic and not the African \"Cush\" which the Gihon compassed (<a href=\"#\" onClick=\"return mV('Gen',10,'7-10');\">Gen 10:7-10</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001127');\">EDEN</a>.)<br><br>(2.) The only natural spring of water in or near Jerusalem is the \"Fountain of the Virgin\" (q.v.), which rises outside the city walls on the west bank of the Kidron valley. On the occasion of the approach of the Assyrian army under Sennacherib, Hezekiah, in order to prevent the besiegers from finding water, \"stopped the upper water course of Gihon, and brought it straight down to the west side of the city of David\" (<a href=\"#\" onClick=\"return mV('2Ch',32,30);\">2Ch 32:30</a>; <a href=\"#\" onClick=\"return mV('2Ch',33,14);\">33:14</a>). This \"fountain\" or spring is therefore to be regarded as the \"upper water course of Gihon.\" From this \"fountain\" a tunnel cut through the ridge which forms the south part of the temple hill conveys the water to the Pool of Siloam, which lies on the opposite side of this ridge at the head of the Tyropoeon (\"cheesemakers'\") valley, or valley of the son of Hinnom, now filled up by rubbish. The length of this tunnel is about 1,750 feet. In 1880 an inscription was accidentally discovered on the wall of the tunnel about nineteen feet from where it opens into the Pool of Siloam. This inscription was executed in all probability by Hezekiah's workmen. It briefly narrates the history of the excavation. It may, however, be possible that this tunnel was executed in the time of Solomon. If the \"waters of Shiloah that go softly\" (<a href=\"#\" onClick=\"return mV('Isa',8,6);\">Isa 8:6</a>) refers to the gentle stream that still flows through the tunnel into the Pool of Siloam, then this excavation must have existed before the time of Hezekiah.<br><br>In the upper part of the Tyropoeoan valley there are two pools still existing, the first, called Birket el-Mamilla, to the west of the Jaffa gate; the second, to the south of the first, called Birket es-Sultan. It is the opinion of some that the former was the \"upper\" and the latter the \"lower\" Pool of Gihon (<a href=\"#\" onClick=\"return mV('2Ki',18,17);\">2Ki 18:17</a>; <a href=\"#\" onClick=\"return mV('Isa',7,3);\">Isa 7:3</a>; <a href=\"#\" onClick=\"return mV('Isa',36,2);\">36:2</a>; <a href=\"#\" onClick=\"return mV('Isa',22,9);\">22:9</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000877');\">CONDUIT</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0003433');\">SILOAM</a>.)";
eastonArray["$$T0001486"] = "<strong>Gilboa:</strong> boiling spring, a mountain range, now Jebel Fukua', memorable as the scene of Saul's disastrous defeat by the Philistines. Here also his three sons were slain, and he himself died by his own hand (<a href=\"#\" onClick=\"return mV('1Sa',28,4);\">1Sa 28:4</a>; <a href=\"#\" onClick=\"return mV('1Sa',31,'1-8');\">31:1-8</a>; <a href=\"#\" onClick=\"return mV('2Sa',1,'6-21');\">2Sa 1:6-21</a>; <a href=\"#\" onClick=\"return mV('2Sa',21,12);\">21:12</a>; <a href=\"#\" onClick=\"return mV('1Ch',10,1,8);\">1Ch 10:1, 8</a>). It was a low barren range of mountains bounding the valley of Esdraelon (Jezreel) on the east, between it and the Jordan valley. When the tidings of this defeat were conveyed to David, he gave utterance to those pathetic words in the \"Song of the Bow\" (<a href=\"#\" onClick=\"return mV('2Sa',1,'19-27');\">2Sa 1:19-27</a>).";
eastonArray["$$T0001487"] = "<strong>Gilead:</strong> hill of testimony, (<a href=\"#\" onClick=\"return mV('Gen',31,21);\">Gen 31:21</a>), a mountainous region east of Jordan. From its mountainous character it is called \"the mount of Gilead\" (<a href=\"#\" onClick=\"return mV('Gen',31,25);\">Gen 31:25</a>). It is called also \"the land of Gilead\" (<a href=\"#\" onClick=\"return mV('Num',32,1);\">Num 32:1</a>), and sometimes simply \"Gilead\" (<a href=\"#\" onClick=\"return mV('Psa',60,7);\">Psa 60:7</a>; <a href=\"#\" onClick=\"return mV('Gen',37,25);\">Gen 37:25</a>). It comprised the possessions of the tribes of Gad and Reuben and the south part of Manasseh (<a href=\"#\" onClick=\"return mV('Deu',3,13);\">Deu 3:13</a>; <a href=\"#\" onClick=\"return mV('Num',32,40);\">Num 32:40</a>). It was bounded on the north by Bashan, and on the south by Moab and Ammon (<a href=\"#\" onClick=\"return mV('Gen',31,21);\">Gen 31:21</a>; <a href=\"#\" onClick=\"return mV('Deu',3,'12-17');\">Deu 3:12-17</a>). \"Half Gilead\" was possessed by Sihon, and the other half, separated from it by the river Jabbok, by Og, king of Bashan. The deep ravine of the river Hieromax (the modern Sheriat el-Mandhur) separated Bashan from Gilead, which was about 60 miles in length and 20 in breadth, extending from near the south end of the Lake of Gennesaret to the north end of the Dead Sea. Abarim, Pisgah, Nebo, and Peor are its mountains mentioned in Scripture.";
eastonArray["$$T0001488"] = "<strong>Gilead, Balm of:</strong> The region of Gilead abounded in spices and aromatic gums, which were exported to Egypt and Tyre (<a href=\"#\" onClick=\"return mV('Gen',37,25);\">Gen 37:25</a>; <a href=\"#\" onClick=\"return mV('Jer',8,22);\">Jer 8:22</a>; <a href=\"#\" onClick=\"return mV('Jer',46,11);\">46:11</a>; <a href=\"#\" onClick=\"return mV('Eze',27,17);\">Eze 27:17</a>). The word \"balm\" is a contracted form of \"balsam,\" a word derived from the Greek <i>balsamon</i>, which was adopted as the representative of the Hebrew words <i>baal shemen</i>, meaning \"lord\" or \"chief of oils.\"<br><br>The Hebrew name of this balm was <i>tsori</i>. The tree yielding this medicinal oil was probably the <i>Balsamodendron opobalsamum</i> of botanists, and the <i>Amyris opobalsamum</i> of Linnaeus. It is an evergreen, rising to the height of about 14 feet. The oil or resin, exuding through an orifice made in its bark in very small quantities, is esteemed of great value for its supposed medicinal qualities. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000427');\">BALM</a>.) It may be noted that Coverdale's version reads in <a href=\"#\" onClick=\"return mV('Jer',8,22);\">Jer 8:22</a>, \"There is no triacle in Galaad.\" The word \"triacle\" = \"treacle\" is used in the sense of ointment.";
eastonArray["$$T0001489"] = "<strong>Gilgal:</strong> rolling.<br><br>(1.) From the solemn transaction of the reading of the law in the valley of Shechem between Ebal and Gerizim the Israelites moved forward to Gilgal, and there made a permanent camp (<a href=\"#\" onClick=\"return mV('Jos',9,6);\">Jos 9:6</a>; <a href=\"#\" onClick=\"return mV('Jos',10,6);\">10:6</a>). It was \"beside the oaks of Moreh,\" near which Abraham erected his first altar (<a href=\"#\" onClick=\"return mV('Gen',12,6,7);\">Gen 12:6-7</a>). This was one of the three towns to which Samuel resorted for the administration of justice (<a href=\"#\" onClick=\"return mV('1Sa',7,16);\">1Sa 7:16</a>), and here also he offered sacrifices when the ark was no longer in the tabernacle at Shiloh (<a href=\"#\" onClick=\"return mV('1Sa',10,8);\">1Sa 10:8</a>; <a href=\"#\" onClick=\"return mV('1Sa',13,'7-9');\">13:7-9</a>). To this place, as to a central sanctuary, all Israel gathered to renew their allegiance to Saul (<a href=\"#\" onClick=\"return mV('1Sa',11,14);\">11:14</a>). At a later period it became the scene of idolatrous worship (<a href=\"#\" onClick=\"return mV('Hsa',4,15);\">Hsa 4:15</a>; <a href=\"#\" onClick=\"return mV('Hsa',9,15);\">9:15</a>). It has been identified with the ruins of Jiljilieh, about 5 miles south-west of Shiloh and about the same distance from Bethel.<br><br>(2.) The place in \"the plains of Jericho,\" \"in the east border of Jericho,\" where the Israelites first encamped after crossing the Jordan (<a href=\"#\" onClick=\"return mV('Jos',4,19,20);\">Jos 4:19-20</a>). Here they kept their first Passover in the land of Canaan (<a href=\"#\" onClick=\"return mV('Jos',5,10);\">5:10</a>) and renewed the rite of circumcision, and so \"rolled away the reproach\" of their Egyptian slavery. Here the twelve memorial stones, taken from the bed of the Jordan, were set up; and here also the tabernacle remained till it was removed to Shiloh (<a href=\"#\" onClick=\"return mV('Jos',18,1);\">18:1</a>). It has been identified with Tell Jiljulieh, about 5 miles from Jordan.<br><br>(3.) A place, probably in the hill country of Ephraim, where there was a school of the prophets (<a href=\"#\" onClick=\"return mV('2Ki',4,38);\">2Ki 4:38</a>), and whence Elijah and Elisha, who resided here, \"went down\" to Bethel (<a href=\"#\" onClick=\"return mV('2Ki',2,1,2);\">2:1-2</a>). It is mentioned also in <a href=\"#\" onClick=\"return mV('Deu',11,30);\">Deu 11:30</a>. It is now known as Jiljilia, a place 8 miles north of Bethel.";
eastonArray["$$T0001490"] = "<strong>Giloh:</strong> exile, a city in the south-west part of the hill-country of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,51);\">Jos 15:51</a>). It was the native place or residence of the traitor Ahithophel \"the Gilonite\" (<a href=\"#\" onClick=\"return mV('Jos',15,51);\">Jos 15:51</a>; <a href=\"#\" onClick=\"return mV('2Sa',15,12);\">2Sa 15:12</a>), and where he committed suicide (<a href=\"#\" onClick=\"return mV('2Sa',17,23);\">17:23</a>). It has been identified with Kurbet Jala, about 7 miles north of Hebron.";
eastonArray["$$T0001491"] = "<strong>Gimzo:</strong> a place fertile in sycamores, a city in the plain of Judah, the villages of which were seized by the Philistines (<a href=\"#\" onClick=\"return mV('2Ch',28,18);\">2Ch 28:18</a>). It is now called Jimzu, about 3 miles south-east of Ludd, i.e., Lydda.";
eastonArray["$$T0001492"] = "<strong>Gin:</strong> a trap.<br><br>(1.) <a href=\"#\" onClick=\"return mV('Psa',140,5);\">Psa 140:5</a>; <a href=\"#\" onClick=\"return mV('Psa',140,5);\">141:9, <a href=\"#\" onClick=\"return mV('Amo',3,5);\">Amo 3:5</a>, the Hebrew word used, <i>mokesh</i>, means a noose or \"snare,\" as it is elsewhere rendered (<a href=\"#\" onClick=\"return mV('Psa',18,5);\">Psa 18:5</a>; <a href=\"#\" onClick=\"return mV('Pro',13,14);\">Pro 13:14</a>, etc.).<br><br>(2.) <a href=\"#\" onClick=\"return mV('Job',18,9);\">Job 18:9</a>; <a href=\"#\" onClick=\"return mV('Isa',8,14);\">Isa 8:14</a>, Heb. pah, a plate or thin layer; and hence a net, a snare, trap, especially of a fowler (<a href=\"#\" onClick=\"return mV('Psa',69,22);\">Psa 69:22</a>), \"Let their table before them become a net;\" <a href=\"#\" onClick=\"return mV('Amo',3,5);\">Amo 3:5</a>, \"Doth a bird fall into a net [pah] upon the ground where there is no trap-stick [mokesh] for her? doth the net [pah] spring up from the ground and take nothing at all?\", [Gesenius.]";
eastonArray["$$T0001493"] = "<strong>Girdle:</strong><br><br>(1.) Heb. hagor, a girdle of any kind worn by soldiers (<a href=\"#\" onClick=\"return mV('1Sa',18,4);\">1Sa 18:4</a>; <a href=\"#\" onClick=\"return mV('2Sa',20,8);\">2Sa 20:8</a>; <a href=\"#\" onClick=\"return mV('1Ki',2,5);\">1Ki 2:5</a>; <a href=\"#\" onClick=\"return mV('2Ki',3,21);\">2Ki 3:21</a>) or women (<a href=\"#\" onClick=\"return mV('Isa',3,24);\">Isa 3:24</a>).<br><br>(2.) Heb. 'ezor, something \"bound,\" worn by prophets (<a href=\"#\" onClick=\"return mV('2Ki',1,8);\">2Ki 1:8</a>; <a href=\"#\" onClick=\"return mV('Jer',13,1);\">Jer 13:1</a>), soldiers (<a href=\"#\" onClick=\"return mV('Isa',5,27);\">Isa 5:27</a>; <a href=\"#\" onClick=\"return mV('2Sa',20,8);\">2Sa 20:8</a>; <a href=\"#\" onClick=\"return mV('Eze',23,15);\">Eze 23:15</a>), Kings (<a href=\"#\" onClick=\"return mV('Job',12,18);\">Job 12:18</a>).<br><br>(3.) Heb. mezah, a \"band,\" a girdle worn by men alone (<a href=\"#\" onClick=\"return mV('Psa',109,19);\">Psa 109:19</a>; <a href=\"#\" onClick=\"return mV('Isa',22,21);\">Isa 22:21</a>).<br><br>(4.) Heb. 'abnet, the girdle of sacerdotal and state officers (<a href=\"#\" onClick=\"return mV('Exd',28,4,39,40);\">Exd 28:4, 39-40</a>; <a href=\"#\" onClick=\"return mV('Exd',29,9);\">29:9</a>; <a href=\"#\" onClick=\"return mV('Exd',39,29);\">39:29</a>).<br><br>(5.) Heb. hesheb, the \"curious girdle\" (<a href=\"#\" onClick=\"return mV('Exd',28,8);\">Exd 28:8</a>; R.V., \"cunningly woven band\") was attached to the ephod, and was made of the same material.<br><br>The common girdle was made of leather (<a href=\"#\" onClick=\"return mV('2Ki',1,8);\">2Ki 1:8</a>; <a href=\"#\" onClick=\"return mV('Mat',3,4);\">Mat 3:4</a>); a finer sort of linen (<a href=\"#\" onClick=\"return mV('Jer',13,1);\">Jer 13:1</a>; <a href=\"#\" onClick=\"return mV('Eze',16,10);\">Eze 16:10</a>; <a href=\"#\" onClick=\"return mV('Dan',10,5);\">Dan 10:5</a>). Girdles of sackcloth were worn in token of sorrow (<a href=\"#\" onClick=\"return mV('Isa',3,24);\">Isa 3:24</a>; <a href=\"#\" onClick=\"return mV('Isa',22,12);\">22:12</a>). They were variously fastened to the wearer (<a href=\"#\" onClick=\"return mV('Mar',1,6);\">Mar 1:6</a>; <a href=\"#\" onClick=\"return mV('Jer',13,1);\">Jer 13:1</a>; <a href=\"#\" onClick=\"return mV('Eze',16,10);\">Eze 16:10</a>).<br><br>The girdle was a symbol of strength and power (<a href=\"#\" onClick=\"return mV('Job',12,18,21);\">Job 12:18, 21</a>; <a href=\"#\" onClick=\"return mV('Job',30,11);\">30:11</a>; <a href=\"#\" onClick=\"return mV('Isa',22,21);\">Isa 22:21</a>; <a href=\"#\" onClick=\"return mV('Isa',45,5);\">45:5</a>). \"Righteousness and faithfulness\" are the girdle of the Messiah (<a href=\"#\" onClick=\"return mV('Isa',11,5);\">Isa 11:5</a>).<br><br>Girdles were used as purses or pockets (<a href=\"#\" onClick=\"return mV('Mat',10,9);\">Mat 10:9</a>. A. V., \"purses\"; Also <a href=\"#\" onClick=\"return mV('Mar',6,8);\">Mar 6:8</a>).";
eastonArray["$$T0001494"] = "<strong>Girgashite:</strong> dwelling in clayey soil, the descendants of the fifth son of Canaan (<a href=\"#\" onClick=\"return mV('Gen',10,16);\">Gen 10:16</a>), one of the original tribes inhabiting the land of Canaan before the time of the Israelites (<a href=\"#\" onClick=\"return mV('Gen',15,21);\">Gen 15:21</a>; <a href=\"#\" onClick=\"return mV('Deu',7,1);\">Deu 7:1</a>). They were a branch of the great family of the Hivites. Of their geographical position nothing is certainly known. Probably they lived somewhere in the central part of Western Palestine.";
eastonArray["$$T0001495"] = "<strong>Gittah-hepher:</strong> (<a href=\"#\" onClick=\"return mV('Jos',19,13);\">Jos 19:13</a>). See <a href=\"#\" onClick=\"return doDictLookup('ET0001438');\">GATH-HEPHER</a>.";
eastonArray["$$T0001496"] = "<strong>Gittaim:</strong> two wine-presses, (<a href=\"#\" onClick=\"return mV('2Sa',4,3);\">2Sa 4:3</a>; <a href=\"#\" onClick=\"return mV('Neh',11,33);\">Neh 11:33</a>), a town probably in Benjamin to which the Beerothites fled.";
eastonArray["$$T0001497"] = "<strong>Gittite:</strong> a native of the Philistine city of Gath (<a href=\"#\" onClick=\"return mV('Jos',13,3);\">Jos 13:3</a>). Obed-edom, in whose house the ark was placed, is so designated (<a href=\"#\" onClick=\"return mV('2Sa',6,10);\">2Sa 6:10</a>). Six hundred Gittites came with David from Gath into Israel (<a href=\"#\" onClick=\"return mV('2Sa',15,18,19);\">15:18-19</a>).";
eastonArray["$$T0001498"] = "<strong>Gittith:</strong> a stringed instrument of music. This word is found in the titles of <a href=\"#\" onClick=\"return mV('Psa',8,'1-');\">Psa 8</a>; <a href=\"#\" onClick=\"return mV('Psa',81,'1-');\">81</a>; <a href=\"#\" onClick=\"return mV('Psa',84,'1-');\">84</a>. In these places the LXX. render the word by \"on the wine-fats.\" The Targum explains by \"on the harp which David brought from Gath.\" It is the only stringed instrument named in the titles of the Psalms.";
eastonArray["$$T0001499"] = "<strong>Gizonite:</strong> a name given to Hashem, an inhabitant of Gizoh, a place somewhere in the mountains of Judah (<a href=\"#\" onClick=\"return mV('1Ch',11,34);\">1Ch 11:34</a>; <a href=\"#\" onClick=\"return mV('2Sa',23,32,34);\">2Sa 23:32, 34</a>).";
</script>
