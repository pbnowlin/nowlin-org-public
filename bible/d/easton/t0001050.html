<script>
var eastonArray = new Array ();
eastonArray["$$T0001050"] = "<strong>Doctor:</strong> (<a href=\"#\" onClick=\"return mV('Luk',2,46);\">Luk 2:46</a>; <a href=\"#\" onClick=\"return mV('Luk',5,17);\">5:17</a>; <a href=\"#\" onClick=\"return mV('Act',5,34);\">Act 5:34</a>), a teacher. The Jewish doctors taught and disputed in synagogues, or wherever they could find an audience. Their disciples were allowed to propose to them questions. They assumed the office without any appointment to it. The doctors of the law were principally of the sect of the Pharisees. Schools were established after the destruction of Jerusalem at Babylon and Tiberias, in which academical degrees were conferred on those who passed a certain examination. Those of the school of Tiberias were called by the title \"rabbi,\" and those of Babylon by that of \"master.\"";
eastonArray["$$T0001051"] = "<strong>Dodai:</strong> loving, one of David's captains (<a href=\"#\" onClick=\"return mV('1Ch',27,4);\">1Ch 27:4</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001053');\">DODO [2]</a>.)";
eastonArray["$$T0001052"] = "<strong>Dodanim:</strong> leaders, a race descended from Javan (<a href=\"#\" onClick=\"return mV('Gen',10,4);\">Gen 10:4</a>). They are known in profane history as the Dardani, originally inhabiting Illyricum. They were a semi-Pelasgic race, and in the ethnographical table (<a href=\"#\" onClick=\"return mV('Gen',10,'1-')\">Gen 10</a>) they are grouped with the Chittim (q.v.). In <a href=\"#\" onClick=\"return mV('1Ch',1,7);\">1Ch 1:7</a>, they are called Rodanim. The LXX. and the Samaritan Version also read Rhodii, whence some have concluded that the Rhodians, the inhabitants of the island of Rhodes, are meant.";
eastonArray["$$T0001053"] = "<strong>Dodo:</strong> amatory; loving.<br><br>(1.) A descendant of Issachar (<a href=\"#\" onClick=\"return mV('Jdg',10,1);\">Jdg 10:1</a>).<br><br>(2.) An Ahohite, father of Eleazar, who was one of David's three heroes (<a href=\"#\" onClick=\"return mV('2Sa',23,9);\">2Sa 23:9</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,12);\">1Ch 11:12</a>). He was the same with Dodai mentioned in <a href=\"#\" onClick=\"return mV('1Ch',27,4);\">1Ch 27:4</a>.<br><br>(3.) A Bethlehemite, and father of Elhanan, who was one of David's thirty heroes (<a href=\"#\" onClick=\"return mV('2Sa',23,24);\">2Sa 23:24</a>).";
eastonArray["$$T0001054"] = "<strong>Doeg:</strong> fearful, an Edomite, the chief overseer of Saul's flocks (<a href=\"#\" onClick=\"return mV('1Sa',21,7);\">1Sa 21:7</a>). At the command of Saul he slew the high priest Ahimelech (q.v.) at Nob, together with all the priests to the number of eighty-five persons. (Comp. <a href=\"#\" onClick=\"return mV('Psa',52,'1-');\">Psa 52</a>, title.)";
eastonArray["$$T0001055"] = "<strong>Dog:</strong> frequently mentioned both in the Old and New Testaments. Dogs were used by the Hebrews as a watch for their houses (<a href=\"#\" onClick=\"return mV('Isa',56,10);\">Isa 56:10</a>), and for guarding their flocks (<a href=\"#\" onClick=\"return mV('Job',30,1);\">Job 30:1</a>). There were also then as now troops of semi-wild dogs that wandered about devouring dead bodies and the offal of the streets (<a href=\"#\" onClick=\"return mV('1Ki',14,11);\">1Ki 14:11</a>; <a href=\"#\" onClick=\"return mV('1Ki',16,4);\">16:4</a>; <a href=\"#\" onClick=\"return mV('1Ki',21,19,23);\">21:19, 23</a>; <a href=\"#\" onClick=\"return mV('1Ki',22,38);\">22:38</a>; <a href=\"#\" onClick=\"return mV('Psa',59,6,14);\">Psa 59:6, 14</a>).<br><br>As the dog was an unclean animal, the terms \"dog,\" \"dog's head,\" \"dead dog,\" were used as terms of reproach or of humiliation (<a href=\"#\" onClick=\"return mV('1Sa',24,14);\">1Sa 24:14</a>; <a href=\"#\" onClick=\"return mV('2Sa',3,8);\">2Sa 3:8</a>; <a href=\"#\" onClick=\"return mV('2Sa',9,8);\">9:8</a>; <a href=\"#\" onClick=\"return mV('2Sa',16,9);\">16:9</a>). Paul calls false apostles \"dogs\" (<a href=\"#\" onClick=\"return mV('Phl',3,2);\">Phl 3:2</a>). Those who are shut out of the kingdom of heaven are also so designated (<a href=\"#\" onClick=\"return mV('Rev',22,15);\">Rev 22:15</a>). Persecutors are called \"dogs\" (<a href=\"#\" onClick=\"return mV('Psa',22,16);\">Psa 22:16</a>). Hazael's words, \"Thy servant which is but a dog\" (<a href=\"#\" onClick=\"return mV('2Ki',8,13);\">2Ki 8:13</a>), are spoken in mock humility=impossible that one so contemptible as he should attain to such power.";
eastonArray["$$T0001056"] = "<strong>Doleful creatures:</strong> (occurring only <a href=\"#\" onClick=\"return mV('Isa',13,21);\">Isa 13:21</a>. Heb. ochim, i.e., \"shrieks; \" hence \"howling animals\"), a general name for screech owls (howlets), which occupy the desolate palaces of Babylon. Some render the word \"hyaenas.\"";
eastonArray["$$T0001057"] = "<strong>Door-keeper:</strong> This word is used in <a href=\"#\" onClick=\"return mV('Psa',84,10);\">Psa 84:10</a> (R.V. marg., \"stand at the threshold of,\" etc.), but there it signifies properly \"sitting at the threshold in the house of God.\" The psalmist means that he would rather stand at the door of God's house and merely look in, than dwell in houses where iniquity prevailed.<br><br>Persons were appointed to keep the street door leading into the interior of the house (<a href=\"#\" onClick=\"return mV('Jhn',18,16,17);\">Jhn 18:16-17</a>; <a href=\"#\" onClick=\"return mV('Act',12,13);\">Act 12:13</a>). Sometimes females held this post.";
eastonArray["$$T0001058"] = "<strong>Door-posts:</strong> The Jews were commanded to write the divine name on the posts (mezuzoth') of their doors (<a href=\"#\" onClick=\"return mV('Deu',6,9);\">Deu 6:9</a>). The Jews, misunderstanding this injunction, adopted the custom of writing on a slip of parchment these verses (<a href=\"#\" onClick=\"return mV('Deu',6,'4-9');\">Deu 6:4-9</a>, and <a href=\"#\" onClick=\"return mV('Deu',11,'13-21');\">11:13-21</a>), which they enclosed in a reed or cylinder and fixed on the right-hand door-post of every room in the house.";
eastonArray["$$T0001059"] = "<strong>Doors:</strong> moved on pivots of wood fastened in sockets above and below (<a href=\"#\" onClick=\"return mV('Pro',26,14);\">Pro 26:14</a>). They were fastened by a lock (<a href=\"#\" onClick=\"return mV('Jdg',3,23,25);\">Jdg 3:23, 25</a>; <a href=\"#\" onClick=\"return mV('Sgs',5,5);\">Sgs 5:5</a>) or by a bar (<a href=\"#\" onClick=\"return mV('Jdg',16,3);\">Jdg 16:3</a>; <a href=\"#\" onClick=\"return mV('Job',38,10);\">Job 38:10</a>). In the interior of Oriental houses, curtains were frequently used instead of doors.<br><br>The entrances of the tabernacle had curtains (<a href=\"#\" onClick=\"return mV('Exd',26,'31-33',36);\">Exd 26:31-33, 36</a>). The \"valley of Achor\" is called a \"door of hope,\" because immediately after the execution of Achan the Lord said to Joshua, \"Fear not,\" and from that time Joshua went forward in a career of uninterrupted conquest. Paul speaks of a \"door opened\" for the spread of the gospel (<a href=\"#\" onClick=\"return mV('1Cr',16,9);\">1Cr 16:9</a>; <a href=\"#\" onClick=\"return mV('2Cr',2,12);\">2Cr 2:12</a>; <a href=\"#\" onClick=\"return mV('Col',4,3);\">Col 4:3</a>). Our Lord says of himself, \"I am the door\" (<a href=\"#\" onClick=\"return mV('Jhn',10,9);\">Jhn 10:9</a>). John (<a href=\"#\" onClick=\"return mV('Rev',4,1);\">Rev 4:1</a>) speaks of a \"door opened in heaven.\"";
eastonArray["$$T0001060"] = "<strong>Dophkah:</strong> knocking, an encampment of the Israelites in the wilderness (<a href=\"#\" onClick=\"return mV('Num',33,12);\">Num 33:12</a>). It was in the desert of Sin, on the eastern shore of the western arm of the Red Sea, somewhere in the Wady Feiran.";
eastonArray["$$T0001061"] = "<strong>Dor:</strong> dwelling, the Dora of the Romans, an ancient royal city of the Canaanites (<a href=\"#\" onClick=\"return mV('Jos',11,1,2);\">Jos 11:1-2</a>; <a href=\"#\" onClick=\"return mV('Jos',12,23);\">12:23</a>). It was the most southern settlement of the Phoenicians on the coast of Syria. The original inhabitants seem never to have been expelled, although they were made tributary by David. It was one of Solomon's commissariat districts (<a href=\"#\" onClick=\"return mV('Jdg',1,27);\">Jdg 1:27</a>; <a href=\"#\" onClick=\"return mV('1Ki',4,11);\">1Ki 4:11</a>). It has been identified with Tantura (so named from the supposed resemblance of its tower to a tantur, i.e., \"a horn\"). This tower fell in 1895, and nothing remains but debris and foundation walls, the remains of an old Crusading fortress. It is about 8 miles north of Caesarea, \"a sad and sickly hamlet of wretched huts on a naked sea-beach.\"";
eastonArray["$$T0001062"] = "<strong>Dorcas:</strong> a female antelope, or gazelle, a pious Christian widow at Joppa whom Peter restored to life (<a href=\"#\" onClick=\"return mV('Act',9,'36-41');\">Act 9:36-41</a>). She was a Hellenistic Jewess, called Tabitha by the Jews and Dorcas by the Greeks.";
eastonArray["$$T0001063"] = "<strong>Dothan:</strong> two wells, a famous pasture-ground where Joseph found his brethren watching their flocks. Here, at the suggestion of Judah, they sold him to the Ishmaelite merchants (<a href=\"#\" onClick=\"return mV('Gen',37,17);\">Gen 37:17</a>). It is mentioned on monuments in B.C. 1600.<br><br>It was the residence of Elisha (<a href=\"#\" onClick=\"return mV('2Ki',6,13);\">2Ki 6:13</a>), and the scene of a remarkable vision of chariots and horses of fire surrounding the mountain on which the city stood. It is identified with the modern Tell-Dothan, on the south side of the plain of Jezreel, about 12 miles north of Samaria, among the hills of Gilboa. The \"two wells\" are still in existence, one of which bears the name of the \"pit of Joseph\" (Jubb Yusuf).";
eastonArray["$$T0001064"] = "<strong>Dough:</strong> (batsek, meaning \"swelling,\" i.e., in fermentation). The dough the Israelites had prepared for baking was carried away by them out of Egypt in their kneading-troughs (<a href=\"#\" onClick=\"return mV('Exd',12,34,39);\">Exd 12:34, 39</a>). In the process of baking, the dough had to be turned (<a href=\"#\" onClick=\"return mV('Hsa',7,8);\">Hsa 7:8</a>).";
eastonArray["$$T0001065"] = "<strong>Dove:</strong> In their wild state doves generally build their nests in the clefts of rocks, but when domesticated \"dove-cots\" are prepared for them (<a href=\"#\" onClick=\"return mV('Sgs',2,14);\">Sgs 2:14</a>; <a href=\"#\" onClick=\"return mV('Jer',48,28);\">Jer 48:28</a>; <a href=\"#\" onClick=\"return mV('Isa',60,8);\">Isa 60:8</a>). The dove was placed on the standards of the Assyrians and Babylonians in honour, it is supposed, of Semiramis (<a href=\"#\" onClick=\"return mV('Jer',25,38);\">Jer 25:38</a>; Vulg., \"fierceness of the dove; <a href=\"#\" onClick=\"return mV('Jer',46,16);\">Jer 46:16</a>; <a href=\"#\" onClick=\"return mV('Jer',50,16);\">50:16</a>). Doves and turtle-doves were the only birds that could be offered in sacrifice, as they were clean according to the Mosaic law (<a href=\"#\" onClick=\"return mV('Gen',15,9);\">Gen 15:9</a>; <a href=\"#\" onClick=\"return mV('Lev',5,7);\">Lev 5:7</a>; <a href=\"#\" onClick=\"return mV('Lev',12,6);\">12:6</a>; <a href=\"#\" onClick=\"return mV('Luk',2,24);\">Luk 2:24</a>). The dove was the harbinger of peace to Noah (<a href=\"#\" onClick=\"return mV('Gen',8,8,10);\">Gen 8:8, 10</a>). It is often mentioned as the emblem of purity (<a href=\"#\" onClick=\"return mV('Psa',68,13);\">Psa 68:13</a>). It is a symbol of the Holy Spirit (<a href=\"#\" onClick=\"return mV('Gen',1,2);\">Gen 1:2</a>; <a href=\"#\" onClick=\"return mV('Mat',3,16);\">Mat 3:16</a>; <a href=\"#\" onClick=\"return mV('Mar',1,10);\">Mar 1:10</a>; <a href=\"#\" onClick=\"return mV('Luk',3,22);\">Luk 3:22</a>; <a href=\"#\" onClick=\"return mV('Jhn',1,32);\">Jhn 1:32</a>); also of tender and devoted affection (<a href=\"#\" onClick=\"return mV('Sgs',1,15);\">Sgs 1:15</a>; <a href=\"#\" onClick=\"return mV('Sgs',2,14);\">2:14</a>). David in his distress wished that he had the wings of a dove, that he might fly away and be at rest (<a href=\"#\" onClick=\"return mV('Psa',55,'6-8');\">Psa 55:6-8</a>). There is a species of dove found at Damascus \"whose feathers, all except the wings, are literally as yellow as gold\" (<a href=\"#\" onClick=\"return mV('Psa',68,13);\">68:13</a>).";
eastonArray["$$T0001066"] = "<strong>Dove's dung:</strong> (<a href=\"#\" onClick=\"return mV('2Ki',6,25);\">2Ki 6:25</a>) has been generally understood literally. There are instances in history of the dung of pigeons being actually used as food during a famine. Compare also the language of Rabshakeh to the Jews (<a href=\"#\" onClick=\"return mV('2Ki',18,27);\">2Ki 18:27</a>; <a href=\"#\" onClick=\"return mV('Isa',36,12);\">Isa 36:12</a>). This name, however, is applied by the Arabs to different vegetable substances, and there is room for the opinion of those who think that some such substance is here referred to, as, e.g., the seeds of a kind of millet, or a very inferior kind of pulse, or the root of the ornithogalum, i.e., bird-milk, the star-of-Bethlehem.";
eastonArray["$$T0001067"] = "<strong>Dowry:</strong> (mohar; <a href=\"#\" onClick=\"return mV('Gen',34,12);\">Gen 34:12</a>; <a href=\"#\" onClick=\"return mV('Exd',22,17);\">Exd 22:17</a>; <a href=\"#\" onClick=\"return mV('1Sa',18,25);\">1Sa 18:25</a>), a nuptial present; some gift, as a sum of money, which the bridegroom offers to the father of his bride as a satisfaction before he can receive her. Jacob had no dowry to give for his wife, but he gave his services (<a href=\"#\" onClick=\"return mV('Gen',29,18);\">Gen 29:18</a>; <a href=\"#\" onClick=\"return mV('Gen',30,20);\">30:20</a>; <a href=\"#\" onClick=\"return mV('Gen',34,12);\">34:12</a>).";
eastonArray["$$T0001068"] = "<strong>Dragon:</strong><br><br>(1.) Heb. tannim, plural of tan. The name of some unknown creature inhabiting desert places and ruins (<a href=\"#\" onClick=\"return mV('Job',30,29);\">Job 30:29</a>; <a href=\"#\" onClick=\"return mV('Psa',44,19);\">Psa 44:19</a>; <a href=\"#\" onClick=\"return mV('Isa',13,22);\">Isa 13:22</a>; <a href=\"#\" onClick=\"return mV('Isa',34,13);\">34:13</a>; <a href=\"#\" onClick=\"return mV('Isa',43,20);\">43:20</a>; <a href=\"#\" onClick=\"return mV('Jer',10,22);\">Jer 10:22</a>; <a href=\"#\" onClick=\"return mV('Mic',1,8);\">Mic 1:8</a>; <a href=\"#\" onClick=\"return mV('Mal',1,3);\">Mal 1:3</a>); probably, as translated in the Revised Version, the jackal (q.v.).<br><br>(2.) Heb. tannin. Some great sea monster (<a href=\"#\" onClick=\"return mV('Jer',51,34);\">Jer 51:34</a>). In <a href=\"#\" onClick=\"return mV('Isa',51,9);\">Isa. 51:9</a> it may denote the crocodile. In <a href=\"#\" onClick=\"return mV('Gen',1,21);\">Gen 1:21</a> (Heb. plural tanninim) the Authorized Version renders \"whales,\" and the Revised Version \"sea monsters.\" It is rendered \"serpent\" in <a href=\"#\" onClick=\"return mV('Exd',7,9);\">Exd 7:9</a>. It is used figuratively in <a href=\"#\" onClick=\"return mV('Psa',74,13);\">Psa 74:13</a>; <a href=\"#\" onClick=\"return mV('Eze',29,3);\">Eze 29:3</a>.<br><br>In the New Testament the word \"dragon\" is found only in <a href=\"#\" onClick=\"return mV('Rev',12,3,4,7,9,16,17);\">Rev. 12:3, 4, 7, 9, 16, 17</a>, etc., and is there used metaphorically of \"Satan.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0003805');\">WHALE</a>.)";
eastonArray["$$T0001069"] = "<strong>Dragon well:</strong> (<a href=\"#\" onClick=\"return mV('Neh',2,13);\">Neh 2:13</a>), supposed by some to be identical with the Pool of Gihon.";
eastonArray["$$T0001070"] = "<strong>Dram:</strong> The Authorized Version understood the word 'adarkonim (<a href=\"#\" onClick=\"return mV('1Ch',29,7);\">1Ch 29:7</a>; <a href=\"#\" onClick=\"return mV('Ezr',8,27);\">Ezr 8:27</a>), and the similar word darkomnim (<a href=\"#\" onClick=\"return mV('Ezr',2,69);\">Ezr 2:69</a>; <a href=\"#\" onClick=\"return mV('Neh',7,70);\">Neh 7:70</a>), as equivalent to the Greek silver coin the drachma. But the Revised Version rightly regards it as the Greek dareikos, a Persian gold coin (the daric) of the value of about 1 pound, 2s., which was first struck by Darius, the son of Hystaspes, and was current in Western Asia long after the fall of the Persian empire. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000974');\">DARIC</a>.)";
eastonArray["$$T0001071"] = "<strong>Draught-house:</strong> (<a href=\"#\" onClick=\"return mV('2Ki',10,27);\">2Ki 10:27</a>). Jehu ordered the temple of Baal to be destroyed, and the place to be converted to the vile use of receiving offal or ordure. (<a href=\"#\" onClick=\"return mV('Mat',15,17);\">Mat 15:17</a>.)";
eastonArray["$$T0001072"] = "<strong>Drawer of water:</strong> (<a href=\"#\" onClick=\"return mV('Deu',29,11);\">Deu 29:11</a>; <a href=\"#\" onClick=\"return mV('Jos',9,21,23);\">Jos 9:21, 23</a>), a servile employment to which the Gibeonites were condemned.";
eastonArray["$$T0001073"] = "<strong>Dream:</strong> God has frequently made use of dreams in communicating his will to men. The most remarkable instances of this are recorded in the history of Jacob (<a href=\"#\" onClick=\"return mV('Gen',28,12);\">Gen 28:12</a>; <a href=\"#\" onClick=\"return mV('Gen',31,10);\">31:10</a>), Laban (<a href=\"#\" onClick=\"return mV('Gen',31,24);\">31:24</a>), Joseph (<a href=\"#\" onClick=\"return mV('Gen',37,'9-11');\">37:9-11</a>), Gideon (<a href=\"#\" onClick=\"return mV('Jdg',7,'1-')\">Jdg 7</a>), and Solomon (<a href=\"#\" onClick=\"return mV('1Ki',3,5);\">1Ki 3:5</a>). Other significant dreams are also recorded, such as those of Abimelech (<a href=\"#\" onClick=\"return mV('Gen',20,'3-7');\">Gen 20:3-7</a>), Pharaoh's chief butler and baker (<a href=\"#\" onClick=\"return mV('Gen',40,5);\">40:5</a>), Pharaoh (<a href=\"#\" onClick=\"return mV('Gen',41,'1-8');\">41:1-8</a>), the Midianites (<a href=\"#\" onClick=\"return mV('Jdg',7,13);\">Jdg 7:13</a>), Nebuchadnezzar (<a href=\"#\" onClick=\"return mV('Dan',2,1);\">Dan 2:1</a>; <a href=\"#\" onClick=\"return mV('Dan',4,10,18);\">4:10, 18</a>), the wise men from the east (<a href=\"#\" onClick=\"return mV('Mat',2,12);\">Mat 2:12</a>), and Pilate's wife (<a href=\"#\" onClick=\"return mV('Mat',27,19);\">27:19</a>).<br><br>To Joseph \"the Lord appeared in a dream,\" and gave him instructions regarding the infant Jesus (<a href=\"#\" onClick=\"return mV('Mat',1,20);\">Mat 1:20</a>; <a href=\"#\" onClick=\"return mV('Mat',2,12,13,19);\">2:12-13, 19</a>). In a vision of the night a \"man of Macedonia\" stood before Paul and said, \"Come over into Macedonia and help us\" (<a href=\"#\" onClick=\"return mV('Act',16,9);\">Act 16:9</a>; see also <a href=\"#\" onClick=\"return mV('Act',18,9);\">Act 18:9</a>; <a href=\"#\" onClick=\"return mV('Act',27,23);\">27:23</a>).";
eastonArray["$$T0001074"] = "<strong>Dredge:</strong> (<a href=\"#\" onClick=\"return mV('Job',24,6);\">Job 24:6</a>). See <a href=\"#\" onClick=\"return doDictLookup('ET0000904');\">CORN</a>.";
eastonArray["$$T0001075"] = "<strong>Dregs:</strong> (<a href=\"#\" onClick=\"return mV('Psa',75,8);\">Psa 75:8</a>; <a href=\"#\" onClick=\"return mV('Isa',51,17,22);\">Isa 51:17, 22</a>), the lees of wine which settle at the bottom of the vessel.";
eastonArray["$$T0001076"] = "<strong>Dress:</strong><br><br>(1.) Materials used. The earliest and simplest an apron of fig-leaves sewed together (<a href=\"#\" onClick=\"return mV('Gen',3,7);\">Gen 3:7</a>); then skins of animals (<a href=\"#\" onClick=\"return mV('Gen',3,21);\">3:21</a>). Elijah's dress was probably the skin of a sheep (<a href=\"#\" onClick=\"return mV('2Ki',1,8);\">2Ki 1:8</a>). The Hebrews were early acquainted with the art of weaving hair into cloth (<a href=\"#\" onClick=\"return mV('Exd',26,7);\">Exd 26:7</a>; <a href=\"#\" onClick=\"return mV('Exd',35,6);\">35:6</a>), which formed the sackcloth of mourners. This was the material of John the Baptist's robe (<a href=\"#\" onClick=\"return mV('Mat',3,4);\">Mat 3:4</a>). Wool was also woven into garments (<a href=\"#\" onClick=\"return mV('Lev',13,47);\">Lev 13:47</a>; <a href=\"#\" onClick=\"return mV('Deu',22,11);\">Deu 22:11</a>; <a href=\"#\" onClick=\"return mV('Eze',34,3);\">Eze 34:3</a>; <a href=\"#\" onClick=\"return mV('Job',31,20);\">Job 31:20</a>; <a href=\"#\" onClick=\"return mV('Pro',27,26);\">Pro 27:26</a>). The Israelites probably learned the art of weaving linen when they were in Egypt (<a href=\"#\" onClick=\"return mV('1Ch',4,21);\">1Ch 4:21</a>). Fine linen was used in the vestments of the high priest (<a href=\"#\" onClick=\"return mV('Exd',28,5);\">Exd 28:5</a>), as well as by the rich (<a href=\"#\" onClick=\"return mV('Gen',41,42);\">Gen 41:42</a>; <a href=\"#\" onClick=\"return mV('Pro',31,22);\">Pro 31:22</a>; <a href=\"#\" onClick=\"return mV('Luk',16,19);\">Luk 16:19</a>). The use of mixed material, as wool and flax, was forbidden (<a href=\"#\" onClick=\"return mV('Lev',19,19);\">Lev 19:19</a>; <a href=\"#\" onClick=\"return mV('Deu',22,11);\">Deu 22:11</a>).<br><br>(2.) Colour. The prevailing colour was the natural white of the material used, which was sometimes rendered purer by the fuller's art (<a href=\"#\" onClick=\"return mV('Psa',104,1,2);\">Psa 104:1-2</a>; <a href=\"#\" onClick=\"return mV('Isa',63,3);\">Isa 63:3</a>; <a href=\"#\" onClick=\"return mV('Mar',9,3);\">Mar 9:3</a>). The Hebrews were acquainted with the art of dyeing (<a href=\"#\" onClick=\"return mV('Gen',37,3,23);\">Gen 37:3, 23</a>). Various modes of ornamentation were adopted in the process of weaving (<a href=\"#\" onClick=\"return mV('Exd',28,6);\">Exd 28:6</a>; <a href=\"#\" onClick=\"return mV('Exd',26,1,31);\">26:1, 31</a>; <a href=\"#\" onClick=\"return mV('Exd',35,25);\">35:25</a>), and by needle-work (<a href=\"#\" onClick=\"return mV('Jdg',5,30);\">Jdg 5:30</a>; <a href=\"#\" onClick=\"return mV('Psa',45,13);\">Psa 45:13</a>). Dyed robes were imported from foreign countries, particularly from Phoenicia (<a href=\"#\" onClick=\"return mV('Zep',1,8);\">Zep 1:8</a>). Purple and scarlet robes were the marks of the wealthy (<a href=\"#\" onClick=\"return mV('Luk',16,19);\">Luk 16:19</a>; <a href=\"#\" onClick=\"return mV('2Sa',1,24);\">2Sa 1:24</a>).<br><br>(3.) Form. The robes of men and women were not very much different in form from each other.<br><br>(a) The \"coat\" (kethoneth), of wool, cotton, or linen, was worn by both sexes. It was a closely-fitting garment, resembling in use and form our shirt (<a href=\"#\" onClick=\"return mV('Jhn',19,23);\">Jhn 19:23</a>). It was kept close to the body by a girdle (<a href=\"#\" onClick=\"return mV('Jhn',21,7);\">Jhn 21:7</a>). A person wearing this \"coat\" alone was described as naked (<a href=\"#\" onClick=\"return mV('1Sa',19,24);\">1Sa 19:24</a>; <a href=\"#\" onClick=\"return mV('Isa',20,2);\">Isa 20:2</a>; <a href=\"#\" onClick=\"return mV('2Ki',6,30);\">2Ki 6:30</a>; <a href=\"#\" onClick=\"return mV('Jhn',21,7);\">Jhn 21:7</a>); deprived of it he would be absolutely naked.<br><br>(b) A linen cloth or wrapper (sadin) of fine linen, used somewhat as a night-shirt (<a href=\"#\" onClick=\"return mV('Mar',14,51);\">Mar 14:51</a>). It is mentioned in (<a href=\"#\" onClick=\"return mV('Jdg',14,12,13);\">Jdg. 14:12, 13</a>, and rendered there \"sheets.\"<br><br>(c) An upper tunic (meil), longer than the \"coat\" (<a href=\"#\" onClick=\"return mV('1Sa',2,19);\">1Sa 2:19</a>; <a href=\"#\" onClick=\"return mV('1Sa',24,4);\">24:4</a>; <a href=\"#\" onClick=\"return mV('1Sa',28,14);\">28:14</a>). In <a href=\"#\" onClick=\"return mV('1Sa',28,14);\">1Sa 28:14</a> it is the mantle in which Samuel was enveloped; in <a href=\"#\" onClick=\"return mV('1Sa',24,4);\">1Sa 24:4</a> it is the \"robe\" under which Saul slept. The disciples were forbidden to wear two \"coats\" (<a href=\"#\" onClick=\"return mV('Mat',10,10);\">Mat 10:10</a>; <a href=\"#\" onClick=\"return mV('Luk',9,3);\">Luk 9:3</a>).<br><br>(d) The usual outer garment consisted of a piece of woollen cloth like a Scotch plaid, either wrapped round the body or thrown over the shoulders like a shawl, with the ends hanging down in front, or it might be thrown over the head so as to conceal the face (<a href=\"#\" onClick=\"return mV('2Sa',15,30);\">2Sa 15:30</a>; <a href=\"#\" onClick=\"return mV('Est',6,12);\">Est 6:12</a>). It was confined to the waist by a girdle, and the fold formed by the overlapping of the robe served as a pocket (<a href=\"#\" onClick=\"return mV('2Ki',4,39);\">2Ki 4:39</a>; <a href=\"#\" onClick=\"return mV('Psa',79,12);\">Psa 79:12</a>; <a href=\"#\" onClick=\"return mV('Hag',2,12);\">Hag 2:12</a>; <a href=\"#\" onClick=\"return mV('Pro',17,23);\">Pro 17:23</a>; <a href=\"#\" onClick=\"return mV('Pro',21,14);\">21:14</a>).<br><br>Female dress. The \"coat\" was common to both sexes (<a href=\"#\" onClick=\"return mV('Sgs',5,3);\">Sgs 5:3</a>). But peculiar to females were<br><br>(1) the \"veil\" or \"wimple,\" a kind of shawl (<a href=\"#\" onClick=\"return mV('Rth',3,15);\">Rth 3:15</a>; <a href=\"#\" onClick=\"return mV('Isa',3,22);\">Isa 3:22</a>);<br><br>(2) the \"mantle,\" also a species of shawl (<a href=\"#\" onClick=\"return mV('Isa',3,22);\">Isa 3:22</a>);<br><br>(3) a \"veil,\" probably a light summer dress (<a href=\"#\" onClick=\"return mV('Gen',24,65);\">Gen 24:65</a>);<br><br>(4) a \"stomacher,\" a holiday dress (<a href=\"#\" onClick=\"return mV('Isa',3,24);\">Isa 3:24</a>). The outer garment terminated in an ample fringe or border, which concealed the feet (<a href=\"#\" onClick=\"return mV('Isa',47,2);\">Isa 47:2</a>; <a href=\"#\" onClick=\"return mV('Jer',13,22);\">Jer 13:22</a>).<br><br>The dress of the Persians is described in <a href=\"#\" onClick=\"return mV('Dan',3,21);\">Dan 3:21</a>.<br><br>The reference to the art of sewing are few, inasmuch as the garments generally came forth from the loom ready for being worn, and all that was required in the making of clothes devolved on the women of a family (<a href=\"#\" onClick=\"return mV('Pro',31,22);\">Pro 31:22</a>; <a href=\"#\" onClick=\"return mV('Act',9,39);\">Act 9:39</a>).<br><br>Extravagance in dress is referred to in <a href=\"#\" onClick=\"return mV('Jer',4,30);\">Jer 4:30</a>; <a href=\"#\" onClick=\"return mV('Eze',16,10);\">Eze 16:10</a>; <a href=\"#\" onClick=\"return mV('Zep',1,8);\">Zep 1:8</a> (R.V., \"foreign apparel\"); <a href=\"#\" onClick=\"return mV('1Ti',2,9);\">1Ti 2:9</a>; <a href=\"#\" onClick=\"return mV('1Pe',3,3);\">1Pe 3:3</a>. Rending the robes was expressive of grief (<a href=\"#\" onClick=\"return mV('Gen',37,29,34);\">Gen 37:29, 34</a>), fear (<a href=\"#\" onClick=\"return mV('1Ki',21,27);\">1Ki 21:27</a>), indignation (<a href=\"#\" onClick=\"return mV('2Ki',5,7);\">2Ki 5:7</a>), or despair (<a href=\"#\" onClick=\"return mV('Jdg',11,35);\">Jdg 11:35</a>; <a href=\"#\" onClick=\"return mV('Est',4,1);\">Est 4:1</a>).<br><br>Shaking the garments, or shaking the dust from off them, was a sign of renunciation (<a href=\"#\" onClick=\"return mV('Act',18,6);\">Act 18:6</a>); wrapping them round the head, of awe (<a href=\"#\" onClick=\"return mV('1Ki',19,13);\">1Ki 19:13</a>) or grief (<a href=\"#\" onClick=\"return mV('2Sa',15,30);\">2Sa 15:30</a>); casting them off, of excitement (<a href=\"#\" onClick=\"return mV('Act',22,23);\">Act 22:23</a>); laying hold of them, of supplication (<a href=\"#\" onClick=\"return mV('1Sa',15,27);\">1Sa 15:27</a>). In the case of travelling, the outer garments were girded up (<a href=\"#\" onClick=\"return mV('1Ki',18,46);\">1Ki 18:46</a>). They were thrown aside also when they would impede action (<a href=\"#\" onClick=\"return mV('Mar',10,50);\">Mar 10:50</a>; <a href=\"#\" onClick=\"return mV('Jhn',13,4);\">Jhn 13:4</a>; <a href=\"#\" onClick=\"return mV('Act',7,58);\">Act 7:58</a>).";
eastonArray["$$T0001077"] = "<strong>Drink:</strong> The drinks of the Hebrews were water, wine, \"strong drink,\" and vinegar. Their drinking vessels were the cup, goblet or \"basin,\" the \"cruse\" or pitcher, and the saucer.<br><br>To drink water by measure (<a href=\"#\" onClick=\"return mV('Eze',4,11);\">Eze 4:11</a>), and to buy water to drink (<a href=\"#\" onClick=\"return mV('Lam',5,4);\">Lam 5:4</a>), denote great scarcity. To drink blood means to be satiated with slaughter.<br><br>The Jews carefully strained their drinks through a sieve, through fear of violating the law of <a href=\"#\" onClick=\"return mV('Lev',11,20,23,41,42);\">Lev 11:20, 23, 41-42</a>. (See <a href=\"#\" onClick=\"return mV('Mat',23,24);\">Mat 23:24</a>. \"Strain at\" should be \"strain out.\")";
eastonArray["$$T0001078"] = "<strong>Drink-offering:</strong> consisted of wine (<a href=\"#\" onClick=\"return mV('Num',15,5);\">Num 15:5</a>; <a href=\"#\" onClick=\"return mV('Hsa',9,4);\">Hsa 9:4</a>) poured around the altar (<a href=\"#\" onClick=\"return mV('Exd',30,9);\">Exd 30:9</a>). Joined with meat-offerings (<a href=\"#\" onClick=\"return mV('Num',6,15,17);\">Num 6:15, 17</a>; <a href=\"#\" onClick=\"return mV('2Ki',16,13);\">2Ki 16:13</a>; <a href=\"#\" onClick=\"return mV('Joe',1,9,13);\">Joe 1:9, 13</a>; <a href=\"#\" onClick=\"return mV('Joe',2,14);\">2:14</a>), presented daily (<a href=\"#\" onClick=\"return mV('Exd',29,40);\">Exd 29:40</a>), on the Sabbath (<a href=\"#\" onClick=\"return mV('Num',28,9);\">Num 28:9</a>), and on feast-days (<a href=\"#\" onClick=\"return mV('Num',28,14);\">28:14</a>). One-fourth of an hin of wine was required for one lamb, one-third for a ram, and one-half for a bullock (<a href=\"#\" onClick=\"return mV('Num',15,5);\">Num 15:5</a>; <a href=\"#\" onClick=\"return mV('Num',28,7,14);\">28:7, 14</a>). \"Drink offerings of blood\" (<a href=\"#\" onClick=\"return mV('Psa',16,4);\">Psa 16:4</a>) is used in allusion to the heathen practice of mingling the blood of animals sacrificed with wine or water, and pouring out the mixture in the worship of the gods, and the idea conveyed is that the psalmist would not partake of the abominations of the heathen.";
eastonArray["$$T0001079"] = "<strong>Drink, strong:</strong> (Heb. shekar'), an intoxicating liquor (<a href=\"#\" onClick=\"return mV('Jdg',13,4);\">Jdg 13:4</a>; <a href=\"#\" onClick=\"return mV('Luk',1,15);\">Luk 1:15</a>; <a href=\"#\" onClick=\"return mV('Isa',5,11);\">Isa 5:11</a>; <a href=\"#\" onClick=\"return mV('Mic',2,11);\">Mic 2:11</a>) distilled from corn, honey, or dates. The effects of the use of strong drink are referred to in <a href=\"#\" onClick=\"return mV('Psa',107,27);\">Psa 107:27</a>; <a href=\"#\" onClick=\"return mV('Isa',24,20);\">Isa 24:20</a>; <a href=\"#\" onClick=\"return mV('Isa',49,26);\">49:26</a>; <a href=\"#\" onClick=\"return mV('Isa',51,'17-22');\">51:17-22</a>. Its use prohibited, <a href=\"#\" onClick=\"return mV('Pro',20,1);\">Pro 20:1</a>. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003816');\">WINE</a>.)";
eastonArray["$$T0001080"] = "<strong>Dromedary:</strong> (<a href=\"#\" onClick=\"return mV('Isa',60,6);\">Isa 60:6</a>), an African or Arabian species of camel having only one hump, while the Bactrian camel has two. It is distinguished from the camel only as a trained saddle-horse is distinguished from a cart-horse. It is remarkable for its speed (<a href=\"#\" onClick=\"return mV('Jer',2,23);\">Jer 2:23</a>). Camels are frequently spoken of in partriarchal times (<a href=\"#\" onClick=\"return mV('Gen',12,16);\">Gen 12:16</a>; <a href=\"#\" onClick=\"return mV('Gen',24,10);\">24:10</a>; <a href=\"#\" onClick=\"return mV('Gen',30,43);\">30:43</a>; <a href=\"#\" onClick=\"return mV('Gen',31,17);\">31:17</a>, etc.). They were used for carrying burdens (<a href=\"#\" onClick=\"return mV('Gen',37,25);\">Gen 37:25</a>; <a href=\"#\" onClick=\"return mV('Jdg',6,5);\">Jdg 6:5</a>), and for riding (<a href=\"#\" onClick=\"return mV('Gen',24,64);\">Gen 24:64</a>). The hair of the camel falls off of itself in spring, and is woven into coarse cloths and garments (<a href=\"#\" onClick=\"return mV('Mat',3,4);\">Mat 3:4</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000698');\">CAMEL</a>.)";
eastonArray["$$T0001081"] = "<strong>Dropsy:</strong> mentioned only in <a href=\"#\" onClick=\"return mV('Luk',14,2);\">Luk 14:2</a>. The man afflicted with it was cured by Christ on the Sabbath.";
eastonArray["$$T0001082"] = "<strong>Dross:</strong> the impurities of silver separated from the one in the process of melting (<a href=\"#\" onClick=\"return mV('Pro',25,4);\">Pro 25:4</a>; <a href=\"#\" onClick=\"return mV('Pro',26,23);\">26:23</a>; <a href=\"#\" onClick=\"return mV('Psa',119,119);\">Psa 119:119</a>). It is also used to denote the base metal itself, probably before it is smelted, in <a href=\"#\" onClick=\"return mV('Isa',1,22,25);\">Isa 1:22, 25</a>.";
eastonArray["$$T0001083"] = "<strong>Drought:</strong> From the middle of May to about the middle of August the land of Palestine is dry. It is then the \"drought of summer\" (<a href=\"#\" onClick=\"return mV('Gen',31,40);\">Gen 31:40</a>; <a href=\"#\" onClick=\"return mV('Psa',32,4);\">Psa 32:4</a>), and the land suffers (<a href=\"#\" onClick=\"return mV('Deu',28,23);\">Deu 28:23</a>; <a href=\"#\" onClick=\"return mV('Psa',102,4);\">Ps. 102:4</a>), vegetation being preserved only by the dews (<a href=\"#\" onClick=\"return mV('Hag',1,11);\">Hag 1:11</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001026');\">DEW</a>.)";
eastonArray["$$T0001084"] = "<strong>Drown:</strong> (<a href=\"#\" onClick=\"return mV('Exd',15,4);\">Exd 15:4</a>; <a href=\"#\" onClick=\"return mV('Amo',8,8);\">Amo 8:8</a>; <a href=\"#\" onClick=\"return mV('Hbr',11,29);\">Hbr 11:29</a>). Drowning was a mode of capital punishment in use among the Syrians, and was known to the Jews in the time of our Lord. To this he alludes in <a href=\"#\" onClick=\"return mV('Mat',18,6);\">Mat 18:6</a>.";
eastonArray["$$T0001085"] = "<strong>Drunk:</strong> The first case of intoxication on record is that of Noah (<a href=\"#\" onClick=\"return mV('Gen',9,21);\">Gen 9:21</a>). The sin of drunkenness is frequently and strongly condemned (<a href=\"#\" onClick=\"return mV('Rom',13,13);\">Rom 13:13</a>; <a href=\"#\" onClick=\"return mV('1Cr',6,9,10);\">1Cr 6:9-10</a>; <a href=\"#\" onClick=\"return mV('Eph',5,18);\">Eph 5:18</a>; <a href=\"#\" onClick=\"return mV('1Th',5,7,8);\">1Th 5:7-8</a>). The sin of drinking to excess seems to have been not uncommon among the Israelites.<br><br>The word is used figuratively, when men are spoken of as being drunk with sorrow, and with the wine of God's wrath (<a href=\"#\" onClick=\"return mV('Isa',63,6);\">Isa 63:6</a>; <a href=\"#\" onClick=\"return mV('Jer',51,57);\">Jer 51:57</a>; <a href=\"#\" onClick=\"return mV('Eze',23,33);\">Eze 23:33</a>). To \"add drunkenness to thirst\" (<a href=\"#\" onClick=\"return mV('Deu',29,19);\">Deu 29:19</a>, A.V.) is a proverbial expression, rendered in the Revised Version \"to destroy the moist with the dry\", i.e., the well-watered equally with the dry land, meaning that the effect of such walking in the imagination of their own hearts would be to destroy one and all.";
eastonArray["$$T0001086"] = "<strong>Drusilla:</strong> third and youngest daughter of Herod Agrippa I. (<a href=\"#\" onClick=\"return mV('Act',12,'1-4','20-23');\">Act 12:1-4, 20-23</a>). Felix, the Roman procurator of Judea, induced her to leave her husband, Azizus, the king of Emesa, and become his wife. She was present with Felix when Paul reasoned of \"righteousness, temperance, and judgment to come\" (<a href=\"#\" onClick=\"return mV('Act',24,24);\">Act 24:24</a>). She and her son perished in the eruption of Mount Vesuvius, A.D. 79.";
eastonArray["$$T0001087"] = "<strong>Duke:</strong> derived from the Latin dux, meaning \"a leader;\" Arabic, \"a sheik.\" This word is used to denote the phylarch or chief of a tribe (<a href=\"#\" onClick=\"return mV('Gen',36,'15-43');\">Gen 36:15-43</a>; <a href=\"#\" onClick=\"return mV('Exd',15,15);\">Exd 15:15</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,'51-54');\">1Ch 1:51-54</a>).";
eastonArray["$$T0001088"] = "<strong>Dulcimer:</strong> (Heb. sumphoniah), a musical instrument mentioned in <a href=\"#\" onClick=\"return mV('Dan',3,5,15);\">Dan 3:5, 15</a>, along with other instruments there named, as sounded before the golden image. It was not a Jewish instrument. In the margin of the Revised Version it is styled the \"bag-pipe.\" Luther translated it \"lute,\" and Grotius the \"crooked trumpet.\" It is probable that it was introduced into Babylon by some Greek or Western-Asiatic musician. Some Rabbinical commentators render it by \"organ,\" the well-known instrument composed of a series of pipes, others by \"lyre.\" The most probable interpretation is that it was a bag-pipe similar to the zampagna of Southern Europe.";
eastonArray["$$T0001089"] = "<strong>Dumah:</strong> silence, (<a href=\"#\" onClick=\"return mV('Psa',94,17);\">Psa 94:17</a>), the fourth son of Ishmael; also the tribe descended from him; and hence also the region in Arabia which they inhabited (<a href=\"#\" onClick=\"return mV('Gen',25,14);\">Gen 25:14</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,30);\">1Ch 1:30</a>).<br><br>There was also a town of this name in Judah (<a href=\"#\" onClick=\"return mV('Jos',15,52);\">Jos 15:52</a>), which has been identified with ed-Domeh, about 10 miles southwest of Hebron. The place mentioned in the \"burden\" of the prophet Isaiah (<a href=\"#\" onClick=\"return mV('Isa',21,11);\">Isa 21:11</a>) is Edom or Idumea.";
eastonArray["$$T0001090"] = "<strong>Dumb:</strong> from natural infirmity (<a href=\"#\" onClick=\"return mV('Exd',4,11);\">Exd 4:11</a>); not knowing what to say (<a href=\"#\" onClick=\"return mV('Pro',31,8);\">Pro 31:8</a>); unwillingness to speak (<a href=\"#\" onClick=\"return mV('Psa',39,9);\">Psa 39:9</a>; <a href=\"#\" onClick=\"return mV('Lev',10,3);\">Lev 10:3</a>). Christ repeatedly restored the dumb (<a href=\"#\" onClick=\"return mV('Mat',9,32,33);\">Mat 9:32-33</a>; <a href=\"#\" onClick=\"return mV('Luk',11,14);\">Luk 11:14</a>; <a href=\"#\" onClick=\"return mV('Mat',12,22);\">Mat 12:22</a>) to the use of speech.";
eastonArray["$$T0001091"] = "<strong>Dung:</strong><br><br>(1.) Used as manure (<a href=\"#\" onClick=\"return mV('Luk',13,8);\">Luk 13:8</a>); collected outside the city walls (<a href=\"#\" onClick=\"return mV('Neh',2,13);\">Neh 2:13</a>). Of sacrifices, burned outside the camp (<a href=\"#\" onClick=\"return mV('Exd',29,14);\">Exd 29:14</a>; <a href=\"#\" onClick=\"return mV('Lev',4,11);\">Lev 4:11</a>; <a href=\"#\" onClick=\"return mV('Lev',8,17);\">8:17</a>; <a href=\"#\" onClick=\"return mV('Num',19,5);\">Num 19:5</a>). To be \"cast out as dung,\" a figurative expression (<a href=\"#\" onClick=\"return mV('1Ki',14,10);\">1Ki 14:10</a>; <a href=\"#\" onClick=\"return mV('2Ki',9,37);\">2Ki 9:37</a>; <a href=\"#\" onClick=\"return mV('Jer',8,2);\">Jer 8:2</a>; <a href=\"#\" onClick=\"return mV('Psa',18,42);\">Psa 18:42</a>), meaning to be rejected as unprofitable.<br><br>(2.) Used as fuel, a substitute for firewood, which was with difficulty procured in Syria, Arabia, and Egypt (<a href=\"#\" onClick=\"return mV('Eze',4,'12-15');\">Eze 4:12-15</a>), where 'cows' and 'camels' dung is used to the present day for this purpose.";
eastonArray["$$T0001092"] = "<strong>Dungeon:</strong> different from the ordinary prison in being more severe as a place of punishment. Like the Roman inner prison (<a href=\"#\" onClick=\"return mV('Act',16,24);\">Act 16:24</a>), it consisted of a deep cell or cistern (<a href=\"#\" onClick=\"return mV('Jer',38,6);\">Jer 38:6</a>). To be shut up in, a punishment common in Egypt (<a href=\"#\" onClick=\"return mV('Gen',39,20);\">Gen 39:20</a>; <a href=\"#\" onClick=\"return mV('Gen',40,3);\">40:3</a>; <a href=\"#\" onClick=\"return mV('Gen',41,10);\">41:10</a>; <a href=\"#\" onClick=\"return mV('Gen',42,19);\">42:19</a>). It is not mentioned, however, in the law of Moses as a mode of punishment. Under the later kings imprisonment was frequently used as a punishment (<a href=\"#\" onClick=\"return mV('2Ch',16,10);\">2Ch 16:10</a>; <a href=\"#\" onClick=\"return mV('Jer',20,2);\">Jer 20:2</a>; <a href=\"#\" onClick=\"return mV('Jer',32,2);\">32:2</a>; <a href=\"#\" onClick=\"return mV('Jer',33,1);\">33:1</a>; <a href=\"#\" onClick=\"return mV('Jer',37,15);\">37:15</a>), and it was customary after the Exile (<a href=\"#\" onClick=\"return mV('Mat',11,2);\">Mat 11:2</a>; <a href=\"#\" onClick=\"return mV('Luk',3,20);\">Luk 3:20</a>; <a href=\"#\" onClick=\"return mV('Act',5,18,21);\">Act 5:18, 21</a>; <a href=\"#\" onClick=\"return mV('Mat',18,30);\">Mat 18:30</a>).";
eastonArray["$$T0001093"] = "<strong>Dung-gate:</strong> (<a href=\"#\" onClick=\"return mV('Neh',2,13);\">Neh 2:13</a>), a gate of ancient Jerusalem, on the south-west quarter. \"The gate outside of which lay the piles of sweepings and offscourings of the streets,\" in the valley of Tophet.";
eastonArray["$$T0001094"] = "<strong>Dung-hill:</strong> to sit on a, was a sign of the deepest dejection (<a href=\"#\" onClick=\"return mV('1Sa',2,8);\">1Sa 2:8</a>; <a href=\"#\" onClick=\"return mV('Psa',113,7);\">Psa 113:7</a>; <a href=\"#\" onClick=\"return mV('Lam',4,5);\">Lam 4:5</a>).";
eastonArray["$$T0001095"] = "<strong>Dura:</strong> the circle, the plain near Babylon in which Nebuchadnezzar set up a golden image, mentioned in <a href=\"#\" onClick=\"return mV('Dan',3,1);\">Dan 3:1</a>. The place still retains its ancient name. On one of its many mounds the pedestal of what must have been a colossal statue has been found. It has been supposed to be that of the golden image.";
eastonArray["$$T0001096"] = "<strong>Dust:</strong> Storms of sand and dust sometimes overtake Eastern travellers. They are very dreadful, many perishing under them. Jehovah threatens to bring on the land of Israel, as a punishment for forsaking him, a rain of \"powder and dust\" (<a href=\"#\" onClick=\"return mV('Deu',28,24);\">Deu 28:24</a>).<br><br>To cast dust on the head was a sign of mourning (<a href=\"#\" onClick=\"return mV('Jos',7,6);\">Jos 7:6</a>); and to sit in dust, of extreme affliction (<a href=\"#\" onClick=\"return mV('Isa',47,1);\">Isa 47:1</a>). \"Dust\" is used to denote the grave (<a href=\"#\" onClick=\"return mV('Job',7,21);\">Job 7:21</a>). \"To shake off the dust from one's feet\" against another is to renounce all future intercourse with him (<a href=\"#\" onClick=\"return mV('Mat',10,14);\">Mat 10:14</a>; <a href=\"#\" onClick=\"return mV('Act',13,51);\">Act 13:51</a>). To \"lick the dust\" is a sign of abject submission (<a href=\"#\" onClick=\"return mV('Psa',72,9);\">Psa 72:9</a>); and to throw dust at one is a sign of abhorrence (<a href=\"#\" onClick=\"return mV('2Sa',16,13);\">2Sa 16:13</a>; <a href=\"#\" onClick=\"return mV('Act',22,23);\">Act 22:23</a>).";
eastonArray["$$T0001097"] = "<strong>Dwarf:</strong> a lean or emaciated person (<a href=\"#\" onClick=\"return mV('Lev',21,20);\">Lev 21:20</a>).";
eastonArray["$$T0001098"] = "<strong>Dwell:</strong> Tents were in primitive times the common dwellings of men. Houses were afterwards built, the walls of which were frequently of mud (<a href=\"#\" onClick=\"return mV('Job',24,16);\">Job 24:16</a>; <a href=\"#\" onClick=\"return mV('Mat',6,19,20);\">Mat 6:19-20</a>) or of sun-dried bricks.<br><br>God \"dwells in light\" (<a href=\"#\" onClick=\"return mV('1Ti',6,16);\">1Ti 6:16</a>; <a href=\"#\" onClick=\"return mV('1Jo',1,7);\">1Jo 1:7</a>), in heaven (<a href=\"#\" onClick=\"return mV('Psa',123,1);\">Psa 123:1</a>), in his church (<a href=\"#\" onClick=\"return mV('Psa',9,11);\">Psa 9:11</a>; <a href=\"#\" onClick=\"return mV('1Jo',4,12);\">1Jo 4:12</a>). Christ dwelt on earth in the days of his humiliation (<a href=\"#\" onClick=\"return mV('Jhn',1,14);\">Jhn 1:14</a>). He now dwells in the hearts of his people (<a href=\"#\" onClick=\"return mV('Eph',3,'17-19');\">Eph 3:17-19</a>). The Holy Spirit dwells in believers (<a href=\"#\" onClick=\"return mV('1Cr',3,16);\">1Cr 3:16</a>; <a href=\"#\" onClick=\"return mV('2Ti',1,14);\">2Ti 1:14</a>). We are exhorted to \"let the word of God dwell in us richly\" (<a href=\"#\" onClick=\"return mV('Col',3,16);\">Col 3:16</a>; <a href=\"#\" onClick=\"return mV('Psa',119,11);\">Psa 119:11</a>).<br><br>Dwell deep occurs only in <a href=\"#\" onClick=\"return mV('Jer',49,8);\">Jer 49:8</a>, and refers to the custom of seeking refuge from impending danger, in retiring to the recesses of rocks and caverns, or to remote places in the desert.";
eastonArray["$$T0001099"] = "<strong>Dwellings:</strong> The materials used in buildings were commonly bricks, sometimes also stones (<a href=\"#\" onClick=\"return mV('Lev',14,40,42);\">Lev 14:40, 42</a>), which were held together by cement (<a href=\"#\" onClick=\"return mV('Jer',43,9);\">Jer 43:9</a>) or bitumen (<a href=\"#\" onClick=\"return mV('Gen',11,3);\">Gen 11:3</a>). The exterior was usually whitewashed (<a href=\"#\" onClick=\"return mV('Lev',14,41);\">Lev 14:41</a>; <a href=\"#\" onClick=\"return mV('Eze',13,10);\">Eze 13:10</a>; <a href=\"#\" onClick=\"return mV('Mat',23,27);\">Mat 23:27</a>). The beams were of sycamore (<a href=\"#\" onClick=\"return mV('Isa',9,10);\">Isa 9:10</a>), or olive-wood, or cedar (<a href=\"#\" onClick=\"return mV('1Ki',7,2);\">1Ki 7:2</a>; <a href=\"#\" onClick=\"return mV('Isa',9,10);\">Isa 9:10</a>).<br><br>The form of Eastern dwellings differed in many respects from that of dwellings in Western lands. The larger houses were built in a quadrangle enclosing a court-yard (<a href=\"#\" onClick=\"return mV('Luk',5,19);\">Luk 5:19</a>; <a href=\"#\" onClick=\"return mV('2Sa',17,18);\">2Sa 17:18</a>; <a href=\"#\" onClick=\"return mV('Neh',8,16);\">Neh 8:16</a>) surrounded by galleries, which formed the guest-chamber or reception-room for visitors. The flat roof, surrounded by a low parapet, was used for many domestic and social purposes. It was reached by steps from the court. In connection with it (<a href=\"#\" onClick=\"return mV('2Ki',23,12);\">2Ki 23:12</a>) was an upper room, used as a private chamber (<a href=\"#\" onClick=\"return mV('2Sa',18,33);\">2Sa 18:33</a>; <a href=\"#\" onClick=\"return mV('Dan',6,11);\">Dan 6:11</a>), also as a bedroom (<a href=\"#\" onClick=\"return mV('2Ki',23,12);\">2Ki 23:12</a>), a sleeping apartment for guests (<a href=\"#\" onClick=\"return mV('2Ki',4,10);\">2Ki 4:10</a>), and as a sick-chamber (<a href=\"#\" onClick=\"return mV('1Ki',17,19);\">1Ki 17:19</a>). The doors, sometimes of stone, swung on morticed pivots, and were generally fastened by wooden bolts. The houses of the more wealthy had a doorkeeper or a female porter (<a href=\"#\" onClick=\"return mV('Jhn',18,16);\">Jhn 18:16</a>; <a href=\"#\" onClick=\"return mV('Act',12,13);\">Act 12:13</a>). The windows generally opened into the courtyard, and were closed by a lattice (<a href=\"#\" onClick=\"return mV('Jdg',5,28);\">Jdg 5:28</a>). The interior rooms were set apart for the female portion of the household.<br><br>The furniture of the room (<a href=\"#\" onClick=\"return mV('2Ki',4,10);\">2Ki 4:10</a>) consisted of a couch furnished with pillows (<a href=\"#\" onClick=\"return mV('Amo',6,4);\">Amo 6:4</a>; <a href=\"#\" onClick=\"return mV('Eze',13,20);\">Eze 13:20</a>); and besides this, chairs, a table and lanterns or lamp-stands (<a href=\"#\" onClick=\"return mV('2Ki',4,10);\">2Ki 4:10</a>).";
</script>
