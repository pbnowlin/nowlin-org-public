<script>
var eastonArray = new Array ();
eastonArray["$$T0000200"] = "<b>Amen:</b> This Hebrew word means firm, and hence also faithful (<a href=\"#\" onClick=\"return mV('Rev',3,14);\">Rev 3:14</a>). In <a href=\"#\" onClick=\"return mV('Isa',65,16);\">Isa 65:16</a>, the Authorized Version has \"the God of truth,\" which in Hebrew is \"the God of Amen.\" It is frequently used by our Saviour to give emphasis to his words, where it is translated \"verily.\" Sometimes, only, however, in John's Gospel, it is repeated, \"Verily, verily.\" It is used as an epithet of the Lord Jesus Christ (<a href=\"#\" onClick=\"return mV('Rev',3,14);\">Rev 3:14</a>).<br><br>It is found singly and sometimes doubly at the end of prayers (<a href=\"#\" onClick=\"return mV('Psa',41,13);\">Psa 41:13</a>; <a href=\"#\" onClick=\"return mV('Psa',72,19);\">72:19</a>; <a href=\"#\" onClick=\"return mV('Psa',89,52);\">89:52</a>), to confirm the words and invoke the fulfilment of them. It is used in token of being bound by an oath (<a href=\"#\" onClick=\"return mV('Num',5,22);\">Num 5:22</a>; <a href=\"#\" onClick=\"return mV('Deu',27,'15-26');\">Deu 27:15-26</a>; <a href=\"#\" onClick=\"return mV('Neh',5,13);\">Neh 5:13</a>; <a href=\"#\" onClick=\"return mV('Neh',8,6);\">8:6</a>; <a href=\"#\" onClick=\"return mV('1Ch',16,36);\">1Ch 16:36</a>). In the primitive churches it was common for the general audience to say \"Amen\" at the close of the prayer (<a href=\"#\" onClick=\"return mV('1Cr',14,16);\">1Cr 14:16</a>).<br><br>The promises of God are Amen; i.e., they are all true and sure (<a href=\"#\" onClick=\"return mV('2Cr',1,20);\">2Cr 1:20</a>).";
eastonArray["$$T0000201"] = "<b>Amethyst:</b> one of the precious stones in the breastplate of the high priest (<a href=\"#\" onClick=\"return mV('Exd',28,19);\">Exd 28:19</a>; <a href=\"#\" onClick=\"return mV('Exd',39,12);\">39:12</a>), and in the foundation of the New Jerusalem (<a href=\"#\" onClick=\"return mV('Rev',21,20);\">Rev 21:20</a>). The ancients thought that this stone had the power of dispelling drunkenness in all who wore or touched it, and hence its Greek name formed from<i>a</i>, \"privative,\" and<i>methuo</i>, \"to get drunk.\" Its Jewish name,<i>ahlamah'</i>, was derived by the rabbins from the Hebrew word<i>halam</i>, \"to dream,\" from its supposed power of causing the wearer to dream.<br><br>It is a pale-blue crystallized quartz, varying to a dark purple blue. It is found in Persia and India, also in different parts of Europe.";
eastonArray["$$T0000202"] = "<b>Amittai:</b> true, the father of Jonah the prophet, a native of Gath-hepher (<a href=\"#\" onClick=\"return mV('2Ki',14,25);\">2Ki 14:25</a>; <a href=\"#\" onClick=\"return mV('Jon',1,1);\">Jon 1:1</a>).";
eastonArray["$$T0000203"] = "<b>Ammah:</b> a cubit, the name of a hill which Joab and Abishai reached as the sun went down, when they were in pursuit of Abner (<a href=\"#\" onClick=\"return mV('2Sa',2,24);\">2Sa 2:24</a>). It lay to the east of Gibeon.";
eastonArray["$$T0000204"] = "<b>Ammi:</b> my people, a name given by Jehovah to the people of Israel (<a href=\"#\" onClick=\"return mV('Hsa',2,1,23);\">Hsa 2:1, 23</a>. Comp. <a href=\"#\" onClick=\"return mV('Hsa',1,9);\">1:9</a>; <a href=\"#\" onClick=\"return mV('Eze',16,8);\">Eze 16:8</a>; <a href=\"#\" onClick=\"return mV('Rom',9,25,26);\">Rom 9:25-26</a>; <a href=\"#\" onClick=\"return mV('1Pe',2,10);\">1Pe 2:10</a>).";
eastonArray["$$T0000205"] = "<b>Ammiel:</b> people of God.<br><br>(1.) One of the twelve spies sent by Moses to search the land of Canaan (<a href=\"#\" onClick=\"return mV('Num',13,12);\">Num 13:12</a>). He was one of the ten who perished by the plague for their unfavourable report (<a href=\"#\" onClick=\"return mV('Num',14,37);\">Num 14:37</a>).<br><br>(2.) The father of Machir of Lo-debar, in whose house Mephibosheth resided (<a href=\"#\" onClick=\"return mV('2Sa',9,4,5);\">2Sa 9:4-5</a>; <a href=\"#\" onClick=\"return mV('2Sa',17,27);\">17:27</a>).<br><br>(3.) The father of Bathsheba, the wife of Uriah, and afterwards of David (<a href=\"#\" onClick=\"return mV('1Ch',3,5);\">1Ch 3:5</a>). He is called Eliam in <a href=\"#\" onClick=\"return mV('2Sa',11,3);\">2Sa 11:3</a>.<br><br>(4.) One of the sons of Obed-edom the Levite (<a href=\"#\" onClick=\"return mV('1Ch',26,5);\">1Ch 26:5</a>).";
eastonArray["$$T0000206"] = "<b>Ammihud:</b> people of glory; i.e., \"renowned.\"<br><br>(1.) The father of the Ephraimite chief Elishama, at the time of the Exodus (<a href=\"#\" onClick=\"return mV('Num',1,10);\">Num 1:10</a>; <a href=\"#\" onClick=\"return mV('Num',2,18);\">2:18</a>; <a href=\"#\" onClick=\"return mV('Num',7,48,53);\">7:48, 53</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('Num',34,20);\">Num 34:20</a>.<br><br>(3.) <a href=\"#\" onClick=\"return mV('Num',34,28);\">Num 34:28</a>.<br><br>(4.) The father of Talmai, king of Geshur, to whom Absalom fled after the murder of Amnon (<a href=\"#\" onClick=\"return mV('2Sa',13,37);\">2Sa 13:37</a>).<br><br>(5.) The son of Omri, and the father of Uthai (<a href=\"#\" onClick=\"return mV('1Ch',9,4);\">1Ch 9:4</a>).";
eastonArray["$$T0000207"] = "<b>Amminadab:</b> kindred of the prince.<br><br>(1.) The father of Nahshon, who was chief of the tribe of Judah (<a href=\"#\" onClick=\"return mV('Num',1,7);\">Num 1:7</a>; <a href=\"#\" onClick=\"return mV('Num',2,3);\">2:3</a>; <a href=\"#\" onClick=\"return mV('Num',7,12,17);\">7:12, 17</a>; <a href=\"#\" onClick=\"return mV('Num',10,14);\">10:14</a>). His daughter Elisheba was married to Aaron (<a href=\"#\" onClick=\"return mV('Exd',6,23);\">Exd 6:23</a>).<br><br>(2.) A son of Kohath, the second son of Levi (<a href=\"#\" onClick=\"return mV('1Ch',6,22);\">1Ch 6:22</a>), called also Izhar (<a href=\"#\" onClick=\"return mV('1Ch',6,2,18);\">1Ch 6:2, 18</a>).<br><br>(3.) Chief of the 112 descendants of Uzziel the Levite (<a href=\"#\" onClick=\"return mV('1Ch',15,10,11);\">1Ch 15:10-11</a>).";
eastonArray["$$T0000208"] = "<b>Amminadib:</b> a person mentioned in <a href=\"#\" onClick=\"return mV('Sgs',6,12);\">Sgs 6:12</a>, whose chariots were famed for their swiftness. It is rendered in the margin \"my willing people,\" and in the Revised Version \"my princely people.\"";
eastonArray["$$T0000209"] = "<b>Ammishaddai:</b> people of the Almighty, the father of Ahiezer, who was chief of the Danites at the time of the Exodus (<a href=\"#\" onClick=\"return mV('Num',1,12);\">Num 1:12</a>; <a href=\"#\" onClick=\"return mV('Num',2,25);\">2:25</a>). This is one of the few names compounded with the name of God, Shaddai, \"Almighty.\"";
eastonArray["$$T0000210"] = "<b>Ammizabad:</b> people of the giver, the son of Benaiah, who was the third and chief captain of the host under David (<a href=\"#\" onClick=\"return mV('1Ch',27,6);\">1Ch 27:6</a>).";
eastonArray["$$T0000211"] = "<b>Ammon:</b> another form of the name Ben-ammi, the son of Lot (<a href=\"#\" onClick=\"return mV('Gen',19,38);\">Gen 19:38</a>). This name is also used for his posterity (<a href=\"#\" onClick=\"return mV('Psa',83,7);\">Psa 83:7</a>).";
eastonArray["$$T0000212"] = "<b>Ammonite:</b> the usual name of the descendants of Ammon, the son of Lot (<a href=\"#\" onClick=\"return mV('Gen',19,38);\">Gen 19:38</a>). From the very beginning (<a href=\"#\" onClick=\"return mV('Deu',2,'16-20');\">Deu 2:16-20</a>) of their history till they are lost sight of (<a href=\"#\" onClick=\"return mV('Jdg',5,2);\">Jdg 5:2</a>), this tribe is closely associated with the Moabites (<a href=\"#\" onClick=\"return mV('Jdg',10,11);\">Jdg 10:11</a>; <a href=\"#\" onClick=\"return mV('2Ch',20,1);\">2Ch 20:1</a>; <a href=\"#\" onClick=\"return mV('Zep',2,8);\">Zep 2:8</a>). Both of these tribes hired Balaam to curse Israel (<a href=\"#\" onClick=\"return mV('Deu',23,4);\">Deu 23:4</a>). The Ammonites were probably more of a predatory tribe, moving from place to place, while the Moabites were more settled. They inhabited the country east of the Jordan and north of Moab and the Dead Sea, from which they had expelled the Zamzummims or Zuzims (<a href=\"#\" onClick=\"return mV('Deu',2,20);\">Deu 2:20</a>; <a href=\"#\" onClick=\"return mV('Gen',14,5);\">Gen 14:5</a>). They are known as the Beni-ammi (<a href=\"#\" onClick=\"return mV('Gen',19,38);\">Gen 19:38</a>), Ammi or Ammon being worshipped as their chief god. They were of Semitic origin, and closely related to the Hebrews in blood and language. They showed no kindness to the Israelites when passing through their territory, and therefore they were prohibited from \"entering the congregation of the Lord to the tenth generation\" (<a href=\"#\" onClick=\"return mV('Deu',23,3);\">Deu 23:3</a>). They afterwards became hostile to Israel (<a href=\"#\" onClick=\"return mV('Jdg',3,13);\">Jdg 3:13</a>). Jephthah waged war against them, and \"took twenty cities with a very great slaughter\" (<a href=\"#\" onClick=\"return mV('Jdg',11,33);\">Jdg 11:33</a>). They were again signally defeated by Saul (<a href=\"#\" onClick=\"return mV('1Sa',11,11);\">1Sa 11:11</a>). David also defeated them and their allies the Syrians (<a href=\"#\" onClick=\"return mV('2Sa',10,'6-14');\">2Sa 10:6-14</a>), and took their chief city, Rabbah, with much spoil (<a href=\"#\" onClick=\"return mV('2Sa',10,14);\">2Sa 10:14</a>; <a href=\"#\" onClick=\"return mV('2Sa',12,'26-31');\">12:26-31</a>). The subsequent events of their history are noted in <a href=\"#\" onClick=\"return mV('2Ch',20,25);\">2Ch 20:25</a>; <a href=\"#\" onClick=\"return mV('2Ch',26,8);\">26:8</a>; <a href=\"#\" onClick=\"return mV('Jer',49,1);\">Jer 49:1</a>; <a href=\"#\" onClick=\"return mV('Eze',25,3,6);\">Eze 25:3, 6</a>. One of Solomon's wives was Naamah, an Ammonite. She was the mother of Rehoboam (<a href=\"#\" onClick=\"return mV('1Ki',14,31);\">1Ki 14:31</a>; <a href=\"#\" onClick=\"return mV('2Ch',12,13);\">2Ch 12:13</a>).<br><br>The prophets predicted fearful judgments against the Ammonites because of their hostility to Israel (<a href=\"#\" onClick=\"return mV('Zep',2,8);\">Zep 2:8</a>; <a href=\"#\" onClick=\"return mV('Jer',49,'1-6');\">Jer 49:1-6</a>; <a href=\"#\" onClick=\"return mV('Eze',25,'1-5',10);\">Eze 25:1-5, 10</a>; <a href=\"#\" onClick=\"return mV('Amo',1,'13-15');\">Amo 1:13-15</a>).<br><br>The national idol worshipped by this people was Molech or Milcom, at whose altar they offered human sacrifices (<a href=\"#\" onClick=\"return mV('1Ki',11,5,7);\">1Ki 11:5, 7</a>). The high places built for this idol by Solomon, at the instigation of his Ammonitish wives, were not destroyed till the time of Josiah (<a href=\"#\" onClick=\"return mV('2Ki',23,13);\">2Ki 23:13</a>).";
eastonArray["$$T0000213"] = "<b>Amnon:</b> faithful.<br><br>(1.) One of the sons of Shammai, of the children of Ezra (<a href=\"#\" onClick=\"return mV('1Ch',4,20);\">1Ch 4:20</a>; <a href=\"#\" onClick=\"return mV('1Ch',4,17);\">1Ch 4:17</a>).<br><br>(2.) The eldest son of David, by Ahinoam of Jezreel (<a href=\"#\" onClick=\"return mV('1Ch',3,1);\">1Ch 3:1</a>; <a href=\"#\" onClick=\"return mV('2Sa',3,2);\">2Sa 3:2</a>). Absalom caused him to be put to death for his great crime in the matter of Tamar (<a href=\"#\" onClick=\"return mV('2Sa',13,28,29);\">2Sa 13:28-29</a>).";
eastonArray["$$T0000214"] = "<b>Amon:</b> builder.<br><br>(1.) The governor of Samaria in the time of Ahab. The prophet Micaiah was committed to his custody (<a href=\"#\" onClick=\"return mV('1Ki',22,26);\">1Ki 22:26</a>; <a href=\"#\" onClick=\"return mV('2Ch',18,25);\">2Ch 18:25</a>).<br><br>(2.) The son of Manasseh, and fourteenth king of Judah. He restored idolatry, and set up the images which his father had cast down. Zephaniah (<a href=\"#\" onClick=\"return mV('Zep',1,4);\">Zep 1:4</a>; <a href=\"#\" onClick=\"return mV('Zep',3,4,11);\">3:4, 11</a>) refers to the moral depravity prevailing in this king's reign.<br><br>He was assassinated (<a href=\"#\" onClick=\"return mV('2Ki',21,'18-26');\">2Ki 21:18-26</a>; <a href=\"#\" onClick=\"return mV('2Ch',33,'20-25');\">2Ch 33:20-25</a>) by his own servants, who conspired against him.<br><br>(3.) An Egyptian god, usually depicted with a human body and the head of a ram, referred to in <a href=\"#\" onClick=\"return mV('Jer',46,25);\">Jer 46:25</a>, where the word \"multitudes\" in the Authorized Version is more appropriately rendered \"Amon\" in the Revised Version. In <a href=\"#\" onClick=\"return mV('Nah',3,8);\">Nah 3:8</a> the expression \"populous No\" of the Authorized version is rendered in the Revised Version \"No-amon.\" Amon is identified with Ra, the sun-god of Heliopolis.<br><br>(4.) <a href=\"#\" onClick=\"return mV('Neh',7,59);\">Neh 7:59</a>.";
eastonArray["$$T0000215"] = "<b>Amorites:</b> highlanders, or hillmen, the name given to the descendants of one of the sons of Canaan (<a href=\"#\" onClick=\"return mV('Gen',14,7);\">Gen 14:7</a>), called Amurra or Amurri in the Assyrian and Egyptian inscriptions. On the early Babylonian monuments all Syria, including Palestine, is known as \"the land of the Amorites.\" The southern slopes of the mountains of Judea are called the \"mount of the Amorites\" (<a href=\"#\" onClick=\"return mV('Deu',1,7,19,20);\">Deu 1:7, 19-20</a>). They seem to have originally occupied the land stretching from the heights west of the Dead Sea (<a href=\"#\" onClick=\"return mV('Gen',14,7);\">Gen 14:7</a>) to Hebron (<a href=\"#\" onClick=\"return mV('Deu',3,8);\">Deu 3:8</a>; <a href=\"#\" onClick=\"return mV('Deu',4,'46-48');\">4:46-48</a>), embracing \"all Gilead and all Bashan\" (<a href=\"#\" onClick=\"return mV('Deu',3,10);\">Deu 3:10</a>), with the Jordan valley on the east of the river (<a href=\"#\" onClick=\"return mV('Deu',4,49);\">4:49</a>), the land of the \"two kings of the Amorites,\" Sihon and Og (<a href=\"#\" onClick=\"return mV('Deu',31,4);\">Deu 31:4</a>; <a href=\"#\" onClick=\"return mV('Jos',2,10);\">Jos 2:10</a>; <a href=\"#\" onClick=\"return mV('Jos',9,10);\">9:10</a>). The five kings of the Amorites were defeated with great slaughter by Joshua (<a href=\"#\" onClick=\"return mV('Jos',10,10);\">Jos 10:10</a>). They were again defeated at the waters of Merom by Joshua, who smote them till there were none remaining (<a href=\"#\" onClick=\"return mV('Jos',11,8);\">Jos 11:8</a>). It is mentioned as a surprising circumstance that in the days of Samuel there was peace between them and the Israelites (<a href=\"#\" onClick=\"return mV('1Sa',7,14);\">1Sa 7:14</a>). The discrepancy supposed to exist between <a href=\"#\" onClick=\"return mV('Deu',1,44);\">Deu 1:44</a> and <a href=\"#\" onClick=\"return mV('Num',14,45);\">Num 14:45</a> is explained by the circumstance that the terms \"Amorites\" and \"Amalekites\" are used synonymously for the \"Canaanites.\" In the same way we explain the fact that the \"Hivites\" of <a href=\"#\" onClick=\"return mV('Gen',34,2);\">Gen 34:2</a> are the \"Amorites\" of <a href=\"#\" onClick=\"return mV('Gen',48,22);\">Gen 48:22</a>. Comp. <a href=\"#\" onClick=\"return mV('Jos',10,6);\">Jos 10:6</a>; <a href=\"#\" onClick=\"return mV('Jos',11,19);\">11:19</a> with <a href=\"#\" onClick=\"return mV('2Sa',21,2);\">2Sa 21:2</a>; also <a href=\"#\" onClick=\"return mV('Num',14,45);\">Num 14:45</a> with <a href=\"#\" onClick=\"return mV('Deu',1,44);\">Deu 1:44</a>. The Amorites were warlike mountaineers. They are represented on the Egyptian monuments with fair skins, light hair, blue eyes, aquiline noses, and pointed beards. They are supposed to have been men of great stature; their king, Og, is described by Moses as the last \"of the remnant of the giants\" (<a href=\"#\" onClick=\"return mV('Deu',3,11);\">Deu 3:11</a>). Both Sihon and Og were independent kings. Only one word of the Amorite language survives, \"Shenir,\" the name they gave to Mount Hermon (<a href=\"#\" onClick=\"return mV('Deu',3,9);\">Deu 3:9</a>).";
eastonArray["$$T0000216"] = "<b>Amos:</b> borne; a burden, one of the twelve minor prophets. He was a native of Tekota, the modern Tekua, a town about 12 miles south-east of Bethlehem. He was a man of humble birth, neither a \"prophet nor a prophet's son,\" but \"an herdman and a dresser of sycomore trees,\" R.V. He prophesied in the days of Uzziah, king of Judah, and was contemporary with Isaiah and Hosea (<a href=\"#\" onClick=\"return mV('Amo',1,1);\">Amo 1:1</a>; <a href=\"#\" onClick=\"return mV('Amo',7,14,15);\">7:14-15</a>; <a href=\"#\" onClick=\"return mV('Zec',14,5);\">Zec 14:5</a>), who survived him a few years. Under Jeroboam II. the kingdom of Israel rose to the zenith of its prosperity; but that was followed by the prevalence of luxury and vice and idolatry. At this period Amos was called from his obscurity to remind the people of the law of God's retributive justice, and to call them to repentance.<br><br>The Book of Amos consists of three parts:<br><br>(1.) The nations around are summoned to judgment because of their sins (<a href=\"#\" onClick=\"return mV('Amo',1,'1-15');\">Amo 1:1-15</a>-<a href=\"#\" onClick=\"return mV('Amo',2,'1-3');\">2:1-3</a>). He quotes <a href=\"#\" onClick=\"return mV('Joe',3,16);\">Joe 3:16</a>.<br><br>(2.) The spiritual condition of Judah, and especially of Israel, is described (<a href=\"#\" onClick=\"return mV('Amo',2,'4-16');\">Amo 2:4-16</a>; <a href=\"#\" onClick=\"return mV('Amo',3,'1-');\">3</a>; <a href=\"#\" onClick=\"return mV('Amo',4,'1-');\">4</a>; <a href=\"#\" onClick=\"return mV('Amo',5,'1-');\">5</a>; <a href=\"#\" onClick=\"return mV('Amo',6,'1-14');\">6:1-14).<br><br>(3.) In <a href=\"#\" onClick=\"return mV('Amo',7,'1-17');\">Amo 7:1-17</a>; <a href=\"#\" onClick=\"return mV('Amo',8,'1-');\">8</a>; <a href=\"#\" onClick=\"return mV('Amo',9,'1-10');\">9:1-10</a> are recorded five prophetic visions.<br><br>(a) The first two (<a href=\"#\" onClick=\"return mV('Amo',7,'1-6');\">Amo 7:1-6</a>) refer to judgments against the guilty people.<br><br>(b) The next two (<a href=\"#\" onClick=\"return mV('Amo',7,'7-9');\">Amo 7:7-9</a>; <a href=\"#\" onClick=\"return mV('Amo',8,'1-3');\">Amo 8:1-3</a>) point out the ripeness of the people for the threatened judgements. <a href=\"#\" onClick=\"return mV('Amo',7,'10-17');\">Amo 7:10-17</a> consists of a conversation between the prophet and the priest of Bethel.<br><br>(c) The fifth describes the overthrow and ruin of Israel (<a href=\"#\" onClick=\"return mV('Amo',9,'1-10');\">Amo 9:1-10</a>); to which is added the promise of the restoration of the kingdom and its final glory in the Messiah's kingdom.<br><br>The style is peculiar in the number of the allusions made to natural objects and to agricultural occupations. Other allusions show also that Amos was a student of the law as well as a \"child of nature.\" These phrases are peculiar to him: \"Cleanness of teeth\" [i.e., want of bread] (<a href=\"#\" onClick=\"return mV('Amo',4,6);\">Amo 4:6</a>); \"The excellency of Jacob\" (<a href=\"#\" onClick=\"return mV('Amo',6,8);\">Amo 6:8</a>; <a href=\"#\" onClick=\"return mV('Amo',8,7);\">8:7</a>); \"The high places of Isaac\" (<a href=\"#\" onClick=\"return mV('Amo',7,9);\">Amo 7:9</a>); \"The house of Isaac\" (<a href=\"#\" onClick=\"return mV('Amo',7,16);\">Amo 7:16</a>); \"He that createth the wind\" (<a href=\"#\" onClick=\"return mV('Amo',4,13);\">Amo 4:13</a>). Quoted, (<a href=\"#\" onClick=\"return mV('Act',7,42);\">Act 7:42</a>).";
eastonArray["$$T0000217"] = "<b>Amoz:</b> strong, the father of the prophet Isaiah (<a href=\"#\" onClick=\"return mV('2Ki',19,2,20);\">2Ki 19:2, 20</a>; <a href=\"#\" onClick=\"return mV('2Ki',20,1);\">20:1</a>; <a href=\"#\" onClick=\"return mV('Isa',1,1);\">Isa 1:1</a>; <a href=\"#\" onClick=\"return mV('Isa',2,1);\">2:1</a>). As to his personal history little is positively known. He is supposed by some to have been the \"man of God\" spoken of in <a href=\"#\" onClick=\"return mV('2Ch',25,7,8);\">2Ch 25:7-8</a>.";
eastonArray["$$T0000218"] = "<b>Amphipolis:</b> city on both sides, a Macedonian city, a great Roman military station, through which Paul and Silas passed on their way from Philippi to Thessalonica, a distance of 33 Roman miles from Philippi (<a href=\"#\" onClick=\"return mV('Act',17,1);\">Act 17:1</a>).";
eastonArray["$$T0000219"] = "<b>Amplias:</b> a Roman Christian saluted by Paul (<a href=\"#\" onClick=\"return mV('Rom',16,8);\">Rom 16:8</a>).";
eastonArray["$$T0000220"] = "<b>Amram:</b> kindred of the High; i.e., \"friend of Jehovah.\"<br><br>(1.) The son of Kohath, the son of Levi. He married Jochebed, \"his father's sister,\" and was the father of Aaron, Miriam, and Moses (<a href=\"#\" onClick=\"return mV('Exd',6,18,20);\">Exd 6:18, 20</a>; <a href=\"#\" onClick=\"return mV('Num',3,19);\">Num 3:19</a>). He died in Egypt at the age of 137 years (<a href=\"#\" onClick=\"return mV('Exd',6,20);\">Exd 6:20</a>). His descendants were called Amramites (<a href=\"#\" onClick=\"return mV('Num',3,27);\">Num 3:27</a>; <a href=\"#\" onClick=\"return mV('1Ch',26,23);\">1Ch 26:23</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('Ezr',10,34);\">Ezr 10:34</a>.";
eastonArray["$$T0000221"] = "<b>Amraphel:</b> king of Shinar, southern Chaldea, one of the confederates of Chedorlaomer, king of Elam, in a war against Sodom and cities of the plain (<a href=\"#\" onClick=\"return mV('Gen',14,1,4);\">Gen 14:1, 4</a>). It is now found that Amraphel (or Ammirapaltu) is the Khammu-rabi whose name appears on recently-discovered monuments. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000781');\">CHEDORLAOMER</a>). After defeating Arioch (q.v.) he united Babylonia under one rule, and made Babylon his capital.";
eastonArray["$$T0000222"] = "<b>Anab:</b> grape-town, one of the cities in the mountains of Judah, from which Joshua expelled the Anakim (<a href=\"#\" onClick=\"return mV('Jos',11,21);\">Jos 11:21</a>; <a href=\"#\" onClick=\"return mV('Jos',15,50);\">15:50</a>). It still retains its ancient name. It lies among the hills, 10 miles south-south-west of Hebron.";
eastonArray["$$T0000223"] = "<b>Anah:</b> speech.<br><br>(1.) One of the sons of Seir, and head of an Idumean tribe, called a Horite, as in course of time all the branches of this tribe were called from their dwelling in caves in Mount Seir (<a href=\"#\" onClick=\"return mV('Gen',36,20,29);\">Gen 36:20, 29</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,38);\">1Ch 1:38</a>).<br><br>(2.) One of the two sons of Zibeon the Horite, and father of Esau's wife Aholibamah (<a href=\"#\" onClick=\"return mV('Gen',36,18,24);\">Gen 36:18, 24</a>).";
eastonArray["$$T0000224"] = "<b>Anak:</b> long-necked, the son of Arba, father of the Anakim (<a href=\"#\" onClick=\"return mV('Jos',15,13);\">Jos 15:13</a>; <a href=\"#\" onClick=\"return mV('Jos',21,11);\">21:11</a>, Heb. Anok).";
eastonArray["$$T0000225"] = "<b>Anakim:</b> the descendants of Anak (<a href=\"#\" onClick=\"return mV('Jos',11,21);\">Jos 11:21</a>; <a href=\"#\" onClick=\"return mV('Num',13,33);\">Num 13:33</a>; <a href=\"#\" onClick=\"return mV('Deu',9,2);\">Deu 9:2</a>). They dwelt in the south of Palestine, in the neighbourhood of Hebron (<a href=\"#\" onClick=\"return mV('Gen',23,2);\">Gen 23:2</a>; <a href=\"#\" onClick=\"return mV('Jos',15,13);\">Jos 15:13</a>). In the days of Abraham (<a href=\"#\" onClick=\"return mV('Gen',14,5,6);\">Gen 14:5-6</a>) they inhabited the region afterwards known as Edom and Moab, east of the Jordan. They were probably a remnant of the original inhabitants of Palestine before the Canaanites, a Cushite tribe from Babel, and of the same race as the Phoenicians and the Egyptian shepherd kings. Their formidable warlike appearance, as described by the spies sent to search the land, filled the Israelites with terror. They seem to have identified them with the Nephilim, the \"giants\" (<a href=\"#\" onClick=\"return mV('Gen',6,4);\">Gen 6:4</a>; <a href=\"#\" onClick=\"return mV('Num',13,33);\">Num 13:33</a>) of the antediluvian age. There were various tribes of Anakim (<a href=\"#\" onClick=\"return mV('Jos',15,14);\">Jos 15:14</a>). Joshua finally expelled them from the land, except a remnant that found a refuge in the cities of Gaza, Gath, and Ashdod (<a href=\"#\" onClick=\"return mV('Jos',11,22);\">Jos 11:22</a>). The Philistine giants whom David encountered (<a href=\"#\" onClick=\"return mV('2Sa',21,'15-22');\">2Sa 21:15-22</a>) were descendants of the Anakim. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001474');\">GIANTS</a>.)";
eastonArray["$$T0000226"] = "<b>Anamim:</b> the name of an Egyptian tribe descended from Mizraim (<a href=\"#\" onClick=\"return mV('Gen',10,13);\">Gen 10:13</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,11);\">1Ch 1:11</a>).";
eastonArray["$$T0000227"] = "<b>Anammelech:</b> one of the gods worshipped by the people of Sepharvaim, who colonized Samaria (<a href=\"#\" onClick=\"return mV('2Ki',17,31);\">2Ki 17:31</a>). The name means \"Anu is king.\" It was a female deity representing the moon, as Adrammelech (q.v.) was the male representing the sun.";
eastonArray["$$T0000228"] = "<b>Anan:</b> cloud, one of the Israelites who sealed the covenant after the return from Babylon (<a href=\"#\" onClick=\"return mV('Neh',10,26);\">Neh 10:26</a>).";
eastonArray["$$T0000229"] = "<b>Ananiah:</b> protected by Jehovah, the name of a town in the tribe of Benjamin between Nob and Hazor (<a href=\"#\" onClick=\"return mV('Neh',11,32);\">Neh 11:32</a>). It is probably the modern Beit Hanina, a small village 3 miles north of Jerusalem.";
eastonArray["$$T0000230"] = "<b>Ananias:</b> a common Jewish name, the same as Hananiah.<br><br>(1.) One of the members of the church at Jerusalem, who conspired with his wife Sapphira to deceive the brethren, and who fell down and immediately expired after he had uttered the falsehood (<a href=\"#\" onClick=\"return mV('Act',5,5);\">Act 5:5</a>). By common agreement the members of the early Christian community devoted their property to the work of furthering the gospel and of assisting the poor and needy. The proceeds of the possessions they sold were placed at the disposal of the apostles (<a href=\"#\" onClick=\"return mV('Act',4,36,37);\">Act 4:36-37</a>). Ananias might have kept his property had he so chosen; but he professed agreement with the brethren in the common purpose, and had of his own accord devoted it all, as he said, to these sacred ends. Yet he retained a part of it for his own ends, and thus lied in declaring that he had given it all. \"The offence of Ananias and Sapphira showed contempt of God, vanity and ambition in the offenders, and utter disregard of the corruption which they were bringing into the society. Such sin, committed in despite of the light which they possessed, called for a special mark of divine indignation.\"<br><br>(2.) A Christian at Damascus (<a href=\"#\" onClick=\"return mV('Act',9,10);\">Act 9:10</a>). He became Paul's instructor; but when or by what means he himself became a Christian we have no information. He was \"a devout man according to the law, having a good report of all the Jews which dwelt\" at Damascus (<a href=\"#\" onClick=\"return mV('Act',22,12);\">22:12</a>).<br><br>(3.) The high priest before whom Paul was brought in the procuratorship of Felix (<a href=\"#\" onClick=\"return mV('Act',23,2,5,24);\">Act 23:2, 5, 24</a>). He was so enraged at Paul's noble declaration, \"I have lived in all good conscience before God until this day,\" that he commanded one of his attendants to smite him on the mouth. Smarting under this unprovoked insult, Paul quickly replied, \"God shall smite thee, thou whited wall.\" Being reminded that Ananias was the high priest, to whose office all respect was to be paid, he answered, \"I wist not, brethren, that he was the high priest\" (<a href=\"#\" onClick=\"return mV('Act',23,5);\">Act 23:5</a>). This expression has occasioned some difficulty, as it is scarcely probable that Paul should have been ignorant of so public a fact. The expression may mean<br><br>(a) that Paul had at the moment overlooked the honour due to the high priest; or<br><br>(b), as others think, that Paul spoke ironically, as if he had said, \"The high priest breaking the law! God's high priest a tyrant and a lawbreaker! I see a man in white robes, and have heard his voice, but surely it cannot, it ought not to be, the voice of the high priest.\" (See Dr. Lindsay on Acts, <i>in loco</i>.)<br><br>(c) Others think that from defect of sight Paul could not observe that the speaker was the high priest. In all this, however, it may be explained, Paul, with all his excellency, comes short of the example of his divine Master, who, when he was reviled, reviled not again.";
eastonArray["$$T0000231"] = "<b>Anath:</b> an answer; i.e., to \"prayer\", the father of Shamgar, who was one of the judges of Israel (<a href=\"#\" onClick=\"return mV('Jdg',3,31);\">Jdg 3:31</a>).";
eastonArray["$$T0000232"] = "<b>Anathema:</b> anything laid up or suspended; hence anything laid up in a temple or set apart as sacred. In this sense the form of the word is<i>anath(ee)ma</i>, once in plural used in the Greek New Testament, in <a href=\"#\" onClick=\"return mV('Luk',21,5);\">Luk 21:5</a>, where it is rendered \"gifts.\" In the LXX. the form<i>anathema</i> is generally used as the rendering of the Hebrew word<i>herem</i>, derived from a verb which means<br><br>(1.) to consecrate or devote; and<br><br>(2.) to exterminate. Any object so devoted to the Lord could not be redeemed (<a href=\"#\" onClick=\"return mV('Num',18,14);\">Num 18:14</a>; <a href=\"#\" onClick=\"return mV('Lev',27,28,29);\">Lev 27:28-29</a>); and hence the idea of exterminating connected with the word. The Hebrew verb (haram) is frequently used of the extermination of idolatrous nations. It had a wide range of application. The<i>anathema</i> or <i>herem</i> was a person or thing irrevocably devoted to God (<a href=\"#\" onClick=\"return mV('Lev',27,21,28);\">Lev 27:21, 28</a>); and \"none devoted shall be ransomed. He shall surely be put to death\" (<a href=\"#\" onClick=\"return mV('Lev',27,29);\">27:29</a>). The word therefore carried the idea of devoted to destruction (<a href=\"#\" onClick=\"return mV('Num',21,2,3);\">Num 21:2-3</a>; <a href=\"#\" onClick=\"return mV('Jos',6,17);\">Jos 6:17</a>); and hence generally it meant a thing accursed. In <a href=\"#\" onClick=\"return mV('Deu',7,26);\">Deu 7:26</a> an idol is called a<i>herem</i> = <i>anathema</i>, a thing accursed.<br><br>In the New Testament this word always implies execration. In some cases an individual denounces an anathema on himself unless certain conditions are fulfilled (<a href=\"#\" onClick=\"return mV('Act',23,12,14,21);\">Act 23:12, 14, 21</a>). \"To call Jesus accursed\" [anathema] (<a href=\"#\" onClick=\"return mV('1Cr',12,3);\">1Cr 12:3</a>) is to pronounce him execrated or accursed. If any one preached another gospel, the apostle says, \"let him be accursed\" (<a href=\"#\" onClick=\"return mV('Gal',1,8,9);\">Gal 1:8-9</a>); i.e., let his conduct in so doing be accounted accursed.<br><br>In <a href=\"#\" onClick=\"return mV('Rom',9,3);\">Rom 9:3</a>, the expression \"accursed\" (anathema) from Christ, i.e., excluded from fellowship or alliance with Christ, has occasioned much difficulty. The apostle here does not speak of his wish as a possible thing. It is simply a vehement expression of feeling, showing how strong was his desire for the salvation of his people.<br><br>The anathema in <a href=\"#\" onClick=\"return mV('1Cr',16,22);\">1Cr 16:22</a> denotes simply that they who love not the Lord are rightly objects of loathing and execration to all holy beings; they are guilty of a crime that merits the severest condemnation; they are exposed to the just sentence of \"everlasting destruction from the presence of the Lord.\"";
eastonArray["$$T0000233"] = "<b>Anathoth:</b> the name of one of the cities of refuge, in the tribe of Benjamin (<a href=\"#\" onClick=\"return mV('Jos',21,18);\">Jos 21:18</a>). The Jews, as a rule, did not change the names of the towns they found in Palestine; hence this town may be regarded as deriving its name from the goddess Anat. It was the native place of Abiezer, one of David's \"thirty\" (<a href=\"#\" onClick=\"return mV('2Sa',23,27);\">2Sa 23:27</a>), and of Jehu, another of his mighty men (<a href=\"#\" onClick=\"return mV('1Ch',12,3);\">1Ch 12:3</a>). It is chiefly notable, however, as the birth-place and usual residence of Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',1,1);\">Jer 1:1</a>; <a href=\"#\" onClick=\"return mV('Jer',11,'21-23');\">11:21-23</a>; <a href=\"#\" onClick=\"return mV('Jer',29,27);\">29:27</a>; <a href=\"#\" onClick=\"return mV('Jer',32,'7-9');\">32:7-9</a>). It suffered greatly from the army of Sennacherib, and only 128 men returned to it from the Exile (<a href=\"#\" onClick=\"return mV('Neh',7,27);\">Neh 7:27</a>; <a href=\"#\" onClick=\"return mV('Ezr',2,23);\">Ezr 2:23</a>). It lay about 3 miles north of Jerusalem. It has been identified with the small and poor village of 'Anata, containing about 100 inhabitants.";
eastonArray["$$T0000234"] = "<b>Anchor:</b> From <a href=\"#\" onClick=\"return mV('Act',27,29,30,40);\">Act 27:29-30, 40</a>, it would appear that the Roman vessels carried several anchors, which were attached to the stern as well as to the prow. The Roman anchor, like the modern one, had two teeth or flukes. In <a href=\"#\" onClick=\"return mV('Hbr',6,19);\">Hbr 6:19</a> the word is used metaphorically for that which supports or keeps one steadfast in the time of trial or of doubt. It is an emblem of hope.<br><br>\"If you fear, Put all your trust in God: that anchor holds.\"";
eastonArray["$$T0000235"] = "<b>Ancient of Days:</b> an expression applied to Jehovah three times in the vision of Daniel (<a href=\"#\" onClick=\"return mV('Dan',7,9,13,22);\">Dan 7:9, 13, 22</a>) in the sense of eternal. In contrast with all earthly kings, his days are past reckoning.";
eastonArray["$$T0000236"] = "<b>Andrew:</b> manliness, a Greek name; one of the apostles of our Lord. He was of Bethsaida in Galilee (<a href=\"#\" onClick=\"return mV('Jhn',1,44);\">Jhn 1:44</a>), and was the brother of Simon Peter (<a href=\"#\" onClick=\"return mV('Mat',4,18);\">Mat 4:18</a>; <a href=\"#\" onClick=\"return mV('Mat',10,2);\">10:2</a>). On one occasion John the Baptist, whose disciple he then was, pointing to Jesus, said, \"Behold the Lamb of God\" (<a href=\"#\" onClick=\"return mV('Jhn',1,40);\">Jhn 1:40</a>); and Andrew, hearing him, immediately became a follower of Jesus, the first of his disciples. After he had been led to recognize Jesus as the Messiah, his first care was to bring also his brother Simon to Jesus. The two brothers seem to have after this pursued for a while their usual calling as fishermen, and did not become the stated attendants of the Lord till after John's imprisonment (<a href=\"#\" onClick=\"return mV('Mat',4,18,19);\">Mat 4:18-19</a>; <a href=\"#\" onClick=\"return mV('Mar',1,16,17);\">Mar 1:16-17</a>). Very little is related of Andrew. He was one of the confidential disciples (<a href=\"#\" onClick=\"return mV('Jhn',6,8);\">Jhn 6:8</a>; <a href=\"#\" onClick=\"return mV('Jhn',12,22);\">12:22</a>), and with Peter, James, and John inquired of our Lord privately regarding his future coming (<a href=\"#\" onClick=\"return mV('Mar',13,3);\">Mar 13:3</a>). He was present at the feeding of the five thousand (<a href=\"#\" onClick=\"return mV('Jhn',6,9);\">Jhn 6:9</a>), and he introduced the Greeks who desired to see Jesus (<a href=\"#\" onClick=\"return mV('Jhn',12,22);\">Jhn 12:22</a>); but of his subsequent history little is known. It is noteworthy that Andrew thrice brings others to Christ,<br><br>(1.) Peter;<br><br>(2.) the lad with the loaves; and<br><br>(3.) certain Greeks. These incidents may be regarded as a key to his character.";
eastonArray["$$T0000237"] = "<b>Andronicus:</b> man-conquering, a Jewish Christian, the kinsman and fellowprisoner of Paul (<a href=\"#\" onClick=\"return mV('Rom',16,7);\">Rom 16:7</a>); \"of note among the apostles.\"";
eastonArray["$$T0000238"] = "<b>Anem:</b> two fountains, a Levitical city in the tribe of Issachar (<a href=\"#\" onClick=\"return mV('1Ch',6,73);\">1Ch 6:73</a>). It is also called En-gannim (q.v.) in <a href=\"#\" onClick=\"return mV('Jos',19,21);\">Jos 19:21</a>; the modern Jenin.";
eastonArray["$$T0000239"] = "<b>Aner:</b> a boy.<br><br>(1.) A Canaanitish chief who joined his forces with those of Abraham in pursuit of Chedorlaomer (<a href=\"#\" onClick=\"return mV('Gen',14,13,24);\">Gen 14:13, 24</a>).<br><br>(2.) A city of Manasseh given to the Levites of Kohath's family (<a href=\"#\" onClick=\"return mV('1Ch',6,70);\">1Ch 6:70</a>).";
eastonArray["$$T0000240"] = "<b>Angel:</b> a word signifying, both in the Hebrew and Greek, a \"messenger,\" and hence employed to denote any agent God sends forth to execute his purposes. It is used of an ordinary messenger (<a href=\"#\" onClick=\"return mV('Job',1,14);\">Job 1:14</a>: <a href=\"#\" onClick=\"return mV('1Sa',11,3);\">1Sa 11:3</a>; <a href=\"#\" onClick=\"return mV('Luk',7,24);\">Luk 7:24</a>; <a href=\"#\" onClick=\"return mV('Luk',9,52);\">9:52</a>), of prophets (<a href=\"#\" onClick=\"return mV('Isa',42,19);\">Isa 42:19</a>; <a href=\"#\" onClick=\"return mV('Hag',1,13);\">Hag 1:13</a>), of priests (<a href=\"#\" onClick=\"return mV('Mal',2,7);\">Mal 2:7</a>), and ministers of the New Testament (<a href=\"#\" onClick=\"return mV('Rev',1,20);\">Rev 1:20</a>).<br><br>It is also applied to such impersonal agents as the pestilence (<a href=\"#\" onClick=\"return mV('2Sa',24,16,17);\">2Sa 24:16-17</a>; <a href=\"#\" onClick=\"return mV('2Ki',19,35);\">2Ki 19:35</a>), the wind (<a href=\"#\" onClick=\"return mV('Psa',104,4);\">Psa 104:4</a>).<br><br>But its distinctive application is to certain heavenly intelligences whom God employs in carrying on his government of the world. The name does not denote their nature but their office as messengers. The appearances to Abraham at Mamre (<a href=\"#\" onClick=\"return mV('Gen',18,2,22);\">Gen 18:2, 22</a>. Comp. <a href=\"#\" onClick=\"return mV('Gen',19,1);\">19:1</a>), to Jacob at Peniel (<a href=\"#\" onClick=\"return mV('Gen',32,24,30);\">Gen 32:24, 30</a>), to Joshua at Gilgal (<a href=\"#\" onClick=\"return mV('Jos',5,13,15);\">Jos 5:13, 15</a>), of the Angel of the Lord, were doubtless manifestations of the Divine presence, \"foreshadowings of the incarnation,\" revelations before the \"fulness of the time\" of the Son of God.<br><br>(1.) The existence and orders of angelic beings can only be discovered from the Scriptures. Although the Bible does not treat of this subject specially, yet there are numerous incidental details that furnish us with ample information. Their personal existence is plainly implied in such passages as <a href=\"#\" onClick=\"return mV('Gen',16,7,10,11);\">Gen. 16:7, 10, 11</a>; <a href=\"#\" onClick=\"return mV('Jdg',13,'1-21');\">Jdg 13:1-21</a>; <a href=\"#\" onClick=\"return mV('Mat',28,'2-5');\">Mat 28:2-5</a>; <a href=\"#\" onClick=\"return mV('Hbr',1,4);\">Hbr 1:4</a>, etc.<br><br>These superior beings are very numerous. \"Thousand thousands,\" etc. (<a href=\"#\" onClick=\"return mV('Dan',7,10);\">Dan 7:10</a>; <a href=\"#\" onClick=\"return mV('Mat',26,53);\">Mat 26:53</a>; <a href=\"#\" onClick=\"return mV('Luk',2,13);\">Luk 2:13</a>; <a href=\"#\" onClick=\"return mV('Hbr',12,22,23);\">Hbr 12:22-23</a>). They are also spoken of as of different ranks in dignity and power (<a href=\"#\" onClick=\"return mV('Zec',1,9,11);\">Zec 1:9, 11</a>; <a href=\"#\" onClick=\"return mV('Dan',10,13);\">Dan 10:13</a>; <a href=\"#\" onClick=\"return mV('Dan',12,1);\">12:1</a>; <a href=\"#\" onClick=\"return mV('1Th',4,16);\">1Th 4:16</a>; <a href=\"#\" onClick=\"return mV('Jud',1,9);\">Jud 1:9</a>; <a href=\"#\" onClick=\"return mV('Eph',1,21);\">Eph 1:21</a>; <a href=\"#\" onClick=\"return mV('Col',1,16);\">Col 1:16</a>).<br><br>(2.) As to their nature, they are spirits (<a href=\"#\" onClick=\"return mV('Hbr',1,14);\">Hbr 1:14</a>), like the soul of man, but not incorporeal. Such expressions as \"like the angels\" (<a href=\"#\" onClick=\"return mV('Luk',20,36);\">Luk 20:36</a>), and the fact that whenever angels appeared to man it was always in a human form (<a href=\"#\" onClick=\"return mV('Gen',18,2);\">Gen 18:2</a>; <a href=\"#\" onClick=\"return mV('Gen',19,1,10);\">19:1, 10</a>; <a href=\"#\" onClick=\"return mV('Luk',24,4);\">Luk 24:4</a>; <a href=\"#\" onClick=\"return mV('Act',1,10);\">Act 1:10</a>), and the titles that are applied to them (<a href=\"#\" onClick=\"return mV('Job',1,6);\">Job 1:6</a>; <a href=\"#\" onClick=\"return mV('Job',38,7);\">38:7</a>; <a href=\"#\" onClick=\"return mV('Dan',3,25,28);\">Dan 3:25, 28</a>) and to men (<a href=\"#\" onClick=\"return mV('Luk',3,38);\">Luk 3:38</a>), seem all to indicate some resemblance between them and the human race. Imperfection is ascribed to them as creatures (<a href=\"#\" onClick=\"return mV('Job',4,18);\">Job 4:18</a>; <a href=\"#\" onClick=\"return mV('Mat',24,36);\">Mat 24:36</a>; <a href=\"#\" onClick=\"return mV('1Pe',1,12);\">1Pe 1:12</a>). As finite creatures they may fall under temptation; and accordingly we read of \"fallen angels.\" Of the cause and manner of their \"fall\" we are wholly ignorant. We know only that \"they left their first estate\" (<a href=\"#\" onClick=\"return mV('Mat',25,41);\">Mat 25:41</a>; <a href=\"#\" onClick=\"return mV('Rev',12,7,9);\">Rev 12:7, 9</a>), and that they are \"reserved unto judgement\" (<a href=\"#\" onClick=\"return mV('2Pe',2,4);\">2Pe 2:4</a>). When the manna is called \"angels' food,\" this is merely to denote its excellence (<a href=\"#\" onClick=\"return mV('Psa',78,25);\">Psa 78:25</a>). Angels never die (<a href=\"#\" onClick=\"return mV('Luk',20,36);\">Luk 20:36</a>). They are possessed of superhuman intelligence and power (<a href=\"#\" onClick=\"return mV('Mar',13,32);\">Mar 13:32</a>; <a href=\"#\" onClick=\"return mV('2Th',1,7);\">2Th 1:7</a>; <a href=\"#\" onClick=\"return mV('Psa',103,20);\">Psa 103:20</a>). They are called \"holy\" (<a href=\"#\" onClick=\"return mV('Luk',9,26);\">Luk 9:26</a>), \"elect\" (<a href=\"#\" onClick=\"return mV('1Ti',5,21);\">1Ti 5:21</a>). The redeemed in glory are \"like unto the angels\" (<a href=\"#\" onClick=\"return mV('Luk',20,36);\">Luk 20:36</a>). They are not to be worshipped (<a href=\"#\" onClick=\"return mV('Col',2,18);\">Col 2:18</a>; <a href=\"#\" onClick=\"return mV('Rev',19,10);\">Rev 19:10</a>).<br><br>(3.) Their functions are manifold.<br><br>(a) In the widest sense they are agents of God's providence (<a href=\"#\" onClick=\"return mV('Exd',12,23);\">Exd 12:23</a>; <a href=\"#\" onClick=\"return mV('Psa',104,4);\">Psa 104:4</a>; <a href=\"#\" onClick=\"return mV('Hbr',11,28);\">Hbr 11:28</a>; <a href=\"#\" onClick=\"return mV('1Cr',10,10);\">1Cr 10:10</a>; <a href=\"#\" onClick=\"return mV('2Sa',24,16);\">2Sa 24:16</a>; <a href=\"#\" onClick=\"return mV('1Ch',21,16);\">1Ch 21:16</a>; <a href=\"#\" onClick=\"return mV('2Ki',19,35);\">2Ki 19:35</a>; <a href=\"#\" onClick=\"return mV('Act',12,23);\">Act 12:23</a>).<br><br>(b) They are specially God's agents in carrying on his great work of redemption. There is no notice of angelic appearances to man till after the call of Abraham. From that time onward there are frequent references to their ministry on earth (<a href=\"#\" onClick=\"return mV('Gen',18,'1-')\">Gen 18</a>; <a href=\"#\" onClick=\"return mV('Gen',19,'1-')\">Gen 19</a>; <a href=\"#\" onClick=\"return mV('Gen',24,7,40);\">24:7, 40</a>; <a href=\"#\" onClick=\"return mV('Gen',28,12);\">28:12</a>; <a href=\"#\" onClick=\"return mV('Gen',32,1);\">32:1</a>). They appear to rebuke idolatry (<a href=\"#\" onClick=\"return mV('Jdg',2,'1-4');\">Jdg 2:1-4</a>), to call Gideon (<a href=\"#\" onClick=\"return mV('Jdg',6,11,12);\">Jdg 6:11-12</a>), and to consecrate Samson (<a href=\"#\" onClick=\"return mV('Jdg',13,3);\">13:3</a>). In the days of the prophets, from Samuel downward, the angels appear only in their behalf (<a href=\"#\" onClick=\"return mV('1Ki',19,5);\">1Ki 19:5</a>; <a href=\"#\" onClick=\"return mV('2Ki',6,17);\">2Ki 6:17</a>; <a href=\"#\" onClick=\"return mV('Zec',1,'1-');\">Zec. 1-6</a>; <a href=\"#\" onClick=\"return mV('Dan',4,13,23);\">Dan 4:13, 23</a>; <a href=\"#\" onClick=\"return mV('Dan',10,10,13,20,21);\">10:10, 13, 20-21</a>).<br><br>The Incarnation introduces a new era in the ministrations of angels. They come with their Lord to earth to do him service while here. They predict his advent (<a href=\"#\" onClick=\"return mV('Mat',1,20);\">Mat 1:20</a>; <a href=\"#\" onClick=\"return mV('Luk',1,'26-38');\">Luk 1:26-38</a>), minister to him after his temptation and agony (<a href=\"#\" onClick=\"return mV('Mat',4,11);\">Mat 4:11</a>; <a href=\"#\" onClick=\"return mV('Luk',22,43);\">Luk 22:43</a>), and declare his resurrection and ascension (<a href=\"#\" onClick=\"return mV('Mat',28,'2-8');\">Mat 28:2-8</a>; <a href=\"#\" onClick=\"return mV('Jhn',20,12,13);\">Jhn 20:12-13</a>; <a href=\"#\" onClick=\"return mV('Act',1,10,11);\">Act 1:10-11</a>). They are now ministering spirits to the people of God (<a href=\"#\" onClick=\"return mV('Hbr',1,14);\">Hbr 1:14</a>; <a href=\"#\" onClick=\"return mV('Psa',34,7);\">Psa 34:7</a>; <a href=\"#\" onClick=\"return mV('Psa',91,11);\">91:11</a>; <a href=\"#\" onClick=\"return mV('Mat',18,10);\">Mat 18:10</a>; <a href=\"#\" onClick=\"return mV('Act',5,19);\">Act 5:19</a>; <a href=\"#\" onClick=\"return mV('Act',8,26);\">8:26</a>; <a href=\"#\" onClick=\"return mV('Act',10,3);\">10:3</a>; <a href=\"#\" onClick=\"return mV('Act',12,7);\">12:7</a>; <a href=\"#\" onClick=\"return mV('Act',27,23);\">27:23</a>). They rejoice over a penitent sinner (<a href=\"#\" onClick=\"return mV('Luk',15,10);\">Luk 15:10</a>). They bear the souls of the redeemed to paradise (<a href=\"#\" onClick=\"return mV('Luk',16,22);\">Luk 16:22</a>); and they will be the ministers of judgement hereafter on the great day (<a href=\"#\" onClick=\"return mV('Mat',13,39,41,49);\">Mat 13:39, 41, 49</a>; <a href=\"#\" onClick=\"return mV('Mat',16,27);\">16:27</a>; <a href=\"#\" onClick=\"return mV('Mat',24,31);\">24:31</a>). The passages (<a href=\"#\" onClick=\"return mV('Psa',34,7);\">Psa 34:7</a>; <a href=\"#\" onClick=\"return mV('Mat',18,10);\">Mat 18:10</a>) usually referred to in support of the idea that every individual has a particular guardian angel have no such meaning. They merely indicate that God employs the ministry of angels to deliver his people from affliction and danger, and that the angels do not think it below their dignity to minister even to children and to the least among Christ's disciples.<br><br>The \"angel of his presence\" (<a href=\"#\" onClick=\"return mV('Isa',63,9);\">Isa 63:9</a>. Comp. <a href=\"#\" onClick=\"return mV('Exd',23,20,21);\">Exd 23:20-21</a>; <a href=\"#\" onClick=\"return mV('Isa',32,34);\">32:34</a>; <a href=\"#\" onClick=\"return mV('Isa',33,2);\">33:2</a>; <a href=\"#\" onClick=\"return mV('Num',20,16);\">Num 20:16</a>) is probably rightly interpreted of the Messiah as the guide of his people. Others have supposed the expression to refer to Gabriel (<a href=\"#\" onClick=\"return mV('Luk',1,19);\">Luk 1:19</a>).";
eastonArray["$$T0000241"] = "<b>Anger:</b> the emotion of instant displeasure on account of something evil that presents itself to our view. In itself it is an original susceptibility of our nature, just as love is, and is not necessarily sinful. It may, however, become sinful when causeless, or excessive, or protracted (<a href=\"#\" onClick=\"return mV('Mat',5,22);\">Mat 5:22</a>; <a href=\"#\" onClick=\"return mV('Eph',4,26);\">Eph 4:26</a>; <a href=\"#\" onClick=\"return mV('Col',3,8);\">Col 3:8</a>). As ascribed to God, it merely denotes his displeasure with sin and with sinners (<a href=\"#\" onClick=\"return mV('Psa',7,11);\">Psa 7:11</a>).";
eastonArray["$$T0000242"] = "<b>Anim:</b> fountains, a city in the mountains of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,50);\">Jos 15:50</a>), now el-Ghuwein, near Eshtemoh, about 10 miles south-west of Hebron.";
eastonArray["$$T0000243"] = "<b>Animal:</b> an organized living creature endowed with sensation. The Levitical law divided animals into clean and unclean, although the distinction seems to have existed before the Flood (<a href=\"#\" onClick=\"return mV('Gen',7,2);\">Gen 7:2</a>). The clean could be offered in sacrifice and eaten. All animals that had not cloven hoofs and did not chew the cud were unclean. The list of clean and unclean quadrupeds is set forth in the Levitical law (<a href=\"#\" onClick=\"return mV('Deu',14,'3-20');\">Deu 14:3-20</a>; <a href=\"#\" onClick=\"return mV('Lev',11,'1-')\">Lev 11</a>).";
eastonArray["$$T0000244"] = "<b>Anise:</b> This word is found only in <a href=\"#\" onClick=\"return mV('Mat',23,23);\">Mat 23:23</a>. It is the plant commonly known by the name of dill, the <i>Peucedanum graveolens</i> of the botanist. This name dill is derived from a Norse word which means to soothe, the plant having the carminative property of allaying pain. The common dill, the <i>Anethum graveolens</i>, is an annual growing wild in the cornfields of Spain and Portugal and the south of Europe generally. There is also a species of dill cultivated in Eastern countries known by the name of shubit. It was this species of garden plant of which the Pharisees were in the habit of paying tithes. The Talmud requires that the seeds, leaves, and stem of dill shall pay tithes. It is an umbelliferous plant, very like the caraway, its leaves, which are aromatic, being used in soups and pickles. The proper anise is the <i>Pimpinella anisum</i>.";
eastonArray["$$T0000245"] = "<b>Anna:</b> grace, an aged widow, the daughter of Phanuel. She was a \"prophetess,\" like Miriam, Deborah, and Huldah (<a href=\"#\" onClick=\"return mV('2Ch',34,22);\">2Ch 34:22</a>). After seven years of married life her husband died, and during her long widowhood she daily attended the temple services. When she was eighty-four years old, she entered the temple at the moment when the aged Simeon uttered his memorable words of praise and thanks to God that he had fulfilled his ancient promise in sending his Son into the world (<a href=\"#\" onClick=\"return mV('Luk',2,36,37);\">Luk 2:36-37</a>).";
eastonArray["$$T0000246"] = "<b>Annas:</b> was high priest A.D. 7-14. In A.D. 25 Caiaphas, who had married the daughter of Annas (<a href=\"#\" onClick=\"return mV('Jhn',18,13);\">Jhn 18:13</a>), was raised to that office, and probably Annas was now made president of the Sanhedrim, or deputy or coadjutor of the high priest, and thus was also called high priest along with Caiaphas (<a href=\"#\" onClick=\"return mV('Luk',3,2);\">Luk 3:2</a>). By the Mosaic law the high-priesthood was held for life (<a href=\"#\" onClick=\"return mV('Num',3,10);\">Num 3:10</a>); and although Annas had been deposed by the Roman procurator, the Jews may still have regarded him as legally the high priest. Our Lord was first brought before Annas, and after a brief questioning of him (<a href=\"#\" onClick=\"return mV('Jhn',18,'19-23');\">Jhn 18:19-23</a>) was sent to Caiaphas, when some members of the Sanhedrim had met, and the first trial of Jesus took place (<a href=\"#\" onClick=\"return mV('Mat',26,'57-68');\">Mat 26:57-68</a>). This examination of our Lord before Annas is recorded only by John. Annas was president of the Sanhedrim before which Peter and John were brought (<a href=\"#\" onClick=\"return mV('Act',4,6);\">Act 4:6</a>).";
eastonArray["$$T0000247"] = "<b>Anoint:</b> The practice of anointing with perfumed oil was common among the Hebrews.<br><br>(1.) The act of anointing was significant of consecration to a holy or sacred use; hence the anointing of the high priest (<a href=\"#\" onClick=\"return mV('Exd',29,29);\">Exd 29:29</a>; <a href=\"#\" onClick=\"return mV('Lev',4,3);\">Lev 4:3</a>) and of the sacred vessels (<a href=\"#\" onClick=\"return mV('Exd',30,26);\">Exd 30:26</a>). The high priest and the king are thus called \"the anointed\" (<a href=\"#\" onClick=\"return mV('Lev',4,3,5,16);\">Lev 4:3, 5, 16</a>; <a href=\"#\" onClick=\"return mV('Lev',6,20);\">6:20</a>; <a href=\"#\" onClick=\"return mV('Psa',132,10);\">Psa 132:10</a>). Anointing a king was equivalent to crowning him (<a href=\"#\" onClick=\"return mV('1Sa',16,13);\">1Sa 16:13</a>; <a href=\"#\" onClick=\"return mV('2Sa',2,4);\">2Sa 2:4</a>, etc.). Prophets were also anointed (<a href=\"#\" onClick=\"return mV('1Ki',19,16);\">1Ki 19:16</a>; <a href=\"#\" onClick=\"return mV('1Ch',16,22);\">1Ch 16:22</a>; <a href=\"#\" onClick=\"return mV('Psa',105,15);\">Psa 105:15</a>). The expression, \"anoint the shield\" (<a href=\"#\" onClick=\"return mV('Isa',21,5);\">Isa 21:5</a>), refers to the custom of rubbing oil on the leather of the shield so as to make it supple and fit for use in war.<br><br>(2.) Anointing was also an act of hospitality (<a href=\"#\" onClick=\"return mV('Luk',7,38,46);\">Luk 7:38, 46</a>). It was the custom of the Jews in like manner to anoint themselves with oil, as a means of refreshing or invigorating their bodies (<a href=\"#\" onClick=\"return mV('Deu',28,40);\">Deu 28:40</a>; <a href=\"#\" onClick=\"return mV('Rth',3,3);\">Rth 3:3</a>; <a href=\"#\" onClick=\"return mV('2Sa',14,2);\">2Sa 14:2</a>; <a href=\"#\" onClick=\"return mV('Psa',104,15);\">Psa 104:15</a>, etc.). This custom is continued among the Arabians to the present day.<br><br>(3.) Oil was used also for medicinal purposes. It was applied to the sick, and also to wounds (<a href=\"#\" onClick=\"return mV('Psa',109,18);\">Psa 109:18</a>; <a href=\"#\" onClick=\"return mV('Isa',1,6);\">Isa 1:6</a>; <a href=\"#\" onClick=\"return mV('Mar',6,13);\">Mar 6:13</a>; <a href=\"#\" onClick=\"return mV('Jam',5,14);\">Jam 5:14</a>).<br><br>(4.) The bodies of the dead were sometimes anointed (<a href=\"#\" onClick=\"return mV('Mar',14,8);\">Mar 14:8</a>; <a href=\"#\" onClick=\"return mV('Luk',23,56);\">Luk 23:56</a>).<br><br>(5.) The promised Deliverer is twice called the \"Anointed\" or Messiah (<a href=\"#\" onClick=\"return mV('Psa',2,2);\">Psa 2:2</a>; <a href=\"#\" onClick=\"return mV('Dan',9,25,26);\">Dan 9:25-26</a>), because he was anointed with the Holy Ghost (<a href=\"#\" onClick=\"return mV('Isa',61,1);\">Isa 61:1</a>), figuratively styled the \"oil of gladness\" (<a href=\"#\" onClick=\"return mV('Psa',45,7);\">Psa 45:7</a>; <a href=\"#\" onClick=\"return mV('Hbr',1,9);\">Hbr 1:9</a>). Jesus of Nazareth is this anointed One (<a href=\"#\" onClick=\"return mV('Jhn',1,41);\">Jhn 1:41</a>; <a href=\"#\" onClick=\"return mV('Act',9,22);\">Act 9:22</a>; <a href=\"#\" onClick=\"return mV('Act',17,2,3);\">17:2-3</a>; <a href=\"#\" onClick=\"return mV('Act',18,5,28);\">18:5, 28</a>), the Messiah of the Old Testament.";
eastonArray["$$T0000248"] = "<b>Ant:</b> (Heb. nemalah, from a word meaning to creep, cut off, destroy), referred to in <a href=\"#\" onClick=\"return mV('Pro',6,6);\">Pro 6:6</a>; <a href=\"#\" onClick=\"return mV('Pro',30,25);\">30:25</a>, as distinguished for its prudent habits. Many ants in Palestine feed on animal substances, but others draw their nourishment partly or exclusively from vegetables. To the latter class belongs the ant to which Solomon refers. This ant gathers the seeds in the season of ripening, and stores them for future use; a habit that has been observed in ants in Texas, India, and Italy.";
eastonArray["$$T0000249"] = "<b>Antichrist:</b> against Christ, or an opposition Christ, a rival Christ. The word is used only by the apostle John. Referring to false teachers, he says (<a href=\"#\" onClick=\"return mV('1Jo',2,18,22);\">1Jo 2:18, 22</a>; <a href=\"#\" onClick=\"return mV('1Jo',4,3);\">4:3</a>; <a href=\"#\" onClick=\"return mV('2Jo',1,7);\">2Jo 1:7</a>), \"Even now are there many antichrists.\"<br><br>(1.) This name has been applied to the \"little horn\" of the \"king of fierce countenance\" (<a href=\"#\" onClick=\"return mV('Dan',7,24,25);\">Dan 7:24-25</a>; <a href=\"#\" onClick=\"return mV('Dan',8,'23-25');\">8:23-25</a>).<br><br>(2.) It has been applied also to the \"false Christs\" spoken of by our Lord (<a href=\"#\" onClick=\"return mV('Mat',24,5,23,24);\">Mat 24:5, 23-24</a>).<br><br>(3.) To the \"man of sin\" described by Paul (<a href=\"#\" onClick=\"return mV('2Th',2,'3-7','8-10');\">2Th 2:3-7, 8-10</a>).<br><br>(4.) And to the \"beast from the sea\" (<a href=\"#\" onClick=\"return mV('Rev',13,1);\">Rev 13:1</a>; <a href=\"#\" onClick=\"return mV('Rev',17,'1-18');\">17:1-18</a>).";
