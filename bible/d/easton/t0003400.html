<script>
var eastonArray = new Array ();
eastonArray["$$T0003400"] = "<strong>Shobai:</strong> captors (<a href=\"#\" onClick=\"return mV('Ezr',2,42);\">Ezr 2:42</a>).";
eastonArray["$$T0003401"] = "<strong>Shobal:</strong> pilgrim.<br><br>(1.) The second son of Seir the Horite; one of the Horite \"dukes\" (<a href=\"#\" onClick=\"return mV('Gen',36,20);\">Gen 36:20</a>).<br><br>(2.) One of the sons of Caleb, and a descendant of Hur (<a href=\"#\" onClick=\"return mV('1Ch',2,50,52);\">1Ch 2:50, 52</a>; <a href=\"#\" onClick=\"return mV('1Ch',4,1,2);\">4:1-2</a>).";
eastonArray["$$T0003402"] = "<strong>Shobi:</strong> captor, son of Nahash of Rabbah, the Ammonite. He showed kindness to David when he fled from Jerusalem to Mahanaim (<a href=\"#\" onClick=\"return mV('2Sa',17,27);\">2Sa 17:27</a>).";
eastonArray["$$T0003403"] = "<strong>Shocho:</strong> (<a href=\"#\" onClick=\"return mV('2Ch',28,18);\">2Ch 28:18</a>) = Shochoh (<a href=\"#\" onClick=\"return mV('1Sa',17,1);\">1Sa 17:1</a>) = Shoco (<a href=\"#\" onClick=\"return mV('2Ch',11,7);\">2Ch 11:7</a>). See <a href=\"#\" onClick=\"return doDictLookup ('ET0003407');\">SOCOH.";
eastonArray["$$T0003404"] = "<strong>Shoe:</strong> Of various forms, from the mere sandal (q.v.) to the complete covering of the foot. The word so rendered (A.V.) in Deut. 33:25, <i>min'al</i>, \"a bar,\" is derived from a root meaning \"to bolt\" or \"shut fast,\" and hence a fastness or fortress. The verse has accordingly been rendered \"iron and brass shall be thy fortress,\" or, as in the Revised Version, \"thy bars [marg., \"shoes\"] shall be iron and brass.\"";
eastonArray["$$T0003405"] = "<strong>Shomer:</strong> watchman.<br><br>(1.) The mother of Jehozabad, who murdered Joash (<a href=\"#\" onClick=\"return mV('2Ki',12,21);\">2Ki 12:21</a>); called also Shimrith, a Moabitess (<a href=\"#\" onClick=\"return mV('2Ch',24,26);\">2Ch 24:26</a>).<br><br>(2.) A man of Asher (<a href=\"#\" onClick=\"return mV('1Ch',7,32);\">1Ch 7:32</a>); called also Shamer (<a href=\"#\" onClick=\"return mV('1Ch',7,34);\">34</a>).";
eastonArray["$$T0003406"] = "<strong>Shophan:</strong> hidden, or hollow, a town east of Jordan (<a href=\"#\" onClick=\"return mV('Num',32,35);\">Num 32:35</a>), built by the children of Gad. This word should probably be joined with the word preceding it in this passage, Atroth-Shophan, as in the Revised Version.";
eastonArray["$$T0003407"] = "<strong>Shoshannim:</strong> lilies, the name of some musical instrument, probably like a lily in shape (<a href=\"#\" onClick=\"return mV('Psa',45,'1-')\">Psa 45</a>; <a href=\"#\" onClick=\"return mV('Psa',69,1)\">69, title</a>). Some think that an instrument of six strings is meant.";
eastonArray["$$T0003408"] = "<strong>Shoshannim-Eduth:</strong> in title of <a href=\"#\" onClick=\"return mV('Psa',80,'1-')\">Psa 80</a> (R.V. marg., \"lilies, a testimony\"), probably the name of the melody to which the psalm was to be sung.";
eastonArray["$$T0003409"] = "<strong>Shrines, Silver:</strong> little models and medallions of the temple and image of Diana of Ephesus (<a href=\"#\" onClick=\"return mV('Act',19,24);\">Act 19:24</a>). The manufacture of these was a very large and profitable business.";
eastonArray["$$T0003410"] = "<strong>Shua:</strong> wealth.<br><br>(1.) A Canaanite whose daughter was married to Judah (<a href=\"#\" onClick=\"return mV('1Ch',2,3);\">1Ch 2:3</a>).<br><br>(2.) A daughter of Heber the Asherite (<a href=\"#\" onClick=\"return mV('1Ch',7,32);\">1Ch 7:32</a>).";
eastonArray["$$T0003411"] = "<strong>Shuah:</strong> prostration; a pit.<br><br>(1.) One of Abraham's sons by Keturah (<a href=\"#\" onClick=\"return mV('Gen',25,2);\">Gen 25:2</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,32);\">1Ch 1:32</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('1Ch',4,11);\">1Ch 4:11</a>.";
eastonArray["$$T0003412"] = "<strong>Shual, The land of:</strong> land of the fox, a district in the tribe of Benjamin (<a href=\"#\" onClick=\"return mV('1Sa',13,17);\">1Sa 13:17</a>); possibly the same as Shalim (<a href=\"#\" onClick=\"return mV('1Sa',9,4);\">9:4</a>), in the neighbourhood of Shaalabbin (<a href=\"#\" onClick=\"return mV('Jos',19,42);\">Jos 19:42</a>).";
eastonArray["$$T0003413"] = "<strong>Shuhite:</strong> a designation of Bildad (<a href=\"#\" onClick=\"return mV('Job',2,11);\">Job 2:11</a>), probably because he was a descendant of Shuah.";
eastonArray["$$T0003414"] = "<strong>Shulamite:</strong> the same, as some think, with \"Shunammite,\" from \"Shunem:\" otherwise, the import of the word is uncertain (<a href=\"#\" onClick=\"return mV('Sgs',6,13);\">Sgs 6:13</a>; R.V., \"Shulammite\").";
eastonArray["$$T0003415"] = "<strong>Shunammite:</strong> a person of Shunem (<a href=\"#\" onClick=\"return mV('1Ki',1,3);\">1Ki 1:3</a>; <a href=\"#\" onClick=\"return mV('2Ki',4,12);\">2Ki 4:12</a>). The Syr. and Arab. read \"Sulamite.\"";
eastonArray["$$T0003416"] = "<strong>Shunem:</strong> two resting-places, a little village in the tribe of Issachar, to the north of Jezreel and south of Mount Gilboa (<a href=\"#\" onClick=\"return mV('Jos',19,18);\">Jos 19:18</a>), where the Philistines encamped when they came against Saul (<a href=\"#\" onClick=\"return mV('1Sa',28,4);\">1Sa 28:4</a>), and where Elisha was hospitably entertained by a rich woman of the place. On the sudden death of this woman's son she hastened to Carmel, 20 miles distant across the plain, to tell Elisha, and to bring him with her to Shunem. There, in the \"prophet's chamber,\" the dead child lay; and Elisha entering it, shut the door and prayed earnestly: and the boy was restored to life (<a href=\"#\" onClick=\"return mV('2Ki',4,'8-37');\">2Ki 4:8-37</a>). This woman afterwards retired during the famine to the low land of the Philistines; and on returning a few years afterwards, found her house and fields in the possession of a stranger. She appealed to the king at Samaria, and had them in a somewhat remarkable manner restored to her (<a href=\"#\" onClick=\"return mV('2Ki',8,'1-6');\">2Ki 8:1-6</a>).";
eastonArray["$$T0003417"] = "<strong>Shur:</strong> an enclosure; a wall, a part, probably, of the Arabian desert, on the north-eastern border of Egypt, giving its name to a wilderness extending from Egypt toward Philistia (<a href=\"#\" onClick=\"return mV('Gen',16,7);\">Gen 16:7</a>; <a href=\"#\" onClick=\"return mV('Gen',20,1);\">20:1</a>; <a href=\"#\" onClick=\"return mV('Gen',25,18);\">25:18</a>; <a href=\"#\" onClick=\"return mV('Exd',15,22);\">Exd 15:22</a>). The name was probably given to it from the wall (or shur) which the Egyptians built to defend their frontier on the north-east from the desert tribes. This wall or line of fortifications extended from Pelusium to Heliopolis.";
eastonArray["$$T0003418"] = "<strong>Shushan:</strong> a lily, the Susa of Greek and Roman writers, once the capital of Elam. It lay in the uplands of Susiana, on the east of the Tigris, about 150 miles to the north of the head of the Persian Gulf. It is the modern Shush, on the northwest of Shuster. Once a magnificent city, it is now an immense mass of ruins. Here Daniel saw one of his visions (<a href=\"#\" onClick=\"return mV('Dan',8,'1-')\">Dan 8</a>); and here also Nehemiah (<a href=\"#\" onClick=\"return mV('Neh',1,'1-')\">Neh 1</a>) began his public life. Most of the events recorded in the Book of Esther took place here. Modern explorers have brought to light numerous relics, and the ground-plan of the splendid palace of Shushan, one of the residences of the great king, together with numerous specimens of ancient art, which illustrate the statements of Scripture regarding it (<a href=\"#\" onClick=\"return mV('Dan',8,2);\">Dan 8:2</a>). The great hall of this palace (<a href=\"#\" onClick=\"return mV('Est',1,'1-')\">Est 1</a>) \"consisted of several magnificent groups of columns, together with a frontage of 343 feet 9 inches, and a depth of 244 feet. These groups were arranged into a central phalanx of thirty-six columns (six rows of six each), flanked on the west, north, and east by an equal number, disposed in double rows of six each, and distant from them 64 feet 2 inches.\" The inscriptions on the ruins represent that the palace was founded by Darius and completed by Artaxerxes.";
eastonArray["$$T0003419"] = "<strong>Shushan-Eduth:</strong> lily of the testimony, the title of <a href=\"#\" onClick=\"return mV('Psa',60,'1-');\">Psa 60</a>. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003407');\">SHOSHANNIM</a>.)";
eastonArray["$$T0003420"] = "<strong>Sibbecai:</strong> the Lord sustains, one of David's heroes (<a href=\"#\" onClick=\"return mV('1Ch',11,29);\">1Ch 11:29</a>), general of the eighth division of the army (<a href=\"#\" onClick=\"return mV('1Ch',27,11);\">27:11</a>). He slew the giant Saph in the battle of Gob (<a href=\"#\" onClick=\"return mV('2Sa',21,18);\">2Sa 21:18</a>; R.V., \"Sibbechai\"). Called also Mebunnai (<a href=\"#\" onClick=\"return mV('2Sa',23,27);\">23:27</a>).";
eastonArray["$$T0003421"] = "<strong>Sibmah:</strong> coolness; fragrance, a town in Reuben, in the territory of Moab, on the east of Jordan (<a href=\"#\" onClick=\"return mV('Jos',13,19);\">Jos 13:19</a>); called also Shebam and Shibmah (<a href=\"#\" onClick=\"return mV('Num',32,3,38);\">Num 32:3, 38</a>). It was famous for its vines (<a href=\"#\" onClick=\"return mV('Isa',16,9);\">Isa 16:9</a>; <a href=\"#\" onClick=\"return mV('Jer',48,32);\">Jer 48:32</a>). It has been identified with the ruin of Sumieh, where there are rock-cut wine-presses. This fact explains the words of the prophets referred to above. It was about 5 miles east of Heshbon.";
eastonArray["$$T0003422"] = "<strong>Sichem:</strong> =She'chem, (q.v.), <a href=\"#\" onClick=\"return mV('Gen',12,6);\">Gen 12:6</a>.";
eastonArray["$$T0003423"] = "<strong>Sickle:</strong> of the Egyptians resembled that in modern use. The ears of corn were cut with it near the top of the straw. There was also a sickle used for warlike purposes, more correctly, however, called a pruning-hook (<a href=\"#\" onClick=\"return mV('Deu',16,9);\">Deu 16:9</a>; <a href=\"#\" onClick=\"return mV('Jer',50,16);\">Jer 50:16</a>, marg., \"scythe; <a href=\"#\" onClick=\"return mV('Joe',3,13);\">Joe 3:13</a>; <a href=\"#\" onClick=\"return mV('Mar',4,29);\">Mar 4:29</a>).";
eastonArray["$$T0003424"] = "<strong>Siddim, Vale of:</strong> valley of the broad plains, \"which is the salt sea\" (<a href=\"#\" onClick=\"return mV('Gen',14,3,8,10);\">Gen 14:3, 8, 10</a>), between Engedi and the cities of the plain, at the south end of the Dead Sea. It was \"full of slime-pits\" (R.V., \"bitumen pits\"). Here Chedorlaomer and the confederate kings overthrew the kings of Sodom and the cities of the plain. God afterwards, on account of their wickedness, \"overthrew those cities, and all the plain, and all the inhabitants of the cities;\" and the smoke of their destruction \"went up as the smoke of a furnace\" (<a href=\"#\" onClick=\"return mV('Gen',19,'24-28');\">19:24-28</a>), and was visible from Mamre, where Abraham dwelt.<br><br>Some, however, contend that the \"cities of the plain\" were somewhere at the north of the Dead Sea. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003469');\">SODOM</a>.)";
eastonArray["$$T0003425"] = "<strong>Sidon:</strong> fishing; fishery, <a href=\"#\" onClick=\"return mV('Gen',10,15,19);\">Gen 10:15, 19</a> (A.V. marg., Tzidon; R.V., Zidon); <a href=\"#\" onClick=\"return mV('Mat',11,21,22);\">Mat 11:21-22</a>; <a href=\"#\" onClick=\"return mV('Luk',6,17);\">Luk 6:17</a>. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003926');\">ZIDON</a>.)";
eastonArray["$$T0003426"] = "<strong>Signet:</strong> a seal used to attest documents (<a href=\"#\" onClick=\"return mV('Dan',6,'8-10',12);\">Dan 6:8-10, 12</a>). In <a href=\"#\" onClick=\"return mV('Dan',6,17);\">Dan 6:17</a>, this word properly denotes a ring. The impression of a signet ring on fine clay has recently been discovered among the ruins at Nineveh. It bears the name and title of an Egyptian king. Two actual signet rings of ancient Egyptian monarchs (Cheops and Horus) have also been discovered.<br><br>When digging a shaft close to the south wall of the temple area, the engineers of the Palestine Exploration Fund, at a depth of 12 feet below the surface, came upon a pavement of polished stones, formerly one of the streets of the city. Under this pavement they found a stratum of 16 feet of concrete, and among this concrete, 10 feet down, they found a signet stone bearing the inscription, in Old Hebrew characters, \"Haggai, son of Shebaniah.\" It has been asked, Might not this be the actual seal of Haggai the prophet? We know that he was in Jerusalem after the Captivity; and it is somewhat singular that he alone of all the minor prophets makes mention of a signet (<a href=\"#\" onClick=\"return mV('Hag',2,23);\">Hag 2:23</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003246');\">SEAL</a>.)";
eastonArray["$$T0003427"] = "<strong>Sihon:</strong> striking down. The whole country on the east of Jordan, from the Arnon to the Jabbok, was possessed by the Amorites, whose king, Sihon, refused to permit the Israelites to pass through his territory, and put his army in array against them. The Israelites went forth against him to battle, and gained a complete victory. The Amorites were defeated; Sihon, his sons, and all his people were smitten with the sword, his walled towns were captured, and the entire country of the Amorites was taken possession of by the Israelites (<a href=\"#\" onClick=\"return mV('Num',21,'21-30');\">Num 21:21-30</a>; <a href=\"#\" onClick=\"return mV('Deu',2,'24-37');\">Deu 2:24-37</a>).<br><br>The country from the Jabbok to Hermon was at this time ruled by Og, the last of the Rephaim. He also tried to prevent the progress of the Israelites, but was utterly routed, and all his cities and territory fell into the hands of the Israelites (<a href=\"#\" onClick=\"return mV('Num',21,'33-35');\">Num 21:33-35</a>; <a href=\"#\" onClick=\"return mV('Deu',3,'1-14');\">Deu 3:1-14</a>; <a href=\"#\" onClick=\"return mV('Psa',135,'10-12');\">Psa 135:10-12</a>; <a href=\"#\" onClick=\"return mV('Psa',136,'17-22');\">136:17-22</a>).<br><br>These two victories gave the Israelites possession of the country on the east of Jordan, from the Arnon to the foot of Hermon. The kingdom of Sihon embraced about 1,500 square miles, while that of Og was more than 3,000 square miles.";
eastonArray["$$T0003428"] = "<strong>Sihor:</strong> (correctly Shi'hor) black; dark the name given to the river Nile in <a href=\"#\" onClick=\"return mV('Isa',23,3);\">Isa 23:3</a>; <a href=\"#\" onClick=\"return mV('Jer',2,18);\">Jer 2:18</a>. In <a href=\"#\" onClick=\"return mV('Jos',13,3);\">Jos 13:3</a> it is probably \"the river of Egypt\", i.e., the Wady el-Arish (<a href=\"#\" onClick=\"return mV('1Ch',13,5);\">1Ch 13:5</a>), which flows \"before Egypt\", i.e., in a north-easterly direction from Egypt, and enters the sea about 50 miles south-west of Gaza.";
eastonArray["$$T0003429"] = "<strong>Silas:</strong> wood, a prominent member of the church at Jerusalem; also called Silvanus. He and Judas, surnamed Barsabas, were chosen by the church there to accompany Paul and Barnabas on their return to Antioch from the council of the apostles and elders (<a href=\"#\" onClick=\"return mV('Act',15,22);\">Act 15:22</a>), as bearers of the decree adopted by the council. He assisted Paul there in his evangelistic labours, and was also chosen by him to be his companion on his second missionary tour (<a href=\"#\" onClick=\"return mV('Act',16,'19-24');\">Act 16:19-24</a>). He is referred to in the epistles under the name of Silvanus (<a href=\"#\" onClick=\"return mV('2Cr',1,19);\">2Cr 1:19</a>; <a href=\"#\" onClick=\"return mV('1Th',1,1);\">1Th 1:1</a>; <a href=\"#\" onClick=\"return mV('2Th',1,1);\">2Th 1:1</a>; <a href=\"#\" onClick=\"return mV('1Pe',5,12);\">1Pe 5:12</a>). There is no record of the time or place of his death.";
eastonArray["$$T0003430"] = "<strong>Silk:</strong> Heb. demeshek, \"damask,\" silk cloth manufactured at Damascus, <a href=\"#\" onClick=\"return mV('Amo',3,12);\">Amo 3:12</a>. A.V., \"in the corner of a bed, and in Damascus in a couch;\" R.V., \"in the corner of a couch, and on the silken cushions of a bed\" (marg., \"in Damascus on a bed\").<br><br>Heb. meshi, (<a href=\"#\" onClick=\"return mV('Eze',16,10,13);\">Eze 16:10, 13</a>, rendered \"silk\"). In <a href=\"#\" onClick=\"return mV('Gen',41,42);\">Gen 41:42</a> (marg. A.V.), <a href=\"#\" onClick=\"return mV('Pro',31,22);\">Pro 31:22</a> (R.V., \"fine linen\"), the word \"silk\" ought to be \"fine linen.\"<br><br>Silk was common in New Testament times (<a href=\"#\" onClick=\"return mV('Rev',18,12);\">Rev 18:12</a>).";
eastonArray["$$T0003431"] = "<strong>Silla:</strong> a highway; a twig, only in <a href=\"#\" onClick=\"return mV('2Ki',12,20);\">2Ki 12:20</a>. If taken as a proper name (as in the LXX. and other versions), the locality is unknown.";
eastonArray["$$T0003432"] = "<strong>Siloah, The pool of:</strong> Heb. shelah; i.e., \"the dart\", <a href=\"#\" onClick=\"return mV('Neh',3,15);\">Neh 3:15</a>; with the art. <i>shiloah</i>, \"sending,\" (<a href=\"#\" onClick=\"return mV('Isa',8,6);\">Isa 8:6</a>; <a href=\"#\" onClick=\"return mV('Isa',7,3);\">Isa 7:3</a>) =Siloam (q.v.)";
eastonArray["$$T0003433"] = "<strong>Siloam, Pool of:</strong> sent or sending. Here a notable miracle was wrought by our Lord in giving sight to the blind (<a href=\"#\" onClick=\"return mV('Jhn',9,'7-11');\">Jhn 9:7-11</a>). It has been identified with the Birket Silwan in the lower Tyropoeon valley, to the south-east of the hill of Zion.<br><br>The water which flows into this pool intermittingly by a subterranean channel springs from the \"Fountain of the Virgin\" (q.v.). The length of this channel, which has several windings, is 1,750 feet, though the direct distance is only 1,100 feet. The pool is 53 feet in length from north to south, 18 feet wide, and 19 deep. The water passes from it by a channel cut in the rock into the gardens below. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0001214');\">EN-ROGEL</a>.)<br><br>Many years ago (1880) a youth, while wading up the conduit by which the water enters the pool, accidentally discovered an inscription cut in the rock, on the eastern side, about 19 feet from the pool. This is the oldest extant Hebrew record of the kind. It has with great care been deciphered by scholars, and has been found to be an account of the manner in which the tunnel was constructed. Its whole length is said to be \"twelve hundred cubits;\" and the inscription further notes that the workmen, like the excavators of the Mont Cenis Tunnel, excavated from both ends, meeting in the middle.<br><br>Some have argued that the inscription was cut in the time of Solomon; others, with more probability, refer it to the reign of Hezekiah. A more ancient tunnel was discovered in 1889 some 20 feet below the ground. It is of smaller dimensions, but more direct in its course. It is to this tunnel that Isaiah (<a href=\"#\" onClick=\"return mV('Isa',8,6);\">Isa 8:6</a>) probably refers.<br><br>The Siloam inscription above referred to was surreptitiously cut from the wall of the tunnel in 1891 and broken into fragments. These were, however, recovered by the efforts of the British Consul at Jerusalem, and have been restored to their original place.";
eastonArray["$$T0003434"] = "<strong>Siloam, Tower of:</strong> mentioned only (<a href=\"#\" onClick=\"return mV('Luk',13,4);\">Luk 13:4</a>). The place here spoken of is the village now called Silwan, or Kefr Silwan, on the east of the valley of Kidron, and to the north-east of the pool. It stands on the west slope of the Mount of Olives.<br><br>As illustrative of the movement of small bands of Canaanites from place to place, and the intermingling of Canaanites and Israelites even in small towns in earlier times, M.C. Ganneau records the following curious fact: \"Among the inhabitants of the village (of Siloam) there are a hundred or so domiciled for the most part in the lower quarter, and forming a group apart from the rest, called Dhiabrye, i.e., men of Dhiban. It appears that at some remote period a colony from the capital of king Mesha (Dibon-Moab) crossed the Jordan and fixed itself at the gates of Jerusalem at Silwan. The memory of this migration is still preserved; and I am assured by the people themselves that many of their number are installed in other villages round Jerusalem\" (quoted by Henderson, Palestine).";
eastonArray["$$T0003435"] = "<strong>Silver:</strong> used for a great variety of purposes, as may be judged from the frequent references to it in Scripture. It first appears in commerce in <a href=\"#\" onClick=\"return mV('Gen',13,2);\">Gen 13:2</a>; <a href=\"#\" onClick=\"return mV('Gen',23,15,16);\">23:15-16</a>. It was largely employed for making vessels for the sanctuary in the wilderness (<a href=\"#\" onClick=\"return mV('Exd',26,19);\">Exd 26:19</a>; <a href=\"#\" onClick=\"return mV('Exd',27,17);\">27:17</a>; <a href=\"#\" onClick=\"return mV('Num',7,13,19);\">Num 7:13, 19</a>; <a href=\"#\" onClick=\"return mV('Num',10,2);\">10:2</a>). There is no record of its having been found in Syria or Palestine. It was brought in large quantities by foreign merchants from abroad, from Spain and India and other countries probably.";
eastonArray["$$T0003436"] = "<strong>Silverling:</strong> (<a href=\"#\" onClick=\"return mV('Isa',7,23);\">Isa 7:23</a>). Literally the words are \"at a thousand of silver\", i.e., \"pieces of silver,\" or shekels.";
eastonArray["$$T0003437"] = "<strong>Simeon:</strong> hearing.<br><br>(1.) The second son of Jacob by Leah (<a href=\"#\" onClick=\"return mV('Gen',29,33);\">Gen 29:33</a>). He was associated with Levi in the terrible act of vengeance against Hamor and the Shechemites (<a href=\"#\" onClick=\"return mV('Gen',34,25,26);\">34:25-26</a>). He was detained by Joseph in Egypt as a hostage (<a href=\"#\" onClick=\"return mV('Gen',42,24);\">42:24</a>). His father, when dying, pronounced a malediction against him (<a href=\"#\" onClick=\"return mV('Gen',49,'5-7');\">49:5-7</a>). The words in the Authorized Version (<a href=\"#\" onClick=\"return mV('Gen',49,6);\">49:6</a>), \"they digged down a wall,\" ought to be, as correctly rendered in the Revised Version, \"they houghed an ox.\"<br><br>(2.) An aged saint who visited the temple when Jesus was being presented before the Lord, and uttered lofty words of thankgiving and of prophecy (<a href=\"#\" onClick=\"return mV('Luk',2,'29-35');\">Luk 2:29-35</a>).<br><br>(3.) One of the ancestors of Joseph (<a href=\"#\" onClick=\"return mV('Luk',3,30);\">Luk 3:30</a>).<br><br>(4.) Surnamed Niger, i.e., \"black,\" perhaps from his dark complexion, a teacher of some distinction in the church of Antioch (<a href=\"#\" onClick=\"return mV('Act',13,'1-3');\">Act 13:1-3</a>). It has been supposed that this was the Simon of Cyrene who bore Christ's cross. Note the number of nationalities represented in the church at Antioch.<br><br>(5.) James (<a href=\"#\" onClick=\"return mV('Act',15,14);\">Act 15:14</a>) thus designates the apostle Peter (q.v.).";
eastonArray["$$T0003438"] = "<strong>Simeon, The tribe of:</strong> was \"divided and scattered\" according to the prediction in <a href=\"#\" onClick=\"return mV('Gen',49,'5-7');\">Gen 49:5-7</a>. They gradually dwindled in number, and sank into a position of insignificance among the other tribes. They decreased in the wilderness by about two-thirds (<a href=\"#\" onClick=\"return mV('Num',1,23);\">Num 1:23</a>; <a href=\"#\" onClick=\"return mV('Num',26,14);\">26:14</a>). Moses pronounces no blessing on this tribe. It is passed by in silence (<a href=\"#\" onClick=\"return mV('Deu',33,'1-')\">Deu 33</a>).<br><br>This tribe received as their portion a part of the territory already allotted to Judah (<a href=\"#\" onClick=\"return mV('Jos',19,'1-9');\">Jos 19:1-9</a>). It lay in the south-west of the land, with Judah on the east and Dan on the north; but whether it was a compact territory or not cannot be determined. The subsequent notices of this tribe are but few (<a href=\"#\" onClick=\"return mV('1Ch',4,'24-43');\">1Ch 4:24-43</a>). Like Reuben on the east of Jordan, this tribe had little influence on the history of Israel.";
eastonArray["$$T0003439"] = "<strong>Simon:</strong> the abbreviated form of Simeon.<br><br>(1.) One of the twelve apostles, called the Canaanite (<a href=\"#\" onClick=\"return mV('Mat',10,4);\">Mat 10:4</a>; <a href=\"#\" onClick=\"return mV('Mar',3,18);\">Mar 3:18</a>). This word \"Canaanite\" does not mean a native of Canaan, but is derived from the Syriac word Kanean or Kaneniah, which was the name of a Jewish sect. The Revised Version has \"Cananaean;\" marg., \"or Zealot\" He is also called \"Zelotes\" (<a href=\"#\" onClick=\"return mV('Luk',6,15);\">Luk 6:15</a>; <a href=\"#\" onClick=\"return mV('Act',1,13);\">Act 1:13</a>; R.V., \"the Zealot\"), because previous to his call to the apostleship he had been a member of the fanatical sect of the Zealots. There is no record regarding him.<br><br>(2.) The father of Judas Iscariot (<a href=\"#\" onClick=\"return mV('Jhn',6,71);\">Jhn 6:71</a>; <a href=\"#\" onClick=\"return mV('Jhn',13,2,26);\">13:2, 26</a>).<br><br>(3.) One of the brothers of our Lord (<a href=\"#\" onClick=\"return mV('Mat',13,55);\">Mat 13:55</a>; <a href=\"#\" onClick=\"return mV('Mar',6,3);\">Mar 6:3</a>).<br><br>(4.) A Pharisee in whose house \"a woman of the city which was a sinner\" anointed our Lord's feet with ointment (<a href=\"#\" onClick=\"return mV('Luk',7,'36-38');\">Luk 7:36-38</a>).<br><br>(5.) A leper of Bethany, in whose house Mary anointed our Lord's head with ointment \"as he sat at meat\" (<a href=\"#\" onClick=\"return mV('Mat',26,'6-13');\">Mat 26:6-13</a>; <a href=\"#\" onClick=\"return mV('Mar',14,'3-9');\">Mar 14:3-9</a>).<br><br>(6.) A Jew of Cyrene, in North Africa, then a province of Libya. A hundred thousand Jews from Palestine had been settled in this province by Ptolemy Soter (B.C. 323-285), where by this time they had greatly increased in number. They had a synagogue in Jerusalem for such of their number as went thither to the annual feasts. Simon was seized by the soldiers as the procession wended its way to the place of crucifixion as he was passing by, and the heavy cross which Christ from failing strength could no longer bear was laid on his shoulders. Perhaps they seized him because he showed sympathy with Jesus. He was the \"father of Alexander and Rufus\" (<a href=\"#\" onClick=\"return mV('Mat',27,32);\">Mat 27:32</a>). Possibly this Simon may have been one of the \"men of Cyrene\" who preached the word to the Greeks (<a href=\"#\" onClick=\"return mV('Act',11,20);\">Act 11:20</a>).<br><br>(7.) A sorcerer of great repute for his magical arts among the Samaritans (<a href=\"#\" onClick=\"return mV('Act',8,'9-11');\">Act 8:9-11</a>). He afterwards became a professed convert to the faith under the preaching of Philip the deacon and evangelist (<a href=\"#\" onClick=\"return mV('Act',8,12,13);\">12-13</a>). His profession was, however, soon found to be hollow. His conduct called forth from Peter a stern rebuke (<a href=\"#\" onClick=\"return mV('Act',8,'18-23');\">8:18-23</a>). From this moment he disappears from the Church's history. The term \"Simony,\" as denoting the purchase for money of spiritual offices, is derived from him.<br><br>(8.) A Christian at Joppa, a tanner by trade, with whom Peter on one occasion lodged (<a href=\"#\" onClick=\"return mV('Act',9,43);\">Act 9:43</a>).<br><br>(9.) Simon Peter (<a href=\"#\" onClick=\"return mV('Mat',4,18);\">Mat 4:18</a>). See <a href=\"#\" onClick=\"return doDictLookup ('ET0002911');\">PETER</a>.";
eastonArray["$$T0003440"] = "<strong>Simri:</strong> watchman, a Levite of the family of Merari (<a href=\"#\" onClick=\"return mV('1Ch',26,10);\">1Ch 26:10</a>).";
eastonArray["$$T0003441"] = "<strong>Sin:</strong> is \"any want of conformity unto or transgression of the law of God\" (<a href=\"#\" onClick=\"return mV('1Jo',3,4);\">1Jo 3:4</a>; <a href=\"#\" onClick=\"return mV('Rom',4,15);\">Rom 4:15</a>), in the inward state and habit of the soul, as well as in the outward conduct of the life, whether by omission or commission (<a href=\"#\" onClick=\"return mV('Rom',6,'12-17');\">Rom 6:12-17</a>; <a href=\"#\" onClick=\"return mV('Rom',7,'5-24');\">7:5-24</a>). It is \"not a mere violation of the law of our constitution, nor of the system of things, but an offence against a personal lawgiver and moral governor who vindicates his law with penalties. The soul that sins is always conscious that his sin is<br><br>(1) intrinsically vile and polluting, and<br><br>(2) that it justly deserves punishment, and calls down the righteous wrath of God.<br><br>Hence sin carries with it two inalienable characters,<br><br>(1) ill-desert, guilt (reatus); and<br><br>(2) pollution (macula).\", Hodge's Outlines.<br><br>The moral character of a man's actions is determined by the moral state of his heart. The disposition to sin, or the habit of the soul that leads to the sinful act, is itself also sin (<a href=\"#\" onClick=\"return mV('Rom',6,'12-17');\">Rom 6:12-17</a>; <a href=\"#\" onClick=\"return mV('Gal',5,17);\">Gal 5:17</a>; <a href=\"#\" onClick=\"return mV('Jam',1,14,15);\">Jam 1:14-15</a>).<br><br>The origin of sin is a mystery, and must for ever remain such to us. It is plain that for some reason God has permitted sin to enter this world, and that is all we know. His permitting it, however, in no way makes God the author of sin.<br><br>Adam's sin (<a href=\"#\" onClick=\"return mV('Gen',3,'1-6');\">Gen 3:1-6</a>) consisted in his yielding to the assaults of temptation and eating the forbidden fruit. It involved in it,<br><br>(1) the sin of unbelief, virtually making God a liar; and<br><br>(2) the guilt of disobedience to a positive command.<br><br> By this sin he became an apostate from God, a rebel in arms against his Creator. He lost the favour of God and communion with him; his whole nature became depraved, and he incurred the penalty involved in the covenant of works.<br><br>Original sin. \"Our first parents being the root of all mankind, the guilt of their sin was imputed, and the same death in sin and corrupted nature were conveyed to all their posterity, descending from them by ordinary generation.\" Adam was constituted by God the federal head and representative of all his posterity, as he was also their natural head, and therefore when he fell they fell with him (<a href=\"#\" onClick=\"return mV('Rom',5,'12-21');\">Rom 5:12-21</a>; <a href=\"#\" onClick=\"return mV('1Cr',15,'22-45');\">1Cr 15:22-45</a>). His probation was their probation, and his fall their fall. Because of Adam's first sin all his posterity came into the world in a state of sin and condemnation, i.e.,<br><br>(1) a state of moral corruption, and<br><br>(2) of guilt, as having judicially imputed to them the guilt of Adam's first sin.<br><br>\"Original sin\" is frequently and properly used to denote only the moral corruption of their whole nature inherited by all men from Adam. This inherited moral corruption consists in,<br><br>(1) the loss of original righteousness; and<br><br>(2) the presence of a constant proneness to evil, which is the root and origin of all actual sin. It is called \"sin\" (<a href=\"#\" onClick=\"return mV('Rom',6,12,14,17);\">Rom 6:12, 14, 17</a>; <a href=\"#\" onClick=\"return mV('Rom',7,'5-17');\">7:5-17</a>), the \"flesh\" (<a href=\"#\" onClick=\"return mV('Gal',5,17,24);\">Gal 5:17, 24</a>), \"lust\" (<a href=\"#\" onClick=\"return mV('Jam',1,14,15);\">Jam 1:14-15</a>), the \"body of sin\" (<a href=\"#\" onClick=\"return mV('Rom',6,6);\">Rom 6:6</a>), \"ignorance,\" \"blindness of heart,\" \"alienation from the life of God\" (<a href=\"#\" onClick=\"return mV('Eph',4,18,19);\">Eph 4:18-19</a>). It influences and depraves the whole man, and its tendency is still downward to deeper and deeper corruption, there remaining no recuperative element in the soul. It is a total depravity, and it is also universally inherited by all the natural descendants of Adam (<a href=\"#\" onClick=\"return mV('Rom',3,'10-23');\">Rom 3:10-23</a>; <a href=\"#\" onClick=\"return mV('Rom',5,'12-21');\">5:12-21</a>; <a href=\"#\" onClick=\"return mV('Rom',8,7);\">8:7</a>). Pelagians deny original sin, and regard man as by nature morally and spiritually well; semi-Pelagians regard him as morally sick; Augustinians, or, as they are also called, Calvinists, regard man as described above, spiritually dead (<a href=\"#\" onClick=\"return mV('Eph',2,1);\">Eph 2:1</a>; <a href=\"#\" onClick=\"return mV('1Jo',3,14);\">1Jo 3:14</a>).<br><br>The doctrine of original sin is proved,<br><br>(1.) From the fact of the universal sinfulness of men. \"There is no man that sinneth not\" (<a href=\"#\" onClick=\"return mV('1Ki',8,46);\">1Ki 8:46</a>; <a href=\"#\" onClick=\"return mV('Isa',53,6);\">Isa 53:6</a>; <a href=\"#\" onClick=\"return mV('Psa',130,3);\">Psa 130:3</a>; <a href=\"#\" onClick=\"return mV('Rom',3,19,22,23);\">Rom 3:19, 22-23</a>; <a href=\"#\" onClick=\"return mV('Gal',3,22);\">Gal 3:22</a>).<br><br>(2.) From the total depravity of man. All men are declared to be destitute of any principle of spiritual life; man's apostasy from God is total and complete (<a href=\"#\" onClick=\"return mV('Job',15,'14-16');\">Job 15:14-16</a>; <a href=\"#\" onClick=\"return mV('Gen',6,5,6);\">Gen 6:5-6</a>).<br><br>(3.) From its early manifestation (<a href=\"#\" onClick=\"return mV('Psa',58,3);\">Psa 58:3</a>; <a href=\"#\" onClick=\"return mV('Pro',22,15);\">Pro 22:15</a>).<br><br>(4.) It is proved also from the necessity, absolutely and universally, of regeneration (<a href=\"#\" onClick=\"return mV('Jhn',3,3);\">Jhn 3:3</a>; <a href=\"#\" onClick=\"return mV('2Cr',5,17);\">2Cr 5:17</a>).<br><br>(5.) From the universality of death (<a href=\"#\" onClick=\"return mV('Rom',5,'12-20');\">Rom 5:12-20</a>).<br><br>Various kinds of sin are mentioned,<br><br>(1.) \"Presumptuous sins,\" or as literally rendered, \"sins with an uplifted hand\", i.e., defiant acts of sin, in contrast with \"errors\" or \"inadvertencies\" (<a href=\"#\" onClick=\"return mV('Psa',19,13);\">Psa 19:13</a>).<br><br>(2.) \"Secret\", i.e., hidden sins (<a href=\"#\" onClick=\"return mV('Psa',19,12);\">19:12</a>); sins which escape the notice of the soul.<br><br>(3.) \"Sin against the Holy Ghost\" (q.v.), or a \"sin unto death\" (<a href=\"#\" onClick=\"return mV('Mat',12,31,32);\">Mat 12:31-32</a>; <a href=\"#\" onClick=\"return mV('1Jo',5,16);\">1Jo 5:16</a>), which amounts to a wilful rejection of grace.<br><br>Sin, a city in Egypt, called by the Greeks Pelusium, which means, as does also the Hebrew name, \"clayey\" or \"muddy,\" so called from the abundance of clay found there. It is called by Ezekiel (<a href=\"#\" onClick=\"return mV('Eze',30,15);\">Eze 30:15</a>) \"the strength of Egypt, \"thus denoting its importance as a fortified city. It has been identified with the modern Tineh, \"a miry place,\" where its ruins are to be found. Of its boasted magnificence only four red granite columns remain, and some few fragments of others.";
eastonArray["$$T0003442"] = "<strong>Sinai:</strong> of Sin (the moon god), called also Horeb, the name of the mountain district which was reached by the Hebrews in the third month after the Exodus. Here they remained encamped for about a whole year. Their journey from the Red Sea to this encampment, including all the windings of the route, was about 150 miles. The last twenty-two chapters of Exodus, together with the whole of Leviticus and Num. ch. 1-11, contain a record of all the transactions which occurred while they were here. From Rephidim (<a href=\"#\" onClick=\"return mV('Exd',17,'8-13');\">Exd 17:8-13</a>) the Israelites journeyed forward through the Wady Solaf and Wady esh-Sheikh into the plain of er-Rahah, \"the desert of Sinai,\" about 2 miles long and half a mile broad, and encamped there \"before the mountain.\" The part of the mountain range, a protruding lower bluff, known as the Ras Sasafeh (Sufsafeh), rises almost perpendicularly from this plain, and is in all probability the Sinai of history. Dean Stanley thus describes the scene:, \"The plain itself is not broken and uneven and narrowly shut in, like almost all others in the range, but presents a long retiring sweep, within which the people could remove and stand afar off. The cliff, rising like a huge altar in front of the whole congregation, and visible against the sky in lonely grandeur from end to end of the whole plain, is the very image of the 'mount that might be touched,' and from which the voice of God might be heard far and wide over the plain below.\" This was the scene of the giving of the law. From the Ras Sufsafeh the law was proclaimed to the people encamped below in the plain of er-Rahah. During the lengthened period of their encampment here the Israelites passed through a very memorable experience. An immense change passed over them. They are now an organized nation, bound by covenant engagement to serve the Lord their God, their ever-present divine Leader and Protector. At length, in the second month of the second year of the Exodus, they move their camp and march forward according to a prescribed order. After three days they reach the \"wilderness of Paran,\" the \"et-Tih\", i.e., \"the desert\", and here they make their first encampment. At this time a spirit of discontent broke out amongst them, and the Lord manifested his displeasure by a fire which fell on the encampment and inflicted injury on them. Moses called the place Taberah (q.v.), <a href=\"#\" onClick=\"return mV('Num',11,'1-3');\">Num 11:1-3</a>. The journey between Sinai and the southern boundary of the Promised Land (about 150 miles) at Kadesh was accomplished in about a year.";
eastonArray["$$T0003443"] = "<strong>Sinaiticus codex:</strong> usually designated by the first letter of the Hebrew alphabet, is one of the most valuable of ancient MSS. of the Greek New Testament. On the occasion of a third visit to the convent of St. Catherine, on Mount Sinai, in 1859, it was discovered by Dr. Tischendorf. He had on a previous visit in 1844 obtained forty-three parchment leaves of the LXX., which he deposited in the university library of Leipsic, under the title of the Codex Frederico-Augustanus, after his royal patron the king of Saxony. In the year referred to (1859) the emperor of Russia sent him to prosecute his search for MSS., which he was convinced were still to be found in the Sinai convent. The story of his finding the manuscript of the New Testament has all the interest of a romance. He reached the convent on 31st January; but his inquiries appeared to be fruitless. On the 4th February he had resolved to return home without having gained his object. \"On that day, when walking with the provisor of the convent, he spoke with much regret of his ill-success. Returning from their promenade, Tischendorf accompanied the monk to his room, and there had displayed to him what his companion called a copy of the LXX., which he, the ghostly brother, owned. The MS. was wrapped up in a piece of cloth, and on its being unrolled, to the surprise and delight of the critic the very document presented itself which he had given up all hope of seeing. His object had been to complete the fragmentary LXX. of 1844, which he had declared to be the most ancient of all Greek codices on vellum that are extant; but he found not only that, but a copy of the Greek New Testament attached, of the same age, and perfectly complete, not wanting a single page or paragraph.\" This precious fragment, after some negotiations, he obtained possession of, and conveyed it to the Emperor Alexander, who fully appreciated its importance, and caused it to be published as nearly as possible in facsimile, so as to exhibit correctly the ancient handwriting. The entire codex consists of 346 1/2 folios. Of these 199 belong to the Old Testament and 147 1/2 to the New, along with two ancient documents called the Epistle of Barnabas and the Shepherd of Hermas. The books of the New Testament stand thus: the four Gospels, the epistles of Paul, the Acts of the Apostles, the Catholic Epistles, the Apocalypse of John. It is shown by Tischendorf that this codex was written in the fourth century, and is thus of about the same age as the Vatican codex; but while the latter wants the greater part of Matthew and sundry leaves here and there besides, the Sinaiticus is the only copy of the New Testament in uncial characters which is complete. Thus it is the oldest extant MS. copy of the New Testament. Both the Vatican and the Sinai codices were probably written in Egypt. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003766');\">VATICANUS</a>.)";
eastonArray["$$T0003444"] = "<strong>Sinim, The land of:</strong> (<a href=\"#\" onClick=\"return mV('Isa',49,12);\">Isa 49:12</a>), supposed by some to mean China, but more probably Phoenicia (<a href=\"#\" onClick=\"return mV('Gen',10,17);\">Gen 10:17</a>) is intended.";
eastonArray["$$T0003445"] = "<strong>Sinite:</strong> an inhabitant of Sin, near Arka (<a href=\"#\" onClick=\"return mV('Gen',10,17);\">Gen 10:17</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,15);\">1Ch 1:15</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000310');\">ARKITE</a>.)";
eastonArray["$$T0003446"] = "<strong>Sin-offering:</strong> (Heb. hattath), the law of, is given in detail in <a href=\"#\" onClick=\"return mV('Lev',4,'6-13');\">Lev 4-6:13</a>; <a href=\"#\" onClick=\"return mV('Lev',9,'7-11','22-24');\">9:7-11, 22-24</a>; <a href=\"#\" onClick=\"return mV('Lev',12,'6-8');\">12:6-8</a>; <a href=\"#\" onClick=\"return mV('Lev',15,2,14,'25-30');\">15:2, 14, 25-30</a>; <a href=\"#\" onClick=\"return mV('Lev',14,19,31);\">14:19, 31</a>; <a href=\"#\" onClick=\"return mV('Num',6,'10-14');\">Num 6:10-14</a>. On the day of Atonement it was made with special solemnity (<a href=\"#\" onClick=\"return mV('Lev',16,5,11,15);\">Lev 16:5, 11, 15</a>). The blood was then carried into the holy of holies and sprinkled on the mercy-seat. Sin-offerings were also presented at the five annual festivals (<a href=\"#\" onClick=\"return mV('Num',28,'1-');\">Num 28</a>; <a href=\"#\" onClick=\"return mV('Num',29,'1-');\">29</a>), and on the occasion of the consecration of the priests (<a href=\"#\" onClick=\"return mV('Exd',29,'10-14', 36);\">Exd 29:10-14, 36</a>). As each individual, even the most private member of the congregation, as well as the congregation at large, and the high priest, was obliged, on being convicted by his conscience of any particular sin, to come with a sin-offering, we see thus impressively disclosed the need in which every sinner stands of the salvation of Christ, and the necessity of making application to it as often as the guilt of sin renews itself upon his conscience. This resort of faith to the perfect sacrifice of Christ is the one way that lies open for the sinner's attainment of pardon and restoration to peace. And then in the sacrifice itself there is the reality of that incomparable worth and preciousness which were so significantly represented in the sin-offering by the sacredness of its blood and the hallowed destination of its flesh. With reference to this the blood of Christ is called emphatically \"the precious blood,\" and the blood that \"cleanseth from all sin\" (<a href=\"#\" onClick=\"return mV('1Jo',1,7);\">1Jo 1:7</a>).";
eastonArray["$$T0003447"] = "<strong>Sin, Wilderness of:</strong> lying between Elim and sinai (<a href=\"#\" onClick=\"return mV('Exd',16,1);\">Exd 16:1</a>; <a href=\"#\" onClick=\"return mV('Num',33,11,12);\">Num 33:11-12</a>). This was probably the narrow plain of el-Markha, which stretches along the eastern shore of the Red Sea for several miles toward the promontory of Ras Mohammed, the southern extremity of the Sinitic Peninsula. While the Israelites rested here for some days they began to murmur on account of the want of nourishment, as they had by this time consumed all the corn they had brought with them out of Egypt. God heard their murmurings, and gave them \"manna\" and then quails in abundance.";
eastonArray["$$T0003448"] = "<strong>Sion:</strong> elevated.<br><br>(1.) Denotes Mount Hermon in <a href=\"#\" onClick=\"return mV('Deu',4,48);\">Deu 4:48</a>; called Sirion by the Sidonians, and by the Amorites Shenir (<a href=\"#\" onClick=\"return mV('Deu',3,9);\">Deu 3:9</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0001754');\">HERMON</a>.)<br><br>(2.) The Greek form of Zion (q.v.) in <a href=\"#\" onClick=\"return mV('Mat',21,5);\">Mat 21:5</a>; <a href=\"#\" onClick=\"return mV('Jhn',12,15);\">Jhn 12:15</a>.";
eastonArray["$$T0003449"] = "<strong>Siphmoth:</strong> fruitful places, some unknown place in the south, where David found friends when he fled from Saul (<a href=\"#\" onClick=\"return mV('1Sa',30,28);\">1Sa 30:28</a>).";
</script>
