<script>var eastonArray = new Array ();
eastonArray["$$T0000500"] = "<strong>Beer:</strong> well.<br><br>(1.) A place where a well was dug by the direction of Moses, at the forty-fourth station of the Hebrews in their wanderings (<a href=\"#\" onClick=\"return mV('Num',21,'16-18');\">Num 21:16-18</a>) in the wilderness of Moab. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003803');\">WELL</a>.)<br><br>(2.) A town in the tribe of Judah to which Jotham fled for fear of Abimelech (<a href=\"#\" onClick=\"return mV('Jdg',9,21);\">Jdg 9:21</a>). Some have identified this place with Beeroth.";
eastonArray["$$T0000501"] = "<strong>Beer-elim:</strong> well of heroes, probably the name given to Beer, the place where the chiefs of Israel dug a well (<a href=\"#\" onClick=\"return mV('Num',21,16);\">Num 21:16</a>; <a href=\"#\" onClick=\"return mV('Isa',15,8);\">Isa 15:8</a>).";
eastonArray["$$T0000502"] = "<strong>Beeri:</strong> illustrious, or the well-man.<br><br>(1.) The father of Judith, one of the wives of Esau (<a href=\"#\" onClick=\"return mV('Gen',26,34);\">Gen 26:34</a>), the same as Adah (<a href=\"#\" onClick=\"return mV('Gen',36,2);\">Gen 36:2</a>).<br><br>(2.) The father of the prophet Hosea (<a href=\"#\" onClick=\"return mV('Hsa',1,1);\">Hsa 1:1</a>).";
eastonArray["$$T0000503"] = "<strong>Beer-lahai-roi:</strong> i.e., \"the well of him that liveth and seeth me,\" or, as some render it, \"the well of the vision of life\", the well where the Lord met with Hagar (<a href=\"#\" onClick=\"return mV('Gen',16,'7-14');\">Gen 16:7-14</a>). Isaac dwelt beside this well (<a href=\"#\" onClick=\"return mV('Gen',24,62);\">24:62</a>; <a href=\"#\" onClick=\"return mV('Gen',25,11);\">25:11</a>). It has been identified with 'Ain Muweileh, or Moilahhi, south-west of Beersheba, and about 12 miles W. from Kadesh-barnea.";
eastonArray["$$T0000504"] = "<strong>Beeroth:</strong> wells, one of the four cities of the Hivites which entered by fraud into a league with Joshua. It belonged to Benjamin (<a href=\"#\" onClick=\"return mV('Jos',18,25);\">Jos 18:25</a>). It has by some been identified with el-Bireh on the way to Nablus, 10 miles north of Jerusalem.";
eastonArray["$$T0000505"] = "<strong>Beeroth of the children of Jaakan:</strong> (<a href=\"#\" onClick=\"return mV('Deu',10,6);\">Deu 10:6</a>). The same as Bene-jaakan (<a href=\"#\" onClick=\"return mV('Num',33,31);\">Num 33:31</a>).";
eastonArray["$$T0000506"] = "<strong>Beersheba:</strong> well of the oath, or well of seven, a well dug by Abraham, and so named because he and Abimelech here entered into a compact (<a href=\"#\" onClick=\"return mV('Gen',21,31);\">Gen 21:31</a>). On re-opening it, Isaac gave it the same name (<a href=\"#\" onClick=\"return mV('Gen',26,'31-33');\">Gen 26:31-33</a>). It was a favourite place of abode of both of these patriarchs (<a href=\"#\" onClick=\"return mV('Gen',21,'33-');\">21:33</a>-<a href=\"#\" onClick=\"return mV('Gen',22,1,19);\">22:1, 19</a>; <a href=\"#\" onClick=\"return mV('Gen',26,33);\">26:33</a>; <a href=\"#\" onClick=\"return mV('Gen',28,10);\">28:10</a>). It is mentioned among the \"cities\" given to the tribe of Simeon (<a href=\"#\" onClick=\"return mV('Jos',19,2);\">Jos 19:2</a>; <a href=\"#\" onClick=\"return mV('1Ch',4,28);\">1Ch 4:28</a>). From Dan to Beersheba, a distance of about 144 miles (<a href=\"#\" onClick=\"return mV('Jdg',20,1);\">Jdg 20:1</a>; <a href=\"#\" onClick=\"return mV('1Ch',21,2);\">1Ch 21:2</a>; <a href=\"#\" onClick=\"return mV('2Sa',24,2);\">2Sa 24:2</a>), became the usual way of designating the whole Promised Land, and passed into a proverb. After the return from the Captivity the phrase is narrowed into \"from Beersheba unto the valley of Hinnom\" (<a href=\"#\" onClick=\"return mV('Neh',11,30);\">Neh 11:30</a>). The kingdom of the ten tribes extended from Beersheba to Mount Ephraim (<a href=\"#\" onClick=\"return mV('2Ch',19,4);\">2Ch 19:4</a>). The name is not found in the New Testament. It is still called by the Arabs Bir es-Seba, i.e., \"well of the seven\", where there are to the present day two principal wells and five smaller ones. It is nearly midway between the southern end of the Dead Sea and the Mediterranean.";
eastonArray["$$T0000507"] = "<strong>Beetle:</strong> (Heb. hargol, meaning \"leaper\"). Mention of it is made only in <a href=\"#\" onClick=\"return mV('Lev',11,22);\">Lev 11:22</a>, where it is obvious the word cannot mean properly the beetle. It denotes some winged creeper with at least four feet, \"which has legs above its feet, to leap withal.\" The description plainly points to the locust (q.v.). This has been an article of food from the earliest times in the East to the present day. The word is rendered \"cricket\" in the Revised Version.";
eastonArray["$$T0000508"] = "<strong>Beeves:</strong> (an old English plural of the word beef), a name applicable to all ruminating animals except camels, and especially to the Bovidce, or horned cattle (<a href=\"#\" onClick=\"return mV('Lev',22,19,21);\">Lev 22:19, 21</a>; <a href=\"#\" onClick=\"return mV('Num',31,28,30,33,38,44);\">Num 31:28, 30, 33, 38, 44</a>).";
eastonArray["$$T0000509"] = "<strong>Beg:</strong> That the poor existed among the Hebrews we have abundant evidence (<a href=\"#\" onClick=\"return mV('Exd',23,11);\">Exd 23:11</a>; <a href=\"#\" onClick=\"return mV('Deu',15,11);\">Deu 15:11</a>), but there is no mention of beggars properly so called in the Old Testament. The poor were provided for by the law of Moses (<a href=\"#\" onClick=\"return mV('Lev',19,10);\">Lev 19:10</a>; <a href=\"#\" onClick=\"return mV('Deu',12,12);\">Deu 12:12</a>; <a href=\"#\" onClick=\"return mV('Deu',14,29);\">14:29</a>). It is predicted of the seed of the wicked that they shall be beggars (<a href=\"#\" onClick=\"return mV('Psa',37,25);\">Psa 37:25</a>; <a href=\"#\" onClick=\"return mV('Psa',109,10);\">109:10</a>).<br><br>In the New Testament we find not seldom mention made of beggars (<a href=\"#\" onClick=\"return mV('Mar',10,46);\">Mar 10:46</a>; <a href=\"#\" onClick=\"return mV('Luk',16,20,21);\">Luk 16:20-21</a>; <a href=\"#\" onClick=\"return mV('Act',3,2);\">Act 3:2</a>), yet there is no mention of such a class as vagrant beggars, so numerous in the East. \"Beggarly,\" in <a href=\"#\" onClick=\"return mV('Gal',4,9);\">Gal 4:9</a>, means worthless.";
eastonArray["$$T0000510"] = "<strong>Behead:</strong> a method of taking away life practised among the Egyptians (<a href=\"#\" onClick=\"return mV('Gen',40,'17-19');\">Gen 40:17-19</a>). There are instances of this mode of punishment also among the Hebrews (<a href=\"#\" onClick=\"return mV('2Sa',4,8);\">2Sa 4:8</a>; <a href=\"#\" onClick=\"return mV('2Sa',20,21,22);\">20:21-22</a>; <a href=\"#\" onClick=\"return mV('2Ki',10,'6-8');\">2Ki 10:6-8</a>). It is also mentioned in the New Testament (<a href=\"#\" onClick=\"return mV('Mat',14,'8-12');\">Mat 14:8-12</a>; <a href=\"#\" onClick=\"return mV('Act',12,2);\">Act 12:2</a>).";
eastonArray["$$T0000511"] = "<strong>Behemoth:</strong> (<a href=\"#\" onClick=\"return mV('Job',40,'15-24');\">Job 40:15-24</a>). Some have supposed this to be an Egyptian word meaning a \"water-ox.\" The Revised Version has here in the margin \"hippopotamus,\" which is probably the correct rendering of the word. The word occurs frequently in Scripture, but, except here, always as a common name, and translated \"beast\" or \"cattle.\"";
eastonArray["$$T0000512"] = "<strong>Bekah:</strong> Both the name and its explanation, \"a half shekel,\" are given in <a href=\"#\" onClick=\"return mV('Exd',38,26);\">Exd 38:26</a>. The word properly means a \"division,\" a \"part.\" (R.V., \"beka.\")";
eastonArray["$$T0000513"] = "<strong>Bel:</strong> the Aramaic form of Baal, the national god of the Babylonians (<a href=\"#\" onClick=\"return mV('Isa',46,1);\">Isa 46:1</a>; <a href=\"#\" onClick=\"return mV('Jer',50,2);\">Jer 50:2</a>; <a href=\"#\" onClick=\"return mV('Jer',51,44);\">51:44</a>). It signifies \"lord.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0000382');\">BAAL</a>.)";
eastonArray["$$T0000514"] = "<strong>Bela:</strong> a thing swallowed.<br><br>(1.) A city on the shore of the Dead Sea, not far from Sodom, called also Zoar. It was the only one of the five cities that was spared at Lot's intercession (<a href=\"#\" onClick=\"return mV('Gen',19,20,23);\">Gen 19:20, 23</a>). It is first mentioned in <a href=\"#\" onClick=\"return mV('Gen',14,2,8);\">Gen 14:2, 8</a>.<br><br>(2.) The eldest son of Benjamin (<a href=\"#\" onClick=\"return mV('Num',26,38);\">Num 26:38</a>; <a href=\"#\" onClick=\"return mV('Gen',46,21);\">Gen 46:21</a>).<br><br>(3.) The son of Beor, and a king of Edom (<a href=\"#\" onClick=\"return mV('Gen',36,32,33);\">Gen 36:32-33</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,43);\">1Ch 1:43</a>).<br><br>(4.) A son of Azaz (<a href=\"#\" onClick=\"return mV('1Ch',5,8);\">1Ch 5:8</a>).";
eastonArray["$$T0000515"] = "<strong>Belial:</strong> worthlessness, frequently used in the Old Testament as a proper name. It is first used in <a href=\"#\" onClick=\"return mV('Deu',13,13);\">Deu 13:13</a>. In the New Testament it is found only in <a href=\"#\" onClick=\"return mV('2Cr',6,15);\">2Cr 6:15</a>, where it is used as a name of Satan, the personification of all that is evil. It is translated \"wicked\" in <a href=\"#\" onClick=\"return mV('Deu',15,9);\">Deu 15:9</a>; <a href=\"#\" onClick=\"return mV('Psa',41,8);\">Psa 41:8</a> (R.V. marg.); <a href=\"#\" onClick=\"return mV('Psa',101,3);\">101:3</a>; <a href=\"#\" onClick=\"return mV('Pro',6,12);\">Pro 6:12</a>, etc. The expression \"son\" or \"man of Belial\" means simply a worthless, lawless person (<a href=\"#\" onClick=\"return mV('Jdg',19,22);\">Jdg 19:22</a>; <a href=\"#\" onClick=\"return mV('Jdg',20,13);\">20:13</a>; <a href=\"#\" onClick=\"return mV('1Sa',1,16);\">1Sa 1:16</a>; <a href=\"#\" onClick=\"return mV('1Sa',2,12);\">2:12</a>).";
eastonArray["$$T0000516"] = "<strong>Bell:</strong> The bells first mentioned in Scripture are the small golden bells attached to the hem of the high priest's ephod (<a href=\"#\" onClick=\"return mV('Exd',28,'33-35');\">Exd 28:33-35</a>). The \"bells of the horses\" mentioned by Zechariah (<a href=\"#\" onClick=\"return mV('Zec',14,20);\">Zec 14:20</a>) were attached to the bridles or belts round the necks of horses trained for war, so as to accustom them to noise and tumult.";
eastonArray["$$T0000517"] = "<strong>Bellows:</strong> occurs only in <a href=\"#\" onClick=\"return mV('Jer',6,29);\">Jer 6:29</a>, in relation to the casting of metal. Probably they consisted of leather bags similar to those common in Egypt.";
eastonArray["$$T0000518"] = "<strong>Belly:</strong> the seat of the carnal affections (<a href=\"#\" onClick=\"return mV('Tts',1,12);\">Tts 1:12</a>; <a href=\"#\" onClick=\"return mV('Phl',3,19);\">Phl 3:19</a>; <a href=\"#\" onClick=\"return mV('Rom',16,18);\">Rom 16:18</a>). The word is used symbolically for the heart (<a href=\"#\" onClick=\"return mV('Pro',18,8);\">Pro 18:8</a>; <a href=\"#\" onClick=\"return mV('Pro',20,27);\">20:27</a>; <a href=\"#\" onClick=\"return mV('Pro',22,18);\">22:18</a>, marg.). The \"belly of hell\" signifies the grave or underworld (<a href=\"#\" onClick=\"return mV('Jon',2,2);\">Jon 2:2</a>).";
eastonArray["$$T0000519"] = "<strong>Belshazzar:</strong> Bel protect the king!, the last of the kings of Babylon (<a href=\"#\" onClick=\"return mV('Dan',5,1);\">Dan 5:1</a>). He was the son of Nabonidus by Nitocris, who was the daughter of Nebuchadnezzar and the widow of Nergal-sharezer. When still young he made a great feast to a thousand of his lords, and when heated with wine sent for the sacred vessels his \"father\" (<a href=\"#\" onClick=\"return mV('Dan',5,2);\">Dan 5:2</a>), or grandfather, Nebuchadnezzar had carried away from the temple in Jerusalem, and he and his princes drank out of them. In the midst of their mad revelry a hand was seen by the king tracing on the wall the announcement of God's judgment, which that night fell upon him. At the instance of the queen (i.e., his mother) Daniel was brought in, and he interpreted the writing. That night the kingdom of the Chaldeans came to an end, and the king was slain (<a href=\"#\" onClick=\"return mV('Dan',5,30);\">Dan 5:30</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002709');\">NERGAL-SHAREZER</a>.)<br><br>The absence of the name of Belshazzar on the monuments was long regarded as an argument against the genuineness of the Book of Daniel. In 1854 Sir Henry Rawlinson found an inscription of Nabonidus which referred to his eldest son. Quite recently, however, the side of a ravine undermined by heavy rains fell at Hillah, a suburb of Babylon. A number of huge, coarse earthenware vases were laid bare. These were filled with tablets, the receipts and contracts of a firm of Babylonian bankers, which showed that Belshazzar had a household, with secretaries and stewards. One was dated in the third year of the king Marduk-sar-uzur. As Marduk-sar-uzar was another name for Baal, this Marduk-sar-uzur was found to be the Belshazzar of Scripture. In one of these contract tablets, dated in the July after the defeat of the army of Nabonidus, we find him paying tithes for his sister to the temple of the sun-god at Sippara.";
eastonArray["$$T0000520"] = "<strong>Belteshazzar:</strong> Beltis protect the king!, the Chaldee name given to Daniel by Nebuchadnezzar (<a href=\"#\" onClick=\"return mV('Dan',1,7);\">Dan 1:7</a>).";
eastonArray["$$T0000521"] = "<strong>Benaiah:</strong> built up by Jehovah.<br><br>(1.) The son of Jehoiada, chief priest (<a href=\"#\" onClick=\"return mV('1Ch',27,5);\">1Ch 27:5</a>). He was set by David over his body-guard of Cherethites and Pelethites (<a href=\"#\" onClick=\"return mV('2Sa',8,18);\">2Sa 8:18</a>; <a href=\"#\" onClick=\"return mV('1Ki',1,32);\">1Ki 1:32</a>; <a href=\"#\" onClick=\"return mV('1Ch',18,17);\">1Ch 18:17</a>). His exploits are enumerated in <a href=\"#\" onClick=\"return mV('2Sa',23,'20-22');\">2Sa 23:20-22</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,22);\">1Ch 11:22</a>. He remained faithful to Solomon (<a href=\"#\" onClick=\"return mV('1Ki',1,8,10,26);\">1Ki 1:8, 10, 26</a>), by whom he was raised to the rank of commander-in-chief (<a href=\"#\" onClick=\"return mV('1Ki',2,25,29,30,34,35);\">1Ki 2:25, 29, 30, 34, 35</a>; <a href=\"#\" onClick=\"return mV('1Ki',4,4);\">4:4</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('2Sa',23,30);\">2Sa 23:30</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,31);\">1Ch 11:31</a>.<br><br>(3.) A musical Levite (<a href=\"#\" onClick=\"return mV('1Ch',15,18,20);\">1Ch 15:18, 20</a>).<br><br>(4.) A priest (<a href=\"#\" onClick=\"return mV('1Ch',15,24);\">1Ch 15:24</a>; <a href=\"#\" onClick=\"return mV('1Ch',16,6);\">16:6</a>).<br><br>(5.) The son of Jeiel (<a href=\"#\" onClick=\"return mV('2Ch',20,14);\">2Ch 20:14</a>).";
eastonArray["$$T0000522"] = "<strong>Ben-ammi:</strong> son of my kindred; i.e., \"born of incest\", the son of Lot by his youngest daughter (<a href=\"#\" onClick=\"return mV('Gen',19,38);\">Gen 19:38</a>).";
eastonArray["$$T0000523"] = "<strong>Bench:</strong> deck of a Tyrian ship, described by Ezekiel (<a href=\"#\" onClick=\"return mV('Eze',27,6);\">Eze 27:6</a>) as overlaid with box-wood.";
eastonArray["$$T0000524"] = "<strong>Bene-jaakan:</strong> children of Jaakan (<a href=\"#\" onClick=\"return mV('Num',33,31,32);\">Num 33:31-32</a>), the same as Beeroth.";
eastonArray["$$T0000525"] = "<strong>Ben-hadad:</strong> the standing title of the Syrian kings, meaning \"the son of Hadad.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0001569');\">HADADEZER</a>.)<br><br>(1.) The king of Syria whom Asa, king of Judah, employed to invade Israel (<a href=\"#\" onClick=\"return mV('1Ki',15,18);\">1Ki 15:18</a>).<br><br>(2.) Son of the preceding, also king of Syria. He was long engaged in war against Israel. He was murdered probably by Hazael, by whom he was succeeded (<a href=\"#\" onClick=\"return mV('2Ki',8,'7-15');\">2Ki 8:7-15</a>), after a reign of some thirty years.<br><br>(3.) King of Damascus, and successor of his father Hazael on the throne of Syria (<a href=\"#\" onClick=\"return mV('2Ki',13,3,4);\">2Ki 13:3-4</a>). His misfortunes in war are noticed by Amos (<a href=\"#\" onClick=\"return mV('Amo',1,4);\">Amo 1:4</a>).";
eastonArray["$$T0000526"] = "<strong>Benjamin:</strong> son of my right hand.<br><br>(1.) The younger son of Jacob by Rachel (<a href=\"#\" onClick=\"return mV('Gen',35,18);\">Gen 35:18</a>). His birth took place at Ephrath, on the road between Bethel and Bethlehem, at a short distance from the latter place. His mother died in giving him birth, and with her last breath named him Ben-oni, son of my pain, a name which was changed by his father into Benjamin. His posterity are called Benjamites (<a href=\"#\" onClick=\"return mV('Gen',49,27);\">Gen 49:27</a>; <a href=\"#\" onClick=\"return mV('Deu',33,12);\">Deu 33:12</a>; <a href=\"#\" onClick=\"return mV('Jos',18,21);\">Jos 18:21</a>).<br><br>The tribe of Benjamin at the Exodus was the smallest but one (<a href=\"#\" onClick=\"return mV('Num',1,36,37);\">Num 1:36-37</a>; <a href=\"#\" onClick=\"return mV('Psa',68,27);\">Psa 68:27</a>). During the march its place was along with Manasseh and Ephraim on the west of the tabernacle. At the entrance into Canaan it counted 45,600 warriors. It has been inferred by some from the words of Jacob (<a href=\"#\" onClick=\"return mV('Gen',49,27);\">Gen 49:27</a>) that the figure of a wolf was on the tribal standard. This tribe is mentioned in <a href=\"#\" onClick=\"return mV('Rom',11,1);\">Rom 11:1</a>; <a href=\"#\" onClick=\"return mV('Phl',3,5);\">Phl 3:5</a>.<br><br>The inheritance of this tribe lay immediately to the south of that of Ephraim, and was about 26 miles in length and 12 in breadth. Its eastern boundary was the Jordan. Dan intervened between it and the Philistines. Its chief towns are named in <a href=\"#\" onClick=\"return mV('Jos',18,'21-28');\">Jos 18:21-28</a>.<br><br>The history of the tribe contains a sad record of a desolating civil war in which they were engaged with the other eleven tribes. By it they were almost exterminated (<a href=\"#\" onClick=\"return mV('Jdg',20,20,21);\">Jdg 20:20-21</a>; <a href=\"#\" onClick=\"return mV('Jdg',21,10);\">21:10</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001476');\">GIBEAH</a>.)<br><br>The first king of the Jews was Saul, a Benjamite. A close alliance was formed between this tribe and that of Judah in the time of David (<a href=\"#\" onClick=\"return mV('2Sa',19,16,17);\">2Sa 19:16-17</a>), which continued after his death (<a href=\"#\" onClick=\"return mV('1Ki',11,13);\">1Ki 11:13</a>; <a href=\"#\" onClick=\"return mV('1Ki',12,20);\">12:20</a>). After the Exile these two tribes formed the great body of the Jewish nation (<a href=\"#\" onClick=\"return mV('Ezr',1,5);\">Ezr 1:5</a>; <a href=\"#\" onClick=\"return mV('Ezr',10,9);\">10:9</a>).<br><br>The tribe of Benjamin was famous for its archers (<a href=\"#\" onClick=\"return mV('1Sa',20,20,36);\">1Sa 20:20, 36</a>; <a href=\"#\" onClick=\"return mV('2Sa',1,22);\">2Sa 1:22</a>; <a href=\"#\" onClick=\"return mV('1Ch',8,40);\">1Ch 8:40</a>; <a href=\"#\" onClick=\"return mV('1Ch',12,2);\">12:2</a>) and slingers (<a href=\"#\" onClick=\"return mV('Jdg',20,6);\">Jdg 20:6</a>).<br><br>The gate of Benjamin, on the north side of Jerusalem (<a href=\"#\" onClick=\"return mV('Jer',37,13);\">Jer 37:13</a>; <a href=\"#\" onClick=\"return mV('Jer',38,7);\">38:7</a>; <a href=\"#\" onClick=\"return mV('Zec',14,10);\">Zec 14:10</a>), was so called because it led in the direction of the territory of the tribe of Benjamin. It is called by Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',20,2);\">Jer 20:2</a>) \"the high gate of Benjamin;\" also \"the gate of the children of the people\" (<a href=\"#\" onClick=\"return mV('Jer',17,19);\">17:19</a>). (<a href=\"#\" onClick=\"return mV('2Ki',14,13);\">2Ki 14:13</a>.)";
eastonArray["$$T0000527"] = "<strong>Beor:</strong> a torch.<br><br>(1.) The father of Bela, one of the kings of Edom (<a href=\"#\" onClick=\"return mV('Gen',36,32);\">Gen 36:32</a>).<br><br>(2.) The father of Balaam (<a href=\"#\" onClick=\"return mV('Num',22,5);\">Num 22:5</a>; <a href=\"#\" onClick=\"return mV('Num',24,3,15);\">24:3, 15</a>; <a href=\"#\" onClick=\"return mV('Num',31,8);\">31:8</a>). In <a href=\"#\" onClick=\"return mV('2Pe',2,15);\">2Pe 2:15</a> he is called Bosor.";
eastonArray["$$T0000528"] = "<strong>Bera:</strong> gift, or son of evil, king of Sodom at the time of the invasion of the four kings under Chedorlaomer (<a href=\"#\" onClick=\"return mV('Gen',14,2,8,17,21);\">Gen 14:2, 8, 17, 21</a>).";
eastonArray["$$T0000529"] = "<strong>Berachah:</strong> blessing.<br><br>(1.) A valley not far from Engedi, where Jehoshaphat overthrew the Moabites and Ammonites (<a href=\"#\" onClick=\"return mV('2Ch',20,26);\">2Ch 20:26</a>). It has been identified with the valley of Bereikut. (R.V., \"Beracah.\")<br><br>(2.) One of the Benjamite warriors, Saul's brethren, who joined David when at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,3);\">1Ch 12:3</a>).";
eastonArray["$$T0000530"] = "<strong>Berea:</strong> a city of Macedonia to which Paul with Silas and Timotheus went when persecuted at Thessalonica (<a href=\"#\" onClick=\"return mV('Act',17,10,13);\">Act 17:10, 13</a>), and from which also he was compelled to withdraw, when he fled to the sea-coast and thence sailed to Athens (<a href=\"#\" onClick=\"return mV('Act',17,14,15);\">14, 15</a>). Sopater, one of Paul's companions belonged to this city, and his conversion probably took place at this time (<a href=\"#\" onClick=\"return mV('Act',20,4);\">Act 20:4</a>). It is now called Verria.";
eastonArray["$$T0000531"] = "<strong>Berechiah:</strong> blessed by Jehovah.<br><br>(1.) Son of Shimea, and father of Asaph the musician (<a href=\"#\" onClick=\"return mV('1Ch',6,39);\">1Ch 6:39</a>; <a href=\"#\" onClick=\"return mV('1Ch',15,17);\">15:17</a>).<br><br>(2.) One of the seven Ephraimite chieftains, son of Meshillemoth (<a href=\"#\" onClick=\"return mV('2Ch',28,12);\">2Ch 28:12</a>).<br><br>(3.) The fourth of the five sons of Zerubbabel, of the royal family of Judah (<a href=\"#\" onClick=\"return mV('1Ch',3,20);\">1Ch 3:20</a>).<br><br>(4.) The father of the prophet Zechariah (<a href=\"#\" onClick=\"return mV('Zec',1,1,7);\">Zec 1:1, 7</a>).";
eastonArray["$$T0000532"] = "<strong>Bered:</strong> hail.<br><br>(1.) A town in the south of Palestine (<a href=\"#\" onClick=\"return mV('Gen',16,14);\">Gen 16:14</a>), in the desert of Shur, near Lahai-roi.<br><br>(2.) A son of Shuthelah, and grandson of Ephraim (<a href=\"#\" onClick=\"return mV('1Ch',7,20);\">1Ch 7:20</a>).";
eastonArray["$$T0000533"] = "<strong>Beriah:</strong> a gift, or in evil.<br><br>(1.) One of Asher's four sons, and father of Heber (<a href=\"#\" onClick=\"return mV('Gen',46,17);\">Gen 46:17</a>).<br><br>(2.) A son of Ephraim (<a href=\"#\" onClick=\"return mV('1Ch',7,'20-23');\">1Ch 7:20-23</a>), born after the slaughter of his brothers, and so called by his father \"because it went evil with his house\" at that time.<br><br>(3.) A Benjamite who with his brother Shema founded Ajalon and expelled the Gittites (<a href=\"#\" onClick=\"return mV('1Ch',8,13);\">1Ch 8:13</a>).";
eastonArray["$$T0000534"] = "<strong>Bernice:</strong> bearer of victory, the eldest daughter of Agrippa I., the Herod Agrippa of <a href=\"#\" onClick=\"return mV('Act',12,20);\">Act 12:20</a>. After the early death of her first husband she was married to her uncle Herod, king of Chalcis. After his death (A.D. 40) she lived in incestuous connection with her brother Agrippa II. (<a href=\"#\" onClick=\"return mV('Act',25,13,23);\">Act 25:13, 23</a>; <a href=\"#\" onClick=\"return mV('Act',26,30);\">26:30</a>). They joined the Romans at the outbreak of the final war between them and the Jews, and lived afterwards at Rome.";
eastonArray["$$T0000535"] = "<strong>Berodach-baladan:</strong> the king of Babylon who sent a friendly deputation to Hezekiah (<a href=\"#\" onClick=\"return mV('2Ki',20,12);\">2Ki 20:12</a>). In <a href=\"#\" onClick=\"return mV('Isa',39,1);\">Isa 39:1</a> he is called Merodach-baladan (q.v.).";
eastonArray["$$T0000536"] = "<strong>Beryl:</strong> the rendering in the Authorized Version of the Hebrew word <i>tarshish</i>, a precious stone; probably so called as being brought from Tarshish. It was one of the stones on the breastplate of the high priest (<a href=\"#\" onClick=\"return mV('Exd',28,20);\">Exd 28:20</a>; R.V. marg., \"chalcedony; <a href=\"#\" onClick=\"return mV('Exd',39,13);\">39:13</a>). The colour of the wheels in Ezekiel's vision was as the colour of a beryl stone (<a href=\"#\" onClick=\"return mV('Eze',1,16);\">Eze 1:16</a>; <a href=\"#\" onClick=\"return mV('Eze',10,9);\">10:9</a>; R.V., \"stone of Tarshish\"). It is mentioned in <a href=\"#\" onClick=\"return mV('Sgs',5,14);\">Sgs 5:14</a>; <a href=\"#\" onClick=\"return mV('Dan',10,6);\">Dan 10:6</a>; <a href=\"#\" onClick=\"return mV('Rev',21,20);\">Rev 21:20</a>. In <a href=\"#\" onClick=\"return mV('Eze',28,13);\">Eze 28:13</a> the LXX. render the word by \"chrysolite,\" which the Jewish historian Josephus regards as its proper translation. This also is the rendering given in the Authorized Version in the margin. That was a gold-coloured gem, the topaz of ancient authors.";
eastonArray["$$T0000537"] = "<strong>Besom:</strong> the rendering of a Hebrew word meaning sweeper, occurs only in <a href=\"#\" onClick=\"return mV('Isa',14,23);\">Isa 14:23</a>, of the sweeping away, the utter ruin, of Babylon.";
eastonArray["$$T0000538"] = "<strong>Besor:</strong> cold, a ravine or brook in the extreme south-west of Judah, where 200 of David's men stayed behind because they were faint, while the other 400 pursued the Amalekites (<a href=\"#\" onClick=\"return mV('1Sa',30,9,10,21);\">1Sa 30:9-10, 21</a>). Probably the Wadyes Sheriah, south of Gaza.";
eastonArray["$$T0000539"] = "<strong>Bestead:</strong> the rendering in <a href=\"#\" onClick=\"return mV('Isa',8,21);\">Isa 8:21</a>, where alone it occurs, of a Hebrew word meaning to oppress, or be in circumstances of hardship.";
eastonArray["$$T0000540"] = "<strong>Betah:</strong> confidence, a city belonging to Hadadezer, king of Zobah, which yielded much spoil of brass to David (<a href=\"#\" onClick=\"return mV('2Sa',8,8);\">2Sa 8:8</a>). In <a href=\"#\" onClick=\"return mV('1Ch',18,8);\">1Ch 18:8</a> it is called Tibhath.";
eastonArray["$$T0000541"] = "<strong>Beth:</strong> occurs frequently as the appellation for a house, or dwelling-place, in such compounds as the words immediately following:";
eastonArray["$$T0000542"] = "<strong>Bethabara:</strong> house of the ford, a place on the east bank of the Jordan, where John was baptizing (<a href=\"#\" onClick=\"return mV('Jhn',1,28);\">Jhn 1:28</a>). It may be identical with Bethbarah, the ancient ford of Jordan of which the men of Ephraim took possession (<a href=\"#\" onClick=\"return mV('Jdg',7,24);\">Jdg 7:24</a>). The Revised Version reads \"Bethany beyond Jordan.\" It was the great ford, and still bears the name of \"the ford,\" Makhadhet 'Abarah, \"the ford of crossing over,\" about 25 miles from Nazareth. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000550');\">BETHBARAH</a>.)";
eastonArray["$$T0000543"] = "<strong>Beth-anath:</strong> house of response, one of the fenced cities of Naphtali (<a href=\"#\" onClick=\"return mV('Jos',19,38);\">Jos 19:38</a>). It is perhaps identical with the modern village 'Ainata, 6 miles west of Kedesh.";
eastonArray["$$T0000544"] = "<strong>Beth-anoth:</strong> house of answers, a city in the mountainous district of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,59);\">Jos 15:59</a>). It has been identified with the modern Beit-'Anun, about 3 miles northeast of Hebron.";
eastonArray["$$T0000545"] = "<strong>Bethany:</strong> house of dates.<br><br>(1.) The Revised Version in <a href=\"#\" onClick=\"return mV('Jhn',1,28);\">Jhn 1:28</a> has this word instead of Bethabara, on the authority of the oldest manuscripts. It appears to have been the name of a place on the east of Jordan.<br><br>(2.) A village on the south-eastern slope of the Mount of Olives (<a href=\"#\" onClick=\"return mV('Mar',11,1);\">Mar 11:1</a>), about 2 miles east of Jerusalem, on the road to Jericho. It derived its name from the number of palm-trees which grew there. It was the residence of Lazarus and his sisters. It is frequently mentioned in connection with memorable incidents in the life of our Lord (<a href=\"#\" onClick=\"return mV('Mat',21,17);\">Mat 21:17</a>; <a href=\"#\" onClick=\"return mV('Mat',26,6);\">26:6</a>; <a href=\"#\" onClick=\"return mV('Mar',11,11,12);\">Mar 11:11-12</a>; <a href=\"#\" onClick=\"return mV('Mar',14,3);\">14:3</a>; <a href=\"#\" onClick=\"return mV('Luk',24,50);\">Luk 24:50</a>; <a href=\"#\" onClick=\"return mV('Jhn',11,1);\">Jhn 11:1</a>; <a href=\"#\" onClick=\"return mV('Jhn',12,1);\">12:1</a>). It is now known by the name of el-Azariyeh, i.e., \"place of Lazarus,\" or simply Lazariyeh. Seen from a distance, the village has been described as \"remarkably beautiful, the perfection of retirement and repose, of seclusion and lovely peace.\" Now a mean village, containing about twenty families.";
eastonArray["$$T0000546"] = "<strong>Beth-arabah:</strong> house of the desert, one of the six cities of Judah, situated in the sunk valley of the Jordan and Dead Sea (<a href=\"#\" onClick=\"return mV('Jos',18,22);\">Jos 18:22</a>). In <a href=\"#\" onClick=\"return mV('Jos',15,61);\">Jos 15:61</a> it is said to have been \"in the wilderness.\" It was afterwards included in the towns of Benjamin. It is called Arabah (<a href=\"#\" onClick=\"return mV('Jos',18,18);\">Jos 18:18</a>).";
eastonArray["$$T0000547"] = "<strong>Beth-aram:</strong> house of the height; i.e., \"mountain-house\", one of the towns of Gad, 3 miles east of Jordan, opposite Jericho (<a href=\"#\" onClick=\"return mV('Jos',13,27);\">Jos 13:27</a>). Probably the same as Beth-haran in <a href=\"#\" onClick=\"return mV('Num',32,36);\">Num 32:36</a>. It was called by king Herod, Julias, or Livias, after Livia, the wife of Augustus. It is now called Beit-haran.";
eastonArray["$$T0000548"] = "<strong>Beth-arbel:</strong> house of God's court, a place alluded to by Hosea (<a href=\"#\" onClick=\"return mV('Hsa',10,14);\">Hsa 10:14</a>) as the scene of some great military exploit, but not otherwise mentioned in Scripture. The Shalman here named was probably Shalmaneser, the king of Assyria (<a href=\"#\" onClick=\"return mV('2Ki',17,3);\">2Ki 17:3</a>).";
eastonArray["$$T0000549"] = "<strong>Beth-aven:</strong> house of nothingness; i.e., \"of idols\", a place in the mountains of Benjamin, east of Bethel (<a href=\"#\" onClick=\"return mV('Jos',7,2);\">Jos 7:2</a>; <a href=\"#\" onClick=\"return mV('Jos',18,12);\">18:12</a>; <a href=\"#\" onClick=\"return mV('1Sa',13,5);\">1Sa 13:5</a>). In <a href=\"#\" onClick=\"return mV('Hsa',4,15);\">Hsa 4:15</a>; <a href=\"#\" onClick=\"return mV('Hsa',5,8);\">5:8</a>; <a href=\"#\" onClick=\"return mV('Hsa',10,5);\">10:5</a> it stands for \"Bethel\" (q.v.), and it is so called because it was no longer the \"house of God,\" but \"the house of idols,\" referring to the calves there worshipped.";
</script>
