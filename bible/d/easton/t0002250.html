<TITLE>Dictionary Info Blue Letter Bible</TITLE>

<script src="./js/NoNavHeader.js"  type="text/javascript"></script>
<script>
var eastonArray = new Array ();
eastonArray["$$T0002250"] = "<strong>Law of Moses:</strong> is the whole body of the Mosaic legislation (<a href=\"#\" onClick=\"return mV('1Ki',2,3);\">1Ki 2:3</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,25);\">2Ki 23:25</a>; <a href=\"#\" onClick=\"return mV('Ezr',3,2);\">Ezr 3:2</a>). It is called by way of eminence simply \"the Law\" (<a href=\"#\" onClick=\"return mV('Deu',1,5);\">Deu 1:5</a>; <a href=\"#\" onClick=\"return mV('Deu',4,8,44);\">4:8, 44</a>; <a href=\"#\" onClick=\"return mV('Deu',17,18,19);\">17:18-19</a>; <a href=\"#\" onClick=\"return mV('Deu',27,3,8);\">27:3, 8</a>). As a written code it is called the \"book of the law of Moses\" (<a href=\"#\" onClick=\"return mV('2Ki',14,6);\">2Ki 14:6</a>; <a href=\"#\" onClick=\"return mV('Isa',8,20);\">Isa 8:20</a>), the \"book of the law of God\" (<a href=\"#\" onClick=\"return mV('Jos',24,26);\">Jos 24:26</a>).<br/><br/>The great leading principle of the Mosaic law is that it is essentially theocratic; i.e., it refers at once to the commandment of God as the foundation of all human duty.";
eastonArray["$$T0002251"] = "<strong>Lawyer:</strong> among the Jews, was one versed in the laws of Moses, which he expounded in the schools and synagogues (<a href=\"#\" onClick=\"return mV('Mat',22,35);\">Mat 22:35</a>; <a href=\"#\" onClick=\"return mV('Luk',10,25);\">Luk 10:25</a>). The functions of the \"lawyer\" and \"scribe\" were identical. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001050');\">DOCTOR</a>.)";
eastonArray["$$T0002252"] = "<strong>Lazarus:</strong> an abbreviation of Eleazar, whom God helps.<br><br>(1.) The brother of Mary and Martha of Bethany. He was raised from the dead after he had lain four days in the tomb (<a href=\"#\" onClick=\"return mV('Jhn',11,'1-44');\">Jhn 11:1-44</a>). This miracle so excited the wrath of the Jews that they sought to put both Jesus and Lazarus to death.<br/><br/>(2.) A beggar named in the parable recorded <a href=\"#\" onClick=\"return mV('Luk',16,'19-31');\">Luk 16:19-31</a>.";
eastonArray["$$T0002253"] = "<strong>Leaf:</strong> of a tree. The olive-leaf mentioned <a href=\"#\" onClick=\"return mV('Gen',8,11);\">Gen 8:11</a>. The barren fig-tree had nothing but leaves (<a href=\"#\" onClick=\"return mV('Mat',21,19);\">Mat 21:19</a>; <a href=\"#\" onClick=\"return mV('Mar',11,13);\">Mar 11:13</a>). The oak-leaf is mentioned <a href=\"#\" onClick=\"return mV('Isa',1,30);\">Isa 1:30</a>; <a href=\"#\" onClick=\"return mV('Isa',6,13);\">6:13</a>. There are numerous allusions to leaves, their flourishing, their decay, and their restoration (<a href=\"#\" onClick=\"return mV('Lev',26,36);\">Lev 26:36</a>; <a href=\"#\" onClick=\"return mV('Isa',34,4);\">Isa 34:4</a>; <a href=\"#\" onClick=\"return mV('Jer',8,13);\">Jer 8:13</a>; <a href=\"#\" onClick=\"return mV('Dan',4,12,14,21);\">Dan 4:12, 14, 21</a>; <a href=\"#\" onClick=\"return mV('Mar',11,13);\">Mar 11:13</a>; <a href=\"#\" onClick=\"return mV('Mar',13,28);\">13:28</a>). The fresh leaf is a symbol of prosperity (<a href=\"#\" onClick=\"return mV('Psa',1,3);\">Psa 1:3</a>; <a href=\"#\" onClick=\"return mV('Jer',17,8);\">Jer 17:8</a>; <a href=\"#\" onClick=\"return mV('Eze',47,12);\">Eze 47:12</a>); the faded, of decay (<a href=\"#\" onClick=\"return mV('Job',13,25);\">Job 13:25</a>; <a href=\"#\" onClick=\"return mV('Isa',1,30);\">Isa 1:30</a>; <a href=\"#\" onClick=\"return mV('Isa',64,6);\">64:6</a>; <a href=\"#\" onClick=\"return mV('Jer',8,13);\">Jer 8:13</a>).<br/><br/>Leaf of a door (<a href=\"#\" onClick=\"return mV('1Ki',6,34);\">1Ki 6:34</a>), the valve of a folding door.<br/><br/>Leaf of a book (<a href=\"#\" onClick=\"return mV('Jer',36,23);\">Jer 36:23</a>), perhaps a fold of a roll.";
eastonArray["$$T0002254"] = "<strong>League:</strong> a treaty or confederacy. The Jews were forbidden to enter into an alliance of any kind<br><br>(1) with the Canaanites (<a href=\"#\" onClick=\"return mV('Exd',23,32,33);\">Exd 23:32-33</a>; <a href=\"#\" onClick=\"return mV('Exd',34,'12-16');\">34:12-16</a>);<br><br>(2) with the Amalekites (<a href=\"#\" onClick=\"return mV('Exd',17,8,14);\">Exd 17:8, 14</a>; <a href=\"#\" onClick=\"return mV('Deu',25,'17-19');\">Deu 25:17-19</a>);<br><br>(3) with the Moabites and Ammonites (<a href=\"#\" onClick=\"return mV('Deu',2,9,19);\">Deu 2:9, 19</a>). Treaties were permitted to be entered into with all other nations. Thus David maintained friendly intercourse with the kings of Tyre and Hamath, and Solomon with the kings of Tyre and Egypt.";
eastonArray["$$T0002255"] = "<strong>Leah:</strong> weary, the eldest daughter of Laban, and sister of Rachel (<a href=\"#\" onClick=\"return mV('Gen',29,16);\">Gen 29:16</a>). Jacob took her to wife through a deceit of her father (<a href=\"#\" onClick=\"return mV('Gen',29,23);\">Gen 29:23</a>). She was \"tender-eyed\" (<a href=\"#\" onClick=\"return mV('Gen',29,17);\">17</a>). She bore to Jacob six sons (<a href=\"#\" onClick=\"return mV('Gen',29,'32-35');\">32-35</a>), also one daughter, Dinah (<a href=\"#\" onClick=\"return mV('Gen',30,21);\">30:21</a>). She accompanied Jacob into Canaan, and died there before the time of the going down into Egypt (<a href=\"#\" onClick=\"return mV('Gen',31,'1-')\">Gen 31</a>), and was buried in the cave of Machpelah (<a href=\"#\" onClick=\"return mV('Gen',49,31);\">49:31</a>).";
eastonArray["$$T0002256"] = "<strong>Leannoth:</strong> for answering; i.e., in singing, occurs in the title to <a href=\"#\" onClick=\"return mV('Psa',88,'1-');\">Ps. 88</a>. The title \"Mahalath (q.v.) Leannoth\" may be rendered \"concerning sickness, to be sung\" i.e., perhaps, to be sung in sickness.";
eastonArray["$$T0002257"] = "<strong>Leasing:</strong> (<a href=\"#\" onClick=\"return mV('Psa',4,2);\">Psa 4:2</a>; <a href=\"#\" onClick=\"return mV('Psa',5,6);\">5:6</a>) an Old English word meaning lies, or lying, as the Hebrew word <i>kazabh</i> is generally rendered.";
eastonArray["$$T0002258"] = "<strong>Leather:</strong> a girdle of, worn by Elijah (<a href=\"#\" onClick=\"return mV('2Ki',1,8);\">2Ki 1:8</a>) and John the Baptist (<a href=\"#\" onClick=\"return mV('Mat',3,4);\">Mat 3:4</a>). Leather was employed both for clothing (<a href=\"#\" onClick=\"return mV('Num',31,20);\">Num 31:20</a>; <a href=\"#\" onClick=\"return mV('Hbr',11,37);\">Hbr 11:37</a>) and for writing upon. The trade of a tanner is mentioned (<a href=\"#\" onClick=\"return mV('Act',9,43);\">Act 9:43</a>; <a href=\"#\" onClick=\"return mV('Act',10,6,32);\">10:6, 32</a>). It was probably learned in Egypt.";
eastonArray["$$T0002259"] = "<strong>Leaven:</strong><br><br>(1.) Heb. seor (<a href=\"#\" onClick=\"return mV('Exd',12,15,19);\">Exd 12:15, 19</a>; <a href=\"#\" onClick=\"return mV('Exd',13,7);\">13:7</a>; <a href=\"#\" onClick=\"return mV('Lev',2,11);\">Lev 2:11</a>), the remnant of dough from the preceding baking which had fermented and become acid.<br/><br/>(2.) Heb. hamets, properly \"ferment.\" In <a href=\"#\" onClick=\"return mV('Num',6,3);\">Num 6:3</a>, \"vinegar of wine\" is more correctly \"fermented wine.\" In <a href=\"#\" onClick=\"return mV('Exd',13,7);\">Exd 13:7</a>, the proper rendering would be, \"Unfermented things [Heb. matstsoth] shall be consumed during the seven days; and there shall not be seen with thee fermented things [hamets], and there shall not be seen with thee leavened mass [seor] in all thy borders.\" The chemical definition of ferment or yeast is \"a substance in a state of putrefaction, the atoms of which are in a continual motion.\"<br/><br/>The use of leaven was strictly forbidden in all offerings made to the Lord by fire (<a href=\"#\" onClick=\"return mV('Lev',2,11);\">Lev 2:11</a>; <a href=\"#\" onClick=\"return mV('Lev',7,12);\">7:12</a>; <a href=\"#\" onClick=\"return mV('Lev',8,2);\">8:2</a>; <a href=\"#\" onClick=\"return mV('Num',6,15);\">Num 6:15</a>). Its secretly penetrating and diffusive power is referred to in <a href=\"#\" onClick=\"return mV('1Cr',5,6);\">1Cr 5:6</a>. In this respect it is used to illustrate the growth of the kingdom of heaven both in the individual heart and in the world (<a href=\"#\" onClick=\"return mV('Mat',13,33);\">Mat 13:33</a>). It is a figure also of corruptness and of perverseness of heart and life (<a href=\"#\" onClick=\"return mV('Mat',16,6,11);\">Mat 16:6, 11</a>; <a href=\"#\" onClick=\"return mV('Mar',8,15);\">Mar 8:15</a>; <a href=\"#\" onClick=\"return mV('1Cr',5,7,8);\">1Cr 5:7-8</a>).";
eastonArray["$$T0002260"] = "<strong>Lebanon:</strong> white, \"the white mountain of Syria,\" is the loftiest and most celebrated mountain range in Syria. It is a branch running southward from the Caucasus, and at its lower end forking into two parallel ranges, the eastern or Anti-Lebanon, and the western or Lebanon proper. They enclose a long valley (<a href=\"#\" onClick=\"return mV('Jos',11,17);\">Jos 11:17</a>) of from 5 to 8 miles in width, called by Roman writers Coele-Syria, now called el-Buka'a, \"the valley,\" a prolongation of the valley of the Jordan.<br/><br/>Lebanon proper, Jebel es-Sharki, commences at its southern extremity in the gorge of the Leontes, the ancient Litany, and extends north-east, parallel to the Mediterranean coast, as far as the river Eleutherus, at the plain of Emesa, \"the entering of Hamath\" (<a href=\"#\" onClick=\"return mV('Num',34,8);\">Num 34:8</a>; <a href=\"#\" onClick=\"return mV('1Ki',8,65);\">1Ki 8:65</a>), in all about 90 geographical miles in extent. The average height of this range is from 6,000 to 8,000 feet; the peak of Jebel Mukhmel is about 10,200 feet, and the Sannin about 9,000. The highest peaks are covered with perpetual snow and ice. In the recesses of the range wild beasts as of old still abound (<a href=\"#\" onClick=\"return mV('2Ki',14,9);\">2Ki 14:9</a>; <a href=\"#\" onClick=\"return mV('Sgs',4,8);\">Sgs 4:8</a>). The scenes of the Lebanon are remarkable for their grandeur and beauty, and supplied the sacred writers with many expressive similes (<a href=\"#\" onClick=\"return mV('Psa',29,5,6);\">Psa 29:5-6</a>; <a href=\"#\" onClick=\"return mV('Psa',72,16);\">72:16</a>; <a href=\"#\" onClick=\"return mV('Psa',104,'16-18');\">104:16-18</a>; <a href=\"#\" onClick=\"return mV('Sgs',4,15);\">Sgs 4:15</a>; <a href=\"#\" onClick=\"return mV('Isa',2,13);\">Isa 2:13</a>; <a href=\"#\" onClick=\"return mV('Isa',35,2);\">35:2</a>; <a href=\"#\" onClick=\"return mV('Isa',60,13);\">60:13</a>; <a href=\"#\" onClick=\"return mV('Hsa',14,5);\">Hsa 14:5</a>). It is famous for its cedars (<a href=\"#\" onClick=\"return mV('Sgs',5,15);\">Sgs 5:15</a>), its wines (<a href=\"#\" onClick=\"return mV('Hsa',14,7);\">Hsa 14:7</a>), and its cool waters (<a href=\"#\" onClick=\"return mV('Jer',18,14);\">Jer 18:14</a>). The ancient inhabitants were Giblites and Hivites (<a href=\"#\" onClick=\"return mV('Jos',13,5);\">Jos 13:5</a>; <a href=\"#\" onClick=\"return mV('Jdg',3,3);\">Jdg 3:3</a>). It was part of the Phoenician kingdom (<a href=\"#\" onClick=\"return mV('1Ki',5,'2-6');\">1Ki 5:2-6</a>).<br/><br/>The eastern range, or Anti-Lebanon, or \"Lebanon towards the sunrising,\" runs nearly parallel with the western from the plain of Emesa till it connects with the hills of Galilee in the south. The height of this range is about 5,000 feet. Its highest peak is Hermon (q.v.), from which a number of lesser ranges radiate.<br/><br/>Lebanon is first mentioned in the description of the boundary of Palestine (<a href=\"#\" onClick=\"return mV('Deu',1,7);\">Deu 1:7</a>; <a href=\"#\" onClick=\"return mV('Deu',11,24);\">11:24</a>). It was assigned to Israel, but was never conquered (<a href=\"#\" onClick=\"return mV('Jos',13,'2-6');\">Jos 13:2-6</a>; <a href=\"#\" onClick=\"return mV('Jdg',3,'1-3');\">Jdg 3:1-3</a>).<br/><br/>The Lebanon range is now inhabited by a population of about 300,000 Christians, Maronites, and Druses, and is ruled by a Christian governor. The Anti-Lebanon is inhabited by Mohammedans, and is under a Turkish ruler.";
eastonArray["$$T0002261"] = "<strong>Lebbaeus:</strong> courageous, a surname of Judas (Jude), one of the twelve (<a href=\"#\" onClick=\"return mV('Mat',10,3);\">Mat 10:3</a>), called also Thaddaeus, not to be confounded with the Judas who was the brother of our Lord.";
eastonArray["$$T0002262"] = "<strong>Lebonah:</strong> frankincense, a town near Shiloh, on the north side of Bethel (<a href=\"#\" onClick=\"return mV('Jdg',21,19);\">Jdg 21:19</a>). It has been identified with el-Lubban, to the south of Nablus.";
eastonArray["$$T0002263"] = "<strong>Leek:</strong> (Heb. hatsir; the Allium porrum), rendered \"grass\" in <a href=\"#\" onClick=\"return mV('1Ki',18,5);\">1 Kings 18:5</a>; <a href=\"#\" onClick=\"return mV('2Ki',19,26);\">2Ki 19:26</a>; <a href=\"#\" onClick=\"return mV('Job',40,15);\">Job 40:15</a>, etc.; \"herb\" in <a href=\"#\" onClick=\"return mV('Job',8,12);\">Job 8:12</a>; \"hay\" in <a href=\"#\" onClick=\"return mV('Pro',27,25);\">Pro 27:25</a>, and <a href=\"#\" onClick=\"return mV('Isa',15,6);\">Isa 15:6</a>; \"leeks\" only in <a href=\"#\" onClick=\"return mV('Num',11,5);\">Num 11:5</a>. This Hebrew word seems to denote in this last passage simply herbs, such as lettuce or savoury herbs cooked as kitchen vegetables, and not necessarily what are now called leeks. The leek was a favourite vegetable in Egypt, and is still largely cultivated there and in Palestine.";
eastonArray["$$T0002264"] = "<strong>Lees:</strong> (Heb. shemarim), from a word meaning to keep or preserve. It was applied to \"lees\" from the custom of allowing wine to stand on the lees that it might thereby be better preserved (<a href=\"#\" onClick=\"return mV('Isa',25,6);\">Isa 25:6</a>). \"Men settled on their lees\" (<a href=\"#\" onClick=\"return mV('Zep',1,12);\">Zep 1:12</a>) are men \"hardened or crusted.\" The image is derived from the crust formed at the bottom of wines long left undisturbed (<a href=\"#\" onClick=\"return mV('Jer',48,11);\">Jer 48:11</a>). The effect of wealthy undisturbed ease on the ungodly is hardening. They become stupidly secure (<a href=\"#\" onClick=\"return mV('Psa',55,19);\">Psa 55:19</a>; <a href=\"#\" onClick=\"return mV('Amo',6,1);\">Amo 6:1</a>). To drink the lees (<a href=\"#\" onClick=\"return mV('Psa',75,8);\">Psa 75:8</a>) denotes severe suffering.";
eastonArray["$$T0002265"] = "<strong>Left hand:</strong> among the Hebrews, denoted the north (<a href=\"#\" onClick=\"return mV('Job',23,9);\">Job 23:9</a>; <a href=\"#\" onClick=\"return mV('Gen',14,15);\">Gen 14:15</a>), the face of the person being supposed to be toward the east.";
eastonArray["$$T0002266"] = "<strong>Left-handed:</strong> (<a href=\"#\" onClick=\"return mV('Jdg',3,15);\">Jdg 3:15</a>; <a href=\"#\" onClick=\"return mV('Jdg',20,16);\">20:16</a>), one unable to use the right hand skilfully, and who therefore uses the left; and also one who uses the left as well as the right, ambidexter. Such a condition of the hands is due to physical causes. This quality was common apparently in the tribe of Benjamin.";
eastonArray["$$T0002267"] = "<strong>Legion:</strong> a regiment of the Roman army, the number of men composing which differed at different times. It originally consisted of three thousand men, but in the time of Christ consisted of six thousand, exclusive of horsemen, who were in number a tenth of the foot-men. The word is used (<a href=\"#\" onClick=\"return mV('Mat',26,53);\">Mat 26:53</a>; <a href=\"#\" onClick=\"return mV('Mar',5,9);\">Mar 5:9</a>) to express simply a great multitude.";
eastonArray["$$T0002268"] = "<strong>Lehi:</strong> a jawbone, a place in the tribe of Judah where Samson achieved a victory over the Philistines (<a href=\"#\" onClick=\"return mV('Jdg',15,9,14,16);\">Jdg 15:9, 14, 16</a>), slaying a thousand of them with the jawbone of an ass. The words in <a href=\"#\" onClick=\"return mV('Jdg',15,19);\">Jdg 15:19</a>, \"a hollow place that was in the jaw\" (A.V.), should be, as in Revised Version, \"the hollow place that is in Lehi.\"";
eastonArray["$$T0002269"] = "<strong>Lemuel:</strong> dedicated to God, a king whom his mother instructed (<a href=\"#\" onClick=\"return mV('Pro',31,'1-9');\">Pro 31:1-9</a>). Nothing is certainly known concerning him. The rabbis identified him with Solomon.";
eastonArray["$$T0002270"] = "<strong>Lentiles:</strong> (Heb. 'adashim), a species of vetch (<a href=\"#\" onClick=\"return mV('Gen',25,34);\">Gen 25:34</a>; <a href=\"#\" onClick=\"return mV('2Sa',23,11);\">2Sa 23:11</a>), common in Syria under the name addas. The red pottage made by Jacob was of lentils (<a href=\"#\" onClick=\"return mV('Gen',25,'29-34');\">Gen 25:29-34</a>). They were among the provisions brought to David when he fled from Absalom (<a href=\"#\" onClick=\"return mV('2Sa',17,28);\">2Sa 17:28</a>). It is the <i>Ervum lens</i> of Linnaeus, a leguminous plant which produces a fruit resembling a bean.";
eastonArray["$$T0002271"] = "<strong>Leopard:</strong> (<a href=\"#\" onClick=\"return mV('Sgs',4,8);\">Sgs 4:8</a>), was that great spotted feline which anciently infested the mountains of Syria, more appropriately called a panther (<i>Felis pardus</i>). Its fierceness (<a href=\"#\" onClick=\"return mV('Isa',11,6);\">Isa 11:6</a>), its watching for its prey (<a href=\"#\" onClick=\"return mV('Jer',5,6);\">Jer 5:6</a>), its swiftness (<a href=\"#\" onClick=\"return mV('Hab',1,8);\">Hab 1:8</a>), and the spots of its skin (<a href=\"#\" onClick=\"return mV('Jer',13,23);\">Jer 13:23</a>), are noticed. This word is used symbolically (<a href=\"#\" onClick=\"return mV('Dan',7,6);\">Dan 7:6</a>; <a href=\"#\" onClick=\"return mV('Rev',13,2);\">Rev 13:2</a>).";
eastonArray["$$T0002272"] = "<strong>Leprosy:</strong> (Heb. tsara'ath, a \"smiting,\" a \"stroke,\" because the disease was regarded as a direct providential infliction). This name is from the Greek lepra, by which the Greek physicians designated the disease from its scaliness. We have the description of the disease, as well as the regulations connected with it, in <a href=\"#\" onClick=\"return mV('Lev',13,'1-');\">Lev 13</a>; <a href=\"#\" onClick=\"return mV('Lev',14,'1-');\">14</a>; <a href=\"#\" onClick=\"return mV('Num',12,'10-15');\">Num 12:10-15</a>, etc. There were reckoned six different circumstances under which it might develop itself,<br><br>(1) without any apparent cause (<a href=\"#\" onClick=\"return mV('Lev',13,'2-8');\">Lev 13:2-8</a>);<br><br>(2) its reappearance (<a href=\"#\" onClick=\"return mV('Lev',13,'9-17');\">9-17</a>);<br><br>(3) from an inflammation (<a href=\"#\" onClick=\"return mV('Lev',13,'18-28');\">18-28</a>);<br><br>(4) on the head or chin (<a href=\"#\" onClick=\"return mV('Lev',13,'29-37');\">29-37</a>);<br><br>(5) in white polished spots (<a href=\"#\" onClick=\"return mV('Lev',13,38,39);\">38-39</a>);<br><br>(6) at the back or in the front of the head (<a href=\"#\" onClick=\"return mV('Lev',13,'40-44');\">40-44</a>).<br/><br/>Lepers were required to live outside the camp or city (<a href=\"#\" onClick=\"return mV('Num',5,'1-4');\">Num 5:1-4</a>; <a href=\"#\" onClick=\"return mV('Num',12,'10-15');\">12:10-15</a>, etc.). This disease was regarded as an awful punishment from the Lord (<a href=\"#\" onClick=\"return mV('2Ki',5,7);\">2Ki 5:7</a>; <a href=\"#\" onClick=\"return mV('2Ch',26,20);\">2Ch 26:20</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002562');\">MIRIAM</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0001452');\">GEHAZI</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0003760');\">UZZIAH</a>.)<br/><br/>This disease \"begins with specks on the eyelids and on the palms, gradually spreading over the body, bleaching the hair white wherever they appear, crusting the affected parts with white scales, and causing terrible sores and swellings. From the skin the disease eats inward to the bones, rotting the whole body piecemeal.\" \"In Christ's day no leper could live in a walled town, though he might in an open village. But wherever he was he was required to have his outer garment rent as a sign of deep grief, to go bareheaded, and to cover his beard with his mantle, as if in lamentation at his own virtual death. He had further to warn passers-by to keep away from him, by calling out, 'Unclean! unclean!' nor could he speak to any one, or receive or return a salutation, since in the East this involves an embrace.\"<br/><br/>That the disease was not contagious is evident from the regulations regarding it (<a href=\"#\" onClick=\"return mV('Lev',13,12,13,36);\">Lev 13:12-13, 36</a>; <a href=\"#\" onClick=\"return mV('2Ki',5,1);\">2Ki 5:1</a>). Leprosy was \"the outward and visible sign of the innermost spiritual corruption; a meet emblem in its small beginnings, its gradual spread, its internal disfigurement, its dissolution little by little of the whole body, of that which corrupts, degrades, and defiles man's inner nature, and renders him unmeet to enter the presence of a pure and holy God\" (Maclear's Handbook O.T). Our Lord cured lepers (<a href=\"#\" onClick=\"return mV('Mat',8,2,3);\">Mat 8:2-3</a>; <a href=\"#\" onClick=\"return mV('Mar',1,'40-42');\">Mar 1:40-42</a>). This divine power so manifested illustrates his gracious dealings with men in curing the leprosy of the soul, the fatal taint of sin.";
eastonArray["$$T0002273"] = "<strong>Letter:</strong> in (<a href=\"#\" onClick=\"return mV('Rom',2,27,29);\">Rom 2:27, 29</a>) means the outward form. The \"oldness of the letter\" (<a href=\"#\" onClick=\"return mV('Rom',7,6);\">Rom 7:6</a>) is a phrase which denotes the old way of literal outward obedience to the law as a system of mere external rules of conduct. In <a href=\"#\" onClick=\"return mV('2Cr',3,6);\">2Cr 3:6</a>, \"the letter\" means the Mosaic law as a written law. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003841');\">WRITING</a>.)";
eastonArray["$$T0002274"] = "<strong>Leummim:</strong> peoples; nations, the last mentioned of the three sons of Dedan, and head of an Arabian tribe (<a href=\"#\" onClick=\"return mV('Gen',25,3);\">Gen 25:3</a>).";
eastonArray["$$T0002275"] = "<strong>Levi:</strong> adhesion.<br><br>(1.) The third son of Jacob by Leah. The origin of the name is found in Leah's words (<a href=\"#\" onClick=\"return mV('Gen',29,34);\">Gen 29:34</a>), \"This time will my husband be joined [Heb. yillaveh] unto me.\" He is mentioned as taking a prominent part in avenging his sister Dinah (<a href=\"#\" onClick=\"return mV('Gen',34,'25-31');\">Gen 34:25-31</a>). He and his three sons went down with Jacob (<a href=\"#\" onClick=\"return mV('Gen',46,11);\">46:11</a>) into Egypt, where he died at the age of one hundred and thirty-seven years (<a href=\"#\" onClick=\"return mV('Exd',6,16);\">Exd 6:16</a>).<br/><br/>(2.) The father of Matthat, and son of Simeon, of the ancestors of Christ (<a href=\"#\" onClick=\"return mV('Luk',3,29);\">Luk 3:29</a>).<br/><br/>(3.) <a href=\"#\" onClick=\"return mV('Luk',3,24);\">Luk 3:24</a>.<br/><br/>(4.) One of the apostles, the son of Alphaeus (<a href=\"#\" onClick=\"return mV('Mar',2,14);\">Mar 2:14</a>; <a href=\"#\" onClick=\"return mV('Luk',5,27,29);\">Luk 5:27, 29</a>), called also Matthew (<a href=\"#\" onClick=\"return mV('Mat',9,9);\">Mat 9:9</a>).";
eastonArray["$$T0002276"] = "<strong>Leviathan:</strong> a transliterated Hebrew word (livyathan), meaning \"twisted,\" \"coiled.\" In <a href=\"#\" onClick=\"return mV('Job',3,8);\">Job 3:8</a>, Revised Version, and marg. of Authorized Version, it denotes the dragon which, according to Eastern tradition, is an enemy of light; in <a href=\"#\" onClick=\"return mV('Job',41,1);\">Job 41:1</a> the crocodile is meant; in <a href=\"#\" onClick=\"return mV('Psa',104,26);\">Psa 104:26</a> it \"denotes any large animal that moves by writhing or wriggling the body, the whale, the monsters of the deep.\" This word is also used figuratively for a cruel enemy, as some think \"the Egyptian host, crushed by the divine power, and cast on the shores of the Red Sea\" (<a href=\"#\" onClick=\"return mV('Psa',74,14);\">Psa 74:14</a>). As used in <a href=\"#\" onClick=\"return mV('Isa',27,1);\">Isa 27:1</a>, \"leviathan the piercing [R.V. 'swift'] serpent, even leviathan that crooked [R.V. marg. 'winding'] serpent,\" the word may probably denote the two empires, the Assyrian and the Babylonian.";
eastonArray["$$T0002277"] = "<strong>Levirate Law:</strong> from Latin levir, \"a husband's brother,\" the name of an ancient custom ordained by Moses, by which, when an Israelite died without issue, his surviving brother was required to marry the widow, so as to continue his brother's family through the son that might be born of that marriage (<a href=\"#\" onClick=\"return mV('Gen',38,8);\">Gen 38:8</a>; <a href=\"#\" onClick=\"return mV('Deu',25,'5-10');\">Deu 25:5-10</a>; comp. <a href=\"#\" onClick=\"return mV('Rth',3,'1-');\">Ruth 3</a>; <a href=\"#\" onClick=\"return mV('Deu',4,10);\">4:10</a>). Its object was \"to raise up seed to the departed brother.\"";
eastonArray["$$T0002278"] = "<strong>Levite:</strong> a descendant of the tribe of Levi (<a href=\"#\" onClick=\"return mV('Exd',6,25);\">Exd 6:25</a>; <a href=\"#\" onClick=\"return mV('Lev',25,32);\">Lev 25:32</a>; <a href=\"#\" onClick=\"return mV('Num',35,2);\">Num 35:2</a>; <a href=\"#\" onClick=\"return mV('Jos',21,3,41);\">Jos 21:3, 41</a>). This name is, however, generally used as the title of that portion of the tribe which was set apart for the subordinate offices of the sanctuary service (<a href=\"#\" onClick=\"return mV('1Ki',8,4);\">1Ki 8:4</a>; <a href=\"#\" onClick=\"return mV('Ezr',2,70);\">Ezr 2:70</a>), as assistants to the priests.<br/><br/>When the Israelites left Egypt, the ancient manner of worship was still observed by them, the eldest son of each house inheriting the priest's office. At Sinai the first change in this ancient practice was made. A hereditary priesthood in the family of Aaron was then instituted (<a href=\"#\" onClick=\"return mV('Exd',28,1);\">Exd 28:1</a>). But it was not till that terrible scene in connection with the sin of the golden calf that the tribe of Levi stood apart and began to occupy a distinct position (<a href=\"#\" onClick=\"return mV('Exd',32,'1-')\">Exd 32</a>). The religious primogeniture was then conferred on this tribe, which henceforth was devoted to the service of the sanctuary (<a href=\"#\" onClick=\"return mV('Num',3,'11-13');\">Num 3:11-13</a>). They were selected for this purpose because of their zeal for the glory of God (<a href=\"#\" onClick=\"return mV('Exd',32,26);\">Exd 32:26</a>), and because, as the tribe to which Moses and Aaron belonged, they would naturally stand by the lawgiver in his work.<br/><br/>The Levitical order consisted of all the descendants of Levi's three sons, Gershon, Kohath, and Merari; whilst Aaron, Amram's son (Amram, son of Kohat), and his issue constituted the priestly order.<br/><br/>The age and qualification for Levitical service are specified in <a href=\"#\" onClick=\"return mV('Num',4,3,23,30,39,43,47);\">Num 4:3, 23, 30, 39, 43, 47</a>.<br/><br/>They were not included among the armies of Israel (<a href=\"#\" onClick=\"return mV('Num',1,47);\">Num 1:47</a>; <a href=\"#\" onClick=\"return mV('Num',2,33);\">2:33</a>; <a href=\"#\" onClick=\"return mV('Num',26,62);\">26:62</a>), but were reckoned by themselves. They were the special guardians of the tabernacle (<a href=\"#\" onClick=\"return mV('Num',1,51);\">Num 1:51</a>; <a href=\"#\" onClick=\"return mV('Num',18,'22-24');\">18:22-24</a>). The Gershonites pitched their tents on the west of the tabernacle (<a href=\"#\" onClick=\"return mV('Num',3,23);\">3:23</a>), the Kohathites on the south (<a href=\"#\" onClick=\"return mV('Num',3,29);\">3:29</a>), the Merarites on the north (<a href=\"#\" onClick=\"return mV('Num',3,35);\">3:35</a>), and the priests on the east (<a href=\"#\" onClick=\"return mV('Num',3,38);\">3:38</a>). It was their duty to move the tent and carry the parts of the sacred structure from place to place. They were given to Aaron and his sons the priests to wait upon them and do work for them at the sanctuary services (<a href=\"#\" onClick=\"return mV('Num',8,19);\">Num 8:19</a>; <a href=\"#\" onClick=\"return mV('Num',18,'2-6');\">18:2-6</a>).<br/><br/>As being wholly consecrated to the service of the Lord, they had no territorial possessions. Jehovah was their inheritance (<a href=\"#\" onClick=\"return mV('Num',18,20);\">Num 18:20</a>; <a href=\"#\" onClick=\"return mV('Num',26,62);\">26:62</a>; <a href=\"#\" onClick=\"return mV('Deu',10,9);\">Deu 10:9</a>; <a href=\"#\" onClick=\"return mV('Deu',18,1,2);\">18:1-2</a>), and for their support it was ordained that they should receive from the other tribes the tithes of the produce of the land. Forty-eight cities also were assigned to them, thirteen of which were for the priests \"to dwell in\", i.e., along with their other inhabitants. Along with their dwellings they had \"suburbs\", i.e., \"commons\", for their herds and flocks, and also fields and vineyards (<a href=\"#\" onClick=\"return mV('Num',35,'2-5');\">Num 35:2-5</a>). Nine of these cities were in Judah, three in Naphtali, and four in each of the other tribes (<a href=\"#\" onClick=\"return mV('Jos',21,'1-')\">Jos 21</a>). Six of the Levitical cities were set apart as \"cities of refuge\" (q.v.). Thus the Levites were scattered among the tribes to keep alive among them the knowledge and service of God. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003001');\">PRIEST</a>.)";
eastonArray["$$T0002279"] = "<strong>Leviticus:</strong> the third book of the Pentateuch; so called in the Vulgate, after the LXX., because it treats chiefly of the Levitical service.<br/><br/>In the first section of the book (1-17), which exhibits the worship itself, there is,<br><br>(1.) A series of laws (<a href=\"#\" onClick=\"return mV('Lev',1,'1-')\">1-7</a>) regarding sacrifices, burnt-offerings, meat-offerings, and thank-offerings (<a href=\"#\" onClick=\"return mV('Lev',1,'1-')\">Lev 1-3), sin-offerings and trespass-offerings (<a href=\"#\" onClick=\"return doDictLookup('ET0003001');\">T0003001</a>.) <a href=\"#\" onClick=\"return mV('Lev',4,'1-')\">Lev 4</a>; <a href=\"#\" onClick=\"return mV('Lev',5,'1-')\">Lev 5</a>), followed by the law of the priestly duties in connection with the offering of sacrifices (<a href=\"#\" onClick=\"return mV('Lev',6,'1-')\">Lev 6</a>; <a href=\"#\" onClick=\"return mV('Lev',7,'1-')\">Lev 7</a>).<br><br>(2.) An historical section (<a href=\"#\" onClick=\"return mV('Lev',8,'1-')\">Lev 8-10</a>), giving an account of the consecration of Aaron and his sons (<a href=\"#\" onClick=\"return mV('Lev',8,1)\">Lev 8</a>); Aaron's first offering for himself and the people (<a href=\"#\" onClick=\"return mV('Lev',9,'1-')\">Lev 9</a>); Nadab and Abihu's presumption in offering \"strange fire before Jehovah,\" and their punishment (<a href=\"#\" onClick=\"return mV('Lev',10,'1-')\">Lev 10</a>).<br><br>(3.) Laws concerning purity, and the sacrifices and ordinances for putting away impurity (<a href=\"#\" onClick=\"return mV('Lev',11,'1-')\">Lev 11-16</a>). An interesting fact may be noted here. Canon Tristram, speaking of the remarkable discoveries regarding the flora and fauna of the Holy Land by the Palestine Exploration officers, makes the following statement:, \"Take these two catalogues of the clean and unclean animals in the books of <a href=\"#\" onClick=\"return mV('Lev',11,'1-')\">Leviticus [11]</a> and <a href=\"#\" onClick=\"return mV('Deu',14,'1-')\">Deuteronomy [14]</a>. There are eleven in Deuteronomy which do not occur in Leviticus, and these are nearly all animals and birds which are not found in Egypt or the Holy Land, but which are numerous in the Arabian desert. They are not named in Leviticus a few weeks after the departure from Egypt; but after the people were thirty-nine years in the desert they are named, a strong proof that the list in Deuteronomy was written at the end of the journey, and the list in Leviticus at the beginning. It fixes the writing of that catalogue to one time and period only, viz., that when the children of Israel were familiar with the fauna and the flora of the desert\" (Palest. Expl. Quart., Jan. 1887).<br><br>(4.) Laws marking the separation between Israel and the heathen (<a href=\"#\" onClick=\"return mV('Lev',17,'1-')\">Lev 17-20</a>).<br><br>(5.) Laws about the personal purity of the priests, and their eating of the holy things (<a href=\"#\" onClick=\"return mV('Lev',20,'1-')\">Lev 20</a>; <a href=\"#\" onClick=\"return mV('Lev',21,'1-')\">Lev 21</a>); about the offerings of Israel, that they were to be without blemish (<a href=\"#\" onClick=\"return mV('Lev',22,'17-33');\">Lev 22:17-33</a>); and about the due celebration of the great festivals (<a href=\"#\" onClick=\"return mV('Lev',23,'1-')\">Lev 23</a>; <a href=\"#\" onClick=\"return mV('Lev',25,'1-')\">Lev 25</a>).<br><br>(6.) Then follow promises and warnings to the people regarding obedience to these commandments, closing with a section on vows.<br/><br/>The various ordinances contained in this book were all delivered in the space of a month (<a href=\"#\" onClick=\"return mV('Exd',40,17);\">Exd 40:17</a>; <a href=\"#\" onClick=\"return mV('Num',1,1);\">Num 1:1</a>), the first month of the second year after the Exodus. It is the third book of Moses.<br/><br/>No book contains more of the very words of God. He is almost throughout the whole of it the direct speaker. This book is a prophecy of things to come, a shadow whereof the substance is Christ and his kingdom. The principles on which it is to be interpreted are laid down in the Epistle to the Hebrews. It contains in its complicated ceremonial the gospel of the grace of God.";
eastonArray["$$T0002280"] = "<strong>Levy:</strong> (<a href=\"#\" onClick=\"return mV('1Ki',4,6);\">1Ki 4:6</a>, R.V.; <a href=\"#\" onClick=\"return mV('1Ki',5,13);\">5:13</a>), forced service. The service of tributaries was often thus exacted by kings. Solomon raised a \"great levy\" of 30,000 men, about two per cent. of the population, to work for him by courses on Lebanon. Adoram (<a href=\"#\" onClick=\"return mV('1Ki',12,18);\">12:18</a>) presided over this forced labour service (Ger. Frohndienst; Fr. corvee).";
eastonArray["$$T0002281"] = "<strong>Lewdness:</strong> (<a href=\"#\" onClick=\"return mV('Act',18,14);\">Act 18:14</a>), villany or wickedness, not lewdness in the modern sense of the word. The word \"lewd\" is from the Saxon, and means properly \"ignorant,\" \"unlearned,\" and hence low, vicious (<a href=\"#\" onClick=\"return mV('Act',17,5);\">Act 17:5</a>).";
eastonArray["$$T0002282"] = "<strong>Libertine:</strong> found only <a href=\"#\" onClick=\"return mV('Act',6,9);\">Act 6:9</a>, one who once had been a slave, but who had been set at liberty, or the child of such a person. In this case the name probably denotes those descendants of Jews who had been carried captives to Rome as prisoners of war by Pompey and other Roman generals in the Syrian wars, and had afterwards been liberated. In A.D. 19 these manumitted Jews were banished from Rome. Many of them found their way to Jerusalem, and there established a synagogue.";
eastonArray["$$T0002283"] = "<strong>Libnah:</strong> transparency; whiteness.<br><br>(1.) One of the stations of the Israelites in the wilderness (<a href=\"#\" onClick=\"return mV('Num',33,20,21);\">Num 33:20-21</a>).<br/><br/>(2.) One of the royal cities of the Canaanites taken by Joshua (<a href=\"#\" onClick=\"return mV('Jos',10,'29-32');\">Jos 10:29-32</a>; <a href=\"#\" onClick=\"return mV('Jos',12,15);\">12:15</a>). It became one of the Levitical towns in the tribe of Judah (<a href=\"#\" onClick=\"return mV('Jos',21,13);\">21:13</a>), and was strongly fortified. Sennacherib laid siege to it (<a href=\"#\" onClick=\"return mV('2Ki',19,8);\">2Ki 19:8</a>; <a href=\"#\" onClick=\"return mV('Isa',37,8);\">Isa 37:8</a>). It was the native place of Hamutal, the queen of Josiah (<a href=\"#\" onClick=\"return mV('2Ki',23,31);\">2Ki 23:31</a>). It stood near Lachish, and has been identified with the modern Arak el-Menshiyeh.";
eastonArray["$$T0002284"] = "<strong>Libni:</strong> white, one of the two sons of Gershon, the son of Levi (<a href=\"#\" onClick=\"return mV('Exd',6,17);\">Exd 6:17</a>; <a href=\"#\" onClick=\"return mV('Num',3,18,21);\">Num 3:18, 21</a>).";
eastonArray["$$T0002285"] = "<strong>Libya:</strong> the country of the Ludim (<a href=\"#\" onClick=\"return mV('Gen',10,13);\">Gen 10:13</a>), Northern Africa, a large tract lying along the Mediterranean, to the west of Egypt (<a href=\"#\" onClick=\"return mV('Act',2,10);\">Act 2:10</a>). Cyrene was one of its five cities.";
eastonArray["$$T0002286"] = "<strong>Lice:</strong> (Heb. kinnim), the creatures employed in the third plague sent upon Egypt (<a href=\"#\" onClick=\"return mV('Exd',8,'16-18');\">Exd 8:16-18</a>). They were miraculously produced from the dust of the land. \"The entomologists Kirby and Spence place these minute but disgusting insects in the very front rank of those which inflict injury upon man. A terrible list of examples they have collected of the ravages of this and closely allied parasitic pests.\" The plague of lice is referred to in <a href=\"#\" onClick=\"return mV('Psa',105,31);\">Psa 105:31</a>.<br/><br/>Some have supposed that the word denotes not lice properly, but gnats. Others, with greater probability, take it to mean the \"tick\" which is much larger than lice.";
eastonArray["$$T0002287"] = "<strong>Lie:</strong> an intentional violation of the truth. Lies are emphatically condemned in Scripture (<a href=\"#\" onClick=\"return mV('Jhn',8,44);\">Jhn 8:44</a>; <a href=\"#\" onClick=\"return mV('1Ti',1,9,10);\">1Ti 1:9-10</a>; <a href=\"#\" onClick=\"return mV('Rev',21,27);\">Rev 21:27</a>; <a href=\"#\" onClick=\"return mV('Rev',22,15);\">22:15</a>). Mention is made of the lies told by good men, as by Abraham (<a href=\"#\" onClick=\"return mV('Gen',12,12,13);\">Gen 12:12-13</a>; <a href=\"#\" onClick=\"return mV('Gen',20,2);\">20:2</a>), Isaac (<a href=\"#\" onClick=\"return mV('Gen',26,7);\">26:7</a>), and Jacob (<a href=\"#\" onClick=\"return mV('Gen',27,24);\">27:24</a>); also by the Hebrew midwives (<a href=\"#\" onClick=\"return mV('Exd',1,'15-19');\">Exd 1:15-19</a>), by Michal (<a href=\"#\" onClick=\"return mV('1Sa',19,14);\">1Sa 19:14</a>), and by David (<a href=\"#\" onClick=\"return mV('1Sa',20,6);\">1Sa 20:6</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000230');\">ANANIAS</a>.)";
eastonArray["$$T0002288"] = "<strong>Lieutenant:</strong> (<a href=\"#\" onClick=\"return mV('Est',3,12);\">Est 3:12</a>; <a href=\"#\" onClick=\"return mV('Est',8,9);\">8:9</a>; <a href=\"#\" onClick=\"return mV('Est',9,3);\">9:3</a>; <a href=\"#\" onClick=\"return mV('Ezr',8,36);\">Ezr 8:36</a>), a governor or viceroy of a Persian province having both military and civil power. Correctly rendered in the Revised Version \"satrap.\"";
eastonArray["$$T0002289"] = "<strong>Life:</strong> generally of physical life (<a href=\"#\" onClick=\"return mV('Gen',2,7);\">Gen 2:7</a>; <a href=\"#\" onClick=\"return mV('Luk',16,25);\">Luk 16:25</a>, etc.); also used figuratively<br><br>(1) for immortality (<a href=\"#\" onClick=\"return mV('Hbr',7,16);\">Hbr 7:16</a>);<br><br>(2) conduct or manner of life (<a href=\"#\" onClick=\"return mV('Rom',6,4);\">Rom 6:4</a>);<br><br>(3) spiritual life or salvation (<a href=\"#\" onClick=\"return mV('Jhn',3,'16-18',36);\">Jhn 3:16-18, 36</a>);<br><br>(4) eternal life (<a href=\"#\" onClick=\"return mV('Mat',19,16,17);\">Mat 19:16-17</a>; <a href=\"#\" onClick=\"return mV('Jhn',3,15);\">Jhn 3:15</a>); of God and Christ as the absolute source and cause of all life (<a href=\"#\" onClick=\"return mV('Jhn',1,4);\">Jhn 1:4</a>; <a href=\"#\" onClick=\"return mV('Jhn',5,26,39);\">5:26, 39</a>
; <a href=\"#\" onClick=\"return mV('Jhn',11,25);\">11:25</a>; <a href=\"#\" onClick=\"return mV('Jhn',12,50);\">12:50</a>).";
eastonArray["$$T0002290"] = "<strong>Light:</strong> the offspring of the divine command (<a href=\"#\" onClick=\"return mV('Gen',1,3);\">Gen 1:3</a>). \"All the more joyous emotions of the mind, all the pleasing sensations of the frame, all the happy hours of domestic intercourse were habitually described among the Hebrews under imagery derived from light\" (<a href=\"#\" onClick=\"return mV('1Ki',11,36);\">1Ki 11:36</a>; <a href=\"#\" onClick=\"return mV('Isa',58,8);\">Isa 58:8</a>; <a href=\"#\" onClick=\"return mV('Est',8,16);\">Est 8:16</a>; <a href=\"#\" onClick=\"return mV('Psa',97,11);\">Psa 97:11</a>). Light came also naturally to typify true religion and the felicity it imparts (<a href=\"#\" onClick=\"return mV('Psa',119,105);\">Psa 119:105</a>; <a href=\"#\" onClick=\"return mV('Isa',8,20);\">Isa 8:20</a>; <a href=\"#\" onClick=\"return mV('Mat',4,16);\">Mat 4:16</a>, etc.), and the glorious inheritance of the redeemed (<a href=\"#\" onClick=\"return mV('Col',1,12);\">Col 1:12</a>; <a href=\"#\" onClick=\"return mV('Rev',21,'23-25');\">Rev 21:23-25</a>). God is said to dwell in light inaccessible (<a href=\"#\" onClick=\"return mV('1Ti',6,16);\">1Ti 6:16</a>). It frequently signifies instruction (<a href=\"#\" onClick=\"return mV('Mat',5,16);\">Mat 5:16</a>; <a href=\"#\" onClick=\"return mV('Jhn',5,35);\">Jhn 5:35</a>). In its highest sense it is applied to Christ as the \"Sun of righteousness\" (<a href=\"#\" onClick=\"return mV('Mal',4,2);\">Mal 4:2</a>; <a href=\"#\" onClick=\"return mV('Luk',2,32);\">Luk 2:32</a>; <a href=\"#\" onClick=\"return mV('Jhn',1,'7-9');\">Jhn 1:7-9</a>). God is styled \"the Father of lights\" (<a href=\"#\" onClick=\"return mV('Jam',1,17);\">Jam 1:17</a>). It is used of angels (<a href=\"#\" onClick=\"return mV('2Cr',11,14);\">2Cr 11:14</a>), and of John the Baptist, who was a \"burning and a shining light\" (<a href=\"#\" onClick=\"return mV('Jhn',5,35);\">Jhn 5:35</a>), and of all true disciples, who are styled \"the light of the world\" (<a href=\"#\" onClick=\"return mV('Mat',5,14);\">Mat 5:14</a>).";
eastonArray["$$T0002291"] = "<strong>Lightning:</strong> frequently referred to by the sacred writers (<a href=\"#\" onClick=\"return mV('Nah',1,'3-6');\">Nah 1:3-6</a>). Thunder and lightning are spoken of as tokens of God's wrath (<a href=\"#\" onClick=\"return mV('2Sa',22,15);\">2Sa 22:15</a>; <a href=\"#\" onClick=\"return mV('Job',28,26);\">Job 28:26</a>; <a href=\"#\" onClick=\"return mV('Job',37,4);\">37:4</a>; <a href=\"#\" onClick=\"return mV('Psa',135,7);\">Psa 135:7</a>; <a href=\"#\" onClick=\"return mV('Psa',144,6);\">144:6</a>; <a href=\"#\" onClick=\"return mV('Zec',9,14);\">Zec 9:14</a>). They represent God's glorious and awful majesty (<a href=\"#\" onClick=\"return mV('Rev',4,5);\">Rev 4:5</a>), or some judgment of God on the world (<a href=\"#\" onClick=\"return mV('Rev',20,9);\">20:9</a>).";
eastonArray["$$T0002292"] = "<strong>Lign-aloes:</strong> (only in pl., Heb. 'ahalim), a perfume derived from some Oriental tree (<a href=\"#\" onClick=\"return mV('Num',24,6);\">Num 24:6</a>), probably the agallochum or aloe-wood. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000183');\">ALOES</a>).";
eastonArray["$$T0002293"] = "<strong>Ligure:</strong> (Heb. leshem) occurs only in <a href=\"#\" onClick=\"return mV('Exd',28,19);\">Exd 28:19</a> and <a href=\"#\" onClick=\"return mV('Exd',39,12);\">Exd 39:12</a>, as the name of a stone in the third row on the high priest's breastplate. Some have supposed that this stone was the same as the jacinth (q.v.), others that it was the opal. There is now no mineral bearing this name. The \"ligurite\" is so named from Liguria in Italy, where it was found.";
eastonArray["$$T0002294"] = "<strong>Lily:</strong> The Hebrew name shushan or shoshan, i.e., \"whiteness\", was used as the general name of several plants common to Syria, such as the tulip, iris, anemone, gladiolus, ranunculus, etc. Some interpret it, with much probability, as denoting in the Old Testament the water-lily (<i>Nymphoea lotus</i> of Linn.), or lotus (<a href=\"#\" onClick=\"return mV('Sgs',2,1,2);\">Sgs 2:1-2</a>; <a href=\"#\" onClick=\"return mV('Sgs',2,16);\">2:16</a>; <a href=\"#\" onClick=\"return mV('Sgs',4,5);\">4:5</a>; <a href=\"#\" onClick=\"return mV('Sgs',5,13);\">5:13</a>; <a href=\"#\" onClick=\"return mV('Sgs',6,2,3);\">6:2-3</a>; <a href=\"#\" onClick=\"return mV('Sgs',7,2);\">7:2</a>). \"Its flowers are large, and they are of a white colour, with streaks of pink. They supplied models for the ornaments of the pillars and the molten sea\" (<a href=\"#\" onClick=\"return mV('1Ki',7,19,22,26);\">1Ki 7:19, 22, 26</a>; <a href=\"#\" onClick=\"return mV('2Ch',4,5);\">2Ch 4:5</a>). In the Canticles its beauty and fragrance shadow forth the preciousness of Christ to the Church. Groser, however (Scrip. Nat. Hist.), strongly argues that the word, both in the Old and New Testaments, denotes liliaceous plants in general, or if one genus is to be selected, that it must be the genus Iris, which is \"large, vigorous, elegant in form, and gorgeous in colouring.\"<br/><br/>The lilies (Gr. krinia) spoken of in the New Testament (<a href=\"#\" onClick=\"return mV('Mat',6,28);\">Mat 6:28</a>; <a href=\"#\" onClick=\"return mV('Luk',12,27);\">Luk 12:27</a>) were probably the scarlet martagon (<i>Lilium Chalcedonicum</i>) or \"red Turk's-cap lily\", which \"comes into flower at the season of the year when our Lord's sermon on the mount is supposed to have been delivered. It is abundant in the district of Galilee; and its fine scarlet flowers render it a very conspicous and showy object, which would naturally attract the attention of the hearers\" (Balfour's Plants of the Bible).<br/><br/>Of the true \"floral glories of Palestine\" the pheasant's eye (<i>Adonis Palestina</i>), the ranunuculus (<i>R. Asiaticus</i>), and the anemone (<i>A coronaria</i>), the last named is however, with the greatest probability regarded as the \"lily of the field\" to which our Lord refers. \"Certainly,\" says Tristram (Nat. Hist. of the Bible), \"if, in the wondrous richness of bloom which characterizes the land of Israel in spring, any one plant can claim pre-eminence, it is the anemone, the most natural flower for our Lord to pluck and seize upon as an illustration, whether walking in the fields or sitting on the hill-side.\" \"The white water-lily (<i>Nymphcea alba</i>) and the yellow water-lily (<i>Nuphar lutea</i>) are both abundant in the marshes of the Upper Jordan, but have no connection with the lily of Scripture.\"";
eastonArray["$$T0002295"] = "<strong>Lime:</strong> The Hebrew word so rendered means \"boiling\" or \"effervescing.\" From <a href=\"#\" onClick=\"return mV('Isa',33,12);\">Isa 33:12</a> it appears that lime was made in a kiln lighted by thorn-bushes. In <a href=\"#\" onClick=\"return mV('Amo',2,1);\">Amo 2:1</a> it is recorded that the king of Moab \"burned the bones of the king of Edom into lime.\" The same Hebrew word is used in <a href=\"#\" onClick=\"return mV('Deu',27,'2-4');\">Deu 27:2-4</a>, and is there rendered \"plaster.\" Limestone is the chief constituent of the mountains of Syria.";
eastonArray["$$T0002296"] = "<strong>Linen:</strong><br><br>(1.) Heb., pishet, pishtah, denotes \"flax,\" of which linen is made (<a href=\"#\" onClick=\"return mV('Isa',19,9);\">Isa 19:9</a>); wrought flax, i.e., \"linen cloth\", <a href=\"#\" onClick=\"return mV('Lev',13,47,48,52,59);\">Lev 13:47, 48, 52, 59</a>; <a href=\"#\" onClick=\"return mV('Deu',22,11);\">Deu 22:11</a>.<br/><br/>Flax was early cultivated in Egypt (<a href=\"#\" onClick=\"return mV('Exd',9,31);\">Exd 9:31</a>), and also in Palestine (<a href=\"#\" onClick=\"return mV('Jos',2,6);\">Jos 2:6</a>; <a href=\"#\" onClick=\"return mV('Hsa',2,9);\">Hsa 2:9</a>). Various articles were made of it: garments (<a href=\"#\" onClick=\"return mV('2Sa',6,14);\">2Sa 6:14</a>), girdles (<a href=\"#\" onClick=\"return mV('Jer',13,1);\">Jer 13:1</a>), ropes and thread (<a href=\"#\" onClick=\"return mV('Eze',40,3);\">Eze 40:3</a>), napkins (<a href=\"#\" onClick=\"return mV('Luk',24,12);\">Luk 24:12</a>; <a href=\"#\" onClick=\"return mV('Jhn',20,7);\">Jhn 20:7</a>), turbans (<a href=\"#\" onClick=\"return mV('Eze',44,18);\">Eze 44:18</a>), and lamp-wicks (<a href=\"#\" onClick=\"return mV('Isa',42,3);\">Isa 42:3</a>).<br/><br/>(2.) Heb. buts, \"whiteness;\" rendered \"fine linen\" in <a href=\"#\" onClick=\"return mV('1Ch',4,21);\">1Ch 4:21</a>; <a href=\"#\" onClick=\"return mV('1Ch',15,27);\">15:27</a>; <a href=\"#\" onClick=\"return mV('2Ch',2,14);\">2Ch 2:14</a>; <a href=\"#\" onClick=\"return mV('2Ch',3,14);\">3:14</a>; <a href=\"#\" onClick=\"return mV('Est',1,6);\">Est 1:6</a>; <a href=\"#\" onClick=\"return mV('Est',8,15);\">8:15</a>, and \"white linen\" <a href=\"#\" onClick=\"return mV('2Ch',5,12);\">2Ch 5:12</a>. It is not certain whether this word means cotton or linen.<br/><br/>(3.) Heb. bad; rendered \"linen\" <a href=\"#\" onClick=\"return mV('Exd',28,42);\">Exd 28:42</a>; <a href=\"#\" onClick=\"return mV('Exd',39,28);\">39:28</a>; <a href=\"#\" onClick=\"return mV('Lev',6,10);\">Lev 6:10</a>; <a href=\"#\" onClick=\"return mV('Lev',16,4,23,32);\">16:4, 23, 32</a>; <a href=\"#\" onClick=\"return mV('1Sa',2,18);\">1Sa 2:18</a>; <a href=\"#\" onClick=\"return mV('2Sa',6,14);\">2Sa 6:14</a>, etc. It is uniformly used of the sacred vestments worn by the priests. The word is from a root signifying \"separation.\"<br/><br/>(4.) Heb. shesh; rendered \"fine linen\" <a href=\"#\" onClick=\"return mV('Exd',25,4);\">Exd 25:4</a>; <a href=\"#\" onClick=\"return mV('Exd',26,1,31,36);\">26:1, 31, 36</a>, etc. In <a href=\"#\" onClick=\"return mV('Pro',31,22);\">Pro 31:22</a> it is rendered in Authorized Version \"silk,\" and in Revised Version \"fine linen.\" The word denotes Egyptian linen of peculiar whiteness and fineness (byssus). The finest Indian linen, the finest now made, has in an inch one hundred threads of warp and eighty-four of woof; while the Egyptian had sometimes one hundred and forty in the warp and sixty-four in the woof. This was the usual dress of the Egyptian priest. Pharaoh arrayed Joseph in a dress of linen (<a href=\"#\" onClick=\"return mV('Gen',41,42);\">Gen 41:42</a>).<br/><br/>(5.) Heb. 'etun. <a href=\"#\" onClick=\"return mV('Pro',7,16);\">Pro 7:16</a>, \"fine linen of Egypt;\" in Revised Version, \"the yarn of Egypt.\"<br/><br/>(6.) Heb. sadin. <a href=\"#\" onClick=\"return mV('Pro',31,24);\">Pro 31:24</a>, \"fine linen;\" in Revised Version, \"linen garments\" (<a href=\"#\" onClick=\"return mV('Jdg',14,12,13);\">Jdg 14:12-13</a>; <a href=\"#\" onClick=\"return mV('Isa',3,23);\">Isa 3:23</a>). From this Hebrew word is probably derived the Greek word sindon, rendered \"linen\" in <a href=\"#\" onClick=\"return mV('Mar',14,51,52);\">Mar 14:51-52</a>; <a href=\"#\" onClick=\"return mV('Mar',15,46,52);\">15:46; <a href=\"#\" onClick=\"return mV('Mat',27,59);\">Mat 27:59</a>.<br/><br/>The word \"linen\" is used as an emblem of moral purity (<a href=\"#\" onClick=\"return mV('Rev',15,6);\">Rev 15:6</a>). In <a href=\"#\" onClick=\"return mV('Luk',16,19);\">Luk 16:19</a> it is mentioned as a mark of luxury.";
eastonArray["$$T0002297"] = "<strong>Linen-yarn:</strong> (See <a href=\"#\" onClick=\"return doDictLookup('ET0003842');\">YARN</a>.)";
eastonArray["$$T0002298"] = "<strong>Lines:</strong> were used for measuring and dividing land; and hence the word came to denote a portion or inheritance measured out; a possession (<a href=\"#\" onClick=\"return mV('Psa',16,6);\">Psa 16:6</a>).";
eastonArray["$$T0002299"] = "<strong>Lintel:</strong><br><br>(1.) Heb. mashkoph, a projecting cover (<a href=\"#\" onClick=\"return mV('Exd',12,22,23);\">Exd 12:22-23</a>; ver. <a href=\"#\" onClick=\"return mV('Exd',12,7);\">7</a>, \"upper door post,\" but R.V. \"lintel\"); the head-piece of a door, which the Israelites were commanded to mark with the blood of the paschal lamb.<br/><br/>(2.) Heb. kaphtar. <a href=\"#\" onClick=\"return mV('Amo',9,1);\">Amo 9:1</a>; <a href=\"#\" onClick=\"return mV('Zep',2,14);\">Zep 2:14</a> (R.V. correctly \"chapiters,\" as in A.V. marg.).";
