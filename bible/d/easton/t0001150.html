<script>
var eastonArray = new Array ();
eastonArray["$$T0001150"] = "<strong>Elect lady:</strong> to whom the Second Epistle of John is addressed (<a href=\"#\" onClick=\"return mV('2Jo',1,1);\">2Jo 1:1</a>). Some think that the word rendered \"lady\" is a proper name, and thus that the expression should be \"elect Kyria.\"";
eastonArray["$$T0001151"] = "<strong>El-elohe-Isreal:</strong> mighty one; God of Israel, the name which Jacob gave to the alter which he erected on the piece of land where he pitched his tent before Shechem, and which he afterwards purchased from the sons of Hamor (<a href=\"#\" onClick=\"return mV('Gen',33,20);\">Gen 33:20</a>).";
eastonArray["$$T0001152"] = "<strong>Elements:</strong> In its primary sense, as denoting the first principles or constituents of things, it is used in <a href=\"#\" onClick=\"return mV('2Pe',3,10);\">2Pe 3:10</a>: \"The elements shall be dissolved.\" In a secondary sense it denotes the first principles of any art or science. In this sense it is used in <a href=\"#\" onClick=\"return mV('Gal',4,3,9);\">Gal 4:3, 9</a>; <a href=\"#\" onClick=\"return mV('Col',2,8,20);\">Col 2:8, 20</a>, where the expressions, \"elements of the world,\" \"week and beggarly elements,\" denote that state of religious knowledge existing among the Jews before the coming of Christ, the rudiments of religious teaching. They are \"of the world,\" because they are made up of types which appeal to the senses. They are \"weak,\" because insufficient; and \"beggarly,\" or \"poor,\" because they are dry and barren, not being accompanied by an outpouring of spiritual gifts and graces, as the gospel is.";
eastonArray["$$T0001153"] = "<strong>Elephant:</strong> not found in Scripture except indirectly in the original Greek word (elephantinos) translated \"of ivory\" in <a href=\"#\" onClick=\"return mV('Rev',18,12);\">Rev 18:12</a>, and in the Hebrew word (shenhabim, meaning \"elephant's tooth\") rendered \"ivory\" in <a href=\"#\" onClick=\"return mV('1Ki',10,22);\">1Ki 10:22</a> and <a href=\"#\" onClick=\"return mV('2Ch',9,21);\">2Ch 9:21</a>.";
eastonArray["$$T0001154"] = "<strong>Elhanan:</strong> whom God has graciously bestowed.<br><br>(1.) A warrior of the time of David famed for his exploits. In the Authorized Version (<a href=\"#\" onClick=\"return mV('2Sa',21,19);\">2Sa 21:19</a>) it is recorded that \"Elhanan the son of Jaare-oregim, a Bethlehemite, slew the brother of Goliath.\" The Revised Version here rightly omits the words \"the brother of.\" They were introduced in the Authorized Version to bring this passage into agreement with <a href=\"#\" onClick=\"return mV('1Ch',20,5);\">1Ch 20:5</a>, where it is said that he \"slew Lahmi the brother of Goliath.\" Goliath the Gittite was killed by David (with <a href=\"#\" onClick=\"return mV('1Sa',17,'1-')\">1Sa 17</a>). The exploit of Elhanan took place late in David's reign.<br><br>(2.) The son of Dodo, and one of David's warriors (<a href=\"#\" onClick=\"return mV('2Sa',23,24);\">2Sa 23:24</a>).";
eastonArray["$$T0001155"] = "<strong>Eli:</strong> ascent, the high priest when the ark was at Shiloh (<a href=\"#\" onClick=\"return mV('1Sa',1,3,9);\">1Sa 1:3, 9</a>). He was the first of the line of Ithamar, Aaron's fourth son (<a href=\"#\" onClick=\"return mV('1Ch',24,3);\">1Ch 24:3</a>; <a href=\"#\" onClick=\"return mV('2Sa',8,17);\">2Sa 8:17</a>), who held that office. The office remained in his family till the time of Abiathar (<a href=\"#\" onClick=\"return mV('1Ki',2,26,27);\">1Ki 2:26-27</a>), whom Solomon deposed, and appointed Zadok, of the family of Eleazar, in his stead (<a href=\"#\" onClick=\"return mV('1Ki',2,35);\">35</a>). He acted also as a civil judge in Israel after the death of Samson (<a href=\"#\" onClick=\"return mV('1Sa',4,18);\">1Sa 4:18</a>), and judged Israel for forty years.<br><br>His sons Hophni and Phinehas grossly misconducted themselves, to the great disgust of the people (<a href=\"#\" onClick=\"return mV('1Sa',2,'27-36');\">1Sa 2:27-36</a>). They were licentious reprobates. He failed to reprove them so sternly as he ought to have done, and so brought upon his house the judgment of God (<a href=\"#\" onClick=\"return mV('1Sa',2,'22-33');\">2:22-33</a>; <a href=\"#\" onClick=\"return mV('1Sa',3,18);\">3:18</a>). The Israelites proclaimed war against the Philistines, whose army was encamped at Aphek. The battle, fought a short way beyond Mizpeh, ended in the total defeat of Israel. Four thousand of them fell in \"battle array\". They now sought safety in having the \"ark of the covenant of the Lord\" among them. They fetched it from Shiloh, and Hophni and Phinehas accompanied it. This was the first time since the settlement of Israel in Canaan that the ark had been removed from the sanctuary. The Philistines put themselves again in array against Israel, and in the battle which ensued \"Israel was smitten, and there was a very great slaughter.\" The tidings of this great disaster were speedily conveyed to Shiloh, about 20 miles distant, by a messenger, a Benjamite from the army. There Eli sat outside the gate of the sanctuary by the wayside, anxiously waiting for tidings from the battle-field. The full extent of the national calamity was speedily made known to him: \"Israel is fled before the Philistines, there has also been a great slaughter among the people, thy two sons Hophni and Phinehas are dead, and the ark of God is taken\" (<a href=\"#\" onClick=\"return mV('1Sa',4,'12-18');\">1Sa 4:12-18</a>). When the old man, whose eyes were \"stiffened\" (i.e., fixed, as of a blind eye unaffected by the light) with age, heard this sad story of woe, he fell backward from off his seat and died, being ninety and eight years old. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001913');\">ITHAMAR</a>.)<br><br>Eli, Heb. eli, \"my God\", (<a href=\"#\" onClick=\"return mV('Mat',27,46);\">Mat 27:46</a>), an exclamation used by Christ on the cross. Mark (<a href=\"#\" onClick=\"return mV('Mar',15,34);\">Mar 15:34</a>), as usual, gives the original Aramaic form of the word, Eloi.";
eastonArray["$$T0001156"] = "<strong>Eliab:</strong> to whom God is father.<br><br>(1.) A Reubenite, son of Pallu (<a href=\"#\" onClick=\"return mV('Num',16,1,12);\">Num 16:1, 12</a>; <a href=\"#\" onClick=\"return mV('Num',26,8,9);\">26:8-9</a>; <a href=\"#\" onClick=\"return mV('Deu',11,6);\">Deu 11:6</a>).<br><br>(2.) A son of Helon, and chief of the tribe of Zebulun at the time of the census in the wilderness (<a href=\"#\" onClick=\"return mV('Num',1,9);\">Num 1:9</a>; <a href=\"#\" onClick=\"return mV('Num',2,7);\">2:7</a>).<br><br>(3.) The son of Jesse, and brother of David (<a href=\"#\" onClick=\"return mV('1Sa',16,6);\">1Sa 16:6</a>). It was he who spoke contemptuously to David when he proposed to fight Goliath (<a href=\"#\" onClick=\"return mV('1Sa',17,28);\">1Sa 17:28</a>).<br><br>(4.) One of the Gadite heroes who joined David in his stronghold in the wilderness (<a href=\"#\" onClick=\"return mV('1Ch',12,9);\">1Ch 12:9</a>).";
eastonArray["$$T0001157"] = "<strong>Eliada:</strong> whom God cares for.<br><br>(1.) One of David's sons born after his establishment in Jerusalem (<a href=\"#\" onClick=\"return mV('2Sa',5,16);\">2Sa 5:16</a>).<br><br>(2.) A mighty man of war, a Benjamite (<a href=\"#\" onClick=\"return mV('2Ch',17,17);\">2Ch 17:17</a>).<br><br>(3.) An Aramite of Zobah, captain of a marauding band that troubled Solomon (<a href=\"#\" onClick=\"return mV('1Ki',11,23);\">1Ki 11:23</a>).";
eastonArray["$$T0001158"] = "<strong>Eliakim:</strong> whom God will raise up.<br><br>(1.) The son of Melea (<a href=\"#\" onClick=\"return mV('Luk',3,30);\">Luk 3:30</a>), and probably grandson of Nathan.<br><br>(2.) The son of Abiud, of the posterity of Zerubbabel (<a href=\"#\" onClick=\"return mV('Mat',1,13);\">Mat 1:13</a>).<br><br>(3.) The son of Hilkiah, who was sent to receive the message of the invading Assyrians and report it to Isaiah (<a href=\"#\" onClick=\"return mV('2Ki',18,18);\">2Ki 18:18</a>; <a href=\"#\" onClick=\"return mV('2Ki',19,2);\">19:2</a>; <a href=\"#\" onClick=\"return mV('Isa',36,3);\">Isa 36:3</a>; <a href=\"#\" onClick=\"return mV('Isa',37,2);\">37:2</a>). In his office as governor of the palace of Hezekiah he succeeded Shebna (<a href=\"#\" onClick=\"return mV('Isa',22,'15-25');\">Isa 22:15-25</a>). He was a good man (<a href=\"#\" onClick=\"return mV('Isa',22,20);\">Isa 22:20</a>; <a href=\"#\" onClick=\"return mV('2Ki',18,37);\">2Ki 18:37</a>), and had a splendid and honourable career.<br><br>(4.) The original name of Jehoiakim, king of Judah (<a href=\"#\" onClick=\"return mV('2Ki',23,34);\">2Ki 23:34</a>). He was the son of Josiah.";
eastonArray["$$T0001159"] = "<strong>Eliam:</strong> God's people.<br><br>(1.) The father of Bathsheba, the wife of Uriah (<a href=\"#\" onClick=\"return mV('2Sa',11,3);\">2Sa 11:3</a>). In <a href=\"#\" onClick=\"return mV('1Ch',3,5);\">1Ch 3:5</a> his name is Ammiel.<br><br>(2.) This name also occurs as that of a Gilonite, the son of Ahithophel, and one of David's thirty warriors (<a href=\"#\" onClick=\"return mV('2Sa',23,34);\">2Sa 23:34</a>). perhaps these two were the same person.";
eastonArray["$$T0001160"] = "<strong>Elias:</strong> the Greek form of Elijah (<a href=\"#\" onClick=\"return mV('Mat',11,14);\">Mat 11:14</a>; <a href=\"#\" onClick=\"return mV('Mat',16,14);\">16:14</a>, etc.), which the Revised Version has uniformly adopted in the New Testament. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001167');\">ELIJAH</a>.)";
eastonArray["$$T0001161"] = "<strong>Eliashib:</strong> whom God will restore.<br><br>(1.) A priest, head of one of the courses of the priests of the time of David (<a href=\"#\" onClick=\"return mV('1Ch',24,12);\">1Ch 24:12</a>).<br><br>(2.) A high priest in the time of Ezra and Nehemiah (<a href=\"#\" onClick=\"return mV('Neh',12,22,23);\">Neh 12:22-23</a>). He rebuilt the eastern city wall (<a href=\"#\" onClick=\"return mV('Neh',3,1);\">3:1</a>), his own mansion being in that quarter, on the ridge Ophel (<a href=\"#\" onClick=\"return mV('Neh',3,20,21);\">3:20-21</a>). His indulgence of Tobiah the Ammonite provoked the indignation of Nehemiah (<a href=\"#\" onClick=\"return mV('Neh',13,4,7);\">Neh 13:4, 7</a>).";
eastonArray["$$T0001162"] = "<strong>Eliathah:</strong> to whom God will come, one of the foureen sons of the Levite Heman, and musician of the temple in the time of David (<a href=\"#\" onClick=\"return mV('1Ch',25,4);\">1Ch 25:4</a>).";
eastonArray["$$T0001163"] = "<strong>Elidad:</strong> whom God has loved, son of Chislon, and chief of the tribe of Benjamin; one of those who were appointed to divide the Promised Land among the tribes (<a href=\"#\" onClick=\"return mV('Num',34,21);\">Num 34:21</a>).";
eastonArray["$$T0001164"] = "<strong>Eliel:</strong> to whom God is might.<br><br>(1.) A chief of Manasseh, on the east of Jordan (<a href=\"#\" onClick=\"return mV('1Ch',5,24);\">1Ch 5:24</a>).<br><br>(2.) A Gadite who joined David in the hold at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,11);\">1Ch 12:11</a>).<br><br>(3.) One of the overseers of the offerings in the reign of Hezekiah (<a href=\"#\" onClick=\"return mV('2Ch',31,13);\">2Ch 31:13</a>).";
eastonArray["$$T0001165"] = "<strong>Eliezer:</strong> God his help.<br><br>(1.) \"Of Damascus,\" the \"steward\" (R.V., \"possessor\") of Abraham's house (<a href=\"#\" onClick=\"return mV('Gen',15,2,3);\">Gen 15:2-3</a>). It was probably he who headed the embassy sent by Abraham to the old home of his family in Padan-aram to seek a wife for his son Isaac. The account of this embassy is given at length in <a href=\"#\" onClick=\"return mV('Gen',24,'1-');\">Gen 24</a>.<br><br>(2.) The son of Becher, and grandson of Benjamin (<a href=\"#\" onClick=\"return mV('1Ch',7,8);\">1Ch 7:8</a>).<br><br>(3.) One of the two sons of Moses, born during his sojourn in Midian (<a href=\"#\" onClick=\"return mV('Exd',18,4);\">Exd 18:4</a>; <a href=\"#\" onClick=\"return mV('1Ch',23,15,17);\">1Ch 23:15, 17</a>). He remained with his mother and brother Gershom with Jethro when Moses returned to Egypt. (<a href=\"#\" onClick=\"return mV('Exd',18,4);\">Exd 18:4</a>). They were restored to Moses when Jethro heard of his departure out of Egypt.<br><br>(4.) One of the priests who blew the trumpet before the ark when it was brought to Jerusalem (<a href=\"#\" onClick=\"return mV('1Ch',15,24);\">1Ch 15:24</a>).<br><br>(5.) Son of Zichri, and chief of the Reubenites under David (<a href=\"#\" onClick=\"return mV('1Ch',27,16);\">1Ch 27:16</a>).<br><br>(6.) A prophet in the time of Jehoshaphat (<a href=\"#\" onClick=\"return mV('2Ch',20,37);\">2Ch 20:37</a>). Others of this name are mentioned <a href=\"#\" onClick=\"return mV('Luk',3,29);\">Luk 3:29</a>; <a href=\"#\" onClick=\"return mV('Ezr',8,16);\">Ezr 8:16</a>; <a href=\"#\" onClick=\"return mV('Ezr',10,18,23,31);\">10:18, 23, 31</a>.";
eastonArray["$$T0001166"] = "<strong>Elihu:</strong> whose God is he.<br><br>(1.) \"The son of Barachel, a Buzite\" (<a href=\"#\" onClick=\"return mV('Job',32,2);\">Job 32:2</a>), one of Job's friends. When the debate between Job and his friends is brought to a close, Elihu for the first time makes his appearance, and delivers his opinion on the points at issue (<a href=\"#\" onClick=\"return mV('Job',32,'1-');\">Job 32-37</a>).<br><br>(2.) The son of Tohu, and grandfather of Elkanah (<a href=\"#\" onClick=\"return mV('1Sa',1,1);\">1Sa 1:1</a>). He is called also Eliel (<a href=\"#\" onClick=\"return mV('1Ch',6,34);\">1Ch 6:34</a>) and Eliab (<a href=\"#\" onClick=\"return mV('1Ch',6,27);\">6:27</a>).<br><br>(3.) One of the captains of thousands of Manasseh who joined David at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,20);\">1Ch 12:20</a>).<br><br>(4.) One of the family of Obed-edom, who were appointed porters of the temple under David (<a href=\"#\" onClick=\"return mV('1Ch',26,7);\">1Ch 26:7</a>).";
eastonArray["$$T0001167"] = "<strong>Elijah:</strong> whose God is Jehovah.<br><br>(1.) \"The Tishbite,\" the \"Elias\" of the New Testament, is suddenly introduced to our notice in <a href=\"#\" onClick=\"return mV('1Ki',17,1);\">1Ki 17:1</a> as delivering a message from the Lord to Ahab. There is mention made of a town called Thisbe, south of Kadesh, but it is impossible to say whether this was the place referred to in the name given to the prophet.<br><br>Having delivered his message to Ahab, he retired at the command of God to a hiding-place by the brook Cherith, beyond Jordan, where he was fed by ravens. When the brook dried up God sent him to the widow of Zarephath, a city of Zidon, from whose scanty store he was supported for the space of two years. During this period the widow's son died, and was restored to life by Elijah (<a href=\"#\" onClick=\"return mV('1Ki',17,'2-24');\">1Ki 17:2-24</a>).<br><br>During all these two years a famine prevailed in the land. At the close of this period of retirement and of preparation for his work (<a href=\"#\" onClick=\"return mV('Gal',1,'17-18');\">Gal 1:17-18</a>) Elijah met Obadiah, one of Ahab's officers, whom he had sent out to seek for pasturage for the cattle, and bade him go and tell his master that Elijah was there. The king came and met Elijah, and reproached him as the troubler of Israel. It was then proposed that sacrifices should be publicly offered, for the purpose of determining whether Baal or Jehovah were the true God. This was done on Carmel, with the result that the people fell on their faces, crying, \"The Lord, he is the God.\" Thus was accomplished the great work of Elijah's ministry. The prophets of Baal were then put to death by the order of Elijah. Not one of them escaped. Then immediately followed rain, according to the word of Elijah, and in answer to his prayer (<a href=\"#\" onClick=\"return mV('Jam',5,18);\">Jam 5:18</a>).<br><br>Jezebel, enraged at the fate that had befallen her priests of Baal, threatened to put Elijah to death (<a href=\"#\" onClick=\"return mV('1Ki',19,'1-13');\">1Ki 19:1-13</a>). He therefore fled in alarm to Beersheba, and thence went alone a day's journey into the wilderness, and sat down in despondency under a juniper tree. As he slept an angel touched him, and said unto him, \"Arise and eat; because the journey is too great for thee.\" He arose and found a cake and a cruse of water. Having partaken of the provision thus miraculously supplied, he went forward on his solitary way for forty days and forty nights to Horeb, the mount of God, where he took up his abode in a cave. Here the Lord appeared unto him and said, \"What dost thou here, Elijah?\" In answer to his despondent words God manifests to him his glory, and then directs him to return to Damascus and anoint Hazael king over Syria, and Jehu king over Israel, and Elisha to be prophet in his room (<a href=\"#\" onClick=\"return mV('1Ki',19,'13-21');\">1Ki 19:13-21</a>; <a href=\"#\" onClick=\"return mV('2Ki',8,'7-15');\">2Ki 8:7-15</a>; <a href=\"#\" onClick=\"return mV('2Ki',9,'1-10');\">9:1-10</a>).<br><br>Some six years after this he warned Ahab and Jezebel of the violent deaths they would die (<a href=\"#\" onClick=\"return mV('1Ki',21,'19-24');\">1Ki 21:19-24</a>; <a href=\"#\" onClick=\"return mV('1Ki',22,38);\">22:38</a>). He also, four years afterwards, warned Ahaziah (q.v.), who had succeeded his father Ahab, of his approaching death (<a href=\"#\" onClick=\"return mV('2Ki',1,'1-16');\">2Ki 1:1-16</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002645');\">NABOTH</a>.) During these intervals he probably withdrew to some quiet retirement, no one knew where. His interview with Ahaziah's messengers on the way to Ekron, and the account of the destruction of his captains with their fifties, suggest the idea that he may have been in retirement at this time on Mount Carmel.<br><br>The time now drew near when he was to be taken up into heaven (<a href=\"#\" onClick=\"return mV('2Ki',2,'1-12');\">2Ki 2:1-12</a>). He had a presentiment of what was awaiting him. He went down to Gilgal, where was a school of the prophets, and where his successor Elisha, whom he had anointed some years before, resided. Elisha was solemnized by the thought of his master's leaving him, and refused to be parted from him. \"They two went on,\" and came to Bethel and Jericho, and crossed the Jordan, the waters of which were \"divided hither and thither\" when smitten with Elijah's mantle. Arrived at the borders of Gilead, which Elijah had left many years before, it \"came to pass as they still went on and talked\" they were suddenly separated by a chariot and horses of fire; and \"Elijah went up by a whirlwind into heaven, \"Elisha receiving his mantle, which fell from him as he ascended.<br><br>No one of the old prophets is so frequently referred to in the New Testament. The priests and Levites said to the Baptist (<a href=\"#\" onClick=\"return mV('Jhn',1,25);\">Jhn 1:25</a>), \"Why baptizest thou, if thou be not that Christ, nor Elias?\" Paul (<a href=\"#\" onClick=\"return mV('Rom',11,2);\">Rom 11:2</a>) refers to an incident in his history to illustrate his argument that God had not cast away his people. James (<a href=\"#\" onClick=\"return mV('Jam',5,17);\">Jam 5:17</a>) finds in him an illustration of the power of prayer. (See also <a href=\"#\" onClick=\"return mV('Luk',4,25);\">Luk 4:25</a>; <a href=\"#\" onClick=\"return mV('Luk',9,54);\">9:54</a>.) He was a type of John the Baptist in the sternness and power of his reproofs (<a href=\"#\" onClick=\"return mV('Luk',9,8);\">Luk 9:8</a>). He was the Elijah that \"must first come\" (<a href=\"#\" onClick=\"return mV('Mat',11,11,14);\">Mat 11:11, 14</a>), the forerunner of our Lord announced by Malachi. Even outwardly the Baptist corresponded so closely to the earlier prophet that he might be styled a second Elijah. In him we see \"the same connection with a wild and wilderness country; the same long retirement in the desert; the same sudden, startling entrance on his work (<a href=\"#\" onClick=\"return mV('1Ki',17,1);\">1Ki 17:1</a>; <a href=\"#\" onClick=\"return mV('Luk',3,2);\">Luk 3:2</a>); even the same dress, a hairy garment, and a leathern girdle about the loins (<a href=\"#\" onClick=\"return mV('2Ki',1,8);\">2Ki 1:8</a>; <a href=\"#\" onClick=\"return mV('Mat',3,4);\">Mat 3:4</a>).\"<br><br>How deep the impression was which Elijah made \"on the mind of the nation may be judged from the fixed belief, which rested on the words of Malachi (<a href=\"#\" onClick=\"return mV('Mal',4,5,6);\">Mal 4:5-6</a>), which many centuries after prevailed that he would again appear for the relief and restoration of the country. Each remarkable person as he arrives on the scene, be his habits and characteristics what they may, the stern John equally with his gentle Successor, is proclaimed to be Elijah (<a href=\"#\" onClick=\"return mV('Mat',11,13,14);\">Mat 11:13-14</a>; <a href=\"#\" onClick=\"return mV('Mat',16,14);\">16:14</a>; <a href=\"#\" onClick=\"return mV('Mat',17,10);\">17:10</a>; <a href=\"#\" onClick=\"return mV('Mar',9,11);\">Mar 9:11</a>; <a href=\"#\" onClick=\"return mV('Mar',15,35);\">15:35</a>; <a href=\"#\" onClick=\"return mV('Luk',9,7,8);\">Luk 9:7-8</a>; <a href=\"#\" onClick=\"return mV('Jhn',1,21);\">Jhn 1:21</a>). His appearance in glory on the mount of transfiguration does not seem to have startled the disciples. They were 'sore afraid,' but not apparently surprised.\"<br><br>(2.) The Elijah spoken of in <a href=\"#\" onClick=\"return mV('2Ch',21,'12-15');\">2Ch 21:12-15</a> is by some supposed to be a different person from the foregoing. He lived in the time of Jehoram, to whom he sent a letter of warning (<a href=\"#\" onClick=\"return mV('1Ch',28,19);\">1Ch 28:19</a>; <a href=\"#\" onClick=\"return mV('Jer',36,'1-')\">Jer 36</a>), and acted as a prophet in Judah; while the Tishbite was a prophet of the northern kingdom. But there does not seem any necessity for concluding that the writer of this letter was some other Elijah than the Tishbite. It may be supposed either that Elijah anticipated the character of Jehoram, and so wrote the warning message, which was preserved in the schools of the prophets till Jehoram ascended the throne after the Tishbite's translation, or that the translation did not actually take place till after the accession of Jehoram to the throne (<a href=\"#\" onClick=\"return mV('2Ch',21,12);\">2Ch 21:12</a>; <a href=\"#\" onClick=\"return mV('2Ki',8,16);\">2Ki 8:16</a>). The events of <a href=\"#\" onClick=\"return mV('2Ki',2,'1-');\">2Ki 2</a> may not be recorded in chronological order, and thus there may be room for the opinion that Elijah was still alive in the beginning of Jehoram's reign.";
eastonArray["$$T0001168"] = "<strong>Elika:</strong> God is his rejector, one of David's thirty-seven distinguished heros (<a href=\"#\" onClick=\"return mV('2Sa',23,25);\">2Sa 23:25</a>).";
eastonArray["$$T0001169"] = "<strong>Elim:</strong> trees, (<a href=\"#\" onClick=\"return mV('Exd',15,27);\">Exd 15:27</a>; <a href=\"#\" onClick=\"return mV('Num',33,9);\">Num 33:9</a>), the name of the second station where the Israelites encamped after crossing the Red Sea. It had \"twelve wells of water and threescore and ten palm trees.\" It has been identified with the Wady Ghurundel, the most noted of the four wadies which descend from the range of et-Tih towards the sea. Here they probably remained some considerable time. The form of expression in <a href=\"#\" onClick=\"return mV('Exd',16,1);\">Exd 16:1</a> seems to imply that the people proceeded in detachments or companies from Elim, and only for the first time were assembled as a complete host when they reached the wilderness of Sin (q.v.).";
eastonArray["$$T0001170"] = "<strong>Elimelech:</strong> God his king, a man of the tribe of Judah, of the family of the Hezronites, and kinsman of Boaz, who dwelt in Bethlehem in the days of the judges. In consequence of a great dearth he, with his wife Naomi and his two sons, went to dwell in the land of Moab. There he and his sons died (<a href=\"#\" onClick=\"return mV('Rth',1,2,3);\">Rth 1:2-3</a>; <a href=\"#\" onClick=\"return mV('Rth',2,1,3);\">2:1, 3</a>; <a href=\"#\" onClick=\"return mV('Rth',4,3,9);\">4:3, 9</a>). Naomi afterwards returned to Palestine with her daughter Ruth.";
eastonArray["$$T0001171"] = "<strong>Elioenai:</strong> toward Jehovah are my eyes, the name of several men mentioned in the Old Testament (<a href=\"#\" onClick=\"return mV('1Ch',7,8);\">1Ch 7:8</a>; <a href=\"#\" onClick=\"return mV('1Ch',4,36);\">4:36</a>; <a href=\"#\" onClick=\"return mV('Ezr',10,22,27);\">Ezr 10:22, 27</a>). Among these was the eldest son of Neariah, son of Shemaiah, of the descendants of Zerubbabel. His family are the latest mentioned in the Old Testament (<a href=\"#\" onClick=\"return mV('1Ch',3,23,24);\">1Ch 3:23-24</a>).";
eastonArray["$$T0001172"] = "<strong>Eliphalet:</strong> God his deliverance, one of David's sons (<a href=\"#\" onClick=\"return mV('2Sa',5,16);\">2Sa 5:16</a>); called also Eliphelet (<a href=\"#\" onClick=\"return mV('1Ch',3,8);\">1Ch 3:8</a>).";
eastonArray["$$T0001173"] = "<strong>Eliphaz:</strong> God his strength.<br><br>(1.) One of Job's \"three friends\" who visited him in his affliction (<a href=\"#\" onClick=\"return mV('Job',4,1);\">Job 4:1</a>). He was a \"Temanite\", i.e., a native of Teman, in Idumea. He first enters into debate with Job. His language is uniformly more delicate and gentle than that of the other two, although he imputes to Job special sins as the cause of his present sufferings. He states with remarkable force of language the infinite purity and majesty of God (<a href=\"#\" onClick=\"return mV('Job',4,'12-21');\">Job 4:12-21</a>; <a href=\"#\" onClick=\"return mV('Job',15,'12-16');\">15:12-16</a>).<br><br>(2.) The son of Esau by his wife Adah, and father of several Edomitish tribes (<a href=\"#\" onClick=\"return mV('Gen',36,4,10,11,16);\">Gen 36:4, 10-11, 16</a>).";
eastonArray["$$T0001174"] = "<strong>Elipheleh:</strong> God will distinguish him, one of the porters appointed to play \"on the Sheminith\" on the occasion of the bringing up of the ark to the city of David (<a href=\"#\" onClick=\"return mV('1Ch',15,18,21);\">1Ch 15:18, 21</a>).";
eastonArray["$$T0001175"] = "<strong>Eliphelet:</strong> God his deliverance.<br><br>(1.) One of David's distinguished warriors (<a href=\"#\" onClick=\"return mV('2Sa',23,34);\">2Sa 23:34</a>); called also Eliphal in <a href=\"#\" onClick=\"return mV('1Ch',11,35);\">1Ch 11:35</a>.<br><br>(2.) One of the sons of David born at Jerusalem (<a href=\"#\" onClick=\"return mV('1Ch',3,6);\">1Ch 3:6</a>; <a href=\"#\" onClick=\"return mV('1Ch',14,5);\">14:5</a>); called Elpalet in <a href=\"#\" onClick=\"return mV('1Ch',14,5);\">1Ch 14:5</a>. Also another of David's sons (<a href=\"#\" onClick=\"return mV('1Ch',3,8);\">1Ch 3:8</a>); called Eliphalet in <a href=\"#\" onClick=\"return mV('2Sa',5,16);\">2Sa 5:16</a>; <a href=\"#\" onClick=\"return mV('1Ch',14,7);\">1Ch 14:7</a>.<br><br>(3.) A descendant of king Saul through Jonathan (<a href=\"#\" onClick=\"return mV('1Ch',8,39);\">1Ch 8:39</a>).";
eastonArray["$$T0001176"] = "<strong>Elisabeth:</strong> God her oath, the mother of John the Baptist (<a href=\"#\" onClick=\"return mV('Luk',1,5);\">Luk 1:5</a>). She was a descendant of Aaron. She and her husband Zacharias (q.v.) \"were both righteous before God\" (<a href=\"#\" onClick=\"return mV('Luk',1,5,13);\">Luk 1:5, 13</a>). Mary's visit to Elisabeth is described in <a href=\"#\" onClick=\"return mV('Luk',1,'39-63');\">Luk 1:39-63</a>.";
eastonArray["$$T0001177"] = "<strong>Elisha:</strong> God his salvation, the son of Shaphat of Abel-meholah, who became the attendant and disciple of Elijah (<a href=\"#\" onClick=\"return mV('1Ki',19,'16-19');\">1Ki 19:16-19</a>). His name first occurs in the command given to Elijah to anoint him as his successor (<a href=\"#\" onClick=\"return mV('1Ki',19,16);\">1Ki 19:16</a>). This was the only one of the three commands then given to Elijah which he accomplished. On his way from Sinai to Damascus he found Elisha at his native place engaged in the labours of the field, ploughing with twelve yoke of oxen. He went over to him, threw over his shoulders his rough mantle, and at once adopted him as a son, and invested him with the prophetical office (<a href=\"#\" onClick=\"return mV('Luk',9,61,62);\">Luk 9:61-62</a>). Elisha accepted the call thus given (about four years before the death of Ahab), and for some seven or eight years became the close attendant on Elijah till he was parted from him and taken up into heaven. During all these years we hear nothing of Elisha except in connection with the closing scenes of Elijah's life. After Elijah, Elisha was accepted as the leader of the sons of the prophets, and became noted in Israel. He possessed, according to his own request, \"a double portion\" of Elijah's spirit (<a href=\"#\" onClick=\"return mV('2Ki',2,9);\">2Ki 2:9</a>); and for the long period of about sixty years (B.C. 892-832) held the office of \"prophet in Israel\" (<a href=\"#\" onClick=\"return mV('2Ki',5,8);\">2Ki 5:8</a>).<br><br>After Elijah's departure, Elisha returned to Jericho, and there healed the spring of water by casting salt into it (<a href=\"#\" onClick=\"return mV('2Ki',2,21);\">2Ki 2:21</a>). We next find him at Bethel (<a href=\"#\" onClick=\"return mV('2Ki',2,23);\">2:23</a>), where, with the sternness of his master, he cursed the youths who came out and scoffed at him as a prophet of God: \"Go up, thou bald head.\" The judgment at once took effect, and God terribly visited the dishonour done to his prophet as dishonour done to himself. We next read of his predicting a fall of rain when the army of Jehoram was faint from thirst (<a href=\"#\" onClick=\"return mV('2Ki',3,'9-20');\">2Ki 3:9-20</a>); of the multiplying of the poor widow's cruse of oil (<a href=\"#\" onClick=\"return mV('2Ki',4,'1-7');\">4:1-7</a>); the miracle of restoring to life the son of the woman of Shunem (<a href=\"#\" onClick=\"return mV('2Ki',4,'18-37');\">4:18-37</a>); the multiplication of the twenty loaves of new barley into a sufficient supply for an hundred men (<a href=\"#\" onClick=\"return mV('2Ki',4,'42-44');\">4:42-44</a>); of the cure of Naaman the Syrian of his leprosy (<a href=\"#\" onClick=\"return mV('2Ki',5,'1-27');\">5:1-27</a>); of the punishment of Gehazi for his falsehood and his covetousness; of the recovery of the axe lost in the waters of the Jordan (<a href=\"#\" onClick=\"return mV('2Ki',6,'1-7');\">6:1-7</a>); of the miracle at Dothan, half-way on the road between Samaria and Jezreel; of the siege of Samaria by the king of Syria, and of the terrible sufferings of the people in connection with it, and Elisha's prophecy as to the relief that would come (<a href=\"#\" onClick=\"return mV('2Ki',6,'24-');\">2Ki 6:24</a>-<a href=\"#\" onClick=\"return mV('2Ki',7,1,2);\">7:2</a>).<br><br>We then find Elisha at Damascus, to carry out the command given to his master to anoint Hazael king over Syria (<a href=\"#\" onClick=\"return mV('2Ki',8,'7-15');\">2Ki 8:7-15</a>); thereafter he directs one of the sons of the prophets to anoint Jehu, the son of Jehoshaphat, king of Israel, instead of Ahab. Thus the three commands given to Elijah (<a href=\"#\" onClick=\"return mV('2Ki',9,'1-10');\">9:1-10</a>) were at length carried out.<br><br>We do not again read of him till we find him on his death-bed in his own house (<a href=\"#\" onClick=\"return mV('2Ki',13,'14-19');\">2Ki 13:14-19</a>). Joash, the grandson of Jehu, comes to mourn over his approaching departure, and utters the same words as those of Elisha when Elijah was taken away: \"My father, my father! the chariot of Israel, and the horsemen thereof.\"<br><br>Afterwards when a dead body is laid in Elisha's grave a year after his burial, no sooner does it touch the hallowed remains than the man \"revived, and stood up on his feet\" (<a href=\"#\" onClick=\"return mV('2Ki',13,20,21);\">2Ki 13:20-21</a>).";
eastonArray["$$T0001178"] = "<strong>Elishah:</strong> the oldest of the four sons of Javan (<a href=\"#\" onClick=\"return mV('Gen',10,4);\">Gen 10:4</a>), whose descendants peopled Greece. It has been supposed that Elishah's descendants peopled the Peloponnesus, which was known by the name of Elis. This may be meant by \"the isles of Elishah\" (<a href=\"#\" onClick=\"return mV('Eze',27,7);\">Eze 27:7</a>).";
eastonArray["$$T0001179"] = "<strong>Elishama:</strong> whom God hears.<br><br>(1.) A prince of Benjamin, grandfather of Joshua (<a href=\"#\" onClick=\"return mV('Num',1,10);\">Num 1:10</a>; <a href=\"#\" onClick=\"return mV('1Ch',7,26);\">1Ch 7:26</a>).<br><br>(2.) One of David's sons (<a href=\"#\" onClick=\"return mV('2Sa',5,16);\">2Sa 5:16</a>).<br><br>(3.) Another of David's sons (<a href=\"#\" onClick=\"return mV('1Ch',3,6);\">1Ch 3:6</a>).<br><br>(4.) A priest sent by Jehoshaphat to teach the people the law (<a href=\"#\" onClick=\"return mV('2Ch',17,8);\">2Ch 17:8</a>).";
eastonArray["$$T0001180"] = "<strong>Elishaphat:</strong> whom God has judged, one of the \"captains of hundreds\" associated with Jehoiada in the league to overthrow the usurpation of Athaliah (<a href=\"#\" onClick=\"return mV('2Ch',23,1);\">2Ch 23:1</a>).";
eastonArray["$$T0001181"] = "<strong>Elisheba:</strong> God is her oath, the daughter of Amminadab and the wife of Aaron (<a href=\"#\" onClick=\"return mV('Exd',6,23);\">Exd 6:23</a>).";
eastonArray["$$T0001182"] = "<strong>Elishua:</strong> God his salvation, a son of David, <a href=\"#\" onClick=\"return mV('2Sa',5,15);\">2Sa 5:15</a> = Elishama, <a href=\"#\" onClick=\"return mV('1Ch',3,6);\">1Ch 3:6</a>.";
eastonArray["$$T0001183"] = "<strong>Elkanah:</strong> God-created.<br><br>(1.) The second son of Korah (<a href=\"#\" onClick=\"return mV('Exd',6,24);\">Exd 6:24</a>), or, according to <a href=\"#\" onClick=\"return mV('1Ch',6,22,23);\">1Ch 6:22-23</a>, more correctly his grandson.<br><br>(2.) Another Levite of the line of Heman the singer, although he does not seem to have performed any of the usual Levitical offices. He was father of Samuel the prophet (<a href=\"#\" onClick=\"return mV('1Ch',6,27,34);\">1Ch 6:27, 34</a>). He was \"an Ephrathite\" (<a href=\"#\" onClick=\"return mV('1Sa',1,1,4,8);\">1Sa 1:1, 4, 8</a>), but lived at Ramah, a man of wealth and high position. He had two wives, Hannah, who was the mother of Samuel, and Peninnah.";
eastonArray["$$T0001184"] = "<strong>Elkosh:</strong> God my bow, the birth-place of Nahum the prophet (<a href=\"#\" onClick=\"return mV('Nah',1,1);\">Nah 1:1</a>). It was probably situated in Galilee, but nothing definite is known of it.";
eastonArray["$$T0001185"] = "<strong>Ellasar:</strong> the oak or heap of Assyria, a territory in Asia of which Arioch was king (<a href=\"#\" onClick=\"return mV('Gen',14,1,9);\">Gen 14:1, 9</a>). It is supposed that the old Chaldean town of Larsa was the metropolis of this kingdom, situated nearly half-way between Ur (now Mugheir) and Erech, on the left bank of the Euphrates. This town is represented by the mounds of Senkereh, a little to the east of Erech.";
eastonArray["$$T0001186"] = "<strong>Elm:</strong> <a href=\"#\" onClick=\"return mV('Hsa',4,13);\">Hsa 4:13</a>; rendered \"terebinth\" in the Revised Version. It is the <i>Pistacia terebinthus</i> of Linn., a tree common in Palestine, long-lived, and therefore often employed for landmarks and in designating places (<a href=\"#\" onClick=\"return mV('Gen',35,4);\">Gen 35:4</a>; <a href=\"#\" onClick=\"return mV('Jdg',6,11,19);\">Jdg 6:11, 19</a>. Rendered \"oak\" in both A.V. and R.V.). (See <a href=\"#\" onClick=\"return doDictLookup('ET0003597');\">TEIL TREE</a>.)";
eastonArray["$$T0001187"] = "<strong>Elnathan:</strong> whom God has given.<br><br>(1.) An inhabitant of Jerusalem, the father of Nehushta, who was the mother of king Jehoiachin (<a href=\"#\" onClick=\"return mV('2Ki',24,8);\">2Ki 24:8</a>). Probably the same who tried to prevent Jehoiakim from burning the roll of Jeremiah's prophecies (<a href=\"#\" onClick=\"return mV('Jer',26,22);\">Jer 26:22</a>; <a href=\"#\" onClick=\"return mV('Jer',36,12);\">36:12</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('Ezr',8,16);\">Ezr 8:16</a>.";
eastonArray["$$T0001188"] = "<strong>Elon:</strong> oak.<br><br>(1.) A city of Dan (<a href=\"#\" onClick=\"return mV('Jos',19,43);\">Jos 19:43</a>).<br><br>(2.) A Hittite, father of Bashemath, Esau's wife (<a href=\"#\" onClick=\"return mV('Gen',26,34);\">Gen 26:34</a>).<br><br>(3.) One of the sons of Zebulun (<a href=\"#\" onClick=\"return mV('Gen',46,14);\">Gen 46:14</a>).<br><br>(4.) The eleventh of the Hebrew judges. He held office for ten years (<a href=\"#\" onClick=\"return mV('Jdg',12,11,12);\">Jdg 12:11-12</a>). He is called the Zebulonite.";
eastonArray["$$T0001189"] = "<strong>Elparan:</strong> oak of Paran, a place on the edge of the wilderness bordering the territory of the Horites (<a href=\"#\" onClick=\"return mV('Gen',14,6);\">Gen 14:6</a>). This was the farthest point to which Chedorlaomer's expedition extended. It is identified with the modern desert of et-Tih. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002845');\">PARAN</a>.)";
eastonArray["$$T0001190"] = "<strong>Eltekeh:</strong> God is its fear, a city in the tribe of Dan. It was a city of refuge and a Levitical city (<a href=\"#\" onClick=\"return mV('Jos',21,23);\">Jos 21:23</a>). It has been identified with Beit-Likia, north-east of latrum.";
eastonArray["$$T0001191"] = "<strong>Elul:</strong> (<a href=\"#\" onClick=\"return mV('Neh',6,15);\">Neh 6:15</a>), the name of the sixth month of the ecclesiastical year, and the twelfth of the civil year. It began with the new moon of our August and September, and consisted of twenty-nine days.";
eastonArray["$$T0001192"] = "<strong>Elymas:</strong> magician or sorcerer, the Arabic name of the Jew Bar-jesus, who withstood Paul and Barnabas in Cyprus. He was miraculously struck with blindness (<a href=\"#\" onClick=\"return mV('Act',13,11);\">Act 13:11</a>).";
eastonArray["$$T0001193"] = "<strong>Embalming:</strong> the process of preserving a body by means of aromatics (<a href=\"#\" onClick=\"return mV('Gen',50,2,3,26);\">Gen 50:2-3, 26</a>). This art was practised by the Egyptians from the earliest times, and there brought to great perfection. This custom probably originated in the belief in the future reunion of the soul with the body. The process became more and more complicated, and to such perfection was it carried that bodies embalmed thousands of years ago are preserved to the present day in the numberless mummies that have been discovered in Egypt.<br><br>The embalming of Jacob and Joseph was according to the Egyptian custom, which was partially followed by the Jews (<a href=\"#\" onClick=\"return mV('2Ch',16,14);\">2Ch 16:14</a>), as in the case of king Asa, and of our Lord (<a href=\"#\" onClick=\"return mV('Jhn',19,39,40);\">Jhn 19:39-40</a>; <a href=\"#\" onClick=\"return mV('Luk',23,56);\">Luk 23:56</a>; <a href=\"#\" onClick=\"return mV('Luk',24,1);\">24:1</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002923');\">PHARAOH</a>.)";
eastonArray["$$T0001194"] = "<strong>Embroider:</strong> The art of embroidery was known to the Jews (<a href=\"#\" onClick=\"return mV('Exd',26,36);\">Exd 26:36</a>; <a href=\"#\" onClick=\"return mV('Exd',35,35);\">35:35</a>; <a href=\"#\" onClick=\"return mV('Exd',38,23);\">38:23</a>; <a href=\"#\" onClick=\"return mV('Jdg',5,30);\">Jdg 5:30</a>; <a href=\"#\" onClick=\"return mV('Psa',45,14);\">Psa 45:14</a>). The skill of the women in this art was seen in the preparation of the sacerdotal robes of the high priest (<a href=\"#\" onClick=\"return mV('Exd',28,'1-')\">Exd 28</a>). It seems that the art became hereditary in certain families (<a href=\"#\" onClick=\"return mV('1Ch',4,21);\">1Ch 4:21</a>). The Assyrians were also noted for their embroidered robes (<a href=\"#\" onClick=\"return mV('Eze',27,24);\">Eze 27:24</a>).";
eastonArray["$$T0001195"] = "<strong>Emerald:</strong> Heb. nophek (<a href=\"#\" onClick=\"return mV('Exd',28,18);\">Exd 28:18</a>; <a href=\"#\" onClick=\"return mV('Exd',39,11);\">39:11</a>); i.e., the \"glowing stone\", probably the carbuncle, a precious stone in the breastplate of the high priest. It is mentioned (<a href=\"#\" onClick=\"return mV('Rev',21,19);\">Rev 21:19</a>) as one of the foundations of the New Jerusalem. The name given to this stone in the New Testament Greek is smaragdos, which means \"live coal.\"";
eastonArray["$$T0001196"] = "<strong>Emerod:</strong> See <a href=\"#\" onClick=\"return doDictLookup('ET0001581');\">HAEMORRHOIDS</a>.";
eastonArray["$$T0001197"] = "<strong>Emims:</strong> terrors, a warlike tribe of giants who were defeated by Chedorlaomer and his allies in the plain of Kiriathaim. In the time of Abraham they occupied the country east of Jordan, afterwards the land of the Moabites (<a href=\"#\" onClick=\"return mV('Gen',14,5);\">Gen 14:5</a>; <a href=\"#\" onClick=\"return mV('Deu',2,10);\">Deu 2:10</a>). They were, like the Anakim, reckoned among the Rephaim, and were conquered by the Moabites, who gave them the name of Emims, i.e., \"terrible men\" (<a href=\"#\" onClick=\"return mV('Deu',2,11);\">Deu 2:11</a>). The Ammonites called them Zamzummims (<a href=\"#\" onClick=\"return mV('Deu',2,20);\">2:20</a>).";
eastonArray["$$T0001198"] = "<strong>Emmanuel:</strong> God with us, <a href=\"#\" onClick=\"return mV('Mat',1,23);\">Mat 1:23</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001875');\">IMMANUEL</a>.)";
eastonArray["$$T0001199"] = "<strong>Emmaus:</strong> hot baths, a village \"three-score furlongs\" from jerusalem, where our Lord had an interview with two of his disciples on the day of his resurrection (<a href=\"#\" onClick=\"return mV('Luk',24,13);\">Luk 24:13</a>). This has been identified with the modern el-Kubeibeh, lying over 7 miles north-west of Jerusalem. This name, el-Kubeibeh, meaning \"little dome,\" is derived from the remains of the Crusaders' church yet to be found there. Others have identified it with the modern Khurbet Khamasa i.e., \"the ruins of Khamasa\", about 8 miles south-west of Jerusalem, where there are ruins also of a Crusaders' church. Its site, however has been much disputed.";
</script>
