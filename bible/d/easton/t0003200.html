<script>
var eastonArray = new Array ();
eastonArray["$$T0003200"] = "<strong>Salutation:</strong> \"Eastern modes of salutation are not unfrequently so prolonged as to become wearisome and a positive waste of time. The profusely polite Arab asks so many questions after your health, your happiness, your welfare, your house, and other things, that a person ignorant of the habits of the country would imagine there must be some secret ailment or mysterious sorrow oppressing you, which you wished to conceal, so as to spare the feelings of a dear, sympathizing friend, but which he, in the depth of his anxiety, would desire to hear of. I have often listened to these prolonged salutations in the house, the street, and the highway, and not unfrequently I have experienced their tedious monotony, and I have bitterly lamented useless waste of time\" (Porter, Through Samaria, etc.). The work on which the disciples were sent forth was one of urgency, which left no time for empty compliments and prolonged greetings (<a href=\"#\" onClick=\"return mV('Luk',10,4);\">Luk 10:4</a>).";
eastonArray["$$T0003201"] = "<strong>Salvation:</strong> This word is used of the deliverance of the Israelites from the Egyptians (<a href=\"#\" onClick=\"return mV('Exd',14,13);\">Exd 14:13</a>), and of deliverance generally from evil or danger. In the New Testament it is specially used with reference to the great deliverance from the guilt and the pollution of sin wrought out by Jesus Christ, \"the great salvation\" (<a href=\"#\" onClick=\"return mV('Hbr',2,3);\">Hbr 2:3</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003084');\">REDEMPTION</a>; <a href=\"#\" onClick=\"return doDictLookup ('ET0003091');\">REGENERATION</a>.)";
eastonArray["$$T0003202"] = "<strong>Samaria:</strong> a watch-mountain or a watch-tower. In the heart of the mountains of Israel, a few miles north-west of Shechem, stands the \"hill of Shomeron,\" a solitary mountain, a great \"mamelon.\" It is an oblong hill, with steep but not inaccessible sides, and a long flat top. Omri, the king of Israel, purchased this hill from Shemer its owner for two talents of silver, and built on its broad summit the city to which he gave the name of \"Shomeron\", i.e., Samaria, as the new capital of his kingdom instead of Tirzah (<a href=\"#\" onClick=\"return mV('1Ki',16,24);\">1Ki 16:24</a>). As such it possessed many advantages. Here Omri resided during the last six years of his reign. As the result of an unsuccessful war with Syria, he appears to have been obliged to grant to the Syrians the right to \"make streets in Samaria\", i.e., probably permission to the Syrian merchants to carry on their trade in the Israelite capital. This would imply the existence of a considerable Syrian population. \"It was the only great city of Palestine created by the sovereign. All the others had been already consecrated by patriarchal tradition or previous possession. But Samaria was the choice of Omri alone. He, indeed, gave to the city which he had built the name of its former owner, but its especial connection with himself as its founder is proved by the designation which it seems Samaria bears in Assyrian inscriptions, Beth-khumri ('the house or palace of Omri').\", Stanley.<br><br>Samaria was frequently besieged. In the days of Ahab, Benhadad II. came up against it with thirty-two vassal kings, but was defeated with a great slaughter (<a href=\"#\" onClick=\"return mV('1Ki',20,'1-21');\">1Ki 20:1-21</a>). A second time, next year, he assailed it; but was again utterly routed, and was compelled to surrender to Ahab (<a href=\"#\" onClick=\"return mV('1Ki',20,'28-34');\">20:28-34</a>), whose army, as compared with that of Benhadad, was no more than \"two little flocks of kids.\"<br><br>In the days of Jehoram this Benhadad again laid siege to Samaria, during which the city was reduced to the direst extremities. But just when success seemed to be within their reach, they suddenly broke up the seige, alarmed by a mysterious noise of chariots and horses and a great army, and fled, leaving their camp with all its contents behind them. The famishing inhabitants of the city were soon relieved with the abundance of the spoil of the Syrian camp; and it came to pass, according to the word of Elisha, that \"a measure of fine flour was sold for a shekel, and two measures of barely for a shekel, in the gates of Samaria\" (<a href=\"#\" onClick=\"return mV('2Ki',7,'1-20');\">2Ki 7:1-20</a>).<br><br>Shalmaneser invaded Israel in the days of Hoshea, and reduced it to vassalage. He laid siege to Samaria (B.C. 723), which held out for three years, and was at length captured by Sargon, who completed the conquest Shalmaneser had begun (<a href=\"#\" onClick=\"return mV('2Ki',18,'9-12');\">2Ki 18:9-12</a>; <a href=\"#\" onClick=\"return mV('2Ki',17,3);\">17:3</a>), and removed vast numbers of the tribes into captivity. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003227');\">SARGON</a>.)<br><br>This city, after passing through various vicissitudes, was given by the emperor Augustus to Herod the Great, who rebuilt it, and called it Sebaste (Gr. form of Augustus) in honour of the emperor. In the New Testament the only mention of it is in <a href=\"#\" onClick=\"return mV('Act',8,'5-14');\">Act 8:5-14</a>, where it is recorded that Philip went down to the city of Samaria and preached there.<br><br>It is now represented by the hamlet of Sebustieh, containing about three hundred inhabitants. The ruins of the ancient town are all scattered over the hill, down the sides of which they have rolled. The shafts of about one hundred of what must have been grand Corinthian columns are still standing, and attract much attention, although nothing definite is known regarding them. (<a href=\"#\" onClick=\"return mV('Mic',1,6);\">Mic 1:6</a>.)<br><br>In the time of Christ, Western Palestine was divided into three provinces, Judea, Samaria, and Galilee. Samaria occupied the centre of Palestine (<a href=\"#\" onClick=\"return mV('Jhn',4,4);\">Jhn 4:4</a>). It is called in the Talmud the \"land of the Cuthim,\" and is not regarded as a part of the Holy Land at all.<br><br>It may be noticed that the distance between Samaria and Jerusalem, the respective capitals of the two kingdoms, is only 35 miles in a direct line.";
eastonArray["$$T0003203"] = "<strong>Samaritan Pentateuch:</strong> On the return from the Exile, the Jews refused the Samaritans participation with them in the worship at Jerusalem, and the latter separated from all fellowship with them, and built a temple for themselves on Mount Gerizim. This temple was razed to the ground more than one hundred years B.C. Then a system of worship was instituted similar to that of the temple at Jerusalem. It was founded on the Law, copies of which had been multiplied in Israel as well as in Judah. Thus the Pentateuch was preserved among the Samaritans, although they never called it by this name, but always \"the Law,\" which they read as one book. The division into five books, as we now have it, however, was adopted by the Samaritans, as it was by the Jews, in all their priests' copies of \"the Law,\" for the sake of convenience. This was the only portion of the Old Testament which was accepted by the Samaritans as of divine authority.<br><br>The form of the letters in the manuscript copies of the Samaritan Pentateuch is different from that of the Hebrew copies, and is probably the same as that which was in general use before the Captivity. There are other peculiarities in the writing which need not here be specified.<br><br>There are important differences between the Hebrew and the Samaritan copies of the Pentateuch in the readings of many sentences. In about two thousand instances in which the Samaritan and the Jewish texts differ, the LXX. agrees with the former. The New Testament also, when quoting from the Old Testament, agrees as a rule with the Samaritan text, where that differs from the Jewish. Thus <a href=\"#\" onClick=\"return mV('Exd',12,40);\">Exd 12:40</a> in the Samaritan reads, \"Now the sojourning of the children of Israel and of their fathers which they had dwelt in the land of Canaan and in Egypt was four hundred and thirty years\" (<a href=\"#\" onClick=\"return mV('Gal',3,17);\">Gal 3:17</a>). It may be noted that the LXX. has the same reading of this text.";
eastonArray["$$T0003204"] = "<strong>Samaritans:</strong> the name given to the new and mixed inhabitants whom Esarhaddon (B.C. 677), the king of Assyria, brought from Babylon and other places and settled in the cities of Samaria, instead of the original inhabitants whom Sargon (B.C. 721) had removed into captivity (<a href=\"#\" onClick=\"return mV('2Ki',17,24);\">2Ki 17:24</a>; <a href=\"#\" onClick=\"return mV('Ezr',4,2,9,10);\">Ezr 4:2, 9-10</a>). These strangers (<a href=\"#\" onClick=\"return mV('Luk',17,18);\">Luk 17:18</a>) amalgamated with the Jews still remaining in the land, and gradually abandoned their old idolatry and adopted partly the Jewish religion.<br><br>After the return from the Captivity, the Jews in Jerusalem refused to allow them to take part with them in rebuilding the temple, and hence sprang up an open enmity between them. They erected a rival temple on Mount Gerizim, which was, however, destroyed by a Jewish king (B.C. 130). They then built another at Shechem. The bitter enmity between the Jews and Samaritans continued in the time of our Lord: the Jews had \"no dealings with the Samaritans\" (<a href=\"#\" onClick=\"return mV('Jhn',4,9);\">Jhn 4:9</a>; <a href=\"#\" onClick=\"return mV('Luk',9,52,53);\">Luk 9:52-53</a>). Our Lord was in contempt called \"a Samaritan\" (<a href=\"#\" onClick=\"return mV('Jhn',8,48);\">Jhn 8:48</a>). Many of the Samaritans early embraced the gospel (<a href=\"#\" onClick=\"return mV('Jhn',4,'5-42');\">Jhn 4:5-42</a>; <a href=\"#\" onClick=\"return mV('Act',8,25);\">Act 8:25</a>; <a href=\"#\" onClick=\"return mV('Act',9,31);\">9:31</a>; <a href=\"#\" onClick=\"return mV('Act',15,3);\">15:3</a>). Of these Samaritans there still remains a small population of about one hundred and sixty, who all reside in Shechem, where they carefully observe the religious customs of their fathers. They are the \"smallest and oldest sect in the world.\"";
eastonArray["$$T0003205"] = "<strong>Samgar-nebo:</strong> be gracious, O Nebo! or a cup-bearer of Nebo, probably the title of Nergal-sharezer, one of the princes of Babylon (<a href=\"#\" onClick=\"return mV('Jer',39,3);\">Jer 39:3</a>).";
eastonArray["$$T0003206"] = "<strong>Samos:</strong> an island in the AEgean Sea, which Paul passed on his voyage from Assos to Miletus (<a href=\"#\" onClick=\"return mV('Act',20,15);\">Act 20:15</a>), on his third missionary journey. It is about 27 miles long and 20 broad, and lies about 42 miles south-west of Smyrna.";
eastonArray["$$T0003207"] = "<strong>Samothracia:</strong> an island in the AEgean Sea, off the coast of Thracia, about 32 miles distant. This Thracian Samos was passed by Paul on his voyage from Troas to Neapolis (<a href=\"#\" onClick=\"return mV('Act',16,11);\">Act 16:11</a>) on his first missionary journey. It is about 8 miles long and 6 miles broad. Its modern name is Samothraki.";
eastonArray["$$T0003208"] = "<strong>Samson:</strong> of the sun, the son of Manoah, born at Zorah. The narrative of his life is given in <a href=\"#\" onClick=\"return mV('Jdg',13,'1-');\">Jdg 13-16</a>. He was a \"Nazarite unto God\" from his birth, the first Nazarite mentioned in Scripture (<a href=\"#\" onClick=\"return mV('Jdg',13,'3-5');\">Jdg 13:3-5</a>; <a href=\"#\" onClick=\"return mV('Num',6,'1-21');\">Num 6:1-21</a>). The first recorded event of his life was his marriage with a Philistine woman of Timnath (<a href=\"#\" onClick=\"return mV('Jdg',14,'1-5');\">Jdg 14:1-5</a>). Such a marriage was not forbidden by the law of Moses, as the Philistines did not form one of the seven doomed Canaanite nations (<a href=\"#\" onClick=\"return mV('Exd',34,'11-16');\">Exd 34:11-16</a>; <a href=\"#\" onClick=\"return mV('Deu',7,'1-4');\">Deu 7:1-4</a>). It was, however, an ill-assorted and unblessed marriage. His wife was soon taken from him and given \"to his companion\" (<a href=\"#\" onClick=\"return mV('Jdg',14,20);\">Jdg 14:20</a>). For this Samson took revenge by burning the \"standing corn of the Philistines\" (<a href=\"#\" onClick=\"return mV('Jdg',15,'1-8');\">15:1-8</a>), who, in their turn, in revenge \"burnt her and her father with fire.\" Her death he terribly avenged (<a href=\"#\" onClick=\"return mV('Jdg',15,'7-19');\">15:7-19</a>). During the twenty years following this he judged Israel; but we have no record of his life. Probably these twenty years may have been simultaneous with the last twenty years of Eli's life. After this we have an account of his exploits at Gaza (<a href=\"#\" onClick=\"return mV('Jdg',16,'1-3');\">16:1-3</a>), and of his infatuation for Delilah, and her treachery (<a href=\"#\" onClick=\"return mV('Jdg',16,'4-20');\">16:4-20</a>), and then of his melancholy death (<a href=\"#\" onClick=\"return mV('Jdg',16,'21-31');\">16:21-31</a>). He perished in the last terrible destruction he brought upon his enemies. \"So the dead which he slew at his death were more [in social and political importance=the elite of the people] than they which he slew in his life.\"<br><br>\"Straining all his nerves, he bowed: As with the force of winds and waters pent, When mountains tremble, those two massy pillars With horrible convulsion to and fro He tugged, he shook, till down they came, and drew The whole roof after them, with burst of thunder Upon the heads of all who sat beneath, Lords, ladies, captains, counsellors, or priests, Their choice nobility and flower.\" Milton's Samson Agonistes.";
eastonArray["$$T0003209"] = "<strong>Samuel:</strong> heard of God. The peculiar circumstances connected with his birth are recorded in <a href=\"#\" onClick=\"return mV('1Sa',1,20);\">1Sa 1:20</a>. Hannah, one of the two wives of Elkanah, who came up to Shiloh to worship before the Lord, earnestly prayed to God that she might become the mother of a son. Her prayer was graciously granted; and after the child was weaned she brought him to Shiloh nd consecrated him to the Lord as a perpetual Nazarite (<a href=\"#\" onClick=\"return mV('1Sa',1,'23-');\">1Sa 1:23</a>-<a href=\"#\" onClick=\"return mV('1Sa',2,'1-11');\">2:11</a>). Here his bodily wants and training were attended to by the women who served in the tabernacle, while Eli cared for his religious culture. Thus, probably, twelve years of his life passed away. \"The child Samuel grew on, and was in favour both with the Lord, and also with men\" (<a href=\"#\" onClick=\"return mV('1Sa',2,26);\">1Sa 2:26</a>; <a href=\"#\" onClick=\"return mV('Luk',2,52);\">Luk 2:52</a>). It was a time of great and growing degeneracy in Israel (<a href=\"#\" onClick=\"return mV('Jdg',21,'19-21');\">Jdg 21:19-21</a>; <a href=\"#\" onClick=\"return mV('1Sa',2,'12-17',22);\">1Sa 2:12-17, 22</a>). The Philistines, who of late had greatly increased in number and in power, were practically masters of the country, and kept the people in subjection (<a href=\"#\" onClick=\"return mV('1Sa',10,5);\">1Sa 10:5</a>; <a href=\"#\" onClick=\"return mV('1Sa',13,3);\">13:3</a>).<br><br>At this time new communications from God began to be made to the pious child. A mysterious voice came to him in the night season, calling him by name, and, instructed by Eli, he answered, \"Speak, Lord; for thy servant heareth.\" The message that came from the Lord was one of woe and ruin to Eli and his profligate sons. Samuel told it all to Eli, whose only answer to the terrible denunciations (<a href=\"#\" onClick=\"return mV('1Sa',3,'11-18');\">1Sa 3:11-18</a>) was, \"It is the Lord; let him do what seemeth him good\", the passive submission of a weak character, not, in his case, the expression of the highest trust and faith. The Lord revealed himself now in divers manners to Samuel, and his fame and his influence increased throughout the land as of one divinely called to the prophetical office. A new period in the history of the kingdom of God now commenced.<br><br>The Philistine yoke was heavy, and the people, groaning under the wide-spread oppression, suddenly rose in revolt, and \"went out against the Philistines to battle.\" A fierce and disastrous battle was fought at Aphek, near to Ebenezer (<a href=\"#\" onClick=\"return mV('1Sa',4,1,2\">1Sa 4:1-2</a>). The Israelites were defeated, leaving 4,000 dead \"in the field.\" The chiefs of the people thought to repair this great disaster by carrying with them the ark of the covenant as the symbol of Jehovah's presence. They accordingly, without consulting Samuel, fetched it out of Shiloh to the camp near Aphek. At the sight of the ark among them the people \"shouted with a great shout, so that the earth rang again.\" A second battle was fought, and again the Philistines defeated the Israelites, stormed their camp, slew 30,000 men, and took the sacred ark. The tidings of this fatal battle was speedily conveyed to Shiloh; and so soon as the aged Eli heard that the ark of God was taken, he fell backward from his seat at the entrance of the sanctuary, and his neck brake, and he died. The tabernacle with its furniture was probably, by the advice of Samuel, now about twenty years of age, removed from Shiloh to some place of safety, and finally to Nob, where it remained many years (<a href=\"#\" onClick=\"return mV('1Sa',21,1);\">1Sa 21:1</a>).<br><br>The Philistines followed up their advantage, and marched upon Shiloh, which they plundered and destroyed (<a href=\"#\" onClick=\"return mV('Jer',7,12);\">Jer 7:12</a>; <a href=\"#\" onClick=\"return mV('Psa',78,59);\">Psa 78:59</a>). This was a great epoch in the history of Israel. For twenty years after this fatal battle at Aphek the whole land lay under the oppression of the Philistines. During all these dreary years Samuel was a spiritual power in the land. From Ramah, his native place, where he resided, his influence went forth on every side among the people. With unwearied zeal he went up and down from place to place, reproving, rebuking, and exhorting the people, endeavouring to awaken in them a sense of their sinfulness, and to lead them to repentance. His labours were so far successful that \"all the house of Israel lamented after the Lord.\" Samuel summoned the people to Mizpeh, one of the loftiest hills in Central Palestine, where they fasted and prayed, and prepared themselves there, under his direction, for a great war against the Philistines, who now marched their whole force toward Mizpeh, in order to crush the Israelites once for all. At the intercession of Samuel God interposed in behalf of Israel. Samuel himself was their leader, the only occasion in which he acted as a leader in war. The Philistines were utterly routed. They fled in terror before the army of Israel, and a great slaughter ensued. This battle, fought probably about B.C. 1095, put an end to the forty years of Philistine oppression. In memory of this great deliverance, and in token of gratitude for the help vouchsafed, Samuel set up a great stone in the battlefield, and called it \"Ebenezer,\" saying, \"Hitherto hath the Lord helped us\" (<a href=\"#\" onClick=\"return mV('1Sa',7,'1-12');\">1Sa 7:1-12</a>). This was the spot where, twenty years before, the Israelites had suffered a great defeat, when the ark of God was taken.<br><br>This victory over the Philistines was followed by a long period of peace for Israel (<a href=\"#\" onClick=\"return mV('1Sa',7,13,14);\">1Sa 7:13-14</a>), during which Samuel exercised the functions of judge, going \"from year to year in circuit\" from his home in Ramah to Bethel, thence to Gilgal (not that in the Jordan valley, but that which lay to the west of Ebal and Gerizim), and returning by Mizpeh to Ramah. He established regular services at Shiloh, where he built an altar; and at Ramah he gathered a company of young men around him and established a school of the prophets. The schools of the prophets, thus originated, and afterwards established also at Gibeah, Bethel, Gilgal, and Jericho, exercised an important influence on the national character and history of the people in maintaining pure religion in the midst of growing corruption. They continued to the end of the Jewish commonwealth.<br><br>Many years now passed, during which Samuel exercised the functions of his judicial office, being the friend and counsellor of the people in all matters of private and public interest. He was a great statesman as well as a reformer, and all regarded him with veneration as the \"seer,\" the prophet of the Lord. At the close of this period, when he was now an old man, the elders of Israel came to him at Ramah (<a href=\"#\" onClick=\"return mV('1Sa',8,4,5,'19-22');\">1Sa 8:4-5, 19-22</a>); and feeling how great was the danger to which the nation was exposed from the misconduct of Samuel's sons, whom he had invested with judicial functions as his assistants, and had placed at Beersheba on the Philistine border, and also from a threatened invasion of the Ammonites, they demanded that a king should be set over them. This request was very displeasing to Samuel. He remonstrated with them, and warned them of the consequences of such a step. At length, however, referring the matter to God, he acceded to their desires, and anointed Saul (q.v.) to be their king (<a href=\"#\" onClick=\"return mV('1Sa',11,15);\">1Sa 11:15</a>). Before retiring from public life he convened an assembly of the people at Gilgal (<a href=\"#\" onClick=\"return mV('1Sa',12,'1-')\">1Sa 12</a>), and there solemnly addressed them with reference to his own relation to them as judge and prophet.<br><br>The remainder of his life he spent in retirement at Ramah, only occasionally and in special circumstances appearing again in public (<a href=\"#\" onClick=\"return mV('1Sa',13,'1-')\">1Sa 13</a>; <a href=\"#\" onClick=\"return mV('1Sa',15,'1-')\">15</a>) with communications from God to king Saul. While mourning over the many evils which now fell upon the nation, he is suddenly summoned (<a href=\"#\" onClick=\"return mV('1Sa',16,'1-')\">1Sa 16</a>) to go to Bethlehem and anoint David, the son of Jesse, as king over Israel instead of Saul. After this little is known of him till the time of his death, which took place at Ramah when he was probably about eighty years of age. \"And all Israel gathered themselves together, and lamented him, and buried him in his house at Ramah\" (<a href=\"#\" onClick=\"return mV('1Sa',25,1);\">1Sa 25:1</a>), not in the house itself, but in the court or garden of his house. (<a href=\"#\" onClick=\"return mV('2Ki',21,18);\">2Ki 21:18</a>; <a href=\"#\" onClick=\"return mV('2Ch',33,20);\">2Ch 33:20</a>; <a href=\"#\" onClick=\"return mV('1Ki',2,34);\">1Ki 2:34</a>; <a href=\"#\" onClick=\"return mV('Jhn',19,41);\">Jhn 19:41</a>.)<br><br>Samuel's devotion to God, and the special favour with which God regarded him, are referred to in <a href=\"#\" onClick=\"return mV('Jer',15,1);\">Jer 15:1</a> and <a href=\"#\" onClick=\"return mV('Psa',99,6);\">Psa 99:6</a>.";
eastonArray["$$T0003210"] = "<strong>Samuel, Books of:</strong> The LXX. translators regarded the books of Samuel and of Kings as forming one continuous history, which they divided into four books, which they called \"Books of the Kingdom.\" The Vulgate version followed this division, but styled them \"Books of the Kings.\" These books of Samuel they accordingly called the \"First\" and \"Second\" Books of Kings, and not, as in the modern Protestant versions, the \"First\" and \"Second\" Books of Samuel.<br><br>The authors of the books of Samuel were probably Samuel, Gad, and Nathan. Samuel penned the first twenty-four chapters of the first book. Gad, the companion of David (<a href=\"#\" onClick=\"return mV('1Sa',22,5);\">1Sa 22:5</a>), continued the history thus commenced; and Nathan completed it, probably arranging the whole in the form in which we now have it (<a href=\"#\" onClick=\"return mV('1Ch',29,29);\">1Ch 29:29</a>).<br><br>The contents of the books. The first book comprises a period of about a hundred years, and nearly coincides with the life of Samuel. It contains<br><br>(1) the history of Eli (<a href=\"#\" onClick=\"return mV('1Sa',1,'1-');\">1Sa 1-4</a>);<br><br>(2) the history of Samuel (<a href=\"#\" onClick=\"return mV('1Sa',5,'1-');\">5-12</a>);<br><br>(3) the history of Saul, and of David in exile (<a href=\"#\" onClick=\"return mV('1Sa',13,'1-');\">13-31</a>). The second book, comprising a period of perhaps fifty years, contains a history of the reign of David<br><br>(1) over Judah (<a href=\"#\" onClick=\"return mV('2Sa',1,'1-');\">1-4</a>), and<br><br>(2) over all Israel (<a href=\"#\" onClick=\"return mV('21Sa',5,'1-');\">5-24</a>), mainly in its political aspects. The last four chapters of Second Samuel may be regarded as a sort of appendix recording various events, but not chronologically. These books do not contain complete histories. Frequent gaps are met with in the record, because their object is to present a history of the kingdom of God in its gradual development, and not of the events of the reigns of the successive rulers. It is noticeable that the section (<a href=\"#\" onClick=\"return mV('2Sa',11,'2-');\">2Sa 11:2</a>-<a href=\"#\" onClick=\"return mV('2Sa',12,'1-29');\">12:29</a>) containing an account of David's sin in the matter of Bathsheba is omitted in the corresponding passage in <a href=\"#\" onClick=\"return mV('1Ch',20,'1-');\">1Ch 20</a>.";
eastonArray["$$T0003211"] = "<strong>Sanballat:</strong> held some place of authority in Samaria when Nehemiah went up to Jerusalem to rebuild its ruined walls. He vainly attempted to hinder this work (<a href=\"#\" onClick=\"return mV('Neh',2,10,19);\">Neh 2:10, 19</a>; <a href=\"#\" onClick=\"return mV('Neh',4,'1-12');\">4:1-12</a>; <a href=\"#\" onClick=\"return mV('Neh',6,'1-');\">6</a>). His daughter became the wife of one of the sons of Joiada, a son of the high priest, much to the grief of Nehemiah (<a href=\"#\" onClick=\"return mV('Neh',13,28);\">Neh 13:28</a>).";
eastonArray["$$T0003212"] = "<strong>Sanctification:</strong> involves more than a mere moral reformation of character, brought about by the power of the truth: it is the work of the Holy Spirit bringing the whole nature more and more under the influences of the new gracious principles implanted in the soul in regeneration. In other words, sanctification is the carrying on to perfection the work begun in regeneration, and it extends to the whole man (<a href=\"#\" onClick=\"return mV('Rom',6,13);\">Rom 6:13</a>; <a href=\"#\" onClick=\"return mV('2Cr',4,6);\">2Cr 4:6</a>; <a href=\"#\" onClick=\"return mV('Col',3,10);\">Col 3:10</a>; <a href=\"#\" onClick=\"return mV('1Jo',4,7);\">1Jo 4:7</a>; <a href=\"#\" onClick=\"return mV('1Cr',6,19);\">1Cr 6:19</a>). It is the special office of the Holy Spirit in the plan of redemption to carry on this work (<a href=\"#\" onClick=\"return mV('1Cr',6,11);\">1Cr 6:11</a>; <a href=\"#\" onClick=\"return mV('2Th',2,13);\">2Th 2:13</a>). Faith is instrumental in securing sanctification, inasmuch as it<br><br>(1) secures union to Christ (<a href=\"#\" onClick=\"return mV('Gal',2,20);\">Gal 2:20</a>), and<br><br>(2) brings the believer into living contact with the truth, whereby he is led to yield obedience \"to the commands, trembling at the threatenings, and embracing the promises of God for this life and that which is to come.\"<br><br>Perfect sanctification is not attainable in this life (<a href=\"#\" onClick=\"return mV('1Ki',8,46);\">1Ki 8:46</a>; <a href=\"#\" onClick=\"return mV('Pro',20,9);\">Pro 20:9</a>; <a href=\"#\" onClick=\"return mV('Ecc',7,20);\">Ecc 7:20</a>; <a href=\"#\" onClick=\"return mV('Jam',3,2);\">Jam 3:2</a>; <a href=\"#\" onClick=\"return mV('1Jo',1,8);\">1Jo 1:8</a>). See Paul's account of himself in <a href=\"#\" onClick=\"return mV('Rom',7,'14-25');\">Rom 7:14-25</a>; <a href=\"#\" onClick=\"return mV('Phl',3,'12-14');\">Phl 3:12-14</a>; and <a href=\"#\" onClick=\"return mV('1Ti',1,15);\">1Ti 1:15</a>; also the confessions of David (<a href=\"#\" onClick=\"return mV('Psa',19,12);\">Psa 19:12-13; <a href=\"#\" onClick=\"return mV('Psa',51,'1-');\">Psa 51</a>), of Moses (<a href=\"#\" onClick=\"return mV('Psa',90,8);\">90:8</a>), of Job (<a href=\"#\" onClick=\"return mV('Job',42,5,6);\">Job 42:5-6</a>), and of Daniel (<a href=\"#\" onClick=\"return mV('Dan',9,'3-20');\">Dan 9:3-20</a>). \"The more holy a man is, the more humble, self-renouncing, self-abhorring, and the more sensitive to every sin he becomes, and the more closely he clings to Christ. The moral imperfections which cling to him he feels to be sins, which he laments and strives to overcome. Believers find that their life is a constant warfare, and they need to take the kingdom of heaven by storm, and watch while they pray. They are always subject to the constant chastisement of their Father's loving hand, which can only be designed to correct their imperfections and to confirm their graces. And it has been notoriously the fact that the best Christians have been those who have been the least prone to claim the attainment of perfection for themselves.\", Hodge's Outlines.";
eastonArray["$$T0003213"] = "<strong>Sanctuary:</strong> denotes,<br><br>(1) the Holy Land (<a href=\"#\" onClick=\"return mV('Exd',15,17);\">Exd 15:17</a>; <a href=\"#\" onClick=\"return mV('Psa',114,2);\">Psa 114:2</a>);<br><br>(2) the temple (<a href=\"#\" onClick=\"return mV('1Ch',22,19);\">1Ch 22:19</a>; <a href=\"#\" onClick=\"return mV('2Ch',29,21);\">2Ch 29:21</a>);<br><br>(3) the tabernacle (<a href=\"#\" onClick=\"return mV('Exd',25,8);\">Exd 25:8</a>; <a href=\"#\" onClick=\"return mV('Lev',12,4);\">Lev 12:4</a>; <a href=\"#\" onClick=\"return mV('Lev',21,12);\">21:12</a>);<br><br>(4) the holy place, the place of the Presence (Gr. hieron, the temple-house; not the <i>naos</i>, which is the temple area, with its courts and porches), <a href=\"#\" onClick=\"return mV('Lev',4,6);\">Lev 4:6</a>; <a href=\"#\" onClick=\"return mV('Eph',2,21);\">Eph 2:21</a>, R.V., marg.;<br><br>(5) God's holy habitation in heaven (<a href=\"#\" onClick=\"return mV('Psa',102,19);\">Psa 102:19</a>). In the final state there is properly \"no sanctuary\" (<a href=\"#\" onClick=\"return mV('Rev',21,22);\">Rev 21:22</a>), for God and the Lamb \"are the sanctuary\" (R.V., \"temple\"). All is there hallowed by the Divine Presence; all is sancturary.";
eastonArray["$$T0003214"] = "<strong>Sandals:</strong> Mentioned only in <a href=\"#\" onClick=\"return mV('Mar',6,9);\">Mar 6:9</a> and <a href=\"#\" onClick=\"return mV('Act',12,8);\">Act 12:8</a>. The sandal was simply a sole, made of wood or palm-bark, fastened to the foot by leathern straps. Sandals were also made of seal-skin (<a href=\"#\" onClick=\"return mV('Eze',16,10);\">Eze 16:10</a>; lit. tahash, \"leather; \" A.V., \"badger's skin; \" R.V., \"sealskin,\" or marg., \"porpoise-skin\"). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003404');\">SHOE</a>.)";
eastonArray["$$T0003215"] = "<strong>Sanhedrim:</strong> more correctly Sanhedrin (Gr. synedrion), meaning \"a sitting together,\" or a \"council.\" This word (rendered \"council,\" A.V.) is frequently used in the New Testament (<a href=\"#\" onClick=\"return mV('Mat',5,22);\">Mat 5:22</a>; <a href=\"#\" onClick=\"return mV('Mat',26,59);\">26:59</a>; <a href=\"#\" onClick=\"return mV('Mar',15,1);\">Mar 15:1</a>, etc.) to denote the supreme judicial and administrative council of the Jews, which, it is said, was first instituted by Moses, and was composed of seventy men (<a href=\"#\" onClick=\"return mV('Num',11,16,17);\">Num 11:16-17</a). But that seems to have been only a temporary arrangement which Moses made. This council is with greater probability supposed to have originated among the Jews when they were under the domination of the Syrian kings in the time of the Maccabees. The name is first employed by the Jewish historian Josephus. This \"council\" is referred to simply as the \"chief priests and elders of the people\" (<a href=\"#\" onClick=\"return mV('Mat',26,3,47,57,59);\">Mat 26:3, 47, 57, 59</a>; <a href=\"#\" onClick=\"return mV('Mat',27,1,3,12,20);\">27:1, 3, 12, 20</a>, etc.), before whom Christ was tried on the charge of claiming to be the Messiah. Peter and John were also brought before it for promulgating heresy (<a href=\"#\" onClick=\"return mV('Act',4,'1-23');\">Act 4:1-23</a>; <a href=\"#\" onClick=\"return mV('Act',5,'17-41');\">5:17-41</a>); as was also Stephen on a charge of blasphemy (<a href=\"#\" onClick=\"return mV('Act',6,'12-15');\">6:12-15</a>), and Paul for violating a temple by-law (<a href=\"#\" onClick=\"return mV('Act',22,30);\">22:30</a>; <a href=\"#\" onClick=\"return mV('Act',23,'1-10');\">23:1-10</a>).<br><br>The Sanhedrin is said to have consisted of seventy-one members, the high priest being president. They were of three classes<br><br>(1) the chief priests, or heads of the twenty-four priestly courses (<a href=\"#\" onClick=\"return mV('1Ch',24,'1-')\">1Ch 24</a>),<br><br>(2) the scribes, and<br><br>(3) the elders.<br><br>As the highest court of judicature, \"in all causes and over all persons, ecclesiastical and civil, supreme,\" its decrees were binding, not only on the Jews in Palestine, but on all Jews wherever scattered abroad. Its jurisdiction was greatly curtailed by Herod, and afterwards by the Romans. Its usual place of meeting was within the precincts of the temple, in the hall \"Gazith,\" but it sometimes met also in the house of the high priest (<a href=\"#\" onClick=\"return mV('Mat',26,3);\">Mat 26:3</a>), who was assisted by two vice-presidents.";
eastonArray["$$T0003216"] = "<strong>Sansannah:</strong> a palm branch, or a thorn bush, a town in the south (the negeb) of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,31);\">Jos 15:31</a>); called also Hazarsusah (<a href=\"#\" onClick=\"return mV('Jos',19,5);\">19:5</a>), or Hazar-susim (<a href=\"#\" onClick=\"return mV('1Ch',4,31);\">1Ch 4:31</a>).";
eastonArray["$$T0003217"] = "<strong>Saph:</strong> extension, the son of the giant whom Sibbechai slew (<a href=\"#\" onClick=\"return mV('2Sa',21,18);\">2Sa 21:18</a>); called also Sippai (<a href=\"#\" onClick=\"return mV('1Ch',20,4);\">1Ch 20:4</a>).";
eastonArray["$$T0003218"] = "<strong>Saphir:</strong> beautiful, a town of Judah (<a href=\"#\" onClick=\"return mV('Mic',1,11);\">Mic 1:11</a>), identified with es-Suafir, 5 miles south-east of Ashdod.";
eastonArray["$$T0003219"] = "<strong>Sapphira:</strong> beautiful, the wife of Ananias (q.v.). She was a partner in his guilt and also in his punishment (<a href=\"#\" onClick=\"return mV('Act',5,'1-11');\">Act 5:1-11</a>).";
eastonArray["$$T0003220"] = "<strong>Sapphire:</strong> Associated with diamonds (<a href=\"#\" onClick=\"return mV('Exd',28,18);\">Exd 28:18</a>) and emeralds (<a href=\"#\" onClick=\"return mV('Eze',28,13);\">Eze 28:13</a>); one of the stones in the high priest's breastplate. It is a precious stone of a sky-blue colour, probably the lapis lazuli, brought from Babylon. The throne of God is described as of the colour of a sapphire (<a href=\"#\" onClick=\"return mV('Exd',24,10);\">Exd 24:10</a>; <a href=\"#\" onClick=\"return mV('Eze',1,26);\">Eze 1:26</a>).";
eastonArray["$$T0003221"] = "<strong>Sarah:</strong> princess, the wife and at the same time the half-sister of Abraham (<a href=\"#\" onClick=\"return mV('Gen',11,29);\">Gen 11:29</a>; <a href=\"#\" onClick=\"return mV('Gen',20,12);\">20:12</a>). This name was given to her at the time that it was announced to Abraham that she should be the mother of the promised child. Her story is from her marriage identified with that of the patriarch till the time of her death. Her death, at the age of one hundred and twenty-seven years (the only instance in Scripture where the age of a woman is recorded), was the occasion of Abraham's purchasing the cave of Machpelah as a family burying-place.<br><br>In the allegory of <a href=\"#\" onClick=\"return mV('Gal',4,'22-31');\">Gal 4:22-31</a> she is the type of the \"Jerusalem which is above.\" She is also mentioned as Sara in <a href=\"#\" onClick=\"return mV('Hbr',11,11);\">Hbr 11:11</a> among the Old Testament worthies, who \"all died in faith.\" (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000054');\">ABRAHAM</a>.)";
eastonArray["$$T0003222"] = "<strong>Sarai:</strong> my princess, the name originally borne by Sarah (<a href=\"#\" onClick=\"return mV('Gen',11,31);\">Gen 11:31</a>; <a href=\"#\" onClick=\"return mV('Gen',17,15);\">17:15</a>).";
eastonArray["$$T0003223"] = "<strong>Sardine stone:</strong> (<a href=\"#\" onClick=\"return mV('Rev',4,3);\">Rev 4:3</a>, R.V., \"sardius; \" Heb. 'odhem; LXX., Gr. sardion, from a root meaning \"red\"), a gem of a blood-red colour. It was called \"sardius\" because obtained from Sardis in Lydia. It is enumerated among the precious stones in the high priest's breastplate (<a href=\"#\" onClick=\"return mV('Exd',28,17);\">Exd 28:17</a>; <a href=\"#\" onClick=\"return mV('Exd',39,10);\">39:10</a>). It is our red carnelian.";
eastonArray["$$T0003224"] = "<strong>Sardis:</strong> the metropolis of Lydia in Asia Minor. It stood on the river Pactolus, at the foot of mount Tmolus. Here was one of the seven Asiatic churches (<a href=\"#\" onClick=\"return mV('Rev',3,'1-6');\">Rev 3:1-6</a>). It is now a ruin called Sert-Kalessi.";
eastonArray["$$T0003225"] = "<strong>Sardonyx:</strong> (<a href=\"#\" onClick=\"return mV('Rev',21,20);\">Rev 21:20</a>), a species of the carnelian combining the sard and the onyx, having three layers of opaque spots or stripes on a transparent red basis. Like the sardine, it is a variety of the chalcedony.";
eastonArray["$$T0003226"] = "<strong>Sarepta:</strong> (<a href=\"#\" onClick=\"return mV('Luk',4,26);\">Luk 4:26</a>). See <a href=\"#\" onClick=\"return doDictLookup ('ET0003872');\">ZAREPHATH</a>.";
eastonArray["$$T0003227"] = "<strong>Sargon:</strong> (In the inscriptions, \"Sarra-yukin\" [the god] has appointed the king; also \"Sarru-kinu,\" the legitimate king.) On the death of Shalmaneser (B.C. 723), one of the Assyrian generals established himself on the vacant throne, taking the name of \"Sargon,\" after that of the famous monarch, the Sargon of Accad, founder of the first Semitic empire, as well as of one of the most famous libraries of Chaldea. He forthwith began a conquering career, and became one of the most powerful of the Assyrian monarchs. He is mentioned by name in the Bible only in connection with the siege of Ashdod (<a href=\"#\" onClick=\"return mV('Isa',20,1);\">Isa 20:1</a>).<br><br>At the very beginning of his reign he besieged and took the city of Samaria (<a href=\"#\" onClick=\"return mV('2Ki',17,6);\">2Ki 17:6</a>; <a href=\"#\" onClick=\"return mV('2Ki',18,'9-12');\">18:9-12</a>). On an inscription found in the palace he built at Khorsabad, near Nieveh, he says, \"The city of Samaria I besieged, I took; 27,280 of its inhabitants I carried away; fifty chariots that were among them I collected,\" etc. The northern kingdom he changed into an Assyrian satrapy. He afterwards drove Merodach-baladan (q.v.), who kept him at bay for twelve years, out of Babylon, which he entered in triumph. By a succession of victories he gradually enlarged and consolidated the empire, which now extended from the frontiers of Egypt in the west to the mountains of Elam in the east, and thus carried almost to completion the ambitious designs of Tiglath-pileser (q.v.). He was murdered by one of his own soldiers (B.C. 705) in his palace at Khorsabad, after a reign of sixteen years, and was succeeded by his son Sennacherib.";
eastonArray["$$T0003228"] = "<strong>Satan:</strong> adversary; accuser. When used as a proper name, the Hebrew word so rendered has the article \"the adversary\" (<a href=\"#\" onClick=\"return mV('Job',1,'6-12');\">Job 1:6-12</a>; <a href=\"#\" onClick=\"return mV('Job',2,'1-7');\">2:1-7</a>). In the New Testament it is used as interchangeable with Diabolos, or the devil, and is so used more than thirty times.<br><br>He is also called \"the dragon,\" \"the old serpent\" (<a href=\"#\" onClick=\"return mV('Rev',12,9);\">Rev 12:9</a>; <a href=\"#\" onClick=\"return mV('Rev',20,2);\">20:2</a>); \"the prince of this world\" (<a href=\"#\" onClick=\"return mV('Jhn',12,31);\">Jhn 12:31</a>; <a href=\"#\" onClick=\"return mV('Jhn',14,30);\">14:30</a>); \"the prince of the power of the air\" (<a href=\"#\" onClick=\"return mV('Eph',2,2);\">Eph 2:2</a>); \"the god of this world\" (<a href=\"#\" onClick=\"return mV('2Cr',4,4);\">2Cr 4:4</a>); \"the spirit that now worketh in the children of disobedience\" (<a href=\"#\" onClick=\"return mV('Eph',2,2);\">Eph 2:2</a>). The distinct personality of Satan and his activity among men are thus obviously recognized. He tempted our Lord in the wilderness (<a href=\"#\" onClick=\"return mV('Mat',4,'1-11');\">Mat 4:1-11</a>). He is \"Beelzebub, the prince of the devils\" (<a href=\"#\" onClick=\"return mV('Mat',12,24);\">12:24</a>). He is \"the constant enemy of God, of Christ, of the divine kingdom, of the followers of Christ, and of all truth; full of falsehood and all malice, and exciting and seducing to evil in every possible way.\" His power is very great in the world. He is a \"roaring lion, seeking whom he may devour\" (<a href=\"#\" onClick=\"return mV('1Pe',5,8);\">1Pe 5:8</a>). Men are said to be \"taken captive by him\" (<a href=\"#\" onClick=\"return mV('2Ti',2,26);\">2Ti 2:26</a>). Christians are warned against his \"devices\" (<a href=\"#\" onClick=\"return mV('2Cr',2,11);\">2Cr 2:11</a>), and called on to \"resist\" him (<a href=\"#\" onClick=\"return mV('Jam',4,7);\">Jam 4:7</a>). Christ redeems his people from \"him that had the power of death, that is, the devil\" (<a href=\"#\" onClick=\"return mV('Hbr',2,14);\">Hbr 2:14</a>). Satan has the \"power of death,\" not as lord, but simply as executioner.";
eastonArray["$$T0003229"] = "<strong>Satyr:</strong> hairy one. Mentioned in Greek mythology as a creature composed of a man and a goat, supposed to inhabit wild and desolate regions. The Hebrew word is rendered also \"goat\" (<a href=\"#\" onClick=\"return mV('Lev',4,24);\">Lev 4:24</a>) and \"devil\", i.e., an idol in the form of a goat (<a href=\"#\" onClick=\"return mV('Lev',17,7);\">17:7</a>; <a href=\"#\" onClick=\"return mV('2Ch',11,15);\">2Ch 11:15</a>). When it is said (<a href=\"#\" onClick=\"return mV('Isa',13,21);\">Isa 13:21</a>; <a href=\"#\" onClick=\"return mV('Isa',34,14);\">Isa 34:14</a>) \"the satyrs shall dance there,\" the meaning is that the place referred to shall become a desolate waste. Some render the Hebrew word \"baboon,\" a species of which is found in Babylonia.";
eastonArray["$$T0003230"] = "<strong>Saul:</strong> asked for.<br><br>(1.) A king of Edom (<a href=\"#\" onClick=\"return mV('Gen',36,37,38);\">Gen 36:37-38</a>); called Shaul in <a href=\"#\" onClick=\"return mV('1Ch',1,48);\">1Ch 1:48</a>.<br><br>(2.) The son of Kish (probably his only son, and a child of prayer, \"asked for\"), of the tribe of Benjamin, the first king of the Jewish nation. The singular providential circumstances connected with his election as king are recorded in <a href=\"#\" onClick=\"return mV('1Sa',8,'1-');\">1Sa 8-10</a>. His father's she-asses had strayed, and Saul was sent with a servant to seek for them. Leaving his home at Gibeah (<a href=\"#\" onClick=\"return mV('1Sa',10,5);\">1Sa 10:5</a>, \"the hill of God,\" A.V.; lit., as in R.V. marg., \"Gibeah of God\"), Saul and his servant went toward the north-west over Mount Ephraim, and then turning north-east they came to \"the land of Shalisha,\" and thence eastward to the land of Shalim, and at length came to the district of Zuph, near Samuel's home at Ramah (<a href=\"#\" onClick=\"return mV('1Sa',9,'5-10');\">1Sa 9:5-10</a>). At this point Saul proposed to return from the three days' fruitless search, but his servant suggested that they should first consult the \"seer.\" Hearing that he was about to offer sacrifice, the two hastened into Ramah, and \"behold, Samuel came out against them,\" on his way to the \"bamah\", i.e., the \"height\", where sacrifice was to be offered; and in answer to Saul's question, \"Tell me, I pray thee, where the seer's house is,\" Samuel made himself known to him. Samuel had been divinely prepared for his coming (<a href=\"#\" onClick=\"return mV('1Sa',9,'15-17');\">1Sa 9:15</a>), and received Saul as his guest. He took him with him to the sacrifice, and then after the feast \"communed with Saul upon the top of the house\" of all that was in his heart. On the morrow Samuel \"took a vial of oil and poured it on his head,\" and anointed Saul as king over Israel (<a href=\"#\" onClick=\"return mV('1Sa',9,'25-');\">1Sa 9:25</a>-<a href=\"#\" onClick=\"return mV('1Sa',10,'1-8');\">10:8</a>), giving him three signs in confirmation of his call to be king. When Saul reached his home in Gibeah the last of these signs was fulfilled, and the Sprit of God came upon him, and \"he was turned into another man.\" The simple countryman was transformed into the king of Israel, a remarkable change suddenly took place in his whole demeanour, and the people said in their astonishment, as they looked on the stalwart son of Kish, \"Is Saul also among the prophets?\", a saying which passed into a \"proverb.\" (<a href=\"#\" onClick=\"return mV('1Sa',19,24);\">1Sa 19:24</a>.)<br><br>The intercourse between Saul and Samuel was as yet unknown to the people. The \"anointing\" had been in secret. But now the time had come when the transaction must be confirmed by the nation. Samuel accordingly summoned the people to a solemn assembly \"before the Lord\" at Mizpeh. Here the lot was drawn (<a href=\"#\" onClick=\"return mV('1Sa',10,'17-27');\">1Sa 10:17-27</a>), and it fell upon Saul, and when he was presented before them, the stateliest man in all Israel, the air was rent for the first time in Israel by the loud cry, \"God save the king!\" He now returned to his home in Gibeah, attended by a kind of bodyguard, \"a band of men whose hearts God had touched.\" On reaching his home he dismissed them, and resumed the quiet toils of his former life.<br><br>Soon after this, on hearing of the conduct of Nahash the Ammonite at Jabeshgilead (q.v.), an army out of all the tribes of Israel rallied at his summons to the trysting-place at Bezek, and he led them forth a great army to battle, gaining a complete victory over the Ammonite invaders at Jabesh (<a href=\"#\" onClick=\"return mV('1Sa',11,'1-11');\">1Sa 11:1-11</a>). Amid the universal joy occasioned by this victory he was now fully recognized as the king of Israel. At the invitation of Samuel \"all the people went to Gilgal, and there they made Saul king before the Lord in Gilgal.\" Samuel now officially anointed him as king (<a href=\"#\" onClick=\"return mV('1Sa',11,15);\">1Sa 11:15</a>). Although Samuel never ceased to be a judge in Israel, yet now his work in that capacity practically came to an end.<br><br>Saul now undertook the great and difficult enterprise of freeing the land from its hereditary enemies the Philistines, and for this end he gathered together an army of 3,000 men (<a href=\"#\" onClick=\"return mV('1Sa',13,1,2);\">1Sa 13:1-2</a>). The Philistines were encamped at Geba. Saul, with 2,000 men, occupied Michmash and Mount Bethel; while his son Jonathan, with 1,000 men, occupied Gibeah, to the south of Geba, and seemingly without any direction from his father \"smote\" the Philistines in Geba. Thus roused, the Philistines, who gathered an army of 30,000 chariots and 6,000 horsemen, and \"people as the sand which is on the sea-shore in multitude,\" encamped in Michmash, which Saul had evacuated for Gilgal. Saul now tarried for seven days in Gilgal before making any movement, as Samuel had appointed (<a href=\"#\" onClick=\"return mV('1Sa',10,8);\">10:8</a>); but becoming impatient on the seventh day, as it was drawing to a close, when he had made an end of offering the burnt offering, Samuel appeared and warned him of the fatal consequences of his act of disobedience, for he had not waited long enough (<a href=\"#\" onClick=\"return mV('1Sa',13,13,14);\">1Sa 13:13-14</a>).<br><br>When Saul, after Samuel's departure, went out from Gilgal with his 600 men, his followers having decreased to that number (<a href=\"#\" onClick=\"return mV('1Sa',13,15);\">1Sa 13:15</a>), against the Philistines at Michmash (q.v.), he had his head-quarters under a pomegrante tree at Migron, over against Michmash, the Wady esSuweinit alone intervening. Here at Gibeah-Geba Saul and his army rested, uncertain what to do. Jonathan became impatient, and with his armour-bearer planned an assault against the Philistines, unknown to Saul and the army (<a href=\"#\" onClick=\"return mV('1Sa',14,'1-15');\">1Sa 14:1-15</a>). Jonathan and his armour-bearer went down into the wady, and on their hands and knees climbed to the top of the narrow rocky ridge called Bozez, where was the outpost of the Philistine army. They surprised and then slew twenty of the Philistines, and immediately the whole host of the Philistines was thrown into disorder and fled in great terror. \"It was a very great trembling;\" a supernatural panic seized the host. Saul and his 600 men, a band which speedily increased to 10,000, perceiving the confusion, pursued the army of the Philistines, and the tide of battle rolled on as far as to Bethaven, halfway between Michmash and Bethel. The Philistines were totally routed. \"So the Lord saved Israel that day.\" While pursuing the Philistines, Saul rashly adjured the people, saying, \"Cursed be the man that eateth any food until evening.\" But though faint and weary, the Israelites \"smote the Philistines that day from Michmash to Aijalon\" (a distance of from 15 to 20 miles). Jonathan had, while passing through the wood in pursuit of the Philistines, tasted a little of the honeycomb which was abundant there (<a href=\"#\" onClick=\"return mV('1Sa',14,27);\">1Sa 14:27</a>). This was afterwards discovered by Saul (ver. <a href=\"#\" onClick=\"return mV('1Sa',14,42);\">42</a>), and he threatened to put his son to death. The people, however, interposed, saying, \"There shall not one hair of his head fall to the ground.\" He whom God had so signally owned, who had \"wrought this great salvation in Israel,\" must not die. \"Then Saul went up from following the Philistines: and the Philistines went to their own place\" (<a href=\"#\" onClick=\"return mV('1Sa',14,'24-46');\">1Sa 14:24-46</a>); and thus the campaign against the Philistines came to an end. This was Saul's second great military success.<br><br>Saul's reign, however, continued to be one of almost constant war against his enemies round about (<a href=\"#\" onClick=\"return mV('1Sa',14,47,48);\">1Sa 14:47-48</a>), in all of which he proved victorious. The war against the Amalekites is the only one which is recorded at length (<a href=\"#\" onClick=\"return mV('1Sa',15,'1-')\">1Sa 15</a>). These oldest and hereditary (<a href=\"#\" onClick=\"return mV('Exd',17,8);\">Exd 17:8</a>; <a href=\"#\" onClick=\"return mV('Num',14,'43-45');\">Num 14:43-45</a>) enemies of Israel occupied the territory to the south and south-west of Palestine. Samuel summoned Saul to execute the \"ban\" which God had pronounced (<a href=\"#\" onClick=\"return mV('Deu',25,'17-19');\">Deu 25:17-19</a>) on this cruel and relentless foe of Israel. The cup of their iniquity was now full. This command was \"the test of his moral qualification for being king.\" Saul proceeded to execute the divine command; and gathering the people together, marched from Telaim (<a href=\"#\" onClick=\"return mV('1Sa',15,4);\">1Sa 15:4</a>) against the Amalekites, whom he smote \"from Havilah until thou comest to Shur,\" utterly destroying \"all the people with the edge of the sword\", i.e., all that fell into his hands. He was, however, guilty of rebellion and disobedience in sparing Agag their king, and in conniving at his soldiers' sparing the best of the sheep and cattle; and Samuel, following Saul to Gilgal, in the Jordan valley, said unto him, \"Because thou hast rejected the word of the Lord, he also hath rejected thee from being king\" (<a href=\"#\" onClick=\"return mV('1Sa',15,23);\">1Sa 15:23</a>). The kingdom was rent from Saul and was given to another, even to David, whom the Lord chose to be Saul's successor, and whom Samuel anointed (<a href=\"#\" onClick=\"return mV('1Sa',16,'1-13');\">1Sa 16:1-13</a>). From that day \"the spirit of the Lord departed from Saul, and an evil spirit from the Lord troubled him.\" He and Samuel parted only to meet once again at one of the schools of the prophets.<br><br>David was now sent for as a \"cunning player on an harp\" (<a href=\"#\" onClick=\"return mV('1Sa',16,16,18);\">1Sa 16:16, 18</a>), to play before Saul when the evil spirit troubled him, and thus was introduced to the court of Saul. He became a great favourite with the king. At length David returned to his father's house and to his wonted avocation as a shepherd for perhaps some three years. The Philistines once more invaded the land, and gathered their army between Shochoh and Azekah, in Ephes-dammim, on the southern slope of the valley of Elah. Saul and the men of Israel went forth to meet them, and encamped on the northern slope of the same valley which lay between the two armies. It was here that David slew Goliath of Gath, the champion of the Philistines (<a href=\"#\" onClick=\"return mV('1Sa',17,'4-54');\">1Sa 17:4-54</a>), an exploit which led to the flight and utter defeat of the Philistine army. Saul now took David permanently into his service (<a href=\"#\" onClick=\"return mV('1Sa',18,2);\">1Sa 18:2</a>); but he became jealous of him (<a href=\"#\" onClick=\"return mV('1Sa',18,9);\">1Sa 18:9</a>), and on many occasions showed his enmity toward him (<a href=\"#\" onClick=\"return mV('1Sa',18,10,11);\">1Sa 18:10-11</a>), his enmity ripening into a purpose of murder which at different times he tried in vain to carry out.<br><br>After some time the Philistines \"gathered themselves together\" in the plain of Esdraelon, and pitched their camp at Shunem, on the slope of Little Hermon; and Saul \"gathered all Israel together,\" and \"pitched in Gilboa\" (<a href=\"#\" onClick=\"return mV('1Sa',28,'3-14');\">1Sa 28:3-14</a>). Being unable to discover the mind of the Lord, Saul, accompanied by two of his retinue, betook himself to the \"witch of Endor,\" some 7 or 8 miles distant. Here he was overwhelmed by the startling communication that was mysteriously made to him by Samuel (ver. <a href=\"#\" onClick=\"return mV('1Sa',28,'16-19');\">16-19</a>), who appeared to him. \"He fell straightway all along on the earth, and was sore afraid, because of the words of Samuel\" (ver. <a href=\"#\" onClick=\"return mV('1Sa',28,20;\">20</a>). The Philistine host \"fought against Israel: and the men of Israel fled before the Philistines, and fell down slain in Mount Gilboa\" (<a href=\"#\" onClick=\"return mV('1Sa',31,1);\">1Sa 31:1</a>). In his despair at the disaster that had befallen his army, Saul \"took a sword and fell upon it.\" And the Philistines on the morrow \"found Saul and his three sons fallen in Mount Gilboa.\" Having cut off his head, they sent it with his weapons to Philistia, and hung up the skull in the temple of Dagon at Ashdod. They suspended his headless body, with that of Jonathan, from the walls of Bethshan. The men of Jabesh-gilead afterwards removed the bodies from this position; and having burnt the flesh, they buried the bodies under a tree at Jabesh. The remains were, however, afterwards removed to the family sepulchre at Zelah (<a href=\"#\" onClick=\"return mV('2Sa',21,13,14);\">2Sa 21:13-14</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000982');\">DAVID</a>.)<br><br>(3.) \"Who is also called Paul\" (q.v.), the circumcision name of the apostle, given to him, perhaps, in memory of King Saul (<a href=\"#\" onClick=\"return mV('Act',7,58);\">Act 7:58</a>; <a href=\"#\" onClick=\"return mV('Act',8,1);\">8:1</a>; <a href=\"#\" onClick=\"return mV('Act',9,1);\">9:1</a>).";
eastonArray["$$T0003231"] = "<strong>Saviour:</strong> one who saves from any form or degree of evil. In its highest sense the word indicates the relation sustained by our Lord to his redeemed ones, he is their Saviour. The great message of the gospel is about salvation and the Saviour. It is the \"gospel of salvation.\" Faith in the Lord Jesus Christ secures to the sinner a personal interest in the work of redemption. Salvation is redemption made effectual to the individual by the power of the Holy Spirit.";
eastonArray["$$T0003232"] = "<strong>Scapegoat:</strong> <a href=\"#\" onClick=\"return mV('Lev',16,'8-26');\">Lev 16:8-26</a>; R.V., \"the goat for Azazel\" (q.v.), the name given to the goat which was taken away into the wilderness on the day of Atonement (<a href=\"#\" onClick=\"return mV('Lev',16,'20-22');\">Lev 16:20-22</a>). The priest made atonement over the scapegoat, laying Israel's guilt upon it, and then sent it away, the goat bearing \"upon him all their iniquities unto a land not inhabited.\"<br><br>At a later period an evasion or modification of the law of Moses was introduced by the Jews. \"The goat was conducted to a mountain named Tzuk, situated at a distance of ten Sabbath days' journey, or about six and a half English miles, from Jerusalem. At this place the Judean desert was supposed to commence; and the man in whose charge the goat was sent out, while setting him free, was instructed to push the unhappy beast down the slope of the mountain side, which was so steep as to insure the death of the goat, whose bones were broken by the fall. The reason of this barbarous custom was that on one occasion the scapegoat returned to Jerusalem after being set free, which was considered such an evil omen that its recurrence was prevented for the future by the death of the goat\" (Twenty-one Years' Work in the Holy Land). This mountain is now called el-Muntar.";
eastonArray["$$T0003233"] = "<strong>Scarlet:</strong> This dye was obtained by the Egyptians from the shell-fish <i>Carthamus tinctorius</i>; and by the Hebrews from the <i>Coccus ilicis</i>, an insect which infests oak trees, called kermes by the Arabians.<br><br>This colour was early known (<a href=\"#\" onClick=\"return mV('Gen',38,28);\">Gen 38:28</a>). It was one of the colours of the ephod (<a href=\"#\" onClick=\"return mV('Exd',28,6);\">Exd 28:6</a>), the girdle (<a href=\"#\" onClick=\"return mV('Exd',28,8);\">8</a>), and the breastplate (<a href=\"#\" onClick=\"return mV('Exd',28,15);\">15</a>) of the high priest. It is also mentioned in various other connections (<a href=\"#\" onClick=\"return mV('Jos',2,18);\">Jos 2:18</a>; <a href=\"#\" onClick=\"return mV('2Sa',1,24);\">2Sa 1:24</a>; <a href=\"#\" onClick=\"return mV('Lam',4,5);\">Lam 4:5</a>; <a href=\"#\" onClick=\"return mV('Nah',2,3);\">Nah 2:3</a>). A scarlet robe was in mockery placed on our Lord (<a href=\"#\" onClick=\"return mV('Mat',27,28);\">Mat 27:28</a>; <a href=\"#\" onClick=\"return mV('Luk',23,11);\">Luk 23:11</a>). \"Sins as scarlet\" (<a href=\"#\" onClick=\"return mV('Isa',1,18);\">Isa 1:18</a>), i.e., as scarlet robes \"glaring and habitual.\" Scarlet and crimson were the firmest of dyes, and thus not easily washed out.";
eastonArray["$$T0003234"] = "<strong>Sceptre:</strong> (Heb. shebet = Gr. skeptron), properly a staff or rod. As a symbol of authority, the use of the sceptre originated in the idea that the ruler was as a shepherd of his people (<a href=\"#\" onClick=\"return mV('Gen',49,10);\">Gen 49:10</a>; <a href=\"#\" onClick=\"return mV('Num',24,17);\">Num 24:17</a>; <a href=\"#\" onClick=\"return mV('Psa',45,6);\">Psa 45:6</a>; <a href=\"#\" onClick=\"return mV('Isa',14,5);\">Isa 14:5</a>). There is no example on record of a sceptre having ever been actually handled by a Jewish king.";
eastonArray["$$T0003235"] = "<strong>Sceva:</strong> an implement, a Jew, chief of the priests at Ephesus (<a href=\"#\" onClick=\"return mV('Act',19,'13-16');\">Act 19:13-16</a>); i.e., the head of one of the twenty-four courses of the house of Levi. He had seven sons, who \"took upon them to call over them which had evil spirits the name of the Lord Jesus,\" in imitation of Paul. They tried their method of exorcism on a fierce demoniac, and failed. His answer to them was to this effect (<a href=\"#\" onClick=\"return mV('Act',19,15);\">19:15</a>): \"The Jesus whom you invoke is One whose authority I acknowledge; and the Paul whom you name I recognize to be a servant or messenger of God; but what sort of men are ye who have been empowered to act as you do by neither?\" (Lindsay on the Acts of the Apostles.)";
eastonArray["$$T0003236"] = "<strong>Schism:</strong> a separation, an alienation causing divisions among Christians, who ought to be united (<a href=\"#\" onClick=\"return mV('1Cr',12,25);\">1Cr 12:25</a>).";
eastonArray["$$T0003237"] = "<strong>Schoolmaster:</strong> the law so designated by Paul (<a href=\"#\" onClick=\"return mV('Gal',3,24,25);\">Gal 3:24-25</a>). As so used, the word does not mean teacher, but pedagogue (shortened into the modern page), i.e., one who was intrusted with the supervision of a family, taking them to and from the school, being responsible for their safety and manners. Hence the pedagogue was stern and severe in his discipline. Thus the law was a pedagogue to the Jews, with a view to Christ, i.e., to prepare for faith in Christ by producing convictions of guilt and helplessness. The office of the pedagogue ceased when \"faith came\", i.e., the object of that faith, the seed, which is Christ.";
eastonArray["$$T0003238"] = "<strong>Schools of the Prophets:</strong> (<a href=\"#\" onClick=\"return mV('1Sa',19,'18-24');\">1Sa 19:18-24</a>; <a href=\"#\" onClick=\"return mV('2Ki',2,3,5,7,12,15);\">2Ki 2:3, 5, 7, 12, 15</a>) were instituted for the purpose of training young men for the prophetical and priestly offices. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003006');\">PROPHET</a>; <a href=\"#\" onClick=\"return doDictLookup ('ET0003209');\">SAMUEL</a>.)";
eastonArray["$$T0003239"] = "<strong>Scorpions:</strong> mentioned along with serpents (<a href=\"#\" onClick=\"return mV('Deu',8,15);\">Deu 8:15</a>). Used also figuratively to denote wicked persons (<a href=\"#\" onClick=\"return mV('Eze',2,6);\">Eze 2:6</a>; <a href=\"#\" onClick=\"return mV('Luk',10,19);\">Luk 10:19</a>); also a particular kind of scourge or whip (<a href=\"#\" onClick=\"return mV('1Ki',12,11);\">1Ki 12:11</a>). Scorpions were a species of spider. They abounded in the Jordan valley.";
eastonArray["$$T0003240"] = "<strong>Scourging:</strong> (<a href=\"#\" onClick=\"return mV('1Ki',12,11);\">1Ki 12:11</a>). Variously administered. In no case were the stripes to exceed forty (<a href=\"#\" onClick=\"return mV('Deu',25,3);\">Deu 25:3</a>; <a href=\"#\" onClick=\"return mV('2Cr',11,24);\">2Cr 11:24</a>). In the time of the apostles, in consequence of the passing of what was called the Porcian law, no Roman citizen could be scourged in any case (<a href=\"#\" onClick=\"return mV('Act',16,'22-37');\">Act 16:22-37</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000469');\">BASTINADO</a>.) In the scourging of our Lord (<a href=\"#\" onClick=\"return mV('Mat',27,26);\">Mat 27:26</a>; <a href=\"#\" onClick=\"return mV('Mar',15,15);\">Mar 15:15</a>) the words of prophecy (<a href=\"#\" onClick=\"return mV('Isa',53,5);\">Isa 53:5</a>) were fulfilled.";
eastonArray["$$T0003241"] = "<strong>Scribes:</strong> anciently held various important offices in the public affairs of the nation. The Hebrew word so rendered (sopher) is first used to designate the holder of some military office (<a href=\"#\" onClick=\"return mV('Jdg',5,14);\">Jdg 5:14</a>; A.V., \"pen of the writer; \" R.V., \"the marshal's staff; \" marg., \"the staff of the scribe\"). The scribes acted as secretaries of state, whose business it was to prepare and issue decrees in the name of the king (<a href=\"#\" onClick=\"return mV('2Sa',8,17);\">2Sa 8:17</a>; <a href=\"#\" onClick=\"return mV('2Sa',20,25);\">20:25</a>; <a href=\"#\" onClick=\"return mV('1Ch',18,16);\">1Ch 18:16</a>; <a href=\"#\" onClick=\"return mV('1Ch',24,6);\">24:6</a>; <a href=\"#\" onClick=\"return mV('1Ki',4,3);\">1Ki 4:3</a>; <a href=\"#\" onClick=\"return mV('2Ki',12,'9-11');\">2Ki 12:9-11</a>; <a href=\"#\" onClick=\"return mV('2Ki',18,'18-37');\">18:18-37</a>, etc.). They discharged various other important public duties as men of high authority and influence in the affairs of state.<br><br>There was also a subordinate class of scribes, most of whom were Levites. They were engaged in various ways as writers. Such, for example, was Baruch, who \"wrote from the mouth of Jeremiah all the words of the Lord\" (<a href=\"#\" onClick=\"return mV('Jer',36,4,32);\">Jer 36:4, 32</a>).<br><br>In later times, after the Captivity, when the nation lost its independence, the scribes turned their attention to the law, gaining for themselves distinction by their intimate acquaintance with its contents. On them devolved the duty of multiplying copies of the law and of teaching it to others (<a href=\"#\" onClick=\"return mV('Ezr',7,6,'10-12');\">Ezr 7:6, 10-12</a>; <a href=\"#\" onClick=\"return mV('Neh',8,1,4,9,13);\">Neh 8:1, 4, 9, 13</a>). It is evident that in New Testament times the scribes belonged to the sect of the Pharisees, who supplemented the ancient written law by their traditions (<a href=\"#\" onClick=\"return mV('Mat',23,'1-')\">Mat 23</a>), thereby obscuring it and rendering it of none effect. The titles \"scribes\" and \"lawyers\" (q.v.) are in the Gospels interchangeable (<a href=\"#\" onClick=\"return mV('Mat',22,35);\">Mat 22:35</a>; <a href=\"#\" onClick=\"return mV('Mar',12,28);\">Mar 12:28</a>; <a href=\"#\" onClick=\"return mV('Luk',20,39);\">Luk 20:39</a>, etc.). They were in the time of our Lord the public teachers of the people, and frequently came into collision with him. They afterwards showed themselves greatly hostile to the apostles (<a href=\"#\" onClick=\"return mV('Act',4,5);\">Act 4:5</a>; <a href=\"#\" onClick=\"return mV('Act',6,12);\">6:12</a>).<br><br>Some of the scribes, however, were men of a different spirit, and showed themselves friendly to the gospel and its preachers. Thus Gamaliel advised the Sanhedrin, when the apostles were before them charged with \"teaching in this name,\" to \"refrain from these men and let them alone\" (<a href=\"#\" onClick=\"return mV('Act',5,'34-39');\">Act 5:34-39</a>; <a href=\"#\" onClick=\"return mV('Act',23,9);\">Act 23:9</a>).";
eastonArray["$$T0003242"] = "<strong>Scrip:</strong> a small bag or wallet usually fastened to the girdle (<a href=\"#\" onClick=\"return mV('1Sa',17,40);\">1Sa 17:40</a>); \"a shepherd's bag.\"<br><br>In the New Testament it is the rendering of Gr. pera, which was a bag carried by travellers and shepherds, generally made of skin (<a href=\"#\" onClick=\"return mV('Mat',10,10);\">Mat 10:10</a>; <a href=\"#\" onClick=\"return mV('Mar',6,8);\">Mar 6:8</a>; <a href=\"#\" onClick=\"return mV('Luk',9,3);\">Luk 9:3</a>; <a href=\"#\" onClick=\"return mV('Luk',10,4);\">10:4</a>). The name \"scrip\" is meant to denote that the bag was intended to hold scraps, fragments, as if scraped off from larger articles, trifles.";
eastonArray["$$T0003243"] = "<strong>Scripture:</strong> invariably in the New Testament denotes that definite collection of sacred books, regarded as given by inspiration of God, which we usually call the Old Testament (<a href=\"#\" onClick=\"return mV('2Ti',3,15,16);\">2Ti 3:15-16</a>; <a href=\"#\" onClick=\"return mV('Jhn',20,9);\">Jhn 20:9</a>; <a href=\"#\" onClick=\"return mV('Gal',3,22);\">Gal 3:22</a>; <a href=\"#\" onClick=\"return mV('2Pe',1,20);\">2Pe 1:20</a>). It was God's purpose thus to perpetuate his revealed will. From time to time he raised up men to commit to writing in an infallible record the revelation he gave. The \"Scripture,\" or collection of sacred writings, was thus enlarged from time to time as God saw necessary. We have now a completed \"Scripture,\" consisting of the Old and New Testaments. The Old Testament canon in the time of our Lord was precisely the same as that which we now possess under that name. He placed the seal of his own authority on this collection of writings, as all equally given by inspiration (<a href=\"#\" onClick=\"return mV('Mat',5,17);\">Mat 5:17</a>; <a href=\"#\" onClick=\"return mV('Mat',7,12);\">7:12</a>; <a href=\"#\" onClick=\"return mV('Mat',22,40);\">22:40</a>; <a href=\"#\" onClick=\"return mV('Luk',16,29,31);\">Luk 16:29, 31</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000580');\">BIBLE</a>; <a href=\"#\" onClick=\"return doDictLookup ('ET0000714');\">CANON</a>.)";
eastonArray["$$T0003244"] = "<strong>Scythian:</strong> The Scythians consisted of \"all the pastoral tribes who dwelt to the north of the Black Sea and the Caspian, and were scattered far away toward the east. Of this vast country but little was anciently known. Its modern representative is Russia, which, to a great extent, includes the same territories.\" They were the descendants of Japheth (<a href=\"#\" onClick=\"return mV('Gen',9,27);\">Gen 9:27</a>). It appears that in apostolic times there were some of this people that embraced Christianity (<a href=\"#\" onClick=\"return mV('Col',3,11);\">Col 3:11</a>).";
eastonArray["$$T0003245"] = "<strong>Seah:</strong> In land measure, a space of 50 cubits long by 50 broad. In measure of capacity, a seah was a little over one peck. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002453');\">MEASURE</a>.)";
eastonArray["$$T0003246"] = "<strong>Seal:</strong> commonly a ring engraved with some device (<a href=\"#\" onClick=\"return mV('Gen',38,18,25);\">Gen 38:18, 25</a>). Jezebel \"wrote letters in Ahab's name, and sealed them with his seal\" (<a href=\"#\" onClick=\"return mV('1Ki',21,8);\">1Ki 21:8</a>). Seals are frequently mentioned in Jewish history (<a href=\"#\" onClick=\"return mV('Deu',32,34);\">Deu 32:34</a>; <a href=\"#\" onClick=\"return mV('Neh',9,38);\">Neh 9:38</a>; <a href=\"#\" onClick=\"return mV('Neh',10,1);\">10:1</a>; <a href=\"#\" onClick=\"return mV('Est',3,12);\">Est 3:12</a>; <a href=\"#\" onClick=\"return mV('Sgs',8,6);\">Sgs 8:6</a>; <a href=\"#\" onClick=\"return mV('Isa',8,16);\">Isa 8:16</a>; <a href=\"#\" onClick=\"return mV('Jer',22,24);\">Jer 22:24</a>; <a href=\"#\" onClick=\"return mV('Jer',32,44);\">32:44</a>, etc.). Sealing a document was equivalent to the signature of the owner of the seal. \"The use of a signet-ring by the monarch has recently received a remarkable illustration by the discovery of an impression of such a signet on fine clay at Koyunjik, the site of the ancient Nineveh. This seal appears to have been impressed from the bezel of a metallic finger-ring. It is an oval, 2 inches in length by 1 inch wide, and bears the image, name, and titles of the Egyptian king Sabaco\" (Rawlinson's Hist. Illus. of the O.T., p. 46). The actual signet-rings of two Egyptian kings (Cheops and Horus) have been discovered. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003426');\">SIGNET</a>.)<br><br>The use of seals is mentioned in the New Testament only in connection with the record of our Lord's burial (<a href=\"#\" onClick=\"return mV('Mat',27,66);\">Mat 27:66</a>). The tomb was sealed by the Pharisees and chief priests for the purpose of making sure that the disciples would not come and steal the body away (ver. <a href=\"#\" onClick=\"return mV('Mat',27,63,64);\">63, 64</a>). The mode of doing this was probably by stretching a cord across the stone and sealing it at both ends with sealing-clay. When God is said to have sealed the Redeemer, the meaning is, that he has attested his divine mission (<a href=\"#\" onClick=\"return mV('Jhn',6,27);\">Jhn 6:27</a>). Circumcision is a seal, an attestation of the covenant (<a href=\"#\" onClick=\"return mV('Rom',4,11);\">Rom 4:11</a>). Believers are sealed with the Spirit, as God's mark put upon them (<a href=\"#\" onClick=\"return mV('Eph',1,13);\">Eph 1:13</a>; <a href=\"#\" onClick=\"return mV('Eph',4,30);\">4:30</a>). Converts are by Paul styled the seal of his apostleship, i.e., they are its attestation (<a href=\"#\" onClick=\"return mV('1Cr',9,2);\">1Cr 9:2</a>). Seals and sealing are frequently mentioned in the book of Revelation (<a href=\"#\" onClick=\"return mV('Rev',5,1);\">Rev 5:1</a>; <a href=\"#\" onClick=\"return mV('Rev',6,1);\">6:1</a>; <a href=\"#\" onClick=\"return mV('Rev',7,3);\">7:3</a>; <a href=\"#\" onClick=\"return mV('Rev',10,4);\">10:4</a>; <a href=\"#\" onClick=\"return mV('Rev',22,10);\">22:10</a>).";
eastonArray["$$T0003247"] = "<strong>Sea of glass:</strong> a figurative expression used in <a href=\"#\" onClick=\"return mV('Rev',4,6);\">Rev 4:6</a> and <a href=\"#\" onClick=\"return mV('Rev',15,2);\">Rev 15:2</a>. According to the interpretation of some, \"this calm, glass-like sea, which is never in storm, but only interfused with flame, represents the counsels of God, those purposes of righteousness and love which are often fathomless but never obscure, always the same, though sometimes glowing with holy anger.\" (<a href=\"#\" onClick=\"return mV('Psa',36,6);\">Psa 36:6</a>; <a href=\"#\" onClick=\"return mV('Psa',77,19);\">77:19</a>; <a href=\"#\" onClick=\"return mV('Rom',11,'33-36');\">Rom 11:33-36</a>.)";
eastonArray["$$T0003248"] = "<strong>Sea of Jazer:</strong> (<a href=\"#\" onClick=\"return mV('Jer',48,32);\">Jer 48:32</a>), a lake, now represented by some ponds in the high valley in which the Ammonite city of Jazer lies, the ruins of which are called Sar.";
eastonArray["$$T0003249"] = "<strong>Seasons:</strong> (<a href=\"#\" onClick=\"return mV('Gen',8,22);\">Gen 8:22</a>). See  <a href=\"#\" onClick=\"return doDictLookup ('ET0000124');\">AGRICULTURE</a>; <a href=\"#\" onClick=\"return doDictLookup ('ET0002592');\">MONTH</a>.";
