<script>var eastonArray = new Array ();
eastonArray["$$T0002500"] = "<strong>Merodach:</strong> death; slaughter, the name of a Babylonian god, probably the planet Mars (<a href=\"#\" onClick=\"return mV('Jer',50,2);\">Jer 50:2</a>), or it may be another name of Bel, the guardian divinity of Babylon. This name frequently occurs as a surname to the kings of Assyria and Babylon.";
eastonArray["$$T0002501"] = "<strong>Merodach-baladan:</strong> Merodach has given a son, (<a href=\"#\" onClick=\"return mV('Isa',39,1);\">Isa 39:1</a>), \"the hereditary chief of the Chaldeans, a small tribe at that time settled in the marshes at the mouth of the Euphrates, but in consequence of his conquest of Babylon afterwards, they became the dominant caste in Babylonia itself.\" One bearing this name sent ambassadors to Hezekiah (B.C. 721). He is also called Berodach-baladan (<a href=\"#\" onClick=\"return mV('2Ki',20,12);\">2Ki 20:12</a>; <a href=\"#\" onClick=\"return mV('2Ch',20,31);\">2Ch 20:31</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001771');\">HEZEKIAH</a>.)";
eastonArray["$$T0002502"] = "<strong>Merom:</strong> height, a lake in Northern Palestine through which the Jordan flows. It was the scene of the third and last great victory gained by Joshua over the Canaanites (<a href=\"#\" onClick=\"return mV('Jos',11,'5-7');\">Jos 11:5-7</a>). It is not again mentioned in Scripture. Its modern name is Bakrat el-Huleh. \"The Ard el-Huleh, the centre of which the lake occupies, is a nearly level plain of 16 miles in length from north to south, and its breadth from east to west is from 7 to 8 miles. On the west it is walled in by the steep and lofty range of the hills of Kedesh-Naphtali; on the east it is bounded by the lower and more gradually ascending slopes of Bashan; on the north it is shut in by a line of hills hummocky and irregular in shape and of no great height, and stretching across from the mountains of Naphtali to the roots of Mount Hermon, which towers up at the north-eastern angle of the plain to a height of 10,000 feet. At its southern extremity the plain is similarly traversed by elevated and broken ground, through which, by deep and narrow clefts, the Jordan, after passing through Lake Huleh, makes its rapid descent to the Sea of Galilee.\"<br><br>The lake is triangular in form, about 4 1/2 miles in length by 3 1/2 at its greatest breadth. Its surface is 7 feet above that of the Mediterranean. It is surrounded by a morass, which is thickly covered with canes and papyrus reeds, which are impenetrable. Macgregor with his canoe, the Rob Roy, was the first that ever, in modern times, sailed on its waters. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002112');\">JORDAN</a>.)";
eastonArray["$$T0002503"] = "<strong>Meronothite:</strong> a name given to Jehdeiah, the herdsman of the royal asses in the time of David and Solomon (<a href=\"#\" onClick=\"return mV('1Ch',27,30);\">1Ch 27:30</a>), probably as one being a native of some unknown town called Meronoth.";
eastonArray["$$T0002504"] = "<strong>Meroz:</strong> a plain in the north of Palestine, the inhabitants of which were severely condemned because they came not to help Barak against Sisera (<a href=\"#\" onClick=\"return mV('Jdg',5,23);\">Jdg 5:23</a>: comp. <a href=\"#\" onClick=\"return mV('Jdg',21,'8-10');\">21:8-10</a>; <a href=\"#\" onClick=\"return mV('1Sa',11,7);\">1Sa 11:7</a>). It has been identified with Marassus, on a knoll to the north of Wady Jalud, but nothing certainly is known of it. Like Chorazin, it is only mentioned in Scripture in connection with the curse pronounced upon it.";
eastonArray["$$T0002505"] = "<strong>Mesha:</strong> middle district, Vulgate, Messa.<br><br>(1.) A plain in that part of the boundaries of Arabia inhabited by the descendants of Joktan (<a href=\"#\" onClick=\"return mV('Gen',10,30);\">Gen 10:30</a>).<br><br>(2.) Heb. meysh'a, \"deliverance,\" the eldest son of Caleb (<a href=\"#\" onClick=\"return mV('1Ch',2,42);\">1Ch 2:42</a>), and brother of Jerahmeel.<br><br>(3.) Heb. id, a king of Moab, the son of Chemosh-Gad, a man of great wealth in flocks and herds (<a href=\"#\" onClick=\"return mV('2Ki',3,4);\">2Ki 3:4</a>). After the death of Ahab at Ramoth-Gilead, Mesha shook off the yoke of Israel; but on the ascension of Jehoram to the throne of Israel, that king sought the help of Jehoshaphat in an attempt to reduce the Moabites again to their former condition. The united armies of the two kings came unexpectedly on the army of the Moabites, and gained over them an easy victory. The whole land was devastated by the conquering armies, and Mesha sought refuge in his last stronghold, Kir-harasheth (q.v.). Reduced to despair, he ascended the wall of the city, and there, in the sight of the allied armies, offered his first-born son a sacrifice to Chemosh, the fire-god of the Moabites. This fearful spectacle filled the beholders with horror, and they retired from before the besieged city, and recrossed the Jordan laden with spoil (<a href=\"#\" onClick=\"return mV('2Ki',3,'25-27');\">2Ki 3:25-27</a>).<br><br>The exploits of Mesha are recorded in the Phoenician inscription on a block of black basalt found at Dibon, in Moab, usually called the \"Moabite stone\" (q.v.).";
eastonArray["$$T0002506"] = "<strong>Meshach:</strong> the title given to Mishael, one of the three Hebrew youths who were under training at the Babylonian court for the rank of Magi (<a href=\"#\" onClick=\"return mV('Dan',1,7);\">Dan 1:7</a>; <a href=\"#\" onClick=\"return mV('Dan',2,49);\">2:49</a>; <a href=\"#\" onClick=\"return mV('Dan',3,'12-30');\">3:12-30</a>). This was probably the name of some Chaldean god.";
eastonArray["$$T0002507"] = "<strong>Meshech:</strong> drawing out, the sixth son of Japheth (<a href=\"#\" onClick=\"return mV('Gen',10,2);\">Gen 10:2</a>), the founder of a tribe (<a href=\"#\" onClick=\"return mV('1Ch',1,5);\">1Ch 1:5</a>; <a href=\"#\" onClick=\"return mV('Eze',27,13);\">Eze 27:13</a>; <a href=\"#\" onClick=\"return mV('Eze',38,2,3);\">38:2-3</a>). They were in all probability the Moschi, a people inhabiting the Moschian Mountains, between the Black and the Caspian Seas. In <a href=\"#\" onClick=\"return mV('Psa',120,5);\">Psa 120:5</a> the name occurs as simply a synonym for foreigners or barbarians. \"During the ascendency of the Babylonians and Persians in Western Asia, the Moschi were subdued; but it seems probable that a large number of them crossed the Caucasus range and spread over the northern steppes, mingling with the Scythians. There they became known as Muscovs, and gave that name to the Russian nation and its ancient capital by which they are still generally known throughout the East\"";
eastonArray["$$T0002508"] = "<strong>Meshelemiah:</strong> friendship of Jehovah, a Levite of the family of the Korhites, called also Shelemiah (<a href=\"#\" onClick=\"return mV('1Ch',9,21);\">1Ch 9:21</a>; <a href=\"#\" onClick=\"return mV('1Ch',26,1,2,9,14);\">26:1-2, 9, 14</a>). He was a temple gate-keeper in the time of David.";
eastonArray["$$T0002509"] = "<strong>Meshillemoth:</strong> requitals.<br><br>(1.) The father of Berechiah (<a href=\"#\" onClick=\"return mV('2Ch',28,12);\">2Ch 28:12</a>).<br><br>(2.) A priest, the son of Immer (<a href=\"#\" onClick=\"return mV('Neh',11,13);\">Neh 11:13</a>).";
eastonArray["$$T0002510"] = "<strong>Meshullam:</strong> befriended.<br><br>(1.) One of the chief Gadites in Bashan in the time of Jotham (<a href=\"#\" onClick=\"return mV('1Ch',5,13);\">1Ch 5:13</a>).<br><br>(2.) Grandfather of Shaphan, \"the scribe,\" in the reign of Josiah (<a href=\"#\" onClick=\"return mV('2Ki',22,3);\">2Ki 22:3</a>).<br><br>(3.) A priest, father of Hilkiah (<a href=\"#\" onClick=\"return mV('1Ch',9,11);\">1Ch 9:11</a>; <a href=\"#\" onClick=\"return mV('Neh',11,11);\">Neh 11:11</a>), in the reign of Ammon; called Shallum in <a href=\"#\" onClick=\"return mV('1Ch',6,12);\">1Ch 6:12</a>.<br><br>(4.) A Levite of the family of Kohath (<a href=\"#\" onClick=\"return mV('2Ch',34,12);\">2Ch 34:12</a>), in the reign of Josiah.<br><br>(5.) <a href=\"#\" onClick=\"return mV('1Ch',8,17);\">1Ch 8:17</a>.<br><br>(6.) <a href=\"#\" onClick=\"return mV('1Ch',3,19);\">1Ch 3:19</a>.<br><br>(7.) <a href=\"#\" onClick=\"return mV('Neh',12,13);\">Neh 12:13</a>.<br><br>(8.) A chief priest (<a href=\"#\" onClick=\"return mV('Neh',12,16);\">Neh 12:16</a>).<br><br>(9.) One of the leading Levites in the time of Ezra (<a href=\"#\" onClick=\"return mV('Ezr',8,16);\">Ezr 8:16</a>).<br><br>(10.) A priest (<a href=\"#\" onClick=\"return mV('1Ch',9,12);\">1Ch 9:12</a>).<br><br>(11.) One of the principal Israelites who supported Ezra when expounding the law to the people (<a href=\"#\" onClick=\"return mV('Neh',8,4);\">Neh 8:4</a>).";
eastonArray["$$T0002511"] = "<strong>Meshullemeth:</strong> friend, the wife of Manasseh, and the mother of Amon (<a href=\"#\" onClick=\"return mV('2Ki',21,19);\">2Ki 21:19</a>), Kings of Judah.";
eastonArray["$$T0002512"] = "<strong>Mesopotamia:</strong> the country between the two rivers (Heb. Aram-naharaim; i.e., \"Syria of the two rivers\"), the name given by the Greeks and Romans to the region between the Euphrates and the Tigris (<a href=\"#\" onClick=\"return mV('Gen',24,10);\">Gen 24:10</a>; <a href=\"#\" onClick=\"return mV('Deu',23,4);\">Deu 23:4</a>; <a href=\"#\" onClick=\"return mV('Jdg',3,8,10);\">Jdg 3:8, 10</a>). In the Old Testament it is mentioned also under the name \"Padan-aram;\" i.e., the plain of Aram, or Syria (<a href=\"#\" onClick=\"return mV('Gen',25,20);\">Gen 25:20</a>). The northern portion of this fertile plateau was the original home of the ancestors of the Hebrews (<a href=\"#\" onClick=\"return mV('Gen',11,'1-')\">Gen 11</a>; <a href=\"#\" onClick=\"return mV('Act',7,2);\">Act 7:2</a>). From this region Isaac obtained his wife Rebecca (<a href=\"#\" onClick=\"return mV('Gen',24,10,15);\">Gen 24:10, 15</a>), and here also Jacob sojourned (<a href=\"#\" onClick=\"return mV('Gen',28,'2-7');\">28:2-7</a>) and obtained his wives, and here most of his sons were born (<a href=\"#\" onClick=\"return mV('Gen',35,26);\">35:26</a>; <a href=\"#\" onClick=\"return mV('Gen',46,15);\">46:15</a>). The petty, independent tribes of this region, each under its own prince, were warlike, and used chariots in battle. They maintained their independence till after the time of David, when they fell under the dominion of Assyria, and were absorbed into the empire (<a href=\"#\" onClick=\"return mV('2Ki',19,13);\">2Ki 19:13</a>).";
eastonArray["$$T0002513"] = "<strong>Mess:</strong> a portion of food given to a guest (<a href=\"#\" onClick=\"return mV('Gen',43,34);\">Gen 43:34</a>; <a href=\"#\" onClick=\"return mV('2Sa',11,8);\">2Sa 11:8</a>).";
eastonArray["$$T0002514"] = "<strong>Messenger:</strong> (Heb. mal'ak, Gr. angelos), an angel, a messenger who runs on foot, the bearer of despatches (<a href=\"#\" onClick=\"return mV('Job',1,14);\">Job 1:14</a>; <a href=\"#\" onClick=\"return mV('1Sa',11,7);\">1Sa 11:7</a>; <a href=\"#\" onClick=\"return mV('2Ch',36,22);\">2Ch 36:22</a>); swift of foot (<a href=\"#\" onClick=\"return mV('2Ki',9,18);\">2Ki 9:18</a>).";
eastonArray["$$T0002515"] = "<strong>Messiah:</strong> (Heb. mashiah), in all the thirty-nine instances of its occurring in the Old Testament, is rendered by the LXX. \"Christos.\" It means anointed. Thus priests (<a href=\"#\" onClick=\"return mV('Exd',28,41);\">Exd 28:41</a>; <a href=\"#\" onClick=\"return mV('Exd',40,15);\">40:15</a>; <a href=\"#\" onClick=\"return mV('Num',3,3);\">Num 3:3</a>), prophets (<a href=\"#\" onClick=\"return mV('1Ki',19,16);\">1Ki 19:16</a>), and kings (<a href=\"#\" onClick=\"return mV('1Sa',9,16);\">1Sa 9:16</a>; <a href=\"#\" onClick=\"return mV('1Sa',16,3);\">16:3</a>; <a href=\"#\" onClick=\"return mV('2Sa',12,7);\">2Sa 12:7</a>) were anointed with oil, and so consecrated to their respective offices. The great Messiah is anointed \"above his fellows\" (<a href=\"#\" onClick=\"return mV('Psa',45,7);\">Psa 45:7</a>); i.e., he embraces in himself all the three offices. The Greek form \"Messias\" is only twice used in the New Testament, in <a href=\"#\" onClick=\"return mV('Jhn',1,41);\">Jhn 1:41</a> and <a href=\"#\" onClick=\"return mV('Jhn',4,25);\">Jhn 4:25</a> (R.V., \"Messiah\"), and in the Old Testament the word Messiah, as the rendering of the Hebrew, occurs only twice (<a href=\"#\" onClick=\"return mV('Dan',9,25,26);\">Dan 9:25-26</a>; R.V., \"the anointed one\").<br><br>The first great promise (<a href=\"#\" onClick=\"return mV('Gen',3,15);\">Gen 3:15</a>) contains in it the germ of all the prophecies recorded in the Old Testament regarding the coming of the Messiah and the great work he was to accomplish on earth. The prophecies became more definite and fuller as the ages rolled on; the light shone more and more unto the perfect day. Different periods of prophetic revelation have been pointed out, <br><br>(1) the patriarchal;<br><br>(2) the Mosaic;<br><br>(3) the period of David;<br><br>(4) the period of prophetism, i.e., of those prophets whose works form a part of the Old Testament canon. The expectations of the Jews were thus kept alive from generation to generation, till the \"fulness of the times,\" when Messiah came, \"made of a woman, made under the law, to redeem them that were under the law.\" In him all these ancient prophecies have their fulfilment. Jesus of Nazareth is the Messiah, the great Deliverer who was to come. (<a href=\"#\" onClick=\"return mV('Mat',26,54);\">Mat 26:54</a>; <a href=\"#\" onClick=\"return mV('Mar',9,12);\">Mar 9:12</a>; <a href=\"#\" onClick=\"return mV('Luk',18,31);\">Luk 18:31</a>; <a href=\"#\" onClick=\"return mV('Luk',22,37);\">22:37</a>; <a href=\"#\" onClick=\"return mV('Jhn',5,39);\">Jhn 5:39</a>; <a href=\"#\" onClick=\"return mV('Act',2,'1-')\">Act 2</a>; <a href=\"#\" onClick=\"return mV('Act',16,31);\">16:31</a>; <a href=\"#\" onClick=\"return mV('Act',26,22,23);\">26:22-23</a>.)";
eastonArray["$$T0002516"] = "<strong>Metheg-ammah:</strong> bridle of the mother, a figurative name for a chief city, as in <a href=\"#\" onClick=\"return mV('2Sa',8,1);\">2Sa 8:1</a>, \"David took Metheg-ammah out of the hand of the Philistines\" (R.V., \"took the bridle of the mother-city\"); i.e., subdued their capital or strongest city, viz., Gath (<a href=\"#\" onClick=\"return mV('1Ch',18,1);\">1Ch 18:1</a>).";
eastonArray["$$T0002517"] = "<strong>Methusael:</strong> champion of El; man of God, a descendant of Cain (<a href=\"#\" onClick=\"return mV('Gen',4,18);\">Gen 4:18</a>), so called, perhaps, to denote that even among the descendants of Cain, God had not left himself without a witness.";
eastonArray["$$T0002518"] = "<strong>Methuselah:</strong> man of the dart, the son of Enoch, and grandfather of Noah. He was the oldest man of whom we have any record, dying at the age of nine hundred and sixty-nine years, in the year of the Flood (<a href=\"#\" onClick=\"return mV('Gen',5,'21-27');\">Gen 5:21-27</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,3);\">1Ch 1:3</a>).";
eastonArray["$$T0002519"] = "<strong>Mezahab:</strong> water of gold, the father of Matred (<a href=\"#\" onClick=\"return mV('Gen',36,39);\">Gen 36:39</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,50);\">1Ch 1:50</a>), and grandfather of Mehetabel, wife of Hadar, the last king of Edom.";
eastonArray["$$T0002520"] = "<strong>Miamin:</strong> =Mijamin, from the right hand.<br><br>(1.) The head of one of the divisions of the priests (<a href=\"#\" onClick=\"return mV('1Ch',24,9);\">1Ch 24:9</a>).<br><br>(2.) A chief priest who returned from Babylon with Zerubbabel (<a href=\"#\" onClick=\"return mV('Neh',12,5);\">Neh 12:5</a>), called Mijamin (<a href=\"#\" onClick=\"return mV('Neh',10,7);\">10:7</a>) and Miniamin (<a href=\"#\" onClick=\"return mV('Neh',12,17);\">12:17</a>).";
eastonArray["$$T0002521"] = "<strong>Mibhar:</strong> choice, a Hagarene, one of David's warriors (<a href=\"#\" onClick=\"return mV('1Ch',11,38);\">1Ch 11:38</a>); called also Bani the Gadite (<a href=\"#\" onClick=\"return mV('2Sa',23,36);\">2Sa 23:36</a>).";
eastonArray["$$T0002522"] = "<strong>Mibsam:</strong> fragrance.<br><br>(1.) One of Ishmael's twelve sons, and head of an Arab tribe (<a href=\"#\" onClick=\"return mV('Gen',25,13);\">Gen 25:13</a>).<br><br>(2.) A son of Simeon (<a href=\"#\" onClick=\"return mV('1Ch',4,25);\">1Ch 4:25</a>).";
eastonArray["$$T0002523"] = "<strong>Mibzar:</strong> fortress, one of the Edomitish \"dukes\" descended from Esau (<a href=\"#\" onClick=\"return mV('Gen',36,42);\">Gen 36:42</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,53);\">1Ch 1:53</a>).";
eastonArray["$$T0002524"] = "<strong>Micah:</strong> a shortened form of Micaiah, who is like Jehovah?<br><br>(1.) A man of Mount Ephraim, whose history so far is introduced in <a href=\"#\" onClick=\"return mV('Jdg',17,'1-');\">Jdg 17</a>, apparently for the purpose of leading to an account of the settlement of the tribe of Dan in Northern Palestine, and for the purpose also of illustrating the lawlessness of the times in which he lived (<a href=\"#\" onClick=\"return mV('Jdg',18,'1-')\">Jdg 18</a>; <a href=\"#\" onClick=\"return mV('Jdg',19,'1-29');\">19:1-29</a>; <a href=\"#\" onClick=\"return mV('Jdg',21,25);\">21:25</a>).<br><br>(2.) The son of Merib-baal (Mephibosheth), <a href=\"#\" onClick=\"return mV('1Ch',8,34,35);\">1Ch 8:34-35.<br><br>(3.) The first in rank of the priests of the family of Kohathites (<a href=\"#\" onClick=\"return mV('1Ch',23,20);\">1Ch 23:20</a>).<br><br>(4.) A descendant of Joel the Reubenite (<a href=\"#\" onClick=\"return mV('1Ch',5,5);\">1Ch 5:5</a>).<br><br>(5.) \"The Morasthite,\" so called to distinguish him from Micaiah, the son of Imlah (<a href=\"#\" onClick=\"return mV('1Ki',22,8);\">1Ki 22:8</a>). He was a prophet of Judah, a contemporary of Isaiah (<a href=\"#\" onClick=\"return mV('Mic',1,1);\">Mic 1:1</a>), a native of Moresheth of Gath (<a href=\"#\" onClick=\"return mV('Mic',1,14,15);\">1:14-15</a>). Very little is known of the circumstances of his life (<a href=\"#\" onClick=\"return mV('Jer',26,18,19);\">Jer 26:18-19</a>).";
eastonArray["$$T0002525"] = "<strong>Micah, Book of:</strong> the sixth in order of the so-called minor prophets. The superscription to this book states that the prophet exercised his office in the reigns of Jotham, Ahaz, and Hezekiah. If we reckon from the beginning of Jotham's reign to the end of Hezekiah's (B.C. 759-698), then he ministered for about fifty-nine years; but if we reckon from the death of Jotham to the accession of Hezekiah (B.C. 743-726), his ministry lasted only sixteen years. It has been noticed as remarkable that this book commences with the last words of another prophet, \"Micaiah the son of Imlah\" (<a href=\"#\" onClick=\"return mV('1Ki',22,28);\">1Ki 22:28</a>): \"Hearken, O people, every one of you.\"<br><br>The book consists of three sections, each commencing with a rebuke, \"Hear ye,\" etc., and closing with a promise, ([1] <a href=\"#\" onClick=\"return mV('Mic',1,'1-');\">Mic 1</a>; the people; [3] <a href=\"#\" onClick=\"return mV('Mic',6,'1-');\">Mic 6</a>; <a href=\"#\" onClick=\"return mV('Mic',7,'1-');\">7</a>), in which Jehovah is represented as <a href=\"#\" onClick=\"return mV('Mic',2,'1-')\">Mic 2</a>; [2] <a href=\"#\" onClick=\"return mV('Mic',3,'1-');\">Mic 3-5</a>, especially addressed to the princes and heads of the people; [3] <a href=\"#\" onClick=\"return mV('Mic',6,'1-');\">Mic 6</a>;-<a href=\"#\" onClick=\"return mV('Mic',7,'1-');\">7</a>), in which Jehovah is represented as holding a controversy with his people: the whole concluding with a song of triumph at the great deliverance which the Lord will achieve for his people. The closing verse is quoted in the song of Zacharias (<a href=\"#\" onClick=\"return mV('Luk',1,72,73);\">Luk 1:72-73</a>). The prediction regarding the place \"where Christ should be born,\" one of the most remarkable Messianic prophecies (<a href=\"#\" onClick=\"return mV('Mic',5,2);\">Mic 5:2</a>), is quoted in <a href=\"#\" onClick=\"return mV('Mat',2,6);\">Mat 2:6</a>.<br><br>There are the following references to this book in the New Testament:<br><br>(<a href=\"#\" onClick=\"return mV('Mic',5,2);\">Mic 5:2</a>; with <a href=\"#\" onClick=\"return mV('Mat',2,6);\">Mat 2:6</a>; <a href=\"#\" onClick=\"return mV('Jhn',7,42);\">Jhn 7:42</a>). (<a href=\"#\" onClick=\"return mV('Mic',7,6);\">Mic 7:6</a>; with <a href=\"#\" onClick=\"return mV('Mat',10,21,35,36);\">Mat 10:21, 35-36</a>). (<a href=\"#\" onClick=\"return mV('Mic',7,20);\">Mic 7:20</a>; with <a href=\"#\" onClick=\"return mV('Luk',1,72,73);\">Luk 1:72-73</a>).";
eastonArray["$$T0002526"] = "<strong>Micaiah:</strong> who is like Jehovah?, the son of Imlah, a faithful prophet of Samaria (<a href=\"#\" onClick=\"return mV('1Ki',22,'8-28');\">1Ki 22:8-28</a>). Three years after the great battle with Ben-hadad (<a href=\"#\" onClick=\"return mV('1Ki',20,'29-34');\">20:29-34</a>), Ahab proposed to Jehoshaphat, king of Judah, that they should go up against Ramoth-Gilead to do battle again with Ben-hadad. Jehoshaphat agreed, but suggested that inquiry should be first made \"at the word of Jehovah.\" Ahab's prophets approved of the expedition; but Jehoshaphat, still dissatisfied, asked if there was no other prophet besides the four hundred that had appeared, and was informed of this Micaiah. He was sent for from prison, where he had been confined, probably on account of some prediction disagreeable to Ahab; and he condemned the expedition, and prophesied that it would end, as it did, in disaster. We hear nothing further of this prophet. Some have supposed that he was the unnamed prophet referred to in <a href=\"#\" onClick=\"return mV('1Ki',20,'35-42');\">1Ki 20:35-42</a>.";
eastonArray["$$T0002527"] = "<strong>Micha:</strong><br><br>(1.) <a href=\"#\" onClick=\"return mV('2Sa',9,12);\">2Sa 9:12</a>=MICAH (2).<br><br>(2.) The son of Zabdi, a Levite of the family of Asaph (<a href=\"#\" onClick=\"return mV('Neh',11,17,22);\">Neh 11:17, 22</a>).";
eastonArray["$$T0002528"] = "<strong>Michael:</strong> who is like God?<br><br>(1.) The title given to one of the chief angels (<a href=\"#\" onClick=\"return mV('Dan',10,13,21);\">Dan 10:13, 21</a>; <a href=\"#\" onClick=\"return mV('Dan',12,1);\">12:1</a>). He had special charge of Israel as a nation. He disputed with Satan (<a href=\"#\" onClick=\"return mV('Jud',1,9);\">Jud 1:9</a>) about the body of Moses. He is also represented as warning against \"that old serpent, called the Devil, and Satan, which deceiveth the whole world\" (<a href=\"#\" onClick=\"return mV('Rev',12,'7-9');\">Rev 12:7-9</a>).<br><br>(2.) The father of Sethur, the spy selected to represent Asher (<a href=\"#\" onClick=\"return mV('Num',13,13);\">Num 13:13</a>).<br><br>(3.) <a href=\"#\" onClick=\"return mV('1Ch',7,3);\">1Ch 7:3</a>, a chief of the tribe of Issachar.<br><br>(4.) <a href=\"#\" onClick=\"return mV('1Ch',8,16);\">1Ch 8:16</a>, a Benjamite.<br><br>(5.) A chief Gadite in Bashan (<a href=\"#\" onClick=\"return mV('1Ch',5,13);\">1Ch 5:13</a>).<br><br>(6.) A Manassite, \"a captain of thousands\" who joined David at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,20);\">1Ch 12:20</a>).<br><br>(7.) A Gershonite Levite (<a href=\"#\" onClick=\"return mV('1Ch',6,40);\">1Ch 6:40</a>).<br><br>(8.) The father of Omri (<a href=\"#\" onClick=\"return mV('1Ch',27,18);\">1Ch 27:18</a>).<br><br>(9.) One of the sons of king Jehoshaphat (<a href=\"#\" onClick=\"return mV('2Ch',21,2,4);\">2Ch 21:2, 4</a>). He was murdered by his brother Jehoram.";
eastonArray["$$T0002529"] = "<strong>Michaiah:</strong><br><br>(1.) The queen-mother of King Abijah (<a href=\"#\" onClick=\"return mV('2Ch',13,2);\">2Ch 13:2</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002343');\">MAACAH [4]</a>).<br><br>(2.) One of those sent out by Jehoshaphat to instruct the people in the law (<a href=\"#\" onClick=\"return mV('2Ch',17,7);\">2Ch 17:7</a>).<br><br>(3.) <a href=\"#\" onClick=\"return mV('2Ki',22,12);\">2Ki 22:12</a>.<br><br>(4.) The son of Gemariah. He reported to the king's officers Jeremiah's prediction, which he had heard Baruch read (<a href=\"#\" onClick=\"return mV('Jer',36,11,13);\">Jer 36:11, 13</a>) from his father Gemariah's chamber in the temple.<br><br>(5.) A Levite (<a href=\"#\" onClick=\"return mV('Neh',12,35);\">Neh 12:35</a>).<br><br>(6.) A priest (<a href=\"#\" onClick=\"return mV('Neh',12,41);\">Neh 12:41</a>).";
eastonArray["$$T0002530"] = "<strong>Michal:</strong> rivulet, or who as God?, the younger of Saul's two daughters by his wife Ahinoam (<a href=\"#\" onClick=\"return mV('1Sa',14,49,50);\">1Sa 14:49-50</a>). \"Attracted by the graces of his person and the gallantry of his conduct, she fell in love with David and became his wife\" (<a href=\"#\" onClick=\"return mV('1Sa',18,'20-28');\">18:20-28</a>). She showed her affection for him by promoting his escape to Naioth when Saul sought his life (<a href=\"#\" onClick=\"return mV('1Sa',19,'12-17');\">1Sa 19:12-17</a>. Comp. <a href=\"#\" onClick=\"return mV('Psa',59,'1-');\">Psa 59</a>. See <a href=\"#\" onClick=\"return doDictLookup('ET0003618');\">TERAPHIM</a>). After this she did not see David for many years. Meanwhile she was given in marriage to another man, Phalti or Phaltiel of Gallim (<a href=\"#\" onClick=\"return mV('1Sa',25,44);\">1Sa 25:44</a>), but David afterwards formally reclaimed her as his lawful wife (<a href=\"#\" onClick=\"return mV('2Sa',3,'13-16');\">2Sa 3:13-16</a>). The relation between her and David soon after this was altered. They became alienated from each other. This happened on that memorable day when the ark was brought up in great triumph from its temporary resting-place to the Holy City. In David's conduct on that occasion she saw nothing but a needless humiliation of the royal dignity (<a href=\"#\" onClick=\"return mV('1Ch',15,29);\">1Ch 15:29</a>). She remained childless, and thus the races of David and Saul were not mixed. In <a href=\"#\" onClick=\"return mV('2Sa',21,8);\">2Sa 21:8</a> her name again occurs, but the name Merab should probably be here substituted for Michal (<a href=\"#\" onClick=\"return mV('1Sa',18,19);\">1Sa 18:19</a>).";
eastonArray["$$T0002531"] = "<strong>Michmash:</strong> something hidden, a town of Benjamin (<a href=\"#\" onClick=\"return mV('Ezr',2,27);\">Ezr 2:27</a>), east of Bethel and south of Migron, on the road to Jerusalem (<a href=\"#\" onClick=\"return mV('Isa',10,28);\">Isa 10:28</a>). It lay on the line of march of an invading army from the north, on the north side of the steep and precipitous Wady es-Suweinit (\"valley of the little thorn-tree\" or \"the acacia\"), and now bears the name of Mukhmas. This wady is called \"the passage of Michmash\" (<a href=\"#\" onClick=\"return mV('1Sa',13,23);\">1Sa 13:23</a>). Immediately facing Mukhmas, on the opposite side of the ravine, is the modern representative of Geba, and behind this again are Ramah and Gibeah.<br><br>This was the scene of a great battle fought between the army of Saul and the Philistines, who were utterly routed and pursued for some 16 miles towards Philistia as far as the valley of Aijalon. \"The freedom of Benjamin secured at Michmash led through long years of conflict to the freedom of all its kindred tribes.\" The power of Benjamin and its king now steadily increased. A new spirit and a new hope were now at work in Israel. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003230');\">SAUL</a>.)";
eastonArray["$$T0002532"] = "<strong>Michmethah:</strong> hiding-place, a town in the northern border of Ephraim and Manasseh, and not far west of Jordan (<a href=\"#\" onClick=\"return mV('Jos',16,6);\">Jos 16:6</a>; <a href=\"#\" onClick=\"return mV('Jos',17,7);\">17:7</a>).";
eastonArray["$$T0002533"] = "<strong>Michri:</strong> prize of Jehovah, a Benjamite, the father of Uzzi (<a href=\"#\" onClick=\"return mV('1Ch',9,8);\">1Ch 9:8</a>).";
eastonArray["$$T0002534"] = "<strong>Michtam:</strong> writing; i.e., a poem or song found in the titles of <a href=\"#\" onClick=\"return mV('Psa',16,'1-');\">Psa 16</a>; <a href=\"#\" onClick=\"return mV('Psa',56,'1-');\">56-60</a>. Some translate the word \"golden\", i.e., precious. It is rendered in the LXX. by a word meaning \"tablet inscription\" or a \"stelograph.\" The root of the word means to stamp or grave, and hence it is regarded as denoting a composition so precious as to be worthy to be engraven on a durable tablet for preservation; or, as others render, \"a psalm precious as stamped gold,\" from the word <i>kethem</i>, \"fine or stamped gold.\"";
eastonArray["$$T0002535"] = "<strong>Middin:</strong> measures, one of the six cities \"in the wilderness,\" on the west of the Dead Sea, mentioned along with En-gedi (<a href=\"#\" onClick=\"return mV('Jos',15,61);\">Jos 15:61</a>).";
eastonArray["$$T0002536"] = "<strong>Midian:</strong> strife, the fourth son of Abraham by Keturah, the father of the Midianites (<a href=\"#\" onClick=\"return mV('Gen',25,2);\">Gen 25:2</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,32);\">1Ch 1:32</a>).";
eastonArray["$$T0002537"] = "<strong>Midianite:</strong> an Arabian tribe descended from Midian. They inhabited principally the desert north of the peninsula of Arabia. The peninsula of Sinai was the pasture-ground for their flocks. They were virtually the rulers of Arabia, being the dominant tribe. Like all Arabians, they were a nomad people. They early engaged in commercial pursuits. It was to one of their caravans that Joseph was sold (<a href=\"#\" onClick=\"return mV('Gen',37,28,36);\">Gen 37:28, 36</a>). The next notice of them is in connection with Moses' flight from Egypt (<a href=\"#\" onClick=\"return mV('Exd',2,'15-21');\">Exd 2:15-21</a>). Here in Midian Moses became the servant and afterwards the son-in-law of Reuel or Jethro, the priest. After the Exodus, the Midianites were friendly to the Israelites so long as they traversed only their outlying pasture-ground on the west of the Arabah; but when, having passed the southern end of Edom, they entered into the land of Midian proper, they joined with Balak, the king of Moab, in a conspiracy against them (<a href=\"#\" onClick=\"return mV('Num',22,'4-7');\">Num 22:4-7</a>). Balaam, who had been sent for to curse Israel, having utterly failed to do so, was dismissed by the king of Moab; nevertheless he still tarried among the Midianites, and induced them to enter into correspondence with the Israelites, so as to bring them into association with them in the licentious orgies connected with the worship of Baal-Peor. This crafty counsel prevailed. The Israelites took part in the heathen festival, and so brought upon themselves a curse indeed. Their apostasy brought upon them a severe punishment. A plague broke out amongst them, and more than twenty-four thousand of the people perished (<a href=\"#\" onClick=\"return mV('Num',25,9);\">Num 25:9</a>). But the Midianites were not to be left unpunished. A terrible vengeance was denounced against them. A thousand warriors from each tribe, under the leadership of Phinehas, went forth against them. The Midianites were utterly routed. Their cities were consumed by fire, five of their kings were put to death, and the whole nation was destroyed (<a href=\"#\" onClick=\"return mV('Jos',13,21,22);\">Jos 13:21-22</a>). Balaam also perished by the sword, receiving the \"wages of his unrighteousness\" (<a href=\"#\" onClick=\"return mV('Num',31,8);\">Num 31:8</a>; <a href=\"#\" onClick=\"return mV('2Pe',2,15);\">2Pe 2:15</a>). The whole of the country on the east of Jordan, now conquered by the Israelites (see <a href=\"#\" onClick=\"return doDictLookup('ET0003427');\">SIHON</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0002771');\">OG</a>), was divided between the two tribes of Reuben and Gad and the half tribe of Manasseh.<br><br>Some two hundred and fifty years after this the Midianites had regained their ancient power, and in confederation with the Amalekites and the \"children of the east\" they made war against their old enemies the Israelites, whom for seven years they oppressed and held in subjection. They were at length assailed by Gideon in that ever-memorable battle in the great plain of Esdraelon, and utterly destroyed (<a href=\"#\" onClick=\"return mV('Jdg',6,'1-');\">Jdg 6:1</a>; Jdg <a href=\"#\" onClick=\"return mV('Jdg',7,'1-');\">7</a>). Frequent allusions are afterwards made to this great victory (<a href=\"#\" onClick=\"return mV('Psa',83,10,12);\">Psa 83:10, 12</a>; <a href=\"#\" onClick=\"return mV('Isa',9,4);\">Isa 9:4</a>; <a href=\"#\" onClick=\"return mV('Isa',10,6);\">10:6</a>). They now wholly pass away from the page of history both sacred and profane.";
eastonArray["$$T0002538"] = "<strong>Midwife:</strong> The two midwives mentioned in <a href=\"#\" onClick=\"return mV('Exd',1,15);\">Exd 1:15</a> were probably the superintendents of the whole class.";
eastonArray["$$T0002539"] = "<strong>Migdal-Edar:</strong> tower of the flock, a place 2 miles south of Jerusalem, near the Bethlehem road (<a href=\"#\" onClick=\"return mV('Gen',35,21);\">Gen 35:21</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001126');\">EDAR</a>.)";
eastonArray["$$T0002540"] = "<strong>Migdal-el:</strong> tower of God, a fortified city of Naphtali (<a href=\"#\" onClick=\"return mV('Jos',19,38);\">Jos 19:38</a>), supposed by some to be identical with Magdala (q.v.).";
eastonArray["$$T0002541"] = "<strong>Migdal-gad:</strong> tower of fortune, a town in the plains of Judah, probably the modern el-Mejdel, a little to the north-east of Ascalon (<a href=\"#\" onClick=\"return mV('Jos',15,37);\">Jos 15:37</a>).";
eastonArray["$$T0002542"] = "<strong>Migdol:</strong> tower.<br><br>(1.) A strongly-fortified place 12 miles from Pelusium, in the north of Egypt (<a href=\"#\" onClick=\"return mV('Jer',44,1);\">Jer 44:1</a>; <a href=\"#\" onClick=\"return mV('Jer',46,14);\">46:14</a>). This word is rendered \"tower\" in <a href=\"#\" onClick=\"return mV('Eze',29,10);\">Eze 29:10</a>, but the margin correctly retains the name Migdol, \"from Migdol to Syene;\" i.e., from Migdol in the north to Syene in the south, in other words, the whole of Egypt.<br><br>(2.) A place mentioned in the passage of the Red Sea (<a href=\"#\" onClick=\"return mV('Exd',14,2);\">Exd 14:2</a>; <a href=\"#\" onClick=\"return mV('Num',33,7,8);\">Num 33:7-8</a>). It is probably to be identified with Bir Suweis, about 2 miles from Suez.";
eastonArray["$$T0002543"] = "<strong>Migron:</strong> precipice or landslip, a place between Aiath and Michmash (<a href=\"#\" onClick=\"return mV('Isa',10,28);\">Isa 10:28</a>). The town of the same name mentioned in <a href=\"#\" onClick=\"return mV('1Sa',14,2);\">1Sa 14:2</a> was to the south of this.";
eastonArray["$$T0002544"] = "<strong>Mikloth:</strong> staves.<br><br>(1.) An officer under Dodai, in the time of David and Solomon (<a href=\"#\" onClick=\"return mV('1Ch',27,4);\">1Ch 27:4</a>).<br><br>(2.) A Benjamite (<a href=\"#\" onClick=\"return mV('1Ch',8,32);\">1Ch 8:32</a>; <a href=\"#\" onClick=\"return mV('1Ch',9,37,38);\">9:37-38</a>).";
eastonArray["$$T0002545"] = "<strong>Milaiai:</strong> eloquent, a Levitical musician (<a href=\"#\" onClick=\"return mV('Neh',12,36);\">Neh 12:36</a>) who took part in the dedication of the wall of Jerusalem.";
eastonArray["$$T0002546"] = "<strong>Mildew:</strong> (the rendering of a Hebrew word meaning \"to be yellow,\" yellowness), the result of cutting east winds blighting and thus rendering the grain unproductive (<a href=\"#\" onClick=\"return mV('Deu',28,22);\">Deu 28:22</a>; <a href=\"#\" onClick=\"return mV('1Ki',8,37);\">1Ki 8:37</a>; <a href=\"#\" onClick=\"return mV('2Ch',6,28);\">2Ch 6:28</a>).";
eastonArray["$$T0002547"] = "<strong>Mile:</strong> (from Lat. mille, \"a thousand; <a href=\"#\" onClick=\"return mV('Mat',5,41);\">Mat 5:41</a>), a Roman measure of 1,000 paces of 5 feet each. Thus the Roman mile has 1618 yards, being 142 yards shorter than the English mile.";
eastonArray["$$T0002548"] = "<strong>Miletus:</strong> (<a href=\"#\" onClick=\"return mV('2Ti',4,20);\">2Ti 4:20</a>), a seaport town and the ancient capital of Ionia, about 36 miles south of Ephesus. On his voyage from Greece to Syria, Paul touched at this port, and delivered that noble and pathetic address to the elders (\"presbyters,\") of Ephesus recorded in <a href=\"#\" onClick=\"return mV('Act',20,'15-35');\">Act 20:15-35</a>. The site of Miletus is now some 10 miles from the coast. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001224');\">EPHESIANS, EPISTLE TO</a>.)";
eastonArray["$$T0002549"] = "<strong>Milk:</strong><br><br>(1.) Hebrew halabh, \"new milk\", milk in its fresh state (<a href=\"#\" onClick=\"return mV('Jdg',4,19);\">Jdg 4:19</a>). It is frequently mentioned in connection with honey (<a href=\"#\" onClick=\"return mV('Exd',3,8);\">Exd 3:8</a>; <a href=\"#\" onClick=\"return mV('Exd',13,5);\">13:5</a>; <a href=\"#\" onClick=\"return mV('Jos',5,6);\">Jos 5:6</a>; <a href=\"#\" onClick=\"return mV('Isa',7,15,22);\">Isa 7:15, 22</a>; <a href=\"#\" onClick=\"return mV('Jer',11,5);\">Jer 11:5</a>). Sheep (<a href=\"#\" onClick=\"return mV('Deu',32,14);\">Deu 32:14</a>) and goats (<a href=\"#\" onClick=\"return mV('Pro',27,27);\">Pro 27:27</a>) and camels (<a href=\"#\" onClick=\"return mV('Gen',32,15);\">Gen 32:15</a>), as well as cows, are made to give their milk for the use of man. Milk is used figuratively as a sign of abundance (<a href=\"#\" onClick=\"return mV('Gen',49,12);\">Gen 49:12</a>; <a href=\"#\" onClick=\"return mV('Eze',25,4);\">Eze 25:4</a>; <a href=\"#\" onClick=\"return mV('Joe',3,18);\">Joe 3:18</a>). It is also a symbol of the rudiments of doctrine (<a href=\"#\" onClick=\"return mV('1Cr',3,2);\">1Cr 3:2</a>; <a href=\"#\" onClick=\"return mV('Hbr',5,12,13);\">Hbr 5:12-13</a>), and of the unadulterated word of God (<a href=\"#\" onClick=\"return mV('1Pe',2,2);\">1Pe 2:2</a>).<br><br>(2.) Heb. hem'ah, always rendered \"butter\" in the Authorized Version. It means \"butter,\" but also more frequently \"cream,\" or perhaps, as some think, \"curdled milk,\" such as that which Abraham set before the angels (<a href=\"#\" onClick=\"return mV('Gen',18,8);\">Gen 18:8</a>), and which Jael gave to Sisera (<a href=\"#\" onClick=\"return mV('Jdg',5,25);\">Jdg 5:25</a>). In this state milk was used by travellers (<a href=\"#\" onClick=\"return mV('2Sa',17,29);\">2Sa 17:29</a>). If kept long enough, it acquired a slightly intoxicating or soporific power.<br><br>This Hebrew word is also sometimes used for milk in general (<a href=\"#\" onClick=\"return mV('Deu',32,14);\">Deu 32:14</a>; <a href=\"#\" onClick=\"return mV('Job',20,17);\">Job 20:17</a>).";
</script>
