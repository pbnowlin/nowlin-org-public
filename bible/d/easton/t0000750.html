<script>
var eastonArray = new Array ();
eastonArray["$$T0000750"] = "<strong>Censer:</strong> the vessel in which incense was presented on \"the golden altar\" before the Lord in the temple (<a href=\"#\" onClick=\"return mV('Exd',30,'1-9');\">Exd 30:1-9</a>). The priest filled the censer with live coal from the sacred fire on the altar of burnt-offering, and having carried it into the sanctuary, there threw upon the burning coals the sweet incense (<a href=\"#\" onClick=\"return mV('Lev',16,12,13);\">Lev 16:12-13</a>), which sent up a cloud of smoke, filling the apartment with fragrance. The censers in daily use were of brass (<a href=\"#\" onClick=\"return mV('Num',16,39);\">Num 16:39</a>), and were designated by a different Hebrew name, <i>miktereth</i> (<a href=\"#\" onClick=\"return mV('2Ch',26,19);\">2Ch 26:19</a>; <a href=\"#\" onClick=\"return mV('Eze',8,11);\">Eze 8:11</a>): while those used on the day of Atonement were of gold, and were denoted by a word (mahtah) meaning \"something to take fire with;\" LXX. pureion = a fire-pan. Solomon prepared for the temple censers of pure gold (<a href=\"#\" onClick=\"return mV('1Ki',7,50);\">1Ki 7:50</a>; <a href=\"#\" onClick=\"return mV('2Ch',4,22);\">2Ch 4:22</a>). The angel in the Apocalypse is represented with a golden censer (<a href=\"#\" onClick=\"return mV('Rev',8,3,5);\">Rev 8:3, 5</a>). Paul speaks of the golden censer as belonging to the tabernacle (<a href=\"#\" onClick=\"return mV('Hbr',9,4);\">Hbr 9:4</a>). The Greek word thumiaterion, here rendered \"censer,\" may more appropriately denote, as in the margin of Revised Version, \"the altar of incense.\" Paul does not here say that the thumiaterion was in the holiest, for it was in the holy place, but that the holiest had it, i.e., that it belonged to the holiest (<a href=\"#\" onClick=\"return mV('1Ki',6,22);\">1Ki 6:22</a>). It was intimately connected with the high priest's service in the holiest.<br><br>The manner in which the censer is to be used is described in <a href=\"#\" onClick=\"return mV('Num',4,14);\">Num 4:14</a>; <a href=\"#\" onClick=\"return mV('Lev',16,12);\">Lev 16:12</a>.";
eastonArray["$$T0000751"] = "<strong>Census:</strong> There are five instances of a census of the Jewish people having been taken.<br/><br>(1.) In the fourth month after the Exodus, when the people were encamped at Sinai. The number of men from twenty years old and upward was then 603,550 (<a href=\"#\" onClick=\"return mV('Exd',38,26);\">Exd 38:26</a>).<br><br>(2.) Another census was made just before the entrance into Canaan, when the number was found to be 601,730, showing thus a small decrease (<a href=\"#\" onClick=\"return mV('Num',26,51);\">Num 26:51</a>).<br><br>(3.) The next census was in the time of David, when the number, exclusive of the tribes of Levi and Benjamin, was found to be 1,300,000 (<a href=\"#\" onClick=\"return mV('2Sa',24,9);\">2Sa 24:9</a>; <a href=\"#\" onClick=\"return mV('1Ch',21,5);\">1Ch 21:5</a>).<br><br>(4.) Solomon made a census of the foreigners in the land, and found 153,600 able-bodied workmen (<a href=\"#\" onClick=\"return mV('2Ch',2,17,18);\">2Ch 2:17-18</a>).<br><br>(5.) After the return from Exile the whole congregation of Israel was numbered, and found to amount to 42,360 (<a href=\"#\" onClick=\"return mV('Ezr',2,64);\">Ezr 2:64</a>). A census was made by the Roman government in the time of our Lord (<a href=\"#\" onClick=\"return mV('Luk',2,1);\">Luk 2:1</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0003595');\">TAXING</a>.)";
eastonArray["$$T0000752"] = "<strong>Centurion:</strong> a Roman officer in command of a hundred men (<a href=\"#\" onClick=\"return mV('Mar',15,39,44,45);\">Mar 15:39, 44-45</a>). Cornelius, the first Gentile convert, was a centurion (<a href=\"#\" onClick=\"return mV('Act',10,1,22);\">Act 10:1, 22</a>). Other centurions are mentioned in (<a href=\"#\" onClick=\"return mV('Mat',8,5,8,13);\">Mat 8:5, 8, 13</a>; <a href=\"#\" onClick=\"return mV('Luk',7,2,6);\">Luk 7:2, 6</a>; <a href=\"#\" onClick=\"return mV('Act',21,32);\">Act 21:32</a>; <a href=\"#\" onClick=\"return mV('Act',22,25,26);\">22:25-26</a>; <a href=\"#\" onClick=\"return mV('Act',23,17,23);\">23:17, 23</a>; <a href=\"#\" onClick=\"return mV('Act',24,23);\">24:23</a>; <a href=\"#\" onClick=\"return mV('Act',27,1,6,11,31,43);\">27:1, 6, 11, 31, 43</a>; <a href=\"#\" onClick=\"return mV('Act',28,16);\">28:16</a>). A centurion watched the crucifixion of our Lord (<a href=\"#\" onClick=\"return mV('Mat',27,54);\">Mat 27:54</a>; <a href=\"#\" onClick=\"return mV('Luk',23,47);\">Luk 23:47</a>), and when he saw the wonders attending it, exclaimed, \"Truly this man was the Son of God.\" \"The centurions mentioned in the New Testament are uniformly spoken of in terms of praise, whether in the Gospels or in the Acts. It is interesting to compare this with the statement of Polybius [vi. 24], that the centurions were chosen by merit, and so were men remarkable not so much for their daring courage as for their deliberation, constancy, and strength of mind.\", Dr. Maclear's N. T. Hist.";
eastonArray["$$T0000753"] = "<strong>Cephas:</strong> a Syriac surname given by Christ to Simon (<a href=\"#\" onClick=\"return mV('Jhn',1,42);\">Jhn 1:42</a>), meaning \"rock.\" The Greeks translated it by Petros, and the Latins by Petrus.";
eastonArray["$$T0000754"] = "<strong>Cesarea:</strong> See <a href=\"#\" onClick=\"return doDictLookup('ET0000682');\">CAESAREA</a>.";
eastonArray["$$T0000755"] = "<strong>Chaff:</strong> the refuse of winnowed corn. It was usually burned (<a href=\"#\" onClick=\"return mV('Exd',15,7);\">Exd 15:7</a>; <a href=\"#\" onClick=\"return mV('Isa',5,24);\">Isa 5:24</a>; <a href=\"#\" onClick=\"return mV('Mat',3,12);\">Mat 3:12</a>). This word sometimes, however, means dried grass or hay (<a href=\"#\" onClick=\"return mV('Isa',5,24);\">Isa 5:24</a>; <a href=\"#\" onClick=\"return mV('Isa',33,11);\">33:11</a>). Chaff is used as a figure of abortive wickedness (<a href=\"#\" onClick=\"return mV('Psa',1,4);\">Psa 1:4</a>; <a href=\"#\" onClick=\"return mV('Mat',3,12);\">Mat 3:12</a>). False doctrines are also called chaff (<a href=\"#\" onClick=\"return mV('Jer',23,28);\">Jer 23:28</a>), or more correctly rendered \"chopped straw.\" The destruction of the wicked, and their powerlessness, are likened to the carrying away of chaff by the wind (<a href=\"#\" onClick=\"return mV('Isa',17,13);\">Isa 17:13</a>; <a href=\"#\" onClick=\"return mV('Hsa',13,3);\">Hsa 13:3</a>; <a href=\"#\" onClick=\"return mV('Zep',2,2);\">Zep 2:2</a>).";
eastonArray["$$T0000756"] = "<strong>Chain:</strong><br><br>(1.) A part of the insignia of office. A chain of gold was placed about Joseph's neck (<a href=\"#\" onClick=\"return mV('Gen',41,42);\">Gen 41:42</a>); and one was promised to Daniel (<a href=\"#\" onClick=\"return mV('Dan',5,7);\">Dan 5:7</a>). It is used as a symbol of sovereignty (<a href=\"#\" onClick=\"return mV('Eze',16,11);\">Eze 16:11</a>). The breast-plate of the high-priest was fastened to the ephod by golden chains (<a href=\"#\" onClick=\"return mV('Exd',39,17,21);\">Exd 39:17, 21</a>).<br><br>(2.) It was used as an ornament (<a href=\"#\" onClick=\"return mV('Pro',1,9);\">Pro 1:9</a>; <a href=\"#\" onClick=\"return mV('Sgs',1,10);\">Sgs 1:10</a>). The Midianites adorned the necks of their camels with chains (<a href=\"#\" onClick=\"return mV('Jdg',8,21,26);\">Jdg 8:21, 26</a>).<br><br>(3.) Chains were also used as fetters wherewith prisoners were bound (<a href=\"#\" onClick=\"return mV('Jdg',16,21);\">Jdg 16:21</a>; <a href=\"#\" onClick=\"return mV('2Sa',3,34);\">2Sa 3:34</a>; <a href=\"#\" onClick=\"return mV('2Ki',25,7);\">2Ki 25:7</a>; <a href=\"#\" onClick=\"return mV('Jer',39,7);\">Jer 39:7</a>). Paul was in this manner bound to a Roman soldier (<a href=\"#\" onClick=\"return mV('Act',28,20);\">Act 28:20</a>; <a href=\"#\" onClick=\"return mV('Eph',6,20);\">Eph 6:20</a>; <a href=\"#\" onClick=\"return mV('2Ti',1,16);\">2Ti 1:16</a>). Sometimes, for the sake of greater security, the prisoner was attached by two chains to two soldiers, as in the case of Peter (<a href=\"#\" onClick=\"return mV('Act',12,6);\">Act 12:6</a>).";
eastonArray["$$T0000757"] = "<strong>Chalcedony:</strong> Mentioned only in <a href=\"#\" onClick=\"return mV('Rev',21,19);\">Rev 21:19</a>, as one of the precious stones in the foundation of the New Jerusalem. The name of this stone is derived from Chalcedon, where it is said to have been first discovered. In modern mineralogy this is the name of an agate-like quartz of a bluish colour. Pliny so names the Indian ruby. The mineral intended in Revelation is probably the Hebrew <i>nophekh</i>, translated \"emerald\" (<a href=\"#\" onClick=\"return mV('Exd',28,18);\">Exd 28:18</a>; <a href=\"#\" onClick=\"return mV('Exd',39,11);\">39:11</a>; <a href=\"#\" onClick=\"return mV('Eze',27,16);\">Eze 27:16</a>; <a href=\"#\" onClick=\"return mV('Eze',28,13);\">28:13</a>). It is rendered \"anthrax\" in the LXX., and \"carbunculus\" in the Vulgate. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000721');\">CARBUNCLE</a>.)";
eastonArray["$$T0000758"] = "<strong>Chaldea:</strong> The southern portion of Babylonia, Lower Mesopotamia, lying chiefly on the right bank of the Euphrates, but commonly used of the whole of the Mesopotamian plain. The Hebrew name is Kasdim, which is usually rendered \"Chaldeans\" (<a href=\"#\" onClick=\"return mV('Jer',50,10);\">Jer 50:10</a>; <a href=\"#\" onClick=\"return mV('Jer',51,24,35);\">51:24, 35</a>).<br><br>The country so named is a vast plain formed by the deposits of the Euphrates and the Tigris, extending to about 400 miles along the course of these rivers, and about 100 miles in average breadth. \"In former days the vast plains of Babylon were nourished by a complicated system of canals and water-courses, which spread over the surface of the country like a network. The wants of a teeming population were supplied by a rich soil, not less bountiful than that on the banks of the Egyptian Nile. Like islands rising from a golden sea of waving corn stood frequent groves of palm-trees and pleasant gardens, affording to the idler or traveller their grateful and highly-valued shade. Crowds of passengers hurried along the dusty roads to and from the busy city. The land was rich in corn and wine.\"<br><br>Recent discoveries, more especially in Babylonia, have thrown much light on the history of the Hebrew patriarchs, and have illustrated or confirmed the Biblical narrative in many points. The ancestor of the Hebrew people, Abram, was, we are told, born at \"Ur of the Chaldees.\" \"Chaldees\" is a mistranslation of the Hebrew <i>Kasdim</i>, Kasdim being the Old Testament name of the Babylonians, while the Chaldees were a tribe who lived on the shores of the Persian Gulf, and did not become a part of the Babylonian population till the time of Hezekiah. Ur was one of the oldest and most famous of the Babylonian cities. Its site is now called Mugheir, or Mugayyar, on the western bank of the Euphrates, in Southern Babylonia. About a century before the birth of Abram it was ruled by a powerful dynasty of kings. Their conquests extended to Elam on the one side, and to the Lebanon on the other. They were followed by a dynasty of princes whose capital was Babylon, and who seem to have been of South Arabian origin. The founder of the dynasty was Sumu-abi (\"Shem is my father\"). But soon afterwards Babylonia fell under Elamite dominion. The kings of Babylon were compelled to acknowledge the supremacy of Elam, and a rival kingdom to that of Babylon, and governed by Elamites, sprang up at Larsa, not far from Ur, but on the opposite bank of the river. In the time of Abram the king of Larsa was Eri-Aku, the son of an Elamite prince, and Eri-Aku, as has long been recognized, is the Biblical \"Arioch king of Ellasar\" (<a href=\"#\" onClick=\"return mV('Gen',14,1);\">Gen 14:1</a>). The contemporaneous king of Babylon in the north, in the country termed Shinar in Scripture, was Khammu-rabi. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000409');\">BABYLON</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0000054');\">ABRAHAM</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0000221');\">AMRAPHEL</a>.)";
eastonArray["$$T0000759"] = "<strong>Chaldee language:</strong> employed by the sacred writers in certain portions of the Old Testament, viz., <a href=\"#\" onClick=\"return mV('Dan',2,'4-7',28);\">Dan 2:4-7, 28</a>; <a href=\"#\" onClick=\"return mV('Ezr',4,'8-24');\">Ezr 4:8-24</a>; <a href=\"#\" onClick=\"return mV('Ezr',5,'1-');\">5</a>; <a href=\"#\" onClick=\"return mV('Ezr',6,'1-18');\">6:1-18</a>; <a href=\"#\" onClick=\"return mV('Ezr',7,'12-26');\">7:12-26</a>; <a href=\"#\" onClick=\"return mV('Gen',31,46)\">Gen 31:46</a>; <a href=\"#\" onClick=\"return mV('Jer',10,11);\">Jer 10:11</a>. It is the Aramaic dialect, as it is sometimes called, as distinguished from the Hebrew dialect. It was the language of commerce and of social intercourse in Western Asia, and after the Exile gradually came to be the popular language of Palestine. It is called \"Syrian\" in <a href=\"#\" onClick=\"return mV('2Ki',18,26);\">2Ki 18:26</a>. Some isolated words in this language are preserved in the New Testament (<a href=\"#\" onClick=\"return mV('Mat',5,22);\">Mat 5:22</a>; <a href=\"#\" onClick=\"return mV('Mat',6,24);\">6:24</a>; <a href=\"#\" onClick=\"return mV('Mat',16,17);\">16:17</a>; <a href=\"#\" onClick=\"return mV('Mat',27,46);\">27:46</a>; <a href=\"#\" onClick=\"return mV('Mar',3,17);\">Mar 3:17</a>; <a href=\"#\" onClick=\"return mV('Mar',5,41);\">5:41</a>; <a href=\"#\" onClick=\"return mV('Mar',7,34);\">7:34</a>; <a href=\"#\" onClick=\"return mV('Mar',14,36);\">14:36</a>; <a href=\"#\" onClick=\"return mV('Act',1,19);\">Act 1:19</a>; <a href=\"#\" onClick=\"return mV('1Cr',16,22);\">1Cr 16:22</a>). These are specimens of the vernacular language of Palestine at that period. The term \"Hebrew\" was also sometimes applied to the Chaldee because it had become the language of the Hebrews (<a href=\"#\" onClick=\"return mV('Jhn',5,2);\">Jhn 5:2</a>; <a href=\"#\" onClick=\"return mV('Jhn',19,20);\">19:20</a>).";
eastonArray["$$T0000760"] = "<strong>Chaldees:</strong> or Chaldeans, the inhabitants of the country of which Babylon was the capital. They were so called till the time of the Captivity (<a href=\"#\" onClick=\"return mV('2Ki',25,'1-')\">2Ki 25</a>; <a href=\"#\" onClick=\"return mV('Isa',13,19);\">Isa 13:19</a>; <a href=\"#\" onClick=\"return mV('Isa',23,13);\">23:13</a>), when, particularly in the Book of Daniel (<a href=\"#\" onClick=\"return mV('Dan',5,30);\">Dan 5:30</a>; <a href=\"#\" onClick=\"return mV('Dan',9,1);\">9:1</a>), the name began to be used with special reference to a class of learned men ranked with the magicians and astronomers. These men cultivated the ancient Cushite language of the original inhabitants of the land, for they had a \"learning\" and a \"tongue\" (<a href=\"#\" onClick=\"return mV('Dan',1,4);\">1:4</a>) of their own. The common language of the country at that time had become assimilated to the Semitic dialect, especially through the influence of the Assyrians, and was the language that was used for all civil purposes. The Chaldeans were the learned class, interesting themselves in science and religion, which consisted, like that of the ancient Arabians and Syrians, in the worship of the heavenly bodies. There are representations of this priestly class, of magi and diviners, on the walls of the Assyrian palaces.";
eastonArray["$$T0000761"] = "<strong>Chamber:</strong> \"on the wall,\" which the Shunammite prepared for the prophet Elisha (<a href=\"#\" onClick=\"return mV('2Ki',4,10);\">2Ki 4:10</a>), was an upper chamber over the porch through the hall toward the street. This was the \"guest chamber\" where entertainments were prepared (<a href=\"#\" onClick=\"return mV('Mar',14,14);\">Mar 14:14</a>). There were also \"chambers within chambers\" (<a href=\"#\" onClick=\"return mV('1Ki',22,25);\">1Ki 22:25</a>; <a href=\"#\" onClick=\"return mV('2Ki',9,2);\">2Ki 9:2</a>). To enter into a chamber is used metaphorically of prayer and communion with God (<a href=\"#\" onClick=\"return mV('Isa',26,20);\">Isa 26:20</a>). The \"chambers of the south\" (<a href=\"#\" onClick=\"return mV('Job',9,9);\">Job 9:9</a>) are probably the constelations of the southern hemisphere. The \"chambers of imagery\", i.e., chambers painted with images, as used by Ezekiel (<a href=\"#\" onClick=\"return mV('Eze',8,12);\">Eze 8:12</a>), is an expression denoting the vision the prophet had of the abominations practised by the Jews in Jerusalem.";
eastonArray["$$T0000762"] = "<strong>Chambering:</strong> (<a href=\"#\" onClick=\"return mV('Rom',13,13);\">Rom 13:13</a>), wantonness, impurity.";
eastonArray["$$T0000763"] = "<strong>Chamberlain:</strong> a confidential servant of the king (<a href=\"#\" onClick=\"return mV('Gen',37,36);\">Gen 37:36</a>; <a href=\"#\" onClick=\"return mV('Gen',39,1);\">39:1</a>). In <a href=\"#\" onClick=\"return mV('Rom',16,23);\">Rom 16:23</a> mention is made of \"Erastus the chamberlain.\" Here the word denotes the treasurer of the city, or the quaestor, as the Romans styled him. He is almost the only convert from the higher ranks of whom mention is made (<a href=\"#\" onClick=\"return mV('Act',17,34);\">Act 17:34</a>). Blastus, Herod's \"chamberlain\" (<a href=\"#\" onClick=\"return mV('Act',12,20);\">Act 12:20</a>), was his personal attendant or valet-de-chambre. The Hebrew word <i>saris</i>, thus translated in <a href=\"#\" onClick=\"return mV('Est',1,10,15);\">Est 1:10, 15</a>; <a href=\"#\" onClick=\"return mV('Est',2,3,14,21);\">2:3, 14, 21</a>, etc., properly means an eunuch (as in the marg.), as it is rendered in <a href=\"#\" onClick=\"return mV('Isa',39,7);\">Isa 39:7</a>; <a href=\"#\" onClick=\"return mV('Isa',56,3);\">56:3</a>.";
eastonArray["$$T0000764"] = "<strong>Chameleon:</strong> a species of lizard which has the faculty of changing the colour of its skin. It is ranked among the unclean animals in <a href=\"#\" onClick=\"return mV('Lev',11,30);\">Lev 11:30</a>, where the Hebrew word so translated is <i>coah</i> (R.V., \"land crocodile\"). In the same verse the Hebrew <i>tanshemeth</i>, rendered in Authorized Version \"mole,\" is in Revised Version \"chameleon,\" which is the correct rendering. This animal is very common in Egypt and in the Holy Land, especially in the Jordan valley.";
eastonArray["$$T0000765"] = "<strong>Chamois:</strong> only in <a href=\"#\" onClick=\"return mV('Deu',14,5);\">Deu 14:5</a> (Heb. zemer), an animal of the deer or gazelle species. It bears this Hebrew name from its leaping or springing. The animal intended is probably the wild sheep (<i>Ovis tragelephus</i>), which is still found in Sinai and in the broken ridges of Stony Arabia. The LXX. and Vulgate render the word by camelopardus, i.e., the giraffe; but this is an animal of Central Africa, and is not at all known in Syria.";
eastonArray["$$T0000766"] = "<strong>Champion:</strong> (<a href=\"#\" onClick=\"return mV('1Sa',17,4,23);\">1Sa 17:4, 23</a>), properly \"the man between the two,\" denoting the position of Goliath between the two camps. Single combats of this kind at the head of armies were common in ancient times. In <a href=\"#\" onClick=\"return mV('1Sa',17,51);\">1Sa 17:51</a> this word is the rendering of a different Hebrew word, and properly denotes \"a mighty man.\"";
eastonArray["$$T0000767"] = "<strong>Chance:</strong> (<a href=\"#\" onClick=\"return mV('Luk',10,31);\">Luk 10:31</a>). \"It was not by chance that the priest came down by that road at that time, but by a specific arrangement and in exact fulfilment of a plan; not the plan of the priest, nor the plan of the wounded traveller, but the plan of God. By coincidence (Gr. sungkuria) the priest came down, that is, by the conjunction of two things, in fact, which were previously constituted a pair in the providence of God. In the result they fell together according to the omniscient Designer's plan. This is the true theory of the divine government.\" Compare the meeting of Philip with the Ethiopian (<a href=\"#\" onClick=\"return mV('Act',8,26,27);\">Act 8:26-27</a>). There is no \"chance\" in God's empire. \"Chance\" is only another word for our want of knowledge as to the way in which one event falls in with another (<a href=\"#\" onClick=\"return mV('1Sa',6,9);\">1Sa 6:9</a>; <a href=\"#\" onClick=\"return mV('Ecc',9,11);\">Ecc 9:11</a>).";
eastonArray["$$T0000768"] = "<strong>Chancellor:</strong> one who has judicial authority, literally, a \"lord of judgement;\" a title given to the Persian governor of Samaria (<a href=\"#\" onClick=\"return mV('Ezr',4,8,9,17);\">Ezr 4:8-9, 17</a>).";
eastonArray["$$T0000769"] = "<strong>Changes of raiment:</strong> were reckoned among the treasures of rich men (<a href=\"#\" onClick=\"return mV('Gen',45,22);\">Gen 45:22</a>; <a href=\"#\" onClick=\"return mV('Jdg',14,12,13);\">Jdg 14:12-13</a>; <a href=\"#\" onClick=\"return mV('2Ki',5,22,23);\">2Ki 5:22-23</a>).";
eastonArray["$$T0000770"] = "<strong>Channel:</strong><br><br>(1.) The bed of the sea or of a river (<a href=\"#\" onClick=\"return mV('Psa',18,15);\">Psa 18:15</a>; <a href=\"#\" onClick=\"return mV('Isa',8,7);\">Isa 8:7</a>).<br><br>(2.) The \"chanelbone\" (<a href=\"#\" onClick=\"return mV('Job',31,22);\">Job 31:22</a> marg.), properly \"tube\" or \"shaft,\" an old term for the collar-bone.";
eastonArray["$$T0000771"] = "<strong>Chapel:</strong> a holy place or sanctuary, occurs only in <a href=\"#\" onClick=\"return mV('Amo',7,13);\">Amo 7:13</a>, where one of the idol priests calls Bethel \"the king's chapel.\"";
eastonArray["$$T0000772"] = "<strong>Chapiter:</strong> the ornamental head or capital of a pillar. Three Hebrew words are so rendered.<br><br>(1.) <i>Cothereth</i> (<a href=\"#\" onClick=\"return mV('1Ki',7,16);\">1Ki 7:16</a>; <a href=\"#\" onClick=\"return mV('2Ki',25,17);\">2Ki 25:17</a>; <a href=\"#\" onClick=\"return mV('2Ch',4,12);\">2Ch 4:12</a>), meaning a \"diadem\" or \"crown.\"<br><br>(2.) <i>Tzepheth</i> (<a href=\"#\" onClick=\"return mV('2Ch',3,15);\">2Ch 3:15</a>).<br><br>(3.) <i>Rosh</i> (<a href=\"#\" onClick=\"return mV('Exd',36,38);\">Exd 36:38</a>; <a href=\"#\" onClick=\"return mV('Exd',38,17,19,28);\">38:17, 19, 28</a>), properly a \"head\" or \"top.\"";
eastonArray["$$T0000773"] = "<strong>Chapter:</strong> The several books of the Old and New Testaments were from an early time divided into chapters. The Pentateuch was divided by the ancient Hebrews into 54 <i>parshioth</i> or sections, one of which was read in the synagogue every Sabbath day (<a href=\"#\" onClick=\"return mV('Act',13,15);\">Act 13:15</a>). These sections were afterwards divided into 669 <i>sidrim</i> or orders of unequal length. The Prophets were divided in somewhat the same manner into <i>haphtaroth</i> or passages.<br><br>In the early Latin and Greek versions of the Bible, similar divisions of the several books were made. The New Testament books were also divided into portions of various lengths under different names, such as titles and heads or chapters.<br><br>In modern times this ancient example was imitated, and many attempts of the kind were made before the existing division into chapters was fixed. The Latin Bible published by Cardinal Hugo of St. Cher in A.D. 1240 is generally regarded as the first Bible that was divided into our present chapters, although it appears that some of the chapters were fixed as early as A.D. 1059. This division into chapters came gradually to be adopted in the published editions of the Hebrew, with some few variations, and of the Greek Scriptures, and hence of other versions.";
eastonArray["$$T0000774"] = "<strong>Charashim:</strong> craftsmen, a valley named in <a href=\"#\" onClick=\"return mV('1Ch',4,14);\">1Ch 4:14</a>. In <a href=\"#\" onClick=\"return mV('Neh',11,35);\">Neh 11:35</a> the Hebrew word is rendered \"valley of craftsmen\" (R.V. marg., Geha-rashim). Nothing is known of it.";
eastonArray["$$T0000775"] = "<strong>Charger:</strong> a bowl or deep dish. The silver vessels given by the heads of the tribes for the services of the tabernacle are so named (<a href=\"#\" onClick=\"return mV('Num',7,13);\">Num 7:13</a>, etc.). The \"charger\" in which the Baptist's head was presented was a platter or flat wooden trencher (<a href=\"#\" onClick=\"return mV('Mat',14,8,11);\">Mat 14:8, 11</a>; <a href=\"#\" onClick=\"return mV('Mar',6,25,28);\">Mar 6:25, 28</a>). The chargers of gold and silver of <a href=\"#\" onClick=\"return mV('Ezr',1,9);\">Ezr 1:9</a> were probably basins for receiving the blood of sacrifices.";
eastonArray["$$T0000776"] = "<strong>Chariot:</strong> a vehicle generally used for warlike purposes. Sometimes, though but rarely, it is spoken of as used for peaceful purposes.<br><br>The first mention of the chariot is when Joseph, as a mark of distinction, was placed in Pharaoh's second state chariot (<a href=\"#\" onClick=\"return mV('Gen',41,43);\">Gen 41:43</a>); and the next, when he went out in his own chariot to meet his father Jacob (<a href=\"#\" onClick=\"return mV('Gen',46,29);\">46:29</a>). Chariots formed part of the funeral procession of Jacob (<a href=\"#\" onClick=\"return mV('Gen',50,9);\">50:9</a>). When Pharaoh pursued the Israelites he took 600 war-chariots with him (<a href=\"#\" onClick=\"return mV('Exd',14,7);\">Exd 14:7</a>). The Canaanites in the valleys of Palestine had chariots of iron (<a href=\"#\" onClick=\"return mV('Jos',17,18);\">Jos 17:18</a>; <a href=\"#\" onClick=\"return mV('Jdg',1,19);\">Jdg 1:19</a>). Jabin, the king of Canaan, had 900 chariots (<a href=\"#\" onClick=\"return mV('Jdg',4,3);\">Jdg 4:3</a>); and in Saul's time the Philistines had 30,000. In his wars with the king of Zobah and with the Syrians, David took many chariots among the spoils (<a href=\"#\" onClick=\"return mV('2Sa',8,4);\">2Sa 8:4</a>; <a href=\"#\" onClick=\"return mV('2Sa',10,18);\">10:18</a>). Solomon maintained as part of his army 1,400 chariots (<a href=\"#\" onClick=\"return mV('1Ki',10,26);\">1Ki 10:26</a>), which were chiefly imported from Egypt (<a href=\"#\" onClick=\"return mV('1Ki',10,29);\">29</a>). From this time forward they formed part of the armies of Israel (<a href=\"#\" onClick=\"return mV('1Ki',22,34);\">1Ki 22:34</a>; <a href=\"#\" onClick=\"return mV('2Ki',9,16,21);\">2Ki 9:16, 21</a>; <a href=\"#\" onClick=\"return mV('2Ki',13,7,14);\">13:7, 14</a>; <a href=\"#\" onClick=\"return mV('2Ki',18,24);\">18:24</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,30);\">23:30</a>).<br><br>In the New Testament we have only one historical reference to the use of chariots, in the case of the Ethiopian eunuch (<a href=\"#\" onClick=\"return mV('Act',8,28,29,38);\">Act 8:28-29, 38</a>).<br><br>This word is sometimes used figuratively for hosts (<a href=\"#\" onClick=\"return mV('Psa',68,17);\">Psa 68:17</a>; <a href=\"#\" onClick=\"return mV('2Ki',6,17);\">2Ki 6:17</a>). Elijah, by his prayers and his counsel, was \"the chariot of Israel, and the horsemen thereof.\" The rapid agency of God in the phenomena of nature is also spoken of under the similitude of a chariot (<a href=\"#\" onClick=\"return mV('Psa',104,3);\">Psa 104:3</a>; <a href=\"#\" onClick=\"return mV('Isa',66,15);\">Isa 66:15</a>; <a href=\"#\" onClick=\"return mV('Hab',3,8);\">Hab 3:8</a>).<br><br>Chariot of the cherubim (<a href=\"#\" onClick=\"return mV('1Ch',28,18);\">1Ch 28:18</a>), the chariot formed by the two cherubs on the mercy-seat on which the Lord rides.<br><br>Chariot cities were set apart for storing the war-chariots in time of peace (<a href=\"#\" onClick=\"return mV('2Ch',1,14);\">2Ch 1:14</a>).<br><br>Chariot horses were such as were peculiarly fitted for service in chariots (<a href=\"#\" onClick=\"return mV('2Ki',7,14);\">2Ki 7:14</a>).<br><br>Chariots of war are described in <a href=\"#\" onClick=\"return mV('Exd',14,7);\">Exd 14:7</a>; <a href=\"#\" onClick=\"return mV('1Sa',13,5);\">1Sa 13:5</a>; <a href=\"#\" onClick=\"return mV('2Sa',8,4);\">2Sa 8:4</a>; <a href=\"#\" onClick=\"return mV('1Ch',18,4);\">1Ch 18:4</a>; <a href=\"#\" onClick=\"return mV('Jos',11,4);\">Jos 11:4</a>; <a href=\"#\" onClick=\"return mV('Jdg',4,3,13);\">Jdg 4:3, 13</a>. They were not used by the Israelites till the time of David. Elijah was translated in a \"chariot of fire\" (<a href=\"#\" onClick=\"return mV('2Ki',2,11);\">2Ki 2:11</a>). Comp. <a href=\"#\" onClick=\"return mV('2Ki',6,17);\">2Ki 6:17</a>. This vision would be to Elisha a source of strength and encouragement, for now he could say, \"They that be with us are more than they that be with them.\"";
eastonArray["$$T0000777"] = "<strong>Charity:</strong> (<a href=\"#\" onClick=\"return mV('1Cr',13,'1-')\">1Cr 13</a>), the rendering in the Authorized Version of the word which properly denotes love, and is frequently so rendered (always so in the Revised Version). It is spoken of as the greatest of the three Christian graces (<a href=\"#\" onClick=\"return mV('1Cr',12,'31-');\">1Cr 12:31</a>-<a href=\"#\" onClick=\"return mV('1Cr',12,'1-13');\">13:1-13</a>).";
eastonArray["$$T0000778"] = "<strong>Charmer:</strong> one who practises serpent-charming (<a href=\"#\" onClick=\"return mV('Psa',58,5);\">Psa 58:5</a>; <a href=\"#\" onClick=\"return mV('Jer',8,17);\">Jer 8:17</a>; <a href=\"#\" onClick=\"return mV('Ecc',10,11);\">Ecc 10:11</a>). It was an early and universal opinion that the most venomous reptiles could be made harmless by certain charms or by sweet sounds. It is well known that there are jugglers in India and in other Eastern lands who practise this art at the present day.<br><br>In <a href=\"#\" onClick=\"return mV('Isa',19,3);\">Isa 19:3</a> the word \"charmers\" is the rendering of the Hebrew <i>'ittim</i>, meaning, properly, necromancers (R.V. marg., \"whisperers\"). In <a href=\"#\" onClick=\"return mV('Deu',18,11);\">Deu 18:11</a> the word \"charmer\" means a dealer in spells, especially one who, by binding certain knots, was supposed thereby to bind a curse or a blessing on its object. In <a href=\"#\" onClick=\"return mV('Isa',3,3);\">Isa 3:3</a> the words \"eloquent orator\" should be, as in the Revised Version, \"skilful enchanter.\"";
eastonArray["$$T0000779"] = "<strong>Charran:</strong> another form (<a href=\"#\" onClick=\"return mV('Act',7,2,4);\">Act 7:2, 4</a>) of Haran (q.v.).";
eastonArray["$$T0000780"] = "<strong>Chebar:</strong> length, a river in the \"land of the Chaldeans\" (<a href=\"#\" onClick=\"return mV('Eze',1,3);\">Eze 1:3</a>), on the banks of which were located some of the Jews of the Captivity (<a href=\"#\" onClick=\"return mV('Eze',1,1);\">Eze 1:1</a>; <a href=\"#\" onClick=\"return mV('Eze',3,15,23);\">3:15, 23</a>; <a href=\"#\" onClick=\"return mV('Eze',10,15,20,22);\">10:15, 20, 22</a>). It has been supposed to be identical with the river Habor, the Chaboras, or modern Khabour, which falls into the Euphrates at Circesium. To the banks of this river some of the Israelites were removed by the Assyrians (<a href=\"#\" onClick=\"return mV('2Ki',17,6);\">2Ki 17:6</a>). An opinion that has much to support it is that the \"Chebar\" was the royal canal of Nebuchadnezzar, the Nahr Malcha, the greatest in Mesopotamia, which connected the Tigris with the Euphrates, in the excavation of which the Jewish captives were probably employed.";
eastonArray["$$T0000781"] = "<strong>Chedorlaomer:</strong> (= Khudur-Lagamar of the inscriptions), king of Elam. Many centuries before the age of Abraham, Canaan and even the Sinaitic peninsula had been conquered by Babylonian kings, and in the time of Abraham himself Babylonia was ruled by a dynasty which claimed sovereignity over Syria and Palestine. The kings of the dynasty bore names which were not Babylonian, but at once South Arabic and Hebrew. The most famous king of the dynasty was Khammu-rabi, who united Babylonia under one rule, and made Babylon its capital. When he ascended the throne, the country was under the suzerainty of the Elamites, and was divided into two kingdoms, that of Babylon (the Biblical Shinar) and that of Larsa (the Biblical Ellasar). The king of Larsa was Eri-Aku (\"the servant of the moon-god\"), the son of an Elamite prince, Kudur-Mabug, who is entitled \"the father of the land of the Amorites.\" A recently discovered tablet enumerates among the enemies of Khammu-rabi, Kudur-Lagamar (\"the servant of the goddess Lagamar\") or Chedorlaomer, Eri-Aku or Arioch, and Tudkhula or Tidal. Khammu-rabi, whose name is also read Ammi-rapaltu or Amraphel by some scholars, succeeded in overcoming Eri-Aku and driving the Elamites out of Babylonia. Assur-bani-pal, the last of the Assyrian conquerors, mentions in two inscriptions that he took Susa 1635 years after Kedor-nakhunta, king of Elam, had conquered Babylonia. It was in the year B.C. 660 that Assur-bani-pal took Susa.";
eastonArray["$$T0000782"] = "<strong>Cheek:</strong> Smiting on the cheek was accounted a grievous injury and insult (<a href=\"#\" onClick=\"return mV('Job',16,10);\">Job 16:10</a>; <a href=\"#\" onClick=\"return mV('Lam',3,30);\">Lam 3:30</a>; <a href=\"#\" onClick=\"return mV('Mic',5,1);\">Mic 5:1</a>). The admonition (<a href=\"#\" onClick=\"return mV('Luk',6,29);\">Luk 6:29</a>), \"Unto him that smiteth thee on the one cheek offer also the other,\" means simply, \"Resist not evil\" (<a href=\"#\" onClick=\"return mV('Mat',5,39);\">Mat 5:39</a>; <a href=\"#\" onClick=\"return mV('1Pe',2,'19-23');\">1Pe 2:19-23</a>). <a href=\"#\" onClick=\"return mV('Psa',3,7);\">Psa 3:7</a> = that God had deprived his enemies of the power of doing him injury.";
eastonArray["$$T0000783"] = "<strong>Cheese:</strong> (A.S. cese). This word occurs three times in the Authorized Version as the translation of three different Hebrew words:<br><br>(1.) <a href=\"#\" onClick=\"return mV('1Sa',17,18);\">1Sa 17:18</a>, \"ten cheeses;\" i.e., ten sections of curd.<br><br>(2.) <a href=\"#\" onClick=\"return mV('2Sa',17,29);\">2Sa 17:29</a>, \"cheese of kine\" = perhaps curdled milk of kine. The Vulgate version reads \"fat calves.\"<br><br>(3.) <a href=\"#\" onClick=\"return mV('Job',10,10);\">Job 10:10</a>, curdled milk is meant by the word.";
eastonArray["$$T0000784"] = "<strong>Chemarim:</strong> black, (<a href=\"#\" onClick=\"return mV('Zep',1,4);\">Zep 1:4</a>; in <a href=\"#\" onClick=\"return mV('2Ki',23,5);\">2Ki 23:5</a>, and \"priests\" in <a href=\"#\" onClick=\"return mV('Hsa',10,5);\">Hsa 10:5</a>). Some derive this word from the Assyrian Kamaru, meaning \"to throw down,\" and interpret it as describing the idolatrous priests who prostrate themselves before the idols. Others regard it as meaning \"those who go about in black,\" or \"ascetics.\"";
eastonArray["$$T0000785"] = "<strong>Chemosh:</strong> the destroyer, subduer, or fish-god, the god of the Moabites (<a href=\"#\" onClick=\"return mV('Num',21,29);\">Num 21:29</a>; <a href=\"#\" onClick=\"return mV('Jer',48,7,13,46);\">Jer 48:7, 13, 46</a>). The worship of this god, \"the abomination of Moab,\" was introduced at Jerusalem by Solomon (<a href=\"#\" onClick=\"return mV('1Ki',11,7);\">1Ki 11:7</a>), but was abolished by Josiah (<a href=\"#\" onClick=\"return mV('2Ki',23,13);\">2Ki 23:13</a>). On the \"Moabite Stone\" (q.v.), Mesha (<a href=\"#\" onClick=\"return mV('2Ki',3,5);\">2Ki 3:5</a>) ascribes his victories over the king of Israel to this god, \"And Chemosh drove him before my sight.\"";
eastonArray["$$T0000786"] = "<strong>Chenaanah:</strong> merchant.<br><br>(1.) A Benjamite (<a href=\"#\" onClick=\"return mV('1Ch',7,10);\">1Ch 7:10</a>).<br><br>(2.) The father of Zedekiah (<a href=\"#\" onClick=\"return mV('1Ki',22,11);\">1Ki 22:11,24</a>).";
eastonArray["$$T0000787"] = "<strong>Chenaiah:</strong> whom Jehovah hath made. \"Chief of the Levites,\" probably a Kohathite (<a href=\"#\" onClick=\"return mV('1Ch',15,22);\">1Ch 15:22</a>), and therefore not the same as mentioned in <a href=\"#\" onClick=\"return mV('1Ch',26,29);\">1Ch 26:29</a>.";
eastonArray["$$T0000788"] = "<strong>Chephirah:</strong> village, one of the four cities of the Gibeonitish Hivites with whom Joshua made a league (<a href=\"#\" onClick=\"return mV('Jos',9,17);\">Jos 9:17</a>). It belonged to Benjamin. It has been identified with the modern Kefireh, on the west confines of Benjamin, about 2 miles west of Ajalon and 11 from Jerusalem.";
eastonArray["$$T0000789"] = "<strong>Cherethim:</strong> (<a href=\"#\" onClick=\"return mV('Eze',25,16);\">Eze 25:16</a>), more frequently Cherethites, the inhabitants of Southern Philistia, the Philistines (<a href=\"#\" onClick=\"return mV('Zep',2,5);\">Zep 2:5</a>). The Cherethites and the Pelethites were David's life-guards (<a href=\"#\" onClick=\"return mV('1Sa',30,14);\">1Sa 30:14</a>; <a href=\"#\" onClick=\"return mV('2Sa',8,18);\">2Sa 8:18</a>; <a href=\"#\" onClick=\"return mV('2Sa',20,7,23);\">20:7, 23</a>; <a href=\"#\" onClick=\"return mV('2Sa',23,23);\">23:23</a>). This name is by some interpreted as meaning \"Cretans,\" and by others \"executioners,\" who were ready to execute the king's sentence of death (<a href=\"#\" onClick=\"return mV('Gen',37,36);\">Gen 37:36</a>, marg.; <a href=\"#\" onClick=\"return mV('1Ki',2,25);\">1Ki 2:25</a>).";
eastonArray["$$T0000790"] = "<strong>Cherith:</strong> a cutting; separation; a gorge, a torrent-bed or winter-stream, a \"brook,\" in whose banks the prophet Elijah hid himself during the early part of the three years' drought (<a href=\"#\" onClick=\"return mV('1Ki',17,3,5);\">1Ki 17:3, 5</a>). It has by some been identified as the Wady el-Kelt behind Jericho, which is formed by the junction of many streams flowing from the mountains west of Jericho. It is dry in summer. Travellers have described it as one of the wildest ravines of this wild region, and peculiarly fitted to afford a secure asylum to the persecuted. But if the prophet's interview with Ahab was in Samaria, and he thence journeyed toward the east, it is probable that he crossed Jordan and found refuge in some of the ravines of Gilead. The \"brook\" is said to have been \"before Jordan,\" which probably means that it opened toward that river, into which it flowed. This description would apply to the east as well as to the west of Jordan. Thus Elijah's hiding-place may have been the Jermuk, in the territory of the half-tribe of Manasseh.";
eastonArray["$$T0000791"] = "<strong>Cherub:</strong> plural cherubim, the name of certain symbolical figures frequently mentioned in Scripture. They are first mentioned in connection with the expulsion of our first parents from Eden (<a href=\"#\" onClick=\"return mV('Gen',3,24);\">Gen 3:24</a>). There is no intimation given of their shape or form. They are next mentioned when Moses was commanded to provide furniture for the tabernacle (<a href=\"#\" onClick=\"return mV('Exd',25,'17-20');\">Exd 25:17-20</a>; <a href=\"#\" onClick=\"return mV('Exd',26,1,31);\">26:1, 31</a>). God promised to commune with Moses \"from between the cherubim\" (<a href=\"#\" onClick=\"return mV('Exd',25,22);\">25:22</a>). This expression was afterwards used to denote the Divine abode and presence (<a href=\"#\" onClick=\"return mV('Num',7,89);\">Num 7:89</a>; <a href=\"#\" onClick=\"return mV('1Sa',4,4);\">1Sa 4:4</a>; <a href=\"#\" onClick=\"return mV('Isa',37,16);\">Isa 37:16</a>; <a href=\"#\" onClick=\"return mV('Psa',80,1);\">Psa 80:1</a>; <a href=\"#\" onClick=\"return mV('Psa',99,1);\">99:1</a>). In Ezekiel's vision (<a href=\"#\" onClick=\"return mV('Eze',10,'1-20');\">Eze 10:1-20</a>) they appear as living creatures supporting the throne of God. From Ezekiel's description of them (<a href=\"#\" onClick=\"return mV('Eze',1,'1-')\">Eze 1</a>; <a href=\"#\" onClick=\"return mV('Eze',10,'1-')\">Eze 10; <a href=\"#\" onClick=\"return mV('Eze',41,18,19);\">41:18-19</a>), they appear to have been compound figures, unlike any real object in nature; artificial images possessing the features and properties of several animals. Two cherubim were placed on the mercy-seat of the ark; two of colossal size overshadowed it in Solomon's temple. Ezekiel (<a href=\"#\" onClick=\"return mV('Eze',1,'4-14');\">Eze 1:4-14</a>) speaks of four; and this number of \"living creatures\" is mentioned in <a href=\"#\" onClick=\"return mV('Rev',4,6);\">Rev 4:6</a>. Those on the ark are called the \"cherubim of glory\" (<a href=\"#\" onClick=\"return mV('Hbr',9,5);\">Hbr 9:5</a>), i.e., of the Shechinah, or cloud of glory, for on them the visible glory of God rested. They were placed one at each end of the mercy-seat, with wings stretched upward, and their faces \"toward each other and toward the mercy-seat.\" They were anointed with holy oil, like the ark itself and the other sacred furniture.<br><br>The cherubim were symbolical. They were intended to represent spiritual existences in immediate contact with Jehovah. Some have regarded them as symbolical of the chief ruling power by which God carries on his operations in providence (<a href=\"#\" onClick=\"return mV('Psa',18,10);\">Psa 18:10</a>). Others interpret them as having reference to the redemption of men, and as symbolizing the great rulers or ministers of the church. Many other opinions have been held regarding them which need not be referred to here. On the whole, it seems to be most satisfactory to regard the interpretation of the symbol to be variable, as is the symbol itself.<br><br>Their office was, (1) on the expulsion of our first parents from Eden, to prevent all access to the tree of life; and (2) to form the throne and chariot of Jehovah in his manifestation of himself on earth. He dwelleth between and sitteth on the cherubim (<a href=\"#\" onClick=\"return mV('1Sa',4,4);\">1Sa 4:4</a>; <a href=\"#\" onClick=\"return mV('Psa',80,1);\">Psa 80:1</a>; <a href=\"#\" onClick=\"return mV('Eze',1,26,28);\">Eze 1:26, 28</a>).";
eastonArray["$$T0000792"] = "<strong>Chesalon:</strong> strength; confidence, a place on the border of Judah, on the side of Mount Jearim (<a href=\"#\" onClick=\"return mV('Jos',15,10);\">Jos 15:10</a>); probably identified with the modern village of Kesla, on the western mountains of Judah.";
eastonArray["$$T0000793"] = "<strong>Chesed:</strong> gain, the son of Nahor (<a href=\"#\" onClick=\"return mV('Gen',22,22);\">Gen 22:22</a>).";
eastonArray["$$T0000794"] = "<strong>Chesil:</strong> ungodly, a town in the south of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,30);\">Jos 15:30</a>); probably the same as Bethul (<a href=\"#\" onClick=\"return mV('Jos',19,4);\">19:4</a>) and Bethuel (<a href=\"#\" onClick=\"return mV('1Ch',4,30);\">1Ch 4:30</a>); now Khelasa.";
eastonArray["$$T0000795"] = "<strong>Chest:</strong> (Heb. <i>'aron</i>, generally rendered \"ark\"), the coffer into which the contributions for the repair of the temple were put (<a href=\"#\" onClick=\"return mV('2Ki',12,9,10);\">2Ki 12:9-10</a>; <a href=\"#\" onClick=\"return mV('2Ch',24,8,10,11);\">2Ch 24:8, 10-11</a>). In <a href=\"#\" onClick=\"return mV('Gen',50,26);\">Gen 50:26</a> it is rendered \"coffin.\" In <a href=\"#\" onClick=\"return mV('Eze',27,24);\">Eze 27:24</a> a different Hebrew word, <i>genazim</i> (plur.), is used. It there means \"treasure-chests.\"";
eastonArray["$$T0000796"] = "<strong>Chestnut tree:</strong> (Heb. <i>'armon</i>; i.e., \"naked\"), mentioned in connection with Jacob's artifice regarding the cattle (<a href=\"#\" onClick=\"return mV('Gen',30,37);\">Gen 30:37</a>). It is one of the trees of which, because of its strength and beauty, the Assyrian empire is likened (<a href=\"#\" onClick=\"return mV('Eze',31,8);\">Eze 31:8</a>; R.V., \"plane trees\"). It is probably the Oriental plane tree (<i>Platanus orientalis</i>) that is intended. It is a characteristic of this tree that it annually sheds its outer bark, becomes \"naked.\" The chestnut tree proper is not a native of Palestine.";
eastonArray["$$T0000797"] = "<strong>Chesulloth:</strong> fertile places; the loins, a town of Issachar, on the slopes of some mountain between Jezreel and Shunem (<a href=\"#\" onClick=\"return mV('Jos',19,18);\">Jos 19:18</a>). It has been identified with Chisloth-tabor, 2 1/2 miles to the west of Mount Tabor, and north of Jezreel; now Iksal.";
eastonArray["$$T0000798"] = "<strong>Chezib:</strong> deceitful, a town where Shelah, the son of Judah, was born (<a href=\"#\" onClick=\"return mV('Gen',38,5);\">Gen 38:5</a>). Probably the same as Achzib (q.v.).";
eastonArray["$$T0000799"] = "<strong>Chidon:</strong> dart, the name of the threshing-floor at which the death of Uzzah took place (<a href=\"#\" onClick=\"return mV('1Ch',13,9);\">1Ch 13:9</a>). In the parallel passage in Samuel (<a href=\"#\" onClick=\"return mV('2Sa',6,6);\">2Sa 6:6</a>) it is called \"Nachon's threshing-floor.\" It was a place not far north-west from Jerusalem.";
</script>
