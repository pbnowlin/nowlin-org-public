<script src="./js/NoNavHeader.js"  type="text/javascript"></script>
<script>
var eastonArray = new Array ();
eastonArray["$$T0000650"] = "<strong>Bridle:</strong> Three Hebrew words are thus rendered in the Authorized Version.<br><br>(1.) Heb. <i>mahsom'</i> signifies a muzzle or halter or bridle, by which the rider governs his horse (<a href=\"#\" onClick=\"return mV('Psa',39,1);\">Psa 39:1</a>).<br><br>(2.) <i>Me'theg</i>, rendered also \"bit\" in <a href=\"#\" onClick=\"return mV('Psa',32,9);\">Psa 32:9</a>, which is its proper meaning. Found in <a href=\"#\" onClick=\"return mV('2Ki',19,28);\">2Ki 19:28</a>, where the restraints of God's providence are metaphorically styled his \"bridle\" and \"hook.\" God's placing a \"bridle in the jaws of the people\" (<a href=\"#\" onClick=\"return mV('Isa',30,28);\">Isa 30:28</a>; <a href=\"#\" onClick=\"return mV('Isa',37,29);\">37:29</a>) signifies his preventing the Assyrians from carrying out their purpose against Jerusalem.<br><br>(3.) Another word, <i>re'sen</i>, was employed to represent a halter or bridle-rein, as used <a href=\"#\" onClick=\"return mV('Psa',32,9);\">Psa 32:9</a>; <a href=\"#\" onClick=\"return mV('Isa',30,28);\">Isa 30:28</a>. In <a href=\"#\" onClick=\"return mV('Job',30,11);\">Job 30:11</a> the restraints of law and humanity are called a bridle.";
eastonArray["$$T0000651"] = "<strong>Brier:</strong> This word occurs frequently, and is the translation of several different terms.<br><br>(1.) <a href=\"#\" onClick=\"return mV('Mic',7,4);\">Mic 7:4</a>, it denotes a species of thorn shrub used for hedges. In <a href=\"#\" onClick=\"return mV('Pro',15,19);\">Pro 15:19</a> the word is rendered \"thorn\" (Heb. <i>hedek</i>, \"stinging\"), supposed by some to be what is called the \"apple of Sodom\" (q.v.).<br><br>(2.) <a href=\"#\" onClick=\"return mV('Eze',28,24);\">Eze 28:24</a>, <i>sallon'</i>, properly a \"prickle,\" such as is found on the shoots of the palm tree.<br><br>(3.) <a href=\"#\" onClick=\"return mV('Isa',55,13);\">Isa 55:13</a>, probably simply a thorny bush. Some, following the Vulgate Version, regard it as the \"nettle.\"<br><br>(4.) <a href=\"#\" onClick=\"return mV('Isa',5,6);\">Isa 5:6</a>; <a href=\"#\" onClick=\"return mV('Isa',7,'23-25');\">7:23-25</a>, etc., frequently used to denote thorny shrubs in general. In <a href=\"#\" onClick=\"return mV('Isa',10,17);\">Isa 10:17</a>; <a href=\"#\" onClick=\"return mV('Isa',27,4);\">Isa 27:4</a>, it means troublesome men.<br><br>(5.) In <a href=\"#\" onClick=\"return mV('Hbr',6,8);\">Hbr 6:8</a> the Greek word (tribolos) so rendered means \"three-pronged,\" and denotes the land caltrop, a low throny shrub resembling in its spikes the military \"crow-foot.\" Comp. <a href=\"#\" onClick=\"return mV('Mat',7,16);\">Mat 7:16</a>, \"thistle.\"";
eastonArray["$$T0000652"] = "<strong>Brigandine:</strong> (<a href=\"#\" onClick=\"return mV('Jer',46,4);\">Jer 46:4</a>; <a href=\"#\" onClick=\"return mV('Jer',51,3);\">51:3</a>), an obsolete English word denoting a scale coat of armour, or habergeon, worn by light-armed \"brigands.\" The Revised Version has \"coat of mail.\"";
eastonArray["$$T0000653"] = "<strong>Brimstone:</strong> an inflammable mineral substance found in quantities on the shores of the Dead Sea. The cities of the plain were destroyed by a rain of fire and brimstone (<a href=\"#\" onClick=\"return mV('Gen',19,24,25);\">Gen 19:24-25</a>). In <a href=\"#\" onClick=\"return mV('Isa',34,9);\">Isa 34:9</a> allusion is made to the destruction of these cities. This word figuratively denotes destruction or punishment (<a href=\"#\" onClick=\"return mV('Job',18,15);\">Job 18:15</a>; <a href=\"#\" onClick=\"return mV('Isa',30,33);\">Isa 30:33</a>; <a href=\"#\" onClick=\"return mV('Isa',34,9);\">34:9</a>; <a href=\"#\" onClick=\"return mV('Psa',11,6);\">Psa 11:6</a>; <a href=\"#\" onClick=\"return mV('Eze',38,22);\">Eze 38:22</a>). It is used to express the idea of excruciating torment in <a href=\"#\" onClick=\"return mV('Rev',14,10);\">Rev 14:10</a>; <a href=\"#\" onClick=\"return mV('Rev',19,20);\">19:20</a>; <a href=\"#\" onClick=\"return mV('Rev',20,10);\">20:10</a>.";
eastonArray["$$T0000654"] = "<strong>Brook:</strong> a torrent.<br><br>(1.) Applied to small streams, as the Arnon, Jabbok, etc. Isaiah (<a href=\"#\" onClick=\"return mV('Isa',15,7);\">Isa 15:7</a>) speaks of the \"book of the willows,\" probably the Wady-el-Asha.<br><br>(2.) It is also applied to winter torrents (<a href=\"#\" onClick=\"return mV('Job',6,15);\">Job 6:15</a>; <a href=\"#\" onClick=\"return mV('Num',34,5);\">Num 34:5</a>; <a href=\"#\" onClick=\"return mV('Jos',15,4,47);\">Jos 15:4, 47</a>), and to the torrent-bed or wady as well as to the torrent itself (<a href=\"#\" onClick=\"return mV('Num',13,23);\">Num 13:23</a>; <a href=\"#\" onClick=\"return mV('1Ki',17,3);\">1Ki 17:3</a>).<br><br>(3.) In <a href=\"#\" onClick=\"return mV('Isa',19,7);\">Isa 19:7</a> the river Nile is meant, as rendered in the Revised Version.";
eastonArray["$$T0000655"] = "<strong>Brother:</strong><br><br>(1.) In the natural and common sense (<a href=\"#\" onClick=\"return mV('Mat',1,2);\">Mat 1:2</a>; <a href=\"#\" onClick=\"return mV('Luk',3,1,19);\">Luk 3:1, 19</a>).<br><br>(2.) A near relation, a cousin (<a href=\"#\" onClick=\"return mV('Gen',13,8);\">Gen 13:8</a>; <a href=\"#\" onClick=\"return mV('Gen',14,16);\">14:16</a>; <a href=\"#\" onClick=\"return mV('Mat',12,46);\">Mat 12:46</a>; <a href=\"#\" onClick=\"return mV('Jhn',7,3);\">Jhn 7:3</a>; <a href=\"#\" onClick=\"return mV('Act',1,14);\">Act 1:14</a>; <a href=\"#\" onClick=\"return mV('Gal',1,19);\">Gal 1:19</a>).<br><br>(3.) Simply a fellow-countryman (<a href=\"#\" onClick=\"return mV('Mat',5,47);\">Mat 5:47</a>; <a href=\"#\" onClick=\"return mV('Act',3,22);\">Act 3:22</a>; <a href=\"#\" onClick=\"return mV('Hbr',7,5);\">Hbr 7:5</a>).<br><br>(4.) A disciple or follower (<a href=\"#\" onClick=\"return mV('Mat',25,40);\">Mat 25:40</a>; <a href=\"#\" onClick=\"return mV('Hbr',2,11,12);\">Hbr 2:11-12</a>).<br><br>(5.) One of the same faith (<a href=\"#\" onClick=\"return mV('Amo',1,9);\">Amo 1:9</a>; <a href=\"#\" onClick=\"return mV('Act',9,30);\">Act 9:30</a>; <a href=\"#\" onClick=\"return mV('Act',11,29);\">11:29</a>; <a href=\"#\" onClick=\"return mV('1Cr',5,11);\">1Cr 5:11</a>); whence the early disciples of our Lord were known to each other as brethren.<br><br>(6.) A colleague in office (<a href=\"#\" onClick=\"return mV('Ezr',3,2);\">Ezr 3:2</a>; <a href=\"#\" onClick=\"return mV('1Cr',1,1);\">1Cr 1:1</a>; <a href=\"#\" onClick=\"return mV('2Cr',1,1);\">2Cr 1:1</a>).<br><br>(7.) A fellow-man (<a href=\"#\" onClick=\"return mV('Gen',9,5);\">Gen 9:5</a>; <a href=\"#\" onClick=\"return mV('Gen',19,7);\">19:7</a>; <a href=\"#\" onClick=\"return mV('Mat',5,'22-24');\">Mat 5:22-24</a>; <a href=\"#\" onClick=\"return mV('Mat',7,5);\">7:5</a>; <a href=\"#\" onClick=\"return mV('Hbr',2,17);\">Hbr 2:17</a>).<br><br>(8.) One beloved or closely united with another in affection (<a href=\"#\" onClick=\"return mV('2Sa',1,26);\">2Sa 1:26</a>; <a href=\"#\" onClick=\"return mV('Act',6,3);\">Act 6:3</a>; <a href=\"#\" onClick=\"return mV('1Th',5,1);\">1Th 5:1</a>). Brethren of Jesus (<a href=\"#\" onClick=\"return mV('Mat',1,25);\">Mat 1:25</a>; <a href=\"#\" onClick=\"return mV('Mar',3,31,32);\">Mar 3:31-32</a>; <a href=\"#\" onClick=\"return mV('Gal',1,19);\">Gal 1:19</a>; <a href=\"#\" onClick=\"return mV('1Cr',9,5);\">1Cr 9:5</a>, etc.) were probably the younger children of Joseph and Mary. Some have supposed that they may have been the children of Joseph by a former marriage, and others that they were the children of Mary, the Virgin's sister, and wife of Cleophas. The first interpretation, however, is the most natural.";
eastonArray["$$T0000656"] = "<strong>Bruit:</strong> a rumour or report (<a href=\"#\" onClick=\"return mV('Jer',10,22);\">Jer 10:22</a>, R.V. \"rumour; <a href=\"#\" onClick=\"return mV('Nah',3,19);\">Nah 3:19</a>).";
eastonArray["$$T0000657"] = "<strong>Bucket:</strong> a vessel to draw water with (<a href=\"#\" onClick=\"return mV('Isa',40,15);\">Isa 40:15</a>); used figuratively, probably, of a numerous issue (<a href=\"#\" onClick=\"return mV('Num',24,7);\">Num 24:7</a>).";
eastonArray["$$T0000658"] = "<strong>Buckler:</strong><br><br>(1.) A portable shield (<a href=\"#\" onClick=\"return mV('2Sa',22,31);\">2Sa 22:31</a>; <a href=\"#\" onClick=\"return mV('1Ch',5,18);\">1Ch 5:18</a>).<br><br>(2.) A shield surrounding the person; the targe or round form; used once figuratively (<a href=\"#\" onClick=\"return mV('Psa',91,4);\">Psa 91:4</a>).<br><br>(3.) A large shield protecting the whole body (<a href=\"#\" onClick=\"return mV('Psa',35,2);\">Psa 35:2</a>; <a href=\"#\" onClick=\"return mV('Eze',23,24);\">Eze 23:24</a>; <a href=\"#\" onClick=\"return mV('Eze',26,8);\">26:8</a>).<br><br>(4.) A lance or spear; improperly rendered \"buckler\" in the Authorized Version (<a href=\"#\" onClick=\"return mV('1Ch',12,8);\">1Ch 12:8</a>), but correctly in the Revised Version \"spear.\"<br><br>The leather of shields required oiling (<a href=\"#\" onClick=\"return mV('2Sa',1,21);\">2Sa 1:21</a>; <a href=\"#\" onClick=\"return mV('Isa',21,5);\">Isa 21:5</a>), so as to prevent its being injured by moisture. Copper (= \"brass\") shields were also in use (<a href=\"#\" onClick=\"return mV('1Sa',17,6);\">1Sa 17:6</a>; <a href=\"#\" onClick=\"return mV('1Ki',14,27);\">1Ki 14:27</a>). Those spoken of in <a href=\"#\" onClick=\"return mV('1Ki',10,16);\">1Ki 10:16</a>, etc.; <a href=\"#\" onClick=\"return mV('1Ki',14,26);\">14:26</a>, were probably of massive metal.<br><br>The shields David had taken from his enemies were suspended in the temple as mementoes (<a href=\"#\" onClick=\"return mV('2Ki',11,10);\">2Ki 11:10</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000315');\">ARMOUR</a>; <a href=\"#\" onClick=\"return doDictLookup('ET00003368');\">SHIELD</a>.)";
eastonArray["$$T0000659"] = "<strong>Building:</strong> among the Jews was suited to the climate and conditions of the country. They probably adopted the kind of architecture for their dwellings which they found already existing when they entered Canaan (<a href=\"#\" onClick=\"return mV('Deu',6,10);\">Deu 6:10</a>; <a href=\"#\" onClick=\"return mV('Num',13,19);\">Num 13:19</a>). Phoenician artists (<a href=\"#\" onClick=\"return mV('2Sa',5,11);\">2Sa 5:11</a>; <a href=\"#\" onClick=\"return mV('1Ki',5,6,18);\">1Ki 5:6, 18</a>) assisted at the erection of the royal palace and the temple at Jerusalem. Foreigners also assisted at the restoration of the temple after the Exile (<a href=\"#\" onClick=\"return mV('Ezr',3,7);\">Ezr 3:7</a>).<br><br>In <a href=\"#\" onClick=\"return mV('Gen',11,3,9);\">Gen 11:3, 9</a>, we have the first recorded instance of the erection of buildings. The cities of the plain of Shinar were founded by the descendants of Shem (<a href=\"#\" onClick=\"return mV('Gen',10,11,12,22);\">10:11-12, 22</a>).<br><br>The Israelites were by occupation shepherds and dwellers in tents (<a href=\"#\" onClick=\"return mV('Gen',47,3);\">Gen 47:3</a>); but from the time of their entering Canaan they became dwellers in towns, and in houses built of the native limestone of Palestine. Much building was carried on in Solomon's time. Besides the buildings he completed at Jerusalem, he also built Baalath and Tadmor (<a href=\"#\" onClick=\"return mV('1Ki',9,15,24);\">1Ki 9:15, 24</a>). Many of the kings of Israel and Judah were engaged in erecting various buildings.<br><br>Herod and his sons and successors restored the temple, and built fortifications and other structures of great magnificence in Jerusalem (<a href=\"#\" onClick=\"return mV('Luk',21,5);\">Luk 21:5</a>).<br><br>The instruments used in building are mentioned as the plumb-line (<a href=\"#\" onClick=\"return mV('Amo',7,7);\">Amo 7:7</a>), the measuring-reed (<a href=\"#\" onClick=\"return mV('Eze',40,3);\">Eze 40:3</a>), and the saw (<a href=\"#\" onClick=\"return mV('1Ki',7,9);\">1Ki 7:9</a>).<br><br>Believers are \"God's building\" (<a href=\"#\" onClick=\"return mV('1Cr',3,9);\">1Cr 3:9</a>); and heaven is called \"a building of God\" (<a href=\"#\" onClick=\"return mV('2Cr',5,1);\">2Cr 5:1</a>). Christ is the only foundation of his church (<a href=\"#\" onClick=\"return mV('1Cr',3,'10-12');\">1Cr 3:10-12</a>), of which he also is the builder (<a href=\"#\" onClick=\"return mV('Mat',16,18);\">Mat 16:18</a>).";
eastonArray["$$T0000660"] = "<strong>Bul:</strong> rainy, the eighth ecclesiastical month of the year (<a href=\"#\" onClick=\"return mV('1Ki',6,38);\">1Ki 6:38</a>), and the second month of the civil year; later called Marchesvan (q.v.). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002592');\">MONTH</a>.)";
eastonArray["$$T0000661"] = "<strong>Bullock:</strong><br>(1.) The translation of a word which is a generic name for horned cattle (<a href=\"#\" onClick=\"return mV('Isa',65,25);\">Isa 65:25</a>). It is also rendered \"cow\" (<a href=\"#\" onClick=\"return mV('Eze',4,15);\">Eze 4:15</a>), \"ox\" (<a href=\"#\" onClick=\"return mV('Gen',12,16);\">Gen 12:16</a>).<br><br>(2.) The translation of a word always meaning an animal of the ox kind, without distinction of age or sex (<a href=\"#\" onClick=\"return mV('Hsa',12,11);\">Hsa 12:11</a>). It is rendered \"cow\" (<a href=\"#\" onClick=\"return mV('Num',18,17);\">Num 18:17</a>) and \"ox\" (<a href=\"#\" onClick=\"return mV('Lev',17,3);\">Lev 17:3</a>).<br><br>(3.) Another word is rendered in the same way (<a href=\"#\" onClick=\"return mV('Jer',31,18);\">Jer 31:18</a>). It is also translated \"calf\" (<a href=\"#\" onClick=\"return mV('Lev',9,3);\">Lev 9:3</a>; <a href=\"#\" onClick=\"return mV('Mic',6,6);\">Mic 6:6</a>). It is the same word used of the \"molten calf\" (<a href=\"#\" onClick=\"return mV('Exd',32,4,8);\">Exd 32:4, 8</a>) and \"the golden calf\" (<a href=\"#\" onClick=\"return mV('1Ki',12,28);\">1Ki 12:28</a>).<br><br>(4.) In <a href=\"#\" onClick=\"return mV('Jdg',6,25);\">Jdg 6:25</a>; <a href=\"#\" onClick=\"return mV('Isa',34,7);\">Isa 34:7</a>, the Hebrew word is different. It is the customary word for bulls offered in sacrifice. In <a href=\"#\" onClick=\"return mV('Hsa',14,2);\">Hos 14:2</a>, the Authorized Version has \"calves,\" the Revised Version \"bullocks.\"";
eastonArray["$$T0000662"] = "<strong>Bulrush:</strong><br><br>(1.) In <a href=\"#\" onClick=\"return mV('Isa',58,5);\">Isa 58:5</a> the rendering of a word which denotes \"belonging to a marsh,\" from the nature of the soil in which it grows (<a href=\"#\" onClick=\"return mV('Isa',18,2);\">Isa 18:2</a>). It was sometimes platted into ropes (<a href=\"#\" onClick=\"return mV('Job',41,2);\">Job 41:2</a>; A.V., \"hook,\" R.V., \"rope,\" lit. \"cord of rushes\").<br><br>(2.) In <a href=\"#\" onClick=\"return mV('Exd',2,3);\">Exd 2:3</a>; <a href=\"#\" onClick=\"return mV('Isa',18,2);\">Isa 18:2</a> (R.V., \"papyrus\") this word is the translation of the Hebrew <i>gome</i>, which designates the plant as absorbing moisture. In <a href=\"#\" onClick=\"return mV('Isa',35,7);\">Isa 35:7</a> and <a href=\"#\" onClick=\"return mV('Job',8,11);\">Job 8:11</a> it is rendered \"rush.\" This was the Egyptian papyrus (<i>papyrus Nilotica</i>). It was anciently very abundant in Egypt. The Egyptians made garments and shoes and various utensils of it. It was used for the construction of the ark of Moses (<a href=\"#\" onClick=\"return mV('Exd',2,3,5);\">Exd 2:3, 5</a>). The root portions of the stem were used for food. The inside bark was cut into strips, which were sewed together and dried in the sun, forming the papyrus used for writing. It is no longer found in Egypt, but grows luxuriantly in Palestine, in the marshes of the Huleh, and in the swamps at the north end of the Lake of Gennesaret. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000710');\">CANE</a>.)";
eastonArray["$$T0000663"] = "<strong>Bulwarks:</strong> mural towers, bastions, were introduced by king Uzziah (<a href=\"#\" onClick=\"return mV('2Ch',26,15);\">2Ch 26:15</a>; <a href=\"#\" onClick=\"return mV('Zep',1,16);\">Zep 1:16</a>; <a href=\"#\" onClick=\"return mV('Psa',48,13);\">Psa 48:13</a>; <a href=\"#\" onClick=\"return mV('Isa',26,1);\">Isa 26:1</a>). There are five Hebrew words so rendered in the Authorized Version, but the same word is also variously rendered.";
eastonArray["$$T0000664"] = "<strong>Bunch:</strong><br><br>(1.) A bundle of twigs (<a href=\"#\" onClick=\"return mV('Exd',12,22);\">Exd 12:22</a>).<br><br>(2.) Bunch or cake of raisins (<a href=\"#\" onClick=\"return mV('2Sa',16,1);\">2Sa 16:1</a>).<br><br>(3.) The \"bunch of a camel\" (<a href=\"#\" onClick=\"return mV('Isa',30,6);\">Isa 30:6</a>).";
eastonArray["$$T0000665"] = "<strong>Burden:</strong><br><br>(1.) A load of any kind (<a href=\"#\" onClick=\"return mV('Exd',23,5);\">Exd 23:5</a>).<br><br>(2.) A severe task (<a href=\"#\" onClick=\"return mV('Exd',2,11);\">Exd 2:11</a>).<br><br>(3.) A difficult duty, requiring effort (<a href=\"#\" onClick=\"return mV('Exd',18,22);\">Exd 18:22</a>).<br><br>(4.) A prophecy of a calamitous or disastrous nature (<a href=\"#\" onClick=\"return mV('Isa',13,1);\">Isa 13:1</a>; <a href=\"#\" onClick=\"return mV('Isa',17,1);\">17:1</a>; <a href=\"#\" onClick=\"return mV('Hab',1,1);\">Hab 1:1</a>, etc.).";
eastonArray["$$T0000666"] = "<strong>Burial:</strong> The first burial we have an account of is that of Sarah (<a href=\"#\" onClick=\"return mV('Gen',23,19)\">Gen 23:19</a>). The first commercial transaction recorded is that of the of the purchase of a burial-place <a href=\"#\" onClick=\"return mV('Gen',23,161)\">Gen 23:16</a>), for which Abraham weighed to Ephron \"four hundred shekels of silver current money with the merchants.\" Thus the patriarch became the owner of a part of the land of Canaan, the only part he ever possessed. When he himself died, \"his sons Isaac and Ishmael buried him in the cave of Machpelah,\" beside Sarah his wife (<a href=\"#\" onClick=\"return mV('Gen',25,9);\">Gen 25:9</a>).<br><br>Deborah, Rebekah's nurse, was buried under Allon-bachuth, \"the oak of weeping\" (<a href=\"#\" onClick=\"return mV('Gen',35,8);\">Gen 35:8</a>), near to Bethel. Rachel died, and was buried near Ephrath; \"and Jacob set a pillar upon her grave\" (<a href=\"#\" onClick=\"return mV('Gen',35,'16-20');\">Gen 35:16-20</a>). Isaac was buried at Hebron, where he had died (<a href=\"#\" onClick=\"return mV('Gen',35,27,29);\">Gen 35:27, 29</a>). Jacob, when charging his sons to bury him in the cave of Machpelah, said, \"There they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah\" (<a href=\"#\" onClick=\"return mV('Gen',49,31);\">49:31</a>). In compliance with the oath which he made him swear unto him (<a href=\"#\" onClick=\"return mV('Gen',47,'29-31');\">47:29-31</a>), Joseph, assisted by his brethren, buried Jacob in the cave of Machpelah (<a href=\"#\" onClick=\"return mV('Gen',50,2,13);\">50:2, 13</a>). At the Exodus, Moses \"took the bones of Joseph with him,\" and they were buried in the \"parcel of ground\" which Jacob had bought of the sons of Hamor (<a href=\"#\" onClick=\"return mV('Jos',24,32);\">Jos 24:32</a>), which became Joseph's inheritance (<a href=\"#\" onClick=\"return mV('Gen',48,22);\">Gen 48:22</a>; <a href=\"#\" onClick=\"return mV('1Ch',5,1);\">1Ch 5:1</a>; <a href=\"#\" onClick=\"return mV('Jhn',4,5);\">Jhn 4:5</a>). Two burials are mentioned as having taken place in the wilderness. That of Miriam (<a href=\"#\" onClick=\"return mV('Num',20,1);\">Num 20:1</a>), and that of Moses, \"in the land of Moab\" (<a href=\"#\" onClick=\"return mV('Deu',34,5,6,8);\">Deu 34:5-6, 8</a>). There is no account of the actual burial of Aaron, which probably, however, took place on the summit of Mount Hor (<a href=\"#\" onClick=\"return mV('Num',20,28,29);\">Num 20:28-29</a>).<br><br>Joshua was buried \"in the border of his inheritance in Timnath-serah\" (<a href=\"#\" onClick=\"return mV('Jos',24,30);\">Jos 24:30</a>).<br><br>In Job we find a reference to burying-places, which were probably the Pyramids (<a href=\"#\" onClick=\"return mV('Job',3,14,15);\">Job 3:14-15</a>). The Hebrew word for \"waste places\" here resembles in sound the Egyptian word for \"pyramids.\"<br><br>Samuel, like Moses, was honoured with a national burial (<a href=\"#\" onClick=\"return mV('1Sa',25,1);\">1Sa 25:1</a>). Joab (<a href=\"#\" onClick=\"return mV('1Ki',2,34);\">1Ki 2:34</a>) \"was buried in his own house in the wilderness.\"<br><br>In connection with the burial of Saul and his three sons we meet for the first time with the practice of burning the dead (<a href=\"#\" onClick=\"return mV('1Sa',31,'11-13');\">1Sa 31:11-13</a>). The same practice is again referred to by Amos (<a href=\"#\" onClick=\"return mV('Amo',6,10);\">Amo 6:10</a>).<br><br>Absalom was buried \"in the wood\" where he was slain (<a href=\"#\" onClick=\"return mV('2Sa',18,17,18);\">2Sa 18:17-18</a>). The raising of the heap of stones over his grave was intended to mark abhorrence of the person buried (<a href=\"#\" onClick=\"return mV('Jos',7,26);\">Jos 7:26</a> and <a href=\"#\" onClick=\"return mV('Jos',8,29);\">8:29</a>). There was no fixed royal burying-place for the Hebrew kings. We find several royal burials taking place, however, \"in the city of David\" (<a href=\"#\" onClick=\"return mV('1Ki',2,10);\">1Ki 2:10</a>; <a href=\"#\" onClick=\"return mV('1Ki',11,43);\">11:43</a>; <a href=\"#\" onClick=\"return mV('1Ki',15,8);\">15:8</a>; <a href=\"#\" onClick=\"return mV('2Ki',14,19,20);\">2Ki 14:19-20</a>; <a href=\"#\" onClick=\"return mV('2Ki',15,38);\">15:38</a>; <a href=\"#\" onClick=\"return mV('1Ki',14,31);\">1Ki 14:31</a>; <a href=\"#\" onClick=\"return mV('1Ki',22,50);\">22:50</a>; <a href=\"#\" onClick=\"return mV('2Ch',21,19,20);\">2Ch 21:19-20</a>; <a href=\"#\" onClick=\"return mV('2Ch',24,25);\">2Ch 24:25</a>, etc.). Hezekiah was buried in the mount of the sepulchres of the sons of David; \"and all Judah and the inhabitants of Jerusalem did him honour at his death\" (<a href=\"#\" onClick=\"return mV('2Ch',32,33);\">2Ch 32:33</a>).<br><br>Little is said regarding the burial of the kings of Israel. Some of them were buried in Samaria, the capital of their kingdom (<a href=\"#\" onClick=\"return mV('2Ki',10,35);\">2Ki 10:35</a>; <a href=\"#\" onClick=\"return mV('2Ki',13,9);\">13:9</a>; <a href=\"#\" onClick=\"return mV('2Ki',14,16);\">14:16</a>).<br><br>Our Lord was buried in a new tomb, hewn out of the rock, which Joseph of Arimathea had prepared for himself (<a href=\"#\" onClick=\"return mV('Mat',27,'57-60');\">Mat 27:57-60</a>; <a href=\"#\" onClick=\"return mV('Mar',15,46);\">Mar 15:46</a>; <a href=\"#\" onClick=\"return mV('Jhn',19,41,42);\">Jhn 19:41-42</a>).<br><br>The grave of Lazarus was \"a cave, and a stone lay on it\" (<a href=\"#\" onClick=\"return mV('Jhn',11,38);\">Jhn 11:38</a>). Graves were frequently either natural caverns or artificial excavations formed in the sides of rocks (<a href=\"#\" onClick=\"return mV('Gen',23,9);\">Gen 23:9</a>; <a href=\"#\" onClick=\"return mV('Mat',27,60);\">Mat 27:60</a>); and coffins were seldom used, unless when the body was brought from a distance.";
eastonArray["$$T0000667"] = "<strong>Burnt offering:</strong> Hebrew <i>olah</i>; i.e., \"ascending,\" the whole being consumed by fire, and regarded as ascending to God while being consumed. Part of every offering was burnt in the sacred fire, but this was wholly burnt, a \"whole burnt offering.\" It was the most frequent form of sacrifice, and apparently the only one mentioned in the book of Genesis. Such were the sacrifices offered by Abel (<a href=\"#\" onClick=\"return mV('Gen',4,3,4);\">Gen 4:3-4</a>, here called <i>minhah</i>; i.e., \"a gift\"), Noah (<a href=\"#\" onClick=\"return mV('Gen',8,20);\">Gen 8:20</a>), Abraham (<a href=\"#\" onClick=\"return mV('Gen',22,2,7,8,13);\">Gen 22:2, 7-8, 13</a>), and by the Hebrews in Egypt (<a href=\"#\" onClick=\"return mV('Exd',10,25);\">Exd 10:25</a>).<br><br>The law of Moses afterwards prescribed the occasions and the manner in which burnt sacrifices were to be offered. There were \"the continual burnt offering\" (<a href=\"#\" onClick=\"return mV('Exd',29,'38-42');\">Exd 29:38-42</a>; <a href=\"#\" onClick=\"return mV('Lev',6,'9-13');\">Lev 6:9-13</a>), \"the burnt offering of every sabbath,\" which was double the daily one (<a href=\"#\" onClick=\"return mV('Num',28,9,10);\">Num 28:9-10</a>), \"the burnt offering of every month\" (<a href=\"#\" onClick=\"return mV('Num',28,'11-15');\">28:11-15</a>), the offerings at the Passover (<a href=\"#\" onClick=\"return mV('Num',28,'19-23');\">28:19-23</a>), at Pentecost (<a href=\"#\" onClick=\"return mV('Lev',23,16);\">Lev 23:16</a>), the feast of Trumpets (<a href=\"#\" onClick=\"return mV('Lev',23,'23-25');\">23:23-25</a>), and on the day of Atonement (<a href=\"#\" onClick=\"return mV('Lev',16,'1-')\">Lev 16</a>).<br><br>On other occasions special sacrifices were offered, as at the consecration of Aaron (<a href=\"#\" onClick=\"return mV('Exd',29,'1-')\">Exd 29</a>) and the dedication of the temple (<a href=\"#\" onClick=\"return mV('1Ki',8,5,'62-64');\">1Ki 8:5, 62-64</a>).<br><br>Free-will burnt offerings were also permitted (<a href=\"#\" onClick=\"return mV('Lev',1,13);\">Lev 1:13</a>), and were offered at the accession of Solomon to the throne (<a href=\"#\" onClick=\"return mV('1Ch',29,21);\">1Ch 29:21</a>), and at the reformation brought about by Hezekiah (<a href=\"#\" onClick=\"return mV('2Ch',29,'31-35');\">2Ch 29:31-35</a>).<br><br>These offerings signified the complete dedication of the offerers unto God. This is referred to in <a href=\"#\" onClick=\"return mV('Rom',12,1);\">Rom 12:1</a>. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000185');\">ALTAR</a>,  <a href=\"#\" onClick=\"return doDictLookup('ET0003179');\">SACRIFICE</a>.)";
eastonArray["$$T0000668"] = "<strong>Bush:</strong> in which Jehovah appeared to Moses in the wilderness (<a href=\"#\" onClick=\"return mV('Exd',3,2);\">Exd 3:2</a>; <a href=\"#\" onClick=\"return mV('Act',7,30);\">Act 7:30</a>). It is difficult to say what particular kind of plant or bush is here meant. Probably it was the mimosa or acacia. The words \"in the bush\" in <a href=\"#\" onClick=\"return mV('Mar',12,26);\">Mar 12:26</a>; <a href=\"#\" onClick=\"return mV('Luk',20,37);\">Luk 20:37</a>, mean \"in the passage or paragraph on the bush;\" i.e., in Ex. 3.";
eastonArray["$$T0000669"] = "<strong>Butler:</strong> properly a servant in charge of the wine (<a href=\"#\" onClick=\"return mV('Gen',40,'1-13');\">Gen 40:1-13</a>; <a href=\"#\" onClick=\"return mV('Gen',41,9);\">41:9</a>). The Hebrew word, <i>mashkeh</i>, thus translated is rendered also (plural) \"cup-bearers\" (<a href=\"#\" onClick=\"return mV('1Ki',10,5);\">1Ki 10:5</a>; <a href=\"#\" onClick=\"return mV('2Ch',9,4);\">2Ch 9:4</a>). Nehemiah (<a href=\"#\" onClick=\"return mV('Neh',1,11);\">Neh 1:11</a>) was cup-bearer to king Artaxerxes. It was a position of great responsibility and honour in royal households.";
eastonArray["$$T0000670"] = "<strong>Butter:</strong> (Heb. hemah), curdled milk (<a href=\"#\" onClick=\"return mV('Gen',18,8);\">Gen 18:8</a>; <a href=\"#\" onClick=\"return mV('Jdg',5,25);\">Jdg 5:25</a>; <a href=\"#\" onClick=\"return mV('2Sa',17,29);\">2Sa 17:29</a>), or butter in the form of the skim of hot milk or cream, called by the Arabs kaimak, a semi-fluid (<a href=\"#\" onClick=\"return mV('Job',20,17);\">Job 20:17</a>; <a href=\"#\" onClick=\"return mV('Job',29,6);\">29:6</a>; <a href=\"#\" onClick=\"return mV('Deu',32,14);\">Deu 32:14</a>). The words of <a href=\"#\" onClick=\"return mV('Pro',30,33);\">Pro 30:33</a> have been rendered by some \"the pressure [not churning] of milk bringeth forth cheese.\"";
eastonArray["$$T0000671"] = "<strong>Buz:</strong> contempt.<br><br>(1.) The second son of Nahor and Milcah, and brother of Huz (<a href=\"#\" onClick=\"return mV('Gen',22,21);\">Gen 22:21</a>). Elihu was one of his descendants (<a href=\"#\" onClick=\"return mV('Job',32,2);\">Job 32:2</a>).<br><br>(2.) One of the chiefs of the tribe of Gad (<a href=\"#\" onClick=\"return mV('1Ch',5,14);\">1Ch 5:14</a>).<br><br>(3.) A district in Arabia Petrea (<a href=\"#\" onClick=\"return mV('Jer',25,23);\">Jer 25:23</a>).";
eastonArray["$$T0000672"] = "<strong>Buzi:</strong> the father of the prophet Ezekiel (<a href=\"#\" onClick=\"return mV('Eze',1,3);\">Eze 1:3</a>).";
eastonArray["$$T0000673"] = "<strong>By:</strong> in the expression \"by myself\" (<a href=\"#\" onClick=\"return mV('1Cr',4,4);\">1Cr 4:4</a>), means, as rendered in the Revised Version, \"against myself.\"";
eastonArray["$$T0000674"] = "<strong>By and by:</strong> immediately (<a href=\"#\" onClick=\"return mV('Mat',13,21);\">Mat 13:21</a>; R.V., \"straightway; <a href=\"#\" onClick=\"return mV('Luk',21,9);\">Luk 21:9</a>).";
eastonArray["$$T0000675"] = "<strong>By-ways:</strong> only in <a href=\"#\" onClick=\"return mV('Jdg',5,6);\">Jdg 5:6</a> and <a href=\"#\" onClick=\"return mV('Psa',125,5);\">Psa 125:5</a>; literally \"winding or twisted roads.\" The margin has \"crooked ways.\"";
eastonArray["$$T0000676"] = "<strong>By-word:</strong> Hebrew <i>millah</i> (<a href=\"#\" onClick=\"return mV('Job',30,9);\">Job 30:9</a>), a word or speech, and hence object of talk; Hebrew <i>mashal</i> (<a href=\"#\" onClick=\"return mV('Psa',44,14);\">Psa 44:14</a>), a proverb or parable. When it denotes a sharp word of derision, as in <a href=\"#\" onClick=\"return mV('Deu',28,37);\">Deu 28:37</a>; <a href=\"#\" onClick=\"return mV('1Ki',9,7);\">1Ki 9:7</a>; <a href=\"#\" onClick=\"return mV('2Ch',7,20);\">2Ch 7:20</a>, the Hebrew <i>sheninah</i> is used. In <a href=\"#\" onClick=\"return mV('Jer',24,9);\">Jer 24:9</a> it is rendered \"taunt.\"";
eastonArray["$$T0000677"] = "<strong>Cab:</strong> hollow (R.V., \"kab\"), occurs only in <a href=\"#\" onClick=\"return mV('2Ki',6,25);\">2Ki 6:25</a>; a dry measure, the sixth part of a seah, and the eighteenth part of an ephah, equal to about two English quarts.";
eastonArray["$$T0000678"] = "<strong>Cabins:</strong> only in <a href=\"#\" onClick=\"return mV('Jer',37,16);\">Jer 37:16</a> (R.V., \"cells\"), arched vaults or recesses off a passage or room; cells for the closer confinement of prisoners.";
eastonArray["$$T0000679"] = "<strong>Cabul:</strong> how little! as nothing.<br><br>(1.) A town on the eastern border of Asher (<a href=\"#\" onClick=\"return mV('Jos',19,27);\">Jos 19:27</a>), probably one of the towns given by Solomon to Hiram; the modern Kabul, some 8 miles east of Accho, on the very borders of Galilee.<br><br>(2.) A district in the north-west of Galilee, near to Tyre, containing twenty cities given to Hiram by Solomon as a reward for various services rendered to him in building the temple (<a href=\"#\" onClick=\"return mV('1Ki',9,13);\">1Ki 9:13</a>), and as payment of the six score talents of gold he had borrowed from him. Hiram gave the cities this name because he was not pleased with the gift, the name signifying \"good for nothing.\" Hiram seems afterwards to have restored these cities to Solomon (<a href=\"#\" onClick=\"return mV('2Ch',8,2);\">2Ch 8:2</a>).";
eastonArray["$$T0000680"] = "<strong>Caesar:</strong> the title assumed by the Roman emperors after Julius Caesar. In the New Testament this title is given to various emperors as sovereigns of Judaea without their accompanying distinctive proper names (<a href=\"#\" onClick=\"return mV('Jhn',19,15);\">Jhn 19:15</a>; <a href=\"#\" onClick=\"return mV('Act',17,7);\">Act 17:7</a>). The Jews paid tribute to Caesar (<a href=\"#\" onClick=\"return mV('Mat',22,17);\">Mat 22:17</a>), and all Roman citizens had the right of appeal to him (<a href=\"#\" onClick=\"return mV('Act',25,11);\">Act 25:11</a>). The Caesars referred to in the New Testament are Augustus (<a href=\"#\" onClick=\"return mV('Luk',2,1);\">Luk 2:1</a>), Tiberius (<a href=\"#\" onClick=\"return mV('Luk',3,1);\">3:1</a>; <a href=\"#\" onClick=\"return mV('Luk',20,22);\">20:22</a>), Claudius (<a href=\"#\" onClick=\"return mV('Act',11,28);\">Act 11:28</a>), and Nero (<a href=\"#\" onClick=\"return mV('Act',25,8);\">Act 25:8</a>; <a href=\"#\" onClick=\"return mV('Phl',4,22);\">Phl 4:22</a>).";
eastonArray["$$T0000681"] = "<strong>Caesara Philippi:</strong> a city on the northeast of the marshy plain of el-Huleh, 120 miles north of Jerusalem, and 20 miles north of the Sea of Galilee, at the \"upper source\" of the Jordan, and near the base of Mount Hermon. It is mentioned in <a href=\"#\" onClick=\"return mV('Mat',16,13);\">Mat 16:13</a> and <a href=\"#\" onClick=\"return mV('Mar',8,27);\">Mar 8:27</a> as the northern limit of our Lord's public ministry. According to some its original name was Baal-Gad (<a href=\"#\" onClick=\"return mV('Jos',11,17);\">Jos 11:17</a>), or Baal-Hermon (<a href=\"#\" onClick=\"return mV('Jdg',3,3);\">Jdg 3:3</a>; <a href=\"#\" onClick=\"return mV('1Ch',5,23);\">1Ch 5:23</a>), when it was a Canaanite sanctuary of Baal. It was afterwards called Panium or Paneas, from a deep cavern full of water near the town. This name was given to the cavern by the Greeks of the Macedonian kingdom of Antioch because of its likeness to the grottos of Greece, which were always associated with the worship of their god Pan. Its modern name is Banias. Here Herod built a temple, which he dedicated to Augustus Caesar. This town was afterwards enlarged and embellished by Herod Philip, the tetrarch of Trachonitis, of whose territory it formed a part, and was called by him Caesarea Philippi, partly after his own name, and partly after that of the emperor Tiberius Caesar. It is thus distinguished from the Caesarea of Palestine. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002112');\">JORDAN</a>.)";
eastonArray["$$T0000682"] = "<strong>Caesarea:</strong> (Palestinae), a city on the shore of the Mediterranean, on the great road from Tyre to Egypt, about 70 miles northwest of Jerusalem, at the northern extremity of the plain of Sharon. It was built by Herod the Great (B.C. 10), who named it after Caesar Augustus, hence called Caesarea Sebaste (Gr. Sebastos = \"Augustus\"), on the site of an old town called \"Strato's Tower.\" It was the capital of the Roman province of Judaea, the seat of the governors or procurators, and the headquarters of the Roman troops. It was the great Gentile city of Palestine, with a spacious artificial harbour. It was adorned with many buildings of great splendour, after the manner of the Roman cities of the West. Here Cornelius the centurion was converted through the instrumentality of Peter (<a href=\"#\" onClick=\"return mV('Act',10,1,24);\">Act 10:1, 24</a>), and thus for the first time the door of faith was opened to the Gentiles. Philip the evangelist resided here with his four daughters (<a href=\"#\" onClick=\"return mV('Act',21,8);\">21:8</a>). From this place Saul sailed for his native Tarsus when forced to flee from Jerusalem (<a href=\"#\" onClick=\"return mV('Act',9,30);\">9:30</a>), and here he landed when returning from his second missionary journey (<a href=\"#\" onClick=\"return mV('Act',18,22);\">18:22</a>). He remained as a prisoner here for two years before his voyage to Rome (<a href=\"#\" onClick=\"return mV('Act',24,27);\">Act 24:27</a>; <a href=\"#\" onClick=\"return mV('Act',25,1,4,6,13);\">25:1, 4, 6, 13</a>). Here on a \"set day,\" when games were celebrated in the theatre in honour of the emperor Claudius, Herod Agrippa I. appeared among the people in great pomp, and in the midst of the idolatrous homage paid to him was suddenly smitten by an angel, and carried out a dying man. He was \"eaten of worms\" (<a href=\"#\" onClick=\"return mV('Act',12,'19-23');\">12:19-23</a>), thus perishing by the same loathsome disease as his granfather, Herod the Great. It still retains its ancient name Kaiseriyeh, but is now desolate. \"The present inhabitants of the ruins are snakes, scorpions, lizards, wild boars, and jackals.\" It is described as the most desolate city of all Palestine.";
eastonArray["$$T0000683"] = "<strong>Cage:</strong> (<a href=\"#\" onClick=\"return mV('Jer',5,27);\">Jer 5:27</a>, marg. \"coop\"; in <a href=\"#\" onClick=\"return mV('Amo',8,1);\">Amo 8:1</a>), a basket of wicker-work in which birds were placed after being caught. In <a href=\"#\" onClick=\"return mV('Rev',18,2);\">Rev 18:2</a> it is the rendering of the Greek <i>phulake</i>, properly a prison or place of confinement.";
eastonArray["$$T0000684"] = "<strong>Caiaphas:</strong> the Jewish high priest (A.D. 27-36) at the beginning of our Lord's public ministry, in the reign of Tiberius (<a href=\"#\" onClick=\"return mV('Luk',3,2);\">Luk 3:2</a>), and also at the time of his condemnation and crucifixion (<a href=\"#\" onClick=\"return mV('Mat',26,3,57);\">Mat 26:3, 57</a>; <a href=\"#\" onClick=\"return mV('Jhn',11,49);\">Jhn 11:49</a>; <a href=\"#\" onClick=\"return mV('Jhn',18,13,14);\">18:13-14</a>). He held this office during the whole of Pilate's administration. His wife was the daughter of Annas, who had formerly been high priest, and was probably the vicar or deputy (Heb. sagan) of Caiaphas. He was of the sect of the Sadducees (<a href=\"#\" onClick=\"return mV('Act',5,17);\">Act 5:17</a>), and was a member of the council when he gave his opinion that Jesus should be put to death \"for the people, and that the whole nation perish not\" (<a href=\"#\" onClick=\"return mV('Jhn',11,50);\">Jhn 11:50</a>). In these words he unconsciously uttered a prophecy. \"Like Saul, he was a prophet in spite of himself.\" Caiaphas had no power to inflict the punishment of death, and therefore Jesus was sent to Pilate, the Roman governor, that he might duly pronounce the sentence against him (<a href=\"#\" onClick=\"return mV('Mat',27,2);\">Mat 27:2</a>; <a href=\"#\" onClick=\"return mV('Jhn',18,28);\">Jhn 18:28</a>). At a later period his hostility to the gospel is still manifest (<a href=\"#\" onClick=\"return mV('Act',4,6);\">Act 4:6</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000246');\">ANNAS</a>.)";
eastonArray["$$T0000685"] = "<strong>Cain:</strong> a possession; a spear.<br><br>(1.) The first-born son of Adam and Eve (<a href=\"#\" onClick=\"return mV('Gen',4,'1-')\">Gen 4</a>). He became a tiller of the ground, as his brother Abel followed the pursuits of pastoral life. He was \"a sullen, self-willed, haughty, vindictive man; wanting the religious element in his character, and defiant even in his attitude towards God.\" It came to pass \"in process of time\" (marg. \"at the end of days\"), i.e., probably on the Sabbath, that the two brothers presented their offerings to the Lord. Abel's offering was of the \"firstlings of his flock and of the fat,\" while Cain's was \"of the fruit of the ground.\" Abel's sacrifice was \"more excellent\" (<a href=\"#\" onClick=\"return mV('Hbr',11,4);\">Hbr 11:4</a>) than Cain's, and was accepted by God. On this account Cain was \"very wroth,\" and cherished feelings of murderous hatred against his brother, and was at length guilty of the desperate outrage of putting him to death (<a href=\"#\" onClick=\"return mV('1Jo',3,12);\">1Jo 3:12</a>). For this crime he was expelled from Eden, and henceforth led the life of an exile, bearing upon him some mark which God had set upon him in answer to his own cry for mercy, so that thereby he might be protected from the wrath of his fellow-men; or it may be that God only gave him some sign to assure him that he would not be slain (<a href=\"#\" onClick=\"return mV('Gen',4,15);\">Gen 4:15</a>). Doomed to be a wanderer and a fugitive in the earth, he went forth into the \"land of Nod\", i.e., the land of \"exile\", which is said to have been in the \"east of Eden,\" and there he built a city, the first we read of, and called it after his son's name, Enoch. His descendants are enumerated to the sixth generation. They gradually degenerated in their moral and spiritual condition till they became wholly corrupt before God. This corruption prevailed, and at length the Deluge was sent by God to prevent the final triumph of evil. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000015');\">ABEL</a>.)<br><br>(2.) A town of the Kenites, a branch of the Midianites (<a href=\"#\" onClick=\"return mV('Jos',15,57);\">Jos 15:57</a>), on the east edge of the mountain above Engedi; probably the \"nest in a rock\" mentioned by Balaam (<a href=\"#\" onClick=\"return mV('Num',24,21);\">Num 24:21</a>). It is identified with the modern Yekin, 3 miles south-east of Hebron.";
eastonArray["$$T0000686"] = "<strong>Cainan:</strong> possession; smith.<br><br>(1.) The fourth antediluvian patriarch, the eldest son of Enos. He was 70 years old at the birth of his eldest son Mahalaleel, after which he lived 840 years (<a href=\"#\" onClick=\"return mV('Gen',5,'9-14');\">Gen 5:9-14</a>), and was 910 years old when he died. He is also called Kenan (<a href=\"#\" onClick=\"return mV('1Ch',1,2);\">1Ch 1:2</a>).<br><br>(2.) The son of Arphaxad (<a href=\"#\" onClick=\"return mV('Luk',3,36);\">Luk 3:36</a>). He is nowhere named in the Old Testament. He is usually called the \"second Cainan.\"";
eastonArray["$$T0000687"] = "<strong>Cake:</strong> Cakes made of wheat or barley were offered in the temple. They were salted, but unleavened (<a href=\"#\" onClick=\"return mV('Exd',29,2);\">Exd 29:2</a>; <a href=\"#\" onClick=\"return mV('Lev',2,4);\">Lev 2:4</a>). In idolatrous worship thin cakes or wafers were offered \"to the queen of heaven\" (<a href=\"#\" onClick=\"return mV('Jer',7,18);\">Jer 7:18</a>; <a href=\"#\" onClick=\"return mV('Jer',44,19);\">44:19</a>).<br><br>Pancakes are described in <a href=\"#\" onClick=\"return mV('2Sa',13,8,9);\">2Sa 13:8-9</a>. Cakes mingled with oil and baked in the oven are mentioned in <a href=\"#\" onClick=\"return mV('Lev',2,4);\">Lev 2:4</a>, and \"wafers unleavened anointed with oil,\" in <a href=\"#\" onClick=\"return mV('Exd',29,2);\">Exd 29:2</a>; <a href=\"#\" onClick=\"return mV('Lev',8,26);\">Lev 8:26</a>; <a href=\"#\" onClick=\"return mV('1Ch',23,29);\">1Ch 23:29</a>. \"Cracknels,\" a kind of crisp cakes, were among the things Jeroboam directed his wife to take with her when she went to consult Ahijah the prophet at Shiloh (<a href=\"#\" onClick=\"return mV('1Ki',14,3);\">1Ki 14:3</a>). Such hard cakes were carried by the Gibeonites when they came to Joshua (<a href=\"#\" onClick=\"return mV('Jos',9,5,12);\">Jos 9:5, 12</a>). They described their bread as \"mouldy;\" but the Hebrew word <i>nikuddim</i>, here used, ought rather to be rendered \"hard as biscuit.\" It is rendered \"cracknels\" in <a href=\"#\" onClick=\"return mV('1Ki',14,3);\">1Ki 14:3</a>. The ordinary bread, when kept for a few days, became dry and excessively hard. The Gibeonites pointed to this hardness of their bread as an evidence that they had come a long journey.<br><br>We read also of honey-cakes (<a href=\"#\" onClick=\"return mV('Exd',16,31);\">Exd 16:31</a>), \"cakes of figs\" (<a href=\"#\" onClick=\"return mV('1Sa',25,18);\">1Sa 25:18</a>), \"cake\" as denoting a whole piece of bread (<a href=\"#\" onClick=\"return mV('1Ki',17,12);\">1Ki 17:12</a>), and \"a [round] cake of barley bread\" (<a href=\"#\" onClick=\"return mV('Jdg',7,13);\">Jdg 7:13</a>). In <a href=\"#\" onClick=\"return mV('Lev',2,'1-');\">Lev 2</a> is a list of the different kinds of bread and cakes which were fit for offerings.";
eastonArray["$$T0000688"] = "<strong>Calah:</strong> one of the most ancient cities of Assyria. \"Out of that land he [i.e., Nimrod] went forth into Assyria, and built Nineveh, Rehoboth-Ir, and Calah, and Resen\" (<a href=\"#\" onClick=\"return mV('Gen',10,11);\">Gen 10:11</a>, R.V.). Its site is now marked probably by the Nimrud ruins on the left bank of the Tigris. These cover an area of about 1,000 acres, and are second only in size and importance to the mass of ruins opposite Mosul. This city was at one time the capital of the empire, and was the residence of Sardanapalus and his successors down to the time of Sargon, who built a new capital, the modern Khorsabad. It has been conjectured that these four cities mentioned in <a href=\"#\" onClick=\"return mV('Gen',10,11);\">Gen 10:11</a> were afterwards all united into one and called Nineveh (q.v.).";
eastonArray["$$T0000689"] = "<strong>Calamus:</strong> the Latin for cane, Hebrew <i>Kaneh</i>, mentioned (<a href=\"#\" onClick=\"return mV('Exd',30,23);\">Exd 30:23</a>) as one of the ingredients in the holy anointing oil, one of the sweet scents (<a href=\"#\" onClick=\"return mV('Sgs',4,14);\">Sgs 4:14</a>), and among the articles sold in the markets of Tyre (<a href=\"#\" onClick=\"return mV('Eze',27,19);\">Eze 27:19</a>). The word designates an Oriental plant called the \"sweet flag,\" the <i>Acorus calamus</i> of Linnaeus. It is elsewhere called \"sweet cane\" (<a href=\"#\" onClick=\"return mV('Isa',43,24);\">Isa 43:24</a>; <a href=\"#\" onClick=\"return mV('Jer',6,20);\">Jer 6:20</a>). It has an aromatic smell, and when its knotted stalk is cut and dried and reduced to powder, it forms an ingredient in the most precious perfumes. It was not a native of Palestine, but was imported from Arabia Felix or from India. It was probably that which is now known in India by the name of \"lemon grass\" or \"ginger grass,\" the <i>Andropogon schoenanthus</i>. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000710');\">CANE</a>.)";
eastonArray["$$T0000690"] = "<strong>Calcol:</strong> (<a href=\"#\" onClick=\"return mV('1Ch',2,6);\">1Ch 2:6</a>), sustenance, the same probably as Chalcol (<a href=\"#\" onClick=\"return mV('1Ki',4,31);\">1Ki 4:31</a>), one of the four sages whom Solomon excelled in wisdom; for \"he was wiser than all men.\"";
eastonArray["$$T0000691"] = "<strong>Caleb:</strong> a dog.<br><br>(1.) One of the three sons of Hezron of the tribe of Judah. He is also called Chelubai (<a href=\"#\" onClick=\"return mV('1Ch',2,9);\">1Ch 2:9</a>). His descendants are enumerated (<a href=\"#\" onClick=\"return mV('1Ch',2,'18-20','42-49');\">18-20, 42-49</a>).<br><br>(2.) A \"son of Hur, the firstborn of Ephratah\" (<a href=\"#\" onClick=\"return mV('1Ch',2,50);\">1Ch 2:50</a>). Some would read the whole passage thus: \"These [i.e., the list in ver. <a href=\"#\" onClick=\"return mV('1Ch',2,'42-49');\">42-49</a>] were the sons of Caleb. The sons of Hur, the firstborn of Ephratah, were Shobal, etc.\" Thus Hur would be the name of the son and not the father of Caleb (ver. <a href=\"#\" onClick=\"return mV('1Ch',2,19);\">19</a>).<br><br>(3.) The son of Jephunneh (<a href=\"#\" onClick=\"return mV('Num',13,6);\">Num 13:6</a>; <a href=\"#\" onClick=\"return mV('Num',32,12);\">32:12</a>; <a href=\"#\" onClick=\"return mV('Jos',14,6,14);\">Jos 14:6, 14</a>). He was one of those whom Moses sent to search the land in the second year after the Exodus. He was one of the family chiefs of the tribe of Judah. He and Joshua the son of Nun were the only two of the whole number who encouraged the people to go up and possess the land, and they alone were spared when a plague broke out in which the other ten spies perished (<a href=\"#\" onClick=\"return mV('Num',13,'1-')\">Num 13</a>; <a href=\"#\" onClick=\"return mV('Num',14,'1-')\">14</a>). All the people that had been numbered, from twenty years old and upward, perished in the wilderness except these two. The last notice we have of Caleb is when (being then eighty-five years of age) he came to Joshua at the camp at Gilgal, after the people had gained possession of the land, and reminded him of the promise Moses had made to him, by virtue of which he claimed a certain portion of the land of Kirjath-arba as his inheritance (<a href=\"#\" onClick=\"return mV('Jos',14,'6-15');\">Jos 14:6-15</a>; <a href=\"#\" onClick=\"return mV('Jos',15,'13-15');\">15:13-15</a>; <a href=\"#\" onClick=\"return mV('Jos',21,'10-12');\">21:10-12</a>; <a href=\"#\" onClick=\"return mV('1Sa',25,2,3);\">1Sa 25:2-3</a>; <a href=\"#\" onClick=\"return mV('1Sa',30,14);\">30:14</a>). He is called a \"Kenezite\" in <a href=\"#\" onClick=\"return mV('Jos',14,6,14);\">Jos 14:6,14</a>. This may simply mean \"son of Kenez\" (<a href=\"#\" onClick=\"return mV('Num',32,12);\">Num 32:12</a>). Some, however, read \"Jephunneh, the son of Kenez,\" who was a descendant of Hezron, the son of Pharez, a grandson of Judah (<a href=\"#\" onClick=\"return mV('1Ch',2,5);\">1Ch 2:5</a>). This Caleb may possibly be identical with (2).<br><br>(4.) Caleb gave his name apparently to a part of the south country (<a href=\"#\" onClick=\"return mV('1Sa',30,14);\">1Sa 30:14</a>) of Judah, the district between Hebron and Carmel, which had been assigned to him. When he gave up the city of Hebron to the priests as a city of refuge, he retained possession of the surrounding country (<a href=\"#\" onClick=\"return mV('Jos',21,11,12);\">Jos 21:11-12</a>; <a href=\"#\" onClick=\"return mV('1Sa',25,3);\">1Sa 25:3</a>).";
eastonArray["$$T0000692"] = "<strong>Calf:</strong> Calves were commonly made use of in sacrifices, and are therefore frequently mentioned in Scripture. The \"fatted calf\" was regarded as the choicest of animal food; it was frequently also offered as a special sacrifice (<a href=\"#\" onClick=\"return mV('1Sa',28,24);\">1Sa 28:24</a>; <a href=\"#\" onClick=\"return mV('Amo',6,4);\">Amo 6:4</a>; <a href=\"#\" onClick=\"return mV('Luk',15,23);\">Luk 15:23</a>). The words used in <a href=\"#\" onClick=\"return mV('Jer',34,18,19);\">Jer 34:18-19</a>, \"cut the calf in twain,\" allude to the custom of dividing a sacrifice into two parts, between which the parties ratifying a covenant passed (<a href=\"#\" onClick=\"return mV('Gen',15,9,10,17,18);\">Gen 15:9-10,17-18</a>). The sacrifice of the lips, i.e., priase, is called \"the calves of our lips\" (<a href=\"#\" onClick=\"return mV('Hsa',14,2);\">Hsa 14:2</a>, R.V., \"as bullocks the offering of our lips.\" Comp. <a href=\"#\" onClick=\"return mV('Hbr',13,15);\">Heb. 13:15</a>; <a href=\"#\" onClick=\"return mV('Psa',116,7);\">Psa 116:7</a>; <a href=\"#\" onClick=\"return mV('Jer',33,11);\">Jer 33:11</a>).<br><br>The golden calf which Aaron made (<a href=\"#\" onClick=\"return mV('Exd',32,4);\">Exd 32:4</a>) was probably a copy of the god Moloch rather than of the god Apis, the sacred ox or calf of Egypt. The Jews showed all through their history a tendency toward the Babylonian and Canaanitish idolatry rather than toward that of Egypt.<br><br>Ages after this, Jeroboam, king of Israel, set up two idol calves, one at Dan, and the other at Bethel, that he might thus prevent the ten tribes from resorting to Jerusalem for worship (<a href=\"#\" onClick=\"return mV('1Ki',12,28);\">1Ki 12:28</a>). These calves continued to be a snare to the people till the time of their captivity. The calf at Dan was carried away in the reign of Pekah by Tiglath-pileser, and that at Bethel ten years later, in the reign of Hoshea, by Shalmaneser (<a href=\"#\" onClick=\"return mV('2Ki',15,29);\">2Ki 15:29</a>; <a href=\"#\" onClick=\"return mV('2Ki',17,33);\">17:33</a>). This sin of Jeroboam is almost always mentioned along with his name (<a href=\"#\" onClick=\"return mV('2Ki',15,28);\">2Ki 15:28</a> etc.).";
eastonArray["$$T0000693"] = "<strong>Calkers:</strong> workmen skilled in stopping the seams of the deck or sides of vessels. The inhabitants of Gebel were employed in such work on Tyrian vessels (<a href=\"#\" onClick=\"return mV('Eze',27,9,27);\">Eze 27:9, 27</a>; marg., \"strengtheners\" or \"stoppers of chinks\").";
eastonArray["$$T0000694"] = "<strong>Call:</strong><br><br>(1.) To cry for help, hence to pray (<a href=\"#\" onClick=\"return mV('Gen',4,26);\">Gen 4:26</a>). Thus men are said to \"call upon the name of the Lord\" (<a href=\"#\" onClick=\"return mV('Act',2,21);\">Act 2:21</a>; <a href=\"#\" onClick=\"return mV('Act',7,59);\">7:59</a>; <a href=\"#\" onClick=\"return mV('Act',9,14);\">9:14</a>; <a href=\"#\" onClick=\"return mV('Rom',10,12);\">Rom 10:12</a>; <a href=\"#\" onClick=\"return mV('1Cr',1,2);\">1Cr 1:2</a>).<br><br>(2.) God calls with respect to men when he designates them to some special office (<a href=\"#\" onClick=\"return mV('Exd',31,2);\">Exd 31:2</a>; <a href=\"#\" onClick=\"return mV('Isa',22,20);\">Isa 22:20</a>; <a href=\"#\" onClick=\"return mV('Act',13,2);\">Act 13:2</a>), and when he invites them to accept his offered grace (<a href=\"#\" onClick=\"return mV('Mat',9,13);\">Mat 9:13</a>; <a href=\"#\" onClick=\"return mV('Mat',11,28);\">11:28</a>; <a href=\"#\" onClick=\"return mV('Mat',22,4);\">22:4</a>).<br><br>In the message of the gospel his call is addressed to all men, to Jews and Gentiles alike (<a href=\"#\" onClick=\"return mV('Mat',28,19);\">Mat 28:19</a>; <a href=\"#\" onClick=\"return mV('Mar',16,15);\">Mar 16:15</a>; <a href=\"#\" onClick=\"return mV('Rom',9,24,25);\">Rom 9:24-25</a>). But this universal call is not inseparably connected with salvation, although it leaves all to whom it comes inexcusable if they reject it (<a href=\"#\" onClick=\"return mV('Jhn',3,'14-19');\">Jhn 3:14-19</a>; <a href=\"#\" onClick=\"return mV('Mat',22,14);\">Mat 22:14</a>).<br><br>An effectual call is something more than the outward message of the Word of God to men. It is internal, and is the result of the enlightening and sanctifying influence of the Holy Spirit (<a href=\"#\" onClick=\"return mV('Jhn',16,14);\">Jhn 16:14</a>; <a href=\"#\" onClick=\"return mV('Act',26,18);\">Act 26:18</a>; <a href=\"#\" onClick=\"return mV('Jhn',6,44);\">Jhn 6:44</a>), effectually drawing men to Christ, and disposing and enabling them to receive the truth (<a href=\"#\" onClick=\"return mV('Jhn',6,45);\">Jhn 6:45</a>; <a href=\"#\" onClick=\"return mV('Act',16,14);\">Act 16:14</a>; <a href=\"#\" onClick=\"return mV('Eph',1,17);\">Eph 1:17</a>).";
eastonArray["$$T0000695"] = "<strong>Calling:</strong> a profession, or as we usually say, a vocation (<a href=\"#\" onClick=\"return mV('1Cr',7,20);\">1Cr 7:20</a>). The \"hope of your calling\" in <a href=\"#\" onClick=\"return mV('Eph',4,4);\">Eph 4:4</a> is the hope resulting from your being called into the kingdom of God.";
eastonArray["$$T0000696"] = "<strong>Calneh:</strong> fort, one of the four cities founded by Nimrod (<a href=\"#\" onClick=\"return mV('Gen',10,10);\">Gen 10:10</a>). It is the modern Niffer, a lofty mound of earth and rubbish situated in the marshes on the left, i.e., the east, bank of the Euphrates, but 30 miles distant from its present course, and about 60 miles south-south-east from Babylon. It is mentioned as one of the towns with which Tyre carried on trade. It was finally taken and probably destroyed by one of the Assyrian kings (<a href=\"#\" onClick=\"return mV('Amo',6,2);\">Amo 6:2</a>). It is called Calno (<a href=\"#\" onClick=\"return mV('Isa',10,9);\">Isa 10:9</a>) and Canneh (<a href=\"#\" onClick=\"return mV('Eze',27,23);\">Eze 27:23</a>).";
eastonArray["$$T0000697"] = "<strong>Calvary:</strong> only in <a href=\"#\" onClick=\"return mV('Luk',23,33);\">Luk 23:33</a>, the Latin name Calvaria, which was used as a translation of the Greek word <i>Kranion</i>, by which the Hebrew word <i>Gulgoleth</i> was interpreted, \"the place of a skull.\" It probably took this name from its shape, being a hillock or low, rounded, bare elevation somewhat in the form of a human skull. It is nowhere in Scripture called a \"hill.\" The crucifixion of our Lord took place outside the city walls (<a href=\"#\" onClick=\"return mV('Hbr',13,'11-13');\">Hbr 13:11-13</a>) and near the public thoroughfare. \"This thing was not done in a corner.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0001522');\">GOLGOTHA</a>.)";
eastonArray["$$T0000698"] = "<strong>Camel:</strong> from the Hebrew <i>gamal</i>, \"to repay\" or \"requite,\" as the camel does the care of its master. There are two distinct species of camels, having, however, the common characteristics of being \"ruminants without horns, without muzzle, with nostrils forming oblique slits, the upper lip divided and separately movable and extensile, the soles of the feet horny, with two toes covered by claws, the limbs long, the abdomen drawn up, while the neck, long and slender, is bent up and down, the reverse of that of a horse, which is arched.\"<br><br>(1.) The Bactrian camel is distinguished by two humps. It is a native of the high table-lands of Central Asia.<br><br>(2.) The Arabian camel or dromedary, from the Greek <i>dromos</i>, \"a runner\" (<a href=\"#\" onClick=\"return mV('Isa',60,6);\">Isa 60:6</a>; <a href=\"#\" onClick=\"return mV('Jer',2,23);\">Jer 2:23</a>), has but one hump, and is a native of Western Asia or Africa.<br><br>The camel was early used both for riding and as a beast of burden (<a href=\"#\" onClick=\"return mV('Gen',24,64);\">Gen 24:64</a>; <a href=\"#\" onClick=\"return mV('Gen',37,25);\">37:25</a>), and in war (<a href=\"#\" onClick=\"return mV('1Sa',30,17);\">1Sa 30:17</a>; <a href=\"#\" onClick=\"return mV('Isa',21,7);\">Isa 21:7</a>). Mention is made of the camel among the cattle given by Pharaoh to Abraham (<a href=\"#\" onClick=\"return mV('Gen',12,16);\">Gen 12:16</a>). Its flesh was not to be eaten, as it was ranked among unclean animals (<a href=\"#\" onClick=\"return mV('Lev',11,4);\">Lev 11:4</a>; <a href=\"#\" onClick=\"return mV('Deu',14,7);\">Deu 14:7</a>). Abraham's servant rode on a camel when he went to fetch a wife for Isaac (<a href=\"#\" onClick=\"return mV('Gen',24,10,11);\">Gen 24:10-11</a>). Jacob had camels as a portion of his wealth (<a href=\"#\" onClick=\"return mV('Gen',30,43);\">30:43</a>), as Abraham also had (<a href=\"#\" onClick=\"return mV('Gen',24,35);\">24:35</a>). He sent a present of thirty milch camels to his brother Esau (<a href=\"#\" onClick=\"return mV('Gen',32,15);\">32:15</a>). It appears to have been little in use among the Jews after the conquest. It is, however, mentioned in the history of David (<a href=\"#\" onClick=\"return mV('1Ch',27,30);\">1Ch 27:30</a>), and after the Exile (<a href=\"#\" onClick=\"return mV('Ezr',2,67);\">Ezr 2:67</a>; <a href=\"#\" onClick=\"return mV('Neh',7,69);\">Neh 7:69</a>). Camels were much in use among other nations in the East. The queen of Sheba came with a caravan of camels when she came to see the wisdom of Solomon (<a href=\"#\" onClick=\"return mV('1Ki',10,2);\">1Ki 10:2</a>; <a href=\"#\" onClick=\"return mV('2Ch',9,1);\">2Ch 9:1</a>). Benhadad of Damascus also sent a present to Elisha, \"forty camels' burden\" (<a href=\"#\" onClick=\"return mV('2Ki',8,9);\">2Ki 8:9</a>).<br><br>To show the difficulty in the way of a rich man's entering into the kingdom, our Lord uses the proverbial expression that it was easier for a camel to go through the eye of a needle (<a href=\"#\" onClick=\"return mV('Mat',19,24);\">Mat 19:24</a>).<br><br>To strain at (rather, out) a gnat and swallow a camel was also a proverbial expression (<a href=\"#\" onClick=\"return mV('Mat',23,24);\">Mat 23:24</a>), used with reference to those who were careful to avoid small faults, and yet did not hesitate to commit the greatest sins. The Jews carefully filtered their wine before drinking it, for fear of swallowing along with it some insect forbidden in the law as unclean, and yet they omitted openly the \"weightier matters\" of the law.<br><br>The raiment worn by John the Baptist was made of camel's hair (<a href=\"#\" onClick=\"return mV('Mat',3,4);\">Mat 3:4</a>; <a href=\"#\" onClick=\"return mV('Mar',1,6);\">Mar 1:6</a>), by which he was distinguished from those who resided in royal palaces and wore soft raiment. This was also the case with Elijah (<a href=\"#\" onClick=\"return mV('2Ki',1,8);\">2Ki 1:8</a>), who is called \"a hairy man,\" from his wearing such raiment. \"This is one of the most admirable materials for clothing; it keeps out the heat, cold, and rain.\" The \"sackcloth\" so often alluded to (<a href=\"#\" onClick=\"return mV('2Ki',1,8);\">2Ki 1:8</a>; <a href=\"#\" onClick=\"return mV('Isa',15,3);\">Isa 15:3</a>; <a href=\"#\" onClick=\"return mV('Zec',13,4);\">Zec 13:4</a>, etc.) was probably made of camel's hair.";
eastonArray["$$T0000699"] = "<strong>Camon:</strong> full of stalks, a place (<a href=\"#\" onClick=\"return mV('Jdg',10,5);\">Jdg 10:5</a>) where Jair was buried. It has usually been supposed to have been a city of Gilead, on the east of Jordan. It is probably, however, the modern Tell-el-Kaimun, on the southern slopes of Carmel, the Jokneam of Carmel (<a href=\"#\" onClick=\"return mV('Jos',12,22);\">Jos 12:22</a>; <a href=\"#\" onClick=\"return mV('1Ki',4,12);\">1Ki 4:12</a>), since it is not at all unlikely that after he became judge, Jair might find it more convenient to live on the west side of Jordan; and that he was buried where he had lived.";
</script>
