<script>
var eastonArray = new Array ();
eastonArray["$$T0001400"] = "<strong>Fury:</strong> as attributed to God, is a figurative expression for dispensing afflictive judgments (<a href=\"#\" onClick=\"return mV('Lev',26,28);\">Lev 26:28</a>; <a href=\"#\" onClick=\"return mV('Job',20,23);\">Job 20:23</a>; <a href=\"#\" onClick=\"return mV('Isa',63,3);\">Isa 63:3</a>; <a href=\"#\" onClick=\"return mV('Jer',4,4);\">Jer 4:4</a>; <a href=\"#\" onClick=\"return mV('Eze',5,13);\">Eze 5:13</a>; <a href=\"#\" onClick=\"return mV('Dan',9,16);\">Dan 9:16</a>; <a href=\"#\" onClick=\"return mV('Zec',8,2);\">Zec 8:2</a>).";
eastonArray["$$T0001401"] = "<strong>Gaal:</strong> loathing, the son of Ebed, in whom the Shechemites \"placed their confidence\" when they became discontented with Abimelech. He headed the revolution, and led out the men of Shechem against Abimelech; but was defeated, and fled to his own home (<a href=\"#\" onClick=\"return mV('Jdg',9,'26-46');\">Jdg 9:26-46</a>). We hear no more of him after this battle.";
eastonArray["$$T0001402"] = "<strong>Gaash:</strong> a shaking, a hill, on the north side of which Joshua was buried (<a href=\"#\" onClick=\"return mV('Jos',24,30);\">Jos 24:30</a>; <a href=\"#\" onClick=\"return mV('Jdg',2,9);\">Jdg 2:9</a>), in the territory of Ephraim. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003664');\">TIMNATH-SERAH</a>.)";
eastonArray["$$T0001403"] = "<strong>Gabbatha:</strong> Gab Baitha, i.e., \"the ridge of the house\" = \"the temple-mound,\" on a part of which the fortress of Antonia was built. This \"temple-mound\" was covered with a tesselated \"pavement\" (Gr. lithostroton, i.e., \"stone-paved\"). A judgement-seat (bema) was placed on this \"pavement\" outside the hall of the \"praetorium\" (q.v.), the judgment-hall (<a href=\"#\" onClick=\"return mV('Jhn',18,28);\">Jhn 18:28</a>; <a href=\"#\" onClick=\"return mV('Jhn',19,13);\">19:13</a>).";
eastonArray["$$T0001404"] = "<strong>Gabriel:</strong> champion of God, used as a proper name to designate the angel who was sent to Daniel (<a href=\"#\" onClick=\"return mV('Dan',8,16);\">Dan 8:16</a>) to explain the vision of the ram and the he-goat, and to communicate the prediction of the seventy weeks (<a href=\"#\" onClick=\"return mV('Dan',9,'21-27');\">Dan 9:21-27</a>).<br><br>He announced also the birth of John the Baptist (<a href=\"#\" onClick=\"return mV('Luk',1,11);\">Luk 1:11</a>), and of the Messiah (<a href=\"#\" onClick=\"return mV('Luk',1,26);\">26</a>). He describes himself in the words, \"I am Gabriel, who stand in the presence of God\" (<a href=\"#\" onClick=\"return mV('Luk',1,19);\">1:19</a>).";
eastonArray["$$T0001405"] = "<strong>Gad:</strong> fortune; luck.<br><br>(1.) Jacob's seventh son, by Zilpah, Leah's handmaid, and the brother of Asher (<a href=\"#\" onClick=\"return mV('Gen',30,'11-13');\">Gen 30:11-13</a>; <a href=\"#\" onClick=\"return mV('Gen',46,16,18);\">46:16, 18</a>). In the Authorized Version of <a href=\"#\" onClick=\"return mV('Gen',30,11);\">Gen 30:11</a> the words, \"A troop cometh: and she called,\" etc., should rather be rendered, \"In fortune [R.V., 'Fortunate']: and she called,\" etc., or \"Fortune cometh,\" etc.<br><br>The tribe of Gad during the march through the wilderness had their place with Simeon and Reuben on the south side of the tabernacle (<a href=\"#\" onClick=\"return mV('Num',2,14);\">Num 2:14</a>). The tribes of Reuben and Gad continued all through their history to follow the pastoral pursuits of the patriarchs (<a href=\"#\" onClick=\"return mV('Num',32,'1-5');\">Num 32:1-5</a>).<br><br>The portion allotted to the tribe of Gad was on the east of Jordan, and comprehended the half of Gilead, a region of great beauty and fertility (<a href=\"#\" onClick=\"return mV('Deu',3,12);\">Deu 3:12</a>), bounded on the east by the Arabian desert, on the west by the Jordan (<a href=\"#\" onClick=\"return mV('Jos',13,27);\">Jos 13:27</a>), and on the north by the river Jabbok. It thus included the whole of the Jordan valley as far north as to the Sea of Galilee, where it narrowed almost to a point.<br><br>This tribe was fierce and warlike; they were \"strong men of might, men of war for the battle, that could handle shield and buckler, their faces the faces of lions, and like roes upon the mountains for swiftness\" (<a href=\"#\" onClick=\"return mV('1Ch',12,8);\">1Ch 12:8</a>; <a href=\"#\" onClick=\"return mV('1Ch',5,'19-22');\">5:19-22</a>). Barzillai (<a href=\"#\" onClick=\"return mV('2Sa',17,27);\">2Sa 17:27</a>) and Elijah (<a href=\"#\" onClick=\"return mV('1Ki',17,1);\">1Ki 17:1</a>) were of this tribe. It was carried into captivity at the same time as the other tribes of the northern kingdom by Tiglath-pileser (<a href=\"#\" onClick=\"return mV('1Ch',5,26);\">1Ch 5:26</a>), and in the time of Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',49,1);\">Jer 49:1</a>) their cities were inhabited by the Ammonites.<br><br>(2.) A prophet who joined David in the \"hold,\" and at whose advice he quitted it for the forest of Hareth (<a href=\"#\" onClick=\"return mV('1Ch',29,29);\">1Ch 29:29</a>; <a href=\"#\" onClick=\"return mV('2Ch',29,25);\">2Ch 29:25</a>; <a href=\"#\" onClick=\"return mV('1Sa',22,5);\">1Sa 22:5</a>). Many years after we find mention made of him in connection with the punishment inflicted for numbering the people (<a href=\"#\" onClick=\"return mV('2Sa',24,'11-19');\">2Sa 24:11-19</a>; <a href=\"#\" onClick=\"return mV('1Ch',21,'9-19');\">1Ch 21:9-19</a>). He wrote a book called the \"Acts of David\" (<a href=\"#\" onClick=\"return mV('1Ch',29,29);\">1Ch 29:29</a>), and assisted in the arrangements for the musical services of the \"house of God\" (<a href=\"#\" onClick=\"return mV('2Ch',29,25);\">2Ch 29:25</a>). He bore the title of \"the king's seer\" (<a href=\"#\" onClick=\"return mV('2Sa',24,11,13);\">2Sa 24:11, 13</a>; <a href=\"#\" onClick=\"return mV('1Ch',21,9);\">1Ch 21:9</a>).";
eastonArray["$$T0001406"] = "<strong>Gadara:</strong> the capital of the Roman province of Peraea. It stood on the summit of a mountain about 6 miles south-east of the Sea of Galilee. Mark (<a href=\"#\" onClick=\"return mV('Mar',5,1);\">Mar 5:1</a>) and Luke (<a href=\"#\" onClick=\"return mV('Luk',8,'26-39');\">Luk 8:26-39</a>) describe the miracle of the healing of the demoniac (<a href=\"#\" onClick=\"return mV('Luk',8,'28-34');\">8:28-34</a> says two demoniacs) as having been wrought \"in the country of the Gadarenes,\" thus describing the scene generally. The miracle could not have been wrought at Gadara itself, for between the lake and this town there is the deep, almost impassable ravine of the Hieromax (Jarmuk). It is identified with the modern village of Um-Keis, which is surrounded by very extensive ruins, all bearing testimony to the splendour of ancient Gadara.<br><br>\"The most interesting remains of Gadara are its tombs, which dot the cliffs for a considerable distance round the city, chiefly on the north-east declivity; but many beautifully sculptured sarcophagi are scattered over the surrounding heights. They are excavated in the limestone rock, and consist of chambers of various dimensions, some more than 20 feet square, with recesses in the sides for bodies...The present inhabitants of Um-Keis are all troglodytes, 'dwelling in tombs,' like the poor maniacs of old, and occasionally they are almost as dangerous to unprotected travellers.\"";
eastonArray["$$T0001407"] = "<strong>Gadarenes:</strong> the inhabitants of Gadara, in Revised Version \"Gerasenes\" (<a href=\"#\" onClick=\"return mV('Mar',5,1);\">Mar 5:1</a>; <a href=\"#\" onClick=\"return mV('Luk',8,26,37);\">Luk 8:26, 37</a>). In <a href=\"#\" onClick=\"return mV('Mat',8,28);\">Mat 8:28</a> they are called Gergesenes, Revised Version \"Gadarenes.\"";
eastonArray["$$T0001408"] = "<strong>Gaddi:</strong> fortunate, the representative of the tribe of Manasseh among the twelve \"spies\" sent by Moses to spy the land (<a href=\"#\" onClick=\"return mV('Num',13,11);\">Num 13:11</a>).";
eastonArray["$$T0001409"] = "<strong>Gaddiel:</strong> fortune (i.e., sent) of God, the representative of the tribe of Zebulum among the twelve spies (<a href=\"#\" onClick=\"return mV('Num',13,10);\">Num 13:10</a>).";
eastonArray["$$T0001410"] = "<strong>Gahar:</strong> lurking-place, one of the chief of the Nethinim, whose descendants returned to Jerusalem under Zerubbabel (<a href=\"#\" onClick=\"return mV('Ezr',2,47);\">Ezr 2:47</a>).";
eastonArray["$$T0001411"] = "<strong>Gaius:</strong><br><br>(1.) A Macedonian, Paul's fellow-traveller, and his host at Corinth when he wrote his Epistle to the Romans (<a href=\"#\" onClick=\"return mV('Rom',16,23);\">Rom 16:23</a>). He with his household were baptized by Paul (<a href=\"#\" onClick=\"return mV('1Cr',1,14);\">1Cr 1:14</a>). During a heathen outbreak against Paul at Ephesus the mob seized Gaius and Aristarchus because they could not find Paul, and rushed with them into the theatre. Some have identified this Gaius with No. (2).<br><br>(2.) A man of Derbe who accompanied Paul into Asia on his last journey to Jerusalem<br><br>(3.) A Christain of Asia Minor to whom John addressed his third epistle (<a href=\"#\" onClick=\"return mV('3Jo',1,1);\">3Jo 1:1</a>).";
eastonArray["$$T0001412"] = "<strong>Galatia:</strong> has been called the \"Gallia\" of the East, Roman writers calling its inhabitants Galli. They were an intermixture of Gauls and Greeks, and hence were called Gallo-Graeci, and the country Gallo-Graecia. The Galatians were in their origin a part of that great Celtic migration which invaded Macedonia about B.C. 280. They were invited by the king of Bithynia to cross over into Asia Minor to assist him in his wars. There they ultimately settled, and being strengthened by fresh accessions of the same clan from Europe, they overran Bithynia, and supported themselves by plundering neighbouring countries. They were great warriors, and hired themselves out as mercenary soldiers, sometimes fighting on both sides in the great battles of the times. They were at length brought under the power of Rome in B.C. 189, and Galatia became a Roman province B.C. 25.<br><br>This province of Galatia, within the limits of which these Celtic tribes were confined, was the central region of Asia Minor.<br><br>During his second missionary journey Paul, accompanied by Silas and Timothy (<a href=\"#\" onClick=\"return mV('Act',16,6);\">Act 16:6</a>), visited the \"region of Galatia,\" where he was detained by sickness (<a href=\"#\" onClick=\"return mV('Gal',4,13);\">Gal 4:13</a>), and had thus the longer opportunity of preaching to them the gospel. On his third journey he went over \"all the country of Galatia and Phrygia in order\" (<a href=\"#\" onClick=\"return mV('Act',18,23);\">Act 18:23</a>). Crescens was sent thither by Paul toward the close of his life (<a href=\"#\" onClick=\"return mV('2Ti',4,10);\">2Ti 4:10</a>).";
eastonArray["$$T0001413"] = "<strong>Galatians, Epistle to:</strong> The genuineness of this epistle is not called in question. Its Pauline origin is universally acknowledged.<br><br>Occasion of.<br><br>The churches of Galatia were founded by Paul himself (<a href=\"#\" onClick=\"return mV('Act',16,6);\">Act 16:6</a>; <a href=\"#\" onClick=\"return mV('Gal',1,8);\">Gal 1:8</a>; <a href=\"#\" onClick=\"return mV('Gal',4,13,19);\">4:13, 19</a>). They seem to have been composed mainly of converts from heathenism (<a href=\"#\" onClick=\"return mV('Gal',4,8);\">Gal 4:8</a>), but partly also of Jewish converts, who probably, under the influence of Judaizing teachers, sought to incorporate the rites of Judaism with Christianity, and by their active zeal had succeeded in inducing the majority of the churches to adopt their views (<a href=\"#\" onClick=\"return mV('Gal',1,6);\">Gal 1:6</a>; <a href=\"#\" onClick=\"return mV('Gal',3,1);\">3:1</a>). This epistle was written for the purpose of counteracting this Judaizing tendency, and of recalling the Galatians to the simplicity of the gospel, and at the same time also of vindicating Paul's claim to be a divinely-commissioned apostle.<br><br>Time and place of writing.<br><br>The epistle was probably written very soon after Paul's second visit to Galatia (<a href=\"#\" onClick=\"return mV('Act',18,23);\">Act 18:23</a>). The references of the epistle appear to agree with this conclusion. The visit to Jerusalem, mentioned in <a href=\"#\" onClick=\"return mV('Gal',2,'1-10');\">Gal 2:1-10</a>, was identical with that of <a href=\"#\" onClick=\"return mV('Act',15,'1-');\">Acts 15</a>, and it is spoken of as a thing of the past, and consequently the epistle was written subsequently to the council of Jerusalem. The similarity between this epistle and that to the Romans has led to the conclusion that they were both written at the same time, namely, in the winter of A.D. 57-8, during Paul's stay in Corinth (<a href=\"#\" onClick=\"return mV('Act',20,2,3);\">Act 20:2-3</a>). This to the Galatians is written on the urgency of the occasion, tidings having reached him of the state of matters; and that to the Romans in a more deliberate and systematic way, in exposition of the same great doctrines of the gospel.<br><br>Contents of.<br><br>The great question discussed is, Was the Jewish law binding on Christians? The epistle is designed to prove against the Jews that men are justified by faith without the works of the law of Moses. After an introductory address (<a href=\"#\" onClick=\"return mV('Gal',1,'1-10');\">Gal 1:1-10</a>) the apostle discusses the subjects which had occasioned the epistle.<br><br>(1) He defends his apostolic authority (<a href=\"#\" onClick=\"return mV('Gal',1,'11-19');\">Gal 1:11-19</a>; <a href=\"#\" onClick=\"return mV('Gal',2,'1-14');\">2:1-14</a>);<br><br>(2) shows the evil influence of the Judaizers in destroying the very essence of the gospel (<a href=\"#\" onClick=\"return mV('Gal',3,'1-');\">3</a> and <a href=\"#\" onClick=\"return mV('Gal',3,'1-');\">4</a>);<br><br>(3) exhorts the Galatian believers to stand fast in the faith as it is in Jesus, and to abound in the fruits of the Spirit, and in a right use of their Christian freedom (<a href=\"#\" onClick=\"return mV('Gal',5,'1-')\">Gal 5</a>-<a href=\"#\" onClick=\"return mV('Gal',6,'1-10')\">6:1-10</a>);<br><br>(4) and then concludes with a summary of the topics discussed, and with the benediction.<br><br>The Epistle to the Galatians and that to the Romans taken together \"form a complete proof that justification is not to be obtained meritoriously either by works of morality or by rites and ceremonies, though of divine appointment; but that it is a free gift, proceeding entirely from the mercy of God, to those who receive it by faith in Jesus our Lord.\"<br><br>In the conclusion of the epistle (<a href=\"#\" onClick=\"return mV('Gal',6,11);\">Gal 6:11</a>) Paul says, \"Ye see how large a letter I have written with mine own hand.\" It is implied that this was different from his ordinary usage, which was simply to write the concluding salutation with his own hand, indicating that the rest of the epistle was written by another hand. Regarding this conclusion, Lightfoot, in his Commentary on the epistle, says: \"At this point the apostle takes the pen from his amanuensis, and the concluding paragraph is written with his own hand. From the time when letters began to be forged in his name (<a href=\"#\" onClick=\"return mV('2Th',2,2);\">2Th 2:2</a>; <a href=\"#\" onClick=\"return mV('2Th',3,17);\">3:17</a>) it seems to have been his practice to close with a few words in his own handwriting, as a precaution against such forgeries...In the present case he writes a whole paragraph, summing up the main lessons of the epistle in terse, eager, disjointed sentences. He writes it, too, in large, bold characters (Gr. pelikois grammasin), that his hand-writing may reflect the energy and determination of his soul.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0002147');\">JUSTIFICATION</a>.)";
eastonArray["$$T0001414"] = "<strong>Galbanum:</strong> Heb. helbenah, (<a href=\"#\" onClick=\"return mV('Exd',30,34);\">Exd 30:34</a>), one of the ingredients in the holy incense. It is a gum, probably from the <i>Galbanum officinale</i>.";
eastonArray["$$T0001415"] = "<strong>Galeed:</strong> heap of witness, the name of the pile of stones erected by Jacob and Laban to mark the league of friendship into which they entered with each other (<a href=\"#\" onClick=\"return mV('Gen',31,47,48);\">Gen 31:47-48</a>). This was the name given to the \"heap\" by Jacob. It is Hebrew, while the name Jegar-sahadutha, given to it by Laban, is Aramaic (Chaldee or Syriac). Probably Nahor's family originally spoke Aramaic, and Abraham and his descendants learned Hebrew, a kindred dialect, in the land of Canaan.";
eastonArray["$$T0001416"] = "<strong>Galilean:</strong> an inhabitant or native of Galilee. This word was used as a name of contempt as applied to our Lord's disciples (<a href=\"#\" onClick=\"return mV('Luk',22,59);\">Luk 22:59</a>; <a href=\"#\" onClick=\"return mV('Act',2,7);\">Act 2:7</a>). All the apostles, with the exception of Judas Iscariot (<a href=\"#\" onClick=\"return mV('Act',1,11);\">Act 1:11</a>), were Galileans. Peter was detected by his Galilean accent (<a href=\"#\" onClick=\"return mV('Mat',26,69);\">Mat 26:69</a>; <a href=\"#\" onClick=\"return mV('Mar',14,70);\">Mar 14:70</a>).<br><br>This was also one of the names of reproach given to the early Christians. Julian the Apostate, as he is called, not only used the epithet himself when referring to Christ and his apostles, but he made it a law that no one should ever call the Christians by any other name.";
eastonArray["$$T0001417"] = "<strong>Galilee:</strong> circuit. Solomon rewarded Hiram for certain services rendered him by the gift of an upland plain among the mountains of Naphtali. Hiram was dissatisfied with the gift, and called it \"the land of Cabul\" (q.v.). The Jews called it Galil. It continued long to be occupied by the original inhabitants, and hence came to be called \"Galilee of the Gentiles\" (<a href=\"#\" onClick=\"return mV('Mat',4,15);\">Mat 4:15</a>), and also \"Upper Galilee,\" to distinguish it from the extensive addition afterwards made to it toward the south, which was usually called \"Lower Galilee.\" In the time of our Lord, Galilee embraced more than one-third of Western Palestine, extending \"from Dan on the north, at the base of Mount Hermon, to the ridges of Carmel and Gilboa on the south, and from the Jordan valley on the east away across the splendid plains of Jezreel and Acre to the shores of the Mediterranean on the west.\" Palestine was divided into three provinces, Judea, Samaria, and Galilee, which comprehended the whole northern section of the country (<a href=\"#\" onClick=\"return mV('Act',9,31);\">Act 9:31</a>), and was the largest of the three.<br><br>It was the scene of some of the most memorable events of Jewish history. Galilee also was the home of our Lord during at least thirty years of his life. The first three Gospels are chiefly taken up with our Lord's public ministry in this province. \"The entire province is encircled with a halo of holy associations connected with the life, works, and teachings of Jesus of Nazareth.\" \"It is noteworthy that of his thirty-two beautiful parables, no less than ninteen were spoken in Galilee. And it is no less remarkable that of his entire thirty-three great miracles, twenty-five were wrought in this province. His first miracle was wrought at the wedding in Cana of Galilee, and his last, after his resurrection, on the shore of Galilee's sea. In Galilee our Lord delivered the Sermon on The Mount, and the discourses on 'The Bread of Life,' on 'Purity,' on 'Forgiveness,' and on 'Humility.' In Galilee he called his first disciples; and there occurred the sublime scene of the Transfiguration\" (Porter's Through Samaria).<br><br>When the Sanhedrin were about to proceed with some plan for the condemnation of our Lord (<a href=\"#\" onClick=\"return mV('Jhn',7,'45-52');\">Jhn 7:45-52</a>), Nicodemus interposed in his behalf. (<a href=\"#\" onClick=\"return mV('Deu',1,16,17);\">Deu 1:16-17</a>; <a href=\"#\" onClick=\"return mV('Deu',17,8);\">17:8</a>.) They replied, \"Art thou also of Galilee?.... Out of Galilee ariseth no prophet.\" This saying of theirs was \"not historically true, for two prophets at least had arisen from Galilee, Jonah of Gath-hepher, and the greatest of all the prophets, Elijah of Thisbe, and perhaps also Nahum and Hosea. Their contempt for Galilee made them lose sight of historical accuracy\" (Alford, Com.).<br><br>The Galilean accent differed from that of Jerusalem in being broader and more guttural (<a href=\"#\" onClick=\"return mV('Mar',14,70);\">Mar 14:70</a>).";
eastonArray["$$T0001418"] = "<strong>Galilee, Sea of:</strong> (<a href=\"#\" onClick=\"return mV('Mat',4,18);\">Mat 4:18</a>; <a href=\"#\" onClick=\"return mV('Mat',15,29);\">15:29</a>), is mentioned in the Bible under three other names.<br><br>(1.) In the Old Testament it is called the \"sea of Chinnereth\" (<a href=\"#\" onClick=\"return mV('Num',34,11);\">Num 34:11</a>; <a href=\"#\" onClick=\"return mV('Jos',12,3);\">Jos 12:3</a>; <a href=\"#\" onClick=\"return mV('Jos',13,27);\">13:27</a>), as is supposed from its harp-like shape.<br><br>(2). The \"lake of Gennesareth\" once by Luke (<a href=\"#\" onClick=\"return mV('Luk',5,1);\">Luk 5:1</a>), from the flat district lying on its west coast.<br><br>(3.) John (<a href=\"#\" onClick=\"return mV('Jhn',6,1);\">Jhn 6:1</a>; <a href=\"#\" onClick=\"return mV('Jhn',21,1);\">21:1</a>) calls it the \"sea of Tiberias\" (q.v.). The modern Arabs retain this name, Bahr Tabariyeh.<br><br>This lake is 12 1/2 miles long, and from 4 to 7 1/2 broad. Its surface is 682 feet below the level of the Mediterranean. Its depth is from 80 to 160 feet. The Jordan enters it 10 1/2 miles below the southern extremity of the Huleh Lake, or about 26 1/2 miles from its source. In this distance of 26 1/2 miles there is a fall in the river of 1,682 feet, or of more than 60 feet to the mile. It is 27 miles east of the Mediterranean, and about 60 miles north-east of Jerusalem. It is of an oval shape, and abounds in fish.<br><br>Its present appearance is thus described: \"The utter loneliness and absolute stillness of the scene are exceedingly impressive. It seems as if all nature had gone to rest, languishing under the scorching heat. How different it was in the days of our Lord! Then all was life and bustle along the shores; the cities and villages that thickly studded them resounded with the hum of a busy population; while from hill-side and corn-field came the cheerful cry of shepherd and ploughman. The lake, too, was dotted with dark fishing-boats and spangled with white sails. Now a mournful, solitary silence reigns over sea and shore. The cities are in ruins!\"<br><br>This sea is chiefly of interest as associated with the public ministry of our Lord. Capernaum, \"his own city\" (<a href=\"#\" onClick=\"return mV('Mat',9,1);\">Mat 9:1</a>), stood on its shores. From among the fishermen who plied their calling on its waters he chose Peter and his brother Andrew, and James and John, to be disciples, and sent them forth to be \"fishers of men\" (<a href=\"#\" onClick=\"return mV('Mat',4,18,22);\">Mat 4:18, 22</a>; <a href=\"#\" onClick=\"return mV('Mar',1,'16-20');\">Mar 1:16-20</a>; <a href=\"#\" onClick=\"return mV('Luk',5,'1-11');\">Luk 5:1-11</a>). He stilled its tempest, saying to the storm that swept over it, \"Peace, be still\" (<a href=\"#\" onClick=\"return mV('Mat',8,'23-27');\">Mat 8:23-27</a>; <a href=\"#\" onClick=\"return mV('Mar',7,'31-35');\">Mar 7:31-35</a>); and here also he showed himself after his resurrection to his disciples (<a href=\"#\" onClick=\"return mV('Jhn',21,1)\">Jhn 21:1</a>).<br><br>\"The Sea of Galilee is indeed the cradle of the gospel. The subterranean fires of nature prepared a lake basin, through which a river afterwards ran, keeping its waters always fresh. In this basin a vast quantity of shell-fish swarmed, and multiplied to such an extent that they formed the food of an extraordinary profusion of fish. The great variety and abundance of the fish in the lake attracted to its shores a larger and more varied population than existed elsewhere in Palestine, whereby this secluded district was brought into contact with all parts of the world. And this large and varied population, with access to all nations and countries, attracted the Lord Jesus, and induced him to make this spot the centre of his public ministry.\"";
eastonArray["$$T0001419"] = "<strong>Gall:</strong><br><br>(1.) Heb. mererah, meaning \"bitterness\" (<a href=\"#\" onClick=\"return mV('Job',16,13);\">Job 16:13</a>); i.e., the bile secreted in the liver. This word is also used of the poison of asps (<a href=\"#\" onClick=\"return mV('Job',20,14);\">20:14</a>), and of the vitals, the seat of life (<a href=\"#\" onClick=\"return mV('Job',20,25);\">25</a>).<br><br>(2.) Heb. rosh. In <a href=\"#\" onClick=\"return mV('Deu',32,33);\">Deu 32:33</a> and <a href=\"#\" onClick=\"return mV('Job',20,16);\">Job 20:16</a> it denotes the poison of serpents. In <a href=\"#\" onClick=\"return mV('Hsa',10,4);\">Hsa 10:4</a> the Hebrew word is rendered \"hemlock.\" The original probably denotes some bitter, poisonous plant, most probably the poppy, which grows up quickly, and is therefore coupled with wormwood (<a href=\"#\" onClick=\"return mV('Deu',29,18);\">Deu 29:18</a>; <a href=\"#\" onClick=\"return mV('Jer',9,15);\">Jer 9:15</a>; <a href=\"#\" onClick=\"return mV('Lam',3,19);\">Lam 3:19</a>). Comp. <a href=\"#\" onClick=\"return mV('Jer',8,14);\">Jer 8:14</a>; <a href=\"#\" onClick=\"return mV('Jer',23,15);\">23:15</a>, \"water of gall,\" Gesenius, \"poppy juice;\" others, \"water of hemlock,\" \"bitter water.\"<br><br>(3.) Gr. chole (<a href=\"#\" onClick=\"return mV('Mat',27,34);\">Mat 27:34</a>), the LXX. translation of the Hebrew <i>rosh</i> in <a href=\"#\" onClick=\"return mV('Psa',69,21);\">Psa 69:21</a>, which foretells our Lord's sufferings. The drink offered to our Lord was vinegar (made of light wine rendered acid, the common drink of Roman soldiers) \"mingled with gall,\" or, according to Mark (<a href=\"#\" onClick=\"return mV('Mar',15,23);\">Mar 15:23</a>), \"mingled with myrrh;\" both expressions meaning the same thing, namely, that the vinegar was made bitter by the infusion of wormwood or some other bitter substance, usually given, according to a merciful custom, as an anodyne to those who were crucified, to render them insensible to pain. Our Lord, knowing this, refuses to drink it. He would take nothing to cloud his faculties or blunt the pain of dying. He chooses to suffer every element of woe in the bitter cup of agony given him by the Father (<a href=\"#\" onClick=\"return mV('Jhn',18,11);\">Jhn 18:11</a>).";
eastonArray["$$T0001420"] = "<strong>Gallery:</strong><br><br>(1.) Heb. 'attik (<a href=\"#\" onClick=\"return mV('Eze',41,15,16);\">Eze 41:15-16</a>), a terrace; a projection; ledge.<br><br>(2.) Heb. rahit (<a href=\"#\" onClick=\"return mV('Sgs',1,17);\">Sgs 1:17</a>), translated \"rafters,\" marg. \"galleries;\" probably panel-work or fretted ceiling.";
eastonArray["$$T0001421"] = "<strong>Gallim:</strong> heaps, (<a href=\"#\" onClick=\"return mV('1Sa',25,44);\">1Sa 25:44</a>; <a href=\"#\" onClick=\"return mV('Isa',10,30);\">Isa 10:30</a>). The native place of Phalti, to whom Michal was given by Saul. It was probably in Benjamin, to the north of Jerusalem.";
eastonArray["$$T0001422"] = "<strong>Gallio:</strong> the elder brother of Seneca the philosopher, who was tutor and for some time minister of the emperor Nero. He was \"deputy\", i.e., proconsul, as in Revised Version, of Achaia, under the emperor Claudius, when Paul visited Corinth (<a href=\"#\" onClick=\"return mV('Act',18,12);\">Act 18:12</a>). The word used here by Luke in describing the rank of Gallio shows his accuracy. Achaia was a senatorial province under Claudius, and the governor of such a province was called a \"proconsul.\" He is spoken of by his contemporaries as \"sweet Gallio,\" and is described as a most popular and affectionate man. When the Jews brought Paul before his tribunal on the charge of persuading \"men to worship God contrary to the law\" (<a href=\"#\" onClick=\"return mV('Act',18,13);\">18:13</a>), he refused to listen to them, and \"drave them from the judgment seat\" (<a href=\"#\" onClick=\"return mV('Act',18,16);\">18:16</a>).";
eastonArray["$$T0001423"] = "<strong>Gallows:</strong> Heb. 'ets, meaning \"a tree\" (<a href=\"#\" onClick=\"return mV('Est',6,4);\">Est 6:4</a>), a post or gibbet. In <a href=\"#\" onClick=\"return mV('Gen',40,19);\">Gen 40:19</a> and <a href=\"#\" onClick=\"return mV('Deu',21,22);\">Deu 21:22</a> the word is rendered \"tree.\"";
eastonArray["$$T0001424"] = "<strong>Gamaliel:</strong> reward of God.<br><br>(1.) A chief of the tribe of Manasseh at the census at Sinai (<a href=\"#\" onClick=\"return mV('Num',1,10);\">Num 1:10</a>; <a href=\"#\" onClick=\"return mV('Num',2,20);\">2:20</a>; <a href=\"#\" onClick=\"return mV('Num',7,54,59);\">7:54, 59</a>).<br><br>(2.) The son of rabbi Simeon, and grandson of the famous rabbi Hillel. He was a Pharisse, and therefore the opponent of the party of the Sadducees. He was noted for his learning, and was president of the Sanhedrim during the regins of Tiberius, Caligula, and Claudius, and died, it is said, about eighteen years before the destruction of Jerusalem.<br><br>When the apostles were brought before the council, charged with preaching the resurrection of Jesus, as a zealous Pharisee Gamaliel councelled moderation and calmness. By a reference to well-known events, he advised them to \"refrain from these men.\" If their work or counsel was of man, it would come to nothing; but if it was of God, they could not destroy it, and therefore ought to be on their guard lest they should be \"found fighting against God\" (<a href=\"#\" onClick=\"return mV('Act',5,'34-40');\">Act 5:34-40</a>). Paul was one of his disciples (<a href=\"#\" onClick=\"return mV('Act',22,3);\">22:3</a>).";
eastonArray["$$T0001425"] = "<strong>Games:</strong><br><br>(1.) Of children (<a href=\"#\" onClick=\"return mV('Zec',8,5);\">Zec 8:5</a>; <a href=\"#\" onClick=\"return mV('Mat',11,16);\">Mat 11:16</a>). The Jewish youth were also apparently instructed in the use of the bow and the sling (<a href=\"#\" onClick=\"return mV('Jdg',20,16);\">Jdg 20:16</a>; <a href=\"#\" onClick=\"return mV('1Ch',12,2);\">1Ch 12:2</a>).<br><br>(2.) Public games, such as were common among the Greeks and Romans, were foreign to the Jewish institutions and customs. Reference, however, is made to such games in two passages (<a href=\"#\" onClick=\"return mV('Psa',19,5);\">Psa 19:5</a>; <a href=\"#\" onClick=\"return mV('Ecc',9,11);\">Ecc 9:11</a>).<br><br>(3.) Among the Greeks and Romans games entered largely into their social life.<br><br>(a) Reference in the New Testament is made to gladiatorial shows and fights with wild beasts (<a href=\"#\" onClick=\"return mV('1Cr',15,32);\">1Cr 15:32</a>). These were common among the Romans, and sometimes on a large scale.<br><br>(b) Allusion is frequently made to the Grecian gymnastic contests (<a href=\"#\" onClick=\"return mV('Gal',2,2);\">Gal 2:2</a>; <a href=\"#\" onClick=\"return mV('Gal',5,7);\">5:7</a>; <a href=\"#\" onClick=\"return mV('Phl',2,16);\">Phl 2:16</a>; <a href=\"#\" onClick=\"return mV('Phl',3,14);\">3:14</a>; <a href=\"#\" onClick=\"return mV('1Ti',6,12);\">1Ti 6:12</a>; <a href=\"#\" onClick=\"return mV('2Ti',2,5);\">2Ti 2:5</a>; <a href=\"#\" onClick=\"return mV('Hbr',12,1,4,12);\">Hbr 12:1, 4, 12</a>). These were very numerous. The Olympic, Pythian, Nemean, and Isthmian games were esteemed as of great national importance, and the victors at any of these games of wrestling, racing, etc., were esteemed as the noblest and the happiest of mortals.";
eastonArray["$$T0001426"] = "<strong>Gammadim:</strong> (<a href=\"#\" onClick=\"return mV('Eze',27,11);\">Eze 27:11</a>) brave warriors; R.V. marg., \"valorous men;\" others interpret this word as meaning \"short-swordsmen,\" or \"daring ones\", the name of a class of men who were defenders of the towers of Tyre.";
eastonArray["$$T0001427"] = "<strong>Gamul:</strong> named the leader of one of the priestly courses (<a href=\"#\" onClick=\"return mV('1Ch',24,17);\">1Ch 24:17</a>).";
eastonArray["$$T0001428"] = "<strong>Gap:</strong> a rent or opening in a wall (<a href=\"#\" onClick=\"return mV('Eze',13,5);\">Eze 13:5</a>; <a href=\"#\" onClick=\"return mV('Amo',4,3);\">Amo 4:3</a>). The false prophets did not stand in the gap (<a href=\"#\" onClick=\"return mV('Eze',22,30);\">Eze 22:30</a>), i.e., they did nothing to stop the outbreak of wickedness.";
eastonArray["$$T0001429"] = "<strong>Gardens:</strong> mentioned in Scripture, of Eden (<a href=\"#\" onClick=\"return mV('Gen',2,8,9);\">Gen 2:8-9</a>); Ahab's garden of herbs (<a href=\"#\" onClick=\"return mV('1Ki',21,2);\">1Ki 21:2</a>); the royal garden (<a href=\"#\" onClick=\"return mV('2Ki',21,18);\">2Ki 21:18</a>); the royal garden at Susa (<a href=\"#\" onClick=\"return mV('Est',1,5);\">Est 1:5</a>); the garden of Joseph of Arimathea (<a href=\"#\" onClick=\"return mV('Jhn',19,41);\">Jhn 19:41</a>); of Gethsemane (<a href=\"#\" onClick=\"return mV('Jhn',18,1);\">Jhn 18:1</a>).<br><br>The \"king's garden\" mentioned <a href=\"#\" onClick=\"return mV('2Ki',25,4);\">2Ki 25:4</a>; <a href=\"#\" onClick=\"return mV('Neh',3,15);\">Neh 3:15</a>, was near the Pool of Siloam.<br><br>Gardens were surrounded by hedges of thorns (<a href=\"#\" onClick=\"return mV('Isa',5,5);\">Isa 5:5</a>) or by walls of stone (<a href=\"#\" onClick=\"return mV('Pro',24,31);\">Pro 24:31</a>). \"Watch-towers\" or \"lodges\" were also built in them (<a href=\"#\" onClick=\"return mV('Isa',1,8);\">Isa 1:8</a>; <a href=\"#\" onClick=\"return mV('Mar',12,1);\">Mar 12:1</a>), in which their keepers sat. On account of their retirement they were frequently used as places for secret prayer and communion with God (<a href=\"#\" onClick=\"return mV('Gen',24,63);\">Gen 24:63</a>; <a href=\"#\" onClick=\"return mV('Mat',26,'30-36');\">Mat 26:30-36</a>; <a href=\"#\" onClick=\"return mV('Jhn',1,48);\">Jhn 1:48</a>; <a href=\"#\" onClick=\"return mV('Jhn',18,1,2);\">18:1-2</a>). The dead were sometimes buried in gardens (<a href=\"#\" onClick=\"return mV('Gen',23,19,20);\">Gen 23:19-20</a>; <a href=\"#\" onClick=\"return mV('2Ki',21,18,26);\">2Ki 21:18, 26</a>; <a href=\"#\" onClick=\"return mV('1Sa',25,1);\">1Sa 25:1</a>; <a href=\"#\" onClick=\"return mV('Mar',15,46);\">Mar 15:46</a>; <a href=\"#\" onClick=\"return mV('Jhn',19,41);\">Jhn 19:41</a>). (See  <a href=\"#\" onClick=\"return doDictLookup('ET0002843');\">PARADISE</a>.)";
eastonArray["$$T0001430"] = "<strong>Gareb:</strong> scabby; itch.<br><br>(1.) One of David's warriors (<a href=\"#\" onClick=\"return mV('2Sa',23,38);\">2Sa 23:38</a>), an Ithrite.<br><br>(2.) A hill near Jerusalem (<a href=\"#\" onClick=\"return mV('Jer',31,39);\">Jer 31:39</a>), probably the hill of lepers, and consequently a place outside the boundary of the city.";
eastonArray["$$T0001431"] = "<strong>Garlands:</strong> (<a href=\"#\" onClick=\"return mV('Act',14,13);\">Act 14:13</a>). In heathen sacrifices the victims were adorned with fillets and garlands made of wool, with leaves and flowers interwoven. The altar and the priests and attendants were also in like manner adorned.";
eastonArray["$$T0001432"] = "<strong>Garlic:</strong> (Heb. shum, from its strong odour), mentioned only once (<a href=\"#\" onClick=\"return mV('Num',11,5);\">Num 11:5</a>). The garlic common in Eastern countries is the <i>Allium sativum</i> or <i>Allium Ascalonicum</i>, so called from its having been brought into Europe from Ascalon by the Crusaders. It is now known by the name of \"shallot\" or \"eschalot.\"";
eastonArray["$$T0001433"] = "<strong>Garner:</strong><br><br>(1.) Heb. 'otsar, a treasure; a store of goods laid up, and hence also the place where they are deposited (<a href=\"#\" onClick=\"return mV('Joe',1,17);\">Joe 1:17</a>; <a href=\"#\" onClick=\"return mV('2Ch',32,27);\">2Ch 32:27</a>, rendered \"treasury\").<br><br>(2.) Heb. mezev, a cell, storeroom (<a href=\"#\" onClick=\"return mV('Psa',144,13);\">Psa 144:13</a>); Gr. apotheke, a place for storing anything, a granary (<a href=\"#\" onClick=\"return mV('Mat',3,12);\">Mat 3:12</a>; <a href=\"#\" onClick=\"return mV('Luk',3,17);\">Luk 3:17</a>).";
eastonArray["$$T0001434"] = "<strong>Garnish:</strong> overlay with stones (<a href=\"#\" onClick=\"return mV('2Ch',3,6);\">2Ch 3:6</a>), adorn (<a href=\"#\" onClick=\"return mV('Rev',21,19);\">Rev 21:19</a>), deck with garlands (<a href=\"#\" onClick=\"return mV('Mat',23,29);\">Mat 23:29</a>), furnish (<a href=\"#\" onClick=\"return mV('Mat',12,44);\">12:44</a>).<br><br>In <a href=\"#\" onClick=\"return mV('Job',26,13);\">Job 26:13</a> (Heb. shiphrah, meaning \"brightness\"), \"By his spirit the heavens are brightness\" i.e., are bright, splendid, beautiful.";
eastonArray["$$T0001435"] = "<strong>Garrison:</strong><br><br>(1.) Heb. matstsab, a station; a place where one stands (<a href=\"#\" onClick=\"return mV('1Sa',14,12);\">1Sa 14:12</a>); a military or fortified post (<a href=\"#\" onClick=\"return mV('1Sa',13,23);\">1Sa 13:23</a>; <a href=\"#\" onClick=\"return mV('1Sa',14,1,4,6);\">14:1, 4, 6</a>, etc.).<br><br>(2.) Heb. netsib, a prefect, superintendent; hence a military post (<a href=\"#\" onClick=\"return mV('1Sa',10,5);\">1Sa 10:5</a>; <a href=\"#\" onClick=\"return mV('1Sa',13,3,4);\">13:3-4</a>; <a href=\"#\" onClick=\"return mV('2Sa',8,6);\">2Sa 8:6</a>). This word has also been explained to denote a pillar set up to mark the Philistine conquest, or an officer appointed to collect taxes; but the idea of a military post seems to be the correct one.<br><br>(3.) Heb. matstsebah, properly a monumental column; improperly rendered pl. \"garrisons\" in <a href=\"#\" onClick=\"return mV('Eze',26,11);\">Eze 26:11</a>; correctly in Revised Version \"pillars,\" marg. \"obelisks,\" probably an idolatrous image.";
eastonArray["$$T0001436"] = "<strong>Gate:</strong><br><br>(1.) Of cities, as of Jerusalem (<a href=\"#\" onClick=\"return mV('Jer',37,13);\">Jer 37:13</a>; <a href=\"#\" onClick=\"return mV('Neh',1,3);\">Neh 1:3</a>; <a href=\"#\" onClick=\"return mV('Neh',2,3);\">2:3</a>; <a href=\"#\" onClick=\"return mV('Neh',3,3);\">3:3</a>), of Sodom (<a href=\"#\" onClick=\"return mV('Gen',19,1);\">Gen 19:1</a>), of Gaza (<a href=\"#\" onClick=\"return mV('Jdg',16,3);\">Jdg 16:3</a>).<br><br>(2.) Of royal palaces (<a href=\"#\" onClick=\"return mV('Neh',2,8);\">Neh 2:8</a>).<br><br>(3.) Of the temple of Solomon (<a href=\"#\" onClick=\"return mV('1Ki',6,34,35);\">1Ki 6:34-35</a>; <a href=\"#\" onClick=\"return mV('2Ki',18,16);\">2Ki 18:16</a>); of the holy place (<a href=\"#\" onClick=\"return mV('1Ki',6,31,32);\">1Ki 6:31-32</a>; <a href=\"#\" onClick=\"return mV('Eze',41,23,24);\">Eze 41:23-24</a>); of the outer courts of the temple, the beautiful gate (<a href=\"#\" onClick=\"return mV('Act',3,2);\">Act 3:2</a>).<br><br>(4.) Tombs (<a href=\"#\" onClick=\"return mV('Mat',27,60);\">Mat 27:60</a>).<br><br>(5.) Prisons (<a href=\"#\" onClick=\"return mV('Act',12,10);\">Act 12:10</a>; <a href=\"#\" onClick=\"return mV('Act',16,27);\">16:27</a>).<br><br>(6.) Caverns (<a href=\"#\" onClick=\"return mV('1Ki',19,13);\">1Ki 19:13</a>).<br><br>(7.) Camps (<a href=\"#\" onClick=\"return mV('Exd',32,26,27);\">Exd 32:26-27</a>; <a href=\"#\" onClick=\"return mV('Hbr',13,12);\">Hbr 13:12</a>).<br><br>The materials of which gates were made were,<br><br>(1.) Iron and brass (<a href=\"#\" onClick=\"return mV('Psa',107,16);\">Psa 107:16</a>; <a href=\"#\" onClick=\"return mV('Isa',45,2);\">Isa 45:2</a>; <a href=\"#\" onClick=\"return mV('Act',12,10);\">Act 12:10</a>).<br><br>(2.) Stones and pearls (<a href=\"#\" onClick=\"return mV('Isa',54,12);\">Isa 54:12</a>; <a href=\"#\" onClick=\"return mV('Rev',21,21);\">Rev 21:21</a>).<br><br>(3.) Wood (<a href=\"#\" onClick=\"return mV('Jdg',16,3);\">Jdg 16:3</a>) probably.<br><br>At the gates of cities courts of justice were frequently held, and hence \"judges of the gate\" are spoken of (<a href=\"#\" onClick=\"return mV('Deu',16,18);\">Deu 16:18</a>; <a href=\"#\" onClick=\"return mV('Deu',17,8);\">17:8</a>; <a href=\"#\" onClick=\"return mV('Deu',21,19);\">21:19</a>; <a href=\"#\" onClick=\"return mV('Deu',25,6,7);\">25:6-7</a>, etc.). At the gates prophets also frequently delivered their messages (<a href=\"#\" onClick=\"return mV('Pro',1,21);\">Pro 1:21</a>; <a href=\"#\" onClick=\"return mV('Pro',8,3);\">8:3</a>; <a href=\"#\" onClick=\"return mV('Isa',29,21);\">Isa 29:21</a>; <a href=\"#\" onClick=\"return mV('Jer',17,19,20);\">Jer 17:19-20</a>; <a href=\"#\" onClick=\"return mV('Jer',26,10);\">26:10</a>). Criminals were punished without the gates (<a href=\"#\" onClick=\"return mV('1Ki',21,13);\">1Ki 21:13</a>; <a href=\"#\" onClick=\"return mV('Act',7,59);\">Act 7:59</a>). By the \"gates of righteousness\" we are probably to understand those of the temple (<a href=\"#\" onClick=\"return mV('Psa',118,19);\">Psa 118:19</a>). \"The gates of hell\" (R.V., \"gates of Hades\") <a href=\"#\" onClick=\"return mV('Mat',16,18);\">Mat 16:18</a>, are generally interpreted as meaning the power of Satan, but probably they may mean the power of death, denoting that the Church of Christ shall never die.";
eastonArray["$$T0001437"] = "<strong>Gath:</strong> a wine-vat, one of the five royal cities of the Philistines (<a href=\"#\" onClick=\"return mV('Jos',13,3);\">Jos 13:3</a>) on which the ark brought calamity (<a href=\"#\" onClick=\"return mV('1Sa',5,8,9);\">1Sa 5:8-9</a>; <a href=\"#\" onClick=\"return mV('1Sa',6,17);\">6:17</a>). It was famous also as being the birthplace or residence of Goliath (<a href=\"#\" onClick=\"return mV('1Sa',17,4);\">1Sa 17:4</a>). David fled from Saul to Achish, king of Gath (<a href=\"#\" onClick=\"return mV('1Sa',21,10);\">1Sa 21:10</a>; <a href=\"#\" onClick=\"return mV('1Sa',27,'2-4');\">27:2-4</a>; <a href=\"#\" onClick=\"return mV('Psa',56,'1-')\">Psa 56</a>), and his connection with it will account for the words in <a href=\"#\" onClick=\"return mV('2Sa',1,20);\">2Sa 1:20</a>. It was afterwards conquered by David (<a href=\"#\" onClick=\"return mV('2Sa',8,1);\">2Sa 8:1</a>). It occupied a strong position on the borders of Judah and Philistia (<a href=\"#\" onClick=\"return mV('1Sa',21,10);\">1Sa 21:10</a>; <a href=\"#\" onClick=\"return mV('1Ch',18,1);\">1Ch 18:1</a>). Its site has been identified with the hill called Tell esSafieh, the Alba Specula of the Middle Ages, which rises 695 feet above the plain on its east edge. It is noticed on monuments about B.C. 1500. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002516');\">METHEGAMMAH</a>.)";
eastonArray["$$T0001438"] = "<strong>Gath-hepher:</strong> wine-press of the well, a town of Lower Galilee, about 5 miles from Nazareth; the birthplace of Jonah (<a href=\"#\" onClick=\"return mV('2Ki',14,25);\">2Ki 14:25</a>); the same as Gittah-hepher (<a href=\"#\" onClick=\"return mV('Jos',19,13);\">Jos 19:13</a>). It has been identified with the modern el-Meshed, a village on the top of a rocky hill. Here the supposed tomb of Jonah, Neby Yunas, is still pointed out.";
eastonArray["$$T0001439"] = "<strong>Gath-rimmon:</strong> press of the pomegranate.<br><br>(1.) A Levitical city in the tribe of Dan (<a href=\"#\" onClick=\"return mV('Jos',19,45);\">Jos 19:45</a>; <a href=\"#\" onClick=\"return mV('Jos',21,24);\">21:24</a>; <a href=\"#\" onClick=\"return mV('1Ch',6,69);\">1Ch 6:69</a>).<br><br>(2.) Another city of the same name in Manasseh, west of the Jordan (<a href=\"#\" onClick=\"return mV('Jos',21,25);\">Jos 21:25</a>), called also Bileam (<a href=\"#\" onClick=\"return mV('1Ch',6,70);\">1Ch 6:70</a>).";
eastonArray["$$T0001440"] = "<strong>Gaulanitis:</strong> a name derived from \"Golan\" (q.v.), one of the cities of refuge in the territory of Manasseh (<a href=\"#\" onClick=\"return mV('Jos',20,8);\">Jos 20:8</a>; <a href=\"#\" onClick=\"return mV('Jos',21,27);\">21:27</a>; <a href=\"#\" onClick=\"return mV('Deu',4,43);\">Deu 4:43</a>). This was one of the provinces ruled by Herod Antipas. It lay to the east of the Lake of Galilee, and included among its towns Bethsaida-Julias (<a href=\"#\" onClick=\"return mV('Mar',8,22);\">Mar 8:22</a>) and Seleucia.";
eastonArray["$$T0001441"] = "<strong>Gaza:</strong> called also Azzah, which is its Hebrew name (<a href=\"#\" onClick=\"return mV('Deu',2,23);\">Deu 2:23</a>; <a href=\"#\" onClick=\"return mV('1Ki',4,24);\">1Ki 4:24</a>; <a href=\"#\" onClick=\"return mV('Jer',25,20);\">Jer 25:20</a>), strong, a city on the Mediterranean shore, remarkable for its early importance as the chief centre of a great commercial traffic with Egypt. It is one of the oldest cities of the world (<a href=\"#\" onClick=\"return mV('Gen',10,19);\">Gen 10:19</a>; <a href=\"#\" onClick=\"return mV('Jos',15,47);\">Jos 15:47</a>). Its earliest inhabitants were the Avims, who were conquered and displaced by the Caphtorims (<a href=\"#\" onClick=\"return mV('Deu',2,23);\">Deu 2:23</a>; <a href=\"#\" onClick=\"return mV('Jos',13,2,3);\">Jos 13:2-3</a>), a Philistine tribe. In the division of the land it fell to the lot of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,47);\">Jos 15:47</a>; <a href=\"#\" onClick=\"return mV('Jdg',1,18);\">Jdg 1:18</a>). It was the southernmost of the five great Philistine cities which gave each a golden emerod as a trespass-offering unto the Lord (<a href=\"#\" onClick=\"return mV('1Sa',6,17);\">1Sa 6:17</a>). Its gates were carried away by Samson (<a href=\"#\" onClick=\"return mV('Jdg',16,'1-3');\">Jdg 16:1-3</a>). Here he was afterwards a prisoner, and \"did grind in the prison house.\" Here he also pulled down the temple of Dagon, and slew \"all the lords of the Philistines,\" himself also perishing in the ruin (<a href=\"#\" onClick=\"return mV('Jdg',16,'21-30');\">Jdg 16:21-30</a>). The prophets denounce the judgments of God against it (<a href=\"#\" onClick=\"return mV('Jer',25,20);\">Jer 25:20</a>; <a href=\"#\" onClick=\"return mV('Jer',47,5);\">47:5</a>; <a href=\"#\" onClick=\"return mV('Amo',1,6,7);\">Amo 1:6-7</a>; <a href=\"#\" onClick=\"return mV('Zep',2,4);\">Zep 2:4</a>). It is referred to in <a href=\"#\" onClick=\"return mV('Act',8,26);\">Act 8:26</a>. Philip is here told to take the road from Jerusalem to Gaza (about 6 miles south-west of Jerusalem), \"which is desert\", i.e., the \"desert road,\" probably by Hebron, through the desert hills of Southern Judea. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003208');\">SAMSON</a>.)<br><br>It is noticed on monuments as early as B.C. 1600. Its small port is now called el-Mineh.";
eastonArray["$$T0001442"] = "<strong>Geba:</strong> the hill, (<a href=\"#\" onClick=\"return mV('2Sa',5,25);\">2Sa 5:25</a> [<a href=\"#\" onClick=\"return mV('1Ch',14,16);\">1 Chr. 14:16</a>, \"Gibeon\"]; <a href=\"#\" onClick=\"return mV('2Ki',23,8);\">2Ki 23:8</a>; <a href=\"#\" onClick=\"return mV('Neh',11,31);\">Neh 11:31</a>), a Levitical city of Benjamin (<a href=\"#\" onClick=\"return mV('1Ki',15,22);\">1Ki 15:22</a>; <a href=\"#\" onClick=\"return mV('1Sa',13,16);\">1Sa 13:16</a>; <a href=\"#\" onClick=\"return mV('1Sa',14,5);\">14:5</a>, wrongly \"Gibeah\" in the A.V.), on the north border of Judah near Gibeah (<a href=\"#\" onClick=\"return mV('Isa',10,29);\">Isa 10:29</a>; <a href=\"#\" onClick=\"return mV('Jos',18,24,28);\">Jos 18:24, 28</a>). \"From Geba to Beersheba\" expressed the whole extent of the kingdom of Judah, just as \"from Dan to Beersheba\" described the whole length of Palestine (<a href=\"#\" onClick=\"return mV('2Ki',23,8);\">2Ki 23:8</a>). It has been identified with Gaba (<a href=\"#\" onClick=\"return mV('Jos',18,24);\">Jos 18:24</a>; <a href=\"#\" onClick=\"return mV('Ezr',2,26);\">Ezr 2:26</a>; <a href=\"#\" onClick=\"return mV('Neh',7,30);\">Neh 7:30</a>), now Jeb'a, about 5 1/2 miles north of Jerusalem.";
eastonArray["$$T0001443"] = "<strong>Gebal:</strong> a line (or natural boundary, as a mountain range).<br><br>(1.) A tract in the land of Edom south of the Dead Sea (<a href=\"#\" onClick=\"return mV('Psa',83,7);\">Psa 83:7</a>); now called Djebal.<br><br>(2.) A Phoenician city, not far from the sea coast, to the north of Beyrout (<a href=\"#\" onClick=\"return mV('Eze',27,9);\">Eze 27:9</a>); called by the Greeks Byblos. Now Jibeil. Mentioned in the Amarna tablets.<br><br>An important Phoenician text, referring to the temple of Baalath, on a monument of Yehu-melek, its king (probably B.C. 600), has been discovered.";
eastonArray["$$T0001444"] = "<strong>Gebalites:</strong> (<a href=\"#\" onClick=\"return mV('1Ki',5,18);\">1Ki 5:18</a> R.V., in A.V. incorrectly rendered, after the Targum, \"stone-squarers,\" but marg. \"Giblites\"), the inhabitants of Gebal (2).";
eastonArray["$$T0001445"] = "<strong>Geber:</strong> a valiant man, (<a href=\"#\" onClick=\"return mV('1Ki',4,19);\">1Ki 4:19</a>), one of Solomon's purveyors, having jurisdiction over a part of Gilead, comprising all the kingdom of Sihon and part of the kingdom of Og (<a href=\"#\" onClick=\"return mV('Deu',2,31)\">Deu 2:31</a>).";
eastonArray["$$T0001446"] = "<strong>Gebim:</strong> cisterns, (<a href=\"#\" onClick=\"return mV('Jer',14,3);\">Jer 14:3</a>; <a href=\"#\" onClick=\"return mV('Isa',33,4);\">Isa 33:4</a>), a small place north of Jerusalem, whose inhabitants fled at the approach of the Assyrian army (<a href=\"#\" onClick=\"return mV('Isa',10,31);\">Isa 10:31</a>). It is probably the modern el-Isawiyeh.";
eastonArray["$$T0001447"] = "<strong>Gedaliah:</strong> made great by Jehovah.<br><br>(1.) the son of Jeduthum (<a href=\"#\" onClick=\"return mV('1Ch',25,3,9);\">1Ch 25:3, 9</a>).<br><br>(2.) The grandfather of the prophet Zephaniah, and the father of Cushi (<a href=\"#\" onClick=\"return mV('Zep',1,1);\">Zep 1:1</a>).<br><br>(3.) One of the Jewish nobles who conspired against Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',38,1);\">Jer 38:1</a>).<br><br>(4.) The son of Ahikam, and grandson of Shaphan, secretary of king Josiah (<a href=\"#\" onClick=\"return mV('Jer',26,24);\">Jer 26:24</a>). After the destruction of Jerusalem (see <a href=\"#\" onClick=\"return doDictLookup('ET0003894');\">ZEDEKIAH</a>), Nebuchadnezzar left him to govern the country as tributary to him (<a href=\"#\" onClick=\"return mV('2Ki',25,22);\">2Ki 25:22</a>; <a href=\"#\" onClick=\"return mV('Jer',40,5);\">Jer 40:5</a>; <a href=\"#\" onClick=\"return mV('Jer',52,16);\">52:16</a>). Ishmael, however, at the head of a party of the royal family, \"Jewish irreconcilables\", rose against him, and slew him and \"all the Jews that were with him\" (<a href=\"#\" onClick=\"return mV('Jer',41,2,3);\">Jer 41:2-3</a>) at Mizpah about three months after the destruction of Jerusalem. He and his band also plundered the town of Mizpah, and carried off many captives. He was, however, overtaken by Johanan and routed. He fled with such of his followers as escaped to the Ammonites (<a href=\"#\" onClick=\"return mV('Jer',41,15);\">41:15</a>). The little remnant of the Jews now fled to Egypt.";
eastonArray["$$T0001448"] = "<strong>Geder:</strong> a walled place, (<a href=\"#\" onClick=\"return mV('Jos',12,13);\">Jos 12:13</a>), perhaps the same as Gederah or Gedor (<a href=\"#\" onClick=\"return mV('Jos',15,58);\">15:58</a>).";
eastonArray["$$T0001449"] = "<strong>Gederah:</strong> the fortress; a fortified place, a town in the plain (shephelah) of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,36);\">Jos 15:36</a>). This is a very common Canaanite and Phoenician name. It is the feminine form of Geder (<a href=\"#\" onClick=\"return mV('Jos',12,13);\">12:13</a>); the plural form is Gederoth (<a href=\"#\" onClick=\"return mV('Jos',15,41);\">15:41</a>). This place has by some been identified with Jedireh, a ruin 9 miles from Lydda, toward Eleutheropolis, and 4 miles north of Sur'ah (Zorah), in the valley of Elah.";
