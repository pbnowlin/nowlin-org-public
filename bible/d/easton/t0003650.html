<script src="./js/NoNavHeader.js"  type="text/javascript"></script>
<script>
var eastonArray = new Array ();
eastonArray["$$T0003650"] = "<strong>Thyatira:</strong> a city of Asia Minor, on the borders of Lydia and Mysia. Its modern name is Ak-hissar, i.e., \"white castle.\" Here was one of the seven churches (<a href=\"#\" onClick=\"return mV('Rev',1,11);\">Rev 1:11</a>; <a href=\"#\" onClick=\"return mV('Rev',2,'18-28');\">2:18-28</a>). Lydia, the seller of purple, or rather of cloth dyed with this colour, was from this city (<a href=\"#\" onClick=\"return mV('Act',16,14);\">Act 16:14</a>). It was and still is famous for its dyeing. Among the ruins, inscriptions have been found relating to the guild of dyers in that city in ancient times.";
eastonArray["$$T0003651"] = "<strong>Thyine wood:</strong> mentioned only in <a href=\"#\" onClick=\"return mV('Rev',18,12);\">Rev 18:12</a> among the articles which would cease to be purchased when Babylon fell. It was called citrus, citron wood, by the Romans. It was the <i>Callitris quadrivalvis</i> of botanists, of the cone-bearing order of trees, and of the cypress tribe of this order. The name of this wood is derived from the Greek word <i>thuein</i>, \"to sacrifice,\" and it was so called because it was burnt in sacrifices, on account of its fragrance. The wood of this tree was reckoned very valuable, and was used for making articles of furniture by the Greeks and Romans. Like the cedars of Lebanon, it is disappearing from the forests of Palestine.";
eastonArray["$$T0003652"] = "<strong>Tiberias:</strong> a city, the modern Tubarich, on the western shore of the Sea of Tiberias. It is said to have been founded by Herod Antipas (A.D. 16), on the site of the ruins of an older city called Rakkath, and to have been thus named by him after the Emperor Tiberius. It is mentioned only three times in the history of our Lord (<a href=\"#\" onClick=\"return mV('Jhn',6,1,23);\">Jhn 6:1, 23</a>; <a href=\"#\" onClick=\"return mV('Jhn',21,1);\">21:1</a>).<br><br>In 1837 about one-half of the inhabitants perished by an earthquake. The population of the city is now about six thousand, nearly the one-half being Jews. \"We do not read that our Lord ever entered this city. The reason of this is probably to be found in the fact that it was practically a heathen city, though standing upon Jewish soil. Herod, its founder, had brought together the arts of Greece, the idolatry of Rome, and the gross lewdness of Asia. There were in it a theatre for the performance of comedies, a forum, a stadium, a palace roofed with gold in imitation of those in Italy, statues of the Roman gods, and busts of the deified emperors. He who was not sent but to the lost sheep of the house of Israel might well hold himself aloof from such scenes as these\" (Manning's Those Holy Fields).<br><br>After the fall of Jerusalem (A.D. 70), Tiberias became one of the chief residences of the Jews in Palestine. It was for more than three hundred years their metropolis. From about A.D. 150 the Sanhedrin settled here, and established rabbinical schools, which rose to great celebrity. Here the Jerusalem (or Palestinian) Talmud was compiled about the beginning of the fifth century. To this same rabbinical school also we are indebted for the Masora, a \"body of traditions which transmitted the readings of the Hebrew text of the Old Testament, and preserved, by means of the vowel-system, the pronunciation of the Hebrew.\" In its original form, and in all manuscripts, the Hebrew is written without vowels; hence, when it ceased to be a spoken language, the importance of knowing what vowels to insert between the consonants. This is supplied by the Masora, and hence these vowels are called the \"Masoretic vowel-points.\"";
eastonArray["$$T0003653"] = "<strong>Tiberias, Sea of:</strong> called also the Sea of Galilee (q.v.) and of Gennesaret. In the Old Testament it is called the Sea of Chinnereth or Chinneroth. John (<a href=\"#\" onClick=\"return mV('Jhn',21,1);\">Jhn 21:1</a>) is the only evangelist who so designates this lake. His doing so incidentally confirms the opinion that he wrote after the other evangelists, and at a period subsequent to the taking of Jerusalem (A.D. 70). Tiberias had by this time become an important city, having been spared by the Romans, and made the capital of the province when Jerusalem was destroyed. It thus naturally gave its name to the lake.";
eastonArray["$$T0003654"] = "<strong>Tiberius Caesar:</strong> i.e., as known in Roman history, Tiberius Claudius Nero, only mentioned in <a href=\"#\" onClick=\"return mV('Luk',3,1);\">Luk 3:1</a>. He was the stepson of Augustus, whom he succeeded on the throne, A.D. 14. He was noted for his vicious and infamous life. In the fifteenth year of his reign John the Baptist entered on his public ministry, and under him also our Lord taught and suffered. He died A.D. 37. He is frequently referred to simply as \"Caesar\" (<a href=\"#\" onClick=\"return mV('Mat',22,17,21);\">Mat 22:17, 21</a>; <a href=\"#\" onClick=\"return mV('Mar',12,14,16,17);\">Mar 12:14, 16-17</a>; <a href=\"#\" onClick=\"return mV('Luk',20,22,24,25);\">Luk 20:22, 24-25</a>; <a href=\"#\" onClick=\"return mV('Luk',23,2);\">23:2</a>; <a href=\"#\" onClick=\"return mV('Jhn',19,12, 15);\">Jhn 19:12, 15</a>).";
eastonArray["$$T0003655"] = "<strong>Tibni:</strong> building of Jehovah, the son of Ginath, a man of some position, whom a considerable number of the people chose as monarch. For the period of four years he contended for the throne with Omri (<a href=\"#\" onClick=\"return mV('1Ki',16,21,22);\">1Ki 16:21-22</a>), who at length gained the mastery, and became sole monarch of Israel.";
eastonArray["$$T0003656"] = "<strong>Tidal:</strong> (in the LXX. called \"Thorgal\"), styled the \"king of nations\" (<a href=\"#\" onClick=\"return mV('Gen',14,'1-9');\">Gen 14:1-9</a>). Mentioned as Tudkhula on Arioch's brick. <i>Goyyim</i>, translated \"nations,\" is the country called Gutium, east of Tigris and north of Elam.";
eastonArray["$$T0003657"] = "<strong>Tiglath-Pileser I.:</strong> (not mentioned in Scripture) was the most famous of the monarchs of the first Assyrian empire (about B.C. 1110). After his death, for two hundred years the empire fell into decay. The history of David and Solomon falls within this period. He was succeeded by his son, Shalmaneser II.";
eastonArray["$$T0003658"] = "<strong>Tiglath-Pileser III.:</strong> or Tilgath-Pil-neser, the Assyrian throne-name of Pul (q.v.). He appears in the Assyrian records as gaining, in the fifth year of his reign (about B.C. 741), a victory over Azariah (in <a href=\"#\" onClick=\"return mV('2Ch',26,1);\">2Ch 26:1</a>), king of Judah, whose achievements are described in <a href=\"#\" onClick=\"return mV('2Ch',26,'6-15');\">2Ch 26:6-15</a>. He is first mentioned in Scripture, however, as gaining a victory over Pekah, king of Israel, and Rezin of Damascus, who were confederates. He put Rezin to death, and punished Pekah by taking a considerable portion of his kingdom, and carrying off (B.C. 734) a vast number of its inhabitants into captivity (<a href=\"#\" onClick=\"return mV('2Ki',15,29);\">2Ki 15:29</a>; <a href=\"#\" onClick=\"return mV('2Ki',16,'5-9');\">16:5-9</a>; <a href=\"#\" onClick=\"return mV('1Ch',5,6,26);\">1Ch 5:6, 26</a>), the Reubenites, the Gadites, and half the tribe of Manasseh whom he settled in Gozan. In the Assyrian annals it is further related that, before he returned from Syria, he held a court at Damascus, and received submission and tribute from the neighbouring kings, among whom were Pekah of Samaria and \"Yahu-khazi [i.e., Ahaz], king of Judah\" (<a href=\"#\" onClick=\"return mV('2Ki',16,'10-16');\">2Ki 16:10-16</a>).<br><br>He was the founder of what is called \"the second Assyrian empire,\" an empire meant to embrace the whole world, the centre of which should be Nineveh. He died B.C. 728, and was succeeded by a general of his army, Ulula, who assumed the name Shalmaneser IV.";
eastonArray["$$T0003659"] = "<strong>Timaeus:</strong> defiled, the father of blind Bartimaeus (<a href=\"#\" onClick=\"return mV('Mar',10,46);\">Mar 10:46</a>).";
eastonArray["$$T0003660"] = "<strong>Timbrel:</strong> (Heb. toph), a small drum or tambourine; a tabret (q.v.). The antiquity of this musical instrument appears from the scriptural allusions to it (<a href=\"#\" onClick=\"return mV('Gen',31,27);\">Gen 31:27</a>; <a href=\"#\" onClick=\"return mV('Exd',15,20);\">Exd 15:20</a>; <a href=\"#\" onClick=\"return mV('Jdg',11,34);\">Jdg 11:34</a>, etc.) (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002625');\">MUSIC</a>.)";
eastonArray["$$T0003661"] = "<strong>Timnah:</strong> a portion.<br><br>(1.) A town of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,10);\">Jos 15:10</a>). The Philistines took possession of it in the days of Ahaz (<a href=\"#\" onClick=\"return mV('2Ch',28,18);\">2Ch 28:18</a>). It was about 20 miles west of Jerusalem. It has been identified with Timnatha of Dan (<a href=\"#\" onClick=\"return mV('Jos',19,43);\">Jos 19:43</a>), and also with Timnath (<a href=\"#\" onClick=\"return mV('Jdg',14,1,5);\">Jdg 14:1, 5</a>).<br><br>(2.) A city in the mountains of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,57);\">Jos 15:57</a>) =Tibna near Jeba'.<br><br>(3.) A \"duke\" or sheik of Edom (<a href=\"#\" onClick=\"return mV('Gen',36,40);\">Gen 36:40</a>).";
eastonArray["$$T0003662"] = "<strong>Timnath:</strong> <a href=\"#\" onClick=\"return mV('Gen',38,12,14);\">Gen 38:12, 14</a>.<br><br>(1.) Heb. Timnathah, which is appropriately rendered in the Revised Version, Timnah, a town in Judah.<br><br>(2.) The town where Samson sojourned, probably identical with \"Timnah\"<br><br>(1) (<a href=\"#\" onClick=\"return mV('Jdg',14,'1-18');\">Jdg 14:1-18</a>).";
eastonArray["$$T0003663"] = "<strong>Timnath-heres:</strong> portion of the sun, where Joshua was buried (<a href=\"#\" onClick=\"return mV('Jdg',2,9);\">Jdg 2:9</a>). It was \"in the mount of Ephraim, in the north side of the hill Gaash,\" 10 miles south-west of Shechem. The same as the following.";
eastonArray["$$T0003664"] = "<strong>Timnath-serah:</strong> remaining portion, the city of Joshua in the hill country of Ephraim, the same as Timnath-heres (<a href=\"#\" onClick=\"return mV('Jos',19,50);\">Jos 19:50</a>; <a href=\"#\" onClick=\"return mV('Jos',24,30);\">24:30</a>). \"Of all sites I have seen,\" says Lieut. Col. Conder, \"none is so striking as that of Joshua's home, surrounded as it is with deep valleys and wild, rugged hills.\" Opposite the town is a hill, on the northern side of which there are many excavated sepulchres. Among these is the supposed tomb of Joshua, which is said to be \"the most striking monument in the country.\" It is a \"square chamber with five excavations in three of its sides, the central one forming a passage leading into a second chamber beyond. A great number of lamp-niches cover the walls of the porch, upwards of two hundred, arranged in vertical rows. A single cavity with a niche for a lamp has been thought to be the resting-place of the warrior-chief of Israel.\" The modern Kefr Haris, 10 miles south-west of Shechem.";
eastonArray["$$T0003665"] = "<strong>Timnite:</strong> a man of Timnah. Samson's father-in-law is so styled (<a href=\"#\" onClick=\"return mV('Jdg',15,6);\">Jdg 15:6</a>).";
eastonArray["$$T0003666"] = "<strong>Timon:</strong> honouring, one of the seven deacons at Jerusalem (<a href=\"#\" onClick=\"return mV('Act',6,5);\">Act 6:5</a>). Nothing further is known of him.";
eastonArray["$$T0003667"] = "<strong>Timotheus:</strong> the Greek form of the name of Timothy (<a href=\"#\" onClick=\"return mV('Act',16,1);\">Act 16:1</a>, etc.; the R.V. always \"Timothy\").";
eastonArray["$$T0003668"] = "<strong>Timothy:</strong> honouring God, a young disciple who was Paul's companion in many of his journeyings. His mother, Eunice, and his grandmother, Lois, are mentioned as eminent for their piety (<a href=\"#\" onClick=\"return mV('2Ti',1,5);\">2Ti 1:5</a>). We know nothing of his father but that he was a Greek (<a href=\"#\" onClick=\"return mV('Act',16,1);\">Act 16:1</a>). He is first brought into notice at the time of Paul's second visit to Lystra (<a href=\"#\" onClick=\"return mV('Act',16,2);\">16:2</a>), where he probably resided, and where it seems he was converted during Paul's first visit to that place (<a href=\"#\" onClick=\"return mV('1Ti',1,2);\">1Ti 1:2</a>; <a href=\"#\" onClick=\"return mV('2Ti',3,11);\">2Ti 3:11</a>). The apostle having formed a high opinion of his \"own son in the faith,\" arranged that he should become his companion (<a href=\"#\" onClick=\"return mV('Act',16,3);\">Act 16:3</a>), and took and circumcised him, so that he might conciliate the Jews. He was designated to the office of an evangelist (<a href=\"#\" onClick=\"return mV('1Ti',4,14);\">1Ti 4:14</a>), and went with Paul in his journey through Phrygia, Galatia, and Mysia; also to Troas and Philippi and Berea (<a href=\"#\" onClick=\"return mV('Act',17,14);\">Act 17:14</a>). Thence he followed Paul to Athens, and was sent by him with Silas on a mission to Thessalonica (<a href=\"#\" onClick=\"return mV('Act',17,15);\">17:15</a>; <a href=\"#\" onClick=\"return mV('1Th',3,2);\">1Th 3:2</a>). We next find him at Corinth (<a href=\"#\" onClick=\"return mV('1Th',1,1);\">1Th 1:1</a>; <a href=\"#\" onClick=\"return mV('2Th',1,1);\">2Th 1:1</a>) with Paul. He passes now out of sight for a few years, and is again noticed as with the apostle at Ephesus (<a href=\"#\" onClick=\"return mV('Act',19,22);\">Act 19:22</a>), whence he is sent on a mission into Macedonia. He accompanied Paul afterwards into Asia (<a href=\"#\" onClick=\"return mV('Act',20,4);\">20:4</a>), where he was with him for some time. When the apostle was a prisoner at Rome, Timothy joined him (<a href=\"#\" onClick=\"return mV('Phl',1,1);\">Phl 1:1</a>), where it appears he also suffered imprisonment (<a href=\"#\" onClick=\"return mV('Hbr',13,23);\">Hbr 13:23</a>). During the apostle's second imprisonment he wrote to Timothy, asking him to rejoin him as soon as possible, and to bring with him certain things which he had left at Troas, his cloak and parchments (<a href=\"#\" onClick=\"return mV('2Ti',4,13);\">2Ti 4:13</a>). According to tradition, after the apostle's death he settled in Ephesus as his sphere of labour, and there found a martyr's grave.";
eastonArray["$$T0003669"] = "<strong>Timothy, First Epistle to:</strong> Paul in this epistle speaks of himself as having left Ephesus for Macedonia (<a href=\"#\" onClick=\"return mV('1Ti',1,3);\">1Ti 1:3</a>), and hence not Laodicea, as mentioned in the subscription; but probably Philippi, or some other city in that region, was the place where this epistle was written. During the interval between his first and second imprisonments he probably visited the scenes of his former labours in Greece and Asia, and then found his way into Macedonia, whence he wrote this letter to Timothy, whom he had left behind in Ephesus.<br><br>It was probably written about A.D. 66 or 67.<br><br>The epistle consists mainly,<br><br>(1) of counsels to Timothy regarding the worship and organization of the Church, and the responsibilities resting on its several members; and<br><br>(2) of exhortation to faithfulness in maintaining the truth amid surrounding errors.";
eastonArray["$$T0003670"] = "<strong>Timothy, Second Epistle to:</strong> was probably written a year or so after the first, and from Rome, where Paul was for a second time a prisoner, and was sent to Timothy by the hands of Tychicus. In it he entreats Timothy to come to him before winter, and to bring Mark with him (<a href=\"#\" onClick=\"return mV('Phl',2,22);\">Phl 2:22</a>). He was anticipating that \"the time of his departure was at hand\" (<a href=\"#\" onClick=\"return mV('2Ti',4,6);\">2Ti 4:6</a>), and he exhorts his \"son Timothy\" to all diligence and steadfastness, and to patience under persecution (<a href=\"#\" onClick=\"return mV('2Ti',1,'6-15');\">2Ti 1:6-15</a>), and to a faithful discharge of all the duties of his office (<a href=\"#\" onClick=\"return mV('2Ti',4,'1-5');\">2Ti 4:1-5</a>), with all the solemnity of one who was about to appear before the Judge of quick and dead.";
eastonArray["$$T0003671"] = "<strong>Tin:</strong> Heb. bedil (<a href=\"#\" onClick=\"return mV('Num',31,22);\">Num 31:22</a>; <a href=\"#\" onClick=\"return mV('Eze',22,18,20);\">Eze 22:18, 20</a>), a metal well known in ancient times. It is the general opinion that the Phoenicians of Tyre and Sidon obtained their supplies of tin from the British Isles. In <a href=\"#\" onClick=\"return mV('Eze',27,12);\">Eze 27:12</a> it is said to have been brought from Tarshish, which was probably a commercial emporium supplied with commodities from other places. In <a href=\"#\" onClick=\"return mV('Isa',1,25);\">Isa 1:25</a> the word so rendered is generally understood of lead, the alloy with which the silver had become mixed (ver. <a href=\"#\" onClick=\"return mV('Isa',1,22);\">22</a>). The fire of the Babylonish Captivity would be the means of purging out the idolatrous alloy that had corrupted the people.";
eastonArray["$$T0003672"] = "<strong>Tinkling ornaments:</strong> (<a href=\"#\" onClick=\"return mV('Isa',3,18);\">Isa 3:18</a>), anklets of silver or gold, etc., such as are still used by women in Syria and the East.";
eastonArray["$$T0003673"] = "<strong>Tiphsah:</strong> passing over; ford, one of the boundaries of Solomon's dominions (<a href=\"#\" onClick=\"return mV('1Ki',4,24);\">1Ki 4:24</a>), probably \"Thapsacus, a great and wealthy town on the western bank of the Euphrates,\" about 100 miles north-east of Tadmor. All the land traffic between the east and the west passed through it. Menahem undertook an expedition against this city, and \"smote Tiphsah and all that were therein\" (<a href=\"#\" onClick=\"return mV('2Ki',15,16);\">2Ki 15:16</a>). This expedition implied a march of some 300 miles from Tirzah if by way of Tadmor, and about 400 if by way of Aleppo; and its success showed the strength of the Israelite kingdom, for it was practically a defiance to Assyria. Conder, however, identifies this place with Khurbet Tafsah, some 6 miles west of Shechem.";
eastonArray["$$T0003674"] = "<strong>Tiras:</strong> the youngest of the sons of Japheth (<a href=\"#\" onClick=\"return mV('Gen',10,2);\">Gen 10:2</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,5);\">1Ch 1:5</a>).";
eastonArray["$$T0003675"] = "<strong>Tires:</strong> \"To tire\" the head is to adorn it (<a href=\"#\" onClick=\"return mV('2Ki',9,30);\">2Ki 9:30</a>). As a noun the word is derived from \"tiara,\" and is the rendering of the Heb. p'er, a \"turban\" or an ornament for the head (<a href=\"#\" onClick=\"return mV('Eze',24,17);\">Eze 24:17</a>; R.V., \"headtire; <a href=\"#\" onClick=\"return mV('Eze',24,23);\">24:23</a>). In <a href=\"#\" onClick=\"return mV('Isa',3,18);\">Isa 3:18</a> the word <i>saharonim</i> is rendered \"round tires like the moon,\" and in <a href=\"#\" onClick=\"return mV('Jdg',8,21, 26);\">Jdg 8:21, 26</a> \"ornaments,\" but in both cases \"crescents\" in the Revised Version.";
eastonArray["$$T0003676"] = "<strong>Tirhakah:</strong> the last king of Egypt of the Ethiopian (the fifteenth) dynasty. He was the brother-in-law of So (q.v.). He probably ascended the throne about B.C. 692, having been previously king of Ethiopia (<a href=\"#\" onClick=\"return mV('2Ki',19,9);\">2Ki 19:9</a>; <a href=\"#\" onClick=\"return mV('Isa',37,9);\">Isa 37:9</a>), which with Egypt now formed one nation. He was a great warrior, and but little is known of him. The Assyrian armies under Esarhaddon, and again under Assur-bani-pal, invaded Egypt and defeated Tirhakah, who afterwards retired into Ethiopia, where he died, after reigning twenty-six years.";
eastonArray["$$T0003677"] = "<strong>Tirshatha:</strong> a word probably of Persian origin, meaning \"severity,\" denoting a high civil dignity. The Persian governor of Judea is so called (<a href=\"#\" onClick=\"return mV('Ezr',2,63);\">Ezr 2:63</a>; <a href=\"#\" onClick=\"return mV('Neh',7,65,70);\">Neh 7:65, 70</a>). Nehemiah is called by this name in <a href=\"#\" onClick=\"return mV('Neh',8,9);\">Neh 8:9</a>; <a href=\"#\" onClick=\"return mV('Neh',10,1);\">10:1</a>, and the \"governor\" (pehah) in <a href=\"#\" onClick=\"return mV('Neh',5,18);\">Neh 5:18</a>. Probably, therefore, tirshatha=pehah=the modern pasha.";
eastonArray["$$T0003678"] = "<strong>Tirza:</strong> pleasantness.<br><br>(1.) An old royal city of the Canaanites, which was destroyed by Joshua (<a href=\"#\" onClick=\"return mV('Jos',12,24);\">Jos 12:24</a>). Jeroboam chose it for his residence, and he removed to it from Shechem, which at first he made the capital of his kingdom. It remained the chief residence of the kings of Israel till Omri took Samaria (<a href=\"#\" onClick=\"return mV('1Ki',14,17);\">1Ki 14:17</a>; <a href=\"#\" onClick=\"return mV('1Ki',15,21);\">15:21</a>; <a href=\"#\" onClick=\"return mV('1Ki',16,6,8);\">16:6, 8</a> etc.). Here Zimri perished amid the flames of the palace to which in his despair he had set fire (<a href=\"#\" onClick=\"return mV('1Ki',16,18);\">1Ki 16:18</a>), and here Menahem smote Shallum (<a href=\"#\" onClick=\"return mV('2Ki',15,14,16);\">2Ki 15:14,16</a>). Solomon refers to its beauty (<a href=\"#\" onClick=\"return mV('Sgs',6,4);\">Sgs 6:4</a>). It has been identified with the modern mud hamlet Teiasir, 11 miles north of Shechem. Others, however, would identify it with Telluza, a village about 6 miles east of Samaria.<br><br>(2.) The youngest of Zelophehad's five daughters (<a href=\"#\" onClick=\"return mV('Num',26,33);\">Num 26:33</a>; <a href=\"#\" onClick=\"return mV('Jos',17,3);\">Jos 17:3</a>).";
eastonArray["$$T0003679"] = "<strong>Tishbite:</strong> Elijah the prophet was thus named (<a href=\"#\" onClick=\"return mV('1Ki',17,1);\">1Ki 17:1</a>; <a href=\"#\" onClick=\"return mV('1Ki',21,17,28);\">21:17, 28</a>, etc.). In <a href=\"#\" onClick=\"return mV('1Ki',17,1);\">1Ki 17:1</a> the word rendered \"inhabitants\" is in the original the same as that rendered \"Tishbite,\" hence that verse may be read as in the LXX., \"Elijah the Tishbite of Tishbi in Gilead.\" Some interpret this word as meaning \"stranger,\" and read the verse, \"Elijah the stranger from among the strangers in Gilead.\" This designation is probably given to the prophet as denoting that his birthplace was Tishbi, a place in Upper Galilee (mentioned in the apocryphal book of Tobit), from which for some reason he migrated into Gilead. Josephus, the Jewish historian (Ant. 8:13, 2), however, supposes that Tishbi was some place in the land of Gilead. It has been identified by some with el-Ishtib, a some place 22 miles due south of the Sea of Galilee, among the mountains of Gilead.";
eastonArray["$$T0003680"] = "<strong>Tisri:</strong> the first month of the civil year, and the seventh of the ecclesiastical year. See <a href=\"#\" onClick=\"return doDictLookup ('ET0001261');\">ETHANIM</a> (<a href=\"#\" onClick=\"return mV('1Ki',8,2);\">1Ki 8:2</a>). Called in the Assyrian inscriptions Tasaritu, i.e. \"beginning.\"";
eastonArray["$$T0003681"] = "<strong>Tithe:</strong> a tenth of the produce of the earth consecrated and set apart for special purposes. The dedication of a tenth to God was recognized as a duty before the time of Moses. Abraham paid tithes to Melchizedek (<a href=\"#\" onClick=\"return mV('Gen',14,20);\">Gen 14:20</a>; <a href=\"#\" onClick=\"return mV('Hbr',7,6);\">Hbr 7:6</a>); and Jacob vowed unto the Lord and said, \"Of all that thou shalt give me I will surely give the tenth unto thee.\"<br><br>The first Mosaic law on this subject is recorded in Lev. 27:30-32. Subsequent legislation regulated the destination of the tithes (<a href=\"#\" onClick=\"return mV('Num',18,'21-24', '26-28');\">Num 18:21-24, 26-28</a>; <a href=\"#\" onClick=\"return mV('Deu',12,5,6,11,17);\">Deu 12:5-6, 11, 17</a>; <a href=\"#\" onClick=\"return mV('Deu',14,22,23);\">14:22-23</a>). The paying of the tithes was an important part of the Jewish religious worship. In the days of Hezekiah one of the first results of the reformation of religion was the eagerness with which the people brought in their tithes (<a href=\"#\" onClick=\"return mV('2Ch',31,5,6);\">2Ch 31:5-6</a>). The neglect of this duty was sternly rebuked by the prophets (<a href=\"#\" onClick=\"return mV('Amo',4,4);\">Amo 4:4</a>; <a href=\"#\" onClick=\"return mV('Mal',3,'8-10');\">Mal 3:8-10</a>). It cannot be affirmed that the Old Testament law of tithes is binding on the Christian Church, nevertheless the principle of this law remains, and is incorporated in the gospel (<a href=\"#\" onClick=\"return mV('1Cr',9,13,14);\">1Cr 9:13-14</a>); and if, as is the case, the motive that ought to prompt to liberality in the cause of religion and of the service of God be greater now than in Old Testament times, then Christians outght to go beyond the ancient Hebrew in consecrating both themselves and their substance to God.<br><br>Every Jew was required by the Levitical law to pay three tithes of his property<br><br>(1) one tithe for the Levites;<br><br>(2) one for the use of the temple and the great feasts; and<br><br>(3) one for the poor of the land.";
eastonArray["$$T0003682"] = "<strong>Tittle:</strong> a point, (<a href=\"#\" onClick=\"return mV('Mat',5,18);\">Mat 5:18</a>; <a href=\"#\" onClick=\"return mV('Luk',16,17);\">Luk 16:17</a>), the minute point or stroke added to some letters of the Hebrew alphabet to distinguish them from others which they resemble; hence, the very least point.";
eastonArray["$$T0003683"] = "<strong>Titus:</strong> honourable, was with Paul and Barnabas at Antioch, and accompanied them to the council at Jerusalem (<a href=\"#\" onClick=\"return mV('Gal',2,'1-3');\">Gal 2:1-3</a>; <a href=\"#\" onClick=\"return mV('Act',15,2);\">Act 15:2</a>), although his name nowhere occurs in the Acts of the Apostles. He appears to have been a Gentile, and to have been chiefly engaged in ministering to Gentiles; for Paul sternly refused to have him circumcised, inasmuch as in his case the cause of gospel liberty was at stake. We find him, at a later period, with Paul and Timothy at Ephesus, whence he was sent by Paul to Corinth for the purpose of getting the contributions of the church there in behalf of the poor saints at Jerusalem sent forward (<a href=\"#\" onClick=\"return mV('2Cr',8,6);\">2Cr 8:6</a>; <a href=\"#\" onClick=\"return mV('2Cr',12,18);\">12:18</a>). He rejoined the apostle when he was in Macedonia, and cheered him with the tidings he brought from Corinth (<a href=\"#\" onClick=\"return mV('2Cr',7,'6-15');\">7:6-15</a>). After this his name is not mentioned till after Paul's first imprisonment, when we find him engaged in the organization of the church in Crete, where the apostle had left him for this purpose (<a href=\"#\" onClick=\"return mV('Tts',1,5);\">Tts 1:5</a>). The last notice of him is in <a href=\"#\" onClick=\"return mV('2Ti',4,10);\">2Ti 4:10</a>, where we find him with Paul at Rome during his second imprisonment. From Rome he was sent into Dalmatia, no doubt on some important missionary errand. We have no record of his death. He is not mentioned in the Acts.";
eastonArray["$$T0003684"] = "<strong>Titus, Epistle to:</strong> was probably written about the same time as the first epistle to Timothy, with which it has many affinities. \"Both letters were addressed to persons left by the writer to preside in their respective churches during his absence. Both letters are principally occupied in describing the qualifications to be sought for in those whom they should appoint to offices in the church; and the ingredients of this description are in both letters nearly the same. Timothy and Titus are likewise cautioned against the same prevailing corruptions, and in particular against the same misdirection of their cares and studies. This affinity obtains not only in the subject of the letters, which from the similarity of situation in the persons to whom they were addressed might be expected to be somewhat alike, but extends in a great variety of instances to the phrases and expressions. The writer accosts his two friends with the same salutation, and passes on to the business of his letter by the same transition (<a href=\"#\" onClick=\"return mV('1Ti',1,2,3);\">1Ti 1:2-3</a>; with <a href=\"#\" onClick=\"return mV('Tts',1,4,5);\">Tts 1:4-5</a>; <a href=\"#\" onClick=\"return mV('1Ti',1,4);\">1Ti 1:4</a>; with <a href=\"#\" onClick=\"return mV('Tts',1,13,14);\">Tts 1:13-14</a>; <a href=\"#\" onClick=\"return mV('Tts',3,9);\">3:9</a>; <a href=\"#\" onClick=\"return mV('1Ti',4,12);\">1Ti 4:12</a>; with <a href=\"#\" onClick=\"return mV('Tts',2,7,15);\">Tts 2:7,15</a>).\", Paley's Horae Paulinae.<br><br>The date of its composition may be concluded from the circumstance that it was written after Paul's visit to Crete (<a href=\"#\" onClick=\"return mV('Tts',1,5);\">Tts 1:5</a>). That visit could not be the one referred to in <a href=\"#\" onClick=\"return mV('Acts',27,7);\">Acts 27:7</a>, when Paul was on his voyage to Rome as a prisoner, and where he continued a prisoner for two years. We may warrantably suppose that after his release Paul sailed from Rome into Asia and took Crete by the way, and that there he left Titus \"to set in order the things that were wanting.\" Thence he went to Ephesus, where he left Timothy, and from Ephesus to Macedonia, where he wrote First Timothy, and thence to Nicopolis in Epirus, from which place he wrote to Titus, about A.D. 66 or 67.<br><br>In the subscription to the epistle it is said to have been written from \"Nicopolis of Macedonia,\" but no such place is known. The subscriptions to the epistles are of no authority, as they are not authentic.";
eastonArray["$$T0003685"] = "<strong>Tob-adonijah:</strong> good is Jehovah, my Lord, a Levite sent out by Jehoshaphat to instruct the people of Judah in the law (<a href=\"#\" onClick=\"return mV('2Ch',17,8);\">2Ch 17:8</a>).";
eastonArray["$$T0003686"] = "<strong>Tobiah:</strong> pleasing to Jehovah, the \"servant,\" the \"Ammonite,\" who joined with those who opposed the rebuilding of Jerusalem after the Exile (<a href=\"#\" onClick=\"return mV('Neh',2,10);\">Neh 2:10</a>). He was a man of great influence, which he exerted in opposition to the Jews, and \"sent letters\" to Nehemiah \"to put him in fear\" (<a href=\"#\" onClick=\"return mV('Neh',6,'17-19');\">Neh 6:17-19</a>). \"Eliashib the priest\" prepared for him during Nehemiah's absence \"a chamber in the courts of the house of God,\" which on his return grieved Nehemiah sore, and therefore he \"cast forth all the household stuff of Tobiah out of the chamber\" (<a href=\"#\" onClick=\"return mV('Neh',13,7,8);\">13:7-8</a>).";
eastonArray["$$T0003687"] = "<strong>Tobijah:</strong> id., a Levite sent out through Judah by Jehoshaphat to teach the people (<a href=\"#\" onClick=\"return mV('2Ch',17,8);\">2Ch 17:8</a>).";
eastonArray["$$T0003688"] = "<strong>Tob, The land of:</strong> a district on the east of Jodan, about 13 miles south-east of the Sea of Galilee, to which Jephthah fled from his brethren (<a href=\"#\" onClick=\"return mV('Jdg',11,3,5);\">Jdg 11:3, 5</a>). It was on the northern boundary of Perea, between Syria and the land of Ammon (<a href=\"#\" onClick=\"return mV('2Sa',10,6,8);\">2Sa 10:6, 8</a>). Its modern name is Taiyibeh.";
eastonArray["$$T0003689"] = "<strong>Tochen:</strong> measured, a town of Simeon (<a href=\"#\" onClick=\"return mV('1Ch',4,32);\">1Ch 4:32</a>).";
eastonArray["$$T0003690"] = "<strong>Togarmah:</strong><br><br>(1.) A son of Gomer, and grandson of Japheth (<a href=\"#\" onClick=\"return mV('Gen',10,3);\">Gen 10:3</a>).<br><br>(2.) A nation which traded in horses and mules at the fairs of Tyre (<a href=\"#\" onClick=\"return mV('Eze',27,14);\">Eze 27:14</a>; <a href=\"#\" onClick=\"return mV('Eze',38,6);\">38:6</a>); probably an Armenian or a Scythian race; descendants of<br><br>(1).";
eastonArray["$$T0003691"] = "<strong>Tohu:</strong> one of Samuel's ancestors (<a href=\"#\" onClick=\"return mV('1Sa',1,1);\">1Sa 1:1</a>).";
eastonArray["$$T0003692"] = "<strong>Toi:</strong> a king of Hamath, who sent \"Joram his son unto King David to salute him,\" when he \"heard that David had smitten all the host of Hadadezer\" (<a href=\"#\" onClick=\"return mV('2Sa',8,9,10);\">2Sa 8:9-10</a>). Called Tou (<a href=\"#\" onClick=\"return mV('1Ch',18,9,10);\">1Ch 18:9-10</a>).";
eastonArray["$$T0003693"] = "<strong>Tola:</strong> a scarlet worm.<br><br>(1.) Eldest son of Issachar (<a href=\"#\" onClick=\"return mV('Gen',46,13);\">Gen 46:13</a>).<br><br>(2.) A judge of the tribe of Issachar who \"judged\" Israel twenty-three years (<a href=\"#\" onClick=\"return mV('Jdg',10,1,2);\">Jdg 10:1-2</a>), when he died, and was buried in Shamir. He was succeeded by Jair.";
eastonArray["$$T0003694"] = "<strong>Tolad:</strong> productive, a town of Simeon, in the south of Judah (<a href=\"#\" onClick=\"return mV('1Ch',4,29);\">1Ch 4:29</a>).";
eastonArray["$$T0003695"] = "<strong>Tolaites:</strong> descendants of Tola (<a href=\"#\" onClick=\"return mV('Num',26,23);\">Num 26:23</a>; <a href=\"#\" onClick=\"return mV('1Ch',7,1,2);\">1Ch 7:1-2</a>).";
eastonArray["$$T0003696"] = "<strong>Toll:</strong> one of the branches of the king of Persia's revenues (<a href=\"#\" onClick=\"return mV('Ezr',4,13);\">Ezr 4:13</a>; <a href=\"#\" onClick=\"return mV('Ezr',7,24);\">7:24</a>), probably a tax levied from those who used the bridges and fords and highways.";
eastonArray["$$T0003697"] = "<strong>Tombs:</strong> of the Hebrews were generally excavated in the solid rock, or were natural caves. Mention is made of such tombs in <a href=\"#\" onClick=\"return mV('Jdg',8,32);\">Jdg 8:32</a>; <a href=\"#\" onClick=\"return mV('2Sa',2,32);\">2Sa 2:32</a>; <a href=\"#\" onClick=\"return mV('2Ki',9,28);\">2Ki 9:28</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,30);\">23:30</a>. They were sometimes made in gardens (<a href=\"#\" onClick=\"return mV('2Ki',21,26);\">2Ki 21:26</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,16);\">23:16</a>; <a href=\"#\" onClick=\"return mV('Mat',27,60);\">Mat 27:60</a>). They are found in great numbers in and around Jerusalem and all over the land. They were sometimes whitewashed (<a href=\"#\" onClick=\"return mV('Mat',23,27,29);\">Mat 23:27, 29</a>). The body of Jesus was laid in Joseph's new rock-hewn tomb, in a garden near to Calvary. All evidence is in favour of the opinion that this tomb was somewhere near the Damascus gate, and outside the city, and cannot be identified with the so-called \"holy sepulchre.\" The mouth of such rocky tombs was usually closed by a large stone (Heb. golal), which could only be removed by the united efforts of several men (<a href=\"#\" onClick=\"return mV('Mat',28,2);\">Mat 28:2</a>; <a href=\"#\" onClick=\"return mV('Jhn',11,39);\">Jhn 11:39</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0001522');\">GOLGOTHA</a>.)";
eastonArray["$$T0003698"] = "<strong>Tongues, Confusion of:</strong> at Babel, the cause of the early separation of mankind and their division into nations. The descendants of Noah built a tower to prevent their dispersion; but God \"confounded their language\" (<a href=\"#\" onClick=\"return mV('Gen',11,'1-8');\">Gen 11:1-8</a>), and they were scattered over the whole earth. Till this time \"the whole earth was of one language and of one speech.\" (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003389');\">SHINAR</a>.)";
eastonArray["$$T0003699"] = "<strong>Tongues, Gift of:</strong> granted on the day of Pentecost (<a href=\"#\" onClick=\"return mV('Act',2,4);\">Act 2:4</a>), in fulfilment of a promise Christ had made to his disciples (<a href=\"#\" onClick=\"return mV('Mar',16,17);\">Mar 16:17</a>). What this gift actually was has been a subject of much discussion. Some have argued that it was merely an outward sign of the presence of the Holy Spirit among the disciples, typifying his manifold gifts, and showing that salvation was to be extended to all nations. But the words of Luke (<a href=\"#\" onClick=\"return mV('Act',2,9);\">Act 2:9</a>) clearly show that the various peoples in Jerusalem at the time of Pentecost did really hear themselves addressed in their own special language with which they were naturally acquainted (<a href=\"#\" onClick=\"return mV('Joe',2,28,29);\">Joe 2:28-29</a>).<br><br>Among the gifts of the Spirit the apostle enumerates in <a href=\"#\" onClick=\"return mV('1Cr',12,'10-');\">1 Cor. 12:10-14:30</a>, \"divers kinds of tongues\" and the \"interpretation of tongues.\" This \"gift\" was a different manifestation of the Spirit from that on Pentecost, although it resembled it in many particulars. Tongues were to be \"a sign to them that believe not.\"";
