<script src="./js/NoNavHeader.js"  type="text/javascript"></script>
<script>var eastonArray = new Array ();
eastonArray["$$T0002150"] = "<strong>Kabzeel:</strong> gathering of God, a city in the extreme south of Judah, near to Idumaea (<a href=\"#\" onClick=\"return mV('Jos',15,21);\">Jos 15:21</a>), the birthplace of Benaiah, one of David's chief warriors (<a href=\"#\" onClick=\"return mV('2Sa',23,20);\">2Sa 23:20</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,22);\">1Ch 11:22</a>). It was called also Jekabzeel (<a href=\"#\" onClick=\"return mV('Neh',11,25);\">Neh 11:25</a>), after the Captivity.";
eastonArray["$$T0002151"] = "<strong>Kadesh:</strong> holy, or Kadesh-Barnea, sacred desert of wandering, a place on the south-eastern border of Palestine, about 165 miles from Horeb. It lay in the \"wilderness\" or \"desert of Zin\" (<a href=\"#\" onClick=\"return mV('Gen',14,7);\">Gen 14:7</a>; <a href=\"#\" onClick=\"return mV('Num',13,'3-26');\">Num 13:3-26</a>; <a href=\"#\" onClick=\"return mV('Num',14,'29-33');\">14:29-33</a>; <a href=\"#\" onClick=\"return mV('Num',20,1);\">20:1</a>; <a href=\"#\" onClick=\"return mV('Num',27,14);\">27:14</a>), on the border of Edom (<a href=\"#\" onClick=\"return mV('Num',20,16);\">20:16</a>). From this place, in compliance with the desire of the people, Moses sent forth \"twelve spies\" to spy the land. After examining it in all its districts, the spies brought back an evil report, Joshua and Caleb alone giving a good report of the land (<a href=\"#\" onClick=\"return mV('Num',13,'18-31');\">13:18-31</a>). Influenced by the discouraging report, the people abandoned all hope of entering into the Promised Land. They remained a considerable time at Kadesh. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001820');\">HORMAH</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0002222');\">KORAH</a>.) Because of their unbelief, they were condemned by God to wander for thirty-eight years in the wilderness. They took their journey from Kadesh into the deserts of Paran, \"by way of the Red Sea\" (<a href=\"#\" onClick=\"return mV('Deu',2,1);\">Deu 2:1</a>). (One theory is that during these thirty-eight years they remained in and about Kadesh.)<br><br>At the end of these years of wanderings, the tribes were a second time gathered together at Kadesh. During their stay here at this time Miriam died and was buried. Here the people murmured for want of water, as their forefathers had done formerly at Rephidim; and Moses, irritated by their chidings, \"with his rod smote the rock twice,\" instead of \"speaking to the rock before their eyes,\" as the Lord had commanded him (<a href=\"#\" onClick=\"return mV('Num',27,14);\">Num 27:14</a>; <a href=\"#\" onClick=\"return mV('Deu',9,23);\">Deu 9:23</a>; <a href=\"#\" onClick=\"return mV('Psa',106,32,33);\">Psa 106:32-33</a>). Because of this act of his, in which Aaron too was involved, neither of them was to be permitted to set foot within the Promised Land (<a href=\"#\" onClick=\"return mV('Num',20,12, 24);\">Num 20:12, 24</a>). The king of Edom would not permit them to pass on through his territory, and therefore they commenced an eastward march, and \"came unto Mount Hor\" (<a href=\"#\" onClick=\"return mV('Num',20,22);\">20:22</a>).<br><br>This place has been identified with 'Ain el-Kadeis, about 12 miles east-south-east of Beersheba. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003493');\">SPIES</a>.)";
eastonArray["$$T0002152"] = "<strong>Kadesh:</strong> the sacred city of the Hittites, on the left bank of the Orontes, about 4 miles south of the Lake of Homs. It is identified with the great mound Tell Neby Mendeh, some 50 to 100 feet high, and 400 yards long. On the ruins of the temple of Karnak, in Egypt, has been found an inscription recording the capture of this city by Rameses II. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002923');\">PHARAOH</a>.) Here the sculptor \"has chiselled in deep work on the stone, with a bold execution of the several parts, the procession of the warriors, the battle before Kadesh, the storming of the fortress, the overthrow of the enemy, and the camp life of the Egyptians.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0001794');\">HITTITES</a>.)";
eastonArray["$$T0002153"] = "<strong>Kadmiel:</strong> before God; i.e., his servant, one of the Levites who returned with Zerubbabel from the Captivity (<a href=\"#\" onClick=\"return mV('Neh',9,4);\">Neh 9:4</a>; <a href=\"#\" onClick=\"return mV('Neh',10,9);\">10:9</a>; <a href=\"#\" onClick=\"return mV('Neh',12,8);\">12:8</a>).";
eastonArray["$$T0002154"] = "<strong>Kadmonites:</strong> Orientals, the name of a Canaanitish tribe which inhabited the north-eastern part of Palestine in the time of Abraham (<a href=\"#\" onClick=\"return mV('Gen',15,19);\">Gen 15:19</a>). Probably they were identical with the \"children of the east,\" who inhabited the country between Palestine and the Euphrates.";
eastonArray["$$T0002155"] = "<strong>Kanah:</strong> reedy; brook of reeds. <br><br>(1.) A stream forming the boundary between Ephraim and Manasseh, from the Mediterranean eastward to Tappuah (<a href=\"#\" onClick=\"return mV('Jos',16,8);\">Jos 16:8</a>). It has been identified with the sedgy streams that constitute the Wady Talaik, which enters the sea between Joppa and Caesarea. Others identify it with the river' Aujeh.<br><br>(2.) A town in the north of Asher (<a href=\"#\" onClick=\"return mV('Jos',19,28);\">Jos 19:28</a>). It has been identified with 'Ain-Kana, a village on the brow of a valley some 7 miles south-east of Tyre. About a mile north of this place are many colossal ruins strown about. And in the side of a neighbouring ravine are figures of men, women, and children cut in the face of the rock. These are supposed to be of Phoenician origin.";
eastonArray["$$T0002156"] = "<strong>Kareah:</strong> bald, the father of Johanan and Jonathan, who for a time were loyal to Gedaliah, the Babylonian governor of Jerusalem (<a href=\"#\" onClick=\"return mV('Jer',40,8,13,15,16);\">Jer 40:8, 13, 15-16</a>).";
eastonArray["$$T0002157"] = "<strong>Karkaa:</strong> a floor; bottom, a place between Adar and Azmon, about midway between the Mediterranean and the Dead Sea (<a href=\"#\" onClick=\"return mV('Jos',15,3);\">Jos 15:3</a>).";
eastonArray["$$T0002158"] = "<strong>Karkor:</strong> foundation, a place in the open desert wastes on the east of Jordan (<a href=\"#\" onClick=\"return mV('Jdg',8,10);\">Jdg 8:10</a>), not far beyond Succoth and Penuel, to the south. Here Gideon overtook and routed a fugitive band of Midianites under Zeba and Zalmunna, whom he took captive.";
eastonArray["$$T0002159"] = "<strong>Kartah:</strong> city, a town in the tribe of Zebulun assigned to the Levites of the family of Merari (<a href=\"#\" onClick=\"return mV('Jos',21,34);\">Jos 21:34</a>). It is identical with Kattath (<a href=\"#\" onClick=\"return mV('Jos',19,15);\">19:15</a>), and perhaps also with Kitron (<a href=\"#\" onClick=\"return mV('Jdg',1,30);\">Jdg 1:30</a>).";
eastonArray["$$T0002160"] = "<strong>Kartan:</strong> double city, a town of Naphali, assigned to the Gershonite Levites, and one of the cities of refuge (<a href=\"#\" onClick=\"return mV('Jos',21,32);\">Jos 21:32</a>). It was probably near the north-western shore of the Sea of Tiberias, identical with the ruined village el-Katanah.";
eastonArray["$$T0002161"] = "<strong>Kattath:</strong> (<a href=\"#\" onClick=\"return mV('Jos',19,15);\">Jos 19:15</a>), a town of Asher, has been identified with Kana el Jelil. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000702');\">CANA</a>.)";
eastonArray["$$T0002162"] = "<strong>Kedar:</strong> dark-skinned, the second son of Ishmael (<a href=\"#\" onClick=\"return mV('Gen',25,13);\">Gen 25:13</a>).<br><br>It is the name for the nomadic tribes of Arabs, the Bedouins generally (<a href=\"#\" onClick=\"return mV('Isa',21,16);\">Isa 21:16</a>; <a href=\"#\" onClick=\"return mV('Isa',42,11);\">42:11</a>; <a href=\"#\" onClick=\"return mV('Isa',60,7);\">60:7</a>; <a href=\"#\" onClick=\"return mV('Jer',2,10);\">Jer 2:10</a>; <a href=\"#\" onClick=\"return mV('Eze',27,21);\">Eze 27:21</a>), who dwelt in the north-west of Arabia. They lived in black hair-tents (<a href=\"#\" onClick=\"return mV('Sgs',1,5);\">Sgs 1:5</a>). To \"dwell in the tents of Kedar\" was to be cut off from the worship of the true God (<a href=\"#\" onClick=\"return mV('Psa',120,5);\">Psa 120:5</a>). The Kedarites suffered at the hands of Nebuchadnezzar (<a href=\"#\" onClick=\"return mV('Jer',49,28,29);\">Jer 49:28-29</a>).";
eastonArray["$$T0002163"] = "<strong>Kedemah:</strong> eastward, the last-named of the sons of Ishmael (<a href=\"#\" onClick=\"return mV('Gen',25,15);\">Gen 25:15</a>).";
eastonArray["$$T0002164"] = "<strong>Kedemoth:</strong> beginnings; easternmost, a city of Reuben, assigned to the Levites of the family of Merari (<a href=\"#\" onClick=\"return mV('Jos',13,18);\">Jos 13:18</a>). It lay not far north-east of Dibon-gad, east of the Dead Sea.";
eastonArray["$$T0002165"] = "<strong>Kedesh:</strong> sanctuary.<br><br>(1.) A place in the extreme south of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,23);\">Jos 15:23</a>). Probably the same as Kadesh-barnea (q.v.).<br><br>(2.) A city of Issachar (<a href=\"#\" onClick=\"return mV('1Ch',6,72);\">1Ch 6:72</a>). Possibly Tell Abu Kadeis, near Lejjun.<br><br>(3.) A \"fenced city\" of Naphtali, one of the cities of refuge (<a href=\"#\" onClick=\"return mV('Jos',19,37);\">Jos 19:37</a>; <a href=\"#\" onClick=\"return mV('Jdg',4,6);\">Jdg 4:6</a>). It was assigned to the Gershonite Levites (<a href=\"#\" onClick=\"return mV('Jos',21,32);\">Jos 21:32</a>). It was originally a Canaanite royal city (<a href=\"#\" onClick=\"return mV('Jos',12,22);\">Jos 12:22</a>), and was the residence of Barak (<a href=\"#\" onClick=\"return mV('Jdg',4,6);\">Jdg 4:6</a>); and here he and Deborah assembled the tribes of Zebulun and Naphtali before the commencement of the conflict with Sisera in the plain of Esdraelon, \"for Jehovah among the mighty\" (<a href=\"#\" onClick=\"return mV('Jdg',4,9,10);\">Jdg 4:9-10</a>). In the reign of Pekah it was taken by Tiglath-Pileser (<a href=\"#\" onClick=\"return mV('2Ki',15,29);\">2Ki 15:29</a>). It was situated near the \"plain\" (rather \"the oak\") of Zaanaim, and has been identified with the modern Kedes, on the hills fully four miles north-west of Lake El Huleh.<br><br>It has been supposed by some that the Kedesh of the narrative, where Barak assembled his troops, was not the place in Upper Galilee so named, which was 30 miles distant from the plain of Esdraelon, but Kedish, on the shore of the Sea of Galilee, 12 miles from Tabor.";
eastonArray["$$T0002166"] = "<strong>Kedron:</strong> the valley, now quite narrow, between the Mount of Olives and Mount Moriah. The upper part of it is called the Valley of Jehoshaphat. The LXX., in <a href=\"#\" onClick=\"return mV('1Ki',15,13);\">1Ki 15:13</a>, translate \"of the cedar.\" The word means \"black,\" and may refer to the colour of the water or the gloom of the ravine, or the black green of the cedars which grew there. <a href=\"#\" onClick=\"return mV('Jhn',18,1);\">Jhn 18:1</a>, \"Cedron,\" only here in New Testament. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002187');\">KIDRON</a>.)";
eastonArray["$$T0002167"] = "<strong>Kehelathah:</strong> assembly, one of the stations of the Israelites in the desert (<a href=\"#\" onClick=\"return mV('Num',33,22,23);\">Num 33:22-23</a>).";
eastonArray["$$T0002168"] = "<strong>Keilah:</strong> citadel, a city in the lowlands of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,44);\">Jos 15:44</a>). David rescued it from the attack of the Philistines (<a href=\"#\" onClick=\"return mV('1Sa',23,'1-8');\">1Sa 23:1-8</a>); but the inhabitants proving unfaithful to him, in that they sought to deliver him up to Saul (<a href=\"#\" onClick=\"return mV('1Sa',23,13);\">13</a>), he and his men \"departed from Keilah, and went whithersoever they could go.\" They fled to the hill Hareth, about 3 miles to the east, and thence through Hebron to Ziph (q.v.). \"And David was in the wilderness of Ziph, in a wood\" (<a href=\"#\" onClick=\"return mV('1Sa',23,15);\">1Sa 23:15</a>). Here Jonathan sought him out, \"and strengthened his hand in God.\" This was the last interview between David and Jonathan (<a href=\"#\" onClick=\"return mV('1Sa',23,'16-18');\">23:16-18</a>). It is the modern Khurbet Kila. Others identify it with Khuweilfeh, between Beit Jibrin (Eleutheropolis) and Beersheba, mentioned in the Amarna tablets.";
eastonArray["$$T0002169"] = "<strong>Kelita:</strong> dwarf, a Levite who assisted Ezra in expounding the law to the people (<a href=\"#\" onClick=\"return mV('Neh',8,7);\">Neh 8:7</a>; <a href=\"#\" onClick=\"return mV('Neh',10,10);\">10:10</a>).";
eastonArray["$$T0002170"] = "<strong>Kemuel:</strong> helper of God, or assembly of God.<br><br>(1.) The third son of Nahor (<a href=\"#\" onClick=\"return mV('Gen',22,21);\">Gen 22:21</a>).<br><br>(2.) Son of Shiphtan, appointed on behalf of the tribe of Ephraim to partition the land of Canaan (<a href=\"#\" onClick=\"return mV('Num',34,24);\">Num 34:24</a>).<br><br>(3.) A Levite (<a href=\"#\" onClick=\"return mV('1Ch',27,17);\">1Ch 27:17</a>).";
eastonArray["$$T0002171"] = "<strong>Kenath:</strong> possession, a city of Gilead. It was captured by Nobah, who called it by his own name (<a href=\"#\" onClick=\"return mV('Num',32,42);\">Num 32:42</a>). It has been identified with Kunawat, on the slopes of Jebel Hauran (Mount Bashan), 60 miles east from the south end of the Sea of Galilee.";
eastonArray["$$T0002172"] = "<strong>Kenaz:</strong> hunter.
<br><br>(1.) One of the sons of Eliphaz, the son of Esau. He became the chief of an Edomitish tribe (<a href=\"#\" onClick=\"return mV('Gen',36,11,15,42);\">Gen 36:11, 15, 42</a>).<br><br>(2.) Caleb's younger brother, and father of Othniel (<a href=\"#\" onClick=\"return mV('Jos',15,17);\">Jos 15:17</a>), whose family was of importance in Israel down to the time of David (<a href=\"#\" onClick=\"return mV('1Ch',27,15);\">1Ch 27:15</a>). Some think that Othniel (<a href=\"#\" onClick=\"return mV('Jdg',1,13);\">Jdg 1:13</a>), and not Kenaz, was Caleb's brother.<br><br>(3.) Caleb's grandson (<a href=\"#\" onClick=\"return mV('1Ch',4,15);\">1Ch 4:15</a>).";
eastonArray["$$T0002173"] = "<strong>Kenites:</strong> smiths, the name of a tribe inhabiting the desert lying between southern Palestine and the mountains of Sinai. Jethro was of this tribe (<a href=\"#\" onClick=\"return mV('Jdg',1,16);\">Jdg 1:16</a>). He is called a \"Midianite\" (<a href=\"#\" onClick=\"return mV('Num',10,29);\">Num 10:29</a>), and hence it is concluded that the Midianites and the Kenites were the same tribe. They were wandering smiths, \"the gipsies and travelling tinkers of the old Oriental world. They formed an important guild in an age when the art of metallurgy was confined to a few\" (Sayce's Races, etc.). They showed kindness to Israel in their journey through the wilderness. They accompanied them in their march as far as Jericho (<a href=\"#\" onClick=\"return mV('Jdg',1,16);\">Jdg 1:16</a>), and then returned to their old haunts among the Amalekites, in the desert to the south of Judah. They sustained afterwards friendly relations with the Israelites when settled in Canaan (<a href=\"#\" onClick=\"return mV('Jdg',4,11,'17-21');\">Jdg 4:11, 17-21</a>; <a href=\"#\" onClick=\"return mV('1Sa',27,10);\">1Sa 27:10</a>; <a href=\"#\" onClick=\"return mV('1Sa',30,29);\">30:29</a>). The Rechabites belonged to this tribe (<a href=\"#\" onClick=\"return mV('1Ch',2,55);\">1Ch 2:55</a>) and in the days of Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',35,'7-10');\">Jer 35:7-10</a>) are referred to as following their nomad habits. Saul bade them depart from the Amalekites (<a href=\"#\" onClick=\"return mV('1Sa',15,6);\">1Sa 15:6</a>) when, in obedience to the divine commission, he was about to \"smite Amalek.\" And his reason is, \"for ye showed kindness to all the children of Israel when they came up out of Egypt.\" Thus \"God is not unrighteous to forget the kindnesses shown to his people; but they shall be remembered another day, at the farthest in the great day, and recompensed in the resurrection of the just\" (M. Henry's Commentary). They are mentioned for the last time in Scripture in <a href=\"#\" onClick=\"return mV('1Sa',27,10);\">1Sa 27:10</a>; comp. <a href=\"#\" onClick=\"return mV('1Sa',30,20);\">1Sa 30:20</a>.";
eastonArray["$$T0002174"] = "<strong>Kenizzite:</strong><br><br>(1.) The name of a tribe referred to in the covenant God made with Abraham (<a href=\"#\" onClick=\"return mV('Gen',15,19);\">Gen 15:19</a>). They are not mentioned among the original inhabitants of Canaan (<a href=\"#\" onClick=\"return mV('Exd',3,8);\">Exd 3:8</a>; <a href=\"#\" onClick=\"return mV('Jos',3,10);\">Jos 3:10</a>), and probably they inhabited some part of Arabia, in the confines of Syria.<br><br>(2.) A designation given to Caleb (<a href=\"#\" onClick=\"return mV('Num',32,12);\">Num 32:12</a>; A.V., Kenezite).";
eastonArray["$$T0002175"] = "<strong>Kerchief:</strong> mentioned only <a href=\"#\" onClick=\"return mV('Eze',13,18, 21);\">Eze 13:18, 21</a>, as an article of apparel or ornament applied to the head of the idolatrous women of Israel. The precise meaning of the word is uncertain. It appears to have been a long loose shawl, such as Oriental women wrap themselves in (<a href=\"#\" onClick=\"return mV('Rth',3,15);\">Rth 3:15</a>; <a href=\"#\" onClick=\"return mV('Isa',3,22);\">Isa 3:22</a>). Some think that it was a long veil or head-dress, denoting by its form the position of those who wore it.";
eastonArray["$$T0002176"] = "<strong>Keren-happuch:</strong> horn of the face-paint = cosmetic-box, the name of Job's third daughter (<a href=\"#\" onClick=\"return mV('Job',42,14);\">Job 42:14</a>), born after prosperity had returned to him.";
eastonArray["$$T0002177"] = "<strong>Kerioth:</strong> cities.<br><br>(1.) A town in the south of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,25);\">Jos 15:25</a>). Judas the traitor was probably a native of this place, and hence his name Iscariot. It has been identified with the ruins of el-Kureitein, about 10 miles south of Hebron. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001694');\">HAZOR [4]</a>).<br><br>(2.) A city of Moab (<a href=\"#\" onClick=\"return mV('Jer',48,24,41);\">Jer 48:24, 41</a>), called Kirioth (<a href=\"#\" onClick=\"return mV('Amo',2,2);\">Amo 2:2</a>).";
eastonArray["$$T0002178"] = "<strong>Kesitah:</strong> (<a href=\"#\" onClick=\"return mV('Gen',33,19);\">Gen 33:19</a>, R.V., marg., a Hebrew word, rendered, A.V., pl. \"pieces of money,\" marg., \"lambs; <a href=\"#\" onClick=\"return mV('Jos',24,32);\">Jos 24:32</a>, \"pieces of silver; <a href=\"#\" onClick=\"return mV('Job',42,11);\">Job 42:11</a>, \"piece of money\"). The kesitah was probably a piece of money of a particular weight, cast in the form of a lamb. The monuments of Egypt show that such weights were used. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002950');\">PIECES</a>.)";
eastonArray["$$T0002179"] = "<strong>Kettle:</strong> a large pot for cooking. The same Hebrew word (dud, \"boiling\") is rendered also \"pot\" (<a href=\"#\" onClick=\"return mV('Psa',81,6);\">Psa 81:6</a>), \"caldron\" (<a href=\"#\" onClick=\"return mV('2Ch',35,13);\">2Ch 35:13</a>), \"basket\" (<a href=\"#\" onClick=\"return mV('Jer',24,2);\">Jer 24:2</a>). It was used for preparing the peace-offerings (<a href=\"#\" onClick=\"return mV('1Sa',2,13,14);\">1Sa 2:13-14</a>).";
eastonArray["$$T0002180"] = "<strong>Keturah:</strong> incense, the wife of Abraham, whom he married probably after Sarah's death (<a href=\"#\" onClick=\"return mV('Gen',25,'1-6');\">Gen 25:1-6</a>), by whom he had six sons, whom he sent away into the east country. Her nationality is unknown. She is styled \"Abraham's concubine\" (<a href=\"#\" onClick=\"return mV('1Ch',1,32);\">1Ch 1:32</a>). Through the offshoots of the Keturah line Abraham became the \"father of many nations.\"";
eastonArray["$$T0002181"] = "<strong>Key:</strong> frequently mentioned in Scripture. It is called in Hebrew <i>maphteah</i>, i.e., the opener (<a href=\"#\" onClick=\"return mV('Jdg',3,25);\">Jdg 3:25</a>); and in the Greek New Testament <i>kleis</i>, from its use in shutting (<a href=\"#\" onClick=\"return mV('Mat',16,19);\">Mat 16:19</a>; <a href=\"#\" onClick=\"return mV('Luk',11,52);\">Luk 11:52</a>; <a href=\"#\" onClick=\"return mV('Rev',1,18);\">Rev 1:18</a>, etc.). Figures of ancient Egyptian keys are frequently found on the monuments, also of Assyrian locks and keys of wood, and of a large size (<a href=\"#\" onClick=\"return mV('Isa',22,22);\">Isa 22:22</a>).<br><br>The word is used figuratively of power or authority or office (<a href=\"#\" onClick=\"return mV('Isa',22,22);\">Isa 22:22</a>; <a href=\"#\" onClick=\"return mV('Rev',3,7);\">Rev 3:7</a>; <a href=\"#\" onClick=\"return mV('Rev',1,8);\">Rev 1:8</a>; <a href=\"#\" onClick=\"return mV('Rev',9,1);\">Rev 9:1</a>; <a href=\"#\" onClick=\"return mV('Rev',20,1);\">20:1</a>; also <a href=\"#\" onClick=\"return mV('Mat',16,19);\">Mat 16:19</a>; <a href=\"#\" onClick=\"return mV('Mat',18,18);\">18:18</a>). The \"key of knowledge\" (<a href=\"#\" onClick=\"return mV('Luk',11,52);\">Luk 11:52</a>; <a href=\"#\" onClick=\"return mV('Mat',23,13);\">Mat 23:13</a>) is the means of attaining the knowledge regarding the kingdom of God. The \"power of the keys\" is a phrase in general use to denote the extent of ecclesiastical authority.";
eastonArray["$$T0002182"] = "<strong>Kezia:</strong> cassia, the name of Job's second daughter (<a href=\"#\" onClick=\"return mV('Job',42,14);\">Job 42:14</a>), born after prosperity had returned to him.";
eastonArray["$$T0002183"] = "<strong>Keziz:</strong> abrupt; cut off, a city of the tribe of Benjamin (<a href=\"#\" onClick=\"return mV('Jos',18,21);\">Jos 18:21</a>).";
eastonArray["$$T0002184"] = "<strong>Kibroth-hattaavah:</strong> the graves of the longing or of lust, one of the stations of the Israelites in the wilderness. It was probably in the Wady Murrah, and has been identified with the Erweis el-Ebeirig, where the remains of an ancient encampment have been found, about 30 miles north-east of Sinai, and exactly a day's journey from 'Ain Hudherah.<br><br>\"Here began the troubles of the journey. First, complaints broke out among the people, probably at the heat, the toil, and the privations of the march; and then God at once punished them by lightning, which fell on the hinder part of the camp, and killed many persons, but ceased at the intercession of Moses (<a href=\"#\" onClick=\"return mV('Num',11,1,2);\">Num 11:1-2</a>). Then a disgust fell on the multitude at having nothing to eat but the manna day after day, no change, no flesh, no fish, no high-flavoured vegetables, no luscious fruits...The people loathed the 'light food,' and cried out to Moses, 'Give us flesh, give us flesh, that we may eat.'\" In this emergency Moses, in despair, cried unto God. An answer came. God sent \"a prodigious flight of quails, on which the people satiated their gluttonous appetite for a full month. Then punishment fell on them: they loathed the food which they had desired; it bred disease in them; the divine anger aggravated the disease into a plague, and a heavy mortality was the consequence. The dead were buried without the camp; and in memory of man's sin and of the divine wrath this name, Kibroth-hattaavah, the Graves of Lust, was given to the place of their sepulchre\" (<a href=\"#\" onClick=\"return mV('Num',11,34,35);\">Num 11:34-35</a>; <a href=\"#\" onClick=\"return mV('Num',33,16,17);\">33:16-17</a>; <a href=\"#\" onClick=\"return mV('Deu',9,22);\">Deu 9:22</a>; <a href=\"#\" onClick=\"return mV('Psa',78,30,31);\">Psa 78:30-31</a>)., Rawlinson's Moses, p. 175. From this encampment they journeyed in a north-eastern direction to Hazeroth.";
eastonArray["$$T0002185"] = "<strong>Kibzaim:</strong> two heaps, a city of Ephraim, assigned to the Kohathite Levites, and appointed as a city of refuge (<a href=\"#\" onClick=\"return mV('Jos',21,22);\">Jos 21:22</a>). It is also called Jokmeam (<a href=\"#\" onClick=\"return mV('1Ch',6,68);\">1Ch 6:68</a>).";
eastonArray["$$T0002186"] = "<strong>Kid:</strong> the young of the goat. It was much used for food (<a href=\"#\" onClick=\"return mV('Gen',27,9);\">Gen 27:9</a>; <a href=\"#\" onClick=\"return mV('Gen',38,17);\">38:17</a>; <a href=\"#\" onClick=\"return mV('Jdg',6,19);\">Jdg 6:19</a>; <a href=\"#\" onClick=\"return mV('Jdg',14,6);\">14:6</a>). The Mosaic law forbade to dress a kid in the milk of its dam, a law which is thrice repeated (<a href=\"#\" onClick=\"return mV('Exd',23,19);\">Exd 23:19</a>; <a href=\"#\" onClick=\"return mV('Exd',34,26);\">34:26</a>; <a href=\"#\" onClick=\"return mV('Deu',14,21);\">Deu 14:21</a>). Among the various reasons assigned for this law, that appears to be the most satisfactory which regards it as \"a protest against cruelty and outraging the order of nature.\" A kid cooked in its mother's milk is \"a gross, unwholesome dish, and calculated to kindle animal and ferocious passions, and on this account Moses may have forbidden it. Besides, it is even yet associated with immoderate feasting; and originally, I suspect,\" says Dr. Thomson (Land and the Book), \"was connected with idolatrous sacrifices.\"";
eastonArray["$$T0002187"] = "<strong>Kidron:</strong> = Kedron = Cedron, turbid, the winter torrent which flows through the Valley of Jehoshaphat, on the eastern side of Jerusalem, between the city and the Mount of Olives. This valley is known in Scripture only by the name \"the brook Kidron.\" David crossed this brook bare-foot and weeping, when fleeing from Absalom (<a href=\"#\" onClick=\"return mV('2Sa',15,23,30);\">2Sa 15:23, 30</a>), and it was frequently crossed by our Lord in his journeyings to and fro (<a href=\"#\" onClick=\"return mV('Jhn',18,1);\">Jhn 18:1</a>). Here Asa burned the obscene idols of his mother (<a href=\"#\" onClick=\"return mV('1Ki',15,13);\">1Ki 15:13</a>), and here Athaliah was executed (<a href=\"#\" onClick=\"return mV('2Ki',11,16);\">2Ki 11:16</a>). It afterwards became the receptacle for all manner of impurities (<a href=\"#\" onClick=\"return mV('2Ch',29,16);\">2Ch 29:16</a>; <a href=\"#\" onClick=\"return mV('2Ch',30,14);\">30:14</a>); and in the time of Josiah this valley was the common cemetery of the city (<a href=\"#\" onClick=\"return mV('2Ki',23,6);\">2Ki 23:6</a>; <a href=\"#\" onClick=\"return mV('Jer',26,23);\">Jer 26:23</a>).<br><br>Through this mountain ravine no water runs, except after heavy rains in the mountains round about Jerusalem. Its length from its head to en-Rogel is 2 3/4 miles. Its precipitous, rocky banks are filled with ancient tombs, especially the left bank opposite the temple area. The greatest desire of the Jews is to be buried there, from the idea that the Kidron is the \"valley of Jehoshaphat\" mentioned in <a href=\"#\" onClick=\"return mV('Joe',3,2);\">Joe 3:2</a>.<br><br>Below en-Rogel the Kidron has no historical or sacred interest. It runs in a winding course through the wilderness of Judea to the north-western shore of the Dead Sea. Its whole length, in a straight line, is only some 20 miles, but in this space its descent is about 3,912 feet. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002166');\">KEDRON</a>.)<br><br>Recent excavations have brought to light the fact that the old bed of the Kidron is about 40 feet lower than its present bed, and about 70 feet nearer the sanctuary wall.";
eastonArray["$$T0002188"] = "<strong>Kinah:</strong> an elegy, a city in the extreme south of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,22);\">Jos 15:22</a>). It was probably not far from the Dead Sea, in the Wady Fikreh.";
eastonArray["$$T0002189"] = "<strong>Kine:</strong> (Heb. sing. parah, i.e., \"fruitful\"), mentioned in Pharaoh's dream (<a href=\"#\" onClick=\"return mV('Gen',41,18);\">Gen 41:18</a>). Here the word denotes \"buffaloes,\" which fed on the reeds and sedge by the river's brink.";
eastonArray["$$T0002190"] = "<strong>King:</strong> is in Scripture very generally used to denote one invested with authority, whether extensive or limited. There were thirty-one kings in Canaan (<a href=\"#\" onClick=\"return mV('Jos',12,9,24);\">Jos 12:9, 24</a>), whom Joshua subdued. Adonibezek subdued seventy kings (<a href=\"#\" onClick=\"return mV('Jdg',1,7);\">Jdg 1:7</a>). In the New Testament the Roman emperor is spoken of as a king (<a href=\"#\" onClick=\"return mV('1Pe',2,13,17);\">1Pe 2:13, 17</a>); and Herod Antipas, who was only a tetrarch, is also called a king (<a href=\"#\" onClick=\"return mV('Mat',14,9);\">Mat 14:9</a>; <a href=\"#\" onClick=\"return mV('Mar',6,22);\">Mar 6:22</a>).<br><br>This title is applied to God (<a href=\"#\" onClick=\"return mV('1Ti',1,17);\">1Ti 1:17</a>), and to Christ, the Son of God (<a href=\"#\" onClick=\"return mV('1Ti',6,15,16);\">1Ti 6:15-16</a>; <a href=\"#\" onClick=\"return mV('Mat',27,11);\">Mat 27:11</a>). The people of God are also called \"kings\" (<a href=\"#\" onClick=\"return mV('Dan',7,22,27);\">Dan 7:22, 27</a>; <a href=\"#\" onClick=\"return mV('Mat',19,28);\">Mat 19:28</a>; <a href=\"#\" onClick=\"return mV('Rev',1,6);\">Rev 1:6</a>, etc.). Death is called the \"king of terrors\" (<a href=\"#\" onClick=\"return mV('Job',18,14);\">Job 18:14</a>).<br><br>Jehovah was the sole King of the Jewish nation (<a href=\"#\" onClick=\"return mV('1Sa',8,7);\">1Sa 8:7</a>; <a href=\"#\" onClick=\"return mV('Isa',33,22);\">Isa 33:22</a>). But there came a time in the history of that people when a king was demanded, that they might be like other nations (<a href=\"#\" onClick=\"return mV('1Sa',8,5);\">1Sa 8:5</a>). The prophet Samuel remonstrated with them, but the people cried out, \"Nay, but we will have a king over us.\" The misconduct of Samuel's sons was the immediate cause of this demand.<br><br>The Hebrew kings did not rule in their own right, nor in name of the people who had chosen them, but partly as servants and partly as representatives of Jehovah, the true King of Israel (<a href=\"#\" onClick=\"return mV('1Sa',10,1);\">1Sa 10:1</a>). The limits of the king's power were prescribed (<a href=\"#\" onClick=\"return mV('1Sa',10,25);\">1Sa 10:25</a>). The officers of his court were,<br><br>(1) the recorder or remembrancer (<a href=\"#\" onClick=\"return mV('2Sa',8,16);\">2Sa 8:16</a>; <a href=\"#\" onClick=\"return mV('1Ki',4,3);\">1Ki 4:3</a>);<br><br>(2) the scribe (<a href=\"#\" onClick=\"return mV('2Sa',8,17);\">2Sa 8:17</a>; <a href=\"#\" onClick=\"return mV('2Sa',20,25);\">20:25</a>);<br><br>(3) the officer over the house, the chief steward (<a href=\"#\" onClick=\"return mV('Isa',22,15);\">Isa 22:15</a>); <br><br>(4) the \"king's friend,\" a confidential companion (<a href=\"#\" onClick=\"return mV('1Ki',4,5);\">1Ki 4:5</a>);<br><br>(5) the keeper of the wardrobe (<a href=\"#\" onClick=\"return mV('2Ki',22,14);\">2Ki 22:14</a>);<br><br>(6) captain of the bodyguard (<a href=\"#\" onClick=\"return mV('2Sa',20,23);\">2Sa 20:23</a>);<br><br>(7) officers over the king's treasures, etc. (<a href=\"#\" onClick=\"return mV('1Ch',27,'25-31');\">1Ch 27:25-31</a>);<br><br>(8) commander-in-chief of the army (<a href=\"#\" onClick=\"return mV('1Ch',27,34);\">1Ch 27:34</a>);<br><br>(9) the royal counsellor (<a href=\"#\" onClick=\"return mV('1Ch',27,32);\">1Ch 27:32</a>; <a href=\"#\" onClick=\"return mV('2Sa',16,'20-23');\">2Sa 16:20-23</a>).<br><br>(For catalogue of kings of Israel and Judah see chronological table in Appendix.)";
eastonArray["$$T0002191"] = "<strong>Kingdom of God:</strong> (<a href=\"#\" onClick=\"return mV('Mat',6,33);\">Mat 6:33</a>; <a href=\"#\" onClick=\"return mV('Mar',1,14,15);\">Mar 1:14-15</a>; <a href=\"#\" onClick=\"return mV('Luk',4,43);\">Luk 4:43</a>) = \"kingdom of Christ\" (<a href=\"#\" onClick=\"return mV('Mat',13,41);\">Mat 13:41</a>; <a href=\"#\" onClick=\"return mV('Mat',20,21);\">20:21</a>) = \"kingdom of Christ and of God\" (<a href=\"#\" onClick=\"return mV('Eph',5,5);\">Eph 5:5</a>) = \"kingdom of David\" (<a href=\"#\" onClick=\"return mV('Mar',11,10);\">Mar 11:10</a>) = \"the kingdom\" (<a href=\"#\" onClick=\"return mV('Mat',8,12);\">Mat 8:12</a>; <a href=\"#\" onClick=\"return mV('Mat',13,19);\">13:19</a>) = \"kingdom of heaven\" (<a href=\"#\" onClick=\"return mV('Mat',3,2);\">Mat 3:2</a>; <a href=\"#\" onClick=\"return mV('Mat',4,17);\">4:17</a>; <a href=\"#\" onClick=\"return mV('Mat',13,41);\">13:41</a>), all denote the same thing under different aspects, viz.:<br><br>(1) Christ's mediatorial authority, or his rule on the earth;<br><br>(2) the blessings and advantages of all kinds that flow from this rule;<br><br>(3) the subjects of this kingdom taken collectively, or the Church.";
eastonArray["$$T0002192"] = "<strong>Kingly office of Christ:</strong> one of the three special relations in which Christ stands to his people. Christ's office as mediator comprehends three different functions, viz., those of a prophet, priest, and king. These are not three distinct offices, but three functions of the one office of mediator.<br><br>Christ is King and sovereign Head over his Church and over all things to his Church (<a href=\"#\" onClick=\"return mV('Eph',1,22);\">Eph 1:22</a>; <a href=\"#\" onClick=\"return mV('Eph',4,15);\">4:15</a>; <a href=\"#\" onClick=\"return mV('Col',1,18);\">Col 1:18</a>; <a href=\"#\" onClick=\"return mV('Col',2,19);\">2:19</a>). He executes this mediatorial kingship in his Church, and over his Church, and over all things in behalf of his Church. This royalty differs from that which essentially belongs to him as God, for it is given to him by the Father as the reward of his obedience and sufferings (<a href=\"#\" onClick=\"return mV('Phl',2,'6-11');\">Phl 2:6-11</a>), and has as its especial object the upbuilding and the glory of his redeemed Church. It attaches, moreover, not to his divine nature as such, but to his person as God-man.<br><br>Christ's mediatorial kingdom may be regarded as comprehending,<br><br>(1) his kingdom of power, or his providential government of the universe;<br><br>(2) his kingdom of grace, which is wholly spiritual in its subjects and administration; and<br><br>(3) his kingdom of glory, which is the consummation of all his providential and gracious administration.<br><br>Christ sustained and exercised the function of mediatorial King as well as of Prophet and Priest, from the time of the fall of man, when he entered on his mediatorial work; yet it may be said that he was publicly and formally enthroned when he ascended up on high and sat down at the Father's right hand (<a href=\"#\" onClick=\"return mV('Psa',2,6);\">Psa 2:6</a>; <a href=\"#\" onClick=\"return mV('Jer',23,5);\">Jer 23:5</a>; <a href=\"#\" onClick=\"return mV('Isa',9,6);\">Isa 9:6</a>), after his work of humiliation and suffering on earth was \"finished.\"";
eastonArray["$$T0002193"] = "<strong>King's dale:</strong> mentioned only in <a href=\"#\" onClick=\"return mV('Gen',14,17);\">Gen 14:17</a>; <a href=\"#\" onClick=\"return mV('2Sa',18,18);\">2Sa 18:18</a>, the name given to \"the valley of Shaveh,\" where the king of Sodom met Abram.";
eastonArray["$$T0002194"] = "<strong>Kings, The Books of:</strong> The two books of Kings formed originally but one book in the Hebrew Scriptures. The present division into two books was first made by the LXX., which now, with the Vulgate, numbers them as the third and fourth books of Kings, the two books of Samuel being the first and second books of Kings.<br><br>They contain the annals of the Jewish commonwealth from the accession of Solomon till the subjugation of the kingdom by Nebuchadnezzar and the Babylonians (apparently a period of about four hundred and fifty-three years). The books of Chronicles (q.v.) are more comprehensive in their contents than those of Kings. The latter synchronize with <a href=\"#\" onClick=\"return mV('1Ch',28,'1-');\">1 Chr. 28- 2Ch 36:21</a>. While in the Chronicles greater prominence is given to the priestly or Levitical office, in the Kings greater prominence is given to the kingly.<br><br>The authorship of these books is uncertain. There are some portions of them and of Jeremiah that are almost identical, e.g., <a href=\"#\" onClick=\"return mV('2Ki',24,'18-25');\">2Ki 24:18-25</a> and <a href=\"#\" onClick=\"return mV('Jer',52,'1-');\">Jer 52</a>; <a href=\"#\" onClick=\"return mV('Jer',39,'1-10'');\">39:1-10</1>; <a href=\"#\" onClick=\"return mV('Jer',40,'7-');\">40:7</a>-<a href=\"#\" onClick=\"return mV('Jer',41,10);\">41:10</a>. There are also many undesigned coincidences between Jeremiah and Kings (<a href=\"#\" onClick=\"return mV('2Ki',21,'1-');\">2 Kings 21-23</a> and <a href=\"#\" onClick=\"return mV('Jer',7,15);\">Jer 7:15</a>; <a href=\"#\" onClick=\"return mV('Jer',15,4);\">15:4</a>; <a href=\"#\" onClick=\"return mV('Jer',19,3);\">19:3</a>, etc.), and events recorded in Kings of which Jeremiah had personal knowledge. These facts countenance in some degree the tradition that Jeremiah was the author of the books of Kings. But the more probable supposition is that Ezra, after the Captivity, compiled them from documents written perhaps by David, Solomon, Nathan, Gad, and Iddo, and that he arranged them in the order in which they now exist.<br><br>In the threefold division of the Scriptures by the Jews, these books are ranked among the \"Prophets.\" They are frequently quoted or alluded to by our Lord and his apostles (<a href=\"#\" onClick=\"return mV('Mat',6,29);\">Mat 6:29</a>; <a href=\"#\" onClick=\"return mV('Mat',12,42);\">12:42</a>; <a href=\"#\" onClick=\"return mV('Luk',4,25,26);\">Luk 4:25-26</a>; <a href=\"#\" onClick=\"return mV('Luk',10,4);\">10:4</a>; <a href=\"#\" onClick=\"return mV('2Ki',4,29);\">2Ki 4:29</a>; <a href=\"#\" onClick=\"return mV('Mar',1,6);\">Mar 1:6</a>; <a href=\"#\" onClick=\"return mV('2Ki',1,8);\">2Ki 1:8</a>; <a href=\"#\" onClick=\"return mV('Mat',3,4);\">Mat 3:4</a>, etc.).<br><br>The sources of the narrative are referred to<br><br>(1) \"the book of the acts of Solomon\" (<a href=\"#\" onClick=\"return mV('1Ki',11,41);\">1Ki 11:41</a>);<br><br>(2) the \"book of the chronicles of the kings of Judah\" (<a href=\"#\" onClick=\"return mV('1Ki',14,29);\">14:29</a>; <a href=\"#\" onClick=\"return mV('1Ki',15,7,23);\">15:7, 23</a>, etc.);<br><br>(3) the \"book of the chronicles of the kings of Israel\" (<a href=\"#\" onClick=\"return mV('1Ki',14,19);\">14:19</a>; <a href=\"#\" onClick=\"return mV('1Ki',15,31);\">15:31</a>; <a href=\"#\" onClick=\"return mV('1Ki',16,14,20,27);\">16:14, 20, 27</a>, etc.).<br><br>The date of its composition was some time between B.C. 561, the date of the last chapter (<a href=\"#\" onClick=\"return mV('1Ki',15,31);\">15:31</a>; <a href=\"#\" onClick=\"return mV('1Ki',16,14,20,27);\">16:14, 20, 27</a>, etc.). <a href=\"#\" onClick=\"return mV('2Ki',25,1)\">2Ki 25</a>), when Jehoiachin was released from captivity by Evil-merodach, and B.C. 538, the date of the decree of deliverance by Cyrus.";
eastonArray["$$T0002195"] = "<strong>Kinsman:</strong> Heb. goel, from root meaning to redeem. The goel among the Hebrews was the nearest male blood relation alive. Certain important obligations devolved upon him toward his next of kin.<br><br>(1.) If any one from poverty was unable to redeem his inheritance, it was the duty of the kinsman to redeem it (<a href=\"#\" onClick=\"return mV('Lev',25,25,28);\">Lev 25:25, 28</a>; <a href=\"#\" onClick=\"return mV('Rth',3,9,12);\">Rth 3:9, 12</a>). He was also required to redeem his relation who had sold himself into slavery (<a href=\"#\" onClick=\"return mV('Lev',25,48,49);\">Lev 25:48-49</a>).<br><br>God is the Goel of his people because he redeems them (<a href=\"#\" onClick=\"return mV('Exd',6,6);\">Exd 6:6</a>; <a href=\"#\" onClick=\"return mV('Isa',43,1);\">Isa 43:1</a>; <a href=\"#\" onClick=\"return mV('Isa',41,14);\">41:14</a>; <a href=\"#\" onClick=\"return mV('Isa',44,6,22);\">44:6, 22</a>; <a href=\"#\" onClick=\"return mV('Isa',48,20);\">48:20</a>; <a href=\"#\" onClick=\"return mV('Psa',103,4);\">Psa 103:4</a>; <a href=\"#\" onClick=\"return mV('Job',19,25);\">Job 19:25</a>, etc.).<br><br>(2.) The goel also was the avenger (q.v.) of blood (<a href=\"#\" onClick=\"return mV('Num',35,21);\">Num 35:21</a>) in the case of the murder of the next of kin.";
eastonArray["$$T0002196"] = "<strong>Kir:</strong> a wall or fortress, a place to which Tiglath-pileser carried the Syrians captive after he had taken the city of Damascus (<a href=\"#\" onClick=\"return mV('2Ki',16,9);\">2Ki 16:9</a>; <a href=\"#\" onClick=\"return mV('Amo',1,5);\">Amo 1:5</a>; <a href=\"#\" onClick=\"return mV('Amo',9,7);\">9:7</a>). Isaiah (<a href=\"#\" onClick=\"return mV('Isa',22,6);\">Isa 22:6</a>), who also was contemporary with these events, mentions it along with Elam. Some have supposed that Kir is a variant of Cush (Susiana), on the south of Elam.";
eastonArray["$$T0002197"] = "<strong>Kir-haraseth:</strong> built fortress, a city and fortress of Moab, the modern Kerak, a small town on the brow of a steep hill about 6 miles from Rabbath-Moab and 10 miles from the Dead Sea; called also Kir-haresh, Kir-hareseth, Kir-heres (<a href=\"#\" onClick=\"return mV('Isa',16,7,11);\">Isa 16:7, 11</a>; <a href=\"#\" onClick=\"return mV('Jer',48,31,36);\">Jer 48:31,36</a>). After the death of Ahab, Mesha, king of Moab (see <a href=\"#\" onClick=\"return doDictLookup('ET0002586');\">MOABITE STONE</a>), threw off allegiance to the king of Israel, and fought successfully for the independence of his kingdom. After this Jehoram, king of Israel, in seeking to regain his supremacy over Moab, entered into an alliance with Jehoshaphat, king of Judah, and with the king of Edom. The three kings led their armies against Mesha, who was driven back to seek refuge in Kir-haraseth. The Moabites were driven to despair. Mesha then took his eldest son, who would have reigned in his stead, and offered him as a burnt-offering on the wall of the fortress in the sight of the allied armies. \"There was great indignation against Israel: and they departed from him, and returned to their own land.\" The invaders evacuated the land of Moab, and Mesha achieved the independence of his country (<a href=\"#\" onClick=\"return mV('2Ki',3,'20-27');\">2Ki 3:20-27</a>).";
eastonArray["$$T0002198"] = "<strong>Kirjath:</strong> city, a city belonging to Benjamin (<a href=\"#\" onClick=\"return mV('Jos',18,28);\">Jos 18:28</a>), the modern Kuriet el-'Enab, i.e., \"city of grapes\", about 7 1/2 miles west-north-west of Jerusalem.";
eastonArray["$$T0002199"] = "<strong>Kirjathaim:</strong> two cities; a double city.<br><br>(1.) A city of refuge in Naphtali (<a href=\"#\" onClick=\"return mV('1Ch',6,76);\">1Ch 6:76</a>).<br><br>(2.) A town on the east of Jordan (<a href=\"#\" onClick=\"return mV('Gen',14,5);\">Gen 14:5</a>; <a href=\"#\" onClick=\"return mV('Deu',2,9,10);\">Deu 2:9-10</a>). It was assigned to the tribe of Reuben (<a href=\"#\" onClick=\"return mV('Num',32,37);\">Num 32:37</a>). In the time of Ezekiel (<a href=\"#\" onClick=\"return mV('Eze',25,9);\">Eze 25:9</a>) it was one of the four cities which formed the \"glory of Moab\" (<a href=\"#\" onClick=\"return mV('Jer',48,1,23);\">Jer 48:1, 23</a>). It has been identified with el-Kureiyat, 11 miles south-west of Medeba, on the south slope of Jebel Attarus, the ancient Ataroth.";
