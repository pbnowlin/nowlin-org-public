<script>
var eastonArray = new Array ();
eastonArray["$$T0002050"] = "<strong>Jeshimon:</strong> the waste, probably some high waste land to the south of the Dead Sea (<a href=\"#\" onClick=\"return mV('Num',21,20);\">Num 21:20</a>; <a href=\"#\" onClick=\"return mV('Num',23,28);\">23:28</a>; <a href=\"#\" onClick=\"return mV('1Sa',23,19,24);\">1Sa 23:19, 24</a>); or rather not a proper name at all, but simply \"the waste\" or \"wilderness,\" the district on which the plateau of Ziph (q.v.) looks down.";
eastonArray["$$T0002051"] = "<strong>Jeshua:</strong><br><br>(1.) Head of the ninth priestly order (<a href=\"#\" onClick=\"return mV('Ezr',2,36);\">Ezr 2:36</a>); called also Jeshuah (<a href=\"#\" onClick=\"return mV('1Ch',24,11);\">1Ch 24:11</a>).<br><br>(2.) A Levite appointed by Hezekiah to distribute offerings in the priestly cities (<a href=\"#\" onClick=\"return mV('2Ch',31,15);\">2Ch 31:15</a>).<br><br>(3.) <a href=\"#\" onClick=\"return mV('Ezr',2,6);\">Ezr 2:6</a>; <a href=\"#\" onClick=\"return mV('Neh',7,11);\">Neh 7:11</a>.<br><br>(4.) <a href=\"#\" onClick=\"return mV('Ezr',2,40);\">Ezr 2:40</a>; <a href=\"#\" onClick=\"return mV('Neh',7,43);\">Neh 7:43</a>.<br><br>(5.) The son of Jozadak, and high priest of the Jews under Zerubbabel (<a href=\"#\" onClick=\"return mV('Neh',7,7);\">Neh 7:7</a>; <a href=\"#\" onClick=\"return mV('Neh',12,1,7,10,26);\">12:1, 7, 10, 26</a>); called Joshua (<a href=\"#\" onClick=\"return mV('Hag',1,1,12);\">Hag 1:1, 12</a>; <a href=\"#\" onClick=\"return mV('Hag',2,2,4);\">2:2, 4</a>; <a href=\"#\" onClick=\"return mV('Zec',3,1,3,6,8,9);\">Zec 3:1, 3, 6, 8-9</a>).<br><br>(6.) A Levite (<a href=\"#\" onClick=\"return mV('Ezr',8,33);\">Ezr 8:33</a>).<br><br>(7.) <a href=\"#\" onClick=\"return mV('Neh',3,19);\">Neh 3:19</a>.<br><br>(8.) A Levite who assisted in the reformation under Nehemiah (<a href=\"#\" onClick=\"return mV('Neh',8,7);\">Neh 8:7</a>; <a href=\"#\" onClick=\"return mV('Neh',9,4,5);\">9:4-5</a>).<br><br>(9.) Son of Kadmiel (<a href=\"#\" onClick=\"return mV('Neh',12,24);\">Neh 12:24</a>).<br><br>(10.) A city of Judah (<a href=\"#\" onClick=\"return mV('Neh',11,26);\">Neh 11:26</a>).<br><br>(11.) <a href=\"#\" onClick=\"return mV('Neh',8,17);\">Neh 8:17</a>; Joshua, the son of Nun.";
eastonArray["$$T0002052"] = "<strong>Jeshurun:</strong> a poetical name for the people of Israel, used in token of affection, meaning, \"the dear upright people\" (<a href=\"#\" onClick=\"return mV('Deu',32,15);\">Deu 32:15</a>; <a href=\"#\" onClick=\"return mV('Deu',33,5,26);\">33:5, 26</a>; <a href=\"#\" onClick=\"return mV('Isa',44,2);\">Isa 44:2</a>).";
eastonArray["$$T0002053"] = "<strong>Jesse:</strong> firm, or a gift, a son of Obed, the son of Boaz and Ruth (<a href=\"#\" onClick=\"return mV('Rth',4,17,22);\">Rth 4:17, 22</a>; <a href=\"#\" onClick=\"return mV('Mat',1,5,6);\">Mat 1:5-6</a>; <a href=\"#\" onClick=\"return mV('Luk',3,32);\">Luk 3:32</a>). He was the father of eight sons, the youngest of whom was David (<a href=\"#\" onClick=\"return mV('1Sa',17,12);\">1Sa 17:12</a>). The phrase \"stem of Jesse\" is used for the family of David (<a href=\"#\" onClick=\"return mV('Isa',11,1);\">Isa 11:1</a>), and \"root of Jesse\" for the Messiah (<a href=\"#\" onClick=\"return mV('Isa',11,10);\">Isa 11:10</a>; <a href=\"#\" onClick=\"return mV('Rev',5,5);\">Rev 5:5</a>). Jesse was a man apparently of wealth and position at Bethlehem (<a href=\"#\" onClick=\"return mV('1Sa',17,17,18,20);\">1Sa 17:17-18, 20</a>; <a href=\"#\" onClick=\"return mV('Psa',78,71);\">Psa 78:71</a>). The last reference to him is of David's procuring for him an asylum with the king of Moab (<a href=\"#\" onClick=\"return mV('1Sa',22,3);\">1Sa 22:3</a>).";
eastonArray["$$T0002054"] = "<strong>Jesus:</strong><br><br>(1.) Joshua, the son of Nun (<a href=\"#\" onClick=\"return mV('Act',7,45);\">Act 7:45</a>; <a href=\"#\" onClick=\"return mV('Hbr',4,8);\">Hbr 4:8</a>; R.V., \"Joshua\").<br><br>(2.) A Jewish Christian surnamed Justus (<a href=\"#\" onClick=\"return mV('Col',4,11);\">Col 4:11</a>).<br><br>Jesus, the proper, as Christ is the official, name of our Lord. To distinguish him from others so called, he is spoken of as \"Jesus of Nazareth\" (<a href=\"#\" onClick=\"return mV('Jhn',18,7);\">Jhn 18:7</a>), and \"Jesus the son of Joseph\" (<a href=\"#\" onClick=\"return mV('Jhn',6,42);\">Jhn 6:42</a>).<br><br>This is the Greek form of the Hebrew name Joshua, which was originally Hoshea (<a href=\"#\" onClick=\"return mV('Num',13,8,16);\">Num 13:8, 16</a>), but changed by Moses into Jehoshua (<a href=\"#\" onClick=\"return mV('Num',13,16);\">Num 13:16</a>; <a href=\"#\" onClick=\"return mV('1Ch',7,27);\">1Ch 7:27</a>), or Joshua. After the Exile it assumed the form Jeshua, whence the Greek form Jesus. It was given to our Lord to denote the object of his mission, to save (<a href=\"#\" onClick=\"return mV('Mat',1,21);\">Mat 1:21</a>).<br><br>The life of Jesus on earth may be divided into two great periods,<brv /><br>(1) that of his private life, till he was about thirty years of age; and<br><br>(2) that of his public life, which lasted about three years.<br><br>In the \"fulness of time\" he was born at Bethlehem, in the reign of the emperor Augustus, of Mary, who was betrothed to Joseph, a carpenter (<a href=\"#\" onClick=\"return mV('Mat',1,1);\">Mat 1:1</a>; <a href=\"#\" onClick=\"return mV('Luk',3,23);\">Luk 3:23</a>; <a href=\"#\" onClick=\"return mV('Jhn',7,42);\">Jhn 7:42</a>). His birth was announced to the shepherds (<a href=\"#\" onClick=\"return mV('Luk',2,'8-20');\">Luk 2:8-20</a>). Wise men from the east came to Bethlehem to see him who was born \"King of the Jews,\" bringing gifts with them (<a href=\"#\" onClick=\"return mV('Mat',2,'1-12');\">Mat 2:1-12</a>). Herod's cruel jealousy led to Joseph's flight into Egypt with Mary and the infant Jesus, where they tarried till the death of this king (<a href=\"#\" onClick=\"return mV('Mat',2,'13-23');\">Mat 2:13-23</a>), when they returned and settled in Nazareth, in Lower Galilee (<a href=\"#\" onClick=\"return mV('Mat',2,23);\">2:23</a>; <a href=\"#\" onClick=\"return mV('Luk',4,16);\">Luk 4:16</a>; <a href=\"#\" onClick=\"return mV('Jhn',1,46);\">Jhn 1:46</a>, etc.). At the age of twelve years he went up to Jerusalem to the Passover with his parents. There, in the temple, \"in the midst of the doctors,\" all that heard him were \"astonished at his understanding and answers\" (<a href=\"#\" onClick=\"return mV('Luk',2,41);\">Luk 2:41</a>, etc.).<br><br>Eighteen years pass, of which we have no record beyond this, that he returned to Nazareth and \"increased in wisdom and stature, and in favour with God and man\" (<a href=\"#\" onClick=\"return mV('Luk',2,52);\">Luk 2:52</a>).<br><br>He entered on his public ministry when he was about thirty years of age. It is generally reckoned to have extended to about three years. \"Each of these years had peculiar features of its own.<br><br>(1.) The first year may be called the year of obscurity, both because the records of it which we possess are very scanty, and because he seems during it to have been only slowly emerging into public notice. It was spent for the most part in Judea.<br><br>(2.) The second year was the year of public favour, during which the country had become thoroughly aware of him; his activity was incessant, and his frame rang through the length and breadth of the land. It was almost wholly passed in Galilee.<br><br>(3.) The third was the year of opposition, when the public favour ebbed away. His enemies multiplied and assailed him with more and more pertinacity, and at last he fell a victim to their hatred. The first six months of this final year were passed in Galilee, and the last six in other parts of the land.\", Stalker's Life of Jesus Christ, p. 45.<br><br>The only reliable sources of information regarding the life of Christ on earth are the Gospels, which present in historical detail the words and the work of Christ in so many different aspects. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000818');\">CHIRST</a>.)";
eastonArray["$$T0002055"] = "<strong>Jether:</strong> surplus; excellence.<br><br>(1.) Father-in-law of Moses (<a href=\"#\" onClick=\"return mV('Exd',4,18);\">Exd 4:18</a> marg.), called elsewhere Jethro (q.v.).<br><br>(2.) The oldest of Gideon's seventy sons (<a href=\"#\" onClick=\"return mV('Jdg',8,20);\">Jdg 8:20</a>).<br><br>(3.) The father of Amasa, David's general (<a href=\"#\" onClick=\"return mV('1Ki',2,5,32);\">1Ki 2:5, 32</a>); called Ithra (<a href=\"#\" onClick=\"return mV('2Sa',17,25);\">2Sa 17:25</a>).<br><br>(4.) <a href=\"#\" onClick=\"return mV('1Ch',7,38);\">1Ch 7:38</a>.<br><br>(5.) <a href=\"#\" onClick=\"return mV('1Ch',2,32);\">1Ch 2:32</a>; one of Judah's posterity.<br><br>(6.) <a href=\"#\" onClick=\"return mV('1Ch',4,17);\">1Ch 4:17</a>.";
eastonArray["$$T0002056"] = "<strong>Jetheth:</strong> a peg, or a prince, one of the Edomitish kings of Mount Seir (<a href=\"#\" onClick=\"return mV('Gen',36,40);\">Gen 36:40</a>).";
eastonArray["$$T0002057"] = "<strong>Jethlah:</strong> suspended; high, a city on the borders of Dan (<a href=\"#\" onClick=\"return mV('Jos',19,42);\">Jos 19:42</a>).";
eastonArray["$$T0002058"] = "<strong>Jethro:</strong> his excellence, or gain, a prince or priest of Midian, who succeeded his father Reuel. Moses spent forty years after his exile from the Egyptian court as keeper of Jethro's flocks. While the Israelites were encamped at Sinai, and soon after their victory over Amalek, Jethro came to meet Moses, bringing with him Zipporah and her two sons. They met at the \"mount of God,\" and \"Moses told him all that the Lord had done unto Pharaoh\" (<a href=\"#\" onClick=\"return mV('Exd',18,8);\">Exd 18:8</a>). On the following day Jethro, observing the multiplicity of the duties devolving on Moses, advised him to appoint subordinate judges, rulers of thousands, of hundreds, of fifties, and of tens, to decide smaller matters, leaving only the weightier matters to be referred to Moses, to be laid before the Lord. This advice Moses adopted (<a href=\"#\" onClick=\"return mV('Exd',18,'1-')\">Exd 18</a>). He was also called Hobab (q.v.), which was probably his personal name, while Jethro was an official name. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002602');\">MOSES</a>.)";
eastonArray["$$T0002059"] = "<strong>Jetur:</strong> an enclosure, one of the twelve sons of Ishmael (<a href=\"#\" onClick=\"return mV('Gen',25,15);\">Gen 25:15</a>).";
eastonArray["$$T0002060"] = "<strong>Jeuel:</strong> snatched away by God, a descendant of Zerah (<a href=\"#\" onClick=\"return mV('1Ch',9,6);\">1Ch 9:6</a>).";
eastonArray["$$T0002061"] = "<strong>Jeush:</strong> assembler.<br><br>(1.) The oldest of Esau's three sons by Aholibamah (<a href=\"#\" onClick=\"return mV('Gen',36,5,14,18);\">Gen 36:5, 14, 18</a>).<br><br>(2.) A son of Bilhan, grandson of Benjamin (<a href=\"#\" onClick=\"return mV('1Ch',7,10);\">1Ch 7:10</a>).<br><br>(3.) A Levite, one of the sons of Shimei (<a href=\"#\" onClick=\"return mV('1Ch',23,10,11);\">1Ch 23:10-11</a>).<br><br>(4.) One of the three sons of Rehoboam (<a href=\"#\" onClick=\"return mV('2Ch',11,19);\">2Ch 11:19</a>).<br><br>(5.) <a href=\"#\" onClick=\"return mV('1Ch',8,39);\">1Ch 8:39</a>.";
eastonArray["$$T0002062"] = "<strong>Jew:</strong> the name derived from the patriarch Judah, at first given to one belonging to the tribe of Judah or to the separate kingdom of Judah (<a href=\"#\" onClick=\"return mV('2Ki',16,6);\">2Ki 16:6</a>; <a href=\"#\" onClick=\"return mV('2Ki',25,25);\">25:25</a>; <a href=\"#\" onClick=\"return mV('Jer',32,12);\">Jer 32:12</a>; <a href=\"#\" onClick=\"return mV('Jer',38,19);\">38:19</a>; <a href=\"#\" onClick=\"return mV('Jer',40,11);\">40:11</a>; <a href=\"#\" onClick=\"return mV('Jer',41,3);\">41:3</a>), in contradistinction from those belonging to the kingdom of the ten tribes, who were called Israelites.<br><br>During the Captivity, and after the Restoration, the name, however, was extended to all the Hebrew nation without distinction (<a href=\"#\" onClick=\"return mV('Est',3,6,10);\">Est 3:6, 10</a>; <a href=\"#\" onClick=\"return mV('Dan',3,8,12);\">Dan 3:8, 12</a>; <a href=\"#\" onClick=\"return mV('Ezr',4,12);\">Ezr 4:12</a>; <a href=\"#\" onClick=\"return mV('Ezr',5,1,5);\">5:1, 5</a>).<br><br>Originally this people were called Hebrews (<a href=\"#\" onClick=\"return mV('Gen',39,14);\">Gen 39:14</a>; <a href=\"#\" onClick=\"return mV('Gen',40,15);\">40:15</a>; <a href=\"#\" onClick=\"return mV('Exd',2,7);\">Exd 2:7</a>; <a href=\"#\" onClick=\"return mV('Exd',3,18);\">3:18</a>; <a href=\"#\" onClick=\"return mV('Exd',5,3);\">5:3</a>; <a href=\"#\" onClick=\"return mV('1Sa',4,6,9);\">1Sa 4:6, 9</a>, etc.), but after the Exile this name fell into disuse. But Paul was styled a Hebrew (<a href=\"#\" onClick=\"return mV('2Cr',11,22);\">2Cr 11:22</a>; <a href=\"#\" onClick=\"return mV('Phl',3,5);\">Phl 3:5</a>).<br><br>The history of the Jewish nation is interwoven with the history of Palestine and with the narratives of the lives of their rulers and chief men. They are now [A.D. 1897] dispersed over all lands, and to this day remain a separate people, \"without a king, and without a prince, and without a sacrifice, and without an image [R.V. 'pillar,' marg. 'obelisk'], and without an ephod, and without teraphim\" (<a href=\"#\" onClick=\"return mV('Hsa',3,4);\">Hsa 3:4</a>). Till about the beginning of the present century [A.D. 1800] they were everywhere greatly oppressed, and often cruelly persecuted; but now their condition is greatly improved, and they are admitted in most European countries to all the rights of free citizens. In 1860 the \"Jewish disabilities\" were removed, and they were admitted to a seat in the British Parliament. Their number in all is estimated at about six millions, about four millions being in Europe.<br><br>There are three names used in the New Testament to designate this people,<br><br>(1.) Jews, as regards their nationality, to distinguish them from Gentiles.<br><br>(2.) Hebrews, with regard to their language and education, to distinguish them from Hellenists, i.e., Jews who spoke the Greek language.<br><br>(3.) Israelites, as respects their sacred privileges as the chosen people of God. \"To other races we owe the splendid inheritance of modern civilization and secular culture; but the religious education of mankind has been the gift of the Jew alone.\"";
eastonArray["$$T0002063"] = "<strong>Jewess:</strong> a woman of Hebrew birth, as Eunice, the mother of Timothy (<a href=\"#\" onClick=\"return mV('Act',16,1);\">Act 16:1</a>; <a href=\"#\" onClick=\"return mV('2Ti',1,5);\">2Ti 1:5</a>), and Drusilla (<a href=\"#\" onClick=\"return mV('Act',24,24);\">Act 24:24</a>), wife of Felix, and daughter of Herod Agrippa I.";
eastonArray["$$T0002064"] = "<strong>Jezebel:</strong> chaste, the daughter of Ethbaal, the king of the Zidonians, and the wife of Ahab, the king of Israel (<a href=\"#\" onClick=\"return mV('1Ki',16,31);\">1Ki 16:31</a>). This was the \"first time that a king of Israel had allied himself by marriage with a heathen princess; and the alliance was in this case of a peculiarly disastrous kind. Jezebel has stamped her name on history as the representative of all that is designing, crafty, malicious, revengeful, and cruel. She is the first great instigator of persecution against the saints of God. Guided by no principle, restrained by no fear of either God or man, passionate in her attachment to her heathen worship, she spared no pains to maintain idolatry around her in all its splendour. Four hundred and fifty prophets ministered under her care to Baal, besides four hundred prophets of the groves [R.V., 'prophets of the Asherah'], which ate at her table (<a href=\"#\" onClick=\"return mV('1Ki',18,19);\">1Ki 18:19</a>). The idolatry, too, was of the most debased and sensual kind.\" Her conduct was in many respects very disastrous to the kingdom both of Israel and Judah (<a href=\"#\" onClick=\"return mV('1Ki',21,'1-29');\">21:1-29</a>). At length she came to an untimely end. As Jehu rode into the gates of Jezreel, she looked out at the window of the palace, and said, \"Had Zimri peace, who slew his master?\" He looked up and called to her chamberlains, who instantly threw her from the window, so that she was dashed in pieces on the street, and his horses trod her under their feet. She was immediately consumed by the dogs of the street (<a href=\"#\" onClick=\"return mV('2Ki',9,'7-37');\">2Ki 9:7-37</a>), according to the word of Elijah the Tishbite (<a href=\"#\" onClick=\"return mV('1Ki',21,19);\">1Ki 21:19</a>).<br><br>Her name afterwards came to be used as the synonym for a wicked woman (<a href=\"#\" onClick=\"return mV('Rev',2,20);\">Rev 2:20</a>).<br><br>It may be noted that she is said to have been the grand-aunt of Dido, the founder of Carthage.";
eastonArray["$$T0002065"] = "<strong>Jeziel:</strong> assembled by God, a son of Azmaveth. He was one of the Benjamite archers who joined David at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,3);\">1Ch 12:3</a>).";
eastonArray["$$T0002066"] = "<strong>Jezreel:</strong> God scatters.<br><br>(1.) A town of Issachar (<a href=\"#\" onClick=\"return mV('Jos',19,18);\">Jos 19:18</a>), where the kings of Israel often resided (<a href=\"#\" onClick=\"return mV('1Ki',18,45);\">1Ki 18:45</a>; <a href=\"#\" onClick=\"return mV('1Ki',21,1);\">21:1</a>; <a href=\"#\" onClick=\"return mV('2Ki',9,30);\">2Ki 9:30</a>). Here Elijah met Ahab, Jehu, and Bidkar; and here Jehu executed his dreadful commission against the house of Ahab (<a href=\"#\" onClick=\"return mV('2Ki',9,'14-37');\">2Ki 9:14-37</a>; <a href=\"#\" onClick=\"return mV('2Ki',10,'1-11');\">10:1-11</a>). It has been identified with the modern Zerin, on the most western point of the range of Gilboa, reaching down into the great and fertile valley of Jezreel, to which it gave its name.<br><br>(2.) A town in Judah (<a href=\"#\" onClick=\"return mV('Jos',15,56);\">Jos 15:56</a>), to the south-east of Hebron. Ahinoam, one of David's wives, probably belonged to this place (<a href=\"#\" onClick=\"return mV('1Sa',27,3);\">1Sa 27:3</a>).<br><br>(3.) A symbolical name given by Hosea to his oldest son (<a href=\"#\" onClick=\"return mV('Hsa',1,4);\">Hsa 1:4</a>), in token of a great slaughter predicted by him, like that which had formerly taken place in the plain of Esdraelon (<a href=\"#\" onClick=\"return mV('Hsa',1,4,5);\">Hsa 1:4-5</a>).";
eastonArray["$$T0002067"] = "<strong>Jezreel, Blood of:</strong> the murder perpetrated here by Ahab and Jehu (<a href=\"#\" onClick=\"return mV('Hsa',1,4);\">Hsa 1:4</a>; <a href=\"#\" onClick=\"return mV('1Ki',18,4);\">1Ki 18:4</a>; <a href=\"#\" onClick=\"return mV('2Ki',9,'6-10');\">2Ki 9:6-10</a>).";
eastonArray["$$T0002068"] = "<strong>Jezreel, Day of:</strong> the time predicted for the execution of vengeance for the deeds of blood committed there (<a href=\"#\" onClick=\"return mV('Hsa',1,5);\">Hsa 1:5</a>).";
eastonArray["$$T0002069"] = "<strong>Jezreel, Ditch of:</strong> (<a href=\"#\" onClick=\"return mV('1Ki',21,23);\">1Ki 21:23</a>; <a href=\"#\" onClick=\"return mV('1Ki',21,13);\">1Ki 21:13</a>), the fortification surrounding the city, outside of which Naboth was executed.";
eastonArray["$$T0002070"] = "<strong>Jezreel, Fountain of:</strong> where Saul encamped before the battle of Gilboa (<a href=\"#\" onClick=\"return mV('1Sa',29,1);\">1Sa 29:1</a>). In the valley under Zerin there are two considerable springs, one of which, perhaps that here referred to, \"flows from under a sort of cavern in the wall of conglomerate rock which here forms the base of Gilboa. The water is excellent; and issuing from crevices in the rocks, it spreads out at once into a fine limpid pool forty or fifty feet in diameter, full of fish\" (Robinson). This may be identical with the \"well of Harod\" (<a href=\"#\" onClick=\"return mV('Jdg',7,1);\">Jdg 7:1</a>; <a href=\"#\" onClick=\"return mV('2Sa',23,25);\">2Sa 23:25</a>), probably the 'Ain Jalud, i.e., the \"spring of Goliath.\"";
eastonArray["$$T0002071"] = "<strong>Jezreel, Portion of:</strong> the field adjoining the city (<a href=\"#\" onClick=\"return mV('2Ki',9,10,21,36-37);\">2Ki 9:10, 21, 36-37</a>). Here Naboth was stoned to death (<a href=\"#\" onClick=\"return mV('1Ki',21,13);\">1Ki 21:13</a>).";
eastonArray["$$T0002072"] = "<strong>Jezreel, Tower of:</strong> one of the turrets which guarded the entrance to the city (<a href=\"#\" onClick=\"return mV('2Ki',9,17);\">2Ki 9:17</a>).";
eastonArray["$$T0002073"] = "<strong>Jezreel, Valley of:</strong> lying on the northern side of the city, between the ridges of Gilboa and Moreh, an offshoot of Esdraelon, running east to the Jordan (<a href=\"#\" onClick=\"return mV('Jos',17,16);\">Jos 17:16</a>; <a href=\"#\" onClick=\"return mV('Jdg',6,33);\">Jdg 6:33</a>; <a href=\"#\" onClick=\"return mV('Hsa',1,5);\">Hsa 1:5</a>). It was the scene of the signal victory gained by the Israelites under Gideon over the Midianites, the Amalekites, and the \"children of the east\" (<a href=\"#\" onClick=\"return mV('Jdg',6,3);\">Jdg 6:3</a>). Two centuries after this the Israelites were here defeated by the Philistines, and Saul and Jonathan, with the flower of the army of Israel, fell (<a href=\"#\" onClick=\"return mV('1Sa',31,'1-6');\">1Sa 31:1-6</a>).<br><br>This name was in after ages extended to the whole of the plain of Esdraelon (q.v.). It was only this plain of Jezreel and that north of Lake Huleh that were then accessible to the chariots of the Canaanites (<a href=\"#\" onClick=\"return mV('2Ki',9,21);\">2Ki 9:21</a>; <a href=\"#\" onClick=\"return mV('2Ki',10,15);\">10:15</a>).";
eastonArray["$$T0002074"] = "<strong>Joab:</strong> Jehovah is his father.<br><br>(1.) One of the three sons of Zeruiah, David's sister, and \"captain of the host\" during the whole of David's reign (<a href=\"#\" onClick=\"return mV('2Sa',2,13);\">2Sa 2:13</a>; <a href=\"#\" onClick=\"return mV('2Sa',10,7);\">10:7</a>; <a href=\"#\" onClick=\"return mV('2Sa',11,1);\">11:1</a>; <a href=\"#\" onClick=\"return mV('1Ki',11,15);\">1Ki 11:15</a>). His father's name is nowhere mentioned, although his sepulchre at Bethlehem is mentioned (<a href=\"#\" onClick=\"return mV('2Sa',2,32);\">2Sa 2:32</a>). His two brothers were Abishai and Asahel, the swift of foot, who was killed by Abner (<a href=\"#\" onClick=\"return mV('2Sa',2,'13-32');\">2Sa 2:13-32</a>), whom Joab afterwards treacherously murdered (<a href=\"#\" onClick=\"return mV('2Sa',3,'22-27');\">3:22-27</a>). He afterwards led the assault at the storming of the fortress on Mount Zion, and for this service was raised to the rank of \"prince of the king's army\" (<a href=\"#\" onClick=\"return mV('2Sa',5,'6-10');\">2Sa 5:6-10</a>; <a href=\"#\" onClick=\"return mV('1Ch',27,34);\">1Ch 27:34</a>). His chief military achievements were,<br><br>(1) against the allied forces of Syria and Ammon;<br><br>(2) against Edom (<a href=\"#\" onClick=\"return mV('1Ki',11,15,16);\">1Ki 11:15-16</a>); and<br><br>(3) against the Ammonites (<a href=\"#\" onClick=\"return mV('2Sa',10,'7-19');\">2Sa 10:7-19</a>; <a href=\"#\" onClick=\"return mV('2Sa',11,1,11);\">11:1, 11</a>). His character is deeply stained by the part he willingly took in the murder of Uriah (<a href=\"#\" onClick=\"return mV('2Sa',11,'14-25');\">11:14-25</a>). He acted apparently from a sense of duty in putting Absalom to death (<a href=\"#\" onClick=\"return mV('2Sa',18,'1-14');\">18:1</a>). David was unmindful of the many services Joab had rendered to him, and afterwards gave the command of the army to Amasa, Joab's cousin (<a href=\"#\" onClick=\"return mV('2Sa',20,'1-13');\">2Sa 20:1-13</a>; <a href=\"#\" onClick=\"return mV('2Sa',19,13);\">12Sa 9:13</a>). When David was dying Joab espoused the cause of Adonijah in preference to that of Solomon. He was afterwards slain by Benaiah, by the command of Solomon, in accordance with his father's injunction (<a href=\"#\" onClick=\"return mV('2Sa',3,29);\">2Sa 3:29</a>; <a href=\"#\" onClick=\"return mV('2Sa',20,'5-13');\">20:5-13</a>), at the altar to which he had fled for refuge. Thus this hoary conspirator died without one to lift up a voice in his favour. He was buried in his own property in the \"wilderness,\" probably in the north-east of Jerusalem (<a href=\"#\" onClick=\"return mV('1Ki',2,5,'28-34');\">1Ki 2:5, 28-34</a>). Benaiah succeeded him as commander-in-chief of the army.<br><br>(2.) <a href=\"#\" onClick=\"return mV('1Ch',4,14);\">1Ch 4:14</a>.<br><br>(3.) <a href=\"#\" onClick=\"return mV('Ezr',2,6);\">Ezr 2:6</a>.";
eastonArray["$$T0002075"] = "<strong>Joah:</strong> Jehovah his brother; i.e., helper.<br><br>(1.) One of the sons of Obed-edom (<a href=\"#\" onClick=\"return mV('1Ch',26,4);\">1Ch 26:4</a>), a Korhite porter.<br><br>(2.) A Levite of the family of Gershom (<a href=\"#\" onClick=\"return mV('1Ch',6,21);\">1Ch 6:21</a>), probably the same as Ethan (<a href=\"#\" onClick=\"return mV('1Ch',6,42);\">42</a>).<br><br>(3.) The son of Asaph, and \"recorder\" (q.v.) or chronicler to King Hezekiah (<a href=\"#\" onClick=\"return mV('2Ki',18,18,26,37);\">2Ki 18:18, 26, 37</a>).<br><br>(4.) Son of Joahaz, and \"recorder\" (q.v.) or keeper of the state archives under King Josiah (<a href=\"#\" onClick=\"return mV('2Ch',34,8);\">2Ch 34:8</a>).";
eastonArray["$$T0002076"] = "<strong>Joahaz:</strong> (<a href=\"#\" onClick=\"return mV('2Ch',34,8);\">2Ch 34:8</a>), a contracted form of Jehoahaz (q.v.).";
eastonArray["$$T0002077"] = "<strong>Joanna:</strong> whom Jehovah has graciously given.<br><br>(1.) The grandson of Zerubbabel, in the lineage of Christ (<a href=\"#\" onClick=\"return mV('Luk',3,27);\">Luk 3:27</a>); the same as Hananiah (<a href=\"#\" onClick=\"return mV('1Ch',3,19);\">1Ch 3:19</a>).<br><br>(2.) The wife of Chuza, the steward of Herod Antipas, tetrarch of Galilee (<a href=\"#\" onClick=\"return mV('Luk',8,3);\">Luk 8:3</a>). She was one of the women who ministered to our Lord, and to whom he appeared after his resurrection (<a href=\"#\" onClick=\"return mV('Luk',8,3);\">Luk 8:3</a>; <a href=\"#\" onClick=\"return mV('Luk',24,10);\">24:10</a>).";
eastonArray["$$T0002078"] = "<strong>Joash:</strong> whom Jehovah bestowed.<br><br>(1.) A contracted form of Jehoash, the father of Gideon (<a href=\"#\" onClick=\"return mV('Jdg',6,11,29);\">Jdg 6:11, 29</a>; <a href=\"#\" onClick=\"return mV('Jdg',8,13,29,32);\">8:13, 29, 32</a>).<br><br>(2.) One of the Benjamite archers who joined David at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,3);\">1Ch 12:3</a>).<br><br>(3.) One of King Ahab's sons (<a href=\"#\" onClick=\"return mV('1Ki',22,26);\">1Ki 22:26</a>).<br><br>(4.) King of Judah (<a href=\"#\" onClick=\"return mV('2Ki',11,2);\">2Ki 11:2</a>; <a href=\"#\" onClick=\"return mV('2Ki',12,19,20);\">12:19-20</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002005');\">JEHOASH [1]</a>.)<br><br>(5.) King of Israel (<a href=\"#\" onClick=\"return mV('2Ki',13,9,12,13,25);\">2Ki 13:9, 12-13, 25</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002005');\">JEHOASH [2]</a>.)<br><br>(6.) <a href=\"#\" onClick=\"return mV('1Ch',7,8);\">1Ch 7:8</a>.<br><br>(7.) One who had charge of the royal stores of oil under David and Solomon (<a href=\"#\" onClick=\"return mV('1Ch',27,28);\">1Ch 27:28</a>).";
eastonArray["$$T0002079"] = "<strong>Job:</strong> persecuted, an Arabian patriarch who resided in the land of Uz (q.v.). While living in the midst of great prosperity, he was suddenly overwhelmed by a series of sore trials that fell upon him. Amid all his sufferings he maintained his integrity. Once more God visited him with the rich tokens of his goodness and even greater prosperity than he had enjoyed before. He survived the period of trial for one hundred and forty years, and died in a good old age, an example to succeeding generations of integrity (<a href=\"#\" onClick=\"return mV('Eze',14,14,20);\">Eze 14:14, 20</a>) and of submissive patience under the sorest calamities (<a href=\"#\" onClick=\"return mV('Jam',5,11);\">Jam 5:11</a>). His history, so far as it is known, is recorded in his book.";
eastonArray["$$T0002080"] = "<strong>Jobab:</strong> dweller in the desert.<br><br>(1.) One of the sons of Joktan, and founder of an Arabian tribe (<a href=\"#\" onClick=\"return mV('Gen',10,29);\">Gen 10:29</a>).<br><br>(2.) King of Edom, succeeded Bela (<a href=\"#\" onClick=\"return mV('Gen',36,33,34);\">Gen 36:33-34</a>).<br><br>(3.) A Canaanitish king (<a href=\"#\" onClick=\"return mV('Jos',11,1);\">Jos 11:1</a>) who joined the confederacy against Joshua.";
eastonArray["$$T0002081"] = "<strong>Job, Book of:</strong> A great diversity of opinion exists as to the authorship of this book. From internal evidence, such as the similarity of sentiment and language to those in the Psalms and Proverbs (see <a href=\"#\" onClick=\"return mV('Psa',88,'1-');\">Psa 88</a> and <a href=\"#\" onClick=\"return mV('Psa',89,'1-');\">89</a>), the prevalence of the idea of \"wisdom,\" and the style and character of the composition, it is supposed by some to have been written in the time of David and Solomon. Others argue that it was written by Job himself, or by Elihu, or Isaiah, or perhaps more probably by Moses, who was \"learned in all the wisdom of the Egyptians, and mighty in words and deeds\" (<a href=\"#\" onClick=\"return mV('Act',7,22);\">Act 7:22</a>). He had opportunities in Midian for obtaining the knowledge of the facts related. But the authorship is altogether uncertain.<br><br>As to the character of the book, it is a historical poem, one of the greatest and sublimest poems in all literature. Job was a historical person, and the localities and names were real and not fictious. It is \"one of the grandest portions of the inspired Scriptures, a heavenly-repleished storehouse of comfort and instruction, the patriarchal Bible, and a precious monument of primitive theology. It is to the Old Testament what the Epistle to the Romans is to the New.\" It is a didactic narrative in a dramatic form.<br><br>This book was apparently well known in the days of Ezekiel, B.C. 600 (<a href=\"#\" onClick=\"return mV('Eze',14,14);\">Eze 14:14</a>). It formed a part of the sacred Scriptures used by our Lord and his apostles, and is referred to as a part of the inspired Word (<a href=\"#\" onClick=\"return mV('Hbr',12,5);\">Hbr 12:5</a>; <a href=\"#\" onClick=\"return mV('1Cr',3,19);\">1Cr 3:19</a>).<br><br>The subject of the book is the trial of Job, its occasion, nature, endurance, and issue. It exhibits the harmony of the truths of revelation and the dealings of Providence, which are seen to be at once inscrutable, just, and merciful. It shows the blessedness of the truly pious, even amid sore afflictions, and thus ministers comfort and hope to tried believers of every age. It is a book of manifold instruction, and is profitable for doctrine, for reproof, for correction, and for instruction in righteousness (<a href=\"#\" onClick=\"return mV('2Ti',3,16);\">2Ti 3:16</a>).<br><br>It consists of,<br><br><br><br>(1.) An historical introduction in prose (Job 1,2).<br><br>(2.) The controversy and its solution, in poetry (<a href=\"#\" onClick=\"return mV('Job',3,'1-')\">Job 3-42:6</a>).<br><br>Job's desponding lamentation (<a href=\"#\" onClick=\"return mV('Job',3,'1-')\">Job 3</a>) is the occasion of the controversy which is carried on in three courses of dialogues between Job and his three friends. The first course gives the commencement of the controversy (<a href=\"#\" onClick=\"return mV('Job',4,'1-')\">Job 4-14</a>); the second the growth of the controversy (<a href=\"#\" onClick=\"return mV('Job',15,'1-')\">Job 15-21</a>); and the third the height of the controversy (<a href=\"#\" onClick=\"return mV('Job',22,'1-')\">Job 22-27</a>). This is followed by the solution of the controversy in the speeches of Elihu and the address of Jehovah, followed by Job's humble confession (<a href=\"#\" onClick=\"return mV('Job',42,'1-6');\">Job 42:1-6</a>) of his own fault and folly.<br><br>(3.) The third division is the historical conclusion, in prose (<a href=\"#\" onClick=\"return mV('Job',42,'7-15');\">Job 42:7-15</a>).<br><br>Sir J. W. Dawson in \"The Expositor\" says: \"It would now seem that the language and theology of the book of Job can be better explained by supposing it to be a portion of Minean [Southern Arabia] literature obtained by Moses in Midian than in any other way. This view also agrees better than any other with its references to natural objects, the art of mining, and other matters.\"";
eastonArray["$$T0002082"] = "<strong>Jochebed:</strong> Jehovah is her glory, the wife of Amram, and the mother of Miriam, Aaron, and Moses (<a href=\"#\" onClick=\"return mV('Num',26,59);\">Num 26:59</a>). She is spoken of as the sister of Kohath, Amram's father (<a href=\"#\" onClick=\"return mV('Exd',6,20);\">Exd 6:20</a>; comp. <a href=\"#\" onClick=\"return mV('Exd',6,16,18);\">16, 18</a>; <a href=\"#\" onClick=\"return mV('Exd',2,'1-10');\">2:1-10</a>).";
eastonArray["$$T0002083"] = "<strong>Joel:</strong> Jehovah is his God.<br><br>(1.) The oldest of Samuel's two sons appointed by him as judges in Beersheba (<a href=\"#\" onClick=\"return mV('1Sa',8,2);\">1Sa 8:2</a>).<br><br>(2.) A descendant of Reuben (<a href=\"#\" onClick=\"return mV('1Ch',5,4,8);\">1Ch 5:4, 8</a>).<br><br>(3.) One of David's famous warriors (<a href=\"#\" onClick=\"return mV('1Ch',11,38);\">1Ch 11:38</a>).<br><br>(4.) A Levite of the family of Gershom (<a href=\"#\" onClick=\"return mV('1Ch',15,7,11);\">1Ch 15:7, 11</a>).<br><br>(5.) <a href=\"#\" onClick=\"return mV('1Ch',7,3);\">1Ch 7:3</a>.<br><br>(6.) <a href=\"#\" onClick=\"return mV('1Ch',27,20);\">1Ch 27:20</a>.<br><br>(7.) The second of the twelve minor prophets. He was the son of Pethuel. His personal history is only known from his book.";
eastonArray["$$T0002084"] = "<strong>Joelah:</strong> a Benjamite who joined David at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,7);\">1Ch 12:7</a>).";
eastonArray["$$T0002085"] = "<strong>Joel, Book of:</strong> Joel was probably a resident in Judah, as his commission was to that people. He makes frequent mention of Judah and Jerusalem (<a href=\"#\" onClick=\"return mV('Joe',1,14);\">Joe 1:14</a>; <a href=\"#\" onClick=\"return mV('Joe',2,1,15,32);\">2:1, 15, 32</a>; <a href=\"#\" onClick=\"return mV('Joe',3,1,12,17,20,21);\">3:1, 12, 17, 20-21</a>).<br><br>He probably flourished in the reign of Uzziah (about B.C. 800), and was contemporary with Amos and Isaiah.<br><br>The contents of this book are,<br><br>(1.) A prophecy of a great public calamity then impending over the land, consisting of a want of water and an extraordinary plague of locusts (<a href=\"#\" onClick=\"return mV('Joe',1,'1-');\">Joe 1</a>; <a href=\"#\" onClick=\"return mV('Joe',2,'1-11');\">2:1-11</a>).<br><br>(2.) The prophet then calls on his countrymen to repent and to turn to God, assuring them of his readiness to forgive (<a href=\"#\" onClick=\"return mV('Joe',2,'12-17');\">Joe 2:12-17</a>), and foretelling the restoration of the land to its accustomed fruitfulness (<a href=\"#\" onClick=\"return mV('Joe',2,'18-26');\">Joe 2:18-26</a>).<br><br>(3.) Then follows a Messianic prophecy, quoted by Peter (<a href=\"#\" onClick=\"return mV('Act',2,39);\">Act 2:39</a>).<br><br>(4.) Finally, the prophet foretells portents and judgments as destined to fall on the enemies of God (<a href=\"#\" onClick=\"return mV('Joe',3,'1-');\">Joe 3</a>, but in the Hebrew text 4).";
eastonArray["$$T0002086"] = "<strong>Joezer:</strong> Jehovah is his help, one of the Korhites who became part of David's body-guard (<a href=\"#\" onClick=\"return mV('1Ch',12,6);\">1Ch 12:6</a>).";
eastonArray["$$T0002087"] = "<strong>Johanan:</strong> whom Jehovah graciously bestows.<br><br>(1.) One of the Gadite heroes who joined David in the desert of Judah (<a href=\"#\" onClick=\"return mV('1Ch',12,12);\">1Ch 12:12</a>).<br><br>(2.) The oldest of King Josiah's sons (<a href=\"#\" onClick=\"return mV('1Ch',3,15);\">1Ch 3:15</a>).<br><br>(3.) Son of Careah, one of the Jewish chiefs who rallied round Gedaliah, whom Nebuchadnezzar had made governor in Jerusalem (<a href=\"#\" onClick=\"return mV('2Ki',25,23);\">2Ki 25:23</a>; <a href=\"#\" onClick=\"return mV('Jer',40,8);\">Jer 40:8</a>). He warned Gedaliah of the plans of Ishmael against him, a warning which was unheeded (<a href=\"#\" onClick=\"return mV('Jer',40,13,16);\">Jer 40:13, 16</a>). He afterwards pursued the murderer of the governor, and rescued the captives (<a href=\"#\" onClick=\"return mV('Jer',41,8,13,15,16);\">41:8, 13, 15-16</a>). He and his associates subsequently fled to Tahpanhes in Egypt (<a href=\"#\" onClick=\"return mV('Jer',43,2,4,5);\">43:2, 4-5</a>), taking Jeremiah with them. \"The flight of Gedaliah's community to Egypt extinguished the last remaining spark of life in the Jewish state. The work of the ten centuries since Joshua crossed the Jordan had been undone.\"";
eastonArray["$$T0002088"] = "<strong>John:</strong><br><br>(1.) One who, with Annas and Caiaphas, sat in judgment on the apostles Peter and John (<a href=\"#\" onClick=\"return mV('Act',4,6);\">Act 4:6</a>). He was of the kindred of the high priest; otherwise unknown.<br><br>(2.) The Hebrew name of Mark (q.v.). He is designated by this name in the acts of the Apostles (<a href=\"#\" onClick=\"return mV('Act',12,12,25);\">Act 12:12, 25</a>; <a href=\"#\" onClick=\"return mV('Act',13,5,13);\">13:5, 13</a>; <a href=\"#\" onClick=\"return mV('Act',15,37);\">15:37</a>).<br><br>(3.) THE APOSTLE, brother of James the \"Greater\" (<a href=\"#\" onClick=\"return mV('Mat',4,21);\">Mat 4:21</a>; <a href=\"#\" onClick=\"return mV('Mat',10,2);\">10:2</a>; <a href=\"#\" onClick=\"return mV('Mar',1,19);\">Mar 1:19</a>; <a href=\"#\" onClick=\"return mV('Mar',3,17);\">3:17</a>; <a href=\"#\" onClick=\"return mV('Mar',10,35);\">10:35</a>). He was one, probably the younger, of the sons of Zebedee (<a href=\"#\" onClick=\"return mV('Mat',4,21);\">Mat 4:21</a>) and Salome (<a href=\"#\" onClick=\"return mV('Mat',27,56);\">Mat 27:56</a>; <a href=\"#\" onClick=\"return mV('Mar',15,40);\">Mar 15:40</a>), and was born at Bethsaida. His father was apparently a man of some wealth (<a href=\"#\" onClick=\"return mV('Mar',1,20);\">Mar 1:20</a>; <a href=\"#\" onClick=\"return mV('Luk',5,3);\">Luk 5:3</a>; <a href=\"#\" onClick=\"return mV('Jhn',19,27);\">Jhn 19:27</a>). He was doubtless trained in all that constituted the ordinary education of Jewish youth. When he grew up he followed the occupation of a fisherman on the Lake of Galilee. When John the Baptist began his ministry in the wilderness of Judea, John, with many others, gathered round him, and was deeply influenced by his teaching. There he heard the announcement, \"Behold the Lamb of God,\" and forthwith, on the invitation of Jesus, became a disciple and ranked among his followers (<a href=\"#\" onClick=\"return mV('Jhn',1,36,37);\">Jhn 1:36-37</a>) for a time. He and his brother then returned to their former avocation, for how long is uncertain. Jesus again called them (<a href=\"#\" onClick=\"return mV('Mat',4,21);\">Mat 4:21</a>; <a href=\"#\" onClick=\"return mV('Luk',5,'1-11');\">Luk 5:1-11</a>), and now they left all and permanently attached themselves to the company of his disciples. He became one of the innermost circle (<a href=\"#\" onClick=\"return mV('Mar',5,37);\">Mar 5:37</a>; <a href=\"#\" onClick=\"return mV('Mat',17,1);\">Mat 17:1</a>; <a href=\"#\" onClick=\"return mV('Mat',26,37);\">26:37</a>; <a href=\"#\" onClick=\"return mV('Mar',13,3);\">Mar 13:3</a>). He was the disciple whom Jesus loved. In zeal and intensity of character he was a \"Boanerges\" (<a href=\"#\" onClick=\"return mV('Mar',3,17);\">Mar 3:17</a>). This spirit once and again broke out (<a href=\"#\" onClick=\"return mV('Mat',20,'20-24');\">Mat 20:20-24</a>; <a href=\"#\" onClick=\"return mV('Mar',10,'35-41');\">Mar 10:35-41</a>; <a href=\"#\" onClick=\"return mV('Luk',9,49,54);\">Luk 9:49, 54</a>). At the betrayal he and Peter follow Christ afar off, while the others betake themselves to hasty flight (<a href=\"#\" onClick=\"return mV('Jhn',18,15);\">Jhn 18:15</a>). At the trial he follows Christ into the council chamber, and thence to the praetorium (<a href=\"#\" onClick=\"return mV('Jhn',18,16,19,28);\">18:16, 19, 28</a>) and to the place of crucifixion (<a href=\"#\" onClick=\"return mV('Jhn',19,26,27);\">19:26-27). To him and Peter, Mary first conveys tidings of the resurrection (<a href=\"#\" onClick=\"return mV('Jhn',20,2);\">20:2</a>), and they are the first to go and see what her strange words mean. After the resurrection he and Peter again return to the Sea of Galilee, where the Lord reveals himself to them (<a href=\"#\" onClick=\"return mV('Jhn',21,1,7);\">21:1, 7). We find Peter and John frequently after this together (<a href=\"#\" onClick=\"return mV('Act',3,1);\">Act 3:1</a>; <a href=\"#\" onClick=\"return mV('Act',4,13);\">4:13</a>). John remained apparently in Jerusalem as the leader of the church there (<a href=\"#\" onClick=\"return mV('Act',15,6);\">Act 15:6</a>; <a href=\"#\" onClick=\"return mV('Gal',2,9);\">Gal 2:9</a>). His subsequent history is unrecorded. He was not there, however, at the time of Paul's last visit (<a href=\"#\" onClick=\"return mV('Act',21,'15-40');\">Act 21:15-40</a>). He appears to have retired to Ephesus, but at what time is unknown. The seven churches of Asia were the objects of his special care (<a href=\"#\" onClick=\"return mV('Rev',1,11);\">Rev 1:11</a>). He suffered under persecution, and was banished to Patmos (<a href=\"#\" onClick=\"return mV('Rev',1,9);\">1:9</a>); whence he again returned to Ephesus, where he died, probably about A.D. 98, having outlived all or nearly all the friends and companions even of his maturer years. There are many interesting traditions regarding John during his residence at Ephesus, but these cannot claim the character of historical truth.";
eastonArray["$$T0002089"] = "<strong>John, First Epistle of:</strong> the fourth of the catholic or \"general\" epistles. It was evidently written by John the evangelist, and probably also at Ephesus, and when the writer was in advanced age. The purpose of the apostle (<a href=\"#\" onClick=\"return mV('1Jo',1,'1-4');\">1Jo 1:1) is to declare the Word of Life to those to whom he writes, in order that they might be united in fellowship with the Father and his Son Jesus Christ. He shows that the means of union with God are, (1) on the part of Christ, his atoning work (<a href=\"#\" onClick=\"return mV('1Jo',1,7);\">1Jo 1:7</a>; <a href=\"#\" onClick=\"return mV('1Jo',2,2);\">2:2</a>; <a href=\"#\" onClick=\"return mV('1Jo',3,5);\">3:5</a>; <a href=\"#\" onClick=\"return mV('1Jo',4,10,14);\">4:10, 14</a>; <a href=\"#\" onClick=\"return mV('1Jo',5,11,12);\">5:11-12</a>) and his advocacy (<a href=\"#\" onClick=\"return mV('1Jo',2,1);\">1Jo 2:1</a>); and (2), on the part of man, holiness (<a href=\"#\" onClick=\"return mV('1Jo',1,6);\">1Jo 1:6</a>), obedience (<a href=\"#\" onClick=\"return mV('1Jo',2,3);\">1Jo 2:3</a>), purity (<a href=\"#\" onClick=\"return mV('1Jo',3,3);\">1Jo 3:3</a>), faith (<a href=\"#\" onClick=\"return mV('1Jo',3,23);\">1Jo 3:23</a>; <a href=\"#\" onClick=\"return mV('1Jo',4,3);\">4:3</a>; <a href=\"#\" onClick=\"return mV('1Jo',5,5);\">5:5</a>), and love (<a href=\"#\" onClick=\"return mV('1Jo',2,7,8);\">1Jo 2:7-8</a>; <a href=\"#\" onClick=\"return mV('1Jo',3,14);\">3:14</a>; <a href=\"#\" onClick=\"return mV('1Jo',4,7);\">4:7</a>; <a href=\"#\" onClick=\"return mV('1Jo',5,1);\">5:1</a>).";
eastonArray["$$T0002090"] = "<strong>John, Gospel of:</strong> The genuineness of this Gospel, i.e., the fact that the apostle John was its author, is beyond all reasonable doubt. In recent times, from about 1820, many attempts have been made to impugn its genuineness, but without success.<br><br>The design of John in writing this Gospel is stated by himself (<a href=\"#\" onClick=\"return mV('Jhn',20,31);\">Jhn 20:31</a>). It was at one time supposed that he wrote for the purpose of supplying the omissions of the synoptical, i.e., of the first three, Gospels, but there is no evidence for this. \"There is here no history of Jesus and his teaching after the manner of the other evangelists. But there is in historical form a representation of the Christian faith in relation to the person of Christ as its central point; and in this representation there is a picture on the one hand of the antagonism of the world to the truth revealed in him, and on the other of the spiritual blessedness of the few who yield themselves to him as the Light of life\" (Reuss).<br><br>After the prologue (<a href=\"#\" onClick=\"return mV('Jhn',1,'1-7');\">Jhn 1:1-7</a>), the historical part of the book begins with verse <a href=\"#\" onClick=\"return mV('Jhn',1,6);\">6</a>, and consists of two parts. The first part (<a href=\"#\" onClick=\"return mV('Jhn',1,'6-');\">Jhn 1:6-ch. 12</a>) contains the history of our Lord's public ministry from the time of his introduction to it by John the Baptist to its close. The second part (<a href=\"#\" onClick=\"return mV('Jhn',13,'1-');\">Jhn 13-21</a>) presents our Lord in the retirement of private life and in his intercourse with his immediate followers (<a href=\"#\" onClick=\"return mV('Jhn',13,'1-');\">Jhn 13-17</a>), and gives an account of his sufferings and of his appearances to the disciples after his resurrection (J<a href=\"#\" onClick=\"return mV('Jhn',18,'1-');\">Jhn 18-21</a>).<br><br>The peculiarities of this Gospel are the place it gives (1) to the mystical relation of the Son to the Father, and (2) of the Redeemer to believers; (3) the announcement of the Holy Ghost as the Comforter; (4) the prominence given to love as an element in the Christian character. It was obviously addressed primarily to Christians.<br><br>It was probably written at Ephesus, which, after the destruction of Jerusalem (A.D. 70), became the centre of Christian life and activity in the East, about A.D. 90.";
eastonArray["$$T0002091"] = "<strong>John, Second Epistle of:</strong> is addressed to \"the elect lady,\" and closes with the words, \"The children of thy elect sister greet thee;\" but some would read instead of \"lady\" the proper name Kyria. Of the thirteen verses composing this epistle seven are in the First Epistle. The person addressed is commended for her piety, and is warned against false teachers.";
eastonArray["$$T0002092"] = "<strong>John the Baptist:</strong> the \"forerunner of our Lord.\" We have but fragmentary and imperfect accounts of him in the Gospels. He was of priestly descent. His father, Zacharias, was a priest of the course of Abia (<a href=\"#\" onClick=\"return mV('1Ch',24,10);\">1Ch 24:10</a>), and his mother, Elisabeth, was of the daughters of Aaron (<a href=\"#\" onClick=\"return mV('Luk',1,5);\">Luk 1:5</a>). The mission of John was the subject of prophecy (<a href=\"#\" onClick=\"return mV('Mat',3,3);\">Mat 3:3</a>; <a href=\"#\" onClick=\"return mV('Isa',40,3);\">Isa 40:3</a>; <a href=\"#\" onClick=\"return mV('Mal',3,1);\">Mal 3:1</a>). His birth, which took place six months before that of Jesus, was foretold by an angel. Zacharias, deprived of the power of speech as a token of God's truth and a reproof of his own incredulity with reference to the birth of his son, had the power of speech restored to him on the occasion of his circumcision (<a href=\"#\" onClick=\"return mV('Luk',1,64);\">Luk 1:64</a>). After this no more is recorded of him for thirty years than what is mentioned in <a href=\"#\" onClick=\"return mV('Luk',1,80);\">Luk 1:80</a>. John was a Nazarite from his birth (<a href=\"#\" onClick=\"return mV('Luk',1,15);\">Luk 1:15</a>; <a href=\"#\" onClick=\"return mV('Num',6,'1-12');\">Num 6:1</a>). He spent his early years in the mountainous tract of Judah lying between Jerusalem and the Dead Sea (<a href=\"#\" onClick=\"return mV('Mat',3,'1-12');\">Mat 3:1</a>).<br><br>At length he came forth into public life, and great multitudes from \"every quarter\" were attracted to him. The sum of his preaching was the necessity of repentance. He denounced the Sadducees and Pharisees as a \"generation of vipers,\" and warned them of the folly of trusting to external privileges (<a href=\"#\" onClick=\"return mV('Luk',3,8);\">Luk 3:8</a>). \"As a preacher, John was eminently practical and discriminating. Self-love and covetousness were the prevalent sins of the people at large. On them, therefore, he enjoined charity and consideration for others. The publicans he cautioned against extortion, the soldiers against crime and plunder.\" His doctrine and manner of life roused the entire south of Palestine, and the people from all parts flocked to the place where he was, on the banks of the Jordan. There he baptized thousands unto repentance.<br><br>The fame of John reached the ears of Jesus in Nazareth (<a href=\"#\" onClick=\"return mV('Mat',3,5);\">Mat 3:5</a>), and he came from Galilee to Jordan to be baptized of John, on the special ground that it became him to \"fulfil all righteousness\" (<a href=\"#\" onClick=\"return mV('Mat',3,15);\">Mat 3:15</a>). John's special office ceased with the baptism of Jesus, who must now \"increase\" as the King come to his kingdom. He continued, however, for a while to bear testimony to the Messiahship of Jesus. He pointed him out to his disciples, saying, \"Behold the Lamb of God.\" His public ministry was suddenly (after about six months probably) brought to a close by his being cast into prison by Herod, whom he had reproved for the sin of having taken to himself the wife of his brother Philip (<a href=\"#\" onClick=\"return mV('Luk',3,19);\">Luk 3:19</a>). He was shut up in the castle of Machaerus (q.v.), a fortress on the southern extremity of Peraea, 9 miles east of the Dead Sea, and here he was beheaded. His disciples, having consigned the headless body to the grave, went and told Jesus all that had occurred (<a href=\"#\" onClick=\"return mV('Mat',14,'3-12');\">Mat 14:3-12
</a>). John's death occurred apparently just before the third Passover of our Lord's ministry. Our Lord himself testified regarding him that he was a \"burning and a shining light\" (<a href=\"#\" onClick=\"return mV('Jhn',5,35);\">Jhn 5:35</a>).";
eastonArray["$$T0002093"] = "<strong>John, Third Epistle of:</strong> is addressed to Caius, or Gaius, but whether to the Christian of that name in Macedonia (<a href=\"#\" onClick=\"return mV('Act',19,29);\">Act 19:29</a>) or in Corinth (<a href=\"#\" onClick=\"return mV('Rom',16,23);\">Rom 16:23</a>) or in Derbe (<a href=\"#\" onClick=\"return mV('Act',20,4);\">Act 20:4</a>) is uncertain. It was written for the purpose of commending to Gaius some Christians who were strangers in the place where he lived, and who had gone thither for the purpose of preaching the gospel (<a href=\"#\" onClick=\"return mV('3Jo',1,7);\">3Jo 1:7</a>).<br><br>The Second and Third Epistles were probably written soon after the First, and from Ephesus.";
eastonArray["$$T0002094"] = "<strong>Joiada:</strong> (whom Jehovah favours) = Jehoiada.<br><br>(1.) <a href=\"#\" onClick=\"return mV('Neh',3,6);\">Neh 3:6</a>.<br><br>(2.) One of the high priests (<a href=\"#\" onClick=\"return mV('Neh',12,10,11,22);\">Neh 12:10-11, 22</a>).";
eastonArray["$$T0002095"] = "<strong>Joiakim:</strong> (whom Jehovah has set up) = Jehoiakim, a high priest, the son and successor of Jeshua (<a href=\"#\" onClick=\"return mV('Neh',12,10,12,26);\">Neh 12:10,12,26</a>).";
eastonArray["$$T0002096"] = "<strong>Joiarib:</strong> (whom Jehovah defends) = Jehoiarib.<br><br>(1.) The founder of one of the courses of the priests (<a href=\"#\" onClick=\"return mV('Neh',11,10);\">Neh 11:10</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('Neh',11,5);\">Neh 11:5</a>; a descendant of Judah.<br><br>(3.) <a href=\"#\" onClick=\"return mV('Neh',12,6);\">Neh 12:6</a>.<br><br>(4.) <a href=\"#\" onClick=\"return mV('Ezr',8,16);\">Ezr 8:16</a>, a \"man of understanding\" whom Ezra sent to \"bring ministers for the house of God.\"";
eastonArray["$$T0002097"] = "<strong>Jokdeam:</strong> a city in the mountains of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,56);\">Jos 15:56</a>).";
eastonArray["$$T0002098"] = "<strong>Jokim:</strong> whom Jehovah has set up, one of the descendants of Shelah (<a href=\"#\" onClick=\"return mV('1Ch',4,22);\">1Ch 4:22</a>).";
eastonArray["$$T0002099"] = "<strong>Jokmeam:</strong> gathering of the people, a city of Ephraim, which was given with its suburbs to the Levites (<a href=\"#\" onClick=\"return mV('1Ch',6,68);\">1Ch 6:68</a>). It lay somewhere in the Jordan valley (<a href=\"#\" onClick=\"return mV('1Ki',4,12);\">1Ki 4:12</a>, R.V.; but in A.V. incorrectly \"Jokneam\").";
</script>
