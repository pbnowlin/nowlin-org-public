<script>var eastonArray = new Array ();
eastonArray["$$T0001950"] = "<strong>Jagur:</strong> place of sojourn, a city on the southern border of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,21);\">Jos 15:21</a>).";
eastonArray["$$T0001951"] = "<strong>Jah:</strong> a contraction for Jehovah (<a href=\"#\" onClick=\"return mV('Psa',68,4);\">Psa 68:4</a>).";
eastonArray["$$T0001952"] = "<strong>Jahath:</strong> union.<br><br>(1.) A son of Shimei, and grandson of Gershom (<a href=\"#\" onClick=\"return mV('1Ch',23,10);\">1Ch 23:10</a>).<br><br>(2.) One of the sons of Shelomoth, of the family of Kohath (<a href=\"#\" onClick=\"return mV('1Ch',24,22);\">1Ch 24:22</a>).<br><br>(3.) A Levite of the family of Merari, one of the overseers of the repairs of the temple under Josiah (<a href=\"#\" onClick=\"return mV('2Ch',34,12);\">2Ch 34:12</a>).";
eastonArray["$$T0001953"] = "<strong>Jahaz:</strong> trodden down (<a href=\"#\" onClick=\"return mV('Jos',13,18);\">Jos 13:18</a>; <a href=\"#\" onClick=\"return mV('Jos',21,36);\">21:36</a>; <a href=\"#\" onClick=\"return mV('1Ch',6,78);\">1Ch 6:78</a>), a town where Sihon was defeated, in the borders of Moab and in the land of the Ammonites beyond Jordan, and north of the river Arnon (<a href=\"#\" onClick=\"return mV('Num',21,23);\">Num 21:23</a>; <a href=\"#\" onClick=\"return mV('Deu',2,32);\">Deu 2:32</a>). It was situated in the tribe of Reuben, and was assigned to the Merarite Levites (<a href=\"#\" onClick=\"return mV('Jos',13,18);\">Jos 13:18</a>; <a href=\"#\" onClick=\"return mV('Jos',21,36);\">21:36</a>). Here was fought the decisive battle in which Sihon (q.v.) was completely routed, and his territory (the modern Belka) came into the possession of Israel. This town is mentioned in the denunciations of the prophets against Moab (<a href=\"#\" onClick=\"return mV('Isa',15,4);\">Isa 15:4</a>; <a href=\"#\" onClick=\"return mV('Jer',48,34);\">Jer 48:34</a>).";
eastonArray["$$T0001954"] = "<strong>Jahaziel:</strong> beheld by God.<br><br>(1.) The third son of Hebron (<a href=\"#\" onClick=\"return mV('1Ch',23,19);\">1Ch 23:19</a>).<br><br>(2.) A Benjamite chief who joined David at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,4);\">1Ch 12:4</a>).<br><br>(3.) A priest who accompanied the removal of the ark to Jerusalem (<a href=\"#\" onClick=\"return mV('1Ch',16,6);\">1Ch 16:6</a>).<br><br>(4.) The son of Zechariah, a Levite of the family of Asaph (<a href=\"#\" onClick=\"return mV('2Ch',20,'14-17');\">2Ch 20:14-17</a>). He encouraged Jehoshaphat against the Moabites and Ammonites.";
eastonArray["$$T0001955"] = "<strong>Jahdai:</strong> grasper, a descendant of Caleb, of the family of Hezron (<a href=\"#\" onClick=\"return mV('1Ch',2,47);\">1Ch 2:47</a>).";
eastonArray["$$T0001956"] = "<strong>Jahzeel:</strong> allotted by God, the first of the sons of Naphtali (<a href=\"#\" onClick=\"return mV('Gen',46,24);\">Gen 46:24</a>).";
eastonArray["$$T0001957"] = "<strong>Jahzerah:</strong> returner, the son of Meshullam, and father of Adiel (<a href=\"#\" onClick=\"return mV('1Ch',9,12);\">1Ch 9:12</a>).";
eastonArray["$$T0001958"] = "<strong>Jailer:</strong> (of Philippi), <a href=\"#\" onClick=\"return mV('Act',16,23);\">Act 16:23</a>. The conversion of the Roman jailer, a man belonging to a class \"insensible as a rule and hardened by habit, and also disposed to despise the Jews, who were the bearers of the message of the gospel,\" is one of those cases which illustrate its universality and power.";
eastonArray["$$T0001959"] = "<strong>Jair:</strong> enlightener.<br><br>(1.) The son of Segub. He was brought up with his mother in Gilead, where he had possessions (<a href=\"#\" onClick=\"return mV('1Ch',2,22);\">1Ch 2:22</a>). He distinguished himself in an expedition against Bashan, and settled in the part of Argob on the borders of Gilead. The small towns taken by him there are called Havoth-jair, i.e., \"Jair's villages\" (<a href=\"#\" onClick=\"return mV('Num',32,41);\">Num 32:41</a>; <a href=\"#\" onClick=\"return mV('Deu',3,14);\">Deu 3:14</a>; <a href=\"#\" onClick=\"return mV('Jos',13,30);\">Jos 13:30</a>).<br><br>(2.) The eighth judge of Israel, which he ruled for twenty-two years. His opulence is described in <a href=\"#\" onClick=\"return mV('Jdg',10,'3-5');\">Jdg 10:3-5</a>. He had thirty sons, each riding on \"ass colts.\" They had possession of thirty of the sixty cities (<a href=\"#\" onClick=\"return mV('1Ki',4,13);\">1Ki 4:13</a>; <a href=\"#\" onClick=\"return mV('1Ch',2,23);\">1Ch 2:23</a>) which formed the ancient Havoth-jair.<br><br>(3.) A Benjamite, the father of Mordecai, Esther's uncle (<a href=\"#\" onClick=\"return mV('Est',2,5);\">Est 2:5</a>).<br><br>(4.) The father of Elhanan, who slew Lahmi, the brother of Goliath (<a href=\"#\" onClick=\"return mV('1Ch',20,5);\">1Ch 20:5</a>).";
eastonArray["$$T0001960"] = "<strong>Jairus:</strong> a ruler of the synagogue at Capernaum, whose only daughter Jesus restored to life (<a href=\"#\" onClick=\"return mV('Mar',5,22);\">Mar 5:22</a>; <a href=\"#\" onClick=\"return mV('Luk',8,41);\">Luk 8:41</a>). Entering into the chamber of death, accompanied by Peter and James and John and the father and mother of the maiden, he went forward to the bed whereon the corpse lay, and said, Talitha cumi, i.e., \"Maid, arise,\" and immediately the spirit of the maiden came to her again, and she arose straightway; and \"at once to strengthen that life which had come back to her, and to prove that she was indeed no ghost, but had returned to the realities of a mortal existence, he commanded to give her something to eat\" (<a href=\"#\" onClick=\"return mV('Mar',5,43);\">Mar 5:43</a>).";
eastonArray["$$T0001961"] = "<strong>Jakeh:</strong> pious, the father of Agur (<a href=\"#\" onClick=\"return mV('Pro',30,1);\">Pro 30:1</a>). Nothing is known of him.";
eastonArray["$$T0001962"] = "<strong>Jakim:</strong> establisher.<br><br>(1.) Chief of the twelfth priestly order (<a href=\"#\" onClick=\"return mV('1Ch',24,12);\">1Ch 24:12</a>).<br><br>(2.) A Benjamite (<a href=\"#\" onClick=\"return mV('1Ch',8,19);\">1Ch 8:19</a>).<br><br>(3.) Margin in <a href=\"#\" onClick=\"return mV('Mat',1,11);\">Mat 1:11</a> means Jehoiakim.";
eastonArray["$$T0001963"] = "<strong>Jalon:</strong> lodger, the last of the four sons of Ezra, of the tribe of Judah (<a href=\"#\" onClick=\"return mV('1Ch',4,17);\">1Ch 4:17</a>).";
eastonArray["$$T0001964"] = "<strong>Jambres:</strong> one of those who opposed Moses in Egypt (<a href=\"#\" onClick=\"return mV('2Ti',3,8);\">2Ti 3:8</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001967');\">JANNES</a>.)";
eastonArray["$$T0001965"] = "<strong>James:</strong><br><br>(1.) The son of Zebedee and Salome; an elder brother of John the apostle. He was one of the twelve. He was by trade a fisherman, in partnership with Peter (<a href=\"#\" onClick=\"return mV('Mat',20,20);\">Mat 20:20</a>; <a href=\"#\" onClick=\"return mV('Mat',27,56);\">27:56</a>). With John and Peter he was present at the transfiguration (<a href=\"#\" onClick=\"return mV('Mat',17,1);\">Mat 17:1</a>; <a href=\"#\" onClick=\"return mV('Mar',9,2);\">Mar 9:2</a>), at the raising of Jairus's daughter (<a href=\"#\" onClick=\"return mV('Mar',5,'37-43');\">Mar 5:37-43</a>), and in the garden with our Lord (<a href=\"#\" onClick=\"return mV('Mar',14,33);\">14:33</a>). Because, probably, of their boldness and energy, he and John were called Boanerges, i.e., \"sons of thunder.\" He was the first martyr among the apostles, having been beheaded by King Herod Agrippa (<a href=\"#\" onClick=\"return mV('Act',12,1,2);\">Act 12:1-2</a>), A.D. 44. (<a href=\"#\" onClick=\"return mV('Mat',4,21);\">Mat 4:21</a>; <a href=\"#\" onClick=\"return mV('Mat',20,'20-23');\">20:20-23</a>).<br><br>(2.) The son of Alphaeus, or Cleopas, \"the brother\" or near kinsman or cousin of our Lord (<a href=\"#\" onClick=\"return mV('Gal',1,18,19);\">Gal 1:18-19</a>), called James \"the Less,\" or \"the Little,\" probably because he was of low stature. He is mentioned along with the other apostles (<a href=\"#\" onClick=\"return mV('Mat',10,3);\">Mat 10:3</a>; <a href=\"#\" onClick=\"return mV('Mar',3,18);\">Mar 3:18</a>; <a href=\"#\" onClick=\"return mV('Luk',6,15);\">Luk 6:15</a>). He had a separate interview with our Lord after his resurrection (<a href=\"#\" onClick=\"return mV('1Cr',15,7);\">1Cr 15:7</a>), and is mentioned as one of the apostles of the circumcision (<a href=\"#\" onClick=\"return mV('Act',1,13);\">Act 1:13</a>). He appears to have occupied the position of head of the Church at Jerusalem, where he presided at the council held to consider the case of the Gentiles (<a href=\"#\" onClick=\"return mV('Act',12,17);\">Act 12:17</a>; <a href=\"#\" onClick=\"return mV('Act',15,'13-29');\">15:13-29</a>: <a href=\"#\" onClick=\"return mV('Act',21,'18-24');\">21:18-24</a>). This James was the author of the epistle which bears his name.";
eastonArray["$$T0001966"] = "<strong>James, Epistle of:</strong><br><br>(1.) Author of, was James the Less, the Lord's brother, one of the twelve apostles. He was one of the three pillars of the Church (<a href=\"#\" onClick=\"return mV('Gal',2,9);\">Gal 2:9</a>).<br><br>(2.) It was addressed to the Jews of the dispersion, \"the twelve tribes scattered abroad.\"<br><br>(3.) The place and time of the writing of the epistle were Jerusalem, where James was residing, and, from internal evidence, the period between Paul's two imprisonments at Rome, probably about A.D. 62.<br><br>(4.) The object of the writer was to enforce the practical duties of the Christian life. \"The Jewish vices against which he warns them are, formalism, which made the service of God consist in washings and outward ceremonies, whereas he reminds them (<a href=\"#\" onClick=\"return mV('Jam',1,27);\">Jam 1:27</a>) that it consists rather in active love and purity; fanaticism, which, under the cloak of religious zeal, was tearing Jerusalem in pieces (<a href=\"#\" onClick=\"return mV('Jam',1,20);\">Jam 1:20</a>); fatalism, which threw its sins on God (<a href=\"#\" onClick=\"return mV('Jam',1,13);\">Jam 1:13</a>); meanness, which crouched before the rich (<a href=\"#\" onClick=\"return mV('Jam',2,2);\">Jam 2:2</a>); falsehood, which had made words and oaths play-things (<a href=\"#\" onClick=\"return mV('Jam',3,'2-12');\">Jam 3:2-12</a>); partisanship (<a href=\"#\" onClick=\"return mV('Jam',3,14);\">Jam 3:14</a>); evil speaking (<a href=\"#\" onClick=\"return mV('Jam',4,11);\">Jam 4:11</a>); boasting (<a href=\"#\" onClick=\"return mV('Jam',4,16);\">Jam 4:16</a>); oppression (<a href=\"#\" onClick=\"return mV('Jam',5,4);\">Jam 5:4</a>). The great lesson which he teaches them as Christians is patience, patience in trial (<a href=\"#\" onClick=\"return mV('Jam',1,2);\">Jam 1:2</a>), patience in good works (<a href=\"#\" onClick=\"return mV('Jam',1,'22-25');\">Jam 1:22-25</a>), patience under provocation (<a href=\"#\" onClick=\"return mV('Jam',3,17);\">Jam 3:17</a>), patience under oppression (<a href=\"#\" onClick=\"return mV('Jam',5,7);\">Jam 5:7</a>), patience under persecution (<a href=\"#\" onClick=\"return mV('Jam',5,10);\">Jam 5:10</a>); and the ground of their patience is that the coming of the Lord draweth nigh, which is to right all wrong (<a href=\"#\" onClick=\"return mV('Jam',5,8);\">Jam 5:8</a>).\"<br><br>\"Justification by works,\" which James contends for, is justification before man, the justification of our profession of faith by a consistent life. Paul contends for the doctrine of \"justification by faith;\" but that is justification before God, a being regarded and accepted as just by virtue of the righteousness of Christ, which is received by faith.";
eastonArray["$$T0001967"] = "<strong>Jannes:</strong> one of the Egyptians who \"withstood Moses\" (<a href=\"#\" onClick=\"return mV('2Ti',3,8);\">2Ti 3:8</a>).";
eastonArray["$$T0001968"] = "<strong>Janoah:</strong> or Jano'hah, rest.<br><br>(1.) A town on the north-eastern border of Ephraim, in the Jordan valley (<a href=\"#\" onClick=\"return mV('Jos',16,6,7);\">Jos 16:6-7</a>). Identified with the modern Yanun, 8 miles south-east of Nablus.<br><br>(2.) A town of Northern Palestine, within the boundaries of Naphtali. It was taken by the king of Assyria (<a href=\"#\" onClick=\"return mV('2Ki',15,29);\">2Ki 15:29</a>).";
eastonArray["$$T0001969"] = "<strong>Janum:</strong> slumber, a town in the mountains of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,53);\">Jos 15:53</a>).";
eastonArray["$$T0001970"] = "<strong>Japheth:</strong> wide spreading: \"God shall enlarge Japheth\" (<a href=\"#\" onClick=\"return mV('Gen',9,27);\">Gen 9:27</a>. Some, however, derive the name from <i>yaphah</i>, \"to be beautiful; \" hence white), one of the sons of Noah, mentioned last in order (<a href=\"#\" onClick=\"return mV('Gen',5,32);\">Gen 5:32</a>; <a href=\"#\" onClick=\"return mV('Gen',6,10);\">6:10</a>; <a href=\"#\" onClick=\"return mV('Gen',7,13);\">7:13</a>), perhaps first by birth (<a href=\"#\" onClick=\"return mV('Gen',10,21);\">Gen 10:21</a>; <a href=\"#\" onClick=\"return mV('Gen',9,24);\">Gen 9:24</a>). He and his wife were two of the eight saved in the ark (<a href=\"#\" onClick=\"return mV('1Pe',3,20);\">1Pe 3:20</a>). He was the progenitor of many tribes inhabiting the east of Europe and the north of Asia (<a href=\"#\" onClick=\"return mV('Gen',10,'2-5');\">Gen 10:2-5</a>). An act of filial piety (<a href=\"#\" onClick=\"return mV('Gen',9,'20-27');\">9:20-27</a>) was the occasion of Noah's prophecy of the extension of his posterity.<br><br>After the Flood the earth was re-peopled by the descendants of Noah, \"the sons of Japheth\" (<a href=\"#\" onClick=\"return mV('Gen',10,2);\">Gen 10:2</a>), \"the sons of Ham\" (<a href=\"#\" onClick=\"return mV('Gen',10,6);\">6</a>), and \"the sons of Shem\" (<a href=\"#\" onClick=\"return mV('Gen',10,22);\">22</a>). It is important to notice that modern ethnological science, reasoning from a careful analysis of facts, has arrived at the conclusion that there is a three-fold division of the human family, corresponding in a remarkable way with the great ethnological chapter of the book of Genesis (<a href=\"#\" onClick=\"return mV('Gen',10,'1-')\">Gen 10</a>). The three great races thus distinguished are called the Semitic, Aryan, and Turanian (Allophylian). \"Setting aside the cases where the ethnic names employed are of doubtful application, it cannot reasonably be questioned that the author [of <a href=\"#\" onClick=\"return mV('Gen',10,'1-');\">Gen 10</a>] has in his account of the sons of Japheth classed together the Cymry or Celts (Gomer), the Medes (Madai), and the Ionians or Greeks (Javan), thereby anticipating what has become known in modern times as the 'Indo-European Theory,' or the essential unity of the Aryan (Asiatic) race with the principal races of Europe, indicated by the Celts and the Ionians. Nor can it be doubted that he has thrown together under the one head of 'children of Shem' the Assyrians (Asshur), the Syrians (Aram), the Hebrews (Eber), and the Joktanian Arabs (Joktan), four of the principal races which modern ethnology recognizes under the heading of 'Semitic.' Again, under the heading of 'sons of Ham,' the author has arranged 'Cush', i.e., the Ethiopians; 'Mizraim,' the people of Egypt; 'Sheba and Dedan,' or certain of the Southern Arabs; and 'Nimrod,' or the ancient people of Babylon, four races between which the latest linguistic researches have established a close affinity\" (Rawlinson's Hist. Illustrations).";
eastonArray["$$T0001971"] = "<strong>Japhia:</strong> splendid.<br><br>(1.) The king of Lachish, who joined in the confederacy against Joshua (<a href=\"#\" onClick=\"return mV('Jos',10,3);\">Jos 10:3</a>), and was defeated and slain. In one of the Amarna tablets he speaks of himself as king of Gezer. Called also Horam (<a href=\"#\" onClick=\"return mV('Jos',10,33);\">Jos 10:33</a>).<br><br>(2.) One of the sons of David (<a href=\"#\" onClick=\"return mV('2Sa',5,15);\">2Sa 5:15</a>), born in Jerusalem.<br><br>(3.) A town in the southern boundary of Zebulum (<a href=\"#\" onClick=\"return mV('Jos',19,12);\">Jos 19:12</a>); now Yafa, 2 miles south-west of Nazareth.";
eastonArray["$$T0001972"] = "<strong>Japho:</strong> beauty, a sea-port in Dan (<a href=\"#\" onClick=\"return mV('Jos',19,46);\">Jos 19:46</a>); called Joppa (q.v.) in <a href=\"#\" onClick=\"return mV('2Ch',2,16);\">2Ch 2:16</a>; <a href=\"#\" onClick=\"return mV('Ezr',3,7);\">Ezr 3:7</a>; <a href=\"#\" onClick=\"return mV('Jon',1,3);\">Jon 1:3</a>; and in New Testament.";
eastonArray["$$T0001973"] = "<strong>Jared:</strong> descent.<br><br>(1.) The fourth antediluvian patriarch in descent from Seth (<a href=\"#\" onClick=\"return mV('Gen',5,'15-20');\">Gen 5:15-20</a>; <a href=\"#\" onClick=\"return mV('Luk',3,37);\">Luk 3:37</a>), the father of Enoch; called Jered in <a href=\"#\" onClick=\"return mV('1Ch',1,2);\">1Ch 1:2</a>.<br><br>(2.) A son of Ezra probably (<a href=\"#\" onClick=\"return mV('1Ch',4,18);\">1Ch 4:18</a>).";
eastonArray["$$T0001974"] = "<strong>Jarib:</strong> an adversary.<br><br>(1.) A son of Simeon (<a href=\"#\" onClick=\"return mV('1Ch',4,24);\">1Ch 4:24</a>).<br><br>(2.) One of the chiefs sent by Ezra to bring up the priests to Jerusalem (<a href=\"#\" onClick=\"return mV('Ezr',8,16);\">Ezr 8:16</a>).<br><br>(3.) <a href=\"#\" onClick=\"return mV('Ezr',10,18);\">Ezr 10:18</a>.";
eastonArray["$$T0001975"] = "<strong>Jarmuth:</strong> height.<br><br>(1.) A town in the plain of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,35);\">Jos 15:35</a>), originally the residence of one of the Canaanitish kings (<a href=\"#\" onClick=\"return mV('Jos',10,3,5,23);\">10:3, 5, 23</a>). It has been identified with the modern Yarmuk, a village about 7 miles north-east of Beit-Jibrin.<br><br>(2.) A Levitical city of the tribe of Issachar (<a href=\"#\" onClick=\"return mV('Jos',21,29);\">Jos 21:29</a>), supposed by some to be the Ramah of Samuel (<a href=\"#\" onClick=\"return mV('1Sa',19,22);\">1Sa 19:22</a>).";
eastonArray["$$T0001976"] = "<strong>Jashen:</strong> sleeping, called also Hashem (<a href=\"#\" onClick=\"return mV('1Ch',11,34);\">1Ch 11:34</a>); a person, several of whose sons were in David's body-guard (<a href=\"#\" onClick=\"return mV('2Sa',23,32);\">2Sa 23:32</a>).";
eastonArray["$$T0001977"] = "<strong>Jasher:</strong> upright. \"The Book of Jasher,\" rendered in the LXX. \"the Book of the Upright One,\" by the Vulgate \"the Book of Just Ones,\" was probably a kind of national sacred song-book, a collection of songs in praise of the heroes of Israel, a \"book of golden deeds,\" a national anthology. We have only two specimens from the book,<br><br>(1) the words of Joshua which he spake to the Lord at the crisis of the battle of Beth-horon (<a href=\"#\" onClick=\"return mV('Jos',10,12,13);\">Jos 10:12-13</a>); and<br><br>(2) \"the Song of the Bow,\" that beautiful and touching mournful elegy which David composed on the occasion of the death of Saul and Jonathan (<a href=\"#\" onClick=\"return mV('2Sa',1,'18-27');\">2Sa 1:18-27</a>).";
eastonArray["$$T0001978"] = "<strong>Jashobeam:</strong> dweller among the people; or to whom the people turn, the Hachmonite (<a href=\"#\" onClick=\"return mV('1Ch',11,11);\">1Ch 11:11</a>), one of David's chief heroes who joined him at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,6);\">12:6</a>). He was the first of the three who broke through the host of the Philistines to fetch water to David from the well of Bethlehem (<a href=\"#\" onClick=\"return mV('2Sa',23,'13-17');\">2Sa 23:13-17</a>). He is also called Adino the Eznite (<a href=\"#\" onClick=\"return mV('2Sa',23,8);\">8</a>).";
eastonArray["$$T0001979"] = "<strong>Jashub:</strong> returner.<br><br>(1.) The third of Issachar's four sons (<a href=\"#\" onClick=\"return mV('1Ch',7,1);\">1Ch 7:1</a>); called also Job (<a href=\"#\" onClick=\"return mV('Gen',46,13);\">Gen 46:13</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('Ezr',10,29);\">Ezr 10:29</a>.";
eastonArray["$$T0001980"] = "<strong>Jason:</strong> he that will cure, the host of Paul and Silas in Thessalonica. The Jews assaulted his house in order to seize Paul, but failing to find him, they dragged Jason before the ruler of the city (<a href=\"#\" onClick=\"return mV('Act',17,'5-9');\">Act 17:5-9</a>). He was apparently one of the kinsmen of Paul (<a href=\"#\" onClick=\"return mV('Rom',16,21);\">Rom 16:21</a>), and accompanied him from Thessalonica to Corinth.";
eastonArray["$$T0001981"] = "<strong>Jasper:</strong> (Heb. yashpheh, \"glittering\"), a gem of various colours, one of the twelve inserted in the high priest's breast-plate (<a href=\"#\" onClick=\"return mV('Exd',28,20);\">Exd 28:20</a>). It is named in the building of the New Jerusalem (<a href=\"#\" onClick=\"return mV('Rev',21,18,19);\">Rev 21:18-19</a>). It was \"most precious,\" \"clear as crystal\" (<a href=\"#\" onClick=\"return mV('Rev',21,11);\">21:11</a>). It was emblematic of the glory of God (<a href=\"#\" onClick=\"return mV('Rev',4,3);\">4:3</a>).";
eastonArray["$$T0001982"] = "<strong>Jattir:</strong> pre-eminent, a city in the mountains of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,48);\">Jos 15:48</a>; <a href=\"#\" onClick=\"return mV('Jos',21,14);\">21:14</a>).";
eastonArray["$$T0001983"] = "<strong>Javan:</strong><br><br>(1.) The fourth \"son\" of Japheth (<a href=\"#\" onClick=\"return mV('Gen',10,2);\">Gen 10:2</a>), whose descendants settled in Greece, i.e., Ionia, which bears the name of Javan in Hebrew. Alexander the Great is called the \"king of Javan\" (<a href=\"#\" onClick=\"return mV('Dan',8,21);\">Dan 8:21</a>; <a href=\"#\" onClick=\"return mV('Dan',10,20);\">10:20</a>; <a href=\"#\" onClick=\"return mV('Dan',11,2);\">Dan 11:2</a>; <a href=\"#\" onClick=\"return mV('Zec',9,13);\">Zec 9:13</a>). This word was universally used by the nations of the East as the generic name of the Greek race.<br><br>(2.) A town or district of Arabia Felix, from which the Syrians obtained iron, cassia, and calamus (<a href=\"#\" onClick=\"return mV('Eze',27,19);\">Eze 27:19</a>).";
eastonArray["$$T0001984"] = "<strong>Javelin:</strong><br><br>(1.) Heb. hanith, a lance, from its flexibility (<a href=\"#\" onClick=\"return mV('1Sa',18,10,11);\">1Sa 18:10-11</a>; <a href=\"#\" onClick=\"return mV('1Sa',19,9,10);\">19:9-10</a>; <a href=\"#\" onClick=\"return mV('1Sa',20,33);\">20:33</a>).<br><br>(2.) Heb. romah, a lance for heavy-armed troops, so called from its piercing (<a href=\"#\" onClick=\"return mV('Num',25,7);\">Num 25:7</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000315');\">ARMS</a>.)";
eastonArray["$$T0001985"] = "<strong>Jaw-bone:</strong> of an ass afforded Samson a weapon for the great slaughter of the Philistines (<a href=\"#\" onClick=\"return mV('Jdg',15,15);\">Jdg 15:15</a>), in which he slew a thousand men. In verse <a href=\"#\" onClick=\"return mV('Jdg',15,19);\">19</a> the Authorized Version reads, \"God clave a hollow place that was in the jaw, and there came water thereout.\" This is a mis-translation of the words. The rendering should be as in the Revised Version, \"God clave the hollow place that is in Lehi,\" etc., Lehi (q.v.) being the name of the hill where this conflict was waged, possibly so called because it was in shape like a jaw-bone.";
eastonArray["$$T0001986"] = "<strong>Jealousy:</strong> suspicion of a wife's purity, one of the strongest passions (<a href=\"#\" onClick=\"return mV('Num',5,14);\">Num 5:14</a>; <a href=\"#\" onClick=\"return mV('Pro',6,34);\">Pro 6:34</a>; <a href=\"#\" onClick=\"return mV('Sgs',8,6);\">Sgs 8:6</a>); also an intense interest for another's honour or prosperity (<a href=\"#\" onClick=\"return mV('Psa',79,5);\">Psa 79:5</a>; <a href=\"#\" onClick=\"return mV('1Cr',10,22);\">1Cr 10:22</a>; <a href=\"#\" onClick=\"return mV('Zec',1,14);\">Zec 1:14</a>).";
eastonArray["$$T0001987"] = "<strong>Jealousy, Image of:</strong> an idolatrous object, seen in vision by Ezekiel (<a href=\"#\" onClick=\"return mV('Eze',8,3,5);\">Eze 8:3, 5</a>), which stood in the priests' or inner court of the temple. Probably identical with the statue of Astarte (<a href=\"#\" onClick=\"return mV('2Ki',21,7);\">2Ki 21:7</a>).";
eastonArray["$$T0001988"] = "<strong>Jealousy offering:</strong> the name of the offering the husband was to bring when he charged his wife with adultery (<a href=\"#\" onClick=\"return mV('Num',5,'11-15');\">Num 5:11-15).";
eastonArray["$$T0001989"] = "<strong>Jealousy, Waters of:</strong> water which the suspected wife was required to drink, so that the result might prove her guilt or innocence (<a href=\"#\" onClick=\"return mV('Num',5,'12-17',27);\">Num 5:12-17, 27</a>). We have no record of this form of trial having been actually resorted to.";
eastonArray["$$T0001990"] = "<strong>Jearim:</strong> forests, a mountain on the border of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,10);\">Jos 15:10</a>).";
eastonArray["$$T0001991"] = "<strong>Jebus:</strong> trodden hard, or fastness, or \"the waterless hill\", the name of the Canaanitish city which stood on Mount Zion (<a href=\"#\" onClick=\"return mV('Jos',15,8);\">Jos 15:8</a>; <a href=\"#\" onClick=\"return mV('Jos',18,16,28);\">18:16, 28</a>). It is identified with Jerusalem (q.v.) in <a href=\"#\" onClick=\"return mV('Jos',19,10);\">Jdg 19:10</a>, and with the castle or city of David (<a href=\"#\" onClick=\"return mV('1Ch',11,4,5);\">1Ch 11:4-5</a>). It was a place of great natural strength, and its capture was one of David's most brilliant achievements (<a href=\"#\" onClick=\"return mV('2Sa',5,8);\">2Sa 5:8</a>).";
eastonArray["$$T0001992"] = "<strong>Jebusites:</strong> the name of the original inhabitants of Jebus, mentioned frequently among the seven nations doomed to destruction (<a href=\"#\" onClick=\"return mV('Gen',10,16);\">Gen 10:16</a>; <a href=\"#\" onClick=\"return mV('Gen',15,21);\">15:21</a>; <a href=\"#\" onClick=\"return mV('Exd',3,8,17);\">Exd 3:8, 17</a>; <a href=\"#\" onClick=\"return mV('Exd',13,5);\">13:5</a>, etc.). At the time of the arrival of the Israelites in Palestine they were ruled by Adonizedek (<a href=\"#\" onClick=\"return mV('Jos',10,1,23);\">Jos 10:1, 23</a>). They were defeated by Joshua, and their king was slain; but they were not entirely driven out of Jebus till the time of David, who made it the capital of his kingdom instead of Hebron. The site on which the temple was afterwards built belonged to Araunah, a Jebusite, from whom it was purchased by David, who refused to accept it as a free gift (<a href=\"#\" onClick=\"return mV('2Sa',24,'16-25');\">2Sa 24:16-25</a>; <a href=\"#\" onClick=\"return mV('1Ch',21,24,25);\">1Ch 21:24-25</a>).";
eastonArray["$$T0001993"] = "<strong>Jecoliah:</strong> able through Jehovah, the wife of King Amaziah, and mother of King Uzziah (<a href=\"#\" onClick=\"return mV('2Ch',26,3);\">2Ch 26:3</a>).";
eastonArray["$$T0001994"] = "<strong>Jedaiah:</strong><br><br>(1.) Invoker of Jehovah. The son of Shimri, a chief Simeonite (<a href=\"#\" onClick=\"return mV('1Ch',4,37);\">1Ch 4:37</a>).<br><br>(2.) One of those who repaired the walls of Jerusalem after the return from Babylon (<a href=\"#\" onClick=\"return mV('Neh',3,10);\">Neh 3:10</a>).<br><br>(3.) Knowing Jehovah. The chief of one of the courses of the priests (<a href=\"#\" onClick=\"return mV('1Ch',24,7);\">1Ch 24:7</a>).<br><br>(4.) A priest in Jerusalem after the Exile (<a href=\"#\" onClick=\"return mV('1Ch',9,10);\">1Ch 9:10</a>).";
eastonArray["$$T0001995"] = "<strong>Jediael:</strong> known by God.<br><br>(1.) One of the sons of Benjamin, whose descendants numbered 17,200 warriors (<a href=\"#\" onClick=\"return mV('1Ch',7,6,10,11);\">1Ch 7:6, 10-11</a>).<br><br>(2.) A Shimrite, one of David's bodyguard (<a href=\"#\" onClick=\"return mV('1Ch',11,45);\">1Ch 11:45</a>). Probably same as in <a href=\"#\" onClick=\"return mV('1Ch',12,20);\">1Ch 12:20</a>.<br><br>(3.) A Korhite of the family of Ebiasaph, and one of the gate-keepers to the temple (<a href=\"#\" onClick=\"return mV('1Ch',26,2);\">1Ch 26:2</a>).";
eastonArray["$$T0001996"] = "<strong>Jedidiah:</strong> beloved by Jehovah, the name which, by the mouth of Nathan, the Lord gave to Solomon at his birth as a token of the divine favour (<a href=\"#\" onClick=\"return mV('2Sa',12,25);\">2Sa 12:25</a>).";
eastonArray["$$T0001997"] = "<strong>Jeduthun:</strong> lauder; praising, a Levite of the family of Merari, and one of the three masters of music appointed by David (<a href=\"#\" onClick=\"return mV('1Ch',16,41,42);\">1Ch 16:41-42</a>; <a href=\"#\" onClick=\"return mV('1Ch',25,'1-6');\">25:1-6</a>). He is called in <a href=\"#\" onClick=\"return mV('2Ch',35,15);\">2Ch 35:15</a> \"the king's seer.\" His descendants are mentioned as singers and players on instruments (<a href=\"#\" onClick=\"return mV('Neh',11,17);\">Neh 11:17</a>). He was probably the same as Ethan (<a href=\"#\" onClick=\"return mV('1Ch',15,17,19);\">1Ch 15:17, 19</a>). In the superscriptions to <a href=\"#\" onClick=\"return mV('Psa',39,'1-');\">Psa 39</a>; <a href=\"#\" onClick=\"return mV('Psa',62,'1-');\">62</a>, and <a href=\"#\" onClick=\"return mV('Psa',77,'1-');\">77</a>, the words \"upon Jeduthun\" probably denote a musical instrument; or they may denote the style or tune invented or introduced by Jeduthun, or that the psalm was to be sung by his choir.";
eastonArray["$$T0001998"] = "<strong>Jegar-sahadutha:</strong> pile of testimony, the Aramaic or Syriac name which Laban gave to the pile of stones erected as a memorial of the covenant between him and Jacob (<a href=\"#\" onClick=\"return mV('Gen',31,47);\">Gen 31:47</a>), who, however, called it in Hebrew by an equivalent name, Galeed (q.v.).";
eastonArray["$$T0001999"] = "<strong>Jehaleleel:</strong> praiser of God.<br><br>(1.) A descendant of Judah (<a href=\"#\" onClick=\"return mV('1Ch',4,16);\">1Ch 4:16</a>).<br><br>(2.) A Levite of the family of Merari (<a href=\"#\" onClick=\"return mV('2Ch',29,12);\">2Ch 29:12</a>).";
</script>
