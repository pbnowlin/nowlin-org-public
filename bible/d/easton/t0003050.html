<script>
var eastonArray = new Array ();
eastonArray["$$T0003050"] = "<strong>Rachab:</strong> =Rahab, a name found in the genealogy of our Lord (<a href=\"#\" onClick=\"return mV('Mat',1,5);\">Mat 1:5</a>).";
eastonArray["$$T0003051"] = "<strong>Rachal:</strong> traffic, a town in the tribe of Judah, to which David sent presents from the spoils of his enemies (<a href=\"#\" onClick=\"return mV('1Sa',30,29);\">1Sa 30:29</a>).";
eastonArray["$$T0003052"] = "<strong>Rachel:</strong> ewe, \"the daughter\", \"the somewhat petulant, peevish, and self-willed though beautiful younger daughter\" of Laban, and one of Jacob's wives (<a href=\"#\" onClick=\"return mV('Gen',29,6,28);\">Gen 29:6, 28</a>). He served Laban fourteen years for her, so deep was Jacob's affection for her. She was the mother of Joseph (<a href=\"#\" onClick=\"return mV('Gen',30,'22-24');\">Gen 30:22-24</a>). Afterwards, on Jacob's departure from Mesopotamia, she took with her her father's teraphim (<a href=\"#\" onClick=\"return mV('Gen',31,34,35);\">31:34-35</a>). As they journeyed on from Bethel, Rachel died in giving birth to Benjamin (<a href=\"#\" onClick=\"return mV('Gen',35,18,19);\">35:18-19</a>), and was buried \"in the way to Ephrath, which is Bethlehem. And Jacob set a pillar upon her grave\". Her sepulchre is still regarded with great veneration by the Jews. Its traditional site is about half a mile from Jerusalem.<br><br>This name is used poetically by Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',31,'15-17');\">Jer 31:15-17</a>) to denote God's people mourning under their calamities. This passage is also quoted by Matthew as fulfilled in the lamentation at Bethlehem on account of the slaughter of the infants there at the command of Herod (<a href=\"#\" onClick=\"return mV('Mat',2,17,18);\">Mat 2:17-18</a>).";
eastonArray["$$T0003053"] = "<strong>Raguel:</strong> friend of God, (<a href=\"#\" onClick=\"return mV('Num',10,29);\">Num 10:29</a>) =Reuel (q.v.), <a href=\"#\" onClick=\"return mV('Exd',2,18);\">Exd 2:18</a>, the father-in-law of Moses, and probably identical with Jethro (q.v.).";
eastonArray["$$T0003054"] = "<strong>Rahab:</strong> insolence; pride, a poetical name applied to Egypt in <a href=\"#\" onClick=\"return mV('Psa',87,4);\">Psa 87:4</a>; <a href=\"#\" onClick=\"return mV('Psa',89,10);\">89:10</a>; <a href=\"#\" onClick=\"return mV('Isa',51,9);\">Isa 51:9</a>, as \"the proud one.\"<br><br>Rahab, (Heb. Rahab; i.e., \"broad,\" \"large\"). When the Hebrews were encamped at Shittim, in the \"Arabah\" or Jordan valley opposite Jericho, ready to cross the river, Joshua, as a final preparation, sent out two spies to \"spy the land.\" After five days they returned, having swum across the river, which at this season, the month Abib, overflowed its banks from the melting of the snow on Lebanon. The spies reported how it had fared with them (<a href=\"#\" onClick=\"return mV('Jos',2,'1-7');\">Jos 2:1-7</a>). They had been exposed to danger in Jericho, and had been saved by the fidelity of Rahab the harlot, to whose house they had gone for protection. When the city of Jericho fell (<a href=\"#\" onClick=\"return mV('Jos',6,'17-25');\">6:17-25</a>), Rahab and her whole family were preserved according to the promise of the spies, and were incorporated among the Jewish people. She afterwards became the wife of Salmon, a prince of the tribe of Judah (<a href=\"#\" onClick=\"return mV('Rth',4,21);\">Rth 4:21</a>; <a href=\"#\" onClick=\"return mV('1Ch',2,11);\">1Ch 2:11</a>; <a href=\"#\" onClick=\"return mV('Mat',1,5);\">Mat 1:5</a>). \"Rahab's being asked to bring out the spies to the soldiers (<a href=\"#\" onClick=\"return mV('Jos',2,3);\">Jos 2:3</a>) sent for them, is in strict keeping with Eastern manners, which would not permit any man to enter a woman's house without her permission. The fact of her covering the spies with bundles of flax which lay on her house-roof (<a href=\"#\" onClick=\"return mV('Jos',2,6);\">2:6</a>) is an 'undesigned coincidence' which strictly corroborates the narrative. It was the time of the barley harvest, and flax and barley are ripe at the same time in the Jordan valley, so that the bundles of flax stalks might have been expected to be drying just then\" (Geikie's Hours, etc., ii., 390).";
eastonArray["$$T0003055"] = "<strong>Raham:</strong> merciful, one of the descendants of Caleb, the son of Hezron (<a href=\"#\" onClick=\"return mV('1Ch',2,44);\">1Ch 2:44</a>).";
eastonArray["$$T0003056"] = "<strong>Rain:</strong> There are three Hebrew words used to denote the rains of different seasons,<br><br>(1.) Yoreh (<a href=\"#\" onClick=\"return mV('Hsa',6,3);\">Hsa 6:3</a>), or moreh (<a href=\"#\" onClick=\"return mV('Joe',2,23);\">Joe 2:23</a>), denoting the former or the early rain.<br><br>(2.) Melqosh, the \"latter rain\" (<a href=\"#\" onClick=\"return mV('Pro',16,15);\">Pro 16:15</a>).<br><br>(3.) Geshem, the winter rain, \"the rains.\" The heavy winter rain is mentioned in <a href=\"#\" onClick=\"return mV('Gen',7,12);\">Gen 7:12</a>; <a href=\"#\" onClick=\"return mV('Ezr',10,9);\">Ezr 10:9</a>; <a href=\"#\" onClick=\"return mV('Sgs',2,11);\">Sgs 2:11</a>. The \"early\" or \"former\" rains commence in autumn in the latter part of October or beginning of November (<a href=\"#\" onClick=\"return mV('Deu',11,14);\">Deu 11:14</a>; <a href=\"#\" onClick=\"return mV('Joe',2,23);\">Joe 2:23</a>; <a href=\"#\" onClick=\"return mV('Jer',3,3);\">Jer 3:3</a>), and continue to fall heavily for two months. Then the heavy \"winter rains\" fall from the middle of December to March. There is no prolonged fair weather in Palestine between October and March. The \"latter\" or spring rains fall in March and April, and serve to swell the grain then coming to maturity (<a href=\"#\" onClick=\"return mV('Deu',11,14);\">Deu 11:14</a>; <a href=\"#\" onClick=\"return mV('Hsa',6,3);\">Hsa 6:3</a>). After this there is ordinarily no rain, the sky being bright and cloudless till October or November.<br><br>Rain is referred to symbolically in <a href=\"#\" onClick=\"return mV('Deu',32,2);\">Deu 32:2</a>; <a href=\"#\" onClick=\"return mV('Psa',72,6);\">Psa 72:6</a>; <a href=\"#\" onClick=\"return mV('Isa',44,3,4);\">Isa 44:3-4</a>; <a href=\"#\" onClick=\"return mV('Hsa',10,12);\">Hsa 10:12</a>.";
eastonArray["$$T0003057"] = "<strong>Rainbow:</strong> caused by the reflection and refraction of the rays of the sun shining on falling rain. It was appointed as a witness of the divine faithfulness (<a href=\"#\" onClick=\"return mV('Gen',9,'12-17');\">Gen 9:12-17</a>). It existed indeed before, but it was then constituted as a sign of the covenant. Others, however (as Delitzsch, Commentary on Pentateuch), think that it \"appeared then for the first time in the vault and clouds of heaven.\" It is argued by those holding this opinion that the atmosphere was differently constituted before the Flood. It is referred to three other times in Scripture (<a href=\"#\" onClick=\"return mV('Eze',1,27,28);\">Eze 1:27-28</a>; <a href=\"#\" onClick=\"return mV('Rev',4,'1-3');\">Rev 4:1-3</a>; <a href=\"#\" onClick=\"return mV('Rev',10,1);\">10:1</a>).";
eastonArray["$$T0003058"] = "<strong>Raisins:</strong> dried grapes; mentioned <a href=\"#\" onClick=\"return mV('1Sa',25,18);\">1Sa 25:18</a>; <a href=\"#\" onClick=\"return mV('1Sa',30,12);\">30:12</a>; <a href=\"#\" onClick=\"return mV('2Sa',16,1);\">2Sa 16:1</a>; <a href=\"#\" onClick=\"return mV('1Ch',12,40);\">1Ch 12:40</a>.";
eastonArray["$$T0003059"] = "<strong>Rakkath:</strong> shore-town, a \"fenced city\" of the tribe of Naphtali (<a href=\"#\" onClick=\"return mV('Jos',19,35);\">Jos 19:35</a>). The old name of Tiberias, according to the Rabbins.";
eastonArray["$$T0003060"] = "<strong>Rakkon:</strong> a place upon the shore, a town belonging to Dan (<a href=\"#\" onClick=\"return mV('Jos',19,46);\">Jos 19:46</a>). It is now Tell er-Rakkeit, 6 miles north of Joppa, on the sea-shore, near the mouth of the river 'Aujeh, i.e., \"yellow water.\" (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002155');\">KANAH</a>.)";
eastonArray["$$T0003061"] = "<strong>Ram:</strong> exalted.<br><br>(1.) The son of Hezron, and one of the ancestors of the royal line (<a href=\"#\" onClick=\"return mV('Rth',4,19);\">Rth 4:19</a>). The margin of <a href=\"#\" onClick=\"return mV('1Ch',2,9);\">1Ch 2:9</a>, also <a href=\"#\" onClick=\"return mV('Mat',1,3,4);\">Mat 1:3-4 and <a href=\"#\" onClick=\"return mV('Luk',3,33);\">Luk 3:33</a>, have \"Aram.\"<br><br>(2.) One of the sons of Jerahmeel (<a href=\"#\" onClick=\"return mV('1Ch',2,25,27);\">1Ch 2:25,27</a>).<br><br>(3.) A person mentioned in <a href=\"#\" onClick=\"return mV('Job',32,2);\">Job 32:2</a> as founder of a clan to which Elihu belonged. The same as Aram of <a href=\"#\" onClick=\"return mV('Gen',22,21);\">Gen 22:21</a>.";
eastonArray["$$T0003062"] = "<strong>Rama:</strong> (<a href=\"#\" onClick=\"return mV('Mat',2,18);\">Mat 2:18</a>), the Greek form of Ramah.<br><br>(1.) A city first mentioned in <a href=\"#\" onClick=\"return mV('Jos',18,25);\">Jos 18:25</a>, near Gibeah of Benjamin. It was fortified by Baasha, king of Israel (<a href=\"#\" onClick=\"return mV('1Ki',15,'17-22');\">1Ki 15:17-22</a>; <a href=\"#\" onClick=\"return mV('2Ch',16,'1-6');\">2Ch 16:1-6</a>). Asa, king of Judah, employed Benhadad the Syrian king to drive Baasha from this city (<a href=\"#\" onClick=\"return mV('1Ki',15,18,20);\">1Ki 15:18, 20</a>). Isaiah (<a href=\"#\" onClick=\"return mV('Isa',10,29);\">Isa 10:29</a>) refers to it, and also Jeremiah, who was once a prisoner there among the other captives of Jerusalem when it was taken by Nebuchadnezzar (<a href=\"#\" onClick=\"return mV('Jer',39,'8-12');\">Jer 39:8-12</a>; <a href=\"#\" onClick=\"return mV('Jer',40,1);\">40:1</a>). Rachel, whose tomb lies close to Bethlehem, is represented as weeping in Ramah (<a href=\"#\" onClick=\"return mV('Jer',31,15);\">Jer 31:15</a>) for her slaughtered children. This prophecy is illustrated and fulfilled in the re-awakening of Rachel's grief at the slaughter of the infants in Bethlehem (<a href=\"#\" onClick=\"return mV('Mat',2,18);\">Mat 2:18</a>). It is identified with the modern village of er-Ram, between Gibeon and Beeroth, about 5 miles due north of Jerusalem. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003209');\">SAMUEL</a>.)<br><br>(2.) A town identified with Rameh, on the border of Asher, about 13 miles south-east of Tyre, \"on a solitary hill in the midst of a basin of green fields\" (<a href=\"#\" onClick=\"return mV('Jos',19,29);\">Jos 19:29</a>).<br><br>(3.) One of the \"fenced cities\" of Naphtali (<a href=\"#\" onClick=\"return mV('Jos',19,36);\">Jos 19:36</a>), on a mountain slope, about seven and a half miles west-south-west of Safed, and 15 miles west of the north end of the Sea of Galilee, the present large and well-built village of Rameh.<br><br>(4.) The same as Ramathaim-zophim (q.v.), a town of Mount Ephraim (<a href=\"#\" onClick=\"return mV('1Sa',1,1,19);\">1Sa 1:1, 19</a>).<br><br>(5.) The same as Ramoth-gilead (q.v.), <a href=\"#\" onClick=\"return mV('2Ki',8,29);\">2Ki 8:29</a>; <a href=\"#\" onClick=\"return mV('2Ch',22,6);\">2Ch 22:6</a>.";
eastonArray["$$T0003063"] = "<strong>Ramathaim-zophim:</strong> the two heights of the Zophites or of the watchers (in <a href=\"#\" onClick=\"return mV('1Sa',1,1);\">1Sa 1:1</a>), \"in the land of Zuph\" (<a href=\"#\" onClick=\"return mV('1Sa',9,5);\">9:5</a>). Ramathaim is another name for Ramah (4).<br><br>One of the Levitical families descended from Kohath, that of Zuph or Zophai (<a href=\"#\" onClick=\"return mV('1Ch',6,26,35);\">1Ch 6:26, 35</a>), had a district assigned to them in Ephraim, which from this circumstance was called \"the land of Zuph,\" and hence the name of the town, \"Zophim.\" It was the birth-place of Samuel and the seat of his authority (<a href=\"#\" onClick=\"return mV('1Sa',2,11);\">1Sa 2:11</a>; <a href=\"#\" onClick=\"return mV('1Sa',7,17);\">7:17</a>). It is frequently mentioned in the history of that prophet and of David (<a href=\"#\" onClick=\"return mV('1Sa',15,34);\">15:34</a>; <a href=\"#\" onClick=\"return mV('1Sa',16,13);\">16:13</a>; <a href=\"#\" onClick=\"return mV('1Sa',19,'18-23');\">19:18-23</a>). Here Samuel died and was buried (<a href=\"#\" onClick=\"return mV('1Sa',25,1);\">25:1</a>).<br><br>This town has been identified with the modern Neby Samwil (\"the prophet Samuel\"), about 4 or 5 miles north-west of Jerusalem. But there is no certainty as to its precise locality. Some have supposed that it may be identical with Arimathea of the New Testament. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002579');\">MIZPAH</a>).";
eastonArray["$$T0003064"] = "<strong>Ramathite:</strong> the designation given to Shimei, the manager of David's vineyard (<a href=\"#\" onClick=\"return mV('1Ch',27,27);\">1Ch 27:27</a>).";
eastonArray["$$T0003065"] = "<strong>Ramath-lehi:</strong> elevation of Lehi, or the jawbone height; i.e., the Ramah of Lehi (<a href=\"#\" onClick=\"return mV('Jdg',15,'15-17');\">Jdg 15:15-17</a>). The phrase \"in the jaw,\" ver. <a href=\"#\" onClick=\"return mV('Jdg',15,19);\">19</a>, Authorized Version, is in the margin, also in the Revised Version, \"in Lehi.\" Here Samson slew a thousand Philistines with a jawbone.";
eastonArray["$$T0003066"] = "<strong>Ramath-mizpeh:</strong> the height of Mizpeh or of the watch-tower (<a href=\"#\" onClick=\"return mV('Jos',13,26);\">Jos 13:26</a>), a place mentioned as one of the limits of Gad. There were two Mizpehs on the east of the Jordan. This was the Mizpeh where Jacob and Laban made a covenant, \"Mizpeh of Gilead,\" called also Galeed and Jegar-sahadutha. It has been identified with the modern es-Salt, where the roads from Jericho and from Shechem to Damascus unite, about 25 miles east of the Jordan and 13 south of the Jabbok.";
eastonArray["$$T0003067"] = "<strong>Ramath of the south:</strong> (Heb. Ramath-negeb). The Heb. negeb is the general designation for south or south-west of Judah. This was one of the towns of Simeon (<a href=\"#\" onClick=\"return mV('Jos',19,8);\">Jos 19:8</a>). It is the same as \"south Ramoth\" (<a href=\"#\" onClick=\"return mV('1Sa',30,27);\">1Sa 30:27</a>; R.V., \"Ramoth of the south\"). Its site is doubtful. Some have thought it another name for Baalath-beer.";
eastonArray["$$T0003068"] = "<strong>Rameses:</strong> \"the land of\" (<a href=\"#\" onClick=\"return mV('Gen',47,11);\">Gen 47:11</a>), was probably \"the land of Goshen\" (q.v.) <a href=\"#\" onClick=\"return mV('Gen',45,10);\">45:10</a>. After the Hebrews had built Rameses, one of the \"treasure cities,\" it came to be known as the \"land\" in which that city was built.<br><br>The city bearing this name (<a href=\"#\" onClick=\"return mV('Exd',12,37);\">Exd 12:37</a>) was probably identical with Zoan, which Rameses II. (\"son of the sun\") rebuilt. It became his special residence, and ranked next in importance and magnificance to Thebes. Huge masses of bricks, made of Nile mud, sun-dried, some of them mixed with stubble, possibly moulded by Jewish hands, still mark the site of Rameses. This was the general rendezvous of the Israelites before they began their march out of Egypt. Called also Raamses (<a href=\"#\" onClick=\"return mV('Exd',1,11);\">Exd 1:11</a>).";
eastonArray["$$T0003069"] = "<strong>Ramoth:</strong> heights. A Levitical city in the tribe of Issachar (<a href=\"#\" onClick=\"return mV('1Sa',30,27);\">1Sa 30:27</a>; <a href=\"#\" onClick=\"return mV('1Ch',6,73);\">1Ch 6:73</a>), the same as Jarmuth (<a href=\"#\" onClick=\"return mV('Jos',21,29);\">Jos 21:29</a>) and Remeth (q.v.), <a href=\"#\" onClick=\"return mV('Jos',19,21);\">19:21</a>.";
eastonArray["$$T0003070"] = "<strong>Ramoth-gilead:</strong> heights of Gilead, a city of refuge on the east of Jordan; called \"Ramoth in Gilead\" (<a href=\"#\" onClick=\"return mV('Deu',4,43);\">Deu 4:43</a>; <a href=\"#\" onClick=\"return mV('Jos',20,8);\">Jos 20:8</a>; <a href=\"#\" onClick=\"return mV('Jos',21,38);\">21:38</a>). Here Ahab, who joined Jehoshaphat in an endeavour to rescue it from the hands of the king of Syria, was mortally wounded (<a href=\"#\" onClick=\"return mV('1Ki',22,'1-36');\">1Ki 22:1-36</a>). A similar attempt was afterwards made by Ahaziah and Joram, when the latter was wounded (<a href=\"#\" onClick=\"return mV('2Ki',8,28);\">2Ki 8:28</a>). In this city Jehu, the son of Jehoshaphat, was anointed by one of the sons of the prophets (<a href=\"#\" onClick=\"return mV('2Ki',9,1,4);\">9:1, 4</a>).<br><br>It has with probability been identified with Reimun, on the northern slope of the Jabbok, about 5 miles west of Jerash or Gerasa, one of the cities of Decapolis. Others identify it with Gerosh, about 25 miles north-east of es-Salt, with which also many have identified it. (See RAMATH-MIZPEH <a href=\"#\" onClick=\"return doDictLookup ('ET0003066');\">T0003066</a>.)";
eastonArray["$$T0003071"] = "<strong>Ranges:</strong><br><br>(1.) <a href=\"#\" onClick=\"return mV('Lev',11,35);\">Lev 11:35</a>. Probably a cooking furnace for two or more pots, as the Hebrew word here is in the dual number; or perhaps a fire-place fitted to receive a pair of ovens.<br><br>(2.) <a href=\"#\" onClick=\"return mV('2Ki',11,8);\">2Ki 11:8</a>. A Hebrew word is here used different from the preceding, meaning \"ranks of soldiers.\" The Levites were appointed to guard the king's person within the temple (<a href=\"#\" onClick=\"return mV('2Ch',23,7);\">2Ch 23:7</a>), while the soldiers were his guard in the court, and in going from the temple to the palace. The soldiers are here commanded to slay any one who should break through the \"ranks\" (as rendered in the R.V.) to come near the king. In a href=\"#\" onClick=\"return mV('2Ki',11,15);\">2 Kings 11:15</a> the expression, \"Have her forth without the ranges,\" is in the Revised Version, \"Have her forth between the ranks;\" i.e., Jehoiada orders that Athaliah should be kept surrounded by his own guards, and at the same time conveyed beyond the precincts of the temple.";
eastonArray["$$T0003072"] = "<strong>Ransom:</strong> the price or payment made for our redemption, as when it is said that the Son of man \"gave his life a ransom for many\" (<a href=\"#\" onClick=\"return mV('Mat',20,28);\">Mat 20:28</a>; <a href=\"#\" onClick=\"return mV('Act',20,28);\">Act 20:28</a>; <a href=\"#\" onClick=\"return mV('Rom',3,23,24);\">Rom 3:23-24</a>; <a href=\"#\" onClick=\"return mV('1Cr',6,19,20);\">1Cr 6:19-20</a>; <a href=\"#\" onClick=\"return mV('Gal',3,13);\">Gal 3:13</a>; <a href=\"#\" onClick=\"return mV('Gal',4,4,5);\">4:4-5</a>; <a href=\"#\" onClick=\"return mV('Eph',1,7);\">Eph 1:7</a>; <a href=\"#\" onClick=\"return mV('Col',1,14);\">Col 1:14</a>; <a href=\"#\" onClick=\"return mV('1Ti',2,6);\">1Ti 2:6</a>; <a href=\"#\" onClick=\"return mV('Tts',2,14);\">Tts 2:14</a>; <a href=\"#\" onClick=\"return mV('1Pe',1,18,19);\">1Pe 1:18-19</a>). In all these passages the same idea is expressed. This word is derived from the Fr. rancon; Lat. redemptio. The debt is represented not as cancelled but as fully paid. The slave or captive is not liberated by a mere gratuitous favour, but a ransom price has been paid, in consideration of which he is set free. The original owner receives back his alienated and lost possession because he has bought it back \"with a price.\" This price or ransom (Gr. lutron) is always said to be Christ, his blood, his death. He secures our redemption by the payment of a ransom. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003084');\">REDEMPTION</a>.)";
eastonArray["$$T0003073"] = "<strong>Rapha:</strong> tall.<br><br>(1.) A Benjamite, the son of Binea (<a href=\"#\" onClick=\"return mV('1Ch',8,2,37);\">1Ch 8:2, 37</a>), a descendant of Saul.<br><br>(2.) Margin of <a href=\"#\" onClick=\"return mV('1Ch',20,4,6);\">1Ch 20:4, 6</a>, where \"giant\" is given in the text.";
eastonArray["$$T0003074"] = "<strong>Raphu:</strong> healed, a Benjamite, whose son Palti was one of the twelve spies (<a href=\"#\" onClick=\"return mV('Num',13,9);\">Num 13:9</a>).";
eastonArray["$$T0003075"] = "<strong>Raven:</strong> Heb. 'orebh, from a root meaning \"to be black\" (<a href=\"#\" onClick=\"return mV('Sgs',5,11);\">Sgs 5:11</a>); first mentioned as \"sent forth\" by Noah from the ark (<a href=\"#\" onClick=\"return mV('Gen',8,7);\">Gen 8:7</a>). \"Every raven after his kind\" was forbidden as food (<a href=\"#\" onClick=\"return mV('Lev',11,15);\">Lev 11:15</a>; <a href=\"#\" onClick=\"return mV('Deu',14,14);\">Deu 14:14</a>). Ravens feed mostly on carrion, and hence their food is procured with difficulty (<a href=\"#\" onClick=\"return mV('Job',38,41);\">Job 38:41</a>; <a href=\"#\" onClick=\"return mV('Psa',147,9);\">Psa 147:9</a>). When they attack kids or lambs or weak animals, it is said that they first pick out the eyes of their victims (<a href=\"#\" onClick=\"return mV('Pro',30,17);\">Pro 30:17</a>). When Elijah was concealed by the brook Cherith, God commanded the ravens to bring him \"bread and flesh in the morning, and bread and flesh in the evening\" (<a href=\"#\" onClick=\"return mV('1Ki',17,'3-6');\">1Ki 17:3-6</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0001167');\">ELIJAH</a>.)<br><br>There are eight species of ravens in Palestine, and they are everywhere very numerous in that land.";
eastonArray["$$T0003076"] = "<strong>Razor:</strong> The Nazarites were forbidden to make use of the razor (<a href=\"#\" onClick=\"return mV('Num',6,5);\">Num 6:5</a>; <a href=\"#\" onClick=\"return mV('Jdg',13,5);\">Jdg 13:5</a>). At their consecration the Levites were shaved all over with a razor (<a href=\"#\" onClick=\"return mV('Num',8,7);\">Num 8:7</a>; <a href=\"#\" onClick=\"return mV('Psa',52,2);\">Psa 52:2</a>; <a href=\"#\" onClick=\"return mV('Eze',5,1);\">Eze 5:1</a>).";
eastonArray["$$T0003077"] = "<strong>Reba:</strong> fourth, one of the Midianite chiefs slain by the Israelites in the wilderness (<a href=\"#\" onClick=\"return mV('Num',31,8);\">Num 31:8</a>; <a href=\"#\" onClick=\"return mV('Jos',13,21);\">Jos 13:21</a>).";
eastonArray["$$T0003078"] = "<strong>Rebekah:</strong> a noose, the daughter of Bethuel, and the wife of Isaac (<a href=\"#\" onClick=\"return mV('Gen',22,23);\">Gen 22:23</a>; <a href=\"#\" onClick=\"return mV('Gen',24,67);\">24:67</a>). The circumstances under which Abraham's \"steward\" found her at the \"city of Nahor,\" in Padan-aram, are narrated in <a href=\"#\" onClick=\"return mV('Gen',24,'1-');\">Gen 24-27</a>. \"She can hardly be regarded as an amiable woman. When we first see her she is ready to leave her father's house for ever at an hour's notice; and her future life showed not only a full share of her brother Laban's duplicity, but the grave fault of partiality in her relations to her children, and a strong will, which soon controlled the gentler nature of her husband.\" The time and circumstances of her death are not recorded, but it is said that she was buried in the cave of Machpelah (<a href=\"#\" onClick=\"return mV('Gen',49,31);\">Gen 49:31</a>).";
eastonArray["$$T0003079"] = "<strong>Rechab:</strong> horseman, or chariot.<br><br>(1.) One of Ishbosheth's \"captains of bands\" or leaders of predatory troops (<a href=\"#\" onClick=\"return mV('2Sa',4,2);\">2Sa 4:2</a>).<br><br>(2.) The father of Jehonadab, who was the father of the Rechabites (<a href=\"#\" onClick=\"return mV('2Ki',10,15,23);\">2Ki 10:15, 23</a>; <a href=\"#\" onClick=\"return mV('Jer',35,'6-19');\">Jer 35:6-19</a>).";
eastonArray["$$T0003080"] = "<strong>Rechabites:</strong> the descendants of Rechab through Jonadab or Jehonadab. They belonged to the Kenites, who accompanied the children of Israel into Palestine, and dwelt among them. Moses married a Kenite wife (<a href=\"#\" onClick=\"return mV('Jdg',1,16);\">Jdg 1:16</a>), and Jael was the wife of \"Heber the Kenite\" (<a href=\"#\" onClick=\"return mV('Jdg',4,17);\">4:17</a>). Saul also showed kindness to the Kenites (<a href=\"#\" onClick=\"return mV('1Sa',15,6);\">1Sa 15:6</a>). The main body of the Kenites dwelt in cities, and adopted settled habits of life (<a href=\"#\" onClick=\"return mV('1Sa',30,29);\">30:29</a>); but Jehonadab forbade his descendants to drink wine or to live in cities. They were commanded to lead always a nomad life. They adhered to the law laid down by Jonadab, and were noted for their fidelity to the old-established custom of their family in the days of Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',35,'1-')\">Jer 35</a>); and this feature of their character is referred to by the prophet for the purpose of giving point to his own exhortation. They are referred to in <a href=\"#\" onClick=\"return mV('Neh',3,14);\">Neh 3:14</a> and <a href=\"#\" onClick=\"return mV('1Ch',2,55);\">1Ch 2:55</a>. Dr. Wolff (1839) found in Arabia, near Mecca, a tribe claiming to be descendants of Jehonadab; and recently a Bedouin tribe has been found near the Dead Sea who also profess to be descendants of the same Kenite chief.";
eastonArray["$$T0003081"] = "<strong>Reconcilation:</strong> a change from enmity to friendship. It is mutual, i.e., it is a change wrought in both parties who have been at enmity.<br><br>(1.) In <a href=\"#\" onClick=\"return mV('Col',1,21,22);\">Col 1:21-22</a>, the word there used refers to a change wrought in the personal character of the sinner who ceases to be an enemy to God by wicked works, and yields up to him his full confidence and love. In <a href=\"#\" onClick=\"return mV('2Cr',5,20);\">2Cr 5:20</a> the apostle beseeches the Corinthians to be \"reconciled to God\", i.e., to lay aside their enmity.<br><br>(2.) <a href=\"#\" onClick=\"return mV('Rom',5,10);\">Rom 5:10</a> refers not to any change in our disposition toward God, but to God himself, as the party reconciled. <a href=\"#\" onClick=\"return mV('Rom',5,11);\">Romans 5:11</a> teaches the same truth. From God we have received \"the reconciliation\" (R.V.), i.e., he has conferred on us the token of his friendship. So also <a href=\"#\" onClick=\"return mV('2Cr',5,18,19);\">2Cr 5:18-19</a> speaks of a reconciliation originating with God, and consisting in the removal of his merited wrath. In <a href=\"#\" onClick=\"return mV('Eph',2,16);\">Eph 2:16</a> it is clear that the apostle does not refer to the winning back of the sinner in love and loyalty to God, but to the restoration of God's forfeited favour. This is effected by his justice being satisfied, so that he can, in consistency with his own nature, be favourable toward sinners. Justice demands the punishment of sinners. The death of Christ satisfies justice, and so reconciles God to us. This reconciliation makes God our friend, and enables him to pardon and save us. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000362');\">ATONEMENT</a>.)";
eastonArray["$$T0003082"] = "<strong>Recorder:</strong> (Heb. mazkir, i.e., \"the mentioner,\" \"rememberancer\"), the office first held by Jehoshaphat in the court of David (<a href=\"#\" onClick=\"return mV('2Sa',8,16);\">2Sa 8:16</a>), also in the court of Solomon (<a href=\"#\" onClick=\"return mV('1Ki',4,3);\">1Ki 4:3</a>). The next recorder mentioned is Joah, in the reign of Hezekiah (<a href=\"#\" onClick=\"return mV('2Ki',18,18,37);\">2Ki 18:18, 37</a>; <a href=\"#\" onClick=\"return mV('Isa',36,3,22);\">Isa 36:3, 22</a>). In the reign of Josiah another of the name of Joah filled this office (<a href=\"#\" onClick=\"return mV('2Ch',34,8);\">2Ch 34:8</a>). The \"recorder\" was the chancellor or vizier of the kingdom. He brought all weighty matters under the notice of the king, \"such as complaints, petitions, and wishes of subjects or foreigners. He also drew up papers for the king's guidance, and prepared drafts of the royal will for the scribes. All treaties came under his oversight; and he had the care of the national archives or records, to which, as royal historiographer, like the same state officer in Assyria and Egypt, he added the current annals of the kingdom.\"";
eastonArray["$$T0003083"] = "<strong>Redeemer:</strong> Heb. goel; i.e., one charged with the duty of restoring the rights of another and avenging his wrongs (<a href=\"#\" onClick=\"return mV('Lev',25,48,49);\">Lev 25:48-49</a>; <a href=\"#\" onClick=\"return mV('Num',5,8);\">Num 5:8</a>; <a href=\"#\" onClick=\"return mV('Rth',4,1);\">Rth 4:1</a>; <a href=\"#\" onClick=\"return mV('Job',19,25);\">Job 19:25</a>; <a href=\"#\" onClick=\"return mV('Psa',19,14);\">Psa 19:14</a>; <a href=\"#\" onClick=\"return mV('Psa',78,35);\">78:35</a>, etc.). This title is peculiarly applied to Christ. He redeems us from all evil by the payment of a ransom (q.v.). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003084');\">REDEMPTION</a>.)";
eastonArray["$$T0003084"] = "<strong>Redemption:</strong> the purchase back of something that had been lost, by the payment of a ransom. The Greek word so rendered is <i>apolutrosis</i>, a word occurring nine times in Scripture, and always with the idea of a ransom or price paid, i.e., redemption by a lutron (see <a href=\"#\" onClick=\"return mV('Mat',20,28);\">Mat 20:28</a>; <a href=\"#\" onClick=\"return mV('Mar',10,45);\">Mar 10:45</a>). There are instances in the LXX. Version of the Old Testament of the use of <i>lutron</i> in man's relation to man (<a href=\"#\" onClick=\"return mV('Lev',19,20);\">Lev 19:20</a>; <a href=\"#\" onClick=\"return mV('Lev',25,51);\">25:51</a>; <a href=\"#\" onClick=\"return mV('Exd',21,30);\">Exd 21:30</a>; <a href=\"#\" onClick=\"return mV('Num',35,31,32);\">Num 35:31-32</a>; <a href=\"#\" onClick=\"return mV('Isa',45,13);\">Isa 45:13</a>; <a href=\"#\" onClick=\"return mV('Pro',6,35);\">Pro 6:35</a>), and in the same sense of man's relation to God (<a href=\"#\" onClick=\"return mV('Num',3,49);\">Num 3:49</a>; <a href=\"#\" onClick=\"return mV('Num',18,15);\">18:15</a>).<br><br>There are many passages in the New Testament which represent Christ's sufferings under the idea of a ransom or price, and the result thereby secured is a purchase or redemption (<a href=\"#\" onClick=\"return mV('Act',20,28);\">Act 20:28</a>; <a href=\"#\" onClick=\"return mV('1Cr',6,19,20);\">1Cr 6:19-20</a>; <a href=\"#\" onClick=\"return mV('Gal',3,13);\">Gal 3:13</a>; <a href=\"#\" onClick=\"return mV('Gal',4,4,5);\">4:4-5</a>; <a href=\"#\" onClick=\"return mV('Eph',1,7);\">Eph 1:7</a>; <a href=\"#\" onClick=\"return mV('Col',1,14);\">Col 1:14</a>; <a href=\"#\" onClick=\"return mV('1Ti',2,5,6);\">1Ti 2:5-6</a>; <a href=\"#\" onClick=\"return mV('Tts',2,14);\">Tts 2:14</a>; <a href=\"#\" onClick=\"return mV('Hbr',9,12);\">Hbr 9:12</a>; <a href=\"#\" onClick=\"return mV('1Pe',1,18,19);\">1Pe 1:18-19</a>; <a href=\"#\" onClick=\"return mV('Rev',5,9);\">Rev 5:9</a>). The idea running through all these texts, however various their reference, is that of payment made for our redemption. The debt against us is not viewed as simply cancelled, but is fully paid. Christ's blood or life, which he surrendered for them, is the \"ransom\" by which the deliverance of his people from the servitude of sin and from its penal consequences is secured. It is the plain doctrine of Scripture that \"Christ saves us neither by the mere exercise of power, nor by his doctrine, nor by his example, nor by the moral influence which he exerted, nor by any subjective influence on his people, whether natural or mystical, but as a satisfaction to divine justice, as an expiation for sin, and as a ransom from the curse and authority of the law, thus reconciling us to God by making it consistent with his perfection to exercise mercy toward sinners\" (Hodge's Systematic Theology).";
eastonArray["$$T0003085"] = "<strong>Red Sea:</strong> The sea so called extends along the west coast of Arabia for about 1,400 miles, and separates Asia from Africa. It is connected with the Indian Ocean, of which it is an arm, by the Strait of Bab-el-Mandeb. At a point (Ras Mohammed) about 200 miles from its nothern extremity it is divided into two arms, that on the east called the AElanitic Gulf, now the Bahr el-'Akabah, about 100 miles long by 15 broad, and that on the west the Gulf of Suez, about 150 miles long by about 20 broad. This branch is now connected with the Mediterranean by the Suez Canal. Between these two arms lies the Sinaitic Peninsula.<br><br>The Hebrew name generally given to this sea is <i>Yam Suph</i>. This word <i>suph</i> means a woolly kind of sea-weed, which the sea casts up in great abundance on its shores. In these passages, <a href=\"#\" onClick=\"return mV('Exd',10,19);\">Exd 10:19</a>; <a href=\"#\" onClick=\"return mV('Exd',13,18);\">13:18</a>; <a href=\"#\" onClick=\"return mV('Exd',15,4,22);\">15:4, 22</a>; <a href=\"#\" onClick=\"return mV('Exd',23,31);\">23:31</a>; <a href=\"#\" onClick=\"return mV('Num',14,25);\">Num 14:25</a>, etc., the Hebrew name is always translated \"Red Sea,\" which was the name given to it by the Greeks. The origin of this name (Red Sea) is uncertain. Some think it is derived from the red colour of the mountains on the western shore; others from the red coral found in the sea, or the red appearance sometimes given to the water by certain zoophytes floating in it. In the New Testament (<a href=\"#\" onClick=\"return mV('Act',7,36);\">Act 7:36</a>; <a href=\"#\" onClick=\"return mV('Hbr',11,29);\">Hbr 11:29</a>) this name is given to the Gulf of Suez.<br><br>This sea was also called by the Hebrews Yam-mitstraim, i.e., \"the Egyptian sea\" (<a href=\"#\" onClick=\"return mV('Isa',11,15);\">Isa 11:15</a>), and simply Ha-yam, \"the sea\" (<a href=\"#\" onClick=\"return mV('Exd',14,2,9,16,21,28);\">Exd 14:2, 9, 16, 21, 28</a>; <a href=\"#\" onClick=\"return mV('Jos',24,6,7);\">Jos 24:6-7</a>; <a href=\"#\" onClick=\"return mV('Isa',10,26);\">Isa 10:26</a>, etc.).<br><br>The great historical event connected with the Red Sea is the passage of the children of Israel, and the overthrow of the Egyptians, to which there is frequent reference in Scripture (<a href=\"#\" onClick=\"return mV('Exd',14,'1-');\">Exd 14</a>; <a href=\"#\" onClick=\"return mV('Exd',15,'1-');\">15</a>; <a href=\"#\" onClick=\"return mV('Num',33,8);\">Num 33:8</a>; <a href=\"#\" onClick=\"return mV('Deu',11,4);\">Deu 11:4</a>; <a href=\"#\" onClick=\"return mV('Jos',2,10);\">Jos 2:10</a>; <a href=\"#\" onClick=\"return mV('Jdg',11,16);\">Jdg 11:16</a>; <a href=\"#\" onClick=\"return mV('2Sa',22,16);\">2Sa 22:16</a>; <a href=\"#\" onClick=\"return mV('Neh',9,'9-11');\">Neh 9:9-11</a>; <a href=\"#\" onClick=\"return mV('Psa',66,6);\">Psa 66:6</a>; <a href=\"#\" onClick=\"return mV('Isa',10,26);\">Isa 10:26</a>; <a href=\"#\" onClick=\"return mV('Act',7,36);\">Act 7:36</a>, etc.).";
eastonArray["$$T0003086"] = "<strong>Red Sea, Passage of:</strong> The account of the march of the Israelites through the Red Sea is given in <a href=\"#\" onClick=\"return mV('Exd',14,'22-31');\">Exd 14:22-31</a>. There has been great diversity of opinion as to the precise place where this occurred. The difficulty of arriving at any definite conclusion on the matter is much increased by the consideration that the head of the Gulf of Suez, which was the branch of the sea that was crossed, must have extended at the time of the Exodus probably 50 miles farther north than it does at present. Some have argued that the crossing took place opposite the Wady Tawarik, where the sea is at present some 7 miles broad. But the opinion that seems to be best supported is that which points to the neighbourhood of Suez. This position perfectly satisfies all the conditions of the stupendous miracle as recorded in the sacred narrative. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0001283');\">EXODUS</a>.)";
eastonArray["$$T0003087"] = "<strong>Reed:</strong><br><br>(1.) \"Paper reeds\" (<a href=\"#\" onClick=\"return mV('Isa',19,7);\">Isa 19:7</a>; R.V., \"reeds\"). Heb. 'aroth, properly green herbage growing in marshy places.<br><br>(2.) Heb. kaneh (<a href=\"#\" onClick=\"return mV('1Ki',14,15);\">1Ki 14:15</a>; <a href=\"#\" onClick=\"return mV('Job',40,21);\">Job 40:21</a>; <a href=\"#\" onClick=\"return mV('Isa',19,6);\">Isa 19:6</a>), whence the Gr. kanna, a \"cane,\" a generic name for a reed of any kind.<br><br>The reed of Egypt and Palestine is the <i>Arundo donax</i>, which grows to the height of 12 feet, its stalk jointed like the bamboo, \"with a magnificent panicle of blossom at the top, and so slender and yielding that it will lie perfectly flat under a gust of wind, and immediately resume its upright position.\" It is used to illustrate weakness (<a href=\"#\" onClick=\"return mV('2Ki',18,21);\">2Ki 18:21</a>; <a href=\"#\" onClick=\"return mV('Eze',29,6);\">Eze 29:6</a>), also fickleness or instability (<a href=\"#\" onClick=\"return mV('Mat',11,7);\">Mat 11:7</a>; <a href=\"#\" onClick=\"return mV('Eph',4,14);\">Eph 4:14</a>).<br><br>A \"bruised reed\" (<a href=\"#\" onClick=\"return mV('Isa',42,3);\">Isa 42:3</a>; <a href=\"#\" onClick=\"return mV('Mat',12,20);\">Mat 12:20</a>) is an emblem of a believer weak in grace. A reed was put into our Lord's hands in derision (<a href=\"#\" onClick=\"return mV('Mat',27,29);\">Mat 27:29</a>); and \"they took the reed and smote him on the head\" (<a href=\"#\" onClick=\"return mV('Mat',27,30);\">30</a>). The \"reed\" on which they put the sponge filled with vinegar (<a href=\"#\" onClick=\"return mV('Mat',27,48);\">Mat 27:48</a>) was, according to John (<a href=\"#\" onClick=\"return mV('Jhn',19,29);\">Jhn 19:29</a>), a hyssop stalk, which must have been of some length, or perhaps a bunch of hyssop twigs fastened to a rod with the sponge. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000710');\">CANE</a>.)";
eastonArray["$$T0003088"] = "<strong>Refiner:</strong> The process of refining metals is referred to by way of illustrations in <a href=\"#\" onClick=\"return mV('Isa',1,25);\">Isa 1:25</a>; <a href=\"#\" onClick=\"return mV('Jer',6,29);\">Jer 6:29</a>; <a href=\"#\" onClick=\"return mV('Zec',13,9);\">Zec 13:9</a>; <a href=\"#\" onClick=\"return mV('Mal',3,2,3);\">Mal 3:2-3</a>.";
eastonArray["$$T0003089"] = "<strong>Refuge, Cities of:</strong> were six in number (<a href=\"#\" onClick=\"return mV('Num',35,'1-')\">Num 35</a>).<br><br>1. On the west of Jordan were<br><br>(1) Kadesh, in Naphtali;<br><br>(2) Shechem, in Mount Ephraim;<br><br>(3) Hebron, in Judah.<br><br>2. On the east of Jordan were,<br><br>(1) Golan, in Bashan;<br><br>(2) Ramoth-Gilead, in Gad; and<br><br>(3) Bezer, in Reuben. (See under each of these names.)";
eastonArray["$$T0003090"] = "<strong>Regem-melech:</strong> friend of the king, one of the two messengers sent by the exiled Jews to Jerusalem in the time of Darius (<a href=\"#\" onClick=\"return mV('Zec',7,2);\">Zec 7:2</a>) to make inquiries at the temple.";
eastonArray["$$T0003091"] = "<strong>Regeneration:</strong> only found in <a href=\"#\" onClick=\"return mV('Mat',19,28);\">Mat 19:28</a> and <a href=\"#\" onClick=\"return mV('Tts',3,5);\">Tts 3:5</a>. This word literally means a \"new birth.\" The Greek word so rendered (palingenesia) is used by classical writers with reference to the changes produced by the return of spring. In <a href=\"#\" onClick=\"return mV('Mat',19,28);\">Mat 19:28</a> the word is equivalent to the \"restitution of all things\" (<a href=\"#\" onClick=\"return mV('Act',3,21);\">Act 3:21</a>). In <a href=\"#\" onClick=\"return mV('Tts',3,5);\">Tts 3:5</a> it denotes that change of heart elsewhere spoken of as a passing from death to life (<a href=\"#\" onClick=\"return mV('1Jo',3,14);\">1Jo 3:14</a>); becoming a new creature in Christ Jesus (<a href=\"#\" onClick=\"return mV('2Cr',5,17);\">2Cr 5:17</a>); being born again (<a href=\"#\" onClick=\"return mV('Jhn',3,5);\">Jhn 3:5</a>); a renewal of the mind (<a href=\"#\" onClick=\"return mV('Rom',12,2);\">Rom 12:2</a>); a resurrection from the dead (<a href=\"#\" onClick=\"return mV('Eph',2,6);\">Eph 2:6</a>); a being quickened (<a href=\"#\" onClick=\"return mV('Eph',2,1,5);\">2:1, 5</a>).<br><br>This change is ascribed to the Holy Spirit. It originates not with man but with God (<a href=\"#\" onClick=\"return mV('Jhn',1,12,13);\">Jhn 1:12-13</a>; <a href=\"#\" onClick=\"return mV('1Jo',2,29);\">1Jo 2:29</a>; <a href=\"#\" onClick=\"return mV('1Jo',5,1,4);\">5:1, 4</a>).<br><br>As to the nature of the change, it consists in the implanting of a new principle or disposition in the soul; the impartation of spiritual life to those who are by nature \"dead in trespasses and sins.\"<br><br>The necessity of such a change is emphatically affirmed in Scripture (<a href=\"#\" onClick=\"return mV('Jhn',3,3);\">Jhn 3:3</a>; <a href=\"#\" onClick=\"return mV('Rom',7,18);\">Rom 7:18</a>; <a href=\"#\" onClick=\"return mV('Rom',8,'7-9');\">8:7-9</a>; <a href=\"#\" onClick=\"return mV('1Cr',2,14);\">1Cr 2:14</a>; <a href=\"#\" onClick=\"return mV('Eph',2,1);\">Eph 2:1</a>; <a href=\"#\" onClick=\"return mV('Eph',4,'21-24');\">4:21-24</a>).";
eastonArray["$$T0003092"] = "<strong>Rehabiah:</strong> enlargement of the Lord, the son of Eliezer, and grandson of Moses (<a href=\"#\" onClick=\"return mV('1Ch',23,17);\">1Ch 23:17</a>; <a href=\"#\" onClick=\"return mV('1Ch',24,21);\">24:21</a>).";
eastonArray["$$T0003093"] = "<strong>Rehob:</strong> street; broad place.<br><br>(1.) The father of Hadadezer, king of Tobah (<a href=\"#\" onClick=\"return mV('2Sa',8,3,12);\">2Sa 8:3, 12</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('Neh',10,11);\">Neh 10:11</a>.<br><br>(3.) The same, probably, as Beth-rehob (<a href=\"#\" onClick=\"return mV('2Sa',10,6,8);\">2Sa 10:6, 8</a>; <a href=\"#\" onClick=\"return mV('Jdg',18,28);\">Jdg 18:28</a>), a place in the north of Palestine (<a href=\"#\" onClick=\"return mV('Num',13,21);\">Num 13:21</a>). It is now supposed to be represented by the castle of Hunin, south-west of Dan, on the road from Hamath into Coele-Syria.<br><br>(4.) A town of Asher (<a href=\"#\" onClick=\"return mV('Jos',19,28);\">Jos 19:28</a>), to the east of Zidon.<br><br>(5.) Another town of Asher (<a href=\"#\" onClick=\"return mV('Jos',19,30);\">Jos 19:30</a>), kept possession of by the Canaanites (<a href=\"#\" onClick=\"return mV('Jdg',1,31);\">Jdg 1:31</a>).";
eastonArray["$$T0003094"] = "<strong>Rehoboam:</strong> he enlarges the people, the successor of Solomon on the throne, and apparently his only son. He was the son of Naamah \"the Ammonitess,\" some well-known Ammonitish princess (<a href=\"#\" onClick=\"return mV('1Ki',14,21);\">1Ki 14:21</a>; <a href=\"#\" onClick=\"return mV('2Ch',12,13);\">2Ch 12:13</a>). He was forty-one years old when he ascended the throne, and he reigned seventeen years (B.C. 975-958). Although he was acknowledged at once as the rightful heir to the throne, yet there was a strongly-felt desire to modify the character of the government. The burden of taxation to which they had been subjected during Solomon's reign was very oppressive, and therefore the people assembled at Shechem and demanded from the king an alleviation of their burdens. He went to meet them at Shechem, and heard their demands for relief (<a href=\"#\" onClick=\"return mV('1Ki',12,4);\">1Ki 12:4</a>). After three days, having consulted with a younger generation of courtiers that had grown up around him, instead of following the advice of elders, he answered the people haughtily (<a href=\"#\" onClick=\"return mV('1Ki',12,'6-15');\">1Ki 12:6-15</a>). \"The king hearkened not unto the people; for the cause was from the Lord\" (<a href=\"#\" onClick=\"return mV('1Ki',11,31);\">1Ki 11:31</a>). This brought matters speedily to a crisis. The terrible cry was heard (<a href=\"#\" onClick=\"return mV('2Sa',20,1);\">2Sa 20:1</a>):<br><br>\"What portion have we in David? Neither have we inheritance in the son of Jesse: To your tents, O Israel: Now see to thine own house, David\" (<a href=\"#\" onClick=\"return mV('1Ki',12,16);\">1Ki 12:16</a>).<br><br>And now at once the kingdom was rent in twain. Rehoboam was appalled, and tried concessions, but it was too late (<a href=\"#\" onClick=\"return mV('1Ki',12,18);\">18</a>). The tribe of Judah, Rehoboam's own tribe, alone remained faithful to him. Benjamin was reckoned along with Judah, and these two tribes formed the southern kingdom, with Jerusalem as its capital; while the northern ten tribes formed themselves into a separate kingdom, choosing Jeroboam as their king. Rehoboam tried to win back the revolted ten tribes by making war against them, but he was prevented by the prophet Shemaiah (<a href=\"#\" onClick=\"return mV('1Ki',12,'21-24');\">21-24</a>; <a href=\"#\" onClick=\"return mV('2Ch',11,'1-4');\">2Ch 11:1-4</a>) from fulfilling his purpose. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002038');\">JEROBOAM</a>.)<br><br>In the fifth year of Rehoboam's reign, Shishak (q.v.), one of the kings of Egypt of the Assyrian dynasty, stirred up, no doubt, by Jeroboam his son-in-law, made war against him. Jerusalem submitted to the invader, who plundered the temple and virtually reduced the kingdom to the position of a vassal of Egypt (<a href=\"#\" onClick=\"return mV('1Ki',14,25,26);\">1Ki 14:25-26</a>; <a href=\"#\" onClick=\"return mV('2Ch',12,'5-9');\">2Ch 12:5-9</a>). A remarkable memorial of this invasion has been discovered at Karnac, in Upper Egypt, in certain sculptures on the walls of a small temple there. These sculptures represent the king, Shishak, holding in his hand a train of prisoners and other figures, with the names of the captured towns of Judah, the towns which Rehoboam had fortified (<a href=\"#\" onClick=\"return mV('2Ch',11,'5-12');\">2Ch 11:5-12</a>).<br><br>The kingdom of Judah, under Rehoboam, sank more and more in moral and spiritual decay. \"There was war between Rehoboam and Jeroboam all their days.\" At length, in the fifty-eighth year of his age, Rehoboam \"slept with his fathers, and was buried with his fathers in the city of David\" (<a href=\"#\" onClick=\"return mV('1Ki',14,31);\">1Ki 14:31</a>). He was succeeded by his son Abijah. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0001137');\">EGYPT</a>.)";
eastonArray["$$T0003095"] = "<strong>Rehoboth:</strong> broad places.<br><br>(1.) A well in Gerar dug by Isaac (<a href=\"#\" onClick=\"return mV('Gen',26,22);\">Gen 26:22</a>), supposed to be in Wady er-Ruheibeh, about 20 miles south of Beersheba.<br><br>(2.) An ancient city on the Euphrates (<a href=\"#\" onClick=\"return mV('Gen',36,37);\">Gen 36:37</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,48);\">1Ch 1:48</a>), \"Rehoboth by the river.\"<br><br>(3.) Named among the cities of Asshur (<a href=\"#\" onClick=\"return mV('Gen',10,11);\">Gen 10:11</a>). Probably, however, the words \"rehoboth'ir\" are to be translated as in the Vulgate and the margin of A.V., \"the streets of the city,\" or rather \"the public square of the city\", i.e., of Nineveh.";
eastonArray["$$T0003096"] = "<strong>Rehum:</strong> merciful.<br><br>(1.) One of \"the children of the province\" who returned from the Captivity (<a href=\"#\" onClick=\"return mV('Ezr',2,2);\">Ezr 2:2</a>); the same as \"Nehum\" (<a href=\"#\" onClick=\"return mV('Neh',7,7);\">Neh 7:7</a>).<br><br>(2.) The \"chancellor\" of Artaxerxes, who sought to stir him up against the Jews (<a href=\"#\" onClick=\"return mV('Ezr',4,'8-24');\">Ezr 4:8-24</a>) and prevent the rebuilding of the walls and the temple of Jerusalem.<br><br>(3.) A Levite (<a href=\"#\" onClick=\"return mV('Neh',3,17);\">Neh 3:17</a>).<br><br>(4.) <a href=\"#\" onClick=\"return mV('Neh',10,25);\">Neh 10:25</a>.<br><br>(5.) A priest (<a href=\"#\" onClick=\"return mV('Neh',12,3);\">Neh 12:3</a>).";
eastonArray["$$T0003097"] = "<strong>Rei:</strong> friendly, one who maintained true allegiance to king David (<a href=\"#\" onClick=\"return mV('1Ki',1,8);\">1Ki 1:8</a>) when Adonijah rebelled.";
eastonArray["$$T0003098"] = "<strong>Reins:</strong> the kidneys, the supposed seat of the desires and affections; used metaphorically for \"heart.\" The \"reins\" and the \"heart\" are often mentioned together, as denoting the whole moral constitution of man (<a href=\"#\" onClick=\"return mV('Psa',7,9);\">Psa 7:9</a>; <a href=\"#\" onClick=\"return mV('Psa',16,7);\">16:7</a>; <a href=\"#\" onClick=\"return mV('Psa',26,2);\">26:2</a>; <a href=\"#\" onClick=\"return mV('Psa',139,13);\">139:13</a>; <a href=\"#\" onClick=\"return mV('Jer',17,10);\">Jer 17:10</a>, etc.).";
eastonArray["$$T0003099"] = "<strong>Rekem:</strong> embroidered; variegated.<br><br>(1.) One of the five Midianite kings whom the Israelites destroyed (<a href=\"#\" onClick=\"return mV('Num',31,8);\">Num 31:8</a>).<br><br>(2.) One of the sons of Hebron (<a href=\"#\" onClick=\"return mV('1Ch',2,43,44);\">1Ch 2:43-44</a>).<br><br>(3.) A town of Benjamin (<a href=\"#\" onClick=\"return mV('Jos',18,27);\">Jos 18:27</a>).";
