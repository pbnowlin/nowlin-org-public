<script>var eastonArray = new Array ();
eastonArray["$$T0001900"] = "<strong>Ishbi-benob:</strong> my seat at Nob, one of the Rephaim, whose spear was three hundred shekels in weight. He was slain by Abishai (<a href=\"#\" onClick=\"return mV('2Sa',21,16,17);\">2Sa 21:16-17</a>).";
eastonArray["$$T0001901"] = "<strong>Ish-bosheth:</strong> man of shame or humiliation, the youngest of Saul's four sons, and the only one who survived him (<a href=\"#\" onClick=\"return mV('2Sa',21,'2-4');\">2Sa 2-4</a>). His name was originally Eshbaal (<a href=\"#\" onClick=\"return mV('1Ch',8,33);\">1Ch 8:33</a>; <a href=\"#\" onClick=\"return mV('1Ch',9,39);\">9:39</a>). He was about forty years of age when his father and three brothers fell at the battle of Gilboa. Through the influence of Abner, Saul's cousin, he was acknowledged as successor to the throne of Saul, and ruled over all Israel, except the tribe of Judah (over whom David was king), for two years, having Mahanaim, on the east of Jordan, as his capital (<a href=\"#\" onClick=\"return mV('2Sa',2,9);\">2Sa 2:9</a>). After a troubled and uncertain reign he was murdered by his guard, who stabbed him while he was asleep on his couch at mid-day (<a href=\"#\" onClick=\"return mV('2Sa',4,'5-7');\">2Sa 4:5-7</a>); and having cut off his head, presented it to David, who sternly rebuked them for this cold-blooded murder, and ordered them to be immediately executed ((<a href=\"#\" onClick=\"return mV('2Sa',4,'9-12'7');\">9-12</a>).";
eastonArray["$$T0001902"] = "<strong>Ishi:</strong> my husband, a symbolical name used in <a href=\"#\" onClick=\"return mV('Hsa',2,16);\">Hsa 2:16</a> (See <a href=\"#\" onClick=\"return doDictLookup('ET0000394');\">BAALI</a>.)";
eastonArray["$$T0001903"] = "<strong>Ishmael:</strong> God hears.<br><br>(1.) Abraham's eldest son, by Hagar the concubine (<a href=\"#\" onClick=\"return mV('Gen',16,15);\">Gen 16:15</a>; <a href=\"#\" onClick=\"return mV('Gen',17,23);\">17:23</a>). He was born at Mamre, when Abraham was eighty-six years of age, eleven years after his arrival in Canaan (<a href=\"#\" onClick=\"return mV('Gen',16,3);\">16:3</a>; <a href=\"#\" onClick=\"return mV('Gen',21,5);\">21:5</a>). At the age of thirteen he was circumcised (<a href=\"#\" onClick=\"return mV('Gen',17,25);\">17:25</a>). He grew up a true child of the desert, wild and wayward. On the occasion of the weaning of Isaac his rude and wayward spirit broke out in expressions of insult and mockery (<a href=\"#\" onClick=\"return mV('Gen',21,9,10);\">21:9-10</a>); and Sarah, discovering this, said to Abraham, \"Expel this slave and her son.\" Influenced by a divine admonition, Abraham dismissed Hagar and her son with no more than a skin of water and some bread. The narrative describing this act is one of the most beautiful and touching incidents of patriarchal life (<a href=\"#\" onClick=\"return mV('Gen',21,'14-16');\">Gen 21:14-16</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001583');\">HAGAR</a>.)<br><br>Ishmael settled in the land of Paran, a region lying between Canaan and the mountains of Sinai; and \"God was with him, and he became a great archer\" (<a href=\"#\" onClick=\"return mV('Gen',21,'9-21');\">Gen 21:9-21</a>). He became a great desert chief, but of his history little is recorded. He was about ninety years of age when his father Abraham died, in connection with whose burial he once more for a moment reappears. On this occasion the two brothers met after being long separated. \"Isaac with his hundreds of household slaves, Ishmael with his troops of wild retainers and half-savage allies, in all the state of a Bedouin prince, gathered before the cave of Machpelah, in the midst of the men of Heth, to pay the last duties to the 'father of the faithful,' would make a notable subject for an artist\" (<a href=\"#\" onClick=\"return mV('Gen',25,9);\">Gen 25:9</a>). Of the after events of his life but little is known. He died at the age of one hundred and thirty-seven years, but where and when are unknown (<a href=\"#\" onClick=\"return mV('Gen',25,17);\">25:17</a>). He had twelve sons, who became the founders of so many Arab tribes or colonies, the Ishmaelites, who spread over the wide desert spaces of Northern Arabia from the Red Sea to the Euphrates (<a href=\"#\" onClick=\"return mV('Gen',37,25,27,28);\">Gen 37:25, 27-28</a>; <a href=\"#\" onClick=\"return mV('Gen',39,1);\">39:1</a>), \"their hand against every man, and every man's hand against them.\"<br><br>(2.) The son of Nethaniah, \"of the seed royal\" (<a href=\"#\" onClick=\"return mV('Jer',40,8,15);\">Jer 40:8, 15</a>). He plotted against Gedaliah, and treacherously put him and others to death. He carried off many captives, \"and departed to go over to the Ammonites.\"";
eastonArray["$$T0001904"] = "<strong>Ishmaiah:</strong> heard by Jehovah.<br><br>(1.) A Gibeonite who joined David at Ziklag, \"a hero among the thirty and over the thirty\" (<a href=\"#\" onClick=\"return mV('1Ch',12,4);\">1Ch 12:4</a>).<br><br>(2.) Son of Obadiah, and viceroy of Zebulun under David and Solomon (<a href=\"#\" onClick=\"return mV('1Ch',27,19);\">1Ch 27:19</a>).";
eastonArray["$$T0001905"] = "<strong>Ishmeelites:</strong> (<a href=\"#\" onClick=\"return mV('Gen',37,28);\">Gen 37:28</a>; <a href=\"#\" onClick=\"return mV('Gen',39,1);\">39:1</a>, A.V.) should be \"Ishmaelites,\" as in the Revised Version.";
eastonArray["$$T0001906"] = "<strong>Ishtob:</strong> man of Tob, one of the small Syrian kingdoms which together constituted Aram (<a href=\"#\" onClick=\"return mV('2Sa',10,6,8);\">2Sa 10:6, 8</a>).";
eastonArray["$$T0001907"] = "<strong>Island:</strong> (Heb. 'i, \"dry land,\" as opposed to water) occurs in its usual signification (<a href=\"#\" onClick=\"return mV('Isa',42,4,10,12,15);\">Isa 42:4, 10, 12, 15</a>, comp. <a href=\"#\" onClick=\"return mV('Jer',47,4);\">Jer 47:4</a>), but more frequently simply denotes a maritime region or sea-coast (<a href=\"#\" onClick=\"return mV('Isa',20,6);\">Isa 20:6</a>, R.V.,\" coastland; <a href=\"#\" onClick=\"return mV('Isa',23,2,6);\">23:2, 6</a>; <a href=\"#\" onClick=\"return mV('Jer',2,10);\">Jer 2:10</a>; <a href=\"#\" onClick=\"return mV('Eze',27,6,7);\">Eze 27:6-7</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000811');\">CHITTIM</a>.) The shores of the Mediterranean are called the \"islands of the sea\" (<a href=\"#\" onClick=\"return mV('Isa',11,11);\">Isa 11:11</a>), or the \"isles of the Gentiles\" (<a href=\"#\" onClick=\"return mV('Gen',10,5);\">Gen 10:5</a>), and sometimes simply \"isles\" (<a href=\"#\" onClick=\"return mV('Psa',72,10);\">Psa 72:10</a>); <a href=\"#\" onClick=\"return mV('Eze',26,15,18);\">Eze 26:15, 18</a>; <a href=\"#\" onClick=\"return mV('Eze',27,3,35);\">Eze 27:3, 35</a>; <a href=\"#\" onClick=\"return mV('Dan',11,18);\">Dan 11:18</a>).";
eastonArray["$$T0001908"] = "<strong>Israel:</strong> the name conferred on Jacob after the great prayer-struggle at Peniel (<a href=\"#\" onClick=\"return mV('Gen',32,28);\">Gen 32:28</a>), because \"as a prince he had power with God and prevailed.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0001945');\">JACOB</a>.) This is the common name given to Jacob's descendants. The whole people of the twelve tribes are called \"Israelites,\" the \"children of Israel\" (<a href=\"#\" onClick=\"return mV('Jos',3,17);\">Jos 3:17</a>; <a href=\"#\" onClick=\"return mV('Jos',7,25);\">7:25</a>; <a href=\"#\" onClick=\"return mV('Jdg',8,27);\">Jdg 8:27</a>; <a href=\"#\" onClick=\"return mV('Jer',3,21);\">Jer 3:21</a>), and the \"house of Israel\" (<a href=\"#\" onClick=\"return mV('Exd',16,31);\">Exd 16:31</a>; <a href=\"#\" onClick=\"return mV('Exd',40,38);\">40:38</a>).<br><br>This name Israel is sometimes used emphatically for the true Israel (<a href=\"#\" onClick=\"return mV('Psa',73,1);\">Psa 73:1</a>: <a href=\"#\" onClick=\"return mV('Isa',45,17);\">Isa 45:17</a>; <a href=\"#\" onClick=\"return mV('Psa',49,3);\">49:3</a>; <a href=\"#\" onClick=\"return mV('Jhn',1,47);\">Jhn 1:47</a>; <a href=\"#\" onClick=\"return mV('Rom',9,6);\">Rom 9:6</a>; <a href=\"#\" onClick=\"return mV('Rom',11,26);\">11:26</a>).<br><br>After the death of Saul the ten tribes arrogated to themselves this name, as if they were the whole nation (<a href=\"#\" onClick=\"return mV('2Sa',2,9,10,17,28);\">2Sa 2:9-10, 17, 28</a>; <a href=\"#\" onClick=\"return mV('2Sa',3,10,17);\">3:10, 17</a>; <a href=\"#\" onClick=\"return mV('2Sa',19,'40-43');\">19:40-43</a>), and the kings of the ten tribes were called \"kings of Israel,\" while the kings of the two tribes were called \"kings of Judah.\"<br><br>After the Exile the name Israel was assumed as designating the entire nation.";
eastonArray["$$T0001909"] = "<strong>Israel, Kingdom of:</strong> (B.C. 975-B.C. 722). Soon after the death of Solomon, Ahijah's prophecy (<a href=\"#\" onClick=\"return mV('1Ki',11,'31-35');\">1Ki 11:31-35</a>) was fulfilled, and the kingdom was rent in twain. Rehoboam, the son and successor of Solomon, was scarcely seated on his throne when the old jealousies between Judah and the other tribes broke out anew, and Jeroboam was sent for from Egypt by the malcontents (<a href=\"#\" onClick=\"return mV('1Ki',12,2,3);\">12:2-3</a>). Rehoboam insolently refused to lighten the burdensome taxation and services which his father had imposed on his subjects (<a href=\"#\" onClick=\"return mV('1Ki',12,4);\">12:4</a>), and the rebellion became complete. Ephraim and all Israel raised the old cry, \"Every man to his tents, O Israel\" (<a href=\"#\" onClick=\"return mV('2Sa',20,1);\">2Sa 20:1</a>). Rehoboam fled to Jerusalem (<a href=\"#\" onClick=\"return mV('1Ki',12,'1-18');\">1Ki 12:1-18</a>; <a href=\"#\" onClick=\"return mV('2Ch',10,'1-')\">2Ch 10</a>), and Jeroboam was proclaimed king over all Israel at Shechem, Judah and Benjamin remaining faithful to Solomon's son. War, with varying success, was carried on between the two kingdoms for about sixty years, till Jehoshaphat entered into an alliance with the house of Ahab.<br><br>Extent of the kingdom. In the time of Solomon the area of Palestine, excluding the Phoenician territories on the shore of the Mediterranean, did not much exceed 13,000 square miles. The kingdom of Israel comprehended about 9,375 square miles. Shechem was the first capital of this kingdom (<a href=\"#\" onClick=\"return mV('1Ki',12,25);\">1Ki 12:25</a>), afterwards Tirza (<a href=\"#\" onClick=\"return mV('1Ki',14,17);\">14:17</a>). Samaria was subsequently chosen as the capital (<a href=\"#\" onClick=\"return mV('1Ki',16,24);\">16:24</a>), and continued to be so till the destruction of the kingdom by the Assyrians (<a href=\"#\" onClick=\"return mV('2Ki',17,5);\">2Ki 17:5</a>). During the siege of Samaria (which lasted for three years) by the Assyrians, Shalmaneser died and was succeeded by Sargon, who himself thus records the capture of that city: \"Samaria I looked at, I captured; 27,280 men who dwelt in it I carried away\" (<a href=\"#\" onClick=\"return mV('2Ki',17,6);\">2Ki 17:6</a>) into Assyria. Thus after a duration of two hundred and fifty-three years the kingdom of the ten tribes came to an end. They were scattered throughout the East. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000720');\">CAPTIVITY</a>.)<br><br>\"Judah held its ground against Assyria for yet one hundred and twenty-three years, and became the rallying-point of the dispersed of every tribe, and eventually gave its name to the whole race. Those of the people who in the last struggle escaped into the territories of Judah or other neighbouring countries naturally looked to Judah as the head and home of their race. And when Judah itself was carried off to Babylon, many of the exiled Israelites joined them from Assyria, and swelled that immense population which made Babylonia a second Palestine.\"<br><br>After the deportation of the ten tribes, the deserted land was colonized by various eastern tribes, whom the king of Assyria sent thither (<a href=\"#\" onClick=\"return mV('Ezr',4,2,10);\">Ezr 4:2, 10</a>; <a href=\"#\" onClick=\"return mV('2Ki',17,'24-29');\">2Ki 17:24-29</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002190');\">KINGS</a>.)<br><br>In contrast with the kingdom of Judah is that of Israel.<br><br>(1.) \"There was no fixed capital and no religious centre.<br><br>(2.) The army was often insubordinate.<br><br>(3.) The succession was constantly interrupted, so that out of nineteen kings there were no less than nine dynasties, each ushered in by a revolution.<br><br>(4.) The authorized priests left the kingdom in a body, and the priesthood established by Jeroboam had no divine sanction and no promise; it was corrupt at its very source.\" (Maclean's O. T. Hist.)";
eastonArray["$$T0001910"] = "<strong>Issachar:</strong> hired (<a href=\"#\" onClick=\"return mV('Gen',30,18);\">Gen 30:18</a>). \"God hath given me,\" said Leah, \"my hire (Heb. sekhari)...and she called his name Issachar.\" He was Jacob's ninth son, and was born in Padan-aram (<a href=\"#\" onClick=\"return mV('Gen',28,2);\">Gen 28:2</a>). He had four sons at the going down into Egypt (<a href=\"#\" onClick=\"return mV('Gen',46,13);\">46:13</a>; <a href=\"#\" onClick=\"return mV('Num',26,23,25);\">Num 26:23, 25</a>).<br><br>Issachar, Tribe of, during the journey through the wilderness, along with Judah and Zebulun (<a href=\"#\" onClick=\"return mV('Num',2,5);\">Num 2:5</a>), marched on the east of the tabernacle. This tribe contained 54,400 fighting men when the census was taken at Sinai. After the entrance into the Promised Land, this tribe was one of the six which stood on Gerizim during the ceremony of the blessing and cursing (<a href=\"#\" onClick=\"return mV('Deu',27,12);\">Deu 27:12</a>). The allotment of Issachar is described in <a href=\"#\" onClick=\"return mV('os',19,'17-23');\">Jos. 19:17-23</a>. It included the plain of Esdraelon (=Jezreel), which was and still is the richest portion of Palestine (<a href=\"#\" onClick=\"return mV('Deu',33,18,19);\">Deu 33:18-19</a>; <a href=\"#\" onClick=\"return mV('1Ch',12,40);\">1Ch 12:40</a>).<br><br>The prophetic blessing pronounced by Jacob on Issachar corresponds with that of Moses (<a href=\"#\" onClick=\"return mV('Gen',49,14,15);\">Gen 49:14-15</a>; <a href=\"#\" onClick=\"return mV('Deu',33,18,19);\">Deu 33:18-19</a>).";
eastonArray["$$T0001911"] = "<strong>Italian band:</strong> the name of the Roman cohort to which Cornelius belonged (<a href=\"#\" onClick=\"return mV('Act',10,1);\">Act 10:1</a>), so called probably because it consisted of men recruited in Italy.";
eastonArray["$$T0001912"] = "<strong>Italy:</strong> <a href=\"#\" onClick=\"return mV('Act',18,2);\">Act 18:2</a>; <a href=\"#\" onClick=\"return mV('Act',18,1,6);\">27:1, 6</a>; <a href=\"#\" onClick=\"return mV('Hbr',13,24);\">Hbr 13:24</a>), like most geographical names, was differently used at different periods of history. As the power of Rome advanced, nations were successively conquered and added to it till it came to designate the whole country to the south of the Alps. There was constant intercourse between Palestine and Italy in the time of the Romans.";
eastonArray["$$T0001913"] = "<strong>Ithamar:</strong> palm isle, the fourth and youngest son of Aaron (<a href=\"#\" onClick=\"return mV('1Ch',6,3);\">1Ch 6:3</a>). He was consecrated to the priesthood along with his brothers (<a href=\"#\" onClick=\"return mV('Exd',6,23);\">Exd 6:23</a>); and after the death of Nadab and Abihu, he and Eleazar alone discharged the functions of that office (<a href=\"#\" onClick=\"return mV('Lev',10,6,12);\">Lev 10:6, 12</a>; <a href=\"#\" onClick=\"return mV('Num',3,4);\">Num 3:4</a>). He and his family occupied the position of common priest till the high priesthood passed into his family in the person of Eli (<a href=\"#\" onClick=\"return mV('1Ki',2,27);\">1Ki 2:27</a>), the reasons for which are not recorded. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003864');\">ZADOK</a>.)";
eastonArray["$$T0001914"] = "<strong>Ithrite:</strong> two of David's warriors so designated (<a href=\"#\" onClick=\"return mV('2Sa',23,38);\">2Sa 23:38</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,40);\">1Ch 11:40</a>).";
eastonArray["$$T0001915"] = "<strong>Ittai:</strong> near; timely; or, with the Lord.<br><br>(1.) A Benjamite, one of David's thirty heroes (<a href=\"#\" onClick=\"return mV('2Sa',23,29);\">2Sa 23:29</a>).<br><br>(2.) A native of Gath, a Philistine, who had apparently the command of the six hundred heroes who formed David's band during his wanderings (<a href=\"#\" onClick=\"return mV('2Sa',15,'19-22');\">2Sa 15:19-22</a>; <a href=\"#\" onClick=\"return mV('1Sa',23,13);\">1Sa 23:13</a>; <a href=\"#\" onClick=\"return mV('1Sa',27,2);\">27:2</a>; <a href=\"#\" onClick=\"return mV('1Sa',30,9,10);\">30:9-10</a>). He is afterwards with David at Mahanaim, holding in the army equal rank with Joab and Abishai (<a href=\"#\" onClick=\"return mV('2Sa',18,2,5,12);\">2Sa 18:2, 5, 12</a>). He then passes from view.";
eastonArray["$$T0001916"] = "<strong>Ituraea:</strong> a district in the north-east of Palestine, forming, along with the adjacent territory of Trachonitis, the tetrarchy of Philip (<a href=\"#\" onClick=\"return mV('Luk',3,1);\">Luk 3:1</a>). The present Jedur comprehends the chief part of Ituraea. It is bounded on the east by Trachonitis, on the south by Gaulanitis, on the west by Hermon, and on the north by the plain of Damascus.";
eastonArray["$$T0001917"] = "<strong>Ivah:</strong> overturning, a city of the Assyrians, whence colonists were brought to Samaria (<a href=\"#\" onClick=\"return mV('2Ki',18,34);\">2Ki 18:34</a>; <a href=\"#\" onClick=\"return mV('2Ki',19,13);\">19:13</a>). It lay on the Euphrates, between Sepharvaim and Henah, and is supposed by some to have been the Ahava of Ezra (<a href=\"#\" onClick=\"return mV('Ezr',8,15);\">Ezr 8:15</a>).";
eastonArray["$$T0001918"] = "<strong>Ivory:</strong> (Heb. pl. shenhabbim, the \"tusks of elephants\") was early used in decorations by the Egyptians, and a great trade in it was carried on by the Assyrians (<a href=\"#\" onClick=\"return mV('Eze',27,6);\">Eze 27:6</a>; <a href=\"#\" onClick=\"return mV('Rev',18,12);\">Rev 18:12</a>). It was used by the Phoenicians to ornament the box-wood rowing-benches of their galleys, and Hiram's skilled workmen made Solomon's throne of ivory (<a href=\"#\" onClick=\"return mV('1Ki',10,18);\">1Ki 10:18</a>). It was brought by the caravans of Dedan (<a href=\"#\" onClick=\"return mV('Isa',21,13);\">Isa 21:13</a>), and from the East Indies by the navy of Tarshish (<a href=\"#\" onClick=\"return mV('1Ki',10,22);\">1Ki 10:22</a>). Many specimens of ancient Egyptian and Assyrian ivory-work have been preserved. The word <i>habbim</i> is derived from the Sanscrit <i>ibhas</i>, meaning \"elephant,\" preceded by the Hebrew article (ha); and hence it is argued that Ophir, from which it and the other articles mentioned in <a href=\"#\" onClick=\"return mV('1Ki',10,22);\">1Ki 10:22</a> were brought, was in India.";
eastonArray["$$T0001919"] = "<strong>Izhar:</strong> oil, one of the sons of Kohath, and grandson of Levi (<a href=\"#\" onClick=\"return mV('Exd',6,18,21);\">Exd 6:18, 21</a>; <a href=\"#\" onClick=\"return mV('Num',16,1);\">Num 16:1</a>).";
eastonArray["$$T0001920"] = "<strong>Izrahite:</strong> the designation of one of David's officers (<a href=\"#\" onClick=\"return mV('1Ch',27,8);\">1Ch 27:8</a>).";
eastonArray["$$T0001921"] = "<strong>Jaakan:</strong> he twists, one of the sons of Ezer, the son of Seir the Horite (<a href=\"#\" onClick=\"return mV('1Ch',1,42);\">1Ch 1:42</a>).";
eastonArray["$$T0001922"] = "<strong>Jaakobah:</strong> heel-catcher, a form of the name Jacob, one of the descendants of Simeon (<a href=\"#\" onClick=\"return mV('1Ch',4,36);\">1Ch 4:36</a>).";
eastonArray["$$T0001923"] = "<strong>Jaala:</strong> a wild she-goat, one of the Nethinim, whose descendants returned from the Captivity (<a href=\"#\" onClick=\"return mV('Neh',7,58);\">Neh 7:58</a>).";
eastonArray["$$T0001924"] = "<strong>Jaalam:</strong> concealer, the second of Esau's three sons by Aholibamah (<a href=\"#\" onClick=\"return mV('Gen',36,5,14);\">Gen 36:5, 14</a>).";
eastonArray["$$T0001925"] = "<strong>Jaanai:</strong> mourner, one of the chief Gadites (<a href=\"#\" onClick=\"return mV('1Ch',5,12);\">1Ch 5:12</a>).";
eastonArray["$$T0001926"] = "<strong>Jaare-oregim:</strong> forests of the weavers, a Bethlehemite (<a href=\"#\" onClick=\"return mV('2Sa',21,19);\">2Sa 21:19</a>), and the father of Elhanan, who slew Goliath. In <a href=\"#\" onClick=\"return mV('1Ch',20,5);\">1Ch 20:5</a> called JAIR.";
eastonArray["$$T0001927"] = "<strong>Jaasau:</strong> fabricator, an Israelite who renounced his Gentile wife after the Return (<a href=\"#\" onClick=\"return mV('Ezr',10,37);\">Ezr 10:37</a>).";
eastonArray["$$T0001928"] = "<strong>Jaasiel:</strong> made by God, one of David's body-guard, the son of Abner (<a href=\"#\" onClick=\"return mV('1Ch',27,21);\">1Ch 27:21</a>), called Jasiel in <a href=\"#\" onClick=\"return mV('1Ch',11,47);\">1Ch 11:47</a>.";
eastonArray["$$T0001929"] = "<strong>Jaaz-aniah:</strong> heard by Jehovah.<br><br>(1.) The son of Jeremiah, and one of the chief Rechabites (<a href=\"#\" onClick=\"return mV('Jer',35,3);\">Jer 35:3</a>).<br><br>(2.) The son of Shaphan (<a href=\"#\" onClick=\"return mV('Eze',8,11);\">Eze 8:11</a>).<br><br>(3.) The son of Azur, one of the twenty-five men seen by Ezekiel (<a href=\"#\" onClick=\"return mV('Eze',11,1);\">Eze 11:1</a>) at the east gate of the temple.<br><br>(4.) A Maachathite (<a href=\"#\" onClick=\"return mV('2Ki',25,23);\">2Ki 25:23</a>; <a href=\"#\" onClick=\"return mV('Jer',40,8);\">Jer 40:8</a>; <a href=\"#\" onClick=\"return mV('Jer',42,1);\">42:1</a>). He is also called Azariah (<a href=\"#\" onClick=\"return mV('Jer',43,2);\">Jer 43:2</a>).";
eastonArray["$$T0001930"] = "<strong>Jaazer:</strong> he (God) helps, a city of the Amorites on the east of Jordan, and assigned, with neighbouring places in Gilead, to Gad (<a href=\"#\" onClick=\"return mV('Num',32,1,35);\">Num 32:1, 35</a>; <a href=\"#\" onClick=\"return mV('Jos',13,25);\">Jos 13:25</a>). It was allotted to the Merarite Levites (<a href=\"#\" onClick=\"return mV('Jos',21,39);\">21:39</a>). In David's time it was occupied by the Hebronites, i.e., the descendants of Kohath (<a href=\"#\" onClick=\"return mV('1Ch',26,31);\">1Ch 26:31</a>). It is mentioned in the \"burdens\" proclaimed over Moab (<a href=\"#\" onClick=\"return mV('Isa',16,8,9);\">Isa 16:8-9</a>; <a href=\"#\" onClick=\"return mV('Jer',48,32);\">Jer 48:32</a>). Its site is marked by the modern ruin called Sar or Seir, about 10 miles west of Amman, and 12 from Heshbon. \"The vineyards that once covered the hill-sides are gone; and the wild Bedawin from the eastern desert make cultivation of any kind impossible.\"";
eastonArray["$$T0001931"] = "<strong>Jaaziah:</strong> comforted by Jehovah, a descendant of Merari the Levite (<a href=\"#\" onClick=\"return mV('1Ch',24,26,27);\">1Ch 24:26-27</a>).";
eastonArray["$$T0001932"] = "<strong>Jaaziel:</strong> comforted by God, a Levitical musician (<a href=\"#\" onClick=\"return mV('1Ch',15,18);\">1Ch 15:18</a>).";
eastonArray["$$T0001933"] = "<strong>Jabal:</strong> a stream, a descendant of Cain, and brother of Jubal; \"the father of such as dwell in tents and have cattle\" (<a href=\"#\" onClick=\"return mV('Gen',4,20);\">Gen 4:20</a>). This description indicates that he led a wandering life.";
eastonArray["$$T0001934"] = "<strong>Jabbok:</strong> a pouring out, or a wrestling, one of the streams on the east of Jordan, into which it falls about midway between the Sea of Galilee and the Dead Sea, or about 45 miles below the Sea of Galilee. It rises on the eastern side of the mountains of Gilead, and runs a course of about 65 miles in a wild and deep ravine. It was the boundary between the territory of the Ammonites and that of Og, king of Bashan (<a href=\"#\" onClick=\"return mV('Jos',12,'1-5');\">Jos 12:1-5</a>; <a href=\"#\" onClick=\"return mV('Num',21,24);\">Num 21:24</a>); also between the tribe of Reuben and the half tribe of Manasseh (<a href=\"#\" onClick=\"return mV('Num',21,24);\">21:24</a>; <a href=\"#\" onClick=\"return mV('Deu',3,16);\">Deu 3:16</a>). In its course westward across the plains it passes more than once underground. \"The scenery along its banks is probably the most picturesque in Palestine; and the ruins of town and village and fortress which stud the surrounding mountain-side render the country as interesting as it is beautiful.\" This river is now called the Zerka, or blue river.";
eastonArray["$$T0001935"] = "<strong>Jabesh:</strong> dry.<br><br>(1.) For Jabesh-Gilead (<a href=\"#\" onClick=\"return mV('1Sa',11,3,9,10);\">1Sa 11:3, 9-10</a>).<br><br>(2.) The father of Shallum (<a href=\"#\" onClick=\"return mV('2Ki',15,10,13,14);\">2Ki 15:10, 13-14</a>), who usurped the throne of Israel on the death of Zachariah.";
eastonArray["$$T0001936"] = "<strong>Jabesh-Gilead:</strong> a town on the east of Jordan, on the top of one of the green hills of Gilead, within the limits of the half tribe of Manasseh, and in full view of Beth-shan. It is first mentioned in connection with the vengeance taken on its inhabitants because they had refused to come up to Mizpeh to take part with Israel against the tribe of Benjamin (<a href=\"#\" onClick=\"return mV('Jdg',21,'8-14');\">Jdg 21:8-14</a>). After the battles at Gibeah, that tribe was almost extinguished, only six hundred men remaining. An expedition went against Jabesh-Gilead, the whole of whose inhabitants were put to the sword, except four hundred maidens, whom they brought as prisoners and sent to \"proclaim peace\" to the Benjamites who had fled to the crag Rimmon. These captives were given to them as wives, that the tribe might be saved from extinction (<a href=\"#\" onClick=\"return mV('Jdg',21,'1-')\">Jdg 21</a>).<br><br>This city was afterwards taken by Nahash, king of the Ammonites, but was delivered by Saul, the newly-elected king of Israel. In gratitude for this deliverance, forty years after this, the men of Jabesh-Gilead took down the bodies of Saul and of his three sons from the walls of Beth-shan, and after burning them, buried the bones under a tree near the city (<a href=\"#\" onClick=\"return mV('1Sa',31,'11-13');\">1Sa 31:11-13</a>). David thanked them for this act of piety (<a href=\"#\" onClick=\"return mV('2Sa',2,'4-6');\">2Sa 2:4-6</a>), and afterwards transferred the remains to the royal sepulchre (<a href=\"#\" onClick=\"return mV('2Sa',21,14);\">21:14</a>). It is identified with the ruins of ed-Deir, about 6 miles south of Pella, on the north of the Wady Yabis.";
eastonArray["$$T0001937"] = "<strong>Jabez:</strong> affiction.<br><br>(1.) A descendant of Judah, of whom it is recorded that \"God granted him that which he requested\" (<a href=\"#\" onClick=\"return mV('1Ch',4,9,10);\">1Ch 4:9-10</a>).<br><br>(2.) A place inhabited by several families of the scribes (<a href=\"#\" onClick=\"return mV('1Ch',2,55);\">1Ch 2:55</a>).";
eastonArray["$$T0001938"] = "<strong>Jabin:</strong> discerner; the wise.<br><br>(1.) A king of Hazor, at the time of the entrance of Israel into Canaan (<a href=\"#\" onClick=\"return mV('Jos',11,'1-14');\">Jos 11:1-14</a>), whose overthrow and that of the northern chief with whom he had entered into a confederacy against Joshua was the crowning act in the conquest of the land (<a href=\"#\" onClick=\"return mV('Jos',11,'21-23');\">Jos 11:21-23</a>; <a href=\"#\" onClick=\"return mV('Jos',14,'6-15');\">Jos 14:6-15</a>). This great battle, fought at Lake Merom, was the last of Joshua's battles of which we have any record. Here for the first time the Israelites encountered the iron chariots and horses of the Canaanites.<br><br>(2.) Another king of Hazor, called \"the king of Canaan,\" who overpowered the Israelites of the north one hundred and sixty years after Joshua's death, and for twenty years held them in painful subjection. The whole population were paralyzed with fear, and gave way to hopeless despondency (<a href=\"#\" onClick=\"return mV('Jdg',5,'6-11');\">Jdg 5:6-11</a>), till Deborah and Barak aroused the national spirit, and gathering together ten thousand men, gained a great and decisive victory over Jabin in the plain of Esdraelon (<a href=\"#\" onClick=\"return mV('Jdg',4,'10-16');\">Jdg 4:10-16</a>; <a href=\"#\" onClick=\"return mV('Psa',83,9);\">Psa 83:9</a>). This was the first great victory Israel had gained since the days of Joshua. They never needed to fight another battle with the Canaanites (<a href=\"#\" onClick=\"return mV('Jdg',5,31);\">Jdg 5:31</a>).";
eastonArray["$$T0001939"] = "<strong>Jabneel:</strong> built by God.<br><br>(1.) A town in the north boundary of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,11);\">Jos 15:11</a>), called afterwards by the Greeks Jamnia, the modern Yebna, 11 miles south of Jaffa. After the fall of Jerusalem (A.D. 70), it became one of the most populous cities of Judea, and the seat of a celebrated school.<br><br>(2.) A town on the border of Naphtali (<a href=\"#\" onClick=\"return mV('Jos',19,33);\">Jos 19:33</a>). Its later name was Kefr Yemmah, \"the village by the sea,\" on the south shore of Lake Merom.";
eastonArray["$$T0001940"] = "<strong>Jabneh:</strong> building, (<a href=\"#\" onClick=\"return mV('2Ch',26,6);\">2Ch 26:6</a>), identical with Jabneel (<a href=\"#\" onClick=\"return mV('Jos',15,11);\">Jos 15:11</a>).";
eastonArray["$$T0001941"] = "<strong>Jachan:</strong> mourner, one of the chief Gadite \"brothers\" in Bashan (<a href=\"#\" onClick=\"return mV('1Ch',5,13);\">1Ch 5:13</a>).";
eastonArray["$$T0001942"] = "<strong>Jachin:</strong> firm.<br><br>(1.) The fourth son of Simeon (<a href=\"#\" onClick=\"return mV('Gen',46,10);\">Gen 46:10</a>), called also Jarib (<a href=\"#\" onClick=\"return mV('1Ch',4,24);\">1Ch 4:24</a>).<br><br>(2.) The head of one of the courses (the twenty-first) of priests (<a href=\"#\" onClick=\"return mV('1Ch',24,17);\">1Ch 24:17</a>).<br><br>(3.) One of the priests who returned from the Exile (<a href=\"#\" onClick=\"return mV('1Ch',9,10);\">1Ch 9:10</a>).";
eastonArray["$$T0001943"] = "<strong>Jachin and Boaz:</strong> the names of two brazen columns set up in Solomon's temple (<a href=\"#\" onClick=\"return mV('1Ki',7,'15-22');\">1Ki 7:15-22</a>). Each was eighteen cubits high and twelve in circumference (<a href=\"#\" onClick=\"return mV('Jer',52,21,23);\">Jer 52:21, 23</a>; <a href=\"#\" onClick=\"return mV('1Ki',7,'17-21');\">1Ki 7:17-21</a>). They had doubtless a symbolical import.";
eastonArray["$$T0001944"] = "<strong>Jacinth:</strong> properly a flower of a reddish blue or deep purple (hyacinth), and hence a precious stone of that colour (<a href=\"#\" onClick=\"return mV('Rev',21,20);\">Rev 21:20</a>). It has been supposed to designate the same stone as the ligure (Heb. leshem) mentioned in <a href=\"#\" onClick=\"return mV('Exd',28,19);\">Exd 28:19</a> as the first stone of the third row in the high priest's breast-plate. In <a href=\"#\" onClick=\"return mV('Rev',9,17);\">Rev 9:17</a> the word is simply descriptive of colour.";
eastonArray["$$T0001945"] = "<strong>Jacob:</strong> one who follows on another's heels; supplanter, (<a href=\"#\" onClick=\"return mV('Gen',25,26);\">Gen 25:26</a>; <a href=\"#\" onClick=\"return mV('Gen',27,36);\">27:36</a>; <a href=\"#\" onClick=\"return mV('Hsa',12,'2-4');\">Hsa 12:2-4</a>), the second born of the twin sons of Isaac by Rebekah. He was born probably at Lahai-roi, when his father was fifty-nine and Abraham one hundred and fifty-nine years old. Like his father, he was of a quiet and gentle disposition, and when he grew up followed the life of a shepherd, while his brother Esau became an enterprising hunter. His dealing with Esau, however, showed much mean selfishness and cunning (<a href=\"#\" onClick=\"return mV('Gen',25,'29-34');\">Gen 25:29-34</a>).<br><br>When Isaac was about 160 years of age, Jacob and his mother conspired to deceive the aged patriarch (<a href=\"#\" onClick=\"return mV('Gen',27,'1-')\">Gen 27</a>), with the view of procuring the transfer of the birthright to himself. The birthright secured to him who possessed it<br /<br>(1) superior rank in his family (<a href=\"#\" onClick=\"return mV('Gen',49,3);\">Gen 49:3</a>);<br><br>(2) a double portion of the paternal inheritance (<a href=\"#\" onClick=\"return mV('Deu',21,17);\">Deu 21:17</a>);<br><br >(3) the priestly office in the family (<a href=\"#\" onClick=\"return mV('Num',8,'17-19');\">Num 8:17-19</a>); and<br><br>(4) the promise of the Seed in which all nations of the earth were to be blessed (<a href=\"#\" onClick=\"return mV('Gen',22,18);\">Gen 22:18</a>).<br><br>Soon after his acquisition of his father's blessing (<a href=\"#\" onClick=\"return mV('Gen',27,'1-')\">Gen 27</a>), Jacob became conscious of his guilt; and afraid of the anger of Esau, at the suggestion of Rebekah Isaac sent him away to Haran, 400 miles or more, to find a wife among his cousins, the family of Laban, the Syrian (<a href=\"#\" onClick=\"return mV('Gen',28,'1-')\">28</a>). There he met with Rachel (<a href=\"#\" onClick=\"return mV('Gen',29,'1-')\">29</a>). Laban would not consent to give him his daughter in marriage till he had served seven years; but to Jacob these years \"seemed but a few days, for the love he had to her.\" But when the seven years were expired, Laban craftily deceived Jacob, and gave him his daughter Leah. Other seven years of service had to be completed probably before he obtained the beloved Rachel. But \"life-long sorrow, disgrace, and trials, in the retributive providence of God, followed as a consequence of this double union.\"<br><br>At the close of the fourteen years of service, Jacob desired to return to his parents, but at the entreaty of Laban he tarried yet six years with him, tending his flocks (<a href=\"#\" onClick=\"return mV('Gen',31,41);\">31:41</a>). He then set out with his family and property \"to go to Isaac his father in the land of Canaan\" (<a href=\"#\" onClick=\"return mV('Gen',31,'1-')\">Gen 31</a>). Laban was angry when he heard that Jacob had set out on his journey, and pursued after him, overtaking him in seven days. The meeting was of a painful kind. After much recrimination and reproach directed against Jacob, Laban is at length pacified, and taking an affectionate farewell of his daughters, returns to his home in Padanaram. And now all connection of the Israelites with Mesopotamia is at an end.<br><br>Soon after parting with Laban he is met by a company of angels, as if to greet him on his return and welcome him back to the Land of Promise (<a href=\"#\" onClick=\"return mV('Gen',32,1,2');\">32:1-2</a>). He called the name of the place Mahanaim, i.e., \"the double camp,\" probably his own camp and that of the angels. The vision of angels was the counterpart of that he had formerly seen at Bethel, when, twenty years before, the weary, solitary traveller, on his way to Padan-aram, saw the angels of God ascending and descending on the ladder whose top reached to heaven (<a href=\"#\" onClick=\"return mV('Gen',28,12);\">28:12</a>).<br><br>He now hears with dismay of the approach of his brother Esau with a band of 400 men to meet him. In great agony of mind he prepares for the worst. He feels that he must now depend only on God, and he betakes himself to him in earnest prayer, and sends on before him a munificent present to Esau, \"a present to my lord Esau from thy servant Jacob.\" Jacob's family were then transported across the Jabbok; but he himself remained behind, spending the night in communion with God. While thus engaged, there appeared one in the form of a man who wrestled with him. In this mysterious contest Jacob prevailed, and as a memorial of it his name was changed to Israel (wrestler with God); and the place where this occured he called Peniel, \"for\", said he, \"I have seen God face to face, and my life is preserved\" (<a href=\"#\" onClick=\"return mV('Gen',32,'25-31');\">32:25-31</a>).<br><br>After this anxious night, Jacob went on his way, halting, mysteriously weakened by the conflict, but strong in the assurance of the divine favour. Esau came forth and met him; but his spirit of revenge was appeased, and the brothers met as friends, and during the remainder of their lives they maintained friendly relations. After a brief sojourn at Succoth, Jacob moved forward and pitched his tent near Shechem (q.v.), <a href=\"#\" onClick=\"return mV('Gen',33,18);\">33:18</a>; but at length, under divine directions, he moved to Bethel, where he made an altar unto God (<a href=\"#\" onClick=\"return mV('Gen',35,6,7);\">35:6-7</a>), and where God appeared to him and renewed the Abrahamic covenant. While journeying from Bethel to Ephrath (the Canaanitish name of Bethlehem), Rachel died in giving birth to her second son Benjamin (<a href=\"#\" onClick=\"return mV('Gen',35,'16-20');\">35:16-20</a>), fifteen or sixteen years after the birth of Joseph. He then reached the old family residence at Mamre, to wait on the dying bed of his father Isaac. The complete reconciliation between Esau and Jacob was shown by their uniting in the burial of the patriarch (<a href=\"#\" onClick=\"return mV('Gen',35,'27-29');\">35:27-29</a>).<br><br>Jacob was soon after this deeply grieved by the loss of his beloved son Joseph through the jealousy of his brothers (<a href=\"#\" onClick=\"return mV('Gen',37,33);\">37:33</a>). Then follows the story of the famine, and the successive goings down into Egypt to buy corn (<a href=\"#\" onClick=\"return mV('Gen',42,'1-');\">42</a>), which led to the discovery of the long-lost Joseph, and the patriarch's going down with all his household, numbering about seventy souls (<a href=\"#\" onClick=\"return mV('Exd',1,5);\">Exd 1:5</a>; <a href=\"#\" onClick=\"return mV('Deu',10,22);\">Deu 10:22</a>; <a href=\"#\" onClick=\"return mV('Act',7,14);\">Act 7:14</a>), to sojourn in the land of Goshen. Here Jacob, \"after being strangely tossed about on a very rough ocean, found at last a tranquil harbour, where all the best affections of his nature were gently exercised and largely unfolded\" (<a href=\"#\" onClick=\"return mV('Gen',48,'1-1')\">Gen 48</a>). At length the end of his checkered course draws nigh, and he summons his sons to his bedside that he may bless them. Among his last words he repeats the story of Rachel's death, although forty years had passed away since that event took place, as tenderly as if it had happened only yesterday; and when \"he had made an end of charging his sons, he gathered up his feet into the bed, and yielded up the ghost\" (<a href=\"#\" onClick=\"return mV('Gen',49,33);\">49:33</a>). His body was embalmed and carried with great pomp into the land of Canaan, and buried beside his wife Leah in the cave of Machpelah, according to his dying charge. There, probably, his embalmed body remains to this day (<a href=\"#\" onClick=\"return mV('Gen',50,'1-13');\">50:1-13</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001712');\">HEBRON</a>.)<br><br>The history of Jacob is referred to by the prophets Hosea (<a href=\"#\" onClick=\"return mV('Hsa',12,3,4,12);\">Hsa 12:3-4, 12</a>) and Malachi (<a href=\"#\" onClick=\"return mV('Mal',1,2);\">Mal 1:2</a>). In <a href=\"#\" onClick=\"return mV('Mic',1,5);\">Mic 1:5</a> the name is a poetic synonym for Israel, the kingdom of the ten tribes. There are, besides the mention of his name along with those of the other patriarchs, distinct references to events of his life in Paul's epistles (<a href=\"#\" onClick=\"return mV('Rom',9,'11-13');\">Rom 9:11-13</a>; <a href=\"#\" onClick=\"return mV('Hbr',12,16);\">Hbr 12:16</a>; <a href=\"#\" onClick=\"return mV('Hbr',11,21);\">11:21</a>). See references to his vision at Bethel and his possession of land at Shechem in <a href=\"#\" onClick=\"return mV('Jhn',1,51);\">Jhn 1:51</a>; <a href=\"#\" onClick=\"return mV('Jhn',4,5,12);\">Jhn 4:5, 12</a>; also to the famine which was the occasion of his going down into Egypt in <a href=\"#\" onClick=\"return mV('Act',7,12);\">Act 7:12</a> (See <a href=\"#\" onClick=\"return doDictLookup('ET0002335');\">LUZ</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0000554');\">BETHEL</a>.)";
eastonArray["$$T0001946"] = "<strong>Jacob's Well:</strong> (<a href=\"#\" onClick=\"return mV('Jhn',4,5,6);\">Jhn 4:5-6</a>). This is one of the few sites in Palestine about which there is no dispute. It was dug by Jacob, and hence its name, in the \"parcel of ground\" which he purchased from the sons of Hamor (<a href=\"#\" onClick=\"return mV('Gen',33,19);\">Gen 33:19</a>). It still exists, but although after copious rains it contains a little water, it is now usually quite dry. It is at the entrance to the valley between Ebal and Gerizim, about 2 miles south-east of Shechem. It is about 9 feet in diameter and about 75 feet in depth, though in ancient times it was no doubt much deeper, probably twice as deep. The digging of such a well must have been a very laborious and costly undertaking.<br><br>\"Unfortunately, the well of Jacob has not escaped that misplaced religious veneration which cannot be satisfied with leaving the object of it as it is, but must build over it a shrine to protect and make it sacred. A series of buildings of various styles, and of different ages, have cumbered the ground, choked up the well, and disfigured the natural beauty and simplicity of the spot. At present the rubbish in the well has been cleared out; but there is still a domed structure over it, and you gaze down the shaft cut in the living rock and see at a depth of 70 feet the surface of the water glimmering with a pale blue light in the darkness, while you notice how the limestone blocks that form its curb have been worn smooth, or else furrowed by the ropes of centuries\" (Hugh Macmillan).<br><br>At the entrance of the enclosure round the well is planted in the ground one of the wooden poles that hold the telegraph wires between Jerusalem and Haifa.";
eastonArray["$$T0001947"] = "<strong>Jaddua:</strong> known.<br><br>(1.) One of the chiefs who subscribed the covenant (<a href=\"#\" onClick=\"return mV('Neh',10,21);\">Neh 10:21</a>).<br><br>(2.) The last high priest mentioned in the Old Testament (<a href=\"#\" onClick=\"return mV('Neh',12,11,22);\">Neh 12:11, 22</a>), sons of Jonathan.";
eastonArray["$$T0001948"] = "<strong>Jadon:</strong> judge, a Meronothite who assisted in rebuilding the walls of Jerusalem (<a href=\"#\" onClick=\"return mV('Neh',3,7);\">Neh 3:7</a>).";
eastonArray["$$T0001949"] = "<strong>Jael:</strong> mountain-goat, the wife of Heber the Kenite (<a href=\"#\" onClick=\"return mV('Jdg',4,'17-22');\">Jdg 4:17-22</a>). When the Canaanites were defeated by Barak, Sisera, the captain of Jabin's army, fled and sought refuge with the friendly tribe of Heber, beneath the oaks of Zaanaim. As he drew near, Jael invited him to enter her tent. He did so, and as he lay wearied on the floor he fell into a deep sleep. She then took in her left hand one of the great wooden pins (\"nail\") which fastened down the cords of the tent, and in her right hand the mallet, or \"hammer,\" used for driving it into the ground, and stealthily approaching her sleeping guest, with one well-directed blow drove the nail through his temples into the earth (<a href=\"#\" onClick=\"return mV('Jdg',5,27);\">Jdg 5:27</a>). She then led Barak, who was in pursuit, into her tent, and boastfully showed him what she had done. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003452');\">SISERA</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0000996');\">DEBORAH</a>.)";
</script>
