<script src="./js/NoNavHeader.js"  type="text/javascript"></script>
<script>
var eastonArray = new Array ();
eastonArray["$$T0001650"] = "<strong>Harrow:</strong> (Heb. harits), a tribulum or sharp threshing sledge; a frame armed on the under side with rollers or sharp spikes (<a href=\"#\" onClick=\"return mV('2Sa',12,31);\">2Sa 12:31</a>; <a href=\"#\" onClick=\"return mV('1Ch',20,3);\">1Ch 20:3</a>).<br><br>Heb. verb <i>sadad</i>, to harrow a field, break its clods (<a href=\"#\" onClick=\"return mV('Job',39,10);\">Job 39:10</a>; <a href=\"#\" onClick=\"return mV('Isa',28,4);\">Isa 28:4</a>; <a href=\"#\" onClick=\"return mV('Hsa',10,11);\">Hsa 10:11</a>). Its form is unknown. It may have resembled the instrument still in use in Egypt.";
eastonArray["$$T0001651"] = "<strong>Harsha:</strong> worker or enchanter, one of the Nethinim (<a href=\"#\" onClick=\"return mV('Ezr',2,52);\">Ezr 2:52</a>; <a href=\"#\" onClick=\"return mV('Neh',7,54);\">Neh 7:54</a>).";
eastonArray["$$T0001652"] = "<strong>Hart:</strong> (Heb. 'ayal), a stag or male deer. It is ranked among the clean animals (<a href=\"#\" onClick=\"return mV('Deu',12,15);\">Deu 12:15</a>; <a href=\"#\" onClick=\"return mV('Deu',14,5);\">14:5</a>; <a href=\"#\" onClick=\"return mV('Deu',15,22);\">15:22</a>), and was commonly killed for food (<a href=\"#\" onClick=\"return mV('1Ki',4,23);\">1Ki 4:23</a>). The hart is frequently alluded to in the poetical and prophetical books (<a href=\"#\" onClick=\"return mV('Isa',35,6);\">Isa 35:6</a>; <a href=\"#\" onClick=\"return mV('Sgs',2,8,9);\">Sgs 2:8-9</a>; <a href=\"#\" onClick=\"return mV('Lam',1,6);\">Lam 1:6</a>; <a href=\"#\" onClick=\"return mV('Psa',42,1);\">Psa 42:1</a>).";
eastonArray["$$T0001653"] = "<strong>Harum:</strong> elevated, (<a href=\"#\" onClick=\"return mV('1Ch',4,8);\">1Ch 4:8</a>), a descendant of Judah.";
eastonArray["$$T0001654"] = "<strong>Haruphite:</strong> a native of Hariph; an epithet given to Shephatiah, one of those who joined David at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,5);\">1Ch 12:5</a>).";
eastonArray["$$T0001655"] = "<strong>Haruz:</strong> eager, the father of Meshullemeth, the wife of king Manasseh (<a href=\"#\" onClick=\"return mV('2Ki',21,19);\">2Ki 21:19</a>) and mother of king Amon.";
eastonArray["$$T0001656"] = "<strong>Harvest:</strong> the season for gathering grain or fruit. On the 16th day of Abib (or April) a handful of ripe ears of corn was offered as a first-fruit before the Lord, and immediately after this the harvest commenced (<a href=\"#\" onClick=\"return mV('Lev',23,'9-14');\">Lev 23:9-14</a>; <a href=\"#\" onClick=\"return mV('2Sa',21,9,10);\">2Sa 21:9-10</a>; <a href=\"#\" onClick=\"return mV('Rth',2,23);\">Rth 2:23</a>). It began with the feast of Passover and ended with Pentecost, thus lasting for seven weeks (<a href=\"#\" onClick=\"return mV('Exd',23,16);\">Exd 23:16</a>). The harvest was a season of joy (<a href=\"#\" onClick=\"return mV('Psa',126,'1-6');\">Psa 126:1-6</a>; <a href=\"#\" onClick=\"return mV('Isa',9,3);\">Isa 9:3</a>). This word is used figuratively <a href=\"#\" onClick=\"return mV('Mat',9,37);\">Mat 9:37</a>; <a href=\"#\" onClick=\"return mV('Mat',13,30);\">13:30</a>; <a href=\"#\" onClick=\"return mV('Luk',10,2);\">Luk 10:2</a>; <a href=\"#\" onClick=\"return mV('Jhn',4,35);\">Jhn 4:35</a>. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000124');\">AGRICULTURE</a>.)";
eastonArray["$$T0001657"] = "<strong>Hasadiah:</strong> favoured by Jehovah, one of the sons of Pedaiah (<a href=\"#\" onClick=\"return mV('1Ch',3,20);\">1Ch 3:20</a>), of the royal line of David.";
eastonArray["$$T0001658"] = "<strong>Hasenuah:</strong> bristling or hated, a Benjamite (<a href=\"#\" onClick=\"return mV('1Ch',9,7);\">1Ch 9:7</a>).";
eastonArray["$$T0001659"] = "<strong>Hashabiah:</strong> regarded by Jehovah.<br><br>(1.) Merarite Levite (<a href=\"#\" onClick=\"return mV('1Ch',6,45);\">1Ch 6:45</a>; <a href=\"#\" onClick=\"return mV('1Ch',9,14);\">9:14</a>).<br><br>(2.) A son of Jeduthun (<a href=\"#\" onClick=\"return mV('1Ch',25,3,19);\">25:3, 19</a>).<br><br>(3.) Son of Kemuel (<a href=\"#\" onClick=\"return mV('1Ch',26,30);\">26:30</a>).<br><br>(4.) One of the chief Levites (<a href=\"#\" onClick=\"return mV('2Ch',35,9);\">2Ch 35:9</a>).<br><br>(5.) A Levite (<a href=\"#\" onClick=\"return mV('Neh',11,22);\">Neh 11:22</a>).<br><br>(6.) One of the chief priests in the time of Ezra (<a href=\"#\" onClick=\"return mV('Ezr',8,24);\">Ezr 8:24</a>).<br><br>(7.) A chief of the Levites (<a href=\"#\" onClick=\"return mV('Neh',12,24);\">Neh 12:24</a>).<br><br>(8.) <a href=\"#\" onClick=\"return mV('Ezr',8,19);\">Ezr 8:19</a>.<br><br>(9.) <a href=\"#\" onClick=\"return mV('Neh',3,17);\">Neh 3:17</a>.";
eastonArray["$$T0001660"] = "<strong>Hashabniah:</strong><br><br>(1.) <a href=\"#\" onClick=\"return mV('Neh',3,10);\">Neh 3:10</a>.<br><br>(2.) One of the Levites whom Ezra appointed to interpret the law to the people (<a href=\"#\" onClick=\"return mV('Neh',9,5);\">Neh 9:5</a>).";
eastonArray["$$T0001661"] = "<strong>Hashbadana:</strong> consideration in judging, stood at Ezra's left hand when he read the law (<a href=\"#\" onClick=\"return mV('Neh',8,4);\">Neh 8:4</a>).";
eastonArray["$$T0001662"] = "<strong>Hashmonah:</strong> fatness, the thirtieth halting-place of the Israelites during their wanderings in the wilderness, not far from Mount Hor (<a href=\"#\" onClick=\"return mV('Num',33,29,30);\">Num 33:29-30</a>).";
eastonArray["$$T0001663"] = "<strong>Hashub:</strong> intelligent.<br><br>(1.) A Levite of the family of Merari (<a href=\"#\" onClick=\"return mV('Neh',11,15);\">Neh 11:15</a>; <a href=\"#\" onClick=\"return mV('1Ch',9,14);\">1Ch 9:14</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('Neh',3,23);\">Neh 3:23</a>; <a href=\"#\" onClick=\"return mV('Neh',3,11);\">Neh 3:11</a>.";
eastonArray["$$T0001664"] = "<strong>Hashubah:</strong> ibid., a descendant of David (<a href=\"#\" onClick=\"return mV('1Ch',3,20);\">1Ch 3:20</a>).";
eastonArray["$$T0001665"] = "<strong>Hashum:</strong> opulent.<br><br>(1.) <a href=\"#\" onClick=\"return mV('Ezr',2,19);\">Ezr 2:19</a>; <a href=\"#\" onClick=\"return mV('Neh',7,22);\">Neh 7:22</a>.<br><br>(2.) Stood on Ezra's left hand while he read the law (<a href=\"#\" onClick=\"return mV('Neh',8,4);\">Neh 8:4</a>).";
eastonArray["$$T0001666"] = "<strong>Hasrah:</strong> poverty, \"keeper of the wardrobe,\" i.e., of the sacerdotal vestments (<a href=\"#\" onClick=\"return mV('2Ch',34,22);\">2Ch 34:22</a>); called Harhas <a href=\"#\" onClick=\"return mV('2Ki',22,14);\">2Ki 22:14</a>. He was husband of the prophetess Huldah.";
eastonArray["$$T0001667"] = "<strong>Hasupha:</strong> uncovered, one of the Nethinim (<a href=\"#\" onClick=\"return mV('Ezr',2,43);\">Ezr 2:43</a>; <a href=\"#\" onClick=\"return mV('Neh',7,46);\">Neh 7:46</a>).";
eastonArray["$$T0001668"] = "<strong>Hat:</strong> Chald. karb'ela, (<a href=\"#\" onClick=\"return mV('Dan',3,21);\">Dan 3:21</a>), properly mantle or pallium. The Revised Version renders it \"tunic.\"";
eastonArray["$$T0001669"] = "<strong>Hatach:</strong> verity, one of the eunuchs or chamberlains in the palace of Ahasuerus (<a href=\"#\" onClick=\"return mV('Est',4,5,6,9,10);\">Est 4:5-6, 9-10</a>).";
eastonArray["$$T0001670"] = "<strong>Hathath:</strong> terror, son of Othniel (<a href=\"#\" onClick=\"return mV('1Ch',4,13);\">1Ch 4:13</a>).";
eastonArray["$$T0001671"] = "<strong>Hatipha:</strong> captured, one of the Nethinim (<a href=\"#\" onClick=\"return mV('Ezr',2,54);\">Ezr 2:54</a>).";
eastonArray["$$T0001672"] = "<strong>Hatita:</strong> exploration, one of the temple porters or janitors (<a href=\"#\" onClick=\"return mV('Ezr',2,42);\">Ezr 2:42</a>). He returned from Babylon with Zerubbabel.";
eastonArray["$$T0001673 "] = "<strong>Hatred:</strong> among the works of the flesh (<a href=\"#\" onClick=\"return mV('Gal',5,20);\">Gal 5:20</a>). Altogether different is the meaning of the word in <a href=\"#\" onClick=\"return mV('Deu',21,15);\">Deu 21:15</a>; <a href=\"#\" onClick=\"return mV('Mat',6,24);\">Mat 6:24</a>; <a href=\"#\" onClick=\"return mV('Luk',14,26);\">Luke 14:26</a>; <a href=\"#\" onClick=\"return mV('Rom',9,13);\">Rom 9:13</a>, where it denotes only a less degree of love.";
eastonArray["$$T0001674"] = "<strong>Hattush:</strong> assembled.<br><br>(1.) A priest who returned with Zerubbabel (<a href=\"#\" onClick=\"return mV('Neh',12,2);\">Neh 12:2</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('Ezr',8,2);\">Ezr 8:2</a>.<br><br>(3.) <a href=\"#\" onClick=\"return mV('Neh',3,10);\">Neh 3:10</a>.<br><br>(4.) <a href=\"#\" onClick=\"return mV('Neh',10,4);\">Neh 10:4</a>.<br><br>(5.) <a href=\"#\" onClick=\"return mV('1Ch',3,22);\">1Ch 3:22</a>.";
eastonArray["$$T0001675"] = "<strong>Hauran:</strong> cave-land, mentioned only in <a href=\"#\" onClick=\"return mV('Eze',47,16,18);\">Eze 47:16, 18</a>. It was one of the ancient divisions of Bashan (q.v.), and lay on the south-east of Gaulanitis or the Jaulan, and on the south of Lejah, extending from the Arnon to the Hieromax. It was the most fertile region in Syria, and to this day abounds in the ruins of towns, many of which have stone doors and massive walls. It retains its ancient name. It was known by the Greeks and Romans as \"Auranitis.\"";
eastonArray["$$T0001676"] = "<strong>Haven:</strong> a harbour (<a href=\"#\" onClick=\"return mV('Psa',107,30);\">Psa 107:30</a>; <a href=\"#\" onClick=\"return mV('Act',27,12);\">Act 27:12</a>). The most famous on the coast of Palestine was that of Tyre (<a href=\"#\" onClick=\"return mV('Eze',27,3);\">Eze 27:3</a>). That of Crete, called \"Fair Havens,\" is mentioned <a href=\"#\" onClick=\"return mV('Act',27,8);\">Act 27:8</a>.";
eastonArray["$$T0001677"] = "<strong>Havilah:</strong> the sand region.<br><br>(1.) A land mentioned in <a href=\"#\" onClick=\"return mV('Gen',2,11);\">Gen 2:11</a> rich in gold and bdellium and onyx stone. The question as to the locality of this region has given rise to a great diversity of opinion. It may perhaps be identified with the sandy tract which skirts Babylonia along the whole of its western border, stretching from the lower Euphrates to the mountains of Edom.<br><br>(2.) A district in Arabia-Felix. It is uncertain whether the tribe gave its name to this region or derived its name from it, and whether it was originally a Cushite (<a href=\"#\" onClick=\"return mV('Gen',10,7);\">Gen 10:7</a>) or a Joktanite tribe (<a href=\"#\" onClick=\"return mV('Gen',10,29);\">Gen 10:29</a>; <a href=\"#\" onClick=\"return mV('Gen',25,18);\">Gen 25:18</a>), or whether there were both a Cushite and a Joktanite Havilah. It is the opinion of Kalisch, however, that Havilah \"in both instances designates the same country, extending at least from the Persian to the Arabian Gulf, and on account of its vast extent easily divided into two distinct parts.\" This opinion may be well vindicated.<br><br>(3.) One of the sons of Cush (<a href=\"#\" onClick=\"return mV('Gen',10,7);\">Gen 10:7</a>).<br><br>(4.) A son of Joktan (<a href=\"#\" onClick=\"return mV('Gen',10,29);\">Gen 10:29</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,23);\">1Ch 1:23</a>).";
eastonArray["$$T0001678"] = "<strong>Havoth-jair:</strong> hamlets of the enlightener a district in the east of Jordan<br><br>(1.) Jair, the son of Manasseh, took some villages of Gilead and called them by this name (<a href=\"#\" onClick=\"return mV('Num',32,41);\">Num 32:41</a>).<br><br>(2.) Again, it is said that Jair \"took all the tract of Argob,\" and called it Bashanhavoth-jair (<a href=\"#\" onClick=\"return mV('Deu',3,14);\">Deu 3:14</a>). (See also <a href=\"#\" onClick=\"return mV('Jos',13,30);\">Jos 13:30</a>; <a href=\"#\" onClick=\"return mV('1Ki',4,13);\">1Ki 4:13</a>; <a href=\"#\" onClick=\"return mV('1Ch',2,22,23);\">1Ch 2:22-23</a>.)";
eastonArray["$$T0001679"] = "<strong>Hawk:</strong> (Heb. netz, a word expressive of strong and rapid flight, and hence appropriate to the hawk). It is an unclean bird (<a href=\"#\" onClick=\"return mV('Lev',11,16);\">Lev 11:16</a>; <a href=\"#\" onClick=\"return mV('Deu',14,15);\">Deu 14:15</a>). It is common in Syria and surrounding countries. The Hebrew word includes various species of Falconidae, with special reference perhaps to the kestrel (<i>Falco tinnunculus</i>), the hobby (<i>Hypotriorchis subbuteo</i>), and the lesser kestrel (Tin, Cenchris). The kestrel remains all the year in Palestine, but some ten or twelve other species are all migrants from the south. Of those summer visitors to Palestine special mention may be made of the <i>Falco sacer</i> and the <i>Falco lanarius</i>. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002729');\">NIGHT-HAWK</a>.)";
eastonArray["$$T0001680"] = "<strong>Hay:</strong> properly so called, was not in use among the Hebrews; straw was used instead. They cut the grass green as it was needed. The word rendered \"hay\" in <a href=\"#\" onClick=\"return mV('Pro',27,25);\">Pro 27:25</a> means the first shoots of the grass. In <a href=\"#\" onClick=\"return mV('Isa',15,6);\">Isa 15:6</a> the Revised Version has correctly \"grass,\" where the Authorized Version has \"hay.\"";
eastonArray["$$T0001681"] = "<strong>Hazael:</strong> whom God beholds, an officer of Ben-hadad II., king of Syria, who ultimately came to the throne, according to the word of the Lord to Elijah (<a href=\"#\" onClick=\"return mV('1Ki',19,15);\">1Ki 19:15</a>), after he had put the king to death (<a href=\"#\" onClick=\"return mV('2Ki',8,15);\">2Ki 8:15</a>). His interview with Elisha is mentioned in <a href=\"#\" onClick=\"return mV('2Ki',8,'1-');\">2Ki 8</a>. The Assyrians soon after his accession to the throne came against him and defeated him with very great loss; and three years afterwards again invaded Syria, but on this occasion Hazael submitted to them. He then turned his arms against Israel, and ravaged \"all the land of Gilead,\" etc. (<a href=\"#\" onClick=\"return mV('2Ki',10,33);\">2Ki 10:33</a>), which he held in a degree of subjection to him (<a href=\"#\" onClick=\"return mV('2Ki',13,'3-7',22);\">13:3-7, 22</a>). He aimed at the subjugation also of the kingdom of Judah, when Joash obtained peace by giving him \"all the gold that was found in the treasures of the house of the Lord, and in the king's house\" (<a href=\"#\" onClick=\"return mV('2Ki',12,18);\">2Ki 12:18</a>; <a href=\"#\" onClick=\"return mV('2Ch',24,24);\">2Ch 24:24</a>). He reigned about forty-six years (B.C.886-840), and was succeeded on the throne by his son Ben-hadad (<a href=\"#\" onClick=\"return mV('2Ki',13,'22-25');\">2Ki 13:22-25</a>), who on several occasions was defeated by Jehoash, the king of Israel, and compelled to restore all the land of Israel his father had taken.";
eastonArray["$$T0001682"] = "<strong>Hazar-addar:</strong> village of Addar, a place in the southern boundary of Palestine (<a href=\"#\" onClick=\"return mV('Num',34,4);\">Num 34:4</a>), in the desert to the west of Kadesh-barnea. It is called Adar in <a href=\"#\" onClick=\"return mV('Jos',15,3);\">Jos 15:3</a>.";
eastonArray["$$T0001683"] = "<strong>Hazar-enan:</strong> village of fountains, a place on the north-east frontier of Palestine (<a href=\"#\" onClick=\"return mV('Num',34,9,10);\">Num 34:9-10</a>). Some have identified it with Ayan ed-Dara in the heart of the central chain of Anti-Libanus. More probably, however, it has been identified with Kuryetein, about 60 miles east-north-east of Damascus. (<a href=\"#\" onClick=\"return mV('Eze',47,17);\">Eze 47:17</a>; <a href=\"#\" onClick=\"return mV('Eze',48,1);\">48:1</a>.)";
eastonArray["$$T0001684"] = "<strong>Hazar-gaddah:</strong> village of fortune, a city on the south border of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,27);\">Jos 15:27</a>), midway between the Mediterranean and the Dead Sea.";
eastonArray["$$T0001685"] = "<strong>Hazar-hatticon:</strong> village of the midway, a place near Hamath in the confines of Hauran (<a href=\"#\" onClick=\"return mV('Eze',47,16);\">Eze 47:16</a>), probably on the north brow of Hermon.";
eastonArray["$$T0001686"] = "<strong>Hazar-maveth:</strong> court of death, the third son of Joktan, and a region in Arabia-Felix settled by him (<a href=\"#\" onClick=\"return mV('Gen',10,26);\">Gen 10:26</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,20);\">1Ch 1:20</a>). It is probably the modern province of Hadramaut, situated on the Indian Ocean east of the modern Yemen.";
eastonArray["$$T0001687"] = "<strong>Hazar-shual:</strong> village or enclosure of the jackal, a city on the south border of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,28);\">Jos 15:28</a>; <a href=\"#\" onClick=\"return mV('Neh',11,27);\">Neh 11:27</a>). It has been identified with the ruins of Saweh, half-way between Beersheba and Moladah.";
eastonArray["$$T0001688"] = "<strong>Hazar-susah:</strong> village of the horse, the same as Sansannah, one of Solomon's \"chariot cities\" (<a href=\"#\" onClick=\"return mV('Jos',15,31);\">Jos 15:31</a>; <a href=\"#\" onClick=\"return mV('2Ch',1,14);\">2Ch 1:14</a>), a depot in the south border of Judah.";
eastonArray["$$T0001689"] = "<strong>Hazel:</strong> Heb. luz, (<a href=\"#\" onClick=\"return mV('Gen',30,37);\">Gen 30:37</a>), a nutbearing tree. The Hebrew word is rendered in the Vulgate by amygdalinus, \"the almond-tree,\" which is probably correct. That tree flourishes in Syria.";
eastonArray["$$T0001690"] = "<strong>Hazerim:</strong> villages, probably the name of the temporary villages in which the nomad Avites resided (<a href=\"#\" onClick=\"return mV('Deu',2,23);\">Deu 2:23</a>).";
eastonArray["$$T0001691"] = "<strong>Hazeroth:</strong> fenced enclosures consisting of \"a low wall of stones in which thick bundles of thorny acacia are inserted, the tangled branches and long needle-like spikes forming a perfectly impenetrable hedge around the encampment\" of tents and cattle which they sheltered. Such like enclosures abound in the wilderness of Paran, which the Israelites entered after leaving Sinai (<a href=\"#\" onClick=\"return mV('Num',11,35);\">Num 11:35</a>; <a href=\"#\" onClick=\"return mV('Num',12,16);\">12:16</a>; <a href=\"#\" onClick=\"return mV('Num',33,17,18);\">33:17-18</a>). This third encampment of the Israelites has been identified with the modern 'Ain el-Hudhera, some 40 miles north-east of Sinai. Here Miriam (q.v.), being displeased that Moses had married a Cushite wife (<a href=\"#\" onClick=\"return mV('Num',12,1);\">Num 12:1</a>), induced Aaron to join with her in rebelling against Moses. God vindicated the authority of his \"servant Moses,\" and Miriam was smitten with leprosy. Moses interceded for her, and she was healed (<a href=\"#\" onClick=\"return mV('Num',12,'4-16');\">Num 12:4-16</a>). From this encampment the Israelites marched northward across the plateau of et-Tih, and at length reached KADESH.";
eastonArray["$$T0001692"] = "<strong>Hazezon-tamar:</strong> pruning of the palm, the original name of the place afterwards called ENGEDI (q.v.), <a href=\"#\" onClick=\"return mV('Gen',14,7);\">Gen 14:7</a>; called also HAZAZON-TAMAR (<a href=\"#\" onClick=\"return mV('2Ch',20,2);\">2Ch 20:2</a>).";
eastonArray["$$T0001693"] = "<strong>Hazo:</strong> vision, one of the sons of Nahor (<a href=\"#\" onClick=\"return mV('Gen',22,22);\">Gen 22:22</a>).";
eastonArray["$$T0001694"] = "<strong>Hazor:</strong> enclosed; fortified.<br><br>(1.) A stronghold of the Canaanites in the mountains north of Lake Merom (<a href=\"#\" onClick=\"return mV('Jos',11,'1-5');\">Jos 11:1-5</a>). Jabin the king with his allied tribes here encountered Joshua in a great battle. Joshua gained a signal victory, which virtually completed his conquest of Canaan (<a href=\"#\" onClick=\"return mV('Jos',11,'10-13');\">11:10-13</a>). This city was, however, afterwards rebuilt by the Canaanites, and was ruled by a king with the same hereditary name of Jabin. His army, under a noted leader of the name of Sisera, swept down upon the south, aiming at the complete subjugation of the country. This powerful army was met by the Israelites under Barak, who went forth by the advice of the prophetess Deborah. The result was one of the most remarkable victories for Israel recorded in the Old Testament (<a href=\"#\" onClick=\"return mV('Jos',19,36);\">Jos 19:36</a>; <a href=\"#\" onClick=\"return mV('Jdg',4,2);\">Jdg 4:2</a>; <a href=\"#\" onClick=\"return mV('1Sa',12,9);\">1Sa 12:9</a>). The city of Hazor was taken and occupied by the Israelites. It was fortified by Solomon to defend the entrance into the kingdom from Syria and Assyria. When Tiglath-pileser, the Assyrian king, invaded the land, this was one of the first cities he captured, carrying its inhabitants captive into Assyria (<a href=\"#\" onClick=\"return mV('2Ki',15,29);\">2Ki 15:29</a>). It has been identified with Khurbet Harrah, 2 1/2 miles south-east of Kedesh.<br><br>(2.) A city in the south of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,23);\">Jos 15:23</a>). The name here should probably be connected with the word following, Ithnan, HAZOR-ITHNAN instead of \"Hazor and Ithnan.\"<br><br>(3.) A district in Arabia (<a href=\"#\" onClick=\"return mV('Jer',49,'28-33');\">Jer 49:28-33</a>), supposed by some to be Jetor, i.e., Ituraea.<br><br>(4.) \"Kerioth and Hezron\" (<a href=\"#\" onClick=\"return mV('Jos',15,25);\">Jos 15:25</a>) should be \"Kerioth-hezron\" (as in the R.V.), the two names being joined together as the name of one place (e.g., like Kirjath-jearim), \"the same is Hazor\" (R.V.). This place has been identified with el-Kuryetein, and has been supposed to be the home of Judas Iscariot. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002177');\">KERIOTH</a>.)";
eastonArray["$$T0001695"] = "<strong>Hazor-hadattah:</strong> New Hazor, a city in the south of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,25);\">Jos 15:25</a>). It is probably identified with the ruins of el-Hazzarah, near Beit Jebrin.";
eastonArray["$$T0001696"] = "<strong>Head-bands:</strong> (Heb. kishshurim), properly girdles or belts for the waist (<a href=\"#\" onClick=\"return mV('Isa',3,20);\">Isa 3:20</a>, R.V., \"sashes; <a href=\"#\" onClick=\"return mV('Jer',2,32);\">Jer 2:32</a>, rendered \"attire\", i.e., a girdle round the waist).";
eastonArray["$$T0001697"] = "<strong>Head-dress:</strong> Not in common use among the Hebrews. It is first mentioned in <a href=\"#\" onClick=\"return mV('Exd',28,40);\">Exd 28:40</a> (A.V., \"bonnets; \" R.V., \"head-tires\"). It was used especially for purposes of ornament (<a href=\"#\" onClick=\"return mV('Job',29,14);\">Job 29:14</a>; <a href=\"#\" onClick=\"return mV('Isa',3,23);\">Isa 3:23</a>; <a href=\"#\" onClick=\"return mV('Isa',62,3);\">62:3</a>). The Hebrew word here used, <i>tsaniph</i>, properly means a turban, folds of linen wound round the head. The Hebrew word <i>peer</i>, used in <a href=\"#\" onClick=\"return mV('Isa',61,3);\">Isa 61:3</a>, there rendered \"beauty\" (A.V.) and \"garland\" (R.V.), is a head-dress or turban worn by females (<a href=\"#\" onClick=\"return mV('Isa',3,20);\">Isa 3:20</a>, \"bonnets\"), priests (<a href=\"#\" onClick=\"return mV('Exd',39,28);\">Exd 39:28</a>), a bridegroom (<a href=\"#\" onClick=\"return mV('Isa',61,10);\">Isa 61:10</a>, \"ornament; \" R.V., \"garland\"). <a href=\"#\" onClick=\"return mV('Eze',16,10);\">Eze 16:10</a> and <a href=\"#\" onClick=\"return mV('Jon',2,5);\">Jon 2:5</a> are to be understood of the turban wrapped round the head. The Hebrew <i>shebisim</i> (<a href=\"#\" onClick=\"return mV('Isa',3,18);\">Isa 3:18</a>), in the Authorized Version rendered \"cauls,\" and marg. \"networks,\" denotes probably a kind of netted head-dress. The \"horn\" (Heb. keren) mentioned in <a href=\"#\" onClick=\"return mV('1Sa',2,1);\">1Sa 2:1</a> is the head-dress called by the Druses of Mount Lebanon the tantura.";
eastonArray["$$T0001698"] = "<strong>Heap:</strong> When Joshua took the city of Ai (<a href=\"#\" onClick=\"return mV('Jos',8,'1-')\">Jos 8</a>), he burned it and \"made it an heap [Heb. tel] for ever\" (<a href=\"#\" onClick=\"return mV('Jos',8,28);\">8:28</a>). The ruins of this city were for a long time sought for in vain. It has been at length, however, identified with the mound which simply bears the name of \"Tel.\" \"There are many Tels in modern Palestine, that land of Tels, each Tel with some other name attached to it to mark the former site. But the site of Ai has no other name 'unto this day.' It is simply et-Tel, 'the heap' par excellence.\"";
eastonArray["$$T0001699"] = "<strong>Heart:</strong> According to the Bible, the heart is the centre not only of spiritual activity, but of all the operations of human life. \"Heart\" and \"soul\" are often used interchangeably (<a href=\"#\" onClick=\"return mV('Deu',6,5);\">Deu 6:5</a>; <a href=\"#\" onClick=\"return mV('Deu',26,16);\">26:16</a>; <a href=\"#\" onClick=\"return mV('Mat',22,37);\">Mat 22:37</a>; <a href=\"#\" onClick=\"return mV('Mar',12,30,33);\">Mar 12:30, 33</a>), but this is not generally the case.<br><br>The heart is the \"home of the personal life,\" and hence a man is designated, according to his heart, wise (<a href=\"#\" onClick=\"return mV('1Ki',3,12);\">1Ki 3:12</a>, etc.), pure (<a href=\"#\" onClick=\"return mV('Psa',24,4);\">Psa 24:4</a>; <a href=\"#\" onClick=\"return mV('Mat',5,8);\">Mat 5:8</a>, etc.), upright and righteous (<a href=\"#\" onClick=\"return mV('Gen',20,5,6);\">Gen 20:5-6</a>; <a href=\"#\" onClick=\"return mV('Psa',11,2);\">Psa 11:2</a>; <a href=\"#\" onClick=\"return mV('Psa',78,72);\">78:72</a>), pious and good (<a href=\"#\" onClick=\"return mV('Luk',8,15);\">Luk 8:15</a>), etc. In these and such passages the word \"soul\" could not be substituted for \"heart.\"<br><br>The heart is also the seat of the conscience (<a href=\"#\" onClick=\"return mV('Rom',2,15);\">Rom 2:15</a>). It is naturally wicked (<a href=\"#\" onClick=\"return mV('Gen',8,21);\">Gen 8:21</a>), and hence it contaminates the whole life and character (<a href=\"#\" onClick=\"return mV('Mat',12,34);\">Mat 12:34</a>; <a href=\"#\" onClick=\"return mV('Mat',15,18);\">15:18</a>; <a href=\"#\" onClick=\"return mV('Ecc',8,11);\">Ecc 8:11</a>; <a href=\"#\" onClick=\"return mV('Psa',73,7);\">Psa 73:7</a>). Hence the heart must be changed, regenerated (<a href=\"#\" onClick=\"return mV('Eze',36,26);\">Eze 36:26</a>; <a href=\"#\" onClick=\"return mV('Eze',11,19);\">11:19</a>; <a href=\"#\" onClick=\"return mV('Psa',51,'10-14');\">Psa 51:10-14</a>), before a man can willingly obey God.<br><br>The process of salvation begins in the heart by the believing reception of the testimony of God, while the rejection of that testimony hardens the heart (<a href=\"#\" onClick=\"return mV('Psa',95,8);\">Psa 95:8</a>; <a href=\"#\" onClick=\"return mV('Pro',28,14);\">Pro 28:14</a>; <a href=\"#\" onClick=\"return mV('2Ch',36,13);\">2Ch 36:13</a>). \"Hardness of heart evidences itself by light views of sin; partial acknowledgment and confession of it; pride and conceit; ingratitude; unconcern about the word and ordinances of God; inattention to divine providences; stifling convictions of conscience; shunning reproof; presumption, and general ignorance of divine things.\"";
