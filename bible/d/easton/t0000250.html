<script src="./js/NoNavHeader.js"  type="text/javascript"></script>
<script>
var eastonArray = new Array ();
eastonArray["$$T0000250"] = "<b>Antioch:</b><br><br>(1.) In Syria, on the river Orontes, about 16 miles from the Mediterranean, and some 300 miles north of Jerusalem. It was the metropolis of Syria, and afterwards became the capital of the Roman province in Asia. It ranked third, after Rome and Alexandria, in point of importance, of the cities of the Roman empire. It was called the \"first city of the East.\" Christianity was early introduced into it (<a href=\"#\" onClick=\"return mV('Act',11,19,21,24);\">Act 11:19, 21, 24</a>), and the name \"Christian\" was first applied here to its professors (<a href=\"#\" onClick=\"return mV('Act',11,26);\">Act 11:26</a>). It is intimately connected with the early history of the gospel (<a href=\"#\" onClick=\"return mV('Act',6,5);\">Act 6:5</a>; <a href=\"#\" onClick=\"return mV('Act',11,19,27,28,30);\">11:19, 27-28, 30</a>; <a href=\"#\" onClick=\"return mV('Act',12,25);\">12:25</a>; <a href=\"#\" onClick=\"return mV('Act',15,''22-35');\">15:22-35</a>; <a href=\"#\" onClick=\"return mV('Gal',2,11,12);\">Gal 2:11-12</a>). It was the great central point whence missionaries to the Gentiles were sent forth. It was the birth-place of the famous Christian father Chrysostom, who died A.D. 407. It bears the modern name of Antakia, and is now a miserable, decaying Turkish town. Like Philippi, it was raised to the rank of a Roman colony. Such colonies were ruled by \"praetors\" (<a href=\"#\" onClick=\"return mV('Act',16,20,21);\">Act 16:20-21</a>).<br><br>(2.) In the extreme north of Pisidia; was visited by Paul and Barnabas on the first missionary journey (<a href=\"#\" onClick=\"return mV('Act',13,14);\">Act 13:14</a>). Here they found a synagogue and many proselytes. They met with great success in preaching the gospel, but the Jews stirred up a violent opposition against them, and they were obliged to leave the place. On his return, Paul again visited Antioch for the purpose of confirming the disciples (<a href=\"#\" onClick=\"return mV('Act',14,21);\">Act 14:21</a>). It has been identified with the modern Yalobatch, lying to the east of Ephesus.";
eastonArray["$$T0000251"] = "<b>Antiochus:</b> the name of several Syrian kings from B.C. 280 to B.C. 65. The most notable of these were,<br><br>(1.) Antiochus the Great, who ascended the throne B.C. 223. He is regarded as the \"king of the north\" referred to in <a href=\"#\" onClick=\"return mV('Dan',11,'13-19');\">Dan 11:13-19</a>. He was succeeded (B.C. 187) by his son, Seleucus Philopater, spoken of by Daniel (<a href=\"#\" onClick=\"return mV('Dan',11,20);\">Dan 11:20</a>) as \"a raiser of taxes\", in the Revised Version, \"one that shall cause an exactor to pass through the glory of the kingdom.\"<br><br>(2.) Antiochus IV., surnamed \"Epiphanes\" i.e., the Illustrious, succeeded his brother Seleucus (B.C. 175). His career and character are prophetically described by Daniel (<a href=\"#\" onClick=\"return mV('Dan',11,'21-32');\">Dan 11:21-32</a>). He was a \"vile person.\" In a spirit of revenge he organized an expedition against Jerusalem, which he destroyed, putting vast multitudes of its inhabitants to death in the most cruel manner. From this time the Jews began the great war of independence under their heroic Maccabean leaders with marked success, defeating the armies of Antiochus that were sent against them. Enraged at this, Antiochus marched against them in person, threatening utterly to exterminate the nation; but on the way he was suddenly arrested by the hand of death (B.C. 164).";
eastonArray["$$T0000252"] = "<b>Antipas:</b><br><br>(1.) Herod Antipas, a son of Herod the Great by his Samaritan wife Malthace. He was tetrarch of Galilee and Peraea during the whole period of our Lord's life on earth (<a href=\"#\" onClick=\"return mV('Luk',23,7);\">Luk 23:7</a>). He was a frivolous and vain prince, and was chargeable with many infamous crimes (<a href=\"#\" onClick=\"return mV('Mar',8,15);\">Mar 8:15</a>; <a href=\"#\" onClick=\"return mV('Luk',3,19);\">Luk 3:19</a>; <a href=\"#\" onClick=\"return mV('Luk',13,31,32);\">13:31-32</a>). He beheaded John the Baptist (<a href=\"#\" onClick=\"return mV('Mat',14,'1-12');\">Mat 14:1-12</a>) at the instigation of Herodias, the wife of his half-brother Herod-Philip, whom he had married. Pilate sent Christ to him when he was at Jerusalem at the Passover (<a href=\"#\" onClick=\"return mV('Luk',23,7);\">Luk 23:7</a>). He asked some idle questions of him, and after causing him to be mocked, sent him back again to Pilate. The wife of Chuza, his house-steward, was one of our Lord's disciples (<a href=\"#\" onClick=\"return mV('Luk',8,3);\">Luk 8:3</a>).<br><br>(2.) A \"faithful martyr\" (<a href=\"#\" onClick=\"return mV('Rev',2,13);\">Rev 2:13</a>), of whom nothing more is certainly known.";
eastonArray["$$T0000253"] = "<b>Antipatris:</b> a city built by Herod the Great, and called by this name in honour of his father, Antipater. It lay between Caesarea and Lydda, two miles inland, on the great Roman road from Caesarea to Jerusalem. To this place Paul was brought by night (<a href=\"#\" onClick=\"return mV('Act',23,31);\">Act 23:31</a>) on his way to Caesarea, from which it was distant 28 miles. It is identified with the modern, Ras-el-Ain, where rise the springs of Aujeh, the largest springs in Palestine.";
eastonArray["$$T0000254"] = "<b>Antonia:</b> a fortress in Jerusalem, at the north-west corner of the temple area. It is called \"the castle\" (<a href=\"#\" onClick=\"return mV('Act',21,34,37);\">Act 21:34, 37</a>). From the stairs of this castle Paul delivered his famous speech to the multitude in the area below (<a href=\"#\" onClick=\"return mV('Act',22,'1-21');\">Act 22:1-21</a>). It was originally a place in which were kept the vestments of the high priest. Herod fortified it, and called it Antonia in honour of his friend Mark Antony. It was of great size, and commanded the temple. It was built on a plateau of rock, separated on the north from the hill Bezetha by a ditch about 30 feet deep and 165 feet wide.";
eastonArray["$$T0000255"] = "<b>Antothite:</b> an inhabitant of Anathoth, found only in <a href=\"#\" onClick=\"return mV('1Ch',11,28);\">1Ch 11:28</a>; <a href=\"#\" onClick=\"return mV('1Ch',12,3);\">12:3</a>. In <a href=\"#\" onClick=\"return mV('2Sa',23,27);\">2Sa 23:27</a> it is Anethothite; in <a href=\"#\" onClick=\"return mV('1Ch',27,12);\">1Ch 27:12</a>, Anetothite. (R.V., \"Anathothite.\")";
eastonArray["$$T0000256"] = "<b>Anvil:</b> the rendering of the Hebrew word, \"beaten,\" found only in <a href=\"#\" onClick=\"return mV('Isa',41,7);\">Isa. 41:7</a>.";
eastonArray["$$T0000257"] = "<b>Ape:</b> an animal of the monkey tribe (<a href=\"#\" onClick=\"return mV('1Ki',10,22);\">1Ki 10:22</a>; <a href=\"#\" onClick=\"return mV('2Ch',9,21);\">2Ch 9:21</a>). It was brought from India by the fleets of Solomon and Hiram, and was called by the Hebrews <i>koph</i>, and by the Greeks <i>kepos</i>, both words being just the Indian Tamil name of the monkey, kapi, i.e., swift, nimble, active. No species of ape has ever been found in Palestine or the adjacent regions.";
eastonArray["$$T0000258"] = "<b>Apelles:</b> a Christian at Rome whom Paul salutes (<a href=\"#\" onClick=\"return mV('Rom',16,10);\">Rom 16:10</a>), and styles \"approved in Christ.\"";
eastonArray["$$T0000259"] = "<b>Apharsachites:</b> a company of the colonists whom the Assyrian king planted in Samaria (<a href=\"#\" onClick=\"return mV('Ezr',5,6);\">Ezr 5:6</a>; <a href=\"#\" onClick=\"return mV('Ezr',6,6);\">6:6</a>).";
eastonArray["$$T0000260"] = "<b>Apharsites:</b> another of the tribes removed to Samaria (<a href=\"#\" onClick=\"return mV('Ezr',4,9);\">Ezr 4:9</a>), or perhaps the same as the preceding.";
eastonArray["$$T0000261"] = "<b>Aphik:</b> (<a href=\"#\" onClick=\"return mV('Jdg',1,31);\">Jdg 1:31</a>); Aphek (<a href=\"#\" onClick=\"return mV('Jos',13,4);\">Jos 13:4</a>; <a href=\"#\" onClick=\"return mV('Jos',19,30);\">19:30</a>), stronghold.<br><br>(1.) A city of the tribe of Asher. It was the scene of the licentious worship of the Syrian Aphrodite. The ruins of the temple, \"magnificent ruins\" in a \"spot of strange wildness and beauty\", are still seen at Afka, on the north-west slopes of Lebanon, near the source of the river Adonis (now Nahr Ibrahim), 12 miles east of Gebal.<br><br>(2.) A city of the tribe of Issachar, near to Jezreel (<a href=\"#\" onClick=\"return mV('1Sa',4,1);\">1Sa 4:1</a>; <a href=\"#\" onClick=\"return mV('1Sa',29,1);\">29:1</a>; <a href=\"#\" onClick=\"return mV('1Sa',28,4);\">1Sa 28:4</a>).<br><br>(3.) A town on the road from Damascus to Palestine, in the level plain east of Jordan, near which Benhadad was defeated by the Israelites (<a href=\"#\" onClick=\"return mV('1Ki',20,26,30);\">1Ki 20:26, 30</a>; <a href=\"#\" onClick=\"return mV('2Ki',13,17);\">2Ki 13:17</a>). It has been identified with the modern Fik, 6 miles east of the Sea of Galilee, opposite Tiberias.";
eastonArray["$$T0000262"] = "<b>Apocalypse:</b> the Greek name of the Book of Revelation (q.v.).";
eastonArray["$$T0000263"] = "<b>Apocrypha:</b> hidden, spurious, the name given to certain ancient books which found a place in the LXX. and Latin Vulgate versions of the Old Testament, and were appended to all the great translations made from them in the sixteenth century, but which have no claim to be regarded as in any sense parts of the inspired Word.<br><br>(1.) They are not once quoted by the New Testament writers, who frequently quote from the LXX. Our Lord and his apostles confirmed by their authority the ordinary Jewish canon, which was the same in all respects as we now have it.<br><br>(2.) These books were written not in Hebrew but in Greek, and during the \"period of silence,\" from the time of Malachi, after which oracles and direct revelations from God ceased till the Christian era.<br><br>(3.) The contents of the books themselves show that they were no part of Scripture. The Old Testament Apocrypha consists of fourteen books, the chief of which are the Books of the Maccabees (q.v.), the Books of Esdras, the Book of Wisdom, the Book of Baruch, the Book of Esther, Ecclesiasticus, Tobit, Judith, etc.<br><br>The New Testament Apocrypha consists of a very extensive literature, which bears distinct evidences of its non-apostolic origin, and is utterly unworthy of regard.";
eastonArray["$$T0000264"] = "<b>Apollonia:</b> a city of Macedonia between Amphipolis and Thessalonica, from which it was distant about 36 miles. Paul and Silas passed through it on their way to Thessalonica (<a href=\"#\" onClick=\"return mV('Act',17,1);\">Act 17:1</a>).";
eastonArray["$$T0000265"] = "<b>Apollos:</b> a Jew \"born at Alexandria,\" a man well versed in the Scriptures and eloquent (<a href=\"#\" onClick=\"return mV('Act',18,24);\">Act 18:24</a>; R.V., \"learned\"). He came to Ephesus (about A.D. 49), where he spake \"boldly\" in the synagogue (<a href=\"#\" onClick=\"return mV('Act',18,26);\">Act 18:26</a>), although he did not know as yet that Jesus of Nazareth was the Messiah. Aquila and Priscilla instructed him more perfectly in \"the way of God\", i.e., in the knowledge of Christ. He then proceeded to Corinth, where he met Paul (<a href=\"#\" onClick=\"return mV('Act',18,27);\">Act 18:27</a>; <a href=\"#\" onClick=\"return mV('Act',19,1);\">19:1</a>). He was there very useful in watering the good seed Paul had sown (<a href=\"#\" onClick=\"return mV('1Cr',1,12);\">1Cr 1:12</a>), and in gaining many to Christ. His disciples were much attached to him (<a href=\"#\" onClick=\"return mV('1Cr',3,'4-7',22);\">1Cr 3:4-7, 22</a>). He was with Paul at Ephesus when he wrote the First Epistle to the Corinthians; and Paul makes kindly reference to him in his letter to Titus (<a href=\"#\" onClick=\"return mV('Tts',3,13);\">Tts 3:13</a>). Some have supposed, although without sufficient ground, that he was the author of the Epistle to the Hebrews.";
eastonArray["$$T0000266"] = "<b>Apollyon:</b> destroyer, the name given to the king of the hosts represented by the locusts (<a href=\"#\" onClick=\"return mV('Rev',9,11);\">Rev 9:11</a>). It is the Greek translation of the Hebrew Abaddon (q.v.).";
eastonArray["$$T0000267"] = "<b>Apostle:</b> a person sent by another; a messenger; envoy. This word is once used as a descriptive designation of Jesus Christ, the Sent of the Father (<a href=\"#\" onClick=\"return mV('Hbr',3,1);\">Hbr 3:1</a>; <a href=\"#\" onClick=\"return mV('Jhn',20,21);\">Jhn 20:21</a>). It is, however, generally used as designating the body of disciples to whom he intrusted the organization of his church and the dissemination of his gospel, \"the twelve,\" as they are called (<a href=\"#\" onClick=\"return mV('Mat',10,'1-5');\">Mat 10:1-5</a>; <a href=\"#\" onClick=\"return mV('Mar',3,14);\">Mar 3:14</a>; <a href=\"#\" onClick=\"return mV('Mar',6,7);\">6:7</a>; <a href=\"#\" onClick=\"return mV('Luk',6,13);\">Luk 6:13</a>; <a href=\"#\" onClick=\"return mV('Luk',9,1);\">9:1</a>). We have four lists of the apostles, one by each of the synoptic evangelists (<a href=\"#\" onClick=\"return mV('Mat',10,'2-4');\">Mat 10:2-4</a>; <a href=\"#\" onClick=\"return mV('Mar',3,16);\">Mar 3:16</a>; <a href=\"#\" onClick=\"return mV('Luk',6,14);\">Luk 6:14</a>), and one in the Acts (<a href=\"#\" onClick=\"return mV('Act',1,13);\">Act 1:13</a>). No two of these lists, however, perfectly coincide.<br><br>Our Lord gave them the \"keys of the kingdom,\" and by the gift of his Spirit fitted them to be the founders and governors of his church (<a href=\"#\" onClick=\"return mV('Jhn',14,16,17,26);\">Jhn 14:16-17, 26</a>; <a href=\"#\" onClick=\"return mV('Jhn',15,26,27);\">15:26-27</a>; <a href=\"#\" onClick=\"return mV('Jhn',16,'7-15');\">16:7-15</a>). To them, as representing his church, he gave the commission to \"preach the gospel to every creature\" (<a href=\"#\" onClick=\"return mV('Mat',28,'18-20');\">Mat 28:18-20</a>). After his ascension he communicated to them, according to his promise, supernatural gifts to qualify them for the discharge of their duties (<a href=\"#\" onClick=\"return mV('Act',2,4);\">Act 2:4</a>; <a href=\"#\" onClick=\"return mV('1Cr',2,16);\">1Cr 2:16</a>; <a href=\"#\" onClick=\"return mV('1Cr',2,7,10,13);\">2:7, 10, 13</a>; <a href=\"#\" onClick=\"return mV('2Cr',5,20);\">2Cr 5:20</a>; <a href=\"#\" onClick=\"return mV('1Cr',11,2);\">1Cr 11:2</a>). Judas Iscariot, one of \"the twelve,\" fell by transgression, and Matthias was substituted in his place (<a href=\"#\" onClick=\"return mV('Act',1,21);\">Act 1:21</a>). Saul of Tarsus was afterwards added to their number (<a href=\"#\" onClick=\"return mV('Act',9,'3-20');\">Act 9:3-20</a>; <a href=\"#\" onClick=\"return mV('Act',20,4);\">20:4</a>; <a href=\"#\" onClick=\"return mV('Act',26,'15-18');\">26:15-18</a>; <a href=\"#\" onClick=\"return mV('1Ti',1,12);\">1Ti 1:12</a>; <a href=\"#\" onClick=\"return mV('1Ti',2,7);\">2:7</a>; <a href=\"#\" onClick=\"return mV('2Ti',1,11);\">2Ti 1:11</a>).<br><br>Luke has given some account of Peter, John, and the two Jameses (<a href=\"#\" onClick=\"return mV('Act',12,2,17);\">Act 12:2, 17</a>; <a href=\"#\" onClick=\"return mV('Act',15,13);\">15:13</a>; <a href=\"#\" onClick=\"return mV('Act',21,18);\">21:18</a>), but beyond this we know nothing from authentic history of the rest of the original twelve. After the martyrdom of James the Greater (<a href=\"#\" onClick=\"return mV('Act',12,2);\">Act 12:2</a>), James the Less usually resided at Jerusalem, while Paul, \"the apostle of the uncircumcision,\" usually travelled as a missionary among the Gentiles (<a href=\"#\" onClick=\"return mV('Gal',2,8);\">Gal 2:8</a>). It was characteristic of the apostles and necessary<br><br>(1.) that they should have seen the Lord, and been able to testify of him and of his resurrection from personal knowledge (<a href=\"#\" onClick=\"return mV('Jhn',15,27);\">Jhn 15:27</a>; <a href=\"#\" onClick=\"return mV('Act',1,21,22);\">Act 1:21-22</a>; <a href=\"#\" onClick=\"return mV('1Cr',9,1);\">1Cr 9:1</a>; <a href=\"#\" onClick=\"return mV('Act',22,14,15);\">Act 22:14-15</a>).<br><br>(2.) They must have been immediately called to that office by Christ (<a href=\"#\" onClick=\"return mV('Luk',6,13);\">Luk 6:13</a>; <a href=\"#\" onClick=\"return mV('Gal',1,1);\">Gal 1:1</a>).<br><br>(3.) It was essential that they should be infallibly inspired, and thus secured against all error and mistake in their public teaching, whether by word or by writing (<a href=\"#\" onClick=\"return mV('Jhn',14,26);\">Jhn 14:26</a>; <a href=\"#\" onClick=\"return mV('Jhn',16,13);\">16:13</a>; <a href=\"#\" onClick=\"return mV('1Th',2,13);\">1Th 2:13</a>).<br><br>(4.) Another qualification was the power of working miracles (<a href=\"#\" onClick=\"return mV('Mar',16,20);\">Mar 16:20</a>; <a href=\"#\" onClick=\"return mV('Act',2,43);\">Act 2:43</a>; <a href=\"#\" onClick=\"return mV('1Cr',12,'8-11');\">1Cr 12:8-11</a>). The apostles therefore could have had no successors. They are the only authoritative teachers of the Christian doctrines. The office of an apostle ceased with its first holders.<br><br>In <a href=\"#\" onClick=\"return mV('2Cr',8,23);\">2Cr 8:23</a> and <a href=\"#\" onClick=\"return mV('Phl',2,25);\">Phl 2:25</a> the word \"messenger\" is the rendering of the same Greek word, elsewhere rendered \"apostle.\"";
eastonArray["$$T0000268"] = "<b>Apothecary:</b> rendered in the margin and the Revised Version \"perfumer,\" in <a href=\"#\" onClick=\"return mV('Exd',30,25);\">Exd 30:25</a>; <a href=\"#\" onClick=\"return mV('Exd',37,29);\">37:29</a>; <a href=\"#\" onClick=\"return mV('Ecc',10,1);\">Ecc 10:1</a>. The holy oils and ointments were prepared by priests properly qualified for this office. The feminine plural form of the Hebrew word is rendered \"confectionaries\" in <a href=\"#\" onClick=\"return mV('1Sa',8,13);\">1Sa 8:13</a>.";
eastonArray["$$T0000269"] = "<b>Apparel:</b> In Old Testament times the distinction between male and female attire was not very marked. The statute forbidding men to wear female apparel (<a href=\"#\" onClick=\"return mV('Deu',22,5);\">Deu 22:5</a>) referred especially to ornaments and head-dresses. Both men and women wore<br><br>(1.) an under garment or tunic, which was bound by a girdle. One who had only this tunic on was spoken of as \"naked\" (<a href=\"#\" onClick=\"return mV('1Sa',19,24);\">1Sa 19:24</a>; <a href=\"#\" onClick=\"return mV('Job',24,10);\">Job 24:10</a>; <a href=\"#\" onClick=\"return mV('Isa',20,2);\">Isa 20:2</a>). Those in high stations sometimes wore two tunics, the outer being called the \"upper garment\" (<a href=\"#\" onClick=\"return mV('1Sa',15,27);\">1Sa 15:27</a>; <a href=\"#\" onClick=\"return mV('1Sa',18,4);\">18:4</a>; <a href=\"#\" onClick=\"return mV('1Sa',24,5);\">24:5</a>; <a href=\"#\" onClick=\"return mV('Job',1,20);\">Job 1:20</a>).<br><br>(2.) They wore in common an over-garment (<a href=\"#\" onClick=\"return mV('Isa',3,22);\">Isa 3:22</a>; <a href=\"#\" onClick=\"return mV('1Ki',19,13);\">1Ki 19:13</a>; <a href=\"#\" onClick=\"return mV('2Ki',2,13);\">2Ki 2:13</a>), a loose and flowing robe. The folds of this upper garment could be formed into a lap (<a href=\"#\" onClick=\"return mV('Rth',3,15);\">Rth 3:15</a>; <a href=\"#\" onClick=\"return mV('Psa',79,12);\">Psa 79:12</a>; <a href=\"#\" onClick=\"return mV('Pro',17,23);\">Pro 17:23</a>; <a href=\"#\" onClick=\"return mV('Luk',6,38);\">Luk 6:38</a>). Generals of armies usually wore scarlet robes (<a href=\"#\" onClick=\"return mV('Jdg',8,26);\">Jdg 8:26</a>; <a href=\"#\" onClick=\"return mV('Nah',2,3);\">Nah 2:3</a>). A form of conspicuous raiment is mentioned in <a href=\"#\" onClick=\"return mV('Luk',20,46);\">Luk 20:46</a>; comp. <a href=\"#\" onClick=\"return mV('Mat',23,5);\">Mat 23:5</a>.<br><br>Priests alone wore trousers. Both men and women wore turbans. Kings and nobles usually had a store of costly garments for festive occasions (<a href=\"#\" onClick=\"return mV('Isa',3,22);\">Isa 3:22</a>; <a href=\"#\" onClick=\"return mV('Zec',3,4);\">Zec 3:4</a>) and for presents (<a href=\"#\" onClick=\"return mV('Gen',45,22);\">Gen 45:22</a>; <a href=\"#\" onClick=\"return mV('Est',4,4);\">Est 4:4</a>; <a href=\"#\" onClick=\"return mV('Est',6,8,11);\">6:8, 11</a>; <a href=\"#\" onClick=\"return mV('1Sa',18,4);\">1Sa 18:4</a>; <a href=\"#\" onClick=\"return mV('2Ki',5,5);\">2Ki 5:5</a>; <a href=\"#\" onClick=\"return mV('2Ki',10,22);\">10:22</a>). Prophets and ascetics wore coarse garments (<a href=\"#\" onClick=\"return mV('Isa',20,2);\">Isa 20:2</a>; <a href=\"#\" onClick=\"return mV('Zec',13,4);\">Zec 13:4</a>; <a href=\"#\" onClick=\"return mV('Mat',3,4);\">Mat 3:4</a>).";
eastonArray["$$T0000270"] = "<b>Appeal:</b> a reference of any case from an inferior to a superior court. Moses established in the wilderness a series of judicatories such that appeals could be made from a lower to a higher (<a href=\"#\" onClick=\"return mV('Exd',18,'13-26');\">Exd 18:13-26</a>.)<br><br>Under the Roman law the most remarkable case of appeal is that of Paul from the tribunal of Festus at Caesarea to that of the emperor at Rome (<a href=\"#\" onClick=\"return mV('Act',25,11,12,21, 25);\">Act 25:11-12, 21, 25</a>). Paul availed himself of the privilege of a Roman citizen in this matter.";
eastonArray["$$T0000271"] = "<b>Apphia:</b> increasing, a female Christian at Colosse (<a href=\"#\" onClick=\"return mV('Phm',1,2);\">Phm 1:2</a>), supposed by some to have been the wife of Philemon.";
eastonArray["$$T0000272"] = "<b>Appii Forum:</b> i.e., \"the market of Appius\" (<a href=\"#\" onClick=\"return mV('Act',28,15);\">Act 28:15</a>, R.V.), a town on the road, the \"Appian Way,\" from Rome to Brundusium. It was 43 miles from Rome. Here Paul was met by some Roman Christians on his way to the capital. It was natural that they should halt here and wait for him, because from this place there were two ways by which travellers might journey to Rome.";
eastonArray["$$T0000273"] = "<b>Apple:</b> (Heb. tappuah, meaning \"fragrance\"). Probably the apricot or quince is intended by the word, as Palestine was too hot for the growth of apples proper. It is enumerated among the most valuable trees of Palestine (<a href=\"#\" onClick=\"return mV('Joe',1,12);\">Joe 1:12</a>), and frequently referred to in Canticles, and noted for its beauty (<a href=\"#\" onClick=\"return mV('Sgs',2,3,5);\">Songs 2:3, 5</a>; <a href=\"#\" onClick=\"return mV('Sgs',8,5);\">Sgs 8:5</a>). There is nothing to show that it was the \"tree of the knowledge of good and evil.\" Dr. Tristram has suggested that the apricot has better claims than any other fruit-tree to be the apple of Scripture. It grows to a height of 30 feet, has a roundish mass of glossy leaves, and bears an orange coloured fruit that gives out a delicious perfume. The \"apple of the eye\" is the Heb. <i>ishon</i>, meaning manikin, i.e., the pupil of the eye (<a href=\"#\" onClick=\"return mV('Pro',7,2);\">Pro 7:2</a>). (<a href=\"#\" onClick=\"return mV('Zec',2,8);\">Zec 2:8</a>; <a href=\"#\" onClick=\"return mV('Psa',17,8);\">Psa 17:8</a>; <a href=\"#\" onClick=\"return mV('Deu',32,10);\">Deu 32:10</a>.)<br><br>The so-called \"apple of Sodom\" some have supposed to be the <em>Solanum sanctum</em> (Heb. hedek), rendered \"brier\" (q.v.) in <a href=\"#\" onClick=\"return mV('Mic',7,4);\">Mic 7:4</a>, a thorny plant bearing fruit like the potato-apple. This shrub abounds in the Jordan valley. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001207');\">ENGEDI</a>.)";
eastonArray["$$T0000274"] = "<b>Apron:</b> found in the Authorized Version in <a href=\"#\" onClick=\"return mV('Gen',3,7);\">Gen 3:7</a>, of the bands of fig-leaves made by our first parents. In <a href=\"#\" onClick=\"return mV('Act',19,12);\">Act 19:12</a>, it denotes the belt or half-girdle worn by artisans and servants round the waist for the purpose of preserving the clothing from injury. In marg. of Authorized Version, <a href=\"#\" onClick=\"return mV('Rth',3,15);\">Rth 3:15</a>, correctly rendered instead of \"vail.\" (R.V., \"mantle.\")";
eastonArray["$$T0000275"] = "<b>Aquila:</b> eagle, a native of Pontus, by occupation a tent-maker, whom Paul met on his first visit to Corinth (<a href=\"#\" onClick=\"return mV('Act',18,2);\">Act 18:2</a>). Along with his wife Priscilla he had fled from Rome in consequence of a decree (A.D. 50) by Claudius commanding all Jews to leave the city. Paul sojourned with him at Corinth, and they wrought together at their common trade, making Cilician hair-cloth for tents. On Paul's departure from Corinth after eighteen months, Aquila and his wife accompanied him to Ephesus, where they remained, while he proceeded to Syria (<a href=\"#\" onClick=\"return mV('Act',18,18,26);\">Act 18:18, 26</a>). When they became Christians we are not informed, but in Ephesus they were (<a href=\"#\" onClick=\"return mV('1Cr',16,19);\">1Cr 16:19</a>) Paul's \"helpers in Christ Jesus.\" We find them afterwards at Rome (<a href=\"#\" onClick=\"return mV('Rom',16,3);\">Rom 16:3</a>), interesting themselves still in the cause of Christ. They are referred to some years after this as being at Ephesus (<a href=\"#\" onClick=\"return mV('2Ti',4,19);\">2Ti 4:19</a>). This is the last notice we have of them.";
eastonArray["$$T0000276"] = "<b>Arab:</b> ambush, a city in the mountains of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,52);\">Jos 15:52</a>), now Er-Rabiyeh.";
eastonArray["$$T0000277"] = "<b>Arabah:</b> plain, in the Revised Version of <a href=\"#\" onClick=\"return mV('2Ki',14,25);\">2Ki 14:25</a>; <a href=\"#\" onClick=\"return mV('Jos',3,16);\">Jos 3:16</a>; <a href=\"#\" onClick=\"return mV('Jos',8,14);\">8:14</a>; <a href=\"#\" onClick=\"return mV('2Sa',2,29);\">2Sa 2:29</a>; <a href=\"#\" onClick=\"return mV('2Sa',4,7);\">4:7</a> (in all these passages the A.V. has \"plain\"); <a href=\"#\" onClick=\"return mV('Amo',6,14);\">Amo 6:14</a> (A.V. \"wilderness\"). This word is found in the Authorized Version only in <a href=\"#\" onClick=\"return mV('Jos',18,18);\">Jos 18:18</a>. It denotes the hollow depression through which the Jordan flows from the Lake of Galilee to the Dead Sea. It is now called by the Arabs el-Ghor. But the Ghor is sometimes spoken of as extending 10 miles south of the Dead Sea, and thence to the Gulf of Akabah on the Red Sea is called the Wady el-Arabah.";
eastonArray["$$T0000278"] = "<b>Arabia:</b> arid, an extensive region in the south-west of Asia. It is bounded on the west by the Isthmus of Suez and the Red Sea, on the south by the Indian Ocean, and on the east by the Persian Gulf and the Euphrates. It extends far into the north in barren deserts, meeting those of Syria and Mesopotamia. It is one of the few countries of the world from which the original inhabitants have never been expelled.<br><br>It was anciently divided into three parts:,<br><br>(1.) Arabia Felix (Happy Arabia), so called from its fertility. It embraced a large portion of the country now known by the name of Arabia. The Arabs call it Yemen. It lies between the Red Sea and the Persian Gulf. <br><br>(2.) Arabia Deserta, the el-Badieh or \"Great Wilderness\" of the Arabs. From this name is derived that which is usually given to the nomadic tribes which wander over this region, the \"Bedaween,\" or, more generally, \"Bedouin,\"<br><br>(3.) Arabia Petraea, i.e., the Rocky Arabia, so called from its rocky mountains and stony plains. It comprehended all the north-west portion of the country, and is much better known to travellers than any other portion. This country is, however, divided by modern geographers into<br><br>(1.) Arabia Proper, or the Arabian Peninsula;<br><br>(2.) Northern Arabia, or the Arabian Desert; and<br><br>(3.) Western Arabia, which includes the peninsula of Sinai and the Desert of Petra, originally inhabited by the Horites (<a href=\"#\" onClick=\"return mV('Gen',14,6);\">Gen 14:6</a>, etc.), but in later times by the descendants of Esau, and known as the Land of Edom or Idumea, also as the Desert of Seir or Mount Seir.<br><br>The whole land appears (<a href=\"#\" onClick=\"return mV('Gen',10,'1-')\">Gen 10</a>) to have been inhabited by a variety of tribes of different lineage, Ishmaelites, Arabians, Idumeans, Horites, and Edomites; but at length becoming amalgamated, they came to be known by the general designation of Arabs. The modern nation of Arabs is predominantly Ishmaelite. Their language is the most developed and the richest of all the Semitic languages, and is of great value to the student of Hebrew.<br><br>The Israelites wandered for forty years in Arabia. In the days of Solomon, and subsequently, commercial intercourse was to a considerable extent kept up with this country (<a href=\"#\" onClick=\"return mV('1Ki',10,15);\">1Ki 10:15</a>; <a href=\"#\" onClick=\"return mV('2Ch',9,14);\">2Ch 9:14</a>; <a href=\"#\" onClick=\"return mV('2Ch',17,11);\">17:11</a>). Arabians were present in Jerusalem at Pentecost (<a href=\"#\" onClick=\"return mV('Act',2,11);\">Act 2:11</a>). Paul retired for a season into Arabia after his conversion (<a href=\"#\" onClick=\"return mV('Gal',1,17);\">Gal 1:17</a>). This country is frequently referred to by the prophets (<a href=\"#\" onClick=\"return mV('Isa',21,11);\">Isa 21:11</a>; <a href=\"#\" onClick=\"return mV('Isa',42,11);\">42:11</a>; <a href=\"#\" onClick=\"return mV('Jer',25,24);\">Jer 25:24</a>, etc.)";
eastonArray["$$T0000279"] = "<b>Arad:</b><br><br>(1.) Now Tell Arad, a Canaanite city, about 20 miles south of Hebron. The king of Arad \"fought against Israel and took of them prisoners\" when they were retreating from the confines of Edom (<a href=\"#\" onClick=\"return mV('Num',21,1);\">Num 21:1</a>; <a href=\"#\" onClick=\"return mV('Num',33,40);\">33:40</a>; <a href=\"#\" onClick=\"return mV('Jdg',1,16);\">Jdg 1:16</a>). It was finally subdued by Joshua (<a href=\"#\" onClick=\"return mV('Jos',12,14);\">Jos 12:14</a>).<br><br>(2.) One of the sons of Beriah (<a href=\"#\" onClick=\"return mV('1Ch',8,15);\">1Ch 8:15</a>).";
eastonArray["$$T0000280"] = "<b>Aram:</b> the son of Shem (<a href=\"#\" onClick=\"return mV('Gen',10,22);\">Gen 10:22</a>); according to <a href=\"#\" onClick=\"return mV('Gen',22,21);\">Gen 22:21</a>, a grandson of Nahor. In <a href=\"#\" onClick=\"return mV('Mat',1,3,4);\">Mat 1:3-4</a>, and <a href=\"#\" onClick=\"return mV('Luk',3,33);\">Luk 3:33</a>, this word is the Greek form of Ram, the father of Amminadab (<a href=\"#\" onClick=\"return mV('1Ch',2,10);\">1Ch 2:10</a>).<br><br>The word means high, or highlands, and as the name of a country denotes that elevated region extending from the northeast of Palestine to the Euphrates. It corresponded generally with the Syria and Mesopotamia of the Greeks and Romans. In <a href=\"#\" onClick=\"return mV('Gen',25,20);\">Gen 25:20</a>; <a href=\"#\" onClick=\"return mV('Gen',31,20,24);\">31:20, 24</a>; <a href=\"#\" onClick=\"return mV('Deu',26,5);\">Deu 26:5</a>, the word \"Syrian\" is properly \"Aramean\" (R.V., marg.). Damascus became at length the capital of the several smaller kingdoms comprehended under the designation \"Aram\" or \"Syria.\"";
eastonArray["$$T0000281"] = "<b>Aram-naharaim:</b> Aram of the two rivers, is Mesopotamia (rendered in <a href=\"#\" onClick=\"return mV('Gen',24,10);\">Gen 24:10</a>), the country enclosed between the Tigris on the east and the Euphrates on the west (<a href=\"#\" onClick=\"return mV('Psa',60,'1-');\">Psa 60, title</a>); called also the \"field of Aram\" (<a href=\"#\" onClick=\"return mV('Hsa',12,12);\">Hsa 12:12</a>, R.V.) i.e., the open country of Aram; in the Authorized Version, \"country of Syria.\" Padan-aram (q.v.) was a portion of this country.";
eastonArray["$$T0000282"] = "<b>Aram-zobah:</b> (<a href=\"#\" onClick=\"return mV('Psa',60,'1-');\">Psa 60, title</a>), probably the region between the Euphrates and the Orontes.";
eastonArray["$$T0000283"] = "<b>Aran:</b> wild goat, a descendant of Seir the Horite (<a href=\"#\" onClick=\"return mV('Gen',36,28);\">Gen 36:28</a>).";
eastonArray["$$T0000284"] = "<b>Ararat:</b> sacred land or high land, the name of a country on one of the mountains of which the ark rested after the Flood subsided (<a href=\"#\" onClick=\"return mV('Gen',8,4);\">Gen 8:4</a>). The \"mountains\" mentioned were probably the Kurdish range of South Armenia. In <a href=\"#\" onClick=\"return mV('2Ki',19,37);\">2Ki 19:37</a>; <a href=\"#\" onClick=\"return mV('Isa',37,38);\">Isa 37:38</a>, the word is rendered \"Armenia\" in the Authorized Version, but in the Revised Version, \"Land of Ararat.\" In <a href=\"#\" onClick=\"return mV('Jer',51,27);\">Jer 51:27</a>, the name denotes the central or southern portion of Armenia. It is, however, generally applied to a high and almost inaccessible mountain which rises majestically from the plain of the Araxes. It has two conical peaks, about 7 miles apart, the one 14,300 feet and the other 10,300 feet above the level of the plain. Three thousand feet of the summit of the higher of these peaks is covered with perpetual snow. It is called Kuh-i-nuh, i.e., \"Noah's mountain\", by the Persians. This part of Armenia was inhabited by a people who spoke a language unlike any other now known, though it may have been related to the modern Georgian. About B.C. 900 they borrowed the cuneiform characters of Nineveh, and from this time we have inscriptions of a line of kings who at times contended with Assyria. At the close of the seventh century B.C. the kingdom of Ararat came to an end, and the country was occupied by a people who are ancestors of the Armenians of the present day.";
eastonArray["$$T0000285"] = "<b>Araunah:</b> agile; also called Ornan <a href=\"#\" onClick=\"return mV('1Ch',21,15);\">1Ch 21:15</a>, a Jebusite who dwelt in Jerusalem before it was taken by the Israelites. The destroying angel, sent to punish David for his vanity in taking a census of the people, was stayed in his work of destruction near a threshing-floor belonging to Araunah which was situated on Mount Moriah. Araunah offered it to David as a free gift, together with the oxen and the threshing instruments; but the king insisted on purchasing it at its full price (<a href=\"#\" onClick=\"return mV('2Sa',24,24);\">2Sa 24:24</a>; <a href=\"#\" onClick=\"return mV('1Ch',21,24,25);\">1Ch 21:24-25</a>), for, according to the law of sacrifices, he could not offer to God what cost him nothing. On the same place Solomon afterwards erected the temple (<a href=\"#\" onClick=\"return mV('2Sa',24,16);\">2Sa 24:16</a>; <a href=\"#\" onClick=\"return mV('2Ch',3,1);\">2Ch 3:1</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000185');\">ALTAR</a>.)";
eastonArray["$$T0000286"] = "<b>Arba:</b> four, a giant, father of Anak. From him the city of Hebron derived its name of Kirjath-arba, i.e., the city of Araba (<a href=\"#\" onClick=\"return mV('Jos',14,15);\">Jos 14:15</a>; <a href=\"#\" onClick=\"return mV('Jos',15,13);\">15:13</a>; <a href=\"#\" onClick=\"return mV('Jos',21,11);\">21:11</a>; <a href=\"#\" onClick=\"return mV('Gen',13,18);\">Gen 13:18</a>; <a href=\"#\" onClick=\"return mV('Gen',23,2);\">23:2</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001712');\">HEBRON</a>.)";
eastonArray["$$T0000287"] = "<b>Arbathite:</b> a name given to Abi-albon, or, as elsewhere called, Abiel, one of David's warriors (<a href=\"#\" onClick=\"return mV('2Sa',23,31);\">2Sa 23:31</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,32);\">1Ch 11:32</a>), probably as being an inhabitant of Arabah (<a href=\"#\" onClick=\"return mV('Jos',15,61);\">Jos 15:61</a>), a town in the wilderness of Judah.";
eastonArray["$$T0000288"] = "<b>Arch:</b> an architectural term found only in <a href=\"#\" onClick=\"return mV('Eze',40,16,21,22,26,29);\">Eze 40:16, 21, 22, 26, 29</a>. There is no absolute proof that the Israelites employed arches in their buildings. The arch was employed in the building of the pyramids of Egypt. The oldest existing arch is at Thebes, and bears the date B.C. 1350. There are also still found the remains of an arch, known as Robinson's Arch, of the bridge connecting Zion and Moriah. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003738');\">TYROPOEON VALLEY</a>.)";
eastonArray["$$T0000289"] = "<b>Archangel:</b> (<a href=\"#\" onClick=\"return mV('1Th',4,16);\">1Th 4:16</a>; <a href=\"#\" onClick=\"return mV('Jud',1,9);\">Jud 1:9</a>), the prince of the angels.";
eastonArray["$$T0000290"] = "<b>Archelaus:</b> ruler of the people, son of Herod the Great, by Malthace, a Samaritan woman. He was educated along with his brother Antipas at Rome. He inherited from his father a third part of his kingdom viz., Idumea, Judea, and Samaria, and hence is called \"king\" (<a href=\"#\" onClick=\"return mV('Mat',2,22);\">Mat 2:22</a>). It was for fear of him that Joseph and Mary turned aside on their way back from Egypt. Till a few days before his death Herod had named Antipas as his successor, but in his last moments he named Archelaus.";
eastonArray["$$T0000291"] = "<b>Archer:</b> a shooter with the bow (<a href=\"#\" onClick=\"return mV('1Ch',10,3);\">1Ch 10:3</a>). This art was of high antiquity (<a href=\"#\" onClick=\"return mV('Gen',21,20);\">Gen 21:20</a>; <a href=\"#\" onClick=\"return mV('Gen',27,3);\">27:3</a>). Saul was wounded by the Philistine archers (<a href=\"#\" onClick=\"return mV('1Sa',31,3);\">1Sa 31:3</a>). The phrase \"breaking the bow\" (<a href=\"#\" onClick=\"return mV('Hsa',1,5);\">Hsa 1:5</a>; <a href=\"#\" onClick=\"return mV('Jer',49,35);\">Jer 49:35</a>) is equivalent to taking away one's power, while \"strengthening the bow\" is a symbol of its increase (<a href=\"#\" onClick=\"return mV('Gen',49,24);\">Gen 49:24</a>). The Persian archers were famous among the ancients (<a href=\"#\" onClick=\"return mV('Isa',13,18);\">Isa 13:18</a>; <a href=\"#\" onClick=\"return mV('Jer',49,35);\">Jer 49:35</a>; <a href=\"#\" onClick=\"return mV('Jer',50,9,14,29,42);\">50:9, 14, 29, 42</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000631');\">BOW</a>).";
eastonArray["$$T0000292"] = "<b>Archevite:</b> one of the nations planted by the Assyrians in Samaria (<a href=\"#\" onClick=\"return mV('Ezr',4,9);\">Ezr 4:9</a>); the men of Erech.";
eastonArray["$$T0000293"] = "<b>Archi:</b> a city on the boundary of Ephraim and Benjamin (<a href=\"#\" onClick=\"return mV('Jos',16,2);\">Jos 16:2</a>), between Bethel and Beth-horon the nether.";
eastonArray["$$T0000294"] = "<b>Archippus:</b> master of the horse, a \"fellow-soldier\" of Paul's (<a href=\"#\" onClick=\"return mV('Phm',1,2);\">Phm 1:2</a>), whom he exhorts to renewed activity (<a href=\"#\" onClick=\"return mV('Col',4,17);\">Col 4:17</a>). He was a member of Philemon's family, probably his son.";
eastonArray["$$T0000295"] = "<b>Archite:</b> the usual designation of Hushai (<a href=\"#\" onClick=\"return mV('2Sa',15,32);\">2Sa 15:32</a>; <a href=\"#\" onClick=\"return mV('2Sa',17,5,14);\">17:5, 14</a>; <a href=\"#\" onClick=\"return mV('1Ch',27,33);\">1Ch 27:33</a>), who was a native of Archi. He was \"the king's friend\", i.e., he held office under David similar to that of our modern privy councillor.";
eastonArray["$$T0000296"] = "<b>Arcturus:</b> bear-keeper, the name given by the ancients to the brightest star in the constellation Bootes. In the Authorized Version (<a href=\"#\" onClick=\"return mV('Job',9,9);\">Job 9:9</a>; <a href=\"#\" onClick=\"return mV('Job',38,32);\">38:32</a>) it is the rendering of the Hebrew word <i>'ash</i>, which probably designates the constellation the Great Bear. This word ('ash) is supposed to be derived from an Arabic word meaning night-watcher, because the Great Bear always revolves about the pole, and to our nothern hemisphere never sets.";
eastonArray["$$T0000297"] = "<b>Ard:</b> descent, a grandson of Benjamin (<a href=\"#\" onClick=\"return mV('Num',26,'38-40');\">Num 26:38-40</a>). In <a href=\"#\" onClick=\"return mV('1Ch',8,3);\">1Ch 8:3</a> he is called Addar. His descendants are mentioned in <a href=\"#\" onClick=\"return mV('Num',26,40);\">Num 26:40</a>.";
eastonArray["$$T0000298"] = "<b>Ardon:</b> descendant, the last of the three sons of Caleb by his first wife Azubah (<a href=\"#\" onClick=\"return mV('1Ch',2,18);\">1Ch 2:18</a>).";
eastonArray["$$T0000299"] = "<b>Areopagite:</b> a member of the court of Areopagus (<a href=\"#\" onClick=\"return mV('Act',17,34);\">Act 17:34</a>).";
</script>
