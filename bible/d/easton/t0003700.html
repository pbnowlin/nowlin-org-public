<TITLE>Dictionary Info Blue Letter Bible</TITLE>

<script src="./js/nav.js"  type="text/javascript"></script>
<script src="./js/NoNavHeader.js"  type="text/javascript"></script>
<script>
var eastonArray = new Array ();
eastonArray["$$T0003700"] = "<strong>Tooth:</strong> one of the particulars regarding which retaliatory punishment was to be inflicted (<a href=\"#\" onClick=\"return mV('Exd',21,24);\">Exd 21:24</a>; <a href=\"#\" onClick=\"return mV('Lev',24,20);\">Lev 24:20</a>; <a href=\"#\" onClick=\"return mV('Deu',19,21);\">Deu 19:21</a>). \"Gnashing of teeth\" =rage, despair (<a href=\"#\" onClick=\"return mV('Mat',8,12);\">Mat 8:12</a>; <a href=\"#\" onClick=\"return mV('Act',7,54);\">Act 7:54</a>); \"cleanness of teeth\" =famine (<a href=\"#\" onClick=\"return mV('Amo',4,6);\">Amo 4:6</a>); \"children's teeth set on edge\" =children suffering for the sins of their fathers (<a href=\"#\" onClick=\"return mV('Eze',18,2);\">Eze 18:2</a>).";
eastonArray["$$T0003701"] = "<strong>Topaz:</strong> Heb. pitdah (<a href=\"#\" onClick=\"return mV('Eze',28,13);\">Eze 28:13</a>; <a href=\"#\" onClick=\"return mV('Rev',21,20);\">Rev 21:20</a>), a golden yellow or \"green\" stone brought from Cush or Ethiopia (<a href=\"#\" onClick=\"return mV('Job',28,19);\">Job 28:19</a>). It was the second stone in the first row in the breastplate of the high priest, and had the name of Simeon inscribed on it (<a href=\"#\" onClick=\"return mV('Exd',28,17);\">Exd 28:17</a>). It is probably the chrysolite of the moderns.";
eastonArray["$$T0003702"] = "<strong>Tophel:</strong> lime, a place in the wilderness of Sinai (<a href=\"#\" onClick=\"return mV('Deu',1,1);\">Deu 1:1</a>), now identified with Tafyleh or Tufileh, on the west side of the Edomitish mountains.";
eastonArray["$$T0003703"] = "<strong>Tophet:</strong> =Topheth, from Heb. toph \"a drum,\" because the cries of children here sacrificed by the priests of Moloch were drowned by the noise of such an instrument; or from taph or toph, meaning \"to burn,\" and hence a place of burning, the name of a particular part in the valley of Hinnom. \"Fire being the most destructive of all elements, is chosen by the sacred writers to symbolize the agency by which God punishes or destroys the wicked. We are not to assume from prophetical figures that material fire is the precise agent to be used. It was not the agency employed in the destruction of Sennacherib, mentioned in <a href=\"#\" onClick=\"return mV('Isa',30,33);\">Isa 30:33</a>.Tophet properly begins where the Vale of Hinnom bends round to the east, having the cliffs of Zion on the north, and the Hill of Evil Counsel on the south. It terminates at Beer 'Ayub, where it joins the Valley of Jehoshaphat. The cliffs on the southern side especially abound in ancient tombs. Here the dead carcasses of beasts and every offal and abomination were cast, and left to be either devoured by that worm that never died or consumed by that fire that was never quenched.\" Thus Tophet came to represent the place of punishment. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0001790');\">HINNOM</a>.)";
eastonArray["$$T0003704"] = "<strong>Torches:</strong> On the night of his betrayal, when our Lord was in the garden of Gethsemane, Judas, \"having received a band of men and officers from the chief priests and Pharisees, cometh thither with lanterns and torches and weapons\" (<a href=\"#\" onClick=\"return mV('Jhn',18,'1-3');\">Jhn 18:1-3</a>). Although it was the time of full moon, yet in the valley of the Kidron \"there fell great, deep shadows from the declivity of the mountain and projecting rocks; there were there caverns and grottos, into which a fugitive might retreat; finally, there were probably a garden-house and tower, into whose gloom it might be necessary for a searcher to throw light around.\" Lange's Commentary. (<a href=\"#\" onClick=\"return mV('Nah',2,3);\">Nah 2:3</a>, \"torches,\" Revised Version, \"steel,\" probably should be \"scythes\" for war-chariots.)";
eastonArray["$$T0003705"] = "<strong>Torment:</strong> Gr. basanos (<a href=\"#\" onClick=\"return mV('Mat',4,24);\">Mat 4:24</a>), the \"touch-stone\" of justice; hence inquisition by torture, and then any disease which racks and tortures the limbs.";
eastonArray["$$T0003706"] = "<strong>Tortoise:</strong> (Heb. tsabh). Ranked among the unclean animals (<a href=\"#\" onClick=\"return mV('Lev',11,29);\">Lev 11:29</a>). Land tortoises are common in Syria. The LXX. renders the word by \"land crocodile.\" The word, however, more probably denotes a lizard, called by the modern Arabs <i>dhabb</i>.";
eastonArray["$$T0003707"] = "<strong>Tow:</strong> (<a href=\"#\" onClick=\"return mV('Jdg',16,9);\">Jdg 16:9</a>). See <a href=\"#\" onClick=\"return doDictLookup ('ET0001352');\">FLAX</a>.";
eastonArray["$$T0003708"] = "<strong>Tower of the furnaces:</strong> (<a href=\"#\" onClick=\"return mV('Neh',3,11);\">Neh 3:11</a>; <a href=\"#\" onClick=\"return mV('Neh',12,38);\">12:38</a>), a tower at the north-western angle of the second wall of Jerusalem. It was probably so named from its contiguity to the \"bakers' street\" (<a href=\"#\" onClick=\"return mV('Jer',37,21);\">Jer 37:21</a>).";
eastonArray["$$T0003709"] = "<strong>Towers:</strong> of Babel (<a href=\"#\" onClick=\"return mV('Gen',11,4);\">Gen 11:4</a>), Edar (<a href=\"#\" onClick=\"return mV('Gen',35,21);\">Gen 35:21</a>), Penuel (<a href=\"#\" onClick=\"return mV('Jdg',8,9,17);\">Jdg 8:9, 17</a>), Shechem (<a href=\"#\" onClick=\"return mV('Jdg',9,46);\">9:46</a>), David (<a href=\"#\" onClick=\"return mV('Sgs',4,4);\">Sgs 4:4</a>), Lebanon (<a href=\"#\" onClick=\"return mV('Sgs',7,4);\">7:4</a>), Syene (<a href=\"#\" onClick=\"return mV('Eze',29,10);\">Eze 29:10</a>), Hananeel (<a href=\"#\" onClick=\"return mV('Zec',14,10);\">Zec 14:10</a>), Siloam (<a href=\"#\" onClick=\"return mV('Luk',13,4);\">Luk 13:4</a>). There were several towers in Jerusalem (<a href=\"#\" onClick=\"return mV('2Ch',26,9);\">2Ch 26:9</a>; <a href=\"#\" onClick=\"return mV('Psa',48,12);\">Psa 48:12</a>). They were erected for various purposes, as watch-towers in vineyard (<a href=\"#\" onClick=\"return mV('Isa',5,2);\">Isa 5:2</a>; <a href=\"#\" onClick=\"return mV('Mat',21,33);\">Mat 21:33</a>) and towers for defence.";
eastonArray["$$T0003710"] = "<strong>Trachonitis:</strong> a rugged region, corresponds to the Heb. Argob (q.v.), the Greek name of a region on the east of Jordan (<a href=\"#\" onClick=\"return mV('Luk',3,1);\">Luk 3:1</a>); one of the five Roman provinces into which that district was divided. It was in the tetrarchy of Philip, and is now called the Lejah.";
eastonArray["$$T0003711"] = "<strong>Tradition:</strong> any kind of teaching, written or spoken, handed down from generation to generation. In <a href=\"#\" onClick=\"return mV('Mar',7,3,9,13);\">Mar 7:3, 9, 13</a>; <a href=\"#\" onClick=\"return mV('Col',2,8);\">Col 2:8</a>, this word refers to the arbitrary interpretations of the Jews. In <a href=\"#\" onClick=\"return mV('2Th',2,15);\">2Th 2:15</a>; <a href=\"#\" onClick=\"return mV('2Th',3,6);\">3:6</a>, it is used in a good sense. Peter (<a href=\"#\" onClick=\"return mV('1Pe',1,18);\">1Pe 1:18</a>) uses this word with reference to the degenerate Judaism of the \"strangers scattered\" whom he addresses (<a href=\"#\" onClick=\"return mV('Act',15,10);\">Act 15:10</a>; <a href=\"#\" onClick=\"return mV('Mat',15,'2-6');\">Mat 15:2-6</a>; <a href=\"#\" onClick=\"return mV('Gal',1,14);\">Gal 1:14</a>).";
eastonArray["$$T0003712"] = "<strong>Trance:</strong> (Gr. ekstasis, from which the word \"ecstasy\" is derived) denotes the state of one who is \"out of himself.\" Such were the trances of Peter and Paul, <a href=\"#\" onClick=\"return mV('Act',10,10);\">Act 10:10</a>; <a href=\"#\" onClick=\"return mV('Act',11,5);\">11:5</a>; <a href=\"#\" onClick=\"return mV('Act',22,17);\">22:17</a>, ecstasies, \"a preternatural, absorbed state of mind preparing for the reception of the vision\", (<a href=\"#\" onClick=\"return mV('2Cr',12,'1-4');\">2Cr 12:1-4</a>). In <a href=\"#\" onClick=\"return mV('Mar',5,42);\">Mar 5:42</a> and <a href=\"#\" onClick=\"return mV('Luk',5,26);\">Luk 5:26</a> the Greek word is rendered \"astonishment,\" \"amazement\" (<a href=\"#\" onClick=\"return mV('Mar',16,8);\">Mar 16:8</a>; <a href=\"#\" onClick=\"return mV('Act',3,10);\">Act 3:10</a>).";
eastonArray["$$T0003713"] = "<strong>Transfiguration, the:</strong> of our Lord on a \"high mountain apart,\" is described by each of the three evangelists (<a href=\"#\" onClick=\"return mV('Mat',17,'1-8');\">Mat 17:1-8</a>; <a href=\"#\" onClick=\"return mV('Mar',9,'2-8');\">Mar 9:2-8</a>; <a href=\"#\" onClick=\"return mV('Luk',9,'28-36');\">Luk 9:28-36</a>). The fullest account is given by Luke, who, no doubt, was informed by Peter, who was present on the occasion. What these evangelists record was an absolute historical reality, and not a mere vision. The concurrence between them in all the circumstances of the incident is exact. John seems to allude to it also (<a href=\"#\" onClick=\"return mV('Jhn',1,14);\">Jhn 1:14</a>). Forty years after the event Peter distinctly makes mention of it (<a href=\"#\" onClick=\"return mV('2Pe',1,'16-18');\">2Pe 1:16-18</a>). In describing the sanctification of believers, Paul also seems to allude to this majestic and glorious appearance of our Lord on the \"holy mount\" (<a href=\"#\" onClick=\"return mV('Rom',12,2);\">Rom 12:2</a>; <a href=\"#\" onClick=\"return mV('2Cr',3,18);\">2Cr 3:18</a>).<br><br>The place of the transfiguration was probably Mount Hermon (q.v.), and not Mount Tabor, as is commonly supposed.";
eastonArray["$$T0003714"] = "<strong>Treasure cities:</strong> store cities which the Israelites built for the Egyptians (<a href=\"#\" onClick=\"return mV('Exd',1,11);\">Exd 1:11</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002968');\">PITHOM</a>.) Towns in which the treasures of the kings of Judah were kept were so designated (<a href=\"#\" onClick=\"return mV('1Ch',27,25);\">1Ch 27:25</a>).";
eastonArray["$$T0003715"] = "<strong>Treasure houses:</strong> the houses or magazines built for the safe keeping of treasure and valuable articles of any kind (<a href=\"#\" onClick=\"return mV('Ezr',5,17);\">Ezr 5:17</a>; <a href=\"#\" onClick=\"return mV('Ezr',7,20);\">7:20</a>; <a href=\"#\" onClick=\"return mV('Neh',10,38);\">Neh 10:38</a>; <a href=\"#\" onClick=\"return mV('Dan',1,2);\">Dan 1:2</a>).";
eastonArray["$$T0003716"] = "<strong>Treasury:</strong> (<a href=\"#\" onClick=\"return mV('Mat',27,6);\">Mat 27:6</a>; <a href=\"#\" onClick=\"return mV('Mar',12,41);\">Mar 12:41</a>; <a href=\"#\" onClick=\"return mV('Jhn',8,20);\">Jhn 8:20</a>). It does not appear that there was a separate building so called. The name was given to the thirteen brazen chests, called \"trumpets,\" from the form of the opening into which the offerings of the temple worshippers were put. These stood in the outer \"court of the women.\" \"Nine chests were for the appointed money-tribute and for the sacrifice-tribute, i.e., money-gifts instead of the sacrifices; four chests for freewill-offerings for wood, incense, temple decoration, and burnt-offerings\" (Lightfoot's Hor. Heb.).";
eastonArray["$$T0003717"] = "<strong>Tree of life:</strong> stood also in the midst of the garden of Eden (<a href=\"#\" onClick=\"return mV('Gen',2,9);\">Gen 2:9</a>; <a href=\"#\" onClick=\"return mV('Gen',3,22);\">3:22</a>). Some writers have advanced the opinion that this tree had some secret virtue, which was fitted to preserve life. Probably the lesson conveyed was that life was to be sought by man, not in himself or in his own power, but from without, from Him who is emphatically the Life (<a href=\"#\" onClick=\"return mV('Jhn',1,4);\">Jhn 1:4</a>; <a href=\"#\" onClick=\"return mV('Jhn',14,6);\">14:6</a>). Wisdom is compared to the tree of life (<a href=\"#\" onClick=\"return mV('Pro',3,18);\">Pro 3:18</a>). The \"tree of life\" spoken of in the Book of Revelation (<a href=\"#\" onClick=\"return mV('Rev',2,7);\">Rev 2:7</a>; <a href=\"#\" onClick=\"return mV('Rev',22,2,14);\">22:2, 14</a>) is an emblem of the joys of the celestial paradise.";
eastonArray["$$T0003718"] = "<strong>Tree of the knowledge of good and evil:</strong> stood in the midst of the garden of Eden, beside the tree of life (<a href=\"#\" onClick=\"return mV('Gen',2,'1-');\">Gen 2</a>; <a href=\"#\" onClick=\"return mV('Gen',3,'1-');\">3</a>). Adam and Eve were forbidden to take of the fruit which grew upon it. But they disobeyed the divine injunction, and so sin and death by sin entered our world and became the heritage of Adam's posterity. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000077');\">ADAM</a>.)";
eastonArray["$$T0003719"] = "<strong>Trespass offering:</strong> (Heb. 'asham, \"debt\"), the law concerning, given in <a href=\"#\" onClick=\"return mV('Lev',5,'14-');\">Lev 5:14</a>-<a href=\"#\" onClick=\"return mV('Lev',6,'1-7');\">6:7</a>; also in <a href=\"#\" onClick=\"return mV('Num',5,'5-8');\">Num 5:5-8</a>. The idea of sin as a \"debt\" pervades this legislation. The <i>asham</i>, which was always a ram, was offered in cases where sins were more private. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002770');\">OFFERING</a>.)";
eastonArray["$$T0003720"] = "<strong>Tribe:</strong> a collection of families descending from one ancestor. The \"twelve tribes\" of the Hebrews were the twelve collections of families which sprang from the sons of Jacob. In <a href=\"#\" onClick=\"return mV('Mat',24,30);\">Mat 24:30</a> the word has a wider significance. The tribes of Israel are referred to as types of the spiritual family of God (<a href=\"#\" onClick=\"return doDictLookup ('ET0001909');\">T0001909; JUDAH, KINGDOM OF ISRAEL, KINGDOM OFT0002126</a>.) <a href=\"#\" onClick=\"return mV('Rev',7,'1-')\">Rev 7</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0001909');\">ISRAEL, KINGDOM OF</a>; <a href=\"#\" onClick=\"return doDictLookup ('ET0002126');\">JUDAH, KINGDOM OF</a>.)";
eastonArray["$$T0003721"] = "<strong>Tribulation:</strong> trouble or affiction of any kind (<a href=\"#\" onClick=\"return mV('Deu',4,30);\">Deu 4:30</a>; <a href=\"#\" onClick=\"return mV('Mat',13,21);\">Mat 13:21</a>; <a href=\"#\" onClick=\"return mV('2Cr',7,4);\">2Cr 7:4</a>). In <a href=\"#\" onClick=\"return mV('Rom',2,9);\">Rom 2:9</a> \"tribulation and anguish\" are the penal sufferings that shall overtake the wicked. In <a href=\"#\" onClick=\"return mV('Mat',24,21,29);\">Mat 24:21, 29</a>, the word denotes the calamities that were to attend the destruction of Jerusalem.";
eastonArray["$$T0003722"] = "<strong>Tribute:</strong> a tax imposed by a king on his subjects (<a href=\"#\" onClick=\"return mV('2Sa',20,24);\">2Sa 20:24</a>; <a href=\"#\" onClick=\"return mV('1Ki',4,6);\">1Ki 4:6</a>; <a href=\"#\" onClick=\"return mV('Rom',13,6);\">Rom 13:6</a>). In <a href=\"#\" onClick=\"return mV('Mat',17,'24-27');\">Mat 17:24-27</a> the word denotes the temple rate (the \"didrachma,\" the \"half-shekel,\" as rendered by the R.V.) which was required to be paid for the support of the temple by every Jew above twenty years of age (<a href=\"#\" onClick=\"return mV('Exd',30,12);\">Exd 30:12</a>; <a href=\"#\" onClick=\"return mV('2Ki',12,4);\">2Ki 12:4</a>; <a href=\"#\" onClick=\"return mV('2Ch',24,6,9);\">2Ch 24:6, 9</a>). It was not a civil but a religious tax.<br><br>In <a href=\"#\" onClick=\"return mV('Mat',22,17);\">Mat 22:17</a>; <a href=\"#\" onClick=\"return mV('Mar',12,14);\">Mar 12:14</a>; <a href=\"#\" onClick=\"return mV('Luk',20,22);\">Luk 20:22</a>, the word may be interpreted as denoting the capitation tax which the Romans imposed on the Jewish people. It may, however, be legitimately regarded as denoting any tax whatever imposed by a foreign power on the people of Israel. The \"tribute money\" shown to our Lord (<a href=\"#\" onClick=\"return mV('Mat',22,19);\">Mat 22:19</a>) was the denarius, bearing Caesar's superscription. It was the tax paid by every Jew to the Romans. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002891');\">PENNY</a>.)";
eastonArray["$$T0003723"] = "<strong>Trinity:</strong> a word not found in Scripture, but used to express the doctrine of the unity of God as subsisting in three distinct Persons. This word is derived from the Gr. trias, first used by Theophilus (A.D. 168-183), or from the Lat. trinitas, first used by Tertullian (A.D. 220), to express this doctrine. The propositions involved in the doctrine are these:<br><br>1. That God is one, and that there is but one God (<a href=\"#\" onClick=\"return mV('Deu',6,4);\">Deu 6:4</a>; <a href=\"#\" onClick=\"return mV('1Ki',8,60);\">1Ki 8:60</a>; <a href=\"#\" onClick=\"return mV('Isa',44,6);\">Isa 44:6</a>; <a href=\"#\" onClick=\"return mV('Mar',12,29,32);\">Mar 12:29, 32</a>; <a href=\"#\" onClick=\"return mV('Jhn',10,30);\">Jhn 10:30</a>).<br><br>2. That the Father is a distinct divine Person (hypostasis, subsistentia, persona, suppositum intellectuale), distinct from the Son and the Holy Spirit.<br><br>3. That Jesus Christ was truly God, and yet was a Person distinct from the Father and the Holy Spirit.<br><br>4. That the Holy Spirit is also a distinct divine Person.";
eastonArray["$$T0003724"] = "<strong>Troas:</strong> a city on the coast of Mysia, in the north-west of Asia Minor, named after ancient Troy, which was at some little distance from it (about 4 miles) to the north. Here Paul, on his second missionary journey, saw the vision of a \"man of Macedonia,\" who appeared to him, saying, \"Come over, and help us\" (<a href=\"#\" onClick=\"return mV('Act',16,'8-11');\">Act 16:8-11</a>). He visited this place also on other occasions, and on one of these visits he left his cloak and some books there (<a href=\"#\" onClick=\"return mV('2Cr',2,12);\">2Cr 2:12</a>; <a href=\"#\" onClick=\"return mV('2Ti',4,13);\">2Ti 4:13</a>). The ruins of Troas extend over many miles, the site being now mostly covered with a forest of oak trees. The modern name of the ruins is Eski Stamboul i.e., Old Constantinople.";
eastonArray["$$T0003725"] = "<strong>Trogyllium:</strong> a town on the western coast of Asia Minor, where Paul \"tarried\" when on his way from Assos to Miletus, on his third missionary journey (<a href=\"#\" onClick=\"return mV('Act',20,15);\">Act 20:15</a>).";
eastonArray["$$T0003726"] = "<strong>Trophimus:</strong> a foster-child, an Ephesian who accompanied Paul during a part of his third missionary journey (<a href=\"#\" onClick=\"return mV('Act',20,4);\">Act 20:4</a>; <a href=\"#\" onClick=\"return mV('Act',21,29);\">21:29</a>). He was with Paul in Jerusalem, and the Jews, supposing that the apostle had brought him with him into the temple, raised a tumult which resulted in Paul's imprisonment. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003611');\">TEMPLE, HEROD'S</a>.) In writing to Timothy, the apostle says, \"Trophimus have I left at Miletum sick\" (<a href=\"#\" onClick=\"return mV('2Ti',4,20);\">2Ti 4:20</a>). This must refer to some event not noticed in the Acts.";
eastonArray["$$T0003727"] = "<strong>Trumpets:</strong> were of a great variety of forms, and were made of divers materials. Some were made of silver (<a href=\"#\" onClick=\"return mV('Num',10,2);\">Num 10:2</a>), and were used only by the priests in announcing the approach of festivals and in giving signals of war. Some were also made of rams' horns (<a href=\"#\" onClick=\"return mV('Jos',6,8);\">Jos 6:8</a>). They were blown at special festivals, and to herald the arrival of special seasons (<a href=\"#\" onClick=\"return mV('Lev',23,24);\">Lev 23:24</a>; <a href=\"#\" onClick=\"return mV('Lev',25,9);\">25:9</a>; <a href=\"#\" onClick=\"return mV('1Ch',15,24);\">1Ch 15:24</a>; <a href=\"#\" onClick=\"return mV('2Ch',29,27);\">2Ch 29:27</a>; <a href=\"#\" onClick=\"return mV('Psa',81,3);\">Psa 81:3</a>; <a href=\"#\" onClick=\"return mV('Psa',98,6);\">98:6</a>).<br><br>\"Trumpets\" are among the symbols used in the Book of Revelation (<a href=\"#\" onClick=\"return mV('Rev',1,10);\">Rev 1:10</a>; <a href=\"#\" onClick=\"return mV('Rev',8,2);\">8:2</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0001821');\">HORN</a>.)";
eastonArray["$$T0003728"] = "<strong>Trumpets, Feast of:</strong> was celebrated at the beginning of the month Tisri, the first month of the civil year. It received its name from the circumstances that the trumpets usually blown at the commencement of each month were on that occasion blown with unusual solemnity (<a href=\"#\" onClick=\"return mV('Lev',23,'23-25');\">Lev 23:23-25</a>; <a href=\"#\" onClick=\"return mV('Num',10,10);\">Num 10:10</a>; <a href=\"#\" onClick=\"return mV('Num',29,'1-6');\">29:1-6</a>). It was one of the seven days of holy convocation. The special design of this feast, which is described in these verses, is not known.";
eastonArray["$$T0003729"] = "<strong>Truth:</strong> Used in various senses in Scripture. In <a href=\"#\" onClick=\"return mV('Pro',12,17,19);\">Pro 12:17, 19</a>, it denotes that which is opposed to falsehood. In <a href=\"#\" onClick=\"return mV('Isa',59,14,15);\">Isa 59:14-15</a>; <a href=\"#\" onClick=\"return mV('Jer',7,28);\">Jer 7:28</a>, it means fidelity or truthfulness. The doctrine of Christ is called \"the truth of the gospel\" (<a href=\"#\" onClick=\"return mV('Gal',2,5);\">Gal 2:5</a>), \"the truth\" (<a href=\"#\" onClick=\"return mV('2Ti',3,7);\">2Ti 3:7</a>; <a href=\"#\" onClick=\"return mV('2Ti',4,4);\">4:4</a>). Our Lord says of himself, \"I am the way, and the truth\" (<a href=\"#\" onClick=\"return mV('Jhn',14,6);\">Jhn 14:6</a>).";
eastonArray["$$T0003730"] = "<strong>Tryphena and Tryphosa:</strong> two female Christians, active workers, whom Paul salutes in his epistle to the Romans (<a href=\"#\" onClick=\"return mV('Rom',16,12);\">Rom 16:12</a>).";
eastonArray["$$T0003731"] = "<strong>Tubal:</strong><br><br>(1.) The fifth son of Japheth (<a href=\"#\" onClick=\"return mV('Gen',10,2);\">Gen 10:2</a>).<br><br>(2.) A nation, probably descended from the son of Japheth. It is mentioned by Isaiah (<a href=\"#\" onClick=\"return mV('Isa',66,19);\">Isa 66:19</a>), along with Javan, and by Ezekiel (<a href=\"#\" onClick=\"return mV('Eze',27,13);\">Eze 27:13</a>), along with Meshech, among the traders with Tyre, also among the confederates of Gog (<a href=\"#\" onClick=\"return mV('Eze',38,2,3);\">Eze 38:2-3</a>; <a href=\"#\" onClick=\"return mV('Eze',39,1);\">39:1</a>), and with Meshech among the nations which were to be destroyed (<a href=\"#\" onClick=\"return mV('Eze',32,26);\">32:26</a>). This nation was probably the Tiberini of the Greek historian Herodotus, a people of the Asiatic highland west of the Upper Euphrates, the southern range of the Caucasus, on the east of the Black Sea.";
eastonArray["$$T0003732"] = "<strong>Tubal-cain:</strong> the son of Lamech and Zillah, \"an instructor of every artificer in brass and iron\" (<a href=\"#\" onClick=\"return mV('Gen',4,22);\">Gen 4:22</a>; R.V., \"the forger of every cutting instrument of brass and iron\").";
eastonArray["$$T0003733"] = "<strong>Turtle, Turtle-dove:</strong> Its peculiar peaceful and gentle habit its often referred to in Scripture. A pair was offered in sacrifice by Mary at her purification (<a href=\"#\" onClick=\"return mV('Luk',2,24);\">Luk 2:24</a>). The pigeon and the turtle-dove were the only birds permitted to be offered in sacrifice (<a href=\"#\" onClick=\"return mV('Lev',1,14);\">Lev 1:14</a>; <a href=\"#\" onClick=\"return mV('Lev',5,7);\">5:7</a>; <a href=\"#\" onClick=\"return mV('Lev',14,22);\">14:22</a>; <a href=\"#\" onClick=\"return mV('Lev',15,14,29);\">15:14, 29</a>, etc.). The Latin name of this bird, <i>turtur</i>, is derived from its note, and is a repetition of the Hebrew name <i>tor</i>. Three species are found in Palestine,<br><br>(1) the turtle-dove (<i>Turtur auritus</i>),<br><br>(2) the collared turtle (<i>T. risorius</i>), and<br><br>(3) the palm turtle (<i>T. Senegalensis</i>). But it is to the first of these species which the various passages of Scripture refer. It is a migratory bird (<a href=\"#\" onClick=\"return mV('Jer',8,7);\">Jer 8:7</a>; <a href=\"#\" onClick=\"return mV('Sgs',2,11,12);\">Sgs 2:11-12</a>). \"Search the glades and valleys, even by sultry Jordan, at the end of March, and not a turtle-dove is to be seen. Return in the second week of April, and clouds of doves are feeding on the clovers of the plain. They overspread the whole face of the land.\" \"Immediately on its arrival it pours forth from every garden, grove, and wooded hill its melancholy yet soothing ditty unceasingly from early dawn till sunset. It is from its plaintive and continuous note, doubtless, that David, pouring forth his heart's sorrow to God, compares himself to a turtle-dove\" (<a href=\"#\" onClick=\"return mV('Psa',74,19);\">Psa 74:19</a>).";
eastonArray["$$T0003734"] = "<strong>Tychicus:</strong> chance, an Asiatic Christian, a \"faithful minister in the Lord\" (<a href=\"#\" onClick=\"return mV('Eph',6,21,22);\">Eph 6:21-22</a>), who, with Trophimus, accompanied Paul on a part of his journey from Macedonia to Jerusalem (<a href=\"#\" onClick=\"return mV('Act',20,4);\">Act 20:4</a>). He is alluded to also in <a href=\"#\" onClick=\"return mV('Col',4,7);\">Col 4:7</a>; <a href=\"#\" onClick=\"return mV('Tts',3,12);\">Tts 3:12</a>, and <a href=\"#\" onClick=\"return mV('2Ti',4,12);\">2Ti 4:12</a> as having been with Paul at Rome, whence he sent him to Ephesus, probably for the purpose of building up and encouraging the church there.";
eastonArray["$$T0003735"] = "<strong>Type:</strong> occurs only once in Scripture (<a href=\"#\" onClick=\"return mV('1Cr',10,11);\">1Cr 10:11</a>, A.V. marg.). The Greek word <i>tupos</i> is rendered \"print\" (<a href=\"#\" onClick=\"return mV('Jhn',20,25);\">Jhn 20:25</a>), \"figure\" (<a href=\"#\" onClick=\"return mV('Act',7,43);\">Act 7:43</a>; <a href=\"#\" onClick=\"return mV('Rom',5,14);\">Rom 5:14</a>), \"fashion\" (<a href=\"#\" onClick=\"return mV('Act',7,44);\">Act 7:44</a>), \"manner\" (<a href=\"#\" onClick=\"return mV('Act',23,25);\">Act 23:25</a>), \"form\" (<a href=\"#\" onClick=\"return mV('Rom',6,17);\">Rom 6:17</a>), \"example\" or \"ensample\" (<a href=\"#\" onClick=\"return mV('1Cr',10,6,11);\">1Cr 10:6, 11</a>; <a href=\"#\" onClick=\"return mV('Phl',3,17);\">Phl 3:17</a>; <a href=\"#\" onClick=\"return mV('1Th',1,7);\">1Th 1:7</a>; <a href=\"#\" onClick=\"return mV('2Th',3,9);\">2Th 3:9</a>; <a href=\"#\" onClick=\"return mV('1Ti',4,12);\">1Ti 4:12</a>). It properly means a \"model\" or \"pattern\" or \"mould\" into which clay or wax was pressed, that it might take the figure or exact shape of the mould. The word \"type\" is generally used to denote a resemblance between something present and something future, which is called the \"antitype.\"";
eastonArray["$$T0003736"] = "<strong>Tyrannus:</strong> prince, a Greek rhetorician, in whose \"school\" at Ephesus Paul disputed daily for the space of two years with those who came to him (<a href=\"#\" onClick=\"return mV('Act',19,9);\">Act 19:9</a>). Some have supposed that he was a Jew, and that his \"school\" was a private synagogue.";
eastonArray["$$T0003737"] = "<strong>Tyre:</strong> a rock, now es-Sur; an ancient Phoenician city, about 23 miles, in a direct line, north of Acre, and 20 south of Sidon. Sidon was the oldest Phoenician city, but Tyre had a longer and more illustrious history. The commerce of the whole world was gathered into the warehouses of Tyre. \"Tyrian merchants were the first who ventured to navigate the Mediterranean waters; and they founded their colonies on the coasts and neighbouring islands of the AEgean Sea, in Greece, on the northern coast of Africa, at Carthage and other places, in Sicily and Corsica, in Spain at Tartessus, and even beyond the pillars of Hercules at Gadeira (Cadiz)\" (Driver's Isaiah). In the time of David a friendly alliance was entered into between the Hebrews and the Tyrians, who were long ruled over by their native kings (<a href=\"#\" onClick=\"return mV('2Sa',5,11);\">2Sa 5:11</a>; <a href=\"#\" onClick=\"return mV('1Ki',5,1);\">1Ki 5:1</a>; <a href=\"#\" onClick=\"return mV('2Ch',2,3);\">2Ch 2:3</a>).<br><br>Tyre consisted of two distinct parts, a rocky fortress on the mainland, called \"Old Tyre,\" and the city, built on a small, rocky island about half-a-mile distant from the shore. It was a place of great strength. It was besieged by Shalmaneser, who was assisted by the Phoenicians of the mainland, for five years, and by Nebuchadnezzar (B.C. 586-573) for thirteen years, apparently without success. It afterwards fell under the power of Alexander the Great, after a siege of seven months, but continued to maintain much of its commercial importance till the Christian era. It is referred to in <a href=\"#\" onClick=\"return mV('Mat',11,21);\">Mat 11:21</a> and <a href=\"#\" onClick=\"return mV('Act',12,20);\">Act 12:20</a>. In A.D. 1291 it was taken by the Saracens, and has remained a desolate ruin ever since.<br><br>\"The purple dye of Tyre had a worldwide celebrity on account of the durability of its beautiful tints, and its manufacture proved a source of abundant wealth to the inhabitants of that city.\"<br><br>Both Tyre and Sidon \"were crowded with glass-shops, dyeing and weaving establishments; and among their cunning workmen not the least important class were those who were celebrated for the engraving of precious stones.\" (<a href=\"#\" onClick=\"return mV('2Ch',2,7,14);\">2Ch 2:7, 14</a>).<br><br>The wickedness and idolatry of this city are frequently denounced by the prophets, and its final destruction predicted (<a href=\"#\" onClick=\"return mV('Isa',23,1);\">Isa 23:1</a>; <a href=\"#\" onClick=\"return mV('Jer',25,22);\">Jer 25:22</a>; <a href=\"#\" onClick=\"return mV('Eze',26,'1-')\">Eze 26</a>; <a href=\"#\" onClick=\"return mV('Eze',28,'1-19');\">28:1-19</a>; <a href=\"#\" onClick=\"return mV('Amo',1,9,10);\">Amo 1:9-10</a>; <a href=\"#\" onClick=\"return mV('Zec',9,'2-4');\">Zec 9:2-4</a>).<br><br>Here a church was founded soon after the death of Stephen, and Paul, on his return from his third missionary journey spent a week in intercourse with the disciples there (<a href=\"#\" onClick=\"return mV('Act',21,4);\">Act 21:4</a>). Here the scene at Miletus was repeated on his leaving them. They all, with their wives and children, accompanied him to the sea-shore. The sea-voyage of the apostle terminated at Ptolemais, about 38 miles from Tyre. Thence he proceeded to Caesarea (<a href=\"#\" onClick=\"return mV('Act',21,'5-8');\">Act 21:5-8</a>).<br><br>\"It is noticed on monuments as early as B.C. 1500, and claiming, according to Herodotus, to have been founded about B.C. 2700. It had two ports still existing, and was of commercial importance in all ages, with colonies at Carthage (about B.C. 850) and all over the Mediterranean. It was often attacked by Egypt and Assyria, and taken by Alexander the Great after a terrible siege in B.C. 332. It is now a town of 3,000 inhabitants, with ancient tombs and a ruined cathedral. A short Phoenician text of the fourth century B.C. is the only monument yet recovered.\"";
eastonArray["$$T0003738"] = "<strong>Tyropoeon Valley:</strong> (i.e., \"Valley of the Cheesemongers\"), the name given by Josephus the historian to the valley or rugged ravine which in ancient times separated Mount Moriah from Mount Zion. This valley, now filled up with a vast accumulation of rubbish, and almost a plain, was spanned by bridges, the most noted of which was Zion Bridge, which was probably the ordinary means of communication between the royal palace on Zion and the temple. A fragment of the arch (q.v.) of this bridge (called \"Robinson's Arch\"), where it projects from the sanctuary wall, was discovered by Robinson in 1839. This arch was destroyed by the Romans when Jerusalem was taken.<br><br>The western wall of the temple area rose up from the bottom of this valley to the height of 84 feet, where it was on a level with the area, and above this, and as a continuance of it, the wall of Solomon's cloister rose to the height of about 50 feet, \"so that this section of the wall would originally present to view a stupendous mass of masonry scarcely to be surpassed by any mural masonry in the world.\"";
eastonArray["$$T0003739"] = "<strong>Ucal:</strong> the name of a person to whom Agur's words are addressed (<a href=\"#\" onClick=\"return mV('Pro',30,1);\">Pro 30:1</a>).";
eastonArray["$$T0003740"] = "<strong>Ulai:</strong> the Eulaus of the Greeks; a river of Susiana. It was probably the eastern branch of the Choasper (Kerkhan), which divided into two branches some 20 miles above the city of Susa. Hence Daniel (<a href=\"#\" onClick=\"return mV('Dan',8,2,16);\">Dan 8:2, 16</a>) speaks of standing \"between the banks of Ulai\", i.e., between the two streams of the divided river.";
eastonArray["$$T0003741"] = "<strong>Ummah:</strong> vicinity, a town of Asher (<a href=\"#\" onClick=\"return mV('Jos',19,30);\">Jos 19:30</a>).";
eastonArray["$$T0003742"] = "<strong>Unction:</strong> (<a href=\"#\" onClick=\"return mV('1Jo',2,20,27);\">1Jo 2:20, 27</a>; R.V., \"anointing\"). Kings, prophets, and priests were anointed, in token of receiving divine grace. All believers are, in a secondary sense, what Christ was in a primary sense, \"the Lord's anointed.\"";
eastonArray["$$T0003743"] = "<strong>Unicorn:</strong> described as an animal of great ferocity and strength (<a href=\"#\" onClick=\"return mV('Num',23,22);\">Num 23:22</a>, R.V., \"wild ox,\" marg., \"ox-antelope; <a href=\"#\" onClick=\"return mV('Num',24,8);\">24:8</a>; <a href=\"#\" onClick=\"return mV('Isa',34,7);\">Isa 34:7</a>, R.V., \"wild oxen\"), and untamable (<a href=\"#\" onClick=\"return mV('Job',39,9);\">Job 39:9</a>). It was in reality a two-horned animal; but the exact reference of the word so rendered (reem) is doubtful. Some have supposed it to be the buffalo; others, the white antelope, called by the Arabs rim. Most probably, however, the word denotes the <i>Bos primigenius</i> (\"primitive ox\"), which is now extinct all over the world. This was the auerochs of the Germans, and the urus described by Caesar (Gal. Bel., vi.28) as inhabiting the Hercynian forest. The word thus rendered has been found in an Assyrian inscription written over the wild ox or bison, which some also suppose to be the animal intended (<a href=\"#\" onClick=\"return mV('Deu',33,17);\">Deu 33:17</a>; <a href=\"#\" onClick=\"return mV('Psa',22,21);\">Psa 22:21</a>; <a href=\"#\" onClick=\"return mV('Psa',29,6);\">29:6</a>; <a href=\"#\" onClick=\"return mV('Psa',92,10);\">92:10</a>).";
eastonArray["$$T0003744"] = "<strong>Unni:</strong> afficted.<br><br>(1.) A Levite whom David appointed to take part in bringing the ark up to Jerusalem from the house of Obed-edom by playing the psaltery on that occasion (<a href=\"#\" onClick=\"return mV('1Ch',15,18,20);\">1Ch 15:18, 20</a>).<br><br>(2.) A Levite who returned with Zerubbabel from the Captivity (<a href=\"#\" onClick=\"return mV('Neh',12,9);\">Neh 12:9</a>).";
eastonArray["$$T0003745"] = "<strong>Upharsin:</strong> and they divide, one of the words written by the mysterious hand on the wall of Belshazzar's palace (<a href=\"#\" onClick=\"return mV('Dan',5,25);\">Dan 5:25</a>). It is a pure Chaldean word. \"Peres\" is only a simple form of the same word.";
eastonArray["$$T0003746"] = "<strong>Uphaz:</strong> probably another name for Ophir (<a href=\"#\" onClick=\"return mV('Jer',10,9);\">Jer 10:9</a>). Some, however, regard it as the name of an Indian colony in Yemen, southern Arabia; others as a place on or near the river Hyphasis (now the Ghana), the south-eastern limit of the Punjaub.";
eastonArray["$$T0003747"] = "<strong>Ur:</strong> light, or the moon city, a city \"of the Chaldees,\" the birthplace of Haran (<a href=\"#\" onClick=\"return mV('Gen',11,28,31);\">Gen 11:28, 31</a>), the largest city of Shinar or northern Chaldea, and the principal commercial centre of the country as well as the centre of political power. It stood near the mouth of the Euphrates, on its western bank, and is represented by the mounds (of bricks cemented by bitumen) of el-Mugheir, i.e., \"the bitumined,\" or \"the town of bitumen,\" now 150 miles from the sea and some 6 miles from the Euphrates, a little above the point where it receives the Shat el-Hie, an affluent from the Tigris. It was formerly a maritime city, as the waters of the Persian Gulf reached thus far inland. Ur was the port of Babylonia, whence trade was carried on with the dwellers on the gulf, and with the distant countries of India, Ethiopia, and Egypt. It was abandoned about B.C. 500, but long continued, like Erech, to be a great sacred cemetery city, as is evident from the number of tombs found there. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000054');\">ABRAHAM</a>.)<br><br>The oldest king of Ur known to us is Ur-Ba'u (servant of the goddess Ba'u), as Hommel reads the name, or Ur-Gur, as others read it. He lived some twenty-eight hundred years B.C., and took part in building the famous temple of the moon-god Sin in Ur itself. The illustration here given represents his cuneiform inscription, written in the Sumerian language, and stamped upon every brick of the temple in Ur. It reads: \"Ur-Ba'u, king of Ur, who built the temple of the moon-god.\"<br><br>\"Ur was consecrated to the worship of Sin, the Babylonian moon-god. It shared this honour, however, with another city, and this city was Haran, or Harran. Harran was in Mesopotamia, and took its name from the highroad which led through it from the east to the west. The name is Babylonian, and bears witness to its having been founded by a Babylonian king. The same witness is still more decisively borne by the worship paid in it to the Babylonian moon-god and by its ancient temple of Sin. Indeed, the temple of the moon-god at Harran was perhaps even more famous in the Assyrian and Babylonian world than the temple of the moon-god at Ur.<br><br>\"Between Ur and Harran there must, consequently, have been a close connection in early times, the record of which has not yet been recovered. It may be that Harran owed its foundation to a king of Ur; at any rate the two cities were bound together by the worship of the same deity, the closest and most enduring bond of union that existed in the ancient world. That Terah should have migrated from Ur to Harran, therefore, ceases to be extraordinary. If he left Ur at all, it was the most natural place to which to go. It was like passing from one court of a temple into another.<br><br>\"Such a remarkable coincidence between the Biblical narrative and the evidence of archaeological research cannot be the result of chance. The narrative must be historical; no writer of late date, even if he were a Babylonian, could have invented a story so exactly in accordance with what we now know to have been the truth. For a story of the kind to have been the invention of Palestinian tradition is equally impossible. To the unprejudiced mind there is no escape from the conclusion that the history of the migration of Terah from Ur to Harran is founded on fact\" (Sayce).";
eastonArray["$$T0003748"] = "<strong>Uriah:</strong> the Lord is my light.<br><br>(1.) A Hittite, the husband of Bathsheba, whom David first seduced, and then after Uriah's death married. He was one of the band of David's \"mighty men.\" The sad story of the curel wrongs inflicted upon him by David and of his mournful death are simply told in the sacred record (<a href=\"#\" onClick=\"return mV('2Sa',11,'2-');\">2Sa 11:2</a>-<a href=\"#\" onClick=\"return mV('2Sa',12,'1-26');\">12:26</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000474');\">BATHSHEBA</a>; <a href=\"#\" onClick=\"return doDictLookup ('ET0000982');\">DAVID</a>.)<br><br>(2.) A priest of the house of Ahaz (<a href=\"#\" onClick=\"return mV('Isa',8,2);\">Isa 8:2</a>).<br><br>(3.) The father of Meremoth, mentioned in <a href=\"#\" onClick=\"return mV('Ezr',8,33);\">Ezr 8:33</a>.";
eastonArray["$$T0003749"] = "<strong>Uriel:</strong> God is my light.<br><br>(1.) A Levite of the family of Kohath (<a href=\"#\" onClick=\"return mV('1Ch',6,24);\">1Ch 6:24</a>).<br><br>(2.) The chief of the Kohathites at the time when the ark was brought up to Jerusalem (<a href=\"#\" onClick=\"return mV('1Ch',15,5,11);\">1Ch 15:5, 11</a>).<br><br>(3.) The father of Michaiah, one of Rehoboam's wives, and mother of Abijah (<a href=\"#\" onClick=\"return mV('2Ch',13,2);\">2Ch 13:2</a>).";
</script>
