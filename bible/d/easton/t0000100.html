<script>
var eastonArray = new Array ();
eastonArray["$$T0000100"] = "<b>Adoption:</b> the giving to any one the name and place and privileges of a son who is not a son by birth.<br><br>(1.) Natural. Thus Pharaoh's daughter adopted Moses (<a href=\"#\" onClick=\"return mV('Exd',2,10);\">Exd 2:10</a>), and Mordecai Esther (<a href=\"#\" onClick=\"return mV('Est',2,7);\">Est 2:7</a>).<br><br>(2.) National. God adopted Israel (<a href=\"#\" onClick=\"return mV('Exd',4,22);\">Exd 4:22</a>; <a href=\"#\" onClick=\"return mV('Deu',7,6);\">Deu 7:6</a>; <a href=\"#\" onClick=\"return mV('Hsa',11,1);\">Hsa 11:1</a>; <a href=\"#\" onClick=\"return mV('Rom',9,4);\">Rom 9:4</a>).<br><br>(3.) Spiritual. An act of God's grace by which he brings men into the number of his redeemed family, and makes them partakers of all the blessings he has provided for them. Adoption represents the new relations into which the believer is introduced by justification, and the privileges connected therewith, viz., an interest in God's peculiar love (<a href=\"#\" onClick=\"return mV('Jhn',17,23);\">Jhn 17:23</a>; <a href=\"#\" onClick=\"return mV('Rom',5,'5-8');\">Rom 5:5-8</a>, a spiritual nature (<a href=\"#\" onClick=\"return mV('2Pe',1,4);\">2Pe 1:4</a>; <a href=\"#\" onClick=\"return mV('Jhn',1,13);\">Jhn 1:13</a>), the possession of a spirit becoming children of God (<a href=\"#\" onClick=\"return mV('1Pe',1,14);\">1Pe 1:14</a>; <a href=\"#\" onClick=\"return mV('2Jo',4,'1-')\">2Jo 4</a>; <a href=\"#\" onClick=\"return mV('Rom',8,'15-21');\">Rom 8:15-21</a>; <a href=\"#\" onClick=\"return mV('Gal',5,1);\">Gal 5:1</a>; <a href=\"#\" onClick=\"return mV('Hbr',2,15);\">Hbr 2:15</a>), present protection, consolation, supplies (<a href=\"#\" onClick=\"return mV('Luk',12,'27-32');\">Luk 12:27-32</a>; <a href=\"#\" onClick=\"return mV('Jhn',14,18);\">Jhn 14:18</a>; <a href=\"#\" onClick=\"return mV('1Cr',3,'21-23');\">1Cr 3:21-23</a>; <a href=\"#\" onClick=\"return mV('2Cr',1,4);\">2Cr 1:4</a>), fatherly chastisements (<a href=\"#\" onClick=\"return mV('Hbr',12,'5-11');\">Hbr 12:5-11</a>), and a future glorious inheritance (<a href=\"#\" onClick=\"return mV('Rom',8,17,23);\">Rom 8:17, 23</a>; <a href=\"#\" onClick=\"return mV('Jam',2,5);\">Jam 2:5</a>; <a href=\"#\" onClick=\"return mV('Phl',3,21);\">Phl 3:21</a>).";
eastonArray["$$T0000101"] = "<b>Adoram:</b> See <a href=\"#\" onClick=\"return doDictLookup('ET0000098');\">ADONIRAM</a>.";
eastonArray["$$T0000102"] = "<b>Adore:</b> to worship; to express reverence and homage. The forms of adoration among the Jews were putting off the shoes (<a href=\"#\" onClick=\"return mV('Exd',3,5);\">Exd 3:5</a>; <a href=\"#\" onClick=\"return mV('Jos',5,15);\">Jos 5:15</a>), and prostration (<a href=\"#\" onClick=\"return mV('Gen',17,3);\">Gen 17:3</a>; <a href=\"#\" onClick=\"return mV('Psa',95,6);\">Psa 95:6</a>; <a href=\"#\" onClick=\"return mV('Isa',44,15,17,19);\">Isa 44:15, 17, 19</a>; <a href=\"#\" onClick=\"return mV('Isa',46,6);\">46:6</a>). To \"kiss the Son\" in <a href=\"#\" onClick=\"return mV('Psa',2,12);\">Psa 2:12</a> is to adore and worship him. (See <a href=\"#\" onClick=\"return mV('Dan',3,5,6);\">Dan 3:5-6</a>.) The word itself does not occur in Scripture.";
eastonArray["$$T0000103"] = "<b>Adrammelech:</b> Adar the king.<br><br>(1.) An idol; a form of the sun-god worshipped by the inhabitants of Sepharvaim (<a href=\"#\" onClick=\"return mV('2Ki',17,31);\">2Ki 17:31</a>), and brought by the Sepharvite colonists into Samaria.<br><br>(2.) A son of Sennacherib, king of Assyria (<a href=\"#\" onClick=\"return mV('2Ki',19,37);\">2Ki 19:37</a>; <a href=\"#\" onClick=\"return mV('Isa',37,38);\">Isa 37:38</a>).";
eastonArray["$$T0000104"] = "<b>Adramyttium:</b> a city of Asia Minor on the coast of Mysia, which in early times was called AEolis. The ship in which Paul embarked at Caesarea belonged to this city (<a href=\"#\" onClick=\"return mV('Act',27,2);\">Act 27:2</a>). He was conveyed in it only to Myra, in Lycia, whence he sailed in an Alexandrian ship to Italy. It was a rare thing for a ship to sail from any port of Palestine direct for Italy. It still bears the name Adramyti, and is a place of some traffic.";
eastonArray["$$T0000105"] = "<b>Adria:</b> (<a href=\"#\" onClick=\"return mV('Act',27,27);\">Act 27:27</a>; R.V., \"the sea of Adria\"), the Adriatic Sea, including in Paul's time the whole of the Mediterranean lying between Crete and Sicily. It is the modern Gulf of Venice, the <i>Mare Superum</i> of the Romans, as distinguished from the <i>Mare Inferum</i> or Tyrrhenian Sea.";
eastonArray["$$T0000106"] = "<b>Adriel:</b> flock of God, the son of Barzillai, the Meholathite, to whom Saul gave in marriage his daughter Merab (<a href=\"#\" onClick=\"return mV('1Sa',18,19);\">1Sa 18:19</a>). The five sons that sprang from this union were put to death by the Gibeonites (<a href=\"#\" onClick=\"return mV('2Sa',21,8,9);\">2Sa 21:8-9</a>). Here it is said that Michal \"brought up\" [R.V., \"bare\"] these five sons, either that she treated them as if she had been their own mother, or that for \"Michal\" we should read \"Merab,\" as in (<a href=\"#\" onClick=\"return mV('1Sa',18,19);\">1Sa 18:19</a>).";
eastonArray["$$T0000107"] = "<b>Adullam:</b> one of the royal cities of the Canaanites, now 'Aid-el-ma (<a href=\"#\" onClick=\"return mV('Jos',12,15);\">Jos 12:15</a>; <a href=\"#\" onClick=\"return mV('Jos',15,35);\">15:35</a>). It stood on the old Roman road in the valley of Elah (q.v.), which was the scene of David's memorable victory over Goliath (<a href=\"#\" onClick=\"return mV('1Sa',17,2);\">1Sa 17:2</a>), and not far from Gath. It was one of the towns which Rehoboam fortified against Egypt (<a href=\"#\" onClick=\"return mV('2Ch',11,7);\">2Ch 11:7</a>). It was called \"the glory of Israel\" (<a href=\"#\" onClick=\"return mV('Mic',1,15);\">Mic 1:15</a>).<br><br>The Cave of Adullam has been discovered about 2 miles south of the scene of David's triumph, and about 13 miles west from Bethlehem. At this place is a hill some 500 feet high pierced with numerous caverns, in one of which David gathered together \"every one that was in distress, and every one that was in debt, and every one that was discontented\" (<a href=\"#\" onClick=\"return mV('1Sa',22,2);\">1Sa 22:2</a>). Some of these caverns are large enough to hold 200 or 300 men. According to tradition this cave was at Wady Khureitun, between Bethlehem and the Dead Sea, but this view cannot be well maintained.";
eastonArray["$$T0000108"] = "<b>Adullamite:</b> an inhabitant of the city of Adullam (<a href=\"#\" onClick=\"return mV('Gen',38,1,12,20);\">Gen 38:1, 12, 20</a>).";
eastonArray["$$T0000109"] = "<b>Adultery:</b> conjugal infidelity. An adulterer was a man who had illicit intercourse with a married or a betrothed woman, and such a woman was an adulteress. Intercourse between a married man and an unmarried woman was fornication. Adultery was regarded as a great social wrong, as well as a great sin.<br><br>The Mosaic law (<a href=\"#\" onClick=\"return mV('Num',5,'11-31');\">Num 5:11</a>) prescribed that the suspected wife should be tried by the ordeal of the \"water of jealousy.\" There is, however, no recorded instance of the application of this law. In subsequent times the Rabbis made various regulations with the view of discovering the guilty party, and of bringing about a divorce. It has been inferred from <a href=\"#\" onClick=\"return mV('Jhn',8,'1-11');\">John 8:1-11</a> that this sin became very common during the age preceding the destruction of Jerusalem.<br><br>Idolatry, covetousness, and apostasy are spoken of as adultery spiritually (<a href=\"#\" onClick=\"return mV('Jer',3,6,8,9);\">Jer 3:6, 8-9</a>; <a href=\"#\" onClick=\"return mV('Eze',16,32);\">Eze 16:32</a>; <a href=\"#\" onClick=\"return mV('Hsa',1,2);\">Hsa 1:2</a>; <a href=\"#\" onClick=\"return mV('Rev',2,22);\">Rev 2:22</a>). An apostate church is an adulteress (<a href=\"#\" onClick=\"return mV('Isa',1,21);\">Isa 1:21</a>; <a href=\"#\" onClick=\"return mV('Eze',23,4,7,37);\">Eze 23:4, 7, 37</a>), and the Jews are styled \"an adulterous generation\" (<a href=\"#\" onClick=\"return mV('Mat',12,39);\">Mat 12:39</a>). (Comp. <a href=\"#\" onClick=\"return mV('Rev',12,'1-');\">Rev 12</a>.)";
eastonArray["$$T0000110"] = "<b>Adummim:</b> the red ones, a place apparently on the road between Jericho and Jerusalem, \"on the south side of the torrent\" Wady Kelt, looking toward Gilgal, mentioned <a href=\"#\" onClick=\"return mV('Jos',15,7);\">Jos 15:7</a>; <a href=\"#\" onClick=\"return mV('Jos',18,17);\">18:17</a>. It was nearly half-way between Jerusalem and Jericho, and now bears the name of Tal-at-ed-Dumm. It is supposed to have been the place referred to in the parable of the Good Samaritan (<a href=\"#\" onClick=\"return mV('Luk',10,'30-37');\">Luk 10:30-37</a>). Recently a new carriage-road has been completed, and carriages for the first time have come along this road from Jerusalem.";
eastonArray["$$T0000111"] = "<b>Adversary:</b> (Heb. satan), an opponent or foe (<a href=\"#\" onClick=\"return mV('1Ki',5,4);\">1Ki 5:4</a>; <a href=\"#\" onClick=\"return mV('1Ki',11,14,23,25);\">11:14, 23, 25</a>; <a href=\"#\" onClick=\"return mV('Luk',13,17);\">Luk 13:17</a>); one that speaks against another, a complainant (<a href=\"#\" onClick=\"return mV('Mat',5,25);\">Mat 5:25</a>; <a href=\"#\" onClick=\"return mV('Luk',12,58);\">Luk 12:58</a>); an enemy (<a href=\"#\" onClick=\"return mV('Luk',18,3);\">Luk 18:3</a>), and specially the devil (<a href=\"#\" onClick=\"return mV('1Pe',5,8);\">1Pe 5:8</a>).";
eastonArray["$$T0000112"] = "<b>Advocate:</b> (Gr. <i>parakletos</i>), one who pleads another's cause, who helps another by defending or comforting him. It is a name given by Christ three times to the Holy Ghost (<a href=\"#\" onClick=\"return mV('Jhn',14,16);\">Jhn 14:16</a>; <a href=\"#\" onClick=\"return mV('Jhn',15,26);\">15:26</a>; <a href=\"#\" onClick=\"return mV('Jhn',16,7);\">16:7</a>, where the Greek word is rendered \"Comforter,\" q.v.). It is applied to Christ in <a href=\"#\" onClick=\"return mV('1Jo',2,1);\">1Jo 2:1</a>, where the same Greek word is rendered \"Advocate,\" the rendering which it should have in all the places where it occurs. Tertullus \"the orator\" (<a href=\"#\" onClick=\"return mV('Act',24,1);\">Act 24:1</a>) was a Roman advocate whom the Jews employed to accuse Paul before Felix.";
eastonArray["$$T0000113"] = "<b>AEnon:</b> springs, a place near Salim where John baptized (<a href=\"#\" onClick=\"return mV('Jhn',3,23);\">Jhn 3:23</a>). It was probably near the upper source of the Wady Far'ah, an open valley extending from Mount Ebal to the Jordan. It is full of springs. A place has been found called 'Ainun, four miles north of the springs.";
eastonArray["$$T0000114"] = "<b>Affection:</b> feeling or emotion. Mention is made of \"vile affections\" (<a href=\"#\" onClick=\"return mV('Rom',1,26);\">Rom 1:26</a>) and \"inordinate affection\" (<a href=\"#\" onClick=\"return mV('Col',3,5);\">Col 3:5</a>). Christians are exhorted to set their affections on things above (<a href=\"#\" onClick=\"return mV('Col',3,2);\">Col 3:2</a>). There is a distinction between natural and spiritual or gracious affections (<a href=\"#\" onClick=\"return mV('Eze',33,32);\">Eze 33:32</a>).";
eastonArray["$$T0000115"] = "<b>Affinity:</b> relationship by alliance (<a href=\"#\" onClick=\"return mV('2Ch',18,1);\">2Ch 18:1</a>) or by marriage (<a href=\"#\" onClick=\"return mV('1Ki',3,1);\">1Ki 3:1</a>). Marriages are prohibited within certain degrees of affinity, enumerated <a href=\"#\" onClick=\"return mV('Lev',18,'6-17');\">Lev 18:6-17</a>. Consanguinity is relationship by blood.";
eastonArray["$$T0000116"] = "<b>Afflictions:</b> common to all (<a href=\"#\" onClick=\"return mV('Job',5,7);\">Job 5:7</a>; <a href=\"#\" onClick=\"return mV('Job',14,1);\">14:1</a>; <a href=\"#\" onClick=\"return mV('Psa',34,19);\">Psa 34:19</a>); are for the good of men (<a href=\"#\" onClick=\"return mV('Jam',1,2,3,12);\">Jam 1:2-3, 12</a>; <a href=\"#\" onClick=\"return mV('2Cr',12,7);\">2Cr 12:7</a>) and the glory of God (<a href=\"#\" onClick=\"return mV('2Cr',12,'7-10');\">2Cr 12:7-10</a>; <a href=\"#\" onClick=\"return mV('1Pe',4,14);\">1Pe 4:14</a>), and are to be borne with patience by the Lord's people (<a href=\"#\" onClick=\"return mV('Psa',94,12);\">Psa 94:12</a>; <a href=\"#\" onClick=\"return mV('Pro',3,12);\">Pro 3:12</a>). They are all directed by God (<a href=\"#\" onClick=\"return mV('Lam',3,33);\">Lam 3:33</a>), and will result in the everlasting good of his people (<a href=\"#\" onClick=\"return mV('2Cr',4,'16-18');\">2Cr 4:16-18</a>) in Christ Jesus (<a href=\"#\" onClick=\"return mV('Rom',8,'35-39');\">Rom 8:35-39</a>).";
eastonArray["$$T0000117"] = "<b>Agabus:</b> a \"prophet,\" probably one of the seventy disciples of Christ. He prophesied at Antioch of an approaching famine (<a href=\"#\" onClick=\"return mV('Act',11,27,28);\">Act 11:27-28</a>). Many years afterwards he met Paul at Caesarea, and warned him of the bonds and affliction that awaited him at Jerusalem should he persist in going thither (<a href=\"#\" onClick=\"return mV('Act',21,'10-12');\">Act 21:10-12</a>).";
eastonArray["$$T0000118"] = "<b>Agag:</b> flame, the usual title of the Amalekite kings, as \"Pharaoh\" was of the Egyptian.<br><br>(1.) A king of the Amalekites referred to by Balaam (<a href=\"#\" onClick=\"return mV('Num',24,7);\">Num 24:7</a>). He lived at the time of the Exodus.<br><br>(2.) Another king of the Amalekites whom Saul spared unlawfully, but whom Samuel on his arrival in the camp of Saul ordered, in retributive justice (<a href=\"#\" onClick=\"return mV('Jdg',1,'1-')\">Jdg 1</a>), to be brought out and cut in pieces (<a href=\"#\" onClick=\"return mV('1Sa',15,'8-33');\">1Sa 15:8-33</a>. Comp. <a href=\"#\" onClick=\"return mV('Exd',17,11);\">Exd 17:11</a>; <a href=\"#\" onClick=\"return mV('Num',14,45);\">Num 14:45</a>).";
eastonArray["$$T0000119"] = "<b>Agagite:</b> a name applied to Haman and also to his father (<a href=\"#\" onClick=\"return mV('Est',3,1,10);\">Est 3:1, 10</a>; <a href=\"#\" onClick=\"return mV('Est',8,3,5);\">8:3, 5</a>). Probably it was equivalent to Amalekite.";
eastonArray["$$T0000120"] = "<b>Agate:</b> (Heb. <i>shebo</i>), a precious stone in the breast-plate of the high priest (<a href=\"#\" onClick=\"return mV('Exd',28,19);\">Exd 28:19</a>; <a href=\"#\" onClick=\"return mV('Exd',39,12);\">39:12</a>), the second in the third row. This may be the agate properly so called, a semi-transparent crystallized quartz, probably brought from Sheba, whence its name. In <a href=\"#\" onClick=\"return mV('Isa',54,12);\">Isa. 54:12</a> and <a href=\"#\" onClick=\"return mV('Eze',27,16);\">Eze 27:16</a>, this word is the rendering of the Hebrew <i>cadcod</i>, which means \"ruddy,\" and denotes a variety of minutely crystalline silica more or less in bands of different tints.<br><br>This word is from the Greek name of a stone found in the river Achates in Sicily.";
eastonArray["$$T0000121"] = "<b>Age:</b> used to denote the period of a man's life (<a href=\"#\" onClick=\"return mV('Gen',47,28);\">Gen 47:28</a>), the maturity of life (<a href=\"#\" onClick=\"return mV('Jhn',9,21);\">Jhn 9:21</a>), the latter end of life (<a href=\"#\" onClick=\"return mV('Job',11,17);\">Job 11:17</a>), a generation of the human race (<a href=\"#\" onClick=\"return mV('Job',8,8);\">Job 8:8</a>), and an indefinite period (<a href=\"#\" onClick=\"return mV('Eph',2,7);\">Eph 2:7</a>; <a href=\"#\" onClick=\"return mV('Eph',3,5,21);\">3:5, 21</a>; <a href=\"#\" onClick=\"return mV('Col',1,26);\">Col 1:26</a>). Respect to be shown to the aged (<a href=\"#\" onClick=\"return mV('Lev',19,32);\">Lev 19:32</a>). It is a blessing to communities when they have old men among them (<a href=\"#\" onClick=\"return mV('Isa',65,20);\">Isa 65:20</a>; <a href=\"#\" onClick=\"return mV('Zec',8,4);\">Zec 8:4</a>). The aged supposed to excel in understanding (<a href=\"#\" onClick=\"return mV('Job',12,20);\">Job 12:20</a>; <a href=\"#\" onClick=\"return mV('Job',15,10);\">15:10</a>; <a href=\"#\" onClick=\"return mV('Job',32,4,9);\">32:4, 9</a>; <a href=\"#\" onClick=\"return mV('1Ki',12,6,8);\">1Ki 12:6, 8</a>). A full age the reward of piety (<a href=\"#\" onClick=\"return mV('Job',5,26);\">Job 5:26</a>; <a href=\"#\" onClick=\"return mV('Gen',15,15);\">Gen 15:15</a>).";
eastonArray["$$T0000122"] = "<b>Agee:</b> fugitive, the father of Shammah, who was one of David's mighty men (<a href=\"#\" onClick=\"return mV('2Sa',23,11);\">2Sa 23:11</a>)";
eastonArray["$$T0000123"] = "<b>Agony:</b> contest; wrestling; severe struggling with pain and suffering. Anguish is the reflection on evil that is already past, while agony is a struggle with evil at the time present. It is only used in the New Testament by Luke (<a href=\"#\" onClick=\"return mV('Luk',22,44);\">Luk 22:44</a>) to describe our Lord's fearful struggle in Gethsemane.<br><br>The verb from which the noun \"agony\" is derived is used to denote an earnest endeavour or striving, as \"Strive [agonize] to enter\" (<a href=\"#\" onClick=\"return mV('Luk',13,24);\">Luk 13:24</a>); \"Then would my servants fight\" [agonize] (<a href=\"#\" onClick=\"return mV('Jhn',18,36);\">Jhn 18:36</a>). Comp. <a href=\"#\" onClick=\"return mV('1Cr',9,25);\">1Cr 9:25</a>; <a href=\"#\" onClick=\"return mV('Col',1,29);\">Col 1:29</a>; <a href=\"#\" onClick=\"return mV('Col',4,12);\">4:12</a>; <a href=\"#\" onClick=\"return mV('1Ti',6,12);\">1Ti 6:12</a>; <a href=\"#\" onClick=\"return mV('2Ti',4,7);\">2Ti 4:7</a>, where the words \"striveth,\" \"labour,\" \"conflict,\" \"fight,\" are the renderings of the same Greek verb.";
eastonArray["$$T0000124"] = "<b>Agriculture:</b> Tilling the ground (<a href=\"#\" onClick=\"return mV('Gen',2,15);\">Gen 2:15</a>; <a href=\"#\" onClick=\"return mV('Gen',4,2,3,12);\">4:2-3, 12</a>) and rearing cattle were the chief employments in ancient times. The Egyptians excelled in agriculture. And after the Israelites entered into the possession of the Promised Land, their circumstances favoured in the highest degree a remarkable development of this art. Agriculture became indeed the basis of the Mosaic commonwealth.<br><br>The year in Palestine was divided into six agricultural periods:-<br><br>I. SOWING TIME. Tisri, latter half (beginning about the autumnal equinox.) Marchesvan. Kisleu, former half. Early rain due = first showers of autumn.<br><br>II. UNRIPE TIME. Kisleu, latter half. Tebet. Sebat, former half.<br><br>III. COLD SEASON. Sebat, latter half. Adar. [Veadar.] Nisan, former half. Latter rain due (<a href=\"#\" onClick=\"return mV('Deu',11,14);\">Deu 11:14</a>; <a href=\"#\" onClick=\"return mV('Jer',5,24);\">Jer 5:24</a>; <a href=\"#\" onClick=\"return mV('Hsa',6,3);\">Hsa 6:3</a>; <a href=\"#\" onClick=\"return mV('Zec',10,1);\">Zec 10:1</a>; <a href=\"#\" onClick=\"return mV('Jam',5,7);\">Jam 5:7</a>; <a href=\"#\" onClick=\"return mV('Job',29,23);\">Job 29:23</a>).<br><br>IV. HARVEST TIME. Nisan, latter half. (Beginning about vernal equinox. Barley green. Passover.) Ijar. Sivan, former half., Wheat ripe. Pentecost.<br><br>V. SUMMER (total absence of rain) Sivan, latter half. Tammuz. Ab, former half.<br><br>VI. SULTRY SEASON Ab, latter half. Elul. Tisri, former half., Ingathering of fruits.<br><br>The six months from the middle of Tisri to the middle of Nisan were occupied with the work of cultivation, and the rest of the year mainly with the gathering in of the fruits. The extensive and easily-arranged system of irrigation from the rills and streams from the mountains made the soil in every part of Palestine richly productive (<a href=\"#\" onClick=\"return mV('Psa',1,3);\">Psa 1:3</a>; <a href=\"#\" onClick=\"return mV('Psa',65,10);\">65:10</a>; <a href=\"#\" onClick=\"return mV('Pro',21,1);\">Pro 21:1</a>; <a href=\"#\" onClick=\"return mV('Isa',30,25);\">Isa 30:25</a>; <a href=\"#\" onClick=\"return mV('Isa',32,2,20);\">32:2, 20</a>; <a href=\"#\" onClick=\"return mV('Hsa',12,11);\">Hsa 12:11</a>), and the appliances of careful cultivation and of manure increased its fertility to such an extent that in the days of Solomon, when there was an abundant population, \"20,000 measures of wheat year by year\" were sent to Hiram in exchange for timber (<a href=\"#\" onClick=\"return mV('1Ki',5,11);\">1Ki 5:11</a>), and in large quantities also wheat was sent to the Tyrians for the merchandise in which they traded (<a href=\"#\" onClick=\"return mV('Eze',27,17);\">Eze 27:17</a>). The wheat sometimes produced an hundredfold (<a href=\"#\" onClick=\"return mV('Gen',26,12);\">Gen 26:12</a>; <a href=\"#\" onClick=\"return mV('Mat',13,23);\">Mat 13:23</a>). Figs and pomegranates were very plentiful (<a href=\"#\" onClick=\"return mV('Num',13,23);\">Num 13:23</a>), and the vine and the olive grew luxuriantly and produced abundant fruit (<a href=\"#\" onClick=\"return mV('Deu',33,24);\">Deu 33:24</a>).<br><br>Lest the productiveness of the soil should be exhausted, it was enjoined that the whole land should rest every seventh year, when all agricultural labour would entirely cease (<a href=\"#\" onClick=\"return mV('Lev',25,'1-7');\">Lev 25:1-7</a>; <a href=\"#\" onClick=\"return mV('Deu',15,'1-10');\">Deu 15:1-10</a>).<br><br>It was forbidden to sow a field with divers seeds (<a href=\"#\" onClick=\"return mV('Deu',22,9);\">Deu 22:9</a>). A passer-by was at liberty to eat any quantity of corn or grapes, but he was not permitted to carry away any (<a href=\"#\" onClick=\"return mV('Deu',23,24,25);\">Deu 23:24-25</a>; <a href=\"#\" onClick=\"return mV('Mat',12,1);\">Mat 12:1</a>). The poor were permitted to claim the corners of the fields and the gleanings. A forgotten sheaf in the field was to be left also for the poor. (See <a href=\"#\" onClick=\"return mV('Lev',19,9,10);\">Lev 19:9-10</a>; <a href=\"#\" onClick=\"return mV('Deu',24,19);\">Deu 24:19</a>.)<br><br>Agricultural implements and operations.<br><br>The sculptured monuments and painted tombs of Egypt and Assyria throw much light on this subject, and on the general operations of agriculture. Ploughs of a simple construction were known in the time of Moses (<a href=\"#\" onClick=\"return mV('Deu',22,10);\">Deu 22:10</a>; <a href=\"#\" onClick=\"return mV('Job',1,14);\">Job 1:14</a>). They were very light, and required great attention to keep them in the ground (<a href=\"#\" onClick=\"return mV('Luk',9,62);\">Luk 9:62</a>). They were drawn by oxen (<a href=\"#\" onClick=\"return mV('Job',1,14);\">Job 1:14</a>), cows (<a href=\"#\" onClick=\"return mV('1Sa',6,7);\">1Sa 6:7</a>), and asses (<a href=\"#\" onClick=\"return mV('Isa',30,24);\">Isa 30:24</a>); but an ox and an ass must not be yoked together in the same plough (<a href=\"#\" onClick=\"return mV('Deu',22,10);\">Deu 22:10</a>). Men sometimes followed the plough with a hoe to break the clods (<a href=\"#\" onClick=\"return mV('Isa',28,24);\">Isa 28:24</a>). The oxen were urged on by a \"goad,\" or long staff pointed at the end, so that if occasion arose it could be used as a spear also (<a href=\"#\" onClick=\"return mV('Jdg',3,31);\">Jdg 3:31</a>; <a href=\"#\" onClick=\"return mV('1Sa',13,21);\">1Sa 13:21</a>).<br><br>When the soil was prepared, the seed was sown broadcast over the field (<a href=\"#\" onClick=\"return mV('Mat',13,'3-8');\">Mat 13:3-8</a>). The \"harrow\" mentioned in <a href=\"#\" onClick=\"return mV('Job',39,10);\">Job 39:10</a> was not used to cover the seeds, but to break the clods, being little more than a thick block of wood. In highly irrigated spots the seed was trampled in by cattle (<a href=\"#\" onClick=\"return mV('Isa',32,20);\">Isa 32:20</a>); but doubtless there was some kind of harrow also for covering in the seed scattered in the furrows of the field.<br><br>The reaping of the corn was performed either by pulling it up by the roots, or cutting it with a species of sickle, according to circumstances. The corn when cut was generally put up in sheaves (<a href=\"#\" onClick=\"return mV('Gen',37,7);\">Gen 37:7</a>; <a href=\"#\" onClick=\"return mV('Lev',23,'10-15');\">Lev 23:10-15</a>; <a href=\"#\" onClick=\"return mV('Rth',2,7,15);\">Rth 2:7, 15</a>; <a href=\"#\" onClick=\"return mV('Job',24,10);\">Job 24:10</a>; <a href=\"#\" onClick=\"return mV('Jer',9,22);\">Jer 9:22</a>; <a href=\"#\" onClick=\"return mV('Mic',4,12);\">Mic 4:12</a>), which were afterwards gathered to the threshing-floor or stored in barns (<a href=\"#\" onClick=\"return mV('Mat',6,26);\">Mat 6:26</a>).<br><br>The process of threshing was performed generally by spreading the sheaves on the threshing-floor and causing oxen and cattle to tread repeatedly over them (<a href=\"#\" onClick=\"return mV('Deu',25,4);\">Deu 25:4</a>; <a href=\"#\" onClick=\"return mV('Isa',28,28);\">Isa 28:28</a>). On occasions flails or sticks were used for this purpose (<a href=\"#\" onClick=\"return mV('Rth',2,17);\">Rth 2:17</a>; <a href=\"#\" onClick=\"return mV('Isa',28,27);\">Isa 28:27</a>). There was also a \"threshing instrument\" (<a href=\"#\" onClick=\"return mV('Isa',41,15);\">Isa 41:15</a>; <a href=\"#\" onClick=\"return mV('Amo',1,3);\">Amo 1:3</a>) which was drawn over the corn. It was called by the Hebrews a moreg, a threshing roller or sledge (<a href=\"#\" onClick=\"return mV('2Sa',24,22);\">2Sa 24:22</a>; <a href=\"#\" onClick=\"return mV('1Ch',21,23);\">1Ch 21:23</a>; <a href=\"#\" onClick=\"return mV('Isa',3,15);\">Isa 3:15</a>). It was somewhat like the Roman tribulum, or threshing instrument.<br><br>When the grain was threshed, it was winnowed by being thrown up against the wind (<a href=\"#\" onClick=\"return mV('Jer',4,11);\">Jer 4:11</a>), and afterwards tossed with wooden scoops (<a href=\"#\" onClick=\"return mV('Isa',30,24);\">Isa 30:24</a>). The shovel and the fan for winnowing are mentioned in <a href=\"#\" onClick=\"return mV('Psa',35,5);\">Psa 35:5</a>; <a href=\"#\" onClick=\"return mV('Job',21,18);\">Job 21:18</a>; <a href=\"#\" onClick=\"return mV('Isa',17,13);\">Isa 17:13</a>. The refuse of straw and chaff was burned (<a href=\"#\" onClick=\"return mV('Isa',5,24);\">Isa 5:24</a>). Freed from impurities, the grain was then laid up in granaries till used (<a href=\"#\" onClick=\"return mV('Deu',28,8);\">Deu 28:8</a>; <a href=\"#\" onClick=\"return mV('Pro',3,10);\">Pro 3:10</a>; <a href=\"#\" onClick=\"return mV('Mat',6,26);\">Mat 6:26</a>; <a href=\"#\" onClick=\"return mV('Mat',13,30);\">13:30</a>; <a href=\"#\" onClick=\"return mV('Luk',12,18);\">Luk 12:18</a>).";
eastonArray["$$T0000125"] = "<b>Agrippa I.:</b> the grandson of Herod the Great, and son of Aristobulus and Bernice. The Roman emperor Caligula made him governor first of the territories of Philip, then of the tetrarchy of Lysanias, with the title of king (\"king Herod\"), and finally of that of Antipas, who was banished, and of Samaria and Judea. Thus he became ruler over the whole of Palestine. He was a persecutor of the early Christians. He slew James, and imprisoned Peter (<a href=\"#\" onClick=\"return mV('Act',12,'1-4');\">Act 12:1-4</a>). He died at Caesarea, being \"eaten of worms\" (<a href=\"#\" onClick=\"return mV('Act',12,23);\">Act 12:23</a>), A.D. 44. (Comp. Josephus, Ant. xix. 8.)";
eastonArray["$$T0000126"] = "<b>Agrippa II.:</b> son of the foregoing, was born at Rome, A.D. 27. He was the brother of Bernice and Drusilla. The Emperor Claudius (A.D. 48) invested him with the office of superintendent of the Temple of Jerusalem, and made him governor (A.D. 50) of Chalcis. He was afterwards raised to the rank of king, and made governor over the tetrarchy of Philip and Lysanias (<a href=\"#\" onClick=\"return mV('Act',25,13);\">Act 25:13</a>; <a href=\"#\" onClick=\"return mV('Act',26,2,7);\">26:2, 7</a>). It was before him that Paul delivered (A.D. 59) his speech recorded in <a href=\"#\" onClick=\"return mV('Act',26,'1-');\">Acts 26</a>. His private life was very profligate. He died (the last of his race) at Rome, at the age of about seventy years, A.D. 100.";
eastonArray["$$T0000127"] = "<b>Ague:</b> the translation in <a href=\"#\" onClick=\"return mV('Lev',26,16);\">Lev 26:16</a> (R.V., \"fever\") of the Hebrew word kaddah'ath, meaning \"kindling\", i.e., an inflammatory or burning fever. In <a href=\"#\" onClick=\"return mV('Deu',28,22);\">Deu 28:22</a> the word is rendered \"fever.\"";
eastonArray["$$T0000128"] = "<b>Agur:</b> gatherer; the collector, mentioned as author of the sayings in <a href=\"#\" onClick=\"return mV('Pro',30,'1-');\">Pro 30</a>. Nothing is known of him beyond what is there recorded.";
eastonArray["$$T0000129"] = "<b>Ah!:</b> an exclamation of sorrow or regret (<a href=\"#\" onClick=\"return mV('Psa',35,25);\">Psa 35:25</a>; <a href=\"#\" onClick=\"return mV('Isa',1,4,24);\">Isa 1:4, 24</a>; <a href=\"#\" onClick=\"return mV('Jer',1,6);\">Jer 1:6</a>; <a href=\"#\" onClick=\"return mV('Jer',22,18);\">22:18</a>; <a href=\"#\" onClick=\"return mV('Mar',15,29);\">Mar 15:29</a>).";
eastonArray["$$T0000130"] = "<b>Aha!:</b> an exclamation of ridicule (<a href=\"#\" onClick=\"return mV('Psa',35,21);\">Psa 35:21</a>; <a href=\"#\" onClick=\"return mV('Psa',40,15);\">40:15</a>; <a href=\"#\" onClick=\"return mV('Psa',70,3);\">70:3</a>). In <a href=\"#\" onClick=\"return mV('Isa',44,16);\">Isa 44:16</a> it signifies joyful surprise, as also in <a href=\"#\" onClick=\"return mV('Job',39,25);\">Job 39:25</a>, R.V.";
eastonArray["$$T0000131"] = "<b>Ahab:</b> father's brother.<br><br>(1.) The son of Omri, whom he succeeded as the seventh king of Israel. His history is recorded in <a href=\"#\" onClick=\"return mV('1Ki',16,'1-');\">1 Kings 16-22</a>. His wife was Jezebel (q.v.), who exercised a very evil influence over him. To the calf-worship introduced by Jeroboam he added the worship of Baal. He was severely admonished by Elijah (q.v.) for his wickedness. His anger was on this account kindled against the prophet, and he sought to kill him. He undertook three campaigns against Ben-hadad II., king of Damascus. In the first two, which were defensive, he gained a complete victory over Ben-hadad, who fell into his hands, and was afterwards released on the condition of his restoring all the cities of Israel he then held, and granting certain other concessions to Ahab. After three years of peace, for some cause Ahab renewed war (<a href=\"#\" onClick=\"return mV('1Ki',22,3);\">1Ki 22:3</a>) with Ben-hadad by assaulting the city of Ramoth-gilead, although the prophet Micaiah warned him that he would not succeed, and that the 400 false prophets who encouraged him were only leading him to his ruin. Micaiah was imprisoned for thus venturing to dissuade Ahab from his purpose. Ahab went into the battle disguised, that he might if possible escape the notice of his enemies; but an arrow from a bow \"drawn at a venture\" pierced him, and though stayed up in his chariot for a time he died towards evening, and Elijah's prophecy (<a href=\"#\" onClick=\"return mV('1Ki',21,19);\">1Ki 21:19</a>) was fulfilled. He reigned twenty-three years. Because of his idolatry, lust, and covetousness, Ahab is referred to as pre-eminently the type of a wicked king (<a href=\"#\" onClick=\"return mV('2Ki',8,18);\">2Ki 8:18</a>; <a href=\"#\" onClick=\"return mV('2Ch',22,3);\">2Ch 22:3</a>; <a href=\"#\" onClick=\"return mV('Mic',6,16);\">Mic 6:16</a>).<br><br>(2.) A false prophet referred to by Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',29,21);\">Jer 29:21</a>), of whom nothing further is known.";
eastonArray["$$T0000132"] = "<b>Ahasuerus:</b> There are three kings designated by this name in Scripture.<br><br>(1.) The father of Darius the Mede, mentioned in <a href=\"#\" onClick=\"return mV('Dan',9,1);\">Dan 9:1</a>. This was probably the Cyaxares I. known by this name in profane history, the king of Media and the conqueror of Nineveh.<br><br>(2.) The king mentioned in <a href=\"#\" onClick=\"return mV('Ezr',4,6);\">Ezr 4:6</a>, probably the Cambyses of profane history, the son and successor of Cyrus (B.C. 529).<br><br>(3.) The son of Darius Hystaspes, the king named in the Book of Esther. He ruled over the kingdoms of Persia, Media, and Babylonia, \"from India to Ethiopia.\" This was in all probability the Xerxes of profane history, who succeeded his father Darius (B.C. 485). In the LXX. version of the Book of Esther the name Artaxerxes occurs for Ahasuerus. He reigned for twenty-one years (B.C. 486-465). He invaded Greece with an army, it is said, of more than 2,000,000 soldiers, only 5,000 of whom returned with him. Leonidas, with his famous 300, arrested his progress at the Pass of Thermopylae, and then he was defeated disastrously by Themistocles at Salamis. It was after his return from this invasion that Esther was chosen as his queen.";
eastonArray["$$T0000133"] = "<b>Ahava:</b> water, the river (<a href=\"#\" onClick=\"return mV('Ezr',8,21);\">Ezr 8:21</a>) by the banks of which the Jewish exiles assembled under Ezra when about to return to Jerusalem from Babylon. In all probability this was one of the streams of Mesopotamia which flowed into the Euphrates somewhere in the north-west of Babylonia. It has, however, been supposed to be the name of a place (<a href=\"#\" onClick=\"return mV('Ezr',8,15);\">Ezr 8:15</a>) now called Hit, on the Euphrates, east of Damascus.";
eastonArray["$$T0000134"] = "<b>Ahaz:</b> possessor.<br><br>(1.) A grandson of Jonathan (<a href=\"#\" onClick=\"return mV('1Ch',8,35);\">1Ch 8:35</a>; <a href=\"#\" onClick=\"return mV('1Ch',9,42);\">9:42</a>).<br><br>(2.) The son and successor of Jotham, king of Judah (<a href=\"#\" onClick=\"return mV('2Ki',16,'1-')\">2Ki 16</a>; <a href=\"#\" onClick=\"return mV('Isa',7,'1-')\">Isa. 7-9</a>; <a href=\"#\" onClick=\"return mV('Isa',16,'1-')\">16</a>; <a href=\"#\" onClick=\"return mV('2Ch',28,'1-')\">2Ch 28</a>). He gave himself up to a life of wickedness and idolatry. Notwithstanding the remonstrances and warnings of Isaiah, Hosea, and Micah, he appealed for help against Rezin, king of Damascus, and Pekah, king of Israel, who threatened Jerusalem, to Tiglath-pileser, the king of Assyria, to the great injury of his kingdom and his own humilating subjection to the Assyrians (<a href=\"#\" onClick=\"return mV('2Ki',16,7,9);\">2Ki 16:7, 9</a>; <a href=\"#\" onClick=\"return mV('2Ki',15,29);\">15:29</a>). He also introduced among his people many heathen and idolatrous customs (<a href=\"#\" onClick=\"return mV('Isa',8,19);\">Isa 8:19</a>; <a href=\"#\" onClick=\"return mV('Isa',38,8);\">38:8</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,12);\">2Ki 23:12</a>). He died at the age of thirty-five years, after reigning sixteen years (B.C. 740-724), and was succeeded by his son Hezekiah. Because of his wickedness he was \"not brought into the sepulchre of the kings.\"";
eastonArray["$$T0000135"] = "<b>Ahaziah:</b> held by Jehovah.<br><br>(1.) The son and successor of Ahab. He followed the counsels of his mother Jezebel, and imitated in wickedness the ways of his father. In his reign the Moabites revolted from under his authority (<a href=\"#\" onClick=\"return mV('2Ki',3,'5-7');\">2Ki 3:5-7</a>). He united with Jehoshaphat in an attempt to revive maritime trade by the Red Sea, which proved a failure (<a href=\"#\" onClick=\"return mV('2Ch',20,'35-37');\">2Ch 20:35-37</a>). His messengers, sent to consult the god of Ekron regarding his recovery from the effects of a fall from the roof-gallery of his palace, were met on the way by Elijah, who sent them back to tell the king that he would never rise from his bed (<a href=\"#\" onClick=\"return mV('1Ki',22,51);\">1Ki 22:51</a>; <a href=\"#\" onClick=\"return mV('2Ki',1,18);\">2Ki 1:18</a>).<br><br>(2.) The son of Joram, or Jehoram, and sixth king of Judah. Called Jehoahaz (<a href=\"#\" onClick=\"return mV('2Ch',21,17);\">2Ch 21:17</a>; <a href=\"#\" onClick=\"return mV('2Ch',25,23);\">25:23</a>), and Azariah (<a href=\"#\" onClick=\"return mV('2Ch',22,6);\">2Ch 22:6</a>). Guided by his idolatrous mother Athaliah, his reign was disastrous (<a href=\"#\" onClick=\"return mV('2Ki',8,'24-29');\">2Ki 8:24-29</a>; <a href=\"#\" onClick=\"return mV('2Ki',9,29);\">9:29</a>). He joined his uncle Jehoram, king of Israel, in an expedition against Hazael, king of Damascus; but was wounded at the pass of Gur when attempting to escape, and had strength only to reach Megiddo, where he died (<a href=\"#\" onClick=\"return mV('2Ki',9,'22-28');\">2Ki 9:22-28</a>). He reigned only one year.";
eastonArray["$$T0000136"] = "<b>Ahiam:</b> mother's brother, one of David's thirty heroes (<a href=\"#\" onClick=\"return mV('2Sa',23,33);\">2Sa 23:33</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,35);\">1Ch 11:35</a>).";
eastonArray["$$T0000137"] = "<b>Ahiezer:</b> brother of help; i.e., \"helpful.\"<br><br>(1.) The chief of the tribe of Dan at the time of the Exodus (<a href=\"#\" onClick=\"return mV('Num',1,12);\">Num 1:12</a>; <a href=\"#\" onClick=\"return mV('Num',2,25);\">2:25</a>; <a href=\"#\" onClick=\"return mV('Num',10,25);\">10:25</a>).<br><br>(2.) The chief of the Benjamite slingers that repaired to David at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,3);\">1Ch 12:3</a>).";
eastonArray["$$T0000138"] = "<b>Ahihud:</b> brother (i.e., \"friend\") of union.<br><br>(1.) A son of Bela, the son of Benjamin (<a href=\"#\" onClick=\"return mV('1Ch',8,7);\">1Ch 8:7</a>).<br><br>(2.) Name different in Hebrew, meaning brother of Judah. Chief of the tribe of Asher; one of those appointed by Moses to superintend the division of Canaan among the tribe (<a href=\"#\" onClick=\"return mV('Num',34,27);\">Num 34:27</a>).";
eastonArray["$$T0000139"] = "<b>Ahijah:</b> brother (i.e., \"friend\") of Jehovah.<br><br>(1.) One of the sons of Bela (<a href=\"#\" onClick=\"return mV('1Ch',8,7);\">1Ch 8:7</a>, R.V.). In A.V. called \"Ahiah.\"<br><br>(2.) One of the five sons of Jerahmeel, who was great-grandson of Judah (<a href=\"#\" onClick=\"return mV('1Ch',2,25);\">1Ch 2:25</a>).<br><br>(3.) Son of Ahitub (<a href=\"#\" onClick=\"return mV('1Sa',14,3,18);\">1Sa 14:3, 18</a>), Ichabod's brother; the same probably as Ahimelech, who was high priest at Nob in the reign of Saul (<a href=\"#\" onClick=\"return mV('1Sa',22,11);\">1Sa 22:11</a>). Some, however, suppose that Ahimelech was the brother of Ahijah, and that they both officiated as high priests, Ahijah at Gibeah or Kirjath-jearim, and Ahimelech at Nob.<br><br>(4.) A Pelonite, one of David's heroes (<a href=\"#\" onClick=\"return mV('1Ch',11,36);\">1Ch 11:36</a>); called also Eliam (<a href=\"#\" onClick=\"return mV('2Sa',23,34);\">2Sa 23:34</a>).<br><br>(5.) A Levite having charge of the sacred treasury in the temple (<a href=\"#\" onClick=\"return mV('1Ch',26,20);\">1Ch 26:20</a>).<br><br>(6.) One of Solomon's secretaries (<a href=\"#\" onClick=\"return mV('1Ki',4,3);\">1Ki 4:3</a>).<br><br>(7.) A prophet of Shiloh (<a href=\"#\" onClick=\"return mV('1Ki',11,29);\">1Ki 11:29</a>; <a href=\"#\" onClick=\"return mV('1Ki',14,2);\">14:2</a>), called the \"Shilonite,\" in the days of Rehoboam. We have on record two of his remarkable prophecies, <a href=\"#\" onClick=\"return mV('1Ki',11,'31-39');\">1Ki 11:31-39</a>, announcing the rending of the ten tribes from Solomon; and <a href=\"#\" onClick=\"return mV('1Ki',14,'6-16');\">1Ki 14:6-16</a>, delivered to Jeroboam's wife, foretelling the death of Abijah the king's son, the destruction of Jeroboam's house, and the captivity of Israel \"beyond the river.\" Jeroboam bears testimony to the high esteem in which he was held as a prophet of God (<a href=\"#\" onClick=\"return mV('1Ki',14,2,3);\">1Ki 14:2-3</a>).";
eastonArray["$$T0000140"] = "<b>Ahikam:</b> brother of support = helper, one of the five whom Josiah sent to consult the prophetess Huldah in connection with the discovery of the book of the law (<a href=\"#\" onClick=\"return mV('2Ki',22,'12-14');\">2Ki 22:12-14</a>; <a href=\"#\" onClick=\"return mV('2Ch',34,20);\">2Ch 34:20</a>). He was the son of Shaphan, the royal secretary, and the father of Gedaliah, governor of Judea after the destruction of Jerusalem by the Babylonians (<a href=\"#\" onClick=\"return mV('2Ki',25,22);\">2Ki 25:22</a>; <a href=\"#\" onClick=\"return mV('Jer',40,'5-16');\">Jer 40:5-16</a>; <a href=\"#\" onClick=\"return mV('Jer',43,6);\">43:6</a>). On one occasion he protected Jeremiah against the fury of Jehoiakim (<a href=\"#\" onClick=\"return mV('Jer',26,24);\">Jer 26:24</a>). It was in the chamber of another son (Germariah) of Shaphan that Baruch read in the ears of all the people Jeremiah's roll.";
eastonArray["$$T0000141"] = "<b>Ahimaaz:</b> brother of anger = irascible.<br><br>(1.) The father Ahinoam, the wife of Saul (<a href=\"#\" onClick=\"return mV('1Sa',14,50);\">1Sa 14:50</a>).<br><br>(2.) The son and successor of Zadok in the office of high priest (<a href=\"#\" onClick=\"return mV('1Ch',6,8,53);\">1Ch 6:8, 53</a>). On the occasion of the revolt of Absalom he remained faithful to David, and was of service to him in conveying to him tidings of the proceedings of Absalom in Jerusalem (<a href=\"#\" onClick=\"return mV('2Sa',15,'24-37');\">2Sa 15:24-37</a>; <a href=\"#\" onClick=\"return mV('2Sa',17,'15-21');\">17:15-21</a>). He was swift of foot, and was the first to carry to David tidings of the defeat of Absalom, although he refrained, from delicacy of feeling, from telling him of his death (<a href=\"#\" onClick=\"return mV('2Sa',18,'19-33');\">2Sa 18:19-33</a>).";
eastonArray["$$T0000142"] = "<b>Ahiman:</b> brother of a gift = liberal.<br><br>(1.) One of the three giant Anakim brothers whom Caleb and the spies saw in Mount Hebron (<a href=\"#\" onClick=\"return mV('Num',13,22);\">Num 13:22</a>) when they went in to explore the land. They were afterwards driven out and slain (<a href=\"#\" onClick=\"return mV('Jos',15,14);\">Jos 15:14</a>; <a href=\"#\" onClick=\"return mV('Jdg',1,10);\">Jdg 1:10</a>).<br><br>(2.) One of the guardians of the temple after the Exile (<a href=\"#\" onClick=\"return mV('1Ch',9,17);\">1Ch 9:17</a>).";
eastonArray["$$T0000143"] = "<b>Ahimelech:</b> brother of the king, the son of Ahitub and father of Abiathar (<a href=\"#\" onClick=\"return mV('1Sa',22,'20-23');\">1Sa 22:20-23</a>). He descended from Eli in the line of Ithamar. In <a href=\"#\" onClick=\"return mV('1Ch',18,16);\">1Ch 18:16</a> he is called Abimelech, and is probably the same as Ahiah (<a href=\"#\" onClick=\"return mV('1Sa',14,3,18);\">1Sa 14:3, 18</a>). He was the twelfth high priest, and officiated at Nob, where he was visited by David (to whom and his companions he gave five loaves of the showbread) when he fled from Saul (<a href=\"#\" onClick=\"return mV('1Sa',21,'1-9');\">1Sa 21:1-9</a>). He was summoned into Saul's presence, and accused, on the information of Doeg the Edomite, of disloyalty because of his kindness to David; whereupon the king commanded that he, with the other priests who stood beside him (86 in all), should be put to death. This sentence was carried into execution by Doeg in the most cruel manner (<a href=\"#\" onClick=\"return mV('1Sa',22,'9-23');\">1Sa 22:9-23</a>). Possibly Abiathar had a son also called Ahimelech, or the two names, as some think, may have been accidentally transposed in <a href=\"#\" onClick=\"return mV('2Sa',8,17);\">2Sa 8:17</a>; <a href=\"#\" onClick=\"return mV('1Ch',18,16);\">1Ch 18:16</a>, marg.; <a href=\"#\" onClick=\"return mV('1Ch',24,3,6,31);\">1Ch 24:3, 6, 31</a>.";
eastonArray["$$T0000144"] = "<b>Ahinadab:</b> brother of liberality = liberal, one of the twelve commissariat officers appointed by Solomon in so many districts of his kingdom to raise supplies by monthly rotation for his household. He was appointed to the district of Mahanaim (<a href=\"#\" onClick=\"return mV('1Ki',4,14);\">1Ki 4:14</a>), east of Jordan.";
eastonArray["$$T0000145"] = "<b>Ahinoam:</b> brother of pleasantness = pleasant.<br><br>(1.) The daughter of Ahimaaz, and wife of Saul (<a href=\"#\" onClick=\"return mV('1Sa',14,50);\">1Sa 14:50</a>).<br><br>(2.) A Jezreelitess, the first wife of David (<a href=\"#\" onClick=\"return mV('1Sa',25,43);\">1Sa 25:43</a>; <a href=\"#\" onClick=\"return mV('1Sa',27,3);\">27:3</a>). She was the mother of Amnon (<a href=\"#\" onClick=\"return mV('2Sa',3,2);\">2Sa 3:2</a>). (See <a href=\"#\" onClick=\"return mV('1Sa',30,5,18);\">1Sa 30:5, 18</a>; <a href=\"#\" onClick=\"return mV('2Sa',2,2);\">2Sa 2:2</a>.)";
eastonArray["$$T0000146"] = "<b>Ahio:</b> brotherly.<br><br>(1.) One of the sons of Beriah (<a href=\"#\" onClick=\"return mV('1Ch',8,14);\">1Ch 8:14</a>).<br><br>(2.) One of the sons of Jehiel the Gibeonite (<a href=\"#\" onClick=\"return mV('1Ch',8,31);\">1Ch 8:31</a>; <a href=\"#\" onClick=\"return mV('1Ch',9,37);\">9:37</a>).<br><br>(3.) One of the sons of Abinadab the Levite. While Uzzah went by the side of the ark, he walked before it guiding the oxen which drew the cart on which it was carried, after having brought it from his father's house in Gibeah (<a href=\"#\" onClick=\"return mV('1Ch',13,7);\">1Ch 13:7</a>; <a href=\"#\" onClick=\"return mV('2Sa',6,3,4);\">2Sa 6:3-4</a>).";
eastonArray["$$T0000147"] = "<b>Ahira:</b> brother of evil = unlucky, or my brother is friend, chief of the tribe of Naphtali at the Exodus (<a href=\"#\" onClick=\"return mV('Num',1,15);\">Num 1:15</a>; <a href=\"#\" onClick=\"return mV('Num',2,29);\">2:29</a>).";
eastonArray["$$T0000148"] = "<b>Ahishar:</b> brother of song = singer, the officer who was \"over the household\" of Solomon (<a href=\"#\" onClick=\"return mV('1Ki',4,6);\">1Ki 4:6</a>).";
eastonArray["$$T0000149"] = "<b>Ahithophel:</b> brother of insipidity or impiety, a man greatly renowned for his sagacity among the Jews. At the time of Absalom's revolt he deserted David (<a href=\"#\" onClick=\"return mV('Psa',41,9);\">Psa 41:9</a>; <a href=\"#\" onClick=\"return mV('Psa',55,'12-14');\">55:12-14</a>) and espoused the cause of Absalom (<a href=\"#\" onClick=\"return mV('2Sa',15,12);\">2Sa 15:12</a>). David sent his old friend Hushai back to Absalom, in order that he might counteract the counsel of Ahithophel (<a href=\"#\" onClick=\"return mV('2Sa',15,'31-37');\">2Sa 15:31-37</a>). This end was so far gained that Ahithophel saw he had no longer any influence, and accordingly he at once left the camp of Absalom and returned to Giloh, his native place, where, after arranging his wordly affairs, he hanged himself, and was buried in the sepulchre of his fathers (<a href=\"#\" onClick=\"return mV('2Sa',17,'1-23');\">2Sa 17:1-23</a>). He was the type of Judas (<a href=\"#\" onClick=\"return mV('Psa',41,9);\">Psa 41:9</a>).";
