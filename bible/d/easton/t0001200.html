<script src="./js/NoNavHeader.js"  type="text/javascript"></script>
<script>
var eastonArray = new Array ();
eastonArray["$$T0001200"] = "<strong>Emmor:</strong> an ass, <a href=\"#\" onClick=\"return mV('Act',7,16);\">Act 7:16</a>. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001615');\">HAMOR</a>.)";
eastonArray["$$T0001201"] = "<strong>Encamp:</strong> An encampment was the resting-place for a longer or shorter period of an army or company of travellers (<a href=\"#\" onClick=\"return mV('Exd',13,20);\">Exd 13:20</a>; <a href=\"#\" onClick=\"return mV('Exd',14,19);\">14:19</a>; <a href=\"#\" onClick=\"return mV('Jos',10,5);\">Jos 10:5</a>; <a href=\"#\" onClick=\"return mV('Jos',11,5);\">11:5</a>).<br><br>The manner in which the Israelites encamped during their march through the wilderness is described in <a href=\"#\" onClick=\"return mV('Num',2,'1-');\">Num 2</a> and <a href=\"#\" onClick=\"return mV('Num',3,'1-');\">3</a>. The order of the encampment (see <a href=\"#\" onClick=\"return doDictLookup('ET0000700');\">CAMP</a>) was preserved in the march (<a href=\"#\" onClick=\"return mV('Num',2,17);\">Num 2:17</a>), the signal for which was the blast of two silver trumpets. Detailed regulations affecting the camp for sanitary purposes are given (<a href=\"#\" onClick=\"return mV('Lev',4,11,12);\">Lev 4:11-12</a>; <a href=\"#\" onClick=\"return mV('Lev',6,11);\">6:11</a>; <a href=\"#\" onClick=\"return mV('Lev',8,17);\">8:17</a>; <a href=\"#\" onClick=\"return mV('Lev',10,4,5);\">10:4-5</a>; <a href=\"#\" onClick=\"return mV('Lev',13,46);\">13:46</a>; <a href=\"#\" onClick=\"return mV('Lev',14,3);\">14:3</a>; <a href=\"#\" onClick=\"return mV('Num',12,14,15);\">Num 12:14-15</a>; <a href=\"#\" onClick=\"return mV('Num',31,19);\">31:19</a>; <a href=\"#\" onClick=\"return mV('Deu',23,10,12);\">Deu 23:10, 12</a>).<br><br>Criminals were executed without the camp (<a href=\"#\" onClick=\"return mV('Lev',4,12);\">Lev 4:12</a>; <a href=\"#\" onClick=\"return mV('Jhn',19,17,20);\">Jhn 19:17, 20</a>), and there also the young bullock for a sin-offering was burnt (<a href=\"#\" onClick=\"return mV('Lev',24,14);\">Lev 24:14</a>; <a href=\"#\" onClick=\"return mV('Hbr',13,12);\">Hbr 13:12</a>).<br><br>In the subsequent history of Israel frequent mention is made of their encampments in the time of war (<a href=\"#\" onClick=\"return mV('Jdg',7,18);\">Jdg 7:18</a>; <a href=\"#\" onClick=\"return mV('1Sa',13,2,3,16,23);\">1Sa 13:2-3, 16, 23</a>; <a href=\"#\" onClick=\"return mV('1Sa',17,3);\">17:3</a>; <a href=\"#\" onClick=\"return mV('1Sa',29,1);\">29:1</a>; <a href=\"#\" onClick=\"return mV('1Sa',30,9,24);\">30:9, 24</a>). The temple was sometimes called \"the camp of the Lord\" (<a href=\"#\" onClick=\"return mV('2Ch',31,2);\">2Ch 31:2</a>, R.V.; <a href=\"#\" onClick=\"return mV('Psa',78,28);\">Psa 78:28</a>). The multitudes who flocked to David are styled \"a great host (i.e., \"camp; \" Heb. mahaneh), like the host of God\" (<a href=\"#\" onClick=\"return mV('1Ch',12,22);\">1Ch 12:22</a>).";
eastonArray["$$T0001202"] = "<strong>Enchantments:</strong><br><br>(1.) The rendering of Hebrew <i>latim</i> or <i>lehatim</i>, which means \"something covered,\" \"muffled up;\" secret arts, tricks (<a href=\"#\" onClick=\"return mV('Exd',7,11,22);\">Exd 7:11, 22</a>; <a href=\"#\" onClick=\"return mV('Exd',8,7,18);\">8:7, 18</a>), by which the Egyptian magicians imposed on the credulity of Pharaoh.<br><br>(2.) The rendering of the Hebrew <i>keshaphim</i>, \"muttered spells\" or \"incantations,\" rendered \"sorceries\" in <a href=\"#\" onClick=\"return mV('Isa',47,9,12);\">Isa 47:9, 12</a>, i.e., the using of certain formulae under the belief that men could thus be bound.<br><br>(3.) Hebrew <i>lehashim</i>, \"charming,\" as of serpents (<a href=\"#\" onClick=\"return mV('Jer',8,17);\">Jer 8:17</a>; <a href=\"#\" onClick=\"return mV('Psa',58,5);\">Psa 58:5</a>).<br><br>(4.) Hebrew <i>nehashim</i>, the enchantments or omens used by Balaam (<a href=\"#\" onClick=\"return mV('Num',24,1);\">Num 24:1</a>); his endeavouring to gain omens favourable to his design.<br><br>(5.) Hebrew <i>heber</i> (<a href=\"#\" onClick=\"return mV('Isa',47,9,12);\">Isa 47:9, 12</a>), \"magical spells.\" All kinds of enchantments were condemned by the Mosaic law (<a href=\"#\" onClick=\"return mV('Lev',19,26);\">Lev 19:26</a>; <a href=\"#\" onClick=\"return mV('Deu',18,'10-12');\">Deu 18:10-12</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001047');\">DIVINATION</a>.)";
eastonArray["$$T0001203"] = "<strong>End:</strong> in <a href=\"#\" onClick=\"return mV('Hbr',13,7);\">Hbr 13:7</a>, is the rendering of the unusual Greek word <i>ekbasin</i>, meaning \"outcome\", i.e., death. It occurs only elsewhere in <a href=\"#\" onClick=\"return mV('1Cr',10,13);\">1Cr 10:13</a>, where it is rendered \"escape.\"";
eastonArray["$$T0001204"] = "<strong>Endor:</strong> fountain of Dor; i.e., \"of the age\", a place in the territory of Issachar (<a href=\"#\" onClick=\"return mV('Jos',17,11);\">Jos 17:11</a>) near the scene of the great victory which was gained by Deborah and Barak over Sisera and Jabin (<a href=\"#\" onClick=\"return mV('Psa',83,9,10);\">Psa 83:9-10</a>). To Endor, Saul resorted to consult one reputed to be a witch on the eve of his last engagement with the Philistines (<a href=\"#\" onClick=\"return mV('1Sa',28,7);\">1Sa 28:7</a>). It is identified with the modern village of Endur, \"a dirty hamlet of some twenty houses, or rather huts, most of them falling to ruin,\" on the northern slope of Little Hermon, about 7 miles from Jezreel.";
eastonArray["$$T0001205"] = "<strong>En-eglaim:</strong> fountain of two calves, a place mentioned only in <a href=\"#\" onClick=\"return mV('Eze',47,10);\">Eze 47:10</a>. Somewhere near the Dead Sea.";
eastonArray["$$T0001206"] = "<strong>En-gannim:</strong> fountain of gardens.<br><br>(1.) A town in the plains of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,34);\">Jos 15:34</a>), north-west of Jerusalem, between Zanoah and Tappuah. It is the modern Umm Jina.<br><br>(2.) A city on the border of Machar (<a href=\"#\" onClick=\"return mV('Jos',19,21);\">Jos 19:21</a>), allotted to the Gershonite Levites (<a href=\"#\" onClick=\"return mV('Jos',21,29);\">21:29</a>). It is identified with the modern Jenin, a large and prosperous town of about 4,000 inhabitants, situated 15 miles south of Mount Tabor, through which the road from Jezreel to Samaria and Jerusalem passes. When Ahaziah, king of Judah, attempted to escape from Jehu, he \"fled by the way of the garden house\" i.e., by way of En-gannim. Here he was overtaken by Jehu and wounded in his chariot, and turned aside and fled to Megiddo, a distance of about 20 miles, to die there.";
eastonArray["$$T0001207"] = "<strong>Engedi:</strong> fountain of the kid, place in the wilderness of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,62);\">Jos 15:62</a>), on the western shore of the Dead Sea (<a href=\"#\" onClick=\"return mV('Eze',47,10);\">Eze 47:10</a>), and nearly equidistant from both extremities. To the wilderness near this town David fled for fear of Saul (<a href=\"#\" onClick=\"return mV('Jos',15,62);\">Jos 15:62</a>; <a href=\"#\" onClick=\"return mV('1Sa',23,29);\">1Sa 23:29</a>). It was at first called Hazezon-tamar (<a href=\"#\" onClick=\"return mV('Gen',14,7);\">Gen 14:7</a>), a city of the Amorites.<br><br>The vineyards of Engedi were celebrated in Solomon's time (<a href=\"#\" onClick=\"return mV('Sgs',1,4);\">Sgs 1:4</a>). It is the modern 'Ain Jidy. The \"fountain\" from which it derives its name rises on the mountain side about 600 feet above the sea, and in its rapid descent spreads luxuriance all around it. Along its banks the osher grows abundantly. That shrub is thus described by Porter: \"The stem is stout, measuring sometimes nearly a foot in diameter, and the plant grows to the height of 15 feet or more. It has a grayish bark and long oval leaves, which when broken off discharge a milky fluid. The fruit resembles an apple, and hangs in clusters of two or three. When ripe it is of a rich yellow colour, but on being pressed it explodes like a puff-ball. It is chiefly filled with air...This is the so-called 'apple of Sodom.'\" Through Samaria, etc. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000273');\">APPLE</a>.)";
eastonArray["$$T0001208"] = "<strong>Engines:</strong><br><br>(1.) Heb. hishalon i.e., \"invention\" (as in <a href=\"#\" onClick=\"return mV('Ecc',7,29);\">Ecc 7:29</a>) contrivances indicating ingenuity. In <a href=\"#\" onClick=\"return mV('2Ch',26,15);\">2Ch 26:15</a> it refers to inventions for the purpose of propelling missiles from the walls of a town, such as stones (the Roman balista) and arrows (the catapulta).<br><br>(2.) Heb. mechi kobollo, i.e., the beating of that which is in front a battering-ram (<a href=\"#\" onClick=\"return mV('Eze',26,9);\">Eze 26:9</a>), the use of which was common among the Egyptians and the Assyrians. Such an engine is mentioned in the reign of David (<a href=\"#\" onClick=\"return mV('2Sa',20,15);\">2Sa 20:15</a>).";
eastonArray["$$T0001209"] = "<strong>Engraver:</strong> Heb. harash (<a href=\"#\" onClick=\"return mV('Exd',35,35);\">Exd 35:35</a>; <a href=\"#\" onClick=\"return mV('Exd',38,23);\">38:23</a>) means properly an artificer in wood, stone, or metal. The chief business of the engraver was cutting names or devices on rings and seals and signets (<a href=\"#\" onClick=\"return mV('Exd',28,11,21,36);\">Exd 28:11, 21, 36</a>; <a href=\"#\" onClick=\"return mV('Gen',38,18);\">Gen 38:18</a>).";
eastonArray["$$T0001210"] = "<strong>En-hakkore:</strong> fountain of the crier, the name of the spring in Lehi which burst forth in answer to Samson's prayer when he was exhausted with the slaughter of the Philistines (<a href=\"#\" onClick=\"return mV('Jdg',15,19);\">Jdg 15:19</a>). It has been identified with the spring 'Ayun Kara, near Zoreah.";
eastonArray["$$T0001211"] = "<strong>Enmity:</strong> deep-rooted hatred. \"I will put enmity between thee and the woman, between thy seed and her seed\" (<a href=\"#\" onClick=\"return mV('Gen',3,15);\">Gen 3:15</a>). The friendship of the world is \"enmity with God\" (<a href=\"#\" onClick=\"return mV('Jam',4,4);\">Jam 4:4</a>; <a href=\"#\" onClick=\"return mV('1Jo',2,15,16);\">1Jo 2:15-16</a>). The \"carnal mind\" is \"enmity against God\" (<a href=\"#\" onClick=\"return mV('Rom',8,7);\">Rom 8:7</a>). By the abrogation of the Mosaic institutes the \"enmity\" between Jew and Gentile is removed. They are reconciled, are \"made one\" (<a href=\"#\" onClick=\"return mV('Eph',2,15,16);\">Eph 2:15-16</a>).";
eastonArray["$$T0001212"] = "<strong>Enoch:</strong> initiated.<br><br>(1.) The eldest son of Cain (<a href=\"#\" onClick=\"return mV('Gen',4,17);\">Gen 4:17</a>), who built a city east of Eden in the land of Nod, and called it \"after the name of his son Enoch.\" This is the first \"city\" mentioned in Scripture.<br><br>(2.) The son of Jared, and father of Methuselah (<a href=\"#\" onClick=\"return mV('Gen',5,21);\">Gen 5:21</a>; <a href=\"#\" onClick=\"return mV('Luk',3,37);\">Luk 3:37</a>). His father was one hundred and sixty-two years old when he was born. After the birth of Methuselah, Enoch \"walked with God three hundred years\" (<a href=\"#\" onClick=\"return mV('Gen',5,'22-24');\">Gen 5:22-24</a>), when he was translated without tasting death. His whole life on earth was three hundred and sixty-five years. He was the \"seventh from Adam\" (<a href=\"#\" onClick=\"return mV('Jud',1,14);\">Jud 1:14</a>), as distinguished from the son of Cain, the third from Adam. He is spoken of in the catalogue of Old Testament worthies in the Epistle to the Hebrews (<a href=\"#\" onClick=\"return mV('Hbr',11,5);\">Hbr 11:5</a>). When he was translated, only Adam, so far as recorded, had as yet died a natural death, and Noah was not yet born. Mention is made of Enoch's prophesying only in <a href=\"#\" onClick=\"return mV('Jud',1,14);\">Jud 1:14</a>.";
eastonArray["$$T0001213"] = "<strong>Enos:</strong> man the son of Seth, and grandson of Adam (<a href=\"#\" onClick=\"return mV('Gen',5,'6-11');\">Gen 5:6-11</a>; <a href=\"#\" onClick=\"return mV('Luk',3,38);\">Luk 3:38</a>). He lived nine hundred and five years. In his time \"men began to call upon the name of the Lord\" (<a href=\"#\" onClick=\"return mV('Gen',4,26);\">Gen 4:26</a>), meaning either<br><br>(1) then began men to call themselves by the name of the Lord (marg.) i.e., to distinguish themselves thereby from idolaters; or<br><br>(2) then men in some public and earnest way began to call upon the Lord, indicating a time of spiritual revival.";
eastonArray["$$T0001214"] = "<strong>En-rogel:</strong> fountain of the treaders; i.e., \"foot-fountain;\" also called the \"fullers' fountain,\" because fullers here trod the clothes in water. It has been identified with the \"fountain of the virgin\" (q.v.), the modern 'Ain Ummel-Daraj. Others identify it, with perhaps some probability, with the Bir Eyub, to the south of the Pool of Siloam, and below the junction of the valleys of Kidron and Hinnom. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001378');\">FOUNTAIN</a>.)<br><br>It was at this fountain that Jonathan and Ahimaaz lay hid after the flight of David (<a href=\"#\" onClick=\"return mV('2Sa',17,17);\">2Sa 17:17</a>); and here also Adonijah held the feast when he aspired to the throne of his father (<a href=\"#\" onClick=\"return mV('1Ki',1,9);\">1Ki 1:9</a>).<br><br>The Bir Eyub, or \"Joab's well,\" \"is a singular work of ancient enterprise. The shaft sunk through the solid rock in the bed of the Kidron is 125 feet deep...The water is pure and entirely sweet, quite different from that of Siloam; which proves that there is no connection between them.\" Thomson's Land and the Book.";
eastonArray["$$T0001215"] = "<strong>En-shemesh:</strong> fountain of the sun a spring which formed one of the landmarks on the boundary between Judah and Benjamin (<a href=\"#\" onClick=\"return mV('Jos',15,7);\">Jos 15:7</a>; <a href=\"#\" onClick=\"return mV('Jos',18,17);\">18:17</a>). It was between the \"ascent of Adummim\" and the spring of En-rogel, and hence was on the east of Jerusalem and of the Mount of Olives. It is the modern 'Ain-Haud i.e., the \"well of the apostles\" about a mile east of Bethany, the only spring on the road to Jericho. The sun shines on it the whole day long.";
eastonArray["$$T0001216"] = "<strong>Ensign:</strong><br><br>(1.) Heb. 'oth, a military standard, especially of a single tribe (<a href=\"#\" onClick=\"return mV('Num',2,2);\">Num 2:2</a>). Each separate tribe had its own \"sign\" or \"ensign.\"<br><br>(2.) Heb. nes, a lofty signal, as a column or high pole (<a href=\"#\" onClick=\"return mV('Num',21,8,9);\">Num 21:8-9</a>); a standard or signal or flag placed on high mountains to point out to the people a place of rendezvous on the irruption of an enemy (<a href=\"#\" onClick=\"return mV('Isa',5,26);\">Isa 5:26</a>; <a href=\"#\" onClick=\"return mV('Isa',11,12);\">11:12</a>; <a href=\"#\" onClick=\"return mV('Isa',18,3);\">18:3</a>; <a href=\"#\" onClick=\"return mV('Isa',62,10);\">62:10</a>; <a href=\"#\" onClick=\"return mV('Jer',4,6,21);\">Jer 4:6, 21</a>; <a href=\"#\" onClick=\"return mV('Psa',60,4);\">Psa 60:4</a>). This was an occasional signal, and not a military standard. Elevation and conspicuity are implied in the word.<br><br>(3.) The Hebrew word <i>degel</i> denotes the standard given to each of the four divisions of the host of the Israelites at the Exodus (<a href=\"#\" onClick=\"return mV('Num',1,52);\">Num 1:52</a>; <a href=\"#\" onClick=\"return mV('Num',2,2);\">2:2</a>; <a href=\"#\" onClick=\"return mV('Num',10,14);\">10:14</a>). In <a href=\"#\" onClick=\"return mV('Sgs',2,4);\">Sgs 2:4</a> it is rendered \"banner.\" We have no definite information as to the nature of these military standards. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000433');\">BANNER</a>.)";
eastonArray["$$T0001217"] = "<strong>Entertain:</strong> Entertainments, \"feasts,\" were sometimes connected with a public festival (<a href=\"#\" onClick=\"return mV('Deu',16,11,14);\">Deu 16:11, 14</a>), and accompanied by offerings (<a href=\"#\" onClick=\"return mV('1Sa',9,13);\">1Sa 9:13</a>), in token of alliances (<a href=\"#\" onClick=\"return mV('Gen',26,30);\">Gen 26:30</a>); sometimes in connection with domestic or social events, as at the weaning of children (<a href=\"#\" onClick=\"return mV('Gen',21,8);\">Gen 21:8</a>), at weddings (<a href=\"#\" onClick=\"return mV('Gen',29,22);\">Gen 29:22</a>; <a href=\"#\" onClick=\"return mV('Jhn',2,1);\">Jhn 2:1</a>), on birth-days (<a href=\"#\" onClick=\"return mV('Mat',14,6);\">Mat 14:6</a>), at the time of sheep-shearing (<a href=\"#\" onClick=\"return mV('2Sa',13,23);\">2Sa 13:23</a>), and of vintage (<a href=\"#\" onClick=\"return mV('Jdg',9,27);\">Jdg 9:27</a>), and at funerals (<a href=\"#\" onClick=\"return mV('2Sa',3,35);\">2Sa 3:35</a>; <a href=\"#\" onClick=\"return mV('Jer',16,7);\">Jer 16:7</a>).<br><br>The guests were invited by servants (<a href=\"#\" onClick=\"return mV('Pro',9,3);\">Pro 9:3</a>; <a href=\"#\" onClick=\"return mV('Mat',22,3);\">Mat 22:3</a>), who assigned them their respective places (<a href=\"#\" onClick=\"return mV('1Sa',9,22);\">1Sa 9:22</a>; <a href=\"#\" onClick=\"return mV('Luk',14,8);\">Luk 14:8</a>; <a href=\"#\" onClick=\"return mV('Mar',12,39);\">Mar 12:39</a>). Like portions were sent by the master to each guest (<a href=\"#\" onClick=\"return mV('1Sa',1,4);\">1Sa 1:4</a>; <a href=\"#\" onClick=\"return mV('2Sa',6,19);\">2Sa 6:19</a>), except when special honour was intended, when the portion was increased (<a href=\"#\" onClick=\"return mV('Gen',43,34);\">Gen 43:34</a>).<br><br>The Israelites were forbidden to attend heathenish sacrificial entertainments (<a href=\"#\" onClick=\"return mV('Exd',34,15);\">Exd 34:15</a>), because these were in honour of false gods, and because at such feast they would be liable to partake of unclean flesh (<a href=\"#\" onClick=\"return mV('1Cr',10,28);\">1Cr 10:28</a>).<br><br>In the entertainments common in apostolic times among the Gentiles were frequent \"revellings,\" against which Christians were warned (<a href=\"#\" onClick=\"return mV('Rom',13,13);\">Rom 13:13</a>; <a href=\"#\" onClick=\"return mV('Gal',5,21);\">Gal 5:21</a>; <a href=\"#\" onClick=\"return mV('1Pe',4,3);\">1Pe 4:3</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000434');\">BANQUET</a>.)";
eastonArray["$$T0001218"] = "<strong>Epaenetus:</strong> commendable, a Christian at Rome to whom Paul sent his salutation (<a href=\"#\" onClick=\"return mV('Rom',16,5);\">Rom 16:5</a>). He is spoken of as \"the first fruits of Achaia\" (R.V., \"of Asia\", i.e., of proconsular Asia, which is probably the correct reading). As being the first convert in that region, he was peculiarly dear to the apostle. He calls him his \"well beloved.\"";
eastonArray["$$T0001219"] = "<strong>Epaphras:</strong> lovely, spoken of by Paul (<a href=\"#\" onClick=\"return mV('Col',1,7);\">Col 1:7</a>; <a href=\"#\" onClick=\"return mV('Col',4,12);\">4:12</a>) as \"his dear fellow-servant,\" and \"a faithful minister of Christ.\" He was thus evidently with him at Rome when he wrote to the Colossians. He was a distinguished disciple, and probably the founder of the Colossian church. He is also mentioned in the Epistle to Philemon (<a href=\"#\" onClick=\"return mV('Phm',1,23);\">Phm 1:23</a>), where he is called by Paul his \"fellow-prisoner.\"";
eastonArray["$$T0001220"] = "<strong>Epaphroditus:</strong> fair, graceful; belonging to Aphrodite or Venus the messenger who came from Phillipi to the apostle when he was a prisoner at Rome (<a href=\"#\" onClick=\"return mV('Phl',2,'25-30');\">Phl 2:25-30</a>; <a href=\"#\" onClick=\"return mV('Phl',4,'10-18');\">4:10-18</a>). Paul mentions him in words of esteem and affection. On his return to Philippi he was the bearer of Paul's letter to the church there.";
eastonArray["$$T0001221"] = "<strong>Ephah:</strong> gloom.<br><br>(1.) One of the five sons of Midian, and grandson of Abraham (<a href=\"#\" onClick=\"return mV('Gen',25,4);\">Gen 25:4</a>). The city of Ephah, to which he gave his name, is mentioned <a href=\"#\" onClick=\"return mV('Isa',60,6,7);\">Isa 60:6-7</a>. This city, with its surrounding territory, formed part of Midian, on the east shore of the Dead Sea. It abounded in dromedaries and camels (<a href=\"#\" onClick=\"return mV('Jdg',6,5);\">Jdg 6:5</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('1Ch',2,46);\">1Ch 2:46</a>, a concubine of Caleb.<br><br>(3.) <a href=\"#\" onClick=\"return mV('1Ch',2,47);\">1Ch 2:47</a>, a descendant of Judah.<br><br>Ephah, a word of Egyptian origin, meaning measure; a grain measure containing \"three seahs or ten omers,\" and equivalent to the bath for liquids (<a href=\"#\" onClick=\"return mV('Exd',16,36);\">Exd 16:36</a>; <a href=\"#\" onClick=\"return mV('1Sa',17,17);\">1Sa 17:17</a>; <a href=\"#\" onClick=\"return mV('Zec',5,6);\">Zec 5:6</a>). The double ephah in <a href=\"#\" onClick=\"return mV('Pro',20,10);\">Pro 20:10</a> (marg., \"an ephah and an ephah\"), <a href=\"#\" onClick=\"return mV('Deu',25,14);\">Deu 25:14</a>, means two ephahs, the one false and the other just.";
eastonArray["$$T0001222"] = "<strong>Epher:</strong> a calf.<br><br>(1.) One of the sons of Midian, who was Abraham's son by Keturah (<a href=\"#\" onClick=\"return mV('Gen',25,4);\">Gen 25:4</a>).<br><br>(2.) The head of one of the families of trans-Jordanic Manasseh who were carried captive by Tiglath-pileser (<a href=\"#\" onClick=\"return mV('1Ch',5,24);\">1Ch 5:24</a>).";
eastonArray["$$T0001223"] = "<strong>Ephes-dammim:</strong> boundary of blood, a place in the tribe of Judah where the Philistines encamped when David fought with Goliath (<a href=\"#\" onClick=\"return mV('1Sa',17,1);\">1Sa 17:1</a>). It was probably so called as having been the scene of frequent sanguinary conflicts between Israel and the Philistines. It is called Pas-dammim (<a href=\"#\" onClick=\"return mV('1Ch',11,13);\">1Ch 11:13</a>). It has been identified with the modern Beit Fased, i.e., \"house of bleeding\", near Shochoh (q.v.).";
eastonArray["$$T0001224"] = "<strong>Ephesians, Epistle to:</strong> was written by Paul at Rome about the same time as that to the Colossians, which in many points it resembles.<br><br>Contents of. The Epistle to the Colossians is mainly polemical, designed to refute certain theosophic errors that had crept into the church there. That to the Ephesians does not seem to have originated in any special circumstances, but is simply a letter springing from Paul's love to the church there, and indicative of his earnest desire that they should be fully instructed in the profound doctrines of the gospel. It contains<br><br>(1) the salutation (<a href=\"#\" onClick=\"return mV('Eph',1,1,2);\">Eph 1:1-2</a>);<br><br>(2) a general description of the blessings the gospel reveals, as to their source, means by which they are attained, purpose for which they are bestowed, and their final result, with a fervent prayer for the further spiritual enrichment of the Ephesians (<a href=\"#\" onClick=\"return mV('Eph',1,'3-');\">Eph 1:3</a>-<a href=\"#\" onClick=\"return mV('Eph',2,'1-10');\">2:10</a>);<br><br>(3) \"a record of that marked change in spiritual position which the Gentile believers now possessed, ending with an account of the writer's selection to and qualification for the apostolate of heathendom, a fact so considered as to keep them from being dispirited, and to lead him to pray for enlarged spiritual benefactions on his absent sympathizers\" (<a href=\"#\" onClick=\"return mV('Eph',2,'12-');\">Eph 2:12</a>-<a href=\"#\" onClick=\"return mV('Eph',3,'1-21');\">3:21</a>);<br><br>(4) a chapter on unity as undisturbed by diversity of gifts (<a href=\"#\" onClick=\"return mV('Eph',4,'1-16');\">Eph 4:1-16</a>);<br><br>(5) special injunctions bearing on ordinary life (<a href=\"#\" onClick=\"return mV('Eph',4,'17-');\">Eph 4:17</a>-<a href=\"#\" onClick=\"return mV('Eph',6,'1-10');\">6:10</a>);<br><br>(6) the imagery of a spiritual warfare, mission of Tychicus, and valedictory blessing (<a href=\"#\" onClick=\"return mV('Eph',6,'11-24');\">Eph 6:11-24</a>).<br><br>Planting of the church at Ephesus. Paul's first and hurried visit for the space of three months to Ephesus is recorded in <a href=\"#\" onClick=\"return mV('Act',18,'19-21');\">Act 18:19-21</a>. The work he began on this occasion was carried forward by Apollos (<a href=\"#\" onClick=\"return mV('Act',18,'24-26');\">24-26</a>) and Aquila and Priscilla. On his second visit, early in the following year, he remained at Ephesus \"three years,\" for he found it was the key to the western provinces of Asia Minor. Here \"a great door and effectual\" was opened to him (<a href=\"#\" onClick=\"return mV('1Cr',16,9);\">1Cr 16:9</a>), and the church was established and strengthened by his assiduous labours there (<a href=\"#\" onClick=\"return mV('Act',20,20,31);\">Act 20:20, 31</a>). From Ephesus as a centre the gospel spread abroad \"almost throughout all Asia\" (<a href=\"#\" onClick=\"return mV('Act',19,26);\">19:26</a>). The word \"mightily grew and prevailed\" despite all the opposition and persecution he encountered.<br><br>On his last journey to Jerusalem the apostle landed at Miletus, and summoning together the elders of the church from Ephesus, delivered to them his remarkable farewell charge (<a href=\"#\" onClick=\"return mV('Act',20,'18-35');\">Act 20:18-35</a>), expecting to see them no more.<br><br>The following parallels between this epistle and the Milesian charge may be traced:<br><br>(1.) <a href=\"#\" onClick=\"return mV('Act',20,19);\">Act 20:19</a> = <a href=\"#\" onClick=\"return mV('Eph',4,2);\">Eph 4:2</a>. The phrase \"lowliness of mind\" occurs nowhere else.<br><br>(2.) <a href=\"#\" onClick=\"return mV('Act',20,27);\">Act 20:27</a> = <a href=\"#\" onClick=\"return mV('Eph',1,11);\">Eph 1:11</a>. The word \"counsel,\" as denoting the divine plan, occurs only here and <a href=\"#\" onClick=\"return mV('Hbr',6,17);\">Hbr 6:17</a>.<br><br>(3.) <a href=\"#\" onClick=\"return mV('Act',20,32);\">Act 20:32</a> = <a href=\"#\" onClick=\"return mV('Eph',3,20);\">Eph 3:20</a>. The divine ability.<br><br>(4.) <a href=\"#\" onClick=\"return mV('Act',20,32);\">Act 20:32</a> = <a href=\"#\" onClick=\"return mV('Eph',2,20);\">Eph 2:20</a>. The building upon the foundation.<br><br>(5.) <a href=\"#\" onClick=\"return mV('Act',20,32);\">Act 20:32</a> = <a href=\"#\" onClick=\"return mV('Eph',1,14,18);\">Eph 1:14, 18</a>. \"The inheritance of the saints.\"<br><br>Place and date of the writing of the letter. It was evidently written from Rome during Paul's first imprisonment (<a href=\"#\" onClick=\"return mV('Eph',3,1);\">Eph 3:1</a>; <a href=\"#\" onClick=\"return mV('Eph',4,1);\">4:1</a>; <a href=\"#\" onClick=\"return mV('Eph',6,20);\">6:20</a>), and probably soon after his arrival there, about the year 62, four years after he had parted with the Ephesian elders at Miletus. The subscription of this epistle is correct.<br><br>There seems to have been no special occasion for the writing of this letter, as already noted. Paul's object was plainly not polemical. No errors had sprung up in the church which he sought to point out and refute. The object of the apostle is \"to set forth the ground, the cause, and the aim and end of the church of the faithful in Christ. He speaks to the Ephesians as a type or sample of the church universal.\" The church's foundations, its course, and its end, are his theme. \"Everywhere the foundation of the church is the will of the Father; the course of the church is by the satisfaction of the Son; the end of the church is the life in the Holy Spirit.\" In the Epistle to the Romans, Paul writes from the point of view of justification by the imputed righteousness of Christ; here he writes from the point of view specially of union to the Redeemer, and hence of the oneness of the true church of Christ. \"This is perhaps the profoundest book in existence.\" It is a book \"which sounds the lowest depths of Christian doctrine, and scales the loftiest heights of Christian experience;\" and the fact that the apostle evidently expected the Ephesians to understand it is an evidence of the \"proficiency which Paul's converts had attained under his preaching at Ephesus.\"<br><br>Relation between this epistle and that to the Colossians (q.v.). \"The letters of the apostle are the fervent outburst of pastoral zeal and attachment, written without reserve and in unaffected simplicity; sentiments come warm from the heart, without the shaping out, pruning, and punctilious arrangement of a formal discourse. There is such a fresh and familiar transcription of feeling, so frequent an introduction of coloquial idiom, and so much of conversational frankness and vivacity, that the reader associates the image of the writer with every paragraph, and the ear seems to catch and recognize the very tones of living address.\" \"Is it then any matter of amazement that one letter should resemble another, or that two written about the same time should have so much in common and so much that is peculiar? The close relation as to style and subject between the epistles to Colosse and Ephesus must strike every reader. Their precise relation to each other has given rise to much discussion. The great probability is that the epistle to Colosse was first written; the parallel passages in Ephesians, which amount to about forty-two in number, having the appearance of being expansions from the epistle to Colosse. Compare:<br><br><a href=\"#\" onClick=\"return mV('Eph',1,7);\">Eph 1:7</a>; <a href=\"#\" onClick=\"return mV('Col',1,14);\">Col 1:14</a>; <a href=\"#\" onClick=\"return mV('Eph',1,10);\">Eph 1:10</a>; <a href=\"#\" onClick=\"return mV('Col',1,20);\">Col 1:20</a>; <a href=\"#\" onClick=\"return mV('Eph',3,2);\">Eph 3:2</a>; <a href=\"#\" onClick=\"return mV('Col',1,25);\">Col 1:25</a>; <a href=\"#\" onClick=\"return mV('Eph',5,19);\">Eph 5:19</a>; <a href=\"#\" onClick=\"return mV('Col',3,16);\">Col 3:16</a>; <a href=\"#\" onClick=\"return mV('Eph',6,22);\">Eph 6:22</a>; <a href=\"#\" onClick=\"return mV('Col',4,8);\">Col 4:8</a>; <a href=\"#\" onClick=\"return mV('Eph',1,'19-');\">Eph 1:19</a>-<a href=\"#\" onClick=\"return mV('Eph',2,'1-5');\">2:5</a>; <a href=\"#\" onClick=\"return mV('Col',2,12,13);\">Col 2:12-13</a>; <a href=\"#\" onClick=\"return mV('Eph',4,'2-4');\">Eph 4:2-4</a>; <a href=\"#\" onClick=\"return mV('Col',3,'12-15');\">Col 3:12-15</a>; <a href=\"#\" onClick=\"return mV('Eph',4,16);\">Eph 4:16</a>; <a href=\"#\" onClick=\"return mV('Col',2,19);\">Col 2:19</a>; <a href=\"#\" onClick=\"return mV('Eph',4,32);\">Eph 4:32</a>; <a href=\"#\" onClick=\"return mV('Col',3,13);\">Col 3:13</a>; <a href=\"#\" onClick=\"return mV('Eph',4,'22-24');\">Eph 4:22-24</a>; <a href=\"#\" onClick=\"return mV('Col',3,9,10);\">Col 3:9-10</a>; <a href=\"#\" onClick=\"return mV('Eph',5,'6-8');\">Eph 5:6-8</a>; <a href=\"#\" onClick=\"return mV('Col',3,'6-8');\">Col 3:6-8</a>; <a href=\"#\" onClick=\"return mV('Eph',5,15,16);\">Eph 5:15-16</a>; <a href=\"#\" onClick=\"return mV('Col',4,5);\">Col 4:5</a>; <a href=\"#\" onClick=\"return mV('Eph',6,19,20);\">Eph 6:19-20</a>; <a href=\"#\" onClick=\"return mV('Col',4,3,4);\">Col 4:3-4</a> <a href=\"#\" onClick=\"return mV('Eph',5,'22-');\">Eph 5:22</a>-<a href=\"#\" onClick=\"return mV('Eph',6,'1-9');\">6:9</a>; <a href=\"#\" onClick=\"return mV('Col',3,'18-');\">Col 3:18</a>-<a href=\"#\" onClick=\"return mV('Col',4,1);\">4:1</a><br><br>\"The style of this epistle is exceedingly animated, and corresponds with the state of the apostle's mind at the time of writing. Overjoyed with the account which their messenger had brought him of their faith and holiness (<a href=\"#\" onClick=\"return mV('Eph',1,15);\">Eph 1:15</a>), and transported with the consideration of the unsearchable wisdom of God displayed in the work of man's redemption, and of his astonishing love towards the Gentiles in making them partakers through faith of all the benefits of Christ's death, he soars high in his sentiments on those grand subjects, and gives his thoughts utterance in sublime and copious expression.\"";
eastonArray["$$T0001225"] = "<strong>Ephesus:</strong> the capital of proconsular Asia, which was the western part of Asia Minor. It was colonized principally from Athens. In the time of the Romans it bore the title of \"the first and greatest metropolis of Asia.\" It was distinguished for the Temple of Diana (q.v.), who there had her chief shrine; and for its theatre, which was the largest in the world, capable of containing 50,000 spectators. It was, like all ancient theatres, open to the sky. Here were exhibited the fights of wild beasts and of men with beasts. (<a href=\"#\" onClick=\"return mV('1Cr',4,9);\">1Cr 4:9</a>; <a href=\"#\" onClick=\"return mV('1Cr',9,24,25);\">9:24-25</a>; <a href=\"#\" onClick=\"return mV('1Cr',15,32);\">15:32</a>.)<br><br>Many Jews took up their residence in this city, and here the seeds of the gospel were sown immediately after Pentecost (<a href=\"#\" onClick=\"return mV('Act',2,9);\">Act 2:9</a>; <a href=\"#\" onClick=\"return mV('Act',6,9);\">6:9</a>). At the close of his second missionary journey (about A.D. 51), when Paul was returning from Greece to Syria (<a href=\"#\" onClick=\"return mV('Act',18,'18-21');\">18:18-21</a>), he first visited this city. He remained, however, for only a short time, as he was hastening to keep the feast, probably of Pentecost, at Jerusalem; but he left Aquila and Priscilla behind him to carry on the work of spreading the gospel.<br><br>During his third missionary journey Paul reached Ephesus from the \"upper coasts\" (<a href=\"#\" onClick=\"return mV('Act',19,1);\">Act 19:1</a>), i.e., from the inland parts of Asia Minor, and tarried here for about three years; and so successful and abundant were his labours that \"all they which dwelt in Asia heard the word of the Lord Jesus, both Jews and Greeks\" (<a href=\"#\" onClick=\"return mV('Act',19,10);\">19:10</a>). Probably during this period the seven churches of the Apocalypse were founded, not by Paul's personal labours, but by missionaries whom he may have sent out from Ephesus, and by the influence of converts returning to their homes.<br><br>On his return from his journey, Paul touched at Miletus, some 30 miles south of Ephesus (<a href=\"#\" onClick=\"return mV('Act',20,15);\">Act 20:15</a>), and sending for the presbyters of Ephesus to meet him there, he delivered to them that touching farewell charge which is recorded in <a href=\"#\" onClick=\"return mV('Act',20,'18-35');\">Acts 20:18-35</a>. Ephesus is not again mentioned till near the close of Paul's life, when he writes to Timothy exhorting him to \"abide still at Ephesus\" (<a href=\"#\" onClick=\"return mV('1Ti',1,3);\">1Ti 1:3</a>).<br><br>Two of Paul's companions, Trophimus and Tychicus, were probably natives of Ephesus (<a href=\"#\" onClick=\"return mV('Act',20,4);\">Act 20:4</a>; <a href=\"#\" onClick=\"return mV('Act',21,29);\">21:29</a>; <a href=\"#\" onClick=\"return mV('2Ti',4,12);\">2Ti 4:12</a>). In his second epistle to Timothy, Paul speaks of Onesiphorus as having served him in many things at Ephesus (<a href=\"#\" onClick=\"return mV('2Ti',1,18);\">2Ti 1:18</a>). He also \"sent Tychicus to Ephesus\" (<a href=\"#\" onClick=\"return mV('2Ti',4,12);\">4:12</a>), probably to attend to the interests of the church there. Ephesus is twice mentioned in the Apocalypse (<a href=\"#\" onClick=\"return mV('2Ti',1,11);\">1:11</a>; <a href=\"#\" onClick=\"return mV('2Ti',2,1);\">2:1</a>).<br><br>The apostle John, according to tradition, spent many years in Ephesus, where he died and was buried.<br><br>A part of the site of this once famous city is now occupied by a small Turkish village, Ayasaluk, which is regarded as a corruption of the two Greek words, hagios theologos; i.e., \"the holy divine.\"";
eastonArray["$$T0001226"] = "<strong>Ephod:</strong> something girt, a sacred vestment worn originally by the high priest (<a href=\"#\" onClick=\"return mV('Exd',28,4);\">Exd 28:4</a>), afterwards by the ordinary priest (<a href=\"#\" onClick=\"return mV('1Sa',22,18);\">1Sa 22:18</a>), and characteristic of his office (<a href=\"#\" onClick=\"return mV('1Sa',2,18,28);\">1Sa 2:18, 28</a>; <a href=\"#\" onClick=\"return mV('1Sa',14,3);\">14:3</a>). It was worn by Samuel, and also by David (<a href=\"#\" onClick=\"return mV('2Sa',6,14);\">2Sa 6:14</a>). It was made of fine linen, and consisted of two pieces, which hung from the neck, and covered both the back and front, above the tunic and outer garment (<a href=\"#\" onClick=\"return mV('Exd',28,31);\">Exd 28:31</a>). That of the high priest was embroidered with divers colours. The two pieces were joined together over the shoulders (hence in Latin called superhumerale) by clasps or buckles of gold or precious stones, and fastened round the waist by a \"curious girdle of gold, blue, purple, and fine twined linen\" (<a href=\"#\" onClick=\"return mV('Exd',28,'6-12');\">28:6-12</a>).<br><br>The breastplate, with the Urim and Thummim, was attached to the ephod.";
eastonArray["$$T0001227"] = "<strong>Ephphatha:</strong> the Greek form of a Syro-Chaldaic or Aramaic word, meaning \"Be opened,\" uttered by Christ when healing the man who was deaf and dumb (<a href=\"#\" onClick=\"return mV('Mar',7,34);\">Mar 7:34</a>). It is one of the characteristics of Mark that he uses the very Aramaic words which fell from our Lord's lips. (See <a href=\"#\" onClick=\"return mV('Mar',3,17);\">Mar 3:17</a>; <a href=\"#\" onClick=\"return mV('Mar',5,41);\">5:41</a>; <a href=\"#\" onClick=\"return mV('Mar',7,11);\">7:11</a>; <a href=\"#\" onClick=\"return mV('Mar',14,36);\">14:36</a>; <a href=\"#\" onClick=\"return mV('Mar',15,34);\">15:34</a>.)";
eastonArray["$$T0001228"] = "<strong>Ephraim:</strong> double fruitfulness (\"for God had made him fruitful in the land of his affliction\"). The second son of Joseph, born in Egypt (<a href=\"#\" onClick=\"return mV('Gen',41,52);\">Gen 41:52</a>; <a href=\"#\" onClick=\"return mV('Gen',46,20);\">46:20</a>). The first incident recorded regarding him is his being placed, along with his brother Manasseh, before their grandfather, Jacob, that he might bless them (<a href=\"#\" onClick=\"return mV('Gen',48,10);\">Gen 48:10</a>; <a href=\"#\" onClick=\"return mV('Gen',27,1);\">Gen 27:1</a>). The intention of Joseph was that the right hand of the aged patriarch should be placed on the head of the elder of the two; but Jacob set Ephraim the younger before his brother, \"guiding his hands wittingly.\" Before Joseph's death, Ephraim's family had reached the third generation (<a href=\"#\" onClick=\"return mV('Gen',50,23);\">Gen 50:23</a>).";
eastonArray["$$T0001229"] = "<strong>Ephraim, Gate of:</strong> one of the gates of Jerusalem (<a href=\"#\" onClick=\"return mV('2Ki',14,13);\">2Ki 14:13</a>; <a href=\"#\" onClick=\"return mV('2Ch',25,23);\">2Ch 25:23</a>), on the side of the city looking toward Ephraim, the north side.";
eastonArray["$$T0001230"] = "<strong>Ephraim in the wilderness:</strong> (<a href=\"#\" onClick=\"return mV('Jhn',11,54);\">Jhn 11:54</a>), a town to which our Lord retired with his disciples after he had raised Lazarus, and when the priests were conspiring against him. It lay in the wild, uncultivated hill-country to the north-east of Jerusalem, betwen the central towns and the Jordan valley.";
eastonArray["$$T0001231"] = "<strong>Ephraim, Mount:</strong> the central mountainous district of Palestine occupied by the tribe of Ephraim (<a href=\"#\" onClick=\"return mV('Jos',17,15);\">Jos 17:15</a>; <a href=\"#\" onClick=\"return mV('Jos',19,50);\">19:50</a>; <a href=\"#\" onClick=\"return mV('Jos',20,7);\">20:7</a>), extending from Bethel to the plain of Jezreel. In Joshua's time (<a href=\"#\" onClick=\"return mV('Jos',17,18);\">Jos 17:18</a>) these hills were densely wooded. They were intersected by well-watered, fertile valleys, referred to in <a href=\"#\" onClick=\"return mV('Jer',50,19);\">Jer 50:19</a>. Joshua was buried at Timnath-heres among the mountains of Ephraim, on the north side of the hill of Gaash (<a href=\"#\" onClick=\"return mV('Jdg',2,9);\">Jdg 2:9</a>). This region is also called the \"mountains of Israel\" (<a href=\"#\" onClick=\"return mV('Jos',11,21);\">Jos 11:21</a>) and the \"mountains of Samaria\" (<a href=\"#\" onClick=\"return mV('Jer',31,5);\">Jer 31:5</a>, 6: Amos 3:9).";
eastonArray["$$T0001232"] = "<strong>Ephraim, The tribe of:</strong> took precedence over that of Manasseh by virtue of Jacob's blessing (<a href=\"#\" onClick=\"return mV('Gen',41,52);\">Gen 41:52</a>; <a href=\"#\" onClick=\"return mV('Gen',48,1);\">48:1</a>). The descendants of Joseph formed two of the tribes of Israel, whereas each of the other sons of Jacob was the founder of only one tribe. Thus there were in reality thirteen tribes; but the number twelve was preserved by excluding that of Levi when Ephraim and Manasseh are mentioned separately (<a href=\"#\" onClick=\"return mV('Num',1,'32-34');\">Num 1:32-34</a>; <a href=\"#\" onClick=\"return mV('Jos',17,14,17);\">Jos 17:14, 17</a>; <a href=\"#\" onClick=\"return mV('1Ch',7,20);\">1Ch 7:20</a>).<br><br>Territory of. At the time of the first census in the wilderness this tribe numbered 40,500 (<a href=\"#\" onClick=\"return mV('Num',1,32,33);\">Num 1:32-33</a>); forty years later, when about to take possession of the Promised Land, it numbered only 32,500. During the march (see <a href=\"#\" onClick=\"return doDictLookup('ET0000700');\">CAMP</a>) Ephraim's place was on the west side of the tabernacle (<a href=\"#\" onClick=\"return mV('Num',2,'18-24');\">Num 2:18-24</a>). When the spies were sent out to spy the land, \"Oshea the son of Nun\" of this tribe signalized himself.<br><br>The boundaries of the portion of the land assigned to Ephraim are given in <a href=\"#\" onClick=\"return mV('Jos',16,'1-10');\">Jos 16:1-10</a>. It included most of what was afterwards called Samaria as distinguished from Judea and Galilee. It thus lay in the centre of all traffic, from north to south, and from Jordan to the sea, and was about 55 miles long and 30 broad. The tabernacle and the ark were deposited within its limits at Shiloh, where it remained for four hundred years. During the time of the judges and the first stage of the monarchy this tribe manifested a domineering and haughty and discontented spirit. \"For more than five hundred years, a period equal to that which elapsed between the Norman Conquest and the War of the Roses, Ephraim, with its two dependent tribes of Manasseh and Benjamin, exercised undisputed pre-eminence. Joshua the first conqueror, Gideon the greatest of the judges, and Saul the first king, belonged to one or other of the three tribes. It was not till the close of the first period of Jewish history that God 'refused the tabernacle of Joseph, and chose not the tribe of Ephraim, but chose the tribe of Judah, the Mount Zion which he loved' (<a href=\"#\" onClick=\"return mV('Psa',78,67,68);\">Psa 78:67-68</a>). When the ark was removed from Shiloh to Zion the power of Ephraim was humbled.\"<br><br>Among the causes which operated to bring about the disruption of Israel was Ephraim's jealousy of the growing power of Judah. From the settlement of Canaan till the time of David and Solomon, Ephraim had held the place of honour among the tribes. It occupied the central and fairest portions of the land, and had Shiloh and Shechem within its borders. But now when Jerusalem became the capital of the kingdom, and the centre of power and worship for the whole nation of Israel, Ephraim declined in influence. The discontent came to a crisis by Rehoboam's refusal to grant certain redresses that were demanded (<a href=\"#\" onClick=\"return mV('1Ki',12,'1-')\">1Ki 12</a>).";
eastonArray["$$T0001233"] = "<strong>Ephraim, Wood of:</strong> a forest in which a fatal battle was fought between the army of David and that of Absalom, who was killed there (<a href=\"#\" onClick=\"return mV('2Sa',18,6,8);\">2Sa 18:6, 8</a>). It lay on the east of Jordan, not far from Mahanaim, and was some part of the great forest of Gilead.";
eastonArray["$$T0001234"] = "<strong>Ephratah:</strong> fruitful.<br><br>(1.) The second wife of Caleb, the son of Hezron, mother of Hur, and grandmother of Caleb, who was one of those that were sent to spy the land (<a href=\"#\" onClick=\"return mV('1Ch',2,19,50);\">1Ch 2:19, 50</a>).<br><br>(2.) The ancient name of Bethlehem in Judah (<a href=\"#\" onClick=\"return mV('Gen',35,16,19);\">Gen 35:16, 19</a>; <a href=\"#\" onClick=\"return mV('Gen',48,7);\">48:7</a>). In <a href=\"#\" onClick=\"return mV('Rth',1,2);\">Rth 1:2</a> it is called \"Bethlehem-Judah,\" but the inhabitants are called \"Ephrathites;\" in <a href=\"#\" onClick=\"return mV('Mic',5,2);\">Mic 5:2</a>, \"Bethlehem-Ephratah;\" in <a href=\"#\" onClick=\"return mV('Mat',2,6);\">Mat 2:6</a>, \"Bethlehem in the land of Judah.\" In <a href=\"#\" onClick=\"return mV('Psa',132,6);\">Psa 132:6</a> it is mentioned as the place where David spent his youth, and where he heard much of the ark, although he never saw it till he found it long afterwards at Kirjath-jearim; i.e., the \"city of the wood,\" or the \"forest-town\" (<a href=\"#\" onClick=\"return mV('1Sa',7,1);\">1Sa 7:1</a>; <a href=\"#\" onClick=\"return mV('2Sa',6,3,4);\">2Sa 6:3-4</a>).";
eastonArray["$$T0001235"] = "<strong>Ephrathite:</strong> a citizen of Ephratah, the old name of Bethlehem (<a href=\"#\" onClick=\"return mV('Rth',1,2);\">Rth 1:2</a>; <a href=\"#\" onClick=\"return mV('1Sa',17,12);\">1Sa 17:12</a>), or Bethlehem-Judah.";
eastonArray["$$T0001236"] = "<strong>Ephron:</strong> fawn-like.<br><br>(1.) The son of Zohar a Hittite, the owner of the field and cave of Machpelah (q.v.), which Abraham bought for 400 shekels of silver (<a href=\"#\" onClick=\"return mV('Gen',23,'8-17');\">Gen 23:8-17</a>; <a href=\"#\" onClick=\"return mV('Gen',25,9);\">25:9</a>; <a href=\"#\" onClick=\"return mV('Gen',49,29,30);\">49:29-30</a>).<br><br>(2.) A mountain range which formed one of the landmarks on the north boundary of the tribe of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,9);\">Jos 15:9</a>), probably the range on the west side of the Wady Beit-Hanina.";
eastonArray["$$T0001237"] = "<strong>Epicureans:</strong> followers of Epicurus (who died at Athens B.C. 270), or adherents of the Epicurean philosophy (<a href=\"#\" onClick=\"return mV('Act',17,18);\">Act 17:18</a>). This philosophy was a system of atheism, and taught men to seek as their highest aim a pleasant and smooth life. They have been called the \"Sadducees\" of Greek paganism. They, with the Stoics, ridiculed the teaching of Paul (<a href=\"#\" onClick=\"return mV('Act',17,18);\">Act 17:18</a>). They appear to have been greatly esteemed at Athens.";
eastonArray["$$T0001238"] = "<strong>Epistles:</strong> the apostolic letters. The New Testament contains twenty-one in all. They are divided into two classes.<br><br>(1.) Paul's Epistles, fourteen in number, including Hebrews. These are not arranged in the New Testament in the order of time as to their composition, but rather according to the rank of the cities or places to which they were sent. Who arranged them after this manner is unknown. Paul's letters were, as a rule, dictated to an amanuensis, a fact which accounts for some of their peculiarities. He authenticated them, however, by adding a few words in his own hand at the close. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001413');\">GALATIANS, EPISTLE TO</a>.)<br><br>The epistles to Timothy and Titus are styled the Pastoral Epistles.<br><br>(2.) The Catholic or General Epistles, so called because they are not addressed to any particular church or city or individual, but to Christians in general, or to Christians in several countries. Of these, three are written by John, two by Peter, and one each by James and Jude.<br><br>It is an interesting and instructive fact that a large portion of the New Testament is taken up with epistles. The doctrines of Christianity are thus not set forth in any formal treatise, but mainly in a collection of letters. \"Christianity was the first great missionary religion. It was the first to break the bonds of race and aim at embracing all mankind. But this necessarily involved a change in the mode in which it was presented. The prophet of the Old Testament, if he had anything to communicate, either appeared in person or sent messengers to speak for him by word of mouth. The narrow limits of Palestine made direct personal communication easy. But the case was different when the Christian Church came to consist of a number of scattered parts, stretching from Mesopotamia in the east to Rome or even Spain in the far west. It was only natural that the apostle by whom the greater number of these communities had been founded should seek to communicate with them by letter.\"";
eastonArray["$$T0001239"] = "<strong>Erastus:</strong> beloved.<br><br>(1.) The \"chamberlain\" of the city of Corinth (<a href=\"#\" onClick=\"return mV('Rom',16,23);\">Rom 16:23</a>), and one of Paul's disciples. As treasurer of such a city he was a public officer of great dignity, and his conversion to the gospel was accordingly a proof of the wonderful success of the apostle's labours.<br><br>(2.) A companion of Paul at Ephesus, who was sent by him along with Timothy into Macedonia (<a href=\"#\" onClick=\"return mV('Act',19,22);\">Act 19:22</a>). Corinth was his usual place of abode (<a href=\"#\" onClick=\"return mV('2Ti',4,20);\">2Ti 4:20</a>); but probably he may have been the same as the preceding.";
eastonArray["$$T0001240"] = "<strong>Erech:</strong> (LXX., \"Orech\"), length, or Moon-town, one of the cities of Nimrod's kingdom in the plain of Shinar (<a href=\"#\" onClick=\"return mV('Gen',10,10);\">Gen 10:10</a>); the Orchoe of the Greeks and Romans. It was probably the city of the Archevites, who were transplanted to Samaria by Asnapper (<a href=\"#\" onClick=\"return mV('Ezr',4,9);\">Ezr 4:9</a>). It lay on the left bank of the Euphrates, about 120 miles south-east of Babylon, and is now represented by the mounds and ruins of Warka. It appears to have been the necropolis of the Assyrian kings, as the whole region is strewed with bricks and the remains of coffins. \"Standing on the summit of the principal edifice, called the Buwarizza, a tower 200 feet square in the centre of the ruins, the beholder is struck with astonishment at the enormous accumulation of mounds and ancient relics at his feet. An irregular circle, nearly 6 miles in circumference, is defined by the traces of an earthen rampart, in some places 40 feet high.\"";
eastonArray["$$T0001241"] = "<strong>Esaias:</strong> the Greek form for Isaiah, constantly used in the Authorized Version of the New Testament (<a href=\"#\" onClick=\"return mV('Mat',3,3);\">Mat 3:3</a>; <a href=\"#\" onClick=\"return mV('Mat',4,14);\">4:14</a>), but in the Revised Version always \"Isaiah.\"";
eastonArray["$$T0001242"] = "<strong>Esarhaddon:</strong> Assur has given a brother, successor of Sennacherib (<a href=\"#\" onClick=\"return mV('2Ki',19,37);\">2Ki 19:37</a>; <a href=\"#\" onClick=\"return mV('Isa',37,38);\">Isa 37:38</a>). He ascended the throne about B.C. 681. Nothing further is recorded of him in Scripture, except that he settled certain colonists in Samaria (<a href=\"#\" onClick=\"return mV('Ezr',4,2);\">Ezr 4:2</a>). But from the monuments it appears that he was the most powerful of all the Assyrian monarchs. He built many temples and palaces, the most magnificent of which was the south-west palace at Nimrud, which is said to have been in its general design almost the same as Solomon's palace, only much larger (<a href=\"#\" onClick=\"return mV('1Ki',7,'1-12');\">1Ki 7:1-12</a>).<br><br>In December B.C. 681 Sennacherib was murdered by two of his sons, who, after holding Nineveh for forty-two days, were compelled to fly to Erimenas of Ararat, or Armenia. Their brother Esarhaddon, who had been engaged in a campaign against Armenia, led his army against them. They were utterly overthrown in a battle fought April B.C. 680, near Malatiyeh, and in the following month Esarhaddon was crowned at Nineveh. He restored Babylon, conquered Egypt, and received tribute from Manasseh of Judah. He died in October B.C. 668, while on the march to suppress an Egyptian revolt, and was succeeded by his son Assur-bani-pal, whose younger brother was made viceroy of Babylonia.";
eastonArray["$$T0001243"] = "<strong>Esau:</strong> hairy, Rebekah's first-born twin son (<a href=\"#\" onClick=\"return mV('Gen',25,25);\">Gen 25:25</a>). The name of Edom, \"red\", was also given to him from his conduct in connection with the red lentil \"pottage\" for which he sold his birthright (<a href=\"#\" onClick=\"return mV('Gen',25,30,31);\">30-31</a>). The circumstances connected with his birth foreshadowed the enmity which afterwards subsisted between the twin brothers and the nations they founded (<a href=\"#\" onClick=\"return mV('Gen',25,22,23,26);\">25:22-23, 26</a>). In process of time Jacob, following his natural bent, became a shepherd; while Esau, a \"son of the desert,\" devoted himself to the perilous and toilsome life of a huntsman. On a certain occasion, on returning from the chase, urged by the cravings of hunger, Esau sold his birthright to his brother, Jacob, who thereby obtained the covenant blessing (<a href=\"#\" onClick=\"return mV('Gen',27,2829,36);\">Gen 27:28-29' 36</a>; <a href=\"#\" onClick=\"return mV('Hbr',12,16,17);\">Hbr 12:16-17</a>). He afterwards tried to regain what he had so recklessly parted with, but was defeated in his attempts through the stealth of his brother (<a href=\"#\" onClick=\"return mV('Gen',27,4,34,38);\">Gen 27:4, 34, 38</a>).<br><br>At the age of forty years, to the great grief of his parents, he married (<a href=\"#\" onClick=\"return mV('Gen',26,34,35);\">Gen 26:34-35</a>) two Canaanitish maidens, Judith, the daughter of Beeri, and Bashemath, the daughter of Elon. When Jacob was sent away to Padan-aram, Esau tried to conciliate his parents (<a href=\"#\" onClick=\"return mV('Gen',28,8,9);\">Gen 28:8-9</a>) by marrying his cousin Mahalath, the daughter of Ishmael. This led him to cast in his lot with the Ishmaelite tribes; and driving the Horites out of Mount Seir, he settled in that region. After some thirty years' sojourn in Padan-aram Jacob returned to Canaan, and was reconciled to Esau, who went forth to meet him (<a href=\"#\" onClick=\"return mV('Gen',33,4);\">33:4</a>). Twenty years after this, Isaac their father died, when the two brothers met, probably for the last time, beside his grave (<a href=\"#\" onClick=\"return mV('Gen',35,29);\">35:29</a>). Esau now permanently left Canaan, and established himself as a powerful and wealthy chief in the land of Edom (q.v.).<br><br>Long after this, when the descendants of Jacob came out of Egypt, the Edomites remembered the old quarrel between the brothers, and with fierce hatred they warred against Israel.";
eastonArray["$$T0001244"] = "<strong>Eschew:</strong> from old French eschever, \"to flee from\" (<a href=\"#\" onClick=\"return mV('Job',1,1,8);\">Job 1:1, 8</a>; <a href=\"#\" onClick=\"return mV('Job',2,3);\">2:3</a>; <a href=\"#\" onClick=\"return mV('1Pe',3,11);\">1Pe 3:11</a>).";
eastonArray["$$T0001245"] = "<strong>Esdraelon:</strong> the Greek form of the Hebrew \"Jezreel,\" the name of the great plain (called by the natives Merj Ibn Amer; i.e., \"the meadow of the son of Amer\") which stretches across Central Palestine from the Jordan to the Mediterraanean, separating the mountain ranges of Carmel and Samaria from those of Galilee, extending about 14 miles from north to south, and 9 miles from east to west. It is drained by \"that ancient river\" the Kishon, which flows westward to the Mediterranean. From the foot of Mount Tabor it branches out into three valleys, that on the north passing between Tabor and Little Hermon (<a href=\"#\" onClick=\"return mV('Jdg',4,14);\">Jdg 4:14</a>); that on the south between Mount Gilboa and En-gannim (<a href=\"#\" onClick=\"return mV('2Ki',9,27);\">2Ki 9:27</a>); while the central portion, the \"valley of Jezreel\" proper, runs into the Jordan valley (which is about 1,000 feet lower than Esdraelon) by Bethshean. Here Gideon gained his great victory over the Midianites (<a href=\"#\" onClick=\"return mV('Jdg',7,'1-25');\">Jdg 7:1-25</a>). Here also Barak defeated Sisera, and Saul's army was defeated by the Philistines, and king Josiah, while fighting in disguise against Necho, king of Egypt, was slain (<a href=\"#\" onClick=\"return mV('2Ch',35,'20-27');\">2Ch 35:20-27</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,'1-');\">2 Kings 23-29</a>). This plain has been well called the \"battle-field of Palestine.\" \"It has been a chosen place for encampment in every contest carried on in this country, from the days of Nebuchadnezzar, king of the Assyrians, in the history of whose wars with Arphaxad it is mentioned as the Great Plain of Esdraelon, until the disastrous march of Napoleon Bonaparte from Egypt into Syria. Jews, Gentiles, Saracens, Crusaders, Frenchmen, Egyptians, Persians, Druses, Turks, and Arabs, warriors out of every nation which is under heaven, have pitched their tents in the plain, and have beheld the various banners of their nations wet with the dews of Tabor and Hermon\" (Dr. Clark).";
eastonArray["$$T0001246"] = "<strong>Esek:</strong> quarrel, a well which Isaac's herdsmen dug in the valley of Gerar, and so called because the herdsmen of Gerar quarrelled with them for its possession (<a href=\"#\" onClick=\"return mV('Gen',26,20);\">Gen 26:20</a>).";
eastonArray["$$T0001247"] = "<strong>Eshbaal:</strong> man of Baal, the fourth son of king Saul (<a href=\"#\" onClick=\"return mV('1Ch',8,33);\">1Ch 8:33</a>; <a href=\"#\" onClick=\"return mV('1Ch',9,39);\">9:39</a>). He is also called Ish-bosheth (q.v.), <a href=\"#\" onClick=\"return mV('2Sa',2,8);\">2Sa 2:8</a>.";
eastonArray["$$T0001248"] = "<strong>Eshcol:</strong> bunch; brave.<br><br>(1.) A young Amoritish chief who joined Abraham in the recovery of Lot from the hands of Chedorlaomer (<a href=\"#\" onClick=\"return mV('Gen',14,13,24);\">Gen 14:13, 24</a>).<br><br>(2.) A valley in which the spies obtained a fine cluster of grapes (<a href=\"#\" onClick=\"return mV('Num',13,23,24);\">Num 13:23-24</a>; \"the brook Eshcol,\" A.V.; \"the valley of Eshcol,\" R.V.), which they took back with them to the camp of Israel as a specimen of the fruits of the Promised Land. On their way back they explored the route which led into the south (the Negeb) by the western edge of the mountains at Telilat el-'Anab, i.e., \"grape-mounds\", near Beersheba. \"In one of these extensive valleys, perhaps in Wady Hanein, where miles of grape-mounds even now meet the eye, they cut the gigantic clusters of grapes, and gathered the pomegranates and figs, to show how goodly was the land which the Lord had promised for their inheritance.\", Palmer's Desert of the Exodus.";
eastonArray["$$T0001249"] = "<strong>Eshean:</strong> a place in the mountains of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,52);\">Jos 15:52</a>), supposed to be the ruin es-Simia, near Dumah, south of Hebron.";
