<script>var eastonArray = new Array ();
eastonArray["$$T0002300"] = "<strong>Lions:</strong> the most powerful of all carnivorous animals. Although not now found in Palestine, they must have been in ancient times very numerous there. They had their lairs in the forests (<a href=\"#\" onClick=\"return mV('Jer',5,6);\">Jer 5:6</a>; <a href=\"#\" onClick=\"return mV('Jer',12,8);\">12:8</a>; <a href=\"#\" onClick=\"return mV('Amo',3,4);\">Amo 3:4</a>), in the caves of the mountains (<a href=\"#\" onClick=\"return mV('Sgs',4,8);\">Sgs 4:8</a>; <a href=\"#\" onClick=\"return mV('Nah',2,12);\">Nah 2:12</a>), and in the canebrakes on the banks of the Jordan (<a href=\"#\" onClick=\"return mV('Jer',49,19);\">Jer 49:19</a>; <a href=\"#\" onClick=\"return mV('Jer',50,44);\">50:44</a>; <a href=\"#\" onClick=\"return mV('Zec',11,3);\">Zec 11:3</a>).<br><br>No fewer than at least six different words are used in the Old Testament for the lion.<br><br>(1.) <i>Gor</i> (i.e., a \"suckling\"), the lion's whelp (<a href=\"#\" onClick=\"return mV('Gen',49,9);\">Gen 49:9</a>; <a href=\"#\" onClick=\"return mV('Jer',51,38);\">Jer 51:38</a>, etc.).<br><br>(2.) <i>Kephir</i> (i.e., \"shaggy\"), the young lion (<a href=\"#\" onClick=\"return mV('Jdg',14,5);\">Jdg 14:5</a>; <a href=\"#\" onClick=\"return mV('Job',4,10);\">Job 4:10</a>; <a href=\"#\" onClick=\"return mV('Psa',91,13);\">Psa 91:13</a>; <a href=\"#\" onClick=\"return mV('Psa',104,21);\">104:21</a>), a term which is also used figuratively of cruel enemies (<a href=\"#\" onClick=\"return mV('Psa',34,10);\">Psa 34:10</a>; <a href=\"#\" onClick=\"return mV('Psa',35,17);\">35:17</a>; <a href=\"#\" onClick=\"return mV('Psa',58,6);\">58:6</a>; <a href=\"#\" onClick=\"return mV('Jer',2,15);\">Jer 2:15</a>).<br><br>(3.) <i>'Ari</i> (i.e., the \"puller\" in pieces), denoting the lion in general, without reference to age or sex (<a href=\"#\" onClick=\"return mV('Num',23,24);\">Num 23:24</a>; <a href=\"#\" onClick=\"return mV('2Sa',17,10);\">2Sa 17:10</a>, etc.).<br><br>(4.) <i>Shahal</i> (the \"roarer\"), the mature lion (<a href=\"#\" onClick=\"return mV('Job',4,10);\">Job 4:10</a>; <a href=\"#\" onClick=\"return mV('Psa',91,13);\">Psa 91:13</a>; <a href=\"#\" onClick=\"return mV('Pro',26,13);\">Pro 26:13</a>; <a href=\"#\" onClick=\"return mV('Hsa',5,14);\">Hsa 5:14</a>).<br><br>(5.) <i>Laish</i>, so called from its strength and bravery (<a href=\"#\" onClick=\"return mV('Job',4,11);\">Job 4:11</a>; <a href=\"#\" onClick=\"return mV('Pro',30,30);\">Pro 30:30</a>; <a href=\"#\" onClick=\"return mV('Isa',30,6);\">Isa 30:6</a>). The capital of Northern Dan received its name from this word.<br><br>(6.) <i>Labi</i>, from a root meaning \"to roar,\" a grown lion or lioness (<a href=\"#\" onClick=\"return mV('Gen',49,9);\">Gen 49:9</a>; <a href=\"#\" onClick=\"return mV('Num',23,24);\">Num 23:24</a>; <a href=\"#\" onClick=\"return mV('Num',24,9);\">24:9</a>; <a href=\"#\" onClick=\"return mV('Eze',19,2);\">Eze 19:2</a>; <a href=\"#\" onClick=\"return mV('Nah',2,11);\">Nah 2:11</a>).<br><br>The lion of Palestine was properly of the Asiatic variety, distinguished from the African variety, which is larger. Yet it not only attacked flocks in the presence of the shepherd, but also laid waste towns and villages (<a href=\"#\" onClick=\"return mV('2Ki',17,25,26);\">2Ki 17:25-26</a>) and devoured men (<a href=\"#\" onClick=\"return mV('1Ki',13,24,25);\">1Ki 13:24-25</a>). Shepherds sometimes, single-handed, encountered lions and slew them (<a href=\"#\" onClick=\"return mV('1Sa',17,34,35);\">1Sa 17:34-35</a>; <a href=\"#\" onClick=\"return mV('Amo',3,12);\">Amo 3:12</a>). Samson seized a young lion with his hands and \"rent him as he would have rent a kid\" (<a href=\"#\" onClick=\"return mV('Jdg',14,5,6);\">Jdg 14:5-6</a>). The strength (<a href=\"#\" onClick=\"return mV('Jdg',14,18);\">Jdg 14:18</a>), courage (<a href=\"#\" onClick=\"return mV('2Sa',17,10);\">2Sa 17:10</a>), and ferocity (<a href=\"#\" onClick=\"return mV('Gen',49,9);\">Gen 49:9</a>) of the lion were proverbial.";
eastonArray["$$T0002301"] = "<strong>Lip:</strong> besides its literal sense (<a href=\"#\" onClick=\"return mV('Isa',37,29);\">Isa 37:29</a>, etc.), is used in the original (saphah) metaphorically for an edge or border, as of a cup (<a href=\"#\" onClick=\"return mV('1Ki',7,26);\">1Ki 7:26</a>), a garment (<a href=\"#\" onClick=\"return mV('Exd',28,32);\">Exd 28:32</a>), a curtain (<a href=\"#\" onClick=\"return mV('Exd',26,4);\">26:4</a>), the sea (<a href=\"#\" onClick=\"return mV('Gen',22,17);\">Gen 22:17</a>), the Jordan (<a href=\"#\" onClick=\"return mV('2Ki',2,13);\">2Ki 2:13</a>). To \"open the lips\" is to begin to speak (<a href=\"#\" onClick=\"return mV('Job',11,5);\">Job 11:5</a>); to \"refrain the lips\" is to keep silence (<a href=\"#\" onClick=\"return mV('Psa',40,9);\">Psa 40:9</a>; <a href=\"#\" onClick=\"return mV('1Pe',3,10);\">1Pe 3:10</a>). The \"fruit of the lips\" (<a href=\"#\" onClick=\"return mV('Hbr',13,15);\">Hbr 13:15</a>) is praise, and the \"calves of the lips\" thank-offerings (<a href=\"#\" onClick=\"return mV('Hsa',14,2);\">Hsa 14:2</a>). To \"shoot out the lip\" is to manifest scorn and defiance (<a href=\"#\" onClick=\"return mV('Psa',22,7);\">Psa 22:7</a>). Many similar forms of expression are found in Scripture.";
eastonArray["$$T0002302"] = "<strong>Litter:</strong> (Heb. tsab, as being lightly and gently borne), a sedan or palanquin for the conveyance of persons of rank (<a href=\"#\" onClick=\"return mV('Isa',66,20);\">Isa 66:20</a>). In <a href=\"#\" onClick=\"return mV('Num',7,3);\">Num 7:3</a>, the words \"covered wagons\" are more literally \"carts of the litter kind.\" There they denote large and commodious vehicles drawn by oxen, and fitted for transporting the furniture of the temple.";
eastonArray["$$T0002303"] = "<strong>Liver:</strong> (Heb. kabhed, \"heavy; <a href=\"#\" onClick=\"return mV('Exd',29,13,22);\">Exd 29:13, 22</a>; <a href=\"#\" onClick=\"return mV('Lev',3,4,10,15);\">Lev 3:4, 10, 15</a>) was burnt upon the altar, and not used as sacrificial food. In <a href=\"#\" onClick=\"return mV('Eze',21,21);\">Eze 21:21</a> there is allusion, in the statement that the king of Babylon \"looked upon the liver,\" to one of the most ancient of all modes of divination. The first recorded instance of divination (q.v.) is that of the teraphim of Laban. By the teraphim the LXX. and Josephus understood \"the liver of goats.\" By the \"caul above the liver,\" in <a href=\"#\" onClick=\"return mV('Lev',4,9);\">Lev 4:9</a>; <a href=\"#\" onClick=\"return mV('Lev',7,4);\">7:4</a>, etc., some understand the great lobe of the liver itself.";
eastonArray["$$T0002304"] = "<strong>Living creatures:</strong> as represented by Ezekiel (<a href=\"#\" onClick=\"return mV('Eze',1,'1-');\">Eze 1-10</a>) and John (<a href=\"#\" onClick=\"return mV('Rev',4,'1-');\">Rev. 4</a>, etc.), are the cherubim. They are distinguished from angels (<a href=\"#\" onClick=\"return mV('Rev',15,7);\">Rev 15:7</a>); they join the elders in the \"new song\" (<a href=\"#\" onClick=\"return mV('Rev',5,8,9);\">5:8-9</a>); they warn of danger from divine justice (<a href=\"#\" onClick=\"return mV('Isa',6,'3-5');\">Isa 6:3-5</a>), and deliver the commission to those who execute it (<a href=\"#\" onClick=\"return mV('Eze',10,2,7);\">Eze 10:2, 7</a>); they associate with the elders in their sympathy with the hundred and forty-four thousand who sing the new song (<a href=\"#\" onClick=\"return mV('Rev',14,3);\">Rev 14:3</a>), and with the Church in the overthrow of her enemies (<a href=\"#\" onClick=\"return mV('Rev',19,4);\">19:4</a>).<br><br>They are supposed to represent mercy, as distinguished from justice, mercy in its various instrumentalities, and especially as connected with the throne of God, the \"throne of grace.\"";
eastonArray["$$T0002305"] = "<strong>Lizard:</strong> Only in <a href=\"#\" onClick=\"return mV('Lev',11,30);\">Lev 11:30</a>, as rendering of Hebrew <i>letaah</i>, so called from its \"hiding.\" Supposed to be the Lacerta gecko or fan-foot lizard, from the toes of which poison exudes. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000764');\">CHAMELEON</a>.)";
eastonArray["$$T0002306"] = "<strong>Lo-ammi:</strong> not my people, a symbolical name given by God's command to Hosea's second son in token of Jehovah's rejection of his people (<a href=\"#\" onClick=\"return mV('Hsa',1,9,10);\">Hsa 1:9-10</a>), his treatment of them as a foreign people. This Hebrew word is rendered by \"not my people\" in ver. <a href=\"#\" onClick=\"return mV('Hsa',1,10);\">10</a>; <a href=\"#\" onClick=\"return mV('Hsa',2,23);\">2:23</a>.";
eastonArray["$$T0002307"] = "<strong>Loan:</strong> The Mosaic law required that when an Israelite needed to borrow, what he asked was to be freely lent to him, and no interest was to be charged, although interest might be taken of a foreigner (<a href=\"#\" onClick=\"return mV('Exd',22,25);\">Exd 22:25</a>; <a href=\"#\" onClick=\"return mV('Deu',23,19,20);\">Deu 23:19-20</a>; <a href=\"#\" onClick=\"return mV('Lev',25,'35-38');\">Lev 25:35-38</a>). At the end of seven years all debts were remitted. Of a foreigner the loan might, however, be exacted. At a later period of the Hebrew commonwealth, when commerce increased, the practice of exacting usury or interest on loans, and of suretiship in the commercial sense, grew up. Yet the exaction of it from a Hebrew was regarded as discreditable (<a href=\"#\" onClick=\"return mV('Psa',15,5);\">Psa 15:5</a>; <a href=\"#\" onClick=\"return mV('Pro',6,1,4);\">Pro 6:1, 4</a>; <a href=\"#\" onClick=\"return mV('Pro',11,15);\">11:15</a>; <a href=\"#\" onClick=\"return mV('Pro',17,18);\">17:18</a>; <a href=\"#\" onClick=\"return mV('Pro',20,16);\">20:16</a>; <a href=\"#\" onClick=\"return mV('Pro',27,13);\">27:13</a>; <a href=\"#\" onClick=\"return mV('Jer',15,10);\">Jer 15:10</a>).<br><br>Limitations are prescribed by the law to the taking of a pledge from the borrower. The outer garment in which a man slept at night, if taken in pledge, was to be returned before sunset (<a href=\"#\" onClick=\"return mV('Exd',22,26,27);\">Exd 22:26-27</a>; <a href=\"#\" onClick=\"return mV('Deu',24,12,13);\">Deu 24:12-13</a>). A widow's garment (<a href=\"#\" onClick=\"return mV('Deu',24,17);\">Deu 24:17</a>) and a millstone (<a href=\"#\" onClick=\"return mV('Deu',24,6);\">6</a>) could not be taken. A creditor could not enter the house to reclaim a pledge, but must remain outside till the borrower brought it (<a href=\"#\" onClick=\"return mV('Deu',24,10,11);\">10-11</a>). The Hebrew debtor could not be retained in bondage longer than the seventh year, or at farthest the year of jubilee (<a href=\"#\" onClick=\"return mV('Exd',21,2);\">Exd 21:2</a>; <a href=\"#\" onClick=\"return mV('Lev',25,39,42);\">Lev 25:39, 42</a>), but foreign sojourners were to be \"bondmen for ever\" (<a href=\"#\" onClick=\"return mV('Lev',25,'44-54');\">Lev 25:44-54</a>).";
eastonArray["$$T0002308"] = "<strong>Lock:</strong> The Hebrews usually secured their doors by bars of wood or iron (<a href=\"#\" onClick=\"return mV('Isa',45,2);\">Isa 45:2</a>; <a href=\"#\" onClick=\"return mV('1Ki',4,3);\">1Ki 4:3</a>). These were the locks originally used, and were opened and shut by large keys applied through an opening in the outside (<a href=\"#\" onClick=\"return mV('Jdg',3,24);\">Jdg 3:24</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002181');\">KEY</a>.)<br><br>Lock of hair (<a href=\"#\" onClick=\"return mV('Jdg',16,13,19);\">Jdg 16:13, 19</a>; <a href=\"#\" onClick=\"return mV('Eze',8,3);\">Eze 8:3</a>; <a href=\"#\" onClick=\"return mV('Num',6,5);\">Num 6:5</a>, etc.).";
eastonArray["$$T0002309"] = "<strong>Locust:</strong> There are ten Hebrew words used in Scripture to signify locust. In the New Testament locusts are mentioned as forming part of the food of John the Baptist (<a href=\"#\" onClick=\"return mV('Mat',3,4);\">Mat 3:4</a>; <a href=\"#\" onClick=\"return mV('Mar',1,6);\">Mar 1:6</a>). By the Mosaic law they were reckoned \"clean,\" so that he could lawfully eat them. The name also occurs in <a href=\"#\" onClick=\"return mV('Rev',9,3,7);\">Rev 9:3, 7</a>, in allusion to this Oriental devastating insect.<br><br>Locusts belong to the class of Orthoptera, i.e., straight-winged. They are of many species. The ordinary Syrian locust resembles the grasshopper, but is larger and more destructive. \"The legs and thighs of these insects are so powerful that they can leap to a height of two hundred times the length of their bodies. When so raised they spread their wings and fly so close together as to appear like one compact moving mass.\" Locusts are prepared as food in various ways. Sometimes they are pounded, and then mixed with flour and water, and baked into cakes; \"sometimes boiled, roasted, or stewed in butter, and then eaten.\" They were eaten in a preserved state by the ancient Assyrians.<br><br>The devastations they make in Eastern lands are often very appalling. The invasions of locusts are the heaviest calamites that can befall a country. \"Their numbers exceed computation: the Hebrews called them 'the countless,' and the Arabs knew them as 'the darkeners of the sun.' Unable to guide their own flight, though capable of crossing large spaces, they are at the mercy of the wind, which bears them as blind instruments of Providence to the doomed region given over to them for the time. Innumerable as the drops of water or the sands of the seashore, their flight obscures the sun and casts a thick shadow on the earth (<a href=\"#\" onClick=\"return mV('Exd',10,15);\">Exd 10:15</a>; <a href=\"#\" onClick=\"return mV('Jdg',6,5);\">Jdg 6:5</a>; <a href=\"#\" onClick=\"return mV('Jdg',7,12);\">7:12</a>; <a href=\"#\" onClick=\"return mV('Jer',46,23);\">Jer 46:23</a>; <a href=\"#\" onClick=\"return mV('Joe',2,10);\">Joe 2:10</a>). It seems indeed as if a great aerial mountain, many miles in breadth, were advancing with a slow, unresting progress. Woe to the countries beneath them if the wind fall and let them alight! They descend unnumbered as flakes of snow and hide the ground. It may be 'like the garden of Eden before them, but behind them is a desolate wilderness. At their approach the people are in anguish; all faces lose their colour' (<a href=\"#\" onClick=\"return mV('Joe',2,6);\">Joe 2:6</a>). No walls can stop them; no ditches arrest them; fires kindled in their path are forthwith extinguished by the myriads of their dead, and the countless armies march on (<a href=\"#\" onClick=\"return mV('Joe',2,8,9);\">Joe 2:8-9</a>). If a door or a window be open, they enter and destroy everything of wood in the house. Every terrace, court, and inner chamber is filled with them in a moment. Such an awful visitation swept over Egypt (<a href=\"#\" onClick=\"return mV('Exd',10,'1-19');\">Exd 10:1-19</a>), consuming before it every green thing, and stripping the trees, till the land was bared of all signs of vegetation. A strong north-west wind from the Mediterranean swept the locusts into the Red Sea.\", Geikie's Hours, etc., ii., 149.";
eastonArray["$$T0002310"] = "<strong>Lo-debar:</strong> no pasture, (<a href=\"#\" onClick=\"return mV('2Sa',17,27);\">2Sa 17:27</a>), a town in Gilead not far from Mahanaim, north of the Jabbok (<a href=\"#\" onClick=\"return mV('2Sa',9,4.5);\">9:4-5</a>). It is probably identical with Debir (<a href=\"#\" onClick=\"return mV('Jos',13,26);\">Jos 13:26</a>).";
eastonArray["$$T0002311"] = "<strong>Lodge:</strong> a shed for a watchman in a garden (<a href=\"#\" onClick=\"return mV('Isa',1,8);\">Isa 1:8</a>). The Hebrew name <i>melunah</i> is rendered \"cottage\" (q.v.) in <a href=\"#\" onClick=\"return mV('Isa',24,20);\">Isa 24:20</a>. It also denotes a hammock or hanging-bed.";
eastonArray["$$T0002312"] = "<strong>Log:</strong> the smallest measure for liquids used by the Hebrews (<a href=\"#\" onClick=\"return mV('Lev',14,10,12,15,21,24);\">Lev 14:10, 12, 15, 21, 24</a>), called in the Vulgate sextarius. It is the Hebrew unit of measure of capacity, and is equal to the contents of six ordinary hen's eggs=the twelfth part of a him, or nearly a pint.";
eastonArray["$$T0002313"] = "<strong>Lois:</strong> the maternal grandmother of Timothy. She is commended by Paul for her faith (<a href=\"#\" onClick=\"return mV('2Ti',1,5);\">2Ti 1:5</a>).";
eastonArray["$$T0002314"] = "<strong>Loop:</strong> a knotted \"eye\" of cord, corresponding to the \"taches\" or knobs in the edges of the curtains of the tabernacle, for joining them into a continuous circuit, fifty to a curtain (<a href=\"#\" onClick=\"return mV('Exd',26,4,5,10,11);\">Exd 26:4-5, 10-11</a>).";
eastonArray["$$T0002315"] = "<strong>Lord:</strong> There are various Hebrew and Greek words so rendered.<br><br>(1.) Heb. Jehovah, has been rendered in the English Bible <small>LORD</small>, printed in small capitals. This is the proper name of the God of the Hebrews. The form \"Jehovah\" is retained only in <a href=\"#\" onClick=\"return mV('Exd',6,3);\">Exd 6:3</a>; <a href=\"#\" onClick=\"return mV('Psa',83,18);\">Psa 83:18</a>; <a href=\"#\" onClick=\"return mV('Isa',12,2);\">Isa 12:2</a>; <a href=\"#\" onClick=\"return mV('Isa',26,4);\">26:4</a>, both in the Authorized and the Revised Version.<br><br>(2.) Heb. 'adon, means one possessed of absolute control. It denotes a master, as of slaves (<a href=\"#\" onClick=\"return mV('Gen',24,14,27);\">Gen 24:14, 27</a>), or a ruler of his subjects (<a href=\"#\" onClick=\"return mV('Gen',45,8);\">45:8</a>), or a husband, as lord of his wife (<a href=\"#\" onClick=\"return mV('Gen',18,12);\">18:12</a>).<br><br>The old plural form of this Hebrew word is <i>'adonai</i>. From a superstitious reverence for the name \"Jehovah,\" the Jews, in reading their Scriptures, whenever that name occurred, always pronounced it <i>'Adonai</i>.<br><br>(3.) Greek kurios, a supreme master, etc. In the LXX. this is invariably used for \"Jehovah\" and \"'Adonai.\"<br><br>(4.) Heb. ba'al, a master, as having domination. This word is applied to human relations, as that of husband, to persons skilled in some art or profession, and to heathen deities. \"The men of Shechem,\" literally \"the baals of Shechem\" (<a href=\"#\" onClick=\"return mV('Jdg',9,2,3);\">Jdg 9:2-3</a>). These were the Israelite inhabitants who had reduced the Canaanites to a condition of vassalage (<a href=\"#\" onClick=\"return mV('Jos',16,10);\">Jos 16:10</a>; <a href=\"#\" onClick=\"return mV('Jos',17,13);\">17:13</a>).<br><br>(5.) Heb. seren, applied exclusively to the \"lords of the Philistines\" (<a href=\"#\" onClick=\"return mV('Jdg',3,3);\">Jdg 3:3</a>). The LXX. render it by satrapies. At this period the Philistines were not, as at a later period (<a href=\"#\" onClick=\"return mV('1Sa',21,10);\">1Sa 21:10</a>), under a kingly government. (See <a href=\"#\" onClick=\"return mV('Jos',13,3);\">Jos 13:3</a>; <a href=\"#\" onClick=\"return mV('1Sa',6,18);\">1Sa 6:18</a>.) There were five such lordships, viz., Gath, Ashdod, Gaza, Ashkelon, and Ekron.";
eastonArray["$$T0002316"] = "<strong>Lord's day:</strong> only once, in <a href=\"#\" onClick=\"return mV('Rev',1,10);\">Rev 1:10</a>, was in the early Christian ages used to denote the first day of the week, which commemorated the Lord's resurrection. There is every reason to conclude that John thus used the name. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003170');\">SABBATH</a>.)";
eastonArray["$$T0002317"] = "<strong>Lord's Prayer:</strong> the name given to the only form of prayer Christ taught his disciples (<a href=\"#\" onClick=\"return mV('Mat',6,'9-13');\">Mat 6:9-13</a>). The closing doxology of the prayer is omitted by Luke (<a href=\"#\" onClick=\"return mV('Luk',11,'2-4');\">Luk 11:2-4</a>), also in the R.V. of <a href=\"#\" onClick=\"return mV('Mat',6,13);\">Mat 6:13</a>. This prayer contains no allusion to the atonement of Christ, nor to the offices of the Holy Spirit. \"All Christian prayer is based on the Lord's Prayer, but its spirit is also guided by that of His prayer in Gethsemane and of the prayer recorded <a href=\"#\" onClick=\"return mV('Jhn',17,'1-');\">John 17</a>. The Lord's Prayer is the comprehensive type of the simplest and most universal prayer.\"";
eastonArray["$$T0002318"] = "<strong>Lord's Supper:</strong> (<a href=\"#\" onClick=\"return mV('1Cr',11,20);\">1Cr 11:20</a>), called also \"the Lord's table\" (<a href=\"#\" onClick=\"return mV('1Cr',10,21);\">10:21</a>), \"communion,\" \"cup of blessing\" (<a href=\"#\" onClick=\"return mV('1Cr',10,16);\">10:16</a>), and \"breaking of bread\" (<a href=\"#\" onClick=\"return mV('Act',2,42);\">Act 2:42</a>).<br><br>In the early Church it was called also \"eucharist,\" or giving of thanks (<a href=\"#\" onClick=\"return mV('Mat',26,27);\">Mat 26:27</a>), and generally by the Latin Church \"mass,\" a name derived from the formula of dismission, Ite, missa est, i.e., \"Go, it is discharged.\"<br><br>The account of the institution of this ordinance is given in <a href=\"#\" onClick=\"return mV('Mat',26,'26-29');\">Mat 26:26-29</a>; <a href=\"#\" onClick=\"return mV('Mar',14,'22-25');\">Mar 14:22-25</a>; <a href=\"#\" onClick=\"return mV('Luk',22,19,20);\">Luk 22:19-20</a>, and <a href=\"#\" onClick=\"return mV('1Cr',1,'24-26');\">1Co 11:24-26</a>. It is not mentioned by John.<br><br>It was designed,<br><br>(1.) To commemorate the death of Christ: \"This do in remembrance of me.\"<br><br>(2.) To signify, seal, and apply to believers all the benefits of the new covenant. In this ordinance Christ ratifies his promises to his people, and they on their part solemnly consecrate themselves to him and to his entire service.<br><br>(3.) To be a badge of the Christian profession.<br><br>(4.) To indicate and to promote the communion of believers with Christ.<br><br>(5.) To represent the mutual communion of believers with each other.<br><br>The elements used to represent Christ's body and blood are bread and wine. The kind of bread, whether leavened or unleavened, is not specified. Christ used unleavened bread simply because it was at that moment on the paschal table. Wine, and no other liquid, is to be used (<a href=\"#\" onClick=\"return mV('Mat',26,'26-29');\">Mat 26:26-29</a>). Believers \"feed\" on Christ's body and blood,<br><br>(1) not with the mouth in any manner, but<br><br>(2) by the soul alone, and<br><br>(3) by faith, which is the mouth or hand of the soul. This they do<br><br>(4) by the power of the Holy Ghost. This \"feeding\" on Christ, however, takes place not in the Lord's Supper alone, but whenever faith in him is exercised.<br><br>This is a permanent ordinance in the Church of Christ, and is to be observed \"till he come\" again.";
eastonArray["$$T0002319"] = "<strong>Lo-ruhamah:</strong> not pitied, the name of the prophet Hosea's first daughter, a type of Jehovah's temporary rejection of his people (<a href=\"#\" onClick=\"return mV('Hsa',1,6);\">Hsa 1:6</a>; <a href=\"#\" onClick=\"return mV('Hsa',2,23);\">2:23</a>).";
eastonArray["$$T0002320"] = "<strong>Lot:</strong> (Heb. goral, a \"pebble\"), a small stone used in casting lots (<a href=\"#\" onClick=\"return mV('Num',33,54);\">Num 33:54</a>; <a href=\"#\" onClick=\"return mV('Jon',1,7);\">Jon 1:7</a>). The lot was always resorted to by the Hebrews with strictest reference to the interposition of God, and as a method of ascertaining the divine will (<a href=\"#\" onClick=\"return mV('Pro',16,33);\">Pro 16:33</a>), and in serious cases of doubt (<a href=\"#\" onClick=\"return mV('Est',3,7);\">Est 3:7</a>). Thus the lot was used at the division of the land of Canaan among the serveral tribes (<a href=\"#\" onClick=\"return mV('Num',26,55);\">Num 26:55</a>; <a href=\"#\" onClick=\"return mV('Num',34,13);\">34:13</a>), at the detection of Achan (<a href=\"#\" onClick=\"return mV('Jos',7,14,18);\">Jos 7:14, 18</a>), the election of Saul to be king (<a href=\"#\" onClick=\"return mV('1Sa',10,20,21);\">1Sa 10:20-21</a>), the distribution of the priestly offices of the temple service (<a href=\"#\" onClick=\"return mV('1Ch',24,3,5,19);\">1Ch 24:3, 5, 19</a>; <a href=\"#\" onClick=\"return mV('Luk',1,9);\">Luk 1:9</a>), and over the two goats at the feast of Atonement (<a href=\"#\" onClick=\"return mV('Lev',16,8);\">Lev 16:8</a>). Matthias, who was \"numbered with the eleven\" (<a href=\"#\" onClick=\"return mV('Act',1,'24-26');\">Act 1:24-26</a>), was chosen by lot.<br><br>This word also denotes a portion or an inheritance (<a href=\"#\" onClick=\"return mV('Jos',15,1);\">Jos 15:1</a>; <a href=\"#\" onClick=\"return mV('Psa',125,3);\">Psa 125:3</a>; <a href=\"#\" onClick=\"return mV('Isa',17,4);\">Isa 17:4</a>), and a destiny, as assigned by God (<a href=\"#\" onClick=\"return mV('Psa',16,5);\">Psa 16:5</a>; <a href=\"#\" onClick=\"return mV('Dan',12,13);\">Dan 12:13</a>).<br><br>Lot, (Heb. lot), a covering; veil, the son of Haran, and nephew of Abraham (<a href=\"#\" onClick=\"return mV('Gen',11,27);\">Gen 11:27</a>). On the death of his father, he was left in charge of his grandfather Terah (<a href=\"#\" onClick=\"return mV('Gen',11,31);\">31</a>), after whose death he accompanied his uncle Abraham into Canaan (<a href=\"#\" onClick=\"return mV('Gen',12,5);\">12:5</a>), thence into Egypt (<a href=\"#\" onClick=\"return mV('Gen',12,10);\">10</a>), and back again to Canaan (<a href=\"#\" onClick=\"return mV('Gen',13,1);\">13:1</a>). After this he separated from him and settled in Sodom (<a href=\"#\" onClick=\"return mV('Gen',13,'5-13');\">13:5-13</a>). There his righteous soul was \"vexed\" from day to day (<a href=\"#\" onClick=\"return mV('2Pe',2,7);\">2Pe 2:7</a>), and he had great cause to regret this act. Not many years after the separation he was taken captive by Chedorlaomer, and was rescued by Abraham (<a href=\"#\" onClick=\"return mV('Gen',14,'1-')\">Gen 14</a>). At length, when the judgment of God descended on the guilty cities of the plain (<a href=\"#\" onClick=\"return mV('Gen',19,'1-20');\">Gen 19:1-20</a>), Lot was miraculously delivered. When fleeing from the doomed city his wife \"looked back from behind him, and became a pillar of salt.\" There is to this day a peculiar crag at the south end of the Dead Sea, near Kumran, which the Arabs call Bint Sheik Lot, i.e., Lot's wife. It is \"a tall, isolated needle of rock, which really does bear a curious resemblance to an Arab woman with a child upon her shoulder.\" From the words of warning in <a href=\"#\" onClick=\"return mV('Luk',17,32);\">Luke 17:32</>, \"Remember Lot's wife,\" it would seem as if she had gone back, or tarried so long behind in the desire to save some of her goods, that she became involved in the destruction which fell on the city, and became a stiffened corpse, fixed for a time in the saline incrustations. She became \"a pillar of salt\", i.e., as some think, of asphalt. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003196');\">SALT</a>.)<br><br>Lot and his daughters sought refuge first in Zoar, and then, fearing to remain there longer, retired to a cave in the neighbouring mountains (<a href=\"#\" onClick=\"return mV('Gen',19,30);\">Gen 19:30</a>). Lot has recently been connected with the people called on the Egyptian monuments Rotanu or Lotanu, who is supposed to have been the hero of the Edomite tribe Lotan.";
eastonArray["$$T0002321"] = "<strong>Lotan:</strong> coverer, one of the sons of Seir, the Horite (<a href=\"#\" onClick=\"return mV('Gen',36,20,29);\">Gen 36:20, 29</a>).";
eastonArray["$$T0002322"] = "<strong>Love:</strong> This word seems to require explanation only in the case of its use by our Lord in his interview with \"Simon, the son of Jonas,\" after his resurrection (<a href=\"#\" onClick=\"return mV('Jhn',21,16,17);\">Jhn 21:16-17</a>). When our Lord says, \"Lovest thou me?\" he uses the Greek word <i>agapas</i>; and when Simon answers, he uses the Greek word <i>philo</i>, i.e., \"I love.\" This is the usage in the first and second questions put by our Lord; but in the third our Lord uses Simon's word. The distinction between these two Greek words is thus fitly described by Trench:, \"</i>Agapan</i> has more of judgment and deliberate choice; <i>philein</i> has more of attachment and peculiar personal affection. Thus the 'Lovest thou' (Gr. agapas) on the lips of the Lord seems to Peter at this moment too cold a word, as though his Lord were keeping him at a distance, or at least not inviting him to draw near, as in the passionate yearning of his heart he desired now to do. Therefore he puts by the word and substitutes his own stronger 'I love' (Gr. philo) in its room. A second time he does the same. And now he has conquered; for when the Lord demands a third time whether he loves him, he does it in the word which alone will satisfy Peter ('Lovest thou,' Gr. phileis), which alone claims from him that personal attachment and affection with which indeed he knows that his heart is full.\"<br><br>In <a href=\"#\" onClick=\"return mV('1Cr',13,'1-');\">1Cr 13</a> the apostle sets forth the excellency of love, as the word \"charity\" there is rendered in the Revised Version.";
eastonArray["$$T0002323"] = "<strong>Lubims:</strong> the inhabitants of a thirsty or scorched land; the Lybians, an African nation under tribute to Egypt (<a href=\"#\" onClick=\"return mV('2Ch',12,3);\">2Ch 12:3</a>; <a href=\"#\" onClick=\"return mV('2Ch',16,8);\">16:8</a>). Their territory was apparently near Egypt. They were probably the Mizraite Lehabim.";
eastonArray["$$T0002324"] = "<strong>Lucas:</strong> a friend and companion of Paul during his imprisonment at Rome; Luke (q.v.), the beloved physician (<a href=\"#\" onClick=\"return mV('Phm',1,24);\">Phm 1:24</a>; <a href=\"#\" onClick=\"return mV('Col',4,14);\">Col 4:14</a>).";
eastonArray["$$T0002325"] = "<strong>Lucifer:</strong> brilliant star, a title given to the king of Babylon (<a href=\"#\" onClick=\"return mV('Isa',14,12);\">Isa 14:12</a>) to denote his glory.";
eastonArray["$$T0002326"] = "<strong>Lucius:</strong> of Cyrene, a Christian teacher at Antioch (<a href=\"#\" onClick=\"return mV('Act',13,1);\">Act 13:1</a>), and Paul's kinsman (<a href=\"#\" onClick=\"return mV('Rom',16,21);\">Rom 16:21</a>). His name is Latin, but his birthplace seems to indicate that he was one of the Jews of Cyrene, in North Africa.";
eastonArray["$$T0002327"] = "<strong>Lucre:</strong> from the Lat. lucrum, \"gain.\" <a href=\"#\" onClick=\"return mV('1Ti',3,3);\">1Ti 3:3</a>, \"not given to filthy lucre.\" Some MSS. have not the word so rendered, and the expression has been omitted in the Revised Version.";
eastonArray["$$T0002328"] = "<strong>Lud:</strong><br ?<br>(1.) The fourth son of Shem (<a href=\"#\" onClick=\"return mV('Gen',10,22);\">Gen 10:22</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,17);\">1Ch 1:17</a>), ancestor of the Lydians probably.<br><br>(2.) One of the Hamitic tribes descended from Mizraim (<a href=\"#\" onClick=\"return mV('Gen',10,13);\">Gen 10:13</a>), a people of Africa (<a href=\"#\" onClick=\"return mV('Eze',27,10);\">Eze 27:10</a>; <a href=\"#\" onClick=\"return mV('Eze',30,5);\">30:5</a>), on the west of Egypt. The people called Lud were noted archers (<a href=\"#\" onClick=\"return mV('Isa',66,19);\">Isa 66:19</a>; <a href=\"#\" onClick=\"return mV('Jer',46,9);\">Jer 46:9</a>).";
eastonArray["$$T0002329"] = "<strong>Ludim:</strong> probably the same as Lud (2) (<a href=\"#\" onClick=\"return mV('Gen',10,13);\">Gen 10:13</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,11);\">1Ch 1:11</a>). They are associated (<a href=\"#\" onClick=\"return mV('Jer',46,9);\">Jer 46:9</a>) with African nations as mercenaries of the king of Egypt.";
eastonArray["$$T0002330"] = "<strong>Luhith:</strong> made of boards, a Moabitish place between Zoar and Horonaim (<a href=\"#\" onClick=\"return mV('Isa',15,5);\">Isa 15:5</a>; <a href=\"#\" onClick=\"return mV('Jer',48,5);\">Jer 48:5</a>).";
eastonArray["$$T0002331"] = "<strong>Luke:</strong> the evangelist, was a Gentile. The date and circumstances of his conversion are unknown. According to his own statement (<a href=\"#\" onClick=\"return mV('Luk',1,2);\">Luk 1:2</a>), he was not an \"eye-witness and minister of the word from the beginning.\" It is probable that he was a physician in Troas, and was there converted by Paul, to whom he attached himself. He accompanied him to Philippi, but did not there share his imprisonment, nor did he accompany him further after his release in his missionary journey at this time (<a href=\"#\" onClick=\"return mV('Act',17,1);\">Act 17:1</a>). On Paul's third visit to Philippi (<a href=\"#\" onClick=\"return mV('Act',20,5,6);\">20:5-6</a>) we again meet with Luke, who probably had spent all the intervening time in that city, a period of seven or eight years. From this time Luke was Paul's constant companion during his journey to Jerusalem (<a href=\"#\" onClick=\"return mV('Act',20,'6-');\">20:6</a>-<a href=\"#\" onClick=\"return mV('Act',21,'1-18');\">21:18</a>). He again disappears from view during Paul's imprisonment at Jerusalem and Caesarea, and only reappears when Paul sets out for Rome (<a href=\"#\" onClick=\"return mV('Act',27,1);\">27:1</a>), whither he accompanies him (<a href=\"#\" onClick=\"return mV('Act',28,2','12-16');\">28:2, 12-16</a>), and where he remains with him till the close of his first imprisonment (<a href=\"#\" onClick=\"return mV('Phm',1,24);\">Phm 1:24</a>; <a href=\"#\" onClick=\"return mV('Col',4,14);\">Col 4:14</a>). The last notice of the \"beloved physician\" is in <a href=\"#\" onClick=\"return mV('2Ti',4,11);\">2Ti 4:11</a>.<br><br>There are many passages in Paul's epistles, as well as in the writings of Luke, which show the extent and accuracy of his medical knowledge.";
eastonArray["$$T0002332"] = "<strong>Luke, Gospel according to:</strong> was written by Luke. He does not claim to have been an eye-witness of our Lord's ministry, but to have gone to the best sources of information within his reach, and to have written an orderly narrative of the facts (<a href=\"#\" onClick=\"return mV('Luk',1,'1-4');\">Luk 1:1-4</a>). The authors of the first three Gospels, the synoptics, wrote independently of each other. Each wrote his independent narrative under the guidance of the Holy Spirit.<br><br>Each writer has some things, both in matter and style, peculiar to himself, yet all the three have much in common. Luke's Gospel has been called \"the Gospel of the nations, full of mercy and hope, assured to the world by the love of a suffering Saviour;\" \"the Gospel of the saintly life;\" \"the Gospel for the Greeks; the Gospel of the future; the Gospel of progressive Christianity, of the universality and gratuitousness of the gospel; the historic Gospel; the Gospel of Jesus as the good Physician and the Saviour of mankind;\" the \"Gospel of the Fatherhood of God and the brotherhood of man;\" \"the Gospel of womanhood;\" \"the Gospel of the outcast, of the Samaritan, the publican, the harlot, and the prodigal;\" \"the Gospel of tolerance.\" The main characteristic of this Gospel, as Farrar (Cambridge Bible, Luke, Introd.) remarks, is fitly expressed in the motto, \"Who went about doing good, and healing all that were oppressed of the devil\" (<a href=\"#\" onClick=\"return mV('Act',10,38);\">Act 10:38</a>; <a href=\"#\" onClick=\"return mV('Luk',4,18);\">Luk 4:18</a>). Luke wrote for the \"Hellenic world.\" This Gospel is indeed \"rich and precious.\"<br><br>\"Out of a total of 1151 verses, Luke has 389 in common with Matthew and Mark, 176 in common with Matthew alone, 41 in common with Mark alone, leaving 544 peculiar to himself. In many instances all three use identical language.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0002442');\">MATTHEW</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0002419');\">MARK</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0001532');\">GOSPELS</a>.)<br><br>There are seventeen of our Lord's parables peculiar to this Gospel. (See List of Parables in Appendix.) Luke also records seven of our Lord's miracles which are omitted by Matthew and Mark. (See List of Miracles in Appendix.) The synoptical Gospels are related to each other after the following scheme. If the contents of each Gospel be represented by 100, then when compared this result is obtained:<br><br>Mark has 7 peculiarities, 93 coincidences. Matthew 42 peculiarities, 58 coincidences. Luke 59 peculiarities, 41 coincidences.<br><br>That is, thirteen-fourteenths of Mark, four-sevenths of Matthew, and two-fifths of Luke are taken up in describing the same things in very similar language.<br><br>Luke's style is more finished and classical than that of Matthew and Mark. There is less in it of the Hebrew idiom. He uses a few Latin words (<a href=\"#\" onClick=\"return mV('Luk',12,6);\">Luk 12:6</a>; <a href=\"#\" onClick=\"return mV('Luk',7,41);\">7:41</a>; <a href=\"#\" onClick=\"return mV('Luk',8,30);\">8:30</a>; <a href=\"#\" onClick=\"return mV('Luk',11,33);\">11:33</a>; <a href=\"#\" onClick=\"return mV('Luk',19,20);\">19:20</a>), but no Syriac or Hebrew words except sikera, an exciting drink of the nature of wine, but not made of grapes (<a href=\"#\" onClick=\"return mV('Lev',10,9);\">Lev 10:9</a>), probably palm wine.<br><br>This Gospel contains twenty-eight distinct references to the Old Testament.<br><br>The date of its composition is uncertain. It must have been written before the Acts, the date of the composition of which is generally fixed at about 63 or 64 A.D. This Gospel was written, therefore, probably about 60 or 63, when Luke may have been at Caesarea in attendance on Paul, who was then a prisoner. Others have conjectured that it was written at Rome during Paul's imprisonment there. But on this point no positive certainty can be attained.<br><br>It is commonly supposed that Luke wrote under the direction, if not at the dictation of Paul. Many words and phrases are common to both; e.g., compare:<br><br>(<a href=\"#\" onClick=\"return mV('Luk',4,22);\">Luk 4:22</a>; with <a href=\"#\" onClick=\"return mV('Col',4,6);\">Col 4:6</a>.) (<a href=\"#\" onClick=\"return mV('Luk',4,32);\">Luk 4:32</a>; with <a href=\"#\" onClick=\"return mV('1Cr',2,4);\">1Cr 2:4</a>.) (<a href=\"#\" onClick=\"return mV('Luk',6,36);\">Luk 6:36</a>; with <a href=\"#\" onClick=\"return mV('2Cr',1,3);\">2Cr 1:3</a>.) (<a href=\"#\" onClick=\"return mV('Luk',6,39);\">Luk 6:39</a>; with <a href=\"#\" onClick=\"return mV('Rom',2,19);\">Rom 2:19</a>.) (<a href=\"#\" onClick=\"return mV('Luk',9,56);\">Luk 9:56</a>; with <a href=\"#\" onClick=\"return mV('2Cr',10,8);\">2Cr 10:8</a>.) (<a href=\"#\" onClick=\"return mV('Luk',10,8);\">Luk 10:8</a>; with <a href=\"#\" onClick=\"return mV('1Cr',10,27);\">1Cr 10:27</a>.) (<a href=\"#\" onClick=\"return mV('Luk',11,41);\">Luk 11:41</a>; with <a href=\"#\" onClick=\"return mV('Tts',1,15);\">Tts 1:15</a>.) (<a href=\"#\" onClick=\"return mV('Luk',18,1);\">Luk 18:1</a>; with <a href=\"#\" onClick=\"return mV('2Th',1,11);\">2Th 1:11</a>.) (<a href=\"#\" onClick=\"return mV('Luk',21,36);\">Luk 21:36</a>; with <a href=\"#\" onClick=\"return mV('Eph',6,18);\">Eph 6:18</a>.) (<a href=\"#\" onClick=\"return mV('Luk',22,19,20);\">Luk 22:19-20</a>; <a href=\"#\" onClick=\"return mV('1Cr',11,'23-29');\">1Cr 11:23-29</a>.) (<a href=\"#\" onClick=\"return mV('Luk',24,46);\">Luk 24:46</a>; with <a href=\"#\" onClick=\"return mV('Act',17,3);\">Act 17:3</a>.) (<a href=\"#\" onClick=\"return mV('Luk',24,34);\">Luk 24:34</a>; with <a href=\"#\" onClick=\"return mV('1Cr',15,5);\">1Cr 15:5</a>.)";
eastonArray["$$T0002333"] = "<strong>Lunatic:</strong> probably the same as epileptic, the symptoms of which disease were supposed to be more aggravated as the moon increased. In <a href=\"#\" onClick=\"return mV('Mat',4,24);\">Mat 4:24</a> \"lunatics\" are distinguished from demoniacs. In <a href=\"#\" onClick=\"return mV('Mat',17,15);\">Mat 17:15</a> the name \"lunatic\" is applied to one who is declared to have been possessed. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000957');\">DAEMONIAC</a>.)";
eastonArray["$$T0002334"] = "<strong>Lust:</strong> sinful longing; the inward sin which leads to the falling away from God (<a href=\"#\" onClick=\"return mV('Rom',1,21);\">Rom 1:21</a>). \"Lust, the origin of sin, has its place in the heart, not of necessity, but because it is the centre of all moral forces and impulses and of spiritual activity.\" In <a href=\"#\" onClick=\"return mV('Mar',4,19);\">Mar 4:19</a> \"lusts\" are objects of desire.";
eastonArray["$$T0002335"] = "<strong>Luz:</strong> a nut-bearing tree, the almond.<br><br>(1.) The ancient name of a royal Canaanitish city near the site of Bethel (<a href=\"#\" onClick=\"return mV('Gen',28,19);\">Gen 28:19</a>; <a href=\"#\" onClick=\"return mV('Gen',35,6);\">35:6</a>), on the border of Benjamin (<a href=\"#\" onClick=\"return mV('Jos',18,13);\">Jos 18:13</a>). Here Jacob halted, and had a prophetic vision. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000554');\">BETHEL</a>.)<br><br>(2.) A place in the land of the Hittites, founded (<a href=\"#\" onClick=\"return mV('Jdg',1,26);\">Jdg 1:26</a>) by \"a man who came forth out of the city of Luz.\" It is identified with Luweiziyeh, 4 miles north-west of Banias.";
eastonArray["$$T0002336"] = "<strong>Lycaonia:</strong> an inland province of Asia Minor, on the west of Cappadocia and the south of Galatia. It was a Roman province, and its chief towns were Iconium, Lystra, and Derbe. The \"speech of Lycaonia\" (<a href=\"#\" onClick=\"return mV('Act',14,11);\">Act 14:11</a>) was probably the ancient Assyrian language, or perhaps, as others think, a corrupt Greek intermingled with Syriac words. Paul preached in this region, and revisited it (<a href=\"#\" onClick=\"return mV('Act',16,'1-6');\">Act 16:1-6</a>; <a href=\"#\" onClick=\"return mV('Act',18,23);\">18:23</a>; <a href=\"#\" onClick=\"return mV('Act',19,1);\">19:1</a>).";
eastonArray["$$T0002337"] = "<strong>Lycia:</strong> a wolf, a province in the south-west of Asia Minor, opposite the island of Rhodes. It forms part of the region now called Tekeh. It was a province of the Roman empire when visited by Paul (<a href=\"#\" onClick=\"return mV('Act',21,1);\">Act 21:1</a>; <a href=\"#\" onClick=\"return mV('Act',27,5);\">27:5</a>). Two of its towns are mentioned, Patara (<a href=\"#\" onClick=\"return mV('Act',21,1,2);\">21:1-2</a>) and Myra (<a href=\"#\" onClick=\"return mV('Act',27,5);\">27:5</a>).";
eastonArray["$$T0002338"] = "<strong>Lydda:</strong> a town in the tribe of Ephraim, mentioned only in the New Testament (<a href=\"#\" onClick=\"return mV('Act',9,32,35,38);\">Act 9:32, 35, 38</a>) as the scene of Peter's miracle in healing the paralytic AEneas. It lay about 9 miles east of Joppa, on the road from the sea-port to Jerusalem. In the Old Testament (<a href=\"#\" onClick=\"return mV('1Ch',8,12);\">1Ch 8:12</a>) it is called Lod. It was burned by the Romans, but was afterwards rebuilt, and was known by the name of Diospolis. Its modern name is Ludd. The so-called patron saint of England, St. George, is said to have been born here.";
eastonArray["$$T0002339"] = "<strong>Lydia:</strong><br><br>(1.) <a href=\"#\" onClick=\"return mV('Eze',30,5);\">Eze 30:5</a> (Heb. Lud), a province in the west of Asia Minor, which derived its name from the fourth son of Shem (<a href=\"#\" onClick=\"return mV('Gen',10,22);\">Gen 10:22</a>). It was bounded on the east by the greater Phrygia, and on the west by Ionia and the AEgean Sea.<br><br>(2.) A woman of Thyatira, a \"seller of purple,\" who dwelt in Philippi (<a href=\"#\" onClick=\"return mV('Act',16,14,15);\">Act 16:14-15</a>). She was not a Jewess but a proselyte. The Lord opened her heart as she heard the gospel from the lips of Paul (<a href=\"#\" onClick=\"return mV('Act',16,13);\">16:13</a>). She thus became the first in Europe who embraced Christianity. She was a person apparently of considerable wealth, for she could afford to give a home to Paul and his companions. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003650');\">THYATIRA</a>.)";
eastonArray["$$T0002340"] = "<strong>Lysanias:</strong> tetrarch of Abilene (<a href=\"#\" onClick=\"return mV('Luk',3,1);\">Luk 3:1</a>), on the eastern slope of Anti-Lebanon, near the city of Damascus.";
eastonArray["$$T0002341"] = "<strong>Lysias, Claudius:</strong> the chief captain (chiliarch) who commanded the Roman troops in Jerusalem, and sent Paul under guard to the procurator Felix at Caesarea (<a href=\"#\" onClick=\"return mV('Act',21,'31-38');\">Act 21:31-28</a>; <a href=\"#\" onClick=\"return mV('Act',22,'24-30');\">22:24-30</a>). His letter to his superior officer is an interesting specimen of Roman military correspondence (<a href=\"#\" onClick=\"return mV('Act',23,'26-30');\">23:26-30</a>). He obtained his Roman citizenship by purchase, and was therefore probably a Greek. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000841');\">CLAUDIUS</a>.)";
eastonArray["$$T0002342"] = "<strong>Lystra:</strong> a town of Lycaonia, in Asia Minor, in a wild district and among a rude population. Here Paul preached the gospel after he had been driven by persecution from Iconium (<a href=\"#\" onClick=\"return mV('Act',14,'2-7');\">Act 14:2-7</a>). Here also he healed a lame man (<a href=\"#\" onClick=\"return mV('Act',14,8);\">8</a>), and thus so impressed the ignorant and superstitious people that they took him for Mercury, because he was the \"chief speaker,\" and his companion Barnabas for Jupiter, probably in consequence of his stately, venerable appearance; and were proceeding to offer sacrifices to them (<a href=\"#\" onClick=\"return mV('Act',14,13);\">13</a>), when Paul earnestly addressed them and turned their attention to the true source of all blessings. But soon after, through the influence of the Jews from Antioch in Pisidia and Iconium, they stoned Paul and left him for dead (<a href=\"#\" onClick=\"return mV('Act',14,19);\">14:19</a>). On recovering, Paul left for Derbe; but soon returned again, through Lystra, encouraging the disciples there to steadfastness. He in all likelihood visited this city again on his third missionary tour (<a href=\"#\" onClick=\"return mV('Act',18,23);\">Act 18:23</a>). Timothy, who was probably born here (<a href=\"#\" onClick=\"return mV('2Ti',3,10,11);\">2Ti 3:10-11</a>), was no doubt one of those who were on this occasion witnesses of Paul's persecution and his courage in Lystra.";
eastonArray["$$T0002343"] = "<strong>Maachah:</strong> oppression, <br><br>(1.) a small Syrian kingdom near Geshur, east of the Hauran, the district of Batanea (<a href=\"#\" onClick=\"return mV('Jos',13,13);\">Jos 13:13</a>; <a href=\"#\" onClick=\"return mV('2Sa',10,6,8);\">2Sa 10:6, 8</a>; <a href=\"#\" onClick=\"return mV('1Ch',19,7);\">1Ch 19:7</a>).<br><br>(2.) A daughter of Talmai, king of the old native population of Geshur. She became one of David's wives, and was the mother of Absalom (<a href=\"#\" onClick=\"return mV('2Sa',3,3);\">2Sa 3:3</a>).<br><br>(3.) The father of Hanan, who was one of David's body-guard (<a href=\"#\" onClick=\"return mV('1Ch',11,43);\">1Ch 11:43</a>).<br><br>(4.) The daughter of Abishalom (<a href=\"#\" onClick=\"return mV('2Ch',11,'20-22');\">2Ch 11:20-22</a>), the third wife of Rehoboam, and mother of Abijam (<a href=\"#\" onClick=\"return mV('1Ki',15,2);\">1Ki 15:2</a>). She is called \"Michaiah the daughter of Uriel,\" who was the husband of Absalom's daughter Tamar (<a href=\"#\" onClick=\"return mV('2Ch',13,2);\">2Ch 13:2</a>). Her son Abijah or Abijam was heir to the throne.<br><br>(5.) The father of Achish, the king of Gath (<a href=\"#\" onClick=\"return mV('1Ki',2,39);\">1Ki 2:39</a>), called also Maoch (<a href=\"#\" onClick=\"return mV('1Sa',27,2);\">1Sa 27:2</a>).";
eastonArray["$$T0002344"] = "<strong>Maaleh-acrabbim:</strong> ascent of the scorpions; i.e., \"scorpion-hill\", a pass on the south-eastern border of Palestine (<a href=\"#\" onClick=\"return mV('Num',34,4);\">Num 34:4</a>; <a href=\"#\" onClick=\"return mV('Jos',15,3);\">Jos 15:3</a>). It is identified with the pass of Sufah, entering Palestine from the great Wady el-Fikreh, south of the Dead Sea. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000163');\">AKRABBIM</a>.)";
eastonArray["$$T0002345"] = "<strong>Maarath:</strong> desolation, a place in the mountains of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,59);\">Jos 15:59</a>), probably the modern village Beit Ummar, 6 miles north of Hebron.";
eastonArray["$$T0002346"] = "<strong>Maaseiah:</strong> the work of Jehovah.<br><br>(1.) One of the Levites whom David appointed as porter for the ark (<a href=\"#\" onClick=\"return mV('1Ch',15,18,20);\">1Ch 15:18, 20</a>).<br><br>(2.) One of the \"captains of hundreds\" associated with Jehoiada in restoring king Jehoash to the throne (<a href=\"#\" onClick=\"return mV('2Ch',23,1);\">2Ch 23:1</a>).<br><br>(3.) The \"king's son,\" probably one of the sons of king Ahaz, killed by Zichri in the invasion of Judah by Pekah, king of Israel (<a href=\"#\" onClick=\"return mV('2Ch',28,7);\">2Ch 28:7</a>).<br><br>(4.) One who was sent by king Josiah to repair the temple (<a href=\"#\" onClick=\"return mV('2Ch',34,8);\">2Ch 34:8</a>). He was governor (Heb. sar, rendered elsewhere in the Authorized Version \"prince,\" \"chief captain,\" chief ruler\") of Jerusalem.<br><br>(5.) The father of the priest Zephaniah (<a href=\"#\" onClick=\"return mV('Jer',21,1);\">Jer 21:1</a>; <a href=\"#\" onClick=\"return mV('Jer',37,3);\">37:3</a>).<br><br>(6.) The father of the false prophet Zedekiah (<a href=\"#\" onClick=\"return mV('Jer',29,21);\">Jer 29:21</a>).<br><br>Maase'iah, refuge is Jehovah, a priest, the father of Neriah (<a href=\"#\" onClick=\"return mV('Jer',32,12);\">Jer 32:12</a>; <a href=\"#\" onClick=\"return mV('Jer',51,59);\">51:59</a>).";
eastonArray["$$T0002347"] = "<strong>Maasiai:</strong> work of Jehovah, one of the priests resident at Jerusalem at the Captivity (<a href=\"#\" onClick=\"return mV('1Ch',9,12);\">1Ch 9:12</a>).";
eastonArray["$$T0002348"] = "<strong>Maath:</strong> small, a person named in our Lord's ancestry (<a href=\"#\" onClick=\"return mV('Luk',3,26);\">Luk 3:26</a>).";
eastonArray["$$T0002349"] = "<strong>Maaziah:</strong> strength or consolation of Jehovah.<br><br>(1.) The head of the twenty-fourth priestly course (<a href=\"#\" onClick=\"return mV('1Ch',24,18);\">1Ch 24:18</a>) in David's reign.<br><br>(2.) A priest (<a href=\"#\" onClick=\"return mV('Neh',10,8);\">Neh 10:8</a>).";
