<script>var eastonArray = new Array ();
eastonArray["$$T0002000"] = "<strong>Jehdeiah:</strong> rejoicer in Jehovah.<br><br>(1.) One of the Levitical attendants at the temple, a descendant of Shubael (<a href=\"#\" onClick=\"return mV('1Ch',24,20);\">1Ch 24:20</a>).<br><br>(2.) A Meronothite, herdsman of the asses under David and Solomon (<a href=\"#\" onClick=\"return mV('1Ch',27,30);\">1Ch 27:30</a>).";
eastonArray["$$T0002001"] = "<strong>Jehiel:</strong> God's living one.<br><br>(1.) The father of Gibeon (<a href=\"#\" onClick=\"return mV('1Ch',9,35);\">1Ch 9:35</a>).<br><br>(2.) One of David's guard (<a href=\"#\" onClick=\"return mV('1Ch',11,44);\">1Ch 11:44</a>).<br><br>(3.) One of the Levites \"of the second degree,\" appointed to conduct the music on the occasion of the ark's being removed to Jerusalem (<a href=\"#\" onClick=\"return mV('1Ch',15,18,20);\">1Ch 15:18, 20</a>).<br><br>(4.) A Hachmonite, a tutor in the family of David toward the close of his reign (<a href=\"#\" onClick=\"return mV('1Ch',27,32);\">1Ch 27:32</a>).<br><br>(5.) The second of Jehoshaphat's six sons (<a href=\"#\" onClick=\"return mV('2Ch',21,2);\">2Ch 21:2</a>).<br><br>(6.) One of the Levites of the family of Heman who assisted Hezekiah in his work of reformation (<a href=\"#\" onClick=\"return mV('2Ch',29,14);\">2Ch 29:14</a>).<br><br>(7.) A \"prince\" and \"ruler of the house of God\" who contributed liberally to the renewal of the temple sacrifices under Josiah (<a href=\"#\" onClick=\"return mV('2Ch',35,8);\">2Ch 35:8</a>).<br><br>(8.) The father of Obadiah (<a href=\"#\" onClick=\"return mV('Ezr',8,9);\">Ezr 8:9</a>).<br><br>(9.) One of the \"sons\" of Elam (<a href=\"#\" onClick=\"return mV('Ezr',10,26);\">Ezr 10:26</a>).<br><br>(10.) <a href=\"#\" onClick=\"return mV('Ezr',10,21);\">Ezr 10:21</a>.";
eastonArray["$$T0002002"] = "<strong>Jehizkiah:</strong> Jehovah strengthens, one of the chiefs of Ephraim (<a href=\"#\" onClick=\"return mV('2Ch',28,12);\">2Ch 28:12</a>).";
eastonArray["$$T0002003"] = "<strong>Jehoaddan:</strong> Jehovah his ornament, the wife of King Jehoash, and mother of King Amaziah (<a href=\"#\" onClick=\"return mV('2Ki',14,2);\">2Ki 14:2</a>).";
eastonArray["$$T0002004"] = "<strong>Jehoahaz:</strong> Jehovah his sustainer, or he whom Jehovah holdeth.<br><br>(1.) The youngest son of Jehoram, king of Judah (<a href=\"#\" onClick=\"return mV('2Ch',21,17);\">2Ch 21:17</a>; <a href=\"#\" onClick=\"return mV('2Ch',22,1,6,8,9);\">22:1, 6, 8-9</a>); usually Ahaziah (q.v.).<br><br>(2.) The son and successor of Jehu, king of Israel (<a href=\"#\" onClick=\"return mV('2Ki',10,35);\">2Ki 10:35</a>). He reigned seventeen years, and followed the evil ways of the house of Jeroboam. The Syrians, under Hazael and Benhadad, prevailed over him, but were at length driven out of the land by his son Jehoash (<a href=\"#\" onClick=\"return mV('2Ki',13,'1-9', 25);\">13:1-9, 25</a>).<br><br>(3.) Josiah's third son, usually called Shallum (<a href=\"#\" onClick=\"return mV('1Ch',3,15);\">1Ch 3:15</a>). He succeeded his father on the throne, and reigned over Judah for three months (<a href=\"#\" onClick=\"return mV('2Ki',23,31,34);\">2Ki 23:31, 34</a>). He fell into the idolatrous ways of his predecessors (<a href=\"#\" onClick=\"return mV('2Ki',23,32);\">23:32</a>), was deposed by Pharaoh-Necho from the throne, and carried away prisoner into Egypt, where he died in captivity (<a href=\"#\" onClick=\"return mV('2Ki',23,33,34);\">23:33-34</a>; <a href=\"#\" onClick=\"return mV('Jer',22,'10-12');\">Jer 22:10-12</a>; <a href=\"#\" onClick=\"return mV('2Ch',36,'1-4');\">2Ch 36:1-4</a>).";
eastonArray["$$T0002005"] = "<strong>Jehoash:</strong> Jehovah-given.<br><br>(1.) The son of King Ahaziah. While yet an infant, he was saved from the general massacre of the family by his aunt Jehosheba, and was apparently the only surviving descendant of Solomon (<a href=\"#\" onClick=\"return mV('2Ch',21,4,17);\">2Ch 21:4, 17</a>). His uncle, the high priest Jehoiada, brought him forth to public notice when he was eight years of age, and crowned and anointed him king of Judah with the usual ceremonies. Athaliah was taken by surprise when she heard the shout of the people, \"Long live the king;\" and when she appeared in the temple, Jehoiada commanded her to be led forth to death (<a href=\"#\" onClick=\"return mV('2Ki',11,'13-20');\">2Ki 11:13-20</a>). While the high priest lived, Jehoash favoured the worship of God and observed the law; but on his death he fell away into evil courses, and the land was defiled with idolatry. Zechariah, the son and successor of the high priest, was put to death. These evil deeds brought down on the land the judgement of God, and it was oppressed by the Syrian invaders. He is one of the three kings omitted by Matthew (<a href=\"#\" onClick=\"return mV('Mat',1,8);\">Mat 1:8</a>) in the genealogy of Christ, the other two being Ahaziah and Amaziah. He was buried in the city of David (<a href=\"#\" onClick=\"return mV('2Ki',12,21);\">2Ki 12:21</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002078');\">JOASH [4]</a>.)<br><br>(2.) The son and successor of Jehoahaz, king of Israel (<a href=\"#\" onClick=\"return mV('2Ki',14,1);\">2Ki 14:1</a>; <a href=\"#\" onClick=\"return mV('2Ki',12,1);\">2Ki 12:1</a>; <a href=\"#\" onClick=\"return mV('2Ki',13,10);\">13:10</a>). When he ascended the throne the kingdom was suffering from the invasion of the Syrians. Hazael \"was cutting Israel short.\" He tolerated the worship of the golden calves, yet seems to have manifested a character of sincere devotion to the God of his fathers. He held the prophet Elisha in honour, and wept by his bedside when he was dying, addressing him in the words Elisha himself had used when Elijah was carried up into heaven: \"O my father, my father, the chariot of Israel and the horsemen thereof.\" He was afterwards involved in war with Amaziah, the king of Judah (<a href=\"#\" onClick=\"return mV('2Ch',25,23,24);\">2Ch 25:23-24</a>), whom he utterly defeated at Beth-shemesh, on the borders of Dan and Philistia, and advancing on Jerusalem, broke down a portion of the wall, and carried away the treasures of the temple and the palace. He soon after died (B.C. 825), and was buried in Samaria (<a href=\"#\" onClick=\"return mV('2Ki',14,'1-17',19,20);\">2Ki 14:1-17, 19-20</a>). He was succeeded by his son. (See  <a href=\"#\" onClick=\"return doDictLookup('ET0002078');\">JOASH [5.]</a>.)";
eastonArray["$$T0002006"] = "<strong>Jehohanan:</strong> Jehovah-granted, Jeroboam II.<br><br>(1.) A Korhite, the head of one of the divisions of the temple porters (<a href=\"#\" onClick=\"return mV('1Ch',26,3);\">1Ch 26:3</a>).<br><br>(2.) One of Jehoshaphat's \"captains\" (<a href=\"#\" onClick=\"return mV('2Ch',17,15);\">2Ch 17:15</a>).<br><br>(3.) The father of Azariah (<a href=\"#\" onClick=\"return mV('2Ch',28,12);\">2Ch 28:12</a>).<br><br>(4.) The son of Tobiah, an enemy of the Jews (<a href=\"#\" onClick=\"return mV('Neh',6,18);\">Neh 6:18</a>).<br><br>(5.) <a href=\"#\" onClick=\"return mV('Neh',12,42);\">Neh 12:42</a>.<br><br>(6.) <a href=\"#\" onClick=\"return mV('Neh',12,13);\">Neh 12:13</a>.";
eastonArray["$$T0002007"] = "<strong>Jehoiachin:</strong> succeeded his father Jehoiakin (B.C. 599) when only eight years of age, and reigned for one hundred days (<a href=\"#\" onClick=\"return mV('2Ch',36,9);\">2Ch 36:9</a>). He is also called Jeconiah (<a href=\"#\" onClick=\"return mV('Jer',24,1);\">Jer 24:1</a>; <a href=\"#\" onClick=\"return mV('Jer',27,20);\">27:20</a>, etc.), and Coniah (<a href=\"#\" onClick=\"return mV('Jer',22,24);\">22:24</a>; <a href=\"#\" onClick=\"return mV('Jer',37,1);\">37:1</a>). He was succeeded by his uncle, Mattaniah = Zedekiah (q.v.). He was the last direct heir to the Jewish crown. He was carried captive to Babylon by Nebuchadnezzar, along with the flower of the nobility, all the leading men in Jerusalem, and a great body of the general population, some thirteen thousand in all (<a href=\"#\" onClick=\"return mV('2Ki',24,'12-16');\">2Ki 24:12-16</a>; <a href=\"#\" onClick=\"return mV('Jer',52,28);\">Jer 52:28</a>). After an imprisonment of thirty-seven years (<a href=\"#\" onClick=\"return mV('Jer',52,31,33);\">Jer 52:31, 33</a>), he was liberated by Evil-merodach, and permitted to occupy a place in the king's household and sit at his table, receiving \"every day a portion until the day of his death, all the days of his life\" (<a href=\"#\" onClick=\"return mV('Jer',52,'32-34');\">52:32-34</a>).";
eastonArray["$$T0002008"] = "<strong>Jehoiada:</strong> Jehovah-known.<br><br>(1.) The father of Benaiah, who was one of David's chief warriors (<a href=\"#\" onClick=\"return mV('2Sa',8,18);\">2Sa 8:18</a>; <a href=\"#\" onClick=\"return mV('2Sa',20,23);\">20:23</a>).<br><br>(2.) The high priest at the time of Athaliah's usurpation of the throne of Judah. He married Jehosheba, or Jehoshabeath, the daughter of king Jehoram (<a href=\"#\" onClick=\"return mV('2Ch',22,11);\">2Ch 22:11</a>), and took an active part along with his wife in the preservation and training of Jehoash when Athaliah slew all the royal family of Judah.<br><br>The plans he adopted in replacing Jehoash on the throne of his ancestors are described in <a href=\"#\" onClick=\"return mV('2Ki',11,2);\">2Ki 11:2</a>; <a href=\"#\" onClick=\"return mV('2Ki',12,2);\">12:2</a>; <a href=\"#\" onClick=\"return mV('2Ch',22,11);\">2Ch 22:11</a>; <a href=\"#\" onClick=\"return mV('2Ch',23,24);\">23:24</a>. He was among the foremost of the benefactors of the kingdom, and at his death was buried in the city of David among the kings of Judah (<a href=\"#\" onClick=\"return mV('2Ch',24,15,16);\">2Ch 24:15-16</a>). He is said to have been one hundred and thirty years old.";
eastonArray["$$T0002009"] = "<strong>Jehoiakim:</strong> he whom Jehovah has set up, the second son of Josiah, and eighteenth king of Judah, which he ruled over for eleven years (B.C. 610-599). His original name was Eliakim (q.v.).<br><br>On the death of his father his younger brother Jehoahaz (<a href=\"#\" onClick=\"return mV('Jer',22,11);\">Jer 22:11</a>), who favoured the Chaldeans against the Egyptians, was made king by the people; but the king of Egypt, Pharaoh-necho, invaded the land and deposed Jehoahaz (<a href=\"#\" onClick=\"return mV('2Ki',23,33,34);\">2Ki 23:33-34</a>; <a href=\"#\" onClick=\"return mV('Jer',22,'10-12');\">Jer 22:10-12</a>), setting Eliakim on the throne in his stead, and changing his name to Jehoiakim.<br><br>After this the king of Egypt took no part in Jewish politics, having been defeated by the Chaldeans at Carchemish (<a href=\"#\" onClick=\"return mV('2Ki',24,7);\">2Ki 24:7</a>; <a href=\"#\" onClick=\"return mV('Jer',46,2);\">Jer 46:2</a>). Palestine was now invaded and conquered by Nebuchadnezzar. Jehoiakim was taken prisoner and carried captive to Babylon (<a href=\"#\" onClick=\"return mV('2Ch',36,6,7);\">2Ch 36:6-7</a>). It was at this time that Daniel also and his three companions were taken captive to Babylon (<a href=\"#\" onClick=\"return mV('Dan',1,1,2);\">Dan 1:1-2</a>).<br><br>Nebuchadnezzar reinstated Jehoiakim on his throne, but treated him as a vassal king. In the year after this, Jeremiah caused his prophecies to be read by Baruch in the court of the temple. Jehoiakim, hearing of this, had them also read in the royal palace before himself. The words displeased him, and taking the roll from the hands of Baruch he cut it in pieces and threw it into the fire (<a href=\"#\" onClick=\"return mV('Jer',36,23);\">Jer 36:23</a>). During his disastrous reign there was a return to the old idolatry and corruption of the days of Manasseh.<br><br>After three years of subjection to Babylon, Jehoiakim withheld his tribute and threw off the yoke (<a href=\"#\" onClick=\"return mV('2Ki',24,1);\">2Ki 24:1</a>), hoping to make himself independent. Nebuchadnezzar sent bands of Chaldeans, Syrians, and Ammonites (<a href=\"#\" onClick=\"return mV('2Ki',24,2);\">2Ki 24:2</a>) to chastise his rebellious vassal. They cruelly harassed the whole country (<a href=\"#\" onClick=\"return mV('Jer',49,'1-6');\">Jer 49:1-6</a>). The king came to a violent death, and his body having been thrown over the wall of Jerusalem, to convince the beseieging army that he was dead, after having been dragged away, was buried beyond the gates of Jerusalem \"with the burial of an ass,\" B.C. 599 (<a href=\"#\" onClick=\"return mV('Jer',22,18,19);\">Jer 22:18-19</a>; <a href=\"#\" onClick=\"return mV('Jer',36,30);\">36:30</a>). Nebuchadnezzar placed his son Jehoiachin on the throne, wishing still to retain the kingdom of Judah as tributary to him.";
eastonArray["$$T0002010"] = "<strong>Jehoiarib:</strong> Jehovah defends, a priest at Jerusalem, head of one of the sacerdotal courses (<a href=\"#\" onClick=\"return mV('1Ch',9,10);\">1Ch 9:10</a>; <a href=\"#\" onClick=\"return mV('1Ch',24,7);\">24:7</a>). His \"course\" went up from Babylon after the Exile (<a href=\"#\" onClick=\"return mV('Ezr',2,'36-39');\">Ezr 2:36-39</a>; <a href=\"#\" onClick=\"return mV('Neh',7,'39-42');\">Neh 7:39-42</a>).";
eastonArray["$$T0002011"] = "<strong>Jehonadab:</strong> Jehovah is liberal; or, whom Jehovah impels.<br><br>(1.) A son of Shimeah, and nephew of David. It was he who gave the fatal wicked advice to Amnon, the heir to the throne (<a href=\"#\" onClick=\"return mV('2Sa',13,'3-6');\">2Sa 13:3-6</a>). He was very \"subtil,\" but unprincipled.<br><br>(2.) A son of Rechab, the founder of a tribe who bound themselves by a vow to abstain from wine (<a href=\"#\" onClick=\"return mV('Jer',35,'6-19');\">Jer 35:6-19</a>). There were different settlements of Rechabites (<a href=\"#\" onClick=\"return mV('Jdg',1,16);\">Jdg 1:16</a>; <a href=\"#\" onClick=\"return mV('Jdg',4,11);\">4:11</a>; <a href=\"#\" onClick=\"return mV('1Ch',2,55);\">1Ch 2:55</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0003080');\">RECHABITE</a>.) His interview and alliance with Jehu are mentioned in <a href=\"#\" onClick=\"return mV('2Ki',10,'15-23');\">2Ki 10:15-23</a>. He went with Jehu in his chariot to Samaria.";
eastonArray["$$T0002012"] = "<strong>Jehonathan:</strong> whom Jehovah gave.<br><br>(1.) One of the stewards of David's store-houses (<a href=\"#\" onClick=\"return mV('1Ch',27,25);\">1Ch 27:25</a>).<br><br>(2.) A Levite who taught the law to the people of Judah (<a href=\"#\" onClick=\"return mV('2Ch',17,8);\">2Ch 17:8</a>).<br><br>(3.) <a href=\"#\" onClick=\"return mV('Neh',12,18);\">Neh 12:18</a>.";
eastonArray["$$T0002013"] = "<strong>Jehoram:</strong> Jehovah-exalted.<br><br>(1.) Son of Toi, king of Hamath, sent by his father to congratulate David on the occasion of his victory over Hadadezer (<a href=\"#\" onClick=\"return mV('2Sa',8,10);\">2Sa 8:10</a>).<br><br>(2.) A Levite of the family of Gershom (<a href=\"#\" onClick=\"return mV('1Ch',26,25);\">1Ch 26:25</a>).<br><br>(3.) A priest sent by Jehoshaphat to instructruct the people in Judah (<a href=\"#\" onClick=\"return mV('2Ch',17,8);\">2Ch 17:8</a>).<br><br>(4.) The son of Ahab and Jezebel, and successor to his brother Ahaziah on the throne of Israel. He reigned twelve years, B.C. 896-884 (<a href=\"#\" onClick=\"return mV('2Ki',1,17);\">2Ki 1:17</a>; <a href=\"#\" onClick=\"return mV('2Ki',3,1);\">3:1</a>). His first work was to reduce to subjection the Moabites, who had asserted their independence in the reign of his brother. Jehoshaphat, king of Judah, assisted Jehoram in this effort. He was further helped by his ally the king of Edom. Elisha went forth with the confederated army (<a href=\"#\" onClick=\"return mV('2Ki',3,'1-19');\">2Ki 3:1-19</a>), and at the solicitation of Jehoshaphat encouraged the army with the assurance from the Lord of a speedy victory. The Moabites under Mesha their king were utterly routed and their cities destroyed. At Kir-haraseth Mesha made a final stand. The Israelites refrained from pressing their victory further, and returned to their own land.<br><br>Elisha afterwards again befriended Jehoram when a war broke out between the Syrians and Israel, and in a remarkable way brought that war to a bloodless close (<a href=\"#\" onClick=\"return mV('2Ki',6,23);\">2Ki 6:23</a>). But Jehoram, becoming confident in his own power, sank into idolatry, and brought upon himself and his land another Syrian invasion, which led to great suffering and distress in Samaria (<a href=\"#\" onClick=\"return mV('2Ki',6,'24-33');\">2Ki 6:24-33</a>). By a remarkable providential interposition the city was saved from utter destruction, and the Syrians were put to flight (<a href=\"#\" onClick=\"return mV('2Ki',7,'6-15');\">2Ki 7:6-15</a>).<br><br>Jehoram was wounded in a battle with the Syrians at Ramah, and obliged to return to Jezreel (<a href=\"#\" onClick=\"return mV('2Ki',8,29);\">2Ki 8:29</a>; <a href=\"#\" onClick=\"return mV('2Ki',9,14,15);\">9:14-15</a>), and soon after the army proclaimed their leader Jehu king of Israel, and revolted from their allegiance to Jehoram (<a href=\"#\" onClick=\"return mV('2Ki',9,'1-')\">2Ki 9</a>). Jehoram was pierced by an arrow from Jehu's bow on the piece of ground at Jezreel which Ahab had taken from Naboth, and there he died (<a href=\"#\" onClick=\"return mV('2Ki',9,'21-29');\">2Ki 9:21-29</a>).<br><br>(5.) The eldest son and successor of Jehoshaphat, king of Judah. He reigned eight years (B.C. 892-885) alone as king of Judah, having been previously for some years associated with his father (<a href=\"#\" onClick=\"return mV('2Ch',21,5,20);\">2Ch 21:5, 20</a>; <a href=\"#\" onClick=\"return mV('2Ki',8,16);\">2Ki 8:16</a>). His wife was Athaliah, the daughter of Ahab and Jezebel. His daughter Jehosheba was married to the high priest Jehoiada. He sank into gross idolatry, and brought upon himself and his kingdom the anger of Jehovah. The Edomites revolted from under his yoke, and the Philistines and the Arabians and Cushites invaded the land, and carried away great spoil, along with Jehoram's wives and all his children, except Ahaziah. He died a painful death from a fearful malady, and was refused a place in the sepulchre of the kings (<a href=\"#\" onClick=\"return mV('2Ki',8,'16-24');\">2Ki 8:16-24</a>; <a href=\"#\" onClick=\"return mV('2Ch',21,'1-')\">2Ch 21</a>).";
eastonArray["$$T0002014"] = "<strong>Jehoshaphat:</strong> Jehovah-judged.<br><br>(1.) One of David's body-guard (<a href=\"#\" onClick=\"return mV('1Ch',11,43);\">1Ch 11:43</a>).<br><br>(2.) One of the priests who accompanied the removal of the ark to Jerusalem (<a href=\"#\" onClick=\"return mV('1Ch',15,24);\">1Ch 15:24</a>).<br><br>(3.) Son of Ahilud, \"recorder\" or annalist under David and Solomon (<a href=\"#\" onClick=\"return mV('2Sa',8,16);\">2Sa 8:16</a>), a state officer of high rank, chancellor or vizier of the kingdom.<br><br>(4.) Solomon's purveyor in Issachar (<a href=\"#\" onClick=\"return mV('1Ki',4,17);\">1Ki 4:17</a>).<br><br>(5.) The son and successor of Asa, king of Judah. After fortifying his kingdom against Israel (<a href=\"#\" onClick=\"return mV('2Ch',17,1,2);\">2Ch 17:1-2</a>), he set himself to cleanse the land of idolatry (<a href=\"#\" onClick=\"return mV('1Ki',22,43);\">1Ki 22:43</a>). In the third year of his reign he sent out priests and Levites over the land to instruct the people in the law (<a href=\"#\" onClick=\"return mV('2Ch',17,'7-9');\">2Ch 17:7-9</a>). He enjoyed a great measure of peace and prosperity, the blessing of God resting on the people \"in their basket and their store.\"<br><br>The great mistake of his reign was his entering into an alliance with Ahab, the king of Israel, which involved him in much disgrace, and brought disaster on his kingdom (<a href=\"#\" onClick=\"return mV('1Ki',22,'1-33');\">1Ki 22:1-33</a>). Escaping from the bloody battle of Ramoth-gilead, the prophet Jehu (<a href=\"#\" onClick=\"return mV('2Ch',19,'1-3');\">2Ch 19:1-3</a>) reproached him for the course he had been pursuing, whereupon he entered with rigour on his former course of opposition to all idolatry, and of deepening interest in the worship of God and in the righteous government of the people (<a href=\"#\" onClick=\"return mV('2Ch',19,'4-11');\">2Ch 19:4-11</a>).<br><br>Again he entered into an alliance with Ahaziah, the king of Israel, for the purpose of carrying on maritime commerce with Ophir. But the fleet that was then equipped at Ezion-gaber was speedily wrecked. A new fleet was fitted out without the co-operation of the king of Israel, and although it was successful, the trade was not prosecuted (<a href=\"#\" onClick=\"return mV('2Ch',20,'35-37');\">2Ch 20:35-37</a>; <a href=\"#\" onClick=\"return mV('1Ki',22,48,49);\">1Ki 22:48-49</a>).<br><br>He subsequently joined Jehoram, king of Israel, in a war against the Moabites, who were under tribute to Israel. This war was successful. The Moabites were subdued; but the dreadful act of Mesha in offering his own son a sacrifice on the walls of Kir-haresheth in the sight of the armies of Israel filled him with horror, and he withdrew and returned to his own land (<a href=\"#\" onClick=\"return mV('2Ki',3,'4-27');\">2Ki 3:4-27</a>).<br><br>The last most notable event of his reign was that recorded in <a href=\"#\" onClick=\"return mV('2Ch',20,'1-');\">2Ch 20</a>. The Moabites formed a great and powerful confederacy with the surrounding nations, and came against Jehoshaphat. The allied forces were encamped at Engedi. The king and his people were filled with alarm, and betook themselves to God in prayer. The king prayed in the court of the temple, \"O our God, wilt thou not judge them? for we have no might against this great company that cometh against us.\" Amid the silence that followed, the voice of Jahaziel the Levite was heard announcing that on the morrow all this great host would be overthrown. So it was, for they quarrelled among themselves, and slew one another, leaving to the people of Judah only to gather the rich spoils of the slain. This was recognized as a great deliverance wrought for them by God (B.C. 890). Soon after this Jehoshaphat died, after a reign of twenty-five years, being sixty years of age, and was succeeded by his son Jehoram (<a href=\"#\" onClick=\"return mV('1Ki',22,50);\">1Ki 22:50</a>). He had this testimony, that \"he sought the Lord with all his heart\" (<a href=\"#\" onClick=\"return mV('2Ch',22,9);\">2Ch 22:9</a>). The kingdom of Judah was never more prosperous than under his reign.<br><br>(6.) The son of Nimshi, and father of Jehu, king of Israel (<a href=\"#\" onClick=\"return mV('2Ki',9,2,14);\">2Ki 9:2, 14</a>).";
eastonArray["$$T0002015"] = "<strong>Jehoshaphat, Valley of:</strong> mentioned in Scripture only in <a href=\"#\" onClick=\"return mV('Joe',3,2,12);\">Joe 3:2, 12</a>. This is the name given in modern times to the valley between Jerusalem and the Mount of Olives, and the Kidron flows through it. Here Jehoshaphat overthrew the confederated enemies of Israel (<a href=\"#\" onClick=\"return mV('Psa',83,'6-8');\">Psa 83:6-8</a>); and in this valley also God was to overthrow the Tyrians, Zidonians, etc. (<a href=\"#\" onClick=\"return mV('Joe',3,4,19);\">Joe 3:4, 19</a>), with an utter overthrow. This has been fulfilled; but Joel speaks of the final conflict, when God would destroy all Jerusalem's enemies, of whom Tyre and Zidon, etc., were types. The \"valley of Jehoshaphat\" may therefore be simply regarded as a general term for the theatre of God's final judgments on the enemies of Israel.<br><br>This valley has from ancient times been used by the Jews as a burial-ground. It is all over paved with flat stones as tombstones, bearing on them Hebrew inscriptions.";
eastonArray["$$T0002016"] = "<strong>Jehosheba:</strong> Jehovah-swearing, the daughter of Jehoram, the king of Israel. She is called Jehoshabeath in <a href=\"#\" onClick=\"return mV('2Ch',22,11);\">2Ch 22:11</a>. She was the only princess of the royal house who was married to a high priest, Jehoiada (<a href=\"#\" onClick=\"return mV('2Ch',22,11);\">2Ch 22:11</a>).";
eastonArray["$$T0002017"] = "<strong>Jehovah:</strong> the special and significant name (not merely an appellative title such as Lord [adonai]) by which God revealed himself to the ancient Hebrews (<a href=\"#\" onClick=\"return mV('Exd',6,2,3);\">Exd 6:2-3</a>). This name, the Tetragrammaton of the Greeks, was held by the later Jews to be so sacred that it was never pronounced except by the high priest on the great Day of Atonement, when he entered into the most holy place. Whenever this name occurred in the sacred books they pronounced it, as they still do, \"Adonai\" (i.e., Lord), thus using another word in its stead. The Massorets gave to it the vowel-points appropriate to this word. This Jewish practice was founded on a false interpretation of <a href=\"#\" onClick=\"return mV('Lev',24,16);\">Lev 24:16</a>. The meaning of the word appears from <a href=\"#\" onClick=\"return mV('Exd',3,14);\">Exd 3:14</a> to be \"the unchanging, eternal, self-existent God,\" the \"I am that I am,\" a convenant-keeping God. (<a href=\"#\" onClick=\"return mV('Mal',3,6);\">Mal 3:6</a>; <a href=\"#\" onClick=\"return mV('Hsa',12,5);\">Hsa 12:5</a>; <a href=\"#\" onClick=\"return mV('Rev',1,4, 8);\">Rev 1:4, 8</a>.)<br><br>The Hebrew name \"Jehovah\" is generally translated in the Authorized Version (and the Revised Version has not departed from this rule) by the word LORD printed in small capitals, to distinguish it from the rendering of the Hebrew <i>Adonai</i> and the Greek <i>Kurios</i>, which are also rendered Lord, but printed in the usual type. The Hebrew word is translated \"Jehovah\" only in <a href=\"#\" onClick=\"return mV('Exd',6,3);\">Exd 6:3</a>; <a href=\"#\" onClick=\"return mV('Psa',83,18);\">Psa 83:18</a>; <a href=\"#\" onClick=\"return mV('Isa',12,2);\">Isa 12:2</a>; <a href=\"#\" onClick=\"return mV('Isa',26,4);\">26:4</a>, and in the compound names mentioned below.<br><br>It is worthy of notice that this name is never used in the LXX., the Samaritan Pentateuch, the Apocrypha, or in the New Testament. It is found, however, on the \"Moabite stone\" (q.v.), and consequently it must have been in the days of Mesba so commonly pronounced by the Hebrews as to be familiar to their heathen neighbours.";
eastonArray["$$T0002018"] = "<strong>Jehovah-jireh:</strong> Jehovah will see; i.e., will provide, the name given by Abraham to the scene of his offering up the ram which was caught in the thicket on Mount Moriah. The expression used in <a href=\"#\" onClick=\"return mV('Gen',22,14);\">Gen 22:14</a>, \"in the mount of the Lord it shall be seen,\" has been regarded as equivalent to the saying, \"Man's extremity is God's opportunity.\"";
eastonArray["$$T0002019"] = "<strong>Jehovah-nissi:</strong> Jehovah my banner, the title given by Moses to the altar which he erected on the hill on the top of which he stood with uplifted hands while Israel prevailed over their enemies the Amalekites (<a href=\"#\" onClick=\"return mV('Exd',17,15);\">Exd 17:15</a>).";
eastonArray["$$T0002020"] = "<strong>Jehovah-shalom:</strong> Jehovah send peace, the name which Gideon gave to the altar he erected on the spot at Ophrah where the angel appeared to him (<a href=\"#\" onClick=\"return mV('Jdg',6,24);\">Jdg 6:24</a>).";
eastonArray["$$T0002021"] = "<strong>Jehovah-shammah:</strong> Jehovah is there, the symbolical title given by Ezekiel to Jerusalem, which was seen by him in vision (<a href=\"#\" onClick=\"return mV('Eze',48,35);\">Eze 48:35</a>). It was a type of the gospel Church.";
eastonArray["$$T0002022"] = "<strong>Jehovah-tsidkenu:</strong> Jehovah our rightousness, rendered in the Authorized Version, \"The LORD our righteousness,\" a title given to the Messiah (<a href=\"#\" onClick=\"return mV('Jer',23,6);\">Jer 23:6</a>, marg.), and also to Jerusalem (<a href=\"#\" onClick=\"return mV('Jer',33,16);\">33:16</a>, marg.).";
eastonArray["$$T0002023"] = "<strong>Jehozabad:</strong> Jehovah-given.<br><br>(1.) The son of Obed-edom (<a href=\"#\" onClick=\"return mV('1Ch',26,4);\">1Ch 26:4</a>), one of the Levite porters.<br><br>(2.) The son of Shomer, one of the two conspirators who put king Jehoash to death in Millo in Jerusalem (<a href=\"#\" onClick=\"return mV('2Ki',12,21);\">2Ki 12:21</a>).<br><br>(3.) <a href=\"#\" onClick=\"return mV('2Ch',17,18);\">2Ch 17:18</a>.";
eastonArray["$$T0002024"] = "<strong>Jehozadak:</strong> Jehovah-justified, the son of the high priest Seraiah at the time of the Babylonian exile (<a href=\"#\" onClick=\"return mV('1Ch',6,14,15);\">1Ch 6:14-15</a>). He was carried into captivity by Nebuchadnezzar, and probably died in Babylon. He was the father of Jeshua, or Joshua, who returned with Zerubbabel.";
eastonArray["$$T0002025"] = "<strong>Jehu:</strong> Jehovah is he.<br><br>(1.) The son of Obed, and father of Azariah (<a href=\"#\" onClick=\"return mV('1Ch',2,38);\">1Ch 2:38</a>).<br><br>(2.) One of the Benjamite slingers that joined David at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,3);\">1Ch 12:3</a>).<br><br>(3.) The son of Hanani, a prophet of Judah (<a href=\"#\" onClick=\"return mV('1Ki',16,1,7);\">1Ki 16:1, 7</a>; <a href=\"#\" onClick=\"return mV('2Ch',19,2);\">2Ch 19:2</a>; <a href=\"#\" onClick=\"return mV('2Ch',20,34);\">20:34</a>), who pronounced the sentence of God against Baasha, the king of Israel.<br><br>(4.) King of Israel, the son of Jehoshaphat (<a href=\"#\" onClick=\"return mV('2Ki',9,2);\">2Ki 9:2</a>), and grandson of Nimshi. The story of his exaltation to the throne is deeply interesting. During the progress of a war against the Syrians, who were becoming more and more troublesome to Israel, in a battle at Ramoth-gilead Jehoram, the king of Israel, had been wounded; and leaving his army there, had returned to Jezreel, whither his ally, Ahaziah, king of Judah, had also gone on a visit of sympathy with him (<a href=\"#\" onClick=\"return mV('2Ki',8,28,29);\">2Ki 8:28-29</a>). The commanders, being left in charge of the conduct of the war, met in council; and while engaged in their deliberations, a messenger from Elisha appeared in the camp, and taking Jehu from the council, led him into a secret chamber, and there anointed him king over Israel, and immediately retired and disappeared (<a href=\"#\" onClick=\"return mV('2Ki',9,5,6);\">2Ki 9:5-6</a>). On being interrogated by his companions as to the object of this mysterious visitor, he informed them of what had been done, when immediately, with the utmost enthusiasm, they blew their trumpets and proclaimed him king (<a href=\"#\" onClick=\"return mV('2Ki',9,'11-14');\">2Ki 9:11-14</a>). He then with a chosen band set forth with all speed to Jezreel, where, with his own hand, he slew Jehoram, shooting him through the heart with an arrow (<a href=\"#\" onClick=\"return mV('2Ki',9,24);\">9:24</a>). The king of Judah, when trying to escape, was fatally wounded by one of Jehu's soldiers at Beth-gan. On entering the city, Jehu commanded the eunchs of the royal palace to cast down Jezebel into the street, where her mangled body was trodden under foot by the horses. Jehu was now master of Jezreel, whence he communicated with the persons in authority in Samaria the capital, commanding them to appear before him on the morrow with the heads of all the royal princes of Samaria. Accordingly on the morrow seventy heads were piled up in two heaps at his gate. At \"the shearing-house\" (<a href=\"#\" onClick=\"return mV('2Ki',10,'12-14');\">2Ki 10:12-14</a>) other forty-two connected with the house of Ahab were put to death (<a href=\"#\" onClick=\"return mV('2Ki',10,14);\">2Ki 10:14</a>). As Jehu rode on toward Samaria, he met Jehonadab (q.v.), whom he took into his chariot, and they entered the capital together. By a cunning stratagem he cut off all the worshippers of Baal found in Samaria (<a href=\"#\" onClick=\"return mV('2Ki',10,'19-25');\">2Ki 10:19-25</a>), and destroyed the temple of the idol (<a href=\"#\" onClick=\"return mV('2Ki',10,27);\">2Ki 10:27</a>).<br><br>Notwithstanding all this apparent zeal for the worship of Jehovah, Jehu yet tolerated the worship of the golden calves at Dan and Bethel. For this the divine displeasure rested upon him, and his kingdom suffered disaster in war with the Syrians (<a href=\"#\" onClick=\"return mV('2Ki',10,'29-33');\">2Ki 10:29-33</a>). He died after a reign of twenty-eight years (B.C. 884-856), and was buried in Samaria (<a href=\"#\" onClick=\"return mV('2Ki',10,'34-36');\">10:34-36</a>). \"He was one of those decisive, terrible, and ambitious, yet prudent, calculating, and passionless men whom God from time to time raises up to change the fate of empires and execute his judgments on the earth.\" He was the first Jewish king who came in contact with the Assyrian power in the time of Shalmaneser II.";
eastonArray["$$T0002026"] = "<strong>Jehucal:</strong> able, the son of Shelemiah. He is also called Jucal (<a href=\"#\" onClick=\"return mV('Jer',38,1);\">Jer 38:1</a>). He was one of the two persons whom Zedekiah sent to request the prophet Jeremiah to pray for the kingdom (<a href=\"#\" onClick=\"return mV('Jer',37,3);\">Jer 37:3</a>) during the time of its final siege by Nebuchadnezzar. He was accompanied by Zephaniah (q.v.).";
eastonArray["$$T0002027"] = "<strong>Jehudi:</strong> a Jew, son of Nethaniah. He was sent by the princes to invite Baruch to read Jeremiah's roll to them (<a href=\"#\" onClick=\"return mV('Jer',36,14,21);\">Jer 36:14, 21</a>).";
eastonArray["$$T0002028"] = "<strong>Jeiel:</strong> snatched away by God.<br><br>(1.) A descendant of Benjamin (<a href=\"#\" onClick=\"return mV('1Ch',9,35);\">1Ch 9:35</a>; <a href=\"#\" onClick=\"return mV('1Ch',8,29);\">8:29</a>).<br><br>(2.) One of the Levites who took part in praising God on the removal of the ark to Jerusalem (<a href=\"#\" onClick=\"return mV('1Ch',16,5);\">1Ch 16:5</a>).<br><br>(3.) <a href=\"#\" onClick=\"return mV('2Ch',29,13);\">2Ch 29:13</a>. A Levite of the sons of Asaph.<br><br>(4.) <a href=\"#\" onClick=\"return mV('2Ch',26,11);\">2Ch 26:11</a>. A scribe.<br><br>(5.) <a href=\"#\" onClick=\"return mV('1Ch',5,7);\">1Ch 5:7</a>. A Reubenite chief.<br><br>(6.) One of the chief Levites, who made an offering for the restoration of the Passover by Josiah (<a href=\"#\" onClick=\"return mV('2Ch',35,9);\">2Ch 35:9</a>).<br><br>(7.) <a href=\"#\" onClick=\"return mV('Ezr',8,13);\">Ezr 8:13</a>.<br><br>(8.) <a href=\"#\" onClick=\"return mV('Ezr',10,43);\">Ezr 10:43</a>.";
eastonArray["$$T0002029"] = "<strong>Jemima:</strong> dove, the eldest of Job's three daughters born after his time of trial (<a href=\"#\" onClick=\"return mV('Job',42,14);\">Job 42:14</a>).";
eastonArray["$$T0002030"] = "<strong>Jephthah:</strong> whom God sets free, or the breaker through, a \"mighty man of valour\" who delivered Israel from the oppression of the Ammonites (<a href=\"#\" onClick=\"return mV('Jdg',11,'1-33');\">Jdg 11:1-33</a>), and judged Israel six years (<a href=\"#\" onClick=\"return mV('Jdg',12,7);\">12:7</a>). He has been described as \"a wild, daring, Gilead mountaineer, a sort of warrior Elijah.\" After forty-five years of comparative quiet Israel again apostatized, and in \"process of time the children of Ammon made war against Israel\" (<a href=\"#\" onClick=\"return mV('Jdg',11,5);\">11:5</a>). In their distress the elders of Gilead went to fetch Jephthah out of the land of Tob, to which he had fled when driven out wrongfully by his brothers from his father's inheritance (<a href=\"#\" onClick=\"return mV('Jdg',11,2);\">2</a>), and the people made him their head and captain. The \"elders of Gilead\" in their extremity summoned him to their aid, and he at once undertook the conduct of the war against Ammon. Twice he sent an embassy to the king of Ammon, but in vain. War was inevitable. The people obeyed his summons, and \"the spirit of the Lord came upon him.\" Before engaging in war he vowed that if successful he would offer as a \"burnt-offering\" whatever would come out of the door of his house first to meet him on his return. The defeat of the Ammonites was complete. \"He smote them from Aroer, even till thou come to Minnith, even twenty cities, and unto the plain of the vineyards [Heb. 'Abel Keramim], with a very great slaughter\" (<a href=\"#\" onClick=\"return mV('Jdg',11,33);\">Jdg 11:33</a>). The men of Ephraim regarded themselves as insulted in not having been called by Jephthah to go with him to war against Ammon. This led to a war between the men of Gilead and Ephraim (<a href=\"#\" onClick=\"return mV('Jdg',12,4);\">12:4</a>), in which many of the Ephraimites perished. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003366');\">SHIBBOLETH</a>.) \"Then died Jephthah the Gileadite, and was buried in one of the cities of Gilead\" (<a href=\"#\" onClick=\"return mV('Jdg',12,7);\">7</a>).";
eastonArray["$$T0002031"] = "<strong>Jephthah's vow:</strong> (<a href=\"#\" onClick=\"return mV('Jdg',11,30,31);\">Jdg 11:30-31</a>). After a crushing defeat of the Ammonites, Jephthah returned to his own house, and the first to welcome him was his own daughter. This was a terrible blow to the victor, and in his despair he cried out, \"Alas, my daughter! thou hast brought me very low...I have opened my mouth unto the Lord, and cannot go back.\" With singular nobleness of spirit she answered, \"Do to me according to that which hath proceeded out of thy mouth.\" She only asked two months to bewail her maidenhood with her companions upon the mountains. She utters no reproach against her father's rashness, and is content to yield her life since her father has returned a conqueror. But was it so? Did Jephthah offer up his daughter as a \"burnt-offering\"? This question has been much debated, and there are many able commentators who argue that such a sacrifice was actually offered. We are constrained, however, by a consideration of Jephthah's known piety as a true worshipper of Jehovah, his evident acquaintance with the law of Moses, to which such sacrifices were abhorrent (<a href=\"#\" onClick=\"return mV('Lev',18,21);\">Lev 18:21</a>; <a href=\"#\" onClick=\"return mV('Lev',20,'2-5');\">20:2-5</a>; <a href=\"#\" onClick=\"return mV('Deu',12,31);\">Deu 12:31</a>), and the place he holds in the roll of the heroes of the faith in the Epistle to the Hebrews (<a href=\"#\" onClick=\"return mV('Hbr',11,32);\">Hbr 11:32</a>), to conclude that she was only doomed to a life of perpetual celibacy.";
eastonArray["$$T0002032"] = "<strong>Jephunneh:</strong> nimble, or a beholder.<br><br>(1.) The father of Caleb, who was Joshua's companion in exploring Canaan (<a href=\"#\" onClick=\"return mV('Num',13,6);\">Num 13:6</a>), a Kenezite (<a href=\"#\" onClick=\"return mV('Jos',14,14);\">Jos 14:14</a>).<br><br>(2.) One of the descendants of Asher (<a href=\"#\" onClick=\"return mV('1Ch',7,38);\">1Ch 7:38</a>).";
eastonArray["$$T0002033"] = "<strong>Jerahmeel:</strong> loving God.<br><br>(1.) The son of Hezron, the brother of Caleb (<a href=\"#\" onClick=\"return mV('1Ch',2,9,25,26);\">1Ch 2:9, 25-26</a>, etc.).<br><br>(2.) The son of Kish, a Levite (<a href=\"#\" onClick=\"return mV('1Ch',24,29);\">1Ch 24:29</a>).<br><br>(3.) Son of Hammelech (<a href=\"#\" onClick=\"return mV('Jer',36,26);\">Jer 36:26</a>).";
eastonArray["$$T0002034"] = "<strong>Jeremiah:</strong> raised up or appointed by Jehovah.<br><br>(1.) A Gadite who joined David in the wilderness (<a href=\"#\" onClick=\"return mV('1Ch',12,10);\">1Ch 12:10</a>).<br><br>(2.) A Gadite warrior (<a href=\"#\" onClick=\"return mV('1Ch',12,13);\">1Ch 12:13</a>).<br><br>(3.) A Benjamite slinger who joined David at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,4);\">1Ch 12:4</a>).<br><br>(4.) One of the chiefs of the tribe of Manasseh on the east of Jordan (<a href=\"#\" onClick=\"return mV('1Ch',5,24);\">1Ch 5:24</a>).<br><br>(5.) The father of Hamutal (<a href=\"#\" onClick=\"return mV('2Ki',23,31);\">2Ki 23:31</a>), the wife of Josiah.<br><br>(6.) One of the \"greater prophets\" of the Old Testament, son of Hilkiah (q.v.), a priest of Anathoth (<a href=\"#\" onClick=\"return mV('Jer',1,1);\">Jer 1:1</a>; <a href=\"#\" onClick=\"return mV('Jer',32,6);\">32:6</a>). He was called to the prophetical office when still young (<a href=\"#\" onClick=\"return mV('Jer',1,6);\">1:6</a>), in the thirteenth year of Josiah (B.C. 628). He left his native place, and went to reside in Jerusalem, where he greatly assisted Josiah in his work of reformation (<a href=\"#\" onClick=\"return mV('2Ki',23,'1-25');\">2Ki 23:1-25</a>). The death of this pious king was bewailed by the prophet as a national calamity (<a href=\"#\" onClick=\"return mV('2Ch',35,25);\">2Ch 35:25</a>).<br><br>During the three years of the reign of Jehoahaz we find no reference to Jeremiah, but in the beginning of the reign of Jehoiakim the enmity of the people against him broke out in bitter persecution, and he was placed apparently under restraint (<a href=\"#\" onClick=\"return mV('Jer',36,5);\">Jer 36:5</a>). In the fourth year of Jehoiakim he was commanded to write the predictions given to him, and to read them to the people on the fast-day. This was done by Baruch his servant in his stead, and produced much public excitement. The roll was read to the king. In his recklessness he seized the roll, and cut it to pieces, and cast it into the fire, and ordered both Baruch and Jeremiah to be apprehended. Jeremiah procured another roll, and wrote in it the words of the roll the king had destroyed, and \"many like words\" besides (<a href=\"#\" onClick=\"return mV('Jer',36,32);\">Jer 36:32</a>).<br><br>He remained in Jerusalem, uttering from time to time his words of warning, but without effect. He was there when Nebuchadnezzar besieged the city (<a href=\"#\" onClick=\"return mV('Jer',37,4,5);\">Jer 37:4-5</a>), B.C. 589. The rumour of the approach of the Egyptians to aid the Jews in this crisis induced the Chaldeans to withdraw and return to their own land. This, however, was only for a time. The prophet, in answer to his prayer, received a message from God announcing that the Chaldeans would come again and take the city, and burn it with fire (<a href=\"#\" onClick=\"return mV('Jer',37,7,8);\">37:7-8</a>). The princes, in their anger at such a message by Jeremiah, cast him into prison (<a href=\"#\" onClick=\"return mV('Jer',37,'15-21');\">Jer 37:15-21</a>; <a href=\"#\" onClick=\"return mV('Jer',38,'1-13');\">Jer 38:1-13</a>). He was still in confinement when the city was taken (B.C. 588). The Chaldeans released him, and showed him great kindness, allowing him to choose the place of his residence. He accordingly went to Mizpah with Gedaliah, who had been made governor of Judea. Johanan succeeded Gedaliah, and refusing to listen to Jeremiah's counsels, went down into Egypt, taking Jeremiah and Baruch with him (<a href=\"#\" onClick=\"return mV('Jer',43,6);\">Jer 43:6</a>). There probably the prophet spent the remainder of his life, in vain seeking still to turn the people to the Lord, from whom they had so long revolted (<a href=\"#\" onClick=\"return mV('Jer',44,'1-');\">Jer 44</a>). He lived till the reign of Evil-Merodach, son of Nebuchadnezzar, and must have been about ninety years of age at his death. We have no authentic record of his death. He may have died at Tahpanhes, or, according to a tradition, may have gone to Babylon with the army of Nebuchadnezzar; but of this there is nothing certain.";
eastonArray["$$T0002035"] = "<strong>Jeremiah, Book of:</strong> consists of twenty-three separate and independent sections, arranged in five books. <br/><br>I. The introduction, (<a href=\"#\" onClick=\"return mV('Jer',1,'1-')\">Jer 1</a>). <br/><br>II. Reproofs of the sins of the Jews, consisting of seven sections,<br><br>(1.) <a href=\"#\" onClick=\"return mV('Jer',2'1-')\">Jer 2</a>; <br><br>(2.) <a href=\"#\" onClick=\"return mV('Jer',3,'1-')\">Jer 3-6</a>; <br><br>(3.) <a href=\"#\" onClick=\"return mV('Jer',7,'1-')\">Jer 7-10</a>; <br><br>(4.) <a href=\"#\" onClick=\"return mV('Jer',11,'1-')\">Jer 11-13</a>; <br><br>(5.) <a href=\"#\" onClick=\"return mV('Jer',14,'1-')\">Jer 14-Jer 17:18</a>; <br><br>(6.) <a href=\"#\" onClick=\"return mV('Jer',17,'19-');\">Jer 17:19-Jer 20</a>; <br><br>(7.) <a href=\"#\" onClick=\"return mV('Jer',21,'1-')\">Jer 21-24</a>. <br><br>III. A general review of all nations, in two sections, <br><br>(1.) <a href=\"#\" onClick=\"return mV('Jer',46,'1-')\">Jer 46-49</a>; <br><br>(2.) <a href=\"#\" onClick=\"return mV('Jer',25,'1-')\">Jer 25</a>; with an historical appendix of three sections, <br><br>(1.) <a href=\"#\" onClick=\"return mV('Jer',26,'1-')\">Jer 26</a>; <br><br>(2.) <a href=\"#\" onClick=\"return mV('Jer',27,'1-')\">Jer 27</a>; <br><br>(3.) <a href=\"#\" onClick=\"return mV('Jer',28,'1-')\">Jer 28</a>; <a href=\"#\" onClick=\"return mV('Jer',29,'1-')\">29</a>. <br/><br>IV. Two sections picturing the hopes of better times, <br><br>(1.) <a href=\"#\" onClick=\"return mV('Jer',30,'1-')\">Jer 30</a>; <a href=\"#\" onClick=\"return mV('Jer',31,'1-')\">31</a>; <br/><br>(2.) <a href=\"#\" onClick=\"return mV('Jer',32,'1-')\">Jer 32</a>; <a href=\"#\" onClick=\"return mV('Jer',33,'1-')\">33</a>; to which is added an historical appendix in three sections, <br><br>(1.) <a href=\"#\" onClick=\"return mV('Jer',34,'1-7')\">Jer 34:1-7</a>; <br><br>(2.) <a href=\"#\" onClick=\"return mV('Jer',34,'8-22');\">Jer 34:8-22</a>; <br><br>(3.) <a href=\"#\" onClick=\"return mV('Jer',35,'1-')\">Jer 35</a>. <br><br>V. The conclusion, in two sections, <br><br>(1.) <a href=\"#\" onClick=\"return mV('Jer',36,'1-')\">Jer 36</a>; <br><br>(2.) <a href=\"#\" onClick=\"return mV('Jer',45,'1-')\">Jer 45</a>. <br><br>In Egypt, after an interval, Jeremiah is supposed to have added three sections, viz., <a href=\"#\" onClick=\"return mV('Jer',37,'1-')\">Jer 37-39</a>; <a href=\"#\" onClick=\"return mV('Jer',40,'1-')\">40-43</a>; and <a href=\"#\" onClick=\"return mV('Jer',44,'1-')\">44.<br><br>The principal Messianic prophecies are found in (<a href=\"#\" onClick=\"return mV('Jer',23,'1-8');\">Jer 23:1-8</a>; <a href=\"#\" onClick=\"return mV('Jer',31,'31-40');\">Jer 31:31-40</a>; and <a href=\"#\" onClick=\"return mV('Jer',33,'14-26');\">Jer 33:14-26</a>).<br><br>Jeremiah's prophecies are noted for the frequent repetitions found in them of the same words and phrases and imagery. They cover the period of about 30 years. They are not recorded in the order of time. When and under what circumstances this book assumed its present form we know not.<br><br>The LXX. Version of this book is, in its arrangement and in other particulars, singularly at variance with the original. The LXX. omits (<a href=\"#\" onClick=\"return mV('Jer',10,'6-8');\">Jer 10:6-8</a>; <a href=\"#\" onClick=\"return mV('Jer',27,'19-22');\">Jer 27:19-22</a>; <a href=\"#\" onClick=\"return mV('Jer',29,'16-20');\">Jer 29:16-20</a>; <a href=\"#\" onClick=\"return mV('Jer',33,'14-26');\">Jer 33:14-26</a>; <a href=\"#\" onClick=\"return mV('Jer',39,'4-13');\">Jer 39:4-13</a>; <a href=\"#\" onClick=\"return mV('Jer',52,2,3,15,'28-30');\">Jer 52:2-3, 15, 28-30</a>, etc). About 2,700 words in all of the original are omitted. These omissions, etc., are capricious and arbitrary, and render the version unreliable.";
eastonArray["$$T0002036"] = "<strong>Jericho:</strong> place of fragrance, a fenced city in the midst of a vast grove of palm trees, in the plain of Jordan, over against the place where that river was crossed by the Israelites (<a href=\"#\" onClick=\"return mV('Jos',3,16);\">Jos 3:16</a>). Its site was near the 'Ain es-Sultan, Elisha's Fountain (<a href=\"#\" onClick=\"return mV('2Ki',2,'19-22');\">2Ki 2:19-22</a>), about 5 miles west of Jordan. It was the most important city in the Jordan valley (<a href=\"#\" onClick=\"return mV('Num',22,1);\">Num 22:1</a>; <a href=\"#\" onClick=\"return mV('Num',34,15);\">34:15</a>), and the strongest fortress in all the land of Canaan. It was the key to Western Palestine.<br><br>This city was taken in a very remarkable manner by the Israelites (<a href=\"#\" onClick=\"return mV('Jos',6,'1-')\">Jos 6</a>). God gave it into their hands. The city was \"accursed\" (Heb. herem, \"devoted\" to Jehovah), and accordingly (<a href=\"#\" onClick=\"return mV('Jos',6,17);\">Jos 6:17</a>; <a href=\"#\" onClick=\"return mV('Lev',27,28,29);\">Lev 27:28-29</a>; <a href=\"#\" onClick=\"return mV('Deu',13,16);\">Deu 13:16</a>) all the inhabitants and all the spoil of the city were to be destroyed, \"only the silver, and the gold, and the vessels of brass and of iron\" were reserved and \"put into the treasury of the house of Jehovah\" (<a href=\"#\" onClick=\"return mV('Jos',6,24);\">Jos 6:24</a>; <a href=\"#\" onClick=\"return mV('Num',31,22,23,50);\">Num 31:22-23, 50</a>). Only Rahab \"and her father's household, and all that she had,\" were preserved from destruction, according to the promise of the spies (<a href=\"#\" onClick=\"return mV('Jos',2,14);\">Jos 2:14</a>). In one of the Amarna tablets Adoni-zedec (q.v.) writes to the king of Egypt informing him that the 'Abiri (Hebrews) had prevailed, and had taken the fortress of Jericho, and were plundering \"all the king's lands.\" It would seem that the Egyptian troops had before this been withdrawn from Palestine.<br><br>This city was given to the tribe of Benjamin (<a href=\"#\" onClick=\"return mV('Jos',18,21);\">Jos 18:21</a>), and it was inhabited in the time of the Judges (<a href=\"#\" onClick=\"return mV('Jdg',3,13);\">Jdg 3:13</a>; <a href=\"#\" onClick=\"return mV('2Sa',10,5);\">2Sa 10:5</a>). It is not again mentioned till the time of David (<a href=\"#\" onClick=\"return mV('2Sa',10,5);\">2Sa 10:5</a>). \"Children of Jericho\" were among the captives who returned under Zerubbabel <a href=\"#\" onClick=\"return mV('Ezr',2,34);\">Ezr 2:34</a>; <a href=\"#\" onClick=\"return mV('Neh',7,36);\">Neh 7:36</a>). Hiel (q.v.) the Bethelite attempted to make it once more a fortified city (<a href=\"#\" onClick=\"return mV('1Ki',16,34);\">1Ki 16:34</a>). Between the beginning and the end of his undertaking all his children were cut off.<br><br>In New Testament times Jericho stood some distance to the south-east of the ancient one, and near the opening of the valley of Achor. It was a rich and flourishing town, having a considerable trade, and celebrated for the palm trees which adorned the plain around. It was visited by our Lord on his last journey to Jerusalem. Here he gave sight to two blind men (<a href=\"#\" onClick=\"return mV('Mat',20,'29-34');\">Mat 20:29-34</a>; <a href=\"#\" onClick=\"return mV('Mar',10,'46-52');\">Mar 10:46-52</a>), and brought salvation to the house of Zacchaeus the publican (<a href=\"#\" onClick=\"return mV('Luk',19,'2-10');\">Luk 19:2-10</a>).<br><br>The poor hamlet of er-Riha, the representative of modern Jericho, is situated some two miles farther to the east. It is in a ruinous condition, having been destroyed by the Turks in 1840. \"The soil of the plain,\" about the middle of which the ancient city stood, \"is unsurpassed in fertility; there is abundance of water for irrigation, and many of the old aqueducts are almost perfect; yet nearly the whole plain is waste and desolate...The climate of Jericho is exceedingly hot and unhealthy. This is accounted for by the depression of the plain, which is about 1,200 feet below the level of the sea.\"<br><br>There were three different Jerichos, on three different sites, the Jericho of Joshua, the Jericho of Herod, and the Jericho of the Crusades. Er-Riha, the modern Jericho, dates from the time of the Crusades. Dr. Bliss has found in a hollow scooped out for some purpose or other near the foot of the biggest mound above the Sultan's Spring specimens of Amorite or pre-Israelitish pottery precisely identical with what he had discovered on the site of ancient Lachish. He also traced in this place for a short distance a mud brick wall in situ, which he supposes to be the very wall that fell before the trumpets of Joshua. The wall is not far from the foot of the great precipice of Quarantania and its numerous caverns, and the spies of Joshua could easily have fled from the city and been speedily hidden in these fastnesses.";
eastonArray["$$T0002037"] = "<strong>Jerimoth:</strong> heights.<br><br>(1.) One of the sons of Bela (<a href=\"#\" onClick=\"return mV('1Ch',7,7);\">1Ch 7:7</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('1Ch',24,30);\">1Ch 24:30</a>, a Merarite Levite.<br><br>(3.) A Benjamite slinger who joined David at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,5);\">1Ch 12:5</a>).<br><br>(4.) A Levitical musician under Heman his father (<a href=\"#\" onClick=\"return mV('1Ch',25,4);\">1Ch 25:4</a>).<br><br>(5.) <a href=\"#\" onClick=\"return mV('1Ch',27,19);\">1Ch 27:19</a>, ruler of Naphtali.<br><br>(6.) One of David's sons (<a href=\"#\" onClick=\"return mV('2Ch',11,18);\">2Ch 11:18</a>).<br><br>(7.) A Levite, one of the overseers of the temple offerings (<a href=\"#\" onClick=\"return mV('2Ch',31,13);\">2Ch 31:13</a>) in the reign of Hezekiah.";
eastonArray["$$T0002038"] = "<strong>Jeroboam:</strong> increase of the people.<br><br>(1.) The son of Nebat (<a href=\"#\" onClick=\"return mV('1Ki',11,'26-39');\">1Ki 11:26-39</a>), \"an Ephrathite,\" the first king of the ten tribes, over whom he reigned twenty-two years (B.C. 976-945). He was the son of a widow of Zereda, and while still young was promoted by Solomon to be chief superintendent of the \"burnden\", i.e., of the bands of forced labourers. Influenced by the words of the prophet Ahijah, he began to form conspiracies with the view of becoming king of the ten tribes; but these having been discovered, he fled to Egypt (<a href=\"#\" onClick=\"return mV('1Ki',11,'29-40');\">1Ki 11:29-40</a>), where he remained for a length of time under the protection of Shishak I. On the death of Solomon, the ten tribes, having revolted, sent to invite him to become their king. The conduct of Rehoboam favoured the designs of Jeroboam, and he was accordingly proclaimed \"king of Israel\" (<a href=\"#\" onClick=\"return mV('1Ki',12,'1-20');\">1Ki 12:1-20</a>). He rebuilt and fortified Shechem as the capital of his kingdom. He at once adopted means to perpetuate the division thus made between the two parts of the kingdom, and erected at Dan and Bethel, the two extremities of his kingdom, \"golden calves,\" which he set up as symbols of Jehovah, enjoining the people not any more to go up to worship at Jerusalem, but to bring their offerings to the shrines he had erected. Thus he became distinguished as the man \"who made Israel to sin.\" This policy was followed by all the succeeding kings of Israel.<br><br>While he was engaged in offering incense at Bethel, a prophet from Judah appeared before him with a warning message from the Lord. Attempting to arrest the prophet for his bold words of defiance, his hand was \"dried up,\" and the altar before which he stood was rent asunder. At his urgent entreaty his \"hand was restored him again\" (<a href=\"#\" onClick=\"return mV('1Ki',13,'1-6', 9);\">1Ki 13:1-6, 9</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,15);\">2Ki 23:15</a>); but the miracle made no abiding impression on him. His reign was one of constant war with the house of Judah. He died soon after his son Abijah (<a href=\"#\" onClick=\"return mV('1Ki',14,'1-18');\">1Ki 14:1-18</a>).<br><br>(2.) Jeroboam II., the son and successor of Jehoash, and the fourteenth king of Israel, over which he ruled for forty-one years, B.C. 825-784 (<a href=\"#\" onClick=\"return mV('2Ki',14,23);\">2Ki 14:23</a>). He followed the example of the first Jeroboam in keeping up the worship of the golden calves (<a href=\"#\" onClick=\"return mV('2Ki',14,24);\">2Ki 14:24</a>). His reign was contemporary with those of Amaziah (<a href=\"#\" onClick=\"return mV('2Ki',14,23);\">2Ki 14:23</a>) and Uzziah (<a href=\"#\" onClick=\"return mV('2Ki',15,1);\">15:1</a>), kings of Judah. He was victorious over the Syrians (<a href=\"#\" onClick=\"return mV('2Ki',13,4);\">13:4</a>; <a href=\"#\" onClick=\"return mV('2Ki',14,26,27);\">14:26-27</a>), and extended Israel to its former limits, from \"the entering of Hamath to the sea of the plain\" (<a href=\"#\" onClick=\"return mV('2Ki',14,25);\">14:25</a>; <a href=\"#\" onClick=\"return mV('Amo',6,14);\">Amo 6:14</a>). His reign of forty-one years was the most prosperous that Israel had ever known as yet. With all this outward prosperity, however, iniquity widely prevailed in the land (<a href=\"#\" onClick=\"return mV('Amo',2,'6-8');\">Amo 2:6-8</a>; <a href=\"#\" onClick=\"return mV('Amo',4,1);\">4:1</a>; <a href=\"#\" onClick=\"return mV('Amo',6,6);\">6:6</a>; <a href=\"#\" onClick=\"return mV('Hsa',4,'12-14');\">Hsa 4:12-14</a>). The prophets Hosea (<a href=\"#\" onClick=\"return mV('Hsa',1,1);\">Hsa 1:1</a>), Joel (<a href=\"#\" onClick=\"return mV('Joe',3,16);\">Joe 3:16</a>; <a href=\"#\" onClick=\"return mV('Amo',1,1,2);\">Amo 1:1-2</a>), Amos (<a href=\"#\" onClick=\"return mV('Amo',1,1);\">Amo 1:1</a>), and Jonah (<a href=\"#\" onClick=\"return mV('2Ki',14,25);\">2Ki 14:25</a>) lived during his reign. He died, and was buried with his ancestors (<a href=\"#\" onClick=\"return mV('2Ki',14,29);\">14:29</a>). He was succeeded by his son Zachariah (q.v.).<br><br>His name occurs in Scripture only in <a href=\"#\" onClick=\"return mV('2Ki',13,13);\">2Ki 13:13</a>; <a href=\"#\" onClick=\"return mV('2Ki',14,16, 23,'27-29');\">14:16, 23, 27-29</a>; <a href=\"#\" onClick=\"return mV('2Ki',15,1,8);\">15:1, 8</A>; <a href=\"#\" onClick=\"return mV('1Ch',5,17);\">1Ch 5:17</a>; <a href=\"#\" onClick=\"return mV('Hsa',1,1);\">Hsa 1:1</a>; <a href=\"#\" onClick=\"return mV('Amo',1,1);\">Amo 1:1</a>; <a href=\"#\" onClick=\"return mV('Amo',7,'9-11');\">7:9-11'. In all other passages it is Jeroboam the son of Nebat that is meant.";
eastonArray["$$T0002039"] = "<strong>Jeroham:</strong> cherished; who finds mercy.<br><br>(1.) Father of Elkanah, and grandfather of the prophet Samuel (<a href=\"#\" onClick=\"return mV('1Sa',1,1);\">1Sa 1:1</a>).<br><br>(2.) The father of Azareel, the \"captain\" of the tribe of Dan (<a href=\"#\" onClick=\"return mV('1Ch',27,22);\">1Ch 27:22</a>).<br><br>(3.) <a href=\"#\" onClick=\"return mV('1Ch',12,7);\">1Ch 12:7</a>; a Benjamite.<br><br>(4.) <a href=\"#\" onClick=\"return mV('2Ch',23,1);\">2Ch 23:1</a>; one whose son assisted in placing Joash on the throne.<br><br>(5.) <a href=\"#\" onClick=\"return mV('1Ch',9,8);\">1Ch 9:8</a>; a Benjamite.<br><br>(6.) <a href=\"#\" onClick=\"return mV('1Ch',9,12);\">1Ch 9:12</a>; a priest, perhaps the same as in <a href=\"#\" onClick=\"return mV('Neh',11,12);\">Neh 11:12</a>.";
eastonArray["$$T0002040"] = "<strong>Jerubbaal:</strong> contender with Baal; or, let Baal plead, a surname of Gideon; a name given to him because he destroyed the altar of Baal (<a href=\"#\" onClick=\"return mV('Jdg',6,32);\">Jdg 6:32</a>; <a href=\"#\" onClick=\"return mV('Jdg',7,1);\">7:1</a>; <a href=\"#\" onClick=\"return mV('Jdg',8,29);\">8:29</a>; <a href=\"#\" onClick=\"return mV('1Sa',12,11);\">1Sa 12:11</a>).";
eastonArray["$$T0002041"] = "<strong>Jerubbesheth:</strong> contender with the shame; i.e., idol, a surname also of Gideon (<a href=\"#\" onClick=\"return mV('2Sa',11,21);\">2Sa 11:21</a>).";
eastonArray["$$T0002042"] = "<strong>Jeruel:</strong> founded by God, a \"desert\" on the ascent from the valley of the Dead Sea towards Jerusalem. It lay beyond the wilderness of Tekoa, in the direction of Engedi (<a href=\"#\" onClick=\"return mV('2Ch',20,16,20);\">2Ch 20:16, 20</a>). It corresponds with the tract of country now called el-Hasasah.";
eastonArray["$$T0002043"] = "<strong>Jerusalem:</strong> called also Salem, Ariel, Jebus, the \"city of God,\" the \"holy city;\" by the modern Arabs el-Khuds, meaning \"the holy;\" once \"the city of Judah\" (<a href=\"#\" onClick=\"return mV('2Ch',25,28);\">2Ch 25:28</a>). This name is in the original in the dual form, and means \"possession of peace,\" or \"foundation of peace.\" The dual form probably refers to the two mountains on which it was built, viz., Zion and Moriah; or, as some suppose, to the two parts of the city, the \"upper\" and the \"lower city.\" Jerusalem is a \"mountain city enthroned on a mountain fastness\" (<a href=\"#\" onClick=\"return mV('Psa',68,15,16);\">Psa 68:15-16</a>; <a href=\"#\" onClick=\"return mV('Psa',87,1);\">87:1</a>; <a href=\"#\" onClick=\"return mV('Psa',125,2);\">125:2</a>; <a href=\"#\" onClick=\"return mV('Psa',76,1,2);\">76:1-2</a>; <a href=\"#\" onClick=\"return mV('Psa',122,3);\">122:3</a>). It stands on the edge of one of the highest table-lands in Palestine, and is surrounded on the south-eastern, the southern, and the western sides by deep and precipitous ravines.<br><br>It is first mentioned in Scripture under the name Salem (<a href=\"#\" onClick=\"return mV('Gen',14,18);\">Gen 14:18</a>; <a href=\"#\" onClick=\"return mV('Psa',76,2);\">Psa 76:2</a>). When first mentioned under the name Jerusalem, Adonizedek was its king (<a href=\"#\" onClick=\"return mV('Jos',10,1);\">Jos 10:1</a>). It is afterwards named among the cities of Benjamin (<a href=\"#\" onClick=\"return mV('Jdg',19,10);\">Jdg 19:10</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,4);\">1Ch 11:4</a>); but in the time of David it was divided between Benjamin and Judah. After the death of Joshua the city was taken and set on fire by the men of Judah (<a href=\"#\" onClick=\"return mV('Jdg',1,'1-8');\">Jdg 1:1-8</a>); but the Jebusites were not wholly driven out of it. The city is not again mentioned till we are told that David brought the head of Goliath thither (<a href=\"#\" onClick=\"return mV('1Sa',17,54);\">1Sa 17:54</a>). David afterwards led his forces against the Jebusites still residing within its walls, and drove them out, fixing his own dwelling on Zion, which he called \"the city of David\" (<a href=\"#\" onClick=\"return mV('2Sa',5,'5-9');\">2Sa 5:5-9</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,'4-8');\">1Ch 11:4-8</a>). Here he built an altar to the Lord on the threshing-floor of Araunah the Jebusite (<a href=\"#\" onClick=\"return mV('2Sa',24,'15-25');\">2Sa 24:15-25</a>), and thither he brought up the ark of the covenant and placed it in the new tabernacle which he had prepared for it. Jerusalem now became the capital of the kingdom.<br><br>After the death of David, Solomon built the temple, a house for the name of the Lord, on Mount Moriah (B.C. 1010). He also greatly strengthened and adorned the city, and it became the great centre of all the civil and religious affairs of the nation (<a href=\"#\" onClick=\"return mV('Deu',12,5);\">Deu 12:5</a>; <a href=\"#\" onClick=\"return mV('Deu',12,14);\">Deu 12:14</a>; <a href=\"#\" onClick=\"return mV('Deu',14,23);\">14:23</a>; <a href=\"#\" onClick=\"return mV('Deu',16,'11-16');\">16:11-16</a>; <a href=\"#\" onClick=\"return mV('Psa',122,'1-')\">Psa 122</a>).<br><br>After the disruption of the kingdom on the accession to the throne of Rehoboam, the son of Solomon, Jerusalem became the capital of the kingdom of the two tribes. It was subsequently often taken and retaken by the Egyptians, the Assyrians, and by the kings of Israel (<a href=\"#\" onClick=\"return mV('2Ki',14,13,14);\">2Ki 14:13-14</a>; <a href=\"#\" onClick=\"return mV('2Ki',18,15,16);\">18:15-16</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,'33-35');\">23:33-35</a>; <a href=\"#\" onClick=\"return mV('2Ki',24,14);\">24:14</a>; <a href=\"#\" onClick=\"return mV('2Ch',12,9);\">2Ch 12:9</a>; <a href=\"#\" onClick=\"return mV('2Ch',26,9);\">26:9</a>; <a href=\"#\" onClick=\"return mV('2Ch',27,3,4);\">27:3-4</a>; <a href=\"#\" onClick=\"return mV('2Ch',29,3);\">29:3</a>; <a href=\"#\" onClick=\"return mV('2Ch',32,30);\">32:30</a>; <a href=\"#\" onClick=\"return mV('2Ch',33,11);\">33:11</a>), till finally, for the abounding iniquities of the nation, after a siege of three years, it was taken and utterly destroyed, its walls razed to the ground, and its temple and palaces consumed by fire, by Nebuchadnezzar, the king of Babylon (<a href=\"#\" onClick=\"return mV('2Ch',36,'1-');\">2Ch 36</a>; <a href=\"#\" onClick=\"return mV('Jer',39,'1-');\">Jer 39</a>), B.C. 588. The desolation of the city and the <a href=\"#\" onClick=\"return mV('2Ki',25,'1-')\">2Ki 25</a>; <a href=\"#\" onClick=\"return mV('2Ch',36,'1-');\">2Ch 36; <a href=\"#\" onClick=\"return mV('Jer',39,'1-');\">Jer 39</a>), B.C. 588. The desolation of the city and the <a href=\"#\" onClick=\"return mV('2Ch',36,'1-')\">2Ch 36</a>; <a href=\"#\" onClick=\"return mV('2Ch',36,'1-');\">2Ch 36</a>; <a href=\"#\" onClick=\"return mV('Jer',39,'1-');\">Jer 39</a>), B.C. 588. The desolation of the city and the <a href=\"#\" onClick=\"return mV('Jer',39,'1-')\">Jer 39</a>), B.C. 588. The desolation of the city and the land was completed by the retreat of the principal Jews into Egypt (<a href=\"#\" onClick=\"return mV('Jer',40,'1-');\">Jer 40-44</a>), and by the final carrying captive into Babylon of all that still remained in the land (<a href=\"#\" onClick=\"return mV('Jer',52,3);\">52:3</a>), so that it was left without an inhabitant (B.C. 582). Compare the predictions, <a href=\"#\" onClick=\"return mV('Deu',28,'1-');\">Deu 28</a>; <a href=\"#\" onClick=\"return mV('Lev',26,'14-39');\">Lev 26:14-39</a>.<br><br>But the streets and walls of Jerusalem were again to be built, in troublous times (<a href=\"#\" onClick=\"return mV('Dan',9,16,19,25);\">Dan 9:16, 19, 25</a>), after a captivity of seventy years. This restoration was begun B.C. 536, \"in the first year of Cyrus\" (<a href=\"#\" onClick=\"return mV('Ezr',1,2,3,'5-11');\">Ezr 1:2-3, 5-11</a>). The Books of Ezra and Nehemiah contain the history of the re-building of the city and temple, and the restoration of the kingdom of the Jews, consisting of a portion of all the tribes. The kingdom thus constituted was for two centuries under the dominion of Persia, till B.C. 331; and thereafter, for about a century and a half, under the rulers of the Greek empire in Asia, till B.C. 167. For a century the Jews maintained their independence under native rulers, the Asmonean princes. At the close of this period they fell under the rule of Herod and of members of his family, but practically under Rome, till the time of the destruction of Jerusalem, A.D. 70. The city was then laid in ruins.<br><br>The modern Jerusalem by-and-by began to be built over the immense beds of rubbish resulting from the overthrow of the ancient city; and whilst it occupies certainly the same site, there are no evidences that even the lines of its streets are now what they were in the ancient city. Till A.D. 131 the Jews who still lingered about Jerusalem quietly submitted to the Roman sway. But in that year the emperor (Hadrian), in order to hold them in subjection, rebuilt and fortified the city. The Jews, however, took possession of it, having risen under the leadership of one Bar-Chohaba (i.e., \"the son of the star\") in revolt against the Romans. Some four years afterwards (A.D. 135), however, they were driven out of it with great slaughter, and the city was again destroyed; and over its ruins was built a Roman city called Aelia Capitolina, a name which it retained till it fell under the dominion of the Mohammedans, when it was called el-Khuds, i.e., \"the holy.\"<br><br>In A.D. 326 Helena, mother of the emperor Constantine, made a pilgrimage to Jerusalem with the view of discovering the places mentioned in the life of our Lord. She caused a church to be built on what was then supposed to be the place of the nativity at Bethlehem. Constantine, animated by her example, searched for the holy sepulchre, and built over the supposed site a magnificent church, which was completed and dedicated A.D. 335. He relaxed the laws against the Jews till this time in force, and permitted them once a year to visit the city and wail over the desolation of \"the holy and beautiful house.\"<br><br>In A.D. 614 the Persians, after defeating the Roman forces of the emperor Heraclius, took Jerusalem by storm, and retained it till A.D. 637, when it was taken by the Arabians under the Khalif Omar. It remained in their possession till it passed, in A.D. 960, under the dominion of the Fatimite khalifs of Egypt, and in A.D. 1073 under the Turcomans. In A.D. 1099 the crusader Godfrey of Bouillon took the city from the Moslems with great slaughter, and was elected king of Jerusalem. He converted the Mosque of Omar into a Christian cathedral. During the eighty-eight years which followed, many churches and convents were erected in the holy city. The Church of the Holy Sepulchre was rebuilt during this period, and it alone remains to this day. In A.D. 1187 the sultan Saladin wrested the city from the Christians. From that time to the present day, with few intervals, Jerusalem has remained in the hands of the Moslems. It has, however, during that period been again and again taken and retaken, demolished in great part and rebuilt, no city in the world having passed through so many vicissitudes.<br><br>In the year 1850 the Greek and Latin monks residing in Jerusalem had a fierce dispute about the guardianship of what are called the \"holy places.\" In this dispute the emperor Nicholas of Russia sided with the Greeks, and Louis Napoleon, the emperor of the French, with the Latins. This led the Turkish authorities to settle the question in a way unsatisfactory to Russia. Out of this there sprang the Crimean War, which was protracted and sanguinary, but which had important consequences in the way of breaking down the barriers of Turkish exclusiveness.<br><br>Modern Jerusalem \"lies near the summit of a broad mountain-ridge, which extends without interruption from the plain of Esdraelon to a line drawn between the southern end of the Dead Sea and the southeastern corner of the Mediterranean.\" This high, uneven table-land is everywhere from 20 to 25 geographical miles in breadth. It was anciently known as the mountains of Ephraim and Judah.<br><br>\"Jerusalem is a city of contrasts, and differs widely from Damascus, not merely because it is a stone town in mountains, whilst the latter is a mud city in a plain, but because while in Damascus Moslem religion and Oriental custom are unmixed with any foreign element, in Jerusalem every form of religion, every nationality of East and West, is represented at one time.\"<br><br>Jerusalem is first mentioned under that name in the Book of Joshua, and the Tell-el-Amarna collection of tablets includes six letters from its Amorite king to Egypt, recording the attack of the Abiri about B.C. 1480. The name is there spelt Uru-Salim (\"city of peace\"). Another monumental record in which the Holy City is named is that of Sennacherib's attack in B.C. 702. The \"camp of the Assyrians\" was still shown about A.D. 70, on the flat ground to the north-west, included in the new quarter of the city.<br><br>The city of David included both the upper city and Millo, and was surrounded by a wall built by David and Solomon, who appear to have restored the original Jebusite fortifications. The name Zion (or Sion) appears to have been, like Ariel (\"the hearth of God\"), a poetical term for Jerusalem, but in the Greek age was more specially used of the Temple hill. The priests' quarter grew up on Ophel, south of the Temple, where also was Solomon's Palace outside the original city of David. The walls of the city were extended by Jotham and Manasseh to include this suburb and the Temple (<a href=\"#\" onClick=\"return mV('2Ch',27,3);\">2Ch 27:3</a>; <a href=\"#\" onClick=\"return mV('2Ch',33,14);\">33:14</a>).<br><br>Jerusalem is now a town of some 50,000 inhabitants, with ancient mediaeval walls, partly on the old lines, but extending less far to the south. The traditional sites, as a rule, were first shown in the 4th and later centuries A.D., and have no authority. The results of excavation have, however, settled most of the disputed questions, the limits of the Temple area, and the course of the old walls having been traced.";
eastonArray["$$T0002044"] = "<strong>Jerusha:</strong> possession, or possessed; i.e., \"by a husband\", the wife of Uzziah, and mother of king Jotham (<a href=\"#\" onClick=\"return mV('2Ki',15,33);\">2Ki 15:33</a>).";
eastonArray["$$T0002045"] = "<strong>Jeshaiah:</strong> deliverance of Jehovah.<br><br>(1.) A Kohathite Levite, the father of Joram, of the family of Eliezer (<a href=\"#\" onClick=\"return mV('1Ch',26,25);\">1Ch 26:25</a>); called also Isshiah (<a href=\"#\" onClick=\"return mV('1Ch',24,21);\">24:21</a>).<br><br>(2.) One of the sons of Jeduthum (<a href=\"#\" onClick=\"return mV('1Ch',25,3,15);\">1Ch 25:3, 15</a>).<br><br>(3.) One of the three sons of Hananiah (<a href=\"#\" onClick=\"return mV('1Ch',3,21);\">1Ch 3:21</a>).<br><br>(4.) Son of Athaliah (<a href=\"#\" onClick=\"return mV('Ezr',8,7);\">Ezr 8:7</a>).<br><br>(5.) A Levite of the family of Merari (<a href=\"#\" onClick=\"return mV('Ezr',8,19);\">8:19</a>).";
eastonArray["$$T0002046"] = "<strong>Jeshanah:</strong> a city of the kingdom of Israel (<a href=\"#\" onClick=\"return mV('2Ch',13,19);\">2Ch 13:19</a>).";
eastonArray["$$T0002047"] = "<strong>Jesharelah:</strong> upright towards God, the head of the seventh division of Levitical musicians (<a href=\"#\" onClick=\"return mV('1Ch',25,14);\">1Ch 25:14</a>).";
eastonArray["$$T0002048"] = "<strong>Jeshebeab:</strong> seat of his father, the head of the fourteenth division of priests (<a href=\"#\" onClick=\"return mV('1Ch',24,13);\">1Ch 24:13</a>).";
eastonArray["$$T0002049"] = "<strong>Jesher:</strong> uprightness, the first of the three sons of Caleb by Azubah (<a href=\"#\" onClick=\"return mV('1Ch',2,18);\">1Ch 2:18</a>).";
