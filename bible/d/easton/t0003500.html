<script>
var eastonArray = new Array ();
eastonArray["$$T0003500"] = "<strong>Stachys:</strong> spike; an ear of corn, a convert at Rome whom Paul salutes (<a href=\"#\" onClick=\"return mV('Rom',16,9);\">Rom 16:9</a>).";
eastonArray["$$T0003501"] = "<strong>Stacte:</strong> (Heb. nataph), one of the components of the perfume which was offered on the golden altar (<a href=\"#\" onClick=\"return mV('Exd',30,34);\">Exd 30:34</a>; R.V. marg., \"opobalsamum\"). The Hebrew word is from a root meaning \"to distil,\" and it has been by some interpreted as distilled myrrh. Others regard it as the gum of the storax tree, or rather shrub, the Styrax officinale. \"The Syrians value this gum highly, and use it medicinally as an emulcent in pectoral complaints, and also in perfumery.\"";
eastonArray["$$T0003502"] = "<strong>Stargazers:</strong> (<a href=\"#\" onClick=\"return mV('Isa',47,13);\">Isa 47:13</a>), those who pretend to tell what will occur by looking upon the stars. The Chaldean astrologers \"divined by the rising and setting, the motions, aspects, colour, degree of light, etc., of the stars.\"";
eastonArray["$$T0003503"] = "<strong>Star, Morning:</strong> a name figuratively given to Christ (<a href=\"#\" onClick=\"return mV('Rev',22,16);\">Rev 22:16</a>; <a href=\"#\" onClick=\"return mV('2Pe',1,19);\">2Pe 1:19</a>). When Christ promises that he will give the \"morning star\" to his faithful ones, he \"promises that he will give to them himself, that he will give to them himself, that he will impart to them his own glory and a share in his own royal dominion; for the star is evermore the symbol of royalty (<a href=\"#\" onClick=\"return mV('Mat',2,2);\">Mat 2:2</a>), being therefore linked with the sceptre (<a href=\"#\" onClick=\"return mV('Num',24,17);\">Num 24:17</a>). All the glory of the world shall end in being the glory of the Church.\" Trench's Comm.";
eastonArray["$$T0003504"] = "<strong>Stars:</strong> The eleven stars (<a href=\"#\" onClick=\"return mV('Gen',37,9);\">Gen 37:9</a>); the seven (<a href=\"#\" onClick=\"return mV('Amo',5,8);\">Amo 5:8</a>); wandering (<a href=\"#\" onClick=\"return mV('Jud',1,13);\">Jud 1:13</a>); seen in the east at the birth of Christ, probably some luminous meteors miraculously formed for this specific purpose (<a href=\"#\" onClick=\"return mV('Mat',2,'2-10');\">Mat 2:2-10</a>); stars worshipped (<a href=\"#\" onClick=\"return mV('Deu',4,19);\">Deu 4:19</a>; <a href=\"#\" onClick=\"return mV('2Ki',17,16);\">2Ki 17:16</a>; <a href=\"#\" onClick=\"return mV('2Ki',21,3);\">21:3</a>; <a href=\"#\" onClick=\"return mV('Jer',19,13);\">Jer 19:13</a>); spoken of symbolically (<a href=\"#\" onClick=\"return mV('Num',24,17);\">Num 24:17</a>; <a href=\"#\" onClick=\"return mV('Rev',1,16,20);\">Rev 1:16, 20</a>; <a href=\"#\" onClick=\"return mV('Rev',12,1);\">12:1</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000354');\">ASTROLOGERS</a>.)";
eastonArray["$$T0003505"] = "<strong>Stater:</strong> Greek word rendered \"piece of money\" (<a href=\"#\" onClick=\"return mV('Mat',17,27);\">Mat 17:27</a>, A.V.; and \"shekel\" in R.V.). It was equal to two didrachmas (<a href=\"#\" onClick=\"return mV('Mat',17,24);\">17:24</a>), or four drachmas, and to about 2s. 6d. of our money. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003336');\">SHEKEL</a>.)";
eastonArray["$$T0003506"] = "<strong>Stealing:</strong> See <a href=\"#\" onClick=\"return doDictLookup ('ET0003632');\">THEFT</a>.";
eastonArray["$$T0003507"] = "<strong>Steel:</strong> The \"bow of steel\" in (A.V.) <a href=\"#\" onClick=\"return mV('2Sa',22,35);\">2Sa 22:35</a>; <a href=\"#\" onClick=\"return mV('Job',20,24);\">Job 20:24</a>; <a href=\"#\" onClick=\"return mV('Psa',18,34);\">Psa 18:34</a> is in the Revised Version \"bow of brass\" (Heb. kesheth-nehushah). In <a href=\"#\" onClick=\"return mV('Jer',15,12);\">Jer 15:12</a> the same word is used, and is also rendered in the Revised Version \"brass.\" But more correctly it is copper (q.v.), as brass in the ordinary sense of the word (an alloy of copper and zinc) was not known to the ancients.";
eastonArray["$$T0003508"] = "<strong>Stephanas:</strong> crown, a member of the church at Corinth, whose family were among those the apostle had baptized (<a href=\"#\" onClick=\"return mV('1Cr',1,16);\">1Cr 1:16</a>; <a href=\"#\" onClick=\"return mV('1Cr',16,15,17);\">16:15, 17</a>). He has been supposed by some to have been the \"jailer of Philippi\" (<a href=\"#\" onClick=\"return mV('Act',16,33);\">Act 16:33</a>). The First Epistle to the Corinthians was written from Philippi some six years after the jailer's conversion, and he was with the apostle there at that time.";
eastonArray["$$T0003509"] = "<strong>Stephen:</strong> one of the seven deacons, who became a preacher of the gospel. He was the first Christian martyr. His personal character and history are recorded in <a href=\"#\" onClick=\"return mV('Act',6,'1-');\">Acts 6</a>. \"He fell asleep\" with a prayer for his persecutors on his lips (<a href=\"#\" onClick=\"return mV('Act',7,60);\">Act 7:60</a>). Devout men carried him to his grave (<a href=\"#\" onClick=\"return mV('Act',8,2);\">Act 8:2</a>).<br><br>It was at the feet of the young Pharisee, Saul of Tarsus, that those who stoned him laid their clothes (<a href=\"#\" onClick=\"return mV('Deu',17,'5-7');\">Deu 17:5-7</a>) before they began their cruel work. The scene which Saul then witnessed and the words he heard appear to have made a deep and lasting impression on his mind (<a href=\"#\" onClick=\"return mV('Act',22,19,20);\">Act 22:19-20</a>).<br><br>The speech of Stephen before the Jewish ruler is the first apology for the universalism of the gospel as a message to the Gentiles as well as the Jews. It is the longest speech contained in the Acts, a place of prominence being given to it as a defence.";
eastonArray["$$T0003510"] = "<strong>Stoics:</strong> a sect of Greek philosophers at Athens, so called from the Greek word stoa i.e., a \"porch\" or \"portico,\" where they have been called \"the Pharisees of Greek paganism.\" The founder of the Stoics was Zeno, who flourished about B.C. 300. He taught his disciples that a man's happiness consisted in bringing himself into harmony with the course of the universe. They were trained to bear evils with indifference, and so to be independent of externals. Materialism, pantheism, fatalism, and pride were the leading features of this philosophy.";
eastonArray["$$T0003511"] = "<strong>Stomacher:</strong> (<a href=\"#\" onClick=\"return mV('Isa',3,24);\">Isa 3:24</a>), an article of female attire, probably some sort of girdle around the breast.";
eastonArray["$$T0003512"] = "<strong>Stone:</strong> Stones were commonly used for buildings, also as memorials of important events (<a href=\"#\" onClick=\"return mV('Gen',28,18);\">Gen 28:18</a>; <a href=\"#\" onClick=\"return mV('Jos',24,26,27);\">Jos 24:26-27</a>; <a href=\"#\" onClick=\"return mV('1Sa',7,12);\">1Sa 7:12</a>, etc.). They were gathered out of cultivated fields (<a href=\"#\" onClick=\"return mV('Isa',5,2);\">Isa 5:2</a>; <a href=\"#\" onClick=\"return mV('2Ki',3,19);\">2Ki 3:19</a>). This word is also used figuratively of believers (<a href=\"#\" onClick=\"return mV('1Pe',2,4,5);\">1Pe 2:4-5</a>), and of the Messiah (<a href=\"#\" onClick=\"return mV('Psa',118,22);\">Psa 118:22</a>; <a href=\"#\" onClick=\"return mV('Isa',28,16);\">Isa 28:16</a>; <a href=\"#\" onClick=\"return mV('Mat',21,42);\">Mat 21:42</a>; <a href=\"#\" onClick=\"return mV('Act',4,11);\">Act 4:11</a>, etc.). In <a href=\"#\" onClick=\"return mV('Dan',2,45);\">Dan 2:45</a> it refers also to the Messiah. He is there described as \"cut out of the mountain.\" (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003148');\">ROCK</a>.)<br><br>A \"heart of stone\" denotes great insensibility (<a href=\"#\" onClick=\"return mV('1Sa',25,37);\">1Sa 25:37</a>).<br><br>Stones were set up to commemorate remarkable events, as by Jacob at Bethel (<a href=\"#\" onClick=\"return mV('Gen',28,18);\">Gen 28:18</a>), at Padan-aram (<a href=\"#\" onClick=\"return mV('Gen',35,4);\">35:4</a>), and on the occasion of parting with Laban (<a href=\"#\" onClick=\"return mV('Gen',31,'45-47');\">31:45-47</a>); by Joshua at the place on the banks of the Jordan where the people first \"lodged\" after crossing the river (<a href=\"#\" onClick=\"return mV('Jos',6,8);\">Jos 6:8</a>), and also in \"the midst of Jordan,\" where he erected another set of twelve stones (<a href=\"#\" onClick=\"return mV('Jos',4,'1-9');\">4:1-9</a>); and by Samuel at \"Ebenezer\" (<a href=\"#\" onClick=\"return mV('1Sa',7,12);\">1Sa 7:12</a>).";
eastonArray["$$T0003513"] = "<strong>Stones, Precious:</strong> Frequently referred to (<a href=\"#\" onClick=\"return mV('1Ki',10,2);\">1Ki 10:2</a>; <a href=\"#\" onClick=\"return mV('2Ch',3,6);\">2Ch 3:6</a>; <a href=\"#\" onClick=\"return mV('2Ch',9,10);\">9:10</a>; <a href=\"#\" onClick=\"return mV('Rev',18,16);\">Rev 18:16</a>; <a href=\"#\" onClick=\"return mV('Rev',21,19);\">21:19</a>). There are about twenty different names of such stones in the Bible. They are figuratively introduced to denote value, beauty, durability (<a href=\"#\" onClick=\"return mV('Sgs',5,14);\">Sgs 5:14</a>; <a href=\"#\" onClick=\"return mV('Isa',54,11,12);\">Isa 54:11-12</a>; <a href=\"#\" onClick=\"return mV('Lam',4,7);\">Lam 4:7</a>).";
eastonArray["$$T0003514"] = "<strong>Stoning:</strong> a form of punishment (<a href=\"#\" onClick=\"return mV('Lev',20,2);\">Lev 20:2</a>; <a href=\"#\" onClick=\"return mV('Lev',24,14);\">24:14</a>; <a href=\"#\" onClick=\"return mV('Deu',13,10);\">Deu 13:10</a>; <a href=\"#\" onClick=\"return mV('Deu',17,5);\">17:5</a>; <a href=\"#\" onClick=\"return mV('Deu',22,21);\">22:21</a>) prescribed for certain offences. Of Achan (<a href=\"#\" onClick=\"return mV('Jos',7,25);\">Jos 7:25</a>), Naboth (<a href=\"#\" onClick=\"return mV('1Ki',21,'1-')\">1Ki 21</a>), Stephen (<a href=\"#\" onClick=\"return mV('Act',7,59);\">Act 7:59</a>), Paul (<a href=\"#\" onClick=\"return mV('Act',14,19);\">Act 14:19</a>; <a href=\"#\" onClick=\"return mV('2Cr',11,25);\">2Cr 11:25</a>).";
eastonArray["$$T0003515"] = "<strong>Stork:</strong> Heb. hasidah, meaning \"kindness,\" indicating thus the character of the bird, which is noted for its affection for its young. It is in the list of birds forbidden to be eaten by the Levitical law (<a href=\"#\" onClick=\"return mV('Lev',11,19);\">Lev 11:19</a>; <a href=\"#\" onClick=\"return mV('Deu',14,18);\">Deu 14:18</a>). It is like the crane, but larger in size. Two species are found in Palestine, the white, which are dispersed in pairs over the whole country; and the black, which live in marshy places and in great flocks. They migrate to Palestine periodically (about the 22nd of March). Jeremiah alludes to this (<a href=\"#\" onClick=\"return mV('Jer',8,7);\">Jer 8:7</a>). At the appointed time they return with unerring sagacity to their old haunts, and re-occupy their old nests. \"There is a well-authenticated account of the devotion of a stork which, at the burning of the town of Delft, after repeated and unsuccessful attempts to carry off her young, chose rather to remain and perish with them than leave them to their fate. Well might the Romans call it the pia avis!\"<br><br>In <a href=\"#\" onClick=\"return mV('Job',39,13);\">Job 39:13</a> (A.V.), instead of the expression \"or wings and feathers unto the ostrich\" (marg., \"the feathers of the stork and ostrich\"), the Revised Version has \"are her pinions and feathers kindly\" (marg., instead of \"kindly,\" reads \"like the stork's\"). The object of this somewhat obscure verse seems to be to point out a contrast between the stork, as distinguished for her affection for her young, and the ostrich, as distinguished for her indifference.<br><br>Zechariah (<a href=\"#\" onClick=\"return mV('Zec',5,9);\">Zec 5:9</a>) alludes to the beauty and power of the stork's wings.";
eastonArray["$$T0003516"] = "<strong>Strain at:</strong> Simply a misprint for \"strain out\" (<a href=\"#\" onClick=\"return mV('Mat',23,24);\">Mat 23:24</a>).";
eastonArray["$$T0003517"] = "<strong>Stranger:</strong> This word generally denotes a person from a foreign land residing in Palestine. Such persons enjoyed many privileges in common with the Jews, but still were separate from them. The relation of the Jews to strangers was regulated by special laws (<a href=\"#\" onClick=\"return mV('Deu',23,3);\">Deu 23:3</a>; <a href=\"#\" onClick=\"return mV('Deu',24,'14-21');\">24:14-21</a>; <a href=\"#\" onClick=\"return mV('Deu',25,5);\">25:5</a>; <a href=\"#\" onClick=\"return mV('Deu',26,'10-13');\">26:10-13</a>). A special signification is also sometimes attached to this word. In <a href=\"#\" onClick=\"return mV('Gen',23,4);\">Gen 23:4</a> it denotes one resident in a foreign land; <a href=\"#\" onClick=\"return mV('Exd',23,9);\">Exd 23:9</a>, one who is not a Jew; <a href=\"#\" onClick=\"return mV('Num',3,10);\">Num 3:10</a>, one who is not of the family of Aaron; <a href=\"#\" onClick=\"return mV('Psa',69,8);\">Psa 69:8</a>, an alien or an unknown person. The Jews were allowed to purchase strangers as slaves (<a href=\"#\" onClick=\"return mV('Lev',25,44,45);\">Lev 25:44-45</a>), and to take usury from them (<a href=\"#\" onClick=\"return mV('Deu',23,20);\">Deu 23:20</a>).";
eastonArray["$$T0003518"] = "<strong>Straw:</strong> Used in brick-making (<a href=\"#\" onClick=\"return mV('Exd',5,'7-18');\">Exd 5:7-18</a>). Used figuratively in (<a href=\"#\" onClick=\"return mV('Job',41,27);\">Job 41:27</a>; <a href=\"#\" onClick=\"return mV('Isa',11,7);\">Isa 11:7</a>; <a href=\"#\" onClick=\"return mV('Isa',25,10);\">25:10</a>; <a href=\"#\" onClick=\"return mV('Isa',65,25);\">65:25</a>.)";
eastonArray["$$T0003519"] = "<strong>Stream of Egypt:</strong> (<a href=\"#\" onClick=\"return mV('Isa',27,12);\">Isa 27:12</a>), the Wady el-'Arish, called also \"the river of Egypt,\" R.V., \"brook of Egypt\" (<a href=\"#\" onClick=\"return mV('Num',34,5);\">Num 34:5</a>; <a href=\"#\" onClick=\"return mV('Jos',15,4);\">Jos 15:4</a>; <a href=\"#\" onClick=\"return mV('2Ki',24,7);\">2Ki 24:7</a>). It is the natural boundary of Egypt. Occasionally in winter, when heavy rains have fallen among the mountains inland, it becomes a turbulent rushing torrent. The present boundary between Egypt and Palestine is about midway between el-'Arish and Gaza.";
eastonArray["$$T0003520"] = "<strong>Street:</strong> The street called \"Straight\" at Damascus (<a href=\"#\" onClick=\"return mV('Act',9,11);\">Act 9:11</a>) is \"a long broad street, running from east to west, about a mile in length, and forming the principal thoroughfare in the city.\" In Oriental towns streets are usually narrow and irregular and filthy (<a href=\"#\" onClick=\"return mV('Psa',18,42);\">Psa 18:42</a>; <a href=\"#\" onClick=\"return mV('Isa',10,6);\">Isa 10:6</a>). \"It is remarkable,\" says Porter, \"that all the important cities of Palestine and Syria Samaria, Caesarea, Gerasa, Bozrah, Damascus, Palmyra, had their 'straight streets' running through the centre of the city, and lined with stately rows of columns. The most perfect now remaining are those of Palmyra and Gerasa, where long ranges of the columns still stand.\", Through Samaria, etc.";
eastonArray["$$T0003521"] = "<strong>Stripes:</strong> as a punishment were not to exceed forty (<a href=\"#\" onClick=\"return mV('Deu',25,'1-3');\">Deu 25:1-3</a>), and hence arose the custom of limiting them to thirty-nine (<a href=\"#\" onClick=\"return mV('2Cr',11,24);\">2Cr 11:24</a>). Paul claimed the privilege of a Roman citizen in regard to the infliction of stripes (<a href=\"#\" onClick=\"return mV('Act',16,37,38);\">Act 16:37-38</a>; <a href=\"#\" onClick=\"return mV('Act',22,'25-29');\">22:25-29</a>). Our Lord was beaten with stripes (<a href=\"#\" onClick=\"return mV('Mat',27,26);\">Mat 27:26</a>).";
eastonArray["$$T0003522"] = "<strong>Subscriptions:</strong> The subscriptions to Paul's epistles are no part of the original. In their present form they are ascribed to Euthalius, a bishop of the fifth century. Some of them are obviously incorrect.";
eastonArray["$$T0003523"] = "<strong>Suburbs:</strong> the immediate vicinity of a city or town (<a href=\"#\" onClick=\"return mV('Num',35,3,7);\">Num 35:3, 7</a>; <a href=\"#\" onClick=\"return mV('Eze',45,2);\">Eze 45:2</a>). In <a href=\"#\" onClick=\"return mV('2Ki',23,11);\">2Ki 23:11</a> the Hebrew word there used (parvarim) occurs nowhere else. The Revised Version renders it \"precincts.\" The singular form of this Hebrew word (parvar) is supposed by some to be the same as Parbar (q.v.), which occurs twice in <a href=\"#\" onClick=\"return mV('1Ch',26,18);\">1Ch 26:18</a>.";
eastonArray["$$T0003524"] = "<strong>Succoth:</strong> booths.<br><br>(1.) The first encampment of the Israelites after leaving Ramesses (<a href=\"#\" onClick=\"return mV('Exd',12,37);\">Exd 12:37</a>); the civil name of Pithom (q.v.).<br><br>(2.) A city on the east of Jordan, identified with Tell Dar'ala, a high mound, a mass of debris, in the plain north of Jabbok and about one mile from it (<a href=\"#\" onClick=\"return mV('Jos',13,27);\">Jos 13:27</a>). Here Jacob (<a href=\"#\" onClick=\"return mV('Gen',32,17, 30);\">Gen 32:17, 30</a>; <a href=\"#\" onClick=\"return mV('Gen',33,17);\">33:17</a>), on his return from Padan-aram after his interview with Esau, built a house for himself and made booths for his cattle. The princes of this city churlishly refused to afford help to Gideon and his 300 men when \"faint yet pursuing\" they followed one of the bands of the fugitive Midianites after the great victory at Gilboa. After overtaking and routing this band at Karkor, Gideon on his return visited the rulers of the city with severe punishment. \"He took the elders of the city, and thorns of the wilderness and briers, and with them he taught the men of Succoth\" (<a href=\"#\" onClick=\"return mV('Jdg',8,'13-16');\">Jdg 8:13-16</a>). At this place were erected the foundries for casting the metal-work for the temple (<a href=\"#\" onClick=\"return mV('1Ki',7,46);\">1Ki 7:46</a>).";
eastonArray["$$T0003525"] = "<strong>Succoth-benoth:</strong> tents of daughters, supposed to be the name of a Babylonian deity, the goddess Zir-banit, the wife of Merodach, worshipped by the colonists in Samaria (<a href=\"#\" onClick=\"return mV('2Ki',17,30);\">2Ki 17:30</a>).";
eastonArray["$$T0003526"] = "<strong>Sukkiims:</strong> dwellers in tents, (Vulg. and LXX., \"troglodites; \" i.e., cave-dwellers in the hills along the Red Sea). Shiskak's army, with which he marched against Jerusalem, was composed partly of this tribe (<a href=\"#\" onClick=\"return mV('2Ch',12,3);\">2Ch 12:3</a>).";
eastonArray["$$T0003527"] = "<strong>Sun:</strong> (Heb. shemesh), first mentioned along with the moon as the two great luminaries of heaven (<a href=\"#\" onClick=\"return mV('Gen',1,'14-18');\">Gen 1:14-18</a>). By their motions and influence they were intended to mark and divide times and seasons. The worship of the sun was one of the oldest forms of false religion (<a href=\"#\" onClick=\"return mV('Job',31,26,27);\">Job 31:26-27</a>), and was common among the Egyptians and Chaldeans and other pagan nations. The Jews were warned against this form of idolatry (<a href=\"#\" onClick=\"return mV('Deu',4,19);\">Deu 4:19</a>; <a href=\"#\" onClick=\"return mV('Deu',17,3);\">17:3</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,11);\">2Ki 23:11</a>; <a href=\"#\" onClick=\"return mV('Jer',19,13);\">Jer 19:13</a>).";
eastonArray["$$T0003528"] = "<strong>Suph:</strong> (<a href=\"#\" onClick=\"return mV('Deu',1,1);\">Deu 1:1</a>, R.V.; marg., \"some ancient versions have the Red Sea,\" as in the A.V.). Some identify it with Suphah (<a href=\"#\" onClick=\"return mV('Num',21,14);\">Num 21:14</a>, marg., A.V.) as probably the name of a place. Others identify it with es-Sufah = Maaleh-acrabbim (<a href=\"#\" onClick=\"return mV('Jos',15,3);\">Jos 15:3</a>), and others again with Zuph (<a href=\"#\" onClick=\"return mV('1Sa',9,5);\">1Sa 9:5</a>). It is most probable, however, that, in accordance with the ancient versions, this word is to be regarded as simply an abbreviation of Yam-suph, i.e., the \"Red Sea.\"";
eastonArray["$$T0003529"] = "<strong>Suphah:</strong> (<a href=\"#\" onClick=\"return mV('Num',21,14);\">Num 21:14</a>, marg.; also R.V.), a place at the south-eastern corner of the Dead Sea, the Ghor es-Safieh. This name is found in an ode quoted from the \"Book of the Wars of the Lord,\" probably a collection of odes commemorating the triumphs of God's people (<a href=\"#\" onClick=\"return mV('Num',21,14,17,18,'27-30');\">Num 21:14, 17-18, 27-30</a>).";
eastonArray["$$T0003530"] = "<strong>Supper:</strong> the principal meal of the day among the Jews. It was partaken of in the early part of the evening (<a href=\"#\" onClick=\"return mV('Mar',6,21);\">Mar 6:21</a>; <a href=\"#\" onClick=\"return mV('Jhn',12,2);\">Jhn 12:2</a>; <a href=\"#\" onClick=\"return mV('1Cr',11,21);\">1Cr 11:21</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002318');\">LORD'S SUPPER</a>.)";
eastonArray["$$T0003531"] = "<strong>Surety:</strong> one who becomes responsible for another. Christ is the surety of the better covenant (<a href=\"#\" onClick=\"return mV('Hbr',7,22);\">Hbr 7:22</a>). In him we have the assurance that all its provisions will be fully and faithfully carried out. Solomon warns against incautiously becoming security for another (<a href=\"#\" onClick=\"return mV('Pro',6,'1-5');\">Pro 6:1-5</a>; <a href=\"#\" onClick=\"return mV('Pro',11,15);\">11:15</a>; <a href=\"#\" onClick=\"return mV('Pro',17,18);\">17:18</a>; <a href=\"#\" onClick=\"return mV('Pro',20,16);\">20:16</a>).";
eastonArray["$$T0003532"] = "<strong>Susanchites:</strong> the inhabitants of Shushan, who joined the other adversaries of the Jews in the attempt to prevent the rebuilding of the temple (<a href=\"#\" onClick=\"return mV('Ezr',4,9);\">Ezr 4:9</a>).";
eastonArray["$$T0003533"] = "<strong>Susanna:</strong> lily, with other pious women, ministered to Jesus (<a href=\"#\" onClick=\"return mV('Luk',8,3);\">Luk 8:3</a>).";
eastonArray["$$T0003534"] = "<strong>Susi:</strong> the father of Gaddi, who was one of the twelve spies (<a href=\"#\" onClick=\"return mV('Num',13,11);\">Num 13:11</a>).";
eastonArray["$$T0003535"] = "<strong>Swallow:</strong><br><br>(1.) Heb. sis (<a href=\"#\" onClick=\"return mV('Isa',38,14);\">Isa 38:14</a>; <a href=\"#\" onClick=\"return mV('Jer',8,7);\">Jer 8:7</a>), the Arabic for the swift, which \"is a regular migrant, returning in myriads every spring, and so suddenly that while one day not a swift can be seen in the country, on the next they have overspread the whole land, and fill the air with their shrill cry.\" The swift (cypselus) is ordinarily classed with the swallow, which it resembles in its flight, habits, and migration.<br><br>(2.) Heb. deror, i.e., \"the bird of freedom\" (<a href=\"#\" onClick=\"return mV('Psa',84,3);\">Psa 84:3</a>; <a href=\"#\" onClick=\"return mV('Pro',26,2);\">Pro 26:2</a>), properly rendered swallow, distinguished for its swiftness of flight, its love of freedom, and the impossibility of retaining it in captivity. In <a href=\"#\" onClick=\"return mV('Isa',38,14);\">Isa 38:14</a> and <a href=\"#\" onClick=\"return mV('Jer',8,7);\">Jer 8:7</a> the word thus rendered ('augr) properly means \"crane\" (as in the R.V.).";
eastonArray["$$T0003536"] = "<strong>Swan:</strong> mentioned in the list of unclean birds (<a href=\"#\" onClick=\"return mV('Lev',11,18);\">Lev 11:18</a>; <a href=\"#\" onClick=\"return mV('Deu',14,16);\">Deu 14:16</a>), is sometimes met with in the Jordan and the Sea of Galilee.";
eastonArray["$$T0003537"] = "<strong>Swelling:</strong> of Jordan (<a href=\"#\" onClick=\"return mV('Jer',12,5);\">Jer 12:5</a>), literally the \"pride\" of Jordan (as in R.V.), i.e., the luxuriant thickets of tamarisks, poplars, reeds, etc., which were the lair of lions and other beasts of prey. The reference is not to the overflowing of the river banks. (<a href=\"#\" onClick=\"return mV('Jer',49,19);\">Jer 49:19</a>; <a href=\"#\" onClick=\"return mV('Jer',50,44);\">50:44</a>; <a href=\"#\" onClick=\"return mV('Zec',11,3);\">Zec 11:3</a>).";
eastonArray["$$T0003538"] = "<strong>Swine:</strong> (Heb. hazir), regarded as the most unclean and the most abhorred of all animals (<a href=\"#\" onClick=\"return mV('Lev',11,7);\">Lev 11:7</a>; <a href=\"#\" onClick=\"return mV('Isa',65,4);\">Isa 65:4</a>; <a href=\"#\" onClick=\"return mV('Isa',66,3,17);\">66:3, 17</a>; <a href=\"#\" onClick=\"return mV('Luk',15,15,16);\">Luk 15:15-16</a>). A herd of swine were drowned in the Sea of Galilee (<a href=\"#\" onClick=\"return mV('Luk',8,32,33);\">Luk 8:32-33</a>). Spoken of figuratively in <a href=\"#\" onClick=\"return mV('Mat',7,6);\">Mat 7:6</a> (see <a href=\"#\" onClick=\"return mV('Pro',11,22);\">Pro 11:22</a>). It is frequently mentioned as a wild animal, and is evidently the wild boar (Arab. khanzir), which is common among the marshes of the Jordan valley (<a href=\"#\" onClick=\"return mV('Psa',80,13);\">Psa 80:13</a>).";
eastonArray["$$T0003539"] = "<strong>Sword:</strong> of the Hebrew was pointed, sometimes two-edged, was worn in a sheath, and suspended from the girdle (<a href=\"#\" onClick=\"return mV('Exd',32,27);\">Exd 32:27</a>; <a href=\"#\" onClick=\"return mV('1Sa',31,4);\">1Sa 31:4</a>; <a href=\"#\" onClick=\"return mV('1Ch',21,27);\">1Ch 21:27</a>; <a href=\"#\" onClick=\"return mV('Psa',149,6);\">Psa 149:6</a>: <a href=\"#\" onClick=\"return mV('Pro',5,4);\">Pro 5:4</a>; <a href=\"#\" onClick=\"return mV('Eze',16,40);\">Eze 16:40</a>; <a href=\"#\" onClick=\"return mV('Eze',21,'3-5');\">21:3-5</a>).<br><br>It is a symbol of divine chastisement (<a href=\"#\" onClick=\"return mV('Deu',32,25);\">Deu 32:25</a>; <a href=\"#\" onClick=\"return mV('Psa',7,12);\">Psa 7:12</a>; <a href=\"#\" onClick=\"return mV('Psa',78,62);\">78:62</a>), and of a slanderous tongue (<a href=\"#\" onClick=\"return mV('Psa',57,4);\">Psa 57:4</a>; <a href=\"#\" onClick=\"return mV('Psa',64,3);\">64:3</a>; <a href=\"#\" onClick=\"return mV('Pro',12,18);\">Pro 12:18</a>). The word of God is likened also to a sword (<a href=\"#\" onClick=\"return mV('Hbr',4,12);\">Hbr 4:12</a>; <a href=\"#\" onClick=\"return mV('Eph',6,17);\">Eph 6:17</a>; <a href=\"#\" onClick=\"return mV('Rev',1,16);\">Rev 1:16</a>). Gideon's watchword was, \"The sword of the Lord\" (<a href=\"#\" onClick=\"return mV('Jdg',7,20);\">Jdg 7:20</a>).";
eastonArray["$$T0003540"] = "<strong>Sycamine tree:</strong> mentioned only in <a href=\"#\" onClick=\"return mV('Luk',17,6);\">Luk 17:6</a>. It is rendered by Luther \"mulberry tree\" (q.v.), which is most probably the correct rendering. It is found of two species, the black mulberry (<i>Morus nigra</i>) and the white mulberry (Mourea), which are common in Palestine. The silk-worm feeds on their leaves. The rearing of them is one of the chief industries of the peasantry of Lebanon and of other parts of the land. It is of the order of the fig-tree. Some contend, however, that this name denotes the sycamore-fig of <a href=\"#\" onClick=\"return mV('Luk',19,4);\">Luk 19:4</a>.";
eastonArray["$$T0003541"] = "<strong>Sycamore:</strong> more properly sycomore (Heb. shikmoth and shikmim, Gr. sycomoros), a tree which in its general character resembles the fig-tree, while its leaves resemble those of the mulberry; hence it is called the fig-mulberry (<i>Ficus sycomorus</i>). At Jericho, Zacchaeus climbed a sycomore-tree to see Jesus as he passed by (<a href=\"#\" onClick=\"return mV('Luk',19,4);\">Luk 19:4</a>). This tree was easily destroyed by frost (<a href=\"#\" onClick=\"return mV('Psa',78,47);\">Psa 78:47</a>), and therefore it is found mostly in the \"vale\" (<a href=\"#\" onClick=\"return mV('1Ki',10,27);\">1Ki 10:27</a>; <a href=\"#\" onClick=\"return mV('2Ch',1,15);\">2Ch 1:15</a>); in both passages the R.V. has properly \"lowland\", i.e., the \"low country,\" the shephelah, where the climate is mild. Amos (<a href=\"#\" onClick=\"return mV('Amo',7,14);\">Amo 7:14</a>) refers to its fruit, which is of an inferior character; so also probably Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',24,2);\">Jer 24:2</a>). It is to be distinguished from our sycamore (the <i>Acer pseudo-platanus</i>), which is a species of maple often called a plane-tree.";
eastonArray["$$T0003542"] = "<strong>Sychar:</strong> liar or drunkard (see <a href=\"#\" onClick=\"return mV('Isa',28,1,7);\">Isa 28:1, 7</a>), has been from the time of the Crusaders usually identified with Sychem or Shechem (<a href=\"#\" onClick=\"return mV('Jhn',4,5);\">Jhn 4:5</a>). It has now, however, as the result of recent explorations, been identified with 'Askar, a small Samaritan town on the southern base of Ebal, about a mile to the north of Jacob's well.";
eastonArray["$$T0003543"] = "<strong>Sychem:</strong> See <a href=\"#\" onClick=\"return doDictLookup ('ET0003330');\">SHECHEM</a>.";
eastonArray["$$T0003544"] = "<strong>Syene:</strong> opening (<a href=\"#\" onClick=\"return mV('Eze',29,10);\">Eze 29:10</a>; <a href=\"#\" onClick=\"return mV('Eze',30,6);\">30:6</a>), a town of Egypt, on the borders of Ethiopia, now called Assouan, on the right bank of the Nile, notable for its quarries of beautiful red granite called \"syenite.\" It was the frontier town of Egypt in the south, as Migdol was in the north-east.";
eastonArray["$$T0003545"] = "<strong>Synagogue:</strong> (Gr. sunagoge, i.e., \"an assembly\"), found only once in the Authorized Version of <a href=\"#\" onClick=\"return mV('Psa',74,8);\">Psa 74:8</a>, where the margin of Revised Version has \"places of assembly,\" which is probably correct; for while the origin of synagogues is unknown, it may well be supposed that buildings or tents for the accommodation of worshippers may have existed in the land from an early time, and thus the system of synagogues would be gradually developed.<br><br>Some, however, are of opinion that it was specially during the Babylonian captivity that the system of synagogue worship, if not actually introduced, was at least reorganized on a systematic plan (<a href=\"#\" onClick=\"return mV('Eze',8,1);\">Eze 8:1</a>; <a href=\"#\" onClick=\"return mV('Eze',14,1);\">14:1</a>). The exiles gathered together for the reading of the law and the prophets as they had opportunity, and after their return synagogues were established all over the land (<a href=\"#\" onClick=\"return mV('Ezr',8,15);\">Ezr 8:15</a>; <a href=\"#\" onClick=\"return mV('Neh',8,2);\">Neh 8:2</a>). In after years, when the Jews were dispersed abroad, wherever they went they erected synagogues and kept up the stated services of worship (<a href=\"#\" onClick=\"return mV('Act',9,20);\">Act 9:20</a>; <a href=\"#\" onClick=\"return mV('Act',13,5);\">13:5</a>; <a href=\"#\" onClick=\"return mV('Act',17,1);\">17:1</a>; <a href=\"#\" onClick=\"return mV('Act',17,17);\">17:17</a>; <a href=\"#\" onClick=\"return mV('Act',18,4);\">18:4</a>). The form and internal arrangements of the synagogue would greatly depend on the wealth of the Jews who erected it, and on the place where it was built. \"Yet there are certain traditional pecularities which have doubtless united together by a common resemblance the Jewish synagogues of all ages and countries. The arrangements for the women's place in a separate gallery or behind a partition of lattice-work; the desk in the centre, where the reader, like Ezra in ancient days, from his 'pulpit of wood,' may 'open the book in the sight of all of people and read in the book of the law of God distinctly, and give the sense, and cause them to understand the reading' (<a href=\"#\" onClick=\"return mV('Neh',8,4,8);\">Neh 8:4, 8</a>); the carefully closed ark on the side of the building nearest to Jerusalem, for the preservation of the rolls or manuscripts of the law; the seats all round the building, whence 'the eyes of all them that are in the synagogue' may 'be fastened' on him who speaks (<a href=\"#\" onClick=\"return mV('Luk',4,20);\">Luk 4:20</a>); the 'chief seats' (<a href=\"#\" onClick=\"return mV('Mat',23,6);\">Mat 23:6</a>) which were appropriated to the 'ruler' or 'rulers' of the synagogue, according as its organization may have been more or less complete;\", these were features common to all the synagogues.<br><br>Where perfected into a system, the services of the synagogue, which were at the same hours as those of the temple, consisted,<br><br>(1) of prayer, which formed a kind of liturgy, there were in all eighteen prayers;<br><br>(2) the reading of the Scriptures in certain definite portions; and<br><br>(3) the exposition of the portions read. (See <a href=\"#\" onClick=\"return mV('Luk',4,15,22);\">Luk 4:15, 22</a>; <a href=\"#\" onClick=\"return mV('Act',13,14);\">Act 13:14</a>.)<br><br>The synagogue was also sometimes used as a court of judicature, in which the rulers presided (<a href=\"#\" onClick=\"return mV('Mat',10,17);\">Mat 10:17</a>; <a href=\"#\" onClick=\"return mV('Mar',5,22);\">Mar 5:22</a>; <a href=\"#\" onClick=\"return mV('Luk',12,11);\">Luk 12:11</a>; <a href=\"#\" onClick=\"return mV('Luk',21,12);\">21:12</a>; <a href=\"#\" onClick=\"return mV('Act',13,15);\">Act 13:15</a>; <a href=\"#\" onClick=\"return mV('Act',22,19);\">22:19</a>); also as public schools.<br><br>The establishment of synagogues wherever the Jews were found in sufficient numbers helped greatly to keep alive Israel's hope of the coming of the Messiah, and to prepare the way for the spread of the gospel in other lands. The worship of the Christian Church was afterwards modelled after that of the synagogue.<br><br>Christ and his disciples frequently taught in the synagogues (<a href=\"#\" onClick=\"return mV('Mat',13,54);\">Mat 13:54</a>; <a href=\"#\" onClick=\"return mV('Mar',6,2);\">Mar 6:2</a>; <a href=\"#\" onClick=\"return mV('Jhn',18,20);\">Jhn 18:20</a>; <a href=\"#\" onClick=\"return mV('Act',13,5,15,44);\">Act 13:5, 15, 44</a>; <a href=\"#\" onClick=\"return mV('Act',14,1);\">14:1</a>; <a href=\"#\" onClick=\"return mV('Act',17,'2-4',10,17);\">17:2-4, 10, 17</a>; <a href=\"#\" onClick=\"return mV('Act',18,4,26);\">18:4, 26</a>; <a href=\"#\" onClick=\"return mV('Act',19,8);\">19:8</a>).<br><br>To be \"put out of the synagogue,\" a phrase used by John (<a href=\"#\" onClick=\"return mV('Jhn',9,22);\">Jhn 9:22</a>; <a href=\"#\" onClick=\"return mV('Jhn',12,42);\">12:42</a>; <a href=\"#\" onClick=\"return mV('Jhn',16,2);\">16:2</a>), means to be excommunicated.";
eastonArray["$$T0003546"] = "<strong>Syntyche:</strong> fortunate; affable, a female member of the church at Philippi, whom Paul beseeches to be of one mind with Euodias (<a href=\"#\" onClick=\"return mV('Phl',4,2,3);\">Phl 4:2-3</a>).";
eastonArray["$$T0003547"] = "<strong>Syracuse:</strong> a city on the south-east coast of Sicily, where Paul landed and remained three days when on his way to Rome (<a href=\"#\" onClick=\"return mV('Act',28,12);\">Act 28:12</a>). It was distinguished for its magnitude and splendour. It is now a small town of some 13,000 inhabitants.";
eastonArray["$$T0003548"] = "<strong>Syria:</strong> (Heb. Aram), the name in the Old Testament given to the whole country which lay to the north-east of Phoenicia, extending to beyond the Euphrates and the Tigris. Mesopotamia is called (<a href=\"#\" onClick=\"return mV('Gen',24,10);\">Gen 24:10</a>; <a href=\"#\" onClick=\"return mV('Deu',23,4);\">Deu 23:4</a>) Aram-naharain (=Syria of the two rivers), also Padan-aram (<a href=\"#\" onClick=\"return mV('Gen',25,20);\">Gen 25:20</a>). Other portions of Syria were also known by separate names, as Aram-maahah (<a href=\"#\" onClick=\"return mV('1Ch',19,6);\">1Ch 19:6</a>), Aram-beth-rehob (<a href=\"#\" onClick=\"return mV('2Sa',10,6);\">2Sa 10:6</a>), Aram-zobah (<a href=\"#\" onClick=\"return mV('2Sa',10,6,8);\">2Sa 10:6, 8</a>). All these separate little kingdoms afterwards became subject to Damascus. In the time of the Romans, Syria included also a part of Palestine and Asia Minor.<br><br>\"From the historic annals now accessible to us, the history of Syria may be divided into three periods: The first, the period when the power of the Pharaohs was dominant over the fertile fields or plains of Syria and the merchant cities of Tyre and Sidon, and when such mighty conquerors as Thothmes III. and Rameses II. could claim dominion and levy tribute from the nations from the banks of the Euphrates to the borders of the Libyan desert. Second, this was followed by a short period of independence, when the Jewish nation in the south was growing in power, until it reached its early zenith in the golden days of Solomon; and when Tyre and Sidon were rich cities, sending their traders far and wide, over land and sea, as missionaries of civilization, while in the north the confederate tribes of the Hittites held back the armies of the kings of Assyria. The third, and to us most interesting, period is that during which the kings of Assyria were dominant over the plains of Syria; when Tyre, Sidon, Ashdod, and Jerusalem bowed beneath the conquering armies of Shalmaneser, Sargon, and Sennacherib; and when at last Memphis and Thebes yielded to the power of the rulers of Nineveh and Babylon, and the kings of Assyria completed with terrible fulness the bruising of the reed of Egypt so clearly foretold by the Hebrew prophets.\", Boscawen.";
eastonArray["$$T0003549"] = "<strong>Syriac:</strong> (<a href=\"#\" onClick=\"return mV('2Ki',18,26);\">2Ki 18:26</a>; <a href=\"#\" onClick=\"return mV('Ezr',4,7);\">Ezr 4:7</a>; <a href=\"#\" onClick=\"return mV('Dan',2,4);\">Dan 2:4</a>), more correctly rendered \"Aramaic,\" including both the Syriac and the Chaldee languages. In the New Testament there are several Syriac words, such as \"Eloi, Eloi, lama sabachthani?\" (<a href=\"#\" onClick=\"return mV('Mar',15,34);\">Mar 15:34</a>; <a href=\"#\" onClick=\"return mV('Mat',27,46);\">Mat 27:46</a> gives the Heb. form, \"Eli, Eli\"), \"Raca\" (<a href=\"#\" onClick=\"return mV('Mat',5,22);\">Mat 5:22</a>), \"Ephphatha\" (<a href=\"#\" onClick=\"return mV('Mar',7,34);\">Mar 7:34</a>), \"Maran-atha\" (<a href=\"#\" onClick=\"return mV('1Cr',16,22);\">1Cr 16:22</a>).<br><br>A Syriac version of the Old Testament, containing all the canonical books, along with some apocryphal books (called the Peshitto, i.e., simple translation, and not a paraphrase), was made early in the second century, and is therefore the first Christian translation of the Old Testament. It was made directly from the original, and not from the LXX. Version. The New Testament was also translated from Greek into Syriac about the same time. It is noticeable that this version does not contain the Second and Third Epistles of John, 2 Peter, Jude, and the Apocalypse. These were, however, translated subsequently and placed in the version. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003768');\">VERSION</a>.)";
