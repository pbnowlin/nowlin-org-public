<script>
var eastonArray = new Array ();
eastonArray["$$T0003950"] = "<strong>Zoar:</strong> small, a town on the east or south-east of the Dead Sea, to which Lot and his daughters fled from Sodom (<a href=\"#\" onClick=\"return mV('Gen',19,22,23);\">Gen 19:22-23</a>). It was originally called Bela (<a href=\"#\" onClick=\"return mV('Gen',14,2,8);\">14:2, 8</a>). It is referred to by the prophets Isaiah (<a href=\"#\" onClick=\"return mV('Isa',15,5);\">Isa 15:5</a>) and Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',48,34);\">Jer 48:34</a>). Its ruins are still seen at the opening of the ravine of Kerak, the Kir-Moab referred to in <a href=\"#\" onClick=\"return mV('2Ki',3,'1-');\">2 Kings 3</a>, the modern Tell esh-Shaghur.";
eastonArray["$$T0003951"] = "<strong>Zobah:</strong> =Aram-Zobah, (<a href=\"#\" onClick=\"return mV('Psa',60,1);\">Psa 60, title</a>), a Syrian province or kingdom to the south of Coele-Syria, and extending from the eastern slopes of Lebanon north and east toward the Euphrates. Saul and David had war with the kings of Zobah (<a href=\"#\" onClick=\"return mV('1Sa',14,47);\">1Sa 14:47</a>; <a href=\"#\" onClick=\"return mV('2Sa',8,3);\">2Sa 8:3</a>; <a href=\"#\" onClick=\"return mV('2Sa',10,6);\">10:6</a>).";
eastonArray["$$T0003952"] = "<strong>Zohar:</strong> brightness.<br><br>(1.) The father of Ephron the Hittite (<a href=\"#\" onClick=\"return mV('Gen',23,8);\">Gen 23:8</a>).<br><br>(2.) One of the sons of Simeon (<a href=\"#\" onClick=\"return mV('Gen',46,10);\">Gen 46:10</a>; <a href=\"#\" onClick=\"return mV('Exd',6,15);\">Exd 6:15</a>).";
eastonArray["$$T0003953"] = "<strong>Zoheleth:</strong> the serpent-stone, a rocky plateau near the centre of the village of Siloam, and near the fountain of En-rogel, to which the women of the village resort for water (<a href=\"#\" onClick=\"return mV('1Ki',1,'5-9');\">1Ki 1:5-9</a>). Here Adonijah (q.v.) feasted all the royal princess except Solomon and the men who took part with him in his effort to succeed to the throne. While they were assembled here Solomon was proclaimed king, through the intervention of Nathan. On hearing this, Adonijah fled and took refuge in the sanctuary (<a href=\"#\" onClick=\"return mV('1Ki',1,'49-53');\">1Ki 1:49-53</a>). He was afterwards pardoned.<br><br>Zoheleth projects into or slightly over-hangs the Kidron valley. It is now called ez-Zehwell or Zahweileh.";
eastonArray["$$T0003954"] = "<strong>Zoheth:</strong> snatching (?), one of the sons of Ishi (<a href=\"#\" onClick=\"return mV('1Ch',4,20);\">1Ch 4:20</a>).";
eastonArray["$$T0003955"] = "<strong>Zophah:</strong> spreading out, a son of Helem (<a href=\"#\" onClick=\"return mV('1Ch',7,35);\">1Ch 7:35</a>), a chief of Asher.";
eastonArray["$$T0003956"] = "<strong>Zophar:</strong> chirping, one of Job's friends who came to condole with him in his distress (<a href=\"#\" onClick=\"return mV('Job',2,11);\">Job 2:11</a>. The LXX. render here \"king of the Mineans\" = Ma'in, Maonites, <a href=\"#\" onClick=\"return mV('Jdg',10,12);\">Jdg 10:12</a>, in Southern Arabia). He is called a Naamathite, or an inhabitant of some unknown place called Naamah.";
eastonArray["$$T0003957"] = "<strong>Zophim, Field of:</strong> field of watchers, a place in Moab on the range of Pisgah (<a href=\"#\" onClick=\"return mV('Num',23,14);\">Num 23:14</a>). To this place Balak brought Balaam, that he might from thence curse the children of Israel. Balaam could only speak the word of the Lord, and that was blessing. It is the modern Tal'at-es-Safa. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002962');\">PISGAH</a>.)";
eastonArray["$$T0003958"] = "<strong>Zorah:</strong> place of wasps, a town in the low country of Judah, afterwards given to Dan (<a href=\"#\" onClick=\"return mV('Jos',19,41);\">Jos 19:41</a>; <a href=\"#\" onClick=\"return mV('Jdg',18,2);\">Jdg 18:2</a>), probably the same as Zoreah (<a href=\"#\" onClick=\"return mV('Jos',15,33);\">Jos 15:33</a>). This was Samson's birthplace (<a href=\"#\" onClick=\"return mV('Jdg',13,2,25);\">Jdg 13:2, 25</a>), and near it he found a grave (<a href=\"#\" onClick=\"return mV('Jdg',16,31);\">16:31</a>). It was situated on the crest of a hill overlooking the valley of Sorek, and was fortified by Rehoboam (<a href=\"#\" onClick=\"return mV('2Ch',11,10);\">2Ch 11:10</a>). It has been identified with Sur'ah, in the Wady Surar, 8 miles west of Jerusalem. It is noticed on monuments in the fifteenth century B.C. as attacked by the Abiri or Hebrews.";
eastonArray["$$T0003959"] = "<strong>Zuph:</strong> honeycomb, a Kohathite Levite, ancestor of Elkanah and Samuel (<a href=\"#\" onClick=\"return mV('1Sa',1,1);\">1Sa 1:1</a>); called also Zophai (<a href=\"#\" onClick=\"return mV('1Ch',6,26);\">1Ch 6:26</a>).";
eastonArray["$$T0003960"] = "<strong>Zuph, Land of:</strong> (<a href=\"#\" onClick=\"return mV('1Sa',9,5,6);\">1Sa 9:5-6</a>), a district in which lay Samuel's city, Ramah. It was probably so named after Elkanah's son, Zuph (<a href=\"#\" onClick=\"return mV('1Ch',6,26);\">1Ch 6:26</a>, marg.).";
eastonArray["$$T0003961"] = "<strong>Zur:</strong> rock.<br><br>(1.) One of the five Midianite kings whom the Israelites defeated and put to death (<a href=\"#\" onClick=\"return mV('Num',31,8);\">Num 31:8</a>).<br><br>(2.) A Benjamite (<a href=\"#\" onClick=\"return mV('1Ch',8,30);\">1Ch 8:30</a>).";
eastonArray["$$T0003962"] = "<strong>Zuriel:</strong> rock of God, chief of the family of the Merarites (<a href=\"#\" onClick=\"return mV('Num',3,35);\">Num 3:35</a>) at the time of the Exodus.";
eastonArray["$$T0003963"] = "<strong>Zurishaddai:</strong> rock of the Almighty, the father of Shelumiel, who was chief of the tribe of Simeon when Israel was encamped at Sinai (<a href=\"#\" onClick=\"return mV('Num',1,6);\">Num 1:6</a>; <a href=\"#\" onClick=\"return mV('Num',2,12);\">2:12</a>).";
eastonArray["$$T0003964"] = "<strong>Zuzims:</strong> restless; sprouting, were smitten \"in Ham\" by Chedorlaomer and his allies (<a href=\"#\" onClick=\"return mV('Gen',14,5);\">Gen 14:5</a>). Some have identified this tribe with the Zamzummims (q.v.).";
</script>
