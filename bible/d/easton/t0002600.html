<script>var eastonArray = new Array ();
eastonArray["$$T0002600"] = "<strong>Mosera:</strong> a bond, one of the stations of the Israelites in the wilderness (<a href=\"#\" onClick=\"return mV('Deu',10,6);\">Deu 10:6</a>), at the foot of Mount Hor. (<a href=\"#\" onClick=\"return mV('Num',33,37,38);\">Num 33:37-38</a>). It has been identified with el-Tayibeh, a small fountain at the bottom of the pass leading to the ascent of Mount Hor.";
eastonArray["$$T0002601"] = "<strong>Moseroth:</strong> bonds, one of the stations in the wilderness (<a href=\"#\" onClick=\"return mV('Num',33,30,31);\">Num 33:30-31</a>), probably the same as Mosera.";
eastonArray["$$T0002602"] = "<strong>Moses:</strong> drawn (or Egypt. mesu, \"son; \" hence Rameses, royal son). On the invitation of Pharaoh (<a href=\"#\" onClick=\"return mV('Gen',45,'17-25');\">Gen 45:17-25</a>), Jacob and his sons went down into Egypt. This immigration took place probably about 350 years before the birth of Moses. Some centuries before Joseph, Egypt had been conquered by a pastoral Semitic race from Asia, the Hyksos, who brought into cruel subjection the native Egyptians, who were an African race. Jacob and his retinue were accustomed to a shepherd's life, and on their arrival in Egypt were received with favour by the king, who assigned them the \"best of the land\", the land of Goshen, to dwell in. The Hyksos or \"shepherd\" king who thus showed favour to Joseph and his family was in all probability the Pharaoh Apopi (or Apopis).<br><br>Thus favoured, the Israelites began to \"multiply exceedingly\" (<a href=\"#\" onClick=\"return mV('Gen',47,27);\">Gen 47:27</a>), and extended to the west and south. At length the supremacy of the Hyksos came to an end. The descendants of Jacob were allowed to retain their possession of Goshen undisturbed, but after the death of Joseph their position was not so favourable. The Egyptians began to despise them, and the period of their \"affliction\" (<a href=\"#\" onClick=\"return mV('Gen',15,13);\">Gen 15:13</a>) commenced. They were sorely oppressed. They continued, however, to increase in numbers, and \"the land was filled with them\" (<a href=\"#\" onClick=\"return mV('Exd',1,7);\">Exd 1:7</a>). The native Egyptians regarded them with suspicion, so that they felt all the hardship of a struggle for existence.<br><br>In process of time \"a king [probably Seti I.] arose who knew not Joseph\" (<a href=\"#\" onClick=\"return mV('Exd',1,8);\">Exd 1:8</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002923');\">PHARAOH</a>.) The circumstances of the country were such that this king thought it necessary to weaken his Israelite subjects by oppressing them, and by degrees reducing their number. They were accordingly made public slaves, and were employed in connection with his numerous buildings, especially in the erection of store-cities, temples, and palaces. The children of Israel were made to serve with rigour. Their lives were made bitter with hard bondage, and \"all their service, wherein they made them serve, was with rigour\" (<a href=\"#\" onClick=\"return mV('Exd',1,13,14);\">Exd 1:13-14</a>). But this cruel oppression had not the result expected of reducing their number. On the contrary, \"the more the Egyptians afflicted them, the more they multiplied and grew\" (<a href=\"#\" onClick=\"return mV('Exd',1,12);\">Exd 1:12</a>).<br><br>The king next tried, through a compact secretly made with the guild of midwives, to bring about the destruction of all the Hebrew male children that might be born. But the king's wish was not rigorously enforced; the male children were spared by the midwives, so that \"the people multiplied\" more than ever. Thus baffled, the king issued a public proclamation calling on the people to put to death all the Hebrew male children by casting them into the river (<a href=\"#\" onClick=\"return mV('Exd',1,22);\">Exd 1:22</a>). But neither by this edict was the king's purpose effected.<br><br>One of the Hebrew households into which this cruel edict of the king brought great alarm was that of Amram, of the family of the Kohathites (<a href=\"#\" onClick=\"return mV('Exd',6,'16-20');\">Exd 6:16-20</a>), who with his wife Jochebed and two children, Miriam, a girl of perhaps fifteen years of age, and Aaron, a boy of three years, resided in or near Memphis, the capital city of that time. In this quiet home a male child was born (B.C. 1571). His mother concealed him in the house for three months from the knowledge of the civic authorities. But when the task of concealment became difficult, Jochebed contrived to bring her child under the notice of the daughter of the king by constructing for him an ark of bulrushes, which she laid among the flags which grew on the edge of the river at the spot where the princess was wont to come down and bathe. Her plan was successful. The king's daughter \"saw the child; and behold the child wept.\" The princess (see <a href=\"#\" onClick=\"return doDictLookup('ET0002924');\">PHARAOH'S DAUGHTER, [1]</a>) sent Miriam, who was standing by, to fetch a nurse. She went and brought the mother of the child, to whom the princess said, \"Take this child away, and nurse it for me, and I will give thee thy wages.\" Thus Jochebed's child, whom the princess called \"Moses\", i.e., \"Saved from the water\" (<a href=\"#\" onClick=\"return mV('Exd',2,10);\">Exd 2:10</a>), was ultimately restored to her.<br><br>As soon as the natural time for weaning the child had come, he was transferred from the humble abode of his father to the royal palace, where he was brought up as the adopted son of the princess, his mother probably accompanying him and caring still for him. He grew up amid all the grandeur and excitement of the Egyptian court, maintaining, however, probably a constant fellowship with his mother, which was of the highest importance as to his religious belief and his interest in his \"brethren.\" His education would doubtless be carefully attended to, and he would enjoy all the advantages of training both as to his body and his mind. He at length became \"learned in all the wisdom of the Egyptians\" (<a href=\"#\" onClick=\"return mV('Act',7,22);\">Act 7:22</a>). Egypt had then two chief seats of learning, or universities, at one of which, probably that of Heliopolis, his education was completed. Moses, being now about twenty years of age, spent over twenty more before he came into prominence in Bible history. These twenty years were probably spent in military service. There is a tradition recorded by Josephus that he took a lead in the war which was then waged between Egypt and Ethiopia, in which he gained renown as a skilful general, and became \"mighty in deeds\" (<a href=\"#\" onClick=\"return mV('Act',7,22);\">Act 7:22</a>).<br><br>After the termination of the war in Ethiopia, Moses returned to the Egyptian court, where he might reasonably have expected to be loaded with honours and enriched with wealth. But \"beneath the smooth current of his life hitherto, a life of alternate luxury at the court and comparative hardness in the camp and in the discharge of his military duties, there had lurked from childhood to youth, and from youth to manhood, a secret discontent, perhaps a secret ambition. Moses, amid all his Egyptian surroundings, had never forgotten, had never wished to forget, that he was a Hebrew.\" He now resolved to make himself acquainted with the condition of his countrymen, and \"went out unto his brethren, and looked upon their burdens\" (<a href=\"#\" onClick=\"return mV('Exd',2,11);\">Exd 2:11</a>). This tour of inspection revealed to him the cruel oppression and bondage under which they everywhere groaned, and could not fail to press on him the serious consideration of his duty regarding them. The time had arrived for his making common cause with them, that he might thereby help to break their yoke of bondage. He made his choice accordingly (<a href=\"#\" onClick=\"return mV('Hbr',11,'25-27');\">Hbr 11:25-27</a>), assured that God would bless his resolution for the welfare of his people. He now left the palace of the king and took up his abode, probably in his father's house, as one of the Hebrew people who had for forty years been suffering cruel wrong at the hands of the Egyptians.<br><br>He could not remain indifferent to the state of things around him, and going out one day among the people, his indignation was roused against an Egyptian who was maltreating a Hebrew. He rashly lifted up his hand and slew the Egyptian, and hid his body in the sand. Next day he went out again and found two Hebrews striving together. He speedily found that the deed of the previous day was known. It reached the ears of Pharaoh (the \"great Rameses,\" Rameses II.), who \"sought to slay Moses\" (<a href=\"#\" onClick=\"return mV('Exd',2,15);\">Exd 2:15</a>). Moved by fear, Moses fled from Egypt, and betook himself to the land of Midian, the southern part of the peninsula of Sinai, probably by much the same route as that by which, forty years afterwards, he led the Israelites to Sinai. He was providentially led to find a new home with the family of Reuel, where he remained for forty years (<a href=\"#\" onClick=\"return mV('Act',7,30);\">Act 7:30</a>), under training unconsciously for his great life's work.<br><br>Suddenly the angel of the Lord appeared to him in the burning bush (<a href=\"#\" onClick=\"return mV('Exd',3,'1-')\">Exd 3</a>), and commissioned him to go down to Egypt and \"bring forth the children of Israel\" out of bondage. He was at first unwilling to go, but at length he was obedient to the heavenly vision, and left the land of Midian (<a href=\"#\" onClick=\"return mV('Exd',4,'18-26');\">4:18-26</a>). On the way he was met by Aaron (q.v.) and the elders of Israel (<a href=\"#\" onClick=\"return mV('Exd',4,'27-31');\">4:27-31</a>). He and Aaron had a hard task before them; but the Lord was with them (ch. <a href=\"#\" onClick=\"return mV('Exd',7,'1-');\">7-12</a>), and the ransomed host went forth in triumph. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001283');\">EXODUS</a>.) After an eventful journey to and fro in the wilderness, we see them at length encamped in the plains of Moab, ready to cross over the Jordan into the Promised Land. There Moses addressed the assembled elders (<a href=\"#\" onClick=\"return mV('Deu',1,'1-4');\">Deu 1:1-4</a>; <a href=\"#\" onClick=\"return mV('Deu',5,'1-');\">5:1-26:19</a>; <a href=\"#\" onClick=\"return mV('Deu',27,'11-');\">27:11-30:20</a>), and gives the people his last counsels, and then rehearses the great song (<a href=\"#\" onClick=\"return mV('Deu',32,'1-')\">Deu 32</a>), clothing in fitting words the deep emotions of his heart at such a time, and in review of such a marvellous history as that in which he had acted so conspicious a part. Then, after blessing the tribes (<a href=\"#\" onClick=\"return mV('Deu',33,'1-')\">33</a>), he ascends to \"the mountain of Nebo (q.v.), to the top of Pisgah, that is over against Jericho\" (<a href=\"#\" onClick=\"return mV('Deu',34,1);\">34:1</a>), and from thence he surveys the land. \"Jehovah shewed him all the land of Gilead, unto Dan, and all Naphtali, and the land of Ephraim, and Manasseh, and all the land of Judah, unto the utmost sea, and the south, and the plain of the valley of Jericho, the city of palm trees, unto Zoar\" (<a href=\"#\" onClick=\"return mV('Deu',34,2,3);\">Deu 34:2-3</a>), the magnificient inheritance of the tribes of whom he had been so long the leader; and there he died, being one hundred and twenty years old, according to the word of the Lord, and was buried by the Lord \"in a valley in the land of Moab, over against Beth-peor\" (<a href=\"#\" onClick=\"return mV('Deu',34,6);\">34:6</a>). The people mourned for him during thirty days.<br><br>Thus died \"Moses the man of God\" (<a href=\"#\" onClick=\"return mV('Deu',33,1);\">Deu 33:1</a>; <a href=\"#\" onClick=\"return mV('Jos',14,6);\">Jos 14:6</a>). He was distinguished for his meekness and patience and firmness, and \"he endured as seeing him who is invisible.\" \"There arose not a prophet since in Israel like unto Moses, whom the Lord knew face to face, in all the signs and the wonders, which the Lord sent him to do in the land of Egypt to Pharaoh, and to all his servants, and to all his land, and in all that mighty hand, and in all the great terror which Moses shewed in the sight of all Israel\" (<a href=\"#\" onClick=\"return mV('Deu',34,'10-12');\">Deu 34:10-12</a>).<br><br>The name of Moses occurs frequently in the Psalms and Prophets as the chief of the prophets.<br><br>In the New Testament he is referred to as the representative of the law and as a type of Christ (<a href=\"#\" onClick=\"return mV('Jhn',1,17);\">Jhn 1:17</a>; <a href=\"#\" onClick=\"return mV('2Cr',3,'13-18');\">2Cr 3:13-18</a>; <a href=\"#\" onClick=\"return mV('Hbr',3,5,6);\">Hbr 3:5-6</a>). Moses is the only character in the Old Testament to whom Christ likens himself (<a href=\"#\" onClick=\"return mV('Jhn',5,46);\">Jhn 5:46</a>; <a href=\"#\" onClick=\"return mV('Deu',18,15,18,19);\">Deu 18:15,18-19</a>; <a href=\"#\" onClick=\"return mV('Act',7,37);\">Act 7:37</a>). In <a href=\"#\" onClick=\"return mV('Hbr',3,'1-19');\">Hbr 3:1-19</a> this likeness to Moses is set forth in various particulars.<br><br>In <a href=\"#\" onClick=\"return mV('Jud',1,9);\">Jud 1:9</a> mention is made of a contention between Michael and the devil about the body of Moses. This dispute is supposed to have had reference to the concealment of the body of Moses so as to prevent idolatry.";
eastonArray["$$T0002603"] = "<strong>Mote:</strong> (Gr. karphos, something dry, hence a particle of wood or chaff, etc.). A slight moral defect is likened to a mote (<a href=\"#\" onClick=\"return mV('Mat',7,'3-5');\">Mat 7:3-5</a>; <a href=\"#\" onClick=\"return mV('Luk',6,41,42);\">Luk 6:41-42</a>).";
eastonArray["$$T0002604"] = "<strong>Moth:</strong> Heb. 'ash, from a root meaning \"to fall away,\" as moth-eaten garments fall to pieces (<a href=\"#\" onClick=\"return mV('Job',4,19);\">Job 4:19</a>; <a href=\"#\" onClick=\"return mV('Job',13,28);\">13:28</a>; <a href=\"#\" onClick=\"return mV('Isa',50,9);\">Isa 50:9</a>; <a href=\"#\" onClick=\"return mV('Isa',51,8);\">51:8</a>; <a href=\"#\" onClick=\"return mV('Hsa',5,12);\">Hsa 5:12</a>).<br><br>Gr. ses, thus rendered in <a href=\"#\" onClick=\"return mV('Mat',6,19,20);\">Mat 6:19-20</a>; <a href=\"#\" onClick=\"return mV('Luk',12,33);\">Luk 12:33</a>. Allusion is thus made to the destruction of clothing by the larvae of the clothes-moth. This is the only lepidopterous insect referred to in Scripture.";
eastonArray["$$T0002605"] = "<strong>Mouldy:</strong> Of the Gibeonites it is said that \"all the bread of their provision was dry and mouldy\" (<a href=\"#\" onClick=\"return mV('Jos',9,5,12);\">Jos 9:5, 12</a>). The Hebrew word here rendered \"mouldy\" (nikuddim) is rendered \"cracknels\" in <a href=\"#\" onClick=\"return mV('1Ki',14,3);\">1Ki 14:3</a>, and denotes a kind of crisp cake. The meaning is that the bread of the Gibeonites had become dry and hard, hard as biscuits, and thus was an evidence of the length of the journey they had travelled.";
eastonArray["$$T0002606"] = "<strong>Mount:</strong> Palestine is a hilly country (<a href=\"#\" onClick=\"return mV('Deu',3,25);\">Deu 3:25</a>; <a href=\"#\" onClick=\"return mV('Deu',11,11);\">11:11</a>; <a href=\"#\" onClick=\"return mV('Eze',34,13);\">Eze 34:13</a>). West of Jordan the mountains stretch from Lebanon far down into Galilee, terminating in Carmel. The isolated peak of Tabor rises from the elevated plain of Esdraelon, which, in the south, is shut in by hills spreading over the greater part of Samaria. The mountains of Western and Middle Palestine do not extend to the sea, but gently slope into plains, and toward the Jordan fall down into the Ghor.<br><br>East of the Jordan the Anti-Lebanon, stretching south, terminates in the hilly district called Jebel Heish, which reaches down to the Sea of Gennesareth. South of the river Hieromax there is again a succession of hills, which are traversed by wadies running toward the Jordan. These gradually descend to a level at the river Arnon, which was the boundary of the ancient trans-Jordanic territory toward the south.<br><br>The composition of the Palestinian hills is limestone, with occasional strata of chalk, and hence the numerous caves, some of large extent, found there.";
eastonArray["$$T0002607"] = "<strong>Mount of beatitudes:</strong> See <a href=\"#\" onClick=\"return doDictLookup('ET0003286');\">SERMON</a>.";
eastonArray["$$T0002608"] = "<strong>Mount of corruption:</strong> (<a href=\"#\" onClick=\"return mV('2Ki',23,13);\">2Ki 23:13</a>; Vulg., \"mount of offence\"), the name given to a part of the Mount of Olives, so called because idol temples were there erected in the time of Solomon, temples to the Zidonian Ashtoreth and to the \"abominations\" of Moab and Ammon.";
eastonArray["$$T0002609"] = "<strong>Mount of the Amalekites:</strong> a place near Pirathon (q.v.), in the tribe of Ephraim (<a href=\"#\" onClick=\"return mV('Jdg',12,15);\">Jdg 12:15</a>).";
eastonArray["$$T0002610"] = "<strong>Mount of the Amorites:</strong> the range of hills which rises abruptly in the wilderness of et-Tih (\"the wandering\"), mentioned <a href=\"#\" onClick=\"return mV('Deu',1,19,20);\">Deu 1:19-20</a>, \"that great and terrible wilderness.\"";
eastonArray["$$T0002611"] = "<strong>Mount of the congregation:</strong> only in <a href=\"#\" onClick=\"return mV('Isa',14,13);\">Isa 14:13</a>, a mythic mountain of the Babylonians, regarded by them as the seat of the gods. It was situated in the far north, and in Babylonian inscriptions is described as a mountain called Im-Kharasak, \"the mighty mountain of Bel, whose head reaches heaven, whose root is the holy deep.\" In their geography they are said to have identified it with mount El-wend, near Ecbatana.";
eastonArray["$$T0002612"] = "<strong>Mount of the valley:</strong> (<a href=\"#\" onClick=\"return mV('Jos',13,19);\">Jos 13:19</a>), a district in the east of Jordan, in the territory of Reuben. The \"valley\" here was probably the Ghor or valley of the Jordan, and hence the \"mount\" would be the hilly region in the north end of the Dead Sea. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003874');\">ZARETH-SHAHAR</a>.)";
eastonArray["$$T0002613"] = "<strong>Mourn:</strong> Frequent references are found in Scripture to,<br><br>(1.) Mourning for the dead. Abraham mourned for Sarah (<a href=\"#\" onClick=\"return mV('Gen',23,2);\">Gen 23:2</a>); Jacob for Joseph (<a href=\"#\" onClick=\"return mV('Gen',37,34,35);\">37:34-35</a>); the Egyptians for Jacob (<a href=\"#\" onClick=\"return mV('Gen',50,'3-10');\">50:3-10</a>); Israel for Aaron (<a href=\"#\" onClick=\"return mV('Num',20,29);\">Num 20:29</a>), for Moses (<a href=\"#\" onClick=\"return mV('Deu',34,8);\">Deu 34:8</a>), and for Samuel (<a href=\"#\" onClick=\"return mV('1Sa',25,1);\">1Sa 25:1</a>); David for Abner (<a href=\"#\" onClick=\"return mV('2Sa',3,31,35);\">2Sa 3:31, 35</a>); Mary and Martha for Lazarus (<a href=\"#\" onClick=\"return mV('Jhn',11,'1-')\">Jhn 11</a>); devout men for Stephen (<a href=\"#\" onClick=\"return mV('Act',8,2);\">Act 8:2</a>), etc.<br><br>(2.) For calamities, Job (<a href=\"#\" onClick=\"return mV('Job',1,20,21);\">Job 1:20-21</a>; <a href=\"#\" onClick=\"return mV('Job',2,8);\">2:8</a>); Israel (<a href=\"#\" onClick=\"return mV('Exd',33,4);\">Exd 33:4</a>); the Ninevites (<a href=\"#\" onClick=\"return mV('Jon',3,5);\">Jon 3:5</a>); Israel, when defeated by Benjamin (<a href=\"#\" onClick=\"return mV('Jdg',20,26);\">Jdg 20:26</a>), etc.<br><br>(3.) Penitential mourning, by the Israelites on the day of atonement (<a href=\"#\" onClick=\"return mV('Lev',23,27);\">Lev 23:27</a>; <a href=\"#\" onClick=\"return mV('Act',27,9);\">Act 27:9</a>); under Samuel's ministry (<a href=\"#\" onClick=\"return mV('1Sa',7,6);\">1Sa 7:6</a>); predicted in Zechariah (<a href=\"#\" onClick=\"return mV('Zec',12,10,11);\">Zec 12:10-11</a>); in many of the psalms (<a href=\"#\" onClick=\"return mV('Psa',51,'1-');\">Psa 51<a/>, etc.).<br><br>Mourning was expressed,<br><br>(1) by weeping (<a href=\"#\" onClick=\"return mV('Gen',35,8);\">Gen 35:8</a>, marg.; <a href=\"#\" onClick=\"return mV('Luk',7,38);\">Luk 7:38</a>, etc.);<br><br>(2) by loud lamentation (<a href=\"#\" onClick=\"return mV('Rth',1,9);\">Rth 1:9</a>; <a href=\"#\" onClick=\"return mV('1Sa',6,19);\">1Sa 6:19</a>; <a href=\"#\" onClick=\"return mV('2Sa',3,31);\">2Sa 3:31</a>);<br><br>(3) by the disfigurement of the person, as rending the clothes (<a href=\"#\" onClick=\"return mV('Gen',37,29,34);\">Gen 37:29, 34</a>; <a href=\"#\" onClick=\"return mV('Mat',26,65);\">Mat 26:65</a>), wearing sackcloth (<a href=\"#\" onClick=\"return mV('Gen',37,34);\">Gen 37:34</a>; <a href=\"#\" onClick=\"return mV('Psa',35,13);\">Psa 35:13</a>), sprinkling dust or ashes on the person (<a href=\"#\" onClick=\"return mV('2Sa',13,19);\">2Sa 13:19</a>; <a href=\"#\" onClick=\"return mV('Jer',6,26);\">Jer 6:26</a>; <a href=\"#\" onClick=\"return mV('Job',2,12);\">Job 2:12</a>), shaving the head and plucking out the hair of the head or beard (<a href=\"#\" onClick=\"return mV('Lev',10,6);\">Lev 10:6</a>; <a href=\"#\" onClick=\"return mV('Job',1,20);\">Job 1:20</a>), neglect of the person or the removal of ornaments (<a href=\"#\" onClick=\"return mV('Exd',33,4);\">Exd 33:4</a>; <a href=\"#\" onClick=\"return mV('Deu',21,12,13);\">Deu 21:12-13</a>; <a href=\"#\" onClick=\"return mV('2Sa',14,2);\">2Sa 14:2</a>; <a href=\"#\" onClick=\"return mV('2Sa',19,24);\">19:24</a>; <a href=\"#\" onClick=\"return mV('Mat',6,16,17);\">Mat 6:16-17</a>), fasting (<a href=\"#\" onClick=\"return mV('2Sa',1,12);\">2Sa 1:12</a>), covering the upper lip (<a href=\"#\" onClick=\"return mV('Lev',13,45);\">Lev 13:45</a>; <a href=\"#\" onClick=\"return mV('Mic',3,7);\">Mic 3:7</a>), cutting the flesh (<a href=\"#\" onClick=\"return mV('Jer',16,6,7);\">Jer 16:6-7</a>), and sitting in silence (<a href=\"#\" onClick=\"return mV('Jdg',20,26);\">Jdg 20:26</a>; <a href=\"#\" onClick=\"return mV('2Sa',12,16);\">2Sa 12:16</a>; <a href=\"#\" onClick=\"return mV('2Sa',13,31);\">13:31</a>; <a href=\"#\" onClick=\"return mV('Job',1,20);\">Job 1:20</a>).<br><br>In the later times we find a class of mourners who could be hired to give by their loud lamentation the external tokens of sorrow (<a href=\"#\" onClick=\"return mV('2Ch',35,25);\">2Ch 35:25</a>; <a href=\"#\" onClick=\"return mV('Jer',9,17);\">Jer 9:17</a>; <a href=\"#\" onClick=\"return mV('Mat',9,23);\">Mat 9:23</a>).<br><br>The period of mourning for the dead varied. For Jacob it was seventy days (<a href=\"#\" onClick=\"return mV('Gen',50,3);\">Gen 50:3</a>); for Aaron (<a href=\"#\" onClick=\"return mV('Num',20,29);\">Num 20:29</a>) and Moses (<a href=\"#\" onClick=\"return mV('Deu',34,8);\">Deu 34:8</a>) thirty days; and for Saul only seven days (<a href=\"#\" onClick=\"return mV('1Sa',31,13);\">1Sa 31:13</a>). In <a href=\"#\" onClick=\"return mV('2Sa',3,'31-35');\">2Sa 3:31-35</a>, we have a description of the great mourning for the death of Abner.";
eastonArray["$$T0002614"] = "<strong>Mouse:</strong> Heb. 'akhbar, \"swift digger\"), properly the dormouse, the field-mouse (<a href=\"#\" onClick=\"return mV('1Sa',6,4);\">1Sa 6:4</a>). In <a href=\"#\" onClick=\"return mV('Lev',11,29);\">Lev 11:29</a>; <a href=\"#\" onClick=\"return mV('Isa',66,17);\">Isa 66:17</a> this word is used generically, and includes the jerboa (<i>Mus jaculus</i>), rat, hamster (Cricetus), which, though declared to be unclean animals, were eaten by the Arabs, and are still eaten by the Bedouins. It is said that no fewer than twenty-three species of this group ('akhbar=Arab. ferah) of animals inhabit Palestine. God \"laid waste\" the people of Ashdod by the terrible visitation of field-mice, which are like locusts in their destructive effects (<a href=\"#\" onClick=\"return mV('1Sa',6,4,11,18);\">1Sa 6:4, 11, 18</a>). Herodotus, the Greek historian, accounts for the destruction of the army of Sennacherib (<a href=\"#\" onClick=\"return mV('2Ki',19,35);\">2Ki 19:35</a>) by saying that in the night thousands of mice invaded the camp and gnawed through the bow-strings, quivers, and shields, and thus left the Assyrians helpless. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003273');\">SENNACHERIB</a>.)";
eastonArray["$$T0002615"] = "<strong>Mowing:</strong> (Heb. gez), rendered in <a href=\"#\" onClick=\"return mV('Psa',72,6);\">Psa 72:6</a> \"mown grass.\" The expression \"king's mowings\" (<a href=\"#\" onClick=\"return mV('Amo',7,1);\">Amo 7:1</a>) refers to some royal right of early pasturage, the first crop of grass for the cavalry (<a href=\"#\" onClick=\"return mV('1Ki',18,5);\">1Ki 18:5</a>).";
eastonArray["$$T0002616"] = "<strong>Moza:</strong> a going forth.<br><br>(1.) One of the sons of Caleb (<a href=\"#\" onClick=\"return mV('1Ch',2,46);\">1Ch 2:46</a>).<br><br>(2.) The son of Zimri, of the posterity of Saul (<a href=\"#\" onClick=\"return mV('1Ch',8,36,37);\">1Ch 8:36-37</a>; <a href=\"#\" onClick=\"return mV('1Ch',9,42,43);\">9:42-43</a>).";
eastonArray["$$T0002617"] = "<strong>Mozah:</strong> an issuing of water, a city of Benjamin (<a href=\"#\" onClick=\"return mV('Jos',18,26);\">Jos 18:26</a>).";
eastonArray["$$T0002618"] = "<strong>Mufflers:</strong> (<a href=\"#\" onClick=\"return mV('Isa',3,19);\">Isa 3:19</a>), veils, light and tremulous. Margin, \"spangled ornaments.\"";
eastonArray["$$T0002619"] = "<strong>Mulberry:</strong> Heb. bakah, \"to weep;\" rendered \"Baca\" (R.V., \"weeping\") in <a href=\"#\" onClick=\"return mV('Psa',84,6);\">Psa 84:6</a>. The plural form of the Hebrew bekaim is rendered \"mulberry trees\" in <a href=\"#\" onClick=\"return mV('2Sa',5,23,24);\">2Sa 5:23-24</a> and <a href=\"#\" onClick=\"return mV('1Ch',14,14,15);\">1Ch 14:14-15</a>. The tree here alluded to was probably the aspen or trembling poplar. \"We know with certainty that the black poplar, the aspen, and the Lombardy poplar grew in Palestine. The aspen, whose long leaf-stalks cause the leaves to tremble with every breath of wind, unites with the willow and the oak to overshadow the watercourses of the Lebanon, and with the oleander and the acacia to adorn the ravines of Southern Palestine\" (Kitto). By \"the sound of a going in the tops of the mulberry trees\" we are to understand a rustling among the trees like the marching of an army. This was the signal that the Lord himself would lead forth David's army to victory. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003540');\">SYCAMINE</a>.)";
eastonArray["$$T0002620"] = "<strong>Mule:</strong> (Heb. pered), so called from the quick step of the animal or its power of carrying loads. It is not probable that the Hebrews bred mules, as this was strictly forbidden in the law (<a href=\"#\" onClick=\"return mV('Lev',19,19);\">Lev 19:19</a>), although their use was not forbidden. We find them in common use even by kings and nobles (<a href=\"#\" onClick=\"return mV('2Sa',18,9);\">2Sa 18:9</a>; <a href=\"#\" onClick=\"return mV('1Ki',1,33);\">1Ki 1:33</a>; <a href=\"#\" onClick=\"return mV('2Ki',5,17);\">2Ki 5:17</a>; <a href=\"#\" onClick=\"return mV('Psa',32,9);\">Psa 32:9</a>). They are not mentioned, however, till the time of David, for the word rendered \"mules\" (R.V. correctly, \"hot springs\") in <a href=\"#\" onClick=\"return mV('Gen',36,24);\">Gen 36:24</a> (yemim) properly denotes the warm springs of Callirhoe, on the eastern shore of the Dead Sea. In David's reign they became very common (<a href=\"#\" onClick=\"return mV('2Sa',13,29);\">2Sa 13:29</a>; <a href=\"#\" onClick=\"return mV('1Ki',10,25);\">1Ki 10:25</a>).<br><br>Mules are not mentioned in the New Testament. Perhaps they had by that time ceased to be used in Palestine.";
eastonArray["$$T0002621"] = "<strong>Murder:</strong> Wilful murder was distinguished from accidental homicide, and was invariably visited with capital punishment (<a href=\"#\" onClick=\"return mV('Num',35,16,18,21,31);\">Num 35:16, 18, 21, 31</a>; <a href=\"#\" onClick=\"return mV('Lev',24,17);\">Lev 24:17</a>). This law in its principle is founded on the fact of man's having been made in the likeness of God (<a href=\"#\" onClick=\"return mV('Gen',9,5,6);\">Gen 9:5-6</a>; <a href=\"#\" onClick=\"return mV('Jhn',8,44);\">Jhn 8:44</a>; <a href=\"#\" onClick=\"return mV('1Jo',3,12,15);\">1Jo 3:12, 15</a>). The Mosiac law prohibited any compensation for murder or the reprieve of the murderer (<a href=\"#\" onClick=\"return mV('Exd',21,12,14);\">Exd 21:12, 14</a>; <a href=\"#\" onClick=\"return mV('Deu',19,11,13);\">Deu 19:11, 13</a>; <a href=\"#\" onClick=\"return mV('2Sa',17,25);\">2Sa 17:25</a>; <a href=\"#\" onClick=\"return mV('2Sa',20,10);\">20:10</a>). Two witnesses were required in any capital case (<a href=\"#\" onClick=\"return mV('Num',35,'19-30');\">Num 35:19-30</a>; <a href=\"#\" onClick=\"return mV('Deu',17,'6-12');\">Deu 17:6-12</a>). If the murderer could not be discovered, the city nearest the scene of the murder was required to make expiation for the crime committed (<a href=\"#\" onClick=\"return mV('Deu',21,'1-9');\">Deu 21:1-9</a>). These offences also were to be punished with death,<br><br>(1) striking a parent;<br><br>(2) cursing a parent;<br><br>(3) kidnapping (<a href=\"#\" onClick=\"return mV('Exd',21,'15-17');\">Exd 21:15-17</a>; <a href=\"#\" onClick=\"return mV('Deu',27,16);\">Deu 27:16</a>).";
eastonArray["$$T0002622"] = "<strong>Murmuring:</strong> of the Hebrews in the wilderness, called forth the displeasure of God, which was only averted by the earnest prayer of Moses (<a href=\"#\" onClick=\"return mV('Num',11,33,34);\">Num 11:33-34</a>; <a href=\"#\" onClick=\"return mV('Num',12,'1-');\">Num 12</a>; <a href=\"#\" onClick=\"return mV('Num',14,27,30,31);\">14:27, 30-31</a>; <a href=\"#\" onClick=\"return mV('Num',16,3);\">16:3</a>; <a href=\"#\" onClick=\"return mV('Num',21,'4-6');\">21:4-6</a>; <a href=\"#\" onClick=\"return mV('Psa',106,25);\">Psa 106:25</a>). Forbidden by Paul (<a href=\"#\" onClick=\"return mV('1Cr',10,10);\">1Cr 10:10</a>).";
eastonArray["$$T0002623"] = "<strong>Murrain:</strong> Heb. deber, \"destruction,\" a \"great mortality\", the fifth plague that fell upon the Egyptians (<a href=\"#\" onClick=\"return mV('Exd',9,3);\">Exd 9:3</a>). It was some distemper that resulted in the sudden and widespread death of the cattle. It was confined to the cattle of the Egyptians that were in the field (<a href=\"#\" onClick=\"return mV('Exd',9,6);\">9:6</a>).";
eastonArray["$$T0002624"] = "<strong>Mushi:</strong> receding, the second of the two sons of Merari (<a href=\"#\" onClick=\"return mV('Exd',6,19);\">Exd 6:19</a>; <a href=\"#\" onClick=\"return mV('Num',3,20);\">Num 3:20</a>). His sons were called Mushites (<a href=\"#\" onClick=\"return mV('Num',3,33);\">Num 3:33</a>; <a href=\"#\" onClick=\"return mV('Num',26,58);\">26:58</a>).";
eastonArray["$$T0002625"] = "<strong>Music:</strong> Jubal was the inventor of musical instruments (<a href=\"#\" onClick=\"return mV('Gen',4,21);\">Gen 4:21</a>). The Hebrews were much given to the cultivation of music. Their whole history and literature afford abundant evidence of this. After the Deluge, the first mention of music is in the account of Laban's interview with Jacob (<a href=\"#\" onClick=\"return mV('Gen',31,27);\">Gen 31:27</a>). After their triumphal passage of the Red Sea, Moses and the children of Israel sang their song of deliverance (<a href=\"#\" onClick=\"return mV('Exd',15,'1-')\">Exd 15</a>).<br><br>But the period of Samuel, David, and Solomon was the golden age of Hebrew music, as it was of Hebrew poetry. Music was now for the first time systematically cultivated. It was an essential part of training in the schools of the prophets (<a href=\"#\" onClick=\"return mV('1Sa',10,5);\">1Sa 10:5</a>; <a href=\"#\" onClick=\"return mV('1Sa',19,'19-24');\">19:19-24</a>; <a href=\"#\" onClick=\"return mV('2Ki',3,15);\">2Ki 3:15</a>; <a href=\"#\" onClick=\"return mV('1Ch',25,6);\">1Ch 25:6</a>). There now arose also a class of professional singers (<a href=\"#\" onClick=\"return mV('2Sa',19,35);\">2Sa 19:35</a>; <a href=\"#\" onClick=\"return mV('Ecc',2,8);\">Ecc 2:8</a>). The temple, however, was the great school of music. In the conducting of its services large bands of trained singers and players on instruments were constantly employed (<a href=\"#\" onClick=\"return mV('2Sa',6,5);\">2Sa 6:5</a>; <a href=\"#\" onClick=\"return mV('1Ch',15,'1-')\">1Ch 15</a>; <a href=\"#\" onClick=\"return mV('1Ch',16,'1-')\">16</a>; <a href=\"#\" onClick=\"return mV('1Ch',16,'1-')\">23:5</a>; <a href=\"#\" onClick=\"return mV('1Ch',25,'1-6');\">25:1-6</a>).<br><br>In private life also music seems to have held an important place among the Hebrews (<a href=\"#\" onClick=\"return mV('Ecc',2,8);\">Ecc 2:8</a>; <a href=\"#\" onClick=\"return mV('Amo',6,'4-6');\">Amo 6:4-6</a>; <a href=\"#\" onClick=\"return mV('Isa',5,11,12);\">Isa 5:11-12</a>; <a href=\"#\" onClick=\"return mV('Isa',24,8,9);\">24:8-9</a>; <a href=\"#\" onClick=\"return mV('Psa',137,'1-')\">Psa 137</a>; <a href=\"#\" onClick=\"return mV('Jer',48,33);\">Jer 48:33</a>; <a href=\"#\" onClick=\"return mV('Luk',15,25);\">Luk 15:25</a>).";
eastonArray["$$T0002626"] = "<strong>Musician, Chief:</strong> (Heb. menatstseah), the precentor of the Levitical choir or orchestra in the temple, mentioned in the titles of fifty-five psalms, and in <a href=\"#\" onClick=\"return mV('Hab',3,19);\">Hab 3:19</a>, Revised Version. The first who held this office was Jeduthun (<a href=\"#\" onClick=\"return mV('1Ch',16,41);\">1Ch 16:41</a>), and the office appears to have been hereditary. Heman and Asaph were his two colleagues (<a href=\"#\" onClick=\"return mV('2Ch',35,15);\">2Ch 35:15</a>).";
eastonArray["$$T0002627"] = "<strong>Music, Instrumental:</strong> Among instruments of music used by the Hebrews a principal place is given to stringed instruments. These were,<br><br>(1.) The kinnor, the \"harp.\"<br><br>(2.) The nebel, \"a skin bottle,\" rendered \"psaltery.\"<br><br>(3.) The sabbeka, or \"sackbut,\" a lute or lyre.<br><br>(4.) The gittith, occurring in the title of <a href=\"#\" onClick=\"return mV('Psa',8,1);\">Psa 8:1</a>; <a href=\"#\" onClick=\"return mV('Psa',81,1);\">81:1</a>; <a href=\"#\" onClick=\"return mV('Psa',84,1);\">84:1</a>.<br><br>(5.) Minnim (<a href=\"#\" onClick=\"return mV('Psa',150,4);\">Psa 150:4</a>), rendered \"stringed instruments;\" in <a href=\"#\" onClick=\"return mV('Psa',45,8);\">Psa 45:8</a>, in the form <i>minni</i>, probably the apocopated (i.e., shortened) plural, rendered, Authorized Version, \"whereby,\" and in the Revised Version \"stringed instruments.\"<br><br>(6.) Machalath, in the titles of <a href=\"#\" onClick=\"return mV('Psa',53,'1-');\">Psa 53</a> and <a href=\"#\" onClick=\"return mV('Psa',88,'1-');\">88</a>; supposed to be a kind of lute or guitar.<br><br>Of wind instruments mention is made of,<br><br>(1.) The 'ugab (<a href=\"#\" onClick=\"return mV('Gen',4,21);\">Gen 4:21</a>; <a href=\"#\" onClick=\"return mV('Job',21,12);\">Job 21:12</a>; <a href=\"#\" onClick=\"return mV('Job',30,31);\">30:31</a>), probably the so-called Pan's pipes or syrinx.<br><br>(2.) The qeren or \"horn\" (<a href=\"#\" onClick=\"return mV('Jos',6,5);\">Jos 6:5</a>; <a href=\"#\" onClick=\"return mV('1Ch',25,5);\">1Ch 25:5</a>).<br><br>(3.) The shophar, rendered \"trumpet\" (<a href=\"#\" onClick=\"return mV('Jos',6,4,6,8);\">Jos 6:4, 6, 8</a>). The word means \"bright,\" and may have been so called from the clear, shrill sound it emitted. It was often used (<a href=\"#\" onClick=\"return mV('Exd',19,13);\">Exd 19:13</a>; <a href=\"#\" onClick=\"return mV('Num',10,10);\">Num 10:10</a>; <a href=\"#\" onClick=\"return mV('Jdg',7,16,18);\">Jdg 7:16, 18</a>; <a href=\"#\" onClick=\"return mV('1Sa',13,3);\">1Sa 13:3</a>).<br><br>(4.) The hatsotserah, or straight trumpet (<a href=\"#\" onClick=\"return mV('Psa',98,6);\">Psa 98:6</a>; <a href=\"#\" onClick=\"return mV('Num',10,'1-10');\">Num 10:1-10</a>). This name is supposed by some to be an onomatopoetic word, intended to imitate the pulse-like sound of the trumpet, like the Latin taratantara. Some have identified it with the modern trombone.<br><br>(5.) The halil, i.e, \"bored through,\" a flute or pipe (<a href=\"#\" onClick=\"return mV('1Sa',10,5);\">1Sa 10:5</a>; <a href=\"#\" onClick=\"return mV('1Ki',1,40);\">1Ki 1:40</a>; <a href=\"#\" onClick=\"return mV('Isa',5,12);\">Isa 5:12</a>; <a href=\"#\" onClick=\"return mV('Jer',48,36);\">Jer 48:36</a>) which is still used in Palestine.<br><br>(6.) The sumponyah, rendered \"dulcimer\" (<a href=\"#\" onClick=\"return mV('Dan',3,5);\">Dan 3:5</a>), probably a sort of bagpipe.<br><br>(7.) The maskrokith'a (<a href=\"#\" onClick=\"return mV('Dan',3,5);\">Dan 3:5</a>), rendered \"flute,\" but its precise nature is unknown.<br><br>Of instruments of percussion mention is made of,<br><br>(1.) The toph, an instrument of the drum kind, rendered \"timbrel\" (<a href=\"#\" onClick=\"return mV('Exd',15,20);\">Exd 15:20</a>; <a href=\"#\" onClick=\"return mV('Job',21,12);\">Job 21:12</a>; <a href=\"#\" onClick=\"return mV('Psa',68,25);\">Psa 68:25</a>); also \"tabret\" (<a href=\"#\" onClick=\"return mV('Gen',31,27);\">Gen 31:27</a>; <a href=\"#\" onClick=\"return mV('Isa',24,8);\">Isa 24:8</a>; <a href=\"#\" onClick=\"return mV('1Sa',10,5);\">1Sa 10:5</a>).<br><br>(2.) The paamon, the \"bells\" on the robe of the high priest (<a href=\"#\" onClick=\"return mV('Exd',28,33);\">Exd 28:33</a>; <a href=\"#\" onClick=\"return mV('Exd',39,25);\">39:25</a>).<br><br>(3.) The tseltselim, \"cymbals\" (<a href=\"#\" onClick=\"return mV('2Sa',6,5);\">2Sa 6:5</a>; <a href=\"#\" onClick=\"return mV('Psa',150,5);\">Psa 150:5</a>), which are struck together and produce a loud, clanging sound. Metsilloth, \"bells\" on horses and camels for ornament, and metsiltayim, \"cymbals\" (<a href=\"#\" onClick=\"return mV('1Ch',13,8);\">1Ch 13:8</a>; <a href=\"#\" onClick=\"return mV('Ezr',3,10);\">Ezr 3:10</a>, etc.). These words are all derived from the same root, tsalal, meaning \"to tinkle.\"<br><br>(4.) The menaan'im, used only in <a href=\"#\" onClick=\"return mV('2Sa',6,5);\">2Sa 6:5</a>, rendered \"cornets\" (R.V., \"castanets\"); in the Vulgate, \"sistra,\" an instrument of agitation.<br><br>(5.) The shalishim, mentioned only in <a href=\"#\" onClick=\"return mV('1Sa',18,6);\">1Sa 18:6</a>, rendered \"instruments of music\" (marg. of R.V., \"triangles or three-stringed instruments\").<br><br>The words in <a href=\"#\" onClick=\"return mV('Ecc',2,8);\">Ecc 2:8</a>, \"musical instruments, and that of all sorts,\" Authorized Version, are in the Revised Version \"concubines very many.\"";
eastonArray["$$T0002628"] = "<strong>Mustard:</strong> a plant of the genus sinapis, a pod-bearing, shrub-like plant, growing wild, and also cultivated in gardens. The little round seeds were an emblem of any small insignificant object. It is not mentioned in the Old Testament; and in each of the three instances of its occurrence in the New Testament (<a href=\"#\" onClick=\"return mV('Mat',13,31,32);\">Mat 13:31-32</a>; <a href=\"#\" onClick=\"return mV('Mar',4,31,32);\">Mar 4:31-32</a>; <a href=\"#\" onClick=\"return mV('Luk',13,18,19);\">Luk 13:18-19</a>) it is spoken of only with reference to the smallness of its seed. The common mustard of Palestine is the <i>Sinapis nigra</i>. This garden herb sometimes grows to a considerable height, so as to be spoken of as \"a tree\" as compared with garden herbs.";
eastonArray["$$T0002629"] = "<strong>Muth-labben:</strong> occurring only in the title of <a href=\"#\" onClick=\"return mV('Psa',9,'1-');\">Psalm 9</a>. Some interpret the words as meaning \"on the death of Labben,\" some unknown person. Others render the word, \"on the death of the son;\" i.e., of Absalom (<a href=\"#\" onClick=\"return mV('2Sa',18,33);\">2Sa 18:33</a>). Others again have taken the word as the name of a musical instrument, or as the name of an air to which the psalm was sung.";
eastonArray["$$T0002630"] = "<strong>Muzzle:</strong> Grain in the East is usually thrashed by the sheaves being spread out on a floor, over which oxen and cattle are driven to and fro, till the grain is trodden out. Moses ordained that the ox was not to be muzzled while thrashing. It was to be allowed to eat both the grain and the straw (<a href=\"#\" onClick=\"return mV('Deu',25,4);\">Deu 25:4</a>). (See  <a href=\"#\" onClick=\"return doDictLookup('ET0000124');\">AGRICULTURE</a>.)";
eastonArray["$$T0002631"] = "<strong>Myra:</strong> one of the chief towns of Lycia, in Asia Minor, about 2 1/2 miles from the coast (<a href=\"#\" onClick=\"return mV('Act',27,5);\">Act 27:5</a>). Here Paul removed from the Adramyttian ship in which he had sailed from Caesarea, and entered into the Alexandrian ship, which was afterwards wrecked at Melita (<a href=\"#\" onClick=\"return mV('Act',27,'39-44');\">27:39-44</a>).";
eastonArray["$$T0002632"] = "<strong>Myrrh:</strong> Heb. mor.<br><br>(1.) First mentioned as a principal ingredient in the holy anointing oil (<a href=\"#\" onClick=\"return mV('Exd',30,23);\">Exd 30:23</a>). It formed part of the gifts brought by the wise men from the east, who came to worship the infant Jesus (<a href=\"#\" onClick=\"return mV('Mat',2,11);\">Mat 2:11</a>). It was used in embalming (<a href=\"#\" onClick=\"return mV('Jhn',19,39);\">Jhn 19:39</a>), also as a perfume (<a href=\"#\" onClick=\"return mV('Est',2,12);\">Est 2:12</a>; <a href=\"#\" onClick=\"return mV('Psa',45,8);\">Psa 45:8</a>; <a href=\"#\" onClick=\"return mV('Pro',7,17);\">Pro 7:17</a>). It was a custom of the Jews to give those who were condemned to death by crucifixion \"wine mingled with myrrh\" to produce insensibility. This drugged wine was probably partaken of by the two malefactors, but when the Roman soldiers pressed it upon Jesus \"he received it not\" (<a href=\"#\" onClick=\"return mV('Mar',15,23);\">Mar 15:23</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001419');\">GALL</a>.)<br><br>This was the gum or viscid white liquid which flows from a tree resembling the acacia, found in Africa and Arabia, the <i>Balsamodendron myrrha</i> of botanists. The \"bundle of myrrh\" in <a href=\"#\" onClick=\"return mV('Sgs',1,13);\">Sgs 1:13</a> is rather a \"bag\" of myrrh or a scent-bag.<br><br>(2.) Another word <i>lot</i> is also translated \"myrrh\" (<a href=\"#\" onClick=\"return mV('Gen',37,25);\">Gen 37:25</a>; <a href=\"#\" onClick=\"return mV('Gen',43,11);\">43:11</a>; R.V., marg., \"or ladanum\"). What was meant by this word is uncertain. It has been thought to be the chestnut, mastich, stacte, balsam, turpentine, pistachio nut, or the lotus. It is probably correctly rendered by the Latin word ladanum, the Arabic ladan, an aromatic juice of a shrub called the Cistus or rock rose, which has the same qualities, though in a slight degree, of opium, whence a decoction of opium is called laudanum. This plant was indigenous to Syria and Arabia.";
eastonArray["$$T0002633"] = "<strong>Myrtle:</strong> (<a href=\"#\" onClick=\"return mV('Isa',41,19);\">Isa 41:19</a>; <a href=\"#\" onClick=\"return mV('Neh',8,15);\">Neh 8:15</a>; <a href=\"#\" onClick=\"return mV('Zec',1,8);\">Zec 1:8</a>), Hebrew hadas, known in the East by the name <i>as</i>, the <i>Myrtus communis</i> of the botanist. \"Although no myrtles are now found on the mount (of Olives), excepting in the gardens, yet they still exist in many of the glens about Jerusalem, where we have often seen its dark shining leaves and white flowers. There are many near Bethlehem and about Hebron, especially near Dewir Dan, the ancient Debir. It also sheds its fragrance on the sides of Carmel and of Tabor, and fringes the clefts of the Leontes in its course through Galilee. We meet with it all through Central Palestine\" (Tristram).";
eastonArray["$$T0002634"] = "<strong>Mysia:</strong> a province in the north-west of Asia Minor. On his first voyage to Europe (<a href=\"#\" onClick=\"return mV('Act',16,7,8);\">Act 16:7-8</a>) Paul passed through this province and embarked at its chief port Troas.";
eastonArray["$$T0002635"] = "<strong>Mystery:</strong> the calling of the Gentiles into the Christian Church, so designated (<a href=\"#\" onClick=\"return mV('Eph',1,9,10);\">Eph 1:9-10</a>; <a href=\"#\" onClick=\"return mV('Eph',3,'8-11');\">3:8-11</a>; <a href=\"#\" onClick=\"return mV('Col',1,'25-27');\">Col 1:25-27</a>); a truth undiscoverable except by revelation, long hid, now made manifest. The resurrection of the dead (<a href=\"#\" onClick=\"return mV('1Cr',15,51);\">1Cr 15:51</a>), and other doctrines which need to be explained but which cannot be fully understood by finite intelligence (<a href=\"#\" onClick=\"return mV('Mat',13,11);\">Mat 13:11</a>; <a href=\"#\" onClick=\"return mV('Rom',11,25);\">Rom 11:25</a>; <a href=\"#\" onClick=\"return mV('1Cr',13,2);\">1Cr 13:2</a>); the union between Christ and his people symbolized by the marriage union (<a href=\"#\" onClick=\"return mV('Eph',5,31,32);\">Eph 5:31-32</a>; <a href=\"#\" onClick=\"return mV('Eph',6,19);\">Eph 6:19</a>); the seven stars and the seven candlesticks (<a href=\"#\" onClick=\"return mV('Rev',1,20);\">Rev 1:20</a>); and the woman clothed in scarlet (<a href=\"#\" onClick=\"return mV('Rev',17,7);\">17:7</a>), are also in this sense mysteries. The anti-Christian power working in his day is called by the apostle (<a href=\"#\" onClick=\"return mV('2Th',2,7);\">2Th 2:7</a>) the \"mystery of iniquity.\"";
eastonArray["$$T0002636"] = "<strong>Naam:</strong> pleasantness, one of the three sons of Caleb, the son of Jephunneh (<a href=\"#\" onClick=\"return mV('1Ch',4,15);\">1Ch 4:15</a>).";
eastonArray["$$T0002637"] = "<strong>Naamah:</strong> the beautiful.<br><br>(1.) The daughter of Lamech and Zillah (<a href=\"#\" onClick=\"return mV('Gen',4,22);\">Gen 4:22</a>).<br><br>(2.) The daughter of the king of Ammon, one of the wives of Solomon, the only one who appears to have borne him a son, viz., Rehoboam (<a href=\"#\" onClick=\"return mV('1Ki',14,21,31);\">1Ki 14:21, 31</a>).<br><br>(3.) A city in the plain of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,41);\">Jos 15:41</a>), supposed by some to be identified with Na'aneh, some 5 miles south-east of Makkedah.";
eastonArray["$$T0002638"] = "<strong>Naaman:</strong> pleasantness, a Syrian, the commander of the armies of Benhadad II. in the time of Joram, king of Israel. He was afflicted with leprosy; and when the little Hebrew slave-girl that waited on his wife told her of a prophet in Samaria who could cure her master, he obtained a letter from Benhadad and proceeded with it to Joram. The king of Israel suspected in this some evil design against him, and rent his clothes. Elisha the prophet hearing of this, sent for Naaman, and the strange interview which took place is recorded in <a href=\"#\" onClick=\"return mV('2Ki',5,'1-');\">2 Kings 5</a>. The narrative contains all that is known of the Syrian commander. He was cured of his leprosy by dipping himself seven times in the Jordan, according to the word of Elisha. His cure is alluded to by our Lord (<a href=\"#\" onClick=\"return mV('Luk',4,27);\">Luk 4:27</a>).";
eastonArray["$$T0002639"] = "<strong>Naamathite:</strong> the designation of Zophar, one of Job's three friends (<a href=\"#\" onClick=\"return mV('Job',2,11);\">Job 2:11</a>; <a href=\"#\" onClick=\"return mV('Job',11,1);\">11:1</a>), so called from some place in Arabia, called Naamah probably.";
eastonArray["$$T0002640"] = "<strong>Naarah:</strong> a girl, the second of Ashur's two wives, of the tribe of Judah (<a href=\"#\" onClick=\"return mV('1Ch',4,5,6);\">1Ch 4:5-6</a>).";
eastonArray["$$T0002641"] = "<strong>Naarai:</strong> youthful, a military chief in David's army (<a href=\"#\" onClick=\"return mV('1Ch',11,37);\">1Ch 11:37</a>), called also Paarai (<a href=\"#\" onClick=\"return mV('2Sa',23,35);\">2Sa 23:35</a>).";
eastonArray["$$T0002642"] = "<strong>Naaran:</strong> boyish, juvenile, a town in Ephraim between Bethel and Jericho (<a href=\"#\" onClick=\"return mV('1Ch',7,28);\">1Ch 7:28</a>).";
eastonArray["$$T0002643"] = "<strong>Naarath:</strong> girl, a town on the boundary between Ephraim and Benjamin (<a href=\"#\" onClick=\"return mV('Jos',16,7);\">Jos 16:7</a>), not far probably from Jericho, to the north (<a href=\"#\" onClick=\"return mV('1Ch',7,28);\">1Ch 7:28</a>).";
eastonArray["$$T0002644"] = "<strong>Nabal:</strong> foolish, a descendant of Caleb who dwelt at Maon (<a href=\"#\" onClick=\"return mV('1Sa',25,'1-')\">1Sa 25</a>), the modern Main, 7 miles south-east of Hebron. He was \"very great, and he had 3,000 sheep and 1,000 goats...but the man was churlish and evil in his doings.\" During his wanderings David came into that district, and hearing that Nabal was about to shear his sheep, he sent ten of his young men to ask \"whatsoever cometh unto thy hand for thy servants.\" Nabal insultingly resented the demand, saying, \"Who is David, and who is the son of Jesse?\" (<a href=\"#\" onClick=\"return mV('1Sa',25,10,11);\">1Sa 25:10-11</a>). One of the shepherds that stood by and saw the reception David's messengers had met with, informed Abigail, Nabal's wife, who at once realized the danger that threatened her household. She forthwith proceeded to the camp of David, bringing with her ample stores of provisions (<a href=\"#\" onClick=\"return mV('1Sa',25,18);\">25:18</a>). She so courteously and persuasively pled her cause that David's anger was appeased, and he said to her, \"Blessed be the Lord God of Israel which sent thee this day to meet me.\"<br><br>On her return she found her husband incapable from drunkenness of understanding the state of matters, and not till the following day did she explain to him what had happened. He was stunned by a sense of the danger to which his conduct had exposed him. \"His heart died within him, and he became as a stone.\" and about ten days after \"the Lord smote Nabal that he died\" (<a href=\"#\" onClick=\"return mV('1Sa',25,37,38);\">1Sa 25:37-38</a>). Not long after David married Abigail (q.v.).";
eastonArray["$$T0002645"] = "<strong>Naboth:</strong> fruits, \"the Jezreelite,\" was the owner of a portion of ground on the eastern slope of the hill of Jezreel (<a href=\"#\" onClick=\"return mV('2Ki',9,25,26);\">2Ki 9:25-26</a>). This small \"plat of ground\" seems to have been all he possessed. It was a vineyard, and lay \"hard by the palace of Ahab\" (<a href=\"#\" onClick=\"return mV('1Ki',21,1,2);\">1Ki 21:1-2</a>), who greatly coveted it. Naboth, however, refused on any terms to part with it to the king. He had inherited it from his fathers, and no Israelite could lawfully sell his property (<a href=\"#\" onClick=\"return mV('Lev',25,23);\">Lev 25:23</a>). Jezebel, Ahab's wife, was grievously offended at Naboth's refusal to part with his vineyard. By a crafty and cruel plot she compassed his death. His sons also shared his fate (<a href=\"#\" onClick=\"return mV('2Ki',9,26);\">2Ki 9:26</a>; <a href=\"#\" onClick=\"return mV('1Ki',21,19);\">1Ki 21:19</a>). She then came to Ahab and said, \"Arise, take possession of the vineyard; for Naboth is not alive, but dead.\" Ahab arose and went forth into the garden which had so treacherously and cruelly been acquired, seemingly enjoying his new possession, when, lo, Elijah suddenly appeared before him and pronounced against him a fearful doom (<a href=\"#\" onClick=\"return mV('1Ki',21,'17-24');\">1Ki 21:17-24</a>). Jehu and Bidcar were with Ahab at this time, and so deeply were the words of Elijah imprinted on Jehu's memory that many years afterwards he refers to them (<a href=\"#\" onClick=\"return mV('2Ki',9,26);\">2Ki 9:26</a>), and he was the chief instrument in inflicting this sentence on Ahab and Jezebel and all their house (<a href=\"#\" onClick=\"return mV('2Ki',9,'30-37');\">9:30-37</a>). The house of Ahab was extinguished by him. Not one of all his great men and his kinsfolk and his priests did Jehu spare (<a href=\"#\" onClick=\"return mV('2Ki',10,11);\">10:11</a>).<br><br>Ahab humbled himself at Elijah's words (<a href=\"#\" onClick=\"return mV('1Ki',21,28,29);\">1Ki 21:28-29</a>), and therefore the prophecy was fulfilled not in his fate but in that of his son Joram (<a href=\"#\" onClick=\"return mV('2Ki',9,25);\">2Ki 9:25</a>).<br><br>The history of Naboth, compared with that of Ahab and Jezebel, furnishes a remarkable illustration of the law of a retributive providence, a law which runs through all history (<a href=\"#\" onClick=\"return mV('Psa',109,17,18);\">Psa 109:17-18</a>).";
eastonArray["$$T0002646"] = "<strong>Nachon:</strong> prepared, the owner of a thrashing-floor near which Uzzah was slain (<a href=\"#\" onClick=\"return mV('2Sa',6,6);\">2Sa 6:6</a>); called also Chidon (<a href=\"#\" onClick=\"return mV('1Ch',13,9);\">1Ch 13:9</a>).";
eastonArray["$$T0002647"] = "<strong>Nadab:</strong> liberal, generous.<br><br>(1.) The eldest of Aaron's four sons (<a href=\"#\" onClick=\"return mV('Exd',6,23);\">Exd 6:23</a>; <a href=\"#\" onClick=\"return mV('Num',3,2);\">Num 3:2</a>). He with his brothers and their father were consecrated as priests of Jehovah (<a href=\"#\" onClick=\"return mV('Exd',28,1);\">Exd 28:1</a>). He afterwards perished with Abihu for the sin of offering strange fire on the altar of burnt-offering (<a href=\"#\" onClick=\"return mV('Lev',10,1,2);\">Lev 10:1-2</a>; <a href=\"#\" onClick=\"return mV('Num',3,4);\">Num 3:4</a>; <a href=\"#\" onClick=\"return mV('Num',26,60);\">26:60</a>).<br><br>(2.) The son and successor of Jeroboam, the king of Israel (<a href=\"#\" onClick=\"return mV('1Ki',14,20);\">1Ki 14:20</a>). While engaged with all Israel in laying siege to Gibbethon, a town of southern Dan (<a href=\"#\" onClick=\"return mV('Jos',19,44);\">Jos 19:44</a>), a conspiracy broke out in his army, and he was slain by Baasha (<a href=\"#\" onClick=\"return mV('1Ki',15,'25-28');\">1Ki 15:25-28</a>), after a reign of two years (B.C. 955-953). The assassination of Nadab was followed by that of his whole house, and thus this great Ephraimite family became extinct (<a href=\"#\" onClick=\"return mV('1Ki',15,29);\">1Ki 15:29</a>).<br><br>(3.) One of the sons of Shammai in the tribe of Judah (<a href=\"#\" onClick=\"return mV('1Ch',2,28,30);\">1Ch 2:28, 30</a>).";
eastonArray["$$T0002648"] = "<strong>Nagge:</strong> illuminating, one of the ancestors of Christ in the maternal line (<a href=\"#\" onClick=\"return mV('Luk',3,25);\">Luk 3:25</a>).";
eastonArray["$$T0002649"] = "<strong>Nahaliel:</strong> possession, or valley of God, one of the encampments of the Israelites in the wilderness (<a href=\"#\" onClick=\"return mV('Num',21,19);\">Num 21:19</a>), on the confines of Moab. This is identified with the ravine of the Zerka M'ain, the ancient Callirhoe, the hot springs on the east of the Jordan, not far from the Dead Sea.";
