<script>
var eastonArray = new Array ();
eastonArray["$$T0000450"] = "<strong>Barkos:</strong> painter, (<a href=\"#\" onClick=\"return mV('Ezr',2,53);\">Ezr 2:53</a>; <a href=\"#\" onClick=\"return mV('Neh',7,55);\">Neh 7:55</a>). The father of some of the Nethinim.";
eastonArray["$$T0000451"] = "<strong>Barley:</strong> a grain much cultivated in Egypt (<a href=\"#\" onClick=\"return mV('Exd',9,31);\">Exd 9:31</a>) and in Palestine (<a href=\"#\" onClick=\"return mV('Lev',27,16);\">Lev 27:16</a>; <a href=\"#\" onClick=\"return mV('Deu',8,8);\">Deu 8:8</a>). It was usually the food of horses (<a href=\"#\" onClick=\"return mV('1Ki',4,28);\">1Ki 4:28</a>). Barley bread was used by the poorer people (<a href=\"#\" onClick=\"return mV('Jdg',7,13);\">Jdg 7:13</a>; <a href=\"#\" onClick=\"return mV('2Ki',4,42);\">2Ki 4:42</a>). Barley of the first crop was ready for the harvest by the time of the Passover, in the middle of April (<a href=\"#\" onClick=\"return mV('Rth',1,22);\">Rth 1:22</a>; <a href=\"#\" onClick=\"return mV('2Sa',21,9);\">2Sa 21:9</a>). Mention is made of barley-meal (<a href=\"#\" onClick=\"return mV('Num',5,15);\">Num 5:15</a>). Our Lord fed five thousand with \"five barley loaves and two small fishes\" (<a href=\"#\" onClick=\"return mV('Jhn',6,9);\">Jhn 6:9</a>).";
eastonArray["$$T0000452"] = "<strong>Barn:</strong> a storehouse (<a href=\"#\" onClick=\"return mV('Deu',28,8);\">Deu 28:8</a>; <a href=\"#\" onClick=\"return mV('Job',39,12);\">Job 39:12</a>; <a href=\"#\" onClick=\"return mV('Hag',2,19);\">Hag 2:19</a>) for grain, which was usually under ground, although also sometimes above ground (<a href=\"#\" onClick=\"return mV('Luk',12,18);\">Luk 12:18</a>).";
eastonArray["$$T0000453"] = "<strong>Barnabas:</strong> son of consolation, the surname of Joses, a Levite (<a href=\"#\" onClick=\"return mV('Act',4,36);\">Act 4:36</a>). His name stands first on the list of prophets and teachers of the church at Antioch (<a href=\"#\" onClick=\"return mV('Act',13,1);\">13:1</a>). Luke speaks of him as a \"good man\" (<a href=\"#\" onClick=\"return mV('Act',11,24);\">Act 11:24</a>). He was born of Jewish parents of the tribe of Levi. He was a native of Cyprus, where he had a possession of land (<a href=\"#\" onClick=\"return mV('Act',4,36,37);\">Act 4:36-37</a>), which he sold. His personal appearance is supposed to have been dignified and commanding (<a href=\"#\" onClick=\"return mV('Act',14,11,12);\">Act 14:11-12</a>). When Paul returned to Jerusalem after his conversion, Barnabas took him and introduced him to the apostles (<a href=\"#\" onClick=\"return mV('Act',9,27);\">9:27</a>). They had probably been companions as students in the school of Gamaliel.<br><br>The prosperity of the church at Antioch led the apostles and brethren at Jerusalem to send Barnabas thither to superintend the movement. He found the work so extensive and weighty that he went to Tarsus in search of Saul to assist him. Saul returned with him to Antioch and laboured with him for a whole year (<a href=\"#\" onClick=\"return mV('Act',11,25,26);\">Act 11:25-26</a>). The two were at the end of this period sent up to Jerusalem with the contributions the church at Antioch had made for the poorer brethren there (<a href=\"#\" onClick=\"return mV('Act',11,'28-30');\">11:28-30</a>). Shortly after they returned, bringing John Mark with them, they were appointed as missionaries to the heathen world, and in this capacity visited Cyprus and some of the principal cities of Asia Minor (<a href=\"#\" onClick=\"return mV('Act',13,14);\">Act 13:14</a>). Returning from this first missionary journey to Antioch, they were again sent up to Jerusalem to consult with the church there regarding the relation of Gentiles to the church (<a href=\"#\" onClick=\"return mV('Act',15,2);\">Act 15:2</a>; <a href=\"#\" onClick=\"return mV('Gal,2,1);\">Gal 2:1</a>). This matter having been settled, they returned again to Antioch, bringing the decree of the council as the rule by which Gentiles were to be admitted into the church.<br><br>When about to set forth on a second missionary journey, a dispute arose between Saul and Barnabas as to the propriety of taking John Mark with them again. The dispute ended by Saul and Barnabas taking separate routes. Saul took Silas as his companion, and journeyed through Syria and Cilicia; while Barnabas took his nephew John Mark, and visited Cyprus (<a href=\"#\" onClick=\"return mV('Act',15,'36-41');\">Act 15:36-41</a>). Barnabas is not again mentioned by Luke in the Acts.";
eastonArray["$$T0000454"] = "<strong>Barrel:</strong> a vessel used for keeping flour (<a href=\"#\" onClick=\"return mV('1Ki',17,12,14,16);\">1Ki 17:12, 14, 16</a>). The same word (cad) so rendered is also translated \"pitcher,\" a vessel for carrying water (<a href=\"#\" onClick=\"return mV('Gen',24,14);\">Gen 24:14</a>; <a href=\"#\" onClick=\"return mV('Jdg',7,16);\">Jdg 7:16</a>).";
eastonArray["$$T0000455"] = "<strong>Barren:</strong> For a woman to be barren was accounted a severe punishment among the Jews (<a href=\"#\" onClick=\"return mV('Gen',16,2);\">Gen 16:2</a>; <a href=\"#\" onClick=\"return mV('Gen',30,'1-23');\">30:1-23</a>; <a href=\"#\" onClick=\"return mV('1Sa',1,6,27);\">1Sa 1:6, 27</a>; <a href=\"#\" onClick=\"return mV('Isa',47,9);\">Isa 47:9</a>; <a href=\"#\" onClick=\"return mV('Isa',49,21);\">49:21</a>; <a href=\"#\" onClick=\"return mV('Luk',1,25);\">Luk 1:25</a>). Instances of barrenness are noticed (<a href=\"#\" onClick=\"return mV('Gen',11,30);\">Gen 11:30</a>; <a href=\"#\" onClick=\"return mV('Gen',25,21);\">25:21</a>; <a href=\"#\" onClick=\"return mV('Gen',29,31);\">29:31</a>; <a href=\"#\" onClick=\"return mV('Jdg',13,2,3);\">Jdg 13:2-3</a>; <a href=\"#\" onClick=\"return mV('Luk',1,7,36);\">Luk 1:7, 36</a>).";
eastonArray["$$T0000456"] = "<strong>Barsabas:</strong> son of Saba, the surname<br><br>(1) of Joseph, also called Justus (<a href=\"#\" onClick=\"return mV('Act',1,23);\">Act 1:23</a>), some identify him with Barnabas;<br><br>(2) of Judas, who was a \"prophet.\" Nothing more is known of him than what is mentioned in <a href=\"#\" onClick=\"return mV('Act',15,32);\">Act 15:32</a>.";
eastonArray["$$T0000457"] = "<strong>Bartholomew:</strong> son of Tolmai, one of the twelve apostles (<a href=\"#\" onClick=\"return mV('Mat',10,3);\">Mat 10:3</a>; <a href=\"#\" onClick=\"return mV('Act',1,13);\">Act 1:13</a>); generally supposed to have been the same as Nathanael. In the synoptic gospels Philip and Bartholomew are always mentioned together, while Nathanael is never mentioned; in the fourth gospel, on the other hand, Philip and Nathanael are similarly mentioned together, but nothing is said of Bartholomew. He was one of the disciples to whom our Lord appeared at the Sea of Tiberias after his resurrection (<a href=\"#\" onClick=\"return mV('Jhn',21,2);\">Jhn 21:2</a>). He was also a witness of the Ascension (<a href=\"#\" onClick=\"return mV('Act',1,4,12,13);\">Act 1:4, 12-13</a>). He was an \"Israelite indeed\" (<a href=\"#\" onClick=\"return mV('Jhn',1,47);\">Jhn 1:47</a>).";
eastonArray["$$T0000458"] = "<strong>Bartimaeus:</strong> son of Timaeus, one of the two blind beggars of Jericho (<a href=\"#\" onClick=\"return mV('Mar',10,46);\">Mar 10:46</a>; <a href=\"#\" onClick=\"return mV('Mat',20,30);\">Mat 20:30</a>). His blindness was miraculously cured on the ground of his faith.";
eastonArray["$$T0000459"] = "<strong>Baruch:</strong> blessed.<br><br>(1.) The secretary of the prophet Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',32,12);\">Jer 32:12</a>; <a href=\"#\" onClick=\"return mV('Jer',36,4);\">36:4</a>). He was of the tribe of Judah (<a href=\"#\" onClick=\"return mV('Jer',51,59);\">51:59</a>). To him Jeremiah dictated his prophecies regarding the invasion of the Babylonians and the Captivity. These he read to the people from a window in the temple in the fourth year of the reign of Jehoiakim, king of Judah (<a href=\"#\" onClick=\"return mV('Jer',36,'1-')\">Jer 36</a>). He afterwards read them before the counsellors of the king at a private interview; and then to the king himself, who, after hearing a part of the roll, cut it with a penknife, and threw it into the fire of his winter parlour, where he was sitting.<br><br>During the siege of Jerusalem by Nebuchadnezzar, he was the keeper of the deed of purchase Jeremiah had made of the territory of Hanameel (<a href=\"#\" onClick=\"return mV('Jer',32,12);\">Jer 32:12</a>). Being accused by his enemies of favouring the Chaldeans, he was cast, with Jeremiah, into prison, where he remained till the capture of Jerusalem (B.C. 586). He probably died in Babylon.<br><br>(2.) <a href=\"#\" onClick=\"return mV('Neh',3,20);\">Neh 3:20</a>; <a href=\"#\" onClick=\"return mV('Neh',10,6);\">10:6</a>; <a href=\"#\" onClick=\"return mV('Neh',11,5);\">11:5</a>.";
eastonArray["$$T0000460"] = "<strong>Barzillai:</strong> of iron.<br><br>(1.) A Meholathite, the father of Adriel (<a href=\"#\" onClick=\"return mV('2Sa',21,8);\">2Sa 21:8</a>).<br><br>(2.) A Gileadite of Rogelim who was distinguished for his loyalty to David. He liberally provided for the king's followers (<a href=\"#\" onClick=\"return mV('2Sa',17,27);\">2Sa 17:27</a>). David on his death-bed, remembering his kindness, commended Barzillai's children to the care of Solomon (<a href=\"#\" onClick=\"return mV('1Ki',2,7);\">1Ki 2:7</a>).<br><br>(3.) A priest who married a daughter of the preceding (<a href=\"#\" onClick=\"return mV('Ezr',2,61);\">Ezr 2:61</a>).";
eastonArray["$$T0000461"] = "<strong>Bashan:</strong> light soil, first mentioned in <a href=\"#\" onClick=\"return mV('Gen',14,5);\">Gen 14:5</a>, where it is said that Chedorlaomer and his confederates \"smote the Rephaim in Ashteroth,\" where Og the king of Bashan had his residence. At the time of Israel's entrance into the Promised Land, Og came out against them, but was utterly routed (<a href=\"#\" onClick=\"return mV('Num',21,'33-35');\">Num 21:33-35</a>; <a href=\"#\" onClick=\"return mV('Deu',3,'1-7');\">Deu 3:1-7</a>). This country extended from Gilead in the south to Hermon in the north, and from the Jordan on the west to Salcah on the east. Along with the half of Gilead it was given to the half-tribe of Manasseh (<a href=\"#\" onClick=\"return mV('Jos',13,'29-31');\">Jos 13:29-31</a>). Golan, one of its cities, became a \"city of refuge\" (<a href=\"#\" onClick=\"return mV('Jos',21,27);\">Jos 21:27</a>). Argob, in Bashan, was one of Solomon's commissariat districts (<a href=\"#\" onClick=\"return mV('1Ki',4,13);\">1Ki 4:13</a>). The cities of Bashan were taken by Hazael (<a href=\"#\" onClick=\"return mV('2Ki',10,33);\">2Ki 10:33</a>), but were soon after reconquered by Jehoash (<a href=\"#\" onClick=\"return mV('2Ki',13,25);\">2Ki 13:25</a>), who overcame the Syrians in three battles, according to the word of Elisha (<a href=\"#\" onClick=\"return mV('2Ki',13,19);\">19</a>). From this time Bashan almost disappears from history, although we read of the wild cattle of its rich pastures (<a href=\"#\" onClick=\"return mV('Eze',39,18);\">Eze 39:18</a>; <a href=\"#\" onClick=\"return mV('Psa',22,12);\">Psa 22:12</a>), the oaks of its forests (<a href=\"#\" onClick=\"return mV('Isa',2,13);\">Isa 2:13</a>; <a href=\"#\" onClick=\"return mV('Eze',27,6);\">Eze 27:6</a>; <a href=\"#\" onClick=\"return mV('Zec',11,2);\">Zec 11:2</a>), and the beauty of its extensive plains (<a href=\"#\" onClick=\"return mV('Amo',4,1);\">Amo 4:1</a>; <a href=\"#\" onClick=\"return mV('Jer',50,19);\">Jer 50:19</a>). Soon after the conquest, the name \"Gilead\" was given to the whole country beyond Jordan. After the Exile, Bashan was divided into four districts,<br><br>(1.) Gaulonitis, or Jaulan, the most western;<br><br>(2.) Auranitis, the Hauran (<a href=\"#\" onClick=\"return mV('Eze',47,16);\">Eze 47:16</a>);<br><br>(3.) Argob or Trachonitis, now the Lejah; and<br><br>(4.) Batanaea, now Ard-el-Bathanyeh, on the east of the Lejah, with many deserted towns almost as perfect as when they were inhabited. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001675');\">HAURAN</a>.)";
eastonArray["$$T0000462"] = "<strong>Bashan-havoth-jair:</strong> the Bashan of the villages of Jair, the general name given to Argob by Jair, the son of Manasseh (<a href=\"#\" onClick=\"return mV('Deu',3,14);\">Deu 3:14</a>), containing sixty cities with walls and brazen gates (<a href=\"#\" onClick=\"return mV('Jos',13,30);\">Jos 13:30</a>; <a href=\"#\" onClick=\"return mV('1Ki',4,13);\">1Ki 4:13</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000302');\">ARGOB</a>.)";
eastonArray["$$T0000463"] = "<strong>Bashan, Hill of:</strong> (<a href=\"#\" onClick=\"return mV('Psa',68,15);\">Psa 68:15</a>), probably another name for Hermon, which lies to the north of Bashan.";
eastonArray["$$T0000464"] = "<strong>Bashemath:</strong> sweet-smelling.<br><br>(1.) The daughter of Ishmael, the last of Esau's three wives (<a href=\"#\" onClick=\"return mV('Gen',36,3,4,13);\">Gen 36:3-4, 13</a>), from whose son Reuel four tribes of the Edomites sprung. She is also called Mahalath (<a href=\"#\" onClick=\"return mV('Gen',28,9);\">Gen 28:9</a>). It is noticeable that Esau's three wives receive different names in the genealogical table of the Edomites (<a href=\"#\" onClick=\"return mV('Gen',36,'1-')\">Gen 36</a>) from those given to them in the history (<a href=\"#\" onClick=\"return mV('Gen',26,34);\">Gen 26:34</a>; <a href=\"#\" onClick=\"return mV('Gen',28,9);\">28:9</a>).<br><br>(2.) A daughter of Solomon, and wife of Ahimaaz, one of his officers (<a href=\"#\" onClick=\"return mV('1Ki',4,15);\">1Ki 4:15</a>).";
eastonArray["$$T0000465"] = "<strong>Basilisk:</strong> (<a href=\"#\" onClick=\"return mV('Isa',11,8);\">Isa 11:8</a>; <a href=\"#\" onClick=\"return mV('Isa',14,29);\">14:29</a>; <a href=\"#\" onClick=\"return mV('Isa',59,5);\">59:5</a>; <a href=\"#\" onClick=\"return mV('Jer',8,17);\">Jer 8:17</a>), the \"king serpent,\" as the name imports; a fabulous serpent said to be three spans long, with a spot on its head like a crown. Probably the yellow snake is intended. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000854');\">COCKATRICE</a>.)";
eastonArray["$$T0000466"] = "<strong>Basin:</strong> or Bason.<br><br>(1.) A trough or laver (Heb. aggan') for washing (<a href=\"#\" onClick=\"return mV('Exd',24,6);\">Exd 24:6</a>); rendered also \"goblet\" (<a href=\"#\" onClick=\"return mV('Sgs',7,2);\">Sgs 7:2</a>) and \"cups\" (<a href=\"#\" onClick=\"return mV('Isa',22,24);\">Isa 22:24</a>).<br><br>(2.) A covered dish or urn (Heb. k'for) among the vessels of the temple (<a href=\"#\" onClick=\"return mV('1Ch',28,17);\">1Ch 28:17</a>; <a href=\"#\" onClick=\"return mV('Ezr',1,10);\">Ezr 1:10</a>; <a href=\"#\" onClick=\"return mV('Ezr',8,27);\">8:27</a>).<br><br>(3.) A vase (Heb. mizrak) from which to sprinkle anything. A metallic vessel; sometimes rendered \"bowl\" (<a href=\"#\" onClick=\"return mV('Amo',6,6);\">Amo 6:6</a>; <a href=\"#\" onClick=\"return mV('Zec',9,15);\">Zec 9:15</a>). The vessels of the tabernacle were of brass (<a href=\"#\" onClick=\"return mV('Exd',27,3);\">Exd 27:3</a>), while those of the temple were of gold (<a href=\"#\" onClick=\"return mV('2Ch',4,8);\">2Ch 4:8</a>).<br><br>(4.) A utensil (Heb. saph) for holding the blood of the victims (<a href=\"#\" onClick=\"return mV('Exd',12,22);\">Exd 12:22</a>); also a basin for domestic purposes (<a href=\"#\" onClick=\"return mV('2Sa',17,28);\">2Sa 17:28</a>).<br><br>The various vessels spoken of by the names \"basin, bowl, charger, cup, and dish,\" cannot now be accurately distinguished.<br><br>The basin in which our Lord washed the disciples' feet (<a href=\"#\" onClick=\"return mV('Jhn',13,5);\">Jhn 13:5</a>) must have been larger and deeper than the hand-basin.";
eastonArray["$$T0000467"] = "<strong>Basket:</strong> There are five different Hebrew words so rendered in the Authorized Version:<br><br>(1.) A basket (Heb. sal, a twig or osier) for holding bread (<a href=\"#\" onClick=\"return mV('Gen',40,16);\">Gen 40:16</a>; <a href=\"#\" onClick=\"return mV('Exd',29,3,23);\">Exd 29:3, 23</a>; <a href=\"#\" onClick=\"return mV('Lev',8,2,26,31);\">Lev 8:2, 26, 31</a>; <a href=\"#\" onClick=\"return mV('Num',6,15,17,19);\">Num 6:15, 17, 19</a>). Sometimes baskets were made of twigs peeled; their manufacture was a recognized trade among the Hebrews.<br><br>(2.) That used (Heb. salsilloth') in gathering grapes (<a href=\"#\" onClick=\"return mV('Jer',6,9);\">Jer 6:9</a>).<br><br>(3.) That in which the first fruits of the harvest were presented, Heb. tene, (<a href=\"#\" onClick=\"return mV('Deu',26,2,4);\">Deu 26:2, 4</a>). It was also used for household purposes. In form it tapered downwards like that called <i>corbis</i> by the Romans.<br><br>(4.) A basket (Heb. kelub) having a lid, resembling a bird-cage. It was made of leaves or rushes. The name is also applied to fruit-baskets (<a href=\"#\" onClick=\"return mV('Amo',8,1,2);\">Amo 8:1-2</a>).<br><br>(5.) A basket (Heb. dud) for carrying figs (<a href=\"#\" onClick=\"return mV('Jer',24,2);\">Jer 24:2</a>), also clay to the brick-yard (<a href=\"#\" onClick=\"return mV('Psa',81,6);\">Psa 81:6</a>), and bulky articles (<a href=\"#\" onClick=\"return mV('2Ki',10,7);\">2Ki 10:7</a>). This word is also rendered in the Authorized Version \"kettle\" (<a href=\"#\" onClick=\"return mV('1Sa',2,14);\">1Sa 2:14</a>), \"caldron\" (<a href=\"#\" onClick=\"return mV('2Ch',35,13);\">2Ch 35:13</a>), \"seething-pot\" (<a href=\"#\" onClick=\"return mV('Job',41,20);\">Job 41:20</a>).<br><br>In the New Testament mention is made of the basket (Gr. kophinos, small \"wicker-basket\") for the \"fragments\" in the miracle recorded <a href=\"#\" onClick=\"return mV('Mar',6,43);\">Mar 6:43</a>, and in that recorded <a href=\"#\" onClick=\"return mV('Mat',15,37);\">Mat 15:37</a> (Gr. spuris, large \"rope-basket\"); also of the basket in which Paul escaped (<a href=\"#\" onClick=\"return mV('Act',9,25);\">Act 9:25</a>, Gr. spuris; <a href=\"#\" onClick=\"return mV('2Cr',11,33);\">2Cr 11:33</a>, Gr. sargane, \"basket of plaited cords\").";
eastonArray["$$T0000468"] = "<strong>Bastard:</strong> In the Old Testament the rendering of the Hebrew word <i>mamzer'</i>, which means \"polluted.\" In <a href=\"#\" onClick=\"return mV('Deu',23,2);\">Deu 23:2</a>, it occurs in the ordinary sense of illegitimate offspring. In <a href=\"#\" onClick=\"return mV('Zec',9,6);\">Zec 9:6</a>, the word is used in the sense of foreigner. From the history of Jephthah we learn that there were bastard offspring among the Jews (<a href=\"#\" onClick=\"return mV('Jdg',11,'1-7');\">Jdg 11:1-7</a>). In <a href=\"#\" onClick=\"return mV('Hbr',12,8);\">Hbr 12:8</a>, the word (Gr. nothoi) is used in its ordinary sense, and denotes those who do not share the privileges of God's children.";
eastonArray["$$T0000469"] = "<strong>Bastinado:</strong> beating, a mode of punishment common in the East. It is referred to by \"the rod of correction\" (<a href=\"#\" onClick=\"return mV('Pro',22,15);\">Pro 22:15</a>), \"scourging\" (<a href=\"#\" onClick=\"return mV('Lev',19,20);\">Lev 19:20</a>), \"chastising\" (<a href=\"#\" onClick=\"return mV('Deu',22,18);\">Deu 22:18</a>). The number of blows could not exceed forty (<a href=\"#\" onClick=\"return mV('Deu',25,2,3);\">Deu 25:2-3</a>).";
eastonArray["$$T0000470"] = "<strong>Bat:</strong> The Hebrew word (atalleph') so rendered (<a href=\"#\" onClick=\"return mV('Lev',11,19);\">Lev 11:19</a>; <a href=\"#\" onClick=\"return mV('Deu',14,18);\">Deu 14:18</a>) implies \"flying in the dark.\" The bat is reckoned among the birds in the list of unclean animals. To cast idols to the \"moles and to the bats\" means to carry them into dark caverns or desolate places to which these animals resort (<a href=\"#\" onClick=\"return mV('Isa',2,20);\">Isa 2:20</a>), i.e., to consign them to desolation or ruin.";
eastonArray["$$T0000471"] = "<strong>Bath:</strong> a Hebrew liquid measure, the tenth part of an homer (<a href=\"#\" onClick=\"return mV('1Ki',7,26,38);\">1Ki 7:26, 38</a>; <a href=\"#\" onClick=\"return mV('Eze',45,10,14);\">Eze 45:10, 14</a>). It contained 8 gallons 3 quarts of our measure. \"Ten acres of vineyard shall yield one bath\" (<a href=\"#\" onClick=\"return mV('Isa',5,10);\">Isa 5:10</a>) denotes great unproductiveness.";
eastonArray["$$T0000472"] = "<strong>Bath-rabbim:</strong> daughter of many, the name of one of the gates of the city of Heshbon, near which were pools (<a href=\"#\" onClick=\"return mV('Sgs',7,4);\">Sgs 7:4</a>).";
eastonArray["$$T0000473"] = "<strong>Baths:</strong> The use of the bath was very frequent among the Hebrews (<a href=\"#\" onClick=\"return mV('Lev',14,8);\">Lev 14:8</a>; <a href=\"#\" onClick=\"return mV('Num',19,19);\">Num 19:19</a>, ect.). The high priest at his inauguration (<a href=\"#\" onClick=\"return mV('Lev',8,6);\">Lev 8:6</a>), and on the day of atonement, was required to bathe himself (<a href=\"#\" onClick=\"return mV('Lev',16,4,24);\">16:4, 24</a>). The \"pools\" mentioned in <a href=\"#\" onClick=\"return mV('Neh',3,15,16);\">Neh 3:15-16</a>; <a href=\"#\" onClick=\"return mV('2Ki',20,20);\">2Ki 20:20</a>; <a href=\"#\" onClick=\"return mV('Isa',22,11);\">Isa 22:11</a>; <a href=\"#\" onClick=\"return mV('Jhn',9,7);\">Jhn 9:7</a>, were public bathing-places.";
eastonArray["$$T0000474"] = "<strong>Bath-sheba:</strong> daughter of the oath, or of seven, called also Bath-shu'a (<a href=\"#\" onClick=\"return mV('1Ch',3,5);\">1Ch 3:5</a>), was the daughter of Eliam (<a href=\"#\" onClick=\"return mV('2Sa',11,3);\">2Sa 11:3</a>) or Ammiel (<a href=\"#\" onClick=\"return mV('1Ch',3,5);\">1Ch 3:5</a>), and wife of Uriah the Hittite. David committed adultery with her (<a href=\"#\" onClick=\"return mV('2Sa',11,4,5);\">2Sa 11:4-5</a>; <a href=\"#\" onClick=\"return mV('Psa',51,1);\">Psa 51:1</a>). The child born in adultery died (<a href=\"#\" onClick=\"return mV('2Sa',12,'15-19');\">2Sa 12:15-19</a>). After her husband was slain (<a href=\"#\" onClick=\"return mV('2Sa',11,15);\">11:15</a>) she was married to David (<a href=\"#\" onClick=\"return mV('2Sa',11,27);\">11:27</a>), and became the mother of Solomon (<a href=\"#\" onClick=\"return mV('2Sa',12,24);\">12:24</a>; <a href=\"#\" onClick=\"return mV('1Ki',1,11);\">1Ki 1:11</a>; <a href=\"#\" onClick=\"return mV('1Ki',2,13);\">2:13</a>). She took a prominent part in securing the succession of Solomon to the throne (<a href=\"#\" onClick=\"return mV('1Ki',1,11,'16-21');\">1Ki 1:11, 16-21</a>).";
eastonArray["$$T0000475"] = "<strong>Battering-ram:</strong> (<a href=\"#\" onClick=\"return mV('Eze',4,2);\">Eze 4:2</a>; <a href=\"#\" onClick=\"return mV('Eze',21,22);\">21:22</a>), a military engine, consisting of a long beam of wood hung upon a frame, for making breaches in walls. The end of it which was brought against the wall was shaped like a ram's head.";
eastonArray["$$T0000476"] = "<strong>Battle-axe:</strong> a mallet or heavy war-club. Applied metaphorically (<a href=\"#\" onClick=\"return mV('Jer',51,20);\">Jer 51:20</a>) to Cyrus, God's instrument in destroying Babylon.";
eastonArray["$$T0000477"] = "<strong>Battle-bow:</strong> the war-bow used in fighting (<a href=\"#\" onClick=\"return mV('Zec',9,10);\">Zec 9:10</a>; <a href=\"#\" onClick=\"return mV('Zec',10,4);\">10:4</a>). \"Thy bow was made quite naked\" (<a href=\"#\" onClick=\"return mV('Hab',3,9);\">Hab 3:9</a>) means that it was made ready for use. By David's order (<a href=\"#\" onClick=\"return mV('2Sa',1,18);\">2Sa 1:18</a>) the young men were taught the use, or rather the song of the bow. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000315');\">ARMOUR</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0000631');\">BOW</a>.)";
eastonArray["$$T0000478"] = "<strong>Battlement:</strong> a parapet wall or balustrade surrounding the flat roofs of the houses, required to be built by a special law (<a href=\"#\" onClick=\"return mV('Deu',22,8);\">Deu 22:8</a>). In <a href=\"#\" onClick=\"return mV('Jer',5,10);\">Jer 5:10</a>, it denotes the parapet of a city wall.";
eastonArray["$$T0000479"] = "<strong>Bay:</strong> denotes the estuary of the Dead Sea at the mouth of the Jordan (<a href=\"#\" onClick=\"return mV('Jos',15,5);\">Jos 15:5</a>; <a href=\"#\" onClick=\"return mV('Jos',18,19);\">18:19</a>), also the southern extremity of the same sea (<a href=\"#\" onClick=\"return mV('Jos',15,2);\">15:2</a>). The same Hebrew word is rendered \"tongue\" in <a href=\"#\" onClick=\"return mV('Isa',11,15);\">Isa 11:15</a>, where it is used with reference to the forked mouths of the Nile.<br><br>Bay in <a href=\"#\" onClick=\"return mV('Zec',6,3,7);\">Zec 6:3, 7</a>,  denotes the colour of horses, but the original Hebrew means strong, and is here used rather to describe the horses as fleet or spirited.";
eastonArray["$$T0000480"] = "<strong>Bay tree:</strong> named only in <a href=\"#\" onClick=\"return mV('Psa',37,35);\">Psa 37:35</a>, Authorized Version. The Hebrew word so rendered is <i>ereh</i>, which simply means \"native born\", i.e., a tree not transplanted, but growing on its native soil, and therefore luxuriantly. If the psalmist intended by this word to denote any particular tree, it may have been the evergreen bay laurel (<i>Laurus nobilis</i>), which is a native of Palestine. Instead of \"like a green bay tree\" in the Authorized Version, the Revised Version has, \"like a green tree in its native soil.\"";
eastonArray["$$T0000481"] = "<strong>Bdellium:</strong> occurs only in <a href=\"#\" onClick=\"return mV('Gen',2,12);\">Gen 2:12</a>, where it designates a product of the land of Havilah; and in <a href=\"#\" onClick=\"return mV('Num',11,7);\">Num 11:7</a>, where the manna is likened to it in colour. It was probably an aromatic gum like balsam which exuded from a particular tree (<i>Borassus flabelliformis</i>) still found in Arabia, Media, and India. It bears a resemblance in colour to myrrh. Others think the word denotes \"pearls,\" or some precious stone.";
eastonArray["$$T0000482"] = "<strong>Beacon:</strong> a pole (Heb. to'ren) used as a standard or ensign set on the tops of mountains as a call to the people to assemble themselves for some great national purpose (<a href=\"#\" onClick=\"return mV('Isa',30,17);\">Isa 30:17</a>). In <a href=\"#\" onClick=\"return mV('Isa',33,23);\">Isa 33:23</a> and <a href=\"#\" onClick=\"return mV('Eze',27,5);\">Eze 27:5</a>, the same word is rendered \"mast.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0000433');\">BANNER</a>.)";
eastonArray["$$T0000483"] = "<strong>Bealiah:</strong> whose Lord is Jehovah, a Benjamite, one of David's thirty heroes of the sling and bow (<a href=\"#\" onClick=\"return mV('1Ch',12,5);\">1Ch 12:5</a>).";
eastonArray["$$T0000484"] = "<strong>Bealoth:</strong> citizens, a town in the extreme south of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,24);\">Jos 15:24</a>); probably the same as Baalath-beer (<a href=\"#\" onClick=\"return mV('Jos',19,8);\">19:8</a>). In <a href=\"#\" onClick=\"return mV('1Ki',4,16);\">1Ki 4:16</a>, the Authorized Version has \"in Aloth,\" the Revised Version \"Bealoth.\"";
eastonArray["$$T0000485"] = "<strong>Beam:</strong> occurs in the Authorized Version as the rendering of various Hebrew words. In <a href=\"#\" onClick=\"return mV('1Sa',17,7);\">1Sa 17:7</a>, it means a weaver's frame or principal beam; in <a href=\"#\" onClick=\"return mV('Hab',2,11);\">Hab 2:11</a>, a crossbeam or girder; <a href=\"#\" onClick=\"return mV('2Ki',6,2,5);\">2 Kings 6:2, 5</a>, a cross-piece or rafter of a house; <a href=\"#\" onClick=\"return mV('1Ki',7,6);\">1Ki 7:6</a>, an architectural ornament as a projecting step or moulding; <a href=\"#\" onClick=\"return mV('Eze',41,25);\">Eze 41:25</a>, a thick plank. In the New Testament the word occurs only in <a href=\"#\" onClick=\"return mV('Mat',7,3,4,5);\">Mat 7:3, 4, 5</a>, and <a href=\"#\" onClick=\"return mV('Luk',6,41,42);\">Luk 6:41-42</a>, where it means (Gr. dokos) a large piece of wood used for building purposes, as contrasted with \"mote\" (Gr. karphos), a small piece or mere splinter. \"Mote\" and \"beam\" became proverbial for little and great faults.";
eastonArray["$$T0000486"] = "<strong>Beans:</strong> mentioned in <a href=\"#\" onClick=\"return mV('2Sa',17,28);\">2Sa 17:28</a> as having been brought to David when flying from Absalom. They formed a constituent in the bread Ezekiel (<a href=\"#\" onClick=\"return mV('Eze',4,9);\">Eze 4:9</a>) was commanded to make, as they were in general much used as an article of diet. They are extensively cultivated in Egypt and Arabia and Syria.";
eastonArray["$$T0000487"] = "<strong>Bear:</strong> a native of the mountain regions of Western Asia, frequently mentioned in Scripture. David defended his flocks against the attacks of a bear (<a href=\"#\" onClick=\"return mV('1Sa',17,'34-37');\">1Sa 17:34-37</a>). Bears came out of the wood and destroyed the children who mocked the prophet Elisha (<a href=\"#\" onClick=\"return mV('2Ki',2,24);\">2Ki 2:24</a>). Their habits are referred to in <a href=\"#\" onClick=\"return mV('Isa',59,11);\">Isa 59:11</a>; <a href=\"#\" onClick=\"return mV('Pro',28,15);\">Pro 28:15</a>; <a href=\"#\" onClick=\"return mV('Lam',3,10);\">Lam 3:10</a>. The fury of the female bear when robbed of her young is spoken of (<a href=\"#\" onClick=\"return mV('2Sa',17,8);\">2Sa 17:8</a>; <a href=\"#\" onClick=\"return mV('Pro',17,12);\">Pro 17:12</a>; <a href=\"#\" onClick=\"return mV('Hsa',13,8);\">Hsa 13:8</a>). In Daniel's vision of the four great monarchies, the Medo-Persian empire is represented by a bear (<a href=\"#\" onClick=\"return mV('Dan',7,5);\">Dan 7:5</a>).";
eastonArray["$$T0000488"] = "<strong>Beard:</strong> The mode of wearing it was definitely prescribed to the Jews (<a href=\"#\" onClick=\"return mV('Lev',19,27);\">Lev 19:27</a>; <a href=\"#\" onClick=\"return mV('Lev',21,5);\">21:5</a>). Hence the import of Ezekiel's (<a href=\"#\" onClick=\"return mV('Eze',5,'1-4');\">Eze 5:1-4</a>) description of the \"razor\" i.e., the agents of an angry providence being used against the guilty nation of the Jews. It was a part of a Jew's daily toilet to anoint his beard with oil and perfume (<a href=\"#\" onClick=\"return mV('Psa',133,2);\">Psa 133:2</a>). Beards were trimmed with the most fastidious care (<a href=\"#\" onClick=\"return mV('2Sa',19,24);\">2Sa 19:24</a>), and their neglet was an indication of deep sorrow (<a href=\"#\" onClick=\"return mV('Isa',15,2);\">Isa 15:2</a>; <a href=\"#\" onClick=\"return mV('Jer',41,5);\">Jer 41:5</a>). The custom was to shave or pluck off the hair as a sign of mourning (<a href=\"#\" onClick=\"return mV('Isa',50,6);\">Isa 50:6</a>; <a href=\"#\" onClick=\"return mV('Jer',48,37);\">Jer 48:37</a>; <a href=\"#\" onClick=\"return mV('Ezr',9,3);\">Ezr 9:3</a>). The beards of David's ambassadors were cut off by Hanun (<a href=\"#\" onClick=\"return mV('2Sa',10,4);\">2Sa 10:4</a>) as a mark of indignity.<br><br>On the other hand, the Egyptians carefully shaved the hair off their faces, and they compelled their slaves to do so also (<a href=\"#\" onClick=\"return mV('Gen',41,14);\">Gen 41:14</a>).";
eastonArray["$$T0000489"] = "<strong>Beast:</strong> This word is used of flocks or herds of grazing animals (<a href=\"#\" onClick=\"return mV('Exd',22,5);\">Exd 22:5</a>; <a href=\"#\" onClick=\"return mV('Num',20,4,8,11);\">Num 20:4, 8, 11</a>; <a href=\"#\" onClick=\"return mV('Psa',78,48);\">Psa 78:48</a>); of beasts of burden (<a href=\"#\" onClick=\"return mV('Gen',45,17);\">Gen 45:17</a>); of eatable beasts (<a href=\"#\" onClick=\"return mV('Pro',9,2);\">Pro 9:2</a>); and of swift beasts or dromedaries (<a href=\"#\" onClick=\"return mV('Isa',60,6);\">Isa 60:6</a>). In the New Testament it is used of a domestic animal as property (<a href=\"#\" onClick=\"return mV('Rev',18,13);\">Rev 18:13</a>); as used for food (<a href=\"#\" onClick=\"return mV('1Cr',15,39);\">1Cr 15:39</a>), for service (<a href=\"#\" onClick=\"return mV('Luk',10,34);\">Luk 10:34</a>; <a href=\"#\" onClick=\"return mV('Act',23,24);\">Act 23:24</a>), and for sacrifice (<a href=\"#\" onClick=\"return mV('Act',7,42);\">Act 7:42</a>).<br><br>When used in contradistinction to man (<a href=\"#\" onClick=\"return mV('Psa',36,6);\">Psa 36:6</a>), it denotes a brute creature generally, and when in contradistinction to creeping things (<a href=\"#\" onClick=\"return mV('Lev',11,'2-7');\">Lev 11:2-7</a>; <a href=\"#\" onClick=\"return mV('Lev',27,26);\">27:26</a>), a four-footed animal.<br><br>The Mosaic law required that beasts of labour should have rest on the Sabbath (<a href=\"#\" onClick=\"return mV('Exd',20,10);\">Exd 20:10</a>; <a href=\"#\" onClick=\"return mV('Exd',23,12);\">23:12</a>), and in the Sabbatical year all cattle were allowed to roam about freely, and eat whatever grew in the fields (<a href=\"#\" onClick=\"return mV('Exd',23,11);\">Exd 23:11</a>; <a href=\"#\" onClick=\"return mV('Lev',25,7);\">Lev 25:7</a>). No animal could be castrated (<a href=\"#\" onClick=\"return mV('Lev',22,24);\">Lev 22:24</a>). Animals of different kinds were to be always kept separate (<a href=\"#\" onClick=\"return mV('Lev',19,19);\">Lev 19:19</a>; <a href=\"#\" onClick=\"return mV('Deu',22,10);\">Deu 22:10</a>). Oxen when used in threshing were not to be prevented from eating what was within their reach (<a href=\"#\" onClick=\"return mV('Deu',25,4);\">Deu 25:4</a>; <a href=\"#\" onClick=\"return mV('1Cr',9,9);\">1Cr 9:9</a>).<br><br>This word is used figuratively of an infuriated multitude (<a href=\"#\" onClick=\"return mV('1Cr',15,32);\">1Cr 15:32</a>; <a href=\"#\" onClick=\"return mV('Act',19,29);\">Act 19:29</a>; <a href=\"#\" onClick=\"return mV('Psa',22,12,16);\">Psa 22:12, 16</a>; <a href=\"#\" onClick=\"return mV('Ecc',3,18);\">Ecc 3:18</a>; <a href=\"#\" onClick=\"return mV('Isa',11,'6-8');\">Isa 11:6-8</a>), and of wicked men (<a href=\"#\" onClick=\"return mV('2Pe',2,12);\">2Pe 2:12</a>). The four beasts of <a href=\"#\" onClick=\"return mV('Dan',7,3,17,23);\">Dan 7:3, 17, 23</a> represent four kingdoms or kings.";
eastonArray["$$T0000490"] = "<strong>Beaten gold:</strong> in <a href=\"#\" onClick=\"return mV('Num',8,4);\">Num 8:4</a>, means \"turned\" or rounded work in gold. The Greek Version, however, renders the word \"solid gold;\" the Revised Version, \"beaten work of gold.\" In <a href=\"#\" onClick=\"return mV('1Ki',10,16,17);\">1Ki 10:16-17</a>, it probably means \"mixed\" gold, as the word ought to be rendered, i.e., not pure gold. Others render the word in these places \"thin plates of gold.\"";
eastonArray["$$T0000491"] = "<strong>Beaten oil:</strong> (<a href=\"#\" onClick=\"return mV('Exd',27,20);\">Exd 27:20</a>; <a href=\"#\" onClick=\"return mV('Exd',29,40);\">29:40</a>), obtained by pounding olives in a mortar, not by crushing them in a mill. It was reckoned the best. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002778');\">OLIVE</a>.)";
eastonArray["$$T0000492"] = "<strong>Beautiful gate:</strong> the name of one of the gates of the temple (<a href=\"#\" onClick=\"return mV('Act',3,2);\">Act 3:2</a>). It is supposed to have been the door which led from the court of the Gentiles to the court of the women. It was of massive structure, and covered with plates of Corinthian brass.";
eastonArray["$$T0000493"] = "<strong>Becher:</strong> first-born; a youth, the second son of Benjamin (<a href=\"#\" onClick=\"return mV('Gen',46,21);\">Gen 46:21</a>), who came down to Egypt with Jacob. It is probable that he married an Ephraimitish heiress, and that his descendants were consequently reckoned among the tribe of Ephraim (<a href=\"#\" onClick=\"return mV('Num',26,35);\">Num 26:35</a>; <a href=\"#\" onClick=\"return mV('1Ch',7,20,21);\">1Ch 7:20-21</a>). They are not reckoned among the descendants of Benjamin (<a href=\"#\" onClick=\"return mV('Num',26,38);\">Num 26:38</a>).";
eastonArray["$$T0000494"] = "<strong>Bed:</strong> (Heb. mittah), for rest at night (<a href=\"#\" onClick=\"return mV('Exd',8,3);\">Exd 8:3</a>; <a href=\"#\" onClick=\"return mV('1Sa',19,13,15,16);\">1Sa 19:13, 15-16</a>, etc.); during sickness (<a href=\"#\" onClick=\"return mV('Gen',47,31);\">Gen 47:31</a>; <a href=\"#\" onClick=\"return mV('Gen',48,2);\">48:2</a>; <a href=\"#\" onClick=\"return mV('Gen',49,33);\">49:33</a>, etc.); as a sofa for rest (<a href=\"#\" onClick=\"return mV('1Sa',28,23);\">1Sa 28:23</a>; <a href=\"#\" onClick=\"return mV('Amo',3,12);\">Amo 3:12</a>). Another Hebrew word (er'es) so rendered denotes a canopied bed, or a bed with curtains (<a href=\"#\" onClick=\"return mV('Deu',3,11);\">Deu 3:11</a>; <a href=\"#\" onClick=\"return mV('Psa',132,3);\">Psa 132:3</a>), for sickness (<a href=\"#\" onClick=\"return mV('Psa',6,6);\">Psa 6:6</a>; <a href=\"#\" onClick=\"return mV('Psa',41,3);\">41:3</a>).<br><br>In the New Testament it denotes sometimes a litter with a coverlet (<a href=\"#\" onClick=\"return mV('Mat',9,2,6);\">Mat 9:2, 6</a>; <a href=\"#\" onClick=\"return mV('Luk',5,18);\">Luk 5:18</a>; <a href=\"#\" onClick=\"return mV('Act',5,15);\">Act 5:15</a>).<br><br>The Jewish bedstead was frequently merely the divan or platform along the sides of the house, sometimes a very slight portable frame, sometimes only a mat or one or more quilts. The only material for bed-clothes is mentioned in <a href=\"#\" onClick=\"return mV('1Sa',19,13);\">1Sa 19:13</a>. Sleeping in the open air was not uncommon, the sleeper wrapping himself in his outer garment (<a href=\"#\" onClick=\"return mV('Exd',22,26,27);\">Exd 22:26-27</a>; <a href=\"#\" onClick=\"return mV('Deu',24,12,13);\">Deu 24:12-13</a>).";
eastonArray["$$T0000495"] = "<strong>Bedan:</strong> one of the judges of Israel (<a href=\"#\" onClick=\"return mV('1Sa',12,11);\">1Sa 12:11</a>). It is uncertain who he was. Some suppose that Barak is meant, others Samson, but most probably this is a contracted form of Abdon (<a href=\"#\" onClick=\"return mV('Jdg',12,13);\">Jdg 12:13</a>).";
eastonArray["$$T0000496"] = "<strong>Bed-chamber:</strong> an apartment in Eastern houses, furnished with a slightly elevated platform at the upper end and sometimes along the sides, on which were laid mattresses. This was the general arrangement of the public sleeping-room for the males of the family and for guests, but there were usually besides distinct bed-chambers of a more private character (<a href=\"#\" onClick=\"return mV('2Ki',4,10);\">2Ki 4:10</a>; <a href=\"#\" onClick=\"return mV('Exd',8,3);\">Exd 8:3</a>; <a href=\"#\" onClick=\"return mV('2Ki',6,12);\">2Ki 6:12</a>). In <a href=\"#\" onClick=\"return mV('2Ki',11,2);\">2Ki 11:2</a> this word denotes, as in the margin of the Revised Version, a store-room in which mattresses were kept.";
eastonArray["$$T0000497"] = "<strong>Bedstead:</strong> used in <a href=\"#\" onClick=\"return mV('Deu',3,11);\">Deu 3:11</a>, but elsewhere rendered \"couch,\" \"bed.\" In <a href=\"#\" onClick=\"return mV('2Ki',1,4);\">2Ki 1:4</a>; <a href=\"#\" onClick=\"return mV('2Ki',16,2);\">16:2</a>; <a href=\"#\" onClick=\"return mV('Psa',132,3);\">Psa 132:3</a>; <a href=\"#\" onClick=\"return mV('Amo',3,12);\">Amo 3:12</a>, the divan is meant by this word.";
eastonArray["$$T0000498"] = "<strong>Bee:</strong> First mentioned in <a href=\"#\" onClick=\"return mV('Deu',1,44);\">Deu 1:44</a>. Swarms of bees, and the danger of their attacks, are mentioned in <a href=\"#\" onClick=\"return mV('Psa',118,12);\">Psa 118:12</a>. Samson found a \"swarm of bees\" in the carcass of a lion he had slain (<a href=\"#\" onClick=\"return mV('Jdg',14,8);\">Jdg 14:8</a>). Wild bees are described as laying up honey in woods and in clefts of rocks (<a href=\"#\" onClick=\"return mV('Deu',32,13);\">Deu 32:13</a>; <a href=\"#\" onClick=\"return mV('Psa',81,16);\">Psa 81:16</a>). In <a href=\"#\" onClick=\"return mV('Isa',7,18);\">Isa 7:18</a> the \"fly\" and the \"bee\" are personifications of the Egyptians and Assyrians, the inveterate enemies of Israel.";
eastonArray["$$T0000499"] = "<strong>Beelzebub:</strong> (Gr. form Beel'zebul), the name given to Satan, and found only in the New Testament (<a href=\"#\" onClick=\"return mV('Mat',10,25);\">Mat 10:25</a>; <a href=\"#\" onClick=\"return mV('Mat',12,24,27);\">12:24, 27</a>; <a href=\"#\" onClick=\"return mV('Mar',3,22);\">Mar 3:22</a>). It is probably the same as Baalzebub (q.v.), the god of Ekron, meaning \"the lord of flies,\" or, as others think, \"the lord of dung,\" or \"the dung-god.\"";
</script>
