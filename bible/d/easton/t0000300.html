<script>var eastonArray = new Array ();
eastonArray["$$T0000300"] = "<b>Areopagus:</b> the Latin form of the Greek word rendered \"Mars' hill.\" But it denotes also the council or court of justice which met in the open air on the hill. It was a rocky height to the west of the Acropolis at Athens, on the south-east summit of which the council was held which was constituted by Solon, and consisted of nine archons or chief magistrates who were then in office, and the ex-archons of blameless life.<br><br>On this hill of Mars (Gr. Ares) Paul delivered his memorable address to the \"men of Athens\" (<a href=\"#\" onClick=\"return mV('Act',17,'22-31');\">Act 17:22-31</a>).";
eastonArray["$$T0000301"] = "<b>Aretas:</b> the father-in-law of Herod Antipas, and king of Arabia Petraea. His daughter returned to him on the occasion of her husband's entering into an adulterous alliance with Herodias, the wife of Herod-Philip, his half-brother (<a href=\"#\" onClick=\"return mV('Luk',3,19,20);\">Luk 3:19-20</a>; <a href=\"#\" onClick=\"return mV('Mar',6,17);\">Mar 6:17</a>; <a href=\"#\" onClick=\"return mV('Mat',14,3);\">Mat 14:3</a>). This led to a war between Aretas and Herod Antipas. Herod's army was wholly destroyed (A.D. 36). Aretas, taking advantage of the complications of the times on account of the death of the Emperor Tiberius (A.D. 37), took possession of Damascus (<a href=\"#\" onClick=\"return mV('2Cr',11,32);\">2Cr 11:32</a>; <a href=\"#\" onClick=\"return mV('Act',9,25);\">Act 9:25</a>). At this time Paul returned to Damascus from Arabia.";
eastonArray["$$T0000302"] = "<b>Argob:</b> stony heap, an \"island,\" as it has been called, of rock about 30 miles by 20, rising 20 or 30 feet above the table-land of Bashan; a region of crags and chasms wild and rugged in the extreme. On this \"island\" stood sixty walled cities, ruled over by Og. It is called Trachonitis (\"the rugged region\") in the New Testament (<a href=\"#\" onClick=\"return mV('Luk',3,1);\">Luk 3:1</a>). These cities were conquered by the Israelites (<a href=\"#\" onClick=\"return mV('Deu',3,4);\">Deu 3:4</a>; <a href=\"#\" onClick=\"return mV('1Ki',4,13);\">1Ki 4:13</a>). It is now called the Lejah. Here \"sixty walled cities are still traceable in a space of 308 square miles. The architecture is ponderous and massive. Solid walls 4 feet thick, and stones on one another without cement; the roofs enormous slabs of basaltic rock, like iron; the doors and gates are of stone 18 inches thick, secured by ponderous bars. The land bears still the appearance of having been called the 'land of giants' under the giant Og.\" \"I have more than once entered a deserted city in the evening, taken possession of a comfortable house, and spent the night in peace. Many of the houses in the ancient cities of Bashan are perfect, as if only finished yesterday. The walls are sound, the roofs unbroken, and even the window-shutters in their places. These ancient cities of Bashan probably contain the very oldest specimens of domestic architecture in the world\" (Porter's Giant Cities). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000461');\">BASHAN</a>.)";
eastonArray["$$T0000303"] = "<b>Arieh:</b> the lion, the name of one of the body-guard slain with Pekahiah at Samaria (<a href=\"#\" onClick=\"return mV('2Ki',15,25);\">2Ki 15:25</a>) by the conspirator Pekah.";
eastonArray["$$T0000304"] = "<b>Ariel:</b> the lion of God.<br><br>(1.) One of the chief men sent by Ezra to procure Levites for the sanctuary (<a href=\"#\" onClick=\"return mV('Ezr',8,16);\">Ezr 8:16</a>).<br><br>(2.) A symbolic name for Jerusalem (<a href=\"#\" onClick=\"return mV('Isa',29,1,2,7);\">Isa 29:1-2, 7</a>) as \"victorious under God,\" and in <a href=\"#\" onClick=\"return mV('Eze',43,15,16);\">Eze 43:15-16</a>, for the altar (marg., Heb. 'ariel) of burnt offerings, the secret of Israel's lion-like strength.";
eastonArray["$$T0000305"] = "<b>Arimathea:</b> a \"city of the Jews\" (<a href=\"#\" onClick=\"return mV('Luk',23,51);\">Luk 23:51</a>), the birth-place of Joseph in whose sepulchre our Lord was laid (<a href=\"#\" onClick=\"return mV('Mat',27,57,60);\">Mat 27:57, 60</a>; <a href=\"#\" onClick=\"return mV('Jhn',19,38);\">Jhn 19:38</a>). It is probably the same place as Ramathaim in Ephraim, and the birth-place of Samuel (<a href=\"#\" onClick=\"return mV('1Sa',1,1,19);\">1Sa 1:1, 19</a>). Others identify it with Ramleh in Dan, or Rama (q.v.) in Benjamin (<a href=\"#\" onClick=\"return mV('Mat',2,18);\">Mat 2:18</a>).";
eastonArray["$$T0000306"] = "<b>Arioch:</b> lion-like, venerable.<br><br>(1.) A king of Ellasar who was confederate with Chedorlamer (<a href=\"#\" onClick=\"return mV('Gen',14,1,9);\">Gen 14:1, 9</a>). The tablets recently discovered by Mr. Pinches (see <a href=\"#\" onClick=\"return doDictLookup('ET0000758');\">CHALDEA</a>) show the true reading is Eri-Aku of Larsa. This Elamite name meant \"servant of the moon-god.\" It was afterwards changed into Rimsin, \"Have mercy, O moon-god.\"<br><br>(2.) <a href=\"#\" onClick=\"return mV('Dan',2,14);\">Dan 2:14</a>.";
eastonArray["$$T0000307"] = "<b>Aristarchus:</b> best ruler, native of Thessalonica (<a href=\"#\" onClick=\"return mV('Act',20,4);\">Act 20:4</a>), a companion of Paul (<a href=\"#\" onClick=\"return mV('Act',19,29);\">Act 19:29</a>; <a href=\"#\" onClick=\"return mV('Act',27,2);\">27:2</a>). He was Paul's \"fellow-prisoner\" at Rome (<a href=\"#\" onClick=\"return mV('Col',4,10);\">Col 4:10</a>; <a href=\"#\" onClick=\"return mV('Phm',1,24);\">Phm 1:24</a>).";
eastonArray["$$T0000308"] = "<b>Aristobulus:</b> a Roman mentioned in Paul's Epistle to the Romans (<a href=\"#\" onClick=\"return mV('Rom',16,10);\">Rom 16:10</a>), whose \"household\" is saluated.";
eastonArray["$$T0000309"] = "<b>Ark:</b> Noah's ark, a building of gopher-wood, and covered with pitch, 300 cubits long, 50 cubits broad, and 30 cubits high (<a href=\"#\" onClick=\"return mV('Gen',6,'14-16');\">Gen 6:14-16</a>); an oblong floating house of three stories, with a door in the side and a window in the roof. It was 100 years in building (<a href=\"#\" onClick=\"return mV('Gen',5,32);\">Gen 5:32</a>; <a href=\"#\" onClick=\"return mV('Gen',7,6);\">7:6</a>). It was intended to preserve certain persons and animals from the deluge which God was about to bring over the earth. It contained eight persons (<a href=\"#\" onClick=\"return mV('Gen',7,13);\">Gen 7:13</a>; <a href=\"#\" onClick=\"return mV('2Pe',2,5);\">2Pe 2:5</a>), and of all \"clean\" animals seven pairs, and of \"unclean\" one pair, and of birds seven pairs of each sort (<a href=\"#\" onClick=\"return mV('Gen',7,2,3);\">Gen 7:2-3</a>). It was in the form of an oblong square, with flat bottom and sloping roof. Traditions of the Deluge, by which the race of man was swept from the earth, and of the ark of Noah have been found existing among all nations.<br><br>The ark of bulrushes in which the infant Moses was laid (<a href=\"#\" onClick=\"return mV('Exd',2,3);\">Exd 2:3</a>) is called in the Hebrew <i>teebah</i>, a word derived from the Egyptian <i>teb</i>, meaning \"a chest.\" It was daubed with slime and with pitch. The bulrushes of which it was made were the papyrus reed.<br><br>The sacred ark is designated by a different Hebrew word, <i>'aron'</i>, which is the common name for a chest or coffer used for any purpose (<a href=\"#\" onClick=\"return mV('Gen',50,26);\">Gen 50:26</a>; <a href=\"#\" onClick=\"return mV('2Ki',12,9,10);\">2Ki 12:9-10</a>). It is distinguished from all others by such titles as the \"ark of God\" (<a href=\"#\" onClick=\"return mV('1Sa',3,3);\">1Sa 3:3</a>), \"ark of the covenant\" (<a href=\"#\" onClick=\"return mV('Jos',3,6);\">Jos 3:6</a>; <a href=\"#\" onClick=\"return mV('Hbr',9,4);\">Hbr 9:4</a>), \"ark of the testimony\" (<a href=\"#\" onClick=\"return mV('Exd',25,22);\">Exd 25:22</a>). It was made of acacia or shittim wood, a cubit and a half broad and high and two cubits long, and covered all over with the purest gold. Its upper surface or lid, the mercy-seat, was surrounded with a rim of gold; and on each of the two sides were two gold rings, in which were placed two gold-covered poles by which the ark could be carried (<a href=\"#\" onClick=\"return mV('Num',7,9);\">Num 7:9</a>; <a href=\"#\" onClick=\"return mV('Num',10,21);\">10:21</a>; <a href=\"#\" onClick=\"return mV('Num',4,5,19,20);\">4:5, 19-20</a>; <a href=\"#\" onClick=\"return mV('1Ki',8,3,6);\">1Ki 8:3, 6</a>). Over the ark, at the two extremities, were two cherubim, with their faces turned toward each other (<a href=\"#\" onClick=\"return mV('Lev',16,2);\">Lev 16:2</a>; <a href=\"#\" onClick=\"return mV('Num',7,89);\">Num 7:89</a>). Their outspread wings over the top of the ark formed the throne of God, while the ark itself was his footstool (<a href=\"#\" onClick=\"return mV('Exd',25,'10-22');\">Exd 25:10-22</a>; <a href=\"#\" onClick=\"return mV('Exd',37,'1-9');\">37:1-9</a>). The ark was deposited in the \"holy of holies,\" and was so placed that one end of the poles by which it was carried touched the veil which separated the two apartments of the tabernacle (<a href=\"#\" onClick=\"return mV('1Ki',8,8);\">1Ki 8:8</a>). The two tables of stone which constituted the \"testimony\" or evidence of God's covenant with the people (<a href=\"#\" onClick=\"return mV('Deu',31,26);\">Deu 31:26</a>), the \"pot of manna\" (<a href=\"#\" onClick=\"return mV('Exd',16,33);\">Exd 16:33</a>), and \"Aaron's rod that budded\" (<a href=\"#\" onClick=\"return mV('Num',17,10);\">Num 17:10</a>), were laid up in the ark (<a href=\"#\" onClick=\"return mV('Hbr',9,4);\">Hbr 9:4</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0003559');\">TABERNACLE</a>) The ark and the sanctuary were \"the beauty of Israel\" (<a href=\"#\" onClick=\"return mV('Lam',2,1);\">Lam 2:1</a>). During the journeys of the Israelites the ark was carried by the priests in advance of the host (<a href=\"#\" onClick=\"return mV('Num',4,5,6);\">Num 4:5-6</a>; <a href=\"#\" onClick=\"return mV('Num',10,'33-36');\">10:33-36</a>; <a href=\"#\" onClick=\"return mV('Psa',68,1);\">Psa 68:1</a>; <a href=\"#\" onClick=\"return mV('Psa',132,8);\">132:8</a>). It was borne by the priests into the bed of the Jordan, which separated, opening a pathway for the whole of the host to pass over (<a href=\"#\" onClick=\"return mV('Jos',3,15,16);\">Jos 3:15-16</a>; <a href=\"#\" onClick=\"return mV('Jos',4,7,10,11,17,18);\">4:7, 10-11, 17-18</a>). It was borne in the procession round Jericho (<a href=\"#\" onClick=\"return mV('Jos',6,46,8,11,12);\">Jos 6:4, 6, 8, 11-12</a>). When carried it was always wrapped in the veil, the badgers' skins, and blue cloth, and carefully concealed even from the eyes of the Levites who carried it. After the settlement of Israel in Palestine the ark remained in the tabernacle at Gilgal for a season, and was then removed to Shiloh till the time of Eli, between 300 and 400 years (<a href=\"#\" onClick=\"return mV('Jer',7,12);\">Jer 7:12</a>), when it was carried into the field of battle so as to secure, as they supposed, victory to the Hebrews, and was taken by the Philistines (<a href=\"#\" onClick=\"return mV('1Sa',4,'3-11');\">1Sa 4:3-11</a>), who sent it back after retaining it seven months (<a href=\"#\" onClick=\"return mV('1Sa',5,7,8);\">1Sa 5:7-8</a>). It remained then at Kirjath-jearim (<a href=\"#\" onClick=\"return mV('1Sa',7,1,2);\">7:1-2</a>) till the time of David (twenty years), who wished to remove it to Jerusalem; but the proper mode of removing it having been neglected, Uzzah was smitten with death for putting \"forth his hand to the ark of God,\" and in consequence of this it was left in the house of Obed-edom in Gath-rimmon for three months (<a href=\"#\" onClick=\"return mV('2Sa',6,'1-11');\">2Sa 6:1-11</a>), at the end of which time David removed it in a grand procession to Jerusalem, where it was kept till a place was prepared for it (<a href=\"#\" onClick=\"return mV('2Sa',6,'12-19');\">12-19</a>). It was afterwards deposited by Solomon in the temple (<a href=\"#\" onClick=\"return mV('1Ki',8,'6-9');\">1Ki 8:6-9</a>). When the Babylonians destroyed Jerusalem and plundered the temple, the ark was probably taken away by Nebuchadnezzar and destroyed, as no trace of it is afterwards to be found. The absence of the ark from the second temple was one of the points in which it was inferior to the first temple.";
eastonArray["$$T0000310"] = "<b>Arkite:</b> (<a href=\"#\" onClick=\"return mV('Gen',10,17);\">Gen 10:17</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,15);\">1Ch 1:15</a>), a designation of certain descendants from the Phoenicians or Sidonians, the inhabitants of Arka, 12 miles north of Tripoli, opposite the northern extremity of Lebanon.";
eastonArray["$$T0000311"] = "<b>Arm:</b> used to denote power (<a href=\"#\" onClick=\"return mV('Psa',10,15);\">Psa 10:15</a>; <a href=\"#\" onClick=\"return mV('Eze',30,21);\">Eze 30:21</a>; <a href=\"#\" onClick=\"return mV('Jer',48,25);\">Jer 48:25</a>). It is also used of the omnipotence of God (<a href=\"#\" onClick=\"return mV('Exd',15,16);\">Exd 15:16</a>; <a href=\"#\" onClick=\"return mV('Psa',89,13);\">Psa 89:13</a>; <a href=\"#\" onClick=\"return mV('Psa',98,1);\">98:1</a>; <a href=\"#\" onClick=\"return mV('Psa',77,15);\">77:15</a>; <a href=\"#\" onClick=\"return mV('Isa',53,1);\">Isa 53:1</a>; <a href=\"#\" onClick=\"return mV('Jhn',12,38);\">Jhn 12:38</a>; <a href=\"#\" onClick=\"return mV('Act',13,17);\">Act 13:17</a>)";
eastonArray["$$T0000312"] = "<b>Armageddon:</b> occurs only in <a href=\"#\" onClick=\"return mV('Rev',16,16);\">Rev 16:16</a> (R.V., \"Har-Magedon\"), as symbolically designating the place where the \"battle of that great day of God Almighty\" (<a href=\"#\" onClick=\"return mV('Rev',16,14);\">ver. 14</a>) shall be fought. The word properly means the \"mount of Megiddo.\" It is the scene of the final conflict between Christ and Antichrist. The idea of such a scene was suggested by the Old Testament great battle-field, the plain of Esdraelon (q.v.).";
eastonArray["$$T0000313"] = "<b>Armenia:</b> high land, occurs only in Authorized Version, <a href=\"#\" onClick=\"return mV('2Ki',19,37);\">2Ki 19:37</a>; in Revised Version, \"Ararat,\" which is the Hebrew word. A country in western Asia lying between the Caspian and the Black Sea. Here the ark of Noah rested after the Deluge (<a href=\"#\" onClick=\"return mV('Gen',8,4);\">Gen 8:4</a>). It is for the most part high table-land, and is watered by the Aras, the Kur, the Euphrates, and the Tigris. Ararat was properly the name of a part of ancient Armenia. Three provinces of Armenia are mentioned in <a href=\"#\" onClick=\"return mV('Jer',51,27);\">Jer 51:27</a>, Ararat, Minni, and Ashchenaz. Some, however, think Minni a contraction for Armenia. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000284');\">ARARAT</a>.)";
eastonArray["$$T0000314"] = "<b>Armoni:</b> inhabitant of a fortress, the first-named of the two sons of Saul and Rizpah. He was delivered up to the Gibeonites by David, and hanged by them (<a href=\"#\" onClick=\"return mV('2Sa',21,8,9);\">2Sa 21:8-9</a>).";
eastonArray["$$T0000315"] = "<b>Armour:</b> is employed in the English Bible to denote military equipment, both offensive and defensive.<br><br>(1.) The offensive weapons were different at different periods of history. The \"rod of iron\" (<a href=\"#\" onClick=\"return mV('Psa',2,9);\">Psa 2:9</a>) is supposed to mean a mace or crowbar, an instrument of great power when used by a strong arm. The \"maul\" (<a href=\"#\" onClick=\"return mV('Pro',25,18);\">Pro 25:18</a>;) cognate Hebrew word rendered \"battle-axe\" (in <a href=\"#\" onClick=\"return mV('Jer',51,20);\">Jer 51:20</a>), and \"slaughter weapon\" (in <a href=\"#\" onClick=\"return mV('Eze',9,2);\">Eze 9:2</a>) was a war-hammer or martel. The \"sword\" is the usual translation of <i>hereb</i>, which properly means \"poniard.\" The real sword, as well as the dirk-sword [which was always double-edged], was also used (<a href=\"#\" onClick=\"return mV('1Sa',17,39);\">1Sa 17:39</a>; <a href=\"#\" onClick=\"return mV('2Sa',20,8);\">2Sa 20:8</a>; <a href=\"#\" onClick=\"return mV('1Ki',20,11);\">1Ki 20:11</a>). The spear was another offensive weapon (<a href=\"#\" onClick=\"return mV('Jos',8,18);\">Jos 8:18</a>; <a href=\"#\" onClick=\"return mV('1Sa',17,7);\">1Sa 17:7</a>). The javelin was used by light troops (<a href=\"#\" onClick=\"return mV('Num',25,7,8);\">Num 25:7-8</a>; <a href=\"#\" onClick=\"return mV('1Sa',13,22);\">1Sa 13:22</a>). Saul threw a javelin at David (<a href=\"#\" onClick=\"return mV('1Sa',19,9,10);\">1Sa 19:9-10</a>), and so virtually absolved him from his allegiance. The bow was, however, the chief weapon of offence. The arrows were carried in a quiver, the bow being always unbent till the moment of action (<a href=\"#\" onClick=\"return mV('Gen',27,3);\">Gen 27:3</a>; <a href=\"#\" onClick=\"return mV('Gen',48,22);\">48:22</a>; <a href=\"#\" onClick=\"return mV('Psa',18,34);\">Psa 18:34</a>). The sling was a favourite weapon of the Benjamites (<a href=\"#\" onClick=\"return mV('1Sa',17,40);\">1Sa 17:40</a>; <a href=\"#\" onClick=\"return mV('1Ch',12,2);\">1Ch 12:2</a>. Comp. <a href=\"#\" onClick=\"return mV('1Sa',23,29);\">1Sa 25:29).<br><br>(2.) Of the defensive armour a chief place is assigned to the shield or buckler. There were the great shield or target (the <i>tzinnah</i>), for the protection of the whole person (<a href=\"#\" onClick=\"return mV('Gen',15,1);\">Gen 15:1</a>; <a href=\"#\" onClick=\"return mV('Psa',47,9);\">Psa 47:9</a>; <a href=\"#\" onClick=\"return mV('1Sa',17,7);\">1Sa 17:7</a>; <a href=\"#\" onClick=\"return mV('Pro',30,5);\">Pro 30:5</a>), and the buckler (Heb. <i>mageen</i>) or small shield (<a href=\"#\" onClick=\"return mV('1Ki',10,17);\">1Ki 10:17</a>; <a href=\"#\" onClick=\"return mV('Eze',26,8);\">Eze 26:8</a>). In <a href=\"#\" onClick=\"return mV('Psa',91,4);\">Psa 91:4</a> \"buckler\" is properly a roundel appropriated to archers or slingers. The helmet (<a href=\"#\" onClick=\"return mV('Eze',27,10);\">Eze 27:10</a>; <a href=\"#\" onClick=\"return mV('1Sa',17,38);\">1Sa 17:38</a>), a covering for the head; the coat of mail or corselet (<a href=\"#\" onClick=\"return mV('1Sa',17,5);\">1Sa 17:5</a>), or habergeon (<a href=\"#\" onClick=\"return mV('Neh',4,16)\">Neh 4:16</a>), harness or breat-plate (<a href=\"#\" onClick=\"return mV('Rev',9,9);\">Rev 9:9</a>), for the covering of the back and breast and both upper arms (<a href=\"#\" onClick=\"return mV('Isa',59,17);\">Isa 59:17</a>; <a href=\"#\" onClick=\"return mV('Eph',6,14);\">Eph 6:14</a>). The cuirass and corselet, composed of leather or quilted cloth, were also for the covering of the body. Greaves, for the covering of the legs, were worn in the time of David (<a href=\"#\" onClick=\"return mV('1Sa',17,6);\">1Sa 17:6</a>). Reference is made by Paul (<a href=\"#\" onClick=\"return mV('Eph',6,'14-17');\">Eph 6:14-17</a>) to the panoply of a Roman soldier. The shield here is the thureon, a door-like oblong shield above all, i.e., covering the whole person, not the small round shield. There is no armour for the back, but only for the front.";
eastonArray["$$T0000316"] = "<b>Armour-bearer:</b> an officer selected by kings and generals because of his bravery, not only to bear their armour, but also to stand by them in the time of danger. They were the adjutants of our modern armies (<a href=\"#\" onClick=\"return mV('Jdg',9,54);\">Jdg 9:54</a>; <a href=\"#\" onClick=\"return mV('1Sa',14,7);\">1Sa 14:7</a>; <a href=\"#\" onClick=\"return mV('1Sa',16,21);\">16:21</a>; <a href=\"#\" onClick=\"return mV('1Sa',31,6);\">31:6</a>).";
eastonArray["$$T0000317"] = "<b>Armoury:</b> the place in which armour was deposited when not used (<a href=\"#\" onClick=\"return mV('Neh',3,19);\">Neh 3:19</a>; <a href=\"#\" onClick=\"return mV('Jer',50,25);\">Jer 50:25</a>). At first each man of the Hebrews had his own arms, because all went to war. There were no arsenals or magazines for arms till the time of David, who had a large collection of arms, which he consecrated to the Lord in his tabernacle (<a href=\"#\" onClick=\"return mV('Jer',21,9);\">21:9</a>; <a href=\"#\" onClick=\"return mV('2Sa',8,'7-12');\">2Sa 8:7-12</a>; <a href=\"#\" onClick=\"return mV('1Ch',26,26,27);\">1Ch 26:26-27</a>).";
eastonArray["$$T0000318"] = "<b>Army:</b> The Israelites marched out of Egypt in military order (<a href=\"#\" onClick=\"return mV('Exd',13,18);\">Exd 13:18</a>, \"harnessed; \" marg., \"five in a rank\"). Each tribe formed a battalion, with its own banner and leader (<a href=\"#\" onClick=\"return mV('Num',2,2);\">Num 2:2</a>; <a href=\"#\" onClick=\"return mV('Num',10,14);\">10:14</a>). In war the army was divided into thousands and hundreds under their several captains (<a href=\"#\" onClick=\"return mV('Num',31,14);\">Num 31:14</a>), and also into families (<a href=\"#\" onClick=\"return mV('Num',2,34);\">Num 2:34</a>; <a href=\"#\" onClick=\"return mV('2Ch',25,5);\">2Ch 25:5</a>; <a href=\"#\" onClick=\"return mV('2Ch',26,12);\">26:12</a>). From the time of their entering the land of Canaan to the time of the kings, the Israelites made little progress in military affairs, although often engaged in warfare. The kings introduced the custom of maintaining a bodyguard (the Gibborim; i.e., \"heroes\"), and thus the nucleus of a standing army was formed. Saul had an army of 3,000 select warriors (<a href=\"#\" onClick=\"return mV('1Sa',13,2);\">1Sa 13:2</a>; <a href=\"#\" onClick=\"return mV('1Sa',14,52);\">14:52</a>; <a href=\"#\" onClick=\"return mV('1Sa',24,2);\">24:2</a>). David also had a band of soldiers around him (<a href=\"#\" onClick=\"return mV('1Sa',23,13);\">1Sa 23:13</a>; <a href=\"#\" onClick=\"return mV('1Sa',25,13);\">25:13</a>). To this band he afterwards added the Cherethites and the Pelethites (<a href=\"#\" onClick=\"return mV('2Sa',15,18);\">2Sa 15:18</a>; <a href=\"#\" onClick=\"return mV('2Sa',20,7);\">20:7</a>). At first the army consisted only of infantry (<a href=\"#\" onClick=\"return mV('1Sa',4,10);\">1Sa 4:10</a>; <a href=\"#\" onClick=\"return mV('1Sa',15,4);\">15:4</a>), as the use of horses was prohibited (<a href=\"#\" onClick=\"return mV('Deu',17,16);\">Deu 17:16</a>); but chariots and horses were afterwards added (<a href=\"#\" onClick=\"return mV('2Sa',8,4);\">2Sa 8:4</a>; <a href=\"#\" onClick=\"return mV('1Ki',10,26,28,29);\">1Ki 10:26, 28-29</a>; <a href=\"#\" onClick=\"return mV('1Ki',9,19);\">1Ki 9:19</a>). In <a href=\"#\" onClick=\"return mV('1Ki',9,22);\">1Ki 9:22</a> there is given a list of the various gradations of rank held by those who composed the army. The equipment and maintenance of the army were at the public expense (<a href=\"#\" onClick=\"return mV('2Sa',17,28,29);\">2Sa 17:28-29</a>; <a href=\"#\" onClick=\"return mV('1Ki',4,27);\">1Ki 4:27</a>; <a href=\"#\" onClick=\"return mV('1Ki',10,16,17);\">10:16-17</a>; <a href=\"#\" onClick=\"return mV('Jdg',20,10);\">Jdg 20:10</a>). At the Exodus the number of males above twenty years capable of bearing arms was 600,000 (<a href=\"#\" onClick=\"return mV('Exd',12,37);\">Exd 12:37</a>). In David's time it mounted to the number of 1,300,000 (<a href=\"#\" onClick=\"return mV('2Sa',24,9);\">2Sa 24:9</a>).";
eastonArray["$$T0000319"] = "<b>Arnon:</b> swift, the southern boundary of the territory of Israel beyond Jordan, separating it from the land of Moab (<a href=\"#\" onClick=\"return mV('Deu',3,8,16);\">Deu 3:8, 16</a>). This river (referred to twenty-four times in the Bible) rises in the mountains of Gilead, and after a circuitous course of about 80 miles through a deep ravine it falls into the Dead Sea nearly opposite Engedi. The stream is almost dry in summer. It is now called el-Mujeb. The territory of the Amorites extended from the Arnon to the Jabbok.";
eastonArray["$$T0000320"] = "<b>Aroer:</b> ruins.<br><br>(1.) A town on the north bank of the Arnon (<a href=\"#\" onClick=\"return mV('Deu',4,48);\">Deu 4:48</a>; <a href=\"#\" onClick=\"return mV('Jdg',11,26);\">Jdg 11:26</a>; <a href=\"#\" onClick=\"return mV('2Ki',10,33);\">2Ki 10:33</a>), the southern boundary of the kingdom of Sihon (<a href=\"#\" onClick=\"return mV('Jos',12,2);\">Jos 12:2</a>). It is now called Arair, 13 miles west of the Dead Sea.<br><br>(2.) One of the towns built by the tribe of Gad (<a href=\"#\" onClick=\"return mV('Num',32,34);\">Num 32:34</a>) \"before Rabbah\" (<a href=\"#\" onClick=\"return mV('Jos',13,25);\">Jos 13:25</a>), the Ammonite capital. It was famous in the history of Jephthah (<a href=\"#\" onClick=\"return mV('Jdg',11,33);\">Jdg 11:33</a>) and of David (<a href=\"#\" onClick=\"return mV('2Sa',24,5);\">2Sa 24:5</a>). (<a href=\"#\" onClick=\"return mV('Isa',17,2);\">Isa 17:2</a>; <a href=\"#\" onClick=\"return mV('2Ki',15,29);\">2Ki 15:29</a>.)<br><br>(3.) A city in the south of Judah, 12 miles south-east of Beersheba, to which David sent presents after recovering the spoil from the Amalekites at Ziklag (<a href=\"#\" onClick=\"return mV('1Sa',30,26,28);\">1Sa 30:26, 28</a>). It was the native city of two of David's warriors (<a href=\"#\" onClick=\"return mV('1Ch',11,44);\">1Ch 11:44</a>). It is now called Ar'arah.";
eastonArray["$$T0000321"] = "<b>Arpad:</b> (<a href=\"#\" onClick=\"return mV('Isa',10,9);\">Isa 10:9</a>; <a href=\"#\" onClick=\"return mV('Isa',36,19);\">36:19</a>; <a href=\"#\" onClick=\"return mV('Isa',37,13);\">37:13</a>), also Arphad, support, a Syrian city near Hamath, along with which it is invariably mentioned (<a href=\"#\" onClick=\"return mV('2Ki',19,13);\">2Ki 19:13</a>; <a href=\"#\" onClick=\"return mV('2Ki',18,34);\">18:34</a>; <a href=\"#\" onClick=\"return mV('Isa',10,9);\">Isa 10:9</a>), and Damascus (<a href=\"#\" onClick=\"return mV('Jer',49,23);\">Jer 49:23</a>). After a siege of three years it fell (B.C. 742) before the Assyrian king Tiglath-pileser II. Now Tell Erfud.";
eastonArray["$$T0000322"] = "<b>Arphaxad:</b> son of Shem, born the year after the Deluge. He died at the age of 438 years (<a href=\"#\" onClick=\"return mV('Gen',11,'10-13');\">Gen 11:10-13</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,17,18);\">1Ch 1:17-18</a>; <a href=\"#\" onClick=\"return mV('Luk',3,36);\">Luk 3:36</a>). He dwelt in Mesopotamia, and became, according to the Jewish historian Josephus, the progenitor of the Chaldeans. The tendency is to recognize in the word the name of the country nearest the ancient domain of the Chaldeans. Some regard the word as an Egypticized form of the territorial name of Ur Kasdim, or Ur of the Chaldees.";
eastonArray["$$T0000323"] = "<b>Arrows:</b> At first made of reeds, and then of wood tipped with iron. Arrows are sometimes figuratively put for lightning (<a href=\"#\" onClick=\"return mV('Deu',32,23,42);\">Deu 32:23, 42</a>; <a href=\"#\" onClick=\"return mV('Psa',7,13);\">Psa 7:13</a>; <a href=\"#\" onClick=\"return mV('Psa',18,14);\">18:14</a>; <a href=\"#\" onClick=\"return mV('Psa',144,6);\">144:6</a>; <a href=\"#\" onClick=\"return mV('Zec',9,14);\">Zec 9:14</a>). They were used in war as well as in the chase (<a href=\"#\" onClick=\"return mV('Gen',27,3);\">Gen 27:3</a>; <a href=\"#\" onClick=\"return mV('Gen',49,23);\">49:23</a>). They were also used in divination (<a href=\"#\" onClick=\"return mV('Eze',21,21);\">Eze 21:21</a>).<br><br>The word is frequently employed as a symbol of calamity or disease inflicted by God (<a href=\"#\" onClick=\"return mV('Job',6,4);\">Job 6:4</a>; <a href=\"#\" onClick=\"return mV('Job',34,6);\">34:6</a>; <a href=\"#\" onClick=\"return mV('Psa',38,2);\">Psa 38:2</a>; <a href=\"#\" onClick=\"return mV('Deu',32,23);\">Deu 32:23</a>. Comp. <a href=\"#\" onClick=\"return mV('Eze',5,16);\">Eze 5:16</a>), or of some sudden danger (<a href=\"#\" onClick=\"return mV('Psa',91,5);\">Psa 91:5</a>), or bitter words (<a href=\"#\" onClick=\"return mV('Psa',64,3);\">Psa 64:3</a>), or false testimony (<a href=\"#\" onClick=\"return mV('Pro',25,18);\">Pro 25:18</a>).";
eastonArray["$$T0000324"] = "<b>Artaxerxes:</b> the Greek form of the name of several Persian kings.<br><br>(1.) The king who obstructed the rebuilding of the temple (<a href=\"#\" onClick=\"return mV('Ezr',4,7);\">Ezr 4:7</a>). He was probably the Smerdis of profane history.<br><br>(2.) The king mentioned in <a href=\"#\" onClick=\"return mV('Ezr',7,1);\">Ezr 7:1</a>, in the seventh year (B.C. 458) of whose reign Ezra led a second colony of Jews back to Jerusalem, was probably Longimanus, who reigned for forty years (B.C. 464-425); the grandson of Darius, who, fourteen years later, permitted Nehemiah to return and rebuild Jerusalem.";
eastonArray["$$T0000325"] = "<b>Artificer:</b> a person engaged in any kind of manual occupation (<a href=\"#\" onClick=\"return mV('Gen',4,22);\">Gen 4:22</a>; <a href=\"#\" onClick=\"return mV('Isa',3,3);\">Isa 3:3</a>).";
eastonArray["$$T0000326"] = "<b>Artillery:</b> <a href=\"#\" onClick=\"return mV('1Sa',20,40);\">1Sa 20:40</a>, (Heb. keli, meaning \"apparatus; \" here meaning collectively any missile weapons, as arrows and lances. In Revised Version, \"weapons\"). This word is derived from the Latin artillaria = equipment of war.";
eastonArray["$$T0000327"] = "<b>Arvad:</b> wandering, (<a href=\"#\" onClick=\"return mV('Eze',27,8);\">Eze 27:8</a>), a small island and city on the coast of Syria, mentioned as furnishing mariners and soldiers for Tyre. The inhabitants were called Arvadites. The name is written Aruada or Arada in the Tell-el-Amarna tablets.";
eastonArray["$$T0000328"] = "<b>Asa:</b> physician, son of Abijah and grandson of Rehoboam, was the third king of Judah. He was zealous in maintaining the true worship of God, and in rooting all idolatry, with its accompanying immoralities, out of the land (<a href=\"#\" onClick=\"return mV('1Ki',15,'8-14');\">1Ki 15:8-14</a>). The Lord gave him and his land rest and prosperity. It is recorded of him, however, that in his old age, when afflicted, he \"sought not to the Lord, but to the physicians\" (<a href=\"#\" onClick=\"return mV('Jer',17,5);\">Jer 17:5</a>). He died in the forty-first year of his reign, greatly honoured by his people (<a href=\"#\" onClick=\"return mV('2Ch',16,'1-13');\">2Ch 16:1-13</a>), and was succeeded by his son Jehoshaphat.";
eastonArray["$$T0000329"] = "<b>Asahel:</b> made by God, the youngest son of Zeruiah, David's sister. He was celebrated for his swiftness of foot. When fighting against Ish-bosheth at Gibeon, in the army of his brother Joab, he was put to death by Abner, whom he pursued from the field of battle (<a href=\"#\" onClick=\"return mV('2Sa',2,18,19);\">2Sa 2:18-19</a>). He is mentioned among David's thirty mighty men (<a href=\"#\" onClick=\"return mV('2Sa',23,24);\">2Sa 23:24</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,26);\">1Ch 11:26</a>). Others of the same name are mentioned (<a href=\"#\" onClick=\"return mV('2Ch',17,8);\">2Ch 17:8</a>; <a href=\"#\" onClick=\"return mV('2Ch',31,13);\">31:13</a>; <a href=\"#\" onClick=\"return mV('Ezr',10,15);\">Ezr 10:15</a>).";
eastonArray["$$T0000330"] = "<b>Asaph:</b> convener, or collector.<br><br>(1.) A Levite; one of the leaders of David's choir (<a href=\"#\" onClick=\"return mV('1Ch',6,39);\">1Ch 6:39</a>). <a href=\"#\" onClick=\"return mV('Psa',50,'1-');\">Psalms 50</a> and <a href=\"#\" onClick=\"return mV('Psa',73,'1-');\">73-83</a> inclusive are attributed to him. He is mentioned along with David as skilled in music, and a \"seer\" (<a href=\"#\" onClick=\"return mV('2Ch',29,30);\">2Ch 29:30</a>). The \"sons of Asaph,\" mentioned in <a href=\"#\" onClick=\"return mV('1Ch',25,1);\">1Ch 25:1</a>; <a href=\"#\" onClick=\"return mV('2Ch',20,14);\">2Ch 20:14</a>, and <a href=\"#\" onClick=\"return mV('Ezr',2,41);\">Ezr 2:41</a>, were his descendants, or more probably a class of poets or singers who recognized him as their master.<br><br>(2.) The \"recorder\" in the time of Hezekiah (<a href=\"#\" onClick=\"return mV('2Ki',18,18,37);\">2Ki 18:18, 37</a>).<br><br>(3.) The \"keeper of the king's forest,\" to whom Nehemiah requested from Artaxerxes a \"letter\" that he might give him timber for the temple at Jerusalem (<a href=\"#\" onClick=\"return mV('Neh',2,8);\">Neh 2:8</a>).";
eastonArray["$$T0000331"] = "<b>Ascension:</b> See <a href=\"#\" onClick=\"return doDictLookup('ET0000818');\">CHRIST</a>.";
eastonArray["$$T0000332"] = "<b>Asenath:</b> an Egyptian name, meaning \"gift of the sun-god\", daughter of Potipherah, priest of On or Heliopolis, wife of Joseph (<a href=\"#\" onClick=\"return mV('Gen',41,45);\">Gen 41:45</a>). She was the mother of Manasseh and Ephraim (<a href=\"#\" onClick=\"return mV('Gen',41,'50-52');\">50-52</a>; <a href=\"#\" onClick=\"return mV('Gen',46,20);\">46:20</a>).";
eastonArray["$$T0000333"] = "<b>Ash:</b> (Heb. o'ren, \"tremulous\"), mentioned only <a href=\"#\" onClick=\"return mV('Isa',44,14);\">Isa 44:14</a> (R.V., \"fir tree\"). It is rendered \"pine tree\" both in the LXX. and Vulgate versions. There is a tree called by the Arabs <i>aran</i>, found still in the valleys of Arabia Petraea, whose leaf resembles that of the mountain ash. This may be the tree meant. Our ash tree is not known in Syria.";
eastonArray["$$T0000334"] = "<b>Ashdod:</b> stronghold, a Philistine city (<a href=\"#\" onClick=\"return mV('Jos',15,47);\">Jos 15:47</a>), about midway between Gaza and Joppa, and 3 miles from the Mediterranean. It was one of the chief seats of the worship of Dagon (<a href=\"#\" onClick=\"return mV('1Sa',5,5);\">1Sa 5:5</a>). It belonged to the tribe of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,47);\">Jos 15:47</a>), but it never came into their actual possession. It was an important city, as it stood on the highroad from Egypt to Palestine, and hence was strongly fortified (<a href=\"#\" onClick=\"return mV('2Ch',26,6);\">2Ch 26:6</a>; <a href=\"#\" onClick=\"return mV('Isa',20,1);\">Isa 20:1</a>). Uzziah took it, but fifty years after his death it was taken by the Assyrians (B.C. 758). According to Sargon's record, it was captured by him in B.C. 711. The only reference to it in the New Testament, where it is called Azotus, is in the account of Philip's return from Gaza (<a href=\"#\" onClick=\"return mV('Act',8,40);\">Act 8:40</a>). It is now called Eshdud.";
eastonArray["$$T0000335"] = "<b>Ashdoth-pisgah:</b> (<a href=\"#\" onClick=\"return mV('Deu',3,17);\">Deu 3:17</a>; <a href=\"#\" onClick=\"return mV('Jos',12,3);\">Jos 12:3</a>; <a href=\"#\" onClick=\"return mV('Jos',13,20);\">13:20</a>) in Authorized Version, but in Revised Version translated \"slopes of Pisgah.\" In <a href=\"#\" onClick=\"return mV('Deu',4,49);\">Deu 4:49</a> it is translated in the Authorized Version \"springs of Pisgah.\" The name Ashdoth is translated \"springs\" in the Authorized Version, but \"slopes\" in the Revised Version, of <a href=\"#\" onClick=\"return mV('Jos',10,40);\">Jos 10:40</a> and <a href=\"#\" onClick=\"return mV('Jos',12,8);\">Jos 12:8</a>. It has been identified with the springs under Mount Nebo, now called 'Ayun Musa.";
eastonArray["$$T0000336"] = "<b>Asher:</b> happy, Jacob's eigth son; his mother was Zilpah, Leah's handmaid (<a href=\"#\" onClick=\"return mV('Gen',30,13);\">Gen 30:13</a>). Of the tribe founded by him nothing is recorded beyond its holding a place in the list of the tribes (<a href=\"#\" onClick=\"return mV('Gen',35,26);\">35:26</a>; <a href=\"#\" onClick=\"return mV('Gen',46,17);\">46:17</a>; <a href=\"#\" onClick=\"return mV('Exd',1,4);\">Exd 1:4</a>, etc.) It increased in numbers twenty-nine percent, during the thirty-eight years' wanderings. The place of this tribe during the march through the desert was between Dan and Naphtali (<a href=\"#\" onClick=\"return mV('Num',2,27);\">Num 2:27</a>). The boundaries of the inheritance given to it, which contained some of the richest soil in Palestine, and the names of its towns, are recorded in <a href=\"#\" onClick=\"return mV('Jos',19,'24-31');\">Jos 19:24-31</a>; <a href=\"#\" onClick=\"return mV('Jdg',1,31,32);\">Jdg 1:31-32</a>. Asher and Simeon were the only tribes west of the Jordan which furnished no hero or judge for the nation. Anna the prophetess was of this tribe (<a href=\"#\" onClick=\"return mV('Luk',2,36);\">Luk 2:36</a>).";
eastonArray["$$T0000337"] = "<b>Asherah:</b> and pl. Asherim in Revised Version, instead of \"grove\" and \"groves\" of the Authorized Version. This was the name of a sensual Canaanitish goddess Astarte, the feminine of the Assyrian Ishtar. Its symbol was the stem of a tree deprived of its boughs, and rudely shaped into an image, and planted in the ground. Such religious symbols (\"groves\") are frequently alluded to in Scripture (<a href=\"#\" onClick=\"return mV('Exd',34,13);\">Exd 34:13</a>; <a href=\"#\" onClick=\"return mV('Jdg',6,25);\">Jdg 6:25</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,6);\">2Ki 23:6</a>; <a href=\"#\" onClick=\"return mV('1Ki',16,33);\">1Ki 16:33</a>, etc.). These images were also sometimes made of silver or of carved stone (<a href=\"#\" onClick=\"return mV('2Ki',21,7);\">2Ki 21:7</a>; \"the graven image of Asherah,\" R.V.). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001556');\">GROVE [1].</a>).";
eastonArray["$$T0000338"] = "<b>Ashes:</b> The ashes of a red heifer burned entire (<a href=\"#\" onClick=\"return mV('Num',19,5);\">Num 19:5</a>) when sprinkled on the unclean made them ceremonially clean (<a href=\"#\" onClick=\"return mV('Hbr',9,13);\">Hbr 9:13</a>).<br><br>To cover the head with ashes was a token of self-abhorrence and humiliation (<a href=\"#\" onClick=\"return mV('2Sa',13,19);\">2Sa 13:19</a>; <a href=\"#\" onClick=\"return mV('Est',4,3);\">Est 4:3</a>; <a href=\"#\" onClick=\"return mV('Jer',6,26);\">Jer 6:26</a>, etc.).<br><br>To feed on ashes (<a href=\"#\" onClick=\"return mV('Isa',44,20);\">Isa 44:20</a>), means to seek that which will prove to be vain and unsatisfactory, and hence it denotes the unsatisfactory nature of idol-worship. (<a href=\"#\" onClick=\"return mV('Hsa',12,1);\">Hsa 12:1</a>).";
eastonArray["$$T0000339"] = "<b>Ashkelon:</b> =Askelon=Ascalon, was one of the five cities of the Philistines (<a href=\"#\" onClick=\"return mV('Jos',13,3);\">Jos 13:3</a>; <a href=\"#\" onClick=\"return mV('1Sa',6,17);\">1Sa 6:17</a>). It stood on the shore of the Mediterranean, 12 miles north of Gaza. It is mentioned on an inscription at Karnak in Egypt as having been taken by king Rameses II., the oppressor of the Hebrews. In the time of the judges (<a href=\"#\" onClick=\"return mV('Jdg',1,18);\">Jdg 1:18</a>) it fell into the possession of the tribe of Judah; but it was soon after retaken by the Philistines (<a href=\"#\" onClick=\"return mV('2Sa',1,20);\">2Sa 1:20</a>), who were not finally dispossessed till the time of Alexander the Great. Samson went down to this place from Timnath, and slew thirty men and took their spoil. The prophets foretold its destruction (<a href=\"#\" onClick=\"return mV('Jer',25,20);\">Jer 25:20</a>; <a href=\"#\" onClick=\"return mV('Jer',47,5,7);\">47:5, 7</a>). It became a noted place in the Middle Ages, having been the scene of many a bloody battle between the Saracens and the Crusaders. It was beseiged and taken by Richard the Lion-hearted, and \"within its walls and towers now standing he held his court.\" Among the Tell Amarna tablets (see <a href=\"#\" onClick=\"return doDictLookup('ET0001137');\">EGYPT</a>) are found letters or official despatches from Yadaya, \"captain of horse and dust of the king's feet,\" to the \"great king\" of Egypt, dated from Ascalon. It is now called 'Askalan.";
eastonArray["$$T0000340"] = "<b>Ashkenaz:</b> one of the three sons of Gomer (<a href=\"#\" onClick=\"return mV('Gen',10,3);\">Gen 10:3</a>), and founder of one of the tribes of the Japhetic race. They are mentioned in connection with Minni and Ararat, and hence their original seat must have been in Armenia (<a href=\"#\" onClick=\"return mV('Jer',51,27);\">Jer 51:27</a>), probably near the Black Sea, which, from their founder, was first called Axenus, and afterwards the Euxine.";
eastonArray["$$T0000341"] = "<b>Ashpenaz:</b> the master of the eunuchs of Nebuchadnezzar (<a href=\"#\" onClick=\"return mV('Dan',1,3);\">Dan 1:3</a>), the \"Rabsaris\" of the court. His position was similar to that of the Kislar-aga of the modern Turkish sultans.";
eastonArray["$$T0000342"] = "<b>Ashtaroth:</b> a city of Bashan, in the kingdom of Og (<a href=\"#\" onClick=\"return mV('Deu',1,4);\">Deu 1:4</a>; <a href=\"#\" onClick=\"return mV('Jos',12,4);\">Jos 12:4</a>; <a href=\"#\" onClick=\"return mV('Jos',13,12);\">13:12</a>; <a href=\"#\" onClick=\"return mV('Jos',9,10);\">9:10</a>). It was in the half-tribe of Manasseh (<a href=\"#\" onClick=\"return mV('Jos',13,12);\">Jos 13:12</a>), and as a Levitical city was given to the Gershonites (<a href=\"#\" onClick=\"return mV('1Ch',6,71);\">1Ch 6:71</a>). Uzzia, one of David's valiant men (<a href=\"#\" onClick=\"return mV('1Ch',11,44);\">1Ch 11:44</a>), is named as of this city. It is identified with Tell Ashterah, in the Hauran, and is noticed on monuments B.C. 1700-1500. The name Beesh-terah (<a href=\"#\" onClick=\"return mV('Jos',21,27);\">Jos 21:27</a>) is a contraction for Beth-eshterah, i.e., \"the house of Ashtaroth.\"";
eastonArray["$$T0000343"] = "<b>Ashteroth Karnaim:</b> Ashteroth of the two horns, the abode of the Rephaim (<a href=\"#\" onClick=\"return mV('Gen',14,5);\">Gen 14:5</a>). It may be identified with Ashtaroth preceding; called \"Karnaim\", i.e., the \"two-horned\" (the crescent moon). The Samaritan version renders the word by \"Sunamein,\" the present es-Sunamein, 28 miles south of Damascus.";
eastonArray["$$T0000344"] = "<b>Ashtoreth:</b> the moon goddess of the Phoenicians, representing the passive principle in nature, their principal female deity; frequently associated with the name of Baal, the sun-god, their chief male deity (<a href=\"#\" onClick=\"return mV('Jdg',10,6);\">Jdg 10:6</a>; <a href=\"#\" onClick=\"return mV('1Sa',7,4);\">1Sa 7:4</a>; <a href=\"#\" onClick=\"return mV('1Sa',12,10);\">12:10</a>). These names often occur in the plural (Ashtaroth, Baalim), probably as indicating either different statues or different modifications of the deities. This deity is spoken of as Ashtoreth of the Zidonians. She was the Ishtar of the Accadians and the Astarte of the Greeks (<a href=\"#\" onClick=\"return mV('Jer',44,17);\">Jer 44:17</a>; <a href=\"#\" onClick=\"return mV('1Ki',11,5,33);\">1Ki 11:5, 33</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,13);\">2Ki 23:13</a>). There was a temple of this goddess among the Philistines in the time of Saul (<a href=\"#\" onClick=\"return mV('1Sa',31,10);\">1Sa 31:10</a>). Under the name of Ishtar, she was one of the great deities of the Assyrians. The Phoenicians called her Astarte. Solomon introduced the worship of this idol (<a href=\"#\" onClick=\"return mV('1Ki',11,33);\">1Ki 11:33</a>). Jezebel's 400 priests were probably employed in its service (<a href=\"#\" onClick=\"return mV('1Ki',18,19);\">1Ki 18:19</a>). It was called the \"queen of heaven\" (<a href=\"#\" onClick=\"return mV('Jer',44,25);\">Jer 44:25</a>).";
eastonArray["$$T0000345"] = "<b>Ashurites:</b> mentioned among those over whom Ish-bosheth was made king (<a href=\"#\" onClick=\"return mV('2Sa',2,9);\">2Sa 2:9</a>).";
eastonArray["$$T0000346"] = "<b>Asia:</b> is used to denote Proconsular Asia, a Roman province which embraced the western parts of Asia Minor, and of which Ephesus was the capital, in <a href=\"#\" onClick=\"return mV('Act',2,9);\">Act 2:9</a>; <a href=\"#\" onClick=\"return mV('Act',6,9);\">6:9</a>; <a href=\"#\" onClick=\"return mV('Act',16,6);\">16:6</a>; <a href=\"#\" onClick=\"return mV('Act',19,10,22);\">19:10, 22</a>; <a href=\"#\" onClick=\"return mV('Act',20,4,16,18);\">20:4, 16, 18</a>, etc., and probably Asia Minor in <a href=\"#\" onClick=\"return mV('Act',19,26,27);\">Act 19:26-27</a>; <a href=\"#\" onClick=\"return mV('Act',21,27);\">21:27</a>; <a href=\"#\" onClick=\"return mV('Act',24,18);\">24:18</a>; <a href=\"#\" onClick=\"return mV('Act',27,2);\">27:2</a>. Proconsular Asia contained the seven churches of the Apocalypse (<a href=\"#\" onClick=\"return mV('Rev',1,11);\">Rev 1:11</a>). The \"chiefs of Asia\" (<a href=\"#\" onClick=\"return mV('Act',19,31);\">Act 19:31</a>) were certain wealthy citizens who were annually elected to preside over the games and religious festivals of the several cities to which they belonged. Some of these \"Asiarchs\" were Paul's friends.";
eastonArray["$$T0000347"] = "<b>Asnapper:</b> probably the same as Assur-bani-pal (Sardanapalos of the Greeks), styled the \"great and noble\" (<a href=\"#\" onClick=\"return mV('Ezr',4,10);\">Ezr 4:10</a>), was the son and successor (B.C. 668) of Esar-haddon (q.v.). He was \"luxurious, ambitious, and cruel, but a magnificent patron of literature.\" He formed at Nineveh a library of clay tablets, numbering about 10,000. These are now mostly in the British Museum. They throw much light on the history and antiquities of Assyria.<br><br>Assur-bani-pal was a munificent patron of literature, and the conqueror of Elam. Towards the middle of his reign his empire was shaken by a great rebellion headed by his brother in Babylon. The rebellion was finally put down, but Egypt was lost, and the military power of Assyria was so exhausted that it could with difficulty resist the hordes of Kimmerians who poured over Western Asia. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002735');\">NINEVEH</a>.)";
eastonArray["$$T0000348"] = "<b>Asp:</b> (Heb. pethen), <a href=\"#\" onClick=\"return mV('Deu',32,33);\">Deu 32:33</a>; <a href=\"#\" onClick=\"return mV('Job',20,14,16);\">Job 20:14, 16</a>; <a href=\"#\" onClick=\"return mV('Isa',11,8);\">Isa 11:8</a>. It was probably the Egyptian cobra (Naja haje), which was very poisonous (<a href=\"#\" onClick=\"return mV('Rom',3,13);\">Rom 3:13</a>; Gr. aspis). The Egyptians worshipped it as the <i>uraeus</i>, and it was found in the desert and in the fields. The peace and security of Messiah's reign is represented by the figure of a child playing on the hole of the asp. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000085');\">ADDER</a>.)";
eastonArray["$$T0000349"] = "<b>Ass:</b> frequently mentioned throughout Scripture. Of the domesticated species we read of,<br><br>(1.) The she ass (Heb. 'athon), so named from its slowness (<a href=\"#\" onClick=\"return mV('Gen',12,16);\">Gen 12:16</a>; <a href=\"#\" onClick=\"return mV('Gen',45,23);\">45:23</a>; <a href=\"#\" onClick=\"return mV('Num',22,23);\">Num 22:23</a>; <a href=\"#\" onClick=\"return mV('1Sa',9,3);\">1Sa 9:3</a>).<br><br>(2.) The male ass (Heb. hamor), the common working ass of Western Asia, so called from its red colour. Issachar is compared to a strong ass (<a href=\"#\" onClick=\"return mV('Gen',49,14);\">Gen 49:14</a>). It was forbidden to yoke together an ass and an ox in the plough (<a href=\"#\" onClick=\"return mV('Deu',22,10);\">Deu 22:10</a>).<br><br>(3.) The ass's colt (Heb. 'air), mentioned <a href=\"#\" onClick=\"return mV('Jdg',10,4);\">Jdg 10:4</a>; <a href=\"#\" onClick=\"return mV('Jdg',12,14);\">12:14</a>. It is rendered \"foal\" in <a href=\"#\" onClick=\"return mV('Gen',32,15);\">Gen 32:15</a>; <a href=\"#\" onClick=\"return mV('Gen',49,11);\">49:11</a>. (<a href=\"#\" onClick=\"return mV('Job',11,12);\">Job 11:12</a>; <a href=\"#\" onClick=\"return mV('Isa',30,6);\">Isa 30:6</a>.) The ass is an unclean animal, because it does not chew the cud (<a href=\"#\" onClick=\"return mV('Lev',11,26);\">Lev 11:26</a>. Comp. <a href=\"#\" onClick=\"return mV('2Ki',6,25);\">2Ki  6:25</a>). Asses constituted a considerable portion of wealth in ancient times (<a href=\"#\" onClick=\"return mV('Gen',12,16);\">Gen 12:16</a>; <a href=\"#\" onClick=\"return mV('Gen',30,43);\">30:43</a>; <a href=\"#\" onClick=\"return mV('1Ch',27,30);\">1Ch 27:30</a>; <a href=\"#\" onClick=\"return mV('Job',1,3);\">Job 1:3</a>; <a href=\"#\" onClick=\"return mV('Job',42,12);\">42:12</a>). They were noted for their spirit and their attachment to their master (<a href=\"#\" onClick=\"return mV('Isa',1,3);\">Isa 1:3</a>). They are frequently spoken of as having been ridden upon, as by Abraham (<a href=\"#\" onClick=\"return mV('Gen',22,3);\">Gen 22:3</a>), Balaam (<a href=\"#\" onClick=\"return mV('Num',22,21);\">Num 22:21</a>), the disobedient prophet (<a href=\"#\" onClick=\"return mV('1Ki',13,23);\">1Ki 13:23</a>), the family of Abdon the judge, seventy in number (<a href=\"#\" onClick=\"return mV('Jdg',12,14);\">Jdg 12:14</a>), Zipporah (<a href=\"#\" onClick=\"return mV('Exd',4,20);\">Exd 4:20</a>), the Shunammite (<a href=\"#\" onClick=\"return mV('1Sa',25,30);\">1Sa 25:30</a>), etc. Zechariah (<a href=\"#\" onClick=\"return mV('Zec',9,9);\">Zec 9:9</a>) predicted our Lord's triumphal entrance into Jerusalem, \"riding upon an ass, and upon a colt,\" etc. (<a href=\"#\" onClick=\"return mV('Mat',21,5);\">Mat 21:5</a>, R.V.).<br><br>Of wild asses two species are noticed,<br><br>(1.) that called in Hebrew <i>'arod</i>, mentioned <a href=\"#\" onClick=\"return mV('Job',39,5);\">Job 39:5</a> and <a href=\"#\" onClick=\"return mV('Dan',5,21);\">Dan 5:21</a>, noted for its swiftness; and<br><br>(2.) that called <i>pe're</i>, the wild ass of Asia (<a href=\"#\" onClick=\"return mV('Job',39,'6-8');\">Job 39:6-8</a>; <a href=\"#\" onClick=\"return mV('Job',6,5);\">6:5</a>; <a href=\"#\" onClick=\"return mV('Job',11,12);\">11:12</a>; <a href=\"#\" onClick=\"return mV('Isa',32,14);\">Isa 32:14</a>; <a href=\"#\" onClick=\"return mV('Jer',2,24);\">Jer 2:24</a>; <a href=\"#\" onClick=\"return mV('Jer',14,6);\">14:6</a>, etc.). The wild ass was distinguished for its fleetness and its extreme shyness. In allusion to his mode of life, Ishmael is likened to a wild ass (<a href=\"#\" onClick=\"return mV('Gen',16,12);\">Gen 16:12</a>. Here the word is simply rendered \"wild\" in the Authorized Version, but in the Revised Version, \"wild-ass among men\").";
