<script>
var eastonArray = new Array ();
eastonArray["$$T0003350"] = "<strong>Sheol:</strong> (Heb., \"the all-demanding world\" = Gr. Hades, \"the unknown region\"), the invisible world of departed souls. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0001731');\">HELL</a>.)";
eastonArray["$$T0003351"] = "<strong>Shepham:</strong> a treeless place, <a href=\"#\" onClick=\"return mV('Num',34,10,11);\">Num 34:10-11</a>: \"The coast shall go down from Shepham to Riblah.\"";
eastonArray["$$T0003352"] = "<strong>Shephatiah:</strong> judged of the Lord.<br><br>(1.) A son of David by Abital (<a href=\"#\" onClick=\"return mV('2Sa',3,4);\">2Sa 3:4</a>).<br><br>(2.) A Benjamite who joined David at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,5);\">1Ch 12:5</a>).<br><br>(3.) A Simeonite prince in David's time (<a href=\"#\" onClick=\"return mV('1Ch',27,16);\">1Ch 27:16</a>).<br><br>(4.) One of Jehoshaphat's sons (<a href=\"#\" onClick=\"return mV('2Ch',21,2);\">2Ch 21:2</a>).<br><br>(5.) <a href=\"#\" onClick=\"return mV('Ezr',2,4);\">Ezr 2:4</a>.<br><br>(6.) <a href=\"#\" onClick=\"return mV('Ezr',2,57);\">Ezr 2:57</a>; <a href=\"#\" onClick=\"return mV('Neh',7,59);\">Neh 7:59</a>.<br><br>(7.) One of the princes who urged the putting of Jeremiah to death (<a href=\"#\" onClick=\"return mV('Jer',38,'1-4');\">Jer 38:1-4</a>).";
eastonArray["$$T0003353"] = "<strong>Shepherd:</strong> a word naturally of frequent occurence in Scripture. Sometimes the word \"pastor\" is used instead (<a href=\"#\" onClick=\"return mV('Jer',2,8);\">Jer 2:8</a>; <a href=\"#\" onClick=\"return mV('Jer',3,15);\">3:15</a>; <a href=\"#\" onClick=\"return mV('Jer',10,21);\">10:21</a>; <a href=\"#\" onClick=\"return mV('Jer',12,10);\">12:10</a>; <a href=\"#\" onClick=\"return mV('Jer',17,16);\">17:16</a>). This word is used figuratively to represent the relation of rulers to their subjects and of God to his people (<a href=\"#\" onClick=\"return mV('Psa',23,1);\">Psa 23:1</a>; <a href=\"#\" onClick=\"return mV('Psa',80,1);\">80:1</a>; <a href=\"#\" onClick=\"return mV('Isa',40,11);\">Isa 40:11</a>; <a href=\"#\" onClick=\"return mV('Isa',44,28);\">44:28</a>; <a href=\"#\" onClick=\"return mV('Jer',25,34,35);\">Jer 25:34-35</a>; <a href=\"#\" onClick=\"return mV('Nah',3,18);\">Nah 3:18</a>; <a href=\"#\" onClick=\"return mV('Jhn',10,11,14);\">Jhn 10:11, 14</a>; <a href=\"#\" onClick=\"return mV('Hbr',13,20);\">Hbr 13:20</a>; <a href=\"#\" onClick=\"return mV('1Pe',2,25);\">1Pe 2:25</a>; <a href=\"#\" onClick=\"return mV('1Pe',5,4);\">5:4</a>).<br><br>The duties of a shepherd in an unenclosed country like Palestine were very onerous. \"In early morning he led forth the flock from the fold, marching at its head to the spot where they were to be pastured. Here he watched them all day, taking care that none of the sheep strayed, and if any for a time eluded his watch and wandered away from the rest, seeking diligently till he found and brought it back. In those lands sheep require to be supplied regularly with water, and the shepherd for this purpose has to guide them either to some running stream or to wells dug in the wilderness and furnished with troughs. At night he brought the flock home to the fold, counting them as they passed under the rod at the door to assure himself that none were missing. Nor did his labours always end with sunset. Often he had to guard the fold through the dark hours from the attack of wild beasts, or the wily attempts of the prowling thief (see <a href=\"#\" onClick=\"return mV('1Sa',17,34);\">1Sa 17:34</a>).\", Deane's David.";
eastonArray["$$T0003354"] = "<strong>Sherebiah:</strong> flame of the Lord, a priest whose name is prominent in connection with the work carried on by Ezra and Nehemiah at Jerusalem (<a href=\"#\" onClick=\"return mV('Ezr',8,17,18,'24-30');\">Ezr 8:17-18, 24-30</a>; <a href=\"#\" onClick=\"return mV('Neh',8,7);\">Neh 8:7</a>; <a href=\"#\" onClick=\"return mV('Neh',9,4,5);\">9:4-5</a>; <a href=\"#\" onClick=\"return mV('Neh',10,12);\">10:12</a>).";
eastonArray["$$T0003355"] = "<strong>Sheresh:</strong> root, a descendant of Manasseh (<a href=\"#\" onClick=\"return mV('1Ch',7,16);\">1Ch 7:16</a>).";
eastonArray["$$T0003356"] = "<strong>Sherezer:</strong> one of the messengers whom the children of the Captivity sent to Jerusalem \"to pray for them before the Lord\" (<a href=\"#\" onClick=\"return mV('Zec',7,2);\">Zec 7:2</a>).";
eastonArray["$$T0003357"] = "<strong>Sheriffs:</strong> (<a href=\"#\" onClick=\"return mV('Dan',3,2);\">Dan 3:2</a>), Babylonian officers.";
eastonArray["$$T0003358"] = "<strong>Sheshach:</strong> (<a href=\"#\" onClick=\"return mV('Jer',25,26);\">Jer 25:26</a>), supposed to be equivalent to Babel (Babylon), according to a secret (cabalistic) mode of writing among the Jews of unknown antiquity, which consisted in substituting the last letter of the Hebrew alphabet for the first, the last but one for the second, and so on. Thus the letters sh, sh, ch become b, b, l, i.e., Babel. This is supposed to be confirmed by a reference to <a href=\"#\" onClick=\"return mV('Jer',51,41);\">Jer 51:41</a>, where Sheshach and Babylon are in parallel clauses. There seems to be no reason to doubt that Babylon is here intended by this name. (See Streane's Jeremiah, l.c.)";
eastonArray["$$T0003359"] = "<strong>Sheshai:</strong> whitish, one of the sons of Anak (<a href=\"#\" onClick=\"return mV('Num',13,22);\">Num 13:22</a>). When the Israelites obtained possession of the country the sons of Anak were expelled and slain (<a href=\"#\" onClick=\"return mV('Jos',15,14);\">Jos 15:14</a>; <a href=\"#\" onClick=\"return mV('Jdg',1,10);\">Jdg 1:10</a>).";
eastonArray["$$T0003360"] = "<strong>Sheshbazzar:</strong> O sun-god, defend the lord! (<a href=\"#\" onClick=\"return mV('Ezr',1,8,11);\">Ezr 1:8, 11</a>), probably another name for Zerubbabel (q.v.), <a href=\"#\" onClick=\"return mV('Ezr',2,2);\">Ezr 2:2</a>; <a href=\"#\" onClick=\"return mV('Hag',1,12,14);\">Hag 1:12, 14</a>; <a href=\"#\" onClick=\"return mV('Zec',4,6,10);\">Zec 4:6, 10</a>.";
eastonArray["$$T0003361"] = "<strong>Sheth:</strong> tumult.<br><br>(1.) \"The children of Sheth\" (<a href=\"#\" onClick=\"return mV('Num',24,17);\">Num 24:17</a>); R.V., \"the sons of tumult,\" which is probably the correct rendering, as there is no evidence that this is a proper name here.<br><br>(2.) The antediluvian patriarch (<a href=\"#\" onClick=\"return mV('1Ch',1,1);\">1Ch 1:1</a>).";
eastonArray["$$T0003362"] = "<strong>Shethar:</strong> a star, a prince at the court of Ahasuerus (<a href=\"#\" onClick=\"return mV('Est',1,14);\">Est 1:14</a>).";
eastonArray["$$T0003363"] = "<strong>Shethar-boznai:</strong> star of splendour, a Persian officer who vainly attempted to hinder the rebuilding of the temple (<a href=\"#\" onClick=\"return mV('Ezr',5,3,6);\">Ezr 5:3, 6</a>; <a href=\"#\" onClick=\"return mV('Ezr',6,6,13);\">6:6, 13</a>).";
eastonArray["$$T0003364"] = "<strong>Sheva:</strong> Heb. Shebher.<br><br>(1.) The son of Caleb (<a href=\"#\" onClick=\"return mV('1Ch',2,49);\">1Ch 2:49</a>).<br><br>(2.) Heb. Sheva', one of David's scribes (<a href=\"#\" onClick=\"return mV('2Sa',20,25);\">2Sa 20:25</a>).";
eastonArray["$$T0003365"] = "<strong>Shewbread:</strong> <a href=\"#\" onClick=\"return mV('Exd',25,30);\">Exd 25:30</a> (R.V. marg., \"presence bread\"); <a href=\"#\" onClick=\"return mV('1Ch',9,32);\">1Ch 9:32</a> (marg., \"bread of ordering\"); <a href=\"#\" onClick=\"return mV('Num',4,7);\">Num 4:7</a>: called \"hallowed bread\" (R.V., \"holy bread\") in <a href=\"#\" onClick=\"return mV('1Sa',21,'1-6');\">1Sa 21:1-6</a>.<br><br>This bread consisted of twelve loaves made of the finest flour. They were flat and thin, and were placed in two rows of six each on a table in the holy place before the Lord. They were renewed every Sabbath (<a href=\"#\" onClick=\"return mV('Lev',24,'5-9');\">Lev 24:5-9</a>), and those that were removed to give place to the new ones were to be eaten by the priests only in the holy place (see <a href=\"#\" onClick=\"return mV('1Sa',21,'3-6');\">1Sa 21:3-6</a>; <a href=\"#\" onClick=\"return mV('Mat',12,3,4);\">Mat 12:3-4</a>).<br><br>The number of the loaves represented the twelve tribes of Israel, and also the entire spiritual Israel, \"the true Israel;\" and the placing of them on the table symbolized the entire consecration of Israel to the Lord, and their acceptance of God as their God. The table for the bread was made of acacia wood, 3 feet long, 18 inches broad, and 2 feet 3 inches high. It was plated with pure gold. Two staves, plated with gold, passed through golden rings, were used for carrying it.";
eastonArray["$$T0003366"] = "<strong>Shibboleth:</strong> river, or an ear of corn. The tribes living on the east of Jordan, separated from their brethren on the west by the deep ravines and the rapid river, gradually came to adopt peculiar customs, and from mixing largely with the Moabites, Ishmaelites, and Ammonites to pronounce certain letters in such a manner as to distinguish them from the other tribes. Thus when the Ephraimites from the west invaded Gilead, and were defeated by the Gileadites under the leadership of Jephthah, and tried to escape by the \"passages of the Jordan,\" the Gileadites seized the fords and would allow none to pass who could not pronounce \"shibboleth\" with a strong aspirate. This the fugitives were unable to do. They said \"sibboleth,\" as the word was pronounced by the tribes on the west, and thus they were detected (<a href=\"#\" onClick=\"return mV('Jdg',12,'1-6');\">Jdg 12:1-6</a>). Forty-two thousand were thus detected, and<br><br>\"Without reprieve, adjudged to death, For want of well-pronouncing shibboleth.\"";
eastonArray["$$T0003367"] = "<strong>Shibmah:</strong> fragrance, a town of Reuben, east of Jordan (<a href=\"#\" onClick=\"return mV('Num',32,38);\">Num 32:38</a>).";
eastonArray["$$T0003368"] = "<strong>Shield:</strong> used in defensive warfare, varying at different times and under different circumstances in size, form, and material (<a href=\"#\" onClick=\"return mV('1Sa',17,7);\">1Sa 17:7</a>; <a href=\"#\" onClick=\"return mV('2Sa',1,21);\">2Sa 1:21</a>; <a href=\"#\" onClick=\"return mV('1Ki',10,17);\">1Ki 10:17</a>; <a href=\"#\" onClick=\"return mV('1Ch',12,8,24,34);\">1Ch 12:8, 24, 34</a>; <a href=\"#\" onClick=\"return mV('Isa',22,6);\">Isa 22:6</a>; <a href=\"#\" onClick=\"return mV('Eze',39,9);\">Eze 39:9</a>; <a href=\"#\" onClick=\"return mV('Nah',2,3);\">Nah 2:3</a>).<br><br>Used figuratively of God and of earthly princes as the defenders of their people (<a href=\"#\" onClick=\"return mV('Gen',15,1);\">Gen 15:1</a>; <a href=\"#\" onClick=\"return mV('Deu',33,29);\">Deu 33:29</a>; <a href=\"#\" onClick=\"return mV('Psa',33,20);\">Psa 33:20</a>; <a href=\"#\" onClick=\"return mV('Psa',84,11);\">84:11</a>). Faith is compared to a shield (<a href=\"#\" onClick=\"return mV('Eph',6,16);\">Eph 6:16</a>).<br><br>Shields were usually \"anointed\" (<a href=\"#\" onClick=\"return mV('Isa',21,5);\">Isa 21:5</a>), in order to preserve them, and at the same time make the missiles of the enemy glide off them more easily.";
eastonArray["$$T0003369"] = "<strong>Shiggaion:</strong> from the verb shagah, \"to reel about through drink,\" occurs in the title of <a href=\"#\" onClick=\"return mV('Psa',7,'1-');\">Psa 7</a>. The plural form, shigionoth, is found in <a href=\"#\" onClick=\"return mV('Hab',3,1);\">Hab 3:1</a>. The word denotes a lyrical poem composed under strong mental emotion; a song of impassioned imagination accompanied with suitable music; a dithyrambic ode.";
eastonArray["$$T0003370"] = "<strong>Shihon:</strong> overturning, a town of Issachar (<a href=\"#\" onClick=\"return mV('Jos',19,19);\">Jos 19:19</a>).";
eastonArray["$$T0003371"] = "<strong>Shihor:</strong> dark, (<a href=\"#\" onClick=\"return mV('1Ch',13,5);\">1Ch 13:5</a>), the southwestern boundary of Canaan, the Wady el-'Arish. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003428');\">SIHOR</a>; <a href=\"#\" onClick=\"return doDictLookup ('ET0002730');\">NILE</a>.)";
eastonArray["$$T0003372"] = "<strong>Shihor-Libnath:</strong> black-white, a stream on the borders of Asher, probably the modern Nahr Zerka, i.e., the \"crocodile brook,\" or \"blue river\", which rises in the Carmel range and enters the Mediterranean a little to the north of Caesarea (<a href=\"#\" onClick=\"return mV('Jos',19,26);\">Jos 19:26</a>). Crocodiles are still found in the Zerka. Thomson suspects \"that long ages ago some Egyptians, accustomed to worship this ugly creature, settled here (viz., at Caesarea), and brought their gods with them. Once here they would not easily be exterminated\" (The Land and the Book).";
eastonArray["$$T0003373"] = "<strong>Shilhim:</strong> aqueducts, a town in the south of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,32);\">Jos 15:32</a>); called also Sharuhen and Shaaraim (<a href=\"#\" onClick=\"return mV('Jos',19,6);\">19:6</a>).";
eastonArray["$$T0003374"] = "<strong>Shiloah, The waters of:</strong> =Siloah, (<a href=\"#\" onClick=\"return mV('Neh',3,15);\">Neh 3:15</a>) and Siloam (q.v.)";
eastonArray["$$T0003375"] = "<strong>Shiloh:</strong> generally understood as denoting the Messiah, \"the peaceful one,\" as the word signifies (<a href=\"#\" onClick=\"return mV('Gen',49,10);\">Gen 49:10</a>). The Vulgate Version translates the word, \"he who is to be sent,\" in allusion to the Messiah; the Revised Version, margin, \"till he come to Shiloh;\" and the LXX., \"until that which is his shall come to Shiloh.\" It is most simple and natural to render the expression, as in the Authorized Version, \"till Shiloh come,\" interpreting it as a proper name (<a href=\"#\" onClick=\"return mV('Isa',9,6);\">Isa 9:6</a>).<br><br>Shiloh, a place of rest, a city of Ephraim, \"on the north side of Bethel,\" from which it is distant 10 miles (<a href=\"#\" onClick=\"return mV('Jdg',21,19);\">Jdg 21:19</a>); the modern Seilun (the Arabic for Shiloh), a \"mass of shapeless ruins.\" Here the tabernacle was set up after the Conquest (<a href=\"#\" onClick=\"return mV('Jos',18,'1-10');\">Jos 18:1-10</a>), where it remained during all the period of the judges till the ark fell into the hands of the Philistines. \"No spot in Central Palestine could be more secluded than this early sanctuary, nothing more featureless than the landscape around; so featureless, indeed, the landscape and so secluded the spot that from the time of St. Jerome till its re-discovery by Dr. Robinson in 1838 the very site was forgotten and unknown.\" It is referred to by Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',7,12,14);\">Jer 7:12, 14</a>; <a href=\"#\" onClick=\"return mV('Jer',26,'4-9');\">26:4-9</a>) five hundred years after its destruction.";
eastonArray["$$T0003376"] = "<strong>Shilonite:</strong> Ahijah the prophet, whose home was in Shiloh, is so designated (<a href=\"#\" onClick=\"return mV('1Ki',11,29);\">1Ki 11:29</a>; <a href=\"#\" onClick=\"return mV('1Ki',15,29);\">15:29</a>). The plural form occurs (<a href=\"#\" onClick=\"return mV('1Ch',9,5);\">1Ch 9:5</a>), denoting the descendants of Shelah, Judah's youngest son.";
eastonArray["$$T0003377"] = "<strong>Shimea:</strong> the hearing prayer.<br><br>(1.) One of David's sons by Bathsheba (<a href=\"#\" onClick=\"return mV('1Ch',3,5);\">1Ch 3:5</a>); called also Shammua (<a href=\"#\" onClick=\"return mV('1Ch',14,4);\">14:4</a>).<br><br>(2.) A Levite of the family of Merari (<a href=\"#\" onClick=\"return mV('1Ch',6,30);\">1Ch 6:30</a>).<br><br>(3.) Another Levite of the family of Gershon (<a href=\"#\" onClick=\"return mV('1Ch',6,39);\">1Ch 6:39</a>).<br><br>(4.) One of David's brothers (<a href=\"#\" onClick=\"return mV('1Sa',16,9);\">1Sa 16:9</a>, marg.).";
eastonArray["$$T0003378"] = "<strong>Shimeah:</strong><br><br>(1.) One of David's brothers (<a href=\"#\" onClick=\"return mV('2Sa',13,3);\">2Sa 13:3</a>); same as Shimea (4).<br><br>(2.) A Benjamite, a descendant of Gibeon (<a href=\"#\" onClick=\"return mV('1Ch',8,32);\">1Ch 8:32</a>); called also Shimeam (<a href=\"#\" onClick=\"return mV('1Ch',9,38);\">9:38</a>).";
eastonArray["$$T0003379"] = "<strong>Shimei:</strong> famous.<br><br>(1.) A son of Gershon, and grandson of Levi (<a href=\"#\" onClick=\"return mV('Num',3,18);\">Num 3:18</a>; <a href=\"#\" onClick=\"return mV('1Ch',6,17,29);\">1Ch 6:17, 29</a>); called Shimi in <a href=\"#\" onClick=\"return mV('Exd',6,17);\">Exd 6:17</a>.<br><br>(2.) A Benjamite of the house of Saul, who stoned and cursed David when he reached Bahurim in his flight from Jerusalem on the occasion of the rebellion of Absalom (<a href=\"#\" onClick=\"return mV('2Sa',16,'5-13');\">2Sa 16:5-13</a>). After the defeat of Absalom he \"came cringing to the king, humbly suing for pardon, bringing with him a thousand of his Benjamite tribesmen, and representing that he was heartily sorry for his crime, and had hurried the first of all the house of Israel to offer homage to the king\" (<a href=\"#\" onClick=\"return mV('2Sa',19,'16-23');\">19:16-23</a>). David forgave him; but on his death-bed he gave Solomon special instructions regarding Shimei, of whose fidelity he seems to have been in doubt (<a href=\"#\" onClick=\"return mV('1Ki',2,8,9);\">1Ki 2:8-9</a>). He was put to death at the command of Solomon, because he had violated his word by leaving Jerusalem and going to Gath to recover two of his servants who had escaped (<a href=\"#\" onClick=\"return mV('1Ki',2,'36-46');\">1Ki 2:36-46</a>).<br><br>(3.) One of David's mighty men who refused to acknowledge Adonijah as David's successor (<a href=\"#\" onClick=\"return mV('1Ki',1,8);\">1Ki 1:8</a>). He is probably the same person who is called elsewhere (<a href=\"#\" onClick=\"return mV('1Ki',4,18);\">4:18</a>) \"the son of Elah.\"<br><br>(4.) A son of Pedaiah, the brother of Zerubbabel (<a href=\"#\" onClick=\"return mV('1Ch',3,19);\">1Ch 3:19</a>).<br><br>(5.) A Simeonite (<a href=\"#\" onClick=\"return mV('1Ch',4,26,27);\">1Ch 4:26-27</a>).<br><br>(6.) A Reubenite (<a href=\"#\" onClick=\"return mV('1Ch',5,4);\">1Ch 5:4</a>).<br><br>(7.) A Levite of the family of Gershon (<a href=\"#\" onClick=\"return mV('1Ch',6,42);\">1Ch 6:42</a>).<br><br>(8.) A Ramathite who was \"over the vineyards\" of David (<a href=\"#\" onClick=\"return mV('1Ch',27,27);\">1Ch 27:27</a>).<br><br>(9.) One of the sons of Heman, who assisted in the purification of the temple (<a href=\"#\" onClick=\"return mV('2Ch',29,14);\">2Ch 29:14</a>).<br><br>(10.) A Levite (<a href=\"#\" onClick=\"return mV('2Ch',31,12,13);\">2Ch 31:12-13</a>).<br><br>(11.) Another Levite (<a href=\"#\" onClick=\"return mV('Ezr',10,23);\">Ezr 10:23</a>). \"The family of Shimei\" (<a href=\"#\" onClick=\"return mV('Zec',12,13);\">Zec 12:13</a>; R.V., \"the family of the Shimeites\") were the descendants of Shimei<br><br>(1).";
eastonArray["$$T0003380"] = "<strong>Shimeon:</strong> hearkening. <a href=\"#\" onClick=\"return mV('Ezr',10,31);\">Ezr 10:31</a>.";
eastonArray["$$T0003381"] = "<strong>Shimhi:</strong> famous, a Benjamite (<a href=\"#\" onClick=\"return mV('1Ch',8,21);\">1Ch 8:21</a>).";
eastonArray["$$T0003382"] = "<strong>Shimrath:</strong> guardian, a Benjamite, one of Shimhi's sons (id.).";
eastonArray["$$T0003383"] = "<strong>Shimri:</strong> watchman.<br><br>(1.) A Simeonite (<a href=\"#\" onClick=\"return mV('1Ch',4,37);\">1Ch 4:37</a>).<br><br>(2.) The father of one of the \"valiant men\" of David's armies (<a href=\"#\" onClick=\"return mV('1Ch',11,45);\">1Ch 11:45</a>).<br><br>(3.) Assisted at the purification of the temple in the time of Hezekiah (<a href=\"#\" onClick=\"return mV('2Ch',29,13);\">2Ch 29:13</a>).";
eastonArray["$$T0003384"] = "<strong>Shimrom:</strong> watchman, the fourth son of Issachar (<a href=\"#\" onClick=\"return mV('Gen',46,13);\">Gen 46:13</a>; <a href=\"#\" onClick=\"return mV('1Ch',7,1);\">1Ch 7:1</a>; R.V., correctly, \"Shimron\").";
eastonArray["$$T0003385"] = "<strong>Shimron:</strong> watch-post, an ancient city of the Canaanites; with its villages, allotted to Zebulun (<a href=\"#\" onClick=\"return mV('Jos',19,15);\">Jos 19:15</a>); now probably Semunieh, on the northern edge of the plain of Esdraelon, 5 miles west of Nazareth.";
eastonArray["$$T0003386"] = "<strong>Shimron-meron:</strong> the same, probably, as Shimron (<a href=\"#\" onClick=\"return mV('Jos',12,20);\">Jos 12:20</a>).";
eastonArray["$$T0003387"] = "<strong>Shimshai:</strong> the shining one, or sunny, the secretary of Rehum the chancellor, who took part in opposing the rebuilding of the temple after the Captivity (<a href=\"#\" onClick=\"return mV('Ezr',4,8,9,'17-23');\">Ezr 4:8-9, 17-23</a>).";
eastonArray["$$T0003388"] = "<strong>Shinab:</strong> cooling, the king of Adamah, in the valley of Siddim, who with his confederates was conquered by Chedorlaomer (<a href=\"#\" onClick=\"return mV('Gen',14,2);\">Gen 14:2</a>).";
eastonArray["$$T0003389"] = "<strong>Shinar, The Land of:</strong> LXX. and Vulgate \"Senaar;\" in the inscriptions, \"Shumir;\" probably identical with Babylonia or Southern Mesopotamia, extending almost to the Persian Gulf. Here the tower of Babel was built (<a href=\"#\" onClick=\"return mV('Gen',11,'1-6');\">Gen 11:1-6</a>), and the city of Babylon. The name occurs later in Jewish history (<a href=\"#\" onClick=\"return mV('Isa',11,11);\">Isa 11:11</a>; <a href=\"#\" onClick=\"return mV('Zec',5,11);\">Zec 5:11</a>). Shinar was apparently first peopled by Turanian tribes, who tilled the land and made bricks and built cities. Then tribes of Semites invaded the land and settled in it, and became its rulers. This was followed in course of time by an Elamite invasion; from which the land was finally delivered by Khammurabi, the son of Amarpel (<a href=\"#\" onClick=\"return mV('Gen',14,1);\">Gen 14:1</a>), who became the founder of the new empire of Chaldea. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000221');\">AMRAPHEL</a>.)";
eastonArray["$$T0003390"] = "<strong>Shiphmite:</strong> probably the designation of Zabdi, who has charge of David's vineyards (<a href=\"#\" onClick=\"return mV('1Ch',27,27);\">1Ch 27:27</a>).";
eastonArray["$$T0003391"] = "<strong>Shiphrah:</strong> beauty, one of the Egyptian midwives (<a href=\"#\" onClick=\"return mV('Exd',1,15);\">Exd 1:15</a>).";
eastonArray["$$T0003392"] = "<strong>Shiphtan:</strong> judicial, an Ephraimite prince at the time of the division of Canaan (<a href=\"#\" onClick=\"return mV('Num',34,24);\">Num 34:24</a>).";
eastonArray["$$T0003393"] = "<strong>Ships:</strong> early used in foreign commerce by the Phoenicians (<a href=\"#\" onClick=\"return mV('Gen',49,13);\">Gen 49:13</a>). Moses (<a href=\"#\" onClick=\"return mV('Deu',28,68);\">Deu 28:68</a>) and Job (<a href=\"#\" onClick=\"return mV('Job',9,26);\">Job 9:26</a>) make reference to them, and Balaam speaks of the \"ships of Chittim\" (<a href=\"#\" onClick=\"return mV('Num',24,24);\">Num 24:24</a>). Solomon constructed a navy at Ezion-geber by the assistance of Hiram's sailors (<a href=\"#\" onClick=\"return mV('1Ki',9,'26-28');\">1Ki 9:26-28</a>; <a href=\"#\" onClick=\"return mV('2Ch',8,18);\">2Ch 8:18</a>). Afterwards, Jehoshaphat sought to provide himself with a navy at the same port, but his ships appear to have been wrecked before they set sail (<a href=\"#\" onClick=\"return mV('1Ki',22,48,49);\">1Ki 22:48-49</a>; <a href=\"#\" onClick=\"return mV('2Ch',20,'35-37');\">2Ch 20:35-37</a>).<br><br>In our Lord's time fishermen's boats on the Sea of Galilee were called \"ships.\" Much may be learned regarding the construction of ancient merchant ships and navigation from the record in <a href=\"#\" onClick=\"return mV('Act',27,'1-');\">Acts 27</a>; <a href=\"#\" onClick=\"return mV('Act',28,'1-');\">28</a>.";
eastonArray["$$T0003394"] = "<strong>Shishak I:</strong> =Sheshonk I., king of Egypt. His reign was one of great national success, and a record of his wars and conquests adorns the portico of what are called the \"Bubastite kings\" at Karnak, the ancient Thebes. Among these conquests is a record of that of Judea. In the fifth year of Rehoboam's reign Shishak came up against the kingdom of Judah with a powerful army. He took the fenced cities and came to Jerusalem. He pillaged the treasures of the temple and of the royal palace, and carried away the shields of gold which Solomon had made (<a href=\"#\" onClick=\"return mV('1Ki',11,40);\">1Ki 11:40</a>; <a href=\"#\" onClick=\"return mV('1Ki',14,25);\">14:25</a>; <a href=\"#\" onClick=\"return mV('2Ch',12,2);\">2Ch 12:2</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003094');\">REHOBOAM</a>.) This expedition of the Egyptian king was undertaken at the instigation of Jeroboam for the purpose of humbling Judah. Hostilities between the two kingdoms still continued; but during Rehoboam's reign there was not again the intervention of a third party.";
eastonArray["$$T0003395"] = "<strong>Shittah-tree:</strong> (<a href=\"#\" onClick=\"return mV('Isa',41,19);\">Isa 41:19</a>; R.V., \"acacia tree\"). Shittah wood was employed in making the various parts of the tabernacle in the wilderness, and must therefore have been indigenous in the desert in which the Israelites wandered. It was the acacia or mimosa (<i>Acacia Nilotica</i> and <i>A. seyal</i>). \"The wild acacia (<i>Mimosa Nilotica</i>), under the name of <i>sunt</i>, everywhere represents the seneh, or senna, of the burning bush. A slightly different form of the tree, equally common under the name of <i>seyal</i>, is the ancient 'shittah,' or, as more usually expressed in the plural form, the 'shittim,' of which the tabernacle was made.\" Stanley's Sinai, etc. (<a href=\"#\" onClick=\"return mV('Exd',25,10,13,23,28);\">Exd 25:10, 13, 23, 28</a>).";
eastonArray["$$T0003396"] = "<strong>Shittim:</strong> acacias, also called \"Abel-shittim\" (<a href=\"#\" onClick=\"return mV('Num',33,49);\">Num 33:49</a>), a plain or valley in the land of Moab where the Israelites were encamped after their two victories over Sihon and Og, at the close of their desert wanderings, and from which Joshua sent forth two spies (q.v.) \"secretly\" to \"view\" the land and Jericho (<a href=\"#\" onClick=\"return mV('Jos',2,1);\">Jos 2:1</a>).";
eastonArray["$$T0003397"] = "<strong>Shoa:</strong> opulent, the mountain district lying to the north-east of Babylonia, anciently the land of the Guti, or Kuti, the modern Kurdistan. The plain lying between these mountains and the Tigris was called su-Edina, i.e., \"the border of the plain.\" This name was sometimes shortened into Suti and Su, and has been regarded as = Shoa (<a href=\"#\" onClick=\"return mV('Eze',23,23);\">Eze 23:23</a>). Some think it denotes a place in Babylon. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002883');\">PEKOD</a>.)";
eastonArray["$$T0003398"] = "<strong>Shobab:</strong> apostate.<br><br>(1.) One of David's sons by Bathseheba (<a href=\"#\" onClick=\"return mV('2Sa',5,14);\">2Sa 5:14</a>).<br><br>(2.) One of the sons of Caleb (<a href=\"#\" onClick=\"return mV('1Ch',2,18);\">1Ch 2:18</a>), the son of Hezron.";
eastonArray["$$T0003399"] = "<strong>Shobach:</strong> poured out, the \"captain of the host of Hadarezer\" when he mustered his vassals and tributaries from beyond \"the river Euphrates\" (<a href=\"#\" onClick=\"return mV('2Sa',10,'15-18');\">2Sa 10:15-18</a>); called also Shophach (<a href=\"#\" onClick=\"return mV('1Ch',19,16);\">1Ch 19:16</a>).";
