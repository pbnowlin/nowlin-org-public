<script>
var eastonArray = new Array ();
eastonArray["$$T0001350"] = "<strong>Flagon:</strong> Heb. ashishah, (<a href=\"#\" onClick=\"return mV('2Sa',6,19);\">2Sa 6:19</a>; <a href=\"#\" onClick=\"return mV('1Ch',16,3);\">1Ch 16:3</a>; <a href=\"#\" onClick=\"return mV('Sgs',2,5);\">Sgs 2:5</a>; <a href=\"#\" onClick=\"return mV('Hsa',3,1);\">Hsa 3:1</a>), meaning properly \"a cake of pressed raisins.\" \"Flagons of wine\" of the Authorized Version should be, as in the Revised Version, \"cakes of raisins\" in all these passages. In <a href=\"#\" onClick=\"return mV('Isa',22,24);\">Isa 22:24</a> it is the rendering of the Hebrew <i>nebel</i>, which properly means a bottle or vessel of skin. (<a href=\"#\" onClick=\"return mV('1Sa',1,24);\">1Sa 1:24</a>; <a href=\"#\" onClick=\"return mV('1Sa',10,3);\">10:3</a>; <a href=\"#\" onClick=\"return mV('1Sa',25,18);\">25:18</a>; <a href=\"#\" onClick=\"return mV('2Sa',16,1);\">2Sa 16:1</a>, where the same Hebrew word is used.)";
eastonArray["$$T0001351"] = "<strong>Flame of fire:</strong> is the chosen symbol of the holiness of God (<a href=\"#\" onClick=\"return mV('Exd',3,2);\">Exd 3:2</a>; <a href=\"#\" onClick=\"return mV('Rev',2,18);\">Rev 2:18</a>), as indicating \"the intense, all-consuming operation of his holiness in relation to sin.\"";
eastonArray["$$T0001352"] = "<strong>Flax:</strong> (Heb. pishtah, i.e., \"peeled\", in allusion to the fact that the stalks of flax when dried were first split or peeled before being steeped in water for the purpose of destroying the pulp). This plant was cultivated from earliest times. The flax of Egypt was destroyed by the plague of hail when it \"was bolled\", i.e., was forming pods for seed (<a href=\"#\" onClick=\"return mV('Exd',9,31);\">Exd 9:31</a>). It was extensively cultivated both in Egypt and Palestine. Reference is made in <a href=\"#\" onClick=\"return mV('Jos',2,6);\">Jos 2:6</a> to the custom of drying flax-stalks by exposing them to the sun on the flat roofs of houses. It was much used in forming articles of clothing such as girdles, also cords and bands (<a href=\"#\" onClick=\"return mV('Lev',13,48,52,59);\">Lev 13:48, 52, 59</a>; <a href=\"#\" onClick=\"return mV('Deu',22,11);\">Deu 22:11</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002296');\">LINEN</a>.)";
eastonArray["$$T0001353"] = "<strong>Flea:</strong> David at the cave of Adullam thus addressed his persecutor Saul (<a href=\"#\" onClick=\"return mV('1Sa',24,14);\">1Sa 24:14</a>): \"After whom is the king of Israel come out? after whom dost thou pursue? after a dead dog, after a flea?\" He thus speaks of himself as the poor, contemptible object of the monarch's pursuit, a \"worthy object truly for an expedition of the king of Israel with his picked troops!\" This insect is in Eastern language the popular emblem of insignificance. In <a href=\"#\" onClick=\"return mV('1Sa',26,20);\">1Sa 26:20</a> the LXX. read \"come out to seek my life\" instead of \"to seek a flea.\"";
eastonArray["$$T0001354"] = "<strong>Fleece:</strong> the wool of a sheep, whether shorn off or still attached to the skin (<a href=\"#\" onClick=\"return mV('Deu',18,4);\">Deu 18:4</a>; <a href=\"#\" onClick=\"return mV('Job',31,20);\">Job 31:20</a>). The miracle of Gideon's fleece (<a href=\"#\" onClick=\"return mV('Jdg',6,'37-40');\">Jdg 6:37-40</a>) consisted in the dew having fallen at one time on the fleece without any on the floor, and at another time in the fleece remaining dry while the ground was wet with dew.";
eastonArray["$$T0001355"] = "<strong>Flesh:</strong> in the Old Testament denotes<br><br>(1) a particular part of the body of man and animals (<a href=\"#\" onClick=\"return mV('Gen',2,21);\">Gen 2:21</a>; <a href=\"#\" onClick=\"return mV('Gen',41,2);\">41:2</a>; <a href=\"#\" onClick=\"return mV('Psa',102,5);\">Psa 102:5</a>, marg.);<br><br>(2) the whole body (<a href=\"#\" onClick=\"return mV('Psa',16,9);\">Psa 16:9</a>);<br><br>(3) all living things having flesh, and particularly humanity as a whole (<a href=\"#\" onClick=\"return mV('Gen',6,12,13);\">Gen 6:12-13</a>);<br><br>(4) mutability and weakness (<a href=\"#\" onClick=\"return mV('2Ch',32,8);\">2Ch 32:8</a>; <a href=\"#\" onClick=\"return mV('Isa',31,3);\">Isa 31:3</a>; <a href=\"#\" onClick=\"return mV('Psa',78,39);\">Psa 78:39</a>). As suggesting the idea of softness it is used in the expression \"heart of flesh\" (<a href=\"#\" onClick=\"return mV('Eze',11,19);\">Eze 11:19</a>). The expression \"my flesh and bone\" (<a href=\"#\" onClick=\"return mV('Jdg',9,2);\">Jdg 9:2</a>; <a href=\"#\" onClick=\"return mV('Isa',58,7);\">Isa 58:7</a>) denotes relationship.<br><br>In the New Testament, besides these it is also used to denote the sinful element of human nature as opposed to the \"Spirit\" (<a href=\"#\" onClick=\"return mV('Rom',6,19);\">Rom 6:19</a>; <a href=\"#\" onClick=\"return mV('Mat',16,17);\">Mat 16:17</a>). Being \"in the flesh\" means being unrenewed (<a href=\"#\" onClick=\"return mV('Rom',7,5);\">Rom 7:5</a>; <a href=\"#\" onClick=\"return mV('Rom',8,8,9);\">8:8-9</a>), and to live \"according to the flesh\" is to live and act sinfully (<a href=\"#\" onClick=\"return mV('Rom',8,4,5,7,12);\">Rom 8:4-5, 7, 12</a>).<br><br>This word also denotes the human nature of Christ (<a href=\"#\" onClick=\"return mV('Jhn',1,14);\">Jhn 1:14</a>, \"The Word was made flesh.\" Comp. also <a href=\"#\" onClick=\"return mV('1Ti',3,16);\">1Ti 3:16</a>; <a href=\"#\" onClick=\"return mV('Rom',1,3);\">Rom 1:3</a>).";
eastonArray["$$T0001356"] = "<strong>Flesh-hook:</strong> a many-pronged fork used in the sacrificial services (<a href=\"#\" onClick=\"return mV('1Sa',2,13,14);\">1Sa 2:13-14</a>; <a href=\"#\" onClick=\"return mV('Exd',27,3);\">Exd 27:3</a>; <a href=\"#\" onClick=\"return mV('Exd',38,3);\">38:3</a>) by the priest in drawing away the flesh. The fat of the sacrifice, together with the breast and shoulder (<a href=\"#\" onClick=\"return mV('Lev',7,'29-34');\">Lev 7:29-34</a>), were presented by the worshipper to the priest. The fat was burned on the alter (<a href=\"#\" onClick=\"return mV('Lev',3,'3-5');\">3:3-5</a>), and the breast and shoulder became the portion of the priests. But Hophni and Phinehas, not content with this, sent a servant to seize with a flesh-hook a further portion.";
eastonArray["$$T0001357"] = "<strong>Flint:</strong> abounds in all the plains and valleys of the wilderness of the forty years' wanderings. In <a href=\"#\" onClick=\"return mV('Isa',50,7);\">Isa 50:7</a> and <a href=\"#\" onClick=\"return mV('Eze',3,9);\">Eze 3:9</a> the expressions, where the word is used, means that the \"Messiah would be firm and resolute amidst all contempt and scorn which he would meet; that he had made up his mind to endure it, and would not shrink from any kind or degree of suffering which would be necessary to accomplish the great work in which he was engaged.\" (<a href=\"#\" onClick=\"return mV('Eze',3,8,9);\">Eze 3:8-9</a>.) The words \"like a flint\" are used with reference to the hoofs of horses (<a href=\"#\" onClick=\"return mV('Isa',5,28);\">Isa 5:28</a>).";
eastonArray["$$T0001358"] = "<strong>Flood:</strong> an event recorded in <a href=\"#\" onClick=\"return mV('Gen',7,'1-');\">Gen 7</a> and <a href=\"#\" onClick=\"return mV('Gen',8,'1-');\">8</a>. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001011');\">DELUGE</a>.) In <a href=\"#\" onClick=\"return mV('Jos',24,2,3,14,15);\">Jos 24:2-3, 14-15</a>, the word \"flood\" (R.V., \"river\") means the river Euphrates. In <a href=\"#\" onClick=\"return mV('Psa',66,6);\">Psa 66:6</a>, this word refers to the river Jordan.";
eastonArray["$$T0001359"] = "<strong>Flour:</strong> Grain reduced to the form of meal is spoken of in the time of Abraham (<a href=\"#\" onClick=\"return mV('Gen',18,6);\">Gen 18:6</a>). As baking was a daily necessity, grain was also ground daily at the mills (<a href=\"#\" onClick=\"return mV('Jer',25,10);\">Jer 25:10</a>). The flour mingled with water was kneaded in kneading-troughs, and sometimes leaven (<a href=\"#\" onClick=\"return mV('Exd',12,34);\">Exd 12:34</a>) was added and sometimes omitted (<a href=\"#\" onClick=\"return mV('Gen',19,3);\">Gen 19:3</a>). The dough was then formed into thin cakes nine or ten inches in diameter and baked in the oven.<br><br>Fine flour was offered by the poor as a sin-offering (<a href=\"#\" onClick=\"return mV('Lev',5,'11-13');\">Lev 5:11-13</a>), and also in connection with other sacrifices (<a href=\"#\" onClick=\"return mV('Num',15,'3-12');\">Num 15:3-12</a>; <a href=\"#\" onClick=\"return mV('Num',28,'7-29');\">28:7-29</a>).";
eastonArray["$$T0001360"] = "<strong>Flowers:</strong> Very few species of flowers are mentioned in the Bible although they abounded in Palestine. It has been calculated that in Western Syria and Palestine from two thousand to two thousand five hundred plants are found, of which about five hundred probably are British wild-flowers. Their beauty is often alluded to (<a href=\"#\" onClick=\"return mV('Sgs',2,12);\">Sgs 2:12</a>; <a href=\"#\" onClick=\"return mV('Mat',6,28);\">Mat 6:28</a>). They are referred to as affording an emblem of the transitory nature of human life (<a href=\"#\" onClick=\"return mV('Job',14,2);\">Job 14:2</a>; <a href=\"#\" onClick=\"return mV('Psa',103,15);\">Psa 103:15</a>; <a href=\"#\" onClick=\"return mV('Isa',28,1);\">Isa 28:1</a>; <a href=\"#\" onClick=\"return mV('Isa',40,6);\">40:6</a>; <a href=\"#\" onClick=\"return mV('Jam',1,10);\">Jam 1:10</a>). Gardens containing flowers and fragrant herbs are spoken of (<a href=\"#\" onClick=\"return mV('Sgs',4,16);\">Sgs 4:16</a>; <a href=\"#\" onClick=\"return mV('Sgs',6,2);\">6:2</a>).";
eastonArray["$$T0001361"] = "<strong>Flute:</strong> a musical instrument, probably composed of a number of pipes, mentioned <a href=\"#\" onClick=\"return mV('Dan',3,5,7,10,15);\">Dan 3:5, 7, 10, 15</a>.<br><br>In <a href=\"#\" onClick=\"return mV('Mat',9,23,24);\">Mat 9:23-24</a>, notice is taken of players on the flute, here called \"minstrels\" (but in R.V. \"flute-players\").<br><br>Flutes were in common use among the ancient Egyptians.";
eastonArray["$$T0001362"] = "<strong>Fly:</strong> Heb. zebub, (<a href=\"#\" onClick=\"return mV('Ecc',10,1);\">Ecc 10:1</a>; <a href=\"#\" onClick=\"return mV('Isa',7,18);\">Isa 7:18</a>). This fly was so grievous a pest that the Phoenicians invoked against it the aid of their god Baal-zebub (q.v.). The prophet Isaiah (<a href=\"#\" onClick=\"return mV('Isa',7,18);\">Isa 7:18</a>) alludes to some poisonous fly which was believed to be found on the confines of Egypt, and which would be called by the Lord. Poisonous flies exist in many parts of Africa, for instance, the different kinds of tsetse.<br><br>Heb. 'arob, the name given to the insects sent as a plague on the land of Egypt (<a href=\"#\" onClick=\"return mV('Exd',8,'21-31');\">Exd 8:21-31</a>; <a href=\"#\" onClick=\"return mV('Psa',78,45);\">Psa 78:45</a>; <a href=\"#\" onClick=\"return mV('Psa',105,31);\">105:31</a>). The LXX. render this by a word which means the \"dog-fly,\" the cynomuia. The Jewish commentators regarded the Hebrew word here as connected with the word <i>'arab</i>, which means \"mingled;\" and they accordingly supposed the plague to consist of a mixed multitude of animals, beasts, reptiles, and insects. But there is no doubt that \"the <i>'arab</i>\" denotes a single definite species. Some interpreters regard it as the <i>Blatta orientalis</i>, the cockroach, a species of beetle. These insects \"inflict very painful bites with their jaws; gnaw and destroy clothes, household furniture, leather, and articles of every kind, and either consume or render unavailable all eatables.\"";
eastonArray["$$T0001363"] = "<strong>Foam:</strong> (<a href=\"#\" onClick=\"return mV('Hsa',10,7);\">Hsa 10:7</a>), the rendering of <i>ketseph</i>, which properly means twigs or splinters (as rendered in the LXX. and marg. R.V.). The expression in Hosea may therefore be read, \"as a chip on the face of the water,\" denoting the helplessness of the piece of wood as compared with the irresistable current.";
eastonArray["$$T0001364"] = "<strong>Fodder:</strong> Heb. belil, (<a href=\"#\" onClick=\"return mV('Job',6,5);\">Job 6:5</a>), meaning properly a mixture or medley (Lat. farrago), \"made up of various kinds of grain, as wheat, barley, vetches, and the like, all mixed together, and then sown or given to cattle\" (<a href=\"#\" onClick=\"return mV('Job',24,6);\">Job 24:6</a>, A.V. \"corn,\" R.V. \"provender; <a href=\"#\" onClick=\"return mV('Isa',30,24);\">Isa 30:24</a>, provender\").";
eastonArray["$$T0001365"] = "<strong>Fold:</strong> an enclosure for flocks to rest together (<a href=\"#\" onClick=\"return mV('Isa',13,20);\">Isa 13:20</a>). Sheep-folds are mentioned <a href=\"#\" onClick=\"return mV('Num',32,16,24,36);\">Num 32:16, 24, 36</a>; <a href=\"#\" onClick=\"return mV('2Sa',7,8);\">2Sa 7:8</a>; <a href=\"#\" onClick=\"return mV('Zep',2,6);\">Zep 2:6</a>; <a href=\"#\" onClick=\"return mV('Jhn',10,1);\">Jhn 10:1</a>, etc. It was prophesied of the cities of Ammon (<a href=\"#\" onClick=\"return mV('Eze',25,5);\">Eze 25:5</a>), Aroer (<a href=\"#\" onClick=\"return mV('Isa',17,2);\">Isa 17:2</a>), and Judaea, that they would be folds or couching-places for flocks. \"Among the pots,\" of the Authorized Version (<a href=\"#\" onClick=\"return mV('Psa',68,13);\">Psa 68:13</a>), is rightly in the Revised Version, \"among the sheepfolds.\"";
eastonArray["$$T0001366"] = "<strong>Food:</strong> Originally the Creator granted the use of the vegetable world for food to man (<a href=\"#\" onClick=\"return mV('Gen',1,29);\">Gen 1:29</a>), with the exception mentioned (<a href=\"#\" onClick=\"return mV('Gen',2,17);\">2:17</a>). The use of animal food was probably not unknown to the antediluvians. There is, however, a distinct law on the subject given to Noah after the Deluge (<a href=\"#\" onClick=\"return mV('Gen',9,'2-5');\">Gen 9:2-5</a>). Various articles of food used in the patriarchal age are mentioned in <a href=\"#\" onClick=\"return mV('Gen',18,'6-8');\">Gen 18:6-8</a>; <a href=\"#\" onClick=\"return mV('Gen',25,34);\">25:34</a>; <a href=\"#\" onClick=\"return mV('Gen',27,3,4);\">27:3-4</a>; <a href=\"#\" onClick=\"return mV('Gen',43,11);\">43:11</a>. Regarding the food of the Israelites in Egypt, see <a href=\"#\" onClick=\"return mV('Exd',16,3);\">Exd 16:3</a>; <a href=\"#\" onClick=\"return mV('Num',11,5);\">Num 11:5</a>. In the wilderness their ordinary food was miraculously supplied in the manna. They had also quails (<a href=\"#\" onClick=\"return mV('Exd',16,'11-13');\">Exd 16:11-13</a>; <a href=\"#\" onClick=\"return mV('Num',11,31);\">Num 11:31</a>).<br><br>In the law of Moses there are special regulations as to the animals to be used for food (<a href=\"#\" onClick=\"return mV('Lev',11,'1-')\">Lev 11</a>; <a href=\"#\" onClick=\"return mV('Deu',14,'3-21');\">Deu 14:3-21</a>). The Jews were also forbidden to use as food anything that had been consecrated to idols (<a href=\"#\" onClick=\"return mV('Exd',34,15);\">Exd 34:15</a>), or animals that had died of disease or had been torn by wild beasts (<a href=\"#\" onClick=\"return mV('Exd',22,31);\">Exd 22:31</a>; <a href=\"#\" onClick=\"return mV('Lev',22,8);\">Lev 22:8</a>). (other restrictions <a href=\"#\" onClick=\"return mV('Exd',23,19);\">Exd 23:19</a>; <a href=\"#\" onClick=\"return mV('Exd',29,'13-22');\">29:13-22</a>; <a href=\"#\" onClick=\"return mV('Lev',3,'4-9');\">Lev 3:4-9</a>; <a href=\"#\" onClick=\"return mV('Lev',9,18,19);\">9:18-19</a>; <a href=\"#\" onClick=\"return mV('Lev',22,8);\">22:8</a>; <a href=\"#\" onClick=\"return mV('Deu',14,21);\">Deu 14:21</a>.) But beyond these restrictions they had a large grant from God (<a href=\"#\" onClick=\"return mV('Deu',14,26);\">Deu 14:26</a>; <a href=\"#\" onClick=\"return mV('Deu',32,13,14);\">32:13-14</a>).<br><br>Food was prepared for use in various ways. The cereals were sometimes eaten without any preparation (<a href=\"#\" onClick=\"return mV('Lev',23,14);\">Lev 23:14</a>; <a href=\"#\" onClick=\"return mV('Deu',23,25);\">Deu 23:25</a>; <a href=\"#\" onClick=\"return mV('2Ki',4,42);\">2Ki 4:42</a>). Vegetables were cooked by boiling (<a href=\"#\" onClick=\"return mV('Gen',25,30,34);\">Gen 25:30, 34</a>; <a href=\"#\" onClick=\"return mV('2Ki',4,38,39);\">2Ki 4:38-39</a>), and thus also other articles of food were prepared for use (<a href=\"#\" onClick=\"return mV('Gen',27,4);\">Gen 27:4</a>; <a href=\"#\" onClick=\"return mV('Pro',23,3);\">Pro 23:3</a>; <a href=\"#\" onClick=\"return mV('Eze',24,10);\">Eze 24:10</a>; <a href=\"#\" onClick=\"return mV('Luk',24,42);\">Luk 24:42</a>; <a href=\"#\" onClick=\"return mV('Jhn',21,9);\">Jhn 21:9</a>). Food was also prepared by roasting (<a href=\"#\" onClick=\"return mV('Exd',12,8);\">Exd 12:8</a>; <a href=\"#\" onClick=\"return mV('Lev',2,14);\">Lev 2:14</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000892');\">COOK</a>.)";
eastonArray["$$T0001367"] = "<strong>Footstool:</strong> connected with a throne (<a href=\"#\" onClick=\"return mV('2Ch',9,18);\">2Ch 9:18</a>). Jehovah symbolically dwelt in the holy place between the cherubim above the ark of the covenant. The ark was his footstool (<a href=\"#\" onClick=\"return mV('1Ch',28,2);\">1Ch 28:2</a>; <a href=\"#\" onClick=\"return mV('Psa',99,5);\">Psa 99:5</a>; <a href=\"#\" onClick=\"return mV('Psa',132,7);\">132:7</a>). And as heaven is God's throne, so the earth is his footstool (<a href=\"#\" onClick=\"return mV('Psa',110,1);\">Psa 110:1</a>; <a href=\"#\" onClick=\"return mV('Isa',66,1);\">Isa 66:1</a>; <a href=\"#\" onClick=\"return mV('Mat',5,35);\">Mat 5:35</a>).";
eastonArray["$$T0001368"] = "<strong>Forces:</strong> of the Gentiles (<a href=\"#\" onClick=\"return mV('Isa',60,5,11);\">Isa 60:5, 11</a>; R.V., \"the wealth of the nations\") denotes the wealth of the heathen. The whole passage means that the wealth of the Gentile world should be consecrated to the service of the church.";
eastonArray["$$T0001369"] = "<strong>Ford:</strong> Mention is frequently made of the fords of the Jordan (<a href=\"#\" onClick=\"return mV('Jos',2,7);\">Jos 2:7</a>; <a href=\"#\" onClick=\"return mV('Jdg',3,28);\">Jdg 3:28</a>; <a href=\"#\" onClick=\"return mV('Jdg',12,5,6);\">12:5-6</a>), which must have been very numerous; about fifty perhaps. The most notable was that of Bethabara. Mention is also made of the ford of the Jabbok (<a href=\"#\" onClick=\"return mV('Gen',32,22);\">Gen 32:22</a>), and of the fords of Arnon (<a href=\"#\" onClick=\"return mV('Isa',16,2);\">Isa 16:2</a>) and of the Euphrates (<a href=\"#\" onClick=\"return mV('Jer',51,32);\">Jer 51:32</a>).";
eastonArray["$$T0001370"] = "<strong>Forehead:</strong> The practice common among Oriental nations of colouring the forehead or impressing on it some distinctive mark as a sign of devotion to some deity is alluded to in <a href=\"#\" onClick=\"return mV('Rev',13,16,17);\">Rev 13:16-17</a>; <a href=\"#\" onClick=\"return mV('Rev',14,9);\">14:9</a>; <a href=\"#\" onClick=\"return mV('Rev',17,5);\">17:5</a>; <a href=\"#\" onClick=\"return mV('Rev',20,4);\">20:4</a>.<br><br>The \"jewel on thy forehead\" mentioned in <a href=\"#\" onClick=\"return mV('Eze',16,12);\">Eze 16:12</a> (R.V., \"a ring upon thy nose\") was in all probability the \"nose-ring\" (<a href=\"#\" onClick=\"return mV('Isa',3,21);\">Isa 3:21</a>).<br><br>In <a href=\"#\" onClick=\"return mV('Eze',3,7);\">Eze 3:7</a> the word \"impudent\" is rightly rendered in the Revised Version \"an hard forehead.\" (See also ver. <a href=\"#\" onClick=\"return mV('Eze',3,8,9);\">8, 9</a>.)";
eastonArray["$$T0001371"] = "<strong>Foreigner:</strong> a Gentile. Such as resided among the Hebrews were required by the law to be treated with kindness (<a href=\"#\" onClick=\"return mV('Exd',22,21);\">Exd 22:21</a>; <a href=\"#\" onClick=\"return mV('Exd',23,9);\">23:9</a>; <a href=\"#\" onClick=\"return mV('Lev',19,33,34);\">Lev 19:33-34</a>; <a href=\"#\" onClick=\"return mV('Lev',23,22);\">23:22</a>; <a href=\"#\" onClick=\"return mV('Deu',14,28);\">Deu 14:28</a>; <a href=\"#\" onClick=\"return mV('Deu',16,10,11);\">16:10-11</a>; <a href=\"#\" onClick=\"return mV('Deu',24,19);\">24:19</a>). They enjoyed in many things equal rights with the native-born residents (<a href=\"#\" onClick=\"return mV('Exd',12,49);\">Exd 12:49</a>; <a href=\"#\" onClick=\"return mV('Lev',24,22);\">Lev 24:22</a>; <a href=\"#\" onClick=\"return mV('Num',15,15);\">Num 15:15</a>; <a href=\"#\" onClick=\"return mV('Num',35,15);\">35:15</a>), but were not allowed to do anything which was an abomination according to the Jewish law (<a href=\"#\" onClick=\"return mV('Exd',20,10);\">Exd 20:10</a>; <a href=\"#\" onClick=\"return mV('Lev',17,15,16);\">Lev 17:15-16</a>; <a href=\"#\" onClick=\"return mV('Lev',18,26);\">18:26</a>; <a href=\"#\" onClick=\"return mV('Lev',20,2);\">20:2</a>; <a href=\"#\" onClick=\"return mV('Lev',24,16);\">24:16</a>, etc.).";
eastonArray["$$T0001372"] = "<strong>Foreknowledge of God:</strong> <a href=\"#\" onClick=\"return mV('Act',2,23);\">Act 2:23</a>; <a href=\"#\" onClick=\"return mV('Rom',8,29);\">Rom 8:29</a>; <a href=\"#\" onClick=\"return mV('Rom',11,2);\">11:2</a>; <a href=\"#\" onClick=\"return mV('1Pe',1,2);\">1Pe 1:2</a>), one of those high attributes essentially appertaining to him the full import of which we cannot comprehend. In the most absolute sense his knowledge is infinite (<a href=\"#\" onClick=\"return mV('1Sa',23,'9-13');\">1Sa 23:9-13</a>; <a href=\"#\" onClick=\"return mV('Jer',38,'17-23');\">Jer 38:17-23</a>; <a href=\"#\" onClick=\"return mV('Mat',11,21,23);\">Mat 11:21, 23</a>; <a href=\"#\" onClick=\"return mV('Act',15,18);\">Act 15:18</a>).";
eastonArray["$$T0001373"] = "<strong>Forerunner:</strong> John the Baptist went before our Lord in this character (<a href=\"#\" onClick=\"return mV('Mar',1,2,3);\">Mar 1:2-3</a>). Christ so called (<a href=\"#\" onClick=\"return mV('Hbr',6,20);\">Hbr 6:20</a>) as entering before his people into the holy place as their head and guide.";
eastonArray["$$T0001374"] = "<strong>Forest:</strong> Heb. ya'ar, meaning a dense wood, from its luxuriance. Thus all the great primeval forests of Syria (<a href=\"#\" onClick=\"return mV('Ecc',2,6);\">Ecc 2:6</a>; <a href=\"#\" onClick=\"return mV('Isa',44,14);\">Isa 44:14</a>; <a href=\"#\" onClick=\"return mV('Jer',5,6);\">Jer 5:6</a>; <a href=\"#\" onClick=\"return mV('Mic',5,8);\">Mic 5:8</a>). The most extensive was the trans-Jordanic forest of Ephraim (<a href=\"#\" onClick=\"return mV('2Sa',18,6,8);\">2Sa 18:6, 8</a>; <a href=\"#\" onClick=\"return mV('Jos',17,15,18);\">Jos 17:15, 18</a>), which is probably the same as the wood of Ephratah (<a href=\"#\" onClick=\"return mV('Psa',132,6);\">Psa 132:6</a>), some part of the great forest of Gilead. It was in this forest that Absalom was slain by Joab. David withdrew to the forest of Hareth in the mountains of Judah to avoid the fury of Saul (<a href=\"#\" onClick=\"return mV('1Sa',22,5);\">1Sa 22:5</a>). We read also of the forest of Bethel (<a href=\"#\" onClick=\"return mV('2Ki',2,23,24);\">2Ki 2:23-24</a>), and of that which the Israelites passed in their pursuit of the Philistines (<a href=\"#\" onClick=\"return mV('1Sa',14,25);\">1Sa 14:25</a>), and of the forest of the cedars of Lebanon (<a href=\"#\" onClick=\"return mV('1Ki',4,33);\">1Ki 4:33</a>; <a href=\"#\" onClick=\"return mV('2Ki',19,23);\">2Ki 19:23</a>; <a href=\"#\" onClick=\"return mV('Hsa',14,5,6);\">Hsa 14:5-6</a>).<br><br>\"The house of the forest of Lebanon (<a href=\"#\" onClick=\"return mV('1Ki',7,2);\">1Ki 7:2</a>; <a href=\"#\" onClick=\"return mV('1Ki',10,17);\">10:17</a>; <a href=\"#\" onClick=\"return mV('2Ch',9,16);\">2Ch 9:16</a>) was probably Solomon's armoury, and was so called because the wood of its many pillars came from Lebanon, and they had the appearance of a forest. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000386');\">BAALBEC</a>.)<br><br>Heb. horesh, denoting a thicket of trees, underwood, jungle, bushes, or trees entangled, and therefore affording a safe hiding-place. place. This word is rendered \"forest\" only in <a href=\"#\" onClick=\"return mV('2Ch',27,4);\">2Ch 27:4</a>. It is also rendered \"wood\", the \"wood\" in the \"wilderness of Ziph,\" in which david concealed himself (<a href=\"#\" onClick=\"return mV('1Sa',23,15);\">1Sa 23:15</a>), which lay south-east of Hebron. In <a href=\"#\" onClick=\"return mV('Isa',17,19);\">Isa 17:19</a> this word is in Authorized Version rendered incorrectly \"bough.\"<br><br>Heb. pardes, meaning an enclosed garden or plantation. Asaph is (<a href=\"#\" onClick=\"return mV('Neh',2,8);\">Neh 2:8</a>) called the \"keeper of the king's forest.\" The same Hebrew word is used <a href=\"#\" onClick=\"return mV('Ecc',2,5);\">Ecc 2:5</a>, where it is rendered in the plural \"orchards\" (R.V., \"parks\"), and <a href=\"#\" onClick=\"return mV('Sgs',4,13);\">Sgs 4:13</a>, rendered \"orchard\" (R.V. marg., \"a paradise\").<br><br>\"The forest of the vintage\" (<a href=\"#\" onClick=\"return mV('Zec',11,2);\">Zec 11:2</a>, \"inaccessible forest,\" or R.V. \"strong forest\") is probably a figurative allusion to Jerusalem, or the verse may simply point to the devastation of the region referred to.<br><br>The forest is an image of unfruitfulness as contrasted with a cultivated field (<a href=\"#\" onClick=\"return mV('Isa',29,17);\">Isa 29:17</a>; <a href=\"#\" onClick=\"return mV('Isa',32,15);\">32:15</a>; <a href=\"#\" onClick=\"return mV('Jer',26,18);\">Jer 26:18</a>; <a href=\"#\" onClick=\"return mV('Hsa',2,12);\">Hsa 2:12</a>). Isaiah (<a href=\"#\" onClick=\"return mV('Isa',10,19,33,34);\">Isa 10:19, 33-34</a>) likens the Assyrian host under Sennacherib (q.v.) to the trees of some huge forest, to be suddenly cut down by an unseen stroke.";
eastonArray["$$T0001375"] = "<strong>Forgiveness of sin:</strong> one of the constituent parts of justification. In pardoning sin, God absolves the sinner from the condemnation of the law, and that on account of the work of Christ, i.e., he removes the guilt of sin, or the sinner's actual liability to eternal wrath on account of it. All sins are forgiven freely (<a href=\"#\" onClick=\"return mV('Act',5,31);\">Act 5:31</a>; <a href=\"#\" onClick=\"return mV('Act',13,38);\">13:38</a>; <a href=\"#\" onClick=\"return mV('1Jo',1,'6-9');\">1Jo 1:6-9</a>). The sinner is by this act of grace for ever freed from the guilt and penalty of his sins. This is the peculiar prerogative of God (<a href=\"#\" onClick=\"return mV('Psa',130,4);\">Psa 130:4</a>; <a href=\"#\" onClick=\"return mV('Mar',2,5);\">Mar 2:5</a>). It is offered to all in the gospel. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002147');\">JUSTIFICATION</a>.)";
eastonArray["$$T0001376"] = "<strong>Fornication:</strong> in every form of it was sternly condemned by the Mosaic law (<a href=\"#\" onClick=\"return mV('Lev',21,9);\">Lev 21:9</a>; <a href=\"#\" onClick=\"return mV('Lev',19,29);\">19:29</a>; <a href=\"#\" onClick=\"return mV('Deu',22,20,21,'23-29');\">Deu 22:20-21, 23-29</a>; <a href=\"#\" onClick=\"return mV('Deu',23,18);\">23:18</a>; <a href=\"#\" onClick=\"return mV('Exd',22,16);\">Exd 22:16</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000109');\">ADULTERY</a>.)<br><br>But this word is more frequently used in a symbolical than in its ordinary sense. It frequently means a forsaking of God or a following after idols (<a href=\"#\" onClick=\"return mV('Isa',1,2);\">Isa 1:2</a>; <a href=\"#\" onClick=\"return mV('Jer',2,20);\">Jer 2:20</a>; <a href=\"#\" onClick=\"return mV('Eze',16,'1-')\">Eze 16</a>; <a href=\"#\" onClick=\"return mV('Hsa',1,2);\">Hsa 1:2</a>; <a href=\"#\" onClick=\"return mV('Hsa',2,'1-5');\">2:1-5</a>; <a href=\"#\" onClick=\"return mV('Jer',3,8,9);\">Jer 3:8-9</a>).";
eastonArray["$$T0001377"] = "<strong>Fortunatus:</strong> fortunate, a disciple of Corinth who visited Paul at Ephesus, and returned with Stephanas and Achaicus, the bearers of the apostle's first letter to the Corinthians (<a href=\"#\" onClick=\"return mV('1Cr',16,17);\">1Cr 16:17</a>).";
eastonArray["$$T0001378"] = "<strong>Fountain:</strong> (Heb. 'ain; i.e., \"eye\" of the water desert), a natural source of living water. Palestine was a \"land of brooks of water, of fountains, and depths that spring out of valleys and hills\" (<a href=\"#\" onClick=\"return mV('Deu',8,7);\">Deu 8:7</a>; <a href=\"#\" onClick=\"return mV('Deu',11,11);\">11:11</a>).<br><br>These fountains, bright sparkling \"eyes\" of the desert, are remarkable for their abundance and their beauty, especially on the west of Jordan. All the perennial rivers and streams of the country are supplied from fountains, and depend comparatively little on surface water. \"Palestine is a country of mountains and hills, and it abounds in fountains of water. The murmur of these waters is heard in every dell, and the luxuriant foliage which surrounds them is seen in every plain.\" Besides its rain-water, its cisterns and fountains, Jerusalem had also an abundant supply of water in the magnificent reservoir called \"Solomon's Pools\" (q.v.), at the head of the Urtas valley, whence it was conveyed to the city by subterrean channels some 10 miles in length. These have all been long ago destroyed, so that no water from the \"Pools\" now reaches Jerusalem. Only one fountain has been discovered at Jerusalem, the so-called \"Virgins's Fountains,\" in the valley of Kidron; and only one well (Heb. beer), the Bir Eyub, also in the valley of Kidron, south of the King's Gardens, which has been dug through the solid rock. The inhabitants of Jerusalem are now mainly dependent on the winter rains, which they store in cisterns. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003803');\">WELL</a>.)";
eastonArray["$$T0001379"] = "<strong>Fountain of the Virgin:</strong> the perennial source from which the Pool of Siloam (q.v.) is supplied, the waters flowing in a copious stream to it through a tunnel cut through the rock, the actual length of which is 1,750 feet. The spring rises in a cave 20 feet by 7. A serpentine tunnel 67 feet long runs from it toward the left, off which the tunnel to the Pool of Siloam branches. It is the only unfailing fountain in Jerusalem.<br><br>The fountain received its name from the \"fantastic legend\" that here the virgin washed the swaddling-clothes of our Lord.<br><br>This spring has the singular characteristic of being intermittent, flowing from three to five times daily in winter, twice daily in summer, and only once daily in autumn. This peculiarity is accounted for by the supposition that the outlet from the reservoir is by a passage in the form of a siphon.";
eastonArray["$$T0001380"] = "<strong>Fowler:</strong> the arts of, referred to <a href=\"#\" onClick=\"return mV('Psa',91,3);\">Psa 91:3</a>; <a href=\"#\" onClick=\"return mV('Psa',124,7);\">124:7</a>; <a href=\"#\" onClick=\"return mV('Pro',6,5);\">Pro 6:5</a>; <a href=\"#\" onClick=\"return mV('Jer',5,26);\">Jer 5:26</a>; <a href=\"#\" onClick=\"return mV('Hsa',9,8);\">Hsa 9:8</a>; <a href=\"#\" onClick=\"return mV('Eze',17,20);\">Eze 17:20</a>; <a href=\"#\" onClick=\"return mV('Ecc',9,12);\">Ecc 9:12</a>. Birds of all kinds abound in Palestine, and the capture of these for the table and for other uses formed the employment of many persons. The traps and snares used for this purpose are mentioned <a href=\"#\" onClick=\"return mV('Hsa',5,1);\">Hsa 5:1</a>; <a href=\"#\" onClick=\"return mV('Pro',7,23);\">Pro 7:23</a>; <a href=\"#\" onClick=\"return mV('Pro',22,5);\">22:5</a>; <a href=\"#\" onClick=\"return mV('Amo',3,5);\">Amo 3:5</a>; <a href=\"#\" onClick=\"return mV('Psa',69,22);\">Psa 69:22</a>; comp. <a href=\"#\" onClick=\"return mV('Deu',22,6,7);\">Deu 22:6-7</a>.";
eastonArray["$$T0001381"] = "<strong>Fox:</strong> (Heb. shu'al, a name derived from its digging or burrowing under ground), the Vulpes thaleb, or Syrian fox, the only species of this animal indigenous to Palestine. It burrows, is silent and solitary in its habits, is destructive to vineyards, being a plunderer of ripe grapes (<a href=\"#\" onClick=\"return mV('Sgs',2,15);\">Sgs 2:15</a>). The Vulpes Niloticus, or Egyptian dog-fox, and the Vulpes vulgaris, or common fox, are also found in Palestine.<br><br>The proverbial cunning of the fox is alluded to in <a href=\"#\" onClick=\"return mV('Eze',13,4);\">Eze 13:4</a>, and in <a href=\"#\" onClick=\"return mV('Luk',13,32);\">Luk 13:32</a>, where our Lord calls Herod \"that fox.\" In <a href=\"#\" onClick=\"return mV('Jdg',15,4,5);\">Jdg 15:4-5</a>, the reference is in all probability to the jackal. The Hebrew word <i>shu'al</i> through the Persian <i>schagal</i> becomes our jackal (<i>Canis aureus</i>), so that the word may bear that signification here. The reasons for preferring the rendering \"jackal\" are (1) that it is more easily caught than the fox; (2) that the fox is shy and suspicious, and flies mankind, while the jackal does not; and (3) that foxes are difficult, jackals comparatively easy, to treat in the way here described. Jackals hunt in large numbers, and are still very numerous in Southern Palestine.";
eastonArray["$$T0001382"] = "<strong>Frankincense:</strong> (Heb. lebonah; Gr. libanos, i.e., \"white\"), an odorous resin imported from Arabia (<a href=\"#\" onClick=\"return mV('Isa',60,6);\">Isa 60:6</a>; <a href=\"#\" onClick=\"return mV('Jer',6,20);\">Jer 6:20</a>), yet also growing in Palestine (<a href=\"#\" onClick=\"return mV('Sgs',4,14);\">Sgs 4:14</a>). It was one of the ingredients in the perfume of the sanctuary (<a href=\"#\" onClick=\"return mV('Exd',30,34);\">Exd 30:34</a>), and was used as an accompaniment of the meat-offering (<a href=\"#\" onClick=\"return mV('Lev',2,1,16);\">Lev 2:1, 16</a>; <a href=\"#\" onClick=\"return mV('Lev',6,15);\">6:15</a>; <a href=\"#\" onClick=\"return mV('Lev',24,7);\">24:7</a>). When burnt it emitted a fragrant odour, and hence the incense became a symbol of the Divine name (<a href=\"#\" onClick=\"return mV('Mal',1,11);\">Mal 1:11</a>; <a href=\"#\" onClick=\"return mV('Sgs',1,3);\">Sgs 1:3</a>) and an emblem of prayer (<a href=\"#\" onClick=\"return mV('Psa',141,2);\">Psa 141:2</a>; <a href=\"#\" onClick=\"return mV('Luk',1,10);\">Luk 1:10</a>; <a href=\"#\" onClick=\"return mV('Rev',5,8);\">Rev 5:8</a>; <a href=\"#\" onClick=\"return mV('Rev',8,3);\">8:3</a>).<br><br>This frankincense, or olibanum, used by the Jews in the temple services is not to be confounded with the frankincense of modern commerce, which is an exudation of the Norway spruce fir, the <i>Pinus abies</i>. It was probably a resin from the Indian tree known to botanists by the name of <i>Boswellia serrata</i> or <i>thurifera</i>, which grows to the height of forty feet.";
eastonArray["$$T0001383"] = "<strong>Freedom:</strong> The law of Moses pointed out the cases in which the servants of the Hebrews were to receive their freedom (<a href=\"#\" onClick=\"return mV('Exd',21,'2-4',7,8);\">Exd 21:2-4, 7-8</a>; <a href=\"#\" onClick=\"return mV('Lev',25,'39-42','47-55');\">Lev 25:39-42, 47-55</a>; <a href=\"#\" onClick=\"return mV('Deu',15,'12-18');\">Deu 15:12-18</a>). Under the Roman law the \"freeman\" (ingenuus) was one born free; the \"freedman\" (libertinus) was a manumitted slave, and had not equal rights with the freeman (<a href=\"#\" onClick=\"return mV('Act',22,28);\">Act 22:28</a>; <a href=\"#\" onClick=\"return mV('Act',16,'37-39');\">Act 16:37-39</a>; <a href=\"#\" onClick=\"return mV('Act',21,39);\">21:39</a>; <a href=\"#\" onClick=\"return mV('Act',22,25);\">22:25</a>; <a href=\"#\" onClick=\"return mV('Act',25,11,12);\">25:11-12</a>).";
eastonArray["$$T0001384"] = "<strong>Free-will offering:</strong> a spontaneous gift (<a href=\"#\" onClick=\"return mV('Exd',35,29);\">Exd 35:29</a>), a voluntary sacrifice (<a href=\"#\" onClick=\"return mV('Lev',22,23);\">Lev 22:23</a>; <a href=\"#\" onClick=\"return mV('Ezr',3,5);\">Ezr 3:5</a>), as opposed to one in consequence of a vow, or in expiation of some offence.";
eastonArray["$$T0001385"] = "<strong>Frog:</strong> (Heb. tsepharde'a, meaning a \"marsh-leaper\"). This reptile is mentioned in the Old Testament only in connection with one of the plagues which fell on the land of Egypt (<a href=\"#\" onClick=\"return mV('Exd',8,'2-14');\">Exd 8:2-14</a>; <a href=\"#\" onClick=\"return mV('Psa',78,45);\">Psa 78:45</a>; <a href=\"#\" onClick=\"return mV('Psa',105,30);\">105:30</a>).<br><br>In the New Testament this word occurs only in <a href=\"#\" onClick=\"return mV('Rev',16,13);\">Rev 16:13</a>, where it is referred to as a symbol of uncleanness. The only species of frog existing in Palestine is the green frog (Rana esculenta), the well-known edible frog of the Continent.";
eastonArray["$$T0001386"] = "<strong>Frontlets:</strong> occurs only in <a href=\"#\" onClick=\"return mV('Exd',13,16);\">Exd 13:16</a>; <a href=\"#\" onClick=\"return mV('Deu',6,8);\">Deu 6:8</a>, and <a href=\"#\" onClick=\"return mV('Deu',11,18);\">Deu 11:18</a>. The meaning of the injunction to the Israelites, with regard to the statues and precepts given them, that they should \"bind them for a sign upon their hand, and have them as frontlets between their eyes,\" was that they should keep them distinctly in view and carefully attend to them. But soon after their return from Babylon they began to interpret this injunction literally, and had accordingly portions of the law written out and worn about their person. These they called tephillin, i.e., \"prayers.\" The passages so written out on strips of parchment were these, <a href=\"#\" onClick=\"return mV('Exd',12,'2-10');\">Exd 12:2-10</a>; <a href=\"#\" onClick=\"return mV('Exd',13,'11-21');\">13:11-21</a>; <a href=\"#\" onClick=\"return mV('Deu',6,'4-9');\">Deu 6:4-9</a>; <a href=\"#\" onClick=\"return mV('Deu',11,'18-21');\">11:18-21</a>. They were then \"rolled up in a case of black calfskin, which was attached to a stiffer piece of leather, having a thong one finger broad and one cubit and a half long. Those worn on the forehead were written on four strips of parchment, and put into four little cells within a square case, which had on it the Hebrew letter called shin, the three points of which were regarded as an emblem of God.\" This case tied around the forehead in a particular way was called \"the tephillah on the head.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0002947');\">PHYLACTERY</a>.)";
eastonArray["$$T0001387"] = "<strong>Frost:</strong> (Heb. kerah, from its smoothness) <a href=\"#\" onClick=\"return mV('Job',37,10);\">Job 37:10</a> (R.V., \"ice\"); <a href=\"#\" onClick=\"return mV('Gen',31,40);\">Gen 31:40</a>; <a href=\"#\" onClick=\"return mV('Jer',36,30);\">Jer 36:30</a>; rendered \"ice\" in <a href=\"#\" onClick=\"return mV('Job',6,16);\">Job 6:16</a>; <a href=\"#\" onClick=\"return mV('Job',38,29);\">38:29</a>; and \"crystal\" in <a href=\"#\" onClick=\"return mV('Eze',1,22);\">Eze 1:22</a>. \"At the present day frost is entirely unknown in the lower portions of the valley of the Jordan, but slight frosts are sometimes felt on the sea-coast and near Lebanon.\" Throughout Western Asia cold frosty nights are frequently succeeded by warm days.<br><br>\"Hoar frost\" (Heb. kephor, so called from its covering the ground) is mentioned in <a href=\"#\" onClick=\"return mV('Exd',16,14);\">Exd 16:14</a>; <a href=\"#\" onClick=\"return mV('Job',38,29);\">Job 38:29</a>; <a href=\"#\" onClick=\"return mV('Psa',147,16);\">Psa 147:16</a>.<br><br>In <a href=\"#\" onClick=\"return mV('Psa',78,47);\">Psa 78:47</a> the word rendered \"frost\" (R.V. marg., \"great hail-stones\"), <i>hanamal</i>, occurs only there. It is rendered by Gesenius, the Hebrew lexicographer, \"ant,\" and so also by others, but the usual interpretation derived from the ancient versions may be maintained.";
eastonArray["$$T0001388"] = "<strong>Fruit:</strong> a word as used in Scripture denoting produce in general, whether vegetable or animal. The Hebrews divided the fruits of the land into three classes:,<br><br>(1.) The fruit of the field, \"corn-fruit\" (Heb. dagan); all kinds of grain and pulse.<br><br>(2.) The fruit of the vine, \"vintage-fruit\" (Heb. tirosh); grapes, whether moist or dried.<br><br>(3.) \"Orchard-fruits\" (Heb. yitshar), as dates, figs, citrons, etc.<br><br>Injunctions concerning offerings and tithes were expressed by these Hebrew terms alone (<a href=\"#\" onClick=\"return mV('Num',18,12);\">Num 18:12</a>; <a href=\"#\" onClick=\"return mV('Deu',14,23);\">Deu 14:23</a>). This word \"fruit\" is also used of children or offspring (<a href=\"#\" onClick=\"return mV('Gen',30,2);\">Gen 30:2</a>; <a href=\"#\" onClick=\"return mV('Deu',7,13);\">Deu 7:13</a>; <a href=\"#\" onClick=\"return mV('Luk',1,42);\">Luk 1:42</a>; <a href=\"#\" onClick=\"return mV('Psa',21,10);\">Psa 21:10</a>; <a href=\"#\" onClick=\"return mV('Psa',132,11);\">132:11</a>); also of the progeny of beasts (<a href=\"#\" onClick=\"return mV('Deu',28,51);\">Deu 28:51</a>; <a href=\"#\" onClick=\"return mV('Isa',14,29);\">Isa 14:29</a>).<br><br>It is used metaphorically in a variety of forms (<a href=\"#\" onClick=\"return mV('Psa',104,13);\">Psa 104:13</a>; <a href=\"#\" onClick=\"return mV('Pro',1,31);\">Pro 1:31</a>; <a href=\"#\" onClick=\"return mV('Pro',11,30);\">11:30</a>; <a href=\"#\" onClick=\"return mV('Pro',31,16);\">31:16</a>; <a href=\"#\" onClick=\"return mV('Isa',3,10);\">Isa 3:10</a>; <a href=\"#\" onClick=\"return mV('Isa',10,12);\">10:12</a>; <a href=\"#\" onClick=\"return mV('Mat',3,8);\">Mat 3:8</a>; <a href=\"#\" onClick=\"return mV('Mat',21,41);\">21:41</a>; <a href=\"#\" onClick=\"return mV('Mat',26,29);\">26:29</a>; <a href=\"#\" onClick=\"return mV('Hbr',13,15);\">Hbr 13:15</a>; <a href=\"#\" onClick=\"return mV('Rom',7,4,5);\">Rom 7:4-5</a>; <a href=\"#\" onClick=\"return mV('Rom',15,28);\">15:28</a>).<br><br>The fruits of the Spirit (<a href=\"#\" onClick=\"return mV('Gal',5,22,23);\">Gal 5:22-23</a>; <a href=\"#\" onClick=\"return mV('Eph',5,9);\">Eph 5:9</a>; <a href=\"#\" onClick=\"return mV('Jam',3,17,18);\">Jam 3:17-18</a>) are those gracious dispositions and habits which the Spirit produces in those in whom he dwells and works.";
eastonArray["$$T0001389"] = "<strong>Frying-pan:</strong> (Heb. marhesheth, a \"boiler\"), a pot for boiling meat (<a href=\"#\" onClick=\"return mV('Lev',2,7);\">Lev 2:7</a>; <a href=\"#\" onClick=\"return mV('Lev',7,9);\">7:9</a>).";
eastonArray["$$T0001390"] = "<strong>Fuel:</strong> Almost every kind of combustible matter was used for fuel, such as the withered stalks of herbs (<a href=\"#\" onClick=\"return mV('Mat',6,30);\">Mat 6:30</a>), thorns (<a href=\"#\" onClick=\"return mV('Psa',58,9);\">Psa 58:9</a>; <a href=\"#\" onClick=\"return mV('Ecc',7,6);\">Ecc 7:6</a>), animal excrements (<a href=\"#\" onClick=\"return mV('Eze',4,'12-15');\">Eze 4:12-15</a>; <a href=\"#\" onClick=\"return mV('Eze',15,4,6);\">15:4, 6</a>; <a href=\"#\" onClick=\"return mV('Eze',21,32);\">21:32</a>). Wood or charcoal is much used still in all the towns of Syria and Egypt. It is largely brought from the region of Hebron to Jerusalem. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000851');\">COAL</a>.)";
eastonArray["$$T0001391"] = "<strong>Fugitive:</strong> <a href=\"#\" onClick=\"return mV('Gen',4,12,14);\">Gen 4:12, 14</a>, a rover or wanderer (Heb. n'a); <a href=\"#\" onClick=\"return mV('Jdg',12,4);\">Jdg 12:4</a>, a refugee, one who has escaped (Heb. palit); <a href=\"#\" onClick=\"return mV('2Ki',25,11);\">2Ki 25:11</a>, a deserter, one who has fallen away to the enemy (Heb. nophel); <a href=\"#\" onClick=\"return mV('Eze',17,21);\">Eze 17:21</a>, one who has broken away in flight (Heb. mibrah); <a href=\"#\" onClick=\"return mV('Isa',15,5);\">Isa 15:5</a>; <a href=\"#\" onClick=\"return mV('Isa',43,14);\">43:14</a>, a breaker away, a fugitive (Heb. beriah), one who flees away.";
eastonArray["$$T0001392"] = "<strong>Fuller:</strong> The word \"full\" is from the Anglo-Saxon fullian, meaning \"to whiten.\" To full is to press or scour cloth in a mill. This art is one of great antiquity. Mention is made of \"fuller's soap\" (<a href=\"#\" onClick=\"return mV('Mal',3,2);\">Mal 3:2</a>), and of \"the fuller's field\" (<a href=\"#\" onClick=\"return mV('2Ki',18,17);\">2Ki 18:17</a>). At his transfiguration our Lord's rainment is said to have been white \"so as no fuller on earth could white them\" (<a href=\"#\" onClick=\"return mV('Mar',9,3);\">Mar 9:3</a>). En-rogel (q.v.), meaning literally \"foot-fountain,\" has been interpreted as the \"fuller's fountain,\" because there the fullers trod the cloth with their feet.";
eastonArray["$$T0001393"] = "<strong>Fuller's field:</strong> a spot near Jerusalem (<a href=\"#\" onClick=\"return mV('2Ki',18,17);\">2Ki 18:17</a>; <a href=\"#\" onClick=\"return mV('Isa',36,2);\">Isa 36:2</a>; <a href=\"#\" onClick=\"return mV('Isa',7,3);\">7:3</a>), on the side of the highway west of the city, not far distant from the \"upper pool\" at the head of the valley of Hinnom. Here the fullers pursued their occupation.";
eastonArray["$$T0001394"] = "<strong>Fuller's soap:</strong> (Heb. borith mekabbeshim, i.e., \"alkali of those treading cloth\"). Mention is made (<a href=\"#\" onClick=\"return mV('Pro',25,20);\">Pro 25:20</a>; <a href=\"#\" onClick=\"return mV('Jer',2,22);\">Jer 2:22</a>) of nitre and also (<a href=\"#\" onClick=\"return mV('Mal',3,2);\">Mal 3:2</a>) of soap (Heb. borith) used by the fuller in his operations. Nitre is found in Syria, and vegetable alkali was obtained from the ashes of certain plants. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003467');\">SOAP</a>.)";
eastonArray["$$T0001395"] = "<strong>Fulness:</strong><br><br>(1.) Of time (<a href=\"#\" onClick=\"return mV('Gal',4,4);\">Gal 4:4</a>), the time appointed by God, and foretold by the prophets, when Messiah should appear.<br><br>(2.) Of Christ (<a href=\"#\" onClick=\"return mV('Jhn',1,16);\">Jhn 1:16</a>), the superabundance of grace with which he was filled.<br><br>(3.) Of the Godhead bodily dwelling in Christ (<a href=\"#\" onClick=\"return mV('Col',2,9);\">Col 2:9</a>), i.e., the whole nature and attributes of God are in Christ.<br><br>(4.) <a href=\"#\" onClick=\"return mV('Eph',1,23);\">Eph 1:23</a>, the church as the fulness of Christ, i.e., the church makes Christ a complete and perfect head.";
eastonArray["$$T0001396"] = "<strong>Funeral:</strong> Burying was among the Jews the only mode of disposing of corpses (<a href=\"#\" onClick=\"return mV('Gen',23,19);\">Gen 23:19</a>; <a href=\"#\" onClick=\"return mV('Gen',25,9);\">25:9</a>; <a href=\"#\" onClick=\"return mV('Gen',35,8,9);\">35:8-9</a>, etc.).<br><br>The first traces of burning the dead are found in <a href=\"#\" onClick=\"return mV('1Sa',31,12);\">1Sa 31:12</a>. The burning of the body was affixed by the law of Moses as a penalty to certain crimes (<a href=\"#\" onClick=\"return mV('Lev',20,14);\">Lev 20:14</a>; <a href=\"#\" onClick=\"return mV('Lev',21,9);\">21:9</a>).<br><br>To leave the dead unburied was regarded with horror (<a href=\"#\" onClick=\"return mV('1Ki',13,22);\">1Ki 13:22</a>; <a href=\"#\" onClick=\"return mV('1Ki',14,11);\">14:11</a>; <a href=\"#\" onClick=\"return mV('1Ki',16,4);\">16:4</a>; <a href=\"#\" onClick=\"return mV('1Ki',21,24);\">21:24</a>, etc.).<br><br>In the earliest times of which we have record kinsmen carried their dead to the grave (<a href=\"#\" onClick=\"return mV('Gen',25,9);\">Gen 25:9</a>; <a href=\"#\" onClick=\"return mV('Gen',35,29);\">35:29</a>; <a href=\"#\" onClick=\"return mV('Jdg',16,31);\">Jdg 16:31</a>), but in later times this was done by others (<a href=\"#\" onClick=\"return mV('Amo',6,16);\">Amo 6:16</a>).<br><br>Immediately after decease the body was washed, and then wrapped in a large cloth (<a href=\"#\" onClick=\"return mV('Act',9,37);\">Act 9:37</a>; <a href=\"#\" onClick=\"return mV('Mat',27,59);\">Mat 27:59</a>; <a href=\"#\" onClick=\"return mV('Mar',15,46);\">Mar 15:46</a>). In the case of persons of distinction, aromatics were laid on the folds of the cloth (<a href=\"#\" onClick=\"return mV('Jhn',19,39);\">Jhn 19:39</a>; <a href=\"#\" onClick=\"return mV('Jhn',12,7);\">Jhn 12:7</a>).<br><br>As a rule the burial (q.v.) took place on the very day of the death (<a href=\"#\" onClick=\"return mV('Act',5,6,10);\">Act 5:6, 10</a>), and the body was removed to the grave in an open coffin or on a bier (<a href=\"#\" onClick=\"return mV('Luk',7,14);\">Luk 7:14</a>). After the burial a funeral meal was usually given (<a href=\"#\" onClick=\"return mV('2Sa',3,35);\">2Sa 3:35</a>; <a href=\"#\" onClick=\"return mV('Jer',16,5,7);\">Jer 16:5, 7</a>; <a href=\"#\" onClick=\"return mV('Hsa',9,4);\">Hsa 9:4</a>).";
eastonArray["$$T0001397"] = "<strong>Furlong:</strong> a stadium, a Greek measure of distance equal to 606 feet and 9 inches (<a href=\"#\" onClick=\"return mV('Luk',24,13);\">Luk 24:13</a>; <a href=\"#\" onClick=\"return mV('Jhn',6,19);\">Jhn 6:19</a>; <a href=\"#\" onClick=\"return mV('Jhn',11,18);\">11:18</a>; <a href=\"#\" onClick=\"return mV('Rev',14,20);\">Rev 14:20</a>; <a href=\"#\" onClick=\"return mV('Rev',21,16);\">21:16</a>).";
eastonArray["$$T0001398"] = "<strong>Furnace:</strong><br><br>(1.) Chald. attun, a large furnace with a wide open mouth, at the top of which materials were cast in (<a href=\"#\" onClick=\"return mV('Dan',3,22,23);\">Dan 3:22-23</a>; <a href=\"#\" onClick=\"return mV('Jer',29,22);\">Jer 29:22</a>). This furnace would be in constant requisition, for the Babylonians disposed of their dead by cremation, as did also the Accadians who invaded Mesopotamia.<br><br>(2.) Heb. kibshan, a smelting furnace (<a href=\"#\" onClick=\"return mV('Gen',19,28);\">Gen 19:28</a>), also a lime-kiln (<a href=\"#\" onClick=\"return mV('Isa',33,12);\">Isa 33:12</a>; <a href=\"#\" onClick=\"return mV('Amo',2,1);\">Amo 2:1</a>).<br><br>(3.) Heb. kur, a refining furnace (<a href=\"#\" onClick=\"return mV('Pro',17,3);\">Pro 17:3</a>; <a href=\"#\" onClick=\"return mV('Pro',27,21);\">27:21</a>; <a href=\"#\" onClick=\"return mV('Eze',22,18);\">Eze 22:18</a>).<br><br>(4.) Heb. alil, a crucible; only used in <a href=\"#\" onClick=\"return mV('Psa',12,6);\">Psa 12:6</a>.<br><br>(5.) Heb. tannur, oven for baking bread (<a href=\"#\" onClick=\"return mV('Gen',15,17);\">Gen 15:17</a>; <a href=\"#\" onClick=\"return mV('Isa',31,9);\">Isa 31:9</a>; <a href=\"#\" onClick=\"return mV('Neh',3,11);\">Neh 3:11</a>). It was a large pot, narrowing towards the top. When it was heated by a fire made within, the dough was spread over the heated surface, and thus was baked. \"A smoking furnace and a burning lamp\" (<a href=\"#\" onClick=\"return mV('Gen',15,17);\">Gen 15:17</a>), the symbol of the presence of the Almighty, passed between the divided pieces of Abraham's sacrifice in ratification of the covenant God made with him. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002814');\">OVEN</a>.)<br><br>(6.) Gr. kamnos, a furnace, kiln, or oven (<a href=\"#\" onClick=\"return mV('Mat',13,42,50);\">Mat 13:42, 50</a>; <a href=\"#\" onClick=\"return mV('Rev',1,15);\">Rev 1:15</a>; <a href=\"#\" onClick=\"return mV('Rev',9,2);\">9:2</a>).";
eastonArray["$$T0001399"] = "<strong>Furrow:</strong> an opening in the ground made by the plough (<a href=\"#\" onClick=\"return mV('Psa',65,10);\">Psa 65:10</a>; <a href=\"#\" onClick=\"return mV('Hsa',10,4,10);\">Hsa 10:4, 10</a>).";
