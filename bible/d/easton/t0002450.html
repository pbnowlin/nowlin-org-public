<script>var eastonArray = new Array ();
eastonArray["$$T0002450"] = "<strong>Meah:</strong> an hundred, a tower in Jersalem on the east wall (<a href=\"#\" onClick=\"return mV('Neh',3,1);\">Neh 3:1</a>) in the time of Nehemiah.";
eastonArray["$$T0002451"] = "<strong>Meals:</strong> are at the present day \"eaten from a round table little higher than a stool, guests sitting cross-legged on mats or small carpets in a circle, and dipping their fingers into one large dish heaped with a mixture of boiled rice and other grain and meat. But in the time of our Lord, and perhaps even from the days of Amos (<a href=\"#\" onClick=\"return mV('Amo',6,4,7);\">Amo 6:4, 7</a>), the foreign custom had been largely introduced of having broad couches, forming three sides of a small square, the guests reclining at ease on their elbows during meals, with their faces to the space within, up and down which servants passed offering various dishes, or in the absence of servants, helping themselves from dishes laid on a table set between the couches.\" Geikie's Life of Christ. (<a href=\"#\" onClick=\"return mV('Luk',7,'36-50');\">Luk 7:36-50</a>.) (See <a href=\"#\" onClick=\"return doDictLookup('ET0000055');\">ABRAHAM'S BOSOM</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0000434');\">BANQUET</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0001318');\">FEAST</a>.)";
eastonArray["$$T0002452"] = "<strong>Mearah:</strong> a cave, a place in the northern boundary of Palestine (<a href=\"#\" onClick=\"return mV('Jos',13,4);\">Jos 13:4</a>). This may be the cave of Jezzin in Lebanon, 10 miles east of Sidon, on the Damascus road; or probably, as others think, Mogheirizeh, north-east of Sidon.";
eastonArray["$$T0002453"] = "<strong>Measure:</strong> Several words are so rendered in the Authorized Version.<br><br>(1.) Those which are indefinite.<br><br>(a) Hok, <a href=\"#\" onClick=\"return mV('Isa',5,14);\">Isa 5:14</a>, elsewhere \"statute.\"<br><br>(b) Mad, <a href=\"#\" onClick=\"return mV('Job',11,9);\">Job 11:9</a>; <a href=\"#\" onClick=\"return mV('Jer',13,25);\">Jer 13:25</a>, elsewhere \"garment.\" <br><br>(c) Middah, the word most frequently thus translated, <a href=\"#\" onClick=\"return mV('Exd',26,2,8);\">Exd 26:2, 8</a>, etc.<br><br>(d) Mesurah, <a href=\"#\" onClick=\"return mV('Lev',19,35);\">Lev 19:35</a>; <a href=\"#\" onClick=\"return mV('1Ch',23,29);\">1Ch 23:29</a>.<br><br>(e) Mishpat, <a href=\"#\" onClick=\"return mV('Jer',30,11);\">Jer 30:11</a>, elsewhere \"judgment.\"<br><br>(f) Mithkoneth and token, <a href=\"#\" onClick=\"return mV('Eze',45,11);\">Eze 45:1</a><br><br>(g) In New Testament metron, the usual Greek word thus rendered (<a href=\"#\" onClick=\"return mV('Mat',7,2);\">Mat 7:2</a>; <a href=\"#\" onClick=\"return mV('Mat',23,32);\">23:32</a>; <a href=\"#\" onClick=\"return mV('Mar',4,24);\">Mar 4:24</a>).<br><br>(2.) Those which are definite.<br><br>(a) 'Eyphah, <a href=\"#\" onClick=\"return mV('Deu',25,14,15);\">Deu 25:14-15</a>, usually \"ephah.\"<br><br>(b) Ammah, <a href=\"#\" onClick=\"return mV('Jer',51,13);\">Jer 51:13</a>, usually \"cubit.\"<br><br>(c) Kor, <a href=\"#\" onClick=\"return mV('1Ki',4,22);\">1Ki 4:22</a>, elsewhere \"cor;\" Greek koros, <a href=\"#\" onClick=\"return mV('Luk',16,7);\">Luk 16:7</a>.<br><br>(d) Seah, <a href=\"#\" onClick=\"return mV('Gen',18,6);\">Gen 18:6</a>; <a href=\"#\" onClick=\"return mV('1Sa',25,18);\">1Sa 25:18</a>, a seah; Greek saton, <a href=\"#\" onClick=\"return mV('Mat',13,33);\">Mat 13:33</a>; <a href=\"#\" onClick=\"return mV('Luk',13,21);\">Luk 13:21</a>.<br><br>(e) Shalish, \"a great measure,\" <a href=\"#\" onClick=\"return mV('Isa',40,12);\">Isa 40:12</a>; literally a third, i.e., of an ephah.<br><br>(f) In New Testament batos, <a href=\"#\" onClick=\"return mV('Luk',16,6);\">Luk 16:6</a>, the Hebrew \"bath;\" and choinix, <a href=\"#\" onClick=\"return mV('Rev',6,6);\">Rev 6:6</a>, the choenix, equal in dry commodities to one-eighth of a modius.";
eastonArray["$$T0002454"] = "<strong>Meat-offering:</strong> (Heb. minhah), originally a gift of any kind. This Hebrew word came latterly to denote an \"unbloody\" sacrifice, as opposed to a \"bloody\" sacrifice. A \"drink-offering\" generally accompanied it. The law regarding it is given in <a href=\"#\" onClick=\"return mV('Lev',2,'1-');\">Lev 2</a>, and <a href=\"#\" onClick=\"return mV('Lev',6,'14-23');\">Lev 6:14-23</a>. It was a recognition of the sovereignty of God and of his bounty in giving all earthly blessings (<a href=\"#\" onClick=\"return mV('1Ch',29,'10-14');\">1Ch 29:10-14</a>; <a href=\"#\" onClick=\"return mV('Deu',26,'5-11');\">Deu 26:5-11</a>). It was an offering which took for granted and was based on the offering for sin. It followed the sacrifice of blood. It was presented every day with the burnt-offering (<a href=\"#\" onClick=\"return mV('Exd',29,40,41);\">Exd 29:40-41</a>), and consisted of flour or of cakes prepared in a special way with oil and frankincense.";
eastonArray["$$T0002455"] = "<strong>Mebunnai:</strong> construction, building of Jehovah, one of David's bodyguard (<a href=\"#\" onClick=\"return mV('2Sa',23,27);\">2Sa 23:27</a>; <a href=\"#\" onClick=\"return mV('2Sa',21,18);\">2Sa 21:18</a>); called Sibbechai and Sibbecai (<a href=\"#\" onClick=\"return mV('1Ch',11,29);\">1Ch 11:29</a>; <a href=\"#\" onClick=\"return mV('1Ch',27,11);\">27:11</a>).";
eastonArray["$$T0002456"] = "<strong>Medad:</strong> love, one of the elders nominated to assist Moses in the government of the people. He and Eldad \"prophesied in the camp\" (<a href=\"#\" onClick=\"return mV('Num',11,'24-29');\">Num 11:24-29</a>).";
eastonArray["$$T0002457"] = "<strong>Medan:</strong> contention, the third son of Abraham by Keturah (<a href=\"#\" onClick=\"return mV('Gen',25,2);\">Gen 25:2</a>).";
eastonArray["$$T0002458"] = "<strong>Mede:</strong> (Heb. Madai), a Median or inhabitant of Media (<a href=\"#\" onClick=\"return mV('Dan',11,1);\">Dan 11:1</a>). In <a href=\"#\" onClick=\"return mV('Gen',10,2);\">Gen 10:2</a> the Hebrew word occurs in the list of the sons of Japheth. But probably this is an ethnic and not a personal name, and denotes simply the Medes as descended from Japheth.";
eastonArray["$$T0002459"] = "<strong>Medeba:</strong> waters of quiet, an ancient Moabite town (<a href=\"#\" onClick=\"return mV('Num',21,30);\">Num 21:30</a>). It was assigned to the tribe of Reuben (<a href=\"#\" onClick=\"return mV('Jos',13,16);\">Jos 13:16</a>). Here was fought the great battle in which Joab defeated the Ammonites and their allies (<a href=\"#\" onClick=\"return mV('1Ch',19,'7-15');\">1Ch 19:7-15</a>; <a href=\"#\" onClick=\"return mV('2Sa',10,'6-14');\">2Sa 10:6-14</a>). In the time of Isaiah (<a href=\"#\" onClick=\"return mV('Isa',15,2);\">Isa 15:2</a>) the Moabites regained possession of it from the Ammonites. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001632');\">HANUN</a>.)<br><br>The ruins of this important city, now Madeba or Madiyabah, are seen about 8 miles south-west of Heshbon, and 14 east of the Dead Sea. Among these are the ruins of what must have been a large temple, and of three cisterns of considerable extent, which are now dry. These cisterns may have originated the name Medeba, \"waters of quiet.\" (See  <a href=\"#\" onClick=\"return doDictLookup('ET0002785');\">OMRI</a>.)";
eastonArray["$$T0002460"] = "<strong>Media:</strong> Heb. Madai, which is rendered in the Authorized Version <br><br>(1) \"Madai,\" <a href=\"#\" onClick=\"return mV('Gen',10,2);\">Gen 10:2</a>;<br><br>(2) \"Medes,\" <a href=\"#\" onClick=\"return mV('2Ki',17,6);\">2Ki 17:6</a>; <a href=\"#\" onClick=\"return mV('2Ki',18,11);\">18:11</a>;<br><br>(3) \"Media,\" <a href=\"#\" onClick=\"return mV('Est',1,3);\">Est 1:3</a>; <a href=\"#\" onClick=\"return mV('Est',10,2);\">10:2; <a href=\"#\" onClick=\"return mV('Isa',21,2);\">Isa 21:2</a>; <a href=\"#\" onClick=\"return mV('Dan',8,20);\">Dan 8:20</a>;<br><br>(4) \"Mede,\" only in <a href=\"#\" onClick=\"return mV('Dan',11,1);\">Dan 11:1</a>.<br><br>We first hear of this people in the Assyrian cuneiform records, under the name of Amada, about B.C. 840. They appear to have been a branch of the Aryans, who came from the east bank of the Indus, and were probably the predominant race for a while in the Mesopotamian valley. They consisted for three or four centuries of a number of tribes, each ruled by its own chief, who at length were brought under the Assyrian yoke (<a href=\"#\" onClick=\"return mV('2Ki',17,6);\">2Ki 17:6</a>). From this subjection they achieved deliverance, and formed themselves into an empire under Cyaxares (B.C. 633). This monarch entered into an alliance with the king of Babylon, and invaded Assyria, capturing and destroying the city of Nineveh (B.C. 625), thus putting an end to the Assyrian monarchy (<a href=\"#\" onClick=\"return mV('Nah',1,8);\">Nah 1:8</a>; <a href=\"#\" onClick=\"return mV('Nah',2,5,6);\">2:5-6</a>; <a href=\"#\" onClick=\"return mV('Nah',3,13,14);\">3:13-14</a>).<br><br>Media now rose to a place of great power, vastly extending its boundaries. But it did not long exist as an independent kingdom. It rose with Cyaxares, its first king, and it passed away with him; for during the reign of his son and successor Astyages, the Persians waged war against the Medes and conquered them, the two nations being united under one monarch, Cyrus the Persian (B.C. 558).<br><br>The \"cities of the Medes\" are first mentioned in connection with the deportation of the Israelites on the destruction of Samaria (<a href=\"#\" onClick=\"return mV('2Ki',17,6);\">2Ki 17:6</a>; <a href=\"#\" onClick=\"return mV('2Ki',18,11);\">18:11</a>). Soon afterwards Isaiah (<a href=\"#\" onClick=\"return mV('Isa',13,17);\">Isa 13:17</a>; <a href=\"#\" onClick=\"return mV('Isa',21,2);\">21:2</a>) speaks of the part taken by the Medes in the destruction of Babylon (<a href=\"#\" onClick=\"return mV('Jer',51,11,28);\">Jer 51:11, 28</a>). Daniel gives an account of the reign of Darius the Mede, who was made viceroy by Cyrus (<a href=\"#\" onClick=\"return mV('Dan',6,'1-28');\">Dan 6:1-28</a>). The decree of Cyrus, Ezra informs us (<a href=\"#\" onClick=\"return mV('Ezr',6,'2-5');\">Ezr 6:2-5</a>), was found in \"the palace that is in the province of the Medes,\" Achmetha or Ecbatana of the Greeks, which is the only Median city mentioned in Scripture.";
eastonArray["$$T0002461"] = "<strong>Mediator:</strong> one who intervenes between two persons who are at variance, with a view to reconcile them. This word is not found in the Old Testament; but the idea it expresses is found in <a href=\"#\" onClick=\"return mV('Job',9,33);\">Job 9:33</a>, in the word \"daysman\" (q.v.), marg., \"umpire.\"<br><br>This word is used in the New Testament to denote simply an internuncius, an ambassador, one who acts as a medium of communication between two contracting parties. In this sense Moses is called a mediator in <a href=\"#\" onClick=\"return mV('Gal',3,19);\">Gal 3:19</a>.<br><br>Christ is the one and only mediator between God and man (<a href=\"#\" onClick=\"return mV('1Ti',2,5);\">1Ti 2:5</a>; <a href=\"#\" onClick=\"return mV('Hbr',8,6);\">Hbr 8:6</a>; <a href=\"#\" onClick=\"return mV('Hbr',9,15);\">9:15</a>; <a href=\"#\" onClick=\"return mV('Hbr',12,24);\">12:24</a>). He makes reconciliation between God and man by his all-perfect atoning sacrifice. Such a mediator must be at once divine and human, divine, that his obedience and his sufferings might possess infinite worth, and that he might possess infinite wisdom and knowlege and power to direct all things in the kingdoms of providence and grace which are committed to his hands (<a href=\"#\" onClick=\"return mV('Mat',28,18);\">Mat 28:18</a>; <a href=\"#\" onClick=\"return mV('Jhn',5,22,'25-27');\">Jhn 5:22, 25-27</a>); and human, that in his work he ight represent man, and be capable of rendering obedience to the law and satisfying the claims of justice (<a href=\"#\" onClick=\"return mV('Hbr',2,17,18);\">Hbr 2:17-18</a>; <a href=\"#\" onClick=\"return mV('Hbr',4,15,16);\">4:15-16</a>), and that in his glorified humanity he might be the head of a glorified Church (<a href=\"#\" onClick=\"return mV('Rom',8,29);\">Rom 8:29</a>).<br><br>This office involves the three functions of prophet, priest, and king, all of which are discharged by Christ both in his estate of humiliation and exaltation. These functions are so inherent in the one office that the quality appertaining to each gives character to every mediatorial act. They are never separated in the exercise of the office of mediator.";
eastonArray["$$T0002462"] = "<strong>Meekness:</strong> a calm temper of mind, not easily provoked (<a href=\"#\" onClick=\"return mV('Jam',3,13);\">Jam 3:13</a>). Peculiar promises are made to the meek (<a href=\"#\" onClick=\"return mV('Mat',5,5);\">Mat 5:5</a>; <a href=\"#\" onClick=\"return mV('Isa',66,2);\">Isa 66:2</a>). The cultivation of this spirit is enjoined (<a href=\"#\" onClick=\"return mV('Col',3,12);\">Col 3:12</a>; <a href=\"#\" onClick=\"return mV('1Ti',6,11);\">1Ti 6:11</a>; <a href=\"#\" onClick=\"return mV('Zep',2,3);\">Zep 2:3</a>), and is exemplified in Christ (<a href=\"#\" onClick=\"return mV('Mat',11,29);\">Mat 11:29</a>), Abraham (<a href=\"#\" onClick=\"return mV('2Sa',16,10,12);\">2 Sam. 16:10, 12</a>), and Paul (<a href=\"#\" onClick=\"return mV('1Cr',9,19);\">1Cr 9:19</a>). <a href=\"#\" onClick=\"return mV('Gen',13,'1-')\">Gen 13</a>; <a href=\"#\" onClick=\"return mV('Gen',16,5,6);\">16:5-6</a>) Moses (<a href=\"#\" onClick=\"return mV('Num',12,3);\">Num 12:3</a>), David (<a href=\"#\" onClick=\"return mV('Zec',12,8);\">Zec 12:8</a>; <a href=\"#\" onClick=\"return mV('2Sa',16,10,12);\">2Sa 16:10, 12</a>), and Paul (<a href=\"#\" onClick=\"return mV('1Cr',9,19);\">1Cr 9:19</a>).";
eastonArray["$$T0002463"] = "<strong>Megiddo:</strong> place of troops, originally one of the royal cities of the Canaanites (<a href=\"#\" onClick=\"return mV('Jos',12,21);\">Jos 12:21</a>), belonged to the tribe of Manasseh (<a href=\"#\" onClick=\"return mV('Jdg',1,27);\">Jdg 1:27</a>), but does not seem to have been fully occupied by the Israelites till the time of Solomon (<a href=\"#\" onClick=\"return mV('1Ki',4,12);\">1Ki 4:12</a>; <a href=\"#\" onClick=\"return mV('1Ki',9,15);\">9:15</a>).<br><br>The valley or plain of Megiddo was part of the plain of Esdraelon, the great battle-field of Palestine. It was here Barak gained a notable victory over Jabin, the king of Hazor, whose general, Sisera, led on the hostile army. Barak rallied the warriors of the northern tribes, and under the encouragement of Deborah (q.v.), the prophetess, attacked the Canaanites in the great plain. The army of Sisera was thrown into complete confusion, and was engulfed in the waters of the Kishon, which had risen and overflowed its banks (<a href=\"#\" onClick=\"return mV('Jdg',4,5);\">Jdg 4:5</a>).<br><br>Many years after this (B.C. 610), Pharaohnecho II., on his march against the king of Assyria, passed through the plains of Philistia and Sharon; and King Josiah, attempting to bar his progress in the plain of Megiddo, was defeated by the Egyptians. He was wounded in battle, and died as they bore him away in his chariot towards Jerusalem (<a href=\"#\" onClick=\"return mV('2Ki',23,29);\">2Ki 23:29</a>; <a href=\"#\" onClick=\"return mV('2Ch',35,'22-24');\">2Ch 35:22-24</a>), and all Israel mourned for him. So general and bitter was this mourning that it became a proverb, to which Zechariah (<a href=\"#\" onClick=\"return mV('Zec',12,11,12);\">Zec 12:11-12</a>) alludes. Megiddo has been identified with the modern el-Lejjun, at the head of the Kishon, under the north-eastern brow of Carmel, on the south-western edge of the plain of Esdraelon, and 9 miles west of Jezreel. Others identify it with Mujedd'a, 4 miles south-west of Bethshean, but the question of its site is still undetermined.";
eastonArray["$$T0002464"] = "<strong>Mehetabeel:</strong> whose benefactor is God, the father of Delaiah, and grandfather of Shemaiah, who joined Sanballat against Nehemiah (<a href=\"#\" onClick=\"return mV('Neh',6,10);\">Neh 6:10</a>).";
eastonArray["$$T0002465"] = "<strong>Mehetabel:</strong> wife of Hadad, one of the kings of Edom (<a href=\"#\" onClick=\"return mV('Gen',36,39);\">Gen 36:39</a>).";
eastonArray["$$T0002466"] = "<strong>Mehujael:</strong> smitten by God, the son of Irad, and father of Methusael (<a href=\"#\" onClick=\"return mV('Gen',4,18);\">Gen 4:18</a>).";
eastonArray["$$T0002467"] = "<strong>Mehuman:</strong> faithful, one of the eunchs whom Ahasuerus (Xerxes) commanded to bring in Vashti (<a href=\"#\" onClick=\"return mV('Est',1,10);\">Est 1:10</a>).";
eastonArray["$$T0002468"] = "<strong>Mehunims:</strong> habitations, (<a href=\"#\" onClick=\"return mV('2Ch',26,7);\">2Ch 26:7</a>; R.V. \"Meunim,\" Vulg. Ammonitae), a people against whom Uzziah waged a successful war. This word is in Hebrew the plural of Ma'on, and thus denotes the Maonites who inhabited the country on the eastern side of the Wady el-Arabah. They are again mentioned in <a href=\"#\" onClick=\"return mV('1Ch',4,41);\">1Ch 4:41</a> (R.V.), in the reign of King Hezekiah, as a Hamite people, settled in the eastern end of the valley of Gedor, in the wilderness south of Palestine. In this passage the Authorized Version has \"habitation,\" erroneously following the translation of Luther.<br><br>They are mentioned in the list of those from whom the Nethinim were made up (<a href=\"#\" onClick=\"return mV('Ezr',2,50);\">Ezr 2:50</a>; <a href=\"#\" onClick=\"return mV('Neh',7,52);\">Neh 7:52</a>).";
eastonArray["$$T0002469"] = "<strong>Me-jarkon:</strong> waters of yellowness, or clear waters, a river in the tribe of Dan (<a href=\"#\" onClick=\"return mV('Jos',19,46);\">Jos 19:46</a>). It has been identified with the river 'Aujeh, which rises at Antipatris.";
eastonArray["$$T0002470"] = "<strong>Mekonah:</strong> a base or foundation, a town in the south of Judah (<a href=\"#\" onClick=\"return mV('Neh',11,28);\">Neh 11:28</a>), near Ziklag.";
eastonArray["$$T0002471"] = "<strong>Melchi:</strong> my king.<br><br>(1.) The son of Addi, and father of Neri (<a href=\"#\" onClick=\"return mV('Luk',3,28);\">Luk 3:28</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('Luk',3,24);\">Luk 3:24</a>.";
eastonArray["$$T0002472"] = "<strong>Melchizedek:</strong> king of righteousness, the king of Salem (q.v.). All we know of him is recorded in <a href=\"#\" onClick=\"return mV('Gen',14,'18-20');\">Gen 14:18-20</a>. He is subsequently mentioned only once in the Old Testament, in <a href=\"#\" onClick=\"return mV('Psa',110,4);\">Psa 110:4</a>. The typical significance of his history is set forth in detail in the Epistle to the <a href=\"#\" onClick=\"return mV('Heb',7,'1-');\">Hebrews, ch. 7</a>. The apostle there points out the superiority of his priesthood to that of Aaron in these several respects,<br><br>(1) Even Abraham paid him tithes;<br><br>(2) he blessed Abraham;<br><br>(3) he is the type of a Priest who lives for ever;<br><br>(4) Levi, yet unborn, paid him tithes in the person of Abraham;<br><br>(5) the permanence of his priesthood in Christ implied the abrogation of the Levitical system;<br><br>(6) he was made priest not without an oath; and<br><br>(7) his priesthood can neither be transmitted nor interrupted by death: \"this man, because he continueth ever, hath an unchangeable priesthood.\"<br><br>The question as to who this mysterious personage was has given rise to a great deal of modern speculation. It is an old tradition among the Jews that he was Shem, the son of Noah, who may have survived to this time. Melchizedek was a Canaanitish prince, a worshipper of the true God, and in his peculiar history and character an instructive type of our Lord, the great High Priest (<a href=\"#\" onClick=\"return mV('Hbr',5,6,7);\">Hbr 5:6-7</a>; <a href=\"#\" onClick=\"return mV('Hbr',6,20);\">6:20</a>). One of the Amarna tablets is from Ebed-Tob, king of Jerusalem, the successor of Melchizedek, in which he claims the very attributes and dignity given to Melchizedek in the Epistle to the Hebrews.";
eastonArray["$$T0002473"] = "<strong>Melea:</strong> fulness, the son of Menan and father of Eliakim, in the genealogy of our Lord (<a href=\"#\" onClick=\"return mV('Luk',3,31);\">Luk 3:31</a>).";
eastonArray["$$T0002474"] = "<strong>Melech:</strong> king, the second of Micah's four sons (<a href=\"#\" onClick=\"return mV('1Ch',8,35);\">1Ch 8:35</a>), and thus grandson of Mephibosheth.";
eastonArray["$$T0002475"] = "<strong>Melita:</strong> (<a href=\"#\" onClick=\"return mV('Act',27,28);\">Act 27:28</a>), an island in the Mediterranean, the modern Malta. Here the ship in which Paul was being conveyed a prisoner to Rome was wrecked. The bay in which it was wrecked now bears the name of \"St. Paul's Bay\", \"a certain creek with a shore.\" It is about 2 miles deep and 1 broad, and the whole physical condition of the scene answers the description of the shipwreck given in <a href=\"#\" onClick=\"return mV('Act',28,'1-');\">Acts 28</a>. It was originally colonized by Phoenicians (<a href=\"#\" onClick=\"return mV('Act',28,2);\">28:2</a>). It came into the possession of the Greeks (B.C. 736), from whom it was taken by the Carthaginians (B.C. 528). In B.C. 242 it was conquered by the Romans, and was governed by a Roman propraetor at the time of the shipwreck (<a href=\"#\" onClick=\"return mV('Act',28,7);\">Act 28:7</a>). Since 1800, when the French garrison surrendered to the English force, it has been a British dependency. The island is about 17 miles long and 9 wide, and about 60 in circumference. After a stay of three months on this island, during which the \"barbarians\" showed them no little kindness, Julius procured for himself and his company a passage in another Alexandrian corn-ship which had wintered in the island, in which they proceeded on their voyage to Rome (<a href=\"#\" onClick=\"return mV('Act',28,13,14);\">Act 28:13-14</a>).";
eastonArray["$$T0002476"] = "<strong>Melons:</strong> only in <a href=\"#\" onClick=\"return mV('Num',11,5);\">Num 11:5</a>, the translation of the Hebrew abattihim, the LXX. and Vulgate pepones, Arabic britikh. Of this plant there are various kinds, the Egyptian melon, the <i>Cucumus chate</i>, which has been called \"the queen of cucumbers;\" the water melon, the <i>Cucurbita citrullus</i>; and the common or flesh melon, the <i>Cucumus melo</i>. \"A traveller in the East who recollects the intense gratitude which a gift of a slice of melon inspired while journeying over the hot and dry plains, will readily comprehend the regret with which the Hebrews in the Arabian desert looked back upon the melons of Egypt\" (Kitto).";
eastonArray["$$T0002477"] = "<strong>Melzar:</strong> probably a Persian word meaning master of wine, i.e., chief butler; the title of an officer at the Babylonian court (<a href=\"#\" onClick=\"return mV('Dan',1,11,16);\">Dan 1:11, 16</a>) who had charge of the diet of the Hebrew youths.";
eastonArray["$$T0002478"] = "<strong>Memphis:</strong> only in <a href=\"#\" onClick=\"return mV('Hsa',9,6);\">Hsa 9:6</a>, Hebrew Moph. In <a href=\"#\" onClick=\"return mV('Isa',19,13);\">Isa 19:13</a>; <a href=\"#\" onClick=\"return mV('Jer',2,16);\">Jer 2:16</a>; <a href=\"#\" onClick=\"return mV('Jer',46,14,19);\">46:14, 19</a>; <a href=\"#\" onClick=\"return mV('Eze',30,13,16);\">Eze 30:13, 16</a>, it is mentioned under the name Noph. It was the capital of Lower, i.e., of Northern Egypt. From certain remains found half buried in the sand, the site of this ancient city has been discovered near the modern village of Minyet Rahinch, or Mitraheny, about 16 miles above the ancient head of the Delta, and 9 miles south of Cairo, on the west bank of the Nile. It is said to have been founded by Menes, the first king of Egypt, and to have been in circumference about 19 miles. \"There are few remains above ground,\" says Manning (The Land of the Pharaohs), \"of the splendour of ancient Memphis. The city has utterly disappeared. If any traces yet exist, they are buried beneath the vast mounds of crumbling bricks and broken pottery which meet the eye in every direction. Near the village of Mitraheny is a colossal statue of Rameses the Great. It is apparently one of the two described by Herodotus and Diodorus as standing in front of the temple of Ptah. They were originally 50 feet in height. The one which remains, though mutilated, measures 48 feet. It is finely carved in limestone, which takes a high polish, and is evidently a portrait. It lies in a pit, which, during the inundation, is filled with water. As we gaze on this fallen and battered statue of the mighty conqueror who was probably contemporaneous with Moses, it is impossible not to remember the words of the prophet Isaiah, <a href=\"#\" onClick=\"return mV('Isa',19,13);\">19:13</a>; <a href=\"#\" onClick=\"return mV('Isa',44,'16-19');\">44:16-19</a>, and Jeremiah, <a href=\"#\" onClick=\"return mV('Jer',46,19);\">46:19</a>.";
eastonArray["$$T0002479"] = "<strong>Memucan:</strong> dignified, one of the royal counsellors at the court of Ahasuerus, by whose suggestion Vashti was divorced (<a href=\"#\" onClick=\"return mV('Est',1,14,16,21);\">Est 1:14, 16, 21</a>).";
eastonArray["$$T0002480"] = "<strong>Menahem:</strong> conforting, the son of Gadi, and successor of Shallum, king of Israel, whom he slew. After a reign of about ten years (B.C. 771-760) he died, leaving the throne to his son Pekahiah. His reign was one of cruelty and oppression (<a href=\"#\" onClick=\"return mV('2Ki',15,'14-22');\">2Ki 15:14-22</a>). During his reign, Pul (q.v.), king of Assyria, came with a powerful force against Israel, but was induced to retire by a gift from Menahem of 1,000 talents of silver.";
eastonArray["$$T0002481"] = "<strong>Mene:</strong> (<a href=\"#\" onClick=\"return mV('Dan',5,25,26);\">Dan 5:25-26</a>), numbered, one of the words of the mysterious inscription written \"upon the plaister of the wall\" in Belshazzar's palace at Babylon. The writing was explained by Daniel. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000519');\">BELSHAZZAR</a>.)";
eastonArray["$$T0002482"] = "<strong>Meni:</strong> <a href=\"#\" onClick=\"return mV('Isa',65,11);\">Isa 65:11</a>, marg. (A.V., \"that number; \" R.V., \"destiny\"), probably an idol which the captive Israelites worshipped after the example of the Babylonians. It may have been a symbol of destiny. LXX., tuche.";
eastonArray["$$T0002483"] = "<strong>Meonenim:</strong> (<a href=\"#\" onClick=\"return mV('Jdg',9,37);\">Jdg 9:37</a>; A.V., \"the plain of Meonenim; \" R.V., \"the oak of Meonenim\") means properly \"soothsayers\" or \"sorcerers,\" \"wizards\" (<a href=\"#\" onClick=\"return mV('Deu',18,10,14);\">Deu 18:10, 14</a>; <a href=\"#\" onClick=\"return mV('2Ki',21,6);\">2Ki 21:6</a>; <a href=\"#\" onClick=\"return mV('Mic',5,12);\">Mic 5:12</a>). This may be the oak at Shechem under which Abram pitched his tent (see <a href=\"#\" onClick=\"return doDictLookup('ET0003330');\">SHECHEM</a>), the \"enchanter's oak,\" so called, perhaps, from Jacob's hiding the \"strange gods\" under it (<a href=\"#\" onClick=\"return mV('Gen',35,4);\">Gen 35:4</a>).";
eastonArray["$$T0002484"] = "<strong>Mephaath:</strong> splendour, a Levitical city (<a href=\"#\" onClick=\"return mV('Jos',21,37);\">Jos 21:37</a>) of the tribe of Reuben (<a href=\"#\" onClick=\"return mV('Jos',13,18);\">13:18</a>).";
eastonArray["$$T0002485"] = "<strong>Mephibosheth:</strong> exterminator of shame; i.e., of idols.<br><br>(1.) The name of Saul's son by the concubine Rizpah (q.v.), the daughter of Aiah. He and his brother Armoni were with five others \"hanged on a hill before the Lord\" by the Gibeonites, and their bodies exposed in the sun for five months (<a href=\"#\" onClick=\"return mV('2Sa',21,'8-10');\">2Sa 21:8-10</a>).<br><br>(2.) The son of Jonathan, and grandson of Saul (<a href=\"#\" onClick=\"return mV('2Sa',4,4);\">2Sa 4:4</a>). He was but five years old when his father and grandfather fell on Mount Gilboa. The child's nurse hearing of this calamity, fled with him from Gibeah, the royal residence, and stumbling in her haste, the child was thrown to the ground and maimed in both his feet, and ever after was unable to walk (<a href=\"#\" onClick=\"return mV('2Sa',19,26);\">19:26</a>). He was carried to the land of Gilead, where he found a refuge in the house of Machir, the son of Ammiel, at Lo-debar, by whom he was brought up.<br><br>Some years after this, when David had subdued all the adversaries of Israel, he began to think of the family of Jonathan, and discovered that Mephibosheth was residing in the house of Machir. Thither he sent royal messengers, and brought him and his infant son to Jerusalem, where he ever afterwards resided (<a href=\"#\" onClick=\"return mV('2Sa',9,'1-')\">2Sa 9</a>).<br><br>When David was a fugitive, according to the story of Ziba (<a href=\"#\" onClick=\"return mV('2Sa',16,'1-4');\">2Sa 16:1-4</a>) Mephibosheth proved unfaithful to him, and was consequently deprived of half of his estates; but according to his own story, however (<a href=\"#\" onClick=\"return mV('2Sa',19,'24-30');\">19:24-30</a>), he had remained loyal to his friend. After this incident he is only mentioned as having been protected by David against the vengeance the Gibeonites were permitted to execute on the house of Saul (<a href=\"#\" onClick=\"return mV('2Sa',21,7);\">21:7</a>). He is also called Merib-baal (<a href=\"#\" onClick=\"return mV('1Ch',8,34);\">1Ch 8:34</a>; <a href=\"#\" onClick=\"return mV('1Ch',9,40);\">9:40</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0003919');\">ZIBA</a>.)";
eastonArray["$$T0002486"] = "<strong>Merab:</strong> increase, the eldest of Saul's two daughters (<a href=\"#\" onClick=\"return mV('1Sa',14,49);\">1Sa 14:49</a>). She was betrothed to David after his victory over Goliath, but does not seem to have entered heartily into this arrangement (<a href=\"#\" onClick=\"return mV('1Sa',18,2,17,19);\">18:2, 17,19</a>). She was at length, however, married to Adriel of Abel-Meholah, a town in the Jordan valley, about 10 miles south of Bethshean, with whom the house of Saul maintained alliance. She had five sons, who were all put to death by the Gibeonites on the hill of Gibeah (<a href=\"#\" onClick=\"return mV('2Sa',21,8);\">2Sa 21:8</a>).";
eastonArray["$$T0002487"] = "<strong>Meraiah:</strong> resistance, a chief priest, a contemporary of the high priest Joiakim (<a href=\"#\" onClick=\"return mV('Neh',12,12);\">Neh 12:12</a>).";
eastonArray["$$T0002488"] = "<strong>Meraioth:</strong> rebellions.<br><br>(1.) Father of Amariah, a high priest of the line of Eleazar (<a href=\"#\" onClick=\"return mV('1Ch',6,6,7,52);\">1Ch 6:6-7, 52</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('Neh',12,15);\">Neh 12:15</a>, a priest who went to Jerusalem with Zerubbabel. He is called Meremoth in <a href=\"#\" onClick=\"return mV('Neh',12,3);\">Neh 12:3</a>.";
eastonArray["$$T0002489"] = "<strong>Merari:</strong> sad; bitter, the youngest son of Levi, born before the descent of Jacob into Egypt, and one of the seventy who accompanied him thither (<a href=\"#\" onClick=\"return mV('Gen',46,11);\">Gen 46:11</a>; <a href=\"#\" onClick=\"return mV('Exd',6,16);\">Exd 6:16</a>). He became the head of one of the great divisions of the Levites (<a href=\"#\" onClick=\"return mV('Exd',6,19);\">Exd 6:19</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002490');\">MERARITES</a>.)";
eastonArray["$$T0002490"] = "<strong>Merarites:</strong> the descendants of Merari (<a href=\"#\" onClick=\"return mV('Num',26,57);\">Num 26:57</a>). They with the Gershonites and the Kohathites had charge of the tabernacle, which they had to carry from place to place (<a href=\"#\" onClick=\"return mV('Num',3,20,'33-37');\">Num 3:20, 33-37</a>; <a href=\"#\" onClick=\"return mV('Num',4,'29-33');\">4:29-33</a>). In the distribution of the oxen and waggons offered by the princes (<a href=\"#\" onClick=\"return mV('Num',7,'1-')\">Num 7</a>), Moses gave twice as many to the Merarites (four waggons and eight oxen) as he gave to the Gershonites, because the latter had to carry only the lighter furniture of the tabernacle, such as the curtains, hangings, etc., while the former had to carry the heavier portion, as the boards, bars, sockets, pillars, etc., and consequently needed a greater supply of oxen and waggons. This is a coincidence illustrative of the truth of the narrative. Their place in marching and in the camp was on the north of the tabernacle. The Merarites afterwards took part with the other Levitical families in the various functions of their office (<a href=\"#\" onClick=\"return mV('1Ch',23,6,'21-23');\">1Ch 23:6, 21-23</a>; <a href=\"#\" onClick=\"return mV('2Ch',29,12,13);\">2Ch 29:12-13</a>). Twelve cities with their suburbs were assigned to them (<a href=\"#\" onClick=\"return mV('Jos',21,7,'33-40');\">Jos 21:7, 33-40</a>).";
eastonArray["$$T0002491"] = "<strong>Merathaim:</strong> double rebellion, probably a symbolical name given to Babylon (<a href=\"#\" onClick=\"return mV('Jer',50,21);\">Jer 50:21</a>), denoting rebellion exceeding that of other nations.";
eastonArray["$$T0002492"] = "<strong>Merchant:</strong> The Hebrew word so rendered is from a root meaning \"to travel about,\" \"to migrate,\" and hence \"a traveller.\" In the East, in ancient times, merchants travelled about with their merchandise from place to place (<a href=\"#\" onClick=\"return mV('Gen',37,25);\">Gen 37:25</a>; <a href=\"#\" onClick=\"return mV('Job',6,18);\">Job 6:18</a>), and carried on their trade mainly by bartering (<a href=\"#\" onClick=\"return mV('Gen',37,28);\">Gen 37:28</a>; <a href=\"#\" onClick=\"return mV('Gen',39,1);\">39:1</a>). After the Hebrews became settled in Palestine they began to engage in commercial pursuits, which gradually expanded (<a href=\"#\" onClick=\"return mV('Gen',49,13);\">49:13</a>; <a href=\"#\" onClick=\"return mV('Deu',33,18);\">Deu 33:18</a>; <a href=\"#\" onClick=\"return mV('Jdg',5,17);\">Jdg 5:17</a>), till in the time of Solomon they are found in the chief marts of the world (<a href=\"#\" onClick=\"return mV('1Ki',9,26);\">1Ki 9:26</a>; <a href=\"#\" onClick=\"return mV('1Ki',10,11,26,28);\">10:11, 26, 28</a>; <a href=\"#\" onClick=\"return mV('1Ki',22,48);\">22:48</a>; <a href=\"#\" onClick=\"return mV('2Ch',1,16);\">2Ch 1:16</a>; <a href=\"#\" onClick=\"return mV('2Ch',9,10,21);\">9:10, 21</a>). After Solomon's time their trade with foreign nations began to decline. After the Exile it again expanded into wider foreign relations, because now the Jews were scattered in many lands.";
eastonArray["$$T0002493"] = "<strong>Mercurius:</strong> the Hermes (i.e., \"the speaker\") of the Greeks (<a href=\"#\" onClick=\"return mV('Act',14,12);\">Act 14:12</a>), a heathen God represented as the constant attendant of Jupiter, and the god of eloquence. The inhabitants of Lystra took Paul for this god because he was the \"chief speaker.\"";
eastonArray["$$T0002494"] = "<strong>Mercy:</strong> compassion for the miserable. Its object is misery. By the atoning sacrifice of Christ a way is open for the exercise of mercy towards the sons of men, in harmony with the demands of truth and righteousness (<a href=\"#\" onClick=\"return mV('Gen',19,19);\">Gen 19:19</a>; <a href=\"#\" onClick=\"return mV('Exd',20,6);\">Exd 20:6</a>; <a href=\"#\" onClick=\"return mV('Exd',34,6,7);\">34:6-7</a>; <a href=\"#\" onClick=\"return mV('Psa',85,10);\">Psa 85:10</a>; <a href=\"#\" onClick=\"return mV('Psa',86,15-16);\">86:15-16</a>). In Christ mercy and truth meet together. Mercy is also a Christian grace (<a href=\"#\" onClick=\"return mV('Mat',5,7);\">Mat 5:7</a>; <a href=\"#\" onClick=\"return mV('Mat',18,'33-35');\">18:33-35</a>).";
eastonArray["$$T0002495"] = "<strong>Mercy-seat:</strong> (Heb. kapporeth, a \"covering; \" LXX. and N.T., hilasterion; Vulg., propitiatorium), the covering or lid of the ark of the covenant (q.v.). It was of acacia wood, overlaid with gold, or perhaps rather a plate of solid gold, 2 1/2 cubits long and 1 1/2 broad (<a href=\"#\" onClick=\"return mV('Exd',25,17);\">Exd 25:17</a>; <a href=\"#\" onClick=\"return mV('Exd',30,6);\">30:6</a>; <a href=\"#\" onClick=\"return mV('Exd',31,7);\">31:7</a>). It is compared to the throne of grace (<a href=\"#\" onClick=\"return mV('Hbr',9,5);\">Hbr 9:5</a>; <a href=\"#\" onClick=\"return mV('Eph',2,6);\">Eph 2:6</a>). The holy of holies is called the \"place of the mercy-seat\" (<a href=\"#\" onClick=\"return mV('1Ch',28,11);\">1Ch 28:11</a>: <a href=\"#\" onClick=\"return mV('Lev',16,2);\">Lev 16:2</a>).<br><br>It has been conjectured that the censer (thumiaterion, meaning \"anything having regard to or employed in the burning of incense\") mentioned in <a href=\"#\" onClick=\"return mV('Hbr',9,4);\">Hbr 9:4</a> was the \"mercy-seat,\" at which the incense was burned by the high priest on the great day of atonement, and upon or toward which the blood of the goat was sprinkled (<a href=\"#\" onClick=\"return mV('Lev',16,'11-16');\">Lev 16:11-16</a>; <a href=\"#\" onClick=\"return mV('Num',7,89);\">Num 7:89</a> and <a href=\"#\" onClick=\"return mV('Exd',25,22);\">Exd 25:22</a>).";
eastonArray["$$T0002496"] = "<strong>Mered:</strong> rebellion, one of the sons of Ezra, of the tribe of Judah (<a href=\"#\" onClick=\"return mV('1Ch',4,17);\">1Ch 4:17</a>).";
eastonArray["$$T0002497"] = "<strong>Meremoth:</strong> exaltations, heights, a priest who returned from Babylon with Zerubbabel (<a href=\"#\" onClick=\"return mV('Neh',12,3);\">Neh 12:3</a>), to whom were sent the sacred vessels (<a href=\"#\" onClick=\"return mV('Ezr',8,33);\">Ezr 8:33</a>) belonging to the temple. He took part in rebuilding the walls of Jerusalem (<a href=\"#\" onClick=\"return mV('Neh',3,4);\">Neh 3:4</a>).";
eastonArray["$$T0002498"] = "<strong>Meribah:</strong> quarrel or strife.<br><br>(1.) One of the names given by Moses to the fountain in the desert of Sin, near Rephidim, which issued from the rock in Horeb, which he smote by the divine command, \"because of the chiding of the children of Israel\" (<a href=\"#\" onClick=\"return mV('Exd',17,'1-7');\">Exd 17:1-7</a>). It was also called Massah (q.v.). It was probably in Wady Feiran, near Mount Serbal.<br><br>(2.) Another fountain having a similar origin in the desert of Zin, near to Kadesh (<a href=\"#\" onClick=\"return mV('Num',27,14);\">Num 27:14</a>). The two places are mentioned together in <a href=\"#\" onClick=\"return mV('Deu',33,8);\">Deu 33:8</a>. Some think the one place is called by the two names (<a href=\"#\" onClick=\"return mV('Psa',81,7);\">Psa 81:7</a>). In smiting the rock at this place Moses showed the same impatience as the people (<a href=\"#\" onClick=\"return mV('Num',20,'10-12');\">Num 20:10-12</a>). This took place near the close of the wanderings in the desert (<a href=\"#\" onClick=\"return mV('Num',20,'1-24');\">Num 20:1-24</a>; <a href=\"#\" onClick=\"return mV('Deu',32,51);\">Deu 32:51</a>).";
eastonArray["$$T0002499"] = "<strong>Merib-baal:</strong> contender with Baal, (<a href=\"#\" onClick=\"return mV('1Ch',8,34);\">1Ch 8:34</a>; <a href=\"#\" onClick=\"return mV('1Ch',9,40);\">9:40</a>), elsewhere called Mephibosheth (<a href=\"#\" onClick=\"return mV('2Sa',4,4);\">2Sa 4:4</a>), the son of Jonathan.";
</script>
