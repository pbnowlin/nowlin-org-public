<script>var eastonArray = new Array ();
eastonArray["$$T0002800"] = "<strong>Oreb:</strong> raven, a prince of Midian, who, being defeated by Gideon and put to straits, was slain along with Zeeb (<a href=\"#\" onClick=\"return mV('Jdg',7,'20-25');\">Jdg 7:20-25</a>). Many of the Midianites perished along with him (<a href=\"#\" onClick=\"return mV('Psa',83,9);\">Psa 83:9</a>; <a href=\"#\" onClick=\"return mV('Isa',10,26);\">Isa 10:26</a>).";
eastonArray["$$T0002801"] = "<strong>Oreb, The rock of:</strong> the place where Gideon slew Oreb after the defeat of the Midianites (<a href=\"#\" onClick=\"return mV('Jdg',7,25);\">Jdg 7:25</a>; <a href=\"#\" onClick=\"return mV('Isa',10,26);\">Isa 10:26</a>). It was probably the place now called Orbo, on the east of Jordan, near Bethshean.";
eastonArray["$$T0002802"] = "<strong>Oren:</strong> ash or pine, the son of Jerahmeel (<a href=\"#\" onClick=\"return mV('1Ch',2,25);\">1Ch 2:25</a>).";
eastonArray["$$T0002803"] = "<strong>Organ:</strong> some kind of wind instrument, probably a kind of Pan's pipes (<a href=\"#\" onClick=\"return mV('Gen',4,21);\">Gen 4:21</a>; <a href=\"#\" onClick=\"return mV('Job',21,12);\">Job 21:12</a>; <a href=\"#\" onClick=\"return mV('Psa',150,4);\">Psa 150:4</a>), which consisted of seven or eight reeds of unequal length.";
eastonArray["$$T0002804"] = "<strong>Orion:</strong> Heb. Kesil; i.e., \"the fool\", the name of a constellation (<a href=\"#\" onClick=\"return mV('Job',9,9);\">Job 9:9</a>; <a href=\"#\" onClick=\"return mV('Job',38,31);\">38:31</a>; <a href=\"#\" onClick=\"return mV('Amo',5,8);\">Amo 5:8</a>) consisting of about eighty stars. The Vulgate renders thus, but the LXX. renders by Hesperus, i.e., \"the evening-star,\" Venus. The Orientals \"appear to have conceived of this constellation under the figure of an impious giant bound upon the sky.\" This giant was, according to tradition, Nimrod, the type of the folly that contends against God. In <a href=\"#\" onClick=\"return mV('Isa',13,10);\">Isa 13:10</a> the plural form of the Hebrew word is rendered \"constellations.\"";
eastonArray["$$T0002805"] = "<strong>Ornan:</strong> <a href=\"#\" onClick=\"return mV('1Ch',21,15);\">1Ch 21:15</a>. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000285');\">ARAUNAH</a>.)";
eastonArray["$$T0002806"] = "<strong>Orpah:</strong> forelock or fawn, a Moabitess, the wife of Chilion (<a href=\"#\" onClick=\"return mV('Rth',1,4);\">Rth 1:4</a>; <a href=\"#\" onClick=\"return mV('Rth',4,10);\">4:10</a>). On the death of her husband she accompanied Naomi, her mother-in-law, part of the way to Bethlehem, and then returned to Moab.";
eastonArray["$$T0002807"] = "<strong>Orphans:</strong> (<a href=\"#\" onClick=\"return mV('Lam',5,3);\">Lam 5:3</a>), i.e., desolate and without protectors. The word occurs only here. In <a href=\"#\" onClick=\"return mV('Jhn',14,18);\">Jhn 14:18</a> the word there rendered \"comfortless\" (R.V., \"desolate; \" marg., \"orphans\") properly means \"orphans.\" The same Greek word is rendered \"fatherless\" in <a href=\"#\" onClick=\"return mV('Jam',1,27);\">Jam 1:27</a>.";
eastonArray["$$T0002808"] = "<strong>Osprey:</strong> Heb. 'ozniyyah, an unclean bird according to the Mosaic law (<a href=\"#\" onClick=\"return mV('Lev',11,13);\">Lev 11:13</a>; <a href=\"#\" onClick=\"return mV('Deu',14,12);\">Deu 14:12</a>); the fish-eating eagle (<i>Pandion haliaetus</i>); one of the lesser eagles. But the Hebrew word may be taken to denote the short-toed eagle (<i>Circaetus gallicus</i> of Southern Europe), one of the most abundant of the eagle tribe found in Palestine.";
eastonArray["$$T0002809"] = "<strong>Ossifrage:</strong> Heb. peres = to \"break\" or \"crush\", the lammer-geier, or bearded vulture, the largest of the whole vulture tribe. It was an unclean bird (<a href=\"#\" onClick=\"return mV('Lev',11,13);\">Lev 11:13</a>; <a href=\"#\" onClick=\"return mV('Deu',14,12);\">Deu 14:12</a>). It is not a gregarious bird, and is found but rarely in Palestine. \"When the other vultures have picked the flesh off any animal, he comes in at the end of the feast, and swallows the bones, or breaks them, and swallows the pieces if he cannot otherwise extract the marrow. The bones he cracks [hence the appropriateness of the name ossifrage, i.e., \"bone-breaker\"] by letting them fall on a rock from a great height. He does not, however, confine himself to these delicacies, but whenever he has an opportunity will devour lambs, kids, or hares. These he generally obtains by pushing them over cliffs, when he has watched his opportunity; and he has been known to attack men while climbing rocks, and dash them against the bottom. But tortoises and serpents are his ordinary food...No doubt it was a lammer-geier that mistook the bald head of the poet AEschylus for a stone, and dropped on it the tortoise which killed him\" (Tristram's Nat. Hist.).";
eastonArray["$$T0002810"] = "<strong>Ostrich:</strong> (<a href=\"#\" onClick=\"return mV('Lam',4,3);\">Lam 4:3</a>), the rendering of Hebrew pl. enim; so called from its greediness and gluttony. The allusion here is to the habit of the ostrich with reference to its eggs, which is thus described: \"The outer layer of eggs is generally so ill covered that they are destroyed in quantities by jackals, wild-cats, etc., and that the natives carry them away, only taking care not to leave the marks of their footsteps, since, when the ostrich comes and finds that her nest is discovered, she crushes the whole brood, and builds a nest elsewhere.\" In <a href=\"#\" onClick=\"return mV('Job',39,13);\">Job 39:13</a> this word in the Authorized Version is the rendering of a Hebrew word (notsah) which means \"feathers,\" as in the Revised Version. In the same verse the word \"peacocks\" of the Authorized Version is the rendering of the Hebrew pl. renanim, properly meaning \"ostriches,\" as in the Revised Version. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002815');\">OWL [1]</a>.)";
eastonArray["$$T0002811"] = "<strong>Othni:</strong> a lion of Jehovah, a son of Shemaiah, and one of the temple porters in the time of David (<a href=\"#\" onClick=\"return mV('1Ch',26,7);\">1Ch 26:7</a>). He was a \"mighty man of valour.\"";
eastonArray["$$T0002812"] = "<strong>Othniel:</strong> lion of God, the first of the judges. His wife Achsah was the daughter of Caleb (<a href=\"#\" onClick=\"return mV('Jos',15,16,17);\">Jos 15:16-17</a>; <a href=\"#\" onClick=\"return mV('Jdg',1,13);\">Jdg 1:13</a>). He gained her hand as a reward for his bravery in leading a successful expedition against Debir (q.v.). Some thirty years after the death of Joshua, the Israelites fell under the subjection of Chushan-rishathaim (q.v.), the king of Mesopotamia. He oppressed them for full eight years, when they \"cried\" unto Jehovah, and Othniel was raised up to be their deliverer. He was the younger brother of Caleb (<a href=\"#\" onClick=\"return mV('Jdg',3,'9-11');\">Jdg 3:9-11</a>). He is the only judge mentioned connected with the tribe of Judah. Under him the land had rest forty years.";
eastonArray["$$T0002813"] = "<strong>Ouches:</strong> an Old English word denoting cavities or sockets in which gems were set (<a href=\"#\" onClick=\"return mV('Exd',28,11);\">Exd 28:11</a>).";
eastonArray["$$T0002814"] = "<strong>Oven:</strong> Heb. tannur, (<a href=\"#\" onClick=\"return mV('Hsa',7,4);\">Hsa 7:4</a>). In towns there appear to have been public ovens. There was a street in Jerusalem (<a href=\"#\" onClick=\"return mV('Jer',37,21);\">Jer 37:21</a>) called \"bakers' street\" (the only case in which the name of a street in Jerusalem is preserved). The words \"tower of the furnaces\" (<a href=\"#\" onClick=\"return mV('Neh',3,11);\">Neh 3:11</a>; <a href=\"#\" onClick=\"return mV('Neh',12,38);\">12:38</a>) is more properly \"tower of the ovens\" (Heb. tannurim). These resemble the ovens in use among ourselves.<br><br>There were other private ovens of different kinds. Some were like large jars made of earthenware or copper, which were heated inside with wood (<a href=\"#\" onClick=\"return mV('1Ki',17,12);\">1Ki 17:12</a>; <a href=\"#\" onClick=\"return mV('Isa',44,15);\">Isa 44:15</a>; <a href=\"#\" onClick=\"return mV('Jer',7,18);\">Jer 7:18</a>) or grass (<a href=\"#\" onClick=\"return mV('Mat',6,30);\">Mat 6:30</a>), and when the fire had burned out, small pieces of dough were placed inside or spread in thin layers on the outside, and were thus baked. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001398');\">FURNACE</a>.)<br><br>Pits were also formed for the same purposes, and lined with cement. These were used after the same manner.<br><br>Heated stones, or sand heated by a fire heaped over it, and also flat irons pans, all served as ovens for the preparation of bread. (See <a href=\"#\" onClick=\"return mV('Gen',18,6);\">Gen 18:6</a>; <a href=\"#\" onClick=\"return mV('1Ki',19,6);\">1Ki 19:6</a>.)";
eastonArray["$$T0002815"] = "<strong>Owl:</strong><br><br>(1.) Heb. bath-haya'anah, \"daughter of greediness\" or of \"shouting.\" In the list of unclean birds (<a href=\"#\" onClick=\"return mV('Lev',11,16);\">Lev 11:16</a>; <a href=\"#\" onClick=\"return mV('Deu',14,15);\">Deu 14:15</a>); also mentioned in <a href=\"#\" onClick=\"return mV('Job',30,29);\">Job 30:29</a>; <a href=\"#\" onClick=\"return mV('Isa',13,21);\">Isa 13:21</a>; <a href=\"#\" onClick=\"return mV('Isa',34,13);\">34:13</a>; <a href=\"#\" onClick=\"return mV('Isa',43,20);\">43:20</a>; <a href=\"#\" onClick=\"return mV('Jer',50,39);\">Jer 50:39</a>; <a href=\"#\" onClick=\"return mV('Mic',1,8);\">Mic 1:8</a>. In all these passages the Revised Version translates \"ostrich\" (q.v.), which is the correct rendering.<br><br>(2.) Heb. yanshuph, rendered \"great owl\" in <a href=\"#\" onClick=\"return mV('Lev',11,17);\">Lev 11:17</a>; <a href=\"#\" onClick=\"return mV('Deu',14,16);\">Deu 14:16</a>, and \"owl\" in <a href=\"#\" onClick=\"return mV('Isa',34,11);\">Isa 34:11</a>. This is supposed to be the Egyptian eagle-owl (<i>Bubo ascalaphus</i>), which takes the place of the eagle-owl (<i>Bubo maximus</i>) found in Southern Europe. It is found frequenting the ruins of Egypt and also of the Holy Land. \"Its cry is a loud, prolonged, and very powerful hoot. I know nothing which more vividly brought to my mind the sense of desolation and loneliness than the re-echoing hoot of two or three of these great owls as I stood at midnight among the ruined temples of Baalbek\" (Tristram).<br><br>The LXX. and Vulgate render this word by \"ibis\", i.e., the Egyptian heron.<br><br>(3.) Heb. kos, rendered \"little owl\" in <a href=\"#\" onClick=\"return mV('Lev',11,17);\">Lev 11:17</a>; <a href=\"#\" onClick=\"return mV('Deu',14,16);\">Deu 14:16</a>, and \"owl\" in <a href=\"#\" onClick=\"return mV('Psa',102,6);\">Psa 102:6</a>. The Arabs call this bird \"the mother of ruins.\" It is by far the most common of all the owls of Palestine. It is the <i>Athene persica</i>, the bird of Minerva, the symbol of ancient Athens.<br><br>(4.) Heb. kippoz, the \"great owl\" (<a href=\"#\" onClick=\"return mV('Isa',34,15);\">Isa 34:15</a>); Revised Version, \"arrow-snake;\" LXX. and Vulgate, \"hedgehog,\" reading in the text, kippod, instead of kippoz. There is no reason to doubt the correctness of the rendering of the Authorized Version. Tristram says: \"The word [i.e., kippoz] is very possibly an imitation of the cry of the scops owl (<i>Scops giu</i>), which is very common among ruins, caves, and old walls of towns...It is a migrant, returning to Palestine in spring.\"<br><br>(5.) Heb. lilith, \"screech owl\" (<a href=\"#\" onClick=\"return mV('Isa',34,14);\">Isa 34:14</a>, marg. and R.V., \"night monster\"). The Hebrew word is from a root signifying \"night.\" Some species of the owl is obviously intended by this word. It may be the hooting or tawny owl (<i>Syrnium aluco</i>), which is common in Egypt and in many parts of Palestine. This verse in Isaiah is \"descriptive of utter and perpetual desolation, of a land that should be full of ruins, and inhabited by the animals that usually make such ruins their abode.\"";
eastonArray["$$T0002816"] = "<strong>Ox:</strong> Heb. bakar, \"cattle;\" \"neat cattle\", (<a href=\"#\" onClick=\"return mV('Gen',12,16);\">Gen 12:16</a>; <a href=\"#\" onClick=\"return mV('Gen',34,28);\">34:28</a>; <a href=\"#\" onClick=\"return mV('Job',1,3,14);\">Job 1:3, 14</a>; <a href=\"#\" onClick=\"return mV('Job',42,12);\">42:12</a>, etc.); not to be muzzled when treading the corn (<a href=\"#\" onClick=\"return mV('Deu',25,4);\">Deu 25:4</a>). Referred to by our Lord in his reproof to the Pharisees (<a href=\"#\" onClick=\"return mV('Luk',13,15);\">Luk 13:15</a>; <a href=\"#\" onClick=\"return mV('Luk',14,5);\">14:5</a>).";
eastonArray["$$T0002817"] = "<strong>Ox goad:</strong> mentioned only in <a href=\"#\" onClick=\"return mV('Jdg',3,31);\">Jdg 3:31</a>, the weapon with which Shamgar (q.v.) slew six hundred Philistines. \"The ploughman still carries his goad, a weapon apparently more fitted for the hand of the soldier than the peaceful husbandman. The one I saw was of the 'oak of Bashan,' and measured upwards of ten feet in length. At one end was an iron spear, and at the other a piece of the same metal flattened. One can well understand how a warrior might use such a weapon with effect in the battle-field\" (Porter's Syria, etc.). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001508');\">GOAD</a>.)";
eastonArray["$$T0002818"] = "<strong>Ozem:</strong> strong.<br><br>(1.) One of David's brothers; the sixth son of Jesse (<a href=\"#\" onClick=\"return mV('1Ch',2,15);\">1Ch 2:15</a>).<br><br>(2.) A son of Jerahmeel (<a href=\"#\" onClick=\"return mV('1Ch',2,25);\">1Ch 2:25</a>).";
eastonArray["$$T0002819"] = "<strong>Ozias:</strong> son of Joram (<a href=\"#\" onClick=\"return mV('Mat',1,8);\">Mat 1:8</a>); called also Uzziah (<a href=\"#\" onClick=\"return mV('2Ki',15,32,34);\">2Ki 15:32, 34</a>).";
eastonArray["$$T0002820"] = "<strong>Ozni:</strong> hearing, one of the sons of Gad; also called Ezbon (<a href=\"#\" onClick=\"return mV('Gen',46,16);\">Gen 46:16</a>; <a href=\"#\" onClick=\"return mV('Num',26,16);\">Num 26:16</a>).";
eastonArray["$$T0002821"] = "<strong>Paarai:</strong> opening of the Lord, \"the Arbite,\" one of David's heroes (<a href=\"#\" onClick=\"return mV('2Sa',23,35);\">2Sa 23:35</a>); called also Naarai, <a href=\"#\" onClick=\"return mV('1Ch',11,37);\">1Ch 11:37</a>.";
eastonArray["$$T0002822"] = "<strong>Padan:</strong> a plain, occurring only in <a href=\"#\" onClick=\"return mV('Gen',48,7);\">Gen 48:7</a>, where it designates Padan-aram.";
eastonArray["$$T0002823"] = "<strong>Padan-aram:</strong> the plain of Aram, or the plain of the highlands, (<a href=\"#\" onClick=\"return mV('Gen',25,20);\">Gen 25:20</a>; <a href=\"#\" onClick=\"return mV('Gen',28,2,'5-7');\">28:2, 5-7</a>; <a href=\"#\" onClick=\"return mV('Gen',31,18);\">31:18</a>, etc.), commonly regarded as the district of Mesopotamia (q.v.) lying around Haran.";
eastonArray["$$T0002824"] = "<strong>Pagiel:</strong> God allots, a prince of the tribe of Asher (<a href=\"#\" onClick=\"return mV('Num',1,13);\">Num 1:13</a>), in the wilderness.";
eastonArray["$$T0002825"] = "<strong>Pahath-moab:</strong> governor of Moab, a person whose descendants returned from the Captivity and assisted in rebuilding Jerusalem (<a href=\"#\" onClick=\"return mV('Ezr',2,6);\">Ezr 2:6</a>; <a href=\"#\" onClick=\"return mV('Ezr',8,4);\">8:4</a>; <a href=\"#\" onClick=\"return mV('Ezr',10,30);\">10:30</a>).";
eastonArray["$$T0002826"] = "<strong>Paint:</strong> Jezebel \"painted her face\" (<a href=\"#\" onClick=\"return mV('2Ki',9,30);\">2Ki 9:30</a>); and the practice of painting the face and the eyes seems to have been common (<a href=\"#\" onClick=\"return mV('Jer',4,30);\">Jer 4:30</a>; <a href=\"#\" onClick=\"return mV('Eze',23,40);\">Eze 23:40</a>). An allusion to this practice is found in the name of Job's daughter (<a href=\"#\" onClick=\"return mV('Job',42,14);\">Job 42:14</a>) Kerenhappuch (q.v.). Paintings in the modern sense of the word were unknown to the ancient Jews.";
eastonArray["$$T0002827"] = "<strong>Palace:</strong> Used now only of royal dwellings, although originally meaning simply (as the Latin word palatium, from which it is derived, shows) a building surrounded by a fence or a paling. In the Authorized Version there are many different words so rendered, presenting different ideas, such as that of citadel or lofty fortress or royal residence (<a href=\"#\" onClick=\"return mV('Neh',1,1);\">Neh 1:1</a>; <a href=\"#\" onClick=\"return mV('Dan',8,2);\">Dan 8:2</a>). It is the name given to the temple fortress (<a href=\"#\" onClick=\"return mV('Neh',2,8);\">Neh 2:8</a>) and to the temple itself (<a href=\"#\" onClick=\"return mV('1Ch',29,1);\">1Ch 29:1</a>). It denotes also a spacious building or a great house (<a href=\"#\" onClick=\"return mV('Dan',1,4);\">Dan 1:4</a>; <a href=\"#\" onClick=\"return mV('Est',1,5);\">Est 1:5</a>; <a href=\"#\" onClick=\"return mV('Est',7,7);\">7:7</a>), and a fortified place or an enclosure (<a href=\"#\" onClick=\"return mV('Eze',25,4);\">Eze 25:4</a>). Solomon's palace is described in <a href=\"#\" onClick=\"return mV('1Ki',7,'1-12');\">1Ki 7:1-12</a> as a series of buildings rather than a single great structure. Thirteen years were spent in their erection. This palace stood on the eastern hill, adjoining the temple on the south.<br><br>In the New Testament it designates the official residence of Pilate or that of the high priest (<a href=\"#\" onClick=\"return mV('Mat',26,3,58,69);\">Mat 26:3, 58, 69</a>; <a href=\"#\" onClick=\"return mV('Mar',14,54,66);\">Mar 14:54, 66</a>; <a href=\"#\" onClick=\"return mV('Jhn',18,15);\">Jhn 18:15</a>). In <a href=\"#\" onClick=\"return mV('Phl',1,13);\">Phl 1:13</a> this word is the rendering of the Greek praitorion, meaning the praetorian cohorts at Rome (the life-guard of the Caesars). Paul was continually chained to a soldier of that corps (<a href=\"#\" onClick=\"return mV('Act',28,16);\">Act 28:16</a>), and hence his name and sufferings became known in all the praetorium. The \"soldiers that kept\" him would, on relieving one another on guard, naturally spread the tidings regarding him among their comrades. Some, however, regard the praetroium (q.v.) as the barrack within the palace (the palatium) of the Caesars in Rome where a detachment of these praetorian guards was stationed, or as the camp of the guards placed outside the eastern walls of Rome.<br><br>\"In the chambers which were occupied as guard-rooms,\" says Dr. Manning, \"by the praetorian troops on duty in the palace, a number of rude caricatures are found roughly scratched upon the walls, just such as may be seen upon barrack walls in every part of the world. Amongst these is one of a human figure nailed upon a cross. To add to the 'offence of the cross,' the crucified one is represented with the head of an animal, probably that of an ass. Before it stands the figure of a Roman legionary with one hand upraised in the attitude of worship. Underneath is the rude, misspelt, ungrammatical inscription, Alexamenos worships his god. It can scarcely be doubted that we have here a contemporary caricature, executed by one of the praetorian guard, ridiculing the faith of a Christian comrade.\"";
eastonArray["$$T0002828"] = "<strong>Palestine:</strong> originally denoted only the sea-coast of the land of Canaan inhabited by the Philistines (<a href=\"#\" onClick=\"return mV('Exd',15,14);\">Exd 15:14</a>; <a href=\"#\" onClick=\"return mV('Isa',14,29,31);\">Isa 14:29, 31</a>; <a href=\"#\" onClick=\"return mV('Joe',3,4);\">Joe 3:4</a>), and in this sense exclusively the Hebrew name Pelesheth (in <a href=\"#\" onClick=\"return mV('Psa',60,8);\">Psa 60:8</a>; <a href=\"#\" onClick=\"return mV('Psa',83,7);\">83:7</a>; <a href=\"#\" onClick=\"return mV('Psa',87,4);\">87:4</a>; <a href=\"#\" onClick=\"return mV('Psa',108,9);\">108:9</a>) occurs in the Old Testament.<br><br>Not till a late period in Jewish history was this name used to denote \"the land of the Hebrews\" in general (<a href=\"#\" onClick=\"return mV('Gen',40,15);\">Gen 40:15</a>). It is also called \"the holy land\" (<a href=\"#\" onClick=\"return mV('Zec',2,12);\">Zec 2:12</a>), the \"land of Jehovah\" (<a href=\"#\" onClick=\"return mV('Hsa',9,3);\">Hsa 9:3</a>; <a href=\"#\" onClick=\"return mV('Psa',85,1);\">Psa 85:1</a>), the \"land of promise\" (<a href=\"#\" onClick=\"return mV('Hbr',11,9);\">Hbr 11:9</a>), because promised to Abraham (<a href=\"#\" onClick=\"return mV('Gen',12,7);\">Gen 12:7</a>; <a href=\"#\" onClick=\"return mV('Gen',24,7);\">24:7</a>), the \"land of Canaan\" (<a href=\"#\" onClick=\"return mV('Gen',12,5);\">Gen 12:5</a>), the \"land of Israel\" (<a href=\"#\" onClick=\"return mV('1Sa',13,19);\">1Sa 13:19</a>), and the \"land of Judah\" (<a href=\"#\" onClick=\"return mV('Isa',19,17);\">Isa 19:17</a>).<br><br>The territory promised as an inheritance to the seed of Abraham (<a href=\"#\" onClick=\"return mV('Gen',15,'18-21');\">Gen 15:18-21</a>; <a href=\"#\" onClick=\"return mV('Num',34,'1-12');\">Num 34:1-12</a>) was bounded on the east by the river Euphrates, on the west by the Mediterranean, on the north by the \"entrance of Hamath,\" and on the south by the \"river of Egypt.\" This extent of territory, about 60,000 square miles, was at length conquered by David, and was ruled over also by his son Solomon (<a href=\"#\" onClick=\"return mV('2Sa',8,'1-')\">2Sa 8</a>; <a href=\"#\" onClick=\"return mV('1Ch',18,'1-')\">1Ch 18</a>; <a href=\"#\" onClick=\"return mV('1Ki',4,1,21);\">1Ki 4:1, 21</a>). This vast empire was the Promised Land; but Palestine was only a part of it, terminating in the north at the southern extremity of the Lebanon range, and in the south in the wilderness of Paran, thus extending in all to about 144 miles in length. Its average breadth was about 60 miles from the Mediterranean on the west to beyond the Jordan. It has fittingly been designated \"the least of all lands.\" Western Palestine, on the south of Gaza, is only about 40 miles in breadth from the Mediterranean to the Dead Sea, narrowing gradually toward the north, where it is only 20 miles from the sea-coast to the Jordan.<br><br>Palestine, \"set in the midst\" (<a href=\"#\" onClick=\"return mV('Eze',5,5);\">Eze 5:5</a>) of all other lands, is the most remarkable country on the face of the earth. No single country of such an extent has so great a variety of climate, and hence also of plant and animal life. Moses describes it as \"a good land, a land of brooks of water, of fountains and depths that spring out of valleys and hills; a land of wheat, and barley, and vines, and fig trees, and pomegranates; a land of oil olive, and honey; a land wherein thou shalt not eat bread without scarceness, thou shalt not lack any thing in it; a land whose stones are iron, and out of whose hills thou mayest dig brass\" (<a href=\"#\" onClick=\"return mV('Deu',8,'7-9');\">Deu 8:7-9</a>).<br><br>\"In the time of Christ the country looked, in all probability, much as now. The whole land consists of rounded limestone hills, fretted into countless stony valleys, offering but rarely level tracts, of which Esdraelon alone, below Nazareth, is large enough to be seen on the map. The original woods had for ages disappeared, though the slopes were dotted, as now, with figs, olives, and other fruit-trees where there was any soil. Permanent streams were even then unknown, the passing rush of winter torrents being all that was seen among the hills. The autumn and spring rains, caught in deep cisterns hewn out like huge underground jars in the soft limestone, with artificial mud-banked ponds still found near all villages, furnished water. Hills now bare, or at best rough with stunted growth, were then terraced, so as to grow vines, olives, and grain. To-day almost desolate, the country then teemed with population. Wine-presses cut in the rocks, endless terraces, and the ruins of old vineyard towers are now found amidst solitudes overgrown for ages with thorns and thistles, or with wild shrubs and poor gnarled scrub\" (Geikie's Life of Christ).<br><br>From an early period the land was inhabited by the descendants of Canaan, who retained possession of the whole land \"from Sidon to Gaza\" till the time of the conquest by Joshua, when it was occupied by the twelve tribes. Two tribes and a half had their allotments given them by Moses on the east of the Jordan (<a href=\"#\" onClick=\"return mV('Deu',3,'12-20');\">Deu 3:12-20</a>; <a href=\"#\" onClick=\"return mV('Num',1,'17-46');\">Num 1:17-46</a>; <a href=\"#\" onClick=\"return mV('Jos',4,12,13);\">Jos 4:12-13</a>). The remaining tribes had their portion on the west of Jordan.<br><br>From the conquest till the time of Saul, about four hundred years, the people were governed by judges. For a period of one hundred and twenty years the kingdom retained its unity while it was ruled by Saul and David and Solomon. On the death of Solomon, his son Rehoboam ascended the throne; but his conduct was such that ten of the tribes revolted, and formed an independent monarchy, called the kingdom of Israel, or the northern kingdom, the capital of which was first Shechem and afterwards Samaria. This kingdom was destroyed. The Israelites were carried captive by Shalmanezer, king of Assyria, B.C. 722, after an independent existence of two hundred and fifty-three years. The place of the captives carried away was supplied by tribes brought from the east, and thus was formed the Samaritan nation (<a href=\"#\" onClick=\"return mV('2Ki',17,'24-29');\">2Ki 17:24-29</a>).<br><br>Nebuchadnezzar came up against the kingdom of the two tribes, the kingdom of Judah, the capital of which was Jerusalem, one hundred and thirty-four years after the overthrow of the kingdom of Israel. He overthrew the city, plundered the temple, and carried the people into captivity to Babylon (B.C. 587), where they remained seventy years. At the close of the period of the Captivity, they returned to their own land, under the edict of Cyrus (<a href=\"#\" onClick=\"return mV('Ezr',1,'1-4');\">Ezr 1:1-4</a>). They rebuilt the city and temple, and restored the old Jewish commonwealth.<br><br>For a while after the Restoration the Jews were ruled by Zerubbabel, Ezra, and Nehemiah, and afterwards by the high priests, assisted by the Sanhedrin. After the death of Alexander the Great at Babylon (B.C. 323), his vast empire was divided between his four generals. Egypt, Arabia, Palestine, and Coele-Syria fell to the lot of Ptolemy Lagus. Ptolemy took possession of Palestine in B.C. 320, and carried nearly one hundred thousand of the inhabitants of Jerusalem into Egypt. He made Alexandria the capital of his kingdom, and treated the Jews with consideration, confirming them in the enjoyment of many privileges.<br><br>After suffering persecution at the hands of Ptolemy's successors, the Jews threw off the Egyptian yoke, and became subject to Antiochus the Great, the king of Syria. The cruelty and opression of the successors of Antiochus at length led to the revolt under the Maccabees (B.C. 163), when they threw off the Syrian yoke.<br><br>In the year B.C. 68, Palestine was reduced by Pompey the Great to a Roman province. He laid the walls of the city in ruins, and massacred some twelve thousand of the inhabitants. He left the temple, however, uninjured. About twenty-five years after this the Jews revolted and cast off the Roman yoke. They were however, subdued by Herod the Great (q.v.). The city and the temple were destroyed, and many of the inhabitants were put to death. About B.C. 20, Herod proceeded to rebuild the city and restore the ruined temple, which in about nine years and a half was so far completed that the sacred services could be resumed in it (<a href=\"#\" onClick=\"return mV('Jhn',2,20);\">Jhn 2:20</a>). He was succeeded by his son Archelaus, who was deprived of his power, however, by Augustus, A.D. 6, when Palestine became a Roman province, ruled by Roman governors or procurators. Pontius Pilate was the fifth of these procurators. He was appointed to his office A.D. 25.<br><br>Exclusive of Idumea, the kingdom of Herod the Great comprehended the whole of the country originally divided among the twelve tribes, which he divided into four provinces or districts. This division was recognized so long as Palestine was under the Roman dominion. These four provinces were,<br><br>(1) Judea, the southern portion of the country;<br><br>(2) Samaria, the middle province, the northern boundary of which ran along the hills to the south of the plain of Esdraelon;<br><br>(3) Galilee, the northern province; and<br><br>(4) Peraea (a Greek name meaning the \"opposite country\"), the country lying east of the Jordan and the Dead Sea. <br><br>This province was subdivided into these districts,<br><br>(1) Peraea proper, lying between the rivers Arnon and Jabbok;<br><br>(2) Galaaditis (Gilead);<br><br>(3) Batanaea;<br><br>(4) Gaulonitis (Jaulan);<br><br>(5) Ituraea or Auranitis, the ancient Bashan;<br><br>(6) Trachonitis;<br><br>(7) Abilene;<br><br>(8) Decapolis, i.e., the region of the ten cities. The whole territory of Palestine, including the portions alloted to the trans-Jordan tribes, extended to about eleven thousand square miles. Recent exploration has shown the territory on the west of Jordan alone to be six thousand square miles in extent, the size of the principality of Wales.";
eastonArray["$$T0002829"] = "<strong>Pallu:</strong> separated, the second son of Reuben (<a href=\"#\" onClick=\"return mV('1Ch',5,3);\">1Ch 5:3</a>); called Phallu, <a href=\"#\" onClick=\"return mV('Gen',46,9);\">Gen 46:9</a>. He was the father of the Phalluites (<a href=\"#\" onClick=\"return mV('Exd',6,14);\">Exd 6:14</a>; <a href=\"#\" onClick=\"return mV('Num',26,5,8);\">Num 26:5, 8</a>).";
eastonArray["$$T0002830"] = "<strong>Palmer-worm:</strong> (Heb. gazam). The English word may denote either a caterpillar (as rendered by the LXX.), which wanders like a palmer or pilgrim, or which travels like pilgrims in bands (<a href=\"#\" onClick=\"return mV('Joe',1,4);\">Joe 1:4</a>; <a href=\"#\" onClick=\"return mV('Joe',2,25);\">2:25</a>), the wingless locusts, or the migratory locust in its larva state.";
eastonArray["$$T0002831"] = "<strong>Palm tree:</strong> (Heb. tamar), the date-palm characteristic of Palestine. It is described as \"flourishing\" (<a href=\"#\" onClick=\"return mV('Psa',92,12);\">Psa 92:12</a>), tall (<a href=\"#\" onClick=\"return mV('Sgs',7,7);\">Sgs 7:7</a>), \"upright\" (<a href=\"#\" onClick=\"return mV('Jer',10,5);\">Jer 10:5</a>). Its branches are a symbol of victory (<a href=\"#\" onClick=\"return mV('Rev',7,9);\">Rev 7:9</a>). \"Rising with slender stem 40 or 50, at times even 80, feet aloft, its only branches, the feathery, snow-like, pale-green fronds from 6 to 12 feet long, bending from its top, the palm attracts the eye wherever it is seen.\" The whole land of Palestine was called by the Greeks and Romans Phoenicia, i.e., \"the land of palms.\" Tadmor in the desert was called by the Greeks and Romans Palmyra, i.e., \"the city of palms.\" The finest specimens of this tree grew at Jericho (<a href=\"#\" onClick=\"return mV('Deu',34,3);\">Deu 34:3</a>) and Engedi and along the banks of the Jordan. Branches of the palm tree were carried at the feast of Tabernacles (<a href=\"#\" onClick=\"return mV('Lev',23,40);\">Lev 23:40</a>). At our Lord's triumphal entrance into Jerusalem the crowds took palm branches, and went forth to meet him, crying, \"Hosanna: Blessed is the King of Israel that cometh in the name of the Lord\" (<a href=\"#\" onClick=\"return mV('Mat',21,8);\">Mat 21:8</a>; <a href=\"#\" onClick=\"return mV('Jhn',12,13);\">Jhn 12:13</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000979');\">DATE</a>.)";
eastonArray["$$T0002832"] = "<strong>Palm trees, The city of:</strong> the name given to Jericho (q.v.), <a href=\"#\" onClick=\"return mV('Deu',34,3);\">Deu 34:3</a>; <a href=\"#\" onClick=\"return mV('Jdg',1,16);\">Jdg 1:16</a>; 3:13.";
eastonArray["$$T0002833"] = "<strong>Palsy:</strong> a shorter form of \"paralysis.\" Many persons thus afflicted were cured by our Lord (<a href=\"#\" onClick=\"return mV('Mat',4,24);\">Mat 4:24</a>; <a href=\"#\" onClick=\"return mV('Mat',8,'5-13');\">8:5-13</a>; <a href=\"#\" onClick=\"return mV('Mat',9,'2-7');\">9:2-7</a>; <a href=\"#\" onClick=\"return mV('Mar',2,'3-11');\">Mar 2:3-11</a>; <a href=\"#\" onClick=\"return mV('Luk',7,'2-10');\">Luk 7:2-10</a>; <a href=\"#\" onClick=\"return mV('Jhn',5,'5-7');\">Jhn 5:5-7</a>) and the apostles (<a href=\"#\" onClick=\"return mV('Act',8,7);\">Act 8:7</a>; <a href=\"#\" onClick=\"return mV('Act',9,33,34);\">9:33-34</a>).";
eastonArray["$$T0002834"] = "<strong>Palti:</strong> deliverance from the Lord, one of the spies representing the tribe of Benjamin (<a href=\"#\" onClick=\"return mV('Num',13,9);\">Num 13:9</a>).";
eastonArray["$$T0002835"] = "<strong>Paltiel:</strong> deliverance of God, the prince of Issachar who assisted \"to divide the land by inheritance\" (<a href=\"#\" onClick=\"return mV('Num',34,26);\">Num 34:26</a>).";
eastonArray["$$T0002836"] = "<strong>Paltite:</strong> the designation of one of David's heroes (<a href=\"#\" onClick=\"return mV('2Sa',23,26);\">2Sa 23:26</a>); called also the Pelonite (<a href=\"#\" onClick=\"return mV('1Ch',11,27);\">1Ch 11:27</a>).";
eastonArray["$$T0002837"] = "<strong>Pamphylia:</strong> Paul and his company, loosing from Paphos, sailed north-west and came to Perga, the capital of Pamphylia (<a href=\"#\" onClick=\"return mV('Act',13,13,14);\">Act 13:13-14</a>), a province about the middle of the southern sea-board of Asia Minor. It lay between Lycia on the west and Cilicia on the east. There were strangers from Pamphylia at Jerusalem on the day of Pentecost (<a href=\"#\" onClick=\"return mV('Act',2,10);\">2:10</a>).";
eastonArray["$$T0002838"] = "<strong>Pan:</strong> a vessel of metal or earthenware used in culinary operations; a cooking-pan or frying-pan frequently referred to in the Old Testament (<a href=\"#\" onClick=\"return mV('Lev',2,5);\">Lev 2:5</a>; <a href=\"#\" onClick=\"return mV('Lev',6,21);\">6:21</a>; <a href=\"#\" onClick=\"return mV('Num',11,8);\">Num 11:8</a>; <a href=\"#\" onClick=\"return mV('1Sa',2,14);\">1Sa 2:14</a>, etc.).<br><br>The \"ash-pans\" mentioned in <a href=\"#\" onClick=\"return mV('Exd',27,3);\">Exd 27:3</a> were made of copper, and were used in connection with the altar of burnt-offering. The \"iron pan\" mentioned in <a href=\"#\" onClick=\"return mV('Eze',4,3);\">Eze 4:3</a> (marg., \"flat plate \" or \"slice\") was probably a mere plate of iron used for baking. The \"fire-pans\" of <a href=\"#\" onClick=\"return mV('Exd',27,3);\">Exd 27:3</a> were fire-shovels used for taking up coals. The same Hebrew word is rendered \"snuff-dishes\" (<a href=\"#\" onClick=\"return mV('Exd',25,38);\">25:38</a>; <a href=\"#\" onClick=\"return mV('Exd',37,23);\">37:23</a>) and \"censers\" (<a href=\"#\" onClick=\"return mV('Lev',10,1);\">Lev 10:1</a>; <a href=\"#\" onClick=\"return mV('Lev',16,12);\">16:12</a>; <a href=\"#\" onClick=\"return mV('Num',4,14);\">Num 4:14</a>, etc.). These were probably simply metal vessels employed for carrying burning embers from the brazen altar to the altar of incense.<br><br>The \"frying-pan\" mentioned in <a href=\"#\" onClick=\"return mV('Lev',2,7);\">Lev 2:7</a>; <a href=\"#\" onClick=\"return mV('Lev',7,9);\">7:9</a> was a pot for boiling.";
eastonArray["$$T0002839"] = "<strong>Pannag:</strong> (<a href=\"#\" onClick=\"return mV('Eze',27,17);\">Eze 27:17</a>; marg. R.V., \"perhaps a kind of confection\") the Jews explain as the name of a kind of sweet pastry. Others take it as the name of some place, identifying it with Pingi, on the road between Damascus and Baalbec. \"Pannaga\" is the Sanscrit name of an aromatic plant (<a href=\"#\" onClick=\"return mV('Gen',43,11);\">Gen 43:11</a>).";
eastonArray["$$T0002840"] = "<strong>Paper:</strong> The expression in the Authorized Version (<a href=\"#\" onClick=\"return mV('Isa',19,7);\">Isa 19:7</a>), \"the paper reeds by the brooks,\" is in the Revised Version more correctly \"the meadows by the Nile.\" The words undoubtedly refer to a grassy place on the banks of the Nile fit for pasturage.<br><br>In <a href=\"#\" onClick=\"return mV('2Jo',1,12);\">2Jo 1:12</a> the word is used in its proper sense. The material so referred to was manufactured from the papyrus, and hence its name. The papyrus (Heb. gome) was a kind of bulrush (q.v.). It is mentioned by Job (<a href=\"#\" onClick=\"return mV('Job',8,11);\">Job 8:11</a>) and Isaiah (<a href=\"#\" onClick=\"return mV('Isa',35,7);\">Isa 35:7</a>). It was used for many purposes. This plant (<i>Papyrus Nilotica</i>) is now unknown in Egypt; no trace of it can be found. The unaccountable disappearance of this plant from Egypt was foretold by Isaiah (<a href=\"#\" onClick=\"return mV('Isa',19,6,7);\">Isa 19:6-7</a>) as a part of the divine judgment on that land. The most extensive papyrus growths now known are in the marshes at the northern end of the lake of Merom.";
eastonArray["$$T0002841"] = "<strong>Paphos:</strong> the capital of the island of Cyprus, and therefore the residence of the Roman governor. It was visited by Paul and Barnabas on their first missionary tour (<a href=\"#\" onClick=\"return mV('Act',13,6);\">Act 13:6</a>). It is new Paphos which is here meant. It lay on the west coast of the island, about 8 miles north of old Paphos. Its modern name is Baffa.";
eastonArray["$$T0002842"] = "<strong>Parable:</strong> (Gr. parabole), a placing beside; a comparison; equivalent to the Heb. mashal, a similitude. In the Old Testament this is used to denote<br><br>(1) a proverb (<a href=\"#\" onClick=\"return mV('1Sa',10,12);\">1Sa 10:12</a>; <a href=\"#\" onClick=\"return mV('1Sa',24,13);\">24:13</a>; <a href=\"#\" onClick=\"return mV('2Ch',7,20);\">2Ch 7:20</a>),<br><br>(2) a prophetic utterance (<a href=\"#\" onClick=\"return mV('Num',23,7);\">Num 23:7</a>; <a href=\"#\" onClick=\"return mV('Eze',20,49);\">Eze 20:49</a>),<br><br>(3) an enigmatic saying (<a href=\"#\" onClick=\"return mV('Psa',78,2);\">Psa 78:2</a>; <a href=\"#\" onClick=\"return mV('Pro',1,6);\">Pro 1:6</a>).<br><br>In the New Testament,<br><br>(1) a proverb (<a href=\"#\" onClick=\"return mV('Mar',7,17);\">Mar 7:17</a>; <a href=\"#\" onClick=\"return mV('Luk',4,23);\">Luk 4:23</a>),<br><br>(2) a typical emblem (<a href=\"#\" onClick=\"return mV('Hbr',9,9);\">Hbr 9:9</a>; <a href=\"#\" onClick=\"return mV('Hbr',11,19);\">11:19</a>),<br><br>(3) a similitude or allegory (<a href=\"#\" onClick=\"return mV('Mat',15,15);\">Mat 15:15</a>; <a href=\"#\" onClick=\"return mV('Mat',24,32);\">24:32</a>; <a href=\"#\" onClick=\"return mV('Mar',3,23);\">Mar 3:23</a>; <a href=\"#\" onClick=\"return mV('Luk',5,36);\">Luk 5:36</a>; <a href=\"#\" onClick=\"return mV('Luk',14,7);\">14:7</a>);<br><br>(4) ordinarily, in a more restricted sense, a comparison of earthly with heavenly things, \"an earthly story with a heavenly meaning,\" as in the parables of our Lord.<br><br>Instruction by parables has been in use from the earliest times. A large portion of our Lord's public teaching consisted of parables. He himself explains his reasons for this in his answer to the inquiry of the disciples, \"Why speakest thou to them in parables?\" (<a href=\"#\" onClick=\"return mV('Mat',13,'13-15');\">Mat 13:13-15</a>; <a href=\"#\" onClick=\"return mV('Mar',4,11,12);\">Mar 4:11-12</a>; <a href=\"#\" onClick=\"return mV('Luk',8,9,10);\">Luk 8:9-10</a>). He followed in so doing the rule of the divine procedures, as recorded in <a href=\"#\" onClick=\"return mV('Mat',13,13);\">Mat 13:13</a>.<br><br>The parables uttered by our Lord are all recorded in the synoptical (i.e., the first three) Gospels. The fourth Gospel contains no parable properly so called, although the illustration of the good shepherd (<a href=\"#\" onClick=\"return mV('Jhn',10,'1-16');\">Jhn 10:1-16</a>) has all the essential features of a parable. (See List of Parables in Appendix.)";
eastonArray["$$T0002843"] = "<strong>Paradise:</strong> a Persian word (pardes), properly meaning a \"pleasure-ground\" or \"park\" or \"king's garden.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0001127');\">EDEN</a>.) It came in course of time to be used as a name for the world of happiness and rest hereafter (<a href=\"#\" onClick=\"return mV('Luk',23,43);\">Luk 23:43</a>; <a href=\"#\" onClick=\"return mV('2Cr',12,4);\">2Cr 12:4</a>; <a href=\"#\" onClick=\"return mV('Rev',2,7);\">Rev 2:7</a>). For \"garden\" in <a href=\"#\" onClick=\"return mV('Gen',2,8);\">Gen 2:8</a> the LXX. has \"paradise.\"";
eastonArray["$$T0002844"] = "<strong>Parah:</strong> the heifer, a town in Benjamin (<a href=\"#\" onClick=\"return mV('Jos',18,23);\">Jos 18:23</a>), supposed to be identical with the ruins called Far'ah, about 6 miles north-east of Jerusalem, in the Wady Far'ah, which is a branch of the Wady Kelt.";
eastonArray["$$T0002845"] = "<strong>Paran:</strong> abounding in foliage, or abounding in caverns, (<a href=\"#\" onClick=\"return mV('Gen',21,21);\">Gen 21:21</a>), a desert tract forming the north-eastern division of the peninsula of Sinai, lying between the 'Arabah on the east and the wilderness of Shur on the west. It is intersected in a north-western direction by the Wady el-'Arish. It bears the modern name of Badiet et-Tih, i.e., \"the desert of the wanderings.\" This district, through which the children of Israel wandered, lay three days' march from Sinai (<a href=\"#\" onClick=\"return mV('Num',10,12,33);\">Num 10:12, 33</a>). From Kadesh, in this wilderness, spies (q.v.) were sent to spy the land (<a href=\"#\" onClick=\"return mV('Num',13,3,26);\">13:3, 26</a>). Here, long afterwards, David found refuge from Saul (<a href=\"#\" onClick=\"return mV('1Sa',25,1,4);\">1Sa 25:1, 4</a>).";
eastonArray["$$T0002846"] = "<strong>Paran, Mount:</strong> probably the hilly region or upland wilderness on the north of the desert of Paran forming the southern boundary of the Promised Land (<a href=\"#\" onClick=\"return mV('Deu',33,2);\">Deu 33:2</a>; <a href=\"#\" onClick=\"return mV('Hab',3,3);\">Hab 3:3</a>).";
eastonArray["$$T0002847"] = "<strong>Parbar:</strong> (<a href=\"#\" onClick=\"return mV('1Ch',26,18);\">1Ch 26:18</a>), a place apparently connected with the temple, probably a \"suburb\" (q.v.), as the word is rendered in <a href=\"#\" onClick=\"return mV('2Ki',23,11);\">2 Kings 23:11</a>; a space between the temple wall and the wall of the court; an open portico into which the chambers of the official persons opened (<a href=\"#\" onClick=\"return mV('1Ch',26,18);\">1Ch 26:18</a>).";
eastonArray["$$T0002848"] = "<strong>Parched ground:</strong> (<a href=\"#\" onClick=\"return mV('Isa',35,7);\">Isa 35:7</a>), Heb. sharab, a \"mirage\", a phenomenon caused by the refraction of the rays of the sun on the glowing sands of the desert, causing them suddenly to assume the appearance of a beautiful lake. It is called by the modern Arabs by the same Hebrew name <i>serab</i>.";
eastonArray["$$T0002849"] = "<strong>Parchment:</strong> a skin prepared for writing on; so called from Pergamos (q.v.), where this was first done (<a href=\"#\" onClick=\"return mV('2Ti',4,13);\">2Ti 4:13</a>).";
</script>
