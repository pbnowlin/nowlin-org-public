<script src="./js/NoNavHeader.js"  type="text/javascript"></script>
<script>
var eastonArray = new Array ();
eastonArray["$$T0003250"] = "<strong>Sea, The:</strong> (Heb. yam), signifies<br><br>(1) \"the gathering together of the waters,\" the ocean (<a href=\"#\" onClick=\"return mV('Gen',1,10);\">Gen 1:10</a>);<br><br>(2) a river, as the Nile (<a href=\"#\" onClick=\"return mV('Isa',19,5);\">Isa 19:5</a>), the Euphrates (<a href=\"#\" onClick=\"return mV('Isa',21,1);\">Isa 21:1</a>; <a href=\"#\" onClick=\"return mV('Jer',51,36);\">Jer 51:36</a>);<br><br>(3) the Red Sea (<a href=\"#\" onClick=\"return mV('Exd',14,16,27);\">Exd 14:16, 27</a>; <a href=\"#\" onClick=\"return mV('Exd',15,4);\">15:4</a>, etc.);<br><br>(4) the Mediterranean (<a href=\"#\" onClick=\"return mV('Exd',23,31);\">Exd 23:31</a>; <a href=\"#\" onClick=\"return mV('Num',34,6,7);\">Num 34:6-7</a>; <a href=\"#\" onClick=\"return mV('Jos',15,47);\">Jos 15:47</a>; <a href=\"#\" onClick=\"return mV('Psa',80,11);\">Psa 80:11</a>, etc.);<br><br>(5) the \"sea of Galilee,\" an inland fresh-water lake, and<br><br>(6) the Dead Sea or \"salt sea\" (<a href=\"#\" onClick=\"return mV('Gen',14,3);\">Gen 14:3</a>; <a href=\"#\" onClick=\"return mV('Num',34,3,12);\">Num 34:3, 12</a>, etc.). The word \"sea\" is used symbolically in <a href=\"#\" onClick=\"return mV('Isa',60,5);\">Isa 60:5</a>, where it probably means the nations around the Mediterranean. In <a href=\"#\" onClick=\"return mV('Dan',7,3);\">Dan 7:3</a>; <a href=\"#\" onClick=\"return mV('Rev',13,1);\">Rev 13:1</a> it may mean the tumultuous changes among the nations of the earth.";
eastonArray["$$T0003251"] = "<strong>Sea, The molten:</strong> the great laver made by Solomon for the use of the priests in the temple, described in <a href=\"#\" onClick=\"return mV('1Ki',7,'23-26');\">1Ki 7:23-26</a>; <a href=\"#\" onClick=\"return mV('2Ch',4,'2-5');\">2Ch 4:2-5</a>. It stood in the south-eastern corner of the inner court. It was 5 cubits high, 10 in diameter from brim to brim, and 30 in circumference. It was placed on the backs of twelve oxen, standing with their faces outward. It was capable of containing two or three thousand baths of water (<a href=\"#\" onClick=\"return mV('2Ch',4,5);\">2Ch 4:5</a>), which was originally supplied by the Gibeonites, but was afterwards brought by a conduit from the pools of Bethlehem. It was made of \"brass\" (copper), which Solomon had taken from the captured cities of Hadarezer, the king of Zobah (<a href=\"#\" onClick=\"return mV('1Ch',18,8);\">1Ch 18:8</a>). Ahaz afterwards removed this laver from the oxen, and placed it on a stone pavement (<a href=\"#\" onClick=\"return mV('2Ki',16,17);\">2Ki 16:17</a>). It was destroyed by the Chaldeans (<a href=\"#\" onClick=\"return mV('2Ki',25,13);\">25:13</a>).";
eastonArray["$$T0003252"] = "<strong>Seba:</strong><br><br>(1.) One of the sons of Cush (<a href=\"#\" onClick=\"return mV('Gen',10,7);\">Gen 10:7</a>).<br><br>(2.) The name of a country and nation (<a href=\"#\" onClick=\"return mV('Isa',43,3);\">Isa 43:3</a>; <a href=\"#\" onClick=\"return mV('Isa',45,14);\">45:14</a>) mentioned along with Egypt and Ethiopia, and therefore probably in north-eastern Africa. The ancient name of Meroe. The kings of Sheba and Seba are mentioned together in <a href=\"#\" onClick=\"return mV('Psa',72,10);\">Psa 72:10</a>.";
eastonArray["$$T0003253"] = "<strong>Sebat:</strong> the eleventh month of the Hebrew year, extending from the new moon of February to that of March (<a href=\"#\" onClick=\"return mV('Zec',1,7);\">Zec 1:7</a>). Assyrian sabatu, \"storm.\" (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002592');\">MONTH</a>.)";
eastonArray["$$T0003254"] = "<strong>Secacah:</strong> enclosure, one of the six cities in the wilderness of Judah, noted for its \"great cistern\" (<a href=\"#\" onClick=\"return mV('Jos',15,61);\">Jos 15:61</a>). It has been identified with the ruin Sikkeh, east of Bethany.";
eastonArray["$$T0003255"] = "<strong>Sechu:</strong> a hill or watch-tower, a place between Gibeah and Ramah noted for its \"great well\" (<a href=\"#\" onClick=\"return mV('1Sa',19,22);\">1Sa 19:22</a>); probably the modern Suweikeh, south of Beeroth.";
eastonArray["$$T0003256"] = "<strong>Sect:</strong> (<a href=\"#\" onClick=\"return mV('Act',24,14);\">Act 24:14</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,19);\">1Ch 11:19</a>; <a href=\"#\" onClick=\"return mV('Gal',5,20);\">Gal 5:20</a>, etc.), meaning properly \"a choice,\" then \"a chosen manner of life,\" and then \"a religious party,\" as the \"sect\" of the Sadducees (<a href=\"#\" onClick=\"return mV('Act',5,17);\">Act 5:17</a>), of the Pharisees (<a href=\"#\" onClick=\"return mV('Act',15,5);\">15:5</a>), the Nazarenes, i.e., Christians (<a href=\"#\" onClick=\"return mV('Act',24,5);\">24:5</a>). It afterwards came to be used in a bad sense, of those holding pernicious error, divergent forms of belief (<a href=\"#\" onClick=\"return mV('2Pe',2,1);\">2Pe 2:1</a>; <a href=\"#\" onClick=\"return mV('Gal',5,20);\">Gal 5:20</a>).";
eastonArray["$$T0003257"] = "<strong>Secundus:</strong> second, a Christian of Thessalonica who accompanied Paul into Asia (<a href=\"#\" onClick=\"return mV('Act',20,4);\">Act 20:4</a>).";
eastonArray["$$T0003258"] = "<strong>Seer:</strong> a name sometimes applied to the prophets because of the visions granted to them. It is first found in <a href=\"#\" onClick=\"return mV('1Sa',9,9);\">1Sa 9:9</a>. It is afterwards applied to Zadok, Gad, etc. (<a href=\"#\" onClick=\"return mV('2Sa',15,27);\">2Sa 15:27</a>; <a href=\"#\" onClick=\"return mV('2Sa',24,11);\">24:11</a>; <a href=\"#\" onClick=\"return mV('1Ch',9,22);\">1Ch 9:22</a>; <a href=\"#\" onClick=\"return mV('1Ch',25,5);\">25:5</a>; <a href=\"#\" onClick=\"return mV('2Ch',9,29);\">2Ch 9:29</a>; <a href=\"#\" onClick=\"return mV('Amo',7,12);\">Amo 7:12</a>; <a href=\"#\" onClick=\"return mV('Mic',3,7);\">Mic 3:7</a>). The \"sayings of the seers\" (<a href=\"#\" onClick=\"return mV('2Ch',33,18,19);\">2Ch 33:18-19</a>) is rendered in the Revised Version \"the history of Hozai\" (marg., the seers; so the LXX.), of whom, however, nothing is known. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003006');\">PROPHET</a>.)";
eastonArray["$$T0003259"] = "<strong>Seethe:</strong> to boil (<a href=\"#\" onClick=\"return mV('Exd',16,23);\">Exd 16:23</a>).";
eastonArray["$$T0003260"] = "<strong>Seething pot:</strong> a vessel for boiling provisions in (<a href=\"#\" onClick=\"return mV('Job',41,20);\">Job 41:20</a>; <a href=\"#\" onClick=\"return mV('Jer',1,13);\">Jer 1:13</a>).";
eastonArray["$$T0003261"] = "<strong>Segub:</strong> elevated.<br><br>(1.) The youngest son of Hiel the Bethelite. His death is recorded in <a href=\"#\" onClick=\"return mV('1Ki',16,34);\">1Ki 16:34</a> (<a href=\"#\" onClick=\"return mV('Jos',6,26);\">Jos 6:26</a>).<br><br>(2.) A descendant of Judah (<a href=\"#\" onClick=\"return mV('1Ch',2,21,22);\">1Ch 2:21-22</a>).";
eastonArray["$$T0003262"] = "<strong>Seir:</strong> rough; hairy.<br><br>(1.) A Horite; one of the \"dukes\" of Edom (<a href=\"#\" onClick=\"return mV('Gen',36,'20-30');\">Gen 36:20-30</a>).<br><br>(2.) The name of a mountainous region occupied by the Edomites, extending along the eastern side of the Arabah from the south-eastern extremity of the Dead Sea to near the Akabah, or the eastern branch of the Red Sea. It was originally occupied by the Horites (<a href=\"#\" onClick=\"return mV('Gen',14,6);\">Gen 14:6</a>), who were afterwards driven out by the Edomites (<a href=\"#\" onClick=\"return mV('Gen',32,3);\">Gen 32:3</a>; <a href=\"#\" onClick=\"return mV('Gen',33,14,16);\">33:14, 16</a>). It was allotted to the descendants of Esau (<a href=\"#\" onClick=\"return mV('Deu',2,4,22);\">Deu 2:4, 22</a>; <a href=\"#\" onClick=\"return mV('Jos',24,4);\">Jos 24:4</a>; <a href=\"#\" onClick=\"return mV('2Ch',20,10);\">2Ch 20:10</a>; <a href=\"#\" onClick=\"return mV('Isa',21,11);\">Isa 21:11</a>; <a href=\"#\" onClick=\"return mV('Eze',25,8);\">Eze 25:8</a>).<br><br>(3.) A mountain range (<a href=\"#\" onClick=\"return mV('Gen',32,3);\">Gen 32:3</a>) lying between the Wady Aly and the Wady Ghurab (<a href=\"#\" onClick=\"return mV('Jos',15,10);\">Jos 15:10</a>).";
eastonArray["$$T0003263"] = "<strong>Seirath:</strong> woody district; shaggy, a place among the mountains of Ephraim, bordering on Benjamin, to which Ehud fled after he had assassinated Eglon at Jericho (<a href=\"#\" onClick=\"return mV('Jdg',3,26,27);\">Jdg 3:26-27</a>).";
eastonArray["$$T0003264"] = "<strong>Sela:</strong> =Se'lah, rock, the capital of Edom, situated in the great valley extending from the Dead Sea to the Red Sea (<a href=\"#\" onClick=\"return mV('2Ki',14,7);\">2Ki 14:7</a>). It was near Mount Hor, close by the desert of Zin. It is called \"the rock\" (<a href=\"#\" onClick=\"return mV('Jdg',1,36);\">Jdg 1:36</a>). When Amaziah took it he called it Joktheel (q.v.) It is mentioned by the prophets (<a href=\"#\" onClick=\"return mV('Isa',16,1);\">Isa 16:1</a>; <a href=\"#\" onClick=\"return mV('Oba',1,3);\">Oba 1:3</a>) as doomed to destruction.<br><br>It appears in later history and in the Vulgate Version under the name of Petra. \"The caravans from all ages, from the interior of Arabia and from the Gulf of Persia, from Hadramaut on the ocean, and even from Sabea or Yemen, appear to have pointed to Petra as a common centre; and from Petra the tide seems again to have branched out in every direction, to Egypt, Palestine, and Syria, through Arsinoe, Gaza, Tyre, Jerusalem, and Damascus, and by other routes, terminating at the Mediterranean.\" (See <a href=\"#\" onClick=\"return doDictLookup ('ET0001129');\">EDOM [2]</a>.)";
eastonArray["$$T0003265"] = "<strong>Selah:</strong> a word frequently found in the Book of Psalms, and also in <a href=\"#\" onClick=\"return mV('Hab',3,9,13);\">Hab 3:9, 13</a>, about seventy-four times in all in Scripture. Its meaning is doubtful. Some interpret it as meaning \"silence\" or \"pause;\" others, \"end,\" \"a louder strain,\" \"piano,\" etc. The LXX. render the word by daplasma i.e., \"a division.\"";
eastonArray["$$T0003266"] = "<strong>Sela-hammahlekoth:</strong> cliff of divisions the name of the great gorge which lies between Hachilah and Maon, south-east of Hebron. This gorge is now called the Wady Malaky. This was the scene of the interview between David and Saul mentioned in <a href=\"#\" onClick=\"return mV('1Sa',26,13);\">1Sa 26:13</a>. Each stood on an opposing cliff, with this deep chasm between.";
eastonArray["$$T0003267"] = "<strong>Seleucia:</strong> the sea-port of Antioch, near the mouth of the Orontes. Paul and his companions sailed from this port on their first missionary journey (<a href=\"#\" onClick=\"return mV('Act',13,4);\">Act 13:4</a>). This city was built by Seleucus Nicator, the \"king of Syria.\" It is said of him that \"few princes have ever lived with so great a passion for the building of cities. He is reputed to have built in all nine Seleucias, sixteen Antiochs, and six Laodiceas.\" Seleucia became a city of great importance, and was made a \"free city\" by Pompey. It is now a small village, called el-Kalusi.";
eastonArray["$$T0003268"] = "<strong>Semei:</strong> mentioned in the genealogy of our Lord (<a href=\"#\" onClick=\"return mV('Luk',3,26);\">Luk 3:26</a>).";
eastonArray["$$T0003269"] = "<strong>Senaah:</strong> thorny, a place many of the inhabitants of which returned from Babylon with Zerubbabel (<a href=\"#\" onClick=\"return mV('Ezr',2,35);\">Ezr 2:35</a>; <a href=\"#\" onClick=\"return mV('Neh',7,38);\">Neh 7:38</a>).";
eastonArray["$$T0003270"] = "<strong>Senate:</strong> (<a href=\"#\" onClick=\"return mV('Act',5,21);\">Act 5:21</a>), the \"elders of Israel\" who formed a component part of the Sanhedrin.";
eastonArray["$$T0003271"] = "<strong>Seneh:</strong> the acacia; rock-thorn, the southern cliff in the Wady es-Suweinit, a valley south of Michmash, which Jonathan climbed with his armour-bearer (<a href=\"#\" onClick=\"return mV('1Sa',14,4,5);\">1Sa 14:4-5</a>). The rock opposite, on the other side of the wady, was called Bozez.";
eastonArray["$$T0003272"] = "<strong>Senir:</strong> =Shenir, the name given to Hermon by the Amorites (<a href=\"#\" onClick=\"return mV('Deu',3,9);\">Deu 3:9</a>). It means \"coat of mail\" or \"breastplate,\" and is equivalent to \"Sirion.\" Some interpret the word as meaning \"the prominent\" or \"the snowy mountain.\" It is properly the name of the central of the three summits of Hermon (q.v.).";
eastonArray["$$T0003273"] = "<strong>Sennacherib:</strong> Sin (the god) sends many brothers, son of Sargon, whom he succeeded on the throne of Assyria (B.C. 705), in the 23rd year of Hezekiah. \"Like the Persian Xerxes, he was weak and vainglorious, cowardly under reverse, and cruel and boastful in success.\" He first set himself to break up the powerful combination of princes who were in league against him. Among these was Hezekiah, who had entered into an alliance with Egypt against Assyria. He accordingly led a very powerful army of at least 200,000 men into Judea, and devastated the land on every side, taking and destroying many cities (<a href=\"#\" onClick=\"return mV('2Ki',18,'13-16');\">2Ki 18:13-16</a>; and <a href=\"#\" onClick=\"return mV('2Ch',32,'1-8');\">2Ch 32:1-8</a>). His own account of this invasion, as given in the Assyrian annals, is in these words: \"Because Hezekiah, king of Judah, would not submit to my yoke, I came up against him, and by force of arms and by the might of my power I took forty-six of his strong fenced cities; and of the smaller towns which were scattered about, I took and plundered a countless number. From these places I took and carried off 200,156 persons, old and young, male and female, together with horses and mules, asses and camels, oxen and sheep, a countless multitude; and Hezekiah himself I shut up in Jerusalem, his capital city, like a bird in a cage, building towers round the city to hem him in, and raising banks of earth against the gates, so as to prevent escape...Then upon Hezekiah there fell the fear of the power of my arms, and he sent out to me the chiefs and the elders of Jerusalem with 30 talents of gold and 800 talents of silver, and divers treasures, a rich and immense booty...All these things were brought to me at Nineveh, the seat of my government.\" (<a href=\"#\" onClick=\"return mV('Isa',22,'1-13');\">Isa 22:1-13</a> for description of the feelings of the inhabitants of Jerusalem at such a crisis.)<br><br>Hezekiah was not disposed to become an Assyrian feudatory. He accordingly at once sought help from Egypt (<a href=\"#\" onClick=\"return mV('2Ki',18,'20-24');\">2Ki 18:20-24</a>). Sennacherib, hearing of this, marched a second time into Palestine (<a href=\"#\" onClick=\"return mV('2Ki',18,17,37);\">2Ki 18:17, 37</a>; <a href=\"#\" onClick=\"return mV('2Ki',19,'1-');\">19</a>; <a href=\"#\" onClick=\"return mV('2Ch',32,'9-23');\">2Ch 32:9-23</a>; <a href=\"#\" onClick=\"return mV('Isa',36,'2-22');\">Isa 36:2-22</a>). (<a href=\"#\" onClick=\"return mV('Isa',37,25);\">Isa 37:25</a>) should be rendered \"dried up all the Nile-arms of Matsor,\" i.e., of Egypt, so called from the \"Matsor\" or great fortification across the isthmus of Suez, which protected it from invasions from the east. Sennacherib sent envoys to try to persuade Hezekiah to surrender, but in vain. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003676');\">TIRHAKAH</a>.) He next sent a threatening letter (<a href=\"#\" onClick=\"return mV('2Ki',19,'10-14');\">2Ki 19:10-14</a>), which Hezekiah carried into the temple and spread before the Lord. Isaiah again brought an encouraging message to the pious king (<a href=\"#\" onClick=\"return mV('2Ki',19,'20-34');\">2Ki 19:20-34</a>). \"In that night\" the angel of the Lord went forth and smote the camp of the Assyrians. In the morning, \"behold, they were all dead corpses.\" The Assyrian army was annihilated.<br><br>This great disaster is not, as was to be expected, taken notice of in the Assyrian annals.<br><br>Though Sennacherib survived this disaster some twenty years, he never again renewed his attempt against Jerusalem. He was murdered by two of his own sons (Adrammelech and Sharezer), and was succeeded by another son, Esarhaddon (B.C. 681), after a reign of twenty-four years.";
eastonArray["$$T0003274"] = "<strong>Seorim:</strong> barley, the chief of the forth priestly course (<a href=\"#\" onClick=\"return mV('1Ch',24,8);\">1Ch 24:8</a>).";
eastonArray["$$T0003275"] = "<strong>Sephar:</strong> numbering, (<a href=\"#\" onClick=\"return mV('Gen',10,30);\">Gen 10:30</a>), supposed by some to be the ancient Himyaritic capital, \"Shaphar,\" Zaphar, on the Indian Ocean, between the Persian Gulf and the Red Sea.";
eastonArray["$$T0003276"] = "<strong>Sepharad:</strong> (<a href=\"#\" onClick=\"return mV('Oba',1,20);\">Oba 1:20</a>), some locality unknown. The modern Jews think that Spain is meant, and hence they designate the Spanish Jews \"Sephardim,\" as they do the German Jews by the name \"Ashkenazim,\" because the rabbis call Germany Ashkenaz. Others identify it with Sardis, the capital of Lydia. The Latin father Jerome regarded it as an Assyrian word, meaning \"boundary,\" and interpreted the sentence, \"which is in Sepharad,\" by \"who are scattered abroad in all the boundaries and regions of the earth.\" Perowne says: \"Whatever uncertainty attaches to the word Sepharad, the drift of the prophecy is clear, viz., that not only the exiles from Babylon, but Jewish captives from other and distant regions, shall be brought back to live prosperously within the enlarged borders of their own land.\"";
eastonArray["$$T0003277"] = "<strong>Sepharvaim:</strong> taken by Sargon, king of Assyria (<a href=\"#\" onClick=\"return mV('2Ki',17,24);\">2Ki 17:24</a>; <a href=\"#\" onClick=\"return mV('2Ki',18,34);\">18:34</a>; <a href=\"#\" onClick=\"return mV('2Ki',19,13);\">19:13</a>; <a href=\"#\" onClick=\"return mV('Isa',37,13);\">Isa 37:13</a>). It was a double city, and received the common name Sepharvaim, i.e., \"the two Sipparas,\" or \"the two booktowns.\" The Sippara on the east bank of the Euphrates is now called Abu-Habba; that on the other bank was Accad, the old capital of Sargon I., where he established a great library. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003227');\">SARGON</a>.) The recent discovery of cuneiform inscriptions at Tel el-Amarna in Egypt, consisting of official despatches to Pharaoh Amenophis IV. and his predecessor from their agents in Palestine, proves that in the century before the Exodus an active literary intercourse was carried on between these nations, and that the medium of the correspondence was the Babylonian language and script. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002204');\">KIRJATH-SEPHER</a>.)";
eastonArray["$$T0003278"] = "<strong>Septuagint:</strong> See <a href=\"#\" onClick=\"return doDictLookup ('ET0003768');\">VERSIONS</a>.";
eastonArray["$$T0003279"] = "<strong>Sepulchre:</strong> first mentioned as purchased by Abraham for Sarah from Ephron the Hittite (<a href=\"#\" onClick=\"return mV('Gen',23,20);\">Gen 23:20</a>). This was the \"cave of the field of Machpelah,\" where also Abraham and Rebekah and Jacob and Leah were burried (<a href=\"#\" onClick=\"return mV('Gen',49,'29-32');\">49:29-32</a>). In <a href=\"#\" onClick=\"return mV('Act',7,16);\">Act 7:16</a> it is said that Jacob was \"laid in the sepulchre that Abraham bought for a sum of money of the sons of Emmor the father of Sychem.\" It has been proposed, as a mode of reconciling the apparent discrepancy between this verse and <a href=\"#\" onClick=\"return mV('Gen',23,20);\">Gen 23:20</a>, to read <a href=\"#\" onClick=\"return mV('Act',7,16);\">Act 7:16</a> thus: \"And they [i.e., our fathers] were carried over into Sychem, and laid in the sepulchre that Abraham bought for a sum of money of the sons of Emmor [the son] of Sychem.\" In this way the purchase made by Abraham is not to be confounded with the purchase made by Jacob subsequently in the same district. Of this purchase by Abraham there is no direct record in the Old Testament. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0003697');\">TOMB</a>.)";
eastonArray["$$T0003280"] = "<strong>Serah:</strong> abundance; princess, the daughter of Asher and grand-daughter of Jacob (<a href=\"#\" onClick=\"return mV('Gen',46,17);\">Gen 46:17</a>); called also Sarah (<a href=\"#\" onClick=\"return mV('Num',26,46);\">Num 26:46</a>; R.V., \"Serah\").";
eastonArray["$$T0003281"] = "<strong>Seraiah:</strong> soldier of Jehovah.<br><br>(1.) The father of Joab (<a href=\"#\" onClick=\"return mV('1Ch',4,13,14);\">1Ch 4:13-14</a>).<br><br>(2.) The grandfather of Jehu (<a href=\"#\" onClick=\"return mV('1Ch',4,35);\">1Ch 4:35</a>).<br><br>(3.) One of David's scribes or secretaries (<a href=\"#\" onClick=\"return mV('2Sa',8,17);\">2Sa 8:17</a>).<br><br>(4.) A Netophathite (<a href=\"#\" onClick=\"return mV('Jer',40,8);\">Jer 40:8</a>), a chief priest of the time of Zedekiah. He was carried captive by Nebuchadnezzar to Babylon, and there put to death (<a href=\"#\" onClick=\"return mV('2Ki',25,18,23);\">2Ki 25:18, 23</a>).<br><br>(5.) <a href=\"#\" onClick=\"return mV('Ezr',2,2);\">Ezr 2:2</a>.<br><br>(6.) Father of Ezra the scribe (<a href=\"#\" onClick=\"return mV('Ezr',7,1);\">Ezr 7:1</a>).<br><br>(7.) A ruler of the temple (<a href=\"#\" onClick=\"return mV('Neh',11,11);\">Neh 11:11</a>).<br><br>(8.) A priest of the days of Jehoiakim (<a href=\"#\" onClick=\"return mV('Neh',12,1,12);\">Neh 12:1, 12</a>).<br><br>(9.) The son of Neriah. When Zedekiah made a journey to Babylon to do homage to Nebuchadnezzar, Seraiah had charge of the royal gifts to be presented on that occasion. Jeremiah took advantage of the occasion, and sent with Seraiah a word of cheer to the exiles in Babylon, and an announcement of the doom in store for that guilty city. The roll containing this message (<a href=\"#\" onClick=\"return mV('Jer',50,'1-8');\">Jer 50:1-8</a>) Seraiah was to read to the exiles, and then, after fixing a stone to it, was to throw it into the Euphrates, uttering, as it sank, the prayer recorded in <a href=\"#\" onClick=\"return mV('Jer',51,'59-64');\">Jer 51:59-64</a>. Babylon was at this time in the height of its glory, the greatest and most powerful monarchy in the world. Scarcely seventy years elapsed when the words of the prophet were all fulfilled. <a href=\"#\" onClick=\"return mV('Jer',51,59);\">Jer 51:59</a> is rendered in the Revised Version, \"Now Seraiah was chief chamberlain,\" instead of \"was a quiet prince,\" as in the Authorized Version.";
eastonArray["$$T0003282"] = "<strong>Seraphim:</strong> mentioned in <a href=\"#\" onClick=\"return mV('Isa',6,2,3,6,7);\">Isa 6:2-3, 6-7</a>. This word means fiery ones, in allusion, as is supposed, to their burning love. They are represented as \"standing\" above the King as he sat upon his throne, ready at once to minister unto him. Their form appears to have been human, with the addition of wings. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000240');\">ANGELS</a>.) This word, in the original, is used elsewhere only of the \"fiery serpents\" (<a href=\"#\" onClick=\"return mV('Num',21,6,8);\">Num 21:6, 8</a>; <a href=\"#\" onClick=\"return mV('Deu',8,15);\">Deu 8:15</a>; <a href=\"#\" onClick=\"return mV('Isa',14,29);\">Isa 14:29</a>; <a href=\"#\" onClick=\"return mV('Isa',30,6);\">30:6</a>) sent by God as his instruments to inflict on the people the righteous penalty of sin.";
eastonArray["$$T0003283"] = "<strong>Sered:</strong> fear, one of the sons of Zebulun (<a href=\"#\" onClick=\"return mV('Gen',46,14);\">Gen 46:14</a>).";
eastonArray["$$T0003284"] = "<strong>Sergeants:</strong> <a href=\"#\" onClick=\"return mV('Act',16,35,38);\">Act 16:35, 38</a> (R.V., \"lictors\"), officers who attended the magistrates and assisted them in the execution of justice.";
eastonArray["$$T0003285"] = "<strong>Sergius Paulus:</strong> a \"prudent man\" (R.V., \"man of understanding\"), the deputy (R.V., \"proconsul\") of Cyprus (<a href=\"#\" onClick=\"return mV('Act',13,'6-13');\">Act 13:6-13</a>). He became a convert to Christianity under Paul, who visited this island on his first mission to the heathen.<br><br>A remarkable memorial of this proconsul was recently (1887) discovered at Rome. On a boundary stone of Claudius his name is found, among others, as having been appointed (A.D. 47) one of the curators of the banks and the channel of the river Tiber. After serving his three years as proconsul at Cyprus, he returned to Rome, where he held the office referred to. As he is not saluted in Paul's letter to the Romans, he probably died before it was written.";
eastonArray["$$T0003286"] = "<strong>Sermon on the mount:</strong> After spending a night in solemn meditation and prayer in the lonely mountain-range to the west of the Lake of Galilee (<a href=\"#\" onClick=\"return mV('Luk',6,12);\">Luk 6:12</a>), on the following morning our Lord called to him his disciples, and from among them chose twelve, who were to be henceforth trained to be his apostles (<a href=\"#\" onClick=\"return mV('Mar',3,14,15);\">Mar 3:14-15</a>). After this solemn consecration of the twelve, he descended from the mountain-peak to a more level spot (<a href=\"#\" onClick=\"return mV('Luk',6,17);\">Luk 6:17</a>), and there he sat down and delivered the \"sermon on the mount\" (<a href=\"#\" onClick=\"return mV('Mat',5,'1-');\">Mat 5-7</a>; <a href=\"#\" onClick=\"return mV('Luk',6,'20-49');\">Luk 6:20-49</a>) to the assembled multitude. The mountain here spoken of was probably that known by the name of the \"Horns of Hattin\" (Kurun Hattin), a ridge running east and west, not far from Capernaum. It was afterwards called the \"Mount of Beatitudes.\"";
eastonArray["$$T0003287"] = "<strong>Serpent:</strong> (Heb. nahash; Gr. ophis), frequently noticed in Scripture. More than forty species are found in Syria and Arabia. The poisonous character of the serpent is alluded to in Jacob's blessing on Dan (<a href=\"#\" onClick=\"return mV('Gen',49,17);\">Gen 49:17</a>; see <a href=\"#\" onClick=\"return mV('Pro',30,18,19);\">Pro 30:18-19</a>; <a href=\"#\" onClick=\"return mV('Jam',3,7);\">Jam 3:7</a>; <a href=\"#\" onClick=\"return mV('Jer',8,17);\">Jer 8:17</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000085');\">ADDER</a>.)<br><br>This word is used symbolically of a deadly, subtle, malicious enemy (<a href=\"#\" onClick=\"return mV('Luk',10,19);\">Luk 10:19</a>).<br><br>The serpent is first mentioned in connection with the history of the temptation and fall of our first parents (<a href=\"#\" onClick=\"return mV('Gen',3,'1-')\">Gen 3</a>). It has been well remarked regarding this temptation: \"A real serpent was the agent of the temptation, as is plain from what is said of the natural characteristic of the serpent in the first verse of the chapter (<a href=\"#\" onClick=\"return mV('Gen',3,1);\">3:1</a>), and from the curse pronounced upon the animal itself. But that Satan was the actual tempter, and that he used the serpent merely as his instrument, is evident<br><br>(1) from the nature of the transaction; for although the serpent may be the most subtle of all the beasts of the field, yet he has not the high intellectual faculties which the tempter here displayed.<br><br>(2.) In the New Testament it is both directly asserted and in various forms assumed that Satan seduced our first parents into sin (<a href=\"#\" onClick=\"return mV('Jhn',8,44);\">Jhn 8:44</a>; <a href=\"#\" onClick=\"return mV('Rom',16,20);\">Rom 16:20</a>; <a href=\"#\" onClick=\"return mV('2Cr',11,3,14);\">2Cr 11:3, 14</a>; <a href=\"#\" onClick=\"return mV('Rev',12,9);\">Rev 12:9</a>; <a href=\"#\" onClick=\"return mV('Rev',20,2);\">20:2</a>).\" Hodge's System. Theol., ii. 127.";
eastonArray["$$T0003288"] = "<strong>Serpent, Fiery:</strong> (LXX. \"deadly,\" Vulg. \"burning\"), <a href=\"#\" onClick=\"return mV('Num',21,6);\">Num 21:6</a>, probably the naja haje of Egypt; some swift-springing, deadly snake (<a href=\"#\" onClick=\"return mV('Isa',14,29);\">Isa 14:29</a>). After setting out from their encampment at Ezion-gaber, the Israelites entered on a wide sandy desert, which stretches from the mountains of Edom as far as the Persian Gulf. While traversing this region, the people began to murmur and utter loud complaints against Moses. As a punishment, the Lord sent serpents among them, and much people of Israel died. Moses interceded on their behalf, and by divine direction he made a \"brazen serpent,\" and raised it on a pole in the midst of the camp, and all the wounded Israelites who looked on it were at once healed. (<a href=\"#\" onClick=\"return mV('Jhn',3,14,15);\">Jhn 3:14-15</a>.) (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000348');\">ASP</a>.) This \"brazen serpent\" was preserved by the Israelites till the days of Hezekiah, when it was destroyed (<a href=\"#\" onClick=\"return mV('2Ki',18,4);\">2Ki 18:4</a>). (See <a href=\"#\" onClick=\"return doDictLookup ('ET0000641');\">BRASS</a>.)";
eastonArray["$$T0003289"] = "<strong>Serug:</strong> branch, the father of Nahor (<a href=\"#\" onClick=\"return mV('Gen',11,'20-23');\">Gen 11:20-23</a>); called Saruch in <a href=\"#\" onClick=\"return mV('Luk',3,35);\">Luk 3:35</a>.";
eastonArray["$$T0003290"] = "<strong>Servitor:</strong> occurs only in <a href=\"#\" onClick=\"return mV('2Ki',4,43);\">2Ki 4:43</a>, Authorized Version (R.V., \"servant\"). The Hebrew word there rendered \"servitor\" is elsewhere rendered \"minister,\" \"servant\" (<a href=\"#\" onClick=\"return mV('Exd',24,13);\">Exd 24:13</a>; <a href=\"#\" onClick=\"return mV('Exd',33,11);\">33:11</a>). Probably Gehazi, the personal attendant on Elisha, is here meant.";
eastonArray["$$T0003291"] = "<strong>Seth:</strong> appointed; a substitute, the third son of Adam and Eve (<a href=\"#\" onClick=\"return mV('Gen',4,25);\">Gen 4:25</a>; <a href=\"#\" onClick=\"return mV('Gen',5,3);\">5:3</a>). His mother gave him this name, \"for God,\" said she, \"hath appointed me [i.e., compensated me with] another seed instead of Abel, whom Cain slew.\"";
eastonArray["$$T0003292"] = "<strong>Sethur:</strong> hidden, one of the spies sent to search the Promised Land. He was of the tribe of Asher (<a href=\"#\" onClick=\"return mV('Num',13,13);\">Num 13:13</a>).";
eastonArray["$$T0003293"] = "<strong>Seven:</strong> This number occurs frequently in Scripture, and in such connections as lead to the supposition that it has some typical meaning. On the seventh day God rested, and hallowed it (<a href=\"#\" onClick=\"return mV('Gen',2,2,3);\">Gen 2:2-3</a>). The division of time into weeks of seven days each accounts for many instances of the occurrence of this number. This number has been called the symbol of perfection, and also the symbol of rest. \"Jacob's seven years' service to Laban; Pharaoh's seven fat oxen and seven lean ones; the seven branches of the golden candlestick; the seven trumpets and the seven priests who sounded them; the seven days' siege of Jericho; the seven churches, seven spirits, seven stars, seven seals, seven vials, and many others, sufficiently prove the importance of this sacred number\" (see <a href=\"#\" onClick=\"return mV('Lev',25,4);\">Lev 25:4</a>; <a href=\"#\" onClick=\"return mV('1Sa',2,5);\">1Sa 2:5</a>; <a href=\"#\" onClick=\"return mV('Psa',12,6);\">Psa 12:6</a>; <a href=\"#\" onClick=\"return mV('Psa',79,12);\">79:12</a>; <a href=\"#\" onClick=\"return mV('Pro',26,16);\">Pro 26:16</a>; <a href=\"#\" onClick=\"return mV('Isa',4,1);\">Isa 4:1</a>; <a href=\"#\" onClick=\"return mV('Mat',18,21,22);\">Mat 18:21-22</a>; <a href=\"#\" onClick=\"return mV('Luk',17,4);\">Luk 17:4</a>). The feast of Passover (<a href=\"#\" onClick=\"return mV('Exd',12,15,16);\">Exd 12:15-16</a>), the feast of Weeks (<a href=\"#\" onClick=\"return mV('Deu',16,9);\">Deu 16:9</a>), of Tabernacles (<a href=\"#\" onClick=\"return mV('Deu',13,15);\">13:15</a>), and the Jubilee (<a href=\"#\" onClick=\"return mV('Lev',25,8);\">Lev 25:8</a>), were all ordered by seven. Seven is the number of sacrifice (<a href=\"#\" onClick=\"return mV('2Ch',29,21);\">2Ch 29:21</a>; <a href=\"#\" onClick=\"return mV('Job',42,8);\">Job 42:8</a>), of purification and consecration (<a href=\"#\" onClick=\"return mV('Lev',4,6,17);\">Lev 4:6, 17</a>; <a href=\"#\" onClick=\"return mV('Lev',8,11,33);\">8:11, 33</a>; <a href=\"#\" onClick=\"return mV('Lev',14,9,51);\">14:9, 51</a>), of forgiveness (<a href=\"#\" onClick=\"return mV('Mat',18,21,22);\">Mat 18:21-22</a>; <a href=\"#\" onClick=\"return mV('Luk',17,4);\">Luk 17:4</a>), of reward (<a href=\"#\" onClick=\"return mV('Deu',28,7);\">Deu 28:7</a>; <a href=\"#\" onClick=\"return mV('1Sa',2,5);\">1Sa 2:5</a>), and of punishment (<a href=\"#\" onClick=\"return mV('Lev',26,21,24,28);\">Lev 26:21, 24, 28</a>; <a href=\"#\" onClick=\"return mV('Deu',28,25);\">Deu 28:25</a>). It is used for any round number in such passages as <a href=\"#\" onClick=\"return mV('Job',5,19);\">Job 5:19</a>; <a href=\"#\" onClick=\"return mV('Pro',26,16,25);\">Pro 26:16, 25</a>; <a href=\"#\" onClick=\"return mV('Isa',4,1);\">Isa 4:1</a>; <a href=\"#\" onClick=\"return mV('Mat',12,45);\">Mat 12:45</a>. It is used also to mean \"abundantly\" (<a href=\"#\" onClick=\"return mV('Gen',4,15,24);\">Gen 4:15, 24</a>; <a href=\"#\" onClick=\"return mV('Lev',26,24);\">Lev 26:24</a>; <a href=\"#\" onClick=\"return mV('Psa',79,12);\">Psa 79:12</a>).";
eastonArray["$$T0003294"] = "<strong>Seventy weeks:</strong> a prophetic period mentioned in <a href=\"#\" onClick=\"return mV('Dan',9,24);\">Dan 9:24</a>, and usually interpreted on the \"year-day\" theory, i.e., reckoning each day for a year. This period will thus represent 490 years. This is regarded as the period which would elapse till the time of the coming of the Messiah, dating \"from the going forth of the commandment to restore and rebuild Jerusalem\" i.e., from the close of the Captivity.";
eastonArray["$$T0003295"] = "<strong>Shaalabbin:</strong> or Shaal'bim, a place of foxes, a town of the tribe of Dan (<a href=\"#\" onClick=\"return mV('Jos',19,42);\">Jos 19:42</a>; <a href=\"#\" onClick=\"return mV('Jdg',1,35);\">Jdg 1:35</a>). It was one of the chief towns from which Solomon drew his supplies (<a href=\"#\" onClick=\"return mV('1Ki',4,9);\">1Ki 4:9</a>). It is probably the modern village of Selbit, 3 miles north of Ajalon.";
eastonArray["$$T0003296"] = "<strong>Shaaraim:</strong> two gates.<br><br>(1.) A city in the plain of Judah (<a href=\"#\" onClick=\"return mV('1Sa',17,52);\">1Sa 17:52</a>); called also Sharaim (<a href=\"#\" onClick=\"return mV('Jos',15,36);\">Jos 15:36</a>).<br><br>(2.) A town in Simeon (<a href=\"#\" onClick=\"return mV('1Ch',4,31);\">1Ch 4:31</a>).";
eastonArray["$$T0003297"] = "<strong>Shaashgaz:</strong> servant of the beautiful, a chief eunuch in the second house of the harem of king Ahasuerus (<a href=\"#\" onClick=\"return mV('Est',2,14);\">Est 2:14</a>).";
eastonArray["$$T0003298"] = "<strong>Shabbethai:</strong> Sabbath-born, a Levite who assisted in expounding the law and investigating into the illegal marriages of the Jews (<a href=\"#\" onClick=\"return mV('Ezr',10,15);\">Ezr 10:15</a>; <a href=\"#\" onClick=\"return mV('Neh',8,7);\">Neh 8:7</a>; <a href=\"#\" onClick=\"return mV('Neh',11,16);\">11:16</a>).";
eastonArray["$$T0003299"] = "<strong>Shaddai:</strong> the Omnipotent, the name of God in frequent use in the Hebrew Scriptures, generally translated \"the Almighty.\"";
