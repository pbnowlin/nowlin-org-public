<script>var eastonArray = new Array ();
eastonArray["$$T0002350"] = "<strong>Maccabees:</strong> This word does not occur in Scripture. It was the name given to the leaders of the national party among the Jews who suffered in the persecution under Antiochus Epiphanes, who succeeded to the Syrian throne B.C. 175. It is supposed to have been derived from the Hebrew word (makkabah) meaning \"hammer,\" as suggestive of the heroism and power of this Jewish family, who are, however, more properly called Asmoneans or Hasmonaeans, the origin of which is much disputed.<br><br>After the expulsion of Antiochus Epiphanes from Egypt by the Romans, he gave vent to his indignation on the Jews, great numbers of whom he mercilessly put to death in Jerusalem. He oppressed them in every way, and tried to abolish altogether the Jewish worship. Mattathias, an aged priest, then residing at Modin, a city to the west of Jerusalem, became now the courageous leader of the national party; and having fled to the mountains, rallied round him a large band of men prepared to fight and die for their country and for their religion, which was now violently suppressed. In 1 Macc. 2:60 is recorded his dying counsels to his sons with reference to the war they were now to carry on. His son Judas, \"the Maccabee,\" succeeded him (B.C. 166) as the leader in directing the war of independence, which was carried on with great heroism on the part of the Jews, and was terminated in the defeat of the Syrians.";
eastonArray["$$T0002351"] = "<strong>Maccabees, Books of the:</strong> There were originally five books of the Maccabees. The first contains a history of the war of independence, commencing (B.C. 175) in a series of patriotic struggles against the tyranny of Antiochus Epiphanes, and terminating B.C. 135. It became part of the Vulgate Version of the Bible, and was thus retained among the Apocrypha.<br><br>The second gives a history of the Maccabees' struggle from B.C. 176 to B.C. 161. Its object is to encourage and admonish the Jews to be faithful to the religion of their fathers.<br><br>The third does not hold a place in the Apocrypha, but is read in the Greek Church. Its design is to comfort the Alexandrian Jews in their persecution. Its writer was evidently an Alexandrian Jew.<br><br>The fourth was found in the Library of Lyons, but was afterwards burned. The fifth contains a history of the Jews from B.C. 184 to B.C. 86. It is a compilation made by a Jew after the destruction of Jerusalem, from ancient memoirs, to which he had access. It need scarcely be added that none of these books has any divine authority.";
eastonArray["$$T0002352"] = "<strong>Macedonia:</strong> in New Testament times, was a Roman province lying north of Greece. It was governed by a propraetor with the title of proconsul. Paul was summoned by the vision of the \"man of Macedonia\" to preach the gospel there (<a href=\"#\" onClick=\"return mV('Act',16,9);\">Act 16:9</a>). Frequent allusion is made to this event (<a href=\"#\" onClick=\"return mV('Act',18,5);\">18:5</a>; <a href=\"#\" onClick=\"return mV('Act',19,21);\">19:21</a>; <a href=\"#\" onClick=\"return mV('Rom',15,26);\">Rom 15:26</a>; <a href=\"#\" onClick=\"return mV('2Cr',1,16);\">2Cr 1:16</a>; <a href=\"#\" onClick=\"return mV('2Cr',11,9);\">11:9</a>; <a href=\"#\" onClick=\"return mV('Phl',4,15);\">Phl 4:15</a>). The history of Paul's first journey through Macedonia is given in detail in <a href=\"#\" onClick=\"return mV('Act',16,'10-');\">Act 16:10</a>-<a href=\"#\" onClick=\"return mV('Act',17,'1-15');\">17:15</a>. At the close of this journey he returned from Corinth to Syria. He again passed through this country (<a href=\"#\" onClick=\"return mV('Act',20,'1-6');\">Act 20:1-6</a>), although the details of the route are not given. After many years he probably visited it for a third time (<a href=\"#\" onClick=\"return mV('Phl',2,24);\">Phl 2:24</a>; <a href=\"#\" onClick=\"return mV('1Ti',1,3);\">1Ti 1:3</a>). The first convert made by Paul in Europe was (<a href=\"#\" onClick=\"return mV('Act',16,'13-15');\">Act 16:13-15</a>) Lydia (q.v.), a \"seller of purple,\" residing in Philippi, the chief city of the eastern division of Macedonia.";
eastonArray["$$T0002353"] = "<strong>Machaerus:</strong> the Black Fortress, was built by Herod the Great in the gorge of Callirhoe, one of the wadies 9 miles east of the Dead Sea, as a frontier rampart against Arab marauders. John the Baptist was probably cast into the prison connected with this castle by Herod Antipas, whom he had reproved for his adulterous marriage with Herodias. Here Herod \"made a supper\" on his birthday. He was at this time marching against Aretas, king of Perea, to whose daughter he had been married. During the revelry of the banquet held in the border fortress, to please Salome, who danced before him, he sent an executioner, who beheaded John, and \"brought his head in a charger, and gave it to the damsel\" (<a href=\"#\" onClick=\"return mV('Mar',6,'14-29');\">Mar 6:14-29</a>). This castle stood \"starkly bold and clear\" 3,860 feet above the Dead Sea, and 2,546 above the Mediterranean. Its ruins, now called M'khaur, are still visible on the northern end of Jebel Attarus.";
eastonArray["$$T0002354"] = "<strong>Machbanai:</strong> clad with a mantle, or bond of the Lord, one of the Gadite heroes who joined David in the wilderness (<a href=\"#\" onClick=\"return mV('1Ch',12,13);\">1Ch 12:13</a>).";
eastonArray["$$T0002355"] = "<strong>Machir:</strong> sold.<br><br>(1.) Manasseh's oldest son (<a href=\"#\" onClick=\"return mV('Jos',17,1);\">Jos 17:1</a>), or probably his only son (see <a href=\"#\" onClick=\"return mV('1Ch',7,14,15);\">1Ch 7:14-15</a>; <a href=\"#\" onClick=\"return mV('Num',26,'29-33');\">Num 26:29-33</a>; <a href=\"#\" onClick=\"return mV('Jos',13,31);\">Jos 13:31</a>). His descendants are referred to under the name of Machirites, being the offspring of Gilead (<a href=\"#\" onClick=\"return mV('Num',26,29);\">Num 26:29</a>). They settled in land taken from the Amorites (<a href=\"#\" onClick=\"return mV('Num',32,39,40);\">Num 32:39-40</a>; <a href=\"#\" onClick=\"return mV('Deu',3,15);\">Deu 3:15</a>) by a special enactment (<a href=\"#\" onClick=\"return mV('Num',36,'1-3');\">Num 36:1-3</a>; <a href=\"#\" onClick=\"return mV('Jos',17,3,4);\">Jos 17:3-4</a>). He is once mentioned as the representative of the tribe of Manasseh east of Jordan (<a href=\"#\" onClick=\"return mV('Jdg',5,14);\">Jdg 5:14</a>).<br><br>(2.) A descendant of the preceding, residing at Lo-debar, where he maintained Jonathan's son Mephibosheth till he was taken under the care of David (<a href=\"#\" onClick=\"return mV('2Sa',9,4);\">2Sa 9:4</a>), and where he afterwards gave shelter to David himself when he was a fugitive (<a href=\"#\" onClick=\"return mV('2Sa',17,27);\">17:27</a>).";
eastonArray["$$T0002356"] = "<strong>Machpelah:</strong> portion; double cave, the cave which Abraham bought, together with the field in which it stood, from Ephron the Hittite, for a family burying-place (<a href=\"#\" onClick=\"return mV('Gen',23,'1-')\">Gen 23</a>). It is one of those Bible localities about the identification of which there can be no doubt. It was on the slope of a hill on the east of Hebron, \"before Mamre.\" Here were laid the bodies of Abraham and Sarah, Isaac and Rebekah, Jacob and Leah (<a href=\"#\" onClick=\"return mV('Gen',23,19);\">Gen 23:19</a>; <a href=\"#\" onClick=\"return mV('Gen',25,9);\">25:9</a>; <a href=\"#\" onClick=\"return mV('Gen',49,31);\">49:31</a>; <a href=\"#\" onClick=\"return mV('Gen',50,13);\">50:13</a>). Over the cave an ancient Christian church was erected, probably in the time of Justinian, the Roman emperor. This church has been converted into a Mohammedan mosque. The whole is surrounded by the el-Haram i.e., \"the sacred enclosure,\" about 200 feet long, 115 broad, and of an average height of about 50. This building, from the immense size of some of its stones, and the manner in which they are fitted together, is supposed by some to have been erected in the days of David or of Solomon, while others ascribe it to the time of Herod. It is looked upon as the most ancient and finest relic of Jewish architecture.<br><br>On the floor of the mosque are erected six large cenotaphs as monuments to the dead who are buried in the cave beneath. Between the cenotaphs of Isaac and Rebekah there is a circular opening in the floor into the cavern below, the cave of Machpelah. Here it may be that the body of Jacob, which was embalmed in Egypt, is still preserved (much older embalmed bodies have recently been found in the cave of Deir el-Bahari in Egypt, see <a href=\"#\" onClick=\"return doDictLookup('ET0002923');\">PHARAOH</a>), though those of the others there buried may have long ago mouldered into dust. The interior of the mosque was visited by the Prince of Wales in 1862 by a special favour of the Mohammedan authorities. An interesting account of this visit is given in Dean Stanley's Lectures on the Jewish Church. It was also visited in 1866 by the Marquis of Bute, and in 1869 by the late Emperor (Frederick) of Germany, then the Crown Prince of Prussia. In 1881 it was visited by the two sons of the Prince of Wales, accompanied by Sir C. Wilson and others. (See Palestine Quarterly Statement, October 1882).";
eastonArray["$$T0002357"] = "<strong>Madai:</strong> middle land, the third \"son\" of Japheth (<a href=\"#\" onClick=\"return mV('Gen',10,2);\">Gen 10:2</a>), the name by which the Medes are known on the Assyrian monuments.";
eastonArray["$$T0002358"] = "<strong>Madmannah:</strong> dunghill, the modern el-Minyay, 15 miles south-south-west of Gaza (<a href=\"#\" onClick=\"return mV('Jos',15,31);\">Jos 15:31</a>; <a href=\"#\" onClick=\"return mV('1Ch',2,49);\">1Ch 2:49</a>), in the south of Judah. The Pal. Mem., however, suggest Umm Deimneh, 12 miles north-east of Beersheba, as the site.";
eastonArray["$$T0002359"] = "<strong>Madmen:</strong> ibid., a Moabite town threatened with the sword of the Babylonians (<a href=\"#\" onClick=\"return mV('Jer',48,2);\">Jer 48:2</a>).";
eastonArray["$$T0002360"] = "<strong>Madmenah:</strong> ibid., a town in Benjamin, not far from Jerusalem, towards the north (<a href=\"#\" onClick=\"return mV('Isa',10,31);\">Isa 10:31</a>). The same Hebrew word occurs in <a href=\"#\" onClick=\"return mV('Isa',25,10);\">Isa 25:10</a>, where it is rendered \"dunghill.\" This verse has, however, been interpreted as meaning \"that Moab will be trodden down by Jehovah as teben [broken straw] is trodden to fragments on the threshing-floors of Madmenah.\"";
eastonArray["$$T0002361"] = "<strong>Madness:</strong> This word is used in its proper sense in <a href=\"#\" onClick=\"return mV('Deu',28,34);\">Deu 28:34</a>,;<a href=\"#\" onClick=\"return mV('Jhn',10,20);\">John 10:20</a>; <a href=\"#\" onClick=\"return mV('1Cr',14,23);\">1Cr 14:23</a>. It also denotes a reckless state of mind arising from various causes, as over-study (<a href=\"#\" onClick=\"return mV('Ecc',1,17);\">Ecc 1:17</a>; <a href=\"#\" onClick=\"return mV('Ecc',2,12);\">2:12</a>), blind rage (<a href=\"#\" onClick=\"return mV('Luk',6,11);\">Luk 6:11</a>), or a depraved temper (<a href=\"#\" onClick=\"return mV('Ecc',7,25);\">Ecc 7:25</a>; <a href=\"#\" onClick=\"return mV('Ecc',9,3);\">9:3</a>; <a href=\"#\" onClick=\"return mV('2Pe',2,16);\">2Pe 2:16</a>). David feigned madness (<a href=\"#\" onClick=\"return mV('1Sa',21,13);\">1Sa 21:13</a>) at Gath because he \"was sore afraid of Achish.\"";
eastonArray["$$T0002362"] = "<strong>Madon:</strong> strife, a Canaanitish city in the north of Palestine (<a href=\"#\" onClick=\"return mV('Jos',11,1);\">Jos 11:1</a>; <a href=\"#\" onClick=\"return mV('Jos',12,19);\">12:19</a>), whose king was slain by Joshua; perhaps the ruin Madin, near Hattin, some 5 miles west of Tiberias.";
eastonArray["$$T0002363"] = "<strong>Magdala:</strong> a tower, a town in Galilee, mentioned only in <a href=\"#\" onClick=\"return mV('Mat',15,39);\">Mat 15:39</a>. In the parallel passage in <a href=\"#\" onClick=\"return mV('Mar',8,10);\">Mar 8:10</a> this place is called Dalmanutha. It was the birthplace of Mary called the Magdalen, or Mary Magdalene. It was on the west shore of the Lake of Tiberias, and is now probably the small obscure village called el-Mejdel, about 3 miles north-west of Tiberias. In the Talmud this city is called \"the city of colour,\" and a particular district of it was called \"the tower of dyers.\" The indigo plant was much cultivated here.";
eastonArray["$$T0002364"] = "<strong>Magdalene:</strong> a surname derived from Magdala, the place of her nativity, given to one of the Marys of the Gospels to distinguish her from the other Marys (<a href=\"#\" onClick=\"return mV('Mat',27,56,61);\">Mat 27:56, 61</a>; <a href=\"#\" onClick=\"return mV('Mat',28,1);\">28:1</a>, etc.). A mistaken notion has prevailed that this Mary was a woman of bad character, that she was the woman who is emphatically called \"a sinner\" (<a href=\"#\" onClick=\"return mV('Luk',7,'36-50');\">Luk 7:36-50</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002428');\">MARY</a>.)";
eastonArray["$$T0002365"] = "<strong>Magic:</strong> The Jews seem early to have consulted the teraphim (q.v.) for oracular answers (<a href=\"#\" onClick=\"return mV('Jdg',18,5,6);\">Jdg 18:5-6</a>; <a href=\"#\" onClick=\"return mV('Zec',10,2);\">Zec 10:2</a>). There is a remarkable illustration of this divining by teraphim in <a href=\"#\" onClick=\"return mV('Eze',21,'19-22');\">Ezek. 21:19-22</a>. We read also of the divining cup of Joseph (<a href=\"#\" onClick=\"return mV('Gen',44,5);\">Gen 44:5</a>). The magicians of Egypt are frequently referred to in the history of the Exodus. Magic was an inherent part of the ancient Egyptian religion, and entered largely into their daily life.<br><br>All magical arts were distinctly prohibited under penalty of death in the Mosaic law. The Jews were commanded not to learn the \"abomination\" of the people of the Promised Land (<a href=\"#\" onClick=\"return mV('Lev',19,31);\">Lev 19:31</a>; <a href=\"#\" onClick=\"return mV('Deu',18,'9-14');\">Deu 18:9-14</a>). The history of Saul's consulting the witch of Endor (<a href=\"#\" onClick=\"return mV('1Sa',28,'3-20');\">1Sa 28:3-20</a>) gives no warrant for attributing supernatural power to magicians. From the first the witch is here only a bystander. The practice of magic lingered among the people till after the Captivity, when they gradually abandoned it.<br><br>It is not much referred to in the New Testament. The Magi mentioned in <a href=\"#\" onClick=\"return mV('Mat',2,'1-12');\">Mat 2:1-12</a> were not magicians in the ordinary sense of the word. They belonged to a religious caste, the followers of Zoroaster, the astrologers of the East. Simon, a magician, was found by Philip at Samaria (<a href=\"#\" onClick=\"return mV('Act',8,'9-24');\">Act 8:9-24</a>); and Paul and Barnabas encountered Elymas, a Jewish sorcerer, at Paphos (<a href=\"#\" onClick=\"return mV('Act',13,'6-12');\">13:6-12</a>). At Ephesus there was a great destruction of magical books (<a href=\"#\" onClick=\"return mV('Act',19,18,19);\">Act 19:18-19</a>).";
eastonArray["$$T0002366"] = "<strong>Magicians:</strong> Heb. hartumim, (<a href=\"#\" onClick=\"return mV('Dan',1,20);\">Dan 1:20</a>) were sacred scribes who acted as interpreters of omens, or \"revealers of secret things.\"";
eastonArray["$$T0002367"] = "<strong>Magistrate:</strong> a public civil officer invested with authority. The Hebrew shophetim, or judges, were magistrates having authority in the land (<a href=\"#\" onClick=\"return mV('Deu',1,16,17);\">Deu 1:16-17</a>). In <a href=\"#\" onClick=\"return mV('Jdg',18,7);\">Jdg 18:7</a> the word \"magistrate\" (A.V.) is rendered in the Revised Version \"possessing authority\", i.e., having power to do them harm by invasion. In the time of Ezra (<a href=\"#\" onClick=\"return mV('Ezr',9,2);\">Ezr 9:2</a>) and Nehemiah (<a href=\"#\" onClick=\"return mV('Neh',2,16);\">Neh 2:16</a>; <a href=\"#\" onClick=\"return mV('Neh',4,14);\">4:14</a>; <a href=\"#\" onClick=\"return mV('Neh',13,11);\">13:11</a>) the Jewish magistrates were called <i>seganim</i>, properly meaning \"nobles.\" In the New Testament the Greek word <i>archon</i>, rendered \"magistrate\" (<a href=\"#\" onClick=\"return mV('Luk',12,58);\">Luk 12:58</a>; <a href=\"#\" onClick=\"return mV('Tts',3,1);\">Tts 3:1</a>), means one first in power, and hence a prince, as in <a href=\"#\" onClick=\"return mV('Mat',20,25);\">Mat 20:25</a>; <a href=\"#\" onClick=\"return mV('1Cr',2,6,8);\">1Cr 2:6, 8</a>. This term is used of the Messiah, \"Prince of the kings of the earth\" (<a href=\"#\" onClick=\"return mV('Rev',1,5);\">Rev 1:5</a>). In <a href=\"#\" onClick=\"return mV('Act',16,20,22,35,36,38);\">Act 16:20, 22, 35-36, 38</a>, the Greek term <i>strategos</i>, rendered \"magistrate,\" properly signifies the leader of an army, a general, one having military authority. The <i>strategoi</i> were the duumviri, the two praetors appointed to preside over the administration of justice in the colonies of the Romans. They were attended by the sergeants (properly lictors or \"rod bearers\").";
eastonArray["$$T0002368"] = "<strong>Magog:</strong> region of Gog, the second of the \"sons\" of Japheth (<a href=\"#\" onClick=\"return mV('Gen',10,2);\">Gen 10:2</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,5);\">1Ch 1:5</a>). In Ezekiel (<a href=\"#\" onClick=\"return mV('Eze',38,2);\">Eze 38:2</a>; <a href=\"#\" onClick=\"return mV('Eze',39,6);\">39:6</a>) it is the name of a nation, probably some Scythian or Tartar tribe descended from Japheth. They are described as skilled horsemen, and expert in the use of the bow. The Latin father Jerome says that this word denotes \"Scythian nations, fierce and innumerable, who live beyond the Caucasus and the Lake Maeotis, and near the Caspian Sea, and spread out even onward to India.\" Perhaps the name \"represents the Assyrian Mat Gugi, or 'country of Gugu,' the Gyges of the Greeks\" (Sayce's Races, etc.).";
eastonArray["$$T0002369"] = "<strong>Magor-missabib:</strong> fear on every side, (<a href=\"#\" onClick=\"return mV('Jer',20,3);\">Jer 20:3</a>), a symbolical name given to the priest Pashur, expressive of the fate announced by the prophet as about to come upon him. Pashur was to be carried to Babylon, and there die.";
eastonArray["$$T0002370"] = "<strong>Mahalaleel:</strong> praise of God.<br><br>(1.) The son of Cainan, of the line of Seth (<a href=\"#\" onClick=\"return mV('Gen',5,'12-17');\">Gen 5:12-17</a>); called Maleleel (<a href=\"#\" onClick=\"return mV('Luk',3,37);\">Luk 3:37</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('Neh',11,4);\">Neh 11:4</a>, a descendant of Perez.";
eastonArray["$$T0002371"] = "<strong>Mahalath:</strong> a lute; lyre.<br><br>(1.) The daughter of Ishmael, and third wife of Esau (<a href=\"#\" onClick=\"return mV('Gen',28,9);\">Gen 28:9</a>); called also Bashemath (<a href=\"#\" onClick=\"return mV('Gen',36,3);\">Gen 36:3</a>).<br><br>(2.) The daughter of Jerimoth, who was one of David's sons. She was one of Rehoboam's wives (<a href=\"#\" onClick=\"return mV('2Ch',11,18);\">2Ch 11:18</a>).";
eastonArray["$$T0002372"] = "<strong>Mahalath Leannoth Maschil:</strong> This word leannoth seems to point to some kind of instrument unknown (<a href=\"#\" onClick=\"return mV('Psa',88,1);\">Ps. 88, title</a>). The whole phrase has by others been rendered, \"On the sickness of affliction: a lesson;\" or, \"Concerning afflictive sickness: a didactic psalm.\"";
eastonArray["$$T0002373"] = "<strong>Mahalath Maschil:</strong> in the title of <a href=\"#\" onClick=\"return mV('Psa',53,'1-');\">Psa 53</a>, denoting that this was a didactic psalm, to be sung to the accompaniment of the lute or guitar. Others regard this word \"mahalath\" as the name simply of an old air to which the psalm was to be sung. Others, again, take the word as meaning \"sickness,\" and regard it as alluding to the contents of the psalm.";
eastonArray["$$T0002374"] = "<strong>Mahanaim:</strong> two camps, a place near the Jabbok, beyond Jordan, where Jacob was met by the \"angels of God,\" and where he divided his retinue into \"two hosts\" on his return from Padan-aram (<a href=\"#\" onClick=\"return mV('Gen',32,2);\">Gen 32:2</a>). This name was afterwards given to the town which was built at that place. It was the southern boundary of Bashan (<a href=\"#\" onClick=\"return mV('Jos',13,26,30);\">Jos 13:26, 30</a>), and became a city of the Levites (<a href=\"#\" onClick=\"return mV('Jos',21,38);\">21:38</a>). Here Saul's son Ishbosheth reigned (<a href=\"#\" onClick=\"return mV('2Sa',2,8,12);\">2Sa 2:8, 12</a>), while David reigned at Hebron. Here also, after a troubled reign, Ishbosheth was murdered by two of his own bodyguard (<a href=\"#\" onClick=\"return mV('2Sa',4,'5-7');\">2Sa 4:5-7</a>), who brought his head to David at Hebron, but were, instead of being rewarded, put to death by him for their cold-blooded murder. Many years after this, when he fled from Jerusalem on the rebellion of his son Absalom, David made Mahanaim, where Barzillai entertained him, his headquarters, and here he mustered his forces which were led against the army that had gathered around Absalom. It was while sitting at the gate of this town that tidings of the great and decisive battle between the two hosts and of the death of his son Absalom reached him, when he gave way to the most violent grief (<a href=\"#\" onClick=\"return mV('2Sa',17,'24-27');\">2Sa 17:24-27</a>).<br><br>The only other reference to Mahanaim is as a station of one of Solomon's purveyors (<a href=\"#\" onClick=\"return mV('1Ki',4,14);\">1Ki 4:14</a>). It has been identified with the modern Mukhumah, a ruin found in a depressed plain called el-Bukie'a, \"the little vale,\" near Penuel, south of the Jabbok, and north-east of es-Salt.";
eastonArray["$$T0002375"] = "<strong>Mahaneh-dan:</strong> <a href=\"#\" onClick=\"return mV('Jdg',18,12);\">Jdg 18:12</a> = \"camp of Dan\" <a href=\"#\" onClick=\"return mV('Jdg',13,35);\">13:25</a> (R.V., \"Mahaneh-dan\"), a place behind (i.e., west of) Kirjath-jearim, where the six hundred Danites from Zorah and Eshtaol encamped on their way to capture the city of Laish, which they rebuilt and called \"Dan, after the name of their father\" (<a href=\"#\" onClick=\"return mV('Jdg',18,'11-31');\">Jdg 18:11-31</a>). The Palestine Explorers point to a ruin called 'Erma, situated about 3 miles from the great corn valley on the east of Samson's home.";
eastonArray["$$T0002376"] = "<strong>Mahath:</strong> grasping.<br><b />(1.) A Kohathite Levite, father of Elkanah (<a href=\"#\" onClick=\"return mV('1Ch',6,35);\">1Ch 6:35</a>).<br><br>(2.) Another Kohathite Levite, of the time of Hezekiah (<a href=\"#\" onClick=\"return mV('2Ch',29,12);\">2Ch 29:12</a>).";
eastonArray["$$T0002377"] = "<strong>Mahazioth:</strong> visions, a Kohathite Levite, chief of the twenty-third course of musicians (<a href=\"#\" onClick=\"return mV('1Ch',25,4,30);\">1Ch 25:4, 30</a>).";
eastonArray["$$T0002378"] = "<strong>Maher-shalal-hash-baz:</strong> plunder speedeth; spoil hasteth, (<a href=\"#\" onClick=\"return mV('Isa',8,'1-3');\">Isa 8:1-3</a>; <a href=\"#\" onClick=\"return mV('Zep',1,14);\">Zep 1:14</a>), a name Isaiah was commanded first to write in large characters on a tablet, and afterwards to give as a symbolical name to a son that was to be born to him (<a href=\"#\" onClick=\"return mV('Isa',8,1,3);\">Isa 8:1, 3</a>), as denoting the sudden attack on Damascus and Syria by the Assyrian army.";
eastonArray["$$T0002379"] = "<strong>Mahlah:</strong> disease, one of the five daughters of Zelophehad (<a href=\"#\" onClick=\"return mV('Num',27,'1-11');\">Num 27:1-11</a>) who had their father's inheritance, the law of inheritance having been altered in their favour.";
eastonArray["$$T0002380"] = "<strong>Mahlon:</strong> sickly, the elder of Elimelech the Bethlehemite's two sons by Naomi. He married Ruth and died childless (<a href=\"#\" onClick=\"return mV('Rth',1,2,5);\">Rth 1:2, 5</a>; <a href=\"#\" onClick=\"return mV('Rth',4,9,10);\">4:9-10</a>), in the land of Moab.";
eastonArray["$$T0002381"] = "<strong>Mahol:</strong> dance, the father of four sons (<a href=\"#\" onClick=\"return mV('1Ki',4,31);\">1Ki 4:31</a>) who were inferior in wisdom only to Solomon.";
eastonArray["$$T0002382"] = "<strong>Mail, Coat of:</strong> \"a corselet of scales,\" a cuirass formed of pieces of metal overlapping each other, like fish-scales (<a href=\"#\" onClick=\"return mV('1Sa',17,5);\">1Sa 17:5</a>); also (<a href=\"#\" onClick=\"return mV('1Sa',17,38);\">38</a>) a corselet or garment thus encased.";
eastonArray["$$T0002383"] = "<strong>Main-sail:</strong> (Gr. artemon), answering to the modern \"mizzen-sail,\" as some suppose. Others understand the \"jib,\" near the prow, or the \"fore-sail,\" as likely to be most useful in bringing a ship's head to the wind in the circumstances described (<a href=\"#\" onClick=\"return mV('Act',27,40);\">Act 27:40</a>).";
eastonArray["$$T0002384"] = "<strong>Makheloth:</strong> assemblies, a station of the Israelites in the desert (<a href=\"#\" onClick=\"return mV('Num',33,25,26);\">Num 33:25-26</a>).";
eastonArray["$$T0002385"] = "<strong>Makkedah:</strong> herdsman's place, one of the royal cities of the Canaanites (<a href=\"#\" onClick=\"return mV('Jos',12,16);\">Jos 12:16</a>), near which was a cave where the five kings who had confederated against Israel sought refuge (<a href=\"#\" onClick=\"return mV('Jos',10,'10-29');\">10:10-29</a>). They were put to death by Joshua, who afterwards suspended their bodies upon five trees. It has been identified with the modern village called Sumeil, standing on a low hill about 7 miles to the north-west of Eleutheropolis (Beit Jibrin), where are ancient remains and a great cave. The Palestine Exploration surveyors have, however, identified it with el-Mughar, or \"the caves,\" 3 miles from Jabneh and 2 1/2 southwest of Ekron, because, they say, \"at this site only of all possible sites for Makkedah in the Palestine plain do caves still exist.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0000099');\">ADONI-ZEDEC</a>.)";
eastonArray["$$T0002386"] = "<strong>Maktesh:</strong> mortar, a place in or near Jerusalem inhabited by silver merchants (<a href=\"#\" onClick=\"return mV('Zep',1,11);\">Zep 1:11</a>). It has been conjectured that it was the \"Phoenician quarter\" of the city, where the traders of that nation resided, after the Oriental custom.";
eastonArray["$$T0002387"] = "<strong>Malachi:</strong> messenger or angel, the last of the minor prophets, and the writer of the last book of the Old Testament canon (<a href=\"#\" onClick=\"return mV('Mal',4,'4-6');\">Mal 4:4-6</a>). Nothing is known of him beyond what is contained in his book of prophecies. Some have supposed that the name is simply a title descriptive of his character as a messenger of Jehovah, and not a proper name. There is reason, however, to conclude that Malachi was the ordinary name of the prophet.<br><br>He was contemporary with Nehemiah (<a href=\"#\" onClick=\"return mV('Mal',2,8);\">Mal 2:8</a> with <a href=\"#\" onClick=\"return mV('Neh',13,15);\">Neh 13:15</a>; <a href=\"#\" onClick=\"return mV('Mal',2,'10-16');\">Mal 2:10-16</a> with <a href=\"#\" onClick=\"return mV('Neh',13,23);\">Neh 13:23</a>). No allusion is made to him by Ezra, and he does not mention the restoration of he temple, and hence it is inferred that he prophesied after Haggai and Zechariah, and when the temple services were still in existence (<a href=\"#\" onClick=\"return mV('Mal',1,10);\">Mal 1:10</a>; <a href=\"#\" onClick=\"return mV('Mal',3,1,10);\">3:1, 10</a>). It is probable that he delivered his prophecies about B.C. 420, after the second return of Nehemiah from Persia (<a href=\"#\" onClick=\"return mV('Neh',13,6);\">Neh 13:6</a>), or possibly before his return.";
eastonArray["$$T0002388"] = "<strong>Malachi, Prophecies of:</strong> The contents of the book are comprised in four chapters. In the Hebrew text the third and fourth chapters (of the A.V.) form but one. The whole consists of three sections, preceded by an introduction (<a href=\"#\" onClick=\"return mV('Mal',1,'1-5');\">Mal 1:1-5</a>), in which the prophet reminds Israel of Jehovah's love to them. The first section (<a href=\"#\" onClick=\"return mV('Mal',1,'6-');\">Mal 1:6</a>-<a href=\"#\" onClick=\"return mV('Mal',3,'1-9');\">2:9</a>) contains a stern rebuke addressed to the priests who had despised the name of Jehovah, and been leaders in a departure from his worship and from the covenant, and for their partiality in administering the law. In the second (<a href=\"#\" onClick=\"return mV('Mal',2,'9-16');\">Mal 2:9-16</a>) the people are rebuked for their intermarriages with idolatrous heathen. In the third (<a href=\"#\" onClick=\"return mV('Mal',2,'17-');\">Mal 2:17</a>-<a href=\"#\" onClick=\"return mV('Mal',3,'1-');\"></a>-<a href=\"#\" onClick=\"return mV('Mal',4,'1-6');\">4:6</a>) he addresses the people as a whole, and warns them of the coming of the God of judgment, preceded by the advent of the Messiah.<br><br>This book is frequently referred to in the New Testament (<a href=\"#\" onClick=\"return mV('Mat',11,10);\">Mat 11:10</a>; <a href=\"#\" onClick=\"return mV('Mat',17,12);\">17:12</a>; <a href=\"#\" onClick=\"return mV('Mar',1,2);\">Mar 1:2</a>; <a href=\"#\" onClick=\"return mV('Mar',9,11,12);\">9:11-12</a>; <a href=\"#\" onClick=\"return mV('Luk',1,17);\">Luk 1:17</a>; <a href=\"#\" onClick=\"return mV('Rom',9,13);\">Rom 9:13</a>).";
eastonArray["$$T0002389"] = "<strong>Malcam:</strong> (<a href=\"#\" onClick=\"return mV('2Sa',12,30);\">2Sa 12:30</a>, Heb., R.V., \"their king; <a href=\"#\" onClick=\"return mV('Jer',49,1,3);\">Jer 49:1, 3</a>, R.V.; <a href=\"#\" onClick=\"return mV('Zep',1,5);\">Zep 1:5</a>), the national idol of the Ammonites. When Rabbah was taken by David, the crown of this idol was among the spoils. The weight is said to have been \"a talent of gold\" (above 100 lbs.). The expression probably denotes its value rather than its weight. It was adorned with precious stones.";
eastonArray["$$T0002390"] = "<strong>Malchiah:</strong> Jehovah's king.<br><br>(1.) The head of the fifth division of the priests in the time of David (<a href=\"#\" onClick=\"return mV('1Ch',24,9);\">1Ch 24:9</a>).<br><br>(2.) A priest, the father of Pashur (<a href=\"#\" onClick=\"return mV('1Ch',9,12);\">1Ch 9:12</a>; <a href=\"#\" onClick=\"return mV('Jer',38,1);\">Jer 38:1</a>).<br><br>(3.) One of the priests appointed as musicians to celebrate the completion of the walls of Jerusalem (<a href=\"#\" onClick=\"return mV('Neh',12,42);\">Neh 12:42</a>).<br><br>(4.) A priest who stood by Ezra when he \"read in the book of the law of God\" (<a href=\"#\" onClick=\"return mV('Neh',8,4);\">Neh 8:4</a>).<br><br>(5.) <a href=\"#\" onClick=\"return mV('Neh',3,11);\">Neh 3:11</a>.<br><br>(6.) <a href=\"#\" onClick=\"return mV('Neh',3,31);\">Neh 3:31</a>.<br><br>(7.) <a href=\"#\" onClick=\"return mV('Neh',3,14);\">Neh 3:14</a>.";
eastonArray["$$T0002391"] = "<strong>Malchi-shua:</strong> king of help, one of the four sons of Saul (<a href=\"#\" onClick=\"return mV('1Ch',8,33);\">1Ch 8:33</a>). He perished along with his father in the battle of Gilboa (<a href=\"#\" onClick=\"return mV('1Sa',31,2);\">1Sa 31:2</a>).";
eastonArray["$$T0002392"] = "<strong>Malchus:</strong> reigning, the personal servant or slave of the high priest Caiaphas. He is mentioned only by John. Peter cut off his right ear in the garden of Gethsemane (<a href=\"#\" onClick=\"return mV('Jhn',18,10);\">Jhn 18:10</a>). But our Lord cured it with a touch (<a href=\"#\" onClick=\"return mV('Mat',26,51);\">Mat 26:51</a>; <a href=\"#\" onClick=\"return mV('Mar',14,47);\">Mar 14:47</a>; <a href=\"#\" onClick=\"return mV('Luk',22,51);\">Luk 22:51</a>). This was the last miracle of bodily cure wrought by our Lord. It is not mentioned by John.";
eastonArray["$$T0002393"] = "<strong>Mallothi:</strong> my fulness, a Kohathite Levite, one of the sons of Heman the Levite (<a href=\"#\" onClick=\"return mV('1Ch',25,4);\">1Ch 25:4</a>), and chief of the nineteenth division of the temple musicians (26).";
eastonArray["$$T0002394"] = "<strong>Mallows:</strong> occurs only in <a href=\"#\" onClick=\"return mV('Job',30,4);\">Job 30:4</a> (R.V., \"saltwort\"). The word so rendered (malluah, from melah, \"salt\") most probably denotes the Atriplex halimus of Linnaeus, a species of sea purslane found on the shores of the Dead Sea, as also of the Mediterranean, and in salt marshes. It is a tall shrubby orach, growing to the height sometimes of 10 feet. Its buds and leaves, with those of other saline plants, are eaten by the poor in Palestine.";
eastonArray["$$T0002395"] = "<strong>Malluch:</strong> reigned over, or reigning.<br><br>(1.) A Levite of the family of Merari (<a href=\"#\" onClick=\"return mV('1Ch',6,44);\">1Ch 6:44</a>).<br><br>(2.) A priest who returned from Babylon (<a href=\"#\" onClick=\"return mV('Neh',12,2);\">Neh 12:2</a>).<br><br>(3.) <a href=\"#\" onClick=\"return mV('Ezr',10,29);\">Ezr 10:29</a>.<br><br>(4.) <a href=\"#\" onClick=\"return mV('Ezr',10,32);\">Ezr 10:32</a>";
eastonArray["$$T0002396"] = "<strong>Mammon:</strong> a Chaldee or Syriac word meaning \"wealth\" or \"riches\" (<a href=\"#\" onClick=\"return mV('Luk',16,'9-11');\">Luk 16:9-11</a>); also, by personification, the god of riches (<a href=\"#\" onClick=\"return mV('Mat',6,24);\">Mat 6:24</a>; <a href=\"#\" onClick=\"return mV('Luk',16,'9-11');\">Luk 16:9-11</a>).";
eastonArray["$$T0002397"] = "<strong>Mamre:</strong> manliness.<br><br>(1.) An Amoritish chief in alliance with Abraham (<a href=\"#\" onClick=\"return mV('Gen',14,13,24);\">Gen 14:13, 24</a>).<br><br>(2.) The name of the place in the neighbourhood of Hebron (q.v.) where Abraham dwelt (<a href=\"#\" onClick=\"return mV('Gen',23,17,19);\">Gen 23:17, 19</a>; <a href=\"#\" onClick=\"return mV('Gen',35,27);\">35:27</a>); called also in Authorized Version (<a href=\"#\" onClick=\"return mV('Gen',13,18);\">13:18</a>) the \"plain of Mamre,\" but in Revised Version more correctly \"the oaks [marg., 'terebinths'] of Mamre.\" The name probably denotes the \"oak grove\" or the \"wood of Mamre,\" thus designated after Abraham's ally.<br><br>This \"grove\" must have been within sight of or \"facing\" Machpelah (q.v.). The site of Mamre has been identified with Ballatet Selta, i.e., \"the oak of rest\", where there is a tree called \"Abraham's oak,\" about a mile and a half west of Hebron. Others identify it with er-Rameh, 2 miles north of Hebron.";
eastonArray["$$T0002398"] = "<strong>Man:</strong><br><br>(1.) Heb. 'Adam, used as the proper name of the first man. The name is derived from a word meaning \"to be red,\" and thus the first man was called Adam because he was formed from the red earth. It is also the generic name of the human race (<a href=\"#\" onClick=\"return mV('Gen',1,26,27);\">Gen 1:26-27</a>; <a href=\"#\" onClick=\"return mV('Gen',5,2);\">5:2</a>; <a href=\"#\" onClick=\"return mV('Gen',8,21);\">8:21</a>; <a href=\"#\" onClick=\"return mV('Deu',8,3);\">Deu 8:3</a>). Its equivalents are the Latin homo and the Greek anthropos (<a href=\"#\" onClick=\"return mV('Mat',5,13, 16);\">Mat 5:13, 16</a>). It denotes also man in opposition to woman (<a href=\"#\" onClick=\"return mV('Gen',3,12);\">Gen 3:12</a>; <a href=\"#\" onClick=\"return mV('Mat',19,10);\">Mat 19:10</a>).<br><br>(2.) Heb. 'ish, like the Latin vir and Greek aner, denotes properly a man in opposition to a woman (<a href=\"#\" onClick=\"return mV('1Sa',17,33);\">1Sa 17:33</a>; <a href=\"#\" onClick=\"return mV('Mat',14,21);\">Mat 14:21</a>); a husband (<a href=\"#\" onClick=\"return mV('Gen',3,16);\">Gen 3:16</a>; <a href=\"#\" onClick=\"return mV('Hsa',2,16);\">Hsa 2:16</a>); man with reference to excellent mental qualities.<br><br>(3.) Heb. 'enosh, man as mortal, transient, perishable (<a href=\"#\" onClick=\"return mV('2Ch',14,11);\">2Ch 14:11</a>; <a href=\"#\" onClick=\"return mV('Isa',8,1);\">Isa 8:1</a>; <a href=\"#\" onClick=\"return mV('Job',15,14);\">Job 15:14</a>; <a href=\"#\" onClick=\"return mV('Psa',8,4);\">Psa 8:4</a>; <a href=\"#\" onClick=\"return mV('Psa',9,19,20);\">9:19-20</a>; <a href=\"#\" onClick=\"return mV('Psa',103,15);\">103:15</a>). It is applied to women (<a href=\"#\" onClick=\"return mV('Jos',8,25);\">Jos 8:25</a>).<br><br>(4.) Heb. geber, man with reference to his strength, as distinguished from women (<a href=\"#\" onClick=\"return mV('Deu',22,5);\">Deu 22:5</a>) and from children (<a href=\"#\" onClick=\"return mV('Exd',12,37);\">Exd 12:37</a>); a husband (<a href=\"#\" onClick=\"return mV('Pro',6,34);\">Pro 6:34</a>).<br><br>(5.) Heb. methim, men as mortal (<a href=\"#\" onClick=\"return mV('Isa',41,14);\">Isa 41:14</a>), and as opposed to women and children (<a href=\"#\" onClick=\"return mV('Deu',3,6);\">Deu 3:6</a>; <a href=\"#\" onClick=\"return mV('Job',11,3);\">Job 11:3</a>; <a href=\"#\" onClick=\"return mV('Isa',3,25);\">Isa 3:25</a>).<br><br>Man was created by the immediate hand of God, and is generically different from all other creatures (<a href=\"#\" onClick=\"return mV('Gen',1,26,27);\">Gen 1:26-27</a>; <a href=\"#\" onClick=\"return mV('Gen',2,7);\">2:7</a>). His complex nature is composed of two elements, two distinct substances, viz., body and soul (<a href=\"#\" onClick=\"return mV('Gen',2,7);\">Gen 2:7</a>; <a href=\"#\" onClick=\"return mV('Ecc',12,7);\">Ecc 12:7</a>; <a href=\"#\" onClick=\"return mV('2Cr',5,'1-8');\">2Cr 5:1-8</a>).<br><br>The words translated \"spirit\" and \"soul,\" in <a href=\"#\" onClick=\"return mV('1Th',5,23);\">1Th 5:23</a>; <a href=\"#\" onClick=\"return mV('Hbr',4,12);\">Hbr 4:12</a>, are habitually used interchangeably (<a href=\"#\" onClick=\"return mV('Mat',10,28);\">Mat 10:28</a>; <a href=\"#\" onClick=\"return mV('Mat',16,26);\">16:26</a>; <a href=\"#\" onClick=\"return mV('1Pe',1,22);\">1Pe 1:22</a>). The \"spirit\" (Gr. pneuma) is the soul as rational; the \"soul\" (Gr. psuche) is the same, considered as the animating and vital principle of the body.<br><br>Man was created in the likeness of God as to the perfection of his nature, in knowledge (<a href=\"#\" onClick=\"return mV('Col',3,10);\">Col 3:10</a>), righteousness, and holiness (<a href=\"#\" onClick=\"return mV('Eph',4,24);\">Eph 4:24</a>), and as having dominion over all the inferior creatures (<a href=\"#\" onClick=\"return mV('Gen',1,28);\">Gen 1:28</a>). He had in his original state God's law written on his heart, and had power to obey it, and yet was capable of disobeying, being left to the freedom of his own will. He was created with holy dispositions, prompting him to holy actions; but he was fallible, and did fall from his integrity (<a href=\"#\" onClick=\"return mV('Gen',3,'1-6');\">3:1-6</a>). (See  <a href=\"#\" onClick=\"return doDictLookup('ET0001304');\">FALL</a>.)";
eastonArray["$$T0002399"] = "<strong>Manaen:</strong> consoler, a Christian teacher at Antioch. Nothing else is known of him beyond what is stated in <a href=\"#\" onClick=\"return mV('Act',13,1);\">Act 13:1</a>, where he is spoken of as having been brought up with (Gr. syntrophos; rendered in R.V. \"foster brother\" of) Herod, i.e., Herod Antipas, the tetrach, who, with his brother Archelaus, was educated at Rome.";
