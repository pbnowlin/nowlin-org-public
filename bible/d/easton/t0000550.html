<script>var eastonArray = new Array ();
eastonArray["$$T0000550"] = "<strong>Beth-barah:</strong> house of crossing, a place south of the scene of Gideon's victory (<a href=\"#\" onClick=\"return mV('Jdg',7,24);\">Jdg 7:24</a>). It was probably the chief ford of the Jordan in that district, and may have been that by which Jacob crossed when he returned from Mesopotamia, near the Jabbok (<a href=\"#\" onClick=\"return mV('Gen',32,22);\">Gen 32:22</a>), and at which Jephthah slew the Ephraimites (<a href=\"#\" onClick=\"return mV('Jdg',12,4);\">Jdg 12:4</a>). Nothing, however, is certainly known of it. (See  <a href=\"#\" onClick=\"return doDictLookup('ET0000542');\">BETHABARA</a>.)";
eastonArray["$$T0000551"] = "<strong>Beth-car:</strong> sheep-house, a place to which the Israelites pursued the Philistines west from Mizpeh (<a href=\"#\" onClick=\"return mV('1Sa',7,11);\">1Sa 7:11</a>).";
eastonArray["$$T0000552"] = "<strong>Beth-dagon:</strong> house of Dagon.<br><br>(1.) A city in the low country or plain of Judah, near Philistia (<a href=\"#\" onClick=\"return mV('Jos',15,41);\">Jos 15:41</a>); the modern Beit Degan, about 5 miles from Lydda.<br><br>(2.) A city near the south-east border of Asher (<a href=\"#\" onClick=\"return mV('Jos',19,27);\">Jos 19:27</a>). It was a Philistine colony. It is identical with the modern ruined village of Tell D'auk.";
eastonArray["$$T0000553"] = "<strong>Beth-diblathaim:</strong> house of two cakes of figs, a city of Moab, upon which Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',48,22);\">Jer 48:22</a>) denounced destruction. It is called also Almon-diblathaim (<a href=\"#\" onClick=\"return mV('Num',33,46);\">Num 33:46</a>) and Diblath (<a href=\"#\" onClick=\"return mV('Eze',6,14);\">Eze 6:14</a>). (R.V., \"Diblah.\")";
eastonArray["$$T0000554"] = "<strong>Bethel:</strong> house of God.<br><br>(1.) A place in Central Palestine, about 10 miles north of Jerusalem, at the head of the pass of Michmash and Ai. It was originally the royal Canaanite city of Luz (<a href=\"#\" onClick=\"return mV('Gen',28,19);\">Gen 28:19</a>). The name Bethel was at first apparently given to the sanctuary in the neighbourhood of Luz, and was not given to the city itself till after its conquest by the tribe of Ephraim. When Abram entered Canaan he formed his second encampment between Bethel and Hai (<a href=\"#\" onClick=\"return mV('Gen',12,8);\">Gen 12:8</a>); and on his return from Egypt he came back to it, and again \"called upon the name of the Lord\" (<a href=\"#\" onClick=\"return mV('Gen',13,4);\">13:4</a>). Here Jacob, on his way from Beersheba to Haran, had a vision of the angels of God ascending and descending on the ladder whose top reached unto heaven (<a href=\"#\" onClick=\"return mV('Gen',28,10,19);\">28:10, 19</a>); and on his return he again visited this place, \"where God talked with him\" (<a href=\"#\" onClick=\"return mV('Gen',35,'1-15');\">35:1-15</a>), and there he \"built an altar, and called the place El-beth-el\" (q.v.). To this second occasion of God's speaking with Jacob at Bethel, Hosea (<a href=\"#\" onClick=\"return mV('Hsa',12,4,5);\">Hsa 12:4-5</a>) makes reference.<br><br>In troublous times the people went to Bethel to ask counsel of God (<a href=\"#\" onClick=\"return mV('Jdg',20,18,31);\">Jdg 20:18, 31</a>; <a href=\"#\" onClick=\"return mV('Jdg',21,2);\">21:2</a>). Here the ark of the covenant was kept for a long time under the care of Phinehas, the grandson of Aaron (<a href=\"#\" onClick=\"return mV('Jdg',20,'26-28');\">20:26-28</a>). Here also Samuel held in rotation his court of justice (<a href=\"#\" onClick=\"return mV('1Sa',7,16);\">1Sa 7:16</a>). It was included in Israel after the kingdom was divided, and it became one of the seats of the worship of the golden calf (<a href=\"#\" onClick=\"return mV('1Ki',12,'28-33');\">1Ki 12:28-33</a>; <a href=\"#\" onClick=\"return mV('1Ki',13,1);\">13:1</a>). Hence the prophet Hosea (<a href=\"#\" onClick=\"return mV('Hsa',4,15);\">Hsa 4:15</a>; <a href=\"#\" onClick=\"return mV('Hsa',5,8);\">5:8</a>; <a href=\"#\" onClick=\"return mV('Hsa',10,5,8);\">10:5, 8</a>) calls it in contempt Beth-aven, i.e., \"house of idols.\" Bethel remained an abode of priests even after the kingdom of Israel was desolated by the king of Assyria (<a href=\"#\" onClick=\"return mV('2Ki',17,28,29);\">2Ki 17:28-29</a>). At length all traces of the idolatries were extirpated by Josiah, king of Judah (<a href=\"#\" onClick=\"return mV('2Ki',23,'15-18');\">2Ki 23:15-18</a>); and the place was still in existence after the Captivity (<a href=\"#\" onClick=\"return mV('Ezr',2,28);\">Ezr 2:28</a>; <a href=\"#\" onClick=\"return mV('Neh',7,32);\">Neh 7:32</a>). It has been identified with the ruins of Beitin, a small village amid extensive ruins some 9 miles south of Shiloh.<br><br>(2.) Mount Bethel was a hilly district near Bethel (<a href=\"#\" onClick=\"return mV('Jos',16,1);\">Jos 16:1</a>; <a href=\"#\" onClick=\"return mV('1Sa',13,2);\">1Sa 13:2</a>).<br><br>(3.) A town in the south of Judah (<a href=\"#\" onClick=\"return mV('Jos',8,17);\">Jos 8:17</a>; <a href=\"#\" onClick=\"return mV('Jos',12,16);\">12:16</a>).";
eastonArray["$$T0000555"] = "<strong>Bethelite:</strong> a designation of Hiel (q.v.), who rebuilt Jericho and experienced the curse pronounced long before (<a href=\"#\" onClick=\"return mV('1Ki',16,34);\">1Ki 16:34</a>).";
eastonArray["$$T0000556"] = "<strong>Bether:</strong> dissection or separation, certain mountains mentioned in <a href=\"#\" onClick=\"return mV('Sgs',2,17);\">Sgs 2:17</a>; probably near Lebanon.";
eastonArray["$$T0000557"] = "<strong>Bethesda:</strong> house of mercy, a reservoir (Gr. kolumbethra, \"a swimming bath\") with five porches, close to the sheep-gate or market (<a href=\"#\" onClick=\"return mV('Neh',3,1);\">Neh 3:1</a>; <a href=\"#\" onClick=\"return mV('Jhn',5,2);\">Jhn 5:2</a>). Eusebius the historian (A.D. 330) calls it \"the sheep-pool.\" It is also called \"Bethsaida\" and \"Beth-zatha\" (<a href=\"#\" onClick=\"return mV('Jhn',5,2);\">Jhn 5:2</a>, R.V. marg.). Under these \"porches\" or colonnades were usually a large number of infirm people waiting for the \"troubling of the water.\" It is usually identified with the modern so-called Fountain of the Virgin, in the valley of the Kidron, and not far from the Pool of Siloam (q.v.); and also with the Birket Israel, a pool near the mouth of the valley which runs into the Kidron south of \"St. Stephen's Gate.\" Others again identify it with the twin pools called the \"Souterrains,\" under the convent of the Sisters of Zion, situated in what must have been the rock-hewn ditch between Bezetha and the fortress of Antonia. But quite recently Schick has discovered a large tank, as sketched here, situated about 100 feet north-west of St. Anne's Church, which is, as he contends, very probably the Pool of Bethesda. No certainty as to its identification, however, has as yet been arrived at. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001378');\">FOUNTAIN</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0001485');\">GIHON</a>.)";
eastonArray["$$T0000558"] = "<strong>Beth-gamul:</strong> camel-house, a city in the \"plain country\" of Moab denounced by the prophet (<a href=\"#\" onClick=\"return mV('Jer',48,23);\">Jer 48:23</a>); probably the modern Um-el-Jemal, near Bozrah, one of the deserted cities of the Hauran.";
eastonArray["$$T0000559"] = "<strong>Beth-gilgal:</strong> house of Gilgal, a place from which the inhabitants gathered for the purpose of celebrating the rebuilding of the walls on the return exile (<a href=\"#\" onClick=\"return mV('Neh',12,29);\">Neh 12:29</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001489');\">GILGAL</a>.)";
eastonArray["$$T0000560"] = "<strong>Beth-haccerem:</strong> house of a vineyard, a place in the tribe of Judah (<a href=\"#\" onClick=\"return mV('Neh',3,14);\">Neh 3:14</a>) where the Benjamites were to set up a beacon when they heard the trumpet against the invading army of the Babylonians (<a href=\"#\" onClick=\"return mV('Jer',6,1);\">Jer 6:1</a>). It is probable that this place is the modern 'Ain Karim, or \"well of the vineyards,\" near which there is a ridge on which are cairns which may have served as beacons of old, one of which is 40 feet high and 130 in diameter.";
eastonArray["$$T0000561"] = "<strong>Beth-horon:</strong> house of the hollow, or of the cavern, the name of two towns or villages (<a href=\"#\" onClick=\"return mV('2Ch',8,5);\">2Ch 8:5</a>; <a href=\"#\" onClick=\"return mV('1Ch',7,24);\">1Ch 7:24</a>) in the territory of Ephraim, on the way from Jerusalem to Joppa. They are distinguished as Beth-horon \"the upper\" and Beth-horon \"the nether.\" They are about 2 miles apart, the former being about 10 miles north-west of Jerusalem. Between the two places was the ascent and descent of Beth-horon, leading from Gibeon down to the western plain (<a href=\"#\" onClick=\"return mV('Jos',10,10,11);\">Jos 10:10-11</a>; <a href=\"#\" onClick=\"return mV('Jos',18,13,14);\">18:13-14</a>), down which the five kings of the Amorites were driven by Joshua in that great battle, the most important in which the Hebrews had been as yet engaged, being their first conflict with their enemies in the open field. Jehovah interposed in behalf of Israel by a terrific hailstorm, which caused more deaths among the Canaanites than did the swords of the Israelites. Beth-horon is mentioned as having been taken by Shishak, B.C. 945, in the list of his conquests, and the pass was the scene of a victory of Judas Maccabeus. (<a href=\"#\" onClick=\"return mV('Exd',9,19,25);\">Exd 9:19, 25</a>; <a href=\"#\" onClick=\"return mV('Job',38,22,23);\">Job 38:22-23</a>; <a href=\"#\" onClick=\"return mV('Psa',18,'12-14');\">Psa 18:12-14</a>; <a href=\"#\" onClick=\"return mV('Isa',30,30);\">Isa 30:30</a>.) The modern name of these places is Beit-ur, distinguished by el-Foka, \"the upper,\" and el-Tahta, \"the nether.\" The lower was at the foot of the pass, and the upper, 500 feet higher, at the top, west of Gibeon. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001480');\">GIBEON</a>.)";
eastonArray["$$T0000562"] = "<strong>Beth-jeshimoth:</strong> house of wastes, or deserts, a town near Abel-shittim, east of Jordan, in the desert of Moab, where the Israelites encamped not long before crossing the Jordan (<a href=\"#\" onClick=\"return mV('Num',33,49);\">Num 33:49</a>; A.V., \"Bethjesimoth\"). It was within the territory of Sihon, king of the Amorites (<a href=\"#\" onClick=\"return mV('Jos',12,3);\">Jos 12:3</a>).";
eastonArray["$$T0000563"] = "<strong>Beth-le-Aphrah:</strong> (<a href=\"#\" onClick=\"return mV('Mic',1,10);\">Mic 1:10</a>), house of dust. The Authorized Version reads \"in the house of Aphrah.\" This is probably the name of a town in the Shephelah, or \"low country,\" between Joppa and Gaza.";
eastonArray["$$T0000564"] = "<strong>Bethlehem:</strong> house of bread.<br><br>(1.) A city in the \"hill country\" of Judah. It was originally called Ephrath (<a href=\"#\" onClick=\"return mV('Gen',35,16,19);\">Gen 35:16, 19</a>; <a href=\"#\" onClick=\"return mV('Gen',48,7);\">48:7</a>; <a href=\"#\" onClick=\"return mV('Rth',4,11);\">Rth 4:11</a>). It was also called Beth-lehem Ephratah (<a href=\"#\" onClick=\"return mV('Mic',5,2);\">Mic 5:2</a>), Beth-lehem-judah (<a href=\"#\" onClick=\"return mV('1Sa',17,12);\">1Sa 17:12</a>), and \"the city of David\" (<a href=\"#\" onClick=\"return mV('Luk',2,4);\">Luk 2:4</a>). It is first noticed in Scripture as the place where Rachel died and was buried \"by the wayside,\" directly to the north of the city (<a href=\"#\" onClick=\"return mV('Gen',48,7);\">Gen 48:7</a>). The valley to the east was the scene of the story of Ruth the Moabitess. There are the fields in which she gleaned, and the path by which she and Naomi returned to the town. Here was David's birth-place, and here also, in after years, he was anointed as king by Samuel (<a href=\"#\" onClick=\"return mV('1Sa',16,'4-13');\">1Sa 16:4-13</a>); and it was from the well of Bethlehem that three of his heroes brought water for him at the risk of their lives when he was in the cave of Adullam (<a href=\"#\" onClick=\"return mV('2Sa',23,'13-17');\">2Sa 23:13-17</a>). But it was distinguished above every other city as the birth-place of \"Him whose goings forth have been of old\" (<a href=\"#\" onClick=\"return mV('Mat',2,6);\">Mat 2:6</a>; <a href=\"#\" onClick=\"return mV('Mic',5,2);\">Mic 5:2</a>). Afterwards Herod, \"when he saw that he was mocked of the wise men,\" sent and slew \"all the children that were in Bethlehem, and in all the coasts thereof, from two years old and under\" (<a href=\"#\" onClick=\"return mV('Mat',2,16,18);\">Mat 2:16, 18</a>; <a href=\"#\" onClick=\"return mV('Jer',31,15);\">Jer 31:15</a>).<br><br>Bethlehem bears the modern name of Beit-Lahm, i.e., \"house of flesh.\" It is about 5 miles south of Jerusalem, standing at an elevation of about 2,550 feet above the sea, thus 100 feet higher than Jerusalem.<br><br>There is a church still existing, built by Constantine the Great (A.D. 330), called the \"Church of the Nativity,\" over a grotto or cave called the \"holy crypt,\" and said to be the \"stable\" in which Jesus was born. This is perhaps the oldest existing Christian church in the world. Close to it is another grotto, where Jerome the Latin father is said to have spent thirty years of his life in translating the Scriptures into Latin. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003768');\">VERSION</a>.)<br><br>(2.) A city of Zebulun, mentioned only in <a href=\"#\" onClick=\"return mV('Jos',19,15);\">Jos 19:15</a>. Now Beit-Lahm, a ruined village about 6 miles west-north-west of Nazareth.";
eastonArray["$$T0000565"] = "<strong>Beth-peor:</strong> house of Peor; i.e., \"temple of Baal-peor\", a place in Moab, on the east of Jordan, opposite Jericho. It was in the tribe of Reuben (<a href=\"#\" onClick=\"return mV('Jos',13,20);\">Jos 13:20</a>; <a href=\"#\" onClick=\"return mV('Deu',3,29);\">Deu 3:29</a>; <a href=\"#\" onClick=\"return mV('Deu',4,46);\">4:46</a>). In the \"ravine\" or valley over against Beth-peor Moses was probably buried (<a href=\"#\" onClick=\"return mV('Deu',34,6);\">Deu 34:6</a>).";
eastonArray["$$T0000566"] = "<strong>Beth-phage:</strong> house of the unripe fig, a village on the Mount of Olives, on the road from Jerusalem to Jericho (<a href=\"#\" onClick=\"return mV('Mat',21,1);\">Mat 21:1</a>; <a href=\"#\" onClick=\"return mV('Mar',11,1);\">Mar 11:1</a>; <a href=\"#\" onClick=\"return mV('Luk',19,29);\">Luk 19:29</a>), and very close to Bethany. It was the limit of a Sabbath-day's journey from Jerusalem, i.e., 2,000 cubits. It has been identified with the modern Kefr-et-Tur.";
eastonArray["$$T0000567"] = "<strong>Bethsaida:</strong> house of fish.<br><br>(1.) A town in Galilee, on the west side of the sea of Tiberias, in the \"land of Gennesaret.\" It was the native place of Peter, Andrew, and Philip, and was frequently resorted to by Jesus (<a href=\"#\" onClick=\"return mV('Mar',6,45);\">Mar 6:45</a>; <a href=\"#\" onClick=\"return mV('Jhn',1,44);\">Jhn 1:44</a>; <a href=\"#\" onClick=\"return mV('Jhn',12,21);\">12:21</a>). It is supposed to have been at the modern 'Ain Tabighah, a bay to the north of Gennesaret.<br><br>(2.) A city near which Christ fed 5,000 (<a href=\"#\" onClick=\"return mV('Luk',9,10);\">Luk 9:10</a>; <a href=\"#\" onClick=\"return mV('Jhn',6,17);\">Jhn 6:17</a>; <a href=\"#\" onClick=\"return mV('Mat',14,'15-21');\">Mat 14:15-21</a>), and where the blind man had his sight restored (<a href=\"#\" onClick=\"return mV('Mar',8,22);\">Mar 8:22</a>), on the east side of the lake, two miles up the Jordan. It stood within the region of Gaulonitis, and was enlarged by Philip the tetrarch, who called it \"Julias,\" after the emperor's daughter. Or, as some have supposed, there may have been but one Bethsaida built on both sides of the lake, near where the Jordan enters it. Now the ruins et-Tel.";
eastonArray["$$T0000568"] = "<strong>Beth-shean:</strong> house of security or rest, a city which belonged to Manasseh (<a href=\"#\" onClick=\"return mV('1Ch',7,29);\">1Ch 7:29</a>), on the west of Jordan. The bodies of Saul and his sons were fastened to its walls. In Solomon's time it gave its name to a district (<a href=\"#\" onClick=\"return mV('1Ki',4,12);\">1Ki 4:12</a>). The name is found in an abridged form, Bethshan, in <a href=\"#\" onClick=\"return mV('1Sa',31,10,12);\">1Sa 31:10, 12</a>, and <a href=\"#\" onClick=\"return mV('2Sa',21,12);\">2Sa 21:12</a>. It is on the road from Jerusalem to Damascus, about 5 miles from the Jordan, and 14 from the south end of the Lake of Gennesaret. After the Captivity it was called Scythopolis, i.e., \"the city of the Scythians,\" who about B.C. 640 came down from the steppes of Southern Russia and settled in different places in Syria. It is now called Beisan.";
eastonArray["$$T0000569"] = "<strong>Beth-shemesh:</strong> house of the sun.<br><br>(1.) A sacerdotal city in the tribe of Dan (<a href=\"#\" onClick=\"return mV('Jos',21,16);\">Jos 21:16</a>; <a href=\"#\" onClick=\"return mV('1Sa',6,15);\">1Sa 6:15</a>), on the north border of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,10);\">Jos 15:10</a>). It was the scene of an encounter between Jehoash, king of Israel, and Amaziah, king of Judah, in which the latter was made prisoner (<a href=\"#\" onClick=\"return mV('2Ki',14,11,13);\">2Ki 14:11, 13</a>). It was afterwards taken by the Philistines (<a href=\"#\" onClick=\"return mV('2Ch',28,18);\">2Ch 28:18</a>). It is the modern ruined Arabic village 'Ain-shems, on the north-west slopes of the mountains of Judah, 14 miles west of Jerusalem.<br><br>(2.) A city between Dothan and the Jordan, near the southern border of Issachar (<a href=\"#\" onClick=\"return mV('Jos',19,22);\">Jos 19:22</a>), 7 1/2 miles south of Beth-shean. It is the modern Ain-esh-Shemsiyeh.<br><br>(3.) One of the fenced cities of Naphtali (<a href=\"#\" onClick=\"return mV('Jos',19,38);\">Jos 19:38</a>), between Mount Tabor and the Jordan. Now Khurbet Shema, 3 miles west of Safed. But perhaps the same as No. 2.<br><br>(4.) An idol sanctuary in Egypt (<a href=\"#\" onClick=\"return mV('Jer',43,13);\">Jer 43:13</a>); called by the Greeks Heliopolis, and by the Egyptians On (q.v.), <a href=\"#\" onClick=\"return mV('Gen',41,45);\">Gen 41:45</a>.";
eastonArray["$$T0000570"] = "<strong>Beth-tappuah:</strong> house of apples, a town of Judah, now Tuffuh, 5 miles west of Hebron (<a href=\"#\" onClick=\"return mV('Jos',15,53);\">Jos 15:53</a>).";
eastonArray["$$T0000571"] = "<strong>Bethuel:</strong> man of God, or virgin of God, or house of God.<br><br>(1.) The son of Nahor by Milcah; nephew of Abraham, and father of Rebekah (<a href=\"#\" onClick=\"return mV('Gen',22,22,23);\">Gen 22:22-23</a>; <a href=\"#\" onClick=\"return mV('Gen',24,15,24,47);\">24:15, 24, 47</a>). He appears in person only once (<a href=\"#\" onClick=\"return mV('Gen',24,50);\">24:50</a>).<br><br>(2.) A southern city of Judah (<a href=\"#\" onClick=\"return mV('1Ch',4,30);\">1Ch 4:30</a>); called also Bethul (<a href=\"#\" onClick=\"return mV('Jos',19,4);\">Jos 19:4</a>) and Bethel (<a href=\"#\" onClick=\"return mV('Jos',12,16);\">12:16</a>; <a href=\"#\" onClick=\"return mV('1Sa',30,27);\">1Sa 30:27</a>).";
eastonArray["$$T0000572"] = "<strong>Bethzur:</strong> house of rock, a town in the mountains of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,58);\">Jos 15:58</a>), about 4 miles to the north of Hebron. It was built by Rehoboam for the defence of his kingdom (<a href=\"#\" onClick=\"return mV('2Ch',11,7);\">2Ch 11:7</a>). It stood near the modern ed-Dirweh. Its ruins are still seen on a hill which bears the name of Beit-Sur, and which commands the road from Beer-sheba and Hebron to Jerusalem from the south.";
eastonArray["$$T0000573"] = "<strong>Betroth:</strong> to promise \"by one's truth.\" Men and women were betrothed when they were engaged to be married. This usually took place a year or more before marriage. From the time of betrothal the woman was regarded as the lawful wife of the man to whom she was betrothed (<a href=\"#\" onClick=\"return mV('Deu',28,30);\">Deu 28:30</a>; <a href=\"#\" onClick=\"return mV('Jdg',14,2,8);\">Jdg 14:2, 8</a>; <a href=\"#\" onClick=\"return mV('Mat',1,'18-21');\">Mat 1:18-21</a>). The term is figuratively employed of the spiritual connection between God and his people (<a href=\"#\" onClick=\"return mV('Hsa',2,19,20);\">Hsa 2:19-20</a>).";
eastonArray["$$T0000574"] = "<strong>Beulah:</strong> married, is used in <a href=\"#\" onClick=\"return mV('Isa',62,4);\">Isa 62:4</a> metaphorically as the name of Judea: \"Thy land shall be married,\" i.e., favoured and blessed of the Lord.";
eastonArray["$$T0000575"] = "<strong>Bewray:</strong> to reveal or disclose; an old English word equivalent to \"betray\" (<a href=\"#\" onClick=\"return mV('Pro',27,16);\">Pro 27:16</a>; <a href=\"#\" onClick=\"return mV('Pro',29,24);\">29:24</a>, R.V., \"uttereth; <a href=\"#\" onClick=\"return mV('Isa',16,3);\">Isa 16:3</a>; <a href=\"#\" onClick=\"return mV('Mat',26,73);\">Mat 26:73</a>).";
eastonArray["$$T0000576"] = "<strong>Beyond:</strong> when used with reference to Jordan, signifies in the writings of Moses the west side of the river, as he wrote on the east bank (<a href=\"#\" onClick=\"return mV('Gen',50,10,11);\">Gen 50:10-11</a>; <a href=\"#\" onClick=\"return mV('Deu',1,1,5);\">Deu 1:1, 5</a>; <a href=\"#\" onClick=\"return mV('Deu',3,8,20);\">3:8, 20</a>; <a href=\"#\" onClick=\"return mV('Deu',4,46);\">4:46</a>); but in the writings of Joshua, after he had crossed the river, it means the east side (<a href=\"#\" onClick=\"return mV('Jos',5,1);\">Jos 5:1</a>; <a href=\"#\" onClick=\"return mV('Jos',12,7);\">12:7</a>; <a href=\"#\" onClick=\"return mV('Jos',22,7);\">22:7</a>).";
eastonArray["$$T0000577"] = "<strong>Bezaleel:</strong> in the shadow of God; i.e., \"under his protection\", the artificer who executed the work of art in connection with the tabernacle in the wilderness (<a href=\"#\" onClick=\"return mV('Exd',31,2);\">Exd 31:2</a>; <a href=\"#\" onClick=\"return mV('Exd',35,30);\">35:30</a>). He was engaged principally in works of metal, wood, and stone; while Aholiab, who was associated with him and subordinate to him, had the charge of the textile fabrics (<a href=\"#\" onClick=\"return mV('Exd',36,1,2);\">36:1-2</a>; <a href=\"#\" onClick=\"return mV('Exd',38,22);\">38:22</a>). He was of the tribe of Judah, the son of Uri, and grandson of Hur (<a href=\"#\" onClick=\"return mV('Exd',31,2);\">31:2</a>). Mention is made in <a href=\"#\" onClick=\"return mV('Ezr',10,30);\">Ezr 10:30</a> of another of the same name.";
eastonArray["$$T0000578"] = "<strong>Bezek:</strong> lightning.<br><br>(1.) The residence of Adoni-bezek, in the lot of Judah (<a href=\"#\" onClick=\"return mV('Jdg',1,5);\">Jdg 1:5</a>). It was in the mountains, not far from Jerusalem. Probably the modern Bezkah, 6 miles south-east of Lydda.<br><br>(2.) The place where Saul numbered the forces of Israel and Judah (<a href=\"#\" onClick=\"return mV('1Sa',11,8);\">1Sa 11:8</a>); somewhere in the centre of the country, near the Jordan valley. Probably the modern Ibzik, 13 miles north-east of Shechem.";
eastonArray["$$T0000579"] = "<strong>Bezer:</strong> ore of gold or silver.<br><br>(1.) A city of the Reubenites; one of the three cities of refuge on the east of Jordan (<a href=\"#\" onClick=\"return mV('Deu',4,43);\">Deu 4:43</a>; <a href=\"#\" onClick=\"return mV('Jos',20,8);\">Jos 20:8</a>). It has been identified with the modern ruined village of Burazin, some 12 miles north of Heshbon; also with Kasur-el-Besheir, 2 miles south-west of Dibon.<br><br>(2.) A descendant of Asher (<a href=\"#\" onClick=\"return mV('1Ch',7,37);\">1Ch 7:37</a>).";
eastonArray["$$T0000580"] = "<strong>Bible:</strong> Bible, the English form of the Greek name <i>Biblia</i>, meaning \"books,\" the name which in the fifth century began to be given to the entire collection of sacred books, the \"Library of Divine Revelation.\" The name Bible was adopted by Wickliffe, and came gradually into use in our English language. The Bible consists of sixty-six different books, composed by many different writers, in three different languages, under different circumstances; writers of almost every social rank, statesmen and peasants, kings, herdsmen, fishermen, priests, tax-gatherers, tentmakers; educated and uneducated, Jews and Gentiles; most of them unknown to each other, and writing at various periods during the space of about 1600 years: and yet, after all, it is only one book dealing with only one subject in its numberless aspects and relations, the subject of man's redemption.<br><br>It is divided into the Old Testament, containing thirty-nine books, and the New Testament, containing twenty-seven books. The names given to the Old in the writings of the New are \"the scriptures\" (<a href=\"#\" onClick=\"return mV('Mat',21,42);\">Mat 21:42</a>), \"scripture\" (<a href=\"#\" onClick=\"return mV('2Pe',1,20);\">2Pe 1:20</a>), \"the holy scriptures\" (<a href=\"#\" onClick=\"return mV('Rom',1,2);\">Rom 1:2</a>), \"the law\" (<a href=\"#\" onClick=\"return mV('Jhn',12,34);\">Jhn 12:34</a>), \"the law of Moses, the prophets, and the psalms\" (<a href=\"#\" onClick=\"return mV('Luk',24,44);\">Luk 24:44</a>), \"the law and the prophets\" (<a href=\"#\" onClick=\"return mV('Mat',5,17);\">Mat 5:17</a>), \"the old covenant\" (<a href=\"#\" onClick=\"return mV('2Cr',3,14);\">2Cr 3:14</a>, R.V.). There is a break of 400 years between the Old Testament and the New. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000263');\">APOCRYPHA</a>.)<br><br>The Old Testament is divided into three parts:,<br><br>1. The Law (Torah), consisting of the Pentateuch, or five books of Moses.<br><br>2. The Prophets, consisting of (1) the former, namely, Joshua, Judges, the Books of Samuel, and the Books of Kings; (2) the latter, namely, the greater prophets, Isaiah, Jeremiah, and Ezekiel, and the twelve minor prophets.<br><br>3. The Hagiographa, or holy writings, including the rest of the books. These were ranked in three divisions:, (1) The Psalms, Proverbs, and Job, distinguished by the Hebrew name, a word formed of the initial letters of these books, <i>emeth</i>, meaning truth. (2) Canticles, Ruth, Lamentations, Ecclesiastes, and Esther, called the five rolls, as being written for the synagogue use on five separate rolls. (3) Daniel, Ezra, Nehemiah, and 1 and 2 Chronicles. Between the Old and the New Testament no addition was made to the revelation God had already given. The period of New Testament revelation, extending over a century, began with the appearance of John the Baptist.<br><br>The New Testament consists of (1) the historical books, viz., the Gospels, and the Acts of the Apostles; (2) the Epistles; and (3) the book of prophecy, the Revelation.<br><br>The division of the Bible into chapters and verses is altogether of human invention, designed to facilitate reference to it. The ancient Jews divided the Old Testament into certain sections for use in the synagogue service, and then at a later period, in the ninth century A.D., into verses. Our modern system of chapters for all the books of the Bible was introduced by Cardinal Hugo about the middle of the thirteenth century (he died 1263). The system of verses for the New Testament was introduced by Stephens in 1551, and generally adopted, although neither Tyndale's nor Coverdale's English translation of the Bible has verses. The division is not always wisely made, yet it is very useful. (See VERSION <a href=\"#\" onClick=\"return doDictLookup('ET0003768');\">T0003768</a>.)";
eastonArray["$$T0000581"] = "<strong>Bier:</strong> the frame on which dead bodies were conveyed to the grave (<a href=\"#\" onClick=\"return mV('Luk',7,14);\">Luk 7:14</a>).";
eastonArray["$$T0000582"] = "<strong>Bigtha:</strong> garden, or gift of fortune, one of the seven eunuchs or chamberlains who had charge of the harem of Ahasuerus (<a href=\"#\" onClick=\"return mV('Est',1,10);\">Est 1:10</a>).";
eastonArray["$$T0000583"] = "<strong>Bigthan:</strong> one of the eunuchs who \"kept the door\" in the court of Ahasuerus. With Teresh he conspired against the king's life. Mordecai detected the conspiracy, and the culprits were hanged (<a href=\"#\" onClick=\"return mV('Est',2,'21-23');\">Est 2:21-23</a>; <a href=\"#\" onClick=\"return mV('Est',6,'1-3');\">6:1-3</a>).";
eastonArray["$$T0000584"] = "<strong>Bildad:</strong> son of contention, one of Job's friends. He is called \"the Shuhite,\" probably as belonging to Shuah, a district in Arabia, in which Shuah, the sixth son of Abraham by Keturah, settled (<a href=\"#\" onClick=\"return mV('Gen',25,2);\">Gen 25:2</a>). He took part in each of the three controversies into which Job's friends entered with him (<a href=\"#\" onClick=\"return mV('Job',8,1);\">Job 8:1</a>; <a href=\"#\" onClick=\"return mV('Job',18,1);\">18:1</a>; <a href=\"#\" onClick=\"return mV('Job',25,1);\">25:1</a>), and delivered three speeches, very severe and stern in their tone, although less violent than those of Zophar, but more so than those of Eliphaz.";
eastonArray["$$T0000585"] = "<strong>Bilgah:</strong> cheerful.<br><br>(1.) The head of the fifteenth sacerdotal course for the temple service (<a href=\"#\" onClick=\"return mV('1Ch',24,14);\">1Ch 24:14</a>).<br><br>(2.) A priest who returned from Babylon with Zerubbabel (<a href=\"#\" onClick=\"return mV('Neh',12,5,18);\">Neh 12:5, 18</a>).";
eastonArray["$$T0000586"] = "<strong>Bilhah:</strong> faltering; bashful, Rachel's handmaid, whom she gave to Jacob (<a href=\"#\" onClick=\"return mV('Gen',29,29);\">Gen 29:29</a>). She was the mother of Dan and Naphtali (<a href=\"#\" onClick=\"return mV('Gen',30,'3-8');\">Gen 30:3-8</a>). Reuben was cursed by his father for committing adultry with her (<a href=\"#\" onClick=\"return mV('Gen',35,22);\">35:22</a>; <a href=\"#\" onClick=\"return mV('Gen',49,4);\">49:4</a>). He was deprived of the birth-right, which was given to the sons of Joseph.";
eastonArray["$$T0000587"] = "<strong>Bilshan:</strong> son of the tongue; i.e., \"eloquent\", a man of some note who returned from the Captivity with Zerubbabel (<a href=\"#\" onClick=\"return mV('Ezr',2,2);\">Ezr 2:2</a>; <a href=\"#\" onClick=\"return mV('Neh',7,7);\">Neh 7:7</a>).";
eastonArray["$$T0000588"] = "<strong>Bird:</strong> Birds are divided in the Mosaic law into two classes,<br><br>(1) the clean (<a href=\"#\" onClick=\"return mV('Lev',1,'14-17');\">Lev 1:14-17</a>; <a href=\"#\" onClick=\"return mV('Lev',5,'7-10');\">5:7-10</a>; <a href=\"#\" onClick=\"return mV('Lev',14,'4-7');\">14:4-7</a>), which were offered in sacrifice; and<br><br>(2) the unclean (<a href=\"#\" onClick=\"return mV('Lev',11,'13-20');\">Lev 11:13-20</a>). When offered in sacrifice, they were not divided as other victims were (<a href=\"#\" onClick=\"return mV('Gen',15,10);\">Gen 15:10</a>). They are mentioned also as an article of food (<a href=\"#\" onClick=\"return mV('Deu',14,11);\">Deu 14:11</a>). The art of snaring wild birds is referred to (<a href=\"#\" onClick=\"return mV('Psa',124,7);\">Psa 124:7</a>; <a href=\"#\" onClick=\"return mV('Pro',1,17);\">Pro 1:17</a>; <a href=\"#\" onClick=\"return mV('Pro',7,23);\">7:23</a>; <a href=\"#\" onClick=\"return mV('Jer',5,27);\">Jer 5:27</a>). Singing birds are mentioned in <a href=\"#\" onClick=\"return mV('Psa',104,12);\">Psa 104:12</a>; <a href=\"#\" onClick=\"return mV('Ecc',12,4);\">Ecc 12:4</a>. Their timidity is alluded to (<a href=\"#\" onClick=\"return mV('Hsa',11,11);\">Hsa 11:11</a>). The reference in <a href=\"#\" onClick=\"return mV('Psa',84,3);\">Psa 84:3</a> to the swallow and the sparrow may be only a comparison equivalent to, \"What her house is to the sparrow, and her nest to the swallow, that thine altars are to my soul.\"";
eastonArray["$$T0000589"] = "<strong>Birsha:</strong> son of wickedness, a king of Gomorrah whom Abraham succoured in the invasion of Chedorlaomer (<a href=\"#\" onClick=\"return mV('Gen',14,2);\">Gen 14:2</a>).";
eastonArray["$$T0000590"] = "<strong>Birth:</strong> As soon as a child was born it was washed, and rubbed with salt (<a href=\"#\" onClick=\"return mV('Eze',16,4);\">Eze 16:4</a>), and then swathed with bandages (<a href=\"#\" onClick=\"return mV('Job',38,9);\">Job 38:9</a>; <a href=\"#\" onClick=\"return mV('Luk',2,7,12);\">Luk 2:7, 12</a>). A Hebrew mother remained forty days in seclusion after the birth of a son, and after the birth of a daughter double that number of days. At the close of that period she entered into the tabernacle or temple and offered up a sacrifice of purification (<a href=\"#\" onClick=\"return mV('Lev',12,'1-8');\">Lev 12:1-8</a>; <a href=\"#\" onClick=\"return mV('Luk',2,22);\">Luk 2:22</a>). A son was circumcised on the eighth day after his birth, being thereby consecrated to God (<a href=\"#\" onClick=\"return mV('Gen',17,'10-12');\">Gen 17:10-12</a>; <a href=\"#\" onClick=\"return mV('Rom',4,11);\">Rom 4:11</a>). Seasons of misfortune are likened to the pains of a woman in travail, and seasons of prosperity to the joy that succeeds child-birth (<a href=\"#\" onClick=\"return mV('Isa',13,8);\">Isa 13:8</a>; <a href=\"#\" onClick=\"return mV('Jer',4,31);\">Jer 4:31</a>; <a href=\"#\" onClick=\"return mV('Jhn',16,21,22);\">Jhn 16:21-22</a>). The natural birth is referred to as the emblem of the new birth (<a href=\"#\" onClick=\"return mV('Jhn',3,'3-8');\">Jhn 3:3-8</a>; <a href=\"#\" onClick=\"return mV('Gal',6,15);\">Gal 6:15</a>; <a href=\"#\" onClick=\"return mV('Tts',3,5);\">Tts 3:5</a>, etc.).";
eastonArray["$$T0000591"] = "<strong>Birth-day:</strong> The observance of birth-days was common in early times (<a href=\"#\" onClick=\"return mV('Job',1,4,13,18);\">Job 1:4, 13, 18</a>). They were specially celebrated in the land of Egypt (<a href=\"#\" onClick=\"return mV('Gen',40,20);\">Gen 40:20</a>). There is no recorded instance in Scripture of the celebration of birth-days among the Jews. On the occasion of Herod's birth-day John the Baptist was beheaded (<a href=\"#\" onClick=\"return mV('Mat',14,6);\">Mat 14:6</a>).";
eastonArray["$$T0000592"] = "<strong>Birthright:</strong><br><br>(1.) This word denotes the special privileges and advantages belonging to the first-born son among the Jews. He became the priest of the family. Thus Reuben was the first-born of the patriarchs, and so the priesthood of the tribes belonged to him. That honour was, however, transferred by God from Reuben to Levi (<a href=\"#\" onClick=\"return mV('Num',3,12,13);\">Num 3:12-13</a>; <a href=\"#\" onClick=\"return mV('Num',8,18);\">8:18</a>).<br><br>(2.) The first-born son had allotted to him also a double portion of the paternal inheritance (<a href=\"#\" onClick=\"return mV('Deu',21,'15-17');\">Deu 21:15-17</a>). Reuben was, because of his undutiful conduct, deprived of his birth-right (<a href=\"#\" onClick=\"return mV('Gen',49,4);\">Gen 49:4</a>; <a href=\"#\" onClick=\"return mV('1Ch',5,1);\">1Ch 5:1</a>). Esau transferred his birth-right to Jacob (<a href=\"#\" onClick=\"return mV('Gen',25,33);\">Gen 25:33</a>).<br><br>(3.) The first-born inherited the judicial authority of his father, whatever it might be (<a href=\"#\" onClick=\"return mV('2Ch',21,3);\">2Ch 21:3</a>). By divine appointment, however, David excluded Adonijah in favour of Solomon.<br><br>(4.) The Jews attached a sacred importance to the rank of \"first-born\" and \"first-begotten\" as applied to the Messiah (<a href=\"#\" onClick=\"return mV('Rom',8,29);\">Rom 8:29</a>; <a href=\"#\" onClick=\"return mV('Col',1,18);\">Col 1:18</a>; <a href=\"#\" onClick=\"return mV('Hbr',1,'4-6');\">Hbr 1:4-6</a>). As first-born he has an inheritance superior to his brethren, and is the alone true priest.";
eastonArray["$$T0000593"] = "<strong>Bishop:</strong> an overseer. In apostolic times, it is quite manifest that there was no difference as to order between bishops and elders or presbyters (<a href=\"#\" onClick=\"return mV('Act',20,'17-28');\">Act 20:17-28</a>; <a href=\"#\" onClick=\"return mV('1Pe',5,'1-2');\">1Pe 5:1-2</a>; <a href=\"#\" onClick=\"return mV('Phl',1,1);\">Phl 1:1</a>; <a href=\"#\" onClick=\"return mV('1Ti',3,'1-')\">1Ti 3</a>). The term bishop is never once used to denote a different office from that of elder or presbyter. These different names are simply titles of the same office, \"bishop\" designating the function, namely, that of oversight, and \"presbyter\" the dignity appertaining to the office. Christ is figuratively called \"the bishop [episcopos] of souls\" (<a href=\"#\" onClick=\"return mV('1Pe',2,25);\">1Pe 2:25</a>).";
eastonArray["$$T0000594"] = "<strong>Bit:</strong> the curb put into the mouths of horses to restrain them. The Hebrew word (metheg) so rendered in <a href=\"#\" onClick=\"return mV('Psa',32,9);\">Psa 32:9</a> is elsewhere translated \"bridle\" (<a href=\"#\" onClick=\"return mV('2Ki',19,28);\">2Ki 19:28</a>; <a href=\"#\" onClick=\"return mV('Pro',26,3);\">Pro 26:3</a>; <a href=\"#\" onClick=\"return mV('Isa',37,29);\">Isa 37:29</a>). Bits were generally made of bronze or iron, but sometimes also of gold or silver. In <a href=\"#\" onClick=\"return mV('Jam',3,3);\">Jam 3:3</a> the Authorized Version translates the Greek word by \"bits,\" but the Revised Version by \"bridles.\"";
eastonArray["$$T0000595"] = "<strong>Bith-ron:</strong> the broken or divided place, a district in the Arabah or Jordan valley, on the east of the river (<a href=\"#\" onClick=\"return mV('2Sa',2,29);\">2Sa 2:29</a>). It was probably the designation of the region in general, which is broken and intersected by ravines.";
eastonArray["$$T0000596"] = "<strong>Bithynia:</strong> a province in Asia Minor, to the south of the Euxine and Propontis. Christian congregations were here formed at an early time (<a href=\"#\" onClick=\"return mV('1Pe',1,1);\">1Pe 1:1</a>). Paul was prevented by the Spirit from entering this province (<a href=\"#\" onClick=\"return mV('Act',16,7);\">Act 16:7</a>). It is noted in church history as the province ruled over by Pliny as Roman proconsul, who was perplexed as to the course he should take with the numerous Christians brought before his tribunal on account of their profession of Christianity and their conduct, and wrote to Trajan, the emperor, for instructions (A.D. 107).";
eastonArray["$$T0000597"] = "<strong>Bitter:</strong> Bitterness is symbolical of affliction, misery, and servitude (<a href=\"#\" onClick=\"return mV('Exd',1,14);\">Exd 1:14</a>; <a href=\"#\" onClick=\"return mV('Rth',1,20);\">Rth 1:20</a>; <a href=\"#\" onClick=\"return mV('Jer',9,15);\">Jer 9:15</a>). The Chaldeans are called the \"bitter and hasty nation\" (<a href=\"#\" onClick=\"return mV('Hab',1,6);\">Hab 1:6</a>). The \"gall of bitterness\" expresses a state of great wickedness (<a href=\"#\" onClick=\"return mV('Act',8,23);\">Act 8:23</a>). A \"root of bitterness\" is a wicked person or a dangerous sin (<a href=\"#\" onClick=\"return mV('Hbr',12,15);\">Hbr 12:15</a>).<br><br>The Passover was to be eaten with \"bitter herbs\" (<a href=\"#\" onClick=\"return mV('Exd',12,8);\">Exd 12:8</a>; <a href=\"#\" onClick=\"return mV('Num',9,11);\">Num 9:11</a>). The kind of herbs so designated is not known. Probably they were any bitter herbs obtainable at the place and time when the Passover was celebrated. They represented the severity of the servitude under which the people groaned; and have been regarded also as typical of the sufferings of Christ.";
eastonArray["$$T0000598"] = "<strong>Bittern:</strong> is found three times in connection with the desolations to come upon Babylon, Idumea, and Nineveh (<a href=\"#\" onClick=\"return mV('Isa',14,23);\">Isa 14:23</a>; <a href=\"#\" onClick=\"return mV('Isa',34,11);\">34:11</a>; <a href=\"#\" onClick=\"return mV('Zep',2,14);\">Zep 2:14</a>). This bird belongs to the class of cranes. Its scientific name is <em>Botaurus stellaris</em>. It is a solitary bird, frequenting marshy ground. The Hebrew word (kippod) thus rendered in the Authorized Version is rendered \"porcupine\" in the Revised Version. But in the passages noted the kippod is associated with birds, with pools of water, and with solitude and desolation. This favours the idea that not the \"porcupine\" but the \"bittern\" is really intended by the word.";
eastonArray["$$T0000599"] = "<strong>Bitumen:</strong> <a href=\"#\" onClick=\"return mV('Gen',11,3);\">Gen 11:3</a>, R.V., margin, rendered in the A.V. \"slime\"), a mineral pitch. With this the ark was pitched (See also <a href=\"#\" onClick=\"return mV('Exd',2,3);\">Exd 2:3</a>.) (See SLIME <a href=\"#\" onClick=\"return doDictLookup('ET0003459');\">T0003459</a>.)";
</script>
