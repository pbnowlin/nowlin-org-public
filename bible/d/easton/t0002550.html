<script>var eastonArray = new Array ();
eastonArray["$$T0002550"] = "<strong>Mill:</strong> for grinding corn, mentioned as used in the time of Abraham (<a href=\"#\" onClick=\"return mV('Gen',18,6);\">Gen 18:6</a>). That used by the Hebrews consisted of two circular stones, each 2 feet in diameter and half a foot thick, the lower of which was called the \"nether millstone\" (<a href=\"#\" onClick=\"return mV('Job',41,24);\">Job 41:24</a>) and the upper the \"rider.\" The upper stone was turned round by a stick fixed in it as a handle. There were then no public mills, and thus each family required to be provided with a hand-mill. The corn was ground daily, generally by the women of the house (<a href=\"#\" onClick=\"return mV('Isa',47,1,2);\">Isa 47:1-2</a>; <a href=\"#\" onClick=\"return mV('Mat',24,41);\">Mat 24:41</a>). It was with the upper stone of a hand-mill that \"a certain woman\" at Thebez broke Abimelech's skull (<a href=\"#\" onClick=\"return mV('Jdg',9,53);\">Jdg 9:53</a>), \"a piece of a millstone;\" literally, \"a millstone rider\", i.e., the \"runner,\" the stone which revolves. (<a href=\"#\" onClick=\"return mV('2Sa',11,21);\">2Sa 11:21</a>). Millstones could not be pledged (<a href=\"#\" onClick=\"return mV('Deu',24,6);\">Deu 24:6</a>), as they were necessary in every family.";
eastonArray["$$T0002551"] = "<strong>Millennium:</strong> a thousand years; the name given to the era mentioned in <a href=\"#\" onClick=\"return mV('Rev',20,'1-7');\">Rev 20:1-7</a>. Some maintain that Christ will personally appear on earth for the purpose of establishing his kingdom at the beginning of this millennium. Those holding this view are usually called \"millenarians.\" On the other hand, it is maintained, more in accordance with the teaching of Scripture, we think, that Christ's second advent will not be premillennial, and that the right conception of the prospects and destiny of his kingdom is that which is taught, e.g., in the parables of the leaven and the mustard-seed. The triumph of the gospel, it is held, must be looked for by the wider and more efficient operation of the very forces that are now at work in extending the gospel; and that Christ will only come again at the close of this dispensation to judge the world at the \"last day.\" The millennium will thus precede his coming.";
eastonArray["$$T0002552"] = "<strong>Millet:</strong> (Heb. dohan; only in <a href=\"#\" onClick=\"return mV('Eze',4,9);\">Eze 4:9</a>), a small grain, the produce of the <i>Panicum miliaceum</i> of botanists. It is universally cultivated in the East as one of the smaller corn-grasses. This seed is the cenchros of the Greeks. It is called in India warree, and by the Arabs dukhan, and is extensively used for food, being often mixed with other grain. In this country it is only used for feeding birds.";
eastonArray["$$T0002553"] = "<strong>Millo:</strong> (Heb. always with the article, \"the\" Millo).<br><br>(1.) Probably the Canaanite name of some fortification, consisting of walls filled in with earth and stones, which protected Jerusalem on the north as its outermost defence. It is always rendered Akra i.e., \"the citadel\", in the LXX. It was already existing when David conquered Jerusalem (<a href=\"#\" onClick=\"return mV('2Sa',5,9);\">2Sa 5:9</a>). He extended it to the right and left, thus completing the defence of the city. It was rebuilt by Solomon (<a href=\"#\" onClick=\"return mV('1Ki',9,15,24);\">1Ki 9:15, 24</a>; <a href=\"#\" onClick=\"return mV('1Ki',11,27);\">11:27</a>) and repaired by Hezekiah (<a href=\"#\" onClick=\"return mV('2Ch',32,5);\">2Ch 32:5</a>).<br><br>(2.) In <a href=\"#\" onClick=\"return mV('Jdg',9,6,20);\">Jdg 9:6, 20</a> it is the name of a rampart in Shechem, probably the \"tower of Shechem\" (<a href=\"#\" onClick=\"return mV('Jdg',9,46,49);\">9:46, 49</a>).";
eastonArray["$$T0002554"] = "<strong>Mincing:</strong> (<a href=\"#\" onClick=\"return mV('Isa',3,16);\">Isa 3:16</a>), taking affectedly short and quick steps. Luther renders the word by \"wag\" or \"waggle,\" thus representing \"the affected gait of coquettish females.\"";
eastonArray["$$T0002555"] = "<strong>Mine:</strong> The process of mining is described in <a href=\"#\" onClick=\"return mV('Job',28,'1-11');\">Job 28:1-11</a>. Moses speaks of the mineral wealth of Palestine (<a href=\"#\" onClick=\"return mV('Deu',8,9);\">Deu 8:9</a>). <a href=\"#\" onClick=\"return mV('Job',28,4);\">Job 28:4</a> is rightly thus rendered in the Revised Version, \"He breaketh open a shaft away from where men sojourn; they are forgotten of the foot [that passeth by]; they hang afar from men, they swing to and fro.\" These words illustrate ancient mining operations.";
eastonArray["$$T0002556"] = "<strong>Minister:</strong> one who serves, as distinguished from the master.<br><br>(1.) Heb. meshereth, applied to an attendant on one of superior rank, as to Joshua, the servant of Moses (<a href=\"#\" onClick=\"return mV('Exd',33,11);\">Exd 33:11</a>), and to the servant of Elisha (<a href=\"#\" onClick=\"return mV('2Ki',4,43);\">2Ki 4:43</a>). This name is also given to attendants at court (<a href=\"#\" onClick=\"return mV('2Ch',22,8);\">2Ch 22:8</a>), and to the priests and Levites (<a href=\"#\" onClick=\"return mV('Jer',33,21);\">Jer 33:21</a>; <a href=\"#\" onClick=\"return mV('Eze',44,11);\">Eze 44:11</a>).<br><br>(2.) Heb. pelah (<a href=\"#\" onClick=\"return mV('Ezr',7,24);\">Ezr 7:24</a>), a \"minister\" of religion. Here used of that class of sanctuary servants called \"Solomon's servants\" in <a href=\"#\" onClick=\"return mV('Ezr',2,'55-58');\">Ezr 2:55-58</a> and <a href=\"#\" onClick=\"return mV('Neh',7,'57-60');\">Neh 7:57-60</a>.<br><br>(3.) Greek leitourgos, a subordinate public administrator, and in this sense applied to magistrates (<a href=\"#\" onClick=\"return mV('Rom',13,6);\">Rom 13:6</a>). It is applied also to our Lord (<a href=\"#\" onClick=\"return mV('Hbr',8,2);\">Hbr 8:2</a>), and to Paul in relation to Christ (<a href=\"#\" onClick=\"return mV('Rom',15,16);\">Rom 15:16</a>).<br><br>(4.) Greek hyperetes (literally, \"under-rower\"), a personal attendant on a superior, thus of the person who waited on the officiating priest in the synagogue (<a href=\"#\" onClick=\"return mV('Luk',4,20);\">Luk 4:20</a>). It is applied also to John Mark, the attendant on Paul and Barnabas (<a href=\"#\" onClick=\"return mV('Act',13,5);\">Act 13:5</a>).<br><br>(5.) Greek diaconos, usually a subordinate officer or assistant employed in relation to the ministry of the gospel, as to Paul and Apollos (<a href=\"#\" onClick=\"return mV('1Cr',3,5);\">1Cr 3:5</a>), Tychicus (<a href=\"#\" onClick=\"return mV('Eph',6,21);\">Eph 6:21</a>), Epaphras (<a href=\"#\" onClick=\"return mV('Col',1,7);\">Col 1:7</a>), Timothy (<a href=\"#\" onClick=\"return mV('1Th',3,2);\">1Th 3:2</a>), and also to Christ (<a href=\"#\" onClick=\"return mV('Rom',15,8);\">Rom 15:8</a>).";
eastonArray["$$T0002557"] = "<strong>Minni:</strong> only in <a href=\"#\" onClick=\"return mV('Jer',51,27);\">Jer 51:27</a>, as the name of a province in Armenia, which was at this time under the Median kings. Armenia is regarded by some as = Har-minni i.e., the mountainous country of Minni. (See  <a href=\"#\" onClick=\"return doDictLookup('ET0000313');\">ARMENIA</a>.)";
eastonArray["$$T0002558"] = "<strong>Minnith:</strong> distribution, an Ammonitish town (<a href=\"#\" onClick=\"return mV('Jdg',11,33);\">Jdg 11:33</a>) from which wheat was exported to Tyre (<a href=\"#\" onClick=\"return mV('Eze',27,17);\">Eze 27:17</a>). It was probably somewhere in the Mishor or table-land on the east of Jordan. There is a gentle valley running for about 4 miles east of Dhiban called Kurm Dhiban, \"the vineyards of Dibon.\" Tristram supposes that this may be the \"vineyards\" mentioned in Judges. (l.c.).";
eastonArray["$$T0002559"] = "<strong>Minstrel:</strong> (<a href=\"#\" onClick=\"return mV('Mat',9,23);\">Mat 9:23</a>), a flute-player. Such music was a usual accompaniment of funerals. In <a href=\"#\" onClick=\"return mV('2Ki',3,15);\">2Ki 3:15</a> it denotes a player on a stringed instrument.";
eastonArray["$$T0002560"] = "<strong>Mint:</strong> (Gr. heduosmon, i.e., \"having a sweet smell\"), one of the garden herbs of which the Pharisees paid tithes (<a href=\"#\" onClick=\"return mV('Mat',23,23);\">Mat 23:23</a>; <a href=\"#\" onClick=\"return mV('Luk',11,42);\">Luk 11:42</a>). It belongs to the labiate family of plants. The species most common in Syria is the <i>Mentha sylvestris</i>, the wild mint, which grows much larger than the garden mint (<i>M. sativa</i>). It was much used in domestic economy as a condiment, and also as a medicine. The paying of tithes of mint was in accordance with the Mosiac law (<a href=\"#\" onClick=\"return mV('Deu',14,22);\">Deu 14:22</a>), but the error of the Pharisees lay in their being more careful about this little matter of the mint than about weightier matters.";
eastonArray["$$T0002561"] = "<strong>Miracle:</strong> an event in the external world brought about by the immediate agency or the simple volition of God, operating without the use of means capable of being discerned by the senses, and designed to authenticate the divine commission of a religious teacher and the truth of his message (<a href=\"#\" onClick=\"return mV('Jhn',2,18);\">Jhn 2:18</a>; <a href=\"#\" onClick=\"return mV('Mat',12,38);\">Mat 12:38</a>). It is an occurrence at once above nature and above man. It shows the intervention of a power that is not limited by the laws either of matter or of mind, a power interrupting the fixed laws which govern their movements, a supernatural power.<br><br>\"The suspension or violation of the laws of nature involved in miracles is nothing more than is constantly taking place around us. One force counteracts another: vital force keeps the chemical laws of matter in abeyance; and muscular force can control the action of physical force. When a man raises a weight from the ground, the law of gravity is neither suspended nor violated, but counteracted by a stronger force. The same is true as to the walking of Christ on the water and the swimming of iron at the command of the prophet. The simple and grand truth that the universe is not under the exclusive control of physical forces, but that everywhere and always there is above, separate from and superior to all else, an infinite personal will, not superseding, but directing and controlling all physical causes, acting with or without them.\" God ordinarily effects his purpose through the agency of second causes; but he has the power also of effecting his purpose immediately and without the intervention of second causes, i.e., of invading the fixed order, and thus of working miracles. Thus we affirm the possibility of miracles, the possibility of a higher hand intervening to control or reverse nature's ordinary movements.<br><br>In the New Testament these four Greek words are principally used to designate miracles:<br><br>(1.) Semeion, a \"sign\", i.e., an evidence of a divine commission; an attestation of a divine message (<a href=\"#\" onClick=\"return mV('Mat',12,38,39);\">Mat 12:38-39</a>; <a href=\"#\" onClick=\"return mV('Mat',16,1,4);\">16:1, 4</a>; <a href=\"#\" onClick=\"return mV('Mar',8,11);\">Mar 8:11</a>; <a href=\"#\" onClick=\"return mV('Luk',11,16);\">Luk 11:16</a>; <a href=\"#\" onClick=\"return mV('Luk',23,8);\">23:8</a>; <a href=\"#\" onClick=\"return mV('Jhn',2,11,18,23);\">Jhn 2:11, 18, 23</a>; <a href=\"#\" onClick=\"return mV('Act',6,8);\">Act 6:8</a>, etc.); a token of the presence and working of God; the seal of a higher power.<br><br>(2.) Terata, \"wonders;\" wonder-causing events; portents; producing astonishment in the beholder (<a href=\"#\" onClick=\"return mV('Act',2,19);\">Act 2:19</a>).<br><br>(3.) Dunameis, \"might works;\" works of superhuman power (<a href=\"#\" onClick=\"return mV('Act',2,22);\">Act 2:22</a>; <a href=\"#\" onClick=\"return mV('Rom',15,19);\">Rom 15:19</a>; <a href=\"#\" onClick=\"return mV('2Th',2,9);\">2Th 2:9</a>); of a new and higher power.<br><br>(4.) Erga, \"works;\" the works of Him who is \"wonderful in working\" (<a href=\"#\" onClick=\"return mV('Jhn',5,20,36);\">Jhn 5:20, 36</a>).<br><br>Miracles are seals of a divine mission. The sacred writers appealed to them as proofs that they were messengers of God. Our Lord also appealed to miracles as a conclusive proof of his divine mission (<a href=\"#\" onClick=\"return mV('Jhn',5,20,36);\">Jhn 5:20, 36</a>; <a href=\"#\" onClick=\"return mV('Jhn',10,25,38);\">10:25, 38</a>). Thus, being out of the common course of nature and beyond the power of man, they are fitted to convey the impression of the presence and power of God. Where miracles are there certainly God is. The man, therefore, who works a miracle affords thereby clear proof that he comes with the authority of God; they are his credentials that he is God's messenger. The teacher points to these credentials, and they are a proof that he speaks with the authority of God. He boldly says, \"God bears me witness, both with signs and wonders, and with divers miracles.\"<br><br>The credibility of miracles is established by the evidence of the senses on the part of those who are witnesses of them, and to all others by the testimony of such witnesses. The witnesses were competent, and their testimony is trustworthy. Unbelievers, following Hume, deny that any testimony can prove a miracle, because they say miracles are impossible. We have shown that miracles are possible, and surely they can be borne witness to. Surely they are credible when we have abundant and trustworthy evidence of their occurrence. They are credible just as any facts of history well authenticated are credible. Miracles, it is said, are contrary to experience. Of course they are contrary to our experience, but that does not prove that they were contrary to the experience of those who witnessed them. We believe a thousand facts, both of history and of science, that are contrary to our experience, but we believe them on the ground of competent testimony. An atheist or a pantheist must, as a matter of course, deny the possibility of miracles; but to one who believes in a personal God, who in his wisdom may see fit to interfere with the ordinary processes of nature, miracles are not impossible, nor are they incredible. (See LIST OF MIRACLES, Appendix.)";
eastonArray["$$T0002562"] = "<strong>Miriam:</strong> their rebellion.<br><br>(1.) The sister of Moses and Aaron (<a href=\"#\" onClick=\"return mV('Exd',2,'4-10');\">Exd 2:4-10</a>; <a href=\"#\" onClick=\"return mV('1Ch',6,3);\">1Ch 6:3</a>). Her name is prominent in the history of the Exodus. She is called \"the prophetess\" (<a href=\"#\" onClick=\"return mV('Exd',15,20);\">Exd 15:20</a>). She took the lead in the song of triumph after the passage of the Red Sea. She died at Kadesh during the second encampment at that place, toward the close of the wanderings in the wilderness, and was buried there (<a href=\"#\" onClick=\"return mV('Num',20,1);\">Num 20:1</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000002');\">AARON</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0002602');\">MOSES</a>.)<br><br>(2.) <a href=\"#\" onClick=\"return mV('1Ch',4,17);\">1Ch 4:17</a>, one of the descendants of Judah.";
eastonArray["$$T0002563"] = "<strong>Misdeem:</strong> (<a href=\"#\" onClick=\"return mV('Deu',32,27);\">Deu 32:27</a>, R.V.). The Authorized Version reads, \"should behave themselves strangely;\" i.e., not recognize the truth, misunderstand or mistake the cause of Israel's ruin, which was due to the fact that God had forsaken them on account of their apostasy.";
eastonArray["$$T0002564"] = "<strong>Misgab:</strong> height, a town of Moab, or simply, the height=the citadel, some fortress so called; or perhaps a general name for the highlands of Moab, as some think (<a href=\"#\" onClick=\"return mV('Jer',48,1);\">Jer 48:1</a>). In <a href=\"#\" onClick=\"return mV('Isa',25,12);\">Isa 25:12</a>, the word is rendered \"high fort.\"";
eastonArray["$$T0002565"] = "<strong>Mishael:</strong> who is like God!<br><br>(1.) A Levite; the eldest of the three sons of Uzziel (<a href=\"#\" onClick=\"return mV('Exd',6,22);\">Exd 6:22</a>).<br><br>(2.) One of the three Hebrew youths who were trained with Daniel in Babylon (<a href=\"#\" onClick=\"return mV('Dan',1,11,19);\">Dan 1:11, 19</a>), and promoted to the rank of Magi. He and his companions were afterwards cast into the burning fiery furnace for refusing to worship the idol the king had set up, from which they were miraculously delivered (<a href=\"#\" onClick=\"return mV('Dan',3,'13-30');\">3:13-30</a>). His Chaldean name was Meshach (q.v.).";
eastonArray["$$T0002566"] = "<strong>Mishal:</strong> a city of the tribe of Asher (<a href=\"#\" onClick=\"return mV('Jos',21,30);\">Jos 21:30</a>; <a href=\"#\" onClick=\"return mV('1Ch',6,74);\">1Ch 6:74</a>). It is probably the modern Misalli, on the shore near Carmel.";
eastonArray["$$T0002567"] = "<strong>Misham:</strong> their cleansing or their beholding, a Benjamite, one of the sons of Elpaal (<a href=\"#\" onClick=\"return mV('1Ch',8,12);\">1Ch 8:12</a>).";
eastonArray["$$T0002568"] = "<strong>Misheal:</strong> (<a href=\"#\" onClick=\"return mV('Jos',19,26);\">Jos 19:26</a>), a town of Asher, probably the same as Mishal.";
eastonArray["$$T0002569"] = "<strong>Mishma:</strong> hearing.<br><br>(1.) One of the sons of Ishmael (<a href=\"#\" onClick=\"return mV('Gen',25,14);\">Gen 25:14</a>), and founder of an Arab tribe.<br><br>(2.) A Simeonite (<a href=\"#\" onClick=\"return mV('1Ch',4,25,26);\">1Ch 4:25-26</a>).";
eastonArray["$$T0002570"] = "<strong>Mishmannah:</strong> fatness, one of the Gadite heroes who gathered to David at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,10);\">1Ch 12:10</a>).";
eastonArray["$$T0002571"] = "<strong>Misrephoth-maim:</strong> burning of waters, supposed to be salt-pans, or lime-kilns, or glass-factories, a place to which Joshua pursued a party of Canaanites after the defeat of Jabin (<a href=\"#\" onClick=\"return mV('Jos',11,8);\">Jos 11:8</a>). It is identified with the ruin Musheirifeh, at the promontory of en-Nakhurah, some 11 miles north of Acre.";
eastonArray["$$T0002572"] = "<strong>Mite:</strong> contraction of minute, from the Latin minutum, the translation of the Greek word lepton, the very smallest bronze of copper coin (<a href=\"#\" onClick=\"return mV('Luk',12,59);\">Luk 12:59</a>; <a href=\"#\" onClick=\"return mV('Luk',21,2);\">21:2</a>). Two mites made one quadrans, i.e., the fourth part of a Roman as, which was in value nearly a halfpenny. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001311');\">FARTHING</a>.)";
eastonArray["$$T0002573"] = "<strong>Mithcah:</strong> sweetness, one of the stations of the Israelites in the wilderness (<a href=\"#\" onClick=\"return mV('Num',33,28,29);\">Num 33:28-29</a>).";
eastonArray["$$T0002574"] = "<strong>Mithredath:</strong> given by Mithra, or dedicated to Mithra, i.e., the sun, the Hebrew form of the Greek name Mithridates.<br><br>(1.) The \"treasurer\" of King Cyrus (<a href=\"#\" onClick=\"return mV('Ezr',1,8);\">Ezr 1:8</a>).<br><br>(2.) <a href=\"#\" onClick=\"return mV('Ezr',4,7);\">Ezr 4:7</a>, a Persian officer in Samaria.";
eastonArray["$$T0002575"] = "<strong>Mitre:</strong> (Heb. mitsnepheth), something rolled round the head; the turban or head-dress of the high priest (<a href=\"#\" onClick=\"return mV('Exd',28,4,37,39);\">Exd 28:4, 37, 39</a>; <a href=\"#\" onClick=\"return mV('Exd',29,6);\">29:6</a>, etc.). In the Authorized Version of <a href=\"#\" onClick=\"return mV('Eze',21,26);\">Eze 21:26</a>, this Hebrew word is rendered \"diadem,\" but in the Revised Version, \"mitre.\" It was a twisted band of fine linen, 8 yards in length, coiled into the form of a cap, and worn on official occasions (<a href=\"#\" onClick=\"return mV('Lev',8,9);\">Lev 8:9</a>; <a href=\"#\" onClick=\"return mV('Lev',16,4);\">16:4</a>; <a href=\"#\" onClick=\"return mV('Zec',3,5);\">Zec 3:5</a>). On the front of it was a golden plate with the inscription, \"Holiness to the Lord.\" The mitsnepheth differed from the mitre or head-dress (migba'ah) of the common priest. (See  <a href=\"#\" onClick=\"return doDictLookup('ET0000621');\">BONNET</a>.)";
eastonArray["$$T0002576"] = "<strong>Mitylene:</strong> the chief city of the island of Lesbos, on its east coast, in the AEgean Sea. Paul, during his third missionary journey, touched at this place on his way from Corinth to Judea (<a href=\"#\" onClick=\"return mV('Act',20,14);\">Act 20:14</a>), and here tarried for a night. It lies between Assos and Chios. It is now under the Turkish rule, and bears the name of Metelin.";
eastonArray["$$T0002577"] = "<strong>Mixed multitude:</strong> (<a href=\"#\" onClick=\"return mV('Exd',12,38);\">Exd 12:38</a>), a class who accompanied the Israelites as they journeyed from Rameses to Succoth, the first stage of the Exodus. These were probably miscellaneous hangers-on to the Hebrews, whether Egyptians of the lower orders, or the remains of the Hyksos (see <a href=\"#\" onClick=\"return doDictLookup('ET0001137');\">EGYPT</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0002602');\">MOSES</a>), as some think. The same thing happened on the return of the Jews from Babylon (<a href=\"#\" onClick=\"return mV('Neh',13,3);\">Neh 13:3</a>), a \"mixed multitude\" accompanied them so far.";
eastonArray["$$T0002578"] = "<strong>Mizar:</strong> smallness, a summit on the eastern ridge of Lebanon, near which David lay after escaping from Absalom (<a href=\"#\" onClick=\"return mV('Psa',42,6);\">Psa 42:6</a>). It may, perhaps, be the present Jebel Ajlun, thus named, \"the little\", in contrast with the greater elevation of Lebanon and Hermon.";
eastonArray["$$T0002579"] = "<strong>Mizpah:</strong> or Miz'peh, watch-tower; the look-out.<br><br>(1.) A place in Gilead, so named by Laban, who overtook Jacob at this spot (<a href=\"#\" onClick=\"return mV('Gen',31,49);\">Gen 31:49</a>) on his return to Palestine from Padan-aram. Here Jacob and Laban set up their memorial cairn of stones. It is the same as Ramath-mizpeh (<a href=\"#\" onClick=\"return mV('Jos',13,26);\">Jos 13:26</a>).<br><br>(2.) A town in Gilead, where Jephthah resided, and where he assumed the command of the Israelites in a time of national danger. Here he made his rash vow; and here his daughter submitted to her mysterious fate (<a href=\"#\" onClick=\"return mV('Jdg',10,17);\">Jdg 10:17</a>; <a href=\"#\" onClick=\"return mV('Jdg',11,11,34);\">11:11, 34</a>). It may be the same as Ramoth-Gilead (<a href=\"#\" onClick=\"return mV('Jos',20,8);\">Jos 20:8</a>), but it is more likely that it is identical with the foregoing, the Mizpeh of <a href=\"#\" onClick=\"return mV('Gen',31,23,25,48,49);\">Gen 31:23, 25, 48-49</a>.<br><br>(3.) Another place in Gilead, at the foot of Mount Hermon, inhabited by Hivites (<a href=\"#\" onClick=\"return mV('Jos',11,3,8);\">Jos 11:3, 8</a>). The name in Hebrew here has the article before it, \"the Mizpeh,\" \"the watch-tower.\" The modern village of Metullah, meaning also \"the look-out,\" probably occupies the site so called.<br><br>(4.) A town of Moab to which David removed his parents for safety during his persecution by Saul (<a href=\"#\" onClick=\"return mV('1Sa',22,3);\">1Sa 22:3</a>). This was probably the citadel known as Kir-Moab, now Kerak. While David resided here he was visited by the prophet Gad, here mentioned for the first time, who was probably sent by Samuel to bid him leave the land of Moab and betake himself to the land of Judah. He accordingly removed to the forest of Hareth (q.v.), on the edge of the mountain chain of Hebron.<br><br>(5.) A city of Benjamin, \"the watch-tower\", where the people were accustomed to meet in great national emergencies (<a href=\"#\" onClick=\"return mV('Jos',18,26);\">Jos 18:26</a>; <a href=\"#\" onClick=\"return mV('Jdg',20,1,3);\">Jdg 20:1, 3</a>; <a href=\"#\" onClick=\"return mV('Jdg',21,1,5);\">21:1, 5</a>; <a href=\"#\" onClick=\"return mV('1Sa',7,'5-16');\">1Sa 7:5-16</a>). It has been supposed to be the same as Nob (<a href=\"#\" onClick=\"return mV('1Sa',21,1);\">1Sa 21:1</a>; <a href=\"#\" onClick=\"return mV('1Sa',22,'9-19');\">22:9-19</a>). It was some 4 miles north-west of Jerusalem, and was situated on the loftiest hill in the neighbourhood, some 600 feet above the plain of Gibeon. This village has the modern name of Neby Samwil, i.e., the prophet Samuel, from a tradition that Samuel's tomb is here. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002742');\">NOB</a>.)<br><br>Samuel inaugurated the reformation that characterized his time by convening a great assembly of all Israel at Mizpeh, now the politico-religious centre of the nation. There, in deep humiliation on account of their sins, they renewed their vows and entered again into covenant with the God of their fathers. It was a period of great religious awakening and of revived national life. The Philistines heard of this assembly, and came up against Israel. The Hebrews charged the Philistine host with great fury, and they were totally routed. Samuel commemorated this signal victory by erecting a memorial-stone, which he called \"Ebenezer\" (q.v.), saying, \"Hitherto hath the Lord helped us\" (<a href=\"#\" onClick=\"return mV('1Sa',7,'7-12');\">1Sa 7:7-12</a>).";
eastonArray["$$T0002580"] = "<strong>Mizpar:</strong> number, one of the Jews who accompanied Zerubbabel from Babylon (<a href=\"#\" onClick=\"return mV('Ezr',2,2);\">Ezr 2:2</a>); called also Mispereth (<a href=\"#\" onClick=\"return mV('Neh',7,7);\">Neh 7:7</a>).";
eastonArray["$$T0002581"] = "<strong>Mizraim:</strong> the dual form of matzor, meaning a \"mound\" or \"fortress,\" the name of a people descended from Ham (<a href=\"#\" onClick=\"return mV('Gen',10,6,13);\">Gen 10:6, 13</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,8,11);\">1Ch 1:8, 11</a>). It was the name generally given by the Hebrews to the land of Egypt (q.v.), and may denote the two Egypts, the Upper and the Lower. The modern Arabic name for Egypt is Muzr.";
eastonArray["$$T0002582"] = "<strong>Mizzah:</strong> despair, one of the four sons of Reuel, the son of Esau (<a href=\"#\" onClick=\"return mV('Gen',36,13,17);\">Gen 36:13, 17</a>).";
eastonArray["$$T0002583"] = "<strong>Mnason:</strong> reminding, or remembrancer, a Christian of Jerusalem with whom Paul lodged (<a href=\"#\" onClick=\"return mV('Act',21,16);\">Act 21:16</a>). He was apparently a native of Cyprus, like Barnabas (<a href=\"#\" onClick=\"return mV('Act',11,19,20);\">11:19-20</a>), and was well known to the Christians of Caesarea (<a href=\"#\" onClick=\"return mV('Act',4,36);\">4:36</a>). He was an \"old disciple\" (R.V., \"early disciple\"), i.e., he had become a Christian in the beginning of the formation of the Church in Jerusalem.";
eastonArray["$$T0002584"] = "<strong>Moab:</strong> the seed of the father, or, according to others, the desirable land, the eldest son of Lot (<a href=\"#\" onClick=\"return mV('Gen',19,37);\">Gen 19:37</a>), of incestuous birth.<br><br>(2.) Used to denote the people of Moab (<a href=\"#\" onClick=\"return mV('Num',22,'3-14');\">Num 22:3-14</a>; <a href=\"#\" onClick=\"return mV('Jdg',3,30);\">Jdg 3:30</a>; <a href=\"#\" onClick=\"return mV('2Sa',8,2);\">2Sa 8:2</a>; <a href=\"#\" onClick=\"return mV('Jer',48,11,13);\">Jer 48:11, 13</a>).<br><br>(3.) The land of Moab (<a href=\"#\" onClick=\"return mV('Jer',48,24);\">Jer 48:24</a>), called also the \"country of Moab\" (<a href=\"#\" onClick=\"return mV('Rth',1,2,6);\">Rth 1:2, 6</a>; <a href=\"#\" onClick=\"return mV('Rth',2,6);\">2:6</a>), on the east of Jordan and the Dead Sea, and south of the Arnon (<a href=\"#\" onClick=\"return mV('Num',21,13,26);\">Num 21:13, 26</a>). In a wider sense it included the whole region that had been occupied by the Amorites. It bears the modern name of Kerak.<br><br>In the Plains of Moab, opposite Jericho (<a href=\"#\" onClick=\"return mV('Num',22,1);\">Num 22:1</a>; <a href=\"#\" onClick=\"return mV('Num',26,63);\">26:63</a>; <a href=\"#\" onClick=\"return mV('Jos',13,32);\">Jos 13:32</a>), the children of Israel had their last encampment before they entered the land of Canaan. It was at that time in the possession of the Amorites (<a href=\"#\" onClick=\"return mV('Num',21,22);\">Num 21:22</a>). \"Moses went up from the plains of Moab unto the mountain of Nebo, to the top of Pisgah,\" and \"died there in the land of Moab, according to the word of the Lord\" (<a href=\"#\" onClick=\"return mV('Deu',34,5,6);\">Deu 34:5-6</a>). \"Surely if we had nothing else to interest us in the land of Moab, the fact that it was from the top of Pisgah, its noblest height, this mightiest of the prophets looked out with eye undimmed upon the Promised Land; that it was here on Nebo, its loftiest mountain, that he died his solitary death; that it was here, in the valley over against Beth-peor, he found his mysterious sepulchre, we have enough to enshrine the memory in our hearts.\"";
eastonArray["$$T0002585"] = "<strong>Moabite:</strong> the designation of a tribe descended from Moab, the son of Lot (<a href=\"#\" onClick=\"return mV('Gen',19,37);\">Gen 19:37</a>). From Zoar, the cradle of this tribe, on the south-eastern border of the Dead Sea, they gradually spread over the region on the east of Jordan. Rameses II., the Pharaoh of the Oppression, enumerates Moab (Muab) among his conquests. Shortly before the Exodus, the warlike Amorites crossed the Jordan under Sihon their king and drove the Moabites (<a href=\"#\" onClick=\"return mV('Num',21,'26-30');\">Num 21:26-30</a>) out of the region between the Arnon and the Jabbok, and occupied it, making Heshbon their capital. They were then confined to the territory to the south of the Arnon.<br><br>On their journey the Israelites did not pass through Moab, but through the \"wilderness\" to the east (<a href=\"#\" onClick=\"return mV('Deu',2,8);\">Deu 2:8</a>; <a href=\"#\" onClick=\"return mV('Jdg',11,18);\">Jdg 11:18</a>), at length reaching the country to the north of the Arnon. Here they remained for some time till they had conquered Bashan (see <a href=\"#\" onClick=\"return doDictLookup('ET0003427');\">SIHON</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0002771');\">OG</a>). The Moabites were alarmed, and their king, Balak, sought aid from the Midianites (<a href=\"#\" onClick=\"return mV('Num',22,'2-4');\">Num 22:2-4</a>). It was while they were here that the visit of Balaam (q.v.) to Balak took place. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002602');\">MOSES</a>.)<br><br>After the Conquest, the Moabites maintained hostile relations with the Israelites, and frequently harassed them in war (<a href=\"#\" onClick=\"return mV('Jdg',3,'12-30');\">Jdg 3:12-30</a>; <a href=\"#\" onClick=\"return mV('1Sa',14,'1-')\">1Sa 14</a>). The story of Ruth, however, shows the existence of friendly relations between Moab and Bethlehem. By his descent from Ruth, David may be said to have had Moabite blood in his veins. Yet there was war between David and the Moabites (<a href=\"#\" onClick=\"return mV('2Sa',8,2);\">2Sa 8:2</a>; <a href=\"#\" onClick=\"return mV('2Sa',23,20);\">23:20</a>; <a href=\"#\" onClick=\"return mV('1Ch',18,2);\">1Ch 18:2</a>), from whom he took great spoil (<a href=\"#\" onClick=\"return mV('2Sa',8,2,11,12);\">2Sa 8:2, 11-12</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,22);\">1Ch 11:22</a>; <a href=\"#\" onClick=\"return mV('1Ch',18,11);\">18:11</a>).<br><br>During the one hundred and fifty years which followed the defeat of the Moabites, after the death of Ahab (see <a href=\"#\" onClick=\"return doDictLookup('ET0002505');\">MESHA</a>), they regained, apparently, much of their former prosperty. At this time Isaiah (<a href=\"#\" onClick=\"return mV('Isa',15,1);\">Isa 15:1</a>) delivered his \"burden of Moab,\" predicting the coming of judgment on that land (<a href=\"#\" onClick=\"return mV('2Ki',17,3);\">2Ki 17:3</a>; <a href=\"#\" onClick=\"return mV('2Ki',18,9);\">18:9</a>; <a href=\"#\" onClick=\"return mV('1Ch',5,25,26);\">1Ch 5:25-26</a>). Between the time of Isaiah and the commencement of the Babylonian captivity we have very seldom any reference to Moab (<a href=\"#\" onClick=\"return mV('Jer',25,21);\">Jer 25:21</a>; <a href=\"#\" onClick=\"return mV('Jer',27,3);\">27:3</a>; <a href=\"#\" onClick=\"return mV('Jer',40,11);\">40:11</a>; <a href=\"#\" onClick=\"return mV('Zep',2,'8-10');\">Zep 2:8-10</a>).<br><br>After the Return, it was Sanballat, a Moabite, who took chief part in seeking to prevent the rebuilding of Jerusalem (<a href=\"#\" onClick=\"return mV('Neh',2,19);\">Neh 2:19</a>; <a href=\"#\" onClick=\"return mV('Neh',4,1);\">4:1</a>; <a href=\"#\" onClick=\"return mV('Neh',6,1);\">6:1</a>).";
eastonArray["$$T0002586"] = "<strong>Moabite Stone:</strong> a basalt stone, bearing an inscription by King Mesha, which was discovered at Dibon by Klein, a German missionary at Jerusalem, in 1868. It was 3 1/2 feet high and 2 in breadth and in thickness, rounded at the top. It consisted of thirty-four lines, written in Hebrew-Phoenician characters. It was set up by Mesha as a record and memorial of his victories. It records <br><br>(1) Mesha's wars with Omri,<br><br>(2) his public buildings, and<br><br>(3) his wars against Horonaim.<br><br>This inscription in a remarkable degree supplements and corroborates the history of King Mesha recorded in <a href=\"#\" onClick=\"return mV('2Ki',3,'4-27');\">2Ki 3:4-27</a>.<br><br>With the exception of a very few variations, the Moabite language in which the inscription is written is identical with the Hebrew. The form of the letters here used supplies very important and interesting information regarding the history of the formation of the alphabet, as well as, incidentally, regarding the arts of civilized life of those times in the land of Moab.<br><br>This ancient monument, recording the heroic struggles of King Mesha with Omri and Ahab, was erected about B.C. 900. Here \"we have the identical slab on which the workmen of the old world carved the history of their own times, and from which the eye of their contemporaries read thousands of years ago the record of events of which they themselves had been the witnesses.\" It is the oldest inscription written in alphabetic characters, and hence is, apart from its value in the domain of Hebrew antiquities, of great linguistic importance.";
eastonArray["$$T0002587"] = "<strong>Moladah:</strong> birth, a city in the south of Judah which fell to Simeon (<a href=\"#\" onClick=\"return mV('Jos',15,'21-26');\">Jos 15:21-26</a>; <a href=\"#\" onClick=\"return mV('Jos',19,2);\">19:2</a>). It has been identified with the modern el-Milh, 10 miles east of Beersheba.";
eastonArray["$$T0002588"] = "<strong>Mole:</strong> Heb. tinshameth (<a href=\"#\" onClick=\"return mV('Lev',11,30);\">Lev 11:30</a>), probably signifies some species of lizard (rendered in R.V., \"chameleon\"). In <a href=\"#\" onClick=\"return mV('Lev',11,18);\">Lev 11:18</a>; <a href=\"#\" onClick=\"return mV('Deu',14,16);\">Deu 14:16</a>, it is rendered, in Authorized Version, \"swan\" (R.V., \"horned owl\").<br><br>The Heb. holed (<a href=\"#\" onClick=\"return mV('Lev',11,29);\">Lev 11:29</a>), rendered \"weasel,\" was probably the mole-rat. The true mole (<i>Talpa Europoea</i>) is not found in Palestine. The mole-rat (<i>Spalax typhlus</i>) \"is twice the size of our mole, with no external eyes, and with only faint traces within of the rudimentary organ; no apparent ears, but, like the mole, with great internal organs of hearing; a strong, bare snout, and with large gnawing teeth; its colour a pale slate; its feet short, and provided with strong nails; its tail only rudimentary.\"<br><br>In <a href=\"#\" onClick=\"return mV('Isa',2,20);\">Isa 2:20</a>, this word is the rendering of two words <i>haphar peroth</i>, which are rendered by Gesenius \"into the digging of rats\", i.e., rats' holes. But these two Hebrew words ought probably to be combined into one (lahporperoth) and translated \"to the moles\", i.e., the rat-moles. This animal \"lives in underground communities, making large subterranean chambers for its young and for storehouses, with many runs connected with them, and is decidedly partial to the loose debris among ruins and stone-heaps, where it can form its chambers with least trouble.\"";
eastonArray["$$T0002589"] = "<strong>Moloch:</strong> king, the name of the national god of the Ammonites, to whom children were sacrificed by fire. He was the consuming and destroying and also at the same time the purifying fire. In <a href=\"#\" onClick=\"return mV('Amo',5,26);\">Amos 5:26</a>, \"your Moloch\" of the Authorized Version is \"your king\" in the Revised Version (<a href=\"#\" onClick=\"return mV('Act',7,43);\">Act 7:43</a>). Solomon (<a href=\"#\" onClick=\"return mV('1Ki',11,7);\">1Ki 11:7</a>) erected a high place for this idol on the Mount of Olives, and from that time till the days of Josiah his worship continued (<a href=\"#\" onClick=\"return mV('2Ki',23,10,13);\">2Ki 23:10, 13</a>). In the days of Jehoahaz it was partially restored, but after the Captivity wholly disappeared. He is also called Molech (<a href=\"#\" onClick=\"return mV('Lev',18,21);\">Lev 18:21</a>; <a href=\"#\" onClick=\"return mV('Lev',20,'2-5');\">20:2-5</a>, etc.), Milcom (<a href=\"#\" onClick=\"return mV('1Ki',11,5,33);\">1Ki 11:5, 33</a>, etc.), and Malcham (<a href=\"#\" onClick=\"return mV('Zep',1,5);\">Zep 1:5</a>). This god became Chemosh among the Moabites.";
eastonArray["$$T0002590"] = "<strong>Money:</strong> Of uncoined money the first notice we have is in the history of Abraham (<a href=\"#\" onClick=\"return mV('Gen',13,2);\">Gen 13:2</a>; <a href=\"#\" onClick=\"return mV('Gen',20,16);\">20:16</a>; <a href=\"#\" onClick=\"return mV('Gen',24,35);\">24:35</a>). Next, this word is used in connection with the purchase of the cave of Machpelah (<a href=\"#\" onClick=\"return mV('Gen',23,16);\">23:16</a>), and again in connection with Jacob's purchase of a field at Shalem (<a href=\"#\" onClick=\"return mV('Gen',33,18,19);\">Gen 33:18-19</a>) for \"an hundred pieces of money\"=an hundred Hebrew kesitahs (q.v.), i.e., probably pieces of money, as is supposed, bearing the figure of a lamb.<br><br>The history of Joseph affords evidence of the constant use of money, silver of a fixed weight. This appears also in all the subsequent history of the Jewish people, in all their internal as well as foreign transactions. There were in common use in trade silver pieces of a definite weight, shekels, half-shekels, and quarter-shekels. But these were not properly coins, which are pieces of metal authoritatively issued, and bearing a stamp.<br><br>Of the use of coined money we have no early notice among the Hebrews. The first mentioned is of Persian coinage, the daric (<a href=\"#\" onClick=\"return mV('Ezr',2,69);\">Ezr 2:69</a>; <a href=\"#\" onClick=\"return mV('Neh',7,70);\">Neh 7:70</a>) and the 'adarkon (<a href=\"#\" onClick=\"return mV('Ezr',8,27);\">Ezr 8:27</a>). The daric (q.v.) was a gold piece current in Palestine in the time of Cyrus. As long as the Jews, after the Exile, lived under Persian rule, they used Persian coins. These gave place to Greek coins when Palestine came under the dominion of the Greeks (B.C. 331), the coins consisting of gold, silver, and copper pieces. The usual gold pieces were staters (q.v.), and the silver coins tetradrachms and drachms.<br><br>In the year B.C. 140, Antiochus VII. gave permission to Simon the Maccabee to coin Jewish money. Shekels (q.v.) were then coined bearing the figure of the almond rod and the pot of manna.";
eastonArray["$$T0002591"] = "<strong>Money-changer:</strong> (<a href=\"#\" onClick=\"return mV('Mat',21,12);\">Mat 21:12</a>; <a href=\"#\" onClick=\"return mV('Mar',11,15);\">Mar 11:15</a>; <a href=\"#\" onClick=\"return mV('Jhn',2,15);\">Jhn 2:15</a>). Every Israelite from twenty years and upwards had to pay (<a href=\"#\" onClick=\"return mV('Exd',30,'13-15');\">Exd 30:13-15</a>) into the sacred treasury half a shekel every year as an offering to Jehovah, and that in the exact Hebrew half-shekel piece. There was a class of men, who frequented the temple courts, who exchanged at a certain premium foreign moneys for these half-shekels to the Jews who came up to Jerusalem from all parts of the world. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002864');\">PASSOVER</a>.) When our Lord drove the traffickers out of the temple, these money-changers fared worst. Their tables were overturned and they themselves were expelled.";
eastonArray["$$T0002592"] = "<strong>Month:</strong> Among the Egyptians the month of thirty days each was in use long before the time of the Exodus, and formed the basis of their calculations. From the time of the institution of the Mosaic law the month among the Jews was lunar. The cycle of religious feasts depended on the moon. The commencement of a month was determined by the observation of the new moon. The number of months in the year was usually twelve (<a href=\"#\" onClick=\"return mV('1Ki',4,7);\">1Ki 4:7</a>; <a href=\"#\" onClick=\"return mV('1Ch',27,'1-15');\">1Ch 27:1-15</a>); but every third year an additional month (ve-Adar) was inserted, so as to make the months coincide with the seasons.<br><br>\"The Hebrews and Phoenicians had no word for month save 'moon,' and only saved their calendar from becoming vague like that of the Moslems by the interpolation of an additional month. There is no evidence at all that they ever used a true solar year such as the Egyptians possessed. The latter had twelve months of thirty days and five epagomenac or odd days.\", Palestine Quarterly, January 1889.";
eastonArray["$$T0002593"] = "<strong>Moon:</strong> heb. yareah, from its paleness (<a href=\"#\" onClick=\"return mV('Ezr',6,15);\">Ezr 6:15</a>), and lebanah, the \"white\" (<a href=\"#\" onClick=\"return mV('Sgs',6,10);\">Sgs 6:10</a>; <a href=\"#\" onClick=\"return mV('Isa',24,23);\">Isa 24:23</a>), was appointed by the Creator to be with the sun \"for signs, and for seasons, and for days, and years\" (<a href=\"#\" onClick=\"return mV('Gen',1,'14-16');\">Gen 1:14-16</a>). A lunation was among the Jews the period of a month, and several of their festivals were held on the day of the new moon. It is frequently referred to along with the sun (<a href=\"#\" onClick=\"return mV('Jos',10,12);\">Jos 10:12</a>; <a href=\"#\" onClick=\"return mV('Psa',72,5,7,17);\">Psa 72:5, 7, 17</a>; <a href=\"#\" onClick=\"return mV('Psa',89,36,37);\">89:36-37</a>; <a href=\"#\" onClick=\"return mV('Ecc',12,2);\">Ecc 12:2</a>; <a href=\"#\" onClick=\"return mV('Isa',24,23);\">Isa 24:23</a>, etc.), and also by itself (<a href=\"#\" onClick=\"return mV('Psa',8,3);\">Psa 8:3</a>; <a href=\"#\" onClick=\"return mV('Psa',121,6);\">121:6</a>).<br><br>The great brilliance of the moon in Eastern countries led to its being early an object of idolatrous worship (<a href=\"#\" onClick=\"return mV('Deu',4,19);\">Deu 4:19</a>; <a href=\"#\" onClick=\"return mV('Deu',17,3);\">17:3</a>; <a href=\"#\" onClick=\"return mV('Job',31,26);\">Job 31:26</a>), a form of idolatry against which the Jews were warned (<a href=\"#\" onClick=\"return mV('Deu',4,19);\">Deu 4:19</a>; <a href=\"#\" onClick=\"return mV('Deu',17,3);\">17:3</a>). They, however, fell into this idolatry, and offered incense (<a href=\"#\" onClick=\"return mV('2Ki',23,5);\">2Ki 23:5</a>; <a href=\"#\" onClick=\"return mV('Jer',8,2);\">Jer 8:2</a>), and also cakes of honey, to the moon (<a href=\"#\" onClick=\"return mV('Jer',7,18);\">Jer 7:18</a>; <a href=\"#\" onClick=\"return mV('Jer',44,'17-19',25);\">44:17-19, 25</a>).";
eastonArray["$$T0002594"] = "<strong>Mordecai:</strong> the son of Jair, of the tribe of Benjamin. It has been alleged that he was carried into captivity with Jeconiah, and hence that he must have been at least one hundred and twenty-nine years old in the twelfth year of Ahasuerus (Xerxes). But the words of Esther do not necessarily lead to this conclusion. It was probably Kish of whom it is said (<a href=\"#\" onClick=\"return mV('Est',2,6);\">Est 2:6</a>) that he \"had been carried away with the captivity.\"<br><br>He resided at Susa, the metropolis of Persia. He adopted his cousin Hadassah (Esther), an orphan child, whom he tenderly brought up as his own daughter. When she was brought into the king's harem and made queen in the room of the deposed queen Vashti, he was promoted to some office in the court of Ahasuerus, and was one of those who \"sat in the king's gate\" (<a href=\"#\" onClick=\"return mV('Est',2,21);\">Est 2:21</a>). While holding this office, he discovered a plot of the eunuchs to put the king to death, which, by his vigilance, was defeated. His services to the king in this matter were duly recorded in the royal chronicles.<br><br>Haman (q.v.) the Agagite had been raised to the highest position at court. Mordecai refused to bow down before him; and Haman, being stung to the quick by the conduct of Mordecai, resolved to accomplish his death in a wholesale destruction of the Jewish exiles throughout the Persian empire (<a href=\"#\" onClick=\"return mV('Est',3,'8-15');\">Est 3:8-15</a>). Tidings of this cruel scheme soon reached the ears of Mordecai, who communicated with Queen Esther regarding it, and by her wise and bold intervention the scheme was frustrated. The Jews were delivered from destruction, Mordecai was raised to a high rank, and Haman was executed on the gallows he had by anticipation erected for Mordecai (<a href=\"#\" onClick=\"return mV('Est',6,'2-');\">6:2</a>-<a href=\"#\" onClick=\"return mV('Est',7,'1-10');\">7:10</a>). In memory of the signal deliverance thus wrought for them, the Jews to this day celebrate the feast (<a href=\"#\" onClick=\"return mV('Est',9,'26-32');\">9:26-32</a>) of Purim (q.v.).";
eastonArray["$$T0002595"] = "<strong>Moreh:</strong> an archer, teacher; fruitful.<br><br>(1.) A Canaanite probably who inhabited the district south of Shechem, between Mounts Ebal and Gerizim, and gave his name to the \"plain\" there (<a href=\"#\" onClick=\"return mV('Gen',12,6);\">Gen 12:6</a>). Here at this \"plain,\" or rather (R.V.) \"oak,\" of Moreh, Abraham built his first altar in the land of Palestine; and here the Lord appeared unto him. He afterwards left this plain and moved southward, and pitched his tent between Bethel on the west and Hai on the east (<a href=\"#\" onClick=\"return mV('Gen',12,7,8);\">Gen 12:7-8</a>).";
eastonArray["$$T0002596"] = "<strong>Moreh, the Hill of:</strong> probably identical with \"little Hermon,\" the modern Jebel ed-Duhy, or perhaps one of the lower spurs of this mountain. It is a gray ridge parallel to Gilboa on the north; and between the two lay the battle-field, the plain of Jezreel (q.v.), where Gideon overthrew the Midianites (<a href=\"#\" onClick=\"return mV('Jdg',7,'1-12');\">Jdg 7:1-12</a>).";
eastonArray["$$T0002597"] = "<strong>Moresheth-gath:</strong> possession of the wine-press, the birthplace of the prophet Micah (<a href=\"#\" onClick=\"return mV('Mic',1,14);\">Mic 1:14</a>), who is called the \"Morasthite\" (<a href=\"#\" onClick=\"return mV('Jer',26,18);\">Jer 26:18</a>). This place was probably a suburb of Gath.";
eastonArray["$$T0002598"] = "<strong>Moriah:</strong> the chosen of Jehovah. Some contend that Mount Gerizim is meant, but most probably we are to regard this as one of the hills of Jerusalem. Here Solomon's temple was built, on the spot that had been the threshing-floor of Ornan the Jebusite (<a href=\"#\" onClick=\"return mV('2Sa',24,24,25);\">2Sa 24:24-25</a>; <a href=\"#\" onClick=\"return mV('2Ch',3,1);\">2Ch 3:1</a>). It is usually included in Zion, to the north-east of which it lay, and from which it was separated by the Tyropoean valley. This was \"the land of Moriah\" to which Abraham went to offer up his son Isaac (<a href=\"#\" onClick=\"return mV('Gen',22,2);\">Gen 22:2</a>). It has been supposed that the highest point of the temple hill, which is now covered by the Mohammedan Kubbetes-Sakhrah, or \"Dome of the Rock,\" is the actual site of Araunah's threshing-floor. Here also, one thousand years after Abraham, David built an altar and offered sacrifices to God. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002043');\">JERUSALEM</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0002753');\">NUMBERING THE PEOPLE</a>.)";
eastonArray["$$T0002599"] = "<strong>Mortar:</strong> (Heb. homer), cement of lime and sand (<a href=\"#\" onClick=\"return mV('Gen',11,3);\">Gen 11:3</a>; <a href=\"#\" onClick=\"return mV('Exd',1,14);\">Exd 1:14</a>); also potter's clay (<a href=\"#\" onClick=\"return mV('Isa',41,25);\">Isa 41:25</a>; <a href=\"#\" onClick=\"return mV('Nah',3,14);\">Nah 3:14</a>). Also Heb. 'aphar, usually rendered \"dust,\" clay or mud used for cement in building (<a href=\"#\" onClick=\"return mV('Lev',14,42,45);\">Lev 14:42, 45</a>).<br><br>Mortar for pulverizing (<a href=\"#\" onClick=\"return mV('Pro',27,22);\">Pro 27:22</a>) grain or other substances by means of a pestle instead of a mill. Mortars were used in the wilderness for pounding the manna (<a href=\"#\" onClick=\"return mV('Num',11,8);\">Num 11:8</a>). It is commonly used in Palestine at the present day to pound wheat, from which the Arabs make a favourite dish called kibby.";
