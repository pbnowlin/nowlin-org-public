<script src="./js/NoNavHeader.js"  type="text/javascript"></script>
<script>
var eastonArray = new Array ();
eastonArray["$$T0003900"] = "<strong>Zemaraim:</strong><br><br>(1.) A town of Benjamin (<a href=\"#\" onClick=\"return mV('Jos',18,22);\">Jos 18:22</a>); now the ruin, rather two ruins, es-Sumrah, 4 miles north of Jericho.<br><br>(2.) A mount in the highlands of Ephraim, to the north of Jerusalem (<a href=\"#\" onClick=\"return mV('2Ch',13,'4-20');\">2Ch 13:4-20</a>). Here the armies of Abijah and Jeroboam engaged in a bloody battle, which issued in the total defeat of the king of Israel, who never \"recovered strength again,\" and soon after died.";
eastonArray["$$T0003901"] = "<strong>Zemarite:</strong> the designation of one of the Phoenician tribes (<a href=\"#\" onClick=\"return mV('Gen',10,18);\">Gen 10:18</a>) who inhabited the town of Sumra, at the western base of the Lebanon range. In the Amarna tablets (B.C. 1400) Zemar, or Zumur, was one of the most important of the Phoenician cities, but it afterwards almost disappears from history.";
eastonArray["$$T0003902"] = "<strong>Zemira:</strong> vine-dresser, a Benjamite; one of the sons of Becher (<a href=\"#\" onClick=\"return mV('1Ch',7,8);\">1Ch 7:8</a>).";
eastonArray["$$T0003903"] = "<strong>Zenas:</strong> a disciple called \"the lawyer,\" whom Paul wished Titus to bring with him (<a href=\"#\" onClick=\"return mV('Tts',3,13);\">Tts 3:13</a>). Nothing more is known of him.";
eastonArray["$$T0003904"] = "<strong>Zephaniah:</strong> Jehovah has concealed, or Jehovah of darkness.<br><br>(1.) The son of Cushi, and great-grandson of Hezekiah, and the ninth in the order of the minor prophets. He prophesied in the days of Josiah, king of Judah (B.C. 641-610), and was contemporary with Jeremiah, with whom he had much in common. The book of his prophecies consists of:<br><br>(a) An introduction (<a href=\"#\" onClick=\"return mV('Zep',1,'1-6');\">Zep 1:1-6</a>), announcing the judgment of the world, and the judgment upon Israel, because of their transgressions.<br><br>(b) The description of the judgment (<a href=\"#\" onClick=\"return mV('Zep',1,'7-18');\">Zep 1:7-18</a>).<br><br>(c) An exhortation to seek God while there is still time (<a href=\"#\" onClick=\"return mV('Zep',2,'1-3');\">Zep 2:1-3</a>).<br><br>(d) The announcement of judgment on the heathen (<a href=\"#\" onClick=\"return mV('Zep',2,'4-15');\">Zep 2:4-15</a>).<br><br>(e) The hopeless misery of Jerusalem (<a href=\"#\" onClick=\"return mV('Zep',3,'1-7');\">Zep 3:1-7</a>).<br><br>(f) The promise of salvation (<a href=\"#\" onClick=\"return mV('Zep',3,'8-20');\">Zep 3:8-20</a>).<br><br>(2.) The son of Maaseiah, the \"second priest\" in the reign of Zedekiah, often mentioned in Jeremiah as having been sent from the king to inquire (<a href=\"#\" onClick=\"return mV('Jer',21,1);\">Jer 21:1</a>) regarding the coming woes which he had denounced, and to entreat the prophet's intercession that the judgment threatened might be averted (<a href=\"#\" onClick=\"return mV('Jer',29,25,29);\">Jer 29:25-26, 29</a>; <a href=\"#\" onClick=\"return mV('Jer',37,3);\">37:3</a>; <a href=\"#\" onClick=\"return mV('Jer',52,24);\">52:24</a>). He, along with some other captive Jews, was put to death by the king of Babylon \"at Riblah in the land of Hamath\" (<a href=\"#\" onClick=\"return mV('2Ki',25,21);\">2Ki 25:21</a>).<br><br>(3.) A Kohathite ancestor of the prophet Samuel (<a href=\"#\" onClick=\"return mV('1Ch',6,36);\">1Ch 6:36</a>).<br><br>(4.) The father of Josiah, the priest who dwelt in Jerusalem when Darius issued the decree that the temple should be rebuilt (<a href=\"#\" onClick=\"return mV('Zec',6,10);\">Zec 6:10</a>).";
eastonArray["$$T0003905"] = "<strong>Zephath:</strong> beacon; watch-tower, a Canaanite town; called also Hormah (q.v.), <a href=\"#\" onClick=\"return mV('Jdg',1,17);\">Jdg 1:17</a>. It has been identified with the pass of es-Sufah, but with greater probability with S'beita.";
eastonArray["$$T0003906"] = "<strong>Zephathah:</strong> a valley in the west of Judah, near Mareshah; the scene of Asa's conflict with Zerah the Ethiopian (<a href=\"#\" onClick=\"return mV('2Ch',14,'9-13');\">2Ch 14:9-13</a>). Identified with the Wady Safieh.";
eastonArray["$$T0003907"] = "<strong>Zerah:</strong> sunrise.<br><br>(1.) An \"Ethiopian,\" probably Osorkon II., the successor of Shishak on the throne of Egypt. With an enormous army, the largest we read of in Scripture, he invaded the kingdom of Judah in the days of Asa (<a href=\"#\" onClick=\"return mV('2Ch',14,'9-15');\">2Ch 14:9-15</a>). He reached Zephathah, and there encountered the army of Asa. This is the only instance \"in all the annals of Judah of a victorious encounter in the field with a first-class heathen power in full force.\" The Egyptian host was utterly routed, and the Hebrews gathered \"exceeding much spoil.\" Three hundred years elapsed before another Egyptian army, that of Necho (B.C. 609), came up against Jerusalem.<br><br>(2.) A son of Tamar (<a href=\"#\" onClick=\"return mV('Gen',38,30);\">Gen 38:30</a>); called also Zara (<a href=\"#\" onClick=\"return mV('Mat',1,3);\">Mat 1:3</a>).<br><br>(3.) A Gershonite Levite (<a href=\"#\" onClick=\"return mV('1Ch',6,21,41);\">1Ch 6:21, 41</a>).";
eastonArray["$$T0003908"] = "<strong>Zered:</strong> =Zared, luxuriance; willow bush, a brook or valley communicating with the Dead Sea near its southern extremity (<a href=\"#\" onClick=\"return mV('Num',21,12);\">Num 21:12</a>; <a href=\"#\" onClick=\"return mV('Deu',2,14);\">Deu 2:14</a>). It is called the \"brook of the willows\" (<a href=\"#\" onClick=\"return mV('Isa',15,7);\">Isa 15:7</a>) and the \"river of the wilderness\" (<a href=\"#\" onClick=\"return mV('Amo',6,14);\">Amo 6:14</a>). It has been identified with the Wady el-Aksy.";
eastonArray["$$T0003909"] = "<strong>Zereda:</strong> the fortress, a city on the north of Mount Ephraim; the birthplace of Jeroboam (<a href=\"#\" onClick=\"return mV('1Ki',11,26);\">1Ki 11:26</a>). It is probably the same as Zaretan (<a href=\"#\" onClick=\"return mV('Jos',3,16);\">Jos 3:16</a>), Zererath (<a href=\"#\" onClick=\"return mV('Jdg',7,22);\">Jdg 7:22</a>), Zartanah (<a href=\"#\" onClick=\"return mV('1Ki',4,12);\">1Ki 4:12</a>), or the following.";
eastonArray["$$T0003910"] = "<strong>Zeredathah:</strong> a place in the plain of Jordan; the same as Zarthan (<a href=\"#\" onClick=\"return mV('2Ch',4,17);\">2Ch 4:17</a>; <a href=\"#\" onClick=\"return mV('1Ki',7,46);\">1Ki 7:46</a>). Here Solomon erected the foundries in which Hiram made the great castings of bronze for the temple.";
eastonArray["$$T0003911"] = "<strong>Zererath:</strong> (<a href=\"#\" onClick=\"return mV('Jdg',7,22);\">Jdg 7:22</a>), perhaps identical with Zereda or Zeredathah. Some identify it with Zahrah, a place about 3 miles west of Beth-shean.";
eastonArray["$$T0003912"] = "<strong>Zeresh:</strong> star of Venus, the wife of Haman, whom she instigated to prepare a gallows for Mordecai (<a href=\"#\" onClick=\"return mV('Est',5,10);\">Est 5:10</a>).";
eastonArray["$$T0003913"] = "<strong>Zeruah:</strong> stricken, mother of Jeroboam, the first king of the ten tribes (<a href=\"#\" onClick=\"return mV('1Ki',11,26);\">1Ki 11:26</a>).";
eastonArray["$$T0003914"] = "<strong>Zerubbabel:</strong> the seed of Babylon, the son of Salathiel or Shealtiel (<a href=\"#\" onClick=\"return mV('Hag',1,1);\">Hag 1:1</a>; <a href=\"#\" onClick=\"return mV('Mat',1,12);\">Mat 1:12</a>); called also the son of Pedaiah (<a href=\"#\" onClick=\"return mV('1Ch',3,'17-19');\">1Ch 3:17-19</a>), i.e., according to a frequent usage of the word \"son;\" the grandson or the nephew of Salathiel. He is also known by the Persian name of Sheshbazzar (<a href=\"#\" onClick=\"return mV('Ezr',1,8,11);\">Ezr 1:8, 11</a>). In the first year of Cyrus, king of Persia, he led the first band of Jews, numbering 42,360 (<a href=\"#\" onClick=\"return mV('Ezr',2,64);\">Ezr 2:64</a>), exclusive of a large number of servants, who returned from captivity at the close of the seventy years. In the second year after the Return, he erected an altar and laid the foundation of the temple on the ruins of that which had been destroyed by Nebuchadnezzar (<a href=\"#\" onClick=\"return mV('Ezr',3,'8-13');\">3:8-13</a>; ch. <a href=\"#\" onClick=\"return mV('Ezr',4,'1-');\">4-6</a>). All through the work he occupied a prominent place, inasmuch as he was a descendant of the royal line of David.";
eastonArray["$$T0003915"] = "<strong>Zeruiah:</strong> stricken of the Lord, David's sister, and the mother of Abishai, Joab, and Asahel (<a href=\"#\" onClick=\"return mV('1Ch',2,16);\">1Ch 2:16</a>), who were the three leading heroes of David's army, and being his nephews, they were admitted to the closest companionship with him.";
eastonArray["$$T0003916"] = "<strong>Zetham:</strong> olive planter, a Levite (<a href=\"#\" onClick=\"return mV('1Ch',23,8);\">1Ch 23:8</a>).";
eastonArray["$$T0003917"] = "<strong>Zethan:</strong> a Benjamite (<a href=\"#\" onClick=\"return mV('1Ch',7,10);\">1Ch 7:10</a>).";
eastonArray["$$T0003918"] = "<strong>Zia:</strong> fear, a Gadite (<a href=\"#\" onClick=\"return mV('1Ch',5,13);\">1Ch 5:13</a>).";
eastonArray["$$T0003919"] = "<strong>Ziba:</strong> post; statue, \"a servant of the house of Saul\" (<a href=\"#\" onClick=\"return mV('2Sa',9,2);\">2Sa 9:2</a>), who informed David that Mephibosheth, a son of Jonathan, was alive. He afterwards dealt treacherously toward Mephibosheth, whom he slanderously misrepresented to David.";
eastonArray["$$T0003920"] = "<strong>Zibeon:</strong> robber; or dyed.<br><br>(1.) A Hivite (<a href=\"#\" onClick=\"return mV('Gen',36,2);\">Gen 36:2</a>).<br><br>(2.) A Horite, and son of Seir (<a href=\"#\" onClick=\"return mV('Gen',36,20);\">Gen 36:20</a>).";
eastonArray["$$T0003921"] = "<strong>Zibia:</strong> gazelle, a Benjamite (<a href=\"#\" onClick=\"return mV('1Ch',8,9);\">1Ch 8:9</a>).";
eastonArray["$$T0003922"] = "<strong>Zibiah:</strong> the mother of King Joash (<a href=\"#\" onClick=\"return mV('2Ki',12,1);\">2Ki 12:1</a>; <a href=\"#\" onClick=\"return mV('2Ch',24,1);\">2Ch 24:1</a>).";
eastonArray["$$T0003923"] = "<strong>Zichri:</strong> remembered; illustrious.<br><br>(1.) A Benjamite chief (<a href=\"#\" onClick=\"return mV('1Ch',8,19);\">1Ch 8:19</a>).<br><br>(2.) Another of the same tribe (<a href=\"#\" onClick=\"return mV('1Ch',8,23);\">1Ch 8:23</a>).";
eastonArray["$$T0003924"] = "<strong>Ziddim:</strong> sides, a town of Naphtali (<a href=\"#\" onClick=\"return mV('Jos',19,35);\">Jos 19:35</a>), has been identified with Kefr-Hattin, the \"village of the Hittites,\" about 5 miles west of Tiberias.";
eastonArray["$$T0003925"] = "<strong>Zidkijah:</strong> the Lord is righteous, one who sealed the covenant with Nehemiah (<a href=\"#\" onClick=\"return mV('Neh',10,1);\">Neh 10:1</a>).";
eastonArray["$$T0003926"] = "<strong>Zidon:</strong> a fishery, a town on the Mediterranean coast, about 25 miles north of Tyre. It received its name from the \"first-born\" of Canaan, the grandson of Noah (<a href=\"#\" onClick=\"return mV('Gen',10,15,19);\">Gen 10:15,19</a>). It was the first home of the Phoenicians on the coast of Palestine, and from its extensive commercial relations became a \"great\" city (<a href=\"#\" onClick=\"return mV('Jos',11,8);\">Jos 11:8</a>; <a href=\"#\" onClick=\"return mV('Jos',19,28);\">19:28</a>). It was the mother city of Tyre. It lay within the lot of the tribe of Asher, but was never subdued (<a href=\"#\" onClick=\"return mV('Jdg',1,31);\">Jdg 1:31</a>). The Zidonians long oppressed Israel (<a href=\"#\" onClick=\"return mV('Jdg',10,12);\">Jdg 10:12</a>). From the time of David its glory began to wane, and Tyre, its \"virgin daughter\" (<a href=\"#\" onClick=\"return mV('Isa',23,12);\">Isa 23:12</a>), rose to its place of pre-eminence. Solomon entered into a matrimonial alliance with the Zidonians, and thus their form of idolatrous worship found a place in the land of Israel (<a href=\"#\" onClick=\"return mV('1Ki',11,1,33);\">1Ki 11:1, 33</a>). This city was famous for its manufactures and arts, as well as for its commerce (<a href=\"#\" onClick=\"return mV('1Ki',5,6);\">1Ki 5:6</a>; <a href=\"#\" onClick=\"return mV('1Ch',22,4);\">1Ch 22:4</a>; <a href=\"#\" onClick=\"return mV('Eze',27,8);\">Eze 27:8</a>). It is frequently referred to by the prophets (<a href=\"#\" onClick=\"return mV('Isa',23,2,4,12);\">Isa 23:2, 4, 12</a>; <a href=\"#\" onClick=\"return mV('Jer',25,22);\">Jer 25:22</a>; <a href=\"#\" onClick=\"return mV('Jer',27,3);\">27:3</a>; <a href=\"#\" onClick=\"return mV('Jer',47,4);\">47:4</a>; <a href=\"#\" onClick=\"return mV('Eze',27,8);\">Eze 27:8</a>; <a href=\"#\" onClick=\"return mV('Eze',28,21,22);\">28:21-22</a>; <a href=\"#\" onClick=\"return mV('Eze',32,30);\">32:30</a>; <a href=\"#\" onClick=\"return mV('Joe',3,4);\">Joe 3:4</a>). Our Lord visited the \"coasts\" of Tyre and Zidon = Sidon (q.v.), (<a href=\"#\" onClick=\"return mV('Mat',15,21);\">Mat 15:21</a>; <a href=\"#\" onClick=\"return mV('Mar',7,24);\">Mar 7:24</a>; <a href=\"#\" onClick=\"return mV('Luk',4,26);\">Luk 4:26</a>;) and from this region many came forth to hear him preaching (<a href=\"#\" onClick=\"return mV('Mar',3,8);\">Mar 3:8</a>; <a href=\"#\" onClick=\"return mV('Luk',6,17);\">Luk 6:17</a>). From Sidon, at which the ship put in after leaving Caesarea, Paul finally sailed for Rome (<a href=\"#\" onClick=\"return mV('Act',27,3,4);\">Act 27:3-4</a>).<br><br>This city is now a town of 10,000 inhabitants, with remains of walls built in the twelfth century A.D. In 1855, the sarcophagus of Eshmanezer was discovered. From a Phoenician inscription on its lid, it appears that he was a \"king of the Sidonians,\" probably in the third century B.C., and that his mother was a priestess of Ashtoreth, \"the goddess of the Sidonians.\" In this inscription Baal is mentioned as the chief god of the Sidonians.";
eastonArray["$$T0003927"] = "<strong>Zif:</strong> brightness; splendour; i.e., \"the flower month,\" mentioned only in <a href=\"#\" onClick=\"return mV('1Ki',6,1,37);\">1Ki 6:1, 37</a>, as the \"second month.\" It was called Iyar by the later Jews. (See <a href=\"#\" onClick=\"return doDictLookup ('ET0002592');\">MONTH</a>.)";
eastonArray["$$T0003928"] = "<strong>Ziha:</strong> drought.<br><br>(1.) The name of a family of Nethinim (<a href=\"#\" onClick=\"return mV('Ezr',2,43);\">Ezr 2:43</a>; <a href=\"#\" onClick=\"return mV('Neh',7,46);\">Neh 7:46</a>).<br><br>(2.) A ruler among the Nethinim (<a href=\"#\" onClick=\"return mV('Neh',11,21);\">Neh 11:21</a>).";
eastonArray["$$T0003929"] = "<strong>Ziklag:</strong> a town in the Negeb, or south country of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,31);\">Jos 15:31</a>), in the possession of the Philistines when David fled to Gath from Ziph with all his followers. Achish, the king, assigned him Ziklag as his place of residence. There he dwelt for over a year and four months. From this time it pertained to the kings of Judah (<a href=\"#\" onClick=\"return mV('1Sa',27,6);\">1Sa 27:6</a>). During his absence with his army to join the Philistine expedition against the Israelites (<a href=\"#\" onClick=\"return mV('1Sa',29,11);\">29:11</a>), it was destroyed by the Amalekites (<a href=\"#\" onClick=\"return mV('1Sa',30,1,2);\">30:1-2</a>), whom David, however, pursued and utterly routed, returning all the captives (<a href=\"#\" onClick=\"return mV('1Sa',30,'26-31');\">1Sa 30:26-31</a>). Two days after his return from this expedition, David received tidings of the disastrous battle of Gilboa and of the death of Saul (<a href=\"#\" onClick=\"return mV('2Sa',1,'1-16');\">2Sa 1:1-16</a>). He now left Ziklag and returned to Hebron, along with his two wives, Ahinoam and Abigail, and his band of 600 men. It has been identified with 'Asluj, a heap of ruins south of Beersheba. Conder, however, identifies it with Khirbet Zuheilikah, ruins found on three hills half a mile apart, some seventeen miles north-west of Beersheba, on the confines of Philistia, Judah, and Amalek.";
eastonArray["$$T0003930"] = "<strong>Zillah:</strong> shadow, one of the wives of Lamech, of the line of Cain, and mother of Tubal-cain (<a href=\"#\" onClick=\"return mV('Gen',4,19,22);\">Gen 4:19, 22</a>).";
eastonArray["$$T0003931"] = "<strong>Zilpah:</strong> drooping, Leah's handmaid, and the mother of Gad and Asher (<a href=\"#\" onClick=\"return mV('Gen',30,'9-13');\">Gen 30:9-13</a>).";
eastonArray["$$T0003932"] = "<strong>Zilthai:</strong> shadow (i.e., protection) of Jehovah.<br><br>(1.) A Benjamite (<a href=\"#\" onClick=\"return mV('1Ch',8,20);\">1Ch 8:20</a>).<br><br>(2.) One of the captains of the tribe of Manasseh who joined David at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,20);\">1Ch 12:20</a>).";
eastonArray["$$T0003933"] = "<strong>Zimmah:</strong> mischief.<br><br>(1.) A Gershonite Levite (<a href=\"#\" onClick=\"return mV('1Ch',6,20);\">1Ch 6:20</a>).<br><br>(2.) Another Gershonite Levite (<a href=\"#\" onClick=\"return mV('1Ch',6,42);\">1Ch 6:42</a>).<br><br>(3.) The father of Joah (<a href=\"#\" onClick=\"return mV('2Ch',29,12);\">2Ch 29:12</a>).";
eastonArray["$$T0003934"] = "<strong>Zimran:</strong> vine-dressers; celebrated, one of the sons of Abraham by Keturah (<a href=\"#\" onClick=\"return mV('Gen',25,2);\">Gen 25:2</a>).";
eastonArray["$$T0003935"] = "<strong>Zimri:</strong> praise-worthy.<br><br>(1.) A son of Salu, slain by Phinehas, the son of Eleazar, because of his wickedness in bringing a Midianitish woman into his tent (<a href=\"#\" onClick=\"return mV('Num',25,'6-15');\">Num 25:6-15</a>).<br><br>(2.) Murdered Elah at Tirzah, and succeeded him on the throne of Israel (<a href=\"#\" onClick=\"return mV('1Ki',16,'8-10');\">1Ki 16:8-10</a>). He reigned only seven days, for Omri, whom the army elected as king, laid siege to Tirzah, whereupon Zimri set fire to the palace and perished amid its ruins (<a href=\"#\" onClick=\"return mV('1Ki',16,'11-20');\">11-20</a>). Omri succeeded to the throne only after four years of fierce war with Tibni, another claimant to the throne.";
eastonArray["$$T0003936"] = "<strong>Zin:</strong> a low palm-tree, the south-eastern corner of the desert et-Tih, the wilderness of Paran, between the Gulf of Akabah and the head of the Wady Guraiyeh (<a href=\"#\" onClick=\"return mV('Num',13,21);\">Num 13:21</a>). To be distinguished from the wilderness of Sin (q.v.).";
eastonArray["$$T0003937"] = "<strong>Zina:</strong> ornament, one of the sons of Shimei (<a href=\"#\" onClick=\"return mV('1Ch',23,10);\">1Ch 23:10</a>).";
eastonArray["$$T0003938"] = "<strong>Zion:</strong> sunny; height, one of the eminences on which Jerusalem was built. It was surrounded on all sides, except the north, by deep valleys, that of the Tyropoeon (q.v.) separating it from Moriah (q.v.), which it surpasses in height by 105 feet. It was the south-eastern hill of Jerusalem.<br><br>When David took it from the Jebusites (<a href=\"#\" onClick=\"return mV('Jos',15,63);\">Jos 15:63</a>; <a href=\"#\" onClick=\"return mV('2Sa',5,7);\">2Sa 5:7</a>) he built on it a citadel and a palace, and it became \"the city of David\" (<a href=\"#\" onClick=\"return mV('1Ki',8,1);\">1Ki 8:1</a>; <a href=\"#\" onClick=\"return mV('2Ki',19,21,31);\">2Ki 19:21, 31</a>; <a href=\"#\" onClick=\"return mV('1Ch',11,5);\">1Ch 11:5</a>). In the later books of the Old Testament this name was sometimes used (<a href=\"#\" onClick=\"return mV('Psa',87,2);\">Psa 87:2</a>; <a href=\"#\" onClick=\"return mV('Psa',149,2);\">149:2</a>; <a href=\"#\" onClick=\"return mV('Isa',33,14);\">Isa 33:14</a>; <a href=\"#\" onClick=\"return mV('Joe',2,1);\">Joe 2:1</a>) to denote Jerusalem in general, and sometimes God's chosen Israel (<a href=\"#\" onClick=\"return mV('Psa',51,18);\">Psa 51:18</a>; <a href=\"#\" onClick=\"return mV('Psa',87,5);\">87:5</a>).<br><br>In the New Testament (see <a href=\"#\" onClick=\"return doDictLookup ('ET0003448');\">SION</a>) it is used sometimes to denote the Church of God (<a href=\"#\" onClick=\"return mV('Hbr',12,22);\">Hbr 12:22</a>), and sometimes the heavenly city (<a href=\"#\" onClick=\"return mV('Rev',14,1);\">Rev 14:1</a>).";
eastonArray["$$T0003939"] = "<strong>Zior:</strong> littleness, a city in the mountains of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,54);\">Jos 15:54</a>); the modern Si'air, 4 1/2 miles north-north-east of Hebron.";
eastonArray["$$T0003940"] = "<strong>Ziph:</strong> flowing.<br><br>(1.) A son of Jehaleleel (<a href=\"#\" onClick=\"return mV('1Ch',4,16);\">1Ch 4:16</a>).<br><br>(2.) A city in the south of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,24);\">Jos 15:24</a>), probably at the pass of Sufah.<br><br>(3.) A city in the mountains of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,55);\">Jos 15:55</a>), identified with the uninhabited ruins of Tell ez-Zif, about 5 miles south-east of Hebron. Here David hid himself during his wanderings (<a href=\"#\" onClick=\"return mV('1Sa',23,19);\">1Sa 23:19</a>; <a href=\"#\" onClick=\"return mV('Psa',54,1);\">Psa 54, title</a>).";
eastonArray["$$T0003941"] = "<strong>Ziphah:</strong> a descendant of Judah (<a href=\"#\" onClick=\"return mV('1Ch',4,16);\">1Ch 4:16</a>).";
eastonArray["$$T0003942"] = "<strong>Ziphron:</strong> sweet odour, a city on the northern border of Palestine (<a href=\"#\" onClick=\"return mV('Num',34,9);\">Num 34:9</a>), south-east of Hamath.";
eastonArray["$$T0003943"] = "<strong>Zippor:</strong> a little bird, the father of Balak, king of Moab (<a href=\"#\" onClick=\"return mV('Num',22,2,4);\">Num 22:2, 4</a>).";
eastonArray["$$T0003944"] = "<strong>Zipporah:</strong> a female bird. Reuel's daughter, who became the wife of Moses (<a href=\"#\" onClick=\"return mV('Exd',2,21);\">Exd 2:21</a>). In consequence of the event recorded in <a href=\"#\" onClick=\"return mV('Exd',4,'24-26');\">Exd 4:24-26</a>, she and her two sons, Gershom and Eliezer, when so far on the way with Moses toward Egypt, were sent back by him to her own kinsfolk, the Midianites, with whom they sojourned till Moses afterwards joined them (<a href=\"#\" onClick=\"return mV('Exd',18,'2-6');\">18:2-6</a>).";
eastonArray["$$T0003945"] = "<strong>Zithri:</strong> the Lord protects, a Levite, son of Uzziel (<a href=\"#\" onClick=\"return mV('Exd',6,22);\">Exd 6:22</a>).";
eastonArray["$$T0003946"] = "<strong>Ziz:</strong> projecting; a flower, a cleft or pass, probably that near En-gedi, which leads up from the Dead Sea (<a href=\"#\" onClick=\"return mV('2Ch',20,16);\">2Ch 20:16</a>) in the direction of Tekoa; now Tell Hasasah.";
eastonArray["$$T0003947"] = "<strong>Ziza:</strong> splendour; abundance.<br><br>(1.) A Simeonite prince (<a href=\"#\" onClick=\"return mV('1Ch',4,'37-43');\">1Ch 4:37-43</a>).<br><br>(2.) A son of Rehoboam (<a href=\"#\" onClick=\"return mV('2Ch',11,20);\">2Ch 11:20</a>).";
eastonArray["$$T0003948"] = "<strong>Zizah:</strong> a Gershonite Levite (<a href=\"#\" onClick=\"return mV('1Ch',23,11);\">1Ch 23:11</a>).";
eastonArray["$$T0003949"] = "<strong>Zoan:</strong> (Old Egypt. Sant =\"stronghold,\" the modern San). A city on the Tanitic branch of the Nile, called by the Greeks Tanis. It was built seven years after Hebron in Palestine (<a href=\"#\" onClick=\"return mV('Num',13,22);\">Num 13:22</a>). This great and important city was the capital of the Hyksos, or Shepherd kings, who ruled Egypt for more than 500 years. It was the frontier town of Goshen. Here Pharaoh was holding his court at the time of his various interviews with Moses and Aaron. \"No trace of Zoan exists; Tanis was built over it, and city after city has been built over the ruins of that\" (Harper, Bible and Modern Discovery). Extensive mounds of ruins, the wreck of the ancient city, now mark its site (<a href=\"#\" onClick=\"return mV('Isa',19,11,13);\">Isa 19:11, 13</a>; <a href=\"#\" onClick=\"return mV('Isa',30,4);\">30:4</a>; <a href=\"#\" onClick=\"return mV('Eze',30,14);\">Eze 30:14</a>). \"The whole constitutes one of the grandest and oldest ruins in the world.\"<br><br>This city was also called \"the Field of Zoan\" (<a href=\"#\" onClick=\"return mV('Psa',78,12,43);\">Psa 78:12, 43</a>) and \"the Town of Rameses\" (q.v.), because the oppressor rebuilt and embellished it, probably by the forced labour of the Hebrews, and made it his northern capital.";
