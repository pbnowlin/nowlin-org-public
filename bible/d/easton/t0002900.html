<script>var eastonArray = new Array ();
eastonArray["$$T0002900"] = "<strong>Perfection:</strong> See <a href=\"#\" onClick=\"return doDictLookup('ET0003212');\">SANCTIFICATION</a>.";
eastonArray["$$T0002901"] = "<strong>Perfumes:</strong> were used in religious worship, and for personal and domestic enjoyment (<a href=\"#\" onClick=\"return mV('Exd',30,'35-37');\">Exd 30:35-37</a>; <a href=\"#\" onClick=\"return mV('Pro',7,17);\">Pro 7:17</a>; <a href=\"#\" onClick=\"return mV('Sgs',3,6);\">Sgs 3:6</a>; <a href=\"#\" onClick=\"return mV('Isa',57,9);\">Isa 57:9</a>); and also in embalming the dead, and in other funeral ceremonies (<a href=\"#\" onClick=\"return mV('Mar',14,8);\">Mar 14:8</a>; <a href=\"#\" onClick=\"return mV('Luk',24,1);\">Luk 24:1</a>; <a href=\"#\" onClick=\"return mV('Jhn',19,39);\">Jhn 19:39</a>).";
eastonArray["$$T0002902"] = "<strong>Perga:</strong> the capital of Pamphylia, on the coast of Asia Minor. Paul and his companions landed at this place from Cyprus on their first missionary journey (<a href=\"#\" onClick=\"return mV('Act',13,13,14);\">Act 13:13-14</a>), and here Mark forsook the party and returned to Jerusalem. Some time afterwards Paul and Barnabas again visited this city and \"preached the word\" (<a href=\"#\" onClick=\"return mV('Act',14,25);\">14:25</a>). It stood on the banks of the river Cestrus, some 7 miles from its mouth, and was a place of some commercial importance. It is now a ruin, called Eski Kalessi.";
eastonArray["$$T0002903"] = "<strong>Pergamos:</strong> the chief city of Mysia, in Asia Minor. One of the \"seven churches\" was planted here (<a href=\"#\" onClick=\"return mV('Rev',1,11);\">Rev 1:11</a>; <a href=\"#\" onClick=\"return mV('Rev',2,17);\">2:17</a>). It was noted for its wickedness, insomuch that our Lord says \"Satan's seat\" was there. The church of Pergamos was rebuked for swerving from the truth and embracing the doctrines of Balaam and the Nicolaitanes. Antipas, Christ's \"faithful martyr,\" here sealed his testimony with his blood.<br><br>This city stood on the banks of the river Caicus, about 20 miles from the sea. It is now called Bergama, and has a population of some twenty thousand, of whom about two thousand profess to be Christians. Parchment (q.v.) was first made here, and was called by the Greeks pergamene, from the name of the city.";
eastonArray["$$T0002904"] = "<strong>Perida:</strong> kernel, <a href=\"#\" onClick=\"return mV('Neh',7,57);\">Neh 7:57</a>. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002910');\">PERUDA</a>.)";
eastonArray["$$T0002905"] = "<strong>Perizzites:</strong> villagers; dwellers in the open country, the Canaanitish nation inhabiting the fertile regions south and south-west of Carmel. \"They were the graziers, farmers, and peasants of the time.\" They were to be driven out of the land by the descendants of Abraham (<a href=\"#\" onClick=\"return mV('Gen',15,20);\">Gen 15:20</a>; <a href=\"#\" onClick=\"return mV('Exd',3,8,17);\">Exd 3:8, 17</a>; <a href=\"#\" onClick=\"return mV('Exd',23,23);\">23:23</a>; <a href=\"#\" onClick=\"return mV('Exd',33,2);\">33:2</a>; <a href=\"#\" onClick=\"return mV('Exd',34,11);\">34:11</a>). They are afterwards named among the conquered tribes (<a href=\"#\" onClick=\"return mV('Jos',24,11);\">Jos 24:11</a>). Still lingering in the land, however, they were reduced to servitude by Solomon (<a href=\"#\" onClick=\"return mV('1Ki',9,20);\">1Ki 9:20</a>).";
eastonArray["$$T0002906"] = "<strong>Persecution:</strong> The first great persecution for religious opinion of which we have any record was that which broke out against the worshippers of God among the Jews in the days of Ahab, when that king, at the instigation of his wife Jezebel, \"a woman in whom, with the reckless and licentious habits of an Oriental queen, were united the fiercest and sternest qualities inherent in the old Semitic race\", sought in the most relentless manner to extirpate the worship of Jehovah and substitute in its place the worship of Ashtoreth and Baal. Ahab's example in this respect was followed by Manasseh, who \"shed innocent blood very much, till he had filled Jerusalem from one end to another\" (<a href=\"#\" onClick=\"return mV('2Ki',21,16);\">2Ki 21:16</a>; <a href=\"#\" onClick=\"return mV('2Ki',24,4);\">2Ki 24:4</a>). In all ages, in one form or another, the people of God have had to suffer persecution. In its earliest history the Christian church passed through many bloody persecutions. Of subsequent centuries in our own and in other lands the same sad record may be made.<br><br>Christians are forbidden to seek the propagation of the gospel by force (<a href=\"#\" onClick=\"return mV('Mat',7,1);\">Mat 7:1</a>; <a href=\"#\" onClick=\"return mV('Luk',9,'54-56');\">Luk 9:54-56</a>; <a href=\"#\" onClick=\"return mV('Rom',14,4);\">Rom 14:4</a>; <a href=\"#\" onClick=\"return mV('Jam',4,11,12);\">Jam 4:11-12</a>). The words of <a href=\"#\" onClick=\"return mV('Psa',7,13);\">Psa 7:13</a>, \"He ordaineth his arrows against the persecutors,\" ought rather to be, as in the Revised Version, \"He maketh his arrows fiery [shafts].\"";
eastonArray["$$T0002907"] = "<strong>Perseverance of the saints:</strong> their certain continuance in a state of grace. Once justified and regenerated, the believer can neither totally nor finally fall away from grace, but will certainly persevere therein and attain everlasting life.<br><br>This doctrine is clearly taught in these passages, <a href=\"#\" onClick=\"return mV('Jhn',10,28,29);\">Jhn 10:28-29</a>; <a href=\"#\" onClick=\"return mV('Rom',11,29);\">Rom 11:29</a>; <a href=\"#\" onClick=\"return mV('Phl',1,6);\">Phl 1:6</a>; <a href=\"#\" onClick=\"return mV('1Pe',1,5);\">1Pe 1:5</a>. It, moreover, follows from a consideration of<br><br>(1) the immutability of the divine decrees (<a href=\"#\" onClick=\"return mV('Jer',31,3);\">Jer 31:3</a>; <a href=\"#\" onClick=\"return mV('Mat',24,'22-24');\">Mat 24:22-24</a>; <a href=\"#\" onClick=\"return mV('Act',13,48);\">Act 13:48</a>; <a href=\"#\" onClick=\"return mV('Rom',8,30);\">Rom 8:30</a>);<br><br>(2) the provisions of the covenant of grace (<a href=\"#\" onClick=\"return mV('Jer',32,40);\">Jer 32:40</a>; <a href=\"#\" onClick=\"return mV('Jhn',10,29);\">Jhn 10:29</a>; <a href=\"#\" onClick=\"return mV('Jhn',17,'2-6');\">17:2-6</a>);<br><br>(3) the atonement and intercession of Christ (<a href=\"#\" onClick=\"return mV('Isa',53,6,11);\">Isa 53:6, 11</a>; <a href=\"#\" onClick=\"return mV('Mat',20,28);\">Mat 20:28</a>; <a href=\"#\" onClick=\"return mV('1Pe',2,24);\">1Pe 2:24</a>; <a href=\"#\" onClick=\"return mV('Jhn',11,42);\">Jhn 11:42</a>; <a href=\"#\" onClick=\"return mV('Jhn',17,11,15,20);\">17:11, 15, 20</a>; <a href=\"#\" onClick=\"return mV('Rom',8,34);\">Rom 8:34</a>); and<br><br>(4) the indwelling of the Holy Ghost (<a href=\"#\" onClick=\"return mV('Jhn',14,16);\">Jhn 14:16</a>; <a href=\"#\" onClick=\"return mV('2Cr',1,21,22);\">2Cr 1:21-22</a>; <a href=\"#\" onClick=\"return mV('2Cr',5,5);\">5:5</a>; <a href=\"#\" onClick=\"return mV('Eph',1,14);\">Eph 1:14</a>; <a href=\"#\" onClick=\"return mV('1Jo',3,9);\">1Jo 3:9</a>).<br><br>This doctrine is not inconsistent with the truth that the believer may nevertheless fall into grievous sin, and continue therein for some time. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000414');\">BACKSLIDE</a>.)";
eastonArray["$$T0002908"] = "<strong>Persia:</strong> an ancient empire, extending from the Indus to Thrace, and from the Caspian Sea to the Red Sea and the Persian Gulf. The Persians were originally a Medic tribe which settled in Persia, on the eastern side of the Persian Gulf. They were Aryans, their language belonging to the eastern division of the Indo-European group. One of their chiefs, Teispes, conquered Elam in the time of the decay of the Assyrian Empire, and established himself in the district of Anzan. His descendants branched off into two lines, one line ruling in Anzan, while the other remained in Persia. Cyrus II., king of Anzan, finally united the divided power, conquered Media, Lydia, and Babylonia, and carried his arms into the far East. His son, Cambyses, added Egypt to the empire, which, however, fell to pieces after his death. It was reconquered and thoroughly organized by Darius, the son of Hystaspes, whose dominions extended from India to the Danube.";
eastonArray["$$T0002909"] = "<strong>Persis:</strong> a female Christian at Rome whom Paul salutes (<a href=\"#\" onClick=\"return mV('Rom',16,12);\">Rom 16:12</a>). She is spoken of as \"beloved,\" and as having \"laboured much in the Lord.\"";
eastonArray["$$T0002910"] = "<strong>Peruda:</strong> one whose descendants returned with Zerubbabel (<a href=\"#\" onClick=\"return mV('Ezr',2,55);\">Ezr 2:55</a>); called also Perida (<a href=\"#\" onClick=\"return mV('Neh',7,57);\">Neh 7:57</a>).";
eastonArray["$$T0002911"] = "<strong>Peter:</strong> originally called Simon (=Simeon ,i.e., \"hearing\"), a very common Jewish name in the New Testament. He was the son of Jona (<a href=\"#\" onClick=\"return mV('Mat',16,17);\">Mat 16:17</a>). His mother is nowhere named in Scripture. He had a younger brother called Andrew, who first brought him to Jesus (<a href=\"#\" onClick=\"return mV('Jhn',1,'40-42');\">Jhn 1:40-42</a>). His native town was Bethsaida, on the western coast of the Sea of Galilee, to which also Philip belonged. Here he was brought up by the shores of the Sea of Galilee, and was trained to the occupation of a fisher. His father had probably died while he was still young, and he and his brother were brought up under the care of Zebedee and his wife Salome (<a href=\"#\" onClick=\"return mV('Mat',27,56);\">Mat 27:56</a>; <a href=\"#\" onClick=\"return mV('Mar',15,40);\">Mar 15:40</a>; <a href=\"#\" onClick=\"return mV('Mar',16,1);\">16:1</a>). There the four youths, Simon, Andrew, James, and John, spent their boyhood and early manhood in constant fellowship. Simon and his brother doubtless enjoyed all the advantages of a religious training, and were early instructed in an acquaintance with the Scriptures and with the great prophecies regarding the coming of the Messiah. They did not probably enjoy, however, any special training in the study of the law under any of the rabbis. When Peter appeared before the Sanhedrin, he looked like an \"unlearned man\" (<a href=\"#\" onClick=\"return mV('Act',4,13);\">Act 4:13</a>).<br><br>\"Simon was a Galilean, and he was that out and out...The Galileans had a marked character of their own. They had a reputation for an independence and energy which often ran out into turbulence. They were at the same time of a franker and more transparent disposition than their brethren in the south. In all these respects, in bluntness, impetuosity, headiness, and simplicity, Simon was a genuine Galilean. They spoke a peculiar dialect. They had a difficulty with the guttural sounds and some others, and their pronunciation was reckoned harsh in Judea. The Galilean accent stuck to Simon all through his career. It betrayed him as a follower of Christ when he stood within the judgment-hall (<a href=\"#\" onClick=\"return mV('Mar',14,70);\">Mar 14:70</a>). It betrayed his own nationality and that of those conjoined with him on the day of Pentecost (<a href=\"#\" onClick=\"return mV('Act',2,7);\">Act 2:7</a>).\" It would seem that Simon was married before he became an apostle. His wife's mother is referred to (<a href=\"#\" onClick=\"return mV('Mat',8,14);\">Mat 8:14</a>; <a href=\"#\" onClick=\"return mV('Mar',1,30);\">Mar 1:30</a>; <a href=\"#\" onClick=\"return mV('Luk',4,38);\">Luk 4:38</a>). He was in all probability accompanied by his wife on his missionary journeys (<a href=\"#\" onClick=\"return mV('1Cr',9,5);\">1Cr 9:5</a>; <a href=\"#\" onClick=\"return mV('1Pe',5,13);\">1Pe 5:13</a>).<br><br>He appears to have been settled at Capernaum when Christ entered on his public ministry, and may have reached beyond the age of thirty. His house was large enough to give a home to his brother Andrew, his wife's mother, and also to Christ, who seems to have lived with him (<a href=\"#\" onClick=\"return mV('Mar',1,29,36);\">Mar 1:29, 36</a>; <a href=\"#\" onClick=\"return mV('Mar',2,1);\">2:1</a>), as well as to his own family. It was apparently two stories high (<a href=\"#\" onClick=\"return mV('Mar',2,4);\">2:4</a>).<br><br>At Bethabara (<a href=\"#\" onClick=\"return mV('Jhn',1,28);\">Jhn 1:28</a>, \"Bethany\"), beyond Jordan, John the Baptist had borne testimony concerning Jesus as the \"Lamb of God\" (<a href=\"#\" onClick=\"return mV('Jhn',1,'29-36');\">Jhn 1:29-36</a>). Andrew and John hearing it, followed Jesus, and abode with him where he was. They were convinced, by his gracious words and by the authority with which he spoke, that he was the Messiah (<a href=\"#\" onClick=\"return mV('Luk',4,22);\">Luk 4:22</a>; <a href=\"#\" onClick=\"return mV('Mat',7,29);\">Mat 7:29</a>); and Andrew went forth and found Simon and brought him to Jesus (<a href=\"#\" onClick=\"return mV('Jhn',1,41);\">Jhn 1:41</a>).<br><br>Jesus at once recognized Simon, and declared that hereafter he would be called Cephas, an Aramaic name corresponding to the Greek Petros, which means \"a mass of rock detached from the living rock.\" The Aramaic name does not occur again, but the name Peter gradually displaces the old name Simon, though our Lord himself always uses the name Simon when addressing him (<a href=\"#\" onClick=\"return mV('Mat',17,25);\">Mat 17:25</a>; <a href=\"#\" onClick=\"return mV('Mar',14,37);\">Mar 14:37</a>; <a href=\"#\" onClick=\"return mV('Luk',22,31);\">Luk 22:31</a>, comp. <a href=\"#\" onClick=\"return mV('Luk',21,'15-17');\">21:15-17</a>). We are not told what impression the first interview with Jesus produced on the mind of Simon. When we next meet him it is by the Sea of Galilee (<a href=\"#\" onClick=\"return mV('Mat',4,'18-22');\">Mat 4:18-22</a>). There the four (Simon and Andrew, James and John) had had an unsuccessful night's fishing. Jesus appeared suddenly, and entering into Simon's boat, bade him launch forth and let down the nets. He did so, and enclosed a great multitude of fishes. This was plainly a miracle wrought before Simon's eyes. The awe-stricken disciple cast himself at the feet of Jesus, crying, \"Depart from me; for I am a sinful man, O Lord\" (<a href=\"#\" onClick=\"return mV('Luk',5,8);\">Luk 5:8</a>). Jesus addressed him with the assuring words, \"Fear not,\" and announced to him his life's work. Simon responded at once to the call to become a disciple, and after this we find him in constant attendance on our Lord.<br><br>He is next called into the rank of the apostleship, and becomes a \"fisher of men\" (<a href=\"#\" onClick=\"return mV('Mat',4,19);\">Mat 4:19</a>) in the stormy seas of the world of human life (<a href=\"#\" onClick=\"return mV('Mat',10,'2-4');\">Mat 10:2-4</a>; <a href=\"#\" onClick=\"return mV('Mar',3,'13-19');\">Mar 3:13-19</a><; <a href=\"#\" onClick=\"return mV('Luk',6,'13-16');\">Luk 6:13-16</a>), and takes a more and more prominent part in all the leading events of our Lord's life. It is he who utters that notable profession of faith at Capernaum (<a href=\"#\" onClick=\"return mV('Jhn',6,'66-69');\">Jhn 6:66-69</a>), and again at Caesarea Philippi (<a href=\"#\" onClick=\"return mV('Mat',16,'13-20');\">Mat 16:13-20</a>; <a href=\"#\" onClick=\"return mV('Mar',8,'27-30');\">Mar 8:27-30</a>; <a href=\"#\" onClick=\"return mV('Luk',9,'18-20');\">Luk 9:18-20</a>). This profession at Caesarea was one of supreme importance, and our Lord in response used these memorable words: \"Thou art Peter, and upon this rock I will build my church.\"<br><br>\"From that time forth\" Jesus began to speak of his sufferings. For this Peter rebuked him. But our Lord in return rebuked Peter, speaking to him in sterner words than he ever used to any other of his disciples (<a href=\"#\" onClick=\"return mV('Mat',16,'21-23');\">Mat 16:21-23</a>; <a href=\"#\" onClick=\"return mV('Mar',8,'31-33');\">Mar 8:31-33</a>). At the close of his brief sojourn at Caesarea our Lord took Peter and James and John with him into \"an high mountain apart,\" and was transfigured before them. Peter on that occasion, under the impression the scene produced on his mind, exclaimed, \"Lord, it is good for us to be here: let us make three tabernacles\" (<a href=\"#\" onClick=\"return mV('Mat',17,'1-9');\">Mat 17:1-9</a>).<br><br>On his return to Capernaum the collectors of the temple tax (a didrachma, half a sacred shekel), which every Israelite of twenty years old and upwards had to pay (<a href=\"#\" onClick=\"return mV('Exd',30,15);\">Exd 30:15</a>), came to Peter and reminded him that Jesus had not paid it (<a href=\"#\" onClick=\"return mV('Mat',17,'24-27');\">Mat 17:24-27</a>). Our Lord instructed Peter to go and catch a fish in the lake and take from its mouth the exact amount needed for the tax, viz., a stater, or two half-shekels. \"That take,\" said our Lord, \"and give unto them for me and thee.\"<br><br>As the end was drawing nigh, our Lord sent Peter and John (<a href=\"#\" onClick=\"return mV('Luk',22,'7-13');\">Luk 22:7-13</a>) into the city to prepare a place where he should keep the feast with his disciples. There he was forewarned of the fearful sin into which he afterwards fell (<a href=\"#\" onClick=\"return mV('Luk',22,'31-34');\">22:31-34</a>). He accompanied our Lord from the guest-chamber to the garden of Gethsemane (<a href=\"#\" onClick=\"return mV('Luk',22,'39-46');\">Luk 22:39-46</a>), which he and the other two who had been witnesses of the transfiguration were permitted to enter with our Lord, while the rest were left without. Here he passed through a strange experience. Under a sudden impulse he cut off the ear of Malchus (<a href=\"#\" onClick=\"return mV('Luk',22,'47-51');\">47-51</a>), one of the band that had come forth to take Jesus. Then follow the scenes of the judgment-hall (<a href=\"#\" onClick=\"return mV('Luk',22,'54-61';\">54-61</a>) and his bitter grief (<a href=\"#\" onClick=\"return mV('Luk',22,'62');\">62</a>).<br><br>He is found in John's company early on the morning of the resurrection. He boldly entered into the empty grave (<a href=\"#\" onClick=\"return mV('Jhn',20,'1-10');\">Jhn 20:1-10</a>), and saw the \"linen clothes laid by themselves\" (<a href=\"#\" onClick=\"return mV('Luk',24,'9-12');\">Luk 24:9-12</a>). To him, the first of the apostles, our risen Lord revealed himself, thus conferring on him a signal honour, and showing how fully he was restored to his favour (<a href=\"#\" onClick=\"return mV('Luk',24,34);\">Luk 24:34</a>; <a href=\"#\" onClick=\"return mV('1Cr',15,5);\">1Cr 15:5</a>). We next read of our Lord's singular interview with Peter on the shores of the Sea of Galilee, where he thrice asked him, \"Simon, son of Jonas, lovest thou me?\" (<a href=\"#\" onClick=\"return mV('Jhn',21,'1-19');\">Jhn 21:1-19</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002322');\">LOVE</a>.)<br><br>After this scene at the lake we hear nothing of Peter till he again appears with the others at the ascension (<a href=\"#\" onClick=\"return mV('Act',1,'15-26');\">Act 1:15-26</a>). It was he who proposed that the vacancy caused by the apostasy of Judas should be filled up. He is prominent on the day of Pentecost (<a href=\"#\" onClick=\"return mV('Act',2,'14-40');\">2:14-40</a>). The events of that day \"completed the change in Peter himself which the painful discipline of his fall and all the lengthened process of previous training had been slowly making. He is now no more the unreliable, changeful, self-confident man, ever swaying between rash courage and weak timidity, but the stead-fast, trusted guide and director of the fellowship of believers, the intrepid preacher of Christ in Jerusalem and abroad. And now that he is become Cephas indeed, we hear almost nothing of the name Simon (only in <a href=\"#\" onClick=\"return mV('Act',10,5,32);\">Act 10:5, 32</a>; <a href=\"#\" onClick=\"return mV('Act',15,14);\">15:14</a>), and he is known to us finally as Peter.\"<br><br>After the miracle at the temple gate (only in <a href=\"#\" onClick=\"return mV('Act',3,'1-')\">Act 3</a>) persecution arose against the Christians, and Peter was cast into prison. He boldly defended himself and his companions at the bar of the council (<a href=\"#\" onClick=\"return mV('Act',4,19,20);\">4:19-20</a>). A fresh outburst of violence against the Christians (<a href=\"#\" onClick=\"return mV('Act',5,'17-21');\">5:17-21</a>) led to the whole body of the apostles being cast into prison; but during the night they were wonderfully delivered, and were found in the morning teaching in the temple. A second time Peter defended them before the council (<a href=\"#\" onClick=\"return mV('Act',5,'29-32');\">Act 5:29-32</a>), who, \"when they had called the apostles and beaten them, let them go.\"<br><br>The time had come for Peter to leave Jerusalem. After labouring for some time in Samaria, he returned to Jerusalem, and reported to the church there the results of his work (<a href=\"#\" onClick=\"return mV('Act',8,'14-25');\">Act 8:14-25</a>). Here he remained for a period, during which he met Paul for the first time since his conversion (<a href=\"#\" onClick=\"return mV('Act',9,'26-30');\">9:26-30</a>; <a href=\"#\" onClick=\"return mV('Gal',1,18);\">Gal 1:18</a>). Leaving Jerusalem again, he went forth on a missionary journey to Lydda and Joppa (<a href=\"#\" onClick=\"return mV('Act',9,'32-43');\">Act 9:32-43</a>). He is next called on to open the door of the Christian church to the Gentiles by the admission of Cornelius of Caesarea (<a href=\"#\" onClick=\"return mV('Act',10,'1-')\">Act 10</a>).<br><br>After remaining for some time at Caesarea, he returned to Jerusalem (<a href=\"#\" onClick=\"return mV('Act',11,'1-18');\">Act 11:1-18</a>), where he defended his conduct with reference to the Gentiles. Next we hear of his being cast into prison by Herod Agrippa (<a href=\"#\" onClick=\"return mV('Act',12,'1-19');\">12:1-19</a>); but in the night an angel of the Lord opened the prison gates, and he went forth and found refuge in the house of Mary.<br><br>He took part in the deliberations of the council in Jerusalem (<a href=\"#\" onClick=\"return mV('Act',15,'1-31');\">Act 15:1-31</a>; <a href=\"#\" onClick=\"return mV('Gal',2,'1-10');\">Gal 2:1-10</a>) regarding the relation of the Gentiles to the church. This subject had awakened new interest at Antioch, and for its settlement was referred to the council of the apostles and elders at Jerusalem. Here Paul and Peter met again.<br><br>We have no further mention of Peter in the Acts of the Apostles. He seems to have gone down to Antioch after the council at Jerusalem, and there to have been guilty of dissembling, for which he was severely reprimanded by Paul (<a href=\"#\" onClick=\"return mV('Gal',2,'11-16');\">Gal 2:11-16</a>), who \"rebuked him to his face.\"<br><br>After this he appears to have carried the gospel to the east, and to have laboured for a while at Babylon, on the Euphrates (<a href=\"#\" onClick=\"return mV('1Pe',5,13);\">1Pe 5:13</a>). There is no satisfactory evidence that he was ever at Rome. Where or when he died is not certainly known. Probably he died between A.D. 64 and 67.";
eastonArray["$$T0002912"] = "<strong>Peter, First Epistle of:</strong> This epistle is addressed to \"the strangers scattered abroad\", i.e., to the Jews of the Dispersion (the Diaspora).<br><br>Its object is to confirm its readers in the doctrines they had been already taught. Peter has been called \"the apostle of hope,\" because this epistle abounds with words of comfort and encouragement fitted to sustain a \"lively hope.\" It contains about thirty-five references to the Old Testament.<br><br>It was written from Babylon, on the Euphrates, which was at this time one of the chief seats of Jewish learning, and a fitting centre for labour among the Jews. It has been noticed that in the beginning of his epistle Peter names the provinces of Asia Minor in the order in which they would naturally occur to one writing from Babylon. He counsels<br><br>(1) to steadfastness and perseverance under persecution (<a href=\"#\" onClick=\"return mV('1Pe',1,'1-')\">1Pe 1</a>-<a href=\"#\" onClick=\"return mV('1Pe',2,'1-10')\">2:-10</a>);<br><br>(2) to the practical duties of a holy life (<a href=\"#\" onClick=\"return mV('1Pe',2,'11-');\">1Pe 2:11</a>-<a href=\"#\" onClick=\"return mV('1Pe',3,'1-13');\">3:13</a>);<br><br>(3) he adduces the example of Christ and other motives to patience and holiness (<a href=\"#\" onClick=\"return mV('1Pe',3,'14-');\">1Pe 3:14-4:19</a>); and<br><br>(4) concludes with counsels to pastors and people (<a href=\"#\" onClick=\"return mV('1Pe',5,'1-')\">1Pe 5</a>).";
eastonArray["$$T0002913"] = "<strong>Peter, Second Epistle of:</strong> The question of the authenticity of this epistle has been much discussed, but the weight of evidence is wholly in favour of its claim to be the production of the apostle whose name it bears. It appears to have been written shortly before the apostle's death (<a href=\"#\" onClick=\"return mV('2Pe',1,14);\">2Pe 1:14</a>). This epistle contains eleven references to the Old Testament. It also contains (<a href=\"#\" onClick=\"return mV('2Pe',3,15,16);\">2Pe 3:15-16</a>) a remarkable reference to Paul's epistles. Some think this reference is to 1 Thess. (<a href=\"#\" onClick=\"return mV('2Pe',4,'13-');\">2Pe 4:13</a>-<a href=\"#\" onClick=\"return mV('2Pe',5,'1-11');\">5:11</a>). A few years ago, among other documents, a parchment fragment, called the \"Gospel of Peter,\" was discovered in a Christian tomb at Akhmim in Upper Egypt. Origen [obiit A.D. 254], Eusebius [obiit 340], and Jerome [obiit 420] refer to such a work, and hence it has been concluded that it was probably written about the middle of the second century. It professes to give a history of our Lord's resurrection and ascension. While differing in not a few particulars from the canonical Gospels, the writer shows plainly that he was acquinted both with the synoptics and with the Gospel of John. Though apocryphal, it is of considerable value as showing that the main facts of the history of our Lord were then widely known.";
eastonArray["$$T0002914"] = "<strong>Pethahiah:</strong> loosed of the Lord.<br><br>(1.) The chief of one of the priestly courses (the nineteenth) in the time of David (<a href=\"#\" onClick=\"return mV('1Ch',24,16);\">1Ch 24:16</a>).<br><br>(2.) A Levite (<a href=\"#\" onClick=\"return mV('Ezr',10,23);\">Ezr 10:23</a>).<br><br>(3.) <a href=\"#\" onClick=\"return mV('Neh',9,5);\">Neh 9:5</a>.<br><br>(4.) A descendant of Judah who had some office at the court of Persia (<a href=\"#\" onClick=\"return mV('Neh',11,24);\">Neh 11:24</a>).";
eastonArray["$$T0002915"] = "<strong>Pethor:</strong> interpretation of dreams, identified with Pitru, on the west bank of the Euphrates, a few miles south of the Hittite capital of Carchemish (<a href=\"#\" onClick=\"return mV('Num',22,5);\">Num 22:5</a>, \"which is by the river of the land of the children of [the god] Ammo\"). (See <a href=\"#\" onClick=\"return doDictLookup('ET0000421');\">BALAAM</a>.)";
eastonArray["$$T0002916"] = "<strong>Pethuel:</strong> vision of God, the father of Joel the prophet (<a href=\"#\" onClick=\"return mV('Joe',1,1);\">Joe 1:1</a>).";
eastonArray["$$T0002917"] = "<strong>Petra:</strong> rock, <a href=\"#\" onClick=\"return mV('Isa',16,1);\">Isa 16:1</a>, marg. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003264');\">SELA</a>.)";
eastonArray["$$T0002918"] = "<strong>Peulthai:</strong> wages of the Lord, one of the sons of Obed-edom, a Levite porter (<a href=\"#\" onClick=\"return mV('1Ch',26,5);\">1Ch 26:5</a>).";
eastonArray["$$T0002919"] = "<strong>Phalec:</strong> <a href=\"#\" onClick=\"return mV('Luk',3,35);\">Luk 3:35</a> = Peleg (q.v.), <a href=\"#\" onClick=\"return mV('Gen',11,16);\">Gen 11:16</a>.";
eastonArray["$$T0002920"] = "<strong>Phallu:</strong> separated, the second son of Reuben (<a href=\"#\" onClick=\"return mV('Gen',46,9);\">Gen 46:9</a>).";
eastonArray["$$T0002921"] = "<strong>Phalti:</strong> deliverance of the Lord, the son of Laish of Gallim (<a href=\"#\" onClick=\"return mV('1Sa',25,44);\">1Sa 25:44</a>) = Phaltiel (<a href=\"#\" onClick=\"return mV('2Sa',3,15);\">2Sa 3:15</a>). Michal, David's wife, was given to him.";
eastonArray["$$T0002922"] = "<strong>Phanuel:</strong> face of God, father of the prophetess Anna (q.v.), <a href=\"#\" onClick=\"return mV('Luk',2,36);\">Luk 2:36</a>.";
eastonArray["$$T0002923"] = "<strong>Pharaoh:</strong> the official title borne by the Egyptian kings down to the time when that country was conquered by the Greeks. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001137');\">EGYPT</a>.) The name is a compound, as some think, of the words Ra, the \"sun\" or \"sun-god,\" and the article phe, \"the,\" prefixed; hence phera, \"the sun,\" or \"the sun-god.\" But others, perhaps more correctly, think the name derived from Perao, \"the great house\" = his majesty = in Turkish, \"the Sublime Porte.\"<br><br>(1.) The Pharaoh who was on the throne when Abram went down into Egypt (<a href=\"#\" onClick=\"return mV('Gen',12,'10-20');\">Gen 12:10-20</a>) was probably one of the Hyksos, or \"shepherd kings.\" The Egyptians called the nomad tribes of Syria Shasu, \"plunderers,\" their king or chief Hyk, and hence the name of those invaders who conquered the native kings and established a strong government, with Zoan or Tanis as their capital. They were of Semitic origin, and of kindred blood accordingly with Abram. They were probably driven forward by the pressure of the Hittites. The name they bear on the monuments is \"Mentiu.\"<br><br>(2.) The Pharaoh of Joseph's days (<a href=\"#\" onClick=\"return mV('Gen',41,'1-')\">Gen 41</a>) was probably Apopi, or Apopis, the last of the Hyksos kings. To the old native Egyptians, who were an African race, shepherds were \"an abomination;\" but to the Hyksos kings these Asiatic shepherds who now appeared with Jacob at their head were congenial, and being akin to their own race, had a warm welcome (<a href=\"#\" onClick=\"return mV('Gen',47,5,6);\">Gen 47:5-6</a>). Some argue that Joseph came to Egypt in the reign of Thothmes III., long after the expulsion of the Hyksos, and that his influence is to be seen in the rise and progress of the religious revolution in the direction of monotheism which characterized the middle of the Eighteenth Dynasty. The wife of Amenophis III., of that dynasty, was a Semite. Is this singular fact to be explained from the presence of some of Joseph's kindred at the Egyptian court? Pharaoh said to Joseph, \"Thy father and thy brethren are come unto thee: the land of Egypt is before thee; in the best of the land make thy father and brethren to dwell\" (<a href=\"#\" onClick=\"return mV('Gen',47,5,6);\">Gen 47:5-6</a>).<br><br>(3.) The \"new king who knew not Joseph\" (<a href=\"#\" onClick=\"return mV('Exd',1,'8-22');\">Exd 1:8-22</a>) has been generally supposed to have been Aahmes I., or Amosis, as he is called by Josephus. Recent discoveries, however, have led to the conclusion that Seti was the \"new king.\"<br><br>For about seventy years the Hebrews in Egypt were under the powerful protection of Joseph. After his death their condition was probably very slowly and gradually changed. The invaders, the Hyksos, who for some five centuries had been masters of Egypt, were driven out, and the old dynasty restored. The Israelites now began to be looked down upon. They began to be afflicted and tyrannized over. In process of time a change appears to have taken place in the government of Egypt. A new dynasty, the Nineteenth, as it is called, came into power under Seti I., who was its founder. He associated with him in his government his son, Rameses II., when he was yet young, probably ten or twelve years of age.<br><br>Note, Professor Maspero, keeper of the museum of Bulak, near Cairo, had his attention in 1870 directed to the fact that scarabs, i.e., stone and metal imitations of the beetle (symbols of immortality), originally worn as amulets by royal personages, which were evidently genuine relics of the time of the ancient Pharaohs, were being sold at Thebes and different places along the Nile. This led him to suspect that some hitherto undiscovered burial-place of the Pharaohs had been opened, and that these and other relics, now secretly sold, were a part of the treasure found there. For a long time he failed, with all his ingenuity, to find the source of these rare treasures. At length one of those in the secret volunteered to give information regarding this burial-place. The result was that a party was conducted in 1881 to Dier el-Bahari, near Thebes, when the wonderful discovery was made of thirty-six mummies of kings, queens, princes, and high priests hidden away in a cavern prepared for them, where they had lain undisturbed for thirty centuries. \"The temple of Deir el-Bahari stands in the middle of a natural amphitheatre of cliffs, which is only one of a number of smaller amphitheatres into which the limestone mountains of the tombs are broken up. In the wall of rock separating this basin from the one next to it some ancient Egyptian engineers had constructed the hiding-place, whose secret had been kept for nearly three thousand years.\" The exploring party being guided to the place, found behind a great rock a shaft 6 feet square and about 40 feet deep, sunk into the limestone. At the bottom of this a passage led westward for 25 feet, and then turned sharply northward into the very heart of the mountain, where in a chamber 23 feet by 13, and 6 feet in height, they came upon the wonderful treasures of antiquity. The mummies were all carefully secured and brought down to Bulak, where they were deposited in the royal museum, which has now been removed to Ghizeh.<br><br>Among the most notable of the ancient kings of Egypt thus discovered were Thothmes III., Seti I., and Rameses II. Thothmes III. was the most distinguished monarch of the brilliant Eighteenth Dynasty. When this mummy was unwound \"once more, after an interval of thirty-six centuries, human eyes gazed on the features of the man who had conquered Syria and Cyprus and Ethiopia, and had raised Egypt to the highest pinnacle of her power. The spectacle, however, was of brief duration. The remains proved to be in so fragile a state that there was only time to take a hasty photograph, and then the features crumbled to pieces and vanished like an apparition, and so passed away from human view for ever.\" \"It seems strange that though the body of this man,\" who overran Palestine with his armies two hundred years before the birth of Moses, \"mouldered to dust, the flowers with which it had been wreathed were so wonderfully preserved that even their colour could be distinguished\" (Manning's Land of the Pharaohs).<br><br>Seti I. (his throne name Merenptah), the father of Rameses II., was a great and successful warrior, also a great builder. The mummy of this Pharaoh, when unrolled, brought to view \"the most beautiful mummy head ever seen within the walls of the museum. The sculptors of Thebes and Abydos did not flatter this Pharaoh when they gave him that delicate, sweet, and smiling profile which is the admiration of travellers. After a lapse of thirty-two centuries, the mummy retains the same expression which characterized the features of the living man. Most remarkable of all, when compared with the mummy of Rameses II., is the striking resemblance between the father and the son. Seti I. is, as it were, the idealized type of Rameses II. He must have died at an advanced age. The head is shaven, the eyebrows are white, the condition of the body points to considerably more than threescore years of life, thus confirming the opinions of the learned, who have attributed a long reign to this king.\"<br><br>(4.) Rameses II., the son of Seti I., is probably the Pharaoh of the Oppression. During his forty years' residence at the court of Egypt, Moses must have known this ruler well. During his sojourn in Midian, however, Rameses died, after a reign of sixty-seven years, and his body embalmed and laid in the royal sepulchre in the Valley of the Tombs of Kings beside that of his father. Like the other mummies found hidden in the cave of Deir el-Bahari, it had been for some reason removed from its original tomb, and probably carried from place to place till finally deposited in the cave where it was so recently discovered.<br><br>In 1886, the mummy of this king, the \"great Rameses,\" the \"Sesostris\" of the Greeks, was unwound, and showed the body of what must have been a robust old man. The features revealed to view are thus described by Maspero: \"The head is long and small in proportion to the body. The top of the skull is quite bare. On the temple there are a few sparse hairs, but at the poll the hair is quite thick, forming smooth, straight locks about two inches in length. White at the time of death, they have been dyed a light yellow by the spices used in embalmment. The forehead is low and narrow; the brow-ridge prominent; the eye-brows are thick and white; the eyes are small and close together; the nose is long, thin, arched like the noses of the Bourbons; the temples are sunk; the cheek-bones very prominent; the ears round, standing far out from the head, and pierced, like those of a woman, for the wearing of earrings; the jaw-bone is massive and strong; the chin very prominent; the mouth small, but thick-lipped; the teeth worn and very brittle, but white and well preserved. The moustache and beard are thin. They seem to have been kept shaven during life, but were probably allowed to grow during the king's last illness, or they may have grown after death. The hairs are white, like those of the head and eyebrows, but are harsh and bristly, and a tenth of an inch in length. The skin is of an earthy-brown, streaked with black. Finally, it may be said, the face of the mummy gives a fair idea of the face of the living king. The expression is unintellectual, perhaps slightly animal; but even under the somewhat grotesque disguise of mummification there is plainly to be seen an air of sovereign majesty, of resolve, and of pride.\"<br><br>Both on his father's and his mother's side it has been pretty clearly shown that Rameses had Chaldean or Mesopotamian blood in his veins to such a degree that he might be called an Assyrian. This fact is thought to throw light on <a href=\"#\" onClick=\"return mV('Isa',52,4);\">Isa 52:4</a>.<br><br>(5.) The Pharaoh of the Exodus was probably Menephtah I., the fourteenth and eldest surviving son of Rameses II. He resided at Zoan, where he had the various interviews with Moses and Aaron recorded in the book of Exodus. His mummy was not among those found at Deir el-Bahari. It is still a question, however, whether Seti II. or his father Menephtah was the Pharaoh of the Exodus. Some think the balance of evidence to be in favour of the former, whose reign it is known began peacefully, but came to a sudden and disastrous end. The \"Harris papyrus,\" found at Medinet-Abou in Upper Egypt in 1856, a state document written by Rameses III., the second king of the Twentieth Dynasty, gives at length an account of a great exodus from Egypt, followed by wide-spread confusion and anarchy. This, there is great reason to believe, was the Hebrew exodus, with which the Nineteenth Dynasty of the Pharaohs came to an end. This period of anarchy was brought to a close by Setnekht, the founder of the Twentieth Dynasty.<br><br>\"In the spring of 1896, Professor Flinders Petrie discovered, among the ruins of the temple of Menephtah at Thebes, a large granite stela, on which is engraved a hymn of victory commemorating the defeat of Libyan invaders who had overrun the Delta. At the end other victories of Menephtah are glanced at, and it is said that 'the Israelites (I-s-y-r-a-e-l-u) are minished (?) so that they have no seed.' Menephtah was son and successor of Rameses II., the builder of Pithom, and Egyptian scholars have long seen in him the Pharaoh of the Exodus. The Exodus is also placed in his reign by the Egyptian legend of the event preserved by the historian Manetho. In the inscription the name of the Israelites has no determinative of 'country' or 'district' attached to it, as is the case with all the other names (Canaan, Ashkelon, Gezer, Khar or Southern Palestine, etc.) mentioned along with it, and it would therefore appear that at the time the hymn was composed, the Israelites had already been lost to the sight of the Egyptians in the desert. At all events they must have had as yet no fixed home or district of their own. We may therefore see in the reference to them the Pharaoh's version of the Exodus, the disasters which befell the Egyptians being naturally passed over in silence, and only the destruction of the 'men children' of the Israelites being recorded. The statement of the Egyptian poet is a remarkable parallel to <a href=\"#\" onClick=\"return mV('Exd',1,'10-22');\">Exd 1:10-22</a>.\"<br><br>(6.) The Pharaoh of <a href=\"#\" onClick=\"return mV('1Ki',11,'18-22');\">1Ki 11:18-22</a>.<br><br>(7.) So, king of Egypt (<a href=\"#\" onClick=\"return mV('2Ki',17,4);\">2Ki 17:4</a>).<br><br>(8.) The Pharaoh of <a href=\"#\" onClick=\"return mV('1Ch',4,18);\">1Ch 4:18</a>.<br><br>(9.) Pharaoh, whose daughter Solomon married (<a href=\"#\" onClick=\"return mV('1Ki',3,1);\">1Ki 3:1</a>; <a href=\"#\" onClick=\"return mV('1Ki',7,8);\">7:8</a>).<br><br>(10.) Pharaoh, in whom Hezekiah put his trust in his war against Sennacherib (<a href=\"#\" onClick=\"return mV('2Ki',18,21);\">2Ki 18:21</a>).<br><br>(11.) The Pharaoh by whom Josiah was defeated and slain at Megiddo (<a href=\"#\" onClick=\"return mV('2Ch',35,'20-24');\">2Ch 35:20-24</a>; <a href=\"#\" onClick=\"return mV('2Ki',23,29,30);\">2Ki 23:29-30</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002688');\">NECHO</a>.)<br><br>(12.) Pharaoh-hophra, who in vain sought to relieve Jerusalem when it was besieged by Nebuchadnezzar (q.v.), <a href=\"#\" onClick=\"return mV('2Ki',25,'1-4');\">2Ki 25:1-4</a>; comp. <a href=\"#\" onClick=\"return mV('Jer',37,'5-8');\">Jer 37:5-8</a>; <a href=\"#\" onClick=\"return mV('Eze',17,'11-13');\">Eze 17:11-13</a>. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003894');\">ZEDEKIAH</a>.)";
eastonArray["$$T0002924"] = "<strong>Pharaoh's daughters:</strong> Three princesses are thus mentioned in Scripture:<br><br>(1.) The princess who adopted the infant Moses (q.v.), <a href=\"#\" onClick=\"return mV('Exd',2,10);\">Exd 2:10</a>. She is twice mentioned in the New Testament (<a href=\"#\" onClick=\"return mV('Act',7,21);\">Act 7:21</a>: <a href=\"#\" onClick=\"return mV('Hbr',11,24);\">Heb 11:24</a>). It would seem that she was alive and in some position of influence about the court when Moses was compelled to flee from Egypt, and thus for forty years he had in some way been under her influence. She was in all probability the sister of Rameses, and the daughter of Seti I. Josephus calls her Thermuthis. It is supposed by some that she was Nefert-ari, the wife as well as sister of Rameses. The mummy of this queen was among the treasures found at Deir-el-Bahari.<br><br>(2.) \"Bithiah the daughter of Pharaoh, which Mered took (<a href=\"#\" onClick=\"return mV('1Ch',4,18);\">1Ch 4:18</a>).<br><br>(3.) The wife of Solomon (<a href=\"#\" onClick=\"return mV('1Ki',3,1);\">1Ki 3:1</a>). This is the first reference since the Exodus to any connection of Israel with Egypt.";
eastonArray["$$T0002925"] = "<strong>Pharez:</strong> breach, the elder of the twin sons of Judah (<a href=\"#\" onClick=\"return mV('Gen',38,29);\">Gen 38:29</a>). From him the royal line of David sprang (<a href=\"#\" onClick=\"return mV('Rth',4,'18-22');\">Rth 4:18-22</a>). \"The chief of all the captains of the host\" was of the children of Perez (<a href=\"#\" onClick=\"return mV('1Ch',27,3);\">1Ch 27:3</a>; <a href=\"#\" onClick=\"return mV('Mat',1,3);\">Mat 1:3</a>).";
eastonArray["$$T0002926"] = "<strong>Pharisees:</strong> separatists (Heb. persahin, from parash, \"to separate\"). They were probably the successors of the Assideans (i.e., the \"pious\"), a party that originated in the time of Antiochus Epiphanes in revolt against his heathenizing policy. The first mention of them is in a description by Josephus of the three sects or schools into which the Jews were divided (B.C. 145). The other two sects were the Essenes and the Sadducees. In the time of our Lord they were the popular party (<a href=\"#\" onClick=\"return mV('Jhn',7,48);\">Jhn 7:48</a>). They were extremely accurate and minute in all matters appertaining to the law of Moses (<a href=\"#\" onClick=\"return mV('Mat',9,14);\">Mat 9:14</a>; <a href=\"#\" onClick=\"return mV('Mat',23,15);\">23:15</a>; <a href=\"#\" onClick=\"return mV('Luk',11,39);\">Luk 11:39</a>; <a href=\"#\" onClick=\"return mV('Luk',18,12);\">18:12</a>). Paul, when brought before the council of Jerusalem, professed himself a Pharisee (<a href=\"#\" onClick=\"return mV('Act',23,'6-8');\">Act 23:6-8</a>; <a href=\"#\" onClick=\"return mV('Act',26,4,5);\">26:4-5</a>).<br><br>There was much that was sound in their creed, yet their system of religion was a form and nothing more. Theirs was a very lax morality (<a href=\"#\" onClick=\"return mV('Mat',5,20);\">Mat 5:20</a>; <a href=\"#\" onClick=\"return mV('Mat',15,4,8);\">15:4, 8</a>; <a href=\"#\" onClick=\"return mV('Mat',23,3,14,23,25);\">23:3, 14, 23, 25</a>; <a href=\"#\" onClick=\"return mV('Jhn',8,7);\">Jhn 8:7</a>). On the first notice of them in the New Testament (<a href=\"#\" onClick=\"return mV('Mat',3,7);\">Mat 3:7</a>), they are ranked by our Lord with the Sadducees as a \"generation of vipers.\" They were noted for their self-righteousness and their pride (<a href=\"#\" onClick=\"return mV('Mat',9,11);\">Mat 9:11</a>; <a href=\"#\" onClick=\"return mV('Luk',7,39);\">Luk 7:39</a>; <a href=\"#\" onClick=\"return mV('Luk',18,11,12);\">18:11-12</a>). They were frequently rebuked by our Lord (<a href=\"#\" onClick=\"return mV('Mat',12,39);\">Mat 12:39</a>; <a href=\"#\" onClick=\"return mV('Mat',16,'1-4');\">16:1-4</a>).<br><br>From the very beginning of his ministry the Pharisees showed themselves bitter and persistent enemies of our Lord. They could not bear his doctrines, and they sought by every means to destroy his influence among the people.";
eastonArray["$$T0002927"] = "<strong>Pharpar:</strong> swift, one of the rivers of Damascus (<a href=\"#\" onClick=\"return mV('2Ki',5,12);\">2Ki 5:12</a>). It has been identified with the 'Awaj, \"a small lively river.\" The whole of the district watered by the 'Awaj is called the Wady el-'Ajam, i.e., \"the valley of the Persians\", so called for some unknown reason. This river empties itself into the lake or marsh Bahret Hijaneh, on the east of Damascus. One of its branches bears the modern name of Wady Barbar, which is probably a corruption of Pharpar.";
eastonArray["$$T0002928"] = "<strong>Phebe:</strong> a \"deaconess of the church at Cenchrea,\" the port of Corinth. She was probably the bearer of Paul's epistle to the Romans. Paul commended her to the Christians at Rome; \"for she hath been,\" says he, \"a succourer of many, and of myself also\" (<a href=\"#\" onClick=\"return mV('Rom',16,1,2);\">Rom 16:1-2</a>).";
eastonArray["$$T0002929"] = "<strong>Phenice:</strong> properly Phoenix a palm-tree (as in the R.V.), a town with a harbour on the southern side of Crete (<a href=\"#\" onClick=\"return mV('Act',27,12);\">Act 27:12</a>), west of the Fair Havens. It is now called Lutro.";
eastonArray["$$T0002930"] = "<strong>Phenicia:</strong> (<a href=\"#\" onClick=\"return mV('Act',21,2);\">Act 21:2</a>) = Phenice (<a href=\"#\" onClick=\"return mV('Act',11,19);\">11:19</a>; <a href=\"#\" onClick=\"return mV('Act',15,3);\">15:3</a>; R.V., Phoenicia), Gr. phoinix, \"a palm\", the land of palm-trees; a strip of land of an average breadth of about 20 miles along the shores of the Mediterranean, from the river Eleutherus in the north to the promotory of Carmel in the south, about 120 miles in length. This name is not found in the Old Testament, and in the New Testament it is mentioned only in the passages above referred to.<br><br>\"In the Egyptian inscriptions Phoenicia is called Keft, the inhabitants being Kefa; and since Keft-ur, or 'Greater Phoenicia,' was the name given to the delta of the Nile from the Phoenician colonies settled upon it, the Philistines who came from Caphtor or Keft-ur must have been of Phoenician origin\" (<a href=\"#\" onClick=\"return mV('Deu',2,23);\">Deu 2:23</a>; <a href=\"#\" onClick=\"return mV('Jer',47,4);\">Jer 47:4</a>; <a href=\"#\" onClick=\"return mV('Amo',9,7);\">Amo 9:7</a>). Sayce's Bible and the Monuments.<br><br>Phoenicia lay in the very centre of the old world, and was the natural entrepot for commerce with foreign nations. It was the \"England of antiquity.\" \"The trade routes from all Asia converged on the Phoenician coast; the centres of commerce on the Euphrates and Tigris forwarding their goods by way of Tyre to the Nile, to Arabia, and to the west; and, on the other hand, the productions of the vast regions bordering the Mediterranean passing through the Canaanite capital to the eastern world.\" It was \"situate at the entry of the sea, a merchant of the people for many isles\" (<a href=\"#\" onClick=\"return mV('Eze',27,3,4);\">Eze 27:3-4</a>). The far-reaching commercial activity of the Phoenicians, especially with Tarshish and the western world, enriched them with vast wealth, which introduced boundless luxury and developed among them a great activity in all manner of arts and manufactures. (See TYRE <a href=\"#\" onClick=\"return doDictLookup('ET0003737');\">T0003737</a>.)<br><br>The Phoenicians were the most enterprising merchants of the old world, establishing colonies at various places, of which Carthage was the chief. They were a Canaanite branch of the race of Ham, and are frequently called Sidonians, from their principal city of Sidon. None could \"skill to hew timber like unto the Sidonians\" (<a href=\"#\" onClick=\"return mV('1Ki',5,6);\">1Ki 5:6</a>). King Hiram rendered important service to Solomon in connection with the planning and building of the temple, casting for him all the vessels for the temple service, and the two pillars which stood in the front of the porch, and \"the molten sea\" (<a href=\"#\" onClick=\"return mV('1Ki',7,'21-23');\">1Ki 7:21-23</a>). Singular marks have been found by recent exploration on the great stones that form the substructure of the temple. These marks, both painted and engraved, have been regarded as made by the workmen in the quarries, and as probably intended to indicate the place of these stones in the building. \"The Biblical account (<a href=\"#\" onClick=\"return mV('1Ki',5,17,18);\">1Ki 5:17-18</a>) is accurately descriptive of the massive masonry now existing at the south-eastern angle (of the temple area), and standing on the native rock 80 feet below the present surface. The Royal Engineers found, buried deeply among the rubbish of many centuries, great stones, costly and hewed stones, forming the foundation of the sanctuary wall; while Phoenician fragments of pottery and Phoenician marks painted on the massive blocks seem to proclaim that the stones were prepared in the quarry by the cunning workmen of Hiram, the king of Tyre.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0003610');\">TEMPLE</a>.)<br><br>The Phoenicians have been usually regarded as the inventors of alphabetic writing. The Egyptians expressed their thoughts by certain symbols, called \"hieroglyphics\", i.e., sacred carvings, so styled because used almost exclusively on sacred subjects. The recent discovery, however, of inscriptions in Southern Arabia (Yemen and Hadramaut), known as Hemyaritic, in connection with various philogical considerations, has led some to the conclusion that the Phoenician alphabet was derived from the Mineans (<a href=\"#\" onClick=\"return mV('Jdg',10,12);\">Jdg 10:12</a>; <a href=\"#\" onClick=\"return mV('2Ch',26,7);\">2Ch 26:7</a>). Thus the Phoenician alphabet ceases to be the mother alphabet. Sayce thinks \"it is more than possible that the Egyptians themselves were emigrants from Southern Arabia.\" (See <a href=\"#\" onClick=\"return doDictLookup('ET0002586');\">MOABITE STONE</a>.)<br><br>\"The Phoenicians were renowned in ancient times for the manufacture of glass, and some of the specimens of this work that have been preserved are still the wonder of mankind...In the matter of shipping, whether ship-building be thought of or traffic upon the sea, the Phoenicians surpassed all other nations.\" \"The name Phoenicia is of uncertain origin, though it may be derived from Fenkhu, the name given in the Egyptian inscriptions to the natives of Palestine. Among the chief Phoenician cities were Tyre and Sidon, Gebal north of Beirut, Arvad or Arados and Zemar.\"";
eastonArray["$$T0002931"] = "<strong>Phicol:</strong> great, the chief captain of the army of Abimelech, the Philistine king of Gerar. He entered into an alliance with Abraham with reference to a certain well which, from this circumstance, was called Beersheba (q.v.), \"the well of the oath\" (<a href=\"#\" onClick=\"return mV('Gen',21,22,32);\">Gen 21:22, 32</a>; <a href=\"#\" onClick=\"return mV('Gen',26,26);\">26:26</a>).";
eastonArray["$$T0002932"] = "<strong>Philadelphia:</strong> brotherly love, a city of Lydia in Asia Minor, about 25 miles south-east of Sardis. It was the seat of one of the \"seven churches\" (<a href=\"#\" onClick=\"return mV('Rev',3,'7-12');\">Rev 3:7-12</a>). It came into the possession of the Turks in A.D. 1392. It has several times been nearly destroyed by earthquakes. It is still a town of considerable size, called Allahshehr, \"the city of God.\"";
eastonArray["$$T0002933"] = "<strong>Philemon:</strong> an inhabitant of Colosse, and apparently a person of some note among the citizens (<a href=\"#\" onClick=\"return mV('Col',4,9);\">Col 4:9</a>; <a href=\"#\" onClick=\"return mV('Phm',1,2);\">Phm 1:2</a>). He was brought to a knowledge of the gospel through the instrumentality of Paul (<a href=\"#\" onClick=\"return mV('Phm',1,19);\">Phm 1:19</a>), and held a prominent place in the Christian community for his piety and beneficence (<a href=\"#\" onClick=\"return mV('Phm',1,'4-7');\">Phm 1:4-7</a>). He is called in the epistle a \"fellow-labourer,\" and therefore probably held some office in the church at Colosse; at all events, the title denotes that he took part in the work of spreading a knowledge of the gospel.";
eastonArray["$$T0002934"] = "<strong>Philemon, Epistle to:</strong> was written from Rome at the same time as the epistles to the Colossians and Ephesians, and was sent also by Onesimus. It was addressed to Philemon and the members of his family.<br><br>It was written for the purpose of interceding for Onesimus (q.v.), who had deserted his master Philemon and been \"unprofitable\" to him. Paul had found Onesimus at Rome, and had there been instrumental in his conversion, and now he sends him back to his master with this letter.<br><br>This epistle has the character of a strictly private letter, and is the only one of such epistles preserved to us. \"It exhibits the apostle in a new light. He throws off as far as possible his apostolic dignity and his fatherly authority over his converts. He speaks simply as Christian to Christian. He speaks, therefore, with that peculiar grace of humility and courtesy which has, under the reign of Christianity, developed the spirit of chivalry and what is called 'the character of a gentleman,' certainly very little known in the old Greek and Roman civilization\" (Dr. Barry). (See <a href=\"#\" onClick=\"return doDictLookup('ET0003458');\">SLAVE</a>.)";
eastonArray["$$T0002935"] = "<strong>Philetus:</strong> amiable, with Hymenaeus, at Ephesus, said that the \"resurrection was past already\" (<a href=\"#\" onClick=\"return mV('2Ti',2,17,18);\">2Ti 2:17-18</a>). This was a Gnostic heresy held by the Nicolaitanes. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000168');\">ALEXANDER [4]</a>.)";
eastonArray["$$T0002936"] = "<strong>Philip:</strong> lover of horses.<br><br>(1.) One of the twelve apostles; a native of Bethsaida, \"the city of Andrew and Peter\" (<a href=\"#\" onClick=\"return mV('Jhn',1,44);\">Jhn 1:44</a>). He readily responded to the call of Jesus when first addressed to him (<a href=\"#\" onClick=\"return mV('Jhn',1,43);\">Jhn 1:43</a>), and forthwith brought Nathanael also to Jesus (<a href=\"#\" onClick=\"return mV('Jhn',1,45,46);\">Jhn 1:45-46</a>). He seems to have held a prominent place among the apostles (<a href=\"#\" onClick=\"return mV('Mat',10,3);\">Mat 10:3</a>; <a href=\"#\" onClick=\"return mV('Mar',3,18);\">Mar 3:18</a>; <a href=\"#\" onClick=\"return mV('Jhn',6,'5-7');\">Jhn 6:5-7</a>; <a href=\"#\" onClick=\"return mV('Jhn',12,21,22);\">12:21-22</a>; <a href=\"#\" onClick=\"return mV('Jhn',14,8,9);\">14:8-9</a>; <a href=\"#\" onClick=\"return mV('Act',1,13);\">Act 1:13</a>). Of his later life nothing is certainly known. He is said to have preached in Phrygia, and to have met his death at Hierapolis.<br><br>(2.) One of the \"seven\" (<a href=\"#\" onClick=\"return mV('Act',6,5);\">Act 6:5</a>), called also \"the evangelist\" (<a href=\"#\" onClick=\"return mV('Act',21,8,9);\">21:8-9</a>). He was one of those who were \"scattered abroad\" by the persecution that arose on the death of Stephen. He went first to Samaria, where he laboured as an evangelist with much success (<a href=\"#\" onClick=\"return mV('Act',8,'5-13');\">8:5-13</a>). While he was there he received a divine command to proceed toward the south, along the road leading from Jerusalem to Gaza. These towns were connected by two roads. The one Philip was directed to take was that which led through Hebron, and thence through a district little inhabited, and hence called \"desert.\" As he travelled along this road he was overtaken by a chariot in which sat a man of Ethiopia, the eunuch or chief officer of Queen Candace, who was at that moment reading, probably from the Septuagint version, a portion of the prophecies of Isaiah (<a href=\"#\" onClick=\"return mV('Isa',53,6,7);\">Isa 53:6-7</a>). Philip entered into conversation with him, and expounded these verses, preaching to him the glad tidings of the Saviour. The eunuch received the message and believed, and was forthwith baptized, and then \"went on his way rejoicing.\" Philip was instantly caught away by the Spirit after the baptism, and the eunuch saw him no more. He was next found at Azotus, whence he went forth in his evangelistic work till he came to Caesarea. He is not mentioned again for about twenty years, when he is still found at Caesarea (<a href=\"#\" onClick=\"return mV('Act',21,8);\">Act 21:8</a>) when Paul and his companions were on the way to Jerusalem. He then finally disappears from the page of history.<br><br>(3.) Mentioned only in connection with the imprisonment of John the Baptist (<a href=\"#\" onClick=\"return mV('Mat',14,3);\">Mat 14:3</a>; <a href=\"#\" onClick=\"return mV('Mar',6,17);\">Mar 6:17</a>; <a href=\"#\" onClick=\"return mV('Luk',3,19);\">Luk 3:19</a>). He was the son of Herod the Great, and the first husband of Herodias, and the father of Salome. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001763');\">HEROD PHILIP I.</a>)<br><br>(4.) The \"tetrarch of Ituraea\" (<a href=\"#\" onClick=\"return mV('Luk',3,1);\">Luk 3:1</a>); a son of Herod the Great, and brother of Herod Antipas. The city of Caesarea-Philippi was named partly after him (<a href=\"#\" onClick=\"return mV('Mat',16,13);\">Mat 16:13</a>; <a href=\"#\" onClick=\"return mV('Mar',8,27);\">Mar 8:27</a>). (See  <a href=\"#\" onClick=\"return doDictLookup('ET0001764');\">HEROD PHILIP II.</a>)";
eastonArray["$$T0002937"] = "<strong>Philippi:</strong><br><br>(1.) Formerly Crenides, \"the fountain,\" the capital of the province of Macedonia. It stood near the head of the Sea, about 8 miles north-west of Kavalla. It is now a ruined village, called Philibedjik. Philip of Macedonia fortified the old Thracian town of Crenides, and called it after his own name Philippi (B.C. 359-336). In the time of the Emperor Augustus this city became a Roman colony, i.e., a military settlement of Roman soldiers, there planted for the purpose of controlling the district recently conquered. It was a \"miniature Rome,\" under the municipal law of Rome, and governed by military officers, called duumviri, who were appointed directly from Rome. Having been providentially guided thither, here Paul and his companion Silas preached the gospel and formed the first church in Europe. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002339');\">LYDIA</a>.) This success stirred up the enmity of the people, and they were \"shamefully entreated\" (<a href=\"#\" onClick=\"return mV('Act',16,'9-40');\">Act 16:9-40</a>; <a href=\"#\" onClick=\"return mV('1Th',2,2);\">1Th 2:2</a>). Paul and Silas at length left this city and proceeded to Amphipolis (q.v.).<br><br>(2.) When Philip the tetrarch, the son of Herod, succeeded to the government of the northern portion of his kingdom, he enlarged the city of Paneas, and called it Caesarea, in honour of the emperor. But in order to distinguish it from the Caesarea on the sea coast, he added to it subsequently his own name, and called it Caesarea-Philippi (q.v.).";
eastonArray["$$T0002938"] = "<strong>Philippians, Epistle to:</strong> was written by Paul during the two years when he was \"in bonds\" in Rome (<a href=\"#\" onClick=\"return mV('Phl',1,'7-13');\">Phl 1:7-13</a>), probably early in the year A.D. 62 or in the end of 61.<br><br>The Philippians had sent Epaphroditus, their messenger, with contributions to meet the necessities of the apostle; and on his return Paul sent back with him this letter. With this precious communication Epaphroditus sets out on his homeward journey. \"The joy caused by his return, and the effect of this wonderful letter when first read in the church of Philippi, are hidden from us. And we may almost say that with this letter the church itself passes from our view. To-day, in silent meadows, quiet cattle browse among the ruins which mark the site of what was once the flourishing Roman colony of Philippi, the home of the most attractive church of the apostolic age. But the name and fame and spiritual influence of that church will never pass. To myriads of men and women in every age and nation the letter written in a dungeon at Rome, and carried along the Egnatian Way by an obscure Christian messenger, has been a light divine and a cheerful guide along the most rugged paths of life\" (Professor Beet).<br><br>The church at Philippi was the first-fruits of European Christianity. Their attachment to the apostle was very fervent, and so also was his affection for them. They alone of all the churches helped him by their contributions, which he gratefully acknowledges (<a href=\"#\" onClick=\"return mV('Act',20,'33-35');\">Act 20:33-35</a>; <a href=\"#\" onClick=\"return mV('2Cr',11,'7-12');\">2Cr 11:7-12</a>; <a href=\"#\" onClick=\"return mV('2Th',3,8);\">2Th 3:8</a>). The pecuniary liberality of the Philippians comes out very conspicuously (<a href=\"#\" onClick=\"return mV('Phl',4,15);\">Phl 4:15</a>). \"This was a characteristic of the Macedonian missions, as <a href=\"#\" onClick=\"return mV('2Cr',8,'1-');\">2 Cor. 8</a> and <a href=\"#\" onClick=\"return mV('2Cr',9,'1-');\">9</a> amply and beautifully prove. It is remarkable that the Macedonian converts were, as a class, very poor (<a href=\"#\" onClick=\"return mV('2Cr',8,2);\">2Cr 8:2</a>); and the parallel facts, their poverty and their open-handed support of the great missionary and his work, are deeply harmonious. At the present day the missionary liberality of poor Christians is, in proportion, really greater than that of the rich\" (Moule's Philippians, Introd.).<br><br>The contents of this epistle give an interesting insight into the condition of the church at Rome at the time it was written. Paul's imprisonment, we are informed, was no hindrance to his preaching the gospel, but rather \"turned out to the furtherance of the gospel.\" The gospel spread very extensively among the Roman soldiers, with whom he was in constant contact, and the Christians grew into a \"vast multitude.\" It is plain that Christianity was at this time making rapid advancement in Rome.<br><br>The doctrinal statements of this epistle bear a close relation to those of the Epistle to the Romans. Compare also <a href=\"#\" onClick=\"return mV('Phl',3,20);\">Phl 3:20</a> with <a href=\"#\" onClick=\"return mV('Eph',2,12,19);\">Eph 2:12, 19</a>, where the church is presented under the idea of a city or commonwealth for the first time in Paul's writings. The personal glory of Christ is also set forth in almost parallel forms of expression in <a href=\"#\" onClick=\"return mV('Phl',2,'5-11');\">Phl 2:5-11</a>, compared with (<a href=\"#\" onClick=\"return mV('Eph',1,'17-23');\">Eph 1:17-23</a>; <a href=\"#\" onClick=\"return mV('Eph',2,8);\">2:8</a>; and <a href=\"#\" onClick=\"return mV('Col',1,'15-20');\">Col 1:15-20</a>). \"This exposition of the grace and wonder of His personal majesty, personal self-abasement, and personal exaltation after it,\" found in these epistles, \"is, in a great measure, a new development in the revelations given through St. Paul\" (Moule). Other minuter analogies in forms of expression and of thought are also found in these epistles of the Captivity.";
eastonArray["$$T0002939"] = "<strong>Philistia:</strong> =Palestine (q.v.), \"the land of the Philistines\" (<a href=\"#\" onClick=\"return mV('Psa',60,8);\">Psa 60:8</a>; <a href=\"#\" onClick=\"return mV('Psa',87,4);\">87:4</a>; <a href=\"#\" onClick=\"return mV('Psa',108,9);\">108:9</a>). The word is supposed to mean \"the land of wanderers\" or \"of strangers.\"";
eastonArray["$$T0002940"] = "<strong>Philistines:</strong> (<a href=\"#\" onClick=\"return mV('Gen',10,14);\">Gen 10:14</a>, R.V.; but in A.V., \"Philistim\"), a tribe allied to the Phoenicians. They were a branch of the primitive race which spread over the whole district of the Lebanon and the valley of the Jordan, and Crete and other Mediterranean islands. Some suppose them to have been a branch of the Rephaim (<a href=\"#\" onClick=\"return mV('2Sa',21,'16-22');\">2Sa 21:16-22</a>). In the time of Abraham they inhabited the south-west of Judea, Abimelech of Gerar being their king (<a href=\"#\" onClick=\"return mV('Gen',21,32,34);\">Gen 21:32, 34</a>; <a href=\"#\" onClick=\"return mV('Gen',26,1);\">26:1</a>). They are, however, not noticed among the Canaanitish tribes mentioned in the Pentateuch. They are spoken of by Amos (<a href=\"#\" onClick=\"return mV('Amo',9,7);\">Amo 9:7</a>) and Jeremiah (<a href=\"#\" onClick=\"return mV('Jer',47,4);\">Jer 47:4</a>) as from Caphtor, i.e., probably Crete, or, as some think, the Delta of Egypt. In the whole record from Exodus to Samuel they are represented as inhabiting the tract of country which lay between Judea and Egypt (<a href=\"#\" onClick=\"return mV('Exd',13,17);\">Exd 13:17</a>; <a href=\"#\" onClick=\"return mV('Exd',15,14,15);\">15:14-15</a>; <a href=\"#\" onClick=\"return mV('Jos',13,3);\">Jos 13:3</a>; <a href=\"#\" onClick=\"return mV('1Sa',4,'1-')\">1Sa 4</a>).<br><br>This powerful tribe made frequent incursions against the Hebrews. There was almost perpetual war between them. They sometimes held the tribes, especially the southern tribes, in degrading servitude (<a href=\"#\" onClick=\"return mV('Jdg',15,11);\">Jdg 15:11</a>; <a href=\"#\" onClick=\"return mV('1Sa',13,'19-22');\">1Sa 13:19-22</a>); at other times they were defeated with great slaughter (<a href=\"#\" onClick=\"return mV('1Sa',14,'1-47');\">1Sa 14:1-47</a>; <a href=\"#\" onClick=\"return mV('1Sa',17,'1-');\">17</a>). These hostilities did not cease till the time of Hezekiah (<a href=\"#\" onClick=\"return mV('2Ki',18,8);\">2Ki 18:8</a>), when they were entirely subdued. They still, however, occupied their territory, and always showed their old hatred to Israel (<a href=\"#\" onClick=\"return mV('Eze',25,'15-17');\">Eze 25:15-17</a>). They were finally conquered by the Romans.<br><br>The Philistines are called Pulsata or Pulista on the Egyptian monuments; the land of the Philistines (Philistia) being termed Palastu and Pilista in the Assyrian inscriptions. They occupied the five cities of Gaza, Ashkelon, Ashdod, Ekron, and Gath, in the south-western corner of Canaan, which belonged to Egypt up to the closing days of the Nineteenth Dynasty. The occupation took place during the reign of Rameses III. of the Twentieth Dynasty. The Philistines had formed part of the great naval confederacy which attacked Egypt, but were eventually repulsed by that Pharaoh, who, however, could not dislodge them from their settlements in Palestine. As they did not enter Palestine till the time of the Exodus, the use of the name Philistines in <a href=\"#\" onClick=\"return mV('Gen',26,1);\">Gen 26:1</a> must be proleptic. Indeed the country was properly Gerar, as in ch. <a href=\"#\" onClick=\"return mV('Gen',20,'1-');\">20</a>.<br><br>They are called Allophyli, \"foreigners,\" in the Septuagint, and in the Books of Samuel they are spoken of as uncircumcised. It would therefore appear that they were not of the Semitic race, though after their establishment in Canaan they adopted the Semitic language of the country. We learn from the Old Testament that they came from Caphtor, usually supposed to be Crete. From Philistia the name of the land of the Philistines came to be extended to the whole of \"Palestine.\" Many scholars identify the Philistines with the Pelethites of <a href=\"#\" onClick=\"return mV('2Sa',8,18);\">2Sa 8:18</a>.";
eastonArray["$$T0002941"] = "<strong>Phinehas:</strong> mouth of brass, or from old Egypt, the negro.<br><br>(1.) Son of Eleazar, the high priest (<a href=\"#\" onClick=\"return mV('Exd',6,25);\">Exd 6:25</a>). While yet a youth he distinguished himself at Shittim by his zeal against the immorality into which the Moabites had tempted the people (<a href=\"#\" onClick=\"return mV('Num',25,'1-9');\">Num 25:1-9</a>), and thus \"stayed the plague\" that had broken out among the people, and by which twenty-four thousand of them perished. For his faithfulness on that occasion he received the divine approbation (<a href=\"#\" onClick=\"return mV('Num',25,'10-13');\">10-13</a>). He afterwards commanded the army that went out against the Midianites (<a href=\"#\" onClick=\"return mV('Num',31,'6-8');\">31:6-8</a>). When representatives of the people were sent to expostulate with the two and a half tribes who, just after crossing Jordan, built an altar and departed without giving any explanation, Phinehas was their leader, and addressed them in the words recorded in <a href=\"#\" onClick=\"return mV('Jos',22,'16-20');\">Jos 22:16-20</a>. Their explanation follows. This great altar was intended to be all ages only a witness that they still formed a part of Israel. Phinehas was afterwards the chief adviser in the war with the Benjamites. He is commemorated in <a href=\"#\" onClick=\"return mV('Psa',106,30,31);\">Psa 106:30-31</a>. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001125');\">ED</a>.)<br><br>(2.) One of the sons of Eli, the high priest (<a href=\"#\" onClick=\"return mV('1Sa',1,3);\">1Sa 1:3</a>; <a href=\"#\" onClick=\"return mV('1Sa',2,12);\">2:12</a>). He and his brother Hophni were guilty of great crimes, for which destruction came on the house of Eli (<a href=\"#\" onClick=\"return mV('1Sa',2,31);\">31</a>). He died in battle with the Philistines (<a href=\"#\" onClick=\"return mV('1Sa',4,4,11);\">1Sa 4:4, 11</a>); and his wife, on hearing of his death, gave birth to a son, whom she called \"Ichabod,\" and then she died (<a href=\"#\" onClick=\"return mV('1Sa',4,'19-22');\">19-22</a>).";
eastonArray["$$T0002942"] = "<strong>Phlegon:</strong> burning, a Roman Christian to whom Paul sent salutations (<a href=\"#\" onClick=\"return mV('Rom',16,14);\">Rom 16:14</a>).";
eastonArray["$$T0002943"] = "<strong>Phoenicia:</strong> (<a href=\"#\" onClick=\"return mV('Act',21,2);\">Act 21:2</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0002930');\">PHENICIA</a>.)";
eastonArray["$$T0002944"] = "<strong>Phrygia:</strong> dry, an irregular and ill-defined district in Asia Minor. It was divided into two parts, the Greater Phrygia on the south, and the Lesser Phrygia on the west. It is the Greater Phrygia that is spoken of in the New Testament. The towns of Antioch in Pisidia (<a href=\"#\" onClick=\"return mV('Act',13,14);\">Act 13:14</a>), Colosse, Hierapolis, Iconium, and Laodicea were situated in it.";
eastonArray["$$T0002945"] = "<strong>Phut:</strong> Phut is placed between Egypt and Canaan in <a href=\"#\" onClick=\"return mV('Gen',10,6);\">Gen 10:6</a>, and elsewhere we find the people of Phut described as mercenaries in the armies of Egypt and Tyre (<a href=\"#\" onClick=\"return mV('Jer',46,9);\">Jer 46:9</a>; <a href=\"#\" onClick=\"return mV('Eze',30,5);\">Eze 30:5</a>; <a href=\"#\" onClick=\"return mV('Eze',27,10);\">27:10</a>). In a fragment of the annuals of Nebuchadrezzar which records his invasion of Egypt, reference is made to \"Phut of the Ionians.\"";
eastonArray["$$T0002946"] = "<strong>Phygellus:</strong> fugitive, a Christian of Asia, who \"turned away\" from Paul during his second imprisonment at Rome (<a href=\"#\" onClick=\"return mV('2Ti',1,15);\">2Ti 1:15</a>). Nothing more is known of him.";
eastonArray["$$T0002947"] = "<strong>Phylacteries:</strong> (Gr. phulakteria; i.e., \"defences\" or \"protections\"), called by modern Jews tephillin (i.e., \"prayers\") are mentioned only in <a href=\"#\" onClick=\"return mV('Mat',23,5);\">Mat 23:5</a>. They consisted of strips of parchment on which were inscribed these four texts: <br><br>(1.) <a href=\"#\" onClick=\"return mV('Exd',13,'1-10');\">Exd 13:1-10</a>;<br><br>(2.) <a href=\"#\" onClick=\"return mV('Exd',13,'11-16');\">11-16</a>;<br><br>(3.) <a href=\"#\" onClick=\"return mV('Deu',6,'4-9');\">Deu 6:4-9</a>;<br><br>(4.) <a href=\"#\" onClick=\"return mV('Deu',11,'18-21');\">11:18-21</a>,<br><br>and which were enclosed in a square leather case, on one side of which was inscribed the Hebrew letter shin, to which the rabbis attached some significance. This case was fastened by certain straps to the forehead just between the eyes. The \"making broad the phylacteries\" refers to the enlarging of the case so as to make it conspicuous. (See <a href=\"#\" onClick=\"return doDictLookup('ET0001386');\">FRONTLETS</a>.)<br><br>Another form of the phylactery consisted of two rolls of parchment, on which the same texts were written, enclosed in a case of black calfskin. This was worn on the left arm near the elbow, to which it was bound by a thong. It was called the \"Tephillah on the arm.\"";
eastonArray["$$T0002948"] = "<strong>Physician:</strong> Asa, afflicted with some bodily malady, \"sought not to the Lord but to the physicians\" (<a href=\"#\" onClick=\"return mV('2Ch',16,12);\">2Ch 16:12</a>). The \"physicians\" were those who \"practised heathen arts of magic, disavowing recognized methods of cure, and dissociating the healing art from dependence on the God of Israel. The sin of Asa was not, therefore, in seeking medical advice, as we understand the phrase, but in forgetting Jehovah.\"";
eastonArray["$$T0002949"] = "<strong>Pi-beseth:</strong> (<a href=\"#\" onClick=\"return mV('Eze',30,17);\">Eze 30:17</a>), supposed to mean. \"a cat,\" or a deity in the form of a cat, worshipped by the Egyptians. It was called by the Greeks Bubastis. The hieroglyphic name is \"Pe-bast\", i.e., the house of Bast, the Artemis of the Egyptians. The town of Bubasts was situated on the Pelusian branch, i.e., the easternmost branch, of the Delta. It was the seat of one of the chief annual festivals of the Egyptians. Its ruins bear the modern name of Tel-Basta.";
