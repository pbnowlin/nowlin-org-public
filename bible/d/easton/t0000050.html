<script> var eastonArray = new Array ();
 eastonArray["$$T0000050"] = "<b>Abjects:</b> (<a href=\"#\" onClick=\"return mV('Psa',35,15);\">Psa 35:15</a>), the translation of a Hebrew word meaning smiters; probably, in allusion to the tongue, slanderers. (<a href=\"#\" onClick=\"return mV('Jer',18,18);\">Jer 18:18</a>.)";
 eastonArray["$$T0000051"] = "<b>Ablution:</b> or washing, was practised,<br><br>(1.) When a person was initiated into a higher state: e.g., when Aaron and his sons were set apart to the priest's office, they were washed with water previous to their investiture with the priestly robes (<a href=\"#\" onClick=\"return mV('Lev',8,6);\">Lev 8:6</a>).<br><br>(2.) Before the priests approached the altar of God, they were required, on pain of death, to wash their hands and their feet to cleanse them from the soil of common life (<a href=\"#\" onClick=\"return mV('Exd',30,'17-21');\">Exd 30:17-21</a>). To this practice the Psalmist alludes, <a href=\"#\" onClick=\"return mV('Psa',26,6);\">Psa 26:6</a>.<br><br>(3.) There were washings prescribed for the purpose of cleansing from positive defilement contracted by particular acts. Of such washings eleven different species are prescribed in the Levitical law (<a href=\"#\" onClick=\"return mV('Lev',12,'1-');\">Lev 12-15</a>).<br><br>(4.) A fourth class of ablutions is mentioned, by which a person purified or absolved himself from the guilt of some particular act. For example, the elders of the nearest village where some murder was committed were required, when the murderer was unknown, to wash their hands over the expiatory heifer which was beheaded, and in doing so to say, \"Our hands have not shed this blood, neither have our eyes seen it\" (<a href=\"#\" onClick=\"return mV('Deu',21,'1-9');\">Deu 21:1-9</a>). So also Pilate declared himself innocent of the blood of Jesus by washing his hands (<a href=\"#\" onClick=\"return mV('Mat',27,24);\">Mat 27:24</a>). This act of Pilate may not, however, have been borrowed from the custom of the Jews. The same practice was common among the Greeks and Romans.<br><br>The Pharisees carried the practice of ablution to great excess, thereby claiming extraordinary purity (<a href=\"#\" onClick=\"return mV('Mat',23,25);\">Mat 23:25</a>). Mark (<a href=\"#\" onClick=\"return mV('Mar',7,'1-5');\">Mar 7:1-5</a>) refers to the ceremonial ablutions. The Pharisees washed their hands \"oft,\" more correctly, \"with the fist\" (R.V., \"diligently\"), or as an old father, Theophylact, explains it, \"up to the elbow.\" (Compare also <a href=\"#\" onClick=\"return mV('Mar',7,4);\">Mar 7:4</a>; <a href=\"#\" onClick=\"return mV('Lev',6,28);\">Lev 6:28</a>; <a href=\"#\" onClick=\"return mV('Lev',11,'32-36');\">11:32-36</a>; <a href=\"#\" onClick=\"return mV('Lev',15,22);\">15:22</a>) (See <a href=\"#\" onClick=\"return doDictLookup('ET0003788');\">WASHING</a>.)";
 eastonArray["$$T0000052"] = "<b>Abner:</b> father of light; i.e., \"enlightening\", the son of Ner and uncle of Saul. He was commander-in-chief of Saul's army (<a href=\"#\" onClick=\"return mV('1Sa',14,50);\">1Sa 14:50</a>; <a href=\"#\" onClick=\"return mV('1Sa',17,55);\">17:55</a>; <a href=\"#\" onClick=\"return mV('1Sa',20,25);\">20:25</a>). He first introduced David to the court of Saul after the victory over Goliath (<a href=\"#\" onClick=\"return mV('1Sa',17,57);\">1Sa 17:57</a>). After the death of Saul, David was made king over Judah, and reigned in Hebron. Among the other tribes there was a feeling of hostility to Judah; and Abner, at the head of Ephraim, fostered this hostility in the interest of the house of Saul, whose son Ish-bosheth he caused to be proclaimed king (<a href=\"#\" onClick=\"return mV('2Sa',2,8);\">2Sa 2:8</a>). A state of war existed between these two kings. A battle fatal to Abner, who was the leader of Ish-boseth's army, was fought with David's army under Joab at Gibeon (<a href=\"#\" onClick=\"return mV('2Sa',2,12);\">2Sa 2:12</a>). Abner, escaping from the field, was overtaken by Asahel, who was \"light of foot as a wild roe,\" the brother of Joab and Abishai, whom he thrust through with a back stroke of his spear (<a href=\"#\" onClick=\"return mV('2Sa',2,'18-32');\">2Sa 2:18-32</a>).<br><br>Being rebuked by Ish-bosheth for the impropriety of taking to wife Rizpah, who had been a concubine of King Saul, he found an excuse for going over to the side of David, whom he now professed to regard as anointed by the Lord to reign over all Israel. David received him favourably, and promised that he would have command of the armies. At this time Joab was absent from Hebron, but on his return he found what had happened. Abner had just left the city; but Joab by a stratagem recalled him, and meeting him at the gate of the city on his return, thrust him through with his sword (<a href=\"#\" onClick=\"return mV('2Sa',3,27,'31-39');\">2Sa 3:27, 31-39</a>; <a href=\"#\" onClick=\"return mV('1Ki',2,5,32);\">1Ki 2:5, 32</a>). David lamented in pathetic words the death of Abner, \"Know ye not that there is a prince and a great man fallen this day in Israel?\" (<a href=\"#\" onClick=\"return mV('2Sa',3,'33-38');\">2Sa 3:33-38</a>.)";
 eastonArray["$$T0000053"] = "<b>Abomination:</b> This word is used,<br><br>(1.) To express the idea that the Egyptians considered themselves as defiled when they ate with strangers (<a href=\"#\" onClick=\"return mV('Gen',43,32);\">Gen 43:32</a>). The Jews subsequently followed the same practice, holding it unlawful to eat or drink with foreigners (<a href=\"#\" onClick=\"return mV('Jhn',18,28);\">Jhn 18:28</a>; <a href=\"#\" onClick=\"return mV('Act',10,28);\">Act 10:28</a>; <a href=\"#\" onClick=\"return mV('Act',11,3);\">11:3</a>).<br><br>(2.) Every shepherd was \"an abomination\" unto the Egyptians (<a href=\"#\" onClick=\"return mV('Gen',46,34);\">Gen 46:34</a>). This aversion to shepherds, such as the Hebrews, arose probably from the fact that Lower and Middle Egypt had formerly been held in oppressive subjection by a tribe of nomad shepherds (the Hyksos), who had only recently been expelled, and partly also perhaps from this other fact that the Egyptians detested the lawless habits of these wandering shepherds.<br><br>(3.) Pharaoh was so moved by the fourth plague, that while he refused the demand of Moses, he offered a compromise, granting to the Israelites permission to hold their festival and offer their sacrifices in Egypt. This permission could not be accepted, because Moses said they would have to sacrifice \"the abomination of the Egyptians\" (<a href=\"#\" onClick=\"return mV('Exd',8,26);\">Exd 8:26</a>); i.e., the cow or ox, which all the Egyptians held as sacred, and which they regarded it as sacrilegious to kill.<br><br>(4.) Daniel (<a href=\"#\" onClick=\"return mV('Dan',11,31);\">Dan 11:31</a>), in that section of his prophecies which is generally interpreted as referring to the fearful calamities that were to fall on the Jews in the time of Antiochus Epiphanes, says, \"And they shall place the abomination that maketh desolate.\" Antiochus Epiphanes caused an altar to be erected on the altar of burnt-offering, on which sacrifices were offered to Jupiter Olympus. (1 Macc. 1:57). This was the abomination of the desolation of Jerusalem. The same language is employed in <a href=\"#\" onClick=\"return mV('Dan',9,27);\">Dan 9:27</a> (<a href=\"#\" onClick=\"return mV('Mat',24,15);\">Mat 24:15</a>), where the reference is probably to the image-crowned standards which the Romans set up at the east gate of the temple (A.D. 70), and to which they paid idolatrous honours. \"Almost the entire religion of the Roman camp consisted in worshipping the ensign, swearing by the ensign, and in preferring the ensign before all other gods.\" These ensigns were an \"abomination\" to the Jews, the \"abomination of desolation.\"<br><br>This word is also used symbolically of sin in general (<a href=\"#\" onClick=\"return mV('Isa',66,3);\">Isa 66:3</a>); an idol (<a href=\"#\" onClick=\"return mV('Isa',44,19);\">44:19</a>); the ceremonies of the apostate Church of Rome (<a href=\"#\" onClick=\"return mV('Rev',17,4);\">Rev 17:4</a>); a detestable act (<a href=\"#\" onClick=\"return mV('Eze',22,11);\">Eze 22:11</a>).";
 eastonArray["$$T0000054"] = "<b>Abraham:</b> father of a multitude, son of Terah, named (<a href=\"#\" onClick=\"return mV('Gen',11,27);\">Gen 11:27</a>) before his older brothers Nahor and Haran, because he was the heir of the promises. Till the age of seventy, Abram sojourned among his kindred in his native country of Chaldea. He then, with his father and his family and household, quitted the city of Ur, in which he had hitherto dwelt, and went some 300 miles north to Haran, where he abode fifteen years. The cause of his migration was a call from God (<a href=\"#\" onClick=\"return mV('Act',7,'2-4');\">Act 7:2-4</a>). There is no mention of this first call in the Old Testament; it is implied, however, in <a href=\"#\" onClick=\"return mV('Gen',12,'1-');\">Gen 12</a>. While they tarried at Haran, Terah died at the age of 205 years. Abram now received a second and more definite call, accompanied by a promise from God (<a href=\"#\" onClick=\"return mV('Gen',12,1,2);\">Gen 12:1-2</a>); whereupon he took his departure, taking his nephew Lot with him, \"not knowing whither he went\" (<a href=\"#\" onClick=\"return mV('Hbr',11,8);\">Hbr 11:8</a>). He trusted implicitly to the guidance of Him who had called him.<br><br>Abram now, with a large household of probably a thousand souls, entered on a migratory life, and dwelt in tents. Passing along the valley of the Jabbok, in the land of Canaan, he formed his first encampment at Sichem (<a href=\"#\" onClick=\"return mV('Gen',12,6);\">Gen 12:6</a>), in the vale or oak-grove of Moreh, between Ebal on the north and Gerizim on the south. Here he received the great promise, \"I will make of thee a great nation,\" etc. (<a href=\"#\" onClick=\"return mV('Gen',12,2,3,7);\">Gen 12:2, 3, 7</a>). This promise comprehended not only temporal but also spiritual blessings. It implied that he was the chosen ancestor of the great Deliverer whose coming had been long ago predicted (<a href=\"#\" onClick=\"return mV('Gen',3,15);\">Gen 3:15</a>). Soon after this, for some reason not mentioned, he removed his tent to the mountain district between Bethel, then called Luz, and Ai, towns about two miles apart, where he built an altar to \"Jehovah.\" He again moved into the southern tract of Palestine, called by the Hebrews the Negeb; and was at length, on account of a famine, compelled to go down into Egypt. This took place in the time of the Hyksos, a Semitic race which now held the Egyptians in bondage. Here occurred that case of deception on the part of Abram which exposed him to the rebuke of Pharaoh (<a href=\"#\" onClick=\"return mV('Gen',12,18);\">Gen 12:18</a>). Sarai was restored to him; and Pharaoh loaded him with presents, recommending him to withdraw from the country. He returned to Canaan richer than when he left it, \"in cattle, in silver, and in gold\" (<a href=\"#\" onClick=\"return mV('Gen',12,8);\">Gen 12:8</a>; <a href=\"#\" onClick=\"return mV('Psa',105,13,14);\">Psa 105:13-14</a>). The whole party then moved northward, and returned to their previous station near Bethel. Here disputes arose between Lot's shepherds and those of Abram about water and pasturage. Abram generously gave Lot his choice of the pasture-ground. (<a href=\"#\" onClick=\"return mV('1Cr',6,7);\">1Cr 6:7</a>.) He chose the well-watered plain in which Sodom was situated, and removed thither; and thus the uncle and nephew were separated. Immediately after this Abram was cheered by a repetition of the promises already made to him, and then removed to the plain or \"oak-grove\" of Mamre, which is in Hebron. He finally settled here, pitching his tent under a famous oak or terebinth tree, called \"the oak of Mamre\" (<a href=\"#\" onClick=\"return mV('Gen',13,18);\">Gen 13:18</a>). This was his third resting-place in the land.<br><br>Some fourteen years before this, while Abram was still in Chaldea, Palestine had been invaded by Chedorlaomer, King of Elam, who brought under tribute to him the five cities in the plain to which Lot had removed. This tribute was felt by the inhabitants of these cities to be a heavy burden, and after twelve years they revolted. This brought upon them the vengeance of Chedorlaomer, who had in league with him four other kings. He ravaged the whole country, plundering the towns, and carrying the inhabitants away as slaves. Among those thus treated was Lot. Hearing of the disaster that had fallen on his nephew, Abram immediately gathered from his own household a band of 318 armed men, and being joined by the Amoritish chiefs Mamre, Aner, and Eshcol, he pursued after Chedorlaomer, and overtook him near the springs of the Jordan. They attacked and routed his army, and pursued it over the range of Anti-Libanus as far as to Hobah, near Damascus, and then returned, bringing back all the spoils that had been carried away. Returning by way of Salem, i.e., Jerusalem, the king of that place, Melchizedek, came forth to meet them with refreshments. To him Abram presented a tenth of the spoils, in recognition of his character as a priest of the most high God (<a href=\"#\" onClick=\"return mV('Gen',14,'18-20');\">Gen 14:18-20</a>).<br><br>In a recently discovered tablet, dated in the reign of the grandfather of Amraphel (<a href=\"#\" onClick=\"return mV('Gen',14,1);\">Gen 14:1</a>), one of the witnesses is called \"the Amorite, the son of Abiramu,\" or Abram.<br><br>Having returned to his home at Mamre, the promises already made to him by God were repeated and enlarged (<a href=\"#\" onClick=\"return mV('Gen',13,14);\">Gen 13:14</a>). \"The word of the Lord\" (an expression occurring here for the first time) \"came to him\" (<a href=\"#\" onClick=\"return mV('Gen',15,1);\">15:1</a>). He now understood better the future that lay before the nation that was to spring from him. Sarai, now seventy-five years old, in her impatience, persuaded Abram to take Hagar, her Egyptian maid, as a concubine, intending that whatever child might be born should be reckoned as her own. Ishmael was accordingly thus brought up, and was regarded as the heir of these promises (time) \"came to him\" (<a href=\"#\" onClick=\"return mV('Gen',15,1);\">15:1</a>). He now understood better the future <a href=\"#\" onClick=\"return mV('Gen',16,'1-')\">Gen 16</a>). When Ishmael was thirteen years old, God again revealed yet more explicitly and fully his gracious purpose; and in token of the sure fulfilment of that purpose the patriarch's name was now changed from Abram to Abraham (<a href=\"#\" onClick=\"return mV('Gen',17,4,5);\">Gen 17:4-5</a>), and the rite of circumcision was instituted as a sign of the covenant. It was then announced that the heir to these covenant promises would be the son of Sarai, though she was now ninety years old; and it was directed that his name should be Isaac. At the same time, in commemoration of the promises, Sarai's name was changed to Sarah. On that memorable day of God's thus revealing his design, Abraham and his son Ishmael and all the males of his house were circumcised (<a href=\"#\" onClick=\"return mV('Gen',17,1)\">Gen 17</a>). Three months after this, as Abraham sat in his tent door, he saw three men approaching. They accepted his proffered hospitality, and, seated under an oak-tree, partook of the fare which Abraham and Sarah provided. One of the three visitants was none other than the Lord, and the other two were angels in the guise of men. The Lord renewed on this occasion his promise of a son by Sarah, who was rebuked for her unbelief. Abraham accompanied the three as they proceeded on their journey. The two angels went on toward Sodom; while the Lord tarried behind and talked with Abraham, making known to him the destruction that was about to fall on that guilty city. The patriarch interceded earnestly in behalf of the doomed city. But as not even ten righteous persons were found in it, for whose sake the city would have been spared, the threatened destruction fell upon it; and early next morning Abraham saw the smoke of the fire that consumed it as the \"smoke of a furnace\" (<a href=\"#\" onClick=\"return mV('Gen',19,'1-28');\">Gen 19:1-28</a>).<br><br>After fifteen years' residence at Mamre, Abraham moved southward, and pitched his tent among the Philistines, near to Gerar. Here occurred that sad instance of prevarication on his part in his relation to Abimelech the King (See <a href=\"#\" onClick=\"return doDictLookup('ET0000040');\">ABIMELECH</a>.) Soon after this event, the patriarch left <a href=\"#\" onClick=\"return mV('Gen',20,'1-')\">Gen 20</a>). (See ABIMELECH <a href=\"#\" onClick=\"return doDictLookup('ET0000040');\">T0000040</a>.) Soon after this event, the patriarch left the vicinity of Gerar, and moved down the fertile valley about 25 miles to Beer-sheba. It was probably here that Isaac was born, Abraham being now an hundred years old. A feeling of jealousy now arose between Sarah and Hagar, whose son, Ishmael, was no longer to be regarded as Abraham's heir. Sarah insisted that both Hagar and her son should be sent away. This was done, although it was a hard trial to Abraham (<a href=\"#\" onClick=\"return mV('Gen',21,12);\">Gen 21:12</a>). (See HAGAR <a href=\"#\" onClick=\"return doDictLookup('ET0001583');\">T0001583</a>; ISHMAEL <a href=\"#\" onClick=\"return doDictLookup('ET0001903');\">T0001903</a>.)<br><br>At this point there is a blank in the patriarch's history of perhaps twenty-five years. These years of peace and happiness were spent at Beer-sheba. The next time we see him his faith is put to a severe test by the command that suddenly came to him to go and offer up Isaac, the heir of all the promises, as a sacrifice on one of the mountains of Moriah. His faith stood the test (<a href=\"#\" onClick=\"return mV('Hbr',11,'17-19');\">Hbr 11:17-19</a>). He proceeded in a spirit of unhesitating obedience to carry out the command; and when about to slay his son, whom he had laid on the altar, his uplifted hand was arrested by the angel of Jehovah, and a ram, which was entangled in a thicket near at hand, was seized and offered in his stead. From this circumstance that place was called Jehovah-jireh, i.e., \"The Lord will provide.\" The promises made to Abraham were again confirmed (and this was the last recorded word of God to the patriarch); and he descended the mount with his son, and returned to his home at Beer-sheba (<a href=\"#\" onClick=\"return mV('Gen',22,19);\">Gen 22:19</a>), where he resided for some years, and then moved northward to Hebron.<br><br>Some years after this Sarah died at Hebron, being 127 years old. Abraham acquired now the needful possession of a burying-place, the cave of Machpelah, by purchase from the owner of it, Ephron the Hittite (<a href=\"#\" onClick=\"return mV('Gen',23,'1-')\">Gen 23</a>); and there he buried Sarah. His next care was to provide a wife for Isaac, and for this purpose he sent his steward, Eliezer, to Haran (<a href=\"#\" onClick=\"return mV('Act',7,2);\">Act 7:2</a>), where his brother Nahor and his family resided (<a href=\"#\" onClick=\"return mV('Gen',11,31);\">Gen 11:31</a>). The result was that Rebekah, the daughter of Nahor's son Bethuel, became the wife of Isaac (<a href=\"#\" onClick=\"return mV('Gen',24,'1-')\">Gen 24</a>). Abraham then himself took to wife Keturah, who became the mother of six sons, whose descendants were afterwards known as the \"children of the east\" (<a href=\"#\" onClick=\"return mV('Jdg',6,3);\">Jdg 6:3</a>), and later as \"Saracens.\" At length all his wanderings came to an end. At the age of 175 years, 100 years after he had first entered the land of Canaan, he died, and was buried in the old family burying-place at Machpelah (<a href=\"#\" onClick=\"return mV('Gen',25,'7-10');\">Gen 25:7-10</a>).<br><br>The history of Abraham made a wide and deep impression on the ancient world, and references to it are interwoven in the religious traditions of almost all Eastern nations. He is called \"the friend of God\" (<a href=\"#\" onClick=\"return mV('Jam',2,23);\">Jam 2:23</a>), \"faithful Abraham\" (<a href=\"#\" onClick=\"return mV('Gal',3,9);\">Gal 3:9</a>), \"the father of us all\" (<a href=\"#\" onClick=\"return mV('Rom',4,16);\">Rom 4:16</a>).";
 eastonArray["$$T0000055"] = "<b>Abraham's bosom:</b> (<a href=\"#\" onClick=\"return mV('Luk',16,22,23);\">Luk 16:22-23</a>) refers to the custom of reclining on couches at table, which was prevalent among the Jews, an arrangement which brought the head of one person almost into the bosom of the one who sat or reclined above him. To \"be in Abraham's bosom\" thus meant to enjoy happiness and rest (<a href=\"#\" onClick=\"return mV('Mat',8,11);\">Mat 8:11</a>; <a href=\"#\" onClick=\"return mV('Luk',16,23);\">Luk 16:23</a>) at the banquet in Paradise. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000434');\">BANQUET</a>; <a href=\"#\" onClick=\"return doDictLookup('ET0002451');\">MEALS</a>.)";
 eastonArray["$$T0000056"] = "<b>Abram:</b> exalted father. (See <a href=\"#\" onClick=\"return doDictLookup('ET0000054');\">ABRAHAM</a>.)";
 eastonArray["$$T0000057"] = "<b>Abronah:</b> R.V., one of Israel's halting-places in the desert (<a href=\"#\" onClick=\"return mV('Num',33,34,35);\">Num 33:34-35</a>), just before Ezion-gaber. In A.V., \"Ebronah.\"";
 eastonArray["$$T0000058"] = "<b>Absalom:</b> father of peace; i.e., \"peaceful\" David's son by Maacah (<a href=\"#\" onClick=\"return mV('2Sa',3,3);\">2Sa 3:3</a>; <a href=\"#\" onClick=\"return mV('1Ki',1,6);\">1Ki 1:6</a>). He was noted for his personal beauty and for the extra-ordinary profusion of the hair of his head (<a href=\"#\" onClick=\"return mV('2Sa',14,25,26);\">2Sa 14:25-26</a>). The first public act of his life was the blood-revenge he executed against Amnon, David's eldest son, who had basely wronged Absalom's sister Tamar. This revenge was executed at the time of the festivities connected with a great sheep-shearing at Baal-hazor. David's other sons fled from the place in horror, and brought the tidings of the death of Amnon to Jerusalem. Alarmed for the consequences of the act, Absalom fled to his grandfather at Geshur, and there abode for three years (<a href=\"#\" onClick=\"return mV('2Sa',3,3);\">2Sa 3:3</a>; <a href=\"#\" onClick=\"return mV('2Sa',13,'23-38');\">13:23-38</a>).<br><br>David mourned his absent son, now branded with the guilt of fratricide. As the result of a stratagem carried out by a woman of Tekoah, Joab received David's sanction to invite Absalom back to Jerusalem. He returned accordingly, but two years elapsed before his father admitted him into his presence (<a href=\"#\" onClick=\"return mV('2Sa',14,28);\">2Sa 14:28</a>). Absalom was now probably the oldest surviving son of David, and as he was of royal descent by his mother as well as by his father, he began to aspire to the throne. His pretensions were favoured by the people. By many arts he gained their affection; and after his return from Geshur (<a href=\"#\" onClick=\"return mV('2Sa',15,7);\">2Sa 15:7</a>; marg., R.V.) he went up to Hebron, the old capital of Judah, along with a great body of the people, and there proclaimed himself king. The revolt was so successful that David found it necessary to quit Jerusalem and flee to Mahanaim, beyond Jordan; where upon Absalom returned to Jerusalem and took possession of the throne without opposition. Ahithophel, who had been David's chief counsellor, deserted him and joined Absalom, whose chief counsellor he now became. Hushai also joined Absalom, but only for the purpose of trying to counteract the counsels of Ahithophel, and so to advantage David's cause. He was so far successful that by his advice, which was preferred to that of Ahithophel, Absalom delayed to march an army against his father, who thus gained time to prepare for the defence.<br><br>Absalom at length marched out against his father, whose army, under the command of Joab, he encountered on the borders of the forest of Ephraim. Twenty thousand of Absalom's army were slain in that fatal battle, and the rest fled. Absalom fled on a swift mule; but his long flowing hair, or more probably his head, was caught in the bough of an oak, and there he was left suspended till Joab came up and pierced him through with three darts. His body was then taken down and cast into a pit dug in the forest, and a heap of stones was raised over his grave. When the tidings of the result of that battle were brought to David, as he sat impatiently at the gate of Mahanaim, and he was told that Absalom had been slain, he gave way to the bitter lamentation: \"O my son Absalom, my son, my son Absalom! would God I had died for thee, O Absalom, my son, my son!\" (<a href=\"#\" onClick=\"return mV('2Sa',18,33);\">2Sa 18:33</a>. Comp. <a href=\"#\" onClick=\"return mV('Exd',32,32);\">Ex. 32:32</a>; <a href=\"#\" onClick=\"return mV('Rom',9,3);\">Rom 9:3</a>).<br><br>Absalom's three sons (<a href=\"#\" onClick=\"return mV('2Sa',14,27);\">2Sa 14:27</a>; <a href=\"#\" onClick=\"return mV('2Sa',18,18);\">2Sa 18:18</a>) had all died before him, so that he left only a daughter, Tamar, who became the grandmother of Abijah.";
 eastonArray["$$T0000059"] = "<b>Acacia:</b> (Heb. shittim) <a href=\"#\" onClick=\"return mV('Exd',25,5);\">Exd 25:5</a>, R.V. probably the <i>Acacia seyal</i> (the gum-arabic tree); called the \"shittah\" tree (<a href=\"#\" onClick=\"return mV('Isa',41,19);\">Isa 41:19</a>). Its wood is called shittim wood (<a href=\"#\" onClick=\"return mV('Exd',26,15,26);\">Exd 26:15, 26</a>; <a href=\"#\" onClick=\"return mV('Exd',25,10,13,23,28);\">25:10, 13, 23, 28</a>, etc.). This species (A. seyal) is like the hawthorn, a gnarled and thorny tree. It yields the gum-arabic of commerce. It is found in abundance in the Sinaitic peninsula.";
 eastonArray["$$T0000060"] = "<b>Accad:</b> the high land or mountains, a city in the land of Shinar. It has been identified with the mounds of Akker Kuf, some 50 miles to the north of Babylon; but this is doubtful. It was one of the cities of Nimrod's kingdom (<a href=\"#\" onClick=\"return mV('Gen',10,10);\">Gen 10:10</a>). It stood close to the Euphrates, opposite Sippara. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003277');\">SEPHARVAIM</a>.)<br><br>It is also the name of the country of which this city was the capital, namely, northern or upper Babylonia. The Accadians who came from the \"mountains of the east,\" where the ark rested, attained to a high degree of civilization. In the Babylonian inscriptions they are called \"the black heads\" and \"the black faces,\" in contrast to \"the white race\" of Semitic descent. They invented the form of writing in pictorial hieroglyphics, and also the cuneiform system, in which they wrote many books partly on papyrus and partly on clay. The Semitic Babylonians (\"the white race\"), or, as some scholars think, first the Cushites, and afterwards, as a second immigration, the Semites, invaded and conquered this country; and then the Accadian language ceased to be a spoken language, although for the sake of its literary treasures it continued to be studied by the educated classes of Babylonia. A large portion of the Ninevite tablets brought to light by Oriental research consists of interlinear or parallel translations from Accadian into Assyrian; and thus that long-forgotten language has been recovered by scholars. It belongs to the class of languages called agglutinative, common to the Tauranian race; i.e., it consists of words \"glued together,\" without declension of conjugation. These tablets in a remarkable manner illustrate ancient history. Among other notable records, they contain an account of the Creation which closely resembles that given in the book of Genesis, of the Sabbath as a day of rest, and of the Deluge and its cause. (See BABYLON <a href=\"#\" onClick=\"return doDictLookup('ET0000409');\">T0000409</a>; CHALDEA <a href=\"#\" onClick=\"return doDictLookup('ET0000758');\">T0000758</a>.)";
 eastonArray["$$T0000061"] = "<b>Accho:</b> sultry or sandy, a town and harbour of Phoenicia, in the tribe of Asher, but never acquired by them (<a href=\"#\" onClick=\"return mV('Jdg',1,31);\">Jdg 1:31</a>). It was known to the ancient Greeks and Romans by the name of Ptolemais, from Ptolemy the king of Egypt, who rebuilt it about B.C. 100. Here Paul landed on his last journey to Jerusalem (<a href=\"#\" onClick=\"return mV('Act',21,7);\">Act 21:7</a>). During the crusades of the Middle Ages it was called Acra; and subsequently, on account of its being occupied by the Knights Hospitallers of Jerusalem, it was called St. Jean d'Acre, or simply Acre.";
 eastonArray["$$T0000062"] = "<b>Accuser:</b> Satan is styled the \"accuser of the brethren\" (<a href=\"#\" onClick=\"return mV('Rev',12,10);\">Rev 12:10</a>. Comp. <a href=\"#\" onClick=\"return mV('Job',1,6);\">Job 1:6</a>; <a href=\"#\" onClick=\"return mV('Zec',3,1);\">Zec 3:1</a>), as seeking to uphold his influence among men by bringing false charges against Christians, with the view of weakening their influence and injuring the cause with which they are identified. He was regarded by the Jews as the accuser of men before God, laying to their charge the violations of the law of which they were guilty, and demanding their punishment. The same Greek word, rendered \"accuser,\" is found in <a href=\"#\" onClick=\"return mV('Jhn',8,10);\">Jhn 8:10</a> (but omitted in the Revised Version); <a href=\"#\" onClick=\"return mV('Act',23,30,35);\">Act 23:30, 35</a>; <a href=\"#\" onClick=\"return mV('Act',24,8);\">24:8</a>; <a href=\"#\" onClick=\"return mV('Act',25,16,18);\"25:16, 18</a>, in all of which places it is used of one who brings a charge against another.";
 eastonArray["$$T0000063"] = "<b>Aceldama:</b> the name which the Jews gave in their proper tongue, i.e., in Aramaic, to the field which was purchased with the money which had been given to the betrayer of our Lord. The word means \"field of blood.\" It was previously called \"the potter's field\" (<a href=\"#\" onClick=\"return mV('Mat',27,7,8);\">Mat 27:7-8</a>; <a href=\"#\" onClick=\"return mV('Act',1,19);\">Act 1:19</a>), and was appropriated as the burial-place for strangers. It lies on a narrow level terrace on the south face of the valley of Hinnom. Its modern name is Hak ed-damm.";
 eastonArray["$$T0000064"] = "<b>Achaia:</b> the name originally of a narrow strip of territory in Greece, on the north-west of the Peloponnesus. Subsequently it was applied by the Romans to the whole Peloponnesus, now called the Morea, and the south of Greece. It was then one of the two provinces (Macedonia being the other) into which they divided the country when it fell under their dominion. It is in this latter enlarged meaning that the name is always used in the New Testament (<a href=\"#\" onClick=\"return mV('Act',18,12,27);\">Act 18:12, 27</a>; <a href=\"#\" onClick=\"return mV('Act',19,21);\">19:21</a>; <a href=\"#\" onClick=\"return mV('Rom',15,26);\">Rom 15:26</a>; <a href=\"#\" onClick=\"return mV('Rom',16,5);\">16:5</a>, etc.). It was at the time when Luke wrote the Acts of the Apostles under the proconsular form of government; hence the appropriate title given to Gallio as the \"deputy,\" i.e., proconsul, of Achaia (<a href=\"#\" onClick=\"return mV('Act',18,12);\">Act 18:12</a>).";
 eastonArray["$$T0000065"] = "<b>Achaichus:</b> (<a href=\"#\" onClick=\"return mV('1Cr',16,17);\">1Cr 16:17</a>), one of the members of the church of Corinth who, with Fortunatus and Stephanas, visited Paul while he was at Ephesus, for the purpose of consulting him on the affairs of the church. These three probably were the bearers of the letter from Corinth to the apostle to which he alludes in <a href=\"#\" onClick=\"return mV('1Cr',7,1);\">1Cr 7:1</a>.";
 eastonArray["$$T0000066"] = "<b>Achan:</b> called also Achar, i.e., one who troubles (<a href=\"#\" onClick=\"return mV('1Ch',2,7);\">1Ch 2:7</a>), in commemoration of his crime, which brought upon him an awful destruction (<a href=\"#\" onClick=\"return mV('Jos',7,1);\">Jos 7:1</a>). On the occasion of the fall of Jericho, he seized, contrary to the divine command, an ingot of gold, a quantity of silver, and a costly Babylonish garment, which he hid in his tent. Joshua was convinced that the defeat which the Israelites afterwards sustained before Ai was a proof of the divine displeasure on account of some crime, and he at once adopted means by the use of the lot for discovering the criminal. It was then found that Achan was guilty, and he was stoned to death in the valley of Achor. He and all that belonged to him were then consumed by fire, and a heap of stones was raised over the ashes.";
 eastonArray["$$T0000067"] = "<b>Achbor:</b> gnawing = mouse.<br><br>(1.) An Edomitish king (<a href=\"#\" onClick=\"return mV('Gen',36,38);\">Gen 36:38</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,49);\">1Ch 1:49</a>).<br><br>(2.) One of Josiah's officers sent to the prophetess Huldah to inquire regarding the newly-discovered book of the law (<a href=\"#\" onClick=\"return mV('2Ki',22,12,14);\">2Ki 22:12, 14</a>). He is also called Abdon (<a href=\"#\" onClick=\"return mV('2Ch',34,20);\">2Ch 34:20</a>).";
 eastonArray["$$T0000068"] = "<b>Achish:</b> angry, perhaps only a general title of royalty applicable to the Philistine kings.<br><br>(1.) The king with whom David sought refuge when he fled from Saul (<a href=\"#\" onClick=\"return mV('1Sa',21,'10-15');\">1Sa 21:10-15</a>). He is called Abimelech in the superscription of <a href=\"#\" onClick=\"return mV('Psa',34,'1-');\">Psa 34</a>. It was probably this same king to whom David a second time repaired at the head of a band of 600 warriors, and who assigned him Ziklag, whence he carried on war against the surrounding tribes (<a href=\"#\" onClick=\"return mV('1Sa',27,'5-12');\">1Sa 27:5-12</a>). Achish had great confidence in the valour and fidelity of David (<a href=\"#\" onClick=\"return mV('1Sa',28,1,2);\">1Sa 28:1-2</a>), but at the instigation of his courtiers did not permit him to go up to battle along with the Philistine hosts (<a href=\"#\" onClick=\"return mV('1Sa',29,'2-11');\">1Sa 29:2-11</a>). David remained with Achish a year and four months.<br><br>(2.) Another king of Gath, probably grandson of the foregoing, to whom the two servants of Shimei fled. This led Shimei to go to Gath in pursuit of them, and the consequence was that Solomon put him to death (<a href=\"#\" onClick=\"return mV('1Ki',2,'39-46');\">1Ki 2:39-46</a>).";
 eastonArray["$$T0000069"] = "<b>Achmetha:</b> (<a href=\"#\" onClick=\"return mV('Ezr',6,2);\">Ezr 6:2</a>), called Ecbatana by classical writers, the capital of northern Media. Here was the palace which was the residence of the old Median monarchs, and of Cyrus and Cambyses. In the time of Ezra, the Persian kings resided usually at Susa of Babylon. But Cyrus held his court at Achmetha; and Ezra, writing a century after, correctly mentions the place where the decree of Cyrus was found.";
 eastonArray["$$T0000070"] = "<b>Achor:</b> trouble, a valley near Jericho, so called in consequence of the trouble which the sin of Achan caused Israel (<a href=\"#\" onClick=\"return mV('Jos',7,24,26);\">Jos 7:24, 26</a>). The expression \"valley of Achor\" probably became proverbial for that which caused trouble, and when Isaiah (<a href=\"#\" onClick=\"return mV('Isa',65,10);\">Isa 65:10</a>) refers to it he uses it in this sense: \"The valley of Achor, a place for herds to lie down in;\" i.e., that which had been a source of calamity would become a source of blessing. Hosea also (<a href=\"#\" onClick=\"return mV('Hsa',2,15);\">Hsa 2:15</a>) uses the expression in the same sense: \"The valley of Achor for a door of hope;\" i.e., trouble would be turned into joy, despair into hope. This valley has been identified with the Wady Kelt.";
 eastonArray["$$T0000071"] = "<b>Achsah:</b> anklet, Caleb's only daughter (<a href=\"#\" onClick=\"return mV('1Ch',2,49);\">1Ch 2:49</a>). She was offered in marriage to the man who would lead an attack on the city of Debir, or Kirjath-sepher. This was done by Othniel (q.v.), who accordingly obtained her as his wife (<a href=\"#\" onClick=\"return mV('Jos',15,'16-19');\">Jos 15:16-19</a>; <a href=\"#\" onClick=\"return mV('Jdg',1,'9-15');\">Jdg 1:9-15</a>).";
 eastonArray["$$T0000072"] = "<b>Achshaph:</b> fascination, a royal city of the Canaanites, in the north of Palestine (<a href=\"#\" onClick=\"return mV('Jos',11,1);\">Jos 11:1</a>; <a href=\"#\" onClick=\"return mV('Jos',12,20);\">12:20</a>; <a href=\"#\" onClick=\"return mV('Jos',19,25);\">19:25</a>). It was in the eastern boundary of the tribe of Asher, and is identified with the modern ruined village of Kesaf or Yasif, N.E. of Accho.";
 eastonArray["$$T0000073"] = "<b>Achzib:</b> falsehood.<br><br>(1.) A town in the Shephelah, or plain country of Judah (<a href=\"#\" onClick=\"return mV('Jos',15,44);\">Jos 15:44</a>); probably the same as Chezib of <a href=\"#\" onClick=\"return mV('Gen',38,5);\">Gen 38:5</a> = Ain Kezbeh.<br><br>(2.) A Phoenician city (the Gr. Ecdippa), always retained in their possession though assigned to the tribe of Asher (<a href=\"#\" onClick=\"return mV('Jos',19,29);\">Jos 19:29</a>; <a href=\"#\" onClick=\"return mV('Jdg',1,31);\">Jdg 1:31</a>). It is identified with the modern es-Zib, on the Mediterranean, about 8 miles north of Accho.";
 eastonArray["$$T0000074"] = "<b>Acre:</b> is the translation of a word (tse'med), which properly means a yoke, and denotes a space of ground that may be ploughed by a yoke of oxen in a day. It is about an acre of our measure (<a href=\"#\" onClick=\"return mV('Isa',5,10);\">Isa 5:10</a>; <a href=\"#\" onClick=\"return mV('1Sa',14,14);\">1Sa 14:14</a>).";
 eastonArray["$$T0000075"] = "<b>Acts of the Apostles:</b> the title now given to the fifth and last of the historical books of the New Testament. The author styles it a \"treatise\" (<a href=\"#\" onClick=\"return mV('Act',1,1);\">Act 1:1</a>). It was early called \"The Acts,\" \"The Gospel of the Holy Ghost,\" and \"The Gospel of the Resurrection.\" It contains properly no account of any of the apostles except Peter and Paul. John is noticed only three times; and all that is recorded of James, the son of Zebedee, is his execution by Herod. It is properly therefore not the history of the \"Acts of the Apostles,\" a title which was given to the book at a later date, but of \"Acts of Apostles,\" or more correctly, of \"Some Acts of Certain Apostles.\"<br><br>As regards its authorship, it was certainly the work of Luke, the \"beloved physician\" (<a href=\"#\" onClick=\"return mV('Luk',1,'1-4');\">Luk 1:1-4</a>; <a href=\"#\" onClick=\"return mV('Act',1,1);\">Act 1:1</a>). This is the uniform tradition of antiquity, although the writer nowhere makes mention of himself by name. The style and idiom of the Gospel of Luke and of the Acts, and the usage of words and phrases common to both, strengthen this opinion. The writer first appears in the narrative in <a href=\"#\" onClick=\"return mV('Act',16,11);\">Act 16:11</a>, and then disappears till Paul's return to Philippi two years afterwards, when he and Paul left that place together (<a href=\"#\" onClick=\"return mV('Act',20,6);\">Act 20:6</a>), and the two seem henceforth to have been constant companions to the end. He was certainly with Paul at Rome (<a href=\"#\" onClick=\"return mV('Col',4,14);\">Col 4:14</a>). Thus he wrote a great portion of that history from personal observation. For what lay beyond his own experience he had the instruction of Paul. If, as is very probable, 2 Timothy was written during Paul's second imprisonment at Rome, Luke was with him then as his faithful companion to the last (<a href=\"#\" onClick=\"return mV('2Ti',4,11);\">2Ti 4:11</a>). Of his subsequent history we have no certain information.<br><br>The design of Luke's Gospel was to give an exhibition of the character and work of Christ as seen in his history till he was taken up from his disciples into heaven; and of the Acts, as its sequel, to give an illustration of the power and working of the gospel when preached among all nations, \"beginning at Jerusalem.\" The opening sentences of the Acts are just an expansion and an explanation of the closing words of the Gospel. In this book we have just a continuation of the history of the church after Christ's ascension. Luke here carries on the history in the same spirit in which he had commenced it. It is only a book of beginnings, a history of the founding of churches, the initial steps in the formation of the Christian society in the different places visited by the apostles. It records a cycle of \"representative events.\"<br><br>All through the narrative we see the ever-present, all-controlling power of the ever-living Saviour. He worketh all and in all in spreading abroad his truth among men by his Spirit and through the instrumentality of his apostles.<br><br>The time of the writing of this history may be gathered from the fact that the narrative extends down to the close of the second year of Paul's first imprisonment at Rome. It could not therefore have been written earlier than A.D. 61 or 62, nor later than about the end of A.D. 63. Paul was probably put to death during his second imprisonment, about A.D. 64, or, as some think, 66.<br><br>The place where the book was written was probably Rome, to which Luke accompanied Paul.<br><br>The key to the contents of the book is in <a href=\"#\" onClick=\"return mV('Act',1,8);\">Act 1:8</a>, \"Ye shall be witnesses unto me both in Jerusalem, and in all Judea, and in Samaria, and unto the uttermost part of the earth.\" After referring to what had been recorded in a \"former treatise\" of the sayings and doings of Jesus Christ before his ascension, the author proceeds to give an account of the circumstances connected with that event, and then records the leading facts with reference to the spread and triumphs of Christianity over the world during a period of about thirty years. The record begins with Pentecost (A.D. 33) and ends with Paul's first imprisonment (A.D. 63 or 64). The whole contents of the book may be divided into these three parts:<br><br>(1.) Chaps. 1-12, describing the first twelve years of the Christian church. This section has been entitled \"From Jerusalem to Antioch.\" It contains the history of the planting and extension of the church among the Jews by the ministry of Peter.<br><br>(2.) Chaps. 13-21, Paul's missionary journeys, giving the history of the extension and planting of the church among the Gentiles.<br><br>(3.) Chaps. 21-28, Paul at Rome, and the events which led to this. Chaps. 13-28 have been entitled \"From Antioch to Rome.\"<br><br>In this book it is worthy of note that no mention is made of the writing by Paul of any of his epistles. This may be accounted for by the fact that the writer confined himself to a history of the planting of the church, and not to that of its training or edification. The relation, however, between this history and the epistles of Paul is of such a kind, i.e., brings to light so many undesigned coincidences, as to prove the genuineness and authenticity of both, as is so ably shown by Paley in his <i>Horae Paulinae</i>. \"No ancient work affords so many tests of veracity; for no other has such numerous points of contact in all directions with contemporary history, politics, and topography, whether Jewish, or Greek, or Roman.\" Lightfoot. (See <a href=\"#\" onClick=\"return doDictLookup('ET0002871');\">PAUL</a>.)";
 eastonArray["$$T0000076"] = "<b>Adah:</b> ornament.<br><br>(1.) The first of Lamech's two wives, and the mother of Jabal and Jubal (<a href=\"#\" onClick=\"return mV('Gen',4,19,20,23);\">Gen 4:19-20, 23</a>).<br><br>(2.) The first of Esau's three wives, the daughter of Elon the Hittite (<a href=\"#\" onClick=\"return mV('Gen',36,2,4);\">Gen 36:2, 4</a>), called also Bashemath (<a href=\"#\" onClick=\"return mV('Gen',26,34);\">26:34</a>).";
 eastonArray["$$T0000077"] = "<b>Adam:</b> red, a Babylonian word, the generic name for man, having the same meaning in the Hebrew and the Assyrian languages. It was the name given to the first man, whose creation, fall, and subsequent history and that of his descendants are detailed in the first book of Moses (<a href=\"#\" onClick=\"return mV('Gen',1,'27-31');\">Gen 1:27-Gen 5</a>). \"God created man [Heb., Adam] in his own image, in the image of God created he him; male and female created he them.\"<br><br>Adam was absolutely the first man whom God created. He was formed out of the dust of the earth (and hence his name), and God breathed into his nostrils the breath of life, and gave him dominion over all the lower creatures (<a href=\"#\" onClick=\"return mV('Gen',1,26);\">Gen 1:26</a>; <a href=\"#\" onClick=\"return mV('Gen',2,7);\">2:7</a>). He was placed after his creation in the Garden of Eden, to cultivate it, and to enjoy its fruits under this one prohibition: \"Of the tree of the knowledge of good and evil thou shalt not eat of it; for in the day that thou eatest thereof thou shalt surely die.\"<br><br>The first recorded act of Adam was his giving names to the beasts of the field and the fowls of the air, which God brought to him for this end. Thereafter the Lord caused a deep sleep to fall upon him, and while in an unconscious state took one of his ribs, and closed up his flesh again; and of this rib he made a woman, whom he presented to him when he awoke. Adam received her as his wife, and said, \"This is now bone of my bones, and flesh of my flesh: she shall be called Woman, because she was taken out of Man.\" He called her Eve, because she was the mother of all living.<br><br>Being induced by the tempter in the form of a serpent to eat the forbidden fruit, Eve persuaded Adam, and he also did eat. Thus man fell, and brought upon himself and his posterity all the sad consequences of his transgression. The narrative of the Fall comprehends in it the great promise of a Deliverer (<a href=\"#\" onClick=\"return mV('Gen',3,15);\">Gen 3:15</a>), the \"first gospel\" message to man. They were expelled from Eden, and at the east of the garden God placed a flame, which turned every way, to prevent access to the tree of life (<a href=\"#\" onClick=\"return mV('Gen',3,'1-')\">Gen 3</a>). How long they were in Paradise is matter of mere conjecture.<br><br>Shortly after their expulsion Eve brought forth her first-born, and called him Cain. Although we have the names of only three of Adam's sons, viz., Cain, Abel, and Seth, yet it is obvious that he had several sons and daughters (<a href=\"#\" onClick=\"return mV('Gen',5,4);\">Gen 5:4</a>). He died aged 930 years.<br><br>Adam and Eve were the progenitors of the whole human race. Evidences of varied kinds are abundant in proving the unity of the human race. The investigations of science, altogether independent of historical evidence, lead to the conclusion that God \"hath made of one blood all nations of men for to dwell on all the face of the earth\" (<a href=\"#\" onClick=\"return mV('Act',17,26);\">Act 17:26</a>. Comp. <a href=\"#\" onClick=\"return mV('Rom',5,'12-19');\">Rom. 5:12-19</a>; <a href=\"#\" onClick=\"return mV('1Cr',15,'22-49');\">1Cr 15:22-49</a>).";
 eastonArray["$$T0000078"] = "<b>Adamah:</b> red earth, a fortified city of Naphtali, probably the modern Damieh, on the west side of the sea of Tiberias (<a href=\"#\" onClick=\"return mV('Jos',19,33,36);\">Jos 19:33, 36</a>).";
 eastonArray["$$T0000079"] = "<b>Adamant:</b> (Heb. shamir), <a href=\"#\" onClick=\"return mV('Eze',3,9);\">Eze 3:9</a>. The Greek word adamas means diamond. This stone is not referred to, but corundum or some kind of hard steel. It is an emblem of firmness in resisting adversaries of the truth (<a href=\"#\" onClick=\"return mV('Zec',7,12);\">Zec 7:12</a>), and of hard-heartedness against the truth (<a href=\"#\" onClick=\"return mV('Jer',17,1);\">Jer 17:1</a>).";
 eastonArray["$$T0000080"] = "<b>Adam, a type:</b> The apostle Paul speaks of Adam as \"the figure of him who was to come.\" On this account our Lord is sometimes called the second Adam. This typical relation is described in <a href=\"#\" onClick=\"return mV('Rom',5,'14-19');\">Rom 5:14-19</a>.";
 eastonArray["$$T0000081"] = "<b>Adam, the city of:</b> is referred to in <a href=\"#\" onClick=\"return mV('Jos',3,16);\">Jos 3:16</a>. It stood \"beside Zarethan,\" on the west bank of Jordan (<a href=\"#\" onClick=\"return mV('1Ki',4,12);\">1Ki 4:12</a>). At this city the flow of the water was arrested and rose up \"upon an heap\" at the time of the Israelites' passing over (<a href=\"#\" onClick=\"return mV('Jos',3,16);\">Jos 3:16</a>).";
 eastonArray["$$T0000082"] = "<b>Adar:</b> large, the sixth month of the civil and the twelfth of the ecclesiastical year of the Jews (<a href=\"#\" onClick=\"return mV('Est',3,7,13);\">Est 3:7, 13</a>; <a href=\"#\" onClick=\"return mV('Est',8,12);\">8:12</a>; <a href=\"#\" onClick=\"return mV('Est',9,1,15,17,19,21);\">9:1, 15, 17, 19, 21</a>). It included the days extending from the new moon of our March to the new moon of April. The name was first used after the Captivity. When the season was backward, and the lambs not yet of a paschal size, or the barley not forward enough for abib, then a month called Veadar, i.e., a second Adar, was intercalated.";
 eastonArray["$$T0000083"] = "<b>Adbeel:</b> miracle of God, the third of the twelve sons of Ishmael, and head of an Arabian tribe (<a href=\"#\" onClick=\"return mV('Gen',25,13);\">Gen 25:13</a>; <a href=\"#\" onClick=\"return mV('1Ch',1,29);\">1Ch 1:29</a>).";
 eastonArray["$$T0000084"] = "<b>Addar:</b> ample, splendid, son of Bela (<a href=\"#\" onClick=\"return mV('1Ch',8,3);\">1Ch 8:3</a>); called also \"Ard\" (<a href=\"#\" onClick=\"return mV('Gen',46,21);\">Gen 46:21</a>)";
 eastonArray["$$T0000085"] = "<b>Adder:</b> (<a href=\"#\" onClick=\"return mV('Psa',140,3);\">Psa 140:3</a>; <a href=\"#\" onClick=\"return mV('Rom',3,13);\">Rom 3:13</a>, \"asp\") is the rendering of,<br><br>(1.) Akshub (\"coiling\" or \"lying in wait\"), properly an asp or viper, found only in this passage.<br><br>(2.) Pethen (\"twisting\"), a viper or venomous serpent identified with the cobra (Naja haje) (<a href=\"#\" onClick=\"return mV('Psa',58,4);\">Psa 58:4</a>; <a href=\"#\" onClick=\"return mV('Psa',91,13);\">91:13</a>); elsewhere \"asp.\"<br><br>(3.) Tziphoni (\"hissing\") (<a href=\"#\" onClick=\"return mV('Pro',23,32);\">Pro 23:32</a>); elsewhere rendered \"cockatrice,\" (<a href=\"#\" onClick=\"return mV('Isa',11,8);\">Isa 11:8</a>; <a href=\"#\" onClick=\"return mV('Isa',14,29);\">14:29</a>; <a href=\"#\" onClick=\"return mV('Isa',59,5);\">59:5</a>; <a href=\"#\" onClick=\"return mV('Jer',8,17);\">Jer 8:17</a>), as it is here in the margin of the Authorized Version. The Revised Version has \"basilisk.\" This may have been the yellow viper, the <i>Daboia xanthina</i>, the largest and most dangerous of the vipers of Palestine.<br><br>(4.) Shephiphon (\"creeping\"), occurring only in <a href=\"#\" onClick=\"return mV('Gen',49,17);\">Gen 49:17</a>, the small speckled venomous snake, the \"horned snake,\" or cerastes. Dan is compared to this serpent, which springs from its hiding-place on the passer-by.";
 eastonArray["$$T0000086"] = "<b>Addi:</b> ornament, (<a href=\"#\" onClick=\"return mV('Luk',3,28);\">Luk 3:28</a>), the son of Cosam, and father of Melchi, one of the progenitors of Christ.";
 eastonArray["$$T0000087"] = "<b>Addon:</b> low, one of the persons named in <a href=\"#\" onClick=\"return mV('Neh',7,61);\">Neh 7:61</a> who could not \"shew their father's house\" on the return from captivity. This, with similar instances (ver. <a href=\"#\" onClick=\"return mV('Neh',7,63);\">63</a>), indicates the importance the Jews attached to their genealogies.";
 eastonArray["$$T0000088"] = "<b>Adiel:</b> ornament of God.<br><br>(1.) The father of Azmaveth, who was treasurer under David and Solomon (<a href=\"#\" onClick=\"return mV('1Ch',27,25);\">1Ch 27:25</a>).<br><br>(2.) A family head of the tribe of Simeon (<a href=\"#\" onClick=\"return mV('1Ch',4,36);\">1Ch 4:36</a>).<br><br>(3.) A priest (<a href=\"#\" onClick=\"return mV('1Ch',9,12);\">1Ch 9:12</a>).";
 eastonArray["$$T0000089"] = "<b>Adin:</b> effeminate.<br><br>(1.) <a href=\"#\" onClick=\"return mV('Ezr',8,6);\">Ezr 8:6</a>.<br><br>(2.) <a href=\"#\" onClick=\"return mV('Neh',10,16);\">Neh 10:16</a>.";
 eastonArray["$$T0000090"] = "<b>Adina:</b> slender, one of David's warriors (<a href=\"#\" onClick=\"return mV('1Ch',11,42);\">1Ch 11:42</a>), a Reubenite.";
 eastonArray["$$T0000091"] = "<b>Adino:</b> the Eznite, one of David's mighty men (<a href=\"#\" onClick=\"return mV('2Sa',23,8);\">2Sa 23:8</a>). (See <a href=\"#\" onClick=\"return doDictLookup('ET0001978');\">JASHOBEAM</a>.)";
 eastonArray["$$T0000092"] = "<b>Adjuration:</b> a solemn appeal whereby one person imposes on another the obligation of speaking or acting as if under an oath (<a href=\"#\" onClick=\"return mV('1Sa',14,24);\">1Sa 14:24</a>; <a href=\"#\" onClick=\"return mV('Jos',6,26);\">Jos 6:26</a>; <a href=\"#\" onClick=\"return mV('1Ki',22,16);\">1Ki 22:16</a>).<br><br>We have in the New Testament a striking example of this (<a href=\"#\" onClick=\"return mV('Mat',26,63);\">Mat 26:63</a>; <a href=\"#\" onClick=\"return mV('Mar',5,7);\">Mar 5:7</a>), where the high priest calls upon Christ to avow his true character. It would seem that in such a case the person so adjured could not refuse to give an answer.<br><br>The word \"adjure\", i.e., cause to swear is used with reference to the casting out of demons (<a href=\"#\" onClick=\"return mV('Act',19,13);\">Act 19:13</a>).";
 eastonArray["$$T0000093"] = "<b>Admah:</b> earth, one of the five cities of the vale of Siddim (<a href=\"#\" onClick=\"return mV('Gen',10,19);\">Gen 10:19</a>). It was destroyed along with Sodom and Gomorrah (<a href=\"#\" onClick=\"return mV('Gen',19,24);\">19:24</a>; <a href=\"#\" onClick=\"return mV('Deu',29,23);\">Deu 29:23</a>). It is supposed by some to be the same as the Adam of <a href=\"#\" onClick=\"return mV('Jos',3,16);\">Jos 3:16</a>, the name of which still lingers in Damieh, the ford of Jordan. (See <a href=\"#\" onClick=\"return doDictLookup('ET0003885');\">ZEBOIM</a>.)";
 eastonArray["$$T0000094"] = "<b>Adnah:</b> delight.<br><br>(1.) A chief of the tribe of Manasseh who joined David at Ziklag (<a href=\"#\" onClick=\"return mV('1Ch',12,20);\">1Ch 12:20</a>).<br><br>(2.) A general under Jehoshaphat, chief over 300,000 men (<a href=\"#\" onClick=\"return mV('2Ch',17,14);\">2Ch 17:14</a>).";
 eastonArray["$$T0000095"] = "<b>Adonibezek:</b> lord of Bezek, a Canaanitish king who, having subdued seventy of the chiefs that were around him, made an attack against the armies of Judah and Simeon, but was defeated and brought as a captive to Jerusalem, where his thumbs and great toes were cut off. He confessed that God had requited him for his like cruelty to the seventy kings whom he had subdued (<a href=\"#\" onClick=\"return mV('Jdg',1,'4-7');\">Jdg 1:4-7</a>; <a href=\"#\" onClick=\"return mV('1Sa',15,33);\">1Sa 15:33</a>).";
 eastonArray["$$T0000096"] = "<b>Adonijah:</b> my Lord is Jehovah.<br><br>(1.) The fourth son of David (<a href=\"#\" onClick=\"return mV('2Sa',3,4);\">2Sa 3:4</a>). After the death of his elder brothers, Amnon and Absalom, he became heir-apparent to the throne. But Solomon, a younger brother, was preferred to him. Adonijah, however, when his father was dying, caused himself to be proclaimed king. But Nathan and Bathsheba induced David to give orders that Solomon should at once be proclaimed and admitted to the throne. Adonijah fled and took refuge at the altar, and received pardon for his conduct from Solomon on the condition that he showed himself \"a worthy man\" (<a href=\"#\" onClick=\"return mV('1Ki',1,'5-53');\">1Ki 1:5-53</a>). He afterwards made a second attempt to gain the throne, but was seized and put to death (<a href=\"#\" onClick=\"return mV('1Ki',2,'13-25');\">1Ki 2:13-25</a>).<br><br>(2.) A Levite sent with the princes to teach the book of the law to the inhabitants of Judah (<a href=\"#\" onClick=\"return mV('2Ch',17,8);\">2Ch 17:8</a>).<br><br>(3.) One of the \"chiefs of the people\" after the Captivity (<a href=\"#\" onClick=\"return mV('Neh',10,16);\">Neh 10:16</a>).";
 eastonArray["$$T0000097"] = "<b>Adonikam:</b> whom the Lord sets up, one of those \"which came with Zerubbabel\" (<a href=\"#\" onClick=\"return mV('Ezr',2,13);\">Ezr 2:13</a>). His \"children,\" or retainers, to the number of 666, came up to Jerusalem (<a href=\"#\" onClick=\"return mV('Ezr',8,13);\">8:13</a>).";
 eastonArray["$$T0000098"] = "<b>Adoniram:</b> (<a href=\"#\" onClick=\"return mV('1Ki',12,18);\">1Ki 12:18</a>), the son of Abda, was \"over the tribute,\" i.e., the levy or forced labour. He was stoned to death by the people of Israel (<a href=\"#\" onClick=\"return mV('1Ki',4,6);\">1Ki 4:6</a>; <a href=\"#\" onClick=\"return mV('1Ki',5,14);\">5:14</a>)";
 eastonArray["$$T0000099"] = "<b>Adoni-zedec:</b> lord of justice or righteousness, was king in Jerusalem at the time when the Israelites invaded Palestine (<a href=\"#\" onClick=\"return mV('Jos',10,1,3);\">Jos 10:1, 3</a>). He formed a confederacy with the other Canaanitish kings against the Israelites, but was utterly routed by Joshua when he was engaged in besieging the Gibeonites. The history of this victory and of the treatment of the five confederated kings is recorded in <a href=\"#\" onClick=\"return mV('Jos',10,'1-27');\">Jos 10:1-27</a>. (<a href=\"#\" onClick=\"return mV('Deu',21,23);\">Deu 21:23</a>). Among the Tell Amarna tablets (see <a href=\"#\" onClick=\"return doDictLookup('ET0001137');\">EGYPT</a>) are some very interesting letters from Adoni-zedec to the King of Egypt. These illustrate in a very remarkable manner the history recorded in <a href=\"#\" onClick=\"return mV('Jos',10,'1-');\">Jos 10</a>, and indeed throw light on the wars of conquest generally, so that they may be read as a kind of commentary on the book of Joshua. Here the conquering career of the Abiri (i.e., Hebrews) is graphically described: \"Behold, I say that the land of the king my lord is ruined\", \"The wars are mighty against me\", \"The Hebrew chiefs plunder all the king's lands\", \"Behold, I the chief of the Amorites am breaking to pieces.\" Then he implores the king of Egypt to send soldiers to help him, directing that the army should come by sea to Ascalon or Gaza, and thence march to Wru-sa-lim (Jerusalem) by the valley of Elah.";
