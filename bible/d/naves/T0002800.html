navesArray["$$T0002848-2"]="-See <a href=\"#\"onClick=\"return doDictLookup('NT0002730');\">JEHOZADAK</a>";
navesArray["$$T0002849-0"]=126;
navesArray["$$T0002849-1"]="JOSEPH";
navesArray["$$T0002849-2"]="-1. Son of Jacob";
navesArray["$$T0002849-3"]="# <a href=\"#\"onClick=\"return mV('Gen',30,24)\">Gen 30:24</a>";
navesArray["$$T0002849-4"]=".Personal appearance of";
navesArray["$$T0002849-5"]="# <a href=\"#\"onClick=\"return mV('Gen',39,6)\">Gen 39:6</a>";
navesArray["$$T0002849-6"]=".His father's favorite child";
navesArray["$$T0002849-7"]="# <a href=\"#\"onClick=\"return mV('Gen',33,2)\">Gen 33:2</a>; <a href=\"#\"onClick=\"return mV('Gen',37,3,4,35)\">37:3-4, 35</a>; <a href=\"#\"onClick=\"return mV('Gen',48,22)\">48:22</a>; <a href=\"#\"onClick=\"return mV('1Ch',5,2)\">1Ch 5:2</a>; <a href=\"#\"onClick=\"return mV('Jhn',4,5)\">Jhn 4:5</a>";
navesArray["$$T0002849-8"]=".His father's partiality for, excites the jealousy of his";
navesArray["$$T0002849-9"]="brethren";
navesArray["$$T0002849-10"]="# <a href=\"#\"onClick=\"return mV('Gen',37,4,11,'18-28')\">Gen 37:4, 11, 18-28</a>; <a href=\"#\"onClick=\"return mV('Psa',105,17)\">Psa 105:17</a>; <a href=\"#\"onClick=\"return mV('Act',7,9)\">Act 7:9</a>";
navesArray["$$T0002849-11"]=".His prophetic dreams of his fortunes in Egypt";
navesArray["$$T0002849-12"]="# <a href=\"#\"onClick=\"return mV('Gen',37,'5-11')\">Gen 37:5-11</a>";
navesArray["$$T0002849-13"]=".Sold as a slave into Egypt";
navesArray["$$T0002849-14"]="# <a href=\"#\"onClick=\"return mV('Gen',37,27,28)\">Gen 37:27-28</a>";
navesArray["$$T0002849-15"]=".Is falsely reported to his father as killed by wild beasts";
navesArray["$$T0002849-16"]="# <a href=\"#\"onClick=\"return mV('Gen',37,'29-35')\">Gen 37:29-35</a>";
navesArray["$$T0002849-17"]=".Is bought by Potiphar, an officer (LXX has \"eunuch\") of";
navesArray["$$T0002849-18"]="Pharaoh";
navesArray["$$T0002849-19"]="# <a href=\"#\"onClick=\"return mV('Gen',37,36)\">Gen 37:36</a>";
navesArray["$$T0002849-20"]=".Is prospered of God";
navesArray["$$T0002849-21"]="# <a href=\"#\"onClick=\"return mV('Gen',39,'2-5',21,23)\">Gen 39:2-5, 21, 23</a>";
navesArray["$$T0002849-22"]=".Is falsely accused, and thrown into prison; is delivered by";
navesArray["$$T0002849-23"]="the friendship of another prisoner";
navesArray["$$T0002849-24"]="# <a href=\"#\"onClick=\"return mV('Gen',39,'1-')\">Gen 39</a>; <a href=\"#\"onClick=\"return mV('Gen',40,'1-')\">40</a>; <a href=\"#\"onClick=\"return mV('Psa',105,18)\">Psa 105:18</a>";
navesArray["$$T0002849-25"]=".Is an interpreter of dreams";
navesArray["$$T0002849-26"]="@Of the two prisoners";
navesArray["$$T0002849-27"]="# <a href=\"#\"onClick=\"return mV('Gen',40,'5-23')\">Gen 40:5-23</a>";
navesArray["$$T0002849-28"]="@Of Pharaoh";
navesArray["$$T0002849-29"]="# <a href=\"#\"onClick=\"return mV('Gen',41,'1-37')\">Gen 41:1-37</a>";
navesArray["$$T0002849-30"]=".His name is changed to Zaphnath-paaneah";
navesArray["$$T0002849-31"]="# <a href=\"#\"onClick=\"return mV('Gen',41,11)\">Gen 41:11</a>";
navesArray["$$T0002849-32"]=".Is promoted to authority next to Pharaoh at thirty years of";
navesArray["$$T0002849-33"]="age";
navesArray["$$T0002849-34"]="# <a href=\"#\"onClick=\"return mV('Gen',41,'37-46')\">Gen 41:37-46</a>; <a href=\"#\"onClick=\"return mV('Psa',105,'19-22')\">Psa 105:19-22</a>";
navesArray["$$T0002849-35"]=".Marries the daughter of the priest of On";
navesArray["$$T0002849-36"]="# <a href=\"#\"onClick=\"return mV('Gen',41,45)\">Gen 41:45</a>";
navesArray["$$T0002849-37"]=".Provides against the seven years of famine";
navesArray["$$T0002849-38"]="# <a href=\"#\"onClick=\"return mV('Gen',41,'46-57')\">Gen 41:46-57</a>";
navesArray["$$T0002849-39"]=".Exports the produce of Egypt to other countries";
navesArray["$$T0002849-40"]="# <a href=\"#\"onClick=\"return mV('Gen',41,57)\">Gen 41:57</a>";
navesArray["$$T0002849-41"]=".Sells the stores of food to the people of Egypt, exacting";
navesArray["$$T0002849-42"]="from them all their money, flocks and herds, lands and lives";
navesArray["$$T0002849-43"]="# <a href=\"#\"onClick=\"return mV('Gen',47,'13-26')\">Gen 47:13-26</a>";
navesArray["$$T0002849-44"]=".Exempts the priests from the exactions";
navesArray["$$T0002849-45"]="# <a href=\"#\"onClick=\"return mV('Gen',47,22,26)\">Gen 47:22, 26</a>";
navesArray["$$T0002849-46"]=".His father sends down into Egypt to buy corn (grain)";
navesArray["$$T0002849-47"]="# <a href=\"#\"onClick=\"return mV('Gen',42,'1-')\">Gen 42</a>; <a href=\"#\"onClick=\"return mV('Gen',43,'1-')\">43</a>; <a href=\"#\"onClick=\"return mV('Gen',44,'1-')\">44</a>";
navesArray["$$T0002849-48"]=".Reveals himself to his brothers; sends for his father;";
navesArray["$$T0002849-49"]="provides the land of Goshen for his people; and sustains";
navesArray["$$T0002849-50"]="them during the famine";
navesArray["$$T0002849-51"]="# <a href=\"#\"onClick=\"return mV('Gen',45,'1-')\">Gen 45</a>; <a href=\"#\"onClick=\"return mV('Gen',46,'1-')\">46</a>; <a href=\"#\"onClick=\"return mV('Gen',47,'1-12')\">47:1-12</a>";
navesArray["$$T0002849-52"]=".His two sons";
navesArray["$$T0002849-53"]="# <a href=\"#\"onClick=\"return mV('Gen',41,50,52)\">Gen 41:50, 52</a>";
navesArray["$$T0002849-54"]=".See <a href=\"#\"onClick=\"return doDictLookup('NT0001676');\">EPHRAIM</a>";
navesArray["$$T0002849-55"]=".See <a href=\"#\"onClick=\"return doDictLookup('NT0003190');\">MANASSEH</a>";
navesArray["$$T0002849-56"]=".Mourns the death of his father";
navesArray["$$T0002849-57"]="# <a href=\"#\"onClick=\"return mV('Gen',50,'1-14')\">Gen 50:1-14</a>";
navesArray["$$T0002849-58"]=".Exacts a pledge from his brothers to convey his remains to";
navesArray["$$T0002849-59"]="Canaan";
navesArray["$$T0002849-60"]="# <a href=\"#\"onClick=\"return mV('Gen',50,2,4,25)\">Gen 50:2, 4, 25</a>; <a href=\"#\"onClick=\"return mV('Hbr',11,22)\">Hbr 11:22</a>; with <a href=\"#\"onClick=\"return mV('Exd',13,19)\">Exd 13:19</a>; <a href=\"#\"onClick=\"return mV('Jos',24,32)\">Jos 24:32</a>; <a href=\"#\"onClick=\"return mV('Act',7,16)\">Act 7:16</a>";
navesArray["$$T0002849-61"]=".Death of";
navesArray["$$T0002849-62"]="# <a href=\"#\"onClick=\"return mV('Gen',50,'22-26')\">Gen 50:22-26</a>";
navesArray["$$T0002849-63"]=".Kindness of heart";
navesArray["$$T0002849-64"]="# <a href=\"#\"onClick=\"return mV('Gen',40,7,8)\">Gen 40:7-8</a>";
navesArray["$$T0002849-65"]=".Joseph's integrity";
navesArray["$$T0002849-66"]="# <a href=\"#\"onClick=\"return mV('Gen',39,'7-12')\">Gen 39:7-12</a>";
navesArray["$$T0002849-67"]=".His humility";
navesArray["$$T0002849-68"]="# <a href=\"#\"onClick=\"return mV('Gen',41,16)\">Gen 41:16</a>; <a href=\"#\"onClick=\"return mV('Gen',45,'7-9')\">45:7-9</a>";
navesArray["$$T0002849-69"]=".His wisdom";
navesArray["$$T0002849-70"]="# <a href=\"#\"onClick=\"return mV('Gen',41,'33-57')\">Gen 41:33-57</a>";
navesArray["$$T0002849-71"]=".His piety";
navesArray["$$T0002849-72"]="# <a href=\"#\"onClick=\"return mV('Gen',41,51)\">Gen 41:51</a>";
navesArray["$$T0002849-73"]=".His faith";
navesArray["$$T0002849-74"]="# <a href=\"#\"onClick=\"return mV('Gen',45,'5-8')\">Gen 45:5-8</a>";
navesArray["$$T0002849-75"]=".Was a prophet";
navesArray["$$T0002849-76"]="# <a href=\"#\"onClick=\"return mV('Gen',41,38,39)\">Gen 41:38-39</a>; <a href=\"#\"onClick=\"return mV('Gen',50,25)\">50:25</a>; <a href=\"#\"onClick=\"return mV('Exd',13,19)\">Exd 13:19</a>";
navesArray["$$T0002849-77"]=".God's providence with";
navesArray["$$T0002849-78"]="# <a href=\"#\"onClick=\"return mV('Gen',39,'2-5')\">Gen 39:2-5</a>; <a href=\"#\"onClick=\"return mV('Psa',105,'17-22')\">Psa 105:17-22</a>";
navesArray["$$T0002849-79"]=".His sons jointly called JOSEPH";
navesArray["$$T0002849-80"]="# <a href=\"#\"onClick=\"return mV('Deu',33,'13-17')\">Deu 33:13-17</a>";
navesArray["$$T0002849-81"]=".Descendants of";
navesArray["$$T0002849-82"]="# <a href=\"#\"onClick=\"return mV('Gen',46,20)\">Gen 46:20</a>; <a href=\"#\"onClick=\"return mV('Num',26,'28-37')\">Num 26:28-37</a>";
navesArray["$$T0002849-83"]="-2. Father of Igal, the spy";
navesArray["$$T0002849-84"]="# <a href=\"#\"onClick=\"return mV('Num',13,7)\">Num 13:7</a>";
navesArray["$$T0002849-85"]="-3. Of the sons of Asaph";
navesArray["$$T0002849-86"]="# <a href=\"#\"onClick=\"return mV('1Ch',25,2,9)\">1Ch 25:2, 9</a>";
navesArray["$$T0002849-87"]="-4. A returned exile";
navesArray["$$T0002849-88"]="# <a href=\"#\"onClick=\"return mV('Ezr',10,42)\">Ezr 10:42</a>";
navesArray["$$T0002849-89"]="-5. A priest";
navesArray["$$T0002849-90"]="# <a href=\"#\"onClick=\"return mV('Neh',12,14)\">Neh 12:14</a>";
navesArray["$$T0002849-91"]="-6. Husband of Mary";
navesArray["$$T0002849-92"]="# <a href=\"#\"onClick=\"return mV('Mat',13,55)\">Mat 13:55</a>; <a href=\"#\"onClick=\"return mV('Mar',6,3)\">Mar 6:3</a>; <a href=\"#\"onClick=\"return mV('Mat',1,'18-25')\">Mat 1:18-25</a>; <a href=\"#\"onClick=\"return mV('Luk',1,27)\">Luk 1:27</a>";
navesArray["$$T0002849-93"]=".His genealogy";
navesArray["$$T0002849-94"]="# <a href=\"#\"onClick=\"return mV('Mat',1,'1-16')\">Mat 1:1-16</a>; <a href=\"#\"onClick=\"return mV('Luk',3,'23-38')\">Luk 3:23-38</a>";
navesArray["$$T0002849-95"]=".An angel appears and testifies to the innocence of his";
navesArray["$$T0002849-96"]="betrothed";
navesArray["$$T0002849-97"]="# <a href=\"#\"onClick=\"return mV('Mat',1,'19-24')\">Mat 1:19-24</a>";
navesArray["$$T0002849-98"]=".Lives at Nazareth";
navesArray["$$T0002849-99"]="# <a href=\"#\"onClick=\"return mV('Luk',2,4)\">Luk 2:4</a>";
navesArray["$$T0002849-100"]=".Belongs to the town of Bethlehem";
navesArray["$$T0002849-101"]="# <a href=\"#\"onClick=\"return mV('Luk',2,4)\">Luk 2:4</a>";
navesArray["$$T0002849-102"]=".Goes to Bethlehem to be enrolled";
navesArray["$$T0002849-103"]="# <a href=\"#\"onClick=\"return mV('Luk',2,'1-4')\">Luk 2:1-4</a>";
navesArray["$$T0002849-104"]=".Jesus born to";
navesArray["$$T0002849-105"]="# <a href=\"#\"onClick=\"return mV('Mat',1,25)\">Mat 1:25</a>; <a href=\"#\"onClick=\"return mV('Luk',2,7)\">Luk 2:7</a>";
navesArray["$$T0002849-106"]=".Presents Jesus in the temple";
navesArray["$$T0002849-107"]="# <a href=\"#\"onClick=\"return mV('Luk',2,'22-39')\">Luk 2:22-39</a>";
navesArray["$$T0002849-108"]=".Returns to Nazareth";
navesArray["$$T0002849-109"]="# <a href=\"#\"onClick=\"return mV('Luk',2,39)\">Luk 2:39</a>";
navesArray["$$T0002849-110"]=".Warned in a dream to escape to Egypt in order to save the";
navesArray["$$T0002849-111"]="infant's life";
navesArray["$$T0002849-112"]="# <a href=\"#\"onClick=\"return mV('Mat',2,'13-15')\">Mat 2:13-15</a>";
navesArray["$$T0002849-113"]=".Warned in a dream to return to Nazareth";
navesArray["$$T0002849-114"]="# <a href=\"#\"onClick=\"return mV('Mat',2,'19-23')\">Mat 2:19-23</a>";
navesArray["$$T0002849-115"]=".Attends the annual feast at Jerusalem with his family";
navesArray["$$T0002849-116"]="# <a href=\"#\"onClick=\"return mV('Luk',2,'42-51')\">Luk 2:42-51</a>";
navesArray["$$T0002849-117"]="-7. Of Arimathaea";
navesArray["$$T0002849-118"]=".Begs for the body of Jesus for burial in his own tomb";
navesArray["$$T0002849-119"]="# <a href=\"#\"onClick=\"return mV('Mat',27,'57-60')\">Mat 27:57-60</a>; <a href=\"#\"onClick=\"return mV('Mar',15,'42-47')\">Mar 15:42-47</a>; <a href=\"#\"onClick=\"return mV('Luk',23,'50-56')\">Luk 23:50-56</a>; <a href=\"#\"onClick=\"return mV('Jhn',19,'38-42')\">Jhn 19:38-42</a>";
navesArray["$$T0002849-120"]="-8. Three ancestors of Joseph";
navesArray["$$T0002849-121"]="# <a href=\"#\"onClick=\"return mV('Luk',3,24,26,30)\">Luk 3:24, 26, 30</a>";
navesArray["$$T0002849-122"]="-9. Also called BARSABAS, surnamed JUSTUS";
navesArray["$$T0002849-123"]=".One of the two persons nominated in place of Judas";
navesArray["$$T0002849-124"]="# <a href=\"#\"onClick=\"return mV('Act',1,'21-23')\">Act 1:21-23</a>";
navesArray["$$T0002849-125"]="-10. A designation of the ten tribes of Israel";
navesArray["$$T0002849-126"]="# <a href=\"#\"onClick=\"return mV('Amo',5,6)\">Amo 5:6</a>";
</script>
