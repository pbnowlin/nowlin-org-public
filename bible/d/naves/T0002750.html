navesArray["$$T0002780-182"]=".Reproves the ambition of his disciples (at Capernaum)";
navesArray["$$T0002780-183"]="# <a href=\"#\"onClick=\"return mV('Mat',18,'1-35')\">Mat 18:1-35</a>; <a href=\"#\"onClick=\"return mV('Mar',9,'33-50')\">Mar 9:33-50</a>; <a href=\"#\"onClick=\"return mV('Luk',9,'46-50')\">Luk 9:46-50</a>";
navesArray["$$T0002780-184"]=".Reproves the intolerance of his disciples";
navesArray["$$T0002780-185"]="# <a href=\"#\"onClick=\"return mV('Mar',9,38,39)\">Mar 9:38-39</a>; <a href=\"#\"onClick=\"return mV('Luk',9,49,50)\">Luk 9:49-50</a>";
navesArray["$$T0002780-186"]=".Journeys to Jerusalem to attend the Feast of Tabernacles,";
navesArray["$$T0002780-187"]="passing through Samaria";
navesArray["$$T0002780-188"]="# <a href=\"#\"onClick=\"return mV('Luk',9,'51-62')\">Luk 9:51-62</a>; <a href=\"#\"onClick=\"return mV('Jhn',7,'2-11')\">Jhn 7:2-11</a>";
navesArray["$$T0002780-189"]=".Commissions the seventy disciples (in Samaria)";
navesArray["$$T0002780-190"]="# <a href=\"#\"onClick=\"return mV('Luk',10,'1-16')\">Luk 10:1-16</a>";
navesArray["$$T0002780-191"]=".Heals ten lepers (near the border between Samaria and";
navesArray["$$T0002780-192"]="Galilee)";
navesArray["$$T0002780-193"]="# <a href=\"#\"onClick=\"return mV('Luk',17,'11-19')\">Luk 17:11-19</a>";
navesArray["$$T0002780-194"]=".Teaches in Jerusalem at the Feast of Tabernacles";
navesArray["$$T0002780-195"]="# <a href=\"#\"onClick=\"return mV('Jhn',7,'14-53')\">Jhn 7:14-53</a>; <a href=\"#\"onClick=\"return mV('Jhn',8,'1-')\">8</a>";
navesArray["$$T0002780-196"]=".Answers a Biblical expert, who tests his wisdom with the";
navesArray["$$T0002780-197"]="question, \"What shall I do to inherit eternal life?\" by the";
navesArray["$$T0002780-198"]="parable of the Good Samaritan (in Jerusalem)";
navesArray["$$T0002780-199"]="# <a href=\"#\"onClick=\"return mV('Luk',10,'25-37')\">Luk 10:25-37</a>";
navesArray["$$T0002780-200"]=".Hears the report of the seventy disciples (in Jerusalem)";
navesArray["$$T0002780-201"]="# <a href=\"#\"onClick=\"return mV('Luk',10,'17-24')\">Luk 10:17-24</a>";
navesArray["$$T0002780-202"]=".Teaches in the house of Mary, Martha, and Lazarus (in";
navesArray["$$T0002780-203"]="Bethany)";
navesArray["$$T0002780-204"]="# <a href=\"#\"onClick=\"return mV('Luk',10,'38-42')\">Luk 10:38-42</a>";
navesArray["$$T0002780-205"]=".Teaches his disciples to pray";
navesArray["$$T0002780-206"]="# <a href=\"#\"onClick=\"return mV('Luk',11,'1-13')\">Luk 11:1-13</a>";
navesArray["$$T0002780-207"]=".Heals a blind man, who, because of his faith in Jesus, was";
navesArray["$$T0002780-208"]="excommunicated (in Jerusalem)";
navesArray["$$T0002780-209"]="# <a href=\"#\"onClick=\"return mV('Jhn',9,'1-')\">Jhn 9</a>";
navesArray["$$T0002780-210"]=".Teaches people (in Jerusalem)";
navesArray["$$T0002780-211"]="# <a href=\"#\"onClick=\"return mV('Jhn',9,'39-41')\">Jhn 9:39-41</a>; <a href=\"#\"onClick=\"return mV('Jhn',10,'1-21')\">10:1-21</a>";
navesArray["$$T0002780-212"]=".Teaches in the temple (at Jerusalem) at the Feast of";
navesArray["$$T0002780-213"]="Dedication";
navesArray["$$T0002780-214"]="# <a href=\"#\"onClick=\"return mV('Jhn',10,'22-39')\">Jhn 10:22-39</a>";
navesArray["$$T0002780-215"]=".Goes to Bethabara to escape violence from the rulers (east";
navesArray["$$T0002780-216"]="of the Jordan River)";
navesArray["$$T0002780-217"]="# <a href=\"#\"onClick=\"return mV('Jhn',10,'40-42')\">Jhn 10:40-42</a>; <a href=\"#\"onClick=\"return mV('Jhn',11,'3-16')\">11:3-16</a>";
navesArray["$$T0002780-218"]=".Returns to Bethany and raises Lazarus from the dead";
navesArray["$$T0002780-219"]="# <a href=\"#\"onClick=\"return mV('Jhn',11,'1-46')\">Jhn 11:1-46</a>";
navesArray["$$T0002780-220"]=".Escapes to the town of Ephraim from the conspiracy led by";
navesArray["$$T0002780-221"]="Caiaphas, the high priest (in Judaea,)";
navesArray["$$T0002780-222"]="# <a href=\"#\"onClick=\"return mV('Jhn',11,'47-54')\">Jhn 11:47-54</a>";
navesArray["$$T0002780-223"]=".Journeys toward Jerusalem to attend the Passover; heals many";
navesArray["$$T0002780-224"]="who are diseased, and teaches the people (in Peraea)";
navesArray["$$T0002780-225"]="# <a href=\"#\"onClick=\"return mV('Mat',19,1,2)\">Mat 19:1-2</a>; <a href=\"#\"onClick=\"return mV('Mar',10,1)\">Mar 10:1</a>; <a href=\"#\"onClick=\"return mV('Luk',13,'10-35')\">Luk 13:10-35</a>";
navesArray["$$T0002780-226"]=".Dines with a Pharisee on the Sabbath (in Peraea)";
navesArray["$$T0002780-227"]="# <a href=\"#\"onClick=\"return mV('Luk',14,'1-24')\">Luk 14:1-24</a>";
navesArray["$$T0002780-228"]=".Teaches the multitude the conditions of discipleship (in";
navesArray["$$T0002780-229"]="Peraea)";
navesArray["$$T0002780-230"]="# <a href=\"#\"onClick=\"return mV('Luk',14,'25-35')\">Luk 14:25-35</a>";
navesArray["$$T0002780-231"]=".Enunciates the parables of the lost sheep, of the lost piece";
navesArray["$$T0002780-232"]="of silver, of the prodigal son, and of the unjust steward";
navesArray["$$T0002780-233"]="(in Peraea)";
navesArray["$$T0002780-234"]="# <a href=\"#\"onClick=\"return mV('Luk',15,'1-32')\">Luk 15:1-32</a>; <a href=\"#\"onClick=\"return mV('Luk',16,'1-13')\">16:1-13</a>";
navesArray["$$T0002780-235"]=".Reproves the hypocrisy of the Pharisees (in Peraea)";
navesArray["$$T0002780-236"]="# <a href=\"#\"onClick=\"return mV('Luk',16,'1-')\">Luk 16</a>";
navesArray["$$T0002780-237"]=".Enunciates the parable of the rich man and Lazarus (in";
navesArray["$$T0002780-238"]="Peraea)";
navesArray["$$T0002780-239"]="# <a href=\"#\"onClick=\"return mV('Luk',16,'19-31')\">Luk 16:19-31</a>";
navesArray["$$T0002780-240"]=".Teaches his disciples concerning offenses, meekness, and";
navesArray["$$T0002780-241"]="humility (in Peraea)";
navesArray["$$T0002780-242"]="# <a href=\"#\"onClick=\"return mV('Luk',17,'1-10')\">Luk 17:1-10</a>";
navesArray["$$T0002780-243"]=".Teaches the Pharisees concerning the coming of his kingdom";
navesArray["$$T0002780-244"]="(in Peraea)";
navesArray["$$T0002780-245"]="# <a href=\"#\"onClick=\"return mV('Luk',17,'20-37')\">Luk 17:20-37</a>";
navesArray["$$T0002780-246"]=".Enunciates the parables of the unjust judge, and the";
navesArray["$$T0002780-247"]="Pharisee and publican praying in the temple (in Peraea)";
navesArray["$$T0002780-248"]="# <a href=\"#\"onClick=\"return mV('Luk',18,'1-14')\">Luk 18:1-14</a>";
navesArray["$$T0002780-249"]=".Interprets the law concerning marriage and divorce (in";
navesArray["$$T0002780-250"]="Peraea)";
navesArray["$$T0002780-251"]="# <a href=\"#\"onClick=\"return mV('Mat',19,'3-12')\">Mat 19:3-12</a>; <a href=\"#\"onClick=\"return mV('Mar',10,'2-12')\">Mar 10:2-12</a>";
navesArray["$$T0002780-252"]=".Blesses little children (in Peraea)";
navesArray["$$T0002780-253"]="# <a href=\"#\"onClick=\"return mV('Mat',19,'13-15')\">Mat 19:13-15</a>; <a href=\"#\"onClick=\"return mV('Mar',10,'13-16')\">Mar 10:13-16</a>; <a href=\"#\"onClick=\"return mV('Luk',18,'15-17')\">Luk 18:15-17</a>";
navesArray["$$T0002780-254"]=".Receives the rich young ruler who asks what he shall do to";
navesArray["$$T0002780-255"]="inherit eternal life (in Peraea)";
navesArray["$$T0002780-256"]="# <a href=\"#\"onClick=\"return mV('Mat',19,'16-22')\">Mat 19:16-22</a>; <a href=\"#\"onClick=\"return mV('Mar',10,'17-22')\">Mar 10:17-22</a>; <a href=\"#\"onClick=\"return mV('Luk',18,'18-24')\">Luk 18:18-24</a>";
navesArray["$$T0002780-257"]=".Enunciates the parable of the vineyard (in Peraea)";
navesArray["$$T0002780-258"]="# <a href=\"#\"onClick=\"return mV('Mat',20,'1-16')\">Mat 20:1-16</a>";
navesArray["$$T0002780-259"]=".Foretells his own death and resurrection (in Peraea)";
navesArray["$$T0002780-260"]="# <a href=\"#\"onClick=\"return mV('Mat',20,'17-19')\">Mat 20:17-19</a>; <a href=\"#\"onClick=\"return mV('Mar',10,'32-34')\">Mar 10:32-34</a>; <a href=\"#\"onClick=\"return mV('Luk',18,'31-34')\">Luk 18:31-34</a>";
navesArray["$$T0002780-261"]=".Listens to the mother of James and John in behalf of her";
navesArray["$$T0002780-262"]="sons (in Peraea)";
navesArray["$$T0002780-263"]="# <a href=\"#\"onClick=\"return mV('Mat',20,'20-28')\">Mat 20:20-28</a>; <a href=\"#\"onClick=\"return mV('Mar',10,'35-45')\">Mar 10:35-45</a>";
navesArray["$$T0002780-264"]=".Heals two blind men (at Jericho)";
navesArray["$$T0002780-265"]="# <a href=\"#\"onClick=\"return mV('Mat',20,'29-34')\">Mat 20:29-34</a>; <a href=\"#\"onClick=\"return mV('Mar',10,'46-50')\">Mar 10:46-50</a>; <a href=\"#\"onClick=\"return mV('Luk',18,'35-43')\">Luk 18:35-43</a>";
navesArray["$$T0002780-266"]=".Visits Zacchaeus";
navesArray["$$T0002780-267"]="# <a href=\"#\"onClick=\"return mV('Luk',19,'1-10')\">Luk 19:1-10</a>";
navesArray["$$T0002780-268"]=".Enunciates the parable of the pounds (in Jericho)";
navesArray["$$T0002780-269"]="# <a href=\"#\"onClick=\"return mV('Luk',19,'11-28')\">Luk 19:11-28</a>";
navesArray["$$T0002780-270"]=".Goes to Bethany six days before the Passover";
navesArray["$$T0002780-271"]="# <a href=\"#\"onClick=\"return mV('Jhn',12,'1-9')\">Jhn 12:1-9</a>";
navesArray["$$T0002780-272"]=".Triumphal entry into Jerusalem, while the people throw palm";
navesArray["$$T0002780-273"]="branches on the road in front of him";
navesArray["$$T0002780-274"]="# <a href=\"#\"onClick=\"return mV('Mat',21,'1-11')\">Mat 21:1-11</a>; <a href=\"#\"onClick=\"return mV('Mar',11,'1-11')\">Mar 11:1-11</a>; <a href=\"#\"onClick=\"return mV('Luk',19,'29-44')\">Luk 19:29-44</a>; <a href=\"#\"onClick=\"return mV('Jhn',12,'12-19')\">Jhn 12:12-19</a>";
navesArray["$$T0002780-275"]=".Enters the temple (in Jerusalem)";
navesArray["$$T0002780-276"]="# <a href=\"#\"onClick=\"return mV('Mat',21,12)\">Mat 21:12</a>; <a href=\"#\"onClick=\"return mV('Mar',11,11)\">Mar 11:11</a>; <a href=\"#\"onClick=\"return mV('Luk',19,45)\">Luk 19:45</a>";
navesArray["$$T0002780-277"]=".Drives the money changers out of the temple (in Jerusalem)";
navesArray["$$T0002780-278"]="# <a href=\"#\"onClick=\"return mV('Mat',21,12,13)\">Mat 21:12-13</a>; <a href=\"#\"onClick=\"return mV('Luk',19,45,46)\">Luk 19:45-46</a>";
navesArray["$$T0002780-279"]=".Heals the sick people in the temple courtyard (in Jerusalem)";
navesArray["$$T0002780-280"]="# <a href=\"#\"onClick=\"return mV('Mat',21,14)\">Mat 21:14</a>";
navesArray["$$T0002780-281"]=".Teaches daily in the temple courtyard (in Jerusalem)";
navesArray["$$T0002780-282"]="# <a href=\"#\"onClick=\"return mV('Luk',19,47,48)\">Luk 19:47-48</a>";
navesArray["$$T0002780-283"]=".Performs the miracle of causing the barren fig tree to";
navesArray["$$T0002780-284"]="wither (just outside Jerusalem)";
navesArray["$$T0002780-285"]="# <a href=\"#\"onClick=\"return mV('Mat',21,'17-22')\">Mat 21:17-22</a>; <a href=\"#\"onClick=\"return mV('Mar',11,'12-14','20-22')\">Mar 11:12-14, 20-22</a>";
navesArray["$$T0002780-286"]=".Enunciates";
navesArray["$$T0002780-287"]="@The parable of the two sons (in Jerusalem)";
navesArray["$$T0002780-288"]="# <a href=\"#\"onClick=\"return mV('Mat',21,'28-31')\">Mat 21:28-31</a>";
navesArray["$$T0002780-289"]="@The parable of the wicked husbandmen (in Jerusalem)";
navesArray["$$T0002780-290"]="# <a href=\"#\"onClick=\"return mV('Mat',21,'33-46')\">Mat 21:33-46</a>; <a href=\"#\"onClick=\"return mV('Mar',12,'1-12')\">Mar 12:1-12</a>; <a href=\"#\"onClick=\"return mV('Luk',20,'9-19')\">Luk 20:9-19</a>";
navesArray["$$T0002780-291"]="@The parable of the marriage banquet (in Jerusalem)";
navesArray["$$T0002780-292"]="# <a href=\"#\"onClick=\"return mV('Mat',22,'1-14')\">Mat 22:1-14</a>; <a href=\"#\"onClick=\"return mV('Luk',14,'16-24')\">Luk 14:16-24</a>";
navesArray["$$T0002780-293"]=".Tested by the Pharisees and the Herodians, and enunciates";
navesArray["$$T0002780-294"]="the duty of a citizen to his government (in Jerusalem)";
navesArray["$$T0002780-295"]="# <a href=\"#\"onClick=\"return mV('Mat',22,'15-22')\">Mat 22:15-22</a>; <a href=\"#\"onClick=\"return mV('Mar',12,'13-17')\">Mar 12:13-17</a>; <a href=\"#\"onClick=\"return mV('Luk',20,'20-26')\">Luk 20:20-26</a>";
navesArray["$$T0002780-296"]=".Tested by the Sadducees concerning the resurrection of the";
navesArray["$$T0002780-297"]="dead (in Jerusalem)";
navesArray["$$T0002780-298"]="# <a href=\"#\"onClick=\"return mV('Mat',22,'23-33')\">Mat 22:23-33</a>; <a href=\"#\"onClick=\"return mV('Mar',12,'18-27')\">Mar 12:18-27</a>; <a href=\"#\"onClick=\"return mV('Luk',20,'27-40')\">Luk 20:27-40</a>";
navesArray["$$T0002780-299"]=".Tested by a Biblical expert (in Jerusalem)";
navesArray["$$T0002780-300"]="# <a href=\"#\"onClick=\"return mV('Mat',22,'34-40')\">Mat 22:34-40</a>; <a href=\"#\"onClick=\"return mV('Mar',12,'28-34')\">Mar 12:28-34</a>";
navesArray["$$T0002780-301"]=".Exposes the hypocrisies of the scribes and Pharisees (in";
navesArray["$$T0002780-302"]="Jerusalem)";
navesArray["$$T0002780-303"]="# <a href=\"#\"onClick=\"return mV('Mat',23,'1-')\">Mat 23</a>; <a href=\"#\"onClick=\"return mV('Mar',12,'38-40')\">Mar 12:38-40</a>; <a href=\"#\"onClick=\"return mV('Luk',20,'45-47')\">Luk 20:45-47</a>";
navesArray["$$T0002780-304"]=".Verifies the prophecy of Isaiah concerning the unbelieving";
navesArray["$$T0002780-305"]="Jews";
navesArray["$$T0002780-306"]="# <a href=\"#\"onClick=\"return mV('Jhn',12,'37-50')\">Jhn 12:37-50</a>";
navesArray["$$T0002780-307"]=".Foretells the destruction of the temple, and of Jerusalem";
navesArray["$$T0002780-308"]="(in Jerusalem)";
navesArray["$$T0002780-309"]="# <a href=\"#\"onClick=\"return mV('Mat',24,'1-')\">Mat 24</a>; <a href=\"#\"onClick=\"return mV('Mar',13,'1-')\">Mar 13</a>; <a href=\"#\"onClick=\"return mV('Luk',21,'5-36')\">Luk 21:5-36</a>";
navesArray["$$T0002780-310"]=".Laments over Jerusalem (just outside Jerusalem)";
navesArray["$$T0002780-311"]="# <a href=\"#\"onClick=\"return mV('Mat',23,37)\">Mat 23:37</a>; <a href=\"#\"onClick=\"return mV('Luk',19,'41-44')\">Luk 19:41-44</a>";
navesArray["$$T0002780-312"]=".Enunciates the parables of the ten virgins and of the";
navesArray["$$T0002780-313"]="talents";
navesArray["$$T0002780-314"]="# <a href=\"#\"onClick=\"return mV('Mat',25,'1-30')\">Mat 25:1-30</a>";
navesArray["$$T0002780-315"]=".Foretells the scenes of the day of judgment (on the Mount of";
navesArray["$$T0002780-316"]="Olives)";
navesArray["$$T0002780-317"]="# <a href=\"#\"onClick=\"return mV('Mat',25,'31-46')\">Mat 25:31-46</a>";
navesArray["$$T0002780-318"]=".Anointed with precious ointment (in Bethany)";
navesArray["$$T0002780-319"]="# <a href=\"#\"onClick=\"return mV('Mat',26,'6-13')\">Mat 26:6-13</a>; <a href=\"#\"onClick=\"return mV('Mar',14,'3-9')\">Mar 14:3-9</a>; <a href=\"#\"onClick=\"return mV('Jhn',12,'1-8')\">Jhn 12:1-8</a>";
navesArray["$$T0002780-320"]=".His last Passover meal and his establishment of the Lord's";
navesArray["$$T0002780-321"]="Supper (in Jerusalem)";
navesArray["$$T0002780-322"]="# <a href=\"#\"onClick=\"return mV('Mat',26,'17-30')\">Mat 26:17-30</a>; <a href=\"#\"onClick=\"return mV('Mar',14,'12-25')\">Mar 14:12-25</a>; <a href=\"#\"onClick=\"return mV('Luk',22,'7-20')\">Luk 22:7-20</a>";
navesArray["$$T0002780-323"]=".Washes the disciples' feet (in Jerusalem)";
navesArray["$$T0002780-324"]="# <a href=\"#\"onClick=\"return mV('Jhn',13,'1-17')\">Jhn 13:1-17</a>";
navesArray["$$T0002780-325"]=".Foretells his betrayal (in Jerusalem)";
navesArray["$$T0002780-326"]="# <a href=\"#\"onClick=\"return mV('Mat',26,23)\">Mat 26:23</a>; <a href=\"#\"onClick=\"return mV('Mar',14,'18-21')\">Mar 14:18-21</a>; <a href=\"#\"onClick=\"return mV('Luk',22,21)\">Luk 22:21</a>; <a href=\"#\"onClick=\"return mV('Jhn',13,18)\">Jhn 13:18</a>";
navesArray["$$T0002780-327"]=".Accuses Judas of his betrayal (in Jerusalem)";
navesArray["$$T0002780-328"]="# <a href=\"#\"onClick=\"return mV('Mat',26,'21-25')\">Mat 26:21-25</a>; <a href=\"#\"onClick=\"return mV('Mar',14,'18-21')\">Mar 14:18-21</a>; <a href=\"#\"onClick=\"return mV('Luk',22,'21-23')\">Luk 22:21-23</a>; <a href=\"#\"onClick=\"return mV('Jhn',13,'21-30')\">Jhn 13:21-30</a>";
navesArray["$$T0002780-329"]=".Teaches his disciples, and comforts them with promises, and";
navesArray["$$T0002780-330"]="promises the gift of the Holy Spirit (in Jerusalem)";
navesArray["$$T0002780-331"]="# <a href=\"#\"onClick=\"return mV('Jhn',14,'1-')\">Jhn 14</a>; <a href=\"#\"onClick=\"return mV('Jhn',15,'1-')\">15</a>; <a href=\"#\"onClick=\"return mV('Jhn',16,'1-')\">16</a>";
navesArray["$$T0002780-332"]=".One of his last prayers (in Jerusalem)";
navesArray["$$T0002780-333"]="# <a href=\"#\"onClick=\"return mV('Jhn',17,'1-')\">Jhn 17</a>";
navesArray["$$T0002780-334"]=".Retires to Gethsemane (on the Mount of Olives)";
navesArray["$$T0002780-335"]="# <a href=\"#\"onClick=\"return mV('Mat',26,30,'36-46')\">Mat 26:30, 36-46</a>; <a href=\"#\"onClick=\"return mV('Mar',14,26,'36-42')\">Mar 14:26, 32-42</a>; <a href=\"#\"onClick=\"return mV('Luk',22,'39-46')\">Luk 22:39-46</a>; <a href=\"#\"onClick=\"return mV('Jhn',18,1)\">Jhn 18:1</a>";
navesArray["$$T0002780-336"]=".Is betrayed and apprehended (in the garden of Gethsemane)";
navesArray["$$T0002780-337"]="# <a href=\"#\"onClick=\"return mV('Mat',26,'47-56')\">Mat 26:47-56</a>; <a href=\"#\"onClick=\"return mV('Mar',14,'43-54','66-72')\">Mar 14:43-54, 66-72</a>; <a href=\"#\"onClick=\"return mV('Luk',22,'47-53')\">Luk 22:47-53</a>; <a href=\"#\"onClick=\"return mV('Jhn',18,'2-12')\">Jhn 18:2-12</a>";
navesArray["$$T0002780-338"]=".Trial of, before Caiaphas (in Jerusalem)";
navesArray["$$T0002780-339"]="# <a href=\"#\"onClick=\"return mV('Mat',26,57,58,'69-75')\">Mat 26:57-58, 69-75</a>; <a href=\"#\"onClick=\"return mV('Mar',14,53,54,'66-72')\">Mar 14:53-54, 66-72</a>; <a href=\"#\"onClick=\"return mV('Luk',22,'54-62')\">Luk 22:54-62</a>; <a href=\"#\"onClick=\"return mV('Jhn',18,'13-18','25-27')\">Jhn 18:13-18, 25-27</a>";
navesArray["$$T0002780-340"]=".Tried by the council (in Jerusalem)";
navesArray["$$T0002780-341"]="# <a href=\"#\"onClick=\"return mV('Mat',26,'59-68')\">Mat 26:59-68</a>; <a href=\"#\"onClick=\"return mV('Mar',14,'55-65')\">Mar 14:55-65</a>; <a href=\"#\"onClick=\"return mV('Luk',22,'63-71')\">Luk 22:63-71</a>; <a href=\"#\"onClick=\"return mV('Jhn',18,'19-21')\">Jhn 18:19-21</a>";
navesArray["$$T0002780-342"]=".Led by the council to Pilate (in Jerusalem)";
navesArray["$$T0002780-343"]="# <a href=\"#\"onClick=\"return mV('Mat',27,1,2,'11-14')\">Mat 27:1-2, 11-14</a>; <a href=\"#\"onClick=\"return mV('Mar',15,'1-5')\">Mar 15:1-5</a>; <a href=\"#\"onClick=\"return mV('Luk',23,'1-5')\">Luk 23:1-5</a>; <a href=\"#\"onClick=\"return mV('Jhn',18,'28-38')\">Jhn 18:28-38</a>";
navesArray["$$T0002780-344"]=".Arraigned before Herod Antipas (in Jerusalem)";
navesArray["$$T0002780-345"]="# <a href=\"#\"onClick=\"return mV('Luk',23,'6-12')\">Luk 23:6-12</a>";
navesArray["$$T0002780-346"]=".Tried in front of Pilate (in Jerusalem)";
navesArray["$$T0002780-347"]="# <a href=\"#\"onClick=\"return mV('Mat',27,'15-26')\">Mat 27:15-26</a>; <a href=\"#\"onClick=\"return mV('Mar',15,'6-15')\">Mar 15:6-15</a>; <a href=\"#\"onClick=\"return mV('Luk',23,'13-25')\">Luk 23:13-25</a>; <a href=\"#\"onClick=\"return mV('Jhn',18,39,40)\">Jhn 18:39-40</a>; <a href=\"#\"onClick=\"return mV('Jhn',19,'1-16')\">19:1-16</a>";
navesArray["$$T0002780-348"]=".Mocked by the soldiers (in Jerusalem)";
