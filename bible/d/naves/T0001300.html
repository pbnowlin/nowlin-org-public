navesArray["$$T0001341-181"]="# <a href=\"#\"onClick=\"return mV('2Sa',12,'1-14')\">2Sa 12:1-14</a>";

navesArray["$$T0001341-200"]="# <a href=\"#\"onClick=\"return mV('2Sa',15,'13-37')\">2Sa 15:13-37</a>";
