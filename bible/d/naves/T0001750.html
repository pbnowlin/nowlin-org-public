navesArray["$$T0001789-58"]="# <a href=\"#\"onClick=\"return mV('Jos',9,'1-')\">Jos 9</a>";
navesArray["$$T0001789-59"]=".Ehud, in pretending to carry secret messages to Eglon, king";
navesArray["$$T0001789-60"]="of Moab, while his real objective was to assassinate him";
navesArray["$$T0001789-61"]="# <a href=\"#\"onClick=\"return mV('Jdg',3,'16-23')\">Jdg 3:16-23</a>";
navesArray["$$T0001789-62"]=".Sisera, who instructed Jael to mislead his pursuers";
navesArray["$$T0001789-63"]="# <a href=\"#\"onClick=\"return mV('Jdg',4,20)\">Jdg 4:20</a>";
navesArray["$$T0001789-64"]=".Saul, in professing to Samuel to have obeyed the commandment";
navesArray["$$T0001789-65"]="to destroy all spoils of the Amalekites, when in fact he had";
navesArray["$$T0001789-66"]="not obeyed";
navesArray["$$T0001789-67"]="# <a href=\"#\"onClick=\"return mV('1Sa',15,'1-26')\">1Sa 15:1-26</a>";
navesArray["$$T0001789-68"]=".In accusing Ahimelech of conspiring with David against";
navesArray["$$T0001789-69"]="himself";
navesArray["$$T0001789-70"]="# <a href=\"#\"onClick=\"return mV('1Sa',22,'11-16')\">1Sa 22:11-16</a>";
navesArray["$$T0001789-71"]=".David lied to Ahimelech, professing to have a mission from";
navesArray["$$T0001789-72"]="the king, in order that he might obtain provisions and armor";
navesArray["$$T0001789-73"]="# <a href=\"#\"onClick=\"return mV('1Sa',21,'1-')\">1Sa 21</a>";
navesArray["$$T0001789-74"]=".David in feigning madness";
navesArray["$$T0001789-75"]="# <a href=\"#\"onClick=\"return mV('1Sa',21,'13-15')\">1Sa 21:13-15</a>";
navesArray["$$T0001789-76"]=".David's other deceits with the Philistines";
navesArray["$$T0001789-77"]="# <a href=\"#\"onClick=\"return mV('1Sa',27,'8-12')\">1Sa 27:8-12</a>";
navesArray["$$T0001789-78"]=".The falsehood of friendship to Absalom that David put in the";
navesArray["$$T0001789-79"]="mouth of Hushai";
navesArray["$$T0001789-80"]="# <a href=\"#\"onClick=\"return mV('2Sa',15,'34-37')\">2Sa 15:34-37</a>";
navesArray["$$T0001789-81"]=".Michal, in the false statement that David was sick, in order";
navesArray["$$T0001789-82"]="to save him from Saul's violence";
navesArray["$$T0001789-83"]="# <a href=\"#\"onClick=\"return mV('1Sa',19,'12-17')\">1Sa 19:12-17</a>";
navesArray["$$T0001789-84"]=".The Amalekite who claimed to have killed Saul";
navesArray["$$T0001789-85"]="# <a href=\"#\"onClick=\"return mV('2Sa',1,'10-12')\">2Sa 1:10-12</a>";
navesArray["$$T0001789-86"]=".Hushai";
navesArray["$$T0001789-87"]="@In false professions to Absalom";
navesArray["$$T0001789-88"]="# <a href=\"#\"onClick=\"return mV('2Sa',16,'16-19')\">2Sa 16:16-19</a>";
navesArray["$$T0001789-89"]="@In his deceitful counsel to Absalom";
navesArray["$$T0001789-90"]="# <a href=\"#\"onClick=\"return mV('2Sa',17,'7-14')\">2Sa 17:7-14</a>";
navesArray["$$T0001789-91"]=".The wife of the Bahurimite who saved the lives of Hushai's";
navesArray["$$T0001789-92"]="messengers, sent to apprise David of the movements of";
navesArray["$$T0001789-93"]="Absalom's army";
navesArray["$$T0001789-94"]="# <a href=\"#\"onClick=\"return mV('2Sa',17,'15-22')\">2Sa 17:15-22</a>";
navesArray["$$T0001789-95"]=".The murder, under false pretense";
navesArray["$$T0001789-96"]="@Of Adonijah";
navesArray["$$T0001789-97"]="# <a href=\"#\"onClick=\"return mV('1Ki',2,23)\">1Ki 2:23</a>";
navesArray["$$T0001789-98"]="@Of Shimei";
navesArray["$$T0001789-99"]="# <a href=\"#\"onClick=\"return mV('1Ki',2,42,43)\">1Ki 2:42-43</a>";
navesArray["$$T0001789-100"]="@Of Jeroboam's wife";
navesArray["$$T0001789-101"]="# <a href=\"#\"onClick=\"return mV('1Ki',14,2)\">1Ki 14:2</a>";
navesArray["$$T0001789-102"]=".The old prophet of Beth-el who misguided the prophet of";
navesArray["$$T0001789-103"]="Judah";
navesArray["$$T0001789-104"]="# <a href=\"#\"onClick=\"return mV('1Ki',13,'11-22')\">1Ki 13:11-22</a>";
navesArray["$$T0001789-105"]=".Jeroboam's wife, feigning herself to be another woman";
navesArray["$$T0001789-106"]="# <a href=\"#\"onClick=\"return mV('1Ki',14,'5-7')\">1Ki 14:5-7</a>";
navesArray["$$T0001789-107"]=".The conspirators against Naboth";
navesArray["$$T0001789-108"]="# <a href=\"#\"onClick=\"return mV('1Ki',21,'7-13')\">1Ki 21:7-13</a>";
navesArray["$$T0001789-109"]=".Gehazi, when he ran after Naaman, and misrepresented that";
navesArray["$$T0001789-110"]="Elisha wanted a talent of silver and two changes of clothes";
navesArray["$$T0001789-111"]="# <a href=\"#\"onClick=\"return mV('2Ki',5,'20-24')\">2Ki 5:20-24</a>";
navesArray["$$T0001789-112"]=".Hazael, servant of the king of Syria, lied to the king in";
navesArray["$$T0001789-113"]="misstating the prophet Elisha's message with regard to the";
navesArray["$$T0001789-114"]="king's recovery";
navesArray["$$T0001789-115"]="# <a href=\"#\"onClick=\"return mV('2Ki',8,'7-15')\">2Ki 8:7-15</a>";
navesArray["$$T0001789-116"]=".Jehu lied to the worshipers of Baal in order to gain the";
navesArray["$$T0001789-117"]="advantage over them and destroy them";
navesArray["$$T0001789-118"]="# <a href=\"#\"onClick=\"return mV('2Ki',10,'18-28')\">2Ki 10:18-28</a>";
navesArray["$$T0001789-119"]=".Zedekiah, in violating his oath of allegiance to";
navesArray["$$T0001789-120"]="Nebuchadnezzer";
navesArray["$$T0001789-121"]="# <a href=\"#\"onClick=\"return mV('2Ch',36,13)\">2Ch 36:13</a>; <a href=\"#\"onClick=\"return mV('Eze',16,59)\">Eze 16:59</a>; <a href=\"#\"onClick=\"return mV('Eze',17,'15-20')\">17:15-20</a>";
navesArray["$$T0001789-122"]=".Samaritans, in their efforts to hinder the rebuilding of the";
navesArray["$$T0001789-123"]="temple at Jerusalem";
navesArray["$$T0001789-124"]="# <a href=\"#\"onClick=\"return mV('Ezr',4,'1-')\">Ezr 4</a>";
navesArray["$$T0001789-125"]=".Sanballat in trying to obstruct the rebuilding of Jerusalem";
navesArray["$$T0001789-126"]="# <a href=\"#\"onClick=\"return mV('Neh',6,'1-')\">Neh 6</a>";
navesArray["$$T0001789-127"]=".Haman, in his conspiracy against the Jews";
navesArray["$$T0001789-128"]="# <a href=\"#\"onClick=\"return mV('Est',3,8)\">Est 3:8</a>";
navesArray["$$T0001789-129"]=".Jeremiah's adversaries, in accusing him of joining the";
navesArray["$$T0001789-130"]="Chaldeans";
navesArray["$$T0001789-131"]="# <a href=\"#\"onClick=\"return mV('Jer',37,'13-15')\">Jer 37:13-15</a>";

navesArray["$$T0001789-134"]="# <a href=\"#\"onClick=\"return mV('Jer',42,20)\">Jer 42:20</a>";
navesArray["$$T0001789-135"]=".Herod the Great, to the wise men, in professing to desire to";
navesArray["$$T0001789-136"]="worship Jesus";
navesArray["$$T0001789-137"]="# <a href=\"#\"onClick=\"return mV('Mat',2,8)\">Mat 2:8</a>";
navesArray["$$T0001789-138"]=".Jewish leaders";
navesArray["$$T0001789-139"]="@In falsely accusing Jesus of being gluttonous and a";
navesArray["$$T0001789-140"]="winebibber (a wino)";
navesArray["$$T0001789-141"]="# <a href=\"#\"onClick=\"return mV('Mat',11,19)\">Mat 11:19</a>";
navesArray["$$T0001789-142"]="@In refusing to bear truthful testimony concerning John the";
navesArray["$$T0001789-143"]="Baptist";
navesArray["$$T0001789-144"]="# <a href=\"#\"onClick=\"return mV('Mat',21,'24-27')\">Mat 21:24-27</a>";
navesArray["$$T0001789-145"]="@Falsely accusing Jesus of blasphemy, when he forgave sin";

navesArray["$$T0001789-147"]="@And when Jesus announced that he was the Son of God";

navesArray["$$T0001789-149"]=".Peter, in denying Jesus";
navesArray["$$T0001789-150"]="# <a href=\"#\"onClick=\"return mV('Mat',26,'69-75')\">Mat 26:69-75</a>; <a href=\"#\"onClick=\"return mV('Mar',14,'68-71')\">Mar 14:68-71</a>; <a href=\"#\"onClick=\"return mV('Luk',22,'56-62')\">Luk 22:56-62</a>; <a href=\"#\"onClick=\"return mV('Jhn',18,'25-27')\">Jhn 18:25-27</a>";
navesArray["$$T0001789-151"]=".The Roman soldiers, who said the disciples stole the body of";
navesArray["$$T0001789-152"]="Jesus";
navesArray["$$T0001789-153"]="# <a href=\"#\"onClick=\"return mV('Mat',28,13,15)\">Mat 28:13, 15</a>";
navesArray["$$T0001789-154"]=".The disobedient son, who promised to work in the vineyard,";

navesArray["$$T0001789-160"]=".Stephen's accusers, who falsely accused him of blaspheming";

navesArray["$$T0001789-162"]="# <a href=\"#\"onClick=\"return mV('Act',6,'11-14')\">Act 6:11-14</a>";
