navesArray["$$T0002864-8"]="-INSTANCES OF";
navesArray["$$T0002864-9"]=".Of Moses and the Israelites, when Pharaoh and his army were";
navesArray["$$T0002864-10"]="destroyed";
navesArray["$$T0002864-11"]="# <a href=\"#\"onClick=\"return mV('Exd',15,'1-22')\">Exd 15:1-22</a>";
navesArray["$$T0002864-12"]=".Of Deborah and the Israelites, when Sisera was overthrown";
navesArray["$$T0002864-13"]="# <a href=\"#\"onClick=\"return mV('Jdg',5,'1-')\">Jdg 5</a>";
navesArray["$$T0002864-14"]=".Of Jephthah's daughter, when he returned from his victory";
navesArray["$$T0002864-15"]="over the Ammonites";
navesArray["$$T0002864-16"]="# <a href=\"#\"onClick=\"return mV('Jdg',11,34)\">Jdg 11:34</a>";
navesArray["$$T0002864-17"]=".Of Hannah, when Samuel was born";
navesArray["$$T0002864-18"]="# <a href=\"#\"onClick=\"return mV('1Sa',2,'1-11')\">1Sa 2:1-11</a>";
navesArray["$$T0002864-19"]=".Of Naomi, when Boaz showed kindness to Ruth";
navesArray["$$T0002864-20"]="# <a href=\"#\"onClick=\"return mV('Rth',2,20)\">Rth 2:20</a>; <a href=\"#\"onClick=\"return mV('Rth',4,14)\">4:14</a>";
navesArray["$$T0002864-21"]=".Of the Israelites";
navesArray["$$T0002864-22"]="@When Saul was presented as their king";
navesArray["$$T0002864-23"]="# <a href=\"#\"onClick=\"return mV('1Sa',10,24)\">1Sa 10:24</a>";
navesArray["$$T0002864-24"]="@When David killed Goliath";
navesArray["$$T0002864-25"]="# <a href=\"#\"onClick=\"return mV('1Sa',18,6,7)\">1Sa 18:6-7</a>";
navesArray["$$T0002864-26"]="@When they came to David to Hebron to make him king";
navesArray["$$T0002864-27"]="# <a href=\"#\"onClick=\"return mV('1Ch',12,40)\">1Ch 12:40</a>";
navesArray["$$T0002864-28"]="@When they took the ark of the covenant from Kirjath-jearim";
navesArray["$$T0002864-29"]="# <a href=\"#\"onClick=\"return mV('1Ch',13,8)\">1Ch 13:8</a>";
navesArray["$$T0002864-30"]="@When they brought the ark of the covenant from the house";
navesArray["$$T0002864-31"]="of Obed-edom to Jerusalem";
navesArray["$$T0002864-32"]="# <a href=\"#\"onClick=\"return mV('1Ch',15,16,25,28)\">1Ch 15:16, 25, 28</a>";
navesArray["$$T0002864-33"]="@When they made gifts to the house of God";
navesArray["$$T0002864-34"]="# <a href=\"#\"onClick=\"return mV('1Ch',29,9)\">1Ch 29:9</a>";
navesArray["$$T0002864-35"]="@When they observed the dedication of the temple, and the";
navesArray["$$T0002864-36"]="feast of tabernacles under Ezra";
navesArray["$$T0002864-37"]="# <a href=\"#\"onClick=\"return mV('Ezr',6,16,22)\">Ezr 6:16, 22</a>";
navesArray["$$T0002864-38"]=".Of the Jews, after hearing, anew, the word of God";
navesArray["$$T0002864-39"]="# <a href=\"#\"onClick=\"return mV('Neh',8,'9-18')\">Neh 8:9-18</a>";
navesArray["$$T0002864-40"]=".When they turned away from idolatry";
navesArray["$$T0002864-41"]="# <a href=\"#\"onClick=\"return mV('2Ch',15,14,15)\">2Ch 15:14-15</a>; <a href=\"#\"onClick=\"return mV('2Ch',23,18,21)\">23:18, 21</a>; <a href=\"#\"onClick=\"return mV('2Ch',29,30,36)\">29:30, 36</a>; <a href=\"#\"onClick=\"return mV('2Ch',30,21,23,26)\">30:21, 23, 26</a>";
navesArray["$$T0002864-42"]=".When the wall of Jerusalem was dedicated";
navesArray["$$T0002864-43"]="# <a href=\"#\"onClick=\"return mV('Neh',12,43)\">Neh 12:43</a>";
navesArray["$$T0002864-44"]=".When the foundation of the second temple was laid";
navesArray["$$T0002864-45"]="# <a href=\"#\"onClick=\"return mV('Ezr',3,'11-13')\">Ezr 3:11-13</a>";
navesArray["$$T0002864-46"]=".Of David, over the offerings of the princes and people for";
navesArray["$$T0002864-47"]="the house of God";
navesArray["$$T0002864-48"]="# <a href=\"#\"onClick=\"return mV('1Ch',29,'10-19')\">1Ch 29:10-19</a>";
navesArray["$$T0002864-49"]=".Jews, over the hanging of Haman";
navesArray["$$T0002864-50"]="# <a href=\"#\"onClick=\"return mV('Est',8,15,16)\">Est 8:15-16</a>; with <a href=\"#\"onClick=\"return mV('Est',7,10)\">Est 7:10</a>";
navesArray["$$T0002864-51"]=".Of Elisabeth, when Mary visited her";
navesArray["$$T0002864-52"]="# <a href=\"#\"onClick=\"return mV('Luk',1,'5-44')\">Luk 1:5-44</a>";
navesArray["$$T0002864-53"]=".Of Mary, when she visited Elisabeth";
navesArray["$$T0002864-54"]="# <a href=\"#\"onClick=\"return mV('Luk',1,'46-56')\">Luk 1:46-56</a>";
navesArray["$$T0002864-55"]=".Of Zecharias, when John the Baptist was born";
navesArray["$$T0002864-56"]="# <a href=\"#\"onClick=\"return mV('Luk',1,'67-79')\">Luk 1:67-79</a>";
navesArray["$$T0002864-57"]=".Of angels, when Jesus was born";
navesArray["$$T0002864-58"]="# <a href=\"#\"onClick=\"return mV('Luk',2,13,14)\">Luk 2:13-14</a>";
navesArray["$$T0002864-59"]=".Of the shepherds, when they saw the infant Jesus";
navesArray["$$T0002864-60"]="# <a href=\"#\"onClick=\"return mV('Luk',2,20)\">Luk 2:20</a>";
navesArray["$$T0002864-61"]=".Of the Magi";
navesArray["$$T0002864-62"]="# <a href=\"#\"onClick=\"return mV('Mat',2,10)\">Mat 2:10</a>";
navesArray["$$T0002864-63"]=".Of Simeon, when Jesus was presented in the temple";
navesArray["$$T0002864-64"]="# <a href=\"#\"onClick=\"return mV('Luk',2,'28-32')\">Luk 2:28-32</a>";
navesArray["$$T0002864-65"]=".Of the disciples, because the demons were subject to them";
navesArray["$$T0002864-66"]="# <a href=\"#\"onClick=\"return mV('Luk',10,17)\">Luk 10:17</a>";
navesArray["$$T0002864-67"]=".Of the father, when his prodigal son returned";
navesArray["$$T0002864-68"]="# <a href=\"#\"onClick=\"return mV('Luk',15,'20-32')\">Luk 15:20-32</a>";
navesArray["$$T0002864-69"]=".Of angels, when sinners repent";
navesArray["$$T0002864-70"]="# <a href=\"#\"onClick=\"return mV('Luk',15,7,10)\">Luk 15:7, 10</a>";
navesArray["$$T0002864-71"]=".Of the disciples, when Jesus triumphantly entered Jerusalem";
navesArray["$$T0002864-72"]="# <a href=\"#\"onClick=\"return mV('Mat',21,8,9)\">Mat 21:8-9</a>; <a href=\"#\"onClick=\"return mV('Mar',11,'8-10')\">Mar 11:8-10</a>";
navesArray["$$T0002864-73"]=".Of the women who returned from the Lord's sepulcher";
navesArray["$$T0002864-74"]="# <a href=\"#\"onClick=\"return mV('Mat',28,8)\">Mat 28:8</a>";
navesArray["$$T0002864-75"]=".The disciple, after the resurrection of Jesus";
navesArray["$$T0002864-76"]="# <a href=\"#\"onClick=\"return mV('Luk',24,41)\">Luk 24:41</a>";
navesArray["$$T0002864-77"]=".Of the disciples in the temple after the ascension of Jesus";
navesArray["$$T0002864-78"]="# <a href=\"#\"onClick=\"return mV('Luk',24,53)\">Luk 24:53</a>";
navesArray["$$T0002864-79"]=".Of the disciples in the temple because they had received the";
navesArray["$$T0002864-80"]="gift of the Holy Spirit";
navesArray["$$T0002864-81"]="# <a href=\"#\"onClick=\"return mV('Act',2,46,47)\">Act 2:46-47</a>";
navesArray["$$T0002864-82"]=".Of the immobile man who was healed by Peter";
navesArray["$$T0002864-83"]="# <a href=\"#\"onClick=\"return mV('Act',3,8)\">Act 3:8</a>";

navesArray["$$T0002864-85"]="# <a href=\"#\"onClick=\"return mV('Act',20,'22-24')\">Act 20:22-24</a>";
navesArray["$$T0002864-86"]=".Of Paul and Silas, in the jail at Philippi";
navesArray["$$T0002864-87"]="# <a href=\"#\"onClick=\"return mV('Act',16,25)\">Act 16:25</a>";
navesArray["$$T0002864-88"]=".Of Rhoda, when she heard Peter at the gate";
navesArray["$$T0002864-89"]="# <a href=\"#\"onClick=\"return mV('Act',12,14)\">Act 12:14</a>";
navesArray["$$T0002864-90"]=".Of the disciples at Jerusalem, when Peter told them about";
navesArray["$$T0002864-91"]="the conversion of Cornelius and other Gentiles";
navesArray["$$T0002864-92"]="# <a href=\"#\"onClick=\"return mV('Act',11,18)\">Act 11:18</a>";
navesArray["$$T0002864-93"]=".Of Barnabas, when he saw the success of the gospel at";
navesArray["$$T0002864-94"]="Antioch (in Syria)";
navesArray["$$T0002864-95"]="# <a href=\"#\"onClick=\"return mV('Act',11,22,23)\">Act 11:22-23</a>";
navesArray["$$T0002864-96"]=".Of Paul and the Corinthians, because the excommunicated";
navesArray["$$T0002864-97"]="member repented";
navesArray["$$T0002864-98"]="# <a href=\"#\"onClick=\"return mV('2Cr',1,24)\">2Cr 1:24</a>; <a href=\"#\"onClick=\"return mV('2Cr',2,3)\">2:3</a>";
navesArray["$$T0002864-99"]=".Of Paul and Titus, because of the hospitality of the";
navesArray["$$T0002864-100"]="Corinthians";
navesArray["$$T0002864-101"]="# <a href=\"#\"onClick=\"return mV('2Cr',7,13)\">2Cr 7:13</a>; with <a href=\"#\"onClick=\"return mV('2Cr',8,6)\">2Cr 8:6</a>; <a href=\"#\"onClick=\"return mV('Rom',15,32)\">Rom 15:32</a>; <a href=\"#\"onClick=\"return mV('1Cr',16,18)\">1Cr 16:18</a>";
navesArray["$$T0002864-102"]=".Of the Macedonian Christians, when they made a contribution";
navesArray["$$T0002864-103"]="for the Christians at Jerusalem";
navesArray["$$T0002864-104"]="# <a href=\"#\"onClick=\"return mV('2Cr',8,2)\">2Cr 8:2</a>";
navesArray["$$T0002864-105"]=".Of Paul, when he prayed for the Philippian Christians";
navesArray["$$T0002864-106"]="# <a href=\"#\"onClick=\"return mV('Phl',1,4)\">Phl 1:4</a>";
navesArray["$$T0002864-107"]=".Of Thessalonians, when they believed Paul's gospel";
navesArray["$$T0002864-108"]="# <a href=\"#\"onClick=\"return mV('1Th',1,6)\">1Th 1:6</a>";
navesArray["$$T0002864-109"]=".Of Paul, rejoicing over his converts";
navesArray["$$T0002864-110"]="# <a href=\"#\"onClick=\"return mV('1Th',2,19,20)\">1Th 2:19-20</a>; <a href=\"#\"onClick=\"return mV('1Th',3,9)\">3:9</a>; <a href=\"#\"onClick=\"return mV('Phm',1,7)\">Phm 1:7</a>";
