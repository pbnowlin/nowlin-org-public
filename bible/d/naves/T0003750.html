navesArray["$$T0003764-62"]="-Visits Perga in Pamphylia";
navesArray["$$T0003764-63"]="# <a href=\"#\"onClick=\"return mV('Act',13,13)\">Act 13:13</a>";
navesArray["$$T0003764-64"]="-John (Mark), a companion of, departs for Jerusalem";
navesArray["$$T0003764-65"]="# <a href=\"#\"onClick=\"return mV('Act',13,13)\">Act 13:13</a>";
navesArray["$$T0003764-66"]="-Visits Antioch (in Pisidia), and preaches in the synagogue";
navesArray["$$T0003764-67"]="# <a href=\"#\"onClick=\"return mV('Act',13,'14-41')\">Act 13:14-41</a>";
navesArray["$$T0003764-68"]="-His message received gladly by the Gentiles";
navesArray["$$T0003764-69"]="# <a href=\"#\"onClick=\"return mV('Act',13,42,49)\">Act 13:42, 49</a>";
navesArray["$$T0003764-70"]="-Persecuted and expelled";
navesArray["$$T0003764-71"]="# <a href=\"#\"onClick=\"return mV('Act',13,50,51)\">Act 13:50-51</a>";
navesArray["$$T0003764-72"]="-Visits Iconium, and preaches to the Jews and non-Jews; is persecuted; escapes to Lystra; goes to Derbe";
navesArray["$$T0003764-73"]="";
navesArray["$$T0003764-74"]="# <a href=\"#\"onClick=\"return mV('Act',14,'1-6')\">Act 14:1-6</a>";
navesArray["$$T0003764-75"]="-Heals an immobile man";
navesArray["$$T0003764-76"]="# <a href=\"#\"onClick=\"return mV('Act',14,'8-10')\">Act 14:8-10</a>";
navesArray["$$T0003764-77"]="-The people attempt to worship him";
navesArray["$$T0003764-78"]="# <a href=\"#\"onClick=\"return mV('Act',14,'11-18')\">Act 14:11-18</a>";
navesArray["$$T0003764-79"]="-Is persecuted by certain Jews from Antioch and Iconium, and is stoned";
navesArray["$$T0003764-80"]="";
navesArray["$$T0003764-81"]="# <a href=\"#\"onClick=\"return mV('Act',14,19)\">Act 14:19</a>; <a href=\"#\"onClick=\"return mV('2Cr',11,25)\">2Cr 11:25</a>; <a href=\"#\"onClick=\"return mV('2Ti',3,11)\">2Ti 3:11</a>";
navesArray["$$T0003764-82"]="-Escapes to Derbe, where he preaches the gospel, and returns to Lystra, and to Iconium, and to Antioch, strengthens the souls of the disciples, exhorts them to continue in the faith, and helps to appoint elders";
navesArray["$$T0003764-83"]="";
navesArray["$$T0003764-84"]="";
navesArray["$$T0003764-85"]="";
navesArray["$$T0003764-86"]="# <a href=\"#\"onClick=\"return mV('Act',14,'19-23')\">Act 14:19-23</a>";
navesArray["$$T0003764-87"]="-Re-visits Pisidia, Pamphylia, Perga, Attalia, and Antioch, in Syria, where he lived";
navesArray["$$T0003764-88"]="";
navesArray["$$T0003764-89"]="# <a href=\"#\"onClick=\"return mV('Act',14,'24-28')\">Act 14:24-28</a>";
navesArray["$$T0003764-90"]="-Contends with the Judaizers against their circumcision \"theology\"";
navesArray["$$T0003764-91"]="";
navesArray["$$T0003764-92"]="# <a href=\"#\"onClick=\"return mV('Act',15,1,2)\">Act 15:1-2</a>";
navesArray["$$T0003764-93"]="-Refers the question of circumcision to the apostles and elders at Jerusalem";
navesArray["$$T0003764-94"]="";
navesArray["$$T0003764-95"]="# <a href=\"#\"onClick=\"return mV('Act',15,2,4)\">Act 15:2,24</a>";
navesArray["$$T0003764-96"]="-He declares to the apostles at Jerusalem the miracles and wonders God had performed among the Gentiles by them";
navesArray["$$T0003764-97"]="";
navesArray["$$T0003764-98"]="# <a href=\"#\"onClick=\"return mV('Act',15,12)\">Act 15:12</a>";
navesArray["$$T0003764-99"]="-Returns to Antioch, accompanied by Barnabas, Judas, and Silas, with letters to the Gentiles";
navesArray["$$T0003764-100"]="";
navesArray["$$T0003764-101"]="# <a href=\"#\"onClick=\"return mV('Act',15,22,25)\">Act 15:22, 25</a>";
navesArray["$$T0003764-102"]="-Makes his second tour of the congregations";
navesArray["$$T0003764-103"]="# <a href=\"#\"onClick=\"return mV('Act',15,36)\">Act 15:36</a>";
navesArray["$$T0003764-104"]="-Chooses Silas as his companion, and passes through Syria and Cilicia, strengthening the congregations";
navesArray["$$T0003764-105"]="";
navesArray["$$T0003764-106"]="# <a href=\"#\"onClick=\"return mV('Act',15,'36-41')\">Act 15:36-41</a>";
navesArray["$$T0003764-107"]="-Visits Lystra; circumcises Timothy";
navesArray["$$T0003764-108"]="# <a href=\"#\"onClick=\"return mV('Act',16,'1-5')\">Act 16:1-5</a>";
navesArray["$$T0003764-109"]="-Goes through Phrygia and Galatia; is forbidden by the Holy Spirit to preach in Asia; visits Mysia; attempts to go to Bithynia, but is restrained by the Spirit";
navesArray["$$T0003764-110"]="";
navesArray["$$T0003764-111"]="";
navesArray["$$T0003764-112"]="# <a href=\"#\"onClick=\"return mV('Act',16,6,7)\">Act 16:6-7</a>";
navesArray["$$T0003764-113"]="-Goes to Troas, where he has a vision of a man saying, Come over into Macedonia, and help us; immediately proceeds to Macedonia";
navesArray["$$T0003764-114"]="";
navesArray["$$T0003764-115"]="";
navesArray["$$T0003764-116"]="# <a href=\"#\"onClick=\"return mV('Act',16,'8-10')\">Act 16:8-10</a>";
navesArray["$$T0003764-117"]="-Visits Samothracia and Neapolis; comes to Philippi, the chief city of Macedonia; visits a place of prayer at the side of the river; preaches the word; the merchant, Lydia, from Thyatira, is converted and immersed";
navesArray["$$T0003764-118"]="";
navesArray["$$T0003764-119"]="";
navesArray["$$T0003764-120"]="";
navesArray["$$T0003764-121"]="# <a href=\"#\"onClick=\"return mV('Act',16,'11-15')\">Act 16:11-15</a>";
navesArray["$$T0003764-122"]="-Reproves the soothsayer; causes the evil spirit to come out of the girl who practises divination";
navesArray["$$T0003764-123"]="";
navesArray["$$T0003764-124"]="# <a href=\"#\"onClick=\"return mV('Act',16,'16-18')\">Act 16:16-18</a>";
navesArray["$$T0003764-125"]="-Persecuted, beaten, and cast into prison with Silas; sings songs of praise in the prison; an earthquake shakes the prison; he preaches to the alarmed jailer, who believes, and is immersed along with his household";
navesArray["$$T0003764-126"]="";
navesArray["$$T0003764-127"]="";
navesArray["$$T0003764-128"]="";
navesArray["$$T0003764-129"]="# <a href=\"#\"onClick=\"return mV('Act',16,'19-34')\">Act 16:19-34</a>";
navesArray["$$T0003764-130"]="-Is released by the civil authorities on the grounds of his being a Roman citizen";
navesArray["$$T0003764-131"]="";
navesArray["$$T0003764-132"]="# <a href=\"#\"onClick=\"return mV('Act',16,'35-39')\">Act 16:35-39</a>; <a href=\"#\"onClick=\"return mV('2Cr',6,5)\">2Cr 6:5</a>; <a href=\"#\"onClick=\"return mV('2Cr',11,25)\">11:25</a>; <a href=\"#\"onClick=\"return mV('1Th',2,2)\">1Th 2:2</a>";
navesArray["$$T0003764-133"]="-Is welcomed at the household of Lydia";
navesArray["$$T0003764-134"]="# <a href=\"#\"onClick=\"return mV('Act',16,40)\">Act 16:40</a>";
navesArray["$$T0003764-135"]="-Visits Amphipolis, Apollonia, and Thessalonica; preaches in the synagogue";
navesArray["$$T0003764-136"]="";
navesArray["$$T0003764-137"]="# <a href=\"#\"onClick=\"return mV('Act',17,'1-4')\">Act 17:1-4</a>";
navesArray["$$T0003764-138"]="-Is persecuted";
navesArray["$$T0003764-139"]="# <a href=\"#\"onClick=\"return mV('Act',17,'5-9')\">Act 17:5-9</a>; <a href=\"#\"onClick=\"return mV('2Th',1,'1-4')\">2Th 1:1-4</a>";
navesArray["$$T0003764-140"]="-Escapes to Berea by night; preaches in the synagogue; many honorable women and several men believe";
navesArray["$$T0003764-141"]="";
navesArray["$$T0003764-142"]="# <a href=\"#\"onClick=\"return mV('Act',17,'10-12')\">Act 17:10-12</a>";
navesArray["$$T0003764-143"]="-Persecuted by the Jews who come from Thessalonica; is escorted by some of the brethren to Athens";
navesArray["$$T0003764-144"]="";
navesArray["$$T0003764-145"]="# <a href=\"#\"onClick=\"return mV('Act',17,'13-15')\">Act 17:13-15</a>";
navesArray["$$T0003764-146"]="-Debates on Mars' Hill (at the meeting of the Areopagus Council) with Greeks";
navesArray["$$T0003764-147"]="";
navesArray["$$T0003764-148"]="# <a href=\"#\"onClick=\"return mV('Act',17,'16-34')\">Act 17:16-34</a>";
navesArray["$$T0003764-149"]="-Visits Corinth; lives with Aquila and his wife, Priscilla (Prisca), who were tentmakers; joins in their trade";
navesArray["$$T0003764-150"]="";
navesArray["$$T0003764-151"]="# <a href=\"#\"onClick=\"return mV('Act',18,'1-3')\">Act 18:1-3</a>";
navesArray["$$T0003764-152"]="-Reasons in the synagogue every Sabbath; is rejected by the Jews; turns to the Gentiles; makes his home with Justus; continues there for eighteen months, teaching the word of God";
navesArray["$$T0003764-153"]="";
navesArray["$$T0003764-154"]="";
navesArray["$$T0003764-155"]="# <a href=\"#\"onClick=\"return mV('Act',18,'4-11')\">Act 18:4-11</a>";
navesArray["$$T0003764-156"]="-Persecuted by Jews, drawn before the deputy, charged with wicked lewdness; accusation dismissed; takes his leave after many days, and sails to Syria, accompanied by Aquila and Priscilla";
navesArray["$$T0003764-157"]="";
navesArray["$$T0003764-158"]="";
navesArray["$$T0003764-159"]="";
navesArray["$$T0003764-160"]="# <a href=\"#\"onClick=\"return mV('Act',18,'12-18')\">Act 18:12-18</a>";
navesArray["$$T0003764-161"]="-Visits Ephesus, where he leaves Aquila and Priscilla; enters into a synagogue, where he reasons with the Jews; starts on his return trip to Jerusalem; visits Caesarea; crosses over the country of Galatia and Phrygia, strengthening the disciples";
navesArray["$$T0003764-162"]="";
navesArray["$$T0003764-163"]="";
navesArray["$$T0003764-164"]="";
navesArray["$$T0003764-165"]="";
navesArray["$$T0003764-166"]="# <a href=\"#\"onClick=\"return mV('Act',18,'18-23')\">Act 18:18-23</a>";
navesArray["$$T0003764-167"]="-Returns to Ephesus; immerses in the name of the Lord Jesus, and lays his hands upon the disciples, who are baptized with the Holy Spirit; preaches in the synagogue; remains in Ephesus for two years; heals the sick people";
navesArray["$$T0003764-168"]="";
navesArray["$$T0003764-169"]="";
navesArray["$$T0003764-170"]="";
navesArray["$$T0003764-171"]="# <a href=\"#\"onClick=\"return mV('Act',19,12)\">Act 19:12</a>";
navesArray["$$T0003764-172"]="-Rebukes the exorcists; casts an evil spirit out of a man, and many believe, bringing their evil books of sorcery to be burned";
navesArray["$$T0003764-173"]="";
navesArray["$$T0003764-174"]="";
navesArray["$$T0003764-175"]="# <a href=\"#\"onClick=\"return mV('Act',19,'13-20')\">Act 19:13-20</a>; <a href=\"#\"onClick=\"return mV('1Cr',16,8,9)\">1Cr 16:8-9</a>";
navesArray["$$T0003764-176"]="-Sends Timothy and Erastus into Macedonia, but he himself remains in Asia for a period of time";
navesArray["$$T0003764-177"]="";
navesArray["$$T0003764-178"]="# <a href=\"#\"onClick=\"return mV('Act',19,21,22)\">Act 19:21-22</a>";
navesArray["$$T0003764-179"]="-The spread of the gospel through his preaching interferes with the makers of idols; he is persecuted, and a great uproar of the city is created; the town clerk appeases the people; dismisses the accusation against Paul, and disperses the people";
navesArray["$$T0003764-180"]="";
navesArray["$$T0003764-181"]="";
navesArray["$$T0003764-182"]="";
navesArray["$$T0003764-183"]="";
navesArray["$$T0003764-184"]="# <a href=\"#\"onClick=\"return mV('Act',19,'23-41')\">Act 19:23-41</a>; <a href=\"#\"onClick=\"return mV('2Cr',1,8)\">2Cr 1:8</a>; <a href=\"#\"onClick=\"return mV('2Ti',4,14)\">2Ti 4:14</a>";
navesArray["$$T0003764-185"]="-Proceeds to Macedonia after strengthening the congregations in that region; comes into Greece and lives for three months; returns through Macedonia, accompanied by Sopater, Aristarchus, Secundus, Gaius, Timothy, Tychicus, and Trophimus";
navesArray["$$T0003764-186"]="";
navesArray["$$T0003764-187"]="";
navesArray["$$T0003764-188"]="";
navesArray["$$T0003764-189"]="# <a href=\"#\"onClick=\"return mV('Act',20,'1-6')\">Act 20:1-6</a>";
navesArray["$$T0003764-190"]="-Visits Troas; preaches until daybreak; restores to life the young man (Eutychus) who fell from the window";
navesArray["$$T0003764-191"]="";
navesArray["$$T0003764-192"]="# <a href=\"#\"onClick=\"return mV('Act',20,'6-12')\">Act 20:6-12</a>";
navesArray["$$T0003764-193"]="-Visits Assos, Mitylene, Chios, Samos, Trogyllium, and Miletus, hastening to Jerusalem, to be there by Pentecost day";
navesArray["$$T0003764-194"]="";
navesArray["$$T0003764-195"]="# <a href=\"#\"onClick=\"return mV('Act',20,'13-16')\">Act 20:13-16</a>";
navesArray["$$T0003764-196"]="-Sends for the elders of the congregation of Ephesus; relates to them how he had preached in Asia and his temptations and afflictions, urging repentance toward God";
navesArray["$$T0003764-197"]="";
navesArray["$$T0003764-198"]="";
navesArray["$$T0003764-199"]="# <a href=\"#\"onClick=\"return mV('Act',20,'17-21')\">Act 20:17-21</a>";
navesArray["$$T0003764-200"]="-Declares he was going bound in spirit to Jerusalem; exhorts them to take heed to themselves and the flock over whom the Holy Spirit had made them overseers; kneels down, prays, and leaves";
navesArray["$$T0003764-201"]="";
navesArray["$$T0003764-202"]="";
navesArray["$$T0003764-203"]="";
navesArray["$$T0003764-204"]="# <a href=\"#\"onClick=\"return mV('Act',20,'22-38')\">Act 20:22-38</a>";
navesArray["$$T0003764-205"]="-Visits Coos, Rhodes, and Patara; boards a ship bound for Tyre";
navesArray["$$T0003764-206"]="# <a href=\"#\"onClick=\"return mV('Act',21,'1-3')\">Act 21:1-3</a>";
navesArray["$$T0003764-207"]="-Waits at Tyre for seven days; is brought on his way by the disciples to the outskirts of the city; kneels down and prays; boards the ship; comes to Ptolemais; greets the brethren, and stays for one day";
navesArray["$$T0003764-208"]="";
navesArray["$$T0003764-209"]="";
navesArray["$$T0003764-210"]="";
navesArray["$$T0003764-211"]="# <a href=\"#\"onClick=\"return mV('Act',21,'4-7')\">Act 21:4-7</a>";
navesArray["$$T0003764-212"]="-Departs for Caesarea; enters the house of Philip the evangelist; is admonished by the prophet Agabus not to go to Jerusalem; nevertheless, he proceeds to Jerusalem";
navesArray["$$T0003764-213"]="";
navesArray["$$T0003764-214"]="";
navesArray["$$T0003764-215"]="# <a href=\"#\"onClick=\"return mV('Act',21,'8-15')\">Act 21:8-15</a>";
navesArray["$$T0003764-216"]="-Is received by the brethren gladly; talks about the things that had been done among the Gentiles through his ministry";
navesArray["$$T0003764-217"]="";
navesArray["$$T0003764-218"]="# <a href=\"#\"onClick=\"return mV('Act',21,'17-25')\">Act 21:17-25</a>";
navesArray["$$T0003764-219"]="-Enters the temple courtyard; the people are stirred up against him by some Jews from Asia; an uproar is created; he is thrust out of the temple area; the commander of the Roman garrison intervenes and arrests him";
navesArray["$$T0003764-220"]="";
navesArray["$$T0003764-221"]="";
navesArray["$$T0003764-222"]="";
navesArray["$$T0003764-223"]="# <a href=\"#\"onClick=\"return mV('Act',21,'26-33')\">Act 21:26-33</a>";
navesArray["$$T0003764-224"]="-His defense";
navesArray["$$T0003764-225"]="# <a href=\"#\"onClick=\"return mV('Act',21,'33-40')\">Act 21:33-40</a>; <a href=\"#\"onClick=\"return mV('Act',22,'1-21')\">22:1-21</a>";
navesArray["$$T0003764-226"]="-Is confined in the fortress";
navesArray["$$T0003764-227"]="# <a href=\"#\"onClick=\"return mV('Act',22,'24-30')\">Act 22:24-30</a>";
navesArray["$$T0003764-228"]="-Is brought before the Sanhedrin; his defense";
navesArray["$$T0003764-229"]="# <a href=\"#\"onClick=\"return mV('Act',22,30)\">Act 22:30</a>; <a href=\"#\"onClick=\"return mV('Act',23,'1-5')\">23:1-5</a>";
navesArray["$$T0003764-230"]="-Is returned to the fortress";
navesArray["$$T0003764-231"]="# <a href=\"#\"onClick=\"return mV('Act',23,10)\">Act 23:10</a>";
navesArray["$$T0003764-232"]="-Is encouraged by a vision from God, promising him that he will give testimony in Rome";
navesArray["$$T0003764-233"]="";
navesArray["$$T0003764-234"]="# <a href=\"#\"onClick=\"return mV('Act',23,11)\">Act 23:11</a>";
navesArray["$$T0003764-235"]="-Jewish leaders conspire against his life";
navesArray["$$T0003764-236"]="# <a href=\"#\"onClick=\"return mV('Act',23,'12-15')\">Act 23:12-15</a>";
navesArray["$$T0003764-237"]="-This plan is thwarted by his nephew";
navesArray["$$T0003764-238"]="# <a href=\"#\"onClick=\"return mV('Act',23,'16-22')\">Act 23:16-22</a>";
navesArray["$$T0003764-239"]="-Is escorted to Caesarea by a military guard";
navesArray["$$T0003764-240"]="# <a href=\"#\"onClick=\"return mV('Act',23,'23-33')\">Act 23:23-33</a>";
navesArray["$$T0003764-241"]="-Is confined in Herod's Judgment Hall in Caesarea";
navesArray["$$T0003764-242"]="# <a href=\"#\"onClick=\"return mV('Act',23,35)\">Act 23:35</a>";
navesArray["$$T0003764-243"]="-His trial before Governor Felix";
navesArray["$$T0003764-244"]="# <a href=\"#\"onClick=\"return mV('Act',24,'1-')\">Act 24</a>";
navesArray["$$T0003764-245"]="-Remains in custody for two years";
navesArray["$$T0003764-246"]="# <a href=\"#\"onClick=\"return mV('Act',24,27)\">Act 24:27</a>";
navesArray["$$T0003764-247"]="-His trial before Governor Festus";
navesArray["$$T0003764-248"]="# <a href=\"#\"onClick=\"return mV('Act',25,'1-12')\">Act 25:1-12</a>";
navesArray["$$T0003764-249"]="-Appeals to be heard by Caesar";
navesArray["$$T0003764-250"]="# <a href=\"#\"onClick=\"return mV('Act',25,'10-12')\">Act 25:10-12</a>";
navesArray["$$T0003764-251"]="-His examination before Herod Agrippa II";
navesArray["$$T0003764-252"]="# <a href=\"#\"onClick=\"return mV('Act',25,'13-27')\">Act 25:13-27</a>; <a href=\"#\"onClick=\"return mV('Act',26,'1-')\">26</a>";
navesArray["$$T0003764-253"]="-Is taken to Rome in the custody of Julius, a centurion, and a detachment of soldiers; boards a ship, accompanied by other prisoners, and sails by way of the coasts of Asia; stops at Sidon, and at Myra";
navesArray["$$T0003764-254"]="";
navesArray["$$T0003764-255"]="";
navesArray["$$T0003764-256"]="";
navesArray["$$T0003764-257"]="# <a href=\"#\"onClick=\"return mV('Act',27,'1-5')\">Act 27:1-5</a>";
navesArray["$$T0003764-258"]="-Transferred to a ship of Alexandria; sails by way of Cnidus, Crete, Salamis, and the Fair Havens";
navesArray["$$T0003764-259"]="";
navesArray["$$T0003764-260"]="# <a href=\"#\"onClick=\"return mV('Act',27,'6-8')\">Act 27:6-8</a>";
navesArray["$$T0003764-261"]="-Predicts misfortune to the ship; his counsel not heeded, and the voyage resumes";
navesArray["$$T0003764-262"]="";
navesArray["$$T0003764-263"]="# <a href=\"#\"onClick=\"return mV('Act',27,'9-13')\">Act 27:9-13</a>";
navesArray["$$T0003764-264"]="-The ship encounters a storm; Paul encourages and comforts the officers and crew; the soldiers advise putting the prisoners to death; the centurion interferes, and all on board (consisting of two-hundred and seventy-six persons) survive";
navesArray["$$T0003764-265"]="";
navesArray["$$T0003764-266"]="";
navesArray["$$T0003764-267"]="";
navesArray["$$T0003764-268"]="# <a href=\"#\"onClick=\"return mV('Act',27,'14-44')\">Act 27:14-44</a>";
navesArray["$$T0003764-269"]="-The ship is wrecked, and all on board take refuge on the island of Melita (Malta)";
navesArray["$$T0003764-270"]="";
navesArray["$$T0003764-271"]="# <a href=\"#\"onClick=\"return mV('Act',27,'14-44')\">Act 27:14-44</a>";
navesArray["$$T0003764-272"]="-Kind treatment by the inhabitants of the island";
navesArray["$$T0003764-273"]="# <a href=\"#\"onClick=\"return mV('Act',28,1,2)\">Act 28:1-2</a>";
navesArray["$$T0003764-274"]="-Is bitten by a viper and miraculously unharmed";
navesArray["$$T0003764-275"]="# <a href=\"#\"onClick=\"return mV('Act',28,'3-6')\">Act 28:3-6</a>";
navesArray["$$T0003764-276"]="-Heals the ruler's father and others";
navesArray["$$T0003764-277"]="# <a href=\"#\"onClick=\"return mV('Act',28,'7-10')\">Act 28:7-10</a>";
navesArray["$$T0003764-278"]="-Is delayed in Melita (Malta) for three months; proceeds on the voyage; delays at Syracuse; sails by Rhegium and Puteoli";
navesArray["$$T0003764-279"]="";
navesArray["$$T0003764-280"]="# <a href=\"#\"onClick=\"return mV('Act',28,'11-13')\">Act 28:11-13</a>";
navesArray["$$T0003764-281"]="-Meets some brethren who accompany him to Rome from Appii Forum; arrives at Rome; is delivered to the captain of the guard; is permitted to live by himself in custody of a soldier";
navesArray["$$T0003764-282"]="";
navesArray["$$T0003764-283"]="";
navesArray["$$T0003764-284"]="# <a href=\"#\"onClick=\"return mV('Act',28,'14-16')\">Act 28:14-16</a>";
navesArray["$$T0003764-285"]="-Summons the local Jewish leadership; states his position; is kindly received; expounds the gospel; testifies to the kingdom of heaven";
navesArray["$$T0003764-286"]="";
navesArray["$$T0003764-287"]="";
navesArray["$$T0003764-288"]="# <a href=\"#\"onClick=\"return mV('Act',28,'17-29')\">Act 28:17-29</a>";
navesArray["$$T0003764-289"]="-Lives in his own rented house for two years, preaching and teaching";
navesArray["$$T0003764-290"]="";
navesArray["$$T0003764-291"]="# <a href=\"#\"onClick=\"return mV('Act',28,30,31)\">Act 28:30-31</a>";
navesArray["$$T0003764-292"]="-Supports himself";
navesArray["$$T0003764-293"]="# <a href=\"#\"onClick=\"return mV('Act',18,3)\">Act 18:3</a>; <a href=\"#\"onClick=\"return mV('Act',20,'33-35')\">20:33-35</a>";
navesArray["$$T0003764-294"]="-Sickness of, in Asia";
navesArray["$$T0003764-295"]="# <a href=\"#\"onClick=\"return mV('2Cr',1,'8-11')\">2Cr 1:8-11</a>";
