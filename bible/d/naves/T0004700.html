navesArray["$$T0004744-12"]="# <a href=\"#\"onClick=\"return mV('1Sa',5,5)\">1Sa 5:5</a>";

navesArray["$$T0004744-17"]="# <a href=\"#\"onClick=\"return mV('Jer',44,'17-19')\">Jer 44:17-19</a>";
navesArray["$$T0004744-18"]=".Nebuchadnezzar, supposing that the spirit of the gods was";

navesArray["$$T0004744-23"]=".The disciples, supposing they saw a ghost when Jesus came";
navesArray["$$T0004744-24"]="walking upon the lake";
