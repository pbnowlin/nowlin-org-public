navesArray["$$T0003466-54"]="# <a href=\"#\"onClick=\"return mV('Isa',5,12)\">Isa 5:12</a>; <a href=\"#\"onClick=\"return mV('Isa',14,11)\">14:11</a>; <a href=\"#\"onClick=\"return mV('Amo',5,23)\">Amo 5:23</a>; <a href=\"#\"onClick=\"return mV('Amo',6,5)\">6:5</a>";
navesArray["$$T0003466-55"]="-SYMBOLS USED IN";
navesArray["$$T0003466-56"]="-ALAMOTH";
navesArray["$$T0003466-57"]=".(Literally virgins)";
navesArray["$$T0003466-58"]=".A musical term which appears in";
navesArray["$$T0003466-59"]="# <a href=\"#\"onClick=\"return mV('1Ch',15,20)\">1Ch 15:20</a>";
navesArray["$$T0003466-60"]=".And in the title of";
navesArray["$$T0003466-61"]="# <a href=\"#\"onClick=\"return mV('Psa',46,1)\">Psa 46:1</a>";
navesArray["$$T0003466-62"]=".(It seems to indicate the rendering of the song by female";
navesArray["$$T0003466-63"]="voices, possibly soprano)";
navesArray["$$T0003466-64"]="-AL-TASCHITH";
navesArray["$$T0003466-65"]=".It appears in the titles of";
navesArray["$$T0003466-66"]="# <a href=\"#\"onClick=\"return mV('Psa',57,1)\">Psa 57:1</a>; <a href=\"#\"onClick=\"return mV('Psa',58,1)\">58:1</a>; <a href=\"#\"onClick=\"return mV('Psa',59,1)\">59:1</a>; <a href=\"#\"onClick=\"return mV('Psa',75,1)\">75:1</a>";
navesArray["$$T0003466-67"]=".(it seems to have been used to indicate the kind of ode, or";
navesArray["$$T0003466-68"]="the kind of melody in which the ode should be sung.)";
navesArray["$$T0003466-69"]="-HIGGAION";
navesArray["$$T0003466-70"]="# <a href=\"#\"onClick=\"return mV('Psa',92,3)\">Psa 92:3</a>";
navesArray["$$T0003466-71"]=".(According to Gesenius, it signifies the murmuring tone of a";
navesArray["$$T0003466-72"]="harp, and hence that the music should be rendered in a";
navesArray["$$T0003466-73"]="plaintive manner.)";
navesArray["$$T0003466-74"]="# <a href=\"#\"onClick=\"return mV('Psa',9,16)\">Psa 9:16</a>";
navesArray["$$T0003466-75"]=".(Combined with \"Selah,\" it may have been intended to indicate";
navesArray["$$T0003466-76"]="a pause in the vocal music while the instruments rendered an";
navesArray["$$T0003466-77"]="interlude.)";
navesArray["$$T0003466-78"]="# <a href=\"#\"onClick=\"return mV('Psa',19,14)\">Psa 19:14</a>";
navesArray["$$T0003466-79"]=".(Mendelssohn translates it \"meditation, thought.\" Hence, the";
navesArray["$$T0003466-80"]="music was to be rendered in a mode to promote devout";
navesArray["$$T0003466-81"]="meditation.)";
navesArray["$$T0003466-82"]="-MAKALATH, MASCHIL, LEANNOTH";
navesArray["$$T0003466-83"]=".These terms are found in the titles of";
navesArray["$$T0003466-84"]="# <a href=\"#\"onClick=\"return mV('Psa',53,1)\">Psa 53:1</a>; <a href=\"#\"onClick=\"return mV('Psa',88,1)\">88:1</a>";
navesArray["$$T0003466-85"]=".(Authorities grope in darkness as to their signification.";
navesArray["$$T0003466-86"]="They may indicate the instruments to be played, or the melody";
navesArray["$$T0003466-87"]="to be sung)";
navesArray["$$T0003466-88"]="-MASCHIL";
navesArray["$$T0003466-89"]=".This musical sign occurs in the titles of";
navesArray["$$T0003466-90"]="# <a href=\"#\"onClick=\"return mV('Psa',32,1)\">Psa 32:1</a>; <a href=\"#\"onClick=\"return mV('Psa',42,1)\">42:1</a>; <a href=\"#\"onClick=\"return mV('Psa',44,1)\">44:1</a>; <a href=\"#\"onClick=\"return mV('Psa',45,1)\">45:1</a>; <a href=\"#\"onClick=\"return mV('Psa',52,1)\">52:1</a>; <a href=\"#\"onClick=\"return mV('Psa',53,1)\">53:1</a>; <a href=\"#\"onClick=\"return mV('Psa',54,1)\">54:1</a>; <a href=\"#\"onClick=\"return mV('Psa',55,1)\">55:1</a>; <a href=\"#\"onClick=\"return mV('Psa',74,1)\">74:1</a>; <a href=\"#\"onClick=\"return mV('Psa',78,1)\">78:1</a>; <a href=\"#\"onClick=\"return mV('Psa',88,1)\">88:1</a>; <a href=\"#\"onClick=\"return mV('Psa',89,1)\">89:1</a>; <a href=\"#\"onClick=\"return mV('Psa',142,1)\">142:1</a>";
navesArray["$$T0003466-91"]=".(The meaning is obscure. But its signification where it";
navesArray["$$T0003466-92"]="occurs elsewhere than in the titles of Psalms is equivalent";
navesArray["$$T0003466-93"]="to the English word \"instruction,\" or to become wise by";
navesArray["$$T0003466-94"]="instruction; hence, Ps 47:7: \"Sing ye praises with";
navesArray["$$T0003466-95"]="understanding.\")";
navesArray["$$T0003466-96"]="-MICAHTAM";
navesArray["$$T0003466-97"]=".A musical term in the titles of";
navesArray["$$T0003466-98"]="# <a href=\"#\"onClick=\"return mV('Psa',16,1)\">Psa 16:1</a>; <a href=\"#\"onClick=\"return mV('Psa',56,1)\">56:1</a>; <a href=\"#\"onClick=\"return mV('Psa',57,1)\">57:1</a>; <a href=\"#\"onClick=\"return mV('Psa',58,1)\">58:1</a>; <a href=\"#\"onClick=\"return mV('Psa',59,1)\">59:1</a>; <a href=\"#\"onClick=\"return mV('Psa',60,1)\">60:1</a>";
navesArray["$$T0003466-99"]=".(Luther interprets this as \"golden,\" that is, \"precious.\"";
navesArray["$$T0003466-100"]="Ewald interprets it as signifying a plaintive manner.)";
navesArray["$$T0003466-101"]="-MUTH-LABBEN";
navesArray["$$T0003466-102"]=".In the title of";
navesArray["$$T0003466-103"]="# <a href=\"#\"onClick=\"return mV('Psa',9,1)\">Psa 9:1</a>";
navesArray["$$T0003466-104"]=".(Authorities, ancient and modern, differ as to the probable";
navesArray["$$T0003466-105"]="signification. Gesenius and De Wette interpret it, \"with the";
navesArray["$$T0003466-106"]="voice of virgins, by boys.\" Others derive the word from a";
navesArray["$$T0003466-107"]="different Hebrew root, and interpret it as indicating that";
navesArray["$$T0003466-108"]="the Psalm was a funeral ode.)";
navesArray["$$T0003466-109"]="-NEGINAH and NEGINOTH";
navesArray["$$T0003466-110"]=".Appear in the titles of";
navesArray["$$T0003466-111"]="# <a href=\"#\"onClick=\"return mV('Psa',4,1)\">Psa 4:1</a>; <a href=\"#\"onClick=\"return mV('Psa',54,1)\">54:1</a>; <a href=\"#\"onClick=\"return mV('Psa',55,1)\">55:1</a>; <a href=\"#\"onClick=\"return mV('Psa',61,1)\">61:1</a>; <a href=\"#\"onClick=\"return mV('Psa',67,1)\">67:1</a>; <a href=\"#\"onClick=\"return mV('Hab',3,19)\">Hab 3:19</a>";
navesArray["$$T0003466-112"]=".(Its use seems to have been to indicate that the song should";
navesArray["$$T0003466-113"]="be accompanied by stringed instruments.)";
navesArray["$$T0003466-114"]="-NEHILOTH";
navesArray["$$T0003466-115"]=".Appears in the title of";
navesArray["$$T0003466-116"]="# <a href=\"#\"onClick=\"return mV('Psa',5,1)\">Psa 5:1</a>";
navesArray["$$T0003466-117"]=".(It seems to indicate, according to Gesenius, that when this";
navesArray["$$T0003466-118"]="Psalm was sung it was to be accompanied by wind instruments.)";
navesArray["$$T0003466-119"]="-SELAH";
navesArray["$$T0003466-120"]=".(This term appears frequently in the Psalms. Its use is not";
navesArray["$$T0003466-121"]="known. Possibly it signified a pause in the vocal music";
navesArray["$$T0003466-122"]="while an instrumental interlude or finale was rendered.)";
navesArray["$$T0003466-123"]="-SHEMINITH";
navesArray["$$T0003466-124"]=".In the titles of";
navesArray["$$T0003466-125"]="# <a href=\"#\"onClick=\"return mV('Psa',6,1)\">Psa 6:1</a>; <a href=\"#\"onClick=\"return mV('Psa',12,1)\">12:1</a>";
navesArray["$$T0003466-126"]=".(Translated \"eighth,\" probably indicates the measure,";
navesArray["$$T0003466-127"]="movement, or pitch.)";
navesArray["$$T0003466-128"]="-SHIGGAION";
navesArray["$$T0003466-129"]=".In the title of";
navesArray["$$T0003466-130"]="# <a href=\"#\"onClick=\"return mV('Psa',7,1)\">Psa 7:1</a>";
navesArray["$$T0003466-131"]=".And its plural, SHIGIONOTH, in the title of";
navesArray["$$T0003466-132"]="# <a href=\"#\"onClick=\"return mV('Hab',3,1)\">Hab 3:1</a>";
navesArray["$$T0003466-133"]=".(Supposed to be a musical term to guide in rendering the";
navesArray["$$T0003466-134"]="song. At the close of the chapter, the author refers the ode";
navesArray["$$T0003466-135"]="\"to the chief musician, on my stringed instruments.\" The";
navesArray["$$T0003466-136"]="term may suggest the movement in interpreting the music set";
navesArray["$$T0003466-137"]="to it.)";
navesArray["$$T0003466-138"]="-SHOSHANNIM and SHUSHAN-EDUTH";
navesArray["$$T0003466-139"]=".In the titles to";
navesArray["$$T0003466-140"]="# <a href=\"#\"onClick=\"return mV('Psa',45,1)\">Psa 45:1</a>; <a href=\"#\"onClick=\"return mV('Psa',60,1)\">60:1</a>; <a href=\"#\"onClick=\"return mV('Psa',69,1)\">69:1</a>; <a href=\"#\"onClick=\"return mV('Psa',80,1)\">80:1</a>";
navesArray["$$T0003466-141"]=".(Seems to indicate the manner in which these Psalms were to";
navesArray["$$T0003466-142"]="be rendered. Kimchi, Tremellius, and Eichhorn render it";
navesArray["$$T0003466-143"]="\"hexachorda,\" that is, that in singing these Psalms";
