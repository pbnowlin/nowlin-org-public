navesArray["$$T0002581-369"]=".See <a href=\"#\"onClick=\"return doDictLookup('NT0004639');\">SOLOMON</a>";
navesArray["$$T0002581-370"]="-THE REVOLT OF THE TEN TRIBES";
navesArray["$$T0002581-371"]="-(Foreshadowing circumstances indicating the separation)";
navesArray["$$T0002581-372"]="@Disagreement after Saul's death";
navesArray["$$T0002581-373"]="# <a href=\"#\"onClick=\"return mV('2Sa',2,'1-')\">2Sa 2</a>; <a href=\"#\"onClick=\"return mV('1Ch',12,'23-40')\">1Ch 12:23-40</a>; <a href=\"#\"onClick=\"return mV('1Ch',13,'1-')\">13</a>";
navesArray["$$T0002581-374"]=".Lukewarmness of the ten tribes, and zeal of Judah for David";
navesArray["$$T0002581-375"]="in Absolom's rebellion";
navesArray["$$T0002581-376"]="# <a href=\"#\"onClick=\"return mV('2Sa',19,'41-43')\">2Sa 19:41-43</a>";
navesArray["$$T0002581-377"]=".The rebellion of Sheba";
navesArray["$$T0002581-378"]="# <a href=\"#\"onClick=\"return mV('2Sa',20,'1-')\">2Sa 20</a>";
navesArray["$$T0002581-379"]=".The two factions are distinguished as Israel and Judah";
navesArray["$$T0002581-380"]="during David's reign";
navesArray["$$T0002581-381"]="# <a href=\"#\"onClick=\"return mV('2Sa',21,2)\">2Sa 21:2</a>";
navesArray["$$T0002581-382"]=".Providential";
navesArray["$$T0002581-383"]="# <a href=\"#\"onClick=\"return mV('Zec',11,14)\">Zec 11:14</a>";
navesArray["$$T0002581-384"]=".Revolt consummated under Rehoboam, son and successor of";
navesArray["$$T0002581-385"]="Solomon";
navesArray["$$T0002581-386"]="# <a href=\"#\"onClick=\"return mV('1Ki',12,4)\">1Ki 12:4</a>";
navesArray["$$T0002581-387"]="-4. The name of the ten tribes that revolted from the house (kingdom) of David";
navesArray["$$T0002581-388"]="";
navesArray["$$T0002581-389"]=".Also called JACOB";
navesArray["$$T0002581-390"]="# <a href=\"#\"onClick=\"return mV('Hsa',12,2)\">Hsa 12:2</a>";
navesArray["$$T0002581-391"]="-(The list of the kings of Israel, and the period of time in which they reigned. For the facts of their reigns see under each name)";
navesArray["$$T0002581-392"]="";
navesArray["$$T0002581-393"]="";
navesArray["$$T0002581-394"]=".1. Jeroboam, twenty-two years";
navesArray["$$T0002581-395"]=".2. Nadab, about two years";
navesArray["$$T0002581-396"]=".3. Baasha, twenty-four years";
navesArray["$$T0002581-397"]=".4. Elah, two years";
navesArray["$$T0002581-398"]=".5. Zimri, seven days";
navesArray["$$T0002581-399"]=".6. Omri, twelve years";
navesArray["$$T0002581-400"]=".7. Ahab, twenty-two years";
navesArray["$$T0002581-401"]=".8. Ahaziah, two years";
navesArray["$$T0002581-402"]=".9. Jehoram, twelve years";
navesArray["$$T0002581-403"]=".10. Jehu, twenty-eight years";
navesArray["$$T0002581-404"]=".11. Jehoahaz, seventeen years";
navesArray["$$T0002581-405"]=".12. Jehoash, sixteen years";
navesArray["$$T0002581-406"]=".13. Jeroboam II, forty-one years";
navesArray["$$T0002581-407"]=".14. Zachariah, six months";
navesArray["$$T0002581-408"]=".15. Shallum, one month";
navesArray["$$T0002581-409"]=".16. Menahem, ten years";
navesArray["$$T0002581-410"]=".17. Pekahiah, two years";
navesArray["$$T0002581-411"]=".18. Pekah, twenty years";
navesArray["$$T0002581-412"]=".19. Hoshea, nine years";
navesArray["$$T0002581-413"]="-(The ten tribes were carried away captive to Assyria)";
navesArray["$$T0002581-414"]="-HISTORY OF";
navesArray["$$T0002581-415"]=".War continued between the two kingdoms all the days of";
navesArray["$$T0002581-416"]="Rehoboam and Jeroboam";
navesArray["$$T0002581-417"]="# <a href=\"#\"onClick=\"return mV('1Ki',14,30)\">1Ki 14:30</a>";
navesArray["$$T0002581-418"]=".War continued between Jeroboam and Abijam";
navesArray["$$T0002581-419"]="# <a href=\"#\"onClick=\"return mV('1Ki',15,7)\">1Ki 15:7</a>";
navesArray["$$T0002581-420"]=".War continued between Baasha and Asa";
navesArray["$$T0002581-421"]="# <a href=\"#\"onClick=\"return mV('1Ki',15,16,32)\">1Ki 15:16, 32</a>";
navesArray["$$T0002581-422"]=".Famine prevails during the reign of Ahab";
navesArray["$$T0002581-423"]="# <a href=\"#\"onClick=\"return mV('1Ki',18,'1-6')\">1Ki 18:1-6</a>";
navesArray["$$T0002581-424"]=".Israel, also called SAMARIA, invaded by, but defeats,";
navesArray["$$T0002581-425"]="Ben-hadad, king of Syria";
navesArray["$$T0002581-426"]="# <a href=\"#\"onClick=\"return mV('1Ki',20,'1-')\">1Ki 20</a>";
navesArray["$$T0002581-427"]=".Moab rebels";
navesArray["$$T0002581-428"]="# <a href=\"#\"onClick=\"return mV('2Ki',1,1)\">2Ki 1:1</a>; <a href=\"#\"onClick=\"return mV('2Ki',3,'1-')\">3</a>";
navesArray["$$T0002581-429"]=".Army of Syria invades Israel, but peacefully withdraws";
navesArray["$$T0002581-430"]="through the tact of the prophet Elisha";
navesArray["$$T0002581-431"]="# <a href=\"#\"onClick=\"return mV('2Ki',6,'8-23')\">2Ki 6:8-23</a>";
navesArray["$$T0002581-432"]=".The city of Samaria besieged";
navesArray["$$T0002581-433"]="# <a href=\"#\"onClick=\"return mV('2Ki',6,'24-33')\">2Ki 6:24-33</a>; <a href=\"#\"onClick=\"return mV('2Ki',7,'1-')\">7</a>";
navesArray["$$T0002581-434"]=".The city of Samaria captured, and the people carried to";
navesArray["$$T0002581-435"]="Assyria";
navesArray["$$T0002581-436"]="# <a href=\"#\"onClick=\"return mV('2Ki',17,'1-')\">2Ki 17</a>";
navesArray["$$T0002581-437"]=".The land repopulated";
navesArray["$$T0002581-438"]="# <a href=\"#\"onClick=\"return mV('2Ki',17,24)\">2Ki 17:24</a>";
navesArray["$$T0002581-439"]=".The remnant that remained after the able-bodied persons were";
navesArray["$$T0002581-440"]="carried into captivity affiliated with the kingdom of Judah";
navesArray["$$T0002581-441"]="# <a href=\"#\"onClick=\"return mV('2Ch',30,'18-26')\">2Ch 30:18-26</a>; <a href=\"#\"onClick=\"return mV('2Ch',34,6)\">34:6</a>; <a href=\"#\"onClick=\"return mV('2Ch',35,18)\">35:18</a>";
navesArray["$$T0002582-0"]=217;
navesArray["$$T0002582-1"]="ISRAEL, PROPHECIES CONCERNING";
navesArray["$$T0002582-2"]="-PROPHECIES CONCERNING";
navesArray["$$T0002582-3"]=".Of captivity, famine, and judgments";
navesArray["$$T0002582-4"]="# <a href=\"#\"onClick=\"return mV('1Ki',14,15,16)\">1Ki 14:15-16</a>; <a href=\"#\"onClick=\"return mV('1Ki',17,1)\">17:1</a>; <a href=\"#\"onClick=\"return mV('1Ki',20,'13-28')\">20:13-28</a>; <a href=\"#\"onClick=\"return mV('2Ki',7,1,2,17)\">2Ki 7:1-2, 17</a>; <a href=\"#\"onClick=\"return mV('2Ki',8,1)\">8:1</a>; <a href=\"#\"onClick=\"return mV('Isa',7,8)\">Isa 7:8</a>; <a href=\"#\"onClick=\"return mV('Isa',8,'4-7')\">8:4-7</a>; <a href=\"#\"onClick=\"return mV('Isa',9,'8-21')\">9:8-21</a>; <a href=\"#\"onClick=\"return mV('Isa',17,'3-11')\">17:3-11</a>; <a href=\"#\"onClick=\"return mV('Isa',28,'1-8')\">28:1-8</a>; <a href=\"#\"onClick=\"return mV('Hsa',1,'1-9')\">Hsa 1:1-9</a>; <a href=\"#\"onClick=\"return mV('Hsa',2,'1-13')\">2:1-13</a>; <a href=\"#\"onClick=\"return mV('Hsa',4,'1-')\">4</a>; <a href=\"#\"onClick=\"return mV('Hsa',8,'1-')\">8</a>; <a href=\"#\"onClick=\"return mV('Hsa',9,'1-')\">9</a>; <a href=\"#\"onClick=\"return mV('Hsa',10,'1-')\">10</a>; <a href=\"#\"onClick=\"return mV('Hsa',11,5,6)\">11:5-6</a>; <a href=\"#\"onClick=\"return mV('Hsa',12,'7-14')\">12:7-14</a>; <a href=\"#\"onClick=\"return mV('Hsa',13,'1-')\">13</a>; <a href=\"#\"onClick=\"return mV('Amo',2,'6-16')\">Amo 2:6-16</a>; <a href=\"#\"onClick=\"return mV('Amo',3,'1-')\">3</a>; <a href=\"#\"onClick=\"return mV('Amo',4,'1-')\">4</a>; <a href=\"#\"onClick=\"return mV('Amo',5,'1-')\">5</a>; <a href=\"#\"onClick=\"return mV('Amo',6,'1-')\">6</a>; <a href=\"#\"onClick=\"return mV('Amo',7,'1-')\">7</a>; <a href=\"#\"onClick=\"return mV('Amo',8,'1-')\">8</a>; <a href=\"#\"onClick=\"return mV('Amo',9,'1-')\">9</a>";
navesArray["$$T0002582-5"]=".Of restoration";
navesArray["$$T0002582-6"]="# <a href=\"#\"onClick=\"return mV('Hsa',2,'14-23')\">Hsa 2:14-23</a>; <a href=\"#\"onClick=\"return mV('Hsa',11,'9-11')\">11:9-11</a>; <a href=\"#\"onClick=\"return mV('Hsa',13,13,14)\">13:13-14</a>; <a href=\"#\"onClick=\"return mV('Hsa',14,8)\">14:8</a>";
navesArray["$$T0002582-7"]=".Of the reunion of the ten tribes and Judah";
navesArray["$$T0002582-8"]="# <a href=\"#\"onClick=\"return mV('Jer',3,18)\">Jer 3:18</a>; <a href=\"#\"onClick=\"return mV('Eze',37,'16-22')\">Eze 37:16-22</a>";
navesArray["$$T0002582-9"]=".See the following";
navesArray["$$T0002582-10"]="-5. JUDAH";
navesArray["$$T0002582-11"]=".The nation composed of the tribes of Judah and Benjamin, called JUDAH, and JEWS, ruled by the descendants of David";
navesArray["$$T0002582-12"]="";
navesArray["$$T0002582-13"]="# <a href=\"#\"onClick=\"return mV('Isa',11,12)\">Isa 11:12</a>";
navesArray["$$T0002582-14"]=".See <a href=\"#\"onClick=\"return doDictLookup('NT0002790');\">JEWS</a>";
navesArray["$$T0002582-15"]=".In the historical books of first and second Kings, and first";
navesArray["$$T0002582-16"]="and second Chronicles the nation is called JUDAH, but in the";
navesArray["$$T0002582-17"]="prophecies it is frequently referred to as ISRAEL, as in";
navesArray["$$T0002582-18"]="# <a href=\"#\"onClick=\"return mV('Isa',8,14)\">Isa 8:14</a>; <a href=\"#\"onClick=\"return mV('Isa',49,7)\">49:7</a>";
navesArray["$$T0002582-19"]=".The list of rulers and the periods of time over which they reigned";
navesArray["$$T0002582-20"]="";
navesArray["$$T0002582-21"]=".1. Rehoboam, seventeen years";
navesArray["$$T0002582-22"]=".2. Abijah (Abijam), three years";
navesArray["$$T0002582-23"]=".3. Asa, forty-one years";
navesArray["$$T0002582-24"]=".4. Jehoshaphat, twenty-five years";
navesArray["$$T0002582-25"]=".5. Jehoram, eight years";
navesArray["$$T0002582-26"]=".6. Ahaziah, one year";
navesArray["$$T0002582-27"]=".Athaliah's usurpation, six years";
navesArray["$$T0002582-28"]=".7. Joash (Jehoash), forty years";
navesArray["$$T0002582-29"]=".8. Amaziah, twenty-nine years";
navesArray["$$T0002582-30"]=".9. Uzziah (Azariah), fifty-two years";
navesArray["$$T0002582-31"]=".10. Jotham, sixteen years";
navesArray["$$T0002582-32"]=".11. Ahaz, sixteen years";
navesArray["$$T0002582-33"]=".12. Hezekiah, twenty-nine years";
navesArray["$$T0002582-34"]=".13. Manasseh, fifty-five years";
navesArray["$$T0002582-35"]=".14. Amon, two years";
navesArray["$$T0002582-36"]=".15. Josiah, thirty-one years";
navesArray["$$T0002582-37"]=".16. Jehoahaz (Josiah's son), three months";
navesArray["$$T0002582-38"]=".17. Jehoiakim (Josiah's son), eleven years";
navesArray["$$T0002582-39"]=".18. Jehoiachin (Jeconiah), Jehoiakim's son, three months";
navesArray["$$T0002582-40"]=".19. Zedekiah (Mattaniah), Josiah's son, eleven years";
navesArray["$$T0002582-41"]="-(For the history of the above kings see under each name)";
navesArray["$$T0002582-42"]=".Rehoboam succeeds Solomon. As a consequence of his arbitrary";
navesArray["$$T0002582-43"]="policy, ten tribes rebel";
navesArray["$$T0002582-44"]="# <a href=\"#\"onClick=\"return mV('1Ki',12,'1-')\">1Ki 12</a>";
navesArray["$$T0002582-45"]=".Other circumstances of his reign";
navesArray["$$T0002582-46"]="# <a href=\"#\"onClick=\"return mV('1Ki',14,'21-31')\">1Ki 14:21-31</a>; <a href=\"#\"onClick=\"return mV('2Ch',10,'1-')\">2Ch 10</a>; <a href=\"#\"onClick=\"return mV('2Ch',11,'1-')\">11</a>; <a href=\"#\"onClick=\"return mV('2Ch',12,'1-')\">12</a>";
navesArray["$$T0002582-47"]=".Death of Rehoboam";
navesArray["$$T0002582-48"]="# <a href=\"#\"onClick=\"return mV('1Ki',14,31)\">1Ki 14:31</a>";
navesArray["$$T0002582-49"]=".Abijam's wicked reign";
navesArray["$$T0002582-50"]="# <a href=\"#\"onClick=\"return mV('1Ki',15,'1-8')\">1Ki 15:1-8</a>; <a href=\"#\"onClick=\"return mV('2Ch',13,'1-')\">2Ch 13</a>";
navesArray["$$T0002582-51"]=".Asa's good reign";
navesArray["$$T0002582-52"]="# <a href=\"#\"onClick=\"return mV('1Ki',15,'9-24')\">1Ki 15:9-24</a>; <a href=\"#\"onClick=\"return mV('2Ch',14,'1-')\">2Ch 14</a>; <a href=\"#\"onClick=\"return mV('2Ch',15,'1-')\">15</a>; <a href=\"#\"onClick=\"return mV('2Ch',16,'1-')\">16</a>";
navesArray["$$T0002582-53"]=".Asa makes a treaty with Ben-hadad, king of Syria, to make";
navesArray["$$T0002582-54"]="war against Israel";
navesArray["$$T0002582-55"]="# <a href=\"#\"onClick=\"return mV('1Ki',15,'16-24')\">1Ki 15:16-24</a>";
navesArray["$$T0002582-56"]=".Jehoshaphat succeeds Asa";
navesArray["$$T0002582-57"]="# <a href=\"#\"onClick=\"return mV('1Ki',15,24)\">1Ki 15:24</a>; <a href=\"#\"onClick=\"return mV('2Ch',17,'1-')\">2Ch 17</a>; <a href=\"#\"onClick=\"return mV('2Ch',18,'1-')\">18</a>; <a href=\"#\"onClick=\"return mV('2Ch',19,'1-')\">19</a>; <a href=\"#\"onClick=\"return mV('2Ch',20,'1-')\">20</a>; <a href=\"#\"onClick=\"return mV('2Ch',21,1)\">21:1</a>";
navesArray["$$T0002582-58"]=".Jehoshaphat joins Ahab against the king of Syria";
navesArray["$$T0002582-59"]="# <a href=\"#\"onClick=\"return mV('1Ki',22,'1-')\">1Ki 22</a>";
navesArray["$$T0002582-60"]=".See <a href=\"#\"onClick=\"return doDictLookup('NT0002722');\">JEHOSHAPHAT</a>";
navesArray["$$T0002582-61"]=".Jehoram, also called JORAM, reigns in place of his father,";
navesArray["$$T0002582-62"]="Jehoshaphat";
navesArray["$$T0002582-63"]="# <a href=\"#\"onClick=\"return mV('2Ki',8,'16-24')\">2Ki 8:16-24</a>; <a href=\"#\"onClick=\"return mV('2Ch',21,'1-')\">2Ch 21</a>";
navesArray["$$T0002582-64"]=".Edom revolts";
navesArray["$$T0002582-65"]="# <a href=\"#\"onClick=\"return mV('2Ki',8,'20-22')\">2Ki 8:20-22</a>";
navesArray["$$T0002582-66"]=".Ahaziah, also called AZARIAH";
navesArray["$$T0002582-67"]="# <a href=\"#\"onClick=\"return mV('2Ch',22,6)\">2Ch 22:6</a>";
navesArray["$$T0002582-68"]=".And JEHOAHAZ";
navesArray["$$T0002582-69"]="# <a href=\"#\"onClick=\"return mV('2Ch',21,17)\">2Ch 21:17</a>; <a href=\"#\"onClick=\"return mV('2Ch',25,23)\">25:23</a>";
navesArray["$$T0002582-70"]=".Ahaziah succeeds Jehoram";
navesArray["$$T0002582-71"]="# <a href=\"#\"onClick=\"return mV('2Ki',8,'24-29')\">2Ki 8:24-29</a>; <a href=\"#\"onClick=\"return mV('2Ch',22,'1-')\">2Ch 22</a>";
navesArray["$$T0002582-72"]=".Ahaziah killed by Jehu";
navesArray["$$T0002582-73"]="# <a href=\"#\"onClick=\"return mV('2Ki',9,'27-29')\">2Ki 9:27-29</a>; <a href=\"#\"onClick=\"return mV('2Ch',22,8,9)\">2Ch 22:8-9</a>";
navesArray["$$T0002582-74"]=".Athaliah, his mother, succeeds him";
navesArray["$$T0002582-75"]="# <a href=\"#\"onClick=\"return mV('2Ki',11,'1-16')\">2Ki 11:1-16</a>; <a href=\"#\"onClick=\"return mV('2Ch',22,'10-12')\">2Ch 22:10-12</a>; <a href=\"#\"onClick=\"return mV('2Ch',23,'1-15')\">23:1-15</a>";
navesArray["$$T0002582-76"]=".Jehoash (also called JOASH) succeeds Athaliah";
navesArray["$$T0002582-77"]="# <a href=\"#\"onClick=\"return mV('2Ki',11,21)\">2Ki 11:21</a>; <a href=\"#\"onClick=\"return mV('2Ki',12,'1-21')\">12:1-21</a>; <a href=\"#\"onClick=\"return mV('2Ch',24,'1-')\">2Ch 24</a>";
navesArray["$$T0002582-78"]=".The temple repaired";
navesArray["$$T0002582-79"]="# <a href=\"#\"onClick=\"return mV('2Ki',12,'1-')\">2Ki 12</a>";
navesArray["$$T0002582-80"]=".Amaziah reigns, and Judah is invaded by the king of Israel;";
navesArray["$$T0002582-81"]="Jerusalem is taken and the sacred things of the temple";
navesArray["$$T0002582-82"]="carried away";
navesArray["$$T0002582-83"]="# <a href=\"#\"onClick=\"return mV('2Ki',14,'1-20')\">2Ki 14:1-20</a>; <a href=\"#\"onClick=\"return mV('2Ch',25,'1-')\">2Ch 25</a>";
navesArray["$$T0002582-84"]=".Azariah (also called UZZIAH) succeeds him";
navesArray["$$T0002582-85"]="# <a href=\"#\"onClick=\"return mV('2Ki',14,21,22)\">2Ki 14:21-22</a>; <a href=\"#\"onClick=\"return mV('2Ki',15,'1-7')\">15:1-7</a>; <a href=\"#\"onClick=\"return mV('2Ch',26,'1-')\">2Ch 26</a>";
navesArray["$$T0002582-86"]=".Jotham succeeds Uzziah";
navesArray["$$T0002582-87"]="# <a href=\"#\"onClick=\"return mV('2Ki',15,7,'32-38')\">2Ki 15:7, 32-38</a>; <a href=\"#\"onClick=\"return mV('2Ch',27,'1-')\">2Ch 27</a>";
navesArray["$$T0002582-88"]=".Rezin, king of Syria, invades Judah";
navesArray["$$T0002582-89"]="# <a href=\"#\"onClick=\"return mV('2Ki',15,37)\">2Ki 15:37</a>";
navesArray["$$T0002582-90"]=".Jotham is succeeded by Ahaz";
navesArray["$$T0002582-91"]="# <a href=\"#\"onClick=\"return mV('2Ki',16,1)\">2Ki 16:1</a>; <a href=\"#\"onClick=\"return mV('2Ch',28,'1-')\">2Ch 28</a>";
navesArray["$$T0002582-92"]=".Judah is invaded by the kings of Samaria and Syria; Ahaz";
navesArray["$$T0002582-93"]="hires the king of Assyria to make war on the king of Syria";
navesArray["$$T0002582-94"]="# <a href=\"#\"onClick=\"return mV('2Ki',16,'5-9')\">2Ki 16:5-9</a>";
navesArray["$$T0002582-95"]=".Ahaz changes the nature of the altar in the temple";
navesArray["$$T0002582-96"]="# <a href=\"#\"onClick=\"return mV('2Ki',16,'10-18')\">2Ki 16:10-18</a>";
navesArray["$$T0002582-97"]=".Hezekiah succeeds Ahaz";
navesArray["$$T0002582-98"]="# <a href=\"#\"onClick=\"return mV('2Ki',16,19,20)\">2Ki 16:19-20</a>; <a href=\"#\"onClick=\"return mV('2Ch',29,32)\">2Ch 29:32</a>";
navesArray["$$T0002582-99"]=".Hezekiah's good reign";
navesArray["$$T0002582-100"]="# <a href=\"#\"onClick=\"return mV('2Ki',18,'1-8')\">2Ki 18:1-8</a>";
navesArray["$$T0002582-101"]=".Hezekiah revolts from the sovereignty of the king of Assyria";
navesArray["$$T0002582-102"]="# <a href=\"#\"onClick=\"return mV('2Ki',18,7)\">2Ki 18:7</a>";
navesArray["$$T0002582-103"]=".The king of Assyria invades Judah, and blasphemes the God of";
navesArray["$$T0002582-104"]="Judah; his army overthrown";
navesArray["$$T0002582-105"]="# <a href=\"#\"onClick=\"return mV('2Ki',18,'9-37')\">2Ki 18:9-37</a>; <a href=\"#\"onClick=\"return mV('2Ki',19,'1-')\">19</a>";
navesArray["$$T0002582-106"]=".Hezekiah's sickness and miraculous restoration";
navesArray["$$T0002582-107"]="# <a href=\"#\"onClick=\"return mV('2Ki',20,'1-')\">2Ki 20</a>";
navesArray["$$T0002582-108"]=".Hezekiah succeeded by Manasseh";
navesArray["$$T0002582-109"]="# <a href=\"#\"onClick=\"return mV('2Ki',20,21)\">2Ki 20:21</a>; <a href=\"#\"onClick=\"return mV('2Ch',33,'1-20')\">2Ch 33:1-20</a>";
navesArray["$$T0002582-110"]=".Manasseh's wicked reign";
navesArray["$$T0002582-111"]="# <a href=\"#\"onClick=\"return mV('2Ki',21,'1-18')\">2Ki 21:1-18</a>";
navesArray["$$T0002582-112"]=".Amon succeeds Manasseh on the throne";
navesArray["$$T0002582-113"]="# <a href=\"#\"onClick=\"return mV('2Ki',21,'18-26')\">2Ki 21:18-26</a>; <a href=\"#\"onClick=\"return mV('2Ch',33,'20-25')\">2Ch 33:20-25</a>";
navesArray["$$T0002582-114"]=".Josiah succeeds Amon; the temple is repaired; the book of";
navesArray["$$T0002582-115"]="the law recovered; religious revival follows; and the king";
navesArray["$$T0002582-116"]="dies";
navesArray["$$T0002582-117"]="# <a href=\"#\"onClick=\"return mV('2Ki',22,'1-')\">2Ki 22</a>; <a href=\"#\"onClick=\"return mV('2Ki',23,'1-30')\">23:1-30</a>; <a href=\"#\"onClick=\"return mV('2Ch',34,'1-')\">2Ch 34</a>; <a href=\"#\"onClick=\"return mV('2Ch',35,'1-')\">35</a>";
navesArray["$$T0002582-118"]=".Josiah is succeeded by Jehoahaz, who reigned for three";
navesArray["$$T0002582-119"]="months, was dethroned by the king of Egypt, and the land was";
navesArray["$$T0002582-120"]="put under taxation";
navesArray["$$T0002582-121"]="# <a href=\"#\"onClick=\"return mV('2Ki',23,'30-35')\">2Ki 23:30-35</a>; <a href=\"#\"onClick=\"return mV('2Ch',36,'1-3')\">2Ch 36:1-3</a>";
navesArray["$$T0002582-122"]=".Jehoiakim is elevated to the throne; becomes tributary to";
navesArray["$$T0002582-123"]="Nebuchadnezzar for three years; he rebels; is conquered and";
navesArray["$$T0002582-124"]="carried off to Babylon";
navesArray["$$T0002582-125"]="# <a href=\"#\"onClick=\"return mV('2Ki',24,'1-6')\">2Ki 24:1-6</a>; <a href=\"#\"onClick=\"return mV('2Ch',36,'4-8')\">2Ch 36:4-8</a>";
navesArray["$$T0002582-126"]=".Jehoiachin is made king; suffers invasion and is carried off";
navesArray["$$T0002582-127"]="to Babylon";
navesArray["$$T0002582-128"]="# <a href=\"#\"onClick=\"return mV('2Ki',24,'8-16')\">2Ki 24:8-16</a>; <a href=\"#\"onClick=\"return mV('2Ch',36,9,10)\">2Ch 36:9-10</a>";
navesArray["$$T0002582-129"]=".Zedekiah is made king by Nebuchadnezzar; he rebels; so,";
navesArray["$$T0002582-130"]="Nebuchadnezzar invades Judah, takes Jerusalem, and carries";
navesArray["$$T0002582-131"]="off the people to Babylon, despoiling the temple";
navesArray["$$T0002582-132"]="# <a href=\"#\"onClick=\"return mV('2Ki',24,'17-20')\">2Ki 24:17-20</a>; <a href=\"#\"onClick=\"return mV('2Ki',25,'1-')\">25</a>; <a href=\"#\"onClick=\"return mV('2Ch',36,'11-21')\">2Ch 36:11-21</a>";
navesArray["$$T0002582-133"]=".The poorest of the people were left to occupy the country,";
navesArray["$$T0002582-134"]="and were joined by fragments of the army of Judah, the";
navesArray["$$T0002582-135"]="dispersed Israelites in other lands, and the king's";
navesArray["$$T0002582-136"]="daughters";
navesArray["$$T0002582-137"]="# <a href=\"#\"onClick=\"return mV('2Ki',25,12,22,23)\">2Ki 25:12, 22-23</a>; <a href=\"#\"onClick=\"return mV('Jer',39,10)\">Jer 39:10</a>; <a href=\"#\"onClick=\"return mV('Jer',40,'7-12')\">40:7-12</a>; <a href=\"#\"onClick=\"return mV('Jer',52,16)\">52:16</a>";
navesArray["$$T0002582-138"]=".Gedaliah was appointed governor over the region";
navesArray["$$T0002582-139"]="# <a href=\"#\"onClick=\"return mV('2Ki',25,22)\">2Ki 25:22</a>";
navesArray["$$T0002582-140"]=".Gedaliah's adminstration was favorable to the people";
navesArray["$$T0002582-141"]="# <a href=\"#\"onClick=\"return mV('2Ki',25,23,24)\">2Ki 25:23-24</a>; <a href=\"#\"onClick=\"return mV('Jer',40,'7-12')\">Jer 40:7-12</a>";
navesArray["$$T0002582-142"]=".Gedaliah was conspired against and assassinated by Ishmael";

navesArray["$$T0002582-145"]="# <a href=\"#\"onClick=\"return mV('Jer',41,'1-18')\">Jer 41:1-18</a>";
navesArray["$$T0002582-146"]=".The people in fear, take refuge in Egypt";
navesArray["$$T0002582-147"]="# <a href=\"#\"onClick=\"return mV('2Ki',25,26)\">2Ki 25:26</a>; <a href=\"#\"onClick=\"return mV('Jer',41,'14-18')\">Jer 41:14-18</a>; <a href=\"#\"onClick=\"return mV('Jer',42,'13-18')\">42:13-18</a>";
