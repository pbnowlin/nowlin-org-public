torreysArray["$$T0000702-1"]="Concerning God, His Being, The Trinity";
torreysArray["$$T0000702-2"]="- 2. The Trinity.";
torreysArray["$$T0000702-3"]=". By the Trinity is meant the unity of three persons in one Godhead; Father, Son, and Holy Spirit.";
torreysArray["$$T0000702-4"]=". Representing God as one, the Scriptures also ascribe divinity to Father, Son and Holy Spirit.";
torreysArray["$$T0000702-5"]="-";
torreysArray["$$T0000702-6"]="- Course of the Argument by H. B. Smith";
torreysArray["$$T0000702-7"]=". a. God is one. Unity is ascribed to God.";
torreysArray["$$T0000702-8"]=". b. The Father is divine: a distinct person.";
torreysArray["$$T0000702-9"]=". c. The Son is divine: a distinct person.";
torreysArray["$$T0000702-10"]=". d. The Holy Spirit is divine: a distinct person.";
torreysArray["$$T0000702-11"]=". e. The Father, Son, and Holy Spirit are classed together, separately from all other beings.";
torreysArray["$$T0000702-12"]="- a. God is one. (See passages cited under <a href=\"#\"onClick=\"return doDictLookup('TT0000701');\">Attributes, Unity</a>.)";
torreysArray["$$T0000702-13"]="- b. The Father is divine and a distinct person. The Word \"Father\" is used in the Scriptures in a two-fold sense in relation to the Godhead: sometimes as equivalent to God, sometimes to the first person of the Trinity.";
torreysArray["$$T0000702-14"]=". 1. Passages where \"Father\" is used as equivalent to God, not implying personal distinctions.";
torreysArray["$$T0000702-15"]="# <a href=\"#\"onClick=\"return mV('Deu',32,6)\">Deu 32:6</a>; <a href=\"#\"onClick=\"return mV('2Sa',7,14)\">2Sa 7:14</a>; <a href=\"#\"onClick=\"return mV('1Ch',29,10)\">1Ch 29:10</a>; <a href=\"#\"onClick=\"return mV('Psa',89,26)\">Psa 89:26</a>; <a href=\"#\"onClick=\"return mV('Isa',63,16)\">Isa 63:16</a>; <a href=\"#\"onClick=\"return mV('Jer',3,19)\">Jer 3:19</a>; <a href=\"#\"onClick=\"return mV('Mal',2,10)\">Mal 2:10</a>; <a href=\"#\"onClick=\"return mV('Mat',6,9)\">Mat 6:9</a>; <a href=\"#\"onClick=\"return mV('Mar',11,25)\">Mar 11:25</a>; <a href=\"#\"onClick=\"return mV('Luk',12,30)\">Luk 12:30</a>; <a href=\"#\"onClick=\"return mV('Jhn',4,21,23,24)\">Jhn 4:21, 23, 24</a>; <a href=\"#\"onClick=\"return mV('2Cr',6,18)\">2Cr 6:18</a>; <a href=\"#\"onClick=\"return mV('Phl',4,20)\">Phl 4:20</a>; <a href=\"#\"onClick=\"return mV('Jam',1,17)\">Jam 1:17</a>; <a href=\"#\"onClick=\"return mV('1Jo',2,15,16)\">1Jo 2:15-16</a>";

torreysArray["$$T0000704-1"]="Concerning God, His Works, Providence";
torreysArray["$$T0000704-2"]="- 2. Providence.";
torreysArray["$$T0000704-3"]="-";
torreysArray["$$T0000704-4"]="\"This term, in its widest application, signifies the Divine Presence in the world as sustaining, controlling, and guiding to their destination all things that are made. The will of God determines the end for which His creatures exist; His wisdom and His goodness appoint the means by which that end is attained: in the conservation of the frame of nature, in the care of all creatures that have wants, in the government especially of intelligent and probationary beings; and His power ensures the accomplishment of every design.\"--Pope";

torreysArray["$$T0000706-6"]="- 2. The Race has a Common Origin.";
torreysArray["$$T0000706-7"]="# <a href=\"#\"onClick=\"return mV('Gen',1,27)\">Gen 1:27</a>; <a href=\"#\"onClick=\"return mV('Gen',5,'1-3')\">5:1-3</a>; <a href=\"#\"onClick=\"return mV('Gen',7,'21-24')\">7:21-24</a>; <a href=\"#\"onClick=\"return mV('Gen',9,18,19)\">9:18-19</a>; <a href=\"#\"onClick=\"return mV('Isa',63,16)\">Isa 63:16</a>; <a href=\"#\"onClick=\"return mV('Isa',64,8)\">64:8</a>; <a href=\"#\"onClick=\"return mV('Mal',2,10)\">Mal 2:10</a>; <a href=\"#\"onClick=\"return mV('Mat',6,9)\">Mat 6:9</a>; <a href=\"#\"onClick=\"return mV('Luk',11,2)\">Luk 11:2</a>; <a href=\"#\"onClick=\"return mV('Act',17,'26-29')\">Act 17:26-29</a>; <a href=\"#\"onClick=\"return mV('1Cr',8,6)\">1Cr 8:6</a>; <a href=\"#\"onClick=\"return mV('Eph',4,6)\">Eph 4:6</a>";
torreysArray["$$T0000706-8"]="- 3. Man a Compound Being, Consisting of Body and Spirit.";
torreysArray["$$T0000706-9"]="# <a href=\"#\"onClick=\"return mV('Gen',2,7)\">Gen 2:7</a>; <a href=\"#\"onClick=\"return mV('Ecc',12,7)\">Ecc 12:7</a>; <a href=\"#\"onClick=\"return mV('Mat',10,28)\">Mat 10:28</a>; <a href=\"#\"onClick=\"return mV('Mat',22,32)\">22:32</a>; <a href=\"#\"onClick=\"return mV('Luk',8,55)\">Luk 8:55</a>; <a href=\"#\"onClick=\"return mV('1Cr',15,45)\">1Cr 15:45</a>; <a href=\"#\"onClick=\"return mV('2Cr',5,6,8)\">2Cr 5:6, 8</a>; <a href=\"#\"onClick=\"return mV('1Th',5,23)\">1Th 5:23</a>";
torreysArray["$$T0000706-10"]="- 4. Man is the Offspring of God. See the texts under \"Common Origin,\" also,";
torreysArray["$$T0000706-11"]="# <a href=\"#\"onClick=\"return mV('Luk',3,38)\">Luk 3:38</a>; <a href=\"#\"onClick=\"return mV('Jhn',20,17)\">Jhn 20:17</a>";
torreysArray["$$T0000706-12"]="- 5. Man was Created in God's Image.";
torreysArray["$$T0000706-13"]=". a. This includes knowledge, feeling, and will.";
torreysArray["$$T0000706-14"]="# <a href=\"#\"onClick=\"return mV('Gen',1,26,27)\">Gen 1:26-27</a>; <a href=\"#\"onClick=\"return mV('Gen',5,1)\">5:1</a>; <a href=\"#\"onClick=\"return mV('1Cr',11,7)\">1Cr 11:7</a>; <a href=\"#\"onClick=\"return mV('Jam',3,9)\">Jam 3:9</a>";
torreysArray["$$T0000706-15"]=". b. He was in a state of righteousness and holiness.";
torreysArray["$$T0000706-16"]="# <a href=\"#\"onClick=\"return mV('Ecc',7,29)\">Ecc 7:29</a>; <a href=\"#\"onClick=\"return mV('2Cr',3,13)\">2Cr 3:13</a>; <a href=\"#\"onClick=\"return mV('Eph',4,24)\">Eph 4:24</a>; <a href=\"#\"onClick=\"return mV('Col',3,10)\">Col 3:10</a>";
torreysArray["$$T0000706-17"]=". and the whole teaching of Scripture in regard to the state of the regenerated";
torreysArray["$$T0000706-18"]="- 6. Man Under Moral Law.";
torreysArray["$$T0000706-19"]="# <a href=\"#\"onClick=\"return mV('Gen',2,16,17)\">Gen 2:16-17</a>; <a href=\"#\"onClick=\"return mV('Exd',20,'1-26')\">Exd 20:1-26</a>; <a href=\"#\"onClick=\"return mV('Deu',6,'6-9')\">Deu 6:6-9</a>; <a href=\"#\"onClick=\"return mV('Deu',27,26)\">27:26</a>; <a href=\"#\"onClick=\"return mV('Deu',32,46)\">32:46</a>; <a href=\"#\"onClick=\"return mV('Jos',1,8)\">Jos 1:8</a>; <a href=\"#\"onClick=\"return mV('Psa',1,'1-3')\">Psa 1:1-3</a>; <a href=\"#\"onClick=\"return mV('Psa',78,5)\">78:5</a>; <a href=\"#\"onClick=\"return mV('Psa',119,72,92)\">119:72, 92</a>; <a href=\"#\"onClick=\"return mV('Mat',5,17,19)\">Mat 5:17, 19</a>; <a href=\"#\"onClick=\"return mV('Mat',7,21,'24-27')\">7:21, 24-27</a>; <a href=\"#\"onClick=\"return mV('Jhn',14,21)\">Jhn 14:21</a>; <a href=\"#\"onClick=\"return mV('Rom',2,'13-15')\">Rom 2:13-15</a>; <a href=\"#\"onClick=\"return mV('Rom',8,4)\">8:4</a>; <a href=\"#\"onClick=\"return mV('Jam',1,22,25)\">Jam 1:22, 25</a>; <a href=\"#\"onClick=\"return mV('1Jo',2,3,4)\">1Jo 2:3-4</a>; <a href=\"#\"onClick=\"return mV('Rev',22,14)\">Rev 22:14</a>";
torreysArray["$$T0000707-0"]=16;
torreysArray["$$T0000707-1"]="Concerning Sin";
torreysArray["$$T0000707-2"]="- III. Concerning Sin.";
torreysArray["$$T0000707-3"]="- 1. Its Nature.";
torreysArray["$$T0000707-4"]=". a. Its origin, as regards the human race. The first man and woman, by their own choice, violated the law of God; they sinned against God.";
torreysArray["$$T0000707-5"]="# <a href=\"#\"onClick=\"return mV('/kjv/Gen/Gen003.html#top')\">Gen 3</a>";
torreysArray["$$T0000707-6"]=". b. Words, which describe sin in some of its forms. Hebrew: \"Chata,\" to go out of the way, to miss the mark. \"Pasha,\" to transgress. \"Avah,\" to twist, to act perversely. Greek: \"Hamaritia,\" a missing of the mark. \"Paraptoma,\" a falling away from law, truth, right. \"Parabasis,\" a going over or beyond truth and right, transgression. \"Anomia,\" lawlessness. \"Asebeia,\" irreverence.";
torreysArray["$$T0000707-7"]=". c. Definition. \"Sin is any want of conformity unto, or transgression of, the law of God.\"";
torreysArray["$$T0000707-8"]="- 2. Its Extent and Penalty.";
torreysArray["$$T0000707-9"]=". a. By sinning, our first parents incurred the penalty of eternal death, including loss of communion with God, supremacy of worldly affections, and consequent misery, wretchedness, and pain.";
torreysArray["$$T0000707-10"]="# <a href=\"#\"onClick=\"return mV('Gen',2,17)\">Gen 2:17</a>; <a href=\"#\"onClick=\"return mV('Eze',18,4)\">Eze 18:4</a>; <a href=\"#\"onClick=\"return mV('Mat',25,46)\">Mat 25:46</a>; <a href=\"#\"onClick=\"return mV('Rom',5,12)\">Rom 5:12</a>; <a href=\"#\"onClick=\"return mV('Rom',6,23)\">6:23</a>; <a href=\"#\"onClick=\"return mV('1Cr',15,58)\">1Cr 15:58</a>; <a href=\"#\"onClick=\"return mV('Gal',6,8)\">Gal 6:8</a>; <a href=\"#\"onClick=\"return mV('Jam',1,15)\">Jam 1:15</a>";
torreysArray["$$T0000707-11"]=". b. Sin natural to every human being, depravity being hereditary.";
torreysArray["$$T0000707-12"]="# <a href=\"#\"onClick=\"return mV('Psa',51,5)\">Psa 51:5</a>; <a href=\"#\"onClick=\"return mV('Psa',58,3)\">58:3</a>; <a href=\"#\"onClick=\"return mV('Jer',17,9)\">Jer 17:9</a>; <a href=\"#\"onClick=\"return mV('Jhn',3,6)\">Jhn 3:6</a>; <a href=\"#\"onClick=\"return mV('Rom',5,'12-19')\">Rom 5:12-19</a>; <a href=\"#\"onClick=\"return mV('Rom',7,'14-24')\">7:14-24</a>; <a href=\"#\"onClick=\"return mV('Rom',8,7)\">8:7</a>; <a href=\"#\"onClick=\"return mV('1Cr',15,22)\">1Cr 15:22</a>; <a href=\"#\"onClick=\"return mV('Gal',5,17,'19-21')\">Gal 5:17, 19-21</a>; <a href=\"#\"onClick=\"return mV('Eph',2,1,3)\">Eph 2:1, 3</a>";
torreysArray["$$T0000707-13"]=". c. All men sinners; therefore subject to same penalty incurred by the first sin.";
torreysArray["$$T0000707-14"]="# <a href=\"#\"onClick=\"return mV('Gen',6,5,'11-12')\">Gen 6:5, 11-12</a>; <a href=\"#\"onClick=\"return mV('1Ki',8,46)\">1Ki 8:46</a>; <a href=\"#\"onClick=\"return mV('2Ch',6,36)\">2Ch 6:36</a>; <a href=\"#\"onClick=\"return mV('Psa',53,'1-3')\">Psa 53:1-3</a>; <a href=\"#\"onClick=\"return mV('Pro',20,6,9)\">Pro 20:6, 9</a>; <a href=\"#\"onClick=\"return mV('Ecc',7,20)\">Ecc 7:20</a>; <a href=\"#\"onClick=\"return mV('Jhn',3,19)\">Jhn 3:19</a>; <a href=\"#\"onClick=\"return mV('Rom',3,'9-18',23)\">Rom 3:9-18, 23</a>; <a href=\"#\"onClick=\"return mV('Rom',11,32)\">11:32</a>; <a href=\"#\"onClick=\"return mV('Gal',3,22)\">Gal 3:22</a>; <a href=\"#\"onClick=\"return mV('1Jo',1,8,10)\">1Jo 1:8, 10</a>";
torreysArray["$$T0000707-15"]=". d. Therefore all need redemption.";
torreysArray["$$T0000707-16"]="# <a href=\"#\"onClick=\"return mV('Jhn',3,5,6)\">Jhn 3:5-6/a>; <a href=\"#\"onClick=\"return mV('Rom',5,18)\">Rom 5:18</a>; <a href=\"#\"onClick=\"return mV('Rom',7,24,25)\">7:24-25</a>; <a href=\"#\"onClick=\"return mV('2Cr',5,14,15,19)\">2Cr 5:14-15, 19</a>; <a href=\"#\"onClick=\"return mV('Gal',3,21,22)\">Gal 3:21-22</a>; <a href=\"#\"onClick=\"return mV('Tts',2,14)\">Tts 2:14</a>; <a href=\"#\"onClick=\"return mV('Hbr',2,9)\">Hbr 2:9</a>; <a href=\"#\"onClick=\"return mV('1Jo',2,2)\">1Jo 2:2</a>";
torreysArray["$$T0000708-0"]=102;
torreysArray["$$T0000708-1"]="Concerning Redemption, Introductory";
torreysArray["$$T0000708-2"]="- A. Concerning Redemption, Introductory and General Statements.";
torreysArray["$$T0000708-3"]="- The sin and ruin of man gave occasion for the gracious interposition of God. In the curse upon the serpent was intimated the purpose of redemption.";
torreysArray["$$T0000708-4"]="# <a href=\"#\"onClick=\"return mV('Gen',3,15)\">Gen 3:15</a>";
torreysArray["$$T0000708-5"]="- a. There is, however, no Self-redemption.";
torreysArray["$$T0000708-6"]=". The fall of man wrought a change in both his nature and his condition. To be redeemed he must be placed where he was before, both as to character and as to state. His purity must be restored; his condemnation must be removed. Man cannot redeem himself, because--";
torreysArray["$$T0000708-7"]=". 1. The legal difficulty is insuperable. The divine law requires a perfect obedience.";
torreysArray["$$T0000708-8"]="# <a href=\"#\"onClick=\"return mV('Mat',22,37)\">Mat 22:37</a>; <a href=\"#\"onClick=\"return mV('Gal',3,10)\">Gal 3:10</a>";
torreysArray["$$T0000708-9"]=" <i>There can be no surplus obedience</i>, no reparation for sin that is past.";
torreysArray["$$T0000708-10"]=". 2. The moral difficulty is insuperable.";
torreysArray["$$T0000708-11"]="# <a href=\"#\"onClick=\"return mV('Job',14,14)\">Job 14:14</a>; <a href=\"#\"onClick=\"return mV('Jhn',3,6)\">Jhn 3:6</a>";
torreysArray["$$T0000708-12"]=". There is no tendency in that which is sinful to that which is holy. No sinner can regain by self-effort alone the purity which he has lost; but this is indispensable to redemption.";
torreysArray["$$T0000708-13"]="# <a href=\"#\"onClick=\"return mV('Hbr',12,14)\">Hbr 12:14</a>";
torreysArray["$$T0000708-14"]="- b. No Redemption by other Creatures.";
torreysArray["$$T0000708-15"]=". It is equally certain that, while sinful man cannot redeem himself, no other creature can redeem him. The fact of creatureship necessitates dependence and obligation. The highest angel and all the angels are under law to God. That law is perfect, it exacts their whole power of love and service. By no possibility can they love and serve God except for themselves alone. To find a being qualified and able to redeem, we must find one over whom the law has no jurisdiction. In the presence of that being we are in the presence of God.";
torreysArray["$$T0000708-16"]="- c. Will God redeem?";
torreysArray["$$T0000708-17"]=". 1. Nature furnishes presumptive evidence that God will redeem. Nature show the goodness of God. His gifts are not determined by the moral character of man.";
torreysArray["$$T0000708-18"]="# <a href=\"#\"onClick=\"return mV('Psa',103,10)\">Psa 103:10</a>; <a href=\"#\"onClick=\"return mV('Psa',145,15,16)\">145:15-16</a>; <a href=\"#\"onClick=\"return mV('Psa',147,8,9)\">147:8-9</a>; <a href=\"#\"onClick=\"return mV('Mat',5,45)\">Mat 5:45</a>; <a href=\"#\"onClick=\"return mV('Mat',6,26)\">6:26</a>";
torreysArray["$$T0000708-19"]=". 2. In the world man is subject to many evils as to his body, but all around him are remedies in nature.";
torreysArray["$$T0000708-20"]=". 3. The universal presence of sacrifice is another presumption. It is probable that sacrifice did not originate with man, but in the appointment of God.";
torreysArray["$$T0000708-21"]="# <a href=\"#\"onClick=\"return mV('Gen',3,21)\">Gen 3:21</a>";
torreysArray["$$T0000708-22"]=". 4. If nature is uncertain, revelation is clear and conclusive. From the fall of Adam to the birth of Christ the divine purpose was constantly being more fully and clearly revealed.";
torreysArray["$$T0000708-23"]="# <a href=\"#\"onClick=\"return mV('Gen',3,15)\">Gen 3:15</a>; <a href=\"#\"onClick=\"return mV('Gen',4,4)\">4:4</a>; <a href=\"#\"onClick=\"return mV('Gen',5,'24-29')\">5:24-29</a>; <a href=\"#\"onClick=\"return mV('Gen',6,8)\">6:8</a>; <a href=\"#\"onClick=\"return mV('Gen',14,18)\">14:18</a>; <a href=\"#\"onClick=\"return mV('Jhn',8,56)\">Jhn 8:56</a>; <a href=\"#\"onClick=\"return mV('Isa',53,'1-12')\">Isa 53:1-12</a>; <a href=\"#\"onClick=\"return mV('Dan',9,'24-27')\">Dan 9:24-27</a>; <a href=\"#\"onClick=\"return mV('Joe',2,'28-32')\">Joe 2:28-32</a>; <a href=\"#\"onClick=\"return mV('Zec',13,'1-7')\">Zec 13:1-7</a>";
torreysArray["$$T0000708-24"]=". 5. The presence and work of the Holy Spirit also attested.";
torreysArray["$$T0000708-25"]="# <a href=\"#\"onClick=\"return mV('Gen',6,3)\">Gen 6:3</a>; <a href=\"#\"onClick=\"return mV('Exd',31,2,3)\">Exd 31:2-3</a>; <a href=\"#\"onClick=\"return mV('Jdg',6,34)\">Jdg 6:34</a>; <a href=\"#\"onClick=\"return mV('Jdg',11,29)\">11:29</a>; <a href=\"#\"onClick=\"return mV('Neh',9,20)\">Neh 9:20</a>; <a href=\"#\"onClick=\"return mV('Isa',44,3,4)\">Isa 44:3-4</a>; <a href=\"#\"onClick=\"return mV('Isa',59,21)\">59:21</a>; <a href=\"#\"onClick=\"return mV('Isa',63,11)\">63:11</a>; <a href=\"#\"onClick=\"return mV('Hag',2,5)\">Hag 2:5</a>";
torreysArray["$$T0000708-26"]="- d. The Redeemer, or Messiah, has Already Come.";
torreysArray["$$T0000708-27"]=". It is plain from the prophecies and from their historical fulfilment that the Messiah must have long since come.";
torreysArray["$$T0000708-28"]="# <a href=\"#\"onClick=\"return mV('Gen',49,10)\">Gen 49:10</a>; <a href=\"#\"onClick=\"return mV('Dan',9,25)\">Dan 9:25</a>; <a href=\"#\"onClick=\"return mV('Hag',2,'6-9')\">Hag 2:6-9</a>; <a href=\"#\"onClick=\"return mV('Mal',3,1)\">Mal 3:1</a>";
torreysArray["$$T0000708-29"]="- e. Jesus Christ the Messiah, as shown by Fulfilled Prophecies.";
torreysArray["$$T0000708-30"]=". 1. Was to be from eternity the fellow of God.";
torreysArray["$$T0000708-31"]="# <a href=\"#\"onClick=\"return mV('Isa',9,6)\">Isa 9:6</a>; <a href=\"#\"onClick=\"return mV('Mic',5,2)\">Mic 5:2</a>; <a href=\"#\"onClick=\"return mV('Zec',13,7)\">Zec 13:7</a>; <a href=\"#\"onClick=\"return mV('Mat',3,17)\">Mat 3:17</a>; <a href=\"#\"onClick=\"return mV('Jhn',1,'1-3')\">Jhn 1:1-3</a>; <a href=\"#\"onClick=\"return mV('1Jo',5,20)\">1Jo 5:20</a>";
torreysArray["$$T0000708-32"]=". 2. To be born not by ordinary generation, but of a virgin.";
torreysArray["$$T0000708-33"]="# <a href=\"#\"onClick=\"return mV('Isa',7,14)\">Isa 7:14</a>; <a href=\"#\"onClick=\"return mV('Mat',1,'18-25')\">Mat 1:18-25</a>; <a href=\"#\"onClick=\"return mV('Luk',1,'26-33')\">Luk 1:26-33</a>";
torreysArray["$$T0000708-34"]=". 3. In Bethlehem of Judea.";
torreysArray["$$T0000708-35"]="# <a href=\"#\"onClick=\"return mV('Mic',5,2)\">Mic 5:2</a>; <a href=\"#\"onClick=\"return mV('Luk',2,4,11)\">Luk 2:4, 11</a>; <a href=\"#\"onClick=\"return mV('Luk',2,11)\">11</a>; <a href=\"#\"onClick=\"return mV('Mat',2,'4-6')\">Mat 2:4-6</a>; <a href=\"#\"onClick=\"return mV('Jhn',7,42)\">Jhn 7:42</a>";
torreysArray["$$T0000708-36"]=". 4. To come while the sceptre still lingered with Judah, near by the close of the weeks predicted by Daniel, and while the second temple was yet standing.";
torreysArray["$$T0000708-37"]="# <a href=\"#\"onClick=\"return mV('Gen',49,10)\">Gen 49:10</a>; <a href=\"#\"onClick=\"return mV('Mat',2,1)\">Mat 2:1</a>; <a href=\"#\"onClick=\"return mV('Dan',9,25)\">Dan 9:25</a>; <a href=\"#\"onClick=\"return mV('Luk',2,1)\">Luk 2:1</a>; <a href=\"#\"onClick=\"return mV('Hag',2,'6-9')\">Hag 2:6-9</a>; <a href=\"#\"onClick=\"return mV('Mat',24,1,2)\">Mat 24:1-2</a>";
torreysArray["$$T0000708-38"]=". 5. To be of the race of Abraham, of the tribe of Judah, of the family of David.";
torreysArray["$$T0000708-39"]="# <a href=\"#\"onClick=\"return mV('Gen',22,18)\">Gen 22:18</a>; <a href=\"#\"onClick=\"return mV('Gen',49,10)\">49:10</a>; <a href=\"#\"onClick=\"return mV('2Sa',7,16)\">2Sa 7:16</a>; <a href=\"#\"onClick=\"return mV('Isa',11,'1-9')\">Isa 11:1-9</a>";
torreysArray["$$T0000708-40"]=". 6. To come in humble circumstances.";
torreysArray["$$T0000708-41"]="# <a href=\"#\"onClick=\"return mV('Isa',53,2)\">Isa 53:2</a>; <a href=\"#\"onClick=\"return mV('Luk',2,'7-24')\">Luk 2:7-24</a>; <a href=\"#\"onClick=\"return mV('Isa',49,7)\">Isa 49:7</a>; <a href=\"#\"onClick=\"return mV('Mat',8,20)\">Mat 8:20</a>; <a href=\"#\"onClick=\"return mV('Mar',6,3)\">Mar 6:3</a>";
torreysArray["$$T0000708-42"]=". 7. To make Himself known by works of mercy and of supernatural power.";
torreysArray["$$T0000708-43"]="# <a href=\"#\"onClick=\"return mV('Isa',35,'3-6')\">Isa 35:3-6</a>; <a href=\"#\"onClick=\"return mV('Jhn',5,'36-37')\">Jhn 5:36-37</a>; <a href=\"#\"onClick=\"return mV('Isa',42,7)\">Isa 42:7</a>; <a href=\"#\"onClick=\"return mV('Isa',61,'1-3')\">61:1-3</a>; <a href=\"#\"onClick=\"return mV('Jhn',10,24,25)\">Jhn 10:24-25</a>";
torreysArray["$$T0000708-44"]=". 8. To be despised and rejected of men.";
torreysArray["$$T0000708-45"]="# <a href=\"#\"onClick=\"return mV('Isa',53,'3-7')\">Isa 53:3-7</a>; <a href=\"#\"onClick=\"return mV('Jhn',1,10,11)\">Jhn 1:10-11</a>; <a href=\"#\"onClick=\"return mV('Luk',23,'18-21')\">Luk 23:18-21</a>";
torreysArray["$$T0000708-46"]=". 9. To be cut off by a violent death and His body to be pierced.";
torreysArray["$$T0000708-47"]="# <a href=\"#\"onClick=\"return mV('Isa',53,8)\">Isa 53:8</a>; <a href=\"#\"onClick=\"return mV('Dan',9,26)\">Dan 9:26</a>; <a href=\"#\"onClick=\"return mV('Luk',23,23,33)\">Luk 23:23, 33</a>; <a href=\"#\"onClick=\"return mV('Psa',22,16)\">Psa 22:16</a>; <a href=\"#\"onClick=\"return mV('Jhn',20,25)\">Jhn 20:25</a>; <a href=\"#\"onClick=\"return mV('Zec',12,10)\">Zec 12:10</a>; <a href=\"#\"onClick=\"return mV('Jhn',19,34)\">Jhn 19:34</a>";
torreysArray["$$T0000708-48"]=". 10. Other prophecies concerning His death.";
torreysArray["$$T0000708-49"]="# <a href=\"#\"onClick=\"return mV('Psa',22,7,8)\">Psa 22:7-8</a>; <a href=\"#\"onClick=\"return mV('Mat',27,'39-43')\">Mat 27:39-43</a>; <a href=\"#\"onClick=\"return mV('Psa',69,21)\">Psa 69:21</a>; <a href=\"#\"onClick=\"return mV('Mat',27,34)\">Mat 27:34</a>; <a href=\"#\"onClick=\"return mV('Psa',22,18)\">Psa 22:18</a>; <a href=\"#\"onClick=\"return mV('Jhn',19,23,24)\">Jhn 19:23-24</a>; <a href=\"#\"onClick=\"return mV('Exd',12,46)\">Exd 12:46</a>; <a href=\"#\"onClick=\"return mV('Jhn',19,33,36)\">Jhn 19:33, 36</a>; <a href=\"#\"onClick=\"return mV('Isa',53,12)\">Isa 53:12</a>; <a href=\"#\"onClick=\"return mV('Mar',15,27)\">Mar 15:27</a>; <a href=\"#\"onClick=\"return mV('Isa',53,9)\">Isa 53:9</a>; <a href=\"#\"onClick=\"return mV('Mat',27,'57-60')\">Mat 27:57-60</a>";
torreysArray["$$T0000708-50"]=". 11. To rise from the dead, to ascend on high, leading captivity captive.";
torreysArray["$$T0000708-51"]="# <a href=\"#\"onClick=\"return mV('Psa',16,'9-11')\">Psa 16:9-11</a>; <a href=\"#\"onClick=\"return mV('Mat',28,'5-7')\">Mat 28:5-7</a>; <a href=\"#\"onClick=\"return mV('Psa',68,18)\">Psa 68:18</a>; <a href=\"#\"onClick=\"return mV('Act',1,'9-11')\">Act 1:9-11</a>";
torreysArray["$$T0000708-52"]="- f. The Incarnation.";
torreysArray["$$T0000708-53"]=". The word incarnation comes from Latin words (in and caro, carnis, flesh) meaning \"in the flesh.\" To become incarnate is to become a man. Remaining God, Christ became man and as such lived among men. The divine was not changed into the human, or co-mingled with the human so that it became what it was not before, but the divine took the human into union with itself and so entered a form or mode of being which was new as well as mysterious. As by faith we understand that the world was framed by the word of God, so by faith we understand that He who framed the world became incarnate.";
torreysArray["$$T0000708-54"]="# <a href=\"#\"onClick=\"return mV('Hbr',1,'1-14')\">Hbr 1:1-14</a>; <a href=\"#\"onClick=\"return mV('Hbr',11,3)\">11:3</a>";
torreysArray["$$T0000708-55"]=". While incarnation could not affect the nature and properties of Deity, it did affect their manifestation. The glory which the Son had with the Father was not visible when He was among men.";
torreysArray["$$T0000708-56"]="# <a href=\"#\"onClick=\"return mV('Jhn',17,5)\">Jhn 17:5</a>; <a href=\"#\"onClick=\"return mV('Phl',2,7)\">Phl 2:7</a>; <a href=\"#\"onClick=\"return mV('Jhn',1,14)\">Jhn 1:14</a>; <a href=\"#\"onClick=\"return mV('Luk',1,32)\">Luk 1:32</a>";
torreysArray["$$T0000708-57"]=". To the sight of men the human was the more constant and conspicuous. At times, however, there was the clear shining forth of Deity.";
torreysArray["$$T0000708-58"]="# <a href=\"#\"onClick=\"return mV('Mat',7,28,29)\">Mat 7:28-29</a>; <a href=\"#\"onClick=\"return mV('Jhn',3,2)\">Jhn 3:2</a>; <a href=\"#\"onClick=\"return mV('Jhn',7,46)\">7:46</a>; <a href=\"#\"onClick=\"return mV('Mat',17,1,2)\">Mat 17:1-2</a>";
torreysArray["$$T0000708-59"]="- g. Old Testament Intimations of the Incarnation.";
torreysArray["$$T0000708-60"]=". 1. In the first promise. In the renewal of the promise to Abraham, Isaac, Jacob, and David He was to be their seed.";
torreysArray["$$T0000708-61"]="# <a href=\"#\"onClick=\"return mV('Gen',3,15)\">Gen 3:15</a>; <a href=\"#\"onClick=\"return mV('Gen',22,18)\">22:18</a>; <a href=\"#\"onClick=\"return mV('Gen',28,14)\">28:14</a>; <a href=\"#\"onClick=\"return mV('2Sa',7,'12-29')\">2Sa 7:12-29</a>";
torreysArray["$$T0000708-62"]=". 2. The theophanies of the old covenant were manifestations of God in the person of His Son.";
torreysArray["$$T0000708-63"]="@ - To Abraham.";
torreysArray["$$T0000708-64"]="# <a href=\"#\"onClick=\"return mV('Gen',18,'1-33')\">Gen 18:1-33</a>";
torreysArray["$$T0000708-65"]="@ - To Jacob.";
torreysArray["$$T0000708-66"]="# <a href=\"#\"onClick=\"return mV('Gen',32,'22-32')\">Gen 32:22-32</a>";
torreysArray["$$T0000708-67"]="@ - To Joshua.";
torreysArray["$$T0000708-68"]="# <a href=\"#\"onClick=\"return mV('Jos',5,13)\">Jos 5:13</a>; <a href=\"#\"onClick=\"return mV('Jos',6,5)\">6:5</a>";
torreysArray["$$T0000708-69"]="@ - To Manoah and his wife.";
torreysArray["$$T0000708-70"]="# <a href=\"#\"onClick=\"return mV('Jdg',13,'1-25')\">Jdg 13:1-25</a>";
torreysArray["$$T0000708-71"]=". 3. Isaiah said: \"A Virgin shall conceive, and bear a son\"";
torreysArray["$$T0000708-72"]="# <a href=\"#\"onClick=\"return mV('Isa',7,14)\">Isa 7:14</a>. This would make Him human, at the same time His name was Immanuel, <i>God with us</i>.";
torreysArray["$$T0000708-73"]="# (See also <a href=\"#\"onClick=\"return mV('Isa',9,6)\">Isa 9:6</a>; <a href=\"#\"onClick=\"return mV('Zec',13,7)\">Zec 13:7</a>; <a href=\"#\"onClick=\"return mV('Mat',26,31)\">Mat 26:31</a>)";
torreysArray["$$T0000708-74"]="- h. Necessity of the Incarnation.";
torreysArray["$$T0000708-75"]=". Its necessity in the fact of sin. God under no obligation to redeem lost men, but, on the supposition of redemption, the Redeemer must become incarnate.";
torreysArray["$$T0000708-76"]=". 1. God alone could redeem. The law broken must be vindicated, the nature defiled must be renewed. Men and angels are utterly incompetent in such an exigency. The case necessitates a divine Redeemer.";
torreysArray["$$T0000708-77"]=". 2. God Himself in redeeming men must do it righteously. His perfect law cannot be set aside. The Redeemer must come under the law, under its jurisdiction and its power. But to do this He must come out of the sphere of absolute God-head into that of real manhood.";
torreysArray["$$T0000708-78"]="# <a href=\"#\"onClick=\"return mV('Hbr',2,'14-16')\">Hbr 2:14-16</a> It was impossible that He should cease to be God; it was not impossible that He should assume into union with Himself the nature of man.";
torreysArray["$$T0000708-79"]="- i. The Mediator.";
torreysArray["$$T0000708-80"]=". The Greek word for mediator is emites, meaning <i>one who goes between</i>, or <i>in the middle</i>. It embraces the additional ideas of <i>variance</i> and <i>reconciliation</i>.";
torreysArray["$$T0000708-81"]=". 1. The word <i>mediator</i> does not in itself indicate by what means mediation is to be made.";
torreysArray["$$T0000708-82"]="@ a. In the case of a <i>misapprehension</i> the mediator would only need to explain, or be an interpreter.";
torreysArray["$$T0000708-83"]="@ b. In a case of <i>deliberate wrong</i> the mediator would seek the clemency and favour of the offended party, and thus <i>become an intercessor</i>.";
torreysArray["$$T0000708-84"]="@ c. If, further, the case were such that there were grave <i>liabilities in law and right</i> resting upon the offending party, it would be requisite for the mediator to obtain for him, or himself become <i>a sponsor</i>, or to use the Scriptural word, a <i>surety</i> or <i>bondsman</i>.";
torreysArray["$$T0000708-85"]="@ d. If the obligations resting upon the offending party were <i>such as he could not in his own person, or by his own resources satisfy</i>, it would behove the mediator to take them upon himself, and actually meeting them became his <i>redemptor</i>, or <i>redeemer</i>.";
torreysArray["$$T0000708-86"]=". 2. The application of this idea to Christ. The word definite meaning--He comes between men and God--separated and at variance by reason of sin-- to effect their reconciliation, in harmony with eternal truth, right, and holiness</i>.";
torreysArray["$$T0000708-87"]="# <a href=\"#\"onClick=\"return mV('Hbr',2,'9-18')\">Hbr 2:9-18</a>; <a href=\"#\"onClick=\"return mV('Hbr',4,'14-16')\">4:14-16</a>; <a href=\"#\"onClick=\"return mV('Hbr',5,9)\">5:9</a>.";
torreysArray["$$T0000708-88"]="- j. Atonement.";
torreysArray["$$T0000708-89"]=". 1. The usage of the English word.";
torreysArray["$$T0000708-90"]="@ a. Its verbal meaning. This is seen by pronouncing it at-one-ment. In this verbal sense the word expresses a <i>result</i>, not that by which the result is gained.";
torreysArray["$$T0000708-91"]="@ b. In theology the word is commonly used to denote <i>that part of the priestly work of Christ by which He made satisfaction to the law and justice of God for the sins of men, and in view of which men are saved</i>. In this use it expresses not reconciliation itself, but that which reconciles.";
torreysArray["$$T0000708-92"]=". 2. Scriptural words in this connection.";
torreysArray["$$T0000708-93"]="@ a. In the Old Testament the fundamental Hebrew word for atonement means <i>to cover</i>.";
torreysArray["$$T0000708-94"]="# <a href=\"#\"onClick=\"return mV('Psa',32,1)\">Psa 32:1</a>.";
torreysArray["$$T0000708-95"]="According to it, sin is expiated or atoned for by <i>covering</i> it.";
torreysArray["$$T0000708-96"]="@ b. In the New Testament.";
torreysArray["$$T0000708-97"]="# (1) <i>Katallage</i> (<a href=\"#\"onClick=\"return mV('Rom',5,11)\">Rom 5:11</a>), means a change or an exchange; i.e., a change from enmity to love, and so reconciliation.";
torreysArray["$$T0000708-98"]="# (2) <i>Apolutrosis</i> (<a href=\"#\"onClick=\"return mV('Rom',3,24)\">Rom 3:24</a>), deliverance by a ransom or by payment of price. <a href=\"#\"onClick=\"return mV('Mat',20,28)\">Mat 20:28</a>; <a href=\"#\"onClick=\"return mV('1Pe',1,18,19)\">1Pe 1:18-19</a>.";
torreysArray["$$T0000708-99"]="# (3) <i>Hilasmos</i>, propitiation. Both Jews and Gentiles perfectly understood the meaning of hilasmos. When under a sense of sin they would make a propitiation--they approached the altar and laid upon it the sacrificial victim. <a href=\"#\"onClick=\"return mV('1Jo',2,2)\">1Jo 2:2</a>.";
torreysArray["$$T0000708-100"]="@ c. If now we combine and formulate these ideas, we see that the atonement of Christ is <i>that satisfaction to the law and justice of God for the sins of men, which, as the one great High Priest, He made by His own obedience unto death, and on the ground of which He carries on His acts of intercession and benediction in heaven</i>.";
torreysArray["$$T0000708-101"]="- k. Redemption (In contrast with atonement.)";
torreysArray["$$T0000708-102"]=". <i>Atonement</i> is the ground and means of redemption, while <i>redemption</i> is the result of atonement. Redemption consists of two parts, the one legal, the other moral. The work of Christ meets the demands of the law and man is justified. The work of the Spirit renews the depraved nature and reforms the sinner in the divine image, and man is sanctified.";
torreysArray["$$T0000709-0"]=19;
torreysArray["$$T0000709-1"]="Concerning Redemption, The Person of the Redeemer";
torreysArray["$$T0000709-2"]="- B. The Person of the Redeemer.";
torreysArray["$$T0000709-3"]="- 1. He is truly God. (See texts on <a href=\"#\"onClick=\"return doDictLookup('TT0000702');\">The Trinity</a>)";
torreysArray["$$T0000709-4"]="- 2. He is truly Man.";
torreysArray["$$T0000709-5"]=". His human nature the same as that of other men, because He is of the stock of Abraham.";
torreysArray["$$T0000709-6"]=". a. General references.";
torreysArray["$$T0000709-7"]="# <a href=\"#\"onClick=\"return mV('Mat',12,8,'13-37')\">Mat 12:8, 13-37</a>; <a href=\"#\"onClick=\"return mV('Mat',16,13)\">16:13</a>; <a href=\"#\"onClick=\"return mV('Mat',25,31)\">25:31</a>; <a href=\"#\"onClick=\"return mV('Jhn',3,14)\">Jhn 3:14</a>; <a href=\"#\"onClick=\"return mV('Jhn',8,28)\">8:28</a>; <a href=\"#\"onClick=\"return mV('Jhn',13,31)\">13:31</a>; <a href=\"#\"onClick=\"return mV('Gal',4,4)\">Gal 4:4</a>; <a href=\"#\"onClick=\"return mV('1Ti',2,5)\">1Ti 2:5</a>; <a href=\"#\"onClick=\"return mV('Hbr',2,14)\">Hbr 2:14</a>";
torreysArray["$$T0000709-8"]=". b. References to His human body.";
torreysArray["$$T0000709-9"]="# <a href=\"#\"onClick=\"return mV('Mat',2,1)\">Mat 2:1</a>; <a href=\"#\"onClick=\"return mV('Mar',4,38)\">Mar 4:38</a>; <a href=\"#\"onClick=\"return mV('Luk',2,52)\">Luk 2:52</a>; <a href=\"#\"onClick=\"return mV('Jhn',4,'6-8')\">Jhn 4:6-8</a>; <a href=\"#\"onClick=\"return mV('Jhn',19,'32-34')\">19:32-34</a>";
torreysArray["$$T0000709-10"]=". c. References to the intellectual and spiritual faculties which He had in common with men.";
torreysArray["$$T0000709-11"]="# <a href=\"#\"onClick=\"return mV('Mat',4,'1-11')\">Mat 4:1-11</a>; <a href=\"#\"onClick=\"return mV('Mat',26,38)\">26:38</a>; <a href=\"#\"onClick=\"return mV('Mar',10,14)\">Mar 10:14</a>; <a href=\"#\"onClick=\"return mV('Mar',11,13)\">11:13</a>; <a href=\"#\"onClick=\"return mV('Luk',2,52)\">Luk 2:52</a>; <a href=\"#\"onClick=\"return mV('Luk',4,'16-22')\">4:16-22</a>; <a href=\"#\"onClick=\"return mV('Jhn',2,24)\">Jhn 2:24</a>; <a href=\"#\"onClick=\"return mV('Jhn',11,'3-5',33)\">11:3-5, 33</a>";
torreysArray["$$T0000709-12"]="- 3. He is truly God and Man";
torreysArray["$$T0000709-13"]=". These two natures, the divine and the human, combined in Christ as the God-man.";
torreysArray["$$T0000709-14"]=". a. In many passages both natures are referred to.";
torreysArray["$$T0000709-15"]="# <a href=\"#\"onClick=\"return mV('Jhn',1,14)\">Jhn 1:14</a>; <a href=\"#\"onClick=\"return mV('Rom',1,3,4)\">Rom 1:3-4</a>; <a href=\"#\"onClick=\"return mV('Rom',8,3)\">8:3</a>; <a href=\"#\"onClick=\"return mV('Rom',9,5)\">9:5</a>; <a href=\"#\"onClick=\"return mV('Gal',4,4)\">Gal 4:4</a>; <a href=\"#\"onClick=\"return mV('Phl',2,11)\">Phl 2:11</a>; <a href=\"#\"onClick=\"return mV('1Jo',4,3)\">1Jo 4:3</a>";
torreysArray["$$T0000709-16"]=". b. Passages which speak of the human attributes and actions of Christ while the divine title is used.";
torreysArray["$$T0000709-17"]="# <a href=\"#\"onClick=\"return mV('Mat',1,23)\">Mat 1:23</a>; <a href=\"#\"onClick=\"return mV('Luk',1,31,32)\">Luk 1:31-32</a>; <a href=\"#\"onClick=\"return mV('Act',20,28)\">Act 20:28</a>; <a href=\"#\"onClick=\"return mV('Rom',8,32)\">Rom 8:32</a>; <a href=\"#\"onClick=\"return mV('1Cr',2,8)\">1Cr 2:8</a>; <a href=\"#\"onClick=\"return mV('Col',1,'13-17')\">Col 1:13-17</a>";
torreysArray["$$T0000709-18"]=". c. Passages which speak of the divine attributes and actions of Christ while He is designated by the human title.";
torreysArray["$$T0000709-19"]="# <a href=\"#\"onClick=\"return mV('Jhn',3,13)\">Jhn 3:13</a>; <a href=\"#\"onClick=\"return mV('Jhn',6,62)\">6:62</a>; <a href=\"#\"onClick=\"return mV('Rom',9,5)\">Rom 9:5</a>; <a href=\"#\"onClick=\"return mV('Rev',5,12,13)\">Rev 5:12-13</a>";
torreysArray["$$T0000710-0"]=105;
torreysArray["$$T0000710-1"]="Concerning Redemption, The Work of the Redeemer";
torreysArray["$$T0000710-2"]="- C. The work of the Redeemer as Prophet, Priest, and King.";
torreysArray["$$T0000710-3"]="- 1. As prophet.";
torreysArray["$$T0000710-4"]=". A prophet of God is one who has authority and who has the necessary qualifications to convey God's messages to men. He may also be an interpreter.";
torreysArray["$$T0000710-5"]=". a. Christ executed the office of prophet, by His word and by His works.";
torreysArray["$$T0000710-6"]="";
torreysArray["$$T0000710-7"]="# <a href=\"#\"onClick=\"return mV('Mat',5,24)\">Mat 5:24</a>";
torreysArray["$$T0000710-8"]=". b. Also through other agents: through His Spirit, by inspiration, by spiritual illumination, through the officers of the church inspired as apostles, prophets, and teachers.";
torreysArray["$$T0000710-9"]="# <a href=\"#\"onClick=\"return mV('Eph',4,11,12)\">Eph 4:11-12</a>; <a href=\"#\"onClick=\"return mV('1Jo',2,20)\">1Jo 2:20</a>; <a href=\"#\"onClick=\"return mV('1Jo',5,20)\">5:20</a>. He continues to execute the office of prophet through eternity. <a href=\"#\"onClick=\"return mV('Rev',7,17)\">Rev 7:17</a>; <a href=\"#\"onClick=\"return mV('Rev',21,23)\">21:23</a>";
torreysArray["$$T0000710-10"]="- 2. As priest.";
torreysArray["$$T0000710-11"]=". A priest is one who is qualified and authorized to \"draw near to the Lord for men.\"";
torreysArray["$$T0000710-12"]="# <a href=\"#\"onClick=\"return mV('Exd',19,22)\">Exd 19:22</a>; <a href=\"#\"onClick=\"return mV('Hbr',5,1)\">Hbr 5:1</a>.";
torreysArray["$$T0000710-13"]=". a. Must be taken from among men to represent them.";
torreysArray["$$T0000710-14"]="# <a href=\"#\"onClick=\"return mV('Exd',28,9,12,21,29)\">Exd 28:9, 12, 21, 29</a>; <a href=\"#\"onClick=\"return mV('Hbr',5,12)\">Hbr 5:12</a>";
torreysArray["$$T0000710-15"]=". b. Must be chosen by God.";
torreysArray["$$T0000710-16"]="# <a href=\"#\"onClick=\"return mV('Exd',28,1)\">Exd 28:1</a>; <a href=\"#\"onClick=\"return mV('Num',16,5)\">Num 16:5</a>; <a href=\"#\"onClick=\"return mV('Hbr',5,4)\">Hbr 5:4</a>";
torreysArray["$$T0000710-17"]=". c. Must be holy--morally pure and consecrated to God.";
torreysArray["$$T0000710-18"]="# <a href=\"#\"onClick=\"return mV('Exd',39,30,31)\">Exd 39:30-31</a>; <a href=\"#\"onClick=\"return mV('Lev',21,6,8)\">Lev 21:6, 8</a>; <a href=\"#\"onClick=\"return mV('Psa',106,16)\">Psa 106:16</a>";
torreysArray["$$T0000710-19"]=". d. Must have a right to draw near to Jehovah and to offer sacrifices and make intercession.";
torreysArray["$$T0000710-20"]="# <a href=\"#\"onClick=\"return mV('Exd',19,22)\">Exd 19:22</a>; <a href=\"#\"onClick=\"return mV('Lev',16,3,7,12,15)\">Lev 16:3, 7, 12, 15</a>; <a href=\"#\"onClick=\"return mV('Num',16,5)\">Num 16:5</a>";
torreysArray["$$T0000710-21"]=". e. The Old Testament declares Christ to be a priest.";
torreysArray["$$T0000710-22"]="# <a href=\"#\"onClick=\"return mV('Psa',110,4)\">Psa 110:4</a>; <a href=\"#\"onClick=\"return mV('Hbr',5,6)\">Hbr 5:6</a>; <a href=\"#\"onClick=\"return mV('Hbr',6,20)\">6:20</a>; <a href=\"#\"onClick=\"return mV('Zec',6,13)\">Zec 6:13</a>";
torreysArray["$$T0000710-23"]=". f. Priestly functions ascribed to Him.";
torreysArray["$$T0000710-24"]="# <a href=\"#\"onClick=\"return mV('Isa',53,10)\">Isa 53:10</a>; <a href=\"#\"onClick=\"return mV('Dan',9,24,25)\">Dan 9:24-25</a>.  The temple and its services and all Old Testament sacrifices typical of Christ and His work. He superseded these.  <a href=\"#\"onClick=\"return mV('Col',2,17)\">Col 2:17</a>; <a href=\"#\"onClick=\"return mV('Hbr',9,'10-12')\">Hbr 9:10-12</a>; <a href=\"#\"onClick=\"return mV('Hbr',10,11,12)\">10:11-12</a>";
torreysArray["$$T0000710-25"]=". g. New Testament proof. Was taken from among men to stand for them for God.";
torreysArray["$$T0000710-26"]="# <a href=\"#\"onClick=\"return mV('Hbr',2,16)\">Hbr 2:16</a>; <a href=\"#\"onClick=\"return mV('Hbr',4,15)\">4:15</a>.";
torreysArray["$$T0000710-27"]="Was chosen by God. <a href=\"#\"onClick=\"return mV('Hbr',5,5,6)\">Hbr 5:5-6</a>. Was perfectly holy. <a href=\"#\"onClick=\"return mV('Luk',1,35)\">Luk 1:35</a>; <a href=\"#\"onClick=\"return mV('Hbr',7,26)\">Hbr 7:26</a>. Has the right of the nearest access and the greatest influence with the Father. <a href=\"#\"onClick=\"return mV('Jhn',11,42)\">Jhn 11:42</a>; <a href=\"#\"onClick=\"return mV('Jhn',16,28)\">16:28</a>; <a href=\"#\"onClick=\"return mV('Hbr',1,3)\">Hbr 1:3</a>; <a href=\"#\"onClick=\"return mV('Hbr',9,'11-24')\">9:11-24</a>";
torreysArray["$$T0000710-28"]="@ 1. He \"mediated\" in the general sense of the term.";
torreysArray["$$T0000710-29"]="# <a href=\"#\"onClick=\"return mV('Jhn',14,6)\">Jhn 14:6</a>; <a href=\"#\"onClick=\"return mV('1Ti',2,5)\">1Ti 2:5</a>; <a href=\"#\"onClick=\"return mV('Hbr',8,6)\">Hbr 8:6</a>";
torreysArray["$$T0000710-30"]="@ 2. He offered propitiation.";
torreysArray["$$T0000710-31"]="# <a href=\"#\"onClick=\"return mV('Eph',5,25)\">Eph 5:25</a>; <a href=\"#\"onClick=\"return mV('Hbr',9,26)\">Hbr 9:26</a>; <a href=\"#\"onClick=\"return mV('Hbr',10,12)\">10:12</a>; <a href=\"#\"onClick=\"return mV('1Jo',2,2)\">1Jo 2:2</a>";
torreysArray["$$T0000710-32"]="@ 3. He makes intercession.";
torreysArray["$$T0000710-33"]="# <a href=\"#\"onClick=\"return mV('Rom',8,4)\">Rom 8:4</a>; <a href=\"#\"onClick=\"return mV('Hbr',7,25)\">Hbr 7:25</a>; <a href=\"#\"onClick=\"return mV('1Jo',2,1)\">1Jo 2:1</a>";
torreysArray["$$T0000710-34"]=". h. Christ as priest made atonement for us, was made a substitute for us. A substitute is one appointed or accepted to act or to suffer in the stead of another, and His actions or sufferings are <i>vicarious</i>.";
torreysArray["$$T0000710-35"]="";
torreysArray["$$T0000710-36"]="";
torreysArray["$$T0000710-37"]="";
torreysArray["$$T0000710-38"]="";
torreysArray["$$T0000710-39"]="@ 1. The Greek preposition <i>huper</i>, with the genitive, sometimes signifies <i>instead of</i>, and the construction is used to set forth the relation of Christ's work to us.";
torreysArray["$$T0000710-40"]="";
torreysArray["$$T0000710-41"]="";
torreysArray["$$T0000710-42"]="";
torreysArray["$$T0000710-43"]="# <a href=\"#\"onClick=\"return mV('2Cr',5,14,15,20)\">2Cr 5:14-15, 20</a>; <a href=\"#\"onClick=\"return mV('Gal',3,13)\">Gal 3:13</a>; <a href=\"#\"onClick=\"return mV('Phm',1,13)\">Phm 1:13</a>; <a href=\"#\"onClick=\"return mV('1Pe',3,18)\">1Pe 3:18</a>";
torreysArray["$$T0000710-44"]="@ 2. The preposition <i>anti</i> definitely and always expressed substitution.";
torreysArray["$$T0000710-45"]="";
torreysArray["$$T0000710-46"]="# <a href=\"#\"onClick=\"return mV('Mat',2,22)\">Mat 2:22</a>; <a href=\"#\"onClick=\"return mV('Mat',5,38)\">5:38</a>; <a href=\"#\"onClick=\"return mV('Mat',20,28)\">20:28</a>; <a href=\"#\"onClick=\"return mV('Mar',10,45)\">Mar 10:45</a>; <a href=\"#\"onClick=\"return mV('1Ti',2,6)\">1Ti 2:6</a>";
torreysArray["$$T0000710-47"]="@ 3. The same is true as to what the Scriptures teach as to our sins being laid upon Christ.";
torreysArray["$$T0000710-48"]="";
torreysArray["$$T0000710-49"]="# <a href=\"#\"onClick=\"return mV('Lev',7,18)\">Lev 7:18</a>; <a href=\"#\"onClick=\"return mV('Num',18,27)\">Num 18:27</a>; <a href=\"#\"onClick=\"return mV('Psa',106,31)\">Psa 106:31</a>; <a href=\"#\"onClick=\"return mV('Isa',53,12)\">Isa 53:12</a>; <a href=\"#\"onClick=\"return mV('Luk',22,36)\">Luk 22:36</a>; <a href=\"#\"onClick=\"return mV('Rom',2,26)\">Rom 2:26</a>; <a href=\"#\"onClick=\"return mV('Rom',4,'3-9')\">4:3-9</a>; <a href=\"#\"onClick=\"return mV('2Cr',5,'19-21')\">2Cr 5:19-21</a>; <a href=\"#\"onClick=\"return mV('Gal',3,13)\">Gal 3:13</a>";
torreysArray["$$T0000710-50"]="@ 4. The effects of Christ's action as priest are shown.";
torreysArray["$$T0000710-51"]="# a. As toward God, they are declared to be propitiatory. <a href=\"#\"onClick=\"return mV('Rom',3,25,26)\">Rom 3:25-26</a>; <a href=\"#\"onClick=\"return mV('Hbr',2,17)\">Hbr 2:17</a>; <a href=\"#\"onClick=\"return mV('1Jo',2,2)\">1Jo 2:2</a>; <a href=\"#\"onClick=\"return mV('1Jo',4,10)\">4:10</a>";
torreysArray["$$T0000710-52"]="# b. As respects the sinner, they are declared to be redemption, deliverance by ransom. <a href=\"#\"onClick=\"return mV('Isa',51,11)\">Isa 51:11</a>; <a href=\"#\"onClick=\"return mV('Isa',62,12)\">62:12</a>; <a href=\"#\"onClick=\"return mV('1Cr',7,23)\">1Cr 7:23</a>; <a href=\"#\"onClick=\"return mV('Gal',3,13,14)\">Gal 3:13-14</a>; <a href=\"#\"onClick=\"return mV('1Ti',2,6)\">1Ti 2:6</a>; <a href=\"#\"onClick=\"return mV('1Pe',1,18,19)\">1Pe 1:18-19</a>; <a href=\"#\"onClick=\"return mV('Rev',5,9)\">Rev 5:9</a>";
torreysArray["$$T0000710-53"]="- 3. As King.";
torreysArray["$$T0000710-54"]=". The kingdom of Christ a very prominent subject in Scripture.";
torreysArray["$$T0000710-55"]="# <a href=\"#\"onClick=\"return mV('Dan',2,44)\">Dan 2:44</a>; <a href=\"#\"onClick=\"return mV('/kjv/Mat/Mat013.html#top')\">Mat 13</a>; <a href=\"#\"onClick=\"return mV('Mat',22,'1-14')\">22:1-14</a>; <a href=\"#\"onClick=\"return mV('Luk',13,'22-30')\">Luk 13:22-30</a>; <a href=\"#\"onClick=\"return mV('Luk',17,20,21)\">17:20-21</a>; <a href=\"#\"onClick=\"return mV('Rom',14,17)\">Rom 14:17</a>; <a href=\"#\"onClick=\"return mV('Eph',1,10,'20-22')\">Eph 1:10, 20-22</a>; <a href=\"#\"onClick=\"return mV('1Pe',3,22)\">1Pe 3:22</a>";
torreysArray["$$T0000710-56"]=". a. Christ's authority embraces the universe.";
torreysArray["$$T0000710-57"]="# <a href=\"#\"onClick=\"return mV('Mat',28,18)\">Mat 28:18</a>; <a href=\"#\"onClick=\"return mV('Eph',1,'17-23')\">Eph 1:17-23</a>; <a href=\"#\"onClick=\"return mV('Phl',2,'9-11')\">Phl 2:9-11</a> It is distinguished as --";
torreysArray["$$T0000710-58"]="@ 1. <i>His kingdom of power</i>, embracing the entire universe in His providential and judicial administration.";
torreysArray["$$T0000710-59"]="# <a href=\"#\"onClick=\"return mV('Jhn',5,'22-27')\">Jhn 5:22-27</a>; <a href=\"#\"onClick=\"return mV('Jhn',9,39)\">9:39</a>; <a href=\"#\"onClick=\"return mV('1Cr',15,25)\">1Cr 15:25</a>; <a href=\"#\"onClick=\"return mV('Hbr',10,12,13)\">Hbr 10:12-13</a>";
torreysArray["$$T0000710-60"]="@ 2. <i>His kingdom of grace</i>, spiritual alike as to its subjects, laws, modes of administration and instrumentalities.";
torreysArray["$$T0000710-61"]="@ 3. <i>His kingdom of glory</i>, the consummation of His gracious administration, will continue forever.";
torreysArray["$$T0000710-62"]=". b. The object of Christ's authority is to accomplish the salvation of His church.";
torreysArray["$$T0000710-63"]="# <a href=\"#\"onClick=\"return mV('Eph',1,22,23)\">Eph 1:22-23</a>";
torreysArray["$$T0000710-64"]="@ 1. To cause all things to work together for the good of His people.";
torreysArray["$$T0000710-65"]="# <a href=\"#\"onClick=\"return mV('Rom',8,28)\">Rom 8:28</a>";
torreysArray["$$T0000710-66"]="@ 2. To establish a kingdom for them.";
torreysArray["$$T0000710-67"]="# <a href=\"#\"onClick=\"return mV('Luk',22,29)\">Luk 22:29</a>; <a href=\"#\"onClick=\"return mV('Jhn',14,2)\">Jhn 14:2</a>";
torreysArray["$$T0000710-68"]="# a. To subjugate all His enemies. <a href=\"#\"onClick=\"return mV('1Cr',15,25)\">1Cr 15:25</a>";
torreysArray["$$T0000710-69"]="# b. That all should worship Him. <a href=\"#\"onClick=\"return mV('Hbr',1,6)\">Hbr 1:6</a>; <a href=\"#\"onClick=\"return mV('Rev',5,'9-13')\">Rev 5:9-13</a>";
torreysArray["$$T0000710-70"]=". c. The following are some of the titles to this kingdom, with the sense in which they are used.";
torreysArray["$$T0000710-71"]="@ 1. <i>The kingdom of God</i>,";
torreysArray["$$T0000710-72"]="# <a href=\"#\"onClick=\"return mV('Luk',4,43)\">Luk 4:43</a>, because of divine origin and the authority of God exercised in its administration.";   torreysArray["$$T0000710-73"]="@ 2. <i>The kingdom of Christ</i>,";
torreysArray["$$T0000710-74"]="# <a href=\"#\"onClick=\"return mV('Mat',16,28)\">Mat 16:28</a>; <a href=\"#\"onClick=\"return mV('Col',1,13)\">Col 1:13</a>,";
torreysArray["$$T0000710-75"]="because He is in person the immediate sovereign.";
torreysArray["$$T0000710-76"]="@ 3. <i>The kingdom of heaven</i>,";
torreysArray["$$T0000710-77"]="# <a href=\"#\"onClick=\"return mV('Mat',11,12)\">Mat 11:12</a>, because its origin and characteristics are from heaven and its consummation is to be in heaven.";
torreysArray["$$T0000710-78"]=". d. Christ's administration of His kingdom presents two aspects --:";
torreysArray["$$T0000710-79"]="";
torreysArray["$$T0000710-80"]="# (1) As militant. <a href=\"#\"onClick=\"return mV('Eph',6,'11-17')\">Eph 6:11-17</a>.";
torreysArray["$$T0000710-81"]="# (2) As glorified, or triumphant. <a href=\"#\"onClick=\"return mV('Rev',3,21)\">Rev 3:21</a>.";
torreysArray["$$T0000710-82"]="@ Accordingly Christ is represented as";
torreysArray["$$T0000710-83"]="# a great Captain, (<a href=\"#\"onClick=\"return mV('Rev',19,11,16)\">Rev 19:11, 16</a>), and";
torreysArray["$$T0000710-84"]="# as a Prince reigning upon His throne. <a href=\"#\"onClick=\"return mV('Rev',21,5,22,23)\">Rev 21:5, 22-23</a>";
torreysArray["$$T0000710-85"]="@ The throne upon which Christ sits is represented as --";
torreysArray["$$T0000710-86"]="# A throne of grace. <a href=\"#\"onClick=\"return mV('Hbr',4,16)\">Hbr 4:16</a>.";
torreysArray["$$T0000710-87"]="# A throne of judgment. <a href=\"#\"onClick=\"return mV('Rev',20,'11-15')\">Rev 20:11-15</a>.";
torreysArray["$$T0000710-88"]="# A throne of glory. <a href=\"#\"onClick=\"return mV('Rev',4,3)\">Rev 4:3</a>; <a href=\"#\"onClick=\"return mV('Rev',5,6)\">5:6</a>";
torreysArray["$$T0000710-89"]=". e. The sense in which Christ's kingdom is spiritual.";
torreysArray["$$T0000710-90"]="@ 1. The king is a spiritual and not an earthly sovereign.";
torreysArray["$$T0000710-91"]="# <a href=\"#\"onClick=\"return mV('Mat',20,28)\">Mat 20:28</a>; <a href=\"#\"onClick=\"return mV('Jhn',18,36)\">Jhn 18:36</a>";
torreysArray["$$T0000710-92"]="@ 2. His throne is at the right hand of God.";
torreysArray["$$T0000710-93"]="# <a href=\"#\"onClick=\"return mV('Hbr',1,3)\">Hbr 1:3</a>";
torreysArray["$$T0000710-94"]="@ 3. His sceptre is spiritual.";
torreysArray["$$T0000710-95"]="# <a href=\"#\"onClick=\"return mV('Psa',110,2)\">Psa 110:2</a>; <a href=\"#\"onClick=\"return mV('Isa',61,'1-3')\">Isa 61:1-3</a>; <a href=\"#\"onClick=\"return mV('Isa',63,1)\">63:1</a>";
torreysArray["$$T0000710-96"]="@ 4. The citizens of the kingdom are spiritual men.";
torreysArray["$$T0000710-97"]="# <a href=\"#\"onClick=\"return mV('Jhn',4,24)\">Jhn 4:24</a>";
torreysArray["$$T0000710-98"]="@ 5. The mode in which He administers His government is spiritual.";
torreysArray["$$T0000710-99"]="# <a href=\"#\"onClick=\"return mV('Zec',4,6,7)\">Zec 4:6-7</a>";
torreysArray["$$T0000710-100"]="@ 6. His laws are spiritual.";
torreysArray["$$T0000710-101"]="# <a href=\"#\"onClick=\"return mV('Jhn',4,24)\">Jhn 4:24</a>";
torreysArray["$$T0000710-102"]="@ 7. The blessings and penalties of His kingdom are spiritual.";
torreysArray["$$T0000710-103"]="# <a href=\"#\"onClick=\"return mV('1Cr',3,'4-11')\">1Cr 3:4-11</a>; <a href=\"#\"onClick=\"return mV('2Cr',10,4)\">2Cr 10:4</a>; <a href=\"#\"onClick=\"return mV('Eph',1,'3-8')\">Eph 1:3-8</a>; <a href=\"#\"onClick=\"return mV('2Ti',4,2)\">2Ti 4:2</a>; <a href=\"#\"onClick=\"return mV('Tts',2,15)\">Tts 2:15</a>";
torreysArray["$$T0000710-104"]=". f. Christ as seated at the right hand of the Father. Some of the language may be figurative, but it sets forth the glorification of Christ in heaven. It presents Him as the God-man exalted to supreme and universal glory and power.";
torreysArray["$$T0000710-105"]="# <a href=\"#\"onClick=\"return mV('Psa',110,1)\">Psa 110:1</a>; <a href=\"#\"onClick=\"return mV('Dan',7,13,14)\">Dan 7:13-14</a>; <a href=\"#\"onClick=\"return mV('Mat',26,64)\">Mat 26:64</a>; <a href=\"#\"onClick=\"return mV('Mar',16,19)\">Mar 16:19</a>; <a href=\"#\"onClick=\"return mV('Jhn',5,22)\">Jhn 5:22</a>; <a href=\"#\"onClick=\"return mV('Rom',8,34)\">Rom 8:34</a>; <a href=\"#\"onClick=\"return mV('Eph',1,'20-22')\">Eph 1:20-22</a>; <a href=\"#\"onClick=\"return mV('Phl',2,'9-11')\">Phl 2:9-11</a>; <a href=\"#\"onClick=\"return mV('Col',3,1)\">Col 3:1</a>; <a href=\"#\"onClick=\"return mV('Hbr',1,3,4)\">Hbr 1:3-4</a>; <a href=\"#\"onClick=\"return mV('Hbr',2,9)\">2:9</a>; <a href=\"#\"onClick=\"return mV('Hbr',10,12)\">10:12</a>; <a href=\"#\"onClick=\"return mV('1Pe',3,22)\">1Pe 3:22</a>; <a href=\"#\"onClick=\"return mV('Rev',5,6)\">Rev 5:6</a>";
torreysArray["$$T0000711-0"]=33;
torreysArray["$$T0000711-1"]="Concerning Redemption, The Work of the Holy Spirit";
torreysArray["$$T0000711-2"]="- D. The work of the Holy Spirit in Redemption. (See Personality and Deity under head of the <a href=\"#\"onClick=\"return doDictLookup('TT0000702');\">Trinity</a>)";
torreysArray["$$T0000711-3"]="- 1. The Father and the Son work by, and through, the Holy Spirit.";
torreysArray["$$T0000711-4"]=". He came upon men and clothed them with the power of God as worker, prophet or leader.";
torreysArray["$$T0000711-5"]="# <a href=\"#\"onClick=\"return mV('Gen',41,39)\">Gen 41:39</a>; <a href=\"#\"onClick=\"return mV('Exd',31,'1-3')\">Exd 31:1-3</a>; <a href=\"#\"onClick=\"return mV('Exd',35,31)\">35:31</a>; <a href=\"#\"onClick=\"return mV('Num',11,29)\">Num 11:29</a>; <a href=\"#\"onClick=\"return mV('Num',24,2)\">24:2</a>; <a href=\"#\"onClick=\"return mV('1Sa',10,10)\">1Sa 10:10</a>; <a href=\"#\"onClick=\"return mV('2Ch',15,1)\">2Ch 15:1</a>; <a href=\"#\"onClick=\"return mV('Isa',63,11)\">Isa 63:11</a>; <a href=\"#\"onClick=\"return mV('Eze',11,23,24)\">Eze 11:23-24</a>";
torreysArray["$$T0000711-6"]="- 2. His special individual work.";
torreysArray["$$T0000711-7"]=". a. To convict of sin.";
torreysArray["$$T0000711-8"]="# <a href=\"#\"onClick=\"return mV('Jhn',16,8)\">Jhn 16:8</a>; <a href=\"#\"onClick=\"return mV('Act',2,37)\">Act 2:37</a>";
torreysArray["$$T0000711-9"]=". b. To regenerate.";
torreysArray["$$T0000711-10"]="# <a href=\"#\"onClick=\"return mV('Jhn',3,'3-5')\">Jhn 3:3-5</a>; <a href=\"#\"onClick=\"return mV('Jhn',6,63)\">6:63</a>; <a href=\"#\"onClick=\"return mV('Tts',3,'5-7')\">Tts 3:5-7</a>";
torreysArray["$$T0000711-11"]=". c. To witness concerning Jesus.";
torreysArray["$$T0000711-12"]="# <a href=\"#\"onClick=\"return mV('Hbr',10,15)\">Hbr 10:15</a>; <a href=\"#\"onClick=\"return mV('1Jo',5,7)\">1Jo 5:7</a>";
torreysArray["$$T0000711-13"]=". d. He is the author of assurance to us.";
torreysArray["$$T0000711-14"]="# <a href=\"#\"onClick=\"return mV('Rom',8,'14-16')\">Rom 8:14-16</a>; <a href=\"#\"onClick=\"return mV('1Jo',4,13)\">1Jo 4:13</a>";
torreysArray["$$T0000711-15"]=". e. He is the inspirer of the Scriptures and our personal teacher.";
torreysArray["$$T0000711-16"]="# <a href=\"#\"onClick=\"return mV('Jhn',14,26)\">Jhn 14:26</a>; <a href=\"#\"onClick=\"return mV('Jhn',16,13)\">16:13</a>; <a href=\"#\"onClick=\"return mV('1Cr',2,'9-13')\">1Cr 2:9-13</a>; <a href=\"#\"onClick=\"return mV('1Cr',12,'3-8')\">12:3-8</a>; <a href=\"#\"onClick=\"return mV('1Th',1,5)\">1Th 1:5</a>; <a href=\"#\"onClick=\"return mV('2Ti',3,16)\">2Ti 3:16</a>; <a href=\"#\"onClick=\"return mV('Hbr',3,7)\">Hbr 3:7</a>; <a href=\"#\"onClick=\"return mV('2Pe',1,21)\">2Pe 1:21</a>";
torreysArray["$$T0000711-17"]=". f. He dwells in the disciples of Jesus.";
torreysArray["$$T0000711-18"]="# <a href=\"#\"onClick=\"return mV('1Cr',2,'9-16')\">1Cr 2:9-16</a>; <a href=\"#\"onClick=\"return mV('1Cr',6,17)\">6:17</a>; <a href=\"#\"onClick=\"return mV('1Cr',12,13)\">12:13</a>; <a href=\"#\"onClick=\"return mV('Gal',3,5)\">Gal 3:5</a>; <a href=\"#\"onClick=\"return mV('Gal',4,6)\">4:6</a>; <a href=\"#\"onClick=\"return mV('Gal',5,25)\">5:25</a>; <a href=\"#\"onClick=\"return mV('Eph',2,22)\">Eph 2:22</a>; <a href=\"#\"onClick=\"return mV('Eph',3,16)\">3:16</a>; <a href=\"#\"onClick=\"return mV('Eph',5,18)\">5:18</a>; <a href=\"#\"onClick=\"return mV('1Pe',1,11)\">1Pe 1:11</a>; <a href=\"#\"onClick=\"return mV('1Jo',3,24)\">1Jo 3:24</a>";
torreysArray["$$T0000711-19"]=". g. He sheds abroad the love of God in our hearts.";
torreysArray["$$T0000711-20"]="# <a href=\"#\"onClick=\"return mV('Rom',5,5)\">Rom 5:5</a>";
torreysArray["$$T0000711-21"]=". h. He gives hope, joy, peace, liberty.";
torreysArray["$$T0000711-22"]="# <a href=\"#\"onClick=\"return mV('Gal',5,22)\">Gal 5:22</a>; <a href=\"#\"onClick=\"return mV('2Cr',3,17)\">2Cr 3:17</a>";
torreysArray["$$T0000711-23"]=". i. He is the Comforter.";
torreysArray["$$T0000711-24"]="# <a href=\"#\"onClick=\"return mV('Jhn',14,16,26)\">Jhn 14:16, 26</a>; <a href=\"#\"onClick=\"return mV('Jhn',15,26)\">15:26</a>; <a href=\"#\"onClick=\"return mV('Jhn',16,7)\">16:7</a>; <a href=\"#\"onClick=\"return mV('Act',9,31)\">Act 9:31</a>; <a href=\"#\"onClick=\"return mV('Rom',15,13)\">Rom 15:13</a>";
torreysArray["$$T0000711-25"]=". j. He sanctifies.";
torreysArray["$$T0000711-26"]="# <a href=\"#\"onClick=\"return mV('Rom',8,'6-11')\">Rom 8:6-11</a>; <a href=\"#\"onClick=\"return mV('1Cr',6,11)\">1Cr 6:11</a>; <a href=\"#\"onClick=\"return mV('Gal',5,'22-26')\">Gal 5:22-26</a>; <a href=\"#\"onClick=\"return mV('2Th',2,13)\">2Th 2:13</a>";
torreysArray["$$T0000711-27"]="- 3. The Holy Spirit for Service.";
torreysArray["$$T0000711-28"]=". a. The gift. (See texts under D, 1).";
torreysArray["$$T0000711-29"]="# <a href=\"#\"onClick=\"return mV('Jhn',14,17)\">Jhn 14:17</a>; <a href=\"#\"onClick=\"return mV('1Cr',3,16)\">1Cr 3:16</a>; <a href=\"#\"onClick=\"return mV('1Cr',6,19,20)\">6:19-20</a>; <a href=\"#\"onClick=\"return mV('Luk',4,'17-21')\">Luk 4:17-21</a>; <a href=\"#\"onClick=\"return mV('Jhn',3,34)\">Jhn 3:34</a>; <a href=\"#\"onClick=\"return mV('Act',10,38)\">Act 10:38</a>; <a href=\"#\"onClick=\"return mV('Isa',44,3)\">Isa 44:3</a>; <a href=\"#\"onClick=\"return mV('Act',1,5,8)\">Act 1:5, 8</a>; <a href=\"#\"onClick=\"return mV('Act',2,4,38,39)\">2:4, 38, 39</a>; <a href=\"#\"onClick=\"return mV('Act',4,31)\">4:31</a>; <a href=\"#\"onClick=\"return mV('Act',6,3)\">6:3</a>; <a href=\"#\"onClick=\"return mV('Act',9,17)\">9:17</a>";
torreysArray["$$T0000711-30"]=". b. How given.";
torreysArray["$$T0000711-31"]="# <a href=\"#\"onClick=\"return mV('Luk',11,13)\">Luk 11:13</a>; <a href=\"#\"onClick=\"return mV('Luk',24,49)\">24:49</a>; <a href=\"#\"onClick=\"return mV('Jhn',20,22)\">Jhn 20:22</a>; <a href=\"#\"onClick=\"return mV('Act',1,4)\">Act 1:4</a>; <a href=\"#\"onClick=\"return mV('Act',2,38)\">2:38</a>; <a href=\"#\"onClick=\"return mV('Act',5,32)\">5:32</a>; <a href=\"#\"onClick=\"return mV('Act',8,17)\">8:17</a>; <a href=\"#\"onClick=\"return mV('Act',19,6)\">19:6</a>; <a href=\"#\"onClick=\"return mV('1Jo',5,14,15)\">1Jo 5:14-15</a>";
torreysArray["$$T0000711-32"]=". c. As to the renewal of the gift.";
torreysArray["$$T0000711-33"]="# <a href=\"#\"onClick=\"return mV('Act',4,31)\">Act 4:31</a>; <a href=\"#\"onClick=\"return mV('Act',10,44)\">10:44</a>; <a href=\"#\"onClick=\"return mV('Act',11,15)\">11:15</a>; <a href=\"#\"onClick=\"return mV('Act',13,52)\">13:52</a>";
torreysArray["$$T0000712-0"]=277;
torreysArray["$$T0000712-1"]="Concerning Redemption, The Work of Redemption";
torreysArray["$$T0000712-2"]="- E. The Work of Redemption as Related to the Believer.";
torreysArray["$$T0000712-3"]="-1. The Union between Christ and the Believer.";
torreysArray["$$T0000712-4"]="- a. As to its nature.";
torreysArray["$$T0000712-5"]=". # Christ as the second Adam (<a href=\"#\"onClick=\"return mV('1Cr',15,22)\">1Cr 15:22</a>) assumes in the covenant of grace those broken obligations of the covenant of works which the first Adam failed to discharge, and fulfils them all in behalf of all His \"sheep\"--those whom the Father has given Him.";
torreysArray["$$T0000712-6"]="";
torreysArray["$$T0000712-7"]="";
torreysArray["$$T0000712-8"]="";
torreysArray["$$T0000712-9"]="";
torreysArray["$$T0000712-10"]="";
torreysArray["$$T0000712-11"]=". 2. Its spiritual and vital character.";
torreysArray["$$T0000712-12"]="@ a. It is a <i>spiritual</i> union.";
torreysArray["$$T0000712-13"]="# <a href=\"#\"onClick=\"return mV('1Cr',6,17)\">1Cr 6:17</a>; <a href=\"#\"onClick=\"return mV('1Cr',12,13)\">12:13</a>; <a href=\"#\"onClick=\"return mV('1Jo',3,24)\">1Jo 3:24</a>; <a href=\"#\"onClick=\"return mV('1Jo',4,13)\">4:13</a>";
torreysArray["$$T0000712-14"]="@ b. It is a <i>vital</i> union.";
torreysArray["$$T0000712-15"]="# <a href=\"#\"onClick=\"return mV('Jhn',14,19)\">Jhn 14:19</a>; <a href=\"#\"onClick=\"return mV('Gal',2,20)\">Gal 2:20</a>";
torreysArray["$$T0000712-16"]="@ c. It embraces our entire persons.";
torreysArray["$$T0000712-17"]="# <a href=\"#\"onClick=\"return mV('1Cr',6,15,19)\">1Cr 6:15, 19</a>";
torreysArray["$$T0000712-18"]="@ d. It is an <i>indissoluble</i> union.";
torreysArray["$$T0000712-19"]="# <a href=\"#\"onClick=\"return mV('Jhn',10,28)\">Jhn 10:28</a>; <a href=\"#\"onClick=\"return mV('Jhn',14,23)\">14:23</a>; <a href=\"#\"onClick=\"return mV('Jhn',17,21,23)\">17:21, 23</a>; <a href=\"#\"onClick=\"return mV('1Th',4,14,17)\">1Th 4:14, 17</a>";
torreysArray["$$T0000712-20"]="- b. As to its consequences (in general)--";
torreysArray["$$T0000712-21"]=". 1. Believers have a community with Christ in His covenant standing and rights.";
torreysArray["$$T0000712-22"]="# <a href=\"#\"onClick=\"return mV('Rom',8,1)\">Rom 8:1</a>; <a href=\"#\"onClick=\"return mV('Eph',1,6,11,13)\">Eph 1:6, 11, 13</a>; <a href=\"#\"onClick=\"return mV('Phl',3,8,9)\">Phl 3:8-9</a>; <a href=\"#\"onClick=\"return mV('Col',2,10)\">Col 2:10</a>";
torreysArray["$$T0000712-23"]=". His mediatorial office embraces three principal functions:--";
torreysArray["$$T0000712-24"]="@ (1) Prophet. In fellowship with Him the believer is a prophet.";
torreysArray["$$T0000712-25"]="# <a href=\"#\"onClick=\"return mV('Jhn',16,13)\">Jhn 16:13</a>; <a href=\"#\"onClick=\"return mV('1Jo',2,27)\">1Jo 2:27</a>.";
torreysArray["$$T0000712-26"]="@ (2) Priest. The believer is also a priest in Him.";
torreysArray["$$T0000712-27"]="# <a href=\"#\"onClick=\"return mV('Isa',61,6)\">Isa 61:6</a>; <a href=\"#\"onClick=\"return mV('1Pe',2,5)\">1Pe 2:5</a>; <a href=\"#\"onClick=\"return mV('Rev',20,6)\">Rev 20:6</a>.";
torreysArray["$$T0000712-28"]="@ (3) King. In Him the believer is also a king.";
torreysArray["$$T0000712-29"]="# <a href=\"#\"onClick=\"return mV('1Pe',2,9)\">1Pe 2:9</a>; <a href=\"#\"onClick=\"return mV('Rev',3,21)\">Rev 3:21</a>; <a href=\"#\"onClick=\"return mV('Rev',5,10)\">5:10</a>";
torreysArray["$$T0000712-30"]=". 2. Believers have fellowship with Him in the transforming, assimilating power of His life.";
torreysArray["$$T0000712-31"]="@ a. As to their souls.";
torreysArray["$$T0000712-32"]="# <a href=\"#\"onClick=\"return mV('Rom',8,9)\">Rom 8:9</a>; <a href=\"#\"onClick=\"return mV('Phl',2,5)\">Phl 2:5</a>; <a href=\"#\"onClick=\"return mV('1Jo',3,2)\">1Jo 3:2</a>";
torreysArray["$$T0000712-33"]="@ b. As to their bodies.";
torreysArray["$$T0000712-34"]="# <a href=\"#\"onClick=\"return mV('Rom',6,5)\">Rom 6:5</a>; <a href=\"#\"onClick=\"return mV('1Cr',6,17,19)\">1Cr 6:17, 19</a>; <a href=\"#\"onClick=\"return mV('1Cr',15,47,49)\">15:47, 49</a>; <a href=\"#\"onClick=\"return mV('Phl',3,21)\">Phl 3:21</a>.";
torreysArray["$$T0000712-35"]="@ Thus bearing fruit to Christ, both in their bodies and in their spirits which are His.";
torreysArray["$$T0000712-36"]="# <a href=\"#\"onClick=\"return mV('Jhn',15,5)\">Jhn 15:5</a>; <a href=\"#\"onClick=\"return mV('2Cr',12,9)\">2Cr 12:9</a>; <a href=\"#\"onClick=\"return mV('1Jo',1,6)\">1Jo 1:6</a>";
torreysArray["$$T0000712-37"]=". 3. This leads to fellowship with Christ, in experience, labours, sufferings, temptation, death, and finally, in His glory.";
torreysArray["$$T0000712-38"]="# <a href=\"#\"onClick=\"return mV('Gal',6,17)\">Gal 6:17</a>; <a href=\"#\"onClick=\"return mV('Phl',3,10)\">Phl 3:10</a>; <a href=\"#\"onClick=\"return mV('Hbr',12,3)\">Hbr 12:3</a>; <a href=\"#\"onClick=\"return mV('1Pe',4,13)\">1Pe 4:13</a>";
torreysArray["$$T0000712-39"]=". 4. Also to Christ's rightful fellowship with them in all <i>they</i> possess.";
torreysArray["$$T0000712-40"]="# <a href=\"#\"onClick=\"return mV('Rom',14,8)\">Rom 14:8</a>; <a href=\"#\"onClick=\"return mV('1Cr',6,'19-20')\">1Cr 6:19-20</a>";
torreysArray["$$T0000712-41"]=". 5. Also to the consequence that in the spiritual reception of the ordinances, they do really hold fellowship with Him. They are baptised into Christ.";
torreysArray["$$T0000712-42"]="# <a href=\"#\"onClick=\"return mV('Jhn',6,51,56)\">Jhn 6:51, 56</a>; <a href=\"#\"onClick=\"return mV('1Cr',10,16)\">1Cr 10:16</a>; <a href=\"#\"onClick=\"return mV('1Cr',11,26)\">11:26</a>; <a href=\"#\"onClick=\"return mV('Gal',3,27)\">Gal 3:27</a>";
torreysArray["$$T0000712-43"]="-2. Doctrines Connected with the Union of Christ with the Believer.";
torreysArray["$$T0000712-44"]="- a. Repentance.";
torreysArray["$$T0000712-45"]=". 1. Repentance includes a sense of personal guilt, pollution, and helplessness, an apprehension of the mercy of God in Christ, grief and hatred of sin, a resolute turning from it unto God, and a persistent endeavour after a new life of holy obedience.";
torreysArray["$$T0000712-46"]=". 2. True repentance brings the believer to see and appreciate the holiness of God as revealed alike in the law and in the gospel, and in that light to see and feel the exceeding sinfulness of all sin as well as the sinfulness of his own nature.";
torreysArray["$$T0000712-47"]="# <a href=\"#\"onClick=\"return mV('Job',42,6)\">Job 42:6</a>; <a href=\"#\"onClick=\"return mV('Psa',51,'4-9')\">Psa 51:4-9</a>; <a href=\"#\"onClick=\"return mV('Rom',3,20)\">Rom 3:20</a>";
torreysArray["$$T0000712-48"]=". 3. The awakened conscience echoes God's law, and can be appeased by no less a propitiation than that demanded by divine justice itself.";
torreysArray["$$T0000712-49"]=". 4. The evidence of genuine repentance.";
torreysArray["$$T0000712-50"]="@ a. To be determined by prayerful study of the Scriptures in connection with self-examination.";
torreysArray["$$T0000712-51"]="@ b. By the hatred and forsaking of secret as well as of open sins, the choice of God's service as both right and desirable, public confession, and practical consecration.";
torreysArray["$$T0000712-52"]=". 5. Scripture examples of repentance.";
torreysArray["$$T0000712-53"]="@ a. True.";
torreysArray["$$T0000712-54"]="# <a href=\"#\"onClick=\"return mV('2Sa',12,13)\">2Sa 12:13</a>; <a href=\"#\"onClick=\"return mV('Psa',51,4)\">Psa 51:4</a>; <a href=\"#\"onClick=\"return mV('2Sa',24,10)\">2Sa 24:10</a>; <a href=\"#\"onClick=\"return mV('Luk',15,18,21)\">Luk 15:18, 21</a>; <a href=\"#\"onClick=\"return mV('Luk',18,13)\">18:13</a>";
torreysArray["$$T0000712-55"]="@ b. False.";
torreysArray["$$T0000712-56"]="# <a href=\"#\"onClick=\"return mV('Exd',9,27,34)\">Exd 9:27, 34</a>; <a href=\"#\"onClick=\"return mV('Exd',10,16,20)\">10:16, 20</a>; <a href=\"#\"onClick=\"return mV('1Sa',15,24)\">1Sa 15:24</a>; <a href=\"#\"onClick=\"return mV('Mat',27,4,5)\">Mat 27:4-5</a>";
torreysArray["$$T0000712-57"]="- b. Faith.";
torreysArray["$$T0000712-58"]=". 1. New Testament usage.";
torreysArray["$$T0000712-59"]="@ a. That state of mind which is induced by persuasion.";
torreysArray["$$T0000712-60"]="# <a href=\"#\"onClick=\"return mV('Rom',14,22)\">Rom 14:22</a>";
torreysArray["$$T0000712-61"]="@ b. Good faith, fidelity, sincerity.";
torreysArray["$$T0000712-62"]="# <a href=\"#\"onClick=\"return mV('Rom',3,3)\">Rom 3:3</a>; <a href=\"#\"onClick=\"return mV('Tts',2,10)\">Tts 2:10</a>";
torreysArray["$$T0000712-63"]="@ c. Assent to the truth.";
torreysArray["$$T0000712-64"]="# <a href=\"#\"onClick=\"return mV('Phl',1,27)\">Phl 1:27</a>; <a href=\"#\"onClick=\"return mV('2Th',2,13)\">2Th 2:13</a>";
torreysArray["$$T0000712-65"]="@ d. Faith toward, on, or in God.";
torreysArray["$$T0000712-66"]="# <a href=\"#\"onClick=\"return mV('Mar',11,22)\">Mar 11:22</a>; <a href=\"#\"onClick=\"return mV('1Th',1,8)\">1Th 1:8</a>; <a href=\"#\"onClick=\"return mV('Hbr',6,1)\">Hbr 6:1</a>; <a href=\"#\"onClick=\"return mV('1Pe',1,21)\">1Pe 1:21</a>. In Christ. <a href=\"#\"onClick=\"return mV('Act',24,24)\">Act 24:24</a>; <a href=\"#\"onClick=\"return mV('Rom',3,25)\">Rom 3:25</a>; <a href=\"#\"onClick=\"return mV('Gal',2,'16-20')\">Gal 2:16-20</a>";
torreysArray["$$T0000712-67"]="@ e. The object of faith; viz., the revelation of the gospel.";
torreysArray["$$T0000712-68"]="# <a href=\"#\"onClick=\"return mV('Rom',1,5)\">Rom 1:5</a>; <a href=\"#\"onClick=\"return mV('Rom',10,8)\">10:8</a>; <a href=\"#\"onClick=\"return mV('1Ti',4,1)\">1Ti 4:1</a>; <a href=\"#\"onClick=\"return mV('Jud',1,3,20)\">Jud 1:3, 20</a>";
torreysArray["$$T0000712-69"]=". 2. Knowledge is the apprehension of an object as true, and faith is an assent to its truth. In this general sense every exercise of faith includes the knowledge of the object assented to.";
torreysArray["$$T0000712-70"]=". 3. Religious faith rests,";
torreysArray["$$T0000712-71"]="@ first, upon the faithfulness of God as pledged in His supernatural revelation,";
torreysArray["$$T0000712-72"]="# <a href=\"#\"onClick=\"return mV('Jhn',3,33)\">Jhn 3:33</a>";
torreysArray["$$T0000712-73"]="@ second, upon the evidence of spiritual illumination, personal experience of the power of the truth, and the witness of the Holy Spirit.";
torreysArray["$$T0000712-74"]="@ Thus it rests not in the wisdom of men, but in the power of God.";
torreysArray["$$T0000712-75"]="# <a href=\"#\"onClick=\"return mV('1Cr',2,'5-12')\">1Cr 2:5-12</a>";
torreysArray["$$T0000712-76"]=". 4. The two kinds of evidence by which we know that God has revealed certain truths as objects of faith.";
torreysArray["$$T0000712-77"]="@ a. The evidence in the truth itself--moral, spiritual, experimental, rational.";
torreysArray["$$T0000712-78"]="# <a href=\"#\"onClick=\"return mV('Jer',23,29)\">Jer 23:29</a>; <a href=\"#\"onClick=\"return mV('Jhn',6,33)\">Jhn 6:33</a>; <a href=\"#\"onClick=\"return mV('Jhn',14,7,26)\">14:7, 26</a>";
torreysArray["$$T0000712-79"]="@ b. The accrediting evidence of the presence and power of God accompanying the promulgation of the truth, and proving that it is from Him. These are miracles, providential periods, and the fulfilment of prophecy.";
torreysArray["$$T0000712-80"]="# <a href=\"#\"onClick=\"return mV('Jhn',5,36)\">Jhn 5:36</a>; <a href=\"#\"onClick=\"return mV('Hbr',2,4)\">Hbr 2:4</a>";
torreysArray["$$T0000712-81"]=". 5. That saving faith includes trust is proved from the uniform and single condition of salvation as presented in the Scriptures, expressed in the words \"believe in, or on, Christ.\"";
torreysArray["$$T0000712-82"]="# <a href=\"#\"onClick=\"return mV('Jhn',7,38)\">Jhn 7:38</a>; <a href=\"#\"onClick=\"return mV('Act',9,42)\">Act 9:42</a>; <a href=\"#\"onClick=\"return mV('Act',16,31)\">16:31</a>; <a href=\"#\"onClick=\"return mV('Gal',2,16)\">Gal 2:16</a>.";
torreysArray["$$T0000712-83"]="@ To believe in, or on, a person, necessarily implies trust as well as credit.";
torreysArray["$$T0000712-84"]="# <a href=\"#\"onClick=\"return mV('Act',26,18)\">Act 26:18</a>; <a href=\"#\"onClick=\"return mV('Gal',3,26)\">Gal 3:26</a>; <a href=\"#\"onClick=\"return mV('2Ti',3,15)\">2Ti 3:15</a>; <a href=\"#\"onClick=\"return mV('Hbr',11,1)\">Hbr 11:1</a>";
torreysArray["$$T0000712-85"]=". 6. The same proved from expressions used in the Scriptures as equivalent to the phrase \"believing in Christ.\" Such expressions are:";
torreysArray["$$T0000712-86"]="@ Receiving Christ,";
torreysArray["$$T0000712-87"]="# <a href=\"#\"onClick=\"return mV('Jhn',1,12)\">Jhn 1:12</a>. Looking to Christ, # <a href=\"#\"onClick=\"return mV('Isa',45,22)\">Isa 45:22</a>; <a href=\"#\"onClick=\"return mV('Num',21,19)\">Num 21:19</a>; <a href=\"#\"onClick=\"return mV('Jhn',3,14,15)\">Jhn 3:14-15</a>";
torreysArray["$$T0000712-88"]="@ Fleeing for refuge,";
torreysArray["$$T0000712-89"]="# <a href=\"#\"onClick=\"return mV('Hbr',6,18)\">Hbr 6:18</a>.";
torreysArray["$$T0000712-90"]="@ Coming to Christ,";
torreysArray["$$T0000712-91"]="# <a href=\"#\"onClick=\"return mV('Mat',11,28)\">Mat 11:28</a>; <a href=\"#\"onClick=\"return mV('Jhn',6,35,37)\">Jhn 6:35, 37</a>";
torreysArray["$$T0000712-92"]="@ Committing unto Christ";
torreysArray["$$T0000712-93"]="# <a href=\"#\"onClick=\"return mV('2Ti',1,12)\">2Ti 1:12</a>";
torreysArray["$$T0000712-94"]=". 7. The object of faith is the person and work of the Lord Jesus Christ as mediator.";
torreysArray["$$T0000712-95"]="@ a. We are justified by that faith of which Christ is the object.";
torreysArray["$$T0000712-96"]="# <a href=\"#\"onClick=\"return mV('Rom',3,22,25)\">Rom 3:22, 25</a>; <a href=\"#\"onClick=\"return mV('Gal',2,16)\">Gal 2:16</a>; <a href=\"#\"onClick=\"return mV('Phl',3,9)\">Phl 3:9</a>";
torreysArray["$$T0000712-97"]="@ b. Saved by faith in Christ.";
torreysArray["$$T0000712-98"]="# <a href=\"#\"onClick=\"return mV('Jhn',1,12)\">Jhn 1:12</a>; <a href=\"#\"onClick=\"return mV('Jhn',3,16,36)\">3:16, 36</a>; <a href=\"#\"onClick=\"return mV('Jhn',6,35)\">6:35</a>; <a href=\"#\"onClick=\"return mV('Act',10,43)\">Act 10:43</a>; <a href=\"#\"onClick=\"return mV('Act',16,31)\">16:31</a>";
torreysArray["$$T0000712-99"]="@ c. The rejection of Christ, or refusal to submit to the righteousness of God declared to be the ground of reprobation.";
torreysArray["$$T0000712-100"]="# <a href=\"#\"onClick=\"return mV('Jhn',3,18,19)\">Jhn 3:18-19</a>; <a href=\"#\"onClick=\"return mV('Jhn',8,24)\">8:24</a>";
torreysArray["$$T0000712-101"]=". 8. Assurance of salvation attainable through faith.";
torreysArray["$$T0000712-102"]="@ Directly asserted.";
torreysArray["$$T0000712-103"]="# <a href=\"#\"onClick=\"return mV('Rom',8,16)\">Rom 8:16</a>; <a href=\"#\"onClick=\"return mV('2Pe',1,10)\">2Pe 1:10</a>; <a href=\"#\"onClick=\"return mV('1Jo',2,3)\">1Jo 2:3</a>; <a href=\"#\"onClick=\"return mV('1Jo',3,14)\">3:14</a>; <a href=\"#\"onClick=\"return mV('1Jo',5,13)\">5:13</a>";
torreysArray["$$T0000712-104"]="@ Scriptural examples:";
torreysArray["$$T0000712-105"]="# <a href=\"#\"onClick=\"return mV('2Ti',1,12)\">2Ti 1:12</a>; <a href=\"#\"onClick=\"return mV('2Ti',4,7,8)\">4:7-8</a>";
torreysArray["$$T0000712-106"]="@ Begets unfeigned humility.";
torreysArray["$$T0000712-107"]="# <a href=\"#\"onClick=\"return mV('1Cr',15,10)\">1Cr 15:10</a>; <a href=\"#\"onClick=\"return mV('Gal',6,14)\">Gal 6:14</a>";
torreysArray["$$T0000712-108"]="@ Leads to ever increasing diligence in practical religion.";
torreysArray["$$T0000712-109"]="# <a href=\"#\"onClick=\"return mV('Psa',51,12,13,19)\">Psa 51:12-13, 19</a>";
torreysArray["$$T0000712-110"]="@ Also to candid self-examination and a desire to be searched and corrected by God.";
torreysArray["$$T0000712-111"]="# <a href=\"#\"onClick=\"return mV('Psa',139,23,24)\">Psa 139:23-24</a>";
torreysArray["$$T0000712-112"]="@ Also to constant aspirations after nearer conformity to, and more intimate communion with God.";
torreysArray["$$T0000712-113"]="# <a href=\"#\"onClick=\"return mV('1Jo',3,2,3)\">1Jo 3:2-3</a>";
torreysArray["$$T0000712-114"]=". 9. Living faith leads to good works.";
torreysArray["$$T0000712-115"]="# <a href=\"#\"onClick=\"return mV('Act',15,9)\">Act 15:9</a>; <a href=\"#\"onClick=\"return mV('Act',26,18)\">26:18</a>; <a href=\"#\"onClick=\"return mV('Gal',5,6)\">Gal 5:6</a>; <a href=\"#\"onClick=\"return mV('Jam',2,'14-26')\">Jam 2:14-26</a>; <a href=\"#\"onClick=\"return mV('1Jo',5,4)\">1Jo 5:4</a>";
torreysArray["$$T0000712-116"]="- c. Regeneration.";
torreysArray["$$T0000712-117"]=". 1. Scripture terms by which this work of God is designated:";
torreysArray["$$T0000712-118"]="@ Creating.";
torreysArray["$$T0000712-119"]="# <a href=\"#\"onClick=\"return mV('Eph',4,24)\">Eph 4:24</a>";
torreysArray["$$T0000712-120"]="@ Begetting.";
torreysArray["$$T0000712-121"]="# <a href=\"#\"onClick=\"return mV('1Jo',4,7)\">1Jo 4:7</a>";
torreysArray["$$T0000712-122"]="@ Quickening.";
torreysArray["$$T0000712-123"]="# <a href=\"#\"onClick=\"return mV('Jhn',5,21)\">Jhn 5:21</a>; <a href=\"#\"onClick=\"return mV('Eph',2,5)\">Eph 2:5</a>";
torreysArray["$$T0000712-124"]="@ Calling out of darkness into marvellous light.";
torreysArray["$$T0000712-125"]="# <a href=\"#\"onClick=\"return mV('1Pe',2,9)\">1Pe 2:9</a>";
torreysArray["$$T0000712-126"]="@ The subjects of it are said--";
torreysArray["$$T0000712-127"]="# To be alive from the dead. <a href=\"#\"onClick=\"return mV('Rom',6,13)\">Rom 6:13</a>";
torreysArray["$$T0000712-128"]="# To be new creatures. <a href=\"#\"onClick=\"return mV('2Cr',5,17)\">2Cr 5:17</a>";
torreysArray["$$T0000712-129"]="# To be born again, or anew. <a href=\"#\"onClick=\"return mV('Jhn',3,3,7)\">Jhn 3:3, 7</a>";
torreysArray["$$T0000712-130"]="";
torreysArray["$$T0000712-131"]="# To be God's workmanship. <a href=\"#\"onClick=\"return mV('Eph',2,10)\">Eph 2:10</a>";
torreysArray["$$T0000712-132"]=". 2. Proof that there is such a thing as is commonly called regeneration.";
torreysArray["$$T0000712-133"]="@ a. The Scriptures declare that such a change is necessary.";
torreysArray["$$T0000712-134"]="# <a href=\"#\"onClick=\"return mV('2Cr',5,17)\">2Cr 5:17</a>; <a href=\"#\"onClick=\"return mV('Gal',6,15)\">Gal 6:15</a>";
torreysArray["$$T0000712-135"]="@ b. The change is described.";
torreysArray["$$T0000712-136"]="# <a href=\"#\"onClick=\"return mV('Eph',2,5)\">Eph 2:5</a>; <a href=\"#\"onClick=\"return mV('Eph',4,23)\">4:23</a>; <a href=\"#\"onClick=\"return mV('Jam',1,18)\">Jam 1:18</a>; <a href=\"#\"onClick=\"return mV('1Pe',1,23)\">1Pe 1:23</a>";
torreysArray["$$T0000712-137"]="@ c. It is necessary for the most moral as well as the most profligate.";
torreysArray["$$T0000712-138"]="# <a href=\"#\"onClick=\"return mV('1Cr',15,10)\">1Cr 15:10</a>; <a href=\"#\"onClick=\"return mV('Gal',1,'13-16')\">Gal 1:13-16</a>";
torreysArray["$$T0000712-139"]="@ d. That this change is not a mere reformation is proved by its being referred to the Holy Spirit.";
torreysArray["$$T0000712-140"]="# <a href=\"#\"onClick=\"return mV('Tts',3,5)\">Tts 3:5</a>";
torreysArray["$$T0000712-141"]="@ e. In the comparison of man's state in grace with his state by nature.";
torreysArray["$$T0000712-142"]="# <a href=\"#\"onClick=\"return mV('Rom',6,13)\">Rom 6:13</a>; <a href=\"#\"onClick=\"return mV('Rom',8,'6-10')\">8:6-10</a>; <a href=\"#\"onClick=\"return mV('Eph',5,8)\">Eph 5:8</a>";
torreysArray["$$T0000712-143"]="@ f. In the experience of all Christians and the testimony of their lives.";
torreysArray["$$T0000712-144"]=". 3. Proofs that believers are subjects of supernatural, or spiritual illumination.";
torreysArray["$$T0000712-145"]="@ a. This is necessary.";
torreysArray["$$T0000712-146"]="# <a href=\"#\"onClick=\"return mV('Jhn',16,3)\">Jhn 16:3</a>; <a href=\"#\"onClick=\"return mV('1Cr',2,14)\">1Cr 2:14</a>; <a href=\"#\"onClick=\"return mV('2Cr',3,14)\">2Cr 3:14</a>; <a href=\"#\"onClick=\"return mV('2Cr',4,3)\">4:3</a>";
torreysArray["$$T0000712-147"]="@ b. The Scriptures expressly affirm it.";
torreysArray["$$T0000712-148"]="# <a href=\"#\"onClick=\"return mV('Psa',19,7,8)\">Psa 19:7-8</a>; <a href=\"#\"onClick=\"return mV('Psa',43,3,4)\">43:3-4</a>; <a href=\"#\"onClick=\"return mV('Jhn',17,3)\">Jhn 17:3</a>; <a href=\"#\"onClick=\"return mV('1Cr',2,12,13)\">1Cr 2:12-13</a>; <a href=\"#\"onClick=\"return mV('2Cr',4,6)\">2Cr 4:6</a>; <a href=\"#\"onClick=\"return mV('Eph',1,18)\">Eph 1:18</a>; <a href=\"#\"onClick=\"return mV('Phl',1,19)\">Phl 1:19</a>; <a href=\"#\"onClick=\"return mV('Col',3,10)\">Col 3:10</a>; <a href=\"#\"onClick=\"return mV('1Jo',4,7)\">1Jo 4:7</a>; <a href=\"#\"onClick=\"return mV('1Jo',5,20)\">5:20</a>";
torreysArray["$$T0000712-149"]="@ The first effect of regeneration is to open the eyes of our understanding to the excellency of divine truth. The second effect is the going forth of the renewed affections toward that excellency perceived.";
torreysArray["$$T0000712-150"]=". 4. Proof of the absolute necessity of regeneration.";
torreysArray["$$T0000712-151"]="@ a. The Scriptures assert it.";
torreysArray["$$T0000712-152"]="# <a href=\"#\"onClick=\"return mV('Jhn',3,3)\">Jhn 3:3</a>; <a href=\"#\"onClick=\"return mV('Rom',8,6,7)\">Rom 8:6-7</a>; <a href=\"#\"onClick=\"return mV('Eph',2,10)\">Eph 2:10</a>; <a href=\"#\"onClick=\"return mV('Eph',4,'21-24')\">4:21-24</a>";
torreysArray["$$T0000712-153"]="@ b. It is proved from the nature of man as a sinner.";
torreysArray["$$T0000712-154"]="# <a href=\"#\"onClick=\"return mV('Rom',7,18)\">Rom 7:18</a>; <a href=\"#\"onClick=\"return mV('Rom',8,'7-9')\">8:7-9</a>; <a href=\"#\"onClick=\"return mV('1Cr',2,14)\">1Cr 2:14</a>; <a href=\"#\"onClick=\"return mV('Eph',2,1)\">Eph 2:1</a>";
