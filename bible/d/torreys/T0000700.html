torreysArray["$$T0000712-155"]="@ c. Also from the nature of heaven.";
torreysArray["$$T0000712-156"]="# <a href=\"#\"onClick=\"return mV('Isa',35,8)\">Isa 35:8</a>; <a href=\"#\"onClick=\"return mV('Isa',52,1)\">52:1</a>; <a href=\"#\"onClick=\"return mV('Mat',5,8)\">Mat 5:8</a>; <a href=\"#\"onClick=\"return mV('Mat',13,41)\">13:41</a>; <a href=\"#\"onClick=\"return mV('Hbr',12,14)\">Hbr 12:14</a>; <a href=\"#\"onClick=\"return mV('Rev',21,27)\">Rev 21:27</a>";
torreysArray["$$T0000712-157"]="@ d. The restoration of holiness is the grand end of the whole plan of salvation.";
torreysArray["$$T0000712-158"]="# <a href=\"#\"onClick=\"return mV('Rom',8,28,29)\">Rom 8:28-29</a>; <a href=\"#\"onClick=\"return mV('Eph',1,4)\">Eph 1:4</a>; <a href=\"#\"onClick=\"return mV('Eph',5,5,26,27)\">5:5, 26-27</a>";
torreysArray["$$T0000712-159"]="- d. Justification";
torreysArray["$$T0000712-160"]=". 1. Its fundamental idea is that of perfect conformity to all of the requirements of the moral law.";
torreysArray["$$T0000712-161"]=". 2. The usage of \"to justify.\" It means to declare a person to be just.";
torreysArray["$$T0000712-162"]="@ a. Because personally conformed to the law as to moral character.";
torreysArray["$$T0000712-163"]="# <a href=\"#\"onClick=\"return mV('Luk',7,29)\">Luk 7:29</a>; <a href=\"#\"onClick=\"return mV('Rom',3,4)\">Rom 3:4</a>";
torreysArray["$$T0000712-164"]="@ b. Because, forensically, the demands of the law as a condition of life have been fully satisfied in regard to Him.";
torreysArray["$$T0000712-165"]="# <a href=\"#\"onClick=\"return mV('Act',13,39)\">Act 13:39</a>; <a href=\"#\"onClick=\"return mV('Rom',5,1,9)\">Rom 5:1, 9</a>; <a href=\"#\"onClick=\"return mV('Rom',8,30,33)\">8:30, 33</a>; <a href=\"#\"onClick=\"return mV('1Cr',6,11)\">1Cr 6:11</a>; <a href=\"#\"onClick=\"return mV('Gal',2,16)\">Gal 2:16</a>; <a href=\"#\"onClick=\"return mV('Gal',3,11)\">3:11</a>";
torreysArray["$$T0000712-166"]=". 3. And";
torreysArray["$$T0000712-167"]="@ (1) The ungodly are said to be justified without the deeds of of the law, by the blood of Christ, by faith, freely, and of grace, by means of a satisfaction and of imputed righteousness.";
torreysArray["$$T0000712-168"]="# <a href=\"#\"onClick=\"return mV('Rom',3,'20-28')\">Rom 3:20-28</a>; <a href=\"#\"onClick=\"return mV('Rom',4,'5-7')\">4:5-7</a>; <a href=\"#\"onClick=\"return mV('Rom',5,1)\">5:1</a>; <a href=\"#\"onClick=\"return mV('Gal',2,16)\">Gal 2:16</a>; <a href=\"#\"onClick=\"return mV('Gal',3,11)\">3:11</a>; <a href=\"#\"onClick=\"return mV('Gal',5,4)\">5:4</a>; <a href=\"#\"onClick=\"return mV('1Jo',2,2)\">1Jo 2:2</a>";
torreysArray["$$T0000712-169"]="@ (2) The contrary of condemnation.";
torreysArray["$$T0000712-170"]="# <a href=\"#\"onClick=\"return mV('Rom',8,33,34)\">Rom 8:33-34</a>";
torreysArray["$$T0000712-171"]="@ (3) The same idea conveyed in many equivalent and interchangeable expressions.";
torreysArray["$$T0000712-172"]="# <a href=\"#\"onClick=\"return mV('Jhn',3,18)\">Jhn 3:18</a>; <a href=\"#\"onClick=\"return mV('Jhn',5,24)\">5:24</a>; <a href=\"#\"onClick=\"return mV('Rom',4,6,7)\">Rom 4:6-7</a>; <a href=\"#\"onClick=\"return mV('2Cr',5,19)\">2Cr 5:19</a>";
torreysArray["$$T0000712-173"]=". 4. The terms \"righteousness\" and \"righteousness of God\" in the New Testament signify:--";
torreysArray["$$T0000712-174"]="@ a. Holiness of character.";
torreysArray["$$T0000712-175"]="# <a href=\"#\"onClick=\"return mV('Mat',5,6)\">Mat 5:6</a>; <a href=\"#\"onClick=\"return mV('Rom',6,13)\">Rom 6:13</a>; <a href=\"#\"onClick=\"return mV('Rom',10,'3-5')\">10:3-5</a>; <a href=\"#\"onClick=\"return mV('Phl',3,9)\">Phl 3:9</a>; <a href=\"#\"onClick=\"return mV('Tts',3,5)\">Tts 3:5</a>";
torreysArray["$$T0000712-176"]="@ b. The vicarious obedience and sufferings of Christ our substitute, which become our righteousness, received and appropriated by us through faith.";
torreysArray["$$T0000712-177"]="# <a href=\"#\"onClick=\"return mV('Rom',3,22)\">Rom 3:22</a>; <a href=\"#\"onClick=\"return mV('Rom',4,6,11)\">4:6, 11</a>; <a href=\"#\"onClick=\"return mV('Rom',10,'4-10')\">10:4-10</a>; <a href=\"#\"onClick=\"return mV('1Cr',1,30)\">1Cr 1:30</a>";
torreysArray["$$T0000712-178"]="@ The phrase \"righteousness of God\" means that perfect righteousness or satisfaction to the whole law, precept and penalty alike, which God provides, and which God will accept.";
torreysArray["$$T0000712-179"]="# <a href=\"#\"onClick=\"return mV('Mat',6,33)\">Mat 6:33</a>; <a href=\"#\"onClick=\"return mV('Rom',1,17)\">Rom 1:17</a>; <a href=\"#\"onClick=\"return mV('2Cr',5,21)\">2Cr 5:21</a>; <a href=\"#\"onClick=\"return mV('Jam',1,20)\">Jam 1:20</a>";
torreysArray["$$T0000712-180"]=". 5. The term \"justification,\" occurs only in";
torreysArray["$$T0000712-181"]="# <a href=\"#\"onClick=\"return mV('Rom',4,25)\">Rom 4:25</a>; <a href=\"#\"onClick=\"return mV('Rom',5,16,18)\">5:16, 18</a>";
torreysArray["$$T0000712-182"]="@ It signifies that relation to the law into which we are brought in consequence of the righteousness of Christ being made legally ours. We are absolved from all liability to the penalty, and the rewards promised to obedience are declared to belong to us.";
torreysArray["$$T0000712-183"]=". 6. The requirement of the law in order to the justification of a sinner.";
torreysArray["$$T0000712-184"]="@ The law consists of a rule of duty and a penalty to take effect in case of disobedience. In the case of the sinner, therefore, who has already incurred guilt, the law demands that, besides the rendering of perfect obedience, the penalty also should be suffered.";
torreysArray["$$T0000712-185"]="# <a href=\"#\"onClick=\"return mV('Rom',10,5)\">Rom 10:5</a>; <a href=\"#\"onClick=\"return mV('Gal',3,'10-13')\">Gal 3:10-13</a>";
torreysArray["$$T0000712-186"]=". 7. Proof that works cannot be the ground of a sinner's justification.";
torreysArray["$$T0000712-187"]="@ a. Paul repeatedly asserts this.";
torreysArray["$$T0000712-188"]="# <a href=\"#\"onClick=\"return mV('Gal',2,16)\">Gal 2:16</a>; <a href=\"#\"onClick=\"return mV('Phl',3,9)\">Phl 3:9</a>";
torreysArray["$$T0000712-189"]="@ b. The law demands perfect obedience. No act of obedience at one time can atone for disobedience at another.";
torreysArray["$$T0000712-190"]="# <a href=\"#\"onClick=\"return mV('Gal',2,10,21)\">Gal 2:10, 21</a>; <a href=\"#\"onClick=\"return mV('Gal',5,3)\">5:3</a>";
torreysArray["$$T0000712-191"]="@ c. If we are justified by works, then Christ is dead in vain.";
torreysArray["$$T0000712-192"]="# <a href=\"#\"onClick=\"return mV('Gal',2,21)\">Gal 2:21</a>; <a href=\"#\"onClick=\"return mV('Gal',5,4)\">5:4</a>";
torreysArray["$$T0000712-193"]="@ d. If it were of works it would not be of grace.";
torreysArray["$$T0000712-194"]="# <a href=\"#\"onClick=\"return mV('Rom',11,6)\">Rom 11:6</a>; <a href=\"#\"onClick=\"return mV('Eph',2,8,9)\">Eph 2:8-9</a>";
torreysArray["$$T0000712-195"]="@ e. It would afford cause for boasting.";
torreysArray["$$T0000712-196"]="# <a href=\"#\"onClick=\"return mV('Rom',3,27)\">Rom 3:27</a>; <a href=\"#\"onClick=\"return mV('Rom',4,2)\">4:2</a>";
torreysArray["$$T0000712-197"]="@ f. Paul also quotes the Old Testament to prove that all men are sinners";
torreysArray["$$T0000712-198"]="# (<a href=\"#\"onClick=\"return mV('Rom',3,9,10)\">Rom 3:9-10</a>), and that consequently they cannot be justified by works. <a href=\"#\"onClick=\"return mV('Psa',143,2)\">Psa 143:2</a>; <a href=\"#\"onClick=\"return mV('Rom',3,20)\">Rom 3:20</a>. He quotes # <a href=\"#\"onClick=\"return mV('Hab',2,4)\">Hab 2:4</a> to prove that the just shall live by faith, and cites the example of Abraham. <a href=\"#\"onClick=\"return mV('Gal',3,6)\">Gal 3:6</a>";
torreysArray["$$T0000712-199"]=". 8. The ground of justification is the righteousness of Christ.";
torreysArray["$$T0000712-200"]="# <a href=\"#\"onClick=\"return mV('Rom',10,4)\">Rom 10:4</a>; <a href=\"#\"onClick=\"return mV('1Cr',1,30)\">1Cr 1:30</a>";
torreysArray["$$T0000712-201"]="@ Faith is the essential prerequisite and instrument of receiving that righteousness.";
torreysArray["$$T0000712-202"]="# <a href=\"#\"onClick=\"return mV('Eph',2,8)\">Eph 2:8</a>";
torreysArray["$$T0000712-203"]="@ Justification is a declaration on the part of God that the law is satisfied because of the righteousness of Christ, which is imputed to believers, and the merits of which are received by them through faith.";
torreysArray["$$T0000712-204"]=". 9. The sense in which Christ's righteousness is imputed.";
torreysArray["$$T0000712-205"]="@ Imputation is an act of God as sovereign judge, whereby";
torreysArray["$$T0000712-206"]="# (1) He makes the guilt and legal responsibilities of our sins really Christ's (<a href=\"#\"onClick=\"return mV('Isa',53,5,11)\">Isa 53:5, 11</a>; <a href=\"#\"onClick=\"return mV('Jhn',1,29)\">Jhn 1:29</a>; <a href=\"#\"onClick=\"return mV('2Cr',5,21)\">2Cr 5:21</a>; <a href=\"#\"onClick=\"return mV('Gal',3,13)\">Gal 3:13</a>); and whereby";
torreysArray["$$T0000712-207"]="# (2) He makes the righteousness of Christ ours (that is, the legal right to reward, by the gracious covenant conditioned on righteousness), and then treats us as persons legally invested with those rights. <a href=\"#\"onClick=\"return mV('Rom',4,6)\">Rom 4:6</a>; <a href=\"#\"onClick=\"return mV('Rom',10,4)\">10:4</a>; <a href=\"#\"onClick=\"return mV('1Cr',1,30)\">1Cr 1:30</a>; <a href=\"#\"onClick=\"return mV('2Cr',5,21)\">2Cr 5:21</a>; <a href=\"#\"onClick=\"return mV('Phl',3,9)\">Phl 3:9</a>";
torreysArray["$$T0000712-208"]="@ Imputation is the charging or crediting to one's account as the ground of judicial treatment.";
torreysArray["$$T0000712-209"]="@ As Christ is not made a sinner by the imputation to Him of our sins, so we are not made holy by the imputation to us of His righteousness. The transfer is only of guilt from us to Him, and of merit from Him to us.";
torreysArray["$$T0000712-210"]="# <a href=\"#\"onClick=\"return mV('Rom',5,'12-21')\">Rom 5:12-21</a>; <a href=\"#\"onClick=\"return mV('Rom',4,6)\">4:6</a>; <a href=\"#\"onClick=\"return mV('Rom',3,21)\">3:21</a>; <a href=\"#\"onClick=\"return mV('Rom',5,19)\">5:19</a>";
torreysArray["$$T0000712-211"]=". 10. The nature of the peace which flows from justification.";
torreysArray["$$T0000712-212"]="@ a. Peace with God, His justice being completely satisfied through the righteousness of Christ.";
torreysArray["$$T0000712-213"]="# <a href=\"#\"onClick=\"return mV('Rom',5,1)\">Rom 5:1</a>; <a href=\"#\"onClick=\"return mV('2Cr',5,19)\">2Cr 5:19</a>; <a href=\"#\"onClick=\"return mV('Col',1,21)\">Col 1:21</a>; <a href=\"#\"onClick=\"return mV('Eph',2,14)\">Eph 2:14</a>";
torreysArray["$$T0000712-214"]="# In witness of this His Holy Spirit is given to us. <a href=\"#\"onClick=\"return mV('Rom',8,15,16)\">Rom 8:15-16</a>; <a href=\"#\"onClick=\"return mV('Hbr',10,15,17)\">Hbr 10:15, 17</a>";
torreysArray["$$T0000712-215"]="# His love is shed abroad in our hearts (<a href=\"#\"onClick=\"return mV('Rom',5,5)\">Rom 5:5</a>), and our fellowship with His is established.";
torreysArray["$$T0000712-216"]="";
torreysArray["$$T0000712-217"]="@ b. Inward peace of conscience, through the apprehension of the righteousness by which we are justified.";
torreysArray["$$T0000712-218"]="# <a href=\"#\"onClick=\"return mV('Hbr',9,15)\">Hbr 9:15</a>; <a href=\"#\"onClick=\"return mV('Hbr',10,2,22)\">10:2, 22</a>";
torreysArray["$$T0000712-219"]="- e. Adoption.";
torreysArray["$$T0000712-220"]=". 1. Classes of persons to whom the term \"sons\" or \"children of God\" is applied in the Scriptures.";
torreysArray["$$T0000712-221"]="@ a. In the singular, the term is applied in a supreme sense to the Second Person of the Trinity alone.";
torreysArray["$$T0000712-222"]="@ b. In the plural, to angels, because they are God's favoured creatures.";
torreysArray["$$T0000712-223"]="# <a href=\"#\"onClick=\"return mV('Job',1,6)\">Job 1:6</a>; <a href=\"#\"onClick=\"return mV('Job',38,7)\">38:7</a>";
torreysArray["$$T0000712-224"]="@ c. To human magistrates, because the possess authority delegated from God.";
torreysArray["$$T0000712-225"]="# <a href=\"#\"onClick=\"return mV('Psa',82,6)\">Psa 82:6</a>";
torreysArray["$$T0000712-226"]="@ d. To good men as the subjects of a divine adoption.";
torreysArray["$$T0000712-227"]="@ The sonship which this adoption confers is twofold:--";
torreysArray["$$T0000712-228"]="# 1. General and external. <a href=\"#\"onClick=\"return mV('Exd',4,11)\">Exd 4:11</a>; <a href=\"#\"onClick=\"return mV('Exd',9,4)\">9:4</a>";
torreysArray["$$T0000712-229"]="# 2. Special, spiritual, and immortal. <a href=\"#\"onClick=\"return mV('Gal',4,5)\">Gal 4:5</a>; <a href=\"#\"onClick=\"return mV('Eph',1,'4-6')\">Eph 1:4-6</a>";
torreysArray["$$T0000712-230"]=". 2. That which is represented in Scripture as involved in being a child of God by adoption.";
torreysArray["$$T0000712-231"]="@ a. Derivation of nature from God.";
torreysArray["$$T0000712-232"]="# <a href=\"#\"onClick=\"return mV('Jhn',1,13)\">Jhn 1:13</a>; <a href=\"#\"onClick=\"return mV('Jam',1,18)\">Jam 1:18</a>; <a href=\"#\"onClick=\"return mV('1Jo',5,18)\">1Jo 5:18</a>";
torreysArray["$$T0000712-233"]="@ b. Being born again in the image of God, bearing His likeness.";
torreysArray["$$T0000712-234"]="# <a href=\"#\"onClick=\"return mV('Rom',8,29)\">Rom 8:29</a>; <a href=\"#\"onClick=\"return mV('2Cr',3,18)\">2Cr 3:18</a>; <a href=\"#\"onClick=\"return mV('Col',3,10)\">Col 3:10</a>; <a href=\"#\"onClick=\"return mV('2Pe',1,4)\">2Pe 1:4</a>";
torreysArray["$$T0000712-235"]="@ c. Bearing His name.";
torreysArray["$$T0000712-236"]="# <a href=\"#\"onClick=\"return mV('1Jo',3,1)\">1Jo 3:1</a>; <a href=\"#\"onClick=\"return mV('Rev',2,17)\">Rev 2:17</a>; <a href=\"#\"onClick=\"return mV('Rev',3,12)\">3:12</a>";
torreysArray["$$T0000712-237"]="@ d. Being the object of His peculiar love.";
torreysArray["$$T0000712-238"]="# <a href=\"#\"onClick=\"return mV('Jhn',17,23)\">Jhn 17:23</a>; <a href=\"#\"onClick=\"return mV('Rom',5,'5-8')\">Rom 5:5-8</a>; <a href=\"#\"onClick=\"return mV('Tts',3,4)\">Tts 3:4</a>; <a href=\"#\"onClick=\"return mV('1Jo',4,'7-11')\">1Jo 4:7-11</a>";
torreysArray["$$T0000712-239"]="@ e. The indwelling Spirit of His Son (<a href=\"#\"onClick=\"return mV('Gal',4,5,6)\">Gal 4:5-6</a>), forms in us a spirit becoming the children of God:";
torreysArray["$$T0000712-240"]="# Obedient (<a href=\"#\"onClick=\"return mV('1Pe',1,14)\">1Pe 1:14</a>; <a href=\"#\"onClick=\"return mV('2Jo',1,6)\">2Jo 1:6</a>);";
torreysArray["$$T0000712-241"]="# free from sense of guilt, legal bondage, and fear of death (<a href=\"#\"onClick=\"return mV('Rom',8,15)\">Rom 8:15</a>; <a href=\"#\"onClick=\"return mV('Gal',5,1)\">Gal 5:1</a>; <a href=\"#\"onClick=\"return mV('Hbr',2,15)\">Hbr 2:15</a>);";
torreysArray["$$T0000712-242"]="# and elevated with a holy boldness and royal dignity. <a href=\"#\"onClick=\"return mV('Hbr',10,19,22)\">Hbr 10:19, 22</a>; <a href=\"#\"onClick=\"return mV('1Pe',2,9)\">1Pe 2:9</a>; <a href=\"#\"onClick=\"return mV('1Pe',4,14)\">4:14</a>";
torreysArray["$$T0000712-243"]="@ f. Present protection, consolations, and abundant provisions.";
torreysArray["$$T0000712-244"]="# <a href=\"#\"onClick=\"return mV('Psa',125,2)\">Psa 125:2</a>; <a href=\"#\"onClick=\"return mV('Isa',66,13)\">Isa 66:13</a>; <a href=\"#\"onClick=\"return mV('Luk',12,'27-32')\">Luk 12:27-32</a>; <a href=\"#\"onClick=\"return mV('Jhn',14,18)\">Jhn 14:18</a>; <a href=\"#\"onClick=\"return mV('1Cr',3,'21-23')\">1Cr 3:21-23</a>; <a href=\"#\"onClick=\"return mV('2Cr',1,4)\">2Cr 1:4</a>";
torreysArray["$$T0000712-245"]="@ g. Present fatherly chastisements for our good.";
torreysArray["$$T0000712-246"]="# <a href=\"#\"onClick=\"return mV('Psa',51,11,12)\">Psa 51:11-12</a>; <a href=\"#\"onClick=\"return mV('Hbr',12,'5-11')\">Hbr 12:5-11</a>";
torreysArray["$$T0000712-247"]="@ h. The certain inheritance of the riches of our Father's glory as heirs with God and joint-heirs with Christ";
torreysArray["$$T0000712-248"]="# (<a href=\"#\"onClick=\"return mV('Rom',8,17)\">Rom 8:17</a>; <a href=\"#\"onClick=\"return mV('Jam',2,5)\">Jam 2:5</a>; <a href=\"#\"onClick=\"return mV('1Pe',1,4)\">1Pe 1:4</a>; <a href=\"#\"onClick=\"return mV('1Pe',3,7)\">3:7</a>); including the exaltation of our bodies to the fellowship with Him. <a href=\"#\"onClick=\"return mV('Rom',8,23)\">Rom 8:23</a>; <a href=\"#\"onClick=\"return mV('Phl',3,21)\">Phl 3:21</a>";
torreysArray["$$T0000712-249"]=". 3. Adoption proceeds from the Father, upon the merits of the Son, by the agency of the Holy Spirit.";
torreysArray["$$T0000712-250"]="# <a href=\"#\"onClick=\"return mV('Jhn',1,12,13)\">Jhn 1:12-13</a>; <a href=\"#\"onClick=\"return mV('Gal',4,5,6)\">Gal 4:5-6</a>; <a href=\"#\"onClick=\"return mV('Tts',3,5,6)\">Tts 3:5-6</a>; <a href=\"#\"onClick=\"return mV('Rom',8,17,29)\">Rom 8:17, 29</a>; <a href=\"#\"onClick=\"return mV('Hbr',2,17)\">Hbr 2:17</a>; <a href=\"#\"onClick=\"return mV('Hbr',4,15)\">4:15</a>";
torreysArray["$$T0000712-251"]="@ All believers being subjects of the same adoption, are brethren.";
torreysArray["$$T0000712-252"]="# <a href=\"#\"onClick=\"return mV('Eph',3,6)\">Eph 3:6</a>; <a href=\"#\"onClick=\"return mV('1Jo',3,14)\">1Jo 3:14</a>; <a href=\"#\"onClick=\"return mV('1Jo',5,1)\">5:1</a>";
torreysArray["$$T0000712-253"]="- f. Sanctification.";
torreysArray["$$T0000712-254"]=". 1. To make clean physically or morally.";
torreysArray["$$T0000712-255"]="@ (a) Of ceremonial purification.";
torreysArray["$$T0000712-256"]="# <a href=\"#\"onClick=\"return mV('Hbr',9,13)\">Hbr 9:13</a>.";
torreysArray["$$T0000712-257"]="@ (b) To render clean in a moral sense.";
torreysArray["$$T0000712-258"]="# <a href=\"#\"onClick=\"return mV('1Cr',6,11)\">1Cr 6:11</a>; <a href=\"#\"onClick=\"return mV('Hbr',13,12)\">Hbr 13:12</a>";
torreysArray["$$T0000712-259"]="@ (c) To set apart from a common to a sacred use, to devote.";
torreysArray["$$T0000712-260"]="# <a href=\"#\"onClick=\"return mV('Mat',23,17)\">Mat 23:17</a>; <a href=\"#\"onClick=\"return mV('Jhn',10,36)\">Jhn 10:36</a>; <a href=\"#\"onClick=\"return mV('Mat',6,9)\">Mat 6:9</a>; <a href=\"#\"onClick=\"return mV('1Pe',3,15)\">1Pe 3:15</a>";
torreysArray["$$T0000712-261"]=". 2. Regeneration is the creative act of the Holy Spirit, implanting a new principle of spiritual life in the soul. Sanctification is the sustaining and developing work of the Holy Spirit, bringing all the faculties of the soul more and more perfectly under the purifying and regulating principle of spiritual life.";
torreysArray["$$T0000712-262"]=". 3. The sense in which the body is sanctified.";
torreysArray["$$T0000712-263"]="@ As being the temple of the Holy Spirit.";
torreysArray["$$T0000712-264"]="# <a href=\"#\"onClick=\"return mV('1Cr',6,19)\">1Cr 6:19</a>";
torreysArray["$$T0000712-265"]="@ As being a member of Christ.";
torreysArray["$$T0000712-266"]="# <a href=\"#\"onClick=\"return mV('1Cr',6,15)\">1Cr 6:15</a>";
torreysArray["$$T0000712-267"]="@ It will be made like Christ's glorified body.";
torreysArray["$$T0000712-268"]="# <a href=\"#\"onClick=\"return mV('1Cr',15,44)\">1Cr 15:44</a>; <a href=\"#\"onClick=\"return mV('Phl',3,21)\">Phl 3:21</a>";
torreysArray["$$T0000712-269"]=". 4. To who the work of sanctification is referred.";
torreysArray["$$T0000712-270"]="@ a. To the Father.";
torreysArray["$$T0000712-271"]="# <a href=\"#\"onClick=\"return mV('1Th',5,23)\">1Th 5:23</a>; <a href=\"#\"onClick=\"return mV('Hbr',13,21)\">Hbr 13:21</a>";
torreysArray["$$T0000712-272"]="@ b. To the Son.";
torreysArray["$$T0000712-273"]="# <a href=\"#\"onClick=\"return mV('Eph',5,25,26)\">Eph 5:25-26</a>; <a href=\"#\"onClick=\"return mV('Tts',2,14)\">Tts 2:14</a>";
torreysArray["$$T0000712-274"]="@ c. To the Holy Spirit.";
torreysArray["$$T0000712-275"]="# <a href=\"#\"onClick=\"return mV('1Cr',6,11)\">1Cr 6:11</a>; <a href=\"#\"onClick=\"return mV('2Th',2,13)\">2Th 2:13</a>";
torreysArray["$$T0000712-276"]=". 5. The agency of the truth in the work of sanctification.";
torreysArray["$$T0000712-277"]="# <a href=\"#\"onClick=\"return mV('Psa',119,'9-11')\">Psa 119:9-11</a>; <a href=\"#\"onClick=\"return mV('Jhn',17,19)\">Jhn 17:19</a>; <a href=\"#\"onClick=\"return mV('Jam',1,18)\">Jam 1:18</a>; <a href=\"#\"onClick=\"return mV('1Pe',1,22)\">1Pe 1:22</a>; <a href=\"#\"onClick=\"return mV('1Pe',2,2)\">2:2</a>; <a href=\"#\"onClick=\"return mV('2Pe',1,4)\">2Pe 1:4</a>";
torreysArray["$$T0000713-0"]=26;
torreysArray["$$T0000713-1"]="Concerning Redemption, The Union Between Believers";
torreysArray["$$T0000713-2"]="- F. The Union Between Believers; The Church and its Institutions.";
torreysArray["$$T0000713-3"]="- (Condensed from the Schaff-Herzogg Encyclopedia)";
torreysArray["$$T0000713-4"]="";
torreysArray["$$T0000713-5"]="- 1. The Church.";
torreysArray["$$T0000713-6"]=". a. The word <i>ecclesia</i> in the New Testament means either the universal church of Christ, or a local congregation.";
torreysArray["$$T0000713-7"]=". b. The early Christian church began on the day of Pentecost; and it was at first composed of the disciples whom Jesus had personally gathered. It was a community inside of Judaism, with peculiar worship and government. It was the <i>ecclesia</i>; and by this name Paul calls it in his earliest epistles, whether in Palestine or outside.";
torreysArray["$$T0000713-8"]="# <a href=\"#\"onClick=\"return mV('1Th',2,14)\">1Th 2:14</a>";
torreysArray["$$T0000713-9"]="@ Its complete name was the \"Church of God,\" or the \"Church of Christ\"";
torreysArray["$$T0000713-10"]="";
torreysArray["$$T0000713-11"]="# (<a href=\"#\"onClick=\"return mV('Rom',16,16)\">Rom 16:16</a>), whether of a single congregation, or of the whole body of believers.";
torreysArray["$$T0000713-12"]="@ It was made up of the \"sanctified in Christ Jesus\"";
torreysArray["$$T0000713-13"]="# (<a href=\"#\"onClick=\"return mV('1Cr',1,2)\">1Cr 1:2</a>),";
torreysArray["$$T0000713-14"]="@ the \"called saints\"";
torreysArray["$$T0000713-15"]="# (<a href=\"#\"onClick=\"return mV('Rom',1,7)\">Rom 1:7</a>),";
torreysArray["$$T0000713-16"]="@ the \"holy nation\"";
torreysArray["$$T0000713-17"]="# (<a href=\"#\"onClick=\"return mV('1Pe',2,9)\">1Pe 2:9</a>).";
torreysArray["$$T0000713-18"]="@ In the deep conception of Paul every believer was united with Christ, and entered this close union through baptism.";
torreysArray["$$T0000713-19"]="# <a href=\"#\"onClick=\"return mV('1Cr',12,13)\">1Cr 12:13</a>; <a href=\"#\"onClick=\"return mV('Gal',3,27)\">Gal 3:27</a>";
torreysArray["$$T0000713-20"]="@ The church was Christ's body, of which He was the Head.";
torreysArray["$$T0000713-21"]="# <a href=\"#\"onClick=\"return mV('Col',1,14)\">Col 1:14</a>; <a href=\"#\"onClick=\"return mV('Col',2,19)\">2:19</a>";
torreysArray["$$T0000713-22"]=". c. For church government, see in the encyclopedias the articles on the different denominations.";
torreysArray["$$T0000713-23"]="";
torreysArray["$$T0000713-24"]="- 2. The Sacraments.";
torreysArray["$$T0000713-25"]=". These are baptism and the Lord's Supper.";
torreysArray["$$T0000713-26"]=". For a discussion of the sacraments, consult the leading theological works in your denomination.";
torreysArray["$$T0000714-0"]=59;
torreysArray["$$T0000714-1"]="Concerning Redemption, Eschatology, Death";
torreysArray["$$T0000714-2"]="- G. Eschatology.";
torreysArray["$$T0000714-3"]="";
torreysArray["$$T0000714-4"]="- 1. Death, and the State of the Soul after Death.";
torreysArray["$$T0000714-5"]="";
torreysArray["$$T0000714-6"]="- a. The different forms of expression by which death is described in the Scriptures.";
torreysArray["$$T0000714-7"]=". Departure out of this world.";
torreysArray["$$T0000714-8"]="# <a href=\"#\"onClick=\"return mV('2Ti',4,6)\">2Ti 4:6</a>";
torreysArray["$$T0000714-9"]=". Going the way of all the earth.";
torreysArray["$$T0000714-10"]="# <a href=\"#\"onClick=\"return mV('Jos',23,14)\">Jos 23:14</a>";
torreysArray["$$T0000714-11"]=". Gathered to one's fathers.";
torreysArray["$$T0000714-12"]="# <a href=\"#\"onClick=\"return mV('Jdg',2,10)\">Jdg 2:10</a>";
torreysArray["$$T0000714-13"]=". Gathered to one's people.";
torreysArray["$$T0000714-14"]="# <a href=\"#\"onClick=\"return mV('Deu',32,50)\">Deu 32:50</a>";
torreysArray["$$T0000714-15"]=". Dissolving the earthly house of this tabernacle.";
torreysArray["$$T0000714-16"]="# <a href=\"#\"onClick=\"return mV('2Cr',5,1)\">2Cr 5:1</a>";
torreysArray["$$T0000714-17"]=". Returning to the dust.";
torreysArray["$$T0000714-18"]="# <a href=\"#\"onClick=\"return mV('Ecc',12,7)\">Ecc 12:7</a>";
torreysArray["$$T0000714-19"]=". Sleep.";
torreysArray["$$T0000714-20"]="# <a href=\"#\"onClick=\"return mV('Jhn',11,11)\">Jhn 11:11</a>";
torreysArray["$$T0000714-21"]=". Giving up the ghost.";
torreysArray["$$T0000714-22"]="# <a href=\"#\"onClick=\"return mV('Act',5,10)\">Act 5:10</a>";
torreysArray["$$T0000714-23"]=". Absent from the body and present with the Lord.";
torreysArray["$$T0000714-24"]="# <a href=\"#\"onClick=\"return mV('2Cr',5,8)\">2Cr 5:8</a>";
torreysArray["$$T0000714-25"]=". Sleeping in Jesus.";
torreysArray["$$T0000714-26"]="# <a href=\"#\"onClick=\"return mV('1Th',4,14)\">1Th 4:14</a>; <a href=\"#\"onClick=\"return mV('Ecc',12,7)\">Ecc 12:7</a>";
torreysArray["$$T0000714-27"]="- b. The relation of death to sin.";
torreysArray["$$T0000714-28"]=". The entire penalty of the law, including all the spiritual, physical, and eternal penal consequences of sin, is called death in the Scripture.";
torreysArray["$$T0000714-29"]="# <a href=\"#\"onClick=\"return mV('Gen',2,17)\">Gen 2:17</a>; <a href=\"#\"onClick=\"return mV('Rom',5,12)\">Rom 5:12</a>";
torreysArray["$$T0000714-30"]=". This included natural death.";
torreysArray["$$T0000714-31"]="# <a href=\"#\"onClick=\"return mV('Rom',5,13,14)\">Rom 5:13-14</a>";
torreysArray["$$T0000714-32"]=". When Christ bore the penalty of the law, it was necessary for Him to die.";
torreysArray["$$T0000714-33"]="# <a href=\"#\"onClick=\"return mV('Hbr',9,22)\">Hbr 9:22</a>";
torreysArray["$$T0000714-34"]="- c. Why do the justified die?";
torreysArray["$$T0000714-35"]=". It is made necessary from the present constitution of the body, while it is to both body and soul the gateway of heaven. The sting and fear of death are taken away.";
torreysArray["$$T0000714-36"]="# <a href=\"#\"onClick=\"return mV('1Cr',15,'55-57')\">1Cr 15:55-57</a>; <a href=\"#\"onClick=\"return mV('Hbr',2,15)\">Hbr 2:15</a>.";
torreysArray["$$T0000714-37"]=". They die \"in the Lord\"";
torreysArray["$$T0000714-38"]="# (<a href=\"#\"onClick=\"return mV('Rev',14,13)\">Rev 14:13</a>),";
torreysArray["$$T0000714-39"]=". and shall at last be completely delivered from its power.";
torreysArray["$$T0000714-40"]="# <a href=\"#\"onClick=\"return mV('1Cr',15,26)\">1Cr 15:26</a>";
torreysArray["$$T0000714-41"]="- d. Immateriality of the soul. Its continual existence after death.";
torreysArray["$$T0000714-42"]=". The entire range of human experience fails to make us acquainted with a single instance of the annihilation of matter. Material <i>bodies</i>, or chemically compounded, constantly come into existence and in turn pass away, yet never through annihilation but simply from the dissolution of that relation which these parts had temporarily sustained to each other. Spirit, however, is essentially simple and single, and therefore incapable of that dissolution of parts to which material bodies are subject. We infer, therefore, that spirits are immortal, since they cannot be subject to that only form of death of which we have any knowledge.";
torreysArray["$$T0000714-43"]="- e. Argument derived from its imperfect development in this world.";
torreysArray["$$T0000714-44"]=". In every department of organized life every individual creature, in its normal state, tends to grow toward condition of complete development, which is the perfection of its kind. Every human being, however, is conscious that in this life he never attains that completeness which the Creator contemplated in the ideal of His type. He has faculties undeveloped, capacities unfulfilled, natural desires unsatisfied. He knows that he was designed to be much more than he is and to fill a much higher sphere.";
torreysArray["$$T0000714-45"]="- f. Argument derived from the distributive justice of God.";
torreysArray["$$T0000714-46"]=". It is a judgment of reason, and a fundamental Bible doctrine that moral good is associated with happiness, and moral evil with misery, by the unchangeable nature and purpose of God. But history establishes the fact that this life is not a state of retribution, here wickedness is often associated with prosperity, moral excellence with sorrow. We hence conclude that there is a future state where everything inconsistent with the justice of God shall be adjusted.";
torreysArray["$$T0000714-47"]="# See <a href=\"#\"onClick=\"return mV('/kjv/Psa/Psa073.html#top')\">Psa 73</a>";
torreysArray["$$T0000714-48"]="- g. Conscience points to a future state.";
torreysArray["$$T0000714-49"]=". Conscience is the voice of God in the soul, witnessing to our sinfulness, God's essential justice. The characteristic testimony of the human conscience has always been in accordance with the word of God, that, \"after death comes the judgment.\"";
torreysArray["$$T0000714-50"]="- h. Confirmed by the general consent of mankind.";
torreysArray["$$T0000714-51"]=". This has been the universal faith of all men, of all nations, and in all ages. Universal consent, like every universal effect, must be referred to an equally universal cause, and this consent, uniform among men differing in every other possible respect, can be referred to no common origin other than the constitution of man's common nature, which is the testimony of his Maker.";
torreysArray["$$T0000714-52"]="- i. The Old Testament teaches the same distinction between body and soul that is taught in the New Testament.";
torreysArray["$$T0000714-53"]="# <a href=\"#\"onClick=\"return mV('Gen',1,26,27)\">Gen 1:26-27</a>; <a href=\"#\"onClick=\"return mV('Gen',2,7)\">2:7</a>; <a href=\"#\"onClick=\"return mV('Ecc',12,7)\">Ecc 12:7</a>";
torreysArray["$$T0000714-54"]="- j. Our Saviour's argument.";
torreysArray["$$T0000714-55"]="# <a href=\"#\"onClick=\"return mV('Luk',20,37,38)\">Luk 20:37-38</a>";
torreysArray["$$T0000714-56"]="- k. Old Testament passages implying a state of blessedness after death.";
torreysArray["$$T0000714-57"]="# <a href=\"#\"onClick=\"return mV('Num',23,10)\">Num 23:10</a>; <a href=\"#\"onClick=\"return mV('Job',19,26,27)\">Job 19:26-27</a>; <a href=\"#\"onClick=\"return mV('Psa',16,'9-11')\">Psa 16:9-11</a>; <a href=\"#\"onClick=\"return mV('Psa',17,15)\">17:15</a>; <a href=\"#\"onClick=\"return mV('Psa',49,14,15)\">49:14-15</a>; <a href=\"#\"onClick=\"return mV('Psa',73,'24-26')\">73:24-26</a>; <a href=\"#\"onClick=\"return mV('Isa',25,8)\">Isa 25:8</a>; <a href=\"#\"onClick=\"return mV('Isa',26,19)\">26:19</a>; <a href=\"#\"onClick=\"return mV('Dan',12,'2-3',13)\">Dan 12:2-3, 13</a>; <a href=\"#\"onClick=\"return mV('Hsa',13,14)\">Hsa 13:14</a>";
torreysArray["$$T0000714-58"]="- l. Teaching of the New Testament.";
torreysArray["$$T0000714-59"]="# <a href=\"#\"onClick=\"return mV('Luk',23,43)\">Luk 23:43</a>; <a href=\"#\"onClick=\"return mV('2Cr',5,'6-8')\">2Cr 5:6-8</a>; <a href=\"#\"onClick=\"return mV('Phl',1,23,24)\">Phl 1:23-24</a>; <a href=\"#\"onClick=\"return mV('Luk',16,23,24)\">Luk 16:23-24</a>; <a href=\"#\"onClick=\"return mV('Jud',1,'5-7')\">Jud 1:5-7</a>";
torreysArray["$$T0000715-0"]=34;
torreysArray["$$T0000715-1"]="Concerning Redemption, Eschatology, The Resurrection";
torreysArray["$$T0000715-2"]="- G. Eschatology.";
torreysArray["$$T0000715-3"]="";
torreysArray["$$T0000715-4"]="- 2. The Resurrection.";
torreysArray["$$T0000715-5"]="";
torreysArray["$$T0000715-6"]="- a. The Greek word is <i>anastasis</i>, which signifies \"a raising up.\" It is used Scripture to designate the future general raising, by the power of God, of the bodies of all men from the sleep of death.";
torreysArray["$$T0000715-7"]="- b. Old Testament passages.";
torreysArray["$$T0000715-8"]="# <a href=\"#\"onClick=\"return mV('Job',19,25,27)\">Job 19:25, 27</a>; <a href=\"#\"onClick=\"return mV('Psa',49,15)\">Psa 49:15</a>; <a href=\"#\"onClick=\"return mV('Isa',26,19)\">Isa 26:19</a>; <a href=\"#\"onClick=\"return mV('Dan',12,'1-3')\">Dan 12:1-3</a>";
torreysArray["$$T0000715-9"]="- c. New Testament passages.";
torreysArray["$$T0000715-10"]="# <a href=\"#\"onClick=\"return mV('Mat',27,52,53)\">Mat 27:52-53</a>; <a href=\"#\"onClick=\"return mV('Jhn',5,28,29)\">Jhn 5:28-29</a>; <a href=\"#\"onClick=\"return mV('Jhn',6,39)\">6:39</a>; <a href=\"#\"onClick=\"return mV('Act',2,'25-34')\">Act 2:25-34</a>; <a href=\"#\"onClick=\"return mV('Act',13,34)\">13:34</a>; <a href=\"#\"onClick=\"return mV('Rom',8,11,22,23)\">Rom 8:11, 22, 23</a>; <a href=\"#\"onClick=\"return mV('1Cr',15,'1-58')\">1Cr 15:1-58</a>; <a href=\"#\"onClick=\"return mV('Phl',3,20,21)\">Phl 3:20-21</a>; <a href=\"#\"onClick=\"return mV('1Th',4,'13-17')\">1Th 4:13-17</a>";
torreysArray["$$T0000715-11"]="- d. The body to rise again.";
torreysArray["$$T0000715-12"]="# <a href=\"#\"onClick=\"return mV('Phl',3,21)\">Phl 3:21</a>; <a href=\"#\"onClick=\"return mV('1Cr',15,53,54)\">1Cr 15:53-54</a>; <a href=\"#\"onClick=\"return mV('Jhn',5,28)\">Jhn 5:28</a>; <a href=\"#\"onClick=\"return mV('1Th',4,'13-17')\">1Th 4:13-17</a>; <a href=\"#\"onClick=\"return mV('1Cr',6,15)\">1Cr 6:15</a>; <a href=\"#\"onClick=\"return mV('Jhn',20,27)\">Jhn 20:27</a>";
torreysArray["$$T0000715-13"]="- e. The nature of the resurrection body.";
torreysArray["$$T0000715-14"]=". 1. It is to be spiritual.";
torreysArray["$$T0000715-15"]="# <a href=\"#\"onClick=\"return mV('1Cr',15,44)\">1Cr 15:44</a>";
torreysArray["$$T0000715-16"]=". 2. Like Christ's body.";
torreysArray["$$T0000715-17"]="# <a href=\"#\"onClick=\"return mV('Phl',3,21)\">Phl 3:21</a>";
torreysArray["$$T0000715-18"]=". 3. Glorious, powerful, and incorruptible.";
torreysArray["$$T0000715-19"]="# <a href=\"#\"onClick=\"return mV('1Cr',15,54)\">1Cr 15:54</a>";
torreysArray["$$T0000715-20"]=". 4. It shall never die.";
torreysArray["$$T0000715-21"]="# <a href=\"#\"onClick=\"return mV('Rev',21,4)\">Rev 21:4</a>";
torreysArray["$$T0000715-22"]=". 5. Never to be given in marriage.";
torreysArray["$$T0000715-23"]="# <a href=\"#\"onClick=\"return mV('Mat',22,30)\">Mat 22:30</a>";
torreysArray["$$T0000715-24"]="- f. The resurrection of Christ secures and illustrates that of His people.";
torreysArray["$$T0000715-25"]=". 1. Because His resurrection seals and consummates His redemptive power, and the redemption of our bodies.";
torreysArray["$$T0000715-26"]="# <a href=\"#\"onClick=\"return mV('Rom',3,23)\">Rom 3:23</a>";
torreysArray["$$T0000715-27"]=". 2. Because of our federal and vital union with Christ.";
torreysArray["$$T0000715-28"]="# <a href=\"#\"onClick=\"return mV('1Cr',15,21,22)\">1Cr 15:21-22</a>; <a href=\"#\"onClick=\"return mV('1Th',4,14)\">1Th 4:14</a>";
torreysArray["$$T0000715-29"]=". 3. Because of His Spirit who dwells in us";
torreysArray["$$T0000715-30"]="# (<a href=\"#\"onClick=\"return mV('Rom',8,11)\">Rom 8:11</a>), making our bodies His members. <a href=\"#\"onClick=\"return mV('1Cr',6,15)\">1Cr 6:15</a>";
torreysArray["$$T0000715-31"]=". 4. Because Christ by covenant is Lord both of the living and the dead.";
torreysArray["$$T0000715-32"]="# <a href=\"#\"onClick=\"return mV('Rom',14,9)\">Rom 14:9</a>";
torreysArray["$$T0000715-33"]=". This same vital union causes the resurrection of the believer to be similar to, as well as consequent upon, that of Christ.";
torreysArray["$$T0000715-34"]="# <a href=\"#\"onClick=\"return mV('1Cr',15,49)\">1Cr 15:49</a>; <a href=\"#\"onClick=\"return mV('Phl',3,21)\">Phl 3:21</a>; <a href=\"#\"onClick=\"return mV('1Jo',3,2)\">1Jo 3:2</a>";
torreysArray["$$T0000716-0"]=52;
torreysArray["$$T0000716-1"]="Concerning Redemption, Eschatology, The Second Advent";
torreysArray["$$T0000716-2"]="- G. Eschatology.";
torreysArray["$$T0000716-3"]="";
torreysArray["$$T0000716-4"]="- 3. The Second Advent and the General Judgment.";
torreysArray["$$T0000716-5"]="";
torreysArray["$$T0000716-6"]="- a. The meaning of the expression, \"the coming\" or \"the day of the Lord,\" as used in both the Old and New Testaments.";
torreysArray["$$T0000716-7"]=". 1. For any special manifestation of God's presence.";
torreysArray["$$T0000716-8"]="#  <a href=\"#\"onClick=\"return mV('Isa',13,6)\">Isa 13:6</a>; <a href=\"#\"onClick=\"return mV('Jer',46,10)\">Jer 46:10</a>; <a href=\"#\"onClick=\"return mV('Jhn',14,18,23)\">Jhn 14:18, 23</a>";
torreysArray["$$T0000716-9"]=". 2. By way of eminence.";
torreysArray["$$T0000716-10"]="@ a. In the Old Testament, for the coming of Christ in the flesh, and the abrogation of the Jewish economy.";
torreysArray["$$T0000716-11"]="# <a href=\"#\"onClick=\"return mV('Mal',3,2)\">Mal 3:2</a>; <a href=\"#\"onClick=\"return mV('Mal',4,5)\">4:5</a>";
torreysArray["$$T0000716-12"]="@ b. In the New Testament, for the second and final coming of Christ.";
torreysArray["$$T0000716-13"]="- b. The several terms referring to this last great event are:--";
torreysArray["$$T0000716-14"]=". 1. His \"revelation.\"";
torreysArray["$$T0000716-15"]="# <a href=\"#\"onClick=\"return mV('1Cr',1,7)\">1Cr 1:7</a>; <a href=\"#\"onClick=\"return mV('2Th',1,7)\">2Th 1:7</a>; <a href=\"#\"onClick=\"return mV('1Pe',1,7,13)\">1Pe 1:7, 13</a>; <a href=\"#\"onClick=\"return mV('1Pe',4,13)\">4:13</a>";
torreysArray["$$T0000716-16"]=". 2. \"Presence,\" \"coming.\"";
torreysArray["$$T0000716-17"]="# <a href=\"#\"onClick=\"return mV('Mat',24,3,27,37,39)\">Mat 24:3, 27, 37, 39</a>; <a href=\"#\"onClick=\"return mV('1Cr',15,23)\">1Cr 15:23</a>; <a href=\"#\"onClick=\"return mV('1Th',2,19)\">1Th 2:19</a>; <a href=\"#\"onClick=\"return mV('1Th',3,13)\">3:13</a>; <a href=\"#\"onClick=\"return mV('1Th',4,15)\">4:15</a>; <a href=\"#\"onClick=\"return mV('1Th',5,23)\">5:23</a>; <a href=\"#\"onClick=\"return mV('2Th',2,'1-9')\">2Th 2:1-9</a>; <a href=\"#\"onClick=\"return mV('Jam',5,7,8)\">Jam 5:7-8</a>; <a href=\"#\"onClick=\"return mV('2Pe',1,16)\">2Pe 1:16</a>; <a href=\"#\"onClick=\"return mV('2Pe',3,4,12)\">3:4, 12</a>; <a href=\"#\"onClick=\"return mV('1Jo',2,28)\">1Jo 2:28</a>";
torreysArray["$$T0000716-18"]=". 3. \"Appearing,\" \"manifestation.\"";
torreysArray["$$T0000716-19"]="# <a href=\"#\"onClick=\"return mV('2Th',2,8)\">2Th 2:8</a>; <a href=\"#\"onClick=\"return mV('1Ti',6,14)\">1Ti 6:14</a>; <a href=\"#\"onClick=\"return mV('2Ti',4,1,8)\">2Ti 4:1, 8</a>; <a href=\"#\"onClick=\"return mV('Tts',2,13)\">Tts 2:13</a>";
torreysArray["$$T0000716-20"]=". 4. \"The day of the Lord,\" or a similar expression.";
torreysArray["$$T0000716-21"]="# <a href=\"#\"onClick=\"return mV('Jhn',6,'39-54')\">Jhn 6:39-54</a>; <a href=\"#\"onClick=\"return mV('Rom',2,5)\">Rom 2:5</a>; <a href=\"#\"onClick=\"return mV('1Cr',1,8)\">1Cr 1:8</a>; <a href=\"#\"onClick=\"return mV('Phl',1,6,10)\">Phl 1:6, 10</a>; <a href=\"#\"onClick=\"return mV('1Th',5,2)\">1Th 5:2</a>; <a href=\"#\"onClick=\"return mV('2Th',1,10)\">2Th 1:10</a>; <a href=\"#\"onClick=\"return mV('2Ti',1,12,18)\">2Ti 1:12, 18</a>; <a href=\"#\"onClick=\"return mV('2Pe',2,9)\">2Pe 2:9</a>; <a href=\"#\"onClick=\"return mV('2Pe',3,10,12)\">3:10, 12</a>; <a href=\"#\"onClick=\"return mV('Jud',1,6)\">Jud 1:6</a>; <a href=\"#\"onClick=\"return mV('Rev',6,17)\">Rev 6:17</a>";
torreysArray["$$T0000716-22"]=". Christ is called \"the coming One\" with reference to both advents.";
torreysArray["$$T0000716-23"]="# <a href=\"#\"onClick=\"return mV('Mat',21,9)\">Mat 21:9</a>; <a href=\"#\"onClick=\"return mV('Luk',7,19,20)\">Luk 7:19-20</a>; <a href=\"#\"onClick=\"return mV('Luk',19,38)\">19:38</a>; <a href=\"#\"onClick=\"return mV('Jhn',3,31)\">Jhn 3:31</a>; <a href=\"#\"onClick=\"return mV('Rev',1,4)\">Rev 1:4</a>; <a href=\"#\"onClick=\"return mV('Rev',4,8)\">4:8</a>";
torreysArray["$$T0000716-24"]="- c. Evidence that a literal, personal advent of Christ still future is taught in the Bible.";
torreysArray["$$T0000716-25"]=". 1. The analogy of the first advent.";
torreysArray["$$T0000716-26"]=". 2. The coming itself, its manner and purpose, are alike defined.";
torreysArray["$$T0000716-27"]="# <a href=\"#\"onClick=\"return mV('Mat',16,27)\">Mat 16:27</a>; <a href=\"#\"onClick=\"return mV('Mat',24,30)\">24:30</a>; <a href=\"#\"onClick=\"return mV('Mat',25,31)\">25:31</a>; <a href=\"#\"onClick=\"return mV('Mat',26,64)\">26:64</a>; <a href=\"#\"onClick=\"return mV('Mar',8,38)\">Mar 8:38</a>; <a href=\"#\"onClick=\"return mV('Luk',21,27)\">Luk 21:27</a>";
torreysArray["$$T0000716-28"]=". 3. The apostles understood these predictions to relate to a literal advent of Christ in person.";
torreysArray["$$T0000716-29"]="# <a href=\"#\"onClick=\"return mV('Act',1,11)\">Act 1:11</a>; <a href=\"#\"onClick=\"return mV('Act',3,'19-21')\">3:19-21</a>; <a href=\"#\"onClick=\"return mV('1Cr',4,5)\">1Cr 4:5</a>; <a href=\"#\"onClick=\"return mV('1Cr',11,26)\">11:26</a>; <a href=\"#\"onClick=\"return mV('1Cr',15,23)\">15:23</a>; <a href=\"#\"onClick=\"return mV('Hbr',9,28)\">Hbr 9:28</a>; <a href=\"#\"onClick=\"return mV('Hbr',10,37)\">10:37</a>";
torreysArray["$$T0000716-30"]="- d. The exact time declared to be unknown.";
torreysArray["$$T0000716-31"]="# <a href=\"#\"onClick=\"return mV('Mat',24,36)\">Mat 24:36</a>; <a href=\"#\"onClick=\"return mV('Mar',13,32)\">Mar 13:32</a>; <a href=\"#\"onClick=\"return mV('Luk',12,40)\">Luk 12:40</a>; <a href=\"#\"onClick=\"return mV('Act',1,6,7)\">Act 1:6-7</a>; <a href=\"#\"onClick=\"return mV('1Th',5,'1-3')\">1Th 5:1-3</a>; <a href=\"#\"onClick=\"return mV('2Pe',3,'3-4',10)\">2Pe 3:3-4, 10</a>; <a href=\"#\"onClick=\"return mV('Rev',16,15)\">Rev 16:15</a>";
torreysArray["$$T0000716-32"]="- e. The Judge of the world.";
torreysArray["$$T0000716-33"]=". This will be Jesus Christ, in His official character as mediator, in both natures, as the God-man. This is evident,--";
torreysArray["$$T0000716-34"]="@ 1. Because as judge He is called";
torreysArray["$$T0000716-35"]="# the \"Son of man\" (<a href=\"#\"onClick=\"return mV('Mat',25,31,32)\">Mat 25:31-32</a>), and";
torreysArray["$$T0000716-36"]="# \"the man ordained by God.\" <a href=\"#\"onClick=\"return mV('Act',17,31)\">Act 17:31</a>";
torreysArray["$$T0000716-37"]="@ 2. Because it pertains to Him as mediator to complete and publicly manifest the salvation of His people and the overthrow of His enemies, together with the glorious righteousness of His work in both respects.";
torreysArray["$$T0000716-38"]="# <a href=\"#\"onClick=\"return mV('2Th',1,'7-10')\">2Th 1:7-10</a>; <a href=\"#\"onClick=\"return mV('Rev',1,7)\">Rev 1:7</a>";
torreysArray["$$T0000716-39"]="- f. The subjects of the judgment.";
torreysArray["$$T0000716-40"]=". 1. The whole race of man. The dead will be raised, and the living changed simultaneously.";
torreysArray["$$T0000716-41"]="# <a href=\"#\"onClick=\"return mV('Mat',25,'31-46')\">Mat 25:31-46</a>; <a href=\"#\"onClick=\"return mV('1Cr',15,51,52)\">1Cr 15:51-52</a>; <a href=\"#\"onClick=\"return mV('2Cr',5,10)\">2Cr 5:10</a>; <a href=\"#\"onClick=\"return mV('1Th',4,17)\">1Th 4:17</a>; <a href=\"#\"onClick=\"return mV('2Th',1,'6-10')\">2Th 1:6-10</a>; <a href=\"#\"onClick=\"return mV('Rev',20,'11-15')\">Rev 20:11-15</a>";
torreysArray["$$T0000716-42"]=". 2. All evil angels.";
torreysArray["$$T0000716-43"]="# <a href=\"#\"onClick=\"return mV('2Pe',2,4)\">2Pe 2:4</a>; <a href=\"#\"onClick=\"return mV('Jud',1,6)\">Jud 1:6</a>";
torreysArray["$$T0000716-44"]=". Good angels appearing as attendants and ministers.";
torreysArray["$$T0000716-45"]="# <a href=\"#\"onClick=\"return mV('Mat',13,41,42)\">Mat 13:41-42</a>";
torreysArray["$$T0000716-46"]="- g. The moral effect of the Scripture teaching as to Christ's second advent.";
torreysArray["$$T0000716-47"]=". Christians ought thereby to be comforted when in sorrow, and always stimulated to duty.";
torreysArray["$$T0000716-48"]="# <a href=\"#\"onClick=\"return mV('Phl',3,20)\">Phl 3:20</a>; <a href=\"#\"onClick=\"return mV('Col',3,4,5)\">Col 3:4-5</a>; <a href=\"#\"onClick=\"return mV('Jam',5,7)\">Jam 5:7</a>; <a href=\"#\"onClick=\"return mV('1Jo',3,2,3)\">1Jo 3:2-3</a>";
torreysArray["$$T0000716-49"]=". Their duty also to love, watch, wait for, and hasten to, the coming of their Lord.";
torreysArray["$$T0000716-50"]="# <a href=\"#\"onClick=\"return mV('Luk',12,'35-37')\">Luk 12:35-37</a>; <a href=\"#\"onClick=\"return mV('1Cr',1,7,8)\">1Cr 1:7-8</a>; <a href=\"#\"onClick=\"return mV('Phl',3,20)\">Phl 3:20</a>; <a href=\"#\"onClick=\"return mV('1Th',1,9,10)\">1Th 1:9-10</a>; <a href=\"#\"onClick=\"return mV('2Ti',4,8)\">2Ti 4:8</a>; <a href=\"#\"onClick=\"return mV('2Pe',3,12)\">2Pe 3:12</a>; <a href=\"#\"onClick=\"return mV('Rev',22,20)\">Rev 22:20</a>";
torreysArray["$$T0000716-51"]=". Unbelievers should be filled with fearful apprehension, and should come to immediate repentance";
torreysArray["$$T0000716-52"]="# <a href=\"#\"onClick=\"return mV('Mar',13,35,37)\">Mar 13:35, 37</a>; <a href=\"#\"onClick=\"return mV('2Pe',3,9,10)\">2Pe 3:9-10</a>; <a href=\"#\"onClick=\"return mV('Jud',1,14,15)\">Jud 1:14-15</a>";
torreysArray["$$T0000717-0"]=94;
torreysArray["$$T0000717-1"]="Concerning Redemption, Eschatology, Heaven and Hell";
torreysArray["$$T0000717-2"]="- G. Eschatology.";
torreysArray["$$T0000717-3"]="- 4. Heaven and Hell.";
torreysArray["$$T0000717-4"]="- a. New Testament usage of the words. \"Heaven\" used chiefly in three senses:--";
torreysArray["$$T0000717-5"]=". 1. The upper air where the birds fly.";
torreysArray["$$T0000717-6"]="# <a href=\"#\"onClick=\"return mV('Mat',8,20)\">Mat 8:20</a>; <a href=\"#\"onClick=\"return mV('Mat',24,30)\">24:30</a>";
torreysArray["$$T0000717-7"]=". 2. The region in which the stars reside.";
torreysArray["$$T0000717-8"]="# <a href=\"#\"onClick=\"return mV('Act',7,42)\">Act 7:42</a>; <a href=\"#\"onClick=\"return mV('Hbr',11,12)\">Hbr 11:12</a>";
torreysArray["$$T0000717-9"]=". 3. The abode of Christ's human nature, the scene of the special manifestation of divine glory, and of the eternal blessedness of the saints.";
torreysArray["$$T0000717-10"]="# <a href=\"#\"onClick=\"return mV('Hbr',9,24)\">Hbr 9:24</a>; <a href=\"#\"onClick=\"return mV('1Pe',3,22)\">1Pe 3:22</a>";
torreysArray["$$T0000717-11"]="@ Sometimes called the \"third heaven.\"";
torreysArray["$$T0000717-12"]="# <a href=\"#\"onClick=\"return mV('2Cr',12,2)\">2Cr 12:2</a>";
torreysArray["$$T0000717-13"]="@ The phrases \"new heaven\" and \"new earth,\" in contrast with \"first heaven\" and \"first earth,\" refer to some unexplained change by which God will revolutionise our portion of the physical universe, cleansing it from the stain of sin and qualifying it to be the abode of blessedness.";
torreysArray["$$T0000717-14"]="- b. Terms used to designate the future blessedness of the saints.";
torreysArray["$$T0000717-15"]=". 1. Literal terms:--";
torreysArray["$$T0000717-16"]="@ Life, eternal life.";
torreysArray["$$T0000717-17"]="# <a href=\"#\"onClick=\"return mV('Mat',7,14)\">Mat 7:14</a>; <a href=\"#\"onClick=\"return mV('Mat',19,16,19)\">19:16, 19</a>; <a href=\"#\"onClick=\"return mV('Mat',25,46)\">25:46</a>";
torreysArray["$$T0000717-18"]="@ Glory, the glory of God, an eternal weight of glory.";
torreysArray["$$T0000717-19"]="# <a href=\"#\"onClick=\"return mV('Rom',2,7,10)\">Rom 2:7-10</a>; <a href=\"#\"onClick=\"return mV('Rom',5,2)\">5:2</a>; <a href=\"#\"onClick=\"return mV('2Cr',4,17)\">2Cr 4:17</a>";
torreysArray["$$T0000717-20"]="@ Peace.";
torreysArray["$$T0000717-21"]="# <a href=\"#\"onClick=\"return mV('Rom',2,10)\">Rom 2:10</a>";
torreysArray["$$T0000717-22"]="@ Salvation, and eternal salvation.";
torreysArray["$$T0000717-23"]="# <a href=\"#\"onClick=\"return mV('Hbr',5,7)\">Hbr 5:7</a>";
torreysArray["$$T0000717-24"]=". 2. Figurative terms:--";
torreysArray["$$T0000717-25"]="@ Paradise.";
torreysArray["$$T0000717-26"]="# <a href=\"#\"onClick=\"return mV('Luk',23,43)\">Luk 23:43</a>; <a href=\"#\"onClick=\"return mV('2Cr',12,4)\">2Cr 12:4</a>; <a href=\"#\"onClick=\"return mV('Rev',2,7)\">Rev 2:7</a>";
torreysArray["$$T0000717-27"]="@ Heavenly Jerusalem.";
torreysArray["$$T0000717-28"]="# <a href=\"#\"onClick=\"return mV('Gal',4,26)\">Gal 4:26</a>; <a href=\"#\"onClick=\"return mV('Rev',3,12)\">Rev 3:12</a>";
torreysArray["$$T0000717-29"]="@ Kingdom of heaven, heavenly kingdom, eternal kingdom, kingdom prepared from the foundation of the world.";
torreysArray["$$T0000717-30"]="# <a href=\"#\"onClick=\"return mV('Mat',25,34)\">Mat 25:34</a>; <a href=\"#\"onClick=\"return mV('2Ti',4,18)\">2Ti 4:18</a>; <a href=\"#\"onClick=\"return mV('2Pe',1,11)\">2Pe 1:11</a>";
torreysArray["$$T0000717-31"]="@ Eternal inheritance.";
torreysArray["$$T0000717-32"]="# <a href=\"#\"onClick=\"return mV('1Pe',1,4)\">1Pe 1:4</a>; <a href=\"#\"onClick=\"return mV('Hbr',9,15)\">Hbr 9:15</a>";
torreysArray["$$T0000717-33"]="@ The blessed are said to sit down with Abraham, Isaac, and Jacob;";
torreysArray["$$T0000717-34"]="# to be in Abraham's bosom (<a href=\"#\"onClick=\"return mV('Luk',16,22)\">Luk 16:22</a>; <a href=\"#\"onClick=\"return mV('Mat',8,11)\">Mat 8:11</a>);";
torreysArray["$$T0000717-35"]="# to reign with Christ (<a href=\"#\"onClick=\"return mV('2Ti',2,11)\">2Ti 2:11-12</a>);";
torreysArray["$$T0000717-36"]="# to enjoy a Sabbath of rest. <a href=\"#\"onClick=\"return mV('Hbr',4,10,11)\">Hbr 4:10-11</a>";
torreysArray["$$T0000717-37"]="- c. Heaven as a place";
torreysArray["$$T0000717-38"]=". The Scriptures represent heaven as a definite place as well as a state of blessedness.";
torreysArray["$$T0000717-39"]="#   <a href=\"#\"onClick=\"return mV('Jhn',17,24)\">Jhn 17:24</a>;   <a href=\"#\"onClick=\"return mV('2Cr',5,'6-10')\">2Cr 5:6-10</a>; <a href=\"#\"onClick=\"return mV('Rev',5,6)\">Rev 5:6</a>";
torreysArray["$$T0000717-40"]="- d. Wherein does the blessedness of heaven consist as far as revealed?";
torreysArray["$$T0000717-41"]=". 1. In perfect deliverance from sin and all its evil consequences, physical, moral, and social.";
torreysArray["$$T0000717-42"]="# <a href=\"#\"onClick=\"return mV('Rev',7,16,17)\">Rev 7:16-17</a>; <a href=\"#\"onClick=\"return mV('Rev',21,4,27)\">21:4, 27</a>";
torreysArray["$$T0000717-43"]=". 2. In the perfection of our nature.";
torreysArray["$$T0000717-44"]="# <a href=\"#\"onClick=\"return mV('1Cr',13,'9-12')\">1Cr 13:9-12</a>; <a href=\"#\"onClick=\"return mV('1Cr',15,'45-49')\">15:45-49</a>; <a href=\"#\"onClick=\"return mV('1Jo',3,2)\">1Jo 3:2</a>";
torreysArray["$$T0000717-45"]=". 3. In the sight of our Redeemer, communion with His person, and fellowship in all His glory and blessedness, and through Him with saints and angels.";
torreysArray["$$T0000717-46"]="# <a href=\"#\"onClick=\"return mV('Jhn',17,24)\">Jhn 17:24</a>; <a href=\"#\"onClick=\"return mV('1Jo',1,3)\">1Jo 1:3</a>; <a href=\"#\"onClick=\"return mV('Rev',3,21)\">Rev 3:21</a>; <a href=\"#\"onClick=\"return mV('Rev',21,'3-5')\">21:3-5</a>";
torreysArray["$$T0000717-47"]=". 4. In that \"beatific vision of God\" which, consisting in the ever increasingly clear discovery of the divine excellence lovingly apprehended, transforms the soul into the same image, from glory to glory.";
torreysArray["$$T0000717-48"]="# <a href=\"#\"onClick=\"return mV('Mat',5,8)\">Mat 5:8</a>; <a href=\"#\"onClick=\"return mV('2Cr',3,18)\">2Cr 3:18</a>";
torreysArray["$$T0000717-49"]="- e. The principal terms, literal and figurative, which are applied in Scripture to the future condition of the reprobate.";
torreysArray["$$T0000717-50"]=". As a <i>place</i> it is literally designated by Gehenna";
torreysArray["$$T0000717-51"]="# (<a href=\"#\"onClick=\"return mV('Mat',5,22,'29-30')\">Mat 5:22, 29-30</a>)";
torreysArray["$$T0000717-52"]=". and by the phrase \"place of torment.\"";
torreysArray["$$T0000717-53"]="# <a href=\"#\"onClick=\"return mV('Luk',16,28)\">Luk 16:28</a>";
torreysArray["$$T0000717-54"]=". As a <i>condition</i> of suffering, it is literally designated by the phrases \"wrath of God\"";
torreysArray["$$T0000717-55"]="# (<a href=\"#\"onClick=\"return mV('Rom',2,5)\">Rom 2:5</a>)";
torreysArray["$$T0000717-56"]=". and \"second death.\"";
torreysArray["$$T0000717-57"]="# <a href=\"#\"onClick=\"return mV('Rev',21,8)\">Rev 21:8</a>";
torreysArray["$$T0000717-58"]=". Figurative terms:--";
torreysArray["$$T0000717-59"]="@ \"Everlasting fire, prepared for the devil and his angels,\"";
torreysArray["$$T0000717-60"]="# <a href=\"#\"onClick=\"return mV('Mat',25,41)\">Mat 25:41</a>";
torreysArray["$$T0000717-61"]="@ \"Hell, where their worm dies not and the fire is not quenched.\"";
torreysArray["$$T0000717-62"]="# <a href=\"#\"onClick=\"return mV('Mar',9,48)\">Mar 9:48</a>";
torreysArray["$$T0000717-63"]="@ \"The lake which burns with fire and brimstone.\"";
torreysArray["$$T0000717-64"]="# <a href=\"#\"onClick=\"return mV('Rev',21,8)\">Rev 21:8</a>";
torreysArray["$$T0000717-65"]="@ \"The pit of the abyss.\"";
torreysArray["$$T0000717-66"]="# <a href=\"#\"onClick=\"return mV('Rev',9,2)\">Rev 9:2</a>";
torreysArray["$$T0000717-67"]=". The dreadful nature of this abode of the wicked is implied in such expressions as \"outer darkness,\" the place where there is \"weeping and gnashing of teeth\"";
torreysArray["$$T0000717-68"]="# (<a href=\"#\"onClick=\"return mV('Mat',8,12)\">Mat 8:12</a>; <a href=\"#\"onClick=\"return mV('Mat',22,13)\">22:13</a>)";
torreysArray["$$T0000717-69"]="@ \"I am in anguish in this flame\"";
torreysArray["$$T0000717-70"]="# (<a href=\"#\"onClick=\"return mV('Luk',16,24)\">Luk 16:24</a>)";
torreysArray["$$T0000717-71"]="@ \"unquenchable fire\"";
torreysArray["$$T0000717-72"]="# (<a href=\"#\"onClick=\"return mV('Luk',3,17)\">Luk 3:17</a>)";
torreysArray["$$T0000717-73"]="@ \"Furnace of fire\"";
torreysArray["$$T0000717-74"]="# (<a href=\"#\"onClick=\"return mV('Mat',13,42)\">Mat 13:42</a>)";
torreysArray["$$T0000717-75"]="@ \"blackness of darkness\"";
torreysArray["$$T0000717-76"]="# (<a href=\"#\"onClick=\"return mV('Jud',1,13)\">Jud 1:13</a>)";
torreysArray["$$T0000717-77"]="@ torment \"with fire and brimstone\"";
torreysArray["$$T0000717-78"]="# (<a href=\"#\"onClick=\"return mV('Rev',14,10)\">Rev 14:10</a>)";
torreysArray["$$T0000717-79"]="@ \"the smoke of their torment goes up for ever and ever.\"";
torreysArray["$$T0000717-80"]="# <a href=\"#\"onClick=\"return mV('Rev',14,11)\">Rev 14:11</a>";
torreysArray["$$T0000717-81"]="- f. The teaching of the Scriptures as to the nature of future punishments.";
torreysArray["$$T0000717-82"]=". 1. These sufferings will consist--";
torreysArray["$$T0000717-83"]="@ a. In the loss of all good.";
torreysArray["$$T0000717-84"]="@ b. In all the natural consequences of unrestrained sin, judicial abandonment, utter alienation from God, and the society of the lost.";
torreysArray["$$T0000717-85"]="# <a href=\"#\"onClick=\"return mV('2Th',1,9)\">2Th 1:9</a>";
torreysArray["$$T0000717-86"]="@ c. In the positive infliction of torment, God's wrath abiding upon those who do not believe.";
torreysArray["$$T0000717-87"]="# <a href=\"#\"onClick=\"return mV('Jhn',3,36)\">Jhn 3:36</a>";
torreysArray["$$T0000717-88"]=". 2. The Scriptures also establish the facts that these sufferings must be--";
torreysArray["$$T0000717-89"]="@ a. Dreadful in degree.";
torreysArray["$$T0000717-90"]="@ b. Endless in duration.";
torreysArray["$$T0000717-91"]="@ c. Proportioned to the deserts of the subject.";
torreysArray["$$T0000717-92"]="# <a href=\"#\"onClick=\"return mV('Mat',10,15)\">Mat 10:15</a>; <a href=\"#\"onClick=\"return mV('Luk',12,47,48)\">Luk 12:47-48</a>";
torreysArray["$$T0000717-93"]="-";
torreysArray["$$T0000717-94"]=". \"For God so loved the world, that He gave His only begotten Son, that whosoever believeth in Him should not perish, but have everlasting life.\" <a href=\"#\"onClick=\"return mV('Jhn',3,16)\">Jhn 3:16</a>";
</script>
