<p id="Chapter141" align="center">Commentary by A. R. FAUSSET<br>PSALM 141
<p id="Ps141_1"><a onclick="return mV('Psa',141,'1-10');">Psa 141:1-10</a>.
<p>This Psalm evinces its authorship as the preceding, by its structure and the character of its contents. It is a prayer for deliverance from sins to which affliction tempted him, and from the enemies who caused it.
