tenseDef[5774] = 'Tense - Present<br><br>The present tense represents a simple statement of fact<br>or reality viewed as occurring in actual time.<br>In most cases<br>this corresponds directly with the English present tense.<br><br>Some phrases which might be rendered as past tense in English<br>will often occur in the present tense in Greek.<br>These are<br>termed "historical presents," and such occurrences dramatize<br>the event described as if the reader were there watching the<br>event occur.<br>Some English translations render such historical<br>presents in the English past tense, while others permit the<br>tense to remain in the present.';
tenseDef[5775] = 'Tense - Imperfect<br><br>The imperfect tense generally represents continual or repeated<br>action.<br>Where the present tense might indicate "they are<br>asking," the imperfect would indicate "they kept on asking."<br><br>In the case of the verb "to be," however, the imperfect tense<br>is used as a general past tense and does not carry the<br>connotation of continual or repeated action.<br>';
tenseDef[5776] = 'Tense - Future<br><br>The future tense corresponds to the English future, and<br>indicates the contemplated or certain occurrence of an event<br>which has not yet occurred.<br>';
tenseDef[5777] = 'Tense - Aorist<br><br>The aorist tense is characterized by its emphasis on punctiliar<br>action; that is, the concept of the verb is considered without<br>regard for past, present, or future time.<br>There is no<br>direct or clear English equivalent for this tense, though it is<br>generally rendered as a simple past tense in most translations.<br><br>The events described by the aorist tense are classified into a<br>number of categories by grammarians.<br>The most common of these<br>include a view of the action as having begun from a certain<br>point ("inceptive aorist"), or having ended at a certain point<br>("cumulative aorist"), or merely existing at a certain point<br>("punctiliar aorist").<br>The categorization of other cases can<br>be found in Greek reference grammars.<br><br>The English reader need not concern himself with most of these<br>finer points concerning the aorist tense, since in most cases<br>they cannot be rendered accurately in English translation,<br>being fine points of Greek exegesis only.<br>The common practice<br>of rendering an aorist by a simple English past tense should<br>suffice in most cases.<br>';
tenseDef[5778] = 'Tense - Perfect<br><br>The perfect tense in Greek corresponds to the perfect tense in<br>English, and describes an action which is viewed as having been<br>completed in the past, once and for all, not needing to be<br>repeated.<br><br>Jesus\' last cry from the cross, TETELESTAI ("It is finished!")<br>is a good example of the perfect tense used in this sense,<br>namely "It [the atonement] has been accomplished, completely,<br>once and for all time."<br><br>Certain antiquated verb forms in Greek, such as those related<br>to seeing (eidw) or knowing (oida) will use the perfect tense<br>in a manner equivalent to the normal past tense.<br>These few<br>cases are exception to the normal rule and do not alter the<br>normal connotation of the perfect tense stated above.<br>';
tenseDef[5779] = 'Tense - Pluperfect<br><br>The pluperfect tense in Greek occurs rarely.<br>It corresponds<br>in a single Greek word to the sense of the English pluperfect,<br>which indicates an event viewed as having been once and for<br>all accomplished in past time.<br>In contrast, the perfect tense<br>reflects the final completion of an action at the present<br>moment described.<br><br>In translation the Greek pluperfect may not always follow the<br>rendering of the English pluperfect, due to excessive wordiness.<br>The English pluperfect is normally formed with the past tense<br>of the "helping" verbs "to have" or "to be," plus the past<br>participle, e.g., "He had finished."<br>The English perfect<br>is formed by the present tense of the helping verb plus the<br>past participle, e.g., "He has finished."<br>';
tenseDef[5780] = 'Tense - Second Aorist<br><br>The "second aorist" tense is identical in meaning and<br>translation to the normal or "first" aorist tense.<br>The only<br>difference is in the form of spelling the words in Greek, and<br>there is no effect upon English translation.<br><br>See "Aorist" # <a onClick="return T_Nav(\'5777\', 1);">5777</A>';
tenseDef[5781] = 'Tense - Second Future<br><br>The "second future" is identical in meaning to that of the<br>normal or "first" future tense.<br>The classification merely<br>reflects a spelling variation in Greek of the "first future"<br>tense, and has no effect on English meaning beyond that of the<br>normal future.<br><br>See "Future" # <a onClick="return T_Nav(\'5776\', 1);">5776</A>';
tenseDef[5782] = 'Tense - Second Perfect<br><br>The second perfect is identical in meaning to that of the<br>normal or "first" perfect tense, and has no additional effect<br>on English translation.<br>The classification merely represents<br>a spelling variation in Greek.<br><br>See "Perfect" # <a onClick="return T_Nav(\'5778\', 1);">5778</A>';
tenseDef[5783] = 'Tense - Second Pluperfect<br><br>The second pluperfect is identical in meaning to that of the<br>normal or "first" pluperfect tense.<br>It has no additional<br>meaning or effect on English translation, and merely reflects<br>a spelling variation in Greek.';
tenseDef[5784] = 'Voice - Active<br><br>The active voice represents the subject as the doer or<br>performer of the action.<br>e.g., in the sentence, "The<br>boy hit the ball," the boy performs the action.';
tenseDef[5785] = 'Voice - Middle<br><br>The middle voice indicates the subject performing an action<br>upon himself (reflexive action) or for his own benefit.<br>E.g.,<br>"The boy groomed himself."<br>Many verbs which occur only in<br>middle voice forms are translated in English as having an<br>active sense; these are called "deponent" verbs, and do not<br>comply with the normal requirements for the middle voice.';
tenseDef[5786] = 'Voice - Passive<br><br>The passive voice represents the subject as being the<br>recipient of the action.<br>E.g., in the sentence, "The boy was<br>hit by the ball," the boy receives the action.';
tenseDef[5787] = 'Voice - Either Middle or Passive<br><br>Many of the so-called "deponent" verbs can have either a<br>middle or passive form.<br>These are normally translated as<br>having an active voice, since they have no active form in<br>their outward spelling.<br>At times, however, they retain their<br>middle or passive significance.';
tenseDef[5788] = 'Voice - Middle Deponent<br><br>The middle deponent forms in almost all cases are translated<br>as being in the active voice.<br><br>See "Active" # <a onClick="return T_Nav(\'5784\', 1);">5784</A>';
tenseDef[5789] = 'Voice - Passive Deponent<br><br>The passive deponent forms in almost all cases are translated<br>as being in the passive voice.<br><br>See "Passive" # <a onClick="return T_Nav(\'5786\', 1);">5786</A>';
tenseDef[5790] = 'Voice - Middle or Passive Deponent<br><br>The middle or passive deponent forms in almost all cases are<br>translated as being in the active voice.<br><br>See "Active" # <a onClick="return T_Nav(\'5784\', 1);">5784</A>';
tenseDef[5791] = 'Mood - Indicative<br><br>The indicative mood is a simple statement of fact.<br>If an<br>action really occurs or has occurred or will occur, it will be<br>rendered in the indicative mood.';
tenseDef[5792] = 'Mood - Subjunctive<br><br>The subjunctive mood is the mood of possibility and<br>potentiality.<br>The action described may or may not occur,<br>depending upon circumstances.<br>Conditional sentences of the<br>third class ("ean" + the subjunctive) are all of this type, as<br>well as many commands following conditional purpose clauses,<br>such as those beginning with "hina."';
tenseDef[5793] = 'Mood - Optative<br><br>The optative mood is generally used in the so-called<br>"fourth-class" conditions which express a wish or desire for<br>an action to occur in which the completion of such is<br>doubtful.<br>By the time of the New Testament, the optative mood<br>was beginning to disappear from spoken and written Greek, and<br>such rarely occurs in the New Testament.<br><br>In a few cases, verbs in the optative mood stand apart from a<br>conditional clause to express the strongest possible wish<br>regarding an event.<br>The most common of these appears in the<br>phrase "mh genoito" (AV,"God forbid"; NKJV "Certainly not").';
tenseDef[5794] = 'Mood - Imperative<br><br>The imperative mood corresponds to the English imperative, and<br>expresses a command to the hearer to perform a certain action<br>by the order and authority of the one commanding.<br>Thus,<br>Jesus\' phrase, "Repent ye, and believe the gospel" (Mk.1:15)<br>is not at all an "invitation," but an absolute command<br>requiring full obedience on the part of all hearers.';
tenseDef[5795] = 'Mood - Infinitive<br><br>The Greek infinitive mood in most cases corresponds to the<br>English infinitive, which is basically the verb with "to"<br>prefixed, as "to believe."<br><br>Like the English infinitive, the Greek infinitive can be used<br>like a noun phrase ("It is better to live than to die"), as<br>well as to reflect purpose or result ("This was done to<br>fulfil what the prophet said").';
tenseDef[5796] = 'Mood - Participle<br><br>The Greek participle corresponds for the most part to the<br>English participle, reflecting "-ing" or "-ed" being suffixed<br>to the basic verb form.<br>The participle can be used either<br>like a verb or a noun, as in English, and thus is often termed<br>a "verbal noun."';
tenseDef[5797] = 'Mood - Impersonal<br><br>The impersonal mood is used only in a few verb forms which do<br>not conjugate in the full sense.<br>The most common of these is<br>the Greek word "dei," which is most often rendered "it is<br>necessary" or "one must."';
tenseDef[5798] = 'Mood - Imperative-Sense Participle<br><br>This reflects a Greek participle which implies that a command<br>to perform the action is implicit, even though it is not<br>outwardly or directly expressed.';
tenseDef[5799] = 'No Tense or Voice Stated<br><br>In a number of places certain verbs are cited in Perschbacher\'s<br>"The New Analytical Greek Lexicon" which do not have any tense<br>or voice directly stated.<br><br>In almost all of these cases, one can assume that the tense is<br>Present and the voice is Active, especially when the sense is<br>that of a command (Imperative).<br><br>See "Present" # <a onClick="return T_Nav(\'5774\', 1);">5774</A><br>See "Active"<br># <a onClick="return T_Nav(\'5784\', 1);">5784</A><br><br>05800<br>Greek Synonym Index<br>~~~~~~~~~~~~~~~~~~~<br>Strong\'s No.<br>Definition No.<br>~~~~~~~~~~~~<br>~~~~~~~~~~~~~~';
tenseDef[8675] = 'Kethiv Readings<br><br>In the Hebrew Bible, the scribes did not alter any text they felt<br>had been copied incorrectly. Rather they noted in the margin what they<br>thought the written text should be. The written variation is called a<br>kethiv and the marginal note is called the qere. Where the translators<br>of the Authorised Version followed the qere reading rather than the<br>kethiv, we indicate the kethiv reading by the number 08675.<br>For example, in Gen. 24:33<br>"was set" is coded as 07760 08675 03455.<br>The translators used the qere reading that has Strong\'s number 07760<br>but the kethiv reading is Strong\'s number 03455. Both words have the<br>same meaning, "was set".<br><br>There are 305 verses in the Old Testament with this property.';
tenseDef[8676] = 'Qere Readings<br><br>In the Hebrew Bible, the scribes did not alter any text they felt<br>had been copied incorrectly. Rather they noted in the margin what they<br>thought the written text should be. The written variation is called a<br>kethiv and the marginal note is called the qere. Where the translators<br>of the Authorised Version followed the kethiv reading rather than the<br>qere, we indicate the qere reading by the number 08676.<br>For example, in De. 19:6<br>"blood" is coded as 01818 08676 05315.<br>The translators followed the kethiv reading that has Strong\'s number 01818, <br>which means "blood", but the qere reading is Strong\'s number 05315, <br>which means "life".<br><br>Not currently used in the Blue Letter Bible, except Psa 123:4 and Neh 5:7';
tenseDef[8677] = 'Synonym Strong\'s Numbers<br><br>Sometimes, a word or phrase has individual Strong\'s numbers assigned<br>to it and it has an additional Strong\'s number for the entire phrase.<br>In Jud. 20:18 the phrase "house of God" is coded as "house <01004><br>of God <0430> <08677> <01008>" In this case the phrase could also mean<br>place Bethel which has the Strong\'s number 01008.<br>Only by context can<br>you distinguish proper names in Hebrew from individual words. Hence<br>translators do arrive at different renderings for the same Hebrew.<br><br>There are 42 verses in the Old Testament with this property.';
tenseDef[8678] = 'Multiple Qere Readings for a Kethiv<br><br>There are several marginal or qere readings for a kethiv reading.<br>In Neh. 5:7 the word "exact" is coded as "exact <05378> <08778><br><05383> <08675> <05375>". The two marginal readings, Strong\'s <br>numbers 05378 and 05383 exist for the one kethiv reading 05375.<br><br>The only other verse besides Neh 5:7 is Psa 123:4 having this property.';

tenseDef[8810] = 'Imperative<br><br>This verb class indicates an order or a command.<br><br>Go up to the city.<br>Wash yourself.';
tenseDef[8811] = 'Imperfect<br><br>The imperfect expresses an action, process or condition which is<br>incomplete, and it has a wide range of meaning:<br><br>1a) It is used to describe a single (as opposed to a repeated) action<br>in the past; it differs from the perfect in being more vivid and<br>pictorial. The perfect expresses the "fact", the imperfect adds<br>colour and movement by suggesting the "process" preliminary to its<br>completion.<br><br>he put forth his hand to the door<br>it came to a halt<br>I began to hear<br><br>1b) A phrase such as "What seekest thou?", refers not only to the<br>present, but assumes that the search has continued for some time.<br><br>Why do you weep?<br>Why refuse to eat?<br>Why are you distressed?<br><br>These relate not so much as to one occasion, as to a<br>continued condition.<br><br>2) The kind of progression or imperfection and unfinished condition<br>of the action may consist in its frequent repetition.<br><br>2a) In the present:<br><br>it is "said" today<br>a wise son "maketh glad" his father<br><br>2b) In the past:<br><br>"and so he did"<br>-<br>regularly, year by year<br>a mist "used to go up"<br>the fish which "we used to eat"<br>the manna "came down"<br>- regularly<br>he "spoke"<br>- repeatedly<br><br>3) The imperfect is used to express the "future", referring not only<br>to an action which is about to be accomplished but one which has<br>not yet begun:<br><br>3a) This may be a future from the point of view of the real<br>present; as:<br><br>Now "shalt thou see what I will do"<br>"We will burn" thy house<br><br>3b) It may be a future from any other point of view assumed; as:<br><br>he took his son that "was to reign"<br>she stayed to see what "should be done"<br><br>4) The usage of 3b may be taken as the transitive to a common use of<br>the imperfect in which it serves for an expression of those shades<br>of relation among acts and thoughts for which English prefers the<br>conditional moods. Such actions are strictly "future" in reference<br>to the assumed point of relation, and the simple imperfect<br>sufficiently expresses them; e.g.<br><br>of every tree thou "mayest eat"<br>"could we know"<br>he "would" say<br><br>5a) The imperfect follows particles expressing "transition",<br>"purpose", "result" and so forth as, "in order that", "lest"; e.g.<br><br>say thou art my sister, "that it may be well with thee"<br>let us deal wisely with the nation, "lest it multiplies"<br><br>5b) When however there is a strong feeling of "purpose", or when it<br>is meant to be strongly marked, then of course the moods are<br>employed; e.g.<br><br>raise me up "that I may requite them"<br>who will entice Ahab "that he may go up"<br>what shall we do "that the sea may be calm"<br><br>The moods are also employed to express that class of<br>future actions which we express in the "optative"<br><br>"may I die"<br>"may" the LORD "establish" his word<br>"may" the child "live"';
tenseDef[8812] = 'Infinitive<br><br>There are two forms of the infinitive:<br><br>1a) Infinitive Construct is used as a verbal noun corresponding<br>to the English verbal noun ending in "-ing"<br><br>1a1) as subject<br>to keep the judgments<br>to seek thy heart<br><br>1a2) as object<br>in his "writing"<br>he spoke, "saying"<br><br>1b) The Infinitive Absolute does not allow prefixes or suffixes<br><br>1b1) Used with a verb to emphasize the verbal idea. This is often<br>rendered by an English adverb, such as, "surely", "utterly".<br><br>he will surely visit you<br>he utterly destroyed the people<br><br>1b2) It may be used by itself with the value of a finite form of<br>the verb, especially an imperative.<br><br>remember the sabbath day';
tenseDef[8813] = 'Participle<br><br>1) The participle represents an action or condition in its unbroken<br>continuity, and corresponds to the English verb, "to be" with the<br>present participle. It may be used of present, past or future time.<br><br>1a) present time<br>what are you doing<br>1b) past time<br>"he was still speaking" when another came<br>1c) future time<br>we are destroying - e.g. are about to destroy';
tenseDef[8814] = 'Participle Active<br><br>Active form of the participle. See <a onClick="return T_Nav(\'8813\', 1);">08813</A> for description of<br>participle.';
tenseDef[8815] = 'Participle Passive<br><br>Passive form of the participle. See <a onClick="return T_Nav(\'8813\', 1);">08813</A> for description of participle.';
tenseDef[8816] = 'Perfect<br><br>The Perfect expresses a completed action.<br><br>1) In reference to time, such an action may be:<br><br>1a) one just completed from the standpoint of the present<br>"I have come" to tell you the news<br><br>1b) one completed in the more or less distant past<br>in the beginning God "created"<br>"I was (once) young" and "I have (now) grown old" but<br>"I have not seen" a righteous man forsaken<br><br>1c) one already completed from the point of view of another<br>past act<br>God saw everything that "he had made"<br><br>1d) one completed from the point of view of another action<br>yet future<br>I will draw for thy camels also until "they have done"<br>drinking<br><br>2) The perfect is often used where the present is employed in<br>English.<br><br>2a) in the case of general truths or actions of frequent<br>occurrence -- truths or actions which have been often<br>experienced or observed<br>the grass "withereth"<br>the sparrow "findeth" a house<br><br>2b) an action or attitude of the past may be continued into<br>the present<br>"I stretch out" my hands to thee<br>"thou never forsakest" those who seek thee<br><br>2c) the perfect of intransitive verbs is used where English<br>uses the present; The perfect in Hebrew in such a case<br>emphasises a condition which has come into "complete<br>existence" and realisation<br>"I know" thou wilt be king<br>"I hate" all workers of iniquity<br><br>2d) Sometimes in Hebrew, future events are conceived so<br>vividly and so realistically that they are regarded as<br>having virtually taken place and are described by the<br>perfect.<br><br>2d1) in promises, threats and language of contracts<br>the field "give I" thee<br>and if not, "I will take it"<br><br>2d2) prophetic language<br>my people "is gone into captivity"<br>(i.e. shall assuredly go)';
tenseDef[8817] = 'Aphel<br><br>In Biblical Aramaic (Chaldean), the Aphel is a causative conjugation<br>like the Hebrew Hiphil, but with the letter Aleph substituted for the<br>initial He.<br>Other changes in spelling also occur, but otherwise the<br>verb functions similarly to the Hebrew Hiphil, expressing<br>causative action.<br><br>See Hiphil <a onClick="return T_Nav(\'8818\', 1);">08818</A>';
tenseDef[8818] = 'Hiphil<br><br>a) Hiphil usually expresses the "causative" action of Qal - see 08851<br><br>Qal<br>Hiphil<br><br>he ate<br>he caused to eat, he fed<br>he came<br>he caused to come, he brought<br>he reigned<br>he made king, he crowned<br><br>b) Hiphil is often used to form verbs from nouns and adjectives.<br><br>Noun or Adjective<br>Hiphil<br><br>ear<br>to listen (lend an ear)<br>far<br>to remove oneself, put far away<br><br>c) Some "simple" verbs are found in Hiphil.<br><br>to cast, to destroy, to get up early, to explain, to tell<br><br>The form accounts for 13.3% of the verbs parsed.';
tenseDef[8819] = 'Hithpael<br><br>a) This form primarily expresses a "reflexive" action of Qal or Piel<br>See for Qal<br><a onClick="return T_Nav(\'8851\', 1);">08851</A><br>See for Piel <a onClick="return T_Nav(\'8840\', 1);">08840</A><br><br>Qal<br>Hithpael<br><br>he wore<br>he dressed himself<br>he washed<br>he washed himself<br>he fell<br>he flung himself, he fell upon, he attacked<br>he sold<br>he sold himself, he devoted himself<br><br>b) It expresses a reciprocal action.<br><br>they saw<br>they looked upon one another<br>they whispered<br>they whispered one to another<br><br>c) Some verbs in Hithpael are translated as a simple action. The<br>reflexive action os understood.<br><br>he prayed, he mourned, he became angry<br><br>This form accounts for 1.4% of the verbs parsed.';
tenseDef[8820] = 'Hithpalel<br><br>This Hebrew form is equivalent in use to the Hithpael, and is<br>causative/reflexive in meaning.<br>The separate term occurs because<br>certain verb forms reduplicate their final consonant and change into<br>a quadriliteral (4-letter) root rather than the normal triliteral<br>(3-letter) root form.<br><br>See Hithpael <a onClick="return T_Nav(\'8819\', 1);">08819</A>';
tenseDef[8821] = 'Hithpalpel<br><br>This Hebrew form is equivalent in use to the Hithpael, and is<br>causative/reflexive in meaning.<br>The separate term occurs because<br>certain verb forms reduplicate their final syllable (final two root<br>letters) and change the normal triliteral (3-letter) root form<br>into a reduplicated two-letter root.<br><br>See Hithpael <a onClick="return T_Nav(\'8819\', 1);">08819</A>';
tenseDef[8822] = 'Hithpeil<br><br>In Biblical Aramaic (Chaldean), this form is a passive causative/<br>reflexive conjugation like the Hebrew Hophal.<br>The verb functions<br>similarly to the Hebrew Hophal, expressing passive causative<br>action, but with the effect of the action upon oneself, being<br>reflexive.<br><br>See Hophal <a onClick="return T_Nav(\'8825\', 1);">08825</A><br>See Hithpael <a onClick="return T_Nav(\'8819\', 1);">08819</A>';
tenseDef[8823] = 'Hithpoel<br><br>A Hebrew intensive reflexive stem, caused by the lengthening of the<br>final vowel in the second syllable of the triliteral (3-letter) root.<br>This form functions similarly to the Hithpael.<br><br>See Hithpael <a onClick="return T_Nav(\'8819\', 1);">08819</A>';
tenseDef[8824] = 'Hithpolel<br><br>This Hebrew form is equivalent in use to the Hithpael, and is<br>causative/reflexive in meaning.<br>The separate term occurs because<br>certain verb forms reduplicate their final consonant and change into<br>a quadriliteral (4-letter) root rather than the normal triliteral<br>(3-letter) root form.<br>This form additionally lengthens the initial<br>vowel in the first consonant.<br><br>See Hithpael <a onClick="return T_Nav(\'8819\', 1);">08819</A>';
tenseDef[8825] = 'Hophal<br><br>Hophal is the "passive" of Hiphil - see 08818<br><br>Hiphil<br>Hophal<br><br>he told<br>it was told<br>he threw<br>he was thrown<br><br>This form is accounts for 0.6% of the verbs parsed.';
tenseDef[8826] = 'Hothpael<br><br>This is a passive form of the Hithpael, indicating a passive<br>intensive reflexive receiving of action upon the subject.<br>It thus<br>combines the features of both the Hithpael and the Hophal.<br><br>See Hithpael <a onClick="return T_Nav(\'8819\', 1);">08819</A><br>See Hophal <a onClick="return T_Nav(\'8825\', 1);">08825</A>';
tenseDef[8827] = 'Ishtaphel<br><br>In Aramaic (Chaldean), this form is similar to the Hebrew Hithpael,<br>with its form altered due to an initial Aleph and a metathesized<br>(reversed) Tau and Shin. This form occurs only rarely with verbs<br>meeting particular spelling qualities.<br><br>See Hithpael <a onClick="return T_Nav(\'8819\', 1);">08819</A>';
tenseDef[8828] = 'Ithpael<br><br>In Aramaic (Chaldean), this form is similar to the Hebrew Hithpael,<br>with its form altered due to an initial Aleph. This form reflects the<br>intensive causative, and occurs only rarely with verbs meeting<br>particular spelling qualities.<br><br>See Hithpael <a onClick="return T_Nav(\'8819\', 1);">08819</A>';
tenseDef[8829] = 'Ithpeal<br><br>In Aramaic (Chaldean), this form is similar to the Hebrew Hithpael,<br>with its form altered due to an initial Aleph. However, this form<br>reflects only the intensive reflexive of the common stem (Peal =<br>Hebrew Qal).<br>This form occurs only rarely with verbs meeting<br>particular spelling qualities.<br><br>See Hithpael <a onClick="return T_Nav(\'8819\', 1);">08819</A><br>See Qal <a onClick="return T_Nav(\'8851\', 1);">08851</A>';
tenseDef[8830] = 'Ithpeel<br><br>In Aramaic (Chaldean), this form is similar to the Hebrew Hithpael,<br>with its form altered due to an initial Aleph. However, this form<br>reflects only the reflexive of the intensive stem, and functions like<br>a Hebrew Piel and Hithpael combined.<br><br>See Hithpael <a onClick="return T_Nav(\'8819\', 1);">08819</A><br>See Piel <a onClick="return T_Nav(\'8840\', 1);">08840</A>';
tenseDef[8831] = 'Ithpeil<br><br>In Aramaic (Chaldean), this form is similar to the Hebrew Hithpael,<br>with its form altered due to an initial Aleph. However, this form<br>reflects only the passive intensive reflexive, and functions like the<br>Hithpael and Hophal combined.<br><br>See Hithpael <a onClick="return T_Nav(\'8819\', 1);">08819</A><br>See Hophal <a onClick="return T_Nav(\'8825\', 1);">08825</A>';
tenseDef[8832] = 'Ithpolel<br><br>This Aramaic (Chaldean) form is equivalent in use to the Hebrew<br>Hithpolel, and is causative/reflexive in meaning like the Hithpael.<br>The separate term occurs because certain verb forms reduplicate their<br>final consonant and change into a quadriliteral (4-letter) root<br>rather than the normal triliteral (3-letter) root form.<br>This form<br>additionally lengthens the initial vowel in the first consonant.<br><br>See Hithpael <a onClick="return T_Nav(\'8819\', 1);">08819</A><br>See Hithpolel <a onClick="return T_Nav(\'8824\', 1);">08824</A>';
tenseDef[8833] = 'Niphal<br><br>a) Niphal is the "passive" of Qal - see 08851<br><br>Qal<br>Niphal<br><br>he saw<br>he was seen, he appeared<br>he saw the angel<br>the angel was seen<br>he sent<br>he was sent<br>he created<br>it was created<br><br>b) Niphal sometimes expresses a "reflexive" action.<br><br>he guarded<br>he was guarded, also<br>he guarded himself<br><br>c) Several verbs use Niphal, although they express simple action<br>and are active in English. Common examples are:<br><br>he fought, he remained, he swore, he entered<br><br>This form accounts for 6.0% of the verbs parsed.';
tenseDef[8834] = 'Nithpael<br><br>This form is a passive intensive reflexive, combining both the<br>qualities of the Niphal and Hithpael.<br>Example: Eze. 23:48, "that<br>they may be taught" (= caused to learn).<br><br>See Niphal <a onClick="return T_Nav(\'8833\', 1);">08833</A><br>See Hithpael <a onClick="return T_Nav(\'8819\', 1);">08819</A>';
tenseDef[8835] = 'Pael<br><br>In Aramaic (Chaldean), the intensive form of the verb, equivalent of<br>the Hebrew Piel.<br><br>See Piel <a onClick="return T_Nav(\'8840\', 1);">08840</A>';
tenseDef[8836] = 'Palpal<br><br>A form of a triliteral verb such as "palal" which reduplicates the<br>first syllable for euphony.<br>This form otherwise functions like the<br>normal Qal stem.<br><br>See Qal <a onClick="return T_Nav(\'8851\', 1);">08851</A>';
tenseDef[8837] = 'Peal<br><br>In Aramaic (Chaldean), this form represents the base stem of the<br>verb, and is equivalent to the Hebrew Qal stem.<br><br>See Qal <a onClick="return T_Nav(\'8851\', 1);">08851</A>';
tenseDef[8838] = 'Peel Or Peil<br><br>In Aramaic (Chaldean), this stem reflects the Passive Intensive form,<br>and is equivalent to the Hebrew Pual.<br><br>See Pual <a onClick="return T_Nav(\'8849\', 1);">08849</A>';
tenseDef[8839] = 'Peil<br><br>In Aramaic (Chaldean), this stem reflects the Intensive form, and is<br>equivalent to the Hebrew Piel.<br><br>See Piel <a onClick="return T_Nav(\'8840\', 1);">08840</A>';
tenseDef[8840] = 'Piel<br><br>a) Piel usually expresses an "intensive" or "intentional" action.<br><br>Qal<br>Piel<br><br>he broke<br>he broke to pieces, he smashed<br>he sent<br>he sent away, he expelled<br><br>b) Sometimes the Piel introduces a new meaning to the Qal form.<br><br>he counted<br>he recounted, he told<br>he completed<br>he paid, he compensated<br>he learned<br>he taught<br><br>c) Piel expresses a "repeated" or "extended" action.<br><br>he jumped<br>he skipped, he hopped<br><br>d) Some intransitive verbs in Qal become transitive in Piel.<br><br>to be strong<br>to strengthen, to fortify<br>to become great<br>to make great';
tenseDef[8841] = 'Pilel<br><br>This form is equivalent to the Piel intensive form, and occurs due<br>to reduplication of the final root letter.<br><br>See Piel <a onClick="return T_Nav(\'8840\', 1);">08840</A>';
tenseDef[8842] = 'Pilpel<br><br>This form is equivalent to the Piel intensive form, and occurs due<br>to reduplication of the final root syllable.<br><br>See Piel <a onClick="return T_Nav(\'8840\', 1);">08840</A>';
tenseDef[8843] = 'Poal<br><br>This form is the passive of the Poel, and functions much like the<br>normal Pual.<br><br>See Pual <a onClick="return T_Nav(\'8849\', 1);">08849</A><br>See Poel <a onClick="return T_Nav(\'8845\', 1);">08845</A>';
tenseDef[8844] = 'Poalal<br><br>This form is identical to the Poal, but reduplicates the final root<br>syllable.<br>It functions much like the normal Pual.<br><br>See Poal <a onClick="return T_Nav(\'8843\', 1);">08843</A><br>See Pual <a onClick="return T_Nav(\'8849\', 1);">08849</A>';
tenseDef[8845] = 'Poel<br><br>This form functions much like the normal Piel, and arises only due to<br>certain internal vowel changes.<br><br>See Piel <a onClick="return T_Nav(\'8840\', 1);">08840</A>';
tenseDef[8846] = 'Polal<br><br>This form is identical to the Poal, but reduplicates the final root<br>letter.<br>It functions much like the normal Pual.<br><br>See Poal <a onClick="return T_Nav(\'8843\', 1);">08843</A><br>See Pual <a onClick="return T_Nav(\'8849\', 1);">08849</A>';
tenseDef[8847] = 'Polel<br><br>This form reduplicates the final root letter, but functions like the<br>normal Piel.<br><br>See Piel <a onClick="return T_Nav(\'8840\', 1);">08840</A>';
tenseDef[8848] = 'Polpal<br><br>This form reduplicates the initial root syllable, and functions like<br>the normal Pual.<br><br>See Pual <a onClick="return T_Nav(\'8849\', 1);">08849</A>';
tenseDef[8849] = 'Pual<br><br>Pual is the "passive" of Piel - see 08840<br><br>Piel<br>Pual<br><br>he smashed<br>it was smashed<br>he told<br>it was told<br><br>This form accounts for 0.7% of the verbs parsed.';
tenseDef[8850] = 'Pulal<br><br>This form reduplicates the final root syllable and is otherwise<br>equivalent to the normal Pual.<br><br>See Pual <a onClick="return T_Nav(\'8849\', 1);">08849</A>';
tenseDef[8851] = 'Qal<br><br>Qal is the most frequently used verb pattern. It expresses the<br>"simple" or "casual" action of the root in the active voice.<br><br>Examples:<br><br>he sat, he ate, he went, he said, he rose, he bought<br><br>This form accounts for 66.7% of the verbs parsed.';
tenseDef[8852] = 'Shaphel<br><br>A rare Aramaic (Chaldean) form, this reflects a causative like the<br>Hebrew Hiphil, but with a Shin prefixed rather than the usual He.<br>It otherwise functions like the Hebrew Hiphil.<br><br>See Hiphil <a onClick="return T_Nav(\'8818\', 1);">08818</A>';
tenseDef[8853] = 'Tiphel<br><br>A rare Hebrew form, this reflects a causative like the<br>Hebrew Hiphil, but with a Tau prefixed rather than the usual He.<br>It otherwise functions like the Hebrew Hiphil.<br><br>See Hiphil <a onClick="return T_Nav(\'8818\', 1);">08818</A>';
</script>
