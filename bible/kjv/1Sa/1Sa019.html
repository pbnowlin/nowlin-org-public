Text[1] = 'And Saul spake to Jonathan his son, and to all his servants, that they should kill David.';
Text[2] = 'But Jonathan Saul\'s son delighted much in David: and Jonathan told David, saying, Saul my father seeketh to kill thee: now therefore, I pray thee, take heed to thyself until the morning, and abide in a secret [place], and hide thyself:';
