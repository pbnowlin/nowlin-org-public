<script type="text/javascript">
var stringArray = new Array();
stringArray[1] = 'Then they told David, saying, Behold, the Philistines fight against __PNKeilah_1__SHKeilah</a>, and they __PNrob_the_2__SHrob the</a> threshingfloors.__CPKeilah_1__PSKeilah__EEKeilah was a city of Judah, situated, according to Eusebius, eight miles from Eleutheropolis, towards Hebron. Sozomen says that the prophet Habakkuk\'s tomb was shewn there. __NAJos/15/44\');">Jos 15:44__NBNeh/3/17\');">Neh 3:17__NRNeh/3/18\');">18__AN__GHrob_the_2__PSrob the__EFLev/26/16\');">Lev 26:16__NBDeu/28/33\');">Deu 28:33__NRDeu/28/51\');">51__NBJdg/6/4\');">Jdg 6:4__NRJdg/6/11\');">11__NBMic/6/15\');">Mic 6:15__EN';
stringArray[2] = 'Therefore David __PNenquired_1__SHenquired</a> of the LORD, saying, Shall I go and smite these Philistines? And the LORD said unto David, Go, and smite the Philistines, and save Keilah.__CPenquired_1__PSenquired__EEIn what way David made this enquiry we are not told; but it was probably by means of Abiathar; and therefore it would seem, that with Houbigant, we should read the sixth verse immediately after the first.--This adventure was truly noble and patriotic. Had not David loved his country, and been above all motives of private and personal revenge, he would have rejoiced in this invasion of Judea, as producing a strong diversion in his favour, and embroiling his inveterate enemy. In most cases, a man with David\'s wrongs would have joined with the enemies of his country, and avenged himself on the author of his calamities; but he thinks of nothing but succouring Keilah, and using his power and influence in behalf of his brethren. __NA1Sa/23/4\');">1Sa 23:4__NR1Sa/23/6\');">6__NR1Sa/23/9\');">9-12__NB1Sa/30/8\');">1Sa 30:8__NBNum/27/21\');">Num 27:21__NBJos/9/14\');">Jos 9:14__NBJdg/1/1\');">Jdg 1:1__NB2Sa/5/19\');">2Sa 5:19__NR2Sa/5/23\');">23__NB1Ch/14/10\');">1Ch 14:10__NBPsa/32/8\');">Psa 32:8__NBPro/3/5\');">Pro 3:5__NRPro/3/6\');">6__NBJer/10/23\');">Jer 10:23__EN';
stringArray[3] = 'And David\'s men said unto him, __PNBehold_1__SHBehold</a>, we be afraid here in Judah: how much more then if we come to Keilah against the armies of the Philistines?__CPBehold_1__PSBehold__FF1Sa/23/15\');">1Sa 23:15__NR1Sa/23/23\');">23__NR1Sa/23/26\');">26__NBPsa/11/1\');">Psa 11:1__NBJer/12/5\');">Jer 12:5__EN';
stringArray[4] = 'Then David enquired of the LORD __PNyet_again_1__SHyet again</a>. And the LORD answered him and said, Arise, go down to Keilah; __PNfor_I_will_2__SHfor I will</a> deliver the Philistines into thine hand.__CPyet_again_1__PSyet again__FF1Sa/28/6\');">1Sa 28:6__NBJdg/6/39\');">Jdg 6:39__AN__GHfor_I_will_2__PSfor I will__EFJos/8/7\');">Jos 8:7__NBJdg/7/7\');">Jdg 7:7__NB2Sa/5/19\');">2Sa 5:19__NB2Ki/3/18\');">2Ki 3:18__EN';
stringArray[5] = 'So David and his men went to Keilah, and fought with the Philistines, and brought away their cattle, and smote them with a great slaughter. So David saved the inhabitants of Keilah.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[6] = 'And it came to pass, __PNwhen_Abiathar_1__SHwhen Abiathar</a> the son of Ahimelech fled to David to Keilah, [that] he came down [with] __PNan_ephod_2__SHan ephod</a> in his hand.__CPwhen_Abiathar_1__PSwhen Abiathar__FF1Sa/22/20\');">1Sa 22:20__AN__GHan_ephod_2__PSan ephod__EF1Sa/14/3\');">1Sa 14:3__NR1Sa/14/18\');">18__NR1Sa/14/36\');">36__NR1Sa/14/37\');">37__NBExd/28/30\');">Exd 28:30__NRExd/28/31\');">31__EN';
stringArray[7] = 'And it was told Saul that David was come to Keilah. And Saul said, __PNGod_hath_3__SHGod hath</a> delivered him into mine hand; for __PNhe_is_shut_4__SHhe is shut</a> in, by entering into a town that hath gates and bars.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2943. B.C. 1061.__GHRelated_Verses2_2__PSEntire Verse.__FEAn. Ex. Is. 430.__GGGod_hath_3__PSGod hath__FF1Sa/23/14\');">1Sa 23:14__NB1Sa/24/4\');">1Sa 24:4-6__NB1Sa/26/8\');">1Sa 26:8__NR1Sa/26/9\');">9__NBPsa/71/10\');">Psa 71:10__NRPsa/71/11\');">11__AN__GHhe_is_shut_4__PShe is shut__EFExd/14/3\');">Exd 14:3__NBExd/15/9\');">Exd 15:9__NBJdg/16/2\');">Jdg 16:2__NRJdg/16/3\');">3__NBJob/20/5\');">Job 20:5__NBLuk/19/43\');">Luk 19:43__NRLuk/19/44\');">44__EN';
stringArray[8] = 'And Saul called all the people together to war, to go down to Keilah, to besiege David and his men.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[9] = 'And __PNDavid_1__SHDavid</a> knew that Saul secretly practised mischief against him; and he said to Abiathar the priest, __PNBring_2__SHBring</a> hither the ephod.__CPDavid_1__PSDavid__FFJer/11/18\');">Jer 11:18__NRJer/11/19\');">19__NBAct/9/24\');">Act 9:24__NBAct/14/6\');">Act 14:6__NBAct/23/16\');">Act 23:16-18__AN__GHBring_2__PSBring__EF1Sa/23/6\');">1Sa 23:6__NB1Sa/14/18\');">1Sa 14:18__NB1Sa/30/7\');">1Sa 30:7__NBNum/27/21\');">Num 27:21__NBJer/33/3\');">Jer 33:3__EN';
stringArray[10] = 'Then said David, O LORD God of Israel, thy servant hath certainly heard that Saul seeketh to come to Keilah, to __PNdestroy_the_city_1__SHdestroy the city</a> for my sake.__CPdestroy_the_city_1__PSdestroy the city__FF1Sa/23/8\');">1Sa 23:8__NB1Sa/22/19\');">1Sa 22:19__NBGen/18/24\');">Gen 18:24__NBEst/3/6\');">Est 3:6__NBPro/28/15\');">Pro 28:15__NBRom/3/15\');">Rom 3:15__NRRom/3/16\');">16__EN';
stringArray[11] = 'Will the men of Keilah deliver me up into his hand? will Saul come down, as thy servant hath heard? O LORD God of Israel, I beseech thee, tell thy servant. __PNAnd_the_LORD_1__SHAnd the LORD</a> said, He will come down.__CPAnd_the_LORD_1__PSAnd the LORD__FFPsa/50/15\');">Psa 50:15__NBJer/33/3\');">Jer 33:3__NBMat/7/7\');">Mat 7:7__NRMat/7/8\');">8__EN';
stringArray[12] = 'Then said David, Will the men of Keilah __PNdeliver_1__SHdeliver</a> me and my men into the hand of Saul? And the LORD said, __PNThey_will_2__SHThey will</a> deliver [thee] up.__CPdeliver_1__PSdeliver__EEHeb. shut up. __NAPsa/31/8\');">Psa 31:8__AN__GHThey_will_2__PSThey will__EF1Sa/23/7\');">1Sa 23:7__NBPsa/62/1\');">Psa 62:1__NBPsa/118/8\');">Psa 118:8__NBEcc/9/14\');">Ecc 9:14__NREcc/9/15\');">15__NBIsa/29/15\');">Isa 29:15__NBHbr/4/13\');">Hbr 4:13__EN';
stringArray[13] = 'Then David and his men, [which were] about __PNsix_hundred_1__SHsix hundred</a>, arose and departed out of Keilah, and went whithersoever they could go. And it was told Saul that David was escaped from Keilah; and he forbare to go forth.__CPsix_hundred_1__PSsix hundred__FF1Sa/22/2\');">1Sa 22:2__NB1Sa/25/13\');">1Sa 25:13__NB1Sa/30/9\');">1Sa 30:9__NR1Sa/30/10\');">10__EN';
stringArray[14] = 'And David abode in the wilderness in strong holds, and remained in __PNa_mountain_1__SHa mountain</a> in __PNthe_wilderness_2__SHthe wilderness</a> of Ziph. And __PNSaul_3__SHSaul</a> sought him every day, __PNbut_God_4__SHbut God</a> delivered him not into his hand.__CPa_mountain_1__PSa mountain__FFPsa/11/1\');">Psa 11:1-3__AN__GHthe_wilderness_2__PSthe wilderness__FEZiph is mentioned in Joshua with Carmel and Maon, near which it seems to have been situated; and as we have mention of Carmel and Maon in the history of David, as adjoining to Ziph, it cannot be doubted that by the Ziph, in the wilderness of which David now lay, and where was the hill of Hachilah, is to be understood Ziph near Carmel and Maon. __NAJos/15/24\');">Jos 15:24__NRJos/15/55\');">55__AN__GGSaul_3__PSSaul__FF1Sa/27/1\');">1Sa 27:1__NBPsa/54/3\');">Psa 54:3__NRPsa/54/4\');">4__NBPro/1/16\');">Pro 1:16__NBPro/4/16\');">Pro 4:16__AN__GHbut_God_4__PSbut God__EF1Sa/23/7\');">1Sa 23:7__NBPsa/32/7\');">Psa 32:7__NBPsa/37/32\');">Psa 37:32__NRPsa/37/33\');">33__NBPsa/54/3\');">Psa 54:3__NRPsa/54/4\');">4__NBPro/21/30\');">Pro 21:30__NBJer/36/26\');">Jer 36:26__NBRom/8/31\');">Rom 8:31__NB2Ti/3/11\');">2Ti 3:11__NB2Ti/4/17\');">2Ti 4:17__NR2Ti/4/18\');">18__EN';
stringArray[15] = 'And David saw that Saul was come out to seek his life: and David [was] in the wilderness of Ziph in a wood.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[16] = 'And Jonathan Saul\'s son arose, and went to David into the wood, and __PNstrengthened_1__SHstrengthened</a> his hand in God.__CPstrengthened_1__PSstrengthened__FFDeu/3/28\');">Deu 3:28__NBNeh/2/18\');">Neh 2:18__NBJob/4/3\');">Job 4:3__NRJob/4/4\');">4__NBJob/16/5\');">Job 16:5__NBPro/27/9\');">Pro 27:9__NRPro/27/17\');">17__NBEcc/4/9\');">Ecc 4:9-12__NBIsa/35/3\');">Isa 35:3__NRIsa/35/4\');">4__NBEze/13/22\');">Eze 13:22__NBLuk/22/32\');">Luk 22:32__NRLuk/22/43\');">43__NBEph/6/10\');">Eph 6:10__NB2Ti/2/1\');">2Ti 2:1__NBHbr/12/12\');">Hbr 12:12__NRHbr/12/13\');">13__EN';
stringArray[17] = 'And he said unto him, __PNFear_not_1__SHFear not</a>: for the hand of Saul my father __PNshall_not_2__SHshall not</a> find thee; and __PNthou_shalt_be_3__SHthou shalt be</a> king over Israel, and __PNI_shall_be_4__SHI shall be</a> next unto thee; and __PNthat_also_Saul_5__SHthat also Saul</a> my father knoweth.__CPFear_not_1__PSFear not__FFIsa/41/10\');">Isa 41:10__NRIsa/41/14\');">14__NBHbr/13/6\');">Hbr 13:6__AN__GHshall_not_2__PSshall not__EFJob/5/11\');">Job 5:11-15__NBPsa/27/1\');">Psa 27:1-3__NBPsa/46/1\');">Psa 46:1__NRPsa/46/2\');">2__NBPsa/91/1\');">Psa 91:1__NRPsa/91/2\');">2__NBPro/14/26\');">Pro 14:26__NBIsa/54/17\');">Isa 54:17__AN__GGthou_shalt_be_3__PSthou shalt be__FFLuk/12/32\');">Luk 12:32__AN__GHI_shall_be_4__PSI shall be__EFPro/19/21\');">Pro 19:21__NBAct/28/16\');">Act 28:16__NBRom/15/24\');">Rom 15:24__AN__GGthat_also_Saul_5__PSthat also Saul__FF1Sa/20/31\');">1Sa 20:31__NB1Sa/24/20\');">1Sa 24:20__NBAct/5/39\');">Act 5:39__EN';
stringArray[18] = 'And they two made a covenant before the LORD: and David abode in the wood, and Jonathan went to his house.__CPRelated_Verses1_1__PSEntire Verse.__FF1Sa/18/3\');">1Sa 18:3__NB1Sa/20/12\');">1Sa 20:12-17__NR1Sa/20/42\');">42__NB2Sa/9/1\');">2Sa 9:1__NB2Sa/21/7\');">2Sa 21:7__EN';
stringArray[19] = 'Then came up __PNthe_Ziphites_1__SHthe Ziphites</a> to Saul to Gibeah, saying, Doth not David hide himself with us in strong holds in the wood, in the hill of __PNHachilah_2__SHHachilah</a>, which [is] __PNon_the_south_3__SHon the south</a> of Jeshimon?__CPthe_Ziphites_1__PSthe Ziphites__FF1Sa/22/7\');">1Sa 22:7__NR1Sa/22/8\');">8__NB1Sa/26/1\');">1Sa 26:1__NBPsa/54/1\');">Psa 54:1__AN; *title; __NAPsa/54/3\');">Psa 54:3__NRPsa/54/4\');">4__NBPro/29/12\');">Pro 29:12__AN__GHHachilah_2__PSHachilah__FECalmet states, that Hachilah was a mountain about ten miles south of Jericho, where Jonathan Maccabæus built the castle of Massada, west of the Dead Sea, and not far from En-gedi. __NA1Sa/26/1\');">1Sa 26:1__NR1Sa/26/3\');">3__AN__GGon_the_south_3__PSon the south__EEHeb. on the right hand. Jeshimon. or, the wilderness. Eusebius places Jeshimon ten miles south of Jericho, near the Dead Sea; which agrees extremely well with the position of Hachilah, as stated by Calmet.</TD></TR>';
stringArray[20] = 'Now therefore, O king, come down according to __PNall_the_desire_1__SHall the desire</a> of thy soul to come down; and __PNour_part_2__SHour part</a> [shall be] to deliver him into the king\'s hand.__CPall_the_desire_1__PSall the desire__FFDeu/18/6\');">Deu 18:6__NB2Sa/3/21\');">2Sa 3:21__NBPsa/112/10\');">Psa 112:10__NBPro/11/23\');">Pro 11:23__AN__GHour_part_2__PSour part__EF1Ki/21/11\');">1Ki 21:11-14__NB2Ki/10/5\');">2Ki 10:5-7__NBPsa/54/3\');">Psa 54:3__NBPro/29/26\');">Pro 29:26__EN';
stringArray[21] = 'And Saul said, Blessed [be] ye of the LORD; for ye have compassion on me.__CPRelated_Verses1_1__PSEntire Verse.__FF1Sa/22/8\');">1Sa 22:8__NBJdg/17/2\');">Jdg 17:2__NBPsa/10/3\');">Psa 10:3__NBIsa/66/5\');">Isa 66:5__NBMic/3/11\');">Mic 3:11__EN';
stringArray[22] = 'Go, I pray you, prepare yet, and know and see his place where his __PNhaunt_is_1__SHhaunt is</a>, [and] who hath seen him there: for it is told me [that] he dealeth very subtilly.__CPhaunt_is_1__PShaunt is__EEHeb. foot shall be. __NAJob/5/13\');">Job 5:13__EN';
stringArray[23] = 'See therefore, and __PNtake_knowledge_1__SHtake knowledge</a> of all the lurking places where he hideth himself, and come ye again to me with the certainty, and I will go with you: and it shall come to pass, if he be in the land, that __PNI_will_search_2__SHI will search</a> him out throughout all __PNthe_thousands_3__SHthe thousands</a> of Judah.__CPtake_knowledge_1__PStake knowledge__FFMar/14/1\');">Mar 14:1__NRMar/14/10\');">10__NRMar/14/11\');">11__NBJhn/18/2\');">Jhn 18:2__NRJhn/18/3\');">3__AN__GHI_will_search_2__PSI will search__EF2Sa/17/11\');">2Sa 17:11-13__NB1Ki/18/10\');">1Ki 18:10__NBPro/1/16\');">Pro 1:16__NBRom/3/15\');">Rom 3:15__NRRom/3/16\');">16__AN__GGthe_thousands_3__PSthe thousands__FFNum/10/36\');">Num 10:36__NBMic/5/2\');">Mic 5:2__EN';
stringArray[24] = 'And they arose, and went to Ziph before Saul: but David and his men [were] in __PNthe_wilderness_1__SHthe wilderness</a> of __PNMaon_2__SHMaon</a>, in the plain on __PNthe_south_3__SHthe south</a> of Jeshimon.__CPthe_wilderness_1__PSthe wilderness__EEMaon, from which the adjoining mountainous district derived its name, was city in the most southern parts of the tribe of Judah, and a neighbouring town to Carmel. Hence Nabal (__NA1Sa/25/2\');">1Sa 25:2__AN) is described as a man of Maon, whose possessions were in Carmel; and though he might dwell generally in Maon, yet he is styled Nabal the Carmelite, from the place where his estate lay. Calmet supposes it to be the city Minoïs, which Eusebius places in the vicinity of Gaza; and the Moenoemi Castrum, which the Theodosian code places near Beersheba.__GHMaon_2__PSMaon__EF1Sa/25/2\');">1Sa 25:2__NBJos/15/55\');">Jos 15:55__AN__GGthe_south_3__PSthe south__FF1Sa/23/19\');">1Sa 23:19__EN';
stringArray[25] = 'Saul also and his men went to seek [him]. And they told David: wherefore he came down __PNinto_a_rock_1__SHinto a rock</a>, and abode in the wilderness of Maon. And when Saul heard [that], he pursued after David in the wilderness of Maon.__CPinto_a_rock_1__PSinto a rock__EEor, from the rock. __NA1Sa/23/28\');">1Sa 23:28__NBJdg/15/8\');">Jdg 15:8__EN';
stringArray[26] = 'And Saul went on this side of the mountain, and David and his men on that side of the mountain: and __PNDavid_made_haste_1__SHDavid made haste</a> to get __PNaway_2__SHaway</a> for fear of Saul; for Saul and his men compassed David and his men round about to take them.__CPDavid_made_haste_1__PSDavid made haste__FF1Sa/19/12\');">1Sa 19:12__NB1Sa/20/38\');">1Sa 20:38__NB2Sa/15/14\');">2Sa 15:14__NB2Sa/17/21\');">2Sa 17:21__NR2Sa/17/22\');">22__NBPsa/31/22\');">Psa 31:22__AN__GHaway_2__PSaway__EF2Ch/20/12\');">2Ch 20:12__NBPsa/17/9\');">Psa 17:9__NRPsa/17/11\');">11__NBPsa/22/12\');">Psa 22:12__NRPsa/22/16\');">16__NBPsa/118/11\');">Psa 118:11-13__NBPsa/140/1\');">Psa 140:1-9__NB2Cr/1/8\');">2Cr 1:8__NBRev/20/9\');">Rev 20:9__EN';
stringArray[27] = 'But __PNthere_came_1__SHthere came</a> a messenger unto Saul, saying, Haste thee, and come; for __PNthe_Philistines_2__SHthe Philistines</a> have __PNinvaded_3__SHinvaded</a> the land.__CPthere_came_1__PSthere came__FFGen/22/14\');">Gen 22:14__NBDeu/32/36\');">Deu 32:36__NB2Ki/19/9\');">2Ki 19:9__NBPsa/116/3\');">Psa 116:3__AN__GHthe_Philistines_2__PSthe Philistines__EF2Ki/19/9\');">2Ki 19:9__NBRev/12/16\');">Rev 12:16__AN__GGinvaded_3__PSinvaded__EEHeb. spread themselves upon. __NA1Ch/14/13\');">1Ch 14:13__EN';
stringArray[28] = 'Wherefore Saul returned from pursuing after David, and went against the Philistines: therefore they called that place __PNSela_hammahlekoth_1__SHSelahammahlekoth</a>.__CPSela_hammahlekoth_1__PSSela-hammahlekoth__EE"that is, the rock of divisions. Because, says the Targum, ""the heart of the king was divided to go hither and thither."" Here Saul was obliged to separate himself from David, in order to go and oppose the invading Philistines; which deliverance of David was of such a nature as made the Divine interposition fully visible."</TD></TR>';
stringArray[29] = 'And David went up from thence, and dwelt in __PNstrong_holds_1__SHstrong holds</a> at Engedi.__CPstrong_holds_1__PSstrong holds__FF1Sa/23/14\');">1Sa 23:14__NR1Sa/23/19\');">19__AN. The district around En-gedi, near the western coast of the Dead Sea, is reported by travellers to be a mountainous territory, filled with caverns; and consequently, proper for David in his present circumstances. Dr. Lightfoot thinks this was the wilderness of Judah, in which David was when he penned the 63rd Psalm, which breathes as much pious and devout affection as almost any of his Psalms; for in all places and in all conditions he still kept up his communion with God.--If Christians knew their privileges better, and acted up thereto, there would be less murmuring at the dark dispensations of Divine Providence. __NA1Sa/24/1\');">1Sa 24:1__NBGen/14/7\');">Gen 14:7__NBJos/15/62\');">Jos 15:62__NB2Ch/20/2\');">2Ch 20:2__NBSgs/1/14\');">Sgs 1:14__NBEze/47/10\');">Eze 47:10__EN';

</script>
