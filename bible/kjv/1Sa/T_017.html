stringArray[1] = 'Now the Philistines __PNgathered_1__SHgathered</a> together their armies to battle, and were gathered together at __PNShochoh_2__SHShochoh</a>, which [belongeth] to Judah, and pitched between Shochoh and __PNAzekah_3__SHAzekah</a>, in __PNEphes_dammim_4__SHEphesdammim</a>.__CPgathered_1__PSgathered__FF1Sa/7/7\');">1Sa 7:7__NB1Sa/13/5\');">1Sa 13:5__NB1Sa/14/46\');">1Sa 14:46__NR1Sa/14/52\');">52__NBJdg/3/3\');">Jdg 3:3__AN__GHShochoh_2__PSShochoh__EFJos/15/35\');">Jos 15:35__AN; Socoh. __NA2Ch/11/7\');">2Ch 11:7__AN; Shoco. __NA2Ch/28/18\');">2Ch 28:18__AN; Shocho.__GGAzekah_3__PSAzekah__FFJos/10/10\');">Jos 10:10__NRJos/10/11\');">11__NBJos/15/35\');">Jos 15:35__NBJer/34/7\');">Jer 34:7__AN__GHEphes_dammim_4__PSEphes-dammim__FEor, the coast of Dammim. __NA1Ch/11/13\');">1Ch 11:13__AN; Pas-dammim.</TD></TR>';
stringArray[2] = 'And Saul and the men of Israel were gathered together, and pitched by __PNthe_valley_1__SHthe valley</a> of Elah, and __PNset_the_battle_in_array_2__SHset the battle in array</a> against the Philistines.__CPthe_valley_1__PSthe valley__FF1Sa/17/19\');">1Sa 17:19__NB1Sa/21/9\');">1Sa 21:9__AN__GHset_the_battle_in_array_2__PSset the battle in array__FEHeb. ranged the battle.</TD></TR>';
stringArray[3] = 'And the Philistines stood on a mountain on the one side, and Israel stood on a mountain on the other side: and [there was] a valley between them.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[4] = 'And there went out a champion out of the camp of the Philistines, named __PNGoliath_1__SHGoliath</a>, __PNof_Gath_2__SHof Gath</a>, __PNwhose_height_3__SHwhose height</a> [was] __PNsix_cubits_4__SHsix cubits</a> and a span.__CPGoliath_1__PSGoliath__FF1Sa/17/23\');">1Sa 17:23__NB1Sa/21/9\');">1Sa 21:9__NR1Sa/21/10\');">10__NB2Sa/21/19\');">2Sa 21:19__NB1Ch/20/5\');">1Ch 20:5__AN__GHof_Gath_2__PSof Gath__EF1Sa/27/4\');">1Sa 27:4__NBJos/11/22\');">Jos 11:22__NB2Sa/21/16\');">2Sa 21:16-22__NB1Ch/20/4\');">1Ch 20:4-8__AN__GGwhose_height_3__PSwhose height__FFDeu/3/11\');">Deu 3:11__NB1Ch/11/23\');">1Ch 11:23__NBAmo/2/9\');">Amo 2:9__AN__GHsix_cubits_4__PSsix cubits__FE"According to Bp. Cumberland\'s calculation, the height of Goliath was about eleven feet ten inches; but Parkhurst estimating the ordinary cubit at seventeen inches and a half, calculates that he was nine feet six inches high. Few instances can be produced of men who can be compared with him. Pliny says, ""The tallest man that hath been seen in our days was one name Gabara, who, in the days of Claudius, the late Emperor, was brought out of Arabia: he was nine feet nine inches."" Josephus mentions a Jew, named Eleazar, whom Vitellius sent to Rome, who was seven cubits, or ten feet two inches high. Becanus saw a man near ten feet, and a woman that was full ten feet. And, to mention no more, a man of the name of John Middleton, born at Hale, near Warrington, in Lancashire, in the reign of James the First, was more than nine feet high. Dr. Plott, in his history of Staffordshire, says, that ""his hand, from the carpus to the end of the middle finger, was seventeen inches, his palms eight inches and a half broad, and hi"</TD></TR>';
stringArray[5] = 'And [he had] an helmet of brass upon his head, and he [was] __PNarmed_1__SHarmed</a> with a coat of mail; and the weight of the coat [was] five thousand shekels of brass.__CParmed_1__PSarmed__EEHeb. clothed.</TD></TR>';

stringArray[8] = 'And he stood and cried unto the armies of Israel, and said unto them, Why are ye come out to set [your] battle in array? [am] not I a Philistine, and ye __PNservants_to_Saul_1__SHservants to Saul</a>? choose you a man for you, and let him come down to me.__CPservants_to_Saul_1__PSservants to Saul__FF1Sa/17/26\');">1Sa 17:26__NB1Sa/8/17\');">1Sa 8:17__NB2Sa/11/11\');">2Sa 11:11__NB1Ch/21/3\');">1Ch 21:3__EN';

stringArray[17] = 'And Jesse said unto David his son, __PNTake_now_1__SHTake now</a> for thy brethren an ephah of this __PNparched_corn_2__SHparched [corn]</a>, and these ten loaves, and run to the camp to thy brethren;__CPTake_now_1__PSTake now__FFMat/7/11\');">Mat 7:11__NBLuk/11/13\');">Luk 11:13__AN__GHparched_corn_2__PSparched corn__EF1Sa/25/18\');">1Sa 25:18__NBRth/2/14\');">Rth 2:14__NB2Sa/17/28\');">2Sa 17:28__EN';
stringArray[18] = 'And __PNcarry_1__SHcarry</a> these ten __PNcheeses_2__SHcheeses</a> unto the captain of __PNtheir_thousand_3__SH[their] thousand</a>, and look how thy brethren fare, and take their pledge.__CPcarry_1__PScarry__FF1Sa/16/20\');">1Sa 16:20__AN__GHcheeses_2__PScheeses__FEHeb. cheeses of milk. __NA2Sa/17/29\');">2Sa 17:29__NBJob/10/10\');">Job 10:10__AN__GGtheir_thousand_3__PStheir thousand__EEHeb. a thousand.__GH_look_4__PS look__EFGen/37/14\');">Gen 37:14__NBAct/15/36\');">Act 15:36__NB1Th/3/5\');">1Th 3:5__NR1Th/3/6\');">6__EN';
stringArray[19] = 'Now Saul, and they, and all the men of Israel, [were] in __PNthe_valley_1__SHthe valley</a> of Elah, fighting with the Philistines.__CPthe_valley_1__PSthe valley__EE"Dr. Richardson says, that in about twenty minutes, in an easterly direction, form the cave of St. John, (which is about two hours or six miles, in a westerly direction, from Jerusalem,) they came to the valley of Elah; which position seems to agree with that of Shochoh and Azekah. He describes it as ""a small valley, and the place of the encampment is pointed out where it narrows into a broad, deep ravine; part of it was in crop, and part of it was under the plough, which was drawn by a couple of oxen. A small stream, which had shrunk almost under its stony bed, passes through it from east to west, from which we are informed that David chose out five smooth stones, and hasted and ran to meet the haughty champion of Gath. A well of water under the bank, with a few olive trees above, on the north side of the valley, are said to mark the spot of the shepherd\'s triumph over his boasting antagonist. Saul and his men probably occupied the side of the valley which is nearest to Jerusalem, on which the ground is highe"</TD></TR>';
stringArray[20] = 'And David rose up early in the morning, and __PNleft_the_sheep_1__SHleft the sheep</a> with a keeper, and took, and went, as Jesse had commanded him; and he came to the __PNtrench_2__SHtrench</a>, as the host was going forth to the __PNfight_3__SHfight</a>, and shouted for the battle.__CPleft_the_sheep_1__PSleft the sheep__FF1Sa/17/28\');">1Sa 17:28__NBEph/6/1\');">Eph 6:1__NREph/6/2\');">2__AN__GHtrench_2__PStrench__FEor, place of the carriage. __NA1Sa/26/5\');">1Sa 26:5__NBLuk/19/43\');">Luk 19:43__AN__GGfight_3__PSfight__EEor, battle array, or place of fight.</TD></TR>';
stringArray[21] = 'For Israel and the Philistines had put the battle in array, army against army.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[22] = 'And David left __PNhis_carriage_1__SHhis carriage</a> in the hand of the keeper of the carriage, and ran into the army, and came and __PNsaluted_his_brethren_2__SHsaluted his brethren</a>.__CPhis_carriage_1__PShis carriage__EEHeb. the vessels from upon him.__GHsaluted_his_brethren_2__PSsaluted his brethren__FEHeb. asked his brethren of peace. __NAGen/37/14\');">Gen 37:14__NBJdg/18/15\');">Jdg 18:15__NBMat/10/12\');">Mat 10:12__NRMat/10/13\');">13__NBLuk/10/5\');">Luk 10:5__NRLuk/10/6\');">6__EN';
stringArray[23] = 'And as he talked with them, behold, there came up the champion, the Philistine of Gath, Goliath by name, out of the armies of the Philistines, and spake __PNaccording_1__SHaccording</a> to the same words: and David heard [them].__CPaccording_1__PSaccording__FF1Sa/17/4\');">1Sa 17:4-10__EN';
stringArray[24] = 'And all the men of Israel, when they saw the man, fled from __PNhim_1__SHhim</a>, and were __PNsore_2__SHsore</a> afraid.__CPhim_1__PShim__EEHeb. his face. __NA1Sa/13/6\');">1Sa 13:6__NR1Sa/13/7\');">7__AN__GHsore_2__PSsore__EF1Sa/17/11\');">1Sa 17:11__NBLev/26/36\');">Lev 26:36__NBNum/13/33\');">Num 13:33__NBDeu/32/30\');">Deu 32:30__NBIsa/7/2\');">Isa 7:2__NBIsa/30/17\');">Isa 30:17__EN';

stringArray[26] = 'And David spake to the men that stood by him, saying, What shall be done to the man that killeth this Philistine, and taketh away the __PNreproach_1__SHreproach</a> from Israel? for who [is] this __PNuncircumcised_2__SHuncircumcised</a> Philistine, that he should __PNdefy_3__SHdefy</a> the armies of the living God?__CPreproach_1__PSreproach__FF1Sa/11/2\');">1Sa 11:2__NBJos/7/8\');">Jos 7:8__NRJos/7/9\');">9__NB2Ki/19/4\');">2Ki 19:4__NBNeh/5/9\');">Neh 5:9__NBPsa/44/13\');">Psa 44:13__NBPsa/74/18\');">Psa 74:18__NBPsa/79/12\');">Psa 79:12__NBDan/9/16\');">Dan 9:16__NBJoe/2/19\');">Joe 2:19__AN__GHuncircumcised_2__PSuncircumcised__EF1Sa/17/36\');">1Sa 17:36__NB1Sa/14/6\');">1Sa 14:6__AN__GGdefy_3__PSdefy__FF1Sa/17/10\');">1Sa 17:10__NBDeu/5/26\');">Deu 5:26__NBJer/10/10\');">Jer 10:10__NB1Th/1/9\');">1Th 1:9__NB1Jo/5/20\');">1Jo 5:20__EN';

stringArray[28] = 'And Eliab his eldest brother heard when he spake unto the men; and __PNEliab_s_anger_1__SHEliab\'s anger</a> was kindled against David, and he said, Why camest thou down hither? and __PNwith_2__SHwith</a> whom hast thou left those few sheep in the wilderness? __PNI_know_3__SHI know</a> thy pride, and the naughtiness of thine heart; for thou art come down that thou mightest see the battle.__CPEliab_s_anger_1__PSEliab\'s anger__FF1Sa/16/13\');">1Sa 16:13__NBGen/37/4\');">Gen 37:4__NRGen/37/8\');">8__NRGen/37/11\');">11__NBPro/18/19\');">Pro 18:19__NBPro/27/4\');">Pro 27:4__NBEcc/4/4\');">Ecc 4:4__NBMat/10/36\');">Mat 10:36__NBMat/27/18\');">Mat 27:18__NBMar/3/21\');">Mar 3:21__AN__GHwith_2__PSwith__EF1Sa/17/20\');">1Sa 17:20__AN__GGI_know_3__PSI know__FF1Sa/16/7\');">1Sa 16:7__NBPsa/35/11\');">Psa 35:11__NBJud/1/10\');">Jud 1:10__EN';

stringArray[30] = 'And he turned from him toward another, and spake after the same __PNmanner_1__SHmanner</a>: and the people answered him again after the former manner.__CPmanner_1__PSmanner__EEHeb. word. __NA1Sa/17/26\');">1Sa 17:26__NR1Sa/17/27\');">27__EN';
stringArray[31] = 'And when the words were heard which David spake, they rehearsed [them] before Saul: and he __PNsent_for_him_1__SHsent for him</a>.__CPsent_for_him_1__PSsent for him__EEHeb. took him. __NAPro/22/29\');">Pro 22:29__AN; The preceding twenty verses, from the 12th to the 31st inclusive, the 41st, and from the 54th to the end of this chapter, with the five first verses and the 9th, 10th, 11th, 17th, 18th, and 19th, of chap 18, are all wanting in the Vatican copy of the LXX.; and they are supposed by Dr. Kennicott, and others, to be an interpolation. But, as Bp. Horsley observes, it appears, from many circumstances of the story, that David?s combat with Goliath was many years prior to Saul?s madness, and David?s introduction to him as a musician. In the first place, David was quite a youth when he engaged with Goliath, (__NA1Sa/17/33\');">1Sa 17:33__AN, __NA1Sa/17/42\');">42__AN:) when introduced to Saul he was of full age, (__NA1Sa/16/18\');">1Sa 16:18__AN.) Again, this combat was his first appearance in public life, and his first military exploit, (__NA1Sa/17/36\');">1Sa 17:36__AN, __NA1Sa/17/38\');">38__AN, __NA1Sa/17/39\');">39__AN:) when introduced as a musician, he was a man of established character, and a man of war (__NA1Sa/16/18\');">1Sa 16:18__AN.) Now the just conclusion is, that the last ten verses of 16:14-23; have been misplaced; their true place </TD></TR>';
stringArray[32] = 'And David said to Saul, __PNLet_1__SHLet</a> no man\'s heart fail because of him; __PNthy_2__SHthy</a> servant will go and fight with this Philistine.__CPLet_1__PSLet__FFNum/13/30\');">Num 13:30__NBNum/14/9\');">Num 14:9__NBDeu/20/1\');">Deu 20:1-3__NBIsa/35/4\');">Isa 35:4__NBHbr/12/12\');">Hbr 12:12__AN__GHthy_2__PSthy__EF1Sa/14/6\');">1Sa 14:6__NB1Sa/16/18\');">1Sa 16:18__NBJos/14/12\');">Jos 14:12__NBPsa/3/6\');">Psa 3:6__NBPsa/27/1\');">Psa 27:1-3__EN';
stringArray[33] = 'And Saul said to David, __PNThou_art_not_1__SHThou art not</a> able to go against this Philistine to fight with him: __PNfor_thou_art_but_2__SHfor thou [art but]</a> a youth, and he a man of war from his youth.__CPThou_art_not_1__PSThou art not__FFNum/13/31\');">Num 13:31__NBDeu/9/2\');">Deu 9:2__NBPsa/11/1\');">Psa 11:1__NBRev/13/4\');">Rev 13:4__AN__GHfor_thou_art_but_2__PSfor thou art but__EF1Sa/17/42\');">1Sa 17:42__NR1Sa/17/56\');">56__EN';

stringArray[43] = 'And the Philistine said unto David, [__PNAm_1__SHAm</a>] I a dog, that thou comest to me with staves? And the Philistine __PNcursed_2__SHcursed</a> David by his gods.__CPAm_1__PSAm__FF1Sa/24/14\');">1Sa 24:14__NB2Sa/3/8\');">2Sa 3:8__NB2Sa/9/8\');">2Sa 9:8__NB2Sa/16/9\');">2Sa 16:9__NB2Ki/8/13\');">2Ki 8:13__AN__GHcursed_2__PScursed__EFGen/27/29\');">Gen 27:29__NBNum/22/6\');">Num 22:6__NRNum/22/11\');">11__NRNum/22/12\');">12__NBJdg/9/27\');">Jdg 9:27__NBPro/26/2\');">Pro 26:2__EN';
stringArray[44] = 'And the Philistine said to David, __PNCome_to_me_1__SHCome to me</a>, and __PNI_will_give_2__SHI will give</a> thy flesh unto the fowls of the air, and to the beasts of the field.__CPCome_to_me_1__PSCome to me__FF1Ki/20/10\');">1Ki 20:10__NR1Ki/20/11\');">11__NBPro/18/12\');">Pro 18:12__NBEcc/9/11\');">Ecc 9:11__NREcc/9/12\');">12__NBJer/9/23\');">Jer 9:23__NBEze/28/2\');">Eze 28:2__NREze/28/9\');">9__NREze/28/10\');">10__NBEze/39/17\');">Eze 39:17-20__AN__GHI_will_give_2__PSI will give__FEParallel instances of vaunting occur in some writers of a more recent date:--The conspirators against the emperor Maximinus having slain him, his son, and several of his best friends, threw out their bodies to be devoured by dogs and the fowls of the air. This custom appears to have been frequently threatened; and, however shocking to human feelings, was often carried into effect.</TD></TR>';

stringArray[48] = 'And it came to pass, when the Philistine arose, and came and drew nigh to meet David, that __PNDavid_hasted_1__SHDavid hasted</a>, and ran toward the army to meet the Philistine.__CPDavid_hasted_1__PSDavid hasted__FFPsa/27/1\');">Psa 27:1__NBPro/28/1\');">Pro 28:1__EN';
stringArray[49] = 'And David put his hand in his bag, and took thence a stone, and slang [it], and __PNsmote_1__SHsmote</a> the Philistine in his forehead, that the stone sunk into his forehead; and he fell upon his face to the earth.__CPsmote_1__PSsmote__FF1Ki/22/34\');">1Ki 22:34__NB2Ki/9/24\');">2Ki 9:24__NB1Cr/1/27\');">1Cr 1:27__NR1Cr/1/28\');">28__EN';
stringArray[50] = '__PNSo_David_prevailed_1__SHSo David prevailed</a> over the Philistine with a sling and with a stone, and smote the Philistine, and slew him; __PNbut_there_was_2__SHbut [there was]</a> no sword in the hand of David.__CPSo_David_prevailed_1__PSSo David prevailed__EE"The tradition of the combat between David and Goliath, in which the latter was killed, is preserved among the Arabs; for he is mentioned in the Koran, where he is called Galut or Jalut. The Arabs also call the dynasty of the Philistine kings, who reigned in Palestine when the Hebrews came there, Galutiah, or Jalutiah. Achmed Al Fassi says, ""Those kings were as well known by the name of Jalaut, as the ancient kings of Egypt by that of Pharaoh. David killed the Jalaut who reigned in his time, and entirely rooted out the Philistines, the rest of whom fled into Africa, and from them descended the Brebers or Berbers, who inhabit the coast of Barbary."" It is remarkable that the Berbers themselves should acknowledge their descent from the Philistines. ""The name Goliath, which they pronounce Sghiàlud, is very common among the Brebers, and the history of the champion of the Philistines is very well known to the Moors. When children quarrel, and the bigger one challenges the smaller to fight the latter answers, \'Who wi"__GHbut_there_was_2__PSbut there was__EF1Sa/17/39\');">1Sa 17:39__NB1Sa/13/22\');">1Sa 13:22__EN';
