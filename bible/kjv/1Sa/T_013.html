stringArray[15] = 'And __PNSamuel_1__SHSamuel</a> arose, and gat him up from Gilgal unto Gibeah of Benjamin. And Saul numbered the people [that were] __PNpresent_2__SHpresent</a> with him, __PNabout_six_3__SHabout six</a> hundred men.__CPSamuel_1__PSSamuel__EE"The LXX. have, ""Samuel arose and went away from Gilgal, and the remainder of the people went up along with the men of war after Samuel from Gilgal to Gibeah of Benjamin."" This is probably the true reading; for it does not appear that Samuel went to Gibeah, which was Saul\'s usual residence; and the Hebrew copyist, as Dr. Wall observes, seems to have missed a line, and added to the sentence concerning Samuel, that which ended the sentence concerning Saul. One MS. instead of Samuel, in the beginning of the sentence, reads Saul."__GHpresent_2__PSpresent__FEHeb. found.__GGabout_six_3__PSabout six__FF1Sa/13/2\');">1Sa 13:2__NR1Sa/13/6\');">6__NR1Sa/13/7\');">7__NB1Sa/14/2\');">1Sa 14:2__EN';
