stringArray[1] = 'And David __PNfled_1__SHfled</a> from Naioth in Ramah, and came and said before Jonathan, __PNWhat_have_2__SHWhat have</a> I done? what [is] mine iniquity? and what [is] my sin before thy father, that he seeketh my life?__CPfled_1__PSfled__FF1Sa/19/19\');">1Sa 19:19-24__NB1Sa/23/26\');">1Sa 23:26-28__NBPsa/124/6\');">Psa 124:6-8__NB2Pe/2/9\');">2Pe 2:9__AN__GHWhat_have_2__PSWhat have__EF1Sa/12/3\');">1Sa 12:3__NB1Sa/24/11\');">1Sa 24:11__NR1Sa/24/17\');">17__NBPsa/7/3\');">Psa 7:3-5__NBPsa/18/20\');">Psa 18:20-24__NB2Cr/1/12\');">2Cr 1:12__NB1Jo/3/21\');">1Jo 3:21__EN';
stringArray[2] = 'And he said unto him, __PNGod_forbid_1__SHGod forbid</a>; thou shalt not die: behold, my father will do nothing either great or small, but that he will __PNshew_it_me_2__SHshew it me</a>: and why should my father hide this thing from me? it [is] not [so].__CPGod_forbid_1__PSGod forbid__FF1Sa/14/45\');">1Sa 14:45__NBGen/44/7\');">Gen 44:7__NBJos/22/29\');">Jos 22:29__NBJos/24/16\');">Jos 24:16__NBLuk/20/16\');">Luk 20:16__AN__GHshew_it_me_2__PSshew it me__FEHeb. uncover mine ear. __NA1Sa/20/12\');">1Sa 20:12__NB1Sa/9/15\');">1Sa 9:15__AN; *marg:; __NAPsa/40/6\');">Psa 40:6__NBIsa/50/5\');">Isa 50:5__NBJhn/15/15\');">Jhn 15:15__NBJhn/17/8\');">Jhn 17:8__EN';

stringArray[4] = 'Then said Jonathan unto David, __PNWhatsoever__etc__1__SHWhatsoever</a> thy soul __PNdesireth_2__SHdesireth</a>, I will even do [it] for thee.__CPWhatsoever__etc__1__PSWhatsoever, etc.__EEor, Say what is thy mind, and I will do, etc.__GHdesireth_2__PSdesireth__FEHeb. speaketh, or thinketh.</TD></TR>';
stringArray[5] = 'And David said unto Jonathan, Behold, to morrow [is] __PNthe_new_moon_1__SHthe new moon</a>, and I should not fail to sit with the king at meat: but let me go, __PNthat_I_may_2__SHthat I may</a> hide myself in the field unto the third [day] at even.__CPthe_new_moon_1__PSthe new moon__EEThe months of the Hebrews were lunar months, and they reckoned from one new moon to another: and, as their feasts, particularly the passover, were reckoned according to this, they were very scrupulous in observing the first appearance of each new moon. On these new moons, they offered sacrifices, and feasted together: but the gathering together of all the families of a tribe on such occasions seems to have taken place only once in the year. __NA1Sa/20/6\');">1Sa 20:6__NBNum/10/10\');">Num 10:10__NBNum/28/11\');">Num 28:11__NB2Ki/4/23\');">2Ki 4:23__NBPsa/81/3\');">Psa 81:3__NBCol/2/16\');">Col 2:16__AN__GHthat_I_may_2__PSthat I may__EF1Sa/20/19\');">1Sa 20:19__NB1Sa/19/2\');">1Sa 19:2__NBPsa/55/12\');">Psa 55:12__NBPro/22/3\');">Pro 22:3__NBJhn/8/59\');">Jhn 8:59__NBAct/17/14\');">Act 17:14__EN';
stringArray[6] = 'If thy father at all miss me, then say, David earnestly asked [leave] of me that he might run to __PNBeth_lehem_1__SHBethlehem</a> his city: for [there is] a yearly __PNsacrifice_2__SHsacrifice</a> there for all the family.__CPBeth_lehem_1__PSBeth-lehem__FF1Sa/17/58\');">1Sa 17:58__NBJhn/7/42\');">Jhn 7:42__AN__GHsacrifice_2__PSsacrifice__FEor, feast. __NA1Sa/9/12\');">1Sa 9:12__NB1Sa/16/2\');">1Sa 16:2-5__EN';
stringArray[7] = 'If he say thus, __PNIt_is_well_1__SH[It is] well</a>; thy servant shall have peace: but if he be very wroth, [then] be sure that __PNevil_2__SHevil</a> is determined by him.__CPIt_is_well_1__PSIt is well__FFDeu/1/23\');">Deu 1:23__NB2Sa/17/4\');">2Sa 17:4__AN__GHevil_2__PSevil__EF1Sa/20/9\');">1Sa 20:9__NB1Sa/25/17\');">1Sa 25:17__NBEst/7/7\');">Est 7:7__EN';
stringArray[8] = 'Therefore thou shalt __PNdeal_kindly_1__SHdeal kindly</a> with thy servant; for __PNthou_hast_2__SHthou hast</a> brought thy servant into a covenant of the LORD with thee: notwithstanding, __PNif_there_be_3__SHif there be</a> in me iniquity, slay me thyself; for __PNwhy_shouldest_4__SHwhy shouldest</a> thou bring me to thy father?__CPdeal_kindly_1__PSdeal kindly__FFGen/24/49\');">Gen 24:49__NBGen/47/29\');">Gen 47:29__NBJos/2/14\');">Jos 2:14__NBRth/1/8\');">Rth 1:8__NBPro/3/3\');">Pro 3:3__AN__GHthou_hast_2__PSthou hast__EF1Sa/20/16\');">1Sa 20:16__NB1Sa/18/3\');">1Sa 18:3__NB1Sa/23/18\');">1Sa 23:18__AN__GGif_there_be_3__PSif there be__FFJos/22/22\');">Jos 22:22__NB2Sa/14/32\');">2Sa 14:32__NBPsa/7/4\');">Psa 7:4__NRPsa/7/5\');">5__NBAct/25/11\');">Act 25:11__AN__GHwhy_shouldest_4__PSwhy shouldest__EF1Ch/12/17\');">1Ch 12:17__NBPsa/116/11\');">Psa 116:11__EN';

stringArray[11] = 'And Jonathan said unto David, Come, and let us go out into the field. And they went out both of them into the field.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[12] = 'And Jonathan said unto David, __PNO_LORD_1__SHO LORD</a> God of Israel, when I have __PNsounded_2__SHsounded</a> my father about to morrow any time, [or] the third [day], and, behold, [if there be] good toward David, and I then send not unto thee, and __PNshew_it_thee_3__SHshew it thee</a>;__CPO_LORD_1__PSO LORD__EE"This verse is evidently deficient. The LXX. have [kyrios ho Theos Israel oiden] ""The LORD God of Israel doth know;"" the Syraic and Arabic, ""The LORD God of Israel is witness;"" either of which makes good sense. But two of Dr. Kennicott\'s MSS. supply the word chai, ""liveth;"" and the text reads thus: ""As the LORD God of Israel liveth, when I have sounded my father,--if there be good unto David, and I then send not unto thee,"" etc.; which is a still better sense. __NAJos/22/22\');">Jos 22:22__NBJob/31/4\');">Job 31:4__NBPsa/17/3\');">Psa 17:3__NBPsa/139/1\');">Psa 139:1-4__AN"__GHsounded_2__PSsounded__FEHeb. searched. __NAPro/20/5\');">Pro 20:5__NBPro/25/2\');">Pro 25:2__NRPro/25/3\');">3__AN__GGshew_it_thee_3__PSshew it thee__EEHeb. uncover thine ear. __NA1Sa/20/2\');">1Sa 20:2__EN';

stringArray[14] = 'And thou shalt not only while yet I live shew me __PNthe_kindness_1__SHthe kindness</a> of the LORD, that I die not:__CPthe_kindness_1__PSthe kindness__FF2Sa/9/3\');">2Sa 9:3__NBEph/5/1\');">Eph 5:1__NREph/5/2\');">2__EN';

stringArray[16] = 'So Jonathan __PNmade_1__SHmade</a> [a covenant] with the house of David, [saying], __PNLet_the_LORD_2__SHLet the LORD</a> even require [it] at the hand of David\'s enemies.__CPmade_1__PSmade__EEHeb. cut. __NA1Sa/18/3\');">1Sa 18:3__NBGen/15/18\');">Gen 15:18__AN__GHLet_the_LORD_2__PSLet the LORD__EF1Sa/25/22\');">1Sa 25:22__NB1Sa/31/2\');">1Sa 31:2__NB2Sa/4/7\');">2Sa 4:7__NR2Sa/4/8\');">8__NB2Sa/21/8\');">2Sa 21:8__EN';
stringArray[17] = 'And Jonathan caused David to swear again, __PNbecause_he_loved_him_1__SHbecause he loved him</a>: __PNfor_he_loved_2__SHfor he loved</a> him as he loved his own soul.__CPbecause_he_loved_him_1__PSbecause he loved him__EEor, by his love toward him.__GHfor_he_loved_2__PSfor he loved__EF1Sa/18/1\');">1Sa 18:1__NR1Sa/18/3\');">3__NBDeu/13/6\');">Deu 13:6__NB2Sa/1/26\');">2Sa 1:26__NBPro/18/24\');">Pro 18:24__EN';
stringArray[18] = 'Then Jonathan said to David, To morrow [is] the __PNnew_moon_1__SHnew moon</a>: __PNand_thou_shalt_2__SHand thou shalt</a> be missed, because thy seat will be __PNempty_3__SHempty</a>.__CPnew_moon_1__PSnew moon__EESee on __NA1Sa/20/5\');">1Sa 20:5__AN__GHand_thou_shalt_2__PSand thou shalt__FE"Among the forms of salutation and compliment used in Persia, one was, ""according to my mode of notation in italics, Já i sháma khali bud pish yárán, signifying, Thy place or seat was empty among thy friends. This phrase, or the greater part of it, was frequently addressed to myself when coming into a circle of Persian acquaintances, after an absence of several days or weeks. It reminded me of a passage in the First book of Samuel, (__NA1Sa/20/18\');">1Sa 20:18__AN.) And thou shalt be missed, because thy seat will be empty. And again, David\'s place was empty."" Sir W. Ouseley\'s Travels, vol i. preface, p.16."__GGempty_3__PSempty__EEHeb. missed.</TD></TR>';
stringArray[19] = 'And [when] thou hast stayed three days, [then] thou shalt go down __PNquickly_1__SHquickly</a>, and come to the place where thou didst __PNhide_thyself_2__SHhide thyself</a> __PNwhen_the_business_3__SHwhen the business</a> was [in hand], and shalt remain by the stone __PNEzel_4__SHEzel</a>.__CPquickly_1__PSquickly__EEor, diligently. Heb. greatly.__GHhide_thyself_2__PShide thyself__EF1Sa/20/5\');">1Sa 20:5__NB1Sa/19/2\');">1Sa 19:2__AN__GGwhen_the_business_3__PSwhen the business__EEHeb. in the day of the business.__GHEzel_4__PSEzel__FEor, that sheweth the way.</TD></TR>';
stringArray[20] = 'And I will shoot three arrows on the side [thereof], as though I shot at a mark.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[21] = 'And, behold, I will send a lad, [saying], Go, find out the arrows. If I expressly say unto the lad, Behold, the arrows [are] on this side of thee, take them; then come thou: for [there is] peace to thee, and __PNno_1__SHno</a> hurt; __PNas_the_2__SH[as] the</a> LORD liveth.__CPno_1__PSno__EEHeb. not any thing.__GHas_the_2__PSas the__EFJer/4/2\');">Jer 4:2__NBJer/5/2\');">Jer 5:2__NBJer/12/16\');">Jer 12:16__NBAmo/8/14\');">Amo 8:14__EN';

stringArray[23] = 'And [as touching] __PNthe_matter_1__SHthe matter</a> which thou and I have spoken of, behold, __PNthe_LORD_2__SHthe LORD</a> [be] between thee and me for ever.__CPthe_matter_1__PSthe matter__FF1Sa/20/14\');">1Sa 20:14__NR1Sa/20/15\');">15__AN__GHthe_LORD_2__PSthe LORD__EF1Sa/20/42\');">1Sa 20:42__NBGen/16/5\');">Gen 16:5__NBGen/31/50\');">Gen 31:50__EN';
stringArray[24] = 'So David hid himself in the field: and when the new moon was come, __PNthe_king_1__SHthe king</a> sat him down to eat meat.__CPthe_king_1__PSthe king__FFPsa/50/16\');">Psa 50:16-21__NBPro/4/17\');">Pro 4:17__NBPro/15/17\');">Pro 15:17__NBPro/17/1\');">Pro 17:1__NBPro/21/3\');">Pro 21:3__NRPro/21/27\');">27__NBIsa/1/11\');">Isa 1:11-15__NBZec/7/6\');">Zec 7:6__NBJhn/18/28\');">Jhn 18:28__EN';

stringArray[26] = 'Nevertheless Saul spake not any thing that day: for he thought, Something hath befallen him, __PNhe_is_not_clean_1__SHhe [is] not clean</a>; surely he [is] not clean.__CPhe_is_not_clean_1__PShe is not clean__FFLev/7/21\');">Lev 7:21__NBLev/11/24\');">Lev 11:24__NRLev/11/27\');">27__NRLev/11/31\');">31__NRLev/11/40\');">40__NBLev/15/5\');">Lev 15:5__NRLev/15/16\');">16__NRLev/15/17\');">17__NRLev/15/19\');">19-21__NBNum/19/16\');">Num 19:16__EN';
stringArray[27] = 'And it came to pass on the morrow, [which was] the second [day] of the month, that David\'s place was empty: and Saul said unto Jonathan his son, __PNWherefore_1__SHWherefore</a> cometh not __PNthe_son_2__SHthe son</a> of Jesse to meat, neither yesterday, nor to day?__CPWherefore_1__PSWherefore__FF1Sa/18/11\');">1Sa 18:11__NB1Sa/19/9\');">1Sa 19:9__NR1Sa/19/10\');">10__NR1Sa/19/15\');">15__AN__GHthe_son_2__PSthe son__EF1Sa/22/7\');">1Sa 22:7-9__NR1Sa/22/13\');">13__NR1Sa/22/14\');">14__NB1Sa/25/10\');">1Sa 25:10__NBIsa/11/1\');">Isa 11:1__NRIsa/11/2\');">2__NBMat/13/55\');">Mat 13:55__NB1Pe/2/4\');">1Pe 2:4__EN';
stringArray[28] = 'And Jonathan answered Saul, David earnestly asked [leave] of me [to go] to Bethlehem:__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[29] = 'And he said, Let me go, I pray thee; for our family hath a sacrifice in the city; and __PNmy_brother_1__SHmy brother</a>, he hath commanded me [to be there]: and now, if I have found favour in thine eyes, let me get away, I pray thee, and see my brethren. Therefore he cometh not unto the king\'s table.__CPmy_brother_1__PSmy brother__FF1Sa/17/28\');">1Sa 17:28__EN';
stringArray[30] = 'Then __PNSaul_s_1__SHSaul\'s</a> anger was kindled against Jonathan, and he said unto him, __PNThou__etc__2__SHThou</a> son of the perverse rebellious [woman], do not I know that thou hast chosen the son of Jesse to thine own confusion, __PNand_unto_the_3__SHand unto the</a> confusion of thy mother\'s nakedness?__CPSaul_s_1__PSSaul\'s__FFJob/5/2\');">Job 5:2__NBPro/14/29\');">Pro 14:29__NBPro/19/12\');">Pro 19:12__NRPro/19/19\');">19__NBPro/21/24\');">Pro 21:24__NBPro/25/28\');">Pro 25:28__NBPro/27/3\');">Pro 27:3__NBJam/1/19\');">Jam 1:19__NRJam/1/20\');">20__AN__GHThou__etc__2__PSThou, etc.__FEor, Thou perverse rebel. Heb. Son of perverse rebellion. __NAPro/15/2\');">Pro 15:2__NBPro/21/24\');">Pro 21:24__NBMat/5/22\');">Mat 5:22__NBEph/4/31\');">Eph 4:31__NBEph/6/4\');">Eph 6:4__AN__GGand_unto_the_3__PSand unto the__EE"This reflection on the mother of Jonathan, by the passionate monarch, reflects more dishonour on himself than on his brave and noble minded son. Mungo Park gives an instance of the prevalence of the same principles in Africa; for he says, ""Maternal affection is every where conspicuous among the Africans, and creates a correspondent return of tenderness in the child. \'Strike me,\' said my attendant, \'but do not curse my mother.\' I found the same sentiment to prevail universally in all parts of Africa."" King Saul, unable to villify Jonathan to his own satisfaction by personal reproaches, outstepped the ordinary abuse of his day, and proceeded to that which was designed to produce unusual vexation, and vented the bitterness of his mind by maligning the character of his own wife and Jonathan\'s mother."</TD></TR>';
stringArray[31] = 'For as long as the son of Jesse liveth upon the ground, thou shalt not be established, nor thy kingdom. Wherefore now __PNsend_1__SHsend</a> and fetch him unto me, for he __PNshall_surely_die_2__SHshall surely die</a>.__CPsend_1__PSsend__FF1Sa/20/8\');">1Sa 20:8__NB1Sa/19/6\');">1Sa 19:6__NR1Sa/19/11\');">11-15__AN__GHshall_surely_die_2__PSshall surely die__FEHeb. is the son of death. __NA1Sa/26/16\');">1Sa 26:16__NB2Sa/19/28\');">2Sa 19:28__NBPsa/79/11\');">Psa 79:11__AN; *marg:</TD></TR>';

stringArray[42] = 'And Jonathan said to David, __PNGo_in_peace_1__SHGo in peace</a>, __PNforasmuch_as_2__SHforasmuch as</a> we have sworn both of us in the name of the LORD, saying, The LORD be between me and thee, and between my seed and thy seed for ever. __PNAnd_he_arose_3__SHAnd he arose</a> and departed: and Jonathan went into the city.__CPGo_in_peace_1__PSGo in peace__FF1Sa/20/22\');">1Sa 20:22__NB1Sa/1/17\');">1Sa 1:17__NBNum/6/26\');">Num 6:26__NBLuk/7/50\');">Luk 7:50__NBAct/16/36\');">Act 16:36__AN__GHforasmuch_as_2__PSforasmuch as__FEor, the LORD be witness of that which, etc. __NA1Sa/20/23\');">1Sa 20:23__AN__GGAnd_he_arose_3__PSAnd he arose__EE"__NA1Sa/23/18\');">1Sa 23:18__AN; The separation of two such faithful friends was equally grievous to them both, but David\'s case was the more deplorable: for when Jonathan was returning to his family and friends, David was leaving all his comforts, even those of God\'s sanctuary, and therefore his grief exceeded Jonathan\'s; or, perhaps it was because his temper was more tender and his passions stronger. They referred each other to the covenant of friendship that was between them, both of them being comforted thereby in this very mournful separation:--""We have sworn both of us in the name of the LORD, for ourselves and our heirs, that we and they will be faithful and kind to each other from generation to generation."""</TD></TR>';
