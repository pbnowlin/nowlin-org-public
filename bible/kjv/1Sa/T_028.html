stringArray[7] = 'Then said Saul unto his servants, __PNSeek_me_1__SHSeek me</a> a woman that hath __PNa_familiar_spirit_2__SHa familiar spirit</a>, __PNthat_I_may_3__SHthat I may</a> go to her, and enquire of her. And his servants said to him, Behold, [there is] a woman that hath a familiar spirit at __PNEn_dor_4__SHEndor</a>.__CPSeek_me_1__PSSeek me__FF2Ki/1/2\');">2Ki 1:2__NR2Ki/1/3\');">3__NB2Ki/6/33\');">2Ki 6:33__NBIsa/8/19\');">Isa 8:19__NRIsa/8/20\');">20__NBLam/3/25\');">Lam 3:25__NRLam/3/26\');">26__NBHab/2/3\');">Hab 2:3__AN__GHa_familiar_spirit_2__PSa familiar spirit__EF1Sa/28/3\');">1Sa 28:3__NBDeu/18/11\');">Deu 18:11__NBIsa/19/3\');">Isa 19:3__NBAct/16/16\');">Act 16:16__AN__GGthat_I_may_3__PSthat I may__FFLev/19/31\');">Lev 19:31__NB1Ch/10/13\');">1Ch 10:13__NBIsa/8/19\');">Isa 8:19__AN__GHEn_dor_4__PSEn-dor__FEEn-dor, a city of Manasseh, was situated in the plain of Jezreel; and Eusebius and Jerome inform us, that it was a great town in their days, four miles south from Mount Tabor, near Nain, towards Scythopolis. This agrees with Maundrell, who says, that not many miles eastward of Tabor, you see mount Hermon, at the foot of which is seated Nain and Endor; and Burckhardt says, that in two hours and a half from Nazareth, towards Scythopolis or Bisan, they came to the village of Denouny, near which are the ruins of Endor; where the witch\'s grotto is shewn. __NAJos/17/11\');">Jos 17:11__NBPsa/83/10\');">Psa 83:10__EN';

stringArray[15] = 'And Samuel said to Saul, __PNWhy_hast_1__SHWhy hast</a> thou disquieted me, to bring me up? And Saul answered, __PNI_am_sore_2__SHI am sore</a> distressed; for __PNthe_Philistines_3__SHthe Philistines</a> make war against me, and __PNGod_4__SHGod</a> is departed from me, and __PNanswereth_5__SHanswereth</a> me no more, neither by __PNprophets_6__SHprophets</a>, nor by dreams: __PNtherefore_7__SHtherefore</a> I have called thee, that thou mayest make known unto me what I shall do.__CPWhy_hast_1__PSWhy hast__FF1Sa/28/8\');">1Sa 28:8__NR1Sa/28/11\');">11__AN__GHI_am_sore_2__PSI am sore__EFPro/5/11\');">Pro 5:11-13__NBPro/14/14\');">Pro 14:14__NBJer/2/17\');">Jer 2:17__NRJer/2/18\');">18__AN__GGthe_Philistines_3__PSthe Philistines__FF1Sa/28/4\');">1Sa 28:4__AN__GHGod_4__PSGod__EF1Sa/16/13\');">1Sa 16:13__NR1Sa/16/14\');">14__NB1Sa/18/12\');">1Sa 18:12__NBJdg/16/20\');">Jdg 16:20__NBPsa/51/11\');">Psa 51:11__NBHsa/9/12\');">Hsa 9:12__NBMat/25/41\');">Mat 25:41__AN__GGanswereth_5__PSanswereth__FF1Sa/28/6\');">1Sa 28:6__NB1Sa/23/2\');">1Sa 23:2__NR1Sa/23/4\');">4__NR1Sa/23/9\');">9__NR1Sa/23/10\');">10__AN__GHprophets_6__PSprophets__FEHeb. the hand of prophets.__GGtherefore_7__PStherefore__FFLuk/16/23\');">Luk 16:23-26__EN';
stringArray[16] = 'Then said Samuel, __PNWherefore_1__SHWherefore</a> then dost thou ask of me, seeing the LORD is departed from thee, __PNand_is_become_2__SHand is become</a> thine enemy?__CPWherefore_1__PSWherefore__FFJdg/5/31\');">Jdg 5:31__NB2Ki/6/27\');">2Ki 6:27__NBPsa/68/1\');">Psa 68:1-3__NBRev/18/20\');">Rev 18:20__NRRev/18/24\');">24__NBRev/19/1\');">Rev 19:1-6__AN__GHand_is_become_2__PSand is become__EFLam/2/5\');">Lam 2:5__EN';
stringArray[17] = 'And the LORD hath done __PNto_him_1__SHto him</a>, __PNas_he_spake_2__SHas he spake</a> by __PNme_3__SHme</a>: for the LORD hath rent the kingdom out of thine hand, and given it to thy neighbour, [even] to David:__CPto_him_1__PSto him__EE"or, for himself. The LXX. read [soi] and the Vulgate tibi, to thee; which is the reading of five of Dr. Kennicott\'s and De Rossi\'s MSS., as well as both the Bibles printed at Venice in 1518, where we read lecha, ""to thee,"" for lo, ""to him;"" and as the words are spoken to Saul, this seems to be evidently the correct reading. __NAPro/16/4\');">Pro 16:4__AN"__GHas_he_spake_2__PSas he spake__EF1Sa/13/13\');">1Sa 13:13__NR1Sa/13/14\');">14__NB1Sa/15/27\');">1Sa 15:27-29__AN__GGme_3__PSme__EEHeb. mine hand. thy neighbour. __NA1Sa/15/28\');">1Sa 15:28__NB1Sa/16/13\');">1Sa 16:13__NB1Sa/24/20\');">1Sa 24:20__EN';
stringArray[18] = 'Because thou __PNobeyedst_1__SHobeyedst</a> not the voice of the LORD, nor executedst his fierce wrath upon Amalek, therefore __PNhath_the_LORD_2__SHhath the LORD</a> done this thing unto thee this day.__CPobeyedst_1__PSobeyedst__FF1Sa/13/9\');">1Sa 13:9__NB1Sa/15/9\');">1Sa 15:9__NR1Sa/15/23\');">23-26__NB1Ki/20/42\');">1Ki 20:42__NB1Ch/10/13\');">1Ch 10:13__NBJer/48/10\');">Jer 48:10__AN__GHhath_the_LORD_2__PShath the LORD__EFPsa/50/21\');">Psa 50:21__NRPsa/50/22\');">22__EN';
stringArray[19] = 'Moreover __PNthe_LORD_1__SHthe LORD</a> will also deliver Israel with thee into the hand of the Philistines: __PNand_to_morrow_2__SHand to morrow</a> [shalt] thou and thy sons [be] with me: the LORD also shall deliver the host of Israel into the hand of the Philistines.__CPthe_LORD_1__PSthe LORD__FF1Sa/12/25\');">1Sa 12:25__NB1Sa/31/1\');">1Sa 31:1-6__NB1Ki/22/20\');">1Ki 22:20__NR1Ki/22/28\');">28__AN__GHand_to_morrow_2__PSand to morrow__FEThere is considerable diversity of opinion, both among learned and pious men, relative to this appearance to Saul. But the most probable opinion seems to be, that Samuel himself did actually appear to Saul, not by the power of enchantment, but by the appointment and especial mercy of God, to warn this infatuated monarch of his approaching end, that he might be reconciled with his Maker. There is not the smallest intimation of chicanery or Satanic influence given in the text; but on the contrary, from the plain and obvious meaning of the language employed, it is perfectly evident that it was Samuel himself, Shemooel hoo, as it is expressed in __NA1Sa/28/14\');">1Sa 28:14__AN. Indeed the very soul of Samuel seems to breathe in his expressions of displeasure against the disobedience and wickedness of Saul; while the awful prophetic denunciations which accordingly came to pass, were such as neither human nor diabolical wisdom could foresee, and which could only be known to God himself, and to those to whom he chose to reveal them. Exd </TD></TR>';
