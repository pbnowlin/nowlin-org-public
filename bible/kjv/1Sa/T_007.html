stringArray[6] = 'And they gathered together to Mizpeh, and __PNdrew_water_1__SHdrew water</a>, and poured [it] out before the LORD, and __PNfasted_2__SHfasted</a> on that day, and said there, __PNWe_have_sinned_3__SHWe have sinned</a> against the LORD. And Samuel __PNjudged_4__SHjudged</a> the children of Israel in Mizpeh.__CPdrew_water_1__PSdrew water__EE"Grotius says, that the pouring out of water means the shedding of tears; and the Targum reads, ""And they poured out their hearts in penitence, as waters, before the LORD."" Others suppose that it was done emblematically, to represent the contrition of their hearts, and their desire to wash away their past offences. But some learned men conceive that it was poured out as a libation, in token of joy, after they had fasted and confessed their sin, as they were wont to do in the feast of tabernacles. (See note on __NANum/29/35\');">Num 29:35__AN.) __NA1Sa/1/15\');">1Sa 1:15__NB2Sa/14/14\');">2Sa 14:14__NBJob/16/20\');">Job 16:20__NBPsa/6/6\');">Psa 6:6__NBPsa/42/3\');">Psa 42:3__NBPsa/119/136\');">Psa 119:136__NBJer/9/1\');">Jer 9:1__NBLam/2/11\');">Lam 2:11__NRLam/2/18\');">18__NBLam/3/49\');">Lam 3:49__AN"__GHfasted_2__PSfasted__EF2Ch/20/3\');">2Ch 20:3__NBEzr/8/21\');">Ezr 8:21-23__NBNeh/9/1\');">Neh 9:1-3__NBDan/9/3\');">Dan 9:3-5__NBJoe/2/12\');">Joe 2:12__NBJon/3/1\');">Jon 3:1-10__AN__GGWe_have_sinned_3__PSWe have sinned__FFLev/26/40\');">Lev 26:40__NBJdg/10/10\');">Jdg 10:10__NB1Ki/8/47\');">1Ki 8:47__NBEzr/9/5\');">Ezr 9:5-10__NBJob/33/27\');">Job 33:27__NBJob/40/4\');">Job 40:4__NBJob/42/6\');">Job 42:6__NBPsa/38/3\');">Psa 38:3-8__NBPsa/106/6\');">Psa 106:6__NBJer/3/13\');">Jer 3:13__NRJer/3/14\');">14__NBJer/31/19\');">Jer 31:19__NBLuk/15/18\');">Luk 15:18__AN__GHjudged_4__PSjudged__EFJdg/3/10\');">Jdg 3:10__NBNeh/9/27\');">Neh 9:27__NBEze/20/4\');">Eze 20:4__EN';
