stringArray[12] = 'And when Samuel rose early to meet Saul in the morning, it was told Samuel, saying, Saul came to __PNCarmel_1__SHCarmel</a>, and, behold, __PNhe_set_him_2__SHhe set him</a> up __PNa_place_3__SHa place</a>, and is gone about, and passed on, and gone down to Gilgal.__CPCarmel_1__PSCarmel__FF1Sa/25/2\');">1Sa 25:2__NBJos/15/55\');">Jos 15:55__NB1Ki/18/42\');">1Ki 18:42__AN__GHhe_set_him_2__PShe set him__EF1Sa/7/12\');">1Sa 7:12__NBJos/4/8\');">Jos 4:8__NRJos/4/9\');">9__NB2Sa/18/18\');">2Sa 18:18__AN__GGa_place_3__PSa place__EE"Yad. Literally as the LXX. render [cheira] a hand; probably because the trophy or monument of victory was in the shape of a large hand, the emblem of power, erected on a pillar. These memorial pillars were anciently much in use; and the figure of a hand, by its emblematical meaning, was well adapted to preserve the remembrance of a victory. Niebuhr, speaking of the Mesjed Ali, or Mosque of Ali, says that, ""at the top of the dome, where one generally sees on the Turkish mosques a crescent, or only a pole, there is here a hand stretched out, to represent that of Ali."" Another writer informs us, that at the Alhamra, or red palace of the Moorish kings in Grenada, ""on the key-stone of the outward arch [of the present principal entrance] is sculptured the figure of an arm, the symbol of strength and dominion."""</TD></TR>';
