stringArray[2] = 'And Samuel said, __PNHow_can_I_go_1__SHHow can I go</a>? if Saul hear [it], he will kill me. And the LORD said, __PNTake_an_heifer_2__SHTake an heifer</a> __PNwith_thee_3__SHwith thee</a>, and say, __PNI_am_come_4__SHI am come</a> to sacrifice to the LORD.__CPHow_can_I_go_1__PSHow can I go__FFExd/3/11\');">Exd 3:11__NB1Ki/18/9\');">1Ki 18:9-14__NBMat/10/16\');">Mat 10:16__NBLuk/1/34\');">Luk 1:34__AN__GHTake_an_heifer_2__PSTake an heifer__FEFor the prudent management of the affair, and to avoid suspicion, Samuel was directed to go to Bethlehem to sacrifice, as he probably did from time to time in many different places; and the answer which he was instructed to return was strictly true though he did not tell the principal design of his coming; for though no man in any circumstances should tell a lie, yet, in all circumstances, he is not bound to tell the whole truth, though he must tell nothing but the truth, and so tell that truth that the hearer shall not believe a lie by it.__GGwith_thee_3__PSwith thee__EEHeb. in thine hand. __NA1Sa/9/12\');">1Sa 9:12__AN__GHI_am_come_4__PSI am come__EF1Sa/9/12\');">1Sa 9:12__NB1Sa/20/29\');">1Sa 20:29__NBJer/38/26\');">Jer 38:26__NRJer/38/27\');">27__EN';

stringArray[7] = 'But the LORD said unto Samuel, __PNLook_not_1__SHLook not</a> on his countenance, or on the height of his stature; because I have refused him: for [the LORD __PNseeth_not_2__SHseeth] not</a> as man seeth; for man __PNlooketh_3__SHlooketh</a> on the __PNoutward_appearance_4__SHoutward appearance</a>, but the LORD looketh __PNon_the_heart_5__SHon the heart</a>.__CPLook_not_1__PSLook not__FF1Sa/9/2\');">1Sa 9:2__NB1Sa/10/23\');">1Sa 10:23__NR1Sa/10/24\');">24__NB2Sa/14/25\');">2Sa 14:25__NBPsa/147/10\');">Psa 147:10__NRPsa/147/11\');">11__NBPro/31/30\');">Pro 31:30__AN__GHseeth_not_2__PSseeth not__EFJob/10/4\');">Job 10:4__NBIsa/55/8\');">Isa 55:8__NRIsa/55/9\');">9__NBLuk/16/15\');">Luk 16:15__NB1Pe/2/4\');">1Pe 2:4__NB1Pe/3/4\');">1Pe 3:4__AN__GGlooketh_3__PSlooketh__FFJhn/7/24\');">Jhn 7:24__NB2Cr/10/7\');">2Cr 10:7__NR2Cr/10/10\');">10__AN__GHoutward_appearance_4__PSoutward appearance__FEHeb. eyes.__GGon_the_heart_5__PSon the heart__FF1Ki/8/39\');">1Ki 8:39__NB1Ch/28/9\');">1Ch 28:9__NB2Ch/16/9\');">2Ch 16:9__NBPsa/7/9\');">Psa 7:9__NBPsa/139/2\');">Psa 139:2__NBPro/15/11\');">Pro 15:11__NBPro/16/2\');">Pro 16:2__NBJer/11/20\');">Jer 11:20__NBJer/17/10\');">Jer 17:10__NBJer/20/12\');">Jer 20:12__NBAct/1/24\');">Act 1:24__NBHbr/4/13\');">Hbr 4:13__NBRev/2/23\');">Rev 2:23__EN';

stringArray[11] = 'And Samuel said unto Jesse, Are here all [thy] children? And he said, __PNThere_remaineth_1__SHThere remaineth</a> yet the youngest, and, behold, he keepeth the sheep. And Samuel said unto Jesse, Send and fetch him: for we will not sit __PNdown_2__SHdown</a> till he come hither.__CPThere_remaineth_1__PSThere remaineth__FF1Sa/17/12\');">1Sa 17:12-15__NR1Sa/17/28\');">28__NB2Sa/7/8\');">2Sa 7:8__NB1Ch/17/7\');">1Ch 17:7__NBPsa/78/70\');">Psa 78:70__NRPsa/78/71\');">71__AN__GHdown_2__PSdown__FEHeb. round.</TD></TR>';
stringArray[12] = 'And he sent, and brought him in. Now he [was] __PNruddy_1__SHruddy</a>, [and] withal __PNof_a_beautiful_countenance_2__SHof a beautiful countenance</a>, and goodly to look to. __PNAnd_the_LORD_3__SHAnd the LORD</a> said, Arise, __PNanoint_him_4__SHanoint him</a>: for this [is] he.__CPruddy_1__PSruddy__FF1Sa/17/42\');">1Sa 17:42__NBSgs/5/10\');">Sgs 5:10__NBLam/4/7\');">Lam 4:7__NBAct/7/20\');">Act 7:20__NBHbr/11/23\');">Hbr 11:23__AN__GHof_a_beautiful_countenance_2__PSof a beautiful countenance__FEHeb. fair of eyes. __NA1Sa/16/7\');">1Sa 16:7__AN__GGAnd_the_LORD_3__PSAnd the LORD__FF1Sa/9/17\');">1Sa 9:17__AN__GHanoint_him_4__PSanoint him__EFPsa/2/2\');">Psa 2:2__NRPsa/2/6\');">6__NBPsa/89/19\');">Psa 89:19__NRPsa/89/20\');">20__NBAct/4/27\');">Act 4:27__EN';
stringArray[13] = 'Then Samuel took the horn of oil, and __PNanointed_1__SHanointed</a> him in the midst of his brethren: and __PNthe_Spirit_2__SHthe Spirit</a> of the LORD came upon David from that day forward. So Samuel rose up, and went to Ramah.__CPanointed_1__PSanointed__FF1Sa/10/1\');">1Sa 10:1__NB2Ki/9/6\');">2Ki 9:6__AN__GHthe_Spirit_2__PSthe Spirit__EF1Sa/16/18\');">1Sa 16:18__NB1Sa/10/6\');">1Sa 10:6__NR1Sa/10/9\');">9__NR1Sa/10/10\');">10__NBNum/11/17\');">Num 11:17__NBNum/27/18\');">Num 27:18__NBJdg/3/10\');">Jdg 3:10__NBJdg/11/29\');">Jdg 11:29__NBJdg/13/25\');">Jdg 13:25__NBJdg/14/6\');">Jdg 14:6__NBIsa/11/1\');">Isa 11:1-3__NBJhn/3/34\');">Jhn 3:34__NBHbr/1/9\');">Hbr 1:9__EN';
stringArray[14] = 'But __PNthe_Spirit_1__SHthe Spirit</a> of the LORD departed from Saul, and an __PNevil_spirit_2__SHevil spirit</a> from the LORD __PNtroubled_3__SHtroubled</a> him.__CPthe_Spirit_1__PSthe Spirit__FF1Sa/11/6\');">1Sa 11:6__NB1Sa/18/12\');">1Sa 18:12__NB1Sa/28/15\');">1Sa 28:15__NBJdg/16/29\');">Jdg 16:29__NBPsa/51/11\');">Psa 51:11__NBHsa/9/12\');">Hsa 9:12__AN__GHevil_spirit_2__PSevil spirit__FEThe evil spirit was either sent immediately from the LORD, or permitted to come; but whether this was a diabolic possession, or a mere mental malady, is not agreed: it seems to have partaken of both. That Saul had fallen into a deep melancholy, there is little doubt; and that an evil spirit might work more effectually on such a state of mind, there can be little question. His malady appears to have been of a mixed kind, natural and diabolical: there is too much of apparent nature in it to permit us to believe it was all spiritual; and there is too much of apparently supernatural influence, to suffer us to believe it was all natural. __NA1Sa/18/10\');">1Sa 18:10__NB1Sa/19/9\');">1Sa 19:9__NR1Sa/19/10\');">10__NBJdg/9/23\');">Jdg 9:23__NB1Ki/22/22\');">1Ki 22:22__NBAct/19/15\');">Act 19:15__NRAct/19/16\');">16__AN__GGtroubled_3__PStroubled__EEor, terrified.</TD></TR>';
