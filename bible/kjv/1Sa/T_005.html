var stringArray = new Array();
stringArray[1] = 'And the Philistines __PNtook_1__SHtook</a> the ark of God, and brought it from __PNEben_ezer_2__SHEbenezer</a> unto __PNAshdod_3__SHAshdod</a>.__CPtook_1__PStook__FF1Sa/4/11\');">1Sa 4:11__NR1Sa/4/17\');">17__NR1Sa/4/18\');">18__NR1Sa/4/22\');">22__NBPsa/78/61\');">Psa 78:61__AN__GHEben_ezer_2__PSEben-ezer__EF1Sa/4/1\');">1Sa 4:1__NB1Sa/7/12\');">1Sa 7:12__AN__GGAshdod_3__PSAshdod__EE"Ashdod, called Azotus by the Greeks, was one of the five satrapies of the Philistines, and a place of great strength and consequence. It was situated near the Mediterranean, between Askelon and Jamnia, thirty-four miles north of Gaza, according to Diodorus Siculus, and the Antonine and Jerusalem Itineraries. It is now called Shdood; and Dr. Richardson says they neither saw nor heard of any ruins there. ""The ground,"" he observes, ""around Ashdod is beautifully undulating, but not half stocked with cattle. The site of the town is on the summit of a grassy hill; and, if we are to believe historians, was anciently as strong as it was beautiful."" __NAJos/11/22\');">Jos 11:22__NBAct/8/40\');">Act 8:40__AN; Azotus."</TD></TR>';
stringArray[2] = 'When the Philistines took the ark of God, they brought it into the house __PNof_Dagon_1__SHof Dagon</a>, and set it by Dagon.__CPof_Dagon_1__PSof Dagon__FFJdg/16/23\');">Jdg 16:23__NB1Ch/10/10\');">1Ch 10:10__NBDan/5/2\');">Dan 5:2__NRDan/5/23\');">23__NBHab/1/11\');">Hab 1:11__NRHab/1/16\');">16__EN';
stringArray[3] = 'And when they of Ashdod arose early on the morrow, behold, __PNDagon_was_1__SHDagon [was]</a> fallen upon his face to the earth before the ark of the LORD. And they took Dagon, and __PNset_him_2__SHset him</a> in his place again.__CPDagon_was_1__PSDagon was__FFExd/12/12\');">Exd 12:12__NBPsa/97/7\');">Psa 97:7__NBIsa/19/1\');">Isa 19:1__NBIsa/46/1\');">Isa 46:1__NRIsa/46/2\');">2__NBZep/2/11\');">Zep 2:11__NBMar/3/11\');">Mar 3:11__NBLuk/10/18\');">Luk 10:18-20__NB2Cr/6/14\');">2Cr 6:14-16__AN__GHset_him_2__PSset him__EFIsa/19/1\');">Isa 19:1__NBIsa/40/20\');">Isa 40:20__NBIsa/41/7\');">Isa 41:7__NBIsa/44/17\');">Isa 44:17-20__NBIsa/46/1\');">Isa 46:1__NRIsa/46/2\');">2__NRIsa/46/7\');">7__NBJer/10/8\');">Jer 10:8__EN';
stringArray[4] = 'And when they arose early on the morrow morning, behold, Dagon [was] fallen upon his face to the ground before the ark of the LORD; and __PNthe_head_1__SHthe head</a> __PNof_Dagon_2__SHof Dagon</a> and both the palms of his hands [were] cut off upon the threshold; only [__PNthe_stump_3__SHthe stump</a> of] Dagon was left to him.__CPthe_head_1__PSthe head__FFIsa/2/18\');">Isa 2:18__NRIsa/2/19\');">19__NBIsa/27/9\');">Isa 27:9__NBJer/10/11\');">Jer 10:11__NBJer/50/2\');">Jer 50:2__NBEze/6/4\');">Eze 6:4-6__NBDan/11/8\');">Dan 11:8__NBMic/1/7\');">Mic 1:7__AN__GHof_Dagon_2__PSof Dagon__FE"The name of this idol, Dagon, signifies a fish: and it is supposed to be the Atergatis of the Syrians, corruptly called Derceto by the Greeks, which had the upper part like a woman, and the lower part like a fish; as Lucian informs us: [Derketous de eidos en Phoinike etheésamén, theéma xenon; émisen men gyné; to de okoson ek mérón es akrous podas, ichtlyos ouré apoteinetai;] ""In Phoenicia I saw the image of Derceto; a strange sight truly! For she had the half of a woman, but from the thighs downward a fish\'s tail."" Diodorus, (1. ii.) describing the same idol, as represented at Askelon, says, [to men prosópon echei synaikos, to d\'allo sóma pan ichthyos.] ""It had the head of a woman, but all the rest of the body a fish\'s."" Probably Horace alludes to this idol, in De Art. Poet. v. 4; Desinat in piscem, mulier formosa superne: ""The upper part a handsome woman, and the lower part a fish."" If such was the form of this idol, then everything that was human was broken off from what resembled a fish."__GGthe_stump_3__PSthe stump__EEor, the fishy part.</TD></TR>';
stringArray[5] = 'Therefore __PNneither_1__SHneither</a> the priests of Dagon, nor any that come into Dagon\'s house, __PNtread_2__SHtread</a> on the threshold of Dagon in Ashdod unto this day.__CPneither_1__PSneither__FFPsa/115/4\');">Psa 115:4-7__NBPsa/135/15\');">Psa 135:15-18__AN__GHtread_2__PStread__EFJos/5/15\');">Jos 5:15__NBZep/1/9\');">Zep 1:9__EN';
stringArray[6] = 'But __PNthe_hand_1__SHthe hand</a> of the LORD was heavy upon them of Ashdod, and he destroyed them, and smote them with __PNemerods_2__SHemerods</a>, [even] Ashdod and the coasts __PNthereof_3__SHthereof</a>.__CPthe_hand_1__PSthe hand__FF1Sa/5/7\');">1Sa 5:7__NR1Sa/5/11\');">11__NBExd/9/3\');">Exd 9:3__NBPsa/32/4\');">Psa 32:4__NBAct/13/11\');">Act 13:11__AN__GHemerods_2__PSemerods__EF1Sa/5/9\');">1Sa 5:9__NR1Sa/5/11\');">11__NB1Sa/6/5\');">1Sa 6:5__NBDeu/28/27\');">Deu 28:27__NBJob/31/3\');">Job 31:3__NBPsa/78/66\');">Psa 78:66__AN__GGthereof_3__PSthereof__EE"The LXX. and Vulgate add: [Kai meson tés choras autés anephyésan myes kai egeneto synchysis thanatou megalé en té polei; Et ebullierunt villæ et agri in medio regionis illius, et nati sunt mures; et facta est confusio mortis magnæ in civitate; ""And [the cities and fields in Vulg.] the midst of that region produced mice; [Vulg. burst up, and mice were produced;] and there was the confusion of a great death in the city."" __NA1Sa/6/4\');">1Sa 6:4__NR1Sa/6/5\');">5__AN"</TD></TR>';
stringArray[7] = 'And when the men of Ashdod __PNsaw_1__SHsaw</a> that [it was] so, they said, __PNThe_ark_2__SHThe ark</a> of the God of Israel shall not abide with us: for his hand is sore upon us, and __PNupon_Dagon_our_god_3__SHupon Dagon our god</a>.__CPsaw_1__PSsaw__FF1Sa/4/8\');">1Sa 4:8__NBExd/8/8\');">Exd 8:8__NRExd/8/28\');">28__NBExd/9/28\');">Exd 9:28__NBExd/10/7\');">Exd 10:7__NBExd/12/33\');">Exd 12:33__AN__GHThe_ark_2__PSThe ark__EF1Sa/6/20\');">1Sa 6:20__NB2Sa/6/9\');">2Sa 6:9__NB1Ch/13/11\');">1Ch 13:11-13__NB1Ch/15/13\');">1Ch 15:13__AN__GGupon_Dagon_our_god_3__PSupon Dagon our god__FF1Sa/5/3\');">1Sa 5:3__NR1Sa/5/4\');">4__NBJer/46/25\');">Jer 46:25__NBJer/48/7\');">Jer 48:7__EN';
stringArray[8] = 'They sent therefore and gathered all the lords of the Philistines unto them, and said, __PNWhat_shall_1__SHWhat shall</a> we do with the ark of the God of Israel? And they answered, Let the ark of the God of Israel be carried about unto __PNGath_2__SHGath</a>. And they carried the ark of the God of Israel about [thither].__CPWhat_shall_1__PSWhat shall__FFZec/12/3\');">Zec 12:3__AN__GHGath_2__PSGath__EF1Sa/17/4\');">1Sa 17:4__NBAmo/6/2\');">Amo 6:2__EN';

stringArray[10] = 'Therefore they sent the ark of __PNGod_to_Ekron_1__SHGod to Ekron</a>. And it came to pass, as the ark of God came to Ekron, that the Ekronites cried out, saying, They have brought about the ark of the God of Israel to __PNus__to_slay_us_and_our_people_2__SHus, to slay us and our people</a>.__CPGod_to_Ekron_1__PSGod to Ekron__FFJos/15/45\');">Jos 15:45__NBJdg/1/18\');">Jdg 1:18__NB2Ki/1/2\');">2Ki 1:2__NBAmo/1/8\');">Amo 1:8__AN__GHus__to_slay_us_and_our_people_2__PSus, to slay us and our people__FEHeb. me, to slay me and my people.</TD></TR>';
stringArray[11] = 'So they sent and gathered together all the lords of the Philistines, and said, Send away the ark of the God of Israel, and let it go again to his own place, that it slay __PNus_not__and_our_people_1__SHus not, and our people</a>: for there was __PNa_deadly_2__SHa deadly</a> destruction throughout all the city; __PNthe_hand_3__SHthe hand</a> of God was very heavy there.__CPus_not__and_our_people_1__PSus not, and our people__EEHeb. me not, and my people.__GHa_deadly_2__PSa deadly__EFIsa/13/7\');">Isa 13:7-9__NBJer/48/42\');">Jer 48:42-44__AN__GGthe_hand_3__PSthe hand__FF1Sa/5/6\');">1Sa 5:6__NR1Sa/5/9\');">9__EN';
