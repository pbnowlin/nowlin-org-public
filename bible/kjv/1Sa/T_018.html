var stringArray = new Array();
stringArray[1] = 'And it came to pass, when he had made an end of speaking unto Saul, that __PNthe_soul_of_Jonathan_1__SHthe soul of Jonathan</a> was knit with the soul of David, and Jonathan __PNloved_him_2__SHloved him</a> as his own soul.__CPthe_soul_of_Jonathan_1__PSthe soul of Jonathan__EE"The modesty, piety, and courage of David were so congenial to the character of the amiable Jonathan, that they attracted his most cordial esteem and affection; so that the most intimate friendship subsisted between them from that time, and they loved each other with pure hearts fervently. Their friendship could not be affected by the common vicissitudes of life; and it exemplifies by fact what the ancients have written on the subject; [Ten philian isoteta einai, kai mian psychen ton philon heteron auton.] ""Friendship is an entire sameness, and one soul: a friend is another self."" __NA1Sa/14/1\');">1Sa 14:1-14__NR1Sa/14/45\');">45__NBGen/44/30\');">Gen 44:30__NBJdg/20/11\');">Jdg 20:11__NB1Ch/12/17\');">1Ch 12:17__NBPsa/86/11\');">Psa 86:11__NBCol/2/2\');">Col 2:2__AN"__GHloved_him_2__PSloved him__EF1Sa/18/3\');">1Sa 18:3__NB1Sa/19/2\');">1Sa 19:2__NB1Sa/20/17\');">1Sa 20:17__NBDeu/13/6\');">Deu 13:6__NB2Sa/1/26\');">2Sa 1:26__NBPro/18/24\');">Pro 18:24__EN';
stringArray[2] = 'And Saul __PNtook_him_1__SHtook him</a> that day, and would let him go no more home to his father\'s house.__CPtook_him_1__PStook him__FF1Sa/16/21\');">1Sa 16:21-23__NB1Sa/17/15\');">1Sa 17:15__EN';

stringArray[4] = 'And Jonathan __PNstripped_himself_1__SHstripped himself</a> of the robe that [was] upon him, and gave it to David, and his garments, even to his sword, and to his bow, and to his girdle.__CPstripped_himself_1__PSstripped himself__EEPresents of clothes or rich robes, as tokens of respect or friendship, are frequent in the East. __NAGen/41/42\');">Gen 41:42__NBEst/6/8\');">Est 6:8__NREst/6/9\');">9__NBIsa/61/10\');">Isa 61:10__NBLuk/15/22\');">Luk 15:22__NB2Cr/5/21\');">2Cr 5:21__NBPhl/2/7\');">Phl 2:7__NRPhl/2/8\');">8__EN';
stringArray[5] = 'And David went out whithersoever Saul sent him, [and] __PNbehaved_1__SHbehaved</a> himself __PNwisely_2__SHwisely</a>: and Saul set him over __PNthe_men_of_war_3__SHthe men of war</a>, and he was accepted in the sight of all the people, and also in the sight of Saul\'s servants.__CPbehaved_1__PSbehaved__EEor, prospered. __NA1Sa/18/14\');">1Sa 18:14__NR1Sa/18/15\');">15__NR1Sa/18/30\');">30__NBGen/39/2\');">Gen 39:2__NRGen/39/3\');">3__NRGen/39/23\');">23__NBPsa/1/3\');">Psa 1:3__NBAct/7/10\');">Act 7:10__AN__GHwisely_2__PSwisely__EFMat/10/16\');">Mat 10:16__NBEph/5/17\');">Eph 5:17__NBCol/4/5\');">Col 4:5__AN__GGthe_men_of_war_3__PSthe men of war__FF1Sa/13/2\');">1Sa 13:2__NB1Sa/14/52\');">1Sa 14:52__EN';
stringArray[6] = 'And it came to pass as they came, when David was returned from the slaughter of the __PNPhilistine_1__SHPhilistine</a>, that __PNthe_women_2__SHthe women</a> came out of all cities of Israel, singing and dancing, to meet king Saul, with tabrets, with joy, and with __PNinstruments_of_musick_3__SHinstruments of musick</a>.__CPPhilistine_1__PSPhilistine__EEor, Philistines.__GHthe_women_2__PSthe women__EFExd/15/20\');">Exd 15:20__NBJdg/11/34\');">Jdg 11:34__NBPsa/68/25\');">Psa 68:25__NBJer/31/11\');">Jer 31:11-13__AN__GGinstruments_of_musick_3__PSinstruments of musick__EEHeb. three stringed instruments. The original shalishim, is rendered by the Vulgate sistris. The sistrum was an ancient Egyptian instrument made of brass, with three, and sometimes more brass rods across; which, being loose in their holes, made a jingling noise when shaken.</TD></TR>';
stringArray[7] = 'And the women __PNanswered_1__SHanswered</a> [one another] as they played, and said, __PNSaul_2__SHSaul</a> hath slain his thousands, and David his ten thousands.__CPanswered_1__PSanswered__FFExd/15/21\');">Exd 15:21__NBPsa/24/7\');">Psa 24:7__NRPsa/24/8\');">8__AN__GHSaul_2__PSSaul__EF1Sa/21/11\');">1Sa 21:11__NB1Sa/29/5\');">1Sa 29:5__EN';
stringArray[8] = 'And Saul was very wroth, and __PNthe_saying_1__SHthe saying</a> __PNdispleased_him_2__SHdispleased him</a>; and he said, They have ascribed unto David ten thousands, and to me they have ascribed [but] thousands: __PNand_what_3__SHand [what]</a> can he have more but the kingdom?__CPthe_saying_1__PSthe saying__FFEst/3/5\');">Est 3:5__NBPro/13/10\');">Pro 13:10__NBPro/27/4\');">Pro 27:4__NBEcc/4/4\');">Ecc 4:4__NBJam/4/5\');">Jam 4:5__AN__GHdispleased_him_2__PSdispleased him__FEHeb. was evil in his eyes. __NANum/11/1\');">Num 11:1__NBNum/22/34\');">Num 22:34__AN; *margins__GGand_what_3__PSand what__FF1Sa/13/14\');">1Sa 13:14__NB1Sa/15/28\');">1Sa 15:28__NB1Sa/16/13\');">1Sa 16:13__NB1Sa/20/31\');">1Sa 20:31__NB1Ki/2/22\');">1Ki 2:22__EN';
stringArray[9] = 'And Saul __PNeyed_David_1__SHeyed David</a> from that day and forward.__CPeyed_David_1__PSeyed David__FFGen/4/5\');">Gen 4:5__NRGen/4/6\');">6__NBGen/31/2\');">Gen 31:2__NBMat/20/15\');">Mat 20:15__NBMar/7/22\');">Mar 7:22__NBEph/4/27\');">Eph 4:27__NBJam/5/9\');">Jam 5:9__EN';
stringArray[10] = 'And it came to pass on the morrow, that __PNthe_evil_spirit_1__SHthe evil spirit</a> from God came upon Saul, __PNand_he_prophesied_2__SHand he prophesied</a> in the midst of the house: and David __PNplayed_3__SHplayed</a> with his hand, as at other times: __PNand_there_was_4__SHand [there was]</a> a javelin in Saul\'s hand.__CPthe_evil_spirit_1__PSthe evil spirit__FF1Sa/16/14\');">1Sa 16:14__NR1Sa/16/15\');">15__NB1Sa/19/9\');">1Sa 19:9__NB1Sa/26/19\');">1Sa 26:19__AN__GHand_he_prophesied_2__PSand he prophesied__FE"Wyyithnabbai, rather, ""and he pretended to prophesy; for the verb is in Hithpaël, the signification of which conjugation is not only reflex action, but also affectation of the action: __NAJer/29/26\');">Jer 29:26__AN, __NAJer/29/27\');">27__AN. The meaning seems to be, that Saul, influenced by the evil spirit, feigned to be prophesying, the better to conceal his murderous intentions, and to render David unsuspicious. __NA1Sa/19/24\');">1Sa 19:24__NB1Ki/18/29\');">1Ki 18:29__NB1Ki/22/12\');">1Ki 22:12__NR1Ki/22/20\');">20-23__NBJer/28/2\');">Jer 28:2-4__NRJer/28/11\');">11__NBZec/13/2\');">Zec 13:2-5__NBAct/16/16\');">Act 16:16__NB2Th/2/11\');">2Th 2:11__AN"__GGplayed_3__PSplayed__FF1Sa/16/16\');">1Sa 16:16__NR1Sa/16/23\');">23__AN__GHand_there_was_4__PSand there was__FE"Wehachanith beyad Shäool, rather, ""and the javelin was in the hand of Saul;"" for the javelin or spear was the emblem of regal authority; and kings had it always in their hand, as may be seen represented on ancient monuments. In ancient times, says Justin, kings used a spear instead of a sceptre."</TD></TR>';
stringArray[11] = 'And Saul __PNcast_the_javelin_1__SHcast the javelin</a>; for he said, I will smite David even to the wall [with it]. __PNAnd_David_2__SHAnd David</a> avoided out of his presence twice.__CPcast_the_javelin_1__PScast the javelin__FF1Sa/19/9\');">1Sa 19:9__NR1Sa/19/10\');">10__NB1Sa/20/33\');">1Sa 20:33__NBPro/27/4\');">Pro 27:4__NBIsa/54/17\');">Isa 54:17__AN__GHAnd_David_2__PSAnd David__EFPsa/37/32\');">Psa 37:32__NRPsa/37/33\');">33__NBIsa/54/17\');">Isa 54:17__NBLuk/4/30\');">Luk 4:30__NBJhn/8/59\');">Jhn 8:59__NBJhn/10/39\');">Jhn 10:39__EN';
stringArray[12] = 'And Saul was __PNafraid_1__SHafraid</a> of David, because __PNthe_LORD_2__SHthe LORD</a> was with him, and was __PNdeparted_3__SHdeparted</a> from Saul.__CPafraid_1__PSafraid__FF1Sa/18/15\');">1Sa 18:15__NR1Sa/18/20\');">20__NR1Sa/18/29\');">29__NB1Sa/16/4\');">1Sa 16:4__NBPsa/48/3\');">Psa 48:3-6__NBPsa/53/5\');">Psa 53:5__NBMar/6/20\');">Mar 6:20__NBLuk/8/37\');">Luk 8:37__NBAct/24/25\');">Act 24:25__AN__GHthe_LORD_2__PSthe LORD__EF1Sa/16/13\');">1Sa 16:13__NR1Sa/16/18\');">18__NB1Sa/22/13\');">1Sa 22:13__NBAct/7/9\');">Act 7:9__AN__GGdeparted_3__PSdeparted__FF1Sa/16/14\');">1Sa 16:14__NB1Sa/28/15\');">1Sa 28:15__NBPsa/51/11\');">Psa 51:11__NBHsa/9/12\');">Hsa 9:12__NBMat/25/41\');">Mat 25:41__EN';
stringArray[13] = 'Therefore Saul __PNremoved_1__SHremoved</a> him from him, and made him his captain over a thousand; and __PNhe_went_out_2__SHhe went out</a> and came in before the people.__CPremoved_1__PSremoved__FF1Sa/18/17\');">1Sa 18:17__NR1Sa/18/25\');">25__NB1Sa/8/12\');">1Sa 8:12__NB1Sa/22/7\');">1Sa 22:7__AN__GHhe_went_out_2__PShe went out__EF1Sa/18/16\');">1Sa 18:16__NBNum/27/16\');">Num 27:16__NRNum/27/17\');">17__NB2Sa/5/2\');">2Sa 5:2__NBPsa/121/8\');">Psa 121:8__AN; Saul was sensible that the LORD was departed from him; while he perceived, with evident sorrow of heart, that the LORD had given David peculiar wisdom, and that he was with him to prosper all his undertakings. This increased the disquietude of his malevolent mind, and his dread of David as a prevailing rival: he therefore removed him from his presence. This impolitic step, however, served the more to ingratiate David with the people, by affording him the opportunity of leading them forth to victory over their enemies.</TD></TR>';
stringArray[14] = 'And David __PNbehaved_1__SHbehaved</a> himself wisely in all his ways; and __PNthe_LORD_2__SHthe LORD</a> [was] with him.__CPbehaved_1__PSbehaved__EEor, prospered. See on __NA1Sa/18/5\');">1Sa 18:5__AN.__GHthe_LORD_2__PSthe LORD__EF1Sa/10/7\');">1Sa 10:7__NB1Sa/16/18\');">1Sa 16:18__NBGen/39/2\');">Gen 39:2__NRGen/39/3\');">3__NRGen/39/23\');">23__NBJos/6/27\');">Jos 6:27__NBMat/1/23\');">Mat 1:23__NBMat/28/20\');">Mat 28:20__NBAct/18/10\');">Act 18:10__EN';
stringArray[15] = 'Wherefore when Saul saw that he behaved himself very __PNwisely_1__SHwisely</a>, he was afraid of him.__CPwisely_1__PSwisely__FFPsa/112/5\');">Psa 112:5__NBDan/6/4\');">Dan 6:4__NRDan/6/5\');">5__NBCol/4/5\');">Col 4:5__NBJam/1/5\');">Jam 1:5__NBJam/3/17\');">Jam 3:17__EN';
stringArray[16] = 'But __PNall_Israel_1__SHall Israel</a> and Judah loved David, because __PNhe_went_2__SHhe went</a> out and came in before them.__CPall_Israel_1__PSall Israel__FF1Sa/18/5\');">1Sa 18:5__NBLuk/19/48\');">Luk 19:48__NBLuk/20/19\');">Luk 20:19__AN__GHhe_went_2__PShe went__EFNum/27/17\');">Num 27:17__NB2Sa/5/2\');">2Sa 5:2__NB1Ki/3/7\');">1Ki 3:7__EN';
stringArray[17] = 'And Saul said to David, Behold my elder daughter Merab, __PNher_will_I_give_1__SHher will I give</a> thee to wife: only be thou __PNvaliant_2__SHvaliant</a> for me, and fight __PNthe_LORD_S_3__SHthe LORD\'S</a> battles. For Saul said, __PNLet_not_mine_4__SHLet not mine</a> hand be upon him, but let the hand of the Philistines be upon him.__CPher_will_I_give_1__PSher will I give__FF1Sa/17/25\');">1Sa 17:25__NBPsa/12/2\');">Psa 12:2__NBPsa/55/21\');">Psa 55:21__AN__GHvaliant_2__PSvaliant__FEHeb. a son of valour.__GGthe_LORD_S_3__PSthe LORD\'S__FF1Sa/17/47\');">1Sa 17:47__NB1Sa/25/28\');">1Sa 25:28__NBNum/32/20\');">Num 32:20__NRNum/32/27\');">27__NRNum/32/29\');">29__AN__GHLet_not_mine_4__PSLet not mine__EF1Sa/18/21\');">1Sa 18:21__NR1Sa/18/25\');">25__NBDeu/17/7\');">Deu 17:7__NB2Sa/11/15\');">2Sa 11:15__NB2Sa/12/9\');">2Sa 12:9__EN';
stringArray[18] = 'And David said unto Saul, __PNWho_am_I_1__SHWho [am] I</a>? and what [is] my life, [or] my father\'s family in Israel, that I should be son in law to the king?__CPWho_am_I_1__PSWho am I__FF1Sa/18/23\');">1Sa 18:23__NB1Sa/9/21\');">1Sa 9:21__NBExd/3/11\');">Exd 3:11__NBRth/2/10\');">Rth 2:10__NB2Sa/7/18\');">2Sa 7:18__NBPro/15/33\');">Pro 15:33__NBPro/18/12\');">Pro 18:12__NBJer/1/6\');">Jer 1:6__EN';
stringArray[19] = 'But it came to pass at the time when Merab Saul\'s daughter should have been given to David, that she was given unto __PNAdriel_1__SHAdriel</a> the __PNMeholathite_2__SHMeholathite</a> to wife.__CPAdriel_1__PSAdriel__FFJdg/14/20\');">Jdg 14:20__NB2Sa/21/8\');">2Sa 21:8__AN__GHMeholathite_2__PSMeholathite__EFJdg/7/22\');">Jdg 7:22__EN';
stringArray[20] = 'And Michal Saul\'s daughter __PNloved_David_1__SHloved David</a>: and they told Saul, and the thing __PNpleased_him_2__SHpleased him</a>.__CPloved_David_1__PSloved David__FF1Sa/18/28\');">1Sa 18:28__NBGen/29/18\');">Gen 29:18__NRGen/29/20\');">20__NBGen/34/3\');">Gen 34:3__NBJdg/16/4\');">Jdg 16:4__NRJdg/16/15\');">15__NB2Sa/13/1\');">2Sa 13:1__NB1Ki/11/1\');">1Ki 11:1__NR1Ki/11/2\');">2__NBHsa/3/2\');">Hsa 3:2__AN__GHpleased_him_2__PSpleased him__FEHeb. was right in his eyes.</TD></TR>';
stringArray[21] = 'And Saul said, I will give him her, that she may be __PNa_snare_1__SHa snare</a> to him, and that __PNthe_hand_2__SHthe hand</a> of the Philistines may be against him. Wherefore Saul said to David, Thou shalt __PNthis_day_3__SHthis day</a> be my son in law in [the one of] the twain.__CPa_snare_1__PSa snare__FFExd/10/7\');">Exd 10:7__NBPsa/7/14\');">Psa 7:14-16__NBPsa/38/12\');">Psa 38:12__NBPro/26/24\');">Pro 26:24-26__NBPro/29/5\');">Pro 29:5__NBJer/5/26\');">Jer 5:26__NBJer/9/8\');">Jer 9:8__AN__GHthe_hand_2__PSthe hand__EF1Sa/18/17\');">1Sa 18:17__NB1Sa/19/11\');">1Sa 19:11__NR1Sa/19/12\');">12__AN__GGthis_day_3__PSthis day__FF1Sa/18/26\');">1Sa 18:26__EN';
stringArray[22] = 'And Saul __PNcommanded_1__SHcommanded</a> his __PNservants_2__SHservants</a>, [saying], Commune with David secretly, and say, Behold, the king hath delight in thee, and all his servants love thee: now therefore be the king\'s son in law.__CPcommanded_1__PScommanded__FFPsa/36/1\');">Psa 36:1-3__NBPsa/55/21\');">Psa 55:21__AN__GHservants_2__PSservants__EF2Sa/13/28\');">2Sa 13:28__NR2Sa/13/29\');">29__NBPro/29/12\');">Pro 29:12__EN';
stringArray[23] = 'And Saul\'s servants spake those words in the ears of David. And David said, Seemeth it to you __PNa_light_1__SH[a] light</a> [thing] to be a king\'s son in law, seeing that I [am] __PNa_poor_man_2__SHa poor man</a>, __PNand_lightly_3__SHand lightly</a> esteemed?__CPa_light_1__PSa light__FF1Jo/3/1\');">1Jo 3:1__AN__GHa_poor_man_2__PSa poor man__EF1Sa/9/21\');">1Sa 9:21__NBPro/14/20\');">Pro 14:20__NBPro/19/6\');">Pro 19:6__NRPro/19/7\');">7__NBEcc/9/15\');">Ecc 9:15__NREcc/9/16\');">16__AN__GGand_lightly_3__PSand lightly__FFPsa/119/141\');">Psa 119:141__EN';

stringArray[25] = 'And Saul said, Thus shall ye say to David, The king desireth not any __PNdowry_1__SHdowry</a>, __PNbut_an_hundred_2__SHbut an hundred</a> __PNforeskins_3__SHforeskins</a> of the Philistines, __PNto_be_avenged_4__SHto be avenged</a> of the king\'s enemies. But Saul __PNthought_5__SHthought</a> to make David fall by the hand of the Philistines.__CPdowry_1__PSdowry__FFGen/29/18\');">Gen 29:18__NBGen/34/12\');">Gen 34:12__NBExd/22/16\');">Exd 22:16__NRExd/22/17\');">17__AN__GHbut_an_hundred_2__PSbut an hundred__FEThat is, Thou shalt slay one hundred Philistines, and thou shalt produce their foreskins as a proof, not only that thou hast killed one hundred men, but that these are of the uncircumcised Philistines.__GGforeskins_3__PSforeskins__FF1Sa/17/26\');">1Sa 17:26__NR1Sa/17/36\');">36__NBGen/17/11\');">Gen 17:11-14__NBJos/5/3\');">Jos 5:3__AN__GHto_be_avenged_4__PSto be avenged__EF1Sa/14/24\');">1Sa 14:24__AN__GGthought_5__PSthought__FF1Sa/18/17\');">1Sa 18:17__NB2Sa/17/8\');">2Sa 17:8-11__EN';
stringArray[26] = 'And when his servants told David these words, it pleased David well to be the king\'s son in law: and __PNthe_days_1__SHthe days</a> were not __PNexpired_2__SHexpired</a>.__CPthe_days_1__PSthe days__FF1Sa/18/21\');">1Sa 18:21__AN__GHexpired_2__PSexpired__FEHeb. fulfilled.</TD></TR>';
stringArray[27] = 'Wherefore David arose and went, he and __PNhis_men_1__SHhis men</a>, and __PNslew_2__SHslew</a> of the Philistines __PNtwo_hundred_men_3__SHtwo hundred men</a>; and David brought their foreskins, and they gave them in full tale to the king, that he might be the king\'s son in law. And Saul gave him Michal his daughter to wife.__CPhis_men_1__PShis men__FF1Sa/18/13\');">1Sa 18:13__AN__GHslew_2__PSslew__EFJdg/14/19\');">Jdg 14:19__NB2Sa/3/14\');">2Sa 3:14__AN__GGtwo_hundred_men_3__PStwo hundred men__EEThe Septuagint has only [ ] one hundred men; and as Saul covenanted for a hundred, as David himself says, (__NA2Sa/3/14\');">2Sa 3:14__AN,) that he espoused Michal for a hundred, it is very probable that this is the true reading.</TD></TR>';

stringArray[30] = 'Then __PNthe_princes_1__SHthe princes</a> of the Philistines __PNwent_forth_2__SHwent forth</a>: and it came to pass, after they went forth, [that] David __PNbehaved_himself_3__SHbehaved himself</a> more wisely than all the servants of Saul; so that his name was much __PNset_by_4__SHset by</a>.__CPthe_princes_1__PSthe princes__EEOf this war we know no more than that David, whose military skill was greater, was more successful in it, than all the other officers of Saul.__GHwent_forth_2__PSwent forth__EF2Sa/11/1\');">2Sa 11:1__AN__GGbehaved_himself_3__PSbehaved himself__FF1Sa/18/5\');">1Sa 18:5__NBPsa/119/99\');">Psa 119:99__NBDan/1/20\');">Dan 1:20__NBLuk/21/15\');">Luk 21:15__NBEph/5/15\');">Eph 5:15__AN__GHset_by_4__PSset by__FEHeb. precious. __NA1Sa/2/30\');">1Sa 2:30__NB1Sa/26/21\');">1Sa 26:21__NB2Ki/1/13\');">2Ki 1:13__NBPsa/116/15\');">Psa 116:15__NB1Pe/2/4\');">1Pe 2:4__NR1Pe/2/7\');">7__EN';
