stringArray[7] = '__PNNow_Samuel_1__SHNow Samuel</a> __PNdid_not_yet_2__SHdid not yet</a> know the LORD, neither was the word of the LORD yet revealed unto him.__CPNow_Samuel_1__PSNow Samuel__EEOr, Thus did Samuel before he knew the LORD, and before the word of the LORD was revealed unto him.__GHdid_not_yet_2__PSdid not yet__FESamuel was not destitute of the knowledge of God, in that sense which implies the total absence of true piety, as Eli\'s sons were; for he knew and worshipped the God of Israel: but he did not know him as communicating special revelations of his will to him, in the manner in which he made it known to the prophets. __NAJer/9/24\');">Jer 9:24__NBAct/19/2\');">Act 19:2__EN';
stringArray[8] = 'And the LORD called Samuel again __PNthe_third_1__SHthe third</a> time. And he arose and went to Eli, and said, Here [am] I; for thou didst call me. And Eli perceived that the LORD had called the child.__CPthe_third_1__PSthe third__EE"__NAJob/33/14\');">Job 33:14__NRJob/33/15\');">15__AN; Although Samuel did not apprehend the way in which God reveals himself to his servants the prophets--by the ""still small voice""--yet when this direct communication from the Almighty was made the third time, in a way altogether new and strange to him, it seems astonishing that he did not immediately apprehend. Perhaps he would have been sooner aware of a divine revelation, had it come in a dream or a vision. Those who have the greatest knowledge of divine things, should remember the time when they were as babes, unskilful in the word of righteousness.; __NA1Cr/13/11\');">1Cr 13:11__NR1Cr/13/12\');">12__AN"</TD></TR>';
stringArray[9] = 'Therefore Eli said unto Samuel, Go, lie down: and it shall be, if he call thee, that thou shalt say, __PNSpeak_1__SHSpeak</a>, LORD; for thy servant heareth. So Samuel went and lay down in his place.__CPSpeak_1__PSSpeak__FFExd/20/19\');">Exd 20:19__NBPsa/85/8\');">Psa 85:8__NBIsa/6/8\');">Isa 6:8__NBDan/10/19\');">Dan 10:19__NBAct/9/6\');">Act 9:6__EN';
stringArray[10] = 'And __PNthe_LORD_came_1__SHthe LORD came</a>, and stood, and called __PNas_at_other_2__SHas at other</a> times, Samuel, Samuel. Then Samuel answered, Speak; for thy servant heareth.__CPthe_LORD_came_1__PSthe LORD came__EEThis seems to imply a visible appearance, as well as an audible voice.__GHas_at_other_2__PSas at other__EF1Sa/3/4\');">1Sa 3:4-6__NR1Sa/3/8\');">8__AN; Samuel did not now rise and run as before, when thought he Eli called, but lay still and listened. All must be silent, when God speaks. Observe, however, Samuel in his reply left out one word: he did not say, Speak, LORD, but only Speak, for thy servant heareth; perhaps, as Bp. Patrick suggests, out of uncertainty, whether it was God that spake to him or not. However, by this answer way was made for the message he was now to receive, and Samuel was brought acquainted with the words of God and visions of the Almighty.</TD></TR>';

stringArray[15] = 'And Samuel lay until the morning, and __PNopened_1__SHopened</a> the doors of the house of the LORD. And __PNSamuel_2__SHSamuel</a> __PNfeared_3__SHfeared</a> to shew Eli the vision.__CPopened_1__PSopened__FF1Sa/1/9\');">1Sa 1:9__NBMal/1/10\');">Mal 1:10__AN__GHSamuel_2__PSSamuel__FESamuel reverenced Eli as a father, and feared to distress him by shewing what God had purposed to do. It does not appear that God commanded Samuel to deliver this message; he therefore did not attempt it till adjured by Eli. It might be supposed that Samuel would have been so full of ecstasy as to have forgotten his ordinary service, and run amongst his friends to tell them of the converse he had with God in the night: but he modestly keeps it to himself. Our secret communion with God is not to be proclaimed on the house-top.__GGfeared_3__PSfeared__FFJer/1/6\');">Jer 1:6-8__NB1Cr/16/10\');">1Cr 16:10__NR1Cr/16/11\');">11__EN';
