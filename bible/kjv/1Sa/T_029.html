stringArray[2] = 'And __PNthe_lords_1__SHthe lords</a> of the Philistines passed on by hundreds, and by thousands: __PNbut_David_2__SHbut David</a> and his men passed on in the rereward with Achish.__CPthe_lords_1__PSthe lords__FF1Sa/29/6\');">1Sa 29:6__NR1Sa/29/7\');">7__NB1Sa/5/8\');">1Sa 5:8-11__NB1Sa/6/4\');">1Sa 6:4__NBJos/13/3\');">Jos 13:3__AN__GHbut_David_2__PSbut David__EF1Sa/28/1\');">1Sa 28:1__NR1Sa/28/2\');">2__EN';
stringArray[3] = 'Then said the princes of the Philistines, What [do] these Hebrews [here]? And Achish said unto the princes of the Philistines, __PNIs_not_this_David_1__SH[Is] not this David</a>, the servant of Saul the king of Israel, which hath been with me __PNthese_days_2__SHthese days</a>, or these years, and I have __PNfound_3__SHfound</a> no fault in him since he fell [unto me] unto this day?__CPIs_not_this_David_1__PSIs not this David__EE"These words seem to mark no definite time; and may be understood thus: ""Is not this David, the servant of Saul the king of Israel, who has been with me for a considerable time?"""__GHthese_days_2__PSthese days__EF1Sa/27/7\');">1Sa 27:7__AN__GGfound_3__PSfound__FF1Sa/25/28\');">1Sa 25:28__NBDan/6/5\');">Dan 6:5__NBJhn/19/6\');">Jhn 19:6__NBRom/12/17\');">Rom 12:17__NB1Pe/3/16\');">1Pe 3:16__EN';
stringArray[4] = 'And the princes of the Philistines were wroth with him; and the princes of the Philistines said unto him, __PNMake_this_fellow_1__SHMake this fellow</a> return, that he may go again to his place which thou hast appointed him, and let him not go down with us to battle, lest in the battle he be an adversary to us: for wherewith should he reconcile himself unto his master? [should it] not [be] with the heads of these men?__CPMake_this_fellow_1__PSMake this fellow__EEThe princes reasoned wisely, according to the common practice of mankind; and it was well for David that they were such good politicians: it was ordered by a gracious Providence that they refused to let David go with them to this battle, in which he must have been either an enemy to his country, or false to his friends and to his trust. Had he fought for the Philistines, he would have fought against God and his country; and had he in the battle gone over to the Israelites, he would have deceived and become a traitor to the hospitable Achish. God therefore delivered him from such disgrace; and by the same kind Providence he was sent back to rescue his wives, and the wives and children of his people, from captivity. __NA1Sa/14/21\');">1Sa 14:21__NB1Ch/12/19\');">1Ch 12:19__NBLuk/16/8\');">Luk 16:8__EN';

stringArray[6] = 'Then Achish called David, and said unto him, Surely, [as] __PNthe_LORD_1__SHthe LORD</a> liveth, __PNthou_hast_2__SHthou hast</a> been upright, and __PNthy_going_3__SHthy going</a> out and thy coming in with me in the host [is] good in my sight: for __PNI_have_not_4__SHI have not</a> found evil in thee since the day of thy coming unto me unto this day: nevertheless __PNthe_lords_favour__etc__5__SHthe lords favour</a> thee not.__CPthe_LORD_1__PSthe LORD__FF1Sa/20/3\');">1Sa 20:3__NB1Sa/28/10\');">1Sa 28:10__NBDeu/10/20\');">Deu 10:20__NBIsa/65/16\');">Isa 65:16__NBJer/12/16\');">Jer 12:16__AN__GHthou_hast_2__PSthou hast__EFMat/5/16\');">Mat 5:16__NB1Pe/2/12\');">1Pe 2:12__NB1Pe/3/16\');">1Pe 3:16__AN__GGthy_going_3__PSthy going__FFNum/27/17\');">Num 27:17__NB2Sa/3/25\');">2Sa 3:25__NB2Ki/19/27\');">2Ki 19:27__NBPsa/121/8\');">Psa 121:8__AN__GHI_have_not_4__PSI have not__EF1Sa/29/3\');">1Sa 29:3__AN__GGthe_lords_favour__etc__5__PSthe lords favour, etc.__EEHeb. thou art not good in the eyes of the lords. __NAGen/16/6\');">Gen 16:6__NBJos/22/30\');">Jos 22:30__AN; *marg:</TD></TR>';
stringArray[7] = 'Wherefore now return, and go in peace, that thou __PNdisplease_1__SHdisplease</a> not the lords of the Philistines.__CPdisplease_1__PSdisplease__EEHeb. do not evil in the eyes of the lords. __NANum/22/34\');">Num 22:34__EN';
stringArray[8] = 'And David said unto Achish, __PNBut_what_have_1__SHBut what have</a> I done? and what hast thou found in thy servant so long as I have been __PNwith_2__SHwith</a> thee unto this day, __PNthat_I_may_not_3__SHthat I may not</a> go fight against the enemies of my lord the king?__CPBut_what_have_1__PSBut what have__FF1Sa/12/3\');">1Sa 12:3__NB1Sa/17/29\');">1Sa 17:29__NB1Sa/20/8\');">1Sa 20:8__NB1Sa/26/18\');">1Sa 26:18__AN__GHwith_2__PSwith__FEHeb. before.__GGthat_I_may_not_3__PSthat I may not__FF1Sa/28/2\');">1Sa 28:2__NB2Sa/16/18\');">2Sa 16:18__NR2Sa/16/19\');">19__NBPsa/34/13\');">Psa 34:13__NRPsa/34/14\');">14__NBMat/6/13\');">Mat 6:13__EN';
stringArray[9] = 'And Achish answered and said to David, I know that thou [art] good in my sight, __PNas_an_angel_1__SHas an angel</a> of God: notwithstanding __PNthe_princes_2__SHthe princes</a> of the Philistines have said, He shall not go up with us to the battle.__CPas_an_angel_1__PSas an angel__FF2Sa/14/17\');">2Sa 14:17__NR2Sa/14/20\');">20__NB2Sa/19/27\');">2Sa 19:27__NBGal/4/14\');">Gal 4:14__AN__GHthe_princes_2__PSthe princes__EF1Sa/29/4\');">1Sa 29:4__EN';
stringArray[10] = 'Wherefore now rise up early in the morning with thy master\'s servants that are come with thee: and as soon as ye be up early in the morning, and have light, depart.__CPRelated_Verses1_1__PSEntire Verse.__FF1Sa/30/1\');">1Sa 30:1__NR1Sa/30/2\');">2__NBGen/22/14\');">Gen 22:14__NBPsa/37/23\');">Psa 37:23__NRPsa/37/24\');">24__NB1Cr/10/13\');">1Cr 10:13__NB2Pe/2/9\');">2Pe 2:9__EN';
stringArray[11] = 'So David and his men rose up early to depart in the morning, to return into the land of the Philistines. __PNAnd_the_Philistines_1__SHAnd the Philistines</a> went up to __PNJezreel_2__SHJezreel</a>.__CPAnd_the_Philistines_1__PSAnd the Philistines__FF1Sa/29/1\');">1Sa 29:1__NBJos/19/18\');">Jos 19:18__NB2Sa/4/4\');">2Sa 4:4__AN__GHJezreel_2__PSJezreel__FEJezreel, or Esdrælon, was a city of Issachar, afterwards celebrated as the residence of the kings of Israel, delightfully situated in the extensive and fertile plain of the same name, which extends from Scythopolis or Bethshan on the east to mount Carmel on the west. Eusebius and Jerome inform us, that it was in their time a place of considerable consequence, lying between Scythopolis on the east and Legio on the west; and the latter (on __NAHsa/1/\');">Ho 1__AN.) informs us that it was pretty near Maximianopolis. The Jerusalem Itinerary places it ten miles west from Scythopolis; and William of Tyre says it was called Little Gerinum in his time, and that there was a fine fountain in it, whose waters fell into the Jordan near Scythopolis. See __NA1Sa/29/1\');">1Sa 29:1__AN.</TD></TR>';
