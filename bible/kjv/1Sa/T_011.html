stringArray[7] = 'And __PNhe_took_1__SHhe took</a> a yoke of oxen, and __PNhewed_2__SHhewed</a> them in pieces, and sent [them] throughout all the coasts of Israel by the hands of messengers, saying, __PNWhosoever_3__SHWhosoever</a> cometh not forth after Saul and after Samuel, so shall it be done unto his oxen. And __PNthe_fear_4__SHthe fear</a> of the LORD fell on the people, and they came out __PNwith_one_consent_5__SHwith one consent</a>.__CPhe_took_1__PShe took__EEThe sending the pieces of the oxen was an act similar to that of the Levite, __NAJdg/19/29\');">Jdg 19:29__AN, where see the Note. An eminent Scotch writer describes the rites, incantations, and imprecations used prior to the fiery cross being circulated, to summon the rough warriors of ancient times to the service of their chief; and he alludes to this ancient custom, which in comparatively modern times, has been practised in Scotland; and proves that a similar punishment of death, or destruction of their houses, for disobeying the summons, was inflicted by the ancient Scandinavians, as recorded by Olaus Magnus, in his History of the Goths. This bears a striking similarity to the ancient custom of the Israelites. With the Highlanders, a goat was slain; with the Israelites, an ox. The exhibition of a cross, stained with the blood of the sacrificed animal, was the summons of the former, while part of the animal, was the mandate of the latter. Disobedience in one nation was punished with the death of themselves or oxen, and burning o__GHhewed_2__PShewed__EFJdg/19/29\');">Jdg 19:29__AN__GGWhosoever_3__PSWhosoever__FFJdg/21/5\');">Jdg 21:5-11__AN__GHthe_fear_4__PSthe fear__EFGen/35/5\');">Gen 35:5__NB2Ch/14/14\');">2Ch 14:14__NB2Ch/17/10\');">2Ch 17:10__AN__GGwith_one_consent_5__PSwith one consent__EEHeb. as one man. __NAJdg/20/1\');">Jdg 20:1__EN';
