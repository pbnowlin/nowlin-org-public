var stringArray = new Array();
stringArray[1] = 'Now __PNit_came_to_pass_upon_a_day_3__SHit came to pass upon a day</a>, that __PNJonathan_4__SHJonathan</a> the son of Saul said unto the young man that bare his armour, Come, and let us go over to the Philistines\' garrison, that [is] on the other side. But __PNhe_told_not_5__SHhe told not</a> his father.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2917. B.C. 1087.__GHRelated_Verses2_2__PSEntire Verse.__FEAn. Ex. Is. 404.__GGit_came_to_pass_upon_a_day_3__PSit came to pass upon a day__EEor, there was a day__GHJonathan_4__PSJonathan__EF1Sa/14/39\');">1Sa 14:39-45__NB1Sa/13/2\');">1Sa 13:2__NR1Sa/13/22\');">22__NB1Sa/18/1\');">1Sa 18:1-4__NB2Sa/1/4\');">2Sa 1:4__NR2Sa/1/5\');">5__NR2Sa/1/25\');">25__NR2Sa/1/26\');">26__AN__GGhe_told_not_5__PShe told not__FF1Sa/25/19\');">1Sa 25:19__NBJdg/6/27\');">Jdg 6:27__NBJdg/14/6\');">Jdg 14:6__NBMic/7/5\');">Mic 7:5__EN';
stringArray[2] = 'And Saul tarried __PNin_the_uttermost_1__SHin the uttermost</a> part of Gibeah under __PNa_pomegranate_2__SHa pomegranate</a> tree which [is] in Migron: and the people that [were] with him [were] about six hundred men;__CPin_the_uttermost_1__PSin the uttermost__FF1Sa/13/15\');">1Sa 13:15__NR1Sa/13/16\');">16__NBIsa/10/28\');">Isa 10:28__NRIsa/10/29\');">29__AN__GHa_pomegranate_2__PSa pomegranate__FEThe word rimmon, in Arabic romman, whence the Portuguese romaa, denotes the pomegranate, both tree and fruit; called by naturalists malus punica or malo-granatum. It is, according to the Linnean system, a genus of the icosandria monogynia class of plants; and is a low tree, growing very common in Palestine, and other parts of the East. It has several small angular boughs, very thick and bushy, covered with a reddish bark, and some of them armed with sharp thorns. They are garnished with small, narrow, spear-shaped leaves, like those of the myrtle, but not so sharp, of a green colour, inclining to red. Its blossoms are large, beautiful, of an elegant red colour, inclining to purple, composed of several stalks resembling a rose, in the hollow of the cup: this cup is oblong, hard, purple, having a figure somewhat like that of a bell. It is chiefly valued for its fruit, which is exceedingly beautiful, of the form and size of a large apple, with a reddish rind, and red within; being full of small kernels, with red</TD></TR>';
stringArray[3] = 'And __PNAhiah_1__SHAhiah</a>, the son of Ahitub, __PNI_chabod_s_2__SHIchabod\'s</a> brother, the son of Phinehas, the son of Eli, the LORD\'S priest in Shiloh, __PNwearing_3__SHwearing</a> an ephod. And the people knew not that Jonathan was gone.__CPAhiah_1__PSAhiah__FF1Sa/22/9\');">1Sa 22:9-12__NR1Sa/22/20\');">20__AN; called Ahimelech.__GHI_chabod_s_2__PSI-chabod\'s__EF1Sa/4/21\');">1Sa 4:21__AN__GGwearing_3__PSwearing__FF1Sa/2/28\');">1Sa 2:28__NBExd/28/26\');">Exd 28:26-32__EN';
stringArray[4] = 'And between __PNthe_passages_1__SHthe passages</a>, by which Jonathan sought to go over unto the Philistines\' garrison, [there was] a sharp rock on the one side, and a sharp rock on the other side: and the name of the one [was] __PNBozez_2__SHBozez</a>, and the name of the other __PNSeneh_3__SHSeneh</a>.__CPthe_passages_1__PSthe passages__FF1Sa/13/23\');">1Sa 13:23__AN__GHBozez_2__PSBozez__FEi.e., shining.__GGSeneh_3__PSSeneh__EEi.e., a bush or tooth.</TD></TR>';
stringArray[5] = 'The __PNforefront_1__SHforefront</a> of the one [was] situate northward over against Michmash, and the other southward over against Gibeah.__CPforefront_1__PSforefront__EEHeb. tooth.</TD></TR>';
stringArray[6] = 'And Jonathan said to the young man that bare his armour, __PNCome_1__SHCome</a>, and let us go over unto the garrison of these __PNuncircumcised_2__SHuncircumcised</a>: __PNit_may_be_3__SHit may be</a> that the LORD will work for us: __PNfor_there_is_no_restraint_4__SHfor [there is] no restraint</a> to the LORD to save by many or by few.__CPCome_1__PSCome__EEThis action of Jonathan\'s was totally contrary to the laws of war; no military operation should be undertaken without the knowledge and command of the general. But it is highly probable, that this gallant man was led to undertake the hazardous enterprise by an immediate divine impulse; and by the same influence was kept from informing the soldiers, and even from consulting his father, who might have opposed his design.__GHuncircumcised_2__PSuncircumcised__EF1Sa/17/26\');">1Sa 17:26__NR1Sa/17/36\');">36__NBGen/17/7\');">Gen 17:7-11__NBJdg/15/18\');">Jdg 15:18__NB2Sa/1/20\');">2Sa 1:20__NBJer/9/23\');">Jer 9:23__NRJer/9/26\');">26__NBEph/2/11\');">Eph 2:11__NREph/2/12\');">12__NBPhl/3/3\');">Phl 3:3__AN__GGit_may_be_3__PSit may be__FF2Sa/16/12\');">2Sa 16:12__NB2Ki/19/4\');">2Ki 19:4__NBAmo/5/15\');">Amo 5:15__NBZep/2/3\');">Zep 2:3__AN__GHfor_there_is_no_restraint_4__PSfor there is no restraint__FEWhere there is a promise of defense and support, the weakest, in the face of the strongest enemy, may rely upon it with the utmost confidence. __NADeu/32/30\');">Deu 32:30__NBJdg/7/4\');">Jdg 7:4-7__NB2Ch/14/11\');">2Ch 14:11__NBPsa/115/1\');">Psa 115:1-3__NBZec/4/6\');">Zec 4:6__NBMat/19/26\');">Mat 19:26__NBRom/8/31\');">Rom 8:31__EN';
stringArray[7] = 'And his armourbearer said unto him, __PNDo_all_1__SHDo all</a> that [is] in thine heart: turn thee; behold, I [am] with thee according to thy heart.__CPDo_all_1__PSDo all__FF1Sa/10/7\');">1Sa 10:7__NB2Sa/7/3\');">2Sa 7:3__NBPsa/46/7\');">Psa 46:7__NBZec/8/23\');">Zec 8:23__EN';
stringArray[8] = 'Then said Jonathan, Behold, __PNwe_will_pass_1__SHwe will pass</a> over unto [these] men, and we will discover ourselves unto them.__CPwe_will_pass_1__PSwe will pass__FFJdg/7/9\');">Jdg 7:9-14__EN';
stringArray[9] = 'If __PNthey_1__SHthey</a> say thus unto us, __PNTarry_2__SHTarry</a> until we come to you; then we will stand still in our place, and will not go up unto them.__CPthey_1__PSthey__FFGen/24/13\');">Gen 24:13__NRGen/24/14\');">14__NBJdg/6/36\');">Jdg 6:36-40__AN__GHTarry_2__PSTarry__FEHeb. Be still.</TD></TR>';
stringArray[10] = 'But if they say thus, Come up unto us; then we will go up: for the LORD hath delivered them into our hand: and __PNthis_shall_be_a_sign_1__SHthis [shall be] a sign</a> unto us.__CPthis_shall_be_a_sign_1__PSthis shall be a sign__FF1Sa/10/7\');">1Sa 10:7__NBGen/24/14\');">Gen 24:14__NBJdg/7/11\');">Jdg 7:11__NBIsa/7/11\');">Isa 7:11-14__EN';
stringArray[11] = 'And both of them discovered themselves unto the garrison of the Philistines: and the Philistines said, Behold, the Hebrews come forth __PNout_of_the_holes_1__SHout of the holes</a> where they had hid themselves.__CPout_of_the_holes_1__PSout of the holes__FF1Sa/14/22\');">1Sa 14:22__NB1Sa/13/6\');">1Sa 13:6__NBJdg/6/2\');">Jdg 6:2__EN';
stringArray[12] = 'And the men of the garrison answered Jonathan and his armourbearer, and said, __PNCome_up_to_us_1__SHCome up to us</a>, and we will shew you a thing. And Jonathan said unto his armourbearer, __PNCome_up_after_me_2__SHCome up after me</a>: for the LORD hath delivered them into the hand of Israel.__CPCome_up_to_us_1__PSCome up to us__EEMeaning, that they would cause them to repent of their audacity. This was the favourable sign which Jonathan had requested. __NA1Sa/14/10\');">1Sa 14:10__NB1Sa/17/43\');">1Sa 17:43__NR1Sa/17/44\');">44__NB2Sa/2/14\');">2Sa 2:14-17__NB2Ki/14/8\');">2Ki 14:8__AN__GHCome_up_after_me_2__PSCome up after me__EFGen/24/26\');">Gen 24:26__NRGen/24/27\');">27__NRGen/24/42\');">42__NRGen/24/48\');">48__NBJdg/4/14\');">Jdg 4:14__NBJdg/7/15\');">Jdg 7:15__NB2Sa/5/24\');">2Sa 5:24__EN';
stringArray[13] = 'And Jonathan __PNclimbed_up_1__SHclimbed up</a> upon his hands and upon his feet, and his armourbearer after him: and they __PNfell_2__SHfell</a> before Jonathan; and his armourbearer slew after him.__CPclimbed_up_1__PSclimbed up__FFPsa/18/29\');">Psa 18:29__NBHbr/11/34\');">Hbr 11:34__AN__GHfell_2__PSfell__EFLev/26/7\');">Lev 26:7__NRLev/26/8\');">8__NBDeu/28/7\');">Deu 28:7__NBDeu/32/30\');">Deu 32:30__NBJos/23/10\');">Jos 23:10__NBRom/8/31\');">Rom 8:31__EN';
stringArray[14] = 'And that first slaughter, which Jonathan and his armourbearer made, was about twenty men, within as it were __PNan_half_acre_of_land_1__SHan half acre of land</a>, [which] a yoke [of oxen might plow].__CPan_half_acre_of_land_1__PSan half acre of land__EEor, half a furrow of an acre of land. The original is obscure and variously understood; but it is probably a proverbial expression for a small space.</TD></TR>';
stringArray[15] = 'And __PNthere_was_trembling_1__SHthere was trembling</a> in the host, in the field, and among all the people: the garrison, and __PNthe_spoilers_2__SHthe spoilers</a>, they also trembled, and __PNthe_earth_quaked_3__SHthe earth quaked</a>: so it was a __PNvery_great_trembling_4__SHvery great trembling</a>.__CPthere_was_trembling_1__PSthere was trembling__FFJos/2/9\');">Jos 2:9__NBJdg/7/21\');">Jdg 7:21__NB2Ki/7/6\');">2Ki 7:6__NR2Ki/7/7\');">7__NBJob/18/11\');">Job 18:11__NBPsa/14/5\');">Psa 14:5__AN__GHthe_spoilers_2__PSthe spoilers__EF1Sa/13/17\');">1Sa 13:17__NR1Sa/13/23\');">23__AN__GGthe_earth_quaked_3__PSthe earth quaked__FFExd/19/18\');">Exd 19:18__NBMat/24/6\');">Mat 24:6__NBMat/27/50\');">Mat 27:50__NRMat/27/51\');">51__AN__GHvery_great_trembling_4__PSvery great trembling__FEHeb. trembling of God. __NAGen/35/5\');">Gen 35:5__NBLev/26/36\');">Lev 26:36__NRLev/26/37\');">37__NB2Sa/5/24\');">2Sa 5:24__NBDan/5/6\');">Dan 5:6__AN; God will in some way or other direct the steps of those who acknowledge him in all their ways, and seek unto him for direction with full purpose of heart. Sometimes we find most comfort in that which is least our own doing, and into which we have been led by the unexpected, but well observed, turns of Providence.</TD></TR>';
stringArray[16] = 'And the watchmen of Saul in Gibeah of Benjamin looked; and, behold, the multitude __PNmelted_away_1__SHmelted away</a>, and they went on __PNbeating_down_2__SHbeating down</a> [one another].__CPmelted_away_1__PSmelted away__FFPsa/58/7\');">Psa 58:7__NBPsa/68/2\');">Psa 68:2__AN__GHbeating_down_2__PSbeating down__EF1Sa/14/20\');">1Sa 14:20__NBJdg/7/22\');">Jdg 7:22__NB2Ch/20/22\');">2Ch 20:22-25__NBIsa/19/2\');">Isa 19:2__EN';
stringArray[17] = 'Then said Saul unto the people that [were] with him, Number now, and see who is gone from us. And when they had numbered, behold, Jonathan and his armourbearer [were] not [there].__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[18] = 'And Saul said unto Ahiah, __PNBring_hither_1__SHBring hither</a> the ark of God. __PNFor_the_ark_2__SHFor the ark</a> of God was at that time with the children of Israel.__CPBring_hither_1__PSBring hither__EE"The Septuagint reads [Prosagage to ephoud, hoti autos ere to ephoud en te hemera ekeine enopiou Israel.] ""Bring hither the ephod; for he bore the ephod on that day before Israel:"" which Houbigant and others think is the true reading. Finding that his son Jonathan and his armour-bearer were absent, Saul wished to consult the high-priest; but the tumult increasing, he says to him, ""Withdraw thine hand:"" i.e., desist form consulting the ephod on the present occasion, and immediately hastened to make the best use he could of this astonishing victory. __NA1Sa/4/3\');">1Sa 4:3-5__NB1Sa/30/8\');">1Sa 30:8__NBNum/27/21\');">Num 27:21__NBJdg/20/18\');">Jdg 20:18__NRJdg/20/23\');">23__NRJdg/20/27\');">27__NRJdg/20/28\');">28__NB2Sa/11/11\');">2Sa 11:11__NB2Sa/15/24\');">2Sa 15:24-26__AN"__GHFor_the_ark_2__PSFor the ark__EF1Sa/5/2\');">1Sa 5:2__NB1Sa/7/1\');">1Sa 7:1__EN';
stringArray[19] = 'And it came to pass, while Saul talked unto the priest, that the __PNnoise_1__SHnoise</a> that [was] in the host of the Philistines went on and increased: and Saul said unto the priest, __PNWithdraw_2__SHWithdraw</a> thine hand.__CPnoise_1__PSnoise__EEor, tumult.__GHWithdraw_2__PSWithdraw__EF1Sa/14/24\');">1Sa 14:24__NB1Sa/13/11\');">1Sa 13:11__NBJos/9/14\');">Jos 9:14__NBPsa/106/13\');">Psa 106:13__NBIsa/28/16\');">Isa 28:16__EN';
stringArray[20] = 'And Saul and all the people that [were] with him __PNassembled_themselves_1__SHassembled themselves</a>, and they came to the battle: and, behold, __PNevery_man_s_2__SHevery man\'s</a> sword was against his fellow, [and there was] a very great discomfiture.__CPassembled_themselves_1__PSassembled themselves__EEHeb. were cried together.__GHevery_man_s_2__PSevery man\'s__EF1Sa/14/16\');">1Sa 14:16__NBJdg/7/22\');">Jdg 7:22__NB2Ch/20/23\');">2Ch 20:23__NBIsa/9/19\');">Isa 9:19-21__NBIsa/19/2\');">Isa 19:2__EN';
stringArray[21] = 'Moreover __PNthe_Hebrews_1__SHthe Hebrews</a> [that] were with the Philistines before that time, which went up with them into the camp [from the country] round about, even they also [turned] to be with the Israelites that [were] with Saul and Jonathan.__CPthe_Hebrews_1__PSthe Hebrews__EE"Probably such as they held in bondage, or who were their servants. Instead of (häivrim, ""the Hebrews,"" the LXX. evidently read haâvdim, for they have [Loi douloi] ""the slaves;"" but this reading is not countenanced by any other version, nor by any MS. __NA1Sa/29/4\');">1Sa 29:4__NBJdg/7/23\');">Jdg 7:23__AN"</TD></TR>';
stringArray[22] = 'Likewise all the men of Israel which had __PNhid_themselves_1__SHhid themselves</a> in mount Ephraim, [when] they heard that the Philistines fled, even they also followed hard after them in __PNthe_battle_2__SHthe battle</a>.__CPhid_themselves_1__PShid themselves__FF1Sa/13/6\');">1Sa 13:6__NB1Sa/31/7\');">1Sa 31:7__AN__GHthe_battle_2__PSthe battle__FE"The LXX. and Vulgate add here, [kai pas ho laos en meta Saoul hos deka chiliades andron] Et erant cum Saul, quasi decem millia virorum. ""And [all the people who were, LXX.] there were with Saul about ten thousand men;"" but this is supported by no other authority."</TD></TR>';
stringArray[23] = 'So __PNthe_LORD_1__SHthe LORD</a> saved Israel that day: and the battle passed over unto __PNBeth_aven_2__SHBethaven</a>.__CPthe_LORD_1__PSthe LORD__FFExd/14/30\');">Exd 14:30__NBJdg/2/18\');">Jdg 2:18__NB2Ki/14/27\');">2Ki 14:27__NBPsa/44/6\');">Psa 44:6-8__NBHsa/1/7\');">Hsa 1:7__AN__GHBeth_aven_2__PSBeth-aven__EF1Sa/13/5\');">1Sa 13:5__EN';
stringArray[24] = 'And the men of Israel were distressed that day: for Saul had adjured the people, saying, __PNCursed_1__SHCursed</a> [be] the man that eateth [any] food until evening, that __PNI_may_be_2__SHI may be</a> avenged on mine enemies. So none of the people tasted [any] food.__CPCursed_1__PSCursed__FF1Sa/14/27\');">1Sa 14:27-30__NBLev/27/29\');">Lev 27:29__NBNum/21/2\');">Num 21:2__NBDeu/27/15\');">Deu 27:15-26__NBJos/6/17\');">Jos 6:17-19__NRJos/6/26\');">26__NBJdg/11/30\');">Jdg 11:30__NBJdg/11/31\');">Jdg 11:31__NBJdg/21/1\');">Jdg 21:1-5__NBPro/11/9\');">Pro 11:9__NBRom/10/2\');">Rom 10:2__NB1Cr/16/22\');">1Cr 16:22__AN__GHI_may_be_2__PSI may be__EFJdg/5/2\');">Jdg 5:2__NBJdg/1/28\');">Jdg 1:28__NBPsa/18/47\');">Psa 18:47__EN';
stringArray[25] = 'And __PNall_they_1__SHall [they</a> of] the land came to a wood; and there was __PNhoney_2__SHhoney</a> upon the ground.__CPall_they_1__PSall they__FFDeu/9/28\');">Deu 9:28__NBMat/3/5\');">Mat 3:5__AN__GHhoney_2__PShoney__FEThis was wild honey, which to this day abounds in Judea; and bursting from the comb, runs down the hollow trees, rocks, etc. __NAExd/3/8\');">Exd 3:8__NBNum/13/27\');">Num 13:27__NBMat/3/4\');">Mat 3:4__EN';
stringArray[26] = 'And when __PNthe_people_1__SHthe people</a> were come into the wood, behold, the honey dropped; but no man put his hand to his mouth: for the people feared the oath.__CPthe_people_1__PSthe people__FFEcc/9/2\');">Ecc 9:2__EN';
stringArray[27] = 'But Jonathan heard not when his father charged the people with the oath: wherefore he put forth the end of the rod that [was] in his hand, and dipped it in an honeycomb, and put his hand to his mouth; and __PNhis_eyes_1__SHhis eyes</a> were enlightened.__CPhis_eyes_1__PShis eyes__FF1Sa/14/29\');">1Sa 14:29__NB1Sa/30/12\');">1Sa 30:12__NBPro/25/26\');">Pro 25:26__EN';
stringArray[28] = 'Then answered one of the people, and said, Thy father straitly charged the people with an oath, saying, __PNCursed_1__SHCursed</a> [be] the man that eateth [any] food this day. And the people were __PNfaint_2__SHfaint</a>.__CPCursed_1__PSCursed__FF1Sa/14/24\');">1Sa 14:24__NR1Sa/14/43\');">43__AN__GHfaint_2__PSfaint__FEor, weary.</TD></TR>';
stringArray[29] = 'Then said Jonathan, __PNMy_father_1__SHMy father</a> hath troubled the land: __PNsee_2__SHsee</a>, I pray you, how mine eyes have been enlightened, because I tasted a little of this honey.__CPMy_father_1__PSMy father__FF1Ki/18/18\');">1Ki 18:18__AN__GHsee_2__PSsee__FEIt is well known, that hunger and fatigue produce faintness and dim the sight; and on taking a little food, this affection is immediately removed.</TD></TR>';
stringArray[30] = 'How much more, if haply the people had eaten freely to day of the spoil of their enemies which they found? for __PNhad_there_1__SHhad there</a> not been now a much greater slaughter among the Philistines?__CPhad_there_1__PShad there__FFEcc/9/18\');">Ecc 9:18__EN';
stringArray[31] = 'And they smote the Philistines that day __PNfrom_Michmash_1__SHfrom Michmash</a> to __PNAijalon_2__SHAijalon</a>: and the people were very faint.__CPfrom_Michmash_1__PSfrom Michmash__EEThe distance, Calmet states to be three or four leagues.__GHAijalon_2__PSAijalon__EFJos/10/12\');">Jos 10:12__NBJos/19/42\');">Jos 19:42__EN';
stringArray[32] = 'And the people __PNflew_1__SHflew</a> upon the spoil, and took sheep, and oxen, and calves, and slew [them] on the ground: and __PNthe_people_2__SHthe people</a> __PNdid_eat_3__SHdid eat</a> [them] with the blood.__CPflew_1__PSflew__FF1Sa/15/19\');">1Sa 15:19__AN__GHthe_people_2__PSthe people__FEThe people having abstained from food the whole of the day, and being now faint through hunger and fatigue, they flew upon the cattle, and not taking time to bleed them properly, they eagerly devoured the flesh with the blood, directly contrary to the law--another bad effect of Saul\'s rash adjuration.__GGdid_eat_3__PSdid eat__FFGen/9/4\');">Gen 9:4__NBLev/3/17\');">Lev 3:17__NBLev/7/26\');">Lev 7:26__NRLev/7/27\');">27__NBLev/17/10\');">Lev 17:10-14__NBLev/19/26\');">Lev 19:26__NBDeu/12/16\');">Deu 12:16__NRDeu/12/23\');">23__NRDeu/12/24\');">24__NBEze/33/25\');">Eze 33:25__NBAct/15/20\');">Act 15:20__NRAct/15/29\');">29__EN';
stringArray[33] = 'Then they told Saul, saying, Behold, the people sin against the LORD, in that they eat with the blood. And he said, Ye have __PNtransgressed_1__SHtransgressed</a>: roll a great stone unto me this day.__CPtransgressed_1__PStransgressed__EEor, dealt treacherously. __NAMat/7/5\');">Mat 7:5__NBRom/2/1\');">Rom 2:1__EN';
stringArray[34] = 'And Saul said, Disperse yourselves among the people, and say unto them, Bring me hither every man his ox, and every man his sheep, and slay [them] here, and eat; and sin not against the LORD in eating with the blood. And all the people brought every man his ox __PNwith_him_1__SHwith him</a> that night, and slew [them] there.__CPwith_him_1__PSwith him__EEHeb. in his hand.</TD></TR>';
stringArray[35] = 'And Saul __PNbuilt_1__SHbuilt</a> an altar unto the LORD: __PNthe_same__etc__2__SHthe same</a> was the first altar that he built unto the LORD.__CPbuilt_1__PSbuilt__EEIt is probable that Saul converted the great stone, on which the cattle had been slaughtered, into an altar, on which sacrifices were offered, before the people attempted to proceed any further. This we are told was the first he had built. Samuel, as a prophet and priest, had hitherto erected the altars, but Saul seems to have thought he had sufficient authority to erect one himself, without the prophet, as he had once offered sacrifice without him. __NA1Sa/7/9\');">1Sa 7:9__NR1Sa/7/17\');">17__NBJdg/21/4\');">Jdg 21:4__NBHsa/8/14\');">Hsa 8:14__NB2Ti/3/5\');">2Ti 3:5__AN__GHthe_same__etc__2__PSthe same, etc.__FEHeb. that altar he began to build unto the LORD.</TD></TR>';
stringArray[36] = 'And Saul said, __PNLet_us_go_1__SHLet us go</a> down after the Philistines by night, and spoil them until the morning light, and __PNlet_us_not_leave_2__SHlet us not leave</a> a man of them. And they said, Do whatsoever seemeth good unto thee. __PNThen_said_the_priest_3__SHThen said the priest</a>, Let us draw near hither unto God.__CPLet_us_go_1__PSLet us go__FFJos/10/9\');">Jos 10:9-14__NRJos/10/19\');">19__NBJer/6/5\');">Jer 6:5__AN__GHlet_us_not_leave_2__PSlet us not leave__EF1Sa/11/11\');">1Sa 11:11__NBJos/11/14\');">Jos 11:14__AN__GGThen_said_the_priest_3__PSThen said the priest__EEIt is evident that Ahiah, who had before been interrupted by Saul\'s impatience, doubted of the propriety of pursuing the Philistines that night, and properly counselled them to enquire of the LORD. __NANum/27/21\');">Num 27:21__NBPsa/73/28\');">Psa 73:28__NBIsa/48/1\');">Isa 48:1__NRIsa/48/2\');">2__NBIsa/58/2\');">Isa 58:2__NBMal/2/7\');">Mal 2:7__NBJam/4/8\');">Jam 4:8__EN';

stringArray[41] = '__PNTherefore_1__SHTherefore</a> Saul said unto the LORD God of Israel, __PNGive_a_perfect_lot_2__SHGive a perfect [lot]</a>. __PNAnd_Saul_3__SHAnd Saul</a> and Jonathan were taken: but the people __PNescaped_4__SHescaped</a>.__CPTherefore_1__PSTherefore__EE"Both the Septuagint and Vulgate add much to this verse: [Kai eipe Saoul, Kyrie Lo Theos Israel, ti Loti ouk apekrithes to doulo sou semeron? ei en emoi e en lonathan to Luio mou he adikia, Kyrie ho Theos Israel dos delous kai ean tade eipe, dos de to lao sou Israel, dos de osioteta, k.t.l.] Et dixit Saul ad Dominum Deum Israel; Domine Deus Israel da indicium: quid est quòd non responderis servo tuo hodie? Si in me, aut in Jonatha filio meo est iniquitas hæc, da ostensionem: aut si hæc iniquitas est in populo tuo, da sanctitatem, etc. ""And Saul said [to the LORD God of Israel, Vulg.] LORD God of Israel [give a sign, Vulg.] Why is it that thou has not answered thy servant to-day? If the iniquity be in me, or in my son Jonathan, [O LORD God of Israel, LXX.] make it manifest; and if thou say thus, give to thy people Israel, give mercy,"" etc., [but Vulg. Or, if this iniquity be in thy people, give sanctification,"" etc.]"__GHGive_a_perfect_lot_2__PSGive a perfect lot__FEor, Shew the innocent. __NAPro/16/33\');">Pro 16:33__NBAct/1/24\');">Act 1:24__AN__GGAnd_Saul_3__PSAnd Saul__FF1Sa/10/20\');">1Sa 10:20__NR1Sa/10/21\');">21__NBJos/7/16\');">Jos 7:16-18__NBJon/1/7\');">Jon 1:7__AN__GHescaped_4__PSescaped__FEHeb. went forth.</TD></TR>';
