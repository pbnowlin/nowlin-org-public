stringArray[1] = 'Now there was a man of Benjamin, whose name [was] __PNKish_1__SHKish</a>, the son of Abiel, the son of Zeror, the son of Bechorath, the son of Aphiah, __PNa_Benjamite_2__SHa Benjamite</a>, a mighty man of __PNpower_3__SHpower</a>.__CPKish_1__PSKish__FF1Sa/14/51\');">1Sa 14:51__NB1Ch/8/30\');">1Ch 8:30-33__NB1Ch/9/36\');">1Ch 9:36-39__NBAct/13/21\');">Act 13:21__AN; Cis.__GHa_Benjamite_2__PSa Benjamite__FEor, the son of a man of Jemini.__GGpower_3__PSpower__EEor, substance. __NA1Sa/25/2\');">1Sa 25:2__NB2Sa/19/32\');">2Sa 19:32__NBJob/1/3\');">Job 1:3__EN';
stringArray[2] = 'And he had a son, whose name [was] Saul, a __PNchoice_1__SHchoice</a> young man, and a goodly: and [there was] not among the children of Israel a goodlier person than he: __PNfrom_his_shoulders_2__SHfrom his shoulders</a> and upward [he was] higher than any of the people.__CPchoice_1__PSchoice__FF1Sa/16/7\');">1Sa 16:7__NBGen/6/2\');">Gen 6:2__NB2Sa/14/25\');">2Sa 14:25__NR2Sa/14/26\');">26__NBJer/9/23\');">Jer 9:23__AN__GHfrom_his_shoulders_2__PSfrom his shoulders__EF1Sa/10/23\');">1Sa 10:23__NB1Sa/17/4\');">1Sa 17:4__NBNum/13/33\');">Num 13:33__EN';

stringArray[5] = '[And] when they were come to the land of __PNZuph_1__SHZuph</a>, Saul said to his servant that [was] with him, Come, and let us return; lest my father leave [caring] for the asses, and __PNtake_thought_2__SHtake thought</a> for us.__CPZuph_1__PSZuph__FF1Sa/1/1\');">1Sa 1:1__AN__GHtake_thought_2__PStake thought__EF1Sa/10/2\');">1Sa 10:2__NBMat/6/25\');">Mat 6:25__NRMat/6/28\');">28__NRMat/6/34\');">34__NBLuk/12/11\');">Luk 12:11__NRLuk/12/22\');">22__EN';
stringArray[6] = 'And he said unto him, Behold now, [there is] in this __PNcity_1__SHcity</a> a man of God, and [he is] __PNan_honourable_2__SHan honourable</a> man; __PNall_that_he_saith_3__SHall that he saith</a> cometh surely to pass: now let us go thither; peradventure he can shew us our way that we should go.__CPcity_1__PScity__FF1Sa/2/27\');">1Sa 2:27__NBDeu/33/1\');">Deu 33:1__NB1Ki/13/1\');">1Ki 13:1__NB2Ki/6/6\');">2Ki 6:6__NB1Ti/6/11\');">1Ti 6:11__AN__GHan_honourable_2__PSan honourable__EF1Th/2/10\');">1Th 2:10__NB1Th/5/13\');">1Th 5:13__AN__GGall_that_he_saith_3__PSall that he saith__FF1Sa/3/19\');">1Sa 3:19__NR1Sa/3/20\');">20__NBIsa/44/26\');">Isa 44:26__NBZec/1/5\');">Zec 1:5__NRZec/1/6\');">6__NBMat/24/35\');">Mat 24:35__EN';
stringArray[7] = 'Then said Saul to his servant, But, behold, [if] we go, __PNwhat_shall_1__SHwhat shall</a> we bring the man? for the bread is __PNspent_in_2__SHspent in</a> our vessels, and [there is] not a present to bring to the man of God: what __PNhave_we_3__SHhave we</a>?__CPwhat_shall_1__PSwhat shall__FFJdg/6/18\');">Jdg 6:18__NBJdg/13/15\');">Jdg 13:15-17__NB1Ki/14/3\');">1Ki 14:3__NB2Ki/4/42\');">2Ki 4:42__NB2Ki/5/5\');">2Ki 5:5__NB2Ki/8/8\');">2Ki 8:8__AN__GHspent_in_2__PSspent in__FE"Heb. gone out of, etc. there is not. We are not to suppose from this that the prophets took money to predict future events: Saul only refers to an invariable custom, that no man approached a superior without some present or another, however small in value. Dr. Pococke tells us of a present of fifty radishes! Other authors mention a flower, an orange, or similar trifles; and Mr. Bruce says, that one who wished to solicit a favour from him, presented him with about a score of dates! ""I mention this trifling circumstance,"" says Mr. B. ""to shew how essential to human and civil intercourse presents are considered to be in the East; whether it be dates, or whether it be diamonds, they are so much a part of their manners, that without them, an inferior will never be at peace in his own mind, or think that he has hold of his superior for protection. But superiors give no presents to their inferiors."" Presents then are tokens of honour; not intended as offers of payment or enrichment."__GGhave_we_3__PShave we__EEHeb. is with us.</TD></TR>';
stringArray[8] = 'And the servant answered Saul again, and said, Behold, __PNI_have_here_at_hand_1__SHI have here at hand</a> the fourth part of a shekel of silver: [that] will I give to the man of God, to tell us our way.__CPI_have_here_at_hand_1__PSI have here at hand__EEHeb. there is found in my hand.</TD></TR>';

stringArray[11] = '[And] as they went up __PNthe_hill_to_the_city_1__SHthe hill to the city</a>, they __PNfound_2__SHfound</a> young maidens going out to draw water, and said unto them, Is the seer here?__CPthe_hill_to_the_city_1__PSthe hill to the city__EEHeb. in the ascent of the city.__GHfound_2__PSfound__EFGen/24/11\');">Gen 24:11__NRGen/24/18\');">18-20__NBExd/2/16\');">Exd 2:16__NBJdg/5/11\');">Jdg 5:11__EN';

stringArray[13] = 'As soon as ye be come into the city, ye shall straightway find him, before he go up to the high place to eat: for the people will not eat until he come, because __PNhe_doth_bless_1__SHhe doth bless</a> the sacrifice; [and] afterwards they eat that be bidden. Now therefore get you up; for about __PNthis_time_2__SHthis time</a> ye shall find him.__CPhe_doth_bless_1__PShe doth bless__FFMat/26/26\');">Mat 26:26__NBMar/6/41\');">Mar 6:41__NBLuk/24/30\');">Luk 24:30__NBJhn/6/11\');">Jhn 6:11__NRJhn/6/23\');">23__NB1Cr/10/30\');">1Cr 10:30__NB1Ti/4/4\');">1Ti 4:4__AN__GHthis_time_2__PSthis time__FEHeb. to-day.</TD></TR>';

stringArray[16] = 'To morrow about this time I will send thee a man out of the land of Benjamin, and __PNthou_shalt_1__SHthou shalt</a> anoint him [to be] captain over my people Israel, that he may save my people out of the hand of the Philistines: for I have __PNlooked_upon_2__SHlooked upon</a> my people, because their cry is come unto me.__CPthou_shalt_1__PSthou shalt__FF1Sa/10/1\');">1Sa 10:1__NB1Sa/15/1\');">1Sa 15:1__NB1Sa/16/3\');">1Sa 16:3__NB1Ki/19/15\');">1Ki 19:15__NR1Ki/19/16\');">16__NB2Ki/9/3\');">2Ki 9:3-6__AN__GHlooked_upon_2__PSlooked upon__EFExd/2/23\');">Exd 2:23-25__NBExd/3/7\');">Exd 3:7-9__NBPsa/25/18\');">Psa 25:18__NBPsa/106/44\');">Psa 106:44__EN';

stringArray[18] = 'Then Saul drew near to Samuel in the gate, and said, Tell me, I pray thee, where the seer\'s house [is].__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[19] = 'And Samuel answered Saul, and said, I [am] __PNthe_seer_1__SHthe seer</a>: go up before me unto the high place; for ye shall eat with me to day, and to morrow I will let thee go, __PNand_will_tell_2__SHand will tell</a> thee all that [is] in thine heart.__CPthe_seer_1__PSthe seer__EEThe word roaih literally signifies one who sees; particularly preternatural sights. A seer and a prophet were the same in most cases; only with this difference, the seer was always a prophet, but the prophet was not always a seer. A seer seems to imply one who frequently met with and saw some symbolical representation of God. All prophets, true or false, profess to see God, (see __NANum/24/4\');">Num 24:4__AN, __NANum/24/16\');">16__AN. __NAJer/14/4\');">Jer 14:4__AN;) and diviners, in their enthusiastic flights, boasted that they had those things exhibited to their sight which should come to pass.__GHand_will_tell_2__PSand will tell__EFJhn/4/29\');">Jhn 4:29__NB1Cr/14/25\');">1Cr 14:25__EN';

stringArray[21] = 'And Saul answered and said, [Am] not I __PNa_Benjamite_1__SHa Benjamite</a>, of the smallest of the tribes of Israel? and __PNmy_family_2__SHmy family</a> the least of all the families of the tribe of Benjamin? wherefore then speakest thou __PNso_to_me_3__SHso to me</a>?__CPa_Benjamite_1__PSa Benjamite__FFJdg/20/46\');">Jdg 20:46-48__NBPsa/68/27\');">Psa 68:27__AN__GHmy_family_2__PSmy family__EF1Sa/10/27\');">1Sa 10:27__NB1Sa/15/17\');">1Sa 15:17__NB1Sa/18/18\');">1Sa 18:18__NR1Sa/18/23\');">23__NBJdg/6/14\');">Jdg 6:14__NRJdg/6/15\');">15__NBHsa/13/1\');">Hsa 13:1__NBLuk/14/11\');">Luk 14:11__NBEph/3/8\');">Eph 3:8__AN__GGso_to_me_3__PSso to me__EEHeb. according to this word.</TD></TR>';

stringArray[24] = 'And the cook took up __PNthe_shoulder_1__SHthe shoulder</a>, and [that] which [was] upon it, and set [it] before Saul. And [Samuel] said, Behold that which is __PNleft_2__SHleft</a>! set [it] before thee, [and] eat: for unto this time hath it been kept for thee since I said, I have invited the people. So Saul did eat with Samuel that day.__CPthe_shoulder_1__PSthe shoulder__EEProbably the shoulder was set before Saul, not because it was the best part, but because it was an emblem of the government to which he was now called. (See __NAIsa/9/6\');">Isa 9:6__AN.) __NALev/7/32\');">Lev 7:32__NRLev/7/33\');">33__NBEze/24/4\');">Eze 24:4__AN__GHleft_2__PSleft__FEor, reserved.</TD></TR>';

stringArray[26] = 'And they arose early: and it came to pass about the spring of the day, that __PNSamuel_1__SHSamuel</a> called Saul to the top of the house, saying, __PNUp_2__SHUp</a>, that I may send thee away. And Saul arose, and they went out both of them, he and Samuel, abroad.__CPSamuel_1__PSSamuel__EE"Saul had no doubt slept there all night, as is usual in the East; and now, being the break of day, ""Samuel called to Saul on the top of the house:"" there was no calling him to the top of the house a second time; he was sleeping there, and Samuel called him up."__GHUp_2__PSUp__EFGen/19/14\');">Gen 19:14__NBGen/44/4\');">Gen 44:4__NBJos/7/13\');">Jos 7:13__NBJdg/19/28\');">Jdg 19:28__EN';
