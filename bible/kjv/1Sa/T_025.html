var stringArray = new Array();
stringArray[1] = 'And __PNSamuel_3__SHSamuel</a> died; and all the Israelites were gathered together, and __PNlamented_4__SHlamented</a> him, and buried him __PNin_his_house_5__SHin his house</a> at Ramah. And David arose, and went down to __PNthe_wilderness_6__SHthe wilderness</a> of Paran.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2944. B.C. 1060.__GHRelated_Verses2_2__PSEntire Verse.__FEAn. Ex. Is. 431.__GGSamuel_3__PSSamuel__FF1Sa/28/3\');">1Sa 28:3__AN__GHlamented_4__PSlamented__EFGen/50/11\');">Gen 50:11__NBNum/20/29\');">Num 20:29__NBDeu/34/8\');">Deu 34:8__NBAct/8/2\');">Act 8:2__AN__GGin_his_house_5__PSin his house__FF1Sa/7/17\');">1Sa 7:17__NB1Ki/2/34\');">1Ki 2:34__NB2Ch/33/20\');">2Ch 33:20__NBIsa/14/18\');">Isa 14:18__AN__GHthe_wilderness_6__PSthe wilderness__EFGen/14/6\');">Gen 14:6__NBGen/21/21\');">Gen 21:21__NBNum/10/12\');">Num 10:12__NBNum/12/16\');">Num 12:16__NBNum/13/3\');">Num 13:3__NRNum/13/26\');">26__NBPsa/120/5\');">Psa 120:5__EN';
stringArray[2] = 'And [there was] a man in __PNMaon_1__SHMaon</a>, whose __PNpossessions_were_2__SHpossessions [were]</a> in Carmel; and the __PNman_3__SHman</a> [was] very great, and he had __PNthree_thousand_4__SHthree thousand</a> sheep, and a thousand goats: and he was __PNshearing_5__SHshearing</a> his sheep in __PNCarmel_6__SHCarmel</a>.__CPMaon_1__PSMaon__FF1Sa/23/24\');">1Sa 23:24__AN__GHpossessions_were_2__PSpossessions were__FEor, business was. Carmel. Not the famous mount Carmel, in the north of Canaan, and in the tribe of Asher; but a city, on a mountain of the same name, in the south of Judah, which seems to have given name to the surrounding territory. Eusebius and Jerome inform us, that there was in their time a town called Carmelia, ten miles east from Hebron, where the Romans kept a garrison, whose position well agrees with this Carmel.__GGman_3__PSman__FFGen/26/13\');">Gen 26:13__NB2Sa/19/32\');">2Sa 19:32__NBPsa/17/14\');">Psa 17:14__NBPsa/73/3\');">Psa 73:3-7__NBLuk/16/19\');">Luk 16:19-25__AN__GHthree_thousand_4__PSthree thousand__EFGen/13/2\');">Gen 13:2__NBJob/1/3\');">Job 1:3__NBJob/42/12\');">Job 42:12__AN__GGshearing_5__PSshearing__EEThis was a very ancient custom, and appears to have been always attended with festivity. The ancient Romans, however, used to pluck off the wool from the sheep\'s backs; and hence a fleece was called vellus, a vellendo, from plucking it off. Pliny says, that in his time sheep were not shorn every where, but in some places the wool was still plucked off. __NAGen/38/13\');">Gen 38:13__NB2Sa/13/23\');">2Sa 13:23__NR2Sa/13/24\');">24__AN__GHCarmel_6__PSCarmel__EF1Sa/30/5\');">1Sa 30:5__NBJos/15/55\');">Jos 15:55__EN';
stringArray[3] = 'Now the name of the man [was] Nabal; and the name of his wife Abigail: and [she was] a woman of __PNgood_1__SHgood</a> understanding, and of a beautiful countenance: but the man __PNwas_churlish_2__SH[was] churlish</a> and evil in his doings; __PNand_he_was_3__SHand he [was]</a> of the house of Caleb.__CPgood_1__PSgood__FFPro/14/1\');">Pro 14:1__NBPro/31/26\');">Pro 31:26__NRPro/31/30\');">30__NRPro/31/31\');">31__AN__GHwas_churlish_2__PSwas churlish__EF1Sa/25/10\');">1Sa 25:10__NR1Sa/25/11\');">11__NR1Sa/25/17\');">17__NBPsa/10/3\');">Psa 10:3__NBIsa/32/5\');">Isa 32:5-7__AN__GGand_he_was_3__PSand he was__EE"Wehoo calibbee, literally, ""and he was a Calebite;"" but as the word cailev signifies a dog, the Septuagint has understood it as implying a man of canine disposition, and translated it, [kai anthropov kunikos] ""and he was a doggish man."" It is understood in the same way by the Syriac and Arabic."</TD></TR>';
stringArray[4] = 'And David heard in the wilderness that Nabal __PNdid_shear_1__SHdid shear</a> his sheep.__CPdid_shear_1__PSdid shear__FFGen/38/13\');">Gen 38:13__NB2Sa/13/23\');">2Sa 13:23__EN';
stringArray[5] = 'And David sent out ten young men, and David said unto the young men, Get you up to Carmel, and go to Nabal, and __PNgreet_him__etc__1__SHgreet him</a> in my name:__CPgreet_him__etc__1__PSgreet him, etc.__EEHeb. ask him in my name of peace. __NA1Sa/17/22\');">1Sa 17:22__NBGen/43/23\');">Gen 43:23__EN';

stringArray[7] = 'And now I have heard that thou hast shearers: now __PNthy_shepherds_1__SHthy shepherds</a> which were with us, __PNwe_hurt_2__SHwe hurt</a> them not, neither was there ought missing unto them, all the while they were in Carmel.__CPthy_shepherds_1__PSthy shepherds__EEIn those times, and at the present day, wandering Arabs, under their several chiefs, think that they have a right to exact contributions of provisions, etc., wherever they come. But David, though he lived in the wilderness like the Arab emirs, had not adopted their manners: one of them, at the head of 600 men, would have demanded, from time to time, some provision or present from Nabal\'s servants, for permitting them to feed at quiet; and would have driven them away from the watering place upon any dislike. David had done nothing of this kind; but had protected them against those who would.__GHwe_hurt_2__PSwe hurt__FEHeb. we shamed. __NA1Sa/25/15\');">1Sa 25:15__NR1Sa/25/16\');">16__NR1Sa/25/21\');">21__NB1Sa/22/2\');">1Sa 22:2__NBIsa/11/6\');">Isa 11:6-9__NBLuk/3/14\');">Luk 3:14__NBPhl/2/15\');">Phl 2:15__NBPhl/4/8\');">Phl 4:8__EN';
stringArray[8] = 'Ask thy young men, and they will shew thee. Wherefore let the young men find favour in thine eyes: for we come in __PNa_good_day_1__SHa good day</a>: give, I pray thee, whatsoever cometh to thine hand unto thy servants, and to __PNthy_son_2__SHthy son</a> David.__CPa_good_day_1__PSa good day__FFNeh/8/10\');">Neh 8:10-12__NBEst/9/19\');">Est 9:19__NBEcc/11/2\');">Ecc 11:2__NBLuk/11/41\');">Luk 11:41__NBLuk/14/12\');">Luk 14:12-14__AN__GHthy_son_2__PSthy son__EF1Sa/3/6\');">1Sa 3:6__NB1Sa/24/11\');">1Sa 24:11__EN';

stringArray[10] = 'And Nabal answered David\'s servants, and said, __PNWho_is_David_1__SHWho [is] David</a>? and who [is] the son of Jesse? __PNthere_be_2__SHthere be</a> many servants now a days that break away every man from his master.__CPWho_is_David_1__PSWho is David__FF1Sa/20/30\');">1Sa 20:30__NB1Sa/22/7\');">1Sa 22:7__NR1Sa/22/8\');">8__NBExd/5/2\');">Exd 5:2__NBJdg/9/28\');">Jdg 9:28__NB2Sa/20/1\');">2Sa 20:1__NB1Ki/12/16\');">1Ki 12:16__NBPsa/73/7\');">Psa 73:7__NRPsa/73/8\');">8__NBPsa/123/3\');">Psa 123:3__NRPsa/123/4\');">4__NBIsa/32/5\');">Isa 32:5__NRIsa/32/7\');">7__AN__GHthere_be_2__PSthere be__EF1Sa/22/2\');">1Sa 22:2__NBEcc/7/10\');">Ecc 7:10__EN';
stringArray[11] = '__PNShall_I_then_1__SHShall I then</a> take my bread, and my water, and my __PNflesh_2__SHflesh</a> that I have killed for my shearers, and __PNgive_it_3__SHgive [it]</a> unto men, __PNwhom_4__SHwhom</a> I know not whence they [be]?__CPShall_I_then_1__PSShall I then__FF1Sa/25/3\');">1Sa 25:3__NB1Sa/24/13\');">1Sa 24:13__NBDeu/8/17\');">Deu 8:17__NBJdg/8/6\');">Jdg 8:6__NBJob/31/17\');">Job 31:17__NBPsa/73/7\');">Psa 73:7__NRPsa/73/8\');">8__NB1Pe/4/9\');">1Pe 4:9__AN__GHflesh_2__PSflesh__FEHeb. slaughter.__GGgive_it_3__PSgive it__FFEcc/11/1\');">Ecc 11:1__NREcc/11/2\');">2__NBGal/6/10\');">Gal 6:10__AN__GHwhom_4__PSwhom__EF1Sa/25/14\');">1Sa 25:14__NR1Sa/25/15\');">15__NBJhn/9/29\');">Jhn 9:29__NRJhn/9/30\');">30__NB2Cr/6/9\');">2Cr 6:9__EN';

stringArray[13] = 'And David said unto his men, __PNGird_ye_1__SHGird ye</a> on every man his sword. And they girded on every man his sword; and __PNDavid_also_2__SHDavid also</a> girded on his sword: and there went up after David about four hundred men; and __PNtwo_hundred_3__SHtwo hundred</a> abode by the stuff.__CPGird_ye_1__PSGird ye__FFJos/9/14\');">Jos 9:14__NBPro/14/29\');">Pro 14:29__NBPro/16/32\');">Pro 16:32__NBPro/19/2\');">Pro 19:2__NRPro/19/11\');">11__NBPro/25/8\');">Pro 25:8__NBJam/1/19\');">Jam 1:19__NRJam/1/20\');">20__AN__GHDavid_also_2__PSDavid also__EF1Sa/24/5\');">1Sa 24:5__NR1Sa/24/6\');">6__NBRom/12/19\');">Rom 12:19-21__AN__GGtwo_hundred_3__PStwo hundred__FF1Sa/30/9\');">1Sa 30:9__NR1Sa/30/10\');">10__NR1Sa/30/21\');">21-24__EN';

stringArray[17] = 'Now therefore know and consider what thou wilt do; for __PNevil_1__SHevil</a> is determined against our master, and against all his household: for he [is such] __PNa_son_of_Belial_2__SHa son of Belial</a>, __PNthat_a_man_3__SHthat [a man]</a> cannot speak to him.__CPevil_1__PSevil__FF1Sa/20/7\');">1Sa 20:7__NR1Sa/20/9\');">9__NR1Sa/20/33\');">33__NB2Ch/25/16\');">2Ch 25:16__NBEst/7/7\');">Est 7:7__AN__GHa_son_of_Belial_2__PSa son of Belial__EF1Sa/25/25\');">1Sa 25:25__NB1Sa/2/12\');">1Sa 2:12__NBDeu/13/13\');">Deu 13:13__NBJdg/19/22\');">Jdg 19:22__NB2Sa/23/6\');">2Sa 23:6__NR2Sa/23/7\');">7__NB1Ki/21/10\');">1Ki 21:10__NR1Ki/21/13\');">13__NB2Ch/13/7\');">2Ch 13:7__AN__GGthat_a_man_3__PSthat a man__FF1Sa/20/32\');">1Sa 20:32__NR1Sa/20/33\');">33__NB2Ki/5/13\');">2Ki 5:13__NR2Ki/5/14\');">14__EN';
stringArray[18] = 'Then Abigail __PNmade_haste_1__SHmade haste</a>, and __PNtook_two_2__SHtook two</a> hundred loaves, and __PNtwo_bottles_3__SHtwo bottles</a> of wine, and __PNfive_sheep_4__SHfive sheep</a> ready dressed, and five measures of parched [corn], and an hundred __PNclusters_5__SHclusters</a> of raisins, and two hundred __PNcakes_of_figs_6__SHcakes of figs</a>, and laid [them] on asses.__CPmade_haste_1__PSmade haste__FF1Sa/25/34\');">1Sa 25:34__NBNum/16/46\');">Num 16:46-48__NBPro/6/4\');">Pro 6:4__NRPro/6/5\');">5__NBMat/5/25\');">Mat 5:25__AN__GHtook_two_2__PStook two__FEThe Eastern bread is generally both thin and small; and answers to our cakes. __NAGen/32/13\');">Gen 32:13-20__NBGen/43/11\');">Gen 43:11-14__NB2Sa/17/28\');">2Sa 17:28__NR2Sa/17/29\');">29__NBPro/18/16\');">Pro 18:16__NBPro/21/14\');">Pro 21:14__AN__GGtwo_bottles_3__PStwo bottles__EEThat is, two goatskins\' full.__GHfive_sheep_4__PSfive sheep__FENot one sheep to one hundred men.__GGclusters_5__PSclusters__EEHeb. lumps. Raisins dried in the sun. __NA2Sa/16/1\');">2Sa 16:1__AN__GHcakes_of_figs_6__PScakes of figs__FEFigs cured and then pressed together. Now all this provision was a matter of little worth; and had it been granted in the first instance, it would have perfectly satisfied David, and secured his good offices.</TD></TR>';
stringArray[19] = 'And she said unto her servants, __PNGo_1__SHGo</a> on before me; behold, I come after you. __PNBut_2__SHBut</a> she told not her husband Nabal.__CPGo_1__PSGo__FFGen/32/16\');">Gen 32:16__NRGen/32/20\');">20__AN__GHBut_2__PSBut__EFPro/31/11\');">Pro 31:11__NRPro/31/12\');">12__NRPro/31/27\');">27__EN';
stringArray[20] = 'And it was [so, as] she __PNrode_1__SHrode</a> on the ass, that __PNshe_came_down_2__SHshe came down</a> by the covert of the hill, and, behold, David and his men came down against her; and she met them.__CProde_1__PSrode__FF2Ki/4/24\');">2Ki 4:24__AN__GHshe_came_down_2__PSshe came down__FEDavid was coming down mount Paran; Abigail was coming down from Carmel.</TD></TR>';
stringArray[21] = 'Now David had said, __PNSurely_1__SHSurely</a> in vain have I kept all that this [fellow] hath in the wilderness, so that nothing was missed of all that [pertained] unto him: and __PNhe_hath_requited_2__SHhe hath requited</a> me evil for good.__CPSurely_1__PSSurely__FF1Sa/25/13\');">1Sa 25:13__NBJob/30/8\');">Job 30:8__NBPsa/37/8\');">Psa 37:8__NBEph/4/26\');">Eph 4:26__NREph/4/31\');">31__NB1Th/5/15\');">1Th 5:15__NB1Pe/2/21\');">1Pe 2:21-23__NB1Pe/3/9\');">1Pe 3:9__AN__GHhe_hath_requited_2__PShe hath requited__EFGen/44/4\');">Gen 44:4__NBPsa/35/12\');">Psa 35:12__NBPsa/38/20\');">Psa 38:20__NBPsa/109/3\');">Psa 109:3-5__NBPro/17/13\');">Pro 17:13__NBJer/18/20\');">Jer 18:20__NBRom/12/21\');">Rom 12:21__NB1Pe/2/20\');">1Pe 2:20__NB1Pe/3/17\');">1Pe 3:17__EN';
stringArray[22] = '__PNSo_and_more_1__SHSo and more</a> also do God unto the enemies of David, __PNif_I_leave_2__SHif I leave</a> of all that [pertain] to him by the morning light __PNany_that_pisseth__etc__3__SHany that pisseth</a> against the wall.__CPSo_and_more_1__PSSo and more__EENothing can justify this conduct of David, which was rash, unjust, and cruel in the extreme. David himself condemns it, and thanks God for being prevented from executing this evil. (__NA1Sa/25/32\');">1Sa 25:32-34__AN) __NA1Sa/3/17\');">1Sa 3:17__NB1Sa/14/44\');">1Sa 14:44__NB1Sa/20/13\');">1Sa 20:13__NR1Sa/20/16\');">16__NBRth/1/17\');">Rth 1:17__AN__GHif_I_leave_2__PSif I leave__EF1Sa/25/34\');">1Sa 25:34__AN__GGany_that_pisseth__etc__3__PSany that pisseth, etc.__EE"This seems to have been a proverbial expression among the Israelites; and may with the utmost propriety be read ""any male."" __NA1Ki/14/10\');">1Ki 14:10__NB1Ki/16/11\');">1Ki 16:11__NB1Ki/21/21\');">1Ki 21:21__NB2Ki/9/8\');">2Ki 9:8__AN"</TD></TR>';
stringArray[23] = 'And when Abigail saw David, she hasted, and __PNlighted_1__SHlighted</a> off the ass, and __PNfell_2__SHfell</a> before David on her face, and bowed herself to the ground,__CPlighted_1__PSlighted__FFJos/15/18\');">Jos 15:18__NBJdg/1/14\');">Jdg 1:14__AN__GHfell_2__PSfell__EF1Sa/20/41\');">1Sa 20:41__NB1Sa/24/8\');">1Sa 24:8__EN';
stringArray[24] = 'And __PNfell_1__SHfell</a> at his feet, and said, __PNUpon_2__SHUpon</a> me, my lord, [upon] me [let this] iniquity [be]: and __PNlet_thine_3__SHlet thine</a> handmaid, I pray thee, speak in thine __PNaudience_4__SHaudience</a>, and hear the words of thine handmaid.__CPfell_1__PSfell__FF2Ki/4/37\');">2Ki 4:37__NBEst/8/3\');">Est 8:3__NBMat/18/29\');">Mat 18:29__AN__GHUpon_2__PSUpon__EF1Sa/25/28\');">1Sa 25:28__NBGen/44/33\');">Gen 44:33__NRGen/44/34\');">34__NB2Sa/14/9\');">2Sa 14:9__NBPhm/1/18\');">Phm 1:18__NRPhm/1/19\');">19__AN__GGlet_thine_3__PSlet thine__FFGen/44/18\');">Gen 44:18__NB2Sa/14/12\');">2Sa 14:12__AN__GHaudience_4__PSaudience__FEHeb. ears.</TD></TR>';
stringArray[25] = 'Let not my lord, I pray thee, __PNregard_1__SHregard</a> this __PNman_of_Belial_2__SHman of Belial</a>, [even] __PNNabal_3__SHNabal</a>: for as his name [is], so [is] he; Nabal [is] his name, and folly [is] with him: but I thine handmaid saw not the young men of my lord, whom thou didst send.__CPregard_1__PSregard__EEHeb. lay it to his heart. __NA2Sa/13/33\');">2Sa 13:33__NBIsa/42/25\');">Isa 42:25__NBMal/2/2\');">Mal 2:2__AN__GHman_of_Belial_2__PSman of Belial__EF1Sa/25/17\');">1Sa 25:17__NR1Sa/25/26\');">26__AN__GGNabal_3__PSNabal__EEthat is, fool.</TD></TR>';
