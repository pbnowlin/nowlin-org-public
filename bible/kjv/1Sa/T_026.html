var stringArray = new Array();
stringArray[1] = 'And the __PNZiphites_1__SHZiphites</a> came unto Saul to Gibeah, saying, __PNDoth_not_2__SHDoth not</a> David hide himself in the hill of Hachilah, [which is] before Jeshimon?__CPZiphites_1__PSZiphites__FFJos/15/24\');">Jos 15:24__NRJos/15/55\');">55__AN__GHDoth_not_2__PSDoth not__EF1Sa/26/3\');">1Sa 26:3__NB1Sa/23/19\');">1Sa 23:19__NBPsa/54/1\');">Psa 54:1__AN; *title</TD></TR>';
stringArray[2] = 'Then __PNSaul_arose_1__SHSaul arose</a>, and went down to the wilderness of Ziph, having __PNthree_thousand_2__SHthree thousand</a> chosen men of Israel with him, to seek David in the wilderness of Ziph.__CPSaul_arose_1__PSSaul arose__FF1Sa/23/23\');">1Sa 23:23-25__NB1Sa/24/17\');">1Sa 24:17__NBPsa/38/12\');">Psa 38:12__NBPsa/140/4\');">Psa 140:4-9__AN__GHthree_thousand_2__PSthree thousand__EF1Sa/24/2\');">1Sa 24:2__EN';
stringArray[3] = 'And Saul pitched in the hill of __PNHachilah_1__SHHachilah</a>, which [is] before Jeshimon, by the way. But David abode in the wilderness, and he saw that Saul came after him into the wilderness.__CPHachilah_1__PSHachilah__FF1Sa/26/1\');">1Sa 26:1__NB1Sa/23/19\');">1Sa 23:19__EN';
stringArray[4] = 'David therefore sent out spies, and understood that Saul was come in very deed.__CPRelated_Verses1_1__PSEntire Verse.__FFJos/2/1\');">Jos 2:1__NBMat/10/16\');">Mat 10:16__EN';
stringArray[5] = 'And David arose, and came to the place where Saul had pitched: and David beheld the place where Saul lay, and __PNAbner_1__SHAbner</a> the son of Ner, the captain of his host: and Saul lay in the __PNtrench_2__SHtrench</a>, and the people pitched round about him.__CPAbner_1__PSAbner__FF1Sa/9/1\');">1Sa 9:1__NB1Sa/14/50\');">1Sa 14:50__NR1Sa/14/51\');">51__NB1Sa/17/55\');">1Sa 17:55__NB2Sa/2/8\');">2Sa 2:8-12__NB2Sa/3/7\');">2Sa 3:7__NR2Sa/3/8\');">8__NR2Sa/3/27\');">27__NR2Sa/3/33\');">33-38__NB1Ch/9/39\');">1Ch 9:39__AN__GHtrench_2__PStrench__FE"or, midst of his carriages. __NA1Sa/17/20\');">1Sa 17:20__AN; The word {maügal} never signifies a ditch or rampart, but a chariot or waggon way. Nor does it seem to denote a ring of carriages, as Buxtorf and others interpret the word; for it is not probable that Saul would encumber his army with baggage in so rapid a pursuit, nor that so mountainous a country was practicable for waggons. It appears simply to mean here, the circular encampment (from {agal,} ""round"") which these troops formed, in the midst of which, as being the place of honour, Saul reposed. An Arab camp, D\'Arvieux informs us, is always circular, when the disposition of the ground will permit, the prince being in the middle, and the troops at a respectful distance around him. Add to which, their lances are fixed near them in the ground all the day long, ready for action."</TD></TR>';
stringArray[6] = 'Then answered David and said to Ahimelech the __PNHittite_1__SHHittite</a>, and __PNto_Abishai_2__SHto Abishai</a> the son of __PNZeruiah_3__SHZeruiah</a>, brother to Joab, saying, __PNWho_will_go_4__SHWho will go</a> down with me to Saul to the camp? And Abishai said, I will go down with thee.__CPHittite_1__PSHittite__FFGen/10/15\');">Gen 10:15__NBGen/15/20\');">Gen 15:20__NB2Sa/11/6\');">2Sa 11:6__NR2Sa/11/21\');">21__NR2Sa/11/24\');">24__NB2Sa/12/9\');">2Sa 12:9__NB2Sa/23/39\');">2Sa 23:39__AN__GHto_Abishai_2__PSto Abishai__EF2Sa/2/18\');">2Sa 2:18__NB2Sa/16/9\');">2Sa 16:9__NR2Sa/16/10\');">10__NB2Sa/18/5\');">2Sa 18:5__NB2Sa/23/18\');">2Sa 23:18__NB1Ch/2/16\');">1Ch 2:16__AN__GGZeruiah_3__PSZeruiah__FF1Ch/2/15\');">1Ch 2:15__NR1Ch/2/16\');">16__AN__GHWho_will_go_4__PSWho will go__EF1Sa/14/6\');">1Sa 14:6__NR1Sa/14/7\');">7__NBJdg/7/10\');">Jdg 7:10__NRJdg/7/11\');">11__EN';
stringArray[7] = 'So David and Abishai came to the people by night: and, behold, Saul lay __PNsleeping_1__SHsleeping</a> within the trench, and his spear stuck in the ground at his bolster: but Abner and the people lay round about him.__CPsleeping_1__PSsleeping__FF1Th/5/2\');">1Th 5:2__NR1Th/5/3\');">3__EN';
stringArray[8] = 'Then said Abishai to David, __PNGod_1__SHGod</a> hath __PNdelivered_2__SHdelivered</a> thine enemy into thine hand this day: now therefore let me smite him, I pray thee, with the spear even to the earth at once, and I will not [smite] him __PNthe_second_time_3__SHthe second time</a>.__CPGod_1__PSGod__FF1Sa/26/23\');">1Sa 26:23__NB1Sa/23/14\');">1Sa 23:14__NB1Sa/24/4\');">1Sa 24:4__NR1Sa/24/18\');">18__NR1Sa/24/19\');">19__NBJos/21/44\');">Jos 21:44__NBJdg/1/4\');">Jdg 1:4__AN__GHdelivered_2__PSdelivered__FEHeb. shut up. __NA1Sa/24/18\');">1Sa 24:18__NBDeu/32/30\');">Deu 32:30__NBPsa/31/8\');">Psa 31:8__NBRom/11/32\');">Rom 11:32__AN; *marg:; __NAGal/3/22\');">Gal 3:22__NRGal/3/23\');">23__AN__GGthe_second_time_3__PSthe second time__FFNah/1/9\');">Nah 1:9__EN';
stringArray[9] = 'And David said to Abishai, Destroy him not: for __PNwho_can_stretch_1__SHwho can stretch</a> forth his hand against the LORD\'S anointed, and be guiltless?__CPwho_can_stretch_1__PSwho can stretch__FF1Sa/24/6\');">1Sa 24:6__NR1Sa/24/7\');">7__NB2Sa/1/14\');">2Sa 1:14__NR2Sa/1/16\');">16__NBPsa/105/15\');">Psa 105:15__EN';
stringArray[10] = 'David said furthermore, [As] __PNthe_LORD_liveth_1__SHthe LORD liveth</a>, the LORD shall smite him; or __PNhis_day_2__SHhis day</a> shall come to die; or __PNhe_shall_descend_3__SHhe shall descend</a> into battle, and perish.__CPthe_LORD_liveth_1__PSthe LORD liveth__FF1Sa/24/15\');">1Sa 24:15__NB1Sa/25/26\');">1Sa 25:26__NR1Sa/25/38\');">38__NBPsa/94/1\');">Psa 94:1__NRPsa/94/2\');">2__NRPsa/94/23\');">23__NBLuk/18/7\');">Luk 18:7__NBRom/12/19\');">Rom 12:19__NBRev/18/8\');">Rev 18:8__AN__GHhis_day_2__PShis day__EFGen/47/29\');">Gen 47:29__NBDeu/31/14\');">Deu 31:14__NBJob/7/1\');">Job 7:1__NBJob/14/5\');">Job 14:5__NRJob/14/14\');">14__NBPsa/37/10\');">Psa 37:10__NRPsa/37/13\');">13__NBEcc/3/2\');">Ecc 3:2__NBHbr/9/27\');">Hbr 9:27__AN__GGhe_shall_descend_3__PShe shall descend__FF1Sa/31/6\');">1Sa 31:6__NBDeu/32/35\');">Deu 32:35__EN';
stringArray[11] = 'The LORD forbid __PNthat_I_should_1__SHthat I should</a> stretch forth mine hand against the LORD\'S anointed: but, I pray thee, take thou now the spear that [is] at his bolster, and the cruse of water, and let us go.__CPthat_I_should_1__PSthat I should__FF1Sa/24/6\');">1Sa 24:6__NR1Sa/24/12\');">12__NB2Sa/1/14\');">2Sa 1:14__NR2Sa/1/16\');">16__EN';
stringArray[12] = '__PNSo_David_1__SHSo David</a> took the spear and the cruse of water from Saul\'s bolster; and they gat them away, and no man saw [it], nor knew [it], neither awaked: for they [were] all asleep; because __PNa_deep_sleep_2__SHa deep sleep</a> from the LORD was fallen upon them.__CPSo_David_1__PSSo David__FF1Sa/26/7\');">1Sa 26:7__NB1Sa/24/4\');">1Sa 24:4__AN__GHa_deep_sleep_2__PSa deep sleep__EFGen/2/21\');">Gen 2:21__NBGen/15/12\');">Gen 15:12__NBEst/6/1\');">Est 6:1__NBIsa/29/10\');">Isa 29:10__EN';
stringArray[13] = 'Then David went over to the other side, and stood on __PNthe_top_1__SHthe top</a> of an hill afar off; a great space [being] between them:__CPthe_top_1__PSthe top__FF1Sa/24/8\');">1Sa 24:8__NBJdg/9/7\');">Jdg 9:7__AN; David, by retiring to a place of safety before he called to Abner, seems to have manifested more distrust of Saul than he had done on a former occasion. Yet he desired that Saul and all Israel should be informed of his conduct at this time. Abner and his soldiers, by neglecting to guard Saul when he slept, had exposed his life, and merited to be treated as his enemies, though he confided in them as friends; for, although their sound sleep was undoubtedly supernatural, yet there might be a neglect of placing sentinels, arising from contempt of David\'s small company. Saul also deemed David his enemy, though he had before spared and protected his life.</TD></TR>';
stringArray[14] = 'And David cried to the people, and to Abner the son of Ner, saying, Answerest thou not, Abner? Then Abner answered and said, Who [art] thou [that] criest to the king?__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[15] = 'And David said to Abner, [Art] not thou a [valiant] man? and who [is] like to thee in Israel? wherefore then hast thou not kept thy lord the king? for __PNthere_came_1__SHthere came</a> one of the people in to destroy the king thy lord.__CPthere_came_1__PSthere came__FF1Sa/26/8\');">1Sa 26:8__EN';
stringArray[16] = 'This thing [is] not good that thou hast done. [As] the LORD liveth, ye [are] __PNworthy_to_die_1__SHworthy to die</a>, because ye have not kept your master, the __PNLORD_S_2__SHLORD\'S</a> anointed. And now see where the king\'s spear [is], and the cruse of water that [was] at his bolster.__CPworthy_to_die_1__PSworthy to die__EEHeb. the sons of death. __NA1Sa/20/31\');">1Sa 20:31__NB2Sa/12/5\');">2Sa 12:5__NB2Sa/19/28\');">2Sa 19:28__NBPsa/79/11\');">Psa 79:11__NBPsa/102/20\');">Psa 102:20__AN; *margins; __NAEph/2/3\');">Eph 2:3__AN__GHLORD_S_2__PSLORD\'S__EF1Sa/26/9\');">1Sa 26:9__NR1Sa/26/11\');">11__NB1Sa/24/6\');">1Sa 24:6__EN';
stringArray[17] = 'And Saul knew David\'s voice, and said, __PNIs_this_thy_1__SH[Is] this thy</a> voice, my son David? And David said, [It is] my voice, my lord, O king.__CPIs_this_thy_1__PSIs this thy__FF1Sa/24/8\');">1Sa 24:8__NR1Sa/24/16\');">16__EN';
stringArray[18] = 'And he said, __PNWherefore_1__SHWherefore</a> doth my lord thus pursue after his servant? for __PNwhat_have_I_2__SHwhat have I</a> done? or what evil [is] in mine hand?__CPWherefore_1__PSWherefore__FF1Sa/24/9\');">1Sa 24:9__NR1Sa/24/11\');">11-14__NBPsa/7/3\');">Psa 7:3-5__NBPsa/35/7\');">Psa 35:7__NBPsa/69/4\');">Psa 69:4__AN__GHwhat_have_I_2__PSwhat have I__EF1Sa/17/29\');">1Sa 17:29__NBJhn/8/46\');">Jhn 8:46__NBJhn/10/32\');">Jhn 10:32__NBJhn/18/23\');">Jhn 18:23__EN';
stringArray[19] = 'Now therefore, I pray thee, __PNlet_my_lord_1__SHlet my lord</a> the king hear the words of his servant. If the LORD have __PNstirred_2__SHstirred</a> thee up against me, let him __PNaccept_3__SHaccept</a> an offering: but if [they be] the children of men, __PNcursed_4__SHcursed</a> [be] they before the LORD; for __PNthey_have_driven_5__SHthey have driven</a> me out this day from __PNabiding_6__SHabiding</a> in __PNthe_inheritance_7__SHthe inheritance</a> of the LORD, saying, Go, serve other gods.__CPlet_my_lord_1__PSlet my lord__FF1Sa/25/24\');">1Sa 25:24__NBGen/44/18\');">Gen 44:18__AN__GHstirred_2__PSstirred__EF1Sa/16/14\');">1Sa 16:14-23__NB1Sa/18/10\');">1Sa 18:10__NB2Sa/16/11\');">2Sa 16:11__NB2Sa/24/1\');">2Sa 24:1__NB1Ki/22/22\');">1Ki 22:22__NB1Ch/21/1\');">1Ch 21:1__AN__GGaccept_3__PSaccept__EEHeb. smell. __NAGen/8/21\');">Gen 8:21__NBLev/26/31\');">Lev 26:31__NBPsa/119/1\');">Psa 119:1-8__AN__GHcursed_4__PScursed__EFPro/6/16\');">Pro 6:16-19__NBPro/30/10\');">Pro 30:10__NBGal/1/8\');">Gal 1:8__NRGal/1/9\');">9__NBGal/5/12\');">Gal 5:12__NB2Ti/4/14\');">2Ti 4:14__AN__GGthey_have_driven_5__PSthey have driven__FFDeu/4/27\');">Deu 4:27__NRDeu/4/28\');">28__NBJos/22/25\');">Jos 22:25-27__NBPsa/42/1\');">Psa 42:1__NRPsa/42/2\');">2__NBPsa/120/5\');">Psa 120:5__NBIsa/60/5\');">Isa 60:5__NBRom/14/15\');">Rom 14:15__AN__GHabiding_6__PSabiding__FEHeb. cleaving.__GGthe_inheritance_7__PSthe inheritance__FF2Sa/14/16\');">2Sa 14:16__NB2Sa/20/19\');">2Sa 20:19__EN';
stringArray[20] = 'Now therefore, __PNlet_not_my_1__SHlet not my</a> blood fall to the earth before the face of the LORD: for __PNthe_king_2__SHthe king</a> of Israel is come out to seek __PNa_flea_3__SHa flea</a>, as when one doth hunt __PNa_partridge_4__SHa partridge</a> in the mountains.__CPlet_not_my_1__PSlet not my__FF1Sa/2/9\');">1Sa 2:9__NB1Sa/25/29\');">1Sa 25:29__AN__GHthe_king_2__PSthe king__EF1Sa/24/14\');">1Sa 24:14__NBMat/26/47\');">Mat 26:47__NRMat/26/55\');">55__AN__GGa_flea_3__PSa flea__EE"Parosh, (in Arabic borghooth, Syriac, poorthano, ) the well known little contemptible and troublesome insect, the flea, seems to be so called from its agility in leaping and skipping, from para, ""free,"" and raash, ""to leap, bound."" David, by comparing himself to this insect, seems to import, that while it would cost Saul much pains to catch him, he would obtain but very little advantage from it."__GHa_partridge_4__PSa partridge__FEKorai certainly denotes the partridge, which is called in Arabic, kiräa. It seems to be so called from the cry or cur which it utters when calling its young.</TD></TR>';
stringArray[21] = 'Then said Saul, __PNI_have_sinned_1__SHI have sinned</a>: return, my son David: for __PNI_will_no_2__SHI will no</a> more do thee harm, because __PNmy_soul_3__SHmy soul</a> was precious in thine eyes this day: behold, I have played the fool, and have erred exceedingly.__CPI_have_sinned_1__PSI have sinned__FF1Sa/15/24\');">1Sa 15:24__NR1Sa/15/30\');">30__NB1Sa/24/17\');">1Sa 24:17__NBExd/9/27\');">Exd 9:27__NBNum/22/34\');">Num 22:34__NBMat/27/4\');">Mat 27:4__AN__GHI_will_no_2__PSI will no__EF1Sa/27/4\');">1Sa 27:4__AN__GGmy_soul_3__PSmy soul__FF1Sa/26/24\');">1Sa 26:24__NB1Sa/18/30\');">1Sa 18:30__NBPsa/49/8\');">Psa 49:8__NBPsa/116/15\');">Psa 116:15__EN';
stringArray[22] = 'And David answered and said, Behold the king\'s spear! and let one of the young men come over and fetch it.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[23] = 'The LORD __PNrender_1__SHrender</a> to every man his righteousness and his faithfulness: for the LORD delivered thee into [my] hand to day, but __PNI_would_not_2__SHI would not</a> stretch forth mine hand against the LORD\'S anointed.__CPrender_1__PSrender__FF1Ki/8/32\');">1Ki 8:32__NBNeh/13/14\');">Neh 13:14__NBPsa/7/8\');">Psa 7:8__NRPsa/7/9\');">9__NBPsa/18/20\');">Psa 18:20-26__AN__GHI_would_not_2__PSI would not__EF1Sa/26/9\');">1Sa 26:9__NR1Sa/26/11\');">11__NB1Sa/24/6\');">1Sa 24:6__NR1Sa/24/7\');">7__EN';
stringArray[24] = 'And, behold, __PNas_thy_life_1__SHas thy life</a> was much set by this day in mine eyes, so let my life be much set by in the eyes of the LORD, and __PNlet_him_deliver_2__SHlet him deliver</a> me out of all tribulation.__CPas_thy_life_1__PSas thy life__FFPsa/18/25\');">Psa 18:25__NBMat/5/7\');">Mat 5:7__NBMat/7/2\');">Mat 7:2__AN__GHlet_him_deliver_2__PSlet him deliver__EFGen/48/16\');">Gen 48:16__NBPsa/18/1\');">Psa 18:1__AN; *title; __NAPsa/18/48\');">Psa 18:48__NBPsa/34/17\');">Psa 34:17__NRPsa/34/18\');">18__NBPsa/144/2\');">Psa 144:2__NBAct/14/22\');">Act 14:22__NB2Cr/1/9\');">2Cr 1:9__NR2Cr/1/10\');">10__NB2Th/3/2\');">2Th 3:2__NBRev/7/14\');">Rev 7:14__EN';
stringArray[25] = 'Then Saul said to David, __PNBlessed_1__SHBlessed</a> [be] thou, my son David: thou shalt both do great [things], and also shalt still __PNprevail_2__SHprevail</a>. __PNSo_David_3__SHSo David</a> went on his way, and Saul returned to his place.__CPBlessed_1__PSBlessed__FF1Sa/24/19\');">1Sa 24:19__NBNum/24/9\');">Num 24:9__NRNum/24/10\');">10__AN__GHprevail_2__PSprevail__EFGen/32/28\');">Gen 32:28__NBIsa/54/17\');">Isa 54:17__NBHsa/12/4\');">Hsa 12:4__NBRom/8/35\');">Rom 8:35__NRRom/8/37\');">37__AN__GGSo_David_3__PSSo David__FF1Sa/24/22\');">1Sa 24:22__NBPro/26/25\');">Pro 26:25__EN';
