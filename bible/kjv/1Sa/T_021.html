var stringArray = new Array();
stringArray[1] = 'Then came David to __PNNob_1__SHNob</a> __PNto_Ahimelech_2__SHto Ahimelech</a> the priest: and Ahimelech was __PNafraid_3__SHafraid</a> at the meeting of David, and said unto him, Why [art] thou alone, and no man with thee?__CPNob_1__PSNob__EE"Nob appears to have been a sacerdotal city of Benjamin or Ephraim. Jerome says, that in his time the ruins of it might be seen not far from Diospolis or Lydda. But the Rabbins assert that Jerusalem might be seen from this town. The tabernacle resided some time at Nob; and after it was destroyed, it was removed to Gibeon; ""and the day of Nob and Gibeon were fifty-seven years."" Maimonides in Bethhabbechirah, c. 1. __NA1Sa/22/19\');">1Sa 22:19__NBNeh/11/32\');">Neh 11:32__NBIsa/10/32\');">Isa 10:32__AN"__GHto_Ahimelech_2__PSto Ahimelech__EF1Sa/14/3\');">1Sa 14:3__AN; called Ahiah. __NA1Sa/22/9\');">1Sa 22:9-19__AN; called also Abiathar. __NAMar/2/26\');">Mar 2:26__AN__GGafraid_3__PSafraid__FF1Sa/16/4\');">1Sa 16:4__EN';
stringArray[2] = 'And David said unto Ahimelech the priest, __PNThe_king_1__SHThe king</a> hath commanded me a business, and hath said unto me, Let no man know any thing of the business whereabout I send thee, and what I have commanded thee: and I have appointed [my] servants to such and such a place.__CPThe_king_1__PSThe king__EE"The whole of this is a gross falsehood; and which was attended with the most fatal consequences. It is well known that from all antiquity it was held no crime to tell a lie in order to save life. Thus Diphilon [Hypo lambano to pseudas epi sotevea legomenon, ouden peripoieisthai duscheres.] ""I hold it right to tell a lie for safety: nothing should be avoided to save life."" A heathen may say or sing thus: but no Christian can act thus and save his soul, though he may save his life. __NA1Sa/19/17\');">1Sa 19:17__NB1Sa/22/22\');">1Sa 22:22__NBGen/27/20\');">Gen 27:20__NRGen/27/24\');">24__NB1Ki/13/18\');">1Ki 13:18__NBPsa/119/29\');">Psa 119:29__NBGal/2/12\');">Gal 2:12__NBCol/3/9\');">Col 3:9__AN"</TD></TR>';
stringArray[3] = 'Now therefore what is __PNunder_thine_1__SHunder thine</a> hand? give [me] five [loaves of] bread in mine hand, or what there is __PNpresent_2__SHpresent</a>.__CPunder_thine_1__PSunder thine__FF1Sa/21/4\');">1Sa 21:4__NBJdg/9/29\');">Jdg 9:29__NBIsa/3/6\');">Isa 3:6__AN__GHpresent_2__PSpresent__FEHeb. found.</TD></TR>';
stringArray[4] = 'And the priest answered David, and said, [There is] no common bread under mine hand, but there is __PNhallowed_bread_1__SHhallowed bread</a>; __PNif_the_young_2__SHif the young</a> men have kept themselves at least from women.__CPhallowed_bread_1__PShallowed bread__FF1Sa/21/6\');">1Sa 21:6__NBExd/25/30\');">Exd 25:30__NBLev/24/5\');">Lev 24:5-9__NBMat/12/3\');">Mat 12:3__NRMat/12/4\');">4__AN__GHif_the_young_2__PSif the young__EFExd/19/15\');">Exd 19:15__NBZec/7/3\');">Zec 7:3__NB1Cr/7/5\');">1Cr 7:5__EN';
stringArray[5] = 'And David answered the priest, and said unto him, Of a truth women [have been] kept from us about these three days, since I came out, and __PNthe_vessels_1__SHthe vessels</a> of the young men are holy, and [the bread is] __PNin_a_manner_2__SHin a manner</a> common, __PNyea__though_it_were_sanctified_this_day_in_the_vessel_3__SHyea, though it were sanctified this day in the vessel</a>.__CPthe_vessels_1__PSthe vessels__FFAct/9/15\');">Act 9:15__NB1Th/4/3\');">1Th 4:3__NR1Th/4/4\');">4__NB2Ti/2/20\');">2Ti 2:20__NR2Ti/2/21\');">21__NB1Pe/3/17\');">1Pe 3:17__AN__GHin_a_manner_2__PSin a manner__EFLev/24/9\');">Lev 24:9__AN__GGyea__though_it_were_sanctified_this_day_in_the_vessel_3__PSyea, though it were sanctified this day in the vessel__EEor, especially when this day there is other sanctified in the vessel. __NALev/8/26\');">Lev 8:26__EN';
stringArray[6] = 'So the priest __PNgave_him_1__SHgave him</a> hallowed [bread]: for there was no bread there but the shewbread, that was taken from before the LORD, to put __PNhot_bread_2__SHhot bread</a> in the day when it was taken away.__CPgave_him_1__PSgave him__FFMat/12/3\');">Mat 12:3__NRMat/12/4\');">4__NBMar/2/25\');">Mar 2:25-27__NBLuk/6/3\');">Luk 6:3__NRLuk/6/4\');">4__AN__GHhot_bread_2__PShot bread__EFLev/24/5\');">Lev 24:5-9__EN';
stringArray[7] = 'Now a certain man of the servants of Saul [was] there that day, __PNdetained_1__SHdetained</a> before the LORD; and his name [was] __PNDoeg_2__SHDoeg</a>, an Edomite, the chiefest of the __PNherdmen_3__SHherdmen</a> that [belonged] to Saul.__CPdetained_1__PSdetained__FFJer/7/9\');">Jer 7:9-11__NBEze/33/31\');">Eze 33:31__NBAmo/8/5\');">Amo 8:5__NBMat/15/8\');">Mat 15:8__NBAct/21/26\');">Act 21:26__NRAct/21/27\');">27__AN__GHDoeg_2__PSDoeg__EF1Sa/22/9\');">1Sa 22:9__NBPsa/52/1\');">Psa 52:1__AN; *title__GGherdmen_3__PSherdmen__FF1Sa/11/5\');">1Sa 11:5__NBGen/13/7\');">Gen 13:7__NRGen/13/8\');">8__NBGen/26/20\');">Gen 26:20__NB1Ch/27/29\');">1Ch 27:29__NB2Ch/26/10\');">2Ch 26:10__EN';
stringArray[8] = 'And David said unto Ahimelech, And is there not here under thine hand spear or sword? for I have neither brought my sword nor my weapons with me, because the king\'s business required haste.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[9] = 'And the priest said, __PNThe_sword_1__SHThe sword</a> of Goliath the Philistine, whom thou slewest in __PNthe_valley_2__SHthe valley</a> of Elah, __PNbehold_3__SHbehold</a>, it [is here] wrapped in a cloth __PNbehind_4__SHbehind</a> the ephod: if thou wilt take that, take [it]: for [there is] no other save that here. And David said, [There is] none like that; give it me.__CPThe_sword_1__PSThe sword__FF1Sa/17/51\');">1Sa 17:51-54__AN__GHthe_valley_2__PSthe valley__EF1Sa/17/2\');">1Sa 17:2__NR1Sa/17/50\');">50__AN__GGbehold_3__PSbehold__FF1Sa/31/10\');">1Sa 31:10__AN__GHbehind_4__PSbehind__EFExd/28/6\');">Exd 28:6-14__EN';
stringArray[10] = 'And David arose, and __PNfled_1__SHfled</a> that day for fear of Saul, and went to __PNAchish_2__SHAchish</a> the king of __PNGath_3__SHGath</a>.__CPfled_1__PSfled__FF1Sa/27/1\');">1Sa 27:1__NB1Ki/19/3\');">1Ki 19:3__NBJer/26/21\');">Jer 26:21__AN__GHAchish_2__PSAchish__FEor, Abimelech. __NA1Sa/27/2\');">1Sa 27:2__NBPsa/34/1\');">Psa 34:1__AN; *title__GGGath_3__PSGath__EEJerome says there was a large town called Gath, in the way from Eleutheropolis to Gaza; and Eusebius speaks of another Gath, five miles from Eleutheropolis, towards Lydda, (and consequently different from that mentioned by Jerome;) and also of another Gath, between Jamnia and Antipatris. It appears to have been the extreme boundary of the Philistine territory in one direction, as Ekron was on the other, (__NA1Sa/7/14\');">1Sa 7:14__NB1Sa/17/52\');">17:52__AN,) and lay near Mareshah, (__NA2Ch/11/8\');">2Ch 11:8__AN. __NAMic/1/14\');">Mic 1:14__AN,) which agrees pretty well with the position assigned it by Jerome. But Reland and Dr. Wells agree with Eusebius; and the authors of the Universal History (b. i. c. 7) place it about six miles form Jamnia, fourteen south of Joppa, and thirty-two west of Jerusalem.</TD></TR>';
stringArray[11] = 'And __PNthe_servants_1__SHthe servants</a> of Achish said unto him, [Is] not this David __PNthe_king_2__SHthe king</a> of the land? did they not sing one to another of him in dances, saying, Saul hath slain his thousands, and David his ten thousands?__CPthe_servants_1__PSthe servants__FFPsa/56/1\');">Psa 56:1__AN; *title__GHthe_king_2__PSthe king__EF1Sa/16/1\');">1Sa 16:1__NB1Sa/18/7\');">1Sa 18:7__NR1Sa/18/8\');">8__NB1Sa/29/5\');">1Sa 29:5__EN';
stringArray[12] = 'And David __PNlaid_up_1__SHlaid up</a> these words in his heart, and was __PNsore_2__SHsore</a> afraid of Achish the king of Gath.__CPlaid_up_1__PSlaid up__FFPsa/119/11\');">Psa 119:11__NBLuk/2/19\');">Luk 2:19__NRLuk/2/51\');">51__AN__GHsore_2__PSsore__EF1Sa/21/10\');">1Sa 21:10__NBGen/12/11\');">Gen 12:11-13__NBGen/26/7\');">Gen 26:7__NBPsa/34/4\');">Psa 34:4__NBPsa/56/3\');">Psa 56:3__EN';
