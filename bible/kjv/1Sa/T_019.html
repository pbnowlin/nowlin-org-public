stringArray[13] = 'And Michal took __PNan_image_1__SHan image</a>, and laid [it] in the bed, and put __PNa_pillow_2__SHa pillow</a> of goats\' [hair] for his bolster, and covered [it] with a cloth.__CPan_image_1__PSan image__EEHeb. teraphim. __NAGen/31/19\');">Gen 31:19__AN; *marg:; __NAJdg/17/5\');">Jdg 17:5__NBJdg/18/14\');">Jdg 18:14__NRJdg/18/17\');">17__NBHsa/3/4\');">Hsa 3:4__AN__GHa_pillow_2__PSa pillow__FE"Rather, ""the net-work of goat\'s hair at its (the Teraphim\'s) pillow;"" for the kevir, (whence the Chaldee and Syriac kavreetho, a honey-comb, from its net-like form), seems to have been a kind of mosquito-net, which, says Dr. Shaw, is ""a close curtain of gauze, used all over the East, by people of fashion, to keep out the flies."" That they had such anciently cannot be doubted. Thus when Judith had beheaded Holofernes in his bed, (__NA1Sa/13/9\');">1Sa 13:9__AN, __NA1Sa/13/15\');">15__AN) ""she pulled down the canopy (or the mosquito net, [ ] from [ ] a gnat, or mosquito, whence our word canopy) wherein he did lie in his drunkenness, from the pillars."""</TD></TR>';

stringArray[16] = '__PNAnd_when_1__SHAnd when</a> the messengers were come in, behold, [there was] an image in the bed, with a pillow of goats\' [hair] for his bolster.__CPAnd_when_1__PSAnd when__EE"It is highly probable that David, when supposed to be sick, was thought to be hid in the harem or chamber of Michal. ""The harems,"" says De La Motraye, ""are sanctuaries, as sacred and inviolable, for persons pursed by justice for any crime, debt, etc., as the Roman Catholic churches in Italy, Spain, Portugal, etc."" Thus we find, that to effect his purpose, Saul sent messengers to Michal, but they treated her harem with too much respect to enter it at first; but being authorised by Saul, they entered even into her chamber; and during the delay occasioned by respect for the privacy of Michal, David escaped."</TD></TR>';
