stringArray[2] = 'And __PNDavid_1__SHDavid</a> arose, and he passed over with __PNthe_six_2__SHthe six</a> hundred men that [were] with him unto __PNAchish_3__SHAchish</a>, the son of Maoch, king of Gath.__CPDavid_1__PSDavid__EEThis measure of David\'s, in uniting himself to the enemies of his God and people, was highly blameable; was calculated to alienate the affections of the Israelites; and led to equivocation, if not downright falsehood.__GHthe_six_2__PSthe six__EF1Sa/25/13\');">1Sa 25:13__NB1Sa/30/8\');">1Sa 30:8__AN__GGAchish_3__PSAchish__FF1Sa/21/10\');">1Sa 21:10__NB1Ki/2/40\');">1Ki 2:40__EN';
stringArray[3] = 'And David dwelt with Achish at Gath, he and his men, every man with his household, [even] David __PNwith_his_two_1__SHwith his two</a> wives, Ahinoam the Jezreelitess, and Abigail the Carmelitess, Nabal\'s wife.__CPwith_his_two_1__PSwith his two__FF1Sa/25/3\');">1Sa 25:3__NR1Sa/25/18\');">18-35__NR1Sa/25/42\');">42__NR1Sa/25/43\');">43__NB1Sa/30/5\');">1Sa 30:5__EN';

stringArray[5] = 'And David said unto Achish, If I have now found grace in thine eyes, let them give me a place in __PNsome_town_1__SHsome town</a> in the country, that I may dwell there: for why should thy servant dwell in the royal city with thee?__CPsome_town_1__PSsome town__FFGen/46/34\');">Gen 46:34__NB2Cr/6/17\');">2Cr 6:17__EN';
stringArray[6] = 'Then Achish gave him __PNZiklag_1__SHZiklag</a> that day: wherefore Ziklag pertaineth unto the kings of Judah unto this day.__CPZiklag_1__PSZiklag__EEZiklag was at first given to the tribe of Judah, but was afterwards ceded to that of Simeon; but as it bordered on the Philistines, if they had ever been expelled, they had retaken it. Eusebius simply says it was situated in the south of Canaan. __NA1Sa/30/1\');">1Sa 30:1__NR1Sa/30/14\');">14__NB1Sa/19/5\');">1Sa 19:5__NB2Sa/1/1\');">2Sa 1:1__NB1Ch/4/30\');">1Ch 4:30__NB1Ch/12/1\');">1Ch 12:1__NR1Ch/12/20\');">20__NBNeh/11/28\');">Neh 11:28__EN';

stringArray[8] = 'And David and his men went up, and invaded __PNthe_Geshurites_3__SHthe Geshurites</a>, and the __PNGezrites_4__SHGezrites</a>, and __PNthe_Amalekites_5__SHthe Amalekites</a>: for those [nations were] of old the inhabitants of the land, __PNas_thou_goest_6__SHas thou goest</a> to Shur, even unto the land of Egypt.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2948. B.C. 1056.__GHRelated_Verses2_2__PSEntire Verse.__FEAn. Ex. Is. 435.__GGthe_Geshurites_3__PSthe Geshurites__FFJos/13/2\');">Jos 13:2__NRJos/13/13\');">13__NB2Sa/13/37\');">2Sa 13:37__NR2Sa/13/38\');">38__NB2Sa/14/23\');">2Sa 14:23__NR2Sa/14/32\');">32__NB2Sa/15/8\');">2Sa 15:8__NB1Ch/2/23\');">1Ch 2:23__AN__GHGezrites_4__PSGezrites__FEor, Gerzites. These people seem to be the Gerrhenians, ((2 Mac 13:24) whose chief city, Gerrha, is mentioned by Strabo as lying between Gaza and Pelusium in Egypt.__GGthe_Amalekites_5__PSthe Amalekites__FFJos/16/10\');">Jos 16:10__NBJdg/1/29\');">Jdg 1:29__NB1Ki/9/15\');">1Ki 9:15-17__AN__GHas_thou_goest_6__PSas thou goest__EF1Sa/15/7\');">1Sa 15:7__NR1Sa/15/8\');">8__NB1Sa/30/1\');">1Sa 30:1__NBExd/17/14\');">Exd 17:14-16__EN';
stringArray[9] = 'And David smote the land, and __PNleft_neither_1__SHleft neither</a> man nor woman alive, and took away the sheep, and the oxen, and the asses, __PNand_the_camels_2__SHand the camels</a>, and the apparel, and returned, and came to Achish.__CPleft_neither_1__PSleft neither__FF1Sa/15/7\');">1Sa 15:7__NBGen/16/7\');">Gen 16:7__NBGen/25/18\');">Gen 25:18__NBExd/15/22\');">Exd 15:22__AN__GHand_the_camels_2__PSand the camels__EF1Sa/15/3\');">1Sa 15:3__NBDeu/25/17\');">Deu 25:17-19__NBJos/6/21\');">Jos 6:21__EN';
stringArray[10] = 'And Achish said, __PNWhither__etc__1__SHWhither</a> have ye made a road to day? __PNAnd_David_2__SHAnd David</a> said, __PNAgainst_3__SHAgainst</a> the south of Judah, and against the south of __PNthe_Jerahmeelites_4__SHthe Jerahmeelites</a>, and against the south of the __PNKenites_5__SHKenites</a>.__CPWhither__etc__1__PSWhither, etc.__EEor, Did you not make a road.__GHAnd_David_2__PSAnd David__EF1Sa/21/2\');">1Sa 21:2__NBGen/27/19\');">Gen 27:19__NRGen/27/20\');">20__NRGen/27/24\');">24__NBJos/2/4\');">Jos 2:4-6__NB2Sa/17/20\');">2Sa 17:20__NBPsa/119/29\');">Psa 119:29__NRPsa/119/163\');">163__NBPro/29/25\');">Pro 29:25__NBGal/2/11\');">Gal 2:11-13__NBEph/4/25\');">Eph 4:25__AN__GGAgainst_3__PSAgainst__EEDavid here meant the Geshurites, and Gezrites, and Amalekites, which people occupied that part of the country which lies to the south of Judah. But Achish, as was intended, understood him in a different sense, and believed that he had attacked his own countrymen. David\'s answer, therefore, though not an absolute falsehood, was certainly an equivocation intended to deceive, and therefore incompatible with that sense of truth and honour which became him as a prince, and a professor of true religion. From these, and similar passages, we may observe the strict impartiality of the Sacred Scriptures. They present us with the most faithful delineation of human nature; they exhibit the frailties of kings, priests, and prophets, with equal truth; and examples of vice and frailty, as well as of piety and virtue, are held up, that we may guard against the errors to which the best men are exposed.__GHthe_Jerahmeelites_4__PSthe Jerahmeelites__EF1Ch/2/9\');">1Ch 2:9__NR1Ch/2/25\');">25__AN__GGKenites_5__PSKenites__FF1Sa/15/6\');">1Sa 15:6__NBNum/24/21\');">Num 24:21__NBJdg/1/16\');">Jdg 1:16__NBJdg/4/11\');">Jdg 4:11__NBJdg/5/24\');">Jdg 5:24__EN';
