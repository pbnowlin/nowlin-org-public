stringArray[4] = 'Then said they, What [shall be] the trespass offering which we shall return to him? They answered, __PNFive_golden_1__SHFive golden</a> emerods, and five golden mice, [according to] the number of the lords of the Philistines: for one plague [was] on __PNyou_all_2__SHyou all</a>, and on your lords.__CPFive_golden_1__PSFive golden__FF1Sa/6/5\');">1Sa 6:5__NR1Sa/6/17\');">17__NR1Sa/6/18\');">18__NB1Sa/5/6\');">1Sa 5:6__NR1Sa/5/9\');">9__NBExd/12/35\');">Exd 12:35__NBJos/13/3\');">Jos 13:3__NBJdg/3/3\');">Jdg 3:3__AN__GHyou_all_2__PSyou all__FEHeb. them.</TD></TR>';
stringArray[5] = 'Wherefore ye shall make images of your emerods, and images of your __PNmice_1__SHmice</a> that mar the land; and ye shall __PNgive_glory_2__SHgive glory</a> unto the God of Israel: peradventure he will __PNlighten_3__SHlighten</a> his hand from off you, and from __PNoff_your_4__SHoff your</a> gods, and from off your land.__CPmice_1__PSmice__EEBochart has collected many curious accounts relative to the terrible devastations made by these mischievous animals. William, Archbishop of Tyre, records, that in the beginning of the twelfth century, a penitential council was held at Naplouse, where five and twenty canons were framed for the correction of the manners of the inhabitants of the Christian kingdom of Jerusalem, who they apprehended had provoked to bring upon them the calamities of earthquakes, war, and famine. This last he ascribes to locusts and devouring mice, which had for four years together so destroyed the fruits of the earth as to cause an almost total failure of their crops. It was customary for the ancient heathen to offer to their gods such monuments of their deliverance as represented the evils from which they had been rescued; and Tavernier informs us, that among the Indians, when a pilgrim goes to one of the pagodas for a cure, he brings the figure of the member affected, made of gold, silver, or copper, according to his circumstanc__GHgive_glory_2__PSgive glory__EFJos/7/19\');">Jos 7:19__NBPsa/18/44\');">Psa 18:44__NBPsa/66/3\');">Psa 66:3__AN; *marg:; __NAIsa/42/12\');">Isa 42:12__NBJer/3/13\');">Jer 3:13__NBJer/13/16\');">Jer 13:16__NBMal/2/2\');">Mal 2:2__NBJhn/9/24\');">Jhn 9:24__NBRev/11/13\');">Rev 11:13__NBRev/16/9\');">Rev 16:9__AN__GGlighten_3__PSlighten__FF1Sa/5/6\');">1Sa 5:6__NR1Sa/5/11\');">11__NBPsa/32/4\');">Psa 32:4__NBPsa/39/10\');">Psa 39:10__AN__GHoff_your_4__PSoff your__EF1Sa/5/3\');">1Sa 5:3__NR1Sa/5/4\');">4__NR1Sa/5/7\');">7__NBExd/12/12\');">Exd 12:12__NBNum/33/4\');">Num 33:4__NBIsa/19/1\');">Isa 19:1__EN';

stringArray[19] = 'And __PNhe_smote_1__SHhe smote</a> the men of Bethshemesh, because they had looked into the ark of the LORD, even he smote of the people __PNfifty_thousand_2__SHfifty thousand</a> and threescore and ten men: and the people lamented, because the LORD had smitten [many] of the people with a great slaughter.__CPhe_smote_1__PShe smote__FFExd/19/21\');">Exd 19:21__NBLev/10/1\');">Lev 10:1-3__NBNum/4/4\');">Num 4:4__NRNum/4/5\');">5__NRNum/4/15\');">15__NRNum/4/20\');">20__NBDeu/29/29\');">Deu 29:29__NB2Sa/6/7\');">2Sa 6:7__NB1Ch/13/9\');">1Ch 13:9__NR1Ch/13/10\');">10__NBCol/2/18\');">Col 2:18__NB1Pe/4/17\');">1Pe 4:17__AN__GHfifty_thousand_2__PSfifty thousand__FE"As it is very improbable that the village of Beth-shemesh should contain, or be capable of employing, 50,070 men in the fields at wheat harvest, much less that they could all peep into the ark, and from the uncommon manner in which it is expressed in the original, it is generally allowed that there is some corruption in the text, or that some explanatory word is omitted. The Hebrew is shivim ish, chamishim aileph ish, literally, ""seventy men, fifty thousand men:"" so LXX. [ .] Vulgate, septuaginta viros, et quinquaginta millia plebis, ""70 (chief) men, and 50,000 common people."" Targum, besabey âmma, ""of the elders of the people 70 men, ovekahala, and in the congregation 50,000 men."" But the Syriac, chamsho alphin weshivin gavrin, ""5,000 and 70 men;"" with which the Arabic agrees; while Josephus has only [ ] seventy men; and three reputable MSS. of Dr. Kennicott\'s also omit ""50,000 men."" Some learned men, however, would render, by supplying [Mêm] mem, ""70 men; fifty out of a thousand;"" which supposes about 1,400"</TD></TR>';
