var stringArray = new Array();
stringArray[1] = 'And it came to pass, when David and his men __PNwere_come_1__SHwere come</a> to Ziklag __PNon_the_third_2__SHon the third</a> day, that __PNthe_Amalekites_3__SHthe Amalekites</a> had invaded the south, and Ziklag, and smitten Ziklag, and burned it with fire;__CPwere_come_1__PSwere come__FF1Sa/29/11\');">1Sa 29:11__NB2Sa/1/2\');">2Sa 1:2__AN__GHon_the_third_2__PSon the third__FEThis was the third day after he had left the Philistine army at Aphek, from which place, Calmet supposes, Ziklag was distant more than thirty leagues.__GGthe_Amalekites_3__PSthe Amalekites__FF1Sa/15/7\');">1Sa 15:7__NB1Sa/27/8\');">1Sa 27:8-10__NBGen/24/62\');">Gen 24:62__NBJos/11/6\');">Jos 11:6__EN';

stringArray[6] = 'And David __PNwas_greatly_1__SHwas greatly</a> distressed; for __PNthe_people_2__SHthe people</a> spake of stoning him, because the soul of all the people was __PNgrieved_3__SHgrieved</a>, every man for his sons and for his daughters: but __PNDavid_4__SHDavid</a> encouraged himself in the LORD his God.__CPwas_greatly_1__PSwas greatly__FFGen/32/7\');">Gen 32:7__NBPsa/25/17\');">Psa 25:17__NBPsa/42/7\');">Psa 42:7__NBPsa/116/3\');">Psa 116:3__NRPsa/116/4\');">4__NRPsa/116/10\');">10__NB2Cr/1/8\');">2Cr 1:8__NR2Cr/1/9\');">9__NB2Cr/4/8\');">2Cr 4:8__NB2Cr/7/5\');">2Cr 7:5__AN__GHthe_people_2__PSthe people__EFExd/17/4\');">Exd 17:4__NBNum/14/10\');">Num 14:10__NBPsa/62/9\');">Psa 62:9__NBMat/21/9\');">Mat 21:9__NBMat/27/22\');">Mat 27:22__AN__GGgrieved_3__PSgrieved__EEHeb. bitter. __NA1Sa/1/10\');">1Sa 1:10__NBJdg/18/25\');">Jdg 18:25__NB2Sa/17/8\');">2Sa 17:8__NB2Ki/4/27\');">2Ki 4:27__AN; *margins__GHDavid_4__PSDavid__EFJob/13/15\');">Job 13:15__NBPsa/18/6\');">Psa 18:6__NBPsa/26/1\');">Psa 26:1__NRPsa/26/2\');">2__NBPsa/27/1\');">Psa 27:1-3__NBPsa/34/1\');">Psa 34:1-8__NBPsa/40/1\');">Psa 40:1__NRPsa/40/2\');">2__NBPsa/42/5\');">Psa 42:5__NRPsa/42/11\');">11__NBPsa/56/3\');">Psa 56:3__NRPsa/56/4\');">4__NRPsa/56/11\');">11__NBPsa/62/1\');">Psa 62:1__NRPsa/62/5\');">5__NRPsa/62/8\');">8__NBPsa/118/8\');">Psa 118:8-13__NBPro/18/10\');">Pro 18:10__NBIsa/25/4\');">Isa 25:4__NBIsa/37/14\');">Isa 37:14-20__NBJer/16/19\');">Jer 16:19__NBHab/3/17\');">Hab 3:17__NRHab/3/18\');">18__NBRom/4/18\');">Rom 4:18__NBRom/8/31\');">Rom 8:31__NB2Cr/1/6\');">2Cr 1:6__NR2Cr/1/9\');">9__NR2Cr/1/10\');">10__NBHbr/13/6\');">Hbr 13:6__EN';
stringArray[7] = 'And David said to __PNAbiathar_1__SHAbiathar</a> the priest, Ahimelech\'s son, I pray thee, bring me hither the ephod. And Abiathar brought thither the ephod to David.__CPAbiathar_1__PSAbiathar__FF1Sa/22/20\');">1Sa 22:20__NR1Sa/22/21\');">21__NB1Sa/23/2\');">1Sa 23:2-9__NB1Ki/2/26\');">1Ki 2:26__NBMar/2/26\');">Mar 2:26__EN';
stringArray[8] = 'And David __PNenquired_1__SHenquired</a> at the LORD, saying, Shall I pursue after this troop? shall I overtake them? And __PNhe_answered_him_2__SHhe answered him</a>, Pursue: for thou shalt surely overtake [them], and without fail recover [all].__CPenquired_1__PSenquired__FF1Sa/23/2\');">1Sa 23:2__NR1Sa/23/4\');">4__NR1Sa/23/10\');">10-12__NBJdg/20/18\');">Jdg 20:18__NRJdg/20/23\');">23__NRJdg/20/28\');">28__NB2Sa/5/19\');">2Sa 5:19__NR2Sa/5/23\');">23__NBPro/3/5\');">Pro 3:5__NRPro/3/6\');">6__AN__GHhe_answered_him_2__PShe answered him__EF1Sa/14/37\');">1Sa 14:37__NB1Sa/28/6\');">1Sa 28:6__NR1Sa/28/15\');">15__NR1Sa/28/16\');">16__NBNum/27/21\');">Num 27:21__NBPsa/50/15\');">Psa 50:15__NBPsa/91/15\');">Psa 91:15__EN';
stringArray[9] = 'So David went, he and the six hundred men that [were] with him, and came to the brook Besor, where those that were left behind stayed.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[10] = 'But David pursued, he and four hundred men: __PNfor_two_hundred_1__SHfor two hundred</a> abode behind, which were __PNso_faint_2__SHso faint</a> that they could not go over __PNthe_brook_Besor_3__SHthe brook Besor</a>.__CPfor_two_hundred_1__PSfor two hundred__FF1Sa/30/21\');">1Sa 30:21__AN__GHso_faint_2__PSso faint__EF1Sa/14/20\');">1Sa 14:20__NR1Sa/14/31\');">31__NBJdg/8/4\');">Jdg 8:4__NRJdg/8/5\');">5__AN__GGthe_brook_Besor_3__PSthe brook Besor__EEThis brook or torrent, it is evident from the circumstances of the history, must be in the south-west part of Judea, and must empty itself into the Mediterranean Sea. In the more particular situation of it writers are not agreed. Some suppose it to be between Gaza and Rhinocorura; but Jerome places it between Rhinocorura and Egypt. It is supposed by some to be the same as the river of the wilderness, (__NAAmo/6/14\');">Amo 6:14__AN,) and the river of Egypt, __NAJos/15/4\');">Jos 15:4__AN.</TD></TR>';
stringArray[11] = 'And they found an Egyptian in the field, and brought him to David, and __PNgave_him_1__SHgave him</a> bread, and he did eat; and they made him drink water;__CPgave_him_1__PSgave him__FFDeu/15/7\');">Deu 15:7-11__NBDeu/23/7\');">Deu 23:7__NBPro/25/21\');">Pro 25:21__NBMat/25/35\');">Mat 25:35__NBLuk/10/36\');">Luk 10:36__NRLuk/10/37\');">37__NBRom/12/20\');">Rom 12:20__NRRom/12/21\');">21__EN';
stringArray[12] = 'And they gave him a piece of a cake of figs, and two clusters of raisins: and when he had eaten, __PNhis_spirit_1__SHhis spirit</a> came again to him: for he had eaten no bread, nor drunk [any] water, __PNthree_days_2__SHthree days</a> and three nights.__CPhis_spirit_1__PShis spirit__FF1Sa/14/27\');">1Sa 14:27__NBJdg/15/19\');">Jdg 15:19__NBIsa/40/29\');">Isa 40:29-31__AN__GHthree_days_2__PSthree days__EF1Sa/30/13\');">1Sa 30:13__NBEst/4/16\');">Est 4:16__NBJon/1/17\');">Jon 1:17__NBMat/27/63\');">Mat 27:63__EN';
stringArray[13] = 'And David said unto him, To whom [belongest] thou? and whence [art] thou? And he said, I [am] a young man of Egypt, servant to an Amalekite; and __PNmy_master_1__SHmy master</a> left me, because three days agone I fell sick.__CPmy_master_1__PSmy master__EEThough they had booty enough, and this poor sick slave might have been carried on an ass or a camel, yet they inhumanely left him to perish; but, in the righteous providence of God, this cruelty was the occasion of their destruction; whilst David\'s kindness to a perishing stranger and slave was the means of his success, and proved the truest policy. __NAJob/31/13\');">Job 31:13-15__NBPro/12/10\');">Pro 12:10__NBJam/2/13\');">Jam 2:13__EN';
stringArray[14] = 'We made an invasion [upon] the south of __PNthe_Cherethites_1__SHthe Cherethites</a>, and upon [the coast] which [belongeth] to Judah, and upon the south of __PNCaleb_2__SHCaleb</a>; and __PNwe_burned_3__SHwe burned</a> Ziklag with fire.__CPthe_Cherethites_1__PSthe Cherethites__EECalmet and others suppose that these people, who inhabited the same district as the Philistines, were the aborigines of the island of Crete, from which they derived their name. __NA1Sa/30/16\');">1Sa 30:16__NB2Sa/8/18\');">2Sa 8:18__NB1Ki/1/38\');">1Ki 1:38__NR1Ki/1/44\');">44__NB1Ch/18/17\');">1Ch 18:17__NBEze/25/16\');">Eze 25:16__NBZep/2/5\');">Zep 2:5__AN__GHCaleb_2__PSCaleb__FEA district in the south of Judea, in which were the cities of Kirjath-Arba or Hebron, and Kirjath-sepher, belonging to the family of Caleb. __NAJos/14/13\');">Jos 14:13__NBJos/15/13\');">Jos 15:13__AN__GGwe_burned_3__PSwe burned__FF1Sa/30/1\');">1Sa 30:1-3__EN';
stringArray[15] = 'And David said to him, Canst thou bring me down to this company? And he said, __PNSwear_1__SHSwear</a> unto me by God, that thou wilt neither kill me, __PNnor_deliver_2__SHnor deliver</a> me into the hands of my master, and I will bring thee down to this company.__CPSwear_1__PSSwear__FF1Sa/29/6\');">1Sa 29:6__NBJos/2/12\');">Jos 2:12__NBJos/9/15\');">Jos 9:15__NRJos/9/19\');">19__NRJos/9/20\');">20__NBEze/17/13\');">Eze 17:13__NREze/17/16\');">16__NREze/17/19\');">19__AN__GHnor_deliver_2__PSnor deliver__EFDeu/23/15\');">Deu 23:15__NRDeu/23/16\');">16__EN';
stringArray[16] = 'And __PNwhen_he_1__SHwhen he</a> had brought him down, behold, [they were] spread abroad upon all the earth, __PNeating_2__SHeating</a> and drinking, and dancing, __PNbecause_of_all_3__SHbecause of all</a> the great spoil that they had taken out of the land of the Philistines, and out of the land of Judah.__CPwhen_he_1__PSwhen he__FFJdg/1/24\');">Jdg 1:24__NRJdg/1/25\');">25__AN__GHeating_2__PSeating__EF1Sa/25/36\');">1Sa 25:36-38__NBExd/32/6\');">Exd 32:6__NRExd/32/17\');">17-19__NRExd/32/27\');">27__NRExd/32/28\');">28__NBJdg/16/23\');">Jdg 16:23-30__NB2Sa/13/28\');">2Sa 13:28__NBIsa/22/13\');">Isa 22:13__NBDan/5/1\');">Dan 5:1-4__NBLuk/12/19\');">Luk 12:19__NRLuk/12/20\');">20__NBLuk/17/27\');">Luk 17:27-29__NBLuk/21/34\');">Luk 21:34__NRLuk/21/35\');">35__NB1Th/5/3\');">1Th 5:3__NBRev/11/10\');">Rev 11:10-13__AN__GGbecause_of_all_3__PSbecause of all__FFJob/20/5\');">Job 20:5__EN';
stringArray[17] = 'And David smote them from the twilight even unto the evening of __PNthe_next_day_1__SHthe next day</a>: __PNand_there_2__SHand there</a> escaped not a man of them, save four hundred young men, which rode upon camels, and fled.__CPthe_next_day_1__PSthe next day__EEHeb. their morrow.__GHand_there_2__PSand there__EF1Sa/11/11\');">1Sa 11:11__NBJdg/4/16\');">Jdg 4:16__NB1Ki/20/29\');">1Ki 20:29__NR1Ki/20/30\');">30__NBPsa/18/42\');">Psa 18:42__EN';

stringArray[19] = 'And there was nothing lacking to them, neither small nor great, neither sons nor daughters, neither spoil, nor any [thing] that they had taken to them: David recovered all.__CPRelated_Verses1_1__PSEntire Verse.__FF1Sa/30/8\');">1Sa 30:8__NBGen/14/14\');">Gen 14:14-16__NBNum/31/49\');">Num 31:49__NBJob/1/10\');">Job 1:10__NBPsa/34/9\');">Psa 34:9__NRPsa/34/10\');">10__NBPsa/91/9\');">Psa 91:9__NRPsa/91/10\');">10__NBMat/6/33\');">Mat 6:33__EN';
stringArray[20] = 'And David took all the flocks and the herds, [which] they drave before those [other] cattle, and said, __PNThis_is_David_s_spoil_1__SHThis [is] David\'s spoil</a>.__CPThis_is_David_s_spoil_1__PSThis is David\'s spoil__FF1Sa/30/26\');">1Sa 30:26__NBNum/31/9\');">Num 31:9-12__NB2Ch/20/25\');">2Ch 20:25__NBIsa/53/12\');">Isa 53:12__NBRom/8/37\');">Rom 8:37__EN';
stringArray[21] = 'And David came to the __PNtwo_hundred_men_1__SHtwo hundred men</a>, which were so faint that they could not follow David, whom they had made also to abide at the brook Besor: and they went forth to meet David, and to meet the people that [were] with him: and when David __PNcame_near_2__SHcame near</a> to the people, he __PNsaluted_them_3__SHsaluted them</a>.__CPtwo_hundred_men_1__PStwo hundred men__FF1Sa/30/10\');">1Sa 30:10__AN__GHcame_near_2__PScame near__EFHbr/13/1\');">Hbr 13:1__NB1Pe/3/8\');">1Pe 3:8__AN__GGsaluted_them_3__PSsaluted them__EEHeb. asked them how they did. __NAJdg/8/15\');">Jdg 8:15__EN';
stringArray[22] = 'Then answered all the __PNwicked_1__SHwicked</a> men and [men] of Belial, of __PNthose_2__SHthose</a> that went with David, and said, __PNBecause_3__SHBecause</a> they went not with us, we will not give them [ought] of the spoil that we have recovered, save to every man his wife and his children, that they may lead [them] away, and depart.__CPwicked_1__PSwicked__FF1Sa/22/2\');">1Sa 22:2__NB1Sa/25/17\');">1Sa 25:17__NR1Sa/25/25\');">25__NBDeu/13/13\');">Deu 13:13__NBJdg/19/22\');">Jdg 19:22__NB1Ki/21/10\');">1Ki 21:10__NR1Ki/21/13\');">13__AN__GHthose_2__PSthose__FEHeb. the men.__GGBecause_3__PSBecause__FFMat/7/12\');">Mat 7:12__EN';
stringArray[23] = 'Then said David, Ye shall not do so, __PNmy_brethren_1__SHmy brethren</a>, with that __PNwhich_the_LORD_2__SHwhich the LORD</a> hath given us, __PNwho_hath_3__SHwho hath</a> preserved us, and delivered the company that came against us into our hand.__CPmy_brethren_1__PSmy brethren__FFGen/19/7\');">Gen 19:7__NBJdg/19/23\');">Jdg 19:23__NBAct/7/2\');">Act 7:2__NBAct/22/1\');">Act 22:1__AN__GHwhich_the_LORD_2__PSwhich the LORD__EF1Sa/30/8\');">1Sa 30:8__NB1Sa/2/7\');">1Sa 2:7__NBNum/31/49\');">Num 31:49-54__NBDeu/8/10\');">Deu 8:10__NRDeu/8/18\');">18__NB1Ch/29/12\');">1Ch 29:12-14__NBHab/1/16\');">Hab 1:16__AN__GGwho_hath_3__PSwho hath__FFPsa/44/2\');">Psa 44:2-7__NBPsa/121/7\');">Psa 121:7__NRPsa/121/8\');">8__EN';
stringArray[24] = 'For who will hearken unto you in this matter? __PNbut_as_his_part_1__SHbut as his part</a> [is] that goeth down to the battle, so [shall] his part [be] that __PNtarrieth_2__SHtarrieth</a> by the stuff: they shall part alike.__CPbut_as_his_part_1__PSbut as his part__EEThis equitable edict was somewhat different from that which had so long obtained in Israel, and by which the spoil of the Midianites was divided: that related to the whole people: this only to the soldiers, some of whom went to battle, while others guarded the baggage. __NANum/31/27\');">Num 31:27__NBJos/22/8\');">Jos 22:8__NBPsa/68/12\');">Psa 68:12__AN__GHtarrieth_2__PStarrieth__EF1Sa/25/13\');">1Sa 25:13__EN';
stringArray[25] = 'And it was [so] from that day __PNforward_1__SHforward</a>, that he made it a statute and an ordinance for Israel unto this day.__CPforward_1__PSforward__EEHeb. and forward. __NA1Sa/16/13\');">1Sa 16:13__EN';
stringArray[26] = 'And when David came to Ziklag, he sent of the spoil unto the elders of Judah, [even] __PNto_his_friends_1__SHto his friends</a>, saying, Behold a __PNpresent_2__SHpresent</a> for you of the spoil of the enemies of the LORD;__CPto_his_friends_1__PSto his friends__FF1Ch/12/1\');">1Ch 12:1-15__NBPsa/35/27\');">Psa 35:27__NBPsa/68/18\');">Psa 68:18__NBPro/18/16\');">Pro 18:16-24__NBIsa/32/8\');">Isa 32:8__AN__GHpresent_2__PSpresent__FEHeb. blessing. __NA1Sa/25/27\');">1Sa 25:27__NBGen/33/11\');">Gen 33:11__NB2Ki/5/15\');">2Ki 5:15__NB2Cr/9/5\');">2Cr 9:5__EN';
stringArray[27] = 'To [them] which [were] in __PNBeth_el_1__SHBethel</a>, and to [them] which [were] in __PNsouth_Ramoth_2__SHsouth Ramoth</a>, and to [them] which [were] in __PNJattir_3__SHJattir</a>,__CPBeth_el_1__PSBeth-el__EEProbably not the celebrated city of this name, but Bethul a city of Simeon, (__NAJos/19/4\');">Jos 19:4__AN,) supposed to be the same as Bethelia, mentioned by Sozomen as belonging to Gaza, well peopled, and having several temples remarkable for their structure and antiquity; and which Jerome says, in his life of Hilarion, was five short days\' journey from Pelusium. __NAGen/28/19\');">Gen 28:19__NBJos/16/2\');">Jos 16:2__NBJdg/1/22\');">Jdg 1:22__NRJdg/1/23\');">23__NB1Ki/12/29\');">1Ki 12:29__AN__GHsouth_Ramoth_2__PSsouth Ramoth__FEA city of Simeon; so called to distinguish it from Ramoth Gilead beyond Jordan. __NAJos/19/8\');">Jos 19:8__AN; Ramath.__GGJattir_3__PSJattir__FFJos/15/48\');">Jos 15:48__NBJos/21/14\');">Jos 21:14__EN';
stringArray[28] = 'And to [them] which [were] in __PNAroer_1__SHAroer</a>, and to [them] which [were] in __PNSiphmoth_2__SHSiphmoth</a>, and to [them] which [were] in __PNEshtemoa_3__SHEshtemoa</a>,__CPAroer_1__PSAroer__FFJos/13/16\');">Jos 13:16__AN__GHSiphmoth_2__PSSiphmoth__FESupposed to be the same with Shepham (__NANum/34/10\');">Num 34:10__AN,) on the eastern borders of Canaan.__GGEshtemoa_3__PSEshtemoa__FFJos/15/50\');">Jos 15:50__AN; Eshtemoh. __NAJos/21/14\');">Jos 21:14__EN';
stringArray[29] = 'And to [them] which [were] in __PNRachal_1__SHRachal</a>, and to [them] which [were] in the cities of the __PNJerahmeelites_2__SHJerahmeelites</a>, and to [them] which [were] in the cities of the __PNKenites_3__SHKenites</a>,__CPRachal_1__PSRachal__EESupposed by Calmet to be the same as Hachilah. __NA1Sa/23/19\');">1Sa 23:19__AN__GHJerahmeelites_2__PSJerahmeelites__FEThe descendants of Jerahmeel son of Hezron, (__NA1Ch/2/9\');">1Ch 2:9__AN, __NA1Ch/2/25\');">25-27__AN,) who inhabited a district in the south of Judah. __NA1Sa/27/10\');">1Sa 27:10__AN__GGKenites_3__PSKenites__EEThese people inhabited a small tract west of the Dead Sea. __NAJdg/1/16\');">Jdg 1:16__EN';
stringArray[30] = 'And to [them] which [were] in __PNHormah_1__SHHormah</a>, and to [them] which [were] in __PNChorashan_2__SHChorashan</a>, and to [them] which [were] in Athach,__CPHormah_1__PSHormah__FFJos/19/4\');">Jos 19:4__NBJdg/1/17\');">Jdg 1:17__AN__GHChorashan_2__PSChorashan__FEProbably the same as Ashan in Simeon, __NAJos/15/42\');">Jos 15:42__NBJos/19/7\');">19:7__AN, which Eusebius says was sixteen miles west from Jerusalem.</TD></TR>';
