Text[1] = 'These [are] the sons of Israel; Reuben, Simeon, Levi, and Judah, Issachar, and Zebulun,';
Text[2] = 'Dan, Joseph, and Benjamin, Naphtali, Gad, and Asher.';
Text[3] = 'The sons of Judah; Er, and Onan, and Shelah: [which] three were born unto him of the daughter of Shua the Canaanitess. And Er, the firstborn of Judah, was evil in the sight of the LORD; and he slew him.';
Text[4] = 'And Tamar his daughter in law bare him Pharez and Zerah. All the sons of Judah [were] five.';
Text[5] = 'The sons of Pharez; Hezron, and Hamul.';
Text[6] = 'And the sons of Zerah; Zimri, and Ethan, and Heman, and Calcol, and Dara: five of them in all.';
Text[7] = 'And the sons of Carmi; Achar, the troubler of Israel, who transgressed in the thing accursed.';
Text[8] = 'And the sons of Ethan; Azariah.';
Text[9] = 'The sons also of Hezron, that were born unto him; Jerahmeel, and Ram, and Chelubai.';
Text[10] = 'And Ram begat Amminadab; and Amminadab begat Nahshon, prince of the children of Judah;';
Text[11] = 'And Nahshon begat Salma, and Salma begat Boaz,';
Text[12] = 'And Boaz begat Obed, and Obed begat Jesse,';
Text[13] = 'And Jesse begat his firstborn Eliab, and Abinadab the second, and Shimma the third,';
Text[14] = 'Nethaneel the fourth, Raddai the fifth,';
Text[15] = 'Ozem the sixth, David the seventh:';
Text[16] = 'Whose sisters [were] Zeruiah, and Abigail. And the sons of Zeruiah; Abishai, and Joab, and Asahel, three.';
Text[17] = 'And Abigail bare Amasa: and the father of Amasa [was] Jether the Ishmeelite.';
Text[18] = 'And Caleb the son of Hezron begat [children] of Azubah [his] wife, and of Jerioth: her sons [are] these; Jesher, and Shobab, and Ardon.';
Text[19] = 'And when Azubah was dead, Caleb took unto him Ephrath, which bare him Hur.';
Text[20] = 'And Hur begat Uri, and Uri begat Bezaleel.';
Text[21] = 'And afterward Hezron went in to the daughter of Machir the father of Gilead, whom he married when he [was] threescore years old; and she bare him Segub.';
Text[22] = 'And Segub begat Jair, who had three and twenty cities in the land of Gilead.';
Text[23] = 'And he took Geshur, and Aram, with the towns of Jair, from them, with Kenath, and the towns thereof, [even] threescore cities. All these [belonged to] the sons of Machir the father of Gilead.';
Text[24] = 'And after that Hezron was dead in Calebephratah, then Abiah Hezron\'s wife bare him Ashur the father of Tekoa.';
Text[25] = 'And the sons of Jerahmeel the firstborn of Hezron were, Ram the firstborn, and Bunah, and Oren, and Ozem, [and] Ahijah.';
Text[26] = 'Jerahmeel had also another wife, whose name [was] Atarah; she [was] the mother of Onam.';
Text[27] = 'And the sons of Ram the firstborn of Jerahmeel were, Maaz, and Jamin, and Eker.';
Text[28] = 'And the sons of Onam were, Shammai, and Jada. And the sons of Shammai; Nadab, and Abishur.';
Text[29] = 'And the name of the wife of Abishur [was] Abihail, and she bare him Ahban, and Molid.';
Text[30] = 'And the sons of Nadab; Seled, and Appaim: but Seled died without children.';
Text[31] = 'And the sons of Appaim; Ishi. And the sons of Ishi; Sheshan. And the children of Sheshan; Ahlai.';
Text[32] = 'And the sons of Jada the brother of Shammai; Jether, and Jonathan: and Jether died without children.';
Text[33] = 'And the sons of Jonathan; Peleth, and Zaza. These were the sons of Jerahmeel.';
Text[34] = 'Now Sheshan had no sons, but daughters. And Sheshan had a servant, an Egyptian, whose name [was] Jarha.';
Text[35] = 'And Sheshan gave his daughter to Jarha his servant to wife; and she bare him Attai.';
Text[36] = 'And Attai begat Nathan, and Nathan begat Zabad,';
Text[37] = 'And Zabad begat Ephlal, and Ephlal begat Obed,';
Text[38] = 'And Obed begat Jehu, and Jehu begat Azariah,';
Text[39] = 'And Azariah begat Helez, and Helez begat Eleasah,';
Text[40] = 'And Eleasah begat Sisamai, and Sisamai begat Shallum,';
Text[41] = 'And Shallum begat Jekamiah, and Jekamiah begat Elishama.';
Text[42] = 'Now the sons of Caleb the brother of Jerahmeel [were], Mesha his firstborn, which was the father of Ziph; and the sons of Mareshah the father of Hebron.';
Text[43] = 'And the sons of Hebron; Korah, and Tappuah, and Rekem, and Shema.';
Text[44] = 'And Shema begat Raham, the father of Jorkoam: and Rekem begat Shammai.';
Text[45] = 'And the son of Shammai [was] Maon: and Maon [was] the father of Bethzur.';
Text[46] = 'And Ephah, Caleb\'s concubine, bare Haran, and Moza, and Gazez: and Haran begat Gazez.';
Text[47] = 'And the sons of Jahdai; Regem, and Jotham, and Geshan, and Pelet, and Ephah, and Shaaph.';
Text[48] = 'Maachah, Caleb\'s concubine, bare Sheber, and Tirhanah.';
Text[49] = 'She bare also Shaaph the father of Madmannah, Sheva the father of Machbenah, and the father of Gibea: and the daughter of Caleb [was] Achsah.';
Text[50] = 'These were the sons of Caleb the son of Hur, the firstborn of Ephratah; Shobal the father of Kirjathjearim,';
Text[51] = 'Salma the father of Bethlehem, Hareph the father of Bethgader.';
Text[52] = 'And Shobal the father of Kirjathjearim had sons; Haroeh, [and] half of the Manahethites.';
Text[53] = 'And the families of Kirjathjearim; the Ithrites, and the Puhites, and the Shumathites, and the Mishraites; of them came the Zareathites, and the Eshtaulites.';
Text[54] = 'The sons of Salma; Bethlehem, and the Netophathites, Ataroth, the house of Joab, and half of the Manahethites, the Zorites.';
Text[55] = 'And the families of the scribes which dwelt at Jabez; the Tirathites, the Shimeathites, [and] Suchathites. These [are] the Kenites that came of Hemath, the father of the house of Rechab.';
