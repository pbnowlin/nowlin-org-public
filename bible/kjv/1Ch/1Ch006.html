Text[1] = 'The sons of Levi; Gershon, Kohath, and Merari.';
Text[2] = 'And the sons of Kohath; Amram, Izhar, and Hebron, and Uzziel.';
Text[3] = 'And the children of Amram; Aaron, and Moses, and Miriam. The sons also of Aaron; Nadab, and Abihu, Eleazar, and Ithamar.';
Text[4] = 'Eleazar begat Phinehas, Phinehas begat Abishua,';
Text[5] = 'And Abishua begat Bukki, and Bukki begat Uzzi,';
Text[6] = 'And Uzzi begat Zerahiah, and Zerahiah begat Meraioth,';
Text[7] = 'Meraioth begat Amariah, and Amariah begat Ahitub,';
Text[8] = 'And Ahitub begat Zadok, and Zadok begat Ahimaaz,';
Text[9] = 'And Ahimaaz begat Azariah, and Azariah begat Johanan,';
Text[10] = 'And Johanan begat Azariah, (he [it is] that executed the priest\'s office in the temple that Solomon built in Jerusalem:)';
Text[11] = 'And Azariah begat Amariah, and Amariah begat Ahitub,';
Text[12] = 'And Ahitub begat Zadok, and Zadok begat Shallum,';
Text[13] = 'And Shallum begat Hilkiah, and Hilkiah begat Azariah,';
Text[14] = 'And Azariah begat Seraiah, and Seraiah begat Jehozadak,';
Text[15] = 'And Jehozadak went [into captivity], when the LORD carried away Judah and Jerusalem by the hand of Nebuchadnezzar.';
Text[16] = 'The sons of Levi; Gershom, Kohath, and Merari.';
Text[17] = 'And these [be] the names of the sons of Gershom; Libni, and Shimei.';
Text[18] = 'And the sons of Kohath [were], Amram, and Izhar, and Hebron, and Uzziel.';
Text[19] = 'The sons of Merari; Mahli, and Mushi. And these [are] the families of the Levites according to their fathers.';
Text[20] = 'Of Gershom; Libni his son, Jahath his son, Zimmah his son,';
Text[21] = 'Joah his son, Iddo his son, Zerah his son, Jeaterai his son.';
Text[22] = 'The sons of Kohath; Amminadab his son, Korah his son, Assir his son,';
Text[23] = 'Elkanah his son, and Ebiasaph his son, and Assir his son,';
Text[24] = 'Tahath his son, Uriel his son, Uzziah his son, and Shaul his son.';
Text[25] = 'And the sons of Elkanah; Amasai, and Ahimoth.';
Text[26] = '[As for] Elkanah: the sons of Elkanah; Zophai his son, and Nahath his son,';
Text[27] = 'Eliab his son, Jeroham his son, Elkanah his son.';
Text[28] = 'And the sons of Samuel; the firstborn Vashni, and Abiah.';
Text[29] = 'The sons of Merari; Mahli, Libni his son, Shimei his son, Uzza his son,';
Text[30] = 'Shimea his son, Haggiah his son, Asaiah his son.';
Text[31] = 'And these [are they] whom David set over the service of song in the house of the LORD, after that the ark had rest.';
Text[32] = 'And they ministered before the dwelling place of the tabernacle of the congregation with singing, until Solomon had built the house of the LORD in Jerusalem: and [then] they waited on their office according to their order.';
Text[33] = 'And these [are] they that waited with their children. Of the sons of the Kohathites: Heman a singer, the son of Joel, the son of Shemuel,';
Text[34] = 'The son of Elkanah, the son of Jeroham, the son of Eliel, the son of Toah,';
Text[35] = 'The son of Zuph, the son of Elkanah, the son of Mahath, the son of Amasai,';
Text[36] = 'The son of Elkanah, the son of Joel, the son of Azariah, the son of Zephaniah,';
Text[37] = 'The son of Tahath, the son of Assir, the son of Ebiasaph, the son of Korah,';
Text[38] = 'The son of Izhar, the son of Kohath, the son of Levi, the son of Israel.';
Text[39] = 'And his brother Asaph, who stood on his right hand, [even] Asaph the son of Berachiah, the son of Shimea,';
Text[40] = 'The son of Michael, the son of Baaseiah, the son of Malchiah,';
Text[41] = 'The son of Ethni, the son of Zerah, the son of Adaiah,';
Text[42] = 'The son of Ethan, the son of Zimmah, the son of Shimei,';
Text[43] = 'The son of Jahath, the son of Gershom, the son of Levi.';
Text[44] = 'And their brethren the sons of Merari [stood] on the left hand: Ethan the son of Kishi, the son of Abdi, the son of Malluch,';
Text[45] = 'The son of Hashabiah, the son of Amaziah, the son of Hilkiah,';
Text[46] = 'The son of Amzi, the son of Bani, the son of Shamer,';
Text[47] = 'The son of Mahli, the son of Mushi, the son of Merari, the son of Levi.';
Text[48] = 'Their brethren also the Levites [were] appointed unto all manner of service of the tabernacle of the house of God.';
Text[49] = 'But Aaron and his sons offered upon the altar of the burnt offering, and on the altar of incense, [and were appointed] for all the work of the [place] most holy, and to make an atonement for Israel, according to all that Moses the servant of God had commanded.';
Text[50] = 'And these [are] the sons of Aaron; Eleazar his son, Phinehas his son, Abishua his son,';
Text[51] = 'Bukki his son, Uzzi his son, Zerahiah his son,';
Text[52] = 'Meraioth his son, Amariah his son, Ahitub his son,';
Text[53] = 'Zadok his son, Ahimaaz his son.';
Text[54] = 'Now these [are] their dwelling places throughout their castles in their coasts, of the sons of Aaron, of the families of the Kohathites: for theirs was the lot.';
Text[55] = 'And they gave them Hebron in the land of Judah, and the suburbs thereof round about it.';
Text[56] = 'But the fields of the city, and the villages thereof, they gave to Caleb the son of Jephunneh.';
Text[57] = 'And to the sons of Aaron they gave the cities of Judah, [namely], Hebron, [the city] of refuge, and Libnah with her suburbs, and Jattir, and Eshtemoa, with their suburbs,';
Text[58] = 'And Hilen with her suburbs, Debir with her suburbs,';
Text[59] = 'And Ashan with her suburbs, and Bethshemesh with her suburbs:';
Text[60] = 'And out of the tribe of Benjamin; Geba with her suburbs, and Alemeth with her suburbs, and Anathoth with her suburbs. All their cities throughout their families [were] thirteen cities.';
Text[61] = 'And unto the sons of Kohath, [which were] left of the family of that tribe, [were cities given] out of the half tribe, [namely, out of] the half [tribe] of Manasseh, by lot, ten cities.';
Text[62] = 'And to the sons of Gershom throughout their families out of the tribe of Issachar, and out of the tribe of Asher, and out of the tribe of Naphtali, and out of the tribe of Manasseh in Bashan, thirteen cities.';
Text[63] = 'Unto the sons of Merari [were given] by lot, throughout their families, out of the tribe of Reuben, and out of the tribe of Gad, and out of the tribe of Zebulun, twelve cities.';
Text[64] = 'And the children of Israel gave to the Levites [these] cities with their suburbs.';
Text[65] = 'And they gave by lot out of the tribe of the children of Judah, and out of the tribe of the children of Simeon, and out of the tribe of the children of Benjamin, these cities, which are called by [their] names.';
Text[66] = 'And [the residue] of the families of the sons of Kohath had cities of their coasts out of the tribe of Ephraim.';
Text[67] = 'And they gave unto them, [of] the cities of refuge, Shechem in mount Ephraim with her suburbs; [they gave] also Gezer with her suburbs,';
Text[68] = 'And Jokmeam with her suburbs, and Bethhoron with her suburbs,';
Text[69] = 'And Aijalon with her suburbs, and Gathrimmon with her suburbs:';
Text[70] = 'And out of the half tribe of Manasseh; Aner with her suburbs, and Bileam with her suburbs, for the family of the remnant of the sons of Kohath.';
Text[71] = 'Unto the sons of Gershom [were given] out of the family of the half tribe of Manasseh, Golan in Bashan with her suburbs, and Ashtaroth with her suburbs:';
Text[72] = 'And out of the tribe of Issachar; Kedesh with her suburbs, Daberath with her suburbs,';
Text[73] = 'And Ramoth with her suburbs, and Anem with her suburbs:';
Text[74] = 'And out of the tribe of Asher; Mashal with her suburbs, and Abdon with her suburbs,';
Text[75] = 'And Hukok with her suburbs, and Rehob with her suburbs:';
Text[76] = 'And out of the tribe of Naphtali; Kedesh in Galilee with her suburbs, and Hammon with her suburbs, and Kirjathaim with her suburbs.';
Text[77] = 'Unto the rest of the children of Merari [were given] out of the tribe of Zebulun, Rimmon with her suburbs, Tabor with her suburbs:';
Text[78] = 'And on the other side Jordan by Jericho, on the east side of Jordan, [were given them] out of the tribe of Reuben, Bezer in the wilderness with her suburbs, and Jahzah with her suburbs,';
Text[79] = 'Kedemoth also with her suburbs, and Mephaath with her suburbs:';
Text[80] = 'And out of the tribe of Gad; Ramoth in Gilead with her suburbs, and Mahanaim with her suburbs,';
Text[81] = 'And Heshbon with her suburbs, and Jazer with her suburbs.';
