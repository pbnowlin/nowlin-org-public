stringArray[1] = 'Now __PNthese_are_1__SHthese [are]</a> they that came to David to Ziklag, __PNwhile_he_yet__etc__2__SHwhile he yet</a> kept himself close because of __PNSaul_3__SHSaul</a> the son of Kish: and they [were] among __PNthe_mighty_4__SHthe mighty</a> men, helpers of the war.__CPthese_are_1__PSthese are__FF1Sa/27/2\');">1Sa 27:2__NR1Sa/27/6\');">6__NB2Sa/1/1\');">2Sa 1:1__NB2Sa/4/10\');">2Sa 4:10__AN__GHwhile_he_yet__etc__2__PSwhile he yet, etc.__FEHeb. being yet shut up. Sometimes, in the East, when a successful prince endeavoured to extirpate the preceding royal family, some of them escaped the slaughter, and secured themselves in an impregnable fortress, or in a place of great secrecy; while others have been known to seek an asylum in a foreign county, from when they have occasioned, from time to time, great anxiety and great difficulties to the usurper of the crown. The expression shut up, so often applied to the extermination of eastern royal families. (__NADeu/32/32\');">Deu 32:32__AN. __NA1Ki/14/10\');">1Ki 14:10__NB1Ki/21/21\');">21:21__AN. __NA2Ki/9/8\');">2Ki 9:8__NB2Ki/14/26\');">14:26__AN,) strictly speaking, refers to the two first of these cases; but the term may be used in a more extensive sense, for those who, by retiring into deserts, or foreign countries, preserve themselves from being slain by the men who usurp the dominions of their ancestors. Thus the term is here applied to David, though he did not shut himself up, strictly speaking, in Ziklag. It is described as a town in the country, and was probably an unwalled town; and it is __GGSaul_3__PSSaul__FF1Ch/8/33\');">1Ch 8:33__NB1Ch/9/39\');">1Ch 9:39__AN__GHthe_mighty_4__PSthe mighty__EF1Ch/11/10\');">1Ch 11:10__NR1Ch/11/19\');">19__NR1Ch/11/24\');">24__NR1Ch/11/25\');">25__EN';

stringArray[18] = 'Then __PNthe_spirit_1__SHthe spirit</a> __PNcame_upon_Amasai_2__SHcame upon Amasai</a>, [who was] chief of the captains, [and he said], __PNThine_are_we_3__SHThine [are we]</a>, David, __PNand_on_thy_side_4__SHand on thy side</a>, thou son of Jesse: __PNpeace_5__SHpeace</a>, peace [be] unto thee, and peace [be] to thine helpers; for __PNthy_God_6__SHthy God</a> helpeth thee. Then David received them, and made them __PNcaptains_of_the_band_7__SHcaptains of the band</a>.__CPthe_spirit_1__PSthe spirit__FFJdg/6/34\');">Jdg 6:34__NBJdg/13/25\');">Jdg 13:25__NBIsa/59/17\');">Isa 59:17__AN__GHcame_upon_Amasai_2__PScame upon Amasai__FEHeb. clothed Amasai. __NA1Ch/2/17\');">1Ch 2:17__NB2Sa/17/25\');">2Sa 17:25__NB2Sa/19/13\');">2Sa 19:13__NB2Sa/20/4\');">2Sa 20:4-8__AN; Amasa__GGThine_are_we_3__PSThine are we__FF2Ki/10/5\');">2Ki 10:5__AN__GHand_on_thy_side_4__PSand on thy side__EFRth/1/16\');">Rth 1:16__NB2Sa/15/21\');">2Sa 15:21__NB2Ki/9/32\');">2Ki 9:32__NBMat/12/30\');">Mat 12:30__AN__GGpeace_5__PSpeace__FFGal/6/16\');">Gal 6:16__NBEph/6/23\');">Eph 6:23__NREph/6/24\');">24__AN__GHthy_God_6__PSthy God__EF1Sa/25/28\');">1Sa 25:28__NR1Sa/25/29\');">29__NB2Sa/5/2\');">2Sa 5:2__NBZec/8/23\');">Zec 8:23__NBJhn/6/67\');">Jhn 6:67__NRJhn/6/68\');">68__AN__GGcaptains_of_the_band_7__PScaptains of the band__FF1Sa/8/12\');">1Sa 8:12__NB1Sa/22/7\');">1Sa 22:7__NB1Ki/9/22\');">1Ki 9:22__EN';
stringArray[19] = 'And there fell [some] of Manasseh to David, __PNwhen_he_came_1__SHwhen he came</a> with the Philistines against Saul to battle: but they helped them not: for the lords of the Philistines upon advisement sent him away, saying, He will fall to his master Saul __PNto_the_jeopardy_of_our_heads_2__SHto [the jeopardy of] our heads</a>.__CPwhen_he_came_1__PSwhen he came__FF1Sa/29/2\');">1Sa 29:2-4__AN__GHto_the_jeopardy_of_our_heads_2__PSto the jeopardy of our heads__FEHeb. on our heads.</TD></TR>';
stringArray[20] = '__PNAs_he_went_1__SHAs he went</a> to Ziklag, there fell to him of Manasseh, Adnah, and Jozabad, and Jediael, and Michael, and Jozabad, and Elihu, and Zilthai, __PNcaptains_2__SHcaptains</a> of the thousands that [were] of Manasseh.__CPAs_he_went_1__PSAs he went__EEThese captains of Manasseh seem to have met David as he was returning from the army of the Philistines to Ziklag. It is probable that they did not bring their companies with them; yet they both assured him of future assistance, and very seasonably helped him against the Amalekites who had spoiled Ziklag. __NA1Sa/29/11\');">1Sa 29:11__AN__GHcaptains_2__PScaptains__EFExd/18/21\');">Exd 18:21__NBDeu/1/15\');">Deu 1:15__NBDeu/33/17\');">Deu 33:17__EN';

stringArray[22] = 'For at [that] time __PNday_by_day_1__SHday by day</a> there came to David to help him, until [it was] a great host, __PNlike_the_host_of_God_2__SHlike the host of God</a>.__CPday_by_day_1__PSday by day__FF2Sa/2/2\');">2Sa 2:2-4__NB2Sa/3/1\');">2Sa 3:1__NBJob/17/9\');">Job 17:9__AN__GHlike_the_host_of_God_2__PSlike the host of God__FEThat is, says the Targumist, a very numerous army, like the army of the angel of God. __NAGen/32/2\');">Gen 32:2__NBJos/5/14\');">Jos 5:14__NBPsa/148/2\');">Psa 148:2__EN';
stringArray[23] = 'And these [are] __PNthe_numbers_3__SHthe numbers</a> of the __PNbands_4__SHbands</a> [that were] ready armed to the war, [and] came to David to Hebron, __PNto_turn_5__SHto turn</a> the kingdom of Saul to him, __PNaccording_6__SHaccording</a> to the word of the LORD.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2956. B.C. 1048.__GHRelated_Verses2_2__PSEntire Verse.__FEAn. Ex. Is. 433.__GGthe_numbers_3__PSthe numbers__FF1Ch/11/1\');">1Ch 11:1-3__NB2Sa/2/3\');">2Sa 2:3__NR2Sa/2/4\');">4__NB2Sa/5/1\');">2Sa 5:1-3__AN__GHbands_4__PSbands__FEor, captains, or men. Heb. heads. came to David. Some learned men understand this as relating to the time when David was make king over Judah, on his first coming to Hebron: but it seems wholly to refer to his being made king over all Israel, after the death of Ishbosheth; for there was no such union or assembly of the several tribes on the former occasion, as is here described.__GGto_turn_5__PSto turn__FF1Ch/10/14\');">1Ch 10:14__AN__GHaccording_6__PSaccording__EF1Ch/11/10\');">1Ch 11:10__NB1Sa/16/1\');">1Sa 16:1__NR1Sa/16/3\');">3__NR1Sa/16/12\');">12__NR1Sa/16/13\');">13__NB2Sa/3/18\');">2Sa 3:18__NBPsa/2/6\');">Psa 2:6__NBPsa/89/19\');">Psa 89:19__NRPsa/89/20\');">20__EN';

stringArray[32] = 'And of the children of Issachar, [which were men] that had __PNunderstanding_of_the_times_1__SHunderstanding of the times</a>, __PNto_know_2__SHto know</a> what Israel ought to do; the heads of them [were] two hundred; and __PNall_their_3__SHall their</a> brethren [were] at their commandment.__CPunderstanding_of_the_times_1__PSunderstanding of the times__EEThat is, as the following words indicate, intelligent men, who understood the signs of the times, well versed in political affairs, and knew what was proper to be done in all the exigencies of human life; and who now perceived that it was both the duty and political interest of Israel to advance David to the throne. __NAGen/49/14\');">Gen 49:14__NBEst/1/13\');">Est 1:13__NBIsa/22/12\');">Isa 22:12-14__NBIsa/33/6\');">Isa 33:6__NBMic/6/9\');">Mic 6:9__NBMat/16/3\');">Mat 16:3__NBLuk/12/56\');">Luk 12:56__NRLuk/12/57\');">57__AN__GHto_know_2__PSto know__EFPro/14/8\');">Pro 14:8__NBEph/5/17\');">Eph 5:17__AN__GGall_their_3__PSall their__FFPro/24/5\');">Pro 24:5__NBEcc/7/19\');">Ecc 7:19__NBEcc/9/18\');">Ecc 9:18__EN';

stringArray[40] = 'Moreover they that were nigh them, [even] unto Issachar and Zebulun and Naphtali, __PNbrought_1__SHbrought</a> bread on asses, and on camels, and on mules, and on oxen, [and] __PNmeat__meal_2__SHmeat, meal</a>, __PNcakes_of_figs_3__SHcakes of figs</a>, and bunches of raisins, and wine, and oil, and oxen, and sheep abundantly: for __PNthere_was_joy_4__SH[there was] joy</a> in Israel.__CPbrought_1__PSbrought__EE"The Septuagint reads [ ] ""brought (to) them"" which is probably correct; the Hebrew lahem, ""to them"" might be easily mistaken for lechem, ""bread."" The passage will then read, ""bought them on asses, on camels, and on mules, and on oxen, meat, meal, cakes of figs,"" etc., which renders the introduction of and unnecessary. From the mention of oil, figs, and raisins, Mr. Harmer thinks that this assembly was held in autumn. __NA2Sa/16/1\');">2Sa 16:1__NB2Sa/17/27\');">2Sa 17:27-29__AN"__GHmeat__meal_2__PSmeat, meal__FEor, victual of meal__GGcakes_of_figs_3__PScakes of figs__FF1Sa/25/18\');">1Sa 25:18__AN__GHthere_was_joy_4__PSthere was joy__EF1Ki/1/40\');">1Ki 1:40__NB2Ki/11/20\');">2Ki 11:20__NBPro/11/10\');">Pro 11:10__NBPro/29/2\');">Pro 29:2__NBJer/23/5\');">Jer 23:5__NRJer/23/6\');">6__NBLuk/19/37\');">Luk 19:37__NRLuk/19/38\');">38__NBRev/19/5\');">Rev 19:5-7__EN';
