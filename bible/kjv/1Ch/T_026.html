<script type="text/javascript">
var stringArray = new Array();
stringArray[1] = 'Concerning __PNthe_divisions_1__SHthe divisions</a> of __PNthe_porters_2__SHthe porters</a>: Of the __PNKorhites_3__SHKorhites</a> [was] __PNMeshelemiah_4__SHMeshelemiah</a> the son of Kore, of the sons of __PNAsaph_5__SHAsaph</a>.__CPthe_divisions_1__PSthe divisions__EEThere were four classes of these, each of which belonged to the four gates of the temple, which opened to the four cardinal points of heaven. The eastern gate fell to Shelemiah; the northern to Zechariah, (__NA1Ch/26/14\');">1Ch 26:14__AN;) the southern to Obed-edom, (__NA1Ch/26/15\');">1Ch 26:15__AN;) and the western to Shuppim and Hosah, (__NA1Ch/26/16\');">1Ch 26:16__AN.) These several persons were captains of these porter-bands, or door-keepers, at the different gates. There were probably a thousand men under each of these captains; as we find, from __NA1Ch/23/5\');">1Ch 23:5__AN, that their whole number was four thousand.__GHthe_porters_2__PSthe porters__EF1Ch/9/17\');">1Ch 9:17-27__NB1Ch/15/18\');">1Ch 15:18__NR1Ch/15/23\');">23__NR1Ch/15/24\');">24__NB2Ch/23/19\');">2Ch 23:19__AN__GGKorhites_3__PSKorhites__FFNum/26/9\');">Num 26:9-11__NBPsa/44/1\');">Psa 44:1__NBPsa/49/1\');">Psa 49:1__AN; *titles__GHMeshelemiah_4__PSMeshelemiah__FE[Shelemyah ( hyml# )] Shelemiah, is merely an abbreviation of [M@shelemyah ( hyml#m )] Meshelemiah, by the aphæresis of [Mêm] mem.; Shelemiah__GGAsaph_5__PSAsaph__EE"This variation arises from the rejection of the word [\'ab ( b) )] av, ""father,"" and the mutation of [Yôwd] yood, into [\'Aleph] aleph; being written in the parallel passages [\'Ebyacaph ( vsyb) )] Ebiasaph, and here [\'Acaph ( vs) )] Asaph. __NA1Ch/6/37\');">1Ch 6:37__NB1Ch/9/19\');">1Ch 9:19__AN; Ebiasaph"</TD></TR>';
stringArray[2] = 'And the sons of Meshelemiah [were], Zechariah the firstborn, Jediael the second, Zebadiah the third, Jathniel the fourth,__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[3] = 'Elam the fifth, Jehohanan the sixth, Elioenai the seventh.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[4] = 'Moreover the sons of __PNObed_edom_1__SHObededom</a> [were], Shemaiah the firstborn, Jehozabad the second, Joah the third, and Sacar the fourth, and Nethaneel the fifth,__CPObed_edom_1__PSObed-edom__FF1Ch/15/18\');">1Ch 15:18__NR1Ch/15/21\');">21__NR1Ch/15/24\');">24__NB1Ch/16/5\');">1Ch 16:5__NR1Ch/16/38\');">38__EN';
stringArray[5] = 'Ammiel the sixth, Issachar the seventh, Peulthai the eighth: for God blessed __PNhim_1__SHhim</a>.__CPhim_1__PShim__EE"""That is, Obed-edom, as __NA1Ch/13/14\');">1Ch 13:14__AN."" __NAPsa/128/1\');">Psa 128:1__AN"</TD></TR>';
stringArray[6] = 'Also unto Shemaiah his son were sons born, that ruled throughout the house of their father: for they [were] __PNmighty_men_of_valour_1__SHmighty men of valour</a>.__CPmighty_men_of_valour_1__PSmighty men of valour__EEThey were not only porters, or door keepers, in the ordinary sense of the word, but they were a military guard to the gate, as Dr. Delaney suggests that the word shöârim should be rendered here: and perhaps in this sense alone are we to understand their office, which appears to have been of considerable dignity, and conferred only on men of the first rank. They were appointed to attend the temple, to guard all the avenues to it, to open and shut all the outer gates, and attend at them, not only for state but for service. They were also required to direct and instruct those who were going to worship in the courts of the sanctuary in the conduct they were to observe, to encourage those who were timid, to send back the strangers and unclean, and to guard against thieves and others who were enemies to the house of God. __NA1Ch/26/8\');">1Ch 26:8__NB1Ch/12/28\');">1Ch 12:28__NBJdg/6/12\');">Jdg 6:12__NB2Sa/2/7\');">2Sa 2:7__AN; *marg:; __NA2Ch/26/17\');">2Ch 26:17__NBNeh/11/14\');">Neh 11:14__NB1Ti/6/12\');">1Ti 6:12__NB2Ti/2/3\');">2Ti 2:3__EN';
stringArray[7] = 'The sons of Shemaiah; Othni, and Rephael, and Obed, Elzabad, whose brethren [were] strong men, Elihu, and Semachiah.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[8] = 'All these of the sons of Obededom: they and their sons and their brethren, __PNable_men_1__SHable men</a> for strength for the service, [were] threescore and two of Obededom.__CPable_men_1__PSable men__FFMat/25/15\');">Mat 25:15__NB1Cr/12/4\');">1Cr 12:4-11__NB2Cr/3/6\');">2Cr 3:6__NB1Pe/4/11\');">1Pe 4:11__EN';
stringArray[9] = 'And __PNMeshelemiah_1__SHMeshelemiah</a> had sons and brethren, strong men, eighteen.__CPMeshelemiah_1__PSMeshelemiah__FF1Ch/26/1\');">1Ch 26:1__NR1Ch/26/14\');">14__EN';
stringArray[10] = 'Also __PNHosah_1__SHHosah</a>, of the children of Merari, had sons; Simri the chief, (for [though] he was not the firstborn, yet __PNhis_father_2__SHhis father</a> made him the chief;)__CPHosah_1__PSHosah__FF1Ch/16/38\');">1Ch 16:38__AN__GHhis_father_2__PShis father__EF1Ch/5/1\');">1Ch 5:1__NR1Ch/5/2\');">2__EN';
stringArray[11] = 'Hilkiah the second, Tebaliah the third, Zechariah the fourth: all the sons and brethren of Hosah [were] thirteen.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[12] = 'Among these [were] the divisions of the porters, [even] among the chief men, [having] __PNwards_1__SHwards</a> one against another, to minister in the house of the LORD.__CPwards_1__PSwards__EEThat is, classes against each other. Ward formerly signified a class or division: we still apply the term to the different apartments in hospitals, and to the more extensive districts into which the city of London is divided. __NA1Ch/25/8\');">1Ch 25:8__EN';
stringArray[13] = 'And they cast lots, __PNas_well_the_small_as_the_great_1__SHas well the small as the great</a>, according to the house of their fathers, for every gate.__CPas_well_the_small_as_the_great_1__PSas well the small as the great__EEHeb. or, as well for the small as for the great. __NA1Ch/24/31\');">1Ch 24:31__NB1Ch/25/8\');">1Ch 25:8__EN';
stringArray[14] = 'And the lot eastward fell to __PNShelemiah_1__SHShelemiah</a>. Then for __PNZechariah_2__SHZechariah</a> his son, a wise counsellor, they cast lots; and his lot came out northward.__CPShelemiah_1__PSShelemiah__FF1Ch/26/1\');">1Ch 26:1__AN, Meshelemiah.__GHZechariah_2__PSZechariah__EF1Ch/26/2\');">1Ch 26:2__AN.</TD></TR>';
stringArray[15] = 'To Obededom southward; and to his sons the house of __PNAsuppim_1__SHAsuppim</a>.__CPAsuppim_1__PSAsuppim__EEHeb. gatherings. __NA1Ch/26/17\');">1Ch 26:17__AN; Or collections; probably the place where either the supplies of the porters, or the offerings made for the priests and Levites, were laid up. Obed-edom is said to have had the charge of the treasures, etc., in __NA2Ch/25/24\');">2Ch 25:24__AN.</TD></TR>';
stringArray[16] = 'To Shuppim and __PNHosah_1__SHHosah</a> [the lot came forth] westward, with the gate __PNShallecheth_2__SHShallecheth</a>, by the __PNcauseway_3__SHcauseway</a> of the going up, __PNward_against_ward_4__SHward against ward</a>.__CPHosah_1__PSHosah__FF1Ch/26/10\');">1Ch 26:10__NR1Ch/26/11\');">11__AN__GHShallecheth_2__PSShallecheth__FEThat is, ejection; probably the gate through which all the filth which from time to time might accumulate in the temple and its courts, was cast out.__GGcauseway_3__PScauseway__FF1Ki/10/5\');">1Ki 10:5__NB2Ch/9/4\');">2Ch 9:4__AN__GHward_against_ward_4__PSward against ward__FEThat is, their stations were opposite to each other; as the north to the south, and the east to the west. __NA1Ch/26/12\');">1Ch 26:12__NB1Ch/25/8\');">1Ch 25:8__NBNeh/12/24\');">Neh 12:24__EN';
stringArray[17] = '__PNEastward_1__SHEastward</a> [were] six Levites, northward four a day, southward four a day, and toward __PNAsuppim_2__SHAsuppim</a> two [and] two.__CPEastward_1__PSEastward__FF1Ch/9/24\');">1Ch 9:24__NB2Ch/8/14\');">2Ch 8:14__AN__GHAsuppim_2__PSAsuppim__EF1Ch/26/15\');">1Ch 26:15__EN';
stringArray[18] = 'At __PNParbar_1__SHParbar</a> westward, four at the causeway, [and] two at Parbar.__CPParbar_1__PSParbar__EEParbar is most probably the same as parwar , which denotes suburbs , (__NA2Ki/23/11\');">2Ki 23:11__AN,) in which sense it is often used in the Chaldee Targums; and consequently this may be considered as leading to the suburbs.</TD></TR>';
stringArray[19] = 'These [are] the divisions of the porters among the sons of __PNKore_1__SHKore</a>, and among the sons of Merari.__CPKore_1__PSKore__EEKore, or rather, Kohri, [Qorchiy ( yxrq )] is essentially the same with [Qorach ( xrq )] Korah, merely having a paragogic [Yôwd] yood. __NANum/16/11\');">Num 16:11__AN; Korah</TD></TR>';
stringArray[20] = 'And of the Levites, Ahijah [was] over the __PNtreasures_1__SHtreasures</a> of the house of God, and over the treasures of the __PNdedicated_things_2__SHdedicated things</a>.__CPtreasures_1__PStreasures__FF1Ch/26/22\');">1Ch 26:22__NB1Ch/9/26\');">1Ch 9:26-30__NB1Ch/22/3\');">1Ch 22:3__NR1Ch/22/4\');">4__NR1Ch/22/14\');">14-16__NB1Ch/28/12\');">1Ch 28:12-19__NB1Ch/29/2\');">1Ch 29:2-8__NB1Ki/14/26\');">1Ki 14:26__NB1Ki/15/18\');">1Ki 15:18__NBMal/3/10\');">Mal 3:10__AN__GHdedicated_things_2__PSdedicated things__FEHeb. holy things. __NA1Ch/26/26\');">1Ch 26:26-28__NB1Ch/18/11\');">1Ch 18:11__NB1Ki/7/51\');">1Ki 7:51__NB2Ch/31/11\');">2Ch 31:11__NR2Ch/31/12\');">12__EN';
stringArray[21] = '[As concerning] the sons of __PNLaadan_1__SHLaadan</a>; the sons of the Gershonite Laadan, chief fathers, [even] of Laadan the Gershonite, [were] Jehieli.__CPLaadan_1__PSLaadan__FF1Ch/6/17\');">1Ch 6:17__AN; Libni; __NA1Ch/23/7\');">1Ch 23:7__EN';
stringArray[22] = 'The sons of __PNJehieli_1__SHJehieli</a>; Zetham, and Joel his brother, [which were] over the treasures of the house of the LORD.__CPJehieli_1__PSJehieli__EEJehieli, [Y@chiy\'eliy ( yl)yxy )] is the same as Jehiel, [Y@chiy\'el ( l)yxy )] with the addition of [Yôwd] yood. __NA1Ch/23/8\');">1Ch 23:8__NB1Ch/29/8\');">1Ch 29:8__AN__GHJehiel_2__PSJehiel__FEover the treasures. __NA1Ch/26/20\');">1Ch 26:20__NBNeh/10/38\');">Neh 10:38__EN';
stringArray[23] = 'Of the __PNAmramites_1__SHAmramites</a>, [and] the Izharites, the Hebronites, [and] the Uzzielites:__CPAmramites_1__PSAmramites__FF1Ch/23/12\');">1Ch 23:12__NBNum/3/19\');">Num 3:19__NRNum/3/27\');">27__EN';
stringArray[24] = 'And __PNShebuel_1__SHShebuel</a> the son of Gershom, the son of Moses, [was] ruler of the treasures.__CPShebuel_1__PSShebuel__EEThe difference between [Sh@buw\'el ( l)wb# )] Shubael, and [Sh@buw\'el ( l)wb# )] Shebuel, simply arises from the elision of [Vâv] wav and a change of vowels. __NA1Ch/23/15\');">1Ch 23:15__NR1Ch/23/16\');">16__NB1Ch/24/20\');">1Ch 24:20__AN; Shubael</TD></TR>';
stringArray[25] = 'And his brethren by __PNEliezer_1__SHEliezer</a>; __PNRehabiah_2__SHRehabiah</a> his son, and Jeshaiah his son, and Joram his son, and Zichri his son, and __PNShelomith_3__SHShelomith</a> his son.__CPEliezer_1__PSEliezer__FF1Ch/23/15\');">1Ch 23:15__NBExd/18/4\');">Exd 18:4__AN__GHRehabiah_2__PSRehabiah__EF1Ch/23/17\');">1Ch 23:17__AN__GGShelomith_3__PSShelomith__FF1Ch/23/18\');">1Ch 23:18__EN';
stringArray[26] = 'Which Shelomith and his brethren [were] __PNover_all_the_treasures_1__SHover all the treasures</a> of the dedicated things, which David the king, and the chief fathers, the captains over thousands and hundreds, and the captains of the host, had dedicated.__CPover_all_the_treasures_1__PSover all the treasures__FF1Ch/18/11\');">1Ch 18:11__NB1Ch/22/14\');">1Ch 22:14__NB1Ch/29/2\');">1Ch 29:2-9__NBNum/31/30\');">Num 31:30-52__EN';
stringArray[27] = '__PNOut_1__SHOut</a> of the __PNspoils_won_in_battles_2__SHspoils won in battles</a> did they dedicate __PNto_maintain_3__SHto maintain</a> the house of the LORD.__CPOut_1__PSOut__FFJos/6/19\');">Jos 6:19__AN__GHspoils_won_in_battles_2__PSspoils won in battles__FEHeb. battles and spoils__GGto_maintain_3__PSto maintain__FF2Ki/12/14\');">2Ki 12:14__NBNeh/10/32\');">Neh 10:32-34__EN';
stringArray[28] = 'And all that __PNSamuel_1__SHSamuel</a> the seer, and Saul the son of Kish, and __PNAbner_2__SHAbner</a> the son of Ner, and __PNJoab_3__SHJoab</a> the son of Zeruiah, had dedicated; [and] whosoever had dedicated [any thing, it was] under the hand of Shelomith, and of his brethren.__CPSamuel_1__PSSamuel__FF1Sa/9/9\');">1Sa 9:9__AN__GHAbner_2__PSAbner__EF1Sa/14/47\');">1Sa 14:47-51__NB1Sa/17/55\');">1Sa 17:55__AN__GGJoab_3__PSJoab__FF2Sa/10/9\');">2Sa 10:9-14__EN';
stringArray[29] = 'Of the __PNIzharites_1__SHIzharites</a>, Chenaniah and his sons [were] for __PNthe_outward_2__SHthe outward</a> business over Israel, for __PNofficers_3__SHofficers</a> and judges.__CPIzharites_1__PSIzharites__FF1Ch/26/23\');">1Ch 26:23__NB1Ch/23/12\');">1Ch 23:12__AN__GHthe_outward_2__PSthe outward__EF2Ch/34/13\');">2Ch 34:13__NBNeh/11/16\');">Neh 11:16__AN__GGofficers_3__PSofficers__FF1Ch/23/4\');">1Ch 23:4__NB2Ch/19/8\');">2Ch 19:8-11__EN';
stringArray[30] = '[And] of __PNthe_Hebronites_1__SHthe Hebronites</a>, Hashabiah and his brethren, __PNmen_of_valour_2__SHmen of valour</a>, a thousand and seven hundred, [were] __PNofficers_3__SHofficers</a> among them of Israel on this side Jordan westward in all the business of the LORD, and in the service of the king.__CPthe_Hebronites_1__PSthe Hebronites__FF1Ch/23/12\');">1Ch 23:12__NR1Ch/23/19\');">19__AN__GHmen_of_valour_2__PSmen of valour__EF1Ch/26/6\');">1Ch 26:6__AN__GGofficers_3__PSofficers__EEHeb. over the charge.</TD></TR>';
stringArray[31] = 'Among the Hebronites [was] __PNJerijah_1__SHJerijah</a> the chief, [even] among the Hebronites, according to the generations of his fathers. In the __PNfortieth_2__SHfortieth</a> year of the reign of David they were sought for, and there were found among them mighty men of valour at __PNJazer_3__SHJazer</a> of Gilead.__CPJerijah_1__PSJerijah__FF1Ch/23/19\');">1Ch 23:19__AN; Jeriah__GHfortieth_2__PSfortieth__EF1Ch/29/27\');">1Ch 29:27__NB1Ki/2/11\');">1Ki 2:11__AN__GGJazer_3__PSJazer__FFJos/21/39\');">Jos 21:39__NBIsa/16/9\');">Isa 16:9__EN';
stringArray[32] = 'And his brethren, __PNmen_of_valour_1__SHmen of valour</a>, [were] two thousand and seven hundred __PNchief_fathers_2__SHchief fathers</a>, whom king David made rulers over the __PNReubenites_3__SHReubenites</a>, the Gadites, and the half tribe of Manasseh, for every matter pertaining to God, __PNand_affairs_4__SHand affairs</a> of the king.__CPmen_of_valour_1__PSmen of valour__FF1Ch/26/6\');">1Ch 26:6-9__AN__GHchief_fathers_2__PSchief fathers__EF1Ch/15/12\');">1Ch 15:12__NB1Ch/23/24\');">1Ch 23:24__NB1Ch/24/31\');">1Ch 24:31__AN__GGReubenites_3__PSReubenites__FF1Ch/12/37\');">1Ch 12:37__AN__GHand_affairs_4__PSand affairs__FEHeb. and thing. __NA2Ch/19/11\');">2Ch 19:11__AN; There were more Levites employed as judges with the two tribes and half on the other side of Jordan, than with all the rest of the tribes; there were two thousand seven hundred, whereas on the west side of Jordan there were only one thousand seven hundred. Either those remote tribes were not so well furnished as the rest with judges of their own, or because they lay farthest from Jerusalem, on the borders of the neighbouring nations, and were thus much in danger of being infected with idolatry, they most needed the help of Levites to prevent their running into the abominations of the idolaters.</TD></TR>';
