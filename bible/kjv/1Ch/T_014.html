stringArray[15] = 'And it shall be, __PNwhen_thou_shalt_hear_1__SHwhen thou shalt hear</a> a sound of going in the tops of the mulberry trees, [that] __PNthen_thou_2__SHthen thou</a> shalt go out to battle: __PNfor_God_3__SHfor God</a> is gone forth before thee to smite the host of the Philistines.__CPwhen_thou_shalt_hear_1__PSwhen thou shalt hear__EE"Some, taking the word bechaïm, translated ""mulberry trees,"" as a proper name, render, ""when thou shalt hear a sound of going upon the summits of Bechaïm;"" other understanding rosh, ""a top,"" in the sense of beginning or entrance, read, ""when thou hearest a sound of footsteps at the entrance of the grove of mulberry trees;"" and others think a rustling among the leaves is intended. The Targumist read, ""When thou shalt hear the sound of the angels coming to thy assistance, then go out to battle; for an angel is sent from the presence of God, that he may render thy way prosperous."" If there had not been an evident supernatural interference, David might have thought that the ruse de guerre which he had used, was the cause of his victory. __NALev/26/36\');">Lev 26:36__NB2Ki/7/6\');">2Ki 7:6__NB2Ki/19/7\');">2Ki 19:7__NBAct/2/2\');">Act 2:2__AN"__GHthen_thou_2__PSthen thou__EFJdg/4/14\');">Jdg 4:14__NBJdg/7/9\');">Jdg 7:9__NRJdg/7/15\');">15__NB1Sa/14/9\');">1Sa 14:9-22__NBPhl/2/12\');">Phl 2:12__NRPhl/2/13\');">13__AN__GGfor_God_3__PSfor God__FFIsa/13/4\');">Isa 13:4__NBIsa/45/1\');">Isa 45:1__NRIsa/45/2\');">2__NBMic/2/12\');">Mic 2:12__NRMic/2/13\');">13__EN';
