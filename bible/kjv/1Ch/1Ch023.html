Text[17] = 'And the sons of Eliezer [were], Rehabiah the chief. And Eliezer had none other sons; but the sons of Rehabiah were very many.';

Text[19] = 'Of the sons of Hebron; Jeriah the first, Amariah the second, Jahaziel the third, and Jekameam the fourth.';
Text[20] = 'Of the sons of Uzziel; Michah the first, and Jesiah the second.';
Text[21] = 'The sons of Merari; Mahli, and Mushi. The sons of Mahli; Eleazar, and Kish.';
Text[22] = 'And Eleazar died, and had no sons, but daughters: and their brethren the sons of Kish took them.';
Text[23] = 'The sons of Mushi; Mahli, and Eder, and Jeremoth, three.';
Text[24] = 'These [were] the sons of Levi after the house of their fathers; [even] the chief of the fathers, as they were counted by number of names by their polls, that did the work for the service of the house of the LORD, from the age of twenty years and upward.';

Text[27] = 'For by the last words of David the Levites [were] numbered from twenty years old and above:';
