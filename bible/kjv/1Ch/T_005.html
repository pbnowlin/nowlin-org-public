stringArray[21] = 'And they __PNtook_away_1__SHtook away</a> their cattle; of their camels fifty thousand, and of sheep two hundred and fifty thousand, and of asses two thousand, and of __PNmen_2__SHmen</a> an hundred thousand.__CPtook_away_1__PStook away__EEHeb. led captive. camels. The camel, in Hebrew gamal, retained with little variation in all languages, is, according to the Linnæan system, a genus of quadrapeds of the order pecora; comprehending the camel, properly so called, with two prominences; the dromedary, with a single one; the lama, or Peruvian camel, with the back even and the breast gibbose, and the pacos, or camel without any gibbosity. The camel, properly so called, is about 6® feet in height: its head is small; ears short; neck long, slender, and bending; legs long and slender, having four callosities on the fore legs and two on the hinder, on which it rests; feet soft, parted, but not thoroughly divided; bottom of the foot tough and pliant; tail about two feet in length, terminating in a tuft; and hair fine, soft, of considerable length, and of a dusky reddish colour. Besides the same internal structure as other ruminating animals, it is furnished with an additional bag for containing a quantity of water till wanted.__GHmen_2__PSmen__FEHeb. souls of men. __NANum/31/35\');">Num 31:35__NBRev/18/13\');">Rev 18:13__EN';
