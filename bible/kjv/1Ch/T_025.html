stringArray[7] = 'So the number of them, with their brethren that were instructed in the songs of the LORD, [even] all that were cunning, was __PNtwo_hundred_1__SHtwo hundred</a> fourscore and eight.__CPtwo_hundred_1__PStwo hundred__EEThese two hundred and eighty-eight, being twenty-four courses of twelve each, were more skilful than the other Levites; and being placed under the twenty-four sons of the chief singers, they had the four thousand before mentioned divided among them, to officiate by courses, according to their instructions: __NA1Ch/23/5\');">1Ch 23:5__AN.</TD></TR>';
