<script type="text/javascript">
var Content = new Array();
Book = "1Ch";
Chapter = "8";
Content[1]="Now Benjamin begat Bela his firstborn, Ashbel the second, and Aharah the third,";
Content[2]="Nohah the fourth, and Rapha the fifth.";
Content[3]="And the sons of Bela were, Addar, and Gera, and Abihud,";
Content[4]="And Abishua, and Naaman, and Ahoah,";
Content[5]="And Gera, and Shephuphan, and Huram.";
Content[6]="And these [are] the sons of Ehud: these are the heads of the fathers of the inhabitants of Geba, and they removed them to Manahath:";
Content[7]="And Naaman, and Ahiah, and Gera, he removed them, and begat Uzza, and Ahihud.";
Content[8]="And Shaharaim begat [children] in the country of Moab, after he had sent them away; Hushim and Baara [were] his wives.";
Content[9]="And he begat of Hodesh his wife, Jobab, and Zibia, and Mesha, and Malcham,";
Content[10]="And Jeuz, and Shachia, and Mirma. These [were] his sons, heads of the fathers.";
Content[11]="And of Hushim he begat Abitub, and Elpaal.";
Content[12]="The sons of Elpaal; Eber, and Misham, and Shamed, who built Ono, and Lod, with the towns thereof:";
Content[13]="Beriah also, and Shema, who [were] heads of the fathers of the inhabitants of Aijalon, who drove away the inhabitants of Gath:";
Content[14]="And Ahio, Shashak, and Jeremoth,";
Content[15]="And Zebadiah, and Arad, and Ader,";
Content[16]="And Michael, and Ispah, and Joha, the sons of Beriah;";
Content[17]="And Zebadiah, and Meshullam, and Hezeki, and Heber,";
Content[18]="Ishmerai also, and Jezliah, and Jobab, the sons of Elpaal;";
Content[19]="And Jakim, and Zichri, and Zabdi,";
Content[20]="And Elienai, and Zilthai, and Eliel,";
Content[21]="And Adaiah, and Beraiah, and Shimrath, the sons of Shimhi;";
Content[22]="And Ishpan, and Heber, and Eliel,";
Content[23]="And Abdon, and Zichri, and Hanan,";
Content[24]="And Hananiah, and Elam, and Antothijah,";
Content[25]="And Iphedeiah, and Penuel, the sons of Shashak;";
Content[26]="And Shamsherai, and Shehariah, and Athaliah,";
Content[27]="And Jaresiah, and Eliah, and Zichri, the sons of Jeroham.";
Content[28]="These [were] heads of the fathers, by their generations, chief [men]. These dwelt in Jerusalem.";
Content[29]="And at Gibeon dwelt the father of Gibeon; whose wife's name [was] Maachah:";
Content[30]="And his firstborn son Abdon, and Zur, and Kish, and Baal, and Nadab,";
Content[31]="And Gedor, and Ahio, and Zacher.";
Content[32]="And Mikloth begat Shimeah. And these also dwelt with their brethren in Jerusalem, over against them.";
Content[33]="And Ner begat Kish, and Kish begat Saul, and Saul begat Jonathan, and Malchishua, and Abinadab, and Eshbaal.";
Content[34]="And the son of Jonathan [was] Meribbaal; and Meribbaal begat Micah.";
Content[35]="And the sons of Micah [were], Pithon, and Melech, and Tarea, and Ahaz.";
Content[36]="And Ahaz begat Jehoadah; and Jehoadah begat Alemeth, and Azmaveth, and Zimri; and Zimri begat Moza,";
Content[37]="And Moza begat Binea: Rapha [was] his son, Eleasah his son, Azel his son:";
Content[38]="And Azel had six sons, whose names [are] these, Azrikam, Bocheru, and Ishmael, and Sheariah, and Obadiah, and Hanan. All these [were] the sons of Azel.";
Content[39]="And the sons of Eshek his brother [were], Ulam his firstborn, Jehush the second, and Eliphelet the third.";
Content[40]="And the sons of Ulam were mighty men of valour, archers, and had many sons, and sons' sons, an hundred and fifty. All these [are] of the sons of Benjamin.";
</script>
