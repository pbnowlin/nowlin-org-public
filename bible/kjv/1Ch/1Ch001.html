Text[4] = 'Noah, Shem, Ham, and Japheth.';
Text[5] = 'The sons of Japheth; Gomer, and Magog, and Madai, and Javan, and Tubal, and Meshech, and Tiras.';
Text[6] = 'And the sons of Gomer; Ashchenaz, and Riphath, and Togarmah.';
Text[7] = 'And the sons of Javan; Elishah, and Tarshish, Kittim, and Dodanim.';
Text[8] = 'The sons of Ham; Cush, and Mizraim, Put, and Canaan.';
Text[9] = 'And the sons of Cush; Seba, and Havilah, and Sabta, and Raamah, and Sabtecha. And the sons of Raamah; Sheba, and Dedan.';
Text[10] = 'And Cush begat Nimrod: he began to be mighty upon the earth.';
Text[11] = 'And Mizraim begat Ludim, and Anamim, and Lehabim, and Naphtuhim,';
Text[12] = 'And Pathrusim, and Casluhim, (of whom came the Philistines,) and Caphthorim.';
Text[13] = 'And Canaan begat Zidon his firstborn, and Heth,';
Text[14] = 'The Jebusite also, and the Amorite, and the Girgashite,';
Text[15] = 'And the Hivite, and the Arkite, and the Sinite,';
Text[16] = 'And the Arvadite, and the Zemarite, and the Hamathite.';
Text[17] = 'The sons of Shem; Elam, and Asshur, and Arphaxad, and Lud, and Aram, and Uz, and Hul, and Gether, and Meshech.';
Text[18] = 'And Arphaxad begat Shelah, and Shelah begat Eber.';
Text[19] = 'And unto Eber were born two sons: the name of the one [was] Peleg; because in his days the earth was divided: and his brother\'s name [was] Joktan.';
Text[20] = 'And Joktan begat Almodad, and Sheleph, and Hazarmaveth, and Jerah,';
Text[21] = 'Hadoram also, and Uzal, and Diklah,';
Text[22] = 'And Ebal, and Abimael, and Sheba,';
Text[23] = 'And Ophir, and Havilah, and Jobab. All these [were] the sons of Joktan.';
Text[24] = 'Shem, Arphaxad, Shelah,';
Text[25] = 'Eber, Peleg, Reu,';
Text[26] = 'Serug, Nahor, Terah,';
Text[27] = 'Abram; the same [is] Abraham.';
Text[28] = 'The sons of Abraham; Isaac, and Ishmael.';
Text[29] = 'These [are] their generations: The firstborn of Ishmael, Nebaioth; then Kedar, and Adbeel, and Mibsam,';
Text[30] = 'Mishma, and Dumah, Massa, Hadad, and Tema,';
Text[31] = 'Jetur, Naphish, and Kedemah. These are the sons of Ishmael.';
Text[32] = 'Now the sons of Keturah, Abraham\'s concubine: she bare Zimran, and Jokshan, and Medan, and Midian, and Ishbak, and Shuah. And the sons of Jokshan; Sheba, and Dedan.';
Text[33] = 'And the sons of Midian; Ephah, and Epher, and Henoch, and Abida, and Eldaah. All these [are] the sons of Keturah.';
Text[34] = 'And Abraham begat Isaac. The sons of Isaac; Esau and Israel.';
Text[35] = 'The sons of Esau; Eliphaz, Reuel, and Jeush, and Jaalam, and Korah.';
Text[36] = 'The sons of Eliphaz; Teman, and Omar, Zephi, and Gatam, Kenaz, and Timna, and Amalek.';
Text[37] = 'The sons of Reuel; Nahath, Zerah, Shammah, and Mizzah.';
Text[38] = 'And the sons of Seir; Lotan, and Shobal, and Zibeon, and Anah, and Dishon, and Ezer, and Dishan.';
Text[39] = 'And the sons of Lotan; Hori, and Homam: and Timna [was] Lotan\'s sister.';
Text[40] = 'The sons of Shobal; Alian, and Manahath, and Ebal, Shephi, and Onam. And the sons of Zibeon; Aiah, and Anah.';
Text[41] = 'The sons of Anah; Dishon. And the sons of Dishon; Amram, and Eshban, and Ithran, and Cheran.';
Text[42] = 'The sons of Ezer; Bilhan, and Zavan, [and] Jakan. The sons of Dishan; Uz, and Aran.';
Text[43] = 'Now these [are] the kings that reigned in the land of Edom before [any] king reigned over the children of Israel; Bela the son of Beor: and the name of his city [was] Dinhabah.';
Text[44] = 'And when Bela was dead, Jobab the son of Zerah of Bozrah reigned in his stead.';
Text[45] = 'And when Jobab was dead, Husham of the land of the Temanites reigned in his stead.';
Text[46] = 'And when Husham was dead, Hadad the son of Bedad, which smote Midian in the field of Moab, reigned in his stead: and the name of his city [was] Avith.';
Text[47] = 'And when Hadad was dead, Samlah of Masrekah reigned in his stead.';
Text[48] = 'And when Samlah was dead, Shaul of Rehoboth by the river reigned in his stead.';
Text[49] = 'And when Shaul was dead, Baalhanan the son of Achbor reigned in his stead.';
Text[50] = 'And when Baalhanan was dead, Hadad reigned in his stead: and the name of his city [was] Pai; and his wife\'s name [was] Mehetabel, the daughter of Matred, the daughter of Mezahab.';
Text[51] = 'Hadad died also. And the dukes of Edom were; duke Timnah, duke Aliah, duke Jetheth,';
Text[52] = 'Duke Aholibamah, duke Elah, duke Pinon,';
Text[53] = 'Duke Kenaz, duke Teman, duke Mibzar,';
Text[54] = 'Duke Magdiel, duke Iram. These [are] the dukes of Edom.';
