stringArray[70] = 'And out of the half tribe of Manasseh; __PNAner_1__SHAner</a> with her suburbs, and __PNBileam_2__SHBileam</a> with her suburbs, for the family of the remnant of the sons of Kohath.__CPAner_1__PSAner__EEAner is probably another name of Tanach, which was a city of the half tribe of Manasseh, west of Jordan; and Eusebius, Jerome, and Procopius of Gaza, say that it was in their time a considerable place, three miles from Legio. __NAJos/21/25\');">Jos 21:25__AN; Tanach, Gath-rimmon.__GHBileam_2__PSBileam__FEIbleam is here called Bileam , by a transposition of letters common to all languages. It is evident, however, that many of these cities or their names have been changed since the time of Joshua; but, as it has been well observed, Salop and Shrewsbury, Sarum and Salisbury, are as different names as any in these catalogues; yet those who live in their vicinity are not at all confused by them. Some cities also are here mentioned as belonging to Ephraim, which in Joshua are spoken of as cities of Dan; but various changes in such matters would occur in a course of ages. __NAJos/17/11\');">Jos 17:11__AN; Ibleam.</TD></TR>';
