Text[1] = 'And [David] made him houses in the city of David, and prepared a place for the ark of God, and pitched for it a tent.';
Text[2] = 'Then David said, None ought to carry the ark of God but the Levites: for them hath the LORD chosen to carry the ark of God, and to minister unto him for ever.';
Text[3] = 'And David gathered all Israel together to Jerusalem, to bring up the ark of the LORD unto his place, which he had prepared for it.';
Text[4] = 'And David assembled the children of Aaron, and the Levites:';

Text[13] = 'For because ye [did it] not at the first, the LORD our God made a breach upon us, for that we sought him not after the due order.';
Text[14] = 'So the priests and the Levites sanctified themselves to bring up the ark of the LORD God of Israel.';
Text[15] = 'And the children of the Levites bare the ark of God upon their shoulders with the staves thereon, as Moses commanded according to the word of the LORD.';
Text[16] = 'And David spake to the chief of the Levites to appoint their brethren [to be] the singers with instruments of musick, psalteries and harps and cymbals, sounding, by lifting up the voice with joy.';
Text[17] = 'So the Levites appointed Heman the son of Joel; and of his brethren, Asaph the son of Berechiah; and of the sons of Merari their brethren, Ethan the son of Kushaiah;';
Text[18] = 'And with them their brethren of the second [degree], Zechariah, Ben, and Jaaziel, and Shemiramoth, and Jehiel, and Unni, Eliab, and Benaiah, and Maaseiah, and Mattithiah, and Elipheleh, and Mikneiah, and Obededom, and Jeiel, the porters.';
Text[19] = 'So the singers, Heman, Asaph, and Ethan, [were appointed] to sound with cymbals of brass;';
Text[20] = 'And Zechariah, and Aziel, and Shemiramoth, and Jehiel, and Unni, and Eliab, and Maaseiah, and Benaiah, with psalteries on Alamoth;';
Text[21] = 'And Mattithiah, and Elipheleh, and Mikneiah, and Obededom, and Jeiel, and Azaziah, with harps on the Sheminith to excel.';
Text[22] = 'And Chenaniah, chief of the Levites, [was] for song: he instructed about the song, because he [was] skilful.';
Text[23] = 'And Berechiah and Elkanah [were] doorkeepers for the ark.';
Text[24] = 'And Shebaniah, and Jehoshaphat, and Nethaneel, and Amasai, and Zechariah, and Benaiah, and Eliezer, the priests, did blow with the trumpets before the ark of God: and Obededom and Jehiah [were] doorkeepers for the ark.';
Text[25] = 'So David, and the elders of Israel, and the captains over thousands, went to bring up the ark of the covenant of the LORD out of the house of Obededom with joy.';
Text[26] = 'And it came to pass, when God helped the Levites that bare the ark of the covenant of the LORD, that they offered seven bullocks and seven rams.';
Text[27] = 'And David [was] clothed with a robe of fine linen, and all the Levites that bare the ark, and the singers, and Chenaniah the master of the song with the singers: David also [had] upon him an ephod of linen.';
Text[28] = 'Thus all Israel brought up the ark of the covenant of the LORD with shouting, and with sound of the cornet, and with trumpets, and with cymbals, making a noise with psalteries and harps.';
