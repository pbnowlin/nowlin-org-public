stringArray[17] = 'And the sons of __PNEzra_1__SHEzra</a> [were], Jether, and Mered, and Epher, and Jalon: __PNand_she_bare_Miriam_2__SHand she bare Miriam</a>, and Shammai, and Ishbah the father of __PNEshtemoa_3__SHEshtemoa</a>.__CPEzra_1__PSEzra__EEEzra seems to be the person before called Asareel in __NA1Ch/4/16\');">1Ch 4:16__AN.__GHand_she_bare_Miriam_2__PSand she bare Miriam__FEIt is probable that the latter part of __NA1Ch/4/18\');">1Ch 4:18__AN should be transposed before this passage, which Michaelis thinks is its right place; for otherwise we have the pronoun she without an antecedent, and children born without their father\'s being mentioned.__GGEshtemoa_3__PSEshtemoa__FF1Ch/4/19\');">1Ch 4:19__NB1Ch/6/57\');">1Ch 6:57__NBJos/15/50\');">Jos 15:50__AN; Eshtemoh. __NA1Ch/21/24\');">1Ch 21:24__NB1Sa/30/28\');">1Sa 30:28__EN';
stringArray[18] = 'And his wife __PNJehudijah_1__SHJehudijah</a> bare Jered __PNthe_father_2__SHthe father</a> of __PNGedor_3__SHGedor</a>, and Heber the father of __PNSocho_4__SHSocho</a>, and Jekuthiel the father of Zanoah. And these [are] the sons of Bithiah the daughter of Pharaoh, which Mered took.__CPJehudijah_1__PSJehudijah__EEor, the Jewess__GHthe_father_2__PSthe father__EF1Ch/4/4\');">1Ch 4:4__NR1Ch/4/39\');">39__NB1Ch/2/42\');">1Ch 2:42__NBJos/15/58\');">Jos 15:58__AN__GGGedor_3__PSGedor__EEGedor was a city in the tribe of Judah; and probably the same which Eusebius calls [Kedous] and Jerome Gedrus, ten miles from Diospolis, or Lydda, towards Eleutheropolis.__GHSocho_4__PSSocho__EFJos/15/34\');">Jos 15:34__NRJos/15/35\');">35__NRJos/15/48\');">48__AN, Socoh</TD></TR>';
stringArray[19] = 'And the sons of [his] wife __PNHodiah_1__SHHodiah</a> the sister of Naham, the father of __PNKeilah_2__SHKeilah</a> the Garmite, and Eshtemoa the Maachathite.__CPHodiah_1__PSHodiah__EEor, Jehudijah. mentioned before, __NA1Ch/4/18\');">1Ch 4:18__AN__GHKeilah_2__PSKeilah__EFJos/15/44\');">Jos 15:44__NB1Sa/23/1\');">1Sa 23:1-13__EN';
stringArray[20] = 'And the sons of __PNShimon_1__SHShimon</a> [were], Amnon, and Rinnah, Benhanan, and Tilon. And the sons of Ishi [were], Zoheth, and Benzoheth.__CPShimon_1__PSShimon__EEShimon is supposed to have been another son of Mered, by Jehudijah. As this latter name signifies a Jewess, it rather favours the opinion that Bithiah was not a Jewess, but an Egyptian.</TD></TR>';

stringArray[22] = 'And Jokim, and the men of Chozeba, and Joash, and Saraph, who had the dominion in Moab, and Jashubilehem. And [these are] ancient things.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';

stringArray[39] = 'And __PNthey_went_1__SHthey went</a> to the entrance of __PNGedor_2__SHGedor</a>, [even] unto the east side of the valley, to seek pasture for their flocks.__CPthey_went_1__PSthey went__EEThis expedition of the Simeonites took place in the days of Hezekiah, and, as Calmet conjectures, near the time of the captivity of the ten tribes; when the remnant of Simeon would feel themselves obliged to retire more southward into Arabia Petræa, for fear of the Jews, and to seek pasture for their flocks.__GHGedor_2__PSGedor__EF1Ch/4/4\');">1Ch 4:4__NR1Ch/4/18\');">18__NBJos/12/13\');">Jos 12:13__AN; Geder. __NAJos/15/58\');">Jos 15:58__EN';
