Text[1] = 'Now after this it came to pass, that David smote the Philistines, and subdued them, and took Gath and her towns out of the hand of the Philistines.';
Text[2] = 'And he smote Moab; and the Moabites became David\'s servants, [and] brought gifts.';
Text[3] = 'And David smote Hadarezer king of Zobah unto Hamath, as he went to stablish his dominion by the river Euphrates.';

Text[10] = 'He sent Hadoram his son to king David, to enquire of his welfare, and to congratulate him, because he had fought against Hadarezer, and smitten him; (for Hadarezer had war with Tou;) and [with him] all manner of vessels of gold and silver and brass.';
Text[11] = 'Them also king David dedicated unto the LORD, with the silver and the gold that he brought from all [these] nations; from Edom, and from Moab, and from the children of Ammon, and from the Philistines, and from Amalek.';

Text[14] = 'So David reigned over all Israel, and executed judgment and justice among all his people.';
