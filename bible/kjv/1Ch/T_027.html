var stringArray = new Array();
stringArray[1] = 'Now the children of Israel after their number, [to wit], __PNthe_chief_fathers_1__SHthe chief fathers</a> and __PNcaptains_2__SHcaptains</a> of thousands and hundreds, and their officers that __PNserved_3__SHserved</a> the king in __PNany_matter_4__SHany matter</a> of the courses, which came in and went out __PNmonth_5__SHmonth</a> by month throughout all the months of the year, of every course [were] twenty and four thousand.__CPthe_chief_fathers_1__PSthe chief fathers__EEThe patriarchs, chief generals, or generals of brigade. This enumeration is widely different from that of the preceding. In that, we have the order and course of the priests and Levites, in their ecclesiastical ministrations: in this, we have the account of the order of the civil service, what related simply to the political state of the king and kingdom. Twenty-four persons, chosen out of David\'s worthies, each of whom had a second, were placed over 24,000 men, who all served a month at a time, in turn; and this was the whole of their service during the year, after which they attended to their own affairs. Thus the king had always on foot a regular force of 24,000, who served without expense to him or the state, and were not oppressed by the service, which took up only a twelfth part of their time; and by this plan he could, at any time, bring into the field 12 times 24,000 or 288,000 fighting men, independently of the 12,000 officers, which made in the whole an effective force of 300,000 soldiers; and all t__GHcaptains_2__PScaptains__EF1Ch/13/1\');">1Ch 13:1__NBExd/18/25\');">Exd 18:25__NBDeu/1/15\');">Deu 1:15__NB1Sa/8/12\');">1Sa 8:12__NBMic/5/2\');">Mic 5:2__AN__GGserved_3__PSserved__FF1Ch/28/1\');">1Ch 28:1__NB2Ch/17/12\');">2Ch 17:12-19__NB2Ch/26/11\');">2Ch 26:11-13__AN__GHany_matter_4__PSany matter__EF1Ki/5/14\');">1Ki 5:14__AN__GGmonth_5__PSmonth__FF1Ki/4/7\');">1Ki 4:7__NR1Ki/4/27\');">27__EN';

stringArray[16] = '__PNFurthermore_1__SHFurthermore</a> over the tribes of Israel: the ruler of the Reubenites [was] Eliezer the son of Zichri: of the Simeonites, Shephatiah the son of Maachah:__CPFurthermore_1__PSFurthermore__EE"These persons, called ""princes of the tribes,"" in __NA1Ch/27/22\');">1Ch 27:22__AN, and __NA1Ch/28/1\');">1Ch 28:1__AN, appear to have been civil rulers over their several tribes, and honorary men, without pay, not unlike the lords lieutenants of our counties. In this enumeration there is no mention of the tribes of Gad and Asher, probably because they were joined to the neighbouring tribes; or perhaps, the account of these has been lost from the register."</TD></TR>';

stringArray[23] = 'But __PNDavid_took_not_1__SHDavid took not</a> the number of them __PNfrom_twenty_2__SHfrom twenty</a> years old and under: because the LORD had said __PNhe_would_increase_3__SHhe would increase</a> Israel like to the stars of the heavens.__CPDavid_took_not_1__PSDavid took not__EEIt seems probable, from this passage, that Joab began, by David\'s order, to number the children, as well as adults, but was prevented from finishing the account, probably because the plague had begun. The numbering of the effective men might have been deemed a political expedient; but pride and ostentation alone could dictate the numbering of minors and infants, especially as God had pronounced the seed of Abraham, Isaac, and Jacob, innumerable.__GHfrom_twenty_2__PSfrom twenty__EFNum/1/18\');">Num 1:18__AN__GGhe_would_increase_3__PShe would increase__FFGen/15/5\');">Gen 15:5__NBHbr/11/12\');">Hbr 11:12__EN';
stringArray[24] = 'Joab the son of Zeruiah __PNbegan_to_number_1__SHbegan to number</a>, but he finished not, because there fell wrath for it against Israel; neither __PNwas_the_number_put_2__SHwas the number put</a> in the account of the chronicles of king David.__CPbegan_to_number_1__PSbegan to number__FF1Ch/21/1\');">1Ch 21:1-17__NB2Sa/24/1\');">2Sa 24:1-15__AN__GHwas_the_number_put_2__PSwas the number put__FEHeb. ascended the number.</TD></TR>';
stringArray[25] = 'And over __PNthe_king_s_1__SHthe king\'s</a> treasures [was] Azmaveth the son of Adiel: and over __PNthe_storehouses_2__SHthe storehouses</a> in the fields, in the cities, and in the villages, and in the castles, [was] Jehonathan the son of Uzziah:__CPthe_king_s_1__PSthe king\'s__FF2Ki/18/15\');">2Ki 18:15__NB2Ch/16/2\');">2Ch 16:2__AN__GHthe_storehouses_2__PSthe storehouses__EFGen/41/48\');">Gen 41:48__NBExd/1/11\');">Exd 1:11__NB2Ch/26/10\');">2Ch 26:10__NBJer/41/8\');">Jer 41:8__EN';
stringArray[26] = 'And over them that did the work of the field for tillage of the ground [was] Ezri the son of Chelub:__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[27] = 'And over the vineyards [was] Shimei the Ramathite: over __PNthe_increase_of_the_vineyards_1__SHthe increase of the vineyards</a> for the wine cellars [was] Zabdi the Shiphmite:__CPthe_increase_of_the_vineyards_1__PSthe increase of the vineyards__EEHeb. that which was of the vineyards.</TD></TR>';
stringArray[28] = '__PNAnd_over_1__SHAnd over</a> the olive trees and __PNthe_sycomore_trees_2__SHthe sycomore trees</a> that [were] in the low plains [was] Baalhanan the Gederite: and over the cellars of oil [was] Joash:__CPAnd_over_1__PSAnd over__FF1Ki/4/7\');">1Ki 4:7__AN__GHthe_sycomore_trees_2__PSthe sycomore trees__FE"The Hebrew shikmin, Syriac shekmo, and Arabic jummeez, is the [sykomoros] or sycomore, of the Greeks, so called from [sykos] a fig-tree, and [moros] a mulberry- tree, because it resembles the latter in its leaves, and the former in its fruits. ""The sycamore,"" says Mr. Norden, ""is of the height of a beech, and bears its fruit in a manner quite different from other trees: it has them on the trunk itself, which shoots out little sprigs, in form of grape stalks, at the end of which grow the fruit close to one another, almost like a cluster of grapes. The tree is always green, and bears fruit several times in the year, without observing any certain seasons; for I have seen some sycamores that have given fruit two months after others. The fruit has the figure and smell of real figs, but is inferior to them in the taste, having a disgusting sweetness. Its colour is a yellow, inclining to an ochre, shadowed by a flesh colour. In the inside it resembles the common figs, excepting that it has a blackish colouring with "</TD></TR>';

stringArray[32] = 'Also Jonathan David\'s __PNuncle_1__SHuncle</a> was a counsellor, a wise man, and a __PNscribe_2__SHscribe</a>: and Jehiel the __PNson_of_Hachmoni_3__SHson of Hachmoni</a> [was] with the king\'s sons:__CPuncle_1__PSuncle__FF2Sa/13/3\');">2Sa 13:3__NB2Sa/21/21\');">2Sa 21:21__AN; nephew.__GHscribe_2__PSscribe__FEor, secretary.__GGson_of_Hachmoni_3__PSson of Hachmoni__EEor, Hachmonite. __NA1Ch/11/11\');">1Ch 11:11__EN';
