var stringArray = new Array();
stringArray[1] = 'Now the sons of Issachar [were], Tola, and Puah, Jashub, and Shimron, four.__CPRelated_Verses1_1__PSEntire Verse.__FFGen/46/13\');">Gen 46:13__AN; Phuvah, Job. __NANum/26/23\');">Num 26:23__NRNum/26/24\');">24__AN; Pua</TD></TR>';
stringArray[2] = 'And the sons of Tola; Uzzi, and Rephaiah, and Jeriel, and Jahmai, and Jibsam, and Shemuel, heads of their father\'s house, [to wit], of Tola: [they were] valiant men of might in their generations; __PNwhose_number_1__SHwhose number</a> [was] in the days of David two and twenty thousand and six hundred.__CPwhose_number_1__PSwhose number__EEThis was probably the number returned by Joab and his assistants, when they made that census of the people with which God was so much displeased. We find that the effective men of Issachar amounted to 87,000 (__NA1Ch/7/5\');">1Ch 7:5__AN;) 22,600 of whom descended from Tola his eldest son; but whether the 36,000 (__NA1Ch/7/4\');">1Ch 7:4__AN) were descendants of Tola by Uzzi, and the 22,600 his descendants by Tola\'s other sons; or whether another of Issachar\'s sons be intended, does not clearly appear; though the former seems the more obvious meaning. __NA1Ch/21/1\');">1Ch 21:1-5__NB1Ch/27/1\');">1Ch 27:1__NR1Ch/27/23\');">23__NR1Ch/27/24\');">24__NB2Sa/24/1\');">2Sa 24:1-9__EN';
stringArray[3] = 'And the sons of Uzzi; Izrahiah: and the sons of Izrahiah; Michael, and Obadiah, and Joel, Ishiah, five: all of them chief men.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[4] = 'And with them, by their generations, after the house of their fathers, [were] bands of soldiers for war, six and thirty thousand [men]: for they had many wives and sons.__CPRelated_Verses1_1__PSEntire Verse.__FF1Ch/12/32\');">1Ch 12:32__EN';
stringArray[5] = 'And their brethren among all the families of Issachar [were] valiant men of might, reckoned in all by their genealogies fourscore and seven thousand.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[6] = '[The sons] __PNof_Benjamin_1__SHof Benjamin</a>; Bela, and Becher, and __PNJediael_2__SHJediael</a>, three.__CPof_Benjamin_1__PSof Benjamin__EEIn the parallel place of Genesis, ten sons of Benjamin are reckoned, Bela, Becher, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim, and Ard; and in Numbers, five only are mentioned, Bela, Ashbel, Ahiraim, Shupham, and Hupham; and Ard and Naaman are said to be the sons of Bela, and consequently Benjamin\'s grandsons. In the beginning of the following chapter, also, five are only mentioned, Bela, Ashbel, Aharah, Nohah, and Rapha; and Addar, Gera, Abihud, Abishua, Naaman, Ahoha, another Gera, Shephuphan, and Huram, are all represented as grandsons, not sons of Benjamin: hence we see that in many cases, grandsons are called sons, and both are often confounded in the genealogical tables. It seems, also, that the persons mentioned in the following verses were neither sons nor grandsons of Bela and Becher, but distinguished persons among their descendants. __NA1Ch/8/1\');">1Ch 8:1-12__NBGen/46/21\');">Gen 46:21__NBNum/26/38\');">Num 26:38-41__AN__GHJediael_2__PSJediael__EF1Ch/7/10\');">1Ch 7:10__NR1Ch/7/11\');">11__EN';
stringArray[7] = 'And the sons of Bela; Ezbon, and Uzzi, and Uzziel, and Jerimoth, and Iri, five; heads of the house of [their] fathers, mighty men of valour; and __PNwere_reckoned_1__SHwere reckoned</a> by their genealogies twenty and two thousand and thirty and four.__CPwere_reckoned_1__PSwere reckoned__FF1Ch/21/1\');">1Ch 21:1-5__NB2Ch/17/17\');">2Ch 17:17__NR2Ch/17/18\');">18__EN';
stringArray[8] = 'And the sons of Becher; Zemira, and Joash, and Eliezer, and Elioenai, and Omri, and Jerimoth, and Abiah, and Anathoth, and Alameth. All these [are] the sons of Becher.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[9] = 'And the number of them, after their genealogy by their generations, heads of the house of their fathers, mighty men of valour, [was] twenty thousand and two hundred.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[10] = 'The sons also of Jediael; Bilhan: and the sons of Bilhan; Jeush, and Benjamin, and __PNEhud_1__SHEhud</a>, and Chenaanah, and Zethan, and Tharshish, and Ahishahar.__CPEhud_1__PSEhud__FFJdg/3/15\');">Jdg 3:15-30__EN';
stringArray[11] = 'All these the sons of Jediael, by the heads of their fathers, __PNmighty_men_1__SHmighty men</a> of valour, [were] seventeen thousand and two hundred [soldiers], fit to go out for war [and] battle.__CPmighty_men_1__PSmighty men__FF2Ch/17/13\');">2Ch 17:13-19__EN';
stringArray[12] = '__PNShuppim_1__SHShuppim</a> also, and Huppim, the children of __PNIr_2__SHIr</a>, [and] Hushim, the sons of __PNAher_3__SHAher</a>.__CPShuppim_1__PSShuppim__FF1Ch/7/15\');">1Ch 7:15__NBGen/46/21\');">Gen 46:21__AN; Muppim, Huppim. __NANum/26/39\');">Num 26:39__AN; Shupham, Hupham__GHIr_2__PSIr__EF1Ch/7/7\');">1Ch 7:7__AN, Iri.__GGAher_3__PSAher__EE"Aher signifies another , and it has been conjectured that these were Danites, ""the sons of another tribe;"" especially as Hushim is named as the only son of Dan, __NAGen/46/23\');">Gen 46:23__AN. And they suppose that the name of Dan was not mentioned, because his descendants first established idolatry. But Zebulun, as well as Dan, is here omitted, perhaps because none of either of these tribes returned at first from Babylon. Though the Benjamites had been almost destroyed in the first days of the judges, they soon became numerous and powerful. __NANum/26/38\');">Num 26:38__AN; Ahiram."</TD></TR>';
stringArray[13] = 'The sons of Naphtali; __PNJahziel_1__SHJahziel</a>, and Guni, and Jezer, and __PNShallum_2__SHShallum</a>, __PNthe_sons_of_Bilhah_3__SHthe sons of Bilhah</a>.__CPJahziel_1__PSJahziel__FFGen/46/24\');">Gen 46:24__NBNum/26/48\');">Num 26:48__AN; Jahzeel__GHShallum_2__PSShallum__EFGen/46/24\');">Gen 46:24__NBNum/26/49\');">Num 26:49__AN; Shillem__GGthe_sons_of_Bilhah_3__PSthe sons of Bilhah__FFGen/30/3\');">Gen 30:3-8__NBGen/35/22\');">Gen 35:22__NBGen/46/25\');">Gen 46:25__EN';
stringArray[14] = '__PNThe_sons_1__SHThe sons</a> of Manasseh; Ashriel, whom she bare: ([but] his concubine the Aramitess bare __PNMachir_2__SHMachir</a> the father of Gilead:__CPThe_sons_1__PSThe sons__EE"The text in these two verses seems to be strangely corrupted; and, as it stands, is scarcely intelligible. Probably it should be rendered, ""The sons of Manasseh were Ashriel, whom his Syrian concubine bore to him; and Machir the father of Gilead, whom (his wife) bore to him. Machir took for a wife Maachah, sister to Huppim and Shuppim."" This is nearly the version of Dr. Geddes."__GHMachir_2__PSMachir__EF1Ch/2/21\');">1Ch 2:21-23__NBGen/50/23\');">Gen 50:23__NBNum/26/29\');">Num 26:29-34__NBNum/27/1\');">Num 27:1__NBNum/32/30\');">Num 32:30-42__NBDeu/3/13\');">Deu 3:13-15__NBJos/13/31\');">Jos 13:31__NBJos/17/1\');">Jos 17:1-3__NBJdg/5/14\');">Jdg 5:14__EN';
stringArray[15] = 'And Machir took to wife [the sister] of __PNHuppim_1__SHHuppim</a> and Shuppim, whose sister\'s name [was] Maachah;) __PNand_the_name_2__SHand the name</a> of the second [was] Zelophehad: __PNand_Zelophehad_3__SHand Zelophehad</a> had daughters.__CPHuppim_1__PSHuppim__FF1Ch/7/12\');">1Ch 7:12__AN__GHand_the_name_2__PSand the name__FEIt is certain that Zelophehad was not a son, but a descendant of Manasseh\'s, three generations having intervened; for he was the son of Hepher, the son of Gilead, the son of Machir, the son of Manasseh.__GGand_Zelophehad_3__PSand Zelophehad__FFNum/26/33\');">Num 26:33__NBNum/27/1\');">Num 27:1-11__NBNum/36/1\');">Num 36:1-12__EN';
stringArray[16] = 'And Maachah the wife of Machir bare a son, and she called his name Peresh; and the name of his brother [was] Sheresh; and his sons [were] Ulam and Rakem.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[17] = 'And the sons of Ulam; __PNBedan_1__SHBedan</a>. These [were] the sons of Gilead, the son of Machir, the son of Manasseh.__CPBedan_1__PSBedan__FF1Sa/12/11\');">1Sa 12:11__EN';
stringArray[18] = 'And his sister Hammoleketh bare Ishod, and Abiezer, and Mahalah.__CPRelated_Verses1_1__PSEntire Verse.__FFNum/26/30\');">Num 26:30__AN; Jeezer. __NAJdg/6/11\');">Jdg 6:11__NRJdg/6/24\');">24__NRJdg/6/34\');">34__NBJdg/8/2\');">Jdg 8:2__EN';
stringArray[19] = 'And the sons of Shemida were, Ahian, and Shechem, and Likhi, and Aniam.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[20] = 'And the sons of Ephraim; Shuthelah, and Bered his son, and Tahath his son, and Eladah his son, and Tahath his son,__CPRelated_Verses1_1__PSEntire Verse.__FFNum/26/35\');">Num 26:35__NRNum/26/36\');">36__EN';
stringArray[21] = 'And Zabad his son, and Shuthelah his son, and Ezer, and Elead, whom the men of Gath [that were] born in [that] land slew, __PNbecause_they_came_1__SHbecause they came</a> down to take away their cattle.__CPbecause_they_came_1__PSbecause they came__EE"Or rather, ""when [ ( )] (kee) they came down to take away their cattle;"" for it does not appear that the sons of Ephraim were the aggressors, but the men of Gath, who appear to have been born in Egypt. This is the only place in the Sacred Writings where this piece of history is mentioned, and the transaction seems to have happened before the Israelites came out of Egypt; for it appears from the following verse, that Ephraim was alive when these children of his were slain."</TD></TR>';
stringArray[22] = 'And Ephraim their father __PNmourned_1__SHmourned</a> many days, __PNand_his_brethren_2__SHand his brethren</a> came to comfort him.__CPmourned_1__PSmourned__FFGen/37/34\');">Gen 37:34__AN__GHand_his_brethren_2__PSand his brethren__EFJob/2/11\');">Job 2:11__EN';
stringArray[23] = 'And when he went in to his wife, she conceived, and bare a son, and he called his name __PNBeriah_1__SHBeriah</a>, because it went evil with his house.__CPBeriah_1__PSBeriah__EE"that is, In evil. because. Many similar instances of the naming of children from passing circumstances, occur throughout the sacred volume. See those of a similar character with this verse: __NAGen/35/18\');">Ge 35:18__AN, where Rachel, while dying, names her new-born son Ben-oni, or, the son of my sorrow. So in 1 SA 4:21, the wife of Phinehas, on being apprised of the death of Eli and her husband, and that the ark was taken by the Philistines, while in the pains of travail, and dying, named her son I-chabod, or, there is no glory. So also in the 4th chapter of this book, __NA1Ch/7/9\');">1Ch 7:9__AN, we read that Jabez, or, sorrowful, had that name given to him, because his mother ""bare him with sorrow."" __NA2Sa/23/5\');">2Sa 23:5__AN"</TD></TR>';
stringArray[24] = '(And his daughter [was] Sherah, who built __PNBeth_horon_1__SHBethhoron</a> the nether, and the upper, and Uzzensherah.)__CPBeth_horon_1__PSBeth-horon__FFJos/16/3\');">Jos 16:3__NRJos/16/5\');">5__NB1Ki/9/17\');">1Ki 9:17__NB2Ch/8/5\');">2Ch 8:5__EN';

stringArray[28] = 'And their possessions and habitations [were], __PNBeth_el_1__SHBethel</a> and the towns thereof, and eastward __PNNaaran_2__SHNaaran</a>, and westward __PNGezer_3__SHGezer</a>, with the __PNtowns_4__SHtowns</a> thereof; Shechem also and the towns thereof, unto Gaza and the towns thereof:__CPBeth_el_1__PSBeth-el__FFGen/28/19\');">Gen 28:19__NBJos/16/2\');">Jos 16:2__NBJdg/1/22\');">Jdg 1:22__AN__GHNaaran_2__PSNaaran__FENaaran, or Naarath, Eusebius says was a town in his time called [Noorath] Noorath, five miles from Jericho. It appears to be the same as [Neara] Neara, mentioned by Josephus, from whence, he says, they brought the water which watered the palm-trees of Jericho. Naarath__GGGezer_3__PSGezer__FF1Ch/6/66\');">1Ch 6:66__NR1Ch/6/67\');">67__AN__GHtowns_4__PStowns__FEHeb. daughters.</TD></TR>';
stringArray[29] = 'And by the borders of the children of __PNManasseh_1__SHManasseh</a>, __PNBeth_shean_2__SHBethshean</a> and her towns, __PNTaanach_3__SHTaanach</a> and her towns, __PNMegiddo_4__SHMegiddo</a> and her towns, Dor and her towns. __PNIn_these_dwelt_5__SHIn these dwelt</a> the children of Joseph the son of Israel.__CPManasseh_1__PSManasseh__FFJos/17/7\');">Jos 17:7-11__AN__GHBeth_shean_2__PSBeth-shean__EF1Sa/31/10\');">1Sa 31:10__AN; Bethshan.__GGTaanach_3__PSTaanach__FFJdg/5/19\');">Jdg 5:19__NB1Ki/4/12\');">1Ki 4:12__AN__GHMegiddo_4__PSMegiddo__EFJdg/1/27\');">Jdg 1:27__NB1Ki/9/15\');">1Ki 9:15__NB2Ki/9/27\');">2Ki 9:27__NB2Ki/23/29\');">2Ki 23:29__NB2Ch/35/22\');">2Ch 35:22__NBZec/12/11\');">Zec 12:11__NBRev/16/16\');">Rev 16:16__AN__GGIn_these_dwelt_5__PSIn these dwelt__FFJos/16/\');">Jos 16__AN;__NAJos/17/\');">17__NBJdg/1/22\');">Jdg 1:22-29__EN';
stringArray[30] = 'The sons of Asher; __PNImnah_1__SHImnah</a>, and Isuah, and __PNIshuai_2__SHIshuai</a>, and Beriah, and Serah their sister.__CPImnah_1__PSImnah__EEThis variation only exists in the translation; the original being uniformly Jimnah, or Yimnah. __NAGen/46/17\');">Gen 46:17__NBNum/26/44\');">Num 26:44-46__AN; Jimnah__GHIshuai_2__PSIshuai__FEThis variation is also attributable to the translator; the Hebrew being in both places Isui, or rather, Yishwi. __NAGen/46/17\');">Gen 46:17__AN; Isui</TD></TR>';
