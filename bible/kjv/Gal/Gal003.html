Text[1] = 'O foolish Galatians, who hath bewitched you, that ye should not obey the truth, before whose eyes Jesus Christ hath been evidently set forth, crucified among you?';
Text[2] = 'This only would I learn of you, Received ye the Spirit by the works of the law, or by the hearing of faith?';
Text[3] = 'Are ye so foolish? having begun in the Spirit, are ye now made perfect by the flesh?';
Text[4] = 'Have ye suffered so many things in vain? if [it be] yet in vain.';
Text[5] = 'He therefore that ministereth to you the Spirit, and worketh miracles among you, [doeth he it] by the works of the law, or by the hearing of faith?';

Text[10] = 'For as many as are of the works of the law are under the curse: for it is written, Cursed [is] every one that continueth not in all things which are written in the book of the law to do them.';
Text[11] = 'But that no man is justified by the law in the sight of God, [it is] evident: for, The just shall live by faith.';
Text[12] = 'And the law is not of faith: but, The man that doeth them shall live in them.';
Text[13] = 'Christ hath redeemed us from the curse of the law, being made a curse for us: for it is written, Cursed [is] every one that hangeth on a tree:';

Text[18] = 'For if the inheritance [be] of the law, [it is] no more of promise: but God gave [it] to Abraham by promise.';
Text[19] = 'Wherefore then [serveth] the law? It was added because of transgressions, till the seed should come to whom the promise was made; [and it was] ordained by angels in the hand of a mediator.';
Text[20] = 'Now a mediator is not [a mediator] of one, but God is one.';
Text[21] = '[Is] the law then against the promises of God? God forbid: for if there had been a law given which could have given life, verily righteousness should have been by the law.';

Text[23] = 'But before faith came, we were kept under the law, shut up unto the faith which should afterwards be revealed.';
Text[24] = 'Wherefore the law was our schoolmaster [to bring us] unto Christ, that we might be justified by faith.';
