Chapter = "126";
Content[1]="[[A Song of degrees.]] When the LORD turned again the captivity of Zion, we were like them that dream.";

Content[3]="The LORD hath done great things for us; [whereof] we are glad.";
Content[4]="Turn again our captivity, O LORD, as the streams in the south.";
Content[5]="They that sow in tears shall reap in joy.";
Content[6]="He that goeth forth and weepeth, bearing precious seed, shall doubtless come again with rejoicing, bringing his sheaves [with him].";
