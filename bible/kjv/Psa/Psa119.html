Text[1] = 'ALEPH. Blessed [are] the undefiled in the way, who walk in the law of the LORD.';
Text[2] = 'Blessed [are] they that keep his testimonies, [and that] seek him with the whole heart.';
Text[3] = 'They also do no iniquity: they walk in his ways.';
Text[4] = 'Thou hast commanded [us] to keep thy precepts diligently.';
Text[5] = 'O that my ways were directed to keep thy statutes!';
Text[6] = 'Then shall I not be ashamed, when I have respect unto all thy commandments.';
Text[7] = 'I will praise thee with uprightness of heart, when I shall have learned thy righteous judgments.';
Text[8] = 'I will keep thy statutes: O forsake me not utterly.';
Text[9] = 'BETH. Wherewithal shall a young man cleanse his way? by taking heed [thereto] according to thy word.';
Text[10] = 'With my whole heart have I sought thee: O let me not wander from thy commandments.';
Text[11] = 'Thy word have I hid in mine heart, that I might not sin against thee.';
Text[12] = 'Blessed [art] thou, O LORD: teach me thy statutes.';
Text[13] = 'With my lips have I declared all the judgments of thy mouth.';
Text[14] = 'I have rejoiced in the way of thy testimonies, as [much as] in all riches.';
Text[15] = 'I will meditate in thy precepts, and have respect unto thy ways.';
Text[16] = 'I will delight myself in thy statutes: I will not forget thy word.';
Text[17] = 'GIMEL. Deal bountifully with thy servant, [that] I may live, and keep thy word.';
Text[18] = 'Open thou mine eyes, that I may behold wondrous things out of thy law.';
Text[19] = 'I [am] a stranger in the earth: hide not thy commandments from me.';
Text[20] = 'My soul breaketh for the longing [that it hath] unto thy judgments at all times.';
Text[21] = 'Thou hast rebuked the proud [that are] cursed, which do err from thy commandments.';
Text[22] = 'Remove from me reproach and contempt; for I have kept thy testimonies.';
Text[23] = 'Princes also did sit [and] speak against me: [but] thy servant did meditate in thy statutes.';
Text[24] = 'Thy testimonies also [are] my delight [and] my counsellors.';
Text[25] = 'DALETH. My soul cleaveth unto the dust: quicken thou me according to thy word.';
Text[26] = 'I have declared my ways, and thou heardest me: teach me thy statutes.';
Text[27] = 'Make me to understand the way of thy precepts: so shall I talk of thy wondrous works.';
Text[28] = 'My soul melteth for heaviness: strengthen thou me according unto thy word.';
Text[29] = 'Remove from me the way of lying: and grant me thy law graciously.';
Text[30] = 'I have chosen the way of truth: thy judgments have I laid [before me].';
Text[31] = 'I have stuck unto thy testimonies: O LORD, put me not to shame.';
Text[32] = 'I will run the way of thy commandments, when thou shalt enlarge my heart.';
Text[33] = 'HE. Teach me, O LORD, the way of thy statutes; and I shall keep it [unto] the end.';
Text[34] = 'Give me understanding, and I shall keep thy law; yea, I shall observe it with [my] whole heart.';
Text[35] = 'Make me to go in the path of thy commandments; for therein do I delight.';
Text[36] = 'Incline my heart unto thy testimonies, and not to covetousness.';
Text[37] = 'Turn away mine eyes from beholding vanity; [and] quicken thou me in thy way.';
Text[38] = 'Stablish thy word unto thy servant, who [is devoted] to thy fear.';
Text[39] = 'Turn away my reproach which I fear: for thy judgments [are] good.';
Text[40] = 'Behold, I have longed after thy precepts: quicken me in thy righteousness.';
Text[41] = 'VAU. Let thy mercies come also unto me, O LORD, [even] thy salvation, according to thy word.';
Text[42] = 'So shall I have wherewith to answer him that reproacheth me: for I trust in thy word.';
Text[43] = 'And take not the word of truth utterly out of my mouth; for I have hoped in thy judgments.';
Text[44] = 'So shall I keep thy law continually for ever and ever.';
Text[45] = 'And I will walk at liberty: for I seek thy precepts.';
Text[46] = 'I will speak of thy testimonies also before kings, and will not be ashamed.';
Text[47] = 'And I will delight myself in thy commandments, which I have loved.';
Text[48] = 'My hands also will I lift up unto thy commandments, which I have loved; and I will meditate in thy statutes.';
Text[49] = 'ZAIN. Remember the word unto thy servant, upon which thou hast caused me to hope.';
Text[50] = 'This [is] my comfort in my affliction: for thy word hath quickened me.';
Text[51] = 'The proud have had me greatly in derision: [yet] have I not declined from thy law.';
Text[52] = 'I remembered thy judgments of old, O LORD; and have comforted myself.';
Text[53] = 'Horror hath taken hold upon me because of the wicked that forsake thy law.';
Text[54] = 'Thy statutes have been my songs in the house of my pilgrimage.';
Text[55] = 'I have remembered thy name, O LORD, in the night, and have kept thy law.';
Text[56] = 'This I had, because I kept thy precepts.';
Text[57] = 'CHETH. [Thou art] my portion, O LORD: I have said that I would keep thy words.';
Text[58] = 'I intreated thy favour with [my] whole heart: be merciful unto me according to thy word.';
Text[59] = 'I thought on my ways, and turned my feet unto thy testimonies.';
Text[60] = 'I made haste, and delayed not to keep thy commandments.';
Text[61] = 'The bands of the wicked have robbed me: [but] I have not forgotten thy law.';
Text[62] = 'At midnight I will rise to give thanks unto thee because of thy righteous judgments.';
Text[63] = 'I [am] a companion of all [them] that fear thee, and of them that keep thy precepts.';
Text[64] = 'The earth, O LORD, is full of thy mercy: teach me thy statutes.';
Text[65] = 'TETH. Thou hast dealt well with thy servant, O LORD, according unto thy word.';
Text[66] = 'Teach me good judgment and knowledge: for I have believed thy commandments.';
Text[67] = 'Before I was afflicted I went astray: but now have I kept thy word.';
Text[68] = 'Thou [art] good, and doest good; teach me thy statutes.';
Text[69] = 'The proud have forged a lie against me: [but] I will keep thy precepts with [my] whole heart.';
Text[70] = 'Their heart is as fat as grease; [but] I delight in thy law.';
Text[71] = '[It is] good for me that I have been afflicted; that I might learn thy statutes.';
Text[72] = 'The law of thy mouth [is] better unto me than thousands of gold and silver.';
Text[73] = 'JOD. Thy hands have made me and fashioned me: give me understanding, that I may learn thy commandments.';
Text[74] = 'They that fear thee will be glad when they see me; because I have hoped in thy word.';
Text[75] = 'I know, O LORD, that thy judgments [are] right, and [that] thou in faithfulness hast afflicted me.';
Text[76] = 'Let, I pray thee, thy merciful kindness be for my comfort, according to thy word unto thy servant.';
Text[77] = 'Let thy tender mercies come unto me, that I may live: for thy law [is] my delight.';
Text[78] = 'Let the proud be ashamed; for they dealt perversely with me without a cause: [but] I will meditate in thy precepts.';
Text[79] = 'Let those that fear thee turn unto me, and those that have known thy testimonies.';
Text[80] = 'Let my heart be sound in thy statutes; that I be not ashamed.';
Text[81] = 'CAPH. My soul fainteth for thy salvation: [but] I hope in thy word.';
Text[82] = 'Mine eyes fail for thy word, saying, When wilt thou comfort me?';
Text[83] = 'For I am become like a bottle in the smoke; [yet] do I not forget thy statutes.';
Text[84] = 'How many [are] the days of thy servant? when wilt thou execute judgment on them that persecute me?';
Text[85] = 'The proud have digged pits for me, which [are] not after thy law.';
Text[86] = 'All thy commandments [are] faithful: they persecute me wrongfully; help thou me.';
Text[87] = 'They had almost consumed me upon earth; but I forsook not thy precepts.';
Text[88] = 'Quicken me after thy lovingkindness; so shall I keep the testimony of thy mouth.';
Text[89] = 'LAMED. For ever, O LORD, thy word is settled in heaven.';
Text[90] = 'Thy faithfulness [is] unto all generations: thou hast established the earth, and it abideth.';
Text[91] = 'They continue this day according to thine ordinances: for all [are] thy servants.';
Text[92] = 'Unless thy law [had been] my delights, I should then have perished in mine affliction.';
Text[93] = 'I will never forget thy precepts: for with them thou hast quickened me.';
Text[94] = 'I [am] thine, save me; for I have sought thy precepts.';
Text[95] = 'The wicked have waited for me to destroy me: [but] I will consider thy testimonies.';
Text[96] = 'I have seen an end of all perfection: [but] thy commandment [is] exceeding broad.';
Text[97] = 'MEM. O how love I thy law! it [is] my meditation all the day.';
Text[98] = 'Thou through thy commandments hast made me wiser than mine enemies: for they [are] ever with me.';
Text[99] = 'I have more understanding than all my teachers: for thy testimonies [are] my meditation.';
Text[100] = 'I understand more than the ancients, because I keep thy precepts.';
Text[101] = 'I have refrained my feet from every evil way, that I might keep thy word.';
Text[102] = 'I have not departed from thy judgments: for thou hast taught me.';
Text[103] = 'How sweet are thy words unto my taste! [yea, sweeter] than honey to my mouth!';
Text[104] = 'Through thy precepts I get understanding: therefore I hate every false way.';
Text[105] = 'NUN. Thy word [is] a lamp unto my feet, and a light unto my path.';
Text[106] = 'I have sworn, and I will perform [it], that I will keep thy righteous judgments.';
Text[107] = 'I am afflicted very much: quicken me, O LORD, according unto thy word.';
Text[108] = 'Accept, I beseech thee, the freewill offerings of my mouth, O LORD, and teach me thy judgments.';
Text[109] = 'My soul [is] continually in my hand: yet do I not forget thy law.';
Text[110] = 'The wicked have laid a snare for me: yet I erred not from thy precepts.';
Text[111] = 'Thy testimonies have I taken as an heritage for ever: for they [are] the rejoicing of my heart.';
Text[112] = 'I have inclined mine heart to perform thy statutes alway, [even unto] the end.';
Text[113] = 'SAMECH. I hate [vain] thoughts: but thy law do I love.';
Text[114] = 'Thou [art] my hiding place and my shield: I hope in thy word.';
Text[115] = 'Depart from me, ye evildoers: for I will keep the commandments of my God.';
Text[116] = 'Uphold me according unto thy word, that I may live: and let me not be ashamed of my hope.';
Text[117] = 'Hold thou me up, and I shall be safe: and I will have respect unto thy statutes continually.';
Text[118] = 'Thou hast trodden down all them that err from thy statutes: for their deceit [is] falsehood.';
Text[119] = 'Thou puttest away all the wicked of the earth [like] dross: therefore I love thy testimonies.';
Text[120] = 'My flesh trembleth for fear of thee; and I am afraid of thy judgments.';
Text[121] = 'AIN. I have done judgment and justice: leave me not to mine oppressors.';
Text[122] = 'Be surety for thy servant for good: let not the proud oppress me.';
Text[123] = 'Mine eyes fail for thy salvation, and for the word of thy righteousness.';
Text[124] = 'Deal with thy servant according unto thy mercy, and teach me thy statutes.';
Text[125] = 'I [am] thy servant; give me understanding, that I may know thy testimonies.';
Text[126] = '[It is] time for [thee], LORD, to work: [for] they have made void thy law.';
Text[127] = 'Therefore I love thy commandments above gold; yea, above fine gold.';
Text[128] = 'Therefore I esteem all [thy] precepts [concerning] all [things to be] right; [and] I hate every false way.';
Text[129] = 'PE. Thy testimonies [are] wonderful: therefore doth my soul keep them.';
Text[130] = 'The entrance of thy words giveth light; it giveth understanding unto the simple.';
Text[131] = 'I opened my mouth, and panted: for I longed for thy commandments.';
Text[132] = 'Look thou upon me, and be merciful unto me, as thou usest to do unto those that love thy name.';
Text[133] = 'Order my steps in thy word: and let not any iniquity have dominion over me.';
Text[134] = 'Deliver me from the oppression of man: so will I keep thy precepts.';
Text[135] = 'Make thy face to shine upon thy servant; and teach me thy statutes.';
Text[136] = 'Rivers of waters run down mine eyes, because they keep not thy law.';
Text[137] = 'TZADDI. Righteous [art] thou, O LORD, and upright [are] thy judgments.';
Text[138] = 'Thy testimonies [that] thou hast commanded [are] righteous and very faithful.';
Text[139] = 'My zeal hath consumed me, because mine enemies have forgotten thy words.';
Text[140] = 'Thy word [is] very pure: therefore thy servant loveth it.';
Text[141] = 'I [am] small and despised: [yet] do not I forget thy precepts.';
Text[142] = 'Thy righteousness [is] an everlasting righteousness, and thy law [is] the truth.';
Text[143] = 'Trouble and anguish have taken hold on me: [yet] thy commandments [are] my delights.';
Text[144] = 'The righteousness of thy testimonies [is] everlasting: give me understanding, and I shall live.';
Text[145] = 'KOPH. I cried with [my] whole heart; hear me, O LORD: I will keep thy statutes.';
Text[146] = 'I cried unto thee; save me, and I shall keep thy testimonies.';
Text[147] = 'I prevented the dawning of the morning, and cried: I hoped in thy word.';
Text[148] = 'Mine eyes prevent the [night] watches, that I might meditate in thy word.';
Text[149] = 'Hear my voice according unto thy lovingkindness: O LORD, quicken me according to thy judgment.';
Text[150] = 'They draw nigh that follow after mischief: they are far from thy law.';
Text[151] = 'Thou [art] near, O LORD; and all thy commandments [are] truth.';
Text[152] = 'Concerning thy testimonies, I have known of old that thou hast founded them for ever.';
Text[153] = 'RESH. Consider mine affliction, and deliver me: for I do not forget thy law.';
Text[154] = 'Plead my cause, and deliver me: quicken me according to thy word.';
Text[155] = 'Salvation [is] far from the wicked: for they seek not thy statutes.';
Text[156] = 'Great [are] thy tender mercies, O LORD: quicken me according to thy judgments.';
Text[157] = 'Many [are] my persecutors and mine enemies; [yet] do I not decline from thy testimonies.';
Text[158] = 'I beheld the transgressors, and was grieved; because they kept not thy word.';
Text[159] = 'Consider how I love thy precepts: quicken me, O LORD, according to thy lovingkindness.';
Text[160] = 'Thy word [is] true [from] the beginning: and every one of thy righteous judgments [endureth] for ever.';
Text[161] = 'SCHIN. Princes have persecuted me without a cause: but my heart standeth in awe of thy word.';
Text[162] = 'I rejoice at thy word, as one that findeth great spoil.';
Text[163] = 'I hate and abhor lying: [but] thy law do I love.';
Text[164] = 'Seven times a day do I praise thee because of thy righteous judgments.';
Text[165] = 'Great peace have they which love thy law: and nothing shall offend them.';
Text[166] = 'LORD, I have hoped for thy salvation, and done thy commandments.';
Text[167] = 'My soul hath kept thy testimonies; and I love them exceedingly.';
Text[168] = 'I have kept thy precepts and thy testimonies: for all my ways [are] before thee.';
Text[169] = 'TAU. Let my cry come near before thee, O LORD: give me understanding according to thy word.';
Text[170] = 'Let my supplication come before thee: deliver me according to thy word.';
Text[171] = 'My lips shall utter praise, when thou hast taught me thy statutes.';
Text[172] = 'My tongue shall speak of thy word: for all thy commandments [are] righteousness.';
Text[173] = 'Let thine hand help me; for I have chosen thy precepts.';
Text[174] = 'I have longed for thy salvation, O LORD; and thy law [is] my delight.';
Text[175] = 'Let my soul live, and it shall praise thee; and let thy judgments help me.';
Text[176] = 'I have gone astray like a lost sheep; seek thy servant; for I do not forget thy commandments.';
