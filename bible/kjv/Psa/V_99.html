<script type="text/javascript">
var Content = new Array();
Book = "Psa";
Chapter = "99";
Content[1]="The LORD reigneth; let the people tremble: he sitteth [between] the cherubims; let the earth be moved.";
Content[2]="The LORD [is] great in Zion; and he [is] high above all the people.";
Content[3]="Let them praise thy great and terrible name; [for] it [is] holy.";
Content[4]="The king's strength also loveth judgment; thou dost establish equity, thou executest judgment and righteousness in Jacob.";
Content[5]="Exalt ye the LORD our God, and worship at his footstool; [for] he [is] holy.";
Content[6]="Moses and Aaron among his priests, and Samuel among them that call upon his name; they called upon the LORD, and he answered them.";
Content[7]="He spake unto them in the cloudy pillar: they kept his testimonies, and the ordinance [that] he gave them.";
Content[8]="Thou answeredst them, O LORD our God: thou wast a God that forgavest them, though thou tookest vengeance of their inventions.";
Content[9]="Exalt the LORD our God, and worship at his holy hill; for the LORD our God [is] holy.";
