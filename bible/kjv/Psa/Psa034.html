Text[1] = '[[[A Psalm] of David, when he changed his behaviour before Abimelech; who drove him away, and he departed.]] I will bless the LORD at all times: his praise [shall] continually [be] in my mouth.';
Text[2] = 'My soul shall make her boast in the LORD: the humble shall hear [thereof], and be glad.';
