<script type="text/javascript">
var Content = new Array();
Book = "Psa";
Chapter = "51";
Content[1]="[[To the chief Musician, A Psalm of David, when Nathan the prophet came unto him, after he had gone in to Bathsheba.]] Have mercy upon me, O God, according to thy lovingkindness: according unto the multitude of thy tender mercies blot out my transgressions.";
Content[2]="Wash me throughly from mine iniquity, and cleanse me from my sin.";
Content[3]="For I acknowledge my transgressions: and my sin [is] ever before me.";
Content[4]="Against thee, thee only, have I sinned, and done [this] evil in thy sight: that thou mightest be justified when thou speakest, [and] be clear when thou judgest.";
Content[5]="Behold, I was shapen in iniquity; and in sin did my mother conceive me.";
Content[6]="Behold, thou desirest truth in the inward parts: and in the hidden [part] thou shalt make me to know wisdom.";
Content[7]="Purge me with hyssop, and I shall be clean: wash me, and I shall be whiter than snow.";
Content[8]="Make me to hear joy and gladness; [that] the bones [which] thou hast broken may rejoice.";
Content[9]="Hide thy face from my sins, and blot out all mine iniquities.";
Content[10]="Create in me a clean heart, O God; and renew a right spirit within me.";
Content[11]="Cast me not away from thy presence; and take not thy holy spirit from me.";
Content[12]="Restore unto me the joy of thy salvation; and uphold me [with thy] free spirit.";
Content[13]="[Then] will I teach transgressors thy ways; and sinners shall be converted unto thee.";
Content[14]="Deliver me from bloodguiltiness, O God, thou God of my salvation: [and] my tongue shall sing aloud of thy righteousness.";
Content[15]="O Lord, open thou my lips; and my mouth shall shew forth thy praise.";
Content[16]="For thou desirest not sacrifice; else would I give [it]: thou delightest not in burnt offering.";
Content[17]="The sacrifices of God [are] a broken spirit: a broken and a contrite heart, O God, thou wilt not despise.";
Content[18]="Do good in thy good pleasure unto Zion: build thou the walls of Jerusalem.";
Content[19]="Then shalt thou be pleased with the sacrifices of righteousness, with burnt offering and whole burnt offering: then shall they offer bullocks upon thine altar.";
</script>
