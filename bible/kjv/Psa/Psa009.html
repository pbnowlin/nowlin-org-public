Text[1] = '[[To the chief Musician upon Muthlabben, A Psalm of David.]] I will praise [thee], O LORD, with my whole heart; I will shew forth all thy marvellous works.';
Text[2] = 'I will be glad and rejoice in thee: I will sing praise to thy name, O thou most High.';
Text[3] = 'When mine enemies are turned back, they shall fall and perish at thy presence.';
Text[4] = 'For thou hast maintained my right and my cause; thou satest in the throne judging right.';

Text[12] = 'When he maketh inquisition for blood, he remembereth them: he forgetteth not the cry of the humble.';

Text[15] = 'The heathen are sunk down in the pit [that] they made: in the net which they hid is their own foot taken.';
Text[16] = 'The LORD is known [by] the judgment [which] he executeth: the wicked is snared in the work of his own hands. Higgaion. Selah.';

Text[19] = 'Arise, O LORD; let not man prevail: let the heathen be judged in thy sight.';
