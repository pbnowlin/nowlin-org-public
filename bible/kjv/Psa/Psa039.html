Text[2] = 'I was dumb with silence, I held my peace, [even] from good; and my sorrow was stirred.';
Text[3] = 'My heart was hot within me, while I was musing the fire burned: [then] spake I with my tongue,';

Text[10] = 'Remove thy stroke away from me: I am consumed by the blow of thine hand.';
Text[11] = 'When thou with rebukes dost correct man for iniquity, thou makest his beauty to consume away like a moth: surely every man [is] vanity. Selah.';
Text[12] = 'Hear my prayer, O LORD, and give ear unto my cry; hold not thy peace at my tears: for I [am] a stranger with thee, [and] a sojourner, as all my fathers [were].';
