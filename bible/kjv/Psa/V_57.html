<script type="text/javascript">
var Content = new Array();
Book = "Psa";
Chapter = "57";
Content[1]="[[To the chief Musician, Altaschith, Michtam of David, when he fled from Saul in the cave.]] Be merciful unto me, O God, be merciful unto me: for my soul trusteth in thee: yea, in the shadow of thy wings will I make my refuge, until [these] calamities be overpast.";
Content[2]="I will cry unto God most high; unto God that performeth [all things] for me.";
Content[3]="He shall send from heaven, and save me [from] the reproach of him that would swallow me up. Selah. God shall send forth his mercy and his truth.";
Content[4]="My soul [is] among lions: [and] I lie [even among] them that are set on fire, [even] the sons of men, whose teeth [are] spears and arrows, and their tongue a sharp sword.";
Content[5]="Be thou exalted, O God, above the heavens; [let] thy glory [be] above all the earth.";
Content[6]="They have prepared a net for my steps; my soul is bowed down: they have digged a pit before me, into the midst whereof they are fallen [themselves]. Selah.";
Content[7]="My heart is fixed, O God, my heart is fixed: I will sing and give praise.";
Content[8]="Awake up, my glory; awake, psaltery and harp: I [myself] will awake early.";
Content[9]="I will praise thee, O Lord, among the people: I will sing unto thee among the nations.";
Content[10]="For thy mercy [is] great unto the heavens, and thy truth unto the clouds.";
Content[11]="Be thou exalted, O God, above the heavens: [let] thy glory [be] above all the earth.";
</script>
