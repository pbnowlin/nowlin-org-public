Text[1] = '[[A Psalm of Asaph.]] The mighty God, [even] the LORD, hath spoken, and called the earth from the rising of the sun unto the going down thereof.';
Text[2] = 'Out of Zion, the perfection of beauty, God hath shined.';
Text[3] = 'Our God shall come, and shall not keep silence: a fire shall devour before him, and it shall be very tempestuous round about him.';

Text[18] = 'When thou sawest a thief, then thou consentedst with him, and hast been partaker with adulterers.';
Text[19] = 'Thou givest thy mouth to evil, and thy tongue frameth deceit.';
Text[20] = 'Thou sittest [and] speakest against thy brother; thou slanderest thine own mother\'s son.';
