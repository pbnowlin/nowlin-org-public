Text[1] = '[[To the chief Musician, A Psalm of David.]] O LORD, thou hast searched me, and known [me].';

Text[3] = 'Thou compassest my path and my lying down, and art acquainted [with] all my ways.';

Text[15] = 'My substance was not hid from thee, when I was made in secret, [and] curiously wrought in the lowest parts of the earth.';

Text[17] = 'How precious also are thy thoughts unto me, O God! how great is the sum of them!';
Text[18] = '[If] I should count them, they are more in number than the sand: when I awake, I am still with thee.';
