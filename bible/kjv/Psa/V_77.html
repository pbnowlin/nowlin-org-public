<script type="text/javascript">
var Content = new Array();
Book = "Psa";
Chapter = "77";
Content[1]="[[To the chief Musician, to Jeduthun, A Psalm of Asaph.]] I cried unto God with my voice, [even] unto God with my voice; and he gave ear unto me.";
Content[2]="In the day of my trouble I sought the Lord: my sore ran in the night, and ceased not: my soul refused to be comforted.";
Content[3]="I remembered God, and was troubled: I complained, and my spirit was overwhelmed. Selah.";
Content[4]="Thou holdest mine eyes waking: I am so troubled that I cannot speak.";
Content[5]="I have considered the days of old, the years of ancient times.";
Content[6]="I call to remembrance my song in the night: I commune with mine own heart: and my spirit made diligent search.";
Content[7]="Will the Lord cast off for ever? and will he be favourable no more?";
Content[8]="Is his mercy clean gone for ever? doth [his] promise fail for evermore?";
Content[9]="Hath God forgotten to be gracious? hath he in anger shut up his tender mercies? Selah.";
Content[10]="And I said, This [is] my infirmity: [but I will remember] the years of the right hand of the most High.";
Content[11]="I will remember the works of the LORD: surely I will remember thy wonders of old.";
Content[12]="I will meditate also of all thy work, and talk of thy doings.";
Content[13]="Thy way, O God, [is] in the sanctuary: who [is so] great a God as [our] God?";
Content[14]="Thou [art] the God that doest wonders: thou hast declared thy strength among the people.";
Content[15]="Thou hast with [thine] arm redeemed thy people, the sons of Jacob and Joseph. Selah.";
Content[16]="The waters saw thee, O God, the waters saw thee; they were afraid: the depths also were troubled.";
Content[17]="The clouds poured out water: the skies sent out a sound: thine arrows also went abroad.";
Content[18]="The voice of thy thunder [was] in the heaven: the lightnings lightened the world: the earth trembled and shook.";
Content[19]="Thy way [is] in the sea, and thy path in the great waters, and thy footsteps are not known.";
Content[20]="Thou leddest thy people like a flock by the hand of Moses and Aaron.";
</script>
