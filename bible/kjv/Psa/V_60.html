<script type="text/javascript">
var Content = new Array();
Book = "Psa";
Chapter = "60";
Content[1]="[[To the chief Musician upon Shushaneduth, Michtam of David, to teach; when he strove with Aramnaharaim and with Aramzobah, when Joab returned, and smote of Edom in the valley of salt twelve thousand.]] O God, thou hast cast us off, thou hast scattered us, thou hast been displeased; O turn thyself to us again.";
Content[2]="Thou hast made the earth to tremble; thou hast broken it: heal the breaches thereof; for it shaketh.";
Content[3]="Thou hast shewed thy people hard things: thou hast made us to drink the wine of astonishment.";
Content[4]="Thou hast given a banner to them that fear thee, that it may be displayed because of the truth. Selah.";
Content[5]="That thy beloved may be delivered; save [with] thy right hand, and hear me.";
Content[6]="God hath spoken in his holiness; I will rejoice, I will divide Shechem, and mete out the valley of Succoth.";
Content[7]="Gilead [is] mine, and Manasseh [is] mine; Ephraim also [is] the strength of mine head; Judah [is] my lawgiver;";
Content[8]="Moab [is] my washpot; over Edom will I cast out my shoe: Philistia, triumph thou because of me.";
Content[9]="Who will bring me [into] the strong city? who will lead me into Edom?";
Content[10]="[Wilt] not thou, O God, [which] hadst cast us off? and [thou], O God, [which] didst not go out with our armies?";
Content[11]="Give us help from trouble: for vain [is] the help of man.";
Content[12]="Through God we shall do valiantly: for he [it is that] shall tread down our enemies.";
</script>
