Text[1] = '[[Maschil of Asaph.]] O God, why hast thou cast [us] off for ever? [why] doth thine anger smoke against the sheep of thy pasture?';
Text[2] = 'Remember thy congregation, [which] thou hast purchased of old; the rod of thine inheritance, [which] thou hast redeemed; this mount Zion, wherein thou hast dwelt.';
Text[3] = 'Lift up thy feet unto the perpetual desolations; [even] all [that] the enemy hath done wickedly in the sanctuary.';

Text[5] = '[A man] was famous according as he had lifted up axes upon the thick trees.';

Text[7] = 'They have cast fire into thy sanctuary, they have defiled [by casting down] the dwelling place of thy name to the ground.';

Text[9] = 'We see not our signs: [there is] no more any prophet: neither [is there] among us any that knoweth how long.';
Text[10] = 'O God, how long shall the adversary reproach? shall the enemy blaspheme thy name for ever?';
Text[11] = 'Why withdrawest thou thy hand, even thy right hand? pluck [it] out of thy bosom.';
Text[12] = 'For God [is] my King of old, working salvation in the midst of the earth.';
Text[13] = 'Thou didst divide the sea by thy strength: thou brakest the heads of the dragons in the waters.';
Text[14] = 'Thou brakest the heads of leviathan in pieces, [and] gavest him [to be] meat to the people inhabiting the wilderness.';
Text[15] = 'Thou didst cleave the fountain and the flood: thou driedst up mighty rivers.';
Text[16] = 'The day [is] thine, the night also [is] thine: thou hast prepared the light and the sun.';
Text[17] = 'Thou hast set all the borders of the earth: thou hast made summer and winter.';
Text[18] = 'Remember this, [that] the enemy hath reproached, O LORD, and [that] the foolish people have blasphemed thy name.';
Text[19] = 'O deliver not the soul of thy turtledove unto the multitude [of the wicked]: forget not the congregation of thy poor for ever.';
Text[20] = 'Have respect unto the covenant: for the dark places of the earth are full of the habitations of cruelty.';
Text[21] = 'O let not the oppressed return ashamed: let the poor and needy praise thy name.';
Text[22] = 'Arise, O God, plead thine own cause: remember how the foolish man reproacheth thee daily.';
