<script type="text/javascript">
var Content = new Array();
Book = "Psa";
Chapter = "48";
Content[1]="[[A Song [and] Psalm for the sons of Korah.]] Great [is] the LORD, and greatly to be praised in the city of our God, [in] the mountain of his holiness.";
Content[2]="Beautiful for situation, the joy of the whole earth, [is] mount Zion, [on] the sides of the north, the city of the great King.";
Content[3]="God is known in her palaces for a refuge.";
Content[4]="For, lo, the kings were assembled, they passed by together.";
Content[5]="They saw [it, and] so they marvelled; they were troubled, [and] hasted away.";
Content[6]="Fear took hold upon them there, [and] pain, as of a woman in travail.";
Content[7]="Thou breakest the ships of Tarshish with an east wind.";
Content[8]="As we have heard, so have we seen in the city of the LORD of hosts, in the city of our God: God will establish it for ever. Selah.";
Content[9]="We have thought of thy lovingkindness, O God, in the midst of thy temple.";
Content[10]="According to thy name, O God, so [is] thy praise unto the ends of the earth: thy right hand is full of righteousness.";
Content[11]="Let mount Zion rejoice, let the daughters of Judah be glad, because of thy judgments.";
Content[12]="Walk about Zion, and go round about her: tell the towers thereof.";
Content[13]="Mark ye well her bulwarks, consider her palaces; that ye may tell [it] to the generation following.";
Content[14]="For this God [is] our God for ever and ever: he will be our guide [even] unto death.";
</script>
