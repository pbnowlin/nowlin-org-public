<script type="text/javascript">
var Content = new Array();
Book = "Psa";
Chapter = "85";
Content[1]="[[To the chief Musician, A Psalm for the sons of Korah.]] LORD, thou hast been favourable unto thy land: thou hast brought back the captivity of Jacob.";
Content[2]="Thou hast forgiven the iniquity of thy people, thou hast covered all their sin. Selah.";
Content[3]="Thou hast taken away all thy wrath: thou hast turned [thyself] from the fierceness of thine anger.";
Content[4]="Turn us, O God of our salvation, and cause thine anger toward us to cease.";
Content[5]="Wilt thou be angry with us for ever? wilt thou draw out thine anger to all generations?";
Content[6]="Wilt thou not revive us again: that thy people may rejoice in thee?";
Content[7]="Shew us thy mercy, O LORD, and grant us thy salvation.";
Content[8]="I will hear what God the LORD will speak: for he will speak peace unto his people, and to his saints: but let them not turn again to folly.";
Content[9]="Surely his salvation [is] nigh them that fear him; that glory may dwell in our land.";
Content[10]="Mercy and truth are met together; righteousness and peace have kissed [each other].";
Content[11]="Truth shall spring out of the earth; and righteousness shall look down from heaven.";
Content[12]="Yea, the LORD shall give [that which is] good; and our land shall yield her increase.";
Content[13]="Righteousness shall go before him; and shall set [us] in the way of his steps.";
</script>
