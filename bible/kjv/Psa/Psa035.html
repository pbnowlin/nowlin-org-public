Text[1] = '[[[A Psalm] of David.]] Plead [my cause], O LORD, with them that strive with me: fight against them that fight against me.';
Text[2] = 'Take hold of shield and buckler, and stand up for mine help.';
Text[3] = 'Draw out also the spear, and stop [the way] against them that persecute me: say unto my soul, I [am] thy salvation.';
Text[4] = 'Let them be confounded and put to shame that seek after my soul: let them be turned back and brought to confusion that devise my hurt.';
Text[5] = 'Let them be as chaff before the wind: and let the angel of the LORD chase [them].';
Text[6] = 'Let their way be dark and slippery: and let the angel of the LORD persecute them.';
Text[7] = 'For without cause have they hid for me their net [in] a pit, [which] without cause they have digged for my soul.';
Text[8] = 'Let destruction come upon him at unawares; and let his net that he hath hid catch himself: into that very destruction let him fall.';
Text[9] = 'And my soul shall be joyful in the LORD: it shall rejoice in his salvation.';
Text[10] = 'All my bones shall say, LORD, who [is] like unto thee, which deliverest the poor from him that is too strong for him, yea, the poor and the needy from him that spoileth him?';
Text[11] = 'False witnesses did rise up; they laid to my charge [things] that I knew not.';
Text[12] = 'They rewarded me evil for good [to] the spoiling of my soul.';
Text[13] = 'But as for me, when they were sick, my clothing [was] sackcloth: I humbled my soul with fasting; and my prayer returned into mine own bosom.';
Text[14] = 'I behaved myself as though [he had been] my friend [or] brother: I bowed down heavily, as one that mourneth [for his] mother.';
Text[15] = 'But in mine adversity they rejoiced, and gathered themselves together: [yea], the abjects gathered themselves together against me, and I knew [it] not; they did tear [me], and ceased not:';
Text[16] = 'With hypocritical mockers in feasts, they gnashed upon me with their teeth.';
Text[17] = 'Lord, how long wilt thou look on? rescue my soul from their destructions, my darling from the lions.';
Text[18] = 'I will give thee thanks in the great congregation: I will praise thee among much people.';
Text[19] = 'Let not them that are mine enemies wrongfully rejoice over me: [neither] let them wink with the eye that hate me without a cause.';
Text[20] = 'For they speak not peace: but they devise deceitful matters against [them that are] quiet in the land.';
Text[21] = 'Yea, they opened their mouth wide against me, [and] said, Aha, aha, our eye hath seen [it].';
Text[22] = '[This] thou hast seen, O LORD: keep not silence: O Lord, be not far from me.';
Text[23] = 'Stir up thyself, and awake to my judgment, [even] unto my cause, my God and my Lord.';
Text[24] = 'Judge me, O LORD my God, according to thy righteousness; and let them not rejoice over me.';
Text[25] = 'Let them not say in their hearts, Ah, so would we have it: let them not say, We have swallowed him up.';
Text[26] = 'Let them be ashamed and brought to confusion together that rejoice at mine hurt: let them be clothed with shame and dishonour that magnify [themselves] against me.';
Text[27] = 'Let them shout for joy, and be glad, that favour my righteous cause: yea, let them say continually, Let the LORD be magnified, which hath pleasure in the prosperity of his servant.';
Text[28] = 'And my tongue shall speak of thy righteousness [and] of thy praise all the day long.';
