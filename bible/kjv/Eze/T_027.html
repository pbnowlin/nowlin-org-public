stringArray[27] = '__PNThy_riches_1__SHThy riches</a>, and thy fairs, thy merchandise, thy mariners, and thy pilots, thy calkers, and the occupiers of thy merchandise, and all thy men of war, that [are] in thee, __PNand_in_all_2__SHand in all</a> thy company which [is] in the midst of thee, __PNshall_fall_3__SHshall fall</a> into the __PNmidst_4__SHmidst</a> of the seas in the day of thy ruin.__CPThy_riches_1__PSThy riches__EEIn these beautiful and expressive figures, Tyre is represented as a ship at sea, wrecked through the mistakes of her pilots and rowers; that is, destroyed by Nebuchadnezzar, and afterwards by Alexander, in consequence of her rulers having pertinaciously resolved to withstand those haughty conquerors. This vast ship, laden with all kinds of valuable wares, being wrecked, all her valuables, sailors, officers, etc. went to the bottom. __NAEze/27/7\');">Eze 27:7-9__NREze/27/12\');">12__NREze/27/18\');">18__NREze/27/19\');">19__NREze/27/22\');">22__NREze/27/24\');">24__NREze/27/34\');">34__NBEze/26/12\');">Eze 26:12__NBPro/11/4\');">Pro 11:4__NBRev/18/11\');">Rev 18:11-24__AN__GHand_in_all_2__PSand in all__FEor, even with all__GGshall_fall_3__PSshall fall__FFEze/26/14\');">Eze 26:14__NREze/26/21\');">21__AN__GHmidst_4__PSmidst__FEHeb. heart. __NAEze/27/26\');">Eze 27:26__AN.</TD></TR>';
