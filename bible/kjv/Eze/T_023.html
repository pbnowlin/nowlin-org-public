stringArray[22] = 'Therefore, O Aholibah, thus saith the Lord GOD; Behold, __PNI_will_raise_1__SHI will raise</a> up thy lovers against thee, __PNfrom_2__SHfrom</a> whom thy mind is alienated, __PNand_I_3__SHand I</a> will bring them against thee on every side;__CPI_will_raise_1__PSI will raise__FFEze/23/9\');">Eze 23:9__NREze/23/28\');">28__NBEze/16/37\');">Eze 16:37__NBIsa/10/5\');">Isa 10:5__NRIsa/10/6\');">6__NBIsa/39/3\');">Isa 39:3__NRIsa/39/4\');">4__NBHab/1/6\');">Hab 1:6-10__NBRev/17/16\');">Rev 17:16__AN__GHfrom_2__PSfrom__EFEze/23/17\');">Eze 23:17__AN.__GGand_I_3__PSand I__FFJer/6/22\');">Jer 6:22__NRJer/6/23\');">23__NBJer/12/9\');">Jer 12:9-12__EN';

stringArray[27] = 'Thus __PNwill_I_1__SHwill I</a> make thy lewdness to cease from thee, __PNand_thy_2__SHand thy</a> whoredom [brought] from the land of Egypt: __PNso_that_3__SHso that</a> thou shalt not lift up thine eyes unto them, nor remember Egypt any more.__CPwill_I_1__PSwill I__FFEze/16/41\');">Eze 16:41__NBEze/22/15\');">Eze 22:15__NBIsa/27/9\');">Isa 27:9__NBMic/5/10\');">Mic 5:10-14__NBZec/13/2\');">Zec 13:2__AN__GHand_thy_2__PSand thy__EFEze/23/3\');">Eze 23:3__NREze/23/19\');">19__AN__GGso_that_3__PSso that__EEThese severe judgments shall effectually deter you from idolatry, and make you abhor the least approaches to it. This often repeated prediction has received a most wonderful accomplishment. For neither the authority, frowns, examples, or favour of their conquerors or powerful neighbours, nor their own fears, hopes, interests, or predilection for the sensual worship of idols, could prevail with them to run into gross idolatry, either during the captivity, or ever afterwards, to the present day, a period of 2,414 years.</TD></TR>';
