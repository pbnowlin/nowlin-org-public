stringArray[16] = 'He measured the east __PNside_1__SHside</a> with the measuring reed, five hundred reeds, with the measuring reed round about.__CPside_1__PSside__EEHeb. wind. the measuring reed. Estimating the reed at 10® feet, 500 reeds will be nearly equal to a mile; so that from this statement we find the temple, with its outbuildings, was built on a square, nearly an English mile on each side, and four miles in circumference. This not only far exceeds the size of Solomon\'s temple, or that after the captivity, which was only 500 cubits, or a furlong, on each side, and exactly half a mile in circuit; but is nearly equal to the whole extent of Jerusalem itself, which, when greatest, was but 33 furlongs in circumference, somewhat less than 4? miles. This seems clearly to intimate, that the vision cannot be explained of any temple that has hitherto been built, or indeed of any literal temple, but figuratively and mystically of the spiritual temple, the church under the gospel, and its spiritual glory. __NAEze/40/3\');">Eze 40:3__NBZec/2/1\');">Zec 2:1__NBRev/11/1\');">Rev 11:1__NRRev/11/2\');">2__EN';
