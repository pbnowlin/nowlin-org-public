stringArray[1] = '__PNIn_the_five_1__SHIn the five</a> and twentieth year of our captivity, in the beginning of the year, in the tenth [day] of the month, in the fourteenth year __PNafter_2__SHafter</a> that the city was smitten, in the __PNselfsame_3__SHselfsame</a> day the __PNhand_4__SHhand</a> of the LORD was upon me, and brought me thither.__CPIn_the_five_1__PSIn the five__EEOn Tuesday, April 20. __NAEze/1/2\');">Eze 1:2__NBEze/8/1\');">Eze 8:1__NBEze/29/17\');">Eze 29:17__NBEze/32/1\');">Eze 32:1__NREze/32/17\');">17__AN__GHafter_2__PSafter__EFEze/33/21\');">Eze 33:21__NB2Ki/25/1\');">2Ki 25:1-30__NBJer/39/1\');">Jer 39:1-18__NBJer/52/1\');">Jer 52:1-34__AN__GGselfsame_3__PSselfsame__FFExd/12/41\');">Exd 12:41__AN__GHhand_4__PShand__EFEze/1/3\');">Eze 1:3__NBEze/3/14\');">Eze 3:14__NREze/3/22\');">22__NBEze/11/24\');">Eze 11:24__NBEze/37/1\');">Eze 37:1__NBRev/1/10\');">Rev 1:10__EN';
stringArray[2] = 'In __PNthe_visions_1__SHthe visions</a> of God brought he me into the land of Israel, and set me upon __PNa_very_2__SHa very</a> high mountain, __PNby_3__SHby</a> which [was] __PNas_the_4__SHas the</a> __PNframe_5__SHframe</a> of a city __PNon_the_south_6__SHon the south</a>.__CPthe_visions_1__PSthe visions__EEThere can be little doubt, that the grand outlines of the description of the temple, in the following extraordinary vision, were taken from that of Solomon\'s, with all the additions made to it in after ages; and we may suppose that Zerubbabel and the other Jews had respect to it, as far as circumstances would permit, in rebuilding the temple after the captivity. There are, however, many circumstances which conclusively shew, that something infinitely superior to either the first or second temple was intended; and that the external description must be considered as a figure and emblem of spiritual blessings. Probably the more immediate accomplishment of the prophecy will be subsequent to the conversion and restoration of the Jews, the destruction of Gog and Magog, and the pouring out of the Spirit, mentioned at the close of the last chapter; but whether there will be any external forms analogous to these cannot be determined, though in some respects it seems improbable. __NAEze/1/1\');">Eze 1:1__NBEze/8/3\');">Eze 8:3__NBDan/7/1\');">Dan 7:1__NRDan/7/7\');">7__NBAct/2/17\');">Act 2:17__AN; A__GHa_very_2__PSa very__EFEze/17/22\');">Eze 17:22__NREze/17/23\');">23__NBIsa/2/2\');">Isa 2:2__NRIsa/2/3\');">3__NBDan/2/34\');">Dan 2:34__NRDan/2/35\');">35__NBMic/4/1\');">Mic 4:1__NBRev/21/10\');">Rev 21:10__AN__GGby_3__PSby__EEor, upon__GHas_the_4__PSas the__EFEze/48/30\');">Eze 48:30-35__NBGal/4/26\');">Gal 4:26__NBRev/21/10\');">Rev 21:10-23__AN__GGframe_5__PSframe__FF1Ch/28/12\');">1Ch 28:12__NR1Ch/28/19\');">19__AN__GHon_the_south_6__PSon the south__EFIsa/48/2\');">Isa 48:2__NBIsa/14/13\');">Isa 14:13__EN';
stringArray[3] = 'And he brought me thither, and, behold, [there was] a man, __PNwhose_1__SHwhose</a> appearance [was] like the appearance of brass, __PNwith_2__SHwith</a> a line of flax in his hand, and a measuring reed; and he stood in the gate.__CPwhose_1__PSwhose__FFEze/1/7\');">Eze 1:7__NREze/1/27\');">27__NBDan/10/5\');">Dan 10:5__NRDan/10/6\');">6__NBRev/1/15\');">Rev 1:15__AN__GHwith_2__PSwith__EFEze/47/3\');">Eze 47:3__NBIsa/8/20\');">Isa 8:20__NBIsa/28/17\');">Isa 28:17__NBZec/2/1\');">Zec 2:1__NRZec/2/2\');">2__NBRev/11/1\');">Rev 11:1__NBRev/21/15\');">Rev 21:15__EN';
stringArray[4] = 'And the man said unto me, Son of man, __PNbehold_1__SHbehold</a> with thine eyes, and hear with thine ears, and set thine heart upon all that I shall shew thee; for to the intent that I might shew [them] unto thee [art] thou brought hither: __PNdeclare_2__SHdeclare</a> all that thou seest to the house of Israel.__CPbehold_1__PSbehold__FFEze/2/7\');">Eze 2:7__NREze/2/8\');">8__NBEze/3/17\');">Eze 3:17__NBEze/43/10\');">Eze 43:10__NBEze/44/5\');">Eze 44:5__NBMat/10/27\');">Mat 10:27__NBMat/13/9\');">Mat 13:9__NRMat/13/51\');">51__NRMat/13/52\');">52__AN__GHdeclare_2__PSdeclare__EFIsa/21/10\');">Isa 21:10__NBJer/26/2\');">Jer 26:2__NBAct/20/27\');">Act 20:27__NB1Cr/11/23\');">1Cr 11:23__EN';
stringArray[5] = 'And behold __PNa_wall_1__SHa wall</a> on the outside of the house round about, and in the man\'s hand a measuring reed of six cubits [long] __PNby_2__SHby</a> the cubit and an hand breadth: __PNso_he_3__SHso he</a> measured the breadth of the building, one reed; and the height, one reed.__CPa_wall_1__PSa wall__FFEze/42/20\');">Eze 42:20__NBPsa/125/2\');">Psa 125:2__NBIsa/26/1\');">Isa 26:1__NBIsa/60/18\');">Isa 60:18__NBZec/2/5\');">Zec 2:5__NBRev/21/12\');">Rev 21:12__AN__GHby_2__PSby__EFDeu/3/11\');">Deu 3:11__AN__GGso_he_3__PSso he__FFEze/42/20\');">Eze 42:20__EN';
stringArray[6] = 'Then came he __PNunto_1__SHunto</a> the gate __PNwhich_looketh_2__SHwhich looketh</a> toward the east, and went up the __PNstairs_3__SHstairs</a> thereof, and measured the __PNthreshold_4__SHthreshold</a> of the gate, [which was] __PNone_reed_5__SHone reed</a> broad; and the other threshold [of the gate, which was] one reed broad.__CPunto_1__PSunto__FFEze/40/20\');">Eze 40:20__NBEze/8/16\');">Eze 8:16__NBEze/11/1\');">Eze 11:1__NBEze/43/1\');">Eze 43:1__NBEze/44/1\');">Eze 44:1__NBEze/46/1\');">Eze 46:1__NREze/46/12\');">12__NB1Ch/9/18\');">1Ch 9:18__NR1Ch/9/24\');">24__NBNeh/3/29\');">Neh 3:29__NBJer/19/2\');">Jer 19:2__AN__GHwhich_looketh_2__PSwhich looketh__FEHeb. whose face was the way__GGstairs_3__PSstairs__FFEze/40/26\');">Eze 40:26__NB1Ki/6/8\');">1Ki 6:8__AN__GHthreshold_4__PSthreshold__EFEze/10/18\');">Eze 10:18__NBEze/43/8\');">Eze 43:8__NBEze/46/2\');">Eze 46:2__NBEze/47/1\');">Eze 47:1__NBPsa/84/10\');">Psa 84:10__AN; *marg:__GGone_reed_5__PSone reed__FFEze/40/5\');">Eze 40:5__NREze/40/7\');">7__EN';
stringArray[7] = 'And [every] little chamber [was] one reed long, and one reed broad; and between the little chambers [were] five cubits; and the threshold of the gate by the porch of the gate within [was] one reed.__CPRelated_Verses1_1__PSEntire Verse.__FFEze/42/5\');">Eze 42:5__NB1Ki/6/5\');">1Ki 6:5-10__NB1Ch/9/26\');">1Ch 9:26__NB1Ch/23/28\');">1Ch 23:28__NB2Ch/3/9\');">2Ch 3:9__NB2Ch/31/11\');">2Ch 31:11__NBEzr/8/29\');">Ezr 8:29__NBJer/35/4\');">Jer 35:4__EN';
stringArray[8] = 'He measured also the porch of the gate within, one reed.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[9] = 'Then measured he the porch of the gate, eight cubits; and __PNthe_posts_1__SHthe posts</a> thereof, two cubits; and the porch of the gate [was] inward.__CPthe_posts_1__PSthe posts__FFEze/45/19\');">Eze 45:19__EN';
stringArray[10] = 'And __PNthe_little_1__SHthe little</a> chambers of the gate eastward [were] three on this side, and three on that side; __PNthey_three_2__SHthey three</a> [were] of one measure: and the posts had one measure on this side and on that side.__CPthe_little_1__PSthe little__FFEze/40/7\');">Eze 40:7__AN__GHthey_three_2__PSthey three__FE"The entrance into the outer court seems to have been through a porch with doors at both ends; and on each side of this porch were three small chambers, or rooms, for the use of the porters, a reed square in size, with a passage of five cubits between them. The common cubit, termed the ""cubit of a man,"" (__NADeu/3/11\');">Deu 3:11__AN,) was about 18 inches; but the cubit used by the angel was, as we learn from __NAEze/43/13\');">Eze 43:13__AN, ""a cubit and a hand breadth,"" or about three inches more than the common cubit, that is 21 inches. Hence the measuring reed, which was ""six cubits long, by the cubit and the hand breadth,"" (__NAEze/40/5\');">Eze 40:5__AN,) must have been about 10® feet"</TD></TR>';
stringArray[11] = 'And he measured the breadth of the entry of the gate, ten cubits; [and] the length of the gate, thirteen cubits.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[12] = 'The __PNspace_1__SHspace</a> also before the little chambers [was] one cubit [on this side], and the space [was] one cubit on that side: and the little chambers [were] six cubits on this side, and six cubits on that side.__CPspace_1__PSspace__EEHeb. limit, or bound.</TD></TR>';
stringArray[13] = 'He measured then __PNthe_gate_1__SHthe gate</a> from the roof of [one] little chamber to the roof of another: the breadth [was] five and twenty cubits, door against door.__CPthe_gate_1__PSthe gate__EEThe whole arch of the east gate, measured from the southern extremity of one room to the northern extremity of the opposite room, was 25 cubits; including the dimensions of the two rooms, or twelve cubits, (__NAEze/40/7\');">Eze 40:7__AN;) the spaces before the rooms, or two cubits, (__NAEze/40/12\');">Eze 40:12__AN;) and the breadth of the entrance, ten cubits, (__NAEze/40/11\');">Eze 40:11__AN;) making all 24 cubits, leaving one cubit for the thickness of the walls.</TD></TR>';
stringArray[14] = 'He made also posts of threescore cubits, even unto the post of __PNthe_court_1__SHthe court</a> round about the gate.__CPthe_court_1__PSthe court__FFEze/8/7\');">Eze 8:7__NBEze/42/1\');">Eze 42:1__NBExd/27/9\');">Exd 27:9__NBExd/35/17\');">Exd 35:17__NBLev/6/16\');">Lev 6:16__NB1Ch/28/6\');">1Ch 28:6__NBPsa/100/4\');">Psa 100:4__NBIsa/62/9\');">Isa 62:9__EN';
stringArray[15] = 'And from __PNthe_face_of_the_gate_1__SHthe face of the gate</a> of the entrance unto the face of the porch of the inner gate [were] fifty cubits.__CPthe_face_of_the_gate_1__PSthe face of the gate__EEThis was the whole length of the porch, from the outward front, (__NAEze/41/21\');">Eze 41:21__AN, __NAEze/41/25\');">25__AN,) to the inner side which looks into the first court, (__NAEze/40/17\');">Eze 40:17__AN,) including the thickness of the walls, (__NAEze/40/6\');">Eze 40:6__AN,) chambers, (__NAEze/40/7\');">Eze 40:7__AN,) and spaces between them.</TD></TR>';
stringArray[16] = 'And [there were] __PNnarrow_1__SHnarrow</a> windows to __PNthe_little_2__SHthe little</a> chambers, and to their posts within the gate round about, and likewise to the __PNarches_3__SHarches</a>: and windows [were] round about __PNinward_4__SHinward</a>: and upon [each] post [were] __PNpalm_trees_5__SHpalm trees</a>.__CPnarrow_1__PSnarrow__EEHeb. closed. __NAEze/41/16\');">Eze 41:16__NB1Ki/6/4\');">1Ki 6:4__NB1Cr/13/12\');">1Cr 13:12__AN__GHthe_little_2__PSthe little__EFEze/40/7\');">Eze 40:7__NREze/40/12\');">12__AN__GGarches_3__PSarches__EEor, galleries, or porches. __NAEze/40/21\');">Eze 40:21__NREze/40/22\');">22__NREze/40/25\');">25__NREze/40/30\');">30__NBEze/41/15\');">Eze 41:15__NBEze/42/3\');">Eze 42:3__NBJhn/5/2\');">Jhn 5:2__AN__GHinward_4__PSinward__FEor, within__GGpalm_trees_5__PSpalm trees__FF1Ki/6/29\');">1Ki 6:29__NR1Ki/6/32\');">32__NR1Ki/6/35\');">35__NB2Ch/3/5\');">2Ch 3:5__NBPsa/92/12\');">Psa 92:12__NBRev/7/9\');">Rev 7:9__EN';
stringArray[17] = 'Then brought he me into __PNthe_outward_1__SHthe outward</a> court, and, lo, [__PNthere_were_2__SHthere were</a>] chambers, and a pavement made for the court round about: __PNthirty_3__SHthirty</a> chambers [were] upon the pavement.__CPthe_outward_1__PSthe outward__FFEze/10/5\');">Eze 10:5__NBEze/42/1\');">Eze 42:1__NBEze/46/21\');">Eze 46:21__NBRev/11/2\');">Rev 11:2__AN__GHthere_were_2__PSthere were__EF1Ki/6/5\');">1Ki 6:5__NB1Ch/9/26\');">1Ch 9:26__NB1Ch/23/28\');">1Ch 23:28__NB2Ch/31/11\');">2Ch 31:11__AN__GGthirty_3__PSthirty__FFEze/42/4\');">Eze 42:4__NBEze/45/5\');">Eze 45:5__EN';
stringArray[18] = 'And the pavement by the side of the gates over against the length of the gates [was] the lower pavement.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[19] = 'Then he measured the breadth from the forefront of the lower gate __PNunto_the_1__SHunto the</a> forefront of the inner court __PNwithout_2__SHwithout</a>, an hundred cubits eastward and northward.__CPunto_the_1__PSunto the__FFEze/40/23\');">Eze 40:23__NREze/40/27\');">27__NBEze/46/1\');">Eze 46:1__NREze/46/2\');">2__AN__GHwithout_2__PSwithout__FEor, from without.</TD></TR>';
stringArray[20] = 'And __PNthe_gate_1__SHthe gate</a> of the outward court __PNthat_looked_2__SHthat looked</a> toward the north, he measured the length thereof, and the breadth thereof.__CPthe_gate_1__PSthe gate__FFEze/40/6\');">Eze 40:6__AN__GHthat_looked_2__PSthat looked__FEHeb. whose face was.</TD></TR>';
stringArray[21] = 'And __PNthe_little_1__SHthe little</a> chambers thereof [were] three on this side and three on that side; and the posts thereof and the __PNarches_2__SHarches</a> thereof were __PNafter_3__SHafter</a> the measure of the first gate: the length thereof [was] fifty cubits, and the breadth five and twenty cubits.__CPthe_little_1__PSthe little__FFEze/40/7\');">Eze 40:7__NREze/40/10\');">10-16__NREze/40/29\');">29__NREze/40/30\');">30__NREze/40/36\');">36__NREze/40/37\');">37__AN__GHarches_2__PSarches__FEor, galleries, or porches. __NAEze/40/16\');">Eze 40:16__NREze/40/26\');">26__NREze/40/30\');">30__NREze/40/34\');">34__AN__GGafter_3__PSafter__FFEze/40/8\');">Eze 40:8__NREze/40/10\');">10__NREze/40/13\');">13__NREze/40/15\');">15__NREze/40/25\');">25__NREze/40/29\');">29__EN';
stringArray[22] = 'And their windows, and their arches, and their __PNpalm_trees_1__SHpalm trees</a>, [were] after the measure of the gate that looketh toward the east; __PNand_they_2__SHand they</a> went up unto it by seven steps; and the arches thereof [were] __PNbefore_them_3__SHbefore them</a>.__CPpalm_trees_1__PSpalm trees__FFEze/40/16\');">Eze 40:16__NREze/40/31\');">31__NREze/40/37\');">37__NB1Ki/6/29\');">1Ki 6:29__NR1Ki/6/32\');">32__NR1Ki/6/35\');">35__NB1Ki/7/36\');">1Ki 7:36__NB2Ch/3/5\');">2Ch 3:5__NBRev/7/9\');">Rev 7:9__AN__GHand_they_2__PSand they__EFEze/40/6\');">Eze 40:6__NREze/40/26\');">26__NREze/40/31\');">31__NREze/40/34\');">34__NREze/40/37\');">37__NREze/40/49\');">49__NBHbr/6/1\');">Hbr 6:1__AN__GGbefore_them_3__PSbefore them__EE"Or, ""suitable to them,"" that is, to the arches of the east gate. The north gate into the outward court, and every thing belonging to it, were exactly the same as the east gate."</TD></TR>';
stringArray[23] = 'And __PNthe_gate_of_1__SHthe gate of</a> the inner court [was] over against the gate toward the north, and toward the east; __PNand_he_2__SHand he</a> measured from gate to gate an hundred cubits.__CPthe_gate_of_1__PSthe gate of__EEThat is, the gate of the inner court was opposite, and exactly answered to the gate of the outward court, both on the north and east side; and between the gates of the outward and inner court was a space of an hundred cubits. __NAEze/40/19\');">Eze 40:19__NREze/40/27\');">27__NREze/40/28\');">28__NREze/40/44\');">44__AN__GHand_he_2__PSand he__EFExd/27/9\');">Exd 27:9-18__NBExd/38/9\');">Exd 38:9-12__EN';
stringArray[24] = 'After that he brought me toward the south, __PNand_behold_1__SHand behold</a> a gate toward the south: __PNand_he_2__SHand he</a> measured the posts thereof and the arches thereof __PNaccording_3__SHaccording</a> to these measures.__CPand_behold_1__PSand behold__FFEze/40/6\');">Eze 40:6__NREze/40/20\');">20__NREze/40/35\');">35__NBEze/46/9\');">Eze 46:9__AN__GHand_he_2__PSand he__EFEze/40/21\');">Eze 40:21__NREze/40/28\');">28__NREze/40/29\');">29__NREze/40/33\');">33__NREze/40/35\');">35__NREze/40/36\');">36__AN__GGaccording_3__PSaccording__EEThat is, according to the measures of the eastern and northern gates. There does not appear to have been any gates on the west, though the courts seem to have extended to the western wall</TD></TR>';
stringArray[25] = 'And [there were] __PNwindows_1__SHwindows</a> in it and in the arches thereof round about, like those windows: __PNthe_length_2__SHthe length</a> [was] fifty cubits, and the breadth five and twenty cubits.__CPwindows_1__PSwindows__FFEze/40/16\');">Eze 40:16__NREze/40/22\');">22__NREze/40/29\');">29__NBJhn/12/46\');">Jhn 12:46__NB1Cr/13/12\');">1Cr 13:12__NB2Pe/1/19\');">2Pe 1:19__AN__GHthe_length_2__PSthe length__EFEze/40/21\');">Eze 40:21__NREze/40/33\');">33__EN';
stringArray[26] = 'And [there were] __PNseven_1__SHseven</a> steps to go up to it, and the arches thereof [were] before them: and it had __PNpalm_trees_2__SHpalm trees</a>, one on this side, and another on that side, upon the posts thereof.__CPseven_1__PSseven__FFEze/40/6\');">Eze 40:6__NREze/40/22\');">22__NREze/40/29\');">29__NB2Pe/3/18\');">2Pe 3:18__AN__GHpalm_trees_2__PSpalm trees__EFEze/40/16\');">Eze 40:16__NREze/40/22\');">22__NBPsa/92/12\');">Psa 92:12__NRPsa/92/13\');">13__NBSgs/7/7\');">Sgs 7:7__NRSgs/7/8\');">8__EN';
stringArray[27] = 'And [there was] a gate __PNin_the_1__SHin the</a> inner court toward the south: __PNand_he_2__SHand he</a> measured from gate to gate toward the south an hundred cubits.__CPin_the_1__PSin the__FFEze/40/23\');">Eze 40:23__NREze/40/32\');">32__AN__GHand_he_2__PSand he__EFEze/40/19\');">Eze 40:19__NREze/40/23\');">23__NREze/40/47\');">47__EN';
stringArray[28] = 'And __PNhe_brought_1__SHhe brought</a> me to the inner court by the south gate: and he measured the south gate __PNaccording_2__SHaccording</a> to these measures;__CPhe_brought_1__PShe brought__EEAs the outward court inclosed the inner, the prophet was led from the south gate of the outward court to the south gate of the inner, which was opposite it, and so into the inner court itself.__GHaccording_2__PSaccording__EFEze/40/32\');">Eze 40:32__NREze/40/35\');">35__EN';
stringArray[29] = 'And __PNthe_little_1__SHthe little</a> chambers thereof, and the posts thereof, and the arches thereof, according to these measures: __PNand_there_2__SHand [there</a> were] windows in it and in the arches thereof round about: [it was] fifty cubits long, and five and twenty cubits broad.__CPthe_little_1__PSthe little__EEThe entrance into the inner court seems to have been through a portico, exactly like that at each gate of the outward court; but the ascent was by eight steps, instead of seven. __NAEze/40/7\');">Eze 40:7__NREze/40/10\');">10__NREze/40/12\');">12__NB1Ch/28/11\');">1Ch 28:11__NR1Ch/28/12\');">12__NB2Ch/31/11\');">2Ch 31:11__NBNeh/13/5\');">Neh 13:5__NRNeh/13/9\');">9__NBJer/35/2\');">Jer 35:2-4__NBJer/36/10\');">Jer 36:10__AN__GHand_there_2__PSand there__EFEze/40/16\');">Eze 40:16__NREze/40/22\');">22__NREze/40/25\');">25__EN';
stringArray[30] = 'And __PNthe_arches_1__SHthe arches</a> round about [were] __PNfive_and_2__SHfive and</a> twenty cubits long, and __PNfive_cubits_3__SHfive cubits</a> __PNbroad_4__SHbroad</a>.__CPthe_arches_1__PSthe arches__EEThese are supposed to have been built over the spaces which separated the little chambers, or porters\' lodges.__GHfive_and_2__PSfive and__EFEze/40/21\');">Eze 40:21__NREze/40/25\');">25__NREze/40/29\');">29__NREze/40/33\');">33__NREze/40/36\');">36__AN__GGfive_cubits_3__PSfive cubits__EEInstead of five cubits, it seems evident, from the parallel places, that we should read twenty-five: the word êsrim appears to have been lost out of the text.__GHbroad_4__PSbroad__FEHeb. breadth.</TD></TR>';
stringArray[31] = 'And the arches thereof [were] toward the utter court; __PNand_palm_1__SHand palm</a> trees [were] upon the posts thereof: and the going up to it [had] __PNeight_2__SHeight</a> steps.__CPand_palm_1__PSand palm__FFEze/40/26\');">Eze 40:26__NREze/40/34\');">34__AN__GHeight_2__PSeight__EFEze/40/22\');">Eze 40:22__NREze/40/26\');">26__NREze/40/34\');">34__NREze/40/37\');">37__EN';
stringArray[32] = 'And he brought me __PNinto_the_1__SHinto the</a> inner court toward the east: and he measured the gate according to these measures.__CPinto_the_1__PSinto the__FFEze/40/28\');">Eze 40:28-31__NREze/40/35\');">35__EN';
stringArray[33] = 'And the little chambers thereof, and the posts thereof, and the arches thereof, [were] according to these measures: and [there were] windows therein and in the arches thereof round about: [__PNit_was_1__SHit was</a>] fifty cubits long, and five and twenty cubits broad.__CPit_was_1__PSit was__FFEze/40/21\');">Eze 40:21__NREze/40/25\');">25__NREze/40/36\');">36__EN';

stringArray[35] = 'And he brought me __PNto_the_1__SHto the</a> north gate, and __PNmeasured_2__SHmeasured</a> [it] according to these measures;__CPto_the_1__PSto the__FFEze/40/27\');">Eze 40:27__NREze/40/32\');">32__NBEze/44/4\');">Eze 44:4__NBEze/47/2\');">Eze 47:2__AN__GHmeasured_2__PSmeasured__FEThe north gate, as well as the east, was built in the same manner, and of the same dimensions, as the south gate. See the parallel passages.</TD></TR>';
stringArray[36] = 'The __PNlittle_1__SHlittle</a> chambers thereof, the posts thereof, and the arches thereof, and the windows to it round about: the length [was] fifty cubits, and the breadth five and twenty cubits.__CPlittle_1__PSlittle__FFEze/40/21\');">Eze 40:21__NREze/40/29\');">29__NREze/40/36\');">36__EN';
stringArray[37] = 'And __PNthe_posts_1__SHthe posts</a> thereof [were] toward __PNthe_utter_court_2__SHthe utter court</a>; and palm trees [were] upon the posts thereof, on this side, and on that side: and the going up to it [had] eight steps.__CPthe_posts_1__PSthe posts__FFEze/40/31\');">Eze 40:31__NREze/40/34\');">34__AN__GHthe_utter_court_2__PSthe utter court__FE"That is, ""the outer court,"" as the word utter primarily denotes."</TD></TR>';
stringArray[38] = 'And __PNthe_chambers_1__SHthe chambers</a> and the entries thereof [were] by the posts of the gates, __PNwhere_2__SHwhere</a> they washed the burnt offering.__CPthe_chambers_1__PSthe chambers__FFEze/40/12\');">Eze 40:12__NBEze/41/10\');">Eze 41:10__NREze/41/11\');">11__NB1Ki/6/8\');">1Ki 6:8__AN__GHwhere_2__PSwhere__FE"This place, where the legs and entrails of the sacrifices, especially of the burnt offerings, were washed, was just within the portico of the north entrance to the inner court, or court of the priests. An allusion to this is most probably made by the inspired apostle when writing his Epistle to the Hebrews, at the 10th chapter and 22nd verse. ""Let us draw near with a true heart in full assurance of faith, having our hearts sprinkled from an evil conscience, and our bodies washed with pure water."" __NALev/1/9\');">Lev 1:9__NBLev/8/21\');">Lev 8:21__NBHbr/10/22\');">Hbr 10:22__AN"</TD></TR>';
stringArray[39] = 'And in the porch of the gate [were] two tables on this side, and two __PNtables_on_that_1__SHtables on that</a> side, to slay thereon __PNthe_burnt_2__SHthe burnt</a> offering and __PNthe_sin_3__SHthe sin</a> offering and __PNthe_trespass_4__SHthe trespass</a> offering.__CPtables_on_that_1__PStables on that__FFEze/41/22\');">Eze 41:22__NBEze/44/16\');">Eze 44:16__NBMal/1/7\');">Mal 1:7__NRMal/1/12\');">12__NBLuk/22/30\');">Luk 22:30__NB1Cr/10/16\');">1Cr 10:16-21__AN__GHthe_burnt_2__PSthe burnt__EFLev/1/3\');">Lev 1:3-17__AN__GGthe_sin_3__PSthe sin__FFLev/4/2\');">Lev 4:2__NRLev/4/3\');">3__NRLev/4/13\');">13-35__NBIsa/53/5\');">Isa 53:5__NRIsa/53/10\');">10__NB2Cr/5/21\');">2Cr 5:21__AN__GHthe_trespass_4__PSthe trespass__EFLev/5/6\');">Lev 5:6-13__NBLev/6/6\');">Lev 6:6__NBLev/7/1\');">Lev 7:1__NRLev/7/2\');">2__EN';
stringArray[40] = 'And __PNat_the_side_1__SHat the side</a> without, __PNas_one_goeth_up_2__SHas one goeth up</a> to the entry of the north gate, [were] two tables; and on the other side, which [was] at the porch of the gate, [were] two tables.__CPat_the_side_1__PSat the side__EETwo tables were on each side, as you come into the porch of the gate; and two on each side of the inner part of the gate that looked towards the altar; in all eight tables, on which they slew and cut up the victims. It does not appear that any such tables were used either in the tabernacle or temple; and this seems to intimate the introduction of a new and more spiritual dispensation: See the referemces.__GHas_one_goeth_up_2__PSas one goeth up__FEor, at the step. __NAEze/40/35\');">Eze 40:35__AN.</TD></TR>';
stringArray[41] = 'Four tables [were] on this side, and four tables on that side, by the side of the gate; eight tables, whereupon they slew [their sacrifices].__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[42] = 'And the four tables [were] of hewn stone for the burnt offering, of a cubit and an half long, and a cubit and an half broad, and one cubit high: whereupon also they laid the instruments wherewith they slew the burnt offering and the sacrifice.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[43] = 'And __PNwithin_1__SHwithin</a> [were] __PNhooks_2__SHhooks</a>, an hand broad, fastened round about: and __PNupon_3__SHupon</a> the tables [was] the flesh of the offering.__CPwithin_1__PSwithin__EEThese were probably for hanging up the victims in order to flay them.__GHhooks_2__PShooks__FEor, end-irons, or, the two hearth-stones__GGupon_3__PSupon__FFLev/1/6\');">Lev 1:6__NRLev/1/8\');">8__NBLev/8/20\');">Lev 8:20__EN';
stringArray[44] = 'And without __PNthe_inner_1__SHthe inner</a> gate [were] the __PNchambers_2__SHchambers</a> of the singers in the inner court, which [was] at the side of the north gate; and their prospect [was] toward the south: one at the side of the east gate [having] the prospect toward the north.__CPthe_inner_1__PSthe inner__FFEze/40/23\');">Eze 40:23__NREze/40/27\');">27__AN__GHchambers_2__PSchambers__EFEze/40/7\');">Eze 40:7__NREze/40/10\');">10__NREze/40/29\');">29__NB1Ch/6/31\');">1Ch 6:31__NR1Ch/6/32\');">32__NB1Ch/16/41\');">1Ch 16:41-43__NB1Ch/25/1\');">1Ch 25:1-31__NBEph/5/19\');">Eph 5:19__NBCol/3/16\');">Col 3:16__EN';
stringArray[45] = 'And he said unto me, This __PNchamber_1__SHchamber</a>, __PNwhose_2__SHwhose</a> prospect [is] toward the south, [is] for the priests, __PNthe_keepers_3__SHthe keepers</a> of the __PNcharge_4__SHcharge</a> of the house.__CPchamber_1__PSchamber__EEThe word chamber probably here denotes a row of chambers, of which there seems to have been three: one for the singers; one for the priests who in their courses took charge of the sacred vessels and treasures; and one for the priests who attended on the altar and sacrifices.__GHwhose_2__PSwhose__EFEze/8/5\');">Eze 8:5__AN__GGthe_keepers_3__PSthe keepers__FFLev/8/35\');">Lev 8:35__NBNum/3/27\');">Num 3:27__NRNum/3/28\');">28__NRNum/3/32\');">32__NRNum/3/38\');">38__NBNum/18/5\');">Num 18:5__NB1Ch/6/49\');">1Ch 6:49__NB1Ch/9/23\');">1Ch 9:23__NB2Ch/13/11\');">2Ch 13:11__NBPsa/134/1\');">Psa 134:1__NBMal/2/4\');">Mal 2:4-7__NB1Ti/6/20\');">1Ti 6:20__NBRev/1/6\');">Rev 1:6__AN__GHcharge_4__PScharge__FEor, ward, or, ordinance, and so __NAEze/40/46\');">Eze 40:46__AN.</TD></TR>';
stringArray[46] = 'And the chamber whose prospect [is] toward the north [is] for the priests, __PNthe_keepers_1__SHthe keepers</a> of the charge of the altar: __PNthese_2__SHthese</a> [are] the sons of Zadok among the sons of Levi, __PNwhich_come_3__SHwhich come</a> near to the LORD to minister unto him.__CPthe_keepers_1__PSthe keepers__FFEze/44/15\');">Eze 44:15__NBLev/6/12\');">Lev 6:12__NRLev/6/13\');">13__NBNum/18/5\');">Num 18:5__AN__GHthese_2__PSthese__EFEze/43/19\');">Eze 43:19__NBEze/44/15\');">Eze 44:15__NBEze/48/11\');">Eze 48:11__NB1Ki/2/35\');">1Ki 2:35__AN__GGwhich_come_3__PSwhich come__FFLev/10/3\');">Lev 10:3__NBNum/16/5\');">Num 16:5__NRNum/16/40\');">40__NBEph/2/13\');">Eph 2:13__EN';
stringArray[47] = 'So he measured the __PNcourt_1__SHcourt</a>, __PNan_hundred_cubits_long_2__SHan hundred cubits long</a>, and an hundred cubits broad, foursquare; and the altar [that was] before the house.__CPcourt_1__PScourt__EEThis was the inner court, or court of the priests, which was of the same dimensions with each division of the outer court; and the altar stood directly before the porch of the temple.__GHan_hundred_cubits_long_2__PSan hundred cubits long__EFEze/40/19\');">Eze 40:19__NREze/40/23\');">23__NREze/40/27\');">27__EN';
stringArray[48] = 'And he brought me to __PNthe_porch_1__SHthe porch</a> of the house, and measured [each] post of the porch, five cubits on this side, and five cubits on that side: and the breadth of the gate [was] three cubits on this side, and three cubits on that side.__CPthe_porch_1__PSthe porch__EE"The length of the porch was twenty cubits, the same as the breadth of the temple, and the breadth eleven cubits, that is, one cubit more than in Solomon\'s temple. Two bivalve, or folding doors, each leaf of them being three cubits wide, seem to have formed the entrance; which, with five cubits, perhaps of brick or stone work, one each side, called ""the post of the porch,"" amount to sixteen cubits; and the other four cubits may be supposed to have been the distance from these posts to the outside walls of the temple. __NA1Ki/6/3\');">1Ki 6:3__NB2Ch/3/4\');">2Ch 3:4__AN"</TD></TR>';
stringArray[49] = 'The length of the porch [was] twenty cubits, and the breadth eleven cubits; and [he brought me] by __PNthe_steps_1__SHthe steps</a> whereby they went up to it: and [there were] __PNpillars_2__SHpillars</a> by the posts, one on this side, and another on that side.__CPthe_steps_1__PSthe steps__EEThis was a flight of steps which led from the inner court into the temple. __NAEze/40/31\');">Eze 40:31__NREze/40/34\');">34__NREze/40/37\');">37__AN__GHpillars_2__PSpillars__EF1Ki/7/15\');">1Ki 7:15-21__NB2Ch/3/17\');">2Ch 3:17__NBJer/52/17\');">Jer 52:17-23__NBRev/3/12\');">Rev 3:12__EN';
