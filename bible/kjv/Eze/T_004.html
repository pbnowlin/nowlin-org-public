stringArray[6] = 'And when thou hast accomplished them, lie again on thy right side, and thou shalt bear the iniquity of the house of Judah __PNforty_days_1__SHforty days</a>: I have appointed thee __PNeach_day_for_a_year_2__SHeach day for a year</a>.__CPforty_days_1__PSforty days__EE"This represented the forty years during which gross idolatry prevailed in Judah, from the reformation of Josiah, B.C. 624, to the same final desolation of the land. Some think that the period of 390 days also predicts the duration of the siege of the Babylonians, (__NAEze/4/9\');">Eze 4:9__AN,) deducting from it five months and twenty-nine days, when the besiegers went to meet the Egyptians (__NA2Ki/25/1\');">2Ki 25:1-4__NBJer/37/5\');">Jer 37:5__AN;) and that forty days may have been employed in desolating the temple and city. ""Beginning from __NA2Ki/23/3\');">2Ki 23:3__AN, __NA2Ki/23/23\');">23__AN. Ending __NAJer/52/30\');">Jer 52:30__AN."""__GHeach_day_for_a_year_2__PSeach day for a year__FEHeb. a day for a year, a day for a year. __NANum/14/34\');">Num 14:34__NBDan/9/24\');">Dan 9:24-26__NBDan/12/11\');">Dan 12:11__NRDan/12/12\');">12__NBRev/9/15\');">Rev 9:15__NBRev/11/2\');">Rev 11:2__NRRev/11/3\');">3__NBRev/12/14\');">Rev 12:14__NBRev/13/5\');">Rev 13:5__EN';

stringArray[9] = 'Take thou also unto thee __PNwheat_1__SHwheat</a>, and barley, and beans, and lentiles, and __PNmillet_2__SHmillet</a>, and __PNfitches_3__SHfitches</a>, and put them in one vessel, and make thee bread thereof, [according] to the number of the days that thou shalt lie upon thy side, __PNthree_4__SHthree</a> hundred and ninety days shalt thou eat thereof.__CPwheat_1__PSwheat__FFEze/4/13\');">Eze 4:13__NREze/4/16\');">16__AN__GHmillet_2__PSmillet__FEDochan, in Arabic, dokhn, the holcus dochna of Forskal, is a kind of millet, of considerable use as a food; the cultivation of which is described by Browne.__GGfitches_3__PSfitches__EEor, spelt. Kussemim is doubtless [zea] or spelt, as Aquila and Symmachus render here; and so LXX. and Theodotion, [olyra.] In times of scarcity it is customary to mix several kinds of coarser grains with the finer, to make it last the longer.__GHthree_4__PSthree__EFEze/4/5\');">Eze 4:5__EN';
