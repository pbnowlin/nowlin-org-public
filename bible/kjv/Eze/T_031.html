stringArray[5] = 'Therefore __PNhis_height_1__SHhis height</a> was exalted above all the trees of the field, and his boughs were multiplied, and his branches became long because of the multitude of waters, when __PNhe_shot_forth_2__SHhe shot forth</a>.__CPhis_height_1__PShis height__EEThe Assyrian king, to whom Pharaoh is compared, from his great power, extensive dominion, and the protection he afforded, resembled the spreading branches, thick shade, and high stature of a flourishing cedar on mount Lebanon. The fruitful lands of Assyria; the immense revenues he drew from vast multitudes in his extensive territories; his lucrative commerce, by the river Tigris, with the countries on the Indian ocean; and all the various sources of his wealth and prosperity, resembled the rivers and streams which cause the trees planted by them to grow and flourish exceedingly; and hence the empire and its head were exalted above all the kingdoms of the earth. __NAPsa/37/35\');">Psa 37:35__NRPsa/37/36\');">36__NBIsa/10/8\');">Isa 10:8-14__NBIsa/36/4\');">Isa 36:4__NRIsa/36/18\');">18__NRIsa/36/19\');">19__NBIsa/37/11\');">Isa 37:11-13__NBDan/4/11\');">Dan 4:11__AN__GHhe_shot_forth_2__PShe shot forth__FEor, it sent them forth.</TD></TR>';
