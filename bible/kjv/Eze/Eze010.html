Text[1] = 'Then I looked, and, behold, in the firmament that was above the head of the cherubims there appeared over them as it were a sapphire stone, as the appearance of the likeness of a throne.';
Text[2] = 'And he spake unto the man clothed with linen, and said, Go in between the wheels, [even] under the cherub, and fill thine hand with coals of fire from between the cherubims, and scatter [them] over the city. And he went in in my sight.';
Text[3] = 'Now the cherubims stood on the right side of the house, when the man went in; and the cloud filled the inner court.';

Text[6] = 'And it came to pass, [that] when he had commanded the man clothed with linen, saying, Take fire from between the wheels, from between the cherubims; then he went in, and stood beside the wheels.';
Text[7] = 'And [one] cherub stretched forth his hand from between the cherubims unto the fire that [was] between the cherubims, and took [thereof], and put [it] into the hands of [him that was] clothed with linen: who took [it], and went out.';
Text[8] = 'And there appeared in the cherubims the form of a man\'s hand under their wings.';
Text[9] = 'And when I looked, behold the four wheels by the cherubims, one wheel by one cherub, and another wheel by another cherub: and the appearance of the wheels [was] as the colour of a beryl stone.';
Text[10] = 'And [as for] their appearances, they four had one likeness, as if a wheel had been in the midst of a wheel.';
Text[11] = 'When they went, they went upon their four sides; they turned not as they went, but to the place whither the head looked they followed it; they turned not as they went.';
Text[12] = 'And their whole body, and their backs, and their hands, and their wings, and the wheels, [were] full of eyes round about, [even] the wheels that they four had.';
Text[13] = 'As for the wheels, it was cried unto them in my hearing, O wheel.';
Text[14] = 'And every one had four faces: the first face [was] the face of a cherub, and the second face [was] the face of a man, and the third the face of a lion, and the fourth the face of an eagle.';
Text[15] = 'And the cherubims were lifted up. This [is] the living creature that I saw by the river of Chebar.';
