stringArray[1] = 'Moreover, when ye __PNshall_divide_by_lot_1__SHshall divide by lot</a> the land for inheritance, __PNye_shall_offer_2__SHye shall offer</a> an oblation unto the LORD, __PNan_holy_portion_3__SHan holy portion</a> of the land: __PNthe_length_4__SHthe length</a> [shall be] the length of five and twenty thousand [reeds], and the breadth [shall be] ten thousand. This [shall be] holy in all the borders thereof round about.__CPshall_divide_by_lot_1__PSshall divide by lot__EEHeb. cause the land to fall by lot. __NAEze/47/21\');">Eze 47:21__NBEze/48/29\');">Eze 48:29__NBNum/34/13\');">Num 34:13__NBJos/13/6\');">Jos 13:6__NBJos/14/2\');">Jos 14:2__NBPsa/16/5\');">Psa 16:5__NRPsa/16/6\');">6__AN__GHye_shall_offer_2__PSye shall offer__EFEze/45/2\');">Eze 45:2-7__NBEze/48/8\');">Eze 48:8-23__NBLev/25/23\');">Lev 25:23__NBPro/3/9\');">Pro 3:9__AN__GGan_holy_portion_3__PSan holy portion__EEHeb. holiness. __NAZec/14/20\');">Zec 14:20__NRZec/14/21\');">21__AN__GHthe_length_4__PSthe length__FEThat our translators rightly added the word reeds, is evident from the length and breadth of the sanctuary being exactly the same as before, (comp. __NAEze/45/2\');">Eze 45:2__AN, with __NAEze/42/16\');">Eze 42:16-19__AN.) Estimating the reed at 3® yards, this holy oblation would constitute a square of nearly fifty miles on every side. From the north side a portion of nearly twenty miles in width, and nearly fifty in length, was appointed for the priests; and in the midst of this portion, the area of the sanctuary, about a mile square, to be enclosed by a wall, (__NAEze/45/1\');">Eze 45:1__AN, __NAEze/45/2\');">2__AN.) Next to this, on the south, was the Levites\' portion, of the same dimensions as that of the priests\', (__NAEze/45/5\');">Eze 45:5__AN;) and south of this was the portion for the city, of the same length as those of the priests and Levites, but only half the width, (__NAEze/45/6\');">Eze 45:6__AN.) These three formed the square of 25,000 reeds, or nearly fifty m stringArray[8] = 'In the land shall be his possession in Israel: __PNand_my_princes_1__SHand my princes</a> shall no more oppress my people; and [the rest of] the land shall they give to the house of Israel __PNaccording_2__SHaccording</a> to their tribes.__CPand_my_princes_1__PSand my princes__EEIn the predicted period, not only shall the ministers and worshippers of God be liberally provided for, but the princes will be both able and willing to defray the expenses of government, without oppressing their subjects, and will rule over them with equity and clemency, as the vicegerents of God; while the people will submit to them conscientiously, and live in peace, prosperity, and holiness. These things seem to be represented in language taken from the customs of the times in which the prophet wrote. Tithes are not mentioned in part of the vision, which shows that the ritual Mosaic law will not be in force. __NAEze/19/3\');">Eze 19:3__NREze/19/7\');">7__NBEze/22/27\');">Eze 22:27__NBEze/46/18\');">Eze 46:18__NBPro/28/16\');">Pro 28:16__NBIsa/11/3\');">Isa 11:3-5__NBIsa/32/1\');">Isa 32:1__NRIsa/32/2\');">2__NBIsa/60/17\');">Isa 60:17__NRIsa/60/18\');">18__NBJer/22/17\');">Jer 22:17__NBJer/23/5\');">Jer 23:5__NBMic/3/1\');">Mic 3:1-4__NBZep/3/13\');">Zep 3:13__NBJam/2/6\');">Jam 2:6__NBJam/5/1\');">Jam 5:1-6__NBRev/19/11\');">Rev 19:11-16__AN__GHaccording_2__PSaccording__EFJos/11/23\');">Jos 11:23__EN';
