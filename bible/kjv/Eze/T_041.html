var stringArray = new Array();
stringArray[1] = 'Afterward __PNhe_brought_1__SHhe brought</a> me __PNto_the_temple_2__SHto the temple</a>, and measured __PNthe_posts_3__SHthe posts</a>, six cubits broad on the one side, and six cubits broad on the other side, [which was] the breadth of the tabernacle.__CPhe_brought_1__PShe brought__FFEze/40/2\');">Eze 40:2__NREze/40/3\');">3__NREze/40/17\');">17__AN__GHto_the_temple_2__PSto the temple__EF1Ki/6/2\');">1Ki 6:2__NBZec/6/12\');">Zec 6:12__NRZec/6/13\');">13__NBEph/2/20\');">Eph 2:20-22__NB1Pe/2/5\');">1Pe 2:5__NBRev/3/12\');">Rev 3:12__NBRev/11/1\');">Rev 11:1__NRRev/11/2\');">2__NBRev/21/3\');">Rev 21:3__NRRev/21/15\');">15__AN__GGthe_posts_3__PSthe posts__EEThese were probably a sort of door-case on each side of the entrance; and the tabernacle perhaps was a kind of covering to the door, of the same dimensions.</TD></TR>';
stringArray[2] = 'And the breadth of __PNthe_door_1__SHthe door</a> [was] ten cubits; and the sides of the door [were] five cubits on the one side, and five cubits on the other side: and he measured __PNthe_length_2__SHthe length</a> thereof, forty cubits: and the breadth, twenty cubits.__CPthe_door_1__PSthe door__EEor, the entrance. This was the door out of the porch into the sanctuary, which seems to have been wider than that from the court to the porch. __NAExd/26/36\');">Exd 26:36__NBExd/36/37\');">Exd 36:37__NB1Ki/6/31\');">1Ki 6:31-35__NB2Ch/3/7\');">2Ch 3:7__NB2Ch/29/7\');">2Ch 29:7__NBJhn/10/7\');">Jhn 10:7__NRJhn/10/9\');">9__AN__GHthe_length_2__PSthe length__EF1Ki/6/2\');">1Ki 6:2__NR1Ki/6/17\');">17__NB2Ch/3/3\');">2Ch 3:3__EN';
stringArray[3] = 'Then went he inward, and measured the post of the door, __PNtwo_cubits_1__SHtwo cubits</a>; and the door, six cubits; and the breadth of the door, seven cubits.__CPtwo_cubits_1__PStwo cubits__EEThis was the thickness of the partition wall between the sanctuary (__NAEze/41/2\');">Eze 41:2__AN) and holy of holies (__NAEze/41/4\');">Eze 41:4__AN); the breadth of the wall on each side of the gate being seven cubits, and the entrance into the holy place six cubits in width.</TD></TR>';
stringArray[4] = 'So he measured the length thereof, __PNtwenty_cubits_1__SHtwenty cubits</a>; and the breadth, twenty cubits, before the temple: and he said unto me, __PNThis_2__SHThis</a> [is] the most holy [place].__CPtwenty_cubits_1__PStwenty cubits__FF1Ki/6/20\');">1Ki 6:20__NB2Ch/3/8\');">2Ch 3:8__NBRev/21/16\');">Rev 21:16__AN__GHThis_2__PSThis__EFExd/26/33\');">Exd 26:33__NRExd/26/34\');">34__NBHbr/9/3\');">Hbr 9:3-8__EN';
stringArray[5] = 'After he measured the wall of the house, six cubits; and the breadth of [every] __PNside_chamber_1__SHside chamber</a>, four cubits, round about the house on every side.__CPside_chamber_1__PSside chamber__FFEze/41/6\');">Eze 41:6__NREze/41/7\');">7__NBEze/42/3\');">Eze 42:3-14__NB1Ki/6/5\');">1Ki 6:5__NR1Ki/6/6\');">6__EN';
stringArray[6] = 'And the side chambers [were] three, __PNone_over_another_1__SHone over another</a>, and __PNthirty_in_order_2__SHthirty in order</a>; __PNand_they_3__SHand they</a> entered into the wall which [was] of the house for the side chambers round about, that they might __PNhave_hold_4__SHhave hold</a>, __PNbut_5__SHbut</a> they had not hold in the wall of the house.__CPone_over_another_1__PSone over another__EEHeb. side chamber over side chamber__GHthirty_in_order_2__PSthirty in order__FEor, three and thirty times, or feet. We find by Josephus, that around Solomon\'s temple were chambers three stories high, each story consisting of thirty chambers; which are supposed to have been on the north, south, and east sides of the temple.__GGand_they_3__PSand they__FF1Ki/6/6\');">1Ki 6:6__NR1Ki/6/10\');">10__AN__GHhave_hold_4__PShave hold__FEHeb. be holden. __NA1Pe/1/5\');">1Pe 1:5__AN__GGbut_5__PSbut__EEThat is, the beams or supporters, of the chambers were not let into the main wall of the temple; but rested on projections of the outer wall, which became a cubit narrower at every story, leaving a ledge of one cubit, to support the beams.</TD></TR>';
stringArray[7] = 'And [__PNthere_was_1__SHthere was</a>] __PNan_enlarging_2__SHan enlarging</a>, and a winding about still upward to the side chambers: for the winding about of the house went still upward round about the house: therefore the breadth of the house [was still] upward, and so increased [from] the lowest [chamber] to the highest by the midst.__CPthere_was_1__PSthere was__EEHeb. it was, made broader, and went round. __NA1Ki/6/8\');">1Ki 6:8__NBMat/13/32\');">Mat 13:32__NBHbr/6/1\');">Hbr 6:1__AN__GHan_enlarging_2__PSan enlarging__FEIn the same proportion in which the thickness of the wall decreased, the chambers increased, so that the middle story was one cubit larger, and the upper story two cubits larger, than the lower rooms; and a winding staircase, which widened in the same manner as the rooms, ascended from the bottom to the top.</TD></TR>';
stringArray[8] = 'I saw also the height of the house round about: the foundations of the side chambers [were] __PNa_full_1__SHa full</a> reed of six great cubits.__CPa_full_1__PSa full__FFEze/40/5\');">Eze 40:5__NBRev/21/16\');">Rev 21:16__EN';
stringArray[9] = 'The thickness of the wall, which [was] for the side chamber without, __PNwas_five_1__SH[was] five</a> cubits: and __PNthat_which_2__SH[that] which</a> [was] left [was] the place of the side chambers that [were] within.__CPwas_five_1__PSwas five__FFEze/41/5\');">Eze 41:5__AN__GHthat_which_2__PSthat which__FEThis appears to have been a walk, or gallery of communication between the chambers, five cubits broad, into which the doors opened. __NAEze/41/11\');">Eze 41:11__NBEze/42/1\');">Eze 42:1__NREze/42/4\');">4__EN';
stringArray[10] = 'And between __PNthe_chambers_1__SHthe chambers</a> [was] the wideness of twenty cubits round about the house on every side.__CPthe_chambers_1__PSthe chambers__EEAs the word rendered chambers is different from that used before, it is supposed there was another row of buildings, parallel with the side chambers, with a passage of twenty cubits between.</TD></TR>';
stringArray[11] = 'And the doors of the side chambers [were] toward [the place that was] left, one door toward the north, and another door toward the south: __PNand_the_breadth_1__SHand the breadth</a> of the place that was left [was] five cubits round about.__CPand_the_breadth_1__PSand the breadth__FFEze/41/9\');">Eze 41:9__NBEze/42/4\');">Eze 42:4__EN';
stringArray[12] = 'Now the building that [was] before the __PNseparate_1__SHseparate</a> place at the end toward the west [was] seventy cubits broad; and __PNthe_wall_2__SHthe wall</a> of the building [was] five cubits thick round about, and the length thereof ninety cubits.__CPseparate_1__PSseparate__FFEze/41/13\');">Eze 41:13-15__NBEze/42/1\');">Eze 42:1__NREze/42/10\');">10__NREze/42/13\');">13__NBRev/21/27\');">Rev 21:27__NBRev/22/14\');">Rev 22:14__NRRev/22/15\');">15__AN__GHthe_wall_2__PSthe wall__FEThis appears to have been a building erected at the west end of the temple.</TD></TR>';
stringArray[13] = 'So __PNhe_measured_1__SHhe measured</a> the house, an hundred cubits long; and the separate place, and the building, with the walls thereof, an hundred cubits long;__CPhe_measured_1__PShe measured__EEThese verses (13-15) seem to intimate, that all the buildings of the temple occupied an area of 100 square cubits.</TD></TR>';
stringArray[14] = 'Also the breadth of the face of the house, and of the separate place toward the east, an hundred cubits.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[15] = 'And he measured the length of the building over against the separate place which [was] behind it, and the __PNgalleries_1__SHgalleries</a> thereof on the one side and on the other side, an hundred cubits, __PNwith_the_2__SHwith the</a> inner temple, and the porches of the court;__CPgalleries_1__PSgalleries__EEor, several walks, or walks with pillars. __NAEze/42/3\');">Eze 42:3__NBSgs/1/17\');">Sgs 1:17__NBSgs/7/5\');">Sgs 7:5__NBZec/3/7\');">Zec 3:7__AN__GHwith_the_2__PSwith the__EFEze/41/17\');">Eze 41:17__NBEze/42/15\');">Eze 42:15__EN';
stringArray[16] = 'The door posts, and the __PNnarrow_1__SHnarrow</a> windows, and the galleries round about on their three stories, over against the door, cieled with wood round about, and __PNfrom_the_ground_up_to_the_windows_3__SHfrom the ground up to the windows</a>, and the windows [were] __PNcovered_4__SHcovered</a>;__CPnarrow_1__PSnarrow__FFEze/41/26\');">Eze 41:26__NBEze/40/16\');">Eze 40:16__NREze/40/25\');">25__NB1Ki/6/4\');">1Ki 6:4__NB1Cr/13/12\');">1Cr 13:12__AN__GHceiled_with_wood_2__PSceiled with wood__FEHeb. ceiling of wood. __NA1Ki/6/15\');">1Ki 6:15__NB2Ch/3/5\');">2Ch 3:5__NBHag/1/4\');">Hag 1:4__AN__GGfrom_the_ground_up_to_the_windows_3__PSfrom the ground up to the windows__EEor, the ground unto the windows__GHcovered_4__PScovered__FEProbably either by jutting out of the main wall of the temple; or by lattice work, or curtains, or by both.</TD></TR>';
stringArray[17] = '__PNTo_that_1__SHTo that</a> above the door, even unto the inner house, and without, and by all the wall round about within and without, by __PNmeasure_2__SHmeasure</a>.__CPTo_that_1__PSTo that__EEThat is, the windows were placed above the height of the door, at the east end of the temple, and thus continued, at the same height, and at measured distances, along both sides of the holy place, to the wall of the inner sanctuary, in which there were no windows.__GHmeasure_2__PSmeasure__FEHeb. measures. __NAEze/42/15\');">Eze 42:15__EN';
stringArray[18] = 'And [it was] made __PNwith_cherubims_1__SHwith cherubims</a> and __PNpalm_trees_2__SHpalm trees</a>, so that a palm tree [was] between a cherub and a cherub; __PNand_every_3__SHand [every]</a> cherub had two faces;__CPwith_cherubims_1__PSwith cherubims__FF1Ki/6/29\');">1Ki 6:29-32__NB1Ki/7/36\');">1Ki 7:36__NB2Ch/3/7\');">2Ch 3:7__AN__GHpalm_trees_2__PSpalm trees__EFEze/40/16\');">Eze 40:16__NREze/40/22\');">22__NBRev/7/9\');">Rev 7:9__AN__GGand_every_3__PSand every__FFEze/1/10\');">Eze 1:10__NBEze/10/14\');">Eze 10:14__NREze/10/21\');">21__NBRev/4/7\');">Rev 4:7-9__EN';
stringArray[19] = 'So that the face of a man [was] toward the palm tree on the one side, and the face of a young lion toward the palm tree on the other side: [it was] made through all the house round about.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';

stringArray[21] = 'The __PNposts_1__SHposts</a> of the temple [were] squared, [and] the face of the sanctuary; the appearance [of the one] as the appearance [of the other].__CPposts_1__PSposts__EEHeb. post. __NAEze/40/14\');">Eze 40:14__NB1Ki/6/33\');">1Ki 6:33__AN; *marg:</TD></TR>';
stringArray[22] = 'The __PNaltar_1__SHaltar</a> of wood [was] three cubits high, and the length thereof two cubits; and the corners thereof, and the length thereof, and the walls thereof, [were] of wood: and he said unto me, __PNThis_is_2__SHThis [is]</a> the table that [is] __PNbefore_3__SHbefore</a> the LORD.__CPaltar_1__PSaltar__EEThis must signify the altar of incense; which, both in the tabernacle and Solomon\'s temple, was covered with plates of gold. It is very remarkable, that in this temple described by Ezekiel, there is not the least mention of gold or silver, though there was such a profusion of these metals in the former; which may probably imply, that a glory of a more spiritual nature was intended under these emblems. __NAExd/30/1\');">Exd 30:1-3__NB1Ki/6/20\');">1Ki 6:20__NR1Ki/6/22\');">22__NB1Ki/7/48\');">1Ki 7:48__NB2Ch/4/19\');">2Ch 4:19__NBRev/8/3\');">Rev 8:3__AN__GHThis_is_2__PSThis is__EFEze/23/41\');">Eze 23:41__NBEze/44/16\');">Eze 44:16__NBExd/25/28\');">Exd 25:28-30__NBLev/24/6\');">Lev 24:6__NBPro/9/2\');">Pro 9:2__NBSgs/1/12\');">Sgs 1:12__NBMal/1/7\');">Mal 1:7__NRMal/1/12\');">12__NB1Cr/10/21\');">1Cr 10:21__NBRev/3/20\');">Rev 3:20__AN__GGbefore_3__PSbefore__FFExd/30/8\');">Exd 30:8__EN';

stringArray[24] = 'And the doors had two leaves [apiece], two turning leaves; two [leaves] for the one door, and two leaves for the other [door].__CPRelated_Verses1_1__PSEntire Verse.__FFEze/40/48\');">Eze 40:48__EN';
