stringArray[20] = 'And when they entered unto the heathen, whither they went, __PNthey_profaned_1__SHthey profaned</a> my holy name, when they said to them, __PNThese_2__SHThese</a> [are] the people of the LORD, and are gone forth out of his land.__CPthey_profaned_1__PSthey profaned__EEThe Jews, when thus scattered, appeared to them an abject and wretched company of people. They were recognized as the worshippers of Jehovah wherever they went; but they were looked upon as a viler and more worthless race than any of the idolaters among whom they were driven. Many would ascribe their wickedness to the tendency of their religion, which they abhorred, and not to their having acted inconsistently with it; and regard their miseries, not as the punishment of their sins, but as proofs of God\'s inability to protect them. This profanation of his holy name, Jehovah was determined to wipe away, by shewing mercy unto them. __NAIsa/52/5\');">Isa 52:5__NBRom/2/24\');">Rom 2:24__AN__GHThese_2__PSThese__EFExd/32/11\');">Exd 32:11-13__NBNum/14/15\');">Num 14:15__NRNum/14/16\');">16__NBJos/7/9\');">Jos 7:9__NB2Ki/18/30\');">2Ki 18:30__NR2Ki/18/35\');">35__NB2Ki/19/10\');">2Ki 19:10-12__NBJer/33/24\');">Jer 33:24__NBDan/3/15\');">Dan 3:15__EN';
