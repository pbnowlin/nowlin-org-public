var stringArray = new Array();
stringArray[1] = '__PNThus_saith_1__SHThus saith</a> the Lord GOD; __PNThe_gate_2__SHThe gate</a> of the inner court that looketh toward the east __PNshall_be_shut_3__SHshall be shut</a> the __PNsix_working_4__SHsix working</a> days; but __PNon_the_sabbath_5__SHon the sabbath</a> it shall be opened, and in the day of the new moon it shall be opened.__CPThus_saith_1__PSThus saith__EEWhether the rules for public worship here laid down were designed to be observed in those things wherein they differed from the law of Moses, in the ministrations of the second temple, is not certain. In the latter history of the Jewish church, the law of Moses only was followed, except in the corruption of following the traditions of the fathers.__GHThe_gate_2__PSThe gate__FEThe prophet had before observed that the east gate of the outer court was shut, and was told that it must only be opened for the prince; and now he is informed that the gate of the inner court on the east was also shut, and is to be opened only on the sabbath and new moons, till the evening.__GGshall_be_shut_3__PSshall be shut__FFEze/44/1\');">Eze 44:1__NREze/44/2\');">2__AN__GHsix_working_4__PSsix working__EFGen/3/19\');">Gen 3:19__NBExd/20/9\');">Exd 20:9__NBLuk/13/14\');">Luk 13:14__AN__GGon_the_sabbath_5__PSon the sabbath__FFEze/45/17\');">Eze 45:17__NBIsa/66/23\');">Isa 66:23__NBHbr/4/9\');">Hbr 4:9__NRHbr/4/10\');">10__EN';
stringArray[2] = 'And the prince shall enter by the way of __PNthe_porch_1__SHthe porch</a> of [that] gate without, and shall stand __PNby_the_post_2__SHby the post</a> of the gate, and __PNthe_priests_3__SHthe priests</a> shall __PNprepare_4__SHprepare</a> his burnt offering and his peace offerings, and __PNhe_shall_worship_5__SHhe shall worship</a> at the threshold of the gate: then he shall go forth; __PNbut_the_gate_6__SHbut the gate</a> shall not be shut until the evening.__CPthe_porch_1__PSthe porch__FFJhn/10/1\');">Jhn 10:1-3__AN__GHby_the_post_2__PSby the post__EFEze/46/8\');">Eze 46:8__NBEze/44/3\');">Eze 44:3__NB2Ch/23/13\');">2Ch 23:13__NB2Ch/34/31\');">2Ch 34:31__AN__GGthe_priests_3__PSthe priests__FFCol/1/28\');">Col 1:28__AN__GHprepare_4__PSprepare__FE"Or, ""offer,"" as the word âsah frequently denotes. The whole of this seems to intimate the constant, reverential, and exemplary attendance of kings on the pure ordinances of religion, in the approaching flourishing days of the church."__GGhe_shall_worship_5__PShe shall worship__FF1Ki/8/22\');">1Ki 8:22__NR1Ki/8/23\');">23__NB1Ch/17/16\');">1Ch 17:16__NB1Ch/29/10\');">1Ch 29:10-12__NB2Ch/6/13\');">2Ch 6:13__NB2Ch/29/29\');">2Ch 29:29__NBMat/26/39\');">Mat 26:39__NBHbr/5/7\');">Hbr 5:7__NRHbr/5/8\');">8__AN__GHbut_the_gate_6__PSbut the gate__EFEze/46/12\');">Eze 46:12__AN.</TD></TR>';
stringArray[3] = 'Likewise the people of the land shall worship at the door of this gate before the LORD in the sabbaths and in the new moons.__CPRelated_Verses1_1__PSEntire Verse.__FFLuk/1/10\');">Luk 1:10__NBJhn/10/9\');">Jhn 10:9__NBHbr/10/19\');">Hbr 10:19-22__EN';
stringArray[4] = 'And __PNthe_burnt_1__SHthe burnt</a> offering that the prince shall offer unto the LORD in the sabbath day [shall be] six lambs without blemish, and a ram without blemish.__CPthe_burnt_1__PSthe burnt__EEThe proportions of the burnt offerings, and also of the meat and drink offerings, are very different here form those prescribed in the Mosaic law. The meat offering, under the law, was only three tenths of an ephah to a bullock, two tenths for a ram, and one tenth for a lamb, with the fourth part of a hin of oil. __NAEze/45/17\');">Eze 45:17__NBNum/28/9\');">Num 28:9__NRNum/28/10\');">10__EN';
stringArray[5] = 'And __PNthe_meat_1__SHthe meat</a> offering [shall be] an ephah for a ram, and the meat offering for the lambs __PNas_he_shall_be_able_to_give_2__SHas he shall be able to give</a>, and an hin of oil to an ephah.__CPthe_meat_1__PSthe meat__FFEze/46/7\');">Eze 46:7__NREze/46/11\');">11__NREze/46/12\');">12__NBEze/45/24\');">Eze 45:24__NBNum/28/12\');">Num 28:12__AN__GHas_he_shall_be_able_to_give_2__PSas he shall be able to give__FEHeb. the gift of his hand. __NALev/14/21\');">Lev 14:21__NBNum/6/21\');">Num 6:21__NBDeu/16/17\');">Deu 16:17__EN';
stringArray[6] = 'And in the day of the new moon [it shall be] a young bullock without blemish, and six lambs, and a ram: they shall be without blemish.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[7] = 'And he shall prepare a meat offering, an ephah for a bullock, and an ephah for a ram, and for the lambs according as his hand shall attain unto, and an hin of oil to an ephah.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[8] = 'And when the prince shall enter, __PNhe_shall_go_1__SHhe shall go</a> in by the way of the porch of [that] gate, and he shall go forth by the way thereof.__CPhe_shall_go_1__PShe shall go__FFEze/46/2\');">Eze 46:2__NBEze/44/1\');">Eze 44:1-3__NBCol/1/18\');">Col 1:18__EN';
stringArray[9] = 'But __PNwhen_the_people_1__SHwhen the people</a> of the land shall __PNcome_before_2__SHcome before</a> the LORD in the solemn feasts, __PNhe_that_entereth_in_3__SHhe that entereth in</a> by the way of the north gate to worship shall go out by the way of the south gate; and he that entereth by the way of the south gate shall go forth by the way of the north gate: he shall not return by the way of the gate whereby he came in, but shall go forth over against it.__CPwhen_the_people_1__PSwhen the people__EEThis may intimate, that every thing should be regulated, in divine worship, so as to prevent disorder and interruption, and also that men should go forward and make progress in religion, and not turn their backs upon God.__GHcome_before_2__PScome before__EFExd/23/14\');">Exd 23:14-17__NBExd/34/23\');">Exd 34:23__NBDeu/16/16\');">Deu 16:16__NBPsa/84/7\');">Psa 84:7__NBMal/4/4\');">Mal 4:4__AN__GGhe_that_entereth_in_3__PShe that entereth in__FFEze/1/12\');">Eze 1:12__NREze/1/17\');">17__NBPhl/3/13\');">Phl 3:13__NRPhl/3/14\');">14__NBHbr/10/38\');">Hbr 10:38__NB2Pe/2/20\');">2Pe 2:20__NR2Pe/2/21\');">21__EN';
stringArray[10] = 'And the prince in the midst of them, when they go in, shall go in; and when they go forth, shall go forth.__CPRelated_Verses1_1__PSEntire Verse.__FF2Sa/6/14\');">2Sa 6:14-19__NB1Ch/29/20\');">1Ch 29:20__NR1Ch/29/22\');">22__NB2Ch/6/2\');">2Ch 6:2-4__NB2Ch/7/4\');">2Ch 7:4__NR2Ch/7/5\');">5__NB2Ch/20/27\');">2Ch 20:27__NR2Ch/20/28\');">28__NB2Ch/29/28\');">2Ch 29:28__NR2Ch/29/29\');">29__NB2Ch/34/30\');">2Ch 34:30__NR2Ch/34/31\');">31__NBNeh/8/8\');">Neh 8:8__NRNeh/8/9\');">9__NBPsa/42/4\');">Psa 42:4__NBPsa/122/1\');">Psa 122:1-4__NBMat/18/20\');">Mat 18:20__NBMat/28/20\');">Mat 28:20__NBHbr/3/6\');">Hbr 3:6__NBHbr/4/14\');">Hbr 4:14-16__NBRev/2/1\');">Rev 2:1__EN';
stringArray[11] = 'And __PNin_the_feasts_1__SHin the feasts</a> and in the solemnities __PNthe_meat_2__SHthe meat</a> offering shall be an ephah to a bullock, and an ephah to a ram, and to the lambs as he is able to give, and an hin of oil to an ephah.__CPin_the_feasts_1__PSin the feasts__FFLev/23/1\');">Lev 23:1-44__NBNum/15/\');">Num 15__AN;__NANum/28/\');">28__AN;__NANum/29/\');">29__NBDeu/16/1\');">Deu 16:1-22__AN__GHthe_meat_2__PSthe meat__EFEze/46/5\');">Eze 46:5__NREze/46/7\');">7__EN';
stringArray[12] = 'Now when the prince shall prepare __PNa_voluntary_1__SHa voluntary</a> burnt offering or peace offerings voluntarily unto the LORD, [one] shall then __PNopen_him_2__SHopen him</a> the gate that looketh toward the east, and he shall prepare his burnt offering and his peace offerings, __PNas_he_did_3__SHas he did</a> on the sabbath day: then he shall go forth; and after his going forth [one] shall shut the gate.__CPa_voluntary_1__PSa voluntary__FFLev/1/3\');">Lev 1:3__NBLev/23/38\');">Lev 23:38__NBNum/29/39\');">Num 29:39__NB1Ki/3/4\');">1Ki 3:4__NB1Ch/29/21\');">1Ch 29:21__NB2Ch/5/6\');">2Ch 5:6__NB2Ch/7/5\');">2Ch 7:5-7__NB2Ch/29/31\');">2Ch 29:31__NBEzr/1/4\');">Ezr 1:4__NBEzr/3/5\');">Ezr 3:5__NBEzr/6/17\');">Ezr 6:17__NBRom/12/1\');">Rom 12:1__NBEph/5/2\');">Eph 5:2__AN__GHopen_him_2__PSopen him__EFEze/46/1\');">Eze 46:1__NREze/46/2\');">2__NREze/46/8\');">8__NBEze/44/3\');">Eze 44:3__AN__GGas_he_did_3__PSas he did__FFEze/45/17\');">Eze 45:17__EN';
stringArray[13] = '__PNThou_shalt_daily_1__SHThou shalt daily</a> prepare a burnt offering unto the LORD [of] a lamb __PNof_the_first_year_2__SHof the first year</a> without blemish: thou shalt prepare it __PNevery_morning_3__SHevery morning</a>.__CPThou_shalt_daily_1__PSThou shalt daily__EEIt is observable, that there is nothing said about the evening sacrifice, or the additional lamb, morning and evening, on the sabbath, which makes an important difference between this and the old laws; and is probably an intimation of that change in the external forms of religion which the coming of the Messiah should introduce. __NAExd/29/38\');">Exd 29:38-42__NBNum/28/3\');">Num 28:3-8__NRNum/28/10\');">10__NBDan/8/11\');">Dan 8:11-13__NBJhn/1/29\');">Jhn 1:29__NB1Pe/1/19\');">1Pe 1:19__NR1Pe/1/20\');">20__NBRev/13/8\');">Rev 13:8__AN__GHof_the_first_year_2__PSof the first year__FEHeb. a son of his year. __NAExd/12/5\');">Exd 12:5__NBLev/12/6\');">Lev 12:6__AN__GGevery_morning_3__PSevery morning__EEHeb. morning by morning. __NAPsa/92/2\');">Psa 92:2__NBIsa/50/4\');">Isa 50:4__EN';
stringArray[14] = 'And thou shalt prepare a meat offering for it every morning, __PNthe_sixth_1__SHthe sixth</a> part of an ephah, and the third part of an hin of oil, to temper with the fine flour; a meat offering continually by a perpetual ordinance unto the LORD.__CPthe_sixth_1__PSthe sixth__FFNum/28/5\');">Num 28:5__EN';
stringArray[15] = 'Thus shall they prepare the lamb, and the meat offering, and the oil, every morning [for] __PNa_continual_1__SHa continual</a> burnt offering.__CPa_continual_1__PSa continual__FFHbr/7/27\');">Hbr 7:27__NBHbr/9/26\');">Hbr 9:26__NBHbr/10/1\');">Hbr 10:1-10__EN';
stringArray[16] = 'Thus saith the Lord GOD; __PNIf_the_prince_1__SHIf the prince</a> give a gift unto any of his sons, the inheritance thereof shall be his sons\'; it [shall be] their possession by inheritance.__CPIf_the_prince_1__PSIf the prince__FFGen/25/5\');">Gen 25:5__NRGen/25/6\');">6__NB2Ch/21/3\');">2Ch 21:3__NBPsa/37/18\');">Psa 37:18__NBMat/25/34\');">Mat 25:34__NBLuk/10/42\');">Luk 10:42__NBJhn/8/35\');">Jhn 8:35__NRJhn/8/36\');">36__NBRom/8/15\');">Rom 8:15-17__NRRom/8/29\');">29-32__NBGal/4/7\');">Gal 4:7__EN';
stringArray[17] = 'But if he give a gift of his inheritance to one of his servants, then it shall be his __PNto_the_year_1__SHto the year</a> of liberty; after it shall return to the prince: but his inheritance shall be his sons\' for them.__CPto_the_year_1__PSto the year__EEThat is, the year of Jubilee, called the year of liberty, because there was then a general release: all servants had their liberty; and all alienated estates returned to their former owners. __NALev/25/10\');">Lev 25:10__NBMat/25/14\');">Mat 25:14-29__NBLuk/19/25\');">Luk 19:25__NRLuk/19/26\');">26__NBGal/4/30\');">Gal 4:30__NRGal/4/31\');">31__EN';
stringArray[18] = 'Moreover __PNthe_prince_1__SHthe prince</a> shall not take of the people\'s inheritance by oppression, to __PNthrust_2__SHthrust</a> them out of their possession; [but] he shall give his sons __PNinheritance_out_3__SHinheritance out</a> of his own possession: that __PNmy_people_4__SHmy people</a> be not scattered every man from his possession.__CPthe_prince_1__PSthe prince__FFEze/45/8\');">Eze 45:8__NBPsa/72/2\');">Psa 72:2-4__NBPsa/78/72\');">Psa 78:72__NBIsa/11/3\');">Isa 11:3__NRIsa/11/4\');">4__NBIsa/32/1\');">Isa 32:1__NRIsa/32/2\');">2__NBJer/23/5\');">Jer 23:5__NRJer/23/6\');">6__AN__GHthrust_2__PSthrust__EFEze/22/27\');">Eze 22:27__NB1Ki/21/19\');">1Ki 21:19__NBMic/1/1\');">Mic 1:1__NRMic/1/2\');">2__NBMic/3/1\');">Mic 3:1-3__AN__GGinheritance_out_3__PSinheritance out__FFPsa/68/18\');">Psa 68:18__NBJhn/10/28\');">Jhn 10:28__NBEph/4/8\');">Eph 4:8__AN__GHmy_people_4__PSmy people__EFEze/34/3\');">Eze 34:3-6__NREze/34/21\');">21__EN';
stringArray[19] = 'After he brought me through __PNthe_entry_1__SHthe entry</a>, which [was] at the side of the gate, into the holy chambers of the priests, which looked toward the north: and, behold, there [was] __PNa_place_2__SHa place</a> on the two sides westward.__CPthe_entry_1__PSthe entry__EEThis entry was at the west side of the north gate of the inner court. __NAEze/40/44\');">Eze 40:44-46__NBEze/42/9\');">Eze 42:9__AN; (see __NAEze/44/4\');">Eze 44:4__AN, __NAEze/44/5\');">5__AN.)__GHa_place_2__PSa place__FE"This place was at the west corners of the inner court, or court of the priests; where they prepared the most holy things, the trespass and sin offering, which none but the priests might eat; that they might not ""bear them out into the utter court, to sanctify the people,"" that is, by touching them incapacitate them from discharging their ordinary occupations."</TD></TR>';
stringArray[20] = 'Then said he unto me, This [is] the place where the priests shall __PNboil_the_trespass_1__SHboil the trespass</a> offering and the sin offering, where they shall __PNbake_the_meat_2__SHbake the meat</a> offering; that they bear [them] not out into the utter court, __PNto_sanctify_3__SHto sanctify</a> the people.__CPboil_the_trespass_1__PSboil the trespass__FFEze/44/29\');">Eze 44:29__NB1Sa/2/13\');">1Sa 2:13-15__NB2Ch/35/13\');">2Ch 35:13__AN__GHbake_the_meat_2__PSbake the meat__EFLev/2/4\');">Lev 2:4-7__NBLev/7/1\');">Lev 7:1-38__AN__GGto_sanctify_3__PSto sanctify__FFEze/44/19\');">Eze 44:19__EN';
stringArray[21] = 'Then he brought me forth into the utter court, and caused me to pass by the four corners of the court; and, behold, __PNin_every_corner_of_the_court_there_was_a_court_1__SHin every corner of the court [there was] a court</a>.__CPin_every_corner_of_the_court_there_was_a_court_1__PSin every corner of the court there was a court__EEHeb. a court in the corner of a court; and a court in a corner of a court.</TD></TR>';
stringArray[22] = 'In the four corners of the court [there were] __PNcourts_1__SHcourts</a> __PNjoined_2__SHjoined</a> of forty [cubits] long and thirty broad: these four corners [were] of one measure.__CPcourts_1__PScourts__EEThese courts in the corners of the outer court, or court of the people, appear to have been a kind of uncovered apartments, surrounded with little chambers for the cooks, and used for dressing the peace offerings of the people. On these their families and friends feasted; and portions were sent to the poor, the widow, and the orphan; and thus the spirit of devotion preserved the spirit of mercy, charity, and benevolence, in the land.__GHjoined_2__PSjoined__FEor, made with chimneys. corners. Heb. cornered.</TD></TR>';
stringArray[23] = 'And [there was] a row [of building] round about in them, round about them four, and [it was] made with boiling places under the rows round about.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[24] = 'Then said he unto me, These [are] the places of them that boil, where the ministers of the house shall boil the sacrifice of the people.__CPRelated_Verses1_1__PSEntire Verse.__FFEze/46/20\');">Eze 46:20__NBMat/24/45\');">Mat 24:45__NBJhn/21/15\');">Jhn 21:15-17__NB1Pe/5/2\');">1Pe 5:2__EN';
