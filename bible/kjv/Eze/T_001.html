stringArray[22] = 'And __PNthe_likeness_1__SHthe likeness</a> of the firmament upon the heads of the living creature [was] as the colour of the terrible __PNcrystal_2__SHcrystal</a>, stretched forth over their heads above.__CPthe_likeness_1__PSthe likeness__FFEze/1/26\');">Eze 1:26__NBEze/10/1\');">Eze 10:1__NBExd/24/10\');">Exd 24:10__NBJob/37/22\');">Job 37:22__NBRev/4/3\');">Rev 4:3__NRRev/4/6\');">6__NBRev/21/11\');">Rev 21:11__AN__GHcrystal_2__PScrystal__FEThe Hebrew kerach, which generally denotes ice, doubtless here signifies crystal, ([krystallos] from [kryos] cold, ice, and [stellomai] to concrete,) as it is rendered by the LXX. and Vulgate. It is a very large class of silicious minerals, hard, pellucid, naturally colourless, of regularly angular figures, and of simple plates; not flexible, nor elastic, but giving fire with steel; not fermenting by acid menstrua, but calcinable in a strong fire. There are three orders of pure crystal: the first is perfect columnar crystals, with double pyramids, of eighteen planes, in an hexangular pyramid at each end; the second is that of perfect crystals, without a column, of twelve or sixteen planes, in two hexangular pyramids: and the third is that of imperfect crystals, with single pyramids, of ten or twelve planes, in an hexangular or pentangular column. Terrible crystal seems to denote that which was well cut and polished, vividly refracting the rays of light.</TD></TR>';
