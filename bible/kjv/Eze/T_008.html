stringArray[2] = 'Then __PNI_beheld_1__SHI beheld</a>, and lo a likeness as the appearance of fire: from the appearance of his loins even downward, fire; and from his loins even upward, as the appearance of brightness, as the colour of __PNamber_2__SHamber</a>.__CPI_beheld_1__PSI beheld__FFEze/1/4\');">Eze 1:4__NREze/1/26\');">26__NREze/1/27\');">27__NBDan/7/9\');">Dan 7:9__NRDan/7/10\');">10__NBRev/1/14\');">Rev 1:14__NRRev/1/15\');">15__AN__GHamber_2__PSamber__FEAmber is a hard, inflammable, bituminous substance, of a beautiful yellow colour, very transparent, and susceptible of an exquisite polish. When rubbed it is highly endowed with electricity; a name which the moderns have formed from its Greek name [elektron.] But, as amber becomes dim as soon as it feels the fire, and is speedily consumed, it is probable that the original chashmal, which Bochart derives from the Chaldee nechash, copper, and melala, gold, was a mixed metal, similar to that which the Greeks called [elektron] electrum, as the LXX. and Vulgate render, from its resemblance to amber in colour.</TD></TR>';

stringArray[17] = 'Then he said unto me, Hast thou seen [this], O son of man? __PNIs_it_a_light__etc__1__SHIs it a light</a> thing to the house of Judah that they commit the abominations which they commit here? __PNfor_2__SHfor</a> they have filled the land with violence, and have returned to provoke me to anger: and, lo, __PNthey_put_3__SHthey put</a> the branch to their nose.__CPIs_it_a_light__etc__1__PSIs it a light, etc.__EEor, Is there any thing lighter than to commit, etc.__GHfor_2__PSfor__EFEze/7/23\');">Eze 7:23__NBEze/9/9\');">Eze 9:9__NBEze/11/6\');">Eze 11:6__NBGen/6/13\');">Gen 6:13__NB2Ki/21/16\');">2Ki 21:16__NB2Ki/24/4\');">2Ki 24:4__NBJer/6/7\');">Jer 6:7__NBJer/19/4\');">Jer 19:4__NBJer/20/8\');">Jer 20:8__NBAmo/3/10\');">Amo 3:10__NBAmo/6/3\');">Amo 6:3__NBMic/2/2\');">Mic 2:2__NBMic/6/12\');">Mic 6:12__NBZep/1/9\');">Zep 1:9__AN__GGthey_put_3__PSthey put__EE"So the Vulgate has, applicant ramum ad nares suas, ""they apply the branch to their nose;"" which Jerome explains by ""a branch of the palm tree with which they adored the idols;"" and it seems plainly to allude to the Magian fire-worshippers, who, Strabo tells us, held a little bunch of twigs in their hand, when praying before the fire."</TD></TR>';
