Text[1] = 'Again in the ninth year, in the tenth month, in the tenth [day] of the month, the word of the LORD came unto me, saying,';

Text[14] = 'I the LORD have spoken [it]: it shall come to pass, and I will do [it]; I will not go back, neither will I spare, neither will I repent; according to thy ways, and according to thy doings, shall they judge thee, saith the Lord GOD.';
