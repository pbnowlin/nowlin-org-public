stringArray[9] = 'And when I looked, __PNbehold_1__SHbehold</a> the four wheels by the cherubims, one wheel by one cherub, and another wheel by another cherub: and the appearance of the wheels [was] __PNas_the_2__SHas the</a> colour of __PNa_beryl_3__SHa beryl</a> stone.__CPbehold_1__PSbehold__FFEze/1/15\');">Eze 1:15-17__AN__GHas_the_2__PSas the__EFDan/10/6\');">Dan 10:6__NBRev/21/20\');">Rev 21:20__AN__GGa_beryl_3__PSa beryl__EE"Tarshish is generally rendered by the LXX. and the Vulgate the chrysolite, so called by the ancients (from [chrusos ( xruso/v )] gold, and [lithos ( liðqov )] a stone,) because of its fine gold yellow colour. It is now called by the moderns the topaz; is a very beautiful and valuable gem in its pure and perfect state, though very rarely found so; and the finer pieces of it are in hardness second only to the diamond. The Vulgate, however, in __NAEze/1/16\');">Eze 1:16__AN, renders, quasi visio maris, ""as the appearance of the seas,"" i.e., azure; and Dr. Geddes (on __NAExd/28/10\');">Exd 28:10__AN) says, that, with Abarbanel, he believes the beryl to be intended. It is a pellucid gem, called by our lapidaries, aqua marina, of a sea or bluish green colour, found in the East Indies and about the gold mines of Peru. The genuine beryl never receives any other mixture of colour; and in its perfect state approaches the hardness of garnet."</TD></TR>';
