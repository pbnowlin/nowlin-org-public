stringArray[8] = 'And Solomon said unto God, __PNThou_hast_shewed_1__SHThou hast shewed</a> great mercy unto David my father, and hast made me __PNto_reign_2__SHto reign</a> in his stead.__CPThou_hast_shewed_1__PSThou hast shewed__FF2Sa/7/8\');">2Sa 7:8__NR2Sa/7/9\');">9__NB2Sa/12/7\');">2Sa 12:7__NR2Sa/12/8\');">8__NB2Sa/22/51\');">2Sa 22:51__NB2Sa/23/1\');">2Sa 23:1__NBPsa/86/13\');">Psa 86:13__NBPsa/89/20\');">Psa 89:20-28__NRPsa/89/49\');">49__NBIsa/55/3\');">Isa 55:3__AN__GHto_reign_2__PSto reign__EF1Ch/28/5\');">1Ch 28:5__NB1Ch/29/23\');">1Ch 29:23__EN';
stringArray[9] = 'Now, O LORD God, __PNlet_thy_promise_1__SHlet thy promise</a> unto David my father be established: __PNfor_thou_hast_2__SHfor thou hast</a> made me king over a people __PNlike_the_dust_3__SHlike the dust</a> of the earth in multitude.__CPlet_thy_promise_1__PSlet thy promise__FF2Sa/7/12\');">2Sa 7:12-16__NR2Sa/7/25\');">25-29__NB1Ch/17/11\');">1Ch 17:11-14__NR1Ch/17/23\');">23-27__NB1Ch/28/6\');">1Ch 28:6__NR1Ch/28/7\');">7__NBPsa/89/35\');">Psa 89:35-37__NBPsa/132/11\');">Psa 132:11__NRPsa/132/12\');">12__AN__GHfor_thou_hast_2__PSfor thou hast__EF1Ki/3/7\');">1Ki 3:7__NR1Ki/3/8\');">8__AN__GGlike_the_dust_3__PSlike the dust__EEHeb. much as the dust. __NAGen/13/16\');">Gen 13:16__NBGen/22/17\');">Gen 22:17__NBNum/23/10\');">Num 23:10__EN';
stringArray[10] = '__PNGive_me_1__SHGive me</a> now wisdom and knowledge, that I may __PNgo_out_2__SHgo out</a> and come in before this people: __PNfor_who_can_3__SHfor who can</a> judge this thy people, [that is so] great?__CPGive_me_1__PSGive me__FF1Ki/3/9\');">1Ki 3:9__NBPsa/119/34\');">Psa 119:34__NRPsa/119/73\');">73__NBPro/2/2\');">Pro 2:2-6__NBPro/3/13\');">Pro 3:13-18__NBPro/4/7\');">Pro 4:7__NBJam/1/5\');">Jam 1:5__AN__GHgo_out_2__PSgo out__EFNum/27/17\');">Num 27:17__NBDeu/31/2\');">Deu 31:2__NB2Sa/5/2\');">2Sa 5:2__AN__GGfor_who_can_3__PSfor who can__FF2Cr/2/16\');">2Cr 2:16__NB2Cr/3/5\');">2Cr 3:5__EN';
stringArray[11] = 'And God said to Solomon, __PNBecause_1__SHBecause</a> __PNthis_was_2__SHthis was</a> in thine heart, and thou hast not asked riches, wealth, or honour, nor the life of thine enemies, neither yet hast asked long life; but hast asked wisdom and knowledge for thyself, __PNthat_thou_mayest_3__SHthat thou mayest</a> judge my people, over whom I have made thee king:__CPBecause_1__PSBecause__EEThis does not occur in Kings: and it implies that the request of Solomon, as arising from a spiritual judgment and heart, was peculiarly acceptable to that God who searches, regards, and demands the heart. God promised Solomon all the things which he had not asked, except the life of his enemies; for he was to be a peaceable king, a type of the Prince of peace.__GHthis_was_2__PSthis was__EF1Sa/16/7\');">1Sa 16:7__NB1Ki/3/11\');">1Ki 3:11-13__NB1Ki/8/18\');">1Ki 8:18__NB1Ch/28/2\');">1Ch 28:2__NB1Ch/29/17\');">1Ch 29:17__NR1Ch/29/18\');">18__NBPro/23/7\');">Pro 23:7__NBAct/5/4\');">Act 5:4__NBHbr/4/12\');">Hbr 4:12__AN__GGthat_thou_mayest_3__PSthat thou mayest__FF1Ki/3/28\');">1Ki 3:28__NBPro/14/8\');">Pro 14:8__NBJam/3/13\');">Jam 3:13__NRJam/3/17\');">17__EN';
stringArray[12] = 'Wisdom and knowledge [is] granted unto thee; and __PNI_will_give_1__SHI will give</a> thee riches, and wealth, and honour, __PNsuch_as_none_2__SHsuch as none</a> of the kings have had that [have been] before thee, neither shall there any after thee have the like.__CPI_will_give_1__PSI will give__FFMat/6/33\');">Mat 6:33__NBEph/3/20\');">Eph 3:20__AN__GHsuch_as_none_2__PSsuch as none__EF2Ch/9/22\');">2Ch 9:22__NB1Ch/29/25\');">1Ch 29:25__NBEcc/2/9\');">Ecc 2:9__NBJam/1/5\');">Jam 1:5__EN';
stringArray[13] = 'Then Solomon came [from his journey] to the high place that [was] __PNat_Gibeon_1__SHat Gibeon</a> to Jerusalem, from before the tabernacle of the congregation, and __PNreigned_2__SHreigned</a> over Israel.__CPat_Gibeon_1__PSat Gibeon__FF2Ch/1/3\');">2Ch 1:3__AN__GHreigned_2__PSreigned__EF1Ki/4/24\');">1Ki 4:24__NR1Ki/4/25\');">25__EN';
stringArray[14] = 'And __PNSolomon_1__SHSolomon</a> gathered chariots and horsemen: and he had a thousand and four hundred chariots, and twelve thousand horsemen, which he placed in __PNthe_chariot_cities_2__SHthe chariot cities</a>, and with the king at Jerusalem.__CPSolomon_1__PSSolomon__FF2Ch/9/25\');">2Ch 9:25__NBDeu/17/16\');">Deu 17:16__NB1Ki/4/26\');">1Ki 4:26__NB1Ki/10/16\');">1Ki 10:16__NR1Ki/10/26\');">26-29__AN__GHthe_chariot_cities_2__PSthe chariot cities__FECities where the chariots, and horses belonging to them, were kept.</TD></TR>';
stringArray[15] = 'And __PNthe_king_1__SHthe king</a> __PNmade_2__SHmade</a> silver and gold at Jerusalem [as plenteous] as stones, and cedar trees made he as the __PNsycomore_trees_3__SHsycomore trees</a> that [are] in the vale for abundance.__CPthe_king_1__PSthe king__EEHe destroyed its value by making it so exceedingly plentiful. __NA2Ch/1/12\');">2Ch 1:12__NB2Ch/9/27\');">2Ch 9:27__NB1Ki/10/27\');">1Ki 10:27-29__NBJob/22/24\');">Job 22:24__NRJob/22/25\');">25__NBIsa/60/17\');">Isa 60:17__AN__GHmade_2__PSmade__FEHeb. gave__GGsycomore_trees_3__PSsycomore trees__FF2Ch/9/27\');">2Ch 9:27__NBIsa/9/10\');">Isa 9:10__NBAmo/7/14\');">Amo 7:14__EN';
stringArray[16] = 'And __PNSolomon_1__SHSolomon</a> had horses brought out of Egypt, and __PNlinen_yarn_2__SHlinen yarn</a>: the king\'s merchants received the linen yarn at a price.__CPSolomon_1__PSSolomon__EEHeb. the going forth of the horses which was Solomon\'s. __NA2Ch/9/28\');">2Ch 9:28__NB1Ki/10/28\');">1Ki 10:28__NR1Ki/10/29\');">29__AN__GHlinen_yarn_2__PSlinen yarn__FE"The word [miqveh ( hwqm )] or [miqveh ( hwqm )] mikweh, is regarded by the ancient translators as a proper name: the LXX. have [ek Thekoue] ""from Tekoa,"" the Vulgate, de Coa, ""from Koa,"" which is adopted by Dr. Geddes; the Syriac, ""from the city Aphelia;"" and the Arabic, "" ex urbe Australium. "" Bochart thinks it signifies a tribute; others suppose that it signifies a string or drove of horses, or as Jarchi says, what the Germans call Stutte, a stud; but Houbigant supposes it to be a corruption for mercavah, ""chariots."" Our English translation, however, which regards it as synonymous with tikwah, seems by far the best. According to Norden, linen yarn is still one of the principal articles of commerce in Egypt, and is exported in very large quantities, together with unmanufactured flax and spun cotton; and Sanutus, 400 years ago, remarked that though Christian countries abounded in flax, yet the goodness of the Egyptian was such, that it was dispersed even to the west."</TD></TR>';
stringArray[17] = 'And they fetched up, and brought forth out of Egypt a chariot for six hundred [shekels] of silver, and an horse for an hundred and fifty: and so brought they out [horses] for all __PNthe_kings_1__SHthe kings</a> of the Hittites, and for the kings of Syria, by their __PNmeans_2__SHmeans</a>.__CPthe_kings_1__PSthe kings__FF2Ki/10/29\');">2Ki 10:29__AN__GHmeans_2__PSmeans__FEHeb. hand.</TD></TR>';
