stringArray[21] = 'And __PNthey_brought_1__SHthey brought</a> __PNseven_2__SHseven</a> bullocks, and seven rams, and seven lambs, and seven he goats, for __PNa_sin_offering_3__SHa sin offering</a> for the kingdom, and for the sanctuary, and for Judah. And he commanded the priests the sons of Aaron to offer [them] on the altar of the LORD.__CPthey_brought_1__PSthey brought__EEThe law only required one bullock for the sins of the high priest, another for the sins of the people, and one he-goat for the sins of the prince: but Hezekiah offered many more, and the reason appears sufficiently evident: the law only speaks of the sins of ignorance, but here there were sins of every dye, idolatry, apostasy from the Divine worship, profanation of the temple, etc., etc. The sin offerings, we are informed, were offered, first, for the Kingdom, for the transgressions of the king and his family; secondly, for the sanctuary, which had been defiled and polluted; and for the priests, who had been profane, negligent, and unholy; and finally, for Judah, for the whole mass of the people, who had been led away into every kind of abomination by the above examples.__GHseven_2__PSseven__EFNum/23/1\');">Num 23:1__NRNum/23/14\');">14__NRNum/23/29\');">29__NB1Ch/15/26\');">1Ch 15:26__NBEzr/8/35\');">Ezr 8:35__NBJob/42/8\');">Job 42:8__NBEze/45/23\');">Eze 45:23__AN__GGa_sin_offering_3__PSa sin offering__FFLev/4/3\');">Lev 4:3-14__NBNum/15/22\');">Num 15:22-24__NB2Cr/5/21\');">2Cr 5:21__EN';
