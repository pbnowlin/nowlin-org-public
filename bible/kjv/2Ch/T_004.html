var stringArray = new Array();
stringArray[1] = 'Moreover he made __PNan_altar_2__SHan altar</a> of brass, twenty cubits the length thereof, and twenty cubits the breadth thereof, and ten cubits the height thereof.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!__GHan_altar_2__PSan altar__EF2Ch/1/5\');">2Ch 1:5__NBExd/27/1\');">Exd 27:1-8__NB1Ki/8/22\');">1Ki 8:22__NR1Ki/8/64\');">64__NB1Ki/9/25\');">1Ki 9:25__NB2Ki/16/14\');">2Ki 16:14__NR2Ki/16/15\');">15__NBEze/43/13\');">Eze 43:13-17__EN';
stringArray[2] = 'Also he made __PNa_molten_sea_1__SHa molten sea</a> of ten cubits from __PNbrim_to_brim_2__SHbrim to brim</a>, round in compass, and five cubits the height thereof; and a line of thirty cubits did compass it round about.__CPa_molten_sea_1__PSa molten sea__FFExd/30/18\');">Exd 30:18-21__NB1Ki/7/23\');">1Ki 7:23__NBZec/13/1\');">Zec 13:1__NBTts/3/5\');">Tts 3:5__NBRev/7/14\');">Rev 7:14__AN__GHbrim_to_brim_2__PSbrim to brim__FEHeb. his brim to his brim.</TD></TR>';
stringArray[3] = '__PNAnd_under_1__SHAnd under</a> it [was] the similitude of __PNoxen_2__SHoxen</a>, which did compass it round about: ten in a cubit, compassing the sea round about. Two rows of oxen [were] cast, when it was cast.__CPAnd_under_1__PSAnd under__FF1Ki/7/24\');">1Ki 7:24-26__NBEze/1/10\');">Eze 1:10__NBEze/10/14\');">Eze 10:14__NB1Cr/9/9\');">1Cr 9:9__NR1Cr/9/10\');">10__NBRev/4/7\');">Rev 4:7__AN__GHoxen_2__PSoxen__FE"In the parallel passage of Kings, instead of bekarim, ""oxen,"" we have pekaïm, ""knops,"" in the form of colocynths. (See on __NA1Ki/6/18\');">1Ki 6:18__AN, and __NA2Ki/4/39\');">2Ki 4:39__AN;) which last is supposed by able critics to be the reading which ought to received be here; bekarim, ""oxen,"" being a mistake for pekaïm, ""knops."" Houbigant, however, contends that the words in both places are right; but that bakar does not signify an ox here, but a large kind of grape, according to its meaning in Arabic. But Dr. A. Clarke states that bakar, or bakarat, has no such meaning in Arabic, though the phrase aino \'lbikri, or ""ox-eye,"" signifies a species of black grape, very large, and of incredible sweetness; that consequently the criticism of this great man is not solid; and that the likeliest method of reconciling the two places is to suppose a change in the letters as above."</TD></TR>';
stringArray[4] = '__PNIt_stood_1__SHIt stood</a> upon twelve oxen, __PNthree_2__SHthree</a> looking toward the north, and three looking toward the west, and three looking toward the south, and three looking toward the east: and the sea [was set] above upon them, and all their hinder parts [were] inward.__CPIt_stood_1__PSIt stood__FFMat/16/18\');">Mat 16:18__NBEph/2/20\');">Eph 2:20__NBRev/21/14\');">Rev 21:14__AN__GHthree_2__PSthree__EFMat/28/19\');">Mat 28:19__NRMat/28/20\');">20__NBMar/16/15\');">Mar 16:15__NBLuk/24/46\');">Luk 24:46__NRLuk/24/47\');">47__NBAct/9/15\');">Act 9:15__EN';
stringArray[5] = 'And the thickness of it [was] an handbreadth, and the brim of it like the work of the brim of a cup, __PNwith_flowers_of_lilies_1__SHwith flowers of lilies</a>; [and] it received and held three thousand baths.__CPwith_flowers_of_lilies_1__PSwith flowers of lilies__EE"or, like a lily flower. three thousand baths. In the parallel passage, it is said to hold only two thousand baths; which some think may be reconciled by supposing that the quantity of water which was commonly in it was 2,000 baths, but that, if filled up to the top, it would hold 3,000. But, as we have already seen that the Babylonish cubit was less than that of the ancient Hebrews, it might be the same with measures of capacity; so that 2,000 of the ancient Jewish baths might have been equal to 3,000 of those used after the captivity. The Targum cuts the knot: ""It received 3,000 baths of dry measure, and held 2,000 of liquid measure."" See __NA1Ki/7/26\');">1Ki 7:26__AN. __NA1Ki/7/26\');">1Ki 7:26__AN"</TD></TR>';
