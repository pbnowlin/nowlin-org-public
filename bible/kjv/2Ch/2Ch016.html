Text[1] = 'In the six and thirtieth year of the reign of Asa Baasha king of Israel came up against Judah, and built Ramah, to the intent that he might let none go out or come in to Asa king of Judah.';
Text[2] = 'Then Asa brought out silver and gold out of the treasures of the house of the LORD and of the king\'s house, and sent to Benhadad king of Syria, that dwelt at Damascus, saying,';
