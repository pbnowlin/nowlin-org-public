stringArray[1] = 'Amaziah [was] __PNtwenty_and_five_2__SHtwenty and five</a> years old [when] he began to reign, and he reigned twenty and nine years in Jerusalem. And his mother\'s name [was] Jehoaddan of Jerusalem.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!__GHtwenty_and_five_2__PStwenty and five__EF2Ki/14/1\');">2Ki 14:1-3__EN';
stringArray[2] = 'And he did [that which was] right in the sight of the LORD, __PNbut_not_1__SHbut not</a> with a perfect heart.__CPbut_not_1__PSbut not__FF2Ch/25/14\');">2Ch 25:14__NB2Ch/24/2\');">2Ch 24:2__NB2Ch/26/4\');">2Ch 26:4__NB1Sa/16/7\');">1Sa 16:7__NB2Ki/14/4\');">2Ki 14:4__NBPsa/78/37\');">Psa 78:37__NBIsa/29/13\');">Isa 29:13__NBHsa/10/2\');">Hsa 10:2__NBAct/8/21\');">Act 8:21__NBJam/1/8\');">Jam 1:8__NBJam/4/8\');">Jam 4:8__EN';
stringArray[3] = '__PNNow_it_came_2__SHNow it came</a> to pass, when the kingdom was __PNestablished_to_him_3__SHestablished to him</a>, that he slew his servants that had killed the king his father.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3166. B.C. 838.__GHNow_it_came_2__PSNow it came__EF2Ki/14/5\');">2Ki 14:5-22__AN__GGestablished_to_him_3__PSestablished to him__EE"Heb. confirmed upon him. he slew. __NA2Ch/24/25\');">2Ch 24:25__NR2Ch/24/26\');">26__NBGen/9/5\');">Gen 9:5__NRGen/9/6\');">6__NBExd/21/14\');">Exd 21:14__NBNum/35/31\');">Num 35:31-33__AN; No doubt those wicked men, Jozachar and Jehozabad, who murdered his father, had considerable influence; and therefore he found it dangerous to bring them to justice, till he was assured of the loyalty of his other officers: when this was clear, he called them to an account, and justly put them to death for treason and murder; for, if even these conspirators against Joash intended to avenge upon him the death of Zechariah, they acted without a commission from that God ""to whom vengeance belongeth."""</TD></TR>';
stringArray[4] = 'But he slew not their children, but [did] __PNas_it_is_written_1__SHas [it is] written</a> in the law in the book of Moses, where the LORD commanded, saying, The fathers shall not die for the children, neither shall the children die for the fathers, but every man shall die for his own sin.__CPas_it_is_written_1__PSas it is written__FFDeu/24/16\');">Deu 24:16__NB2Ki/14/5\');">2Ki 14:5__NR2Ki/14/6\');">6__NBJer/31/29\');">Jer 31:29__NRJer/31/30\');">30__NBEze/18/4\');">Eze 18:4__NREze/18/20\');">20__EN';
stringArray[5] = 'Moreover Amaziah gathered Judah together, and made them __PNcaptains_over_thousands_2__SHcaptains over thousands</a>, and captains over hundreds, according to the houses of [their] fathers, throughout all Judah and Benjamin: and he numbered them __PNfrom_twenty_3__SHfrom twenty</a> years old and above, and found them __PNthree_4__SHthree</a> hundred thousand choice [men, able] to go forth to war, that could handle spear and shield.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3177. B.C. 827.__GHcaptains_over_thousands_2__PScaptains over thousands__EFExd/18/25\');">Exd 18:25__NB1Sa/8/12\');">1Sa 8:12__NB1Ch/13/1\');">1Ch 13:1__NB1Ch/27/1\');">1Ch 27:1__AN__GGfrom_twenty_3__PSfrom twenty__FFNum/1/3\');">Num 1:3__AN__GHthree_4__PSthree__EF2Ch/11/1\');">2Ch 11:1__NB2Ch/14/8\');">2Ch 14:8__NB2Ch/17/14\');">2Ch 17:14-18__EN';
stringArray[6] = 'He hired also an hundred thousand mighty men of valour out of Israel for __PNan_hundred_talents_of_silver_1__SHan hundred talents of silver</a>.__CPan_hundred_talents_of_silver_1__PSan hundred talents of silver__EEEstimating the shekel at 2s. 6d., and the talent, being 3,000 shekels, (see __NAExd/38/25\');">Ex 38:25__AN, __NAExd/38/26\');">26__AN,) at 375£., one hundred talents would amount to 37,500£.; which, divided among 100,000 men, quotes only 7s. 6d.; hence we may suppose, that this was only an earnest of their pay, or that they expected to be enriched by the plunder of the Edomites.</TD></TR>';
stringArray[7] = 'But there came __PNa_man_of_God_1__SHa man of God</a> to him, saying, O king, let not the army of Israel go with thee; __PNfor_the_LORD_2__SHfor the LORD</a> [is] not with Israel, [to wit, with] all the children of Ephraim.__CPa_man_of_God_1__PSa man of God__FF2Sa/12/1\');">2Sa 12:1__NB1Ki/13/1\');">1Ki 13:1__NB1Ti/6/11\');">1Ti 6:11__NB2Ti/3/17\');">2Ti 3:17__AN__GHfor_the_LORD_2__PSfor the LORD__EF2Ch/13/12\');">2Ch 13:12__NB2Ch/19/2\');">2Ch 19:2__NB1Ki/12/28\');">1Ki 12:28__NBIsa/28/1\');">Isa 28:1-3__NBHsa/5/13\');">Hsa 5:13-15__NBHsa/9/13\');">Hsa 9:13__EN';
stringArray[8] = 'But if thou wilt go, do [it], __PNbe_strong_1__SHbe strong</a> for the battle: God shall make thee fall before the enemy: for __PNGod_hath_power_2__SHGod hath power</a> to help, and to cast down.__CPbe_strong_1__PSbe strong__FF2Ch/18/14\');">2Ch 18:14__NBEcc/11/9\');">Ecc 11:9__NBIsa/8/9\');">Isa 8:9__NRIsa/8/10\');">10__NBJoe/3/9\');">Joe 3:9-14__NBMat/26/45\');">Mat 26:45__AN__GHGod_hath_power_2__PSGod hath power__EF2Ch/14/11\');">2Ch 14:11__NB2Ch/20/6\');">2Ch 20:6__NBJdg/7/7\');">Jdg 7:7__NB1Sa/14/6\');">1Sa 14:6__NBJob/5/18\');">Job 5:18__NBJob/9/13\');">Job 9:13__NBPsa/20/7\');">Psa 20:7__NBPsa/33/16\');">Psa 33:16-20__NBPsa/62/11\');">Psa 62:11__NBEcc/9/11\');">Ecc 9:11__EN';
stringArray[9] = 'And Amaziah said to the man of God, But what shall we do for the hundred talents which I have given to the __PNarmy_1__SHarmy</a> of Israel? And the man of God answered, __PNThe_LORD_2__SHThe LORD</a> is able to give thee much more than this.__CParmy_1__PSarmy__EEHeb. band. __NA2Ch/25/13\');">2Ch 25:13__AN__GHThe_LORD_2__PSThe LORD__EF2Ch/1/12\');">2Ch 1:12__NBDeu/8/18\');">Deu 8:18__NBPsa/24/1\');">Psa 24:1__NBPro/10/22\');">Pro 10:22__NBHag/2/8\');">Hag 2:8__NBLuk/18/29\');">Luk 18:29__NRLuk/18/30\');">30__NBPhl/4/19\');">Phl 4:19__EN';
stringArray[10] = 'Then __PNAmaziah_1__SHAmaziah</a> separated them, [to wit], the army that was come to him out of Ephraim, to go __PNhome_2__SHhome</a> again: wherefore their anger was greatly kindled against Judah, and they returned home in __PNgreat_anger_3__SHgreat anger</a>.__CPAmaziah_1__PSAmaziah__FF1Ki/12/24\');">1Ki 12:24__AN__GHhome_2__PShome__FEHeb. to their place__GGgreat_anger_3__PSgreat anger__EEHeb. heat of anger. __NA2Sa/19/43\');">2Sa 19:43__NBPro/29/22\');">Pro 29:22__EN';
stringArray[11] = 'And Amaziah strengthened himself, and led forth his people, and went to the __PNvalley_1__SHvalley</a> of salt, and smote of the children of Seir ten thousand.__CPvalley_1__PSvalley__FF2Sa/8/13\');">2Sa 8:13__NB2Ki/14/7\');">2Ki 14:7__NBPsa/60/1\');">Psa 60:1__AN; *title</TD></TR>';
stringArray[12] = '__PNAnd_other_ten_thousand_1__SHAnd [other] ten thousand</a> [left] alive did the children of Judah carry away captive, and brought them unto the top of the rock, and __PNcast_them_2__SHcast them</a> down from the top of the rock, that they all were __PNbroken_in_pieces_3__SHbroken in pieces</a>.__CPAnd_other_ten_thousand_1__PSAnd other ten thousand__EENo intimation is given on what account, or on what provocation, this most cruel conduct towards the prisoners of war was adopted. The enmity between Israel and Edom seems to have been reciprocal and deeply malignant. The victorious king and his army considered every individual of Edom as a traitor and rebel; and so adjudged them to death, and acted on this judgment. But their conduct was wholly inexcusable, and could only perpetuate rancour to future generations, and provoke the surviving Edomites to cruel retaliations, whenever they had it in their power.__GHcast_them_2__PScast them__EF2Sa/12/31\');">2Sa 12:31__NB1Ch/20/3\');">1Ch 20:3__AN__GGbroken_in_pieces_3__PSbroken in pieces__FF2Ch/20/10\');">2Ch 20:10__NB2Ch/21/8\');">2Ch 21:8-10__EN';
stringArray[13] = 'But the __PNsoldiers_of_the_army_1__SHsoldiers of the army</a> which Amaziah sent back, that they should not go with him to battle, __PNfell_upon_the_cities_2__SHfell upon the cities</a> of Judah, from __PNSamaria_3__SHSamaria</a> even unto __PNBeth_horon_4__SHBethhoron</a>, and smote three thousand of them, and took much spoil.__CPsoldiers_of_the_army_1__PSsoldiers of the army__EEHeb. sons of the band. __NA2Ch/25/9\');">2Ch 25:9__AN__GHfell_upon_the_cities_2__PSfell upon the cities__FEThese Israelites seem to have returned home, when discharged by Amaziah, whose powerful army deterred them from attempting revenge at that time; but when he was engaged in war with the Edomites, they marched from Samaria, and plundered all the cities till they came to Beth-horon, where they slew 3,000 of the inhabitants.__GGSamaria_3__PSSamaria__FF1Ki/16/24\');">1Ki 16:24__NR1Ki/16/29\');">29__AN__GHBeth_horon_4__PSBeth-horon__EF2Ch/8/5\');">2Ch 8:5__NB1Ki/9/17\');">1Ki 9:17__EN';
stringArray[14] = 'Now it came to pass, after that Amaziah was come from the slaughter of the Edomites, that __PNhe_brought_1__SHhe brought</a> the gods of the children of Seir, and set them up [to be] __PNhis_gods_2__SHhis gods</a>, and bowed down himself before them, and burned incense unto them.__CPhe_brought_1__PShe brought__FF2Ch/28/23\');">2Ch 28:23__NBIsa/44/19\');">Isa 44:19__AN__GHhis_gods_2__PShis gods__EFExd/20/3\');">Exd 20:3-5__NBDeu/7/5\');">Deu 7:5__NRDeu/7/25\');">25__NB2Sa/5/21\');">2Sa 5:21__EN';
stringArray[15] = 'Wherefore the anger of the LORD was kindled against Amaziah, and he sent unto him __PNa_prophet_1__SHa prophet</a>, which said unto him, __PNWhy_hast_thou_sought_2__SHWhy hast thou sought</a> after __PNthe_gods_3__SHthe gods</a> of the people, __PNwhich_could_4__SHwhich could</a> not deliver their own people out of thine hand?__CPa_prophet_1__PSa prophet__FF2Ch/25/7\');">2Ch 25:7__NB2Ch/16/7\');">2Ch 16:7-9__NB2Ch/19/2\');">2Ch 19:2__NB2Ch/20/37\');">2Ch 20:37__NB2Sa/12/1\');">2Sa 12:1-6__AN__GHWhy_hast_thou_sought_2__PSWhy hast thou sought__EF2Ch/24/20\');">2Ch 24:20__NBJdg/2/2\');">Jdg 2:2__NBJer/2/5\');">Jer 2:5__AN__GGthe_gods_3__PSthe gods__FFPsa/96/5\');">Psa 96:5__AN__GHwhich_could_4__PSwhich could__EF2Ch/25/11\');">2Ch 25:11__NR2Ch/25/12\');">12__NBPsa/115/4\');">Psa 115:4-8__NBIsa/44/9\');">Isa 44:9__NRIsa/44/10\');">10__NBIsa/46/1\');">Isa 46:1__NRIsa/46/2\');">2__NBJer/10/7\');">Jer 10:7__NB1Cr/8/4\');">1Cr 8:4__NB1Cr/10/20\');">1Cr 10:20__EN';
stringArray[16] = 'And it came to pass, as he talked with him, that [the king] said unto him, __PNArt_thou_made_1__SHArt thou made</a> of the king\'s counsel? __PNforbear_2__SHforbear</a>; why shouldest thou be smitten? Then the prophet forbare, and said, I know that God hath __PNdetermined_3__SHdetermined</a> to destroy thee, because thou hast done this, and hast not hearkened unto my counsel.__CPArt_thou_made_1__PSArt thou made__FF2Ch/16/10\');">2Ch 16:10__NB2Ch/18/25\');">2Ch 18:25__NB2Ch/24/21\');">2Ch 24:21__NBAmo/7/10\');">Amo 7:10-13__NBMat/21/23\');">Mat 21:23__AN__GHforbear_2__PSforbear__EFPro/9/7\');">Pro 9:7__NRPro/9/8\');">8__NBIsa/30/10\');">Isa 30:10__NRIsa/30/11\');">11__NBJer/29/26\');">Jer 29:26__NB2Ti/4/3\');">2Ti 4:3__NBRev/11/10\');">Rev 11:10__AN__GGdetermined_3__PSdetermined__EEHeb. counselled. __NA2Ch/18/20\');">2Ch 18:20__NR2Ch/18/21\');">21__NBExd/9/16\');">Exd 9:16__NBDeu/2/30\');">Deu 2:30__NB1Sa/2/25\');">1Sa 2:25__NBIsa/46/10\');">Isa 46:10__NBAct/4/28\');">Act 4:28__NBRom/9/22\');">Rom 9:22__NBEph/1/11\');">Eph 1:11__EN';
stringArray[17] = 'Then __PNAmaziah_2__SHAmaziah</a> king of Judah took advice, and sent to Joash, the son of Jehoahaz, the son of Jehu, king of Israel, saying, Come, __PNlet_us_see_3__SHlet us see</a> one another in the face.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3178. B.C. 826.__GHAmaziah_2__PSAmaziah__EF2Ch/25/13\');">2Ch 25:13__NB2Ki/14/8\');">2Ki 14:8-14__AN__GGlet_us_see_3__PSlet us see__FF2Sa/2/14\');">2Sa 2:14__NBPro/20/3\');">Pro 20:3__EN';
stringArray[18] = 'And Joash king of Israel sent to Amaziah king of Judah, saying, The __PNthistle_1__SHthistle</a> that [was] in Lebanon sent to the cedar that [was] in Lebanon, saying, Give thy daughter to my son to wife: and there passed by __PNa_wild_beast_2__SHa wild beast</a> that [was] in Lebanon, and trode down the thistle.__CPthistle_1__PSthistle__EEor, furze-bush, or thorn. __NAJdg/9/8\');">Jdg 9:8-15__NB1Ki/4/33\');">1Ki 4:33__AN__GHa_wild_beast_2__PSa wild beast__FEHeb. a beast of the field. __NAPsa/80/13\');">Psa 80:13__EN';
stringArray[19] = 'Thou sayest, Lo, thou hast smitten the Edomites; and thine __PNheart_1__SHheart</a> lifteth thee up __PNto_boast_2__SHto boast</a>: abide now at home; __PNwhy_shouldest_3__SHwhy shouldest</a> thou meddle to [thine] hurt, that thou shouldest fall, [even] thou, and Judah with thee?__CPheart_1__PSheart__FF2Ch/26/16\');">2Ch 26:16__NB2Ch/32/25\');">2Ch 32:25__NBDeu/8/14\');">Deu 8:14__NBPro/13/10\');">Pro 13:10__NBPro/16/18\');">Pro 16:18__NBPro/28/25\');">Pro 28:25__NBDan/5/20\');">Dan 5:20-23__NBHab/2/4\');">Hab 2:4__NBJam/4/6\');">Jam 4:6__NB1Pe/5/5\');">1Pe 5:5__AN__GHto_boast_2__PSto boast__EFJer/9/23\');">Jer 9:23__NB1Cr/1/29\');">1Cr 1:29__AN__GGwhy_shouldest_3__PSwhy shouldest__FF2Ch/35/21\');">2Ch 35:21__NBPro/18/6\');">Pro 18:6__NBPro/20/3\');">Pro 20:3__NBPro/26/17\');">Pro 26:17__NBLuk/14/31\');">Luk 14:31__EN';
stringArray[20] = 'But Amaziah would not hear; for __PNit_came_of_God_1__SHit [came] of God</a>, that he might deliver them into the hand [of their enemies], because they __PNsought_2__SHsought</a> after the gods of Edom.__CPit_came_of_God_1__PSit came of God__FF2Ch/25/16\');">2Ch 25:16__NB2Ch/22/7\');">2Ch 22:7__NB1Ki/12/15\');">1Ki 12:15__NBPsa/81/11\');">Psa 81:11__NRPsa/81/12\');">12__NBAct/28/25\');">Act 28:25-27__NB2Th/2/9\');">2Th 2:9-11__NB1Pe/2/8\');">1Pe 2:8__AN__GHsought_2__PSsought__EF2Ch/25/14\');">2Ch 25:14__EN';
stringArray[21] = 'So Joash the king of Israel went up; and __PNthey_saw_one_another_1__SHthey saw one another</a> in the face, [both] he and Amaziah king of Judah, at __PNBeth_shemesh_2__SHBethshemesh</a>, which [belongeth] to Judah.__CPthey_saw_one_another_1__PSthey saw one another__EE"That is, ""they fought against each other."" To face an enemy, or to face one another, is still a common expression. The reason of this war was evidently the injury the army of Joash had done to the unoffending inhabitants of Judah. The ravages committed by them were totally unprovoked, base, and cowardly: they fell upon women, old men, and children, and butchered them in cold blood, when all the effective men were gone with their king against the Edomites. The quarrel of Amaziah were certainly just, yet he was put to the rout: he fell, and Judah with him, as Joash had said; and the reason was, because ""it came of God, that he might deliver them into the hands of their enemies, because they sought after the gods of Edom."" This was the reason why the Israelites triumphed. __NA2Ch/25/17\');">2Ch 25:17__AN"__GHBeth_shemesh_2__PSBeth-shemesh__EFJos/21/16\');">Jos 21:16__NB1Sa/6/9\');">1Sa 6:9__NR1Sa/6/19\');">19__NR1Sa/6/20\');">20__EN';
stringArray[22] = 'And Judah was __PNput_to_the_worse_1__SHput to the worse</a> before Israel, and they __PNfled_2__SHfled</a> every man to his tent.__CPput_to_the_worse_1__PSput to the worse__EEHeb. smitten. __NA2Ch/28/5\');">2Ch 28:5__NR2Ch/28/6\');">6__AN__GHfled_2__PSfled__EF1Sa/4/10\');">1Sa 4:10__NB1Ki/22/36\');">1Ki 22:36__EN';
stringArray[23] = 'And Joash the king of Israel __PNtook_Amaziah_1__SHtook Amaziah</a> king of Judah, the son of Joash, the son of __PNJehoahaz_2__SHJehoahaz</a>, at Bethshemesh, and brought him to Jerusalem, and brake down the wall of Jerusalem from the __PNgate_of_Ephraim_3__SHgate of Ephraim</a> to the __PNcorner_gate_4__SHcorner gate</a>, four hundred cubits.__CPtook_Amaziah_1__PStook Amaziah__FF2Ch/33/11\');">2Ch 33:11__NB2Ch/36/6\');">2Ch 36:6__NR2Ch/36/10\');">10__NBPro/16/18\');">Pro 16:18__NBPro/29/23\');">Pro 29:23__NBDan/4/37\');">Dan 4:37__NBOba/1/3\');">Oba 1:3__NBLuk/14/11\');">Luk 14:11__AN__GHJehoahaz_2__PSJehoahaz__EF2Ch/21/17\');">2Ch 21:17__NB2Ch/22/1\');">2Ch 22:1__AN; Ahaziah. __NA2Ch/22/6\');">2Ch 22:6__AN; Azariah__GGgate_of_Ephraim_3__PSgate of Ephraim__FFNeh/8/16\');">Neh 8:16__NBNeh/12/39\');">Neh 12:39__AN__GHcorner_gate_4__PScorner gate__FEHeb. the gate of it that looketh. __NA2Ch/26/9\');">2Ch 26:9__NBJer/31/38\');">Jer 31:38__EN';
stringArray[24] = 'And [he took] __PNall_the_gold_1__SHall the gold</a> and the silver, and all the vessels that were found in the house of God with Obededom, and the treasures of the king\'s house, __PNthe_hostages_also_2__SHthe hostages also</a>, and returned to Samaria.__CPall_the_gold_1__PSall the gold__FF2Ch/12/9\');">2Ch 12:9__NB2Ki/14/14\');">2Ki 14:14__AN__GHthe_hostages_also_2__PSthe hostages also__FEIt is probable that these hostages were given in order that Amaziah might regain his liberty.</TD></TR>';
stringArray[25] = 'And Amaziah the son of __PNJoash_2__SHJoash</a> king of Judah lived after the death of Joash son of Jehoahaz king of Israel fifteen years.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3179-3194. B.C. 825-810.__GHJoash_2__PSJoash__EF2Ki/14/17\');">2Ki 14:17-22__AN; Jehoash</TD></TR>';
stringArray[26] = 'Now the __PNrest_of_the_acts_1__SHrest of the acts</a> of Amaziah, first and last, behold, [are] they not written in the book of the kings of Judah and Israel?__CPrest_of_the_acts_1__PSrest of the acts__FF2Ch/20/34\');">2Ch 20:34__NB2Ki/14/15\');">2Ki 14:15__EN';

stringArray[28] = 'And they brought him upon horses, and buried him with his fathers in __PNthe_city_of_Judah_1__SHthe city of Judah</a>.__CPthe_city_of_Judah_1__PSthe city of Judah__EEthat is, the city of David, as it is. __NA2Ki/14/20\');">2Ki 14:20__EN';
