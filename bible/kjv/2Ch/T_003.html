stringArray[3] = 'Now these [are the things wherein] __PNSolomon_2__SHSolomon</a> was __PNinstructed_3__SHinstructed</a> for the building of the house of God. __PNThe_length_4__SHThe length</a> by cubits after __PNthe_first_measure_5__SHthe first measure</a> [was] threescore cubits, and the breadth twenty cubits.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2993-3000. B.C. 1011-1004.__GHSolomon_2__PSSolomon__EF1Ch/28/11\');">1Ch 28:11-19__AN__GGinstructed_3__PSinstructed__EEHeb. founded__GHThe_length_4__PSThe length__EF1Ki/6/2\');">1Ki 6:2__NR1Ki/6/3\');">3__AN__GGthe_first_measure_5__PSthe first measure__EEIt is supposed, with much probability, that the first measure means the cubit used in the time of Moses, contradistinguished from that used in Babylon, and which the Israelites used after their return from captivity: and, as these Books were written after the captivity, it was necessary for the writer to make this remark, lest it should be thought that the measurement was by the Babylonish cubit, which was a palm or one-sixth shorter than the cubit of Moses; which may serve to reconcile some variations in the historical books, with respect to numbers when applied to measures.</TD></TR>';
