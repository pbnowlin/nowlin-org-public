stringArray[9] = 'And __PNshe_gave_1__SHshe gave</a> the king an hundred and twenty talents of gold, and __PNof_spices_2__SHof spices</a> great abundance, and precious stones: neither was there any such spice as the queen of __PNSheba_3__SHSheba</a> gave king Solomon.__CPshe_gave_1__PSshe gave__FF2Ch/9/24\');">2Ch 9:24__NB1Ki/9/14\');">1Ki 9:14__NB1Ki/10/10\');">1Ki 10:10__NBPsa/72/10\');">Psa 72:10__NRPsa/72/15\');">15__AN__GHof_spices_2__PSof spices__EF2Ch/9/1\');">2Ch 9:1__NBGen/43/11\');">Gen 43:11__NBExd/30/34\');">Exd 30:34__AN__GGSheba_3__PSSheba__EEThis queen is called Balkis by the Arabians, who say she came from the city of Sheba, also called Mareb, in Yemen or Arabia Felix; but the Ethiopians call her Maqueda, claim her as their sovereign, and say that her posterity reigned there for a long time. Mr. Bruce has given us the history of her and her descendants from Abyssinian records; and Josephus says that Sheba was the ancient name of the city of Meroë, (south of Egypt, and sometimes comprehended in Ethiopia,) and that this princess came from thence. Those who think the princess came from Arabia, rely chiefly on the fact that gold, silver, spices, and precious stones, which were the presents she made to Solomon, are the natural products of that country; and that it may well be placed at the uttermost part of the earth, as it borders on the southern ocean, and formerly they knew no land beyond it.</TD></TR>';

stringArray[21] = 'For the king\'s ships went to __PNTarshish_1__SHTarshish</a> with the servants of Huram: every three years once came the ships of Tarshish bringing gold, and silver, __PNivory_2__SHivory</a>, and apes, and peacocks.__CPTarshish_1__PSTarshish__EEBochart thinks this Tarshish was probably the promontory Cory, on the north of the island of Ceylon, which, according to him, was the land of Ophir. That it was name of a place in the East Indies, seems probable from the articles brought thence, and also from the ships sent thither being built at Ezion-geber, on the Red Sea; though Michaelis supposes that the fleet coasted along the shore of Africa, doubling the Cape of Good Hope, and came to Tartessus, in Spain, and thence back again the same way; that this accounts for their three years\' voyage out and home; and that Spain and the coasts of Africa furnish all the commodities which they brought back. __NA1Ki/10/22\');">1Ki 10:22__NB1Ki/22/48\');">1Ki 22:48__AN; Tharshish__GHivory_2__PSivory__FE"or, elephants\' teeth. peacocks. Tukkeeyim is rendered taysin in the Targum, [taonon] in the Alexandrian MS. of the LXX., and pavos, ""peacocks,"" in the Vulgate; with which the Syriac, Arabic, and Rabbins agree. This derives confirmation from the fact, that the peacock is called in Malabaric, Togei. __NAJob/39/13\');">Job 39:13__AN"</TD></TR>';

stringArray[28] = 'And they __PNbrought_1__SHbrought</a> unto Solomon horses out of Egypt, and out of all lands.__CPbrought_1__PSbrought__EE"""Moses,"" says Bp. Warburton, ""had expressly prohibited the multiplying of horses, (__NADeu/17/16\');">Deu 17:16__AN;) by which the future king was forbidden to establish a body of calvary, because this could not be effected without sending into Egypt, with which people God had forbidden any communication, as this would be dangerous to religion. When Solomon had violated this law, and multiplied horses to excess, (__NA1Ki/4/26\');">1Ki 4:26__AN,) it was soon attended with those fatal consequences that the law foretold: for this wisest of kings having likewise, in violation of another law, married Pharaoh\'s daughter, (the early fruits of this commerce,) and then, by a repetition of the same crime, but a transgression of another law, had espoused more strange women, (__NA1Ki/4/26\');">1Ki 4:26__NB1Ki/11/1\');">11:1__AN,) they first,in defiance of a fourth law, persuaded him to build them idol temples for their use; and afterwards, against a fifth law, brought him to erect other temples for his own."" __NA2Ch/9/25\');">2Ch 9:25__NB2Ch/1/16\');">2Ch 1:16__NB1Ki/10/28\');">1Ki 10:28__NBIsa/2/7\');">Isa 2:7__NRIsa/2/8\');">8__NBIsa/31/1\');">Isa 31:1__AN"</TD></TR>';
