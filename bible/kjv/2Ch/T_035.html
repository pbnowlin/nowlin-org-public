stringArray[1] = 'Moreover __PNJosiah_1__SHJosiah</a> kept a passover unto the LORD in Jerusalem: and they killed the passover on __PNthe_fourteenth_2__SHthe fourteenth</a> [day] of the first month.__CPJosiah_1__PSJosiah__EEThe whole solemnity was performed with great exactness according to the law, and upon that account there was none like it since Samuel\'s time; for even in Hezekiah\'s passover there were several irregularities. Bp. Patrick observes, that in this also it exceeded the other passovers which preceding things had kept, that though Josiah was by no means so rich as David, or Solomon, or Jehoshaphat, yet he furnished the congregation with beasts for sacrifice, both paschal and eucharistical, at his own proper cost and charge, which was more than any king ever did before. __NA2Ch/30/1\');">2Ch 30:1-27__NB2Ki/23/21\');">2Ki 23:21-23__AN__GHthe_fourteenth_2__PSthe fourteenth__EFExd/12/6\');">Exd 12:6__NBNum/9/3\');">Num 9:3__NBDeu/16/1\');">Deu 16:1-8__NBEzr/6/19\');">Ezr 6:19__NBEze/45/21\');">Eze 45:21__AN; Josiah\'s solemnization of the passover, which is merely alluded to at __NA2Ki/23/21\');">2Ki 23:21__AN, is very particularly related her, while the destruction of idolatry is largely related in the Kings, and here only touched upon. The feasts of the Lord God, appointed by the ceremonial law, were very numerous; but the passover was the chief. It was the first which was solemnized in the night wherein Israel came out of Egypt, and ushered in those which were afterwards instituted: and it was the last great feast which was held in the night wherein Christ was betrayed, before the vail of the temple was rent in twain. Be means of this feast, both Josiah and Hezekiah revived religion in their day.</TD></TR>';
stringArray[2] = 'And he set the priests in their __PNcharges_1__SHcharges</a>, and __PNencouraged_2__SHencouraged</a> them to the service of the house of the LORD,__CPcharges_1__PScharges__FF2Ch/23/8\');">2Ch 23:8__NR2Ch/23/18\');">18__NB2Ch/31/2\');">2Ch 31:2__NBNum/18/5\');">Num 18:5-7__NB1Ch/24/1\');">1Ch 24:1-31__NBEzr/6/18\');">Ezr 6:18__AN__GHencouraged_2__PSencouraged__EF2Ch/29/5\');">2Ch 29:5-11__NB2Ch/31/2\');">2Ch 31:2__NB1Ch/22/19\');">1Ch 22:19__EN';

stringArray[4] = 'And prepare [yourselves] by __PNthe_houses_1__SHthe houses</a> of your fathers, __PNafter_your_courses_2__SHafter your courses</a>, according to the writing of David king of Israel, __PNand_according_3__SHand according</a> to the writing of Solomon his son.__CPthe_houses_1__PSthe houses__FF1Ch/9/10\');">1Ch 9:10-34__NBNeh/11/10\');">Neh 11:10-20__AN__GHafter_your_courses_2__PSafter your courses__FE"The regulations formed by David, and established by Solomon, concerning the courses of the priests and Levites, were committed to writing, and preserved, for them to refer to continually. Josiah, as well as Hezekiah, required the priests and Levites to attend to their several duties, and encouraged them therein, but he neither added, altered, not retrenched anything: he merely enforced what had been established in the law, and in the regulations made by David and the contemporary prophets: ""the commandment of the king....was by the word of the LORD."" __NA1Ch/23/\');">1Ch 23-26__AN"__GGand_according_3__PSand according__FF2Ch/8/14\');">2Ch 8:14__EN';

stringArray[12] = 'And they removed the burnt offerings, that they might give according to the divisions of the families of the people, to offer unto the LORD, __PNas_it_is_written_1__SHas [it is] written</a> in the book of Moses. And so [did they] with the oxen.__CPas_it_is_written_1__PSas it is written__FFLev/3/3\');">Lev 3:3__NRLev/3/5\');">5__NRLev/3/9\');">9-11__NRLev/3/14\');">14-16__EN';

stringArray[15] = 'And the singers the sons of Asaph [were] in their __PNplace_1__SHplace</a>, __PNaccording_2__SHaccording</a> to the commandment of David, and Asaph, and Heman, and Jeduthun the king\'s seer; and __PNthe_porters_3__SHthe porters</a> [waited] at every gate; they might not depart from their service; for their brethren the Levites prepared for them.__CPplace_1__PSplace__EEHeb. station__GHaccording_2__PSaccording__EF2Ch/29/25\');">2Ch 29:25__NR2Ch/29/26\');">26__NB1Ch/16/41\');">1Ch 16:41__NR1Ch/16/42\');">42__NB1Ch/23/5\');">1Ch 23:5__NB1Ch/25/1\');">1Ch 25:1-7__NBPsa/77/1\');">Psa 77:1__NBPsa/78/1\');">Psa 78:1__NBPsa/79/1\');">Psa 79:1__AN; *titles__GGthe_porters_3__PSthe porters__FF1Ch/9/17\');">1Ch 9:17-19__NB1Ch/26/14\');">1Ch 26:14-19__EN';
stringArray[16] = 'So all the service of the LORD was prepared the same day, to keep the passover, and to offer burnt offerings upon the altar of the LORD, according to the commandment of king Josiah.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[17] = 'And the children of Israel that were __PNpresent_1__SHpresent</a> kept the passover at that time, and __PNthe_feast_2__SHthe feast</a> of unleavened bread seven days.__CPpresent_1__PSpresent__EEHeb. found__GHthe_feast_2__PSthe feast__EF2Ch/30/21\');">2Ch 30:21-23__NBExd/12/15\');">Exd 12:15-20__NBExd/13/6\');">Exd 13:6__NRExd/13/7\');">7__NBExd/23/15\');">Exd 23:15__NBExd/34/18\');">Exd 34:18__NBLev/23/5\');">Lev 23:5-8__NBNum/28/16\');">Num 28:16-25__NBDeu/16/3\');">Deu 16:3__NRDeu/16/4\');">4__NRDeu/16/8\');">8__NB1Cr/5/7\');">1Cr 5:7__NR1Cr/5/8\');">8__EN';
stringArray[18] = 'And __PNthere_was_no_passover_1__SHthere was no passover</a> like to that kept in Israel from the days of Samuel the prophet; __PNneither_did_2__SHneither did</a> all the kings of Israel keep such a passover as Josiah kept, and the priests, and the Levites, and all Judah and Israel that were present, and the inhabitants of Jerusalem.__CPthere_was_no_passover_1__PSthere was no passover__EENot one on purer principles, more heartily joined in by the people present, more literally or exactly consecrated, according to the law, or more religiously observed. The words do not refer to the number present, but to the manner and spirit. __NA2Ch/30/5\');">2Ch 30:5__NB2Ki/23/21\');">2Ki 23:21-23__AN__GHneither_did_2__PSneither did__EF2Ch/30/26\');">2Ch 30:26__NR2Ch/30/27\');">27__EN';
stringArray[19] = 'In the eighteenth year of the reign of Josiah was this passover kept.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[20] = 'After all this, when Josiah had prepared the __PNtemple_2__SHtemple</a>, __PNNecho_3__SHNecho</a> king of Egypt came up to fight against __PNCarchemish_4__SHCarchemish</a> by Euphrates: and Josiah went out against him.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3394. B.C. 610.__GHtemple_2__PStemple__FEHeb. house__GGNecho_3__PSNecho__EEPharaoh, the lame, says the Targumist. __NA2Ki/23/29\');">2Ki 23:29__NR2Ki/23/30\');">30__AN; Pharaoh-necho. __NAJer/46/2\');">Jer 46:2-12__AN__GHCarchemish_4__PSCarchemish__EFIsa/10/9\');">Isa 10:9__EN';
stringArray[21] = 'But he sent ambassadors to him, saying, __PNWhat_1__SHWhat</a> have I to do with thee, thou king of Judah? [I come] not against thee this day, but against the __PNhouse_wherewith_I_have_war_2__SHhouse wherewith I have war</a>: for __PNGod_3__SHGod</a> commanded me to make haste: __PNforbear_thee_4__SHforbear thee</a> from [meddling with] God, who [is] with me, that he destroy thee not.__CPWhat_1__PSWhat__FF2Sa/16/10\');">2Sa 16:10__NBMat/8/29\');">Mat 8:29__NBJhn/2/4\');">Jhn 2:4__AN__GHhouse_wherewith_I_have_war_2__PShouse wherewith I have war__FEHeb. house of my war__GGGod_3__PSGod__FF2Ki/18/25\');">2Ki 18:25__NBIsa/36/10\');">Isa 36:10__AN__GHforbear_thee_4__PSforbear thee__EF2Ch/25/19\');">2Ch 25:19__EN';
stringArray[22] = '__PNNevertheless_1__SHNevertheless</a> Josiah would not turn his face from him, __PNbut_disguised_2__SHbut disguised</a> himself, that he might fight with him, and hearkened not unto the words of Necho from __PNthe_mouth_3__SHthe mouth</a> of God, and came to fight in the valley of __PNMegiddo_4__SHMegiddo</a>.__CPNevertheless_1__PSNevertheless__EE"Josiah\'s conduct in this affair has been treated with great severity; and he has been charged with engaging rashly in an unjust war, and disregarding the express command of God. But Scripture no where condemns him; and Pharaoh, in marching through Josiah\'s territories, against his will, certainly committed an act of hostility. It is evident that Josiah was in possession of the whole land of Israel (__NA2Ch/26/6\');">2Ch 26:6__AN); and probably he held the northern parts of it as a grant from the king of Babylon; and was not only in alliance with him, but bound to guard his frontiers against hostile invaders. He may, therefore, be fairly justified from the charge of unjustly meddling in a war that did not belong him. It is true the ambassadors assured Josiah, that ""God had commanded Pharaoh to make haste;"" and he is therefore said not to have ""hearkened to the words of Necho, from the mouth of God."" But Necho produced no proof that he was a prophet of Jehovah; and the word he employed, elohim, may denote gods or idols; and critics "__GHbut_disguised_2__PSbut disguised__EF2Ch/18/29\');">2Ch 18:29__NB1Ki/14/2\');">1Ki 14:2__NB1Ki/22/30\');">1Ki 22:30__NR1Ki/22/34\');">34__AN__GGthe_mouth_3__PSthe mouth__FF2Ch/35/21\');">2Ch 35:21__NB2Ch/18/4\');">2Ch 18:4-6__NBJos/9/14\');">Jos 9:14__AN__GHMegiddo_4__PSMegiddo__EFJdg/5/19\');">Jdg 5:19__NB2Ki/9/27\');">2Ki 9:27__NB2Ki/23/30\');">2Ki 23:30__NBZec/12/11\');">Zec 12:11__AN; Megiddon. __NARev/16/16\');">Rev 16:16__AN; Armageddon.</TD></TR>';

stringArray[24] = 'His servants therefore took him out of that chariot, and put him in __PNthe_second_1__SHthe second</a> chariot that he had; and __PNthey_2__SHthey</a> brought him to Jerusalem, and he __PNdied_3__SHdied</a>, and was buried __PNin_one_of_the_4__SHin [one of] the</a> sepulchres of his fathers. And all __PNJudah_5__SHJudah</a> and Jerusalem mourned for Josiah.__CPthe_second_1__PSthe second__FFGen/41/43\');">Gen 41:43__AN__GHthey_2__PSthey__EF2Ki/23/30\');">2Ki 23:30__AN__GGdied_3__PSdied__FFPsa/36/6\');">Psa 36:6__NBEcc/8/14\');">Ecc 8:14__NBEcc/9/1\');">Ecc 9:1__NREcc/9/2\');">2__AN__GHin_one_of_the_4__PSin one of the__FEor, among the. __NA2Ch/34/28\');">2Ch 34:28__AN__GGJudah_5__PSJudah__FFZec/12/11\');">Zec 12:11__EN';
