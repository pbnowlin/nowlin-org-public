stringArray[10] = 'And Zedekiah the son of Chenaanah had made him __PNhorns_of_iron_1__SHhorns of iron</a>, and said, __PNThus_2__SHThus</a> saith the LORD, With these thou shalt push Syria until __PNthey_be_consumed_3__SHthey be consumed</a>.__CPhorns_of_iron_1__PShorns of iron__EE"Mr. Bruce, in describing the head-dress of the governors of Abyssinia, says, ""A large broad fillet was bound upon their forehead, and tied behind their head: in the middle of this was a horn, or conical piece of silver, gilt, about four inches long, much in the shape of our common candle extinguishers. This is called kirn, [keren] and is only worn in reviews, or parades after victory."" Such, it may be supposed, were the horns of iron which Zedekiah (who appears to have acted the hero returning from a military triumph) made for himself, when he presumed, in the name of Jehovah, to flatter his prince with the promise of victory: ""Thus saith the LORD, With these thou shalt push Syria, until they be consumed."" __NAJer/27/2\');">Jer 27:2__NBJer/28/10\');">Jer 28:10-14__NBZec/1/18\');">Zec 1:18-21__NB2Ti/3/8\');">2Ti 3:8__AN"__GHThus_2__PSThus__EFJer/23/17\');">Jer 23:17__NRJer/23/21\');">21__NRJer/23/25\');">25__NRJer/23/31\');">31__NBJer/28/2\');">Jer 28:2__NRJer/28/3\');">3__NBJer/29/21\');">Jer 29:21__NBEze/13/7\');">Eze 13:7__NBEze/22/28\');">Eze 22:28__AN__GGthey_be_consumed_3__PSthey be consumed__EEHeb. thou consume them.</TD></TR>';

stringArray[24] = 'And Micaiah said, __PNBehold_1__SHBehold</a>, thou shalt see on that day when thou shalt go __PNinto_an_inner_chamber_2__SHinto an inner chamber</a> to hide thyself.__CPBehold_1__PSBehold__FFIsa/26/11\');">Isa 26:11__NBJer/28/16\');">Jer 28:16__NRJer/28/17\');">17__NBJer/29/21\');">Jer 29:21__NRJer/29/22\');">22__NRJer/29/32\');">32__AN__GHinto_an_inner_chamber_2__PSinto an inner chamber__FE"or, from chamber to chamber. Heb. into a chamber in a chamber. ""In one of the halls of the seraglio at Constantinople,"" says De La Motraye, ""the eunuch made us pass by several little chambers, with doors shut, like the cells of monks or nuns, as far as I could judge by one that another eunuch opened."" This exactly corresponds with the idea of a ""chamber within a chamber;"" and it would appear that Micaiah predicted that Zedekiah should fly for shelter to a Harem, which we have seen was deemed inviolate. (See on __NA1Sa/19/16\');">1Sa 19:16__AN.) __NA1Ki/20/30\');">1Ki 20:30__NBIsa/26/20\');">Isa 26:20__AN"</TD></TR>';

stringArray[33] = 'And __PNa_certain_man_1__SHa [certain] man</a> drew a bow __PNat_a_venture_2__SHat a venture</a>, and smote the king of Israel __PNbetween_the__etc__3__SHbetween the</a> joints of the harness: therefore he said to his chariot man, Turn thine hand, that thou mayest carry me out of the host; for I am __PNwounded_4__SHwounded</a>.__CPa_certain_man_1__PSa certain man__FF1Ki/22/34\');">1Ki 22:34__AN__GHat_a_venture_2__PSat a venture__FEHeb. in his simplicity. __NA2Sa/15/11\');">2Sa 15:11__AN__GGbetween_the__etc__3__PSbetween the, etc.__EEHeb. between the joints and between the breast plate. The shiryon, in Syriac, sheryono, seems to have covered both the back and breast of the warrior, and was consequently not properly a breast-plate, but a coat of mail or corslet. The corslet was made of flax or of wool woven very thick, of ox-hide, of brass, or of iron. The metallic corslet consisted not of solid piece, but of scales, hooks, or rings, connected like the links of a chain, that the warrior might move with greater ease. It was between the joints of this harness that Ahab received his mortal wound. __NA1Ki/22/34\');">1Ki 22:34__NR1Ki/22/35\');">35__AN__GHwounded_4__PSwounded__FEHeb. made sick. __NA2Ch/35/23\');">2Ch 35:23__EN';
