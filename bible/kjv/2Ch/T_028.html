stringArray[8] = 'And the children of Israel __PNcarried_1__SHcarried</a> away captive of their __PNbrethren_2__SHbrethren</a> two hundred thousand, women, sons, and daughters, and took also away much spoil from them, and brought the spoil to Samaria.__CPcarried_1__PScarried__FFDeu/28/25\');">Deu 28:25__NRDeu/28/41\');">41__AN__GHbrethren_2__PSbrethren__EF2Ch/11/4\');">2Ch 11:4__NBAct/7/26\');">Act 7:26__NBAct/13/26\');">Act 13:26__EN';
stringArray[9] = 'But a prophet of the LORD was there, whose name [was] Oded: and __PNhe_went_out_1__SHhe went out</a> before the host that came to Samaria, and said unto them, __PNBehold_2__SHBehold</a>, __PNbecause_the_LORD_God_3__SHbecause the LORD God</a> of your fathers was wroth with Judah, he hath delivered them into your hand, and ye have slain them in a rage [that] __PNreacheth_4__SHreacheth</a> up unto heaven.__CPhe_went_out_1__PShe went out__FF2Ch/19/1\');">2Ch 19:1__NR2Ch/19/2\');">2__NB2Ch/25/15\');">2Ch 25:15__NR2Ch/25/16\');">16__NB1Ki/20/13\');">1Ki 20:13__NR1Ki/20/22\');">22__NR1Ki/20/42\');">42__NB2Ki/20/14\');">2Ki 20:14__NR2Ki/20/15\');">15__AN__GHBehold_2__PSBehold__FETo this beautiful speech nothing can be added by the best comment: it is simple, humane, pious, and overwhelmingly convincing; and it is no wonder that it produced the effect here described. That there was much humanity, as well as firmness, in the heads of the children of Ephraim, who joined with the prophet of Jehovah on this occasion, their subsequent conduct, as detailed in the fifteenth verse, sufficiently proves. They did not barely dismiss these most unfortunate captives, but they took that very spoil which their victorious army had taken, and with clothed, shod, fed, and anointed these distressed people, set the feeblest of them upon asses, and escorted them safely to Jericho! We can scarcely find a parallel to this in the universal history of the wars which savage man has carried on against his fellows from the foundation of the world. The compliance also of the whole army, in leaving both the captives and spoil to the disposal of the princes, was really wonderful, and perhaps unparalleled in history__GGbecause_the_LORD_God_3__PSbecause the LORD God__FF2Ch/28/5\');">2Ch 28:5__NBJdg/3/8\');">Jdg 3:8__NBPsa/69/26\');">Psa 69:26__NBIsa/10/5\');">Isa 10:5-7__NBIsa/47/6\');">Isa 47:6__NBJer/15/17\');">Jer 15:17__NRJer/15/18\');">18__NBEze/25/12\');">Eze 25:12-17__NBEze/26/2\'); stringArray[20] = 'And __PNTilgath_pilneser_2__SHTilgathpilneser</a> king of Assyria came unto him, and __PNdistressed_him_3__SHdistressed him</a>, but strengthened him not.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3264. B.C. 740.__GHTilgath_pilneser_2__PSTilgath-pilneser__EF2Ki/15/29\');">2Ki 15:29__NB2Ki/16/7\');">2Ki 16:7-10__AN; Tiglath-pileser. __NA1Ch/5/26\');">1Ch 5:26__NBHsa/5/13\');">Hsa 5:13__AN__GGdistressed_him_3__PSdistressed him__FF2Ki/17/5\');">2Ki 17:5__NBIsa/7/20\');">Isa 7:20__NBIsa/30/3\');">Isa 30:3__NRIsa/30/16\');">16__NBJer/2/37\');">Jer 2:37__EN';
stringArray[21] = 'For Ahaz __PNtook_away_1__SHtook away</a> a portion [out] of the house of the LORD, and [out] of the house of the king, and of the princes, and gave [it] unto the king of Assyria: but he helped him not.__CPtook_away_1__PStook away__FF2Ch/12/9\');">2Ch 12:9__NB2Ki/18/15\');">2Ki 18:15__NR2Ki/18/16\');">16__NBPro/20/25\');">Pro 20:25__EN';
stringArray[22] = 'And __PNin_the_1__SHin the</a> time of his distress did he trespass yet more against the LORD: __PNthis_is_2__SHthis [is</a> that] king Ahaz.__CPin_the_1__PSin the__FF2Ch/33/12\');">2Ch 33:12__NBPsa/50/15\');">Psa 50:15__NBIsa/1/5\');">Isa 1:5__NBEze/21/13\');">Eze 21:13__NBHsa/5/15\');">Hsa 5:15__NBRev/16/9\');">Rev 16:9-11__AN__GHthis_is_2__PSthis is__EFEst/7/6\');">Est 7:6__NBPsa/52/7\');">Psa 52:7__EN';
stringArray[23] = '__PNFor_he_sacrificed_1__SHFor he sacrificed</a> unto the gods of __PNDamascus_2__SHDamascus</a>, which smote him: and he said, __PNBecause_the_gods_3__SHBecause the gods</a> of the kings of Syria help them, [therefore] will I __PNsacrifice_to_them_4__SHsacrifice to them</a>, that they may help me. __PNBut_they_were_5__SHBut they were</a> the ruin of him, and of all Israel.__CPFor_he_sacrificed_1__PSFor he sacrificed__EE"This passage, says Mr. Hallet, greatly surprised me; for the sacred historian is here represented as saying, ""The gods of Damascus had smitten Ahaz."" But it is impossible to suppose that an inspired author should say this; for the Scripture every where represents the heathen idols as nothing and vanity, and as incapable of doing either good or hurt. All difficulty is avoided if we follow the old Hebrew copies, from which the Greek translation was made: ""And king Ahaz said, I will seek to the gods of Damascus which have smitten me."" __NA2Ch/25/14\');">2Ch 25:14__NB2Ki/16/12\');">2Ki 16:12__NR2Ki/16/13\');">13__AN"__GHDamascus_2__PSDamascus__FEHeb. Darmesek__GGBecause_the_gods_3__PSBecause the gods__FFHab/1/11\');">Hab 1:11__AN__GHsacrifice_to_them_4__PSsacrifice to them__EFJer/10/5\');">Jer 10:5__NBJer/44/15\');">Jer 44:15-18__AN__GGBut_they_were_5__PSBut they were__FFIsa/1/28\');">Isa 1:28__NBJer/44/20\');">Jer 44:20-28__NBHsa/13/9\');">Hsa 13:9__EN';
stringArray[24] = 'And Ahaz gathered together the vessels of the house of God, and __PNcut_in_pieces_1__SHcut in pieces</a> the vessels of the house of God, and __PNshut_up_2__SHshut up</a> the doors of the house of the LORD, and __PNhe_made_3__SHhe made</a> him altars in every corner of Jerusalem.__CPcut_in_pieces_1__PScut in pieces__FF2Ki/16/17\');">2Ki 16:17__NR2Ki/16/18\');">18__NB2Ki/25/13\');">2Ki 25:13-17__AN__GHshut_up_2__PSshut up__EF2Ch/29/3\');">2Ch 29:3__NR2Ch/29/7\');">7__AN__GGhe_made_3__PShe made__FF2Ch/33/3\');">2Ch 33:3-5__NBJer/2/28\');">Jer 2:28__NBHsa/12/11\');">Hsa 12:11__NBAct/17/16\');">Act 17:16__NRAct/17/23\');">23__EN';
stringArray[25] = 'And in every several city of Judah he made high places to __PNburn_1__SHburn</a> incense unto other gods, and provoked to anger the LORD God of his fathers.__CPburn_1__PSburn__EEor, offer. __NA2Ch/28/3\');">2Ch 28:3__AN; *marg:</TD></TR>';
stringArray[26] = 'Now __PNthe_rest_1__SHthe rest</a> of his acts and of all his ways, first and last, behold, they [are] written in the book of the kings of Judah and Israel.__CPthe_rest_1__PSthe rest__FF2Ch/20/34\');">2Ch 20:34__NB2Ch/27/7\');">2Ch 27:7-9__NB2Ki/16/19\');">2Ki 16:19__NR2Ki/16/20\');">20__EN';
stringArray[27] = 'And Ahaz slept with his fathers, and they buried him in the city, [even] in Jerusalem: but __PNthey_brought_2__SHthey brought</a> him not into the sepulchres of __PNthe_kings_of_Israel_3__SHthe kings of Israel</a>: and Hezekiah his son reigned in his stead.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3278. B.C. 726.__GHthey_brought_2__PSthey brought__EF2Ch/21/20\');">2Ch 21:20__NB2Ch/26/23\');">2Ch 26:23__NB2Ch/33/20\');">2Ch 33:20__NB1Sa/2/30\');">1Sa 2:30__NBPro/10/7\');">Pro 10:7__AN__GGthe_kings_of_Israel_3__PSthe kings of Israel__EE"Or, ""the kings of Judah;"" the name Israel being sometimes applied by the writer of this book, in a general way, to Judah. The Hebrews were accustomed to honour the memory of those kings who had reigned well, by depositing their remains in the royal cemetery. On the contrary, those who died under the disapprobation of the people, as a mark of posthumous disgrace, were denied interment with their predecessors, and were buried in some other place in Jerusalem. So it was with Ahaz, who, though brought into the city, was not buried in the sepulchres of the kings of Judah. It was doubtless with a design to make a suitable impression on the minds of their kings while living, that such distinctions were observed. They might thus restrain them from evil, or excite them to good, according as they were fearful of being execrated, or desirous of being honoured, when dead."</TD></TR>';
