Text[1] = 'Now concerning spiritual [gifts], brethren, I would not have you ignorant.';
Text[2] = 'Ye know that ye were Gentiles, carried away unto these dumb idols, even as ye were led.';

Text[12] = 'For as the body is one, and hath many members, and all the members of that one body, being many, are one body: so also [is] Christ.';
Text[13] = 'For by one Spirit are we all baptized into one body, whether [we be] Jews or Gentiles, whether [we be] bond or free; and have been all made to drink into one Spirit.';
Text[14] = 'For the body is not one member, but many.';
Text[15] = 'If the foot shall say, Because I am not the hand, I am not of the body; is it therefore not of the body?';
Text[16] = 'And if the ear shall say, Because I am not the eye, I am not of the body; is it therefore not of the body?';
Text[17] = 'If the whole body [were] an eye, where [were] the hearing? If the whole [were] hearing, where [were] the smelling?';
Text[18] = 'But now hath God set the members every one of them in the body, as it hath pleased him.';
Text[19] = 'And if they were all one member, where [were] the body?';
Text[20] = 'But now [are they] many members, yet but one body.';
Text[21] = 'And the eye cannot say unto the hand, I have no need of thee: nor again the head to the feet, I have no need of you.';
Text[22] = 'Nay, much more those members of the body, which seem to be more feeble, are necessary:';
Text[23] = 'And those [members] of the body, which we think to be less honourable, upon these we bestow more abundant honour; and our uncomely [parts] have more abundant comeliness.';
Text[24] = 'For our comely [parts] have no need: but God hath tempered the body together, having given more abundant honour to that [part] which lacked:';
Text[25] = 'That there should be no schism in the body; but [that] the members should have the same care one for another.';
Text[26] = 'And whether one member suffer, all the members suffer with it; or one member be honoured, all the members rejoice with it.';
Text[27] = 'Now ye are the body of Christ, and members in particular.';
