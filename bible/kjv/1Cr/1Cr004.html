Text[6] = 'And these things, brethren, I have in a figure transferred to myself and [to] Apollos for your sakes; that ye might learn in us not to think [of men] above that which is written, that no one of you be puffed up for one against another.';
Text[7] = 'For who maketh thee to differ [from another]? and what hast thou that thou didst not receive? now if thou didst receive [it], why dost thou glory, as if thou hadst not received [it]?';

Text[14] = 'I write not these things to shame you, but as my beloved sons I warn [you].';

Text[16] = 'Wherefore I beseech you, be ye followers of me.';
