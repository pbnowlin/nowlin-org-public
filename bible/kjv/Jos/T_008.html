var stringArray = new Array();
stringArray[1] = 'And the LORD said unto Joshua, __PNFear_not_1__SHFear not</a>, neither be thou dismayed: __PNtake_all_2__SHtake all</a> the people of war with thee, and arise, go up to Ai: __PNsee__I_have_3__SHsee, I have</a> given into thy hand the king of Ai, and his people, and his city, and his land:__CPFear_not_1__PSFear not__FFJos/1/9\');">Jos 1:9__NBJos/7/6\');">Jos 7:6__NRJos/7/7\');">7__NRJos/7/9\');">9__NBDeu/1/21\');">Deu 1:21__NBDeu/7/18\');">Deu 7:18__NBDeu/31/8\');">Deu 31:8__NBPsa/27/1\');">Psa 27:1__NBPsa/46/11\');">Psa 46:11__NBIsa/12/2\');">Isa 12:2__NBIsa/41/10\');">Isa 41:10-16__NBIsa/43/2\');">Isa 43:2__NBJer/46/27\');">Jer 46:27__NBMat/8/26\');">Mat 8:26__AN__GHtake_all_2__PStake all__FEIt would seem, from this verse, that all that were capable of bearing arms were to march out of the camp on this occasion: 30,000 formed an ambuscade in one place; and 5,000 were placed in another, who all gained their positions in the night. With the rest of the army, Joshua appeared the next morning before Ai, which the men of that city would naturally suppose was the whole of the Israelitish force and, consequently, be the more emboldened to come out and attack them. Some, however, think that 30,000 men were the whole that were employed on this occasion, 5,000 of whom were placed in ambush on the west of the city, between Bethel and Ai (__NAJos/8/12\');">Jos 8:12__AN) and, with the rest, Joshua appeared before the city in the morning. The king, seeing but about 25,000 coming against him, though he had but 12,000 persons in the whole city (__NAJos/8/25\');">Jos 8:25__AN), determined to risk a battle, issued out, and was defeated by stratagem.__GGsee__I_have_3__PSsee, I have__FFJos/6/2\');">Jos 6:2__NBPsa/44/3\');">Psa 44:3__NBDan/2/21\');">Dan 2:21__NRDan/2/37\');">37__NRDan/2/38\');">38__NBDan/4/25\');">Dan 4:25__NRDan/4/35\');">35__EN';
stringArray[2] = 'And thou shalt __PNdo_to_Ai_1__SHdo to Ai</a> and her king as thou didst unto Jericho and her king: __PNonly_the_spoil_2__SHonly the spoil</a> thereof, and the cattle thereof, shall ye take for a prey unto yourselves: __PNlay_thee_3__SHlay thee</a> an ambush for the city behind it.__CPdo_to_Ai_1__PSdo to Ai__FFJos/8/24\');">Jos 8:24__NRJos/8/28\');">28__NRJos/8/29\');">29__AN; See on ch. __NAJos/6/21\');">Jos 6:21__NBJos/10/1\');">Jos 10:1__NRJos/10/28\');">28__NBDeu/3/2\');">Deu 3:2__AN__GHonly_the_spoil_2__PSonly the spoil__EFJos/8/27\');">Jos 8:27__NBDeu/20/14\');">Deu 20:14__NBJob/27/16\');">Job 27:16__NRJob/27/17\');">17__NBPsa/39/6\');">Psa 39:6__NBPro/13/22\');">Pro 13:22__NBPro/28/20\');">Pro 28:20__NBJer/17/11\');">Jer 17:11__NBLuk/12/20\');">Luk 12:20__NRLuk/12/21\');">21__AN__GGlay_thee_3__PSlay thee__FFJos/8/7\');">Jos 8:7__NRJos/8/9\');">9__NRJos/8/12\');">12__NRJos/8/14\');">14__NRJos/8/19\');">19__NBJdg/20/29\');">Jdg 20:29-33__NB2Ch/13/13\');">2Ch 13:13__NB2Ch/20/22\');">2Ch 20:22__NBJer/51/12\');">Jer 51:12__EN';
stringArray[3] = 'So Joshua arose, and all the people of war, to go up against Ai: and Joshua chose out thirty thousand mighty men of valour, and sent them away __PNby_night_1__SHby night</a>.__CPby_night_1__PSby night__FFMat/24/39\');">Mat 24:39__NRMat/24/50\');">50__NBMat/25/6\');">Mat 25:6__NB1Th/5/2\');">1Th 5:2__NB2Pe/3/10\');">2Pe 3:10__EN';
stringArray[4] = 'And he commanded them, saying, Behold, ye shall __PNlie_in_wait_1__SHlie in wait</a> against the city, [even] behind the city: __PNgo_not_2__SHgo not</a> very far from the city, but be ye all ready:__CPlie_in_wait_1__PSlie in wait__FFJos/8/16\');">Jos 8:16__NBJdg/9/25\');">Jdg 9:25__NBJdg/20/29\');">Jdg 20:29__NRJdg/20/33\');">33__NRJdg/20/36\');">36__NB1Sa/15/2\');">1Sa 15:2__NR1Sa/15/5\');">5__NBAct/23/21\');">Act 23:21__AN__GHgo_not_2__PSgo not__EFEcc/7/19\');">Ecc 7:19__NBEcc/9/16\');">Ecc 9:16__EN';
stringArray[5] = 'And I, and all the people that [are] with me, will approach unto the city: and it shall come to pass, when they come out against us, __PNas_at_1__SHas at</a> the first, __PNthat_we_will_2__SHthat we will</a> flee before them,__CPas_at_1__PSas at__FFJos/7/5\');">Jos 7:5__AN__GHthat_we_will_2__PSthat we will__EFJdg/20/31\');">Jdg 20:31-33__NBMat/10/16\');">Mat 10:16__EN';
stringArray[6] = '(For they will come out after us) till we have __PNdrawn_1__SHdrawn</a> them from the city; for they will say, __PNThey_flee_2__SHThey flee</a> before us, as at the first: therefore we will flee before them.__CPdrawn_1__PSdrawn__EEHeb. pulled. __NAJos/8/16\');">Jos 8:16__AN__GHThey_flee_2__PSThey flee__EFExd/14/3\');">Exd 14:3__NBExd/15/9\');">Exd 15:9__NBJdg/20/32\');">Jdg 20:32__NBEcc/8/11\');">Ecc 8:11__NBEcc/9/12\');">Ecc 9:12__EN';
stringArray[7] = 'Then ye shall rise up from the ambush, and seize upon the city: __PNfor_the_LORD_1__SHfor the LORD</a> your God will deliver it into your hand.__CPfor_the_LORD_1__PSfor the LORD__FFJos/8/1\');">Jos 8:1__NB2Ki/5/1\');">2Ki 5:1__NBPro/21/30\');">Pro 21:30__NRPro/21/31\');">31__EN';
stringArray[8] = 'And it shall be, when ye have taken the city, [that] ye shall __PNset_the_city_1__SHset the city</a> on fire: according to the commandment of the LORD shall ye do. __PNSee__I_have_2__SHSee, I have</a> commanded you.__CPset_the_city_1__PSset the city__FFJos/8/28\');">Jos 8:28__NBJos/6/24\');">Jos 6:24__AN__GHSee__I_have_2__PSSee, I have__EFJos/1/9\');">Jos 1:9__NRJos/1/16\');">16__NBJdg/4/6\');">Jdg 4:6__NB2Sa/13/28\');">2Sa 13:28__EN';
stringArray[9] = 'Joshua therefore sent them forth: and they went to lie in ambush, and abode __PNbetween_1__SHbetween</a> Bethel and Ai, on the west side of Ai: but Joshua __PNlodged_2__SHlodged</a> that night among the people.__CPbetween_1__PSbetween__FFJos/8/12\');">Jos 8:12__NBJos/7/2\');">Jos 7:2__NBGen/12/8\');">Gen 12:8__AN; Hai. __NAEzr/2/28\');">Ezr 2:28__NBNeh/7/32\');">Neh 7:32__AN__GHlodged_2__PSlodged__EFGen/32/21\');">Gen 32:21__EN';
stringArray[10] = 'And Joshua __PNrose_up_1__SHrose up</a> early in the morning, and numbered the people, and went up, he and the elders of Israel, before the people to Ai.__CProse_up_1__PSrose up__FFJos/3/1\');">Jos 3:1__NBJos/6/12\');">Jos 6:12__NBJos/7/16\');">Jos 7:16__NBPsa/119/60\');">Psa 119:60__EN';
stringArray[11] = 'And all the people, [even the people] of war that [were] with him, went up, and drew nigh, and came before the city, and pitched on the north side of Ai: now [there was] a valley between them and Ai.__CPRelated_Verses1_1__PSEntire Verse.__EESee on __NAJos/8/1\');">Jos 8:1-5__EN';
stringArray[12] = 'And he took about __PNfive_thousand_1__SHfive thousand</a> men, and set them to lie in ambush between Bethel and Ai, on the west side __PNof_the_city_2__SHof the city</a>.__CPfive_thousand_1__PSfive thousand__FFJos/8/2\');">Jos 8:2__NRJos/8/3\');">3__AN__GHof_the_city_2__PSof the city__FEor, of Ai.</TD></TR>';
stringArray[13] = 'And when they had set the people, [even] all the host that [was] on the north of the city, and their __PNliers_in_wait_1__SHliers in wait</a> __PNon_the_west_2__SHon the west</a> of the city, Joshua went that night into the midst of the valley.__CPliers_in_wait_1__PSliers in wait__EEHeb. lying in wait.__GHon_the_west_2__PSon the west__EFJos/8/8\');">Jos 8:8__NRJos/8/12\');">12__EN';
stringArray[14] = 'And it came to pass, when the king of __PNAi_saw_it_1__SHAi saw [it]</a>, that they hasted and rose up early, and the men of the city went out against Israel to battle, he and all his people, at a time appointed, before the plain; but __PNhe_wist_not_2__SHhe wist not</a> that [there were] liers in ambush against him behind the city.__CPAi_saw_it_1__PSAi saw it__FFJos/8/5\');">Jos 8:5__NRJos/8/16\');">16__AN__GHhe_wist_not_2__PShe wist not__EFJdg/20/34\');">Jdg 20:34__AN, etc.; __NAEcc/9/12\');">Ecc 9:12__NBIsa/19/11\');">Isa 19:11__NRIsa/19/13\');">13__NBDan/4/31\');">Dan 4:31__NBMat/24/39\');">Mat 24:39__NRMat/24/50\');">50__NB1Th/5/1\');">1Th 5:1-3__NB2Pe/2/3\');">2Pe 2:3__EN';
stringArray[15] = 'And Joshua and all Israel made as if they were beaten before them, and fled __PNby_the_way_1__SHby the way</a> of the wilderness.__CPby_the_way_1__PSby the way__FFJos/18/12\');">Jos 18:12__EN';
stringArray[16] = 'And all the people that [were] in Ai were __PNcalled_together_1__SHcalled together</a> to pursue after them: and they pursued after Joshua, and were __PNdrawn_away_2__SHdrawn away</a> from the city.__CPcalled_together_1__PScalled together__FFJdg/20/36\');">Jdg 20:36-39__AN__GHdrawn_away_2__PSdrawn away__EFJos/8/5\');">Jos 8:5__NRJos/8/6\');">6__NBJdg/20/31\');">Jdg 20:31__NBPsa/9/16\');">Psa 9:16__NBEze/38/11\');">Eze 38:11-22__NBRev/16/14\');">Rev 16:14__NBRev/19/19\');">Rev 19:19-21__EN';
stringArray[17] = 'And there was not __PNa_man_1__SHa man</a> left in Ai or __PNBethel_2__SHBethel</a>, that went not out after Israel: and they left the city open, and pursued after Israel.__CPa_man_1__PSa man__FFJos/8/3\');">Jos 8:3__NRJos/8/24\');">24__NRJos/8/25\');">25__NBJos/11/20\');">Jos 11:20__NBDeu/2/30\');">Deu 2:30__NBJob/5/13\');">Job 5:13__NBIsa/19/11\');">Isa 19:11-13__AN__GHBethel_2__PSBethel__FEBethel is not mentioned in the Greek version, and some, with Houbigant and Pilkington, think it was not originally in the Hebrew; because, had the men of Bethel pursued, as well as those of Ai, it would have been said that they left the cities, and not the city, open. The principal strength of Bethel might have been previously taken into Ai, as the strongest place to make a stand in; Bethel being but about three miles westward from Ai.</TD></TR>';
stringArray[18] = 'And the LORD said unto Joshua, __PNStretch_1__SHStretch</a> out __PNthe_spear_2__SHthe spear</a> that [is] in thy hand toward Ai; for I will give it into thine hand. And Joshua stretched out the spear that [he had] in his hand toward the city.__CPStretch_1__PSStretch__FFJos/8/7\');">Jos 8:7__NRJos/8/26\');">26__NBExd/8/5\');">Exd 8:5__NBExd/17/11\');">Exd 17:11__NBJob/15/25\');">Job 15:25__AN__GHthe_spear_2__PSthe spear__FEThe word keedon is rendered clypeum, a shield or buckler, by the Vulgate but the LXX. translate it [gaison] which Suidas says, signifies a kind of weapon, [hoion doratos] like a spear. It may denote a short spear, javelin, or lance; for it is evident that it signifies neither the larger spear nor the shield, because it is distinguished from both. __NA1Sa/17/6\');">1Sa 17:6__NR1Sa/17/41\');">41__NR1Sa/17/45\');">45__NBJob/39/23\');">Job 39:23__AN; Joshua may have had a flag or ensign at the end of the spear, which might be seen at a considerable distance when extended, which was the sign agreed upon by him and the ambush.</TD></TR>';
stringArray[19] = 'And the ambush arose quickly out of their place, and they ran as soon as he had stretched out his hand: and they entered into the city, and took it, and hasted and set the city on fire.__CPRelated_Verses1_1__PSEntire Verse.__FFJos/8/6\');">Jos 8:6-8__EN';
stringArray[20] = 'And when the men of Ai looked behind them, they saw, and, behold, __PNthe_smoke_1__SHthe smoke</a> of the city ascended up to heaven, __PNand_they_had_2__SHand they had</a> no __PNpower_3__SHpower</a> to flee this way or that way: and the people that fled to the wilderness turned back upon the pursuers.__CPthe_smoke_1__PSthe smoke__FFGen/19/28\');">Gen 19:28__NBIsa/34/10\');">Isa 34:10__NBRev/18/9\');">Rev 18:9__NBRev/19/3\');">Rev 19:3__AN__GHand_they_had_2__PSand they had__EFJob/11/20\');">Job 11:20__NBPsa/48/5\');">Psa 48:5__NRPsa/48/6\');">6__NBPsa/76/5\');">Psa 76:5__NBAmo/2/14\');">Amo 2:14-16__NBRev/6/15\');">Rev 6:15-17__AN__GGpower_3__PSpower__EEHeb. hand.</TD></TR>';
stringArray[21] = 'And when Joshua and all Israel saw that the ambush had taken the city, and that the smoke of the city ascended, then they turned again, and slew the men of Ai.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[22] = 'And the other issued out of the city against them; so they were in the midst of Israel, some on this side, and some on that side: and they smote them, so that they __PNlet_none_1__SHlet none</a> of them remain or escape.__CPlet_none_1__PSlet none__FFJos/6/21\');">Jos 6:21__NBJos/10/28\');">Jos 10:28__NBJos/11/11\');">Jos 11:11__NRJos/11/12\');">12__NBDeu/7/2\');">Deu 7:2__NBJob/20/5\');">Job 20:5__NBLuk/17/26\');">Luk 17:26-30__NB1Th/5/3\');">1Th 5:3__EN';
stringArray[23] = 'And the king of Ai they took alive, and brought him to Joshua.__CPRelated_Verses1_1__PSEntire Verse.__FFJos/8/29\');">Jos 8:29__NBJos/10/17\');">Jos 10:17__NB1Sa/15/8\');">1Sa 15:8__NBRev/19/20\');">Rev 19:20__EN';
stringArray[24] = 'And it came to pass, when Israel had made an end of slaying all the inhabitants of Ai in the field, in the wilderness wherein they chased them, and when they were all fallen on the edge of the sword, until they were consumed, that all the Israelites __PNreturned_unto_Ai_1__SHreturned unto Ai</a>, and smote it with the edge of the sword.__CPreturned_unto_Ai_1__PSreturned unto Ai__EEThis must refer to the women, children, and old persons left behind; for it seems that all the effective men had sallied out when they imagined the Israelites had fled. (__NAJos/8/16\');">Jos 8:16__AN) __NAJos/10/30\');">Jos 10:30-41__NBJos/11/10\');">Jos 11:10-14__NBNum/21/24\');">Num 21:24__EN';
stringArray[25] = 'And [so] it was, [that] all that fell that day, both of men and women, [were] twelve thousand, [even] all the men of Ai.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[26] = 'For __PNJoshua_1__SHJoshua</a> __PNdrew_not_2__SHdrew not</a> his hand back, wherewith he stretched out the spear, until he had utterly destroyed all the inhabitants of Ai.__CPJoshua_1__PSJoshua__EEJoshua seems to have been not only the general but the standard-bearer of the army, (__NAJos/8/18\');">Jos 8:18__AN,) and continued in this employment, by holding up or extending his spear, during the whole of the battle; and did not slacken from the pursuit till the forces of Ai were utterly discomfited. Some commentators, however, understand this action in a figurative sense, like the holding up of Moses\' hands, as if it implied that Joshua continued in prayer for the success of his troops, nor ceased till the armies of Ai were annihilated, and the city taken and destroyed.__GHdrew_not_2__PSdrew not__EFJos/8/18\');">Jos 8:18__NBExd/17/11\');">Exd 17:11__NRExd/17/12\');">12__EN';
stringArray[27] = 'Only __PNthe_cattle_1__SHthe cattle</a> and the spoil of that city Israel took for a prey unto themselves, according unto the word of the LORD which __PNhe_commanded_2__SHhe commanded</a> Joshua.__CPthe_cattle_1__PSthe cattle__FFJos/8/2\');">Jos 8:2__NBJos/11/4\');">Jos 11:4__NBNum/31/22\');">Num 31:22__NRNum/31/26\');">26__NBPsa/50/10\');">Psa 50:10__NBMat/20/15\');">Mat 20:15__AN__GHhe_commanded_2__PShe commanded__EFJos/8/2\');">Jos 8:2__EN';
stringArray[28] = 'And Joshua burnt Ai, and made it __PNan_heap_1__SHan heap</a> for ever, [even] a desolation __PNunto_this_day_2__SHunto this day</a>.__CPan_heap_1__PSan heap__FFDeu/13/16\');">Deu 13:16__NB2Ki/19/25\');">2Ki 19:25__NBIsa/17/1\');">Isa 17:1__NBIsa/25/2\');">Isa 25:2__NBJer/9/11\');">Jer 9:11__NBJer/49/2\');">Jer 49:2__NBJer/50/26\');">Jer 50:26__NBMic/3/12\');">Mic 3:12__AN__GHunto_this_day_2__PSunto this day__EFJos/4/9\');">Jos 4:9__EN';
stringArray[29] = 'And __PNthe_king_1__SHthe king</a> of Ai he hanged on a tree until eventide: and __PNas_soon_2__SHas soon</a> as the sun was down, Joshua commanded that they should take his carcase down from the tree, and cast it at the entering of the gate of the city, and raise thereon __PNa_great_heap_3__SHa great heap</a> of stones, [that remaineth] unto this day.__CPthe_king_1__PSthe king__EEThe kings of Canaan lay under the same curse as their subjects and probably were more deeply criminal. The reserving of the king of Ai for a solemn execution, would tend to strike terror into the other kings, contribute to the success of Israel, and give their proceedings the stamp of a judicial process, and of executing the vengeance of God upon his enemies. __NAJos/10/26\');">Jos 10:26-28__NRJos/10/30\');">30__NRJos/10/33\');">33__NBDeu/21/22\');">Deu 21:22__NRDeu/21/23\');">23__NBEst/7/10\');">Est 7:10__NBPsa/107/40\');">Psa 107:40__NBPsa/110/5\');">Psa 110:5__NBAct/12/23\');">Act 12:23__NBRev/19/17\');">Rev 19:17__NRRev/19/18\');">18__AN__GHas_soon_2__PSas soon__EFJos/10/27\');">Jos 10:27__AN__GGa_great_heap_3__PSa great heap__FFJos/7/26\');">Jos 7:26__NB2Sa/18/17\');">2Sa 18:17__EN';
stringArray[30] = 'Then Joshua __PNbuilt_an_altar_1__SHbuilt an altar</a> unto the LORD God of Israel __PNin_mount_Ebal_2__SHin mount Ebal</a>,__CPbuilt_an_altar_1__PSbuilt an altar__FFGen/8/20\');">Gen 8:20__NBGen/12/7\');">Gen 12:7__NRGen/12/8\');">8__AN__GHin_mount_Ebal_2__PSin mount Ebal__FEMoses himself had twice given express orders for this solemnity; once __NADeu/11/29\');">De 11:29__AN, __NADeu/11/30\');">30__AN, in which he pointed out the very place where it was to be performed; and again, at the 27th chapter, there is a renewal of the instructions to Joshua, with special reference to minute particulars. It was a federal transaction: the covenant was now renewed between God and Israel upon their taking possession of the land of promise, that they might be encouraged in the conquest of it, and might know upon what terms they held it, and come under fresh obligations to obedience. __NAJos/8/33\');">Jos 8:33__EN';
stringArray[31] = 'As Moses the servant of the LORD commanded the children of Israel, __PNas_it_is_1__SHas it is</a> written in the book of the law of Moses, an __PNaltar_2__SHaltar</a> of whole stones, over which no man hath lift up [any] iron: __PNand_they_offered_3__SHand they offered</a> thereon burnt offerings unto the LORD, and sacrificed peace offerings.__CPas_it_is_1__PSas it is__FFJos/8/34\');">Jos 8:34__NRJos/8/35\');">35__NBJos/1/8\');">Jos 1:8__NB2Ki/14/6\');">2Ki 14:6__NB2Ki/22/8\');">2Ki 22:8__NB2Ch/25/4\');">2Ch 25:4__NB2Ch/35/12\');">2Ch 35:12__NBEzr/6/18\');">Ezr 6:18__NBNeh/13/1\');">Neh 13:1__NBMat/12/26\');">Mat 12:26__AN__GHaltar_2__PSaltar__EFExd/20/24\');">Exd 20:24__NRExd/20/25\');">25__NBDeu/27/5\');">Deu 27:5__NRDeu/27/6\');">6__NB1Ki/18/31\');">1Ki 18:31__NR1Ki/18/32\');">32__AN__GGand_they_offered_3__PSand they offered__FFExd/18/12\');">Exd 18:12__NBExd/24/5\');">Exd 24:5__NBDeu/27/6\');">Deu 27:6__NRDeu/27/7\');">7__EN';
stringArray[32] = 'And he wrote there upon the stones a copy of the law of Moses, which he wrote in the presence of the children of Israel.__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/27/2\');">Deu 27:2__NRDeu/27/3\');">3__NRDeu/27/8\');">8__EN';
