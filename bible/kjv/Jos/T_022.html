var stringArray = new Array();
stringArray[1] = 'Then __PNJoshua_1__SHJoshua</a> called the __PNReubenites_2__SHReubenites</a>, and the Gadites, and the half tribe of Manasseh,__CPJoshua_1__PSJoshua__FFNum/32/18\');">Num 32:18-33__NBDeu/29/7\');">Deu 29:7__NRDeu/29/8\');">8__AN__GHReubenites_2__PSReubenites__FEWe have already seen, that a detachment of 40,000 men, of the tribes of Reuben and Gad, and the half tribe of Manasseh, had passed over Jordan armed, with their brethren, according to their agreement with Moses. The war being now concluded, the land divided, and their brethren settled, Joshua assembles these warriors; and with commendations for their services and fidelity, he dismisses them, having fist given them the most pious and suitable instructions. They had now been about seven years absent from their respective families; and though there was only the river Jordan between the camp of Gilgal and their own inheritance, yet it does not appear that they had, during that time, ever revisited their home, which they might have done at any time of the year, except the harvest, as the river was at other times easily fordable.</TD></TR>';

stringArray[9] = 'And the children of Reuben and the children of Gad and the half tribe of Manasseh returned, and departed from the children of Israel out of Shiloh, which [is] in the land of Canaan, to go unto __PNthe_country_of_Gilead_1__SHthe country of Gilead</a>, to the land of their possession, whereof they were possessed, according to the word of the LORD by the hand of Moses.__CPthe_country_of_Gilead_1__PSthe country of Gilead__FFJos/13/11\');">Jos 13:11__NRJos/13/25\');">25__NRJos/13/31\');">31__NBNum/32/1\');">Num 32:1__NRNum/32/26\');">26__NRNum/32/29\');">29__NRNum/32/39\');">39__NRNum/32/40\');">40__NBDeu/3/15\');">Deu 3:15__NRDeu/3/16\');">16__NBPsa/60/7\');">Psa 60:7__EN';
stringArray[10] = 'And when they came unto the borders of Jordan, that [are] in the land of Canaan, __PNthe_children_1__SHthe children</a> of Reuben and the children of Gad and the half tribe of Manasseh __PNbuilt_2__SHbuilt</a> there an altar by Jordan, a great altar to see to.__CPthe_children_1__PSthe children__EE"This verse should probably be rendered, ""And when they came to the borders of Jordan, that are in the land of Canaan, the children of Reuben, and the children of Gad, and the half tribe of Manasseh, Then built an altar by (or beyond, al ) Jordan, a great altar to the view."" It would appear, that when they came to the river, they formed the purpose of building the altar; and when they crossed it they put that purpose into execution. It is evident that they did not build it west of the Jordan, for that was not in their territories, and the next verse expressly says that it was built over against the land of Canaan."__GHbuilt_2__PSbuilt__EFJos/22/25\');">Jos 22:25-28__NBJos/4/5\');">Jos 4:5-9__NBJos/24/26\');">Jos 24:26__NRJos/24/27\');">27__NBGen/28/18\');">Gen 28:18__NBGen/31/46\');">Gen 31:46-52__EN';

stringArray[12] = 'And when the children of Israel heard [of it], __PNthe_whole_1__SHthe whole</a> congregation of the children of Israel gathered themselves together at Shiloh, to go up to war against them.__CPthe_whole_1__PSthe whole__EESupposing they had built this altar for sacrifice, in opposition to the command of God, they considered them as rebels against God and the Israelitish constitution. __NADeu/13/15\');">Deu 13:15__NBJdg/20/1\');">Jdg 20:1-11__NBAct/11/2\');">Act 11:2__NRAct/11/3\');">3__NBRom/10/2\');">Rom 10:2__NBGal/4/17\');">Gal 4:17__NRGal/4/18\');">18__EN';

stringArray[21] = '__PNThen_the_children_1__SHThen the children</a> of Reuben and the children of Gad and the half tribe of Manasseh __PNanswered_2__SHanswered</a>, and said unto the __PNheads_3__SHheads</a> of the thousands of Israel,__CPThen_the_children_1__PSThen the children__EEThe conduct and answer of these Reubenites and the associates are worthy of admiration and imitation. Though conscious of their innocence, they permitted Phinehas to finish his speech, though composed of little else than accusations, without any interruption; and taking in good part the suspicions, reproofs, and even harshness of their brethren, with the utmost meekness and solemnity they explain their intention, give all the satisfaction in their power, and with great propriety and reverence, appeal to that God against whom they were supposed to have rebelled.__GHanswered_2__PSanswered__EFPro/15/1\');">Pro 15:1__NBPro/16/1\');">Pro 16:1__NBPro/18/13\');">Pro 18:13__NBPro/24/26\');">Pro 24:26__NBAct/11/4\');">Act 11:4__NBJam/1/19\');">Jam 1:19__NB1Pe/3/15\');">1Pe 3:15__AN__GGheads_3__PSheads__FFExd/18/21\');">Exd 18:21-25__NBMic/5/2\');">Mic 5:2__EN';

stringArray[27] = 'But [that] it [may be] __PNa_witness_1__SHa witness</a> between us, and you, and our generations after us, __PNthat_we_2__SHthat we</a> might do the service of the LORD before him with our burnt offerings, and with our sacrifices, and with our peace offerings; that your children may not say to our children in time to come, Ye have no part in the LORD.__CPa_witness_1__PSa witness__FFJos/22/10\');">Jos 22:10__NRJos/22/34\');">34__NBJos/24/27\');">Jos 24:27__NBGen/31/48\');">Gen 31:48__NRGen/31/52\');">52__NB1Sa/7/12\');">1Sa 7:12__AN__GHthat_we_2__PSthat we__EFDeu/12/5\');">Deu 12:5__NRDeu/12/6\');">6__NRDeu/12/11\');">11__NRDeu/12/17\');">17__NRDeu/12/18\');">18__NRDeu/12/26\');">26__NRDeu/12/27\');">27__EN';
stringArray[28] = 'Therefore said we, that it shall be, when they should [so] say to us or to our generations in time to come, that we may say [again], __PNBehold_1__SHBehold</a> the pattern of the altar of the LORD, which our fathers made, not for burnt offerings, nor for sacrifices; but it [is] a witness between us and you.__CPBehold_1__PSBehold__FFExd/25/40\');">Exd 25:40__NB2Ki/16/10\');">2Ki 16:10__NBEze/43/10\');">Eze 43:10__NREze/43/11\');">11__NBHbr/8/5\');">Hbr 8:5__EN';
stringArray[29] = '__PNGod_forbid_1__SHGod forbid</a> that we should rebel against the LORD, and turn this day from following the LORD, __PNto_build_2__SHto build</a> an altar for burnt offerings, for meat offerings, or for sacrifices, beside the altar of the LORD our God that [is] before his tabernacle.__CPGod_forbid_1__PSGod forbid__FFJos/24/16\');">Jos 24:16__NBGen/44/7\');">Gen 44:7__NRGen/44/17\');">17__NB1Sa/12/23\');">1Sa 12:23__NB1Ki/21/3\');">1Ki 21:3__NBRom/3/6\');">Rom 3:6__NBRom/6/2\');">Rom 6:2__NBRom/9/14\');">Rom 9:14__AN__GHto_build_2__PSto build__EFJos/22/23\');">Jos 22:23__NRJos/22/26\');">26__NBDeu/12/13\');">Deu 12:13__NRDeu/12/14\');">14__NB2Ki/18/22\');">2Ki 18:22__NB2Ch/32/12\');">2Ch 32:12__EN';
stringArray[30] = 'And when Phinehas the priest, and the princes of the congregation and heads of the thousands of Israel which [were] with him, heard the words that the children of Reuben and the children of Gad and the children of Manasseh spake, __PNit_pleased_them_1__SHit pleased them</a>.__CPit_pleased_them_1__PSit pleased them__EEHeb. it was good in their eyes. It is remarkable, that Joshua is not once named in this transaction; but this only shews, that he did not in his old age assume any regal authority, but left the elders and magistrates to conduct the general business, only acting himself when great occasions made it necessary. Yet we cannot doubt, that his wisdom and piety influenced the counsels of the elders and people at this time. __NAJos/22/33\');">Jos 22:33__NBGen/28/8\');">Gen 28:8__NBJdg/8/3\');">Jdg 8:3__NB1Sa/25/32\');">1Sa 25:32__NR1Sa/25/33\');">33__NB1Sa/29/6\');">1Sa 29:6__NB2Ch/30/4\');">2Ch 30:4__NBEst/1/21\');">Est 1:21__AN; *margins; __NAPro/15/1\');">Pro 15:1__NBAct/11/18\');">Act 11:18__EN';
stringArray[31] = 'And Phinehas the son of Eleazar the priest said unto the children of Reuben, and to the children of Gad, and to the children of Manasseh, This day we perceive that __PNthe_LORD_is_1__SHthe LORD [is]</a> among us, because ye have not committed this trespass against the LORD: __PNnow_2__SHnow</a> ye have delivered the children of Israel out of the hand of the LORD.__CPthe_LORD_is_1__PSthe LORD is__FFJos/3/10\');">Jos 3:10__NBLev/26/11\');">Lev 26:11__NRLev/26/12\');">12__NBNum/14/41\');">Num 14:41-43__NB2Ch/15/2\');">2Ch 15:2__NBPsa/68/17\');">Psa 68:17__NBIsa/12/6\');">Isa 12:6__NBZec/8/23\');">Zec 8:23__NBMat/1/23\');">Mat 1:23__NB1Cr/14/25\');">1Cr 14:25__AN__GHnow_2__PSnow__FEHeb. then.</TD></TR>';
stringArray[32] = 'And Phinehas the son of Eleazar the priest, and the princes, returned from the children of Reuben, and from the children of Gad, out of the land of Gilead, unto the land of Canaan, to the children of Israel, __PNand_brought_1__SHand brought</a> them word again.__CPand_brought_1__PSand brought__FFJos/22/12\');">Jos 22:12-14__NBPro/25/13\');">Pro 25:13__EN';
stringArray[33] = 'And __PNthe_thing_1__SHthe thing</a> pleased the children of Israel; and the children of Israel __PNblessed_2__SHblessed</a> God, and did not intend to go up against them in battle, to destroy the land wherein the children of Reuben and Gad dwelt.__CPthe_thing_1__PSthe thing__FFJos/22/30\');">Jos 22:30__NBAct/15/12\');">Act 15:12__NRAct/15/31\');">31__NB2Cr/7/7\');">2Cr 7:7__NB1Th/3/6\');">1Th 3:6-8__AN__GHblessed_2__PSblessed__EF1Sa/25/32\');">1Sa 25:32__NR1Sa/25/33\');">33__NB1Ch/29/20\');">1Ch 29:20__NBNeh/8/5\');">Neh 8:5__NRNeh/8/6\');">6__NBDan/2/19\');">Dan 2:19__NBLuk/2/28\');">Luk 2:28__NBEph/1/3\');">Eph 1:3__EN';
stringArray[34] = 'And the children of Reuben and the children of Gad called the altar [__PNEd_1__SHEd</a>]: for it [shall be] a witness between us that __PNthe_LORD_is_God_2__SHthe LORD [is] God</a>.__CPEd_1__PSEd__EEi.e, a witness. The word witness, or testimony, is not found in the common editions of the Hebrew Bible; and is supplied in Italics by our venerable translators, at least in our modern copies; for in the first edition of this translation, it stands in the text without any note of this kind; but it is found in several of Kennicott\'s and De Rossi\'s MSS., and also in the Syriac and Arabic. Several also of the early printed editions of the Hebrew Bible have the word ed, either in the text or in the margin; and it must be allowed to be necessary to complete the sense. It is very probable that an inscription was put on this altar, signifying the purpose for which it was erected. Thus was this affair most happily terminated. __NAJos/22/27\');">Jos 22:27__NBJos/24/27\');">Jos 24:27__NB1Ki/18/39\');">1Ki 18:39__NBIsa/43/10\');">Isa 43:10__NBMat/4/10\');">Mat 4:10__AN__GHthe_LORD_is_God_2__PSthe LORD is God__FE"Several manuscripts read more emphatically, [Y@hovah ( hwhy )] [ ( )] [\'elohiym ( eyhl) )] Yehowah, hoo Elohim, ""Jehovah he is God."""</TD></TR>';
