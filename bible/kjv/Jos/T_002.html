stringArray[1] = 'And Joshua the son of Nun __PNsent_1__SHsent</a> out of __PNShittim_2__SHShittim</a> two men __PNto_spy_secretly_3__SHto spy secretly</a>, saying, Go view the land, __PNeven_Jericho_4__SHeven Jericho</a>. And they went, and came into an __PNharlot_s_house_5__SHharlot\'s house</a>, named Rahab, and __PNlodged_6__SHlodged</a> there.__CPsent_1__PSsent__EEor, had sent.__GHShittim_2__PSShittim__EFNum/25/1\');">Num 25:1__NBNum/33/49\');">Num 33:49__AN__GGto_spy_secretly_3__PSto spy secretly__FFNum/13/2\');">Num 13:2__NRNum/13/17\');">17-21__NBJdg/18/2\');">Jdg 18:2__NRJdg/18/14\');">14__NRJdg/18/17\');">17__NBMat/10/16\');">Mat 10:16__NBEph/5/5\');">Eph 5:5__AN__GHeven_Jericho_4__PSeven Jericho__EFJos/5/10\');">Jos 5:10__NBJos/6/1\');">Jos 6:1-24__AN__GGharlot_s_house_5__PSharlot\'s house__EE"Though the word zonah generally denotes a prostitute, yet many very learned men are of opinion that it should be here rendered an innkeeper or hostess, from zoon, to furnish or provide food. In this sense it was understood by the Targumist, who renders it, ittetha pundekeetha, ""a woman, a tavern-keeper,"" and so St. Chrysostome, in his second sermon on Repentance, calls her [pandokeutria.] The Greek [porné] by which the LXX. render it, and which is adopted by the Apostles, is derived from [pernaó] to sell, and is also supposed to denote a tavern keeper. Among the ancients, women generally kept houses of entertainment. Herodotus says, ""Among the Egyptians, the women carry on all commercial concerns, and keep taverns, while the men continue at home and weave."" The same custom prevailed among the Greeks. __NAJos/6/17\');">Jos 6:17__NRJos/6/25\');">25__NBMat/1/5\');">Mat 1:5__AN; Rachab. __NAJos/21/31\');">Jos 21:31__NBHbr/11/31\');">Hbr 11:31__NBJam/2/25\');">Jam 2:25__AN"__GHlodged_6__PSlodged__FEHeb. lay.</TD></TR>';

stringArray[13] = 'And [that] ye will save alive __PNmy_father_1__SHmy father</a>, and my mother, and my brethren, and my sisters, and all that they have, and deliver our lives from death.__CPmy_father_1__PSmy father__EEIt is observable that in this enumeration of her kindred, there is no mention made of a husband. It is most likely that she was a single woman or widow, who obtained an honest livelihood by keeping a house for the entertainment of strangers; and not a woman of ill fame, as some have supposed. The spies sent on this occasion were certainly some of the most confidential persons that Joshua had in his host, and their errand was of the greatest importance; is it then not most likely that they lodged at an inn?</TD></TR>';
stringArray[14] = 'And the men answered her, Our life __PNfor_yours_1__SHfor yours</a>, if ye utter not this our business. And it shall be, __PNwhen_the_LORD_2__SHwhen the LORD</a> hath given us the land, that we will deal kindly and truly with thee.__CPfor_yours_1__PSfor yours__EEHeb. instead of you to die. __NA1Ki/20/39\');">1Ki 20:39__AN__GHwhen_the_LORD_2__PSwhen the LORD__EFJos/6/17\');">Jos 6:17__NRJos/6/25\');">25__NBGen/24/49\');">Gen 24:49__NBNum/10/29\');">Num 10:29-32__NBJdg/1/24\');">Jdg 1:24__NRJdg/1/25\');">25__NB1Sa/20/8\');">1Sa 20:8__NB2Sa/9/1\');">2Sa 9:1__NBPro/18/24\');">Pro 18:24__NBMat/5/7\');">Mat 5:7__EN';
