stringArray[1] = 'And these [are the countries] which the children of Israel inherited in the land of Canaan, __PNwhich_Eleazar_2__SHwhich Eleazar</a> the priest, and Joshua the son of Nun, and the heads of the fathers of the tribes of the children of Israel, distributed for inheritance to them.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!__GHwhich_Eleazar_2__PSwhich Eleazar__EFNum/34/17\');">Num 34:17-29__EN';
stringArray[2] = 'By __PNlot_1__SHlot</a> [was] their inheritance, as the LORD commanded by the hand of Moses, for the nine tribes, and [for] the half tribe.__CPlot_1__PSlot__EEThough God had sufficiently pointed out by the predictions of Jacob and Moses what portions he designed for each tribe, yet we readily discern an admirable proof of His wisdom, in the orders he gave to decide them by lot. By this means the false interpretations which might have been given to the words of Jacob and Moses were prevented; and by striking at the root of whatever might occasion jealousies and disputes among the tribes, he evidently secured the honesty of those appointed to distribute the conquered lands of Canaan. Besides, the success of this method gave a fresh proof of the divinity of the Jewish religion, and the truth of its oracles. Each tribe finding itself placed by lot exactly in the spot where Jacob and Moses foretold, it was evident that Providence had equally directed both the predictions and that lot; and it would be the greatest folly and presumption not to acknowledge the inspiration of God in the words of Jacob and Moses; the direction of his hand in the lot, and his providence in th</TD></TR>';
