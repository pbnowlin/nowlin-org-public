stringArray[1] = 'And Joshua __PNrose_early_1__SHrose early</a> in the morning; and they removed from __PNShittim_2__SHShittim</a>, and came to __PNJordan_3__SHJordan</a>, he and all the children of Israel, and lodged there before they passed over.__CProse_early_1__PSrose early__EEArchbishop Usher supposes, that this was upon Wednesday, the 28th of April, A.M. 2553, the fortieth year of the Exodus from Egypt. From Shittim, where the israelites had been encamped for about two months (__NADeu/1/3\');">Deu 1:3__AN), to the Jordan, was, according to Josephus, about sixty stadia; that is, between seven and eight English miles. __NAGen/22/3\');">Gen 22:3__NBPsa/119/60\');">Psa 119:60__NBJer/7/13\');">Jer 7:13__NBJer/25/3\');">Jer 25:3__NBJer/26/5\');">Jer 26:5__NBMar/1/35\');">Mar 1:35__AN__GHShittim_2__PSShittim__EFJos/2/1\');">Jos 2:1__NBNum/25/1\');">Num 25:1__NBMic/6/5\');">Mic 6:5__AN__GGJordan_3__PSJordan__EEJordan, called by the Arabs El Sharia, takes its rise in Anti-Libanus, about twelve miles north of Cæsarea Philippi, now Banias; and, having run about twelve miles southward, it receives a considerable stream, which is now called the Moiet Hasbeia. About 15 miles farther, it forms the waters of Merom or Semechon, now Houle; and, after running about 28 miles more, it passes through the lake of Gennesareth, and thence runs southward till it loses itself in the Dead Sea; its whole course being about 160 miles.</TD></TR>';

stringArray[15] = 'And as they that bare the ark were come unto Jordan, and __PNthe_feet_1__SHthe feet</a> of the priests that bare the ark were dipped in the brim of the water, (for __PNJordan_overfloweth_2__SHJordan overfloweth</a> all his banks __PNall_the_time_3__SHall the time</a> of harvest,)__CPthe_feet_1__PSthe feet__FFJos/3/13\');">Jos 3:13__NBIsa/26/6\');">Isa 26:6__AN__GHJordan_overfloweth_2__PSJordan overfloweth__FEThe ordinary current of the Jordan, near where the Israelites crossed, is said by Maundrell, to be about twenty yards across, deeper than a man\'s height, and so rapid, that there is no swimming against it. It has, however, two banks; the first, or inner one, is that of the river in its natural state, and the second, or outer one, about a furlong distant, is that of its overflowings, which it does when the summer\'s sun has melted the snow on mount Lebanon and Hermon, in the months of March and April. And this was the time which God chose that the Israelites should pass over it; that a miraculous interposition might be necessary; and that, by the miracle, they might be convinced of his omnipotence. __NAJos/4/18\');">Jos 4:18__NB1Ch/12/15\');">1Ch 12:15__NBJer/12/5\');">Jer 12:5__NBJer/49/19\');">Jer 49:19__AN__GGall_the_time_3__PSall the time__FFJos/5/10\');">Jos 5:10-12__NBLev/23/10\');">Lev 23:10-16__NBDeu/16/1\');">Deu 16:1-9__EN';
