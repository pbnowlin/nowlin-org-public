<script type="text/javascript">
var Content = new Array();
Book = "Jos";
Chapter = "15";
Content[1]="[This] then was the lot of the tribe of the children of Judah by their families; [even] to the border of Edom the wilderness of Zin southward [was] the uttermost part of the south coast.";
Content[2]="And their south border was from the shore of the salt sea, from the bay that looketh southward:";
Content[3]="And it went out to the south side to Maalehacrabbim, and passed along to Zin, and ascended up on the south side unto Kadeshbarnea, and passed along to Hezron, and went up to Adar, and fetched a compass to Karkaa:";
Content[4]="[From thence] it passed toward Azmon, and went out unto the river of Egypt; and the goings out of that coast were at the sea: this shall be your south coast.";
Content[5]="And the east border [was] the salt sea, [even] unto the end of Jordan. And [their] border in the north quarter [was] from the bay of the sea at the uttermost part of Jordan:";
Content[6]="And the border went up to Bethhogla, and passed along by the north of Betharabah; and the border went up to the stone of Bohan the son of Reuben:";
Content[7]="And the border went up toward Debir from the valley of Achor, and so northward, looking toward Gilgal, that [is] before the going up to Adummim, which [is] on the south side of the river: and the border passed toward the waters of Enshemesh, and the goings out thereof were at Enrogel:";
Content[8]="And the border went up by the valley of the son of Hinnom unto the south side of the Jebusite; the same [is] Jerusalem: and the border went up to the top of the mountain that [lieth] before the valley of Hinnom westward, which [is] at the end of the valley of the giants northward:";
Content[9]="And the border was drawn from the top of the hill unto the fountain of the water of Nephtoah, and went out to the cities of mount Ephron; and the border was drawn to Baalah, which [is] Kirjathjearim:";
Content[10]="And the border compassed from Baalah westward unto mount Seir, and passed along unto the side of mount Jearim, which [is] Chesalon, on the north side, and went down to Bethshemesh, and passed on to Timnah:";
Content[11]="And the border went out unto the side of Ekron northward: and the border was drawn to Shicron, and passed along to mount Baalah, and went out unto Jabneel; and the goings out of the border were at the sea.";
Content[12]="And the west border [was] to the great sea, and the coast [thereof]. This [is] the coast of the children of Judah round about according to their families.";
Content[13]="And unto Caleb the son of Jephunneh he gave a part among the children of Judah, according to the commandment of the LORD to Joshua, [even] the city of Arba the father of Anak, which [city is] Hebron.";
Content[14]="And Caleb drove thence the three sons of Anak, Sheshai, and Ahiman, and Talmai, the children of Anak.";
Content[15]="And he went up thence to the inhabitants of Debir: and the name of Debir before [was] Kirjathsepher.";
Content[16]="And Caleb said, He that smiteth Kirjathsepher, and taketh it, to him will I give Achsah my daughter to wife.";
Content[17]="And Othniel the son of Kenaz, the brother of Caleb, took it: and he gave him Achsah his daughter to wife.";
Content[18]="And it came to pass, as she came [unto him], that she moved him to ask of her father a field: and she lighted off [her] ass; and Caleb said unto her, What wouldest thou?";
Content[19]="Who answered, Give me a blessing; for thou hast given me a south land; give me also springs of water. And he gave her the upper springs, and the nether springs.";
Content[20]="This [is] the inheritance of the tribe of the children of Judah according to their families.";
Content[21]="And the uttermost cities of the tribe of the children of Judah toward the coast of Edom southward were Kabzeel, and Eder, and Jagur,";
Content[22]="And Kinah, and Dimonah, and Adadah,";
Content[23]="And Kedesh, and Hazor, and Ithnan,";
Content[24]="Ziph, and Telem, and Bealoth,";
Content[25]="And Hazor, Hadattah, and Kerioth, [and] Hezron, which [is] Hazor,";
Content[26]="Amam, and Shema, and Moladah,";
Content[27]="And Hazargaddah, and Heshmon, and Bethpalet,";
Content[28]="And Hazarshual, and Beersheba, and Bizjothjah,";
Content[29]="Baalah, and Iim, and Azem,";
Content[30]="And Eltolad, and Chesil, and Hormah,";
Content[31]="And Ziklag, and Madmannah, and Sansannah,";
Content[32]="And Lebaoth, and Shilhim, and Ain, and Rimmon: all the cities [are] twenty and nine, with their villages:";
Content[33]="[And] in the valley, Eshtaol, and Zoreah, and Ashnah,";
Content[34]="And Zanoah, and Engannim, Tappuah, and Enam,";
Content[35]="Jarmuth, and Adullam, Socoh, and Azekah,";
Content[36]="And Sharaim, and Adithaim, and Gederah, and Gederothaim; fourteen cities with their villages:";
Content[37]="Zenan, and Hadashah, and Migdalgad,";
Content[38]="And Dilean, and Mizpeh, and Joktheel,";
Content[39]="Lachish, and Bozkath, and Eglon,";
Content[40]="And Cabbon, and Lahmam, and Kithlish,";
Content[41]="And Gederoth, Bethdagon, and Naamah, and Makkedah; sixteen cities with their villages:";
Content[42]="Libnah, and Ether, and Ashan,";
Content[43]="And Jiphtah, and Ashnah, and Nezib,";
Content[44]="And Keilah, and Achzib, and Mareshah; nine cities with their villages:";
Content[45]="Ekron, with her towns and her villages:";
Content[46]="From Ekron even unto the sea, all that [lay] near Ashdod, with their villages:";
Content[47]="Ashdod with her towns and her villages, Gaza with her towns and her villages, unto the river of Egypt, and the great sea, and the border [thereof]:";
Content[48]="And in the mountains, Shamir, and Jattir, and Socoh,";
Content[49]="And Dannah, and Kirjathsannah, which [is] Debir,";
Content[50]="And Anab, and Eshtemoh, and Anim,";
Content[51]="And Goshen, and Holon, and Giloh; eleven cities with their villages:";
Content[52]="Arab, and Dumah, and Eshean,";
Content[53]="And Janum, and Bethtappuah, and Aphekah,";
Content[54]="And Humtah, and Kirjatharba, which [is] Hebron, and Zior; nine cities with their villages:";
Content[55]="Maon, Carmel, and Ziph, and Juttah,";
Content[56]="And Jezreel, and Jokdeam, and Zanoah,";
Content[57]="Cain, Gibeah, and Timnah; ten cities with their villages:";
Content[58]="Halhul, Bethzur, and Gedor,";
Content[59]="And Maarath, and Bethanoth, and Eltekon; six cities with their villages:";
Content[60]="Kirjathbaal, which [is] Kirjathjearim, and Rabbah; two cities with their villages:";
Content[61]="In the wilderness, Betharabah, Middin, and Secacah,";
Content[62]="And Nibshan, and the city of Salt, and Engedi; six cities with their villages.";
Content[63]="As for the Jebusites the inhabitants of Jerusalem, the children of Judah could not drive them out: but the Jebusites dwell with the children of Judah at Jerusalem unto this day.";
</script>
