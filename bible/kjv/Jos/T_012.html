stringArray[3] = 'And from the plain to the __PNsea_of_Chinneroth_1__SHsea of Chinneroth</a> on the east, and unto __PNthe_sea_2__SHthe sea</a> of the plain, [even] the salt sea on the east, the way to __PNBeth_jeshimoth_3__SHBethjeshimoth</a>; and from __PNthe_south_4__SHthe south</a>, under __PNAshdoth_pisgah_5__SHAshdothpisgah</a>:__CPsea_of_Chinneroth_1__PSsea of Chinneroth__EEThis inland sea, or rather lake, which drives its several names, the Lake of Tiberias, Sea of Galilee, Lake of Gennesareth, from the territory which forms its western and south-western border, is computed to be between seventeen and eighteen miles in length, and from five to six in breadth. The waters of this lake, which are sweet and agreeable, lie in a deep basin, surrounded with lofty hills, except at the north and south, where it is a plain country or level. There is a current through the whole lake even to the shore; and the Jordan through it is discernible by the smoothness of the surface in that part. Its appearance from the north- western extremity is said by Mr. Buckingham to be exceedingly grand; but the barren aspect of the mountains on each side, and the total absence of wood, give a cast of dullness to the picture. __NAJos/11/2\');">Jos 11:2__NBDeu/3/17\');">Deu 3:17__NBJhn/6/1\');">Jhn 6:1__AN; Sea of Tiberias.__GHthe_sea_2__PSthe sea__EFJos/3/16\');">Jos 3:16__NBJos/15/2\');">Jos 15:2__NRJos/15/5\');">5__NBGen/14/3\');">Gen 14:3__NBGen/19/25\');">Gen 19:25__NBDeu/3/17\');">Deu 3:17__AN__GGBeth_jeshimoth_3__PSBeth-jeshimoth__FFJos/13/20\');">Jos 13:20__AN__GHthe_south_4__PSthe south__FEor, Teman.__GGAshdoth_pisgah_5__PSAshdoth-pisgah__EEor, the springs of Pisgah, or, the hill. __NANum/21/20\');">Num 21:20__NBDeu/3/17\');">Deu 3:17__AN; *marg:; __NADeu/4/49\');">Deu 4:49__EN';
