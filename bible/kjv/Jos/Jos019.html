Text[1] = 'And the second lot came forth to Simeon, [even] for the tribe of the children of Simeon according to their families: and their inheritance was within the inheritance of the children of Judah.';
Text[2] = 'And they had in their inheritance Beersheba, or Sheba, and Moladah,';
Text[3] = 'And Hazarshual, and Balah, and Azem,';
Text[4] = 'And Eltolad, and Bethul, and Hormah,';
Text[5] = 'And Ziklag, and Bethmarcaboth, and Hazarsusah,';
Text[6] = 'And Bethlebaoth, and Sharuhen; thirteen cities and their villages:';
Text[7] = 'Ain, Remmon, and Ether, and Ashan; four cities and their villages:';
Text[8] = 'And all the villages that [were] round about these cities to Baalathbeer, Ramath of the south. This [is] the inheritance of the tribe of the children of Simeon according to their families.';
Text[9] = 'Out of the portion of the children of Judah [was] the inheritance of the children of Simeon: for the part of the children of Judah was too much for them: therefore the children of Simeon had their inheritance within the inheritance of them.';
Text[10] = 'And the third lot came up for the children of Zebulun according to their families: and the border of their inheritance was unto Sarid:';
Text[11] = 'And their border went up toward the sea, and Maralah, and reached to Dabbasheth, and reached to the river that [is] before Jokneam;';
Text[12] = 'And turned from Sarid eastward toward the sunrising unto the border of Chislothtabor, and then goeth out to Daberath, and goeth up to Japhia,';
Text[13] = 'And from thence passeth on along on the east to Gittahhepher, to Ittahkazin, and goeth out to Remmonmethoar to Neah;';
Text[14] = 'And the border compasseth it on the north side to Hannathon: and the outgoings thereof are in the valley of Jiphthahel:';
Text[15] = 'And Kattath, and Nahallal, and Shimron, and Idalah, and Bethlehem: twelve cities with their villages.';
Text[16] = 'This [is] the inheritance of the children of Zebulun according to their families, these cities with their villages.';
Text[17] = '[And] the fourth lot came out to Issachar, for the children of Issachar according to their families.';
Text[18] = 'And their border was toward Jezreel, and Chesulloth, and Shunem,';
Text[19] = 'And Hapharaim, and Shion, and Anaharath,';
Text[20] = 'And Rabbith, and Kishion, and Abez,';
Text[21] = 'And Remeth, and Engannim, and Enhaddah, and Bethpazzez;';
Text[22] = 'And the coast reacheth to Tabor, and Shahazimah, and Bethshemesh; and the outgoings of their border were at Jordan: sixteen cities with their villages.';
Text[23] = 'This [is] the inheritance of the tribe of the children of Issachar according to their families, the cities and their villages.';
Text[24] = 'And the fifth lot came out for the tribe of the children of Asher according to their families.';
Text[25] = 'And their border was Helkath, and Hali, and Beten, and Achshaph,';
Text[26] = 'And Alammelech, and Amad, and Misheal; and reacheth to Carmel westward, and to Shihorlibnath;';
Text[27] = 'And turneth toward the sunrising to Bethdagon, and reacheth to Zebulun, and to the valley of Jiphthahel toward the north side of Bethemek, and Neiel, and goeth out to Cabul on the left hand,';
Text[28] = 'And Hebron, and Rehob, and Hammon, and Kanah, [even] unto great Zidon;';
Text[29] = 'And [then] the coast turneth to Ramah, and to the strong city Tyre; and the coast turneth to Hosah; and the outgoings thereof are at the sea from the coast to Achzib:';
Text[30] = 'Ummah also, and Aphek, and Rehob: twenty and two cities with their villages.';
Text[31] = 'This [is] the inheritance of the tribe of the children of Asher according to their families, these cities with their villages.';
Text[32] = 'The sixth lot came out to the children of Naphtali, [even] for the children of Naphtali according to their families.';
Text[33] = 'And their coast was from Heleph, from Allon to Zaanannim, and Adami, Nekeb, and Jabneel, unto Lakum; and the outgoings thereof were at Jordan:';
Text[34] = 'And [then] the coast turneth westward to Aznothtabor, and goeth out from thence to Hukkok, and reacheth to Zebulun on the south side, and reacheth to Asher on the west side, and to Judah upon Jordan toward the sunrising.';
Text[35] = 'And the fenced cities [are] Ziddim, Zer, and Hammath, Rakkath, and Chinnereth,';
Text[36] = 'And Adamah, and Ramah, and Hazor,';
Text[37] = 'And Kedesh, and Edrei, and Enhazor,';
Text[38] = 'And Iron, and Migdalel, Horem, and Bethanath, and Bethshemesh; nineteen cities with their villages.';
Text[39] = 'This [is] the inheritance of the tribe of the children of Naphtali according to their families, the cities and their villages.';
Text[40] = '[And] the seventh lot came out for the tribe of the children of Dan according to their families.';
Text[41] = 'And the coast of their inheritance was Zorah, and Eshtaol, and Irshemesh,';
Text[42] = 'And Shaalabbin, and Ajalon, and Jethlah,';
Text[43] = 'And Elon, and Thimnathah, and Ekron,';
Text[44] = 'And Eltekeh, and Gibbethon, and Baalath,';
Text[45] = 'And Jehud, and Beneberak, and Gathrimmon,';
Text[46] = 'And Mejarkon, and Rakkon, with the border before Japho.';
Text[47] = 'And the coast of the children of Dan went out [too little] for them: therefore the children of Dan went up to fight against Leshem, and took it, and smote it with the edge of the sword, and possessed it, and dwelt therein, and called Leshem, Dan, after the name of Dan their father.';
Text[48] = 'This [is] the inheritance of the tribe of the children of Dan according to their families, these cities with their villages.';
Text[49] = 'When they had made an end of dividing the land for inheritance by their coasts, the children of Israel gave an inheritance to Joshua the son of Nun among them:';
Text[50] = 'According to the word of the LORD they gave him the city which he asked, [even] Timnathserah in mount Ephraim: and he built the city, and dwelt therein.';
Text[51] = 'These [are] the inheritances, which Eleazar the priest, and Joshua the son of Nun, and the heads of the fathers of the tribes of the children of Israel, divided for an inheritance by lot in Shiloh before the LORD, at the door of the tabernacle of the congregation. So they made an end of dividing the country.';
