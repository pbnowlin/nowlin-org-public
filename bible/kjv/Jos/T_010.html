stringArray[6] = 'And the men of Gibeon sent unto Joshua __PNto_the_camp_1__SHto the camp</a> to Gilgal, saying, __PNSlack_2__SHSlack</a> not thy hand __PNfrom_thy_3__SHfrom thy</a> servants; come up to us quickly, and save us, and help us: for all the kings of the Amorites that dwell in the __PNmountains_4__SHmountains</a> are gathered together against us.__CPto_the_camp_1__PSto the camp__FFJos/5/10\');">Jos 5:10__NBJos/9/6\');">Jos 9:6__AN__GHSlack_2__PSSlack__EF2Ki/4/24\');">2Ki 4:24__AN__GGfrom_thy_3__PSfrom thy__FFJos/9/15\');">Jos 9:15__NRJos/9/24\');">24__NRJos/9/25\');">25__NBIsa/33/22\');">Isa 33:22__AN__GHmountains_4__PSmountains__EFJos/21/11\');">Jos 21:11__NBDeu/1/15\');">Deu 1:15__NBPsa/125/2\');">Psa 125:2__NBLuk/1/39\');">Luk 1:39__EN';

stringArray[10] = 'And __PNthe_LORD_1__SHthe LORD</a> discomfited them before Israel, and slew them with a great slaughter __PNat_Gibeon_2__SHat Gibeon</a>, and chased them along the way that goeth up to __PNBeth_horon_3__SHBethhoron</a>, and smote them to __PNAzekah_4__SHAzekah</a>, and unto __PNMakkedah_5__SHMakkedah</a>.__CPthe_LORD_1__PSthe LORD__FFJos/11/8\');">Jos 11:8__NBJdg/4/15\');">Jdg 4:15__NB1Sa/7/10\');">1Sa 7:10-12__NB2Ch/14/12\');">2Ch 14:12__NBPsa/18/14\');">Psa 18:14__NBPsa/44/3\');">Psa 44:3__NBPsa/78/55\');">Psa 78:55__AN__GHat_Gibeon_2__PSat Gibeon__EFIsa/28/21\');">Isa 28:21__AN__GGBeth_horon_3__PSBeth-horon__FFJos/16/3\');">Jos 16:3__NRJos/16/5\');">5__NBJos/21/22\');">Jos 21:22__NB1Sa/13/18\');">1Sa 13:18__AN__GHAzekah_4__PSAzekah__EFJos/10/11\');">Jos 10:11__NBJos/15/35\');">Jos 15:35__NBJer/34/7\');">Jer 34:7__AN__GGMakkedah_5__PSMakkedah__FFJos/10/28\');">Jos 10:28__NBJos/12/16\');">Jos 12:16__NBJos/15/41\');">Jos 15:41__EN';
stringArray[11] = 'And it came to pass, as they fled from before Israel, [and] were in the going down to Bethhoron, that __PNthe_LORD_1__SHthe LORD</a> cast down great stones from heaven upon them unto Azekah, and they died: [they were] more which died with hailstones than [they] whom the children of Israel slew with the sword.__CPthe_LORD_1__PSthe LORD__FFGen/19/24\');">Gen 19:24__NBExd/9/22\');">Exd 9:22-26__NBJdg/5/20\');">Jdg 5:20__NBPsa/11/6\');">Psa 11:6__NBPsa/18/12\');">Psa 18:12-14__NBPsa/77/17\');">Psa 77:17__NRPsa/77/18\');">18__NBIsa/28/2\');">Isa 28:2__NBIsa/30/30\');">Isa 30:30__NBEze/13/11\');">Eze 13:11__NBRev/11/19\');">Rev 11:19__NBRev/16/21\');">Rev 16:21__EN';
stringArray[12] = 'Then spake Joshua to the LORD in the day when the LORD delivered up the Amorites before the children of Israel, and he said in the sight of Israel, __PNSun_1__SHSun</a>, __PNstand_thou_2__SHstand thou</a> still upon Gibeon; and thou, Moon, in the valley of __PNAjalon_3__SHAjalon</a>.__CPSun_1__PSSun__EE"Joshua doubtless acted, on this occasion, by an immediate impulse upon his mind from the Spirit of God. The terms here employed to record the miracle, agree with the accustomed manner in which the the motions of the earth and sun are described in our own day. The sun apparently moves, but really is stationary; while the diurnal movement of the earth on its axis is by us unnoticed, and would not have been known except by astronomical science. The sun appeared to the Israelites over Gibeon, and the moon over the valley of Ajalon, and there they stayed in their course for ""a whole day."" Many vain enquiries have been made concerning the way in which this miracle was wrought, and many difficulties and objections have been urged against understanding it literally. But the fact is authenticated by the Divine testimony; and the manner in which it was accomplished lies entirely out of our province, because beyond our comprehension. __NAJos/10/13\');">Jos 10:13__NBDeu/4/19\');">Deu 4:19__NBDeu/17/3\');">Deu 17:3__NBJob/9/7\');">Job 9:7__NBJob/31/26\');">Job 31:26__NRJob/31/27\');">27__NBPsa/19/4\');">Psa 19:4__NBPsa/74/16\');">Psa 74:16__NBPsa/148/3\');">Psa 148:3__AN; I"__GHstand_thou_2__PSstand thou__FEHeb. be silent. __NAHab/2/20\');">Hab 2:20__AN; *marg:; __NAZec/2/13\');">Zec 2:13__AN__GGAjalon_3__PSAjalon__FFJos/19/42\');">Jos 19:42__NBJdg/12/12\');">Jdg 12:12__AN; Aijalon.</TD></TR>';

stringArray[31] = 'And Joshua passed from Libnah, and all Israel with him, unto __PNLachish_1__SHLachish</a>, and encamped against it, and fought against it:__CPLachish_1__PSLachish__EELachish was also situated in the south of Judah, seven miles south from Eleutheropolis, according to Eusebius and Jerome. It appears to have been anciently a very strong place; for though the people were panic struck, and the Israelites flushed with success, yet Joshua could not reduce it till the second day; and the king of Assyria afterwards was obliged to raise the siege. __NAJos/10/3\');">Jos 10:3__NRJos/10/5\');">5__NBJos/12/11\');">Jos 12:11__NBJos/15/39\');">Jos 15:39__NB2Ki/19/8\');">2Ki 19:8__NB2Ch/11/9\');">2Ch 11:9__NBIsa/37/8\');">Isa 37:8__NBMic/1/13\');">Mic 1:13__EN';

stringArray[37] = 'And they took it, and smote it with the edge of the sword, and __PNthe_king_1__SHthe king</a> thereof, and all the cities thereof, and all the souls that [were] therein; he left none remaining, __PNaccording_2__SHaccording</a> to all that he had done to Eglon; but destroyed it utterly, and all the souls that [were] therein.__CPthe_king_1__PSthe king__EEFrom __NAJos/10/23\');">Jos 10:23__AN, we learn that the king of Hebron was one of the five whom Joshua slew and hanged on five trees at Makkedah. This slaying of the king of Hebron, therefore, must either refer to what had already been done, or the Hebronites had set up another, whom Joshua now slew when he took the city.__GHaccording_2__PSaccording__EFJos/10/35\');">Jos 10:35__EN';
stringArray[38] = 'And Joshua returned, and all Israel with him, to __PNDebir_1__SHDebir</a>; and fought against it:__CPDebir_1__PSDebir__EEDebir was situated in the south of the tribe of Judah, near Hebron. The expression of Joshua\'s returning to Debir, probably denotes, that having carried his conquests in the southern parts as far as Gaza, (__NAJos/10/41\');">Jos 10:41__AN,) which was in the south-west angle of Canaan, he then marched back to besiege Debir. __NAJos/12/13\');">Jos 12:13__NBJos/15/15\');">Jos 15:15__NRJos/15/49\');">49__NBJos/21/15\');">Jos 21:15__NBJdg/1/11\');">Jdg 1:11-15__EN';
