<script type="text/javascript">
var stringArray = new Array();
stringArray[1] = 'And the whole congregation of the children of Israel assembled together at __PNShiloh_1__SHShiloh</a>, and __PNset_up_2__SHset up</a> the tabernacle of the congregation there. And the land was subdued before them.__CPShiloh_1__PSShiloh__EEShiloh was situated on a hill in the tribe of Ephraim, though near the borders of Benjamin, about fifteen miles north of Jerusalem, and, according to Eusebius, twelve, or according to Jerome, ten miles (south) from Shechem or Nablous. It was but a little north from Bethel or Ai, and near the road from Shechem to Jerusalem. (__NAJdg/21/19\');">Jdg 21:19__AN.) In Jerome\'s time, Shiloh was ruined; and nothing remarkable was extant, but the foundations of the altar of burnt offerings which had been erected when the tabernacle stood there. __NAJos/19/51\');">Jos 19:51__NBJos/21/2\');">Jos 21:2__NBJos/22/9\');">Jos 22:9__AN__GHset_up_2__PSset up__EFJdg/18/31\');">Jdg 18:31__NB1Sa/1/3\');">1Sa 1:3__NR1Sa/1/24\');">24__NB1Sa/4/3\');">1Sa 4:3__NR1Sa/4/4\');">4__NB1Ki/2/27\');">1Ki 2:27__NB1Ki/14/2\');">1Ki 14:2__NR1Ki/14/4\');">4__NBPsa/78/66\');">Psa 78:66__NBJer/7/12\');">Jer 7:12-14__NBJer/26/6\');">Jer 26:6__EN';
stringArray[2] = 'And there remained among the children of Israel seven tribes, which had not yet received their inheritance.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[3] = 'And Joshua said unto the children of Israel, __PNHow_long_are_1__SHHow long [are]</a> ye slack to go to possess the land, which the LORD God of your fathers hath given you?__CPHow_long_are_1__PSHow long are__FFJdg/18/9\');">Jdg 18:9__NBPro/2/2\');">Pro 2:2-6__NBPro/10/4\');">Pro 10:4__NBPro/13/4\');">Pro 13:4__NBPro/15/19\');">Pro 15:19__NBEcc/9/10\');">Ecc 9:10__NBZep/3/16\');">Zep 3:16__NBMat/20/6\');">Mat 20:6__NBJhn/6/27\');">Jhn 6:27__NBPhl/3/13\');">Phl 3:13__NRPhl/3/14\');">14__NB2Pe/1/10\');">2Pe 1:10__NR2Pe/1/11\');">11__EN';
stringArray[4] = 'Give out from among you __PNthree_1__SHthree</a> men for [each] tribe: and I will send them, and they shall rise, and go through the land, and __PNdescribe_2__SHdescribe</a> it according to the inheritance of them; and they shall come [again] to me.__CPthree_1__PSthree__FFJos/18/3\');">Jos 18:3__NBJos/3/12\');">Jos 3:12__NBJos/4/2\');">Jos 4:2__NBNum/1/4\');">Num 1:4__NBNum/13/2\');">Num 13:2__AN__GHdescribe_2__PSdescribe__EFJos/18/6\');">Jos 18:6__NRJos/18/9\');">9__EN';
stringArray[5] = 'And they shall divide it into seven parts: __PNJudah_shall_1__SHJudah shall</a> abide in their coast on the south, and __PNthe_house_2__SHthe house</a> of Joseph shall abide in their coasts on the north.__CPJudah_shall_1__PSJudah shall__FFJos/15/1\');">Jos 15:1-12__NBJos/19/1\');">Jos 19:1-9__AN__GHthe_house_2__PSthe house__EFJos/16/\');">Jos 16__AN;__NAJos/17/\');">17__EN';
stringArray[6] = 'Ye shall therefore describe the land [into] seven parts, and bring [the description] hither to me, __PNthat_I_may_cast_1__SHthat I may cast</a> lots for you here before the LORD our God.__CPthat_I_may_cast_1__PSthat I may cast__FFJos/18/8\');">Jos 18:8__NRJos/18/10\');">10__NBJos/14/2\');">Jos 14:2__NBNum/26/54\');">Num 26:54__NRNum/26/55\');">55__NBNum/33/54\');">Num 33:54__NBNum/34/13\');">Num 34:13__NBPsa/105/11\');">Psa 105:11__NBPro/16/33\');">Pro 16:33__NBPro/18/18\');">Pro 18:18__NBAct/13/19\');">Act 13:19__EN';
stringArray[7] = 'But __PNthe_Levites_1__SHthe Levites</a> have no part among you; for the priesthood of the LORD [is] their inheritance: __PNand_Gad_2__SHand Gad</a>, and Reuben, and half the tribe of Manasseh, have received their inheritance beyond Jordan on the east, which Moses the servant of the LORD gave them.__CPthe_Levites_1__PSthe Levites__FFJos/13/14\');">Jos 13:14__NRJos/13/33\');">33__NBNum/18/20\');">Num 18:20__NRNum/18/23\');">23__NBDeu/10/9\');">Deu 10:9__NBDeu/18/1\');">Deu 18:1__NRDeu/18/2\');">2__AN__GHand_Gad_2__PSand Gad__EFJos/13/8\');">Jos 13:8-31__NBNum/32/29\');">Num 32:29-41__NBDeu/3/12\');">Deu 3:12-17__NBDeu/4/47\');">Deu 4:47__NRDeu/4/48\');">48__EN';
stringArray[8] = 'And the men arose, and went away: and Joshua charged them that went to describe the land, saying, __PNGo_1__SHGo</a> and walk through the land, and describe it, and come again to me, __PNthat_I_may_here_2__SHthat I may here</a> cast lots for you before the LORD in Shiloh.__CPGo_1__PSGo__FFGen/13/17\');">Gen 13:17__AN__GHthat_I_may_here_2__PSthat I may here__EFJos/18/6\');">Jos 18:6__NRJos/18/10\');">10__NBJos/7/16\');">Jos 7:16-18__NBJos/13/7\');">Jos 13:7__NBJos/14/1\');">Jos 14:1__NRJos/14/2\');">2__NBJos/15/1\');">Jos 15:1__NB1Sa/14/41\');">1Sa 14:41__NBAct/1/24\');">Act 1:24-26__NBRom/14/19\');">Rom 14:19__EN';
stringArray[9] = 'And the men went and passed through the land, and __PNdescribed_1__SHdescribed</a> it by cities __PNinto_seven_2__SHinto seven</a> parts in a book, and came [again] to Joshua to the host at Shiloh.__CPdescribed_1__PSdescribed__EEThe surveyors seem to have formed some kind of map of the country, as well as a description of it in writing. The Egyptians, from the situation of their fields, as annually overflowed by the Nile, acquired great skill in mensuration and land surveying; and some of the Israelites had, no doubt, learned these from them, without a knowledge of which they could not properly have divided the land. This is probably the first act of surveying on record.__GHinto_seven_2__PSinto seven__EFAct/13/19\');">Act 13:19__EN';
stringArray[10] = 'And Joshua __PNcast_lots_1__SHcast lots</a> for them in Shiloh __PNbefore_the_LORD_2__SHbefore the LORD</a>: and there Joshua divided the land unto the children of Israel according to their divisions.__CPcast_lots_1__PScast lots__FFJos/18/6\');">Jos 18:6__NRJos/18/8\');">8__NBPro/18/18\');">Pro 18:18__NBEze/47/22\');">Eze 47:22__NBEze/48/29\');">Eze 48:29__NBMat/27/35\');">Mat 27:35__NBAct/13/19\');">Act 13:19__AN__GHbefore_the_LORD_2__PSbefore the LORD__EFPsa/16/5\');">Psa 16:5__NRPsa/16/6\');">6__NBPsa/47/4\');">Psa 47:4__NBPsa/61/5\');">Psa 61:5__NBJhn/17/2\');">Jhn 17:2__NBAct/26/18\');">Act 26:18__NBCol/1/12\');">Col 1:12__EN';
stringArray[11] = 'And the lot of the tribe of the children of Benjamin came up according to their families: and the coast of their lot came forth __PNbetween_the_children_1__SHbetween the children</a> of Judah and the children of Joseph.__CPbetween_the_children_1__PSbetween the children__FFJos/15/1\');">Jos 15:1-8__NBJos/16/1\');">Jos 16:1-10__NBDeu/10/1\');">Deu 10:1-22__NBDeu/13/12\');">Deu 13:12__EN';
stringArray[12] = 'And their border on the north side was from Jordan; and the border went up to the side of __PNJericho_1__SHJericho</a> on the north side, and went up through the mountains westward; and the goings out thereof were at __PNthe_wilderness_2__SHthe wilderness</a> of Bethaven.__CPJericho_1__PSJericho__FFJos/2/1\');">Jos 2:1__NBJos/3/16\');">Jos 3:16__NBJos/6/1\');">Jos 6:1__NBJos/16/1\');">Jos 16:1__AN__GHthe_wilderness_2__PSthe wilderness__EFJos/7/2\');">Jos 7:2__NBHsa/4/15\');">Hsa 4:15__NBHsa/5/8\');">Hsa 5:8__NBHsa/10/5\');">Hsa 10:5__EN';
stringArray[13] = 'And the border went over from thence toward Luz, to the __PNside_of_Luz_1__SHside of Luz</a>, which [is] Bethel, southward; and the border descended to Atarothadar, near the hill that [lieth] on the south side of the nether __PNBeth_horon_2__SHBethhoron</a>.__CPside_of_Luz_1__PSside of Luz__FFJos/16/2\');">Jos 16:2__NBGen/28/19\');">Gen 28:19__NBJdg/1/22\');">Jdg 1:22-26__AN__GHBeth_horon_2__PSBeth-horon__EFJos/10/11\');">Jos 10:11__NBJos/16/3\');">Jos 16:3__NBJos/21/22\');">Jos 21:22__EN';
stringArray[14] = 'And the border was drawn [thence], and compassed the corner of the sea southward, from the hill that [lieth] before Bethhoron southward; and the goings out thereof were at __PNKirjath_baal_1__SHKirjathbaal</a>, which [is] Kirjathjearim, a city of the children of Judah: this [was] the west quarter.__CPKirjath_baal_1__PSKirjath-baal__FFJos/15/9\');">Jos 15:9__NRJos/15/60\');">60__NB1Sa/7/1\');">1Sa 7:1__NR1Sa/7/2\');">2__NB2Sa/6/2\');">2Sa 6:2__NB1Ch/13/5\');">1Ch 13:5__NR1Ch/13/6\');">6__EN';
stringArray[15] = 'And the south quarter [was] from the end of Kirjathjearim, and the border went out on the west, and went out to the well of waters of __PNNephtoah_1__SHNephtoah</a>:__CPNephtoah_1__PSNephtoah__FFJos/15/9\');">Jos 15:9__EN';
stringArray[16] = 'And the border came down to the end of the mountain that [lieth] before __PNthe_valley_of_the_son_1__SHthe valley of the son</a> of Hinnom, [and] which [is] in __PNthe_valley_of_the_giants_2__SHthe valley of the giants</a> on the north, and descended to the valley of Hinnom, to the side of __PNJebusi_3__SHJebusi</a> on the south, and descended to __PNEn_rogel_4__SHEnrogel</a>,__CPthe_valley_of_the_son_1__PSthe valley of the son__FFJos/15/8\');">Jos 15:8__NB2Ki/23/10\');">2Ki 23:10__NB2Ch/28/3\');">2Ch 28:3__NB2Ch/33/6\');">2Ch 33:6__NBIsa/30/33\');">Isa 30:33__NBJer/7/31\');">Jer 7:31__NRJer/7/32\');">32__NBJer/19/2\');">Jer 19:2__NRJer/19/6\');">6__NRJer/19/11\');">11__NBJer/32/35\');">Jer 32:35__AN__GHthe_valley_of_the_giants_2__PSthe valley of the giants__FESee on ch. __NAJos/15/8\');">Jos 15:8__NBJos/18/16\');">Jos 18:16__NB1Ch/14/9\');">1Ch 14:9__AN__GGJebusi_3__PSJebusi__EEMount zion, south of Jerusalem; for Jebusi or Jebus was the ancient name of that city. __NAJos/18/28\');">Jos 18:28__NBJos/15/63\');">Jos 15:63__NBJdg/1/8\');">Jdg 1:8__NRJdg/1/21\');">21__NBJdg/19/10\');">Jdg 19:10__AN__GHEn_rogel_4__PSEn-rogel__EFJos/15/7\');">Jos 15:7__NB2Sa/17/17\');">2Sa 17:17__NB1Ki/1/9\');">1Ki 1:9__EN';
stringArray[17] = 'And was drawn from the north, and went forth to __PNEn_shemesh_1__SHEnshemesh</a>, and went forth toward __PNGeliloth_2__SHGeliloth</a>, which [is] over against the going up of Adummim, and descended to __PNthe_stone_3__SHthe stone</a> of Bohan the son of Reuben,__CPEn_shemesh_1__PSEn-shemesh__EEThe fountain of the Sun; whether a town, or simply a fountain, is uncertain.__GHGeliloth_2__PSGeliloth__FE"Geliloth is probably the same as Gilgal; though as the word may signify border or limits, some think that it is probably not the proper name of a place: ""And went forth towards the borders which are over against the ascent to Adummim."" Others render Geliloth circuits or roundings, or the hills about Jordan, tumuli Jordanis. Vulgate: pertransit usque ad tumulos."__GGthe_stone_3__PSthe stone__FFJos/15/6\');">Jos 15:6__EN';
stringArray[18] = 'And passed along toward the side over against __PNArabah_1__SHArabah</a> northward, and went down unto Arabah:__CPArabah_1__PSArabah__EEor, the plain. __NAJos/15/6\');">Jos 15:6__NRJos/15/61\');">61__EN';
stringArray[19] = 'And the border passed along to the side of Bethhoglah northward: and the outgoings of the border were at the north __PNbay_1__SHbay</a> of __PNthe_salt_2__SHthe salt</a> sea at the south end of Jordan: __PNthis_was_the_3__SHthis [was] the</a> south coast.__CPbay_1__PSbay__EEHeb. tongue. __NAJos/15/2\');">Jos 15:2__AN; *marg:; __NAIsa/11/15\');">Isa 11:15__AN__GHthe_salt_2__PSthe salt__EFJos/3/16\');">Jos 3:16__NBJos/12/3\');">Jos 12:3__NBGen/14/3\');">Gen 14:3__NBGen/19/25\');">Gen 19:25__NBNum/34/3\');">Num 34:3__NBDeu/3/17\');">Deu 3:17__AN__GGthis_was_the_3__PSthis was the__EE"The borders of this tribe on the north were the same as those of Ephraim on the south, and his southern boundaries the same as the northern borders of Judah; but drawn from west to east, instead of from east to west (__NAJos/15/1\');">Jos 15:1-12__NBJos/16/\');">Jos 16__AN.) As the inheritance of Benjamin did not extend to the Mediterranean sea, and no other sea or lake is known to have been in those parts, perhaps this depression, ""compassed the corner of the sea southward,"" (__NAJos/18/14\');">Jos 18:14__AN,) should be rendered, ""made a circuit on the side next the sea towards the south;"" for it seems to connect the northern border, in the preceding verses, with the southern which follows."</TD></TR>';
stringArray[20] = 'And Jordan was the border of it on the east side. This [was] the inheritance of the children of Benjamin, by the coasts thereof round about, according to their families.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[21] = 'Now the cities of the tribe of the children of Benjamin according to their families were __PNJericho_1__SHJericho</a>, and __PNBeth_hoglah_2__SHBethhoglah</a>, and the valley of Keziz,__CPJericho_1__PSJericho__FFJos/18/12\');">Jos 18:12__NBJos/2/1\');">Jos 2:1__NBJos/6/1\');">Jos 6:1__NBLuk/10/30\');">Luk 10:30__NBLuk/19/1\');">Luk 19:1__AN__GHBeth_hoglah_2__PSBeth-hoglah__EFJos/18/19\');">Jos 18:19__NBJos/15/6\');">Jos 15:6__EN';
stringArray[22] = 'And __PNBeth_arabah_1__SHBetharabah</a>, and __PNZemaraim_2__SHZemaraim</a>, and __PNBeth_el_3__SHBethel</a>,__CPBeth_arabah_1__PSBeth-arabah__FFJos/18/18\');">Jos 18:18__NBJos/15/6\');">Jos 15:6__AN__GHZemaraim_2__PSZemaraim__EFGen/10/18\');">Gen 10:18__NB2Ch/13/4\');">2Ch 13:4__AN__GGBeth_el_3__PSBeth-el__FF1Ki/12/29\');">1Ki 12:29-32__EN';
stringArray[23] = 'And Avim, and Parah, and __PNOphrah_1__SHOphrah</a>,__CPOphrah_1__PSOphrah__EESituated, according to Eusebius, five miles east of Bethel. __NA1Sa/13/17\');">1Sa 13:17__EN';
stringArray[24] = 'And Chepharhaammonai, and __PNOphni_1__SHOphni</a>, and __PNGaba_2__SHGaba</a>; twelve cities with their villages:__CPOphni_1__PSOphni__EEProbably the same as Gophna ([\'Ayin] being often pronounced as G); which, according to Josephus, was about fifteen miles from Jerusalem, towards Shechem, says Eusebius, (Onom. in [pharaux botrous.])__GHGaba_2__PSGaba__FEGaba or Geba, according to Josephus, was not far from Rama, forty stadia from Jerusalem, and, according to Eusebius, five miles from Gophna, towards Shechem. __NAJos/21/17\');">Jos 21:17__NBEzr/2/26\');">Ezr 2:26__NBNeh/7/30\');">Neh 7:30__EN';
stringArray[25] = '__PNGibeon_1__SHGibeon</a>, and __PNRamah_2__SHRamah</a>, and __PNBeeroth_3__SHBeeroth</a>,__CPGibeon_1__PSGibeon__FFJos/9/17\');">Jos 9:17__NBJos/10/2\');">Jos 10:2__NB1Ki/3/4\');">1Ki 3:4__NR1Ki/3/5\');">5__NB1Ki/9/2\');">1Ki 9:2__NBIsa/28/21\');">Isa 28:21__AN__GHRamah_2__PSRamah__FESituated, according to Eusebius, six miles from Jerusalem towards Bethel; though Jerome places it near Gaba, seven miles from Jerusalem. __NA1Sa/1/1\');">1Sa 1:1__AN; Ramathaim-zophim. __NAJos/7/17\');">Jos 7:17__NBJos/15/34\');">Jos 15:34__NBJer/31/15\');">Jer 31:15__NBMat/27/57\');">Mat 27:57__AN; Arimathea.__GGBeeroth_3__PSBeeroth__EEEusebius says Beeroth was seven miles from Jerusalem, towards Nicopolis or Emmaus. Jerome, however, reads Neapolis or Shechem; but Reland prefers the former.</TD></TR>';
stringArray[26] = 'And __PNMizpeh_1__SHMizpeh</a>, and __PNChephirah_2__SHChephirah</a>, and Mozah,__CPMizpeh_1__PSMizpeh__EESituated not far from Rama, forty stadia from Jerusalem. __NAJdg/10/17\');">Jdg 10:17__AN__GHChephirah_2__PSChephirah__EFJos/9/17\');">Jos 9:17__NBEzr/2/25\');">Ezr 2:25__EN';
stringArray[27] = 'And Rekem, and Irpeel, and Taralah,__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[28] = 'And __PNZelah_1__SHZelah</a>, Eleph, and __PNJebusi_2__SHJebusi</a>, which [is] Jerusalem, __PNGibeath_3__SHGibeath</a>, [and] Kirjath; fourteen cities with their villages. This [is] the inheritance of the children of Benjamin __PNaccording_4__SHaccording</a> to their families.__CPZelah_1__PSZelah__FF2Sa/21/14\');">2Sa 21:14__AN__GHJebusi_2__PSJebusi__EFJos/18/16\');">Jos 18:16__NBJos/15/8\');">Jos 15:8__NRJos/15/63\');">63__NB2Sa/5/8\');">2Sa 5:8__AN__GGGibeath_3__PSGibeath__FFJdg/19/12\');">Jdg 19:12-15__NBJdg/20/4\');">Jdg 20:4__NRJdg/20/5\');">5__NB1Sa/10/26\');">1Sa 10:26__NB1Sa/13/15\');">1Sa 13:15__NR1Sa/13/16\');">16__NBIsa/10/29\');">Isa 10:29__NBHsa/10/9\');">Hsa 10:9__AN; Gibeah.__GHaccording_4__PSaccording__EFNum/26/54\');">Num 26:54__NBNum/33/54\');">Num 33:54__EN';
