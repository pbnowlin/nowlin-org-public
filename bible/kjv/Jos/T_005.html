stringArray[2] = 'At that time the LORD said unto Joshua, Make thee __PNsharp_knives_1__SHsharp knives</a>, and __PNcircumcise_2__SHcircumcise</a> again the children of Israel the second time.__CPsharp_knives_1__PSsharp knives__EEor, knives of flints. Before the use of iron was common, all the nations of the earth had their edge tools made of stones, flints, etc. Our ancestors had their arrows and spearheads made of flint; which are frequently turned up by the plough. And even when iron became more common, stone knives seem to have been preferred for making incisions in the human body. The Egyptians used such to open the bodies for embalming; and the tribe of Alnajab in Ethiopia, who follow the Mosaic institution, perform the rite of circumcision, according to Ludolf, cultris lapidibus, with knives made of stone.__GHcircumcise_2__PScircumcise__EFGen/17/10\');">Gen 17:10-14__NBDeu/10/16\');">Deu 10:16__NBDeu/30/6\');">Deu 30:6__NBRom/2/29\');">Rom 2:29__NBRom/4/11\');">Rom 4:11__NBCol/2/11\');">Col 2:11__EN';
stringArray[3] = 'And __PNJoshua_1__SHJoshua</a> made him sharp knives, and circumcised the children of Israel at __PNthe_hill_of_the_foreskins_2__SHthe hill of the foreskins</a>.__CPJoshua_1__PSJoshua__FFGen/17/23\');">Gen 17:23-27__NBMat/16/24\');">Mat 16:24__AN__GHthe_hill_of_the_foreskins_2__PSthe hill of the foreskins__FEor, Gibeah haaraloth.</TD></TR>';

stringArray[5] = 'Now all the people that came out were circumcised: but all the people [that were] born in the wilderness by the way as they came forth out of Egypt, [them] __PNthey_had_not_1__SHthey had not</a> circumcised.__CPthey_had_not_1__PSthey had not__FFDeu/12/8\');">Deu 12:8__NRDeu/12/9\');">9__NBHsa/6/6\');">Hsa 6:6__NRHsa/6/7\');">7__NBMat/12/7\');">Mat 12:7__NBRom/2/26\');">Rom 2:26__NB1Cr/7/19\');">1Cr 7:19__NBGal/5/6\');">Gal 5:6__NBGal/6/15\');">Gal 6:15__EN';
stringArray[6] = 'For the children of Israel __PNwalked_1__SHwalked</a> forty years in the wilderness, till all the people [that were] men of war, which came out of Egypt, were consumed, because they obeyed not the voice of the LORD: unto whom the LORD __PNsware_that_2__SHsware that</a> he would not shew them the land, which the LORD sware unto their fathers that he would give us, __PNa_land_3__SHa land</a> that floweth with milk and honey.__CPwalked_1__PSwalked__FFNum/14/32\');">Num 14:32-34__NBDeu/1/3\');">Deu 1:3__NBDeu/2/7\');">Deu 2:7__NRDeu/2/14\');">14__NBDeu/8/4\');">Deu 8:4__NBPsa/95/10\');">Psa 95:10__NRPsa/95/11\');">11__NBJer/2/2\');">Jer 2:2__AN__GHsware_that_2__PSsware that__EFNum/14/23\');">Num 14:23__NBHbr/3/11\');">Hbr 3:11__AN__GGa_land_3__PSa land__FFExd/3/8\');">Exd 3:8__NRExd/3/17\');">17__NBEze/20/6\');">Eze 20:6__NREze/20/15\');">15__NBJoe/3/18\');">Joe 3:18__EN';
stringArray[7] = 'And __PNtheir_children_1__SHtheir children</a>, [whom] he raised up in their stead, them Joshua circumcised: for they were uncircumcised, because they had not circumcised them by the way.__CPtheir_children_1__PStheir children__FFNum/14/31\');">Num 14:31__NBDeu/1/39\');">Deu 1:39__EN';
stringArray[8] = 'And it came to pass, __PNwhen_they__etc__1__SHwhen they</a> had done circumcising all the people, that they abode in their places in the camp, __PNtill_they_were_whole_2__SHtill they were whole</a>.__CPwhen_they__etc__1__PSwhen they, etc.__EEHeb. when the people had made an end to be circumcised.__GHtill_they_were_whole_2__PStill they were whole__EFGen/34/25\');">Gen 34:25__EN';
stringArray[9] = 'And the LORD said unto Joshua, This day have __PNI_rolled_away_1__SHI rolled away</a> the reproach of Egypt from off you. Wherefore the name of the place is called __PNGilgal_2__SHGilgal</a> unto this day.__CPI_rolled_away_1__PSI rolled away__FFJos/24/14\');">Jos 24:14__NBGen/34/14\');">Gen 34:14__NBLev/24/14\');">Lev 24:14__NB1Sa/14/6\');">1Sa 14:6__NB1Sa/17/26\');">1Sa 17:26__NR1Sa/17/36\');">36__NBPsa/119/39\');">Psa 119:39__NBJer/9/25\');">Jer 9:25__NBEze/20/7\');">Eze 20:7__NREze/20/8\');">8__NBEze/23/3\');">Eze 23:3__NREze/23/8\');">8__NBEph/2/11\');">Eph 2:11__NREph/2/12\');">12__AN__GHGilgal_2__PSGilgal__FEThat is, rolling. __NAJos/4/19\');">Jos 4:19__EN';
stringArray[10] = 'And the children of Israel encamped in Gilgal, and __PNkept_the_passover_1__SHkept the passover</a> on the fourteenth day of the month at even in the plains of Jericho.__CPkept_the_passover_1__PSkept the passover__FFEze/12/3\');">Eze 12:3__NREze/12/6\');">6__AN, etc.; __NANum/9/1\');">Num 9:1-5__EN';
stringArray[11] = 'And they did eat of the __PNold_corn_1__SHold corn</a> of the land on the morrow after the passover, __PNunleavened_cakes_2__SHunleavened cakes</a>, and parched [corn] in the selfsame day.__CPold_corn_1__PSold corn__EEThe people would find abundance of old corn in the deserted granaries of the affrighted inhabitants: and the barley harvest being ripe, after offering the sheaf of first-fruits, they ate also new parched corn; and thus the manna being no longer necessary, ceased, after having been sent them regularly for almost forty years. To Christians the manna for their souls shall never fail, till they arrive at the Canaan above, to feast on its rich and inexhaustible provisions.__GHunleavened_cakes_2__PSunleavened cakes__EFExd/12/18\');">Exd 12:18-20__NBExd/13/6\');">Exd 13:6__NRExd/13/7\');">7__NBLev/23/6\');">Lev 23:6__NRLev/23/14\');">14__EN';
stringArray[12] = 'And __PNthe_manna_1__SHthe manna</a> ceased on the morrow after they had eaten of the old corn of the land; neither had the children of Israel manna any more; __PNbut_they_did_eat_2__SHbut they did eat</a> of the fruit of the land of Canaan that year.__CPthe_manna_1__PSthe manna__FFExd/16/35\');">Exd 16:35__NBNeh/9/20\');">Neh 9:20__NRNeh/9/21\');">21__NBRev/7/16\');">Rev 7:16__NRRev/7/17\');">17__AN__GHbut_they_did_eat_2__PSbut they did eat__EFDeu/6/10\');">Deu 6:10__NRDeu/6/11\');">11__NBPro/13/22\');">Pro 13:22__NBIsa/65/13\');">Isa 65:13__NRIsa/65/14\');">14__NBJhn/4/38\');">Jhn 4:38__EN';
stringArray[13] = 'And it came to pass, when Joshua was by Jericho, that __PNhe_lifted_1__SHhe lifted</a> up his eyes and looked, and, behold, there stood __PNa_man_2__SHa man</a> over against him with __PNhis_sword_3__SHhis sword</a> drawn in his hand: and Joshua went unto him, and said unto him, __PNArt_thou_for_us_4__SH[Art] thou for us</a>, or for our adversaries?__CPhe_lifted_1__PShe lifted__FFGen/33/1\');">Gen 33:1__NRGen/33/5\');">5__NBDan/8/3\');">Dan 8:3__NBDan/10/5\');">Dan 10:5__AN__GHa_man_2__PSa man__EFJos/6/2\');">Jos 6:2__NBGen/18/2\');">Gen 18:2__NBGen/32/24\');">Gen 32:24-30__NBExd/23/23\');">Exd 23:23__NBJdg/13/8\');">Jdg 13:8__NRJdg/13/9\');">9__NRJdg/13/11\');">11__NRJdg/13/22\');">22__NBDan/10/5\');">Dan 10:5__NBHsa/12/3\');">Hsa 12:3-5__NBZec/1/8\');">Zec 1:8__NBAct/1/10\');">Act 1:10__NBRev/1/13\');">Rev 1:13__AN__GGhis_sword_3__PShis sword__FFNum/22/23\');">Num 22:23__NB1Ch/21/16\');">1Ch 21:16__NR1Ch/21/17\');">17__NR1Ch/21/27\');">27__NR1Ch/21/30\');">30__AN__GHArt_thou_for_us_4__PSArt thou for us__EF1Ch/12/17\');">1Ch 12:17__NR1Ch/12/18\');">18__EN';
stringArray[14] = 'And he said, Nay; __PNbut_as_captain_1__SHbut [as] captain</a> of the host of the LORD am I now come. And Joshua __PNfell_on_his_2__SHfell on his</a> face to the earth, and did worship, and said unto him, __PNWhat_saith_3__SHWhat saith</a> __PNmy_lord_4__SHmy lord</a> unto his servant?__CPbut_as_captain_1__PSbut as captain__EEor, Prince. __NAExd/23/20\');">Exd 23:20-22__NBIsa/55/4\');">Isa 55:4__NBDan/10/13\');">Dan 10:13__NRDan/10/21\');">21__NBDan/12/1\');">Dan 12:1__NBHbr/2/10\');">Hbr 2:10__NBRev/12/7\');">Rev 12:7__NBRev/19/11\');">Rev 19:11-14__AN__GHfell_on_his_2__PSfell on his__EFGen/17/3\');">Gen 17:3__NRGen/17/17\');">17__NBLev/9/24\');">Lev 9:24__NBNum/16/22\');">Num 16:22__NRNum/16/45\');">45__NBMat/8/2\');">Mat 8:2__NBLuk/5/12\');">Luk 5:12__NBAct/10/25\');">Act 10:25__NRAct/10/26\');">26__NBRev/19/10\');">Rev 19:10__NBRev/22/8\');">Rev 22:8__NRRev/22/9\');">9__AN__GGWhat_saith_3__PSWhat saith__FF1Sa/3/9\');">1Sa 3:9__NR1Sa/3/10\');">10__NBIsa/6/8\');">Isa 6:8__NBAct/9/6\');">Act 9:6__AN__GHmy_lord_4__PSmy lord__EFExd/4/10\');">Exd 4:10__NRExd/4/13\');">13__NBPsa/110/1\');">Psa 110:1__NBMat/22/44\');">Mat 22:44__NBLuk/1/43\');">Luk 1:43__NBLuk/20/42\');">Luk 20:42__NBJhn/20/28\');">Jhn 20:28__NBPhl/3/8\');">Phl 3:8__EN';
stringArray[15] = 'And the captain of the LORD\'S host said unto Joshua, __PNLoose_1__SHLoose</a> thy shoe from off thy foot; for the place whereon thou standest [is] holy. __PNAnd_Joshua_2__SHAnd Joshua</a> did so.__CPLoose_1__PSLoose__FFExd/3/5\');">Exd 3:5__NBAct/7/32\');">Act 7:32__NRAct/7/33\');">33__NB2Pe/1/18\');">2Pe 1:18__AN__GHAnd_Joshua_2__PSAnd Joshua__FEMany persons have been puzzled to know what was intended by this extraordinary appearance of the angel to Joshua, because they supposed that the whole business ends with the chapter; whereas it is continued in the succeeding one, the first verse of which is a mere parenthesis, simply relating to the state of Jericho at the time when Joshua was favoured with this encouraging vision; by which he was shewn that their help came from God alone, and that it was not by human might or power, but by the LORD of hosts they were to obtain the victory.</TD></TR>';
