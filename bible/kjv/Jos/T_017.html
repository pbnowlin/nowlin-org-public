var stringArray = new Array();
stringArray[1] = 'There was also a lot for the tribe of Manasseh; for he [was] __PNthe_firstborn_1__SHthe firstborn</a> of Joseph; [to wit], for __PNMachir_2__SHMachir</a> the firstborn of Manasseh, the father of __PNGilead_3__SHGilead</a>: because he was a man of war, therefore he had Gilead and Bashan.__CPthe_firstborn_1__PSthe firstborn__FFGen/41/51\');">Gen 41:51__NBGen/46/20\');">Gen 46:20__NBGen/48/18\');">Gen 48:18__NBDeu/21/17\');">Deu 21:17__AN__GHMachir_2__PSMachir__EFGen/50/23\');">Gen 50:23__NBNum/26/29\');">Num 26:29__NBNum/27/1\');">Num 27:1__NBNum/32/39\');">Num 32:39__NRNum/32/40\');">40__NBJdg/5/14\');">Jdg 5:14__NB1Ch/2/23\');">1Ch 2:23__NB1Ch/7/14\');">1Ch 7:14__NR1Ch/7/15\');">15__AN__GGGilead_3__PSGilead__FFNum/26/29\');">Num 26:29__NBNum/32/33\');">Num 32:33__NRNum/32/40\');">40__NBDeu/3/13\');">Deu 3:13-15__EN';
stringArray[2] = 'There was also [a lot] for __PNthe_rest_1__SHthe rest</a> of __PNthe_children_2__SHthe children</a> of Manasseh by their families; for the children of __PNAbiezer_3__SHAbiezer</a>, and for the children of Helek, and for the __PNchildren_of_Asriel_4__SHchildren of Asriel</a>, and for the children of Shechem, and for the __PNchildren_of_Hepher_5__SHchildren of Hepher</a>, and for the children of Shemida: these [were] the male children of Manasseh the son of Joseph by their families.__CPthe_rest_1__PSthe rest__FFNum/26/29\');">Num 26:29-32__AN__GHthe_children_2__PSthe children__EFJdg/6/11\');">Jdg 6:11__NBJdg/8/2\');">Jdg 8:2__NB1Ch/7/18\');">1Ch 7:18__AN__GGAbiezer_3__PSAbiezer__FFNum/26/30\');">Num 26:30__AN; Jeezer.__GHchildren_of_Asriel_4__PSchildren of Asriel__EFNum/26/31\');">Num 26:31__AN__GGchildren_of_Hepher_5__PSchildren of Hepher__FFNum/26/32\');">Num 26:32__EN';
stringArray[3] = 'But Zelophehad, the son of Hepher, the son of Gilead, the son of Machir, the son of Manasseh, had no sons, but daughters: and these [are] the names of his daughters, Mahlah, and Noah, Hoglah, Milcah, and Tirzah.__CPRelated_Verses1_1__PSEntire Verse.__FFNum/26/33\');">Num 26:33__NBNum/27/1\');">Num 27:1__NBNum/36/2\');">Num 36:2-11__EN';
stringArray[4] = 'And they came near before __PNEleazar_1__SHEleazar</a> the priest, and before Joshua the son of Nun, and before the princes, saying, __PNThe_LORD_commanded_2__SHThe LORD commanded</a> Moses to give us an inheritance among our brethren. Therefore according to the commandment of the LORD he gave them an inheritance among the brethren of their father.__CPEleazar_1__PSEleazar__FFJos/14/1\');">Jos 14:1__NBNum/34/17\');">Num 34:17-29__AN__GHThe_LORD_commanded_2__PSThe LORD commanded__EFNum/27/6\');">Num 27:6__NRNum/27/7\');">7__NBGal/3/28\');">Gal 3:28__EN';
stringArray[5] = 'And there fell __PNten_portions_1__SHten portions</a> to Manasseh, __PNbeside_2__SHbeside</a> the land of Gilead and Bashan, which [were] on the other side Jordan;__CPten_portions_1__PSten portions__EEAs there were six sons and five daughters, among whom this division was to be made, there should be eleven portions: but Zelophehad, son of Hepher, having left five daughters in his place, neither he nor Hepher is reckoned. The lot of Manasseh therefore was divided into ten parts; five for the five sons of Gilead, Abiezer, Helek, Asriel, Shechem, and Shemida; and five for the five daughters of Zelophehad, Mahlah, Noah, Hoglah, Milcah, and Tirzah. __NAJos/17/2\');">Jos 17:2__NRJos/17/3\');">3__NRJos/17/14\');">14__AN__GHbeside_2__PSbeside__EFJos/13/29\');">Jos 13:29-31__NBNum/32/30\');">Num 32:30-42__EN';
stringArray[6] = 'Because the daughters of Manasseh had an inheritance among his sons: and the rest of Manasseh\'s sons had the land of Gilead.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[7] = 'And the coast of Manasseh was from __PNAsher_1__SHAsher</a> to __PNMichmethah_2__SHMichmethah</a>, that [lieth] before __PNShechem_3__SHShechem</a>; and the border went along on the right hand unto the inhabitants of Entappuah.__CPAsher_1__PSAsher__EEEusebius says this was a town in his time not far from Neapolis, towards Scythopolis or Bethshan; between which towns it is also placed by the old Jerusalem Itinerary.__GHMichmethah_2__PSMichmethah__FESituated, probably, east of Shechem, though its precise situation, as well as that of many others, cannot, at this distance of time, be ascertained. Many of these towns were small, and we may rationally conclude, slightly built; and consequently have perished more than two thousand years ago. It would therefore be useless now to look for such places; though in many instances, their ancient names have been preserved, and their sites identified. Several towns even in England, mentioned by Cæsar and other ancient writers, are no longer discernible; several have changed their names, and not a few their situation. __NAJos/16/6\');">Jos 16:6-8__AN__GGShechem_3__PSShechem__FFJos/20/7\');">Jos 20:7__NBJos/21/21\');">Jos 21:21__NBJos/24/1\');">Jos 24:1__NRJos/24/32\');">32__NBGen/34/2\');">Gen 34:2__NBGen/37/12\');">Gen 37:12__NRGen/37/14\');">14__NBJdg/9/1\');">Jdg 9:1__NB1Ki/12/1\');">1Ki 12:1__NR1Ki/12/25\');">25__NB1Ch/6/67\');">1Ch 6:67__EN';
stringArray[8] = '[Now] Manasseh had the land __PNof_Tappuah_1__SHof Tappuah</a>: but Tappuah on the border of Manasseh [belonged] to the children of Ephraim;__CPof_Tappuah_1__PSof Tappuah__FFJos/12/17\');">Jos 12:17__NBJos/15/34\');">Jos 15:34__NRJos/15/53\');">53__NBJos/16/8\');">Jos 16:8__EN';
stringArray[9] = 'And the coast descended unto the __PNriver_Kanah_1__SHriver Kanah</a>, southward of the river: __PNthese_cities_2__SHthese cities</a> of Ephraim [are] among the cities of Manasseh: the coast of Manasseh also [was] on the north side of the river, and __PNthe_out_goings_3__SHthe outgoings</a> of it were at __PNthe_sea_4__SHthe sea</a>:__CPriver_Kanah_1__PSriver Kanah__EEor, brook of reeds. The brook Kanah seem to be what is now called Nahr el Kasab, which falls into the Mediterranean a few miles south of Cæsarea of Palestine, mentioned by the Hon. C. L. Irby, and J. Mangles. __NAJos/16/8\');">Jos 16:8__AN__GHthese_cities_2__PSthese cities__EFJos/16/9\');">Jos 16:9__AN__GGthe_out_goings_3__PSthe out-goings__FFJos/16/3\');">Jos 16:3__NRJos/16/8\');">8__NBJos/19/29\');">Jos 19:29__AN__GHthe_sea_4__PSthe sea__FEThe Mediterranean.</TD></TR>';
stringArray[10] = 'Southward [it was] Ephraim\'s, and northward [it was] Manasseh\'s, and the sea is his border; and they met together in Asher on the north, and in Issachar on the east.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[11] = 'And __PNManasseh_1__SHManasseh</a> had in Issachar and in Asher Bethshean and her towns, and __PNIbleam_2__SHIbleam</a> and her towns, and the inhabitants of __PNDor_3__SHDor</a> and her towns, and the inhabitants of __PNEndor_4__SHEndor</a> and her towns, and the inhabitants of __PNTaanach_5__SHTaanach</a> and her towns, and the inhabitants of __PNMegiddo_6__SHMegiddo</a> and her towns, [even] three countries.__CPManasseh_1__PSManasseh__FFJos/16/9\');">Jos 16:9__NB1Ch/7/29\');">1Ch 7:29__AN. Beth-shean, the Scythopolis of the Greek and Roman writers, was situated in the plain of Jordan, west of that river, 120 furlongs (south) from Tiberias, according to Josephus, and 600 furlongs (north) from Jerusalem. ((2 Macabees 12v29.) It was the largest city of the Decapolis, and the only one on that side of Jordan. It is now called Bisan, 8 hours or 24 miles from Tiberias; and described by Dr. Richardson, exclusive of its ruins, as a ?collection of miserable hovels, containing 200 inhabitants?. __NA1Sa/31/10\');">1Sa 31:10__NR1Sa/31/12\');">12__AN; Beth-shan. __NA1Ki/4/12\');">1Ki 4:12__AN__GHIbleam_2__PSIbleam__EF2Ki/9/27\');">2Ki 9:27__NB1Ch/6/70\');">1Ch 6:70__AN; Bileam.__GGDor_3__PSDor__EEDor, according to Eusebius, was situated on the Mediterranean, nine miles from Cæsarea Palestine, towards Carmel. The village of Tortura, four leagues north of Cæsarea, is supposed to nearly occupy it site. __NAJos/12/23\');">Jos 12:23__NBJdg/1/27\');">Jdg 1:27__NB1Ki/4/11\');">1Ki 4:11__AN__GHEndor_4__PSEndor__EF1Sa/28/7\');">1Sa 28:7__NBPsa/83/10\');">Psa 83:10__AN__GGTaanach_5__PSTaanach__FFJos/12/21\');">Jos 12:21__NBJdg/5/19\');">Jdg 5:19__AN__GHMegiddo_6__PSMegiddo__EFJdg/1/27\');">Jdg 1:27__NBJdg/5/19\');">Jdg 5:19__NB1Ki/4/12\');">1Ki 4:12__NB1Ki/9/15\');">1Ki 9:15__NB2Ki/9/27\');">2Ki 9:27__NB2Ki/23/29\');">2Ki 23:29__NR2Ki/23/30\');">30__NB2Ch/35/22\');">2Ch 35:22__NBZec/12/11\');">Zec 12:11__EN';
stringArray[12] = 'Yet the children of Manasseh could not drive out [the inhabitants of] those cities; but the Canaanites would dwell in that land.__CPRelated_Verses1_1__PSEntire Verse.__FFJos/15/63\');">Jos 15:63__NBJos/16/10\');">Jos 16:10__NBExd/23/29\');">Exd 23:29-33__NBNum/33/52\');">Num 33:52-56__NBJdg/1/27\');">Jdg 1:27__NRJdg/1/28\');">28__NBRom/6/12\');">Rom 6:12-14__EN';
stringArray[13] = 'Yet it came to pass, when the children of Israel were __PNwaxen_strong_1__SHwaxen strong</a>, that they __PNput_the_2__SHput the</a> Canaanites to tribute; but did not utterly drive them out.__CPwaxen_strong_1__PSwaxen strong__FFJdg/1/28\');">Jdg 1:28__NB2Sa/3/1\');">2Sa 3:1__NBEph/6/10\');">Eph 6:10__NBPhl/4/13\');">Phl 4:13__NB2Pe/3/18\');">2Pe 3:18__AN__GHput_the_2__PSput the__EFJos/16/10\');">Jos 16:10__NBDeu/20/11\');">Deu 20:11-18__NBJdg/1/30\');">Jdg 1:30__NRJdg/1/33\');">33__NRJdg/1/35\');">35__NB2Ch/8/7\');">2Ch 8:7__NR2Ch/8/8\');">8__EN';
stringArray[14] = 'And the children of Joseph spake unto Joshua, saying, Why hast thou given me [but] __PNone_lot_1__SHone lot</a> and one portion to inherit, seeing I [am] __PNa_great_2__SHa great</a> people, forasmuch as the LORD hath blessed me hitherto?__CPone_lot_1__PSone lot__FFGen/48/22\');">Gen 48:22__NBNum/26/34\');">Num 26:34-37__NBDeu/33/13\');">Deu 33:13-17__AN__GHa_great_2__PSa great__EFGen/48/19\');">Gen 48:19__NBGen/49/22\');">Gen 49:22-26__EN';
stringArray[15] = 'And Joshua answered them, __PNIf_thou_be_1__SHIf thou [be]</a> a great people, [then] get thee up to the wood [country], and cut down for thyself there in the land of __PNthe_Perizzites_2__SHthe Perizzites</a> and of the __PNgiants_3__SHgiants</a>, if mount Ephraim be too narrow for thee.__CPIf_thou_be_1__PSIf thou be__FFLuk/12/48\');">Luk 12:48__AN__GHthe_Perizzites_2__PSthe Perizzites__EFGen/13/7\');">Gen 13:7__NBExd/33/2\');">Exd 33:2__NBEzr/9/1\');">Ezr 9:1__AN__GGgiants_3__PSgiants__EEor, Rephaims. __NAGen/14/5\');">Gen 14:5__NBGen/15/20\');">Gen 15:20__NB2Sa/5/18\');">2Sa 5:18__NR2Sa/5/22\');">22__EN';
