stringArray[21] = 'When __PNI_saw_1__SHI saw</a> among the spoils a goodly __PNBabylonish_garment_2__SHBabylonish garment</a>, and two hundred shekels of silver, and a __PNwedge_3__SHwedge</a> of gold of fifty shekels weight, then __PNI_coveted_4__SHI coveted</a> them, and __PNtook_them_5__SHtook them</a>; and, behold, __PNthey_are_hid_6__SHthey [are] hid</a> in the earth in the midst of my tent, and the silver under it.__CPI_saw_1__PSI saw__FFGen/3/6\');">Gen 3:6__NBGen/6/2\');">Gen 6:2__NB2Sa/11/2\');">2Sa 11:2__NBJob/31/1\');">Job 31:1__NBPsa/119/37\');">Psa 119:37__NBPro/23/31\');">Pro 23:31__NBPro/28/22\');">Pro 28:22__NBMat/5/28\');">Mat 5:28__NRMat/5/29\');">29__NB1Jo/2/15\');">1Jo 2:15__NR1Jo/2/16\');">16__AN__GHBabylonish_garment_2__PSBabylonish garment__FE"Addereth shinâr, ""a splendid or costly robe of Shinar,"" the plain in which Babylon stood. Bochart and Calmet have shewn at large, that Babylonish robes were very splendid, and in high reputation. Calmet says, they are generally allowed to have been of various colours, though some suppose they were woven thus; others, that they were embroidered with the needle; and others, that they were painted. Silius Italicus seems to think they were woven. Martial supposes them to have been embroidered with the needle; and Pliny and Apuleius speak of them as painted. __NAGen/10/10\');">Gen 10:10__AN; *marg:"__GGwedge_3__PSwedge__EEHeb. tongue.__GHI_coveted_4__PSI coveted__EFExd/20/17\');">Exd 20:17__NBDeu/7/25\');">Deu 7:25__NB1Ki/21/1\');">1Ki 21:1__NR1Ki/21/2\');">2__NB2Ki/5/20\');">2Ki 5:20-27__NBHab/2/9\');">Hab 2:9__NBLuk/12/15\');">Luk 12:15__NBRom/7/7\');">Rom 7:7__NRRom/7/8\');">8__NBEph/5/3\');">Eph 5:3__NBCol/3/5\');">Col 3:5__NB1Ti/6/9\');">1Ti 6:9__NR1Ti/6/10\');">10__NBHbr/13/5\');">Hbr 13:5__NB2Pe/2/15\');">2Pe 2:15__AN__GGtook_them_5__PStook them__FFPro/4/23\');">Pro 4:23__NBMic/2/1\');">Mic 2:1__NRMic/2/2\');">2__NBJam/1/15\');">Jam 1:15__AN__GHthey_are_hid_6__PSthey are hid__EF2Sa/11/6\');">2Sa 11:6
