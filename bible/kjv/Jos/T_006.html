stringArray[21] = '__PNAnd_they_1__SHAnd they</a> __PNutterly_2__SHutterly</a> destroyed all that [was] in the city, both man and woman, young and old, and ox, and sheep, and ass, with the edge of the sword.__CPAnd_they_1__PSAnd they__EEThe Canaanites were ripe for destruction; and God was pleased, instead of destroying them by a pestilence, a famine, or an earthquake, to employ the Israelites as the executioners of his vengeance. Had an angel been commissioned to slay them, who would have charged him with iniquity or cruelty? In all public calamities infants are involved; and tens of thousands of infants die in great agony every year. Now, either God is not the agent in these calamities, (which opinion, though often implied in men\'s reasonings on these subjects, is not far from atheism;) or they must consist with the most perfect justice and goodness.__GHutterly_2__PSutterly__EFJos/9/24\');">Jos 9:24__NRJos/9/25\');">25__NBJos/10/28\');">Jos 10:28__NRJos/10/39\');">39__NBJos/11/14\');">Jos 11:14__NBDeu/2/34\');">Deu 2:34__NBDeu/7/2\');">Deu 7:2__NRDeu/7/3\');">3__NRDeu/7/16\');">16__NBDeu/20/16\');">Deu 20:16__NRDeu/20/17\');">17__NB1Sa/15/3\');">1Sa 15:3__NR1Sa/15/8\');">8__NR1Sa/15/18\');">18__NR1Sa/15/19\');">19__NB1Ki/20/42\');">1Ki 20:42__NBPsa/137/8\');">Psa 137:8__NRPsa/137/9\');">9__NBJer/48/18\');">Jer 48:18__NBRev/18/21\');">Rev 18:21__EN';
