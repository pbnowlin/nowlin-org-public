stringArray[3] = 'And when the inhabitants of __PNGibeon_1__SHGibeon</a> heard what Joshua had done unto __PNJericho_2__SHJericho</a> and to Ai,__CPGibeon_1__PSGibeon__FFJos/9/17\');">Jos 9:17__NBJos/10/2\');">Jos 10:2__NB2Sa/21/1\');">2Sa 21:1__NR2Sa/21/2\');">2__AN__GHJericho_2__PSJericho__EFJos/6/1\');">Jos 6:1-27__NBJos/8/1\');">Jos 8:1-35__EN';
stringArray[4] = 'They did __PNwork_wilily_1__SHwork wilily</a>, and went and made as if they had been __PNambassadors_2__SHambassadors</a>, and took old sacks upon their asses, and __PNwine_bottles_3__SHwine bottles</a>, old, and rent, and bound up;__CPwork_wilily_1__PSwork wilily__FFGen/34/13\');">Gen 34:13__NB1Ki/20/31\');">1Ki 20:31-33__NBMat/10/16\');">Mat 10:16__NBLuk/16/8\');">Luk 16:8__AN__GHambassadors_2__PSambassadors__FEThe word tzir, an ambassador, properly denotes a hinge; because an ambassador is a person upon whom the business turns as upon a hinge. So the Latin Cardinalis, from cardo, a hinge, was the title of the prime minister of the emperor Theodosius, though now applied only to the Pope\'s electors and counsellors.__GGwine_bottles_3__PSwine bottles__EEThese bottles being made of skin, were consequently liable to be rent, and capable of being mended; which is done, according to Chardin, by putting in a piece, or by gathering up the wounded piece in the manner of a purse; and sometimes by inserting a flat piece of wood. __NAPsa/119/83\');">Psa 119:83__NBMat/9/17\');">Mat 9:17__NBMar/2/22\');">Mar 2:22__NBLuk/5/37\');">Luk 5:37__NRLuk/5/38\');">38__EN';
stringArray[5] = 'And __PNold_shoes_1__SHold shoes</a> and __PNclouted_2__SHclouted</a> upon their feet, and old garments upon them; and all the bread of their provision was dry [and] mouldy.__CPold_shoes_1__PSold shoes__FFJos/9/13\');">Jos 9:13__NBDeu/29/5\');">Deu 29:5__NBDeu/33/25\');">Deu 33:25__NBLuk/15/22\');">Luk 15:22__AN__GHclouted_2__PSclouted__FEThe word clouted signifies here patched, from the Anglo-Saxon clut, a clout or rag; and not nailed from the French clou, a nail.</TD></TR>';

stringArray[15] = 'And Joshua __PNmade_peace_1__SHmade peace</a> with them, and made a league with them, to let them live: __PNand_the_2__SHand the</a> princes of the congregation sware unto them.__CPmade_peace_1__PSmade peace__FFJos/2/12\');">Jos 2:12-19__NBJos/6/22\');">Jos 6:22-25__NBJos/11/19\');">Jos 11:19__NBDeu/20/10\');">Deu 20:10__NRDeu/20/11\');">11__NB2Sa/21/2\');">2Sa 21:2__NBJer/18/7\');">Jer 18:7__NRJer/18/8\');">8__AN__GHand_the_2__PSand the__EF2Sa/21/2\');">2Sa 21:2__EN';

stringArray[18] = 'And the children of Israel smote them not, because the princes of the congregation __PNhad_sworn_1__SHhad sworn</a> unto them by the LORD God of Israel. And all the congregation murmured against the princes.__CPhad_sworn_1__PShad sworn__FF2Sa/21/7\');">2Sa 21:7__NBPsa/15/4\');">Psa 15:4__NBEcc/5/2\');">Ecc 5:2__NREcc/5/6\');">6__NBEcc/9/2\');">Ecc 9:2__EN';

stringArray[20] = 'This we will do to them; we will even let them live, __PNlest_wrath_1__SHlest wrath</a> be upon us, because of the oath which we sware unto them.__CPlest_wrath_1__PSlest wrath__FF2Sa/21/1\');">2Sa 21:1-6__NB2Ch/36/13\');">2Ch 36:13__NBPro/20/25\');">Pro 20:25__NBEze/17/12\');">Eze 17:12-21__NBZec/5/3\');">Zec 5:3__NRZec/5/4\');">4__NBMal/3/5\');">Mal 3:5__NBRom/1/31\');">Rom 1:31__NB1Ti/1/10\');">1Ti 1:10__EN';
stringArray[21] = 'And the princes said unto them, Let them live; but __PNlet_them_1__SHlet them</a> be hewers of wood and drawers of water unto all the congregation; __PNas_the_princes_2__SHas the princes</a> had promised them.__CPlet_them_1__PSlet them__FFJos/9/23\');">Jos 9:23__NRJos/9/27\');">27__NBDeu/29/11\');">Deu 29:11__NB2Ch/2/17\');">2Ch 2:17__NR2Ch/2/18\');">18__AN__GHas_the_princes_2__PSas the princes__FESee on __NAJos/9/15\');">Jos 9:15__EN';
stringArray[22] = 'And Joshua called for them, and he spake unto them, saying, __PNWherefore_1__SHWherefore</a> have ye beguiled us, saying, __PNWe_are_2__SHWe [are]</a> very far from you; when __PNye_dwell_3__SHye dwell</a> among us?__CPWherefore_1__PSWherefore__FFGen/3/13\');">Gen 3:13__NRGen/3/14\');">14__NBGen/27/35\');">Gen 27:35__NRGen/27/36\');">36__NRGen/27/41\');">41-45__NBGen/29/25\');">Gen 29:25__NB2Cr/11/3\');">2Cr 11:3__AN__GHWe_are_2__PSWe are__EFJos/9/6\');">Jos 9:6__NRJos/9/9\');">9__NRJos/9/10\');">10__AN__GGye_dwell_3__PSye dwell__FFJos/9/16\');">Jos 9:16__EN';
stringArray[23] = 'Now therefore ye [are] __PNcursed_1__SHcursed</a>, and there shall __PNnone_of_you_be_freed_2__SHnone of you be freed</a> from being bondmen, and hewers of wood and drawers of water for the house of my God.__CPcursed_1__PScursed__EEThis may refer to the original curse pronounced against the descendants of Canaan: both of them seem to have implied nothing else than perpetual slavery. The Gibeonites were brought, no doubt, under tribute; performed the meanest offices for the Israelites; being in the same condition as the servile class of Hindoos, called the Chetrees; had their national importance annihilated, and yet were never permitted to incorporate themselves with the Israelites. __NAGen/9/25\');">Gen 9:25__NRGen/9/26\');">26__NBLev/27/28\');">Lev 27:28__NRLev/27/29\');">29__AN__GHnone_of_you_be_freed_2__PSnone of you be freed__FEHeb. not be cut off from you. hewers. In the East, collecting wood for fuel, and carrying water, are the peculiar employment of females. The Arab women of Barbary, and the daughters of the Turcomans, are thus employed. Hence Mr. Harmer concludes, that the bitterness of the doom of the Gibeonites does not seem to have consisted in the labouriousness of the service enjoined them, but its disgracing them from the characteristic employment of men, that of bearing arms, and condemning them and their posterity for ever to the employment of females. __NAJos/9/21\');">Jos 9:21__NRJos/9/27\');">27__EN';
stringArray[24] = 'And they answered Joshua, and said, Because it was certainly told thy servants, how that __PNthe_LORD_1__SHthe LORD</a> thy God commanded his servant Moses to give you all the land, and to destroy all the inhabitants of the land from before you, therefore __PNwe_were_sore_2__SHwe were sore</a> afraid of our lives because of you, and have done this thing.__CPthe_LORD_1__PSthe LORD__FFExd/23/31\');">Exd 23:31-33__NBNum/33/51\');">Num 33:51__NRNum/33/52\');">52__NRNum/33/55\');">55__NRNum/33/56\');">56__NBDeu/7/1\');">Deu 7:1__NRDeu/7/2\');">2__NRDeu/7/23\');">23__NRDeu/7/24\');">24__NBDeu/20/15\');">Deu 20:15-17__AN__GHwe_were_sore_2__PSwe were sore__EFExd/15/14\');">Exd 15:14-16__NBJob/2/4\');">Job 2:4__NBMat/10/28\');">Mat 10:28__EN';
stringArray[25] = 'And now, behold, __PNwe_are_1__SHwe [are]</a> in thine hand: __PNas_it_seemeth_2__SHas it seemeth</a> good and right unto thee to do unto us, do.__CPwe_are_1__PSwe are__FFGen/16/6\');">Gen 16:6__NBJdg/8/15\');">Jdg 8:15__NB2Sa/24/14\');">2Sa 24:14__NBIsa/47/6\');">Isa 47:6__NBJer/26/14\');">Jer 26:14__NBJer/38/5\');">Jer 38:5__AN__GHas_it_seemeth_2__PSas it seemeth__EFJdg/10/15\');">Jdg 10:15__NB1Sa/3/18\');">1Sa 3:18__NBMat/11/26\');">Mat 11:26__EN';
