stringArray[39] = 'And one went out into the field to gather herbs, and found __PNa_wild_vine_1__SHa wild vine</a>, and gathered thereof __PNwild_gourds_2__SHwild gourds</a> his lap full, and came and shred [them] into the pot of pottage: for they knew [them] not.__CPa_wild_vine_1__PSa wild vine__FFIsa/5/4\');">Isa 5:4__NBJer/2/21\');">Jer 2:21__NBMat/15/13\');">Mat 15:13__NBHbr/12/15\');">Hbr 12:15__AN__GHwild_gourds_2__PSwild gourds__FEThe word pakküôth, from peka, in Chaldee, to burst, and in Syriac, to crack, thunder, is generally supposed to be the fruits of the coloquintida, or colocynth; whose leaves are large, placed alternately, very much like those of the vine, whence it might be called a wild vine: the flowers are white, and the fruit of the gourd kind, of the size of a large apple, and when ripe, of a yellow colour, and a pleasant and inviting appearance. It ranks among vegetable poisons, as all intense bitters do; but, judiciously employed, it is of considerable use in medicine. It is said that the fruit, when ripe, is so full of wind that it bursts, and throws its liquor and seeds to a great distance: and if touched, before it breaks of itself, it flies open with an explosion, and discharges its foetid contents in the face of him who touched it.</TD></TR>';
stringArray[40] = 'So they poured out for the men to eat. And it came to pass, as they were eating of the pottage, that they cried out, and said, __PNO_thou_1__SHO [thou]</a> man of God, [there is] __PNdeath_2__SHdeath</a> in the pot. And they could not eat [thereof].__CPO_thou_1__PSO thou__FF2Ki/4/9\');">2Ki 4:9__NB2Ki/1/9\');">2Ki 1:9__NR2Ki/1/11\');">11__NR2Ki/1/13\');">13__NBDeu/33/1\');">Deu 33:1__NB1Ki/17/18\');">1Ki 17:18__AN__GHdeath_2__PSdeath__EFExd/10/17\');">Exd 10:17__NBExd/15/23\');">Exd 15:23__NBMar/16/18\');">Mar 16:18__EN';
stringArray[41] = 'But he said, Then bring meal. And __PNhe_cast_1__SHhe cast</a> [it] into the pot; and he said, Pour out for the people, that they may eat. And __PNthere_2__SHthere</a> was no __PNharm_3__SHharm</a> in the pot.__CPhe_cast_1__PShe cast__FF2Ki/2/21\');">2Ki 2:21__NB2Ki/5/10\');">2Ki 5:10__NB2Ki/6/6\');">2Ki 6:6__NBExd/15/25\');">Exd 15:25__NBJhn/9/6\');">Jhn 9:6__NB1Cr/1/25\');">1Cr 1:25__AN__GHthere_2__PSthere__EFAct/28/5\');">Act 28:5__AN__GGharm_3__PSharm__EEHeb. evil thing.</TD></TR>';
stringArray[42] = 'And there came a man from __PNBaal_shalisha_1__SHBaalshalisha</a>, and brought the man of God __PNbread_2__SHbread</a> of the firstfruits, twenty loaves __PNof_barley_3__SHof barley</a>, and full ears of corn in __PNthe_husk_thereof_4__SHthe husk thereof</a>. And he said, Give unto the people, that they may eat.__CPBaal_shalisha_1__PSBaal-shalisha__FF1Sa/9/4\');">1Sa 9:4__NR1Sa/9/7\');">7__AN__GHbread_2__PSbread__EF2Ki/4/38\');">2Ki 4:38__NBExd/23/16\');">Exd 23:16__NBDeu/12/6\');">Deu 12:6__NBDeu/26/2\');">Deu 26:2-10__NB1Sa/9/7\');">1Sa 9:7__NB2Ch/11/13\');">2Ch 11:13__NR2Ch/11/14\');">14__NBPro/3/9\');">Pro 3:9__NRPro/3/10\');">10__NB1Cr/9/11\');">1Cr 9:11__NBGal/6/6\');">Gal 6:6__AN__GGof_barley_3__PSof barley__FF2Ki/7/1\');">2Ki 7:1__NR2Ki/7/16\');">16-18__NBDeu/8/8\');">Deu 8:8__NBDeu/32/14\');">Deu 32:14__NBJhn/6/9\');">Jhn 6:9__NRJhn/6/13\');">13__AN__GHthe_husk_thereof_4__PSthe husk thereof__FEor, his scrip, or garment. Note: Parched corn, or corn to be parched; full ears before they are ripe, parched on the fire: a very frequent food in the East. The loaves were probably extremely small, as their loaves of bread still are in eastern countries. But small as this may appear, it would be a considerable present in the time of famine; though very inadequate to the number of persons. Baal-shalisha, of which the person who made this seasonable present was an inhabitant, was situated, according to Eusebius and Jerome, fifteen miles north of Diospolis, or Lydda.</TD></TR>';
