stringArray[1] = 'Then __PNMoab_1__SHMoab</a> rebelled against Israel __PNafter_the_2__SHafter the</a> death of Ahab.__CPMoab_1__PSMoab__FFNum/24/7\');">Num 24:7__NB2Sa/8/2\');">2Sa 8:2__NB1Ch/18/2\');">1Ch 18:2__NBPsa/60/8\');">Psa 60:8__AN__GHafter_the_2__PSafter the__EF2Ki/3/4\');">2Ki 3:4__NR2Ki/3/5\');">5__NB2Ki/8/20\');">2Ki 8:20__NR2Ki/8/22\');">22__EN';
stringArray[2] = 'And Ahaziah fell down through __PNa_lattice_1__SHa lattice</a> in his upper chamber that [was] in Samaria, and __PNwas_sick_2__SHwas sick</a>: and he sent messengers, and said unto them, Go, enquire of __PNBaal_zebub_3__SHBaalzebub</a> the __PNgod_4__SHgod</a> of Ekron __PNwhether_5__SHwhether</a> I shall recover of this disease.__CPa_lattice_1__PSa lattice__EEThe flat roofs of the eastern houses are generally surrounded by a parapet wall breast high; but instead of this, some terraces are guarded with balustrades only, or latticed work. Of the same kind, probably, was the lattice, or net, as the term shevacha seems to import, through which Ahaziah fell into the court. This incident proves the necessity of the law for the formation of battlements for roof, (__NADeu/22/8\');">Deu 22:8__AN,) which God graciously dictated from Sinai, which furnishes a beautiful example of his paternal care and goodness; for the terrace was a place where many offices of the family were performed, and business frequently transacted. __NAJdg/5/28\');">Jdg 5:28__NBSgs/2/9\');">Sgs 2:9__NBAct/20/9\');">Act 20:9__AN__GHwas_sick_2__PSwas sick__EF1Ki/22/34\');">1Ki 22:34__AN; *marg:; __NA2Ch/21/14\');">2Ch 21:14__NR2Ch/21/15\');">15__NBJob/31/3\');">Job 31:3__AN__GGBaal_zebub_3__PSBaal-zebub__FF2Ki/1/3\');">2Ki 1:3__NR2Ki/1/6\');">6__NR2Ki/1/16\');">16__NBMat/10/25\');">Mat 10:25__NBMat/12/24\');">Mat 12:24-27__NBMar/3/22\');">Mar 3:22__NBLuk/11/15\');">Luk 11:15__AN; Beelzebub__GHgod_4__PSgod__EFJdg/11/24\');">Jdg 11:24__NB1Sa/5/10\');">1Sa 5:10__NB1Ki/11/33\');">1Ki 11:33__NBIsa/37/12\');">Isa 37:12__NRIsa/37/19\');">19__AN__GGwhether_5__PSwhether__FF2Ki/8/7\');">2Ki 8:7-10__NB1Ki/14/3\');">1Ki 14:3__EN';
