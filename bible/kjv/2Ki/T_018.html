stringArray[19] = 'And __PNRab_shakeh_1__SHRabshakeh</a> said unto them, Speak ye now to Hezekiah, __PNThus_saith_2__SHThus saith</a> the great king, the king of Assyria, __PNWhat_confidence_3__SHWhat confidence</a> [is] this wherein thou trustest?__CPRab_shakeh_1__PSRab-shakeh__EEHe was the chief speaker, being a very eloquent man, and, according to the Hebrews, whom Procopius follows, an apostate Jew; which is not improbable, as he spoke Hebrew so fluently; and when he blasphemed the Divine Majesty, the king and nobles rent their clothes, which was usual unless the blasphemer were an Israelite.__GHThus_saith_2__PSThus saith__EF2Ch/32/10\');">2Ch 32:10__NBIsa/10/8\');">Isa 10:8-14__NBIsa/36/4\');">Isa 36:4__NBIsa/37/13\');">Isa 37:13__NBDan/4/30\');">Dan 4:30__AN__GGWhat_confidence_3__PSWhat confidence__FF2Ki/18/22\');">2Ki 18:22__NR2Ki/18/29\');">29__NR2Ki/18/30\');">30__NB2Ki/19/10\');">2Ki 19:10__NB2Ch/32/7\');">2Ch 32:7__NR2Ch/32/8\');">8__NR2Ch/32/10\');">10__NR2Ch/32/11\');">11__NR2Ch/32/14\');">14-16__NBPsa/4/2\');">Psa 4:2__NBIsa/36/4\');">Isa 36:4__NRIsa/36/7\');">7__NBIsa/37/10\');">Isa 37:10__EN';

stringArray[26] = 'Then said Eliakim the son of Hilkiah, and Shebna, and Joah, unto Rabshakeh, __PNSpeak_1__SHSpeak</a>, I pray thee, to thy servants __PNin_the_Syrian_language_2__SHin the Syrian language</a>; for we understand [it]: and talk not with us in the Jews\' language in the ears of the people that [are] on the wall.__CPSpeak_1__PSSpeak__EEPerceiving that the object of this blasphemous caitiff was to stir up the people to sedition, they mildly and reasonably required him to make his proposals in the Syrian language.__GHin_the_Syrian_language_2__PSin the Syrian language__EFEzr/4/7\');">Ezr 4:7__NBIsa/36/11\');">Isa 36:11__NRIsa/36/12\');">12__NBDan/2/4\');">Dan 2:4__EN';
stringArray[27] = 'But Rabshakeh said unto them, Hath my master sent me to thy master, and to thee, to speak these words? [hath he] not [sent me] to the men which sit on the wall, that they may __PNeat_1__SHeat</a> their own dung, and drink __PNtheir_own_piss_2__SHtheir own piss</a> with you?__CPeat_1__PSeat__FF2Ki/6/25\');">2Ki 6:25__NBDeu/28/53\');">Deu 28:53-57__NBPsa/73/8\');">Psa 73:8__NBLam/4/5\');">Lam 4:5__NBEze/4/13\');">Eze 4:13__NREze/4/15\');">15__AN__GHtheir_own_piss_2__PStheir own piss__FEHeb. the water of their feet.</TD></TR>';

stringArray[34] = 'Where [are] __PNthe_gods_1__SHthe gods</a> of __PNHamath_2__SHHamath</a>, and of __PNArpad_3__SHArpad</a>? where [are] __PNthe_gods_4__SHthe gods</a> of Sepharvaim, Hena, and Ivah? __PNhave_they_delivered_5__SHhave they delivered</a> Samaria out of mine hand?__CPthe_gods_1__PSthe gods__FF2Ki/19/13\');">2Ki 19:13__NBNum/13/21\');">Num 13:21__NB2Sa/8/9\');">2Sa 8:9__NBJer/49/23\');">Jer 49:23__AN__GHHamath_2__PSHamath__FEHamath, there is little doubt, was the Epiphania of the Greeks, as Josephus, Theodoret, and Jerome, expressly assert. It was a celebrated city of Syria, situated on the Orontes, and the present Hamah doubtless occupies its site; as Abulfeda, who was prince or emir of Hamah about A.D. 1345, expressly states, in his Description of Syria, that Hamah is an ancient city mentioned in the writings of the Israelites. It is still a considerable town, situated on both sides of the Orontes, about three days\' journey and a half from Tripoli; and must contain, Burckhardt says, at least 30,000 inhabitants.__GGArpad_3__PSArpad__EEArpad is probably the town of Arphas, mentioned by Josephus as limiting the province of Gamalitis, Gaulanitis, Batanea, and Trachonitis, to the N. E.; and the Raphan, or Raphanea, which Stephanus places near Epiphania.__GHthe_gods_4__PSthe gods__EF2Ki/17/24\');">2Ki 17:24-33__AN; Ava. __NAIsa/36/18\');">Isa 36:18__NRIsa/36/19\');">19__NBIsa/37/11\');">Isa 37:11__NRIsa/37/12\');">12__NRIsa/37/18\');">18__NRIsa/37/19\');">19__AN__GGhave_they_delivered_5__PShave they delivered__FF2Ki/17/6\');">2Ki 17:6__NR2Ki/17/23\');">23__NR2Ki/17/24\');">24__NR2Ki/17/30\');">30__NR2Ki/17/31\');">31__NB2Ki/19/12\');">2Ki 19:12__NR2Ki/19/13\');">13__EN';
