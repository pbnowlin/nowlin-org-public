stringArray[12] = 'And they said, [It is] false; tell us now. And he said, __PNThus_and_thus_1__SHThus and thus</a> spake he to me, saying, Thus saith the LORD, I have anointed thee king over Israel.__CPThus_and_thus_1__PSThus and thus__EESee on __NA2Ki/9/6\');">2Ki 9:6-10__AN.</TD></TR>';
stringArray[13] = 'Then they hasted, __PNand_took_every_1__SHand took every</a> man his garment, and put [it] under him __PNon_the_top_2__SHon the top</a> of the stairs, and __PNblew_with_trumpets_3__SHblew with trumpets</a>, saying, Jehu __PNis_king_4__SHis king</a>.__CPand_took_every_1__PSand took every__EE"The spreading of garments in the street, before persons to whom it was intended to shew particular honour, was an ancient and very general custom; the garments in these cases being used for carpets. In the Agamemnon of ∆schylus, the hypocritical Clytemnestra commands the maids to spread carpets before her returning husband, that on his descending from his chariot he may place his foot on ""a purple-covered path."" We also find this custom among the Romans. Plutarch relates, that when Cato of Utica left the Macedonian army, where he had become legionary tribune, the soldiers spread their clothes in the way. __NAMat/21/7\');">Mat 21:7__NRMat/21/8\');">8__NBMar/11/7\');">Mar 11:7__NRMar/11/8\');">8__AN"__GHon_the_top_2__PSon the top__FEThe ancient fortified cities were generally strengthened with a citadel, (__NAJdg/9/46\');">Jdg 9:46__NRJdg/9/51\');">51__AN,) commonly built on an eminence, to which they ascended by a flight of stairs, (__NANeh/3/15\');">Neh 3:15__AN.) It is extremely probable, therefore, that Ramoth-gilead, being a frontier town of Israel and Syria, had a tower of this nature; and that Jehu was proclaimed king on the top of the stairs by which they ascended the hill on which the tower stood, i.e., in the area before the door of the tower, and consequently the most public place in the city.__GGblew_with_trumpets_3__PSblew with trumpets__FF2Sa/15/10\');">2Sa 15:10__NB1Ki/1/34\');">1Ki 1:34__NR1Ki/1/39\');">39__NBPsa/47/5\');">Psa 47:5-7__NBPsa/98/6\');">Psa 98:6__AN__GHis_king_4__PSis king__FEHeb. reigneth.</TD></TR>';
