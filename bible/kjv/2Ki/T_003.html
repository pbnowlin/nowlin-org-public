stringArray[20] = 'And it came to pass in the morning, __PNwhen_the_meat_1__SHwhen the meat</a> offering was offered, that, behold, __PNthere_came_water_2__SHthere came water</a> by the way of Edom, and the country was __PNfilled_3__SHfilled</a> with water.__CPwhen_the_meat_1__PSwhen the meat__FFExd/29/39\');">Exd 29:39__NRExd/29/40\');">40__NB1Ki/18/36\');">1Ki 18:36__NBDan/9/21\');">Dan 9:21__AN__GHthere_came_water_2__PSthere came water__FEThis supply was altogether miraculous; for there was neither wind nor rain, nor any other natural means to furnish it.__GGfilled_3__PSfilled__FFPsa/78/15\');">Psa 78:15__NRPsa/78/16\');">16__NRPsa/78/20\');">20__NBIsa/35/6\');">Isa 35:6__NRIsa/35/7\');">7__EN';

stringArray[24] = 'And when they came to the camp of Israel, the Israelites rose up and __PNsmote_the_1__SHsmote the</a> Moabites, so that they fled before them: but they __PNwent_forward_2__SHwent forward</a> smiting the Moabites, even in [their] country.__CPsmote_the_1__PSsmote the__FFJos/8/20\');">Jos 8:20-22__NBJdg/20/40\');">Jdg 20:40-46__NB1Th/5/3\');">1Th 5:3__NR1Th/5/4\');">4__AN__GHwent_forward_2__PSwent forward__FEor, smote in it even.</TD></TR>';

stringArray[26] = 'And when the king of Moab saw that the battle was too sore for him, he took with him seven hundred men that drew swords, to break through [even] __PNunto_the_king_of_Edom_1__SHunto the king of Edom</a>: but they could not.__CPunto_the_king_of_Edom_1__PSunto the king of Edom__FF2Ki/3/9\');">2Ki 3:9__NBAmo/2/1\');">Amo 2:1__EN';
stringArray[27] = 'Then he took his eldest son that should have reigned in his stead, and __PNoffered_him_1__SHoffered him</a> [for] a burnt offering upon the wall. And there was great indignation against Israel: and __PNthey_departed_2__SHthey departed</a> from him, and returned to [their own] land.__CPoffered_him_1__PSoffered him__EEIn cases of great extremity, it was customary in various heathen nations, to offer human sacrifices, and even their own children. This was frequent among the Phoenicians, Greeks, Romans, Scythians, Gauls, Africans, and others; and was the natural fruit of a religious system, which had for the objects of its worship cruel and merciless divinities. The king of Moab, in this case, sacrificed his son to obtain the favour of Chemosh his god, who, being a devil, delighted in blood and murder, and the destruction of mankind. The dearer any thing was to them, the more acceptable those idolaters thought the sacrifice, and therefore burnt their children in the fire to their honour. __NAGen/22/2\');">Gen 22:2__NRGen/22/13\');">13__NBDeu/12/31\');">Deu 12:31__NBJdg/11/31\');">Jdg 11:31__NRJdg/11/39\');">39__NBPsa/106/37\');">Psa 106:37__NRPsa/106/38\');">38__NBEze/16/20\');">Eze 16:20__NBMic/6/7\');">Mic 6:7__AN__GHthey_departed_2__PSthey departed__EF1Sa/14/36\');">1Sa 14:36-46__NB1Ki/20/13\');">1Ki 20:13__NR1Ki/20/28\');">28__NR1Ki/20/43\');">43__EN';
