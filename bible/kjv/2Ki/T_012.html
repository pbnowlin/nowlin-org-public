stringArray[5] = '__PNLet_the_priests_1__SHLet the priests</a> take [it] to them, every man of his acquaintance: and __PNlet_them_repair_2__SHlet them repair</a> the breaches of the house, wheresoever any breach shall be found.__CPLet_the_priests_1__PSLet the priests__FF2Ch/24/5\');">2Ch 24:5__AN__GHlet_them_repair_2__PSlet them repair__EF2Ki/12/12\');">2Ki 12:12__NB2Ki/22/5\');">2Ki 22:5__NR2Ki/22/6\');">6__NB1Ki/11/27\');">1Ki 11:27__NB2Ch/24/7\');">2Ch 24:7__NBIsa/58/12\');">Isa 58:12__EN';

stringArray[7] = 'Then __PNking_Jehoash_1__SHking Jehoash</a> called for __PNJehoiada_2__SHJehoiada</a> the priest, and the [other] priests, and said unto them, __PNWhy_repair_ye_3__SHWhy repair ye</a> not the breaches of the house? now therefore receive no [more] money of your acquaintance, but deliver it for the breaches of the house.__CPking_Jehoash_1__PSking Jehoash__FF2Ch/24/5\');">2Ch 24:5__NR2Ch/24/6\');">6-14__AN__GHJehoiada_2__PSJehoiada__EF2Ki/12/2\');">2Ki 12:2__NB2Ki/11/4\');">2Ki 11:4__NB2Ch/23/1\');">2Ch 23:1__NB2Ch/24/16\');">2Ch 24:16__AN__GGWhy_repair_ye_3__PSWhy repair ye__FF1Ch/21/3\');">1Ch 21:3__EN';

stringArray[9] = 'But Jehoiada the priest __PNtook_a_chest_1__SHtook a chest</a>, and bored a hole in the lid of it, and set it __PNbeside_2__SHbeside</a> the altar, on the right side as one cometh into the house of the LORD: and __PNthe_priests_3__SHthe priests</a> that kept the __PNdoor_4__SHdoor</a> put therein all the money [that was] brought into the house of the LORD.__CPtook_a_chest_1__PStook a chest__FF2Ch/24/8\');">2Ch 24:8-14__NBMar/12/41\');">Mar 12:41__AN__GHbeside_2__PSbeside__EF2Ch/24/10\');">2Ch 24:10__AN__GGthe_priests_3__PSthe priests__FF2Ki/22/4\');">2Ki 22:4__NB2Ki/23/4\');">2Ki 23:4__NB2Ki/25/18\');">2Ki 25:18__NB1Ch/15/18\');">1Ch 15:18__NR1Ch/15/24\');">24__NBJer/35/4\');">Jer 35:4__NBJer/52/24\');">Jer 52:24__AN__GHdoor_4__PSdoor__FEHeb. threshold. __NAPsa/84/10\');">Psa 84:10__AN; *marg:</TD></TR>';
stringArray[10] = 'And it was [so], when they saw that [there was] much money in the chest, that __PNthe_king_s_1__SHthe king\'s</a> __PNscribe_2__SHscribe</a> and the high priest came up, and they __PNput_up_3__SHput up</a> __PNin_bags_4__SHin bags</a>, and told the money that was found in the house of the LORD.__CPthe_king_s_1__PSthe king\'s__FF2Ki/19/2\');">2Ki 19:2__NB2Ki/22/3\');">2Ki 22:3__NR2Ki/22/12\');">12__NB2Sa/8/17\');">2Sa 8:17__NB2Sa/20/25\');">2Sa 20:25__AN__GHscribe_2__PSscribe__FEor, secretary__GGput_up_3__PSput up__EEHeb. bound up. __NA2Ki/5/23\');">2Ki 5:23__AN__GHin_bags_4__PSin bags__FE"Sir J. Chardin informs us, ""it is a custom of Persia always to seal up bags of money; and the money of the king\'s treasure is not told, but is received by bags sealed up."" These are what are called in the East purses; each of which, as Maillet informs us, contains money to the amount of 1,500 livres, or about 63£. of our money. The money thus collected for the reparation of the temple, seems, in like manner, to have been reckoned in bags of equal value to each other; as we can scarcely imagine the placing it in bags would otherwise have been mentioned. The value of a Jewish purse is unknown; but the bags mentioned in __NA2Ki/5/23\');">2Ki 5:23__AN, amounted to a talent."</TD></TR>';

stringArray[12] = 'And to __PNmasons_1__SHmasons</a>, and hewers of stone, and to buy timber and hewed stone to repair the breaches of the house of the LORD, and for all that __PNwas_laid_out_2__SHwas laid out</a> for the house to repair [it].__CPmasons_1__PSmasons__FF1Ki/5/17\');">1Ki 5:17__NR1Ki/5/18\');">18__NBEzr/3/7\');">Ezr 3:7__NBEzr/5/8\');">Ezr 5:8__NBLuk/21/5\');">Luk 21:5__AN__GHwas_laid_out_2__PSwas laid out__FEHeb. went forth.</TD></TR>';
stringArray[13] = 'Howbeit __PNthere_were_not_1__SHthere were not</a> made for the house of the LORD __PNbowls_2__SHbowls</a> of silver, snuffers, basons, __PNtrumpets_3__SHtrumpets</a>, any vessels of gold, or vessels of silver, of the money [that was] brought into the house of the LORD:__CPthere_were_not_1__PSthere were not__EE"That is, there were no vessels made for the service of the temple till all the outward repairs were completed; but, when this was done, ""they brought the rest of the money before the king and Jehoiada, whereof were made vessels of gold and silver,"" (__NA2Ch/24/14\');">2Ch 24:14__AN,) to replace those which had been taken away by Athaliah and her sons. __NA2Ch/24/14\');">2Ch 24:14__AN"__GHbowls_2__PSbowls__EFNum/7/13\');">Num 7:13__NRNum/7/14\');">14__NB1Ki/7/48\');">1Ki 7:48-50__NBEzr/1/9\');">Ezr 1:9-11__AN__GGtrumpets_3__PStrumpets__FFNum/10/2\');">Num 10:2__EN';

stringArray[17] = 'Then __PNHazael_2__SHHazael</a> king of Syria went up, and fought __PNagainst_Gath_3__SHagainst Gath</a>, and took it: and Hazael __PNset_his_face_4__SHset his face</a> to go up __PNto_Jerusalem_5__SHto Jerusalem</a>.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3164. B.C. 840.__GHHazael_2__PSHazael__EF2Ki/8/12\');">2Ki 8:12-15__AN__GGagainst_Gath_3__PSagainst Gath__FF1Sa/27/2\');">1Sa 27:2__NB1Ki/2/39\');">1Ki 2:39__NR1Ki/2/40\');">40__NB1Ch/8/13\');">1Ch 8:13__NB1Ch/18/1\');">1Ch 18:1__AN__GHset_his_face_4__PSset his face__EFJer/42/15\');">Jer 42:15__NBLuk/9/51\');">Luk 9:51__NRLuk/9/53\');">53__AN__GGto_Jerusalem_5__PSto Jerusalem__FF2Ch/24/23\');">2Ch 24:23__NR2Ch/24/24\');">24__EN';
stringArray[18] = 'And Jehoash king of Judah __PNtook_all_the_hallowed_1__SHtook all the hallowed</a> things that Jehoshaphat, and Jehoram, and Ahaziah, his fathers, kings of Judah, had dedicated, and his own hallowed things, and all the gold [that was] found in the treasures of the house of the LORD, and in the king\'s house, and sent [it] to Hazael king of Syria: and he __PNwent_away_2__SHwent away</a> from Jerusalem.__CPtook_all_the_hallowed_1__PStook all the hallowed__EEHe dearly bought, by such unhallowed means, a peace which was of short duration; for the next year Hazael returned, and Jehoash having no more treasures, was obliged to hazard a battle, which he lost, and the principal part of his nobility, so that Judah was totally ruined, and Jehoash soon after slain in his bed by his own servants. __NA2Ki/18/15\');">2Ki 18:15__NR2Ki/18/16\');">16__NB1Ki/15/18\');">1Ki 15:18__NB2Ch/16/2\');">2Ch 16:2__AN__GHwent_away_2__PSwent away__FEHeb. went up.</TD></TR>';

stringArray[20] = 'And __PNhis_servants_1__SHhis servants</a> arose, and made a conspiracy, and slew Joash in __PNthe_house_of_Millo_2__SHthe house of Millo</a>, which goeth down to Silla.__CPhis_servants_1__PShis servants__FF2Ki/14/5\');">2Ki 14:5__NB2Ch/24/24\');">2Ch 24:24__NR2Ch/24/25\');">25__NB2Ch/25/27\');">2Ch 25:27__NB2Ch/33/24\');">2Ch 33:24__AN__GHthe_house_of_Millo_2__PSthe house of Millo__FEor, Beth-millo. __NAJdg/9/6\');">Jdg 9:6__NB2Sa/5/9\');">2Sa 5:9__NB1Ki/11/27\');">1Ki 11:27__EN';
stringArray[21] = 'For __PNJozachar_1__SHJozachar</a> the son of Shimeath, and Jehozabad the son of __PNShomer_2__SHShomer</a>, his servants, smote him, and he died; and they buried him with his fathers in the city of David: and __PNAmaziah_his_son_3__SHAmaziah his son</a> reigned in his stead.__CPJozachar_1__PSJozachar__EEThis person is called Zabad in Chronicles, and Shimeath his mother is said to be an Ammonitess; and Jehozabad is said to be the son, not of Shomer, but of Shimrith, a Moabitess. Who the fathers of these two persons were we know not; they were probably foreigners and aliens. Some suppose that they belonged to the king\'s chamber, and therefore could have easy access to him. __NA2Ch/24/26\');">2Ch 24:26__AN; Zabad__GHShomer_2__PSShomer__EF2Ch/24/26\');">2Ch 24:26__AN; Shimrith__GGAmaziah_his_son_3__PSAmaziah his son__FF2Ch/24/27\');">2Ch 24:27__EN';
