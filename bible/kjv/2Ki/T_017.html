stringArray[33] = '__PNThey_feared_1__SHThey feared</a> the LORD, and served their own gods, after the manner of the nations __PNwhom_they_carried__etc__2__SHwhom they carried</a> away from thence.__CPThey_feared_1__PSThey feared__FF2Ki/17/41\');">2Ki 17:41__NB1Ki/18/21\');">1Ki 18:21__NBHsa/10/2\');">Hsa 10:2__NBZep/1/5\');">Zep 1:5__NBMat/6/24\');">Mat 6:24__NBLuk/16/13\');">Luk 16:13__AN__GHwhom_they_carried__etc__2__PSwhom they carried, etc.__FE"or, who carried them away from thence. The new inhabitants of the land imitated the idolatrous Israelites, by associating their idols with Jehovah, as the objects of worship. The remainder, however, of the verses seem to relate to the Israelites after they were carried captive. They still persevered in idolatry and disobedience; and not being purified, were left to be consumed in the furnace. It is said that the Israelites ""did not fear the LORD,"" yet the heathens, who followed their example, are said ""to have feared the LORD."" The Israelites did not so much as fear the wrath of Almighty God; but, on the other hand, the poor pagans feared the power of his wrath, and to avert it paid some ignorant worship, according to the wretched instructions given them. As this was an external acknowledgement of his power and Godhead, and a homage paid to him,he was pleased in consequence to withdraw his judgements from them.--SCOTT"</TD></TR>';
