Text[1] = 'Manasseh [was] twelve years old when he began to reign, and reigned fifty and five years in Jerusalem. And his mother\'s name [was] Hephzibah.';

Text[9] = 'But they hearkened not: and Manasseh seduced them to do more evil than did the nations whom the LORD destroyed before the children of Israel.';
Text[10] = 'And the LORD spake by his servants the prophets, saying,';
Text[11] = 'Because Manasseh king of Judah hath done these abominations, [and] hath done wickedly above all that the Amorites did, which [were] before him, and hath made Judah also to sin with his idols:';
Text[12] = 'Therefore thus saith the LORD God of Israel, Behold, I [am] bringing [such] evil upon Jerusalem and Judah, that whosoever heareth of it, both his ears shall tingle.';
Text[13] = 'And I will stretch over Jerusalem the line of Samaria, and the plummet of the house of Ahab: and I will wipe Jerusalem as [a man] wipeth a dish, wiping [it], and turning [it] upside down.';
Text[14] = 'And I will forsake the remnant of mine inheritance, and deliver them into the hand of their enemies; and they shall become a prey and a spoil to all their enemies;';
Text[15] = 'Because they have done [that which was] evil in my sight, and have provoked me to anger, since the day their fathers came forth out of Egypt, even unto this day.';
Text[16] = 'Moreover Manasseh shed innocent blood very much, till he had filled Jerusalem from one end to another; beside his sin wherewith he made Judah to sin, in doing [that which was] evil in the sight of the LORD.';
Text[17] = 'Now the rest of the acts of Manasseh, and all that he did, and his sin that he sinned, [are] they not written in the book of the chronicles of the kings of Judah?';
Text[18] = 'And Manasseh slept with his fathers, and was buried in the garden of his own house, in the garden of Uzza: and Amon his son reigned in his stead.';

Text[20] = 'And he did [that which was] evil in the sight of the LORD, as his father Manasseh did.';
Text[21] = 'And he walked in all the way that his father walked in, and served the idols that his father served, and worshipped them:';
Text[22] = 'And he forsook the LORD God of his fathers, and walked not in the way of the LORD.';
