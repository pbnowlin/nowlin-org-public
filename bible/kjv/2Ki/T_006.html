stringArray[18] = 'And when they came down to him, Elisha prayed unto the LORD, and said, __PNSmite_this_people_1__SHSmite this people</a>, I pray thee, with blindness. And he smote them with blindness according to the word of Elisha.__CPSmite_this_people_1__PSSmite this people__EEConfound their sight, so that they may not know what they see; and so mistake one place for another. The word sanverim, rendered blindness, occurs only here and in __NAGen/19/11\');">Gen 19:11__AN, on which see the Note. __NADeu/28/28\');">Deu 28:28__NBJob/5/14\');">Job 5:14__NBZec/12/4\');">Zec 12:4__NBJhn/9/39\');">Jhn 9:39__NBJhn/12/40\');">Jhn 12:40__NBAct/13/11\');">Act 13:11__NBRom/11/7\');">Rom 11:7__EN';

stringArray[20] = 'And it came to pass, when they were come into Samaria, that Elisha said, LORD, __PNopen_the_eyes_1__SHopen the eyes</a> of these [men], that they may see. And the LORD __PNopened_2__SHopened</a> their eyes, and they saw; and, behold, [they were] in the midst of Samaria.__CPopen_the_eyes_1__PSopen the eyes__FF2Ki/6/17\');">2Ki 6:17__NBLuk/24/31\');">Luk 24:31__AN__GHopened_2__PSopened__EFJdg/20/40\');">Jdg 20:40-42__NBLuk/16/23\');">Luk 16:23__EN';

stringArray[23] = 'And __PNhe_prepared_1__SHhe prepared</a> great provision for them: and when they had eaten and drunk, he sent them away, and they went to their master. __PNSo_the_bands_2__SHSo the bands</a> of Syria came no more into the land of Israel.__CPhe_prepared_1__PShe prepared__FF1Sa/24/17\');">1Sa 24:17__NR1Sa/24/18\');">18__NB2Ch/28/15\');">2Ch 28:15__NBPro/25/21\');">Pro 25:21__NRPro/25/22\');">22__NBMat/5/47\');">Mat 5:47__NBLuk/6/35\');">Luk 6:35__NBLuk/10/29\');">Luk 10:29-37__AN__GHSo_the_bands_2__PSSo the bands__FEThat is, for a considerable time. What is mentioned in the next verse was more than a year afterwards. See on __NA2Ki/6/8\');">2Ki 6:8__NR2Ki/6/9\');">9__NB2Ki/5/2\');">2Ki 5:2__NB2Ki/24/2\');">2Ki 24:2__EN';
stringArray[24] = 'And it came to pass after this, that Benhadad king of Syria __PNgathered_1__SHgathered</a> all his host, and went up, and besieged Samaria.__CPgathered_1__PSgathered__FF2Ki/17/5\');">2Ki 17:5__NB2Ki/18/9\');">2Ki 18:9__NB2Ki/25/1\');">2Ki 25:1__NBDeu/28/52\');">Deu 28:52__NB1Ki/20/1\');">1Ki 20:1__NB1Ki/22/31\');">1Ki 22:31__NBEcc/9/14\');">Ecc 9:14__EN';
stringArray[25] = 'And there was __PNa_great_famine_1__SHa great famine</a> in Samaria: and, behold, they besieged it, until __PNan_ass_s_head_2__SHan ass\'s head</a> was [sold] for fourscore [pieces] of silver, and the fourth part of a cab of __PNdove_s_dung_3__SHdove\'s dung</a> for five [pieces] of silver.__CPa_great_famine_1__PSa great famine__FF2Ki/6/28\');">2Ki 6:28__NR2Ki/6/29\');">29__NB2Ki/7/4\');">2Ki 7:4__NB2Ki/25/3\');">2Ki 25:3__NB1Ki/18/2\');">1Ki 18:2__NBJer/14/13\');">Jer 14:13-15__NRJer/14/18\');">18__NBJer/32/24\');">Jer 32:24__NBJer/52/6\');">Jer 52:6__AN__GHan_ass_s_head_2__PSan ass\'s head__FEIf the pieces of silver were drachms, the whole would amount to about 2£. 9s.; which was a great price for so mean a part of this unclean animal. __NAEze/4/13\');">Eze 4:13-16__AN__GGdove_s_dung_3__PSdove\'s dung__EE"This probably denotes, as Bochart, Scheuchzer, and others suppose, a kind of pulse, or vetches, which the Arabs still call pigeon\'s dung. ""They never,"" says Dr. Shaw, (Travels, p. 140), ""constitute a dish by themselves, but are strewed singly as a garnish over cuscasowe, pillowe, and other dishes. They are besides in the greatest repute after they are parched in pans and ovens; then assuming the name leblebby; "" and he thinks they were so called from being pointed at one end, and acquiring an ash colour in parching."</TD></TR>';
