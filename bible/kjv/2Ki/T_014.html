stringArray[1] = 'In the second year of __PNJoash_2__SHJoash</a> son of Jehoahaz king of Israel __PNreigned_Amaziah_3__SHreigned Amaziah</a> the son of Joash king of Judah.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3165. B.C. 839.__GHJoash_2__PSJoash__EF2Ki/14/15\');">2Ki 14:15__NB2Ki/13/10\');">2Ki 13:10__AN__GGreigned_Amaziah_3__PSreigned Amaziah__FF1Ch/3/12\');">1Ch 3:12__NB2Ch/25/1\');">2Ch 25:1-4__EN';

stringArray[3] = 'And __PNhe_did_2__SHhe did</a> [that which was] right in the sight of the LORD, yet not like David his father: __PNhe_did_according_3__SHhe did according</a> to all things as Joash his father did.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3165-3194. B.C. 839-810.__GHhe_did_2__PShe did__EF2Ki/12/2\');">2Ki 12:2__NB1Ki/11/4\');">1Ki 11:4__NB1Ki/15/3\');">1Ki 15:3__NB2Ch/25/2\');">2Ch 25:2__NR2Ch/25/3\');">3__AN__GGhe_did_according_3__PShe did according__FF2Ch/24/2\');">2Ch 24:2__NR2Ch/24/17\');">17__NB2Ch/25/14\');">2Ch 25:14-16__NBJer/16/19\');">Jer 16:19__NBZec/1/4\');">Zec 1:4-6__NB1Pe/1/18\');">1Pe 1:18__EN';

stringArray[5] = 'And it came to pass, as soon as the kingdom was confirmed in his hand, __PNthat_he_slew_2__SHthat he slew</a> __PNhis_servants_3__SHhis servants</a> which had slain the king his father.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3166. B.C. 838.__GHthat_he_slew_2__PSthat he slew__EFGen/9/6\');">Gen 9:6__NBExd/21/12\');">Exd 21:12-14__NBNum/35/33\');">Num 35:33__AN__GGhis_servants_3__PShis servants__FF2Ki/12/20\');">2Ki 12:20__NR2Ki/12/21\');">21__NB2Ch/25/3\');">2Ch 25:3__NR2Ch/25/4\');">4__EN';
stringArray[6] = 'But the children of the murderers he slew not: according unto that which is written in the book of the law of Moses, wherein the LORD commanded, saying, __PNThe_fathers_1__SHThe fathers</a> shall not be put to death for the children, nor the children be put to death for the fathers; but every man shall be put to death for his own sin.__CPThe_fathers_1__PSThe fathers__FFDeu/24/16\');">Deu 24:16__NBEze/18/4\');">Eze 18:4__NREze/18/20\');">20__EN';
stringArray[7] = 'He __PNslew_2__SHslew</a> of Edom in __PNthe_valley_of_salt_3__SHthe valley of salt</a> ten thousand, and took __PNSelah_4__SHSelah</a> by war, and called the name of it __PNJoktheel_5__SHJoktheel</a> unto this day.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3177. B.C.827.__GHslew_2__PSslew__EF2Ki/8/20\');">2Ki 8:20-22__NB2Ch/25/11\');">2Ch 25:11__NR2Ch/25/12\');">12__AN__GGthe_valley_of_salt_3__PSthe valley of salt__EESome suppose that the Valley of Salt was south of the Dead, or Salt Sea, towards the land of Edom; and others suppose it to be the Valley of Salt, about three or four miles south-east of Palmyra, which now supplies, in a great measure, the surrounding country with salt. __NA2Sa/8/13\');">2Sa 8:13__NB1Ch/18/12\');">1Ch 18:12__NBPsa/60/1\');">Psa 60:1__AN; *title__GHSelah_4__PSSelah__FEor, the rock. Selah is generally supposed to be the same as Petra, which in Greek signifies a rock, the celebrated capital of Arabia Petræa. Strabo places it three or four days\' journey from Jericho, and five days\' journey from the forest of palm trees on the Red Sea. Pliny places it 600 miles from Gaza, and 125 from the Persian Gulf; but Cellarius and Reland very justly consider that the numbers have been changed, and that we ought to read 125 miles from Gaza, and 600 from the Persian Gulf. Eusebius places Beerothbenejaakan 30 miles west from Petra, and Elath ten miles east; and Burckhardt discovered the ruins of this ancient city in a valley called Wady Mousa.__GGJoktheel_5__PSJoktheel__FFJos/15/38\');">Jos 15:38__EN';
stringArray[8] = 'Then __PNAmaziah_2__SHAmaziah</a> sent messengers to Jehoash, the son of Jehoahaz son of Jehu, king of Israel, saying, __PNCome_3__SHCome</a>, let us look one another in the face.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3178. B.C. 826.__GHAmaziah_2__PSAmaziah__EF2Ch/25/17\');">2Ch 25:17-24__AN__GGCome_3__PSCome__FF2Ki/14/11\');">2Ki 14:11__NB2Sa/2/14\');">2Sa 2:14-17__NBPro/13/10\');">Pro 13:10__NBPro/17/14\');">Pro 17:14__NBPro/18/6\');">Pro 18:6__NBPro/20/18\');">Pro 20:18__NBPro/25/8\');">Pro 25:8__EN';
stringArray[9] = 'And Jehoash the king of Israel sent to Amaziah king of Judah, saying, __PNThe_thistle_1__SHThe thistle</a> that [was] in Lebanon sent to the cedar that [was] in Lebanon, saying, Give thy daughter to my son to wife: and there passed by a wild beast that [was] in Lebanon, and trode down the thistle.__CPThe_thistle_1__PSThe thistle__FFJdg/9/8\');">Jdg 9:8-15__NB2Sa/12/1\');">2Sa 12:1-4__NB1Ki/4/33\');">1Ki 4:33__NBEze/20/49\');">Eze 20:49__AN; The word choach , which is rendered here, and in __NA2Ch/25/18\');">2Ch 25:18__NBJob/31/18\');">Job 31:18__AN,; thistle , in __NA1Sa/13/6\');">1Sa 13:6__AN,; thicket , in __NAIsa/34/13\');">Isa 34:13__AN; bramble, and in __NA2Ch/33/11\');">2Ch 33:11__NBPro/26/9\');">Pro 26:9__NBSgs/2/2\');">Sgs 2:2__NBHsa/9/6\');">Hsa 9:6__AN; thorn , is probably the black thorn , or sloe tree , the prunus spinosa of Linnæus, as the same word signifies in Arabic. There is a vast deal of insolent dignity in this remonstrance of Jehoash; but it has nothing conciliatory; no proposal of making amends for the injury his army had done to the unoffending inhabitants of Judah. __NA2Ch/25/10\');">2Ch 25:10-13__AN; The comparitively useless thorn, which may be the emblem of the house of Judah and David, while the house of Jehu is represented by the stately cedar.</TD></TR>';
stringArray[10] = 'Thou hast indeed smitten Edom, and __PNthine_heart_1__SHthine heart</a> hath lifted thee up: __PNglory_of_this_2__SHglory [of this]</a>, and tarry at __PNhome_3__SHhome</a>: for __PNwhy_shouldest_4__SHwhy shouldest</a> thou meddle to [thy] hurt, that thou shouldest fall, [even] thou, and Judah with thee?__CPthine_heart_1__PSthine heart__FFDeu/8/14\');">Deu 8:14__NB2Ch/26/16\');">2Ch 26:16__NB2Ch/32/25\');">2Ch 32:25__NBPro/16/18\');">Pro 16:18__NBEze/38/2\');">Eze 38:2__NREze/38/5\');">5__NREze/38/17\');">17__NBDan/5/20\');">Dan 5:20-23__NBHab/2/4\');">Hab 2:4__NBJam/4/6\');">Jam 4:6__AN__GHglory_of_this_2__PSglory of this__EFExd/8/9\');">Exd 8:9__NBJer/9/23\');">Jer 9:23__NRJer/9/24\');">24__NBJam/1/9\');">Jam 1:9__AN__GGhome_3__PShome__EEHeb. thy house__GHwhy_shouldest_4__PSwhy shouldest__EF2Ch/35/21\');">2Ch 35:21__NBPro/3/30\');">Pro 3:30__NBPro/15/18\');">Pro 15:18__NBPro/17/14\');">Pro 17:14__NBPro/20/3\');">Pro 20:3__NBPro/25/8\');">Pro 25:8__NBPro/26/17\');">Pro 26:17__NBLuk/14/31\');">Luk 14:31__NRLuk/14/32\');">32__EN';
stringArray[11] = 'But __PNAmaziah_1__SHAmaziah</a> would not hear. Therefore Jehoash king of Israel went up; and he and Amaziah king of Judah looked one another in the face at __PNBeth_shemesh_2__SHBethshemesh</a>, which [belongeth] to Judah.__CPAmaziah_1__PSAmaziah__FF2Ch/25/16\');">2Ch 25:16__NR2Ch/25/20\');">20__AN__GHBeth_shemesh_2__PSBeth-shemesh__EFJos/19/38\');">Jos 19:38__NBJos/21/16\');">Jos 21:16__NB1Sa/6/9\');">1Sa 6:9-19__EN';

stringArray[14] = 'And he took __PNall_the_gold_1__SHall the gold</a> and silver, and all the vessels that were found in the house of the LORD, and in the treasures of the king\'s house, __PNand_hostages_2__SHand hostages</a>, and returned to Samaria.__CPall_the_gold_1__PSall the gold__FF2Ki/24/13\');">2Ki 24:13__NB2Ki/25/15\');">2Ki 25:15__NB1Ki/7/51\');">1Ki 7:51__NB1Ki/14/26\');">1Ki 14:26__NB1Ki/15/18\');">1Ki 15:18__AN__GHand_hostages_2__PSand hostages__EF2Ki/18/23\');">2Ki 18:23__AN; *marg:</TD></TR>';

stringArray[20] = 'And they brought him on horses: and __PNhe_was_buried_1__SHhe was buried</a> at Jerusalem with his fathers in the city of David.__CPhe_was_buried_1__PShe was buried__FF2Ki/8/24\');">2Ki 8:24__NB2Ki/9/28\');">2Ki 9:28__NB2Ki/12/21\');">2Ki 12:21__NB1Ki/2/10\');">1Ki 2:10__NB1Ki/11/43\');">1Ki 11:43__NB2Ch/21/20\');">2Ch 21:20__NB2Ch/26/23\');">2Ch 26:23__NB2Ch/33/20\');">2Ch 33:20__EN';
stringArray[21] = 'And all the people of Judah took __PNAzariah_1__SHAzariah</a>, which [was] sixteen years old, and __PNmade_him_king_2__SHmade him king</a> instead of his father Amaziah.__CPAzariah_1__PSAzariah__FF2Ki/15/13\');">2Ki 15:13__NB2Ch/26/1\');">2Ch 26:1__AN; Uzziah. __NAMat/1/8\');">Mat 1:8__NRMat/1/9\');">9__AN; Ozias__GHmade_him_king_2__PSmade him king__EF2Ki/21/24\');">2Ki 21:24__NB1Ch/3/12\');">1Ch 3:12__EN';
stringArray[22] = 'He built __PNElath_1__SHElath</a>, and restored it to Judah, after that the king slept with his fathers.__CPElath_1__PSElath__EEElath, the Æla or Elana of the Greek and Roman writers, was a celebrated port situated at the extremity of the eastern branch of the Red Sea, hence called the Elanitic Gulf, ten miles east from Petra, according to Eusebius, and 150 Roman miles from Gaza, according to Pliny, but 1,260 stadia, or 157 miles, according to Strabo and Marcianus Herecleota. It is now called Akaba, and is nothing but a tower or castle, surrounded by a large grove of date trees, the residence of a governor, dependent on him of Grand Cairo. __NA2Ki/16/6\');">2Ki 16:6__NBDeu/2/8\');">Deu 2:8__NB1Ki/9/26\');">1Ki 9:26__NB2Ch/26/2\');">2Ch 26:2__AN; Eloth</TD></TR>';
stringArray[23] = 'In __PNthe_fifteenth_2__SHthe fifteenth</a> year of Amaziah the son of Joash king of Judah __PNJeroboam_3__SHJeroboam</a> the son of Joash king of Israel __PNbegan_to_reign_4__SHbegan to reign</a> in Samaria, [and reigned] forty and one years.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3179-3220. B.C. 825-784.__GHthe_fifteenth_2__PSthe fifteenth__EF2Ki/14/17\');">2Ki 14:17__AN__GGJeroboam_3__PSJeroboam__FF2Ki/14/27\');">2Ki 14:27__NBHsa/1/1\');">Hsa 1:1__NBAmo/1/1\');">Amo 1:1__NBAmo/7/9\');">Amo 7:9-11__AN__GHbegan_to_reign_4__PSbegan to reign__FE"""Now he begins to reign alone."""</TD></TR>';
stringArray[24] = 'And he did [that which was] evil __PNin_the_sight_1__SHin the sight</a> of the LORD: __PNhe_departed_2__SHhe departed</a> not from all the sins of Jeroboam the son of Nebat, who made Israel to sin.__CPin_the_sight_1__PSin the sight__FF2Ki/21/6\');">2Ki 21:6__NBGen/38/7\');">Gen 38:7__NBDeu/9/18\');">Deu 9:18__NB1Ki/21/25\');">1Ki 21:25__AN__GHhe_departed_2__PShe departed__EF2Ki/13/2\');">2Ki 13:2__NR2Ki/13/6\');">6__NR2Ki/13/11\');">11__NB1Ki/12/28\');">1Ki 12:28-31__NBPsa/106/20\');">Psa 106:20__EN';
stringArray[25] = 'He restored the coast of Israel __PNfrom_the_entering_1__SHfrom the entering</a> of Hamath __PNunto_the_sea_2__SHunto the sea</a> of the plain, according to the word of the LORD God of Israel, which he spake by the hand of his servant __PNJonah_3__SHJonah</a>, the son of Amittai, the prophet, which [was] of __PNGath_hepher_4__SHGathhepher</a>.__CPfrom_the_entering_1__PSfrom the entering__FFNum/13/21\');">Num 13:21__NBNum/34/7\');">Num 34:7__NRNum/34/8\');">8__NBEze/47/16\');">Eze 47:16-18__NBAmo/6/14\');">Amo 6:14__AN__GHunto_the_sea_2__PSunto the sea__EFGen/14/3\');">Gen 14:3__NBDeu/3/17\');">Deu 3:17__AN__GGJonah_3__PSJonah__FFJon/1/1\');">Jon 1:1__NBMat/12/39\');">Mat 12:39__NRMat/12/40\');">40__NBMat/16/4\');">Mat 16:4__AN; Jonas__GHGath_hepher_4__PSGath-hepher__EFJos/19/13\');">Jos 19:13__AN; Gittah-hepher</TD></TR>';
