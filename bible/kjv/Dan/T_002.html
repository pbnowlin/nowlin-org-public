stringArray[39] = 'And after thee shall arise __PNanother_kingdom_1__SHanother kingdom</a> inferior to thee, and __PNanother_third_2__SHanother third</a> kingdom of brass, which shall bear rule over all the earth.__CPanother_kingdom_1__PSanother kingdom__EEThe empire of the Medes and Persians, whose union was denoted by the breast and two arms of silver; and which was established on the ruins of that of the Chaldeans on the capture of Babylon by Cyrus, B.C. 538. __NADan/2/32\');">Dan 2:32__NBDan/5/28\');">Dan 5:28-31__NBDan/7/5\');">Dan 7:5__NBDan/8/3\');">Dan 8:3__NRDan/8/4\');">4__NRDan/8/20\');">20__NBDan/11/2\');">Dan 11:2__NBIsa/44/28\');">Isa 44:28__NBIsa/45/1\');">Isa 45:1-5__AN__GHanother_third_2__PSanother third__FE"The empire of the Macedonians, or ""brazen-coated Greeks,"" aptly denoted by the belly and thighs of brass, founded by Alexander the Great, who terminated the Persian monarchy by the overthrow of Darius Codomanus at Arbela, B.C. 331 __NADan/2/32\');">Dan 2:32__NBDan/7/6\');">Dan 7:6__NRDan/7/7\');">7__NRDan/7/23\');">23__NBDan/8/5\');">Dan 8:5-14__NBDan/10/20\');">Dan 10:20__NBDan/11/3\');">Dan 11:3-20__NBZec/6/3\');">Zec 6:3__NRZec/6/6\');">6__AN"</TD></TR>';
