stringArray[20] = 'And of __PNthe_ten_horns_1__SHthe ten horns</a> that [were] in his head, and [of] the other which came up, and before whom three fell; even [of] that horn that had eyes, and a mouth that spake very great things, __PNwhose_look_2__SHwhose look</a> [was] more stout than his fellows.__CPthe_ten_horns_1__PSthe ten horns__EEThe ten kingdoms into which the western Roman empire was divided; which were primarily, according to Machiavel and Bp. Lloyd, 1. The Huns in Hungary, A.D. 356. 2. The Ostrogoths in Moesia, 377. 3. The Visigoths in Pannonia, 378. 4. The Sueves and Alans in Gascoigne and Spain, 407. 5. The Vandals in Africa, 407. 6. The Franks in France, 407. 7. The Burgundians in Burgundy, 407. 8. The Heruli and Turingi in Italy, 476. 9. The Saxons and Angles in Britain, 476. 10. The Lombards, first upon the Danube, 526, and afterwards in Italy. Though the ten kingdoms differed from these in later periods, and were sometimes more or less, yet they were still known by that name. __NADan/7/8\');">Dan 7:8__NRDan/7/11\');">11__NRDan/7/23\');">23__NBDan/8/9\');">Dan 8:9-11__AN__GHwhose_look_2__PSwhose look__EFDan/11/36\');">Dan 11:36__NRDan/11/37\');">37__EN';
