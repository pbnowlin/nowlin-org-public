stringArray[15] = 'So the king of the north shall come, and __PNcast_up_1__SHcast up</a> a mount, and take the __PNmost_fenced_cities_2__SHmost fenced cities</a>: and the arms of the south __PNshall_not_3__SHshall not</a> withstand, neither __PNhis_chosen_people_4__SHhis chosen people</a>, neither [shall there be any] strength to withstand.__CPcast_up_1__PScast up__FFJer/5/10\');">Jer 5:10__NBJer/6/6\');">Jer 6:6__NBJer/33/4\');">Jer 33:4__NBJer/52/4\');">Jer 52:4__NBEze/17/17\');">Eze 17:17__AN__GHmost_fenced_cities_2__PSmost fenced cities__FEHeb. city of munitions. After fourteen years, Ptolemy Philopater having been succeeded by Ptolemy Epiphanes, then a minor, Antiochus raised a greater army than before, and having defeated his best troops under Scopas, recovered possession of Caelo-Syria and Palestine, with all their fortified cities.__GGshall_not_3__PSshall not__FFDan/11/6\');">Dan 11:6__NBDan/8/7\');">Dan 8:7__NBJos/1/5\');">Jos 1:5__NBPro/21/30\');">Pro 21:30__NRPro/21/31\');">31__AN__GHhis_chosen_people_4__PShis chosen people__FEHeb. the people of his choices.</TD></TR>';

stringArray[17] = '__PNHe_shall_also_1__SHHe shall also</a> __PNset_2__SHset</a> his face to enter with the strength of his whole kingdom, and __PNupright_ones_3__SHupright ones</a> with him; thus shall he do: and he shall give him the daughter of women, __PNcorrupting_4__SHcorrupting</a> her: but she shall not stand [on his side], __PNneither_5__SHneither</a> be for him.__CPHe_shall_also_1__PSHe shall also__EEBeing assisted by the Jews, he purposed to subdue Egypt; but, entering into treaty with Ptolemy, he gave him his daughter Cleopatra in marriage, thinking to engage her to betray the interests of her husband; but in which he was deceived__GHset_2__PSset__EFDan/11/19\');">Dan 11:19__NB2Ki/12/17\');">2Ki 12:17__NB2Ch/20/3\');">2Ch 20:3__NBPro/19/21\');">Pro 19:21__NBEze/4/3\');">Eze 4:3__NREze/4/7\');">7__NBEze/25/2\');">Eze 25:2__NBLuk/9/51\');">Luk 9:51__AN__GGupright_ones_3__PSupright ones__EEor, much uprightness, or, equal conditions__GHcorrupting_4__PScorrupting__FEHeb. to corrupt__GGneither_5__PSneither__FFDan/9/26\');">Dan 9:26__NBPsa/56/9\');">Psa 56:9__NBEze/17/17\');">Eze 17:17__NBMat/12/30\');">Mat 12:30__NBLuk/11/23\');">Luk 11:23__NBRom/8/31\');">Rom 8:31__EN';
stringArray[18] = 'After this shall __PNhe_turn_1__SHhe turn</a> his face unto __PNthe_isles_2__SHthe isles</a>, and shall take many: but a prince __PNfor_his_own_behalf_3__SHfor his own behalf</a> shall cause __PNthe_reproach_4__SHthe reproach</a> offered by him to cease; without his own reproach __PNhe_shall_cause_5__SHhe shall cause</a> [it] to turn upon him.__CPhe_turn_1__PShe turn__EEHe subdued most of the maritime places and isles of the Mediterranean; but, being driven from Europe by the Roman consuls, he took refuge in Antioch; and, in order to raise the tribute they impressed upon him, he attempted to rob the temple of Elymaïs, and was there slain.__GHthe_isles_2__PSthe isles__EFGen/10/4\');">Gen 10:4__NRGen/10/5\');">5__NBJer/2/10\');">Jer 2:10__NBJer/31/10\');">Jer 31:10__NBEze/27/6\');">Eze 27:6__NBZep/2/11\');">Zep 2:11__AN__GGfor_his_own_behalf_3__PSfor his own behalf__EEHeb. for him__GHthe_reproach_4__PSthe reproach__FEHeb. his reproach__GGhe_shall_cause_5__PShe shall cause__FFJdg/1/7\');">Jdg 1:7__NBHsa/12/14\');">Hsa 12:14__NBMat/7/2\');">Mat 7:2__EN';
stringArray[19] = 'Then he shall turn his face toward the fort of his own land: __PNbut_1__SHbut</a> he shall stumble and fall, and not be found.__CPbut_1__PSbut__EEFrom the preceding verses in this chapter let us learn, 1. That God, in his providence, sets up one and pulls down another, as he pleases. 2. That this world is full of wars and fightings, which result from the indulgence of the lusts of men. 3. That all the changes and revolutions of states were plainly and perfectly foreseen by the God of heaven. 4. That no word of God can fall to the ground, but what he has declared shall infallibly come to pass. For the elucidation of the historical parts of Scripture, it is advantageous to notice the writings of heathen authors: light is thus thrown on many passages of Holy Writ, by shewing the accomplishment of the prophecies therein contained, or customs elucidated, which, in the course of years, or in our more northern latitude, would be to us inexplicable. We have therefore reason to bless God for human learning, by which many have done great service to the readers of His blessed word. __NAJob/20/8\');">Job 20:8__NBPsa/27/2\');">Psa 27:2__NBPsa/37/36\');">Psa 37:36__NBJer/46/6\');">Jer 46:6__NBEze/26/21\');">Eze 26:21__EN';
