stringArray[8] = 'But Daniel __PNpurposed_1__SHpurposed</a> in his heart that he would not __PNdefile_2__SHdefile</a> himself with the portion of the king\'s meat, nor with the wine which he drank: therefore he requested of the prince of the eunuchs that he might not defile himself.__CPpurposed_1__PSpurposed__FFRth/1/17\');">Rth 1:17__NRRth/1/18\');">18__NB1Ki/5/5\');">1Ki 5:5__NBPsa/119/106\');">Psa 119:106__NRPsa/119/115\');">115__NBAct/11/23\');">Act 11:23__NB1Cr/7/37\');">1Cr 7:37__NB2Cr/9/7\');">2Cr 9:7__AN__GHdefile_2__PSdefile__FEHeathen nations not only ate unclean beasts, which were forbidden by Jewish law, but even the clean animals that were eaten were first offered as victims to their gods, and part of the wine was poured out as a libation on their altars. Hence Athenæus calls the beasts served up at the tables of the Persian kings, [hieria] victims. Daniel was therefore resolved not to defile himself with their viands; yet he did not rudely refuse what was intended as a kindness, but mildly and modestly requested the proper officers to indulge him in this respect. __NALev/11/45\');">Lev 11:45-47__NBDeu/32/38\');">Deu 32:38__NBPsa/106/28\');">Psa 106:28__NBPsa/141/4\');">Psa 141:4__NBEze/4/13\');">Eze 4:13__NREze/4/14\');">14__NBHsa/9/3\');">Hsa 9:3__NRHsa/9/4\');">4__NBAct/10/14\');">Act 10:14-16__NBRom/14/15\');">Rom 14:15-17__NB1Cr/8/7\');">1Cr 8:7-10__NB1Cr/10/18\');">1Cr 10:18-21__NR1Cr/10/28\');">28-31__EN';
