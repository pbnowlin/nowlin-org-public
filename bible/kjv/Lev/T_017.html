stringArray[5] = 'To the end that the children of Israel may bring their sacrifices, which they offer __PNin_the_open_1__SHin the open</a> field, even that they may bring them unto the LORD, unto the door of the tabernacle of the congregation, unto the priest, __PNand_offer_them_2__SHand offer them</a> [for] peace offerings unto the LORD.__CPin_the_open_1__PSin the open__FFGen/21/33\');">Gen 21:33__NBGen/22/2\');">Gen 22:2__NRGen/22/13\');">13__NBGen/31/54\');">Gen 31:54__NBDeu/12/2\');">Deu 12:2__NB1Ki/14/23\');">1Ki 14:23__NB2Ki/16/4\');">2Ki 16:4__NB2Ki/17/10\');">2Ki 17:10__NB2Ch/28/4\');">2Ch 28:4__NBEze/20/28\');">Eze 20:28__NBEze/22/9\');">Eze 22:9__AN__GHand_offer_them_2__PSand offer them__EFLev/3/1\');">Lev 3:1-17__NBLev/7/11\');">Lev 7:11-21__NBExd/24/5\');">Exd 24:5__EN';
stringArray[6] = 'And the priest shall __PNsprinkle_1__SHsprinkle</a> the blood upon the altar of the LORD [at] the door of the tabernacle of the congregation, and __PNburn_2__SHburn</a> the fat for a sweet savour unto the LORD.__CPsprinkle_1__PSsprinkle__FFLev/3/2\');">Lev 3:2__NRLev/3/8\');">8__NRLev/3/13\');">13__AN__GHburn_2__PSburn__EFLev/3/5\');">Lev 3:5__NRLev/3/11\');">11__NRLev/3/16\');">16__NBLev/4/31\');">Lev 4:31__NBExd/29/13\');">Exd 29:13__NRExd/29/18\');">18__NBNum/18/17\');">Num 18:17__EN';
stringArray[7] = 'And they shall no more offer their sacrifices __PNunto_devils_1__SHunto devils</a>, after whom they have __PNgone_a_whoring_3__SHgone a whoring</a>. This shall be a statute for ever unto them throughout their generations.__CPunto_devils_1__PSunto devils__FFDeu/32/17\');">Deu 32:17__NB2Ch/11/15\');">2Ch 11:15__NBPsa/106/37\');">Psa 106:37__NBJhn/12/31\');">Jhn 12:31__NBJhn/14/30\');">Jhn 14:30__NB1Cr/10/20\');">1Cr 10:20__NB2Cr/4/4\');">2Cr 4:4__NBEph/2/2\');">Eph 2:2__NBRev/9/20\');">Rev 9:20__AN__GHdevils_2__PSdevils__FESeirim, properly signifies hairy or hairy ones; and hence is used not only for he-goats, but also for some fabulous beings or sylvan gods, to whom was ascribed the form of goats. Maimonides says that the Zabian idolaters worshipped demons under the form of goats; and that this custom being spread among other nations, gave occasion to this precept. He-goats, however, are probably intended here, which were objects of divine honour among the Egyptians under the name of honour among the Egyptians under the name of Mendes. Herodotus says that all goats were worshipped in Egypt; but particularly he-goats. From these seem to have sprung Pan, Silenus, and the innumerable herd of those imaginary beings, fauns, satyrs, dryads, etc., all woodland gods, and held in veneration by the Greeks and Romans.__GGgone_a_whoring_3__PSgone a whoring__EEThough this phrase is equivalent, in Scripture, to that of committing idolatry, yet it is to be taken sometimes in a literal sense. Baalpeor and Ashtaroth were worshipped with obscene rite; and public prostitution formed a great part of the worship among the Egyptians, Moabites, Canaanites, Greeks, and Romans. __NALev/20/5\');">Lev 20:5__NBExd/34/15\');">Exd 34:15__NBDeu/31/16\');">Deu 31:16__NBJer/3/1\');">Jer 3:1__NBEze/23/8\');">Eze 23:8__NBRev/17/1\');">Rev 17:1-5__EN';

stringArray[11] = 'For __PNthe_life_1__SHthe life</a> of the flesh [is] in the blood: and __PNI_have_2__SHI have</a> given it to you upon the altar to make an atonement for your souls: for it [is] the blood [that] maketh an atonement for the soul.__CPthe_life_1__PSthe life__EEThis sentence, which contains a most important truth, had existed in the Mosaic writings for more than 3,000 years, before the attention of any philosopher was drawn to the subject. That the blood actually possesses a living principle, and that the life of the whole body is derived from it, is a doctrine of revelation, and a doctrine which the experiments of the most accurate anatomists have served strongly to confirm. The proper circulation of this important fluid through the whole human system was first taught by Solomon in figurative language, (__NAEcc/12/6\');">Ecc 12:6__AN,) and discovered, as it is called, and demonstrated by Dr. Harvey in 1628; though some Italian philosophers had the same notion a little before. This accurate anatomist was the first who fully revived the Mosaic notion of the vitality of the blood; which was afterwards adopted by the justly celebrated Dr. John Hunter, professor of anatomy, and established by him, by a great variety of strong reasoning and accurate experiments. __NALev/17/14\');">Lev 17:14__AN__GHI_have_2__PSI have__EFLev/8/15\');">Lev 8:15__NBLev/16/11\');">Lev 16:11__NRLev/16/14\');">14-19__NBMat/20/28\');">Mat 20:28__NBMat/26/28\');">Mat 26:28__NBMar/14/24\');">Mar 14:24__NBRom/3/25\');">Rom 3:25__NBRom/5/9\');">Rom 5:9__NBEph/1/7\');">Eph 1:7__NBCol/1/14\');">Col 1:14__NRCol/1/20\');">20__NBHbr/9/22\');">Hbr 9:22__NBHbr/13/12\');">Hbr 13:12__NB1Pe/1/2\');">1Pe 1:2__NB1Jo/1/7\');">1Jo 1:7__NB1Jo/2/2\');">1Jo 2:2__NBRev/1/5\');">Rev 1:5__EN';
