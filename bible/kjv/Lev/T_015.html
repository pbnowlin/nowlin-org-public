stringArray[10] = 'And whosoever toucheth any thing that was under him shall be unclean until the even: and he that beareth [any of] those things shall wash his clothes, and bathe [himself] in water, and be unclean until the even.__CPRelated_Verses1_1__PSEntire Verse.__FFLev/15/5\');">Lev 15:5__NRLev/15/8\');">8__NBPsa/26/6\');">Psa 26:6__NBJam/4/8\');">Jam 4:8__EN';
stringArray[11] = 'And __PNwhomsoever_1__SHwhomsoever</a> he toucheth that hath the issue, and hath not rinsed his hands in water, he shall wash his clothes, and bathe [himself] in water, and be unclean until the even.__CPwhomsoever_1__PSwhomsoever__EEIt is rather doubtful whether the words hath not rinsed his hands in water refer to him who was diseased, or to him who had his hands touched. Most understand it of the former, that if the person who had the issue rinsed his hands in water, just before he touched any one, he did not communicate any pollution; otherwise, he did. But the Syriac refers it to the person touched by him, though it seems strange that he should be cleansed by washing his hands, when perhaps some other part was touched.</TD></TR>';

stringArray[17] = 'And every garment, and every __PNskin_1__SHskin</a>, whereon is the seed of copulation, shall be washed with water, and be unclean until the even.__CPskin_1__PSskin__EEThe poorer class of Arabs of our times make use of mats in their tents; and other inhabitants of these countries, who affect ancient simplicity of manners, make use of goat-skins. Dr. R. Chandler, in his Travels in Greece, tells us, that he saw some dervishes at Athens sitting on goat-skins; and that he was afterwards conducted into a room furnished in like manner, with the same kind of carpeting, where he was treated with a pipe and coffee by the chief dervish. Those that are at all acquainted with Oriental manners, in these later times, know that their dervishes (who are a sort of Mohammedan devotees, a good deal resembling the begging friars of the church or Rome) affect great simplicity, and even sometimes austerity, in their dress and way of living. As these dervishes that Dr. Chandler visited sat on goat-skins, and used no other kind of carpet for the accommodation of those who visited them: so it should seem that the Israelites in the wilderness made use of skins for mattresses to lie upon, and consequ</TD></TR>';
