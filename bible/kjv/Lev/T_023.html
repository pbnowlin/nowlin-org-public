stringArray[22] = 'And when ye reap the harvest of your land, thou shalt not make clean riddance of the corners of thy field when thou reapest, neither shalt thou gather any gleaning of thy harvest: thou shalt leave them unto the poor, and to the stranger: I [am] the LORD your God.__CPRelated_Verses1_1__PSEntire Verse.__FFLev/19/9\');">Lev 19:9__NRLev/19/10\');">10__NBDeu/16/11\');">Deu 16:11-14__NBDeu/24/19\');">Deu 24:19-21__NBRth/2/3\');">Rth 2:3-7__NRRth/2/15\');">15__NRRth/2/16\');">16-23__NBJob/31/16\');">Job 31:16-21__NBPsa/41/1\');">Psa 41:1-3__NBPsa/112/9\');">Psa 112:9__NBPro/11/24\');">Pro 11:24__NRPro/11/25\');">25__NBIsa/58/7\');">Isa 58:7__NRIsa/58/8\');">8__NRIsa/58/10\');">10__NBLuk/11/41\');">Luk 11:41__NB2Cr/9/5\');">2Cr 9:5-12__AN; To the institution of the feast of pentecost is annexed a repetition of that law, by which they were required to leave the gleanings of their fields, and the corn that grew on the ends of the butts, for the poor. It may come in here as a thing which the priests must take occasion to remind the people of, when they brought their first-fruits, intimating to them, that to obey even in this small matter was better than sacrifice; and that unless they were obedient, their offerings should not be accepted. It also taught them that the joy of harvest should express itself in charity to the poor, who must have their due out of what we have, as well as God his. They that are truly sensible of the mercy they receive from God, will without grudging shew mercy to the poor.</TD></TR>';
stringArray[23] = 'And the LORD spake unto Moses, saying,__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[24] = 'Speak unto the children of Israel, saying, __PNIn_the_seventh_1__SHIn the seventh</a> month, in the first [day] of the month, shall ye have a sabbath, __PNa_memorial_2__SHa memorial</a> of blowing of trumpets, an holy convocation.__CPIn_the_seventh_1__PSIn the seventh__FFNum/10/10\');">Num 10:10__NBNum/29/1\');">Num 29:1-6__NB1Ch/15/28\');">1Ch 15:28__NB2Ch/5/13\');">2Ch 5:13__NBEzr/3/6\');">Ezr 3:6__NBPsa/81/1\');">Psa 81:1-4__NBPsa/98/6\');">Psa 98:6__NBIsa/27/13\');">Isa 27:13__NB1Cr/15/52\');">1Cr 15:52__NB1Th/4/16\');">1Th 4:16__AN__GHa_memorial_2__PSa memorial__FE"Zichron terooâh, here rendered ""a memorial of blowing the trumpets"" properly signifies a memorial of triumph or shouting for joy. This festival is generally called the feast of trumpets; and, though the Scriptures have not expressly declared the reason of its celebration, yet, as it fell in the seventh month of the sacred year, which was the first of the civil year, that is, the month Tisri, answering to our September, the opinion very generally embraced by both Jews and Christians is, that it was a memorial of the creation of the world, at which ""the sons of God shouted for joy,"" (__NAJob/38/7\');">Job 38:7__AN;) and which is supposed, not altogether without reason, to have been at this season of the year. The month Tisri was not only anciently, but still is, reckoned by the Jews the first month of the year; and the feast of tabernacles, kept in this month, was said to be, as it is correctly rendered in the margin, ""at the revolution of the year,"" (__NAExd/34/22\');">Exd 34:22__AN;) importing, that at this season the year had revolved, and was beginnin"</TD></TR>';
