stringArray[4] = 'Then shall the priest command to take for him that is to be cleansed __PNtwo_birds_1__SHtwo birds</a> alive [and] clean, and __PNcedar_2__SHcedar</a> wood, and __PNscarlet_3__SHscarlet</a>, and __PNhyssop_4__SHhyssop</a>:__CPtwo_birds_1__PStwo birds__EE"or, sparrows. The word tzippor, from the Arabic zaphara, to fly, is used in the Scriptures to denote birds of every species, particularly small birds. But it is often used in a more restricted sense, as the Hebrew writers assert, to signify the sparrow. Aquinas says the same; and Jerome renders it here the sparrow. So the Greek [strouthia] in Matthew and Luke, which signifies a sparrow, is rendered by the Syriac translator tzipparin , the same as the Hebrew tzipporim . Nor is it peculiar to the Hebrews to give the same name to the sparrow and to fowls of the largest size; for Nicander calls the hen [strouthos katoikados] the domestic sparrow, and both Plautus and Ausonius call the ostrich, passer marinus, ""the marine sparrow."" It is evident, however, that the word in this passage signifies birds in general; for if the sparrow was a clean bird, there was no necessity for commanding a clean one to be taken, since every one of the species was ceremonially clean; but if it was unclean, then it could not be called"__GHcedar_2__PScedar__EFLev/14/6\');">Lev 14:6__NRLev/14/49\');">49-52__NBNum/19/6\');">Num 19:6__AN__GGscarlet_3__PSscarlet__FFHbr/9/19\');">Hbr 9:19__AN__GHhyssop_4__PShyssop__EFExd/12/22\');">Exd 12:22__NBNum/19/18\');">Num 19:18__NBPsa/51/7\');">Psa 51:7__EN';

stringArray[22] = 'And __PNtwo_turtledoves_1__SHtwo turtledoves</a>, or two young pigeons, such as he is able to get; and the one shall be a sin offering, and the other a burnt offering.__CPtwo_turtledoves_1__PStwo turtledoves__EETor, the turtle or ring-dove, so called by an onomatopoeia from its cooing, as in Greek [trugon], Latin, turtur and English, turtle. It is a species of the dove or pigeon, here called yonah, and in the Syriac yauno, from the verb to oppress, afflict, because of its being particularly defenceless, and exposed to rapine and violence. The dove is a genus of birds too well known to need a particular description; and of which there are several species besides the turtle-dove; as the wood pigeon, tame pigeon, and others. The dove is universally allowed to be one of the most beautiful objects in nature. The brilliancy of her plumage, the splendour of her eye, the innocence of her look, the excellence of her dispositions, and the purity of her manners, have been the theme of admiration and praise in every age. To the snowy whiteness of her wings, and the rich golden hues that adorn her neck, the inspired Psalmist alludes in most elegant strains. (__NAPsa/68/13\');">Psa 68:13__AN.) The voice of the dove is particularly tender and plaintive,</TD></TR>';
