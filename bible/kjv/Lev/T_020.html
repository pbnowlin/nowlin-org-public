stringArray[1] = 'And the LORD spake unto Moses, saying,__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[2] = 'Again, thou shalt say to the children of Israel, __PNWhosoever_1__SHWhosoever</a> [he be] of the children of Israel, or of the strangers that sojourn in Israel, that __PNgiveth_2__SHgiveth</a> [any] of his seed unto __PNMolech_3__SHMolech</a>; he shall surely be put to death: __PNthe_people_4__SHthe people</a> of the land shall stone him with stones.__CPWhosoever_1__PSWhosoever__FFLev/17/8\');">Lev 17:8__NRLev/17/13\');">13__NRLev/17/15\');">15__AN__GHgiveth_2__PSgiveth__EFLev/18/21\');">Lev 18:21__NBDeu/12/31\');">Deu 12:31__NBDeu/18/10\');">Deu 18:10__NB2Ki/17/17\');">2Ki 17:17__NB2Ki/23/10\');">2Ki 23:10__NB2Ch/28/3\');">2Ch 28:3__NB2Ch/33/6\');">2Ch 33:6__NBPsa/106/38\');">Psa 106:38__NBIsa/57/5\');">Isa 57:5__NRIsa/57/6\');">6__NBJer/7/31\');">Jer 7:31__NBJer/32/35\');">Jer 32:35__NBEze/16/20\');">Eze 16:20__NREze/16/21\');">21__NBEze/20/26\');">Eze 20:26__NREze/20/31\');">31__NBEze/23/37\');">Eze 23:37__NREze/23/39\');">39__NBAct/7/43\');">Act 7:43__AN__GGMolech_3__PSMolech__EEMoloch. The Rabbins describe this idol as made of brass sitting upon a throne of the same metal, in the form of a man, with the head of a calf, adorned with a royal crown, and his arms extended as if to embrace any one. When they offered any children to him, they heated the statue by a great fire kindled within, and the victim was put into his arms, and thus consumed. Others relate, that the idol, which was hollow, was divided into seven compartments within; in one of which they put flour, in the second turtles, in the third a ewe, in the fourth a ram, in the fifth a calf, in the sixth an ox, and the seventh a child; which were all burnt together by heating the statue inside. The account which Diodorus (l. xx.) gives of the statue of Saturn, to which the Carthaginians, descendants of the Canaanites, sacrificed their children, is very similar. For they had a brazen stature of Saturn, stretching out his hands towards the ground, in such a manner that the children placed within them tumbled down into a pit full __GHthe_people_4__PSthe people__EFLev/20/27\');">Lev 20:27__NBLev/24/14\');">Lev 24:14__NRLev/24/23\');">23__NBNum/15/35\');">Num 15:35__NRNum/15/36\');">36__NBDeu/13/10\');">Deu 13:10__NRDeu/13/11\');">11__NBDeu/17/5\');">Deu 17:5-7__NBDeu/21/21\');">Deu 21:21__NBAct/7/58\');">Act 7:58__NRAct/7/59\');">59__EN';
stringArray[3] = 'And __PNI_will_set_1__SHI will set</a> my face against that man, and will cut him off from among his people; because he hath given of his seed unto Molech, __PNto_defile_2__SHto defile</a> my sanctuary, and to __PNprofane_3__SHprofane</a> my holy name.__CPI_will_set_1__PSI will set__FFLev/17/10\');">Lev 17:10__NB1Pe/3/12\');">1Pe 3:12__AN__GHto_defile_2__PSto defile__EFNum/19/20\');">Num 19:20__NBEze/5/11\');">Eze 5:11__NBEze/23/38\');">Eze 23:38__NREze/23/39\');">39__AN__GGprofane_3__PSprofane__FFLev/18/21\');">Lev 18:21__NBEze/20/39\');">Eze 20:39__NB2Cr/6/16\');">2Cr 6:16__EN';
stringArray[4] = 'And if the people of the land do any ways __PNhide_1__SHhide</a> their eyes from the man, when he giveth of his seed unto Molech, __PNand_kill_2__SHand kill</a> him not:__CPhide_1__PShide__FFAct/17/30\');">Act 17:30__AN__GHand_kill_2__PSand kill__EFDeu/13/8\');">Deu 13:8__NBDeu/17/2\');">Deu 17:2-5__NBJos/7/12\');">Jos 7:12__NB1Sa/3/13\');">1Sa 3:13__NR1Sa/3/14\');">14__NB1Ki/20/42\');">1Ki 20:42__NBRev/2/14\');">Rev 2:14__EN';
stringArray[5] = 'Then __PNI_will_1__SHI will</a> set my face against that man, and __PNagainst_his_2__SHagainst his</a> family, and will cut him off, and all that go a __PNwhoring_3__SHwhoring</a> after him, to commit whoredom with Molech, from among their people.__CPI_will_1__PSI will__FFLev/17/10\');">Lev 17:10__AN__GHagainst_his_2__PSagainst his__EFExd/20/5\');">Exd 20:5__NBJer/32/28\');">Jer 32:28-35__NRJer/32/39\');">39__AN__GGwhoring_3__PSwhoring__FFLev/17/7\');">Lev 17:7__NBPsa/106/39\');">Psa 106:39__NBJer/3/2\');">Jer 3:2__NBHsa/2/5\');">Hsa 2:5__NRHsa/2/13\');">13__EN';
stringArray[6] = 'And the soul that turneth after such as have __PNfamiliar_1__SHfamiliar</a> spirits, and after wizards, to __PNgo_2__SHgo</a> a whoring after them, I will even set my face against that soul, and will __PNcut_him_3__SHcut him</a> off from among his people.__CPfamiliar_1__PSfamiliar__FFLev/20/27\');">Lev 20:27__NBLev/19/26\');">Lev 19:26__NRLev/19/31\');">31__NBDeu/18/10\');">Deu 18:10-14__NBIsa/8/19\');">Isa 8:19__AN__GHgo_2__PSgo__EFExd/34/15\');">Exd 34:15__NRExd/34/16\');">16__NBNum/15/39\');">Num 15:39__NBPsa/73/27\');">Psa 73:27__NBEze/6/9\');">Eze 6:9__NBHsa/4/12\');">Hsa 4:12__AN__GGcut_him_3__PScut him__FF1Ch/10/13\');">1Ch 10:13__NR1Ch/10/14\');">14__AN; In the days of Moses, superstition was almost the {sensus communis} of the human race, which then made severe punishment necessary: by means of the Christian dispensation such errors are now exploded, the cultivation of philosophy and natural history having harmonised and contributed their feebler share of light, so that we no longer have to deplore mischiefs occasioned by the silly curiosity attempting to unfold future events.</TD></TR>';
stringArray[7] = 'Sanctify yourselves therefore, and be ye holy: for I [am] the LORD your God.__CPRelated_Verses1_1__PSEntire Verse.__FFLev/11/44\');">Lev 11:44__NBLev/19/2\');">Lev 19:2__NBEph/1/4\');">Eph 1:4__NBPhl/2/12\');">Phi 2:12__NRPhl/2/13\');">13__NBCol/3/12\');">Col 3:12__NB1Th/4/3\');">1Th 4:3__NR1Th/4/7\');">7__NBHbr/12/14\');">Hbr 12:14__NB1Pe/1/15\');">1Pe 1:15__NR1Pe/1/16\');">16__EN';
stringArray[8] = '__PNAnd_ye_1__SHAnd ye</a> shall keep my statutes, and do them: I [am] the LORD which __PNsanctify_2__SHsanctify</a> you.__CPAnd_ye_1__PSAnd ye__FFLev/18/4\');">Lev 18:4__NRLev/18/5\');">5__NBLev/19/37\');">Lev 19:37__NBMat/5/19\');">Mat 5:19__NBMat/7/24\');">Mat 7:24__NBMat/12/50\');">Mat 12:50__NBJhn/13/17\');">Jhn 13:17__NBJam/1/22\');">Jam 1:22__NBRev/22/14\');">Rev 22:14__AN__GHsanctify_2__PSsanctify__EFLev/21/8\');">Lev 21:8__NBExd/31/13\');">Exd 31:13__NBEze/20/12\');">Eze 20:12__NBEze/37/28\');">Eze 37:28__NB1Cr/1/30\');">1Cr 1:30__NB1Th/5/23\');">1Th 5:23__NB2Th/2/13\');">2Th 2:13__EN';
stringArray[9] = 'For every one that __PNcurseth_1__SHcurseth</a> his father or his mother shall be surely put to death: he hath cursed his father or his mother; __PNhis_blood_2__SHhis blood</a> [shall be] upon him.__CPcurseth_1__PScurseth__EEThe term yekallel signifies not only to curse, but to speak contemptuously, disrespectfully, or to make light of a person: so that all speeches which have a tendency to lessen our parents in the eyes of others, or to render their judgment, piety, etc., suspected or contemptible, is here included; though the act of cursing, or of treating the parent with injurious or opprobrious language, is what is particularly intended. He who conscientiously keeps the fifth commandment, can be in no danger of the judgment here denounced. __NAExd/21/17\');">Exd 21:17__NBDeu/27/16\');">Deu 27:16__NBPro/20/20\');">Pro 20:20__NBPro/30/11\');">Pro 30:11__NRPro/30/17\');">17__NBMat/15/4\');">Mat 15:4__NBMar/7/10\');">Mar 7:10__AN__GHhis_blood_2__PShis blood__EFLev/20/11\');">Lev 20:11-13__NRLev/20/16\');">16__NRLev/20/27\');">27__NBJos/2/19\');">Jos 2:19__NBJdg/9/24\');">Jdg 9:24__NB2Sa/1/16\');">2Sa 1:16__NB1Ki/2/32\');">1Ki 2:32__NBMat/27/25\');">Mat 27:25__EN';
stringArray[10] = 'And the man that committeth adultery with [another] man\'s wife, [even he] that committeth adultery with his neighbour\'s wife, __PNthe_adulterer_1__SHthe adulterer</a> and the adulteress shall surely be put to death.__CPthe_adulterer_1__PSthe adulterer__FFDeu/22/22\');">Deu 22:22-24__NB2Sa/12/13\');">2Sa 12:13__NBEze/23/45\');">Eze 23:45-47__NBJhn/8/4\');">Jhn 8:4__NRJhn/8/5\');">5__EN';
stringArray[11] = 'And the man that lieth with his father\'s wife hath uncovered his father\'s nakedness: both of them shall surely be put to death; __PNtheir_2__SHtheir</a> blood [shall be] upon them.__CPRelated_Verses1_1__PSEntire Verse.__FFLev/18/8\');">Lev 18:8__NBDeu/27/20\');">Deu 27:20__NRDeu/27/23\');">23__NBAmo/2/7\');">Amo 2:7__NB1Cr/5/1\');">1Cr 5:1__AN__GHtheir_2__PStheir__FESee on __NALev/20/9\');">Lev 20:9__EN';
stringArray[12] = 'And if a man __PNlie_1__SHlie</a> with his daughter in law, both of them shall surely be put to death: they have wrought __PNconfusion_2__SHconfusion</a>; their blood [shall be] upon them.__CPlie_1__PSlie__FFLev/18/15\');">Lev 18:15__NBGen/38/16\');">Gen 38:16__NRGen/38/18\');">18__NBDeu/27/23\');">Deu 27:23__AN__GHconfusion_2__PSconfusion__EFLev/18/23\');">Lev 18:23__EN';
stringArray[13] = 'If a man also lie with mankind, as he lieth with a woman, both of them have committed an abomination: they shall surely be put to death; their blood [shall be] upon them.__CPRelated_Verses1_1__PSEntire Verse.__FFLev/18/22\');">Lev 18:22__NBGen/19/5\');">Gen 19:5__NBDeu/23/17\');">Deu 23:17__NBJdg/19/22\');">Jdg 19:22__NBRom/1/26\');">Rom 1:26__NRRom/1/27\');">27__NB1Cr/6/9\');">1Cr 6:9__NB1Ti/1/10\');">1Ti 1:10__NBJud/1/7\');">Jud 1:7__EN';
stringArray[14] = 'And if a man take __PNa_wife_1__SHa wife</a> and her mother, it [is] wickedness: they shall be __PNburnt_2__SHburnt</a> with fire, both he and they; that there be no wickedness among you.__CPa_wife_1__PSa wife__FFLev/18/17\');">Lev 18:17__NBDeu/27/23\');">Deu 27:23__NBAmo/2/7\');">Amo 2:7__AN__GHburnt_2__PSburnt__EFLev/21/9\');">Lev 21:9__NBJos/7/15\');">Jos 7:15__NRJos/7/25\');">25__EN';
stringArray[15] = 'And if a man lie with a beast, he shall surely be put to death: and ye shall slay the beast.__CPRelated_Verses1_1__PSEntire Verse.__FFLev/18/23\');">Lev 18:23__NBExd/22/19\');">Exd 22:19__NBDeu/27/21\');">Deu 27:21__EN';
stringArray[16] = '__PNAnd_if_a_woman_1__SHAnd if a woman</a> approach unto any beast, and lie down thereto, thou shalt kill the woman, __PNand_the_beast_2__SHand the beast</a>: they shall surely be put to death; their blood [shall be] upon them.__CPAnd_if_a_woman_1__PSAnd if a woman__EEWe are assured by Herodotus (in Euterp.) that the abominations here referred to existed among the Egyptians, and even formed part of their superstitious religious system, and we have reason to believe that they were not uncommon among the Canaanites. (See __NALev/18/24\');">Lev 18:24__AN, __NALev/18/25\');">25__AN). Need we wonder then, that God should have made laws of this nature, and appointed the punishment of death for these crimes? This one observation will account for many of those strange prohibitions which we find in the Mosaic law.__GHand_the_beast_2__PSand the beast__EFExd/19/13\');">Exd 19:13__NBExd/21/28\');">Exd 21:28__NRExd/21/32\');">32__NBHbr/12/20\');">Hbr 12:20__EN';
stringArray[17] = 'And if a man shall take his sister, his father\'s daughter, or his mother\'s daughter, and see her nakedness, and she see his nakedness; it [is] a wicked thing; and they shall be cut off in the sight of their people: he hath uncovered his sister\'s nakedness; he shall bear his iniquity.__CPRelated_Verses1_1__PSEntire Verse.__FFLev/18/9\');">Lev 18:9__NBGen/20/12\');">Gen 20:12__NBDeu/27/22\');">Deu 27:22__NB2Sa/13/12\');">2Sa 13:12__NBEze/22/11\');">Eze 22:11__EN';
stringArray[18] = 'And if a man shall lie with a woman __PNhaving_1__SHhaving</a> her sickness, and shall uncover her nakedness; he hath __PNdiscovered_2__SHdiscovered</a> her fountain, and she hath uncovered the fountain of her blood: and both of them shall be cut off from among their people.__CPhaving_1__PShaving__FFLev/15/24\');">Lev 15:24__NBLev/18/19\');">Lev 18:19__NBEze/18/6\');">Eze 18:6__NBEze/22/10\');">Eze 22:10__AN__GHdiscovered_2__PSdiscovered__FEHeb. made naked.</TD></TR>';
stringArray[19] = 'And thou shalt not uncover the nakedness of thy __PNmother_s_1__SHmother\'s</a> sister, nor of thy father\'s sister: for he __PNuncovereth_2__SHuncovereth</a> his near kin: they shall bear their iniquity.__CPmother_s_1__PSmother\'s__FFLev/18/12\');">Lev 18:12__NRLev/18/13\');">13-30__NBExd/6/20\');">Exd 6:20__AN__GHuncovereth_2__PSuncovereth__EFLev/18/6\');">Lev 18:6__EN';
stringArray[20] = 'And if a man shall lie with his __PNuncle_s_wife_1__SHuncle\'s wife</a>, he hath uncovered his uncle\'s nakedness: they shall bear their sin; they shall die __PNchildless_2__SHchildless</a>.__CPuncle_s_wife_1__PSuncle\'s wife__FFLev/18/14\');">Lev 18:14__AN__GHchildless_2__PSchildless__EFJob/18/19\');">Job 18:19__NBPsa/109/13\');">Psa 109:13__NBJer/22/30\');">Jer 22:30__NBLuk/1/7\');">Luk 1:7__NRLuk/1/25\');">25__NBLuk/23/29\');">Luk 23:29__EN';
stringArray[21] = 'And if a man shall take __PNhis_brother_s_1__SHhis brother\'s</a> wife, it [is] __PNan_unclean_thing_2__SHan unclean thing</a>: he hath uncovered his brother\'s nakedness; they shall be childless.__CPhis_brother_s_1__PShis brother\'s__FFLev/18/16\');">Lev 18:16__NBMat/14/3\');">Mat 14:3__NRMat/14/4\');">4__AN__GHan_unclean_thing_2__PSan unclean thing__FEHeb. a separation.</TD></TR>';
stringArray[22] = 'Ye shall therefore keep all my __PNstatutes_1__SHstatutes</a>, and all my __PNjudgments_2__SHjudgments</a>, and do them: that the land, whither I bring you to dwell therein, __PNspue_you_3__SHspue you</a> not out.__CPstatutes_1__PSstatutes__FFLev/18/4\');">Lev 18:4__NRLev/18/5\');">5__NRLev/18/26\');">26__NBLev/19/37\');">Lev 19:37__NBPsa/19/8\');">Psa 19:8-11__NBPsa/105/45\');">Psa 105:45__NBPsa/119/80\');">Psa 119:80__NRPsa/119/145\');">145__NRPsa/119/171\');">171__NBEze/36/27\');">Eze 36:27__AN__GHjudgments_2__PSjudgments__EFExd/21/1\');">Exd 21:1__NBDeu/4/45\');">Deu 4:45__NBDeu/5/1\');">Deu 5:1__NBPsa/119/20\');">Psa 119:20__NRPsa/119/106\');">106__NRPsa/119/160\');">160__NRPsa/119/164\');">164__NRPsa/119/175\');">175__NBIsa/26/8\');">Isa 26:8__NRIsa/26/9\');">9__AN__GGspue_you_3__PSspue you__FFLev/18/25\');">Lev 18:25-28__NBLev/26/33\');">Lev 26:33__NBDeu/28/25\');">Deu 28:25__NRDeu/28/26\');">26__EN';
stringArray[23] = 'And ye shall not walk __PNin_the_manners_1__SHin the manners</a> of the nation, which I cast out before you: for they committed all these things, and __PNtherefore_2__SHtherefore</a> I abhorred them.__CPin_the_manners_1__PSin the manners__FFLev/18/3\');">Lev 18:3__NRLev/18/24\');">24__NRLev/18/30\');">30__NBDeu/12/30\');">Deu 12:30__NRDeu/12/31\');">31__NBJer/10/1\');">Jer 10:1__NRJer/10/2\');">2__AN__GHtherefore_2__PStherefore__EFLev/18/27\');">Lev 18:27__NBDeu/9/5\');">Deu 9:5__NBPsa/78/59\');">Psa 78:59__NBZec/11/8\');">Zec 11:8__EN';
stringArray[24] = '__PNBut_I_1__SHBut I</a> have said unto you, Ye shall inherit their land, and I will give it unto you to possess it, __PNa_land_2__SHa land</a> that floweth with milk and honey: I [am] the LORD your God, __PNwhich_3__SHwhich</a> have separated you from [other] people.__CPBut_I_1__PSBut I__EESee on __NAExd/3/8\');">Exd 3:8__NRExd/3/17\');">17__NBExd/6/8\');">Exd 6:8__AN__GHa_land_2__PSa land__FEMilk and honey were the chief dainties of the ancients as they are now among the Arabs, particularly the Bedouins. Hence not only the Hebrews, but also the Greeks and Romans, painted the highest pleasantness and fertility by an abundance of milk and honey. The image used in the text, and frequently by ancient authors on similar subjects, is a metaphor, derived from a breast, producing copious streams of milk.__GGwhich_3__PSwhich__FFLev/20/26\');">Lev 20:26__NBExd/19/5\');">Exd 19:5__NRExd/19/6\');">6__NBExd/33/16\');">Exd 33:16__NBNum/23/9\');">Num 23:9__NBDeu/7/6\');">Deu 7:6__NBDeu/14/2\');">Deu 14:2__NB1Ki/8/53\');">1Ki 8:53__NBJhn/15/19\');">Jhn 15:19__NB2Cr/6/17\');">2Cr 6:17__NB1Pe/2/9\');">1Pe 2:9__EN';
stringArray[25] = 'Ye shall therefore __PNput_difference_1__SHput difference</a> between clean beasts and unclean, and between unclean fowls and clean: and ye shall not make your souls __PNabominable_2__SHabominable</a> by beast, or by fowl, or by any manner of living thing that __PNcreepeth_3__SHcreepeth</a> on the ground, which I have separated from you as unclean.__CPput_difference_1__PSput difference__FFLev/11/1\');">Lev 11:1-47__NBDeu/14/3\');">Deu 14:3-21__NBAct/10/11\');">Act 10:11-15__NRAct/10/28\');">28__NBEph/5/7\');">Eph 5:7-11__AN__GHabominable_2__PSabominable__EFLev/11/43\');">Lev 11:43__AN__GGcreepeth_3__PScreepeth__EEor, moveth.</TD></TR>';
stringArray[26] = 'And ye shall be holy unto me: for I __PNthe_LORD_1__SHthe LORD</a> [am] holy, and have __PNsevered_2__SHsevered</a> you from [other] people, that ye should be mine.__CPthe_LORD_1__PSthe LORD__FFLev/20/7\');">Lev 20:7__NBLev/19/2\');">Lev 19:2__NBPsa/99/5\');">Psa 99:5__NRPsa/99/9\');">9__NBIsa/6/3\');">Isa 6:3__NBIsa/30/11\');">Isa 30:11__NB1Pe/1/15\');">1Pe 1:15__NR1Pe/1/16\');">16__NBRev/3/7\');">Rev 3:7__NBRev/4/8\');">Rev 4:8__AN__GHsevered_2__PSsevered__EFLev/20/24\');">Lev 20:24__NBDeu/7/6\');">Deu 7:6__NBDeu/14/2\');">Deu 14:2__NBDeu/26/18\');">Deu 26:18__NRDeu/26/19\');">19__NBTts/2/14\');">Tts 2:14__EN';
