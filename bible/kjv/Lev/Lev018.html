Text[1] = 'And the LORD spake unto Moses, saying,';
Text[2] = 'Speak unto the children of Israel, and say unto them, I am the LORD your God.';
Text[3] = 'After the doings of the land of Egypt, wherein ye dwelt, shall ye not do: and after the doings of the land of Canaan, whither I bring you, shall ye not do: neither shall ye walk in their ordinances.';
Text[4] = 'Ye shall do my judgments, and keep mine ordinances, to walk therein: I [am] the LORD your God.';
Text[5] = 'Ye shall therefore keep my statutes, and my judgments: which if a man do, he shall live in them: I [am] the LORD.';
Text[6] = 'None of you shall approach to any that is near of kin to him, to uncover [their] nakedness: I [am] the LORD.';
Text[7] = 'The nakedness of thy father, or the nakedness of thy mother, shalt thou not uncover: she [is] thy mother; thou shalt not uncover her nakedness.';
Text[8] = 'The nakedness of thy father\'s wife shalt thou not uncover: it [is] thy father\'s nakedness.';
Text[9] = 'The nakedness of thy sister, the daughter of thy father, or daughter of thy mother, [whether she be] born at home, or born abroad, [even] their nakedness thou shalt not uncover.';
Text[10] = 'The nakedness of thy son\'s daughter, or of thy daughter\'s daughter, [even] their nakedness thou shalt not uncover: for theirs [is] thine own nakedness.';
Text[11] = 'The nakedness of thy father\'s wife\'s daughter, begotten of thy father, she [is] thy sister, thou shalt not uncover her nakedness.';
Text[12] = 'Thou shalt not uncover the nakedness of thy father\'s sister: she [is] thy father\'s near kinswoman.';
Text[13] = 'Thou shalt not uncover the nakedness of thy mother\'s sister: for she [is] thy mother\'s near kinswoman.';
Text[14] = 'Thou shalt not uncover the nakedness of thy father\'s brother, thou shalt not approach to his wife: she [is] thine aunt.';
Text[15] = 'Thou shalt not uncover the nakedness of thy daughter in law: she [is] thy son\'s wife; thou shalt not uncover her nakedness.';
Text[16] = 'Thou shalt not uncover the nakedness of thy brother\'s wife: it [is] thy brother\'s nakedness.';
Text[17] = 'Thou shalt not uncover the nakedness of a woman and her daughter, neither shalt thou take her son\'s daughter, or her daughter\'s daughter, to uncover her nakedness; [for] they [are] her near kinswomen: it [is] wickedness.';
Text[18] = 'Neither shalt thou take a wife to her sister, to vex [her], to uncover her nakedness, beside the other in her life [time].';
Text[19] = 'Also thou shalt not approach unto a woman to uncover her nakedness, as long as she is put apart for her uncleanness.';
Text[20] = 'Moreover thou shalt not lie carnally with thy neighbour\'s wife, to defile thyself with her.';
Text[21] = 'And thou shalt not let any of thy seed pass through [the fire] to Molech, neither shalt thou profane the name of thy God: I [am] the LORD.';
Text[22] = 'Thou shalt not lie with mankind, as with womankind: it [is] abomination.';
Text[23] = 'Neither shalt thou lie with any beast to defile thyself therewith: neither shall any woman stand before a beast to lie down thereto: it [is] confusion.';
Text[24] = 'Defile not ye yourselves in any of these things: for in all these the nations are defiled which I cast out before you:';
Text[25] = 'And the land is defiled: therefore I do visit the iniquity thereof upon it, and the land itself vomiteth out her inhabitants.';
Text[26] = 'Ye shall therefore keep my statutes and my judgments, and shall not commit [any] of these abominations; [neither] any of your own nation, nor any stranger that sojourneth among you:';
Text[27] = '(For all these abominations have the men of the land done, which [were] before you, and the land is defiled;)';
Text[28] = 'That the land spue not you out also, when ye defile it, as it spued out the nations that [were] before you.';
Text[29] = 'For whosoever shall commit any of these abominations, even the souls that commit [them] shall be cut off from among their people.';
Text[30] = 'Therefore shall ye keep mine ordinance, that [ye] commit not [any one] of these abominable customs, which were committed before you, and that ye defile not yourselves therein: I [am] the LORD your God.';
