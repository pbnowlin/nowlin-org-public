stringArray[21] = 'Then __PNI_will_1__SHI will</a> command my blessing upon you in the sixth year, and it shall bring forth fruit for __PNthree_years_2__SHthree years</a>.__CPI_will_1__PSI will__EEAs it is here graciously promised, that the sixth year was to bring forth fruits for three years, not merely for two, it is evident that both the sabbatical year and the year of jubilee were distinctly provided for. They were not to sow from the sixth to the eighth year, omitting two seed times; nor reap from the sixth to the ninth, omitting two harvests. No legislator, unless conscious of being divinely commissioned, would have committed himself by enacting such a law as this; nor would any people have submitted to receive it, except in consequence of the fullest conviction that a divine authority had dictated it. It therefore stands as a proof that Moses acted by the express direction of the Almighty, and that the people were fully persuaded of the reality of his divine mission by the miracles he wrought. __NAGen/26/12\');">Gen 26:12__NBGen/41/47\');">Gen 41:47__NBExd/16/29\');">Exd 16:29__NBDeu/28/3\');">Deu 28:3__NRDeu/28/8\');">8__NBPsa/133/3\');">Psa 133:3__NBPro/10/22\');">Pro 10:22__NB2Cr/9/10\');">2Cr 9:10__AN__GHthree_years_2__PSthree years__EFLev/25/4\');">Lev 25:4__NRLev/25/8\');">8-11__EN';

stringArray[50] = 'And he shall __PNreckon_1__SHreckon</a> with him that bought him from the year that he was sold to him unto the year of jubile: and the __PNprice_of_his_sale_2__SHprice of his sale</a> shall be according unto the number of years, __PNaccording_to_the_time_3__SHaccording to the time</a> of an hired servant shall it be with him.__CPreckon_1__PSreckon__FFLev/25/27\');">Lev 25:27__AN__GHprice_of_his_sale_2__PSprice of his sale__FEThis was a very equitable law, both to the sojourner to whom the man was sold, and to the Israelite who had been sold. The Israelite might redeem himself, or one of his kindred might redeem him; but this must not be done to the prejudice of his master. They were therefore to reckon the years he must have served, from that time till the jubilee; and then taking the current wages of a servant, per year, at that time, multiply the remaining years by that sum, and the aggregate was to be given to his master for his redemption. The Jews hold that the kindred of such a person were bound, if in their power, to redeem him, lest he should be swallowed up among the heathen; and we find (__NANeh/5/8\');">Neh 5:8__AN) that this was done by the Jews on their return from the Babylonish captivity.__GGaccording_to_the_time_3__PSaccording to the time__FFLev/25/40\');">Lev 25:40__NRLev/25/53\');">53__NBDeu/15/18\');">Deu 15:18__NBJob/7/1\');">Job 7:1__NRJob/7/2\');">2__NBJob/14/6\');">Job 14:6__NBIsa/16/14\');">Isa 16:14__NBIsa/21/16\');">Isa 21:16__EN';
stringArray[51] = 'If [there be] yet many years [behind], according unto them he shall give again the price of his redemption out of the money that he was bought for.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[52] = 'And if there remain but few years unto the year of __PNjubile_1__SHjubile</a>, then he shall count with him, [and] according unto his years shall he give him again the price of his redemption.__CPjubile_1__PSjubile__EEThe jubilee was a wonderful institution, and of great service to the religion, freedom, and independence of the Hebrews. It was calculated to prevent the rich from oppressing the poor, and reducing them to perpetual slavery; and to hinder their obtaining possession of all the lands by purchase, mortgage, or usurpation. It was further intended, that debts should not be multiplied too much, lest the poor should be entirely ruined; that slaves should not always continue in servitude; that personal liberty, equality of property, and the regular order of families might, as much as possible, be preserved; and that the people might thus be strongly attached to their country, lands, and inheritances.</TD></TR>';
