stringArray[6] = 'And he shall bring his __PNtrespass_offering_1__SHtrespass offering</a> unto the LORD for his sin which he hath sinned, __PNa_female_2__SHa female</a> from the flock, a lamb or a kid of the goats, for a sin offering; and __PNthe_priest_3__SHthe priest</a> shall make an atonement for him concerning his sin.__CPtrespass_offering_1__PStrespass offering__EEIt is remarkable, that in this and the following verse, the sacrifice offered is indifferently called asham, a trespass offering, and chattath, a sin offering; yet the Marginal References show that these differ in several respects. Sin offerings were sometimes offered for the whole congregation; trespass offerings never, but only for particular persons. Bullocks were sometimes used for sin offerings, never for trespass offerings. The blood of the sin offerings was put on the horns of the altar, that of the trespass offerings was only sprinkled round the bottom of the altar. The sin offering seems to have been for the expiation of offences committed in matters of religion, from a mistake or inadvertency respecting the law; but the trespass offering was required for the casual deviations from the ritual law, when well known, or for crimes against moral precepts, implying injustice to man. __NALev/4/28\');">Lev 4:28__NRLev/4/32\');">32__NBLev/6/6\');">Lev 6:6__NBLev/7/1\');">Lev 7:1-7__NBLev/14/12\');">Lev 14:12__NRLev/14/13\');">13__NBLev/19/21\');">Lev 19:21__NRLev/19/22\');">22__NBNum/6/12\');">Num 6:12__NBEze/40/39\');">Eze 40:39__NBEze/42/13\');">Eze 42:13__AN__GHa_female_2__PSa female__EFLev/4/28\');">Lev 4:28__NRLev/4/32\');">32__AN__GGthe_priest_3__PSthe priest__FFLev/4/20\');">Lev 4:20__EN';
