stringArray[13] = 'Then the priest shall consider: and, behold, __PNif_the_leprosy_1__SH[if] the leprosy</a> have covered all his flesh, he shall pronounce [him] clean [that hath] the plague: it is all turned white: __PNhe_is_clean_2__SHhe [is] clean</a>.__CPif_the_leprosy_1__PSif the leprosy__EEIt may seem strange that the partial leper should be pronounced unclean, and the person totally covered with the disease clean. This was probably owing to a different species or stage of the disease; the partial being contagious, the total not. That there are two different species, or degrees, of the disease described here, is sufficiently evident: in one, the person was all covered with a white enamelled scurf; in the other, there was a quick raw flesh in the risings. On this account, the one was deemed unclean, or contagious, the other not; for contact with the quick raw flesh would be more likely to communicate the disease, than the touch of the hard dry scurf. The ichor proceeding from the former, when brought into contact with the flesh of another, would soon be taken into constitution by means of the absorbent vessels; but where the surface was perfectly dry; the absorbent vessels of another, coming in contact with the diseased man, could imbibe nothing, and there was consequently but little or no dange__GHhe_is_clean_2__PShe is clean__EFIsa/64/6\');">Isa 64:6__NBJhn/9/41\');">Jhn 9:41__EN';

stringArray[47] = '__PNThe_garment_1__SHThe garment</a> also that the plague of leprosy is in, [whether it be] a woollen garment, or a linen garment;__CPThe_garment_1__PSThe garment__EEThis leprosy in garments appears so strange to us, that it has induced some, with Bp. Patrick, to consider it as an extraordinary punishment inflicted by God upon the Israelites, as a sign of his high displeasure; while others consider the leprosy in clothes (and also houses) as having no relation to the leprosy in man. When Michaelis was considering the subject, he was told by a dealer in wool, that the wool of sheep which die of a disease, if it has not been shorn from the animal while living, is unfit to manufacture cloth, and liable to something like what Moses here describes, and which he imagines to be the plague of leprosy in garments. The whole account, however, as Dr. A. Clarke observes, seems to intimate that the garment was fretted by the contagion of the real leprosy; which it is probable was occasioned by a species of animacula, or vermin, burrowing in the skin, which we know to be the cause of the itch; these, by breeding in the garments, must necessarily multiply their kind, and fret the garmen</TD></TR>';
