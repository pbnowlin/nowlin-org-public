Text[1] = 'And the LORD spake unto Moses and to Aaron, saying,';
Text[2] = 'Speak unto the children of Israel, and say unto them, When any man hath a running issue out of his flesh, [because of] his issue he [is] unclean.';
Text[3] = 'And this shall be his uncleanness in his issue: whether his flesh run with his issue, or his flesh be stopped from his issue, it [is] his uncleanness.';

Text[8] = 'And if he that hath the issue spit upon him that is clean; then he shall wash his clothes, and bathe [himself] in water, and be unclean until the even.';
Text[9] = 'And what saddle soever he rideth upon that hath the issue shall be unclean.';
Text[10] = 'And whosoever toucheth any thing that was under him shall be unclean until the even: and he that beareth [any of] those things shall wash his clothes, and bathe [himself] in water, and be unclean until the even.';
Text[11] = 'And whomsoever he toucheth that hath the issue, and hath not rinsed his hands in water, he shall wash his clothes, and bathe [himself] in water, and be unclean until the even.';
Text[12] = 'And the vessel of earth, that he toucheth which hath the issue, shall be broken: and every vessel of wood shall be rinsed in water.';
Text[13] = 'And when he that hath an issue is cleansed of his issue; then he shall number to himself seven days for his cleansing, and wash his clothes, and bathe his flesh in running water, and shall be clean.';
Text[14] = 'And on the eighth day he shall take to him two turtledoves, or two young pigeons, and come before the LORD unto the door of the tabernacle of the congregation, and give them unto the priest:';
Text[15] = 'And the priest shall offer them, the one [for] a sin offering, and the other [for] a burnt offering; and the priest shall make an atonement for him before the LORD for his issue.';
Text[16] = 'And if any man\'s seed of copulation go out from him, then he shall wash all his flesh in water, and be unclean until the even.';
Text[17] = 'And every garment, and every skin, whereon is the seed of copulation, shall be washed with water, and be unclean until the even.';
Text[18] = 'The woman also with whom man shall lie [with] seed of copulation, they shall [both] bathe [themselves] in water, and be unclean until the even.';
Text[19] = 'And if a woman have an issue, [and] her issue in her flesh be blood, she shall be put apart seven days: and whosoever toucheth her shall be unclean until the even.';
Text[20] = 'And every thing that she lieth upon in her separation shall be unclean: every thing also that she sitteth upon shall be unclean.';
Text[21] = 'And whosoever toucheth her bed shall wash his clothes, and bathe [himself] in water, and be unclean until the even.';
Text[22] = 'And whosoever toucheth any thing that she sat upon shall wash his clothes, and bathe [himself] in water, and be unclean until the even.';
Text[23] = 'And if it [be] on [her] bed, or on any thing whereon she sitteth, when he toucheth it, he shall be unclean until the even.';
Text[24] = 'And if any man lie with her at all, and her flowers be upon him, he shall be unclean seven days; and all the bed whereon he lieth shall be unclean.';
Text[25] = 'And if a woman have an issue of her blood many days out of the time of her separation, or if it run beyond the time of her separation; all the days of the issue of her uncleanness shall be as the days of her separation: she [shall be] unclean.';

Text[27] = 'And whosoever toucheth those things shall be unclean, and shall wash his clothes, and bathe [himself] in water, and be unclean until the even.';
Text[28] = 'But if she be cleansed of her issue, then she shall number to herself seven days, and after that she shall be clean.';
Text[29] = 'And on the eighth day she shall take unto her two turtles, or two young pigeons, and bring them unto the priest, to the door of the tabernacle of the congregation.';
