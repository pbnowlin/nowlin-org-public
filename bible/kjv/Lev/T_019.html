stringArray[19] = 'Ye shall keep my statutes. Thou shalt not let __PNthy_cattle_gender_1__SHthy cattle gender</a> with a diverse kind: thou shalt not sow thy field with __PNmingled_2__SHmingled</a> seed: neither shall a garment mingled of linen and woollen come upon thee.__CPthy_cattle_gender_1__PSthy cattle gender__EEThese practices might have been considered as altering the original constitution of God in creation; and this is the view which the Jews, and also Josephus and Philo, take of the subject. There were, probably, also both moral and political reasons for these prohibitions. With respect to heterogenous mixtures among cattle, it was probably forbidden, to prevent excitements to the abominations condemned in the preceding chapter. As to seeds, in many cases, it would be highly improper to sow different kinds in the same plot of ground. If oats and wheat, for instance, were sown together, the latter would be injured, and the former ruined. This prohibition may therefore be regarded as a prudential agricultural maxim. As to different kinds of garments, the prohibition might be intended against pride and vanity in clothing. __NAGen/36/24\');">Gen 36:24__NB2Sa/13/29\');">2Sa 13:29__NB2Sa/18/9\');">2Sa 18:9__NB1Ki/1/33\');">1Ki 1:33__NBEzr/2/66\');">Ezr 2:66__AN__GHmingled_2__PSmingled__EFDeu/22/9\');">Deu 22:9-11__NBMat/9/16\');">Mat 9:16__NRMat/9/17\');">17__NBRom/11/6\');">Rom 11:6__NB2Cr/6/14\');">2Cr 6:14-17__NBGal/3/9\');">Gal 3:9-11__EN';
