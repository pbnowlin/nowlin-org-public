var stringArray = new Array();
stringArray[1] = 'And the LORD spake unto Moses, saying,__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[2] = 'Speak unto the children of Israel, and say unto them, __PNWhen_1__SHWhen</a> a man shall make __PNa_singular_vow_2__SHa singular vow</a>, the persons [shall be] for the LORD by thy estimation.__CPWhen_1__PSWhen__FFGen/28/20\');">Gen 28:20-22__NBNum/6/2\');">Num 6:2__NBNum/21/2\');">Num 21:2__NBDeu/23/21\');">Deu 23:21-23__NBJdg/11/30\');">Jdg 11:30__NRJdg/11/31\');">31__NRJdg/11/39\');">39__NB1Sa/1/11\');">1Sa 1:11__NR1Sa/1/28\');">28__AN__GHa_singular_vow_2__PSa singular vow__FEA vow is a religious promise made to God, for the most part with prayer, and paid with thanksgiving. Vows were either of abstinence (__NANum/6/\');">Num 6__NBNum/30/\');">30__AN;), or the devoting of something to the LORD, as sacrifices (__NALev/7/16\');">Lev 7:16__AN) or the value of persons, beasts, houses, or lands, concerning which the law is here given. A man might vow or devote himself, his children, his domestics, his cattle, his goods, etc.; and respecting the redemption of all these, rules are laid down in this chapter. But if, after consecrating these things, he refused to redeem them, they then became the LORD\'s property forever. The persons continued all their lives devoted to the sanctuary, the goods were sold for the profit of the temple, or the priests; and the animals, if clean, were offered in sacrifice; and if not proper for sacrifice, were sold, and the proceeds devoted to sacred uses. This is a general view of the different laws relative to vows, mentioned in this chapter. __NAEcc/5/4\');">Ecc 5:4__NREcc/5/5\');">5__EN';
stringArray[3] = '__PNAnd_thy_estimation_1__SHAnd thy estimation</a> shall be of the male from twenty years old even unto sixty years old, even thy estimation shall be __PNfifty_shekels_2__SHfifty shekels</a> of silver, __PNafter_the_3__SHafter the</a> shekel of the sanctuary.__CPAnd_thy_estimation_1__PSAnd thy estimation__FFLev/27/14\');">Lev 27:14__NBLev/5/15\');">Lev 5:15__NBLev/6/6\');">Lev 6:6__NBNum/18/16\');">Num 18:16__NB2Ki/12/4\');">2Ki 12:4__AN; *marg:__GHfifty_shekels_2__PSfifty shekels__FEi.e, At three shillings each, 7£. 10s. sterling.__GGafter_the_3__PSafter the__FFLev/27/25\');">Lev 27:25__NBExd/30/13\');">Exd 30:13__EN';
stringArray[4] = 'And if it [be] a female, then thy estimation shall be __PNthirty_shekels_1__SHthirty shekels</a>.__CPthirty_shekels_1__PSthirty shekels__EEi.e., 4£. 10s. sterling, A little more than one-half the value of a man; for this obvious reason, that a woman, if employed, would not be of so much use in the sanctuary as the man. __NAZec/11/12\');">Zec 11:12__NRZec/11/13\');">13__NBMat/26/15\');">Mat 26:15__NBMat/27/9\');">Mat 27:9__NRMat/27/10\');">10__EN';
stringArray[5] = 'And if [it be] from five years old even unto twenty years old, then thy estimation shall be of the male __PNtwenty_shekels_1__SHtwenty shekels</a>, and for the female ten shekels.__CPtwenty_shekels_1__PStwenty shekels__EEi.e., 3£. sterling. ten shekels. i.e., 1£. 10s. sterling</TD></TR>';
stringArray[6] = 'And if [it be] __PNfrom_1__SHfrom</a> a month old even unto five years old, then thy estimation shall be of __PNthe_male_2__SHthe male</a> five shekels of silver, and for the female thy estimation [shall be] three shekels of silver.__CPfrom_1__PSfrom__FFNum/3/40\');">Num 3:40-43__NBNum/18/14\');">Num 18:14-16__AN__GHthe_male_2__PSthe male__FEThe male five shekels, 15s., the female three shekels, 9s. Being both in infancy they were nearly of an equal value.</TD></TR>';
stringArray[7] = 'And if [it be] __PNfrom_1__SHfrom</a> sixty years old and above; if [it be] a male, then thy estimation shall be __PNfifteen_2__SHfifteen</a> shekels, and for the female ten shekels.__CPfrom_1__PSfrom__FFPsa/90/10\');">Psa 90:10__AN__GHfifteen_2__PSfifteen__FEThe old man and the old woman, being almost past labour, were nearly of an equal value; the former being estimated at 15 shekels, and the latter at 10.</TD></TR>';
stringArray[8] = 'But if he be __PNpoorer_1__SHpoorer</a> than thy estimation, then he shall present himself before the priest, and the priest shall value him; __PNaccording_2__SHaccording</a> to his ability that vowed shall the priest value him.__CPpoorer_1__PSpoorer__FFLev/5/7\');">Lev 5:7__NBLev/12/8\');">Lev 12:8__NBLev/14/21\');">Lev 14:21__NRLev/14/22\');">22__NBMar/14/7\');">Mar 14:7__NBLuk/21/1\');">Luk 21:1-4__NB2Cr/8/12\');">2Cr 8:12__AN__GHaccording_2__PSaccording__EFJer/5/7\');">Jer 5:7__EN';
stringArray[9] = 'And if [it be] a beast, whereof men bring an offering unto the LORD, all that [any man] giveth of such unto the LORD shall be holy.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[10] = 'He shall not alter it, nor change it, a good for a bad, or a bad for a good: and if he shall at all change beast for beast, then it and the exchange thereof shall be holy.__CPRelated_Verses1_1__PSEntire Verse.__FFLev/27/15\');">Lev 27:15-33__NBJam/1/8\');">Jam 1:8__EN';
stringArray[11] = 'And if [it be] any unclean beast, of which they do not offer a sacrifice unto the LORD, then he shall present the beast before the priest:__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/23/18\');">Deu 23:18__NBMal/1/14\');">Mal 1:14__EN';
stringArray[12] = 'And the priest shall value it, whether it be good or bad: __PNas_thou_valuest_it__who_art_the_priest_1__SHas thou valuest it, [who art] the priest</a>, so shall it be.__CPas_thou_valuest_it__who_art_the_priest_1__PSas thou valuest it, who art the priest__EEHeb. according to thy estimation, O priest, etc.</TD></TR>';
stringArray[13] = 'But if he will at all redeem it, then he shall add a fifth [part] thereof unto thy estimation.__CPRelated_Verses1_1__PSEntire Verse.__FFLev/27/10\');">Lev 27:10__NRLev/27/15\');">15__NRLev/27/19\');">19__NBLev/5/16\');">Lev 5:16__NBLev/6/4\');">Lev 6:4__NRLev/6/5\');">5__NBLev/22/14\');">Lev 22:14__EN';
stringArray[14] = 'And when a man shall __PNsanctify_1__SHsanctify</a> his house [to be] holy unto the LORD, then the priest shall estimate it, whether it be good or bad: __PNas_the_priest_2__SHas the priest</a> shall estimate it, so shall it stand.__CPsanctify_1__PSsanctify__FFLev/27/21\');">Lev 27:21__NBLev/25/29\');">Lev 25:29-31__NBNum/18/14\');">Num 18:14__NBPsa/101/2\');">Psa 101:2-7__AN__GHas_the_priest_2__PSas the priest__EFLev/27/12\');">Lev 27:12__EN';
stringArray[15] = 'And if he that sanctified it will redeem his house, __PNthen_he_shall_add_1__SHthen he shall add</a> the fifth [part] of the money of thy estimation unto it, and it shall be his.__CPthen_he_shall_add_1__PSthen he shall add__EESee on __NALev/27/13\');">Lev 27:13__EN';
stringArray[16] = 'And if a man shall sanctify unto the LORD [__PNsome_part_1__SHsome part</a>] __PNof_a_field_2__SHof a field</a> of his possession, then thy estimation shall be according to the seed thereof: __PNan_homer_3__SHan homer</a> of barley seed [shall be valued] at fifty shekels of silver.__CPsome_part_1__PSsome part__EE"Though the words ""some part"" are not expressed, yet it is generally allowed that they should be supplied here; as it was not lawful for a man to alienate in this manner his whole patrimony: he might express his good will for the house of God but he must not impoverish his own family."__GHof_a_field_2__PSof a field__EFAct/4/34\');">Act 4:34-37__NBAct/5/4\');">Act 5:4__AN__GGan_homer_3__PSan homer__EEor, the land of an homer, etc., i.e, as much land as required a homer of barley to sow it. The homer was very different from the omer; the latter held about three quarts, the former seventy-five gallons three pints. __NAIsa/5/10\');">Isa 5:10__NBEze/45/11\');">Eze 45:11-14__NBHsa/3/2\');">Hsa 3:2__EN';
stringArray[17] = 'If he sanctify his field from the year of jubile, according to thy estimation it shall stand.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[18] = 'But if he sanctify his field after the jubile, then the priest shall reckon unto him the money according to the years that remain, even unto the year of the jubile, and it shall be abated from thy estimation.__CPRelated_Verses1_1__PSEntire Verse.__FFLev/25/15\');">Lev 25:15__NRLev/25/16\');">16__NRLev/25/27\');">27__NRLev/25/51\');">51__NRLev/25/52\');">52__EN';
stringArray[19] = 'And if he that sanctified the field will in any wise redeem it, then he shall add the fifth [part] of the money of thy estimation unto it, and it shall be assured to him.__CPRelated_Verses1_1__PSEntire Verse.__EESee on __NALev/27/13\');">Lev 27:13__EN';
stringArray[20] = 'And if he will not redeem the field, or if he have sold the field to another man, it shall not be redeemed any more.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[21] = 'But the field, __PNwhen_1__SHwhen</a> it goeth out in the jubile, shall be holy unto the LORD, as a field __PNdevoted_2__SHdevoted</a>; the possession thereof shall be the __PNpriest_s_3__SHpriest\'s</a>.__CPwhen_1__PSwhen__FFLev/25/10\');">Lev 25:10__NRLev/25/28\');">28__NRLev/25/31\');">31__AN__GHdevoted_2__PSdevoted__FEIt is cherem, a thing so devoted to God, as never more to be capable of being redeemed. __NALev/27/28\');">Lev 27:28__NRLev/27/29\');">29__NBDeu/13/17\');">Deu 13:17__NBJos/6/17\');">Jos 6:17__NBEzr/10/8\');">Ezr 10:8__NBEze/44/29\');">Eze 44:29__AN; *marg:__GGpriest_s_3__PSpriest\'s__FFNum/18/14\');">Num 18:14__NBEze/44/29\');">Eze 44:29__EN';
stringArray[22] = 'And if [a man] sanctify unto the LORD a field which he hath bought, which [is] not of the fields of __PNhis_possession_1__SHhis possession</a>;__CPhis_possession_1__PShis possession__FFLev/25/10\');">Lev 25:10__NRLev/25/25\');">25__EN';
stringArray[23] = 'Then the priest shall reckon unto him the worth of thy estimation, [even] unto the year of the jubile: and he shall give thine estimation in that day, [as] a holy thing unto the LORD.__CPRelated_Verses1_1__PSEntire Verse.__FFLev/27/12\');">Lev 27:12__NRLev/27/18\');">18__EN';
stringArray[24] = 'In the year of the jubile the field shall return unto him of whom it was bought, [even] to him to whom the possession of the land [did belong].__CPRelated_Verses1_1__PSEntire Verse.__FFLev/27/20\');">Lev 27:20__NBLev/25/28\');">Lev 25:28__EN';
stringArray[25] = '__PNAnd_all_1__SHAnd all</a> thy estimations shall be according __PNto_the_shekel_2__SHto the shekel</a> of the sanctuary: __PNtwenty_3__SHtwenty</a> gerahs shall be the shekel.__CPAnd_all_1__PSAnd all__FFLev/27/3\');">Lev 27:3__AN__GHto_the_shekel_2__PSto the shekel__FEA standard shekel; the standard being kept in the sanctuary, to try and regulate all the weights in the land by.__GGtwenty_3__PStwenty__FFExd/30/13\');">Exd 30:13__NBNum/3/47\');">Num 3:47__NBNum/18/16\');">Num 18:16__NBEze/45/12\');">Eze 45:12__EN';
stringArray[26] = 'Only __PNthe_firstling_1__SHthe firstling</a> of the beasts, __PNwhich_2__SHwhich</a> should be the LORD\'S firstling, no man shall sanctify it; whether [it be] ox, or sheep: it [is] the LORD\'S.__CPthe_firstling_1__PSthe firstling__EEHeb. first born, etc. As these firstlings were the LORD\'s before, it would have been a solemn mockery to pretend to make them a matter of a singular vow; for they were already appointed, if clean, to be sacrificed.__GHwhich_2__PSwhich__EFExd/13/2\');">Exd 13:2__NRExd/13/12\');">12__NRExd/13/13\');">13__NBExd/22/30\');">Exd 22:30__NBNum/18/17\');">Num 18:17__NBDeu/15/19\');">Deu 15:19__EN';
stringArray[27] = 'And if [it be] of an unclean beast, then he shall redeem [it] according to thine estimation, __PNand_shall_add_1__SHand shall add</a> a fifth [part] of it thereto: or if it be not redeemed, then it shall be sold according to thy estimation.__CPand_shall_add_1__PSand shall add__EEThis was probably intended to prevent rash vows and covetous redemptions. The priest alone was to value the thing; and to whatever his valuation was, a fifth part must be added by him who wished to redeem it. __NALev/27/11\');">Lev 27:11-13__EN';

stringArray[29] = '__PNNone_1__SHNone</a> devoted, __PNwhich_shall_be_devoted_2__SHwhich shall be devoted</a> of men, shall be redeemed; [but] shall surely be put to death.__CPNone_1__PSNone__FFNum/21/2\');">Num 21:2__NRNum/21/3\');">3__NB1Sa/15/18\');">1Sa 15:18-23__AN__GHwhich_shall_be_devoted_2__PSwhich shall be devoted__FEThat is, either that every person devoted to the service of God shall not be redeemed, but die in that devoted state, or, that such as were devoted to death by appointment and law of God, as the Canaanites were, shall be put to death.</TD></TR>';
stringArray[30] = 'And all the tithe of the land, [whether] of the seed of the land, [or] of the fruit of the tree, [is] the LORD\'S: [it is] holy unto the LORD.__CPRelated_Verses1_1__PSEntire Verse.__FFGen/14/20\');">Gen 14:20__NBGen/28/22\');">Gen 28:22__NBNum/18/21\');">Num 18:21-24__NBDeu/12/5\');">Deu 12:5__NRDeu/12/6\');">6__NBDeu/14/22\');">Deu 14:22__NRDeu/14/23\');">23__NB2Ch/31/5\');">2Ch 31:5__NR2Ch/31/6\');">6__NR2Ch/31/12\');">12__NBNeh/10/37\');">Neh 10:37__NRNeh/10/38\');">38__NBNeh/12/44\');">Neh 12:44__NBNeh/13/5\');">Neh 13:5__NRNeh/13/12\');">12__NBMal/3/8\');">Mal 3:8-10__NBMat/23/23\');">Mat 23:23__NBLuk/11/42\');">Luk 11:42__NBLuk/18/12\');">Luk 18:12__NBHbr/7/5\');">Hbr 7:5-9__EN';
stringArray[31] = 'And if a man will at all redeem [ought] of his tithes, he shall add thereto the fifth [part] thereof.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[32] = 'And concerning the tithe of the herd, or of the flock, [even] of whatsoever __PNpasseth_under_the_rod_1__SHpasseth under the rod</a>, the tenth shall be holy unto the LORD.__CPpasseth_under_the_rod_1__PSpasseth under the rod__EEThe Rabbins say, that when a man gave the tithe of his sheep or calves, he shut them in one fold, in which was a narrow door, to let out but one at a time. He then stood by the door, with a rod dipped in vermilion in his hand, and as they passed he counted them with the rod; and when the tenth came he touched it, by which it was distinguished as the tithe calf, sheep, etc. __NAJer/33/13\');">Jer 33:13__NBEze/20/37\');">Eze 20:37__NBMic/7/14\');">Mic 7:14__EN';
