stringArray[15] = '__PNThen_I_1__SHThen I</a> commended mirth, because a man hath no better thing under the sun, than to eat, and to drink, and to be merry: for that shall abide with him of his labour the days of his life, which God giveth him under the sun.__CPThen_I_1__PSThen I__EE"Some consider this as the cavil of an infidel objector, equivalent to the Epicurean maxim, Ede, bibe, lude; post mortem nulla voluptas, ""Eat, drink, and play; there is no pleasure after death."" But it may be regarded as a recommendation of a moderate use of worldly things, with a cheerful and contented mind; which may justly be considered as the greatest advantage which can be made of all below the sun: and amidst all changes, such a frame of mind, if the result of right principles, may and ought to be preserved; and it will be the recompence and solace of all our labours and toils. __NAEcc/2/24\');">Ecc 2:24__NBEcc/3/12\');">Ecc 3:12__NREcc/3/13\');">13__NREcc/3/22\');">22__NBEcc/5/18\');">Ecc 5:18__NBEcc/9/7\');">Ecc 9:7-9__NB1Ti/4/3\');">1Ti 4:3__NR1Ti/4/4\');">4__NB1Ti/6/17\');">1Ti 6:17__AN"</TD></TR>';
