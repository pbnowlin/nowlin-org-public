Text[9] = 'And when I was present with you, and wanted, I was chargeable to no man: for that which was lacking to me the brethren which came from Macedonia supplied: and in all [things] I have kept myself from being burdensome unto you, and [so] will I keep [myself].';

Text[11] = 'Wherefore? because I love you not? God knoweth.';
Text[12] = 'But what I do, that I will do, that I may cut off occasion from them which desire occasion; that wherein they glory, they may be found even as we.';
Text[13] = 'For such [are] false apostles, deceitful workers, transforming themselves into the apostles of Christ.';
Text[14] = 'And no marvel; for Satan himself is transformed into an angel of light.';
Text[15] = 'Therefore [it is] no great thing if his ministers also be transformed as the ministers of righteousness; whose end shall be according to their works.';

Text[17] = 'That which I speak, I speak [it] not after the Lord, but as it were foolishly, in this confidence of boasting.';
Text[18] = 'Seeing that many glory after the flesh, I will glory also.';
Text[19] = 'For ye suffer fools gladly, seeing ye [yourselves] are wise.';

Text[23] = 'Are they ministers of Christ? (I speak as a fool) I [am] more; in labours more abundant, in stripes above measure, in prisons more frequent, in deaths oft.';
Text[24] = 'Of the Jews five times received I forty [stripes] save one.';
