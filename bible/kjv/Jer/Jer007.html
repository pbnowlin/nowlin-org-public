Text[1] = 'The word that came to Jeremiah from the LORD, saying,';
Text[2] = 'Stand in the gate of the LORD\'S house, and proclaim there this word, and say, Hear the word of the LORD, all [ye of] Judah, that enter in at these gates to worship the LORD.';
Text[3] = 'Thus saith the LORD of hosts, the God of Israel, Amend your ways and your doings, and I will cause you to dwell in this place.';
Text[4] = 'Trust ye not in lying words, saying, The temple of the LORD, The temple of the LORD, The temple of the LORD, [are] these.';
Text[5] = 'For if ye throughly amend your ways and your doings; if ye throughly execute judgment between a man and his neighbour;';
Text[6] = '[If] ye oppress not the stranger, the fatherless, and the widow, and shed not innocent blood in this place, neither walk after other gods to your hurt:';
Text[7] = 'Then will I cause you to dwell in this place, in the land that I gave to your fathers, for ever and ever.';
Text[8] = 'Behold, ye trust in lying words, that cannot profit.';
Text[9] = 'Will ye steal, murder, and commit adultery, and swear falsely, and burn incense unto Baal, and walk after other gods whom ye know not;';
Text[10] = 'And come and stand before me in this house, which is called by my name, and say, We are delivered to do all these abominations?';
Text[11] = 'Is this house, which is called by my name, become a den of robbers in your eyes? Behold, even I have seen [it], saith the LORD.';
Text[12] = 'But go ye now unto my place which [was] in Shiloh, where I set my name at the first, and see what I did to it for the wickedness of my people Israel.';
Text[13] = 'And now, because ye have done all these works, saith the LORD, and I spake unto you, rising up early and speaking, but ye heard not; and I called you, but ye answered not;';
Text[14] = 'Therefore will I do unto [this] house, which is called by my name, wherein ye trust, and unto the place which I gave to you and to your fathers, as I have done to Shiloh.';
Text[15] = 'And I will cast you out of my sight, as I have cast out all your brethren, [even] the whole seed of Ephraim.';
Text[16] = 'Therefore pray not thou for this people, neither lift up cry nor prayer for them, neither make intercession to me: for I will not hear thee.';
Text[17] = 'Seest thou not what they do in the cities of Judah and in the streets of Jerusalem?';
Text[18] = 'The children gather wood, and the fathers kindle the fire, and the women knead [their] dough, to make cakes to the queen of heaven, and to pour out drink offerings unto other gods, that they may provoke me to anger.';
Text[19] = 'Do they provoke me to anger? saith the LORD: [do they] not [provoke] themselves to the confusion of their own faces?';
Text[20] = 'Therefore thus saith the Lord GOD; Behold, mine anger and my fury shall be poured out upon this place, upon man, and upon beast, and upon the trees of the field, and upon the fruit of the ground; and it shall burn, and shall not be quenched.';
Text[21] = 'Thus saith the LORD of hosts, the God of Israel; Put your burnt offerings unto your sacrifices, and eat flesh.';
Text[22] = 'For I spake not unto your fathers, nor commanded them in the day that I brought them out of the land of Egypt, concerning burnt offerings or sacrifices:';
Text[23] = 'But this thing commanded I them, saying, Obey my voice, and I will be your God, and ye shall be my people: and walk ye in all the ways that I have commanded you, that it may be well unto you.';
Text[24] = 'But they hearkened not, nor inclined their ear, but walked in the counsels [and] in the imagination of their evil heart, and went backward, and not forward.';
Text[25] = 'Since the day that your fathers came forth out of the land of Egypt unto this day I have even sent unto you all my servants the prophets, daily rising up early and sending [them]:';
Text[26] = 'Yet they hearkened not unto me, nor inclined their ear, but hardened their neck: they did worse than their fathers.';
Text[27] = 'Therefore thou shalt speak all these words unto them; but they will not hearken to thee: thou shalt also call unto them; but they will not answer thee.';
Text[28] = 'But thou shalt say unto them, This [is] a nation that obeyeth not the voice of the LORD their God, nor receiveth correction: truth is perished, and is cut off from their mouth.';
Text[29] = 'Cut off thine hair, [O Jerusalem], and cast [it] away, and take up a lamentation on high places; for the LORD hath rejected and forsaken the generation of his wrath.';
Text[30] = 'For the children of Judah have done evil in my sight, saith the LORD: they have set their abominations in the house which is called by my name, to pollute it.';
Text[31] = 'And they have built the high places of Tophet, which [is] in the valley of the son of Hinnom, to burn their sons and their daughters in the fire; which I commanded [them] not, neither came it into my heart.';
Text[32] = 'Therefore, behold, the days come, saith the LORD, that it shall no more be called Tophet, nor the valley of the son of Hinnom, but the valley of slaughter: for they shall bury in Tophet, till there be no place.';
Text[33] = 'And the carcases of this people shall be meat for the fowls of the heaven, and for the beasts of the earth; and none shall fray [them] away.';
Text[34] = 'Then will I cause to cease from the cities of Judah, and from the streets of Jerusalem, the voice of mirth, and the voice of gladness, the voice of the bridegroom, and the voice of the bride: for the land shall be desolate.';
