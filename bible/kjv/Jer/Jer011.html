Text[1] = 'The word that came to Jeremiah from the LORD, saying,';
Text[2] = 'Hear ye the words of this covenant, and speak unto the men of Judah, and to the inhabitants of Jerusalem;';
Text[3] = 'And say thou unto them, Thus saith the LORD God of Israel; Cursed [be] the man that obeyeth not the words of this covenant,';
Text[4] = 'Which I commanded your fathers in the day [that] I brought them forth out of the land of Egypt, from the iron furnace, saying, Obey my voice, and do them, according to all which I command you: so shall ye be my people, and I will be your God:';
Text[5] = 'That I may perform the oath which I have sworn unto your fathers, to give them a land flowing with milk and honey, as [it is] this day. Then answered I, and said, So be it, O LORD.';
Text[6] = 'Then the LORD said unto me, Proclaim all these words in the cities of Judah, and in the streets of Jerusalem, saying, Hear ye the words of this covenant, and do them.';
Text[7] = 'For I earnestly protested unto your fathers in the day [that] I brought them up out of the land of Egypt, [even] unto this day, rising early and protesting, saying, Obey my voice.';
Text[8] = 'Yet they obeyed not, nor inclined their ear, but walked every one in the imagination of their evil heart: therefore I will bring upon them all the words of this covenant, which I commanded [them] to do; but they did [them] not.';
Text[9] = 'And the LORD said unto me, A conspiracy is found among the men of Judah, and among the inhabitants of Jerusalem.';
Text[10] = 'They are turned back to the iniquities of their forefathers, which refused to hear my words; and they went after other gods to serve them: the house of Israel and the house of Judah have broken my covenant which I made with their fathers.';
Text[11] = 'Therefore thus saith the LORD, Behold, I will bring evil upon them, which they shall not be able to escape; and though they shall cry unto me, I will not hearken unto them.';
Text[12] = 'Then shall the cities of Judah and inhabitants of Jerusalem go, and cry unto the gods unto whom they offer incense: but they shall not save them at all in the time of their trouble.';
Text[13] = 'For [according to] the number of thy cities were thy gods, O Judah; and [according to] the number of the streets of Jerusalem have ye set up altars to [that] shameful thing, [even] altars to burn incense unto Baal.';
Text[14] = 'Therefore pray not thou for this people, neither lift up a cry or prayer for them: for I will not hear [them] in the time that they cry unto me for their trouble.';
Text[15] = 'What hath my beloved to do in mine house, [seeing] she hath wrought lewdness with many, and the holy flesh is passed from thee? when thou doest evil, then thou rejoicest.';
Text[16] = 'The LORD called thy name, A green olive tree, fair, [and] of goodly fruit: with the noise of a great tumult he hath kindled fire upon it, and the branches of it are broken.';
Text[17] = 'For the LORD of hosts, that planted thee, hath pronounced evil against thee, for the evil of the house of Israel and of the house of Judah, which they have done against themselves to provoke me to anger in offering incense unto Baal.';
Text[18] = 'And the LORD hath given me knowledge [of it], and I know [it]: then thou shewedst me their doings.';
Text[19] = 'But I [was] like a lamb [or] an ox [that] is brought to the slaughter; and I knew not that they had devised devices against me, [saying], Let us destroy the tree with the fruit thereof, and let us cut him off from the land of the living, that his name may be no more remembered.';
Text[20] = 'But, O LORD of hosts, that judgest righteously, that triest the reins and the heart, let me see thy vengeance on them: for unto thee have I revealed my cause.';
Text[21] = 'Therefore thus saith the LORD of the men of Anathoth, that seek thy life, saying, Prophesy not in the name of the LORD, that thou die not by our hand:';
Text[22] = 'Therefore thus saith the LORD of hosts, Behold, I will punish them: the young men shall die by the sword; their sons and their daughters shall die by famine:';
Text[23] = 'And there shall be no remnant of them: for I will bring evil upon the men of Anathoth, [even] the year of their visitation.';
