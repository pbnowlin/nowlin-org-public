stringArray[6] = 'But they said, We will drink no wine: for __PNJonadab_1__SHJonadab</a> the son of Rechab our father commanded us, saying, __PNYe_shall_2__SHYe shall</a> drink no wine, [neither ye], nor your sons for ever:__CPJonadab_1__PSJonadab__FF2Ki/10/15\');">2Ki 10:15__NB1Ch/2/55\');">1Ch 2:55__AN__GHYe_shall_2__PSYe shall__FE"Jonadab, a man of fervent zeal for the pure worship of God, and who lived about three hundred years before this time, (__NA2Ki/10/15\');">2Ki 10:15__AN, __NA2Ki/10/16\');">16__AN, etc.) had probably practised these rules himself; and having trained up his children to habits of abstemiousness, he enjoined them and their posterity to adhere to them. In these regulations he seems to have had no religious, but merely a prudential view, as is intimated in the reason annexed to them ""that ye may live many days in the land where ye be strangers."" And this would be the natural consequence of observing these rules; for their temperate mode of living would very much contribute to preserve health and prolong life; and they would avoid giving umbrage, or exciting the jealousy or envy of the Jews, who might have been provoked, by their engaging and succeeding in the principal business in which they themselves were engaged, agriculture and vine-dressing to expel them their country; by which they would have been deprived of the religious advantages they enjoyed. In 1Ch"</TD></TR>';
