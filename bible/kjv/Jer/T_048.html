stringArray[42] = 'And __PNMoab_1__SHMoab</a> shall be destroyed __PNfrom_2__SHfrom</a> [being] a people, because he hath __PNmagnified_3__SHmagnified</a> [himself] against the LORD.__CPMoab_1__PSMoab__EEMoab has long since ceased to be a nation; while the Jews, agreeably to the Divine promise, (__NAJer/46/28\');">Jer 46:28__AN,) though successively subdued and oppressed by the Egyptians, Assyrians, Babylonians, Syro-Macedonians, and Romans, (which have also all passed away, and are no more,) and dispersed over the face of the earth, subsist to this day as a distinct people from all the nations of the world!__GHfrom_2__PSfrom__EFJer/48/2\');">Jer 48:2__NBJer/30/11\');">Jer 30:11__NBEst/3/8\');">Est 3:8-13__NBPsa/83/4\');">Psa 83:4-8__NBIsa/7/8\');">Isa 7:8__NBMat/7/2\');">Mat 7:2__AN__GGmagnified_3__PSmagnified__FFJer/48/26\');">Jer 48:26-30__NBPro/16/18\');">Pro 16:18__NBIsa/37/23\');">Isa 37:23__NBDan/11/36\');">Dan 11:36__NB2Th/2/4\');">2Th 2:4__NBRev/13/6\');">Rev 13:6__EN';
