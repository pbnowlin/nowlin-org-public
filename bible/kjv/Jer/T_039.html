stringArray[1] = 'In __PNthe_ninth_2__SHthe ninth</a> year of Zedekiah king of Judah, in __PNthe_tenth_3__SHthe tenth</a> month, came Nebuchadrezzar king of Babylon and all his army against Jerusalem, and they besieged it.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3414. B.C. 590.__GHthe_ninth_2__PSthe ninth__EFJer/52/4\');">Jer 52:4-7__NB2Ki/25/1\');">2Ki 25:1__NR2Ki/25/2\');">2-7__NBEze/24/1\');">Eze 24:1__NREze/24/2\');">2__NBZec/8/19\');">Zec 8:19__AN__GGthe_tenth_3__PSthe tenth__EEThis was the month Tebeth, (__NAEst/2/16\');">Est 2:16__AN,) which began with the first moon of January; and it was on the 10th of this month that Nebuchadnezzar invested the city.</TD></TR>';

stringArray[3] = 'And __PNall_the_1__SHall the</a> princes of the king of Babylon came in, and sat in the middle gate, [even] __PNNergalsharezer_2__SHNergalsharezer</a>, Samgarnebo, __PNSarsechim_3__SHSarsechim</a>, Rabsaris, Nergalsharezer, Rabmag, with all the residue of the princes of the king of Babylon.__CPall_the_1__PSall the__FFJer/1/15\');">Jer 1:15__NBJer/21/4\');">Jer 21:4__NBJer/38/17\');">Jer 38:17__AN__GHNergalsharezer_2__PSNergalsharezer__EFJer/39/13\');">Jer 39:13__NB2Ki/17/30\');">2Ki 17:30__AN__GGSarsechim_3__PSSarsechim__EEThese were the principal commanders; but Dr. Blayney thinks that, instead of six persons, we have in reality but three, as the name that follows each is the title of the office. Thus Nergal-Sharezer, who was Samgar-nebo, or keeper, i.e., priest of Nebo; Sarsechim, who was Rab-saris, or chief eunuch; and Nergal-sharezer, who was Rab-mag, or chief magi; as the words mog in Persian, magoos in Arabic, magooshai in Syriac, and [magos ( ma/gov )] in Greek, signify; and we learn from Justin and Curtius that the magi attended the king in war.</TD></TR>';
stringArray[4] = 'And it came to pass, [that] when Zedekiah the king of Judah saw them, and all the men of war, then they fled, and went forth out of the city by night, by the way of the king\'s garden, by the gate __PNbetwixt_2__SHbetwixt</a> the two walls: and he went out the way of the plain.__CPRelated_Verses1_1__PSEntire Verse.__FFJer/38/18\');">Jer 38:18-20__NBLev/26/17\');">Lev 26:17__NRLev/26/36\');">36__NBDeu/28/25\');">Deu 28:25__NBDeu/32/24\');">Deu 32:24-30__NB2Ki/25/4\');">2Ki 25:4-7__NBIsa/30/15\');">Isa 30:15__NRIsa/30/16\');">16__NBEze/12/12\');">Eze 12:12__NBAmo/2/14\');">Amo 2:14__AN__GHbetwixt_2__PSbetwixt__EFJer/52/7\');">Jer 52:7-11__NB2Ch/32/5\');">2Ch 32:5__EN';
