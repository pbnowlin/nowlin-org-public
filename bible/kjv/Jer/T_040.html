var stringArray = new Array();
stringArray[1] = '__PNThe_word_1__SHThe word</a> that came to Jeremiah from the LORD, __PNafter_2__SHafter</a> that Nebuzaradan the captain of the guard had let him go from __PNRamah_3__SHRamah</a>, when he had taken him being __PNbound_4__SHbound</a> in __PNchains_5__SHchains</a> among all that were carried away captive of Jerusalem and Judah, which were carried away captive unto Babylon.__CPThe_word_1__PSThe word__EE"This, and the four following chapters, record the events which occurred in Judea from the taking of Jerusalem to the retreat of the remnant of the people to Egypt; and contain several prophecies of Jeremiah concerning them there; which were ""the word which came to Jeremiah from the LORD."" It appears that Jeremiah, after being freed from prison, continued among the Jews, till he was bound, with others of them, and carried to Ramah; where he was set a liberty in the manner related."__GHafter_2__PSafter__EFJer/39/11\');">Jer 39:11-14__AN__GGRamah_3__PSRamah__FFJer/31/15\');">Jer 31:15__NBJos/18/25\');">Jos 18:25__NB1Sa/7/17\');">1Sa 7:17__AN__GHbound_4__PSbound__EFPsa/68/6\');">Psa 68:6__NBPsa/107/16\');">Psa 107:16__NBAct/12/6\');">Act 12:6__NRAct/12/7\');">7__NBAct/21/13\');">Act 21:13__NBAct/28/20\');">Act 28:20__NBEph/6/20\');">Eph 6:20__AN; *marg:__GGchains_5__PSchains__EEor, manacles.</TD></TR>';
stringArray[2] = 'And the captain of the guard took Jeremiah, and said unto him, __PNThe_LORD_1__SHThe LORD</a> thy God hath pronounced this evil upon this place.__CPThe_LORD_1__PSThe LORD__FFJer/22/8\');">Jer 22:8__NRJer/22/9\');">9__NBDeu/29/24\');">Deu 29:24-28__NB1Ki/9/8\');">1Ki 9:8__NR1Ki/9/9\');">9__NB2Ch/7/20\');">2Ch 7:20-22__NBLam/2/15\');">Lam 2:15-17__EN';
stringArray[3] = 'Now the LORD hath brought [it], and done according as he hath said: __PNbecause_1__SHbecause</a> ye have sinned against the LORD, and have not obeyed his voice, therefore this thing is come upon you.__CPbecause_1__PSbecause__FFJer/50/7\');">Jer 50:7__NBNeh/9/28\');">Neh 9:28__NRNeh/9/33\');">33__NBDan/9/11\');">Dan 9:11__NRDan/9/12\');">12__NBRom/2/5\');">Rom 2:5__NBRom/3/19\');">Rom 3:19__EN';
stringArray[4] = 'And now, behold, I loose thee this day from the chains which __PNwere_upon_thine_hand_1__SH[were] upon thine hand</a>. If it seem good unto thee to come with me into Babylon, come; and I will __PNlook_well_unto_thee_2__SHlook well unto thee</a>: but if it seem ill unto thee to come with me into Babylon, forbear: behold, __PNall_the_3__SHall the</a> land [is] before thee: whither it seemeth good and convenient for thee to go, thither go.__CPwere_upon_thine_hand_1__PSwere upon thine hand__EEor, are upon thine hand. __NAJer/40/1\');">Jer 40:1__AN, *marg:__GHlook_well_unto_thee_2__PSlook well unto thee__FEHeb. set my eye upon thee. See on __NAJer/39/11\');">Jer 39:11__NRJer/39/12\');">12__AN, *marg__GGall_the_3__PSall the__FFGen/13/9\');">Gen 13:9__NBGen/20/15\');">Gen 20:15__NBGen/47/6\');">Gen 47:6__EN';
stringArray[5] = 'Now while he was not yet gone back, [he said], __PNGo_back_1__SHGo back</a> also to Gedaliah the son of __PNAhikam_2__SHAhikam</a> the son of Shaphan, whom the king of Babylon hath made governor over the cities of Judah, and dwell with him among the people: __PNor_go_3__SHor go</a> wheresoever it seemeth convenient unto thee to go. So the captain of the guard __PNgave_him_4__SHgave him</a> __PNvictuals_and_a_reward_5__SHvictuals and a reward</a>, and let him go.__CPGo_back_1__PSGo back__FFJer/39/14\');">Jer 39:14__NBJer/41/2\');">Jer 41:2__NB2Ki/25/22\');">2Ki 25:22-24__AN__GHAhikam_2__PSAhikam__EFJer/26/24\');">Jer 26:24__NB2Ki/22/12\');">2Ki 22:12__NR2Ki/22/14\');">14__NB2Ch/34/20\');">2Ch 34:20__AN__GGor_go_3__PSor go__FFJer/40/4\');">Jer 40:4__NBJer/15/11\');">Jer 15:11__NBEzr/7/6\');">Ezr 7:6__NREzr/7/27\');">27__NBNeh/1/11\');">Neh 1:11__NBNeh/2/4\');">Neh 2:4-8__NBPro/16/7\');">Pro 16:7__NBPro/21/1\');">Pro 21:1__AN__GHgave_him_4__PSgave him__EFJer/52/31\');">Jer 52:31-34__NB2Ki/8/7\');">2Ki 8:7-9__NBJob/22/29\');">Job 22:29__NBAct/27/3\');">Act 27:3__NRAct/27/43\');">43__NBAct/28/10\');">Act 28:10__NBHbr/13/6\');">Hbr 13:6__AN__GGvictuals_and_a_reward_5__PSvictuals and a reward__EE"Rather, ""victuals, ( aruchah, a stated allowance, sufficient for the journey,) and a present,"" masseäth."</TD></TR>';
stringArray[6] = '__PNThen_1__SHThen</a> went Jeremiah unto Gedaliah the son of Ahikam to __PNMizpah_2__SHMizpah</a>; and dwelt with him among the people that were left in the land.__CPThen_1__PSThen__EEIt has been doubted whether Jeremiah acted prudently in this decision, as the event seems to indicate the contrary, and as it was the evident meaning of all his predictions that the Jews should not prosper in their own country till the expiration of seventy years. But he was evidently influenced by the most unbounded love to his country, for whose welfare he had watched, prayed, and lived; and he now chose rather to share her adversities, her sorrows, her wants, her afflictions, and her disgrace, than to be the companion of princes, and to sit at the table of kings. His patriotism was as unbounded as it was sincere: he only ceased to live for country when he ceased to breathe. __NAJer/39/14\');">Jer 39:14__AN__GHMizpah_2__PSMizpah__EFJos/15/38\');">Jos 15:38__NBJdg/20/1\');">Jdg 20:1__NBJdg/21/1\');">Jdg 21:1__NB1Sa/7/5\');">1Sa 7:5__NR1Sa/7/6\');">6__AN; Mizpeh</TD></TR>';
stringArray[7] = 'Now when __PNall_the_1__SHall the</a> captains of the forces which [were] in the fields, [even] they and their men, heard that the king of Babylon had made Gedaliah the son of Ahikam governor in the land, and had committed unto him men, and women, and children, and of __PNthe_poor_2__SHthe poor</a> of the land, of them that were not carried away captive to Babylon;__CPall_the_1__PSall the__FFJer/39/4\');">Jer 39:4__NB2Ki/25/4\');">2Ki 25:4__NR2Ki/25/22\');">22__NR2Ki/25/23\');">23-26__AN__GHthe_poor_2__PSthe poor__EFJer/39/10\');">Jer 39:10__NBEze/33/24\');">Eze 33:24-29__NBEze/45/16\');">Eze 45:16__EN';
stringArray[8] = 'Then they __PNcame_1__SHcame</a> to Gedaliah to Mizpah, __PNeven_2__SHeven</a> Ishmael the son of Nethaniah, and __PNJohanan_3__SHJohanan</a> and __PNJonathan_4__SHJonathan</a> the sons of Kareah, and Seraiah the son of Tanhumeth, and the sons of Ephai the __PNNetophathite_5__SHNetophathite</a>, and Jezaniah the son of a __PNMaachathite_6__SHMaachathite</a>, they and their men.__CPcame_1__PScame__FFJer/40/6\');">Jer 40:6__NRJer/40/11\');">11__NRJer/40/12\');">12__AN__GHeven_2__PSeven__EFJer/40/14\');">Jer 40:14__NBJer/41/1\');">Jer 41:1-16__NB2Ki/25/23\');">2Ki 25:23__NR2Ki/25/25\');">25__AN__GGJohanan_3__PSJohanan__FFJer/41/11\');">Jer 41:11__NRJer/41/16\');">16__NBJer/42/1\');">Jer 42:1__NRJer/42/8\');">8__NBJer/43/2\');">Jer 43:2__NRJer/43/5\');">5__AN__GHJonathan_4__PSJonathan__EFJer/37/15\');">Jer 37:15__NRJer/37/20\');">20__NBJer/38/26\');">Jer 38:26__AN__GGNetophathite_5__PSNetophathite__FF2Sa/23/28\');">2Sa 23:28__NR2Sa/23/29\');">29__NB1Ch/2/54\');">1Ch 2:54__NB1Ch/11/30\');">1Ch 11:30__NBEzr/2/2\');">Ezr 2:2__NREzr/2/22\');">22__NBNeh/7/26\');">Neh 7:26__AN__GHMaachathite_6__PSMaachathite__EFDeu/3/14\');">Deu 3:14__NBJos/12/5\');">Jos 12:5__NB2Sa/10/6\');">2Sa 10:6__NR2Sa/10/8\');">8__NB2Sa/23/34\');">2Sa 23:34__NB1Ch/2/48\');">1Ch 2:48__EN';
stringArray[9] = 'And Gedaliah the son of Ahikam the son of Shaphan __PNsware_1__SHsware</a> unto them and to their men, saying, __PNFear_2__SHFear</a> not to serve the Chaldeans: dwell in the land, and serve the king of Babylon, and it shall be well with you.__CPsware_1__PSsware__FF1Sa/20/16\');">1Sa 20:16__NR1Sa/20/17\');">17__NB2Ki/25/24\');">2Ki 25:24__AN__GHFear_2__PSFear__EFJer/27/11\');">Jer 27:11__NBJer/38/17\');">Jer 38:17-20__NBGen/49/15\');">Gen 49:15__NBPsa/37/3\');">Psa 37:3__NBPsa/128/2\');">Psa 128:2__EN';
stringArray[10] = 'As for me, behold, I will dwell at Mizpah to __PNserve_1__SHserve</a> the Chaldeans, which will come unto us: but ye, __PNgather_2__SHgather</a> ye wine, and __PNsummer_3__SHsummer</a> fruits, and oil, and put [them] in your vessels, and dwell in your cities that ye have taken.__CPserve_1__PSserve__EEHeb. stand before. __NAJer/35/19\');">Jer 35:19__NBDeu/1/38\');">Deu 1:38__NBPro/22/29\');">Pro 22:29__NBLuk/21/36\');">Luk 21:36__AN__GHgather_2__PSgather__EFJer/39/10\');">Jer 39:10__AN__GGsummer_3__PSsummer__FFJer/40/12\');">Jer 40:12__NBJer/48/32\');">Jer 48:32__NB2Sa/16/1\');">2Sa 16:1__NBIsa/16/9\');">Isa 16:9__NBMic/7/1\');">Mic 7:1__EN';
stringArray[11] = 'Likewise when __PNall_the_Jews_1__SHall the Jews</a> that [were] in Moab, and among the Ammonites, and in Edom, and that [were] in all the countries, heard that the king of Babylon had left a remnant of Judah, and that he had set over them Gedaliah the son of Ahikam the son of Shaphan;__CPall_the_Jews_1__PSall the Jews__FFJer/24/9\');">Jer 24:9__NBIsa/16/4\');">Isa 16:4__NBEze/5/3\');">Eze 5:3__NREze/5/12\');">12__NBEze/25/2\');">Eze 25:2__NREze/25/6\');">6__NREze/25/8\');">8__NREze/25/12\');">12__NBEze/35/5\');">Eze 35:5__NREze/35/15\');">15__NBOba/1/11\');">Oba 1:11-14__EN';
stringArray[12] = 'Even all the Jews returned out of all places whither they were driven, and came to the land of Judah, to Gedaliah, unto Mizpah, and gathered wine and summer fruits very much.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[13] = 'Moreover __PNJohanan_1__SHJohanan</a> the son of Kareah, and all the captains of the forces that [were] in the fields, came to Gedaliah to Mizpah,__CPJohanan_1__PSJohanan__EEJohanan and his companions seem to have acted honestly in this affair. They had received intelligence of designs formed against Gedaliah\'s life, and consequently against the whole new settlement. Ishmael, being a branch of David\'s family, was probably displeased that another was preferred above him; and the king of the Ammonites, out of hatred to the Jews, employed him to slay Gedaliah. But Gedaliah, conscious of his own integrity and benevolence, took the portrait of others from his own mind; and therefore believed evil of no man, because he felt none towards any in his own breast. He may be reproached for being too credulous and confiding; but this only serves to shew the greatness of his soul; for a little mind is always suspicious, and ready to believe the worst of every person and thing. See on __NAJer/40/6\');">Jer 40:6-8__AN.</TD></TR>';
stringArray[14] = 'And said unto him, Dost thou certainly know that Baalis the king of the __PNAmmonites_1__SHAmmonites</a> hath sent __PNIshmael_2__SHIshmael</a> the son of Nethaniah to __PNslay_thee__3__SHslay thee?</a>? But Gedaliah the son of Ahikam __PNbelieved_4__SHbelieved</a> them not.__CPAmmonites_1__PSAmmonites__FFJer/25/21\');">Jer 25:21__NBJer/41/10\');">Jer 41:10__NBJer/49/1\');">Jer 49:1-6__NB1Sa/11/1\');">1Sa 11:1-3__NB2Sa/10/1\');">2Sa 10:1-6__NBEze/25/2\');">Eze 25:2-6__NBAmo/1/13\');">Amo 1:13-15__AN__GHIshmael_2__PSIshmael__EFJer/40/8\');">Jer 40:8__NBJer/41/2\');">Jer 41:2__NRJer/41/10\');">10__NBPro/26/23\');">Pro 26:23-26__NBIsa/26/10\');">Isa 26:10__NBMic/7/5\');">Mic 7:5__AN__GGslay_thee__3__PSslay thee?__EEHeb. strike thee in soul__GHbelieved_4__PSbelieved__EF1Cr/13/5\');">1Cr 13:5-7__EN';
stringArray[15] = 'Then Johanan the son of Kareah spake to Gedaliah in Mizpah secretly, saying, __PNLet_1__SHLet</a> me go, I pray thee, and I will slay Ishmael the son of Nethaniah, and no man shall know [it]: __PNwherefore_2__SHwherefore</a> should he slay thee, that all the Jews which are gathered unto thee should be scattered, and the remnant in Judah perish?__CPLet_1__PSLet__FF1Sa/24/4\');">1Sa 24:4__NB1Sa/26/8\');">1Sa 26:8__NBJob/31/31\');">Job 31:31__AN__GHwherefore_2__PSwherefore__EFJer/12/3\');">Jer 12:3__NRJer/12/4\');">4__NB2Sa/18/3\');">2Sa 18:3__NB2Sa/21/17\');">2Sa 21:17__NBEze/33/24\');">Eze 33:24-29__NBJhn/11/50\');">Jhn 11:50__EN';
