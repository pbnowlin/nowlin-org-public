stringArray[1] = 'Now it came to pass in __PNthe_seventh_month_1__SHthe seventh month</a>, [that] __PNIshmael_2__SHIshmael</a> the son of Nethaniah the son of __PNElishama_3__SHElishama</a>, __PNof_the_4__SHof the</a> __PNseed_5__SHseed</a> royal, and the princes of the king, even ten men with him, came unto Gedaliah the son of Ahikam to Mizpah; and there __PNthey_did_6__SHthey did</a> eat bread together in Mizpah.__CPthe_seventh_month_1__PSthe seventh month__EEThis was the month Tisri, answering to the new moon of September, the seventh of the sacred, but the first of the civil year; on the third day of which the Jews keep a fast, in commemoration of the death of Gedaliah, to which the prophet Zechariah refers, __NAJer/8/19\');">Jer 8:19__NBJer/39/2\');">39:2__NBJer/52/6\');">52:6__AN. __NA2Ki/25/3\');">2Ki 25:3__AN, __NA2Ki/25/8\');">8__AN, __NA2Ki/25/25\');">25__AN. __NAZec/7/5\');">Zec 7:5__NBZec/8/19\');">8:19__AN.__GHIshmael_2__PSIshmael__EFJer/40/6\');">Jer 40:6__NRJer/40/8\');">8__AN__GGElishama_3__PSElishama__FFJer/36/12\');">Jer 36:12__NRJer/36/20\');">20__AN__GHof_the_4__PSof the__EFPro/13/10\');">Pro 13:10__NBPro/27/4\');">Pro 27:4__NBJam/4/1\');">Jam 4:1-3__AN__GGseed_5__PSseed__FF2Ki/11/1\');">2Ki 11:1__NB2Ch/22/10\');">2Ch 22:10__NBEze/17/13\');">Eze 17:13__AN__GHthey_did_6__PSthey did__EFJer/40/14\');">Jer 40:14-16__NB2Sa/3/27\');">2Sa 3:27__NB2Sa/20/9\');">2Sa 20:9__NR2Sa/20/10\');">10__NBPsa/41/9\');">Psa 41:9__NBPsa/109/5\');">Psa 109:5__NBPro/26/23\');">Pro 26:23-26__NBDan/11/26\');">Dan 11:26__NRDan/11/27\');">27__NBLuk/22/47\');">Luk 22:47__NRLuk/22/48\');">48__NBJhn/13/18\');">Jhn 13:18__EN';
stringArray[2] = 'Then arose Ishmael the son of Nethaniah, and the ten men that were with him, __PNand_smote_1__SHand smote</a> Gedaliah the son of Ahikam the son of Shaphan with the sword, and slew him, __PNwhom_2__SHwhom</a> the king of Babylon had made governor over the land.__CPand_smote_1__PSand smote__FF2Ki/25/25\');">2Ki 25:25__AN__GHwhom_2__PSwhom__EFJer/40/7\');">Jer 40:7__EN';
stringArray[3] = 'Ishmael also slew all the Jews that were with him, [even] with Gedaliah, at Mizpah, and the Chaldeans that were found there, [and] the men of war.__CPRelated_Verses1_1__PSEntire Verse.__FFJer/41/11\');">Jer 41:11__NRJer/41/12\');">12__NB2Ki/25/25\');">2Ki 25:25__NBEcc/9/18\');">Ecc 9:18__NBLam/1/2\');">Lam 1:2__EN';

stringArray[5] = 'That there __PNcame_1__SHcame</a> certain from __PNShechem_2__SHShechem</a>, from __PNShiloh_3__SHShiloh</a>, and from __PNSamaria_4__SHSamaria</a>, [even] fourscore men, having __PNtheir_beards_5__SHtheir beards</a> shaven, and their clothes rent, and having cut themselves, with offerings and incense in their hand, to bring [them] __PNto_the_6__SHto the</a> house of the LORD.__CPcame_1__PScame__FF2Ki/10/13\');">2Ki 10:13__NR2Ki/10/14\');">14__AN__GHShechem_2__PSShechem__EFGen/33/18\');">Gen 33:18__NBGen/34/2\');">Gen 34:2__NBJos/24/32\');">Jos 24:32__NBJdg/9/1\');">Jdg 9:1__NB1Ki/12/1\');">1Ki 12:1__NR1Ki/12/25\');">25__AN__GGShiloh_3__PSShiloh__FFJer/7/12\');">Jer 7:12__NRJer/7/14\');">14__NBJos/18/1\');">Jos 18:1__AN__GHSamaria_4__PSSamaria__EF1Ki/16/24\');">1Ki 16:24__NR1Ki/16/29\');">29__AN__GGtheir_beards_5__PStheir beards__EEAll these were signs of deep mourning; which, though forbidden on funeral occasions, were customary, and perhaps counted allowable, on seasons of public calamity, and this mourning was probably on account of the destruction of Jerusalem. __NALev/19/27\');">Lev 19:27__NRLev/19/28\');">28__NBDeu/14/1\');">Deu 14:1__NB2Sa/10/4\');">2Sa 10:4__NBIsa/15/2\');">Isa 15:2__AN__GHto_the_6__PSto the__EF1Sa/1/7\');">1Sa 1:7__NB2Ki/25/9\');">2Ki 25:9__NBPsa/102/14\');">Psa 102:14__EN';
stringArray[6] = 'And Ishmael the son of Nethaniah went forth from Mizpah to meet them, __PNweeping__etc__1__SHweeping</a> all along as he went: and it came to pass, as he met them, he said unto them, Come to Gedaliah the son of Ahikam.__CPweeping__etc__1__PSweeping, etc.__EEHeb. in going and weeping. __NAJer/50/4\');">Jer 50:4__NB2Sa/1/2\');">2Sa 1:2-16__NB2Sa/3/16\');">2Sa 3:16__NBPro/26/23\');">Pro 26:23-26__EN';
stringArray[7] = 'And it was [so], when they came into the midst of the city, that Ishmael the son of Nethaniah __PNslew_1__SHslew</a> them, [and cast them] into the midst of the pit, he, and the men that [were] with him.__CPslew_1__PSslew__FF1Ki/15/28\');">1Ki 15:28__NR1Ki/15/29\');">29__NB1Ki/16/10\');">1Ki 16:10-12__NB2Ki/11/1\');">2Ki 11:1__NR2Ki/11/2\');">2__NB2Ki/15/25\');">2Ki 15:25__NBPsa/55/23\');">Psa 55:23__NBPro/1/16\');">Pro 1:16__NBIsa/59/7\');">Isa 59:7__NBEze/22/27\');">Eze 22:27__NBEze/33/24\');">Eze 33:24-26__NBRom/3/15\');">Rom 3:15__EN';
stringArray[8] = 'But ten men were found among them that said unto Ishmael, __PNSlay_1__SHSlay</a> us not: for we have __PNtreasures_2__SHtreasures</a> in the field, of wheat, and of barley, and of oil, and of honey. So he forbare, and slew them not among their brethren.__CPSlay_1__PSSlay__FFJob/2/4\');">Job 2:4__NBPsa/49/6\');">Psa 49:6-8__NBPro/13/8\');">Pro 13:8__NBMat/6/25\');">Mat 6:25__NBMat/16/26\');">Mat 16:26__NBMar/8/36\');">Mar 8:36__NRMar/8/37\');">37__NBPhl/3/7\');">Phl 3:7-9__AN__GHtreasures_2__PStreasures__FE"These ""treasures hid in the field"" were doubtless laid up in subterranean pits, similar to the mattamores in Barbary, in which, Dr. Shaw informs us, they deposit the grain when winnowed; two or three hundred of them being sometimes together, and the smallest holding four hundred bushels. The same mode of keeping corn prevails in Syria and the Holy Land."</TD></TR>';
stringArray[9] = 'Now __PNthe_pit_1__SHthe pit</a> wherein Ishmael had cast all the dead bodies of the men, whom he had slain __PNbecause_of_Gedaliah_2__SHbecause of Gedaliah</a>, __PNwas_it_3__SH[was] it</a> which Asa the king had made __PNfor_fear_4__SHfor fear</a> of Baasha king of Israel: [and] Ishmael the son of Nethaniah filled it with [them that were] slain.__CPthe_pit_1__PSthe pit__EEThis was probably a large reservoir for receiving rain water, which Asa had caused to be made in the midst of the city, in case of a siege.__GHbecause_of_Gedaliah_2__PSbecause of Gedaliah__FEor, near Gedaliah. Heb. by the hand, or the side of Gedaliah__GGwas_it_3__PSwas it__FFJos/10/16\');">Jos 10:16-18__NBJdg/6/2\');">Jdg 6:2__NB1Sa/13/6\');">1Sa 13:6__NB1Sa/14/11\');">1Sa 14:11__NR1Sa/14/22\');">22__NB1Sa/24/3\');">1Sa 24:3__NB2Sa/17/9\');">2Sa 17:9__NBHbr/11/38\');">Hbr 11:38__AN__GHfor_fear_4__PSfor fear__EF1Ki/15/17\');">1Ki 15:17-22__NB2Ch/16/1\');">2Ch 16:1-10__EN';
stringArray[10] = 'Then Ishmael carried away captive __PNall_the_1__SHall the</a> residue of the people that [were] in Mizpah, [__PNeven_2__SHeven</a>] the king\'s daughters, and all the people that remained in Mizpah, __PNwhom_3__SHwhom</a> Nebuzaradan the captain of the guard had committed to Gedaliah the son of Ahikam: and Ishmael the son of Nethaniah carried them away captive, and departed to go over __PNto_the_4__SHto the</a> Ammonites.__CPall_the_1__PSall the__FFJer/40/11\');">Jer 40:11__NRJer/40/12\');">12__AN__GHeven_2__PSeven__EFJer/22/30\');">Jer 22:30__NBJer/39/6\');">Jer 39:6__NBJer/43/5\');">Jer 43:5-7__NBJer/44/12\');">Jer 44:12-14__AN__GGwhom_3__PSwhom__FFJer/40/7\');">Jer 40:7__AN__GHto_the_4__PSto the__EFJer/40/14\');">Jer 40:14__NBNeh/2/10\');">Neh 2:10__NRNeh/2/19\');">19__NBNeh/4/7\');">Neh 4:7__NRNeh/4/8\');">8__NBNeh/6/17\');">Neh 6:17__NRNeh/6/18\');">18__NBNeh/13/4\');">Neh 13:4-8__EN';
stringArray[11] = 'But when __PNJohanan_1__SHJohanan</a> the son of Kareah, and all the captains of the forces that [were] with him, heard of all the evil that Ishmael the son of Nethaniah had done,__CPJohanan_1__PSJohanan__FFJer/41/2\');">Jer 41:2__NRJer/41/3\');">3__NRJer/41/7\');">7__NBJer/40/7\');">Jer 40:7__NRJer/40/8\');">8__NRJer/40/13\');">13-16__NBJer/42/1\');">Jer 42:1__NRJer/42/3\');">3__NBJer/43/2\');">Jer 43:2-5__EN';
stringArray[12] = 'Then they took all the men, and went __PNto_fight_1__SHto fight</a> with Ishmael the son of Nethaniah, and found him by __PNthe_great_2__SHthe great</a> waters that [are] in Gibeon.__CPto_fight_1__PSto fight__FFGen/14/14\');">Gen 14:14-16__NB1Sa/30/1\');">1Sa 30:1-8__NR1Sa/30/18\');">18-20__AN__GHthe_great_2__PSthe great__EF2Sa/2/13\');">2Sa 2:13__EN';
stringArray[13] = 'Now it came to pass, __PNthat_when_1__SH[that] when</a> all the people which [were] with Ishmael saw Johanan the son of Kareah, and all the captains of the forces that [were] with him, then they were glad.__CPthat_when_1__PSthat when__EEThey appear to have been weary of the tyranny of Ishmael, and glad of an opportunity to abandon him.</TD></TR>';
stringArray[14] = 'So all the people that Ishmael had carried away captive from Mizpah cast about and returned, and went unto Johanan the son of Kareah.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[15] = 'But Ishmael the son of Nethaniah __PNescaped_1__SHescaped</a> from Johanan with __PNeight_men_2__SHeight men</a>, and went to the Ammonites.__CPescaped_1__PSescaped__FF1Sa/30/17\');">1Sa 30:17__NB1Ki/20/20\');">1Ki 20:20__NBJob/21/30\');">Job 21:30__NBPro/28/17\');">Pro 28:17__NBEcc/8/11\');">Ecc 8:11__NREcc/8/12\');">12__NBAct/28/4\');">Act 28:4__AN__GHeight_men_2__PSeight men__EFJer/41/2\');">Jer 41:2__NB2Ki/25/25\');">2Ki 25:25__EN';
stringArray[16] = 'Then took Johanan the son of Kareah, and all the captains of the forces that [were] with him, all the remnant of the people whom he had recovered from Ishmael the son of Nethaniah, from Mizpah, after [that] he had slain Gedaliah the son of Ahikam, [__PNeven_1__SHeven</a>] mighty men of war, and the women, and the children, and the eunuchs, whom he had brought again from Gibeon:__CPeven_1__PSeven__FFJer/41/10\');">Jer 41:10__NBJer/42/8\');">Jer 42:8__NBJer/43/4\');">Jer 43:4-7__EN';
stringArray[17] = 'And they departed, and dwelt in the habitation of __PNChimham_1__SHChimham</a>, which is by Bethlehem, __PNto_go_2__SHto go</a> to enter into Egypt,__CPChimham_1__PSChimham__FF2Sa/19/37\');">2Sa 19:37__NR2Sa/19/38\');">38__AN__GHto_go_2__PSto go__FEAs Johanan and the other princes had taken a decided part against Ishmael, they had no sufficient reason to fear that the Chaldeans would revenge on them the murder of Gedaliah; but perhaps Johanan was unwilling to be superseded in the command which he had rightly assumed, and so used his influence to induce the whole company to take refuge in Egypt; and their old attachment to the Egyptians rendered them more ready to concur in this ruinous measure. __NAJer/42/14\');">Jer 42:14__NRJer/42/19\');">19__NBJer/43/7\');">Jer 43:7__NBIsa/30/2\');">Isa 30:2__NRIsa/30/3\');">3__EN';
stringArray[18] = 'Because of the Chaldeans: __PNfor_they_1__SHfor they</a> were afraid of them, __PNbecause_2__SHbecause</a> Ishmael the son of Nethaniah had slain Gedaliah the son of Ahikam, __PNwhom_3__SHwhom</a> the king of Babylon made governor in the land.__CPfor_they_1__PSfor they__FFJer/42/11\');">Jer 42:11__NRJer/42/16\');">16__NBJer/43/2\');">Jer 43:2__NRJer/43/3\');">3__NB2Ki/25/25\');">2Ki 25:25__NBIsa/30/16\');">Isa 30:16__NRIsa/30/17\');">17__NBIsa/51/12\');">Isa 51:12__NRIsa/51/13\');">13__NBIsa/57/11\');">Isa 57:11__NBLuk/12/4\');">Luk 12:4__NRLuk/12/5\');">5__AN__GHbecause_2__PSbecause__FESee on __NAJer/41/2\');">Jer 41:2__AN.__GGwhom_3__PSwhom__FFJer/40/5\');">Jer 40:5__EN';
