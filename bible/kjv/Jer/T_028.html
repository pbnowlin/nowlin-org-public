stringArray[17] = 'So __PNHananiah_1__SHHananiah</a> the prophet died the same year in __PNthe_seventh_month_2__SHthe seventh month</a>.__CPHananiah_1__PSHananiah__FFIsa/44/25\');">Isa 44:25__NRIsa/44/26\');">26__NBZec/1/6\');">Zec 1:6__AN__GHthe_seventh_month_2__PSthe seventh month__FEThe prophecy was delivered in the fifth month, (__NAJer/28/1\');">Jer 28:1__AN,) and Hananiah died in the seventh month; exactly two months after he had delivered his false prophecy, which he declared, in the name of God, would be fulfilled in two years. Here then the true prophet was demonstrated, and the false prophet detected. The death of Hananiah, thus predicted, was God\'s seal to the words of His prophet, and must have gained his other predictions great credit among the people; though it is evident that it did not induce them to forsake their sins and return to the God of Israel.</TD></TR>';
