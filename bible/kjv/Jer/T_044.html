stringArray[14] = '__PNSo_1__SHSo</a> that none of the remnant of Judah, __PNwhich_are_2__SHwhich are</a> gone into the land of Egypt to sojourn there, __PNshall_escape_3__SHshall escape</a> or remain, that they should return into the land of Judah, to the __PNwhich_they_4__SHwhich they</a> __PNhave_a_desire_5__SHhave a desire</a> to return to dwell there: __PNfor_none_6__SHfor none</a> shall return but such as shall escape.__CPSo_1__PSSo__EE"It is evident from __NAJer/44/28\');">Jer 44:28__AN, that some Jews were to escape the general destruction in Egypt, and to return into their own country, though but a few; and the same thing is implied in the latter clause of this verse. But the former part excludes from the number of those who should escape every individual of those who are properly termed ""the remnant of Judah;"" those who had willingly and rebelliously ""set their faces to go into the land of Egypt to dwell there,"" on a presumption that they knew better than God how to consult their own restoration. The few, then, who were destined to escape, were to be such as had come into the land of Egypt with Johanan by compulsion, or had previously fled thither, or in some other less offensive manner, and chanced to be there when the storm burst upon them."__GHwhich_are_2__PSwhich are__EFIsa/30/1\');">Isa 30:1-3__AN__GGshall_escape_3__PSshall escape__FFJer/44/27\');">Jer 44:27__NBJer/42/17\');">Jer 42:17__NBMat/23/33\');">Mat 23:33__NBRom/2/3\');">Rom 2:3__NBHbr/2/3\');">Hbr 2:3__AN__GHwhich_they_4__PSwhich they__EFJer/22/26\');">Jer 22:26__NRJer/22/27\');">27__NBJer/42/22\');">Jer 42:22__AN__GGhave_a_desire_5__PShave a desire__EEHeb. lift up there soul__GHfor_none_6__PSfor none__EFJer/44/28\');">Jer 44:28__NBIsa/4/2\');">Isa 4:2__NBIsa/10/20\');">Isa 10:20__NBRom/9/27\');">Rom 9:27__NBRom/11/5\');">Rom 11:5__NRRom/11/6\');">6__EN';

stringArray[17] = 'But we will certainly do __PNwhatsoever_1__SHwhatsoever</a> thing goeth forth out of our own mouth, to burn incense unto the __PNqueen_of_heaven_2__SHqueen of heaven</a>, and to pour out drink offerings unto her, __PNas_we_3__SHas we</a> have done, we, and __PNour_fathers_4__SHour fathers</a>, our kings, and our princes, __PNin_the_cities_5__SHin the cities</a> of Judah, and in the streets of Jerusalem: for [__PNthen_6__SHthen</a>] had we plenty of __PNvictuals_7__SHvictuals</a>, and were well, and saw no evil.__CPwhatsoever_1__PSwhatsoever__FFJer/44/25\');">Jer 44:25__NBNum/30/2\');">Num 30:2__NRNum/30/12\');">12__NBDeu/23/23\');">Deu 23:23__NBJdg/11/36\');">Jdg 11:36__NBPsa/12/4\');">Psa 12:4__NBMar/6/26\');">Mar 6:26__AN__GHqueen_of_heaven_2__PSqueen of heaven__FE"or, frame of heaven. As the Sun was worshipped, not only under the name of baal shamayim, ""LORD of heaven,"" but also by that of Molech, or King; it is likely also that the Moon was adored as melecheth hashshamayim, ""the Queen of heaven."" So the Orphic hymn addressed to the Moon begins [Klythi thea BASILEIA] Hear, goddess Queen. And Homer, in his Hymn to the Moon, addresses her, [Chaire, anassa, thea] All hail, Queen, goddess. In Epiphanius, we find some women of Arabia, towards the end of the fourth century, had set up another queen of heaven, the Virgin Mary, too well known since under that name and character, whom they likewise worshipped as a goddess, by holding stated assemblies every year to her honour, and by offering a cake of bread in her name; whence these heretics were called Collyridians, from the Greek [kollyris] a cake. __NAJer/7/18\');">Jer 7:18__NB2Ki/17/16\');">2Ki 17:16__AN"__GGas_we_3__PSas we__FFJer/19/13\');">Jer 19:13__NBJer/32/29\');">Jer 32:29-32__NB2Ki/22/17\');">2Ki 22:17__NBNeh/9/34\');">Neh 9:34__NBDan/9/6\');">Dan 9:6-8__AN__GHour_fathers_4__PSour fathers__EFNeh/9/34\');">Neh 9:34__NBPsa/106/6\');">Psa 106:6__NBEze/20/8\');">Eze 20:8__NBDan/9/5\');">Dan
