stringArray[58] = 'Thus saith the LORD of hosts; __PNThe_broad_walls_of_Babylon_1__SHThe broad walls of Babylon</a> shall be utterly __PNbroken_2__SHbroken</a>, and her __PNhigh_gates_3__SHhigh gates</a> shall be burned with fire; and __PNthe_people_4__SHthe people</a> shall labour in vain, and the folk in the fire, and they shall be weary.__CPThe_broad_walls_of_Babylon_1__PSThe broad walls of Babylon__EEor, The walls of broad Babylon. According to the testimony of Herodotus, the circumference of the walls of Babylon was 480 stadia, or 60 miles, their breadth 50 cubits, and their height 200 cubits; but when Darius became master of the place, B.C. 516, he took away all their 100 gates of brass, and beat down their walls to 50 cubits; and now not a vestige of these immense fortifications remains, to mark the site of this once mighty city! __NAJer/51/44\');">Jer 51:44__NBJer/50/15\');">Jer 50:15__AN__GHbroken_2__PSbroken__FEor, made naked__GGhigh_gates_3__PShigh gates__FFJer/51/30\');">Jer 51:30__NBIsa/45/1\');">Isa 45:1__NRIsa/45/2\');">2__AN__GHthe_people_4__PSthe people__EFJer/51/9\');">Jer 51:9__NRJer/51/64\');">64__NBPsa/127/1\');">Psa 127:1__NBIsa/65/23\');">Isa 65:23__NBHab/2/13\');">Hab 2:13__EN';
