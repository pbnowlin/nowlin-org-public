stringArray[6] = 'Then __PNtook_1__SHtook</a> they Jeremiah, and cast him __PNinto_2__SHinto</a> the dungeon of Malchiah the son of __PNHammelech_3__SHHammelech</a>, that [was] in the court of the prison: __PNand_they_4__SHand they</a> let down Jeremiah with cords. __PNAnd_in_5__SHAnd in</a> the dungeon [there was] no water, but mire: so Jeremiah sunk in the mire.__CPtook_1__PStook__FFJer/37/21\');">Jer 37:21__NBPsa/109/5\');">Psa 109:5__NBLuk/3/19\');">Luk 3:19__NRLuk/3/20\');">20__AN__GHinto_2__PSinto__EFJer/37/16\');">Jer 37:16__NBLam/3/55\');">Lam 3:55__NBAct/16/24\');">Act 16:24__NB2Cr/4/8\');">2Cr 4:8__NR2Cr/4/9\');">9__NBHbr/10/36\');">Hbr 10:36__AN__GGHammelech_3__PSHammelech__EEor, the king. __NAJer/36/26\');">Jer 36:26__AN__GHand_they_4__PSand they__EFJer/38/11\');">Jer 38:11__NRJer/38/12\');">12__AN__GGAnd_in_5__PSAnd in__EE"This dungeon, which seems to have belonged to one of Zedekiah\'s sons, appears to have been a most dreadful place; the horrors of which were probably augmented by the cruelty of the jailor. ""The eastern people,"" observes Sir J. Chardin, ""have not different prisons for the different classes of criminals; the judges do not trouble themselves about where the prisoners are confined, or how they are treated, considering it merely as a place of safety; and all that they require of the jailor is, that the prisoner be forthcoming when called for. As to the rest, he is master to do as he pleases; to treat him well or ill; to put him in irons or not; to shut him up close, or hold him in easier restraint; to admit people to him, or to suffer nobody to see him. If the jailor and his servants have large fees, let the person be the greatest rascal in the world, he shall be lodged in the jailor\'s own apartment, and the best part of it; and on the contrary, if those that have imprisoned a man give the jailor greater presents,"</TD></TR>';

stringArray[22] = 'And, behold, __PNall_1__SHall</a> the women that are left in the king of Judah\'s house [shall be] brought forth to the king of Babylon\'s princes, __PNand_those_2__SHand those</a> [women] shall say, __PNThy_friends_3__SHThy friends</a> __PNhave_set_4__SHhave set</a> thee on, and have prevailed against thee: __PNthy_feet_5__SHthy feet</a> are sunk in the mire, [and] __PNthey_are_6__SHthey are</a> turned away back.__CPall_1__PSall__FFJer/41/10\');">Jer 41:10__NBJer/43/6\');">Jer 43:6__NBLam/5/11\');">Lam 5:11__AN__GHand_those_2__PSand those__FE"Mr. Harmer would render, ""and here ( hennah, or reading hinneh, behold,) the women (wont to sing on public occasions) shall say,"" etc.; observing ""that these bitter speeches much better suit the lips of women belonging to the conquering nation, singing before a captive prince, than of his own wives and concubines."" This he illustrates by the following extract from Della Valle: When he was at Lar, in Persia, the king of Ormuz was brought thither in triumph; and ""this poor unfortunate king entered Lar, with his people, in the morning, music playing, and girls and women singing and dancing before him, according to the custom of Persia, and the people flocking together with a prodigious concourse, and conducting him in a pompous and magnificent manner, particularly with colours displayed, like what the Messenians formerly did to Philopoemen, the general of the Athenians, their prisoner of war, according to the report of Justin."""__GGThy_friends_3__PSThy friends__EEHeb. The men of thy peace. __NAJer/38/4\');">Jer 38:4-6__NBJer/20/10\');">Jer 20:10__NBPsa/41/9\');">Psa 41:9__AN; *marg:__GHhave_set_4__PShave set__EFJer/38/19\');">Jer 38:19__NBLam/1/2\');">Lam 1:2__NBMic/7/5\');">Mic 7:5__AN__GGthy_feet_5__PSthy feet__FFJer/38/6\');">Jer 38:6__NBPsa/69/2\');">Psa 69:2__NRPsa/69/14\');">14__AN__GHthey_are_6__PSthey are__EFJer/46/5\');">Jer 46:5__NRJer/46/21\');">21__NBIsa/42/17\');">Isa 42:17__NBLam/1/13\');">L
