stringArray[18] = '__PNMicah_1__SHMicah</a> the Morasthite prophesied in the days of Hezekiah king of Judah, and spake to all the people of Judah, saying, Thus saith the LORD of hosts; __PNZion_2__SHZion</a> shall be plowed [like] a field, and __PNJerusalem_3__SHJerusalem</a> shall become heaps, and __PNthe_mountain_4__SHthe mountain</a> of the house as the high places of a forest.__CPMicah_1__PSMicah__FFMic/1/1\');">Mic 1:1__AN__GHZion_2__PSZion__FEJosephus relates that Titus, after he had taken Jerusalem, ordered his soldiers to demolish it, except three of the largest and most beautiful towers, and the western wall of the city; all the rest was levelled, so that they who had never before seen it, could scarcely persuade themselves it had been inhabited. The Jewish writers also inform us, that Turnus Rufus, whom Titus had left in command, ploughed up the very foundations of the temple. When Dr. Richardson visited this sacred spot in 1818, he found one part of Mount Zion supporting a crop of barley, and another undergoing the labour of the plough: the soil turned up consisted of stone and lime mixed with earth, such as is usually met with in foundations of ruined cities. It is nearly a mile in circumference; is highest on the west side, and, towards the east, falls down in broad terraces on the upper part of the mountain as it slopes down toward the brook Kidron. __NAMic/3/12\');">Mic 3:12__AN__GGJerusalem_3__PSJerusalem__EESee on ch. __NAJer/9/11\');">Jer 9:11__NBJer/51/37\');">Jer 51:37__NB2Ki/19/25\');">2Ki 19:25__NBNeh/4/2\');">Neh 4:2__NBPsa/79/1\');">Psa 79:1__AN__GHthe_mountain_4__PSthe mountain__EFJer/17/3\');">Jer 17:3__NBIsa/2/2\');">Isa 2:2__NRIsa/2/3\');">3__NBMic/4/1\');">Mic 4:1__NBZec/8/3\');">Zec 8:3__EN';
