Text[2] = 'As it is written in the prophets, Behold, I send my messenger before thy face, which shall prepare thy way before thee.';

Text[12] = 'And immediately the Spirit driveth him into the wilderness.';

Text[18] = 'And straightway they forsook their nets, and followed him.';
Text[19] = 'And when he had gone a little further thence, he saw James the [son] of Zebedee, and John his brother, who also were in the ship mending their nets.';
Text[20] = 'And straightway he called them: and they left their father Zebedee in the ship with the hired servants, and went after him.';
Text[21] = 'And they went into Capernaum; and straightway on the sabbath day he entered into the synagogue, and taught.';
Text[22] = 'And they were astonished at his doctrine: for he taught them as one that had authority, and not as the scribes.';
Text[23] = 'And there was in their synagogue a man with an unclean spirit; and he cried out,';
Text[24] = 'Saying, Let [us] alone; what have we to do with thee, thou Jesus of Nazareth? art thou come to destroy us? I know thee who thou art, the Holy One of God.';
Text[25] = 'And Jesus rebuked him, saying, Hold thy peace, and come out of him.';
Text[26] = 'And when the unclean spirit had torn him, and cried with a loud voice, he came out of him.';
Text[27] = 'And they were all amazed, insomuch that they questioned among themselves, saying, What thing is this? what new doctrine [is] this? for with authority commandeth he even the unclean spirits, and they do obey him.';
Text[28] = 'And immediately his fame spread abroad throughout all the region round about Galilee.';
Text[29] = 'And forthwith, when they were come out of the synagogue, they entered into the house of Simon and Andrew, with James and John.';
Text[30] = 'But Simon\'s wife\'s mother lay sick of a fever, and anon they tell him of her.';
Text[31] = 'And he came and took her by the hand, and lifted her up; and immediately the fever left her, and she ministered unto them.';
Text[32] = 'And at even, when the sun did set, they brought unto him all that were diseased, and them that were possessed with devils.';
Text[33] = 'And all the city was gathered together at the door.';
Text[34] = 'And he healed many that were sick of divers diseases, and cast out many devils; and suffered not the devils to speak, because they knew him.';
Text[35] = 'And in the morning, rising up a great while before day, he went out, and departed into a solitary place, and there prayed.';
Text[36] = 'And Simon and they that were with him followed after him.';
Text[37] = 'And when they had found him, they said unto him, All [men] seek for thee.';
Text[38] = 'And he said unto them, Let us go into the next towns, that I may preach there also: for therefore came I forth.';
Text[39] = 'And he preached in their synagogues throughout all Galilee, and cast out devils.';
Text[40] = 'And there came a leper to him, beseeching him, and kneeling down to him, and saying unto him, If thou wilt, thou canst make me clean.';
Text[41] = 'And Jesus, moved with compassion, put forth [his] hand, and touched him, and saith unto him, I will; be thou clean.';
Text[42] = 'And as soon as he had spoken, immediately the leprosy departed from him, and he was cleansed.';
Text[43] = 'And he straitly charged him, and forthwith sent him away;';
Text[44] = 'And saith unto him, See thou say nothing to any man: but go thy way, shew thyself to the priest, and offer for thy cleansing those things which Moses commanded, for a testimony unto them.';
Text[45] = 'But he went out, and began to publish [it] much, and to blaze abroad the matter, insomuch that Jesus could no more openly enter into the city, but was without in desert places: and they came to him from every quarter.';
