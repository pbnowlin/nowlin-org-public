stringArray[33] = 'And __PNhe_took_1__SHhe took</a> him aside from the multitude, and __PNput_2__SHput</a> his fingers into his ears, and he spit, and touched his tongue;__CPhe_took_1__PShe took__FFMar/5/40\');">Mar 5:40__NBMar/8/23\');">Mar 8:23__NB1Ki/17/19\');">1Ki 17:19-22__NB2Ki/4/4\');">2Ki 4:4-6__NR2Ki/4/33\');">33__NR2Ki/4/34\');">34__NBJhn/9/6\');">Jhn 9:6__NRJhn/9/7\');">7__AN__GHput_2__PSput__FEThis was clearly a symbolical action; for these remedies evidently could not, by their natural efficacy, avail to produce so wonderful an effect. As the ears of the deaf appear closed, he applies his fingers to intimate that he would open them; and as the tongue of the dumb seems to be tied, or to cleave to the palate, he touches it, to intimate he would give loose and free motion to it. He accommodated himself to the weakness of those who might not indeed doubt his power, but fancy some external sign was requisite to healing. It was also thus made manifest, that this salutiferous power came from Himself, and that He who by one word, [ephphatha ( effaqa )] had healed the man, must be Divine.</TD></TR>';
