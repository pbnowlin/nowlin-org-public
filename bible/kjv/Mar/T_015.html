stringArray[39] = 'And when __PNthe_centurion_1__SHthe centurion</a>, which stood over against him, saw that he so cried out, and gave up the ghost, __PNhe_said_2__SHhe said</a>, Truly this man was the Son of God.__CPthe_centurion_1__PSthe centurion__EEThe centurion was a military captain, and commander of a century, or 100 men. In order to have a proper notion of his office, it may be desirable to explain the construction and array of the Roman legion. Each legion was divided into ten cohorts, each cohort into three maniples, and each maniple into two centuries; so that there were thirty maniples, and sixty centuries in a legion, which, if the century had always, as the word imports, consisted of 100 soldiers, would have formed a combined phalanx of 6,000 men. The number in a legion, however, varied at different periods; in the time of Polybius it was 4,200. The order of battle was that of three lines; the hastati, or spearmen, occupied the front; the principes, the second line; the triarii, (also called pilani, from their weapon, the pilam, ) the third. The centurions were appointed by the tribunes, and generally selected from the common soldiers according to their merit; although the office was sometimes obtained for money, or through the favour of the c__GHhe_said_2__PShe said__EFMat/27/43\');">Mat 27:43__NRMat/27/54\');">54__NBLuk/23/47\');">Luk 23:47__NRLuk/23/48\');">48__EN';
