stringArray[27] = 'And immediately __PNthe_king_1__SHthe king</a> sent __PNan_executioner_2__SHan executioner</a>, and commanded his head to be brought: and he went and beheaded him in the prison,__CPthe_king_1__PSthe king__FFMat/14/10\');">Mat 14:10__NRMat/14/11\');">11__AN__GHan_executioner_2__PSan executioner__FEor, one of his guard. [spekoulator ( spekoula/twr )] in Latin, speculator, from speculor, to look about, spy, properly denotes a sentinel; and as these sentinels kept guard at the palaces of kings, and the residences of Roman governors, so they were employed in other offices besides guarding, and usually performed that of executioners. As, however, we learn from Josephus, that Herod was at this very time engaged in war with Aretas, king of Arabia, in consequence of Herod\'s having divorced his daughter in order to marry Herodias, his brother Philip\'s wife; and as this event occurred at an entertainment given at the castle of Machaerus, while his army was on its march against his father-in-law; we are furnished with an additional reason why a speculator, or sentinel, should have been employed as an executioner; and are thus enabled to discover such a latent and undesigned coincidence as clearly evinces the truth of the evangelical narrative.</TD></TR>';
