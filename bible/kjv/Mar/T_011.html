stringArray[13] = 'And __PNseeing_1__SHseeing</a> __PNa_fig_tree_2__SHa fig tree</a> afar off having leaves, he came, if __PNhaply_3__SHhaply</a> he might find any thing thereon: and when he came to it, __PNhe_found_4__SHhe found</a> nothing but leaves; __PNfor_5__SHfor</a> the time of figs was not [yet].__CPseeing_1__PSseeing__FFMat/21/19\');">Mat 21:19__NBLuk/13/6\');">Luk 13:6-9__AN__GHa_fig_tree_2__PSa fig tree__FEThe fig-tree, [suke ( sukh= )] is a genus of the polygamia triaecia class of plants, seldom rising above twelve feet, but sending off from the bottom many spreading branches. The leaves are of a dark green colour, nearly a span long, smooth, and irregularly divided into from three to five deep rounded lobes; and the fruit grows on short and thick stalks, of a purplish colour, and contains a soft, sweet, and fragrant pulp, intermixed with numerous small seeds.__GGhaply_3__PShaply__FFRth/2/3\');">Rth 2:3__NB1Sa/6/9\');">1Sa 6:9__NBLuk/10/31\');">Luk 10:31__NBLuk/12/6\');">Luk 12:6__NRLuk/12/7\');">7__AN__GHhe_found_4__PShe found__EFIsa/5/7\');">Isa 5:7__AN__GGfor_5__PSfor__EE"Dr. Campbell observes, that the declaration, ""for the time of [ripe, Ed.] figs was not yet,"" is not the reason why our LORD did not find any fruit on the tree, because the fig is of that class of vegetables in which the fruit is formed in its immature state before the leaves are seen. But as the fruit is of a pulpy nature, the broad, thick leaves come out in profusion to protect it from the rays of the sun during the time it is ripening. If the words, ""for the time,"" etc. however, are read as a parenthesis, they then become a reason why Jesus Christ should look for fruit, because the season for gathering not having fully come, it would remove all suspicion that the fruit had been gathered: while the presence of the leaves incontestably proved the advance of the tree to the state in which fruit is found."</TD></TR>';
