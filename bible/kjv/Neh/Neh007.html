Text[1] = 'Now it came to pass, when the wall was built, and I had set up the doors, and the porters and the singers and the Levites were appointed,';
Text[2] = 'That I gave my brother Hanani, and Hananiah the ruler of the palace, charge over Jerusalem: for he [was] a faithful man, and feared God above many.';
Text[3] = 'And I said unto them, Let not the gates of Jerusalem be opened until the sun be hot; and while they stand by, let them shut the doors, and bar [them]: and appoint watches of the inhabitants of Jerusalem, every one in his watch, and every one [to be] over against his house.';
Text[4] = 'Now the city [was] large and great: but the people [were] few therein, and the houses [were] not builded.';
Text[5] = 'And my God put into mine heart to gather together the nobles, and the rulers, and the people, that they might be reckoned by genealogy. And I found a register of the genealogy of them which came up at the first, and found written therein,';
Text[6] = 'These [are] the children of the province, that went up out of the captivity, of those that had been carried away, whom Nebuchadnezzar the king of Babylon had carried away, and came again to Jerusalem and to Judah, every one unto his city;';
Text[7] = 'Who came with Zerubbabel, Jeshua, Nehemiah, Azariah, Raamiah, Nahamani, Mordecai, Bilshan, Mispereth, Bigvai, Nehum, Baanah. The number, [I say], of the men of the people of Israel [was this];';
Text[8] = 'The children of Parosh, two thousand an hundred seventy and two.';
Text[9] = 'The children of Shephatiah, three hundred seventy and two.';
Text[10] = 'The children of Arah, six hundred fifty and two.';
Text[11] = 'The children of Pahathmoab, of the children of Jeshua and Joab, two thousand and eight hundred [and] eighteen.';
Text[12] = 'The children of Elam, a thousand two hundred fifty and four.';
Text[13] = 'The children of Zattu, eight hundred forty and five.';
Text[14] = 'The children of Zaccai, seven hundred and threescore.';
Text[15] = 'The children of Binnui, six hundred forty and eight.';
Text[16] = 'The children of Bebai, six hundred twenty and eight.';
Text[17] = 'The children of Azgad, two thousand three hundred twenty and two.';
Text[18] = 'The children of Adonikam, six hundred threescore and seven.';
Text[19] = 'The children of Bigvai, two thousand threescore and seven.';
Text[20] = 'The children of Adin, six hundred fifty and five.';
Text[21] = 'The children of Ater of Hezekiah, ninety and eight.';
Text[22] = 'The children of Hashum, three hundred twenty and eight.';
Text[23] = 'The children of Bezai, three hundred twenty and four.';
Text[24] = 'The children of Hariph, an hundred and twelve.';
Text[25] = 'The children of Gibeon, ninety and five.';
Text[26] = 'The men of Bethlehem and Netophah, an hundred fourscore and eight.';
Text[27] = 'The men of Anathoth, an hundred twenty and eight.';
Text[28] = 'The men of Bethazmaveth, forty and two.';
Text[29] = 'The men of Kirjathjearim, Chephirah, and Beeroth, seven hundred forty and three.';
Text[30] = 'The men of Ramah and Geba, six hundred twenty and one.';
Text[31] = 'The men of Michmas, an hundred and twenty and two.';
Text[32] = 'The men of Bethel and Ai, an hundred twenty and three.';
Text[33] = 'The men of the other Nebo, fifty and two.';
Text[34] = 'The children of the other Elam, a thousand two hundred fifty and four.';
Text[35] = 'The children of Harim, three hundred and twenty.';
Text[36] = 'The children of Jericho, three hundred forty and five.';
Text[37] = 'The children of Lod, Hadid, and Ono, seven hundred twenty and one.';
Text[38] = 'The children of Senaah, three thousand nine hundred and thirty.';
Text[39] = 'The priests: the children of Jedaiah, of the house of Jeshua, nine hundred seventy and three.';
Text[40] = 'The children of Immer, a thousand fifty and two.';
Text[41] = 'The children of Pashur, a thousand two hundred forty and seven.';
Text[42] = 'The children of Harim, a thousand and seventeen.';
Text[43] = 'The Levites: the children of Jeshua, of Kadmiel, [and] of the children of Hodevah, seventy and four.';
Text[44] = 'The singers: the children of Asaph, an hundred forty and eight.';
Text[45] = 'The porters: the children of Shallum, the children of Ater, the children of Talmon, the children of Akkub, the children of Hatita, the children of Shobai, an hundred thirty and eight.';
Text[46] = 'The Nethinims: the children of Ziha, the children of Hashupha, the children of Tabbaoth,';
Text[47] = 'The children of Keros, the children of Sia, the children of Padon,';
Text[48] = 'The children of Lebana, the children of Hagaba, the children of Shalmai,';
Text[49] = 'The children of Hanan, the children of Giddel, the children of Gahar,';
Text[50] = 'The children of Reaiah, the children of Rezin, the children of Nekoda,';
Text[51] = 'The children of Gazzam, the children of Uzza, the children of Phaseah,';
Text[52] = 'The children of Besai, the children of Meunim, the children of Nephishesim,';
Text[53] = 'The children of Bakbuk, the children of Hakupha, the children of Harhur,';
Text[54] = 'The children of Bazlith, the children of Mehida, the children of Harsha,';
Text[55] = 'The children of Barkos, the children of Sisera, the children of Tamah,';
Text[56] = 'The children of Neziah, the children of Hatipha.';
Text[57] = 'The children of Solomon\'s servants: the children of Sotai, the children of Sophereth, the children of Perida,';
Text[58] = 'The children of Jaala, the children of Darkon, the children of Giddel,';
Text[59] = 'The children of Shephatiah, the children of Hattil, the children of Pochereth of Zebaim, the children of Amon.';
Text[60] = 'All the Nethinims, and the children of Solomon\'s servants, [were] three hundred ninety and two.';
Text[61] = 'And these [were] they which went up [also] from Telmelah, Telharesha, Cherub, Addon, and Immer: but they could not shew their father\'s house, nor their seed, whether they [were] of Israel.';
Text[62] = 'The children of Delaiah, the children of Tobiah, the children of Nekoda, six hundred forty and two.';
Text[63] = 'And of the priests: the children of Habaiah, the children of Koz, the children of Barzillai, which took [one] of the daughters of Barzillai the Gileadite to wife, and was called after their name.';
Text[64] = 'These sought their register [among] those that were reckoned by genealogy, but it was not found: therefore were they, as polluted, put from the priesthood.';
Text[65] = 'And the Tirshatha said unto them, that they should not eat of the most holy things, till there stood [up] a priest with Urim and Thummim.';
Text[66] = 'The whole congregation together [was] forty and two thousand three hundred and threescore,';
Text[67] = 'Beside their manservants and their maidservants, of whom [there were] seven thousand three hundred thirty and seven: and they had two hundred forty and five singing men and singing women.';
Text[68] = 'Their horses, seven hundred thirty and six: their mules, two hundred forty and five:';
Text[69] = '[Their] camels, four hundred thirty and five: six thousand seven hundred and twenty asses.';
Text[70] = 'And some of the chief of the fathers gave unto the work. The Tirshatha gave to the treasure a thousand drams of gold, fifty basons, five hundred and thirty priests\' garments.';
Text[71] = 'And [some] of the chief of the fathers gave to the treasure of the work twenty thousand drams of gold, and two thousand and two hundred pound of silver.';
Text[72] = 'And [that] which the rest of the people gave [was] twenty thousand drams of gold, and two thousand pound of silver, and threescore and seven priests\' garments.';
Text[73] = 'So the priests, and the Levites, and the porters, and the singers, and [some] of the people, and the Nethinims, and all Israel, dwelt in their cities; and when the seventh month came, the children of Israel [were] in their cities.';
