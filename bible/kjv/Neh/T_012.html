stringArray[27] = 'And at __PNthe_dedication_2__SHthe dedication</a> of the wall of Jerusalem they sought the Levites __PNout_3__SHout</a> of all their places, to bring them to Jerusalem, to keep the dedication with __PNgladness_4__SHgladness</a>, both with __PNthanksgivings_5__SHthanksgivings</a>, and with singing, [with] cymbals, psalteries, and with harps.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3559. B.C. 445.__GHthe_dedication_2__PSthe dedication__FEJerusalem was the holy city, and the wall was built under the immediate superintendence and blessing of Jehovah: it was therefore proper that it should be dedicated to that God who was there worshipped by solemn praises, prayers, and sacrifices. The dedication seems to have consisted in processions of the most eminent persons around the walls, with thanksgivings to God, who had enabled them to bring the work to so happy a conclusion; and, no doubt, to all this were added a particular consecration of the city to God, and the most earnest invocation that He would take it under His guardianship, and defend it and its inhabitants against their enemies. __NADeu/20/5\');">Deu 20:5__NBPsa/30/1\');">Psa 30:1__AN; *title__GGout_3__PSout__FFNeh/11/20\');">Neh 11:20__NB1Ch/15/4\');">1Ch 15:4__NR1Ch/15/12\');">12__NB1Ch/25/6\');">1Ch 25:6__NB1Ch/26/31\');">1Ch 26:31__NB2Ch/5/13\');">2Ch 5:13__NB2Ch/29/4\');">2Ch 29:4-11__NR2Ch/29/30\');">30__NBEzr/8/15\');">Ezr 8:15-20__AN__GHgladness_4__PSgladness__EFNeh/8/17\');">Neh 8:17__NBDeu/16/11\');">Deu 16:11__NB2Sa/6/12\');">2Sa 6:12__NB2Ch/29/30\');">2Ch 29:30__NBEzr/6/16\');">Ezr 6:16__NBPsa/98/4\');">Psa 98:4-6__NBPsa/100/1\');">Psa 100:1__NRPsa/100/2\');">2__NBPhl/4/4\');">Phl 4:4__AN__GGthanksgivings_5__PSthanksgivings__FF1Ch/13/8\');">1Ch 13:8__NB1Ch/15/16\');">1Ch 15:16__NR1Ch/15/28\');">28__NB1Ch/16/5\');">1Ch 16:5__NR1Ch/16/42\');">42__NB1Ch/23/5\');">1Ch 23:5__NB1Ch/25/1\');">1Ch 25:1-6__NB2Ch/5/13\');">2Ch 5:13__NB2Ch/7/6\');">2Ch 7:6__NBEzr/3/10\');">Ezr 3:10__NREzr
