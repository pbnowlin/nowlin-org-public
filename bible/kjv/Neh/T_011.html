stringArray[1] = 'And __PNthe_rulers_1__SHthe rulers</a> of the people dwelt at Jerusalem: the rest of the people also __PNcast_lots_2__SHcast lots</a>, to bring __PNone_of_ten_3__SHone of ten</a> to dwell in Jerusalem __PNthe_holy_4__SHthe holy</a> city, and nine parts [to dwell] in [other] cities.__CPthe_rulers_1__PSthe rulers__FFNeh/7/4\');">Neh 7:4__NRNeh/7/5\');">5__NBDeu/17/8\');">Deu 17:8__NRDeu/17/9\');">9__NBPsa/122/5\');">Psa 122:5__AN__GHcast_lots_2__PScast lots__FE"Jerusalem certainly had many inhabitants at this time, but not sufficient to preserve the city, which was now encompassed with a wall, the building of which was going on fast. Nehemiah, therefore, obliged one-tenth of the country people to come and dwell in it, that the population might be sufficient for the defence of the city. Some volunteered their services, which was at that time considered a sacrifice to patriotism; as Jerusalem then afforded very few advantages, and was a place of considerable danger: hence ""the people blessed them that willingly offered themselves."" __NANeh/10/34\');">Neh 10:34__NBJos/18/10\');">Jos 18:10__NB1Ch/26/13\');">1Ch 26:13__NBPro/16/33\');">Pro 16:33__NBAct/1/24\');">Act 1:24__AN"__GGone_of_ten_3__PSone of ten__FFJdg/20/9\');">Jdg 20:9__NRJdg/20/10\');">10__AN__GHthe_holy_4__PSthe holy__EFNeh/11/18\');">Neh 11:18__NBIsa/48/2\');">Isa 48:2__NBIsa/52/1\');">Isa 52:1__NBMat/4/5\');">Mat 4:5__NBMat/27/53\');">Mat 27:53__EN';
