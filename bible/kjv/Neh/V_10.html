<script type="text/javascript">
var Content = new Array();
Book = "Neh";
Chapter = "10";
Content[1]="Now those that sealed [were], Nehemiah, the Tirshatha, the son of Hachaliah, and Zidkijah,";
Content[2]="Seraiah, Azariah, Jeremiah,";
Content[3]="Pashur, Amariah, Malchijah,";
Content[4]="Hattush, Shebaniah, Malluch,";
Content[5]="Harim, Meremoth, Obadiah,";
Content[6]="Daniel, Ginnethon, Baruch,";
Content[7]="Meshullam, Abijah, Mijamin,";
Content[8]="Maaziah, Bilgai, Shemaiah: these [were] the priests.";
Content[9]="And the Levites: both Jeshua the son of Azaniah, Binnui of the sons of Henadad, Kadmiel;";
Content[10]="And their brethren, Shebaniah, Hodijah, Kelita, Pelaiah, Hanan,";
Content[11]="Micha, Rehob, Hashabiah,";
Content[12]="Zaccur, Sherebiah, Shebaniah,";
Content[13]="Hodijah, Bani, Beninu.";
Content[14]="The chief of the people; Parosh, Pahathmoab, Elam, Zatthu, Bani,";
Content[15]="Bunni, Azgad, Bebai,";
Content[16]="Adonijah, Bigvai, Adin,";
Content[17]="Ater, Hizkijah, Azzur,";
Content[18]="Hodijah, Hashum, Bezai,";
Content[19]="Hariph, Anathoth, Nebai,";
Content[20]="Magpiash, Meshullam, Hezir,";
Content[21]="Meshezabeel, Zadok, Jaddua,";
Content[22]="Pelatiah, Hanan, Anaiah,";
Content[23]="Hoshea, Hananiah, Hashub,";
Content[24]="Hallohesh, Pileha, Shobek,";
Content[25]="Rehum, Hashabnah, Maaseiah,";
Content[26]="And Ahijah, Hanan, Anan,";
Content[27]="Malluch, Harim, Baanah.";
Content[28]="And the rest of the people, the priests, the Levites, the porters, the singers, the Nethinims, and all they that had separated themselves from the people of the lands unto the law of God, their wives, their sons, and their daughters, every one having knowledge, and having understanding;";
Content[29]="They clave to their brethren, their nobles, and entered into a curse, and into an oath, to walk in God's law, which was given by Moses the servant of God, and to observe and do all the commandments of the LORD our Lord, and his judgments and his statutes;";
Content[30]="And that we would not give our daughters unto the people of the land, nor take their daughters for our sons:";
Content[31]="And [if] the people of the land bring ware or any victuals on the sabbath day to sell, [that] we would not buy it of them on the sabbath, or on the holy day: and [that] we would leave the seventh year, and the exaction of every debt.";
Content[32]="Also we made ordinances for us, to charge ourselves yearly with the third part of a shekel for the service of the house of our God;";
Content[33]="For the shewbread, and for the continual meat offering, and for the continual burnt offering, of the sabbaths, of the new moons, for the set feasts, and for the holy [things], and for the sin offerings to make an atonement for Israel, and [for] all the work of the house of our God.";
Content[34]="And we cast the lots among the priests, the Levites, and the people, for the wood offering, to bring [it] into the house of our God, after the houses of our fathers, at times appointed year by year, to burn upon the altar of the LORD our God, as [it is] written in the law:";
Content[35]="And to bring the firstfruits of our ground, and the firstfruits of all fruit of all trees, year by year, unto the house of the LORD:";
Content[36]="Also the firstborn of our sons, and of our cattle, as [it is] written in the law, and the firstlings of our herds and of our flocks, to bring to the house of our God, unto the priests that minister in the house of our God:";
Content[37]="And [that] we should bring the firstfruits of our dough, and our offerings, and the fruit of all manner of trees, of wine and of oil, unto the priests, to the chambers of the house of our God; and the tithes of our ground unto the Levites, that the same Levites might have the tithes in all the cities of our tillage.";
Content[38]="And the priest the son of Aaron shall be with the Levites, when the Levites take tithes: and the Levites shall bring up the tithe of the tithes unto the house of our God, to the chambers, into the treasure house.";
Content[39]="For the children of Israel and the children of Levi shall bring the offering of the corn, of the new wine, and the oil, unto the chambers, where [are] the vessels of the sanctuary, and the priests that minister, and the porters, and the singers: and we will not forsake the house of our God.";
</script>
