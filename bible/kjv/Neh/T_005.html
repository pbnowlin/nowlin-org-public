stringArray[17] = '__PNMoreover_1__SHMoreover</a> [there were] __PNat_my_table_2__SHat my table</a> __PNan_hundred_3__SHan hundred</a> and fifty of the Jews and rulers, beside those that came unto us from among the heathen that [are] about us.__CPMoreover_1__PSMoreover__EEHe kept open house, and entertained all comers; besides having 150 Jews, who had their food constantly at his table, and at his expense.__GHat_my_table_2__PSat my table__EF2Sa/9/7\');">2Sa 9:7__NR2Sa/9/13\');">13__NB1Ki/18/19\');">1Ki 18:19__AN__GGan_hundred_3__PSan hundred__FFIsa/32/8\');">Isa 32:8__NBRom/12/13\');">Rom 12:13__NB1Pe/4/9\');">1Pe 4:9__NR1Pe/4/10\');">10__EN';
stringArray[18] = '__PNNow_that_1__SHNow [that]</a> which was prepared [for me] daily [was] __PNone_ox_2__SHone ox</a> [and] six choice sheep; also fowls were prepared for me, and once in ten days store of all sorts of wine: yet for all this __PNrequired_3__SHrequired</a> not I the bread of the governor, __PNbecause_the_bondage_4__SHbecause the bondage</a> was heavy upon this people.__CPNow_that_1__PSNow that__FF1Ki/4/22\');">1Ki 4:22__NR1Ki/4/23\');">23__AN__GHone_ox_2__PSone ox__FEThis was food sufficient for more than two hundred men. Bp. Pococke says that the bey of Tunis had daily twelve sheep, with fish and fowls, soups, oranges, eggs, onions, boiled rice, etc., etc. His nobles dined with him; after they had done, the servants sat down; and when they had finished, the poor took what was left. Here the bey\'s twelve sheep are equal to Nehemiah\'s one ox and six choice sheep; and probably the mode of living between the two was nearly alike. It is still the practice in the East to calculate the expenses of the table, not by the money paid, but by the provisions consumed by the guests.__GGrequired_3__PSrequired__FFNeh/5/14\');">Neh 5:14__NRNeh/5/15\');">15__AN__GHbecause_the_bondage_4__PSbecause the bondage__EFPsa/37/21\');">Psa 37:21__NRPsa/37/26\');">26__EN';
