stringArray[12] = '__PNIs_it_nothing_1__SH[Is it] nothing</a> to you, all ye that pass by? behold, and see if there be any sorrow like unto my sorrow, which is done unto me, wherewith the LORD hath afflicted [me] in the day of his fierce anger.__CPIs_it_nothing_1__PSIs it nothing__EE"or, It is nothing. pass by. Heb. pass by the way. if. The church in distress here magnifies her affliction; and yet no more than there was cause for her groaning was not heavier than her strokes. She appeals to all spectators--see if there be any sorrow like unto my sorrow. This might truly be said of the griefs which were suffered in Jerusalem of old; but Christians are apt to apply these words too sensibly and sensitively to themselves, when they are in trouble, and sometimes more than there is reasonable cause to warrant. All men feel most from their own burden, and cannot be persuaded to reconcile themselves to it; how often do thy cry out in the words we are illustrating! whereas, if their troubles were to be thrown into a common stock with those of others, and then an equal dividend made, share and share alike, rather than approve such an arrangement, each would be ready to say, ""Pray give me my own again.""--Henry. __NALam/2/13\');">Lam 2:13__NBLam/4/6\');">Lam 4:6-11__NBDan/9/12\');">Dan 9:12__NBMat/24/21\');">Mat 24:21__NBLuk/21/22\');">Luk 21:22__NRLuk/21/23\');">23__NBLuk/23/28\');">Luk 23:28-31__AN"</TD></TR>';
