Text[1] = 'This second epistle, beloved, I now write unto you; in [both] which I stir up your pure minds by way of remembrance:';
Text[2] = 'That ye may be mindful of the words which were spoken before by the holy prophets, and of the commandment of us the apostles of the Lord and Saviour:';
Text[3] = 'Knowing this first, that there shall come in the last days scoffers, walking after their own lusts,';
