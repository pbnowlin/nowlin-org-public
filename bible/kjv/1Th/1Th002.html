Text[1] = 'For yourselves, brethren, know our entrance in unto you, that it was not in vain:';
Text[2] = 'But even after that we had suffered before, and were shamefully entreated, as ye know, at Philippi, we were bold in our God to speak unto you the gospel of God with much contention.';
Text[3] = 'For our exhortation [was] not of deceit, nor of uncleanness, nor in guile:';
