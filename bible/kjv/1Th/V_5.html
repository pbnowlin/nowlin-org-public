<script type="text/javascript">
var Content = new Array();
Book = "1Th";
Chapter = "5";
Content[1]="But of the times and the seasons, brethren, ye have no need that I write unto you.";
Content[2]="For yourselves know perfectly that the day of the Lord so cometh as a thief in the night.";
Content[3]="For when they shall say, Peace and safety; then sudden destruction cometh upon them, as travail upon a woman with child; and they shall not escape.";
Content[4]="But ye, brethren, are not in darkness, that that day should overtake you as a thief.";
Content[5]="Ye are all the children of light, and the children of the day: we are not of the night, nor of darkness.";
Content[6]="Therefore let us not sleep, as [do] others; but let us watch and be sober.";
Content[7]="For they that sleep sleep in the night; and they that be drunken are drunken in the night.";
Content[8]="But let us, who are of the day, be sober, putting on the breastplate of faith and love; and for an helmet, the hope of salvation.";
Content[9]="For God hath not appointed us to wrath, but to obtain salvation by our Lord Jesus Christ,";
Content[10]="Who died for us, that, whether we wake or sleep, we should live together with him.";
Content[11]="Wherefore comfort yourselves together, and edify one another, even as also ye do.";
Content[12]="And we beseech you, brethren, to know them which labour among you, and are over you in the Lord, and admonish you;";
Content[13]="And to esteem them very highly in love for their work's sake. [And] be at peace among yourselves.";
Content[14]="Now we exhort you, brethren, warn them that are unruly, comfort the feebleminded, support the weak, be patient toward all [men].";
Content[15]="See that none render evil for evil unto any [man]; but ever follow that which is good, both among yourselves, and to all [men].";
Content[16]="Rejoice evermore.";
Content[17]="Pray without ceasing.";
Content[18]="In every thing give thanks: for this is the will of God in Christ Jesus concerning you.";
Content[19]="Quench not the Spirit.";
Content[20]="Despise not prophesyings.";
Content[21]="Prove all things; hold fast that which is good.";
Content[22]="Abstain from all appearance of evil.";
Content[23]="And the very God of peace sanctify you wholly; and [I pray God] your whole spirit and soul and body be preserved blameless unto the coming of our Lord Jesus Christ.";
Content[24]="Faithful [is] he that calleth you, who also will do [it].";
Content[25]="Brethren, pray for us.";
Content[26]="Greet all the brethren with an holy kiss.";
Content[27]="I charge you by the Lord that this epistle be read unto all the holy brethren.";
Content[28]="The grace of our Lord Jesus Christ [be] with you. Amen. [[[The first [epistle] to the Thessalonians was written from Athens.]]]";
</script>
