stringArray[1] = 'Then Darius the king made a decree, __PNand_search_1__SHand search</a> was made in the house of the __PNrolls_2__SHrolls</a>, where the treasures were __PNlaid_up_3__SHlaid up</a> in Babylon.__CPand_search_1__PSand search__FFEzr/4/15\');">Ezr 4:15__NREzr/4/19\');">19__NBEzr/5/17\');">Ezr 5:17__NBJob/29/16\');">Job 29:16__NBPro/25/2\');">Pro 25:2__AN__GHrolls_2__PSrolls__FEChal. books. __NAPsa/40/7\');">Psa 40:7__NBJer/36/2\');">Jer 36:2-4__NRJer/36/20\');">20-23__NRJer/36/29\');">29__NRJer/36/32\');">32__NBEze/2/9\');">Eze 2:9__NBEze/3/1\');">Eze 3:1__NBRev/5/1\');">Rev 5:1__AN__GGlaid_up_3__PSlaid up__EEChal. made to descend.</TD></TR>';
stringArray[2] = 'And there was found __PNat_Achmetha_1__SHat Achmetha</a>, in the palace that [is] in the province of the Medes, a roll, and therein [was] a record thus written:__CPat_Achmetha_1__PSat Achmetha__EE"or, at Ecbatana, or, in a coffer. [\'argaz ( zgr) )] probably from the Persian [chm] kham, ""a house for a summer residence,"" with a prefix, [a] aleph, and the Chaldee termination [ta] tha, most likely denotes Ecbatana, as the Vulgate and Josephus read, the summer residence of the Persian monarchs. It was situated in a mountainous region at the foot of mount Orontes, or Jasonius, according to Ammianus, on the southern confines of Media and Persia, and according to Pliny, 750 miles from Seleucia the Great, 20 miles from the Caspian passes, 450 miles from Susa, and the same from Gazæ Atropatene, and in lat. 37 degrees 45 min., long. 88 degrees, according to Ptolemy. The building of the city is ascribed to Semiramis by Diodorus, but to Deioces by Eusebius, (in Chron. 1.1,) and Herodotus, who states that it was surrounded by seven walls, strong and ample, built in circles one within another, rising each above each by the height of their respective battlements; each being distinguished by a different colour, the fir"</TD></TR>';
