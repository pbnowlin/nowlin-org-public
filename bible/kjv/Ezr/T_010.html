stringArray[9] = 'Then all the men of Judah and Benjamin gathered themselves together unto Jerusalem within three days. It [was] __PNthe_ninth_month_1__SHthe ninth month</a>, on the twentieth [day] of the month; and all the people sat in the street of the house of God, __PNtrembling_2__SHtrembling</a> because of [this] matter, and for the __PNgreat_rain_3__SHgreat rain</a>.__CPthe_ninth_month_1__PSthe ninth month__EEThat is, some time in December, which is the coldest and most rainy time of the year in Palestine. Dr. Russel, in his account of the weather at Aleppo, which very much resembles that in Judea, says, that the natives reckon the severity of the winter, which they call marbania, to last but forty days, beginning from the 12th of December, and ending the 20th of January, and that this computation comes in fact very near the truth: and that the air during this time is excessively piercing, even to those that are just come from a cold climate. __NAEzr/7/8\');">Ezr 7:8__NREzr/7/9\');">9__NBEst/2/16\');">Est 2:16__AN__GHtrembling_2__PStrembling__EF1Sa/12/17\');">1Sa 12:17__NR1Sa/12/18\');">18__NBJer/10/10\');">Jer 10:10__NRJer/10/13\');">13__AN__GGgreat_rain_3__PSgreat rain__EEHeb. showers.</TD></TR>';

stringArray[44] = 'All these had taken __PNstrange_wives_1__SHstrange wives</a>: __PNand_some_of_them_2__SHand [some] of them</a> had wives by whom they had children.__CPstrange_wives_1__PSstrange wives__FFPro/2/16\');">Pro 2:16__NBPro/5/3\');">Pro 5:3__NRPro/5/20\');">20__AN__GHand_some_of_them_2__PSand some of them__FE"This observation was probably intended to shew that only a few of them had children, and also how rigorously the law was put in execution. According to a passage in Justin Martyr\'s Dialogue with Trypho, a Jew, Ezra offered a paschal lamb on this occasion, and addressed the people thus: ""And Ezra said to the people, This pass-over is our Saviour and our Refuge; and if ye will be persuaded of it, and let it enter into your hearts, that we are to humble to Him in a sign, and afterwards shall believe in Him, this place shall not be destroyed for ever, saith the LORD of hosts; but, if ye will not believe in Him, nor hearken to his preaching, ye shall be a laughing-stock to the Gentiles."" This was probably a marginal note added by some early Christian."</TD></TR>';
