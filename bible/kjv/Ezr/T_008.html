stringArray[15] = 'And I gathered them together to __PNthe_river_that_runneth_1__SHthe river that runneth</a> to __PNAhava_2__SHAhava</a>; and there __PNabode_3__SHabode</a> we in tents three days: and I viewed the people, and the priests, __PNand_found_4__SHand found</a> there none of the sons of Levi.__CPthe_river_that_runneth_1__PSthe river that runneth__EE"Ahava is supposed to be the river Adiava, which, with the Diava, is said by Ammianus to have given name to Adiabene, a province of Assyria, through which they flowed into the Tigris. These rivers were also called respectively, Anzabas and Zabas, the Caprus and Lycus of Ptolemy; the former of which he places, at its source, in long. 79 degrees, lat. 39® degrees, and at its junction with the Tigris, in long. 79® degrees, lat. 36 degrees 6\'; and the latter, at its source, in long 78 degrees, lat. 39 degrees; and where it falls into the Tigris, in long. 79 degrees, lat. 36® degrees. They are now called the Great and Little Zab, or the Zabein, i.e., the two Zabs, which, says Ibn Haukal, ""are considerable streams, each about half as large as the Dejleh (or Tigris). They rise among the mountains of Azerbaijan: of these, the larger is that which runs towards Haditheh. These streams form part of the Tigris, and water the district of Semerah."" __NAPsa/137/1\');">Psa 137:1__NBEze/1/1\');">Eze 1:1__NBEze/3/15\');">Eze 3:15__NBAct/16/13\');">Act 16:13__AN"__GHAhava_2__PSAhava__EFEzr/8/21\');">Ezr 8:21__NREzr/8/31\');">31__AN__GGabode_3__PSabode__EEHeb. pitched__GHand_found_4__PSand found__EFEzr/8/2\');">Ezr 8:2__NBEzr/7/7\');">Ezr 7:7__NREzr/7/24\');">24__EN';
stringArray[16] = 'Then sent I for Eliezer, for Ariel, for __PNShemaiah_1__SHShemaiah</a>, and for Elnathan, and for Jarib, and for Elnathan, and for __PNNathan_2__SHNathan</a>, and for __PNZechariah_3__SHZechariah</a>, and for Meshullam, __PNchief_men_4__SHchief men</a>; also for Joiarib, and for Elnathan, __PNmen_of_understanding_5__SHmen of understanding</a>.__CPShemaiah_1__PSShemaiah__FFEzr/8/13\');">Ezr 8:13__NBEzr/10/21\');">Ezr 10:21__AN__GHNathan_2__PSNathan__EFEzr/10/39\');">Ezr 10:39__AN__GGZechariah_3__PSZechariah__FFEzr/8/11\');">Ezr 8:11__AN__GHchief_men_4__PSchief men__EFEzr/8/1\');">Ezr 8:1__AN__GGmen_of_understanding_5__PSmen of understanding__FFEzr/8/18\');">Ezr 8:18__NB1Ki/3/11\');">1Ki 3:11__NB1Ch/12/32\');">1Ch 12:32__NB1Ch/26/14\');">1Ch 26:14__NB2Ch/2/12\');">2Ch 2:12__NBPro/2/6\');">Pro 2:6__NBPro/20/5\');">Pro 20:5__NBPro/28/2\');">Pro 28:2__NBDan/2/21\');">Dan 2:21__NB2Ti/2/7\');">2Ti 2:7__NB1Jo/5/20\');">1Jo 5:20__EN';
stringArray[17] = 'And I sent them with commandment unto Iddo the chief at the place __PNCasiphia_1__SHCasiphia</a>, and __PNI_told_them_2__SHI told them</a> what they should say unto Iddo, [and] to his brethren __PNthe_Nethinims_3__SHthe Nethinims</a>, at the place Casiphia, that they should bring unto us __PNministers_4__SHministers</a> for the house of our God.__CPCasiphia_1__PSCasiphia__EECasiphia is supposed to denote the Caspian mountains, between Media and Hyrcania, near the Caspian Sea. It is evident, from a comparison of __NAEzr/7/9\');">Ezr 7:9__AN with __NAEzr/8/31\');">Ezr 8:31__AN, that Casiphia could not be far from Ahava.__GHI_told_them_2__PSI told them__FEHeb. I put words in their mouth. __NAExd/4/15\');">Exd 4:15__NBDeu/18/18\');">Deu 18:18__NB2Sa/14/3\');">2Sa 14:3__NR2Sa/14/19\');">19__NBJer/1/9\');">Jer 1:9__NBJer/15/19\');">Jer 15:19__AN__GGthe_Nethinims_3__PSthe Nethinims__FFEzr/2/43\');">Ezr 2:43__NREzr/2/58\');">58__NBEzr/7/7\');">Ezr 7:7__AN__GHministers_4__PSministers__EFNum/8/22\');">Num 8:22-26__NBNum/18/6\');">Num 18:6__NB1Ch/23/3\');">1Ch 23:3-6__NR1Ch/23/26\');">26-32__NBTts/1/5\');">Tts 1:5__EN';

stringArray[19] = 'And __PNHashabiah_1__SHHashabiah</a>, and with him Jeshaiah of the sons of __PNMerari_2__SHMerari</a>, his brethren and their sons, twenty;__CPHashabiah_1__PSHashabiah__FFNeh/3/17\');">Neh 3:17__NBNeh/10/11\');">Neh 10:11__AN__GHMerari_2__PSMerari__EF1Ch/6/1\');">1Ch 6:1__NR1Ch/6/16\');">16__NR1Ch/6/19\');">19__EN';
stringArray[20] = 'Also of the __PNNethinims_1__SHNethinims</a>, whom David and the princes had appointed for the service of the Levites, two hundred and twenty Nethinims: __PNall_of_them_2__SHall of them</a> were expressed by name.__CPNethinims_1__PSNethinims__FFEzr/8/17\');">Ezr 8:17__NBEzr/2/43\');">Ezr 2:43__NBEzr/7/7\');">Ezr 7:7__NB1Ch/9/2\');">1Ch 9:2__AN__GHall_of_them_2__PSall of them__EFPhl/4/3\');">Phl 4:3__EN';
stringArray[21] = 'Then __PNI_proclaimed_1__SHI proclaimed</a> a fast there, at the river of Ahava, that we might __PNafflict_ourselves_2__SHafflict ourselves</a> before our God, __PNto_seek_3__SHto seek</a> of him a right way for us, and __PNfor_our_little_ones_4__SHfor our little ones</a>, and for all our substance.__CPI_proclaimed_1__PSI proclaimed__FFJdg/20/26\');">Jdg 20:26__NB1Sa/7/6\');">1Sa 7:6__NB2Ch/20/3\');">2Ch 20:3__NBJoe/1/14\');">Joe 1:14__NBJoe/2/12\');">Joe 2:12-18__NBJon/3/5\');">Jon 3:5__AN__GHafflict_ourselves_2__PSafflict ourselves__EFLev/16/29\');">Lev 16:29__NRLev/16/31\');">31__NBLev/23/29\');">Lev 23:29__NBIsa/58/3\');">Isa 58:3__NRIsa/58/5\');">5__NBJer/31/8\');">Jer 31:8__NRJer/31/9\');">9__NBJer/50/4\');">Jer 50:4__NRJer/50/5\');">5__AN__GGto_seek_3__PSto seek__FFPsa/5/8\');">Psa 5:8__NBPsa/107/2\');">Psa 107:2-8__NBPsa/143/8\');">Psa 143:8-10__NBPro/3/6\');">Pro 3:6__NBIsa/30/21\');">Isa 30:21__NBIsa/35/8\');">Isa 35:8__NBIsa/42/16\');">Isa 42:16__NBIsa/49/10\');">Isa 49:10__NBJer/10/23\');">Jer 10:23__AN__GHfor_our_little_ones_4__PSfor our little ones__EFNum/14/3\');">Num 14:3__NRNum/14/31\');">31__NBPsa/8/2\');">Psa 8:2__NBMar/10/13\');">Mar 10:13-16__NBAct/2/39\');">Act 2:39__EN';
stringArray[22] = 'For __PNI_was_ashamed_1__SHI was ashamed</a> to require of the king a band of soldiers and horsemen to help us against the enemy in the way: because we had spoken unto the king, saying, __PNThe_hand_2__SHThe hand</a> of our God [is] upon all them for good that seek him; but __PNhis_power_and_his_wrath_3__SHhis power and his wrath</a> [is] against all them that forsake him.__CPI_was_ashamed_1__PSI was ashamed__FF1Cr/9/15\');">1Cr 9:15__NB2Cr/7/14\');">2Cr 7:14__AN__GHThe_hand_2__PSThe hand__EFEzr/7/6\');">Ezr 7:6__NREzr/7/9\');">9__NREzr/7/28\');">28__NB1Ch/28/9\');">1Ch 28:9__NB2Ch/16/9\');">2Ch 16:9__NBPsa/33/18\');">Psa 33:18__NRPsa/33/19\');">19__NBPsa/34/15\');">Psa 34:15__NRPsa/34/22\');">22__NBIsa/3/10\');">Isa 3:10__NRIsa/3/11\');">11__NBLam/3/25\');">Lam 3:25__NBRom/8/28\');">Rom 8:28__NB1Pe/3/12\');">1Pe 3:12__AN__GGhis_power_and_his_wrath_3__PShis power and his wrath__FFJos/23/16\');">Jos 23:16__NB2Ch/15/2\');">2Ch 15:2__NBPsa/21/8\');">Psa 21:8__NRPsa/21/9\');">9__NBPsa/34/16\');">Psa 34:16__NBPsa/90/11\');">Psa 90:11__NBZep/1/2\');">Zep 1:2-6__NBHbr/10/38\');">Hbr 10:38__NB1Pe/3/12\');">1Pe 3:12__EN';
stringArray[23] = 'So __PNwe_fasted_1__SHwe fasted</a> and __PNbesought_2__SHbesought</a> our God for this: __PNand_he_was_intreated_3__SHand he was intreated</a> of us.__CPwe_fasted_1__PSwe fasted__FFNeh/9/1\');">Neh 9:1__NBEst/4/16\');">Est 4:16__NBDan/9/3\');">Dan 9:3__NBLuk/2/37\');">Luk 2:37__NBAct/10/30\');">Act 10:30__AN__GHbesought_2__PSbesought__EFJer/29/12\');">Jer 29:12__NRJer/29/13\');">13__NBJer/33/3\');">Jer 33:3__NBJer/50/4\');">Jer 50:4__NRJer/50/5\');">5__AN__GGand_he_was_intreated_3__PSand he was intreated__FFEzr/8/31\');">Ezr 8:31__NBDeu/4/29\');">Deu 4:29__NB1Ch/5/20\');">1Ch 5:20__NB2Ch/33/12\');">2Ch 33:12__NR2Ch/33/13\');">13__NBPsa/66/18\');">Psa 66:18-20__NBIsa/19/22\');">Isa 19:22__NBJer/29/12\');">Jer 29:12__NRJer/29/13\');">13__NBMat/7/7\');">Mat 7:7__NRMat/7/8\');">8__EN';

stringArray[25] = 'And __PNweighed_1__SHweighed</a> unto them __PNthe_silver_2__SHthe silver</a>, and the gold, and the vessels, [even] the offering of the house of our God, which the king, and his counsellors, and his lords, and all Israel [there] present, had offered:__CPweighed_1__PSweighed__FFEzr/8/33\');">Ezr 8:33__NBEzr/1/8\');">Ezr 1:8__NB2Cr/8/20\');">2Cr 8:20__NR2Cr/8/21\');">21__NBPhl/4/8\');">Phl 4:8__AN__GHthe_silver_2__PSthe silver__EFEzr/7/15\');">Ezr 7:15__NREzr/7/16\');">16__EN';
stringArray[26] = 'I even weighed unto their hand six hundred and fifty talents of silver, and silver vessels an hundred talents, [and] of gold an hundred talents;__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[27] = 'Also twenty basons of gold, of a thousand drams; and two vessels of __PNfine_copper_1__SHfine copper</a>, __PNprecious_2__SHprecious</a> as gold.__CPfine_copper_1__PSfine copper__EE"Heb. yellow, or shining brass. The Syriac renders, nechosho korinthyo tovo, ""good Corinthian brass;"" so called from the brass found after the burning of Corinth by Lucius Mummius, which was, as is generally supposed, brass, copper, silver, and gold, melted together. Sir J. Chardin, however, in a MS. note, cited by Harmer, mentioned a factitious metal used in the East, and highly esteemed there, which might probably be of an origin as ancient as Ezra. He says, ""I have heard some Dutch gentlemen speak of a metal in the island of Sumatra, and among the Macassars, much more esteemed than gold, which royal personages alone are privileged to wear. It is a mixture, if I remember right, of gold and steel, or copper and steel."" He afterwards added, ""calmbac is the name of this metal, which is composed of gold and copper."""__GHprecious_2__PSprecious__FEHeb. desirable. __NALam/4/2\');">Lam 4:2__EN';
stringArray[28] = 'And I said unto them, __PNYe_are_holy_1__SHYe [are] holy</a> unto the LORD; __PNthe_vessels_2__SHthe vessels</a> [are] holy also; and the silver and the gold [are] a freewill offering unto the LORD God of your fathers.__CPYe_are_holy_1__PSYe are holy__FFLev/21/6\');">Lev 21:6-8__NBDeu/33/8\');">Deu 33:8__NBIsa/52/11\');">Isa 52:11__AN__GHthe_vessels_2__PSthe vessels__EFEzr/1/7\');">Ezr 1:7-11__NBLev/22/2\');">Lev 22:2__NRLev/22/3\');">3__NBNum/4/4\');">Num 4:4-15__NRNum/4/19\');">19__NRNum/4/20\');">20__NBNum/7/13\');">Num 7:13__NRNum/7/84\');">84-88__NB1Ki/7/48\');">1Ki 7:48-51__NB1Ch/23/28\');">1Ch 23:28__NB2Ch/24/14\');">2Ch 24:14__EN';
stringArray[29] = '__PNWatch_ye_1__SHWatch ye</a>, and keep [them], __PNuntil_ye_weigh_them_before_2__SHuntil ye weigh [them] before</a> the chief of the priests and the Levites, and chief of the fathers of Israel, at Jerusalem, in the chambers of the house of the LORD.__CPWatch_ye_1__PSWatch ye__FF1Ch/26/20\');">1Ch 26:20-26__NBMar/13/34\');">Mar 13:34__NRMar/13/35\');">35__NBAct/20/31\');">Act 20:31__NB2Ti/4/5\');">2Ti 4:5__AN__GHuntil_ye_weigh_them_before_2__PSuntil ye weigh them before__EFEzr/8/33\');">Ezr 8:33__NREzr/8/34\');">34__EN';
stringArray[30] = 'So took the priests and the Levites the weight of the silver, and the gold, and the vessels, to bring [them] to Jerusalem unto __PNthe_house_of_our_God_1__SHthe house of our God</a>.__CPthe_house_of_our_God_1__PSthe house of our God__FFEzr/8/22\');">Ezr 8:22__NB1Ch/29/2\');">1Ch 29:2__NR1Ch/29/3\');">3__NBPsa/122/9\');">Psa 122:9__NBIsa/60/13\');">Isa 60:13__EN';
stringArray[31] = 'Then we departed from __PNthe_river_of_Ahava_1__SHthe river of Ahava</a> on the twelfth [day] of the first month, to go unto Jerusalem: and __PNthe_hand_2__SHthe hand</a> of our God was upon us, __PNand_he_delivered_3__SHand he delivered</a> us from the hand of the enemy, and of such as lay in wait by the way.__CPthe_river_of_Ahava_1__PSthe river of Ahava__FFEzr/8/15\');">Ezr 8:15__NREzr/8/21\');">21__AN__GHthe_hand_2__PSthe hand__EFEzr/8/22\');">Ezr 8:22__NBEzr/7/9\');">Ezr 7:9__NREzr/7/28\');">28__NBJob/5/19\');">Job 5:19-24__NBPsa/91/9\');">Psa 91:9-14__NBIsa/41/10\');">Isa 41:10-14__NBAct/25/3\');">Act 25:3__NBAct/26/22\');">Act 26:22__AN__GGand_he_delivered_3__PSand he delivered__EE"Ezra and his company had now entered upon a journey of several hundred miles through the desert, which they were nearly four months in completing, encumbered with families and possessions, and carrying large treasures with them, which would invite the attempts of the Arabian hordes, and others, that infested that neighbourhood; yet, having declared to the king, ""that the hand of God was upon all them for good that seek him, and that his power and wrath were against all them that forsook him,"" (__NAEzr/8/22\');">Ezr 8:22__AN,) he determined to travel without a guard, except that of the Almighty, being ashamed to ask any other, after his former avowed confidence in Him! Having, therefore, humbled themselves before the LORD, and besought his guidance and protection, he was intreated by them, their enemies were restrained or disabled, and they arrived unmolested at Jerusalem."</TD></TR>';
stringArray[32] = 'And we came to Jerusalem, and abode there three days.__CPRelated_Verses1_1__PSEntire Verse.__FFEzr/7/8\');">Ezr 7:8__NREzr/7/9\');">9__NBNeh/2/11\');">Neh 2:11__EN';
