Text[2] = 'Which came with Zerubbabel: Jeshua, Nehemiah, Seraiah, Reelaiah, Mordecai, Bilshan, Mispar, Bigvai, Rehum, Baanah. The number of the men of the people of Israel:';
Text[3] = 'The children of Parosh, two thousand an hundred seventy and two.';
Text[4] = 'The children of Shephatiah, three hundred seventy and two.';
Text[5] = 'The children of Arah, seven hundred seventy and five.';

Text[24] = 'The children of Azmaveth, forty and two.';
Text[25] = 'The children of Kirjatharim, Chephirah, and Beeroth, seven hundred and forty and three.';
Text[26] = 'The children of Ramah and Gaba, six hundred twenty and one.';
Text[27] = 'The men of Michmas, an hundred twenty and two.';
Text[28] = 'The men of Bethel and Ai, two hundred twenty and three.';
Text[29] = 'The children of Nebo, fifty and two.';
Text[30] = 'The children of Magbish, an hundred fifty and six.';
Text[31] = 'The children of the other Elam, a thousand two hundred fifty and four.';
Text[32] = 'The children of Harim, three hundred and twenty.';
Text[33] = 'The children of Lod, Hadid, and Ono, seven hundred twenty and five.';
Text[34] = 'The children of Jericho, three hundred forty and five.';
Text[35] = 'The children of Senaah, three thousand and six hundred and thirty.';

Text[37] = 'The children of Immer, a thousand fifty and two.';
Text[38] = 'The children of Pashur, a thousand two hundred forty and seven.';
Text[39] = 'The children of Harim, a thousand and seventeen.';
Text[40] = 'The Levites: the children of Jeshua and Kadmiel, of the children of Hodaviah, seventy and four.';
Text[41] = 'The singers: the children of Asaph, an hundred twenty and eight.';
Text[42] = 'The children of the porters: the children of Shallum, the children of Ater, the children of Talmon, the children of Akkub, the children of Hatita, the children of Shobai, [in] all an hundred thirty and nine.';

Text[44] = 'The children of Keros, the children of Siaha, the children of Padon,';

Text[58] = 'All the Nethinims, and the children of Solomon\'s servants, [were] three hundred ninety and two.';
Text[59] = 'And these [were] they which went up from Telmelah, Telharsa, Cherub, Addan, [and] Immer: but they could not shew their father\'s house, and their seed, whether they [were] of Israel:';
Text[60] = 'The children of Delaiah, the children of Tobiah, the children of Nekoda, six hundred fifty and two.';
Text[61] = 'And of the children of the priests: the children of Habaiah, the children of Koz, the children of Barzillai; which took a wife of the daughters of Barzillai the Gileadite, and was called after their name:';
Text[62] = 'These sought their register [among] those that were reckoned by genealogy, but they were not found: therefore were they, as polluted, put from the priesthood.';
Text[63] = 'And the Tirshatha said unto them, that they should not eat of the most holy things, till there stood up a priest with Urim and with Thummim.';
Text[64] = 'The whole congregation together [was] forty and two thousand three hundred [and] threescore,';
Text[65] = 'Beside their servants and their maids, of whom [there were] seven thousand three hundred thirty and seven: and [there were] among them two hundred singing men and singing women.';
Text[66] = 'Their horses [were] seven hundred thirty and six; their mules, two hundred forty and five;';
Text[67] = 'Their camels, four hundred thirty and five; [their] asses, six thousand seven hundred and twenty.';
Text[68] = 'And [some] of the chief of the fathers, when they came to the house of the LORD which [is] at Jerusalem, offered freely for the house of God to set it up in his place:';
Text[69] = 'They gave after their ability unto the treasure of the work threescore and one thousand drams of gold, and five thousand pound of silver, and one hundred priests\' garments.';
Text[70] = 'So the priests, and the Levites, and [some] of the people, and the singers, and the porters, and the Nethinims, dwelt in their cities, and all Israel in their cities.';
