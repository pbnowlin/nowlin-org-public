stringArray[17] = 'Now therefore __PNkill_every_male_1__SHkill every male</a> among the little ones, and kill every woman that hath known man by lying with __PNhim_2__SHhim</a>.__CPkill_every_male_1__PSkill every male__EE"The sword of war should spare women and children, as incapable of resisting; but the sword of justice knows no distinction, except that of guilty or not guilty, or more or less guilty. This was the execution of a righteous sentence upon a guilty nation, in which the women were the greatest criminals; and it may safely be said, that their lives were forfeited by their personal transgressions. With respect to the execution of the male infants, who cannot be supposed to have been guilty, God, the author and supporter of life, who has a right to dispose of it when and how he thinks proper, commanded it; and ""shall not the Judge of all the earth do right?"" __NAJdg/21/11\');">Jdg 21:11__NRJdg/21/12\');">12__AN"__GHhim_2__PShim__FEHeb. a male.</TD></TR>';
stringArray[18] = 'But all the women children, that have not known a man by lying with him, __PNkeep_alive_for_yourselves_1__SHkeep alive for yourselves</a>.__CPkeep_alive_for_yourselves_1__PSkeep alive for yourselves__EE"It has been groundlessly asserted, that Moses here authorised the Israelites to make concubines of the whole number of female children; and an insidious objection against his writings has been grounded upon this monstrous supposition. But the whole tenor of the law, and especially a statute recorded in __NADeu/21/10\');">Deu 21:10-14__AN, proves most decisively to the contrary. They were merely permitted to possess them as female slaves, educating them in their families, and employing them as domestics; for the laws concerning fornication, concubinage, and marriage, were in full force, and prohibited an Israelite even from marrying a captive, without delays and previous formalities; and if he afterwards divorced her, he was to set here at liberty, ""because he had humbled her."" __NALev/25/44\');">Lev 25:44__NBDeu/20/14\');">Deu 20:14__NBDeu/21/10\');">Deu 21:10-14__NB2Ch/28/8\');">2Ch 28:8-10__NBIsa/14/2\');">Isa 14:2__AN"</TD></TR>';
