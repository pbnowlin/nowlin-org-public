stringArray[23] = 'But __PNif_ye_will_1__SHif ye will</a> not do so, behold, ye have sinned against the LORD: and __PNbe_sure_your_sin_2__SHbe sure your sin</a> will find you out.__CPif_ye_will_1__PSif ye will__FFLev/26/14\');">Lev 26:14-46__NBDeu/28/15\');">Deu 28:15-68__AN__GHbe_sure_your_sin_2__PSbe sure your sin__FEIf the persons concerned prevaricated, and so imposed on men, or if they afterwards refused to fulfil their engagement, God would most certainly detect and expose their wickedness, and inflict condign punishment upon them. Of all the ways, says Dr. South, to be taken for the prevention of that great plague of mankind, Sin, there is none so rational and efficacious as to confute and baffle those motives by which men are induced to embrace it; and among all such motives, the heart of man seems to be chiefly overpowered and prevailed upon by two, viz. secrecy in committing sin, and impunity with respect to its consequences. Accordingly, Moses, in this chapter, having to deal with a company of men suspected of a base and fraudulent design, though couched under a very fair pretence, as most such designs are, endeavours to quash it in its very conception, by secretly applying himself to encounter those secret motives and arguments, which he knew were the most likely to encourage them in it. And this he does very br</TD></TR>';

stringArray[34] = 'And the children of Gad built __PNDibon_1__SHDibon</a>, and Ataroth, and __PNAroer_2__SHAroer</a>,__CPDibon_1__PSDibon__EEEusebius says that Dibon was a large town, near the river Arnon. Burckhardt says, that when he was about an hour\'s distance north of the Modjeb or Arnon, he was shown to the N. E. the ruins of Diban, the ancient Dibon, situated in the low ground of the Koura, or plains of Moab. __NANum/32/3\');">Num 32:3__NBNum/21/20\');">Num 21:20__NBNum/33/45\');">Num 33:45__NRNum/33/46\');">46__AN__GHAroer_2__PSAroer__FEAroer was situated, according to Eusebius, on a mountain on the north bank of the river Arnon. This is confirmed by Burckhardt, who says it is called Araayr, and is seated on the edge of the precipice, at the foot of which the river flows. __NADeu/2/36\');">Deu 2:36__NBIsa/17/2\');">Isa 17:2__EN';
