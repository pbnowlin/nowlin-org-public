stringArray[44] = 'Even those that were numbered of them after their families, were three thousand and two hundred.__CPRelated_Verses1_1__PSEntire Verse.__EEThe family of Merari, though smaller than either of the other families of Levi, yet had a greater number of able men than any of them; for out of 6,200 males of a month old and upwards, we find 3,200 who were neither too young nor too old for the service of the sanctuary; which was more than one-half of their whole number. In this the wisdom and providence of God appear most conspicuously; for the Merarites were charged with the heaviest part of the sanctuary, as the boards, bars, sockets, etc; and though waggons were afterwards provided for them, yet the loading and unloading of the sockets, and other things of great weight, would require much strength, both bodily and numerical. (Compare __NANum/4/36\');">Num 4:36__NRNum/4/40\');">40__AN, with __NANum/3/22\');">Num 3:22__NRNum/3/28\');">28__NRNum/3/24\');">24__AN.) Thus God ever manifests his wisdom, in fitting men for the work to which they are appointed, whether with respect to number or gifts: ?For to one is given, by the Spirit, the word of wisdom; to another the word of knowledge, by the same Spirit; to another faith, by the same Spirit; to anot</TD></TR>';
