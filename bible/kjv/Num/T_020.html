stringArray[22] = 'And the children of Israel, [even] the whole congregation, journeyed from __PNKadesh_1__SHKadesh</a>, and came unto __PNmount_Hor_2__SHmount Hor</a>.__CPKadesh_1__PSKadesh__FFNum/20/1\');">Num 20:1__NRNum/20/14\');">14__NRNum/20/16\');">16__NBNum/13/26\');">Num 13:26__NBNum/33/36\');">Num 33:36__NRNum/33/37\');">37__NBEze/47/19\');">Eze 47:19__NBEze/48/28\');">Eze 48:28__AN__GHmount_Hor_2__PSmount Hor__FEMount Hor was situated in Arabia Petræa, on the confines of Edom. It is described by Burckhardt, as being situated on the western side of a valley called Wady Mousa; in which are found the ruins of the ancient Petra, and which is two long days\' journey north-east of Accaba (on the northern point of the Elanitic gulf of the Red sea,) in the Djebel Shera, or mount Seir, and on the east side of the Araba, the valley which forms the continuation of that of the Jordan. On the summit of the mountain is the tomb of Haroun, or Aaron, which is held in great veneration by the Arabs; which agrees with the testimonies of Josephus, Eusebius, and Jerome, all persons well acquainted with these countries, who agree in proving that the sepulchre of Aaron, in mount Hor, was near Petra. When visited by Mr. Legh, it was attended by a crippled Arab hermit, about 80 years of age, who conducted them into a small white building, crowned by a cupola, that contains the tomb of Aaron. The monument is of stone, about three feet high; an</TD></TR>';
