stringArray[16] = 'And those that are to be redeemed from a month old __PNshalt_thou_redeem_1__SHshalt thou redeem</a>, __PNaccording_2__SHaccording</a> to thine estimation, for the money of five shekels, after the shekel of the sanctuary, __PNwhich_is_3__SHwhich [is]</a> twenty gerahs.__CPshalt_thou_redeem_1__PSshalt thou redeem__EE"Redemption of the firstborn is one of the rites which are still practised among the Jews. According to Leo of Modena, it is performed in the following manner:--When the child is thirty days old, the father sends for one of the descendants of Aaron: several persons being assembled on the occasion, the father brings a cup, containing several pieces of gold and silver coin. The priest then takes the child into his arms, and addressing himself to the mother, he says, ""Is this thy son?"" Mother. ""Yes."" Priest. ""Hast thou never had another child, male or female, a miscarriage, or untimely birth?"" Mother. ""No."" Priest. ""This being the case, this child, as firstborn, belongs to me."" Then turning to the father, he says, ""If it be thy desire to have this child, thou must redeem it."" Father. ""I present thee with this gold and silver for this purpose."" Priest. ""Thou dost wish, therefore, to redeem this child?"" Father. ""I do wish so to do."" The priest then turning himself to the assembly, says, ""Very well: this child, as f"__GHaccording_2__PSaccording__EFNum/3/47\');">Num 3:47__NBLev/27/2\');">Lev 27:2-7__AN__GGwhich_is_3__PSwhich is__FFExd/30/13\');">Exd 30:13__NBLev/27/25\');">Lev 27:25__NBEze/45/12\');">Eze 45:12__EN';
