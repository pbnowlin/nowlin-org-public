Text[1] = 'These [are] the journeys of the children of Israel, which went forth out of the land of Egypt with their armies under the hand of Moses and Aaron.';
Text[2] = 'And Moses wrote their goings out according to their journeys by the commandment of the LORD: and these [are] their journeys according to their goings out.';
Text[3] = 'And they departed from Rameses in the first month, on the fifteenth day of the first month; on the morrow after the passover the children of Israel went out with an high hand in the sight of all the Egyptians.';
Text[4] = 'For the Egyptians buried all [their] firstborn, which the LORD had smitten among them: upon their gods also the LORD executed judgments.';
Text[5] = 'And the children of Israel removed from Rameses, and pitched in Succoth.';
Text[6] = 'And they departed from Succoth, and pitched in Etham, which [is] in the edge of the wilderness.';
Text[7] = 'And they removed from Etham, and turned again unto Pihahiroth, which [is] before Baalzephon: and they pitched before Migdol.';
Text[8] = 'And they departed from before Pihahiroth, and passed through the midst of the sea into the wilderness, and went three days\' journey in the wilderness of Etham, and pitched in Marah.';
Text[9] = 'And they removed from Marah, and came unto Elim: and in Elim [were] twelve fountains of water, and threescore and ten palm trees; and they pitched there.';
Text[10] = 'And they removed from Elim, and encamped by the Red sea.';
Text[11] = 'And they removed from the Red sea, and encamped in the wilderness of Sin.';
Text[12] = 'And they took their journey out of the wilderness of Sin, and encamped in Dophkah.';
Text[13] = 'And they departed from Dophkah, and encamped in Alush.';
Text[14] = 'And they removed from Alush, and encamped at Rephidim, where was no water for the people to drink.';
Text[15] = 'And they departed from Rephidim, and pitched in the wilderness of Sinai.';
Text[16] = 'And they removed from the desert of Sinai, and pitched at Kibrothhattaavah.';
Text[17] = 'And they departed from Kibrothhattaavah, and encamped at Hazeroth.';
Text[18] = 'And they departed from Hazeroth, and pitched in Rithmah.';
Text[19] = 'And they departed from Rithmah, and pitched at Rimmonparez.';
Text[20] = 'And they departed from Rimmonparez, and pitched in Libnah.';
Text[21] = 'And they removed from Libnah, and pitched at Rissah.';
Text[22] = 'And they journeyed from Rissah, and pitched in Kehelathah.';
Text[23] = 'And they went from Kehelathah, and pitched in mount Shapher.';
Text[24] = 'And they removed from mount Shapher, and encamped in Haradah.';
Text[25] = 'And they removed from Haradah, and pitched in Makheloth.';
Text[26] = 'And they removed from Makheloth, and encamped at Tahath.';
Text[27] = 'And they departed from Tahath, and pitched at Tarah.';
Text[28] = 'And they removed from Tarah, and pitched in Mithcah.';
Text[29] = 'And they went from Mithcah, and pitched in Hashmonah.';
Text[30] = 'And they departed from Hashmonah, and encamped at Moseroth.';
Text[31] = 'And they departed from Moseroth, and pitched in Benejaakan.';
Text[32] = 'And they removed from Benejaakan, and encamped at Horhagidgad.';
Text[33] = 'And they went from Horhagidgad, and pitched in Jotbathah.';
Text[34] = 'And they removed from Jotbathah, and encamped at Ebronah.';
Text[35] = 'And they departed from Ebronah, and encamped at Eziongaber.';
Text[36] = 'And they removed from Eziongaber, and pitched in the wilderness of Zin, which [is] Kadesh.';
Text[37] = 'And they removed from Kadesh, and pitched in mount Hor, in the edge of the land of Edom.';
Text[38] = 'And Aaron the priest went up into mount Hor at the commandment of the LORD, and died there, in the fortieth year after the children of Israel were come out of the land of Egypt, in the first [day] of the fifth month.';
Text[39] = 'And Aaron [was] an hundred and twenty and three years old when he died in mount Hor.';
Text[40] = 'And king Arad the Canaanite, which dwelt in the south in the land of Canaan, heard of the coming of the children of Israel.';
Text[41] = 'And they departed from mount Hor, and pitched in Zalmonah.';
Text[42] = 'And they departed from Zalmonah, and pitched in Punon.';
Text[43] = 'And they departed from Punon, and pitched in Oboth.';
Text[44] = 'And they departed from Oboth, and pitched in Ijeabarim, in the border of Moab.';
Text[45] = 'And they departed from Iim, and pitched in Dibongad.';
Text[46] = 'And they removed from Dibongad, and encamped in Almondiblathaim.';
Text[47] = 'And they removed from Almondiblathaim, and pitched in the mountains of Abarim, before Nebo.';
Text[48] = 'And they departed from the mountains of Abarim, and pitched in the plains of Moab by Jordan [near] Jericho.';
Text[49] = 'And they pitched by Jordan, from Bethjesimoth [even] unto Abelshittim in the plains of Moab.';
Text[50] = 'And the LORD spake unto Moses in the plains of Moab by Jordan [near] Jericho, saying,';
Text[51] = 'Speak unto the children of Israel, and say unto them, When ye are passed over Jordan into the land of Canaan;';
Text[52] = 'Then ye shall drive out all the inhabitants of the land from before you, and destroy all their pictures, and destroy all their molten images, and quite pluck down all their high places:';
Text[53] = 'And ye shall dispossess [the inhabitants] of the land, and dwell therein: for I have given you the land to possess it.';
Text[54] = 'And ye shall divide the land by lot for an inheritance among your families: [and] to the more ye shall give the more inheritance, and to the fewer ye shall give the less inheritance: every man\'s [inheritance] shall be in the place where his lot falleth; according to the tribes of your fathers ye shall inherit.';
Text[55] = 'But if ye will not drive out the inhabitants of the land from before you; then it shall come to pass, that those which ye let remain of them [shall be] pricks in your eyes, and thorns in your sides, and shall vex you in the land wherein ye dwell.';
Text[56] = 'Moreover it shall come to pass, [that] I shall do unto you, as I thought to do unto them.';
