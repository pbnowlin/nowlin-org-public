stringArray[17] = 'And for a sacrifice of __PNpeace_1__SHpeace</a> offerings, two oxen, five rams, five he goats, five lambs of the first year: __PNthis_was_the_offering_2__SHthis [was] the offering</a> of Nahshon the son of Amminadab.__CPpeace_1__PSpeace__FFLev/3/\');">Lev 3__NB2Cr/5/19\');">2Cr 5:19-21__AN__GHthis_was_the_offering_2__PSthis was the offering__FEIt is worthy of remark, that the different tribes are represented here as bringing their offerings precisely in the same order in which they encamped about the tabernacle, (see __NANum/2/\');">Num 2__NBNum/10/\');">10__AN;) beginning at the East, then proceeding to the South, then to the West, and ending with the North, according to the course of the sun. Their order may be thus viewed: Omitted. Thus God evinces that he ?is not the author of confusion, but of peace?. (__NA1Cr/14/33\');">1Cr 14:33__AN) It is also worthy of remark, that every tribe offers the same kind of offering, and in the same quantity, to shew, that as every tribe was equally indebted to God for its support, so each should testify an equal sense of obligation. Besides, the vessels were all sacrificial vessels, and the animals were all clean animals, such as were proper for sacrifices; and therefore everything was intended to point out, that the people were to be a holy people, fully dedicated to God, and that God was to dwell among them. Thus, as the priests, altar, etc. were anointed, and the ta</TD></TR>';

stringArray[31] = 'His __PNoffering_1__SHoffering</a> [was] one silver __PNcharger_2__SHcharger</a> of the weight of an hundred and thirty [shekels], one silver __PNbowl_3__SHbowl</a> of seventy shekels, after the shekel of the sanctuary; both of them full of fine flour mingled with oil for a meat offering:__CPoffering_1__PSoffering__FFNum/7/13\');">Num 7:13__AN, etc.__GHcharger_2__PScharger__FEKäârah, in Arabic, kâran, from küâra, to be deep, a large deep dish or bowl. It appears by the metal of which this charger and bowl were made, that they were for the use of the altar of burnt offerings in the outer court; for all the vessels of the sanctuary were of gold. It was probably used for receiving the flesh of the sacrifices upon which the priests feasted, or the fine flour for the meat offerings.__GGbowl_3__PSbowl__EEMizrak, from zarak, to sprinkle, a bowl or bason, used in sprinkling the blood of the sacrifice. (__NAExd/27/3\');">Exd 27:3__AN)</TD></TR>';
