stringArray[1] = 'Now __PNKorah_1__SHKorah</a>, the son of Izhar, the son of Kohath, the son of Levi, and Dathan and Abiram, the sons of Eliab, and On, the son of Peleth, __PNsons_of_Reuben_2__SHsons of Reuben</a>, __PNtook_men_3__SHtook [men]</a>:__CPKorah_1__PSKorah__FFNum/26/9\');">Num 26:9__NRNum/26/10\');">10__NBNum/27/3\');">Num 27:3__NBExd/6/18\');">Exd 6:18__NRExd/6/21\');">21__NBJud/1/11\');">Jud 1:11__AN__GHsons_of_Reuben_2__PSsons of Reuben__EFGen/49/3\');">Gen 49:3__NRGen/49/4\');">4__NB1Ch/5/1\');">1Ch 5:1__NR1Ch/5/2\');">2__AN__GGtook_men_3__PStook men__EE"As the word men is not in the text, some read ""took counsel;"" and some ""took courage."" Houbigant renders yikkach, rebellionem fecerunt, ""they rebelled;"" which scarcely any rule of criticism can ever justify. Dr. Geddes\' translation is, ""Another insurrection was raised against Moses by Korah,"" etc. Others think that it may mean, ""behaved with insolence."" But, as Dr. A. Clarke observes, the verb wyyikkach, ""and he took"" which though at the end of the sentence in English, is the first word in Hebrew, is not in the plural, but the singular; and hence cannot be applied to the acts of all these chiefs. In every part of the Scripture, where this rebellion is referred to, it is attributed to Korah, therefore the verb here belongs to him; and the whole verse should be translated, ""Now Korah, son of Izhar, son of Kohath, son of Levi, he took even Dathan and Abiram, the sons of Eliab, and On, son of Peleth, son of Reuben, and they rose up,"" etc.; reading, with some MSS., the Samaritan, and Septuagint, ben, son, instead "</TD></TR>';

stringArray[15] = 'And Moses was __PNvery_wroth_1__SHvery wroth</a>, and said unto the LORD, __PNRespect_2__SHRespect</a> not thou their offering: __PNI_have_not_3__SHI have not</a> taken one ass from them, neither have I hurt one of them.__CPvery_wroth_1__PSvery wroth__FFNum/12/3\');">Num 12:3__NBExd/32/19\');">Exd 32:19__NBMat/5/22\');">Mat 5:22__NBMar/3/5\');">Mar 3:5__NBEph/4/26\');">Eph 4:26__AN__GHRespect_2__PSRespect__EFNum/16/6\');">Num 16:6__NRNum/16/7\');">7__NBGen/4/4\');">Gen 4:4__NRGen/4/5\');">5__NBIsa/1/10\');">Isa 1:10-15__AN__GGI_have_not_3__PSI have not__EE"Though Moses was their ruler, under God, yet, so far from oppressing them, he had not imposed the smallest tax, nor taken, as a present, so much as an ass from one of them. The common present that is now made to the great, in these countries, is a horse; but there is reason to believe, that an ass might formerly have answered the same purpose. ""If it is a visit of ceremony from a bashaw, "" says Dr. Russell, ""or other person in power, a fine horse, sometimes with furniture, or some such valuable present, is made to him at his departure."" As asses were esteemed no dishonourable beasts for the saddle, Sir. J. Chardin, in his MS., supposes, that when Samuel disclaimed having taken the ass of any one, (__NA1Sa/12/3\');">1Sa 12:3__AN,) he is to be understood of not having taken any ass for his riding. In the same light, he considers this similar declaration of Moses. His reason is ""asses being then esteemed very honourable creatures for riding on, (__NANum/22/21\');">Num 22:21__AN, __NANum/22/30\');">30__AN. __NAJdg/5/10\');">Jdg 5:10__AN. __NA2Sa/16/2\');">2Sa 16:2__AN,) as they are at this very time in Persia, being rode w"</TD></TR>';
