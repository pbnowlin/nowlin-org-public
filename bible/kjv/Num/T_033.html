<script type="text/javascript">
var stringArray = new Array();
stringArray[1] = 'These [are] the journeys of the children of Israel, which went forth out of the land of Egypt __PNwith_their_armies_1__SHwith their armies</a> __PNunder_the_hand_2__SHunder the hand</a> of Moses and Aaron.__CPwith_their_armies_1__PSwith their armies__FFExd/12/37\');">Exd 12:37__NRExd/12/51\');">51__NBExd/13/18\');">Exd 13:18__AN__GHunder_the_hand_2__PSunder the hand__EFJos/24/5\');">Jos 24:5__NB1Sa/12/8\');">1Sa 12:8__NBPsa/77/20\');">Psa 77:20__NBMic/6/4\');">Mic 6:4__EN';
stringArray[2] = 'And Moses wrote their goings out according to their __PNjourneys_1__SHjourneys</a> by the commandment of the LORD: and these [are] their journeys according to their goings out.__CPjourneys_1__PSjourneys__FFNum/9/17\');">Num 9:17-23__NBNum/10/6\');">Num 10:6__NRNum/10/13\');">13__NBDeu/1/2\');">Deu 1:2__NBDeu/10/11\');">Deu 10:11__EN';
stringArray[3] = 'And __PNthey_departed_1__SHthey departed</a> from Rameses __PNin_the_first_2__SHin the first</a> month, on the fifteenth day of the first month; on the morrow after the passover the children of Israel went out __PNwith_an_high_3__SHwith an high</a> hand in the sight of all the Egyptians.__CPthey_departed_1__PSthey departed__FFGen/47/11\');">Gen 47:11__NBExd/1/11\');">Exd 1:11__NBExd/12/37\');">Exd 12:37__AN__GHin_the_first_2__PSin the first__EFExd/12/2\');">Exd 12:2__NBExd/13/4\');">Exd 13:4__AN__GGwith_an_high_3__PSwith an high__FFExd/14/8\');">Exd 14:8__NBPsa/105/38\');">Psa 105:38__NBIsa/52/12\');">Isa 52:12__NBMic/2/13\');">Mic 2:13__EN';
stringArray[4] = 'For the Egyptians __PNburied_1__SHburied</a> all [their] firstborn, which the LORD had smitten among them: __PNupon_their_gods_2__SHupon their gods</a> also the LORD executed judgments.__CPburied_1__PSburied__FFExd/12/29\');">Exd 12:29__NRExd/12/30\');">30__NBPsa/105/36\');">Psa 105:36__AN__GHupon_their_gods_2__PSupon their gods__EFExd/12/12\');">Exd 12:12__NBExd/18/11\');">Exd 18:11__NBIsa/19/1\');">Isa 19:1__NBZep/2/11\');">Zep 2:11__NBRev/12/7\');">Rev 12:7-9__EN';
stringArray[5] = 'And the children of Israel __PNremoved_1__SHremoved</a> from __PNRameses_2__SHRameses</a>, and pitched in Succoth.__CPremoved_1__PSremoved__FFExd/12/37\');">Exd 12:37__AN__GHRameses_2__PSRameses__FEThis appears to have been the capital of the land of Goshen, and the rendezvous of the Israelites. It is placed by Jerome in the extremity of Egypt, in the Arsenoitic nome.</TD></TR>';
stringArray[6] = 'And they __PNdeparted_1__SHdeparted</a> from __PNSuccoth_2__SHSuccoth</a>, and pitched in __PNEtham_3__SHEtham</a>, which [is] in the edge of the wilderness.__CPdeparted_1__PSdeparted__FFExd/13/20\');">Exd 13:20__AN__GHSuccoth_2__PSSuccoth__FE"Supposed to be the Suchæ mentioned by Pliny and the Scenas Mandrorum, in the Antonine Itinerary. The Editor of Calmet places it at Birket el Hadji, or ""the Pilgrims\' pool,"" a few miles east of Cairo."__GGEtham_3__PSEtham__EEThis was evidently situated towards the north point of the Red sea. Calmet supposes it to be the same as Buthus or Butham, mentioned by Herodotus, who places it in Arabia, on the frontiers of Egypt.</TD></TR>';
stringArray[7] = 'And __PNthey_removed_1__SHthey removed</a> from Etham, and turned again unto Pihahiroth, which [is] before __PNBaal_zephon_2__SHBaalzephon</a>: and they pitched before Migdol.__CPthey_removed_1__PSthey removed__FFNum/33/8\');">Num 33:8__NBExd/14/2\');">Exd 14:2__NRExd/14/9\');">9__AN__GHBaal_zephon_2__PSBaal-zephon__FECalmet supposes this to be the Clysma of the Greeks, and the Kolzum of the Arabians. His learned Editor thinks the true situation of Baal-zephon was some miles more northerly than the present Suez.</TD></TR>';
stringArray[8] = 'And they __PNdeparted_1__SHdeparted</a> from before Pihahiroth, and passed through the midst of the sea into the wilderness, and went three days\' journey in the wilderness of __PNEtham_2__SHEtham</a>, and pitched in Marah.__CPdeparted_1__PSdeparted__FFExd/14/21\');">Exd 14:21__NRExd/14/22\');">22-31__NBExd/15/22\');">Exd 15:22-26__AN__GHEtham_2__PSEtham__FECalled Shur in Exodus; but Dr. Shaw says that Shur is a particular district of the wilderness of Etham.</TD></TR>';
stringArray[9] = 'And they removed from Marah, and came unto Elim: and in Elim [were] twelve fountains of water, and threescore and ten palm trees; and they pitched there.__CPRelated_Verses1_1__PSEntire Verse.__FFExd/15/27\');">Exd 15:27__EN';
stringArray[10] = 'And they removed from __PNElim_1__SHElim</a>, and encamped by the Red sea.__CPElim_1__PSElim__FFExd/16/1\');">Exd 16:1__NBExd/17/1\');">Exd 17:1__EN';
stringArray[11] = 'And they removed from the Red sea, and encamped in the wilderness of Sin.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[12] = 'And they took their journey out of the wilderness of Sin, and encamped in Dophkah.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[13] = 'And they departed from Dophkah, and encamped in Alush.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[14] = 'And they removed from Alush, and encamped at __PNRephidim_1__SHRephidim</a>, where was no water for the people to drink.__CPRephidim_1__PSRephidim__FFExd/17/1\');">Exd 17:1-8__NBExd/19/2\');">Exd 19:2__EN';
stringArray[15] = 'And they departed from Rephidim, and pitched in the wilderness of Sinai.__CPRelated_Verses1_1__PSEntire Verse.__FFExd/16/1\');">Exd 16:1__NBExd/19/1\');">Exd 19:1__NRExd/19/2\');">2__EN';
stringArray[16] = 'And __PNthey_removed_1__SHthey removed</a> from the desert of Sinai, and pitched at __PNKibroth_hattaavah_2__SHKibrothhattaavah</a>.__CPthey_removed_1__PSthey removed__FFNum/10/11\');">Num 10:11-13__NRNum/10/33\');">33__NBDeu/1/6\');">Deu 1:6__AN__GHKibroth_hattaavah_2__PSKibroth-hattaavah__FEThat is, the graves of lust. __NANum/11/4\');">Num 11:4__NRNum/11/34\');">34__EN';
stringArray[17] = 'And they departed from Kibrothhattaavah, and encamped at Hazeroth.__CPRelated_Verses1_1__PSEntire Verse.__FFNum/11/35\');">Num 11:35__EN';
stringArray[18] = 'And __PNthey_departed_1__SHthey departed</a> from Hazeroth, and pitched in __PNRithmah_2__SHRithmah</a>.__CPthey_departed_1__PSthey departed__FFNum/12/16\');">Num 12:16__AN__GHRithmah_2__PSRithmah__FERithmah was a place in the wilderness of Paran, near Kadesh Barnea; probably so called from the great number of juniper trees, as the name signifies, growing in that district.</TD></TR>';
stringArray[19] = 'And they departed from Rithmah, and pitched at __PNRimmon_parez_1__SHRimmonparez</a>.__CPRimmon_parez_1__PSRimmon-parez__EEProbably the same as Rimmon, a city of Judah and Simeon, __NAJos/15/32\');">Jos 15:32__NBJos/19/7\');">19:7__AN.</TD></TR>';
stringArray[20] = 'And they departed from Rimmonparez, and pitched in Libnah.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[21] = 'And they removed from __PNLibnah_1__SHLibnah</a>, and pitched at __PNRissah_2__SHRissah</a>.__CPLibnah_1__PSLibnah__FFDeu/1/1\');">Deu 1:1__AN; Laban.__GHRissah_2__PSRissah__FEThis is supposed, apparently with good reason, by the Editor of Calmet, to be the same with the present El Arish, a village three quarters of a league from the Mediterranean, and the last stage in Syria, on the road to Egypt.</TD></TR>';
stringArray[22] = 'And they journeyed from Rissah, and pitched in Kehelathah.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[23] = 'And they went from Kehelathah, and pitched in mount Shapher.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[24] = 'And they removed from mount __PNShapher_1__SHShapher</a>, and encamped in Haradah.__CPShapher_1__PSShapher__EEThe Editor of Calmet, who supposes the Israelites to be now in the regular track from Gaza to Egypt, is of opinion that mount Shapher is the ancient name of mount Cassius, Catjeh, or Catié, a huge mole of sand, almost surrounded by the Mediterranean, on which was built a temple to Jupiter Cassius. Thevenot states, that at the village of Catié there is a well of water unpleasant for drinking; but two miles off, another whose water is good after standing a little.</TD></TR>';
stringArray[25] = 'And they removed from Haradah, and pitched in Makheloth.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[26] = 'And they removed from Makheloth, and encamped at Tahath.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[27] = 'And they departed from Tahath, and pitched at Tarah.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[28] = 'And they removed from Tarah, and pitched in Mithcah.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[29] = 'And they went from Mithcah, and pitched in Hashmonah.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[30] = 'And they departed from Hashmonah, and encamped at __PNMoseroth_1__SHMoseroth</a>.__CPMoseroth_1__PSMoseroth__EEThis is supposed by Mr. C. Taylor, to be Ain el Mousa, (probably a corruption of Moseroth) or fountains of Moses, at the head of the western gulf of the Red sea, about seven or eight miles east from Suez, seven or eight days\' journey from Gaza, and five or six from Sinai. __NADeu/10/5\');">Deu 10:5__AN; Mosera.</TD></TR>';
stringArray[31] = 'And they departed from Moseroth, and pitched in __PNBene_jaakan_1__SHBenejaakan</a>.__CPBene_jaakan_1__PSBene-jaakan__FFGen/36/27\');">Gen 36:27__NBDeu/10/6\');">Deu 10:6__NB1Ch/1/43\');">1Ch 1:43__EN';
stringArray[32] = 'And they removed from Benejaakan, and encamped at __PNHor_hagid_gad_1__SHHorhagidgad</a>.__CPHor_hagid_gad_1__PSHor-hagid-gad__FFDeu/10/7\');">Deu 10:7__AN; Gudgodah.</TD></TR>';
stringArray[33] = 'And they went from Horhagidgad, and pitched in __PNJotbathah_1__SHJotbathah</a>.__CPJotbathah_1__PSJotbathah__EE"Mr. Taylor, who imagines the Israelites to be now in the track of the Mecca pilgrims, supposes Jotbathah, which is described as ""a land of brooks of water,"" to be Callah Nahar, a torrent, said to be good water by Dr. Shaw. __NADeu/10/7\');">Deu 10:7__AN; Jotbath."</TD></TR>';
stringArray[34] = 'And they removed from Jotbathah, and encamped at __PNEbronah_1__SHEbronah</a>.__CPEbronah_1__PSEbronah__EEProbably at Abiah Ailana, or Sat el Acaba, stations nearer Accaba.</TD></TR>';
stringArray[35] = 'And they departed from Ebronah, and encamped at __PNEzion_gaber_1__SHEziongaber</a>.__CPEzion_gaber_1__PSEzion-gaber__EEDr. Shaw places this port on the western shore of the Elanitic gulf of the Red Sea. He says it is now called Meenah el Dsahab, or the golden port, by the Arabs; because it was from this place that Solomon sent his ships to Ophir. He supposes it to be about sixty miles from Sinai; and it is probable that it was near the present Accaba, i.e., the end (of the sea). __NANum/14/25\');">Num 14:25__NBDeu/2/8\');">Deu 2:8__NB1Ki/9/26\');">1Ki 9:26__NB1Ki/22/48\');">1Ki 22:48__AN; Ezion-geber. __NA2Ch/20/36\');">2Ch 20:36__EN';
stringArray[36] = 'And they removed from Eziongaber, and pitched in __PNthe_wilderness_of_Zin_1__SHthe wilderness of Zin</a>, which [is] Kadesh.__CPthe_wilderness_of_Zin_1__PSthe wilderness of Zin__FFNum/13/21\');">Num 13:21__NBNum/20/1\');">Num 20:1__NBNum/27/14\');">Num 27:14__NBDeu/32/51\');">Deu 32:51__EN';
stringArray[37] = 'And they removed from __PNKadesh_1__SHKadesh</a>, and pitched in mount Hor, in the edge of the land of Edom.__CPKadesh_1__PSKadesh__FFNum/20/22\');">Num 20:22__NRNum/20/23\');">23__NBNum/21/4\');">Num 21:4__EN';
stringArray[38] = 'And Aaron the priest went up into mount Hor at the commandment of the LORD, and died there, in the fortieth year after the children of Israel were come out of the land of Egypt, in the first [day] of the fifth month.__CPRelated_Verses1_1__PSEntire Verse.__FFNum/20/24\');">Num 20:24-28__NBDeu/10/6\');">Deu 10:6__NBDeu/32/50\');">Deu 32:50__EN';
stringArray[39] = 'And Aaron [was] an hundred and twenty and three years old when he died in mount Hor.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[40] = 'And king Arad the Canaanite, which dwelt in the south in the land of Canaan, heard of the coming of the children of Israel.__CPRelated_Verses1_1__PSEntire Verse.__FFNum/21/1\');">Num 21:1-3__NRNum/21/4\');">4-9__EN';
stringArray[41] = 'And they departed from mount Hor, and pitched in Zalmonah.__CPRelated_Verses1_1__PSEntire Verse.__FFNum/21/4\');">Num 21:4__EN';
stringArray[42] = 'And they departed from Zalmonah, and pitched in __PNPunon_1__SHPunon</a>.__CPPunon_1__PSPunon__EECalled Phainon by Eusebius, who places it between Petra and Zoar. Perhaps it is the present Tafyle, mentioned by Burckhardt.</TD></TR>';
stringArray[43] = 'And they departed from Punon, and __PNpitched_in_Oboth_1__SHpitched in Oboth</a>.__CPpitched_in_Oboth_1__PSpitched in Oboth__FFNum/21/10\');">Num 21:10__EN';
stringArray[44] = 'And they departed from Oboth, and pitched in __PNIje_abarim_1__SHIjeabarim</a>, in the border of Moab.__CPIje_abarim_1__PSIje-abarim__EEor, heaps of Abarim. __NANum/21/11\');">Num 21:11__EN';
stringArray[45] = 'And they departed from Iim, and pitched in Dibongad.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[46] = 'And they removed from __PNDibon_gad_1__SHDibongad</a>, and encamped in __PNAlmon_diblathaim_2__SHAlmondiblathaim</a>.__CPDibon_gad_1__PSDibon-gad__FFNum/32/34\');">Num 32:34__NBIsa/15/2\');">Isa 15:2__NBJer/48/18\');">Jer 48:18__AN__GHAlmon_diblathaim_2__PSAlmon-diblathaim__EFJer/48/22\');">Jer 48:22__AN; Beth-diblathaim. __NAEze/6/14\');">Eze 6:14__AN; Diblath.</TD></TR>';
stringArray[47] = 'And they removed from Almondiblathaim, and pitched in __PNthe_mountains_1__SHthe mountains</a> of Abarim, before Nebo.__CPthe_mountains_1__PSthe mountains__EE"These mountains were a ridge of rugged hills east of Jordan, and north and west of the Arnon. Nebo, Pisgah, and Peor, were but different names of the hills of which they were composed. Eusebius and Jerome inform us, that some part of them, as one went up to Heshbon, retained the old name of Abarim in their time; and that the part called Nebo was opposite Jericho, not far from the Jordan, six miles west from Heshbon, and seven east from Livias. Dr. Shaw describes them as ""an exceeding high ridge of desolate mountains, no otherwise diversified than by a succession of naked rocks and precipices; rendered in some places the more frightful by a multiplicity of torrents, which fall on each side of them. This ridge is continued all along the eastern coast of the Dead sea."" Mount Nebo is now called Djebel Attarous; and is described as a barren mountain, the highest point in the neighbourhood, with an uneven plain on the top. Burckhardt, Travels, pp. 369, 370. __NANum/21/20\');">Num 21:20__NBDeu/32/49\');">Deu 32:49__NBDeu/34/1\');">Deu 34:1__AN"</TD></TR>';
stringArray[48] = 'And they departed from the mountains of Abarim, and pitched __PNin_the_plains_1__SHin the plains</a> of Moab by Jordan [near] Jericho.__CPin_the_plains_1__PSin the plains__FFNum/22/1\');">Num 22:1__EN';
stringArray[49] = 'And they pitched by Jordan, from __PNBeth_jesimoth_1__SHBethjesimoth</a> [even] unto __PNAbel_shittim_2__SHAbelshittim</a> in the plains of Moab.__CPBeth_jesimoth_1__PSBeth-jesimoth__EEProbably the place called Bethsimath by Eusebius, east of Jordan, and about ten miles south of Jericho. __NAJos/13/20\');">Jos 13:20__NBEze/25/9\');">Eze 25:9__AN__GHAbel_shittim_2__PSAbel-shittim__FEor, the plains of Shittim. This place, according to Josephus, (Ant. 1. iv. c. 7,  1. Bell. 1. v. c. 3,) who calls it Abela, was 60 furlongs east of Jordan. __NANum/25/1\');">Num 25:1-9__NBExd/25/5\');">Exd 25:5__NRExd/25/10\');">10__NRExd/25/23\');">23__NBJos/2/1\');">Jos 2:1__EN';
stringArray[50] = 'And the LORD spake unto Moses in the plains of Moab by Jordan [near] Jericho, saying,__CPRelated_Verses1_1__PSEntire Verse.__FFNum/33/48\');">Num 33:48__NRNum/33/49\');">49__EN';
stringArray[51] = 'Speak unto the children of Israel, and say unto them, When ye are passed over Jordan into the land of Canaan;__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/7/1\');">Deu 7:1__NBDeu/9/1\');">Deu 9:1__NBJos/3/17\');">Jos 3:17__EN';
stringArray[52] = 'Then ye shall drive out all the inhabitants of the land from before you, and destroy all their pictures, and destroy all their molten images, and quite pluck down all their high places:__CPRelated_Verses1_1__PSEntire Verse.__FFExd/23/24\');">Exd 23:24__NRExd/23/31\');">31-33__NBExd/34/12\');">Exd 34:12-17__NBDeu/7/2\');">Deu 7:2-5__NRDeu/7/25\');">25__NRDeu/7/26\');">26__NBDeu/12/2\');">Deu 12:2__NRDeu/12/3\');">3__NRDeu/12/30\');">30__NRDeu/12/31\');">31__NBDeu/20/16\');">Deu 20:16-18__NBJos/11/11\');">Jos 11:11__NRJos/11/12\');">12__NBJos/23/7\');">Jos 23:7__NBJdg/2/2\');">Jdg 2:2__EN';
stringArray[53] = 'And ye shall dispossess [the inhabitants] of the land, and dwell therein: for I have given you the land to possess it.__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/32/8\');">Deu 32:8__NBPsa/24/1\');">Psa 24:1__NRPsa/24/2\');">2__NBPsa/115/16\');">Psa 115:16__NBJer/27/5\');">Jer 27:5__NRJer/27/6\');">6__NBDan/4/17\');">Dan 4:17__NRDan/4/25\');">25__NRDan/4/32\');">32__NBMat/20/15\');">Mat 20:15__EN';
stringArray[54] = 'And __PNye_shall_divide_1__SHye shall divide</a> the land by lot for an inheritance among your families: [and] to the more ye shall __PNgive_the_more_inheritance_2__SHgive the more inheritance</a>, and to the fewer ye shall __PNgive_the_less_inheritance_3__SHgive the less inheritance</a>: every man\'s [inheritance] shall be in the place where his lot falleth; according to the tribes of your fathers ye shall inherit.__CPye_shall_divide_1__PSye shall divide__FFNum/26/53\');">Num 26:53-56__AN__GHgive_the_more_inheritance_2__PSgive the more inheritance__FEHeb. multiply his inheritance. __NANum/26/54\');">Num 26:54__AN__GGgive_the_less_inheritance_3__PSgive the less inheritance__EEHeb. diminish his inheritance in the place. __NAJos/15/1\');">Jos 15:1-12__NBJos/16/1\');">Jos 16:1-4__NBJos/17/1\');">Jos 17:1-13__NBJos/18/11\');">Jos 18:11-28__NBJos/19/1\');">Jos 19:1-48__EN';
stringArray[55] = 'But if ye will not drive out the inhabitants of the land from before you; then it shall come to pass, that those which ye let remain of them __PNshall_be_pricks_1__SH[shall be] pricks</a> in your eyes, and thorns in your sides, and shall vex you in the land wherein ye dwell.__CPshall_be_pricks_1__PSshall be pricks__FFExd/23/33\');">Exd 23:33__NBDeu/7/4\');">Deu 7:4__NRDeu/7/16\');">16__NBJos/23/12\');">Jos 23:12__NRJos/23/13\');">13__NBJdg/1/21\');">Jdg 1:21-36__NBJdg/2/3\');">Jdg 2:3__NBPsa/106/34\');">Psa 106:34-36__NBEze/28/24\');">Eze 28:24__EN';
stringArray[56] = 'Moreover it shall come to pass, [that] I shall do unto you, as I thought to do unto them.__CPRelated_Verses1_1__PSEntire Verse.__FFLev/18/28\');">Lev 18:28__NBLev/20/23\');">Lev 20:23__NBDeu/28/63\');">Deu 28:63__NBDeu/29/28\');">Deu 29:28__NBJos/23/15\');">Jos 23:15__NRJos/23/16\');">16__NB2Ch/36/17\');">2Ch 36:17-20__NBEze/33/24\');">Eze 33:24-29__NBLuk/21/23\');">Luk 21:23__NRLuk/21/24\');">24__EN';
