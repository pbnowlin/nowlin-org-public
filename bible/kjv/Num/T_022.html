stringArray[16] = 'And they came to Balaam, and said to him, Thus saith Balak the son of Zippor, __PNLet_nothing__etc__1__SHLet nothing</a>, I pray thee, hinder thee from coming unto me:__CPLet_nothing__etc__1__PSLet nothing, etc.__EEHeb. Be not thou letted from, etc.</TD></TR>';
stringArray[17] = 'For __PNI_will_promote_1__SHI will promote</a> thee unto very great honour, __PNand_I_will_do_2__SHand I will do</a> whatsoever thou sayest unto me: __PNcome_3__SHcome</a> therefore, I pray thee, __PNcurse_me_4__SHcurse me</a> this people.__CPI_will_promote_1__PSI will promote__FFNum/24/11\');">Num 24:11__NBDeu/16/9\');">Deu 16:9__NBEst/5/11\');">Est 5:11__NBEst/7/9\');">Est 7:9__NBMat/4/8\');">Mat 4:8__NRMat/4/9\');">9__NBMat/16/26\');">Mat 16:26__AN__GHand_I_will_do_2__PSand I will do__EFNum/23/2\');">Num 23:2__NRNum/23/3\');">3__NRNum/23/29\');">29__NRNum/23/30\');">30__NBMat/14/7\');">Mat 14:7__AN__GGcome_3__PScome__FFNum/22/6\');">Num 22:6__AN__GHcurse_me_4__PScurse me__FE"An erroneous opinion prevailed, both in those days and in after ages, that some men had the power, by the help of their gods, to devote, not only particular persons, but cities and whole armies, to destruction. This they are said to have done sometimes by words of imprecation; of which there was a set form among some people, which Æschines calls [diorizomenen aran ] ""the determinate curse."" Macrobius has a whole chapter on this subject. He gives us two of the ancient forms used in reference to the destruction of Carthage; the first, which was only pronounced by the dictator, or general, was to call over the protecting deities to their side, and the other to devote the city to destruction, which they were supposed to have abandoned. The Romans held, that no city would be taken till its tutelary god had forsaken it; or if it could be taken, it would be unlawful, as it would be sacrilege to lead the gods into captivity. Virgil intimates, that Troy was destroyed because Excessere omnes adytis, arisque relictis di"</TD></TR>';
