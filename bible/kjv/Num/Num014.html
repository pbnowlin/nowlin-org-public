Text[15] = 'Now [if] thou shalt kill [all] this people as one man, then the nations which have heard the fame of thee will speak, saying,';
Text[16] = 'Because the LORD was not able to bring this people into the land which he sware unto them, therefore he hath slain them in the wilderness.';
Text[17] = 'And now, I beseech thee, let the power of my Lord be great, according as thou hast spoken, saying,';
Text[18] = 'The LORD [is] longsuffering, and of great mercy, forgiving iniquity and transgression, and by no means clearing [the guilty], visiting the iniquity of the fathers upon the children unto the third and fourth [generation].';
Text[19] = 'Pardon, I beseech thee, the iniquity of this people according unto the greatness of thy mercy, and as thou hast forgiven this people, from Egypt even until now.';
Text[20] = 'And the LORD said, I have pardoned according to thy word:';
Text[21] = 'But [as] truly [as] I live, all the earth shall be filled with the glory of the LORD.';
Text[22] = 'Because all those men which have seen my glory, and my miracles, which I did in Egypt and in the wilderness, and have tempted me now these ten times, and have not hearkened to my voice;';
Text[23] = 'Surely they shall not see the land which I sware unto their fathers, neither shall any of them that provoked me see it:';
Text[24] = 'But my servant Caleb, because he had another spirit with him, and hath followed me fully, him will I bring into the land whereinto he went; and his seed shall possess it.';
Text[25] = '(Now the Amalekites and the Canaanites dwelt in the valley.) To morrow turn you, and get you into the wilderness by the way of the Red sea.';
Text[26] = 'And the LORD spake unto Moses and unto Aaron, saying,';
Text[27] = 'How long [shall I bear with] this evil congregation, which murmur against me? I have heard the murmurings of the children of Israel, which they murmur against me.';
Text[28] = 'Say unto them, [As truly as] I live, saith the LORD, as ye have spoken in mine ears, so will I do to you:';
Text[29] = 'Your carcases shall fall in this wilderness; and all that were numbered of you, according to your whole number, from twenty years old and upward, which have murmured against me,';
Text[30] = 'Doubtless ye shall not come into the land, [concerning] which I sware to make you dwell therein, save Caleb the son of Jephunneh, and Joshua the son of Nun.';
Text[31] = 'But your little ones, which ye said should be a prey, them will I bring in, and they shall know the land which ye have despised.';
Text[32] = 'But [as for] you, your carcases, they shall fall in this wilderness.';
Text[33] = 'And your children shall wander in the wilderness forty years, and bear your whoredoms, until your carcases be wasted in the wilderness.';
Text[34] = 'After the number of the days in which ye searched the land, [even] forty days, each day for a year, shall ye bear your iniquities, [even] forty years, and ye shall know my breach of promise.';
Text[35] = 'I the LORD have said, I will surely do it unto all this evil congregation, that are gathered together against me: in this wilderness they shall be consumed, and there they shall die.';
Text[36] = 'And the men, which Moses sent to search the land, who returned, and made all the congregation to murmur against him, by bringing up a slander upon the land,';
Text[37] = 'Even those men that did bring up the evil report upon the land, died by the plague before the LORD.';
