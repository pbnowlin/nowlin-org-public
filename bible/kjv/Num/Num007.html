Text[2] = 'That the princes of Israel, heads of the house of their fathers, who [were] the princes of the tribes, and were over them that were numbered, offered:';
Text[3] = 'And they brought their offering before the LORD, six covered wagons, and twelve oxen; a wagon for two of the princes, and for each one an ox: and they brought them before the tabernacle.';
Text[4] = 'And the LORD spake unto Moses, saying,';
Text[5] = 'Take [it] of them, that they may be to do the service of the tabernacle of the congregation; and thou shalt give them unto the Levites, to every man according to his service.';
Text[6] = 'And Moses took the wagons and the oxen, and gave them unto the Levites.';
Text[7] = 'Two wagons and four oxen he gave unto the sons of Gershon, according to their service:';
Text[8] = 'And four wagons and eight oxen he gave unto the sons of Merari, according unto their service, under the hand of Ithamar the son of Aaron the priest.';
Text[9] = 'But unto the sons of Kohath he gave none: because the service of the sanctuary belonging unto them [was that] they should bear upon their shoulders.';
Text[10] = 'And the princes offered for dedicating of the altar in the day that it was anointed, even the princes offered their offering before the altar.';
Text[11] = 'And the LORD said unto Moses, They shall offer their offering, each prince on his day, for the dedicating of the altar.';
Text[12] = 'And he that offered his offering the first day was Nahshon the son of Amminadab, of the tribe of Judah:';
