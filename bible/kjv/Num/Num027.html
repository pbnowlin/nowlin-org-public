Text[1] = 'Then came the daughters of Zelophehad, the son of Hepher, the son of Gilead, the son of Machir, the son of Manasseh, of the families of Manasseh the son of Joseph: and these [are] the names of his daughters; Mahlah, Noah, and Hoglah, and Milcah, and Tirzah.';

Text[6] = 'And the LORD spake unto Moses, saying,';

Text[8] = 'And thou shalt speak unto the children of Israel, saying, If a man die, and have no son, then ye shall cause his inheritance to pass unto his daughter.';
