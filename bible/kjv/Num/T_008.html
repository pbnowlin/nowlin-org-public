stringArray[13] = 'And thou shalt set the Levites before Aaron, and before his sons, and __PNoffer_them_1__SHoffer them</a> [for] an offering unto the LORD.__CPoffer_them_1__PSoffer them__EE"Wehainaphta othom tenoophath, literlly, as in __NANum/8/11\');">Num 8:11__AN, ""and thou shalt wave them for a wave-offering;"" manifestly in allusion to the ancient sacrificial rite of waving the sacrifices before the LORD; and it is probable, that some significant action, analogous to the waving of the sacrifice, was employed on this occasion; for the Levites were considered as an offering to the LORD, to whose service they were wholly dedicated. To this the apostle Paul manifestly alludes, when, in writing to the Romans, he says, (__NANum/12/1\');">Num 12:1__AN,) ""I beseech you, therefore, brethren, by the mercies of God, that ye present your bodies a living sacrifice, holy, acceptable unto God, which is your reasonable service."" __NANum/8/11\');">Num 8:11__NRNum/8/21\');">21__NBNum/18/6\');">Num 18:6__NBRom/12/1\');">Rom 12:1__NBRom/15/16\');">Rom 15:16__AN"</TD></TR>';

stringArray[15] = 'And after that shall the Levites __PNgo_in_1__SHgo in</a> to do the service of the tabernacle of the congregation: and thou shalt cleanse them, __PNand_offer_2__SHand offer</a> them [for] an offering.__CPgo_in_1__PSgo in__FFNum/8/11\');">Num 8:11__NBNum/3/23\');">Num 3:23-37__NBNum/4/3\');">Num 4:3-32__NB1Ch/23/\');">1Ch 23__AN;__NA1Ch/25/\');">25__AN;__NA1Ch/26/\');">26__AN__GHand_offer_2__PSand offer__EFNum/8/11\');">Num 8:11__NRNum/8/13\');">13__NBNum/3/12\');">Num 3:12__EN';
stringArray[16] = 'For they [are] __PNwholly_given_1__SHwholly given</a> unto me from among the children of Israel; __PNinstead_of_such_2__SHinstead of such</a> as open every womb, [even instead of] the firstborn of all the children of Israel, have I taken them unto me.__CPwholly_given_1__PSwholly given__EE"Nethunim, nethunim, ""given; given;"" The word being repeated, ""because,"" says Bp. Patrick, ""the children of Israel had devoted them to him, by laying their hands upon them, (__NANum/8/10\');">Num 8:10__AN,) and Aaron had waved them as a wave-offering to the LORD."" (__NANum/8/11\');">Num 8:11__AN.)"__GHinstead_of_such_2__PSinstead of such__FE"Houbigant, on the authority of the Samaritan, reads, ""instead of every first-born of the children of Israel, who openeth the womb."" __NANum/3/12\');">Num 3:12__NRNum/3/45\');">45__AN"</TD></TR>';
stringArray[17] = 'For __PNall_the_1__SHall the</a> firstborn of the children of Israel [are] mine, [both] man and beast: __PNon_the_day_2__SHon the day</a> that I smote every firstborn in the land of Egypt __PNI_sanctified_3__SHI sanctified</a> them for myself.__CPall_the_1__PSall the__FFNum/3/13\');">Num 3:13__NBExd/13/2\');">Exd 13:2__NRExd/13/12\');">12-15__NBLuk/2/23\');">Luk 2:23__AN__GHon_the_day_2__PSon the day__EFExd/12/29\');">Exd 12:29__NBPsa/78/51\');">Psa 78:51__NBPsa/105/36\');">Psa 105:36__NBPsa/135/8\');">Psa 135:8__NBHbr/11/28\');">Hbr 11:28__AN__GGI_sanctified_3__PSI sanctified__FFExd/13/14\');">Exd 13:14__NRExd/13/15\');">15__NBExd/29/44\');">Exd 29:44__NBLev/27/14\');">Lev 27:14__NRLev/27/15\');">15__NRLev/27/26\');">26__NBEze/20/12\');">Eze 20:12__NBJhn/10/36\');">Jhn 10:36__NBJhn/17/19\');">Jhn 17:19__NBHbr/10/29\');">Hbr 10:29__NBJam/1/18\');">Jam 1:18__EN';
stringArray[18] = 'And I have taken the Levites for all the firstborn of the children of Israel.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';

stringArray[20] = 'And Moses, and Aaron, and all the congregation of the children of Israel, did to the Levites according unto all that the LORD commanded Moses concerning the Levites, so did the children of Israel unto them.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';

stringArray[23] = 'And the LORD spake unto Moses, saying,__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[24] = 'This [is it] that [belongeth] unto the Levites: __PNfrom_twenty_1__SHfrom twenty</a> and five years old and upward they shall go in to __PNwait_upon_2__SHwait upon</a> the service of the tabernacle of the congregation:__CPfrom_twenty_1__PSfrom twenty__EEIn __NANum/4/3\');">Num 4:3__AN, the Levites are appointed to the service of the tabernacle at the age of 30 years; and in __NA1Ch/23/24\');">1Ch 23:24__AN, they are ordered to commence their work at 20 years of age. In order to reconcile this apparent discrepancy, it is to be observed, 1. At the time of which Moses speaks in __NA1Ch/4/3\');">1Ch 4:3__AN, the Levitical service was exceedingly severe, and consequently required full grown, robust men, to perform it; the age of 30 was therefore appointed as the period for commencing this service, the weightier part of which was probably there intended. 2. In this place God seems to speak of the service in a general way: hence the age of 25 is fixed. 3. In David\'s time, and afterwards, in the fixed tabernacle and temple, the laboriousness of the service no longer existed, and hence 20 years was the age appointed. __NANum/4/3\');">Num 4:3__NRNum/4/23\');">23__NB1Ch/23/3\');">1Ch 23:3__NR1Ch/23/24\');">24-27__NB1Ch/28/12\');">1Ch 28:12__NR1Ch/28/13\');">13__AN__GHwait_upon_2__PSwait upon__FEHeb. war the warfare of, etc. __NA1Cr/9/7\');">1Cr 9:7__NB2Cr/10/4\');">2Cr 10:4__NB1Ti/1/18\');">1Ti 1:18__NB1Ti/6/12\');">1Ti 6:12__NB2Ti/2/3\');">2Ti 2:3-5__EN';
stringArray[25] = 'And from the age of fifty years they shall __PNcease_waiting_upon_the_service_thereof_1__SHcease waiting upon the service [thereof]</a>, and shall serve no more:__CPcease_waiting_upon_the_service_thereof_1__PScease waiting upon the service thereof__EEHeb. return from the warfare of the service. __NANum/4/23\');">Num 4:23__NB2Ti/4/7\');">2Ti 4:7__AN; The Levites, above fifty years of age, might superintend and assist their junior brethren in the ordinary offices, and give them and the people counsel and instruction; but they were exempted from carrying the tabernacle and from other laborious services. It is remarkable, that no law was made concerning the age at which the priests should begin to officiate, and though various blemishes disqualified them for the service of the sanctuary, yet they continued their ministrations till death, if capable. On the other hand, nothing is said concerning any bodily defects or blemishes disqualifying the Levites; but the time of their service is expressly settled. Their work was far more laborious than that of the priests; it is therefore likely that the priests would not begin very early to officiate; and the wisdom and experience of age would increase, rather than diminish, their fitness for the sacred duties of their office.</TD></TR>';
