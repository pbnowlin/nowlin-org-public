stringArray[1] = 'And the LORD spake unto Moses, saying,__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[2] = 'Command the children of Israel, and say unto them, When ye come into the land of Canaan; (this __PNis_the_land_1__SH[is] the land</a> that shall fall unto you for __PNan_inheritance_2__SHan inheritance</a>, [even] the land of Canaan with the coasts thereof:)__CPis_the_land_1__PSis the land__FFNum/33/51\');">Num 33:51-53__NBGen/12/6\');">Gen 12:6__NRGen/12/7\');">7__NBGen/13/15\');">Gen 13:15-17__NBGen/15/16\');">Gen 15:16-21__NBGen/17/8\');">Gen 17:8__NBDeu/1/7\');">Deu 1:7__NRDeu/1/8\');">8__NBPsa/78/55\');">Psa 78:55__NBPsa/105/11\');">Psa 105:11__NBEze/47/14\');">Eze 47:14__NBAct/17/26\');">Act 17:26__AN__GHan_inheritance_2__PSan inheritance__EFPsa/16/5\');">Psa 16:5__NRPsa/16/6\');">6__NBJer/3/19\');">Jer 3:19__NBAct/26/18\');">Act 26:18__NBEph/1/14\');">Eph 1:14__NREph/1/18\');">18__NB1Pe/1/3\');">1Pe 1:3__NR1Pe/1/4\');">4__EN';
stringArray[3] = 'Then your __PNsouth_quarter_1__SHsouth quarter</a> shall be from the wilderness of Zin along by the coast of Edom, and your south border shall be the outmost coast of the __PNsalt_sea_eastward_2__SHsalt sea eastward</a>:__CPsouth_quarter_1__PSsouth quarter__FFExd/23/31\');">Exd 23:31__NBJos/15/1\');">Jos 15:1-12__NBEze/47/13\');">Eze 47:13__NREze/47/19\');">19-23__AN__GHsalt_sea_eastward_2__PSsalt sea eastward__FEThe lake Asphaltites, Dead sea, or Salt sea, is, according to the most authentic accounts, about 70 miles in length, and 18 in breadth. Viewing this sea from the spot where the Jordan discharges its waters into it, it takes a south-easterly direction, visible for ten or fifteen miles, when it disappears in a curve towards the east. Its surface is generally unruffled, from the hollow of the basin in which it lies scarcely admitting the free passage necessary for a strong breeze: it is, however, for the same reason, subject to whirlwinds or squalls of short duration. The mountains on each side are apparently separated by a distance of eight miles; but the expanse of water at this point has been supposed not to exceed five or six: as it advances towards the south, it evidently increases in breadth. The acrid saltness of its waters is much greater than that of the sea; and of such specific gravity that bodies will float on it that would sink in common sea-water. It is probably on this account that few fish can li</TD></TR>';
stringArray[4] = 'And your border shall turn from the south to the ascent of __PNAkrabbim_1__SHAkrabbim</a>, and pass on to __PNZin_2__SHZin</a>: and the going forth thereof shall be from the south to __PNKadesh_barnea_3__SHKadeshbarnea</a>, and shall go on to __PNHazar_addar_4__SHHazaraddar</a>, and pass on to Azmon:__CPAkrabbim_1__PSAkrabbim__FFJos/15/3\');">Jos 15:3__NBJdg/1/36\');">Jdg 1:36__AN__GHZin_2__PSZin__EFNum/34/3\');">Num 34:3__NBNum/13/21\');">Num 13:21__NBNum/20/1\');">Num 20:1__NBNum/33/36\');">Num 33:36__NRNum/33/37\');">37__AN__GGKadesh_barnea_3__PSKadesh-barnea__FFNum/13/26\');">Num 13:26__NBNum/32/8\');">Num 32:8__AN__GHHazar_addar_4__PSHazar-addar__EFJos/15/3\');">Jos 15:3__NRJos/15/4\');">4__EN';
stringArray[5] = 'And the border shall fetch a compass from Azmon unto __PNthe_river_1__SHthe river</a> of Egypt, and the goings out of it shall be at __PNthe_sea_2__SHthe sea</a>.__CPthe_river_1__PSthe river__FFGen/15/18\');">Gen 15:18__NBJos/15/4\');">Jos 15:4__NRJos/15/47\');">47__NB1Ki/8/65\');">1Ki 8:65__NBIsa/27/12\');">Isa 27:12__AN__GHthe_sea_2__PSthe sea__EFNum/34/6\');">Num 34:6__NRNum/34/7\');">7__EN';
stringArray[6] = 'And [as for] the western border, ye shall even have the great sea for a border: this shall be your west border.__CPRelated_Verses1_1__PSEntire Verse.__FFJos/1/4\');">Jos 1:4__NBJos/9/1\');">Jos 9:1__NBJos/15/12\');">Jos 15:12__NRJos/15/47\');">47__NBJos/23/4\');">Jos 23:4__NBEze/47/10\');">Eze 47:10__NREze/47/15\');">15__NREze/47/20\');">20__EN';
stringArray[7] = 'And this shall be your __PNnorth_border_1__SHnorth border</a>: from the great sea ye shall point out for you __PNmount_Hor_2__SHmount Hor</a>:__CPnorth_border_1__PSnorth border__FFNum/34/3\');">Num 34:3__NRNum/34/6\');">6__NRNum/34/9\');">9__NRNum/34/10\');">10__AN__GHmount_Hor_2__PSmount Hor__EFNum/33/37\');">Num 33:37__EN';
stringArray[8] = 'From mount Hor ye shall point out [your border] unto __PNthe_entrance_1__SHthe entrance</a> of Hamath; and the goings forth of the border shall be to Zedad:__CPthe_entrance_1__PSthe entrance__FFNum/13/21\');">Num 13:21__NBJos/13/5\');">Jos 13:5__NRJos/13/6\');">6__NB2Sa/8/9\');">2Sa 8:9__NB2Ki/14/25\');">2Ki 14:25__NBJer/39/5\');">Jer 39:5__NBEze/47/15\');">Eze 47:15-20__EN';
stringArray[9] = 'And the border shall go on to Ziphron, and the goings out of it shall be at __PNHazar_enan_1__SHHazarenan</a>: this shall be your north border.__CPHazar_enan_1__PSHazar-enan__FFEze/47/17\');">Eze 47:17__EN';
stringArray[10] = 'And ye shall point out your east border from Hazarenan to Shepham:__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[11] = 'And the coast shall go down from Shepham to __PNRiblah_1__SHRiblah</a>, on the east __PNside_2__SHside</a> of Ain; and the border shall descend, and shall reach unto the side of the __PNsea_of_Chinnereth_3__SHsea of Chinnereth</a> eastward:__CPRiblah_1__PSRiblah__FF2Ki/23/33\');">2Ki 23:33__NB2Ki/25/6\');">2Ki 25:6__NBJer/39/5\');">Jer 39:5__NRJer/39/6\');">6__NBJer/52/10\');">Jer 52:10__NRJer/52/26\');">26__NRJer/52/27\');">27__AN__GHside_2__PSside__FEHeb. shoulder.__GGsea_of_Chinnereth_3__PSsea of Chinnereth__FFDeu/3/17\');">Deu 3:17__NBJos/11/2\');">Jos 11:2__AN; Chinneroth. __NAJos/19/35\');">Jos 19:35__NBMat/14/34\');">Mat 14:34__NBLuk/5/1\');">Luk 5:1__AN; Gennesaret. __NAJhn/6/1\');">Jhn 6:1__AN; Sea of Tiberias.</TD></TR>';
stringArray[12] = 'And the border shall go down to Jordan, and the goings out of it shall be at __PNthe_salt_sea_1__SHthe salt sea</a>: this shall be your land with the coasts thereof round about.__CPthe_salt_sea_1__PSthe salt sea__FFNum/34/3\');">Num 34:3__NBGen/13/10\');">Gen 13:10__NBGen/14/3\');">Gen 14:3__NBGen/19/24\');">Gen 19:24-26__EN';
stringArray[13] = 'And Moses commanded the children of Israel, saying, __PNThis_is_the_land_1__SHThis [is] the land</a> which ye shall inherit by lot, which the LORD commanded to give unto the nine tribes, and to the half tribe:__CPThis_is_the_land_1__PSThis is the land__FFNum/34/1\');">Num 34:1__NBJos/14/1\');">Jos 14:1__NRJos/14/2\');">2__EN';
stringArray[14] = 'For the tribe of the children of Reuben according to the house of their fathers, and the tribe of the children of Gad according to the house of their fathers, have received [their inheritance]; and half the tribe of Manasseh have received their inheritance:__CPRelated_Verses1_1__PSEntire Verse.__FFNum/32/23\');">Num 32:23__NRNum/32/33\');">33__NBDeu/3/12\');">Deu 3:12-17__NBJos/13/8\');">Jos 13:8-12__NBJos/14/2\');">Jos 14:2__NRJos/14/3\');">3__EN';
stringArray[15] = 'The __PNtwo_tribes_1__SHtwo tribes</a> and the half tribe have received their inheritance __PNon_this_side_Jordan_2__SHon this side Jordan</a> [near] Jericho eastward, toward the sunrising.__CPtwo_tribes_1__PStwo tribes__EEThese two tribes inherited the dominions of Sihon and Og, the two vanquished kings of the Amorites, which extended from the Arnon to Mount Hermon. Of those counties, Moses gave to the tribe of Reuben the south-west part, which was bounded on the south by the river Arnon, on the west by Jordan, and on the north and east by the tribe of Gad. The tribe of Gad was bounded by the river Jordan and tribe of Reuben on the west, by the half tribe of Manasseh on the north, by the kingdom of the Amorites and Arabia Deserta on the East, and by the tribe of Reuben on the south. The part belonging to the tribe of Manasseh was bounded by the tribe of Gad on the south, by the sea of Galilee and part of Jordan on the west, by Hermon and Lebanon on the north, and by the mountains of Trachonitis on the east.__GHon_this_side_Jordan_2__PSon this side Jordan__EFNum/32/32\');">Num 32:32__EN';
stringArray[16] = 'And the LORD spake unto Moses, saying,__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[17] = 'These __PNare_the_names_1__SH[are] the names</a> of the men which shall divide the land unto you: __PNEleazar_2__SHEleazar</a> the priest, and __PNJoshua_3__SHJoshua</a> the son of Nun.__CPare_the_names_1__PSare the names__EE"It is worthy of remark, that Moses does not follow any order hitherto used in arranging the tribes, but places them exactly in the order in which they possessed the land, and according to their fraternal relationship. Judah is first, having the first lot, in the South (__NAJos/15/\');">Jos 15__AN); and next to him is Simeon, because his inheritance was ""within the inheritance of the children of Judah."" (__NAJos/19/1\');">Jos 19:1__AN.) Benjamin, the third, had his portion between ""Judah and the children of Joseph."" (__NAJos/18/11\');">Jos 18:11__AN.) Dan was the fourth, and his lot was westward of Benjamin. (__NAJos/19/40\');">Jos 19:40__NRJos/19/41\');">41__AN.) Manasseh and his brother Ephraim had their inheritances behind that of Benjamin. (__NAJos/16/7\');">Jos 16:7__AN.) Next these dwelt Zebulun and Issachar, (__NAJos/19/10\');">Jos 19:10-17__AN;) and then Asher and Naphtali. (__NAJos/19/24\');">Jos 19:24-32__AN.)"__GHEleazar_2__PSEleazar__EFJos/14/1\');">Jos 14:1__NBJos/19/51\');">Jos 19:51__AN__GGJoshua_3__PSJoshua__FFNum/13/8\');">Num 13:8__NRNum/13/16\');">16__EN';
stringArray[18] = 'And ye shall take one prince of every tribe, to divide the land by inheritance.__CPRelated_Verses1_1__PSEntire Verse.__FFNum/1/4\');">Num 1:4-16__EN';
