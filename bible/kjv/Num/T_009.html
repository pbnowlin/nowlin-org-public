stringArray[23] = 'At the commandment of the LORD they rested in the tents, and at the commandment of the LORD they journeyed: __PNthey_kept_1__SHthey kept</a> the charge of the LORD, at the commandment of the LORD by the hand of Moses.__CPthey_kept_1__PSthey kept__EE"__NANum/9/19\');">Num 9:19__NBGen/26/5\');">Gen 26:5__NBJos/22/3\');">Jos 22:3__NBEze/44/8\');">Eze 44:8__NBZec/3/7\');">Zec 3:7__AN; Some of the Levites may have been appointed to watch the moving of the pillar, and to give timely notice to the camp of its beginning to stir; and this is called ""keeping the charge of the LORD."" It is uncomfortable staying when God is departed, but very safe and pleasant going, when we see God go before us, and resting where he appoints us to rest."</TD></TR>';
