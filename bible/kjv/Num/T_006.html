stringArray[3] = 'He shall separate [himself] from wine and strong drink, and shall drink no vinegar of wine, or vinegar of strong drink, neither shall he drink any liquor of grapes, nor eat moist grapes, or dried.__CPRelated_Verses1_1__PSEntire Verse.__EEBesides the religious nature of this institution, it seems to have been partly of a civil and prudential use. The sobriety and temperance which the Nazarites were obliged to observe were very conducive to health. Accordingly, they were celebrated for their fair and ruddy complexion; being said to be both whiter than milk and more ruddy than rubies (__NALam/4/7\');">Lam 4:7__AN); the sure signs of a sound and healthy constitution. It may here be observed, that when God intended to raise up Samson, by his strength of body, to scourge the enemies of Israel, he ordered, that from his infancy he should drink no wine, but live by the rule of the Nazarites, because that would greatly contribute to make him strong and healthy; intending, after nature had done her utmost to form this extraordinary instrument of his providence, to supply her defect by his own supernatural power. See Jenning?s Jewish Antiquities, B. I. c. 8. __NALev/10/9\');">Lev 10:9__NBJdg/13/14\');">Jdg 13:14__NBPro/31/4\');">Pro 31:4__NRPro/31/5\');">5__NBJer/35/6\');">Jer 35:6-8__NBAmo/2/12\');">Amo 2:12__NBLuk/1/15\');">Luk 1:15__NBLuk/7/33\');">Luk 7:33__NRLuk/7/34\');">34__NBLuk/21/34\');">Luk 21:34__NBEph/5/18\');">Eph 5:18__NB1Th/5/22\');">1Th 5:22__NB1Ti/5/23\');">1Ti 5:23__EN';
