stringArray[2] = 'Command the children of Israel, that they give unto the Levites of the inheritance of their possession cities to dwell in; and ye shall give [also] unto the Levites suburbs for the cities round about them.__CPRelated_Verses1_1__PSEntire Verse.__FFLev/25/32\');">Lev 25:32__NRLev/25/33\');">33__NBJos/14/3\');">Jos 14:3__NRJos/14/4\');">4__NBJos/21/2\');">Jos 21:2-42__NBEze/45/1\');">Eze 45:1-8__NBEze/48/8\');">Eze 48:8__NREze/48/22\');">22__NB1Cr/9/10\');">1Cr 9:10-14__EN';
stringArray[3] = 'And the cities shall they have to dwell in; and the suburbs of them shall be for their cattle, and for their goods, and for all their beasts.__CPRelated_Verses1_1__PSEntire Verse.__FFJos/21/11\');">Jos 21:11__NB2Ch/11/14\');">2Ch 11:14__NBEze/45/2\');">Eze 45:2__EN';
stringArray[4] = 'And the suburbs of the cities, which ye shall give unto the Levites, [shall reach] from the wall of the city and outward a __PNthousand_cubits_1__SHthousand cubits</a> round about.__CPthousand_cubits_1__PSthousand cubits__EE"The Septuagint reads [dischilious pecheis] ""two thousand cubits,"" as in the following verse; but this reading is not acknowledged by any other ancient version, except the Coptic, nor by any of the MSS. collated by Kennicott and De Rossi. Various modes have been proposed for reconciling the accounts in these two verses, which appear in general to require full as much explanation as the text itself. The explanation of Maimonides is the only one that is intelligible, and appears perfectly satisfactory. ""The suburbs,"" says he, ""of the cities are expressed in the law to be 3,000 cubits on every side, from the wall of the city and outwards. The first 1,000 cubits are the suburbs; and the 2,000, which they measured without the suburbs, were for fields and vineyards."" The whole therefore, of the city, suburbs, fields, and vineyards, may be represented by the following diagram:-- †»»»»»»»»»»»»»»»»»»»»»»»»»»»»»»»? Ω Fields and vineyards. Ω Ω Ω Ω †»»»»»»»»»»»»»»»»»»»»? Ω Ω Ω Ω Ω Ω Ω Suburbs. Ω Ω Ω Ω Ω Ω Ω Ω †»»»»»»»»»? "</TD></TR>';
stringArray[5] = 'And ye shall measure from without the city on the east side two thousand cubits, and on the south side two thousand cubits, and on the west side two thousand cubits, and on the north side two thousand cubits; and the city [shall be] in the midst: this shall be to them the suburbs of the cities.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';

stringArray[8] = 'And the cities which ye shall give [shall be] of the __PNpossession_1__SHpossession</a> of the children of Israel: __PNfrom_them_2__SHfrom [them</a> that have] many ye shall give many; but from [them that have] few ye shall give few: every one shall give of his cities unto the Levites according to his inheritance which __PNhe_inheriteth_3__SHhe inheriteth</a>.__CPpossession_1__PSpossession__FFGen/49/7\');">Gen 49:7__NBExd/32/28\');">Exd 32:28__NRExd/32/29\');">29__NBDeu/33/8\');">Deu 33:8-11__NBJos/21/3\');">Jos 21:3__AN__GHfrom_them_2__PSfrom them__EFNum/26/54\');">Num 26:54__NBNum/33/54\');">Num 33:54__NBExd/16/18\');">Exd 16:18__NB2Cr/8/13\');">2Cr 8:13__NR2Cr/8/14\');">14__AN__GGhe_inheriteth_3__PShe inheriteth__EEHeb. they inherit.</TD></TR>';

stringArray[11] = 'Then __PNye_shall_appoint_1__SHye shall appoint</a> you cities to be cities of refuge for you; that the slayer may flee thither, which killeth any person at __PNunawares_2__SHunawares</a>.__CPye_shall_appoint_1__PSye shall appoint__EEAs the goel, or kinsman, had a right to avenge the death of his relation, by slaying the murderer wherever he found him, the appointment of these cities was a humane institution for the protection of the involuntary homicide; for they were designed only for the protection of such. __NANum/35/6\');">Num 35:6__NBJos/20/2\');">Jos 20:2__AN__GHunawares_2__PSunawares__FEHeb. by error. __NANum/35/22\');">Num 35:22__NRNum/35/23\');">23__NBExd/21/13\');">Exd 21:13__NBDeu/4/42\');">Deu 4:42__NBDeu/19/4\');">Deu 19:4__NRDeu/19/5\');">5__EN';
stringArray[12] = 'And they shall be unto you cities for refuge __PNfrom_the_avenger_1__SHfrom the avenger</a>; that the manslayer die not, __PNuntil_he_stand_2__SHuntil he stand</a> before the congregation in judgment.__CPfrom_the_avenger_1__PSfrom the avenger__FFNum/35/19\');">Num 35:19__NRNum/35/25\');">25-27__NBDeu/19/6\');">Deu 19:6__NBJos/20/3\');">Jos 20:3-6__NRJos/20/9\');">9__NB2Sa/14/7\');">2Sa 14:7__AN__GHuntil_he_stand_2__PSuntil he stand__EFNum/35/24\');">Num 35:24__NBDeu/19/11\');">Deu 19:11__NRDeu/19/12\');">12__NBJos/20/4\');">Jos 20:4-6__EN';

stringArray[16] = 'And __PNif_he_smite_1__SHif he smite</a> him with an instrument of iron, so that he die, he [is] a murderer: __PNthe_2__SHthe</a> murderer shall surely be put to death.__CPif_he_smite_1__PSif he smite__FFNum/35/22\');">Num 35:22-24__NBDeu/19/11\');">Deu 19:11-13__AN__GHthe_2__PSthe__EFNum/35/30\');">Num 35:30-33__NBGen/9/5\');">Gen 9:5__NRGen/9/6\');">6__NBExd/21/12\');">Exd 21:12-14__NBLev/24/17\');">Lev 24:17__EN';

stringArray[20] = 'But __PNif_he_thrust_1__SHif he thrust</a> him of hatred, or hurl at him __PNby_laying_2__SHby laying</a> of wait, that he die;__CPif_he_thrust_1__PSif he thrust__FFGen/4/5\');">Gen 4:5__NRGen/4/8\');">8__NB2Sa/3/27\');">2Sa 3:27__NB2Sa/13/22\');">2Sa 13:22__NR2Sa/13/28\');">28__NR2Sa/13/29\');">29__NB2Sa/20/10\');">2Sa 20:10__NB1Ki/2/5\');">1Ki 2:5__NR1Ki/2/6\');">6__NR1Ki/2/31\');">31-33__NBPro/26/24\');">Pro 26:24__NBPro/28/17\');">Pro 28:17__NBLuk/4/29\');">Luk 4:29__AN__GHby_laying_2__PSby laying__EFExd/21/14\');">Exd 21:14__NBDeu/19/11\');">Deu 19:11__NB1Sa/18/10\');">1Sa 18:10__NR1Sa/18/11\');">11__NR1Sa/18/25\');">25__NB1Sa/19/9\');">1Sa 19:9-12__NB1Sa/20/1\');">1Sa 20:1__NB1Sa/23/7\');">1Sa 23:7-9__NB1Sa/24/11\');">1Sa 24:11__NBPsa/10/7\');">Psa 10:7-10__NBPsa/11/2\');">Psa 11:2__NBPsa/35/7\');">Psa 35:7__NRPsa/35/8\');">8__NBPsa/57/4\');">Psa 57:4-6__NBPro/1/18\');">Pro 1:18__NRPro/1/19\');">19__NBMar/6/19\');">Mar 6:19__NRMar/6/24\');">24-26__NBAct/20/3\');">Act 20:3__NBAct/23/21\');">Act 23:21__EN';

stringArray[25] = 'And the congregation shall deliver the slayer out of the hand of the revenger of blood, and the congregation shall restore him to the city of his refuge, whither he was fled: and he shall __PNabide_in_it_1__SHabide in it</a> unto the death of the high priest, which was __PNanointed_2__SHanointed</a> with the holy oil.__CPabide_in_it_1__PSabide in it__FFNum/35/28\');">Num 35:28__NBJos/20/6\');">Jos 20:6__NBRom/3/24\');">Rom 3:24-26__NBEph/2/16\');">Eph 2:16-18__NBHbr/4/14\');">Hbr 4:14-16__NBHbr/7/25\');">Hbr 7:25-28__NBHbr/9/12\');">Hbr 9:12-15__NBHbr/10/19\');">Hbr 10:19-22__AN__GHanointed_2__PSanointed__EFExd/29/7\');">Exd 29:7__NBLev/4/3\');">Lev 4:3__NBLev/8/12\');">Lev 8:12__NBLev/21/10\');">Lev 21:10__EN';
stringArray[26] = 'But if the slayer shall at any time come without the border of the city of his refuge, whither he was fled;__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';

stringArray[28] = 'Because __PNhe_should_1__SHhe should</a> have remained in the city of his refuge until the death of the high priest: but __PNafter_the_death_2__SHafter the death</a> of the high priest the slayer shall return into the land of his possession.__CPhe_should_1__PShe should__FFJhn/15/4\');">Jhn 15:4-6__NBAct/11/23\');">Act 11:23__NBAct/27/31\');">Act 27:31__NBHbr/3/14\');">Hbr 3:14__NBHbr/6/4\');">Hbr 6:4-8__NBHbr/10/26\');">Hbr 10:26-30__NRHbr/10/39\');">39__AN__GHafter_the_death_2__PSafter the death__EFHbr/9/11\');">Hbr 9:11__NRHbr/9/12\');">12__NRHbr/9/15\');">15-17__EN';
stringArray[29] = 'So these [things] shall be for a statute of judgment unto you throughout your generations in all your dwellings.__CPRelated_Verses1_1__PSEntire Verse.__FFNum/27/1\');">Num 27:1__NRNum/27/11\');">11__EN';
stringArray[30] = 'Whoso killeth any person, the murderer shall be put to death by the mouth of witnesses: but one witness shall not testify against any person [to cause him] to die.__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/17/6\');">Deu 17:6__NRDeu/17/7\');">7__NBDeu/19/15\');">Deu 19:15__NBMat/18/16\');">Mat 18:16__NBJhn/8/17\');">Jhn 8:17__NRJhn/8/18\');">18__NB2Cr/13/1\');">2Cr 13:1__NB1Ti/5/19\');">1Ti 5:19__NBHbr/10/28\');">Hbr 10:28__NBRev/11/3\');">Rev 11:3__EN';
stringArray[31] = '__PNMoreover_1__SHMoreover</a> ye shall take no satisfaction for the life of a murderer, which [is] __PNguilty_of_death_2__SHguilty of death</a>: but he shall be surely put to death.__CPMoreover_1__PSMoreover__FFGen/9/5\');">Gen 9:5__NRGen/9/6\');">6__NBExd/21/14\');">Exd 21:14__NBDeu/19/11\');">Deu 19:11-13__NB2Sa/12/13\');">2Sa 12:13__NB1Ki/2/28\');">1Ki 2:28-34__NBPsa/51/14\');">Psa 51:14__AN__GHguilty_of_death_2__PSguilty of death__FEHeb. faulty to die.</TD></TR>';
stringArray[32] = 'And ye shall take no satisfaction for him that is fled to the city of his refuge, that he should come again to dwell in the land, until the death of the priest.__CPRelated_Verses1_1__PSEntire Verse.__FFAct/4/12\');">Act 4:12__NBGal/2/21\');">Gal 2:21__NBGal/3/10\');">Gal 3:10-13__NRGal/3/22\');">22__NBRev/5/9\');">Rev 5:9__AN; The region east of Jordan was nearly as long as that on the west, and therefore three cities were appointed in each division. One or other of these cities would be within half a day\'s journey of every part of the land; and as it would rarely happen that the avenger of blood would be on the spot, and none had a right to assault or detain the manslayer, at least if no malicious intention was manifest, the unhappy men would, therefore, get the start of their adversaries, and very few of them be overtaken before they gained the place of refuge. But then they must forsake their families, employments, most important interests, and dearest comforts; and they must neither loiter nor yield to weariness, nor regard difficulties, nor slacken their pace, till they had got safe within the walls of the city. The Jewish writers inform us, that to afford every facility to those who thus fled for their life, the road to these cities was always preserved in good repair; and way-post</TD></TR>';
stringArray[33] = 'So ye shall not pollute the land wherein ye [are]: for blood __PNit_defileth_1__SHit defileth</a> the land: and __PNthe_land_cannot_be_cleansed_2__SHthe land cannot be cleansed</a> of the blood that is shed therein, but by the blood of him that shed it.__CPit_defileth_1__PSit defileth__FFLev/18/25\');">Lev 18:25__NBDeu/21/1\');">Deu 21:1-8__NRDeu/21/23\');">23__NB2Ki/23/26\');">2Ki 23:26__NB2Ki/24/4\');">2Ki 24:4__NBPsa/106/28\');">Psa 106:28__NBIsa/26/21\');">Isa 26:21__NBEze/22/24\');">Eze 22:24-27__NBHsa/4/2\');">Hsa 4:2__NRHsa/4/3\');">3__NBMic/4/11\');">Mic 4:11__NBMat/23/31\');">Mat 23:31-35__NBLuk/11/50\');">Luk 11:50__NRLuk/11/51\');">51__AN__GHthe_land_cannot_be_cleansed_2__PSthe land cannot be cleansed__FEHeb. there can be no expiation for the land.</TD></TR>';
