stringArray[14] = 'Wherefore it is said __PNin_the_book_1__SHin the book</a> of the wars of the LORD, __PNWhat_he_did_2__SHWhat he did</a> in the Red sea, and in the brooks of Arnon,__CPin_the_book_1__PSin the book__FFJos/10/13\');">Jos 10:13__NB2Sa/1/18\');">2Sa 1:18__AN__GHWhat_he_did_2__PSWhat he did__FE"or, Vaheb in Suphah. The following seems to be the sense of this passage: ""From Vaheb in Suphah, and the torrents of Arnon, even the effusion of the torrents, which goeth down to the dwelling of Ar, and lieth for the boundary of Moab; even from thence to the well; (which is the well of which Jehovah spake unto Moses, Gather the people, and I will give them water. Then sang Israel this song: Spring up, O Well! Answer ye to it. The well, princes digged it; even nobles of the people digged it, by a decree, upon their borders;) and from the wilderness (or the well, as in LXX.) to Mattanah; and from Mattanah,"" etc. The whole of this, from __NANum/21/14\');">Num 21:14-20__AN, is a fragment from ""the book of the wars of Jehovah,"" probably a book of remembrances or directions written by Moses for the use of Joshua, and describes the several boundaries of the land of Moab. This rendering removes every obscurity, and obviates every difficulty."</TD></TR>';

stringArray[22] = 'Let me pass through thy land: we will not turn into the fields, or into the vineyards; we will not drink [of] the waters of the well: [but] we will go along by the king\'s [high] way, until we be past thy borders.__CPRelated_Verses1_1__PSEntire Verse.__FFNum/20/17\');">Num 20:17__EN';

stringArray[24] = 'And __PNIsrael_1__SHIsrael</a> smote him with the edge of the sword, and possessed his land from __PNArnon_2__SHArnon</a> unto Jabbok, even unto the children of Ammon: for the border of the children of Ammon [was] strong.__CPIsrael_1__PSIsrael__FFNum/32/1\');">Num 32:1-4__NRNum/32/33\');">33-42__NBDeu/2/31\');">Deu 2:31-37__NBDeu/29/7\');">Deu 29:7__NBJos/9/10\');">Jos 9:10__NBJos/12/1\');">Jos 12:1-3__NBJos/13/8\');">Jos 13:8-10__NBJos/24/8\');">Jos 24:8__NBJdg/11/21\');">Jdg 11:21-23__NBJdg/12/1\');">Jdg 12:1__NRJdg/12/2\');">2__NBJdg/21/8\');">Jdg 21:8__NBNeh/9/22\');">Neh 9:22__NBPsa/135/10\');">Psa 135:10-12__NBPsa/136/19\');">Psa 136:19__NBAmo/2/9\');">Amo 2:9__AN__GHArnon_2__PSArnon__EFNum/21/13\');">Num 21:13__NBGen/32/22\');">Gen 32:22__NBDeu/3/16\');">Deu 3:16__EN';
stringArray[25] = 'And Israel took all these cities: and Israel __PNdwelt_1__SHdwelt</a> in all the cities of the Amorites, __PNin_Heshbon_2__SHin Heshbon</a>, and in all the __PNvillages_3__SHvillages</a> thereof.__CPdwelt_1__PSdwelt__FFNum/21/31\');">Num 21:31__NBNum/32/33\');">Num 32:33-42__NBDeu/2/12\');">Deu 2:12__AN__GHin_Heshbon_2__PSin Heshbon__FEHeshbon was situated, according to Eusebius, twenty miles east of Jordan; and Jerome, who places it at the same distance, says it was, in his time, a very considerable city. It still subsists, in ruins, under the name of Heshban. __NASgs/7/4\');">Sgs 7:4__NBIsa/15/4\');">Isa 15:4__NBIsa/16/8\');">Isa 16:8__NRIsa/16/9\');">9__NBJer/48/2\');">Jer 48:2__NRJer/48/34\');">34__NRJer/48/45\');">45__AN__GGvillages_3__PSvillages__EEHeb. daughters. __NAEze/16/46\');">Eze 16:46__NREze/16/49\');">49__NREze/16/53\');">53__EN';
stringArray[26] = 'For Heshbon [was] the city of Sihon the king of the Amorites, who had fought against the former king of Moab, and taken all his land out of his hand, even unto __PNArnon_1__SHArnon</a>.__CPArnon_1__PSArnon__EEArnon is a stream which takes its rise in the mountains of Moab, and, by a north-west course, during which it receives the waters of several streams, runs into the Dead sea. It is now called Wady Modjeb, and divides the province of Pelka from that of Kerek, as it formerly divided the kingdoms of the Moabites and Amorites. Its principal source is at a short distance to the north-east of Katrane, a station of the Syrian Hadj, where it is called Seyl Sayde; and lower down it receives the name of Esseim el Kereim, or Szefye.</TD></TR>';
