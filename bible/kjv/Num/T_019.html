stringArray[1] = 'And the LORD spake unto Moses and unto Aaron, saying,__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[2] = 'This [is] __PNthe_ordinance_1__SHthe ordinance</a> of the law which the LORD hath commanded, saying, Speak unto the children of Israel, that they bring thee __PNa_red_heifer_2__SHa red heifer</a> without spot, wherein [is] __PNno_blemish_3__SHno blemish</a>, [and] __PNupon_which_4__SHupon which</a> never came yoke:__CPthe_ordinance_1__PSthe ordinance__FFNum/31/21\');">Num 31:21__NBHbr/9/10\');">Hbr 9:10__AN__GHa_red_heifer_2__PSa red heifer__FE"The following curious particulars have been remarked in this ordinance: 1. A heifer was appointed for sacrifice, in opposition to the Egyptian superstition, which held these sacred, and worshipped their goddess Isis under this form; and this appears the more likely, because males only were chosen for sacrifice. So Herodotus says, they sacrifice males, both old and young; but it is not lawful for them to offer females. 2. It was to be a red heifer, because the Egyptians sacrificed red bulls to the evil demon Typhon. 3. It was to be without spot, having no mixture of any other colour. Plutarch says, the Egyptians ""sacrifice red bulls, and select them with such scrupulous attention, that if the animal has a single black or white hair, they reckon it [athuton] unfit to be sacrificed."" 4. Without blemish. (See note on __NALev/22/21\');">Lev 22:21__AN.) 5. On which never came yoke: because an animal which had been used for a common purpose was deemed improper for sacrifice. __NANum/19/6\');">Num 19:6__NBLev/14/6\');">Lev 14:6__NBIsa/1/18\');">Isa 1:18__NBRev/1/5\');">Rev 1:5__AN"__GGno_blemish_3__PSno blemish__EESee on __NAExd/12/5\');">Exd 12:5__NBLev/22/20\');">Lev 22:20-25__NBMal/1/13\');">Mal 1:13__NRMal/1/14\');">14__NBLuk/1/35\');">Luk 1:35__NBHbr/7/26\');">Hbr 7:26__NB1Pe/1/19\');">1Pe 1:19__NB1Pe/2/22\');">1Pe 2:22__AN__GHupon_which_4__PSupon which__EFDeu/21/3\');">Deu 21:3__NB1Sa/6/7\');">1Sa 6:7__NBLam/1/14\');">Lam 1:14__NBJhn/10/17\');">Jhn 10:17__NRJhn/10/18\');">18__NBPhl/2/6\');">Phl 2:6-8__EN';

stringArray[9] = 'And a man [that is] __PNclean_1__SHclean</a> shall gather up the ashes of the heifer, and __PNlay_them_up_2__SHlay [them] up</a> without the camp in a clean place, and it shall be kept for the congregation of the children of Israel for __PNa_water_of_separation_3__SHa water of separation</a>: it [is] a purification for sin.__CPclean_1__PSclean__FFNum/19/18\');">Num 19:18__NBNum/9/13\');">Num 9:13__NB2Cr/5/21\');">2Cr 5:21__NBHbr/7/26\');">Hbr 7:26__NBHbr/9/13\');">Hbr 9:13__AN__GHlay_them_up_2__PSlay them up__EFNum/19/17\');">Num 19:17__AN__GGa_water_of_separation_3__PSa water of separation__EE"That is, water prepared by being mixed with the ashes of the heifer, and set apart for the special purpose of being sprinkled on those who had contracted any legal defilement. To this rite the apostle Paul, in his epistle to the Hebrews. (__NAHbr/9/13\');">Hbr 9:13__AN, __NAHbr/9/14\');">14__AN,) pointedly alludes: ""For if,"" says he, ""the blood of bulls and of goats,"" alluding, probably, to the sin-offerings and the scape-goat, ""and the ashes of a heifer sprinkling the unclean, sanctifieth to the purifying of the flesh; how much more shall the blood of Christ, who, through the eternal Spirit, offered himself without spot unto God, purge your conscience from dead works to serve the living God."" __NANum/19/13\');">Num 19:13__NRNum/19/20\');">20__NRNum/19/21\');">21__NBNum/6/12\');">Num 6:12__NBNum/31/23\');">Num 31:23__NRNum/31/24\');">24__NBLev/15/20\');">Lev 15:20__NBZec/13/1\');">Zec 13:1__NB2Cr/7/1\');">2Cr 7:1__AN"</TD></TR>';
