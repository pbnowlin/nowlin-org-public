stringArray[11] = 'And the king of Israel answered and said, Tell [him], __PNLet_not_him__etc__1__SHLet not him</a> that girdeth on [his __PNharness_2__SHharness</a>] boast himself as he that putteth it off.__CPLet_not_him__etc__1__PSLet not him, etc.__EE"This was no doubt a proverbial mode of expression. Jonathan renders it: ""Let not him who girds himself, and goes down to battle, boast as one who has conquered and returned from it."" __NA1Sa/14/6\');">1Sa 14:6__NR1Sa/14/12\');">12__NR1Sa/14/13\');">13__NB1Sa/17/44\');">1Sa 17:44-47__NBPro/27/1\');">Pro 27:1__NBEcc/9/11\');">Ecc 9:11__NBIsa/10/15\');">Isa 10:15__NRIsa/10/16\');">16__NBMat/26/33\');">Mat 26:33-35__NRMat/26/75\');">75__AN"__GHharness_2__PSharness__FEThe word harness is an obsolete word for armour, derived from the French harnois; see __NAExd/13/18\');">Exd 13:18__AN.</TD></TR>';
stringArray[12] = 'And it came to pass, when [Benhadad] heard this __PNmessage_1__SHmessage</a>, as he [was] __PNdrinking_2__SHdrinking</a>, he and the kings in the __PNpavilions_3__SHpavilions</a>, that he said unto his servants, __PNSet_yourselves_in_array__And_they_set__etc__4__SHSet [yourselves in array]. And they set</a> [themselves in array] against the city.__CPmessage_1__PSmessage__EEHeb. word__GHdrinking_2__PSdrinking__EF1Ki/20/16\');">1Ki 20:16__NB1Ki/16/9\');">1Ki 16:9__NB1Sa/25/36\');">1Sa 25:36__NB2Sa/13/28\');">2Sa 13:28__NBPro/31/4\');">Pro 31:4__NRPro/31/5\');">5__NBDan/5/2\');">Dan 5:2__NRDan/5/30\');">30__NBLuk/21/34\');">Luk 21:34__NBEph/5/18\');">Eph 5:18__AN__GGpavilions_3__PSpavilions__EE"or, tents. That persons of regal dignity regaled themselves in this manner, we may learn from Dr. Chandler, who, when he went to visit the Aga of Suki, after his return from hawking, found him vexed and tired; and ""a couch was prepared from him beneath a shed made against a cottage, and covered with green boughs to keep off the sun. He entered as we were standing by, and fell down on it to sleep, without taking any notice of us."" __NAJer/43/10\');">Jer 43:10__AN"__GHSet_yourselves_in_array__And_they_set__etc__4__PSSet yourselves in array. And they set, etc.__FEor, Place the engines. And they placed engines.</TD></TR>';

stringArray[15] = 'Then he numbered the young men of the princes of the provinces, and they were __PNtwo_hundred_1__SHtwo hundred</a> and thirty two: and after them he numbered all the people, [even] all the children of Israel, [being] __PNseven_thousand_2__SHseven thousand</a>.__CPtwo_hundred_1__PStwo hundred__FFJdg/7/7\');">Jdg 7:7__NRJdg/7/16\');">16__NB1Sa/14/6\');">1Sa 14:6__NB2Ch/14/11\');">2Ch 14:11__AN__GHseven_thousand_2__PSseven thousand__EF1Ki/19/18\');">1Ki 19:18__NB1Sa/14/2\');">1Sa 14:2__NB2Ki/13/7\');">2Ki 13:7__NBPsa/106/40\');">Psa 106:40-43__EN';
stringArray[16] = 'And they went out at noon. But __PNBen_hadad_1__SHBenhadad</a> [was] drinking himself drunk in the pavilions, he and the kings, __PNthe_thirty_2__SHthe thirty</a> and two kings that helped him.__CPBen_hadad_1__PSBen-hadad__FF1Ki/20/11\');">1Ki 20:11__NR1Ki/20/12\');">12__NB1Ki/16/7\');">1Ki 16:7__NBPro/23/29\');">Pro 23:29-32__NBEcc/10/16\');">Ecc 10:16__NREcc/10/17\');">17__NBHsa/4/11\');">Hsa 4:11__AN__GHthe_thirty_2__PSthe thirty__EFIsa/54/15\');">Isa 54:15__AN; The Syrians, the besiegers, had their directions from a drunken king, who gave orders over his cups, while he was drinking at noon. Drunkenness is a sin which is most detestable in all, but more so in a king than in a private individual, inasmuch as the greater weight a man\'s situation carries, whether from accumulated riches, family connections, hereditary authority, or invested command, so is the influence which his vices must have on those around him. Perhaps it may be said, from past experience, that drunkenness, which is a most heinous sin in the sight of God, may be charged on those who indulge only now and then in that which may eventually lead them into drunkenness; for they shut their eyes against the most palpable facts, and rather than give up the paltry gratification of a debauch, involve thousands by their example to positive harm. Benhadad\'s drunkenness was the forerunner of his fall. Belshazzar also, we read, drank wine with his princes, his wives, and his concubines, and praised the</TD></TR>';
stringArray[17] = 'And the young men of the princes of the provinces went out first; and Benhadad sent out, and they told him, saying, There are men come out of Samaria.__CPRelated_Verses1_1__PSEntire Verse.__FF1Ki/20/14\');">1Ki 20:14__NR1Ki/20/15\');">15__NR1Ki/20/19\');">19__EN';

stringArray[34] = 'And [Benhadad] said unto him, __PNThe_cities_1__SHThe cities</a>, which my father took from thy father, I will restore; and thou shalt make streets for thee in Damascus, as my father made in Samaria. Then [said Ahab], I will send thee away with this covenant. __PNSo_he_made_a_covenant_2__SHSo he made a covenant</a> with him, and sent him away.__CPThe_cities_1__PSThe cities__FF1Ki/15/20\');">1Ki 15:20__NB2Ch/16/4\');">2Ch 16:4__AN__GHSo_he_made_a_covenant_2__PSSo he made a covenant__FE"One of the conditions of this covenant, we learn, was, that Ahab should have ""streets (chutzoth) in Damascus;"" a proposal better relished by Ahab then understood by the generality of commentators. This, however, is well illustrated by Mr. Harmer, from William of Tyre, the great historian of the Crusades; from whom it appears that it was customary to give those nations which were engaged in them, churches, streets, and great jurisdiction therein, in those places which they assisted to conquer. The Genoese and Venetians had each a street in Acon, or Acre, in which they had their own jurisdiction, with liberty to have an oven, mill, baths, weights, and measures, etc. __NA1Ki/20/42\');">1Ki 20:42__NB1Ki/22/31\');">1Ki 22:31__NB2Ch/18/30\');">2Ch 18:30__NBIsa/8/12\');">Isa 8:12__NBIsa/26/10\');">Isa 26:10__AN"</TD></TR>';
