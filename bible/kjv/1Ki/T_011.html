stringArray[18] = 'And they arose out of __PNMidian_1__SHMidian</a>, and came to __PNParan_2__SHParan</a>: and they took men with them out of Paran, and they came to Egypt, unto Pharaoh king of Egypt; which gave him an house, and appointed him victuals, and gave him land.__CPMidian_1__PSMidian__EEProbably not the Midian east of the Red Sea, to which Moses fled, (__NAExd/2/15\');">Exd 2:15__AN, etc.) but the Midian east of the Dead Sea, and south of Moab. These Midianites, whose daughters seduced the Israelites to commit idolatry (__NANum/22/4\');">Num 22:4__AN, __NANum/22/7\');">7__NBNum/25/15\');">25:15__NBNum/31/2\');">31:2__AN, etc.) were descendants of Midian, son of Abraham, (__NAGen/25/2\');">Gen 25:2__AN.) Their capital city was called Midian, and its remains were to be seen in the time of Eusebius and Jerome: it was situated on the Arnon, south of the city Ar, or Areopolis. __NAGen/25/2\');">Gen 25:2__NRGen/25/4\');">4__NBNum/22/4\');">Num 22:4__NBNum/25/6\');">Num 25:6__NRNum/25/14\');">14__NRNum/25/18\');">18__AN__GHParan_2__PSParan__FEProbably the city of Paran, or the district around it, situated in the south of Idumea, and according to Eusebius, three days\' journey east from Elah or Elath, at the head of the eastern branch, or Elamitic gulf of the Red Sea. __NAGen/14/6\');">Gen 14:6__NBGen/21/21\');">Gen 21:21__NBNum/10/12\');">Num 10:12__NBDeu/1/1\');">Deu 1:1__NBDeu/33/2\');">Deu 33:2__NBHab/3/3\');">Hab 3:3__EN';

stringArray[24] = 'And he gathered men unto him, and became captain over a band, when David slew them [of Zobah]: and they went __PNto_Damascus_1__SHto Damascus</a>, and dwelt therein, and reigned __PNin_Damascus_2__SHin Damascus</a>.__CPto_Damascus_1__PSto Damascus__FF1Ki/19/15\');">1Ki 19:15__NB1Ki/20/34\');">1Ki 20:34__NBGen/14/15\');">Gen 14:15__NBAct/9/2\');">Act 9:2__AN__GHin_Damascus_2__PSin Damascus__FEDamascus, called also Damesk, but generally El Sham, by the Arabs, is situated in a delightful plain, well watered by the Barrada, at the eastern foot of Antilibanus, being surrounded by the hills in the form of a triumphal arch, 136 miles N. of Jerusalem, 195 S. of Antioch, and 276 S. S. W. of Diarbekir. It is a city of the highest antiquity, being at least as ancient as the time of Abraham: it has been often captured, and several times demolished, but has always risen to splendour and dignity. The modern town is described by Maundrell as of a long, straight figure, it ends pointing nearly N. E. and S. W. It is very slender in the middle, but swells bigger at each end, especially at that to the N. E. According to Niebuhr, the walls are something less than a league and half in circumference; and the population is estimated at from 100,000 to 150,000</TD></TR>';
