stringArray[45] = 'And Zadok the priest and Nathan the prophet have anointed him king in __PNGihon_1__SHGihon</a>: and they are come up from thence rejoicing, so that __PNthe_city_2__SHthe city</a> rang again. __PNThis_is_3__SHThis [is]</a> the noise that ye have heard.__CPGihon_1__PSGihon__EE"This was a fountain on the west of Jerusalem, (consequently in an opposite direction to En-rogel on the east, where Adonijah was proclaimed king,) of which there were two pools, an upper and a lower. (__NA2Ch/32/30\');">2Ch 32:30__AN.) There is a large square cistern in the ravine west of the city, mentioned by Dr. Richardson as a little to the south of the Jaffa gate, which Dr. Pococke describes as a basin about 250 paces long and 100 broad. It is commonly called the pool of Bathsheba, but seems to be the lower pool of Gihon. ""Nearly a mile to the N.N.W. is the pool of Gihon, which I suppose to be the upper pool. It is a very large basin, and, if I mistake not, is cut down about ten feet into the rock, there being a way down to it by steps. It was almost dry at that time, and seems designed to receive the rain waters which come from the hills about it. There is a canal from the pool to the city, which is uncovered part of the way, and, it is said, goes to the pool in the streets near the holy sepulchre. The fountain of Gihon arose"__GHthe_city_2__PSthe city__EF1Ki/1/40\');">1Ki 1:40__NB1Sa/4/5\');">1Sa 4:5__NBEzr/3/13\');">Ezr 3:13__AN__GGThis_is_3__PSThis is__FF1Ki/14/6\');">1Ki 14:6__NB1Sa/28/14\');">1Sa 28:14__NBDan/5/26\');">Dan 5:26-28__EN';
