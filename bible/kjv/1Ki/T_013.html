stringArray[28] = 'And he went and found his carcase cast in the way, and the ass and the lion standing by the carcase: __PNthe_lion_had_1__SHthe lion had</a> not eaten the carcase, nor __PNtorn_2__SHtorn</a> the ass.__CPthe_lion_had_1__PSthe lion had__EE"All here was supernatural. The lion, though he had killed the man, yet, contrary to his nature, did not devour him, nor tear the ass, nor meddle with the travellers that passed by; while the ass stood quietly by, not fearing the lion, nor betaking himself to flight: both stood as guardians of the fallen prophet, till this extraordinary intelligence was carried into the city which rendered the miracle the more illustrious and plainly shewed that this event did not happen by chance. This concatenation of miracles marked the death of the man of God as a Divine rebuke for his disobedience in eating bread at idolatrous Beth-el; and here we see, as in various other cases, that ""often judgment begins at the house of God."" The true prophet, for suffering himself to be seduced by the old prophet, and for receiving that as a revelation from God which was opposed to the revelation which himself had received, and which was confirmed by so many miracles, is slain by a lion, and his body deprived of the burial of his fathe"__GHtorn_2__PStorn__FEHeb. broken.</TD></TR>';
