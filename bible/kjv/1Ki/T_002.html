stringArray[9] = 'Now therefore __PNhold_him_1__SHhold him</a> not guiltless: for thou [art] a __PNwise_2__SHwise</a> man, and knowest what thou oughtest to do unto him; but __PNhis_3__SHhis</a> hoar head bring thou down to the grave __PNwith_4__SHwith</a> blood.__CPhold_him_1__PShold him__EE"Do not consider him as an innocent man; for, as thou art a wise man, and knowest how to treat such persons, treat him as he deserves; only, as I have sworn to him that I would not put him to death, ""bring not his hoar head down to the grave with blood."" So Solomon understood David; for, after he had commanded Joab to be slain, in obedience to his father, he sent for Shimei, and knowing he ought to be well watched, he confined him to Jerusalem for the rest of his life: and so it appears David should be understood; for the negative particle lo, in the former clause, ""hold him not guiltless,"" should be repeated in the latter clause, though not expressed; instances of which frequently occur in the Hebrew Scriptures. (See __NAJdg/5/30\');">Jdg 5:30__AN. __NA1Sa/2/3\');">1Sa 2:3__AN. __NAPsa/1/5\');">Psa 1:5__NBPsa/9/18\');">9:18__NBPsa/38/1\');">38:1__NBPsa/75/5\');">75:5__AN. __NAPro/5/16\');">Pro 5:16__NBPro/24/12\');">24:12__AN, etc.) This is the view taken of the subject by Dr. Kennicott, and it seems the best and most correct mode of interpreting the text. __NAExd/20/7\');">Exd 20:7__NBExd/22/28\');">Exd 22:28__NBJob/9/28\');">Job 9:28__AN"__GHwise_2__PSwise__EF1Ki/3/12\');">1Ki 3:12__NR1Ki/3/28\');">28__AN__GGhis_3__PShis__FF1Ki/2/6\');">1Ki 2:6__NBGen/42/38\');">Gen 42:38__NBGen/44/31\');">Gen 44:31__AN__GHwith_4__PSwith__EFNum/32/23\');">Num 32:23__EN';

stringArray[36] = 'And the king sent and called for __PNShimei_1__SHShimei</a>, and said unto him, __PNBuild_2__SHBuild</a> thee an house in Jerusalem, and dwell there, and go not forth thence any whither.__CPShimei_1__PSShimei__FF1Ki/2/8\');">1Ki 2:8__NR1Ki/2/9\');">9__NB2Sa/16/5\');">2Sa 16:5-9__NBPro/20/8\');">Pro 20:8__NRPro/20/26\');">26__AN__GHBuild_2__PSBuild__FENo doubt Solomon suspected that Shimei\'s influence would be dangerous upon his own estate and among his numerous dependents in different parts of the land; and therefore he proposed to him, as the condition of his indemnity for former crimes, that he should live in Jerusalem under his eye, and by no means remove thence. These terms Shimei readily agreed to, and solemnly swore to observe them; and for three years he lived unmolested and in affluence. But growing secure, in contempt of Solomon\'s authority and of the oath of God, upon an unnecessary business he took a journey, which according to his own engagement forfeited his life. Thus the LORD left him to be infatuated, that due punishment might be inflicted upon him; in order that every ringleader of opposition to Solomon\'s kingdom might be crushed, and others be intimidated by their examples. Solomon\'s throne by the death of this man was established in peace, and became a type of the Redeemer\'s kingdom of peace and righteousness.--SCOTT. __NA1Ki/1/53\');">1Ki 1:53__NB2Sa/14/2\');">2Sa 14:2__EN';
