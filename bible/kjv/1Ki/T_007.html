stringArray[6] = 'And he made a porch of pillars; the length thereof [was] fifty cubits, and the breadth thereof thirty cubits: and the porch [was] __PNbefore_them_1__SHbefore them</a>: and the [other] pillars and the thick beam [were] before them.__CPbefore_them_1__PSbefore them__EEor, according to them. before them. or, according to them.</TD></TR>';
stringArray[7] = 'Then he made __PNa_porch_1__SHa porch</a> __PNfor_the_throne_2__SHfor the throne</a> where he might judge, [even] the porch __PNof_judgment_3__SHof judgment</a>: and [it was] covered with cedar __PNfrom_one_side_of_the_floor_to_the_other_4__SHfrom one side of the floor to the other</a>.__CPa_porch_1__PSa porch__FF1Ki/6/3\');">1Ki 6:3__AN__GHfor_the_throne_2__PSfor the throne__EF1Ki/10/18\');">1Ki 10:18-20__NBPsa/122/5\');">Psa 122:5__NBIsa/9/7\');">Isa 9:7__AN__GGof_judgment_3__PSof judgment__FF1Ki/3/9\');">1Ki 3:9__NR1Ki/3/28\');">28__NBPro/20/8\');">Pro 20:8__AN__GHfrom_one_side_of_the_floor_to_the_other_4__PSfrom one side of the floor to the other__FEHeb. from floor to floor.</TD></TR>';
stringArray[8] = 'And his house where he dwelt [had] __PNanother_court_1__SHanother court</a> within the porch, [which] was of the like work. Solomon made also __PNan_house_2__SHan house</a> for Pharaoh\'s daughter, whom he had taken [to wife], like unto this porch.__CPanother_court_1__PSanother court__FF2Ki/20/4\');">2Ki 20:4__AN__GHan_house_2__PSan house__EF1Ki/3/1\');">1Ki 3:1__NB1Ki/9/24\');">1Ki 9:24__NB2Ch/8/11\');">2Ch 8:11__EN';
stringArray[9] = 'All these [were of] __PNcostly_stones_1__SHcostly stones</a>, according to the measures of hewed stones, sawed with saws, within and without, even from the foundation unto the coping, and [so] on the outside toward the great court.__CPcostly_stones_1__PScostly stones__FF1Ki/7/10\');">1Ki 7:10__NR1Ki/7/11\');">11__NB1Ki/5/17\');">1Ki 5:17__EN';
stringArray[10] = 'And __PNthe_foundation_1__SHthe foundation</a> [was of] costly stones, even great stones, __PNstones_of_ten_cubits_2__SHstones of ten cubits</a>, and stones of eight cubits.__CPthe_foundation_1__PSthe foundation__FFIsa/28/16\');">Isa 28:16__NBIsa/54/11\');">Isa 54:11__NB1Cr/3/10\');">1Cr 3:10__NR1Cr/3/11\');">11__NBRev/21/19\');">Rev 21:19__NRRev/21/20\');">20__AN__GHstones_of_ten_cubits_2__PSstones of ten cubits__FE"Reckoning the cubit at 21 inches, the ten cubits are 17 feet and a half, and the eight cubits are 14 feet. The magnitude of these stones was certainly extraordinary; but let us hear M. Volney, and our surprise will no longer be fixed on these stones, but transferred from Solomon\'s house to the ruins of Balbec: ""What is still more astonishing is the enormous stones which compose the sloping wall. To the west, the second layer is formed of stones which are from 28 to 35 feet long, by about 9 in height. Over this layer, at the north-west angle, there are three stones, which alone occupy a space of 175 feet and a half; viz. the first, 58 feet 7 inches; the second, 58 feet 11 inches; and the third, exactly 58 feet; and each of these is 12 feet thick. These stones are of white granite, with large shining flakes, like gypsum: there is a quarry of this kind of stone under the whole city, and another in the adjacent mountains, which is open in several places. On the right, as we approach the city, there is still lying"</TD></TR>';
stringArray[11] = 'And above [were] costly stones, after the measures of hewed stones, and cedars.__CPRelated_Verses1_1__PSEntire Verse.__FFEph/2/20\');">Eph 2:20-22__NB1Pe/2/5\');">1Pe 2:5__EN';

stringArray[13] = 'And king Solomon sent and fetched __PNHiram_1__SHHiram</a> out of Tyre.__CPHiram_1__PSHiram__FF1Ki/7/40\');">1Ki 7:40__NB2Ch/2/13\');">2Ch 2:13__NB2Ch/4/11\');">2Ch 4:11__AN; Huram</TD></TR>';
stringArray[14] = 'He [was] __PNa_widow_s_son_1__SHa widow\'s son</a> of the tribe of __PNNaphtali_2__SHNaphtali</a>, and __PNhis_father_3__SHhis father</a> [was] a man of Tyre, a worker in brass: and __PNhe_was_filled_4__SHhe was filled</a> with wisdom, and understanding, and cunning to work all works in brass. And he came to king Solomon, and wrought all his work.__CPa_widow_s_son_1__PSa widow\'s son__EE"Heb. the son of a widow woman. tribe. The mother of Hiram (not the Tyrian king mentioned before, but an intelligent coppersmith, of Jewish extraction by his mother\'s side) in Chronicles, is said to have been of ""the daughters of Dan;"" and she might have been of Naphtali by her father, and of Dan by her mother; or she might originally be of the tribe of Dan, and have been first married to a man of the tribe of Naphtali; and, in either case, she might be indifferently called ""of the tribe of Naphtali,"" or of ""the daughters of Dan."""__GHNaphtali_2__PSNaphtali__EF2Ch/2/14\');">2Ch 2:14__AN__GGhis_father_3__PShis father__FF2Ch/4/16\');">2Ch 4:16__AN__GHhe_was_filled_4__PShe was filled__EFExd/31/2\');">Exd 31:2-6__NBExd/35/30\');">Exd 35:30-35__NBExd/36/1\');">Exd 36:1__NRExd/36/2\');">2__NRExd/36/8\');">8__NBIsa/28/26\');">Isa 28:26__EN';
stringArray[15] = 'For he __PNcast_1__SHcast</a> __PNtwo_pillars_2__SHtwo pillars</a> of brass, of __PNeighteen_cubits_3__SHeighteen cubits</a> high apiece: and a line of twelve cubits did compass either of them about.__CPcast_1__PScast__EEHeb. fashioned__GHtwo_pillars_2__PStwo pillars__EF1Ki/7/21\');">1Ki 7:21__NB2Ki/25/16\');">2Ki 25:16__NR2Ki/25/17\');">17__NB2Ch/3/15\');">2Ch 3:15-17__NB2Ch/4/12\');">2Ch 4:12-22__NBJer/52/21\');">Jer 52:21-23__AN__GGeighteen_cubits_3__PSeighteen cubits__EE"That is, nearly thirty feet, English measure. But in the parallel place in Chronicles, these pillars are said to thirty-five cubits high. Tremellius reconciles this difference by observing, that the common cubit was but one-half of the cubit of the sanctuary; so that eighteen of the one would make thirty-six of the other; from which, if we deduct one cubit for the base, there will remain thirty-five. Notwithstanding the names of these pillars, they seem to have supported no part of the building, and appear to have been formed for ornament; and were no doubt also emblematical. The right pillar was called Jachin, which signifies, ""He will establish;"" while that on the left was named Boaz, ""In it is strength."" Some think they were intended for memorials of the pillars and cloud of fire, which led Israel through the wilderness; but Henry supposes them designed for memorandums to the priests and others that came to worship at God\'s door. 1st. To depend upon God only, and not upon any sufficiency of their own, for "</TD></TR>';

stringArray[25] = 'It stood upon twelve oxen, three looking toward the north, and three looking toward the west, and three looking toward the south, and three looking toward the east: and the sea [was set] above upon them, and all their hinder parts [were] inward.__CPRelated_Verses1_1__PSEntire Verse.__FF2Ch/4/4\');">2Ch 4:4__NR2Ch/4/5\');">5__NBJer/52/20\');">Jer 52:20__NBEze/1/10\');">Eze 1:10__NBMat/28/19\');">Mat 28:19__NBMar/16/15\');">Mar 16:15__NRMar/16/16\');">16__NBLuk/24/47\');">Luk 24:47__NB1Cr/9/9\');">1Cr 9:9__NBRev/4/6\');">Rev 4:6__NRRev/4/7\');">7__EN';
stringArray[26] = 'And it [was] __PNan_hand_breadth_1__SHan hand breadth</a> thick, and the brim thereof was wrought like the brim of a cup, __PNwith_flowers_2__SHwith flowers</a> of lilies: __PNit_contained_3__SHit contained</a> __PNtwo_thousand_4__SHtwo thousand</a> baths.__CPan_hand_breadth_1__PSan hand breadth__FFJer/52/21\');">Jer 52:21__AN__GHwith_flowers_2__PSwith flowers__EF1Ki/7/19\');">1Ki 7:19__NB1Ki/6/18\');">1Ki 6:18__NR1Ki/6/32\');">32__NR1Ki/6/35\');">35__AN__GGit_contained_3__PSit contained__EEThis immense laver, called a sea from it magnitude, held, at a moderate computation, 16,000 gallons. Besides this great brazen laver, there were in the temple ten lavers of brass of a less size, which moved on wheels, and were ornamented with the figures of various animals, having, probably, always some relation to the cherubim. These lavers were to hold water for the use of the priests in their sacred office, particularly to wash the victims that were to be offered as a burnt offering, as we learn from __NA2Ch/4/6\');">2Ch 4:6__AN; but the brazen sea was for the priests to wash in. The knops are supposed to have been in the form of an ox\'s head, (__NA2Ch/4/3\');">2Ch 4:3__AN;) and some think the water flowed out at their mouths.__GHtwo_thousand_4__PStwo thousand__EF1Ki/7/38\');">1Ki 7:38__NB2Ch/4/5\');">2Ch 4:5__NBEze/45/14\');">Eze 45:14__EN';
stringArray[27] = 'And he made __PNten_bases_1__SHten bases</a> of brass; four cubits [was] the length of one base, and four cubits the breadth thereof, and three cubits the height of it.__CPten_bases_1__PSten bases__EEThese highly ornamental bases appear to have been square stands, or immense pedestals, for the purpose of supporting the lavers. __NA2Ki/25/13\');">2Ki 25:13__NR2Ki/25/16\');">16__NB2Ch/4/14\');">2Ch 4:14__NBJer/52/17\');">Jer 52:17__NRJer/52/20\');">20__EN';
stringArray[28] = 'And the work of the __PNbases_was_on_1__SHbases [was] on</a> this [manner]: they had borders, and the borders [were] between the ledges:__CPbases_was_on_1__PSbases was on__EEIt seems evident that these bases or pedestals rose with steps, and that the ornaments mentioned in the next verse appeared in front, forming so many entablatures. But the description of these bases is very difficult to comprehend: many of the original words are seldom, if at all, used elsewhere; and it would be impossible to give an explanation of each particular, without a labour and prolixity disproportioned to its importance to us.</TD></TR>';
stringArray[29] = 'And on the borders that [were] between the ledges [were] __PNlions_1__SHlions</a>, oxen, and __PNcherubims_2__SHcherubims</a>: and upon the ledges [there was] a base above: and beneath the lions and oxen [were] __PNcertain_additions_3__SHcertain additions</a> made of thin work.__CPlions_1__PSlions__FF1Ki/7/25\');">1Ki 7:25__NB1Ki/6/27\');">1Ki 6:27__NBEze/1/10\');">Eze 1:10__NBEze/10/14\');">Eze 10:14__NBEze/41/18\');">Eze 41:18__NREze/41/19\');">19__NBHsa/5/14\');">Hsa 5:14__NBRev/4/6\');">Rev 4:6__NRRev/4/7\');">7__NBRev/5/5\');">Rev 5:5__AN__GHcherubims_2__PScherubims__EFGen/3/24\');">Gen 3:24__NBExd/25/18\');">Exd 25:18__NBExd/37/7\');">Exd 37:7__NBHbr/9/5\');">Hbr 9:5__AN__GGcertain_additions_3__PScertain additions__FF1Pe/2/5\');">1Pe 2:5__EN';
stringArray[30] = 'And every base had four brasen __PNwheels_1__SHwheels</a>, and plates of brass: and the four corners thereof __PNhad_undersetters_2__SHhad undersetters</a>: under the laver [were] undersetters molten, at the side of every addition.__CPwheels_1__PSwheels__FFEze/1/15\');">Eze 1:15-21__NBEze/3/13\');">Eze 3:13__NBEze/10/10\');">Eze 10:10-13__AN__GHhad_undersetters_2__PShad undersetters__FEIt is probable that these undersetters were so many strong legs, somewhat shorter than the wheels, and were intended to prevent the laver from tilting, or falling, in case of any accident.</TD></TR>';
