Text[1] = 'So king Solomon was king over all Israel.';
Text[2] = 'And these [were] the princes which he had; Azariah the son of Zadok the priest,';

Text[9] = 'The son of Dekar, in Makaz, and in Shaalbim, and Bethshemesh, and Elonbethhanan:';
Text[10] = 'The son of Hesed, in Aruboth; to him [pertained] Sochoh, and all the land of Hepher:';
Text[11] = 'The son of Abinadab, in all the region of Dor; which had Taphath the daughter of Solomon to wife:';
Text[12] = 'Baana the son of Ahilud; [to him pertained] Taanach and Megiddo, and all Bethshean, which [is] by Zartanah beneath Jezreel, from Bethshean to Abelmeholah, [even] unto [the place that is] beyond Jokneam:';
Text[13] = 'The son of Geber, in Ramothgilead; to him [pertained] the towns of Jair the son of Manasseh, which [are] in Gilead; to him [also pertained] the region of Argob, which [is] in Bashan, threescore great cities with walls and brasen bars:';
Text[14] = 'Ahinadab the son of Iddo [had] Mahanaim:';
Text[15] = 'Ahimaaz [was] in Naphtali; he also took Basmath the daughter of Solomon to wife:';
Text[16] = 'Baanah the son of Hushai [was] in Asher and in Aloth:';
Text[17] = 'Jehoshaphat the son of Paruah, in Issachar:';
Text[18] = 'Shimei the son of Elah, in Benjamin:';
Text[19] = 'Geber the son of Uri [was] in the country of Gilead, [in] the country of Sihon king of the Amorites, and of Og king of Bashan; and [he was] the only officer which [was] in the land.';
Text[20] = 'Judah and Israel [were] many, as the sand which [is] by the sea in multitude, eating and drinking, and making merry.';
Text[21] = 'And Solomon reigned over all kingdoms from the river unto the land of the Philistines, and unto the border of Egypt: they brought presents, and served Solomon all the days of his life.';
Text[22] = 'And Solomon\'s provision for one day was thirty measures of fine flour, and threescore measures of meal,';
Text[23] = 'Ten fat oxen, and twenty oxen out of the pastures, and an hundred sheep, beside harts, and roebucks, and fallowdeer, and fatted fowl.';
Text[24] = 'For he had dominion over all [the region] on this side the river, from Tiphsah even to Azzah, over all the kings on this side the river: and he had peace on all sides round about him.';
Text[25] = 'And Judah and Israel dwelt safely, every man under his vine and under his fig tree, from Dan even to Beersheba, all the days of Solomon.';
Text[26] = 'And Solomon had forty thousand stalls of horses for his chariots, and twelve thousand horsemen.';
Text[27] = 'And those officers provided victual for king Solomon, and for all that came unto king Solomon\'s table, every man in his month: they lacked nothing.';
Text[28] = 'Barley also and straw for the horses and dromedaries brought they unto the place where [the officers] were, every man according to his charge.';
Text[29] = 'And God gave Solomon wisdom and understanding exceeding much, and largeness of heart, even as the sand that [is] on the sea shore.';
Text[30] = 'And Solomon\'s wisdom excelled the wisdom of all the children of the east country, and all the wisdom of Egypt.';
Text[31] = 'For he was wiser than all men; than Ethan the Ezrahite, and Heman, and Chalcol, and Darda, the sons of Mahol: and his fame was in all nations round about.';
Text[32] = 'And he spake three thousand proverbs: and his songs were a thousand and five.';
Text[33] = 'And he spake of trees, from the cedar tree that [is] in Lebanon even unto the hyssop that springeth out of the wall: he spake also of beasts, and of fowl, and of creeping things, and of fishes.';
Text[34] = 'And there came of all people to hear the wisdom of Solomon, from all kings of the earth, which had heard of his wisdom.';
