Text[3] = 'And the LORD said unto him, I have heard thy prayer and thy supplication, that thou hast made before me: I have hallowed this house, which thou hast built, to put my name there for ever; and mine eyes and mine heart shall be there perpetually.';
Text[4] = 'And if thou wilt walk before me, as David thy father walked, in integrity of heart, and in uprightness, to do according to all that I have commanded thee, [and] wilt keep my statutes and my judgments:';

Text[10] = 'And it came to pass at the end of twenty years, when Solomon had built the two houses, the house of the LORD, and the king\'s house,';

Text[12] = 'And Hiram came out from Tyre to see the cities which Solomon had given him; and they pleased him not.';
Text[13] = 'And he said, What cities [are] these which thou hast given me, my brother? And he called them the land of Cabul unto this day.';
Text[14] = 'And Hiram sent to the king sixscore talents of gold.';
