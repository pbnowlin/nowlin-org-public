stringArray[8] = '__PNIn_the_twenty_2__SHIn the twenty</a> and sixth year of Asa king of Judah began Elah the son of Baasha to reign over Israel in Tirzah, two years.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3075. B.C. 929.__GHIn_the_twenty_2__PSIn the twenty__FEBaasha began to reign in the third year of Asa, and reigned 24 years; yet he died and was succeeded by Elah in the 26th year of Asa; and, in like manner, Elah, who began to reign in the 26th year of Asa, and was killed in the 27th, is said to have reigned two years. Thus it is evident that a part of a year is calculated as a whole year. In the Chinese annals, the whole year in which a king dies is ascribed to his reign, the years of the succeeding king being reckoned only from the beginning of the following year</TD></TR>';

stringArray[23] = 'In __PNthe_thirty_2__SHthe thirty</a> and first year of Asa king of Judah began Omri to reign over Israel, __PNtwelve_years_3__SHtwelve years</a>: six years reigned he in Tirzah.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3079-3086. B.C. 925-918.__GHthe_thirty_2__PSthe thirty__FEAs it is stated in verses 10 and 15, that Zimri began to reign in the 27th year of Asa; and as he reigned only seven days, and Omri immediately succeeded him, this could not be the 31st, but in the 27th year of Asa. Jarchi, from Sedar Olam, reconciles this, by stating that Tibni and Omri began to reign jointly in the 27th year of Asa; and that Tibni dying about five years afterwards, Omri began to reign alone in the 31st year of Asa. __NA2Ch/22/2\');">2Ch 22:2__AN__GGtwelve_years_3__PStwelve years__FF1Ki/16/8\');">1Ki 16:8__NR1Ki/16/29\');">29__EN';
