stringArray[33] = 'And he spake of trees, from __PNthe_cedar_tree_1__SHthe cedar tree</a> that [is] in Lebanon even unto __PNthe_hyssop_2__SHthe hyssop</a> that springeth out of the wall: he spake also __PNof_beasts_3__SHof beasts</a>, and of fowl, and of creeping things, and of fishes.__CPthe_cedar_tree_1__PSthe cedar tree__EEThe word airez, whence the Chaldee and Syriac arzo, and the Arabic and Ethiopic arz, and Spanish alerze, unquestionably denotes the cedar; it is thus rendered by the LXX. and other versions, [kedros] and by the Vulgate cedrus; and the inhabitants of mount Lebanon still call it ars. The cedar is a large and nobel evergreen tree, and grows on the most elevated part of the mountain, is taller than the pine, and so thick that five men together could scarcely fathom one. It shoots out its branches at ten or twelve feet from the ground; they are large and distant from each other, and are perpetually green. The wood is of a brown colour, very solid and incorruptible, if preserved from wet. The tree bears a small cone, like that of the pine. __NANum/24/6\');">Num 24:6__NB2Ki/19/23\');">2Ki 19:23__NBPsa/92/12\');">Psa 92:12__AN__GHthe_hyssop_2__PSthe hyssop__EFExd/12/22\');">Exd 12:22__NBNum/19/18\');">Num 19:18__NBPsa/51/7\');">Psa 51:7__NBHbr/9/19\');">Hbr 9:19__AN__GGof_beasts_3__PSof beasts__FFGen/1/20\');">Gen 1:20-25__EN';
