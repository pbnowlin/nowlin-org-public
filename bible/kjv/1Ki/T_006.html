stringArray[29] = 'And he carved all the walls of the house round about with __PNcarved_figures_1__SHcarved figures</a> of cherubims and __PNpalm_trees_2__SHpalm trees</a> and __PNopen_flowers_3__SHopen flowers</a>, within and without.__CPcarved_figures_1__PScarved figures__FFExd/36/8\');">Exd 36:8__NB2Ch/3/14\');">2Ch 3:14__NB2Ch/4/2\');">2Ch 4:2-5__NBPsa/103/20\');">Psa 103:20__NBPsa/148/2\');">Psa 148:2__NBLuk/2/13\');">Luk 2:13__NRLuk/2/14\');">14__NBEph/3/10\');">Eph 3:10__NBRev/5/11\');">Rev 5:11-14__AN__GHpalm_trees_2__PSpalm trees__FETamar, in Ethiopic, tamart, the palm tree, is so called, says Parkhurst, from its straight, upright growth, for which it seems more remarkable than any other tree; and it sometimes rises to the height of more than 100 feet. The trunk is remarkably straight and lofty; and it is crowned at the top with a large tuft of spiring leaves, about four feet long, which never fall off, but always continue in the same flourishing verdure. The stalks are generally full of rugged knots, which are vestiges of decayed leaves: for the trunk of the tree is not solid, but its centre is filled with pith, round which is a tough bark full of strong fibres when young, which, as the tree becomes old, hardens and becomes ligneous. To this bark the leaves are closely joined, which, as the tree becomes old, hardens and becomes ligneous. To this bark the leaves are closely joined, which in the centre rise erect, but after they are advanced above the vagina which surrounds them, they expand very wide on every side of the stem, and as the__GGopen_flowers_3__PSopen flowers__EEHeb. openings of flowers. __NA1Ki/6/18\');">1Ki 6:18__NR1Ki/6/32\');">32__EN';
