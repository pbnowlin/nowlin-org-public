Text[6] = 'And Solomon said, Thou hast shewed unto thy servant David my father great mercy, according as he walked before thee in truth, and in righteousness, and in uprightness of heart with thee; and thou hast kept for him this great kindness, that thou hast given him a son to sit on his throne, as [it is] this day.';

Text[10] = 'And the speech pleased the Lord, that Solomon had asked this thing.';
