stringArray[17] = 'And __PNBaasha_2__SHBaasha</a> king of Israel went up against Judah, and built __PNRamah_3__SHRamah</a>, that __PNhe_might_not_suffer_4__SHhe might not suffer</a> any to go out or come in to Asa king of Judah.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3074. B.C. 930.__GHBaasha_2__PSBaasha__EF1Ki/15/27\');">1Ki 15:27__NB2Ch/16/1\');">2Ch 16:1-6__AN__GGRamah_3__PSRamah__EEBy building Ramah is here meant fortifying it, in order to prevent all intercourse with the kingdom of Judah, lest his subjects should cleave to the house of David: for Ramah was a city of Benjamin, situated on the confines of both kingdoms, probably on a hill, as the name imports, commanding a narrow defile between the mountains, through which lay the principal road to Jerusalem; so that a fortification being erected here, no communication could be held between the people of Israel and Judah, without Baasha\'s permission. __NA1Ki/15/21\');">1Ki 15:21__NBJos/18/25\');">Jos 18:25__NB1Sa/15/34\');">1Sa 15:34__NBJer/31/15\');">Jer 31:15__AN__GHhe_might_not_suffer_4__PShe might not suffer__EF1Ki/12/27\');">1Ki 12:27__NB2Ch/11/13\');">2Ch 11:13-17__EN';

stringArray[32] = 'And __PNthere_was_war_2__SHthere was war</a> between Asa and Baasha king of Israel all their days.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3051-3074. B.C. 953-930.__GHthere_was_war_2__PSthere was war__FEThat is, there was a constant spirit of hostility kept up between the two kingdoms, and no doubt frequent skirmishing between the bordering parties; but there was no open war till Baasha king of Israel began to build Ramah, which was, according to __NA2Ch/15/19\');">2Ch 15:19__NB2Ch/16/1\');">16:1__AN, in the thirty-sixth year of Asa; but according to __NA1Ki/16/8\');">1Ki 16:8__AN, __NA1Ki/16/9\');">9__AN, his son was killed by Zimri in the twenty-sixth year of Asa, and consequently he could not make war upon him in the thirty-sixth year of his reign. Chronologers endeavour to reconcile this, by saying that the years should be reckoned, not from the beginning of Asa\'s reign, but from the separation of the kingdoms of Israel and Judah. We must either adopt this mode of solution, or admit that there is a mistake in some of the numbers, probably in the parallel places in Chronicles, but which we have no direct means of correcting. See on __NA1Ki/15/16\');">1Ki 15:16__AN.</TD></TR>';
