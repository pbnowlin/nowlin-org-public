stringArray[9] = 'And he said unto them, What counsel give ye that we may answer this people, who have spoken to me, saying, Make the yoke which thy father did put upon us lighter?__CPRelated_Verses1_1__PSEntire Verse.__FF1Ki/22/6\');">1Ki 22:6-8__NB2Sa/17/5\');">2Sa 17:5__NR2Sa/17/6\');">6__NB2Ch/10/9\');">2Ch 10:9__NB2Ch/18/5\');">2Ch 18:5-7__EN';
stringArray[10] = 'And the young men that were grown up with him spake unto him, saying, __PNThus_shalt_thou_1__SHThus shalt thou</a> speak unto this people that spake unto thee, saying, Thy father made our yoke heavy, but make thou [it] lighter unto us; thus shalt thou say unto them, __PNMy_little_finger_2__SHMy little [finger]</a> shall be thicker than my father\'s loins.__CPThus_shalt_thou_1__PSThus shalt thou__FF2Sa/17/7\');">2Sa 17:7-13__AN__GHMy_little_finger_2__PSMy little finger__FE"A proverbial mode of expression: ""My little finger is thicker than my father\'s thigh."" As much as the thigh surpasses the little finger in thickness, so much does my power exceed that of my father; and the use I shall make of it to oppress and tax you shall be in proportion. __NA2Ch/10/10\');">2Ch 10:10__NR2Ch/10/11\');">11__NBPro/10/14\');">Pro 10:14__NBPro/18/6\');">Pro 18:6__NRPro/18/7\');">7__NBPro/28/25\');">Pro 28:25__NBPro/29/23\');">Pro 29:23__NBIsa/47/6\');">Isa 47:6__AN"</TD></TR>';
stringArray[11] = 'And now whereas my father did lade you with a heavy yoke, __PNI_will_add_1__SHI will add</a> to your yoke: my father hath chastised you with whips, __PNbut_I_will_chastise_2__SHbut I will chastise</a> you with __PNscorpions_3__SHscorpions</a>.__CPI_will_add_1__PSI will add__FFExd/1/13\');">Exd 1:13__NRExd/1/14\');">14__NBExd/5/5\');">Exd 5:5-9__NRExd/5/18\');">18__NB1Sa/8/18\');">1Sa 8:18__NB2Ch/16/10\');">2Ch 16:10__NBIsa/58/6\');">Isa 58:6__NBJer/27/11\');">Jer 27:11__NBJer/28/13\');">Jer 28:13__NRJer/28/14\');">14__AN__GHbut_I_will_chastise_2__PSbut I will chastise__FEShould you rebel or become disaffected, my father\'s whip shall be a scorpion in my hand. His was chastisement, mine shall be punishment. Celsius and Hiller conjecture that âkrabbim denotes a thorny kind of shrub, whose prickles are of a venomous nature, called by the Arabs scorpion thorns, from the exquisite pain which they inflict. But the Chaldee renders it margenin, and the Syriac moragyai, i.e., [maragnai] scourges; and in the parallel place of Chronicles the Arabic has saut, a scourge. Isidore, and after him Calmet and others, assert that the scorpion was a sort of severe whip, the lashes of which were armed with knots or points that sunk into and tore the flesh.__GGscorpions_3__PSscorpions__FF1Ki/12/14\');">1Ki 12:14__NBEze/2/6\');">Eze 2:6__NBRev/9/3\');">Rev 9:3-10__EN';

stringArray[15] = 'Wherefore the king hearkened not unto the people; for __PNthe_cause_1__SHthe cause</a> was from the LORD, __PNthat_he_might_2__SHthat he might</a> perform his saying, which the LORD spake by Ahijah the Shilonite unto Jeroboam the son of Nebat.__CPthe_cause_1__PSthe cause__EE"The cause of all this confusion and anarchy was Rehoboam\'s folly, cruelty, and despotic tyranny, and this was certainly not ""from the LORD,"" nor does the original text speak this doctrine. See an elucidation of a similar passage at __NA2Sa/24/1\');">2Sa 24:1__AN. It says, sibbah, (from savav, to turn, change,) ""the change or Revolution was from the LORD;"" which is consistent with all the preceding declarations. God stirred up the people to revolt from a man who had neither skill nor humanity to govern them. God serves his own wise and righteous purpose by the imprudences and iniquities of men, and snares sinners in the work of their own hands. ""He maketh the wrath of man to praise him."" __NA1Ki/12/24\');">1Ki 12:24__NB1Ki/22/23\');">1Ki 22:23__NBDeu/2/30\');">Deu 2:30__NBJdg/14/4\');">Jdg 14:4__NB2Ch/10/15\');">2Ch 10:15__NB2Ch/22/7\');">2Ch 22:7__NB2Ch/25/16\');">2Ch 25:16__NR2Ch/25/20\');">20__NBPsa/5/10\');">Psa 5:10__NBAmo/3/6\');">Amo 3:6__NBAct/2/23\');">Act 2:23__NBAct/4/28\');">Act 4:28__AN"__GHthat_he_might_2__PSthat he might__EF1Ki/11/11\');">1Ki 11:11__NR1Ki/11/29\');">29-38__NB1Sa/15/29\');">1Sa 15:29__NB2Sa/17/14\');">2Sa 17:14__NB2Ki/9/36\');">2Ki 9:36__NB2Ki/10/10\');">2Ki 10:10__NBIsa/14/13\');">Isa 14:13-17__NBIsa/46/10\');">Isa 46:10__NRIsa/46/11\');">11__NBDan/4/35\');">Dan 4:35__NBJhn/19/23\');">Jhn 19:23__NRJhn/19/24\');">24__NRJhn/19/28\');">28__NRJhn/19/29\');">29__NRJhn/19/32\');">32-37__NBAct/3/17\');">Act 3:17__NBAct/13/27\');">Act 13:27-29__EN';

stringArray[21] = 'And __PNwhen_Rehoboam_1__SHwhen Rehoboam</a> was come to Jerusalem, he assembled all the house of Judah, with the tribe of Benjamin, __PNan_hundred_2__SHan hundred</a> and fourscore thousand chosen men, which were warriors, to fight against the house of Israel, to bring the kingdom again to Rehoboam the son of Solomon.__CPwhen_Rehoboam_1__PSwhen Rehoboam__FF2Ch/11/1\');">2Ch 11:1-3__AN__GHan_hundred_2__PSan hundred__EF1Ch/21/5\');">1Ch 21:5__NB2Ch/14/8\');">2Ch 14:8__NR2Ch/14/11\');">11__NB2Ch/17/14\');">2Ch 17:14-19__NBPro/21/30\');">Pro 21:30__NRPro/21/31\');">31__EN';

stringArray[23] = 'Speak unto Rehoboam, the son of Solomon, king of Judah, and unto all the house of Judah and Benjamin, and to the remnant of the people, saying,__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
