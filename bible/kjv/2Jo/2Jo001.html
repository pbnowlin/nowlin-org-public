Text[3] = 'Grace be with you, mercy, [and] peace, from God the Father, and from the Lord Jesus Christ, the Son of the Father, in truth and love.';
Text[4] = 'I rejoiced greatly that I found of thy children walking in truth, as we have received a commandment from the Father.';

Text[7] = 'For many deceivers are entered into the world, who confess not that Jesus Christ is come in the flesh. This is a deceiver and an antichrist.';
Text[8] = 'Look to yourselves, that we lose not those things which we have wrought, but that we receive a full reward.';

Text[11] = 'For he that biddeth him God speed is partaker of his evil deeds.';
