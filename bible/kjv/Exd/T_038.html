var stringArray = new Array();
stringArray[1] = 'And he made __PNthe_altar_1__SHthe altar</a> of burnt offering [of] shittim wood: five cubits [was] the length thereof, and five cubits the breadth thereof; [it was] __PNfoursquare__and_three_cubits_the_height_thereof_2__SHfoursquare; and three cubits the height thereof</a>.__CPthe_altar_1__PSthe altar__EEThis altar consisted of four boards of shittim (acacia) wood, covered with brass, and hollow in the middle; but it is supposed to have been filled up with earth when used, for it is expressly said (__NAExd/20/24\');">Exd 20:24__AN) that the altar is to be of earth. As it was five cubits long and five cubits broad, and three cubits high, if the cubit be reckoned at 21 inches, it must have been eight feet nine inches square, and about five feet three inches in height. __NAExd/27/1\');">Exd 27:1-8__NBExd/40/6\');">Exd 40:6__NRExd/40/29\');">29__NB2Ch/4/1\');">2Ch 4:1__NBEze/43/13\');">Eze 43:13-17__NBRom/8/3\');">Rom 8:3__NRRom/8/4\');">4__NBRom/12/1\');">Rom 12:1__NBHbr/3/1\');">Hbr 3:1__NBHbr/9/14\');">Hbr 9:14__NBHbr/13/10\');">Hbr 13:10__NB1Pe/2/5\');">1Pe 2:5__AN__GHfoursquare__and_three_cubits_the_height_thereof_2__PSfoursquare; and three cubits the height thereof__EFEze/43/16\');">Eze 43:16__NBJhn/6/37\');">Jhn 6:37__NBHbr/13/8\');">Hbr 13:8__NBRev/21/16\');">Rev 21:16__EN';
stringArray[2] = 'And __PNhe_made_1__SHhe made</a> the horns thereof on the four corners of it; the horns thereof were of the same: and he overlaid it with __PNbrass_2__SHbrass</a>.__CPhe_made_1__PShe made__FFExd/27/2\');">Exd 27:2__AN__GHbrass_2__PSbrass__EFJob/6/12\');">Job 6:12__EN';
stringArray[3] = 'And __PNhe_made_1__SHhe made</a> all the vessels of the altar, the pots, and the shovels, and the basons, [and] the __PNflesh_hooks_2__SHfleshhooks</a>, and the firepans: all the vessels thereof made he [of] brass.__CPhe_made_1__PShe made__FFExd/27/3\');">Exd 27:3__AN__GHflesh_hooks_2__PSflesh-hooks__EF1Sa/2/13\');">1Sa 2:13__EN';

stringArray[6] = 'And he made the staves [of] shittim wood, and overlaid them with brass.__CPRelated_Verses1_1__PSEntire Verse.__FFExd/25/6\');">Exd 25:6__NBDeu/10/3\');">Deu 10:3__EN';
stringArray[7] = 'And he put the staves into the rings on the sides of the altar, __PNto_bear_it_withal_1__SHto bear it withal</a>; he made the altar hollow with boards.__CPto_bear_it_withal_1__PSto bear it withal__FFAct/9/15\');">Act 9:15__NB1Cr/1/24\');">1Cr 1:24__NB1Cr/2/2\');">1Cr 2:2__EN';
stringArray[8] = 'And he made __PNthe_laver_1__SHthe laver</a> [of] brass, and the foot of it [of] brass, of the __PNlookingglasses_2__SHlookingglasses</a> of [the women] __PNassembling_3__SHassembling</a>, which assembled [at] the door of the tabernacle of the congregation.__CPthe_laver_1__PSthe laver__FFExd/30/18\');">Exd 30:18-21__NBExd/40/7\');">Exd 40:7__NRExd/40/30\');">30-32__NB1Ki/7/23\');">1Ki 7:23-26__NR1Ki/7/38\');">38__NBPsa/26/6\');">Psa 26:6__NBZec/13/1\');">Zec 13:1__NBJhn/13/10\');">Jhn 13:10__NBTts/3/5\');">Tts 3:5__NRTts/3/6\');">6__NBHbr/9/10\');">Hbr 9:10__NB1Jo/3/7\');">1Jo 3:7__NBRev/1/5\');">Rev 1:5__AN__GHlookingglasses_2__PSlookingglasses__FEor, brazen glasses. The word maroth, from raah, to see, denotes reflectors, or mirrors, of any kind. That these could not have been looking glasses, as in our translation, is sufficiently evident, not only from the glass not being then in use, but also from the impossibility of making the brazen laver of such materials. The first mirrors known among men, were the clear fountain and unruffled lake. The first artificial ones were made of polished brass, afterwards of steel, and when luxury increased, of silver; but at a very early period, they were made of a mixed metal, particularly of tin and copper, the best of which, as Pliny informs us, were formerly manufactured at Brundusium. When the Egyptians went to their temples, according to St. Cyril, they always carried their mirrors with them. The Israelitish women probably did the same; and Dr. Shaw says, that looking-glasses are still part of the dress of Moorish women, who carry them constantly hung at their breasts.__GGassembling_3__PSassembling__EEHeb. assembling by troops. It is supposed that these women kept watch during the night. Among the ancients, women were generally employed as door-keepers. See __NA1Sa/2/22\');">1Sa 2:22__AN. __NAPro/8/34\');">Pro 8:34__NBMat/26/69\');">Mat 26:69__NBLuk/2/37\');">Luk 2:37__NBJhn/18/16\');">Jhn 18:16__NB1Ti/5/5\');">1Ti 5:5__EN';
stringArray[9] = 'And he made __PNthe_court_1__SHthe court</a>: on the south side southward the hangings of the court [were of] fine twined linen, an hundred cubits:__CPthe_court_1__PSthe court__FFExd/27/9\');">Exd 27:9-19__NBExd/40/8\');">Exd 40:8__NRExd/40/33\');">33__NB1Ki/6/36\');">1Ki 6:36__NBPsa/84/2\');">Psa 84:2__NRPsa/84/10\');">10__NBPsa/89/7\');">Psa 89:7__NBPsa/92/13\');">Psa 92:13__NBPsa/100/4\');">Psa 100:4__EN';
stringArray[10] = 'Their pillars [were] twenty, and their brasen sockets twenty; the hooks of the pillars and their fillets [were of] silver.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[11] = 'And for the north side [the hangings were] an hundred cubits, their pillars [were] twenty, and their sockets of brass twenty; the hooks of the pillars and their fillets [of] silver.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';

stringArray[15] = 'And for the other side of the court gate, on this hand and that hand, [were] hangings of fifteen cubits; their pillars three, and their sockets three.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';

stringArray[18] = 'And the hanging for the gate of the court [was] __PNneedlework_1__SHneedlework</a>, [of] blue, and purple, and scarlet, and fine twined linen: and twenty cubits [was] the length, and the height in the breadth [was] five cubits, answerable to the hangings of the court.__CPneedlework_1__PSneedlework__FF2Ch/3/14\');">2Ch 3:14__EN';

stringArray[20] = 'And all __PNthe_pins_1__SHthe pins</a> of the tabernacle, and of the court round about, [were of] brass.__CPthe_pins_1__PSthe pins__FFExd/27/19\');">Exd 27:19__NB2Ch/3/9\');">2Ch 3:9__NBEzr/9/8\');">Ezr 9:8__NBEcc/12/11\');">Ecc 12:11__NBIsa/22/23\');">Isa 22:23__NBIsa/33/20\');">Isa 33:20__NBEph/2/21\');">Eph 2:21__NREph/2/22\');">22__NBCol/2/19\');">Col 2:19__EN';
stringArray[21] = 'This is the sum of the tabernacle, [even] of the __PNtabernacle_of_testimony_1__SHtabernacle of testimony</a>, as it was counted, according to the commandment of Moses, [for] the service of the Levites, __PNby_the_hand_2__SHby the hand</a> of __PNIthamar_3__SHIthamar</a>, son to Aaron the priest.__CPtabernacle_of_testimony_1__PStabernacle of testimony__FFExd/25/16\');">Exd 25:16__NBExd/26/33\');">Exd 26:33__NBExd/40/3\');">Exd 40:3__NBNum/1/50\');">Num 1:50__NRNum/1/53\');">53__NBNum/9/15\');">Num 9:15__NBNum/10/11\');">Num 10:11__NBNum/17/7\');">Num 17:7__NRNum/17/8\');">8__NBNum/18/2\');">Num 18:2__NB2Ch/24/6\');">2Ch 24:6__NBAct/7/44\');">Act 7:44__NBRev/11/19\');">Rev 11:19__NBNum/24/5\');">Num 24:5__NBMat/17/4\');">Mat 17:4__NBJob/11/4\');">Job 11:4__NBJob/22/23\');">Job 22:23__NBExd/26/1\');">Exd 26:1__NBHbr/9/2\');">Hbr 9:2__NRHbr/9/3\');">3__NBHbr/8/2\');">Hbr 8:2__NBHbr/9/11\');">Hbr 9:11__NBPsa/15/1\');">Psa 15:1__NB2Cr/5/1\');">2Cr 5:1__NB2Pe/1/13\');">2Pe 1:13__NBRev/21/3\');">Rev 21:3__AN__GHby_the_hand_2__PSby the hand__EFNum/4/28\');">Num 4:28-33__NBEzr/8/26\');">Ezr 8:26-30__AN__GGIthamar_3__PSIthamar__FFExd/6/23\');">Exd 6:23__NB1Ch/6/3\');">1Ch 6:3__EN';
stringArray[22] = 'And __PNBezaleel_1__SHBezaleel</a> the son of Uri, the son of Hur, of the tribe of Judah, made __PNall_that_the_LORD_2__SHall that the LORD</a> commanded Moses.__CPBezaleel_1__PSBezaleel__FFExd/31/1\');">Exd 31:1-5__NBExd/35/30\');">Exd 35:30-35__NBExd/36/1\');">Exd 36:1-3__AN; The supernatural qualifications of Bezaleel and Aholiab proved their divine appointment; yet they had an express nomination to their work: they were also miraculously qualified to instruct their assistants, as well as to superintend them. Christ alone builds the Temple of the LORD, and bears the glory; but ministers and private Christians, under his direction and by his grace, may be fellow-workers together with him. They who, in mean employments, are diligent and humbly contented, are equally acceptable with those who are engaged in more splendid services. The women who spun the goats\' hair were wise-hearted, as well as the persons who presided over the work of the tabernacle, or as Aaron, who burnt incense there, because they did it heartily unto the LORD. Our wisdom and duty consist in giving God the glory and use of our talents, be they more or less; neither abusing nor burying them, but occupying with them until our LORD shall come; being satisfied that it is better __GHall_that_the_LORD_2__PSall that the LORD__EFPsa/119/6\');">Psa 119:6__NBJer/1/7\');">Jer 1:7__NBMat/28/20\');">Mat 28:20__EN';
stringArray[23] = 'And with him [was] __PNAholiab_1__SHAholiab</a>, son of Ahisamach, of the tribe of Dan, an engraver, and __PNa_cunning_2__SHa cunning</a> workman, and an embroiderer in blue, and in purple, and in scarlet, and fine linen.__CPAholiab_1__PSAholiab__FFExd/35/34\');">Exd 35:34__AN__GHa_cunning_2__PSa cunning__EFExd/35/34\');">Exd 35:34__EN';
stringArray[24] = '__PNAll_the_gold_1__SHAll the gold</a> that was occupied for the work in all the work of the holy [place], even the gold of the __PNoffering_2__SHoffering</a>, was twenty and nine talents, and seven hundred and thirty shekels, after __PNthe_shekel_3__SHthe shekel</a> of the sanctuary.__CPAll_the_gold_1__PSAll the gold__EEIf we follow the estimation of the learned Dean Prideaux, the value of the twenty-nine talents, and 730 shekels of gold, will be 198,347£. 12s. 6d. The value of the silver contributed by 603,550 Israelites, at half a shekel, or 1s. 6d. per man, will amount to 45,266£. 5s. The value of the 70 talents, 2,400 shekels of brass, will be 513£. 17s. The gold weighed 4,245 pounds; the silver, 14,603 pounds; and the brass, 10,277 pounds, troy weight. The total value of all the gold, silver, and brass, will consequently amount to 244,127£. 14s. 6d.; and the total weight of these three metals will amount to 29,124 pounds troy, which reduced to avoirdupois weight, is equal to fourteen tons, 226 pounds!--It may, perhaps, seem difficult to imagine how the Israelites should be possessed of so much wealth in the desert; but it should be remembered, that their ancestors were opulent men before they came into Egypt; that they were further enriched by the spoils of the Egyptians and Amalekites; and that it is probable, they tra__GHoffering_2__PSoffering__EFExd/25/2\');">Exd 25:2__NBExd/29/24\');">Exd 29:24__NBExd/35/22\');">Exd 35:22__AN__GGthe_shekel_3__PSthe shekel__FFExd/30/13\');">Exd 30:13__NRExd/30/14\');">14__NRExd/30/24\');">24__NBLev/5/15\');">Lev 5:15__NBLev/27/3\');">Lev 27:3__NRLev/27/25\');">25__NBNum/3/47\');">Num 3:47__NBNum/18/16\');">Num 18:16__EN';
stringArray[25] = 'And the silver of them that were numbered of the congregation [was] an hundred talents, and a thousand seven hundred and threescore and fifteen shekels, after the shekel of the sanctuary:__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[26] = 'A __PNbekah_1__SHbekah</a> for __PNevery_man_2__SHevery man</a>, [that is], half a shekel, after the shekel of the sanctuary, for every one that went to be numbered, from twenty years old and upward, for __PNsix_hundred_3__SHsix hundred</a> thousand and three thousand and five hundred and fifty [men].__CPbekah_1__PSbekah__FFExd/30/13\');">Exd 30:13__NRExd/30/15\');">15__NRExd/30/16\');">16__AN__GHevery_man_2__PSevery man__FEHeb. a poll. __NANum/1/46\');">Num 1:46__AN__GGsix_hundred_3__PSsix hundred__FFExd/12/37\');">Exd 12:37__NBNum/1/46\');">Num 1:46__EN';
