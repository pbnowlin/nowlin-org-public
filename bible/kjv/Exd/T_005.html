var stringArray = new Array();
stringArray[1] = 'And afterward Moses and Aaron went in, __PNand_told_1__SHand told</a> Pharaoh, Thus saith the LORD God of Israel, Let my people go, that they may hold __PNa_feast_2__SHa feast</a> unto me in the wilderness.__CPand_told_1__PSand told__FF1Ki/21/20\');">1Ki 21:20__NBPsa/119/46\');">Psa 119:46__NBEze/2/6\');">Eze 2:6__NBJon/3/3\');">Jon 3:3__NRJon/3/4\');">4__NBMat/10/18\');">Mat 10:18__NRMat/10/28\');">28__NBAct/4/29\');">Act 4:29__AN__GHa_feast_2__PSa feast__EFExd/10/9\');">Exd 10:9__NBIsa/25/6\');">Isa 25:6__NB1Cr/5/8\');">1Cr 5:8__EN';
stringArray[2] = 'And Pharaoh said, __PNWho_1__SHWho</a> [is] the LORD, that I should obey his voice to let Israel go? __PNI_know_not_2__SHI know not</a> the LORD, __PNneither_3__SHneither</a> will I let Israel go.__CPWho_1__PSWho__FFExd/3/19\');">Exd 3:19__NB2Ki/18/35\');">2Ki 18:35__NB2Ch/32/15\');">2Ch 32:15__NR2Ch/32/19\');">19__NBJob/21/15\');">Job 21:15__NBPsa/10/4\');">Psa 10:4__NBPsa/12/4\');">Psa 12:4__NBPsa/14/1\');">Psa 14:1__AN__GHI_know_not_2__PSI know not__EF1Sa/2/12\');">1Sa 2:12__NBJhn/16/3\');">Jhn 16:3__NBRom/1/28\');">Rom 1:28__NB2Th/1/8\');">2Th 1:8__AN__GGneither_3__PSneither__FFExd/3/19\');">Exd 3:19__NBJer/44/16\');">Jer 44:16__NRJer/44/17\');">17__EN';
stringArray[3] = 'And they said, __PNThe_God_1__SHThe God</a> of the Hebrews hath met with us: let us go, we pray thee, three days\' journey into the desert, and sacrifice unto the LORD our God; __PNlest_he_2__SHlest he</a> fall upon us with pestilence, or with the sword.__CPThe_God_1__PSThe God__FFExd/3/18\');">Exd 3:18__AN__GHlest_he_2__PSlest he__EFDeu/28/21\');">Deu 28:21__NB2Ki/17/25\');">2Ki 17:25__NB2Ch/30/8\');">2Ch 30:8__NBEzr/7/23\');">Ezr 7:23__NBEze/6/11\');">Eze 6:11__NBZec/14/16\');">Zec 14:16-19__EN';
stringArray[4] = 'And the king of Egypt said unto them, __PNWherefore_1__SHWherefore</a> do ye, Moses and Aaron, __PNlet_2__SHlet</a> the people from their works? get you unto your __PNburdens_3__SHburdens</a>.__CPWherefore_1__PSWherefore__FFJer/38/4\');">Jer 38:4__NBAmo/7/10\');">Amo 7:10__NBLuk/23/2\');">Luk 23:2__NBAct/16/20\');">Act 16:20__NRAct/16/21\');">21__NBAct/24/5\');">Act 24:5__AN__GHlet_2__PSlet__FE"Taphreeoo, from pard, to loose, disengage; and which we render let, from the Anglo-Saxon lettan, to hinder. Ye hinder the people from their work: ""Get you unto your burdens."" ""Let religion alone and mind your work."" The language not only of tyranny, but of thoughtless irreligion."__GGburdens_3__PSburdens__FFExd/1/11\');">Exd 1:11__EN';
stringArray[5] = 'And Pharaoh said, Behold, the people of the land now [are] many, and ye make them rest from their burdens.__CPRelated_Verses1_1__PSEntire Verse.__FFExd/1/7\');">Exd 1:7-11__NBPro/14/28\');">Pro 14:28__EN';
stringArray[6] = 'And Pharaoh commanded the same day the __PNtaskmasters_1__SHtaskmasters</a> of the people, and their __PNofficers_2__SHofficers</a>, saying,__CPtaskmasters_1__PStaskmasters__EENogesim, literally, exactors, oppressors. These taskmasters were Egyptians, (__NAExd/1/11\');">Exd 1:11__AN,) but the officers were Hebrews. See __NAExd/5/14\');">Exd 5:14__AN. __NAExd/5/10\');">Exd 5:10__NRExd/5/13\');">13__NRExd/5/15\');">15__NRExd/5/19\');">19__NBExd/1/11\');">Exd 1:11__NBPro/12/10\');">Pro 12:10__AN__GHofficers_2__PSofficers__FEShoterim, from the Arabic saytara, to overlook, superintend, seems to denote, as musaytar in Arabic also does, overseers, superintendents. They may have been somewhat like the chiefs of trades, who are found in every city in the East; where every trade has a head, who is entrusted with authority over them, and is in some measure answerable for them to Government. Compare __NAExd/2/14\');">Exd 2:14__AN. __NANum/11/16\');">Num 11:16__NBDeu/1/15\');">Deu 1:15__NBDeu/16/18\');">Deu 16:18__NBJos/8/33\');">Jos 8:33__NBJos/24/1\');">Jos 24:1__NRJos/24/4\');">4__NB2Ch/26/11\');">2Ch 26:11__EN';
stringArray[7] = 'Ye shall no more give the people __PNstraw_1__SHstraw</a> to make brick, as heretofore: let them go and gather straw for themselves.__CPstraw_1__PSstraw__EE"The straw was mixed with clay, in order to make the bricks. This is expressly affirmed by Philo, (vit. Mos.) who was himself a native of Alexandria, in Egypt. He says, describing the oppression of the Israelites, that some were obliged to work in clay, and others to gather straw for the formation of bricks, [plinthou gar achyra desmos] because straw is the binding of the brick. Philo\'s account is confirmed by Dr. Shaw, who says that ""some of the Egyptian pyramids are made of brick, the composition whereof is only a mixture of clay, mud, and straw, slightly blended and kneaded together, and afterwards baked in the sun. The straw, which keeps the bricks together, and still preserves its original colour, seems to be a proof that these bricks were never burnt or made in kilns."" The same materials are now used for building in Egypt. Mr. Baumgarten says, ""The houses are for the most part of bricks that are only hardened by the heat of the sun, and mixed with straw to make them firm."" __NAGen/24/25\');">Gen 24:25__NBJdg/19/19\');">Jdg 19:19__AN"</TD></TR>';
stringArray[8] = 'And the __PNtale_1__SHtale</a> of the bricks, which they did make heretofore, __PNye_shall_lay_2__SHye shall lay</a> upon them; ye shall not diminish [ought] thereof: for they [be] idle; therefore they cry, saying, Let us go [and] sacrifice to our God.__CPtale_1__PStale__EETale denotes number, from the Anglo-Saxon tællan, to number, count, etc.__GHye_shall_lay_2__PSye shall lay__EFPsa/106/41\');">Psa 106:41__EN';
stringArray[9] = '__PNLet_there_more_work_be_laid_upon_the_men_1__SHLet there more work be laid upon the men</a>, that they may labour therein; and let them not regard __PNvain_words_2__SHvain words</a>.__CPLet_there_more_work_be_laid_upon_the_men_1__PSLet there more work be laid upon the men__EEHeb. Let the work be heavy upon the men.__GHvain_words_2__PSvain words__EF2Ki/18/20\');">2Ki 18:20__NBJob/16/3\');">Job 16:3__NBJer/43/2\');">Jer 43:2__NBZec/1/6\');">Zec 1:6__NBMal/3/14\');">Mal 3:14__NBEph/5/6\');">Eph 5:6__EN';
stringArray[10] = 'And the __PNtaskmasters_1__SHtaskmasters</a> of the people went out, and their officers, and they spake to the people, saying, Thus saith Pharaoh, I will not give you straw.__CPtaskmasters_1__PStaskmasters__FFExd/1/11\');">Exd 1:11__NBPro/29/12\');">Pro 29:12__EN';
stringArray[11] = 'Go ye, get you straw where ye can find it: yet __PNnot_ought_1__SHnot ought</a> of your work shall be diminished.__CPnot_ought_1__PSnot ought__FFExd/5/13\');">Exd 5:13__NRExd/5/14\');">14__EN';
