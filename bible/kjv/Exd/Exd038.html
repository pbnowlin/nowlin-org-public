Text[9] = 'And he made the court: on the south side southward the hangings of the court [were of] fine twined linen, an hundred cubits:';

Text[14] = 'The hangings of the one side [of the gate were] fifteen cubits; their pillars three, and their sockets three.';

Text[16] = 'All the hangings of the court round about [were] of fine twined linen.';
Text[17] = 'And the sockets for the pillars [were of] brass; the hooks of the pillars and their fillets [of] silver; and the overlaying of their chapiters [of] silver; and all the pillars of the court [were] filleted with silver.';
Text[18] = 'And the hanging for the gate of the court [was] needlework, [of] blue, and purple, and scarlet, and fine twined linen: and twenty cubits [was] the length, and the height in the breadth [was] five cubits, answerable to the hangings of the court.';
