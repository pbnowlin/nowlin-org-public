stringArray[15] = 'But when Pharaoh __PNsaw_1__SHsaw</a> that there was respite, __PNhe_hardened_2__SHhe hardened</a> his heart, and hearkened not unto them; as the LORD had said.__CPsaw_1__PSsaw__FFExd/14/5\');">Exd 14:5__NBEcc/8/11\');">Ecc 8:11__NBIsa/26/10\');">Isa 26:10__NBJer/34/7\');">Jer 34:7-11__NBHsa/6/4\');">Hsa 6:4__AN__GHhe_hardened_2__PShe hardened__EFExd/4/21\');">Exd 4:21__NBExd/7/4\');">Exd 7:4__NRExd/7/13\');">13__NRExd/7/14\');">14__NBPro/29/1\');">Pro 29:1__NBZec/7/11\');">Zec 7:11__NRZec/7/12\');">12__NBHbr/3/8\');">Hbr 3:8__NRHbr/3/15\');">15__NBRev/16/9\');">Rev 16:9__EN';
stringArray[16] = 'And the LORD said unto Moses, Say unto Aaron, __PNStretch_1__SHStretch</a> out thy rod, and smite the dust of the land, that it may become __PNlice_2__SHlice</a> throughout all the land of Egypt.__CPStretch_1__PSStretch__FFExd/8/5\');">Exd 8:5__NRExd/8/17\');">17__AN__GHlice_2__PSlice__FEThe word kinnim is rendered by the LXX. [skiphes, skipes] or [sknéphes] and by the Vulgate sciniphes, Gnats; and Mr. Harmer supposes he has found out the true meaning in the word tarrentes, a species of worm. Bochart, however, seems to have proved that lice, and not gnats, are meant; because, 1. they sprang from the dust, and not from the waters; 2. they were on both man and beast, which cannot be said of gnats; 3. their name is derived from koon, to make firm, fix, establish, which cannot agree with gnats, flies, etc., which are ever changing place, and almost constantly on the wing; 4. the term kinnah is used by the Talmudists to express the louse. This insect must have been a very dreadful and afflicting plague to the Egyptians, and especially to the priests, who were obliged to shave all their hair off, and to wear a single linen tunic, to prevent vermin harbouring about them.</TD></TR>';

stringArray[19] = 'Then the magicians said unto Pharaoh, __PNThis_is_1__SHThis [is]</a> the finger of God: __PNand_Pharaoh_s_2__SHand Pharaoh\'s</a> heart was hardened, and he hearkened not unto them; as the LORD had said.__CPThis_is_1__PSThis is__FF1Sa/6/3\');">1Sa 6:3__NR1Sa/6/9\');">9__NBPsa/8/3\');">Psa 8:3__NBDan/2/10\');">Dan 2:10__NRDan/2/11\');">11__NRDan/2/19\');">19__NBMat/12/28\');">Mat 12:28__NBLuk/11/20\');">Luk 11:20__NBJhn/11/47\');">Jhn 11:47__NBAct/4/16\');">Act 4:16__AN__GHand_Pharaoh_s_2__PSand Pharaoh\'s__FESee on __NAExd/8/15\');">Exd 8:15__AN.</TD></TR>';
stringArray[20] = 'And the LORD said unto Moses, Rise up early in the morning, and stand before Pharaoh; __PNlo_1__SHlo</a>, he cometh forth to the water; and say unto him, Thus saith the LORD, __PNLet_my_2__SHLet my</a> people go, that they may serve me.__CPlo_1__PSlo__FFExd/7/15\');">Exd 7:15__AN__GHLet_my_2__PSLet my__EFExd/8/1\');">Exd 8:1__AN.</TD></TR>';
stringArray[21] = 'Else, if thou wilt not let my people go, behold, I will send __PNswarms_1__SHswarms</a> [of flies] upon thee, and upon thy servants, and upon thy people, and into thy houses: and the houses of the Egyptians shall be full of swarms [of flies], and also the ground whereon they [are].__CPswarms_1__PSswarms__EEor, a mixture of noisome beasts, etc. The word arov is rendered [kunomwea] kunomuia,] the dog-fly, by the LXX. (who are followed by the learned Bochart,) which must have been particularly hateful to the Egyptians, because they held dogs in the highest veneration, under which form they worshipped Anubis. __NAPsa/78/45\');">Psa 78:45__NBPsa/105/31\');">Psa 105:31__NBIsa/7/18\');">Isa 7:18__EN';
stringArray[22] = 'And I will __PNsever_1__SHsever</a> in that day the land of Goshen, in which my people dwell, that no swarms [of flies] shall be there; to the end thou mayest __PNknow_2__SHknow</a> that I [am] the LORD in the __PNmidst_3__SHmidst</a> of the earth.__CPsever_1__PSsever__FFExd/9/4\');">Exd 9:4__NRExd/9/6\');">6__NRExd/9/26\');">26__NBExd/10/23\');">Exd 10:23__NBExd/11/6\');">Exd 11:6__NRExd/11/7\');">7__NBExd/12/13\');">Exd 12:13__NBMal/3/18\');">Mal 3:18__AN__GHknow_2__PSknow__EFExd/8/10\');">Exd 8:10__NBExd/7/17\');">Exd 7:17__NBEze/30/19\');">Eze 30:19__AN__GGmidst_3__PSmidst__FFPsa/74/12\');">Psa 74:12__NBPsa/110/2\');">Psa 110:2__EN';
stringArray[23] = 'And I will put __PNa_division_1__SHa division</a> between my people and thy people: __PNto_morrow_2__SHto morrow</a> shall this sign be.__CPa_division_1__PSa division__EEHeb. a redemption.__GHto_morrow_2__PSto morrow__FEor, by to-morrow.</TD></TR>';
stringArray[24] = 'And the LORD did so; and __PNthere_1__SHthere</a> came a grievous swarm [of flies] into the house of Pharaoh, and [into] his servants\' houses, and into all __PNthe_land_2__SHthe land</a> of Egypt: the land was __PNcorrupted_3__SHcorrupted</a> by reason of the swarm [of flies].__CPthere_1__PSthere__FFExd/8/21\');">Exd 8:21__NBPsa/78/45\');">Psa 78:45__NBPsa/105/31\');">Psa 105:31__AN__GHthe_land_2__PSthe land__FEHow intolerable a plague of flies can prove, is evident from the fact that whole districts have been laid waste by them. The inhabitants have been forced to quit their cities, not being able to stand against the flies and gnats with which they were pestered. Hence different people had deities whose office it was to defend them against flies. Among these may be reckoned Baalzebub, the fly-god of Ekron; Hercules, muscarum abactor, Hercules the expeller of flies; and hence Jupiter had the titles of [apomuios, muiagros, muiochoros] because he was supposed to expel flies, and especially clear his temples of these insects. See Bryant. See on __NAExd/8/14\');">Exd 8:14__AN.__GGcorrupted_3__PScorrupted__EEor destroyed.</TD></TR>';
