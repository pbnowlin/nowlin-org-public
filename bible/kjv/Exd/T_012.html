stringArray[40] = 'Now the __PNsojourning_2__SHsojourning</a> of the children of Israel, who dwelt in Egypt, [was] __PNfour_hundred_3__SHfour hundred</a> and thirty years.__CPRelated_Verses1_1__PSEntire Verse.__EEThe Samaritan Pentateuch reads, ?Now the sojourning of the children of Israel, and of their fathers in the land of Canaan and in the land of Egypt, was 430 years?. The Alexandrine copy of the LXX. has the same reading; and the same statement is made by the apostle Paul, in __NAGal/3/17\');">Gal 3:17__AN, who reckons from the promise made to Abraham to the giving of the law. That these three witnesses have the truth, the chronology itself proves; for it is evident that the descendants of Israel did not dwell 430 years in Egypt; while it is equally evident, that the period from Abraham?s entry into Canaan to the Exodus, is exactly that number. Thus, from Abraham?s entrance into the promised land to the birth of Isaac, was 25 years; Isaac was 60 at the birth of Jacob; Jacob was 130 at his going into Egypt; where he and his children continued 215 years more; making in the whole 430 years. See Kennicott?s Dissertation on the Hebrew Text.__GHsojourning_2__PSsojourning__EFAct/13/17\');">Act 13:17__NBHbr/11/9\');">Hbr 11:9__AN__GGfour_hundred_3__PSfour hundred__FFGen/12/1\');">Gen 12:1-3__NBGen/15/13\');">Gen 15:13__NBAct/7/6\');">Act 7:6__NBGal/3/16\');">Gal 3:16__NRGal/3/17\');">17__EN';
