stringArray[2] = 'Speak unto the children of Israel, __PNthat_they_1__SHthat they</a> turn and encamp before __PNPi_hahiroth_2__SHPihahiroth</a>, between __PNMigdol_3__SHMigdol</a> and the sea, over against __PNBaal_zephon_4__SHBaalzephon</a>: before it shall ye encamp by the sea.__CPthat_they_1__PSthat they__FFExd/14/9\');">Exd 14:9__NBExd/13/17\');">Exd 13:17__NRExd/13/18\');">18__NBNum/33/7\');">Num 33:7__NRNum/33/8\');">8__AN__GHPi_hahiroth_2__PSPi-hahiroth__FE"Pi-hachiroth, ""the mouth of Chiroth,"" as it is rendered by the LXX. Dr. Shaw is of opinion, that Chiroth denotes the valley which extends from the wilderness of Etham to the Red Sea. ""This valley,"" he observes, ""ends at the sea in a small bay made by the eastern extremities of the mountains (of Gewoubee and Attackah, between which the valley lies) which I have been describing, and is called Tiah-Beni-Israel, i.e., the road of the Israelites, by a tradition that is still kept up by the Arabs, of their having passed through it; so it is also called Baideah, from the new and unheard of miracle that was wrought near it, by dividing the Red sea, and destroying therein Pharaoh, his chariots, and his horsemen."""__GGMigdol_3__PSMigdol__EE"The word Migdol signifies a tower, and hence some have supposed that it was a fortress which served to defend the bay. But the LXX. render it [Magdólos] Magdolus, which is mentioned by Herodotus, Hecatæus, and others, and is expressly said by Stephanus (de Urb.) to be [polis Aigyptou] ""a city of Egypt."" This Bochart conjectures to have been the same as Migdol. See the Parallel Passages. __NAJer/44/1\');">Jer 44:1__NBJer/46/14\');">Jer 46:14__NBEze/29/10\');">Eze 29:10__AN; Heb."__GHBaal_zephon_4__PSBaal-zephon__FEThis may have been the name of a town or city in which Baal was worshipped; and probably called zephon, from being situated on the north point of the Red sea, near the present Suez.</TD></TR>';

stringArray[16] = 'But __PNlift_1__SHlift</a> thou up thy rod, and stretch out thine hand over __PNthe_sea_2__SHthe sea</a>, and divide it: __PNand_the_3__SHand the</a> children of Israel shall go on dry [ground] through the midst of the sea.__CPlift_1__PSlift__FFExd/14/21\');">Exd 14:21__NRExd/14/26\');">26__NBExd/4/2\');">Exd 4:2__NRExd/4/17\');">17__NRExd/4/20\');">20__NBExd/7/9\');">Exd 7:9__NRExd/7/19\');">19__AN__GHthe_sea_2__PSthe sea__FE"This sea was what is called in Scripture yam suph, ""the sea of weeds;"" so called, according to Mr. Bruce, from the vast quantity of coral which grows in it. In the LXX. it is called [thalassa erythra] and by the Latins Rubrum mare, and we from them the Red Sea; so called it is supposed, from Edom (red) or Esau, whose territories extend to its coasts. It separates Arabia from Egypt and Ethiopia, and is computed to be 150 leagues in length from Suez to the straits of Babelmandel. The upper part is divided into two gulfs, that to the East called the Elanitic, from the city Elana at the northern extremity, and that to the west, the Heroopolitic, from the city of Heroopolis. The former is called by the Arabians Bahr el Akaba, the sea of Akaba; and the latter Bahr el Kolzum, the sea of destruction, or Clysmæ; which was that which the Israelites passed."__GGand_the_3__PSand the__FFExd/14/21\');">Exd 14:21__NRExd/14/22\');">22__EN';
