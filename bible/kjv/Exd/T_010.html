stringArray[4] = 'Else, if thou refuse to let my people go, behold, __PNto_morrow_1__SHto morrow</a> will I bring the __PNlocusts_2__SHlocusts</a> into thy coast:__CPto_morrow_1__PSto morrow__FFExd/8/10\');">Exd 8:10__NRExd/8/23\');">23__NBExd/9/5\');">Exd 9:5__NRExd/9/18\');">18__NBExd/11/4\');">Exd 11:4__NRExd/11/5\');">5__AN__GHlocusts_2__PSlocusts__FEThe word arbeh, Locust, is derived from ravah, to multiply, be numerous, etc., because they are more prolific than any other insect, and because of the immense swarms of them by which different countries, especially the East, are infested. The locust, in entomology, belongs to a genus of insects known among naturalists by the name of Grylli; which includes three species, crickets, grasshoppers, and locusts. The common great brown locust is about three inches in length; has two antennæ about an inch long, and two pair of wings. The head and horns are brown; the mouth and inside of the larger legs bluish; the upper side of the body and upper wings brown, the former spotted with black, and the latter with dusky spots. The back is defended by a shield of a greenish hue: the under wings are of a light brown, tinctured with green, and nearly transparent. It has a large open mouth, in the two jaws of which it has four teeth, which traverse each other like scissors, being calculated, from their mechanism, to gripe or</TD></TR>';
