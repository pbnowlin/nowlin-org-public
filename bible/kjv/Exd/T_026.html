var stringArray = new Array();
stringArray[1] = 'Moreover thou shalt make __PNthe_tabernacle_with_ten_curtains_1__SHthe tabernacle [with] ten curtains</a> [of] __PNfine_twined_linen_2__SHfine twined linen</a>, and blue, and purple, and scarlet: [with] __PNcherubims_3__SHcherubims</a> of __PNcunning_work_4__SHcunning work</a> shalt thou make them.__CPthe_tabernacle_with_ten_curtains_1__PSthe tabernacle with ten curtains__EE"The word mishcan, from shachan, to dwell, means simply a dwelling-place, or habitation. ""When God had brought the children of Israel out of Egypt,"" says the very learned Dr. Cudworth, ""resolving to manifest himself in a peculiar manner present among them, he thought good to dwell amongst them in a visible and external manner; and therefore, while they were in the wilderness, and sojourned in tents, he would have a tent or tabernacle built, to sojourn with them also.--Now, the tabernacle being thus a house for God to dwell in visibly, to make up the notion of dwelling or habitation complete, there must be all things suitable to a house belonging to it. Hence, in the holy place, there must be a table and a candlestick, because these were the ordinary furniture of a room. The table must have its dishes, and spoons, and bowls, and covers, belonging to it, though they were never used; and always be furnished with bread upon it. The candlestick must have its lamps continually burning, etc."" __NAExd/25/8\');">Exd 25:8__NBExd/36/8\');">Exd 36:8-19__AN; E"__GHfine_twined_linen_2__PSfine twined linen__EFExd/26/36\');">Exd 26:36__NBExd/25/4\');">Exd 25:4__NBExd/35/6\');">Exd 35:6__NRExd/35/35\');">35__NBRev/19/8\');">Rev 19:8__AN__GGcherubims_3__PScherubims__FFExd/25/18\');">Exd 25:18__AN__GHcunning_work_4__PScunning work__FEHeb. the work of a cunning workman, or embroiderer.</TD></TR>';
stringArray[2] = 'The length of one __PNcurtain_1__SHcurtain</a> [shall be] eight and twenty cubits, and the breadth of one curtain four cubits: and every one of the curtains shall have one measure.__CPcurtain_1__PScurtain__FFExd/26/7\');">Exd 26:7__NRExd/26/8\');">8__NBNum/4/25\');">Num 4:25__NB2Sa/7/2\');">2Sa 7:2__NB1Ch/17/1\');">1Ch 17:1__EN';
stringArray[3] = 'The five curtains shall be __PNcoupled_together_1__SHcoupled together</a> one to another; and [other] five curtains [shall be] coupled one to another.__CPcoupled_together_1__PScoupled together__FFExd/26/9\');">Exd 26:9__NBExd/36/10\');">Exd 36:10__NBJhn/17/21\');">Jhn 17:21__NB1Cr/12/4\');">1Cr 12:4__NR1Cr/12/12\');">12-27__NBEph/2/21\');">Eph 2:21__NREph/2/22\');">22__NBEph/4/3\');">Eph 4:3-6__NREph/4/16\');">16__NBCol/2/2\');">Col 2:2__NRCol/2/19\');">19__EN';
stringArray[4] = 'And thou shalt make __PNloops_of_blue_1__SHloops of blue</a> upon the edge of the one curtain from the selvedge in the coupling; and likewise shalt thou make in the uttermost edge of [another] curtain, in the coupling of the second.__CPloops_of_blue_1__PSloops of blue__FFExd/26/5\');">Exd 26:5__NRExd/26/10\');">10__NRExd/26/11\');">11__NBExd/36/11\');">Exd 36:11__NRExd/36/12\');">12__NRExd/36/17\');">17__EN';
stringArray[5] = 'Fifty loops shalt thou make in the one curtain, and fifty loops shalt thou make in the edge of the curtain that [is] in the coupling of the second; that the loops may take hold one of another.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[6] = 'And thou shalt make fifty __PNtaches_of_gold_1__SHtaches of gold</a>, and couple the curtains together with the taches: and it shall be __PNone_tabernacle_2__SHone tabernacle</a>.__CPtaches_of_gold_1__PStaches of gold__FFExd/26/11\');">Exd 26:11__NRExd/26/33\');">33__NBExd/35/11\');">Exd 35:11__NBExd/36/13\');">Exd 36:13__NRExd/36/18\');">18__NBExd/39/33\');">Exd 39:33__AN__GHone_tabernacle_2__PSone tabernacle__EFEph/1/22\');">Eph 1:22__NREph/1/23\');">23__NBEph/4/16\');">Eph 4:16__NB1Pe/2/4\');">1Pe 2:4__NR1Pe/2/5\');">5__EN';
stringArray[7] = 'And thou shalt make __PNcurtains_1__SHcurtains</a> [of] __PNgoats__hair_2__SHgoats\' [hair]</a> to be __PNa_3__SHa</a> covering upon the tabernacle: __PNeleven_4__SHeleven</a> curtains shalt thou make.__CPcurtains_1__PScurtains__FFExd/35/26\');">Exd 35:26__NBExd/36/14\');">Exd 36:14-18__NBNum/4/25\');">Num 4:25__NBPsa/45/13\');">Psa 45:13__NB1Pe/3/4\');">1Pe 3:4__NB1Pe/5/5\');">1Pe 5:5__AN__GHgoats__hair_2__PSgoats\' hair__FEIzzim, goats, but used here elliptically for goats\' hair. In different parts of Asia Minor, Syria, Cilicia, and Phrygia, the goats have long, fine, and beautiful hair; in some cases, almost as fine as silk, which is shorn at proper times, and manufactured into garments. __NAExd/25/4\');">Exd 25:4__NBExd/35/6\');">Exd 35:6__NRExd/35/23\');">23__NBNum/31/20\');">Num 31:20__AN__GGa_3__PSa__FFExd/26/14\');">Exd 26:14__NBIsa/4/5\');">Isa 4:5__AN__GHeleven_4__PSeleven__EFExd/26/1\');">Exd 26:1__NRExd/26/9\');">9__NRExd/26/12\');">12__EN';
stringArray[8] = 'The __PNlength_of_one_curtain_1__SHlength of one curtain</a> [shall be] thirty cubits, and the breadth of one curtain four cubits: and the eleven curtains [shall be all] of one measure.__CPlength_of_one_curtain_1__PSlength of one curtain__FFExd/26/2\');">Exd 26:2__NRExd/26/13\');">13__EN';
stringArray[9] = 'And thou shalt couple __PNfive_curtains_by_themselves_1__SHfive curtains by themselves</a>, and six curtains by themselves, and shalt double the sixth curtain in the forefront of the tabernacle.__CPfive_curtains_by_themselves_1__PSfive curtains by themselves__FFExd/26/3\');">Exd 26:3__EN';
stringArray[10] = 'And thou shalt make __PNfifty_loops_1__SHfifty loops</a> on the edge of the one curtain [that is] outmost in the coupling, and fifty loops in the edge of the curtain which coupleth the second.__CPfifty_loops_1__PSfifty loops__FFExd/26/4\');">Exd 26:4-6__EN';
stringArray[11] = 'And thou shalt make fifty taches of brass, and put the taches into the loops, and couple the __PNtent_1__SHtent</a> together, that it may be one.__CPtent_1__PStent__EEor, covering. __NAExd/26/3\');">Exd 26:3__NRExd/26/6\');">6__EN';
stringArray[12] = 'And the remnant that remaineth of the curtains of the tent, the half curtain that remaineth, __PNshall_hang_over_1__SHshall hang over</a> the backside of the tabernacle.__CPshall_hang_over_1__PSshall hang over__FFExd/26/9\');">Exd 26:9__EN';
stringArray[13] = 'And __PNa_cubit_1__SHa cubit</a> on the one side, and a cubit on the other side __PNof_that_which_remaineth_2__SHof that which remaineth</a> in the length of the curtains of the tent, it shall hang over the sides of the tabernacle on this side and on that side, to cover it.__CPa_cubit_1__PSa cubit__FFExd/26/2\');">Exd 26:2__NRExd/26/8\');">8__AN__GHof_that_which_remaineth_2__PSof that which remaineth__FEHeb. in the remainder or surplusage.</TD></TR>';
stringArray[14] = 'And thou shalt make __PNa_covering_1__SHa covering</a> for the tent [of] __PNrams__skins_dyed_red_2__SHrams\' skins dyed red</a>, and a covering above [of] __PNbadgers__skins_3__SHbadgers\' skins</a>.__CPa_covering_1__PSa covering__FFExd/36/19\');">Exd 36:19__NBNum/4/5\');">Num 4:5__NBPsa/27/5\');">Psa 27:5__NBPsa/121/4\');">Psa 121:4__NRPsa/121/5\');">5__NBIsa/4/6\');">Isa 4:6__NBIsa/25/4\');">Isa 25:4__AN__GHrams__skins_dyed_red_2__PSrams\' skins dyed red__FEOroth ailim meoddamim, literally, the skins of red rams. It is a fact, attested by many respectable travellers, that in the Levant, sheep are often met with having red or violet coloured fleeces. Almost all ancient writers speak of the same thing. __NAExd/25/5\');">Exd 25:5__NBExd/35/7\');">Exd 35:7__NRExd/35/23\');">23__NBExd/39/34\');">Exd 39:34__NBNum/4/10\');">Num 4:10__NBEze/16/10\');">Eze 16:10__AN__GGbadgers__skins_3__PSbadgers\' skins__EEOroth techashim, which nearly all the ancient versions have taken to be the name of a colour, though they differ very much with regard to the particular colour intended: the LXX., Vulgate, and Coptic, have skins dyed of a violet colour; the Syriac, azure; and the Arabic, black; and Bochart contends for the hysginus, a very deep blue. It may, however, denote an animal; for Dr. Geddes remarks, had the sacred writer meant to express only a variety of colour, he would hardly have repeated óroth, skins, after meoddamim, red, in __NAExd/25/5\');">Exd 25:5__AN.</TD></TR>';
stringArray[15] = 'And thou shalt make __PNboards_1__SHboards</a> for the tabernacle __PNof_shittim_2__SH[of] shittim</a> wood standing up.__CPboards_1__PSboards__FFExd/26/18\');">Exd 26:18__NRExd/26/22\');">22-29__NBExd/36/20\');">Exd 36:20-33__NBExd/40/17\');">Exd 40:17__NRExd/40/18\');">18__NBNum/4/31\');">Num 4:31__NRNum/4/32\');">32__NBEph/2/20\');">Eph 2:20__NREph/2/21\');">21__AN__GHof_shittim_2__PSof shittim__EFExd/25/5\');">Exd 25:5__EN';

stringArray[17] = 'Two __PNtenons_1__SHtenons</a> [shall there be] in one board, set in order one against another: thus shalt thou make for all the boards of the tabernacle.__CPtenons_1__PStenons__EEHeb. hands. __NAExd/26/19\');">Exd 26:19__NBExd/36/22\');">Exd 36:22__NRExd/36/24\');">24__EN';

stringArray[19] = 'And thou shalt make __PNforty_sockets_of_silver_1__SHforty sockets of silver</a> under the twenty boards; two sockets under one board for his two tenons, and two sockets under another board for his two tenons.__CPforty_sockets_of_silver_1__PSforty sockets of silver__FFExd/26/25\');">Exd 26:25__NRExd/26/37\');">37__NBExd/27/10\');">Exd 27:10__NRExd/27/12\');">12-18__NBExd/36/24\');">Exd 36:24-26__NBExd/38/27\');">Exd 38:27__NRExd/38/30\');">30__NRExd/38/31\');">31__NBExd/40/18\');">Exd 40:18__NBNum/3/36\');">Num 3:36__NBNum/4/31\');">Num 4:31__NRNum/4/32\');">32__NBSgs/5/15\');">Sgs 5:15__EN';

stringArray[24] = 'And they shall __PNbe_coupled_1__SHbe coupled</a> together beneath, __PNand_they_shall_be_coupled_together_above_2__SHand they shall be coupled together above</a> the head of it unto one ring: thus shall it be for them both; they shall be for the two corners.__CPbe_coupled_1__PSbe coupled__EEHeb. twined.__GHand_they_shall_be_coupled_together_above_2__PSand they shall be coupled together above__EFExd/36/29\');">Exd 36:29__NRExd/36/30\');">30__NBPsa/133/1\');">Psa 133:1-3__NB1Cr/1/10\');">1Cr 1:10__NB1Cr/3/16\');">1Cr 3:16__NB1Pe/2/5\');">1Pe 2:5__EN';

stringArray[26] = 'And thou shalt make __PNbars_of_shittim_wood_1__SHbars [of] shittim wood</a>; five for the boards of the one side of the tabernacle,__CPbars_of_shittim_wood_1__PSbars of shittim wood__FFExd/36/31\');">Exd 36:31-38__NBNum/3/36\');">Num 3:36__NBNum/4/31\');">Num 4:31__NBRom/15/1\');">Rom 15:1__NB1Cr/9/19\');">1Cr 9:19__NR1Cr/9/20\');">20__NBGal/6/1\');">Gal 6:1__NRGal/6/2\');">2__NBEph/4/16\');">Eph 4:16__NBCol/2/19\');">Col 2:19__EN';

stringArray[29] = 'And thou shalt __PNoverlay_the_boards_with_gold_1__SHoverlay the boards with gold</a>, and make their rings [of] gold [for] places for the bars: and thou shalt overlay the bars with gold.__CPoverlay_the_boards_with_gold_1__PSoverlay the boards with gold__FFExd/25/11\');">Exd 25:11__NRExd/25/12\');">12__EN';
stringArray[30] = 'And thou shalt __PNrear_up_the_tabernacle_1__SHrear up the tabernacle</a> __PNaccording_to_the_fashion_2__SHaccording to the fashion</a> thereof which was shewed thee in the mount.__CPrear_up_the_tabernacle_1__PSrear up the tabernacle__FFExd/40/2\');">Exd 40:2__NRExd/40/17\');">17__NRExd/40/18\');">18__NBNum/10/21\');">Num 10:21__NBJos/18/1\');">Jos 18:1__NBHbr/8/2\');">Hbr 8:2__AN__GHaccording_to_the_fashion_2__PSaccording to the fashion__EFExd/25/9\');">Exd 25:9__NRExd/25/40\');">40__NBExd/27/8\');">Exd 27:8__NBAct/7/44\');">Act 7:44__NBHbr/8/5\');">Hbr 8:5__NBHbr/9/23\');">Hbr 9:23__EN';
stringArray[31] = 'And thou shalt make __PNa_vail_of_1__SHa vail [of]</a> __PNblue_2__SHblue</a>, and __PNpurple_3__SHpurple</a>, and __PNscarlet_4__SHscarlet</a>, and fine twined linen of __PNcunning_work_5__SHcunning work</a>: with __PNcherubims_shall_it_be_made_6__SHcherubims shall it be made</a>:__CPa_vail_of_1__PSa vail of__FFExd/36/35\');">Exd 36:35__NBExd/40/3\');">Exd 40:3__NRExd/40/21\');">21__NBLev/16/2\');">Lev 16:2__NRLev/16/15\');">15__NB2Ch/3/14\');">2Ch 3:14__NBMat/27/51\');">Mat 27:51__NBMar/15/38\');">Mar 15:38__NBLuk/23/45\');">Luk 23:45__NBEph/2/14\');">Eph 2:14__NBHbr/9/3\');">Hbr 9:3-8__NBHbr/10/20\');">Hbr 10:20__NRHbr/10/21\');">21__AN__GHblue_2__PSblue__EFExd/25/4\');">Exd 25:4__NBExd/35/6\');">Exd 35:6__NRExd/35/25\');">25__NRExd/35/35\');">35__NBExd/36/8\');">Exd 36:8__AN__GGpurple_3__PSpurple__EEArgaman, a very precious colour, extracted from the purpura, or murex, a species of shell-fish; and supposed to be the same with the costly and much celebrated Tyrian purple.__GHscarlet_4__PSscarlet__FETolaâth; properly the worm whence the scarlet colour was produced; which grew in a coccus, or excrescence, of a shrub of the ilex kind, like the cochineal worm in the Opuntia of America; which is arranged under the same genus as the Arabic Kermez, which also denotes this colour.__GGcunning_work_5__PScunning work__FFExd/26/1\');">Exd 26:1__NBExd/28/15\');">Exd 28:15__NBExd/38/23\');">Exd 38:23__NB2Ch/2/7\');">2Ch 2:7-13__NBPsa/137/5\');">Psa 137:5__NBSgs/7/1\');">Sgs 7:1__AN__GHcherubims_shall_it_be_made_6__PScherubims shall it be made__EFExd/25/18\');">Exd 25:18__EN';
stringArray[32] = 'And thou shalt hang it upon four __PNpillars_of_shittim_1__SHpillars of shittim</a> [wood] overlaid with gold: __PNtheir_hooks_shall_be_of_gold_2__SHtheir hooks [shall be of] gold</a>, upon the four sockets of silver.__CPpillars_of_shittim_1__PSpillars of shittim__FFExd/26/37\');">Exd 26:37__NBExd/36/38\');">Exd 36:38__NBEst/1/6\');">Est 1:6__AN__GHtheir_hooks_shall_be_of_gold_2__PStheir hooks shall be of gold__FEThe Hebrew waveyhem, which we translate their hooks, is rendered by the LXX. [kephalides] and by the Vulgate, capiata, capitals. Hence Calmet contends, 1. That if Moses does not mean the capitals of the pillars by this word, he mentions them nowhere else; and it would seem strange, that while he describes them with so much exactness, that he should not mention the capitals; or that pillars every way so correctly formed, should have been destitute of this necessary ornament. 2. As Moses was commanded to make the wavim of the pillars, and their fillets, of silver, (__NAExd/27/10\');">Exd 27:10__AN, __NAExd/27/11\');">11__AN,) and the wavim of the pillars of the vail of gold, (__NAExd/36/36\');">Exd 36:36__AN,) and that 1,775 shekels were employed in making them, overlaying their chapiters, rasheyhem, their heads, and filleting them, (__NAExd/38/28\');">Exd 38:28__AN,) it is more reasonable to suppose that all this is spoken of the capitals of pillars, than of any kind of hooks, especially as hooks are mentioned under the word taches or clasps. But as the root wavah seems to signify to connect, (for [w</TD></TR>';
stringArray[33] = 'And thou shalt hang up the vail under __PNthe_taches_1__SHthe taches</a>, that thou mayest bring in thither __PNwithin_the_vail_2__SHwithin the vail</a> __PNthe_ark_of_the_testimony_3__SHthe ark of the testimony</a>: and the vail shall divide unto you between __PNthe_holy_place_4__SHthe holy [place]</a> and the most holy.__CPthe_taches_1__PSthe taches__FFExd/27/10\');">Exd 27:10__NBExd/36/36\');">Exd 36:36__AN__GHwithin_the_vail_2__PSwithin the vail__EFGen/9/4\');">Gen 9:4__NRGen/9/5\');">5__AN__GGthe_ark_of_the_testimony_3__PSthe ark of the testimony__FFExd/25/16\');">Exd 25:16__NBExd/40/21\');">Exd 40:21__AN__GHthe_holy_place_4__PSthe holy place__EFLev/16/2\');">Lev 16:2__NB1Ki/8/6\');">1Ki 8:6__NR1Ki/8/10\');">10__NB2Ch/5/7\');">2Ch 5:7-10__NBHbr/9/2\');">Hbr 9:2__NRHbr/9/3\');">3__EN';

stringArray[35] = 'And thou shalt set __PNthe_table_1__SHthe table</a> without the vail, and __PNthe_candlestick_2__SHthe candlestick</a> over against the table on the side of the tabernacle toward the south: and thou shalt put the table on the north side.__CPthe_table_1__PSthe table__FFExd/40/22\');">Exd 40:22__NBHbr/9/2\');">Hbr 9:2__NRHbr/9/8\');">8__NRHbr/9/9\');">9__AN__GHthe_candlestick_2__PSthe candlestick__EFExd/25/31\');">Exd 25:31-37__NBExd/40/24\');">Exd 40:24__EN';
stringArray[36] = 'And thou shalt make an __PNhanging_1__SHhanging</a> for the door of __PNthe_tent_2__SHthe tent</a>, __PNof_blue_3__SH[of] blue</a>, and purple, and scarlet, and fine twined linen, wrought with needlework.__CPhanging_1__PShanging__EE"This may be termed the first vail, as it occupied the door or entrance to the tabernacle; the vail that separated the Holy of Holies is called the second vail, __NAHbr/9/3\');">Hbr 9:3__AN. Mr. Morier, (Second Journey Through Persia, p. 251,) describing the tent of a chief of the Eelauts, says, ""It was composed of a wooden frame of circular laths, which were fixed on the ground, and then covered over with large felts, that were fastened down by a cord, ornamented by tassels of various colours. A curtain, curiously worked by the women, with coarse needle-work of various colours, was suspended over the door. In the king of Persia\'s tents, magnificent perdahs, or hangings of needle-work, are suspended, as well as on the doors of the great mosques in Turkey; and these circumstances combined, will, perhaps, illustrate __NAExd/26/36\');">Exd 26:36__AN."" __NAExd/36/37\');">Exd 36:37__NBExd/40/28\');">Exd 40:28__NBJhn/10/9\');">Jhn 10:9__NBJhn/14/6\');">Jhn 14:6__AN"__GHthe_tent_2__PSthe tent__EFExd/35/11\');">Exd 35:11__NBExd/39/33\');">Exd 39:33__NBExd/40/29\');">Exd 40:29__NBNum/3/25\');">Num 3:25__NBNum/9/15\');">Num 9:15__NB2Sa/7/6\');">2Sa 7:6__NBPsa/78/60\');">Psa 78:60__AN__GGof_blue_3__PSof blue__EENULL</TD></TR>';
