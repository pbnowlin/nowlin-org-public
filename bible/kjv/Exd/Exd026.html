Text[7] = 'And thou shalt make curtains [of] goats\' [hair] to be a covering upon the tabernacle: eleven curtains shalt thou make.';
Text[8] = 'The length of one curtain [shall be] thirty cubits, and the breadth of one curtain four cubits: and the eleven curtains [shall be all] of one measure.';
Text[9] = 'And thou shalt couple five curtains by themselves, and six curtains by themselves, and shalt double the sixth curtain in the forefront of the tabernacle.';

Text[11] = 'And thou shalt make fifty taches of brass, and put the taches into the loops, and couple the tent together, that it may be one.';
Text[12] = 'And the remnant that remaineth of the curtains of the tent, the half curtain that remaineth, shall hang over the backside of the tabernacle.';
Text[13] = 'And a cubit on the one side, and a cubit on the other side of that which remaineth in the length of the curtains of the tent, it shall hang over the sides of the tabernacle on this side and on that side, to cover it.';
Text[14] = 'And thou shalt make a covering for the tent [of] rams\' skins dyed red, and a covering above [of] badgers\' skins.';
Text[15] = 'And thou shalt make boards for the tabernacle [of] shittim wood standing up.';
Text[16] = 'Ten cubits [shall be] the length of a board, and a cubit and a half [shall be] the breadth of one board.';
Text[17] = 'Two tenons [shall there be] in one board, set in order one against another: thus shalt thou make for all the boards of the tabernacle.';
Text[18] = 'And thou shalt make the boards for the tabernacle, twenty boards on the south side southward.';
Text[19] = 'And thou shalt make forty sockets of silver under the twenty boards; two sockets under one board for his two tenons, and two sockets under another board for his two tenons.';
Text[20] = 'And for the second side of the tabernacle on the north side [there shall be] twenty boards:';
Text[21] = 'And their forty sockets [of] silver; two sockets under one board, and two sockets under another board.';
Text[22] = 'And for the sides of the tabernacle westward thou shalt make six boards.';
Text[23] = 'And two boards shalt thou make for the corners of the tabernacle in the two sides.';
Text[24] = 'And they shall be coupled together beneath, and they shall be coupled together above the head of it unto one ring: thus shall it be for them both; they shall be for the two corners.';
Text[25] = 'And they shall be eight boards, and their sockets [of] silver, sixteen sockets; two sockets under one board, and two sockets under another board.';
Text[26] = 'And thou shalt make bars [of] shittim wood; five for the boards of the one side of the tabernacle,';

Text[28] = 'And the middle bar in the midst of the boards shall reach from end to end.';
