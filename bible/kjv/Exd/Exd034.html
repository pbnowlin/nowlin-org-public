Text[10] = 'And he said, Behold, I make a covenant: before all thy people I will do marvels, such as have not been done in all the earth, nor in any nation: and all the people among which thou [art] shall see the work of the LORD: for it [is] a terrible thing that I will do with thee.';
Text[11] = 'Observe thou that which I command thee this day: behold, I drive out before thee the Amorite, and the Canaanite, and the Hittite, and the Perizzite, and the Hivite, and the Jebusite.';
Text[12] = 'Take heed to thyself, lest thou make a covenant with the inhabitants of the land whither thou goest, lest it be for a snare in the midst of thee:';

Text[17] = 'Thou shalt make thee no molten gods.';
Text[18] = 'The feast of unleavened bread shalt thou keep. Seven days thou shalt eat unleavened bread, as I commanded thee, in the time of the month Abib: for in the month Abib thou camest out from Egypt.';
Text[19] = 'All that openeth the matrix [is] mine; and every firstling among thy cattle, [whether] ox or sheep, [that is male].';
Text[20] = 'But the firstling of an ass thou shalt redeem with a lamb: and if thou redeem [him] not, then shalt thou break his neck. All the firstborn of thy sons thou shalt redeem. And none shall appear before me empty.';
Text[21] = 'Six days thou shalt work, but on the seventh day thou shalt rest: in earing time and in harvest thou shalt rest.';
Text[22] = 'And thou shalt observe the feast of weeks, of the firstfruits of wheat harvest, and the feast of ingathering at the year\'s end.';
Text[23] = 'Thrice in the year shall all your men children appear before the Lord GOD, the God of Israel.';
Text[24] = 'For I will cast out the nations before thee, and enlarge thy borders: neither shall any man desire thy land, when thou shalt go up to appear before the LORD thy God thrice in the year.';
Text[25] = 'Thou shalt not offer the blood of my sacrifice with leaven; neither shall the sacrifice of the feast of the passover be left unto the morning.';
Text[26] = 'The first of the firstfruits of thy land thou shalt bring unto the house of the LORD thy God. Thou shalt not seethe a kid in his mother\'s milk.';
