stringArray[31] = 'And the house of Israel __PNcalled_the_name_1__SHcalled the name</a> thereof Manna: __PNand_it_was_2__SHand it [was]</a> like coriander seed, white; and the taste of it [was] like wafers [made] with honey.__CPcalled_the_name_1__PScalled the name__FFExd/16/15\');">Exd 16:15__AN; In consequence of the term manna having been given to a drug which is now much used in England, many persons have ignorantly supposed it to be the same sort of thing as that miraculously sent for the sustenance of the children of Israel in the wilderness. The manna of commerce comes from Calabria and Sicily, where it oozes out of a kind of ash tree, from the end of June to the end of July, and is a thick, clammy, sweet juice, partly drawn from the tree by the rays of the sun, partly by the puncture of insects, and partly by artificial means. The European manna is not so good as the Oriental, which is gathered in Syria, Arabia, and Persia, from the Oriental oak, and from a shrub which is called in Persia {teranjabin.}__GHand_it_was_2__PSand it was__EFNum/11/6\');">Num 11:6__NRNum/11/7\');">7__NBSgs/2/3\');">Sgs 2:3__EN';
