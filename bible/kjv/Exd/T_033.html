stringArray[20] = 'And he said, __PNThou_canst_not_1__SHThou canst not</a> see my face: for there shall no man see me, and live.__CPThou_canst_not_1__PSThou canst not__EE"This is well explained by Rabbi Jehudah, in Sepher Cosri, (P. iv.  3.) ""Of that divine glory mentioned in the Scripture, there is one degree which the eyes of the prophets were able to explore; another which all the Israelites saw, as the cloud and consuming fire; the third is so bright, and so dazzling, that no mortal is able to comprehend it; but should anyone venture to look on it, his whole frame would be dissolved."" In such inconceivable splendour is the Divine Majesty revealed to the inhabitants of the celestial world, where he is said to ""dwell in the light which no man can approach unto."" (__NA1Ti/6/16\');">1Ti 6:16__AN.) By the ""face of God,"" therefore, we are to understand that light inaccessible before which angels may stand, but which would be so insufferable to mortal eyes, that no man could see it and live. __NAExd/24/10\');">Exd 24:10__NBGen/32/30\');">Gen 32:30__NBDeu/5/24\');">Deu 5:24__NBJdg/6/22\');">Jdg 6:22__NBJdg/13/22\');">Jdg 13:22__NBIsa/6/5\');">Isa 6:5__NBJhn/1/18\');">Jhn 1:18__NB1Ti/6/16\');">1Ti 6:16__NBHbr/1/13\');">Hbr 1:13__NBRev/1/16\');">Rev 1:16__NRRev/1/17\');">17__AN"</TD></TR>';
