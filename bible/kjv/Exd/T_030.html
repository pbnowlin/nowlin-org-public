stringArray[23] = 'Take thou also unto __PNthee_principal_1__SHthee principal</a> spices, of __PNpure_myrrh_2__SHpure myrrh</a> five hundred [shekels], and of sweet __PNcinnamon_3__SHcinnamon</a> half so much, [even] two hundred and fifty [shekels], and of __PNsweet_calamus_4__SHsweet calamus</a> two hundred and fifty [shekels],__CPthee_principal_1__PSthee principal__FFExd/37/29\');">Exd 37:29__NBPsa/45/8\');">Psa 45:8__NBPro/7/17\');">Pro 7:17__NBSgs/1/3\');">Sgs 1:3__NRSgs/1/13\');">13__NBSgs/4/14\');">Sgs 4:14__NBJer/6/20\');">Jer 6:20__NBEze/27/19\');">Eze 27:19__NREze/27/22\');">22__AN__GHpure_myrrh_2__PSpure myrrh__FEMyrrh is a white gum, issuing from the trunk and larger branches of a thorny tree resembling the acacia, growing in Arabia, Egypt, and Abyssinia. Its taste is extremely bitter; but its smell, though strong, is agreeable; and it entered into the composition of the most costly ointments among the ancients. The epithet deror, rendered pure, properly denotes fluid, from the Arabic darra, to flow; by which is meant the finest and most excellent kind, called stacte, which issues of itself from the bark without incision.__GGcinnamon_3__PScinnamon__EEKinnamon bosem, odoriferous or spicy cinnamon, is the bark of the canella, a small tree of the size of a willow growing in the island of Ceylon.__GHsweet_calamus_4__PSsweet calamus__FEKenaih bosem, calamus aromaticus, or odoriferous cane, is a reed growing in Egypt, Syria, and India, about two feet in height, bearing from the root a knotted stalk, quite round, containing in its cavity a soft white pith. It is said to scent the air while growing; and when cut down, dried, and powdered, makes an ingredient in the richest perfumes.</TD></TR>';

stringArray[34] = 'And the LORD said unto Moses, Take __PNunto_thee_1__SHunto thee</a> sweet spices, __PNstacte_2__SHstacte</a>, and __PNonycha_3__SHonycha</a>, and __PNgalbanum_4__SHgalbanum</a>; [these] sweet spices with pure __PNfrankincense_5__SHfrankincense</a>: of each shall there be a like [weight]:__CPunto_thee_1__PSunto thee__FFExd/30/23\');">Exd 30:23__NBExd/25/6\');">Exd 25:6__NBExd/37/29\');">Exd 37:29__AN__GHstacte_2__PSstacte__FEHeb. nataph. The Jews and others suppose it to be what was afterwards called the balm of Jericho, or Gilead.__GGonycha_3__PSonycha__EEThe word shechaileth is generally allowed to denote onycha, (nail-fish, from its form,) as it is rendered by the LXX. and Vulgate. It is the shell of the purpura, and of the whole class of murex; and serves as the basis of the principal perfumes in India.__GHgalbanum_4__PSgalbanum__FEChelbenah, (probably from chalay, milk or gum, and lavan, white,) is the gummy, resinous juice of an umbelliferous plant, the bubon gumniferum of Linnæus, growing in Syria, Persia, and Africa. It rises with a ligneous stalk from eight to ten feet, and is garnished with leaves at every joint. The top of the stalk is terminated by an umbel of yellow flowers which are succeeded by oblong channelled seeds, which have a thin membrane or wing on their border. When any part of the plant is broken, there issues out a little thin juice, of a cream colour, of a fat, tough substance, like gum ammoniac, composed of many small, shining grains, of a strong, piercing smell and a sharp, warm taste.__GGfrankincense_5__PSfrankincense__FFLev/2/1\');">Lev 2:1__NRLev/2/15\');">15__NBLev/5/11\');">Lev 5:11__NBLev/24/7\');">Lev 24:7__NB1Ch/9/29\');">1Ch 9:29__NR1Ch/9/30\');">30__NBNeh/13/5\');">Neh 13:5__NBSgs/3/6\');">Sgs 3:6__NBMat/2/11\');">Mat 2:11__EN';
