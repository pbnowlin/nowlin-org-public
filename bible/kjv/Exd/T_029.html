stringArray[20] = 'Then shalt thou kill the ram, and take of his blood, and __PNput_it_upon_the_tip_1__SHput [it] upon the tip</a> of the right ear of Aaron, and upon the tip of the right ear of his sons, and upon the thumb of their right hand, and upon the great toe of their right foot, and __PNsprinkle_2__SHsprinkle</a> the blood upon the altar round about.__CPput_it_upon_the_tip_1__PSput it upon the tip__EEAll this doubtless was intended to signify, that the priest should dedicate all his faculties and powers to the service of God; his ear to the hearing and study of the law; his hands to diligence in the sacred ministry, and to all acts of obedience; and his feet to walking in the way of God\'s precepts; for the ear is the symbol of obedience, the hand of action, and the foot of the path or conduct in life. And the sprinkling might further teach him, that he could neither hear, work, nor walk profitably, uprightly, and well pleasingly in the sight of God, without the application of the blood of the sacrifice. __NALev/8/24\');">Lev 8:24__NBLev/14/14\');">Lev 14:14__NBIsa/50/5\');">Isa 50:5__NBMar/7/33\');">Mar 7:33__AN__GHsprinkle_2__PSsprinkle__EFLev/14/7\');">Lev 14:7__NRLev/14/16\');">16__NBLev/16/14\');">Lev 16:14__NRLev/16/15\');">15__NRLev/16/19\');">19__NBIsa/52/15\');">Isa 52:15__NBHbr/9/19\');">Hbr 9:19-23__NBHbr/10/22\');">Hbr 10:22__NBHbr/12/24\');">Hbr 12:24__NB1Pe/1/2\');">1Pe 1:2__EN';

stringArray[22] = '__PNAlso_thou_1__SHAlso thou</a> shalt take of the ram the fat and __PNthe_rump_2__SHthe rump</a>, and the fat that covereth the inwards, and the caul [above] the liver, and the two kidneys, and the fat that [is] upon them, and the __PNright_shoulder_3__SHright shoulder</a>; for it [is] a ram of consecration:__CPAlso_thou_1__PSAlso thou__FFExd/29/13\');">Exd 29:13__NBLev/8/25\');">Lev 8:25-27__AN__GHthe_rump_2__PSthe rump__FE"Alyah is the large tail of a species of eastern sheep. ""This tail,"" says Dr. Russell, ""is very broad and large, terminating in a small appendix that turns back upon it. It is of a substance between fat and marrow, and is not eaten separately, but mixed with lean meat in many of their dishes, and also often used instead of butter. A common sheep of this sort, without the head, feet, skin, and entrails, weighs about twelve or fourteen Aleppo rotoloes, (a rotoloe is five pounds,) of which the tail is usually three rotoloes or upwards; but such as are of the largest breed, and have been fattened, will sometimes weigh about thirty rotoloes, and the tails of these ten."" __NALev/3/9\');">Lev 3:9__NBLev/7/3\');">Lev 7:3__NBLev/9/19\');">Lev 9:19__AN"__GGright_shoulder_3__PSright shoulder__FFLev/7/32\');">Lev 7:32__NRLev/7/33\');">33__NBLev/9/21\');">Lev 9:21__NBLev/10/14\');">Lev 10:14__NBNum/18/18\');">Num 18:18__EN';
