stringArray[3] = 'And when she __PNcould_not_1__SHcould not</a> longer hide him, she took for him __PNan_ark_2__SHan ark</a> of __PNbulrushes_3__SHbulrushes</a>, and daubed it __PNwith_slime_4__SHwith slime</a> and with pitch, and put the child therein; and she laid [it] in the flags by the river\'s brink.__CPcould_not_1__PScould not__FFExd/1/22\');">Exd 1:22__NBMat/2/13\');">Mat 2:13__NRMat/2/16\');">16__NBAct/7/19\');">Act 7:19__AN__GHan_ark_2__PSan ark__EFIsa/18/2\');">Isa 18:2__AN__GGbulrushes_3__PSbulrushes__EEGomé, is the papyrus, so famous in all antiquity. It grows on the banks of the Nile, and in marshy grounds; the stalk rises to the height of six or seven cubits above the water, is triangular, and terminates in a crown of small filaments, resembling hair. This reed was of the greatest use to the Egyptians; the pith serving them for food, and the woody part to build vessels with; which vessels frequently appear on various monuments of Egyptian antiquity. That boats were made of this reed is also attested by Pliny and others.__GHwith_slime_4__PSwith slime__EFGen/6/14\');">Gen 6:14__NBGen/11/3\');">Gen 11:3__NBGen/14/10\');">Gen 14:10__EN';
