stringArray[2] = 'For if thou refuse to let [them] go, and wilt hold them still,__CPRelated_Verses1_1__PSEntire Verse.__FFExd/4/23\');">Exd 4:23__NBExd/8/2\');">Exd 8:2__NBExd/10/4\');">Exd 10:4__NBLev/26/14\');">Lev 26:14-16__NRLev/26/23\');">23__NRLev/26/24\');">24__NRLev/26/27\');">27__NRLev/26/28\');">28__NBPsa/7/11\');">Psa 7:11__NRPsa/7/12\');">12__NBPsa/68/21\');">Psa 68:21__NBIsa/1/20\');">Isa 1:20__NBRom/2/8\');">Rom 2:8__NBRev/2/21\');">Rev 2:21__NRRev/2/22\');">22__NBRev/16/9\');">Rev 16:9__EN';
stringArray[3] = 'Behold, __PNthe_hand_1__SHthe hand</a> of the LORD is upon thy cattle which [is] in the field, upon the horses, upon the asses, upon the camels, upon the oxen, and upon the sheep: [there shall be] a very grievous __PNmurrain_2__SHmurrain</a>.__CPthe_hand_1__PSthe hand__FFExd/7/4\');">Exd 7:4__NBExd/8/19\');">Exd 8:19__NB1Sa/5/6\');">1Sa 5:6-11__NB1Sa/6/9\');">1Sa 6:9__NBAct/13/11\');">Act 13:11__AN__GHmurrain_2__PSmurrain__FEWe may observe a particular scope and meaning in this calamity, if we consider it in regard to the Egyptians, which would not have existed in respect to any other people. They held in idolatrous reverence almost every animal, but some they held in particular veneration; as the ox, cow, and ram. Among these, Apis and Mnevis are well known; the former being a sacred bull, worshipped at Memphis, as the latter was at Heliopolis. A cow or heifer had the like honours at Momemphis; and the same practice seems to have been adopted in most of the Egyptian nomes. By the infliction of this judgment, the Egyptian deities sank before the God of the Hebrews. See Bryant, pp. 87-93. __NAExd/5/3\');">Exd 5:3__EN';

stringArray[7] = 'And Pharaoh sent, and, behold, there was not one of the cattle of the Israelites dead. And __PNthe_heart_1__SHthe heart</a> of Pharaoh was hardened, and he did not let the people go.__CPthe_heart_1__PSthe heart__FFExd/9/12\');">Exd 9:12__NBExd/7/14\');">Exd 7:14__NBExd/8/32\');">Exd 8:32__NBJob/9/4\');">Job 9:4__NBPro/29/1\');">Pro 29:1__NBIsa/48/4\');">Isa 48:4__NBDan/5/20\');">Dan 5:20__NBRom/9/18\');">Rom 9:18__EN';
stringArray[8] = 'And the LORD said unto Moses and unto Aaron, __PNTake_to_1__SHTake to</a> you handfuls of ashes of the furnace, and let Moses sprinkle it toward the heaven in the sight of Pharaoh.__CPTake_to_1__PSTake to__EEThis was a significant command; not only referring to the fiery furnace, which was a type of the slavery of the Israelites, but to a cruel rite common among the Egyptians. They had several cities styled Typhonian, in which at particular seasons they sacrificed men, who were burnt alive; and the ashes of the victim were scattered upwards in the air, with the view, probably, that where any atom of dust was carried, a blessing was entailed. The like, therefore, was done by Moses, though with a different intention, and more certain effect. See Bryant, pp. 93-106. __NAExd/8/16\');">Exd 8:16__EN';

stringArray[17] = 'As yet exaltest thou thyself against my people, that thou wilt not let them go?__CPRelated_Verses1_1__PSEntire Verse.__FFJob/9/4\');">Job 9:4__NBJob/15/25\');">Job 15:25__NRJob/15/26\');">26__NBJob/40/9\');">Job 40:9__NBIsa/10/15\');">Isa 10:15__NBIsa/26/11\');">Isa 26:11__NBIsa/37/23\');">Isa 37:23__NRIsa/37/24\');">24__NRIsa/37/29\');">29__NBIsa/45/9\');">Isa 45:9__NBAct/12/23\');">Act 12:23__NB1Cr/10/22\');">1Cr 10:22__EN';
stringArray[18] = 'Behold, __PNto_morrow_1__SHto morrow</a> about this time __PNI_will_cause_2__SHI will cause</a> it to rain a very grievous hail, such as hath not been in Egypt since the foundation thereof even until now.__CPto_morrow_1__PSto morrow__FF1Ki/19/2\');">1Ki 19:2__NB1Ki/20/6\');">1Ki 20:6__NB2Ki/7/1\');">2Ki 7:1__NR2Ki/7/18\');">18__AN__GHI_will_cause_2__PSI will cause__FEThis must have been a circumstance of all others the most incredible to an Egyptian; for in Egypt there fell no rain, the want of which was supplied by dews, and the overflowing of the Nile. The Egyptians must, therefore, have perceived themselves particularly aimed at in these fearful events, especially as they were very superstitious. There seems likewise a propriety in their being punished by fire and water, as they were guilty of the grossest idolatry towards these elements. Scarcely any thing could have distressed the Egyptians more than the destruction of the flax, as the whole nation wore linen garments. The ruin of their barley was equally fatal, both to their trade and to their private advantage. See Bryant, pp. 108-117. __NAExd/9/22\');">Exd 9:22-25__NBPsa/83/15\');">Psa 83:15__EN';

stringArray[23] = 'And Moses stretched forth his rod toward heaven: and __PNthe_LORD_sent_1__SHthe LORD sent</a> thunder __PNand_hail_2__SHand hail</a>, and the fire ran along upon the ground; and the LORD rained hail upon the land of Egypt.__CPthe_LORD_sent_1__PSthe LORD sent__FFExd/19/16\');">Exd 19:16__NBExd/20/18\');">Exd 20:18__NB1Sa/12/17\');">1Sa 12:17__NR1Sa/12/18\');">18__NBJob/37/1\');">Job 37:1-5__NBPsa/29/3\');">Psa 29:3__NBPsa/77/18\');">Psa 77:18__NBRev/16/18\');">Rev 16:18__NRRev/16/21\');">21__AN__GHand_hail_2__PSand hail__EFJos/10/11\');">Jos 10:11__NBJob/38/22\');">Job 38:22__NRJob/38/23\');">23__NBPsa/18/13\');">Psa 18:13__NBPsa/78/47\');">Psa 78:47__NRPsa/78/48\');">48__NBPsa/105/32\');">Psa 105:32__NRPsa/105/33\');">33__NBPsa/148/8\');">Psa 148:8__NBIsa/30/30\');">Isa 30:30__NBEze/38/22\');">Eze 38:22__NBRev/8/7\');">Rev 8:7__EN';

stringArray[27] = 'And Pharaoh sent, and called for Moses and Aaron, and said unto them, __PNI_have_1__SHI have</a> sinned this time: __PNthe_LORD_2__SHthe LORD</a> [is] righteous, and I and my people [are] wicked.__CPI_have_1__PSI have__FFExd/10/16\');">Exd 10:16__NBNum/22/34\');">Num 22:34__NB1Sa/15/24\');">1Sa 15:24__NR1Sa/15/30\');">30__NB1Sa/26/21\');">1Sa 26:21__NBMat/27/4\');">Mat 27:4__AN__GHthe_LORD_2__PSthe LORD__EF2Ch/12/6\');">2Ch 12:6__NBPsa/9/16\');">Psa 9:16__NBPsa/129/4\');">Psa 129:4__NBPsa/145/17\');">Psa 145:17__NBLam/1/18\');">Lam 1:18__NBDan/9/14\');">Dan 9:14__NBRom/2/5\');">Rom 2:5__NBRom/3/19\');">Rom 3:19__EN';

stringArray[29] = 'And Moses said unto him, As soon as I am gone out of the city, I will __PNspread_1__SHspread</a> abroad my hands unto the LORD; [and] the thunder shall cease, neither shall there be any more hail; that thou mayest know how __PNthat_the_earth_2__SHthat the earth</a> [is] the LORD\'S.__CPspread_1__PSspread__FFExd/9/33\');">Exd 9:33__NB1Ki/8/22\');">1Ki 8:22__NR1Ki/8/38\');">38__NB2Ch/6/12\');">2Ch 6:12__NR2Ch/6/13\');">13__NBEzr/9/5\');">Ezr 9:5__NBJob/11/13\');">Job 11:13__NBPsa/143/6\');">Psa 143:6__NBIsa/1/15\');">Isa 1:15__AN__GHthat_the_earth_2__PSthat the earth__EFDeu/10/14\');">Deu 10:14__NBPsa/24/1\');">Psa 24:1__NRPsa/24/2\');">2__NBPsa/50/12\');">Psa 50:12__NBPsa/95/4\');">Psa 95:4__NRPsa/95/5\');">5__NBPsa/135/6\');">Psa 135:6__NB1Cr/10/26\');">1Cr 10:26__NR1Cr/10/28\');">28__EN';
stringArray[30] = 'But as for thee and thy servants, I know that ye will not yet fear the LORD God.__CPRelated_Verses1_1__PSEntire Verse.__FFPro/16/6\');">Pro 16:6__NBIsa/26/10\');">Isa 26:10__NBIsa/63/17\');">Isa 63:17__EN';
stringArray[31] = 'And the __PNflax_1__SHflax</a> and __PNthe_barley_2__SHthe barley</a> was smitten: for the barley [was] in the ear, and the flax [was] bolled.__CPflax_1__PSflax__EEThe word pishteh, flax, Mr. Parkhurst thinks may be derived from pashat, to strip, because the substance which we call flax is properly the filaments of the bark or rind of the vegetable, stripped off the stalks. From time immemorial, Egypt was celebrated for the production and manufacture of flax; and hence the linen and fine linen of Egypt, so often spoken of in scripture and ancient authors.__GHthe_barley_2__PSthe barley__FEThe Hebrew seórah, barley, in Arabic shair, and shairat, is so called from its rough, bristly beard, with which the ears are covered and defended; from saâr, to stand on end as the hair of the head: hence seâr, the hair of the head. So its Latin name hordeum is from horreo, to stand on end as the hair. Dr. Pococke has observed that there is a double seed time and harvest in Egypt; rice, India wheat, and a grain called the corn of Damascus, are sown and reaped at a very different time from wheat, barley, and flax. The first are sown in March, before the overflowing of the Nile, and reaped about October; whereas the wheat and barley are sown in November and December, as soon as the Nile has gone off, and reaped before May. __NARth/1/22\');">Rth 1:22__NBRth/2/23\');">Rth 2:23__NBAmo/4/9\');">Amo 4:9__NBHab/3/17\');">Hab 3:17__EN';
