Text[9] = 'And the LORD said unto Moses, I have seen this people, and, behold, it [is] a stiffnecked people:';

Text[14] = 'And the LORD repented of the evil which he thought to do unto his people.';

Text[29] = 'For Moses had said, Consecrate yourselves to day to the LORD, even every man upon his son, and upon his brother; that he may bestow upon you a blessing this day.';

Text[33] = 'And the LORD said unto Moses, Whosoever hath sinned against me, him will I blot out of my book.';
