var stringArray = new Array();
stringArray[1] = 'And of __PNthe_blue_1__SHthe blue</a>, and purple, and scarlet, they made __PNcloths_2__SHcloths</a> of service, to do service in the __PNholy_place_3__SHholy [place]</a>, and made __PNthe_holy_4__SHthe holy</a> garments for Aaron; as the LORD commanded Moses.__CPthe_blue_1__PSthe blue__FFExd/25/4\');">Exd 25:4__NBExd/26/1\');">Exd 26:1__NBExd/35/23\');">Exd 35:23__AN__GHcloths_2__PScloths__EFExd/31/10\');">Exd 31:10__NBExd/35/19\');">Exd 35:19__AN__GGholy_place_3__PSholy place__FFPsa/93/5\');">Psa 93:5__NBEze/43/12\');">Eze 43:12__NBHbr/9/12\');">Hbr 9:12__NRHbr/9/25\');">25__AN__GHthe_holy_4__PSthe holy__EFExd/28/2\');">Exd 28:2-4__NBExd/31/10\');">Exd 31:10__NBEze/42/14\');">Eze 42:14__EN';

stringArray[3] = 'And they did beat the gold into thin plates, and cut [it into] wires, to work [it] in the blue, and in the purple, and in the scarlet, and in the fine linen, [with] __PNcunning_work_1__SHcunning work</a>.__CPcunning_work_1__PScunning work__FFExd/26/1\');">Exd 26:1__NBExd/36/8\');">Exd 36:8__EN';
stringArray[4] = 'They made shoulderpieces for it, to couple [it] together: by the two edges was it coupled together.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[5] = 'And the __PNcurious_1__SHcurious</a> girdle of his ephod, that [was] upon it, [was] of the same, according to the work thereof; [of] gold, blue, and purple, and scarlet, and fine twined linen; __PNas_the_LORD_2__SHas the LORD</a> commanded Moses.__CPcurious_1__PScurious__FFExd/28/8\');">Exd 28:8__NBExd/29/5\');">Exd 29:5__NBLev/8/7\');">Lev 8:7__NBIsa/11/5\');">Isa 11:5__NBRev/1/13\');">Rev 1:13__AN__GHas_the_LORD_2__PSas the LORD__EFMat/28/20\');">Mat 28:20__NB1Cr/11/23\');">1Cr 11:23__EN';
stringArray[6] = 'And they wrought __PNonyx_stones_1__SHonyx stones</a> inclosed in __PNouches_2__SHouches</a> of gold, graven, as signets are graven, with the names of the children of Israel.__CPonyx_stones_1__PSonyx stones__EEThe meaning of the word shoham is not easily determined. It has been variously rendered a beryl, emerald, prasius, sapphire, sardius, ruby, carnelian, onyx, and sardonyx. It may signify both the onyx and sardonyx. The latter stone is a mixture of the chalcedony and carnelian, sometimes in strata, and at other times blended together, and is found striped with white and red strata, or layers. It is generally allowed that there is no real difference, except in hardness, between the carnelian, chalcedony, agate, sardonyx, and onyx. The onyx is of a darkish horny colour, resembling the nail or hoof, from which circumstance it has its name [(onyx).] It has often a plate of a blueish white or red in it, and when on one or both sides of this white there appears a plate of a reddish colour, the jewellers call the stone a sardonyx. __NAExd/25/7\');">Exd 25:7__NBExd/28/9\');">Exd 28:9__NBExd/35/9\');">Exd 35:9__NBJob/28/16\');">Job 28:16__NBEze/28/13\');">Eze 28:13__AN__GHouches_2__PSouches__FEMishbetzoth, strait places, sockets, to insert the stones in, from shavatz, to straiten, enclose.</TD></TR>';
stringArray[7] = 'And he put them on the shoulders of the ephod, [that they should be] stones for __PNa_memorial_1__SHa memorial</a> to the children of Israel; as the LORD commanded Moses.__CPa_memorial_1__PSa memorial__FFExd/28/12\');">Exd 28:12__NRExd/28/29\');">29__NBJos/4/7\');">Jos 4:7__NBNeh/2/20\');">Neh 2:20__NBMar/14/9\');">Mar 14:9__NRMar/14/22\');">22-25__EN';
stringArray[8] = 'And he made the breastplate [of] cunning work, like the work of the ephod; [of] gold, blue, and purple, and scarlet, and fine twined linen.__CPRelated_Verses1_1__PSEntire Verse.__FFExd/25/7\');">Exd 25:7__NBExd/28/4\');">Exd 28:4__NRExd/28/13\');">13-29__NBLev/8/8\');">Lev 8:8__NRLev/8/9\');">9__NBPsa/89/28\');">Psa 89:28__NBIsa/59/17\');">Isa 59:17__NBEph/6/14\');">Eph 6:14__EN';
stringArray[9] = 'It was foursquare; they made the breastplate double: a span [was] the length thereof, and a span the breadth thereof, [being] doubled.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[10] = 'And they set in it four rows of stones: [the first] row [was] a sardius, a topaz, and a carbuncle: this [was] __PNthe_first_row_1__SHthe first row</a>.__CPthe_first_row_1__PSthe first row__FFExd/28/16\');">Exd 28:16__NRExd/28/17\');">17__NRExd/28/21\');">21__NBRev/21/19\');">Rev 21:19-21__AN__GHsardius_2__PSsardius__FEor, ruby.</TD></TR>';
stringArray[11] = 'And the second row, an emerald, a sapphire, and __PNa_diamond_1__SHa diamond</a>.__CPa_diamond_1__PSa diamond__FFExd/28/18\');">Exd 28:18__NBEze/28/13\');">Eze 28:13__AN; The word {yahalom} may mean the diamond, from {halam,} to beat, smite, because of its extreme hardness, by which it will beat to pieces the other stones. It is a fine pellucid substance never debased with any admixture of other matter; susceptible of elegant tinges from metal-line particles; giving fire with steel; not fermenting with acid menstrua; scarcely calcinable by any degree of fire; and of one simple and permanent appearance in all lights. It is the hardest and most valuable of all gems; when pure, perfectly clear and pellucid as the clearest water, and eminently distinguished from all other substances by its vivid splendour, and the brightness of its reflections.</TD></TR>';
stringArray[12] = 'And the third row, __PNa_ligure_1__SHa ligure</a>, __PNan_agate_2__SHan agate</a>, and __PNan_amethyst_3__SHan amethyst</a>.__CPa_ligure_1__PSa ligure__EELeshem, the ligure, the same as the jacinth, or hyacinth, a precious stone of a deep red, with a considerable tinge of yellow. Theophrastus and Pliny say it resembles the carbuncle, of a brightness sparkling like fire.__GHan_agate_2__PSan agate__FEShevo, the agate, a semi-pellucid compound gem, formed of different simple minerals, as chalcedony, cornelian, jasper. horn-stone, quartz, amethyst, opal, etc.; joined irregularly or in layers. It is of a white, reddish, yellowish, or greenish ground; and so variously figured in its substance as to represent plants, trees, animals, and other objects.__GGan_amethyst_3__PSan amethyst__EEAchlamah, an amethyst, a transparent gem, composed of a strong blue and deep red; and according as either prevails, affording different tinges of purple, sometimes approaching to violet, and sometimes even fading to a pale rose colour.</TD></TR>';
stringArray[13] = 'And the fourth row, __PNa_beryl_1__SHa beryl</a>, an onyx, and __PNa_jasper_2__SHa jasper</a>: [they were] inclosed in ouches of gold in their inclosings.__CPa_beryl_1__PSa beryl__EETarshish, a pellucid gem, of a sea or blueish green colour.__GHa_jasper_2__PSa jasper__FEYaspeh, the jasper, a hard stone, of which there are not less than fifteen varieties of colour, as green, red, yellow, brown, black, etc.</TD></TR>';
