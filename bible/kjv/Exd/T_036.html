stringArray[1] = 'Then wrought __PNBezaleel_2__SHBezaleel</a> and Aholiab, and every __PNwise_hearted_man_3__SHwise hearted man</a>, in whom the LORD put wisdom and understanding to know how to work all manner of work __PNfor_the_service_4__SHfor the service</a> of the sanctuary, __PNaccording_5__SHaccording</a> to all that the LORD had commanded.__CPRelated_Verses1_1__PSEntire Verse.__EEAn. Ex. Is. 1. Tisri to Adar.__GHBezaleel_2__PSBezaleel__EFExd/31/1\');">Exd 31:1-6__NBExd/35/30\');">Exd 35:30-35__AN__GGwise_hearted_man_3__PSwise hearted man__FFExd/28/3\');">Exd 28:3__NBExd/31/6\');">Exd 31:6__AN__GHfor_the_service_4__PSfor the service__EFExd/36/3\');">Exd 36:3__NRExd/36/4\');">4__NBExd/25/8\');">Exd 25:8__NBNum/7/9\');">Num 7:9__NBHbr/8/2\');">Hbr 8:2__AN__GGaccording_5__PSaccording__FFExd/23/21\');">Exd 23:21__NRExd/23/22\');">22__NBExd/39/1\');">Exd 39:1-43__NBExd/40/1\');">Exd 40:1-38__NBPsa/119/6\');">Psa 119:6__NBMat/28/20\');">Mat 28:20__NBLuk/1/6\');">Luk 1:6__EN';
stringArray[2] = 'And Moses called Bezaleel and Aholiab, and every wise hearted man, __PNin_whose_1__SHin whose</a> heart the LORD had put wisdom, [even] every __PNone_whose_2__SHone whose</a> heart stirred him up to come unto the work to do it:__CPin_whose_1__PSin whose__FFExd/28/3\');">Exd 28:3__NBExd/31/6\');">Exd 31:6__NBExd/35/10\');">Exd 35:10__NRExd/35/21\');">21-35__NBAct/6/3\');">Act 6:3__NRAct/6/4\');">4__NBAct/14/23\');">Act 14:23__NBCol/4/17\');">Col 4:17__NBHbr/5/4\');">Hbr 5:4__AN__GHone_whose_2__PSone whose__EFExd/35/2\');">Exd 35:2__NRExd/35/21\');">21__NRExd/35/25\');">25__NRExd/35/26\');">26__NB1Ch/29/5\');">1Ch 29:5__EN';
stringArray[3] = 'And they received of Moses all __PNthe_offering_1__SHthe offering</a>, which the children of Israel had brought for the work of the service of the sanctuary, to make it [withal]. And they brought yet unto him free offerings __PNevery_morning_2__SHevery morning</a>.__CPthe_offering_1__PSthe offering__FFExd/35/5\');">Exd 35:5-21__NRExd/35/27\');">27__NRExd/35/29\');">29__AN__GHevery_morning_2__PSevery morning__EFPsa/5/3\');">Psa 5:3__NBPsa/101/8\');">Psa 101:8__NBPro/8/15\');">Pro 8:15__NBIsa/50/4\');">Isa 50:4__NBJer/21/12\');">Jer 21:12__EN';
stringArray[4] = 'And all the wise men, that wrought all the work of the sanctuary, came every man from his work which they made;__CPRelated_Verses1_1__PSEntire Verse.__FF2Ch/24/13\');">2Ch 24:13__NBMat/24/45\');">Mat 24:45__NBLuk/12/42\');">Luk 12:42__NB1Cr/3/10\');">1Cr 3:10__EN';
stringArray[5] = 'And they spake unto Moses, saying, The people bring much more than enough for the service of the work, which the LORD commanded to make.__CPRelated_Verses1_1__PSEntire Verse.__FFExd/32/3\');">Exd 32:3__NB2Ch/24/14\');">2Ch 24:14__NB2Ch/31/6\');">2Ch 31:6-10__NB2Cr/8/2\');">2Cr 8:2__NR2Cr/8/3\');">3__NBPhl/2/21\');">Phl 2:21__NBPhl/4/17\');">Phl 4:17__NRPhl/4/18\');">18__EN';
stringArray[6] = 'And Moses gave commandment, and they caused it to be proclaimed throughout the camp, saying, Let neither man nor woman make any more work for the offering of the sanctuary. So the people were restrained from bringing.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[7] = 'For the stuff they had was sufficient for all the work to make it, __PNand_too_much_1__SHand too much</a>.__CPand_too_much_1__PSand too much__FF2Ch/31/10\');">2Ch 31:10__EN';
stringArray[8] = 'And every __PNwise_1__SHwise</a> hearted man among them that wrought the work of the tabernacle __PNmade_2__SHmade</a> ten curtains [of] fine twined linen, and blue, and purple, and scarlet: [with] __PNcherubims_3__SHcherubims</a> of cunning work made he them.__CPwise_1__PSwise__FFExd/31/6\');">Exd 31:6__NBExd/35/10\');">Exd 35:10__AN__GHmade_2__PSmade__EFExd/26/1\');">Exd 26:1-37__NB1Ch/15/1\');">1Ch 15:1__AN__GGcherubims_3__PScherubims__EE"Keroovim, cherubim, not cherubims. What these were we cannot determine. Some, observing that the verb kerav in Syriac, sometimes means to resemble, make like, conceive the noun keroov signifies no more than an image, figure, or representation of anything. Josephus says they were flying animals, like none of those which are seen by man, but such as Moses saw about the throne of God. In another place he says, ""As for the cherubim, nobody can tell or conceive what they were like."" These symbolical figures, according to the description of them by Ezekiel, in __NAEze/1/10\');">Eze 1:10__NBEze/10/14\');">10:14__AN; were creatures with four heads and one body; and the animals of which these forms consisted were the noblest of their kind; the lion among the wild beasts; the bull among the tame ones; the eagle among the birds, and man at the head of all. Hence some have conceived them to be somewhat of the shape of flying oxen; and it is alleged in favour of this opinion, that the far more common meaning of the verb kerav, in Chaldee, Syriac, and Arabic, b"</TD></TR>';
stringArray[9] = 'The length of one curtain [was] twenty and eight cubits, and the breadth of one curtain four cubits: the curtains [were] all of one size.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[10] = 'And he coupled the five curtains one unto another: and [the other] five curtains he coupled one unto another.__CPRelated_Verses1_1__PSEntire Verse.__FFExd/26/3\');">Exd 26:3__NBPsa/122/3\');">Psa 122:3__NBPsa/133/1\');">Psa 133:1__NBZep/3/9\');">Zep 3:9__NBAct/2/1\');">Act 2:1__NB1Cr/1/10\');">1Cr 1:10__NB1Cr/12/20\');">1Cr 12:20__NR1Cr/12/27\');">27__NBEph/1/23\');">Eph 1:23__NBEph/2/21\');">Eph 2:21__NREph/2/22\');">22__NBEph/4/2\');">Eph 4:2-6__NBPhl/2/2\');">Phl 2:2__NBPhl/3/15\');">Phl 3:15__EN';
stringArray[11] = 'And he made loops of blue on the edge of one curtain from the selvedge in the coupling: likewise he made in the uttermost side of [another] curtain, in the coupling of the second.__CPRelated_Verses1_1__PSEntire Verse.__FFExd/26/4\');">Exd 26:4__EN';
stringArray[12] = 'Fifty loops made he in one curtain, and fifty loops made he in the edge of the curtain which [was] in the coupling of the second: the loops held one [curtain] to another.__CPRelated_Verses1_1__PSEntire Verse.__FFExd/26/5\');">Exd 26:5__NRExd/26/10\');">10__EN';
stringArray[13] = 'And he made fifty taches of gold, and coupled the curtains one unto another with the taches: __PNso_it_became_1__SHso it became</a> one tabernacle.__CPso_it_became_1__PSso it became__FF1Cr/12/20\');">1Cr 12:20__NBEph/2/20\');">Eph 2:20-22__NB1Pe/2/4\');">1Pe 2:4__NR1Pe/2/5\');">5__EN';
stringArray[14] = 'And he made curtains [of] goats\' [hair] for the tent over the tabernacle: eleven curtains he made them.__CPRelated_Verses1_1__PSEntire Verse.__FFExd/26/7\');">Exd 26:7-13__EN';
stringArray[15] = 'The length of one curtain [was] thirty cubits, and four cubits [was] the breadth of one curtain: the eleven curtains [were] of one size.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[16] = 'And he coupled five curtains by themselves, and six curtains by themselves.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[17] = 'And he made fifty loops upon the uttermost edge of the curtain in the coupling, and fifty loops made he upon the edge of the curtain which coupleth the second.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[18] = 'And he made fifty taches [of] brass to couple the tent together, that it might be one.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[19] = 'And he made a __PNcovering_1__SHcovering</a> for the tent [of] __PNrams__skins_dyed_red_2__SHrams\' skins dyed red</a>, and a covering [of] badgers\' skins above [that].__CPcovering_1__PScovering__FFExd/26/14\');">Exd 26:14__AN__GHrams__skins_dyed_red_2__PSrams\' skins dyed red__FEThis was the third covering of the tabernacle. The first and lowermost was made of fine linen, richly embroidered with figures of cherubim, in shades of blue, purple, and scarlet (__NAExd/36/8\');">Exd 36:8-13__AN). It is reasonable to suppose, that the right side of this curtain was undermost, and so it formed a beautiful ceiling in the inside of the tabernacle. The second covering, which lay over the embroidered one, was made of a sort of mohair, (__NAExd/36/14\');">Exd 36:14-17__AN,) and the fourth, or uppermost one, which was to keep the others from the weather, was made of tachash, or badgers\' skins. __NAExd/25/5\');">Exd 25:5__EN';
stringArray[20] = 'And he made __PNboards_1__SHboards</a> for the tabernacle [of] __PNshittim_wood_2__SHshittim wood</a>, standing up.__CPboards_1__PSboards__FFExd/26/15\');">Exd 26:15-25__NBExd/40/18\');">Exd 40:18__NRExd/40/19\');">19__AN__GHshittim_wood_2__PSshittim wood__EFExd/25/5\');">Exd 25:5__NRExd/25/10\');">10__NBNum/25/1\');">Num 25:1__NBDeu/10/3\');">Deu 10:3__EN';
stringArray[21] = '__PNThe_length_1__SHThe length</a> of a board [was] ten cubits, and the breadth of a board one cubit and a half.__CPThe_length_1__PSThe length__EEEach of these boards, taking the cubit at nearly twenty-two inches, was about eighteen feet long, and two feet nine inches broad. As these boards are said to be standing up (__NAExd/36/20\');">Exd 36:20__AN,) their length was consequently the height of the tabernacle; and as the two sides were composed of twenty of these, standing up (__NAExd/36/23\');">Exd 36:23__AN, __NAExd/36/25\');">25__AN,) and the west end of six, with two boards to project at the corners, (__NAExd/36/27\');">Exd 36:27__AN, __NAExd/36/28\');">28__AN,) the tabernacle must therefore, have been thirty cubits, or fifty-five feet long, and about ten cubits, or eighteen feet broad. These boards were fastened at the bottom by two tenons in each board, which fitted into two mortices in the foundation, at the top by links or hasps, and on the sides by five wooden bars, which ran through rings or staples in each of the boards. The boards and bars were all overlaid with gold; and their rings for the staves, and their hasps at top, were of the same metal. The foundation on which they stood consisted of about ninety-six solid blocks of silver, two under each boa</TD></TR>';
stringArray[22] = 'One board had two tenons, equally distant one from another: thus did he make for all the boards of the tabernacle.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[23] = 'And he made boards for the tabernacle; twenty boards for the south side southward:__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[24] = 'And forty sockets of silver he made under the twenty boards; two sockets under one board for his two tenons, and two sockets under another board for his two tenons.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[25] = 'And for the other side of the tabernacle, [which is] toward the north corner, he made twenty boards,__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[26] = 'And their forty sockets of silver; two sockets under one board, and two sockets under another board.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[27] = 'And for the sides of the tabernacle __PNwestward_1__SHwestward</a> he made six boards.__CPwestward_1__PSwestward__FFExd/26/22\');">Exd 26:22__NRExd/26/27\');">27__EN';
stringArray[28] = 'And two boards made he for the corners of the tabernacle in the two sides.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[29] = 'And they were __PNcoupled_1__SHcoupled</a> beneath, and coupled together at the head thereof, to one ring: thus he did to both of them in both the corners.__CPcoupled_1__PScoupled__EEHeb. twined. __NAExd/26/24\');">Exd 26:24__NBPsa/122/3\');">Psa 122:3__NBPsa/133/1\');">Psa 133:1__NBAct/2/46\');">Act 2:46__NBAct/4/32\');">Act 4:32__NB1Cr/1/10\');">1Cr 1:10__NB1Cr/12/13\');">1Cr 12:13__NB2Cr/1/10\');">2Cr 1:10__NBEph/2/15\');">Eph 2:15__NREph/2/19\');">19__NREph/2/21\');">21__NBEph/3/18\');">Eph 3:18__NREph/3/19\');">19__NBEph/4/2\');">Eph 4:2-6__NREph/4/15\');">15__NREph/4/16\');">16__EN';
stringArray[30] = 'And there were eight boards; and their sockets [were] sixteen sockets of silver, __PNunder_every_board_two_sockets_1__SHunder every board two sockets</a>.__CPunder_every_board_two_sockets_1__PSunder every board two sockets__EEHeb. two sockets, two sockets, under one board. __NAExd/26/25\');">Exd 26:25__EN';
stringArray[31] = 'And he made bars of shittim wood; five for the boards of the one side of the tabernacle,__CPRelated_Verses1_1__PSEntire Verse.__FFExd/25/28\');">Exd 25:28__NBExd/26/26\');">Exd 26:26-29__NBExd/30/5\');">Exd 30:5__EN';
stringArray[32] = 'And five bars for the boards of the other side of __PNthe_tabernacle_1__SHthe tabernacle</a>, and five bars for the boards of the tabernacle for the sides westward.__CPthe_tabernacle_1__PSthe tabernacle__FFExd/26/26\');">Exd 26:26__EN';
stringArray[33] = 'And he made the middle bar to shoot through the boards from the one end to the other.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[34] = 'And he overlaid the boards with gold, and made their rings [of] gold [to be] places for the bars, and overlaid the bars with gold.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[35] = 'And he made a __PNvail_of_blue_1__SHvail [of] blue</a>, and purple, and scarlet, and fine twined linen: [with] cherubims made he it of cunning work.__CPvail_of_blue_1__PSvail of blue__EEParachoth, from parach, to separate, divide, make a distinction between somewhat, the inner vail, which divided the tabernacle into two, and separated, and made a distinction between the Holy place and the Holy of Holies. This vail was made of the same rich materials as the inner covering of the tabernacle, and curiously embroidered with cherubim and other ornaments. Though it does not appear from Scripture at what distance from either end of the tabernacle this vail was hung, yet is reasonably conjectured, that it divided it in the same proportion in which the temple, built after this model, was divided; that is, two-thirds of the whole length were allotted to the first room, and one-third to the second; so that the room beyond the vail, the Holy of Holies, was exactly square, being ten cubits each way, and the first room, the sanctuary, was twice as long as it was broad. __NAExd/26/31\');">Exd 26:31-35__NBExd/30/6\');">Exd 30:6__NBExd/40/21\');">Exd 40:21__NBMat/27/51\');">Mat 27:51__NBHbr/10/20\');">Hbr 10:20__EN';
stringArray[36] = 'And he made thereunto four pillars [of] shittim [wood], and overlaid them with gold: their hooks [were of] gold; and he cast for them four sockets of silver.__CPRelated_Verses1_1__PSEntire Verse.__FFJer/1/18\');">Jer 1:18__EN';
stringArray[37] = 'And he made __PNan_hanging_1__SHan hanging</a> for the tabernacle door [of] blue, and purple, and scarlet, and fine twined linen, __PNof_needlework_2__SHof needlework</a>;__CPan_hanging_1__PSan hanging__EEThis vail was a fine embroidered curtain, of the same materials and of the same workmanship as the inner vail and inner covering of the tabernacle. The text does not say how low it hung. Philo makes it touch the ground; but Josephus will have it to come down but half way, so that the people might have a view of the inside of the tabernacle; but then he says there was another curtain over that, which came to the ground, to keep it from the weather, and was drawn aside on the sabbath and other festivals. __NAExd/26/36\');">Exd 26:36__NRExd/26/37\');">37__NBExd/40/28\');">Exd 40:28__AN__GHof_needlework_2__PSof needlework__FEHeb. the work of a needle worker, or embroider. __NAExd/26/36\');">Exd 26:36__EN';
