var stringArray = new Array();
stringArray[1] = 'And it was told Joab, Behold, the king weepeth and mourneth for Absalom.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!__GHRelated_Verses2_2__PSEntire Verse.__EF2Sa/18/5\');">2Sa 18:5__NR2Sa/18/12\');">12__NR2Sa/18/14\');">14__NR2Sa/18/20\');">20__NR2Sa/18/33\');">33__NBPro/17/25\');">Pro 17:25__EN';

stringArray[3] = 'And the people gat them by stealth that day __PNinto_the_city_1__SHinto the city</a>, as people being ashamed __PNsteal_2__SHsteal</a> away when they flee in battle.__CPinto_the_city_1__PSinto the city__FF2Sa/19/32\');">2Sa 19:32__NB2Sa/17/24\');">2Sa 17:24__AN__GHsteal_2__PSsteal__EFGen/31/27\');">Gen 31:27__EN';
stringArray[4] = 'But the king __PNcovered_1__SHcovered</a> his face, and the king cried with a loud voice, __PNO_my_son_2__SHO my son</a> Absalom, O Absalom, my son, my son!__CPcovered_1__PScovered__FF2Sa/15/30\');">2Sa 15:30__AN__GHO_my_son_2__PSO my son__FEIt is allowed by competent critics that the lamentation of David over his son, of which this forms a part, is exceedingly pathetic; and Calmet properly remarks, that the frequent repetition of the name of the deceased is common in the language of lamentation. __NA2Sa/18/33\');">2Sa 18:33__EN';
stringArray[5] = 'And Joab came into the house to the king, and said, __PNThou_hast_1__SHThou hast</a> shamed this day the faces of all thy servants, which this day have __PNsaved_2__SHsaved</a> thy life, and the lives of thy sons and of thy daughters, and the lives of thy wives, and the lives of thy concubines;__CPThou_hast_1__PSThou hast__EEEvery one must admit that David\'s immoderate grief for his rebellious son was imprudent, and that Joab\'s firm and sensible reproof was necessary to arouse him to a sense of his duty to his people: but, in his manner, Joab far exceeded the bounds of that reverence which a servant owes to his master, or a subject to his prince.__GHsaved_2__PSsaved__EFNeh/9/27\');">Neh 9:27__NBPsa/3/8\');">Psa 3:8__NBPsa/18/47\');">Psa 18:47__NRPsa/18/48\');">48__EN';
stringArray[6] = '__PNIn_that__etc__1__SHIn that</a> thou lovest thine enemies, and hatest thy friends. For thou hast declared this day, that __PNthou_regardest__etc__2__SHthou regardest</a> neither princes nor servants: for this day I perceive, that if Absalom had lived, and all we had died this day, __PNthen_it_had_3__SHthen it had</a> pleased thee well.__CPIn_that__etc__1__PSIn that, etc.__EEHeb. By loving, etc__GHthou_regardest__etc__2__PSthou regardest, etc.__FEHeb. princes or servants are not to thee__GGthen_it_had_3__PSthen it had__FF2Sa/3/24\');">2Sa 3:24__NR2Sa/3/25\');">25__NBJob/34/18\');">Job 34:18__NBPro/19/9\');">Pro 19:9__NRPro/19/10\');">10__NBAct/23/5\');">Act 23:5__EN';
stringArray[7] = 'Now therefore arise, go forth, and speak __PNcomfortably_unto_thy_1__SHcomfortably unto thy</a> servants: for I swear by the LORD, if thou go not forth, __PNthere_2__SHthere</a> will not tarry one with thee this night: and that will be worse unto thee than __PNall_the_evil_3__SHall the evil</a> that befell thee from thy youth until now.__CPcomfortably_unto_thy_1__PScomfortably unto thy__EEHeb. to the heart of thy. __NAGen/34/3\');">Gen 34:3__NBPro/19/15\');">Pro 19:15__NBIsa/40/1\');">Isa 40:1__NBHsa/2/14\');">Hsa 2:14__AN; *marg:__GHthere_2__PSthere__EFPro/14/28\');">Pro 14:28__AN__GGall_the_evil_3__PSall the evil__FFPsa/71/4\');">Psa 71:4-6__NRPsa/71/9\');">9-11__NRPsa/71/18\');">18-20__NBPsa/129/1\');">Psa 129:1__NRPsa/129/2\');">2__EN';
stringArray[8] = 'Then the king arose, and __PNsat_in_the_gate_1__SHsat in the gate</a>. And they told unto all the people, saying, Behold, the king doth sit in the gate. And all the people came before the king: __PNfor_Israel_2__SHfor Israel</a> had fled every man to his tent.__CPsat_in_the_gate_1__PSsat in the gate__EE"How prudently and mildly David took the reproof and counsel given him! He shook off his grief, anointed his head, and washed his face, that he might not appear unto men to mourn, and then made his appearance at the gate of the city, which was the public place of resort for the hearing of causes and giving judgment, as well as a place to ratify special bargains. Thither the people flocked to congratulate him on his and their safety, and that all was well. When we are convinced of a fault, we must amend, though we are told of it by our inferiors in a way which is peculiarly painful to our natural feelings. This ancient custom still obtains in the East; for when Dr. Pococke returned from viewing the town of ancient Byblus, he says, ""The sheik and the elders were sitting in the gate of the city, after the ancient manner, and I sat awhile with them."" __NA2Sa/18/4\');">2Sa 18:4__NR2Sa/18/24\');">24__AN"__GHfor_Israel_2__PSfor Israel__EF2Sa/19/3\');">2Sa 19:3__NB2Sa/18/6\');">2Sa 18:6-8__NB1Ki/22/36\');">1Ki 22:36__NB2Ki/14/12\');">2Ki 14:12__EN';
stringArray[9] = 'And all the people were at __PNstrife_1__SHstrife</a> throughout all the tribes of Israel, saying, __PNThe_king_2__SHThe king</a> saved us out of the hand of our enemies, and he delivered us out of the hand of the Philistines; and now __PNhe_is_fled_3__SHhe is fled</a> out of the land for Absalom.__CPstrife_1__PSstrife__FFGen/3/12\');">Gen 3:12__NRGen/3/13\');">13__NBExd/32/24\');">Exd 32:24__NBJam/3/14\');">Jam 3:14-16__AN__GHThe_king_2__PSThe king__EF2Sa/8/10\');">2Sa 8:10__NB1Sa/17/50\');">1Sa 17:50__NB1Sa/18/5\');">1Sa 18:5-7__NR1Sa/18/25\');">25__NB1Sa/19/5\');">1Sa 19:5__AN__GGhe_is_fled_3__PShe is fled__FF2Sa/15/14\');">2Sa 15:14__EN';
stringArray[10] = 'And Absalom, __PNwhom_1__SHwhom</a> we anointed over us, __PNis_dead_2__SHis dead</a> in battle. Now therefore why __PNspeak_ye_not_a_word_3__SHspeak ye not a word</a> of bringing the king back?__CPwhom_1__PSwhom__FF2Sa/15/12\');">2Sa 15:12__NR2Sa/15/13\');">13__NBHsa/8/4\');">Hsa 8:4__AN__GHis_dead_2__PSis dead__EF2Sa/18/14\');">2Sa 18:14__AN__GGspeak_ye_not_a_word_3__PSspeak ye not a word__EEHeb. are ye silent? __NAJdg/18/9\');">Jdg 18:9__EN';

stringArray[12] = 'Ye [are] my brethren, ye [are] __PNmy_bones_1__SHmy bones</a> and my flesh: wherefore then are ye the last to bring back the king?__CPmy_bones_1__PSmy bones__FF2Sa/5/1\');">2Sa 5:1__NBGen/2/23\');">Gen 2:23__NBJdg/9/2\');">Jdg 9:2__NBEph/5/30\');">Eph 5:30__EN';

stringArray[14] = 'And __PNhe_bowed_1__SHhe bowed</a> the heart of all the men of Judah, __PNeven_2__SHeven</a> as [the heart of] one man; so that they sent [this word] unto the king, Return thou, and all thy servants.__CPhe_bowed_1__PShe bowed__EEThe measures that he pursued were the best calculated that could be adopted for accomplishing this salutary end. David appears to take no notice of their infidelity, but rather to place confidence in them, that their confidence in him might be naturally excited; and to oblige them yet farther, purposes to make Amasa general of the army, instead of Joab.__GHeven_2__PSeven__EFJdg/20/1\');">Jdg 20:1__NBPsa/110/2\');">Psa 110:2__NRPsa/110/3\');">3__NBAct/4/32\');">Act 4:32__EN';

stringArray[17] = 'And [there were] a thousand men of Benjamin with him, and __PNZiba_1__SHZiba</a> the servant of the house of Saul, and his fifteen sons and his twenty servants with him; and they went over Jordan before the king.__CPZiba_1__PSZiba__FF2Sa/19/26\');">2Sa 19:26__NR2Sa/19/27\');">27__NB2Sa/9/2\');">2Sa 9:2__NR2Sa/9/10\');">10__NB2Sa/16/1\');">2Sa 16:1-4__EN';
stringArray[18] = '__PNAnd_there_1__SHAnd there</a> went over a ferry boat to carry over the king\'s household, and to do __PNwhat_he_thought_good_2__SHwhat he thought good</a>. And Shimei the son of Gera __PNfell_down_3__SHfell down</a> before the king, as he was come over Jordan;__CPAnd_there_1__PSAnd there__EE"The LXX. connecting this the with preceding verse, render, [kai kateuthynan ton lordanen emposthen tou basileos, kai eleitourgesan ten leitourgian tou diabibasai ton basilea] ""and they made ready Jordan before the king, and did the necessary service to bring over the king;"" and the Vulgate has, et irrumpentes Jordanem, ante regem transierunt vada, ut traducerent domum regis, ""and breaking into Jordan, they passed the fords before the king, to bring over the king\'s household."" Josephus says they prepared a bridge over the Jordan, to facilitate his passage."__GHwhat_he_thought_good_2__PSwhat he thought good__FEHeb. the good in his eyes__GGfell_down_3__PSfell down__FFPsa/66/3\');">Psa 66:3__NBPsa/81/15\');">Psa 81:15__NBRev/3/9\');">Rev 3:9__EN';
stringArray[19] = '__PNAnd_said_1__SHAnd said</a> unto the king, __PNLet_not_2__SHLet not</a> my lord impute iniquity unto me, neither do thou __PNremember_3__SHremember</a> that which thy servant __PNdid_perversely_4__SHdid perversely</a> the day that my lord the king went out of Jerusalem, that the king should __PNtake_it_5__SHtake it</a> to his heart.__CPAnd_said_1__PSAnd said__FFEcc/10/4\');">Ecc 10:4__AN__GHLet_not_2__PSLet not__EF1Sa/22/15\');">1Sa 22:15__NBPsa/32/2\');">Psa 32:2__NBRom/4/6\');">Rom 4:6-8__NB2Cr/5/19\');">2Cr 5:19__AN__GGremember_3__PSremember__FFPsa/79/8\');">Psa 79:8__NBIsa/43/25\');">Isa 43:25__NBJer/31/34\');">Jer 31:34__AN__GHdid_perversely_4__PSdid perversely__EF2Sa/16/5\');">2Sa 16:5-9__NR2Sa/16/10\');">10-14__NBExd/10/16\');">Exd 10:16__NRExd/10/17\');">17__NB1Sa/26/21\');">1Sa 26:21__NBMat/27/4\');">Mat 27:4__AN__GGtake_it_5__PStake it__FF2Sa/13/20\');">2Sa 13:20__NR2Sa/13/33\');">33__NB1Sa/25/25\');">1Sa 25:25__EN';
stringArray[20] = 'For thy servant doth know that I have sinned: therefore, behold, __PNI_am_come_1__SHI am come</a> the first this day of all the house of __PNJoseph_2__SHJoseph</a> to go down to meet my lord the king.__CPI_am_come_1__PSI am come__FFPsa/78/34\');">Psa 78:34-37__NBJer/22/23\');">Jer 22:23__NBHsa/5/15\');">Hsa 5:15__AN__GHJoseph_2__PSJoseph__EF2Sa/19/9\');">2Sa 19:9__NB2Sa/16/5\');">2Sa 16:5__NBGen/48/14\');">Gen 48:14__NRGen/48/20\');">20__NB1Ki/12/20\');">1Ki 12:20__NR1Ki/12/25\');">25__NBHsa/4/15\');">Hsa 4:15-17__NBHsa/5/3\');">Hsa 5:3__EN';
stringArray[21] = 'But Abishai the son of Zeruiah answered and said, __PNShall_not_1__SHShall not</a> Shimei be put to death for this, because he __PNcursed_2__SHcursed</a> the LORD\'S anointed?__CPShall_not_1__PSShall not__FFExd/22/28\');">Exd 22:28__NB1Ki/21/10\');">1Ki 21:10__NR1Ki/21/11\');">11__AN__GHcursed_2__PScursed__EF2Sa/16/5\');">2Sa 16:5__NR2Sa/16/7\');">7__NR2Sa/16/13\');">13__NB1Sa/24/6\');">1Sa 24:6__NB1Sa/26/9\');">1Sa 26:9__EN';
stringArray[22] = 'And David said, __PNWhat_have_1__SHWhat have</a> I to do with you, ye sons of Zeruiah, that ye should this day be adversaries unto me? __PNshall_there_any_man_2__SHshall there any man</a> be put to death this day in Israel? for do not I know that I [am] this day king over Israel?__CPWhat_have_1__PSWhat have__FF2Sa/3/39\');">2Sa 3:39__NB2Sa/16/10\');">2Sa 16:10__NB1Sa/26/8\');">1Sa 26:8__NBMat/8/29\');">Mat 8:29__AN__GHshall_there_any_man_2__PSshall there any man__EF1Sa/11/13\');">1Sa 11:13__NBIsa/16/5\');">Isa 16:5__NBLuk/9/54\');">Luk 9:54-56__EN';
stringArray[23] = 'Therefore the king said unto Shimei, __PNThou_shalt_1__SHThou shalt</a> not die. And the king __PNsware_2__SHsware</a> unto him.__CPThou_shalt_1__PSThou shalt__FF1Ki/2/8\');">1Ki 2:8__NR1Ki/2/9\');">9__NR1Ki/2/37\');">37__NR1Ki/2/46\');">46__AN__GHsware_2__PSsware__EF1Sa/28/10\');">1Sa 28:10__NB1Sa/30/15\');">1Sa 30:15__NBHbr/6/16\');">Hbr 6:16__EN';
stringArray[24] = 'And __PNMephibosheth_1__SHMephibosheth</a> the son of Saul came down to meet the king, and had neither __PNdressed_his_feet_2__SHdressed his feet</a>, nor __PNtrimmed_3__SHtrimmed</a> his beard, nor washed his clothes, from the day the king departed until the day he came [again] in peace.__CPMephibosheth_1__PSMephibosheth__FF2Sa/9/6\');">2Sa 9:6__NB2Sa/16/3\');">2Sa 16:3__AN__GHdressed_his_feet_2__PSdressed his feet__FELiterally, made his feet, which seems to mean washing the feet paring the nails, and perhaps anointing or otherwise perfuming them, if not tinging the nails with henna; see Note on __NADeu/21/12\');">Deu 21:12__AN. Sir John Chardin, in his MS. note on this place, informs us, that it is customary in the East to have as much care of the feet as the hands; and that their barbers cut and adjust the nails with a proper instrument, because they often go barefoot. The nails of the toes of the mummies inspected in London in 1763, of which an account is given in the Philosophical Transactions for 1764, seem to have been tinged with some reddish colour. __NA2Sa/15/30\');">2Sa 15:30__NBIsa/15/2\');">Isa 15:2__NBJer/41/5\');">Jer 41:5__NBMat/6/16\');">Mat 6:16__NBRom/12/15\');">Rom 12:15__NBHbr/13/3\');">Hbr 13:3__AN__GGtrimmed_3__PStrimmed__EELiterally, made his beard, which may mean, combing, curling, and perfuming it. But Mr. Morier says that they almost universally dye the beard black, by successive layers of a paste made of henna, and another made of the leaf of the indigo: the first tinging with an orange colour, and the next with a dark bottle green, which becomes jet black when exposed to the air for twenty-four hours.</TD></TR>';
stringArray[25] = 'And it came to pass, when he was come to Jerusalem to meet the king, that the king said unto him, __PNWherefore_1__SHWherefore</a> wentest not thou with me, Mephibosheth?__CPWherefore_1__PSWherefore__FF2Sa/16/17\');">2Sa 16:17__EN';

stringArray[37] = '__PNLet_thy_1__SHLet thy</a> servant, I pray thee, turn back again, that __PNI_may_die_2__SHI may die</a> in mine own city, [and be buried] __PNby_the_grave_3__SHby the grave</a> of my father and of my mother. But behold thy servant __PNChimham_4__SHChimham</a>; let him go over with my lord the king; and do to him what shall seem good unto thee.__CPLet_thy_1__PSLet thy__EE"The whole of this little episode is extremely interesting, and contains an affecting description of the infirmities of old age. The venerable and kind Barzillai was fourscore years old; his ear was become dull of hearing, and his relish for even royal dainties was gone: the evil days had arrived in which he was constrained to say, ""I have no pleasure in them."" (__NAEcc/12/1\');">Ecc 12:1__AN.) As he was too old either to enjoy the pleasures of a court, or to be of any further service to the king, he finishes his affecting address to the aged monarch with the request, that he would suffer him to enjoy what old men naturally desire, to ""die in mine own city, and be buried by the grave of my father and mother;"" at the same time commending his son Chimham to his kind offices."__GHI_may_die_2__PSI may die__EFGen/48/21\');">Gen 48:21__NBJos/23/14\');">Jos 23:14__NBLuk/2/29\');">Luk 2:29__NRLuk/2/30\');">30__NB2Ti/4/6\');">2Ti 4:6__NB2Pe/1/14\');">2Pe 1:14__AN__GGby_the_grave_3__PSby the grave__FFGen/47/30\');">Gen 47:30__NBGen/49/29\');">Gen 49:29-31__NBGen/50/13\');">Gen 50:13__NB1Ki/13/22\');">1Ki 13:22__AN__GHChimham_4__PSChimham__EF2Sa/19/40\');">2Sa 19:40__NB1Ki/2/7\');">1Ki 2:7__NBJer/41/17\');">Jer 41:17__EN';
