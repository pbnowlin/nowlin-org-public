stringArray[1] = 'And it came to pass after this, that __PNAbsalom_3__SHAbsalom</a> the son of David had __PNa_fair_sister_4__SHa fair sister</a>, whose name [was] __PNTamar_5__SHTamar</a>; and Amnon the son of David __PNloved_her_6__SHloved her</a>.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2972. B.C. 1032.__GHRelated_Verses2_2__PSEntire Verse.__FEAn. Ex. Is. 459.__GGAbsalom_3__PSAbsalom__FF2Sa/3/2\');">2Sa 3:2__NR2Sa/3/3\');">3__NB1Ch/3/2\');">1Ch 3:2__AN__GHa_fair_sister_4__PSa fair sister__EF2Sa/11/2\');">2Sa 11:2__NBGen/6/2\');">Gen 6:2__NBGen/39/6\');">Gen 39:6__NRGen/39/7\');">7__NBPro/6/25\');">Pro 6:25__NBPro/31/30\');">Pro 31:30__AN__GGTamar_5__PSTamar__FF2Sa/14/27\');">2Sa 14:27__NB1Ch/3/9\');">1Ch 3:9__AN__GHloved_her_6__PSloved her__EF2Sa/13/15\');">2Sa 13:15__NBGen/29/18\');">Gen 29:18__NRGen/29/20\');">20__NBGen/34/3\');">Gen 34:3__NB1Ki/11/1\');">1Ki 11:1__EN';

stringArray[4] = 'And he said unto him, __PNWhy_art_1__SHWhy [art]</a> thou, [being] the king\'s son, __PNlean_2__SHlean</a> __PNfrom_day_to_day_3__SHfrom day to day</a>? wilt thou not tell me? And Amnon said unto him, __PNI_love_4__SHI love</a> Tamar, __PNmy_brother_5__SHmy brother</a> Absalom\'s sister.__CPWhy_art_1__PSWhy art__FF1Ki/21/7\');">1Ki 21:7__NBEst/5/13\');">Est 5:13__NREst/5/14\');">14__NBLuk/12/32\');">Luk 12:32__AN__GHlean_2__PSlean__FEHeb. thin__GGfrom_day_to_day_3__PSfrom day to day__EEHeb. morning by morning__GHI_love_4__PSI love__EFIsa/3/9\');">Isa 3:9__NBJer/8/12\');">Jer 8:12__NBMic/7/3\');">Mic 7:3__AN__GGmy_brother_5__PSmy brother__FFLev/18/9\');">Lev 18:9__NBLev/20/17\');">Lev 20:17__EN';

stringArray[6] = 'So Amnon lay down, and made himself sick: and when the king was come to see him, Amnon said unto the king, I pray thee, let Tamar my sister come, and __PNmake_me_1__SHmake me</a> a couple of cakes in my sight, that I may eat at her hand.__CPmake_me_1__PSmake me__FFGen/18/6\');">Gen 18:6__NBMat/13/33\');">Mat 13:33__EN';
stringArray[7] = 'Then David sent home to Tamar, saying, Go now to thy brother Amnon\'s house, and dress him meat.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[8] = 'So Tamar went to her brother Amnon\'s house; and he was laid down. And __PNshe_took_1__SHshe took</a> __PNflour_2__SHflour</a>, and kneaded [it], and made cakes in his sight, and did bake the cakes.__CPshe_took_1__PSshe took__EE"Dr. Russell says, ""The Eastern ladies often wash their own hands, prepare cakes, pastry, etc. in their apartments; and some few particular dishes are cooked by themselves, but not in their apartments: on such occasions, they go to some room near the kitchen."""__GHflour_2__PSflour__FE"or, paste. and made cakes. Rather, as Mr. Parkhurst renders, ""and tossed it (wattelabbaiv) in his sight, and dressed the tossed cakes (halleveevoth)."" This will receive illustration from the account which Mr. Jackson gives of the Arabian manner of kneading and baking. ""They have a small place built with clay, between two and three feet high, having a hole at the bottom for the convenience of drawing out the ashes, something similar to that of a brick-kiln. The oven is usually about fifteen inches wide at top, and gradually grows wider to the bottom. It is heated with wood; and when sufficiently hot, and perfectly clear from smoke, having nothing but clear embers at bottom, which continue to reflect great heat, they prepare the dough in a large bowl, and mould the cakes to the desired size on a board or stone placed near the oven. After they have kneaded the cake to a proper consistency, they pat it a little, then toss it about with great dexterity in one hand till it is as thin as they choose to make it. They"</TD></TR>';

stringArray[26] = 'Then said Absalom, If not, I pray thee, __PNlet_my_brother_1__SHlet my brother</a> Amnon go with us. And the king said unto him, Why should he go with thee?__CPlet_my_brother_1__PSlet my brother__EEHe urged this with the more plausibility because Amnon was the first-born, and presumptive heir to the crown; and he had dissembled his resentment so long and so well that he was not suspected. __NA2Sa/3/27\');">2Sa 3:27__NB2Sa/11/13\');">2Sa 11:13-15__NB2Sa/20/9\');">2Sa 20:9__NBPsa/55/21\');">Psa 55:21__EN';

stringArray[31] = 'Then the king __PNarose_1__SHarose</a>, and tare his garments, and lay on the earth; and __PNall_his_servants_2__SHall his servants</a> stood by with their clothes rent.__CParose_1__PSarose__FF2Sa/12/16\');">2Sa 12:16__NBGen/37/29\');">Gen 37:29__NRGen/37/34\');">34__NBJos/7/6\');">Jos 7:6__NBJob/1/20\');">Job 1:20__AN__GHall_his_servants_2__PSall his servants__EF2Sa/1/11\');">2Sa 1:11__NB2Sa/3/31\');">2Sa 3:31__EN';
stringArray[32] = 'And __PNJonadab_1__SHJonadab</a>, the son of __PNShimeah_2__SHShimeah</a> __PNDavid_s_brother_3__SHDavid\'s brother</a>, answered and said, Let not my lord suppose [that] they have slain all the young men the king\'s sons; for Amnon only is dead: for by the __PNappointment_4__SHappointment</a> of Absalom this hath been __PNdetermined_5__SHdetermined</a> from the day that he forced his sister Tamar.__CPJonadab_1__PSJonadab__FF2Sa/13/3\');">2Sa 13:3-5__AN__GHShimeah_2__PSShimeah__EF1Sa/16/9\');">1Sa 16:9__AN; Shammah__GGDavid_s_brother_3__PSDavid\'s brother__EEThis was a very bad man: he had given his cousin Amnon the most detestable advice; and here speaks coolly of a most bloody tragedy of which he had been the cause.__GHappointment_4__PSappointment__FEHeb. mouth__GGdetermined_5__PSdetermined__EEor, settled. __NAGen/27/41\');">Gen 27:41__NBPsa/7/14\');">Psa 7:14__NBPro/24/11\');">Pro 24:11__NRPro/24/12\');">12__EN';
