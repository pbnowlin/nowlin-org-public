<script type="text/javascript">
var stringArray = new Array();
stringArray[1] = 'And it came to pass after this, that the __PNking_3__SHking</a> of the children of Ammon died, and Hanun his son reigned in his stead.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2967 B.C. 1037.__GHRelated_Verses2_2__PSEntire Verse.__FEAn. Ex. Is. 454.__GGking_3__PSking__FFJdg/10/7\');">Jdg 10:7-9__NBJdg/11/12\');">Jdg 11:12-28__NB1Sa/11/1\');">1Sa 11:1-3__NB1Ch/19/1\');">1Ch 19:1-3__EN';
stringArray[2] = 'Then said David, I will __PNshew_kindness_1__SHshew kindness</a> unto Hanun the son of __PNNahash_2__SHNahash</a>, __PNas_his_father_3__SHas his father</a> shewed kindness unto me. And David sent to comfort him by the hand of his servants for his father. And David\'s servants came into the land of the children of Ammon.__CPshew_kindness_1__PSshew kindness__FFDeu/23/3\');">Deu 23:3-6__NBNeh/4/3\');">Neh 4:3-7__NBNeh/13/1\');">Neh 13:1-3__AN__GHNahash_2__PSNahash__EF1Sa/11/1\');">1Sa 11:1__AN__GGas_his_father_3__PSas his father__FF1Sa/22/3\');">1Sa 22:3__NR1Sa/22/4\');">4__EN';
stringArray[3] = 'And the princes of the children of Ammon said unto Hanun their lord, __PNThinkest_thou_that_David_doth_1__SHThinkest thou that David doth</a> honour thy father, that he hath sent comforters unto thee? hath __PNnot_2__SHnot</a> David [rather] sent his servants unto thee, to search the city, and to spy it out, and to overthrow it?__CPThinkest_thou_that_David_doth_1__PSThinkest thou that David doth__EEHeb. In thine eyes doth David__GHnot_2__PSnot__EFGen/42/9\');">Gen 42:9__NRGen/42/16\');">16__NB1Cr/13/5\');">1Cr 13:5__NR1Cr/13/7\');">7__EN';
stringArray[4] = 'Wherefore Hanun took David\'s servants, __PNand_shaved_1__SHand shaved</a> off the one half of their beards, and __PNcut_off_2__SHcut off</a> their garments in the middle, [even] to their buttocks, and sent them away.__CPand_shaved_1__PSand shaved__EEThe beard is held in high respect and greatly valued in the East: the possessor considers it as his greatest ornament; often swears by it; and, in matters of great importance, pledges it; and nothing can be more secure than such a pledge; for its owner will redeem it at the hazard of his life. The beard was never cut off but in mourning, or as a sign of slavery. It is customary to shave the Ottoman princes, as a mark of their subjection to the reigning emperor. The beard is a mark of authority and liberty among the Mohammedans. The Persians who clip the beard, and shave above the jaw, are reputed heretics. They who serve in the seraglios have their beards shaven, as a sign of servitude; nor do they suffer them to grow till the sultan has set them at liberty. Among the Arabians, it is more infamous for anyone to appear with his beard cut off, than among us to be publicly whipped or branded; and many would prefer death to such a punishment. __NALev/19/27\');">Lev 19:27__NB1Ch/19/3\');">1Ch 19:3__NR1Ch/19/4\');">4__NBPsa/109/4\');">Psa 109:4__NRPsa/109/5\');">5__NBIsa/15/2\');">Isa 15:2__AN__GHcut_off_2__PScut off__EFIsa/20/4\');">Isa 20:4__NBIsa/47/2\');">Isa 47:2__NRIsa/47/3\');">3__NBJer/41/5\');">Jer 41:5__EN';
stringArray[5] = 'When they told [it] unto David, he sent to meet them, because the men were greatly ashamed: and the king said, Tarry at __PNJericho_1__SHJericho</a> until your beards be grown, and [then] return.__CPJericho_1__PSJericho__FFJos/6/24\');">Jos 6:24-26__NB1Ki/16/34\');">1Ki 16:34__NB1Ch/19/5\');">1Ch 19:5__EN';
stringArray[6] = 'And when the children of Ammon saw that they __PNstank_1__SHstank</a> before David, the children of Ammon sent and hired the __PNSyrians_of_Beth_rehob_2__SHSyrians of Bethrehob</a>, and the Syrians of Zoba, twenty thousand footmen, and of king __PNMaacah_3__SHMaacah</a> a thousand men, and of __PNIsh_tob_4__SHIshtob</a> twelve thousand men.__CPstank_1__PSstank__FFGen/34/30\');">Gen 34:30__NBExd/5/21\');">Exd 5:21__NB1Sa/13/4\');">1Sa 13:4__NB1Sa/27/12\');">1Sa 27:12__NB1Ch/19/6\');">1Ch 19:6__NR1Ch/19/7\');">7__AN__GHSyrians_of_Beth_rehob_2__PSSyrians of Beth-rehob__EF2Sa/8/3\');">2Sa 8:3__NR2Sa/8/5\');">5__NR2Sa/8/12\');">12__AN; Zobah. __NAPro/25/8\');">Pro 25:8__NBIsa/8/9\');">Isa 8:9__NRIsa/8/10\');">10__AN__GGMaacah_3__PSMaacah__FFJos/13/11\');">Jos 13:11-13__AN__GHIsh_tob_4__PSIsh-tob__FEor, the men of Tob. __NAJdg/11/3\');">Jdg 11:3__NRJdg/11/5\');">5__EN';
stringArray[7] = 'And when David heard of [it], he sent Joab, and __PNall_the_host_1__SHall the host</a> of the mighty men.__CPall_the_host_1__PSall the host__FF2Sa/23/8\');">2Sa 23:8-39__NB1Ch/19/8\');">1Ch 19:8-19__EN';
stringArray[8] = 'And the children of Ammon came out, and put the battle in array __PNat_the_entering_1__SHat the entering</a> in of the gate: and the Syrians of Zoba, and of __PNRehob_2__SHRehob</a>, and Ishtob, and Maacah, [were] by themselves in the field.__CPat_the_entering_1__PSat the entering__EEThis was at the city of Medeba, a city upon the borders of the Ammonites, and in their possession. __NA1Ch/19/7\');">1Ch 19:7__AN__GHRehob_2__PSRehob__EF2Sa/10/6\');">2Sa 10:6__NBNum/13/21\');">Num 13:21__NBJos/19/28\');">Jos 19:28__NBJdg/1/31\');">Jdg 1:31__EN';
stringArray[9] = 'When Joab saw that the front of the battle was against him before and behind, he chose of all the choice [men] of Israel, and put [them] in array against the Syrians:__CPRelated_Verses1_1__PSEntire Verse.__FFJos/8/21\');">Jos 8:21__NRJos/8/22\');">22__NBJdg/20/42\');">Jdg 20:42__NRJdg/20/43\');">43__EN';
stringArray[10] = 'And the rest of the people he delivered into the hand of Abishai his brother, that he might put [them] in array against the children of Ammon.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[11] = 'And he said, If the Syrians be too strong for me, then thou shalt help me: but if the children of Ammon be too strong for thee, then I will come and help thee.__CPRelated_Verses1_1__PSEntire Verse.__FF1Ch/19/9\');">1Ch 19:9-12__NBNeh/4/20\');">Neh 4:20__NBLuk/22/32\');">Luk 22:32__NBRom/15/1\');">Rom 15:1__NBGal/6/2\');">Gal 6:2__NBPhl/1/27\');">Phl 1:27__NRPhl/1/28\');">28__EN';
stringArray[12] = '__PNBe_of_good_1__SHBe of good</a> courage, and let us __PNplay_2__SHplay</a> the men for our people, and for the cities of our God: and __PNthe_LORD_3__SHthe LORD</a> do that which seemeth him good.__CPBe_of_good_1__PSBe of good__EEThis is a very animating address, and equal to any thing of the kind in ancient or modern times. Ye fight pro aris et focis; for every good, sacred and civil; for God, for your families, and for your countries. Such harangues, especially in very trying circumstances, are very natural, and may perhaps be found in the records of every nation. Several instances might be quoted from Roman and Grecian history; but few are more remarkable than that of Tyrtaeus, the lame Athenian poet, to whom the command of the army was given in one of the Messenian wars. The Spartans had at that time suffered great losses, and all their stratagems proved ineffectual, so that they began to despair of success; when the poet, by his lectures on honour and courage, delivered in moving verse to the army, ravished them to such a degree with the thoughts of dying for their country, that, rushing on with a furious transport to meet their enemies, they gave them an entire overthrow, and by one decisive battle brought the war to a happy con__GHplay_2__PSplay__EF1Sa/4/9\');">1Sa 4:9__NB1Ch/19/13\');">1Ch 19:13__NB1Cr/16/13\');">1Cr 16:13__AN__GGthe_LORD_3__PSthe LORD__FF2Sa/16/10\');">2Sa 16:10__NR2Sa/16/11\');">11__NBJdg/10/15\');">Jdg 10:15__NB1Sa/3/18\');">1Sa 3:18__NBJob/1/21\');">Job 1:21__EN';
stringArray[13] = 'And Joab drew nigh, and the people that [were] with him, unto the battle against the Syrians: and __PNthey_fled_1__SHthey fled</a> before him.__CPthey_fled_1__PSthey fled__FF1Ki/20/13\');">1Ki 20:13-21__NR1Ki/20/28\');">28-30__NB1Ch/19/14\');">1Ch 19:14__NR1Ch/19/15\');">15__NB2Ch/13/5\');">2Ch 13:5-16__EN';
stringArray[14] = 'And when the children of Ammon saw that the Syrians were fled, then fled they also before Abishai, and entered into the city. So Joab returned from the children of Ammon, and came to Jerusalem.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[15] = 'And when the Syrians saw that they were smitten before Israel, they __PNgathered_3__SHgathered</a> themselves together.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2968. B.C. 1036.__GHRelated_Verses2_2__PSEntire Verse.__FEAn. Ex. Is. 455.__GGgathered_3__PSgathered__FFPsa/2/1\');">Psa 2:1__NBIsa/8/9\');">Isa 8:9__NRIsa/8/10\');">10__NBMic/4/11\');">Mic 4:11__NRMic/4/12\');">12__NBZec/14/2\');">Zec 14:2__NRZec/14/3\');">3__NBRev/19/19\');">Rev 19:19-21__EN';
stringArray[16] = 'And __PNHadarezer_1__SHHadarezer</a> sent, and brought out the Syrians that [were] beyond __PNthe_river_2__SHthe river</a>: and they came to Helam; and __PNShobach_3__SHShobach</a> the captain of the host of Hadarezer [went] before them.__CPHadarezer_1__PSHadarezer__FF2Sa/8/3\');">2Sa 8:3-8__NB1Ch/18/3\');">1Ch 18:3__NR1Ch/18/5\');">5__AN__GHthe_river_2__PSthe river__FEi.e., Euphrates__GGShobach_3__PSShobach__EEor, Shophach. __NA1Ch/19/16\');">1Ch 19:16__EN';
stringArray[17] = 'And when it was told David, __PNhe_gathered_1__SHhe gathered</a> all Israel together, and passed over Jordan, and came to Helam. And the Syrians set themselves in array against David, and fought with him.__CPhe_gathered_1__PShe gathered__FF1Ch/19/17\');">1Ch 19:17__EN';
stringArray[18] = 'And the Syrians __PNfled_1__SHfled</a> before Israel; and David slew [the men of] seven hundred chariots of the Syrians, and forty thousand __PNhorsemen_2__SHhorsemen</a>, and smote __PNShobach_3__SHShobach</a> the captain of their host, who died there.__CPfled_1__PSfled__FF2Sa/8/4\');">2Sa 8:4__NBPsa/18/38\');">Psa 18:38__NBPsa/46/11\');">Psa 46:11__AN__GHhorsemen_2__PShorsemen__EF1Ch/19/18\');">1Ch 19:18__AN; footmen__GGShobach_3__PSShobach__FFJdg/4/2\');">Jdg 4:2__NRJdg/4/22\');">22__NBJdg/5/26\');">Jdg 5:26__EN';
stringArray[19] = 'And when all the kings [that were] __PNservants_1__SHservants</a> to Hadarezer saw that they were smitten before Israel, they made peace with Israel, and served them. So the Syrians __PNfeared_2__SHfeared</a> to help the children of Ammon any more.__CPservants_1__PSservants__FFGen/14/1\');">Gen 14:1-5__NBJos/11/10\');">Jos 11:10__NBJdg/1/7\');">Jdg 1:7__NB1Ki/20/1\');">1Ki 20:1__NBDan/2/37\');">Dan 2:37__AN__GHfeared_2__PSfeared__EF2Sa/8/6\');">2Sa 8:6__NB1Ch/19/19\');">1Ch 19:19__NBPsa/18/37\');">Psa 18:37__NRPsa/18/38\');">38__NBPsa/48/4\');">Psa 48:4__NRPsa/48/5\');">5__NBIsa/26/11\');">Isa 26:11__NBRev/18/10\');">Rev 18:10__EN';
