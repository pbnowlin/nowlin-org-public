var stringArray = new Array();
stringArray[1] = 'And when Saul\'s son heard that Abner was dead in Hebron, __PNhis_hands_1__SHhis hands</a> were feeble, __PNand_all_2__SHand all</a> the Israelites were troubled.__CPhis_hands_1__PShis hands__FF2Sa/17/2\');">2Sa 17:2__NBEzr/4/4\');">Ezr 4:4__NBNeh/6/9\');">Neh 6:9__NBIsa/13/7\');">Isa 13:7__NBIsa/35/3\');">Isa 35:3__NBJer/6/24\');">Jer 6:24__NBJer/50/43\');">Jer 50:43__NBZep/3/16\');">Zep 3:16__AN__GHand_all_2__PSand all__EFMat/2/2\');">Mat 2:2__NRMat/2/3\');">3__EN';
stringArray[2] = 'And Saul\'s son had two men [that were] __PNcaptains_1__SHcaptains</a> of bands: the name of the one [was] Baanah, and the name of the __PNother_2__SHother</a> Rechab, the sons of Rimmon a Beerothite, of the children of Benjamin: (for __PNBeeroth_3__SHBeeroth</a> also was reckoned to Benjamin:__CPcaptains_1__PScaptains__FF2Sa/3/22\');">2Sa 3:22__NB2Ki/5/2\');">2Ki 5:2__NB2Ki/6/23\');">2Ki 6:23__AN__GHother_2__PSother__FEHeb. second__GGBeeroth_3__PSBeeroth__FFJos/9/17\');">Jos 9:17__NBJos/18/25\');">Jos 18:25__EN';
stringArray[3] = 'And the Beerothites fled to Gittaim, and were sojourners there until this day.)__CPRelated_Verses1_1__PSEntire Verse.__FF1Sa/31/7\');">1Sa 31:7__NBNeh/11/33\');">Neh 11:33__EN';
stringArray[4] = 'And __PNJonathan_1__SHJonathan</a>, Saul\'s son, had a son [that was] lame of [his] feet. He was five years old __PNwhen_the_tidings_2__SHwhen the tidings</a> came of Saul and Jonathan out of Jezreel, and his nurse took him up, and fled: and it came to pass, as she made haste to flee, that he fell, and became lame. And his name [was] __PNMephibosheth_3__SHMephibosheth</a>.__CPJonathan_1__PSJonathan__FF2Sa/9/3\');">2Sa 9:3__AN__GHwhen_the_tidings_2__PSwhen the tidings__EF1Sa/29/1\');">1Sa 29:1__NR1Sa/29/11\');">11__NB1Sa/31/1\');">1Sa 31:1-10__AN__GGMephibosheth_3__PSMephibosheth__FF1Ch/8/34\');">1Ch 8:34__NB1Ch/9/40\');">1Ch 9:40__AN; Meribbaal.</TD></TR>';
stringArray[5] = 'And the sons of Rimmon the Beerothite, Rechab and Baanah, __PNwent_1__SHwent</a>, and came about the heat of the day to the house of Ishbosheth, who __PNlay_on_a_bed_2__SHlay on a bed</a> at noon.__CPwent_1__PSwent__FF2Ch/24/25\');">2Ch 24:25__NB2Ch/25/27\');">2Ch 25:27__NB2Ch/33/24\');">2Ch 33:24__AN__GHlay_on_a_bed_2__PSlay on a bed__FEIt is customary, in all hot countries, to travel or work very early and very late, and to rest at noon, at which time the heat most prevails. __NA2Sa/11/2\');">2Sa 11:2__NB1Ki/16/9\');">1Ki 16:9__NBPro/24/33\');">Pro 24:33__NRPro/24/34\');">34__NB1Th/5/3\');">1Th 5:3-7__EN';
stringArray[6] = 'And they came thither into the midst of the house, [__PNas_though_1__SHas though</a>] they would have fetched wheat; and they smote him __PNunder_2__SHunder</a> the fifth [rib]: and Rechab and Baanah his brother escaped.__CPas_though_1__PSas though__EEIt is still the custom of the East, according to Dr. Perry, to allow the soldiers a certain quantity of corn, with other articles of provision, together with some pay: and as it was the custom also to grind the corn, as needed, at the break of day, these two captains very naturally went the day before to the palace, where the king\'s stores appear to have been kept, to fetch wheat, in order to distribute it to the soldiers under them, to be ground at the accustomed hour in the morning. The princes of the East, in those days, as appears from the history of David, reposed on their couches till the cool of the evening: they therefore came in the heat of the day, when they knew their master would be resting on his bed; and as it was a necessary to have the corn before it was needed, their coming at this time, though it might be earlier than usual, excited no suspicion.__GHunder_2__PSunder__EF2Sa/2/23\');">2Sa 2:23__NB2Sa/3/27\');">2Sa 3:27__NB2Sa/20/10\');">2Sa 20:10__EN';
stringArray[7] = 'For when they came into the house, he lay on his bed in his bedchamber, and they smote him, and slew him, and beheaded him, and __PNtook_his_head_1__SHtook his head</a>, and gat them away through the plain all night.__CPtook_his_head_1__PStook his head__FF1Sa/17/54\');">1Sa 17:54__NB1Sa/31/9\');">1Sa 31:9__NB2Ki/10/6\');">2Ki 10:6__NR2Ki/10/7\');">7__NBMat/14/11\');">Mat 14:11__NBMar/6/28\');">Mar 6:28__NRMar/6/29\');">29__AN; When those difficulties dispirit us which should rather invigorate us and sharpen our endeavours, we betray a carelessness of character which is soon taken advantage of by our more watchful neighbours. Love not sleep, lest thou come to poverty and ruin. The idle soul is an easy prey to the destroyer.</TD></TR>';

stringArray[9] = 'And David answered Rechab and Baanah his brother, the sons of Rimmon the Beerothite, and said unto them, [As] the LORD liveth, __PNwho_hath_1__SHwho hath</a> redeemed my soul out of all adversity,__CPwho_hath_1__PSwho hath__FFGen/48/16\');">Gen 48:16__NB1Ki/1/29\');">1Ki 1:29__NBPsa/31/5\');">Psa 31:5-7__NBPsa/34/6\');">Psa 34:6__NRPsa/34/7\');">7__NRPsa/34/17\');">17__NRPsa/34/22\');">22__NBPsa/71/23\');">Psa 71:23__NBPsa/103/4\');">Psa 103:4__NBPsa/106/10\');">Psa 106:10__NBPsa/107/2\');">Psa 107:2__NB2Ti/4/17\');">2Ti 4:17__NR2Ti/4/18\');">18__EN';
stringArray[10] = 'When __PNone_1__SHone</a> told me, saying, Behold, Saul is dead, __PNthinking__etc__2__SHthinking</a> to have brought good tidings, I took hold of him, and slew him in Ziklag, who [thought] that I would have given him a reward for his tidings:__CPone_1__PSone__FF2Sa/1/2\');">2Sa 1:2-16__AN__GHthinking__etc__2__PSthinking, etc.__FEHeb. he was in his own eyes, as a bringer, etc. who thought, etc. or, which was the reward I gave him for his tidings.</TD></TR>';
