stringArray[10] = 'Thou therefore, and thy sons, and thy servants, shall till the land for him, and thou shalt bring in [the fruits], that thy master\'s son may have food to eat: but Mephibosheth thy master\'s son __PNshall_eat_bread_1__SHshall eat bread</a> alway at my table. Now Ziba had fifteen sons and twenty servants.__CPshall_eat_bread_1__PSshall eat bread__EEThe eating at courts was of two kinds; the one public and ceremonious, the other private. Sir John Chardin understands those passages which speak of a right to eat at the royal table, as pointing out a right to a seat there, when the repast was public and solemn. So in a MS. Note on __NA1Ki/2/7\');">1Ki 2:7__AN, he tells us that it was to be understood of the majilis, (the term for an assembly of lords, or a public feast,) and not of the daily and ordinary repast. Hence, though Mephibosheth was to eat at all public times at the king\'s table, yet he would want the produce of his lands for food at other times, which it was necessary for Ziba to understand. __NA2Sa/9/7\');">2Sa 9:7__NR2Sa/9/11\');">11-13__NB2Sa/19/28\');">2Sa 19:28__NB2Ki/25/29\');">2Ki 25:29__NBLuk/14/15\');">Luk 14:15__EN';
