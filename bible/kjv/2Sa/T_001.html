var stringArray = new Array();
stringArray[1] = 'Now it came to pass after the death of Saul, __PNwhen_David_1__SHwhen David</a> was returned from the slaughter of the Amalekites, and David had abode two days in __PNZiklag_2__SHZiklag</a>;__CPwhen_David_1__PSwhen David__FF1Sa/30/17\');">1Sa 30:17-26__AN__GHZiklag_2__PSZiklag__EF1Sa/27/6\');">1Sa 27:6__EN';
stringArray[2] = 'It came even to pass on __PNthe_third_1__SHthe third</a> day, that, behold, __PNa_man_2__SHa man</a> came out of the camp from Saul with his __PNclothes_3__SHclothes</a> rent, __PNand_earth_4__SHand earth</a> upon his head: and [so] it was, when he came to David, that __PNhe_fell_5__SHhe fell</a> to the earth, and did obeisance.__CPthe_third_1__PSthe third__FFGen/22/4\');">Gen 22:4__NBEst/4/16\');">Est 4:16__NBEst/5/1\');">Est 5:1__NBHsa/6/2\');">Hsa 6:2__NBMat/12/40\');">Mat 12:40__NBMat/16/21\');">Mat 16:21__AN__GHa_man_2__PSa man__EF2Sa/4/10\');">2Sa 4:10__AN__GGclothes_3__PSclothes__FFGen/37/29\');">Gen 37:29__NRGen/37/34\');">34__NBJos/7/6\');">Jos 7:6__NB1Sa/4/12\');">1Sa 4:12__NR1Sa/4/16\');">16__NBJoe/2/13\');">Joe 2:13__AN__GHand_earth_4__PSand earth__EF2Sa/15/32\');">2Sa 15:32__NB1Sa/4/12\');">1Sa 4:12__AN__GGhe_fell_5__PShe fell__FF2Sa/14/4\');">2Sa 14:4__NBGen/37/7\');">Gen 37:7-10__NBGen/43/28\');">Gen 43:28__NB1Sa/20/41\');">1Sa 20:41__NB1Sa/25/23\');">1Sa 25:23__NBPsa/66/3\');">Psa 66:3__NBRev/3/9\');">Rev 3:9__EN';
stringArray[3] = 'And David said unto him, __PNFrom_1__SHFrom</a> whence comest thou? And he said unto him, Out of the camp of Israel __PNam_I_2__SHam I</a> escaped.__CPFrom_1__PSFrom__FF2Ki/5/25\');">2Ki 5:25__AN__GHam_I_2__PSam I__EFJob/1/15\');">Job 1:15-19__EN';
stringArray[4] = 'And David said unto him, __PNHow_went_1__SHHow went</a> the matter? I pray thee, tell me. And he answered, That __PNthe_people_2__SHthe people</a> are fled from the battle, and many of the people also are fallen and dead; and Saul and Jonathan his son are dead also.__CPHow_went_1__PSHow went__EEHeb. What was, etc. __NA1Sa/4/16\');">1Sa 4:16__AN; *marg:__GHthe_people_2__PSthe people__EF1Sa/31/1\');">1Sa 31:1-6__NB1Ch/10/1\');">1Ch 10:1-6__EN';
stringArray[5] = 'And David said unto the young man that told him, __PNHow_knowest_1__SHHow knowest</a> thou that Saul and Jonathan his son be dead?__CPHow_knowest_1__PSHow knowest__FFPro/14/15\');">Pro 14:15__NBPro/25/2\');">Pro 25:2__EN';
stringArray[6] = 'And the young man that told him said, __PNAs_I_happened_1__SHAs I happened</a> by chance upon __PNmount_2__SHmount</a> Gilboa, behold, __PNSaul_3__SHSaul</a> leaned upon his spear; and, lo, the chariots and horsemen followed hard after him.__CPAs_I_happened_1__PSAs I happened__EEThe story of this young man appears to be wholly a fiction, formed for the purpose of ingratiating himself with David, as the next probable successor to the crown. There is no fact in the case, except for the bringing of the diadem and bracelets of Saul, as a sufficient evidence of his death, which, as he appears to been a plunderer of the slain, he seems to have stripped from the dead body of the unfortunate monarch. It is remarkable, that Saul, who had forfeited his crown by his disobedience and ill-timed clemency with respect to the Amalekites, should now have the insignia of royalty stripped from his person by one of those very people. __NARth/2/3\');">Rth 2:3__NB1Sa/6/9\');">1Sa 6:9__NBLuk/10/31\');">Luk 10:31__AN__GHmount_2__PSmount__EF2Sa/1/21\');">2Sa 1:21__NB1Sa/28/4\');">1Sa 28:4__NB1Sa/31/1\');">1Sa 31:1__AN__GGSaul_3__PSSaul__FF1Sa/31/2\');">1Sa 31:2-7__EN';
stringArray[7] = 'And when he looked behind him, he saw me, and called unto me. And I answered, __PNHere_am_I_1__SHHere [am] I</a>.__CPHere_am_I_1__PSHere am I__EEHeb. Behold me. __NA2Sa/9/6\');">2Sa 9:6__NBJdg/9/54\');">Jdg 9:54__NB1Sa/22/12\');">1Sa 22:12__NBIsa/6/8\');">Isa 6:8__AN; *marg:; __NAIsa/65/1\');">Isa 65:1__EN';
stringArray[8] = 'And he said unto me, Who [art] thou? And I answered him, I [am] __PNan_Amalekite_1__SHan Amalekite</a>.__CPan_Amalekite_1__PSan Amalekite__FFGen/14/7\');">Gen 14:7__NBExd/17/8\');">Exd 17:8-16__NBNum/24/20\');">Num 24:20__NBDeu/25/17\');">Deu 25:17-19__NB1Sa/15/3\');">1Sa 15:3__NB1Sa/27/8\');">1Sa 27:8__NB1Sa/30/1\');">1Sa 30:1__NR1Sa/30/13\');">13__NR1Sa/30/17\');">17__EN';
stringArray[9] = 'He said unto me again, Stand, I pray thee, upon me, and slay me: for __PNanguish__etc__1__SHanguish</a> is come upon me, because my life [is] yet whole in me.__CPanguish__etc__1__PSanguish, etc.__EEor, my coat of mail, or, my embroidered coat hindereth me, that my, etc.</TD></TR>';
stringArray[10] = 'So I stood upon him, and __PNslew_1__SHslew</a> him, because I was sure that he could not live after that he was fallen: and I took the __PNcrown_2__SHcrown</a> that [was] upon his head, and the __PNbracelet_3__SHbracelet</a> that [was] on his arm, and have brought them hither unto my lord.__CPslew_1__PSslew__FFJdg/1/7\');">Jdg 1:7__NBJdg/9/54\');">Jdg 9:54__NB1Sa/22/18\');">1Sa 22:18__NB1Sa/31/4\');">1Sa 31:4__NR1Sa/31/5\');">5__NBMat/7/2\');">Mat 7:2__AN__GHcrown_2__PScrown__EF2Sa/12/30\');">2Sa 12:30__NBLam/5/16\');">Lam 5:16__AN__GGbracelet_3__PSbracelet__EEThis was probably worn as an ensign of royalty, as is frequently the case in the East. When the Khalif Cayem Bemrillah granted the investiture of certain dominions to an Eastern prince, the ceremony was performed by sending him letters patent, a crown, chain, and bracelets. The bracelet, says Mr. Morier, are ornaments fastened above the elbows, composed of precious stones of great value, and are only worn by the king and his sons.</TD></TR>';
stringArray[11] = 'Then David took hold on his clothes, and __PNrent_1__SHrent</a> them; and __PNlikewise_2__SHlikewise</a> all the men that [were] with him:__CPrent_1__PSrent__FF2Sa/3/31\');">2Sa 3:31__NB2Sa/13/31\');">2Sa 13:31__NBGen/37/29\');">Gen 37:29__NRGen/37/34\');">34__NBAct/14/14\');">Act 14:14__AN__GHlikewise_2__PSlikewise__EFRom/12/15\');">Rom 12:15__EN';

stringArray[18] = '(Also he bade them __PNteach_1__SHteach</a> the children of Judah [the use of] the __PNbow_2__SHbow</a>: behold, [it is] written in __PNthe_book_3__SHthe book</a> of __PNJasher_4__SHJasher</a>.)__CPteach_1__PSteach__FFGen/49/8\');">Gen 49:8__NBDeu/4/10\');">Deu 4:10__AN__GHbow_2__PSbow__FE"Kasheth, or the bow, was probably the title of the following threnody; so called, in the oriental style, because Saul\'s death was occasioned by that weapon, and because the bow of Jonathan, out of which ""the arrow was shot beyond the lad,"" (__NA1Sa/20/36\');">1Sa 20:36__AN,) is celebrated in this song."__GGthe_book_3__PSthe book__FFJos/10/13\');">Jos 10:13__AN__GHJasher_4__PSJasher__FE"or, the upright. So LXX. [;] Targum, siphra deooritha, ""the book of the law;"" the Arabic, ""the book of Ashee: this is the book of Samuel."" This book was probably a collection of divine odes, written to commemorate remarkable events."</TD></TR>';
