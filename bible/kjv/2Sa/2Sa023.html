Text[1] = 'Now these [be] the last words of David. David the son of Jesse said, and the man [who was] raised up on high, the anointed of the God of Jacob, and the sweet psalmist of Israel, said,';
Text[2] = 'The Spirit of the LORD spake by me, and his word [was] in my tongue.';

Text[8] = 'These [be] the names of the mighty men whom David had: The Tachmonite that sat in the seat, chief among the captains; the same [was] Adino the Eznite: [he lift up his spear] against eight hundred, whom he slew at one time.';
Text[9] = 'And after him [was] Eleazar the son of Dodo the Ahohite, [one] of the three mighty men with David, when they defied the Philistines [that] were there gathered together to battle, and the men of Israel were gone away:';
Text[10] = 'He arose, and smote the Philistines until his hand was weary, and his hand clave unto the sword: and the LORD wrought a great victory that day; and the people returned after him only to spoil.';
Text[11] = 'And after him [was] Shammah the son of Agee the Hararite. And the Philistines were gathered together into a troop, where was a piece of ground full of lentiles: and the people fled from the Philistines.';
Text[12] = 'But he stood in the midst of the ground, and defended it, and slew the Philistines: and the LORD wrought a great victory.';
Text[13] = 'And three of the thirty chief went down, and came to David in the harvest time unto the cave of Adullam: and the troop of the Philistines pitched in the valley of Rephaim.';
Text[14] = 'And David [was] then in an hold, and the garrison of the Philistines [was] then [in] Bethlehem.';
Text[15] = 'And David longed, and said, Oh that one would give me drink of the water of the well of Bethlehem, which [is] by the gate!';
Text[16] = 'And the three mighty men brake through the host of the Philistines, and drew water out of the well of Bethlehem, that [was] by the gate, and took [it], and brought [it] to David: nevertheless he would not drink thereof, but poured it out unto the LORD.';
Text[17] = 'And he said, Be it far from me, O LORD, that I should do this: [is not this] the blood of the men that went in jeopardy of their lives? therefore he would not drink it. These things did these three mighty men.';
Text[18] = 'And Abishai, the brother of Joab, the son of Zeruiah, was chief among three. And he lifted up his spear against three hundred, [and] slew [them], and had the name among three.';
Text[19] = 'Was he not most honourable of three? therefore he was their captain: howbeit he attained not unto the [first] three.';
