stringArray[2] = 'So __PNevery_man_1__SHevery man</a> of Israel went up from after David, [and] followed Sheba the son of Bichri: but __PNthe_men_2__SHthe men</a> of Judah clave unto their king, __PNfrom_Jordan_3__SHfrom Jordan</a> even to Jerusalem.__CPevery_man_1__PSevery man__FF2Sa/19/41\');">2Sa 19:41__NBPsa/62/9\');">Psa 62:9__NBPsa/118/8\');">Psa 118:8-10__NBPro/17/14\');">Pro 17:14__AN__GHthe_men_2__PSthe men__EFJhn/6/66\');">Jhn 6:66-68__NBAct/11/23\');">Act 11:23__AN__GGfrom_Jordan_3__PSfrom Jordan__FF2Sa/19/15\');">2Sa 19:15__NR2Sa/19/40\');">40__NR2Sa/19/41\');">41__NB2Ch/10/17\');">2Ch 10:17__EN';
stringArray[3] = 'And David came to his house at Jerusalem; and the king took the __PNten_women_1__SHten women</a> [his] concubines, whom he had left to keep the house, __PNand_put_2__SHand put</a> them in __PNward_3__SHward</a>, and fed them, but went not in unto them. So they were __PNshut_4__SHshut</a> up unto the day of their death, living in widowhood.__CPten_women_1__PSten women__FF2Sa/15/16\');">2Sa 15:16__NB2Sa/16/21\');">2Sa 16:21__NR2Sa/16/22\');">22__AN__GHand_put_2__PSand put__FEThe confinement and retired maintenance of these women was the only measure which in justice and prudence could be adopted. In China, when an emperor dies, all his women are removed to an edifice called the palace of chastity, situated within the palace, in which they are shut up for the remainder of their lives.__GGward_3__PSward__EEHeb. an house of ward. __NAGen/40/3\');">Gen 40:3__AN__GHshut_4__PSshut__FEHeb. bound. living in widowhood. Heb. in widowhood of life.</TD></TR>';

stringArray[7] = 'And there went out after him Joab\'s men, and the Cherethites, and the Pelethites, and all the mighty men: and they went out of Jerusalem, to pursue after Sheba the son of Bichri.__CPRelated_Verses1_1__PSEntire Verse.__FF2Sa/20/23\');">2Sa 20:23__NB2Sa/8/16\');">2Sa 8:16__NR2Sa/8/18\');">18__NB2Sa/15/18\');">2Sa 15:18__NB2Sa/23/22\');">2Sa 23:22__NR2Sa/23/23\');">23__NB1Ki/1/38\');">1Ki 1:38__NR1Ki/1/44\');">44__EN';
stringArray[8] = 'When they [were] at the great stone which [is] __PNin_Gibeon_1__SHin Gibeon</a>, __PNAmasa_2__SHAmasa</a> went before them. And Joab\'s garment that he had put on was girded unto him, and upon it a girdle [with] a sword fastened upon his loins in the sheath thereof; and as he went forth it fell out.__CPin_Gibeon_1__PSin Gibeon__FF2Sa/2/13\');">2Sa 2:13__NB2Sa/3/30\');">2Sa 3:30__AN__GHAmasa_2__PSAmasa__EF2Sa/20/4\');">2Sa 20:4__NR2Sa/20/5\');">5__EN';
stringArray[9] = 'And Joab said to Amasa, __PNArt_thou_1__SH[Art] thou</a> in health, my brother? And Joab __PNtook_Amasa_2__SHtook Amasa</a> by the beard with the right hand __PNto_kiss_him_3__SHto kiss him</a>.__CPArt_thou_1__PSArt thou__FFPsa/55/21\');">Psa 55:21__NBPro/26/24\');">Pro 26:24-26__NBMic/7/2\');">Mic 7:2__AN__GHtook_Amasa_2__PStook Amasa__FE"Thevenot says, that among the Turks it is a great afront to take one by the beard, unless it be to kiss him, in which case they often do it. D\'Arvieux, describing an assembly of Arab emirs at an entertainment, says, ""After the usual civilities, caresses, kissings of the beard, and of the hand, which every one gave and received according to his rank and dignity, they sat down upon mats."" The doing this by the Arab emirs corresponds with the conduct of Joab, and illustrates this horrid assassination."__GGto_kiss_him_3__PSto kiss him__FFMat/26/48\');">Mat 26:48__NRMat/26/49\');">49__NBLuk/22/47\');">Luk 22:47__NRLuk/22/48\');">48__EN';
stringArray[10] = 'But Amasa took no heed to the sword that [was] __PNin_Joab_s_1__SHin Joab\'s</a> hand: so __PNhe_smote_2__SHhe smote</a> him therewith in the fifth [rib], __PNand_shed_3__SHand shed</a> out his bowels to the ground, and __PNstruck_him_not_again_4__SHstruck him not again</a>; and he died. So Joab and Abishai his brother pursued after Sheba the son of Bichri.__CPin_Joab_s_1__PSin Joab\'s__FF2Sa/20/9\');">2Sa 20:9__NBJdg/3/21\');">Jdg 3:21__NB1Ch/12/2\');">1Ch 12:2__AN__GHhe_smote_2__PShe smote__EF2Sa/2/23\');">2Sa 2:23__NB2Sa/3/27\');">2Sa 3:27__NBGen/4/8\');">Gen 4:8__NB1Ki/2/5\');">1Ki 2:5__NR1Ki/2/6\');">6__NR1Ki/2/31\');">31-34__AN__GGand_shed_3__PSand shed__FFAct/1/18\');">Act 1:18__NRAct/1/19\');">19__AN__GHstruck_him_not_again_4__PSstruck him not again__FEHeb. doubled not his stroke. __NA1Sa/26/8\');">1Sa 26:8__EN';

stringArray[13] = 'When he was removed out of __PNthe_highway_1__SHthe highway</a>, all the people went on after Joab, to pursue after Sheba the son of Bichri.__CPthe_highway_1__PSthe highway__FF2Sa/20/12\');">2Sa 20:12__NR2Sa/20/13\');">13__NBNum/20/19\');">Num 20:19__NBJdg/21/19\');">Jdg 21:19__NB1Sa/6/12\');">1Sa 6:12__NB2Ki/18/17\');">2Ki 18:17__NBPro/16/17\');">Pro 16:17__NBIsa/7/3\');">Isa 7:3__NBIsa/36/2\');">Isa 36:2__NBIsa/62/10\');">Isa 62:10__NBJer/31/21\');">Jer 31:21__NBMar/10/46\');">Mar 10:46__EN';
stringArray[14] = 'And he went through all the tribes of Israel unto __PNAbel_1__SHAbel</a>, and to Bethmaachah, and all the __PNBerites_2__SHBerites</a>: and they were gathered together, and went also after him.__CPAbel_1__PSAbel__EE"Or rather, probably, Abel of Beth-Maachah, as in the next verse. It appears, from Joab having marched ""through all the tribes of Israel,"" to have been situated in the northern confines of the land of Israel, and in the half tribe of Manasseh, east of Jordan, as that was the situation of Maachah, to which it belonged. This agrees with the situation of the Abela which Eusebius and Jerome place between Paneas, or Cæsarea Philippi, and Damascus. Josephus says it was a fortified city, and a metropolis of the Israelites; and also that it belonged to the ten tribes, having been taken from the king of Damascus. __NA1Ki/15/20\');">1Ki 15:20__NB2Ki/15/29\');">2Ki 15:29__NB2Ch/16/4\');">2Ch 16:4__AN"__GHBerites_2__PSBerites__EFJos/18/25\');">Jos 18:25__AN; Beeroth</TD></TR>';
stringArray[15] = 'And they came and besieged him in Abel of Bethmaachah, and they __PNcast_up_1__SHcast up</a> __PNa_bank_2__SHa bank</a> against the city, and __PNit_stood_in_the_trench_3__SHit stood in the trench</a>: and all the people that [were] with Joab battered the wall, to throw it down.__CPcast_up_1__PScast up__FF2Ki/19/32\');">2Ki 19:32__NBJer/32/24\');">Jer 32:24__NBJer/33/4\');">Jer 33:4__NBLuk/19/43\');">Luk 19:43__AN__GHa_bank_2__PSa bank__FE"So LXX. generally render solelah, by [proschoma or choma;] which latter is described by Potter as ""a mount, which was raised so high as to equal, if not exceed, the top of the besieged walls. The sides were walled in with bricks or stones, or secured with strong rafters; the fore part only, being by degrees to be moved near the walls, remained bare."""__GGit_stood_in_the_trench_3__PSit stood in the trench__EEor, it stood against the outmost wall. battered, etc. Heb. marred to throw down.</TD></TR>';
