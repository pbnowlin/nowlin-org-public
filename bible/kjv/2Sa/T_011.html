stringArray[14] = 'And it came to pass in the morning, that David __PNwrote_a_letter_1__SHwrote a letter</a> to Joab, and sent [it] by the hand of Uriah.__CPwrote_a_letter_1__PSwrote a letter__EEIt was resolved in David\'s breast that Uriah must die--that innocent, valiant, and gallant man, who was ready to sacrifice his life for the honour of his prince; and, worse than all, by being himself made the bearer of letters to Joab which prescribed the mode by which he was to be murdered. This was the greatest treachery and villany on the part of David; while Joab appears to enter as fully upon the execution of the murder, being perhaps pleased to have this opportunity of further enthralling his king, and thus increasing his own power. __NA1Ki/21/8\');">1Ki 21:8-10__NBPsa/19/13\');">Psa 19:13__NBPsa/52/2\');">Psa 52:2__NBPsa/62/9\');">Psa 62:9__NBJer/9/1\');">Jer 9:1-4__NBJer/17/9\');">Jer 17:9__NBMic/7/3\');">Mic 7:3-5__EN';
