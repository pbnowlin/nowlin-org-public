<script type="text/javascript">
var stringArray = new Array();
stringArray[1] = 'And David __PNnumbered_1__SHnumbered</a> the people that [were] with him, and set __PNcaptains_of_thousands_2__SHcaptains of thousands</a> and captains of hundreds over them.__CPnumbered_1__PSnumbered__FFExd/17/9\');">Exd 17:9__NBJos/8/10\');">Jos 8:10__AN__GHcaptains_of_thousands_2__PScaptains of thousands__EF1Sa/8/12\');">1Sa 8:12__EN';
stringArray[2] = 'And David sent forth __PNa_third_part_1__SHa third part</a> of the people under __PNthe_hand_of_Joab_2__SHthe hand of Joab</a>, and a third part under the hand of Abishai the son of Zeruiah, Joab\'s brother, and a third part under the hand of __PNIttai_3__SHIttai</a> the Gittite. And the king said unto the people, __PNI_will_surely_4__SHI will surely</a> go forth with you myself also.__CPa_third_part_1__PSa third part__FFJdg/7/16\');">Jdg 7:16__NRJdg/7/19\');">19__NBJdg/9/43\');">Jdg 9:43__AN__GHthe_hand_of_Joab_2__PSthe hand of Joab__EF2Sa/10/7\');">2Sa 10:7-10__AN__GGIttai_3__PSIttai__FF2Sa/15/19\');">2Sa 15:19-22__AN__GHI_will_surely_4__PSI will surely__EF2Sa/17/11\');">2Sa 17:11__NBPsa/3/6\');">Psa 3:6__NBPsa/27/1\');">Psa 27:1-3__NBPsa/118/6\');">Psa 118:6-8__EN';
stringArray[3] = 'But the people answered, __PNThou_shalt_1__SHThou shalt</a> not go forth: for __PNif_we_flee_2__SHif we flee</a> away, they will not __PNcare_for_us_3__SHcare for us</a>; neither if half of us die, will they care for us: but now [thou art] __PNworth__etc__4__SHworth</a> ten thousand of us: therefore now [it is] better that thou __PNsuccour_5__SHsuccour</a> us out of the city.__CPThou_shalt_1__PSThou shalt__FF2Sa/21/17\');">2Sa 21:17__AN__GHif_we_flee_2__PSif we flee__EF2Sa/17/2\');">2Sa 17:2__NB1Ki/22/31\');">1Ki 22:31__NBZec/13/7\');">Zec 13:7__AN__GGcare_for_us_3__PScare for us__EEHeb. set their heart on us. but now. The particle âttah, Now, is doubtless a mistake for the pronoun attah, Thou: and so it appears to have been read by the LXX., Vulgate, and Chaldee, and by two of Kennicott\'s and De Rossi\'s MSS.__GHworth__etc__4__PSworth, etc.__FEHeb. as ten thousand of us. __NALam/4/20\');">Lam 4:20__AN__GGsuccour_5__PSsuccour__EEHeb. be to succour. __NA2Sa/10/11\');">2Sa 10:11__NBExd/17/10\');">Exd 17:10-12__EN';
stringArray[4] = 'And the king said unto them, What seemeth you best I will do. And the king stood __PNby_the_gate_1__SHby the gate</a> side, and all the people came out __PNby_hundreds_2__SHby hundreds</a> and by thousands.__CPby_the_gate_1__PSby the gate__FF2Sa/18/24\');">2Sa 18:24__NBIsa/28/6\');">Isa 28:6__AN__GHby_hundreds_2__PSby hundreds__FEDavid\'s small company, by this time, was greatly recruited; but what its number was we cannot tell. Josephus says it amounted only to 4,000 men. __NA2Sa/18/1\');">2Sa 18:1__NB1Sa/29/2\');">1Sa 29:2__EN';
stringArray[5] = 'And the king commanded Joab and Abishai and Ittai, saying, __PNDeal_gently_1__SH[Deal] gently</a> for my sake with the young man, [even] with Absalom. And __PNall_the_people_2__SHall the people</a> heard when the king gave all the captains charge concerning Absalom.__CPDeal_gently_1__PSDeal gently__FF2Sa/16/11\');">2Sa 16:11__NB2Sa/17/1\');">2Sa 17:1-4__NR2Sa/17/14\');">14__NBDeu/21/18\');">Deu 21:18-21__NBPsa/103/13\');">Psa 103:13__NBLuk/23/34\');">Luk 23:34__AN__GHall_the_people_2__PSall the people__EF2Sa/18/12\');">2Sa 18:12__EN';
stringArray[6] = 'So the people went out into the field against Israel: and the battle was in the __PNwood_of_Ephraim_1__SHwood of Ephraim</a>;__CPwood_of_Ephraim_1__PSwood of Ephraim__EEThe wood of Ephraim was evidently beyond Jordan, and apparently not far from Mahanaim; and it is supposed to be the place where the Ephraimites were slain by Jephthah. __NAJos/17/15\');">Jos 17:15__NRJos/17/18\');">18__NBJdg/12/4\');">Jdg 12:4-6__EN';
stringArray[7] = 'Where __PNthe_people_1__SHthe people</a> of Israel were slain before the servants of David, and there was there __PNa_great_2__SHa great</a> slaughter that day of __PNtwenty_thousand_men_3__SHtwenty thousand [men]</a>.__CPthe_people_1__PSthe people__FF2Sa/2/17\');">2Sa 2:17__NB2Sa/15/6\');">2Sa 15:6__NB2Sa/19/41\');">2Sa 19:41-43__AN__GHa_great_2__PSa great__EFPro/11/21\');">Pro 11:21__NBPro/24/21\');">Pro 24:21__AN__GGtwenty_thousand_men_3__PStwenty thousand men__FF2Sa/2/26\');">2Sa 2:26__NR2Sa/2/31\');">31__NB2Ch/13/16\');">2Ch 13:16__NR2Ch/13/17\');">17__NB2Ch/28/6\');">2Ch 28:6__EN';
stringArray[8] = 'For the battle was there scattered over the face of all the country: and __PNthe_wood_1__SHthe wood</a> __PNdevoured_more_2__SHdevoured more</a> people that day than the sword devoured.__CPthe_wood_1__PSthe wood__EEThat is, probably, many more were slain in pursuit through the wood than in the battle, by falling into swamps, pits, etc., and being entangled and cut down by David\'s men. Such is the relation of Josephus; but the Chaldee, Syriac, and Arabic state, that they were devoured by wild beasts in the wood. __NAExd/15/10\');">Exd 15:10__NBJos/10/11\');">Jos 10:11__NBJdg/5/20\');">Jdg 5:20__NRJdg/5/21\');">21__NB1Ki/20/30\');">1Ki 20:30__NBPsa/3/7\');">Psa 3:7__NBPsa/43/1\');">Psa 43:1__AN__GHdevoured_more_2__PSdevoured more__FEHeb. multiplied to devour.</TD></TR>';
stringArray[9] = 'And Absalom met the servants of David. And Absalom rode upon a mule, and the mule went under the thick boughs of a great oak, and __PNhis_head_1__SHhis head</a> caught hold of the oak, and he was __PNtaken_up_2__SHtaken up</a> between the heaven and the earth; and the mule that [was] under him went away.__CPhis_head_1__PShis head__EERiding furiously under the thick boughs of a great oak, which hung low and had never been cropped, either the twisted branches, or some low forked bough of the tree, caught him by the neck, or, as some think, by the loops into which his long hair had been pinned, which had been so much his pride, and was now justly made a halter for him. He may have hung so low from the bough, in consequence of the length of his hair, that he could not use his hands to help himself, or so entangled that his hands were bound, so that the more he struggled the more he was embarrassed. This set him up as a fair mark to the servants of David; and although David would have spared his rebellious son, if his orders had been executed, yet he could not turn the sword of Divine justice, in executing the just, righteous sentence of death on this traitorous son. __NA2Sa/18/14\');">2Sa 18:14__NB2Sa/14/26\');">2Sa 14:26__NB2Sa/17/23\');">2Sa 17:23__NBMat/27/5\');">Mat 27:5__AN__GHtaken_up_2__PStaken up__EFDeu/21/23\');">Deu 21:23__NBDeu/27/16\');">Deu 27:16__NRDeu/27/20\');">20__NBJob/18/8\');">Job 18:8-10__NBJob/31/3\');">Job 31:3__NBPsa/63/9\');">Psa 63:9__NRPsa/63/10\');">10__NBPro/20/20\');">Pro 20:20__NBPro/30/17\');">Pro 30:17__NBJer/48/44\');">Jer 48:44__NBMar/7/10\');">Mar 7:10__NBGal/3/13\');">Gal 3:13__EN';
stringArray[10] = 'And a certain man saw [it], and told Joab, and said, Behold, I saw Absalom hanged in an oak.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[11] = 'And Joab said unto the man that told him, And, behold, thou sawest [him], and why didst thou not smite him there to the ground? and I would have given thee ten [shekels] of silver, and a girdle.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[12] = 'And the man said unto Joab, Though I should __PNreceive__etc__1__SHreceive</a> a thousand [shekels] of silver in mine hand, [yet] would I not put forth mine hand against the king\'s son: for __PNin_our_hearing_2__SHin our hearing</a> the king charged thee and Abishai and Ittai, saying, __PNBeware__etc__3__SHBeware</a> that none [touch] the young man Absalom.__CPreceive__etc__1__PSreceive, etc.__EEHeb. weigh upon mine hand__GHin_our_hearing_2__PSin our hearing__EF2Sa/18/5\');">2Sa 18:5__AN__GGBeware__etc__3__PSBeware, etc.__EEHeb. Beware, whosoever ye be, of the, etc.</TD></TR>';
stringArray[13] = 'Otherwise I should have __PNwrought_1__SHwrought</a> falsehood against mine own life: __PNfor_there_is_no_2__SHfor there is no</a> matter hid from the king, and thou thyself wouldest have set thyself against [me].__CPwrought_1__PSwrought__FF2Sa/1/15\');">2Sa 1:15__NR2Sa/1/16\');">16__NB2Sa/4/10\');">2Sa 4:10-12__AN__GHfor_there_is_no_2__PSfor there is no__EF2Sa/14/19\');">2Sa 14:19__NR2Sa/14/20\');">20__NBHbr/4/13\');">Hbr 4:13__EN';
stringArray[14] = 'Then said Joab, I may not tarry thus __PNwith_thee_1__SHwith thee</a>. And he took three darts in his hand, and __PNthrust_them_2__SHthrust them</a> through the heart of Absalom, while he [was] yet alive in the __PNmidst_3__SHmidst</a> of the oak.__CPwith_thee_1__PSwith thee__EEHeb. before thee__GHthrust_them_2__PSthrust them__EF2Sa/18/5\');">2Sa 18:5__NBJdg/4/21\');">Jdg 4:21__NBJdg/5/26\');">Jdg 5:26__NRJdg/5/31\');">31__NBPsa/45/5\');">Psa 45:5__NB1Th/5/3\');">1Th 5:3__AN__GGmidst_3__PSmidst__EEHeb. heart. __NAMat/12/40\');">Mat 12:40__EN';
stringArray[15] = 'And ten young men that bare Joab\'s armour compassed about and smote Absalom, and slew him.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[16] = 'And Joab __PNblew_the_trumpet_1__SHblew the trumpet</a>, and the people returned from pursuing after Israel: for Joab held back the people.__CPblew_the_trumpet_1__PSblew the trumpet__FF2Sa/2/28\');">2Sa 2:28__NB2Sa/20/22\');">2Sa 20:22__NBNum/10/2\');">Num 10:2-10__NB1Cr/14/8\');">1Cr 14:8__EN';
stringArray[17] = 'And they took Absalom, and cast him into a great pit in the wood, and __PNlaid_1__SHlaid</a> a very great heap of stones upon him: and all Israel fled every one to his tent.__CPlaid_1__PSlaid__EEThis was the ancient method of burying, whether heroes or traitors; the heap of stones being designed to perpetuate the memory of the event, whether good or bad. The Arabs in general make use of no other monument than a heap of stones over a grave. Thus, in an Arabic poem, it is related, that Hatim the father, and Adi the grandfather of Kais, having been murdered, at a time before Kais was capable of reflection, his mother kept it a profound secret; and in order to guard him against having any suspicion, she collected a parcel of stone on two hillocks in the neighbourhood, and told her son that the one was the grave of his father, and the other of his grandfather. The ancient cairns in Ireland and Scotland, and the tumuli in England, are of this kind. __NAJos/7/26\');">Jos 7:26__NBJos/8/29\');">Jos 8:29__NBJos/10/27\');">Jos 10:27__NBPro/10/7\');">Pro 10:7__NBJer/22/18\');">Jer 22:18__NRJer/22/19\');">19__EN';
stringArray[18] = 'Now Absalom in his lifetime had taken and __PNreared_up_1__SHreared up</a> for himself a pillar, which [is] in __PNthe_king_s_2__SHthe king\'s</a> dale: for he said, __PNI_have_no_son_3__SHI have no son</a> to keep my name in remembrance: and __PNhe_called_4__SHhe called</a> the pillar after his own name: and it is called unto this day, __PNAbsalom_s_place_5__SHAbsalom\'s place</a>.__CPreared_up_1__PSreared up__FF1Sa/15/12\');">1Sa 15:12__AN__GHthe_king_s_2__PSthe king\'s__EFGen/14/17\');">Gen 14:17__AN__GGI_have_no_son_3__PSI have no son__FF2Sa/14/27\');">2Sa 14:27__NBJob/18/16\');">Job 18:16__NRJob/18/17\');">17__NBPsa/109/13\');">Psa 109:13__NBJer/22/30\');">Jer 22:30__AN__GHhe_called_4__PShe called__EFGen/11/4\');">Gen 11:4__NB1Sa/15/12\');">1Sa 15:12__NBPsa/49/11\');">Psa 49:11__NBDan/4/30\');">Dan 4:30__AN__GGAbsalom_s_place_5__PSAbsalom\'s place__EEJosephus says there was in his time, about two furlongs from Jerusalem, a marble pillar called Absalom\'s hand, as it is in the Hebrew, (See note on __NA1Sa/15/12\');">1Sa 15:12__AN;) and there is one shown to the present day, in the valley of Jehoshaphat, which, though comparatively a modern structure, probably occupies the site of the original one set up by Absalom. __NAGen/11/9\');">Gen 11:9__NBAct/1/18\');">Act 1:18__NRAct/1/19\');">19__EN';
stringArray[19] = 'Then said __PNAhimaaz_1__SHAhimaaz</a> the son of Zadok, Let me now run, and bear the king tidings, how that the LORD hath __PNavenged_him_2__SHavenged him</a> of his enemies.__CPAhimaaz_1__PSAhimaaz__FF2Sa/18/23\');">2Sa 18:23__NR2Sa/18/27\');">27-29__NB2Sa/15/36\');">2Sa 15:36__NB2Sa/17/17\');">2Sa 17:17__AN__GHavenged_him_2__PSavenged him__FEHeb. judged him from the hand, etc. __NAPsa/7/6\');">Psa 7:6__NRPsa/7/8\');">8__NRPsa/7/9\');">9__NBPsa/9/4\');">Psa 9:4__NRPsa/9/16\');">16__NBPsa/10/14\');">Psa 10:14__NRPsa/10/18\');">18__NBRom/12/19\');">Rom 12:19__EN';
stringArray[20] = 'And Joab said unto him, Thou shalt not __PNbear_tidings_1__SHbear tidings</a> this day, but thou shalt bear tidings another day: but this day thou shalt bear no tidings, __PNbecause_2__SHbecause</a> the king\'s son is dead.__CPbear_tidings_1__PSbear tidings__EEHeb. be a man of tidings. __NA2Sa/17/16\');">2Sa 17:16-21__AN__GHbecause_2__PSbecause__EF2Sa/18/5\');">2Sa 18:5__NR2Sa/18/27\');">27__NR2Sa/18/29\');">29__NR2Sa/18/33\');">33__EN';
stringArray[21] = 'Then said Joab to Cushi, Go tell the king what thou hast seen. And Cushi bowed himself unto Joab, and ran.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[22] = 'Then said Ahimaaz the son of Zadok yet again to Joab, But __PNhowsoever_1__SHhowsoever</a>, let me, I pray thee, also run after Cushi. And Joab said, Wherefore wilt thou run, my son, seeing that thou hast no tidings __PNready_2__SHready</a>?__CPhowsoever_1__PShowsoever__EEHeb. be what may__GHready_2__PSready__FEor, convenient. __NARom/1/28\');">Rom 1:28__NBEph/5/4\');">Eph 5:4__EN';
stringArray[23] = 'But howsoever, [said he], let me run. And he said unto him, Run. Then Ahimaaz ran by the way of the plain, and __PNoverran_Cushi_1__SHoverran Cushi</a>.__CPoverran_Cushi_1__PSoverran Cushi__FFJhn/20/4\');">Jhn 20:4__EN';
stringArray[24] = 'And David sat __PNbetween_1__SHbetween</a> the two gates: and __PNthe_watchman_2__SHthe watchman</a> went up to the roof over the gate unto the wall, and lifted up his eyes, and looked, and behold a man running alone.__CPbetween_1__PSbetween__FF2Sa/18/4\');">2Sa 18:4__NB1Sa/4/13\');">1Sa 4:13__AN__GHthe_watchman_2__PSthe watchman__EF2Ki/9/17\');">2Ki 9:17-20__NBIsa/21/6\');">Isa 21:6-9__NRIsa/21/11\');">11__NRIsa/21/12\');">12__NBEze/33/2\');">Eze 33:2-7__EN';
stringArray[25] = 'And the watchman cried, and told the king. And the king said, If he [be] alone, [there is] tidings in his mouth. And he came apace, and drew near.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[26] = 'And the watchman saw another man running: and the watchman called unto the porter, and said, Behold [another] man running alone. And the king said, He also bringeth tidings.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[27] = 'And the watchman said, __PNMe_thinketh_1__SHMe thinketh</a> the running of the foremost is like the running of Ahimaaz the son of Zadok. And the king said, __PNHe_is_a_good_2__SHHe [is] a good</a> man, and cometh with good tidings.__CPMe_thinketh_1__PSMe thinketh__EEHeb. I see. __NA2Ki/9/20\');">2Ki 9:20__AN__GHHe_is_a_good_2__PSHe is a good__EF1Ki/1/42\');">1Ki 1:42__NBPro/25/13\');">Pro 25:13__NRPro/25/25\');">25__NBIsa/52/7\');">Isa 52:7__NBRom/10/15\');">Rom 10:15__EN';
stringArray[28] = 'And Ahimaaz called, and said unto the king, __PNAll_is_well_1__SHAll is well</a>. And he fell down to the earth upon his face before the king, and said, __PNBlessed_2__SHBlessed</a> [be] the LORD thy God, which hath __PNdelivered_up_3__SHdelivered up</a> the men that lifted up their hand against my lord the king.__CPAll_is_well_1__PSAll is well__EEor, Peace be to thee. Heb. Peace. he fell down upon his face. This act was not only in reverence to the king, but in humble adoration of God, whose name he praises for this victory. The more our hearts are fixed and enlarged, in thanksgiving to God for our mercies, the better disposed we shall be to bear with patience the afflictions mixed with them. __NA2Sa/1/2\');">2Sa 1:2__NB2Sa/14/4\');">2Sa 14:4__AN__GHBlessed_2__PSBlessed__EF2Sa/22/27\');">2Sa 22:27__NBGen/14/20\');">Gen 14:20__NBGen/24/27\');">Gen 24:27__NB2Ch/20/26\');">2Ch 20:26__NBPsa/115/1\');">Psa 115:1__NBPsa/124/6\');">Psa 124:6__NBPsa/144/1\');">Psa 144:1__NRPsa/144/2\');">2__NBRev/19/1\');">Rev 19:1-3__AN__GGdelivered_up_3__PSdelivered up__EEHeb. shut up. __NA1Sa/24/18\');">1Sa 24:18__NB1Sa/26/8\');">1Sa 26:8__NBPsa/31/8\');">Psa 31:8__EN';
stringArray[29] = 'And the king said, __PNIs_the_young_man_Absalom_safe__1__SHIs the young man Absalom safe?</a>? And Ahimaaz answered, When Joab sent the king\'s servant, and [me] thy servant,__PN_I_saw_a_great_2__SH I saw a great</a> tumult, but I knew not what [it was].__CPIs_the_young_man_Absalom_safe__1__PSIs the young man Absalom safe?__EEHeb. is there peace to, etc.?__GH_I_saw_a_great_2__PS I saw a great__EF2Sa/18/19\');">2Sa 18:19__NR2Sa/18/20\');">20__NR2Sa/18/22\');">22__EN';
stringArray[30] = 'And the king said [unto him], Turn aside, [and] stand here. And he turned aside, and stood still.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[31] = 'And, behold, Cushi came; and Cushi said, __PNTidings_1__SHTidings</a>, my lord the king: for the LORD hath avenged thee this day of all them that rose up against thee.__CPTidings_1__PSTidings__EEHeb. Tidings is brought. the LORD. __NA2Sa/18/19\');">2Sa 18:19__NR2Sa/18/28\');">28__NB2Sa/22/48\');">2Sa 22:48__NR2Sa/22/49\');">49__NBDeu/32/35\');">Deu 32:35__NRDeu/32/36\');">36__NBPsa/58/10\');">Psa 58:10__NBPsa/94/1\');">Psa 94:1-4__NBPsa/124/2\');">Psa 124:2__NRPsa/124/3\');">3__NBLuk/18/7\');">Luk 18:7__NRLuk/18/8\');">8__AN; Cushi was the man Joab ordered to carry the tidings to David. He was an Ethiopian, as his name signifies, and some think he was so by birth--a black, who waited on Joab, probably one of the ten who had helped to dispatch Absalom; though it was dangerous for one of those to bring the news to David, lest his fate should be the same with theirs that reported the death of Saul and Ishbosheth to him.</TD></TR>';
stringArray[32] = 'And the king said unto Cushi, Is the young man Absalom safe? And Cushi answered, __PNThe_enemies_1__SHThe enemies</a> of my lord the king, and all that rise against thee to do [thee] hurt, be as [that] young man [is].__CPThe_enemies_1__PSThe enemies__EEThus Cushi obliquely and slowly informs David of the death of his son Absalom. __NAJdg/5/31\');">Jdg 5:31__NBPsa/68/1\');">Psa 68:1__NRPsa/68/2\');">2__NBDan/4/19\');">Dan 4:19__EN';
stringArray[33] = 'And the king was much moved, and went up to the chamber over the gate, and wept: and as he went, thus he said, __PNO_my_son_1__SHO my son</a> Absalom, my son, my son Absalom! __PNwould_God_2__SHwould God</a> I had died for thee, O Absalom, my son, my son!__CPO_my_son_1__PSO my son__FF2Sa/19/4\');">2Sa 19:4__AN__GHwould_God_2__PSwould God__EF2Sa/12/10\');">2Sa 12:10-23__NBPsa/103/13\');">Psa 103:13__NBPro/10/1\');">Pro 10:1__NBPro/17/25\');">Pro 17:25__NBJam/5/17\');">Jam 5:17__EN';

</script>
