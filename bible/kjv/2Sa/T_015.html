stringArray[23] = 'And __PNall_the_country_1__SHall the country</a> wept with a loud voice, and all the people passed over: the king also himself passed over __PNthe_brook_2__SHthe brook</a> __PNKidron_3__SHKidron</a>, and all the people passed over, toward the way of __PNthe_wilderness_4__SHthe wilderness</a>.__CPall_the_country_1__PSall the country__FFRom/12/15\');">Rom 12:15__AN__GHthe_brook_2__PSthe brook__FEThe brook Kidron, which is but a few paces broad, runs along the valley of Jehoshaphat, east of Jerusalem, to the south-west corner of the city, and then, turning to the south-east, empties itself into the Dead Sea. Like the Ilissus, it is dry at least nine months in the year, being only furnished with water in the winter, and after heavy rains: its bed is narrow and deep, which indicates that it must formerly have been the channel for waters which have found some other, and probably subterraneous course.__GGKidron_3__PSKidron__FF1Ki/2/37\');">1Ki 2:37__NBJhn/18/1\');">Jhn 18:1__AN; Cedron.__GHthe_wilderness_4__PSthe wilderness__EF2Sa/16/2\');">2Sa 16:2__NBMat/3/1\');">Mat 3:1__NRMat/3/3\');">3__NBLuk/1/80\');">Luk 1:80__EN';

stringArray[30] = 'And David went up by __PNthe_ascent_1__SHthe ascent</a> of __PNmount_Olivet_2__SH[mount] Olivet</a>, __PNand_wept_as_he_went_up_3__SHand wept as he went up</a>, and had __PNhis_head_covered_4__SHhis head covered</a>, and he went __PNbarefoot_5__SHbarefoot</a>: and all the people that [was] with him covered every man his head, and they went up, __PNweeping_6__SHweeping</a> as they went up.__CPthe_ascent_1__PSthe ascent__FFZec/14/4\');">Zec 14:4__NBLuk/19/29\');">Luk 19:29__NRLuk/19/37\');">37__NBLuk/21/37\');">Luk 21:37__NBLuk/22/39\');">Luk 22:39__NBAct/1/12\');">Act 1:12__AN__GHmount_Olivet_2__PSmount Olivet__FEMount Olivet, so called from its abounding with olive trees, is situated east of Jerusalem, being separated from it only by the valley of Jehoshaphat and the brook Kidron. Josephus says it is five stadia, i.e., 625 geometrical paces from Jerusalem; and St. Luke (__NAAct/1/12\');">Act 1:12__AN) says it is a Sabbath day\'s journey, or about eight stadia distant, i.e., to the summit. It forms part of a ridge of limestone hills, extending from north to south for about a mile; and it is described as having three, or, according to others, four summits; the central and highest of which overlooks the whole of the city, over whose streets and walls the eye roves as if in the survey of a model.__GGand_wept_as_he_went_up_3__PSand wept as he went up__EEHeb. going up and weeping. __NAPsa/42/3\');">Psa 42:3-11__NBPsa/43/1\');">Psa 43:1__NRPsa/43/2\');">2__NRPsa/43/5\');">5__NBLuk/19/41\');">Luk 19:41__AN__GHhis_head_covered_4__PShis head covered__FEThis custom was only practised by persons in great distress, or when convicted of great crimes. Thus Darius, when informed by Tyriotes, the eunuch, that his queen was dead, and that she had suffered no violence from Alexander, covered his head, and wept a long time; then throwing off the garment that covered him, he thanked the gods for Alexander\'s moderation and justice. __NA2Sa/19/4\');">2Sa 19:4__NBEst/6/
