stringArray[6] = 'And it came to pass, while there was war between the house of Saul and the house of David, that __PNAbner_1__SHAbner</a> made himself strong for the house of Saul.__CPAbner_1__PSAbner__FF2Sa/2/8\');">2Sa 2:8__NR2Sa/2/9\');">9__NB2Ki/10/23\');">2Ki 10:23__NB2Ch/25/8\');">2Ch 25:8__NBPro/21/30\');">Pro 21:30__NBIsa/8/9\');">Isa 8:9__NRIsa/8/10\');">10__NBJoe/3/9\');">Joe 3:9-13__NBMat/12/30\');">Mat 12:30__EN';
stringArray[7] = 'And Saul had a concubine, whose name [was] __PNRizpah_1__SHRizpah</a>, the daughter of Aiah: and [Ishbosheth] said to Abner, __PNWherefore_2__SHWherefore</a> hast thou __PNgone_in_3__SHgone in</a> unto my father\'s concubine?__CPRizpah_1__PSRizpah__FF2Sa/21/8\');">2Sa 21:8-11__AN__GHWherefore_2__PSWherefore__FEThis action of Abner\'s seems a most evident proof that he intended to seize on the government; and it was so understood by Ish-bosheth; see Parallel Texts.__GGgone_in_3__PSgone in__FF2Sa/12/8\');">2Sa 12:8__NB2Sa/16/21\');">2Sa 16:21__NR2Sa/16/22\');">22__NB1Ki/2/17\');">1Ki 2:17__NR1Ki/2/21\');">21__NR1Ki/2/22\');">22__EN';
stringArray[8] = 'Then was __PNAbner_1__SHAbner</a> very wroth for the words of Ishbosheth, and said, __PNAm_I_a_dog_s_head_2__SH[Am] I a dog\'s head</a>, which against Judah __PNdo_shew_3__SHdo shew</a> kindness this day unto the house of Saul thy father, to his brethren, and to his friends, and have not delivered thee into the hand of David, that thou chargest me to day with a fault concerning this woman?__CPAbner_1__PSAbner__FFPsa/76/10\');">Psa 76:10__NBMar/6/18\');">Mar 6:18__NRMar/6/19\');">19__AN__GHAm_I_a_dog_s_head_2__PSAm I a dog\'s head__FE"This was a proverbial expression among the Hebrews to denote whatever was deemed worthless and contemptible. Something similar to this was the answer of the Turkish commander at Beer, on the Euphrates, to a request made to see the castle. ""Do they,"" said he, ""take me for a child, or an ass\'s head, that they would feed me with sweet meats, and dupe me with a bit of cloth? No, they shall not see the castle."" __NA2Sa/9/8\');">2Sa 9:8__NB2Sa/16/9\');">2Sa 16:9__NBDeu/23/18\');">Deu 23:18__NB1Sa/24/14\');">1Sa 24:14__NR1Sa/24/15\');">15__NB2Ki/8/13\');">2Ki 8:13__AN"__GGdo_shew_3__PSdo shew__FF2Sa/3/9\');">2Sa 3:9__NR2Sa/3/18\');">18__NB2Sa/5/2\');">2Sa 5:2__NB1Sa/15/28\');">1Sa 15:28__NBPsa/2/1\');">Psa 2:1-4__NBIsa/37/23\');">Isa 37:23__NBAct/9/4\');">Act 9:4__NRAct/9/5\');">5__EN';
stringArray[9] = '__PNSo_do_God_1__SHSo do God</a> to Abner, and more also, except, __PNas_the_LORD_2__SHas the LORD</a> hath sworn to David, even so I do to him;__CPSo_do_God_1__PSSo do God__FF2Sa/3/35\');">2Sa 3:35__NB2Sa/19/13\');">2Sa 19:13__NBRth/1/17\');">Rth 1:17__NB1Sa/3/17\');">1Sa 3:17__NB1Sa/14/44\');">1Sa 14:44__NB1Sa/25/22\');">1Sa 25:22__NB1Ki/19/2\');">1Ki 19:2__AN__GHas_the_LORD_2__PSas the LORD__EF1Sa/15/28\');">1Sa 15:28__NB1Sa/16/1\');">1Sa 16:1-13__NB1Sa/28/17\');">1Sa 28:17__NB1Ch/12/23\');">1Ch 12:23__NBPsa/89/3\');">Psa 89:3__NRPsa/89/4\');">4__NRPsa/89/19\');">19__NRPsa/89/20\');">20__NRPsa/89/35\');">35-37__EN';
stringArray[10] = 'To translate the kingdom from the house of Saul, and to set up the throne of David over Israel and over Judah, __PNfrom_Dan_1__SHfrom Dan</a> even to Beersheba.__CPfrom_Dan_1__PSfrom Dan__FF2Sa/17/11\');">2Sa 17:11__NB2Sa/24/2\');">2Sa 24:2__NBJdg/20/1\');">Jdg 20:1__NB1Ki/4/25\');">1Ki 4:25__EN';

stringArray[13] = 'And he said, Well; I will make a league with thee: but one thing I require of thee, __PNthat_is_1__SHthat is</a>, __PNThou_shalt_2__SHThou shalt</a> not see my face, __PNexcept_3__SHexcept</a> thou first bring __PNMichal_4__SHMichal</a> Saul\'s daughter, when thou comest to see my face.__CPthat_is_1__PSthat is__EEHeb. saying__GHThou_shalt_2__PSThou shalt__EFGen/43/3\');">Gen 43:3__NBGen/44/23\');">Gen 44:23__NRGen/44/26\');">26__AN__GGexcept_3__PSexcept__EEAs Michal was not divorced, but violently separated from David, he had a legal right to demand her, and was justified in receiving her again. It is probable, also, that her marriage with Phaltiel was a force upon her inclinations; and whatever affections he might have for her, it was highly criminal for him to take another man\'s wife. David required Michal probably both out of affection for her, and to strengthen his interest, by asserting his affinity with the house of Saul.__GHMichal_4__PSMichal__EF2Sa/3/20\');">2Sa 3:20-23__NB1Sa/18/20\');">1Sa 18:20-28__NB1Sa/19/11\');">1Sa 19:11-17__NB1Ch/15/29\');">1Ch 15:29__EN';
stringArray[14] = 'And David sent messengers to __PNIsh_bosheth_1__SHIshbosheth</a> Saul\'s son, saying, Deliver [me] my wife Michal, which I espoused to me for __PNan_hundred_2__SHan hundred</a> foreskins of the Philistines.__CPIsh_bosheth_1__PSIsh-bosheth__FF2Sa/2/10\');">2Sa 2:10__AN__GHan_hundred_2__PSan hundred__EF1Sa/18/25\');">1Sa 18:25__NR1Sa/18/27\');">27__EN';
stringArray[15] = 'And Ishbosheth sent, and took her from [her] husband, [even] from __PNPhaltiel_1__SHPhaltiel</a> the son of Laish.__CPPhaltiel_1__PSPhaltiel__FF1Sa/25/44\');">1Sa 25:44__AN__GHPhalti_2__PSPhalti__FENULL</TD></TR>';
stringArray[16] = 'And her husband went with her __PNalong_weeping_1__SHalong weeping</a> behind her to __PNBahurim_2__SHBahurim</a>. Then said Abner unto him, Go, return. And he returned.__CPalong_weeping_1__PSalong weeping__EEHeb. going and weeping. __NAPro/9/17\');">Pro 9:17__NRPro/9/18\');">18__AN__GHBahurim_2__PSBahurim__EF2Sa/16/5\');">2Sa 16:5__NB2Sa/17/18\');">2Sa 17:18__NB2Sa/19/16\');">2Sa 19:16__NB1Ki/2/8\');">1Ki 2:8__EN';
stringArray[17] = 'And Abner had communication with the elders of Israel, saying, Ye sought for David __PNin_times_past_1__SHin times past</a> [to be] king over you:__CPin_times_past_1__PSin times past__EEHeb. both yesterday and the third day.</TD></TR>';
stringArray[18] = 'Now then do [it]: __PNfor_the_LORD_1__SHfor the LORD</a> hath spoken of David, saying, __PNBy_the_hand_2__SHBy the hand</a> of my servant David I will save my people Israel out of the hand of the Philistines, and out of the hand of all their enemies.__CPfor_the_LORD_1__PSfor the LORD__FF2Sa/3/9\');">2Sa 3:9__NB1Sa/13/14\');">1Sa 13:14__NB1Sa/15/28\');">1Sa 15:28__NB1Sa/16/1\');">1Sa 16:1__NR1Sa/16/12\');">12__NR1Sa/16/13\');">13__NBJhn/12/42\');">Jhn 12:42__NRJhn/12/43\');">43__AN__GHBy_the_hand_2__PSBy the hand__EFPsa/89/3\');">Psa 89:3__NRPsa/89/4\');">4__NRPsa/89/19\');">19-23__NBPsa/132/17\');">Psa 132:17__NRPsa/132/18\');">18__EN';
stringArray[19] = 'And Abner also spake in the ears of __PNBenjamin_1__SHBenjamin</a>: and Abner went also to speak in the ears of David in Hebron all that seemed good to Israel, and that seemed good to the whole house of Benjamin.__CPBenjamin_1__PSBenjamin__FF1Sa/10/20\');">1Sa 10:20__NR1Sa/10/21\');">21__NB1Ch/12/29\');">1Ch 12:29__NBPsa/68/27\');">Psa 68:27__EN';
stringArray[20] = 'So Abner came to __PNDavid_1__SHDavid</a> to Hebron, and twenty men with him. And David made Abner and the men that [were] with him a feast.__CPDavid_1__PSDavid__FFGen/26/30\');">Gen 26:30__NBGen/31/54\');">Gen 31:54__NBEst/1/3\');">Est 1:3__EN';
stringArray[21] = 'And Abner said unto David, I will arise and go, and __PNwill_gather_1__SHwill gather</a> all Israel unto my lord the king, that they may make a league with thee, and that thou mayest __PNreign_over_2__SHreign over</a> all that thine heart desireth. And David sent Abner away; and he went in peace.__CPwill_gather_1__PSwill gather__FF2Sa/3/10\');">2Sa 3:10__NR2Sa/3/12\');">12__NB2Sa/2/9\');">2Sa 2:9__NBPhl/2/21\');">Phl 2:21__AN__GHreign_over_2__PSreign over__EF1Ki/11/37\');">1Ki 11:37__NBPsa/20/4\');">Psa 20:4__EN';
stringArray[22] = 'And, behold, the servants of David and Joab came from [pursuing] a troop, and brought in a great spoil with them: but Abner [was] not with David in Hebron; for he had sent him away, and he was gone in peace.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[23] = 'When Joab and all the host that [was] with him were come, they told Joab, saying, Abner the son of Ner came to the king, and he hath sent him away, and he is gone in peace.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[24] = 'Then Joab came to the king, and said, __PNWhat_hast_1__SHWhat hast</a> thou done? behold, Abner came unto thee; why [is] it [that] thou hast sent him away, and he is quite gone?__CPWhat_hast_1__PSWhat hast__EEJoab and his brother Abishai, David\'s nephews, had been very faithful and highly useful to him in his distresses; and, from gratitude and natural affection, he had inadvertently permitted them to assume almost as much ascendancy over him as Abner had over the pusillanimous Ishbosheth: he trusted and feared them too much, and allowed them all the importance they claimed; which had emboldened them, especially Joab, to a high degree of presumption. __NA2Sa/3/8\');">2Sa 3:8__NR2Sa/3/39\');">39__NB2Sa/19/5\');">2Sa 19:5-7__NBNum/23/11\');">Num 23:11__NBJhn/18/35\');">Jhn 18:35__EN';
stringArray[25] = 'Thou knowest Abner the son of Ner, __PNthat_he_came_1__SHthat he came</a> to deceive thee, __PNand_to_know_2__SHand to know</a> thy going out and thy coming in, and to know all that thou doest.__CPthat_he_came_1__PSthat he came__FF2Sa/3/27\');">2Sa 3:27__NB2Ki/18/32\');">2Ki 18:32__AN; *marg:; __NAJhn/7/12\');">Jhn 7:12__NRJhn/7/47\');">47__NBRom/2/1\');">Rom 2:1__AN__GHand_to_know_2__PSand to know__EF2Sa/10/3\');">2Sa 10:3__NBGen/42/9\');">Gen 42:9__NRGen/42/12\');">12__NRGen/42/16\');">16__NBNum/27/17\');">Num 27:17__NBDeu/28/6\');">Deu 28:6__NB1Sa/29/4\');">1Sa 29:4-6__NBPsa/121/8\');">Psa 121:8__NBIsa/37/28\');">Isa 37:28__EN';
stringArray[26] = 'And when Joab was come out from David, __PNhe_sent_1__SHhe sent</a> messengers after Abner, which brought him again from the well of Sirah: but David knew [it] not.__CPhe_sent_1__PShe sent__FFPro/26/23\');">Pro 26:23-26__NBPro/27/4\');">Pro 27:4-6__EN';
stringArray[27] = 'And when Abner was returned to Hebron, Joab __PNtook_him_1__SHtook him</a> aside in the gate to speak with him __PNquietly_2__SHquietly</a>, __PNand_smote_3__SHand smote</a> him there under the fifth [rib], that he died, __PNfor_the_blood_4__SHfor the blood</a> of Asahel his brother.__CPtook_him_1__PStook him__FF2Sa/20/9\');">2Sa 20:9__NR2Sa/20/10\');">10__NBDeu/27/24\');">Deu 27:24__NB1Ki/2/5\');">1Ki 2:5__NR1Ki/2/32\');">32__AN__GHquietly_2__PSquietly__FEor, peaceably. __NAJer/41/2\');">Jer 41:2__NRJer/41/6\');">6__NRJer/41/7\');">7__AN__GGand_smote_3__PSand smote__EEJoab was afraid that Abner, after rendering such essential service to David, would be made the general of the army; and therefore, under pretence of avenging the death of his brother, he treacherously assassinated the unsuspecting and too-confiding Abner: and such was the power of this cool-blooded and nefarious murderer, that the king dared not bring him to justice for his crime. But, while Joab\'s conduct cannot be too severely reprobated, the justice of God is apparent in Abner\'s punishment; who, from ambition, had pertinaciously, against his conscience, opposed the declared will of God; and was induced by base resentment to desert Ish-bosheth, and offer his services to David: see __NA2Sa/3/6\');">2Sa 3:6-10__NB2Sa/4/6\');">4:6__AN.__GHfor_the_blood_4__PSfor the blood__EF2Sa/2/19\');">2Sa 2:19-23__EN';
stringArray[28] = 'And afterward when David heard [it], he said, I and my kingdom [are] __PNguiltless_1__SHguiltless</a> before the LORD for ever from the __PNblood_2__SHblood</a> of Abner the son of Ner:__CPguiltless_1__PSguiltless__FFGen/9/6\');">Gen 9:6__NBExd/21/12\');">Exd 21:12__NBNum/35/33\');">Num 35:33__NBDeu/21/1\');">Deu 21:1-9__NBMat/27/24\');">Mat 27:24__AN__GHblood_2__PSblood__FEHeb. bloods. __NAGen/4/10\');">Gen 4:10__AN; *marg:</TD></TR>';
stringArray[29] = 'Let it __PNrest_1__SHrest</a> on the head of Joab, and on all his father\'s house; and __PNlet_there_2__SHlet there</a> not __PNfail_3__SHfail</a> from the house of Joab one that hath __PNan_issue_4__SHan issue</a>, or that is a __PNleper_5__SHleper</a>, or that leaneth on a staff, or that falleth on the sword, or that lacketh bread.__CPrest_1__PSrest__FF2Sa/1/16\');">2Sa 1:16__NBJdg/9/24\');">Jdg 9:24__NRJdg/9/56\');">56__NRJdg/9/57\');">57__NB1Ki/2/31\');">1Ki 2:31-34__NBAct/28/4\');">Act 28:4__NBRev/16/6\');">Rev 16:6__AN__GHlet_there_2__PSlet there__EF1Sa/2/32\');">1Sa 2:32-36__NB2Ki/5/27\');">2Ki 5:27__NBPsa/109/8\');">Psa 109:8-19__AN__GGfail_3__PSfail__EEHeb. be cut off__GHan_issue_4__PSan issue__EFLev/15/2\');">Lev 15:2__AN__GGleper_5__PSleper__FFLev/13/44\');">Lev 13:44-46__NB2Ki/5/1\');">2Ki 5:1__EN';
stringArray[30] = 'So Joab and Abishai his brother __PNslew_Abner_1__SHslew Abner</a>, __PNbecause_2__SHbecause</a> he had slain their brother Asahel at Gibeon in the battle.__CPslew_Abner_1__PSslew Abner__FFPro/28/17\');">Pro 28:17__NBAct/28/4\');">Act 28:4__AN__GHbecause_2__PSbecause__EF2Sa/2/19\');">2Sa 2:19-23__EN';
stringArray[31] = '__PNAnd_David_1__SHAnd David</a> said to Joab, and to all the people that [were] with him, __PNRend_2__SHRend</a> your clothes, and gird you with sackcloth, and mourn before Abner. And king David [himself] followed the __PNbier_3__SHbier</a>.__CPAnd_David_1__PSAnd David__EEDavid, intending no doubt to punish Joab, and to lessen his authority with the people, commanded him to take upon him the office of chief mourner; but, as his revenge was gratified, his rival removed, and no heavier punishment inflicted, it is probable his hardened mind would feel but little objection to the ceremony.__GHRend_2__PSRend__EF2Sa/1/2\');">2Sa 1:2__NR2Sa/1/11\');">11__NBGen/37/29\');">Gen 37:29__NRGen/37/34\');">34__NBJos/7/6\');">Jos 7:6__NBJdg/11/35\');">Jdg 11:35__NB2Ki/19/1\');">2Ki 19:1__AN__GGbier_3__PSbier__EEHeb. bed. __NALuk/7/14\');">Luk 7:14__EN';
stringArray[32] = 'And they buried Abner in Hebron: and the king __PNlifted_1__SHlifted</a> up his voice, and wept at the grave of Abner; and all the people wept.__CPlifted_1__PSlifted__FF2Sa/1/12\');">2Sa 1:12__NB2Sa/18/33\');">2Sa 18:33__NB1Sa/30/4\');">1Sa 30:4__NBJob/31/28\');">Job 31:28__NBPro/24/17\');">Pro 24:17__NBLuk/19/41\');">Luk 19:41__NRLuk/19/42\');">42__EN';

stringArray[34] = 'Thy __PNhands_1__SHhands</a> [were] not bound, nor thy feet put into fetters: as a man falleth before __PNwicked_men_2__SHwicked men</a>, [so] fellest thou. And all the people __PNwept_3__SHwept</a> again over him.__CPhands_1__PShands__EEThe hand of malefactors were usually secured with cords, and their feet with fetters; a custom to which David affectingly alludes in his lamentation over the dust of Abner. Thy hands, O Abner, were not bound, as found to be a malefactor, nor thy feet put in fetters; thou was treated with honour by him whose business it was to judge thee, and thy attachment to the house of Saul was esteemed rather generous than culpable: as the best of men may fall, so thou fellest by the sword of treachery, not of justice. __NAJdg/16/21\');">Jdg 16:21__NBPsa/107/10\');">Psa 107:10__NRPsa/107/11\');">11__AN__GHwicked_men_2__PSwicked men__FEHeb. children of iniquity. __NAJob/24/14\');">Job 24:14__NBHsa/6/9\');">Hsa 6:9__AN__GGwept_3__PSwept__FF2Sa/1/12\');">2Sa 1:12__EN';
