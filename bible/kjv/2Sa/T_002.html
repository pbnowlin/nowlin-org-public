var stringArray = new Array();
stringArray[1] = 'And it came to pass after this, that David __PNenquired_1__SHenquired</a> of the LORD, saying, Shall I go up into any of the cities of Judah? And the LORD said unto him, Go up. And David said, Whither shall I go up? And he said, Unto __PNHebron_2__SHHebron</a>.__CPenquired_1__PSenquired__FF2Sa/5/19\');">2Sa 5:19__NR2Sa/5/23\');">23__NBNum/27/21\');">Num 27:21__NBJdg/1/1\');">Jdg 1:1__NB1Sa/23/2\');">1Sa 23:2__NR1Sa/23/4\');">4__NR1Sa/23/9\');">9-12__NB1Sa/30/7\');">1Sa 30:7__NR1Sa/30/8\');">8__NBPsa/25/4\');">Psa 25:4__NRPsa/25/5\');">5__NBPsa/27/4\');">Psa 27:4__NBPsa/143/8\');">Psa 143:8__NBPro/3/5\');">Pro 3:5__NRPro/3/6\');">6__NBEze/36/37\');">Eze 36:37__AN__GHHebron_2__PSHebron__EF2Sa/2/11\');">2Sa 2:11__NB2Sa/5/1\');">2Sa 5:1-3__NB2Sa/15/7\');">2Sa 15:7__NBGen/32/2\');">Gen 32:2__NBNum/13/22\');">Num 13:22__NBJos/14/14\');">Jos 14:14__NRJos/14/15\');">15__NB1Sa/30/31\');">1Sa 30:31__NB1Ki/2/11\');">1Ki 2:11__NB1Ch/29/7\');">1Ch 29:7__EN';
stringArray[2] = 'So David went up thither, and his two wives also, Ahinoam the Jezreelitess, and Abigail Nabal\'s wife the Carmelite.__CPRelated_Verses1_1__PSEntire Verse.__FF1Sa/25/42\');">1Sa 25:42__NR1Sa/25/43\');">43__NB1Sa/30/5\');">1Sa 30:5__NBLuk/22/28\');">Luk 22:28__NRLuk/22/29\');">29__EN';
stringArray[3] = 'And __PNhis_men_1__SHhis men</a> that [were] with him did David bring up, every man with his household: and they dwelt in __PNthe_cities_2__SHthe cities</a> of Hebron.__CPhis_men_1__PShis men__FF1Sa/22/2\');">1Sa 22:2__NB1Sa/27/2\');">1Sa 27:2__NR1Sa/27/3\');">3__NB1Sa/30/1\');">1Sa 30:1__NR1Sa/30/9\');">9__NR1Sa/30/10\');">10__NB1Ch/12/1\');">1Ch 12:1-7__AN__GHthe_cities_2__PSthe cities__EFJos/21/11\');">Jos 21:11__NRJos/21/12\');">12__EN';
stringArray[4] = 'And __PNthe_men_of_Judah_1__SHthe men of Judah</a> came, and there they __PNanointed_2__SHanointed</a> David king over the house of Judah. And they told David, saying, [That] __PNthe_men_of_Jabesh_gilead_3__SHthe men of Jabeshgilead</a> [were they] that buried Saul.__CPthe_men_of_Judah_1__PSthe men of Judah__FF2Sa/2/11\');">2Sa 2:11__NB2Sa/19/11\');">2Sa 19:11__NR2Sa/19/42\');">42__NBGen/49/8\');">Gen 49:8-10__AN__GHanointed_2__PSanointed__EF2Sa/2/7\');">2Sa 2:7__NB2Sa/5/3\');">2Sa 5:3__NR2Sa/5/5\');">5__NR2Sa/5/17\');">17__NB1Sa/16/13\');">1Sa 16:13__NB1Ch/11/3\');">1Ch 11:3__AN__GGthe_men_of_Jabesh_gilead_3__PSthe men of Jabesh-gilead__FF1Sa/31/11\');">1Sa 31:11-13__EN';
stringArray[5] = 'And __PNDavid_1__SHDavid</a> sent messengers unto the men of Jabeshgilead, and said unto them, __PNBlessed_2__SHBlessed</a> [be] ye of the LORD, that ye have shewed this kindness unto your lord, [even] unto Saul, and have buried him.__CPDavid_1__PSDavid__EEThis was a generous and noble act, highly indicative of the grandeur of David\'s mind. He respected Saul, though he had been greatly injured by him, as the anointed king of Israel, and once his legitimate sovereign; and he loved Jonathan as his most intimate friend.__GHBlessed_2__PSBlessed__EFRth/1/8\');">Rth 1:8__NBRth/2/20\');">Rth 2:20__NBRth/3/10\');">Rth 3:10__NB1Sa/23/21\');">1Sa 23:21__NB1Sa/24/19\');">1Sa 24:19__NB1Sa/25/32\');">1Sa 25:32__NR1Sa/25/33\');">33__NBPsa/115/15\');">Psa 115:15__EN';
stringArray[6] = 'And now __PNthe_LORD_1__SHthe LORD</a> shew kindness and truth unto you: and __PNI_also_2__SHI also</a> will requite you this kindness, because ye have done this thing.__CPthe_LORD_1__PSthe LORD__FF2Sa/15/20\');">2Sa 15:20__NBPsa/57/3\');">Psa 57:3__NBPro/14/22\');">Pro 14:22__NBMat/5/7\');">Mat 5:7__NB2Ti/1/16\');">2Ti 1:16-18__AN__GHI_also_2__PSI also__EF2Sa/9/3\');">2Sa 9:3__NR2Sa/9/7\');">7__NB2Sa/10/2\');">2Sa 10:2__NBMat/5/44\');">Mat 5:44__NBMat/10/16\');">Mat 10:16__NBPhm/1/18\');">Phm 1:18__NRPhm/1/19\');">19__EN';
stringArray[7] = 'Therefore now __PNlet_your_1__SHlet your</a> hands be strengthened, and be ye __PNvaliant_2__SHvaliant</a>: for your master Saul is dead, and also the house of Judah have anointed me king over them.__CPlet_your_1__PSlet your__FF2Sa/10/12\');">2Sa 10:12__NBGen/15/1\');">Gen 15:1__NB1Sa/4/9\');">1Sa 4:9__NB1Sa/31/7\');">1Sa 31:7__NR1Sa/31/12\');">12__NB1Cr/16/13\');">1Cr 16:13__NBEph/6/10\');">Eph 6:10__AN__GHvaliant_2__PSvaliant__FEHeb. the sons of valour.</TD></TR>';
stringArray[8] = 'But __PNAbner_1__SHAbner</a> the son of Ner, captain of __PNSaul_s_host_2__SHSaul\'s host</a>, took __PNIsh_bosheth_3__SHIshbosheth</a> the son of Saul, and brought him over to __PNMahanaim_4__SHMahanaim</a>;__CPAbner_1__PSAbner__FF1Sa/14/50\');">1Sa 14:50__NB1Sa/17/55\');">1Sa 17:55__NB1Sa/26/14\');">1Sa 26:14__AN__GHSaul_s_host_2__PSSaul\'s host__FEHeb. the host which was Saul\'s.__GGIsh_bosheth_3__PSIsh-bosheth__FF2Sa/3/7\');">2Sa 3:7__NR2Sa/3/8\');">8__NB2Sa/4/5\');">2Sa 4:5__NR2Sa/4/6\');">6__NB1Ch/8/33\');">1Ch 8:33__NB1Ch/9/39\');">1Ch 9:39__AN; Esh-baal.__GHMahanaim_4__PSMahanaim__EF2Sa/17/26\');">2Sa 17:26__NR2Sa/17/27\');">27__NBGen/32/2\');">Gen 32:2__EN';
stringArray[9] = 'And made him king over __PNGilead_1__SHGilead</a>, and over the __PNAshurites_2__SHAshurites</a>, and __PNover_Jezreel_3__SHover Jezreel</a>, and over Ephraim, and over Benjamin, and over all Israel.__CPGilead_1__PSGilead__FFNum/32/1\');">Num 32:1-42__NBJos/13/8\');">Jos 13:8-11__NBPsa/108/8\');">Psa 108:8__AN__GHAshurites_2__PSAshurites__FE"The LXX. read [ ] Thasiri; and the Vulgate Gessuri, ""Geshurites;"" but it is probable that for ashuri, ""Ashurites,"" we should read ashairi, ""Asherites,"" or those of the tribe of Asher. __NAGen/30/13\');">Gen 30:13__NBNum/1/40\');">Num 1:40__AN"__GGover_Jezreel_3__PSover Jezreel__FFJos/19/18\');">Jos 19:18__EN';
stringArray[10] = 'Ishbosheth Saul\'s son [was] forty years old when he began to reign over Israel, and reigned __PNtwo_years_1__SHtwo years</a>. But the house of Judah followed David.__CPtwo_years_1__PStwo years__EE"Houbigant proposes to read shesh shanah, ""six years"" instead of shetayim shanim, ""two years,"" of the text, which he contends is a solecism; for, in pure Hebrew, the words should be shetayim shanah; and this is the reading of twenty MSS.; but two is acknowledged by all the versions and MSS. yet collated."</TD></TR>';
stringArray[11] = 'And the __PNtime_1__SHtime</a> that David was king in Hebron over the house of Judah was seven years and six months.__CPtime_1__PStime__EEHeb. number of days. __NA2Sa/5/4\');">2Sa 5:4__NR2Sa/5/5\');">5__NB1Ki/2/11\');">1Ki 2:11__NB1Ch/3/4\');">1Ch 3:4__NB1Ch/29/27\');">1Ch 29:27__EN';
stringArray[12] = 'And Abner the son of Ner, and the servants of Ishbosheth the son of Saul, went out from __PNMahanaim_3__SHMahanaim</a> to __PNGibeon_4__SHGibeon</a>.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2951. B.C. 1053.__GHRelated_Verses2_2__PSEntire Verse.__FEAn. Ex. Is. 438.__GGMahanaim_3__PSMahanaim__FF2Sa/17/14\');">2Sa 17:14__NBGen/32/2\');">Gen 32:2__AN__GHGibeon_4__PSGibeon__EFJos/9/3\');">Jos 9:3__NBJos/10/2\');">Jos 10:2__NRJos/10/4\');">4__NRJos/10/12\');">12__NBJos/18/25\');">Jos 18:25__EN';
stringArray[13] = 'And __PNJoab_1__SHJoab</a> the son of Zeruiah, and the servants of David, went out, and met __PNtogether_2__SHtogether</a> by the __PNpool_3__SHpool</a> of Gibeon: and they sat down, the one on the one side of the pool, and the other on the other side of the pool.__CPJoab_1__PSJoab__FF2Sa/2/18\');">2Sa 2:18__NB2Sa/8/16\');">2Sa 8:16__NB2Sa/20/23\');">2Sa 20:23__NB1Ki/1/7\');">1Ki 1:7__NB1Ki/2/28\');">1Ki 2:28-35__NB1Ch/2/16\');">1Ch 2:16__AN__GHtogether_2__PStogether__FEHeb. them together__GGpool_3__PSpool__FFJer/41/12\');">Jer 41:12__EN';
stringArray[14] = 'And Abner said to Joab, Let the young men now arise, and __PNplay_before_1__SHplay before</a> us. And Joab said, Let them arise.__CPplay_before_1__PSplay before__FF2Sa/2/17\');">2Sa 2:17__NR2Sa/2/26\');">26__NR2Sa/2/27\');">27__NBPro/10/23\');">Pro 10:23__NBPro/17/14\');">Pro 17:14__NBPro/20/18\');">Pro 20:18__NBPro/25/8\');">Pro 25:8__NBPro/26/18\');">Pro 26:18__NRPro/26/19\');">19__EN';
stringArray[15] = 'Then there arose and went over by number twelve of Benjamin, which [pertained] to Ishbosheth the son of Saul, and twelve of the servants of David.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[16] = 'And they caught every one his fellow __PNby_the_head_1__SHby the head</a>, and [thrust] his sword in his fellow\'s side; so they fell down together: wherefore that place was called __PNHelkath_hazzurim_2__SHHelkathhazzurim</a>, which [is] in Gibeon.__CPby_the_head_1__PSby the head__EE"Probably by the beard or hair of the head. Plutarch, in his Apophthegms, informs us, that all things being ready for a battle, Alexander\'s captains asked him whether he had any thing else to command them. ""Nothing,"" said he, ""but that the Macedonians shave their beards."" Parmenio wondering what he meant, ""Dost thou not know,"" said he, ""that in fight, there is no better hold than the beard?"""__GHHelkath_hazzurim_2__PSHelkath-hazzurim__FEthat is, the field of strong men.</TD></TR>';
stringArray[17] = 'And there was a very sore battle that day; and __PNAbner_1__SHAbner</a> was beaten, and the men of Israel, before the servants of David.__CPAbner_1__PSAbner__FF2Sa/3/1\');">2Sa 3:1__EN';
stringArray[18] = 'And there were __PNthree_1__SHthree</a> sons of Zeruiah there, Joab, and Abishai, and Asahel: and Asahel __PNwas_as_light_2__SH[was as] light</a> of __PNfoot_3__SHfoot</a> as __PNa_wild_roe_4__SHa wild roe</a>.__CPthree_1__PSthree__FF1Ch/2/15\');">1Ch 2:15__NR1Ch/2/16\');">16__NB1Ch/11/26\');">1Ch 11:26__AN__GHwas_as_light_2__PSwas as light__EF2Sa/1/23\');">2Sa 1:23__NB1Ch/12/8\');">1Ch 12:8__NBPsa/147/10\');">Psa 147:10__NRPsa/147/11\');">11__NBEcc/9/11\');">Ecc 9:11__NBAmo/2/14\');">Amo 2:14__AN__GGfoot_3__PSfoot__EEHeb. his feet.__GHa_wild_roe_4__PSa wild roe__FEHeb. one of the roes that is in the field. __NAPsa/18/33\');">Psa 18:33__NBSgs/2/17\');">Sgs 2:17__NBSgs/8/14\');">Sgs 8:14__NBHab/3/19\');">Hab 3:19__AN; The word {tzevee,} rather denotes the gazelle or antelope. (See note on __NADeu/15/22\');">Deu 15:22__AN.)</TD></TR>';
stringArray[19] = 'And Asahel pursued after Abner; and in going he __PNturned_1__SHturned</a> not to the right hand nor to the left from __PNfollowing_Abner_2__SHfollowing Abner</a>.__CPturned_1__PSturned__FF2Sa/2/21\');">2Sa 2:21__NBJos/1/7\');">Jos 1:7__NBJos/23/6\');">Jos 23:6__NB2Ki/22/2\');">2Ki 22:2__NBPro/4/27\');">Pro 4:27__AN__GHfollowing_Abner_2__PSfollowing Abner__FEHeb. after Abner.</TD></TR>';
stringArray[20] = 'Then Abner looked behind him, and said, [Art] thou Asahel? And he answered, I [am].__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[21] = 'And Abner said to him, Turn thee aside to thy right hand or to thy left, and lay thee hold on one of the young men, __PNand_take_thee_1__SHand take thee</a> his __PNarmour_2__SHarmour</a>. But Asahel would not turn aside from following of him.__CPand_take_thee_1__PSand take thee__EEIt seems that Asahel wished to get the armour of Abner as a trophy.__GHarmour_2__PSarmour__FEor, spoil. __NAJdg/14/19\');">Jdg 14:19__EN';
stringArray[22] = 'And Abner said again to Asahel, Turn thee aside from following me: __PNwherefore_1__SHwherefore</a> should I smite thee to the ground? __PNhow_then_2__SHhow then</a> should I hold up my face to Joab thy brother?__CPwherefore_1__PSwherefore__FF2Ki/14/10\');">2Ki 14:10-12__NBPro/29/1\');">Pro 29:1__NBEcc/6/10\');">Ecc 6:10__AN__GHhow_then_2__PShow then__EF2Sa/3/27\');">2Sa 3:27__EN';
stringArray[23] = 'Howbeit he refused to turn aside: wherefore Abner with the hinder end of the spear smote him under __PNthe_fifth_rib_1__SHthe fifth [rib]</a>, that the spear came out behind him; and he fell down there, and died in the same place: and it came to pass, [that] as many as came to the place where Asahel fell down and died __PNstood_still_2__SHstood still</a>.__CPthe_fifth_rib_1__PSthe fifth rib__FF2Sa/3/27\');">2Sa 3:27__NB2Sa/4/6\');">2Sa 4:6__NB2Sa/5/6\');">2Sa 5:6__NB2Sa/20/10\');">2Sa 20:10__AN__GHstood_still_2__PSstood still__EF2Sa/20/12\');">2Sa 20:12__NR2Sa/20/13\');">13__EN';
stringArray[24] = 'Joab also and Abishai pursued after Abner: and the sun went down when they were come to the hill of Ammah, that [lieth] before Giah by the way of the wilderness of Gibeon.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[25] = 'And the children of Benjamin gathered themselves together after Abner, and became one troop, and stood on the top of an hill.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[26] = 'Then Abner called to Joab, and said, __PNShall_1__SHShall</a> the __PNsword_2__SHsword</a> devour for ever? knowest thou not that __PNit_will_be_3__SHit will be</a> bitterness in the latter end? __PNhow_long_4__SHhow long</a> shall it be then, ere thou bid the people return from following their brethren?__CPShall_1__PSShall__FF2Sa/2/14\');">2Sa 2:14__NBAct/7/26\');">Act 7:26__AN__GHsword_2__PSsword__EF2Sa/11/25\');">2Sa 11:25__NBIsa/1/20\');">Isa 1:20__NBJer/2/30\');">Jer 2:30__NBJer/12/12\');">Jer 12:12__NBJer/46/10\');">Jer 46:10__NRJer/46/14\');">14__NBHsa/11/6\');">Hsa 11:6__AN__GGit_will_be_3__PSit will be__FF2Sa/2/16\');">2Sa 2:16__NBPro/17/14\');">Pro 17:14__AN__GHhow_long_4__PShow long__EFJob/18/2\');">Job 18:2__NBJob/19/2\');">Job 19:2__NBPsa/4/2\');">Psa 4:2__NBJer/4/21\');">Jer 4:21__EN';
stringArray[27] = 'And Joab said, __PNAs_God_1__SH[As] God</a> liveth, __PNunless_2__SHunless</a> thou hadst spoken, surely then __PNin_the_morning_3__SHin the morning</a> the people had gone up every one from following his brother.__CPAs_God_1__PSAs God__EEThis was spoken in allusion to the proposal of Abner, (__NA2Sa/2/14\');">2Sa 2:14__AN,) which led to the slaughter of twelve young men of each party, and thus provoked the battle. It is probable, that Joab had orders simply to act on the defensive, and would not have attacked the Israelites that day unless compelled; therefore the blame lay upon Abner and Israel. __NA1Sa/25/26\');">1Sa 25:26__NBJob/27/2\');">Job 27:2__AN__GHunless_2__PSunless__EF2Sa/2/14\');">2Sa 2:14__NBPro/15/1\');">Pro 15:1__NBPro/17/14\');">Pro 17:14__NBPro/20/18\');">Pro 20:18__NBPro/25/8\');">Pro 25:8__NBIsa/47/7\');">Isa 47:7__NBLuk/14/31\');">Luk 14:31__NRLuk/14/32\');">32__AN__GGin_the_morning_3__PSin the morning__EEHeb. from the morning. gone up. or, gone away.</TD></TR>';
stringArray[28] = 'So Joab blew a trumpet, and all the people stood still, and pursued after Israel no more, neither fought they any more.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[29] = 'And Abner and his men walked all that night through the plain, and passed over Jordan, and went through all __PNBithron_1__SHBithron</a>, and they came to __PNMahanaim_2__SHMahanaim</a>.__CPBithron_1__PSBithron__EEBithron or Bether is probably the same as Betarus, which is placed in the Antonine Itinerary between Caesarea of Palestine and Diospolis or Lydda, 18 miles from the former, and 22 from the latter. The Jerusalem Itinerary mentions a place called Bethar, 16 miles from Caesarea, and 20 from Diospolis, which is probably the same. The Talmudists say that it was four miles distant from the sea. __NASgs/2/17\');">Sgs 2:17__AN; Bether.__GHMahanaim_2__PSMahanaim__EF2Sa/2/12\');">2Sa 2:12__EN';
stringArray[30] = 'And Joab returned from following Abner: and when he had gathered all the people together, there lacked of David\'s servants nineteen men and Asahel.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[31] = 'But the servants of David had smitten of Benjamin, and of Abner\'s men, [so that] __PNthree_hundred_1__SHthree hundred</a> and threescore men died.__CPthree_hundred_1__PSthree hundred__EEThe slain of Israel, though greatly exceeding those of Judah, were not great. This might be owing to the directions given by David, to be as lenient as possible; but the death of Asahel seems to have stopped the pursuers, and greatly favoured the escape of the vanquished. __NA2Sa/3/1\');">2Sa 3:1__NB1Ki/20/11\');">1Ki 20:11__EN';
stringArray[32] = 'And they took up Asahel, and __PNburied_1__SHburied</a> him in the sepulchre of his father, which [was in] Bethlehem. And Joab and his men __PNwent_2__SHwent</a> all night, and they came to Hebron at break of day.__CPburied_1__PSburied__FF1Sa/17/58\');">1Sa 17:58__NB1Ch/2/13\');">1Ch 2:13-16__NB2Ch/16/14\');">2Ch 16:14__NB2Ch/21/1\');">2Ch 21:1__AN__GHwent_2__PSwent__EF2Sa/5/1\');">2Sa 5:1__NBPro/22/29\');">Pro 22:29__EN';

</script>
