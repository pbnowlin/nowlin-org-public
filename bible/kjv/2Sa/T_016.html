stringArray[2] = 'And the king said unto Ziba, __PNWhat_meanest_1__SHWhat meanest</a> thou by these? And Ziba said, The asses [be] for the king\'s household to ride on; and the bread and summer fruit __PNfor_the_young_2__SHfor the young</a> men to eat; and the wine, __PNthat_such_3__SHthat such</a> as be faint in the wilderness may drink.__CPWhat_meanest_1__PSWhat meanest__EE"__NAGen/21/29\');">Gen 21:29__NBGen/33/8\');">Gen 33:8__NBEze/37/18\');">Eze 37:18__AN; The asses. This is the eastern mode of speaking when presenting any thing to a great man: ""This is for the slaves of the servants of your majesty;"" when at the same time the presents are intended for the sovereign himself, and it is so understood.; __NA2Sa/15/1\');">2Sa 15:1__NB2Sa/19/26\');">2Sa 19:26__NBJdg/5/10\');">Jdg 5:10__NBJdg/10/4\');">Jdg 10:4__AN"__GHfor_the_young_2__PSfor the young__EF1Sa/25/27\');">1Sa 25:27__AN__GGthat_such_3__PSthat such__FF2Sa/15/23\');">2Sa 15:23__NB2Sa/17/29\');">2Sa 17:29__NBJdg/8/4\');">Jdg 8:4__NRJdg/8/5\');">5__NB1Sa/14/28\');">1Sa 14:28__NBPro/31/6\');">Pro 31:6__NRPro/31/7\');">7__EN';

stringArray[8] = 'The LORD hath __PNreturned_1__SHreturned</a> upon thee all __PNthe_blood_2__SHthe blood</a> of the house of Saul, in whose stead __PNthou__etc__3__SHthou</a> hast reigned; and the LORD hath delivered the kingdom into the hand of Absalom thy son: and, behold, thou [art taken] in thy mischief, because thou [art] a bloody man.__CPreturned_1__PSreturned__FFJdg/9/24\');">Jdg 9:24__NRJdg/9/56\');">56__NRJdg/9/57\');">57__NB1Ki/2/32\');">1Ki 2:32__NR1Ki/2/33\');">33__NBAct/28/4\');">Act 28:4__NRAct/28/5\');">5__NBRev/16/6\');">Rev 16:6__AN__GHthe_blood_2__PSthe blood__EF2Sa/1/16\');">2Sa 1:16__NB2Sa/3/28\');">2Sa 3:28__NR2Sa/3/29\');">29__NB2Sa/4/8\');">2Sa 4:8-12__NBPsa/3/2\');">Psa 3:2__NBPsa/4/2\');">Psa 4:2__AN__GGthou__etc__3__PSthou, etc.__EEor, thee in thy evil.</TD></TR>';
stringArray[9] = 'Then said __PNAbishai_1__SHAbishai</a> the son of Zeruiah unto the king, Why should this __PNdead_dog_2__SHdead dog</a> __PNcurse_3__SHcurse</a> my lord the king? __PNlet_me_go_4__SHlet me go</a> over, I pray thee, and take off his head.__CPAbishai_1__PSAbishai__FF2Sa/3/30\');">2Sa 3:30__NB1Sa/26/6\');">1Sa 26:6-8__AN__GHdead_dog_2__PSdead dog__EF2Sa/3/8\');">2Sa 3:8__NB2Sa/9/8\');">2Sa 9:8__NB1Sa/24/14\');">1Sa 24:14__AN__GGcurse_3__PScurse__FFExd/22/28\');">Exd 22:28__NBAct/23/5\');">Act 23:5__NB1Pe/2/17\');">1Pe 2:17__AN__GHlet_me_go_4__PSlet me go__EF1Sa/26/6\');">1Sa 26:6-11__NBJob/31/30\');">Job 31:30__NRJob/31/31\');">31__NBJer/40/13\');">Jer 40:13-16__EN';
stringArray[10] = 'And the king said, __PNWhat_have_1__SHWhat have</a> I to do with you, ye sons of Zeruiah? __PNso_let_him_2__SHso let him</a> curse, because the LORD hath said unto him, Curse David. __PNWho_shall_3__SHWho shall</a> then say, Wherefore hast thou done so?__CPWhat_have_1__PSWhat have__FF2Sa/3/39\');">2Sa 3:39__NB2Sa/19/22\');">2Sa 19:22__NB1Ki/2/5\');">1Ki 2:5__NBMat/16/23\');">Mat 16:23__NBLuk/9/54\');">Luk 9:54-56__NB1Pe/2/23\');">1Pe 2:23__AN__GHso_let_him_2__PSso let him__EFGen/50/20\');">Gen 50:20__NB1Ki/22/21\');">1Ki 22:21-23__NB2Ki/18/25\');">2Ki 18:25__NBLam/3/38\');">Lam 3:38__NRLam/3/39\');">39__NBJhn/18/11\');">Jhn 18:11__AN__GGWho_shall_3__PSWho shall__FFJob/9/12\');">Job 9:12__NBEcc/8/4\');">Ecc 8:4__NBDan/4/35\');">Dan 4:35__NBRom/9/20\');">Rom 9:20__EN';
stringArray[11] = 'And David said to Abishai, and to all his servants, __PNBehold_1__SHBehold</a>, my son, which __PNcame_forth_2__SHcame forth</a> of my bowels, __PNseeketh_3__SHseeketh</a> my life: how much more now [may this] Benjamite [do it]? let him alone, and let him curse; for __PNthe_LORD_4__SHthe LORD</a> hath bidden him.__CPBehold_1__PSBehold__FF2Sa/12/11\');">2Sa 12:11__NR2Sa/12/12\');">12__AN__GHcame_forth_2__PScame forth__EF2Sa/7/2\');">2Sa 7:2__NBGen/15/4\');">Gen 15:4__AN__GGseeketh_3__PSseeketh__FF2Sa/17/1\');">2Sa 17:1-4__NB2Ki/19/37\');">2Ki 19:37__NB2Ch/32/21\');">2Ch 32:21__NBMat/10/21\');">Mat 10:21__AN__GHthe_LORD_4__PSthe LORD__EFIsa/10/5\');">Isa 10:5-7__NBEze/14/9\');">Eze 14:9__NBEze/20/25\');">Eze 20:25__EN';
stringArray[12] = 'It may be that __PNthe_LORD_1__SHthe LORD</a> will look on mine __PNaffliction_2__SHaffliction</a>, and that the LORD will __PNrequite_3__SHrequite</a> me good for his cursing this day.__CPthe_LORD_1__PSthe LORD__FFGen/29/32\');">Gen 29:32__NRGen/29/33\');">33__NBExd/2/24\');">Exd 2:24__NRExd/2/25\');">25__NBExd/3/7\');">Exd 3:7__NRExd/3/8\');">8__NB1Sa/1/11\');">1Sa 1:11__NBPsa/25/18\');">Psa 25:18__AN__GHaffliction_2__PSaffliction__FEor, tears. Heb. eye__GGrequite_3__PSrequite__FFDeu/23/5\');">Deu 23:5__NBIsa/27/7\');">Isa 27:7__NBMat/5/11\');">Mat 5:11__NRMat/5/12\');">12__NBRom/8/28\');">Rom 8:28__NB2Cr/4/17\');">2Cr 4:17__NB2Th/1/7\');">2Th 1:7__NBHbr/12/10\');">Hbr 12:10__NB1Pe/4/12\');">1Pe 4:12-19__EN';
stringArray[13] = 'And as David and his men went by the way, Shimei went along on the hill\'s side over against him, and __PNcursed_1__SHcursed</a> as he went, and threw stones at him, and __PNcast_dust_2__SHcast dust</a>.__CPcursed_1__PScursed__FF2Sa/16/5\');">2Sa 16:5__NR2Sa/16/6\');">6__AN__GHcast_dust_2__PScast dust__FE"Heb. dusted him with dust. __NAAct/23/23\');">Act 23:23__AN; It was an ancient custom, in those warm and arid countries, to lay the dust before a person of distinction, by sprinkling the ground with water. Dr. Pococke and the consul were treated with this respect when they entered Cairo. The same custom is alluded to in the well-known fable of Phædrus, in which a slave is represented going before Augustus and officiously laying the dust. To throw dust in the air while a person was passing was therefore an act of great disrespect; to do so before a sovereign prince, an indecent outrage. But it is probable that Shimei meant more than disrespect and outrage to this afflicted king. Sir John Chardin informs us, that in the East, in general, those who demand justice against a criminal throw dust upon him, signifying that he ought to be put in the grave: and hence the common imprecation among the Turks and Persians, ""Be covered with earth,"" or, ""Earth be upon thy head."""</TD></TR>';
