stringArray[1] = 'Now __PNJoab_3__SHJoab</a> the son of Zeruiah perceived that the king\'s heart [was] __PNtoward_Absalom_4__SHtoward Absalom</a>.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2977. B. C. 1027.__GHRelated_Verses2_2__PSEntire Verse.__FEAn. Ex. Is. 464.__GGJoab_3__PSJoab__FF2Sa/2/18\');">2Sa 2:18__NB1Ch/2/16\');">1Ch 2:16__AN__GHtoward_Absalom_4__PStoward Absalom__EF2Sa/13/39\');">2Sa 13:39__NB2Sa/18/33\');">2Sa 18:33__NB2Sa/19/2\');">2Sa 19:2__NR2Sa/19/4\');">4__NBPro/29/26\');">Pro 29:26__EN';
stringArray[2] = 'And Joab sent __PNto_Tekoah_1__SHto Tekoah</a>, and fetched thence a wise woman, and said unto her, I pray thee, feign thyself to be a mourner, and put on now mourning apparel, and anoint not thyself with oil, but be as a woman that had a long time mourned for the dead:__CPto_Tekoah_1__PSto Tekoah__EETekoah was a city of Judah, situated, according to Eusebius and Jerome, twelve miles south of Jerusalem. Josephus says it was not far from the castle of Herodium; and Jerome (Prologue to Amos) says it stood on a hill six miles south from Bethlehem. Dr. Poccocke places it at the same distance; and says there are still considerable ruins on the top of a hill, which is about half a mile long and a furlong broad. __NA2Ch/11/6\');">2Ch 11:6__NB2Ch/20/20\');">2Ch 20:20__NBNeh/3/5\');">Neh 3:5__NRNeh/3/27\');">27__NBJer/6/1\');">Jer 6:1__NBAmo/1/1\');">Amo 1:1__AN__GHTekoa_2__PSTekoa__FEmourning. __NA2Sa/11/26\');">2Sa 11:26__NBRth/3/3\');">Rth 3:3__NBPsa/104/15\');">Psa 104:15__NBEcc/9/8\');">Ecc 9:8__NBMat/6/17\');">Mat 6:17__EN';
stringArray[3] = 'And come to the king, and speak on this manner unto him. So Joab __PNput_the_words_1__SHput the words</a> in her mouth.__CPput_the_words_1__PSput the words__FF2Sa/14/19\');">2Sa 14:19__NBExd/4/15\');">Exd 4:15__NBNum/23/5\');">Num 23:5__NBDeu/18/18\');">Deu 18:18__NBIsa/51/16\');">Isa 51:16__NBIsa/59/21\');">Isa 59:21__NBJer/1/9\');">Jer 1:9__EN';
stringArray[4] = 'And when the woman of Tekoah spake to the king, she __PNfell_on_her_1__SHfell on her</a> face to the ground, and did obeisance, and said, __PNHelp_2__SHHelp</a>, O king.__CPfell_on_her_1__PSfell on her__FF2Sa/1/2\');">2Sa 1:2__NB1Sa/20/41\');">1Sa 20:41__NB1Sa/25/23\');">1Sa 25:23__AN__GHHelp_2__PSHelp__FEHeb. Save. __NA2Ki/6/26\');">2Ki 6:26-28__NBJob/29/12\');">Job 29:12-14__NBLuk/18/3\');">Luk 18:3-5__EN';
stringArray[5] = 'And the king said unto her, What aileth thee? And she answered, __PNI_am_indeed_1__SHI [am] indeed</a> a widow woman, and mine husband is dead.__CPI_am_indeed_1__PSI am indeed__EEIt is very possible that the principal incidents mentioned here were real; and that Joab found out a person whose circumstances bore a near resemblance to that which he wished to represent. She did not make the similitude too plain and visible, lest the king should see her intention before she had obtained a grant of pardon; and thus her circumstances, her mournful tale, her widow\'s dress, her aged person, (for Josephus says she was advanced in years,) and her impressive manner, all combined to make one united irresistible impression on the heart of the aged monarch. __NA2Sa/12/1\');">2Sa 12:1-3__NBJdg/9/8\');">Jdg 9:8-15__EN';
stringArray[6] = 'And thy handmaid had two sons, __PNand_they_two_1__SHand they two</a> strove together in the field, and [there was] __PNnone_to_part_2__SHnone to part</a> them, but the one smote the other, and slew him.__CPand_they_two_1__PSand they two__FFGen/4/8\');">Gen 4:8__NBExd/2/13\');">Exd 2:13__NBDeu/22/26\');">Deu 22:26__NRDeu/22/27\');">27__AN__GHnone_to_part_2__PSnone to part__FEHeb. no deliverer between.</TD></TR>';
stringArray[7] = 'And, behold, __PNthe_whole_1__SHthe whole</a> family is risen against thine handmaid, and they said, Deliver him that smote his brother, that we may kill him, for the life of his brother whom he slew; and we will destroy the heir also: and __PNso_they_2__SHso they</a> shall __PNquench_3__SHquench</a> my coal which is left, and shall not leave to my husband [neither] name nor remainder __PNupon_the_earth_4__SHupon the earth</a>.__CPthe_whole_1__PSthe whole__FFGen/4/14\');">Gen 4:14__NBNum/35/19\');">Num 35:19__NBDeu/19/12\');">Deu 19:12__AN__GHso_they_2__PSso they__EFGen/27/45\');">Gen 27:45__NBDeu/25/6\');">Deu 25:6__AN__GGquench_3__PSquench__FF2Sa/12/17\');">2Sa 12:17__AN__GHupon_the_earth_4__PSupon the earth__FEHeb. upon the face of the earth.</TD></TR>';
stringArray[8] = 'And the king said unto the woman, Go to thine house, and __PNI_will_give_1__SHI will give</a> charge concerning thee.__CPI_will_give_1__PSI will give__FF2Sa/12/5\');">2Sa 12:5__NR2Sa/12/6\');">6__NB2Sa/16/4\');">2Sa 16:4__NBJob/29/16\');">Job 29:16__NBPro/18/13\');">Pro 18:13__NBIsa/11/3\');">Isa 11:3__NRIsa/11/4\');">4__EN';

stringArray[10] = 'And the king said, Whosoever saith [ought] unto thee, bring him to me, and he shall not touch thee any more.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[11] = 'Then said she, I pray thee, __PNlet_the_king_1__SHlet the king</a> remember the LORD thy God, that __PNthou__etc__2__SHthou</a> wouldest not suffer __PNthe_revengers_3__SHthe revengers</a> of blood to destroy any more, lest they destroy my son. And he said, __PNAs_the_LORD_4__SH[As] the LORD</a> liveth, there shall __PNnot_one_hair_5__SHnot one hair</a> of thy son fall to the earth.__CPlet_the_king_1__PSlet the king__FFGen/14/22\');">Gen 14:22__NBGen/24/2\');">Gen 24:2__NRGen/24/3\');">3__NBGen/31/50\');">Gen 31:50__NB1Sa/20/42\');">1Sa 20:42__AN__GHthou__etc__2__PSthou, etc.__FEHeb. the revenger of blood do not multiply to destroy__GGthe_revengers_3__PSthe revengers__FFNum/35/19\');">Num 35:19__NRNum/35/27\');">27__NBDeu/19/4\');">Deu 19:4-10__NBJos/20/3\');">Jos 20:3-6__AN__GHAs_the_LORD_4__PSAs the LORD__EF1Sa/14/45\');">1Sa 14:45__NB1Sa/28/10\');">1Sa 28:10__NBJer/4/2\');">Jer 4:2__AN__GGnot_one_hair_5__PSnot one hair__FF1Ki/1/52\');">1Ki 1:52__NBMat/10/30\');">Mat 10:30__NBAct/27/34\');">Act 27:34__EN';
stringArray[12] = 'Then the woman said, __PNLet_thine_1__SHLet thine</a> handmaid, I pray thee, __PNspeak_one_word_2__SHspeak [one] word</a> unto my lord the king. And he said, __PNSay_on_3__SHSay on</a>.__CPLet_thine_1__PSLet thine__FF1Sa/25/24\');">1Sa 25:24__AN__GHspeak_one_word_2__PSspeak one word__EFGen/18/27\');">Gen 18:27__NRGen/18/32\');">32__NBGen/44/18\');">Gen 44:18__NBJer/12/1\');">Jer 12:1__AN__GGSay_on_3__PSSay on__FFAct/26/1\');">Act 26:1__EN';
stringArray[13] = 'And the woman said, __PNWherefore_1__SHWherefore</a> then hast thou thought such a thing against the __PNpeople_2__SHpeople</a> of God? for the king doth speak this thing as one which is faulty, __PNin_that_the_king_3__SHin that the king</a> doth not fetch home again his banished.__CPWherefore_1__PSWherefore__FF2Sa/12/7\');">2Sa 12:7__NB1Ki/20/40\');">1Ki 20:40-42__NBLuk/7/42\');">Luk 7:42-44__AN__GHpeople_2__PSpeople__EF2Sa/7/8\');">2Sa 7:8__NBJdg/20/2\');">Jdg 20:2__AN__GGin_that_the_king_3__PSin that the king__FF2Sa/13/37\');">2Sa 13:37__NR2Sa/13/38\');">38__EN';
stringArray[14] = 'For __PNwe_must_1__SHwe must</a> needs die, and [are] __PNas_water_2__SHas water</a> spilt on the ground, which cannot be gathered up again; __PNneither__etc__3__SHneither</a> doth __PNGod_4__SHGod</a> respect [any] person: yet doth __PNhe_devise_5__SHhe devise</a> means, that his banished be not expelled from him.__CPwe_must_1__PSwe must__FF2Sa/11/25\');">2Sa 11:25__NBJob/30/23\');">Job 30:23__NBJob/34/15\');">Job 34:15__NBPsa/90/3\');">Psa 90:3__NRPsa/90/10\');">10__NBEcc/3/19\');">Ecc 3:19__NREcc/3/20\');">20__NBEcc/9/5\');">Ecc 9:5__NBHbr/9/27\');">Hbr 9:27__AN__GHas_water_2__PSas water__EFJob/14/7\');">Job 14:7-12__NRJob/14/14\');">14__NBPsa/22/14\');">Psa 22:14__NBPsa/79/3\');">Psa 79:3__AN__GGneither__etc__3__PSneither, etc.__EEor, because God hath not taken away his life, he hath also devised means, etc.__GHGod_4__PSGod__EFDeu/10/17\');">Deu 10:17__NBJob/34/19\');">Job 34:19__NBMat/22/16\');">Mat 22:16__NBAct/10/34\');">Act 10:34__NBRom/2/11\');">Rom 2:11__NB1Pe/1/17\');">1Pe 1:17__AN__GGhe_devise_5__PShe devise__FFExd/21/13\');">Exd 21:13__NBLev/26/40\');">Lev 26:40__NBNum/35/15\');">Num 35:15__NRNum/35/25\');">25__NRNum/35/28\');">28__NBIsa/50/1\');">Isa 50:1__NRIsa/50/2\');">2__EN';
stringArray[15] = 'Now therefore that I am come to speak of this thing unto my lord the king, [it is] because the people have made me afraid: and thy handmaid said, I will now speak unto the king; it may be that the king will perform the request of his handmaid.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[16] = 'For the king will hear, to deliver his handmaid out of the hand of the man [that would] destroy me and my son together out of the inheritance of God.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[17] = 'Then thine handmaid said, The word of my lord the king shall now be __PNcomfortable_1__SHcomfortable</a>: for as an angel of God, so [is] my lord the king __PNto_discern_2__SHto discern</a> good and bad: therefore the LORD thy God will be with thee.__CPcomfortable_1__PScomfortable__EE"Heb. for rest. as an angel. This is very much like the hyperbolical language which is addressed by the Hindoos to an European when they desire to obtain something from him: ""Saheb,"" say they, ""can do every thing. No one can prevent the execution of Saheb\'s commands. Saheb is God."" Though the expression may be imputed to the hyperbolical genius of these countries, yet there was, perhaps, more of real persuasion than we are apt to suppose. Sir John Chardin states, that having found fault with the king of Persia\'s valuation of a rich trinket, the grand master told him that if a Persian had dared to have done such a thing, it would have been as much as his life was worth. ""Know,"" said he, ""that the kings of Persia have a general and full knowledge of matters, as sure as it is extensive; and that, equally in the greatest and smallest things, there is nothing more just and sure than what they pronounce."" __NA2Sa/14/20\');">2Sa 14:20__NB2Sa/19/27\');">2Sa 19:27__NB1Sa/29/9\');">1Sa 29:9__NBPro/27/21\');">Pro 27:21__NBPro/29/5\');">Pro 29:5__AN"__GHto_discern_2__PSto discern__FEHeb. to hear. __NA1Ki/3/9\');">1Ki 3:9__NR1Ki/3/28\');">28__NBJob/6/30\');">Job 6:30__NB1Cr/2/14\');">1Cr 2:14__NR1Cr/2/15\');">15__AN; *marg:; __NAHbr/5/14\');">Hbr 5:14__EN';
stringArray[18] = 'Then the king answered and said unto the woman, __PNHide_not_1__SHHide not</a> from me, I pray thee, the thing that I shall ask thee. And the woman said, Let my lord the king now speak.__CPHide_not_1__PSHide not__FF1Sa/3/17\');">1Sa 3:17__NR1Sa/3/18\');">18__NBJer/38/14\');">Jer 38:14__NRJer/38/25\');">25__EN';
stringArray[19] = 'And the king said, [Is not] the hand __PNof_Joab_1__SHof Joab</a> with thee in all this? And the woman answered and said, __PNAs_thy_soul_2__SH[As] thy soul</a> liveth, my lord the king, none can __PNturn_3__SHturn</a> to the right hand or to the left from ought that my lord the king hath spoken: for thy servant Joab, he bade me, and __PNhe_put_4__SHhe put</a> all these words in the mouth of thine handmaid:__CPof_Joab_1__PSof Joab__FF2Sa/3/27\');">2Sa 3:27__NR2Sa/3/29\');">29__NR2Sa/3/34\');">34__NB2Sa/11/14\');">2Sa 11:14__NR2Sa/11/15\');">15__NB1Ki/2/5\');">1Ki 2:5__NR1Ki/2/6\');">6__AN__GHAs_thy_soul_2__PSAs thy soul__EF2Sa/11/11\');">2Sa 11:11__NB1Sa/1/26\');">1Sa 1:26__NB1Sa/17/55\');">1Sa 17:55__NB1Sa/20/3\');">1Sa 20:3__NB1Sa/25/26\');">1Sa 25:26__NB2Ki/2/2\');">2Ki 2:2__AN__GGturn_3__PSturn__FFNum/20/17\');">Num 20:17__NBDeu/5/32\');">Deu 5:32__NBDeu/28/14\');">Deu 28:14__NBJos/1/7\');">Jos 1:7__NBPro/4/27\');">Pro 4:27__AN__GHhe_put_4__PShe put__EF2Sa/14/3\');">2Sa 14:3__NBExd/4/15\');">Exd 4:15__NBLuk/21/15\');">Luk 21:15__EN';
stringArray[20] = 'To __PNfetch_1__SHfetch</a> about this form of speech hath thy servant Joab done this thing: and my lord [is] wise, __PNaccording_2__SHaccording</a> to the wisdom of an angel of God, __PNto_know_3__SHto know</a> all [things] that [are] in the earth.__CPfetch_1__PSfetch__FF2Sa/5/23\');">2Sa 5:23__AN__GHaccording_2__PSaccording__EF2Sa/14/17\');">2Sa 14:17__NB2Sa/19/27\');">2Sa 19:27__NBJob/32/21\');">Job 32:21__NRJob/32/22\');">22__NBPro/26/28\');">Pro 26:28__NBPro/29/5\');">Pro 29:5__AN__GGto_know_3__PSto know__FFGen/3/5\');">Gen 3:5__NBJob/38/16\');">Job 38:16-41__NB1Cr/8/1\');">1Cr 8:1__NR1Cr/8/2\');">2__EN';
stringArray[21] = 'And the king said unto Joab, Behold now, __PNI_have_done_1__SHI have done</a> this thing: go therefore, bring the young man Absalom again.__CPI_have_done_1__PSI have done__FF2Sa/14/11\');">2Sa 14:11__NB1Sa/14/39\');">1Sa 14:39__NBMar/6/26\');">Mar 6:26__EN';
stringArray[22] = 'And Joab fell to the ground on his face, and bowed himself, and __PNthanked_1__SHthanked</a> the king: and Joab said, To day thy servant knoweth that __PNI_have_found_2__SHI have found</a> grace in thy sight, my lord, O king, in that the king hath fulfilled the request of __PNhis_3__SHhis</a> servant.__CPthanked_1__PSthanked__EEHeb. blessed. __NA2Sa/19/39\');">2Sa 19:39__NBNeh/11/2\');">Neh 11:2__NBJob/29/11\');">Job 29:11__NBJob/31/20\');">Job 31:20__NBPro/31/28\');">Pro 31:28__AN__GHI_have_found_2__PSI have found__EFGen/6/8\');">Gen 6:8__NBExd/33/16\');">Exd 33:16__NRExd/33/17\');">17__NBRth/2/2\');">Rth 2:2__NB1Sa/20/3\');">1Sa 20:3__AN__GGhis_3__PShis__EEor, thy.</TD></TR>';
stringArray[23] = 'So Joab arose and went to __PNGeshur_1__SHGeshur</a>, and brought Absalom to Jerusalem.__CPGeshur_1__PSGeshur__FF2Sa/3/3\');">2Sa 3:3__NB2Sa/13/37\');">2Sa 13:37__EN';
stringArray[24] = 'And the king said, Let him turn to his own house, and __PNlet_him_not_1__SHlet him not</a> see my face. So Absalom returned to his own house, and saw not the king\'s face.__CPlet_him_not_1__PSlet him not__FF2Sa/14/28\');">2Sa 14:28__NB2Sa/3/13\');">2Sa 3:13__NBGen/43/3\');">Gen 43:3__NBExd/10/28\');">Exd 10:28__NBRev/22/4\');">Rev 22:4__EN';
stringArray[25] = '__PNBut_in_all_Israel__etc__1__SHBut in all Israel</a> there was none to be so much praised as Absalom for his beauty: __PNfrom_the_sole_2__SHfrom the sole</a> of his foot even to the crown of his head there was no blemish in him.__CPBut_in_all_Israel__etc__1__PSBut in all Israel, etc.__EEHeb. And as Absalom there was not a beautiful man in all Israel to praise greatly. __NA1Sa/9/2\');">1Sa 9:2__NB1Sa/16/7\');">1Sa 16:7__NBPro/31/30\');">Pro 31:30__NBMat/23/27\');">Mat 23:27__AN__GHfrom_the_sole_2__PSfrom the sole__EFDeu/28/35\');">Deu 28:35__NBJob/2/7\');">Job 2:7__NBIsa/1/6\');">Isa 1:6__NBEph/5/27\');">Eph 5:27__EN';
stringArray[26] = 'And __PNwhen_he_polled_1__SHwhen he polled</a> his head, (for it was at every year\'s end that he polled [it]: because [the hair] was heavy on him, therefore he polled it:) he weighed the hair of his head at __PNtwo_hundred_shekels_2__SHtwo hundred shekels</a> after the king\'s weight.__CPwhen_he_polled_1__PSwhen he polled__FF2Sa/18/9\');">2Sa 18:9__NBIsa/3/24\');">Isa 3:24__NB1Cr/11/14\');">1Cr 11:14__AN__GHtwo_hundred_shekels_2__PStwo hundred shekels__FE"If the shekel be allowed to mean the common shekel, the amount will be utterly incredible; for Josephus says that ""two hundred shekels make five minæ: "" and the mina, he says, ""weighs two pounds and a half;"" which calculation makes Absalom\'s hair weigh twelve pounds and a half! But it is probable that the king\'s shekel was that which Epiphanius and Hesychius say was the fourth part of an ounce, half a stater, or two drachms: the whole amount, therefore, of the 200 shekels is about 50 ounces, which make 4 lb. 2 oz. troy weight, or 3 lb. 2 oz. avoirdupois. This need not be accounted incredible, especially as abundance of oil and ointment was used by the ancients in dressing their heads. Josephus informs us, that the Jews also put gold dust in their hair. __NAGen/23/16\');">Gen 23:16__NBLev/19/36\');">Lev 19:36__NBEze/45/9\');">Eze 45:9-14__AN"</TD></TR>';
stringArray[27] = 'And unto Absalom there were __PNborn_1__SHborn</a> three sons, and one daughter, whose name [was] __PNTamar_2__SHTamar</a>: she was a woman of a fair countenance.__CPborn_1__PSborn__FF2Sa/18/18\');">2Sa 18:18__NBJob/18/16\');">Job 18:16-19__NBIsa/14/22\');">Isa 14:22__NBJer/22/30\');">Jer 22:30__AN__GHTamar_2__PSTamar__EF2Sa/13/1\');">2Sa 13:1__EN';
stringArray[28] = 'So Absalom dwelt two full years in Jerusalem, __PNand_saw_not_3__SHand saw not</a> the king\'s face.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2977-2979. B.C. 1027-1025.__GHRelated_Verses2_2__PSEntire Verse.__FEAn. Ex. Is. 464-466.__GGand_saw_not_3__PSand saw not__FF2Sa/14/24\');">2Sa 14:24__EN';

stringArray[30] = 'Therefore he said unto his servants, See, Joab\'s field is __PNnear_mine_1__SHnear mine</a>, and he hath barley there; __PNgo_and_set_2__SHgo and set</a> it on fire. __PNAnd_Absalom_s_3__SHAnd Absalom\'s</a> servants set the field on fire.__CPnear_mine_1__PSnear mine__EEHeb. near my place__GHgo_and_set_2__PSgo and set__EF2Sa/13/28\');">2Sa 13:28__NR2Sa/13/29\');">29__NBJdg/15/4\');">Jdg 15:4__NRJdg/15/5\');">5__AN__GGAnd_Absalom_s_3__PSAnd Absalom\'s__FF1Ki/21/9\');">1Ki 21:9-14__NB2Ki/9/33\');">2Ki 9:33__NB2Ki/10/6\');">2Ki 10:6__NR2Ki/10/7\');">7__EN';
stringArray[31] = 'Then Joab arose, and came to Absalom unto [his] house, and said unto him, Wherefore have thy servants set my field on fire?__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[32] = 'And Absalom answered Joab, Behold, I sent unto thee, saying, Come hither, that I may send thee to the king, to say, Wherefore am I come from Geshur? [__PNit_had_been_1__SHit had been</a>] good for me [to have been] there still: now therefore let me see the king\'s face; and __PNif_there_2__SHif there</a> be [any] iniquity in me, let him kill me.__CPit_had_been_1__PSit had been__FFExd/14/12\');">Exd 14:12__NBExd/16/3\');">Exd 16:3__NBExd/17/3\');">Exd 17:3__AN__GHif_there_2__PSif there__EFGen/3/12\');">Gen 3:12__NB1Sa/15/13\');">1Sa 15:13__NBPsa/36/2\');">Psa 36:2__NBPro/28/13\');">Pro 28:13__NBJer/2/22\');">Jer 2:22__NRJer/2/23\');">23__NBJer/8/12\');">Jer 8:12__NBMat/25/44\');">Mat 25:44__NBRom/3/19\');">Rom 3:19__EN';
