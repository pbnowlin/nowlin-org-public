var stringArray = new Array();
stringArray[1] = 'And __PNthe_LORD_3__SHthe LORD</a> sent Nathan __PNunto_David_4__SHunto David</a>. And __PNhe_came_5__SHhe came</a> unto him, and said unto him, __PNThere_were_6__SHThere were</a> two men in one city; the one rich, and the other poor.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2970. B.C. 1034.__GHRelated_Verses2_2__PSEntire Verse.__FEAn. Ex. Is. 457.__GGthe_LORD_3__PSthe LORD__FF2Sa/7/1\');">2Sa 7:1-5__NB2Sa/24/11\');">2Sa 24:11-13__NB1Ki/13/1\');">1Ki 13:1__NB1Ki/18/1\');">1Ki 18:1__NB2Ki/1/3\');">2Ki 1:3__AN__GHunto_David_4__PSunto David__EF2Sa/11/10\');">2Sa 11:10-17__NR2Sa/11/25\');">25__NB2Sa/14/14\');">2Sa 14:14__NBIsa/57/17\');">Isa 57:17__NRIsa/57/18\');">18__AN__GGhe_came_5__PShe came__FFPsa/51/1\');">Psa 51:1__AN; *title__GHThere_were_6__PSThere were__FEThere is nothing in this parable which requires illustration. Its bent is evident; and it was wisely constructed, by not having too near a resemblance, to make David unwittingly pass sentence on himself. The parable was in David\'s hand what his own letter was in the hands of the brave Uriah. Nathan at length closed in with him in the application of it. In beginning with a parable he shewed his prudence, and great need there is of prudence in giving reproof; but now he speaks as an ambassador from God. He reminds David of the great things God had designed and done for him, and then charges him with a high contempt of the Divine authority, and threatens an entail of judgments upon his family for this sin. Those who despise the word and law of God, despise God himself, and will assuredly suffer for such contempt. __NA2Sa/14/5\');">2Sa 14:5-11__NBJdg/9/7\');">Jdg 9:7-15__NB1Ki/20/35\');">1Ki 20:35-41__NBIsa/5/1\');">Isa 5:1-7__NBMat/21/33\');">Mat 21:33-45__NBLuk/15/11\');">Luk 15:11-32__NBLuk/16/19\');">Luk 16:19-31__EN';

stringArray[11] = 'Thus saith the LORD, Behold, __PNI_will_raise_1__SHI will raise</a> up evil against thee out of thine own house, and __PNI_will_take_2__SHI will take</a> thy wives before thine eyes, and give [them] unto thy neighbour, and he shall lie with thy wives in the sight of this sun.__CPI_will_raise_1__PSI will raise__FF2Sa/13/1\');">2Sa 13:1-14__NR2Sa/13/28\');">28__NR2Sa/13/29\');">29__NB2Sa/15/6\');">2Sa 15:6__NR2Sa/15/10\');">10__AN__GHI_will_take_2__PSI will take__FEThat is, in the course of my providence I will permit this to be done. Such phrases in Scripture do not mean that God either does or can do evil himself; but only that he permits such evil to be done as he foresaw would be done, and which, had he pleased, he might have prevented. __NA2Sa/16/21\');">2Sa 16:21__NR2Sa/16/22\');">22__NBDeu/28/30\');">Deu 28:30__NBEze/14/9\');">Eze 14:9__NBEze/20/25\');">Eze 20:25__NREze/20/26\');">26__NBHsa/4/13\');">Hsa 4:13__NRHsa/4/14\');">14__EN';

stringArray[14] = 'Howbeit, because __PNby_this_deed_1__SHby this deed</a> thou hast given great occasion to the enemies of the LORD to blaspheme, __PNthe_child_2__SHthe child</a> also [that is] born unto thee shall surely die.__CPby_this_deed_1__PSby this deed__FFNeh/5/9\');">Neh 5:9__NBPsa/74/10\');">Psa 74:10__NBIsa/52/5\');">Isa 52:5__NBEze/36/20\');">Eze 36:20-23__NBMat/18/7\');">Mat 18:7__NBRom/2/24\');">Rom 2:24__AN__GHthe_child_2__PSthe child__EFPsa/89/31\');">Psa 89:31-33__NBPsa/94/12\');">Psa 94:12__NBPro/3/11\');">Pro 3:11__NRPro/3/12\');">12__NBAmo/3/2\');">Amo 3:2__NB1Cr/11/32\');">1Cr 11:32__NBHbr/12/6\');">Hbr 12:6__NBRev/3/19\');">Rev 3:19__EN';
stringArray[15] = 'And Nathan departed unto his house. And the LORD __PNstruck_the_child_1__SHstruck the child</a> that Uriah\'s wife bare unto David, and it was very sick.__CPstruck_the_child_1__PSstruck the child__FFDeu/32/39\');">Deu 32:39__NB1Sa/25/38\');">1Sa 25:38__NB1Sa/26/10\');">1Sa 26:10__NB2Ki/15/5\');">2Ki 15:5__NB2Ch/13/20\');">2Ch 13:20__NBPsa/104/29\');">Psa 104:29__NBAct/12/23\');">Act 12:23__EN';
stringArray[16] = 'David therefore __PNbesought_1__SHbesought</a> God for the child; and David __PNfasted_2__SHfasted</a>, and went in, and __PNlay_all_night_3__SHlay all night</a> upon the earth.__CPbesought_1__PSbesought__FF2Sa/12/22\');">2Sa 12:22__NBPsa/50/15\');">Psa 50:15__NBIsa/26/16\');">Isa 26:16__NBJoe/2/12\');">Joe 2:12-14__NBJon/3/9\');">Jon 3:9__AN__GHfasted_2__PSfasted__FEHeb. fasted a fast. __NAEst/4/16\');">Est 4:16__NBPsa/69/10\');">Psa 69:10__NBIsa/22/12\');">Isa 22:12__NBAct/9/9\');">Act 9:9__AN__GGlay_all_night_3__PSlay all night__FF2Sa/13/31\');">2Sa 13:31__NBJob/20/12\');">Job 20:12-14__EN';
stringArray[17] = 'And __PNthe_elders_1__SHthe elders</a> of his house arose, [and went] to him, to raise him up from the earth: but he would not, neither did he eat bread with them.__CPthe_elders_1__PSthe elders__FF2Sa/3/35\');">2Sa 3:35__NB1Sa/28/23\');">1Sa 28:23__EN';
stringArray[18] = 'And it came to pass on the __PNseventh_day_1__SHseventh day</a>, that the child died. And the servants of David feared to tell him that the child was dead: for they said, Behold, while the child was yet alive, we spake unto him, and he would not hearken unto our voice: how will he then vex himself, if we tell him that the child is dead?__CPseventh_day_1__PSseventh day__EEvex. Heb. do hurt to. __NA2Sa/12/18\');">2Sa 12:18__NBNum/20/15\');">Num 20:15__EN';
stringArray[19] = 'But when David saw that his servants whispered, David perceived that the child was dead: therefore David said unto his servants, Is the child dead? And they said, He is dead.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[20] = 'Then David __PNarose_1__SHarose</a> from the earth, and washed, and __PNanointed_2__SHanointed</a> [himself], and changed his apparel, and came into __PNthe_house_3__SHthe house</a> of the LORD, and worshipped: then he came to his own house; and when he required, they set bread before him, and he did eat.__CParose_1__PSarose__FFJob/1/20\');">Job 1:20__NBJob/2/10\');">Job 2:10__NBPsa/39/9\');">Psa 39:9__NBLam/3/39\');">Lam 3:39-41__AN__GHanointed_2__PSanointed__EFRth/3/3\');">Rth 3:3__NBEcc/9/8\');">Ecc 9:8__AN__GGthe_house_3__PSthe house__FF2Sa/6/17\');">2Sa 6:17__NB2Sa/7/18\');">2Sa 7:18__NBJob/1/20\');">Job 1:20__EN';
stringArray[21] = 'Then said his servants unto him, __PNWhat_thing_1__SHWhat thing</a> [is] this that thou hast done? thou didst fast and weep for the child, [while it was] alive; but when the child was dead, thou didst rise and eat bread.__CPWhat_thing_1__PSWhat thing__FF1Cr/2/15\');">1Cr 2:15__EN';

stringArray[23] = 'But now he is dead, wherefore should I fast? can I bring him back again? __PNI_shall_go_1__SHI shall go</a> to him, but __PNhe_shall_not_2__SHhe shall not</a> return to me.__CPI_shall_go_1__PSI shall go__FFGen/37/35\');">Gen 37:35__NBJob/30/23\');">Job 30:23__NBLuk/23/43\');">Luk 23:43__AN__GHhe_shall_not_2__PShe shall not__EFJob/7/8\');">Job 7:8-10__EN';
stringArray[24] = 'And David comforted Bathsheba his wife, and went in unto her, and lay with her: and __PNshe_bare_3__SHshe bare</a> a son, and he called his name Solomon: and the LORD loved him.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2971. B.C. 1033.__GHRelated_Verses2_2__PSEntire Verse.__FEAn. Ex. Is. 458.__GGshe_bare_3__PSshe bare__FF2Sa/7/12\');">2Sa 7:12__NB1Ch/3/5\');">1Ch 3:5__NB1Ch/22/9\');">1Ch 22:9__NR1Ch/22/10\');">10__NB1Ch/28/5\');">1Ch 28:5__NR1Ch/28/6\');">6__NB1Ch/29/1\');">1Ch 29:1__NBMat/1/6\');">Mat 1:6__EN';
stringArray[25] = 'And he sent by the hand of __PNNathan_1__SHNathan</a> the prophet; and he called his name __PNJedidiah_2__SHJedidiah</a>, because of the LORD.__CPNathan_1__PSNathan__FF2Sa/12/1\');">2Sa 12:1-14__NB2Sa/7/4\');">2Sa 7:4__NB1Ki/1/11\');">1Ki 1:11__NR1Ki/1/23\');">23__AN__GHJedidiah_2__PSJedidiah__FEthat is, Beloved of the LORD. __NANeh/13/26\');">Neh 13:26__NBMat/3/17\');">Mat 3:17__NBMat/17/5\');">Mat 17:5__EN';
stringArray[26] = 'And __PNJoab_1__SHJoab</a> fought against __PNRabbah_2__SHRabbah</a> of the children of Ammon, and took the royal city.__CPJoab_1__PSJoab__FF2Sa/11/25\');">2Sa 11:25__NB1Ch/20/1\');">1Ch 20:1__AN__GHRabbah_2__PSRabbah__FERabbah, or Rabbath-Ammon, also called Philadelphia, from Ptolemy Philadelphus, king of Egypt, was situated east of Jordan, and, according to Eusebius, ten miles east from Jazer. It is sometimes mentioned as belonging to Arabia, sometimes to Coelo-Syria; and was one of the cities of the Decapolis east of Jordan. Josephus extends the region of Perea as far as Philadelphia. It is now, says Burckhardt, called Amman, distant about 19 miles to the S. E. by E. of Szalt, and lies along the banks of a river called Moiet Amman, which has its source in a pond, at a few hundred paces from the south-western end of the town, and empties itself in the Zerka, or Jabbok, about four hours to the northward. This river runs in a valley bordered on both sides by barren hills of flint, which advance on the south side close to the edge of the stream. The edifices which still remain, though in a decaying state, from being built of a calcareous stone of moderate hardness, sufficiently attest the former greatness and splendour of this</TD></TR>';
stringArray[27] = 'And Joab sent messengers to David, and said, I have fought against __PNRabbah_1__SHRabbah</a>, and have taken __PNthe_city_of_waters_2__SHthe city of waters</a>.__CPRabbah_1__PSRabbah__FF2Sa/11/1\');">2Sa 11:1__NBDeu/3/11\');">Deu 3:11__NBEze/21/20\');">Eze 21:20__AN__GHthe_city_of_waters_2__PSthe city of waters__FEProbably that part of the city situated near the pond, from which the rest received their water.</TD></TR>';
stringArray[28] = 'Now therefore gather the rest of the people together, and encamp against the city, and take it: lest I take the city, and __PNit_be_called_after_my_name_1__SHit be called after my name</a>.__CPit_be_called_after_my_name_1__PSit be called after my name__EEHeb. my name be called upon it. __NAJhn/7/18\');">Jhn 7:18__EN';
stringArray[29] = 'And David gathered all the people together, and went to Rabbah, and fought against it, and took it.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[30] = 'And he __PNtook_1__SHtook</a> their king\'s crown from off his head, __PNthe_weight_2__SHthe weight</a> whereof [was] a talent of gold with the precious stones: and it was [set] on David\'s head. And he brought forth the spoil of the city __PNin_great_abundance_3__SHin great abundance</a>.__CPtook_1__PStook__FF1Ch/20/2\');">1Ch 20:2__AN__GHthe_weight_2__PSthe weight__FEIf this talent was only seven pounds, as Whiston says, David might have carried it on his head with little difficulty; but this weight, according to common computation, would amount to nearly 114 pounds! Some, therefore, think, that mishkelah should be taken for its value, not weight; which renders it perfectly plain, as the worth of the crown will be about 5,074£. 15s. 7d. sterling. The ancients mention several such large crowns, made more for sight than use. Athenæus describes a crown of gold that was 24 feet in circumference; and mentions others that were two, some four, and others five feet deep. Pliny takes notice of some that were no less than eight pounds weight. Besides the crown usually worn, it was customary for kings, in some nations, to have such large ones as described, either hung or supported over the throne, where they sat at their coronation or other solemn occasions.__GGin_great_abundance_3__PSin great abundance__EEHeb. very great.</TD></TR>';
stringArray[31] = 'And he brought forth the people that [were] therein, __PNand_put_them_1__SHand put [them]</a> under saws, and under harrows of iron, and under axes of iron, and made them pass through the brickkiln: and thus did he unto all the cities of the children of Ammon. So David and all the people returned unto Jerusalem.__CPand_put_them_1__PSand put them__EE"Rather, as the particle [b] frequently signifies, ""And he put them to saws, and to harrows, and to axes,"" etc., as we say, to put a person to the plough, to the anvil, to the last, etc. See __NA1Ch/20/3\');">1Ch 20:3__AN; also __NA2Sa/8/2\');">2Sa 8:2__NBPsa/21/8\');">Psa 21:8__NRPsa/21/9\');">9__NBAmo/1/3\');">Amo 1:3__AN"</TD></TR>';
