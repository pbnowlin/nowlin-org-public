stringArray[1] = 'Moreover Ahithophel said unto Absalom, Let me now choose out twelve thousand men, and __PNI_will_arise_1__SHI will arise</a> and pursue after David __PNthis_night_2__SHthis night</a>:__CPI_will_arise_1__PSI will arise__FFPro/1/16\');">Pro 1:16__NBPro/4/16\');">Pro 4:16__NBIsa/59/7\');">Isa 59:7__NRIsa/59/8\');">8__AN__GHthis_night_2__PSthis night__EFPsa/3/3\');">Psa 3:3-5__NBPsa/4/8\');">Psa 4:8__NBPsa/109/2\');">Psa 109:2-4__EN';

stringArray[4] = 'And __PNthe_saying_1__SHthe saying</a> __PNpleased_Absalom_well_2__SHpleased Absalom well</a>, and all the elders of Israel.__CPthe_saying_1__PSthe saying__FF1Sa/18/20\');">1Sa 18:20__NR1Sa/18/21\');">21__NB1Sa/23/21\');">1Sa 23:21__NBEst/5/14\');">Est 5:14__NBRom/1/32\');">Rom 1:32__AN__GHpleased_Absalom_well_2__PSpleased Absalom well__FEHeb. was right in the eyes of Absalom. __NA2Ch/30/4\');">2Ch 30:4__NBEst/1/21\');">Est 1:21__EN';
stringArray[5] = 'Then said Absalom, Call now __PNHushai_1__SHHushai</a> the Archite also, and let us hear likewise what __PNhe_saith_2__SHhe saith</a>.__CPHushai_1__PSHushai__FF2Sa/15/32\');">2Sa 15:32-37__NB2Sa/16/16\');">2Sa 16:16-19__AN__GHhe_saith_2__PShe saith__FEHeb. is in his mouth.</TD></TR>';
stringArray[6] = 'And when Hushai was come to Absalom, Absalom spake unto him, __PNsaying_1__SHsaying</a>, Ahithophel hath spoken after this manner: shall we do [after] his saying? if not; speak thou.__CPsaying_1__PSsaying__EEHeb. word.</TD></TR>';
stringArray[7] = 'And Hushai said unto Absalom, The counsel that Ahithophel hath __PNgiven_1__SHgiven</a> [is] __PNnot_good_2__SHnot good</a> at this time.__CPgiven_1__PSgiven__EEHeb. counselled__GHnot_good_2__PSnot good__EFPro/31/8\');">Pro 31:8__EN';

stringArray[9] = 'Behold, __PNhe_is_hid_1__SHhe is hid</a> now in __PNsome_2__SHsome</a> pit, or in some [other] place: and it will come to pass, when some of them be __PNoverthrown_3__SHoverthrown</a> at the first, that whosoever heareth it will say, There is a slaughter among the people that follow Absalom.__CPhe_is_hid_1__PShe is hid__FFJdg/20/33\');">Jdg 20:33__NB1Sa/22/1\');">1Sa 22:1__NB1Sa/24/3\');">1Sa 24:3__AN__GHsome_2__PSsome__EFJos/7/5\');">Jos 7:5__NBJos/8/6\');">Jos 8:6__NBJdg/20/32\');">Jdg 20:32__NB1Sa/14/14\');">1Sa 14:14__NR1Sa/14/15\');">15__AN__GGoverthrown_3__PSoverthrown__EEHeb. fallen.</TD></TR>';
stringArray[10] = 'And he also [that is] valiant, whose __PNheart_1__SHheart</a> [is] as the heart of a lion, shall __PNutterly_melt_2__SHutterly melt</a>: for all Israel knoweth that __PNthy_father_3__SHthy father</a> [is] a mighty man, __PNand_they_which_4__SHand [they] which</a> [be] with him [are] valiant men.__CPheart_1__PSheart__FF2Sa/1/23\');">2Sa 1:23__NB2Sa/23/20\');">2Sa 23:20__NBGen/49/9\');">Gen 49:9__NBNum/24/8\');">Num 24:8__NRNum/24/9\');">9__NBPro/28/1\');">Pro 28:1__AN__GHutterly_melt_2__PSutterly melt__EFExd/15/15\');">Exd 15:15__NBDeu/1/28\');">Deu 1:28__NBJos/2/9\');">Jos 2:9-11__NBIsa/13/7\');">Isa 13:7__NBIsa/19/1\');">Isa 19:1__AN__GGthy_father_3__PSthy father__FF1Sa/18/17\');">1Sa 18:17__NBHbr/11/34\');">Hbr 11:34__AN__GHand_they_which_4__PSand they which__EFSgs/3/7\');">Sgs 3:7__EN';
stringArray[11] = 'Therefore I counsel that __PNall_Israel_1__SHall Israel</a> be generally gathered unto thee, from Dan even to Beersheba, __PNas_the_sand_2__SHas the sand</a> that [is] by the sea for multitude; and that __PNthou_go_3__SHthou go</a> to battle __PNin_thine_4__SHin thine</a> own person.__CPall_Israel_1__PSall Israel__FF2Sa/24/2\');">2Sa 24:2__NBJdg/20/1\');">Jdg 20:1__AN__GHas_the_sand_2__PSas the sand__EFGen/13/16\');">Gen 13:16__NBGen/22/17\');">Gen 22:17__NBJos/11/4\');">Jos 11:4__NB1Ki/4/20\');">1Ki 4:20__NB1Ki/20/10\');">1Ki 20:10__AN__GGthou_go_3__PSthou go__EEHeb. they face, or presence, go, etc__GHin_thine_4__PSin thine__EF2Sa/12/28\');">2Sa 12:28__NBPsa/7/15\');">Psa 7:15__NRPsa/7/16\');">16__NBPsa/9/16\');">Psa 9:16__EN';
stringArray[12] = 'So shall we come upon him __PNin_some_place_1__SHin some place</a> where he shall be found, and __PNwe_will_light_2__SHwe will light</a> upon him as the dew falleth on the ground: and of him and of all the men that [are] with him there shall not be left so much as one.__CPin_some_place_1__PSin some place__FF1Sa/23/23\');">1Sa 23:23__AN__GHwe_will_light_2__PSwe will light__FEThis is a very beautiful and expressive figure. The dew in Palestine, and other warm climates, falls fast, sudden, and heavy; and it falls upon every spot of earth, so that not a blade of grass escapes it. It is therefore no inapt emblem of a numerous and active army; and it was, perhaps, for this reason that the Romans called their light armed forces rorarii. __NA1Ki/20/10\');">1Ki 20:10__NB2Ki/18/23\');">2Ki 18:23__NB2Ki/19/24\');">2Ki 19:24__NBIsa/10/13\');">Isa 10:13__NRIsa/10/14\');">14__NBOba/1/3\');">Oba 1:3__EN';
stringArray[13] = 'Moreover, if he be gotten into a city, then shall all Israel __PNbring_ropes_1__SHbring ropes</a> to that city, and we will draw it into the river, until there be not __PNone_small_2__SHone small</a> stone found there.__CPbring_ropes_1__PSbring ropes__EEIn the same manner the king of Maturan, in Java, proposed pulling down a tower which the Dutch had built, by making his people and elephants pull at a number of chains, and ropes of cocoa-nut bark, thrown around it.__GHone_small_2__PSone small__EFMat/24/2\');">Mat 24:2__EN';
stringArray[14] = 'And Absalom and all the men of Israel said, The counsel of Hushai the Archite [is] better than the counsel of Ahithophel. For __PNthe_LORD_1__SHthe LORD</a> had __PNappointed_2__SHappointed</a> __PNto_defeat_3__SHto defeat</a> the __PNgood_counsel_4__SHgood counsel</a> of Ahithophel, to the intent that the LORD might bring evil upon Absalom.__CPthe_LORD_1__PSthe LORD__FF2Sa/15/31\');">2Sa 15:31__NBGen/32/28\');">Gen 32:28__NBExd/9/16\');">Exd 9:16__NBDeu/2/30\');">Deu 2:30__NB2Ch/25/16\');">2Ch 25:16__NR2Ch/25/20\');">20__AN__GHappointed_2__PSappointed__FEHeb. commanded. __NAPsa/33/9\');">Psa 33:9__NRPsa/33/10\');">10__NBLam/3/37\');">Lam 3:37__NBAmo/9/3\');">Amo 9:3__AN__GGto_defeat_3__PSto defeat__FF2Sa/15/34\');">2Sa 15:34__NB2Sa/16/23\');">2Sa 16:23__NBJob/5/12\');">Job 5:12-14__NBPro/19/21\');">Pro 19:21__NBPro/21/30\');">Pro 21:30__NBIsa/8/10\');">Isa 8:10__NB1Cr/1/19\');">1Cr 1:19__NR1Cr/1/20\');">20__NB1Cr/3/19\');">1Cr 3:19__AN__GHgood_counsel_4__PSgood counsel__EFLuk/16/8\');">Luk 16:8__EN';
stringArray[15] = 'Then said Hushai unto __PNZadok_1__SHZadok</a> and to Abiathar the priests, Thus and thus did Ahithophel counsel Absalom and the elders of Israel; and thus and thus have I counselled.__CPZadok_1__PSZadok__FF2Sa/15/35\');">2Sa 15:35__EN';
stringArray[16] = 'Now therefore send quickly, and tell David, saying, __PNLodge_1__SHLodge</a> not this night in the plains of the wilderness, __PNbut_speedily_2__SHbut speedily</a> pass over; lest the king __PNbe_swallowed_3__SHbe swallowed</a> up, and all the people that [are] with him.__CPLodge_1__PSLodge__FF2Sa/15/28\');">2Sa 15:28__AN__GHbut_speedily_2__PSbut speedily__EF2Sa/17/21\');">2Sa 17:21__NR2Sa/17/22\');">22__NB2Sa/15/14\');">2Sa 15:14__NR2Sa/15/28\');">28__NB1Sa/20/38\');">1Sa 20:38__NBPsa/55/8\');">Psa 55:8__NBPro/6/4\');">Pro 6:4__NRPro/6/5\');">5__NBMat/24/16\');">Mat 24:16-18__AN__GGbe_swallowed_3__PSbe swallowed__FF2Sa/20/19\');">2Sa 20:19__NR2Sa/20/20\');">20__NBPsa/35/25\');">Psa 35:25__NBPsa/56/2\');">Psa 56:2__NBPsa/57/3\');">Psa 57:3__NB1Cr/15/54\');">1Cr 15:54__NB2Cr/5/4\');">2Cr 5:4__EN';
stringArray[17] = 'Now __PNJonathan_1__SHJonathan</a> and Ahimaaz __PNstayed_2__SHstayed</a> by __PNEn_rogel_3__SHEnrogel</a>; for they might not be seen to come into the city: and a wench went and told them; and they went and told king David.__CPJonathan_1__PSJonathan__FF2Sa/15/27\');">2Sa 15:27__NR2Sa/15/36\');">36__AN__GHstayed_2__PSstayed__EFJos/2/4\');">Jos 2:4-24__AN__GGEn_rogel_3__PSEn-rogel__FFJos/15/7\');">Jos 15:7__NBJos/18/16\');">Jos 18:16__NB1Ki/1/9\');">1Ki 1:9__EN';
stringArray[18] = 'Nevertheless a lad saw them, and told Absalom: but they went both of them away quickly, and came to a man\'s house in __PNBahurim_1__SHBahurim</a>, which had a well in his court; whither they went down.__CPBahurim_1__PSBahurim__FF2Sa/3/16\');">2Sa 3:16__NB2Sa/16/5\');">2Sa 16:5__NB2Sa/19/16\');">2Sa 19:16__EN';
stringArray[19] = 'And the woman took and __PNspread_a_covering_1__SHspread a covering</a> over the well\'s mouth, and spread ground corn thereon; and __PNthe_thing_2__SHthe thing</a> was not known.__CPspread_a_covering_1__PSspread a covering__FFJos/2/4\');">Jos 2:4-6__NRJos/2/5\');">5-24__AN__GHthe_thing_2__PSthe thing__EFExd/1/19\');">Exd 1:19__EN';
stringArray[20] = 'And when Absalom\'s servants came to the woman to the house, they said, Where [is] Ahimaaz and Jonathan? And the woman said unto them, __PNThey_be_gone_1__SHThey be gone</a> over the brook of water. And __PNwhen_they_had_sought_2__SHwhen they had sought</a> and could not find [them], they returned to Jerusalem.__CPThey_be_gone_1__PSThey be gone__FF2Sa/15/34\');">2Sa 15:34__NBExd/1/19\');">Exd 1:19__NBJos/2/4\');">Jos 2:4__NRJos/2/5\');">5__NB1Sa/19/14\');">1Sa 19:14-17__NB1Sa/21/2\');">1Sa 21:2__NB1Sa/27/11\');">1Sa 27:11__NR1Sa/27/12\');">12__AN__GHwhen_they_had_sought_2__PSwhen they had sought__EFJos/2/22\');">Jos 2:22__NRJos/2/23\');">23__EN';
stringArray[21] = 'And it came to pass, after they were departed, that they came up out of the well, and went and told king David, and said unto David, __PNArise_1__SHArise</a>, and pass quickly over the water: for __PNthus_hath_Ahithophel_2__SHthus hath Ahithophel</a> counselled against you.__CPArise_1__PSArise__FF2Sa/17/15\');">2Sa 17:15__NR2Sa/17/16\');">16__AN__GHthus_hath_Ahithophel_2__PSthus hath Ahithophel__EF2Sa/17/1\');">2Sa 17:1-3__EN';
stringArray[22] = 'Then David arose, and all the people that [were] with him, __PNand_they_passed_1__SHand they passed</a> over Jordan: by the morning light __PNthere_lacked_2__SHthere lacked</a> not one of them that was not gone over Jordan.__CPand_they_passed_1__PSand they passed__FF2Sa/17/24\');">2Sa 17:24__NBPro/27/12\');">Pro 27:12__NBMat/10/16\');">Mat 10:16__AN__GHthere_lacked_2__PSthere lacked__EFNum/31/49\');">Num 31:49__NBJhn/18/9\');">Jhn 18:9__EN';
stringArray[23] = 'And when Ahithophel __PNsaw_1__SHsaw</a> that his counsel was not __PNfollowed_2__SHfollowed</a>, he saddled [his] ass, and arose, and gat him home to his house, to __PNhis_city_3__SHhis city</a>, and __PNput_his_household_in_order_4__SHput his household in order</a>, __PNand_hanged_5__SHand hanged</a> himself, and died, and was buried in the sepulchre of his father.__CPsaw_1__PSsaw__FFPro/16/18\');">Pro 16:18__NBPro/19/3\');">Pro 19:3__AN__GHfollowed_2__PSfollowed__FEHeb. done__GGhis_city_3__PShis city__FF2Sa/15/12\');">2Sa 15:12__AN__GHput_his_household_in_order_4__PSput his household in order__FEHeb. gave charge concerning his house. __NA2Ki/20/1\');">2Ki 20:1__AN__GGand_hanged_5__PSand hanged__FF2Sa/15/31\');">2Sa 15:31__NB1Sa/31/4\');">1Sa 31:4__NR1Sa/31/5\');">5__NB1Ki/16/18\');">1Ki 16:18__NBJob/31/3\');">Job 31:3__NBPsa/5/10\');">Psa 5:10__NBPsa/55/23\');">Psa 55:23__NBMat/27/5\');">Mat 27:5__EN';

stringArray[25] = 'And Absalom made __PNAmasa_1__SHAmasa</a> captain of the host instead of Joab: which Amasa [was] a man\'s son, whose name [was] __PNIthra_2__SHIthra</a> an Israelite, that went in to __PNAbigail_3__SHAbigail</a> the daughter of __PNNahash_4__SHNahash</a>, sister to Zeruiah Joab\'s mother.__CPAmasa_1__PSAmasa__FF2Sa/19/13\');">2Sa 19:13__NB2Sa/20/4\');">2Sa 20:4__NR2Sa/20/9\');">9-12__AN__GHIthra_2__PSIthra__EF1Ch/2/16\');">1Ch 2:16__NR1Ch/2/17\');">17__AN; Jether the Ishmaelite__GGAbigail_3__PSAbigail__EEHeb. Abigal__GHNahash_4__PSNahash__FEor, Jesse. __NA1Ch/2/13\');">1Ch 2:13__NR1Ch/2/16\');">16__EN';

stringArray[27] = 'And it came to pass, when David was come to Mahanaim, that Shobi __PNthe_son_of_Nahash_1__SHthe son of Nahash</a> of Rabbah of the children of Ammon, and __PNMachir_2__SHMachir</a> the son of Ammiel of Lodebar, and __PNBarzillai_3__SHBarzillai</a> the Gileadite of Rogelim,__CPthe_son_of_Nahash_1__PSthe son of Nahash__FF2Sa/10/1\');">2Sa 10:1__NR2Sa/10/2\');">2__NB2Sa/12/29\');">2Sa 12:29__NR2Sa/12/30\');">30__NB1Sa/11/1\');">1Sa 11:1__AN__GHMachir_2__PSMachir__EF2Sa/9/4\');">2Sa 9:4__AN__GGBarzillai_3__PSBarzillai__FF2Sa/19/31\');">2Sa 19:31__NR2Sa/19/32\');">32__NB1Ki/2/7\');">1Ki 2:7__NBEzr/2/61\');">Ezr 2:61__EN';
stringArray[28] = 'Brought __PNbeds_1__SHbeds</a>, and __PNbasons_2__SHbasons</a>, and __PNearthen_vessels_3__SHearthen vessels</a>, and __PNwheat_4__SHwheat</a>, and barley, and flour, and parched [corn], and beans, and lentiles, and parched [pulse],__CPbeds_1__PSbeds__EEThese no doubt consisted of skins of beasts, mats, carpets, and such like. __NA2Sa/16/1\');">2Sa 16:1__NR2Sa/16/2\');">2__NB1Sa/25/18\');">1Sa 25:18__NBIsa/32/8\');">Isa 32:8__AN__GHbasons_2__PSbasons__FEor, cups. Sappoth, probably wooden bowls, such as the Arabs still eat out of, and knead their bread in.__GGearthen_vessels_3__PSearthen vessels__EE"Keley yotzair , literally, ""vessels of the potter."" So when Dr. Perry visited the temple of Luxor in Egypt, he says, ""We were entertained by the Caliph here with great civility and favour; he sent us, in return of our presents, several sheep, a good quantity of eggs, bardacks, "" etc. The bardacks, he informs us, were earthen vessels, used ""to cool and refresh their water in, by means of which it drinks very cool and pleasant in the hottest seasons of the year."" See Harmer, ch. vi. __NAOba/1/3\');">Oba 1:3__AN"__GHwheat_4__PSwheat__FE"Mr. Jones says, ""Travellers use zumeet, tumeet, and limereece. Zumeet is flour mixed with honey, butter, and spice; tumeet is flour done up with organ oil: and limereece is flour mixed with water, for drink. This quenches thirst much better than water alone, satisfies a hungry appetite; cools and refreshes tired and weary spirits,"" etc."</TD></TR>';
