Text[1] = 'And Dinah the daughter of Leah, which she bare unto Jacob, went out to see the daughters of the land.';
Text[2] = 'And when Shechem the son of Hamor the Hivite, prince of the country, saw her, he took her, and lay with her, and defiled her.';
Text[3] = 'And his soul clave unto Dinah the daughter of Jacob, and he loved the damsel, and spake kindly unto the damsel.';
Text[4] = 'And Shechem spake unto his father Hamor, saying, Get me this damsel to wife.';
Text[5] = 'And Jacob heard that he had defiled Dinah his daughter: now his sons were with his cattle in the field: and Jacob held his peace until they were come.';

Text[7] = 'And the sons of Jacob came out of the field when they heard [it]: and the men were grieved, and they were very wroth, because he had wrought folly in Israel in lying with Jacob\'s daughter; which thing ought not to be done.';

Text[9] = 'And make ye marriages with us, [and] give your daughters unto us, and take our daughters unto you.';
Text[10] = 'And ye shall dwell with us: and the land shall be before you; dwell and trade ye therein, and get you possessions therein.';
Text[11] = 'And Shechem said unto her father and unto her brethren, Let me find grace in your eyes, and what ye shall say unto me I will give.';
Text[12] = 'Ask me never so much dowry and gift, and I will give according as ye shall say unto me: but give me the damsel to wife.';
Text[13] = 'And the sons of Jacob answered Shechem and Hamor his father deceitfully, and said, because he had defiled Dinah their sister:';
Text[14] = 'And they said unto them, We cannot do this thing, to give our sister to one that is uncircumcised; for that [were] a reproach unto us:';

Text[16] = 'Then will we give our daughters unto you, and we will take your daughters to us, and we will dwell with you, and we will become one people.';
Text[17] = 'But if ye will not hearken unto us, to be circumcised; then will we take our daughter, and we will be gone.';
Text[18] = 'And their words pleased Hamor, and Shechem Hamor\'s son.';
Text[19] = 'And the young man deferred not to do the thing, because he had delight in Jacob\'s daughter: and he [was] more honourable than all the house of his father.';
Text[20] = 'And Hamor and Shechem his son came unto the gate of their city, and communed with the men of their city, saying,';
Text[21] = 'These men [are] peaceable with us; therefore let them dwell in the land, and trade therein; for the land, behold, [it is] large enough for them; let us take their daughters to us for wives, and let us give them our daughters.';
Text[22] = 'Only herein will the men consent unto us for to dwell with us, to be one people, if every male among us be circumcised, as they [are] circumcised.';
Text[23] = '[Shall] not their cattle and their substance and every beast of theirs [be] ours? only let us consent unto them, and they will dwell with us.';
Text[24] = 'And unto Hamor and unto Shechem his son hearkened all that went out of the gate of his city; and every male was circumcised, all that went out of the gate of his city.';
Text[25] = 'And it came to pass on the third day, when they were sore, that two of the sons of Jacob, Simeon and Levi, Dinah\'s brethren, took each man his sword, and came upon the city boldly, and slew all the males.';
Text[26] = 'And they slew Hamor and Shechem his son with the edge of the sword, and took Dinah out of Shechem\'s house, and went out.';
Text[27] = 'The sons of Jacob came upon the slain, and spoiled the city, because they had defiled their sister.';
Text[28] = 'They took their sheep, and their oxen, and their asses, and that which [was] in the city, and that which [was] in the field,';
Text[29] = 'And all their wealth, and all their little ones, and their wives took they captive, and spoiled even all that [was] in the house.';
