stringArray[15] = 'And Rebekah took __PNgoodly_raiment_1__SHgoodly raiment</a> of her eldest son Esau, which [were] with her in the house, and put them upon Jacob her younger son:__CPgoodly_raiment_1__PSgoodly raiment__EEHeb. desirable __NAGen/27/27\');">Gen 27:27__AN, The Septuagint translates it \'a goodly robe,\' which was a long garment that great men used to wear, (__NALuk/20/46\');">Luk 20:46__NBLuk/15/22\');">15:22__AN.) The priest afterwards in the law had \'holy garments\' to minister in, (__NAExd/28/2\');">Exd 28:2-4__AN.) Whether the first-born before the law had such to minister in is not certain: for, had they been common garments, why did not Esau himself or his wives keep them. But being, in likelihood, holy robes, received from their ancestors, the mother of the family kept them in sweet chests, from moths and the like; whereupon it is said, (__NAGen/27/27\');">Gen 27:27__AN,) \'Isaac smelled the smell of his garments.\'</TD></TR>';

stringArray[21] = 'And Isaac said unto Jacob, __PNCome_1__SHCome</a> near, I pray thee, that I __PNmay_feel_2__SHmay feel</a> thee, my son, whether thou [be] my very son Esau or not.__CPCome_1__PSCome__FFPsa/73/28\');">Psa 73:28__NBIsa/57/19\');">Isa 57:19__NBJam/4/8\');">Jam 4:8__AN__GHmay_feel_2__PSmay feel__EFGen/27/12\');">Gen 27:12__EN';
stringArray[22] = 'And Jacob went near unto Isaac his father; and he felt him, and said, __PNThe_voice_1__SHThe voice</a> [is] Jacob\'s voice, but the hands [are] the hands of Esau.__CPThe_voice_1__PSThe voice__EEHow wonderful, says Mr. Scott, is that difference which there is betwixt the faces and the voices of the several individuals of the human species! Scarcely any two of the innumerable millions are exactly alike in either, and yet the difference cannot be defined or described! The power, wisdom, and kindness of our Creator should be admired and adored in this remarkable circumstance; for they are very visible. This description of Jacob is not unaptly accommodated to the character of a hypocrite: his voice, his language, is that of a Christian; his hands, or conduct, that of an ungodly man: but the judgment will proceed from God, the Judge of all, at the last day, as in the present case, not by the voice, but by the hands.</TD></TR>';
