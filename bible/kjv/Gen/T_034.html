stringArray[12] = '__PNAsk_me_1__SHAsk me</a> never so much __PNdowry_2__SHdowry</a> and gift, and I will give according as ye shall say unto me: but give me the damsel to wife.__CPAsk_me_1__PSAsk me__EE"On the practice of purchasing wives, De La Roque says, ""Properly speaking, a young man who would marry must purchase his wife; and fathers among the Arabs are never so happy as when they have many daughters. They form part of the riches of the house. Accordingly, when a young man would treat with a person whose daughter he is inclined to marry, he says to him, \'Will you give me your daughter for fifty sheep, for six camels, or for a dozen cows?\' according to the rank of her family, and the circumstances of him who desires to marry her."""__GHdowry_2__PSdowry__EFGen/24/53\');">Gen 24:53__NBGen/29/18\');">Gen 29:18__NBGen/31/41\');">Gen 31:41__NBExd/22/16\');">Exd 22:16__NRExd/22/17\');">17__NBDeu/22/28\');">Deu 22:28__NRDeu/22/29\');">29__NB1Sa/18/25\');">1Sa 18:25-27__NB2Sa/3/14\');">2Sa 3:14__NBHsa/3/2\');">Hsa 3:2__NBMat/14/17\');">Mat 14:17__EN';

stringArray[24] = 'And unto Hamor and unto Shechem his son __PNhearkened_1__SHhearkened</a> all that __PNwent_out_2__SHwent out</a> of the gate of his city; and __PNevery_male_3__SHevery male</a> was circumcised, all that went out of the gate of his city.__CPhearkened_1__PShearkened__EE"In thus falling into this measure, the Shechemites must either have had great affection for their chief and his son, or have been under the influence of the most passive obedience. The petty princes of Asia have always been absolute and despotic; their subjects paying them the most prompt and blind obedience. The following instance will sufficiently illustrate and confirm this statement: Abu Thaher, chief of the Carmathians, about the year 930, with only 500 horse, went to lay siege to Bagdad: the khalif\'s general marched out to seize him; but before the attack, sent an officer to summon him to surrender. ""How many men has the khalif\'s general?"" said Abu Thaher; ""30,000,"" replied the officer. ""Among them all,"" says the Carmathian chief, ""has he got three like mine?"" Then ordering his followers to approach, he commanded one to stab himself, another to throw himself from a precipice, and a third to plunge into the Tigris: all three instantly obeyed, and perished! Then turning to the officer, he said, ""He who ha"__GHwent_out_2__PSwent out__EFGen/23/10\');">Gen 23:10__NRGen/23/18\');">18__AN__GGevery_male_3__PSevery male__FFGen/17/23\');">Gen 17:23__NBIsa/1/10\');">Isa 1:10-16__NBMat/7/6\');">Mat 7:6__NBRom/2/28\');">Rom 2:28__NRRom/2/29\');">29__NB1Cr/7/19\');">1Cr 7:19__EN';
