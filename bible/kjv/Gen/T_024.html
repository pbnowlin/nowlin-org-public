stringArray[21] = 'And the man __PNwondering_at_1__SHwondering at</a> her held his peace, __PNto_wit_2__SHto wit</a> whether __PNthe_LORD_3__SHthe LORD</a> had made his journey prosperous or not.__CPwondering_at_1__PSwondering at__FF2Sa/7/18\');">2Sa 7:18-20__NBPsa/34/1\');">Psa 34:1-6__NBPsa/107/1\');">Psa 107:1__NRPsa/107/8\');">8__NRPsa/107/15\');">15__NRPsa/107/43\');">43__NBPsa/116/1\');">Psa 116:1-7__NBLuk/2/19\');">Luk 2:19__NRLuk/2/51\');">51__AN__GHto_wit_2__PSto wit__FE"i.e., ""to know,"" or ""to learn."""__GGthe_LORD_3__PSthe LORD__FFGen/24/12\');">Gen 24:12__NRGen/24/56\');">56__EN';
stringArray[22] = 'And it came to pass, as the camels had done drinking, that the man __PNtook_1__SHtook</a> a golden __PNearring_2__SHearring</a> __PNof_half_3__SHof half</a> a shekel weight, and two __PNbracelets_4__SHbracelets</a> for her hands of ten [shekels] weight of gold;__CPtook_1__PStook__FFGen/24/30\');">Gen 24:30__NBExd/32/2\');">Exd 32:2__NRExd/32/3\');">3__NBEst/5/1\');">Est 5:1__NBJer/2/32\');">Jer 2:32__NB1Ti/2/9\');">1Ti 2:9__NR1Ti/2/10\');">10__NB1Pe/3/3\');">1Pe 3:3__NR1Pe/3/8\');">8__AN__GHearring_2__PSearring__FE"or, jewel for the forehead. __NAExd/32/2\');">Exd 32:2__NRExd/32/3\');">3__NBIsa/3/19\');">Isa 3:19-23__NBEze/16/11\');">Eze 16:11__NREze/16/12\');">12__AN; From the word being in the singular number, it is not likely to have been an ear-ring, or a ""jewel for the forehead,"" but ""a jewel for the nose, a nose-ring,"" which is in use throughout Arabia and Persia, particularly among young women. It is very properly translated [epirrinon] ""an ornament for the nose,"" by Symmachus; and Sir John Chardin informs us, that ""it is a custom in almost all the East, for the women to wear rings in their noses, in the left nostril, which is bored low down in the middle. These rings are of gold, and have commonly two pearls and one ruby between, placed in the ring. I never saw a girl or young woman in Arabia or in all Persia, who did not wear a ring after this manner in her nostril."""__GGof_half_3__PSof half__FFGen/23/15\');">Gen 23:15__NRGen/23/16\');">16__AN__GHbracelets_4__PSbracelets__FE"The word rendered ""bracelet,"" from a root which signifies ""to join or couple together,"" may imply whatever may clasp round the arms and legs; for rings and ornaments are worn round both by females in India and Persia. The small part of the leg, and the whole arm, from the shoulder to the wrist, are generally decorated in this way. As these were given to Rebekah for ""her hands,"" it sufficiently distinguishes them from similar ornaments for the ankles."</TD></TR>';
