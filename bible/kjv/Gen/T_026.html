stringArray[12] = 'Then Isaac __PNsowed_1__SHsowed</a> in that land, and __PNreceived_2__SHreceived</a> in the same year __PNan_hundredfold_3__SHan hundredfold</a>: and the LORD __PNblessed_4__SHblessed</a> him.__CPsowed_1__PSsowed__EE"The author of the ""History of the Piratical States of Barbary"" observes, (p. 44,) that the Moors of that country are divided into tribes like the Arabians, and like them dwell in tents, formed into itinerant villages; that ""these wanderers farm lands of the inhabitants of the towns, sow and cultivate them, paying their rent with the produce, such as fruits, corn, wax, etc. They are very skilful in choosing the most advantageous soils for every season, and very careful to avoid the Turkish troops, the violence of the one little suiting the simplicity of the other."" It is natural to suppose, that Isaac possessed the like sagacity, when he sowed in the land of Gerar, and received that year an hundred-fold."__GHreceived_2__PSreceived__FEHeb. found.__GGan_hundredfold_3__PSan hundredfold__FFPsa/67/6\');">Psa 67:6__NBPsa/72/16\');">Psa 72:16__NBEcc/11/6\');">Ecc 11:6__NBZec/8/12\');">Zec 8:12__NBMat/13/8\');">Mat 13:8__NRMat/13/23\');">23__NBMar/4/8\');">Mar 4:8__NB1Cr/3/6\');">1Cr 3:6__NB2Cr/9/10\');">2Cr 9:10__NR2Cr/9/11\');">11__NBGal/6/7\');">Gal 6:7__NRGal/6/8\');">8__AN__GHblessed_4__PSblessed__EFGen/26/3\');">Gen 26:3__NRGen/26/29\');">29__NBGen/24/1\');">Gen 24:1__NRGen/24/35\');">35__NBGen/30/30\');">Gen 30:30__NBJob/42/12\');">Job 42:12__EN';
stringArray[13] = '__PNAnd_the_man_waxed_great_1__SHAnd the man waxed great</a>, and __PNwent_forward_3__SHwent forward</a>, and grew until he became very great:__CPAnd_the_man_waxed_great_1__PSAnd the man waxed great__EE"Dr. Adam Clarke remarks, that there is a strange and observable occurrence of the same term in the original, which is literally, ""And the man was GREAT, and he went, going on, and was GREAT, until that he was exceeding GREAT."" How simple is this language, and yet how forcible!"__GHwaxed_great_2__PSwaxed great__EFGen/24/35\');">Gen 24:35__NBPsa/112/3\');">Psa 112:3__AN__GGwent_forward_3__PSwent forward__EEHeb. went going.</TD></TR>';
