stringArray[23] = 'And, behold, seven ears, __PNwithered_1__SHwithered</a>, __PNthin_2__SHthin</a>, [and] __PNblasted_3__SHblasted</a> with the east wind, sprung up after them:__CPwithered_1__PSwithered__EEor, small.__GHthin_2__PSthin__EFGen/41/6\');">Gen 41:6__NB2Ki/19/26\');">2Ki 19:26__NBPsa/129/6\');">Psa 129:6__NRPsa/129/7\');">7__NBHsa/8/7\');">Hsa 8:7__NBHsa/9/16\');">Hsa 9:16__NBHsa/13/15\');">Hsa 13:15__AN__GGblasted_3__PSblasted__EEAll the mischief done to corn or fruit by blasting, smutting, mildew, etc. are attributed to the east wind. (See Parallel Passages.) In Egypt it is peculiarly destructive, because it comes through the parched deserts of Arabia, often destroying vast numbers of people. The destructive nature of the Sam, Simoom, Smoom, or Samiel, is mentioned by almost all travellers. When this pestilential wind advances, its approach is indicated by a redness in the air. The principal stream of the blast always moves in a line of about 20 yards in breadth, and 12 feet above the surface of the earth; but its parching influence pervades all places to a considerable distance. The only means of preservation from its noxious influence is to lie flat, with the face upon the ground, till the blast be over. Camels and other animals instinctively perceive its approach, and bury their mouths and nostrils in the ground. It rarely last more than seven or eight minutes, but so poisonous are its effects, that it instantly suffocates those w</TD></TR>';

stringArray[30] = 'And there shall arise after them __PNseven_years_1__SHseven years</a> of famine; and all the plenty __PNshall_be_2__SHshall be</a> forgotten in the land of Egypt; and the famine shall __PNconsume_3__SHconsume</a> the land;__CPseven_years_1__PSseven years__FFGen/41/27\');">Gen 41:27__NRGen/41/54\');">54__NB2Sa/24/13\');">2Sa 24:13__NB1Ki/17/1\');">1Ki 17:1__NB2Ki/8/1\');">2Ki 8:1__NBLuk/4/25\');">Luk 4:25__NBJam/5/17\');">Jam 5:17__AN__GHshall_be_2__PSshall be__EFGen/41/21\');">Gen 41:21__NRGen/41/51\');">51__NBPro/31/7\');">Pro 31:7__NBIsa/65/16\');">Isa 65:16__AN__GGconsume_3__PSconsume__FFGen/47/13\');">Gen 47:13__NBPsa/105/16\');">Psa 105:16__EN';
stringArray[31] = 'And __PNthe_plenty_1__SHthe plenty</a> shall not be known in the land by reason of that famine following; for it [shall be] very __PNgrievous_2__SHgrievous</a>.__CPthe_plenty_1__PSthe plenty__EEIt is well known, that in Egypt there is scarcely any rain, the country depending for its fertility upon the overflowing of the Nile; and that the fertility is in proportion to the duration and quality of the overflow, in order to saturate the land and prepare for the seed. Pliny has given a scale, by which the plenty or dearth may ascertained; which may be considered as perfectly correct. The ordinary height of the inundations is 16 cubits. When the waters are lower than this standard, they do not overflow the whole ground; when above this standard they are too long in running off. In the first case, the ground is not saturated; by the second, the waters are detained so long on the ground that seed-time is lost. The province marks both. If it rise only 12 cubits, a famine is the consequence; at 13 hunger prevails; 14 produces general rejoicing; 15 perfect security; and 16 all the luxuries of life.__GHgrievous_2__PSgrievous__FEHeb. heavy. __NA1Sa/5/6\');">1Sa 5:6__NBIsa/24/20\');">Isa 24:20__EN';
