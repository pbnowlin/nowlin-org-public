stringArray[1] = 'Then Joseph __PNcould_not_1__SHcould not</a> refrain himself before all them that stood by him; and he cried, __PNCause_2__SHCause</a> every man to go out from me. And there stood no man with him, while Joseph made himself known unto his brethren.__CPcould_not_1__PScould not__FFGen/43/30\');">Gen 43:30__NRGen/43/31\');">31__NBIsa/42/14\');">Isa 42:14__NBJer/20/9\');">Jer 20:9__AN__GHCause_2__PSCause__EF2Sa/1/20\');">2Sa 1:20__NBMat/18/15\');">Mat 18:15__NBAct/10/41\');">Act 10:41__NB1Cr/13/5\');">1Cr 13:5__EN';
stringArray[2] = 'And he __PNwept_aloud_1__SHwept aloud</a>: and the Egyptians and the house of Pharaoh heard.__CPwept_aloud_1__PSwept aloud__EE"Heb. gave forth his voice in weeping. ""This,"" says Sir J. Chardin, ""is exactly the genius of the people of Asia; their sentiments of joy or grief are properly transports, and their transports are ungoverned, excessive, and truly outrageous. When anyone returns from a long journey or dies, his family burst into cries that may be heard twenty doors off; and this is renewed at different times, and continues many days, according to the vigour of the passion. Sometimes they cease all at once, and then begin as suddenly, with a greater shrillness and loudness than one could easily imagine."" __NANum/14/1\');">Num 14:1__NBRth/1/9\');">Rth 1:9__NB2Ki/20/3\');">2Ki 20:3__NBAct/20/37\');">Act 20:37__AN"</TD></TR>';

stringArray[16] = 'And the fame thereof was heard in Pharaoh\'s house, saying, Joseph\'s brethren are come: and __PNit_pleased_Pharaoh_well_1__SHit pleased Pharaoh well</a>, and his servants.__CPit_pleased_Pharaoh_well_1__PSit pleased Pharaoh well__EEHeb. was good in the eyes of Pharaoh. __NAGen/16/6\');">Gen 16:6__NBGen/20/15\');">Gen 20:15__NBGen/34/18\');">Gen 34:18__NBGen/41/33\');">Gen 41:33__NBDeu/1/33\');">Deu 1:33__NB2Sa/3/36\');">2Sa 3:36__NB2Ch/30/4\');">2Ch 30:4__NBEst/1/21\');">Est 1:21__NBEst/2/4\');">Est 2:4__NBEst/5/14\');">Est 5:14__NBAct/6/5\');">Act 6:5__EN';

stringArray[21] = 'And the children of Israel did so: and Joseph gave them __PNwagons_1__SHwagons</a>, according to the __PNcommandment_2__SHcommandment</a> of Pharaoh, and gave them provision for the way.__CPwagons_1__PSwagons__FFGen/45/19\');">Gen 45:19__NRGen/45/27\');">27__NBGen/46/5\');">Gen 46:5__NBNum/7/3\');">Num 7:3-9__NBEze/23/24\');">Eze 23:24__AN__GHcommandment_2__PScommandment__FEHeb. mouth. __NAGen/45/19\');">Gen 45:19__NBExd/17/1\');">Exd 17:1__NBNum/3/16\');">Num 3:16__NB2Ch/8/13\');">2Ch 8:13__NB2Ch/35/16\');">2Ch 35:16__NBEcc/8/2\');">Ecc 8:2__NBLam/1/18\');">Lam 1:18__EN';
stringArray[22] = '__PNTo_all_1__SHTo all</a> of them he gave __PNeach_2__SHeach</a> man changes of raiment; but __PNto_Benjamin_3__SHto Benjamin</a> he gave three hundred [pieces] of silver, and five changes of raiment.__CPTo_all_1__PSTo all__EE"It is a common custom with all the Asiatic sovereigns to give both garments and money to ambassadors and persons of distinction, whom they particularly wish to honour. De La Motraye says, ""that they then clothed them (the ambassadors) with caffetans (long vests of gold or silver brocade) with large silk flowers."""__GHeach_2__PSeach__EFJdg/14/12\');">Jdg 14:12__NRJdg/14/19\');">19__NB2Ki/5/5\');">2Ki 5:5__NR2Ki/5/22\');">22__NR2Ki/5/23\');">23__NBRev/6/11\');">Rev 6:11__AN__GGto_Benjamin_3__PSto Benjamin__FFGen/43/34\');">Gen 43:34__EN';
stringArray[23] = 'And to his father he sent after this [manner]; ten asses __PNladen_with_1__SHladen with</a> the __PNgood_things_2__SHgood things</a> of Egypt, and ten she asses laden with corn and bread and __PNmeat_3__SHmeat</a> for his father by the way.__CPladen_with_1__PSladen with__EEHeb. carrying. __NAGen/45/17\');">Gen 45:17__AN__GHgood_things_2__PSgood things__EFGen/24/10\');">Gen 24:10__NBGen/43/11\');">Gen 43:11__NBExd/16/3\');">Exd 16:3__AN__GGmeat_3__PSmeat__EEAs mazon is derived from zoon, to prepare, provide, Dr. A. Clarke thinks it may mean here prepared meat; some made-up dish, delicacies, confectionaries, etc. In Asiatic countries they have several curious methods of preserving flesh by potting, by which it may be kept, for any length of time, sweet and wholesome. Some delicacy, similar to the savoury meat which Isaac loved, may here be intended; sent to Jacob in consideration of his age, and to testify the respect of his son; for of other kinds of meat he could have no need, as he had large flocks and herds, and could kill a lamb, kid, etc. when he pleased.</TD></TR>';
