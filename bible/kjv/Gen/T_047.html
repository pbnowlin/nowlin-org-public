stringArray[1] = 'Then __PNJoseph_1__SHJoseph</a> came and told Pharaoh, and said, My father and my brethren, and their flocks, and their herds, and all that they have, are come out of the land of Canaan; and, behold, they [are] __PNin_the_land_2__SHin the land</a> of Goshen.__CPJoseph_1__PSJoseph__FFGen/45/16\');">Gen 45:16__NBGen/46/31\');">Gen 46:31__NBHbr/2/11\');">Hbr 2:11__AN__GHin_the_land_2__PSin the land__EFGen/45/10\');">Gen 45:10__NBGen/46/28\');">Gen 46:28__NRGen/46/34\');">34__NBExd/8/22\');">Exd 8:22__NBExd/9/26\');">Exd 9:26__EN';
stringArray[2] = 'And he took some of his brethren, [even] five men, and __PNpresented_1__SHpresented</a> them unto Pharaoh.__CPpresented_1__PSpresented__FFAct/7/13\');">Act 7:13__NB2Cr/4/14\');">2Cr 4:14__NBCol/1/28\');">Col 1:28__NBJud/1/24\');">Jud 1:24__EN';
stringArray[3] = 'And Pharaoh said unto his brethren, __PNWhat_is_1__SHWhat [is]</a> your occupation? And they said unto Pharaoh, Thy servants [are] __PNshepherds_2__SHshepherds</a>, both we, [and] also our fathers.__CPWhat_is_1__PSWhat is__FFGen/46/33\');">Gen 46:33__NRGen/46/34\');">34__NBAmo/7/14\');">Amo 7:14__NRAmo/7/15\');">15__NBJon/1/8\');">Jon 1:8__NB2Th/3/10\');">2Th 3:10__AN__GHshepherds_2__PSshepherds__EFGen/4/2\');">Gen 4:2__EN';
stringArray[4] = 'They said moreover unto Pharaoh, __PNFor_to_1__SHFor to</a> sojourn in the land are we come; for thy servants have no pasture for their flocks; __PNfor_the_famine_2__SHfor the famine</a> [is] sore in the land of Canaan: now therefore, we pray thee, __PNlet_thy_3__SHlet thy</a> servants dwell in the land of Goshen.__CPFor_to_1__PSFor to__FFGen/12/10\');">Gen 12:10__NBGen/15/13\');">Gen 15:13__NBDeu/26/5\');">Deu 26:5__NBPsa/105/23\');">Psa 105:23__NBIsa/52/4\');">Isa 52:4__NBAct/7/6\');">Act 7:6__AN__GHfor_the_famine_2__PSfor the famine__EFGen/43/1\');">Gen 43:1__NBAct/7/11\');">Act 7:11__AN__GGlet_thy_3__PSlet thy__FFGen/46/34\');">Gen 46:34__EN';
stringArray[5] = 'And Pharaoh spake unto Joseph, saying, Thy father and thy brethren are come unto thee:__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';

stringArray[7] = 'And Joseph brought in Jacob his father, and set him before Pharaoh: __PNand_Jacob_1__SHand Jacob</a> blessed Pharaoh.__CPand_Jacob_1__PSand Jacob__FFGen/47/10\');">Gen 47:10__NBGen/35/27\');">Gen 35:27__NBExd/12/32\');">Exd 12:32__NBNum/6/23\');">Num 6:23__NRNum/6/24\');">24__NBJos/14/13\');">Jos 14:13__NB1Sa/2/20\');">1Sa 2:20__NB2Sa/8/10\');">2Sa 8:10__NB2Sa/19/39\');">2Sa 19:39__NB1Ki/1/47\');">1Ki 1:47__NB2Ki/4/29\');">2Ki 4:29__NBMat/26/26\');">Mat 26:26__NBLuk/22/19\');">Luk 22:19__NB1Pe/2/17\');">1Pe 2:17__EN';
stringArray[8] = 'And Pharaoh said unto Jacob, __PNHow_old_art_thou_1__SHHow old [art] thou</a>?__CPHow_old_art_thou_1__PSHow old art thou__EEHeb. How many are the days of the years of thy life? __NAGen/47/9\');">Gen 47:9__AN.</TD></TR>';
stringArray[9] = 'And Jacob said unto Pharaoh, __PNThe_days_1__SHThe days</a> of the years of my pilgrimage [are] __PNan_hundred_2__SHan hundred</a> and thirty years: few and evil have the days of the years of my life been, and __PNhave_not_3__SHhave not</a> attained unto the days of the years of the life of my fathers in the days of their pilgrimage.__CPThe_days_1__PSThe days__FF1Ch/29/15\');">1Ch 29:15__NBPsa/39/12\');">Psa 39:12__NBPsa/119/19\');">Psa 119:19__NRPsa/119/54\');">54__NB2Cr/5/6\');">2Cr 5:6__NBHbr/11/9\');">Hbr 11:9-16__NBHbr/13/14\');">Hbr 13:14__NB1Pe/2/11\');">1Pe 2:11__AN__GHan_hundred_2__PSan hundred__EFJob/14/1\');">Job 14:1__NBPsa/39/5\');">Psa 39:5__NBPsa/89/47\');">Psa 89:47__NRPsa/89/48\');">48__NBPsa/90/3\');">Psa 90:3-12__NBJam/4/14\');">Jam 4:14__AN__GGhave_not_3__PShave not__FFGen/47/28\');">Gen 47:28__NBGen/5/27\');">Gen 5:27__NBGen/11/11\');">Gen 11:11__NRGen/11/24\');">24__NRGen/11/25\');">25__NBGen/25/7\');">Gen 25:7__NRGen/25/8\');">8__NBGen/35/28\');">Gen 35:28__NBGen/50/26\');">Gen 50:26__NBExd/6/4\');">Exd 6:4__NBExd/7/7\');">Exd 7:7__NBDeu/34/7\');">Deu 34:7__NBJos/24/29\');">Jos 24:29__NB2Sa/19/32\');">2Sa 19:32-35__NBJob/8/8\');">Job 8:8__NRJob/8/9\');">9__NBJob/42/16\');">Job 42:16__NRJob/42/17\');">17__EN';
stringArray[10] = 'And Jacob blessed Pharaoh, and went out from before Pharaoh.__CPRelated_Verses1_1__PSEntire Verse.__FFGen/47/7\');">Gen 47:7__NBGen/14/19\');">Gen 14:19__NBNum/6/23\');">Num 6:23-27__NBDeu/33/1\');">Deu 33:1__NBRth/2/4\');">Rth 2:4__NB2Sa/8/10\');">2Sa 8:10__NB2Sa/19/39\');">2Sa 19:39__NBPsa/119/46\');">Psa 119:46__NBPsa/129/8\');">Psa 129:8__NBHbr/7/7\');">Hbr 7:7__EN';
stringArray[11] = 'And Joseph placed his father and his brethren, and gave them a possession in the land of Egypt, in the best of the land, in the land of __PNRameses_1__SHRameses</a>, as Pharaoh had commanded.__CPRameses_1__PSRameses__FFGen/47/6\');">Gen 47:6__NBExd/1/11\');">Exd 1:11__NBExd/12/37\');">Exd 12:37__NBJhn/10/10\');">Jhn 10:10__NRJhn/10/28\');">28__NBJhn/14/2\');">Jhn 14:2__NRJhn/14/23\');">23__NBJhn/17/2\');">Jhn 17:2__NRJhn/17/24\');">24__EN';
stringArray[12] = 'And Joseph __PNnourished_1__SHnourished</a> __PNhis_father_2__SHhis father</a>, and his brethren, and all his father\'s household, with bread, __PNaccording_to_their_families_3__SHaccording to [their] families</a>.__CPnourished_1__PSnourished__FFRth/4/15\');">Rth 4:15__AN__GHhis_father_2__PShis father__EFExd/20/12\');">Exd 20:12__NBMat/15/4\');">Mat 15:4-6__NBMar/7/10\');">Mar 7:10-13__NB1Ti/4/8\');">1Ti 4:8__NB1Ti/5/4\');">1Ti 5:4__NR1Ti/5/8\');">8__AN__GGaccording_to_their_families_3__PSaccording to their families__EEor, as a little child is nourished. Heb. according to the little ones. __NAGen/47/1\');">Gen 47:1__NRGen/47/21\');">21__NRGen/47/24\');">24__NB1Th/2/7\');">1Th 2:7__EN';
stringArray[13] = 'And [there was] no bread in all the land; for the famine [was] very sore, __PNso_that_2__SHso that</a> the land of Egypt and [all] the land of Canaan __PNfainted_3__SHfainted</a> by reason of the famine.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2300. B.C. 1704.__GHso_that_2__PSso that__EFGen/41/30\');">Gen 41:30__NRGen/41/31\');">31__NB1Ki/18/5\');">1Ki 18:5__NBJer/14/1\');">Jer 14:1-6__NBLam/2/19\');">Lam 2:19__NRLam/2/20\');">20__NBLam/4/9\');">Lam 4:9__NBAct/7/11\');">Act 7:11__AN__GGfainted_3__PSfainted__FFJer/9/12\');">Jer 9:12__NBJoe/1/10\');">Joe 1:10-12__EN';
stringArray[14] = 'And Joseph gathered up all __PNthe_money_1__SHthe money</a> that was found in the land of Egypt, and in the land of Canaan, for the corn which they bought: and __PNJoseph_brought_2__SHJoseph brought</a> the money into Pharaoh\'s house.__CPthe_money_1__PSthe money__FFGen/41/56\');">Gen 41:56__AN__GHJoseph_brought_2__PSJoseph brought__EFLuk/16/1\');">Luk 16:1__NRLuk/16/2\');">2__NRLuk/16/10\');">10-12__NB1Cr/4/2\');">1Cr 4:2__NB1Pe/4/10\');">1Pe 4:10__EN';
stringArray[15] = 'And when money failed in the land of Egypt, and in the land of Canaan, all the Egyptians came unto Joseph, and said, __PNGive_us_bread_2__SHGive us bread</a>: for why should we die in thy presence? for the money faileth.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2301. B.C. 1703.__GHGive_us_bread_2__PSGive us bread__EFGen/47/18\');">Gen 47:18__NRGen/47/19\');">19__NRGen/47/24\');">24__NBJdg/8/5\');">Jdg 8:5__NRJdg/8/8\');">8__NB1Sa/21/3\');">1Sa 21:3__NB1Sa/25/8\');">1Sa 25:8__NBPsa/37/3\');">Psa 37:3__NBIsa/33/16\');">Isa 33:16__NBMat/6/11\');">Mat 6:11__EN';
stringArray[16] = 'And Joseph said, __PNGive_your_cattle_1__SHGive your cattle</a>; and I will give you for your cattle, if money fail.__CPGive_your_cattle_1__PSGive your cattle__EEThis was the wisest measure that could be adopted, both for the preservation of the people and the cattle. As the people had not grain for their own sustenance, consequently they could have none for their cattle: hence they were in the most imminent danger of starving; and the people also were in equal danger; as they must have divided a portion of that bought for themselves with the cattle, which, for the sake of tillage, etc., they wished of course to preserve till the seven years\' famine should end. __NADan/6/5\');">Dan 6:5-7__NBPro/12/17\');">Pro 12:17__NB1Cr/10/32\');">1Cr 10:32__NBPhl/4/8\');">Phl 4:8__NBCol/4/5\');">Col 4:5__EN';
stringArray[17] = 'And they brought their cattle unto Joseph: and Joseph gave them bread [in exchange] __PNfor_horses_1__SHfor horses</a>, and for the flocks, and for the cattle of the herds, and for the asses: and he __PNfed_them_2__SHfed them</a> with bread for all their cattle for that year.__CPfor_horses_1__PSfor horses__FFExd/9/3\');">Exd 9:3__NB1Ki/10/28\');">1Ki 10:28__NBJob/2/4\');">Job 2:4__NBIsa/31/1\');">Isa 31:1__NBMat/6/24\');">Mat 6:24__AN__GHfed_them_2__PSfed them__FEHeb. led them.</TD></TR>';
stringArray[18] = 'When that year was ended, they came unto him the second year, and said unto him, We will not hide [it] from my lord, how that our money is spent; my lord also hath our herds of cattle; there is not ought left in the sight of my lord, but our bodies, and our lands:__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2302. B.C. 1702__GHRelated_Verses2_2__PSEntire Verse.__EF2Ki/6/26\');">2Ki 6:26__NBJer/38/9\');">Jer 38:9__EN';
stringArray[19] = 'Wherefore shall we die before thine eyes, both we and our land? __PNbuy_us_1__SHbuy us</a> and our land for bread, and we and our land will be servants unto Pharaoh: __PNand_give_2__SHand give</a> [us] seed, that we may live, and not die, that the land be not desolate.__CPbuy_us_1__PSbuy us__FFNeh/5/2\');">Neh 5:2__NRNeh/5/3\');">3__NBJob/2/4\');">Job 2:4__NBLam/1/11\');">Lam 1:11__NBLam/5/6\');">Lam 5:6__NRLam/5/9\');">9__NBMat/16/26\');">Mat 16:26__NBPhl/3/8\');">Phl 3:8__NRPhl/3/9\');">9__AN__GHand_give_2__PSand give__FESee on __NAGen/47/23\');">Gen 47:23__AN.</TD></TR>';
stringArray[20] = 'And Joseph bought all the land of Egypt for Pharaoh; for the Egyptians sold every man his field, because the famine prevailed over them: so the land became Pharaoh\'s.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[21] = '__PNAnd_as_2__SHAnd as</a> for the people, he removed them __PNto_cities_3__SHto cities</a> from [one] end of the borders of Egypt even to the [other] end thereof.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2303. B.C. 1701__GHAnd_as_2__PSAnd as__FEIt is highly probable, that Joseph was influenced by no political motive in removing the people to the cities, but merely by motives of prudence and humanity; for, as the corn was laid up in the cities, it would be more eligible to bring then from distant towns and villages to places where they might be more conveniently supplied with food.__GGto_cities_3__PSto cities__FFGen/41/48\');">Gen 41:48__EN';
stringArray[22] = 'Only the land __PNof_the_priests_1__SHof the priests</a> bought he not; __PNfor_the_priests_2__SHfor the priests</a> had a portion [assigned them] of Pharaoh, and did eat their portion which Pharaoh gave them: wherefore they sold not their lands.__CPof_the_priests_1__PSof the priests__EEor, princes. __NAGen/14/18\');">Gen 14:18__NBGen/41/45\');">Gen 41:45__NRGen/41/50\');">50__AN; *marg:; __NA2Sa/8/18\');">2Sa 8:18__AN__GHfor_the_priests_2__PSfor the priests__EFDeu/12/19\');">Deu 12:19__NBJos/21/1\');">Jos 21:1-45__NBEzr/7/24\');">Ezr 7:24__NBNeh/13/10\');">Neh 13:10__NBMat/10/10\');">Mat 10:10__NB1Cr/9/13\');">1Cr 9:13__NBGal/6/6\');">Gal 6:6__NB2Th/3/10\');">2Th 3:10__NB1Ti/5/17\');">1Ti 5:17__EN';
stringArray[23] = 'Then Joseph said unto the people, Behold, I have __PNbought_1__SHbought</a> you this day and your land for Pharaoh: lo, __PNhere_is_seed_2__SH[here is] seed</a> for you, and ye shall sow the land.__CPbought_1__PSbought__FFGen/47/19\');">Gen 47:19__AN.__GHhere_is_seed_2__PShere is seed__EFGen/41/27\');">Gen 41:27__NBGen/45/6\');">Gen 45:6__NBPsa/41/1\');">Psa 41:1__NBPsa/107/36\');">Psa 107:36__NRPsa/107/37\');">37__NBPsa/112/5\');">Psa 112:5__NBPro/11/26\');">Pro 11:26__NBPro/12/11\');">Pro 12:11__NBPro/13/23\');">Pro 13:23__NBEcc/11/6\');">Ecc 11:6__NBIsa/28/24\');">Isa 28:24__NRIsa/28/25\');">25__NBIsa/55/10\');">Isa 55:10__NBMat/24/45\');">Mat 24:45__NB2Cr/9/10\');">2Cr 9:10__EN';
stringArray[24] = 'And it shall come to pass in the increase, that ye shall give __PNthe_fifth_part_1__SHthe fifth [part]</a> unto Pharaoh, and four parts shall be your own, for seed of the field, and for your food, and for them of your households, and for food for your little ones.__CPthe_fifth_part_1__PSthe fifth part__FFGen/47/25\');">Gen 47:25__NBGen/41/34\');">Gen 41:34__NBLev/27/32\');">Lev 27:32__NB1Sa/8/15\');">1Sa 8:15-17__NBPsa/41/1\');">Psa 41:1__NBPsa/112/5\');">Psa 112:5__EN';
stringArray[25] = 'And they said, __PNThou_hast_1__SHThou hast</a> saved our lives: __PNlet_us_2__SHlet us</a> find grace in the sight of my lord, and we will be Pharaoh\'s servants.__CPThou_hast_1__PSThou hast__FFGen/6/19\');">Gen 6:19__NBGen/41/45\');">Gen 41:45__AN; marg.; __NAGen/45/6\');">Gen 45:6-8__NBGen/50/20\');">Gen 50:20__NBPro/11/26\');">Pro 11:26__NRPro/11/27\');">27__AN__GHlet_us_2__PSlet us__EFGen/18/3\');">Gen 18:3__NBGen/33/15\');">Gen 33:15__NBRth/2/13\');">Rth 2:13__EN';
stringArray[26] = 'And Joseph __PNmade_it_a_law_1__SHmade it a law</a> over the land of Egypt unto this day, [that] Pharaoh should have the fifth [part]; __PNexcept_2__SHexcept</a> the land of the __PNpriests_3__SHpriests</a> only, [which] became not Pharaoh\'s.__CPmade_it_a_law_1__PSmade it a law__EEFrom this history, and from Diodorus Siculus (lib. i.), we learn that the land of Egypt was divided into three parts: one belonged to the Priests, (__NAGen/47/22\');">Gen 47:22__AN, __NAGen/47/26\');">26__AN;) a second was the king\'s, (which appears to have been the land of Rameses, or Goshen, __NAGen/47/11\');">Gen 47:11__AN;) the remainder was the subjects\'. Now Joseph, having purchased the land of the people (__NAGen/47/19\');">Gen 47:19__AN, __NAGen/47/20\');">20__AN), restored it, on the condition of their paying a fifth part of the produce to the king, beyond which he appears to have made no demand.__GHexcept_2__PSexcept__EFGen/47/22\');">Gen 47:22__NBEze/7/24\');">Eze 7:24__AN__GGpriests_3__PSpriests__EEor, princes. See __NAGen/47/22\');">Gen 47:22__EN';
stringArray[27] = 'And Israel __PNdwelt_1__SHdwelt</a> in the land of Egypt, in the country of Goshen; and they had possessions therein, and __PNgrew_2__SHgrew</a>, and multiplied exceedingly.__CPdwelt_1__PSdwelt__FFGen/47/11\');">Gen 47:11__AN__GHgrew_2__PSgrew__EFGen/8/7\');">Gen 8:7__NRGen/8/9\');">9__NBGen/13/16\');">Gen 13:16__NBGen/26/4\');">Gen 26:4__NBGen/28/14\');">Gen 28:14__NBGen/46/3\');">Gen 46:3__NBExd/1/7\');">Exd 1:7__NRExd/1/12\');">12__NBDeu/10/22\');">Deu 10:22__NBDeu/26/5\');">Deu 26:5__NBNeh/9/23\');">Neh 9:23__NBPsa/105/24\');">Psa 105:24__NBPsa/107/38\');">Psa 107:38__NBZec/10/8\');">Zec 10:8__NBAct/7/17\');">Act 7:17__EN';
stringArray[28] = 'And Jacob lived in the land of Egypt __PNseventeen_2__SHseventeen</a> years: so __PNthe_whole_age_3__SHthe whole age</a> of Jacob was an hundred forty and seven years.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2315. B.C. 1689.__GHseventeen_2__PSseventeen__EFGen/37/2\');">Gen 37:2__AN__GGthe_whole_age_3__PSthe whole age__EEHeb. the days of the years of his life. __NAGen/47/8\');">Gen 47:8__AN; marg.; __NAGen/47/9\');">Gen 47:9__NBPsa/90/10\');">Psa 90:10__NRPsa/90/12\');">12__NBPsa/119/84\');">Psa 119:84__EN';
stringArray[29] = 'And the time drew nigh that Israel __PNmust_die_1__SHmust die</a>: and he called his son Joseph, and said unto him, If now I have found grace in thy sight, __PNput_2__SHput</a>, I pray thee, thy hand under my thigh, and __PNdeal_kindly_3__SHdeal kindly</a> and truly with me; __PNbury_me_not_4__SHbury me not</a>, I pray thee, in Egypt:__CPmust_die_1__PSmust die__FFGen/47/9\');">Gen 47:9__NBGen/3/19\');">Gen 3:19__NBGen/50/24\');">Gen 50:24__NBDeu/31/14\');">Deu 31:14__NB2Sa/7/12\');">2Sa 7:12__NB2Sa/14/14\');">2Sa 14:14__NB1Ki/2/1\');">1Ki 2:1__NBJob/7/1\');">Job 7:1__NBJob/14/14\');">Job 14:14__NBJob/30/23\');">Job 30:23__NBPsa/6/5\');">Psa 6:5__NBPsa/49/7\');">Psa 49:7__NRPsa/49/9\');">9__NBPsa/89/48\');">Psa 89:48__NBHbr/9/27\');">Hbr 9:27__AN__GHput_2__PSput__EFGen/24/2\');">Gen 24:2__AN__GGdeal_kindly_3__PSdeal kindly__FFGen/24/49\');">Gen 24:49__AN__GHbury_me_not_4__PSbury me not__EFGen/50/24\');">Gen 50:24__NRGen/50/25\');">25__NBAct/7/15\');">Act 7:15__NRAct/7/16\');">16__NBHbr/11/22\');">Hbr 11:22__EN';
stringArray[30] = 'But I will lie with my fathers, and thou shalt carry me out of Egypt, and bury me in their buryingplace. And he said, I will do as thou hast said.__CPRelated_Verses1_1__PSEntire Verse.__FFGen/23/19\');">Gen 23:19__NBGen/25/9\');">Gen 25:9__NBGen/49/29\');">Gen 49:29-32__NBGen/50/5\');">Gen 50:5-14__NRGen/50/25\');">25__NB2Sa/19/37\');">2Sa 19:37__NB1Ki/13/22\');">1Ki 13:22__NBNeh/2/3\');">Neh 2:3__NRNeh/2/5\');">5__EN';
stringArray[31] = 'And he said, __PNSwear_1__SHSwear</a> unto me. And he sware unto him. __PNAnd_Israel_bowed_2__SHAnd Israel bowed</a> himself upon the bed\'s head.__CPSwear_1__PSSwear__FFGen/24/3\');">Gen 24:3__AN__GHAnd_Israel_bowed_2__PSAnd Israel bowed__FE"As shachah, which primarily signifies to bow, denotes also to worship; and as mittah, a bed, pronounced matteh, is a staff; the LXX. have taken the passage in the latter sense, and rendered it [kai prosekunésen Israel epi to akron tés rabdou autou] ""and Israel worshipped upon the top of his staff,"" which is literally copied by the apostle Paul, in his Epistle to the Hebrews. The present reading is, however, supported by the Masoretic pointing and the Targums; and is most probably correct, as it would appear that Jacob was confined to his bed. __NAGen/47/29\');">Gen 47:29__NBGen/24/26\');">Gen 24:26__NBGen/48/1\');">Gen 48:1__NRGen/48/2\');">2__NB1Ki/1/47\');">1Ki 1:47__NBHbr/11/21\');">Hbr 11:21__AN"</TD></TR>';
