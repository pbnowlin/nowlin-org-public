stringArray[18] = 'And he said, What pledge shall I give thee? And she said, __PNThy_signet_1__SHThy signet</a>, and thy __PNbracelets_2__SHbracelets</a>, and thy staff that [is] in thine hand. And he __PNgave_it_her_3__SHgave [it] her</a>, and came in unto her, and she conceived by him.__CPThy_signet_1__PSThy signet__EEChothem, or chothemeth, as in __NAGen/38/25\');">Gen 38:25__AN, is properly a ring-seal, with which impressions were made to ascertain property, etc. From __NAJer/22/24\');">Jer 22:24__AN, we find that it was worn on the hand; though it might also have been suspended from the neck by a ribband, as the Arabs still wear it. __NAGen/38/25\');">Gen 38:25__NRGen/38/26\');">26__NBJer/22/24\');">Jer 22:24__NBLuk/15/22\');">Luk 15:22__AN__GHbracelets_2__PSbracelets__FEPathil, from pathal, to twist, wreathe, may denote either a wreath for the arm or neck, a twisted collar, or bracelet. In the former sense the LXX. render it by [ormiskon] and Aquila and Symmachus by [strepton;] and in the latter sense, the Vulgate renders it by armillam. It may have been a collar by which the signet was suspended; though its being used in the plural seems to favour the opinion of its being a bracelet.__GGgave_it_her_3__PSgave it her__FFGen/38/25\');">Gen 38:25__NRGen/38/26\');">26__NBHsa/4/11\');">Hsa 4:11__EN';
