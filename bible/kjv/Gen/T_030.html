stringArray[14] = 'And Reuben went in the days of wheat harvest, and found __PNmandrakes_2__SHmandrakes</a> in the field, and brought them unto his mother Leah. Then Rachel said to Leah, __PNGive_me_3__SHGive me</a>, I pray thee, of thy son\'s mandrakes.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2256. B.C. 1748.__GHmandrakes_2__PSmandrakes__FE"The mandrake may be the Hebrew {dudaim:} it is so rendered by all the ancient versions, and is a species of melon, of an agreeable odour. Hasselquist, speaking of Nazareth in Galilee, says, ""What I found most remarkable at this village was the great number of mandrakes which grew in a vale below it. I had not the pleasure of seeing this plant in blossom, the fruit now (May 5th, O. S.) hanging ripe on the stem, which lay withered on the ground. From the season in which this mandrake blossoms and ripens fruit, one might form a conjecture that it was Rachel\'s {dudaim.} These were brought her in the wheat harvest, which in Galilee is in the month of May, about this time, and the mandrake was now in fruit."" The Abbee Mariti describes it as growing ""low like a lettuce, to which its leaves have a great resemblance, except that they have a dark green colour. The flowers are purple, and the root is for the most part forked. The fruit, when ripe in the beginning of May, is of the size and colour of a small apple, excee"__GGGive_me_3__PSGive me__FFGen/25/30\');">Gen 25:30__EN';

stringArray[40] = 'And Jacob did separate the lambs, and set the faces of the flocks toward the ringstraked, and all the brown in the flock of Laban; and he put his own flocks by themselves, and put them not unto Laban\'s cattle.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[41] = 'And it came to pass, __PNwhensoever_the_stronger_cattle_did_conceive_1__SHwhensoever the stronger cattle did conceive</a>, that Jacob laid the rods before the eyes of the cattle in the gutters, that they might conceive among the rods.__CPwhensoever_the_stronger_cattle_did_conceive_1__PSwhensoever the stronger cattle did conceive__EEAs the means which Jacob used would not in general produce similar effects, nay, probably the experiment was never in any other instance tried with effect, it is more in harmony with Divine truth to suppose that he was directed by some Divine intimation; and rendered successful, if not by a direct miracle, yet at least by the LORD\'s giving a new and uncommon bias to the tendency of natural causes.</TD></TR>';
