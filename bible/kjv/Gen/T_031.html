stringArray[34] = 'Now Rachel __PNhad_taken_1__SHhad taken</a> the images, and put them in the camel\'s __PNfurniture_2__SHfurniture</a>, and sat upon them. And Laban __PNsearched_3__SHsearched</a> all the tent, but found [them] not.__CPhad_taken_1__PShad taken__FFGen/31/17\');">Gen 31:17__NRGen/31/19\');">19__AN__GHfurniture_2__PSfurniture__FE"The word, car, rendered ""furniture,"" properly denotes ""a large round pannier,"" placed one on each side of a camel, for a person, especially women, to ride in. It is a hamper, like a cradle, having a back, head, and sides, like a great chair. Moryson describes them as ""two long chairs like cradles, covered with red cloth, to hang on the two sides of the camel."" Hanway calls them kedgavays, which ""are a kind of covered chairs, which the Persians hang over their camels in the manner of panniers, and are big enough for one person to sit in."" Thevenot, who calls then counes, says that they lay over them a cover, which keeps then both from the rain and sun; and Maillet describes them as covered cages, hanging on each side of a camel. The late Editor of Calmet has furnished a correct delineation of these cars, as seen on one side of a camel, copied from Dalton\'s Prints of Egyptian Figures."__GGsearched_3__PSsearched__EEHeb. felt.</TD></TR>';
