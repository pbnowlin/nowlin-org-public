Text[9] = 'And Joseph remembered the dreams which he dreamed of them, and said unto them, Ye [are] spies; to see the nakedness of the land ye are come.';

Text[16] = 'Send one of you, and let him fetch your brother, and ye shall be kept in prison, that your words may be proved, whether [there be any] truth in you: or else by the life of Pharaoh surely ye [are] spies.';
Text[17] = 'And he put them all together into ward three days.';
Text[18] = 'And Joseph said unto them the third day, This do, and live; [for] I fear God:';
Text[19] = 'If ye [be] true [men], let one of your brethren be bound in the house of your prison: go ye, carry corn for the famine of your houses:';
Text[20] = 'But bring your youngest brother unto me; so shall your words be verified, and ye shall not die. And they did so.';
Text[21] = 'And they said one to another, We [are] verily guilty concerning our brother, in that we saw the anguish of his soul, when he besought us, and we would not hear; therefore is this distress come upon us.';
Text[22] = 'And Reuben answered them, saying, Spake I not unto you, saying, Do not sin against the child; and ye would not hear? therefore, behold, also his blood is required.';
Text[23] = 'And they knew not that Joseph understood [them]; for he spake unto them by an interpreter.';
Text[24] = 'And he turned himself about from them, and wept; and returned to them again, and communed with them, and took from them Simeon, and bound him before their eyes.';
Text[25] = 'Then Joseph commanded to fill their sacks with corn, and to restore every man\'s money into his sack, and to give them provision for the way: and thus did he unto them.';
Text[26] = 'And they laded their asses with the corn, and departed thence.';
Text[27] = 'And as one of them opened his sack to give his ass provender in the inn, he espied his money; for, behold, it [was] in his sack\'s mouth.';
Text[28] = 'And he said unto his brethren, My money is restored; and, lo, [it is] even in my sack: and their heart failed [them], and they were afraid, saying one to another, What [is] this [that] God hath done unto us?';

Text[33] = 'And the man, the lord of the country, said unto us, Hereby shall I know that ye [are] true [men]; leave one of your brethren [here] with me, and take [food for] the famine of your households, and be gone:';

Text[35] = 'And it came to pass as they emptied their sacks, that, behold, every man\'s bundle of money [was] in his sack: and when [both] they and their father saw the bundles of money, they were afraid.';
Text[36] = 'And Jacob their father said unto them, Me have ye bereaved [of my children]: Joseph [is] not, and Simeon [is] not, and ye will take Benjamin [away]: all these things are against me.';
