stringArray[1] = 'And Joseph __PNfell_1__SHfell</a> upon his father\'s face, and __PNwept_2__SHwept</a> upon him, and kissed him.__CPfell_1__PSfell__FFGen/46/4\');">Gen 46:4__NBDeu/6/7\');">Deu 6:7__NRDeu/6/8\');">8__NBEph/6/4\');">Eph 6:4__AN__GHwept_2__PSwept__EFGen/23/2\');">Gen 23:2__NB2Ki/13/14\');">2Ki 13:14__NBMar/5/38\');">Mar 5:38__NRMar/5/39\');">39__NBJhn/11/35\');">Jhn 11:35-38__NBAct/8/2\');">Act 8:2__NB1Th/4/13\');">1Th 4:13__EN';
stringArray[2] = 'And Joseph commanded his servants __PNthe_physicians_1__SHthe physicians</a> to embalm his father: and the physicians __PNembalmed_2__SHembalmed</a> Israel.__CPthe_physicians_1__PSthe physicians__EEThe Hebrew ropheim, from rapha, to heal, is literally the healers, those whose business it was to heal, or restore the body from sickness, by administering proper medicines; and when death took place, to heal or preserve it from decomposition by embalming. The word chanat, to embalm, is also used in Arabic to express the reddening of leather; somewhat analogous to our tanning; which is probably the grand principal in embalming.__GHembalmed_2__PSembalmed__EFGen/50/26\');">Gen 50:26__NB2Ch/16/14\');">2Ch 16:14__NBMat/26/12\');">Mat 26:12__NBMar/14/8\');">Mar 14:8__NBMar/16/1\');">Mar 16:1__NBLuk/24/1\');">Luk 24:1__NBJhn/12/7\');">Jhn 12:7__NBJhn/19/39\');">Jhn 19:39__NRJhn/19/40\');">40__EN';
stringArray[3] = 'And __PNforty_days_1__SHforty days</a> were fulfilled for him; for so are fulfilled the days of those which are embalmed: and the Egyptians __PNmourned_2__SHmourned</a> for him __PNthreescore_3__SHthreescore</a> and ten days.__CPforty_days_1__PSforty days__EEWe learn from the Greek historians, that the time of mourning was while the body remained with the embalmers, which Herodotus says was seventy days. During this time the body lay in nitre, the use of which was to dry up all its superfluous and noxious moisture: and when, in the space of 30 days, this was sufficiently effected, the remaining forty, the time mentioned by Diodorus, were employed in anointing it with gums and spices to preserve it, which was properly the embalming. This sufficiently explains the phraseology of the text.__GHmourned_2__PSmourned__FEHeb. wept.__GGthreescore_3__PSthreescore__FFNum/20/29\');">Num 20:29__NBDeu/21/13\');">Deu 21:13__NBDeu/34/8\');">Deu 34:8__EN';
stringArray[4] = 'And when __PNthe_days_1__SHthe days</a> of his mourning were past, __PNJoseph_2__SHJoseph</a> spake unto the house of Pharaoh, saying, If now I have __PNfound_grace_3__SHfound grace</a> in your eyes, speak, I pray you, in the ears of Pharaoh, saying,__CPthe_days_1__PSthe days__FFGen/50/10\');">Gen 50:10__AN.__GHJoseph_2__PSJoseph__EFEst/4/2\');">Est 4:2__AN__GGfound_grace_3__PSfound grace__FFGen/18/3\');">Gen 18:3__EN';

stringArray[10] = 'And they came to __PNthe_threshingfloor_1__SHthe threshingfloor</a> of Atad, which [is] __PNbeyond_2__SHbeyond</a> Jordan, and there they mourned with a great and very sore lamentation: and he made a mourning for his father __PNseven_days_3__SHseven days</a>.__CPthe_threshingfloor_1__PSthe threshingfloor__EEThis place was situated, according to Jerome, between the Jordan and the city of Jericho, two miles from the former, and three from the latter, where Bethagla was afterwards built. Procopius of Gaza states the same. As aataad signifies thorns, the place might have been remarkable for their production; though all the versions except the Arabic consider it as a proper name. As Moses wrote or revised his history on the east side of Jordan, the term beyond Jordan, in his five books, means westward of Jordan; but in other parts of Scripture it generally means eastward.__GHbeyond_2__PSbeyond__EFGen/50/11\');">Gen 50:11__NBDeu/1/1\');">Deu 1:1__AN__GGseven_days_3__PSseven days__FFGen/50/4\');">Gen 50:4__NBNum/19/11\');">Num 19:11__NBDeu/34/8\');">Deu 34:8__NB1Sa/31/13\');">1Sa 31:13__NB2Sa/1/17\');">2Sa 1:17__NBJob/2/13\');">Job 2:13__NBAct/8/2\');">Act 8:2__EN';
