stringArray[21] = 'And __PNthey_said_1__SHthey said</a> one to another, We [are] verily guilty concerning our brother, in that __PNwe_saw_2__SHwe saw</a> the anguish of his soul, when he besought us, and we would not hear; therefore is __PNthis_distress_3__SHthis distress</a> come upon us.__CPthey_said_1__PSthey said__FFGen/41/9\');">Gen 41:9__NBNum/32/23\');">Num 32:23__NB2Sa/12/13\');">2Sa 12:13__NB1Ki/17/18\');">1Ki 17:18__NBJob/33/27\');">Job 33:27__NRJob/33/28\');">28__NBJob/34/31\');">Job 34:31__NRJob/34/32\');">32__NBJob/36/8\');">Job 36:8__NRJob/36/9\');">9__NBHsa/5/15\');">Hsa 5:15__NBMat/27/3\');">Mat 27:3__NRMat/27/4\');">4__NBMar/9/44\');">Mar 9:44__NRMar/9/46\');">46__NRMar/9/48\');">48__NBLuk/16/28\');">Luk 16:28__NBAct/19/18\');">Act 19:18__AN__GHwe_saw_2__PSwe saw__EFGen/37/23\');">Gen 37:23-28__NBJdg/1/7\');">Jdg 1:7__NBPro/21/13\');">Pro 21:13__NBPro/24/11\');">Pro 24:11__NRPro/24/12\');">12__NBPro/28/17\');">Pro 28:17__NBJer/2/17\');">Jer 2:17__NRJer/2/19\');">19__NBJer/4/18\');">Jer 4:18__NBJer/34/17\');">Jer 34:17__NBMat/7/2\');">Mat 7:2__NB1Jo/1/9\');">1Jo 1:9__NBJam/2/13\');">Jam 2:13__AN__GGthis_distress_3__PSthis distress__FFPro/1/27\');">Pro 1:27__NRPro/1/28\');">28__EN';
stringArray[22] = 'And Reuben answered them, saying, __PNSpake_I_1__SHSpake I</a> not unto you, saying, Do not sin against the child; and ye would not hear? therefore, behold, also __PNhis_blood_2__SHhis blood</a> is required.__CPSpake_I_1__PSSpake I__FFGen/37/21\');">Gen 37:21__NRGen/37/22\');">22__NRGen/37/29\');">29__NRGen/37/30\');">30__NBLuk/23/41\');">Luk 23:41__NBRom/2/15\');">Rom 2:15__AN__GHhis_blood_2__PShis blood__EFGen/4/10\');">Gen 4:10__NBGen/9/5\');">Gen 9:5__NRGen/9/6\');">6__NB1Ki/2/32\');">1Ki 2:32__NB2Ch/24/22\');">2Ch 24:22__NBPsa/9/12\');">Psa 9:12__NBEze/3/18\');">Eze 3:18__NBLuk/11/50\');">Luk 11:50__NRLuk/11/51\');">51__NBAct/28/4\');">Act 28:4__NBRev/13/10\');">Rev 13:10__NBRev/16/9\');">Rev 16:9__EN';
stringArray[23] = 'And they knew not that Joseph understood [them]; for __PNhe_spake_unto_them_by_an_interpreter_1__SHhe spake unto them by an interpreter</a>.__CPhe_spake_unto_them_by_an_interpreter_1__PShe spake unto them by an interpreter__EE"Heb. an interpreter was between them. The mailitz does not seem to have been an interpreter in our sense of the term; as we have many evidences in this book that the Egyptians, Hebrews, Canaanites, and Syrians, could understand each other in a general way; and it appears from several passages in this very chapter, (particularly __NAGen/42/24\');">Gen 42:24__AN,) that Joseph and his brethren understood each others\' language, as his brethren and Joseph\'s steward also did (__NAGen/43/19\');">Gen 43:19__AN, etc; compare __NAGen/39/\');">Gen 39__NBGen/49/\');">49__AN.) It seems to denote an officer who is called in Abyssinia, according to Mr. Bruce, Kal Hatzé, ""the voice or word of the king,"" who always stands at the side of a lattice window of a balcony, within which the king sits; who is never seen, but who speaks through a hole in the side of it, covered in the inside with a curtain, to this officer, by whom he speaks to the persons present. __NAJhn/16/13\');">Jhn 16:13__NRJhn/16/14\');">14__NB2Cr/5/20\');">2Cr 5:20__AN"</TD></TR>';
stringArray[24] = 'And he turned himself about from them, and __PNwept_1__SHwept</a>; and returned to them again, and communed with them, and took from them __PNSimeon_2__SHSimeon</a>, and bound him before their eyes.__CPwept_1__PSwept__FFGen/43/30\');">Gen 43:30__NBIsa/63/9\');">Isa 63:9__NBLuk/19/41\');">Luk 19:41__NBRom/12/15\');">Rom 12:15__NB1Cr/12/26\');">1Cr 12:26__NBHbr/4/15\');">Hbr 4:15__AN__GHSimeon_2__PSSimeon__EFGen/34/25\');">Gen 34:25__NBGen/49/5\');">Gen 49:5-7__NBJud/1/22\');">Jud 1:22__NRJud/1/23\');">23__EN';
stringArray[25] = 'Then Joseph __PNcommanded_1__SHcommanded</a> to fill their sacks with corn, and to restore every man\'s money into his sack, and __PNto_give_them_2__SHto give them</a> provision for the way: __PNand_thus_3__SHand thus</a> did he unto them.__CPcommanded_1__PScommanded__FFGen/44/1\');">Gen 44:1__NRGen/44/2\');">2__NBIsa/55/1\');">Isa 55:1__AN__GHto_give_them_2__PSto give them__EFGen/45/21\');">Gen 45:21__NBMat/6/33\');">Mat 6:33__AN__GGand_thus_3__PSand thus__FFMat/5/44\');">Mat 5:44__NBRom/12/17\');">Rom 12:17-21__NB1Pe/3/9\');">1Pe 3:9__EN';
stringArray[26] = 'And they laded their asses with the corn, and departed thence.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[27] = 'And as one of them opened his sack to give his ass provender in __PNthe_inn_1__SHthe inn</a>, he espied his money; for, behold, it [was] in his sack\'s mouth.__CPthe_inn_1__PSthe inn__FFGen/43/21\');">Gen 43:21__NBGen/44/11\');">Gen 44:11__NBExd/4/24\');">Exd 4:24__NBLuk/2/7\');">Luk 2:7__NBLuk/10/34\');">Luk 10:34__AN__GHinn_2__PSinn__FEMalon, from loon, to stay, abide, lodge, denotes any place to stay and lodge in, particularly a place where travellers usually stop to lodge, which is generally near a well, where they fill their girbehs, or leathern bottles, with fresh water, and having unladen and clogged their camels, asses, etc., permit them to crop any little verdure there may be in the place, keeping watch over them by turns. Our word inn here gives us a false idea, there were no such places of entertainment in the desert which Joseph\'s brethren had to pass; nor are there any at the present day. The only accommodation such a place affords is either a well, or a khan, or caravanserai, which is generally no more than four bare walls, perfectly exposed, the place being open at the top, and furnishing a wretched lodging: and even these, it is probable, were not in use at this early period.</TD></TR>';
stringArray[28] = 'And he said unto his brethren, My money is restored; and, lo, [it is] even in my sack: and __PNtheir_heart_1__SHtheir heart</a> __PNfailed_them_2__SHfailed [them]</a>, and they were afraid, saying one to another, __PNWhat_is_3__SHWhat [is]</a> this [that] God hath done unto us?__CPtheir_heart_1__PStheir heart__FFGen/42/36\');">Gen 42:36__NBGen/27/33\');">Gen 27:33__NBLev/26/36\');">Lev 26:36__NBDeu/28/65\');">Deu 28:65__NB1Ki/10/5\');">1Ki 10:5__NBPsa/61/2\');">Psa 61:2__NBSgs/5/6\');">Sgs 5:6__NBLuk/21/26\');">Luk 21:26__AN__GHfailed_them_2__PSfailed them__FEHeb. went forth. This refers to the spasmodic affection which is felt in the breast at any sudden alarm or fright.__GGWhat_is_3__PSWhat is__FFIsa/45/7\');">Isa 45:7__NBLam/2/17\');">Lam 2:17__NBLam/3/37\');">Lam 3:37__NBAmo/3/6\');">Amo 3:6__EN';
