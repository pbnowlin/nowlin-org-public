Text[11] = 'Out of that land went forth Asshur, and builded Nineveh, and the city Rehoboth, and Calah,';

Text[13] = 'And Mizraim begat Ludim, and Anamim, and Lehabim, and Naphtuhim,';

Text[15] = 'And Canaan begat Sidon his firstborn, and Heth,';

Text[17] = 'And the Hivite, and the Arkite, and the Sinite,';

Text[19] = 'And the border of the Canaanites was from Sidon, as thou comest to Gerar, unto Gaza; as thou goest, unto Sodom, and Gomorrah, and Admah, and Zeboim, even unto Lasha.';

Text[22] = 'The children of Shem; Elam, and Asshur, and Arphaxad, and Lud, and Aram.';
Text[23] = 'And the children of Aram; Uz, and Hul, and Gether, and Mash.';
Text[24] = 'And Arphaxad begat Salah; and Salah begat Eber.';
Text[25] = 'And unto Eber were born two sons: the name of one [was] Peleg; for in his days was the earth divided; and his brother\'s name [was] Joktan.';

Text[27] = 'And Hadoram, and Uzal, and Diklah,';
Text[28] = 'And Obal, and Abimael, and Sheba,';
