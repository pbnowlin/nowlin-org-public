Text[1] = 'And Adam knew Eve his wife; and she conceived, and bare Cain, and said, I have gotten a man from the LORD.';

Text[3] = 'And in process of time it came to pass, that Cain brought of the fruit of the ground an offering unto the LORD.';

Text[11] = 'And now [art] thou cursed from the earth, which hath opened her mouth to receive thy brother\'s blood from thy hand;';
