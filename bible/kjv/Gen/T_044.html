stringArray[5] = '[Is] not this [it] in which my lord drinketh, and whereby indeed he __PNdivineth_1__SHdivineth</a>? ye have done evil in so doing.__CPdivineth_1__PSdivineth__EE"or, maketh trial. __NAGen/44/15\');">Gen 44:15__AN; marg.; __NAGen/30/27\');">Gen 30:27__NBLev/19/26\');">Lev 19:26__NB1Ki/20/33\');">1Ki 20:33__NB2Ki/21/6\');">2Ki 21:6__AN; In the East, there is an ancient tradition, that there was a Cup which possessed the strange property of representing in it the whole world, and all the things which were then doing. The cup is called {Jami Jemsheed,} ""the cup of Jemsheed,"" a very ancient king of Persia; and they say that it was discovered, filled with the elixir of immortality, when digging to lay the foundations of Persepolis. The Persian poets are full of allusions to this cup, which they style {Jem jehan nima,} the cup shewing the universe; and to it they ascribe all the prosperity of their ancient monarchs. Many of the Mahometan princes and governors affect still to have information by means of a cup. Now, though it cannot be admitted that Joseph practised divination, yet, according to the superstition of those times, supernatural influence might be attributed to HIS CUP."</TD></TR>';

stringArray[18] = 'Then Judah came near unto him, and said, __PNOh_my_lord_1__SHOh my lord</a>, __PNlet_thy_2__SHlet thy</a> servant, I pray thee, speak a word in my lord\'s ears, and let not thine __PNanger_3__SHanger</a> burn against thy servant: for thou [art] even __PNas_Pharaoh_4__SHas Pharaoh</a>.__CPOh_my_lord_1__PSOh my lord__EE"""No paraphrase,"" says Dr. A. Clarke, ""can heighten the effect of Judah\'s address to Joseph. To add, would be to diminish its excellence; to attempt to explain, would be to obscure its beauties; to clothe the ideas in other language than that of Judah, and his translators in our Bible, would ruin its energy, and destroy its influence. It is perhaps one of the most tender, affecting pieces of natural oratory ever spoken or penned: and we need not wonder to find that, when Joseph heard it, he could not refrain himself, but wept aloud. His soul must have been insensible beyond what is common to human nature, had he not immediately yielded to a speech so delicately tender, and so powerfully impressive."""__GHlet_thy_2__PSlet thy__EFGen/18/30\');">Gen 18:30__NRGen/18/32\');">32__NB2Sa/14/12\');">2Sa 14:12__NBJob/33/31\');">Job 33:31__NBAct/2/29\');">Act 2:29__AN__GGanger_3__PSanger__FFExd/32/22\');">Exd 32:22__NBEst/1/12\');">Est 1:12__NBPsa/79/5\');">Psa 79:5__AN__GHas_Pharaoh_4__PSas Pharaoh__EFGen/41/40\');">Gen 41:40__NRGen/41/44\');">44__NBPro/19/12\');">Pro 19:12__NBDan/3/15\');">Dan 3:15__NRDan/3/19\');">19-23__NBDan/5/19\');">Dan 5:19__NBJhn/5/22\');">Jhn 5:22__EN';

stringArray[20] = 'And __PNwe_said_1__SHwe said</a> unto my lord, We have a father, an old man, and __PNa_child_2__SHa child</a> of his old age, a little one; __PNand_his_brother_3__SHand his brother</a> is dead, and __PNhe_alone_4__SHhe alone</a> is left of his mother, and his father loveth him.__CPwe_said_1__PSwe said__EE"Every word in this verse is simplicity and pathos itself. No man of the least sensibility can read it without great emotion. Indeed the whole speech is exquisitely beautiful, and perhaps the most complete pattern of genuine natural eloquence extant in any language. When we read this generous speech, we forgive Judah all the past, and cannot refuse to say, ""Thou art he whom thy brethren shall praise."" __NAGen/49/8\');">Gen 49:8__AN"__GHa_child_2__PSa child__EFGen/35/18\');">Gen 35:18__NBGen/37/3\');">Gen 37:3__NRGen/37/19\');">19__NBGen/43/7\');">Gen 43:7__NRGen/43/8\');">8__NBGen/46/21\');">Gen 46:21__AN__GGand_his_brother_3__PSand his brother__FFGen/37/33\');">Gen 37:33-35__NBGen/42/36\');">Gen 42:36__NRGen/42/38\');">38__AN__GHhe_alone_4__PShe alone__EFGen/44/27\');">Gen 44:27-29__NBLuk/7/12\');">Luk 7:12__EN';
