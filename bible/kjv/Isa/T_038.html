stringArray[8] = 'Behold, __PNI_will_bring_1__SHI will bring</a> again the shadow of the degrees, which is gone down in __PNthe_sun_dial_2__SHthe sun dial</a> of Ahaz, ten degrees backward. So the sun returned ten degrees, by which degrees it was gone down.__CPI_will_bring_1__PSI will bring__FFJos/10/12\');">Jos 10:12-14__NB2Ki/20/11\');">2Ki 20:11__NB2Ch/32/24\');">2Ch 32:24__NR2Ch/32/31\');">31__NBMat/16/1\');">Mat 16:1__AN__GHthe_sun_dial_2__PSthe sun dial__FE"Heb. the degrees by, or, with the sun. Or, as the Hebrew might be rendered, ""the steps of Ahaz."" The researches of curious travellers in Hindostan, observes Bp. Stock, have lately discovered in that country, three observatories of similar form, the most remarkable of which is to be seen within four miles of Delhi, the ancient capital of the Mogul empire. A rectangled triangle, whose hypotenuse is a staircase, (apparently parallel to the axis of the earth,) bisects a zone, or coping of a wall, which wall connects the two terminating towers at right and left. The coping itself is of a circular form, and accurately graduated, to mark, by the gnomon above, the sun\'s progress before and after noon."</TD></TR>';
