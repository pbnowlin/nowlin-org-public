stringArray[1] = 'Now __PNit_came_1__SHit came</a> to pass in the fourteenth year of king Hezekiah, __PNthat_Sennacherib_2__SH[that] Sennacherib</a> king of Assyria came up against all the defenced cities of Judah, and took them.__CPit_came_1__PSit came__FF2Ki/18/13\');">2Ki 18:13__NR2Ki/18/17\');">17__NB2Ch/32/1\');">2Ch 32:1__AN__GHthat_Sennacherib_2__PSthat Sennacherib__EFIsa/1/7\');">Isa 1:7__NRIsa/1/8\');">8__NBIsa/7/17\');">Isa 7:17__NBIsa/8/7\');">Isa 8:7__NRIsa/8/8\');">8__NBIsa/10/28\');">Isa 10:28-32__NBIsa/33/7\');">Isa 33:7__NRIsa/33/8\');">8__EN';
stringArray[2] = 'And the king of Assyria __PNsent_2__SHsent</a> Rabshakeh from Lachish to Jerusalem unto king Hezekiah with a great army. And he stood by __PNthe_conduit_3__SHthe conduit</a> of the upper pool in the highway of the fuller\'s field.__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 3294. B.C. 710.__GHsent_2__PSsent__EF2Ki/18/17\');">2Ki 18:17-37__NB2Ch/32/9\');">2Ch 32:9-23__AN__GGthe_conduit_3__PSthe conduit__FFIsa/7/3\');">Isa 7:3__NBIsa/22/9\');">Isa 22:9-11__EN';
stringArray[3] = 'Then came forth unto him __PNEliakim_1__SHEliakim</a>, Hilkiah\'s son, which was over the house, and __PNShebna_2__SHShebna</a> the __PNscribe_3__SHscribe</a>, and Joah, Asaph\'s son, the recorder.__CPEliakim_1__PSEliakim__FFIsa/22/15\');">Isa 22:15-20__AN__GHShebna_2__PSShebna__EF2Sa/8/16\');">2Sa 8:16__NR2Sa/8/17\');">17__NB2Sa/20/24\');">2Sa 20:24__NR2Sa/20/25\');">25__AN__GGscribe_3__PSscribe__EEor, secretary.</TD></TR>';
stringArray[4] = 'And Rabshakeh said unto them, Say ye now to Hezekiah, __PNThus_saith_1__SHThus saith</a> the great king, the king of __PNAssyria_2__SHAssyria</a>, __PNWhat_3__SHWhat</a> confidence [is] this wherein thou trustest?__CPThus_saith_1__PSThus saith__FFIsa/10/8\');">Isa 10:8-14__NBIsa/37/11\');">Isa 37:11-15__NBPro/16/18\');">Pro 16:18__NBEze/31/3\');">Eze 31:3-18__NBDan/4/30\');">Dan 4:30__NBAct/12/22\');">Act 12:22__NRAct/12/23\');">23__NBJud/1/16\');">Jud 1:16__AN__GHAssyria_2__PSAssyria__FEAssyria proper, now Kourdistan, was bounded by Armenia on the north, Media and Persia on the east, Babylonia on the south, and the Tigris, which divides it from Mesopotamia, on the west, between 33 degrees and 38 degrees N. lat. and 42 degrees and 46 degrees E. long. But the Assyrian empire, the bounds of which were different at different times, in its most flourishing state, according to the descriptions of the Greek and Roman writers, comprehended all the countries and nations between the Mediterranean on the west, and the Indus on the east, and between the deserts of Scythia on the north, and the Indian ocean on the south.__GGWhat_3__PSWhat__FF2Ki/18/5\');">2Ki 18:5__NR2Ki/18/19\');">19-37__NB2Ki/19/10\');">2Ki 19:10__NB2Ch/32/7\');">2Ch 32:7-10__NR2Ch/32/14\');">14-16__NBPsa/42/3\');">Psa 42:3__NRPsa/42/10\');">10__NBPsa/71/10\');">Psa 71:10__NRPsa/71/11\');">11__EN';
stringArray[5] = 'I say, [sayest thou], (but [they are but] __PNvain_words_1__SHvain words</a>) __PNI_have_counsel_and_strength_for_war_2__SH[I have] counsel and strength for war</a>: now on whom dost thou trust, __PNthat_3__SHthat</a> thou rebellest against me?__CPvain_words_1__PSvain words__EEHeb. a word of lips__GHI_have_counsel_and_strength_for_war_2__PSI have counsel and strength for war__FEor, but counsel and strength are for the war. __NAPro/21/30\');">Pro 21:30__NRPro/21/31\');">31__NBPro/24/5\');">Pro 24:5__NRPro/24/6\');">6__AN__GGthat_3__PSthat__FF2Ki/18/7\');">2Ki 18:7__NB2Ki/24/1\');">2Ki 24:1__NBNeh/2/19\');">Neh 2:19__NRNeh/2/20\');">20__NBJer/52/3\');">Jer 52:3__NBEze/17/15\');">Eze 17:15__EN';

stringArray[12] = 'But Rabshakeh said, Hath my master sent me to thy master and to thee to speak these words? [hath he] not [sent me] to the men that sit upon the wall, __PNthat_they_may_1__SHthat they may</a> eat their own dung, and drink their own piss with you?__CPthat_they_may_1__PSthat they may__FFIsa/9/20\');">Isa 9:20__NBLev/26/29\');">Lev 26:29__NBDeu/28/53\');">Deu 28:53-57__NB2Ki/6/25\');">2Ki 6:25-29__NB2Ki/18/27\');">2Ki 18:27__NBJer/19/9\');">Jer 19:9__NBLam/4/9\');">Lam 4:9__NRLam/4/10\');">10__NBEze/4/16\');">Eze 4:16__EN';
stringArray[13] = 'Then Rabshakeh stood, and __PNcried_1__SHcried</a> with a loud voice in the Jews\' language, and said, __PNHear_2__SHHear</a> ye the words of the great king, the king of Assyria.__CPcried_1__PScried__FF1Sa/17/8\');">1Sa 17:8-11__NB2Ki/18/28\');">2Ki 18:28-32__NB2Ch/32/18\');">2Ch 32:18__NBPsa/17/10\');">Psa 17:10-13__NBPsa/73/8\');">Psa 73:8__NRPsa/73/9\');">9__NBPsa/82/6\');">Psa 82:6__NRPsa/82/7\');">7__AN__GHHear_2__PSHear__EFIsa/36/4\');">Isa 36:4__NBIsa/8/7\');">Isa 8:7__NBIsa/10/8\');">Isa 10:8-13__NBEze/31/3\');">Eze 31:3-10__NBDan/4/37\');">Dan 4:37__EN';
stringArray[14] = 'Thus saith the king, Let not Hezekiah deceive you: for he shall not be able to deliver you.__CPRelated_Verses1_1__PSEntire Verse.__FFIsa/37/10\');">Isa 37:10-13__NB2Ki/19/10\');">2Ki 19:10-13__NR2Ki/19/22\');">22__NB2Ch/32/11\');">2Ch 32:11__NR2Ch/32/13\');">13-19__NBDan/3/15\');">Dan 3:15-17__NBDan/6/20\');">Dan 6:20__NBDan/7/25\');">Dan 7:25__NB2Th/2/4\');">2Th 2:4__NBRev/13/5\');">Rev 13:5__NRRev/13/6\');">6__EN';

stringArray[16] = 'Hearken not to Hezekiah: for thus saith the king of Assyria, __PNMake_an_agreement_with_me_by_a_present_1__SHMake [an agreement] with me [by] a present</a>, and __PNcome_out_2__SHcome out</a> to me: and __PNeat_ye_3__SHeat ye</a> every one of his vine, and every one of his fig tree, and drink ye every one the waters of his own cistern;__CPMake_an_agreement_with_me_by_a_present_1__PSMake an agreement with me by a present__EEor, Seek my favour by a present. Heb. Make with me a blessing. __NAGen/32/20\');">Gen 32:20__NBGen/33/11\');">Gen 33:11__NB1Sa/25/27\');">1Sa 25:27__NB2Sa/8/6\');">2Sa 8:6__NB2Ki/5/15\');">2Ki 5:15__NB2Ki/18/31\');">2Ki 18:31__NB2Cr/9/5\');">2Cr 9:5__AN; *marg:__GHcome_out_2__PScome out__EF1Sa/11/3\');">1Sa 11:3__NB2Ki/24/12\');">2Ki 24:12-16__AN__GGeat_ye_3__PSeat ye__FF1Ki/4/20\');">1Ki 4:20__NR1Ki/4/25\');">25__NBMic/4/4\');">Mic 4:4__NBZec/3/10\');">Zec 3:10__EN';
stringArray[17] = 'Until __PNI_come_1__SHI come</a> and take you away to a land like your own land, __PNa_land_of_corn_2__SHa land of corn</a> and wine, a land of bread and vineyards.__CPI_come_1__PSI come__FF2Ki/17/6\');">2Ki 17:6-23__NB2Ki/18/9\');">2Ki 18:9-12__NB2Ki/24/11\');">2Ki 24:11__NBPro/12/10\');">Pro 12:10__AN__GHa_land_of_corn_2__PSa land of corn__FE"__NAExd/3/8\');">Exd 3:8__NBDeu/8/7\');">Deu 8:7-9__NBDeu/11/12\');">Deu 11:12__NBJob/20/17\');">Job 20:17__AN; The other copy in __NA2Ki/18/32\');">2Ki 18:32__AN, adds here, ""a land of oil olive, and of honey; that ye may live, and not die: and hearken not unto Hezekiah when he seduceth you."""</TD></TR>';
stringArray[18] = '[Beware] __PNlest_1__SHlest</a> Hezekiah persuade you, saying, The LORD will deliver us. __PNHath_2__SHHath</a> any of the gods of the nations delivered his land out of the hand of the king of Assyria?__CPlest_1__PSlest__FFIsa/36/7\');">Isa 36:7__NRIsa/36/10\');">10__NRIsa/36/15\');">15__NBIsa/37/10\');">Isa 37:10__NBPsa/12/4\');">Psa 12:4__NBPsa/92/5\');">Psa 92:5-7__AN__GHHath_2__PSHath__EFIsa/37/12\');">Isa 37:12__NRIsa/37/13\');">13__NRIsa/37/17\');">17__NRIsa/37/18\');">18__NB2Ki/18/33\');">2Ki 18:33-35__NB2Ki/19/12\');">2Ki 19:12__NR2Ki/19/13\');">13__NR2Ki/19/17\');">17__NR2Ki/19/18\');">18__NB2Ch/32/13\');">2Ch 32:13-17__NBPsa/115/2\');">Psa 115:2-8__NBPsa/135/5\');">Psa 135:5__NRPsa/135/6\');">6__NRPsa/135/15\');">15-18__NBJer/10/3\');">Jer 10:3-5__NRJer/10/10\');">10-12__NBDan/3/15\');">Dan 3:15__NBHab/2/19\');">Hab 2:19__NRHab/2/20\');">20__EN';
stringArray[19] = 'Where [are] the gods of __PNHamath_1__SHHamath</a> and __PNArphad_2__SHArphad</a>? where [are] the gods of __PNSepharvaim_3__SHSepharvaim</a>? __PNand_have_4__SHand have</a> they delivered Samaria out of my hand?__CPHamath_1__PSHamath__FFNum/34/8\');">Num 34:8__NB2Sa/8/9\');">2Sa 8:9__AN__GHArphad_2__PSArphad__FEThe variation of Arphad and Arpad exists only in the translation; the original being uniformly [ ( )]. __NAIsa/10/9\');">Isa 10:9__NBJer/49/23\');">Jer 49:23__AN; Arpad__GGSepharvaim_3__PSSepharvaim__EECalmet is of opinion that Sepharvaim was the capital of the Saspires, who, according to Herodotus, were the only people that inhabited between the Colchians and Medes; and probably the Sarapases, whom Strabo places in Armenia. Hiller considers the name as denoting Sephar of the Parvaim, i.e., Mount Sephar adjacent to the regions of Arabia called Parvaim. But it is more probable, as Wells and others suppose, that Sepharvaim is the [Sipphara] Sipphara, of Ptolemy, the [Sipparenon polis] the city of the Sippareni, mentioned by Abydenus, and probably the Hipparenum of Pliny, a city of Mesopotamia, situated upon the Euphrates, near where it is divided into two arms, by one of which, it is probable, it was divided into two parts. __NA2Ki/17/24\');">2Ki 17:24__AN__GHand_have_4__PSand have__EFIsa/10/10\');">Isa 10:10__NRIsa/10/11\');">11__NB2Ki/17/5\');">2Ki 17:5-7__NB2Ki/18/10\');">2Ki 18:10-12__EN';
stringArray[20] = 'Who [are they] among all the gods of these lands, that have delivered their land out of my hand, __PNthat_the_LORD_1__SHthat the LORD</a> should deliver Jerusalem out of my hand?__CPthat_the_LORD_1__PSthat the LORD__FFIsa/37/18\');">Isa 37:18__NRIsa/37/19\');">19__NRIsa/37/23\');">23-29__NBIsa/45/16\');">Isa 45:16__NRIsa/45/17\');">17__NBExd/5/2\');">Exd 5:2__NB2Ki/19/22\');">2Ki 19:22-37__NB2Ch/32/15\');">2Ch 32:15__NR2Ch/32/19\');">19__NBJob/15/25\');">Job 15:25__NRJob/15/26\');">26__NBJob/40/9\');">Job 40:9-12__NBPsa/50/21\');">Psa 50:21__NBPsa/73/9\');">Psa 73:9__NBDan/3/15\');">Dan 3:15__EN';
stringArray[21] = 'But they held their peace, and answered him not a word: for the king\'s commandment was, saying, Answer him not.__CPRelated_Verses1_1__PSEntire Verse.__FF2Ki/18/26\');">2Ki 18:26__NR2Ki/18/37\');">37__NBPsa/38/13\');">Psa 38:13-15__NBPsa/39/1\');">Psa 39:1__NBPro/9/7\');">Pro 9:7__NBPro/26/4\');">Pro 26:4__NBAmo/5/13\');">Amo 5:13__NBMat/7/6\');">Mat 7:6__EN';
stringArray[22] = 'Then came __PNEliakim_1__SHEliakim</a>, the son of Hilkiah, that [was] over the household, and Shebna the scribe, and Joah, the son of Asaph, the recorder, to Hezekiah __PNwith_their_2__SHwith [their]</a> clothes rent, and told him the words of Rabshakeh.__CPEliakim_1__PSEliakim__FFIsa/36/3\');">Isa 36:3__NRIsa/36/11\');">11__AN__GHwith_their_2__PSwith their__EFIsa/33/7\');">Isa 33:7__NBIsa/37/1\');">Isa 37:1__NRIsa/37/2\');">2__NB2Ki/5/7\');">2Ki 5:7__NBEzr/9/3\');">Ezr 9:3__NBMat/26/65\');">Mat 26:65__AN; The history of the invasion of Sennacherib, observes Bp. Lowth, and the miraculous destruction of his army, which makes the subject of so many of Isaiah\'s prophecies, is very properly inserted here, as affording the best light to many parts of these prophecies; and as almost necessary to introduce the prophecy in the 37th chapter, being the answer of God to Hezekiah\'s prayer, which could not be properly understood without it. Sennacherib succeeded his father Shalmaneser on the throne of Assyria, A.M. 3290, B.C. 714, and reigned only about eight years.</TD></TR>';
