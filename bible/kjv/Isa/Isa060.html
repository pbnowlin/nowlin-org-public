Text[1] = 'Arise, shine; for thy light is come, and the glory of the LORD is risen upon thee.';
Text[2] = 'For, behold, the darkness shall cover the earth, and gross darkness the people: but the LORD shall arise upon thee, and his glory shall be seen upon thee.';
