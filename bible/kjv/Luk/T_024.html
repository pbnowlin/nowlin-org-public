stringArray[13] = 'And, behold, __PNtwo_1__SHtwo</a> of them went that same day to a village called __PNEmmaus_2__SHEmmaus</a>, which was from Jerusalem [about] threescore furlongs.__CPtwo_1__PStwo__FFLuk/24/18\');">Luk 24:18__NBMar/16/12\');">Mar 16:12__NRMar/16/13\');">13__AN__GHEmmaus_2__PSEmmaus__FE"Emmaus was situated, according to the testimony both of Luke and Josephus, sixty furlongs from Jerusalem, that is, about seven miles and a half. It has generally been confounded with Emmaus, a city of Judah, afterwards called Nicopolis; but Reland has satisfactorily shown that they were distinct places; the latter, according to the old Itinerary of Palestine, being situated 10 miles from Lydda, and 22 miles from Jerusalem. D\'Arvieux states, that going from Jerusalem to Rama, he took the right from the high road to Rama, at some little distance from Jerusalem, and ""travelled a good league over rocks and flint stones, to the end of the valley of terebinthine trees,"" until he reached Emmaus; which ""seems, by the ruins which surround it, to have been formerly larger that it was in our Saviour\'s time. The Christians, while masters of the Holy Land, re-established it a little, and built several churches. Emmaus was not worth the trouble of having come out of the way to see it."""</TD></TR>';
