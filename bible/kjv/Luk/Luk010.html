Text[1] = 'After these things the Lord appointed other seventy also, and sent them two and two before his face into every city and place, whither he himself would come.';
Text[2] = 'Therefore said he unto them, The harvest truly [is] great, but the labourers [are] few: pray ye therefore the Lord of the harvest, that he would send forth labourers into his harvest.';
Text[3] = 'Go your ways: behold, I send you forth as lambs among wolves.';

Text[10] = 'But into whatsoever city ye enter, and they receive you not, go your ways out into the streets of the same, and say,';
Text[11] = 'Even the very dust of your city, which cleaveth on us, we do wipe off against you: notwithstanding be ye sure of this, that the kingdom of God is come nigh unto you.';
Text[12] = 'But I say unto you, that it shall be more tolerable in that day for Sodom, than for that city.';
Text[13] = 'Woe unto thee, Chorazin! woe unto thee, Bethsaida! for if the mighty works had been done in Tyre and Sidon, which have been done in you, they had a great while ago repented, sitting in sackcloth and ashes.';
Text[14] = 'But it shall be more tolerable for Tyre and Sidon at the judgment, than for you.';
Text[15] = 'And thou, Capernaum, which art exalted to heaven, shalt be thrust down to hell.';
Text[16] = 'He that heareth you heareth me; and he that despiseth you despiseth me; and he that despiseth me despiseth him that sent me.';
Text[17] = 'And the seventy returned again with joy, saying, Lord, even the devils are subject unto us through thy name.';
Text[18] = 'And he said unto them, I beheld Satan as lightning fall from heaven.';
Text[19] = 'Behold, I give unto you power to tread on serpents and scorpions, and over all the power of the enemy: and nothing shall by any means hurt you.';
Text[20] = 'Notwithstanding in this rejoice not, that the spirits are subject unto you; but rather rejoice, because your names are written in heaven.';
Text[21] = 'In that hour Jesus rejoiced in spirit, and said, I thank thee, O Father, Lord of heaven and earth, that thou hast hid these things from the wise and prudent, and hast revealed them unto babes: even so, Father; for so it seemed good in thy sight.';
Text[22] = 'All things are delivered to me of my Father: and no man knoweth who the Son is, but the Father; and who the Father is, but the Son, and [he] to whom the Son will reveal [him].';
Text[23] = 'And he turned him unto [his] disciples, and said privately, Blessed [are] the eyes which see the things that ye see:';
Text[24] = 'For I tell you, that many prophets and kings have desired to see those things which ye see, and have not seen [them]; and to hear those things which ye hear, and have not heard [them].';
Text[25] = 'And, behold, a certain lawyer stood up, and tempted him, saying, Master, what shall I do to inherit eternal life?';
Text[26] = 'He said unto him, What is written in the law? how readest thou?';
Text[27] = 'And he answering said, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy strength, and with all thy mind; and thy neighbour as thyself.';
Text[28] = 'And he said unto him, Thou hast answered right: this do, and thou shalt live.';
Text[29] = 'But he, willing to justify himself, said unto Jesus, And who is my neighbour?';
Text[30] = 'And Jesus answering said, A certain [man] went down from Jerusalem to Jericho, and fell among thieves, which stripped him of his raiment, and wounded [him], and departed, leaving [him] half dead.';
Text[31] = 'And by chance there came down a certain priest that way: and when he saw him, he passed by on the other side.';
Text[32] = 'And likewise a Levite, when he was at the place, came and looked [on him], and passed by on the other side.';
Text[33] = 'But a certain Samaritan, as he journeyed, came where he was: and when he saw him, he had compassion [on him],';
Text[34] = 'And went to [him], and bound up his wounds, pouring in oil and wine, and set him on his own beast, and brought him to an inn, and took care of him.';
Text[35] = 'And on the morrow when he departed, he took out two pence, and gave [them] to the host, and said unto him, Take care of him; and whatsoever thou spendest more, when I come again, I will repay thee.';
Text[36] = 'Which now of these three, thinkest thou, was neighbour unto him that fell among the thieves?';
Text[37] = 'And he said, He that shewed mercy on him. Then said Jesus unto him, Go, and do thou likewise.';
Text[38] = 'Now it came to pass, as they went, that he entered into a certain village: and a certain woman named Martha received him into her house.';
Text[39] = 'And she had a sister called Mary, which also sat at Jesus\' feet, and heard his word.';
Text[40] = 'But Martha was cumbered about much serving, and came to him, and said, Lord, dost thou not care that my sister hath left me to serve alone? bid her therefore that she help me.';
Text[41] = 'And Jesus answered and said unto her, Martha, Martha, thou art careful and troubled about many things:';
