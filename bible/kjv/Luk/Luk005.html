Text[1] = 'And it came to pass, that, as the people pressed upon him to hear the word of God, he stood by the lake of Gennesaret,';

Text[18] = 'And, behold, men brought in a bed a man which was taken with a palsy: and they sought [means] to bring him in, and to lay [him] before him.';

Text[20] = 'And when he saw their faith, he said unto him, Man, thy sins are forgiven thee.';
Text[21] = 'And the scribes and the Pharisees began to reason, saying, Who is this which speaketh blasphemies? Who can forgive sins, but God alone?';

Text[26] = 'And they were all amazed, and they glorified God, and were filled with fear, saying, We have seen strange things to day.';

Text[35] = 'But the days will come, when the bridegroom shall be taken away from them, and then shall they fast in those days.';
Text[36] = 'And he spake also a parable unto them; No man putteth a piece of a new garment upon an old; if otherwise, then both the new maketh a rent, and the piece that was [taken] out of the new agreeth not with the old.';
