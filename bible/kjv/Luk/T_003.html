stringArray[23] = 'And Jesus himself began to be about __PNthirty_1__SHthirty</a> years of age, __PNbeing_2__SHbeing</a> (as was supposed) the son of Joseph, __PNwhich_3__SHwhich</a> was [the son] of Heli,__CPthirty_1__PSthirty__FFGen/41/46\');">Gen 41:46__NBNum/4/3\');">Num 4:3__NRNum/4/35\');">35__NRNum/4/39\');">39__NRNum/4/43\');">43__NRNum/4/47\');">47__AN__GHbeing_2__PSbeing__EFLuk/4/22\');">Luk 4:22__NBMat/13/55\');">Mat 13:55__NBMar/6/3\');">Mar 6:3__NBJhn/6/42\');">Jhn 6:42__AN__GGwhich_3__PSwhich__EE"The real father of Joseph was Jacob (__NAMat/1/16\');">Mat 1:16__AN); but having married the daughter of Heli, and being perhaps adopted by him, he was called his son, and as such was entered in the public registers; Mary not being mentioned, because the Hebrews never permitted the name of a woman to enter the genealogical tables, but inserted her husband as the son of him who was, in reality, but his father-in-law. Hence it appears that Matthew, who wrote principally for the Jews, traces the pedigree of Jesus Christ from Abraham, through whom the promises were given to the Jews, to David, and from David, through the line of Solomon, to Jacob the father of Joseph, the reputed or legal father of Christ; and that Luke, who wrote for the Gentiles, extends his genealogy upwards from Heli, the father of Mary, through the line of Nathan, to David, and from David to Abraham, and from Abraham to Adam, who was the immediate ""son of God"" by creation, and to whom the promise of the Saviour was given in behalf of himself and all his posterity"</TD></TR>';
