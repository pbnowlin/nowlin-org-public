stringArray[29] = 'For, behold, __PNthe_days_1__SHthe days</a> are coming, in the which they shall say, __PNBlessed_2__SHBlessed</a> [are] the barren, and the wombs that never bare, and the paps which never gave suck.__CPthe_days_1__PSthe days__EE"Our LORD here refers to the destruction of Jerusalem, and the final desolation of the Jewish state; an evil associated with so many miseries, that sterility, which had otherwise been considered an opprobrium, was accounted a circumstance most felicitous. No history can furnish us with a parallel to the calamities and miseries of the Jews; rapine and murder, famine and pestilence, within; fire and sword, and all the terrors of war, without. Our Saviour himself wept at the foresight of these calamities; and it is almost impossible for persons of any humanity to read the relation of them in Josephus without weeping also. He might justly affirm, ""if the misfortunes of all, from the beginning of the world, were compared with those of the Jews, they would appear much inferior in the comparison."" __NALuk/21/23\');">Luk 21:23__NRLuk/21/24\');">24__NBMat/24/19\');">Mat 24:19__NBMar/13/17\');">Mar 13:17-19__AN"__GHBlessed_2__PSBlessed__EFDeu/28/53\');">Deu 28:53-57__NBHsa/9/12\');">Hsa 9:12-16__NBHsa/13/16\');">Hsa 13:16__EN';
