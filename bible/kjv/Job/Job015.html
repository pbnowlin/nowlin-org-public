Text[1] = 'Then answered Eliphaz the Temanite, and said,';
Text[2] = 'Should a wise man utter vain knowledge, and fill his belly with the east wind?';

Text[13] = 'That thou turnest thy spirit against God, and lettest [such] words go out of thy mouth?';
Text[14] = 'What [is] man, that he should be clean? and [he which is] born of a woman, that he should be righteous?';

Text[22] = 'He believeth not that he shall return out of darkness, and he is waited for of the sword.';
Text[23] = 'He wandereth abroad for bread, [saying], Where [is it]? he knoweth that the day of darkness is ready at his hand.';
Text[24] = 'Trouble and anguish shall make him afraid; they shall prevail against him, as a king ready to the battle.';
Text[25] = 'For he stretcheth out his hand against God, and strengtheneth himself against the Almighty.';
Text[26] = 'He runneth upon him, [even] on [his] neck, upon the thick bosses of his bucklers:';

Text[28] = 'And he dwelleth in desolate cities, [and] in houses which no man inhabiteth, which are ready to become heaps.';
Text[29] = 'He shall not be rich, neither shall his substance continue, neither shall he prolong the perfection thereof upon the earth.';
Text[30] = 'He shall not depart out of darkness; the flame shall dry up his branches, and by the breath of his mouth shall he go away.';
Text[31] = 'Let not him that is deceived trust in vanity: for vanity shall be his recompence.';
