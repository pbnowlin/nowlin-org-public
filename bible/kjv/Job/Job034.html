Text[1] = 'Furthermore Elihu answered and said,';
Text[2] = 'Hear my words, O ye wise [men]; and give ear unto me, ye that have knowledge.';
Text[3] = 'For the ear trieth words, as the mouth tasteth meat.';
Text[4] = 'Let us choose to us judgment: let us know among ourselves what [is] good.';

Text[6] = 'Should I lie against my right? my wound [is] incurable without transgression.';

Text[9] = 'For he hath said, It profiteth a man nothing that he should delight himself with God.';
Text[10] = 'Therefore hearken unto me, ye men of understanding: far be it from God, [that he should do] wickedness; and [from] the Almighty, [that he should commit] iniquity.';
Text[11] = 'For the work of a man shall he render unto him, and cause every man to find according to [his] ways.';
Text[12] = 'Yea, surely God will not do wickedly, neither will the Almighty pervert judgment.';
Text[13] = 'Who hath given him a charge over the earth? or who hath disposed the whole world?';
Text[14] = 'If he set his heart upon man, [if] he gather unto himself his spirit and his breath;';
Text[15] = 'All flesh shall perish together, and man shall turn again unto dust.';
Text[16] = 'If now [thou hast] understanding, hear this: hearken to the voice of my words.';
Text[17] = 'Shall even he that hateth right govern? and wilt thou condemn him that is most just?';
Text[18] = '[Is it fit] to say to a king, [Thou art] wicked? [and] to princes, [Ye are] ungodly?';
Text[19] = '[How much less to him] that accepteth not the persons of princes, nor regardeth the rich more than the poor? for they all [are] the work of his hands.';
Text[20] = 'In a moment shall they die, and the people shall be troubled at midnight, and pass away: and the mighty shall be taken away without hand.';
Text[21] = 'For his eyes [are] upon the ways of man, and he seeth all his goings.';
Text[22] = '[There is] no darkness, nor shadow of death, where the workers of iniquity may hide themselves.';
Text[23] = 'For he will not lay upon man more [than right]; that he should enter into judgment with God.';
Text[24] = 'He shall break in pieces mighty men without number, and set others in their stead.';
Text[25] = 'Therefore he knoweth their works, and he overturneth [them] in the night, so that they are destroyed.';
Text[26] = 'He striketh them as wicked men in the open sight of others;';
Text[27] = 'Because they turned back from him, and would not consider any of his ways:';
Text[28] = 'So that they cause the cry of the poor to come unto him, and he heareth the cry of the afflicted.';
Text[29] = 'When he giveth quietness, who then can make trouble? and when he hideth [his] face, who then can behold him? whether [it be done] against a nation, or against a man only:';
Text[30] = 'That the hypocrite reign not, lest the people be ensnared.';
Text[31] = 'Surely it is meet to be said unto God, I have borne [chastisement], I will not offend [any more]:';
Text[32] = '[That which] I see not teach thou me: if I have done iniquity, I will do no more.';
Text[33] = '[Should it be] according to thy mind? he will recompense it, whether thou refuse, or whether thou choose; and not I: therefore speak what thou knowest.';
Text[34] = 'Let men of understanding tell me, and let a wise man hearken unto me.';
Text[35] = 'Job hath spoken without knowledge, and his words [were] without wisdom.';
