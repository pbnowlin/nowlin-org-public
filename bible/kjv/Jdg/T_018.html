<script type="text/javascript">
var stringArray = new Array();
stringArray[1] = 'In those days [there was] __PNno_king_1__SHno king</a> in Israel: and in those days __PNthe_tribe_2__SHthe tribe</a> of the Danites sought them an inheritance to dwell in; __PNfor_unto_3__SHfor unto</a> that day [all their] inheritance had not fallen unto them among the tribes of Israel.__CPno_king_1__PSno king__EEThe word mailech, which generally means a king, is sometimes taken for a supreme ruler, governor, or judge (see __NAGen/36/31\');">Gen 36:31__NBDeu/33/5\');">Deu 33:5__AN;) and it is probable it should be so understood here, and in the parallel passages. __NAJdg/17/6\');">Jdg 17:6__NBJdg/19/1\');">Jdg 19:1__NBJdg/21/25\');">Jdg 21:25__AN__GHthe_tribe_2__PSthe tribe__EFJos/19/40\');">Jos 19:40-48__AN__GGfor_unto_3__PSfor unto__FFJdg/1/34\');">Jdg 1:34__EN';
stringArray[2] = 'And the children of Dan sent of their family five __PNmen_1__SHmen</a> from their coasts, men of valour, from __PNZorah_2__SHZorah</a>, and from Eshtaol, __PNto_spy_3__SHto spy</a> out the land, and to search it; and they said unto them, Go, search the land: who when they came to __PNmount_4__SHmount</a> Ephraim, to the house of Micah, they lodged there.__CPmen_1__PSmen__EEHeb. sons.__GHZorah_2__PSZorah__EFJdg/18/8\');">Jdg 18:8__NRJdg/18/11\');">11__NBJdg/13/2\');">Jdg 13:2__NRJdg/13/25\');">25__NBJdg/16/31\');">Jdg 16:31__NBGen/42/9\');">Gen 42:9__NBJos/19/41\');">Jos 19:41__AN__GGto_spy_3__PSto spy__FFNum/13/17\');">Num 13:17__NBJos/2/1\');">Jos 2:1__NBPro/20/18\');">Pro 20:18__NBLuk/14/31\');">Luk 14:31__AN__GHmount_4__PSmount__EFJdg/17/1\');">Jdg 17:1__NBJdg/19/1\');">Jdg 19:1__NRJdg/19/18\');">18__NBJos/17/15\');">Jos 17:15-18__EN';
stringArray[3] = 'When they [were] by the house of Micah, __PNthey_knew_1__SHthey knew</a> the voice of the young man the Levite: and they turned in thither, and said unto him, Who brought thee hither? and what makest thou in this [place]? __PNand_what_hast_2__SHand what hast</a> thou here?__CPthey_knew_1__PSthey knew__EEThey knew by his dialect or mode of pronunciation, that he was not an Ephraimite: see the parallel texts. __NAJdg/12/6\');">Jdg 12:6__NBGen/27/22\');">Gen 27:22__NBMat/26/73\');">Mat 26:73__AN__GHand_what_hast_2__PSand what hast__EFIsa/22/16\');">Isa 22:16__EN';
stringArray[4] = 'And he said unto them, Thus and thus dealeth Micah with me, and hath __PNhired_me_1__SHhired me</a>, and I am his priest.__CPhired_me_1__PShired me__FFJdg/17/10\');">Jdg 17:10__NBPro/28/21\');">Pro 28:21__NBIsa/56/11\');">Isa 56:11__NBEze/13/19\');">Eze 13:19__NBHsa/4/8\');">Hsa 4:8__NRHsa/4/9\');">9__NBMal/1/10\');">Mal 1:10__NBJhn/10/12\');">Jhn 10:12__NRJhn/10/13\');">13__NBAct/8/18\');">Act 8:18-21__NBAct/20/33\');">Act 20:33__NB1Ti/3/3\');">1Ti 3:3__NBTts/1/11\');">Tts 1:11__NB2Pe/2/3\');">2Pe 2:3__NR2Pe/2/14\');">14__NR2Pe/2/15\');">15__EN';
stringArray[5] = 'And they said unto him, __PNAsk_counsel_1__SHAsk counsel</a>, we pray thee, __PNof_God_2__SHof God</a>, that we may know whether our way which we go shall be prosperous.__CPAsk_counsel_1__PSAsk counsel__FF1Ki/22/5\');">1Ki 22:5__NB2Ki/16/15\');">2Ki 16:15__NBIsa/30/1\');">Isa 30:1__NBEze/21/21\');">Eze 21:21__NBHsa/4/12\');">Hsa 4:12__NBAct/8/10\');">Act 8:10__AN__GHof_God_2__PSof God__EFJdg/18/14\');">Jdg 18:14__NBJdg/17/5\');">Jdg 17:5__NRJdg/17/13\');">13__EN';
stringArray[6] = 'And the priest said unto them, __PNGo_in_peace_1__SHGo in peace</a>: __PNbefore_2__SHbefore</a> __PNthe_LORD_3__SHthe LORD</a> [is] your way wherein ye go.__CPGo_in_peace_1__PSGo in peace__FF1Ki/22/6\');">1Ki 22:6__NR1Ki/22/12\');">12__NR1Ki/22/15\');">15__NBJer/23/21\');">Jer 23:21__NRJer/23/22\');">22__NRJer/23/32\');">32__AN__GHbefore_2__PSbefore__EFDeu/11/12\');">Deu 11:12__NBPsa/33/18\');">Psa 33:18__NB1Th/3/11\');">1Th 3:11__AN__GGthe_LORD_3__PSthe LORD__EEAs the Levite uses the word Jehovah, and as the Danites succeeded according to the oracle delivered by him, some learned men are of opinion, that the worship established by Micah was not of an idolatrous kind.</TD></TR>';
stringArray[7] = 'Then the five men departed, and came to __PNLaish_1__SHLaish</a>, and saw the people that [were] therein, __PNhow_they_2__SHhow they</a> dwelt careless, after the manner of the Zidonians, quiet and secure; and [there was] no __PNmagistrate_3__SHmagistrate</a> in the land, that might put [them] to shame in [any] thing; and they [were] far from the Zidonians, __PNand_had_no_4__SHand had no</a> business with [any] man.__CPLaish_1__PSLaish__FFJos/19/47\');">Jos 19:47__AN; called Leshem.__GHhow_they_2__PShow they__EFJdg/18/27\');">Jdg 18:27__NRJdg/18/28\');">28__NBRev/18/7\');">Rev 18:7__AN__GGmagistrate_3__PSmagistrate__EEHeb. possessor, or, heir of restraint. __NA1Sa/3/13\');">1Sa 3:13__NB1Ki/1/6\');">1Ki 1:6__NBRom/13/3\');">Rom 13:3__NB1Pe/2/14\');">1Pe 2:14__AN__GHand_had_no_4__PSand had no__FE"In the most correct copies of the LXX. this clause stands thus; [kai logos ouk en autois meta Syrias;] ""and they had no transactions with Syria;"" evidently reading instead of [ ( )] adam, man, [ ( )] aram, Syria; words so nearly similar that the only difference between them is in the [Rêysh] raish, and [Dâleth] daleth, which in both MSS. and printed books is sometimes indiscernible. Laish was situated on the frontiers of Syria."</TD></TR>';
stringArray[8] = 'And they came unto their brethren to __PNZorah_and_Eshtaol_1__SHZorah and Eshtaol</a>: and their brethren said unto them, What [say] ye?__CPZorah_and_Eshtaol_1__PSZorah and Eshtaol__FFJdg/18/2\');">Jdg 18:2__NRJdg/18/11\');">11__NBJdg/13/2\');">Jdg 13:2__NBJdg/16/31\');">Jdg 16:31__EN';
stringArray[9] = 'And they said, __PNArise_1__SHArise</a>, that we may go up against them: for we have seen the land, and, behold, it [is] very good: and __PNare_ye_still_2__SH[are] ye still</a>? __PNbe_not_3__SHbe not</a> slothful to go, [and] to enter to possess the land.__CPArise_1__PSArise__FFNum/13/30\');">Num 13:30__NBNum/14/7\');">Num 14:7-9__NBJos/2/23\');">Jos 2:23__NRJos/2/24\');">24__AN__GHare_ye_still_2__PSare ye still__EF1Ki/22/23\');">1Ki 22:23__AN__GGbe_not_3__PSbe not__FFJos/18/3\');">Jos 18:3__NB1Sa/4/9\');">1Sa 4:9__NB2Sa/10/12\');">2Sa 10:12__NBJhn/6/27\');">Jhn 6:27__NBHbr/6/11\');">Hbr 6:11__NRHbr/6/12\');">12__NB2Pe/1/10\');">2Pe 1:10__NR2Pe/1/11\');">11__EN';
stringArray[10] = 'When ye go, ye shall come unto a people __PNsecure_1__SHsecure</a>, and to a large land: for __PNGod_hath_2__SHGod hath</a> given it into your hands; a place __PNwhere_there_3__SHwhere [there</a> is] no want of any thing that [is] in the earth.__CPsecure_1__PSsecure__FFJdg/18/7\');">Jdg 18:7__NRJdg/18/27\');">27__AN__GHGod_hath_2__PSGod hath__EFDeu/2/29\');">Deu 2:29__NBDeu/4/1\');">Deu 4:1__NBJos/6/16\');">Jos 6:16__AN__GGwhere_there_3__PSwhere there__FFExd/3/8\');">Exd 3:8__NBDeu/8/7\');">Deu 8:7-9__NBDeu/11/11\');">Deu 11:11__NRDeu/11/12\');">12__NBEze/20/6\');">Eze 20:6__NB1Ti/6/17\');">1Ti 6:17__EN';
stringArray[11] = 'And there went from thence of the family of the Danites, out of Zorah and out of Eshtaol, six hundred men __PNappointed_1__SHappointed</a> with weapons of war.__CPappointed_1__PSappointed__EEHeb. girded.</TD></TR>';
stringArray[12] = 'And they went up, and pitched in __PNKirjath_jearim_1__SHKirjathjearim</a>, in Judah: wherefore they called that place __PNMahaneh_dan_2__SHMahanehdan</a> unto this day: behold, [it is] behind Kirjathjearim.__CPKirjath_jearim_1__PSKirjath-jearim__EEA city of Judah, on the confines of Benjamin; distant nine miles from Ælia or Jerusalem, in going towards Diospolis or Lydda, according to Eusebius. __NAJos/15/60\');">Jos 15:60__NB1Sa/7/1\');">1Sa 7:1__NB1Ch/13/5\');">1Ch 13:5__NR1Ch/13/6\');">6__NB2Ch/1/4\');">2Ch 1:4__AN__GHMahaneh_dan_2__PSMahaneh-dan__EFJdg/13/25\');">Jdg 13:25__AN; *marg:</TD></TR>';
stringArray[13] = 'And they passed thence unto __PNmount_Ephraim_1__SHmount Ephraim</a>, and came unto the house of Micah.__CPmount_Ephraim_1__PSmount Ephraim__FFJdg/18/2\');">Jdg 18:2__NRJdg/18/3\');">3__NBJdg/17/1\');">Jdg 17:1__NBJdg/19/1\');">Jdg 19:1__NBJos/24/30\');">Jos 24:30__NRJos/24/33\');">33__EN';
stringArray[14] = '__PNThen_1__SHThen</a> answered the five men that went to spy out the country of Laish, and said unto their brethren, Do ye know that there is __PNin_these_2__SHin these</a> houses an ephod, and teraphim, and a graven image, and a molten image? __PNnow_therefore_3__SHnow therefore</a> consider what ye have to do.__CPThen_1__PSThen__FF1Sa/14/28\');">1Sa 14:28__AN__GHin_these_2__PSin these__EFJdg/18/3\');">Jdg 18:3__NRJdg/18/4\');">4__NBJdg/17/5\');">Jdg 17:5__AN__GGnow_therefore_3__PSnow therefore__FFPro/19/27\');">Pro 19:27__NBIsa/8/19\');">Isa 8:19__NRIsa/8/20\');">20__EN';
stringArray[15] = 'And they turned thitherward, and came to the house of the young man the Levite, [even] unto the house of Micah, and __PNsaluted_him_1__SHsaluted him</a>.__CPsaluted_him_1__PSsaluted him__EEHeb. asked him of peace. __NAGen/37/14\');">Gen 37:14__NBGen/43/27\');">Gen 43:27__NB1Sa/17/22\');">1Sa 17:22__AN; *marg:; __NA2Ki/4/26\');">2Ki 4:26__NBMat/10/12\');">Mat 10:12__NRMat/10/13\');">13__NBLuk/10/4\');">Luk 10:4-6__NBJhn/14/27\');">Jhn 14:27__EN';
stringArray[16] = 'And the __PNsix_hundred_1__SHsix hundred</a> men appointed with their weapons of war, which [were] of the children of Dan, stood by the entering of the gate.__CPsix_hundred_1__PSsix hundred__FFJdg/18/11\');">Jdg 18:11__EN';
stringArray[17] = 'And the __PNfive_men_1__SHfive men</a> that went to spy out the land went up, [and] came in thither, [and] took __PNthe_graven_2__SHthe graven</a> image, and the ephod, and the teraphim, and the molten image: and the priest stood in the entering of the gate with the six hundred men [that were] appointed with weapons of war.__CPfive_men_1__PSfive men__FFJdg/18/2\');">Jdg 18:2__NRJdg/18/14\');">14__AN__GHthe_graven_2__PSthe graven__EFJdg/6/31\');">Jdg 6:31__NBJdg/17/4\');">Jdg 17:4__NRJdg/17/5\');">5__NBExd/32/20\');">Exd 32:20__NB1Sa/4/11\');">1Sa 4:11__NB1Sa/6/2\');">1Sa 6:2-9__NB2Ki/19/18\');">2Ki 19:18__NR2Ki/19/19\');">19__NBIsa/46/1\');">Isa 46:1__NRIsa/46/2\');">2__NRIsa/46/7\');">7__EN';
stringArray[18] = 'And these went into Micah\'s house, and fetched the carved image, the ephod, and the teraphim, and the molten image. Then said the priest unto them, What do ye?__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[19] = 'And they said unto him, Hold thy peace, __PNlay_thine_1__SHlay thine</a> hand upon thy mouth, and go with us, and be to us __PNa_father_2__SHa father</a> and a priest: [is it] better for thee to be a priest unto the house of one man, or that thou be a priest unto a tribe and a family in Israel?__CPlay_thine_1__PSlay thine__EEThis was the token of silence. These men were evidently very ignorant; and absurdly concluded that they should, by taking Micah\'s gods, secure the presence and favour of the God of Israel, in their expedition and settlement. They perhaps supposed the piety of their motives, and the goodness of their end, would justify the means. But it was a base robbery of Micah, aggravated by the Levite\'s ingratitude, and their menaces. __NAJob/21/5\');">Job 21:5__NBJob/29/9\');">Job 29:9__NBJob/40/4\');">Job 40:4__NRJob/40/5\');">5__NBPro/30/32\');">Pro 30:32__NBMic/7/16\');">Mic 7:16__AN__GHa_father_2__PSa father__EFJdg/17/10\');">Jdg 17:10__NB2Ki/6/21\');">2Ki 6:21__NB2Ki/8/8\');">2Ki 8:8__NR2Ki/8/9\');">9__NB2Ki/13/14\');">2Ki 13:14__NBMat/23/9\');">Mat 23:9__EN';
stringArray[20] = 'And the priest\'s __PNheart_1__SHheart</a> was glad, and he took the ephod, and the teraphim, and the graven image, and __PNwent_2__SHwent</a> in the midst of the people.__CPheart_1__PSheart__FFJdg/17/10\');">Jdg 17:10__NBPro/30/15\');">Pro 30:15__NBIsa/56/11\');">Isa 56:11__NBEze/13/19\');">Eze 13:19__NBHsa/4/3\');">Hsa 4:3__NBAct/20/33\');">Act 20:33__NBPhl/3/19\');">Phl 3:19__NB2Pe/2/3\');">2Pe 2:3__NR2Pe/2/15\');">15__NR2Pe/2/16\');">16__AN__GHwent_2__PSwent__FEHe was glad of his preferment among the Danites; and went into the crowd, that he might not be discovered by Micah or his family.</TD></TR>';
stringArray[21] = 'So they turned and departed, __PNand_put_1__SHand put</a> the little ones and the cattle and __PNthe_carriage_2__SHthe carriage</a> before them.__CPand_put_1__PSand put__EEThese men were so confident of success, that they removed their whole families, household goods, cattle, and all.__GHthe_carriage_2__PSthe carriage__FEKevoodah, from kavad, to be heavy, denotes the luggage or baggage.</TD></TR>';
stringArray[22] = '[And] when they were a good way from the house of Micah, the men that [were] in the houses near to Micah\'s house were gathered together, and overtook the children of Dan.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[23] = 'And they cried unto the children of Dan. And they turned their faces, and said unto Micah, __PNWhat_aileth_1__SHWhat aileth</a> thee, that thou __PNcomest_2__SHcomest</a> with such a company?__CPWhat_aileth_1__PSWhat aileth__FFGen/21/17\');">Gen 21:17__NB1Sa/11/5\');">1Sa 11:5__NB2Sa/14/5\');">2Sa 14:5__NB2Ki/6/28\');">2Ki 6:28__NBPsa/114/5\');">Psa 114:5__NBIsa/22/1\');">Isa 22:1__AN__GHcomest_2__PScomest__FEHeb. art gathered together.</TD></TR>';
stringArray[24] = 'And he said, Ye have taken away my gods which I made, and the priest, and ye are gone away: and __PNwhat_have_1__SHwhat have</a> I more? and what [is] this [that] ye say unto me, What aileth thee?__CPwhat_have_1__PSwhat have__FFJdg/17/13\');">Jdg 17:13__NBPsa/115/8\');">Psa 115:8__NBIsa/44/18\');">Isa 44:18-20__NBJer/50/38\');">Jer 50:38__NBJer/51/17\');">Jer 51:17__NBEze/23/5\');">Eze 23:5__NBHab/2/18\');">Hab 2:18__NRHab/2/19\');">19__NBAct/19/26\');">Act 19:26__NBRev/17/2\');">Rev 17:2__EN';
stringArray[25] = 'And the children of Dan said unto him, Let not thy voice be heard among us, lest __PNangry_1__SHangry</a> fellows run upon thee, and thou lose thy life, with the lives of thy household.__CPangry_1__PSangry__EEHeb. bitter of soul. __NA1Sa/30/6\');">1Sa 30:6__NB2Sa/17/8\');">2Sa 17:8__NBJob/3/5\');">Job 3:5__NBJob/27/2\');">Job 27:2__AN; *marg:</TD></TR>';
stringArray[26] = 'And the children of Dan went their way: and when Micah saw that they [were] too strong for him, he turned and went back unto his house.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[27] = 'And they took [the things] which Micah had made, and the priest which he had, and came unto __PNLaish_1__SHLaish</a>, unto a people [that were] at quiet and secure: and __PNthey_smote_2__SHthey smote</a> them with the edge of the sword, and __PNburnt_3__SHburnt</a> the city with fire.__CPLaish_1__PSLaish__FFJdg/18/7\');">Jdg 18:7__NRJdg/18/10\');">10__AN__GHthey_smote_2__PSthey smote__EFDeu/33/22\');">Deu 33:22__NBJos/19/47\');">Jos 19:47__AN__GGburnt_3__PSburnt__FFJos/11/11\');">Jos 11:11__EN';
stringArray[28] = '__PNAnd_there_1__SHAnd [there</a> was] no deliverer, because it [was] __PNfar_from_2__SHfar from</a> Zidon, and they had no business with [any] man; and it was in the valley that [lieth] by __PNBeth_rehob_3__SHBethrehob</a>. And they built a city, and dwelt therein.__CPAnd_there_1__PSAnd there__FF2Sa/14/6\');">2Sa 14:6__AN; *marg:; __NAPsa/7/2\');">Psa 7:2__NBPsa/50/22\');">Psa 50:22__NBDan/3/15\');">Dan 3:15-17__AN__GHfar_from_2__PSfar from__FEProbably the people of Laish were originally a colony of the Zidonians; who being an opulent people, and in possession of a strong city, lived in a state of security, not being afraid of their neighbours. In this the Leshemites imitated them, though they appear not to have had the same reason for their confidence; and though they might naturally expect help from their countrymen, yet as they lived at a considerable distance from Sidon, the Danites saw they could strike the blow before the news of the invasion could reach that city. __NAJdg/18/1\');">Jdg 18:1__NRJdg/18/7\');">7__NBJos/11/8\');">Jos 11:8__NBIsa/23/4\');">Isa 23:4__NRIsa/23/12\');">12__AN__GGBeth_rehob_3__PSBeth-rehob__FFNum/13/21\');">Num 13:21__AN; Rehob. __NA2Sa/10/6\');">2Sa 10:6__EN';
stringArray[29] = 'And they called the name of the city __PNDan_1__SHDan</a>, after the name of Dan their father, __PNwho_was_2__SHwho was</a> born unto Israel: howbeit the name of the city [was] Laish at the first.__CPDan_1__PSDan__FFJdg/20/1\');">Jdg 20:1__NBGen/14/14\');">Gen 14:14__NBJos/19/47\');">Jos 19:47__NB2Sa/17/11\');">2Sa 17:11__NB1Ki/12/29\');">1Ki 12:29__NR1Ki/12/30\');">30__NB1Ki/15/20\');">1Ki 15:20__AN__GHwho_was_2__PSwho was__EFGen/30/6\');">Gen 30:6__NBGen/32/28\');">Gen 32:28__AN; Laish, or Dan, was situated at the northern extremity of the land of Canaan, in a beautiful and fertile plain, at the foot of mount Lebanon, on the springs of Jordan, and, according to Eusebius, four miles from Cæsarea Philippi, or Paneas, now Banias, (with which some have confounded it,) towards Tyre. Burckhardt says, that the source of the river El Dhan, or Jordan, is at an hour\'s distance from Banias, which agrees with Eusebius.</TD></TR>';
stringArray[30] = 'And the children of Dan __PNset_up_1__SHset up</a> the graven image: and Jonathan, the son of Gershom, the son of Manasseh, he and his sons were priests to the tribe of Dan __PNuntil_2__SHuntil</a> the day of the captivity of __PNthe_land_3__SHthe land</a>.__CPset_up_1__PSset up__FFExd/20/4\');">Exd 20:4__NBLev/26/1\');">Lev 26:1__NBDeu/17/2\');">Deu 17:2-7__NBDeu/27/15\');">Deu 27:15__NBDeu/31/16\');">Deu 31:16__NRDeu/31/29\');">29__NBJos/19/40\');">Jos 19:40-48__NBPsa/78/58\');">Psa 78:58-61__AN; God had graciously performed his promise, in putting these Danites in possession of that which fell to their lot, obliging them thereby to be faithful to him who had been so to them; they inherited the labour of the people, that they might observe his statues. __NAPsa/105/44\');">Psa 105:44__NRPsa/105/45\');">45__AN. But the first thing they do after they are settled is to break his laws, by setting up the graven image, attributing their success to that idol, which, if God had not been infinitely patient, would have been their ruin. Thus a prosperous idolater goes on to offend, imputing this his power unto his God. Instead of Manasseh, some would read Moses; as it is found in some MSS., in the Vulgate and in the concessions of the most intelligent Jews. But Bp. Patrick takes this to be an idle conceit of the Rabbins, and supposes this Jonathan to be of some other family of the Levites. Yet Kimchi acknowledges, that the Jews, deeply concerned for the honour of their la__GHuntil_2__PSuntil__EFJdg/13/1\');">Jdg 13:1__NB1Sa/4/2\');">1Sa 4:2__NR1Sa/4/3\');">3__NR1Sa/4/10\');">10__NR1Sa/4/11\');">11__NBPsa/78/60\');">Psa 78:60-62__AN__GGthe_land_3__PSthe land__EE"Houbigant contends, that, instead of haäretz, ""the land,"" we should read haäron, ""the ark;"" for the [Vâv] wav, and [Nûwn, noon final, might easily be mistaken for [Tsâdêy] tzadday final; which is the only difference between the two words. This conjecture is the more likely, as the next verse tells us, that Micah\'s graven image continued at Dan ""all the time that the house of God was at Shiloh;"" which was till the ark was taken by the Philistines."</TD></TR>';
stringArray[31] = 'And they set them up Micah\'s graven image, which he made, __PNall_the_time_1__SHall the time</a> that the house of God was in Shiloh.__CPall_the_time_1__PSall the time__FFJdg/19/18\');">Jdg 19:18__NBJdg/21/21\');">Jdg 21:21__NBJos/18/1\');">Jos 18:1__NB1Sa/1/3\');">1Sa 1:3__NB1Sa/4/4\');">1Sa 4:4__NBJer/7/12\');">Jer 7:12__EN';

</script>
