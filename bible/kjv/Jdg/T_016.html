var stringArray = new Array();
stringArray[1] = 'Then went Samson to __PNGaza_1__SHGaza</a>, and saw there __PNan_harlot_2__SHan harlot</a>, and went in unto her.__CPGaza_1__PSGaza__EEGaza, a city of great antiquity, was situated between Raphia and Askelon, twenty-two miles north of the former, and sixteen south of of the latter, according to the Antonine Itinerary; three miles from the sea, according to Arrian, and thirty-four from Ashdod or Azotus, according to Diodorus Siculus. It was a place of great strength and importance; and successively belonged to the Philistines, Hebrews, Chaldeans, and Persians; which latter defended it for two months against Alexander the great, who finally took and destroyed it. It was afterwards rebuilt, and alternately possessed by the Egyptians, Syrians, and Jews. The present town, which the Arabs call Razza, is situated on an eminence, and is rendered picturesque by the number of fine minarets which rise majestically above the buildings, with beautiful date trees interspersed. It contains upwards of 2,000 inhabitants. __NAGen/10/19\');">Gen 10:19__NBJos/15/47\');">Jos 15:47__AN__GHan_harlot_2__PSan harlot__FEHeb. a woman an harlot. and went __NAGen/38/16\');">Gen 38:16-18__NBEzr/9/1\');">Ezr 9:1__NREzr/9/2\');">2__EN';

stringArray[3] = 'And Samson lay till midnight, and arose at midnight, and __PNtook_1__SHtook</a> the doors of the gate of the city, and the two posts, and went away with them, __PNbar_and_all_2__SHbar and all</a>, and put [them] upon his shoulders, and carried them up to the top of an hill that [is] before Hebron.__CPtook_1__PStook__FFPsa/107/16\');">Psa 107:16__NBIsa/63/1\');">Isa 63:1-5__NBMic/2/13\');">Mic 2:13__NBAct/2/24\');">Act 2:24__AN__GHbar_and_all_2__PSbar and all__FEHeb. with the bar.</TD></TR>';
stringArray[4] = 'And it came to pass afterward, that __PNhe_loved_1__SHhe loved</a> a woman __PNin_the_valley_2__SHin the valley</a> of Sorek, whose name [was] Delilah.__CPhe_loved_1__PShe loved__FF1Ki/11/1\');">1Ki 11:1__NBNeh/13/26\');">Neh 13:26__NBPro/22/14\');">Pro 22:14__NBPro/23/27\');">Pro 23:27__NBPro/26/11\');">Pro 26:11__NBPro/27/22\');">Pro 27:22__NB1Cr/10/6\');">1Cr 10:6__AN__GHin_the_valley_2__PSin the valley__FEor, by the brook.</TD></TR>';
stringArray[5] = 'And __PNthe_lords_1__SHthe lords</a> of the Philistines came up unto her, and said unto her, __PNEntice_2__SHEntice</a> him, and see wherein his great strength [lieth], and by what [means] we may prevail against him, that we may bind him to __PNafflict_3__SHafflict</a> him: and __PNwe_will_4__SHwe will</a> give thee every one of us eleven hundred [pieces] of silver.__CPthe_lords_1__PSthe lords__FFJdg/3/3\');">Jdg 3:3__NBJos/13/3\');">Jos 13:3__NB1Sa/29/6\');">1Sa 29:6__AN__GHEntice_2__PSEntice__EFJdg/14/15\');">Jdg 14:15__NBPro/2/16\');">Pro 2:16-19__NBPro/5/3\');">Pro 5:3-11__NBPro/6/24\');">Pro 6:24-26__NBPro/7/21\');">Pro 7:21-27__NB1Cr/6/15\');">1Cr 6:15-18__AN__GGafflict_3__PSafflict__EEor, humble.__GHwe_will_4__PSwe will__EFJdg/17/2\');">Jdg 17:2__NBGen/33/16\');">Gen 33:16__NBNum/22/17\');">Num 22:17__NRNum/22/18\');">18__NBMic/7/3\');">Mic 7:3__NBMat/26/15\');">Mat 26:15__NB1Ti/6/9\');">1Ti 6:9__NR1Ti/6/10\');">10__EN';
stringArray[6] = 'And Delilah said to Samson, Tell me, I pray thee, wherein thy great strength [lieth], and wherewith thou mightest be bound to afflict thee.__CPRelated_Verses1_1__PSEntire Verse.__FFPsa/12/2\');">Psa 12:2__NBPro/6/26\');">Pro 6:26__NBPro/7/21\');">Pro 7:21__NBPro/22/14\');">Pro 22:14__NBPro/26/28\');">Pro 26:28__NBJer/9/2\');">Jer 9:2-5__NBMic/7/2\');">Mic 7:2__NRMic/7/5\');">5__EN';

stringArray[8] = 'Then the lords of the Philistines brought up to her seven green withs which had not been dried, and she __PNbound_him_1__SHbound him</a> with them.__CPbound_him_1__PSbound him__FFEcc/7/26\');">Ecc 7:26__EN';
stringArray[9] = 'Now [there were] men lying in wait, abiding with her in the chamber. And she said unto him, The Philistines [be] upon thee, Samson. And he brake the withs, as a thread of tow is broken when it __PNtoucheth_1__SHtoucheth</a> the fire. So his strength was not known.__CPtoucheth_1__PStoucheth__EEHeb. smelleth. __NAPsa/58/9\');">Psa 58:9__EN';
stringArray[10] = 'And Delilah said unto Samson, Behold, thou hast mocked me, and told me lies: __PNnow_tell_me_1__SHnow tell me</a>, I pray thee, wherewith thou mightest be bound.__CPnow_tell_me_1__PSnow tell me__FFJdg/16/7\');">Jdg 16:7__NRJdg/16/13\');">13__NRJdg/16/15\');">15-17__NBPro/23/7\');">Pro 23:7__NRPro/23/8\');">8__NBPro/24/28\');">Pro 24:28__NBEze/33/31\');">Eze 33:31__NBLuk/22/48\');">Luk 22:48__EN';
stringArray[11] = 'And he said unto her, __PNIf_they_bind_me_1__SHIf they bind me</a> fast with new ropes __PNthat_never__etc__2__SHthat never</a> were occupied, then shall I be weak, and be as another man.__CPIf_they_bind_me_1__PSIf they bind me__FFPro/13/3\');">Pro 13:3__NRPro/13/5\');">5__NBPro/29/25\');">Pro 29:25__NBEph/4/25\');">Eph 4:25__AN__GHthat_never__etc__2__PSthat never, etc.__FEHeb. wherewith work hath not been done.</TD></TR>';
stringArray[12] = 'Delilah therefore took new ropes, and bound him therewith, and said unto him, The Philistines [be] upon thee, Samson. And [there were] liers in wait abiding in the chamber. And he brake them from off his arms like a thread.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[13] = 'And Delilah said unto Samson, Hitherto thou hast mocked me, and told me lies: tell me wherewith thou mightest be bound. And he said unto her, If thou weavest the seven locks of my head __PNwith_the_web_1__SHwith the web</a>.__CPwith_the_web_1__PSwith the web__EE"It is evident that this verse ends abruptly, and does not contain a full sense. Houbigant has particularly noticed this, and corrected the text from the Septuagint: which adds after these words, [kai enkrouses to passalo eis ton toichou, kai esomai hos eis ton anthropon asthenes kai egeneto en to koimasthai auton kai elabe Dalida tas hepta seiras tes kephales autou, kai hyphanen en to diasmati, k.t.l.] ""and shall fasten them with the pin in the wall, I shall become weak like other men: and so it was, that when he slept, Dalida took the seven locks of his head, and wove them with the web,"" etc. This is absolutely necessary to complete the sense; else Delilah would appear to do something she was not ordered to do, and to omit what she was commanded. Dr. Kennicott very judiciously observes, that the omission, for such it appears to be, begins and ends with the same word; and that the same word occurring in different places, is a very common cause of omission in Hebrew manuscripts."</TD></TR>';
stringArray[14] = 'And she fastened [it] with the pin, and said unto him, The Philistines [be] upon thee, Samson. And he awaked out of his sleep, and __PNwent_away_1__SHwent away</a> with the pin of the beam, and with the web.__CPwent_away_1__PSwent away__FFEzr/9/13\');">Ezr 9:13__NREzr/9/14\');">14__NBPsa/106/43\');">Psa 106:43__EN';

stringArray[17] = 'That he told her __PNall_his_heart_1__SHall his heart</a>, and said unto her, __PNThere_hath_2__SHThere hath</a> not come a razor upon mine head; for I [have been] a Nazarite unto God from my mother\'s womb: if I be shaven, then my strength will go from me, and I shall become weak, and be like any [other] man.__CPall_his_heart_1__PSall his heart__FFPro/12/23\');">Pro 12:23__NBPro/29/12\');">Pro 29:12__NBMic/7/5\');">Mic 7:5__AN__GHThere_hath_2__PSThere hath__EFJdg/13/5\');">Jdg 13:5__NBNum/6/5\');">Num 6:5__NBAct/18/18\');">Act 18:18__EN';
stringArray[18] = 'And when Delilah saw that he had told her all his heart, she sent and called for the lords of the Philistines, saying, __PNCome_up_1__SHCome up</a> this once, for he hath shewed me all his heart. Then the lords of the Philistines came up unto her, and __PNbrought_money_2__SHbrought money</a> in their hand.__CPCome_up_1__PSCome up__FFPsa/62/9\');">Psa 62:9__NBPro/18/8\');">Pro 18:8__NBJer/9/4\');">Jer 9:4-6__AN__GHbrought_money_2__PSbrought money__EFJdg/16/5\');">Jdg 16:5__NBNum/22/7\');">Num 22:7__NB1Ki/21/20\');">1Ki 21:20__NBMat/26/15\');">Mat 26:15__NBEph/5/5\');">Eph 5:5__NB1Ti/6/10\');">1Ti 6:10__EN';

stringArray[21] = 'But the Philistines took him, __PNand_put_out_1__SHand put out</a> his eyes, and brought him down to Gaza, and __PNbound_him_2__SHbound him</a> with fetters of brass; and he did __PNgrind_3__SHgrind</a> in the prison house.__CPand_put_out_1__PSand put out__EEHeb. and bored out. __NAPro/5/22\');">Pro 5:22__NBPro/14/14\');">Pro 14:14__NBPro/2/19\');">Pro 2:19__AN__GHbound_him_2__PSbound him__EF2Ki/25/7\');">2Ki 25:7__NB2Ch/33/11\');">2Ch 33:11__NBPsa/107/10\');">Psa 107:10-12__NBPsa/149/8\');">Psa 149:8__AN__GGgrind_3__PSgrind__FFExd/11/5\');">Exd 11:5__NBIsa/47/2\');">Isa 47:2__NBMat/24/41\');">Mat 24:41__EN';
stringArray[22] = 'Howbeit __PNthe_hair_1__SHthe hair</a> of his head began to grow again __PNafter_he_was_shaven_2__SHafter he was shaven</a>.__CPthe_hair_1__PSthe hair__FFLev/26/44\');">Lev 26:44__NBDeu/32/36\');">Deu 32:36__NBPsa/106/44\');">Psa 106:44__NRPsa/106/45\');">45__NBPsa/107/13\');">Psa 107:13__NRPsa/107/14\');">14__AN__GHafter_he_was_shaven_2__PSafter he was shaven__FEor, as when he was shaven.</TD></TR>';
stringArray[23] = 'Then the lords of the Philistines gathered them together for to offer a great sacrifice unto __PNDagon_1__SHDagon</a> their god, and __PNto_rejoice_2__SHto rejoice</a>: for they said, Our god hath delivered Samson our enemy into our hand.__CPDagon_1__PSDagon__FF1Sa/5/2\');">1Sa 5:2-5__NBJer/2/11\');">Jer 2:11__NBMic/4/5\');">Mic 4:5__NBRom/1/23\');">Rom 1:23-25__NB1Cr/8/4\');">1Cr 8:4__NR1Cr/8/5\');">5__NB1Cr/10/20\');">1Cr 10:20__AN__GHto_rejoice_2__PSto rejoice__EFJob/30/9\');">Job 30:9__NRJob/30/10\');">10__NBPsa/35/15\');">Psa 35:15__NRPsa/35/16\');">16__NBPro/24/17\');">Pro 24:17__EN';
stringArray[24] = 'And when the people saw him, they __PNpraised_1__SHpraised</a> their god: for they said, Our god hath delivered into our hands our enemy, and the destroyer of our country, __PNwhich_slew_many_of_us_2__SHwhich slew many of us</a>.__CPpraised_1__PSpraised__FFDeu/32/27\');">Deu 32:27__NBIsa/37/20\');">Isa 37:20__NBEze/20/14\');">Eze 20:14__NBDan/5/4\');">Dan 5:4__NRDan/5/23\');">23__NBHab/1/16\');">Hab 1:16__NBRev/11/10\');">Rev 11:10__AN__GHwhich_slew_many_of_us_2__PSwhich slew many of us__FEHeb. and who multiplied our slain. __NAJdg/15/8\');">Jdg 15:8__NRJdg/15/16\');">16__EN';
stringArray[25] = 'And it came to pass, when __PNtheir_hearts_1__SHtheir hearts</a> were merry, that they said, Call for Samson, that he may make us sport. And they called for Samson out of the prison house; and he made __PNthem_2__SHthem</a> __PNsport_3__SHsport</a>: and they set him between the pillars.__CPtheir_hearts_1__PStheir hearts__FFJdg/9/27\');">Jdg 9:27__NBJdg/18/20\');">Jdg 18:20__NBJdg/19/6\');">Jdg 19:6__NRJdg/19/9\');">9__NB2Sa/13/28\');">2Sa 13:28__NB1Ki/20/12\');">1Ki 20:12__NBEst/3/15\');">Est 3:15__NBIsa/22/13\');">Isa 22:13__NBDan/5/2\');">Dan 5:2__NRDan/5/3\');">3__NBMat/14/6\');">Mat 14:6__NRMat/14/7\');">7__AN__GHthem_2__PSthem__FEHeb. before them.__GGsport_3__PSsport__FFJob/30/9\');">Job 30:9__NRJob/30/10\');">10__NBPsa/35/15\');">Psa 35:15__NRPsa/35/16\');">16__NBPsa/69/12\');">Psa 69:12__NRPsa/69/26\');">26__NBPro/24/17\');">Pro 24:17__NRPro/24/18\');">18__NBMic/7/8\');">Mic 7:8-10__NBMat/26/67\');">Mat 26:67__NRMat/26/68\');">68__NBMat/27/29\');">Mat 27:29__NRMat/27/39\');">39-44__NBHbr/11/36\');">Hbr 11:36__EN';
stringArray[26] = 'And Samson said unto the lad that held him by the hand, Suffer me that I may feel the pillars whereupon the house standeth, that I may lean upon them.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[27] = 'Now the house was full of men and women; and all the lords of the Philistines [were] there; __PNand_there_1__SHand [there</a> were] upon __PNthe_roof_2__SHthe roof</a> about three thousand men and women, that beheld while Samson made sport.__CPand_there_1__PSand there__EE"""Samson, therefore,"" says Dr. Shaw, ""must have been in a court or area below; and consequently the temple will be of the same kind with the ancient, [temene] or sacred enclosures, which were only surrounded either in part, or on all sides, with some plain or cloistered buildings. Several palaces, doutwanas, (as the courts of justice are called in those countries) are built in this fashion. On their public festivals and rejoicings, the roofs of these cloisters are crowded with spectators. I have often seen numbers of people diverted in this manner on the roof of the dey\'s palace at Algiers; which, like many others, has an advanced cloister, over against the gate of the palace, like a long pent-house, supported by one or two contiguous pillars in front, or centre."""__GHthe_roof_2__PSthe roof__EFJdg/9/51\');">Jdg 9:51__NBDeu/22/8\');">Deu 22:8__NBJos/2/8\');">Jos 2:8__NB2Sa/11/2\');">2Sa 11:2__EN';

stringArray[29] = 'And Samson took hold of the two middle pillars upon which the house stood, and __PNon_which_it_was_borne_up_1__SHon which it was borne up</a>, of the one with his right hand, and of the other with his left.__CPon_which_it_was_borne_up_1__PSon which it was borne up__EEor, he leaned on them.</TD></TR>';
