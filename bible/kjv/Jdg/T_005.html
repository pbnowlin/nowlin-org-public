stringArray[22] = 'Then were the __PNhorsehoofs_1__SHhorsehoofs</a> broken by the means of the __PNpransings_2__SHpransings</a>, the pransings of their mighty ones.__CPhorsehoofs_1__PShorsehoofs__EEAnciently, horses were not shod; nor are they at the present day in some parts of the East. The flight was so rapid that the hoofs of their horses were splintered and broken by the roughness of the roads; in consequence of which they became lame, and could not carry off their riders. __NAPsa/20/7\');">Psa 20:7__NBPsa/33/17\');">Psa 33:17__NBPsa/147/10\');">Psa 147:10__NRPsa/147/11\');">11__NBIsa/5/28\');">Isa 5:28__NBJer/47/4\');">Jer 47:4__NBMic/4/13\');">Mic 4:13__AN__GHpransings_2__PSpransings__FE"or, tramplings, or, plungings. mighty ones. Or, as Dr. Waterland renders, ""mighty horses,"" or ""strong steeds,"" as Dr. Kennicott, i.e., their war-horses, which gives great energy to the text, and renders it perfectly intelligible."</TD></TR>';
