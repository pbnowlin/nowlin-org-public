var stringArray = new Array();
stringArray[1] = 'And __PNthe_men_1__SHthe men</a> of Ephraim said unto him, __PNWhy__etc__2__SHWhy</a> hast thou served us thus, that thou calledst us not, when thou wentest to fight with the Midianites? And they did chide with him sharply.__CPthe_men_1__PSthe men__FFJdg/12/1\');">Jdg 12:1-6__NB2Sa/19/41\');">2Sa 19:41__NBJob/5/2\');">Job 5:2__NBEcc/4/4\');">Ecc 4:4__NBJam/4/5\');">Jam 4:5__NRJam/4/6\');">6__AN__GHWhy__etc__2__PSWhy, etc.__FEHeb. What thing is this thou hast done unto us? sharply. Heb. strongly.</TD></TR>';
stringArray[2] = 'And he said unto them, __PNWhat_1__SHWhat</a> have I done now in comparison of you? __PNIs_not_the_2__SH[Is] not the</a> gleaning of the grapes of Ephraim better than the vintage of __PNAbiezer_3__SHAbiezer</a>?__CPWhat_1__PSWhat__FF1Cr/13/4\');">1Cr 13:4-7__NBGal/5/14\');">Gal 5:14__NRGal/5/15\');">15__NBPhl/2/2\');">Phl 2:2__NRPhl/2/3\');">3__NBJam/1/19\');">Jam 1:19__NRJam/1/20\');">20__NBJam/3/13\');">Jam 3:13-18__AN__GHIs_not_the_2__PSIs not the__FEThat is, the Ephraimites have performed more important services than Gideon and his men had achieved.__GGAbiezer_3__PSAbiezer__FFJdg/6/11\');">Jdg 6:11__NRJdg/6/34\');">34__EN';
stringArray[3] = '__PNGod_1__SHGod</a> hath delivered into your hands the princes of Midian, Oreb and Zeeb: and what was I able to do in comparison of you? __PNThen_2__SHThen</a> their __PNanger_3__SHanger</a> was abated toward him, when he had said that.__CPGod_1__PSGod__FFJdg/7/24\');">Jdg 7:24__NRJdg/7/25\');">25__NBPsa/44/3\');">Psa 44:3__NBPsa/115/1\');">Psa 115:1__NBPsa/118/14\');">Psa 118:14-16__NBJhn/4/37\');">Jhn 4:37__NBRom/12/3\');">Rom 12:3__NRRom/12/6\');">6__NBRom/15/18\');">Rom 15:18__NRRom/15/19\');">19__NBPhl/2/3\');">Phl 2:3__AN__GHThen_2__PSThen__EFPro/15/1\');">Pro 15:1__NBPro/16/32\');">Pro 16:32__NBPro/25/11\');">Pro 25:11__NRPro/25/15\');">15__AN__GGanger_3__PSanger__EEHeb. spirit.</TD></TR>';
stringArray[4] = 'And Gideon came to Jordan, [and] passed over, he, and the three hundred men that [were] with him, __PNfaint_1__SHfaint</a>, yet pursuing [them].__CPfaint_1__PSfaint__FF1Sa/14/28\');">1Sa 14:28__NR1Sa/14/29\');">29__NR1Sa/14/31\');">31__NR1Sa/14/32\');">32__NB1Sa/30/10\');">1Sa 30:10__NB2Cr/4/8\');">2Cr 4:8__NR2Cr/4/9\');">9__NR2Cr/4/16\');">16__NBGal/6/9\');">Gal 6:9__NBHbr/12/1\');">Hbr 12:1-4__EN';
stringArray[5] = 'And he said unto the men of __PNSuccoth_1__SHSuccoth</a>, Give, I pray you, __PNloaves_2__SHloaves</a> of bread unto the people that follow me; for they [be] faint, and I am pursuing after Zebah and Zalmunna, kings of Midian.__CPSuccoth_1__PSSuccoth__FFGen/33/17\');">Gen 33:17__NBPsa/60/6\');">Psa 60:6__AN__GHloaves_2__PSloaves__EFGen/14/18\');">Gen 14:18__NBDeu/23/4\');">Deu 23:4__NB1Sa/25/18\');">1Sa 25:18__NB2Sa/17/28\');">2Sa 17:28__NR2Sa/17/29\');">29__NB3Jo/1/6\');">3Jo 1:6-8__EN';
stringArray[6] = 'And the princes of Succoth said, [Are] the hands of Zebah and Zalmunna now in thine hand, that we should give bread unto thine army?__CPRelated_Verses1_1__PSEntire Verse.__FFJdg/5/23\');">Jdg 5:23__NBGen/25/13\');">Gen 25:13__NBGen/37/25\');">Gen 37:25__NRGen/37/28\');">28__NB1Sa/25/10\');">1Sa 25:10__NR1Sa/25/11\');">11__NB1Ki/20/11\');">1Ki 20:11__NB2Ki/14/9\');">2Ki 14:9__NBPro/18/23\');">Pro 18:23__NBPhl/2/21\');">Phl 2:21__EN';
stringArray[7] = 'And Gideon said, Therefore when the LORD hath delivered Zebah and Zalmunna into mine hand, then I will __PNtear_1__SHtear</a> your flesh with the thorns of the wilderness and with briers.__CPtear_1__PStear__EEHeb. thresh. __NAJdg/8/16\');">Jdg 8:16__EN';
stringArray[8] = 'And he went up thence to Penuel, and spake unto them likewise: and the men of Penuel answered him as the men of Succoth had answered [him].__CPRelated_Verses1_1__PSEntire Verse.__FFGen/32/30\');">Gen 32:30__NRGen/32/31\');">31__NB1Ki/12/25\');">1Ki 12:25__EN';
stringArray[9] = 'And he spake also unto the men of Penuel, saying, When __PNI_come_1__SHI come</a> again in peace, __PNI_will_break_2__SHI will break</a> down this tower.__CPI_come_1__PSI come__FF1Ki/22/27\');">1Ki 22:27__NR1Ki/22/28\');">28__AN__GHI_will_break_2__PSI will break__EFJdg/8/17\');">Jdg 8:17__EN';
stringArray[10] = 'Now Zebah and Zalmunna [were] in __PNKarkor_1__SHKarkor</a>, and their hosts with them, about fifteen thousand [men], all that were left of all the hosts of the __PNchildren_2__SHchildren</a> of the east: for there __PNfell_an_hundred__etc__3__SHfell an hundred</a> and twenty thousand men that drew sword.__CPKarkor_1__PSKarkor__EE"If this were the name of a place, it is no where else mentioned. Some contend that karkor signifies rest; and the Vulgate renders it requiescebant, ""rested"". This seems the most likely; for it is said (__NAJdg/8/11\');">Jdg 8:11__AN) that Gideon ""smote the host: for the host was secure."""__GHchildren_2__PSchildren__EFJdg/7/12\');">Jdg 7:12__AN__GGfell_an_hundred__etc__3__PSfell an hundred, etc.__EEor, an hundred and twenty thousand, every one drawing a sword __NAJdg/7/22\');">Jdg 7:22__NBJdg/20/2\');">Jdg 20:2__NRJdg/20/15\');">15__NRJdg/20/17\');">17__NRJdg/20/25\');">25__NRJdg/20/35\');">35__NRJdg/20/46\');">46__NB2Ki/3/26\');">2Ki 3:26__NB2Ch/13/17\');">2Ch 13:17__NB2Ch/28/6\');">2Ch 28:6__NR2Ch/28/8\');">8__NBIsa/37/36\');">Isa 37:36__EN';
stringArray[11] = 'And Gideon went up by the way of them that dwelt in tents on the east of __PNNobah_1__SHNobah</a> and Jogbehah, and smote the host: for the host was __PNsecure_2__SHsecure</a>.__CPNobah_1__PSNobah__EENobah took its name from an Israelite who conquered it; and is said by Eusebius to have been, in his time, a forsaken place eight miles south from Heshbon. Jogbehah was probably near it. __NANum/32/35\');">Num 32:35__NRNum/32/42\');">42__AN__GHsecure_2__PSsecure__EFJdg/18/27\');">Jdg 18:27__NB1Sa/15/32\');">1Sa 15:32__NB1Sa/30/16\');">1Sa 30:16__NB1Th/5/3\');">1Th 5:3__EN';
stringArray[12] = 'And when Zebah and Zalmunna fled, he pursued after them, and __PNtook_1__SHtook</a> the two kings of Midian, Zebah and Zalmunna, and __PNdiscomfited_2__SHdiscomfited</a> all the host.__CPtook_1__PStook__FFJos/10/16\');">Jos 10:16-18__NRJos/10/22\');">22-25__NBJob/12/16\');">Job 12:16-21__NBJob/34/19\');">Job 34:19__NBPsa/83/11\');">Psa 83:11__NBAmo/2/14\');">Amo 2:14__NBRev/6/15\');">Rev 6:15__NRRev/6/16\');">16__NBRev/19/19\');">Rev 19:19-21__AN__GHdiscomfited_2__PSdiscomfited__FEHeb. terrified.</TD></TR>';
stringArray[13] = 'And Gideon the son of Joash returned from battle __PNbefore_1__SHbefore</a> the sun [was up],__CPbefore_1__PSbefore__EE"The words milmäâleh haichaires should, most probably be rendered ""from the ascent of Chares;"" which is the reading of the LXX. Syriac, Arabic, and Houbigant."</TD></TR>';
stringArray[14] = 'And __PNcaught_1__SHcaught</a> a young man of the men of Succoth, and enquired of him: and he __PNdescribed_2__SHdescribed</a> unto him the princes of Succoth, and the elders thereof, [even] threescore and seventeen men.__CPcaught_1__PScaught__FFJdg/1/24\');">Jdg 1:24__NRJdg/1/25\');">25__NB1Sa/30/11\');">1Sa 30:11-15__AN__GHdescribed_2__PSdescribed__FEHeb. writ.</TD></TR>';
stringArray[15] = 'And he came unto the men of Succoth, and said, Behold Zebah and Zalmunna, with whom ye did __PNupbraid_1__SHupbraid</a> me, saying, [Are] the hands of Zebah and Zalmunna now in thine hand, that we should give bread unto thy men [that are] weary?__CPupbraid_1__PSupbraid__FFJdg/8/6\');">Jdg 8:6__NRJdg/8/7\');">7__EN';
stringArray[16] = 'And he took __PNthe_elders_1__SHthe elders</a> of the city, and __PNthorns_2__SHthorns</a> of the wilderness and briers, and with them he __PNtaught_3__SHtaught</a> the men of Succoth.__CPthe_elders_1__PSthe elders__FFJdg/8/7\');">Jdg 8:7__NBPro/10/13\');">Pro 10:13__NBPro/19/29\');">Pro 19:29__NBEzr/2/6\');">Ezr 2:6__AN__GHthorns_2__PSthorns__EFMic/7/4\');">Mic 7:4__AN__GGtaught_3__PStaught__EE"Heb. made to know. Instead of wyyodâ, Houbigant, Le Clerc, and others read wyyadosh, ""and he tore or threshed;"" and this is not only agreeable to what Gideon threatened (__NAJdg/8/7\');">Jdg 8:7__AN), but is supported by the LXX. Vulgate, Chaldee, Syriac, and Arabic. The Hebrew text might easily have been corrupted simply by the change of [Shîyn] shin, into [\'Ayin] ayin, letters very similar to each other."</TD></TR>';
stringArray[17] = 'And he beat down the tower of Penuel, and slew the men of the city.__CPRelated_Verses1_1__PSEntire Verse.__FFJdg/8/9\');">Jdg 8:9__NB1Ki/12/25\');">1Ki 12:25__EN';
stringArray[18] = 'Then said he unto Zebah and Zalmunna, What manner of men [were they] whom ye slew at __PNTabor_1__SHTabor</a>? And they answered, __PNAs_thou_art_2__SHAs thou [art]</a>, so [were] they; each one __PNresembled_3__SHresembled</a> the children of a king.__CPTabor_1__PSTabor__FFJdg/4/6\');">Jdg 4:6__NBPsa/89/12\');">Psa 89:12__AN__GHAs_thou_art_2__PSAs thou art__EFPsa/12/2\');">Psa 12:2__NBJud/1/16\');">Jud 1:16__AN__GGresembled_3__PSresembled__EEHeb. according to the form of, etc.</TD></TR>';
stringArray[19] = 'And he said, They [were] my brethren, [even] the sons of my mother: [as] the LORD liveth, if ye had saved them alive, I would not slay you.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[20] = 'And he said unto Jether his firstborn, Up, [and] slay them. But the youth drew not his sword: for he feared, because he [was] yet a youth.__CPRelated_Verses1_1__PSEntire Verse.__FFJos/10/24\');">Jos 10:24__NB1Sa/15/33\');">1Sa 15:33__NBPsa/149/9\');">Psa 149:9__EN';
stringArray[21] = 'Then Zebah and Zalmunna said, __PNRise_thou_1__SHRise thou</a>, and fall upon us: for as the man [is, so is] his strength. And Gideon arose, and __PNslew_2__SHslew</a> Zebah and Zalmunna, and took away the __PNornaments_3__SHornaments</a> that [were] on their camels\' necks.__CPRise_thou_1__PSRise thou__EEIt was disgraceful to fall by the hands of a child; and death by the blows of such a person must be much more lingering and tormenting. Some have employed children to dispatch captives. __NAJdg/9/54\');">Jdg 9:54__NB1Sa/31/3\');">1Sa 31:3__NR1Sa/31/5\');">5__NBRev/9/6\');">Rev 9:6__AN__GHslew_2__PSslew__EFPsa/83/1\');">Psa 83:1__AN__GGornaments_3__PSornaments__EEor, ornaments like the moon. __NAIsa/3/18\');">Isa 3:18__EN';
stringArray[22] = 'Then the men of Israel said unto Gideon, __PNRule_thou_1__SHRule thou</a> over us, both thou, and thy son, and thy son\'s son also: for thou hast delivered us from the hand of Midian.__CPRule_thou_1__PSRule thou__FFJdg/9/8\');">Jdg 9:8-15__NB1Sa/8/5\');">1Sa 8:5__NB1Sa/12/12\');">1Sa 12:12__NBJhn/6/15\');">Jhn 6:15__EN';
stringArray[23] = 'And Gideon said unto them, __PNI_will_1__SHI will</a> not rule over you, neither shall my son rule over you: __PNthe_LORD_2__SHthe LORD</a> shall rule over you.__CPI_will_1__PSI will__FFJdg/2/18\');">Jdg 2:18__NBJdg/10/18\');">Jdg 10:18__NBJdg/11/9\');">Jdg 11:9-11__NBLuk/22/24\');">Luk 22:24-27__NB2Cr/1/24\');">2Cr 1:24__NB1Pe/5/3\');">1Pe 5:3__AN__GHthe_LORD_2__PSthe LORD__EF1Sa/8/6\');">1Sa 8:6__NR1Sa/8/7\');">7__NB1Sa/10/19\');">1Sa 10:19__NB1Sa/12/12\');">1Sa 12:12__NBIsa/33/22\');">Isa 33:22__NBIsa/63/19\');">Isa 63:19__EN';
stringArray[24] = 'And Gideon said unto them, I would desire a request of you, that ye would __PNgive_me_1__SHgive me</a> every man the earrings of his prey. (For they had golden earrings, __PNbecause_2__SHbecause</a> they [were] Ishmaelites.)__CPgive_me_1__PSgive me__FFGen/24/22\');">Gen 24:22__NRGen/24/53\');">53__NBExd/12/35\');">Exd 12:35__NBExd/32/3\');">Exd 32:3__NB1Pe/3/3\');">1Pe 3:3-5__AN__GHbecause_2__PSbecause__EFGen/16/10\');">Gen 16:10__NRGen/16/11\');">11__NBGen/25/13\');">Gen 25:13__NBGen/37/25\');">Gen 37:25__NRGen/37/28\');">28__NB1Sa/25/11\');">1Sa 25:11__NB1Ki/20/11\');">1Ki 20:11__EN';
stringArray[25] = 'And they answered, We will willingly give [them]. And they spread a garment, and did cast therein every man the earrings of his prey.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[26] = 'And the weight of the golden earrings that he requested was __PNa_thousand_1__SHa thousand</a> and seven hundred [shekels] of gold; beside ornaments, and __PNcollars_2__SHcollars</a>, and __PNpurple_3__SHpurple</a> raiment that [was] on the kings of Midian, and beside the __PNchains_4__SHchains</a> that [were] about their camels\' necks.__CPa_thousand_1__PSa thousand__EETaking the shekel at half an ounce, the sum of the gold ear-rings was 73 lbs. 4oz. and worth about £3,300 sterling.__GHcollars_2__PScollars__FEor, sweet jewels.__GGpurple_3__PSpurple__FFEst/8/15\');">Est 8:15__NBJer/10/9\');">Jer 10:9__NBEze/27/7\');">Eze 27:7__NBLuk/16/19\');">Luk 16:19__NBJhn/19/2\');">Jhn 19:2__NRJhn/19/5\');">5__NBRev/17/4\');">Rev 17:4__NBRev/18/12\');">Rev 18:12__NRRev/18/16\');">16__AN__GHchains_4__PSchains__EFJdg/8/21\');">Jdg 8:21__EN';
stringArray[27] = 'And Gideon made __PNan_ephod_1__SHan ephod</a> thereof, and put it in his city, [even] in __PNOphrah_2__SHOphrah</a>: and all Israel went thither __PNa_whoring_3__SHa whoring</a> after it: which thing became __PNa_snare_4__SHa snare</a> unto Gideon, and to his house.__CPan_ephod_1__PSan ephod__FFJdg/17/5\');">Jdg 17:5__NBJdg/18/14\');">Jdg 18:14__NRJdg/18/17\');">17__NBExd/28/6\');">Exd 28:6-12__NB1Sa/23/9\');">1Sa 23:9__NR1Sa/23/10\');">10__NBIsa/8/20\');">Isa 8:20__AN__GHOphrah_2__PSOphrah__EFJdg/8/32\');">Jdg 8:32__NBJdg/6/11\');">Jdg 6:11__NRJdg/6/24\');">24__NBDeu/12/5\');">Deu 12:5__AN__GGa_whoring_3__PSa whoring__FFExd/23/33\');">Exd 23:33__NBPsa/73/27\');">Psa 73:27__NBPsa/106/39\');">Psa 106:39__NBHsa/2/2\');">Hsa 2:2__NBHsa/4/12\');">Hsa 4:12-14__AN__GHa_snare_4__PSa snare__EFJdg/8/33\');">Jdg 8:33__NBDeu/7/16\');">Deu 7:16__EN';
stringArray[28] = 'Thus __PNwas_Midian_1__SHwas Midian</a> subdued before the children of Israel, so that they lifted up their heads no more. And the country was in quietness __PNforty_years_2__SHforty years</a> in the days of Gideon.__CPwas_Midian_1__PSwas Midian__FFPsa/83/9\');">Psa 83:9-12__NBIsa/9/4\');">Isa 9:4__NBIsa/10/26\');">Isa 10:26__AN__GHforty_years_2__PSforty years__EFJdg/3/11\');">Jdg 3:11__NRJdg/3/30\');">30__NBJdg/5/31\');">Jdg 5:31__EN';
stringArray[29] = 'And __PNJerubbaal_1__SHJerubbaal</a> the son of Joash went and dwelt __PNin_his_own_house_2__SHin his own house</a>.__CPJerubbaal_1__PSJerubbaal__FFJdg/6/32\');">Jdg 6:32__NB1Sa/12/11\');">1Sa 12:11__AN__GHin_his_own_house_2__PSin his own house__EFNeh/5/14\');">Neh 5:14__NRNeh/5/15\');">15__EN';
stringArray[30] = 'And Gideon had __PNthreescore_1__SHthreescore</a> and ten sons __PNof_his_body_begotten_2__SHof his body begotten</a>: for he had __PNmany_wives_3__SHmany wives</a>.__CPthreescore_1__PSthreescore__FFJdg/9/2\');">Jdg 9:2__NRJdg/9/5\');">5__NBJdg/10/4\');">Jdg 10:4__NBJdg/12/9\');">Jdg 12:9__NRJdg/12/14\');">14__NBGen/46/26\');">Gen 46:26__NBExd/1/5\');">Exd 1:5__NB2Ki/10/1\');">2Ki 10:1__AN__GHof_his_body_begotten_2__PSof his body begotten__FEHeb. going out of his thigh.__GGmany_wives_3__PSmany wives__FFGen/2/24\');">Gen 2:24__NBGen/7/7\');">Gen 7:7__NBDeu/17/17\');">Deu 17:17__NB2Sa/3/2\');">2Sa 3:2-5__NB2Sa/5/13\');">2Sa 5:13-16__NB1Ki/11/3\');">1Ki 11:3__NBMal/2/15\');">Mal 2:15__NBMat/19/5\');">Mat 19:5-8__NBEph/5/31\');">Eph 5:31-33__EN';
stringArray[31] = 'And his __PNconcubine_1__SHconcubine</a> that [was] in Shechem, she also bare him a son, whose name he __PNcalled_2__SHcalled</a> __PNAbimelech_3__SHAbimelech</a>.__CPconcubine_1__PSconcubine__FFJdg/9/1\');">Jdg 9:1-5__NBGen/16/15\');">Gen 16:15__NBGen/22/24\');">Gen 22:24__AN__GHcalled_2__PScalled__FEHeb. set.__GGAbimelech_3__PSAbimelech__FFJdg/9/18\');">Jdg 9:18__NBGen/20/2\');">Gen 20:2__EN';
stringArray[32] = 'And Gideon the son of Joash __PNdied_in_1__SHdied in</a> a good old age, and was buried in the sepulchre of Joash his father, in __PNOphrah_2__SHOphrah</a> of the Abiezrites.__CPdied_in_1__PSdied in__FFGen/15/15\');">Gen 15:15__NBGen/25/8\');">Gen 25:8__NBJos/24/29\');">Jos 24:29__NRJos/24/30\');">30__NBJob/5/26\');">Job 5:26__NBJob/42/17\');">Job 42:17__AN__GHOphrah_2__PSOphrah__EFJdg/8/27\');">Jdg 8:27__NBJdg/6/24\');">Jdg 6:24__EN';
stringArray[33] = 'And it came to pass, __PNas_soon_1__SHas soon</a> as Gideon was dead, that the children of Israel turned again, and __PNwent_2__SHwent</a> a whoring after Baalim, and made __PNBaal_berith_3__SHBaalberith</a> their god.__CPas_soon_1__PSas soon__FFJdg/2/7\');">Jdg 2:7-10__NRJdg/2/17\');">17__NRJdg/2/19\');">19__NBJos/24/31\');">Jos 24:31__NB2Ki/12/2\');">2Ki 12:2__NB2Ch/24/17\');">2Ch 24:17__NR2Ch/24/18\');">18__AN__GHwent_2__PSwent__EFJdg/8/27\');">Jdg 8:27__NBJdg/2/17\');">Jdg 2:17__NBExd/34/15\');">Exd 34:15__NRExd/34/16\');">16__NBJer/3/9\');">Jer 3:9__AN__GGBaal_berith_3__PSBaal-berith__EE"Literally, ""the LORD of the covenant."" __NAJdg/9/4\');">Jdg 9:4__NRJdg/9/46\');">46__AN"</TD></TR>';
stringArray[34] = 'And the children of Israel __PNremembered_1__SHremembered</a> not the LORD their God, who had delivered them out of the hands of all their enemies on every side:__CPremembered_1__PSremembered__FFPsa/78/11\');">Psa 78:11__NRPsa/78/42\');">42__NBPsa/106/18\');">Psa 106:18__NRPsa/106/21\');">21__NBEcc/12/1\');">Ecc 12:1__NBJer/2/32\');">Jer 2:32__EN';
stringArray[35] = 'Neither __PNshewed_1__SHshewed</a> they kindness to the house of __PNJerubbaal_2__SHJerubbaal</a>, [namely], Gideon, according to all the goodness which he had shewed unto Israel.__CPshewed_1__PSshewed__FFJdg/9/5\');">Jdg 9:5__NRJdg/9/16\');">16-19__NBEcc/9/14\');">Ecc 9:14__NREcc/9/15\');">15__AN__GHJerubbaal_2__PSJerubbaal__FERather, Jerubbaal Gideon; as we say, Simon Peter; or call a person by his Christian and surname. Gideon was a mighty man of valour, a true patriot, evidently disinterested and void of ambition. He loved his country, and hazarded his life for it; but refused the kingdom, when offered to him and his heirs. The act of making the ephod was totally wrong; yet, probably it was done with no reprehensible design.</TD></TR>';
