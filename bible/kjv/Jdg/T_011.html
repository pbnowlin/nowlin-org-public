stringArray[1] = 'Now __PNJephthah_1__SHJephthah</a> the Gileadite was __PNa_mighty_2__SHa mighty</a> man of valour, and he [was] the son of __PNan_harlot_3__SHan harlot</a>: and Gilead begat Jephthah.__CPJephthah_1__PSJephthah__FFHbr/11/32\');">Hbr 11:32__AN; called Jephthae.__GHa_mighty_2__PSa mighty__EFJdg/6/12\');">Jdg 6:12__NB2Ki/5/1\');">2Ki 5:1__AN__GGan_harlot_3__PSan harlot__EE"Heb. a woman, an harlot. Probably zonah should be rendered as in __NAJos/2/1\');">Jos 2:1__AN, a hostess, or inn-keeper: so Targum of Jonathan, wehoo bar ittetha pundekeetha, ""and he was the son of a woman, a tavern-keeper."" She was very probably a Canaanite, as she is called, __NAJdg/11/2\');">Jdg 11:2__AN, a strange woman, ishah achereth, ""a woman of another race;"" and on this account his brethren drove him from the family, as not having a full right to the inheritance."</TD></TR>';
stringArray[2] = 'And Gilead\'s wife bare him sons; and his wife\'s sons grew up, and they __PNthrust_out_1__SHthrust out</a> Jephthah, and said unto him, Thou shalt not inherit in our father\'s house; for thou [art] the son of __PNa_strange_2__SHa strange</a> woman.__CPthrust_out_1__PSthrust out__FFGen/12/10\');">Gen 12:10__NBDeu/23/2\');">Deu 23:2__NBGal/4/30\');">Gal 4:30__AN__GHa_strange_2__PSa strange__EFPro/2/16\');">Pro 2:16__NBPro/5/3\');">Pro 5:3__NRPro/5/20\');">20__NBPro/6/24\');">Pro 6:24-26__EN';
stringArray[3] = 'Then Jephthah fled __PNfrom_his_brethren_1__SHfrom his brethren</a>, and dwelt in the land of Tob: and there were gathered __PNvain_men_2__SHvain men</a> to Jephthah, and went out with him.__CPfrom_his_brethren_1__PSfrom his brethren__EEHeb. from the face of. Tob. Probably the same as Ish-Tob; and appears to have been a part of Syria, near Zobah, Rehob, and Maachah, east of Jordan, and in the most northern part of the portion of Manasseh. If so, it could not be far from Gilead, the country of Jephthah. This country is called Tobie or Tubin,  1 Mac 5:13; and the Jews who inhabited this district Tubieni,  2 Mac 12:17. __NA2Sa/10/6\');">2Sa 10:6__AN.__GHvain_men_2__PSvain men__EFJdg/9/4\');">Jdg 9:4__NB1Sa/22/2\');">1Sa 22:2__NB1Sa/27/2\');">1Sa 27:2__NB1Sa/30/22\');">1Sa 30:22-24__NBJob/30/1\');">Job 30:1-10__NBAct/17/5\');">Act 17:5__EN';

stringArray[5] = 'And it was so, that when the children of Ammon __PNmade_war_1__SHmade war</a> against Israel, the elders of Gilead went __PNto_fetch_2__SHto fetch</a> Jephthah out of the land of Tob:__CPmade_war_1__PSmade war__FFJdg/10/9\');">Jdg 10:9__NRJdg/10/17\');">17__NRJdg/10/18\');">18__AN__GHto_fetch_2__PSto fetch__EF1Sa/10/27\');">1Sa 10:27__NB1Sa/11/6\');">1Sa 11:6__NR1Sa/11/7\');">7__NR1Sa/11/12\');">12__NBPsa/118/22\');">Psa 118:22__NRPsa/118/23\');">23__NBAct/7/35\');">Act 7:35-39__NB1Cr/1/27\');">1Cr 1:27-29__EN';

stringArray[8] = 'And __PNthe_elders_1__SHthe elders</a> of Gilead said unto Jephthah, Therefore __PNwe_turn_2__SHwe turn</a> again to thee now, that thou mayest go with us, and fight against the children of Ammon, and be our head over all the inhabitants of Gilead.__CPthe_elders_1__PSthe elders__FFExd/8/8\');">Exd 8:8__NRExd/8/28\');">28__NBExd/9/28\');">Exd 9:28__NBExd/10/17\');">Exd 10:17__NB1Ki/13/6\');">1Ki 13:6__NBLuk/17/3\');">Luk 17:3__NRLuk/17/4\');">4__AN__GHwe_turn_2__PSwe turn__EFJdg/10/18\');">Jdg 10:18__EN';

stringArray[10] = 'And the elders of Gilead said unto Jephthah, __PNThe_LORD_1__SHThe LORD</a> __PNbe_witness_2__SHbe witness</a> between us, __PNif_we_do_3__SHif we do</a> not so according to thy words.__CPThe_LORD_1__PSThe LORD__FFGen/21/23\');">Gen 21:23__NBGen/31/50\');">Gen 31:50__NB1Sa/12/5\');">1Sa 12:5__NBJer/29/23\');">Jer 29:23__NBJer/42/5\');">Jer 42:5__NBRom/1/9\');">Rom 1:9__NB2Cr/11/31\');">2Cr 11:31__AN__GHbe_witness_2__PSbe witness__FEbe the hearer. __NAGen/16/5\');">Gen 16:5__NBGen/31/53\');">Gen 31:53__NBDeu/1/16\');">Deu 1:16__NB1Sa/24/12\');">1Sa 24:12__AN__GGif_we_do_3__PSif we do__FFExd/20/7\');">Exd 20:7__NBZec/5/4\');">Zec 5:4__NBMal/3/5\');">Mal 3:5__EN';
stringArray[11] = 'Then Jephthah went with the elders of Gilead, and the people made him __PNhead_1__SHhead</a> and captain over them: and Jephthah __PNuttered_2__SHuttered</a> all his words __PNbefore_4__SHbefore</a> the LORD in __PNMizpeh_5__SHMizpeh</a>.__CPhead_1__PShead__FFJdg/11/8\');">Jdg 11:8__AN__GHuttered_2__PSuttered__EF1Sa/23/9\');">1Sa 23:9-12__NB1Ki/3/7\');">1Ki 3:7-9__NB2Cr/3/5\');">2Cr 3:5__NBJam/1/5\');">Jam 1:5__NRJam/1/17\');">17__AN__GGJephthah_uttered_3__PSJephthah uttered__EEThat is, upon his elevation, he immediately retired to his devotion, and in prayer spread the whole matter before God, both his choice to the office, and his execution of the office, as one that had his eye ever toward the LORD, and would do nothing without him; that leaned not to his own understanding or courage, but depended on the Almighty God, and his favour. This is an ensample worthy of universal imitation; in All Our Ways, whether great or apparently subordinate, let us acknowledge God and seek his direction. So shall we make our way prosperous, and obtain that peace which passeth all understanding. Jephthah opened his campaign with prayer.__GHbefore_4__PSbefore__EFJdg/10/17\');">Jdg 10:17__NBJdg/20/1\');">Jdg 20:1__NB1Sa/10/17\');">1Sa 10:17__NB1Sa/11/15\');">1Sa 11:15__AN__GGMizpeh_5__PSMizpeh__EEThis Mizpeh was east of Jordan in the mountains of Gilead (__NAGen/31/49\');">Gen 31:49__AN); and hence called Mizpeh of Gilead (__NAJdg/11/29\');">Jdg 11:29__AN), to distinguish it from another place of the same name, west of Jordan, in the tribe of Judah. __NAJos/15/38\');">Jos 15:38__EN';
stringArray[12] = 'And Jephthah __PNsent_messengers_1__SHsent messengers</a> unto the king of the children of Ammon, saying, __PNWhat_hast_2__SHWhat hast</a> thou to do with me, that thou art come against me to fight in my land?__CPsent_messengers_1__PSsent messengers__EEIn this Jephthah acted in accordance with the law of Moses; and hence the justice of his cause would appear more forcibly to the people. __NANum/20/14\');">Num 20:14__NBNum/21/21\');">Num 21:21__NBDeu/2/26\');">Deu 2:26__NBDeu/20/10\');">Deu 20:10__NRDeu/20/11\');">11__NBPro/25/8\');">Pro 25:8__NRPro/25/9\');">9__NBMat/18/15\');">Mat 18:15__NRMat/18/16\');">16__AN__GHWhat_hast_2__PSWhat hast__EF2Ki/14/8\');">2Ki 14:8-12__EN';

stringArray[15] = 'And said unto him, Thus saith Jephthah, __PNIsrael_took_1__SHIsrael took</a> not away the land of Moab, nor the land of the children of Ammon:__CPIsrael_took_1__PSIsrael took__FFNum/21/13\');">Num 21:13-15__NRNum/21/27\');">27-30__NBDeu/2/9\');">Deu 2:9__NRDeu/2/19\');">19__NB2Ch/20/10\');">2Ch 20:10__NBAct/24/12\');">Act 24:12__NRAct/24/13\');">13__EN';
stringArray[16] = '__PNBut_when_1__SHBut when</a> Israel came up from Egypt, and __PNwalked_2__SHwalked</a> through the wilderness unto the Red sea, and __PNcame_3__SHcame</a> to Kadesh;__CPBut_when_1__PSBut when__EEThe whole of these messages shew, Jephthah had well studied the book of Moses. His arguments also are very clear and cogent, and his demands reasonable; for he only required that the Ammonites should cease to harass a people who had neither injured them, nor intended to do so.__GHwalked_2__PSwalked__EFNum/14/25\');">Num 14:25__NBDeu/1/40\');">Deu 1:40__NBJos/5/6\');">Jos 5:6__AN__GGcame_3__PScame__FFGen/14/7\');">Gen 14:7__NBNum/13/26\');">Num 13:26__NBNum/20/1\');">Num 20:1__NBDeu/1/46\');">Deu 1:46__EN';
stringArray[17] = 'Then Israel __PNsent_messengers_1__SHsent messengers</a> unto __PNthe_king_2__SHthe king</a> of Edom, saying, Let me, I pray thee, pass through thy land: but the king of Edom would not hearken [thereto]. And in like manner they sent unto the king of Moab: but he would not [consent]: and Israel __PNabode_3__SHabode</a> in Kadesh.__CPsent_messengers_1__PSsent messengers__FFNum/20/14\');">Num 20:14-21__NBDeu/2/4\');">Deu 2:4-8__NRDeu/2/29\');">29__AN__GHthe_king_2__PSthe king__EFDeu/2/9\');">Deu 2:9__AN__GGabode_3__PSabode__FFNum/20/1\');">Num 20:1__NRNum/20/16\');">16__EN';

stringArray[23] = 'So now the LORD God of Israel hath dispossessed the Amorites from before his people Israel, and shouldest thou possess it?__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[24] = '__PNWilt_not_thou_possess_1__SHWilt not thou possess</a> that which __PNChemosh_2__SHChemosh</a> thy god giveth thee to possess? So __PNwhomsoever_3__SHwhomsoever</a> the LORD our God shall drive out from before us, them will we possess.__CPWilt_not_thou_possess_1__PSWilt not thou possess__EE"This is simply an argumentum ad hominem; in which Jephthah argues on this principles recognized by the king of Ammon. As if he had said, ""You suppose that the land which you possess was given you by your god Chemosh; and therefore will not relinquish what you believe you hold by a divine right. Now we know that Jehovah, our God, has given us the land of the Israelites; and therefore we will not give it up."""__GHChemosh_2__PSChemosh__EFNum/21/29\');">Num 21:29__NB1Ki/11/7\');">1Ki 11:7__NBJer/48/7\');">Jer 48:7__NRJer/48/46\');">46__AN__GGwhomsoever_3__PSwhomsoever__FFDeu/9/4\');">Deu 9:4__NRDeu/9/5\');">5__NBDeu/18/12\');">Deu 18:12__NBJos/3/10\');">Jos 3:10__NBPsa/44/2\');">Psa 44:2__NBPsa/78/55\');">Psa 78:55__NBMic/4/5\');">Mic 4:5__EN';
stringArray[25] = 'And now [art] thou any thing better than __PNBalak_1__SHBalak</a> the son of Zippor, king of Moab? did he ever strive against Israel, or did he ever fight against them,__CPBalak_1__PSBalak__FFNum/22/2\');">Num 22:2-21__NBDeu/23/3\');">Deu 23:3__NRDeu/23/4\');">4__NBJos/24/9\');">Jos 24:9__NRJos/24/10\');">10__NBMic/6/5\');">Mic 6:5__EN';

stringArray[29] = 'Then __PNthe_Spirit_1__SHthe Spirit</a> of the LORD came upon __PNJephthah_2__SHJephthah</a>, and he passed over Gilead, and Manasseh, and passed __PNover_Mizpeh_3__SHover Mizpeh</a> of Gilead, and from Mizpeh of Gilead he passed over [unto] the children of Ammon.__CPthe_Spirit_1__PSthe Spirit__FFJdg/3/10\');">Jdg 3:10__NBJdg/6/34\');">Jdg 6:34__NBJdg/13/25\');">Jdg 13:25__NBNum/11/25\');">Num 11:25__NB1Sa/10/10\');">1Sa 10:10__NB1Sa/16/13\');">1Sa 16:13-15__NB1Ch/12/18\');">1Ch 12:18__AN__GHJephthah_2__PSJephthah__FE"""Jephthah seems to have been judge only of north-east Israel."""__GGover_Mizpeh_3__PSover Mizpeh__FFJdg/10/17\');">Jdg 10:17__EN';
stringArray[30] = 'And Jephthah vowed a vow unto the LORD, and said, If thou shalt without fail deliver the children of Ammon into mine hands,__CPRelated_Verses1_1__PSEntire Verse.__FFGen/28/20\');">Gen 28:20__NBNum/30/2\');">Num 30:2-16__NB1Sa/1/11\');">1Sa 1:11__NBEcc/5/1\');">Ecc 5:1__NREcc/5/2\');">2__NREcc/5/4\');">4__NREcc/5/5\');">5__EN';
stringArray[31] = 'Then it shall be, that __PNwhatsoever__etc__1__SHwhatsoever</a> cometh forth of the doors of my house to meet me, when I return in peace from the children of Ammon, __PNshall_surely_2__SHshall surely</a> be the LORD\'S, __PNand_I_will_3__SHand I will</a> offer it up for a burnt offering.__CPwhatsoever__etc__1__PSwhatsoever, etc.__EEHeb. that which cometh forth, which shall come forth.__GHshall_surely_2__PSshall surely__EFLev/27/2\');">Lev 27:2__NRLev/27/3\');">3__NRLev/27/28\');">28__NRLev/27/29\');">29__NB1Sa/1/11\');">1Sa 1:11__NR1Sa/1/28\');">28__NB1Sa/2/18\');">1Sa 2:18__NB1Sa/14/24\');">1Sa 14:24__NR1Sa/14/44\');">44__NBPsa/66/13\');">Psa 66:13__NRPsa/66/14\');">14__AN__GGand_I_will_3__PSand I will__EE"or, or I will, etc. Wehäâleetheehoo ôlah, rather, as Dr. Randolph and others contend, ""and I will offer Him (or to Him, i.e., Jehovah) a burnt offering;"" for hoo may with much more propriety be referred to the person to whom the sacrifice was to be made, than to the thing to be sacrificed. Unless understood in this way, or as the marginal reading, it must have been the vow of a heathen or a madman. If a dog, or other uncleaned animal had met him, he could not have made it a burnt offering; or if his neighbour\'s wife, sons, etc., his vow gave him no right over them. __NALev/27/11\');">Lev 27:11__NRLev/27/12\');">12__NBDeu/23/18\');">Deu 23:18__NBPsa/66/13\');">Psa 66:13__NBIsa/66/3\');">Isa 66:3__AN"</TD></TR>';

stringArray[39] = 'And it came to pass at the end of two months, that she returned unto her father, who __PNdid_with_1__SHdid with</a> her [according] __PNto_his_vow_2__SHto his vow</a> which he had vowed: and she knew no man. And it was a __PNcustom_3__SHcustom</a> in Israel,__CPdid_with_1__PSdid with__EEThat Jephthah did not sacrifice his daughter, but consecrated her to the service of God in the tabernacle, in a state of celibacy, will we imagine be evident from the following consideration:--1. Human sacrifices were ever an abomination to Jehovah, of which Jephthah could not be ignorant; and consequently he would neither have made such a vow, nor carried it into execution. 2. We are expressly told (__NAJdg/11/29\');">Jdg 11:29__AN) that Jephthah was under the influence of the Spirit of God, which would effectually prevent him from embruing his hands in the blood of his own child. 3. He had it in his power to redeem his daughter, (__NALev/27/4\');">Lev 27:4__AN;) and surely his only child must have been of more value than thirty shekles. 4. Besides, who was to perform the horrid rite? Not Jephthah himself, who was no priest, and in whom it would have been most unnatural and inhuman; and the priests would certainly have dissuaded him from it. 5. The sacred historian informs us, that she bewailed her virginity, that she knew no man, and that the Israelit__GHto_his_vow_2__PSto his vow__EF1Sa/1/11\');">1Sa 1:11__NR1Sa/1/22\');">22__NR1Sa/1/24\');">24__NR1Sa/1/28\');">28__NB1Sa/2/18\');">1Sa 2:18__AN__GGcustom_3__PScustom__EEor, ordinance.</TD></TR>';
