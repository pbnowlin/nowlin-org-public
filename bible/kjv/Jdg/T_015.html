<script type="text/javascript">
var stringArray = new Array();
stringArray[1] = 'But it came to pass within a while after, in the time of wheat harvest, that Samson visited his wife with __PNa_kid_1__SHa kid</a>; and he said, __PNI_will_go_2__SHI will go</a> in to my wife into the chamber. But her father would not suffer him to go in.__CPa_kid_1__PSa kid__FFGen/38/17\');">Gen 38:17__NBLuk/15/29\');">Luk 15:29__AN__GHI_will_go_2__PSI will go__EFGen/6/4\');">Gen 6:4__NBGen/29/21\');">Gen 29:21__EN';
stringArray[2] = 'And her father said, __PNI_verily_1__SHI verily</a> thought that thou hadst utterly hated her; therefore __PNI_gave_2__SHI gave</a> her to thy companion: [is] not her younger sister fairer than she? __PNtake_her_3__SHtake her</a>, I pray thee, instead of her.__CPI_verily_1__PSI verily__FFJdg/14/16\');">Jdg 14:16__NRJdg/14/20\');">20__NBAct/26/9\');">Act 26:9__AN__GHI_gave_2__PSI gave__EFJdg/14/20\');">Jdg 14:20__NBGen/38/14\');">Gen 38:14__AN__GGtake_her_3__PStake her__EEHeb. let her be thine.</TD></TR>';
stringArray[3] = 'And Samson said concerning them, __PNNow_shall__etc__1__SHNow shall</a> I be more blameless than the Philistines, though I do them a displeasure.__CPNow_shall__etc__1__PSNow shall, etc.__EEor, Now shall I be blameless from the Philistines, though, etc. __NAJdg/14/15\');">Jdg 14:15__EN';
stringArray[4] = 'And Samson went and __PNcaught_three_1__SHcaught three</a> hundred foxes, and took __PNfirebrands_2__SHfirebrands</a>, and turned tail to tail, and put a firebrand in the midst between two tails.__CPcaught_three_1__PScaught three__EE"Dr. Kennicott and others contend, that for shüâlim, ""foxes,"" we should read shöâlim, ""handfuls,"" or sheaves of corn. But, 1. The word lachad, rendered caught, never signifies simply to get or take but always to catch, seize, or take by assault or stratagem. 2. Though the proposed alteration is sanctioned by seven MSS., yet all the versions are on the other side. 3. Admitting this alteration, it will be difficult to prove that the word shöâl means either a sheaf or a handful of corn in the ear, and straw. It occurs but thrice in Scriptures (__NA1Ki/20/10\');">1Ki 20:10__AN. __NAIsa/40/12\');">Isa 40:12__AN. __NAEze/13/9\');">Eze 13:9__AN): where it evidently means as much as can be contained in the hollow of the hand; but when handfuls of grain in the shock, or sheaves are intended, very different words are used. See __NARth/2/\');">Ruth 2__AN.15, 16, etc. 4. It is not hinted that Samson collected them alone, or in one day; he might have employed many hands and several days in the work. 5. The word shüâl properly denotes the jackal, which travellers describe as an animal in size between the wolf "__GHfirebrands_2__PSfirebrands__FEor, torches.</TD></TR>';
stringArray[5] = 'And when he had set the brands on fire, __PNhe_let_them_go_1__SHhe let [them] go</a> into the standing corn of the Philistines, and burnt up both the shocks, and also the standing corn, with the vineyards [and] olives.__CPhe_let_them_go_1__PShe let them go__FFExd/22/6\');">Exd 22:6__NB2Sa/14/30\');">2Sa 14:30__EN';
stringArray[6] = 'Then the Philistines said, Who hath done this? And they answered, Samson, the son in law of the Timnite, because he had taken his wife, and given her to his companion. And the Philistines came up, __PNand_burnt_1__SHand burnt</a> her and her father with fire.__CPand_burnt_1__PSand burnt__FFJdg/12/1\');">Jdg 12:1__NBJdg/14/15\');">Jdg 14:15__NBPro/22/8\');">Pro 22:8__NB1Th/4/6\');">1Th 4:6__EN';
stringArray[7] = 'And Samson said unto them, __PNThough_1__SHThough</a> ye have done this, yet will I be avenged of you, and after that I will cease.__CPThough_1__PSThough__FFJdg/14/4\');">Jdg 14:4__NRJdg/14/19\');">19__NBRom/12/19\');">Rom 12:19__EN';
stringArray[8] = 'And he smote them hip and thigh with a great slaughter: and he went down and dwelt in the top of the rock Etam.__CPRelated_Verses1_1__PSEntire Verse.__FFIsa/25/10\');">Isa 25:10__NBIsa/63/3\');">Isa 63:3__NRIsa/63/6\');">6__EN';
stringArray[9] = 'Then the Philistines went up, and pitched in Judah, and spread themselves in __PNLehi_1__SHLehi</a>.__CPLehi_1__PSLehi__FFJdg/15/17\');">Jdg 15:17__NRJdg/15/19\');">19__EN';
stringArray[10] = 'And the men of Judah said, Why are ye come up against us? And they answered, To bind Samson are we come up, to do to him as he hath done to us.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[11] = 'Then three thousand men of Judah __PNwent_1__SHwent</a> to the top of the rock Etam, and said to Samson, Knowest thou not that the __PNPhilistines_2__SHPhilistines</a> [are] rulers over us? what [is] this [that] thou hast done unto us? And he said unto them, As they did unto me, so have I done unto them.__CPwent_1__PSwent__EEHeb. went down. the rock Etam. Probably near the town Etam, mentioned in __NA1Ch/4/32\');">1Ch 4:32__AN.__GHPhilistines_2__PSPhilistines__EFJdg/13/1\');">Jdg 13:1__NBJdg/14/4\');">Jdg 14:4__NBDeu/28/13\');">Deu 28:13__NRDeu/28/47\');">47__NRDeu/28/48\');">48__NBPsa/106/41\');">Psa 106:41__EN';
stringArray[12] = 'And they said unto him, We are come down __PNto_bind_thee_1__SHto bind thee</a>, that we may deliver thee into the hand of the Philistines. And Samson said unto them, Swear unto me, that ye will not __PNfall_2__SHfall</a> upon me yourselves.__CPto_bind_thee_1__PSto bind thee__FFMat/27/2\');">Mat 27:2__NBAct/7/25\');">Act 7:25__AN__GHfall_2__PSfall__EFJdg/8/21\');">Jdg 8:21__NB1Ki/2/25\');">1Ki 2:25__NR1Ki/2/34\');">34__EN';
stringArray[13] = 'And they spake unto him, saying, No; but we will bind thee fast, and deliver thee into their hand: but surely we will not kill thee. And they bound him with two new cords, and brought him up from the rock.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[14] = '[And] when he came unto Lehi, __PNthe_Philistines_1__SHthe Philistines</a> shouted against him: and __PNthe_Spirit_2__SHthe Spirit</a> of the LORD came mightily upon him, and __PNthe_cords_3__SHthe cords</a> that [were] upon his arms became as flax that was burnt with fire, and his bands __PNloosed_4__SHloosed</a> from off his hands.__CPthe_Philistines_1__PSthe Philistines__FFJdg/5/30\');">Jdg 5:30__NBJdg/16/24\');">Jdg 16:24__NBExd/14/3\');">Exd 14:3__NRExd/14/5\');">5__NB1Sa/4/5\');">1Sa 4:5__NBJob/20/5\');">Job 20:5__NBMic/7/8\');">Mic 7:8__AN__GHthe_Spirit_2__PSthe Spirit__EFJdg/3/10\');">Jdg 3:10__NBJdg/14/6\');">Jdg 14:6__NRJdg/14/19\');">19__NBZec/4/6\');">Zec 4:6__AN__GGthe_cords_3__PSthe cords__FFJdg/16/9\');">Jdg 16:9__NRJdg/16/12\');">12__NB1Sa/17/35\');">1Sa 17:35__NBPsa/18/34\');">Psa 18:34__NBPsa/118/11\');">Psa 118:11__NBPhl/4/3\');">Phl 4:3__AN__GHloosed_4__PSloosed__FEHeb. were melted.</TD></TR>';
stringArray[15] = 'And he found a __PNnew_jaw_bone_1__SHnew jawbone</a> of an ass, and put forth his hand, and took it, and __PNslew_2__SHslew</a> __PNa_thousand_3__SHa thousand</a> men therewith.__CPnew_jaw_bone_1__PSnew jaw-bone__EEHeb. moist.__GHslew_2__PSslew__EFJdg/3/31\');">Jdg 3:31__NBJdg/4/21\');">Jdg 4:21__NBJdg/7/16\');">Jdg 7:16__NBLev/26/8\');">Lev 26:8__NBJos/23/10\');">Jos 23:10__NB1Sa/14/6\');">1Sa 14:6__NR1Sa/14/14\');">14__NB1Sa/17/49\');">1Sa 17:49__NR1Sa/17/50\');">50__NB1Cr/1/27\');">1Cr 1:27__NR1Cr/1/28\');">28__AN__GGa_thousand_3__PSa thousand__EE"Some would render the words aileph ish, ""a chief;"" but it is alluph, and not aileph, which signifies a chief; besides which, the Hebrew idiom would, even in that case, require it to be ish alluph, ""a man, a chief,"" and not alluph ish, ""a chief, a man."" Add to which, that every version renders it ""a thousand men."""</TD></TR>';
stringArray[16] = 'And Samson said, __PNWith_the_jawbone_1__SHWith the jawbone</a> of an ass, __PNheaps_upon_heaps_2__SHheaps upon heaps</a>, with the jaw of an ass have I slain a thousand men.__CPWith_the_jawbone_1__PSWith the jawbone__EE"There is here a fine paronomasia upon the word chamor, ""an ass,"" which also signifies ""a heap;"" bilchee hachamor, chamor chamorathayim, ""With the jaw-bone of an ass, a heap upon two heaps."""__GHheaps_upon_heaps_2__PSheaps upon heaps__FEHeb. an heap, two heaps.</TD></TR>';
stringArray[17] = 'And it came to pass, when he had made an end of speaking, that he cast away the jawbone out of his hand, and called that place __PNRamath_lehi_1__SHRamathlehi</a>.__CPRamath_lehi_1__PSRamath-lehi__EEthat is, the lifting up of the jaw-bone, or, the casting away of the jaw-bone.</TD></TR>';
stringArray[18] = 'And __PNhe_was_sore_1__SHhe was sore</a> athirst, and called on the LORD, and said, __PNThou_hast_given_2__SHThou hast given</a> this great deliverance into the hand of thy servant: and now __PNshall_3__SHshall</a> I die for thirst, __PNand_fall_4__SHand fall</a> into the hand of __PNthe_uncircumcised_5__SHthe uncircumcised</a>?__CPhe_was_sore_1__PShe was sore__FFJdg/8/4\');">Jdg 8:4__NBPsa/22/14\');">Psa 22:14__NRPsa/22/15\');">15__NBJhn/19/28\');">Jhn 19:28__NB2Cr/4/8\');">2Cr 4:8__NR2Cr/4/9\');">9__AN__GHThou_hast_given_2__PSThou hast given__EFPsa/3/7\');">Psa 3:7__NRPsa/3/8\');">8__NBPsa/18/31\');">Psa 18:31-40__AN__GGshall_3__PSshall__FFGen/32/31\');">Gen 32:31__NB2Cr/12/7\');">2Cr 12:7__NR2Cr/12/8\');">8__AN__GHand_fall_4__PSand fall__EFGen/12/12\');">Gen 12:12__NRGen/12/13\');">13__NBGen/20/11\');">Gen 20:11__NB1Sa/27/1\');">1Sa 27:1__NB2Cr/1/8\');">2Cr 1:8__NR2Cr/1/9\');">9__NBHbr/11/32\');">Hbr 11:32__AN__GGthe_uncircumcised_5__PSthe uncircumcised__FF1Sa/17/26\');">1Sa 17:26__NR1Sa/17/36\');">36__NB2Sa/1/20\');">2Sa 1:20__EN';
stringArray[19] = 'But God clave an hollow place that [was] in __PNthe_jaw_1__SHthe jaw</a>, and __PNthere_came_2__SHthere came</a> water thereout; and when he had drunk, __PNhis_spirit_3__SHhis spirit</a> came again, and he revived: wherefore he called the name thereof __PNEn_hakkore_4__SHEnhakkore</a>, which [is] in Lehi unto this day.__CPthe_jaw_1__PSthe jaw__EEor, Lehi. This reading is certainly preferable: it was in the place called Lehi where a spring was supernaturally opened.__GHthere_came_2__PSthere came__EFIsa/44/3\');">Isa 44:3__AN__GGhis_spirit_3__PShis spirit__FFGen/45/27\');">Gen 45:27__NB1Sa/30/12\');">1Sa 30:12__NBIsa/40/26\');">Isa 40:26__AN__GHEn_hakkore_4__PSEn-hakkore__FESamson gave this expressive name to the miraculously springing water, to be as a memorial of the goodness of God to him. En-hakkore, the well of him that cried, which kept him in remembrance both of his own distress which caused him to cry, and the favour of Jehovah to him in answer to his cry. Many a spring of comfort God opens to his people, which may fitly be called by the name En-hakkore: and this instance of Samson\'s relief should encourage us to trust in God, for when he pleases he can open rivers in high places. __NAIsa/41/17\');">Isa 41:17__NRIsa/41/18\');">18__AN; Samson at first gave the name of Ramath-lehi (the lifting up of the jaw-bone) which denoted him great and triumphant: but now he gives it another name, En-hakkore, which denotes him wanting and dependent.; __NAGen/16/13\');">Gen 16:13__AN,; __NAGen/28/19\');">Gen 28:19__NBGen/30/30\');">Gen 30:30__NBExd/17/15\');">Exd 17:15__NBPsa/34/6\');">Psa 34:6__NBPsa/120/1\');">Psa 120:1__EN';
stringArray[20] = 'And he judged Israel in the days of the Philistines twenty years.__CPRelated_Verses1_1__PSEntire Verse.__EE"__NAJdg/13/1\');">Jdg 13:1__NRJdg/13/5\');">5__NBJdg/16/31\');">Jdg 16:31__AN; ""He seems to have judged South-west Israel during twenty years of their servitude of the Philistines."""</TD></TR>';
