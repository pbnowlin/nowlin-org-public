var stringArray = new Array();
stringArray[1] = '__PNNow_1__SHNow</a> after the death of Joshua it came to pass, that the children of Israel __PNasked_2__SHasked</a> the LORD, saying, Who shall go up for us against the Canaanites first, to fight against them?__CPNow_1__PSNow__FFJos/24/29\');">Jos 24:29__NRJos/24/30\');">30__AN__GHasked_2__PSasked__EFJdg/20/18\');">Jdg 20:18__NRJdg/20/28\');">28__NBExd/28/30\');">Exd 28:30__NBNum/27/21\');">Num 27:21__NB1Sa/22/9\');">1Sa 22:9__NR1Sa/22/10\');">10__NB1Sa/23/9\');">1Sa 23:9__NR1Sa/23/10\');">10__EN';
stringArray[2] = 'And the LORD said, Judah shall go up: behold, I have delivered the land into his hand.__CPRelated_Verses1_1__PSEntire Verse.__FFGen/49/8\');">Gen 49:8-10__NBNum/2/3\');">Num 2:3__NBNum/7/12\');">Num 7:12__NBPsa/78/68\');">Psa 78:68-70__NBHbr/7/14\');">Hbr 7:14__NBRev/5/5\');">Rev 5:5__NBRev/19/11\');">Rev 19:11-16__EN';
stringArray[3] = 'And Judah said unto __PNSimeon_1__SHSimeon</a> his brother, Come up with me into my lot, that we may fight against the Canaanites; and __PNI_likewise_2__SHI likewise</a> will go with thee into thy lot. So Simeon went with him.__CPSimeon_1__PSSimeon__FFGen/29/33\');">Gen 29:33__NBJos/19/1\');">Jos 19:1__AN__GHI_likewise_2__PSI likewise__EFJdg/1/17\');">Jdg 1:17__NB2Sa/10/11\');">2Sa 10:11__EN';
stringArray[4] = 'And Judah went up; and the __PNLORD_1__SHLORD</a> delivered the Canaanites and the Perizzites into their hand: and they slew of them in __PNBezek_2__SHBezek</a> ten thousand men.__CPLORD_1__PSLORD__FFExd/23/28\');">Exd 23:28__NRExd/23/29\');">29__NBDeu/7/2\');">Deu 7:2__NBDeu/9/3\');">Deu 9:3__NBJos/10/8\');">Jos 10:8-10__NBJos/11/6\');">Jos 11:6-8__NB1Sa/14/6\');">1Sa 14:6__NR1Sa/14/10\');">10__NB1Sa/17/46\');">1Sa 17:46__NR1Sa/17/47\');">47__NB1Ki/22/6\');">1Ki 22:6__NR1Ki/22/15\');">15__AN__GHBezek_2__PSBezek__FEEusebius and Jerome mention two villages of this name, near each other, about seventeen miles from Shechem, towards Scythopolis. __NA1Sa/11/8\');">1Sa 11:8__EN';
stringArray[5] = 'And they found Adonibezek in Bezek: and they fought against him, and they slew the Canaanites and the Perizzites.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[6] = 'But Adonibezek fled; and they pursued after him, and caught him, and cut off his thumbs and his great toes.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[7] = 'And Adonibezek said, Threescore and ten kings, having __PNtheir_thumbs_1__SHtheir thumbs</a> and their great toes cut off, __PNgathered_2__SHgathered</a> [their meat] under my table:__PN_as_I_have_3__SH as I have</a> done, so God hath requited me. And they brought him to Jerusalem, and there he died.__CPtheir_thumbs_1__PStheir thumbs__EE"Heb. the thumbs of their hands and of their feet. This was not an unusual act of cruelty in ancient times towards enemies.--Ælian informs us, that in after ages ""the Athenians, at the instigation of Cleon, son of Cleoenetus, made a decree that all the inhabitants of the island of Ægina should have the thumb cut off from the right hand, so that they might ever after be disabled from holding a spear, yet might handle an oar."" It was a custom among those Romans who did not like a military life, to cut off their thumbs, that they might be incapable of serving in the army; and for the same reason, parents sometimes cut off the thumbs of their children."__GHgathered_2__PSgathered__FEor, gleaned.__GG_as_I_have_3__PS as I have__FFExd/21/23\');">Exd 21:23-25__NBLev/24/19\');">Lev 24:19-21__NB1Sa/15/33\');">1Sa 15:33__NBIsa/33/1\');">Isa 33:1__NBMat/7/1\');">Mat 7:1__NRMat/7/2\');">2__NBLuk/6/37\');">Luk 6:37__NRLuk/6/38\');">38__NBRom/2/15\');">Rom 2:15__NBJam/2/13\');">Jam 2:13__NBRev/13/10\');">Rev 13:10__NBRev/16/6\');">Rev 16:6__EN';
stringArray[8] = 'Now the children of Judah had fought against Jerusalem, and had taken it, and smitten it with the edge of the sword, and set the city on fire.__CPRelated_Verses1_1__PSEntire Verse.__FFJdg/1/21\');">Jdg 1:21__NBJos/15/63\');">Jos 15:63__EN';
stringArray[9] = 'And __PNafterward_1__SHafterward</a> the children of Judah went down to fight against the Canaanites, that dwelt in the mountain, and in the south, and in the __PNvalley_2__SHvalley</a>.__CPafterward_1__PSafterward__FFJos/10/36\');">Jos 10:36__NBJos/11/21\');">Jos 11:21__NBJos/15/13\');">Jos 15:13-20__AN__GHvalley_2__PSvalley__FEor, low country.</TD></TR>';
stringArray[10] = 'And Judah went against the Canaanites that dwelt in Hebron: (now the name of Hebron before [was] __PNKirjath_arba_1__SHKirjatharba</a>:) and they slew __PNSheshai_2__SHSheshai</a>, and Ahiman, and Talmai.__CPKirjath_arba_1__PSKirjath-arba__FFJos/14/15\');">Jos 14:15__AN__GHSheshai_2__PSSheshai__EFJdg/1/20\');">Jdg 1:20__NBNum/13/22\');">Num 13:22__NRNum/13/33\');">33__NBJos/15/13\');">Jos 15:13__NRJos/15/14\');">14__NBPsa/33/16\');">Psa 33:16__NRPsa/33/17\');">17__NBEcc/9/11\');">Ecc 9:11__NBJer/9/23\');">Jer 9:23__EN';
stringArray[11] = 'And from thence he went against the inhabitants of __PNDebir_1__SHDebir</a>: and the name of Debir before [was] Kirjathsepher:__CPDebir_1__PSDebir__FFJos/10/38\');">Jos 10:38__NRJos/10/39\');">39__NBJos/15/15\');">Jos 15:15__EN';
stringArray[12] = '__PNAnd_Caleb_1__SHAnd Caleb</a> said, He that smiteth Kirjathsepher, and taketh it, __PNto_him_2__SHto him</a> will I give Achsah my daughter to wife.__CPAnd_Caleb_1__PSAnd Caleb__EEThe whole of this account is found in __NAJos/15/13\');">Jos 15:13-19__AN, and seems to be inserted here by way of recapitulation. __NAJos/15/16\');">Jos 15:16__NRJos/15/17\');">17__NB1Sa/17/25\');">1Sa 17:25__NB1Sa/18/23\');">1Sa 18:23__AN__GHto_him_2__PSto him__FEIn ancient times fathers assumed an absolute right over their children, especially in disposing of them in marriage; and it was customary for a king or great man to promise his daughter in marriage to him who should take a city, etc.</TD></TR>';
stringArray[13] = 'And Othniel the son of Kenaz, Caleb\'s younger brother, took it: and he gave him Achsah his daughter to wife.__CPRelated_Verses1_1__PSEntire Verse.__FFJdg/3/9\');">Jdg 3:9__EN';
stringArray[14] = '__PNAnd_it_came_1__SHAnd it came</a> to pass, when she came [to him], that she moved him to ask of her father a field: __PNand_she_lighted_2__SHand she lighted</a> from off [her] ass; and Caleb said unto her, What wilt thou?__CPAnd_it_came_1__PSAnd it came__FFJos/15/18\');">Jos 15:18__NRJos/15/19\');">19__AN__GHand_she_lighted_2__PSand she lighted__FE"Watitznach, ""she hastily or suddenly alighted,"" as if she had forgotten something, or was about to return."</TD></TR>';
stringArray[15] = 'And she said unto him, Give me __PNa_blessing_1__SHa blessing</a>: for thou hast given me __PNa_south_land_2__SHa south land</a>; __PNgive_me_also_springs_of_water_3__SHgive me also springs of water</a>. And Caleb gave her the upper springs and the nether springs.__CPa_blessing_1__PSa blessing__FFGen/33/11\');">Gen 33:11__NB1Sa/25/18\');">1Sa 25:18__NR1Sa/25/27\');">27__NB2Cr/9/5\');">2Cr 9:5__AN; *marg:; __NAHbr/6/7\');">Hbr 6:7__NB1Pe/3/9\');">1Pe 3:9__AN__GHa_south_land_2__PSa south land__FEWhich was probably dry, or very ill watered.__GGgive_me_also_springs_of_water_3__PSgive me also springs of water__EELet me have some fields with brooks, or wells already digged.</TD></TR>';
stringArray[16] = 'And the children of __PNthe_Kenite_1__SHthe Kenite</a>, __PNMoses_2__SHMoses</a>\' father in law, went up out of the __PNcity_of_palm_3__SHcity of palm</a> trees with the children of Judah into the wilderness of Judah, __PNwhich_4__SHwhich</a> [lieth] in the south of Arad; and __PNthey_went_5__SHthey went</a> and dwelt among the people.__CPthe_Kenite_1__PSthe Kenite__FFJdg/4/11\');">Jdg 4:11__NRJdg/4/17\');">17__NBNum/10/29\');">Num 10:29-32__NBNum/24/21\');">Num 24:21__NRNum/24/22\');">22__NB1Sa/15/6\');">1Sa 15:6__NB1Ch/2/15\');">1Ch 2:15__NBJer/35/2\');">Jer 35:2__AN__GHMoses_2__PSMoses__EFExd/3/1\');">Exd 3:1__NBExd/4/18\');">Exd 4:18__NBExd/18/1\');">Exd 18:1__NRExd/18/7\');">7__NRExd/18/12\');">12__NRExd/18/14\');">14-17__NRExd/18/27\');">27__NBNum/10/29\');">Num 10:29__AN__GGcity_of_palm_3__PScity of palm__FFJdg/3/13\');">Jdg 3:13__NBDeu/34/3\');">Deu 34:3__NB2Ch/28/16\');">2Ch 28:16__AN__GHwhich_4__PSwhich__EFNum/21/1\');">Num 21:1__NBJos/12/14\');">Jos 12:14__AN__GGthey_went_5__PSthey went__FFNum/10/29\');">Num 10:29-32__NB1Sa/15/6\');">1Sa 15:6__EN';
stringArray[17] = '__PNAnd_Judah_1__SHAnd Judah</a> went with Simeon his brother, and they slew the Canaanites that inhabited __PNZephath_2__SHZephath</a>, and utterly destroyed it. And the name of the city was called __PNHormah_3__SHHormah</a>.__CPAnd_Judah_1__PSAnd Judah__EESee on __NAJdg/1/3\');">Jdg 1:3__AN__GHZephath_2__PSZephath__EF2Ch/14/10\');">2Ch 14:10__AN; Zephathah.__GGHormah_3__PSHormah__FFNum/14/45\');">Num 14:45__NBNum/21/3\');">Num 21:3__NBJos/19/4\');">Jos 19:4__EN';
stringArray[18] = '__PNAlso_Judah_1__SHAlso Judah</a> took __PNGaza_2__SHGaza</a> with the coast thereof, and Askelon with the coast thereof, and Ekron with the coast thereof.__CPAlso_Judah_1__PSAlso Judah__EE"There is the following remarkable variation here in the Septuagint: [Kai ouk ekléronomésen Ioudas tén Gazan, oude ta horia autés; oude tén Askalóna, oude ta horia autés; kai tén Akkarón, oude ta horia autés; tén Azóton, oude ta perisporia autés.] ""But Judah did not possess Gaza, nor the coasts thereof; nor Askelon, nor the coasts thereof; nor Ekron, nor the coasts thereof; nor Ashdod, nor the coasts thereof."" Procopius and Augustine read the same; and Josephus (Ant. 1. v. c. 2) says that the Israelites only took Askelon and Ashdod, but not Gaza or Ekron; and from __NAJdg/3/3\');">Jdg 3:3__AN, and the whole succeeding history, it appears that these cities were not in the possession of the Israelites, but of the Philistines."__GHGaza_2__PSGaza__EFJdg/3/3\');">Jdg 3:3__NBJdg/16/1\');">Jdg 16:1__NRJdg/16/2\');">2__NRJdg/16/21\');">21__NBExd/23/31\');">Exd 23:31__NBJos/11/22\');">Jos 11:22__NBJos/13/3\');">Jos 13:3__NBJos/15/45\');">Jos 15:45-47__NB1Sa/6/17\');">1Sa 6:17__EN';
stringArray[19] = 'And __PNthe_LORD_1__SHthe LORD</a> was with Judah; and __PNhe_drave__etc__2__SHhe drave</a> out [the inhabitants of] the mountain; but could not drive out the inhabitants of the valley, because they had __PNchariots_3__SHchariots</a> of iron.__CPthe_LORD_1__PSthe LORD__FFJdg/1/2\');">Jdg 1:2__NBJdg/6/12\');">Jdg 6:12__NRJdg/6/13\');">13__NBGen/39/2\');">Gen 39:2__NRGen/39/21\');">21__NBJos/1/5\');">Jos 1:5__NRJos/1/9\');">9__NBJos/14/12\');">Jos 14:12__NB2Sa/5/10\');">2Sa 5:10__NB2Ki/18/7\');">2Ki 18:7__NBPsa/46/7\');">Psa 46:7__NRPsa/46/11\');">11__NBPsa/60/12\');">Psa 60:12__NBEcc/9/11\');">Ecc 9:11__NBIsa/7/14\');">Isa 7:14__NBIsa/8/10\');">Isa 8:10__NBIsa/41/10\');">Isa 41:10__NRIsa/41/14\');">14__NRIsa/41/15\');">15__NBMat/1/23\');">Mat 1:23__NBRom/8/31\');">Rom 8:31__AN__GHhe_drave__etc__2__PShe drave, etc.__FEor he possessed the mountain. but could. Not because the iron chariots were too strong for Omnipotence, or because he refused to help them; but because their courage and faith failed when they saw them. __NAJdg/1/27\');">Jdg 1:27-32__NBJos/7/12\');">Jos 7:12__NBMat/14/30\');">Mat 14:30__NRMat/14/31\');">31__NBMat/17/19\');">Mat 17:19__NRMat/17/20\');">20__NBPhl/4/13\');">Phl 4:13__AN__GGchariots_3__PSchariots__FFExd/14/7\');">Exd 14:7-31__NBJos/11/1\');">Jos 11:1-9__NBJos/17/16\');">Jos 17:16-18__NBPsa/46/9\');">Psa 46:9__EN';
stringArray[20] = 'And __PNthey_gave_1__SHthey gave</a> Hebron unto Caleb, as Moses said: and he expelled thence __PNthe_three_sons_2__SHthe three sons</a> of Anak.__CPthey_gave_1__PSthey gave__FFNum/14/24\');">Num 14:24__NBDeu/1/36\');">Deu 1:36__NBJos/14/9\');">Jos 14:9-14__NBJos/15/13\');">Jos 15:13__NRJos/15/14\');">14__NBJos/21/11\');">Jos 21:11__NRJos/21/12\');">12__AN__GHthe_three_sons_2__PSthe three sons__EFJdg/1/10\');">Jdg 1:10__NBNum/13/22\');">Num 13:22__EN';
stringArray[21] = 'And the children of Benjamin did not drive out the Jebusites that inhabited Jerusalem; but the Jebusites dwell with the children of Benjamin in Jerusalem unto this day.__CPRelated_Verses1_1__PSEntire Verse.__FFJdg/19/10\');">Jdg 19:10-12__NBJos/15/63\');">Jos 15:63__NBJos/18/11\');">Jos 18:11-28__NB2Sa/5/6\');">2Sa 5:6-9__EN';
stringArray[22] = 'And __PNthe_house_1__SHthe house</a> of Joseph, they also went up against Bethel: and __PNthe_LORD_2__SHthe LORD</a> [was] with them.__CPthe_house_1__PSthe house__FFNum/1/10\');">Num 1:10__NRNum/1/32\');">32__NBJos/14/4\');">Jos 14:4__NBJos/16/1\');">Jos 16:1-4__NB1Ch/7/29\');">1Ch 7:29__NBRev/7/8\');">Rev 7:8__AN__GHthe_LORD_2__PSthe LORD__EFJdg/1/19\');">Jdg 1:19__NBGen/49/24\');">Gen 49:24__NB2Ki/18/7\');">2Ki 18:7__EN';
stringArray[23] = 'And the house of Joseph __PNsent_1__SHsent</a> to descry Bethel. (Now the name of the city before [was] __PNLuz_2__SHLuz</a>.)__CPsent_1__PSsent__FFJdg/18/2\');">Jdg 18:2__NBJos/2/1\');">Jos 2:1__NBJos/7/2\');">Jos 7:2__AN__GHLuz_2__PSLuz__EFGen/28/19\');">Gen 28:19__NBGen/35/6\');">Gen 35:6__NBGen/48/3\');">Gen 48:3__EN';
stringArray[24] = 'And the spies saw a man come forth out of the city, and they said unto him, Shew us, we pray thee, the entrance into the city, and __PNwe_will_1__SHwe will</a> shew thee mercy.__CPwe_will_1__PSwe will__FFJos/2/12\');">Jos 2:12-14__NB1Sa/30/15\');">1Sa 30:15__EN';
stringArray[25] = 'And when he shewed them the entrance into the city, __PNthey_smote_1__SHthey smote</a> the city with the edge of the sword; but they let go the man and all his family.__CPthey_smote_1__PSthey smote__FFJos/6/22\');">Jos 6:22-25__EN';
stringArray[26] = 'And the man went into __PNthe_land_1__SHthe land</a> of the Hittites, and built a city, and called the name thereof Luz: which [is] the name thereof unto this day.__CPthe_land_1__PSthe land__FF2Ki/7/6\');">2Ki 7:6__NB2Ch/1/17\');">2Ch 1:17__EN';
stringArray[27] = 'Neither did __PNManasseh_1__SHManasseh</a> drive out [the inhabitants of] Bethshean and her towns, nor __PNTaanach_2__SHTaanach</a> and her towns, nor the inhabitants of Dor and her towns, nor the inhabitants of Ibleam and her towns, nor the inhabitants of Megiddo and her towns: but __PNthe_Canaanites_3__SHthe Canaanites</a> would dwell in that land.__CPManasseh_1__PSManasseh__FFJos/17/11\');">Jos 17:11-13__AN__GHTaanach_2__PSTaanach__EFJdg/5/19\');">Jdg 5:19__NBJos/21/25\');">Jos 21:25__AN__GGthe_Canaanites_3__PSthe Canaanites__FFExd/23/32\');">Exd 23:32__NBDeu/7/2\');">Deu 7:2__NB1Sa/15/9\');">1Sa 15:9__NBPsa/106/34\');">Psa 106:34__NRPsa/106/35\');">35__NBJer/48/10\');">Jer 48:10__EN';
stringArray[28] = 'And it came to pass, when Israel was strong, that they put the Canaanites to tribute, and did not utterly drive them out.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[29] = 'Neither did Ephraim drive out the Canaanites that dwelt in Gezer; but the Canaanites dwelt in Gezer among them.__CPRelated_Verses1_1__PSEntire Verse.__FFJos/16/10\');">Jos 16:10__NB1Ki/9/16\');">1Ki 9:16__EN';
stringArray[30] = 'Neither did Zebulun drive out the inhabitants of __PNKitron_1__SHKitron</a>, nor the inhabitants of __PNNahalol_2__SHNahalol</a>; but the Canaanites dwelt among them, and became tributaries.__CPKitron_1__PSKitron__EE"The Talmudists say Kitron is ""tzippor,"" that is, Sepphoris, or Diocæsarea, a celebrated city of Galilee, now the village Safoury, situated in the plain of Esdraelon, twenty miles (north-west) from Tiberias, according to Benjamin of Tudela."__GHNahalol_2__PSNahalol__EFJos/19/15\');">Jos 19:15__EN';
stringArray[31] = 'Neither did __PNAsher_1__SHAsher</a> drive out the inhabitants of __PNAccho_2__SHAccho</a>, nor the inhabitants of __PNZidon_3__SHZidon</a>, nor of Ahlab, nor of __PNAchzib_4__SHAchzib</a>, nor of Helbah, nor of Aphik, nor of Rehob:__CPAsher_1__PSAsher__FFJos/19/24\');">Jos 19:24-30__AN__GHAccho_2__PSAccho__FEAccho, the Ptolemais of the Greeks and Romans, and called Saint John of Acre by the Crusaders, is situated on the Mediterranean, in a fine plain, at the north angle of a bay to which it gives name, and which extends in a semicircle of three leagues as far as Carmel, and nine leagues from Tyre.__GGZidon_3__PSZidon__EEAnother celebrated city of Phoenicia, now Saidè, situated in a fine country on the Mediterranean, 400 stadia from Berytus, and 200 (north) from Tyre, according to Strabo, one day\'s journey from Paneas, according to Josephus, and sixty-six miles from Damascus, according to Abulfeda.__GHAchzib_4__PSAchzib__FEOr, Ecdippa, now Zib, nine miles north, from Accho.</TD></TR>';
stringArray[32] = 'But the Asherites dwelt among the Canaanites, the inhabitants of the land: for they did not drive them out.__CPRelated_Verses1_1__PSEntire Verse.__FFPsa/106/34\');">Psa 106:34__NRPsa/106/35\');">35__EN';
stringArray[33] = 'Neither did __PNNaphtali_1__SHNaphtali</a> drive out the inhabitants of Bethshemesh, nor the inhabitants of Bethanath; but __PNhe_dwelt_2__SHhe dwelt</a> among the Canaanites, the inhabitants of the land: nevertheless the inhabitants of Bethshemesh and of Bethanath __PNbecame_3__SHbecame</a> tributaries unto them.__CPNaphtali_1__PSNaphtali__FFJos/19/32\');">Jos 19:32-38__AN__GHhe_dwelt_2__PShe dwelt__EFJdg/1/32\');">Jdg 1:32__AN__GGbecame_3__PSbecame__FFJdg/1/30\');">Jdg 1:30__NRJdg/1/35\');">35__NBPsa/18/24\');">Psa 18:24__EN';
stringArray[34] = 'And the Amorites forced the children of Dan into the mountain: for they would not suffer them to come down to the valley:__CPRelated_Verses1_1__PSEntire Verse.__FFJdg/18/1\');">Jdg 18:1__NBJos/19/47\');">Jos 19:47__EN';
stringArray[35] = 'But the Amorites would dwell in mount Heres in __PNAijalon_1__SHAijalon</a>, and in __PNShaalbim_2__SHShaalbim</a>: yet the hand of the house of Joseph __PNprevailed_3__SHprevailed</a>, so that they became tributaries.__CPAijalon_1__PSAijalon__FFJdg/12/12\');">Jdg 12:12__NBJos/10/12\');">Jos 10:12__AN__GHShaalbim_2__PSShaalbim__EFJos/19/42\');">Jos 19:42__NB1Ki/4/9\');">1Ki 4:9__AN__GGprevailed_3__PSprevailed__EEHeb. was heavy.</TD></TR>';
