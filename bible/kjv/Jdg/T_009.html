var stringArray = new Array();
stringArray[1] = 'And __PNAbimelech_1__SHAbimelech</a> the son of Jerubbaal went to __PNShechem_2__SHShechem</a> unto his mother\'s brethren, and __PNcommuned_3__SHcommuned</a> with them, and with all the family of the house of his mother\'s father, saying,__CPAbimelech_1__PSAbimelech__FFJdg/8/31\');">Jdg 8:31__AN__GHShechem_2__PSShechem__EFGen/33/18\');">Gen 33:18__NBGen/34/2\');">Gen 34:2__NB1Ki/12/1\');">1Ki 12:1__AN__GGcommuned_3__PScommuned__FF2Sa/15/6\');">2Sa 15:6__NB1Ki/12/3\');">1Ki 12:3__NR1Ki/12/20\');">20__NBPsa/83/2\');">Psa 83:2-4__NBJer/18/18\');">Jer 18:18__EN';
stringArray[2] = 'Speak, I pray you, in the ears of all the men of Shechem, __PNWhether__etc__1__SHWhether</a> [is] better for you, either that all the sons of Jerubbaal, [which are] __PNthreescore_2__SHthreescore</a> and ten persons, reign over you, or that one reign over you? remember also that I [am] __PNyour_bone_3__SHyour bone</a> and your flesh.__CPWhether__etc__1__PSWhether, etc.__EEHeb. What is good? whether, etc.__GHthreescore_2__PSthreescore__EFJdg/8/30\');">Jdg 8:30__AN__GGyour_bone_3__PSyour bone__FFGen/29/14\');">Gen 29:14__NB2Sa/19/13\');">2Sa 19:13__NB1Ch/11/1\');">1Ch 11:1__NBEph/5/30\');">Eph 5:30__NBHbr/2/14\');">Hbr 2:14__EN';
stringArray[3] = 'And his mother\'s brethren __PNspake_1__SHspake</a> of him in the ears of all the men of Shechem all these words: and their hearts inclined __PNto_follow_2__SHto follow</a> Abimelech; for they said, He [is] __PNour_brother_3__SHour brother</a>.__CPspake_1__PSspake__FFPsa/10/3\');">Psa 10:3__NBPro/1/11\');">Pro 1:11-14__AN__GHto_follow_2__PSto follow__FEHeb. after.__GGour_brother_3__PSour brother__FFGen/29/15\');">Gen 29:15__EN';
stringArray[4] = 'And they gave him threescore and ten [pieces] of silver out of the __PNhouse_1__SHhouse</a> of Baalberith, wherewith Abimelech hired __PNvain__etc__2__SHvain</a> and light persons, which followed him.__CPhouse_1__PShouse__FFJdg/9/46\');">Jdg 9:46-49__NBJdg/8/33\');">Jdg 8:33__AN__GHvain__etc__2__PSvain, etc.__FE"Anashim raikim oophochozim, ""worthless and dissolute men;"" persons who were living on the public, and had nothing to lose. Such was the foundation of his Babel government. By a cunning management of such unprincipled men most revolutions are brought about. __NAJdg/11/3\');">Jdg 11:3__NB1Sa/22/2\');">1Sa 22:2__NB2Ch/13/7\');">2Ch 13:7__NBJob/30/8\');">Job 30:8__NBPro/12/11\');">Pro 12:11__NBAct/17/5\');">Act 17:5__AN"</TD></TR>';
stringArray[5] = 'And he went unto his father\'s house __PNat_Ophrah_1__SHat Ophrah</a>, and __PNslew_2__SHslew</a> his brethren the sons of Jerubbaal, [being] threescore and ten persons, upon one stone: notwithstanding yet Jotham the youngest son of Jerubbaal was left; for he hid himself.__CPat_Ophrah_1__PSat Ophrah__FFJdg/6/24\');">Jdg 6:24__AN__GHslew_2__PSslew__EF2Ki/10/17\');">2Ki 10:17__NB2Ki/11/1\');">2Ki 11:1__NR2Ki/11/2\');">2__NB2Ch/21/4\');">2Ch 21:4__NBMat/2/16\');">Mat 2:16__NRMat/2/20\');">20__EN';
stringArray[6] = 'And all the men of Shechem gathered together, and all __PNthe_house_1__SHthe house</a> of __PNMillo_2__SHMillo</a>, and went, and made Abimelech king, by the __PNplain_3__SHplain</a> of the pillar that [was] in Shechem.__CPthe_house_1__PSthe house__FF2Sa/5/9\');">2Sa 5:9__NB2Ki/12/20\');">2Ki 12:20__AN__GHMillo_2__PSMillo__FEProbably the name of a person of note in Shechem.__GGplain_3__PSplain__EEor, oak. __NAJos/24/26\');">Jos 24:26__NB1Ki/12/1\');">1Ki 12:1__NR1Ki/12/20\');">20__NR1Ki/12/25\');">25__EN';
stringArray[7] = 'And when they told [it] to Jotham, he went and stood in the top of __PNmount_Gerizim_1__SHmount Gerizim</a>, and lifted up his voice, and cried, and said unto them, __PNHearken_2__SHHearken</a> unto me, ye men of Shechem, that God may hearken unto you.__CPmount_Gerizim_1__PSmount Gerizim__FFDeu/11/29\');">Deu 11:29__NBDeu/27/12\');">Deu 27:12__NBJos/8/33\');">Jos 8:33__NBJhn/4/20\');">Jhn 4:20__AN__GHHearken_2__PSHearken__EFPsa/18/40\');">Psa 18:40__NRPsa/18/41\');">41__NBPsa/50/15\');">Psa 50:15-21__NBPro/1/28\');">Pro 1:28__NRPro/1/29\');">29__NBPro/21/13\');">Pro 21:13__NBPro/28/9\');">Pro 28:9__NBIsa/1/15\');">Isa 1:15__NBIsa/58/6\');">Isa 58:6-10__NBMat/18/26\');">Mat 18:26-34__NBJam/2/13\');">Jam 2:13__EN';
stringArray[8] = '__PNThe_trees_1__SHThe trees</a> went forth [on a time] to anoint a king over them; and they said unto the __PNolive_tree_2__SHolive tree</a>, __PNReign_3__SHReign</a> thou over us.__CPThe_trees_1__PSThe trees__EEThis is the most ancient fable or apologue extant; and is extremely beautiful, apposite, and intelligible. __NA2Ki/14/9\');">2Ki 14:9__NBEze/17/3\');">Eze 17:3-10__NBDan/4/10\');">Dan 4:10-18__AN__GHolive_tree_2__PSolive tree__FEThe zayith, or olive tree, in the Linnean system, is a genus of the diandra monogynia class of plants. It is of a moderate height, and grows best in sunny places. Its trunk is knotty; bark smooth, of an ash colour: wood solid and yellowish; leaves oblong, almost like those of the willow, of a dark green colour on the upper side, and whitish below. In June it puts forth white flowers, growing in bunches, each of one piece, widening towards the top, and dividing into four parts. After this succeeds the fruit, which is oblong and plump; first green, then pale, and when quite ripe, black. Within it is enclosed a hard stone, filled with oblong seeds. It was the most useful of all trees in the forest; as the bramble was the meanest and most worthless.__GGReign_3__PSReign__FFJdg/8/22\');">Jdg 8:22__NRJdg/8/23\');">23__EN';
stringArray[9] = 'But the olive tree said unto them, Should I leave my fatness, __PNwherewith_1__SHwherewith</a> by me they honour __PNGod_2__SHGod</a> and man, and go __PNto_be_promoted_over_the_trees_3__SHto be promoted over the trees</a>?__CPwherewith_1__PSwherewith__FFExd/29/2\');">Exd 29:2__NRExd/29/7\');">7__NBExd/35/14\');">Exd 35:14__NBLev/2/1\');">Lev 2:1__NB1Ki/19/15\');">1Ki 19:15__NR1Ki/19/16\');">16__NBPsa/89/20\');">Psa 89:20__NBPsa/104/15\');">Psa 104:15__NBAct/4/27\');">Act 4:27__NBAct/10/38\');">Act 10:38__NB1Jo/2/20\');">1Jo 2:20__AN__GHGod_2__PSGod__FEElohim, rather gods; the parable being adapted to the idolatrous Shechemites.__GGto_be_promoted_over_the_trees_3__PSto be promoted over the trees__EEHeb. up and down for other trees. __NAJob/1/7\');">Job 1:7__NBJob/2/2\');">Job 2:2__EN';
stringArray[10] = 'And the trees said to the fig tree, Come thou, [and] reign over us.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[11] = 'But the fig tree said unto them, Should I forsake my sweetness, and my good fruit, and go to be promoted over the trees?__CPRelated_Verses1_1__PSEntire Verse.__FFLuk/13/6\');">Luk 13:6__NRLuk/13/7\');">7__EN';
stringArray[12] = 'Then said the trees unto the vine, Come thou, [and] reign over us.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[13] = 'And the vine said unto them, Should I leave my wine, which __PNcheereth_1__SHcheereth</a> God and man, and go to be promoted over the trees?__CPcheereth_1__PScheereth__FFNum/15/5\');">Num 15:5__NRNum/15/7\');">7__NRNum/15/10\');">10__NBPsa/104/15\');">Psa 104:15__NBPro/31/6\');">Pro 31:6__NBEcc/10/19\');">Ecc 10:19__EN';
stringArray[14] = 'Then said all the trees unto the __PNbramble_1__SHbramble</a>, Come thou, [and] reign over us.__CPbramble_1__PSbramble__EEor, thistle. __NA2Ki/14/9\');">2Ki 14:9__EN';
stringArray[15] = 'And the bramble said unto the trees, If in truth ye anoint me king over you, [then] come [and] put your trust in my __PNshadow_1__SHshadow</a>: and if not, __PNlet_fire_2__SHlet fire</a> come out of the bramble, and devour __PNthe_cedars_3__SHthe cedars</a> of Lebanon.__CPshadow_1__PSshadow__FFIsa/30/2\');">Isa 30:2__NBDan/4/12\');">Dan 4:12__NBHsa/14/7\');">Hsa 14:7__NBMat/13/32\');">Mat 13:32__AN__GHlet_fire_2__PSlet fire__EFJdg/9/20\');">Jdg 9:20__NRJdg/9/49\');">49__NBNum/21/28\');">Num 21:28__NBIsa/1/31\');">Isa 1:31__NBEze/19/14\');">Eze 19:14__AN__GGthe_cedars_3__PSthe cedars__FF2Ki/14/9\');">2Ki 14:9__NBPsa/104/16\');">Psa 104:16__NBIsa/2/13\');">Isa 2:13__NBIsa/37/24\');">Isa 37:24__NBEze/31/3\');">Eze 31:3__EN';
stringArray[16] = 'Now therefore, if ye have done truly and sincerely, in that ye have made Abimelech king, and if ye have dealt well with Jerubbaal and his house, and have done unto him __PNaccording_1__SHaccording</a> to the deserving of his hands;__CPaccording_1__PSaccording__FFJdg/8/35\');">Jdg 8:35__EN';
stringArray[17] = '(For my father __PNfought_1__SHfought</a> for you, and __PNadventured_his_life_2__SHadventured his life</a> far, and delivered you out of the hand of Midian:__CPfought_1__PSfought__FFJdg/7/1\');">Jdg 7:1-25__NBJdg/8/4\');">Jdg 8:4-10__AN__GHadventured_his_life_2__PSadventured his life__FEHeb. cast his life. __NAEst/4/16\');">Est 4:16__NBRom/5/8\');">Rom 5:8__NBRom/16/4\');">Rom 16:4__NBRev/12/11\');">Rev 12:11__EN';
stringArray[18] = 'And ye __PNare_risen_1__SHare risen</a> up against my father\'s house this day, and have slain his sons, threescore and ten persons, upon one stone, and have made __PNAbimelech_2__SHAbimelech</a>, the son of his maidservant, king over the men of Shechem, because he [is] your brother;)__CPare_risen_1__PSare risen__FFJdg/9/5\');">Jdg 9:5__NRJdg/9/6\');">6__NBJdg/8/35\');">Jdg 8:35__NBPsa/109/4\');">Psa 109:4__AN__GHAbimelech_2__PSAbimelech__EFJdg/9/6\');">Jdg 9:6__NRJdg/9/14\');">14__NBJdg/8/31\');">Jdg 8:31__EN';
stringArray[19] = 'If ye then have dealt truly and sincerely with Jerubbaal and with his house this day, [then] __PNrejoice_1__SHrejoice</a> ye in Abimelech, and let him also rejoice in you:__CPrejoice_1__PSrejoice__FFIsa/8/6\');">Isa 8:6__NBPhl/3/3\');">Phl 3:3__NBJam/4/16\');">Jam 4:16__EN';
stringArray[20] = 'But if not, __PNlet_fire_come_out_1__SHlet fire come out</a> from Abimelech, and devour the men of Shechem, and the house of Millo; and let fire come out from the men of Shechem, and from the house of Millo, and devour Abimelech.__CPlet_fire_come_out_1__PSlet fire come out__FFJdg/9/15\');">Jdg 9:15__NRJdg/9/23\');">23__NRJdg/9/56\');">56__NRJdg/9/57\');">57__NBJdg/7/22\');">Jdg 7:22__NB2Ch/20/22\');">2Ch 20:22__NR2Ch/20/23\');">23__NBPsa/21/9\');">Psa 21:9__NRPsa/21/10\');">10__NBPsa/28/4\');">Psa 28:4__NBPsa/52/1\');">Psa 52:1-5__NBPsa/120/3\');">Psa 120:3__NRPsa/120/4\');">4__NBPsa/140/10\');">Psa 140:10__EN';
stringArray[21] = 'And Jotham ran away, and fled, and went to __PNBeer_1__SHBeer</a>, and dwelt there, for fear of Abimelech his brother.__CPBeer_1__PSBeer__EEProbably the Beer mentioned by Mr. Maundrell, three hours and a half, or about ten miles, north of Jerusalem, towards Shechem. It is situated toward the south, on an easy declivity; and has a fountain of excellent water at the bottom of the hill, from which it has taken its name. Close to the well are the mouldering walls of a ruined khan; and on the summit of the hill two large arches still remain of a ruined convent. Dr. Richardson says, that it seems to have been once a place of considerable consequence. __NANum/21/16\');">Num 21:16__NBJos/19/8\');">Jos 19:8__NB2Sa/20/14\');">2Sa 20:14__EN';
stringArray[22] = 'When Abimelech had reigned three years over Israel,__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[23] = 'Then __PNGod_3__SHGod</a> sent an evil spirit between Abimelech and the men of Shechem; and the men of Shechem __PNdealt_4__SHdealt</a> treacherously with Abimelech:__CPRelated_Verses1_1__PSEntire Verse.__EEA. M. 2771. B.C. 1233.__GHRelated_Verses2_2__PSEntire Verse.__FEAn. Ex. Is. 258.__GGGod_3__PSGod__EEThat is, God permitted the evil spirit of jealousy, treachery, and discord, to break out between Abimelech and the Shechemites. __NAJdg/9/15\');">Jdg 9:15__NRJdg/9/20\');">20__NB1Sa/16/14\');">1Sa 16:14-16__NB1Sa/18/9\');">1Sa 18:9__NR1Sa/18/10\');">10__NB1Ki/12/15\');">1Ki 12:15__NB1Ki/22/22\');">1Ki 22:22__NR1Ki/22/23\');">23__NB2Ch/10/15\');">2Ch 10:15__NB2Ch/18/19\');">2Ch 18:19-22__NBIsa/19/2\');">Isa 19:2__NRIsa/19/14\');">14__NB2Th/2/11\');">2Th 2:11__NR2Th/2/12\');">12__AN__GHdealt_4__PSdealt__EFJdg/9/16\');">Jdg 9:16__NBIsa/33/1\');">Isa 33:1__NBMat/7/2\');">Mat 7:2__EN';
stringArray[24] = '__PNThat_the_1__SHThat the</a> cruelty [done] to the threescore and ten sons of Jerubbaal might come, and their blood be laid upon Abimelech their brother, which slew them; and upon the men of Shechem, which __PNaided_him_in_the_killing_of_2__SHaided him in the killing of</a> his brethren.__CPThat_the_1__PSThat the__FF1Sa/15/33\');">1Sa 15:33__NB1Ki/2/32\');">1Ki 2:32__NBEst/9/25\');">Est 9:25__NBPsa/7/16\');">Psa 7:16__NBMat/23/34\');">Mat 23:34-36__AN__GHaided_him_in_the_killing_of_2__PSaided him in the killing of__FEHeb. strengthened his hands to kill. Sooner or later, God will make inquisition for blood, and will return it on the heads of those that shed it. Accessaries will be reckoned with, as well as principals, in that and other sins. The Shechemites, who countenanced Abimelech\'s pretensions, aided and abetted him in his bloody project, and avowed the fact by making him king after he had done it, must fall with him, fall by him, and fall first. Those that combine together to do wickedly, are justly dashed in pieces one against another. Blood cannot be a lasting cement to any interest.</TD></TR>';
stringArray[25] = 'And the men of Shechem set liers in wait for him in the top of the mountains, and they robbed all that came along that way by them: and it was told Abimelech.__CPRelated_Verses1_1__PSEntire Verse.__FFJos/8/4\');">Jos 8:4__NRJos/8/12\');">12__NRJos/8/13\');">13__NBPro/1/11\');">Pro 1:11__NRPro/1/12\');">12__EN';
stringArray[26] = 'And Gaal the son of Ebed came with his __PNbrethren_1__SHbrethren</a>, and went over to Shechem: and the men of Shechem put their confidence in him.__CPbrethren_1__PSbrethren__FFGen/13/8\');">Gen 13:8__NBGen/19/7\');">Gen 19:7__EN';
stringArray[27] = 'And they went out into the fields, and gathered their vineyards, and trode [the grapes], and made __PNmerry_1__SHmerry</a>, and went into __PNthe_house_2__SHthe house</a> of their god, and __PNdid_eat_3__SHdid eat</a> and drink, and __PNcursed_4__SHcursed</a> Abimelech.__CPmerry_1__PSmerry__EEor, songs. __NAIsa/16/9\');">Isa 16:9__NRIsa/16/10\');">10__NBIsa/24/7\');">Isa 24:7-9__NBJer/25/30\');">Jer 25:30__NBAmo/6/3\');">Amo 6:3-6__AN__GHthe_house_2__PSthe house__EFJdg/9/4\');">Jdg 9:4__NBJdg/16/23\');">Jdg 16:23__NBExd/32/6\');">Exd 32:6__NRExd/32/19\');">19__NBDan/5/1\');">Dan 5:1-4__NRDan/5/23\');">23__AN__GGdid_eat_3__PSdid eat__FFIsa/22/12\');">Isa 22:12-14__NBLuk/12/19\');">Luk 12:19__NRLuk/12/20\');">20__NBLuk/17/26\');">Luk 17:26-29__AN__GHcursed_4__PScursed__EFLev/24/11\');">Lev 24:11__NB1Sa/17/43\');">1Sa 17:43__NBPsa/109/17\');">Psa 109:17__EN';
stringArray[28] = 'And Gaal the son of Ebed said, __PNWho_is_Abimelech_1__SHWho [is] Abimelech</a>, and who [is] Shechem, that we should serve him? [is] not [he] the son of Jerubbaal? and Zebul his officer? serve the men of __PNHamor_2__SHHamor</a> the father of Shechem: for why should we serve him?__CPWho_is_Abimelech_1__PSWho is Abimelech__FF1Sa/25/10\');">1Sa 25:10__NB2Sa/20/1\');">2Sa 20:1__NB1Ki/12/16\');">1Ki 12:16__AN__GHHamor_2__PSHamor__EFGen/34/2\');">Gen 34:2__NRGen/34/6\');">6__EN';
stringArray[29] = 'And __PNwould_to_God_1__SHwould to God</a> this people were under my hand! then would I remove Abimelech. __PNAnd_he_said_2__SHAnd he said</a> to Abimelech, __PNIncrease_thine_army_3__SHIncrease thine army</a>, and come out.__CPwould_to_God_1__PSwould to God__EEThe very words and conduct of a sly, hypocritical demagogue. __NA2Sa/15/4\');">2Sa 15:4__NB1Ki/20/11\');">1Ki 20:11__NBPsa/10/3\');">Psa 10:3__NBRom/1/30\');">Rom 1:30__NRRom/1/31\');">31__AN__GHAnd_he_said_2__PSAnd he said__FE"Rather, ""and I would say to Abimelech,"" as the LXX. renders; for as Dr. Wall observes, this was probably not said in the presence of Abimelech; but at an intemperate feast, in his absence, when he boasted he would challenge him."__GGIncrease_thine_army_3__PSIncrease thine army__FF2Sa/2/14\');">2Sa 2:14-17__NB2Ki/14/8\');">2Ki 14:8__NB2Ki/18/23\');">2Ki 18:23__NBIsa/36/8\');">Isa 36:8__NRIsa/36/9\');">9__EN';
stringArray[30] = 'And when Zebul the ruler of the city heard the words of Gaal the son of Ebed, his anger was __PNkindled_1__SHkindled</a>.__CPkindled_1__PSkindled__EEor, hot.</TD></TR>';
stringArray[31] = 'And he sent messengers unto Abimelech __PNprivily_1__SHprivily</a>, saying, Behold, Gaal the son of Ebed and his brethren be come to Shechem; and, behold, they fortify the city against thee.__CPprivily_1__PSprivily__EEHeb. craftily, or, to Tormah. they fortify. Under pretence of repairing the walls and towers, they were actually putting the place in a state of defence, intending to seize on the government as soon as they found Abimelech coming against them.</TD></TR>';
stringArray[32] = 'Now therefore up __PNby_night_1__SHby night</a>, thou and the people that [is] with thee, and lie in wait in the field:__CPby_night_1__PSby night__FFJob/24/14\');">Job 24:14-17__NBPsa/36/4\');">Psa 36:4__NBPro/1/11\');">Pro 1:11-16__NBPro/4/16\');">Pro 4:16__NBRom/3/15\');">Rom 3:15__EN';
stringArray[33] = 'And it shall be, [that] in the morning, as soon as the sun is up, thou shalt rise early, and set upon the city: and, behold, [when] he and the people that [is] with him come out against thee, then mayest thou do to them __PNas_thou_shalt_find_1__SHas thou shalt find</a> occasion.__CPas_thou_shalt_find_1__PSas thou shalt find__EEHeb. as thine hand shall find. __NALev/25/26\');">Lev 25:26__AN; *marg:; __NA1Sa/10/7\');">1Sa 10:7__NB1Sa/25/8\');">1Sa 25:8__NBEcc/9/10\');">Ecc 9:10__EN';
stringArray[34] = 'And Abimelech rose up, and all the people that [were] with him, by night, and they laid wait against Shechem in four companies.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[35] = 'And __PNGaal_1__SHGaal</a> the son of Ebed went out, and stood in the entering of the gate of the city: and Abimelech rose up, and __PNthe_people_2__SHthe people</a> that [were] with him, from lying in wait.__CPGaal_1__PSGaal__EEOf this person we know no more than is here recorded. He was probably one of the descendants of the Canaanites, who hoped, from the state of the public mind and their disaffection to Abimelech, to cause a revolution, and thus to restore the ancient government as it was under Hamor, the father of Shechem. Josephus says he was a man of authority, who sojourned with them, with his armed men and kinsmen; and that the Shechemites desired that he would allow them a guard during the vintage.__GHthe_people_2__PSthe people__EFJdg/9/44\');">Jdg 9:44__EN';
stringArray[36] = 'And when Gaal saw the people, he said to Zebul, Behold, there come people down from the top of the mountains. And Zebul said unto him, Thou __PNseest_the_shadow_1__SHseest the shadow</a> of the mountains as [if they were] men.__CPseest_the_shadow_1__PSseest the shadow__EEDoubdan states, that in some parts of the Holy Land there are many detached rocks scattered up and down, some growing out of the ground, and others fragments broken off from rocky precipices, the shadow of which, it appears, Josephus thought might be most naturally imagined to look like troops of men at a distance, rather than that of the mountains; for he represents Zebul as saying to Gaal, that he mistook the shadow of the rocks for men. __NAEze/7/7\');">Eze 7:7__NBMar/8/24\');">Mar 8:24__EN';
stringArray[37] = 'And Gaal spake again and said, See there come people down by the __PNmiddle_1__SHmiddle</a> of the land, and another company come along by the plain of __PNMeonenim_2__SHMeonenim</a>.__CPmiddle_1__PSmiddle__EEHeb. navel.__GHMeonenim_2__PSMeonenim__FEor, the regarders of the times. __NADeu/18/14\');">Deu 18:14__EN';
stringArray[38] = 'Then said Zebul unto him, Where [is] now thy mouth, wherewith thou saidst, Who [is] Abimelech, that we should serve him? [is] not this the people that thou hast despised? go out, I pray now, and fight with them.__CPRelated_Verses1_1__PSEntire Verse.__FFJdg/9/28\');">Jdg 9:28__NRJdg/9/29\');">29__NB2Sa/2/26\');">2Sa 2:26__NR2Sa/2/27\');">27__NB2Ki/14/8\');">2Ki 14:8-14__NBJer/2/28\');">Jer 2:28__EN';
stringArray[39] = 'And Gaal went out before the men of Shechem, and fought with Abimelech.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[40] = 'And Abimelech chased him, and __PNhe_fled_before_1__SHhe fled before</a> him, and many were overthrown [and] wounded, [even] unto the entering of the gate.__CPhe_fled_before_1__PShe fled before__FF1Ki/20/18\');">1Ki 20:18-21__NR1Ki/20/30\');">30__EN';
stringArray[41] = 'And Abimelech dwelt at __PNArumah_1__SHArumah</a>: and __PNZebul_2__SHZebul</a> thrust out Gaal and his brethren, that they should not dwell in Shechem.__CPArumah_1__PSArumah__EEThis place appears from the next verse to have been near Shechem; and is perhaps the same as Ruma, a village of Galilee, mentioned by Josephus, Bell. 1. iii. c. 9.__GHZebul_2__PSZebul__EFJdg/9/28\');">Jdg 9:28__NRJdg/9/30\');">30__EN';
stringArray[42] = 'And it came to pass on the morrow, that the people went out into the field; and they told Abimelech.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[43] = 'And he took the people, and divided them into three companies, and laid wait in the field, and looked, and, behold, the people [were] come forth out of the city; and he rose up against them, and smote them.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[44] = 'And Abimelech, and the company that [was] with him, __PNrushed_forward_1__SHrushed forward</a>, and stood in the entering of the gate of the city: and the two [other] companies ran upon all [the people] that [were] in the fields, and slew them.__CPrushed_forward_1__PSrushed forward__FFJdg/9/15\');">Jdg 9:15__NRJdg/9/20\');">20__NBGal/5/15\');">Gal 5:15__EN';
stringArray[45] = 'And Abimelech fought against the city all that day; and __PNhe_took_1__SHhe took</a> the city, and slew the people that [was] therein, and __PNbeat_2__SHbeat</a> down the city, and __PNsowed_3__SHsowed</a> it with salt.__CPhe_took_1__PShe took__FFJdg/9/20\');">Jdg 9:20__AN__GHbeat_2__PSbeat__EFDeu/29/23\');">Deu 29:23__NB1Ki/12/25\');">1Ki 12:25__NB2Ki/3/25\');">2Ki 3:25__NBPsa/107/34\');">Psa 107:34__AN; *marg:; __NAEze/47/11\');">Eze 47:11__NBZep/2/9\');">Zep 2:9__NBJam/2/13\');">Jam 2:13__AN__GGsowed_3__PSsowed__EESalt in small quantities renders land extremely fertile; but too much of it destroys vegetation. Every place, says Pliny, in which salt is found is barren, and produces nothing. Hence the sowing of a place with salt was a custom in different nations to express permanent desolation. Sigonius observes, that when Milan was taken, A.D. 1162, the walls were razed, and it was sown with salt. And Brantome informs us, that it was an ancient custom in France, to sow the house of a man with salt, who had been declared a traitor to his king. Charles IX., king of France, the most base and perfidious of human beings, caused the house of Admiral Coligni (whom he and the Duke of Guise caused to be murdered, with thousands more of Protestants, on the eve of St. Bartholomew, 1572,) to be sown with salt!</TD></TR>';
stringArray[46] = 'And when all the men of the tower of Shechem heard [that], they entered into __PNan_hold_1__SHan hold</a> of the house of the god Berith.__CPan_hold_1__PSan hold__FFJdg/9/4\');">Jdg 9:4__NRJdg/9/27\');">27__NBJdg/8/33\');">Jdg 8:33__NB1Ki/8/26\');">1Ki 8:26__NB2Ki/1/2\');">2Ki 1:2-4__NBPsa/115/8\');">Psa 115:8__NBIsa/28/15\');">Isa 28:15-18__NBIsa/37/38\');">Isa 37:38__EN';
stringArray[47] = 'And it was told Abimelech, that all the men of the tower of Shechem were gathered together.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[48] = 'And Abimelech gat him up to mount __PNZalmon_1__SHZalmon</a>, he and all the people that [were] with him; and Abimelech took an axe in his hand, and cut down a bough from the trees, and took it, and laid [it] on his shoulder, and said unto the people that [were] with him, __PNWhat_ye_2__SHWhat ye</a> have seen __PNme_do_3__SHme do</a>, make haste, [and] do as I [have done].__CPZalmon_1__PSZalmon__FFPsa/68/14\');">Psa 68:14__AN__GHWhat_ye_2__PSWhat ye__EFJdg/7/17\');">Jdg 7:17__NRJdg/7/18\');">18__NBPro/1/11\');">Pro 1:11__NRPro/1/12\');">12__AN__GGme_do_3__PSme do__EEHeb. I have done.</TD></TR>';
stringArray[49] = 'And all the people likewise cut down every man his bough, and followed Abimelech, and __PNput_them_1__SHput [them]</a> to the hold, and set the hold on fire upon them; so that all the men of the tower of Shechem died also, about a thousand men and women.__CPput_them_1__PSput them__FFJdg/9/15\');">Jdg 9:15__NRJdg/9/20\');">20__NBGal/5/15\');">Gal 5:15__NBJam/3/16\');">Jam 3:16__EN';
stringArray[50] = 'Then went Abimelech to __PNThebez_1__SHThebez</a>, and encamped against Thebez, and took it.__CPThebez_1__PSThebez__EEAccording to Eusebius, thirteen miles from Shechem, towards Scythopolis.</TD></TR>';
stringArray[51] = 'But there was a strong tower within the city, and thither fled all the men and women, and all they of the city, and shut [it] to them, and gat them up to the top of the tower.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[52] = 'And Abimelech came unto the tower, and fought against it, and went hard unto the door of the tower to burn it with fire.__CPRelated_Verses1_1__PSEntire Verse.__FFJdg/9/48\');">Jdg 9:48__NRJdg/9/49\');">49__NB2Ki/14/10\');">2Ki 14:10__NB2Ki/15/16\');">2Ki 15:16__EN';
stringArray[53] = 'And a certain __PNwoman_1__SHwoman</a> cast a piece of a millstone upon Abimelech\'s head, __PNand_all_to_2__SHand all to</a> brake his skull.__CPwoman_1__PSwoman__FFJdg/9/15\');">Jdg 9:15__NRJdg/9/20\');">20__NB2Sa/11/21\');">2Sa 11:21__NB2Sa/20/21\');">2Sa 20:21__NBJob/31/3\');">Job 31:3__NBJer/49/20\');">Jer 49:20__NBJer/50/45\');">Jer 50:45__AN__GHand_all_to_2__PSand all to__FE"An antiquated expression, meaning ""full intention"" to complete an object. ""All to,"" observes Dr. Johnson, ""is a particle of mere enforcement."" The original is wattaritz eth gulgalto, which is simply as the LXX. render [kai eklase to kranion autou] ""and she brake his skull."" Plutarch relates, that Pyrrhus was killed at the siege of Thebes, by a piece of a tile, which a woman threw upon his head."</TD></TR>';
stringArray[54] = 'Then he called hastily unto the young man his armourbearer, and said unto him, __PNDraw_thy_1__SHDraw thy</a> sword, and slay me, that men say not of me, A woman slew him. __PNAnd_his_young_man_2__SHAnd his young man</a> thrust him through, and he died.__CPDraw_thy_1__PSDraw thy__FF1Sa/31/4\');">1Sa 31:4__NR1Sa/31/5\');">5__AN__GHAnd_his_young_man_2__PSAnd his young man__FEIt was a disgrace to be killed by a woman.</TD></TR>';
stringArray[55] = 'And when the men of Israel saw that Abimelech was dead, they departed every man unto his place.__CPRelated_Verses1_1__PSEntire Verse.__FF2Sa/18/16\');">2Sa 18:16__NB2Sa/20/21\');">2Sa 20:21__NR2Sa/20/22\');">22__NB1Ki/22/35\');">1Ki 22:35__NR1Ki/22/36\');">36__NBPro/22/10\');">Pro 22:10__EN';
stringArray[56] = 'Thus __PNGod_rendered_1__SHGod rendered</a> the wickedness of Abimelech, which he did unto his father, in slaying his seventy brethren:__CPGod_rendered_1__PSGod rendered__EEBoth the fratricide Abimelech and the unprincipled men of Shechem had the iniquity visited upon them of which they had been guilty. Man\'s judgment may be avoided; but there is no escape from that of God. How many houses have been sown with salt in France, by the just judgment of God, for the massacre of the Protestants on the eve of St. Bartholomew! See Note on __NAJdg/9/45\');">Jdg 9:45__AN. __NAJdg/9/24\');">Jdg 9:24__NBJob/31/3\');">Job 31:3__NBPsa/9/12\');">Psa 9:12__NBPsa/11/6\');">Psa 11:6__NBPsa/58/10\');">Psa 58:10__NRPsa/58/11\');">11__NBPsa/94/23\');">Psa 94:23__NBPro/5/22\');">Pro 5:22__NBMat/7/2\');">Mat 7:2__NBAct/28/4\');">Act 28:4__NBGal/6/7\');">Gal 6:7__NBRev/19/20\');">Rev 19:20__NRRev/19/21\');">21__EN';
stringArray[57] = 'And all the evil of the men of Shechem did God render upon their heads: and __PNupon_them_1__SHupon them</a> came the curse of Jotham the son of Jerubbaal.__CPupon_them_1__PSupon them__FFJdg/9/20\');">Jdg 9:20__NRJdg/9/45\');">45__NBJos/6/26\');">Jos 6:26__NB1Ki/16/34\');">1Ki 16:34__EN';
