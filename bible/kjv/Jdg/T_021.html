stringArray[1] = 'Now the men of Israel __PNhad_sworn_1__SHhad sworn</a> in Mizpeh, saying, __PNThere_2__SHThere</a> shall not any of us give __PNhis_daughter_3__SHhis daughter</a> unto Benjamin to wife.__CPhad_sworn_1__PShad sworn__FFJdg/20/1\');">Jdg 20:1__NRJdg/20/8\');">8__NRJdg/20/10\');">10__NBJer/4/2\');">Jer 4:2__AN__GHThere_2__PSThere__EFJdg/21/5\');">Jdg 21:5__NBJdg/11/30\');">Jdg 11:30__NRJdg/11/31\');">31__NB1Sa/14/24\');">1Sa 14:24__NR1Sa/14/28\');">28__NR1Sa/14/29\');">29__NBEcc/5/2\');">Ecc 5:2__NBMar/6/23\');">Mar 6:23__NBAct/23/12\');">Act 23:12__NBRom/10/2\');">Rom 10:2__AN__GGhis_daughter_3__PShis daughter__FFExd/34/12\');">Exd 34:12-16__NBDeu/7/2\');">Deu 7:2__NRDeu/7/3\');">3__EN';
stringArray[2] = 'And the people came to __PNthe_house_1__SHthe house</a> of God, and abode there till even before God, and __PNlifted_2__SHlifted</a> up their voices, and wept sore;__CPthe_house_1__PSthe house__FFJdg/21/12\');">Jdg 21:12__NBJdg/20/18\');">Jdg 20:18__NRJdg/20/23\');">23__NRJdg/20/26\');">26__NBJos/18/1\');">Jos 18:1__AN__GHlifted_2__PSlifted__EFJdg/2/4\');">Jdg 2:4__NBGen/27/38\');">Gen 27:38__NB1Sa/30/4\');">1Sa 30:4__EN';

stringArray[4] = 'And it came to pass on the morrow, that the people __PNrose_early_1__SHrose early</a>, and __PNbuilt_there_2__SHbuilt there</a> an altar, and offered burnt offerings and peace offerings.__CProse_early_1__PSrose early__FFPsa/78/34\');">Psa 78:34__NRPsa/78/35\');">35__NBHsa/5/15\');">Hsa 5:15__AN__GHbuilt_there_2__PSbuilt there__EFJdg/6/26\');">Jdg 6:26__NBExd/20/24\');">Exd 20:24__NRExd/20/25\');">25__NB2Sa/24/18\');">2Sa 24:18__NR2Sa/24/25\');">25__NB1Ki/8/64\');">1Ki 8:64__NBHbr/13/10\');">Hbr 13:10__EN';
stringArray[5] = 'And the children of Israel said, Who [is there] among all the tribes of Israel that came not up with the congregation unto the LORD? For they had made __PNa_great_oath_1__SHa great oath</a> concerning him that came not up to the LORD to Mizpeh, saying, He shall surely be put to death.__CPa_great_oath_1__PSa great oath__FFJdg/21/1\');">Jdg 21:1__NRJdg/21/18\');">18__NBJdg/5/23\');">Jdg 5:23__NBLev/27/28\');">Lev 27:28__NRLev/27/29\');">29__NB1Sa/11/7\');">1Sa 11:7__NBJer/48/10\');">Jer 48:10__EN';
stringArray[6] = 'And the children of Israel __PNrepented_them_1__SHrepented them</a> for Benjamin their brother, and said, There is one tribe cut off from Israel this day.__CPrepented_them_1__PSrepented them__FFJdg/21/15\');">Jdg 21:15__NBJdg/11/35\');">Jdg 11:35__NBJdg/20/23\');">Jdg 20:23__NB2Sa/2/26\');">2Sa 2:26__NBHsa/11/8\');">Hsa 11:8__NBLuk/19/41\');">Luk 19:41__NRLuk/19/42\');">42__EN';
stringArray[7] = 'How shall we do for wives for them that remain, seeing we have __PNsworn_1__SHsworn</a> by the LORD that we will not give them of our daughters to wives?__CPsworn_1__PSsworn__FFJdg/21/1\');">Jdg 21:1__NRJdg/21/18\');">18__NB1Sa/14/28\');">1Sa 14:28__NR1Sa/14/29\');">29__NR1Sa/14/45\');">45__EN';
stringArray[8] = 'And they said, What one [is there] of the tribes of Israel that came not up to Mizpeh to the LORD? And, behold, there came none to the camp from __PNJabesh_gilead_1__SHJabeshgilead</a> to the assembly.__CPJabesh_gilead_1__PSJabesh-gilead__EEThis place, as its name imports, was situated in Gilead, east of Jordan. Eusebius and Jerome say it was a great town in their time, standing upon a hill, six miles south from Pella, in the way to Geresa, now Djerash. The Wady Yabes, mentioned by Burckhardt, which empties itself into the Jordan, in the neighbourhood of Bisan or Beth-shan (see __NA1Sa/31/11\');">1Sa 31:11__AN,) and upon which Pella was situated, (celebrated by Pliny, 1. v. c. 18, for its fine waters,) seems to have taken its name from Jabesh. Near this spot, we must therefore look for its site; and the place called Kalaat Rabbad seems to correspond, very nearly, to the spot; though it probably still retains among the Arabs its ancient name. __NA1Sa/11/1\');">1Sa 11:1-3__NB1Sa/31/11\');">1Sa 31:11-13__NB2Sa/2/5\');">2Sa 2:5__NR2Sa/2/6\');">6__EN';
stringArray[9] = 'For the people were numbered, and, behold, [there were] none of the inhabitants of Jabeshgilead there.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[10] = 'And the congregation sent thither twelve thousand men of the valiantest, and commanded them, saying, __PNGo_and_smite_1__SHGo and smite</a> the inhabitants of Jabeshgilead with the edge of the sword, with the women and the children.__CPGo_and_smite_1__PSGo and smite__EEAs they had sworn to destroy those who would not assist in the war (__NAJdg/21/5\');">Jdg 21:5__AN,) they determined to destroy the men of Jabesh, and to leave none except the virgins; and to give these to the 600 Benjamites who had escaped to the rock of Rimmon. The whole account is dreadful. The crime of the men of Gibeah was of the deepest dye; the punishment involving both the guilty and innocent, was extended to the most criminal excess, and their mode of remedying the evil they had occasioned was equally abominable. __NAJdg/21/5\');">Jdg 21:5__NBJdg/5/23\');">Jdg 5:23__NBDeu/13/15\');">Deu 13:15__NBJos/7/24\');">Jos 7:24__NB1Sa/11/7\');">1Sa 11:7__NB1Sa/15/3\');">1Sa 15:3__EN';
stringArray[11] = 'And this [is] the thing that ye shall do, Ye shall utterly destroy __PNevery_male_1__SHevery male</a>, and every woman that __PNhath_lain_by_man_2__SHhath lain by man</a>.__CPevery_male_1__PSevery male__FFNum/31/17\');">Num 31:17__NRNum/31/18\');">18__NBDeu/2/34\');">Deu 2:34__AN__GHhath_lain_by_man_2__PShath lain by man__FEHeb. knoweth the lying with man.</TD></TR>';
stringArray[12] = 'And they found among the inhabitants of Jabeshgilead four hundred young __PNvirgins_1__SHvirgins</a>, that had known no man by lying with any male: and they brought them unto the camp to __PNShiloh_2__SHShiloh</a>, which [is] in the land of Canaan.__CPvirgins_1__PSvirgins__EEHeb. women, virgins.__GHShiloh_2__PSShiloh__EFJdg/20/18\');">Jdg 20:18__NRJdg/20/23\');">23__NBJos/18/1\');">Jos 18:1__NBPsa/78/60\');">Psa 78:60__NBJer/7/12\');">Jer 7:12__EN';
stringArray[13] = 'And the whole congregation sent [some] __PNto_speak_1__SHto speak</a> to the children of Benjamin that [were] in __PNthe_rock_Rimmon_2__SHthe rock Rimmon</a>, and to __PNcall_peaceably_3__SHcall peaceably</a> unto them.__CPto_speak_1__PSto speak__EEHeb. and spake and called.__GHthe_rock_Rimmon_2__PSthe rock Rimmon__EFJdg/20/47\');">Jdg 20:47__NBJos/15/32\');">Jos 15:32__AN__GGcall_peaceably_3__PScall peaceably__EEor, proclaim peace. __NADeu/20/10\');">Deu 20:10__NBIsa/57/19\');">Isa 57:19__NBLuk/10/5\');">Luk 10:5__NBEph/2/17\');">Eph 2:17__EN';

stringArray[17] = 'And they said, [There must be] __PNan_inheritance_1__SHan inheritance</a> for them that be escaped of Benjamin, that a tribe be not destroyed out of Israel.__CPan_inheritance_1__PSan inheritance__FFNum/26/55\');">Num 26:55__NBNum/36/7\');">Num 36:7__EN';
stringArray[18] = 'Howbeit we may not give them wives of our daughters: for the children of Israel have __PNsworn_1__SHsworn</a>, saying, Cursed [be] he that giveth a wife to Benjamin.__CPsworn_1__PSsworn__FFJdg/21/1\');">Jdg 21:1__NBJdg/11/35\');">Jdg 11:35__EN';
stringArray[19] = 'Then they said, Behold, [there is] __PNa_feast_1__SHa feast</a> of the LORD in Shiloh __PNyearly_2__SHyearly</a> [in a place] which [is] on the north side of Bethel, on the east side of the highway that goeth up from Bethel to Shechem, and on the south of Lebonah.__CPa_feast_1__PSa feast__FFExd/23/14\');">Exd 23:14-16__NBLev/23/2\');">Lev 23:2__NRLev/23/4\');">4__NRLev/23/6\');">6__NRLev/23/10\');">10__NRLev/23/34\');">34__NBNum/10/10\');">Num 10:10__NBNum/28/16\');">Num 28:16__NRNum/28/26\');">26__NBNum/29/12\');">Num 29:12__NBDeu/16/1\');">Deu 16:1__NRDeu/16/10\');">10__NRDeu/16/13\');">13__NBPsa/81/3\');">Psa 81:3__NBJhn/5/1\');">Jhn 5:1__NBJhn/7/2\');">Jhn 7:2__AN__GHyearly_2__PSyearly__FE"Heb. from year to year. on the east side. or, toward the sun rising. of the highway. or, on. Lebonah. Maundrell supposes, that either Khan Leban, which is situated on the eastern side of a ""delicious vale,"" four leagues south from Shechem, and two leagues north from Bethel, or the village of Leban, which is on the opposite side, occupies the site of the ancient Lebonah. It is eight hours, or about 24 miles, from Jerusalem, according to Dr. Richardson."</TD></TR>';

stringArray[22] = 'And it shall be, when their fathers or their brethren come unto us to complain, that we will say unto them, __PNBe_favourable_unto_them_1__SHBe favourable unto them</a> for our sakes: because we reserved not to __PNeach_man_2__SHeach man</a> his wife in the war: for ye did not __PNgive_unto_3__SHgive unto</a> them at this time, [that] ye should be guilty.__CPBe_favourable_unto_them_1__PSBe favourable unto them__EEor, Gratify us in them. __NAPhm/1/9\');">Phm 1:9-12__AN__GHeach_man_2__PSeach man__EFJdg/21/14\');">Jdg 21:14__NBGen/1/27\');">Gen 1:27__NBGen/7/13\');">Gen 7:13__NBMar/10/6\');">Mar 10:6-8__NB1Cr/7/2\');">1Cr 7:2__AN__GGgive_unto_3__PSgive unto__FFJdg/21/1\');">Jdg 21:1__NRJdg/21/7\');">7__NRJdg/21/18\');">18__NBPro/20/25\');">Pro 20:25__EN';
stringArray[23] = 'And the children of Benjamin did so, and took [them] wives, according to their number, of them that danced, whom they caught: __PNand_they_went_1__SHand they went</a> and returned unto their inheritance, and __PNrepaired_2__SHrepaired</a> the cities, and dwelt in them.__CPand_they_went_1__PSand they went__EEIt appears that the Benjamites acted in the most honourable way to the women they had thus violently carried off, and we may rest assured, that they took them to an inheritance more than equal to their own. But this transaction, as well as the indiscriminate massacre of the people of Jabesh-gilead, as Dr. Gray observes, was certainly stamped with injustice and cruelty; and must be condemned on those principles which the Scriptures elsewhere furnish.__GHrepaired_2__PSrepaired__EFJdg/20/48\');">Jdg 20:48__EN';
