var stringArray = new Array();
stringArray[1] = 'And it came to pass in those days, __PNwhen_there_1__SHwhen [there</a> was] no king in Israel, that there was a certain Levite sojourning on the side of __PNmount_2__SHmount</a> Ephraim, who took to him __PNa_concubine_3__SHa concubine</a> out of __PNBeth_lehem_judah_4__SHBethlehemjudah</a>.__CPwhen_there_1__PSwhen there__FFJdg/17/6\');">Jdg 17:6__NBJdg/18/1\');">Jdg 18:1__NBJdg/21/25\');">Jdg 21:25__AN__GHmount_2__PSmount__EFJdg/17/1\');">Jdg 17:1__NRJdg/17/8\');">8__NBJos/24/30\');">Jos 24:30__NRJos/24/33\');">33__AN__GGa_concubine_3__PSa concubine__EEHeb. a woman, a concubine, or, a wife, a concubine. __NAGen/22/24\');">Gen 22:24__NBGen/25/6\');">Gen 25:6__NB2Sa/3/7\');">2Sa 3:7__NB2Sa/5/13\');">2Sa 5:13__NB2Sa/16/22\');">2Sa 16:22__NB2Sa/19/5\');">2Sa 19:5__NB2Sa/20/3\');">2Sa 20:3__NB1Ki/11/3\');">1Ki 11:3__NB2Ch/11/21\');">2Ch 11:21__NBEst/2/14\');">Est 2:14__NBSgs/6/8\');">Sgs 6:8__NRSgs/6/9\');">9__NBDan/5/3\');">Dan 5:3__NBMal/2/15\');">Mal 2:15__AN__GHBeth_lehem_judah_4__PSBeth-lehem-judah__EFJdg/17/8\');">Jdg 17:8__NBGen/35/19\');">Gen 35:19__NBMat/2/6\');">Mat 2:6__EN';
stringArray[2] = 'And his concubine __PNplayed_1__SHplayed</a> the whore against him, and went away from him unto her father\'s house to Bethlehemjudah, and was there __PNfour_whole_months_2__SHfour whole months</a>.__CPplayed_1__PSplayed__FFLev/21/9\');">Lev 21:9__NBDeu/22/21\');">Deu 22:21__NBEze/16/28\');">Eze 16:28__AN__GHfour_whole_months_2__PSfour whole months__FEor, a year and four months. Heb. days, four months.</TD></TR>';
stringArray[3] = 'And her husband arose, and __PNwent_1__SHwent</a> after her, to __PNspeak_2__SHspeak</a> __PNfriendly_unto_her_3__SHfriendly unto her</a>, [and] __PNto_bring_4__SHto bring</a> her again, having __PNhis_servant_5__SHhis servant</a> with him, and a couple of asses: and she brought him into her father\'s house: and when the father of the damsel saw him, he rejoiced to meet him.__CPwent_1__PSwent__FFJdg/15/1\');">Jdg 15:1__AN__GHspeak_2__PSspeak__EFGen/50/21\');">Gen 50:21__NBLev/19/17\');">Lev 19:17__NBLev/20/10\');">Lev 20:10__NBHsa/2/14\');">Hsa 2:14__NBMat/1/19\');">Mat 1:19__NBJhn/8/4\');">Jhn 8:4__NRJhn/8/5\');">5__NRJhn/8/11\');">11__NBGal/6/1\');">Gal 6:1__AN__GGfriendly_unto_her_3__PSfriendly unto her__EEHeb. to her heart. __NAGen/34/3\');">Gen 34:3__AN__GHto_bring_4__PSto bring__EFJer/3/1\');">Jer 3:1__AN__GGhis_servant_5__PShis servant__FFNum/22/22\');">Num 22:22__EN';
stringArray[4] = 'And his father in law, the damsel\'s father, retained him; and he abode with him three days: so they did eat and drink, and lodged there.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[5] = 'And it came to pass on the fourth day, when they arose early in the morning, that he rose up to depart: and the damsel\'s father said unto his son in law, __PNComfort_1__SHComfort</a> thine heart __PNwith_a_morsel_2__SHwith a morsel</a> of bread, and afterward go your way.__CPComfort_1__PSComfort__EEHeb. Srengthen. __NAJdg/19/8\');">Jdg 19:8__NBGen/18/5\');">Gen 18:5__NB1Sa/14/27\');">1Sa 14:27-29__NB1Sa/30/12\');">1Sa 30:12__NB1Ki/13/7\');">1Ki 13:7__NBPsa/104/15\');">Psa 104:15__NBJhn/4/34\');">Jhn 4:34__NBAct/9/19\');">Act 9:19__AN__GHwith_a_morsel_2__PSwith a morsel__EFJdg/19/22\');">Jdg 19:22__EN';
stringArray[6] = 'And they sat down, and did eat and drink both of them together: for the damsel\'s father had said unto the man, Be content, I pray thee, and tarry all night, and __PNlet_thine_heart_1__SHlet thine heart</a> be merry.__CPlet_thine_heart_1__PSlet thine heart__FFJdg/19/9\');">Jdg 19:9__NRJdg/19/21\');">21__NBJdg/9/27\');">Jdg 9:27__NBJdg/16/25\');">Jdg 16:25__NBRth/3/7\');">Rth 3:7__NB1Sa/25/36\');">1Sa 25:36__NBEst/1/10\');">Est 1:10__NBPsa/104/15\');">Psa 104:15__NBLuk/12/19\');">Luk 12:19__NB1Th/5/3\');">1Th 5:3__NBRev/11/10\');">Rev 11:10__NRRev/11/13\');">13__EN';
stringArray[7] = 'And when the man rose up to depart, his father in law urged him: therefore he lodged there again.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[8] = 'And he arose early in the morning on the fifth day to depart: and the damsel\'s father said, Comfort thine heart, I pray thee. And they tarried __PNuntil_afternoon_1__SHuntil afternoon</a>, and they did eat both of them.__CPuntil_afternoon_1__PSuntil afternoon__EEHeb. till the day declined. Merely that they might avoid the heat of the day, which would have been very inconvenient in travelling.</TD></TR>';
stringArray[9] = 'And when the man rose up to depart, he, and his concubine, and his servant, his father in law, the damsel\'s father, said unto him, Behold, now __PNthe_day_1__SHthe day</a> __PNdraweth__etc__2__SHdraweth</a> toward evening, I pray you tarry all night: behold, the day groweth to an end, lodge here, that thine heart may be merry; and __PNto_morrow_3__SHto morrow</a> get you early on your way, that thou mayest go __PNhome_4__SHhome</a>.__CPthe_day_1__PSthe day__FFLuk/24/29\');">Luk 24:29__AN__GHdraweth__etc__2__PSdraweth, etc.__FE"Heb. is weak. the day groweth to an end. Heb. it is the pitching time of the day, __NAJer/6/4\');">Jer 6:4__AN. That is, it was near the time in which travellers ordinarily pitched their tents, to take up their lodging for the night. In the latter part of the afternoon, eastern travellers begin to look out for a place for this purpose. So Dr. Shaw observes, ""Our constant practice was to rise at break of day, set forward with the sun, and travel to the middle of the afternoon; at which time we began to look out for encampments of Arabs; who, to prevent such parties as ours from living at free charges upon them, take care to pitch in woods, valleys, or places the least conspicuous."""__GGto_morrow_3__PSto morrow__FFPro/27/1\');">Pro 27:1__NBJam/4/13\');">Jam 4:13__NRJam/4/14\');">14__AN__GHhome_4__PShome__FEHeb. to thy tent.</TD></TR>';
stringArray[10] = 'But the man would not tarry that night, but he rose up and departed, and came __PNover_against_1__SHover against</a> __PNJebus_2__SHJebus</a>, which [is] Jerusalem; and [there were] with him two asses saddled, his concubine also [was] with him.__CPover_against_1__PSover against__EEHeb. to over against.__GHJebus_2__PSJebus__EFJdg/1/8\');">Jdg 1:8__NBJos/15/8\');">Jos 15:8__NRJos/15/63\');">63__NBJos/18/28\');">Jos 18:28__NB2Sa/5/6\');">2Sa 5:6__EN';
stringArray[11] = '[And] when they [were] by Jebus, the day was far spent; and the servant said unto his master, Come, I pray thee, and let us turn in into this city of __PNthe_Jebusites_1__SHthe Jebusites</a>, and lodge in it.__CPthe_Jebusites_1__PSthe Jebusites__FFJdg/19/10\');">Jdg 19:10__NBJdg/1/21\');">Jdg 1:21__NBGen/10/16\');">Gen 10:16__NBJos/15/63\');">Jos 15:63__NB2Sa/5/6\');">2Sa 5:6__EN';
stringArray[12] = 'And his master said unto him, We will not turn aside hither into the city of a stranger, that [is] not of the children of Israel; we will pass over to __PNGibeah_1__SHGibeah</a>.__CPGibeah_1__PSGibeah__EEGibeah, a city of Benjamin, and the birth-place of Saul, was situated near Rama and Gibeon, according to Josephus, thirty furlongs north from Jerusalem; or, according to Jerome, about two leagues.</TD></TR>';
stringArray[13] = 'And he said unto his servant, Come, and let us draw near to one of these places to lodge all night, in __PNGibeah_1__SHGibeah</a>, or in Ramah.__CPGibeah_1__PSGibeah__FFJos/18/25\');">Jos 18:25__NRJos/18/26\');">26__NRJos/18/28\');">28__NB1Sa/10/26\');">1Sa 10:26__NBIsa/10/29\');">Isa 10:29__NBHsa/5/8\');">Hsa 5:8__EN';
stringArray[14] = 'And they passed on and went their way; and the sun went down upon them [when they were] by Gibeah, which [belongeth] to Benjamin.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[15] = 'And they turned aside thither, to go in [and] to lodge in Gibeah: and when he went in, he sat him down in a street of the city: for [there was] __PNno_man_1__SHno man</a> that took them into his house to lodging.__CPno_man_1__PSno man__EEThere was probably no inn, or house of public entertainment in this place; and therefore they could not have a lodging unless furnished by mere hospitality. But these Benjamites seem to have added to their other vices, avarice and inhospitality, like the inhabitants of Akoura in mount Lebanon, mentioned by Burckhardt. __NAJdg/19/18\');">Jdg 19:18__NBGen/18/2\');">Gen 18:2-8__NBGen/19/2\');">Gen 19:2__NRGen/19/3\');">3__NBMat/25/35\');">Mat 25:35__NRMat/25/43\');">43__NBHbr/13/2\');">Hbr 13:2__EN';
stringArray[16] = 'And, behold, there came an old man from __PNhis_work_1__SHhis work</a> out of the field at even, which [was] also of mount Ephraim; and he sojourned in Gibeah: but the men of the place [were] Benjamites.__CPhis_work_1__PShis work__FFGen/3/19\');">Gen 3:19__NBPsa/104/23\');">Psa 104:23__NBPsa/128/2\');">Psa 128:2__NBPro/13/11\');">Pro 13:11__NBPro/14/23\');">Pro 14:23__NBPro/24/27\');">Pro 24:27__NBEcc/1/13\');">Ecc 1:13__NBEcc/5/12\');">Ecc 5:12__NBEph/4/28\');">Eph 4:28__NB1Th/4/11\');">1Th 4:11__NR1Th/4/12\');">12__NB2Th/3/10\');">2Th 3:10__EN';
stringArray[17] = 'And when he had lifted up his eyes, he saw a wayfaring man in the street of the city: and the old man said, __PNWhither_1__SHWhither</a> goest thou? and whence comest thou?__CPWhither_1__PSWhither__FFGen/16/8\');">Gen 16:8__NBGen/32/17\');">Gen 32:17__EN';
stringArray[18] = 'And he said unto him, We [are] passing from Bethlehemjudah toward the side of mount Ephraim; from thence [am] I: and I went to Bethlehemjudah, but __PNI_am_now_1__SHI [am now]</a> going to __PNthe_house_2__SHthe house</a> of the LORD; and there [is] no man that __PNreceiveth_3__SHreceiveth</a> me to house.__CPI_am_now_1__PSI am now__EE"The LXX. read, [eis ton oikon mou ego poreuomai:] ""I am going to my own house;"" which is probably the true reading, as we find (__NAJdg/19/29\');">Jdg 19:29__AN) that he really went home; yet he might have gone previously to Shiloh, or to ""the house of the LORD,"" because that was also in mount Ephraim."__GHthe_house_2__PSthe house__EFJdg/18/31\');">Jdg 18:31__NBJdg/20/18\');">Jdg 20:18__NBJos/18/1\');">Jos 18:1__NB1Sa/1/3\');">1Sa 1:3__NR1Sa/1/7\');">7__AN__GGreceiveth_3__PSreceiveth__EEHeb. gathereth. __NAJdg/19/5\');">Jdg 19:5__NBPsa/26/9\');">Psa 26:9__NBJhn/15/6\');">Jhn 15:6__EN';
stringArray[19] = 'Yet there is both __PNstraw_and_provender_1__SHstraw and provender</a> for our asses; and there is bread and wine also for me, and for thy handmaid, and for the young man [which is] with thy servants: [there is] no want of any thing.__CPstraw_and_provender_1__PSstraw and provender__EEIn those countries principally devoted to pasturage, they made little or no hay: but as they raised corn, they took great care of their straw for cattle, which by their mode of threshing was chopped very small. See note on __NAGen/24/32\');">Gen 24:32__AN.</TD></TR>';
stringArray[20] = 'And the old man said, __PNPeace_be_1__SHPeace [be]</a> with thee; howsoever __PNlet_all_thy_wants_2__SH[let] all thy wants</a> [lie] upon me; only __PNlodge_not_3__SHlodge not</a> in the street.__CPPeace_be_1__PSPeace be__FFJdg/6/23\');">Jdg 6:23__NBGen/43/23\');">Gen 43:23__NRGen/43/24\');">24__NB1Sa/25/6\');">1Sa 25:6__NB1Ch/12/18\');">1Ch 12:18__NBLuk/10/5\');">Luk 10:5__NRLuk/10/6\');">6__NBJhn/14/27\');">Jhn 14:27__NB1Cr/1/3\');">1Cr 1:3__AN__GHlet_all_thy_wants_2__PSlet all thy wants__FE"Here was genuine hospitality: ""Keep your bread and wine for yourselves, and your straw and provender for your asses; you may need them before you finish your journey: I will supply all your wants for this night; only do not lodge in the street."" __NARom/12/13\');">Rom 12:13__NBGal/6/6\');">Gal 6:6__NBHbr/13/2\');">Hbr 13:2__NBJam/2/15\');">Jam 2:15__NRJam/2/16\');">16__NB1Pe/4/9\');">1Pe 4:9__NB1Jo/3/18\');">1Jo 3:18__AN"__GGlodge_not_3__PSlodge not__FFGen/19/2\');">Gen 19:2__NRGen/19/3\');">3__NBGen/24/31\');">Gen 24:31-33__EN';
stringArray[21] = '__PNSo_he_brought_1__SHSo he brought</a> him into his house, and gave provender unto the asses: and __PNthey_washed_2__SHthey washed</a> their feet, and did eat and drink.__CPSo_he_brought_1__PSSo he brought__FFGen/24/32\');">Gen 24:32__NBGen/43/24\');">Gen 43:24__AN__GHthey_washed_2__PSthey washed__EFGen/18/4\');">Gen 18:4__NB1Sa/25/41\');">1Sa 25:41__NB2Sa/11/8\');">2Sa 11:8__NBLuk/7/44\');">Luk 7:44__NBJhn/13/4\');">Jhn 13:4__NRJhn/13/5\');">5__NRJhn/13/14\');">14__NRJhn/13/15\');">15__NB1Ti/5/10\');">1Ti 5:10__EN';
stringArray[22] = '[Now] as __PNthey_were_1__SHthey were</a> making their hearts merry, behold, __PNthe_men_2__SHthe men</a> of the city, certain __PNsons_of_Belial_3__SHsons of Belial</a>, beset the house round about, [and] beat at the door, and spake to the master of the house, the old man, saying, __PNBring_forth_4__SHBring forth</a> the man that came into thine house, that we may know him.__CPthey_were_1__PSthey were__FFJdg/19/6\');">Jdg 19:6__NRJdg/19/7\');">7__NBJdg/16/25\');">Jdg 16:25__AN__GHthe_men_2__PSthe men__EFJdg/20/5\');">Jdg 20:5__NBGen/19/4\');">Gen 19:4__NBHsa/9/9\');">Hsa 9:9__NBHsa/10/9\');">Hsa 10:9__AN__GGsons_of_Belial_3__PSsons of Belial__FFDeu/13/13\');">Deu 13:13__NB1Sa/1/16\');">1Sa 1:16__NB1Sa/2/12\');">1Sa 2:12__NB1Sa/10/27\');">1Sa 10:27__NB1Sa/25/25\');">1Sa 25:25__NB2Sa/23/6\');">2Sa 23:6__NR2Sa/23/7\');">7__NB2Cr/6/15\');">2Cr 6:15__AN__GHBring_forth_4__PSBring forth__EFGen/19/5\');">Gen 19:5__NBRom/1/26\');">Rom 1:26__NRRom/1/27\');">27__NB1Cr/6/9\');">1Cr 6:9__NBJud/1/7\');">Jud 1:7__EN';
stringArray[23] = 'And __PNthe_man_1__SHthe man</a>, the master of the house, went out unto them, and said unto them, Nay, my brethren, [nay], I pray you, do not [so] wickedly; seeing that this man is come into mine house, __PNdo_not_this_folly_2__SHdo not this folly</a>.__CPthe_man_1__PSthe man__FFGen/19/6\');">Gen 19:6__NRGen/19/7\');">7__AN__GHdo_not_this_folly_2__PSdo not this folly__EFJdg/20/6\');">Jdg 20:6__NBGen/34/7\');">Gen 34:7__NBJos/7/15\');">Jos 7:15__NB2Sa/13/12\');">2Sa 13:12__EN';
stringArray[24] = '__PNBehold_1__SHBehold</a>, [here is] my daughter a maiden, and his concubine; __PNthem_2__SHthem</a> I will bring out now, and __PNhumble_ye_3__SHhumble ye</a> them, and do with them what seemeth good unto you: but unto this man do not __PNso_vile_a_thing_4__SHso vile a thing</a>.__CPBehold_1__PSBehold__EEThe rites of hospitality are regarded as sacred and inviolable in the East: and a man who has admitted a stranger under his roof, is bound to protect him even at the expense of his life. On these high notions only, the influence of which an Asiatic mind alone can appreciate, can the present transaction be either excused or palliated.__GHthem_2__PSthem__EFGen/19/8\');">Gen 19:8__NBRom/3/8\');">Rom 3:8__AN__GGhumble_ye_3__PShumble ye__FFGen/34/2\');">Gen 34:2__AN; *marg:; __NADeu/21/14\');">Deu 21:14__AN__GHso_vile_a_thing_4__PSso vile a thing__FEHeb. the matter of this folly.</TD></TR>';
stringArray[25] = 'But the men would not hearken to him: so the man took his concubine, and brought her forth unto them; and they __PNknew_her_1__SHknew her</a>, __PNand_abused_2__SHand abused</a> her all the night until the morning: and when the day began to spring, they let her go.__CPknew_her_1__PSknew her__FFGen/4/1\');">Gen 4:1__AN__GHand_abused_2__PSand abused__EFJer/5/7\');">Jer 5:7__NRJer/5/8\');">8__NBHsa/7/4\');">Hsa 7:4-7__NBHsa/9/9\');">Hsa 9:9__NBHsa/10/9\');">Hsa 10:9__NBEph/4/19\');">Eph 4:19__EN';
stringArray[26] = 'Then came the woman in the dawning of the day, and fell down at the door of the man\'s house where __PNher_lord_was_1__SHher lord [was]</a>, till it was light.__CPher_lord_was_1__PSher lord was__FFJdg/19/3\');">Jdg 19:3__NRJdg/19/27\');">27__NBGen/18/12\');">Gen 18:12__NB1Pe/3/6\');">1Pe 3:6__EN';
stringArray[27] = 'And her lord rose up in the morning, and opened the doors of the house, and went out to go his way: and, behold, the woman his concubine was fallen down [at] the door of the house, and her hands [were] upon the threshold.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[28] = 'And he said unto her, Up, and let us be going. __PNBut_none_1__SHBut none</a> answered. Then the man took her [up] upon an ass, and the man rose up, and gat him unto his place.__CPBut_none_1__PSBut none__FFJdg/20/5\');">Jdg 20:5__NB1Ki/18/29\');">1Ki 18:29__EN';
stringArray[29] = 'And when he was come into his house, he took a knife, and laid hold on his concubine, and __PNdivided_her_1__SHdivided her</a>, [together] __PNwith_her_bones_2__SHwith her bones</a>, into twelve pieces, and sent her into all the coasts of Israel.__CPdivided_her_1__PSdivided her__EEIt is probable, that with the pieces he sent to each tribe a circumstantial account of the barbarity of the men of Gibeah; and that they considered each of the pieces as expressing an execration. That a similar custom prevailed in ancient times is evident from __NA1Sa/11/7\');">1Sa 11:7__AN. It had an inhuman appearance, thus to mangle the corpse of this unhappy woman; but it was intended to excite a keener resentment against so horrible a crime, which called for a punishment proportionally severe. __NAJdg/20/6\');">Jdg 20:6__NRJdg/20/7\');">7__NBRom/10/2\');">Rom 10:2__AN__GHwith_her_bones_2__PSwith her bones__EFDeu/21/22\');">Deu 21:22__NRDeu/21/23\');">23__EN';
stringArray[30] = 'And it was so, that all that saw it said, There was no such deed done nor seen from the day that the children of Israel came up out of the land of Egypt unto this day: __PNconsider_1__SHconsider</a> of it, take advice, and speak [your minds].__CPconsider_1__PSconsider__FFJdg/20/7\');">Jdg 20:7__NBPro/11/14\');">Pro 11:14__NBPro/13/10\');">Pro 13:10__NBPro/15/22\');">Pro 15:22__NBPro/20/18\');">Pro 20:18__NBPro/24/6\');">Pro 24:6__EN';

</script>
