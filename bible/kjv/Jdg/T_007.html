var stringArray = new Array();
stringArray[1] = 'Then __PNJerubbaal_1__SHJerubbaal</a>, who [is] Gideon, and all the people that [were] with him, __PNrose_up_2__SHrose up</a> early, and pitched beside the well of Harod: so that the host of the Midianites were on the north side of them, by the hill of __PNMoreh_3__SHMoreh</a>, in the valley.__CPJerubbaal_1__PSJerubbaal__EEIt appears that Jerubbaal had now become the surname of Gideon. He is mentioned by Sanchoniathon, quoted by Eusebius, who lived in the reign of Ithobal, king of Tyre, and consequently a little after the time of Gideon, by the name of Jerombalus, a priest of Jeuo or Jao. __NAJdg/6/32\');">Jdg 6:32__AN__GHrose_up_2__PSrose up__EFGen/22/3\');">Gen 22:3__NBJos/3/1\');">Jos 3:1__NBJos/6/12\');">Jos 6:12__NBEcc/9/10\');">Ecc 9:10__AN__GGMoreh_3__PSMoreh__FFGen/12/6\');">Gen 12:6__EN';
stringArray[2] = 'And the LORD said unto Gideon, The people that [are] with thee [are] __PNtoo_many_1__SHtoo many</a> for me to give the Midianites into their hands, lest __PNIsrael_2__SHIsrael</a> vaunt themselves against me, saying, __PNMine_own_3__SHMine own</a> hand hath saved me.__CPtoo_many_1__PStoo many__FF1Sa/14/6\');">1Sa 14:6__NB2Ch/14/11\');">2Ch 14:11__NBZec/4/6\');">Zec 4:6__NBZec/12/7\');">Zec 12:7__NB1Cr/1/27\');">1Cr 1:27-29__NB1Cr/2/4\');">1Cr 2:4__NR1Cr/2/5\');">5__NB2Cr/4/7\');">2Cr 4:7__NB2Cr/10/4\');">2Cr 10:4__NR2Cr/10/5\');">5__AN__GHIsrael_2__PSIsrael__EFDeu/32/27\');">Deu 32:27__NBIsa/2/11\');">Isa 2:11__NRIsa/2/17\');">17__NBJer/9/23\');">Jer 9:23__NBRom/3/27\');">Rom 3:27__NBRom/11/18\');">Rom 11:18__NB1Cr/1/29\');">1Cr 1:29__NBEph/2/9\');">Eph 2:9__NBJam/4/6\');">Jam 4:6__AN__GGMine_own_3__PSMine own__FFDeu/8/17\');">Deu 8:17__NBIsa/10/13\');">Isa 10:13__NBEze/28/2\');">Eze 28:2__NREze/28/17\');">17__NBDan/4/30\');">Dan 4:30__NBHab/1/16\');">Hab 1:16__EN';
stringArray[3] = 'Now therefore go to, proclaim in the ears of the people, saying, __PNWhosoever_1__SHWhosoever</a> [is] fearful and afraid, let him return and depart early from __PNmount_Gilead_2__SHmount Gilead</a>. And there returned of the people __PNtwenty_3__SHtwenty</a> and two thousand; and there remained ten thousand.__CPWhosoever_1__PSWhosoever__FFDeu/20/8\');">Deu 20:8__NBMat/13/21\');">Mat 13:21__NBLuk/14/25\');">Luk 14:25-33__NBRev/17/14\');">Rev 17:14__NBRev/21/8\');">Rev 21:8__AN__GHmount_Gilead_2__PSmount Gilead__FE"Gideon was certainly not at mount Gilead, east of Jordan at this time; but rather near mount Gilboa, west of Jordan. Calmet thinks there must either have been two Gileads, which does not appear from Scripture to have been the case, or that the Hebrew text is corrupt, and that for Gilead we should read Gilboa. This reading, though adopted by Houbigant, is not confirmed by an MS. or version. Dr. Hales endeavours to reconcile the whole, by the supposition that in Gideon\'s army there were many eastern Manassites from mount Gilead, near the Midianites; and therefore proposes to read, ""Whosoever from mount Gilead is fearful and afraid, let him return (home) and depart early."""__GGtwenty_3__PStwenty__FFMat/20/16\');">Mat 20:16__EN';
stringArray[4] = 'And the LORD said unto Gideon, The __PNpeople_1__SHpeople</a> [are] yet [too] many; bring them down unto the water, and __PNI_will_2__SHI will</a> try them for thee there: and it shall be, [that] of whom I say unto thee, This shall go with thee, the same shall go with thee; and of whomsoever I say unto thee, This shall not go with thee, the same shall not go.__CPpeople_1__PSpeople__FFPsa/33/16\');">Psa 33:16__AN__GHI_will_2__PSI will__EFGen/22/1\');">Gen 22:1__NB1Sa/16/7\');">1Sa 16:7__NBJob/23/10\');">Job 23:10__NBPsa/7/9\');">Psa 7:9__NBPsa/66/10\');">Psa 66:10__NBJer/6/27\');">Jer 6:27-30__NBMal/3/2\');">Mal 3:2__NRMal/3/3\');">3__EN';
stringArray[5] = 'So he brought down the people unto the water: and the LORD said unto Gideon, Every one that __PNlappeth_1__SHlappeth</a> of the water with his tongue, as a dog lappeth, him shalt thou set by himself; likewise every one that boweth down upon his knees to drink.__CPlappeth_1__PSlappeth__EE"The original word yalok, is precisely the sound which the dog makes in lapping. It appears that it is not unusual for the Arabs to drink water out of the palms of their hands; and, from this account, we learn that the Israelites did so occasionally. Dr. A. Clarke, in his edition of Harmer, has presented us with the following curious MS. note from Dr. Russell. ""When they take water with the palms of their hands, they naturally place themselves on their hams, to be nearer the water; but when they drink from a pitcher or gourd, fresh filled, they do not sit down on purpose to drink, but drink standing, and very often put the sleeve of their shirt over the mouth of the vessel, by way of strainer, lest small leeches might have been taken up with the water. For the same reason they often prefer taking the water with the palm of the hand to lapping it from the surface."" From the letters of Busbequius we learn, that the Eastern people are not in the habit of drinking standing. The 300 men, who satisfied their thirst "</TD></TR>';
stringArray[6] = 'And the number of them that lapped, [putting] their hand to their mouth, were three hundred men: but all the rest of the people bowed down upon their knees to drink water.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[7] = 'And the LORD said unto Gideon, By the three hundred men that lapped will I save you, and deliver the Midianites into thine hand: and let all the [other] people go every man unto his place.__CPRelated_Verses1_1__PSEntire Verse.__FFJdg/7/18\');">Jdg 7:18-22__NB1Sa/14/6\');">1Sa 14:6__NBIsa/41/14\');">Isa 41:14-16__EN';
stringArray[8] = 'So the people took victuals in their hand, and their __PNtrumpets_1__SHtrumpets</a>: and he sent all [the rest of] Israel every man unto his tent, and retained those three hundred men: and the host of Midian was beneath him __PNin_the_valley_2__SHin the valley</a>.__CPtrumpets_1__PStrumpets__FFJdg/3/27\');">Jdg 3:27__NBLev/23/24\');">Lev 23:24__NBLev/25/9\');">Lev 25:9__NBNum/10/9\');">Num 10:9__NBJos/6/4\');">Jos 6:4__NRJos/6/20\');">20__NBIsa/27/13\');">Isa 27:13__NB1Cr/15/52\');">1Cr 15:52__AN__GHin_the_valley_2__PSin the valley__EFJdg/6/33\');">Jdg 6:33__EN';
stringArray[9] = 'And it came to pass __PNthe_same_1__SHthe same</a> night, that the LORD said unto him, __PNArise_2__SHArise</a>, get thee down unto the host; for __PNI_have_delivered_3__SHI have delivered</a> it into thine hand.__CPthe_same_1__PSthe same__FFGen/46/2\');">Gen 46:2__NRGen/46/3\');">3__NBJob/4/13\');">Job 4:13__NBJob/33/15\');">Job 33:15__NRJob/33/16\');">16__NBMat/1/20\');">Mat 1:20__NBMat/2/13\');">Mat 2:13__NBAct/18/9\');">Act 18:9__NRAct/18/10\');">10__NBAct/27/23\');">Act 27:23__AN__GHArise_2__PSArise__EFJos/1/5\');">Jos 1:5-9__NBIsa/41/10\');">Isa 41:10-16__NBIsa/43/1\');">Isa 43:1__NRIsa/43/2\');">2__AN__GGI_have_delivered_3__PSI have delivered__FFJdg/3/10\');">Jdg 3:10__NRJdg/3/28\');">28__NBJdg/4/14\');">Jdg 4:14__NRJdg/4/15\');">15__NB2Ch/16/8\');">2Ch 16:8__NR2Ch/16/9\');">9__NB2Ch/20/17\');">2Ch 20:17__EN';
stringArray[10] = 'But if thou fear to go down, go thou with Phurah thy servant down to the host:__CPRelated_Verses1_1__PSEntire Verse.__FFJdg/4/8\');">Jdg 4:8__NRJdg/4/9\');">9__NBExd/4/10\');">Exd 4:10-14__EN';
stringArray[11] = 'And __PNthou_shalt_1__SHthou shalt</a> hear what they say; and afterward shall __PNthine_hands_2__SHthine hands</a> be strengthened to go down unto the host. Then went he down with Phurah his servant unto the outside of the __PNarmed_men_3__SHarmed men</a> that [were] in the host.__CPthou_shalt_1__PSthou shalt__FFJdg/7/13\');">Jdg 7:13-15__NBGen/24/14\');">Gen 24:14__NB1Sa/14/8\');">1Sa 14:8__NR1Sa/14/12\');">12__AN__GHthine_hands_2__PSthine hands__EF1Sa/23/16\');">1Sa 23:16__NBEzr/6/22\');">Ezr 6:22__NBNeh/6/9\');">Neh 6:9__NBIsa/35/3\');">Isa 35:3__NRIsa/35/4\');">4__NB2Cr/12/9\');">2Cr 12:9__NR2Cr/12/10\');">10__NBEph/3/16\');">Eph 3:16__NBEph/6/10\');">Eph 6:10__NBPhl/4/13\');">Phl 4:13__AN__GGarmed_men_3__PSarmed men__EEor, ranks by five. __NAExd/13/18\');">Exd 13:18__AN; *marg:</TD></TR>';
stringArray[12] = 'And __PNthe_Midianites_1__SHthe Midianites</a> and the Amalekites and all the children of the east lay along in the valley like __PNgrasshoppers_2__SHgrasshoppers</a> for multitude; and their camels [were] without number, as the sand by the sea side for multitude.__CPthe_Midianites_1__PSthe Midianites__FFJdg/6/3\');">Jdg 6:3__NRJdg/6/5\');">5__NRJdg/6/33\');">33__NB1Ki/4/30\');">1Ki 4:30__AN__GHgrasshoppers_2__PSgrasshoppers__EFJdg/8/10\');">Jdg 8:10__NB2Ch/14/9\');">2Ch 14:9-12__NBPsa/3/1\');">Psa 3:1__NBPsa/33/16\');">Psa 33:16__NBPsa/118/10\');">Psa 118:10-12__NBIsa/8/9\');">Isa 8:9__NRIsa/8/10\');">10__EN';
stringArray[13] = 'And when Gideon was come, behold, [there was] a man that told a dream unto his fellow, and said, Behold, I dreamed a dream, and, __PNlo__a_cake_1__SHlo, a cake</a> of barley bread tumbled into the host of Midian, and came unto a tent, and smote it that it fell, and overturned it, that the tent lay along.__CPlo__a_cake_1__PSlo, a cake__FFJdg/3/15\');">Jdg 3:15__NRJdg/3/31\');">31__NBJdg/4/9\');">Jdg 4:9__NRJdg/4/21\');">21__NBJdg/6/15\');">Jdg 6:15__NBIsa/41/14\');">Isa 41:14__NRIsa/41/15\');">15__NB1Cr/1/27\');">1Cr 1:27__EN';
stringArray[14] = 'And __PNhis_fellow_1__SHhis fellow</a> answered and said, This [is] nothing else save the sword of Gideon the son of Joash, a man of Israel: [for] __PNinto_his_hand_2__SHinto his hand</a> hath God delivered Midian, and all the host.__CPhis_fellow_1__PShis fellow__FFNum/22/38\');">Num 22:38__NBNum/23/5\');">Num 23:5__NRNum/23/20\');">20__NBNum/24/10\');">Num 24:10-13__NBJob/1/10\');">Job 1:10__AN__GHinto_his_hand_2__PSinto his hand__EFExd/15/14\');">Exd 15:14__NRExd/15/15\');">15__NBJos/2/9\');">Jos 2:9__NRJos/2/24\');">24__NBJos/5/1\');">Jos 5:1__NB2Ki/7/6\');">2Ki 7:6__NR2Ki/7/7\');">7__EN';
stringArray[15] = 'And it was [so], when Gideon heard the telling of the dream, and the __PNinterpretation_thereof_1__SHinterpretation thereof</a>, that he __PNworshipped_2__SHworshipped</a>, and returned into the host of Israel, and said, __PNArise_3__SHArise</a>; for the LORD hath delivered into your hand the host of Midian.__CPinterpretation_thereof_1__PSinterpretation thereof__EEHeb. breaking thereof. __NAGen/40/8\');">Gen 40:8__NBGen/41/11\');">Gen 41:11__AN__GHworshipped_2__PSworshipped__EFGen/24/26\');">Gen 24:26__NRGen/24/27\');">27__NRGen/24/48\');">48__NBExd/4/30\');">Exd 4:30__NRExd/4/31\');">31__NB2Ch/20/18\');">2Ch 20:18__NR2Ch/20/19\');">19__AN__GGArise_3__PSArise__FFJdg/4/14\');">Jdg 4:14__NB2Cr/10/4\');">2Cr 10:4-6__EN';
stringArray[16] = 'And he divided the three hundred men [into] __PNthree_companies_1__SHthree companies</a>, and he put __PNa_trumpet_2__SHa trumpet</a> in every man\'s hand, with __PNempty_3__SHempty</a> pitchers, and __PNlamps_4__SHlamps</a> within the pitchers.__CPthree_companies_1__PSthree companies__EEThis small number of men, thus divided, would be able to encompass the whole camp of the Midianites. Concealing the lamps in the pitchers, they would pass unobserved to their appointed stations; then, in the dead of the night, when most of the enemy were fast asleep, all at once breaking their pitchers one against another, with as much noise as they could, and blowing the trumpets and shouting; they would occasion an exceedingly great alarm. The obedience of faith alone could have induced such an expedient, which no doubt God directed Gideon to employ.--Scott.__GHa_trumpet_2__PSa trumpet__FEHeb. trumpets in the hand of all of them.__GGempty_3__PSempty__FF2Cr/4/7\');">2Cr 4:7__AN__GHlamps_4__PSlamps__FEor, fire-brands, or torches.</TD></TR>';
stringArray[17] = 'And he said unto them, Look on me, and do likewise: and, behold, when I come to the outside of the camp, it shall be [that], as I do, so shall ye do.__CPRelated_Verses1_1__PSEntire Verse.__FFJdg/9/48\');">Jdg 9:48__NBMat/16/24\');">Mat 16:24__NB1Cr/11/1\');">1Cr 11:1__NBHbr/13/7\');">Hbr 13:7__NB1Pe/5/3\');">1Pe 5:3__EN';
stringArray[18] = 'When I blow with a trumpet, I and all that [are] with me, then __PNblow_ye_1__SHblow ye</a> the trumpets also on every side of all the camp, and say, [__PNThe_sword_2__SHThe sword</a>] of the LORD, and of Gideon.__CPblow_ye_1__PSblow ye__FFJdg/7/20\');">Jdg 7:20__AN__GHThe_sword_2__PSThe sword__FE"The word cherev, ""sword,"" necessarily implied, and rightly supplied by our venerable translators from __NAJdg/7/20\');">Jdg 7:20__AN, is found in this place, in the Chaldee, Syriac, and Arabic, and in eight MSS.; and evidently appears to be genuine. __NA1Sa/17/47\');">1Sa 17:47__NB2Ch/20/15\');">2Ch 20:15-17__AN"</TD></TR>';
stringArray[19] = 'So Gideon, and the hundred men that [were] with him, came unto the outside of the camp __PNin_the_beginning_1__SHin the beginning</a> of the middle watch; and they had but newly set the watch: and __PNthey_blew_2__SHthey blew</a> the trumpets, and __PNbrake_3__SHbrake</a> the pitchers that [were] in their hands.__CPin_the_beginning_1__PSin the beginning__FFExd/14/24\');">Exd 14:24__NBMat/25/6\');">Mat 25:6__NB1Th/5/2\');">1Th 5:2__NBRev/16/15\');">Rev 16:15__AN__GHthey_blew_2__PSthey blew__EFJdg/7/8\');">Jdg 7:8__AN__GGbrake_3__PSbrake__FFJdg/7/16\');">Jdg 7:16__NBPsa/2/9\');">Psa 2:9__NBJer/13/13\');">Jer 13:13__NRJer/13/14\');">14__NBJer/19/1\');">Jer 19:1-11__EN';
stringArray[20] = 'And the three companies __PNblew_1__SHblew</a> the trumpets, and __PNbrake_2__SHbrake</a> the pitchers, and held the lamps in their left hands, and the trumpets in their right hands to blow [withal]: and they cried, The sword of the LORD, and of Gideon.__CPblew_1__PSblew__EE"How astonishing and overwhelming must the effect be, in a dark night, of the sudden glare of 300 torches, darting their splendour in the same instant on the half-awakened eyes of the terrified Midianites; accompanied with the clangor of 300 trumpets, alternately mingled with the thundering shout of cherav yehovah oolegidon, ""The sword of Jehovah and of Gideon!"" __NANum/10/1\');">Num 10:1-10__NBJos/6/4\');">Jos 6:4__NRJos/6/16\');">16__NRJos/6/20\');">20__NBIsa/27/13\');">Isa 27:13__NB1Cr/15/52\');">1Cr 15:52__NB1Th/4/16\');">1Th 4:16__AN"__GHbrake_2__PSbrake__EF2Cr/4/7\');">2Cr 4:7__NBHbr/11/4\');">Hbr 11:4__NB2Pe/1/15\');">2Pe 1:15__EN';
stringArray[21] = 'And they __PNstood_1__SHstood</a> every man in his place round about the camp: and __PNall_the_host_2__SHall the host</a> ran, and cried, and fled.__CPstood_1__PSstood__FFExd/14/13\');">Exd 14:13__NRExd/14/14\');">14__NB2Ch/20/17\');">2Ch 20:17__NBIsa/30/7\');">Isa 30:7__NRIsa/30/15\');">15__AN__GHall_the_host_2__PSall the host__EFExd/14/25\');">Exd 14:25__NB2Ki/7/6\');">2Ki 7:6__NR2Ki/7/7\');">7__NBJob/15/21\');">Job 15:21__NRJob/15/22\');">22__NBPro/28/1\');">Pro 28:1__EN';
stringArray[22] = 'And the three hundred __PNblew_1__SHblew</a> the trumpets, and __PNthe_LORD_2__SHthe LORD</a> set every man\'s sword against his fellow, even throughout all the host: and the host fled to Bethshittah __PNin_3__SHin</a> __PNZererath_4__SHZererath</a>, [and] to the __PNborder_5__SHborder</a> of __PNAbelmeholah_6__SHAbelmeholah</a>, unto __PNTabbath_7__SHTabbath</a>.__CPblew_1__PSblew__FFJos/6/4\');">Jos 6:4__NRJos/6/16\');">16__NRJos/6/20\');">20__NB2Cr/4/7\');">2Cr 4:7__AN__GHthe_LORD_2__PSthe LORD__EF1Sa/14/16\');">1Sa 14:16-20__NB2Ch/20/23\');">2Ch 20:23__NBPsa/83/9\');">Psa 83:9__NBIsa/9/4\');">Isa 9:4__NBIsa/19/2\');">Isa 19:2__AN__GGin_3__PSin__EEor, toward.__GHZererath_4__PSZererath__FEProbably the same as Zartanah. __NA1Ki/4/12\');">1Ki 4:12__AN__GGborder_5__PSborder__EEHeb. lip.__GHAbelmeholah_6__PSAbelmeholah__FESituated, according to Eusebius 16 miles south from Scythopolis, or Bethshan. __NA1Ki/4/12\');">1Ki 4:12__NB1Ki/19/16\');">1Ki 19:16__AN__GGTabbath_7__PSTabbath__EEProbably the town of [Oébéd] mentioned by Eusebius, 13 miles from Neapolis, or Shechem, towards Scythopolis.</TD></TR>';
stringArray[23] = 'And the men of Israel gathered themselves together out of Naphtali, and out of Asher, and out of all Manasseh, and pursued after the Midianites.__CPRelated_Verses1_1__PSEntire Verse.__FFJdg/6/35\');">Jdg 6:35__NB1Sa/14/21\');">1Sa 14:21__NR1Sa/14/22\');">22__EN';
stringArray[24] = 'And Gideon __PNsent_1__SHsent</a> messengers throughout all mount Ephraim, saying, Come down against the Midianites, and __PNtake_before_2__SHtake before</a> them the waters unto __PNBeth_barah_3__SHBethbarah</a> and Jordan. Then all the men of Ephraim gathered themselves together, and took the waters unto Bethbarah and Jordan.__CPsent_1__PSsent__FFJdg/3/27\');">Jdg 3:27__NBRom/15/30\');">Rom 15:30__NBPhl/1/27\');">Phl 1:27__AN__GHtake_before_2__PStake before__EFJdg/3/28\');">Jdg 3:28__NBJdg/12/5\');">Jdg 12:5__AN__GGBeth_barah_3__PSBeth-barah__EEProbably the same as Betha-bara, beyond Jordan, and at the ford where the Hebrews passed under the direction of Joshua. __NAJhn/1/28\');">Jhn 1:28__EN';
stringArray[25] = 'And they took __PNtwo_princes_1__SHtwo princes</a> of the Midianites, Oreb and Zeeb; and they slew Oreb upon the __PNrock_2__SHrock</a> __PNOreb_3__SHOreb</a>, and Zeeb they slew at the winepress of Zeeb, and pursued Midian, __PNand_brought_4__SHand brought</a> the heads of Oreb and Zeeb to Gideon __PNon_the_other_side_5__SHon the other side</a> Jordan.__CPtwo_princes_1__PStwo princes__FFJdg/8/3\');">Jdg 8:3__NBPsa/83/11\');">Psa 83:11__NRPsa/83/12\');">12__AN__GHrock_2__PSrock__EFJos/7/26\');">Jos 7:26__NBIsa/10/26\');">Isa 10:26__AN__GGOreb_3__PSOreb__EEEusebius and Jerome speak of a small place called Araba, three miles west from Scythopolis, which is supposed by some to have had its name from Oreb.__GHand_brought_4__PSand brought__FEAmong ancient nations, the head of the conquered chief was usually brought to the conqueror. Thus Pompey\'s head was brought to Cæsar, Cicero\'s head to Mark Anthony, and the heads of Ahab\'s children to Jehu. These barbarities are seldom practised now, except among the Mahommedans, or the savages of Africa and America; and for the credit of human nature, it is to be wished that such atrocities had never been committed.__GGon_the_other_side_5__PSon the other side__EEThe words maiaiver lyyarden, may denote at the passage of Jordan, or from beyond Jordan. Gideon does not appear to have yet passed the Jordan. __NAJdg/8/4\');">Jdg 8:4__EN';
