var stringArray = new Array();
stringArray[1] = '__PNThen_all_1__SHThen all</a> the children of Israel went out, and the congregation was gathered together __PNas_one_man_2__SHas one man</a>, __PNfrom_Dan_3__SHfrom Dan</a> even to Beersheba, __PNwith_the_4__SHwith the</a> land of Gilead, __PNunto_the_5__SHunto the</a> LORD __PNin_Mizpeh_6__SHin Mizpeh</a>.__CPThen_all_1__PSThen all__FFJdg/20/2\');">Jdg 20:2__NRJdg/20/8\');">8__NRJdg/20/11\');">11__NBJdg/21/5\');">Jdg 21:5__NBDeu/13/12\');">Deu 13:12-18__NBJos/22/12\');">Jos 22:12__AN__GHas_one_man_2__PSas one man__EF1Sa/11/7\');">1Sa 11:7__NR1Sa/11/8\');">8__NB2Sa/19/14\');">2Sa 19:14__NBEzr/3/1\');">Ezr 3:1__NBNeh/8/1\');">Neh 8:1__AN__GGfrom_Dan_3__PSfrom Dan__FFJdg/18/29\');">Jdg 18:29__NB1Sa/3/20\');">1Sa 3:20__NB2Sa/3/10\');">2Sa 3:10__NB2Sa/24/2\');">2Sa 24:2__NB1Ch/21/2\');">1Ch 21:2__NB2Ch/30/5\');">2Ch 30:5__AN__GHwith_the_4__PSwith the__EFNum/32/1\');">Num 32:1__NRNum/32/40\');">40__NBJos/17/1\');">Jos 17:1__NB2Sa/2/9\');">2Sa 2:9__AN__GGunto_the_5__PSunto the__FFJdg/20/18\');">Jdg 20:18__NRJdg/20/26\');">26__NBJdg/11/11\');">Jdg 11:11__AN__GHin_Mizpeh_6__PSin Mizpeh__EFJdg/10/17\');">Jdg 10:17__NBJdg/11/11\');">Jdg 11:11__NBJos/15/38\');">Jos 15:38__NBJos/18/26\');">Jos 18:26__NB1Sa/7/5\');">1Sa 7:5__NR1Sa/7/6\');">6__NB1Sa/10/17\');">1Sa 10:17__NB2Ki/25/23\');">2Ki 25:23__AN; It does not appear that the Israelites on this occasion, were summoned by the authority of any one common head, but they came together by the consent and agreement, as it were, of one common heart, fired with a holy zeal for the honour of God and Israel. The place of their meeting was Mizpeh; they gathered together unto the LORD there; for Mizpeh was so very near to Shiloh, that their encampment might very well be supposed to reach from Mizpeh to Shiloh. Shiloh was a small town, and therefore, when there was a general meeting of the people to present themselves before God, they chose Mizpeh for their head quarters, which was the next adjoining city of note; perhaps, because they were not willing to give that trouble to Shiloh, which so great an assembly would occasion; it being the residence of the priests that attended the tabernacle.</TD></TR>';
stringArray[2] = 'And the chief of all the people, [even] of all the tribes of Israel, presented themselves in the assembly of the people of God, four hundred thousand footmen that __PNdrew_sword_1__SHdrew sword</a>.__CPdrew_sword_1__PSdrew sword__FFJdg/20/15\');">Jdg 20:15__NRJdg/20/17\');">17__NBJdg/8/10\');">Jdg 8:10__NB2Sa/24/9\');">2Sa 24:9__NB2Ki/3/26\');">2Ki 3:26__EN';
stringArray[3] = '(Now __PNthe_children_of_Benjamin_1__SHthe children of Benjamin</a> heard that the children of Israel were gone up to Mizpeh.) Then said the children of Israel, Tell [us], __PNhow_was_2__SHhow was</a> this wickedness?__CPthe_children_of_Benjamin_1__PSthe children of Benjamin__FFPro/22/3\');">Pro 22:3__NBMat/5/25\');">Mat 5:25__NBLuk/12/58\');">Luk 12:58__NRLuk/12/59\');">59__NBLuk/14/31\');">Luk 14:31__NRLuk/14/32\');">32__AN__GHhow_was_2__PShow was__EFJdg/19/22\');">Jdg 19:22-27__EN';
stringArray[4] = 'And __PNthe_Levite_1__SHthe Levite</a>, the husband of the woman that was slain, answered and said, __PNI_came_2__SHI came</a> into Gibeah that [belongeth] to Benjamin, I and my concubine, to lodge.__CPthe_Levite_1__PSthe Levite__EEHeb. the man the Levite.__GHI_came_2__PSI came__EFJdg/19/15\');">Jdg 19:15-28__EN';
stringArray[5] = '__PNAnd_the_men_1__SHAnd the men</a> of Gibeah rose against me, and __PNbeset_2__SHbeset</a> the house round about upon me by night, [and] thought to have slain me: __PNand_my_concubine_3__SHand my concubine</a> have they __PNforced_4__SHforced</a>, that she is dead.__CPAnd_the_men_1__PSAnd the men__FFJdg/19/22\');">Jdg 19:22__AN__GHbeset_2__PSbeset__EFGen/19/4\');">Gen 19:4-8__AN__GGand_my_concubine_3__PSand my concubine__FFJdg/19/25\');">Jdg 19:25__NRJdg/19/26\');">26__AN__GHforced_4__PSforced__FEHeb. humbled. __NADeu/22/24\');">Deu 22:24__NBEze/22/10\');">Eze 22:10__NREze/22/11\');">11__EN';
stringArray[6] = 'And I took my concubine, and __PNcut_her_1__SHcut her</a> in pieces, and sent her throughout all the country of the inheritance of Israel: for they have committed lewdness and __PNfolly_in_Israel_2__SHfolly in Israel</a>.__CPcut_her_1__PScut her__FFJdg/19/29\');">Jdg 19:29__AN__GHfolly_in_Israel_2__PSfolly in Israel__EFJdg/20/10\');">Jdg 20:10__NBJdg/19/23\');">Jdg 19:23__NBGen/34/7\');">Gen 34:7__NBJos/7/15\');">Jos 7:15__NB2Sa/13/12\');">2Sa 13:12__NR2Sa/13/13\');">13__EN';
stringArray[7] = 'Behold, __PNye_are_all_1__SHye [are] all</a> children of Israel; __PNgive_here_2__SHgive here</a> your advice and counsel.__CPye_are_all_1__PSye are all__FFExd/19/5\');">Exd 19:5__NRExd/19/6\');">6__NBDeu/4/6\');">Deu 4:6__NBDeu/14/1\');">Deu 14:1__NRDeu/14/2\');">2__NB1Cr/5/1\');">1Cr 5:1__NR1Cr/5/6\');">6__NR1Cr/5/10\');">10-12__AN__GHgive_here_2__PSgive here__EFJdg/19/30\');">Jdg 19:30__NBJos/9/14\');">Jos 9:14__NBPro/20/18\');">Pro 20:18__NBPro/24/6\');">Pro 24:6__NBJam/1/5\');">Jam 1:5__EN';
stringArray[8] = 'And all the people arose __PNas_one_man_1__SHas one man</a>, saying, __PNWe_will_not_2__SHWe will not</a> any [of us] go to his tent, neither will we any [of us] turn into his house.__CPas_one_man_1__PSas one man__FFJdg/20/1\');">Jdg 20:1__NRJdg/20/11\');">11__AN__GHWe_will_not_2__PSWe will not__EFJdg/21/1\');">Jdg 21:1__NRJdg/21/5\');">5__NBPro/21/3\');">Pro 21:3__NBEcc/9/10\');">Ecc 9:10__EN';
stringArray[9] = 'But now this [shall be] the thing which we will do to Gibeah; [we will go up] __PNby_lot_against_it_1__SHby lot against it</a>;__CPby_lot_against_it_1__PSby lot against it__FFJos/14/2\');">Jos 14:2__NB1Sa/14/41\');">1Sa 14:41__NR1Sa/14/42\');">42__NB1Ch/24/5\');">1Ch 24:5__NBNeh/11/1\');">Neh 11:1__NBPro/16/33\');">Pro 16:33__NBJon/1/7\');">Jon 1:7__NBAct/1/26\');">Act 1:26__EN';
stringArray[10] = 'And we will take ten men of an hundred throughout all the tribes of Israel, and an hundred of a thousand, and a thousand out of ten thousand, to fetch victual for the people, that they may do, when they come to Gibeah of Benjamin, according to all the folly that they have wrought in Israel.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[11] = 'So all the men of Israel were gathered against the city, knit together as one man.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[12] = 'And the tribes of Israel __PNsent_men_1__SHsent men</a> through all the tribe of Benjamin, saying, What wickedness [is] this that is done among you?__CPsent_men_1__PSsent men__FFDeu/13/14\');">Deu 13:14__NBDeu/20/10\');">Deu 20:10__NBJos/22/13\');">Jos 22:13-16__NBMat/18/15\');">Mat 18:15-18__NBRom/12/18\');">Rom 12:18__EN';
stringArray[13] = 'Now therefore __PNdeliver_1__SHdeliver</a> [us] the men, the __PNchildren_of_Belial_2__SHchildren of Belial</a>, which [are] in Gibeah, that we may put them to death, and __PNput_away_3__SHput away</a> evil from Israel. But the children of Benjamin __PNwould_not_4__SHwould not</a> hearken to the voice of their brethren the children of Israel:__CPdeliver_1__PSdeliver__FF2Sa/20/21\');">2Sa 20:21__NR2Sa/20/22\');">22__AN__GHchildren_of_Belial_2__PSchildren of Belial__EFJdg/19/22\');">Jdg 19:22__NBDeu/13/13\');">Deu 13:13__NB1Sa/30/22\');">1Sa 30:22__NB2Sa/20/1\');">2Sa 20:1__NB2Sa/23/6\');">2Sa 23:6__NB1Ki/21/13\');">1Ki 21:13__NB2Ch/13/7\');">2Ch 13:7__AN__GGput_away_3__PSput away__FFDeu/17/7\');">Deu 17:7__NRDeu/17/12\');">12__NBDeu/19/19\');">Deu 19:19__NBDeu/21/21\');">Deu 21:21__NBDeu/22/21\');">Deu 22:21__NRDeu/22/24\');">24__NBDeu/24/7\');">Deu 24:7__NBEcc/11/10\');">Ecc 11:10__AN__GHwould_not_4__PSwould not__EF1Sa/2/25\');">1Sa 2:25__NB2Ch/25/16\');">2Ch 25:16__NR2Ch/25/20\');">20__NBPro/29/1\');">Pro 29:1__NBHsa/9/9\');">Hsa 9:9__NBHsa/10/9\');">Hsa 10:9__NBRom/1/32\');">Rom 1:32__NBRev/18/4\');">Rev 18:4__NRRev/18/5\');">5__AN; The conduct of the Israelites was very equitable in this demand; but perhaps the rulers or elders of Gibeah ought previously to have been applied to, to deliver up the criminals to justice. However, the refusal of the Benjamites, and their protection of those who had committed this horrible wickedness, because they were of their own tribe, prove them to have been deeply corrupted, and (all their advantages considered) as ripe for divine vengeance as the inhabitants of Sodom and Gomorrah had been. Confiding in their own valour and military skill, they seen to have first prepared for battle in this unequal contest with such superior numbers.</TD></TR>';
stringArray[14] = 'But the children of Benjamin gathered themselves together out of the cities unto Gibeah, to go out to battle against the children of Israel.__CPRelated_Verses1_1__PSEntire Verse.__FFNum/20/20\');">Num 20:20__NBNum/21/23\');">Num 21:23__NB2Ch/13/13\');">2Ch 13:13__NBJob/15/25\');">Job 15:25__NRJob/15/26\');">26__EN';
stringArray[15] = 'And the children of Benjamin were numbered at that time out of the cities __PNtwenty_1__SHtwenty</a> and six thousand men that drew sword, beside the inhabitants of Gibeah, which were numbered seven hundred chosen men.__CPtwenty_1__PStwenty__FFJdg/20/25\');">Jdg 20:25__NRJdg/20/35\');">35__NRJdg/20/46\');">46__NRJdg/20/47\');">47__NBNum/26/41\');">Num 26:41__EN';
stringArray[16] = 'Among all this people [there were] seven hundred chosen men __PNleft_handed_1__SHlefthanded</a>; every one could __PNsling_stones_2__SHsling stones</a> at an hair [breadth], and not miss.__CPleft_handed_1__PSleft-handed__EE"Itter yad yemeeno, ""obstructed in his right hand;"" so the Chaldee Targum, gemid beedaih deyammeena, contracted or impeded in his right hand."" Le Clerc observes, that the 700 men left-handed seem therefore to have been made slingers, because they could not use the right hand, which is employed in managing heavier arms; and they could discharge the stones from the sling in a direction against which their opponents were not upon their guard, and thus do the greater execution. __NAJdg/3/15\');">Jdg 3:15__NB1Ch/12/2\');">1Ch 12:2__AN"__GHsling_stones_2__PSsling stones__FEThe sling was a very ancient warlike instrument; and, in the hands of those who were skilled in the use of it, produced astonishing effects. The inhabitants of the islands of Baleares, now Majorca and Minorca, were the most celebrated slingers of antiquity. They did not permit their children to break their fast, till they had struck down the bread they had to eat from the top of a pole, or some distant eminence. Vegetius tells us, that slingers could in general hit the mark at 600 feet distance. __NA1Sa/17/40\');">1Sa 17:40__NR1Sa/17/49\');">49__NR1Sa/17/50\');">50__NB1Sa/25/29\');">1Sa 25:29__NB2Ch/26/14\');">2Ch 26:14__EN';
stringArray[17] = 'And the men of Israel, beside Benjamin, were numbered __PNfour_hundred_1__SHfour hundred</a> thousand men that drew sword: all these [were] men of war.__CPfour_hundred_1__PSfour hundred__FFJdg/20/2\');">Jdg 20:2__NBNum/1/46\');">Num 1:46__NBNum/26/51\');">Num 26:51__NB1Sa/11/8\');">1Sa 11:8__NB1Sa/15/4\');">1Sa 15:4__NB1Ch/21/5\');">1Ch 21:5__NB2Ch/17/14\');">2Ch 17:14-18__EN';
stringArray[18] = 'And the children of Israel arose, and went up to the __PNhouse_of_1__SHhouse of</a> God, and __PNasked_2__SHasked</a> counsel of God, and said, Which of us shall go up first to the battle against the children of Benjamin? And the LORD said, __PNJudah_3__SHJudah</a> [shall go up] first.__CPhouse_of_1__PShouse of__FFJdg/18/31\');">Jdg 18:31__NBJdg/19/18\');">Jdg 19:18__NBJos/18/1\');">Jos 18:1__NBJoe/1/14\');">Joe 1:14__AN__GHasked_2__PSasked__EFJdg/20/7\');">Jdg 20:7__NRJdg/20/23\');">23__NRJdg/20/26\');">26__NRJdg/20/27\');">27__NBJdg/1/1\');">Jdg 1:1__NBNum/27/5\');">Num 27:5__NRNum/27/21\');">21__NBJos/9/14\');">Jos 9:14__AN__GGJudah_3__PSJudah__FFJdg/1/1\');">Jdg 1:1__NRJdg/1/2\');">2__NBGen/49/8\');">Gen 49:8-10__EN';
stringArray[19] = 'And the children of Israel __PNrose_up_1__SHrose up</a> in the morning, and encamped against Gibeah.__CProse_up_1__PSrose up__FFJos/3/1\');">Jos 3:1__NBJos/6/12\');">Jos 6:12__NBJos/7/16\');">Jos 7:16__EN';
stringArray[20] = 'And the men of Israel went out to battle against Benjamin; and the men of Israel put themselves in array to fight against them at Gibeah.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[21] = 'And __PNthe_children_1__SHthe children</a> of Benjamin came forth out of Gibeah, and __PNdestroyed_2__SHdestroyed</a> down to the ground of the Israelites that day twenty and two thousand men.__CPthe_children_1__PSthe children__FFGen/49/27\');">Gen 49:27__NBHsa/10/9\');">Hsa 10:9__AN__GHdestroyed_2__PSdestroyed__EFDeu/23/9\');">Deu 23:9__NB2Ch/28/10\');">2Ch 28:10__NBPsa/33/16\');">Psa 33:16__NBPsa/73/18\');">Psa 73:18__NRPsa/73/19\');">19__NBPsa/77/19\');">Psa 77:19__NBEcc/9/1\');">Ecc 9:1-3__NBJer/12/1\');">Jer 12:1__EN';
stringArray[22] = 'And the people the men of Israel __PNencouraged_1__SHencouraged</a> themselves, and set their battle again in array in the place where they put themselves in array the first day.__CPencouraged_1__PSencouraged__FFJdg/20/15\');">Jdg 20:15__NRJdg/20/17\');">17__NB1Sa/30/6\');">1Sa 30:6__NB2Sa/11/25\');">2Sa 11:25__NBPsa/64/5\');">Psa 64:5__EN';
stringArray[23] = '(And the children of Israel went up and __PNwept_1__SHwept</a> before the LORD until even, and asked counsel of the LORD, saying, Shall I go up again to battle against the children of Benjamin my brother? __PNAnd_the_2__SHAnd the</a> LORD said, Go up against him.)__CPwept_1__PSwept__FFJdg/20/26\');">Jdg 20:26__NRJdg/20/27\');">27__NBPsa/78/34\');">Psa 78:34-36__NBHsa/5/15\');">Hsa 5:15__AN__GHAnd_the_2__PSAnd the__FE"It seems most evident that the Israelites did not seek the protection of God. When they ""went to the house of God,"" (__NAJdg/20/18\');">Jdg 20:18__AN,) it was not to enquire concerning the expediency of the war, nor of its success, but which of the tribes should begin the attack: and here the question is, ""Shall I go up again to battle against the children of Benjamin my brother?"" Having so much right on their side, they had no doubt of the justice of their cause, and the propriety of their conduct; and having such a superiority of numbers, they had no doubt of success. But God humbled them, and delivered them into the hands of their enemies; and shewed them that the race was not to the swift, nor the battle to the strong."</TD></TR>';
stringArray[24] = 'And the children of Israel came near against the children of Benjamin the second day.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[25] = 'And Benjamin went forth against them out of Gibeah the second day, and __PNdestroyed_1__SHdestroyed</a> down to the ground of the children of Israel again eighteen thousand men; all these drew the sword.__CPdestroyed_1__PSdestroyed__FFJdg/20/21\');">Jdg 20:21__NBGen/18/25\');">Gen 18:25__NBJob/9/12\');">Job 9:12__NRJob/9/13\');">13__NBPsa/97/2\');">Psa 97:2__NBRom/2/5\');">Rom 2:5__NBRom/3/5\');">Rom 3:5__NBRom/11/33\');">Rom 11:33__EN';
stringArray[26] = 'Then __PNall_the_children_1__SHall the children</a> of Israel, and all the people, went up, and came unto the house of God, and __PNwept_2__SHwept</a>, and sat there before the LORD, and fasted that day until even, and offered burnt offerings and peace offerings before the LORD.__CPall_the_children_1__PSall the children__FFJdg/20/18\');">Jdg 20:18__NRJdg/20/23\');">23__AN__GHwept_2__PSwept__EF1Sa/7/6\');">1Sa 7:6__NB2Ch/20/3\');">2Ch 20:3__NBEzr/8/21\');">Ezr 8:21__NBEzr/9/4\');">Ezr 9:4__NREzr/9/5\');">5__NBJoe/1/14\');">Joe 1:14__NBJoe/2/12\');">Joe 2:12-18__NBJon/3/5\');">Jon 3:5-10__EN';
stringArray[27] = 'And the children of Israel __PNenquired_1__SHenquired</a> of the LORD, (for __PNthe_ark_2__SHthe ark</a> of the covenant of God [was] there in those days,__CPenquired_1__PSenquired__FFJdg/20/18\');">Jdg 20:18__NRJdg/20/23\');">23__NBNum/27/21\');">Num 27:21__AN__GHthe_ark_2__PSthe ark__FE"__NAJos/18/1\');">Jos 18:1__NB1Sa/4/3\');">1Sa 4:3__NR1Sa/4/4\');">4__NBPsa/78/60\');">Psa 78:60__NRPsa/78/61\');">61__NBJer/7/12\');">Jer 7:12__AN; The loss of two battles at length brought this stiff-necked people to enquire of the LORD; for all the company at this time met at Shiloh, and kept a day of fasting and prayer with great earnestness and solemnity. ""Behold, the LORD\'s hand is not shortened, that it cannot save; neither his ear heavy, that it cannot hear.""; __NAIsa/59/1\');">Isa 59:1__AN"</TD></TR>';
stringArray[28] = 'And __PNPhinehas_1__SHPhinehas</a>, the son of Eleazar, the son of Aaron, __PNstood_2__SHstood</a> before it in those days,) saying, __PNShall_I_yet_3__SHShall I yet</a> again go out to battle against the children of Benjamin my brother, or shall I cease? And the LORD said, __PNGo_up_4__SHGo up</a>; for to morrow I will deliver them into thine hand.__CPPhinehas_1__PSPhinehas__EEIt is evident, from this mention of Phinehas, the son of Eleazar, that these transactions must have taken place not long after the death of Joshua. __NANum/25/7\');">Num 25:7-13__NBJos/22/13\');">Jos 22:13__NRJos/22/30\');">30-32__NBJos/24/33\');">Jos 24:33__AN__GHstood_2__PSstood__EFDeu/10/8\');">Deu 10:8__NBDeu/18/5\');">Deu 18:5__AN__GGShall_I_yet_3__PSShall I yet__FFJos/7/7\');">Jos 7:7__NB1Sa/14/37\');">1Sa 14:37__NB1Sa/23/4\');">1Sa 23:4-12__NB1Sa/30/8\');">1Sa 30:8__NB2Sa/5/19\');">2Sa 5:19-24__NB2Sa/6/3\');">2Sa 6:3__NR2Sa/6/7\');">7-12__NBPro/3/5\');">Pro 3:5__NRPro/3/6\');">6__NBJer/10/23\');">Jer 10:23__AN__GHGo_up_4__PSGo up__EFJdg/1/2\');">Jdg 1:2__NBJdg/7/9\');">Jdg 7:9__NB2Ch/20/17\');">2Ch 20:17__EN';
stringArray[29] = 'And __PNIsrael_1__SHIsrael</a> set __PNliers_2__SHliers</a> in wait round about Gibeah.__CPIsrael_1__PSIsrael__EEThough God had promised them success, they knew they could expect it only by the use of proper means. Hence they used all prudent precaution, and employed all their military skill.__GHliers_2__PSliers__EFJdg/20/34\');">Jdg 20:34__NBJos/8/4\');">Jos 8:4__NB2Sa/5/23\');">2Sa 5:23__EN';
stringArray[30] = 'And the children of Israel went up against the children of Benjamin on the third day, and put themselves in array against Gibeah, as at other times.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[31] = 'And the children of Benjamin went out against the people, [and] were __PNdrawn_1__SHdrawn</a> away from the city; and they began to __PNsmite_of_the_people__and_kill__as_at_2__SHsmite of the people, [and] kill, as at</a> other times, in the highways, of which one goeth up to __PNthe_house_of_God_3__SHthe house of God</a>, and the other to Gibeah in the field, about __PNthirty_4__SHthirty</a> men of Israel.__CPdrawn_1__PSdrawn__FFJos/8/14\');">Jos 8:14-16__AN__GHsmite_of_the_people__and_kill__as_at_2__PSsmite of the people, and kill, as at__FEHeb. smite of the people wounded as at, etc.__GGthe_house_of_God_3__PSthe house of God__EEor, Beth-el. Gibeah. __NAJdg/19/13\');">Jdg 19:13__NRJdg/19/14\');">14__NBIsa/10/29\');">Isa 10:29__AN__GHthirty_4__PSthirty__EFJos/7/5\');">Jos 7:5__EN';
stringArray[32] = 'And the children of Benjamin said, They [are] smitten down before us, as at the first. But the children of Israel said, __PNLet_us_flee_1__SHLet us flee</a>, and draw them from the city unto the highways.__CPLet_us_flee_1__PSLet us flee__EEThis was done, not only because they had placed an ambuscade behind Gibeah, which was to enter and burn the city as soon as the Benjamites left it; but it would seem, that the slingers, by being within the city and its fortifications, had great advantage over the Israelites by their slings, when they could not come among them with their swords, unless they got them in the plain country. __NAJos/8/15\');">Jos 8:15__NRJos/8/16\');">16__EN';
stringArray[33] = 'And all the men of Israel __PNrose_up_1__SHrose up</a> out of their place, and __PNput_themselves_2__SHput themselves</a> in array at Baaltamar: and the liers in wait of Israel came forth out of their places, [even] out of the meadows of Gibeah.__CProse_up_1__PSrose up__FFJos/8/18\');">Jos 8:18-22__AN__GHput_themselves_2__PSput themselves__FEThere appear to have been three divisions of the Israelitish army: one at Baal-tamar, (which was situated, says Eusebius, near Gibeah;) a second behind the city in ambush; and a third, who skirmished with the Benjamites before Gibeah.</TD></TR>';
stringArray[34] = 'And there came against Gibeah __PNten_thousand_1__SHten thousand</a> chosen men out of all Israel, and the battle was sore: but they __PNknew_not_2__SHknew not</a> that evil [was] near them.__CPten_thousand_1__PSten thousand__FFJdg/20/29\');">Jdg 20:29__AN__GHknew_not_2__PSknew not__EFJos/8/14\');">Jos 8:14__NBJob/21/13\');">Job 21:13__NBPro/4/19\');">Pro 4:19__NBPro/29/6\');">Pro 29:6__NBEcc/8/11\');">Ecc 8:11__NREcc/8/12\');">12__NBEcc/9/12\');">Ecc 9:12__NBIsa/3/10\');">Isa 3:10__NRIsa/3/11\');">11__NBIsa/47/11\');">Isa 47:11__NBMat/24/44\');">Mat 24:44__NBLuk/21/34\');">Luk 21:34__NBLuk/21/34\');">Luk 21:34__NB1Th/5/3\');">1Th 5:3__EN';
stringArray[35] = 'And the LORD smote Benjamin before Israel: and the children of Israel destroyed of the Benjamites that day __PNtwenty_1__SHtwenty</a> and five thousand and an hundred men: all these drew the sword.__CPtwenty_1__PStwenty__FFJdg/20/15\');">Jdg 20:15__NRJdg/20/44\');">44-46__NBJob/20/5\');">Job 20:5__AN; Though the numbers of the Israelites were immensely superior to those of Benjamin, though the stratagem was well laid and ingeniously executed, and the battle bravely fought, yet the inspired historian ascribes the victory to the hand of the LORD, as entirely as if he had smitten the Benjamites by a miracle.</TD></TR>';
stringArray[36] = 'So the children of Benjamin saw that they were smitten: __PNfor_the_men_1__SHfor the men</a> of Israel gave place to the Benjamites, because they trusted unto the liers in wait which they had set beside Gibeah.__CPfor_the_men_1__PSfor the men__FFJos/8/15\');">Jos 8:15-29__EN';
stringArray[37] = 'And __PNthe_liers_in_wait_hasted_1__SHthe liers in wait hasted</a>, and rushed upon Gibeah; and the liers in wait __PNdrew_themselves_along_2__SHdrew [themselves] along</a>, and smote all the city with the edge of the sword.__CPthe_liers_in_wait_hasted_1__PSthe liers in wait hasted__FFJos/8/19\');">Jos 8:19__AN__GHdrew_themselves_along_2__PSdrew themselves along__FEor, made a long sound with the trumpets. __NAExd/19/13\');">Exd 19:13__NBJos/6/5\');">Jos 6:5__EN';
stringArray[38] = '__PNNow_there_1__SHNow there</a> was an appointed __PNsign_2__SHsign</a> between the men of Israel __PNand_3__SHand</a> the liers in wait, that they should make a great flame with smoke rise up out of the city.__CPNow_there_1__PSNow there__EEFrom this verse to the end of the chapter, we have the details of the same operations which are mentioned, in a general way, in the preceding verses of this chapter.__GHsign_2__PSsign__FEor, time. __NAGen/17/21\');">Gen 17:21__NB2Ki/4/16\');">2Ki 4:16__AN; *marg:__GGand_3__PSand__EEHeb. with. flame. Heb. elevation.</TD></TR>';
stringArray[39] = '__PNAnd_when_1__SHAnd when</a> the men of Israel retired in the battle, Benjamin began to __PNsmite_and_kill_2__SHsmite [and] kill</a> of the men of Israel about thirty persons: for they said, Surely they are smitten down before us, as [in] the first battle.__CPAnd_when_1__PSAnd when__FFJdg/20/31\');">Jdg 20:31__AN__GHsmite_and_kill_2__PSsmite and kill__FEHeb. smite the wounded.</TD></TR>';
stringArray[40] = 'But when the flame began to arise up out of the city with __PNa_pillar_1__SHa pillar</a> of smoke, the Benjamites __PNlooked_2__SHlooked</a> behind them, and, behold, the __PNflame_3__SHflame</a> of the city ascended up to heaven.__CPa_pillar_1__PSa pillar__FFGen/19/28\');">Gen 19:28__NBSgs/3/6\');">Sgs 3:6__NBJoe/2/30\');">Joe 2:30__NBRev/19/3\');">Rev 19:3__AN__GHlooked_2__PSlooked__EFJos/8/20\');">Jos 8:20__AN__GGflame_3__PSflame__EEHeb. whole consumption.</TD></TR>';
stringArray[41] = 'And when the men of Israel turned again, the men of Benjamin __PNwere_amazed_1__SHwere amazed</a>: for they saw that evil __PNwas_come_upon_them_2__SHwas come upon them</a>.__CPwere_amazed_1__PSwere amazed__FFExd/15/9\');">Exd 15:9__NRExd/15/10\');">10__NBIsa/13/8\');">Isa 13:8__NRIsa/13/9\');">9__NBIsa/33/14\');">Isa 33:14__NBLuk/17/27\');">Luk 17:27__NRLuk/17/28\');">28__NBLuk/21/26\');">Luk 21:26__NB1Th/5/3\');">1Th 5:3__NB2Pe/2/12\');">2Pe 2:12__NBRev/6/15\');">Rev 6:15-17__NBRev/18/8\');">Rev 18:8-10__AN__GHwas_come_upon_them_2__PSwas come upon them__FEHeb. touched them.</TD></TR>';
stringArray[42] = 'Therefore they turned [their backs] before the men of Israel unto the way of the wilderness; but __PNthe_battle_1__SHthe battle</a> overtook them; and them which [came] out of the cities they destroyed in the midst of them.__CPthe_battle_1__PSthe battle__FFLam/1/3\');">Lam 1:3__NBHsa/9/9\');">Hsa 9:9__NBHsa/10/9\');">Hsa 10:9__EN';
stringArray[43] = '[Thus] they __PNinclosed_1__SHinclosed</a> the Benjamites round about, [and] chased them, [and] trode them down __PNwith_ease_2__SHwith ease</a> over against Gibeah toward the sunrising.__CPinclosed_1__PSinclosed__FFJos/8/20\');">Jos 8:20-22__AN__GHwith_ease_2__PSwith ease__FEor, from Menuchah, etc. over against. Heb. unto over against.</TD></TR>';
stringArray[44] = 'And there fell of Benjamin eighteen thousand men; all these [were] men of valour.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[45] = 'And they turned and fled toward the wilderness unto the rock of __PNRimmon_1__SHRimmon</a>: and they gleaned of them in the highways five thousand men; and pursued hard after them unto Gidom, and slew two thousand men of them.__CPRimmon_1__PSRimmon__FFJos/15/32\');">Jos 15:32__NB1Ch/6/77\');">1Ch 6:77__NBZec/14/10\');">Zec 14:10__EN';
stringArray[46] = 'So that all which fell that day of Benjamin were __PNtwenty_1__SHtwenty</a> and five thousand men that drew the sword; all these [were] men of valour.__CPtwenty_1__PStwenty__FFJdg/20/15\');">Jdg 20:15__NRJdg/20/35\');">35__EN';
stringArray[47] = 'But __PNsix_hundred_1__SHsix hundred</a> men turned and fled to the wilderness unto the __PNrock_Rimmon_2__SHrock Rimmon</a>, and abode in the rock Rimmon four months.__CPsix_hundred_1__PSsix hundred__FFJdg/21/13\');">Jdg 21:13__NBPsa/103/9\');">Psa 103:9__NRPsa/103/10\');">10__NBIsa/1/9\');">Isa 1:9__NBJer/14/7\');">Jer 14:7__NBLam/3/32\');">Lam 3:32__NBHab/3/2\');">Hab 3:2__AN__GHrock_Rimmon_2__PSrock Rimmon__FE"The rock Rimmon was doubtless a strong place; but it is uncertain where situated. It is probable however, that it was near, and took its name from, the village of Remmon, mentioned by Eusebius, fifteen miles north from Jerusalem. It appears that rocks are still resorted to in the East, as places of security; and some of them are even capable of sustaining a siege. De La Roque says, that ""The Grand Seignior, wishing to seize the person of the emir (Fakr-eddin, prince of the Druses,) gave orders to the pacha to take him prisoner: he accordingly came in search of him, with a new army, in the district of Chouf, which is part of mount Lebanon, wherein is the village of Gesin, and close to it, the rock which served for a retreat to the emir. It is named in Arabic, Magara Gesin, i.e., the cavern of Gessin, by which name it is famous. The pacha pressed the emir so closely, that this unfortunate prince was obliged to shut himself up in the cleft of a great rock, with a small number of his officers. The pacha besieged "</TD></TR>';
stringArray[48] = 'And the men of Israel turned again upon the children of Benjamin, and __PNsmote_them_1__SHsmote them</a> with the edge of the sword, as well the men of [every] city, as the beast, and all that __PNcame_to_hand_2__SHcame to hand</a>: also they set on fire all the cities that they came to.__CPsmote_them_1__PSsmote them__FFDeu/13/15\');">Deu 13:15-17__NB2Ch/25/13\');">2Ch 25:13__NB2Ch/28/6\');">2Ch 28:6-9__NBPro/18/19\');">Pro 18:19__AN__GHcame_to_hand_2__PScame to hand__FEHeb. was found. they came to. Heb. were found.</TD></TR>';
