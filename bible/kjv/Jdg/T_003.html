stringArray[19] = 'But he himself turned again from the __PNquarries_1__SHquarries</a> that [were] by Gilgal, and said, I have __PNa_secret_2__SHa secret</a> errand unto thee, O king: who said, Keep silence. __PNAnd_all_that_3__SHAnd all that</a> stood by him went out from him.__CPquarries_1__PSquarries__EEor graven images. __NAJos/4/20\');">Jos 4:20__AN__GHa_secret_2__PSa secret__EFJdg/3/20\');">Jdg 3:20__NB2Ki/9/5\');">2Ki 9:5__NR2Ki/9/6\');">6__NBAct/23/18\');">Act 23:18__NRAct/23/19\');">19__AN__GGAnd_all_that_3__PSAnd all that__FFGen/45/1\');">Gen 45:1__EN';
stringArray[20] = 'And Ehud came unto him; and he was sitting in __PNa_summer_parlour_1__SHa summer parlour</a>, which he had for himself alone. And Ehud said, __PNI_have_2__SHI have</a> a message from God unto thee. And __PNhe_arose_3__SHhe arose</a> out of [his] seat.__CPa_summer_parlour_1__PSa summer parlour__EEHeb. a parlour of cooling. The âleeyah, or upper chamber, seems to have been of the same description as the olëah of the Arabs, but properly ventilated, described by Dr. Shaw, who says, that to most of their houses there is a smaller one annexed, which sometimes rises one story higher than the house; at other times, it consists of one or two rooms only, and a terrace; while others that are built, as they frequently are, over the porch or gateway, have, if we except the ground floor, which they want, all the conveniences that belong to the house itself. There is a door of communication from them into the gallery of the house; besides another, which opens immediately from a private staircase, down into the porch or street, without giving the least disturbance to the house. In these back houses strangers are usually lodged and entertained; and to them likewise the men are wont to retire from the noise and hurry of their families, to be more at leisure for mediation or diversions. __NAAmo/3/15\');">Amo 3:15__AN__GHI_have_2__PSI have__EFJdg/3/19\');">Jdg 3:19__NB2Sa/12/1\');">2Sa 12:1-15__NB2Sa/24/12\');">2Sa 24:12__NBMic/6/9\');">Mic 6:9__AN__GGhe_arose_3__PShe arose__FFPsa/29/1\');">Psa 29:1__NBJer/10/7\');">Jer 10:7__EN';

stringArray[27] = 'And it came to pass, when he was come, that __PNhe_blew_1__SHhe blew</a> a trumpet in the __PNmountain_2__SHmountain</a> of Ephraim, and the children of Israel went down with him from the mount, and he before them.__CPhe_blew_1__PShe blew__FFJdg/5/14\');">Jdg 5:14__NBJdg/6/34\');">Jdg 6:34__NB1Sa/13/3\');">1Sa 13:3__NB2Sa/20/22\');">2Sa 20:22__NB2Ki/9/13\');">2Ki 9:13__AN__GHmountain_2__PSmountain__EFJdg/7/24\');">Jdg 7:24__NBJdg/17/1\');">Jdg 17:1__NBJdg/19/1\');">Jdg 19:1__NBJos/17/15\');">Jos 17:15__NRJos/17/18\');">18__EN';

stringArray[31] = 'And after him was __PNShamgar_1__SHShamgar</a> the son of Anath, which slew of the Philistines six hundred men with __PNan_ox_goad_2__SHan ox goad</a>: and he __PNalso_3__SHalso</a> delivered __PNIsrael_4__SHIsrael</a>.__CPShamgar_1__PSShamgar__FFJdg/5/6\');">Jdg 5:6__NRJdg/5/8\');">8__AN__GHan_ox_goad_2__PSan ox goad__FE"This implement, Mr. Maundrell informs us, in Palestine and Syria is of an extraordinary size. He measured several, and ""found them about eight feet long; and at the bigger end about six inches in circumference. They were armed at the lesser end with a sharp prickle for driving the oxen; and at the other end with a small paddle of iron, strong and massive, for cleansing the plough from the clay. In the hand of a powerful man such an instrument must be more dangerous and fatal than a sword."" __NAJdg/15/15\');">Jdg 15:15__NB1Sa/13/19\');">1Sa 13:19-22__NB1Sa/17/47\');">1Sa 17:47__NR1Sa/17/50\');">50__NB1Cr/1/17\');">1Cr 1:17__AN"__GGalso_3__PSalso__FFJdg/2/16\');">Jdg 2:16__AN__GHIsrael_4__PSIsrael__FE"""So part is called Israel."" __NAJdg/4/1\');">Jdg 4:1__NRJdg/4/3\');">3-24__NBJdg/10/7\');">Jdg 10:7__NRJdg/10/17\');">17__NBJdg/11/4\');">Jdg 11:4-33__NB1Sa/4/1\');">1Sa 4:1__AN; ""It seems to concern only the country next to the Philistines."""</TD></TR>';
