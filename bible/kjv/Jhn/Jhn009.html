Text[1] = 'And as [Jesus] passed by, he saw a man which was blind from [his] birth.';

Text[14] = 'And it was the sabbath day when Jesus made the clay, and opened his eyes.';

Text[18] = 'But the Jews did not believe concerning him, that he had been blind, and received his sight, until they called the parents of him that had received his sight.';
Text[19] = 'And they asked them, saying, Is this your son, who ye say was born blind? how then doth he now see?';
Text[20] = 'His parents answered them and said, We know that this is our son, and that he was born blind:';
Text[21] = 'But by what means he now seeth, we know not; or who hath opened his eyes, we know not: he is of age; ask him: he shall speak for himself.';
Text[22] = 'These [words] spake his parents, because they feared the Jews: for the Jews had agreed already, that if any man did confess that he was Christ, he should be put out of the synagogue.';
Text[23] = 'Therefore said his parents, He is of age; ask him.';
Text[24] = 'Then again called they the man that was blind, and said unto him, Give God the praise: we know that this man is a sinner.';
Text[25] = 'He answered and said, Whether he be a sinner [or no], I know not: one thing I know, that, whereas I was blind, now I see.';
Text[26] = 'Then said they to him again, What did he to thee? how opened he thine eyes?';
Text[27] = 'He answered them, I have told you already, and ye did not hear: wherefore would ye hear [it] again? will ye also be his disciples?';
Text[28] = 'Then they reviled him, and said, Thou art his disciple; but we are Moses\' disciples.';
Text[29] = 'We know that God spake unto Moses: [as for] this [fellow], we know not from whence he is.';
Text[30] = 'The man answered and said unto them, Why herein is a marvellous thing, that ye know not from whence he is, and [yet] he hath opened mine eyes.';
Text[31] = 'Now we know that God heareth not sinners: but if any man be a worshipper of God, and doeth his will, him he heareth.';
Text[32] = 'Since the world began was it not heard that any man opened the eyes of one that was born blind.';
Text[33] = 'If this man were not of God, he could do nothing.';
Text[34] = 'They answered and said unto him, Thou wast altogether born in sins, and dost thou teach us? And they cast him out.';
Text[35] = 'Jesus heard that they had cast him out; and when he had found him, he said unto him, Dost thou believe on the Son of God?';
Text[36] = 'He answered and said, Who is he, Lord, that I might believe on him?';
Text[37] = 'And Jesus said unto him, Thou hast both seen him, and it is he that talketh with thee.';
Text[38] = 'And he said, Lord, I believe. And he worshipped him.';
Text[39] = 'And Jesus said, For judgment I am come into this world, that they which see not might see; and that they which see might be made blind.';
Text[40] = 'And [some] of the Pharisees which were with him heard these words, and said unto him, Are we blind also?';
