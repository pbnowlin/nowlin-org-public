stringArray[28] = 'And Thomas answered and said unto him, __PNMy_Lord_1__SHMy Lord</a> and my God.__CPMy_Lord_1__PSMy Lord__EE"The disbelief of the apostle is the means of furnishing us with a full and satisfactory demonstration of the resurrection of our LORD. Throughout the divine dispensations every doctrine and ever important truth is gradually revealed; and here we have a conspicuous instance of the progressive system. An angel first declares the glorious event; the empty sepulchre confirms the women\'s report. Christ\'s appearance to Mary Magdalene shewed that he was alive; that to the disciples at Emmaus proved that it was at the least the spirit of Christ; that to the eleven shewed the reality of his body; and the conviction given to Thomas proved it the self-same body that had been crucified. Incredulity itself is satisfied; and the convinced apostle exclaims, in the joy of his heart, ""My LORD and my God!"" __NAJhn/20/16\');">Jhn 20:16__NRJhn/20/31\');">31__NBJhn/5/23\');">Jhn 5:23__NBJhn/9/35\');">Jhn 9:35-38__NBPsa/45/6\');">Psa 45:6__NRPsa/45/11\');">11__NBPsa/102/24\');">Psa 102:24-28__NBPsa/118/24\');">Psa 118:24-28__NBIsa/7/14\');">Isa 7:14__NBIsa/9/6\');">Isa 9:6__NBIsa/25/9\');">Isa 25:9__NBIsa/40/9\');">Isa 40:9-11__NBJer/23/5\');">Jer 23:5__NRJer/23/6\');">6__NBMal/3/1\');">Mal 3:1__NBMat/14/33\');">Mat 14:33__NBLuk/24/52\');">Luk 24:52__NBAct/7/59\');">Act 7:59__NRAct/7/60\');">60__NB1Ti/3/16\');">1Ti 3:16__NBRev/5/9\');">Rev 5:9-14__AN"</TD></TR>';
