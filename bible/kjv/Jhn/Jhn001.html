Text[1] = 'In the beginning was the Word, and the Word was with God, and the Word was God.';
Text[2] = 'The same was in the beginning with God.';
Text[3] = 'All things were made by him; and without him was not any thing made that was made.';
Text[4] = 'In him was life; and the life was the light of men.';
Text[5] = 'And the light shineth in darkness; and the darkness comprehended it not.';
Text[6] = 'There was a man sent from God, whose name [was] John.';
Text[7] = 'The same came for a witness, to bear witness of the Light, that all [men] through him might believe.';
Text[8] = 'He was not that Light, but [was sent] to bear witness of that Light.';
Text[9] = '[That] was the true Light, which lighteth every man that cometh into the world.';
Text[10] = 'He was in the world, and the world was made by him, and the world knew him not.';
Text[11] = 'He came unto his own, and his own received him not.';
Text[12] = 'But as many as received him, to them gave he power to become the sons of God, [even] to them that believe on his name:';
Text[13] = 'Which were born, not of blood, nor of the will of the flesh, nor of the will of man, but of God.';
Text[14] = 'And the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth.';
Text[15] = 'John bare witness of him, and cried, saying, This was he of whom I spake, He that cometh after me is preferred before me: for he was before me.';
Text[16] = 'And of his fulness have all we received, and grace for grace.';
Text[17] = 'For the law was given by Moses, [but] grace and truth came by Jesus Christ.';
Text[18] = 'No man hath seen God at any time; the only begotten Son, which is in the bosom of the Father, he hath declared [him].';
Text[19] = 'And this is the record of John, when the Jews sent priests and Levites from Jerusalem to ask him, Who art thou?';
Text[20] = 'And he confessed, and denied not; but confessed, I am not the Christ.';
Text[21] = 'And they asked him, What then? Art thou Elias? And he saith, I am not. Art thou that prophet? And he answered, No.';
Text[22] = 'Then said they unto him, Who art thou? that we may give an answer to them that sent us. What sayest thou of thyself?';
Text[23] = 'He said, I [am] the voice of one crying in the wilderness, Make straight the way of the Lord, as said the prophet Esaias.';
Text[24] = 'And they which were sent were of the Pharisees.';
Text[25] = 'And they asked him, and said unto him, Why baptizest thou then, if thou be not that Christ, nor Elias, neither that prophet?';
Text[26] = 'John answered them, saying, I baptize with water: but there standeth one among you, whom ye know not;';
Text[27] = 'He it is, who coming after me is preferred before me, whose shoe\'s latchet I am not worthy to unloose.';
Text[28] = 'These things were done in Bethabara beyond Jordan, where John was baptizing.';
Text[29] = 'The next day John seeth Jesus coming unto him, and saith, Behold the Lamb of God, which taketh away the sin of the world.';
Text[30] = 'This is he of whom I said, After me cometh a man which is preferred before me: for he was before me.';
Text[31] = 'And I knew him not: but that he should be made manifest to Israel, therefore am I come baptizing with water.';
Text[32] = 'And John bare record, saying, I saw the Spirit descending from heaven like a dove, and it abode upon him.';
Text[33] = 'And I knew him not: but he that sent me to baptize with water, the same said unto me, Upon whom thou shalt see the Spirit descending, and remaining on him, the same is he which baptizeth with the Holy Ghost.';
Text[34] = 'And I saw, and bare record that this is the Son of God.';
Text[35] = 'Again the next day after John stood, and two of his disciples;';
Text[36] = 'And looking upon Jesus as he walked, he saith, Behold the Lamb of God!';
Text[37] = 'And the two disciples heard him speak, and they followed Jesus.';
Text[38] = 'Then Jesus turned, and saw them following, and saith unto them, What seek ye? They said unto him, Rabbi, (which is to say, being interpreted, Master,) where dwellest thou?';
Text[39] = 'He saith unto them, Come and see. They came and saw where he dwelt, and abode with him that day: for it was about the tenth hour.';
Text[40] = 'One of the two which heard John [speak], and followed him, was Andrew, Simon Peter\'s brother.';
Text[41] = 'He first findeth his own brother Simon, and saith unto him, We have found the Messias, which is, being interpreted, the Christ.';
Text[42] = 'And he brought him to Jesus. And when Jesus beheld him, he said, Thou art Simon the son of Jona: thou shalt be called Cephas, which is by interpretation, A stone.';
Text[43] = 'The day following Jesus would go forth into Galilee, and findeth Philip, and saith unto him, Follow me.';
Text[44] = 'Now Philip was of Bethsaida, the city of Andrew and Peter.';
Text[45] = 'Philip findeth Nathanael, and saith unto him, We have found him, of whom Moses in the law, and the prophets, did write, Jesus of Nazareth, the son of Joseph.';
Text[46] = 'And Nathanael said unto him, Can there any good thing come out of Nazareth? Philip saith unto him, Come and see.';
Text[47] = 'Jesus saw Nathanael coming to him, and saith of him, Behold an Israelite indeed, in whom is no guile!';
Text[48] = 'Nathanael saith unto him, Whence knowest thou me? Jesus answered and said unto him, Before that Philip called thee, when thou wast under the fig tree, I saw thee.';
Text[49] = 'Nathanael answered and saith unto him, Rabbi, thou art the Son of God; thou art the King of Israel.';
Text[50] = 'Jesus answered and said unto him, Because I said unto thee, I saw thee under the fig tree, believest thou? thou shalt see greater things than these.';
Text[51] = 'And he saith unto him, Verily, verily, I say unto you, Hereafter ye shall see heaven open, and the angels of God ascending and descending upon the Son of man.';
