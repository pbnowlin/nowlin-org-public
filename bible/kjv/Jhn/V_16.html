<script type="text/javascript">
var Content = new Array();
Book = "Jhn";
Chapter = "16";
Content[1]="These things have I spoken unto you, that ye should not be offended.";
Content[2]="They shall put you out of the synagogues: yea, the time cometh, that whosoever killeth you will think that he doeth God service.";
Content[3]="And these things will they do unto you, because they have not known the Father, nor me.";
Content[4]="But these things have I told you, that when the time shall come, ye may remember that I told you of them. And these things I said not unto you at the beginning, because I was with you.";
Content[5]="But now I go my way to him that sent me; and none of you asketh me, Whither goest thou?";
Content[6]="But because I have said these things unto you, sorrow hath filled your heart.";
Content[7]="Nevertheless I tell you the truth; It is expedient for you that I go away: for if I go not away, the Comforter will not come unto you; but if I depart, I will send him unto you.";
Content[8]="And when he is come, he will reprove the world of sin, and of righteousness, and of judgment:";
Content[9]="Of sin, because they believe not on me;";
Content[10]="Of righteousness, because I go to my Father, and ye see me no more;";
Content[11]="Of judgment, because the prince of this world is judged.";
Content[12]="I have yet many things to say unto you, but ye cannot bear them now.";
Content[13]="Howbeit when he, the Spirit of truth, is come, he will guide you into all truth: for he shall not speak of himself; but whatsoever he shall hear, [that] shall he speak: and he will shew you things to come.";
Content[14]="He shall glorify me: for he shall receive of mine, and shall shew [it] unto you.";
Content[15]="All things that the Father hath are mine: therefore said I, that he shall take of mine, and shall shew [it] unto you.";
Content[16]="A little while, and ye shall not see me: and again, a little while, and ye shall see me, because I go to the Father.";
Content[17]="Then said [some] of his disciples among themselves, What is this that he saith unto us, A little while, and ye shall not see me: and again, a little while, and ye shall see me: and, Because I go to the Father?";
Content[18]="They said therefore, What is this that he saith, A little while? we cannot tell what he saith.";
Content[19]="Now Jesus knew that they were desirous to ask him, and said unto them, Do ye enquire among yourselves of that I said, A little while, and ye shall not see me: and again, a little while, and ye shall see me?";
Content[20]="Verily, verily, I say unto you, That ye shall weep and lament, but the world shall rejoice: and ye shall be sorrowful, but your sorrow shall be turned into joy.";
Content[21]="A woman when she is in travail hath sorrow, because her hour is come: but as soon as she is delivered of the child, she remembereth no more the anguish, for joy that a man is born into the world.";
Content[22]="And ye now therefore have sorrow: but I will see you again, and your heart shall rejoice, and your joy no man taketh from you.";
Content[23]="And in that day ye shall ask me nothing. Verily, verily, I say unto you, Whatsoever ye shall ask the Father in my name, he will give [it] you.";
Content[24]="Hitherto have ye asked nothing in my name: ask, and ye shall receive, that your joy may be full.";
Content[25]="These things have I spoken unto you in proverbs: but the time cometh, when I shall no more speak unto you in proverbs, but I shall shew you plainly of the Father.";
Content[26]="At that day ye shall ask in my name: and I say not unto you, that I will pray the Father for you:";
Content[27]="For the Father himself loveth you, because ye have loved me, and have believed that I came out from God.";
Content[28]="I came forth from the Father, and am come into the world: again, I leave the world, and go to the Father.";
Content[29]="His disciples said unto him, Lo, now speakest thou plainly, and speakest no proverb.";
Content[30]="Now are we sure that thou knowest all things, and needest not that any man should ask thee: by this we believe that thou camest forth from God.";
Content[31]="Jesus answered them, Do ye now believe?";
Content[32]="Behold, the hour cometh, yea, is now come, that ye shall be scattered, every man to his own, and shall leave me alone: and yet I am not alone, because the Father is with me.";
Content[33]="These things I have spoken unto you, that in me ye might have peace. In the world ye shall have tribulation: but be of good cheer; I have overcome the world.";
</script>
