Text[12] = 'Art thou greater than our father Jacob, which gave us the well, and drank thereof himself, and his children, and his cattle?';
Text[13] = 'Jesus answered and said unto her, Whosoever drinketh of this water shall thirst again:';

Text[20] = 'Our fathers worshipped in this mountain; and ye say, that in Jerusalem is the place where men ought to worship.';
Text[21] = 'Jesus saith unto her, Woman, believe me, the hour cometh, when ye shall neither in this mountain, nor yet at Jerusalem, worship the Father.';
Text[22] = 'Ye worship ye know not what: we know what we worship: for salvation is of the Jews.';
Text[23] = 'But the hour cometh, and now is, when the true worshippers shall worship the Father in spirit and in truth: for the Father seeketh such to worship him.';
Text[24] = 'God [is] a Spirit: and they that worship him must worship [him] in spirit and in truth.';
Text[25] = 'The woman saith unto him, I know that Messias cometh, which is called Christ: when he is come, he will tell us all things.';
Text[26] = 'Jesus saith unto her, I that speak unto thee am [he].';
Text[27] = 'And upon this came his disciples, and marvelled that he talked with the woman: yet no man said, What seekest thou? or, Why talkest thou with her?';
Text[28] = 'The woman then left her waterpot, and went her way into the city, and saith to the men,';
Text[29] = 'Come, see a man, which told me all things that ever I did: is not this the Christ?';
Text[30] = 'Then they went out of the city, and came unto him.';
Text[31] = 'In the mean while his disciples prayed him, saying, Master, eat.';
Text[32] = 'But he said unto them, I have meat to eat that ye know not of.';
Text[33] = 'Therefore said the disciples one to another, Hath any man brought him [ought] to eat?';
Text[34] = 'Jesus saith unto them, My meat is to do the will of him that sent me, and to finish his work.';
Text[35] = 'Say not ye, There are yet four months, and [then] cometh harvest? behold, I say unto you, Lift up your eyes, and look on the fields; for they are white already to harvest.';

Text[38] = 'I sent you to reap that whereon ye bestowed no labour: other men laboured, and ye are entered into their labours.';

Text[41] = 'And many more believed because of his own word;';
