Text[2] = 'They shall put you out of the synagogues: yea, the time cometh, that whosoever killeth you will think that he doeth God service.';
Text[3] = 'And these things will they do unto you, because they have not known the Father, nor me.';

Text[18] = 'They said therefore, What is this that he saith, A little while? we cannot tell what he saith.';
Text[19] = 'Now Jesus knew that they were desirous to ask him, and said unto them, Do ye enquire among yourselves of that I said, A little while, and ye shall not see me: and again, a little while, and ye shall see me?';

Text[22] = 'And ye now therefore have sorrow: but I will see you again, and your heart shall rejoice, and your joy no man taketh from you.';

Text[31] = 'Jesus answered them, Do ye now believe?';
