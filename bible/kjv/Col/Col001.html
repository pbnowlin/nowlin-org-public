Text[2] = 'To the saints and faithful brethren in Christ which are at Colosse: Grace [be] unto you, and peace, from God our Father and the Lord Jesus Christ.';
Text[3] = 'We give thanks to God and the Father of our Lord Jesus Christ, praying always for you,';
Text[4] = 'Since we heard of your faith in Christ Jesus, and of the love [which ye have] to all the saints,';

Text[8] = 'Who also declared unto us your love in the Spirit.';
Text[9] = 'For this cause we also, since the day we heard [it], do not cease to pray for you, and to desire that ye might be filled with the knowledge of his will in all wisdom and spiritual understanding;';
Text[10] = 'That ye might walk worthy of the Lord unto all pleasing, being fruitful in every good work, and increasing in the knowledge of God;';
Text[11] = 'Strengthened with all might, according to his glorious power, unto all patience and longsuffering with joyfulness;';
Text[12] = 'Giving thanks unto the Father, which hath made us meet to be partakers of the inheritance of the saints in light:';
Text[13] = 'Who hath delivered us from the power of darkness, and hath translated [us] into the kingdom of his dear Son:';
Text[14] = 'In whom we have redemption through his blood, [even] the forgiveness of sins:';
Text[15] = 'Who is the image of the invisible God, the firstborn of every creature:';
Text[16] = 'For by him were all things created, that are in heaven, and that are in earth, visible and invisible, whether [they be] thrones, or dominions, or principalities, or powers: all things were created by him, and for him:';
Text[17] = 'And he is before all things, and by him all things consist.';
Text[18] = 'And he is the head of the body, the church: who is the beginning, the firstborn from the dead; that in all [things] he might have the preeminence.';
Text[19] = 'For it pleased [the Father] that in him should all fulness dwell;';
Text[20] = 'And, having made peace through the blood of his cross, by him to reconcile all things unto himself; by him, [I say], whether [they be] things in earth, or things in heaven.';
Text[21] = 'And you, that were sometime alienated and enemies in [your] mind by wicked works, yet now hath he reconciled';
Text[22] = 'In the body of his flesh through death, to present you holy and unblameable and unreproveable in his sight:';
Text[23] = 'If ye continue in the faith grounded and settled, and [be] not moved away from the hope of the gospel, which ye have heard, [and] which was preached to every creature which is under heaven; whereof I Paul am made a minister;';

Text[25] = 'Whereof I am made a minister, according to the dispensation of God which is given to me for you, to fulfil the word of God;';
