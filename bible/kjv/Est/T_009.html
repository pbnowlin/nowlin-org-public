stringArray[2] = 'The Jews __PNgathered_1__SHgathered</a> themselves together in their cities throughout all the provinces of the king Ahasuerus, to lay hand on such __PNas_sought_2__SHas sought</a> their hurt: and no man could withstand them; for __PNthe_fear_3__SHthe fear</a> of them fell upon all people.__CPgathered_1__PSgathered__FFEst/9/10\');">Est 9:10__NREst/9/16\');">16__NBEst/8/11\');">Est 8:11__AN__GHas_sought_2__PSas sought__EFDeu/2/30\');">Deu 2:30__NBJos/11/20\');">Jos 11:20__NBPsa/71/13\');">Psa 71:13__NRPsa/71/24\');">24__NBIsa/8/9\');">Isa 8:9__AN__GGthe_fear_3__PSthe fear__FFEst/8/17\');">Est 8:17__NBGen/35/5\');">Gen 35:5__NBExd/23/27\');">Exd 23:27__NBJos/2/9\');">Jos 2:9__EN';
stringArray[3] = 'And all __PNthe_rulers_1__SHthe rulers</a> of the provinces, and the lieutenants, and the deputies, and __PNofficers_of_the_king_2__SHofficers of the king</a>, helped the Jews; because __PNthe_fear_3__SHthe fear</a> of Mordecai fell upon them.__CPthe_rulers_1__PSthe rulers__FFEst/3/12\');">Est 3:12__NBEst/8/9\');">Est 8:9__NBEzr/8/36\');">Ezr 8:36__NBDan/3/2\');">Dan 3:2__NBDan/6/1\');">Dan 6:1__NRDan/6/2\');">2__AN__GHofficers_of_the_king_2__PSofficers of the king__FEHeb. those which did the business that belonged to the king__GGthe_fear_3__PSthe fear__FFEst/3/2\');">Est 3:2-6__NBEst/8/5\');">Est 8:5__EN';
stringArray[4] = 'For Mordecai __PNwas_great_1__SH[was] great</a> in the king\'s house, and __PNhis_fame_2__SHhis fame</a> went out throughout all the provinces: for this man Mordecai __PNwaxed_3__SHwaxed</a> greater and greater.__CPwas_great_1__PSwas great__FFPsa/18/43\');">Psa 18:43__AN__GHhis_fame_2__PShis fame__EFJos/6/27\');">Jos 6:27__NB1Sa/2/30\');">1Sa 2:30__NB1Ch/14/17\');">1Ch 14:17__NBZep/3/19\');">Zep 3:19__NBMat/4/24\');">Mat 4:24__AN__GGwaxed_3__PSwaxed__FF2Sa/3/1\');">2Sa 3:1__NB1Ch/11/9\');">1Ch 11:9__NBPsa/1/3\');">Psa 1:3__NBPro/4/18\');">Pro 4:18__NBIsa/9/7\');">Isa 9:7__EN';
stringArray[5] = 'Thus the Jews __PNsmote_1__SHsmote</a> all their enemies with __PNthe_stroke_2__SHthe stroke</a> of the sword, and slaughter, and destruction, and did __PNwhat_they_would_3__SHwhat they would</a> unto those that hated them.__CPsmote_1__PSsmote__FFPsa/18/34\');">Psa 18:34-40__NRPsa/18/47\');">47__NRPsa/18/48\');">48__NBPsa/20/7\');">Psa 20:7__NRPsa/20/8\');">8__NBPsa/149/6\');">Psa 149:6-9__NB2Th/1/6\');">2Th 1:6__AN__GHthe_stroke_2__PSthe stroke__EFJer/18/21\');">Jer 18:21__AN__GGwhat_they_would_3__PSwhat they would__EEHeb. according to their will. The Chaldee paraphrast says that none appeared against the Jews but Amalekites only, who were infatuated, and had their hearts hardened, as Pharaoh\'s against Israel, to take up arms to their own destruction. Some had such an inveterate, implacable malice against the Jews, that Haman\'s fall and Mordecai\'s advancement, instead of convincing, seemed only to exasperate them the more. How have the most dreadful scourges ravaged a country, and yet the inhabitants are unmindful of the Almighty Disposer of events, and that the cause of his righteous displeasure is their continual provocation! Forty years long was he grieved with one generation, who learned not his ways, although daily fed and clothed by a miracle.</TD></TR>';

stringArray[10] = 'The __PNten_sons_1__SHten sons</a> of Haman the son of Hammedatha, the __PNenemy_2__SHenemy</a> of the Jews, slew they; __PNbut_on_the_spoil_3__SHbut on the spoil</a> laid they not their hand.__CPten_sons_1__PSten sons__FFEst/5/11\');">Est 5:11__NBExd/20/5\');">Exd 20:5__NBJob/18/18\');">Job 18:18__NRJob/18/19\');">19__NBJob/27/13\');">Job 27:13-15__NBPsa/21/10\');">Psa 21:10__NBPsa/109/12\');">Psa 109:12__NRPsa/109/13\');">13__AN__GHenemy_2__PSenemy__EFEst/3/1\');">Est 3:1__NBEst/7/4\');">Est 7:4__NREst/7/6\');">6__NBExd/17/16\');">Exd 17:16__AN__GGbut_on_the_spoil_3__PSbut on the spoil__EEIt does not appear that the Jews slew any person who did not rise up to destroy them: they stood for their lives; and gave full proof that they sought their own personal safety, and not the property of their enemies: though the decree in their favour gave them authority to take the property of all their adversaries. __NAEst/9/15\');">Est 9:15__NREst/9/16\');">16__NBEst/8/11\');">Est 8:11__NBGen/14/23\');">Gen 14:23__NBRom/12/17\');">Rom 12:17__NBPhl/4/8\');">Phl 4:8__EN';

stringArray[13] = 'Then said Esther, __PNIf_it_please_the_king_1__SHIf it please the king</a>, let it be granted to the Jews which [are] in Shushan to do to morrow also __PNaccording_unto_2__SHaccording unto</a> this day\'s decree, and __PNlet_Haman_s_ten_sons_be_hanged_3__SHlet Haman\'s ten sons be hanged</a> upon the gallows.__CPIf_it_please_the_king_1__PSIf it please the king__EEEsther had probably been informed by Mordecai, that there were still many enemies of the Jews who sought their destruction, who had escaped the preceding day; and therefore begged that the second day might be added to the former permission; and that the sons of Haman, who had already been slain, might be suspended on gibbets, as a terror to those who sought the destruction of the Jews.__GHaccording_unto_2__PSaccording unto__EFEst/8/11\');">Est 8:11__AN__GGlet_Haman_s_ten_sons_be_hanged_3__PSlet Haman\'s ten sons be hanged__EEHeb. let men hang Haman\'s ten sons. __NADeu/21/23\');">Deu 21:23__NB2Sa/21/6\');">2Sa 21:6__NR2Sa/21/9\');">9__NBGal/3/13\');">Gal 3:13__EN';

stringArray[15] = 'For the Jews that [were] in Shushan __PNgathered_themselves_1__SHgathered themselves</a> together on the fourteenth day also of the month Adar, and slew three hundred men at Shushan; __PNbut_on_the_prey_2__SHbut on the prey</a> they laid not their hand.__CPgathered_themselves_1__PSgathered themselves__FFEst/9/2\');">Est 9:2__NREst/9/13\');">13__NBEst/8/11\');">Est 8:11__NBPsa/118/7\');">Psa 118:7-12__AN__GHbut_on_the_prey_2__PSbut on the prey__EFEst/9/10\');">Est 9:10__NREst/9/16\');">16__NB1Th/5/22\');">1Th 5:22__NBHbr/13/5\');">Hbr 13:5__EN';
stringArray[16] = 'But the other Jews that [were] in the king\'s provinces __PNgathered_themselves_1__SHgathered themselves</a> together, and __PNstood_2__SHstood</a> for their lives, and had rest from their enemies, and slew of their foes seventy and five thousand, but they laid not their hands on the prey,__CPgathered_themselves_1__PSgathered themselves__FFEst/9/2\');">Est 9:2__AN, __NAEst/8/11\');">Est 8:11__AN__GHstood_2__PSstood__EFEst/8/11\');">Est 8:11__NBLev/26/7\');">Lev 26:7__NRLev/26/8\');">8__EN';
stringArray[17] = 'On the thirteenth day of the month Adar; and on the fourteenth day __PNof_the_same_1__SHof the same</a> rested they, and made it a day of feasting and gladness.__CPof_the_same_1__PSof the same__EEHeb. in it. __NAEst/9/1\');">Est 9:1__NREst/9/18\');">18__NREst/9/21\');">21__NBEst/3/12\');">Est 3:12__NBEst/8/9\');">Est 8:9__EN';
stringArray[18] = 'But the Jews that [were] at Shushan assembled together __PNon_the_thirteenth_1__SHon the thirteenth</a> [day] thereof, and on the fourteenth thereof; and on the fifteenth [day] of the same they rested, and made it a day of feasting and gladness.__CPon_the_thirteenth_1__PSon the thirteenth__FFEst/9/1\');">Est 9:1__NREst/9/11\');">11__NREst/9/13\');">13__NREst/9/15\');">15__EN';
stringArray[19] = 'Therefore the Jews of the villages, that dwelt in the unwalled towns, made the fourteenth day of the month Adar [a day of] __PNgladness_1__SHgladness</a> and feasting, and a good day, and of __PNsending_portions_2__SHsending portions</a> one to another.__CPgladness_1__PSgladness__FFEst/9/22\');">Est 9:22__NBEst/8/17\');">Est 8:17__NBDeu/16/11\');">Deu 16:11__NRDeu/16/14\');">14__NBNeh/8/10\');">Neh 8:10-12__NBPsa/118/11\');">Psa 118:11-16__NBLuk/11/41\');">Luk 11:41__NBRev/11/10\');">Rev 11:10__AN__GHsending_portions_2__PSsending portions__FEThe eastern princes and people not only invite their friends to feasts, but it is their custom to send a portion of the banquet to those that cannot well attend, especially their relations, and those in a state of mourning. Thus, when the Grand Emir found that it incommoded M. D\'Arvieux to eat with him, he desired him to take his own time for eating, and sent him from his kitchen what he liked best.</TD></TR>';
stringArray[20] = 'And __PNMordecai_1__SHMordecai</a> __PNwrote_these_2__SHwrote these</a> things, and sent letters unto all the Jews that [were] __PNin_all_the_provinces_3__SHin all the provinces</a> of the king Ahasuerus, [both] nigh and far,__CPMordecai_1__PSMordecai__EEThat is, as the words imply, the history contained in this book; and not merely the letters afterwards mentioned, as some understand it.__GHwrote_these_2__PSwrote these__EFExd/17/14\');">Exd 17:14__NBDeu/31/19\');">Deu 31:19-22__NB1Ch/16/12\');">1Ch 16:12__NBPsa/124/1\');">Psa 124:1-3__NBPsa/145/4\');">Psa 145:4-12__NB2Cr/1/10\');">2Cr 1:10__NR2Cr/1/11\');">11__AN__GGin_all_the_provinces_3__PSin all the provinces__FFEst/1/1\');">Est 1:1__NREst/1/22\');">22__NBEst/3/12\');">Est 3:12__NBEst/8/9\');">Est 8:9__EN';
stringArray[21] = 'To stablish [this] among them, that they should keep the fourteenth day of the month Adar, and the fifteenth day of the same, yearly,__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[22] = 'As __PNthe_days_1__SHthe days</a> wherein the Jews rested from their enemies, and the month which was turned unto them __PNfrom_sorrow_2__SHfrom sorrow</a> to joy, and from mourning into a good day: that they should make them days of feasting and joy, and of __PNsending_portions_3__SHsending portions</a> one to another, and gifts to the poor.__CPthe_days_1__PSthe days__FFEst/3/12\');">Est 3:12__NREst/3/13\');">13__NBExd/13/3\');">Exd 13:3-8__NBPsa/103/2\');">Psa 103:2__NBIsa/12/1\');">Isa 12:1__NRIsa/12/2\');">2__NBIsa/14/3\');">Isa 14:3__AN__GHfrom_sorrow_2__PSfrom sorrow__EFPsa/30/11\');">Psa 30:11__NBMat/5/4\');">Mat 5:4__NBJhn/16/20\');">Jhn 16:20-22__AN__GGsending_portions_3__PSsending portions__FFEst/9/19\');">Est 9:19__NBNeh/8/10\');">Neh 8:10-12__NBLuk/11/41\');">Luk 11:41__NBAct/2/44\');">Act 2:44-46__NBGal/2/10\');">Gal 2:10__EN';
stringArray[23] = 'And the Jews undertook to do as they had begun, and as Mordecai had written unto them;__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[24] = 'Because Haman the son of Hammedatha, the Agagite, __PNthe_enemy_1__SHthe enemy</a> of all the Jews, had devised against the Jews to destroy them, and had cast __PNPur_2__SHPur</a>, that [is], the lot, to __PNconsume_3__SHconsume</a> them, and to destroy them;__CPthe_enemy_1__PSthe enemy__FFEst/9/10\');">Est 9:10__NBEst/3/5\');">Est 3:5-13__AN__GHPur_2__PSPur__FEThe word pur seems to be derived either from the Persian bahr and bar, a part, portion, lot, or pari, any thing which happens fortuitously or fortunately; whence the annual festival in commemoration of the wonderful deliverance of the Jews from their enemies was called Purim, or in Arabic and Persian, Fuhr, or Lots; which has been observed by them, in all places of their dispersion, from that day to the present time, without any interruption. __NAEst/3/7\');">Est 3:7__AN__GGconsume_3__PSconsume__EEHeb. crush.</TD></TR>';
stringArray[25] = 'But __PNwhen_Esther_came_1__SHwhen [Esther] came</a> before the king, he commanded by letters that his wicked device, which he devised against the Jews, should __PNreturn_2__SHreturn</a> upon his own head, and that he and his sons should be hanged on the gallows.__CPwhen_Esther_came_1__PSwhen Esther came__EEHeb. when she came. __NAEst/9/13\');">Est 9:13__NREst/9/14\');">14__NBEst/7/5\');">Est 7:5-10__NBEst/8/1\');">Est 8:1-14__AN__GHreturn_2__PSreturn__EFPsa/7/16\');">Psa 7:16__NBPsa/109/17\');">Psa 109:17__NRPsa/109/18\');">18__NBPsa/140/9\');">Psa 140:9__NBPsa/141/10\');">Psa 141:10__NBMat/21/44\');">Mat 21:44__EN';
stringArray[26] = 'Wherefore __PNthey_called_1__SHthey called</a> these days Purim after the name of __PNPur_2__SHPur</a>. Therefore for all the words of this __PNletter_3__SHletter</a>, and [of that] which they had seen concerning this matter, and which had come unto them,__CPthey_called_1__PSthey called__FFNum/16/40\');">Num 16:40__NBEze/39/11\');">Eze 39:11__AN__GHPur_2__PSPur__FEthat is, Lot.__GGletter_3__PSletter__FFEst/9/20\');">Est 9:20__AN.</TD></TR>';
stringArray[27] = 'The Jews ordained, and took upon them, __PNand_upon_their_seed_1__SHand upon their seed</a>, and upon __PNall_such_2__SHall such</a> as joined themselves unto them, so as it should not __PNfail_3__SHfail</a>, that they would keep these two days according to their writing, and according to their [appointed] time every year;__CPand_upon_their_seed_1__PSand upon their seed__FFDeu/5/3\');">Deu 5:3__NBDeu/29/14\');">Deu 29:14__NRDeu/29/15\');">15__NBJos/9/15\');">Jos 9:15__NB1Sa/30/25\');">1Sa 30:25__NB2Sa/21/1\');">2Sa 21:1__NR2Sa/21/2\');">2__AN__GHall_such_2__PSall such__EFEst/8/17\');">Est 8:17__NBIsa/56/3\');">Isa 56:3__NRIsa/56/6\');">6__NBZec/2/11\');">Zec 2:11__NBZec/8/23\');">Zec 8:23__AN__GGfail_3__PSfail__EEHeb. pass.</TD></TR>';
stringArray[28] = 'And [that] these days [should be] __PNremembered_1__SHremembered</a> and kept throughout every generation, every family, every province, and every city; and [that] these days of Purim should not __PNfail_2__SHfail</a> from among the Jews, nor __PNthe_memorial_3__SHthe memorial</a> of them __PNperish_from_their_seed_4__SHperish from their seed</a>.__CPremembered_1__PSremembered__FFExd/12/17\');">Exd 12:17__NBPsa/78/5\');">Psa 78:5-7__NBPsa/103/2\');">Psa 103:2__AN__GHfail_2__PSfail__FEHeb. pass__GGthe_memorial_3__PSthe memorial__FFExd/13/8\');">Exd 13:8__NRExd/13/9\');">9__NBJos/4/7\');">Jos 4:7__NBZec/6/14\');">Zec 6:14__AN__GHperish_from_their_seed_4__PSperish from their seed__FEHeb. be ended from their seed.</TD></TR>';

stringArray[30] = 'And he sent the letters unto all the Jews, to __PNthe_hundred_1__SHthe hundred</a> twenty and seven provinces of the kingdom of Ahasuerus, [with] __PNwords_of_peace_2__SHwords of peace</a> and truth,__CPthe_hundred_1__PSthe hundred__FFEst/1/1\');">Est 1:1__NBEst/8/9\');">Est 8:9__AN__GHwords_of_peace_2__PSwords of peace__EFIsa/39/8\');">Isa 39:8__NBZec/8/19\');">Zec 8:19__EN';
