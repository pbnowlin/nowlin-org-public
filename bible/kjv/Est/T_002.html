stringArray[9] = 'And the maiden pleased him, and __PNshe_obtained_1__SHshe obtained</a> kindness of him; and he speedily gave __PNher_her_things_2__SHher her things</a> for purification, with __PNsuch_things_3__SHsuch things</a> as belonged to her, and seven maidens, [which were] meet to be given her, out of the king\'s house: and he preferred her and her maids unto the best [place] of the house of the women.__CPshe_obtained_1__PSshe obtained__FFGen/39/21\');">Gen 39:21__NB1Ki/8/50\');">1Ki 8:50__NBEzr/7/6\');">Ezr 7:6__NBNeh/2/8\');">Neh 2:8__NBPsa/106/46\');">Psa 106:46__NBPro/16/7\');">Pro 16:7__NBDan/1/9\');">Dan 1:9__NBAct/7/10\');">Act 7:10__AN__GHher_her_things_2__PSher her things__EFEst/2/3\');">Est 2:3__NREst/2/12\');">12__AN__GGsuch_things_3__PSsuch things__EEHeb. her portions. preferred her. Heb. changed her.</TD></TR>';

stringArray[11] = 'And __PNMordecai_1__SHMordecai</a> __PNwalked_2__SHwalked</a> every day before the court of the women\'s house, to know __PNhow_Esther_did_3__SHhow Esther did</a>, and what should become of her.__CPMordecai_1__PSMordecai__EEThe apartments of the women are accounted so inviolable, that it is even a crime to enquire what passes within their walls. A man, says Chardin, may walk a hundred days, one after the other, by the house where the women are, and yet know no more what is done there than at the farther end of Tartary. This sufficiently explains the conduct of Mordecai.__GHwalked_2__PSwalked__EFEst/2/13\');">Est 2:13__NREst/2/14\');">14__AN__GGhow_Esther_did_3__PShow Esther did__EEHeb. the peace of Esther. __NAGen/37/14\');">Gen 37:14__NB1Sa/17/18\');">1Sa 17:18__NBAct/15/36\');">Act 15:36__EN';

stringArray[17] = 'And the king loved Esther above all the women, and she obtained grace and __PNfavour_1__SHfavour</a> in his sight more than all the virgins; so that he set the royal crown upon her head, and made her queen instead of Vashti.__CPfavour_1__PSfavour__EEor, kindness. in his sight. Heb. before him. so that he set. __NAEst/4/14\');">Est 4:14__NB1Sa/2/8\');">1Sa 2:8__NBPsa/75/6\');">Psa 75:6__NRPsa/75/7\');">7__NBPsa/113/7\');">Psa 113:7__NRPsa/113/8\');">8__NBEze/17/24\');">Eze 17:24__NBLuk/1/48\');">Luk 1:48-52__AN; Bishop Patrick observes, that those who suggest that Esther committed a great sin to come at the dignity of queen of Persia, do not consider the custom of those times and countries. Every one that the king took to his bed was married to him, and was his wife of a lower rank, as Hagar was to Abraham.</TD></TR>';
