stringArray[3] = 'Then said the king unto her, __PNWhat_1__SHWhat</a> wilt thou, queen Esther? and what [is] thy request? it shall be even given thee __PNto_2__SHto</a> the half of the kingdom.__CPWhat_1__PSWhat__FFEst/5/6\');">Est 5:6__AN, __NAEst/7/2\');">Est 7:2__NBEst/9/12\');">Est 9:12__NB1Ki/2/20\');">1Ki 2:20__NB1Ki/3/5\');">1Ki 3:5__NBMat/20/20\');">Mat 20:20-22__NBLuk/18/41\');">Luk 18:41__AN__GHto_2__PSto__EFEst/5/6\');">Est 5:6__NBMar/6/23\');">Mar 6:23__EN';
stringArray[4] = 'And Esther answered, __PNIf_it_seem_1__SHIf [it seem]</a> good unto the king, let the king and Haman come this day unto __PNthe_banquet_2__SHthe banquet</a> that I have prepared for him.__CPIf_it_seem_1__PSIf it seem__FFEst/5/8\');">Est 5:8__NBPro/29/11\');">Pro 29:11__AN__GHthe_banquet_2__PSthe banquet__FE"Mishteh, from shathah, ""to drink,"" a compotation. feast, or banquet accompanied with drinking; the drinking in the East being at the beginning, and not at the end of the entertainment. Olearius, describing an entertainment at the Persian court, says, ""The floor of the hall was covered with cotton cloth, which was covered with all sorts of fruits and sweetmeats in basons of gold. With them was served up excellent Shiraz wine. After an hour\'s time, the sweetmeats were removed, to make way for the more substantial part of the entertainment, such as rice, boiled and roast mutton, etc. When the company had been at table an hour and a half, warm water was brought, in a ewer of gold, for washing; and grace being said, they began to retire without speaking a word, according to the custom of the country."" __NAEst/5/8\');">Est 5:8__NBEst/3/15\');">Est 3:15__NBGen/27/25\');">Gen 27:25__NBGen/32/20\');">Gen 32:20__NBPsa/112/5\');">Psa 112:5__NB1Cr/14/20\');">1Cr 14:20__AN"</TD></TR>';
