stringArray[8] = 'And the drinking [was] according to the law; __PNnone_did_compel_1__SHnone did compel</a>: for so the king had appointed to all __PNthe_officers_2__SHthe officers</a> of his house, that they should do according to every man\'s pleasure.__CPnone_did_compel_1__PSnone did compel__EE"Every person drank what he pleased. Among the Greeks, however, each guest was obliged to keep the round, or leave the company: hence the proverb [E pithi, e apithi] Drink, or begone. Mr. Herbert, in his poem entitled ""The Church Porch,"" has severely reprobated this vile custom. In Britain, however, this demoralizing custom is now almost destroyed, and a new era of social pleasure is arising, by temperate habits, increased domestic comforts, and the spread of gospel truths. __NAJer/35/8\');">Jer 35:8__NBJer/51/7\');">Jer 51:7__NBHab/2/15\');">Hab 2:15__NRHab/2/16\');">16__AN"__GHthe_officers_2__PSthe officers__EFJhn/2/8\');">Jhn 2:8__EN';

stringArray[11] = 'To bring __PNVashti_1__SHVashti</a> the queen before the king with the crown royal, to shew the people and the princes her beauty: for she [was] __PNfair_to_look_on_2__SHfair to look on</a>.__CPVashti_1__PSVashti__FFPro/16/9\');">Pro 16:9__NBPro/23/29\');">Pro 23:29-33__NBMar/6/21\');">Mar 6:21__NRMar/6/22\');">22__AN__GHfair_to_look_on_2__PSfair to look on__FEHeb. good of countenance. __NA1Sa/25/3\');">1Sa 25:3__NB2Sa/14/25\');">2Sa 14:25__NBPro/31/30\');">Pro 31:30__EN';

stringArray[16] = 'And Memucan answered before the king and the princes, __PNVashti_1__SHVashti</a> the queen hath not __PNdone_wrong_2__SHdone wrong</a> to the king only, but also to all the princes, and to all the people that [are] in all the provinces of the king Ahasuerus.__CPVashti_1__PSVashti__EEThis reasoning was inconsequent and false. Vashti had not generally disobeyed the king, therefore she could be no precedent for the general conduct of the Persian women. She disobeyed only in one particular; and this, to serve a purpose, Memucan draws into a general consequence: and the rest came into the conclusion, being either too intoxicated to be able to discern right from wrong, or too intent on reducing women to a state of vassalage, to neglect the present favourable opportunity.__GHdone_wrong_2__PSdone wrong__EFAct/18/14\');">Act 18:14__NBAct/25/10\');">Act 25:10__NB1Cr/6/7\');">1Cr 6:7__NR1Cr/6/8\');">8__EN';

stringArray[18] = '[Likewise] shall __PNthe_ladies_1__SHthe ladies</a> of Persia and Media say this day unto all the king\'s princes, which have heard of the deed of the queen. Thus [shall there arise] too much contempt and wrath.__CPthe_ladies_1__PSthe ladies__EESaroth, the princesses: but the meaning is well expressed by our term ladies. __NAJdg/5/29\');">Jdg 5:29__NB1Ki/11/3\');">1Ki 11:3__EN';
