stringArray[1] = 'On __PNthat_night_1__SHthat night</a> __PNcould_not_the_king_sleep_2__SHcould not the king sleep</a>, and he commanded to bring __PNthe_book_of_records_3__SHthe book of records</a> of the chronicles; and they were read before the king.__CPthat_night_1__PSthat night__FFEst/5/8\');">Est 5:8__NBGen/22/14\');">Gen 22:14__NB1Sa/23/26\');">1Sa 23:26__NR1Sa/23/27\');">27__NBIsa/41/17\');">Isa 41:17__NBRom/11/33\');">Rom 11:33__AN__GHcould_not_the_king_sleep_2__PScould not the king sleep__FEHeb. the king\'s sleep fled away. __NADan/2/1\');">Dan 2:1__NBDan/6/18\');">Dan 6:18__AN__GGthe_book_of_records_3__PSthe book of records__EEAs chronicles were composed among the Persians, a more instructive and interesting work could not be brought before the king; because they were all written in verse, and were generally the work of the most eminent poets of the empire. __NAEst/2/23\');">Est 2:23__NBMal/3/16\');">Mal 3:16__EN';
stringArray[2] = 'And it was found written, that Mordecai had told of __PNBigthana_1__SHBigthana</a> and Teresh, two of the king\'s chamberlains, the keepers of the door, who sought to lay hand on the king Ahasuerus.__CPBigthana_1__PSBigthana__FFEst/2/21\');">Est 2:21__AN__GHBigthan_2__PSBigthan__FEdoor. Heb. threshold.</TD></TR>';
stringArray[3] = 'And the king said, __PNWhat_honour_1__SHWhat honour</a> and dignity hath been done to Mordecai for this? Then said the king\'s servants that ministered unto him, __PNThere_is_nothing_2__SHThere is nothing</a> done for him.__CPWhat_honour_1__PSWhat honour__FFJdg/1/12\');">Jdg 1:12__NRJdg/1/13\');">13__NB1Sa/17/25\');">1Sa 17:25__NR1Sa/17/26\');">26__NB1Ch/11/6\');">1Ch 11:6__NBDan/5/7\');">Dan 5:7__NRDan/5/16\');">16__NRDan/5/29\');">29__NBAct/28/8\');">Act 28:8-10__AN__GHThere_is_nothing_2__PSThere is nothing__EFGen/40/23\');">Gen 40:23__NBPsa/118/8\');">Psa 118:8__NRPsa/118/9\');">9__NBEcc/9/15\');">Ecc 9:15__EN';

stringArray[6] = 'So Haman came in. And the king said unto him, What shall be done unto the man __PNwhom_the_king__etc__1__SHwhom the king</a> delighteth to honour? Now Haman thought in his heart, __PNTo_whom_2__SHTo whom</a> would the king delight to do honour more than to myself?__CPwhom_the_king__etc__1__PSwhom the king, etc.__EEHeb. in whose honour the king delighteth. __NAPsa/35/27\');">Psa 35:27__NBIsa/42/1\');">Isa 42:1__NBIsa/62/4\');">Isa 62:4__NRIsa/62/5\');">5__NBJer/32/41\');">Jer 32:41__NBMat/3/17\');">Mat 3:17__NBJhn/5/23\');">Jhn 5:23__AN__GHTo_whom_2__PSTo whom__EFEst/3/2\');">Est 3:2__NREst/3/3\');">3__NBEst/5/11\');">Est 5:11__NBPro/1/32\');">Pro 1:32__NBPro/16/18\');">Pro 16:18__NBPro/18/12\');">Pro 18:12__NBPro/30/13\');">Pro 30:13__NBOba/1/3\');">Oba 1:3__EN';
stringArray[7] = 'And Haman answered the king, For the man __PNwhom_the_king__etc__1__SHwhom the king</a> delighteth to honour,__CPwhom_the_king__etc__1__PSwhom the king, etc.__EEHeb. in whose honour the king delighteth. __NAEst/6/9\');">Est 6:9__NREst/6/11\');">11__EN';
stringArray[8] = '__PNLet_the_royal__etc__1__SHLet the royal</a> apparel be brought which the king [useth] to wear, and __PNthe_horse_2__SHthe horse</a> that the king rideth upon, and the crown royal which is set upon his head:__CPLet_the_royal__etc__1__PSLet the royal, etc.__EEHeb. Let them bring the royal apparel, wherewith the king clotheth himself. __NA1Sa/18/4\');">1Sa 18:4__NBLuk/15/22\');">Luk 15:22__AN__GHthe_horse_2__PSthe horse__FEHerodotus relates, that the kings of Persia had horses peculiar to themselves, which were brought from Armenia, and were remarkable for their beauty; and if the same law prevailed in Persia as in Judea, no man, under the penalty of death, might ride on the king\'s horse, any more than sit on his throne, wear his crown, or hold his sceptre. __NA1Ki/1/33\');">1Ki 1:33__EN';
stringArray[9] = 'And let this apparel and horse be delivered to the hand of one of the king\'s most noble princes, that they may array the man [withal] whom the king delighteth to honour, and __PNbring_him_1__SHbring him</a> on horseback through the street of the city, and __PNproclaim_2__SHproclaim</a> before him, Thus shall it be done to the man whom the king delighteth to honour.__CPbring_him_1__PSbring him__EEHeb. cause him to ride__GHproclaim_2__PSproclaim__EFGen/41/43\');">Gen 41:43__NB1Ki/1/33\');">1Ki 1:33__NR1Ki/1/34\');">34__NBZec/9/9\');">Zec 9:9__EN';
stringArray[10] = 'Then the king said to Haman, __PNMake_haste_1__SHMake haste</a>, [and] take the apparel and the horse, as thou hast said, and do even so to Mordecai the Jew, that sitteth at the king\'s gate: __PNlet_nothing_fail_2__SHlet nothing fail</a> of all that thou hast spoken.__CPMake_haste_1__PSMake haste__FFDan/4/37\');">Dan 4:37__NBLuk/14/11\');">Luk 14:11__NBRev/18/7\');">Rev 18:7__AN__GHlet_nothing_fail_2__PSlet nothing fail__FEHeb. suffer not a whit to fall. __NA2Ki/10/10\');">2Ki 10:10__EN';
stringArray[11] = 'Then __PNtook_Haman_1__SHtook Haman</a> the apparel and the horse, __PNand_arrayed_2__SHand arrayed</a> Mordecai, and brought him on horseback through __PNthe_street_3__SHthe street</a> of the city, and proclaimed before him, Thus shall it be done unto the man whom the king delighteth to honour.__CPtook_Haman_1__PStook Haman__FFEzr/6/13\');">Ezr 6:13__NBIsa/60/14\');">Isa 60:14__NBLuk/1/52\');">Luk 1:52__NBRev/3/9\');">Rev 3:9__AN__GHand_arrayed_2__PSand arrayed__EFEst/8/15\');">Est 8:15__NBEst/9/3\');">Est 9:3__AN__GGthe_street_3__PSthe street__EE"Pitts gives a similar account of the mode of honouring a person who turns a Mohammedan, at Algiers: ""The apostate is to get on a stately steed, with a rich saddle and fine trappings: he is also richly habited, and has a turban on his head, but nothing of this is to be called his own; only there are given him about two or three yards of broad cloth, which is laid before him on the saddle. The horse, with him on his back, is led all round the city, which he is several hours in doing. The apostate is attended with drums and other music, and twenty or thirty serjeants. They march in order on each side of the horse, with naked swords in their hands. The crier goes before, with a loud voice giving thanks to God for the proselyte that is made."""</TD></TR>';
