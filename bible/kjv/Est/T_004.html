stringArray[14] = 'For if thou altogether holdest thy peace at this time, __PNthen_shall_1__SH[then] shall</a> there __PNenlargement_2__SHenlargement</a> and deliverance arise to the Jews from another place; __PNbut_thou_3__SHbut thou</a> and thy father\'s house shall be destroyed: and who knoweth __PNwhether_4__SHwhether</a> thou art come to the kingdom __PNfor_such_a_time_5__SHfor [such] a time</a> as this?__CPthen_shall_1__PSthen shall__FFGen/22/14\');">Gen 22:14__NBNum/23/22\');">Num 23:22-24__NBDeu/32/26\');">Deu 32:26__NRDeu/32/27\');">27__NRDeu/32/36\');">36__NB1Sa/12/22\');">1Sa 12:22__NBIsa/54/17\');">Isa 54:17__NBJer/30/11\');">Jer 30:11__NBJer/33/24\');">Jer 33:24-26__NBJer/46/28\');">Jer 46:28__NBAmo/9/8\');">Amo 9:8__NRAmo/9/9\');">9__NBMat/16/18\');">Mat 16:18__NBMat/24/22\');">Mat 24:22__AN__GHenlargement_2__PSenlargement__FEHeb. respiration. __NAEzr/9/9\');">Ezr 9:9__NBJob/9/18\');">Job 9:18__AN__GGbut_thou_3__PSbut thou__FFEst/2/7\');">Est 2:7__NREst/2/15\');">15__NBJdg/14/15\');">Jdg 14:15-18__NBJdg/15/6\');">Jdg 15:6__AN__GHwhether_4__PSwhether__EFGen/45/4\');">Gen 45:4-8__NBIsa/45/1\');">Isa 45:1-5__NBIsa/49/23\');">Isa 49:23__NBAct/7/20\');">Act 7:20-25__AN__GGfor_such_a_time_5__PSfor such a time__FF1Sa/17/29\');">1Sa 17:29__NB2Ki/19/3\');">2Ki 19:3__NBNeh/6/11\');">Neh 6:11__AN; The fact related in this verse was unquestionably the reason why Esther was raised to regal honours, by the overruling providence of God: she was therefore bound in gratitude to do this service for God, else she would not have answered the end of her elevation: and she need not fear the miscarriage of the enterprise, for if God designed her for it, he would surely bear her through and give success. It appeared by the event that Mordecai spoke prophetically, when he modestly conjectured that Esther came to the kingdom that she might be the instrument of the Jews\' deliverance. Mordecai thoroughly believed that it was a cause which one way or other would certainly be carried, and which, therefore, she might safely venture upon. Instruments might fail, but God\'s covenant cannot. There is a wise design in all the providences of God, which is unknown to us till it is accomplished; but it will prove in the issue that all is intended for and centre in the good of those who trust in Him.</TD></TR>';
