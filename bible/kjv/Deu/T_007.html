stringArray[22] = 'And the LORD thy God will __PNput_out_1__SHput out</a> those nations before thee by little and little: thou mayest not consume them at once, lest the beasts of the field increase upon thee.__CPput_out_1__PSput out__EE"Heb. pluck off. thou mayest. As the Israelites were not yet sufficiently numerous to fill the whole land occupied by these nations; and as wild and ferocious animals might be expected to multiply where the place was but thinly peopled, therefore God informs them that their extermination from before them should be gradual. Haynes says, ""The approaching to Cana, at the close of the day, as we did, is at once terrifying and dangerous. The surrounding country swarms with wild beasts, such as tigers, leopards, jackals, etc., whose cries and howling, I doubt not, would strike the boldest traveller, who had not been frequently in a like situation, with the deepest sense of horror."" __NAExd/23/29\');">Exd 23:29__NRExd/23/30\');">30__NBJos/15/63\');">Jos 15:63__AN"</TD></TR>';
