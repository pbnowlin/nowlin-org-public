Text[1] = 'Therefore thou shalt love the LORD thy God, and keep his charge, and his statutes, and his judgments, and his commandments, alway.';
Text[2] = 'And know ye this day: for [I speak] not with your children which have not known, and which have not seen the chastisement of the LORD your God, his greatness, his mighty hand, and his stretched out arm,';
Text[3] = 'And his miracles, and his acts, which he did in the midst of Egypt unto Pharaoh the king of Egypt, and unto all his land;';
Text[4] = 'And what he did unto the army of Egypt, unto their horses, and to their chariots; how he made the water of the Red sea to overflow them as they pursued after you, and [how] the LORD hath destroyed them unto this day;';
Text[5] = 'And what he did unto you in the wilderness, until ye came into this place;';
Text[6] = 'And what he did unto Dathan and Abiram, the sons of Eliab, the son of Reuben: how the earth opened her mouth, and swallowed them up, and their households, and their tents, and all the substance that [was] in their possession, in the midst of all Israel:';
Text[7] = 'But your eyes have seen all the great acts of the LORD which he did.';
Text[8] = 'Therefore shall ye keep all the commandments which I command you this day, that ye may be strong, and go in and possess the land, whither ye go to possess it;';
Text[9] = 'And that ye may prolong [your] days in the land, which the LORD sware unto your fathers to give unto them and to their seed, a land that floweth with milk and honey.';
Text[10] = 'For the land, whither thou goest in to possess it, [is] not as the land of Egypt, from whence ye came out, where thou sowedst thy seed, and wateredst [it] with thy foot, as a garden of herbs:';
Text[11] = 'But the land, whither ye go to possess it, [is] a land of hills and valleys, [and] drinketh water of the rain of heaven:';
Text[12] = 'A land which the LORD thy God careth for: the eyes of the LORD thy God [are] always upon it, from the beginning of the year even unto the end of the year.';
Text[13] = 'And it shall come to pass, if ye shall hearken diligently unto my commandments which I command you this day, to love the LORD your God, and to serve him with all your heart and with all your soul,';
Text[14] = 'That I will give [you] the rain of your land in his due season, the first rain and the latter rain, that thou mayest gather in thy corn, and thy wine, and thine oil.';
Text[15] = 'And I will send grass in thy fields for thy cattle, that thou mayest eat and be full.';
Text[16] = 'Take heed to yourselves, that your heart be not deceived, and ye turn aside, and serve other gods, and worship them;';
Text[17] = 'And [then] the LORD\'S wrath be kindled against you, and he shut up the heaven, that there be no rain, and that the land yield not her fruit; and [lest] ye perish quickly from off the good land which the LORD giveth you.';
Text[18] = 'Therefore shall ye lay up these my words in your heart and in your soul, and bind them for a sign upon your hand, that they may be as frontlets between your eyes.';
Text[19] = 'And ye shall teach them your children, speaking of them when thou sittest in thine house, and when thou walkest by the way, when thou liest down, and when thou risest up.';
Text[20] = 'And thou shalt write them upon the door posts of thine house, and upon thy gates:';
Text[21] = 'That your days may be multiplied, and the days of your children, in the land which the LORD sware unto your fathers to give them, as the days of heaven upon the earth.';
Text[22] = 'For if ye shall diligently keep all these commandments which I command you, to do them, to love the LORD your God, to walk in all his ways, and to cleave unto him;';
Text[23] = 'Then will the LORD drive out all these nations from before you, and ye shall possess greater nations and mightier than yourselves.';
Text[24] = 'Every place whereon the soles of your feet shall tread shall be yours: from the wilderness and Lebanon, from the river, the river Euphrates, even unto the uttermost sea shall your coast be.';
Text[25] = 'There shall no man be able to stand before you: [for] the LORD your God shall lay the fear of you and the dread of you upon all the land that ye shall tread upon, as he hath said unto you.';
Text[26] = 'Behold, I set before you this day a blessing and a curse;';
Text[27] = 'A blessing, if ye obey the commandments of the LORD your God, which I command you this day:';
Text[28] = 'And a curse, if ye will not obey the commandments of the LORD your God, but turn aside out of the way which I command you this day, to go after other gods, which ye have not known.';
Text[29] = 'And it shall come to pass, when the LORD thy God hath brought thee in unto the land whither thou goest to possess it, that thou shalt put the blessing upon mount Gerizim, and the curse upon mount Ebal.';
Text[30] = '[Are] they not on the other side Jordan, by the way where the sun goeth down, in the land of the Canaanites, which dwell in the champaign over against Gilgal, beside the plains of Moreh?';
Text[31] = 'For ye shall pass over Jordan to go in to possess the land which the LORD your God giveth you, and ye shall possess it, and dwell therein.';
Text[32] = 'And ye shall observe to do all the statutes and judgments which I set before you this day.';
