stringArray[49] = 'The LORD shall __PNbring_a_nation_1__SHbring a nation</a> against thee from far, from the end of the earth, [as swift] __PNas_the_eagle_2__SHas the eagle</a> flieth; __PNa_nation_whose_3__SHa nation whose</a> tongue thou shalt not __PNunderstand_4__SHunderstand</a>;__CPbring_a_nation_1__PSbring a nation__EEThough the Chaldeans are frequently described under the figure of an eagle, yet these verses especially predict the desolations brought on the Jews by the Romans; who came from a country far more distant than Chaldea; whose conquests were as rapid as the eagle\'s flight, and whose standard bore this very figure; who spake a language to which the Jews were then entire strangers, being wholly unlike the Hebrew, of which the Chaldee was merely a dialect; whose appearance and victories were terrible; and whose yoke was a yoke of iron; and the havoc which they made tremendous. __NANum/24/24\');">Num 24:24__NBIsa/5/26\');">Isa 5:26-30__NBJer/5/15\');">Jer 5:15-17__NBDan/6/22\');">Dan 6:22__NRDan/6/23\');">23__NBDan/9/26\');">Dan 9:26__NBHab/1/6\');">Hab 1:6__NRHab/1/7\');">7__NBLuk/19/43\');">Luk 19:43__NRLuk/19/44\');">44__AN__GHas_the_eagle_2__PSas the eagle__EFJer/4/13\');">Jer 4:13__NBJer/48/40\');">Jer 48:40__NBJer/49/22\');">Jer 49:22__NBLam/4/19\');">Lam 4:19__NBEze/17/3\');">Eze 17:3__NREze/17/12\');">12__NBHsa/8/1\');">Hsa 8:1__NBMat/24/28\');">Mat 24:28__AN__GGa_nation_whose_3__PSa nation whose__FFJer/5/15\');">Jer 5:15__NBEze/3/6\');">Eze 3:6__NB1Cr/14/21\');">1Cr 14:21__AN__GHunderstand_4__PSunderstand__FEHeb. hear.</TD></TR>';

stringArray[54] = '[So that] the man [that is] tender among you, and very delicate, __PNhis_eye_1__SHhis eye</a> shall be evil toward his brother, __PNand_toward_2__SHand toward</a> the wife of his bosom, and toward the remnant of __PNhis_children_3__SHhis children</a> which he shall leave:__CPhis_eye_1__PShis eye__FFDeu/15/9\');">Deu 15:9__NBPro/23/6\');">Pro 23:6__NBPro/28/22\');">Pro 28:22__NBMat/20/15\');">Mat 20:15__AN__GHand_toward_2__PSand toward__FE"The Roman armies at length besieged, sacked, and utterly desolated Jerusalem: and during this seige, the famine was so extreme, that even rich and delicate persons, both men and women, ate their own children, and concealed the horrible repast, lest others should tear it from them! ""Women snatched the food out of the very mouths of their husbands, and sons of their fathers, and (what is most miserable) mothers of their infants."" ""In every house, if there appeared any semblance of food, a battle ensued, and the dearest friends and relations fought with one another; snatching away the miserable provisions of life."" ""A woman distinguished by birth and wealth, after she had been plundered by the tyrants (or soldiers) of all her possessions, boiling her own sucking child, ate half of him, and concealing the other half, reserved it for another time!"" __NADeu/13/6\');">Deu 13:6__NB2Sa/12/3\');">2Sa 12:3__NBMic/7/5\');">Mic 7:5__AN"__GGhis_children_3__PShis children__FFPsa/103/13\');">Psa 103:13__NBIsa/49/15\');">Isa 49:15__NBMat/7/9\');">Mat 7:9-11__NBLuk/11/11\');">Luk 11:11-13__EN';

stringArray[59] = 'Then the LORD will make thy plagues wonderful, and the plagues of thy seed, [even] great plagues, and of long continuance, and sore sicknesses, and of long continuance.__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/28/46\');">Deu 28:46__NBDeu/29/20\');">Deu 29:20-28__NBDeu/31/17\');">Deu 31:17__NRDeu/31/18\');">18__NBDeu/32/22\');">Deu 32:22__NRDeu/32/26\');">26__NB1Ki/9/7\');">1Ki 9:7-9__NB1Ki/16/3\');">1Ki 16:3__NR1Ki/16/4\');">4__NBLam/1/9\');">Lam 1:9__NRLam/1/12\');">12__NBLam/4/12\');">Lam 4:12__NBDan/9/12\');">Dan 9:12__NBHsa/3/4\');">Hsa 3:4__NBMar/13/19\');">Mar 13:19__EN';
stringArray[60] = 'Moreover he will bring upon thee all the diseases of Egypt, which thou wast afraid of; and they shall cleave unto thee.__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/7/15\');">Deu 7:15__NBExd/15/26\');">Exd 15:26__EN';
stringArray[61] = 'Also every sickness, and every plague, which [is] not written in the book of this law, them will the LORD __PNbring_upon_thee_1__SHbring upon thee</a>, until thou be destroyed.__CPbring_upon_thee_1__PSbring upon thee__EEHeb. cause to ascend.</TD></TR>';
stringArray[62] = 'And ye shall be left __PNfew_in_number_1__SHfew in number</a>, whereas ye were __PNas_the_stars_2__SHas the stars</a> of heaven for multitude; because thou wouldest not obey the voice of the LORD thy God.__CPfew_in_number_1__PSfew in number__EEIn the seige of Jerusalem there died 1,100,000 persons, and more than 90,000 were carried captive; and, having afterwards provoked the Romans by their crimes and rebellions, they persecuted them nearly to extirpation; to which, if the tens of thousands which were slaughtered year after year in every country be added, it appears wonderful that there were any remains left. __NADeu/4/27\');">Deu 4:27__NBLev/26/22\');">Lev 26:22__NB2Ki/13/7\');">2Ki 13:7__NB2Ki/24/14\');">2Ki 24:14__NBNeh/7/4\');">Neh 7:4__NBIsa/1/9\');">Isa 1:9__NBIsa/24/6\');">Isa 24:6__NBJer/42/2\');">Jer 42:2__NBJer/52/28\');">Jer 52:28-30__NBMar/13/20\');">Mar 13:20__NBRom/9/27\');">Rom 9:27-29__AN__GHas_the_stars_2__PSas the stars__EFDeu/10/22\');">Deu 10:22__NBNeh/9/23\');">Neh 9:23__NBRom/9/27\');">Rom 9:27__EN';
stringArray[63] = 'And it shall come to pass, [that] as the LORD __PNrejoiced_over_1__SHrejoiced over</a> you to do you good, and to multiply you; so the LORD will __PNrejoice_over_2__SHrejoice over</a> you to destroy you, and to bring you to nought; and ye shall be __PNplucked_from_3__SHplucked from</a> off the land whither thou goest to possess it.__CPrejoiced_over_1__PSrejoiced over__FFDeu/30/9\');">Deu 30:9__NBIsa/62/5\');">Isa 62:5__NBJer/32/41\');">Jer 32:41__NBMic/7/18\');">Mic 7:18__NBZep/3/17\');">Zep 3:17__NBLuk/15/6\');">Luk 15:6-10__NRLuk/15/23\');">23__NRLuk/15/24\');">24__NRLuk/15/32\');">32__AN__GHrejoice_over_2__PSrejoice over__EFPro/1/26\');">Pro 1:26__NBIsa/1/24\');">Isa 1:24__NBEze/5/13\');">Eze 5:13__NBEze/33/11\');">Eze 33:11__AN__GGplucked_from_3__PSplucked from__FFDeu/7/22\');">Deu 7:22__AN; *marg:; __NAJer/12/14\');">Jer 12:14__NRJer/12/15\');">15__NBJer/18/7\');">Jer 18:7__NBJer/24/6\');">Jer 24:6__NBJer/31/28\');">Jer 31:28__NRJer/31/40\');">40__NBJer/42/10\');">Jer 42:10__NBDan/7/8\');">Dan 7:8__EN';
stringArray[64] = 'And the LORD shall __PNscatter_1__SHscatter</a> thee among all people, from the one end of the earth even unto the other; and __PNthere_thou_shalt_2__SHthere thou shalt</a> serve other gods, which neither thou nor thy fathers have known, [even] wood and stone.__CPscatter_1__PSscatter__FFDeu/4/27\');">Deu 4:27__NRDeu/4/28\');">28__NBLev/26/33\');">Lev 26:33__NBNeh/1/8\');">Neh 1:8__NBJer/16/13\');">Jer 16:13__NBJer/50/17\');">Jer 50:17__NBEze/11/16\');">Eze 11:16__NREze/11/17\');">17__NBLuk/21/24\');">Luk 21:24__AN__GHthere_thou_shalt_2__PSthere thou shalt__EFDeu/28/36\');">Deu 28:36__NBJer/16/13\');">Jer 16:13__EN';
stringArray[65] = 'And __PNamong_1__SHamong</a> these nations __PNshalt_thou_2__SHshalt thou</a> find no ease, neither shall the sole of thy foot have rest: but __PNthe_LORD_3__SHthe LORD</a> shall give thee there a trembling heart, and __PNfailing_of_eyes_4__SHfailing of eyes</a>, and sorrow of mind:__CPamong_1__PSamong__EEAfter the conquest of their country by the Romans, Hadrian, by a public decree, ratified by the senate, forbad any Jew to come even within sight of Judea; and hence they were dispersed over every quarter of the globe, where they found no alleviation or respite from misery. In no country are they treated as denizens; all suspect them as enemies, and behave to them as aliens; if they do not, as had been too frequently the case, harass, oppress, and persecute them, even unto death.__GHshalt_thou_2__PSshalt thou__EFGen/8/9\');">Gen 8:9__NBIsa/57/21\');">Isa 57:21__NBEze/5/12\');">Eze 5:12-17__NBEze/20/32\');">Eze 20:32-35__NBAmo/9/4\');">Amo 9:4__NRAmo/9/9\');">9__NRAmo/9/10\');">10__AN__GGthe_LORD_3__PSthe LORD__FFLev/26/36\');">Lev 26:36__NBIsa/51/17\');">Isa 51:17__NBEze/12/18\');">Eze 12:18__NREze/12/19\');">19__NBHsa/11/10\');">Hsa 11:10__NRHsa/11/11\');">11__NBHab/3/16\');">Hab 3:16__NBLuk/21/26\');">Luk 21:26__AN__GHfailing_of_eyes_4__PSfailing of eyes__EFLev/26/16\');">Lev 26:16__NBIsa/65/14\');">Isa 65:14__NBLam/3/65\');">Lam 3:65__NBMat/24/8\');">Mat 24:8__NBRom/11/10\');">Rom 11:10__EN';
stringArray[66] = 'And thy life shall hang in doubt before thee; and thou shalt fear day and night, and shalt have none assurance of thy life:__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/28/67\');">Deu 28:67__NBLam/1/13\');">Lam 1:13__NBHbr/10/27\');">Hbr 10:27__NBRev/6/15\');">Rev 6:15-17__EN';
stringArray[67] = 'In the morning thou shalt say, Would God it were even! and at even thou shalt say, Would God it were morning! for the fear of thine heart wherewith thou shalt fear, and for the sight of thine eyes which thou shalt see.__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/28/34\');">Deu 28:34__NBJob/7/3\');">Job 7:3__NRJob/7/4\');">4__NBRev/9/6\');">Rev 9:6__EN';
stringArray[68] = 'And the LORD shall __PNbring_thee_into_Egypt_1__SHbring thee into Egypt</a> again with ships, by the way whereof I spake unto thee, Thou shalt see it no more again: and __PNthere_ye_shall_2__SHthere ye shall</a> be sold unto your enemies for bondmen and bondwomen, and no man shall buy [you].__CPbring_thee_into_Egypt_1__PSbring thee into Egypt__EEThis verse seems especially to point out an event, which took place subsequently to the destruction of Jerusalem by Titus, and the desolation made by Hadrian. Numbers of the captives were sent by sea into Egypt (as well as into other countries), and sold for slaves at a vile price, and for the meanest offices; and many thousands were left to perish from want; for the multitude was so great, that purchasers could not be found for them all at any price! __NADeu/17/16\');">Deu 17:16__NBJer/43/7\');">Jer 43:7__NBJer/44/12\');">Jer 44:12__NBHsa/8/13\');">Hsa 8:13__NBHsa/9/3\');">Hsa 9:3__AN__GHthere_ye_shall_2__PSthere ye shall__EFExd/20/2\');">Exd 20:2__NBNeh/5/8\');">Neh 5:8__NBEst/7/4\');">Est 7:4__NBJoe/3/3\');">Joe 3:3-7__NBLuk/21/24\');">Luk 21:24__EN';
