stringArray[7] = 'And what man [is there] that hath __PNbetrothed_a_wife_1__SHbetrothed a wife</a>, and hath not taken her? let him go and return unto his house, __PNlest_he_die_2__SHlest he die</a> in the battle, and another man take her.__CPbetrothed_a_wife_1__PSbetrothed a wife__EEIt was customary among the Jews to contract matrimony, espouse, or betroth, and for a considerable time to leave the parties in the houses of the respective parents; and when the bridegroom had made proper preparations, then the bride was brought home to his house, and the marriage consummated. The provisions in this verse refer to a case of this kind; though the Jews extend it to him who had newly consummated his marriage, and even to him who had married his brother\'s wife. It was deemed a peculiar hardship for a person to be obliged to go to battle, who had left a house unfinished, newly purchased land half tilled, or a wife with whom he had just contracted marriage. __NADeu/22/23\');">Deu 22:23-25__NBDeu/24/5\');">Deu 24:5__NBMat/1/18\');">Mat 1:18__AN__GHlest_he_die_2__PSlest he die__EFDeu/28/30\');">Deu 28:30__NBLuk/14/18\');">Luk 14:18-20__NB2Ti/2/4\');">2Ti 2:4__EN';

stringArray[19] = 'When thou shalt besiege a city a long time, in making war against it to take it, __PNthou_shalt_not_1__SHthou shalt not</a> destroy the trees thereof by forcing an axe against them: for thou mayest eat of them, and thou shalt not cut them down (__PNfor_the_tree__etc__2__SHfor the tree</a> of the field [is] man\'s [life]) __PNto_employ__etc__3__SHto employ</a> [them] in the siege:__CPthou_shalt_not_1__PSthou shalt not__FFMat/3/10\');">Mat 3:10__NBMat/7/15\');">Mat 7:15-20__NBMat/21/19\');">Mat 21:19__NBLuk/13/7\');">Luk 13:7-9__NBJhn/15/2\');">Jhn 15:2-8__AN__GHfor_the_tree__etc__2__PSfor the tree, etc.__FE"or, for, O man, the tree of the field is to be employed in the siege. The original is exceedingly difficult. The LXX. has it, ""Is the tree in the field a man, to enter the trench before thee?"" The Latin Vulgate: ""For it is a tree, and not a man, neither can it increase the number of those who war against thee;"" Onkelos, ""For the tree of the field is not as a man, that it should come against thee in the siege;"" and to the same purpose the Arabic, Philo, and Josephus who say, ""If trees could speak, they would cry out, that it is unjust that they, who were no cause of the war, should suffer the miseries of it."" However rendered, the sense is sufficiently clear: and it is a merciful provision to spare all the fruit trees for the support of both the besieged and besiegers. __NADeu/26/6\');">Deu 26:6__AN"__GGto_employ__etc__3__PSto employ, etc.__EEHeb. to go from before thee.</TD></TR>';
