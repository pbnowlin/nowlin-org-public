stringArray[44] = 'And the Amorites, which dwelt in that mountain, came out against you, and __PNchased_you_1__SHchased you</a>, as bees do, and destroyed you in Seir, [even] __PNunto_Hormah_2__SHunto Hormah</a>.__CPchased_you_1__PSchased you__EEWhen bees are provoked or disturbed, the whole swarm attack and pursue whatever annoys them, with great courage and fury, and sometimes are a most formidable enemy. They were so troublesome in some districts of Crete, that, according to Pliny, the inhabitants were actually compelled to forsake their homes. Ælian reports, that some places in Scythia were formerly inaccessible on account of the numerous swarms of bees with which they were infested. Mr. Park relates, that some of his associates imprudently attempted to rob a numerous hive which they found in their way. The exasperated little animals rushed out to defend their property, and attacked them with so much fury, that they quickly compelled the whole company of men, horses, and asses, to scamper off in all directions, The horses were never recovered, and a number of the asses were so severely stung, that they died the next day. __NADeu/28/25\');">Deu 28:25__NBDeu/32/30\');">Deu 32:30__NBPsa/118/12\');">Psa 118:12__NBIsa/7/18\');">Isa 7:18__AN__GHunto_Hormah_2__PSunto Hormah__EFNum/14/45\');">Num 14:45__NBNum/21/3\');">Num 21:3__EN';
