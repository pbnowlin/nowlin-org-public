stringArray[10] = 'For the land, whither thou goest in to possess it, [is] not as the land of Egypt, from whence ye came out, where thou sowedst thy seed, and __PNwateredst_it_with_thy_foot_1__SHwateredst [it] with thy foot</a>, as a garden of herbs:__CPwateredst_it_with_thy_foot_1__PSwateredst it with thy foot__EERain seldom falls in Egypt; the land being chiefly watered by the inundations of the Nile. In order to water the grounds where the inundations do not extend, water is collected in ponds, and directed in streamlets to the different parts of the field where irrigation is necessary. It is no unusual thing in the East to see a man, with a small mattock, making a little trench for the water to run into; and, as he opens the passage, the water following, he uses his foot to raise up the mould against the side of this little channel, to prevent the water from being shed unnecessarily, before it reaches the place of its destination. Hence he may justly be said to water the ground with his foot. __NAZec/14/18\');">Zec 14:18__EN';

stringArray[29] = 'And it shall come to pass, when the LORD thy God hath brought thee in unto the land whither thou goest to possess it, that thou shalt __PNput_the_blessing_1__SHput the blessing</a> upon mount __PNGerizim_2__SHGerizim</a>, and the curse upon mount Ebal.__CPput_the_blessing_1__PSput the blessing__FFDeu/27/12\');">Deu 27:12-26__NBJos/8/30\');">Jos 8:30-35__AN__GHGerizim_2__PSGerizim__FE"Gerizim and Ebal, mountains west of Jordan, and in the tribe of Ephraim, are opposite, or parallel to each other, extending from east to west; mount Gerizim being on the south, and mount Ebal on the north. They are separated by the beautiful valley in which Shechem or Nablous is situated, which is only about 200 paces in width. Both mountains are much alike in length, height, and figure; being about a league in length, in the form of a semicircle, and so steep, on the side of Shechem, that there is scarcely any shelving: their altitude appeared to Mr. Buckingham nearly equal, not exceeding 700 or 800 feet from the level of the valley, which is itself elevated. But though they resemble each other in these particulars, yet in another they are very dissimilar; for, says Maundrell, ""though neither of the mountains has much to boast of as to its pleasantness, yet, as one passes between them, Gerizim seems to discover a somewhat more verdant, fruitful aspect then Ebal: the reason of which may be, because fronting t"</TD></TR>';
