stringArray[1] = 'Hear, O Israel: Thou [art] __PNto_pass_1__SHto pass</a> over Jordan __PNthis_day_2__SHthis day</a>, to go in to possess __PNnations_3__SHnations</a> greater and mightier than thyself, __PNcities_4__SHcities</a> great and fenced up to heaven,__CPto_pass_1__PSto pass__FFDeu/3/18\');">Deu 3:18__NBDeu/11/31\');">Deu 11:31__NBDeu/27/2\');">Deu 27:2__NBJos/1/11\');">Jos 1:11__NBJos/3/6\');">Jos 3:6__NRJos/3/14\');">14__NRJos/3/16\');">16__NBJos/4/5\');">Jos 4:5__NRJos/4/19\');">19__AN__GHthis_day_2__PSthis day__FE"The Hebrew hyyom, ""this day,"" frequently denotes, as here, this time. They had come, 38 years before this, nearly to the verge of the promised land, but were not permitted, because of their unbelief and rebellion, at that day or time, to enter; but this time they shall certainly pass over. This was spoken in the eleventh month of the fortieth year of their journeying; and it was on the first month of the following year they passed over: and during this interval Moses died."__GGnations_3__PSnations__FFDeu/4/38\');">Deu 4:38__NBDeu/7/1\');">Deu 7:1__NBDeu/11/23\');">Deu 11:23__AN__GHcities_4__PScities__EFDeu/1/28\');">Deu 1:28__NBNum/13/22\');">Num 13:22__NRNum/13/28\');">28-33__EN';

stringArray[4] = '__PNSpeak_not_1__SHSpeak not</a> thou in thine heart, after that the LORD thy God hath cast them out from before thee, saying, For my righteousness the LORD hath brought me in to possess this land: but __PNfor_the_wickedness_2__SHfor the wickedness</a> of these nations the LORD doth drive them out from before thee.__CPSpeak_not_1__PSSpeak not__FFDeu/9/5\');">Deu 9:5__NBDeu/7/7\');">Deu 7:7__NRDeu/7/8\');">8__NBDeu/8/17\');">Deu 8:17__NBEze/36/22\');">Eze 36:22__NREze/36/32\');">32__NBRom/11/6\');">Rom 11:6__NRRom/11/20\');">20__NB1Cr/4/4\');">1Cr 4:4__NR1Cr/4/7\');">7__NBEph/2/4\');">Eph 2:4__NREph/2/5\');">5__NB2Ti/1/9\');">2Ti 1:9__NBTts/3/3\');">Tts 3:3-5__AN__GHfor_the_wickedness_2__PSfor the wickedness__EFDeu/12/31\');">Deu 12:31__NBDeu/18/12\');">Deu 18:12__NBGen/15/16\');">Gen 15:16__NBLev/18/24\');">Lev 18:24__NRLev/18/25\');">25__EN';
stringArray[5] = '__PNNot_for_1__SHNot for</a> thy righteousness, or for the uprightness of thine heart, dost thou go to possess their land: but for the wickedness of these nations the LORD thy God doth drive them out from before thee, and __PNthat_he_may_2__SHthat he may</a> perform the word which the LORD sware unto thy fathers, Abraham, Isaac, and Jacob.__CPNot_for_1__PSNot for__EEThough the Canaanites were expelled for their wickedness, it does not follow, that the Israelites were established in their room on account of any distinguished virtue, or because they deserved it. On many occasions, it may be seen in the history of the world, that God punishes the wicked by the instrumentality of other men, who are as wicked as themselves. Not the Israelites\' righteousness, but the wickedness of the inhabitants, and the promise of God to their fathers, was the cause of their obtaining Canaan. __NATts/3/5\');">Tts 3:5__AN__GHthat_he_may_2__PSthat he may__EFGen/12/7\');">Gen 12:7__NBGen/13/15\');">Gen 13:15__NBGen/15/7\');">Gen 15:7__NBGen/17/8\');">Gen 17:8__NBGen/26/4\');">Gen 26:4__NBGen/28/13\');">Gen 28:13__NBExd/32/13\');">Exd 32:13__NBEze/20/14\');">Eze 20:14__NBMic/7/20\');">Mic 7:20__NBLuk/1/54\');">Luk 1:54__NRLuk/1/55\');">55__NBAct/3/25\');">Act 3:25__NBAct/13/32\');">Act 13:32__NRAct/13/33\');">33__NBRom/11/28\');">Rom 11:28__NBRom/15/8\');">Rom 15:8__EN';
stringArray[6] = '__PNUnderstand_1__SHUnderstand</a> therefore, that the LORD thy God __PNgiveth_thee_2__SHgiveth thee</a> not this good land to possess it for thy righteousness; for thou [art] __PNa_stiff_necked_3__SHa stiffnecked</a> people.__CPUnderstand_1__PSUnderstand__FFDeu/9/3\');">Deu 9:3__NRDeu/9/4\');">4__NBEze/20/44\');">Eze 20:44__AN__GHgiveth_thee_2__PSgiveth thee__FEMoses repeats this a third time, that, if it were possible, he might root out of the Israelites the opinion of their own deserts, before God rooted out the Canaanites from their country.__GGa_stiff_necked_3__PSa stiff-necked__FFDeu/9/13\');">Deu 9:13__NBDeu/10/16\');">Deu 10:16__NBDeu/31/27\');">Deu 31:27__NBExd/32/9\');">Exd 32:9__NBExd/33/3\');">Exd 33:3__NBExd/34/9\');">Exd 34:9__NB2Ch/30/8\');">2Ch 30:8__NB2Ch/36/13\');">2Ch 36:13__NBPsa/78/8\');">Psa 78:8__NBIsa/48/3\');">Isa 48:3__NRIsa/48/4\');">4__NBEze/2/4\');">Eze 2:4__NBZec/7/11\');">Zec 7:11__NRZec/7/12\');">12__NBAct/7/51\');">Act 7:51__NBRom/5/20\');">Rom 5:20__NRRom/5/21\');">21__EN';
stringArray[7] = '__PNRemember_1__SHRemember</a>, [and] forget not, how thou provokedst the LORD thy God to wrath in the wilderness: __PNfrom_the_day_2__SHfrom the day</a> that thou didst depart out of the land of Egypt, until ye came unto this place, ye have been rebellious against the LORD.__CPRemember_1__PSRemember__EEIn order to destroy the opinion which the Israelites had of their own righteousness, it was necessary to call to mind some of their most notorious provocations and rebellions, which Moses exhorts them to preserve in their mind, as a means to keep them humble. __NADeu/8/2\');">Deu 8:2__NBEze/16/61\');">Eze 16:61-63__NBEze/20/43\');">Eze 20:43__NBEze/36/31\');">Eze 36:31__NB1Cr/15/9\');">1Cr 15:9__NBEph/2/11\');">Eph 2:11__NB1Ti/1/13\');">1Ti 1:13-15__AN__GHfrom_the_day_2__PSfrom the day__EFDeu/31/27\');">Deu 31:27__NBDeu/32/5\');">Deu 32:5__NRDeu/32/6\');">6__NBExd/14/11\');">Exd 14:11__NBExd/16/2\');">Exd 16:2__NBExd/17/2\');">Exd 17:2__NBNum/11/4\');">Num 11:4__NBNum/14/1\');">Num 14:1-10__NBNum/16/1\');">Num 16:1-35__NBNum/20/2\');">Num 20:2-5__NBNum/21/5\');">Num 21:5__NBNum/25/2\');">Num 25:2__NBNeh/9/16\');">Neh 9:16-18__NBPsa/78/8\');">Psa 78:8-72__NBPsa/95/8\');">Psa 95:8-11__EN';

stringArray[9] = 'When __PNI_was_1__SHI was</a> gone up into the mount to receive __PNthe_tables_2__SHthe tables</a> of stone, [even] the tables of the covenant which the LORD made with you, __PNthen_I_3__SHthen I</a> abode in the mount forty days and forty nights, __PNI_neither_4__SHI neither</a> did eat bread nor drink water:__CPI_was_1__PSI was__FFExd/24/12\');">Exd 24:12__NRExd/24/15\');">15__NRExd/24/18\');">18__AN__GHthe_tables_2__PSthe tables__EFDeu/9/15\');">Deu 9:15__NBExd/31/18\');">Exd 31:18__NBExd/34/28\');">Exd 34:28__NBJer/31/31\');">Jer 31:31__NRJer/31/32\');">32__NBGal/4/24\');">Gal 4:24__AN__GGthen_I_3__PSthen I__FFExd/24/18\');">Exd 24:18__NBExd/34/28\');">Exd 34:28__NB1Ki/19/8\');">1Ki 19:8__NBMat/4/2\');">Mat 4:2__AN__GHI_neither_4__PSI neither__EFDeu/9/18\');">Deu 9:18__NB1Ki/13/8\');">1Ki 13:8__NR1Ki/13/9\');">9__NB2Ki/6/22\');">2Ki 6:22__EN';
stringArray[10] = 'And __PNthe_LORD_1__SHthe LORD</a> delivered unto me two tables of stone __PNwritten_with_2__SHwritten with</a> the finger of God; and on them [was written] according to __PNall_the_words_3__SHall the words</a>, which the LORD spake with you in the mount out of the midst of the fire in the day of the assembly.__CPthe_LORD_1__PSthe LORD__FFExd/31/18\');">Exd 31:18__AN__GHwritten_with_2__PSwritten with__EFDeu/10/4\');">Deu 10:4__NBMat/12/28\');">Mat 12:28__NBLuk/11/20\');">Luk 11:20__NB2Cr/3/3\');">2Cr 3:3__NBHbr/8/10\');">Hbr 8:10__AN__GGall_the_words_3__PSall the words__FFDeu/4/10\');">Deu 4:10-15__NBDeu/5/6\');">Deu 5:6-21__NBDeu/18/16\');">Deu 18:16__NBExd/19/17\');">Exd 19:17-19__NBExd/20/1\');">Exd 20:1-18__EN';

stringArray[14] = '__PNLet_me_1__SHLet me</a> alone, that I may destroy them, and __PNblot_2__SHblot</a> out their name from under heaven: __PNand_I_will_3__SHand I will</a> make of thee a nation mightier and greater than they.__CPLet_me_1__PSLet me__FFExd/32/10\');">Exd 32:10-13__NBIsa/62/6\');">Isa 62:6__NRIsa/62/7\');">7__NBJer/14/11\');">Jer 14:11__NBJer/15/1\');">Jer 15:1__NBLuk/11/7\');">Luk 11:7-10__NBLuk/18/1\');">Luk 18:1-8__NBAct/7/51\');">Act 7:51__AN__GHblot_2__PSblot__EFDeu/29/20\');">Deu 29:20__NBExd/32/32\');">Exd 32:32__NRExd/32/33\');">33__NBPsa/9/5\');">Psa 9:5__NBPsa/109/13\');">Psa 109:13__NBPro/10/7\');">Pro 10:7__NBRev/3/5\');">Rev 3:5__AN__GGand_I_will_3__PSand I will__FFNum/14/11\');">Num 14:11__NRNum/14/12\');">12__EN';
stringArray[15] = 'So __PNI_turned_1__SHI turned</a> and came down from __PNthe_mount_2__SHthe mount</a>, and the mount burned with fire: and the two tables of the covenant [were] in my two hands.__CPI_turned_1__PSI turned__FFExd/32/14\');">Exd 32:14__NRExd/32/15\');">15-35__AN__GHthe_mount_2__PSthe mount__EFDeu/4/11\');">Deu 4:11__NBDeu/5/23\');">Deu 5:23__NBExd/9/23\');">Exd 9:23__NBExd/19/18\');">Exd 19:18__NBHbr/12/18\');">Hbr 12:18__EN';
stringArray[16] = 'And __PNI_looked_1__SHI looked</a>, and, behold, ye had sinned against the LORD your God, [and] had made you a molten calf: ye had turned aside quickly out of the way which the LORD had commanded you.__CPI_looked_1__PSI looked__FFExd/32/19\');">Exd 32:19__NBAct/7/40\');">Act 7:40__NRAct/7/41\');">41__EN';
stringArray[17] = 'And I took the two tables, and __PNcast_them_1__SHcast them</a> out of my two hands, and brake them before your eyes.__CPcast_them_1__PScast them__EEMoses might have done this through distress and anguish of spirit, on beholding their abominable idolatry and dissolute conduct; or probably he did it emblematically, and perhaps by the direction of God; intimating thereby, that as by this act of his the tables were broken in pieces, on which the Law of God was written, so they, by their present conduct, had made a breach in the covenant, and broken the laws of their Maker and Sovereign.</TD></TR>';
stringArray[18] = 'And __PNI_fell_down_1__SHI fell down</a> before the LORD, as at the first, forty days and forty nights: I did neither eat bread, nor drink water, because of all your sins which ye sinned, in doing wickedly in the sight of the LORD, to provoke him to anger.__CPI_fell_down_1__PSI fell down__EEThe transgressions of the people rendered this second forty days\' fasting necessary to Moses. Their pardon was indeed in some sense obtained before he ascended the mount; yet probably much of the time which he spent there was employed in supplication: and when he descended the second time, with the tables of the law in his hands, the pardon was, as it were, ratified and sealed. __NADeu/9/9\');">Deu 9:9__NBExd/32/10\');">Exd 32:10-14__NBExd/34/28\');">Exd 34:28__NB2Sa/12/16\');">2Sa 12:16__NBPsa/106/23\');">Psa 106:23__EN';
stringArray[19] = '__PNFor_I_1__SHFor I</a> was afraid of the anger and hot displeasure, wherewith the LORD was wroth against you to destroy you. __PNBut_the_2__SHBut the</a> LORD hearkened unto me at that time also.__CPFor_I_1__PSFor I__FFDeu/9/8\');">Deu 9:8__NBExd/32/10\');">Exd 32:10__NRExd/32/11\');">11__NBNeh/1/2\');">Neh 1:2-7__NBLuk/12/4\');">Luk 12:4__NRLuk/12/5\');">5__AN__GHBut_the_2__PSBut the__EFDeu/10/10\');">Deu 10:10__NBExd/32/14\');">Exd 32:14__NBExd/33/17\');">Exd 33:17__NBPsa/99/6\');">Psa 99:6__NBPsa/106/23\');">Psa 106:23__NBAmo/7/2\');">Amo 7:2__NRAmo/7/3\');">3__NRAmo/7/5\');">5__NRAmo/7/6\');">6__NBJam/5/16\');">Jam 5:16__NRJam/5/17\');">17__EN';
stringArray[20] = 'And the LORD was very angry with Aaron to have destroyed him: and I prayed for Aaron also the same time.__CPRelated_Verses1_1__PSEntire Verse.__FFExd/32/2\');">Exd 32:2-5__NRExd/32/21\');">21__NRExd/32/35\');">35__NBHbr/7/26\');">Hbr 7:26-28__EN';
stringArray[21] = 'And __PNI_took_1__SHI took</a> your sin, the calf which ye had made, and burnt it with fire, and stamped it, [and] ground [it] very small, [even] until it was as small as dust: and I cast the dust thereof into __PNthe_brook_2__SHthe brook</a> that descended out of the mount.__CPI_took_1__PSI took__FFExd/32/20\');">Exd 32:20__NBIsa/2/18\');">Isa 2:18-21__NBIsa/30/22\');">Isa 30:22__NBIsa/31/7\');">Isa 31:7__NBHsa/8/11\');">Hsa 8:11__AN__GHthe_brook_2__PSthe brook__FEThis was the stream which flowed from the rock that Moses smote with his rod, (__NAExd/17/6\');">Exd 17:6__AN,) and to which the Psalmist alludes in __NAPsa/78/16\');">Psa 78:16-20__NBPsa/105/41\');">105:41__AN. Philo relates, that upon Moses\' striking the rock, the water poured out like a torrent, affording not only a sufficient quantity for allaying their present thirst, but to fill their water vessels, to carry with them on their journey.</TD></TR>';
stringArray[22] = 'And at __PNTaberah_1__SHTaberah</a>, and at __PNMassah_2__SHMassah</a>, and at __PNKibroth_hattaavah_3__SHKibrothhattaavah</a>, ye provoked the LORD to wrath.__CPTaberah_1__PSTaberah__FFNum/11/1\');">Num 11:1-5__AN__GHMassah_2__PSMassah__EFExd/17/7\');">Exd 17:7__AN__GGKibroth_hattaavah_3__PSKibroth-hattaavah__FFNum/11/4\');">Num 11:4__NRNum/11/34\');">34__EN';
