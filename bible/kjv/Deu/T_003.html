var stringArray = new Array();
stringArray[1] = 'Then we turned, and went up the way to __PNBashan_1__SHBashan</a>: and __PNOg_2__SHOg</a> the king of Bashan came out against us, he and all his people, to battle at __PNEdrei_3__SHEdrei</a>.__CPBashan_1__PSBashan__EEBashan, one of the most fertile districts of the Holy Land, was bounded on the west by the Jordan and lake of Gennesareth, on the east by Trachonitis, on the south by the brook Jabbok, and on the north by mount Hermon; and seems to have been composed of two or three districts, on the south the land of Gilead, on the north the region of Argob, and east of both, the plain of Hauran. (See __NADeu/3/13\');">Deu 3:13-15__AN.) The scenery of this elevated tract is described by Mr. Buckingham as extremely beautiful: its plains covered with a fertile soil; its hills covered with forests, and at every new turn presenting the most beautiful landscapes that can be imagined.__GHOg_2__PSOg__EFDeu/1/4\');">Deu 1:4__NBDeu/4/47\');">Deu 4:47__NBDeu/29/7\');">Deu 29:7__NBDeu/31/4\');">Deu 31:4__NBNum/21/33\');">Num 21:33-35__NBJos/9/10\');">Jos 9:10__NBJos/12/4\');">Jos 12:4__NBJos/13/30\');">Jos 13:30__NB1Ki/4/19\');">1Ki 4:19__NBNeh/9/22\');">Neh 9:22__NBPsa/135/10\');">Psa 135:10__NRPsa/135/11\');">11__NBPsa/136/20\');">Psa 136:20__AN__GGEdrei_3__PSEdrei__EEThis town is placed by Eusebius about 25 miles northward from Bostri; and mentioned by Burckhardt under the name of Draa.</TD></TR>';
stringArray[2] = 'And the LORD said unto me, __PNFear_1__SHFear</a> him not: for I will deliver him, and all his people, and his land, into thy hand; and thou shalt do unto him __PNas_thou_didst_2__SHas thou didst</a> unto Sihon king of the Amorites, which dwelt at Heshbon.__CPFear_1__PSFear__FFDeu/3/11\');">Deu 3:11__NBDeu/20/3\');">Deu 20:3__NBNum/14/9\');">Num 14:9__NB2Ch/20/17\');">2Ch 20:17__NBIsa/41/10\');">Isa 41:10__NBIsa/43/5\');">Isa 43:5__NBAct/18/9\');">Act 18:9__NBAct/27/24\');">Act 27:24__NBRev/2/10\');">Rev 2:10__AN__GHas_thou_didst_2__PSas thou didst__EFDeu/2/24\');">Deu 2:24-37__NBNum/21/23\');">Num 21:23-25__EN';
stringArray[3] = 'So the LORD our God delivered into our hands Og also, the king of Bashan, and all his people: and we smote him until none was left to him remaining.__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/2/33\');">Deu 2:33__NRDeu/2/34\');">34__NBNum/21/35\');">Num 21:35__NBJos/13/12\');">Jos 13:12__NRJos/13/30\');">30__EN';
stringArray[4] = 'And we took __PNall_his_cities_1__SHall his cities</a> at that time, there was not a city which we took not from them, threescore cities, __PNall_the_region_2__SHall the region</a> of Argob, the kingdom of Og in Bashan.__CPall_his_cities_1__PSall his cities__FFNum/32/33\');">Num 32:33-42__NBJos/12/4\');">Jos 12:4__NBJos/13/30\');">Jos 13:30__NRJos/13/31\');">31__AN__GHall_the_region_2__PSall the region__EF1Ki/4/13\');">1Ki 4:13__EN';

stringArray[6] = 'And __PNwe_utterly_1__SHwe utterly</a> destroyed them, __PNas_we_did_2__SHas we did</a> unto Sihon king of Heshbon, utterly destroying the men, women, and children, of every city.__CPwe_utterly_1__PSwe utterly__FFDeu/2/34\');">Deu 2:34__NBDeu/20/16\');">Deu 20:16-18__NBLev/27/28\');">Lev 27:28__NRLev/27/29\');">29__NBNum/21/2\');">Num 21:2__NBJos/11/14\');">Jos 11:14__AN__GHas_we_did_2__PSas we did__EFDeu/3/2\');">Deu 3:2__NBDeu/2/24\');">Deu 2:24__NRDeu/2/34\');">34__NBPsa/135/10\');">Psa 135:10-12__NBPsa/136/19\');">Psa 136:19-21__EN';
stringArray[7] = 'But all the cattle, and the spoil of the cities, we took for a prey to ourselves.__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/2/35\');">Deu 2:35__NBJos/8/27\');">Jos 8:27__NBJos/11/11\');">Jos 11:11-14__EN';
stringArray[8] = 'And we took at that time out of the hand of the two kings of the Amorites __PNthe_land_1__SHthe land</a> that [was] on this side Jordan, from the river of Arnon unto mount Hermon;__CPthe_land_1__PSthe land__FFNum/32/33\');">Num 32:33-42__NBJos/12/2\');">Jos 12:2-6__NBJos/13/9\');">Jos 13:9-12__EN';
stringArray[9] = '([Which] __PNHermon_1__SHHermon</a> the Sidonians call Sirion; and the Amorites call it __PNShenir_2__SHShenir</a>;)__CPHermon_1__PSHermon__EE"Mount Hermon is the south-eastern branch of Lebanon, beyond Jordan. The Chaldee Targumist, who places it at Cæsarea and Samaritan interpreter call it toor talga, ""the mountain of snow,"" because of its being always covered with snow; and Jerome informs us, that it lies higher than Paneas or Cæsarea Philippi, and that in the summer time snow used to be carried from thence to Tyre. It is now call El Heish, and is comprised in the district of Kanneytra. __NADeu/4/48\');">Deu 4:48__NRDeu/4/49\');">49__NBPsa/29/6\');">Psa 29:6__NBPsa/89/12\');">Psa 89:12__NBPsa/133/3\');">Psa 133:3__NBSgs/4/8\');">Sgs 4:8__AN"__GHShenir_2__PSShenir__EF1Ch/5/23\');">1Ch 5:23__NBEze/27/5\');">Eze 27:5__AN; Senir.</TD></TR>';
stringArray[10] = 'All __PNthe_cities_1__SHthe cities</a> of the plain, and all Gilead, and all Bashan, unto Salchah and __PNEdrei_2__SHEdrei</a>, cities of the kingdom of Og in Bashan.__CPthe_cities_1__PSthe cities__FFDeu/4/49\');">Deu 4:49__AN__GHEdrei_2__PSEdrei__EFNum/21/33\');">Num 21:33__NBJos/12/4\');">Jos 12:4__NRJos/12/5\');">5__NBJos/13/11\');">Jos 13:11__NRJos/13/12\');">12__NRJos/13/31\');">31__EN';
stringArray[11] = 'For only Og king of Bashan remained of the remnant of __PNgiants_1__SHgiants</a>; behold, his bedstead [was] a bedstead of iron; [is] it not in __PNRabbath_2__SHRabbath</a> of the children of Ammon? __PNnine_cubits_3__SHnine cubits</a> [was] the length thereof, and four cubits the breadth of it, after the cubit of a man.__CPgiants_1__PSgiants__FFGen/14/5\');">Gen 14:5__AN__GHRabbath_2__PSRabbath__EF2Sa/12/26\');">2Sa 12:26__NBJer/49/2\');">Jer 49:2__NBEze/21/20\');">Eze 21:20__NBAmo/1/14\');">Amo 1:14__AN; Rabbah.__GGnine_cubits_3__PSnine cubits__FF1Sa/17/4\');">1Sa 17:4__NBAmo/2/9\');">Amo 2:9__EN';
stringArray[12] = 'And this land, [which] we possessed at that time, __PNfrom_Aroer_1__SHfrom Aroer</a>, which [is] by the river Arnon, and half mount Gilead, and the cities thereof, gave I unto the Reubenites and to the Gadites.__CPfrom_Aroer_1__PSfrom Aroer__FFDeu/2/36\');">Deu 2:36__NBDeu/4/48\');">Deu 4:48__NBNum/32/33\');">Num 32:33-38__NBJos/12/2\');">Jos 12:2-6__NBJos/13/8\');">Jos 13:8-12__NRJos/13/14\');">14-28__NB2Ki/10/33\');">2Ki 10:33__EN';
stringArray[13] = 'And __PNthe_rest_1__SHthe rest</a> of Gilead, and all Bashan, [being] the kingdom of Og, gave I unto the half tribe of Manasseh; all the region of Argob, with all Bashan, __PNwhich_was_called_2__SHwhich was called</a> the land of giants.__CPthe_rest_1__PSthe rest__FFNum/32/39\');">Num 32:39-42__NBJos/13/29\');">Jos 13:29-32__NB1Ch/5/23\');">1Ch 5:23-26__AN__GHwhich_was_called_2__PSwhich was called__FE"Michaelis says, ""The tradition that giants formerly dwelt in this part, still remains in Arabia, only that it makes them rather taller than Moses does Og, and calls the land in which they lived, not Bashan, but Hadrach, which name occurs in __NAZec/9/1\');">Zec 9:1__AN. I received this information from the verbal communication of a credible Arab, who was born on the other side of Jordan, about three-days journey from Damascus."""</TD></TR>';
stringArray[14] = '__PNJair_1__SHJair</a> the son of Manasseh took all the country of __PNArgob_2__SHArgob</a> unto the coasts of __PNGeshuri_3__SHGeshuri</a> and Maachathi; and called them after his own name, __PNBashan_havoth_jair_4__SHBashanhavothjair</a>, unto this day.__CPJair_1__PSJair__FF1Ch/2/21\');">1Ch 2:21-23__AN__GHArgob_2__PSArgob__FESee on __NADeu/3/4\');">Deu 3:4__AN__GGGeshuri_3__PSGeshuri__FFJos/13/13\');">Jos 13:13__NB2Sa/3/3\');">2Sa 3:3__NB2Sa/10/6\');">2Sa 10:6__NB2Sa/13/37\');">2Sa 13:37__AN__GHBashan_havoth_jair_4__PSBashan-havoth-jair__EFNum/32/41\');">Num 32:41__EN';
stringArray[15] = 'And I gave Gilead unto __PNMachir_1__SHMachir</a>.__CPMachir_1__PSMachir__FFGen/50/23\');">Gen 50:23__NBNum/26/29\');">Num 26:29__NBNum/32/39\');">Num 32:39__NRNum/32/40\');">40__NBJos/17/1\');">Jos 17:1-3__NBJos/22/7\');">Jos 22:7__EN';
stringArray[16] = 'And unto the __PNReubenites_1__SHReubenites</a> and unto the Gadites I gave from Gilead even unto the river Arnon half the valley, and the border even unto the __PNriver_Jabbok_2__SHriver Jabbok</a>, [which is] the border of the children of Ammon;__CPReubenites_1__PSReubenites__FFNum/32/33\');">Num 32:33-38__NB2Sa/24/5\');">2Sa 24:5__AN__GHriver_Jabbok_2__PSriver Jabbok__EFDeu/2/37\');">Deu 2:37__NBGen/32/22\');">Gen 32:22__NBNum/21/24\');">Num 21:24__NBJos/12/2\');">Jos 12:2__NRJos/12/3\');">3__EN';
stringArray[17] = 'The plain also, and Jordan, and the coast [thereof], from __PNChinnereth_1__SHChinnereth</a> even unto __PNthe_sea_2__SHthe sea</a> of the plain, [even] the salt sea, under __PNAshdoth_pisgah_3__SHAshdothpisgah</a> eastward.__CPChinnereth_1__PSChinnereth__FFNum/34/11\');">Num 34:11__NBJos/12/3\');">Jos 12:3__AN__GHthe_sea_2__PSthe sea__EFDeu/4/49\');">Deu 4:49__NBGen/13/10\');">Gen 13:10__NBGen/14/3\');">Gen 14:3__NBGen/19/28\');">Gen 19:28__NRGen/19/29\');">29__NBNum/34/11\');">Num 34:11__NRNum/34/12\');">12__NBJos/3/16\');">Jos 3:16__NBJos/12/3\');">Jos 12:3__NBJos/15/2\');">Jos 15:2__NRJos/15/5\');">5__NBJos/18/19\');">Jos 18:19__AN__GGAshdoth_pisgah_3__PSAshdoth-pisgah__EEor, the springs of Pisgah, or, the hill. __NANum/23/14\');">Num 23:14__EN';
stringArray[18] = 'And __PNI_commanded_1__SHI commanded</a> you at that time, saying, The LORD your God hath given you this land to possess it: ye shall pass over armed before your brethren the children of Israel, all [that are] __PNmeet_for_the_war_2__SHmeet for the war</a>.__CPI_commanded_1__PSI commanded__FFNum/32/20\');">Num 32:20-24__NBJos/1/12\');">Jos 1:12-15__NBJos/4/12\');">Jos 4:12__NRJos/4/13\');">13__NBJos/22/1\');">Jos 22:1-9__AN__GHmeet_for_the_war_2__PSmeet for the war__FEHeb. sons of power.</TD></TR>';
stringArray[19] = 'But your wives, and your little ones, and your cattle, ([for] I know that ye have much cattle,) shall abide in your cities which I have given you;__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[20] = 'Until the LORD have given rest unto your brethren, as well as unto you, and [until] they also possess the land which the LORD your God hath given them beyond Jordan: and [then] shall ye __PNreturn_1__SHreturn</a> every man unto his possession, which I have given you.__CPreturn_1__PSreturn__FFJos/22/4\');">Jos 22:4__NRJos/22/8\');">8__EN';
stringArray[21] = 'And __PNI_commanded_1__SHI commanded</a> Joshua at that time, saying, Thine eyes have seen all that the LORD your God hath done unto these two kings: __PNso_shall_2__SHso shall</a> the LORD do unto all the kingdoms whither thou passest.__CPI_commanded_1__PSI commanded__FFNum/27/18\');">Num 27:18-23__AN__GHso_shall_2__PSso shall__EFJos/10/25\');">Jos 10:25__NB1Sa/17/36\');">1Sa 17:36__NR1Sa/17/37\');">37__NBPsa/9/10\');">Psa 9:10__NB2Cr/1/10\');">2Cr 1:10__NB2Cr/12/10\');">2Cr 12:10__NBEph/3/20\');">Eph 3:20__NB2Ti/4/17\');">2Ti 4:17__NR2Ti/4/18\');">18__EN';
stringArray[22] = 'Ye __PNshall_not_1__SHshall not</a> fear them: __PNfor_the_LORD_2__SHfor the LORD</a> your God he shall fight for you.__CPshall_not_1__PSshall not__FFIsa/43/1\');">Isa 43:1__NRIsa/43/2\');">2__AN__GHfor_the_LORD_2__PSfor the LORD__EFDeu/1/30\');">Deu 1:30__NBDeu/20/4\');">Deu 20:4__NBExd/14/14\');">Exd 14:14__NBNum/21/34\');">Num 21:34__NBJos/10/42\');">Jos 10:42__NB2Ch/13/12\');">2Ch 13:12__NB2Ch/20/17\');">2Ch 20:17__NR2Ch/20/29\');">29__NBPsa/44/3\');">Psa 44:3__EN';
stringArray[23] = 'And I besought the LORD at that time, saying,__CPRelated_Verses1_1__PSEntire Verse.__FF2Cr/12/8\');">2Cr 12:8__NR2Cr/12/9\');">9__EN';
stringArray[24] = 'O Lord GOD, thou hast begun to shew thy servant __PNthy_greatness_1__SHthy greatness</a>, and thy mighty hand: for __PNwhat_God_2__SHwhat God</a> [is there] in heaven or in earth, that can do according to thy works, and according to thy might?__CPthy_greatness_1__PSthy greatness__FFDeu/11/2\');">Deu 11:2__NBNeh/9/32\');">Neh 9:32__NBPsa/106/2\');">Psa 106:2__NBPsa/145/3\');">Psa 145:3__NRPsa/145/6\');">6__NBJer/32/18\');">Jer 32:18-21__AN__GHwhat_God_2__PSwhat God__EFExd/15/11\');">Exd 15:11__NB2Sa/7/22\');">2Sa 7:22__NBPsa/35/10\');">Psa 35:10__NBPsa/71/19\');">Psa 71:19__NBPsa/86/8\');">Psa 86:8__NBPsa/89/6\');">Psa 89:6__NRPsa/89/8\');">8__NBIsa/40/18\');">Isa 40:18__NRIsa/40/25\');">25__NBJer/10/6\');">Jer 10:6__NBDan/3/29\');">Dan 3:29__EN';
stringArray[25] = 'I pray thee, let me go over, and see __PNthe_good_land_1__SHthe good land</a> that [is] beyond Jordan, that goodly mountain, and __PNLebanon_2__SHLebanon</a>.__CPthe_good_land_1__PSthe good land__FFDeu/4/21\');">Deu 4:21__NRDeu/4/22\');">22__NBDeu/11/11\');">Deu 11:11__NRDeu/11/12\');">12__NBExd/3/8\');">Exd 3:8__NBNum/32/5\');">Num 32:5__NBEze/20/6\');">Eze 20:6__AN__GHLebanon_2__PSLebanon__FELebanon is a long chain of limestone mountains, extending from near the coast of the Mediterranean on the west to the plains of Damascus on the east, and forming the extreme northern boundary of the Holy Land. It is divided into two principal ridges, running parallel to each other in a north-north-east direction; the most westerly of which was properly called Libanus, and the easterly Anti-Libanus: the Hebrews did not make this distinction. It is computed to be fifteen or sixteen hundred fathoms in height. They are by no means barren, but are almost all well cultivated and well peopled; their summits being in many parts level, and forming extensive plains, in which are sown corn and all kinds of pulse. Vineyards, and plantations of olive, mulberry, and fig trees, are also cultivated in terraces formed by walls; and the soil of the declivities and hollows is most excellent, and produces abundance of corn, oil, and wine.</TD></TR>';
stringArray[26] = 'But __PNthe_LORD_1__SHthe LORD</a> was wroth with me for your sakes, and would not hear me: and the LORD said unto me, __PNLet_it_2__SHLet it</a> suffice thee; speak no more unto me of this matter.__CPthe_LORD_1__PSthe LORD__FFDeu/1/37\');">Deu 1:37__NBDeu/31/2\');">Deu 31:2__NBDeu/32/51\');">Deu 32:51__NRDeu/32/52\');">52__NBDeu/34/4\');">Deu 34:4__NBNum/20/7\');">Num 20:7-12__NBNum/27/12\');">Num 27:12-14__NBPsa/106/32\');">Psa 106:32__NRPsa/106/33\');">33__NBIsa/53/5\');">Isa 53:5__NRIsa/53/6\');">6__NBMat/26/39\');">Mat 26:39__AN__GHLet_it_2__PSLet it__EF1Ch/17/4\');">1Ch 17:4__NR1Ch/17/12\');">12__NR1Ch/17/13\');">13__NB1Ch/22/7\');">1Ch 22:7-9__NB1Ch/28/2\');">1Ch 28:2-4__NBMat/20/22\');">Mat 20:22__NB2Cr/12/8\');">2Cr 12:8__EN';
stringArray[27] = 'Get __PNthee_up_1__SHthee up</a> into the top of __PNPisgah_2__SHPisgah</a>, and __PNlift_up_3__SHlift up</a> thine eyes westward, and northward, and southward, and eastward, and behold [it] with thine eyes: for thou shalt not go over this Jordan.__CPthee_up_1__PSthee up__FFDeu/34/1\');">Deu 34:1-4__NBNum/27/12\');">Num 27:12__AN__GHPisgah_2__PSPisgah__FEor, the hill. __NADeu/3/17\');">Deu 3:17__AN__GGlift_up_3__PSlift up__FFGen/13/14\');">Gen 13:14__NRGen/13/15\');">15__EN';
