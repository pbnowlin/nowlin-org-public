Text[1] = 'Observe the month of Abib, and keep the passover unto the LORD thy God: for in the month of Abib the LORD thy God brought thee forth out of Egypt by night.';

Text[3] = 'Thou shalt eat no leavened bread with it; seven days shalt thou eat unleavened bread therewith, [even] the bread of affliction; for thou camest forth out of the land of Egypt in haste: that thou mayest remember the day when thou camest forth out of the land of Egypt all the days of thy life.';

Text[7] = 'And thou shalt roast and eat [it] in the place which the LORD thy God shall choose: and thou shalt turn in the morning, and go unto thy tents.';
Text[8] = 'Six days thou shalt eat unleavened bread: and on the seventh day [shall be] a solemn assembly to the LORD thy God: thou shalt do no work [therein].';

Text[12] = 'And thou shalt remember that thou wast a bondman in Egypt: and thou shalt observe and do these statutes.';
Text[13] = 'Thou shalt observe the feast of tabernacles seven days, after that thou hast gathered in thy corn and thy wine:';
Text[14] = 'And thou shalt rejoice in thy feast, thou, and thy son, and thy daughter, and thy manservant, and thy maidservant, and the Levite, the stranger, and the fatherless, and the widow, that [are] within thy gates.';
