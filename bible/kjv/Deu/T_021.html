stringArray[3] = 'And it shall be, [that] the city [which is] next unto the slain man, even the elders of that city shall take __PNan_1__SHan</a> heifer, which hath not been wrought with, [and] which hath not drawn in the yoke;__CPan_1__PSan__FFNum/19/2\');">Num 19:2__NBJer/31/18\');">Jer 31:18__NBMat/11/28\');">Mat 11:28-30__NBPhl/2/8\');">Phl 2:8__EN';
stringArray[4] = 'And the elders of that city shall bring down the heifer unto __PNa_rough_valley_1__SHa rough valley</a>, which is neither eared nor sown, and __PNshall_strike_2__SHshall strike</a> off the heifer\'s neck there in the valley:__CPa_rough_valley_1__PSa rough valley__EE"As the word nachal signifies both a torrent, and the valley or glen through which it flows, nachal aithan may be rendered a rapid torrent. Many torrents in Judea are dry during a great part of the year; when not only their banks but their beds may be ploughed, and yield a crop. Hence there is no impropriety in specifying that such a place should be one that ""is neither cared nor sown;"" while the circumstance that the elders were to wash their hands over the heifer, whose head had been struck off into the stream, confirms this interpretation. The spot of ground where this sacrifice was made must be uncultivated, because it was considered as a sacrifice for the atonement of murder, and, consequently, would pollute the land."__GHshall_strike_2__PSshall strike__EF1Pe/2/21\');">1Pe 2:21-24__NB1Pe/3/18\');">1Pe 3:18__EN';

stringArray[12] = 'Then thou shalt bring her home to thine house; __PNand_she_shall_1__SHand she shall</a> shave her head, and __PNpare_her_nails_2__SHpare her nails</a>;__CPand_she_shall_1__PSand she shall__EE"This was in token of renouncing her religion, and becoming a proselyte to that of the Jews. This is still a custom in the East: when a Christian turns Mohammedan, his head is shaved, and he is carried through the city, crying, la eelah eela allah wemochammed resoolu \'llahee, ""There is no God but the God, and Mohammed is the prophet of God."" __NA1Cr/11/6\');">1Cr 11:6__NBEph/4/22\');">Eph 4:22__AN"__GHpare_her_nails_2__PSpare her nails__FE"or, suffer to grow. Heb. make, or dress. WÎ‚sethah eth tzipparneyha, ""and she shall make her nails;"" i.e., probably neither paring nor letting them grow, but dressing or beautifying them as the Eastern women still do by tinging them with the leaves of an odoriferous plant called alhenna, which Hasselquist (p. 246) informs us, ""grows in India and in upper and lower Egypt, flowering from May to August. The leaves are pulverized and made into a paste with water: they bind this paste on the nails of their hands and feet, and keep it on all night. This gives them a deep yellow, which is greatly admired by Eastern nations. The colour lasts for three or four weeks before there is occasion to renew it. The custom is so ancient in Egypt, that I have seen the nails of mummies dyed in this manner."""</TD></TR>';

stringArray[22] = 'And if a man have committed a sin __PNworthy_of_death_1__SHworthy of death</a>, and he be to be put to death, and __PNthou_hang_2__SHthou hang</a> him on a tree:__CPworthy_of_death_1__PSworthy of death__EEHeb. of the judgment of death. The Hebrews understand this not of putting to death by hanging, but of hanging a man up after he was stoned to death; which was done more ignominiously of some heinous malefactors. We have the examples of Rechab and Baanah, who, for murdering Ish-bosheth, were slain by David\'s commandment, their hand and feet cut off, and then hanged up. __NA2Sa/4/12\');">2Sa 4:12__AN; See also __NAJos/8/29\');">Jos 8:29__NBJos/10/26\');">Jos 10:26__AN; So __NANum/25/4\');">Num 25:4__AN; we read, ?And the LORD said unto Moses, Take all the heads (chief men) of the people, and hang them up before the LORD against the sun, that the fierce anger of the LORD may be turned away from Israel?. Among the Romans, in after ages, they hanged, or rather fastened to the tree ALIVE; and such was the cruel death of our blessed LORD and Saviour Jesus Christ. __NADeu/19/6\');">Deu 19:6__NBDeu/22/26\');">Deu 22:26__NB1Sa/26/16\');">1Sa 26:16__NBMat/26/66\');">Mat 26:66__NBAct/23/29\');">Act 23:29__NBAct/25/11\');">Act 25:11__NRAct/25/25\');">25__NBAct/26/31\');">Act 26:31__AN__GHthou_hang_2__PSthou hang__EF2Sa/21/6\');">2Sa 21:6__NR2Sa/21/9\');">9__NBLuk/23/33\');">Luk 23:33__NBJhn/19/31\');">Jhn 19:31-38__EN';
stringArray[23] = 'His body shall not remain all night upon the tree, but thou shalt in any wise bury him that day; (for __PNhe_that_is_hanged_is_accursed_of_God_1__SHhe that is hanged [is] accursed of God</a>;) that __PNthy_land_2__SHthy land</a> be not defiled, which the LORD thy God giveth thee [for] an inheritance.__CPhe_that_is_hanged_is_accursed_of_God_1__PShe that is hanged is accursed of God__EEHeb. the curse of God. That is, it is the highest degree of reproach that can attach to a man, and proclaims him under the curse of God as much as any external punishment can. They that see him thus hanging between heaven and earth, will conclude him abandoned of both, and unworthy of either. Bp. Patrick observes, that this passage is applied to the death of Christ; not only because he bare our sins and was exposed to shame, as these malefactors were that were accursed of God, but because he was in the evening taken down from the cursed tree and buried, (and that by the particular care of the Jews, with an eye to this law, __NAJhn/19/31\');">Jhn 19:31__AN,) in token, that now the guilt being removed, the law was satisfied, as it was when the malefactors had hanged till sun-set: it demanded no more. Then he, and those that are his, ceased to be a curse. And as the land of Israel was pure and clean when the body was buried, so the church is washed and cleansed by the complete satisfaction which Christ thus made. __NADeu/7/26\');">Deu 7:26__NBNum/25/4\');">Num 25:4__AN; J__GHthy_land_2__PSthy land__EFLev/18/25\');">Lev 18:25__NBNum/35/33\');">Num 35:33__NRNum/35/34\');">34__EN';
