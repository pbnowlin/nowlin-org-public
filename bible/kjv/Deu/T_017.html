stringArray[16] = 'But he shall not __PNmultiply_horses_1__SHmultiply horses</a> to himself, nor __PNcause_2__SHcause</a> the people to return to Egypt, to the end that he should multiply horses: forasmuch as the LORD hath said unto you, __PNYe_shall_henceforth_3__SHYe shall henceforth</a> return no more that way.__CPmultiply_horses_1__PSmultiply horses__EEMultiplying horses for chariots of war and cavalry, or for luxury, would increase the splendour of a monarch, and form a ground of confidence distinct from a proper confidence in God, and inconsistent with it, and with considering him as the glory of Israel. Egypt abounded in horses; and the desire of multiplying these would induce the prince to encourage a trade with that kingdom; and this might make way for the Israelites being again subjugated by the Egyptians, or at least corrupted by their idolatries and vices. Whereas, it was the command of God that they should no more return thither, but be totally detached from them. Besides, they might be tempted to extend their dominion by means of cavalry, and so get scattered among the surrounding idolatrous nations, and thus cease to be that distinct, separate people, which God intended they should be. __NA1Sa/8/11\');">1Sa 8:11__NB2Sa/8/4\');">2Sa 8:4__NB1Ki/1/5\');">1Ki 1:5__NB1Ki/4/26\');">1Ki 4:26__NB1Ki/10/26\');">1Ki 10:26-28__NB2Ch/9/25\');">2Ch 9:25__NBPsa/20/7\');">Psa 20:7__NBIsa/36/8\');">Isa 36:8__NRIsa/36/9\');">9__NBHsa/14/3\');">Hsa 14:3__AN__GHcause_2__PScause__EFIsa/31/1\');">Isa 31:1-3__NBJer/42/14\');">Jer 42:14__NBEze/17/15\');">Eze 17:15__AN__GGYe_shall_henceforth_3__PSYe shall henceforth__FFDeu/28/68\');">Deu 28:68__NBExd/13/17\');">Exd 13:17__NBExd/14/13\');">Exd 14:13__NBNum/14/3\');">Num 14:3__NRNum/14/4\');">4__NBJer/42/15\');">Jer 42:15__NRJer/42/16\');">16__NBHsa/11/5\');">Hsa 11:5__EN';
