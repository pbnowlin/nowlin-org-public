stringArray[8] = '__PNAnd_when_1__SHAnd when</a> we passed by from our brethren the children of Esau, which dwelt in Seir, through the way of the plain from __PNElath_2__SHElath</a>, and from Eziongaber, we turned and passed by the way of the wilderness of Moab.__CPAnd_when_1__PSAnd when__FFNum/20/20\');">Num 20:20__NRNum/20/21\');">21__NBJdg/11/18\');">Jdg 11:18__AN__GHElath_2__PSElath__EF1Ki/9/26\');">1Ki 9:26__AN; Eloth. __NA2Ki/14/22\');">2Ki 14:22__NB2Ki/16/6\');">2Ki 16:6__EN';
stringArray[9] = 'And the LORD said unto me, __PNDistress_not_the_Moabites_1__SHDistress not the Moabites</a>, neither contend with them in battle: for I will not give thee of their land [for] a possession; because I have given __PNAr_2__SHAr</a> unto __PNthe_children_3__SHthe children</a> of Lot [for] a possession.__CPDistress_not_the_Moabites_1__PSDistress not the Moabites__EEor, Use no hostility against Moab. __NANum/22/4\');">Num 22:4__NBJdg/11/17\');">Jdg 11:17__NB2Ch/20/10\');">2Ch 20:10__AN__GHAr_2__PSAr__FEAr was situated south of the Arnon; and was called by the Greek writers Areopolis, and thought by them to be so named because the inhabitants worshipped [Ares] or Mars. St. Jerome says that it was destroyed by an earthquake when he was an infant. Burckhardt supposes that the ruins of a small castle called Mehatet el Hadj, may be the site of this ancient city. __NADeu/2/5\');">Deu 2:5__NBNum/21/15\');">Num 21:15__NRNum/21/28\');">28__AN__GGthe_children_3__PSthe children__FFDeu/2/19\');">Deu 2:19__NBGen/19/36\');">Gen 19:36__NRGen/19/37\');">37__NBPsa/83/8\');">Psa 83:8__EN';
stringArray[10] = 'The Emims dwelt therein in times past, a people great, and many, and tall, as the Anakims;__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/2/11\');">Deu 2:11__NBGen/14/5\');">Gen 14:5__EN';
stringArray[11] = 'Which also were accounted giants, __PNas_the_Anakims_1__SHas the Anakims</a>; but the Moabites call them Emims.__CPas_the_Anakims_1__PSas the Anakims__FFDeu/1/28\');">Deu 1:28__NBDeu/9/2\');">Deu 9:2__NBNum/13/22\');">Num 13:22__NRNum/13/28\');">28__NRNum/13/33\');">33__EN';
stringArray[12] = 'The __PNHorims_1__SHHorims</a> also dwelt in Seir beforetime; but the children of Esau __PNsucceeded_them_2__SHsucceeded them</a>, when they had destroyed them from before them, and dwelt in their __PNstead_3__SHstead</a>; as Israel did unto the land of his possession, which the LORD gave unto them.__CPHorims_1__PSHorims__FFDeu/2/22\');">Deu 2:22__NBGen/14/6\');">Gen 14:6__NBGen/36/20\');">Gen 36:20-30__NB1Ch/1/38\');">1Ch 1:38-42__AN__GHsucceeded_them_2__PSsucceeded them__FEHeb. inherited them. __NAGen/36/31\');">Gen 36:31-43__NB1Ch/1/43\');">1Ch 1:43-54__AN__GGstead_3__PSstead__EEor, room. as Israel did. Israel had, at the time when Moses spake this, conquered Sihon and Og, and taken possession of their countries, as Edom had done to the Horims. __NADeu/2/22\');">Deu 2:22__NRDeu/2/32\');">32-37__NBDeu/3/1\');">Deu 3:1-11__NBGen/36/20\');">Gen 36:20__NBNum/21/21\');">Num 21:21-35__EN';
stringArray[13] = 'Now rise up, [said I], and get you over the __PNbrook_1__SHbrook</a> __PNZered_2__SHZered</a>. And we went over the brook Zered.__CPbrook_1__PSbrook__EEor, valley. __NANum/13/23\');">Num 13:23__AN; *marg:__GHZered_2__PSZered__FEThe brook or torrent Zered, takes its rise in the mountains of Moab, and, running from east to west, falls into the Dead Sea. It seems to be the stream which Burckhardt calls Wady Beni Hammad, south of the Modjeb or Arnon, and about five hours north of Kerek. __NANum/21/12\');">Num 21:12__AN; Zared.</TD></TR>';
stringArray[14] = 'And the space in which we came from __PNKadesh_barnea_1__SHKadeshbarnea</a>, until we were come over the brook Zered, [was] thirty and eight years; __PNuntil_all_the_generation_2__SHuntil all the generation</a> of the men of war were wasted out from among the host, as the LORD sware unto them.__CPKadesh_barnea_1__PSKadesh-barnea__FFDeu/1/2\');">Deu 1:2__NRDeu/1/19\');">19__NRDeu/1/46\');">46__NBNum/13/26\');">Num 13:26__AN__GHuntil_all_the_generation_2__PSuntil all the generation__EFDeu/1/34\');">Deu 1:34__NRDeu/1/35\');">35__NBNum/14/28\');">Num 14:28-35__NBNum/26/64\');">Num 26:64__NRNum/26/65\');">65__NBNum/32/11\');">Num 32:11__NBPsa/90/3\');">Psa 90:3__NRPsa/90/9\');">9__NBPsa/95/11\');">Psa 95:11__NBEze/20/15\');">Eze 20:15__NBHbr/3/8\');">Hbr 3:8-19__NBJud/1/5\');">Jud 1:5__EN';
stringArray[15] = 'For indeed __PNthe_hand_of_the_1__SHthe hand of the</a> LORD was against them, to destroy them from among the host, until they were consumed.__CPthe_hand_of_the_1__PSthe hand of the__FFJdg/2/15\');">Jdg 2:15__NB1Sa/5/6\');">1Sa 5:6__NR1Sa/5/9\');">9__NR1Sa/5/11\');">11__NB1Sa/7/13\');">1Sa 7:13__NBPsa/32/4\');">Psa 32:4__NBPsa/78/33\');">Psa 78:33__NBPsa/90/7\');">Psa 90:7-9__NBPsa/106/26\');">Psa 106:26__NBIsa/66/14\');">Isa 66:14__NB1Cr/10/5\');">1Cr 10:5__EN';

stringArray[17] = 'That the LORD spake unto me, saying,__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';

stringArray[19] = 'And [when] thou comest nigh over against the children of Ammon, distress them not, nor meddle with them: for I will not give thee of the land of the children of Ammon [any] possession; because I have given it unto the children of Lot [for] a possession.__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/2/5\');">Deu 2:5__NRDeu/2/9\');">9__NBGen/19/36\');">Gen 19:36-38__NBJdg/11/13\');">Jdg 11:13-27__NB2Ch/20/10\');">2Ch 20:10__EN';
stringArray[20] = '(That also was accounted a land of giants: giants dwelt therein in old time; and the Ammonites call them __PNZamzummims_1__SHZamzummims</a>;__CPZamzummims_1__PSZamzummims__FFGen/14/5\');">Gen 14:5__AN; Zuzims</TD></TR>';
stringArray[21] = 'A people __PNgreat_1__SHgreat</a>, and many, and tall, as the Anakims; __PNbut_the_LORD_2__SHbut the LORD</a> destroyed them before them; and they succeeded them, and dwelt in their stead:__CPgreat_1__PSgreat__FFDeu/2/10\');">Deu 2:10__NRDeu/2/11\');">11__NBDeu/1/28\');">Deu 1:28__NBDeu/3/11\');">Deu 3:11__AN__GHbut_the_LORD_2__PSbut the LORD__FEThese fragments of ancient history seem to be introduced to encourage the Israelites. If the LORD destroyed these gigantic people before the posterity of Lot and of Esau, what cause had the posterity of Abraham, Isaac, and Jacob, his chosen servants and friends, to fear the Anakims, or the Canaanites? especially as Israel acted by commission from God, and had his promise as their security of success, and the pledge of it in his presence, and the wonders which he had already wrought for them; and as they were the only nation of worshippers of the LORD, in the ordinances of his institution, which could be found on earth. This is so often repeated to possess the minds of the Israelites with a sense of God\'s providence, which rules every where; displacing one people, and placing another in their stead; and fixing their bounds also, which they cannot pass without his leave. __NADeu/2/22\');">Deu 2:22__NBJdg/11/24\');">Jdg 11:24__NBJer/27/7\');">Jer 27:7__NRJer/27/8\');">8__NBHab/1/10\');">Hab 1:10__NRHab/1/11\');">11__EN';
stringArray[22] = 'As he did to the children of __PNEsau_1__SHEsau</a>, which dwelt in Seir, when he destroyed __PNthe_Horims_2__SHthe Horims</a> from before them; and they succeeded them, and dwelt in their stead even unto this day:__CPEsau_1__PSEsau__FFGen/36/8\');">Gen 36:8__AN__GHthe_Horims_2__PSthe Horims__EFDeu/2/12\');">Deu 2:12__NBGen/14/6\');">Gen 14:6__NBGen/36/20\');">Gen 36:20-30__NB1Ch/1/38\');">1Ch 1:38-42__EN';
stringArray[23] = 'And __PNthe_Avims_1__SHthe Avims</a> which dwelt in Hazerim, [even] unto __PNAzzah_2__SHAzzah</a>, __PNthe_Caphtorims__which_came_3__SHthe Caphtorims, which came</a> forth out of Caphtor, destroyed them, and dwelt in their stead.)__CPthe_Avims_1__PSthe Avims__FFJos/13/3\');">Jos 13:3__AN; Avites.__GHAzzah_2__PSAzzah__EF1Ki/4/24\');">1Ki 4:24__NBJer/25/20\');">Jer 25:20__NBZep/2/4\');">Zep 2:4__NBZec/9/5\');">Zec 9:5__AN; Gaza.__GGthe_Caphtorims__which_came_3__PSthe Caphtorims, which came__FFGen/10/14\');">Gen 10:14__NBJer/47/4\');">Jer 47:4__NBAmo/9/7\');">Amo 9:7__NBAct/17/26\');">Act 17:26__EN';
stringArray[24] = 'Rise ye up, take your journey, and pass over __PNthe_river_Arnon_1__SHthe river Arnon</a>: __PNbehold_2__SHbehold</a>, I have given into thine hand Sihon the Amorite, king of Heshbon, and his land: __PNbegin_to_possess_it_3__SHbegin to possess [it]</a>, and contend with him in battle.__CPthe_river_Arnon_1__PSthe river Arnon__FFDeu/2/36\');">Deu 2:36__NBNum/21/13\');">Num 21:13-15__NBJdg/11/18\');">Jdg 11:18-21__AN__GHbehold_2__PSbehold__EFJos/6/16\');">Jos 6:16__NB2Ch/36/23\');">2Ch 36:23__NBEzr/1/2\');">Ezr 1:2__NBJer/27/5\');">Jer 27:5__NBEze/29/20\');">Eze 29:20__NBDan/2/38\');">Dan 2:38__NBDan/4/17\');">Dan 4:17__AN__GGbegin_to_possess_it_3__PSbegin to possess it__EEHeb. begin, possess.</TD></TR>';
stringArray[25] = 'This day will I begin to put the dread of thee and the fear of thee upon the nations [that are] under the whole heaven, who shall hear report of thee, and shall tremble, and be in anguish because of thee.__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/11/25\');">Deu 11:25__NBDeu/28/10\');">Deu 28:10__NBExd/15/14\');">Exd 15:14-16__NBExd/23/27\');">Exd 23:27__NBJos/2/9\');">Jos 2:9-12__NBJos/9/24\');">Jos 9:24__NB2Ki/7/6\');">2Ki 7:6__NR2Ki/7/7\');">7__NBPsa/105/38\');">Psa 105:38__NBJer/33/9\');">Jer 33:9__NBRev/3/9\');">Rev 3:9__EN';
stringArray[26] = 'And I sent messengers out of the wilderness of __PNKedemoth_1__SHKedemoth</a> unto Sihon king of Heshbon __PNwith_words_2__SHwith words</a> of peace, saying,__CPKedemoth_1__PSKedemoth__FFJos/13/18\');">Jos 13:18__NBJos/21/37\');">Jos 21:37__AN__GHwith_words_2__PSwith words__EFDeu/20/10\');">Deu 20:10__NRDeu/20/11\');">11__NBEst/9/30\');">Est 9:30__NBMat/10/12\');">Mat 10:12-15__NBLuk/10/5\');">Luk 10:5__NRLuk/10/6\');">6__NRLuk/10/10\');">10-12__EN';
stringArray[27] = 'Let me pass through thy land: I will go along by the high way, I will neither turn unto the right hand nor to the left.__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/2/6\');">Deu 2:6__NBNum/21/21\');">Num 21:21-23__NBJdg/11/19\');">Jdg 11:19__EN';

stringArray[29] = '(__PNAs_the_children_1__SHAs the children</a> of Esau which dwell in Seir, and the Moabites which dwell in Ar, did unto me;) until I shall pass over Jordan __PNinto_the_land_2__SHinto the land</a> which the LORD our God giveth us.__CPAs_the_children_1__PSAs the children__EEIt appears to have been only the Edomites of Kadesh-barnea, south of Canaan, who denied the Israelites a passage; for those of mount Seir, now called Shera, are here expressly said to have granted it them: and this, in fact, was the very road by which they arrived at Canaan. __NADeu/23/3\');">Deu 23:3__NRDeu/23/4\');">4__NBNum/20/18\');">Num 20:18__NBJdg/11/17\');">Jdg 11:17__NRJdg/11/18\');">18__AN__GHinto_the_land_2__PSinto the land__EFDeu/4/1\');">Deu 4:1__NRDeu/4/21\');">21__NRDeu/4/40\');">40__NBDeu/5/16\');">Deu 5:16__NBDeu/9/6\');">Deu 9:6__NBDeu/25/15\');">Deu 25:15__NBExd/20/12\');">Exd 20:12__NBJos/1/11\');">Jos 1:11-15__EN';
stringArray[30] = 'But Sihon king of Heshbon would not let us pass by him: __PNfor_the_LORD_1__SHfor the LORD</a> thy God hardened his spirit, and made his heart __PNobstinate_2__SHobstinate</a>, that he might deliver him into thy hand, as [appeareth] this day.__CPfor_the_LORD_1__PSfor the LORD__FFExd/4/21\');">Exd 4:21__NBExd/11/10\');">Exd 11:10__NBNum/21/23\');">Num 21:23__NBJos/11/19\');">Jos 11:19__NRJos/11/20\');">20__NBJdg/11/20\');">Jdg 11:20__NBRom/9/17\');">Rom 9:17-23__AN__GHobstinate_2__PSobstinate__EFIsa/48/4\');">Isa 48:4__EN';

stringArray[32] = 'Then Sihon came out against us, he and all his people, to fight at Jahaz.__CPRelated_Verses1_1__PSEntire Verse.__FFNum/21/23\');">Num 21:23-30__NBJdg/11/20\');">Jdg 11:20-23__NBNeh/9/22\');">Neh 9:22__NBPsa/120/7\');">Psa 120:7__NBPsa/135/11\');">Psa 135:11__NBPsa/136/19\');">Psa 136:19__EN';
stringArray[33] = 'And __PNthe_LORD_1__SHthe LORD</a> our God delivered him before us; and __PNwe_smote_2__SHwe smote</a> him, and his sons, and all his people.__CPthe_LORD_1__PSthe LORD__FFDeu/3/2\');">Deu 3:2__NRDeu/3/3\');">3__NBDeu/7/2\');">Deu 7:2__NBDeu/20/16\');">Deu 20:16__NBGen/14/20\');">Gen 14:20__NBJos/21/44\');">Jos 21:44__NBJdg/1/4\');">Jdg 1:4__NBJdg/7/2\');">Jdg 7:2__AN__GHwe_smote_2__PSwe smote__EFDeu/29/7\');">Deu 29:7__NRDeu/29/8\');">8__NBNum/21/24\');">Num 21:24__NBJos/10/30\');">Jos 10:30-42__EN';
