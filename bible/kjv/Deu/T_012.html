stringArray[31] = '__PNThou_1__SHThou</a> shalt not do so unto the LORD thy God: for every __PNabomination_to_the_2__SHabomination to the</a> LORD, which he hateth, have they done unto their gods; for even their sons and their daughters they have burnt in the fire to their gods.__CPThou_1__PSThou__FFDeu/12/4\');">Deu 12:4__NBDeu/18/9\');">Deu 18:9__NBExd/23/2\');">Exd 23:2__NBLev/18/3\');">Lev 18:3__NRLev/18/26\');">26-30__NB2Ki/17/15\');">2Ki 17:15-17__NB2Ki/21/2\');">2Ki 21:2__NB2Ch/33/2\');">2Ch 33:2__NB2Ch/36/14\');">2Ch 36:14__AN__GHabomination_to_the_2__PSabomination to the__FE"Heb. abomination of the. even their sons. The unnatural and horrid practice of offering human sacrifices not only existed, but universally prevailed among ancient nations. We have already (Note on __NALev/20/2\');">Lev 20:2__AN) referred to the custom among the Phoenicians and Carthaginians, descendants from the Canaanitish nations, of sacrificing their children to Moloch, or Saturn; and we will now cite a passage from Diodorus Siculus, (lib. xx.) which immediately precedes that already produced relative to this barbarous custom. He states that the Carthaginians imputed their being besieged by Agathocles to the anger of Saturn, because, instead of sacrificing the best of their own children, as formerly, they had sacrificed children bought for that purpose. ""In haste, therefore, to rectify their errors, they chose 200 of the noblest children, and publicly sacrificed them! Others, accused of irreligion, voluntarily gave themselves up, to the number of no less than 300!"" __NADeu/18/10\');">Deu 18:10__NBLev/18/21\');">Lev 18:21__NBLev/20/2\');">Lev 20:2__NBJer/7/31\');">Jer 7:31__NBJer/32/35\');">Jer 32:35__NBEze/20/31\');">Eze 20:31__AN;"</TD></TR>';
