Text[1] = 'Thou shalt not see thy brother\'s ox or his sheep go astray, and hide thyself from them: thou shalt in any case bring them again unto thy brother.';
Text[2] = 'And if thy brother [be] not nigh unto thee, or if thou know him not, then thou shalt bring it unto thine own house, and it shall be with thee until thy brother seek after it, and thou shalt restore it to him again.';
Text[3] = 'In like manner shalt thou do with his ass; and so shalt thou do with his raiment; and with all lost thing of thy brother\'s, which he hath lost, and thou hast found, shalt thou do likewise: thou mayest not hide thyself.';

Text[6] = 'If a bird\'s nest chance to be before thee in the way in any tree, or on the ground, [whether they be] young ones, or eggs, and the dam sitting upon the young, or upon the eggs, thou shalt not take the dam with the young:';
Text[7] = '[But] thou shalt in any wise let the dam go, and take the young to thee; that it may be well with thee, and [that] thou mayest prolong [thy] days.';
Text[8] = 'When thou buildest a new house, then thou shalt make a battlement for thy roof, that thou bring not blood upon thine house, if any man fall from thence.';
Text[9] = 'Thou shalt not sow thy vineyard with divers seeds: lest the fruit of thy seed which thou hast sown, and the fruit of thy vineyard, be defiled.';
Text[10] = 'Thou shalt not plow with an ox and an ass together.';
Text[11] = 'Thou shalt not wear a garment of divers sorts, [as] of woollen and linen together.';
Text[12] = 'Thou shalt make thee fringes upon the four quarters of thy vesture, wherewith thou coverest [thyself].';
Text[13] = 'If any man take a wife, and go in unto her, and hate her,';

Text[15] = 'Then shall the father of the damsel, and her mother, take and bring forth [the tokens of] the damsel\'s virginity unto the elders of the city in the gate:';
Text[16] = 'And the damsel\'s father shall say unto the elders, I gave my daughter unto this man to wife, and he hateth her;';
Text[17] = 'And, lo, he hath given occasions of speech [against her], saying, I found not thy daughter a maid; and yet these [are the tokens of] my daughter\'s virginity. And they shall spread the cloth before the elders of the city.';
Text[18] = 'And the elders of that city shall take that man and chastise him;';
Text[19] = 'And they shall amerce him in an hundred [shekels] of silver, and give [them] unto the father of the damsel, because he hath brought up an evil name upon a virgin of Israel: and she shall be his wife; he may not put her away all his days.';
Text[20] = 'But if this thing be true, [and the tokens of] virginity be not found for the damsel:';
Text[21] = 'Then they shall bring out the damsel to the door of her father\'s house, and the men of her city shall stone her with stones that she die: because she hath wrought folly in Israel, to play the whore in her father\'s house: so shalt thou put evil away from among you.';
Text[22] = 'If a man be found lying with a woman married to an husband, then they shall both of them die, [both] the man that lay with the woman, and the woman: so shalt thou put away evil from Israel.';
Text[23] = 'If a damsel [that is] a virgin be betrothed unto an husband, and a man find her in the city, and lie with her;';
Text[24] = 'Then ye shall bring them both out unto the gate of that city, and ye shall stone them with stones that they die; the damsel, because she cried not, [being] in the city; and the man, because he hath humbled his neighbour\'s wife: so thou shalt put away evil from among you.';
Text[25] = 'But if a man find a betrothed damsel in the field, and the man force her, and lie with her: then the man only that lay with her shall die:';
Text[26] = 'But unto the damsel thou shalt do nothing; [there is] in the damsel no sin [worthy] of death: for as when a man riseth against his neighbour, and slayeth him, even so [is] this matter:';
Text[27] = 'For he found her in the field, [and] the betrothed damsel cried, and [there was] none to save her.';
Text[28] = 'If a man find a damsel [that is] a virgin, which is not betrothed, and lay hold on her, and lie with her, and they be found;';
