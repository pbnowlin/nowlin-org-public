stringArray[14] = 'Thou __PNshalt_not_remove_1__SHshalt not remove</a> thy neighbour\'s landmark, which they of old time have set in thine inheritance, which thou shalt inherit in the land that the LORD thy God giveth thee to possess it.__CPshalt_not_remove_1__PSshalt not remove__EEBefore the extensive use of fences, landed property was marked out by stones or posts, set up so as to ascertain the divisions of family estates. It was easy to remove one of these landmarks, and set it in a different place; and thus a dishonest man might enlarge his own estate by contracting that of his neighbour. Hence it was a matter of considerable importance to prevent this crime among the Israelites; among whom, removing them would be equivalent to forging, altering, destroying, or concealing the title-deeds of an estate among us. Accordingly, by the Mosaic law, it was not only prohibited in the commandment against covetousness, but we find a particular curse expressly annexed to it in __NADeu/27/17\');">Deu 27:17__AN. Josephus considers this law a general prohibition, intended not only to protect private property, but also to preserve the boundaries of kingdoms and countries inviolable. __NADeu/27/17\');">Deu 27:17__NBJob/24/2\');">Job 24:2__NBPro/22/28\');">Pro 22:28__NBPro/23/10\');">Pro 23:10__NBHsa/5/10\');">Hsa 5:10__EN';
