stringArray[26] = 'For __PNwho_is_1__SHwho [is</a> there of] __PNall_flesh_2__SHall flesh</a>, that hath heard the voice of the __PNliving_3__SHliving</a> God speaking out of the midst of the fire, as we [have], and lived?__CPwho_is_1__PSwho is__EEIt seems to have been a general opinion, that if God appeared to men, it was for the purpose of destroying them. And indeed most of the extraordinary manifestations of God were in the way of judgment; but here it was widely different. God did appear in a sovereign and extraordinary manner; but it was for the instruction, direction, deliverance, and support of his people. 1. They heard this voice speaking with them in a distinct, articulate manner. 2. They saw the fire, the symbol of his presence, the appearances of which demonstrated it to be supernatural. 3. Notwithstanding God appeared so terrible, yet no person was destroyed; for he came not to destroy but to save. __NADeu/4/33\');">Deu 4:33__AN__GHall_flesh_2__PSall flesh__EFGen/6/12\');">Gen 6:12__NBIsa/40/6\');">Isa 40:6__NBRom/3/20\');">Rom 3:20__AN__GGliving_3__PSliving__FFJos/3/10\');">Jos 3:10__NBPsa/42/2\');">Psa 42:2__NBPsa/84/2\');">Psa 84:2__NBJer/10/10\');">Jer 10:10__NBDan/6/26\');">Dan 6:26__NBMat/26/63\');">Mat 26:63__NBAct/14/15\');">Act 14:15__NB2Cr/6/16\');">2Cr 6:16__NB1Th/1/9\');">1Th 1:9__EN';
