stringArray[5] = 'Only if thou carefully hearken unto the voice of the LORD thy God, to observe to do all these commandments which I command thee this day.__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/4/9\');">Deu 4:9__NBDeu/11/13\');">Deu 11:13-15__NBDeu/28/1\');">Deu 28:1-15__NBLev/26/3\');">Lev 26:3-14__NBJos/1/7\');">Jos 1:7__NBPsa/19/11\');">Psa 19:11__NBIsa/1/19\');">Isa 1:19__NRIsa/1/20\');">20__NBPhl/1/27\');">Phl 1:27__EN';

stringArray[7] = 'If __PNthere_be_1__SHthere be</a> among you a poor man of one of thy brethren within any of thy gates in thy land which the LORD thy God giveth thee, __PNthou_shalt_2__SHthou shalt</a> not harden thine heart, nor shut thine hand from thy poor brother:__CPthere_be_1__PSthere be__EELest the preceding law might render the Israelites cautious in lending to the poor, Moses here warns them against being led by so mean a principle; but to lend liberally, and God would reward them.__GHthou_shalt_2__PSthou shalt__EFDeu/15/9\');">Deu 15:9__NBPro/21/13\');">Pro 21:13__NBMat/18/30\');">Mat 18:30__NBJam/2/15\');">Jam 2:15__NRJam/2/16\');">16__NB1Jo/3/16\');">1Jo 3:16__NR1Jo/3/17\');">17__EN';

stringArray[11] = 'For __PNthe_poor_1__SHthe poor</a> shall never cease out of the land: therefore I command thee, saying, __PNThou_shalt_2__SHThou shalt</a> open thine hand wide unto thy brother, to thy poor, and to thy needy, in thy land.__CPthe_poor_1__PSthe poor__EEAlthough Moses, by the statutes relative to the division of the land, and inheritance, and the inalienable nature of it, had studied to prevent any Israelite from being born poor, yet he exhorts them to the exercise of the tenderest compassion and most benevolent actions; and not to refuse assistance to the decayed Israelite, though the sabbatical year drew nigh. __NAPro/22/2\');">Pro 22:2__NBMat/26/11\');">Mat 26:11__NBMar/14/7\');">Mar 14:7__NBJhn/12/8\');">Jhn 12:8__AN__GHThou_shalt_2__PSThou shalt__EFDeu/15/8\');">Deu 15:8__NBMat/5/42\');">Mat 5:42__NBLuk/12/33\');">Luk 12:33__NBAct/2/45\');">Act 2:45__NBAct/4/32\');">Act 4:32-35__NBAct/11/28\');">Act 11:28-30__NB2Cr/8/2\');">2Cr 8:2-9__NB1Jo/3/16\');">1Jo 3:16-18__EN';
stringArray[12] = '[And] if thy brother, an Hebrew man, or an Hebrew woman, be sold unto thee, and serve thee six years; then in the seventh year thou shalt let him go free from thee.__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/15/1\');">Deu 15:1__NBExd/21/2\');">Exd 21:2-6__NBLev/25/39\');">Lev 25:39-41__NBJer/34/14\');">Jer 34:14__NBJhn/8/35\');">Jhn 8:35__NRJhn/8/36\');">36__EN';
stringArray[13] = 'And when thou sendest him out free from thee, thou shalt not let him go away empty:__CPRelated_Verses1_1__PSEntire Verse.__EEThis is a most humane and merciful addition to the law in __NAExd/21/2\');">Exd 21:2-11__AN; enforced upon the Israelites by the consideration of their Egyptian bondage. As a faithful servant has made no property for himself while honestly serving his master, so now, when he quits his service, he has nothing to begin the world with except what the kindness of his master may bestow upon him as a remuneration for his zeal and fidelity. Though what was to be bestowed upon servants is not fixed, yet they were to be liberally supplied. (__NADeu/15/14\');">Deu 15:14__AN). __NAGen/31/42\');">Gen 31:42__NBExd/3/21\');">Exd 3:21__NBLev/25/42\');">Lev 25:42-44__NBPro/3/27\');">Pro 3:27__NRPro/3/28\');">28__NBJer/22/13\');">Jer 22:13__NBMal/3/5\');">Mal 3:5__NBCol/4/1\');">Col 4:1__EN';
stringArray[14] = 'Thou shalt furnish him liberally out of thy flock, and out of thy floor, and out of thy winepress: [of that] wherewith __PNthe_LORD_1__SHthe LORD</a> thy God hath blessed thee thou shalt give unto him.__CPthe_LORD_1__PSthe LORD__FFNeh/8/10\');">Neh 8:10__NBPsa/68/10\');">Psa 68:10__NBPro/10/22\');">Pro 10:22__NBAct/20/35\');">Act 20:35__NB1Cr/16/2\');">1Cr 16:2__EN';
stringArray[15] = 'And thou shalt remember that thou wast a bondman in the land of Egypt, and the LORD thy God redeemed thee: therefore I command thee this thing to day.__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/5/14\');">Deu 5:14__NRDeu/5/15\');">15__NBDeu/16/12\');">Deu 16:12__NBExd/20/2\');">Exd 20:2__NBIsa/51/1\');">Isa 51:1__NBMat/6/14\');">Mat 6:14__NRMat/6/15\');">15__NBMat/18/32\');">Mat 18:32__NRMat/18/33\');">33__NBEph/1/7\');">Eph 1:7__NBEph/2/12\');">Eph 2:12__NBEph/4/32\');">Eph 4:32__NBEph/5/1\');">Eph 5:1__NREph/5/2\');">2__NBTts/2/14\');">Tts 2:14__NB1Jo/3/16\');">1Jo 3:16__NB1Jo/4/9\');">1Jo 4:9-11__EN';
stringArray[16] = 'And it shall be, if he say unto thee, I will not go away from thee; because he loveth thee and thine house, because he is well with thee;__CPRelated_Verses1_1__PSEntire Verse.__FFExd/21/5\');">Exd 21:5__NRExd/21/6\');">6__NBPsa/40/6\');">Psa 40:6__NRPsa/40/8\');">8__EN';

stringArray[18] = 'It __PNshall_not_1__SHshall not</a> seem hard unto thee, when thou sendest him away free from thee; for he hath been worth __PNa_double_2__SHa double</a> hired servant [to thee], in serving thee six years: and the LORD thy God shall bless thee in all that thou doest.__CPshall_not_1__PSshall not__FFDeu/15/10\');">Deu 15:10__AN__GHa_double_2__PSa double__EFIsa/16/14\');">Isa 16:14__NBIsa/21/16\');">Isa 21:16__NBLuk/17/7\');">Luk 17:7__NRLuk/17/8\');">8__EN';
stringArray[19] = 'All __PNthe_firstling_1__SHthe firstling</a> males that come of thy herd and of thy flock thou shalt sanctify unto the LORD thy God: __PNthou_shalt_do_2__SHthou shalt do</a> no work with the firstling of thy bullock, nor shear the firstling of thy sheep.__CPthe_firstling_1__PSthe firstling__FFExd/13/2\');">Exd 13:2__NRExd/13/12\');">12__NBExd/34/19\');">Exd 34:19__NBLev/27/26\');">Lev 27:26__NBNum/3/13\');">Num 3:13__NBNum/18/17\');">Num 18:17__NBRom/8/29\');">Rom 8:29__NBHbr/12/23\');">Hbr 12:23__AN__GHthou_shalt_do_2__PSthou shalt do__EFDeu/12/5\');">Deu 12:5-7__NRDeu/12/17\');">17__NBDeu/14/23\');">Deu 14:23__NBDeu/16/11\');">Deu 16:11__NRDeu/16/14\');">14__NBNum/18/15\');">Num 18:15__EN';
stringArray[20] = 'Thou shalt eat [it] before the LORD thy God year by year in the place which the LORD shall choose, thou and thy household.__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/12/5\');">Deu 12:5-7__NRDeu/12/17\');">17__EN';
stringArray[21] = 'And if there be [any] blemish therein, [as if it be] lame, or blind, [or have] any ill blemish, thou shalt not sacrifice it unto the LORD thy God.__CPRelated_Verses1_1__PSEntire Verse.__FFDeu/17/1\');">Deu 17:1__NBLev/22/20\');">Lev 22:20__NRLev/22/24\');">24__NBMal/1/7\');">Mal 1:7__NRMal/1/8\');">8__EN';
stringArray[22] = 'Thou shalt eat it within thy gates: __PNthe_unclean_1__SHthe unclean</a> and the clean [person shall eat it] alike, as __PNthe_roe_buck_2__SHthe roebuck</a>, and as the hart.__CPthe_unclean_1__PSthe unclean__FFDeu/12/15\');">Deu 12:15__NRDeu/12/21\');">21__NRDeu/12/22\');">22__AN__GHthe_roe_buck_2__PSthe roe-buck__FETzevee, in Arabic zaby, Chaldee and Syriac tavya, denotes the gazelle or antelope, so called from its stately beauty, as the word imports. In size it is smaller than the roe, of an elegant form, and it motions are light and graceful. It bounds seemingly without effort, and runs with such swiftness that few creatures can exceed it. (__NA2Sa/2/18\');">2Sa 2:18__AN.) Its fine eyes are so much celebrated as even to become a proverb; and its flesh is much esteemed for food among eastern nations, having a sweet, musky taste, which is highly agreeable to their palates. (__NA1Ki/4/23\');">1Ki 4:23__AN.) If to these circumstances we add, that they are gregarious, and common all over the East, whereas the roe is either not known at all, or else very rare in these countries, little doubt can remain that the gazelle and not the roe is intended by the original word.</TD></TR>';
