Text[1] = 'And Moses with the elders of Israel commanded the people, saying, Keep all the commandments which I command you this day.';

Text[7] = 'And thou shalt offer peace offerings, and shalt eat there, and rejoice before the LORD thy God.';
Text[8] = 'And thou shalt write upon the stones all the words of this law very plainly.';
Text[9] = 'And Moses and the priests the Levites spake unto all Israel, saying, Take heed, and hearken, O Israel; this day thou art become the people of the LORD thy God.';
Text[10] = 'Thou shalt therefore obey the voice of the LORD thy God, and do his commandments and his statutes, which I command thee this day.';
Text[11] = 'And Moses charged the people the same day, saying,';
Text[12] = 'These shall stand upon mount Gerizim to bless the people, when ye are come over Jordan; Simeon, and Levi, and Judah, and Issachar, and Joseph, and Benjamin:';
Text[13] = 'And these shall stand upon mount Ebal to curse; Reuben, Gad, and Asher, and Zebulun, Dan, and Naphtali.';
Text[14] = 'And the Levites shall speak, and say unto all the men of Israel with a loud voice,';
Text[15] = 'Cursed [be] the man that maketh [any] graven or molten image, an abomination unto the LORD, the work of the hands of the craftsman, and putteth [it] in [a] secret [place]. And all the people shall answer and say, Amen.';
Text[16] = 'Cursed [be] he that setteth light by his father or his mother. And all the people shall say, Amen.';
Text[17] = 'Cursed [be] he that removeth his neighbour\'s landmark. And all the people shall say, Amen.';
Text[18] = 'Cursed [be] he that maketh the blind to wander out of the way. And all the people shall say, Amen.';
Text[19] = 'Cursed [be] he that perverteth the judgment of the stranger, fatherless, and widow. And all the people shall say, Amen.';
Text[20] = 'Cursed [be] he that lieth with his father\'s wife; because he uncovereth his father\'s skirt. And all the people shall say, Amen.';
Text[21] = 'Cursed [be] he that lieth with any manner of beast. And all the people shall say, Amen.';
Text[22] = 'Cursed [be] he that lieth with his sister, the daughter of his father, or the daughter of his mother. And all the people shall say, Amen.';
Text[23] = 'Cursed [be] he that lieth with his mother in law. And all the people shall say, Amen.';
Text[24] = 'Cursed [be] he that smiteth his neighbour secretly. And all the people shall say, Amen.';
Text[25] = 'Cursed [be] he that taketh reward to slay an innocent person. And all the people shall say, Amen.';
Text[26] = 'Cursed [be] he that confirmeth not [all] the words of this law to do them. And all the people shall say, Amen.';
