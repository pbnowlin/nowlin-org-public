stringArray[5] = 'The hart, and the roebuck, and the fallow deer, and __PNthe_wild_goat_1__SHthe wild goat</a>, and the pygarg, and __PNthe_wild_ox_2__SHthe wild ox</a>, and the chamois.__CPthe_wild_goat_1__PSthe wild goat__EEThe word akko, according to the LXX. and Vulgate, signifies the tragelephus, or goat-deer; so called from its resemblance to both species. Dr. Shaw states that an animal of this kind is found in the East, where it is called fishtûll, and lerwee.__GHthe_wild_ox_2__PSthe wild ox__FETheo, probably the oryx of the Greeks, a species of large stag; and the Bekkar el wash of Dr. Shaw.</TD></TR>';
stringArray[6] = 'And every beast that parteth the hoof, and cleaveth the cleft into two claws, [and] cheweth the cud among the beasts, that ye shall eat.__CPRelated_Verses1_1__PSEntire Verse.__FFPsa/1/1\');">Psa 1:1__NRPsa/1/2\');">2__NBPro/18/1\');">Pro 18:1__NB2Cr/6/17\');">2Cr 6:17__AN; On this verse remark, that the clean beast must both chew the cud and part the hoof: two distinct characteristics, or general signs, by which the possibility of error arising from the misinterpretation of names is obviated. When God directs, his commands are not of doubtful interpretation.</TD></TR>';

stringArray[27] = 'And __PNthe_Levite_1__SHthe Levite</a> that [is] within thy gates; thou shalt not forsake him; for __PNhe_hath_no_2__SHhe hath no</a> part nor inheritance with thee.__CPthe_Levite_1__PSthe Levite__FFDeu/14/29\');">Deu 14:29__NBDeu/12/12\');">Deu 12:12__NRDeu/12/18\');">18__NRDeu/12/19\');">19__NBGal/6/6\');">Gal 6:6__NB1Ti/5/17\');">1Ti 5:17__AN__GHhe_hath_no_2__PShe hath no__EFDeu/14/29\');">Deu 14:29__NBDeu/18/1\');">Deu 18:1__NRDeu/18/2\');">2__NBNum/18/20\');">Num 18:20__EN';
stringArray[28] = 'At __PNthe_end_1__SHthe end</a> of three years __PNthou_shalt_bring_2__SHthou shalt bring</a> forth all the tithe of thine increase the same year, and shalt lay [it] up within thy gates:__CPthe_end_1__PSthe end__FFDeu/14/22\');">Deu 14:22__NBDeu/26/12\');">Deu 26:12-15__NBAmo/4/4\');">Amo 4:4__AN__GHthou_shalt_bring_2__PSthou shalt bring__FEAs the Levites had no inheritance, the Israelites were not to forget them, but truly tithe their increase. For their support, the Levites had, 1. The tenth of all the productions of the land. 2. Forty-eight cities, each forming a square of 4,000 cubits. 3. Two thousand cubits of ground round each city; total of land, 53,000 acres. 4. The first-fruits, and certain parts of all the animals killed in the land. But though this was a very small proportion for a whole tribe that had consented to annihilate its political existence, that it might wait upon the service of God, yet, let it be considered, that what they possessed was the best of the land: and while it was slender remuneration for their services, yet their portion was such as rendered them independent, and kept them comfortable; so that they could wait on God, and labour in his work, without distraction.</TD></TR>';
