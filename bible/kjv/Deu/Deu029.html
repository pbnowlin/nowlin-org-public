Text[14] = 'Neither with you only do I make this covenant and this oath;';
Text[15] = 'But with [him] that standeth here with us this day before the LORD our God, and also with [him] that [is] not here with us this day:';
Text[16] = '(For ye know how we have dwelt in the land of Egypt; and how we came through the nations which ye passed by;';
Text[17] = 'And ye have seen their abominations, and their idols, wood and stone, silver and gold, which [were] among them:)';
Text[18] = 'Lest there should be among you man, or woman, or family, or tribe, whose heart turneth away this day from the LORD our God, to go [and] serve the gods of these nations; lest there should be among you a root that beareth gall and wormwood;';
