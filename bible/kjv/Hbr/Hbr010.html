Text[1] = 'For the law having a shadow of good things to come, [and] not the very image of the things, can never with those sacrifices which they offered year by year continually make the comers thereunto perfect.';
Text[2] = 'For then would they not have ceased to be offered? because that the worshippers once purged should have had no more conscience of sins.';
Text[3] = 'But in those [sacrifices there is] a remembrance again [made] of sins every year.';
Text[4] = 'For [it is] not possible that the blood of bulls and of goats should take away sins.';
Text[5] = 'Wherefore when he cometh into the world, he saith, Sacrifice and offering thou wouldest not, but a body hast thou prepared me:';
Text[6] = 'In burnt offerings and [sacrifices] for sin thou hast had no pleasure.';
Text[7] = 'Then said I, Lo, I come (in the volume of the book it is written of me,) to do thy will, O God.';
Text[8] = 'Above when he said, Sacrifice and offering and burnt offerings and [offering] for sin thou wouldest not, neither hadst pleasure [therein]; which are offered by the law;';
Text[9] = 'Then said he, Lo, I come to do thy will, O God. He taketh away the first, that he may establish the second.';
Text[10] = 'By the which will we are sanctified through the offering of the body of Jesus Christ once [for all].';
Text[11] = 'And every priest standeth daily ministering and offering oftentimes the same sacrifices, which can never take away sins:';
Text[12] = 'But this man, after he had offered one sacrifice for sins for ever, sat down on the right hand of God;';
Text[13] = 'From henceforth expecting till his enemies be made his footstool.';
Text[14] = 'For by one offering he hath perfected for ever them that are sanctified.';
Text[15] = '[Whereof] the Holy Ghost also is a witness to us: for after that he had said before,';
Text[16] = 'This [is] the covenant that I will make with them after those days, saith the Lord, I will put my laws into their hearts, and in their minds will I write them;';
Text[17] = 'And their sins and iniquities will I remember no more.';
Text[18] = 'Now where remission of these [is, there is] no more offering for sin.';
Text[19] = 'Having therefore, brethren, boldness to enter into the holiest by the blood of Jesus,';
Text[20] = 'By a new and living way, which he hath consecrated for us, through the veil, that is to say, his flesh;';
Text[21] = 'And [having] an high priest over the house of God;';
Text[22] = 'Let us draw near with a true heart in full assurance of faith, having our hearts sprinkled from an evil conscience, and our bodies washed with pure water.';
Text[23] = 'Let us hold fast the profession of [our] faith without wavering; (for he [is] faithful that promised;)';
Text[24] = 'And let us consider one another to provoke unto love and to good works:';
Text[25] = 'Not forsaking the assembling of ourselves together, as the manner of some [is]; but exhorting [one another]: and so much the more, as ye see the day approaching.';
Text[26] = 'For if we sin wilfully after that we have received the knowledge of the truth, there remaineth no more sacrifice for sins,';
Text[27] = 'But a certain fearful looking for of judgment and fiery indignation, which shall devour the adversaries.';
Text[28] = 'He that despised Moses\' law died without mercy under two or three witnesses:';
Text[29] = 'Of how much sorer punishment, suppose ye, shall he be thought worthy, who hath trodden under foot the Son of God, and hath counted the blood of the covenant, wherewith he was sanctified, an unholy thing, and hath done despite unto the Spirit of grace?';
Text[30] = 'For we know him that hath said, Vengeance [belongeth] unto me, I will recompense, saith the Lord. And again, The Lord shall judge his people.';
Text[31] = '[It is] a fearful thing to fall into the hands of the living God.';
Text[32] = 'But call to remembrance the former days, in which, after ye were illuminated, ye endured a great fight of afflictions;';
Text[33] = 'Partly, whilst ye were made a gazingstock both by reproaches and afflictions; and partly, whilst ye became companions of them that were so used.';
Text[34] = 'For ye had compassion of me in my bonds, and took joyfully the spoiling of your goods, knowing in yourselves that ye have in heaven a better and an enduring substance.';
