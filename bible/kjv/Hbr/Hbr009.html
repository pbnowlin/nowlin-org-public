Text[11] = 'But Christ being come an high priest of good things to come, by a greater and more perfect tabernacle, not made with hands, that is to say, not of this building;';

Text[13] = 'For if the blood of bulls and of goats, and the ashes of an heifer sprinkling the unclean, sanctifieth to the purifying of the flesh:';
Text[14] = 'How much more shall the blood of Christ, who through the eternal Spirit offered himself without spot to God, purge your conscience from dead works to serve the living God?';
Text[15] = 'And for this cause he is the mediator of the new testament, that by means of death, for the redemption of the transgressions [that were] under the first testament, they which are called might receive the promise of eternal inheritance.';
Text[16] = 'For where a testament [is], there must also of necessity be the death of the testator.';
Text[17] = 'For a testament [is] of force after men are dead: otherwise it is of no strength at all while the testator liveth.';
Text[18] = 'Whereupon neither the first [testament] was dedicated without blood.';

Text[22] = 'And almost all things are by the law purged with blood; and without shedding of blood is no remission.';
Text[23] = '[It was] therefore necessary that the patterns of things in the heavens should be purified with these; but the heavenly things themselves with better sacrifices than these.';
