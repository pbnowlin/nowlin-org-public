stringArray[6] = 'And the kinsman said, __PNI_cannot_1__SHI cannot</a> redeem [it] for myself, lest I mar mine own inheritance: redeem thou my right to thyself; for I cannot redeem [it].__CPI_cannot_1__PSI cannot__EE"The Targum seems to give the proper sense of this passage: ""I cannot redeem it, because I have a wife already; and it is not fit for me to bring another into my house, lest brawling and contention arise in it; and lest I hurt my own inheritance. Do thou redeem it, for thou has no wife; which hinders me from redeeming it."""</TD></TR>';
stringArray[7] = 'Now this [was the manner] in former time in Israel concerning redeeming and concerning changing, for to confirm all things; __PNa_man_plucked_off_1__SHa man plucked off</a> his shoe, and gave [it] to his neighbour: and this [was] a testimony in Israel.__CPa_man_plucked_off_1__PSa man plucked off__EE"This custom does not refer to the law about refusing to marry a brother\'s widow, but was usual in the transfer of inheritances: for this relative was not a brother, but simply a kinsman; and the shoe was not pulled off by Ruth, but by the kinsman himself. The Targumist, instead of his shoe, renders ""his right hand glove,"" it probably being the custom, in his time, to give that instead of a shoe. Jarchi says, ""When we purchase any thing new, it is customary to give, instead of a shoe, a handkerchief or veil."" __NADeu/25/7\');">Deu 25:7-10__AN"</TD></TR>';
