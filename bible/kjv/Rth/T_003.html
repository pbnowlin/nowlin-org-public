<script type="text/javascript">
var stringArray = new Array();
stringArray[1] = 'Then Naomi her mother in law said unto her, My daughter, __PNshall_I_not_1__SHshall I not</a> seek rest for thee, that it __PNmay_be_2__SHmay be</a> well with thee?__CPshall_I_not_1__PSshall I not__FFRth/1/9\');">Rth 1:9__NB1Cr/7/36\');">1Cr 7:36__NB1Ti/5/8\');">1Ti 5:8__NR1Ti/5/14\');">14__AN__GHmay_be_2__PSmay be__EFGen/40/14\');">Gen 40:14__NBDeu/4/40\');">Deu 4:40__NBPsa/128/2\');">Psa 128:2__NBJer/22/15\');">Jer 22:15__NRJer/22/16\');">16__EN';
stringArray[2] = 'And now __PNis_not_Boaz_1__SH[is] not Boaz</a> of our kindred, __PNwith_whose_2__SHwith whose</a> maidens thou wast? Behold, __PNhe_winnoweth_3__SHhe winnoweth</a> barley to night in the threshingfloor.__CPis_not_Boaz_1__PSis not Boaz__FFRth/2/20\');">Rth 2:20-23__NBDeu/25/5\');">Deu 25:5__NRDeu/25/6\');">6__NBHbr/2/11\');">Hbr 2:11-14__AN__GHwith_whose_2__PSwith whose__EFRth/2/8\');">Rth 2:8__NRRth/2/23\');">23__AN__GGhe_winnoweth_3__PShe winnoweth__EEIt is probable that the winnowing of grain was effected by taking up a portion of the corn in a sieve, and letting it down slowly in the wind; thus the grain would, by its own weight, fall in one place, while the chaff, etc., would be carried a distance by the wind. It is said here that this was done at night; probably what was threshed out in the day was winnowed in the evening, when the sea breeze set in, which was common in Palestine.</TD></TR>';
stringArray[3] = 'Wash thyself therefore, and __PNanoint_thee_1__SHanoint thee</a>, and __PNput_thy_2__SHput thy</a> raiment upon thee, and get thee down to the floor: [but] make not thyself known unto the man, until he shall have done eating and drinking.__CPanoint_thee_1__PSanoint thee__FF2Sa/14/2\');">2Sa 14:2__NBPsa/104/15\');">Psa 104:15__NBEcc/9/8\');">Ecc 9:8__NBMat/6/17\');">Mat 6:17__AN__GHput_thy_2__PSput thy__EFEst/5/1\');">Est 5:1__NB1Ti/2/9\');">1Ti 2:9__NR1Ti/2/10\');">10__EN';
stringArray[4] = 'And it shall be, when he lieth down, that thou shalt mark the place where he shall lie, and thou shalt go in, and __PNuncover_his_feet_1__SHuncover his feet</a>, and lay thee down; and he will tell thee what thou shalt do.__CPuncover_his_feet_1__PSuncover his feet__EEor, lift up the clothes that are on his feet. __NA1Th/5/22\');">1Th 5:22__EN';
stringArray[5] = 'And she said unto her, All that thou sayest unto me I will do.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[6] = 'And she went down unto the floor, __PNand_did_1__SHand did</a> according to all that her mother in law bade her.__CPand_did_1__PSand did__FFExd/20/12\');">Exd 20:12__NBPro/1/8\');">Pro 1:8__NBJhn/2/5\');">Jhn 2:5__NBJhn/15/14\');">Jhn 15:14__EN';
stringArray[7] = 'And when Boaz had eaten and drunk, and __PNhis_heart_1__SHhis heart</a> was merry, he __PNwent_to_lie_2__SHwent to lie</a> down at the end of the heap of corn: and she came softly, and uncovered his feet, and laid her down.__CPhis_heart_1__PShis heart__FFGen/43/34\');">Gen 43:34__NBJdg/16/25\');">Jdg 16:25__NBJdg/19/6\');">Jdg 19:6__NRJdg/19/9\');">9__NRJdg/19/22\');">22__NB2Sa/13/28\');">2Sa 13:28__NBEst/1/10\');">Est 1:10__NBPsa/104/15\');">Psa 104:15__NBEcc/2/24\');">Ecc 2:24__NBEcc/3/12\');">Ecc 3:12__NREcc/3/13\');">13__NBEcc/8/15\');">Ecc 8:15__NBEcc/9/7\');">Ecc 9:7__NBEcc/10/19\');">Ecc 10:19__NB1Cr/10/31\');">1Cr 10:31__NBEph/5/18\');">Eph 5:18__AN__GHwent_to_lie_2__PSwent to lie__FESuch was the simplicity of those early times, that the most wealthy persons looked after their own affairs, both at home and in the field. These threshing-floors were covered at top to keep off the rain, but lay open on all sides, that the wind might come in freely, for winnowing the corn; which being done, it is probable they were shut up at night, with doors fitted to them, that if any one lay there he might be kept warm, and the corn be secured from robbers.</TD></TR>';
stringArray[8] = 'And it came to pass at midnight, that the man was afraid, and turned himself: and, behold, a woman lay at his feet.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[9] = 'And he said, Who [art] thou? And she answered, I [am] __PNRuth_1__SHRuth</a> thine handmaid: __PNspread_therefore_2__SHspread therefore</a> thy skirt over thine handmaid; for thou [art] __PNa_near_kinsman_3__SHa near kinsman</a>.__CPRuth_1__PSRuth__FFRth/2/10\');">Rth 2:10-13__NB1Sa/25/41\');">1Sa 25:41__NBLuk/14/11\');">Luk 14:11__AN__GHspread_therefore_2__PSspread therefore__FE"Hebrew ""spread thy wing;"" the emblem of protection; and a metaphor taken from the young of fowls, which run under the wings of their mother from birds of prey. Even to the present day, when a Jew marries a woman, he throws the skirts of his talith over her, to signify that he has taken her under his protection. __NAEze/16/8\');">Eze 16:8__AN"__GGa_near_kinsman_3__PSa near kinsman__EEor, one that has right to redeem. __NARth/3/12\');">Rth 3:12__NBRth/2/20\');">Rth 2:20__EN';
stringArray[10] = 'And he said, __PNBlessed_1__SHBlessed</a> [be] thou of the LORD, my daughter: [for] thou hast shewed more kindness in the latter end than __PNat_the_beginning_2__SHat the beginning</a>, inasmuch as thou followedst not young men, whether poor or rich.__CPBlessed_1__PSBlessed__FFRth/2/4\');">Rth 2:4__NRRth/2/20\');">20__NB1Cr/13/4\');">1Cr 13:4__NR1Cr/13/5\');">5__AN__GHat_the_beginning_2__PSat the beginning__EFRth/1/8\');">Rth 1:8__EN';
stringArray[11] = 'And now, my daughter, fear not; I will do to thee all that thou requirest: for all the __PNcity_1__SHcity</a> of my people doth know that thou [art] a virtuous woman.__CPcity_1__PScity__EEHeb. gate. __NAPro/12/4\');">Pro 12:4__NBPro/31/10\');">Pro 31:10__NRPro/31/29\');">29-31__EN';
stringArray[12] = 'And now it is true that I [am thy] near kinsman: howbeit __PNthere_is_1__SHthere is</a> a kinsman nearer than I.__CPthere_is_1__PSthere is__FFRth/4/1\');">Rth 4:1__NBMat/7/12\');">Mat 7:12__NB1Th/4/6\');">1Th 4:6__EN';
stringArray[13] = 'Tarry this night, and it shall be in the morning, [that] __PNif_he_will_1__SHif he will</a> perform unto thee the part of a kinsman, well; let him do the kinsman\'s part: but if he will not do the part of a kinsman to thee, then will I do the part of a kinsman to thee, [as] __PNthe_LORD_liveth_2__SHthe LORD liveth</a>: lie down until the morning.__CPif_he_will_1__PSif he will__FFRth/2/20\');">Rth 2:20__NBRth/4/5\');">Rth 4:5__NBDeu/25/5\');">Deu 25:5-9__NBMat/22/24\');">Mat 22:24-27__AN__GHthe_LORD_liveth_2__PSthe LORD liveth__EFJdg/8/19\');">Jdg 8:19__NBJer/4/2\');">Jer 4:2__NB2Cr/1/23\');">2Cr 1:23__NBHbr/6/16\');">Hbr 6:16__EN';
stringArray[14] = 'And she lay at his feet until the morning: and she rose up before one could know another. And he said, __PNLet_it_not_1__SHLet it not</a> be known that a woman came into the floor.__CPLet_it_not_1__PSLet it not__FFEcc/7/1\');">Ecc 7:1__NBRom/12/17\');">Rom 12:17__NBRom/14/16\');">Rom 14:16__NB1Cr/10/32\');">1Cr 10:32__NB2Cr/8/21\');">2Cr 8:21__NB1Th/5/22\');">1Th 5:22__NB1Pe/2/12\');">1Pe 2:12__EN';
stringArray[15] = 'Also he said, Bring the __PNvail_1__SHvail</a> that [thou hast] upon thee, and hold it. And when she held it, __PNhe_measured_2__SHhe measured</a> __PNsix_measures_3__SHsix [measures]</a> of barley, and laid [it] on her: and she went into the city.__CPvail_1__PSvail__EEor sheet, or apron. The word mitpachath has been variously rendered. The LXX. translate it [ ] an apron, and Vulgate, pallium, a cloak. By the circumstances of the story, it must have been of a considerable size; and accordingly Dr. Shaw thinks it was no other than the hyke, the finer sort of which, such as are still worn by ladies and persons of distinction among the Arabs, he takes to answer to the [ ] or robe, of the ancient Greeks.__GHhe_measured_2__PShe measured__EFIsa/32/8\');">Isa 32:8__NBGal/6/10\');">Gal 6:10__AN__GGsix_measures_3__PSsix measures__EE"The quantity of this barley is uncertain. The Targum renders it, shith sein, ""six seahs."" A seah contained about two gallons and a half, six of which must have been a very heavy load for a woman, and so the Targumist thought, for he adds, ""And she received strength from the LORD to carry it."""</TD></TR>';
stringArray[16] = 'And when she came to her mother in law, she said, __PNWho_art_thou_1__SHWho [art] thou</a>, my daughter? And she told her all that the man had done to her.__CPWho_art_thou_1__PSWho art thou__EE"Or, as the Vulgate renders, Quid egisti filia? ""What hast thou done, my daughter?"""</TD></TR>';
stringArray[17] = 'And she said, These six [measures] of barley gave he me; for he said to me, Go not empty unto thy mother in law.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[18] = 'Then said she, __PNSit_still_1__SHSit still</a>, my daughter, until thou know how the matter will fall: for the man will not be in rest, until he have finished the thing this day.__CPSit_still_1__PSSit still__FFPsa/37/3\');">Psa 37:3-5__NBIsa/28/16\');">Isa 28:16__NBIsa/30/7\');">Isa 30:7__EN';

</script>
