stringArray[1] = 'Now when Festus was come __PNinto_1__SHinto</a> __PNthe_province_2__SHthe province</a>, after three days __PNhe_3__SHhe</a> ascended from Caesarea to Jerusalem.__CPinto_1__PSinto__FFAct/23/34\');">Act 23:34__AN__GHthe_province_2__PSthe province__FEBy the province, Judea is meant; for after the death of Herod Agrippa, Claudius thought it imprudent to trust the government in the hands of his son Agrippa, who was then but seventeen years of age; and therefore, Cuspius Fadus was sent to be procurator. And when afterwards Claudius had given to Agrippa the tetrarchy of Philip, he nevertheless kept the province of Judea in his own hands, and governed it by procurators sent from Rome.__GGhe_3__PShe__FFAct/25/5\');">Act 25:5__NBAct/18/22\');">Act 18:22__NBAct/21/15\');">Act 21:15__EN';

stringArray[3] = 'And __PNdesired_1__SHdesired</a> favour against him, that he would send for him to Jerusalem, __PNlaying_2__SHlaying</a> wait in the way to kill him.__CPdesired_1__PSdesired__FFAct/9/2\');">Act 9:2__NB1Sa/23/19\');">1Sa 23:19-21__NBJer/38/4\');">Jer 38:4__NBMar/6/23\');">Mar 6:23-25__NBLuk/23/8\');">Luk 23:8-24__AN__GHlaying_2__PSlaying__EFAct/23/12\');">Act 23:12-15__NBAct/26/9\');">Act 26:9-11__NBPsa/37/32\');">Psa 37:32__NRPsa/37/33\');">33__NBPsa/64/2\');">Psa 64:2-6__NBPsa/140/1\');">Psa 140:1-5__NBJer/18/18\');">Jer 18:18__NBJhn/16/3\');">Jhn 16:3__NBRom/3/8\');">Rom 3:8__EN';
stringArray[4] = 'But Festus answered, that Paul should be kept at Caesarea, and that he himself would depart shortly [thither].__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[5] = 'Let __PNthem_1__SHthem</a> therefore, said he, which among you are able, go down with [me], and accuse this man, __PNif_2__SHif</a> there be any wickedness in him.__CPthem_1__PSthem__FFAct/25/16\');">Act 25:16__NBAct/23/30\');">Act 23:30__NBAct/24/8\');">Act 24:8__AN__GHif_2__PSif__EFAct/25/18\');">Act 25:18__NRAct/25/19\');">19__NRAct/25/25\');">25__NBAct/18/14\');">Act 18:14__NB1Sa/24/11\');">1Sa 24:11__NR1Sa/24/12\');">12__NBPsa/7/3\');">Psa 7:3-5__NBJhn/18/29\');">Jhn 18:29__NRJhn/18/30\');">30__EN';
stringArray[6] = 'And when he had tarried among them __PNmore_than_ten_days_1__SHmore than ten days</a>, he went down unto Caesarea; and the next day __PNsitting_2__SHsitting</a> on the judgment seat commanded Paul to be brought.__CPmore_than_ten_days_1__PSmore than ten days__EEor, as some copies read no more than eight or ten days__GHsitting_2__PSsitting__EFAct/25/10\');">Act 25:10__NRAct/25/17\');">17__NBAct/18/12\');">Act 18:12-17__NBMat/27/19\');">Mat 27:19__NBJhn/19/13\');">Jhn 19:13__NB2Cr/5/10\');">2Cr 5:10__NBJam/2/6\');">Jam 2:6__EN';
stringArray[7] = 'And when he was come, the Jews which came down from Jerusalem stood round about, __PNand_laid_1__SHand laid</a> many and grievous complaints against Paul, which they could not prove.__CPand_laid_1__PSand laid__FFAct/25/24\');">Act 25:24__NBAct/21/28\');">Act 21:28__NBAct/24/5\');">Act 24:5__NRAct/24/6\');">6__NRAct/24/13\');">13__NBEzr/4/15\');">Ezr 4:15__NBEst/3/8\');">Est 3:8__NBPsa/27/12\');">Psa 27:12__NBPsa/35/11\');">Psa 35:11__NBMat/5/11\');">Mat 5:11__NRMat/5/12\');">12__NBMat/26/60\');">Mat 26:60-62__NBMar/15/3\');">Mar 15:3__NRMar/15/4\');">4__NBLuk/23/2\');">Luk 23:2__NRLuk/23/10\');">10__NB1Pe/4/14\');">1Pe 4:14-16__EN';
stringArray[8] = 'While he answered for himself, __PNNeither_1__SHNeither</a> against the law of the Jews, neither against the temple, nor yet against Caesar, have I offended any thing at all.__CPNeither_1__PSNeither__FFAct/25/10\');">Act 25:10__NBAct/6/13\');">Act 6:13__NRAct/6/14\');">14__NBAct/23/1\');">Act 23:1__NBAct/24/6\');">Act 24:6__NRAct/24/12\');">12__NRAct/24/17\');">17-21__NBAct/28/17\');">Act 28:17__NRAct/28/21\');">21__NBGen/40/15\');">Gen 40:15__NBJer/37/18\');">Jer 37:18__NBDan/6/22\');">Dan 6:22__NB2Cr/1/12\');">2Cr 1:12__EN';
stringArray[9] = 'But Festus, __PNwilling_1__SHwilling</a> to do the Jews a pleasure, answered Paul, and said, Wilt thou go up to Jerusalem, and there be judged of these things before me?__CPwilling_1__PSwilling__FFAct/25/3\');">Act 25:3__NRAct/25/20\');">20__NBAct/12/3\');">Act 12:3__NBAct/24/27\');">Act 24:27__NBMar/15/15\');">Mar 15:15__EN';
stringArray[10] = 'Then said Paul, __PNI_stand_1__SHI stand</a> at Caesar\'s judgment seat, where I ought to be judged: to the Jews have I done no wrong, __PNas_thou_2__SHas thou</a> very well knowest.__CPI_stand_1__PSI stand__EEEvery procurator represented the emperor in the province over which he presided; and as the seat of government was at Cesarea, St. Paul was before the tribunal where, as a Roman citizen, he ought to be judged. __NAAct/16/37\');">Act 16:37__NRAct/16/38\');">38__NBAct/22/25\');">Act 22:25-28__AN__GHas_thou_2__PSas thou__EFAct/25/25\');">Act 25:25__NBAct/23/29\');">Act 23:29__NBAct/26/31\');">Act 26:31__NBAct/28/18\');">Act 28:18__NBMat/27/18\');">Mat 27:18__NRMat/27/23\');">23__NRMat/27/24\');">24__NB2Cr/4/2\');">2Cr 4:2__EN';
stringArray[11] = 'For __PNif_I_1__SHif I</a> be an offender, or have committed any thing worthy of death, I refuse not to die: but if there be none of these things whereof these accuse me, __PNno_man_2__SHno man</a> may deliver me unto them. __PNI_appeal_3__SHI appeal</a> unto Caesar.__CPif_I_1__PSif I__FFAct/18/14\');">Act 18:14__NBJos/22/22\');">Jos 22:22__NB1Sa/12/3\');">1Sa 12:3-5__NBJob/31/21\');">Job 31:21__NRJob/31/38\');">38-40__NBPsa/7/3\');">Psa 7:3-5__AN__GHno_man_2__PSno man__EFAct/16/37\');">Act 16:37__NBAct/22/25\');">Act 22:25__NB1Th/2/15\');">1Th 2:15__AN__GGI_appeal_3__PSI appeal__EEAn appeal to the emperor was the right of a Roman citizen, and was highly respected. The Julian law condemned those magistrates, and others, as violaters of the public peace, who had put to death, tortured, scourged, imprisoned, or condemned any Roman citizen who had appealed to Cesar. This law was so sacred and imperative, that, in the persecution under Trajan, Pliny would not attempt to put to death Roman citizens, who were proved to have turned Christians, but determined to send them to Rome, probably because they had appealed. __NAAct/25/10\');">Act 25:10__NRAct/25/25\');">25__NBAct/26/32\');">Act 26:32__NBAct/28/19\');">Act 28:19__NB1Sa/27/1\');">1Sa 27:1__EN';
stringArray[12] = 'Then Festus, when he had conferred with the council, answered, Hast thou appealed unto Caesar? __PNunto_Caesar_shalt_1__SHunto Caesar shalt</a> thou go.__CPunto_Caesar_shalt_1__PSunto Caesar shalt__FFAct/25/21\');">Act 25:21__NBAct/19/21\');">Act 19:21__NBAct/23/11\');">Act 23:11__NBAct/26/32\');">Act 26:32__NBAct/27/1\');">Act 27:1__NBAct/28/16\');">Act 28:16__NBPsa/76/10\');">Psa 76:10__NBIsa/46/10\');">Isa 46:10__NRIsa/46/11\');">11__NBLam/3/37\');">Lam 3:37__NBDan/4/35\');">Dan 4:35__NBRom/15/28\');">Rom 15:28__NRRom/15/29\');">29__NBPhl/1/12\');">Phl 1:12-14__NRPhl/1/20\');">20__EN';
stringArray[13] = 'And after certain days __PNking_1__SHking</a> Agrippa and Bernice came unto Caesarea __PNto_2__SHto</a> salute Festus.__CPking_1__PSking__FFAct/25/22\');">Act 25:22__NRAct/25/23\');">23__NBAct/26/1\');">Act 26:1__NRAct/26/27\');">27__NRAct/26/28\');">28__AN__GHto_2__PSto__EF1Sa/13/10\');">1Sa 13:10__NB1Sa/25/14\');">1Sa 25:14__NB2Sa/8/10\');">2Sa 8:10__NB2Ki/10/13\');">2Ki 10:13__NBMar/15/18\');">Mar 15:18__EN';
stringArray[14] = 'And when they had been there many days, Festus declared Paul\'s cause unto the king, saying, __PNThere_1__SHThere</a> is a certain man left in bonds by Felix:__CPThere_1__PSThere__FFAct/24/27\');">Act 24:27__EN';
stringArray[15] = 'About whom, __PNwhen_1__SHwhen</a> I was at Jerusalem, the chief priests and the elders of the Jews informed [me], desiring [to have] judgment against him.__CPwhen_1__PSwhen__FFAct/25/1\');">Act 25:1-3__NBEst/3/9\');">Est 3:9__NBLuk/18/3\');">Luk 18:3-5__NBLuk/23/23\');">Luk 23:23__EN';
stringArray[16] = 'To whom I answered, __PNIt_is_not_1__SHIt is not</a> the manner of the Romans to deliver any man to die, before that he which is accused have the accusers face to face, __PNand_have_2__SHand have</a> licence to answer for himself concerning the crime laid against him.__CPIt_is_not_1__PSIt is not__FFAct/25/4\');">Act 25:4__NRAct/25/5\');">5__AN__GHand_have_2__PSand have__EFAct/26/1\');">Act 26:1__NBDeu/17/4\');">Deu 17:4__NBDeu/19/17\');">Deu 19:17__NRDeu/19/18\');">18__NBPro/18/13\');">Pro 18:13__NRPro/18/17\');">17__NBJhn/7/51\');">Jhn 7:51__EN';
stringArray[17] = 'Therefore, when they were come hither, __PNwithout_1__SHwithout</a> any delay on the morrow I sat on the judgment seat, and commanded the man to be brought forth.__CPwithout_1__PSwithout__FFAct/25/6\');">Act 25:6__AN.</TD></TR>';
stringArray[18] = 'Against whom when the accusers stood up, they brought none accusation of such things as I supposed:__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[19] = 'But had __PNcertain_1__SHcertain</a> questions against him of their own __PNsuperstition_2__SHsuperstition</a>, and of one Jesus, __PNwhich_3__SHwhich</a> was dead, whom Paul affirmed to be alive.__CPcertain_1__PScertain__FFAct/25/7\');">Act 25:7__NBAct/18/15\');">Act 18:15__NRAct/18/19\');">19__NBAct/23/29\');">Act 23:29__AN__GHsuperstition_2__PSsuperstition__EFAct/17/22\');">Act 17:22__NRAct/17/23\');">23__AN__GGwhich_3__PSwhich__FFAct/1/22\');">Act 1:22__NBAct/2/32\');">Act 2:32__NBAct/17/31\');">Act 17:31__NBAct/26/22\');">Act 26:22__NRAct/26/23\');">23__NB1Cr/15/3\');">1Cr 15:3__NR1Cr/15/4\');">4__NR1Cr/15/14\');">14-20__NBRev/1/18\');">Rev 1:18__EN';
stringArray[20] = 'And because I __PNdoubted_of_such_manner_of_questions_1__SHdoubted of such manner of questions</a>, __PNI_asked_2__SHI asked</a> [him] whether he would go to Jerusalem, and there be judged of these matters.__CPdoubted_of_such_manner_of_questions_1__PSdoubted of such manner of questions__EEor, was doubtful how to enquire hereof, etc.__GHI_asked_2__PSI asked__FESee on __NAAct/25/9\');">Act 25:9__AN.</TD></TR>';
stringArray[21] = 'But when Paul __PNhad_1__SHhad</a> appealed to be reserved unto the __PNhearing_2__SHhearing</a> of __PNAugustus_3__SHAugustus</a>, __PNI_commanded_4__SHI commanded</a> him to be kept till I might send him to Caesar.__CPhad_1__PShad__FFAct/25/10\');">Act 25:10__NBAct/26/32\');">Act 26:32__NB2Ti/4/16\');">2Ti 4:16__AN__GHhearing_2__PShearing__FEor, judgment__GGAugustus_3__PSAugustus__FFAct/27/1\');">Act 27:1__NBLuk/2/1\');">Luk 2:1__AN__GHI_commanded_4__PSI commanded__EFAct/25/12\');">Act 25:12__AN.</TD></TR>';
stringArray[22] = 'Then Agrippa said unto Festus, I would also hear the man myself. To morrow, said he, thou shalt hear him.__CPRelated_Verses1_1__PSEntire Verse.__FFAct/9/15\');">Act 9:15__NBIsa/52/15\');">Isa 52:15__NBMat/10/18\');">Mat 10:18__NBLuk/21/12\');">Luk 21:12__EN';
stringArray[23] = 'And on the morrow, when Agrippa was come, and Bernice, __PNwith_1__SHwith</a> great pomp, and was entered into the place of hearing, with the chief captains, and principal men of the city, __PNat_2__SHat</a> Festus\' commandment Paul was brought forth.__CPwith_1__PSwith__FFAct/12/21\');">Act 12:21__NBEst/1/4\');">Est 1:4__NBEcc/1/2\');">Ecc 1:2__NBIsa/5/14\');">Isa 5:14__NBIsa/14/11\');">Isa 14:11__NBEze/7/24\');">Eze 7:24__NBEze/30/18\');">Eze 30:18__NBEze/32/12\');">Eze 32:12__NBEze/33/28\');">Eze 33:28__NBDan/4/30\');">Dan 4:30__NB1Cr/7/31\');">1Cr 7:31__NBJam/1/11\');">Jam 1:11__NB1Pe/1/24\');">1Pe 1:24__NB1Jo/2/16\');">1Jo 2:16__AN__GHat_2__PSat__EFAct/9/15\');">Act 9:15__EN';
stringArray[24] = 'And Festus said, __PNKing_Agrippa_1__SHKing Agrippa</a>, and all men which are here present with us, ye see this man, __PNabout_2__SHabout</a> whom all the multitude of the Jews have dealt with me, both at Jerusalem, and [also] here, crying __PNthat_he_3__SHthat he</a> ought not to live any longer.__CPKing_Agrippa_1__PSKing Agrippa__EEKing Agrippa was the son of Herod Agrippa; who upon the death of his uncle Herod, king of Chalcis, A.D. 28, succeeded to his dominions, by the favour of the emperor Claudius. Four years afterwards, Claudius removed him from that kingdom to a larger one; giving him the tetrarchy of Philip, that of Lysanias, and the province which Varus governed. Nero afterwards added Julias in Peraea, Tarichaea, and Tiberias. Claudius gave him the power of appointing the high priest among the Jews; and instances of his exercising this power may be seen in Josephus. He was strongly attached to the Romans, and did every thing in his power to prevent the Jews from rebelling; and when he could not prevail, he united his troops to those of Titus, and assisted at the siege of Jerusalem. After the ruin of his country, he retired with his sister Berenice to Rome where he died, aged 70, about A.D. 90.__GHabout_2__PSabout__EFAct/25/2\');">Act 25:2__NRAct/25/3\');">3__NRAct/25/7\');">7__AN__GGthat_he_3__PSthat he__FFAct/22/22\');">Act 22:22__NBLuk/23/21\');">Luk 23:21-23__EN';
stringArray[25] = 'But when I found that he had __PNcommitted_1__SHcommitted</a> nothing worthy of death, __PNand_that_2__SHand that</a> he himself hath appealed to __PNAugustus_3__SHAugustus</a>, I have determined to send him.__CPcommitted_1__PScommitted__FFAct/23/9\');">Act 23:9__NRAct/23/29\');">29__NBAct/26/31\');">Act 26:31__NBLuk/23/4\');">Luk 23:4__NRLuk/23/14\');">14__NBJhn/18/38\');">Jhn 18:38__AN__GHand_that_2__PSand that__EFAct/25/11\');">Act 25:11__NRAct/25/12\');">12__AN__GGAugustus_3__PSAugustus__EEThe honourable title of [sebastos ( sebasto/v )] or Augustus, that is venerable or august, which was first conferred by the senate on Octavius Caesar, was afterwards assumed by succeeding Roman emperors.</TD></TR>';
stringArray[26] = 'Of whom I have no certain thing to write unto my lord. Wherefore I have brought him forth before you, and __PNspecially_1__SHspecially</a> before thee, O king Agrippa, that, after examination had, I might have somewhat to write.__CPspecially_1__PSspecially__FFAct/26/2\');">Act 26:2__NRAct/26/3\');">3__EN';
stringArray[27] = 'For it seemeth to me unreasonable to send a prisoner, and not withal to signify the crimes [laid] against him.__CPRelated_Verses1_1__PSEntire Verse.__FFPro/18/13\');">Pro 18:13__NBJhn/7/51\');">Jhn 7:51__EN';
