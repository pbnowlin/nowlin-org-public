Text[3] = 'I am verily a man [which am] a Jew, born in Tarsus, [a city] in Cilicia, yet brought up in this city at the feet of Gamaliel, [and] taught according to the perfect manner of the law of the fathers, and was zealous toward God, as ye all are this day.';

Text[7] = 'And I fell unto the ground, and heard a voice saying unto me, Saul, Saul, why persecutest thou me?';
Text[8] = 'And I answered, Who art thou, Lord? And he said unto me, I am Jesus of Nazareth, whom thou persecutest.';

Text[10] = 'And I said, What shall I do, Lord? And the Lord said unto me, Arise, and go into Damascus; and there it shall be told thee of all things which are appointed for thee to do.';
Text[11] = 'And when I could not see for the glory of that light, being led by the hand of them that were with me, I came into Damascus.';
Text[12] = 'And one Ananias, a devout man according to the law, having a good report of all the Jews which dwelt [there],';
Text[13] = 'Came unto me, and stood, and said unto me, Brother Saul, receive thy sight. And the same hour I looked up upon him.';
Text[14] = 'And he said, The God of our fathers hath chosen thee, that thou shouldest know his will, and see that Just One, and shouldest hear the voice of his mouth.';
Text[15] = 'For thou shalt be his witness unto all men of what thou hast seen and heard.';
Text[16] = 'And now why tarriest thou? arise, and be baptized, and wash away thy sins, calling on the name of the Lord.';
Text[17] = 'And it came to pass, that, when I was come again to Jerusalem, even while I prayed in the temple, I was in a trance;';
Text[18] = 'And saw him saying unto me, Make haste, and get thee quickly out of Jerusalem: for they will not receive thy testimony concerning me.';
Text[19] = 'And I said, Lord, they know that I imprisoned and beat in every synagogue them that believed on thee:';
Text[20] = 'And when the blood of thy martyr Stephen was shed, I also was standing by, and consenting unto his death, and kept the raiment of them that slew him.';
Text[21] = 'And he said unto me, Depart: for I will send thee far hence unto the Gentiles.';
