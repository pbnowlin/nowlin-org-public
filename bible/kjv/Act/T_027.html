var stringArray = new Array();
stringArray[1] = 'And __PNwhen_1__SHwhen</a> it was determined that we should sail into __PNItaly_2__SHItaly</a>, they delivered Paul and certain other prisoners unto [one] named Julius, __PNa_centurion_3__SHa centurion</a> of __PNAugustus__4__SHAugustus\'</a> band.__CPwhen_1__PSwhen__FFAct/19/21\');">Act 19:21__NBAct/23/11\');">Act 23:11__NBAct/25/12\');">Act 25:12__NRAct/25/25\');">25__NBGen/50/20\');">Gen 50:20__NBPsa/33/11\');">Psa 33:11__NBPsa/76/10\');">Psa 76:10__NBPro/19/21\');">Pro 19:21__NBLam/3/27\');">Lam 3:27__NBDan/4/35\');">Dan 4:35__NBRom/15/22\');">Rom 15:22-29__AN__GHItaly_2__PSItaly__FEItaly is a well-known country of Europe, bounded by the Adriatic or Venetian Gulf on the east, the Tyrrhene or Tuscan Sea on the west, and by the Alps on the north. __NAAct/10/1\');">Act 10:1__NBAct/18/2\');">Act 18:2__NBHbr/13/24\');">Hbr 13:24__AN__GGa_centurion_3__PSa centurion__FFAct/27/11\');">Act 27:11__NRAct/27/43\');">43__NBAct/10/22\');">Act 10:22__NBAct/21/32\');">Act 21:32__NBAct/22/26\');">Act 22:26__NBAct/23/17\');">Act 23:17__NBAct/24/23\');">Act 24:23__NBAct/28/16\');">Act 28:16__NBMat/8/5\');">Mat 8:5-10__NBMat/27/54\');">Mat 27:54__NBLuk/7/2\');">Luk 7:2__NBLuk/23/47\');">Luk 23:47__AN__GHAugustus__4__PSAugustus\'__EFAct/25/25\');">Act 25:25__EN';
stringArray[2] = 'And entering into a ship of __PNAdramyttium_1__SHAdramyttium</a>, __PNwe_2__SHwe</a> launched, meaning __PNto_sail_3__SHto sail</a> by the coasts of Asia; [one] __PNAristarchus_4__SHAristarchus</a>, a Macedonian of Thessalonica, being __PNwith_us_5__SHwith us</a>.__CPAdramyttium_1__PSAdramyttium__EEAdramyttium, now Adramyti, was a maritime city of Mysia in Asia Minor, seated at the foot of Mount Ida, on a gulf of the same name, opposite the island of Lesbos.__GHwe_2__PSwe__EFAct/21/1\');">Act 21:1__NBLuk/8/22\');">Luk 8:22__AN__GGto_sail_3__PSto sail__FFAct/20/15\');">Act 20:15__NRAct/20/16\');">16__NBAct/21/1\');">Act 21:1-3__AN__GHAristarchus_4__PSAristarchus__EFAct/19/19\');">Act 19:19__NBAct/20/4\');">Act 20:4__NBCol/4/10\');">Col 4:10__NBPhm/1/24\');">Phm 1:24__AN__GGwith_us_5__PSwith us__FFAct/16/10\');">Act 16:10-13__NRAct/16/17\');">17__NBAct/20/5\');">Act 20:5__NBAct/21/5\');">Act 21:5__NBAct/28/2\');">Act 28:2__NRAct/28/10\');">10__NRAct/28/12\');">12__NRAct/28/16\');">16__EN';
stringArray[3] = 'And the next [day] we touched at __PNSidon_1__SHSidon</a>. And __PNJulius_2__SHJulius</a> courteously entreated Paul, and gave [him] liberty to go unto his friends to refresh himself.__CPSidon_1__PSSidon__FFAct/12/20\');">Act 12:20__NBGen/10/15\');">Gen 10:15__NBGen/49/13\');">Gen 49:13__NBIsa/23/2\');">Isa 23:2-4__NRIsa/23/12\');">12__NBZec/9/2\');">Zec 9:2__AN__GHJulius_2__PSJulius__EFAct/24/23\');">Act 24:23__NBAct/27/1\');">Act 27:1__NRAct/27/3\');">3__NBAct/28/16\');">Act 28:16__EN';
stringArray[4] = 'And when we had launched from thence, we sailed under __PNCyprus_1__SHCyprus</a>, because __PNthe_winds_2__SHthe winds</a> were contrary.__CPCyprus_1__PSCyprus__FFAct/4/36\');">Act 4:36__NBAct/11/19\');">Act 11:19__NRAct/11/20\');">20__NBAct/13/4\');">Act 13:4__NBAct/15/39\');">Act 15:39__NBAct/21/3\');">Act 21:3__NRAct/21/16\');">16__AN__GHthe_winds_2__PSthe winds__EFMat/14/24\');">Mat 14:24__NBMar/6/48\');">Mar 6:48__EN';
stringArray[5] = 'And when we had sailed over the sea of __PNCilicia_1__SHCilicia</a> and __PNPamphylia_2__SHPamphylia</a>, we came to __PNMyra_3__SHMyra</a>, [a city] of Lycia.__CPCilicia_1__PSCilicia__FFAct/6/9\');">Act 6:9__NBAct/15/23\');">Act 15:23__NRAct/15/41\');">41__NBAct/21/39\');">Act 21:39__NBAct/22/3\');">Act 22:3__NBGal/1/21\');">Gal 1:21__AN__GHPamphylia_2__PSPamphylia__EFAct/2/10\');">Act 2:10__NBAct/13/13\');">Act 13:13__NBAct/15/38\');">Act 15:38__AN__GGMyra_3__PSMyra__EEMyra was a city of Lycia, situated on a hill, twenty stadia from the sea.</TD></TR>';
stringArray[6] = 'And there __PNthe_centurion_1__SHthe centurion</a> found a ship of __PNAlexandria_2__SHAlexandria</a> sailing into Italy; and he put us therein.__CPthe_centurion_1__PSthe centurion__FFAct/27/1\');">Act 27:1__AN.__GHAlexandria_2__PSAlexandria__FEAlexandria, now Scanderoon, was a celebrated city and port of Egypt, built by Alexander the Great, situated on the Mediterranean and the lake Moeris, opposite the island of Pharos, and about twelve miles from the western branch of the Nile. __NAAct/6/9\');">Act 6:9__NBAct/18/24\');">Act 18:24__NBAct/28/11\');">Act 28:11__EN';
stringArray[7] = 'And when we had sailed slowly many days, and scarce were come over against __PNCnidus_1__SHCnidus</a>, the wind not suffering us, __PNwe_sailed_2__SHwe sailed</a> __PNunder_3__SHunder</a> Crete, over against __PNSalmone_4__SHSalmone</a>;__CPCnidus_1__PSCnidus__EECnidus was a town and promontory of Caria in Asia Minor, opposite Crete, now Cape Krio.__GHwe_sailed_2__PSwe sailed__EFAct/27/12\');">Act 27:12__NRAct/27/13\');">13__NRAct/27/21\');">21__NBAct/2/11\');">Act 2:11__NBTts/1/5\');">Tts 1:5__NRTts/1/12\');">12__AN__GGunder_3__PSunder__FFAct/27/4\');">Act 27:4__AN. Crete, or, Candy. Crete, now Candy, is a large island in the Mediterranean, 250 miles in length, 50 in breadth, and 600 in circumference, lying at the entrance of the Aegean sea.__GHSalmone_4__PSSalmone__FESalmone, now Salamina, was a city and cape on the east of the island of Crete.</TD></TR>';
stringArray[8] = 'And, hardly passing it, came unto a place which is called __PNThe_fair_havens_1__SHThe fair havens</a>; nigh whereunto was the city [of] Lasea.__CPThe_fair_havens_1__PSThe fair havens__EEThe Fair Havens, still known by the same name, was a port on the south-eastern part of Crete, near Lasea, of which nothing now remains.</TD></TR>';
stringArray[9] = 'Now when much time was spent, and when sailing was now dangerous, because __PNthe_fast_1__SHthe fast</a> was now already past, Paul admonished [them],__CPthe_fast_1__PSthe fast__EE"""The fast was on the tenth day of the seventh month."" __NALev/16/29\');">Lev 16:29__NBLev/23/27\');">Lev 23:27-29__NBNum/29/7\');">Num 29:7__AN"</TD></TR>';
stringArray[10] = 'And said unto them, Sirs, __PNI_perceive_1__SHI perceive</a> that this voyage will be with hurt and much __PNdamage_2__SHdamage</a>, not only of the lading and ship, but also of our lives.__CPI_perceive_1__PSI perceive__FFAct/27/21\');">Act 27:21-26__NRAct/27/31\');">31__NRAct/27/34\');">34__NBGen/41/16\');">Gen 41:16-25__NRGen/41/38\');">38__NRGen/41/39\');">39__NB2Ki/6/9\');">2Ki 6:9__NR2Ki/6/10\');">10__NBPsa/25/14\');">Psa 25:14__NBDan/2/30\');">Dan 2:30__NBAmo/3/7\');">Amo 3:7__AN__GHdamage_2__PSdamage__FEor, injury. __NAAct/27/20\');">Act 27:20__NRAct/27/41\');">41-44__NB1Pe/4/18\');">1Pe 4:18__EN';
stringArray[11] = 'Nevertheless the centurion __PNbelieved_1__SHbelieved</a> the master and the owner of the ship, more than those things which were spoken by Paul.__CPbelieved_1__PSbelieved__FFAct/27/21\');">Act 27:21__NBExd/9/20\');">Exd 9:20__NRExd/9/21\');">21__NB2Ki/6/10\');">2Ki 6:10__NBPro/27/12\');">Pro 27:12__NBEze/3/17\');">Eze 3:17__NREze/3/18\');">18__NBEze/33/4\');">Eze 33:4__NBHbr/11/7\');">Hbr 11:7__EN';
stringArray[12] = 'And because __PNthe_haven_1__SHthe haven</a> was not commodious to winter in, the more part advised to depart thence also, if by any means they might attain to __PNPhenice_2__SHPhenice</a>, [and there] to winter; [which is] an haven of __PNCrete_3__SHCrete</a>, and lieth toward the south west and north west.__CPthe_haven_1__PSthe haven__FFAct/27/8\');">Act 27:8__NBPsa/107/30\');">Psa 107:30__AN__GHPhenice_2__PSPhenice__FEPhenice, was a sea-port on the western side of Crete; probably defended from the fury of the winds by a high and winding shore, forming a semicircle, and perhaps by some small island in front; leaving two openings, one towards the south-west, and the other towards the north-west.__GGCrete_3__PSCrete__FFAct/27/7\');">Act 27:7__AN.</TD></TR>';
stringArray[13] = 'And when __PNthe_south_1__SHthe south</a> wind blew softly, supposing that they had obtained [their] purpose, __PNloosing_2__SHloosing</a> [thence], they sailed close by Crete.__CPthe_south_1__PSthe south__FFJob/37/17\');">Job 37:17__NBPsa/78/26\');">Psa 78:26__NBSgs/4/16\');">Sgs 4:16__NBLuk/12/55\');">Luk 12:55__AN__GHloosing_2__PSloosing__EFAct/27/21\');">Act 27:21__AN.</TD></TR>';
stringArray[14] = 'But __PNnot_1__SHnot</a> long after there __PNarose_2__SHarose</a> against it __PNa_tempestuous_3__SHa tempestuous</a> wind, called __PNEuroclydon_4__SHEuroclydon</a>.__CPnot_1__PSnot__FFExd/14/21\');">Exd 14:21-27__NBJon/1/3\');">Jon 1:3-5__AN__GHarose_2__PSarose__FEor beat__GGa_tempestuous_3__PSa tempestuous__FFPsa/107/25\');">Psa 107:25-27__NBEze/27/26\');">Eze 27:26__NBMat/8/24\');">Mat 8:24__NBMar/4/37\');">Mar 4:37__AN__GHEuroclydon_4__PSEuroclydon__FEProbably, as Dr. Shaw supposes, one of those tempestuous winds called levanters, which blow in all directions, from N. E. round by E. to S. E.</TD></TR>';
stringArray[15] = 'And when the ship was caught, and could not bear up into the wind, __PNwe_1__SHwe</a> let [her] drive.__CPwe_1__PSwe__FFAct/27/27\');">Act 27:27__NBJam/3/4\');">Jam 3:4__EN';
stringArray[16] = 'And running under a certain island which is called __PNClauda_1__SHClauda</a>, we had much work to come by the boat:__CPClauda_1__PSClauda__EEClauda, called Cauda and Gaudos by Mela and Pliny, and Claudos by Ptolemy, and now Gozo, according to Dr. Shaw, is a small island, situated at the south-western extremity of the island of Crete.</TD></TR>';
stringArray[17] = 'Which when they had taken up, they used helps, undergirding the ship; and, __PNfearing_1__SHfearing</a> lest they should fall into the quicksands, strake sail, and so were driven.__CPfearing_1__PSfearing__FFAct/27/29\');">Act 27:29__NRAct/27/41\');">41__EN';
stringArray[18] = 'And we __PNbeing_1__SHbeing</a> exceedingly tossed with a tempest, __PNthe_next_2__SHthe next</a> [day] they lightened the ship;__CPbeing_1__PSbeing__FFPsa/107/27\');">Psa 107:27__AN__GHthe_next_2__PSthe next__EFAct/27/19\');">Act 27:19__NRAct/27/38\');">38__NBJon/1/5\');">Jon 1:5__NBMat/16/26\');">Mat 16:26__NBLuk/16/8\');">Luk 16:8__NBPhl/3/7\');">Phl 3:7__NRPhl/3/8\');">8__NBHbr/12/1\');">Hbr 12:1__EN';
stringArray[19] = 'And the third [day] __PNwe_1__SHwe</a> cast out with our own hands the tackling of the ship.__CPwe_1__PSwe__FFJob/2/4\');">Job 2:4__NBJon/1/5\');">Jon 1:5__NBMar/8/35\');">Mar 8:35-37__NBLuk/9/24\');">Luk 9:24__NRLuk/9/25\');">25__EN';
stringArray[20] = 'And when __PNneither_1__SHneither</a> sun nor stars in many days appeared, __PNand_no_2__SHand no</a> small tempest lay on [us], __PNall_3__SHall</a> hope that we should be saved was then taken away.__CPneither_1__PSneither__FFExd/10/21\');">Exd 10:21-23__NBPsa/105/28\');">Psa 105:28__NBMat/24/29\');">Mat 24:29__AN__GHand_no_2__PSand no__EFPsa/107/25\');">Psa 107:25-27__NBJon/1/4\');">Jon 1:4__NRJon/1/11\');">11-14__NBMat/8/24\');">Mat 8:24__NRMat/8/25\');">25__NB2Cr/11/25\');">2Cr 11:25__AN__GGall_3__PSall__FFIsa/57/10\');">Isa 57:10__NBJer/2/25\');">Jer 2:25__NBEze/37/11\');">Eze 37:11__NBEph/2/12\');">Eph 2:12__NB1Th/4/13\');">1Th 4:13__EN';
stringArray[21] = 'But __PNafter_1__SHafter</a> long abstinence Paul stood forth in the midst of them, and said, Sirs, __PNye_should_2__SHye should</a> have hearkened unto me, and __PNnot_3__SHnot</a> have loosed from Crete, and to have gained this harm and loss.__CPafter_1__PSafter__FFAct/27/33\');">Act 27:33-35__NBPsa/107/5\');">Psa 107:5__NRPsa/107/6\');">6__AN__GHye_should_2__PSye should__EFAct/27/9\');">Act 27:9__NRAct/27/10\');">10__NBGen/42/22\');">Gen 42:22__AN__GGnot_3__PSnot__FFAct/27/13\');">Act 27:13__AN.</TD></TR>';
stringArray[22] = 'And now __PNI_exhort_1__SHI exhort</a> you to be of good cheer: __PNfor_2__SHfor</a> there shall be no loss of [any man\'s] life among you, but of the ship.__CPI_exhort_1__PSI exhort__FFAct/27/25\');">Act 27:25__NRAct/27/36\');">36__NBAct/23/11\');">Act 23:11__NB1Sa/30/6\');">1Sa 30:6__NBEzr/10/2\');">Ezr 10:2__NBJob/22/29\');">Job 22:29__NRJob/22/30\');">30__NBPsa/112/7\');">Psa 112:7__NBIsa/43/1\');">Isa 43:1__NRIsa/43/2\');">2__NB2Cr/1/4\');">2Cr 1:4-6__NB2Cr/4/8\');">2Cr 4:8__NR2Cr/4/9\');">9__AN__GHfor_2__PSfor__EFAct/27/31\');">Act 27:31__NRAct/27/34\');">34__NRAct/27/44\');">44__NBJob/2/4\');">Job 2:4__EN';
stringArray[23] = 'For __PNthere_1__SHthere</a> stood by me this night the angel of God, __PNwhose_2__SHwhose</a> I am, __PNand_3__SHand</a> whom I serve,__CPthere_1__PSthere__FFAct/5/19\');">Act 5:19__NBAct/12/8\');">Act 12:8-11__NRAct/12/23\');">23__NBAct/23/11\');">Act 23:11__NBDan/6/22\');">Dan 6:22__NBHbr/1/14\');">Hbr 1:14__NBRev/22/16\');">Rev 22:16__AN__GHwhose_2__PSwhose__EFExd/19/5\');">Exd 19:5__NBDeu/32/9\');">Deu 32:9__NBPsa/135/4\');">Psa 135:4__NBSgs/2/16\');">Sgs 2:16__NBSgs/6/3\');">Sgs 6:3__NBIsa/44/5\');">Isa 44:5__NBJer/31/33\');">Jer 31:33__NBJer/32/38\');">Jer 32:38__NBEze/36/38\');">Eze 36:38__NBZec/13/9\');">Zec 13:9__NBMal/3/17\');">Mal 3:17__NBJhn/17/9\');">Jhn 17:9__NRJhn/17/10\');">10__NB1Cr/6/20\');">1Cr 6:20__NBTts/2/14\');">Tts 2:14__NB1Pe/2/9\');">1Pe 2:9__NR1Pe/2/10\');">10__AN__GGand_3__PSand__FFAct/16/17\');">Act 16:17__NBPsa/116/16\');">Psa 116:16__NBPsa/143/12\');">Psa 143:12__NBIsa/44/21\');">Isa 44:21__NBDan/3/17\');">Dan 3:17__NRDan/3/26\');">26__NRDan/3/28\');">28__NBDan/6/16\');">Dan 6:16__NRDan/6/20\');">20__NBJhn/12/26\');">Jhn 12:26__NBRom/1/1\');">Rom 1:1__NRRom/1/9\');">9__NBRom/6/22\');">Rom 6:22__NB2Ti/1/3\');">2Ti 1:3__NB2Ti/2/24\');">2Ti 2:24__NBTts/1/1\');">Tts 1:1__EN';
stringArray[24] = 'Saying, __PNFear_not_1__SHFear not</a>, Paul; __PNthou_2__SHthou</a> must be brought before Caesar: and, __PNlo_3__SHlo</a>, God hath given thee all them that sail with thee.__CPFear_not_1__PSFear not__FFAct/18/9\');">Act 18:9__NRAct/18/10\');">10__NBGen/15/1\');">Gen 15:1__NBGen/46/3\');">Gen 46:3__NB1Ki/17/13\');">1Ki 17:13__NB2Ki/6/16\');">2Ki 6:16__NBIsa/41/10\');">Isa 41:10-14__NBIsa/43/1\');">Isa 43:1-5__NBMat/10/28\');">Mat 10:28__NBRev/1/17\');">Rev 1:17__AN__GHthou_2__PSthou__EFAct/9/15\');">Act 9:15__NBAct/19/21\');">Act 19:21__NBAct/23/11\');">Act 23:11__NBAct/25/11\');">Act 25:11__NBMat/10/18\');">Mat 10:18__NBJhn/11/9\');">Jhn 11:9__NB2Ti/4/16\');">2Ti 4:16__NR2Ti/4/17\');">17__NBRev/11/5\');">Rev 11:5-7__AN__GGlo_3__PSlo__FFAct/27/37\');">Act 27:37__NBGen/12/2\');">Gen 12:2__NBGen/18/23\');">Gen 18:23-32__NBGen/19/21\');">Gen 19:21__NRGen/19/22\');">22__NRGen/19/29\');">29__NBGen/30/27\');">Gen 30:27__NBGen/39/5\');">Gen 39:5__NRGen/39/23\');">23__NBIsa/58/11\');">Isa 58:11__NRIsa/58/12\');">12__NBMic/5/7\');">Mic 5:7__NBJam/5/16\');">Jam 5:16__EN';
stringArray[25] = 'Wherefore, sirs, be of good cheer: for __PNI_believe_1__SHI believe</a> God, that it shall be even as it was told me.__CPI_believe_1__PSI believe__FFAct/27/11\');">Act 27:11__NRAct/27/21\');">21__NBNum/23/19\');">Num 23:19__NB2Ch/20/20\');">2Ch 20:20__NBLuk/1/45\');">Luk 1:45__NBRom/4/20\');">Rom 4:20__NRRom/4/21\');">21__NB2Ti/1/12\');">2Ti 1:12__EN';
stringArray[26] = 'Howbeit we must be cast upon __PNa_certain_1__SHa certain</a> island.__CPa_certain_1__PSa certain__FFAct/28/1\');">Act 28:1__EN';
stringArray[27] = 'But when __PNthe_fourteenth_1__SHthe fourteenth</a> night was come, as we were driven up and down in __PNAdria_2__SHAdria</a>, about midnight __PNthe_shipmen_3__SHthe shipmen</a> deemed that they drew near to some country;__CPthe_fourteenth_1__PSthe fourteenth__FFAct/27/18\');">Act 27:18-20__AN.__GHAdria_2__PSAdria__FE"Adria strictly speaking, was the name of the Adriatic gulf, now the Gulf of Venice, an arm of the Mediterranean, about 400 miles long and 140 broad, stretching along the eastern shores of Italy on one side, and Dalmatia, Sclavonia, and Macedonia on the other. But the term Adria was extended far beyond the limits of this gulf, and appears to have been given to an indeterminate extent of sea, as we say, generally, the Levant. It is observable, that the sacred historian does not say ""in the Adriatic gulf,"" but ""in Adria,"" (that is, the Adriatic sea, [ ( )] being understood;) which, says Hesychius, was the same as the Ionian sea; and Strabo says that the Ionian gulf ""is a part of that now called the Adriatic."" But not only the Ionian, but even the Sicilian sea, and part of that which washes Crete, were called the Adriatic. Thus the scholiast on Dionysius Periegetis says, ""they call this Sicilian sea Adria."" And Ptolemy says that Sicily was bounded on the east by the Adriatic, [hupo Adrias"__GGthe_shipmen_3__PSthe shipmen__FFAct/27/30\');">Act 27:30__NB1Ki/9/27\');">1Ki 9:27__NBJon/1/6\');">Jon 1:6__NBRev/18/17\');">Rev 18:17__EN';
stringArray[28] = 'And sounded, and found [it] twenty fathoms: and when they had gone a little further, they sounded again, and found [it] fifteen fathoms.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[29] = 'Then fearing lest we should have __PNfallen_1__SHfallen</a> upon rocks, they cast four __PNanchors_2__SHanchors</a> out of the stern, __PNand_wished_3__SHand wished</a> for the day.__CPfallen_1__PSfallen__FFAct/27/17\');">Act 27:17__NRAct/27/41\');">41__AN__GHanchors_2__PSanchors__EFAct/27/30\');">Act 27:30__NRAct/27/40\');">40__NBHbr/6/19\');">Hbr 6:19__AN__GGand_wished_3__PSand wished__FFDeu/28/67\');">Deu 28:67__NBPsa/130/6\');">Psa 130:6__EN';
stringArray[30] = 'And as the shipmen were about to flee out of the ship, when they had let down __PNthe_boat_1__SHthe boat</a> into the sea, under colour as though they would have cast anchors out of the __PNforeship_2__SHforeship</a>,__CPthe_boat_1__PSthe boat__FFAct/27/16\');">Act 27:16__NRAct/27/32\');">32__AN__GHforeship_2__PSforeship__EFAct/27/41\');">Act 27:41__AN.</TD></TR>';

stringArray[38] = 'And when they had eaten enough, __PNthey_lightened_1__SHthey lightened</a> the ship, and cast out __PNthe_wheat_2__SHthe wheat</a> into the sea.__CPthey_lightened_1__PSthey lightened__FFAct/27/18\');">Act 27:18__NRAct/27/19\');">19__NBJob/2/4\');">Job 2:4__NBJon/1/5\');">Jon 1:5__NBMat/6/25\');">Mat 6:25__NBMat/16/26\');">Mat 16:26__NBHbr/12/1\');">Hbr 12:1__AN__GHthe_wheat_2__PSthe wheat__FEThe Romans imported corn from Egypt, by way of Alexandria, to which this ship belonged; for a curious account of which see Bryant\'s treatise on the Euroclydon.</TD></TR>';
stringArray[39] = 'And when it was day, they knew not the land: but they discovered a certain creek with a shore, into the which they were minded, if it were possible, to thrust in the ship.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[40] = 'And when they had __PNtaken_up__etc__1__SHtaken up</a> the anchors, they committed [themselves] unto the sea, and loosed __PNthe_rudder_bands_2__SHthe rudder bands</a>, and hoised up the mainsail to the wind, and made toward shore.__CPtaken_up__etc__1__PStaken up, etc.__EEor, cut the anchors, they left them in the sea, etc. __NAAct/27/29\');">Act 27:29__NRAct/27/30\');">30__AN__GHthe_rudder_bands_2__PSthe rudder bands__FE"Or, ""the bands of the rudders;"" for large vessels in ancient times had two or more rudders, which were fastened to the ship by means of bands, or chains, by which they were hoisted out of the water when incapable of being used. These bands being loosed, the rudders would fall into their proper places, and serve to steer the vessel into the creek, which they had in view, and hoisted. __NAIsa/33/23\');">Isa 33:23__AN"</TD></TR>';
stringArray[41] = 'And falling into a place where two seas met, __PNthey_ran_1__SHthey ran</a> the ship aground; and the forepart stuck fast, and remained unmoveable, but the hinder part was __PNbroken_2__SHbroken</a> with the violence of the waves.__CPthey_ran_1__PSthey ran__FFAct/27/17\');">Act 27:17__NRAct/27/26\');">26-29__NB2Cr/11/25\');">2Cr 11:25__AN__GHbroken_2__PSbroken__EF1Ki/22/48\');">1Ki 22:48__NB2Ch/20/37\');">2Ch 20:37__NBEze/27/26\');">Eze 27:26__NREze/27/34\');">34__NB2Cr/11/25\');">2Cr 11:25__NR2Cr/11/26\');">26__EN';

stringArray[43] = 'But the centurion, __PNwilling_1__SHwilling</a> to save Paul, kept them from [their] purpose; and commanded that they which could swim should cast [themselves] first [into the sea], and get to land:__CPwilling_1__PSwilling__FFAct/27/3\');">Act 27:3__NRAct/27/11\');">11__NRAct/27/31\');">31__NBAct/23/10\');">Act 23:10__NRAct/23/24\');">24__NBPro/16/7\');">Pro 16:7__NB2Cr/11/25\');">2Cr 11:25__EN';
stringArray[44] = 'And the rest, some on boards, and some on [broken pieces] of the ship. And so it came to pass, __PNthat_1__SHthat</a> they escaped all safe to __PNland_2__SHland</a>.__CPthat_1__PSthat__FFAct/27/22\');">Act 27:22__NRAct/27/24\');">24__NBPsa/107/28\');">Psa 107:28-30__NBAmo/9/9\');">Amo 9:9__NBJhn/6/39\');">Jhn 6:39__NRJhn/6/40\');">40__NB2Cr/1/8\');">2Cr 1:8-10__NB1Pe/4/18\');">1Pe 4:18__AN__GHland_2__PSland__FEMelita, now Malta, the island on which Paul and his companions were cast, is situate in the Mediterranean sea, about fifty miles from the coast of Sicily, towards Africa; and is one immense rock of soft white free-stone, twenty miles long, twelve in its greatest breadth, and sixty in circumference. Some, however, with the learned Jacob Bryant, are of opinion that this island was Melita in the Adriatic gulf, near Illyricum; but it may be sufficient to observe, that the course of the Alexandrian ship, first to Syracuse and then to Rhegium, proves that it was the present Malta, as the proper course from the Illyrian Melita would have been first to Rhegium, before it reached Syracuse, to which indeed it need not have gone at all.</TD></TR>';
