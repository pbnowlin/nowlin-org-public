stringArray[6] = 'And it came to pass, __PNthat_1__SHthat</a>, as I made my journey, and was come nigh unto __PNDamascus_3__SHDamascus</a> __PNabout_4__SHabout</a> noon, suddenly there shone from heaven a great light round about me.__CPthat_1__PSthat__EEIt is evident that the apostle considered his extraordinary conversion as a most complete demonstration of the truth of Christianity; and when all the particulars of his education, his previous religious principles, his zeal, his enmity against Christians, and his prospects of secular honours and preferments by persecuting them, are compared with the subsequent part of his life, and the sudden transition from a furious persecutor to a zealous preacher of the gospel, in which he laboured and suffered to the end of his life, and for which he died a martyr, it must convince every candid and impartial person that no rational account can be given of this change, except what he himself assigns; and consequently, if that be true, that Christianity is Divine.__GHthat_2__PSthat__EFAct/9/3\');">Act 9:3-5__NBAct/26/12\');">Act 26:12__AN__GGDamascus_3__PSDamascus__FFGen/14/15\');">Gen 14:15__NBGen/15/2\');">Gen 15:2__NB2Sa/8/6\');">2Sa 8:6__AN__GHabout_4__PSabout__EFAct/26/13\');">Act 26:13__NBIsa/24/23\');">Isa 24:23__NBMat/17/2\');">Mat 17:2__NBRev/1/16\');">Rev 1:16__EN';

stringArray[24] = '__PNThe_chief_1__SHThe chief</a> captain commanded him to be brought into the castle, and bade __PNthat_he_should_2__SHthat he should</a> be examined by scourging; that he might know wherefore they cried so against him.__CPThe_chief_1__PSThe chief__EEAs the chief captain did not understand Hebrew, he was ignorant of the charge against Paul, and also of the defence which the apostle had made; but as he saw that they grew more and more outrageous, he supposed that Paul must have given them the highest provocation, and therefore, according to the barbarous and irrational practice which has existed in all countries, he determined to put him to the torture, in order to make him confess his crime. __NAAct/21/31\');">Act 21:31__NRAct/21/32\');">32__NBAct/23/10\');">Act 23:10__NRAct/23/27\');">27__AN__GHthat_he_should_2__PSthat he should__EFAct/22/25\');">Act 22:25-29__NBAct/16/22\');">Act 16:22__NRAct/16/23\');">23__NRAct/16/37\');">37__NBJhn/19/1\');">Jhn 19:1__NBHbr/11/35\');">Hbr 11:35__EN';
stringArray[25] = 'And as they bound him with thongs, Paul said unto __PNthe_centurion_1__SHthe centurion</a> that stood by, __PNIs_it_2__SHIs it</a> lawful for you to scourge a man that is a Roman, and uncondemned?__CPthe_centurion_1__PSthe centurion__FFAct/10/1\');">Act 10:1__NBAct/23/17\');">Act 23:17__NBAct/27/1\');">Act 27:1__NRAct/27/3\');">3__NRAct/27/43\');">43__NBMat/8/8\');">Mat 8:8__NBMat/27/54\');">Mat 27:54__AN__GHIs_it_2__PSIs it__FEBy the Roman law, no magistrate was allowed to punish a Roman citizen capitally, or by inflicting stripes, or even binding him; and the single expression, I am a Roman citizen, arrested their severest decrees, and obtained, if not an escape, at least a delay of his punishment. __NAAct/22/27\');">Act 22:27__NRAct/22/28\');">28__NBAct/16/37\');">Act 16:37__NBAct/25/16\');">Act 25:16__EN';
stringArray[26] = 'When the centurion heard [that], he went and told the chief captain, saying, __PNTake_1__SHTake</a> heed what thou doest: for this man is a Roman.__CPTake_1__PSTake__FFAct/22/29\');">Act 22:29__NBAct/23/27\');">Act 23:27__EN';
stringArray[27] = 'Then the chief captain came, and said unto him, Tell me, art thou a Roman? He said, Yea.__CPRelated_Verses1_1__PSEntire Verse.__EEThere are no entries for this verse!</TD></TR>';
stringArray[28] = 'And the chief captain answered, With a great sum obtained I this freedom. And Paul said, __PNBut_1__SHBut</a> I was [free] born.__CPBut_1__PSBut__EEIt is extremely probable that the inhabitants of Tarsus, born in that city, had the same rights and privileges as Roman citizens, in consequence of a grant or charter from Julius Cæsar, from whom it was called Juliopolis. But if this were not the case, St. Paul\'s father, or some of his ancestors, might have been rewarded with the freedom of the city of Rome, for his fidelity and bravery in some military service, as Josephus says several of the Jews were; or his father might have obtained it by purchase, as in the instance of the chief captain.</TD></TR>';
