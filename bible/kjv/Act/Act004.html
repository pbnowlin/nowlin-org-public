Text[18] = 'And they called them, and commanded them not to speak at all nor teach in the name of Jesus.';
Text[19] = 'But Peter and John answered and said unto them, Whether it be right in the sight of God to hearken unto you more than unto God, judge ye.';
Text[20] = 'For we cannot but speak the things which we have seen and heard.';
Text[21] = 'So when they had further threatened them, they let them go, finding nothing how they might punish them, because of the people: for all [men] glorified God for that which was done.';
Text[22] = 'For the man was above forty years old, on whom this miracle of healing was shewed.';
Text[23] = 'And being let go, they went to their own company, and reported all that the chief priests and elders had said unto them.';
