Text[1] = 'There was a certain man in Caesarea called Cornelius, a centurion of the band called the Italian [band],';
Text[2] = '[A] devout [man], and one that feared God with all his house, which gave much alms to the people, and prayed to God alway.';
Text[3] = 'He saw in a vision evidently about the ninth hour of the day an angel of God coming in to him, and saying unto him, Cornelius.';
Text[4] = 'And when he looked on him, he was afraid, and said, What is it, Lord? And he said unto him, Thy prayers and thine alms are come up for a memorial before God.';
Text[5] = 'And now send men to Joppa, and call for [one] Simon, whose surname is Peter:';
Text[6] = 'He lodgeth with one Simon a tanner, whose house is by the sea side: he shall tell thee what thou oughtest to do.';
Text[7] = 'And when the angel which spake unto Cornelius was departed, he called two of his household servants, and a devout soldier of them that waited on him continually;';
Text[8] = 'And when he had declared all [these] things unto them, he sent them to Joppa.';
Text[9] = 'On the morrow, as they went on their journey, and drew nigh unto the city, Peter went up upon the housetop to pray about the sixth hour:';
Text[10] = 'And he became very hungry, and would have eaten: but while they made ready, he fell into a trance,';
Text[11] = 'And saw heaven opened, and a certain vessel descending unto him, as it had been a great sheet knit at the four corners, and let down to the earth:';
Text[12] = 'Wherein were all manner of fourfooted beasts of the earth, and wild beasts, and creeping things, and fowls of the air.';
Text[13] = 'And there came a voice to him, Rise, Peter; kill, and eat.';
Text[14] = 'But Peter said, Not so, Lord; for I have never eaten any thing that is common or unclean.';
Text[15] = 'And the voice [spake] unto him again the second time, What God hath cleansed, [that] call not thou common.';
Text[16] = 'This was done thrice: and the vessel was received up again into heaven.';
Text[17] = 'Now while Peter doubted in himself what this vision which he had seen should mean, behold, the men which were sent from Cornelius had made enquiry for Simon\'s house, and stood before the gate,';
Text[18] = 'And called, and asked whether Simon, which was surnamed Peter, were lodged there.';
Text[19] = 'While Peter thought on the vision, the Spirit said unto him, Behold, three men seek thee.';
Text[20] = 'Arise therefore, and get thee down, and go with them, doubting nothing: for I have sent them.';
Text[21] = 'Then Peter went down to the men which were sent unto him from Cornelius; and said, Behold, I am he whom ye seek: what [is] the cause wherefore ye are come?';
Text[22] = 'And they said, Cornelius the centurion, a just man, and one that feareth God, and of good report among all the nation of the Jews, was warned from God by an holy angel to send for thee into his house, and to hear words of thee.';
Text[23] = 'Then called he them in, and lodged [them]. And on the morrow Peter went away with them, and certain brethren from Joppa accompanied him.';
Text[24] = 'And the morrow after they entered into Caesarea. And Cornelius waited for them, and had called together his kinsmen and near friends.';
Text[25] = 'And as Peter was coming in, Cornelius met him, and fell down at his feet, and worshipped [him].';
Text[26] = 'But Peter took him up, saying, Stand up; I myself also am a man.';
Text[27] = 'And as he talked with him, he went in, and found many that were come together.';
Text[28] = 'And he said unto them, Ye know how that it is an unlawful thing for a man that is a Jew to keep company, or come unto one of another nation; but God hath shewed me that I should not call any man common or unclean.';
Text[29] = 'Therefore came I [unto you] without gainsaying, as soon as I was sent for: I ask therefore for what intent ye have sent for me?';
Text[30] = 'And Cornelius said, Four days ago I was fasting until this hour; and at the ninth hour I prayed in my house, and, behold, a man stood before me in bright clothing,';
Text[31] = 'And said, Cornelius, thy prayer is heard, and thine alms are had in remembrance in the sight of God.';
Text[32] = 'Send therefore to Joppa, and call hither Simon, whose surname is Peter; he is lodged in the house of [one] Simon a tanner by the sea side: who, when he cometh, shall speak unto thee.';
Text[33] = 'Immediately therefore I sent to thee; and thou hast well done that thou art come. Now therefore are we all here present before God, to hear all things that are commanded thee of God.';
Text[34] = 'Then Peter opened [his] mouth, and said, Of a truth I perceive that God is no respecter of persons:';
Text[35] = 'But in every nation he that feareth him, and worketh righteousness, is accepted with him.';
Text[36] = 'The word which [God] sent unto the children of Israel, preaching peace by Jesus Christ: (he is Lord of all:)';
Text[37] = 'That word, [I say], ye know, which was published throughout all Judaea, and began from Galilee, after the baptism which John preached;';
Text[38] = 'How God anointed Jesus of Nazareth with the Holy Ghost and with power: who went about doing good, and healing all that were oppressed of the devil; for God was with him.';
Text[39] = 'And we are witnesses of all things which he did both in the land of the Jews, and in Jerusalem; whom they slew and hanged on a tree:';
Text[40] = 'Him God raised up the third day, and shewed him openly;';
Text[41] = 'Not to all the people, but unto witnesses chosen before of God, [even] to us, who did eat and drink with him after he rose from the dead.';
Text[42] = 'And he commanded us to preach unto the people, and to testify that it is he which was ordained of God [to be] the Judge of quick and dead.';
Text[43] = 'To him give all the prophets witness, that through his name whosoever believeth in him shall receive remission of sins.';
Text[44] = 'While Peter yet spake these words, the Holy Ghost fell on all them which heard the word.';
Text[45] = 'And they of the circumcision which believed were astonished, as many as came with Peter, because that on the Gentiles also was poured out the gift of the Holy Ghost.';
Text[46] = 'For they heard them speak with tongues, and magnify God. Then answered Peter,';
Text[47] = 'Can any man forbid water, that these should not be baptized, which have received the Holy Ghost as well as we?';
Text[48] = 'And he commanded them to be baptized in the name of the Lord. Then prayed they him to tarry certain days.';
