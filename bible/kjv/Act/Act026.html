Text[1] = 'Then Agrippa said unto Paul, Thou art permitted to speak for thyself. Then Paul stretched forth the hand, and answered for himself:';
Text[2] = 'I think myself happy, king Agrippa, because I shall answer for myself this day before thee touching all the things whereof I am accused of the Jews:';

Text[15] = 'And I said, Who art thou, Lord? And he said, I am Jesus whom thou persecutest.';

Text[20] = 'But shewed first unto them of Damascus, and at Jerusalem, and throughout all the coasts of Judaea, and [then] to the Gentiles, that they should repent and turn to God, and do works meet for repentance.';
