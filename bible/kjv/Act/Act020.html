Text[1] = 'And after the uproar was ceased, Paul called unto [him] the disciples, and embraced [them], and departed for to go into Macedonia.';

Text[8] = 'And there were many lights in the upper chamber, where they were gathered together.';

Text[11] = 'When he therefore was come up again, and had broken bread, and eaten, and talked a long while, even till break of day, so he departed.';

Text[15] = 'And we sailed thence, and came the next [day] over against Chios; and the next [day] we arrived at Samos, and tarried at Trogyllium; and the next [day] we came to Miletus.';
Text[16] = 'For Paul had determined to sail by Ephesus, because he would not spend the time in Asia: for he hasted, if it were possible for him, to be at Jerusalem the day of Pentecost.';
Text[17] = 'And from Miletus he sent to Ephesus, and called the elders of the church.';
Text[18] = 'And when they were come to him, he said unto them, Ye know, from the first day that I came into Asia, after what manner I have been with you at all seasons,';
Text[19] = 'Serving the Lord with all humility of mind, and with many tears, and temptations, which befell me by the lying in wait of the Jews:';
Text[20] = '[And] how I kept back nothing that was profitable [unto you], but have shewed you, and have taught you publickly, and from house to house,';
Text[21] = 'Testifying both to the Jews, and also to the Greeks, repentance toward God, and faith toward our Lord Jesus Christ.';
Text[22] = 'And now, behold, I go bound in the spirit unto Jerusalem, not knowing the things that shall befall me there:';
Text[23] = 'Save that the Holy Ghost witnesseth in every city, saying that bonds and afflictions abide me.';
Text[24] = 'But none of these things move me, neither count I my life dear unto myself, so that I might finish my course with joy, and the ministry, which I have received of the Lord Jesus, to testify the gospel of the grace of God.';
Text[25] = 'And now, behold, I know that ye all, among whom I have gone preaching the kingdom of God, shall see my face no more.';
Text[26] = 'Wherefore I take you to record this day, that I [am] pure from the blood of all [men].';
Text[27] = 'For I have not shunned to declare unto you all the counsel of God.';
Text[28] = 'Take heed therefore unto yourselves, and to all the flock, over the which the Holy Ghost hath made you overseers, to feed the church of God, which he hath purchased with his own blood.';
Text[29] = 'For I know this, that after my departing shall grievous wolves enter in among you, not sparing the flock.';
Text[30] = 'Also of your own selves shall men arise, speaking perverse things, to draw away disciples after them.';
Text[31] = 'Therefore watch, and remember, that by the space of three years I ceased not to warn every one night and day with tears.';
Text[32] = 'And now, brethren, I commend you to God, and to the word of his grace, which is able to build you up, and to give you an inheritance among all them which are sanctified.';
Text[33] = 'I have coveted no man\'s silver, or gold, or apparel.';
Text[34] = 'Yea, ye yourselves know, that these hands have ministered unto my necessities, and to them that were with me.';
Text[35] = 'I have shewed you all things, how that so labouring ye ought to support the weak, and to remember the words of the Lord Jesus, how he said, It is more blessed to give than to receive.';

Text[37] = 'And they all wept sore, and fell on Paul\'s neck, and kissed him,';
Text[38] = 'Sorrowing most of all for the words which he spake, that they should see his face no more. And they accompanied him unto the ship.';
