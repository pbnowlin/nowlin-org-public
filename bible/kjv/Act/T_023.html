stringArray[5] = 'Then said Paul, __PNI_wist_1__SHI wist</a> not, brethren, that he was the high priest: for it is written, __PNThou_2__SHThou</a> shalt not speak evil of the ruler of thy people.__CPI_wist_1__PSI wist__EESoon after the holding of the first council at Jerusalem, Ananias, son of Nebedenus, was deprived of the high priest\'s office, for certain acts of violence, and sent to Rome, whence he was afterwards released, and returned to Jerusalem. Between the death of Jonathan, who succeeded him and was murdered by Felix, and the high priesthood of Ismael, who was invested with that office by Agrippa, an interval elapsed in which this dignity was vacant. This was the precise time when Paul was apprehended; and the Sanhedrin being destitute of a president, Ananias undertook to discharge the office. It is probable that Paul was ignorant of this circumstance. __NAAct/24/17\');">Act 24:17__AN__GHThou_2__PSThou__EFExd/22/28\');">Exd 22:28__NBEcc/10/20\');">Ecc 10:20__NB2Pe/2/10\');">2Pe 2:10__NBJud/1/8\');">Jud 1:8__NRJud/1/9\');">9__EN';

stringArray[7] = 'And when he had so said, __PNthere_1__SHthere</a> arose a dissension between the Pharisees and the Sadducees: and the multitude was divided.__CPthere_1__PSthere__FFAct/14/4\');">Act 14:4__NBPsa/55/9\');">Psa 55:9__NBMat/10/34\');">Mat 10:34__NBJhn/7/40\');">Jhn 7:40-43__EN';

stringArray[12] = 'And when it was day, __PNcertain_1__SHcertain</a> of the Jews banded together, and __PNbound_2__SHbound</a> themselves __PNunder_a_curse_3__SHunder a curse</a>, saying __PNthat_4__SHthat</a> they would neither eat nor drink till they had killed Paul.__CPcertain_1__PScertain__FFAct/23/21\');">Act 23:21__NRAct/23/30\');">30__NBAct/25/3\');">Act 25:3__NBPsa/2/1\');">Psa 2:1-3__NBPsa/64/2\');">Psa 64:2-6__NBIsa/8/9\');">Isa 8:9__NRIsa/8/10\');">10__NBJer/11/19\');">Jer 11:19__NBMat/26/4\');">Mat 26:4__AN__GHbound_2__PSbound__EF1Ki/19/2\');">1Ki 19:2__NB2Ki/6/31\');">2Ki 6:31__NBMat/27/25\');">Mat 27:25__NBMar/6/23\');">Mar 6:23-26__AN__GGunder_a_curse_3__PSunder a curse__EEor, with an oath of execration. __NALev/27/29\');">Lev 27:29__NBJos/6/26\');">Jos 6:26__NBJos/7/1\');">Jos 7:1__NRJos/7/15\');">15__NBNeh/10/29\');">Neh 10:29__NBMat/26/74\');">Mat 26:74__AN; *Gr:; __NA1Cr/16/22\');">1Cr 16:22__NBGal/3/13\');">Gal 3:13__AN__GHthat_4__PSthat__FESuch execrable vows as these were not unusual among the Jews, who, from their perverted traditions, challenged to themselves a right of punishing without any legal process, those whom they considered transgressors of the law; and in some cases, as in the case of one who had forsaken the law of Moses, they thought they were justified in killing them. They therefore made no scruple of acquainting the chief priests and elders with their conspiracy against the life of Paul, and applying for their connivance and support; who, being chiefly of the sect of the Sadducees, and the apostle\'s bitterest enemies, were so far from blaming them for it, that they gladly aided and abetted them in this mode of dispatching him, and on its failure they soon afterwards determined upon making a similar attempt. (__NAAct/25/2\');">Act 25:2__AN, __NAAct/25/3\');">3__AN.) If these were, in their bad way, conscientious men, they were under no necessity of perishing for hunger, when the providence of God had hindered them from accompli
