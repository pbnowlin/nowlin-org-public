stringArray[12] = 'And landing at __PNSyracuse_1__SHSyracuse</a>, we tarried [there] three days.__CPSyracuse_1__PSSyracuse__EESyracuse was the capital of Sicily, situated on the eastern side of the island, 72 miles S. by E. of Messina, and about 112 of Palermo. In its ancient state of splendour it was 22® in extent, according to Strabo; and such was its opulence, that when the Romans took it, they found more riches than they did at Carthage.</TD></TR>';
