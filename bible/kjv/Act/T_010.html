stringArray[24] = 'And __PNthe_morrow_1__SHthe morrow</a> after they entered into __PNCaesarea_2__SHCaesarea</a>. And Cornelius waited for them, __PNand_had_3__SHand had</a> called together his kinsmen and near friends.__CPthe_morrow_1__PSthe morrow__FFAct/10/9\');">Act 10:9__AN.__GHCaesarea_2__PSCaesarea__FEThis city, once an obscure fortress called Strato\'s Tower, was built and superbly decorated by Herod the Great and called Cæsarea, in honour of Augustus Cæsar, to whom he dedicated it in the 28th year of his reign. It was situated on the shore of the Mediterranean, between Joppa and Dora, with a haven, rendered by Herod the most convenient on the coast: according to Ibn Idris and Abulfeda, 30 miles from Jaffa or Joppa, 32 from Ramlay, and 36 from Acco or Ptolemais; and, according to Josephus, 600 stadia, or 75 miles from Jerusalem, though the real distance is probably not more than 62 miles. Nothing now remains of the former splendour of Cæsarea: the supposed sites of the ancient edifices are mere mounds of indefinable form; the waves wash the ruins of the mole, the tower, and the port; the whole of the surrounding country is a sandy desert; and not a creature except beasts of prey, resides within many miles of this silent desolation.__GGand_had_3__PSand had__FFIsa/2/3\');">Isa 2:3__NBMic/4/2\');">Mic 4:2__NBZec/3/10\');">Zec 3:10__NBZec/8/20\');">Zec 8:20-23__NBMat/9/9\');">Mat 9:9__NRMat/9/10\');">10__NBMar/5/19\');">Mar 5:19__NRMar/5/20\');">20__NBLuk/5/29\');">Luk 5:29__NBJhn/1/41\');">Jhn 1:41-49__NBJhn/4/28\');">Jhn 4:28__NRJhn/4/29\');">29__NBJhn/1/1\');">Jhn 1:1-3__EN';
