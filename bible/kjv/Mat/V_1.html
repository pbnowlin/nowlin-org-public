<script type="text/javascript">
var Content = new Array();
Book = "Mat";
Chapter = "1";
Content[1]="The book of the generation of Jesus Christ, the son of David, the son of Abraham.";
Content[2]="Abraham begat Isaac; and Isaac begat Jacob; and Jacob begat Judas and his brethren;";
Content[3]="And Judas begat Phares and Zara of Thamar; and Phares begat Esrom; and Esrom begat Aram;";
Content[4]="And Aram begat Aminadab; and Aminadab begat Naasson; and Naasson begat Salmon;";
Content[5]="And Salmon begat Booz of Rachab; and Booz begat Obed of Ruth; and Obed begat Jesse;";
Content[6]="And Jesse begat David the king; and David the king begat Solomon of her [that had been the wife] of Urias;";
Content[7]="And Solomon begat Roboam; and Roboam begat Abia; and Abia begat Asa;";
Content[8]="And Asa begat Josaphat; and Josaphat begat Joram; and Joram begat Ozias;";
Content[9]="And Ozias begat Joatham; and Joatham begat Achaz; and Achaz begat Ezekias;";
Content[10]="And Ezekias begat Manasses; and Manasses begat Amon; and Amon begat Josias;";
Content[11]="And Josias begat Jechonias and his brethren, about the time they were carried away to Babylon:";
Content[12]="And after they were brought to Babylon, Jechonias begat Salathiel; and Salathiel begat Zorobabel;";
Content[13]="And Zorobabel begat Abiud; and Abiud begat Eliakim; and Eliakim begat Azor;";
Content[14]="And Azor begat Sadoc; and Sadoc begat Achim; and Achim begat Eliud;";
Content[15]="And Eliud begat Eleazar; and Eleazar begat Matthan; and Matthan begat Jacob;";
Content[16]="And Jacob begat Joseph the husband of Mary, of whom was born Jesus, who is called Christ.";
Content[17]="So all the generations from Abraham to David [are] fourteen generations; and from David until the carrying away into Babylon [are] fourteen generations; and from the carrying away into Babylon unto Christ [are] fourteen generations.";
Content[18]="Now the birth of Jesus Christ was on this wise: When as his mother Mary was espoused to Joseph, before they came together, she was found with child of the Holy Ghost.";
Content[19]="Then Joseph her husband, being a just [man], and not willing to make her a publick example, was minded to put her away privily.";
Content[20]="But while he thought on these things, behold, the angel of the Lord appeared unto him in a dream, saying, Joseph, thou son of David, fear not to take unto thee Mary thy wife: for that which is conceived in her is of the Holy Ghost.";
Content[21]="And she shall bring forth a son, and thou shalt call his name JESUS: for he shall save his people from their sins.";
Content[22]="Now all this was done, that it might be fulfilled which was spoken of the Lord by the prophet, saying,";
Content[23]="Behold, a virgin shall be with child, and shall bring forth a son, and they shall call his name Emmanuel, which being interpreted is, God with us.";
Content[24]="Then Joseph being raised from sleep did as the angel of the Lord had bidden him, and took unto him his wife:";
Content[25]="And knew her not till she had brought forth her firstborn son: and he called his name JESUS.";
</script>
