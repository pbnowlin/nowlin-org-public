Text[1] = 'And when he had called unto [him] his twelve disciples, he gave them power [against] unclean spirits, to cast them out, and to heal all manner of sickness and all manner of disease.';

Text[7] = 'And as ye go, preach, saying, The kingdom of heaven is at hand.';

Text[9] = 'Provide neither gold, nor silver, nor brass in your purses,';
Text[10] = 'Nor scrip for [your] journey, neither two coats, neither shoes, nor yet staves: for the workman is worthy of his meat.';
Text[11] = 'And into whatsoever city or town ye shall enter, enquire who in it is worthy; and there abide till ye go thence.';
Text[12] = 'And when ye come into an house, salute it.';
Text[13] = 'And if the house be worthy, let your peace come upon it: but if it be not worthy, let your peace return to you.';
Text[14] = 'And whosoever shall not receive you, nor hear your words, when ye depart out of that house or city, shake off the dust of your feet.';
Text[15] = 'Verily I say unto you, It shall be more tolerable for the land of Sodom and Gomorrha in the day of judgment, than for that city.';
Text[16] = 'Behold, I send you forth as sheep in the midst of wolves: be ye therefore wise as serpents, and harmless as doves.';
Text[17] = 'But beware of men: for they will deliver you up to the councils, and they will scourge you in their synagogues;';
Text[18] = 'And ye shall be brought before governors and kings for my sake, for a testimony against them and the Gentiles.';
Text[19] = 'But when they deliver you up, take no thought how or what ye shall speak: for it shall be given you in that same hour what ye shall speak.';
Text[20] = 'For it is not ye that speak, but the Spirit of your Father which speaketh in you.';
Text[21] = 'And the brother shall deliver up the brother to death, and the father the child: and the children shall rise up against [their] parents, and cause them to be put to death.';
Text[22] = 'And ye shall be hated of all [men] for my name\'s sake: but he that endureth to the end shall be saved.';
Text[23] = 'But when they persecute you in this city, flee ye into another: for verily I say unto you, Ye shall not have gone over the cities of Israel, till the Son of man be come.';
Text[24] = 'The disciple is not above [his] master, nor the servant above his lord.';
Text[25] = 'It is enough for the disciple that he be as his master, and the servant as his lord. If they have called the master of the house Beelzebub, how much more [shall they call] them of his household?';
Text[26] = 'Fear them not therefore: for there is nothing covered, that shall not be revealed; and hid, that shall not be known.';
Text[27] = 'What I tell you in darkness, [that] speak ye in light: and what ye hear in the ear, [that] preach ye upon the housetops.';
Text[28] = 'And fear not them which kill the body, but are not able to kill the soul: but rather fear him which is able to destroy both soul and body in hell.';
Text[29] = 'Are not two sparrows sold for a farthing? and one of them shall not fall on the ground without your Father.';
Text[30] = 'But the very hairs of your head are all numbered.';
Text[31] = 'Fear ye not therefore, ye are of more value than many sparrows.';
Text[32] = 'Whosoever therefore shall confess me before men, him will I confess also before my Father which is in heaven.';
Text[33] = 'But whosoever shall deny me before men, him will I also deny before my Father which is in heaven.';
Text[34] = 'Think not that I am come to send peace on earth: I came not to send peace, but a sword.';
Text[35] = 'For I am come to set a man at variance against his father, and the daughter against her mother, and the daughter in law against her mother in law.';
Text[36] = 'And a man\'s foes [shall be] they of his own household.';
Text[37] = 'He that loveth father or mother more than me is not worthy of me: and he that loveth son or daughter more than me is not worthy of me.';
Text[38] = 'And he that taketh not his cross, and followeth after me, is not worthy of me.';
Text[39] = 'He that findeth his life shall lose it: and he that loseth his life for my sake shall find it.';
Text[40] = 'He that receiveth you receiveth me, and he that receiveth me receiveth him that sent me.';
Text[41] = 'He that receiveth a prophet in the name of a prophet shall receive a prophet\'s reward; and he that receiveth a righteous man in the name of a righteous man shall receive a righteous man\'s reward.';
Text[42] = 'And whosoever shall give to drink unto one of these little ones a cup of cold [water] only in the name of a disciple, verily I say unto you, he shall in no wise lose his reward.';
