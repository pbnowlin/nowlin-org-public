csb[1] = "Yes, in those days and at that time, when I restore the fortunes of Judah and Jerusalem,";
csb[2] = "I will gather all the nations and take them to the Valley of Jehoshaphat. I will enter into judgment with them there because of my people, my inheritance Israel. The nations have scattered the Israelites in foreign countries and divided up my land.";
csb[3] = "They cast lots for my people; they bartered a boy for a prostitute and sold a girl for wine to drink.";
csb[4] = "And also: Tyre, Sidon, and all the territories of Philistia -- what are you to me? Are you paying me back or trying to get even with me? I will quickly bring retribution on your heads.";
csb[5] = "For you took my silver and gold and carried my finest treasures to your temples.";
csb[6] = "You sold the people of Judah and Jerusalem to the Greeks to remove them far from their own territory.";
csb[7] = "Look, I am about to rouse them up from the place where you sold them; I will bring retribution on your heads.";
csb[8] = "I will sell your sons and daughters to the people of Judah, and they will sell them to the Sabeans, to a distant nation, for the LORD has spoken.";
csb[9] = "Proclaim this among the nations: Prepare for holy war; rouse the warriors; let all the men of war advance and attack!";
csb[10] = "Beat your plows into swords and your pruning knives into spears. Let even the weakling say, &quot;I am a warrior.&quot;";
csb[11] = "Come quickly, all you surrounding nations; gather yourselves. Bring down your warriors there, LORD.";
csb[12] = "Let the nations be roused and come to the Valley of Jehoshaphat, for there I will sit down to judge all the surrounding nations.";
csb[13] = "Swing the sickle because the harvest is ripe. Come and trample the grapes because the winepress is full; the wine vats overflow because the wickedness of the nations is extreme.";
csb[14] = "Multitudes, multitudes in the valley of decision! For the day of the LORD is near in the valley of decision.";
csb[15] = "The sun and moon will grow dark, and the stars will cease their shining.";
csb[16] = "The LORD will roar from Zion and make his voice heard from Jerusalem; heaven and earth will shake. But the LORD will be a refuge for his people, a stronghold for the Israelites.";
csb[17] = "Then you will know that I am the LORD your God, who dwells in Zion, my holy mountain. Jerusalem will be holy, and foreigners will never overrun it again.";
csb[18] = "In that day the mountains will drip with sweet wine, and the hills will flow with milk. All the streams of Judah will flow with water, and a spring will issue from the LORD\'s house, watering the Valley of Acacias.";
csb[19] = "Egypt will become desolate, and Edom a desert wasteland, because of the violence done to the people of Judah in whose land they shed innocent blood.";
csb[20] = "But Judah will be inhabited forever, and Jerusalem from generation to generation.";
csb[21] = "I will pardon their bloodguilt, which I have not pardoned, for the LORD dwells in Zion.";

yng[2] = "Then I have gathered all the nations, And caused them to go down unto the valley of Jehoshaphat, And I have been judged with them there, Concerning My people and Mine inheritance -- Israel, Whom they scattered among nations, And My land they have apportioned.";
dby[2] = "I will also gather all the nations, and will bring them down into the valley of Jehoshaphat, and I will enter into judgment with them there on account of my people and mine inheritance, Israel, whom they have scattered among the nations: and they have parted my land;";

kjv[4] = "Yea, and what have ye to do with me, O Tyre, and Zidon, and all the coasts of Palestine? will ye render me a recompence? and if ye recompense me, swiftly [and] speedily will I return your recompence upon your own head;";
rsv[4] = "&quot;What are you to me, O Tyre and Sidon, and all the regions of Philistia? Are you paying me back for something? If you are paying me back, I will requite your deed upon your own head swiftly and speedily.";
asv[4] = "Yea, and what are ye to me, O Tyre, and Sidon, and all the regions of Philistia? will ye render me a recompense? and if ye recompense me, swiftly and speedily will I return your recompense upon your own head.";
yng[4] = "And also, what [are] ye to Me, O Tyre and Zidon, And all circuits of Philistia? Recompence are ye rendering unto Me? And if ye are giving recompence to Me, Swiftly, hastily, I turn back your recompence on your head.";
dby[4] = "Yea also, what have ye to do with me, O Tyre and Zidon, and all the districts of Philistia? Will ye render me a recompence? But if ye recompense me, swiftly [and] speedily will I bring your recompence upon your own head;";
web[4] = "Yes, and what have ye to do with me, O Tyre, and Zidon, and all the coasts of Palestine? will ye render me a recompense? and if ye recompense me, swiftly [and] speedily I will return your recompense upon your own head;";
hnv[4] = "&quot;Yes, and what are you to me, Tzor, and Tzidon, And all the regions of Peleshet? Will you repay me? And if you repay me, I will swiftly and speedily return your repayment on your own head.";
vul[4] = "verum quid vobis et mihi Tyrus et Sidon et omnis terminus Palestinorum numquid ultionem vos redditis mihi et si ulciscimini vos contra me cito velociter reddam vicissitudinem vobis super caput vestrum";

dby[19] = "Egypt shall be a desolation, and Edom shall be a desolate wilderness, for the violence against the children of Judah, in that they have shed innocent blood in their land.";

yng[20] = "And Judah to the age doth dwell, And Jerusalem to generation and generation.";
