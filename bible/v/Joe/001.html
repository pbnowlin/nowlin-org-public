csb[1] = "The word of the LORD that came to Joel son of Pethuel:";
csb[2] = "Hear this, you elders; listen, all you inhabitants of the land. Has anything like this ever happened in your days or in the days of your ancestors?";
csb[3] = "Tell your children about it, and let your children tell their children, and their children the next generation.";
csb[4] = "What the devouring locust has left, the swarming locust has eaten; what the swarming locust has left, the young locust has eaten; and what the young locust has left, the destroying locust has eaten.";
csb[5] = "Wake up, you drunkards, and weep; wail, all you wine drinkers, because of the sweet wine, for it has been taken from your mouth.";
csb[6] = "For a nation has invaded my land, powerful and without number; its teeth are the teeth of a lion, and it has the fangs of a lioness.";
csb[7] = "It has devastated my grapevine and splintered my fig tree. It has stripped off its bark and thrown it away; its branches have turned white.";
csb[8] = "Grieve like a young woman dressed in sackcloth, mourning for the husband of her youth.";
csb[9] = "Grain and drink offerings have been cut off from the house of the LORD; the priests, who are ministers of the LORD, mourn.";
csb[10] = "The fields are destroyed; the land grieves; indeed, the grain is destroyed; the new wine is dried up; and the fresh oil fails.";
csb[11] = "Be ashamed, you farmers, wail, you vinedressers, over the wheat and the barley, because the harvest of the field has perished.";
csb[12] = "The grapevine is dried up, and the fig tree is withered; the pomegranate, the date palm, and the apple -- all the trees of the orchard -- have withered. Indeed, human joy has dried up.";
csb[13] = "Dress in sackcloth and lament, you priests; wail, you ministers of the altar. Come and spend the night in sackcloth, you ministers of my God, because grain and drink offerings are withheld from the house of your God.";
csb[14] = "Announce a sacred fast; proclaim an assembly! Gather the elders and all the residents of the land at the house of the LORD your God, and cry out to the LORD.";
csb[15] = "Woe because of that day! For the day of the LORD is near and will come as devastation from the Almighty.";
csb[16] = "Hasn\'t the food been cut off before our eyes, joy and gladness from the house of our God?";
csb[17] = "The seeds lie shriveled in their casings. The storehouses are in ruin, and the granaries are broken down, because the grain has withered away.";
csb[18] = "How the animals groan! The herds of cattle wander in confusion since they have no pasture. Even the flocks of sheep and goats suffer punishment.";
csb[19] = "I call to you, LORD, for fire has consumed the pastures of the wilderness, and flames have devoured all the trees of the orchard.";
csb[20] = "Even the wild animals cry out to you, for the river beds are dried up, and fire has consumed the pastures of the wilderness.";
