csb[1] = "Blow the horn in Zion; sound the alarm on my holy mountain! Let all the residents of the land tremble, for the day of the LORD is coming; in fact, it is near --";
csb[2] = "a day of darkness and gloom, a day of clouds and total darkness, like the dawn spreading over the mountains; a great and strong people appears, such as never existed in ages past and never will again in all the generations to come.";
csb[3] = "A fire devours in front of them, and behind them a flame blazes. The land in front of them is like the garden of Eden, but behind them, it is like a desert wasteland; there is no escape from them.";
csb[4] = "Their appearance is like that of horses, and they gallop like war horses.";
csb[5] = "They bound on the tops of the mountains. Their sound is like the sound of chariots, like the sound of fiery flames consuming stubble, like a mighty army deployed for war.";
csb[6] = "Nations writhe in horror before them; all faces turn pale.";
csb[7] = "They attack as warriors attack; they scale walls as men of war do. Each goes on his own path, and they do not change their course.";
csb[8] = "They do not push each other; each proceeds on his own path. They dodge the arrows, never stopping.";
csb[9] = "They storm the city; they run on the wall; they climb into the houses; they enter through the windows like thieves.";
csb[10] = "The earth quakes before them; the sky shakes. The sun and moon grow dark, and the stars cease their shining.";
csb[11] = "The LORD makes his voice heard in the presence of his army. His camp is very large; those who carry out his command are powerful. Indeed, the day of the LORD is terrible and dreadful -- who can endure it?";
csb[12] = "Even now -- this is the LORD\'s declaration -- turn to me with all your heart, with fasting, weeping, and mourning.";
csb[13] = "Tear your hearts, not just your clothes, and return to the LORD your God. For he is gracious and compassionate, slow to anger, abounding in faithful love, and he relents from sending disaster.";
csb[14] = "Who knows? He may turn and relent and leave a blessing behind him, so you can offer grain and wine to the LORD your God.";
csb[15] = "Blow the horn in Zion! Announce a sacred fast; proclaim an assembly.";
csb[16] = "Gather the people; sanctify the congregation; assemble the aged; gather the infants, even babies nursing at the breast. Let the groom leave his bedroom, and the bride her honeymoon chamber.";
csb[17] = "Let the priests, the LORD\'s ministers, weep between the portico and the altar. Let them say: &quot;Have pity on your people, LORD, and do not make your inheritance a disgrace, an object of scorn among the nations. Why should it be said among the peoples, \'Where is their God? \' &quot;";
csb[18] = "Then the LORD became jealous for his land and spared his people.";
csb[19] = "The LORD answered his people: Look, I am about to send you grain, new wine, and fresh oil. You will be satiated with them, and I will no longer make you a disgrace among the nations.";
csb[20] = "I will drive the northerner far from you and banish him to a dry and desolate land, his front ranks into the Dead Sea, and his rear guard into the Mediterranean Sea. His stench will rise; yes, his rotten smell will rise, for he has done astonishing things.";
csb[21] = "Don\'t be afraid, land; rejoice and be glad, for the LORD has done astonishing things.";
csb[22] = "Don\'t be afraid, wild animals, for the wilderness pastures have turned green, the trees bear their fruit, and the fig tree and grapevine yield their riches.";
csb[23] = "Children of Zion, rejoice and be glad in the LORD your God, because he gives you the autumn rain for your vindication. He sends showers for you, both autumn and spring rain as before.";
csb[24] = "The threshing floors will be full of grain, and the vats will overflow with new wine and fresh oil.";
csb[25] = "I will repay you for the years that the swarming locust ate, the young locust, the destroying locust, and the devouring locust -- my great army that I sent against you.";
csb[26] = "You will have plenty to eat and be satisfied. You will praise the name of the LORD your God, who has dealt wondrously with you. My people will never again be put to shame.";
csb[27] = "You will know that I am present in Israel and that I am the LORD your God, and there is no other. My people will never again be put to shame.";
csb[28] = "After this I will pour out my Spirit on all humanity; then your sons and your daughters will prophesy, your old men will have dreams, and your young men will see visions.";
csb[29] = "I will even pour out my Spirit on the male and female slaves in those days.";
csb[30] = "I will display wonders in the heavens and on the earth: blood, fire, and columns of smoke.";
csb[31] = "The sun will be turned to darkness and the moon to blood before the great and terrible day of the LORD comes.";
csb[32] = "Then everyone who calls on the name of the LORD will be saved, for there will be an escape for those on Mount Zion and in Jerusalem, as the LORD promised, among the survivors the LORD calls.";

kjv[19] = "Yea, the LORD will answer and say unto his people, Behold, I will send you corn, and wine, and oil, and ye shall be satisfied therewith: and I will no more make you a reproach among the heathen:";
rsv[19] = "The LORD answered and said to his people, &quot;Behold, I am sending to you grain, wine, and oil, and you will be satisfied; and I will no more make you a reproach among the nations.";
asv[19] = "And Jehovah answered and said unto his people, Behold, I will send you grain, and new wine, and oil, and ye shall be satisfied therewith; and I will no more make you a reproach among the nations;";
yng[19] = "Let Jehovah answer and say to His people, `Lo, I am sending to you the corn, And the new wine, and the oil, And ye have been satisfied with it, And I make you no more a reproach among nations,";
dby[19] = "And Jehovah will answer and say unto his people, Behold, I send you corn, and new wine, and oil, and ye shall be satisfied therewith; and I will no more make you a reproach among the nations.";

vul[19] = "et respondit Dominus et dixit populo suo ecce ego mittam vobis frumentum et vinum et oleum et replebimini eo et non dabo vos ultra obprobrium in gentibus";
kjv[20] = "But I will remove far off from you the northern [army], and will drive him into a land barren and desolate, with his face toward the east sea, and his hinder part toward the utmost sea, and his stink shall come up, and his ill savour shall come up, because he hath done great things.";
rsv[20] = "&quot;I will remove the northerner far from you, and drive him into a parched and desolate land, his front into the eastern sea, and his rear into the western sea; the stench and foul smell of him will rise, for he has done great things.";
asv[20] = "but I will remove far off from you the northern [army], and will drive it into a land barren and desolate, its forepart into the eastern sea, and its hinder part into the western sea; and its stench shall come up, and its ill savor shall come up, because it hath done great things.";
yng[20] = "And the northern I put far off from you, And have driven him unto a land dry and desolate, With his face unto the eastern sea, And his rear unto the western sea, And come up hath his stink, And come up doth his stench, For he hath exerted himself to work.";
dby[20] = "And I will remove far off from you him [that cometh] from the north, and will drive him into a land barren and desolate, his face toward the eastern sea, and his rear toward the hinder sea; and his stench shall come up, and his ill odour shall come up, for he hath exalted himself to do great things.";
web[20] = "But I will remove far from you the northern [army], and will drive him into a land barren and desolate, with his face towards the east sea, and his hinder part towards the utmost sea, and his odious scent shall come up, and his ill savor shall come up, because he hath done great things.";
hnv[20] = "But I will remove the northern army far away from you, And will drive it into a barren and desolate land, Its front into the eastern sea, And its back into the western sea; And its stench will come up, And its bad smell will rise.&quot; Surely he has done great things.";
vul[20] = "et eum qui ab aquilone est procul faciam a vobis et expellam eum in terram inviam et desertam faciem eius contra mare orientale et extremum eius ad mare novissimum et ascendet fetor eius et ascendet putredo eius quia superbe egit";
kjv[21] = "Fear not, O land; be glad and rejoice: for the LORD will do great things.";

asv[21] = "Fear not, O land, be glad and rejoice; for Jehovah hath done great things.";
yng[21] = "Do not fear, O land! joy and rejoice, For Jehovah hath exerted Himself to work.";
dby[21] = "-- Fear not, O land; be glad and rejoice: for Jehovah doeth great things.";
web[21] = "Fear not, O land; be glad and rejoice: for the LORD will do great things.";
hnv[21] = "Land, don\'t be afraid. Be glad and rejoice, for the LORD has done great things.";

kjv[22] = "Be not afraid, ye beasts of the field: for the pastures of the wilderness do spring, for the tree beareth her fruit, the fig tree and the vine do yield their strength.";
rsv[22] = "Fear not, you beasts of the field, for the pastures of the wilderness are green; the tree bears its fruit, the fig tree and vine give their full yield.";
asv[22] = "Be not afraid, ye beasts of the field; for the pastures of the wilderness do spring, for the tree beareth its fruit, the fig-tree and the vine do yield their strength.";
yng[22] = "Do not fear, O cattle of the field! For sprung forth have pastures of a wilderness, For the tree hath borne its fruit, Fig-tree and vine have given their strength!";
dby[22] = "Be not afraid, ye beasts of the field: for the pastures of the wilderness do spring; for the tree beareth its fruit; the fig-tree and the vine yield full increase.";
web[22] = "Be not afraid, ye beasts of the field: for the pastures of the wilderness do spring, for the tree beareth its fruit, the fig-tree and the vine do yield their strength.";
hnv[22] = "Don\'t be afraid, you animals of the field; For the pastures of the wilderness spring up, For the tree bears its fruit. The fig tree and the vine yield their strength.";

kjv[23] = "Be glad then, ye children of Zion, and rejoice in the LORD your God: for he hath given you the former rain moderately, and he will cause to come down for you the rain, the former rain, and the latter rain in the first [month].";
rsv[23] = "&quot;Be glad, O sons of Zion, and rejoice in the LORD, your God; for he has given the early rain for your vindication, he has poured down for you abundant rain, the early and the latter rain, as before.";
asv[23] = "Be glad then, ye children of Zion, and rejoice in Jehovah your God; for he giveth you the former rain in just measure, and he causeth to come down for you the rain, the former rain and the latter rain, in the first [month].";
yng[23] = "And ye sons of Zion, joy and rejoice, In Jehovah your God, For He hath given to you the Teacher for righteousness, And causeth to come down to you a shower, Sprinkling and gathered -- in the beginning.";
dby[23] = "And ye, children of Zion, be glad and rejoice in Jehovah your God; for he giveth you the early rain in due measure, and he causeth to come down for you the rain, the early rain, and the latter rain at the beginning [of the season].";
web[23] = "Be glad then, ye children of Zion, and rejoice in the LORD your God: for he hath given you the former rain moderately, and he will cause to come down for you the rain, the former rain, and the latter rain in the first [month].";
hnv[23] = "&quot;Be glad then, you children of Tziyon, And rejoice in the LORD, your God; For he gives you the former rain in just measure, And he causes the rain to come down for you, The former rain and the latter rain, As before.";

dby[24] = "And the floors shall be full of corn, and the vats shall overflow with new wine and oil.";
