csb[1] = "Come now, you rich people, weep and wail over the miseries that are coming on you.";
csb[2] = "Your wealth has rotted and your clothes are moth-eaten.";
csb[3] = "Your gold and silver are corroded, and their corrosion will be a witness against you and will eat your flesh like fire. You have stored up treasure in the last days.";
csb[4] = "Look! The pay that you withheld from the workers who mowed your fields cries out, and the outcry of the harvesters has reached the ears of the Lord of Hosts.";
csb[5] = "You have lived luxuriously on the earth and have indulged yourselves. You have fattened your hearts in a day of slaughter.";
csb[6] = "You have condemned, you have murdered the righteous, who does not resist you.";
csb[7] = "Therefore, brothers and sisters, be patient until the Lord\'s coming. See how the farmer waits for the precious fruit of the earth and is patient with it until it receives the early and the late rains.";
csb[8] = "You also must be patient. Strengthen your hearts, because the Lord\'s coming is near.";
csb[9] = "Brothers and sisters, do not complain about one another, so that you will not be judged. Look, the judge stands at the door!";
csb[10] = "Brothers and sisters, take the prophets who spoke in the Lord\'s name as an example of suffering and patience.";
csb[11] = "See, we count as blessed those who have endured. You have heard of Job\'s endurance and have seen the outcome that the Lord brought about -- the Lord is compassionate and merciful.";
csb[12] = "Above all, my brothers and sisters, do not swear, either by heaven or by earth or with any other oath. But let your &quot;yes&quot; mean &quot;yes,&quot; and your &quot;no&quot; mean &quot;no,&quot; so that you won\'t fall under judgment.";
csb[13] = "Is anyone among you suffering? He should pray. Is anyone cheerful? He should sing praises.";
csb[14] = "Is anyone among you sick? He should call for the elders of the church, and they are to pray over him, anointing him with oil in the name of the Lord.";
csb[15] = "The prayer of faith will save the sick person, and the Lord will raise him up; if he has committed sins, he will be forgiven.";
csb[16] = "Therefore, confess your sins to one another and pray for one another, so that you may be healed. The prayer of a righteous person is very powerful in its effect.";
csb[17] = "Elijah was a human being as we are, and he prayed earnestly that it would not rain, and for three years and six months it did not rain on the land.";
csb[18] = "Then he prayed again, and the sky gave rain and the land produced its fruit.";
csb[19] = "My brothers and sisters, if any among you strays from the truth, and someone turns him back,";
csb[20] = "let that person know that whoever turns a sinner from the error of his way will save his soul from death and cover a multitude of sins.";
kjv[1] = "Go to now, [ye] rich men, weep and howl for your miseries that shall come upon [you].";
rsv[1] = "Come now, you rich, weep and howl for the miseries that are coming upon you.";

yng[1] = "Go, now, ye rich! weep, howling over your miseries that are coming upon [you];";
dby[1] = "Go to now, ye rich, weep, howling over your miseries that [are] coming upon [you].";
web[1] = "Come now, [ye] rich men, weep and howl for your miseries that shall come upon [you].";
hnv[1] = "Come now, you rich, weep and howl for your miseries that are coming on you.";
vul[1] = "age nunc divites plorate ululantes in miseriis quae advenient vobis";

asv[2] = "Your riches are corrupted, and your garments are moth-eaten.";
yng[2] = "your riches have rotted, and your garments have become moth-eaten;";
dby[2] = "Your wealth is become rotten, and your garments moth-eaten.";
web[2] = "Your riches are corrupted, and your garments are moth-eaten.";
hnv[2] = "Your riches are corrupted and your garments are moth-eaten.";
vul[2] = "divitiae vestrae putrefactae sunt et vestimenta vestra a tineis comesta sunt";
kjv[3] = "Your gold and silver is cankered; and the rust of them shall be a witness against you, and shall eat your flesh as it were fire. Ye have heaped treasure together for the last days.";
rsv[3] = "Your gold and silver have rusted, and their rust will be evidence against you and will eat your flesh like fire. You have laid up treasure for the last days.";
asv[3] = "Your gold and your silver are rusted; and their rust shall be for a testimony against you, and shall eat your flesh as fire. Ye have laid up your treasure in the last days.";
yng[3] = "your gold and silver have rotted, and the rust of them for a testimony shall be to you, and shall eat your flesh as fire. Ye made treasure in the last days!";
dby[3] = "Your gold and silver is eaten away, and their canker shall be for a witness against you, and shall eat your flesh as fire. Ye have heaped up treasure in [the] last days.";
web[3] = "Your gold and silver is cankered; and the rust of them shall be a testimony against you, and shall eat your flesh as it were fire. Ye have amassed treasure for the last days.";
hnv[3] = "Your gold and your silver are corroded, and their corrosion will be for a testimony against you, and will eat your flesh like fire. You have laid up your treasure in the last days.";
vul[3] = "aurum et argentum vestrum eruginavit et erugo eorum in testimonium vobis erit et manducabit carnes vestras sicut ignis thesaurizastis in novissimis diebus";
kjv[4] = "Behold, the hire of the labourers who have reaped down your fields, which is of you kept back by fraud, crieth: and the cries of them which have reaped are entered into the ears of the Lord of sabaoth.";
rsv[4] = "Behold, the wages of the laborers who mowed your fields, which you kept back by fraud, cry out; and the cries of the harvesters have reached the ears of the Lord of hosts.";
asv[4] = "Behold, the hire of the laborers who mowed your fields, which is of you kept back by fraud, crieth out: and the cries of them that reaped have entered into the ears of the Lord of Sabaoth.";
yng[4] = "lo, the reward of the workmen, of those who in-gathered your fields, which hath been fraudulently kept back by you -- doth cry out, and the exclamations of those who did reap into the ears of the Lord of Sabaoth have entered;";
dby[4] = "Behold, the wages of your labourers, who have harvested your fields, wrongfully kept back by you, cry, and the cries of those that have reaped are entered into the ears of [the] Lord of sabaoth.";
web[4] = "Behold, the hire of the laborers who have reaped your fields, which is by you kept back by fraud, crieth: and the cries of them who have reaped have entered into the ears of the Lord of Sabaoth.";
hnv[4] = " Behold, the wages of the laborers who mowed your fields, which you have kept back by fraud, cry out, and the cries of those who reaped have entered into the ears of the Lord of Hosts.";
vul[4] = "ecce merces operariorum qui messuerunt regiones vestras qui fraudatus est a vobis clamat et clamor ipsorum in aures Domini Sabaoth introiit";
kjv[5] = "Ye have lived in pleasure on the earth, and been wanton; ye have nourished your hearts, as in a day of slaughter.";
rsv[5] = "You have lived on the earth in luxury and in pleasure; you have fattened your hearts in a day of slaughter.";
asv[5] = "Ye have lived delicately on the earth, and taken your pleasure; ye have nourished your hearts in a day of slaughter.";
yng[5] = "ye did live in luxury upon the earth, and were wanton; ye did nourish your hearts, as in a day of slaughter;";
dby[5] = "Ye have lived luxuriously on the earth and indulged yourselves; ye have nourished your hearts [as] in a day of slaughter;";
web[5] = "Ye have lived in pleasure on the earth, and been wanton; ye have nourished your hearts, as in a day of slaughter.";
hnv[5] = "You have lived delicately on the eretz, and taken your pleasure. You have nourished your hearts as in a day of slaughter.";
vul[5] = "epulati estis super terram et in luxuriis enutristis corda vestra in die occisionis";
kjv[6] = "Ye have condemned [and] killed the just; [and] he doth not resist you.";
rsv[6] = "You have condemned, you have killed the righteous man; he does not resist you.";
asv[6] = "Ye have condemned, ye have killed the righteous [one]; he doth not resist you.";
yng[6] = "ye did condemn -- ye did murder the righteous one, he doth not resist you.";
dby[6] = "ye have condemned, ye have killed the just; he does not resist you.";
web[6] = "Ye have condemned [and] killed the just; [and] he doth not resist you.";
hnv[6] = "You have condemned, you have murdered the righteous one. He doesn\'t resist you.";
vul[6] = "addixistis occidistis iustum non resistit vobis";
kjv[7] = "Be patient therefore, brethren, unto the coming of the Lord. Behold, the husbandman waiteth for the precious fruit of the earth, and hath long patience for it, until he receive the early and latter rain.";
rsv[7] = "Be patient, therefore, brethren, until the coming of the Lord. Behold, the farmer waits for the precious fruit of the earth, being patient over it until it receives the early and the late rain.";
asv[7] = "Be patient therefore, brethren, until the coming of the Lord. Behold, the husbandman waiteth for the precious fruit of the earth, being patient over it, until it receive the early and latter rain.";
yng[7] = "Be patient, then, brethren, till the presence of the Lord; lo, the husbandman doth expect the precious fruit of the earth, being patient for it, till he may receive rain -- early and latter;";
dby[7] = "Have patience, therefore, brethren, till the coming of the Lord. Behold, the labourer awaits the precious fruit of the earth, having patience for it until it receive [the] early and [the] latter rain.";
web[7] = "Be patient, therefore, brethren, to the coming of the Lord. Behold, the husbandman waiteth for the precious fruit of the earth, and hath long patience for it, until he receiveth the early and the latter rain.";
hnv[7] = "Be patient therefore, brothers, until the coming of the Lord. Behold, the farmer waits for the precious fruit of the eretz, being patient over it, until it receives the early and late rain.";
vul[7] = "patientes igitur estote fratres usque ad adventum Domini ecce agricola expectat pretiosum fructum terrae patienter ferens donec accipiat temporivum et serotinum";
kjv[8] = "Be ye also patient; stablish your hearts: for the coming of the Lord draweth nigh.";
rsv[8] = "You also be patient. Establish your hearts, for the coming of the Lord is at hand.";
asv[8] = "Be ye also patient; establish your hearts: for the coming of the Lord is at hand.";
yng[8] = "be patient, ye also; establish your hearts, because the presence of the Lord hath drawn nigh;";

hnv[8] = "You also be patient. Establish your hearts, for the coming of the Lord is at hand.";
vul[8] = "patientes estote et vos confirmate corda vestra quoniam adventus Domini adpropinquavit";
kjv[9] = "Grudge not one against another, brethren, lest ye be condemned: behold, the judge standeth before the door.";
rsv[9] = "Do not grumble, brethren, against one another, that you may not be judged; behold, the Judge is standing at the doors.";
asv[9] = "Murmur not, brethren, one against another, that ye be not judged: behold, the judge standeth before the doors.";
yng[9] = "murmur not against one another, brethren, that ye may not be condemned; lo, the Judge before the door hath stood.";
dby[9] = "Complain not one against another, brethren, that ye be not judged. Behold, the judge stands before the door.";
web[9] = "Grudge not one against another, brethren, lest ye be condemned: behold, the judge standeth before the door.";
hnv[9] = "Don\'t grumble, brothers, against one another, so that you won\'t be judged. Behold, the judge stands at the door.";
vul[9] = "nolite ingemescere fratres in alterutrum ut non iudicemini ecce iudex ante ianuam adsistit";
kjv[10] = "Take, my brethren, the prophets, who have spoken in the name of the Lord, for an example of suffering affliction, and of patience.";
rsv[10] = "As an example of suffering and patience, brethren, take the prophets who spoke in the name of the Lord.";
asv[10] = "Take, brethren, for an example of suffering and of patience, the prophets who spake in the name of the Lord.";
yng[10] = "An example take ye of the suffering of evil, my brethren, and of the patience, the prophets who did speak in the name of the Lord;";
dby[10] = "Take [as] an example, brethren, of suffering and having patience, the prophets, who have spoken in the name of [the] Lord.";
web[10] = "Take, my brethren, the prophets, who have spoken in the name of the Lord, for an example of suffering affliction, and of patience.";
hnv[10] = "Take, brothers, for an example of suffering and of patience, the prophets who spoke in the name of the Lord.";
vul[10] = "exemplum accipite fratres laboris et patientiae prophetas qui locuti sunt in nomine Domini";
kjv[11] = "Behold, we count them happy which endure. Ye have heard of the patience of Job, and have seen the end of the Lord; that the Lord is very pitiful, and of tender mercy.";
rsv[11] = "Behold, we call those happy who were steadfast. You have heard of the steadfastness of Job, and you have seen the purpose of the Lord, how the Lord is compassionate and merciful.";
asv[11] = "Behold, we call them blessed that endured: ye have heard of the patience of Job, and have seen the end of the Lord, how that the Lord is full of pity, and merciful.";
yng[11] = "lo, we call happy those who are enduring; the endurance of Job ye heard of, and the end of the Lord ye have seen, that very compassionate is the Lord, and pitying.";
dby[11] = "Behold, we call them blessed who have endured. Ye have heard of the endurance of Job, and seen the end of the Lord; that the Lord is full of tender compassion and pitiful.";
web[11] = "Behold, we count them happy who endure. Ye have heard of the patience of Job, and have seen the end of the Lord; that the Lord is very pitiful, and of tender mercy.";
hnv[11] = "Behold, we call them blessed who endured. You have heard of the patience of Iyov, and have seen the Lord in the outcome, and how the Lord is full of compassion and mercy.";
vul[11] = "ecce beatificamus qui sustinuerunt sufferentiam Iob audistis et finem Domini vidistis quoniam misericors est Dominus et miserator";
kjv[12] = "But above all things, my brethren, swear not, neither by heaven, neither by the earth, neither by any other oath: but let your yea be yea; and [your] nay, nay; lest ye fall into condemnation.";
rsv[12] = "But above all, my brethren, do not swear, either by heaven or by earth or with any other oath, but let your yes be yes and your no be no, that you may not fall under condemnation.";
asv[12] = "But above all things, my brethren, swear not, neither by the heaven, nor by the earth, nor by any other oath: but let your yea be yea, and your nay, nay; that ye fall not under judgment.";
yng[12] = "And before all things, my brethren, do not swear, neither by the heaven, neither by the earth, neither by any other oath, and let your Yes be Yes, and the No, No; that under judgment ye may not fall.";
dby[12] = "But before all things, my brethren, swear not, neither by heaven, nor by the earth, nor by any other oath; but let your yea be yea, and your nay, nay, that ye do not fall under judgment.";
web[12] = "But above all things, my brethren, swear not, neither by heaven, neither by the earth, neither by any other oath: but let your yea, be yea: and [your] nay, nay; lest ye fall into condemnation.";
hnv[12] = "But above all things, my brothers, don\'t swear, neither by heaven, nor by the eretz, nor by any other oath; but let your &quot;yes&quot; be &quot;yes,&quot; and your &quot;no,&quot; &quot;no;&quot; so that you don\'t fall into hypocrisy.";
vul[12] = "ante omnia autem fratres mei nolite iurare neque per caelum neque per terram neque aliud quodcumque iuramentum sit autem vestrum est est non non uti non sub iudicio decidatis";
kjv[13] = "Is any among you afflicted? let him pray. Is any merry? let him sing psalms.";
rsv[13] = "Is any one among you suffering? Let him pray. Is any cheerful? Let him sing praise.";
asv[13] = "Is any among you suffering? let him pray. Is any cheerful? let him sing praise.";
yng[13] = "Doth any one suffer evil among you? let him pray; is any of good cheer? let him sing psalms;";
dby[13] = "Does any one among you suffer evil? let him pray. Is any happy? let him sing psalms.";
web[13] = "Is any among you afflicted? let him pray. Is any cheerful? let him sing psalms.";
hnv[13] = "Is any among you suffering? Let him pray. Is any cheerful? Let him sing praises.";
vul[13] = "tristatur aliquis vestrum oret aequo animo est psallat";
kjv[14] = "Is any sick among you? let him call for the elders of the church; and let them pray over him, anointing him with oil in the name of the Lord:";

asv[14] = "Is any among you sick? let him call for the elders of the church; and let them pray over him, anointing him with oil in the name of the Lord:";
yng[14] = "is any infirm among you? let him call for the elders of the assembly, and let them pray over him, having anointed him with oil, in the name of the Lord,";

kjv[15] = "And the prayer of faith shall save the sick, and the Lord shall raise him up; and if he have committed sins, they shall be forgiven him.";
rsv[15] = "and the prayer of faith will save the sick man, and the Lord will raise him up; and if he has committed sins, he will be forgiven.";
asv[15] = "and the prayer of faith shall save him that is sick, and the Lord shall raise him up; and if he have committed sins, it shall be forgiven him.";
yng[15] = "and the prayer of the faith shall save the distressed one, and the Lord shall raise him up, and if sins he may have committed, they shall be forgiven to him.";
dby[15] = "and the prayer of faith shall heal the sick, and the Lord shall raise him up; and if he be one who has committed sins, it shall be forgiven him.";
web[15] = "And the prayer of faith will save the sick, and the Lord will raise him up; and if he hath committed sins, they will be forgiven him.";
hnv[15] = "and the prayer of faith will heal him who is sick, and the Lord will raise him up. If he has committed sins, he will be forgiven.";
vul[15] = "et oratio fidei salvabit infirmum et adlevabit eum Dominus et si in peccatis sit dimittentur ei";
kjv[16] = "Confess [your] faults one to another, and pray one for another, that ye may be healed. The effectual fervent prayer of a righteous man availeth much.";
rsv[16] = "Therefore confess your sins to one another, and pray for one another, that you may be healed. The prayer of a righteous man has great power in its effects.";
asv[16] = "Confess therefore your sins one to another, and pray one for another, that ye may be healed. The supplication of a righteous man availeth much in its working.";
yng[16] = "Be confessing to one another the trespasses, and be praying for one another, that ye may be healed; very strong is a working supplication of a righteous man;";
dby[16] = "Confess therefore your offences to one another, and pray for one another, that ye may be healed. [The] fervent supplication of the righteous [man] has much power.";
web[16] = "Confess [your] faults one to another, and pray one for another, that ye may be healed. The effectual fervent prayer of the righteous man availeth much.";
hnv[16] = "Confess your offenses to one another, and pray one for another, that you may be healed. The effective, earnest prayer of a righteous man is powerfully effective.";
vul[16] = "confitemini ergo alterutrum peccata vestra et orate pro invicem ut salvemini multum enim valet deprecatio iusti adsidua";
kjv[17] = "Elias was a man subject to like passions as we are, and he prayed earnestly that it might not rain: and it rained not on the earth by the space of three years and six months.";
rsv[17] = "Eli\'jah was a man of like nature with ourselves and he prayed fervently that it might not rain, and for three years and six months it did not rain on the earth.";
asv[17] = "Elijah was a man of like passions with us, and he prayed fervently that it might not rain; and it rained not on the earth for three years and six months.";
yng[17] = "Elijah was a man like affected as we, and with prayer he did pray -- not to rain, and it did not rain upon the land three years and six months;";
dby[17] = "Elias was a man of like passions to us, and he prayed with prayer that it should not rain; and it did not rain upon the earth three years and six months;";
web[17] = "Elijah was a man subject to like passions as we are, and he prayed earnestly that it might not rain: and it rained not on the earth by the space of three years and six months.";
hnv[17] = "Eliyah was a man with a nature like ours, and he prayed earnestly that it might not rain, and it didn\'t rain on the eretz for three years and six months.";
vul[17] = "Helias homo erat similis nobis passibilis et oratione oravit ut non plueret super terram et non pluit annos tres et menses sex";
kjv[18] = "And he prayed again, and the heaven gave rain, and the earth brought forth her fruit.";
rsv[18] = "Then he prayed again and the heaven gave rain, and the earth brought forth its fruit.";
asv[18] = "And he prayed again; and the heaven gave rain, and the earth brought forth her fruit.";
yng[18] = "and again he did pray, and the heaven did give rain, and the land did bring forth her fruit.";
dby[18] = "and again he prayed, and the heaven gave rain, and the earth caused its fruit to spring forth.";
web[18] = "And he prayed again, and the heaven gave rain, and the earth brought forth its fruit.";
hnv[18] = "He prayed again, and the sky gave rain, and the eretz brought forth its fruit.";
vul[18] = "et rursum oravit et caelum dedit pluviam et terra dedit fructum suum";
kjv[19] = "Brethren, if any of you do err from the truth, and one convert him;";
rsv[19] = "My brethren, if any one among you wanders from the truth and some one brings him back,";
asv[19] = "My brethren, if any among you err from the truth, and one convert him;";
yng[19] = "Brethren, if any among you may go astray from the truth, and any one may turn him back,";
dby[19] = "My brethren, if any one among you err from the truth, and one bring him back,";
web[19] = "Brethren, if any one of you should err from the truth, and one should convert him;";
hnv[19] = "Brothers, if any among you wanders from the truth, and someone turns him back,";
vul[19] = "fratres mei si quis ex vobis erraverit a veritate et converterit quis eum";
kjv[20] = "Let him know, that he which converteth the sinner from the error of his way shall save a soul from death, and shall hide a multitude of sins.";
rsv[20] = "let him know that whoever brings back a sinner from the error of his way will save his soul from death and will cover a multitude of sins.";
asv[20] = "let him know, that he who converteth a sinner from the error of his way shall save a soul from death, and shall cover a multitude of sins.";
yng[20] = "let him know that he who did turn back a sinner from the straying of his way shall save a soul from death, and shall cover a multitude of sins.";
dby[20] = "let him know that he that brings back a sinner from [the] error of his way shall save a soul from death and shall cover a multitude of sins.";
web[20] = "Let him know, that he who converteth a sinner from the error of his way will save a soul from death, and will hide a multitude of sins.";
hnv[20] = "let him know that he who turns a sinner from the error of his way will save a soul from death, and will cover a multitude of sins.";
vul[20] = "scire debet quoniam qui converti fecerit peccatorem ab errore viae suae salvabit animam eius a morte et operit multitudinem peccatorum";
