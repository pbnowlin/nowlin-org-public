csb[1] = "Not many should become teachers, my brothers, because you know that we will receive a stricter judgment.";
csb[2] = "For we all stumble in many ways. If anyone does not stumble in what he says, he is mature, able also to control the whole body.";
csb[3] = "Now if we put bits into the mouths of horses so that they obey us, we direct their whole bodies.";
csb[4] = "And consider ships: Though very large and driven by fierce winds, they are guided by a very small rudder wherever the will of the pilot directs.";
csb[5] = "So too, though the tongue is a small part of the body, it boasts great things. Consider how a small fire sets ablaze a large forest.";
csb[6] = "And the tongue is a fire. The tongue, a world of unrighteousness, is placed among our members. It stains the whole body, sets the course of life on fire, and is itself set on fire by hell.";
csb[7] = "Every kind of animal, bird, reptile, and fish is tamed and has been tamed by humankind,";
csb[8] = "but no one can tame the tongue. It is a restless evil, full of deadly poison.";
csb[9] = "With the tongue we bless our Lord and Father, and with it we curse people who are made in God\'s likeness.";
csb[10] = "Blessing and cursing come out of the same mouth. My brothers and sisters, these things should not be this way.";
csb[11] = "Does a spring pour out sweet and bitter water from the same opening?";
csb[12] = "Can a fig tree produce olives, my brothers and sisters, or a grapevine produce figs? Neither can a saltwater spring yield fresh water.";
csb[13] = "Who among you is wise and understanding? By his good conduct he should show that his works are done in the gentleness that comes from wisdom.";
csb[14] = "But if you have bitter envy and selfish ambition in your heart, don\'t boast and deny the truth.";
csb[15] = "Such wisdom does not come down from above but is earthly, unspiritual, demonic.";
csb[16] = "For where there is envy and selfish ambition, there is disorder and every evil practice.";
csb[17] = "But the wisdom from above is first pure, then peace-loving, gentle, compliant, full of mercy and good fruits, unwavering, without pretense.";
csb[18] = "And the fruit of righteousness is sown in peace by those who cultivate peace.";
kjv[1] = "My brethren, be not many masters, knowing that we shall receive the greater condemnation.";
rsv[1] = "Let not many of you become teachers, my brethren, for you know that we who teach shall be judged with greater strictness.";
asv[1] = "Be not many [of you] teachers, my brethren, knowing that we shall receive heavier judgment.";
yng[1] = "Many teachers become not, my brethren, having known that greater judgment we shall receive,";
dby[1] = "Be not many teachers, my brethren, knowing that we shall receive greater judgment.";
web[1] = "My brethren, be not many teachers, knowing that we shall receive the greater condemnation.";
hnv[1] = "Let not many of you be teachers, my brothers, knowing that we will receive heavier judgment.";
vul[1] = "nolite plures magistri fieri fratres mei scientes quoniam maius iudicium sumitis";
kjv[2] = "For in many things we offend all. If any man offend not in word, the same [is] a perfect man, [and] able also to bridle the whole body.";
rsv[2] = "For we all make many mistakes, and if any one makes no mistakes in what he says he is a perfect man, able to bridle the whole body also.";
asv[2] = "For in many things we all stumble. If any stumbleth not in word, the same is a perfect man, able to bridle the whole body also.";
yng[2] = "for we all make many stumbles; if any one in word doth not stumble, this one [is] a perfect man, able to bridle also the whole body;";
dby[2] = "For we all often offend. If any one offend not in word, *he* [is] a perfect man, able to bridle the whole body too.";
web[2] = "For in many things we all offend. If any man offendeth not in word, the same [is] a perfect man, able also to bridle the whole body.";
hnv[2] = "For in many things we all stumble. If anyone doesn\'t stumble in word, the same is a perfect man, able to bridle the whole body also.";
vul[2] = "in multis enim offendimus omnes si quis in verbo non offendit hic perfectus est vir potens etiam freno circumducere totum corpus";
kjv[3] = "Behold, we put bits in the horses\' mouths, that they may obey us; and we turn about their whole body.";
rsv[3] = "If we put bits into the mouths of horses that they may obey us, we guide their whole bodies.";
asv[3] = "Now if we put the horses\' bridles into their mouths that they may obey us, we turn about their whole body also.";
yng[3] = "lo, the bits we put into the mouths of the horses for their obeying us, and their whole body we turn about;";
dby[3] = "Behold, we put the bits in the mouths of the horses, that they may obey us, and we turn round their whole bodies.";
web[3] = "Behold, we put bits in the mouths of horses, that they may obey us; and we turn about their whole body.";
hnv[3] = "Indeed, we put bits into the horses\' mouths so that they may obey us, and we guide their whole body.";
vul[3] = "si autem equorum frenos in ora mittimus ad consentiendum nobis et omne corpus illorum circumferimus";
kjv[4] = "Behold also the ships, which though [they be] so great, and [are] driven of fierce winds, yet are they turned about with a very small helm, whithersoever the governor listeth.";
rsv[4] = "Look at the ships also; though they are so great and are driven by strong winds, they are guided by a very small rudder wherever the will of the pilot directs.";
asv[4] = "Behold, the ships also, though they are so great and are driven by rough winds, are yet turned about by a very small rudder, whither the impulse of the steersman willeth.";
yng[4] = "lo, also the ships, being so great, and by fierce winds being driven, are led about by a very small helm, whithersoever the impulse of the helmsman doth counsel,";
dby[4] = "Behold also the ships, which are so great, and driven by violent winds, are turned about by a very small rudder, wherever the pleasure of the helmsman will.";
web[4] = "Behold also the ships, which though they are so great, and [are] driven by fierce winds, yet they are turned about with a very small helm, withersoever the governor willeth.";
hnv[4] = " Behold, the ships also, though they are so big and are driven by fierce winds, are yet guided by a very small rudder, wherever the pilot desires.";
vul[4] = "ecce et naves cum magnae sint et a ventis validis minentur circumferuntur a modico gubernaculo ubi impetus dirigentis voluerit";
kjv[5] = "Even so the tongue is a little member, and boasteth great things. Behold, how great a matter a little fire kindleth!";
rsv[5] = "So the tongue is a little member and boasts of great things. How great a forest is set ablaze by a small fire!";
asv[5] = "So the tongue also is a little member, and boasteth great things. Behold, how much wood is kindled by how small a fire!";
yng[5] = "so also the tongue is a little member, and doth boast greatly; lo, a little fire how much wood it doth kindle!";
dby[5] = "Thus also the tongue is a little member, and boasts great things. See how little a fire, how large a wood it kindles!";
web[5] = "Even so the tongue is a little member, and boasteth great things. Behold, how great a matter a little fire kindleth!";
hnv[5] = "So the tongue is also a little member, and boasts great things. See how a small fire can spread to a large forest!";
vul[5] = "ita et lingua modicum quidem membrum est et magna exultat ecce quantus ignis quam magnam silvam incendit";
kjv[6] = "And the tongue [is] a fire, a world of iniquity: so is the tongue among our members, that it defileth the whole body, and setteth on fire the course of nature; and it is set on fire of hell.";
rsv[6] = "And the tongue is a fire. The tongue is an unrighteous world among our members, staining the whole body, setting on fire the cycle of nature, and set on fire by hell.";
asv[6] = "And the tongue is a fire: the world of iniquity among our members is the tongue, which defileth the whole body, and setteth on fire the wheel of nature, and is set on fire by hell.";
yng[6] = "and the tongue [is] a fire, the world of the unrighteousness, so the tongue is set in our members, which is spotting our whole body, and is setting on fire the course of nature, and is set on fire by the gehenna.";
dby[6] = "and the tongue [is] fire, the world of unrighteousness; the tongue is set in our members, the defiler of the whole body, and which sets fire to the course of nature, and is set on fire of hell.";
web[6] = "And the tongue [is] a fire, a world of iniquity: so is the tongue among our members, that it defileth the whole body, and setteth on fire the course of nature; and it is set on fire from hell.";
hnv[6] = "And the tongue is a fire. The world of iniquity among our members is the tongue, which defiles the whole body, and sets on fire the course of nature, and is set on fire by Gehinnom.";
vul[6] = "et lingua ignis est universitas iniquitatis lingua constituitur in membris nostris quae maculat totum corpus et inflammat rotam nativitatis nostrae inflammata a gehenna";
kjv[7] = "For every kind of beasts, and of birds, and of serpents, and of things in the sea, is tamed, and hath been tamed of mankind:";
rsv[7] = "For every kind of beast and bird, of reptile and sea creature, can be tamed and has been tamed by humankind,";
asv[7] = "For every kind of beasts and birds, of creeping things and things in the sea, is tamed, and hath been tamed by mankind:";
yng[7] = "For every nature, both of beasts and of fowls, both of creeping things and things of the sea, is subdued, and hath been subdued, by the human nature,";
dby[7] = "For every species both of beasts and of birds, both of creeping things and of sea animals, is tamed and has been tamed by the human species;";
web[7] = "For every kind of beasts, and of birds, and of serpents, and of animals in the sea, is tamed, and hath been tamed by mankind:";
hnv[7] = "For every kind of animal, bird, creeping thing, and thing in the sea, is tamed, and has been tamed by mankind.";
vul[7] = "omnis enim natura bestiarum et volucrum et serpentium etiam ceterorum domantur et domita sunt a natura humana";
kjv[8] = "But the tongue can no man tame; [it is] an unruly evil, full of deadly poison.";
rsv[8] = "but no human being can tame the tongue--a restless evil, full of deadly poison.";
asv[8] = "but the tongue can no man tame; [it is] a restless evil, [it is] full of deadly poison.";
yng[8] = "and the tongue no one of men is able to subdue, [it is] an unruly evil, full of deadly poison,";
dby[8] = "but the tongue can no one among men tame; [it is] an unsettled evil, full of death-bringing poison.";
web[8] = "But the tongue can no man tame; [it is] an unruly evil, full of deadly poison.";
hnv[8] = "But nobody can tame the tongue. It is a restless evil, full of deadly poison.";
vul[8] = "linguam autem nullus hominum domare potest inquietum malum plena veneno mortifero";
kjv[9] = "Therewith bless we God, even the Father; and therewith curse we men, which are made after the similitude of God.";
rsv[9] = "With it we bless the Lord and Father, and with it we curse men, who are made in the likeness of God.";
asv[9] = "Therewith bless we the Lord and Father; and therewith curse we men, who are made after the likeness of God:";
yng[9] = "with it we do bless the God and Father, and with it we do curse the men made according to the similitude of God;";
dby[9] = "Therewith bless we the Lord and Father, and therewith curse we men made after [the] likeness of God.";
web[9] = "With this we bless God, even the Father; and with this we curse men, who are made after the similitude of God.";
hnv[9] = "With it we bless our God and Father, and with it we curse men, who are made in the image of God.";
vul[9] = "in ipsa benedicimus Dominum et Patrem et in ipsa maledicimus homines qui ad similitudinem Dei facti sunt";
kjv[10] = "Out of the same mouth proceedeth blessing and cursing. My brethren, these things ought not so to be.";
rsv[10] = "From the same mouth come blessing and cursing. My brethren, this ought not to be so.";
asv[10] = "out of the same mouth cometh forth blessing and cursing. My brethren, these things ought not so to be.";
yng[10] = "out of the same mouth doth come forth blessing and cursing; it doth not need, my brethren, these things so to happen;";
dby[10] = "Out of the same mouth goes forth blessing and cursing. It is not right, my brethren, that these things should be thus.";
web[10] = "Out of the same mouth proceedeth blessing and cursing. My brethren, these things ought not so to be.";
hnv[10] = "Out of the same mouth comes forth blessing and cursing. My brothers, these things ought not to be so.";
vul[10] = "ex ipso ore procedit benedictio et maledictio non oportet fratres mei haec ita fieri";
kjv[11] = "Doth a fountain send forth at the same place sweet [water] and bitter?";
rsv[11] = "Does a spring pour forth from the same opening fresh water and brackish?";
asv[11] = "Doth the fountain send forth from the same opening sweet [water] and bitter?";
yng[11] = "doth the fountain out of the same opening pour forth the sweet and the bitter?";
dby[11] = "Does the fountain, out of the same opening, pour forth sweet and bitter?";
web[11] = "Doth a fountain send forth at the same place sweet [water] and bitter?";
hnv[11] = "Does a spring send out from the same opening fresh and bitter water?";
vul[11] = "numquid fons de eodem foramine emanat dulcem et amaram aquam";
kjv[12] = "Can the fig tree, my brethren, bear olive berries? either a vine, figs? so [can] no fountain both yield salt water and fresh.";
rsv[12] = "Can a fig tree, my brethren, yield olives, or a grapevine figs? No more can salt water yield fresh.";
asv[12] = "can a fig tree, my brethren, yield olives, or a vine figs? neither [can] salt water yield sweet.";
yng[12] = "is a fig-tree able, my brethren, olives to make? or a vine figs? so no fountain salt and sweet water [is able] to make.";
dby[12] = "Can, my brethren, a fig produce olives, or a vine figs? Neither [can] salt [water] make sweet water.";
web[12] = "Can the fig-tree, my brethren, bear olive-berries? or a vine, figs? so no fountain [can] yield both salt water and fresh.";
hnv[12] = "Can a fig tree, my brothers, yield olives, or a vine figs? Thus no spring yields both salt water and fresh water.";
vul[12] = "numquid potest fratres mei ficus olivas facere aut vitis ficus sic neque salsa dulcem potest facere aquam";
kjv[13] = "Who [is] a wise man and endued with knowledge among you? let him shew out of a good conversation his works with meekness of wisdom.";
rsv[13] = "Who is wise and understanding among you? By his good life let him show his works in the meekness of wisdom.";
asv[13] = "Who is wise and understanding among you? let him show by his good life his works in meekness of wisdom.";
yng[13] = "Who [is] wise and intelligent among you? let him shew out of the good behaviour his works in meekness of wisdom,";
dby[13] = "Who [is] wise and understanding among you; let him shew out of a good conversation his works in meekness of wisdom;";
web[13] = "Who [is] a wise man and endued with knowledge among you? let him show by a good deportment his works with meekness of wisdom.";
hnv[13] = "Who is wise and understanding among you? Let him show by his good conduct that his deeds are done in gentleness of wisdom.";
vul[13] = "quis sapiens et disciplinatus inter vos ostendat ex bona conversatione operationem suam in mansuetudine sapientiae";
kjv[14] = "But if ye have bitter envying and strife in your hearts, glory not, and lie not against the truth.";
rsv[14] = "But if you have bitter jealousy and selfish ambition in your hearts, do not boast and be false to the truth.";
asv[14] = "But if ye have bitter jealousy and faction in your heart, glory not and lie not against the truth.";
yng[14] = "and if bitter zeal ye have, and rivalry in your heart, glory not, nor lie against the truth;";
dby[14] = "but if ye have bitter emulation and strife in your hearts, do not boast and lie against the truth.";
web[14] = "But if ye have bitter envying and strife in your hearts, glory not, and lie not against the truth.";
hnv[14] = " But if you have bitter jealousy and selfish ambition in your heart, don\'t boast and don\'t lie against the truth.";
vul[14] = "quod si zelum amarum habetis et contentiones in cordibus vestris nolite gloriari et mendaces esse adversus veritatem";
kjv[15] = "This wisdom descendeth not from above, but [is] earthly, sensual, devilish.";
rsv[15] = "This wisdom is not such as comes down from above, but is earthly, unspiritual, devilish.";
asv[15] = "This wisdom is not [a wisdom] that cometh down from above, but is earthly, sensual, devilish.";
yng[15] = "this wisdom is not descending from above, but earthly, physical, demon-like,";
dby[15] = "This is not the wisdom which comes down from above, but earthly, natural, devilish.";
web[15] = "This wisdom descendeth not from above, but [is] earthly, sensual, demoniacal.";
hnv[15] = "This wisdom is not that which comes down from above, but is earthly, sensual, and demonic.";
vul[15] = "non est ista sapientia desursum descendens sed terrena animalis diabolica";
kjv[16] = "For where envying and strife [is], there [is] confusion and every evil work.";
rsv[16] = "For where jealousy and selfish ambition exist, there will be disorder and every vile practice.";
asv[16] = "For where jealousy and faction are, there is confusion and every vile deed.";
yng[16] = "for where zeal and rivalry [are], there is insurrection and every evil matter;";
dby[16] = "For where emulation and strife [are], there [is] disorder and every evil thing.";
web[16] = "For where envying and strife [is], there [is] confusion and every evil work.";
hnv[16] = "For where jealousy and selfish ambition are, there is confusion and every evil deed.";
vul[16] = "ubi enim zelus et contentio ibi inconstantia et omne opus pravum";
kjv[17] = "But the wisdom that is from above is first pure, then peaceable, gentle, [and] easy to be intreated, full of mercy and good fruits, without partiality, and without hypocrisy.";
rsv[17] = "But the wisdom from above is first pure, then peaceable, gentle, open to reason, full of mercy and good fruits, without uncertainty or insincerity.";
asv[17] = "But the wisdom that is from above is first pure, then peaceable, gentle, easy to be entreated, full of mercy and good fruits, without variance, without hypocrisy.";
yng[17] = "and the wisdom from above, first, indeed, is pure, then peaceable, gentle, easily entreated, full of kindness and good fruits, uncontentious, and unhypocritical: --";
dby[17] = "But the wisdom from above first is pure, then peaceful, gentle, yielding, full of mercy and good fruits, unquestioning, unfeigned.";
web[17] = "But the wisdom that is from above is first pure, then peaceable, gentle, [and] easy to be entreated, full of mercy and good fruits, without partiality, and without hypocrisy.";
hnv[17] = "But the wisdom that is from above is first pure, then peaceful, gentle, reasonable, full of mercy and good fruits, without partiality, and without hypocrisy.";
vul[17] = "quae autem desursum est sapientia primum quidem pudica est deinde pacifica modesta suadibilis plena misericordia et fructibus bonis non iudicans sine simulatione";
kjv[18] = "And the fruit of righteousness is sown in peace of them that make peace.";
rsv[18] = "And the harvest of righteousness is sown in peace by those who make peace.";
asv[18] = "And the fruit of righteousness is sown in peace for them that make peace.";
yng[18] = "and the fruit of the righteousness in peace is sown to those making peace.";
dby[18] = "But [the] fruit of righteousness in peace is sown for them that make peace.";
web[18] = "And the fruit of righteousness is sown in peace by them that make peace.";
hnv[18] = "Now the fruit of righteousness is sown in shalom by those who make shalom.";
vul[18] = "fructus autem iustitiae in pace seminatur facientibus pacem";
