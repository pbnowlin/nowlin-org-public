csb[1] = "What is the source of wars and fights among you? Don\'t they come from your passions that wage war within you?";
csb[2] = "You desire and do not have. You murder and covet and cannot obtain. You fight and wage war. You do not have because you do not ask.";
csb[3] = "You ask and don\'t receive because you ask with wrong motives, so that you may spend it on your pleasures.";
csb[4] = "You adulterous people! Don\'t you know that friendship with the world is hostility toward God? So whoever wants to be the friend of the world becomes the enemy of God.";
csb[5] = "Or do you think it\'s without reason that the Scripture says: The spirit he made to dwell in us envies intensely?";
csb[6] = "But he gives greater grace. Therefore he says: God resists the proud, but gives grace to the humble.";
csb[7] = "Therefore, submit to God. Resist the devil, and he will flee from you.";
csb[8] = "Draw near to God, and he will draw near to you. Cleanse your hands, sinners, and purify your hearts, you double-minded.";
csb[9] = "Be miserable and mourn and weep. Let your laughter be turned to mourning and your joy to gloom.";
csb[10] = "Humble yourselves before the Lord, and he will exalt you.";
csb[11] = "Don\'t criticize one another, brothers and sisters. Anyone who defames or judges a fellow believer defames and judges the law. If you judge the law, you are not a doer of the law but a judge.";
csb[12] = "There is one lawgiver and judge who is able to save and to destroy. But who are you to judge your neighbor?";
csb[13] = "Come now, you who say, &quot;Today or tomorrow we will travel to such and such a city and spend a year there and do business and make a profit.&quot;";
csb[14] = "Yet you do not know what tomorrow will bring -- what your life will be! For you are like vapor that appears for a little while, then vanishes.";
csb[15] = "Instead, you should say, &quot;If the Lord wills, we will live and do this or that.&quot;";
csb[16] = "But as it is, you boast in your arrogance. All such boasting is evil.";
csb[17] = "So it is sin to know the good and yet not do it.";

yng[1] = "Whence [are] wars and fightings among you? not thence -- out of your passions, that are as soldiers in your members?";

hnv[1] = "Where do wars and fightings among you come from? Don\'t they come from your pleasures that war in your members?";

kjv[11] = "Speak not evil one of another, brethren. He that speaketh evil of [his] brother, and judgeth his brother, speaketh evil of the law, and judgeth the law: but if thou judge the law, thou art not a doer of the law, but a judge.";
