csb[1] = "My brothers and sisters, do not show favoritism as you hold on to the faith in our glorious Lord Jesus Christ.";
csb[2] = "For if someone comes into your meeting wearing a gold ring and dressed in fine clothes, and a poor person dressed in filthy clothes also comes in,";
csb[3] = "if you look with favor on the one wearing the fine clothes and say, &quot;Sit here in a good place,&quot; and yet you say to the poor person, &quot;Stand over there,&quot; or &quot;Sit here on the floor by my footstool,&quot;";
csb[4] = "haven\'t you made distinctions among yourselves and become judges with evil thoughts?";
csb[5] = "Listen, my dear brothers and sisters: Didn\'t God choose the poor in this world to be rich in faith and heirs of the kingdom that he has promised to those who love him?";
csb[6] = "Yet you have dishonored the poor. Don\'t the rich oppress you and drag you into court?";
csb[7] = "Don\'t they blaspheme the good name that was invoked over you?";
csb[8] = "Indeed, if you fulfill the royal law prescribed in the Scripture, Love your neighbor as yourself, you are doing well.";
csb[9] = "If, however, you show favoritism, you commit sin and are convicted by the law as transgressors.";
csb[10] = "For whoever keeps the entire law, and yet stumbles at one point, is guilty of breaking it all.";
csb[11] = "For he who said, Do not commit adultery, also said, Do not murder. So if you do not commit adultery, but you murder, you are a lawbreaker.";
csb[12] = "Speak and act as those who are to be judged by the law of freedom.";
csb[13] = "For judgment is without mercy to the one who has not shown mercy. Mercy triumphs over judgment.";
csb[14] = "What good is it, my brothers and sisters, if someone claims to have faith but does not have works? Can such faith save him?";

csb[16] = "and one of you says to them, &quot;Go in peace, stay warm, and be well fed,&quot; but you don\'t give them what the body needs, what good is it?";
csb[17] = "In the same way faith, if it doesn\'t have works, is dead by itself.";
csb[18] = "But someone will say, &quot;You have faith, and I have works.&quot; Show me your faith without works, and I will show you faith by my works.";
csb[19] = "You believe that God is one. Good! Even the demons believe -- and they shudder.";
csb[20] = "Senseless person! Are you willing to learn that faith without works is useless?";
csb[21] = "Wasn\'t Abraham our father justified by works in offering Isaac his son on the altar?";
csb[22] = "You see that faith was active together with his works, and by works, faith was made complete,";

vul[24] = "videtis quoniam ex operibus iustificatur homo et non ex fide tantum";
kjv[25] = "Likewise also was not Rahab the harlot justified by works, when she had received the messengers, and had sent [them] out another way?";
rsv[25] = "And in the same way was not also Rahab the harlot justified by works when she received the messengers and sent them out another way?";
asv[25] = "And in like manner was not also Rahab the harlot justified by works, in that she received the messengers, and sent them out another way?";
yng[25] = "and in like manner also Rahab the harlot -- was she not out of works declared righteous, having received the messengers, and by another way having sent forth?";
dby[25] = "But was not in like manner also Rahab the harlot justified on the principle of works, when she had received the messengers and put [them] forth by another way?";
web[25] = "Likewise also was not Rahab the harlot justified by works, when she had received the messengers, and had sent [them] out another way?";
hnv[25] = "In like manner wasn\'t Rachav the prostitute also justified by works, in that she received the messengers, and sent them out another way?";
vul[25] = "similiter autem et Raab meretrix nonne ex operibus iustificata est suscipiens nuntios et alia via eiciens";
kjv[26] = "For as the body without the spirit is dead, so faith without works is dead also.";
rsv[26] = "For as the body apart from the spirit is dead, so faith apart from works is dead.";
asv[26] = "For as the body apart from the spirit is dead, even so faith apart from works is dead.";
yng[26] = "for as the body apart from the spirit is dead, so also the faith apart from the works is dead.";
dby[26] = "For as the body without a spirit is dead, so also faith without works is dead.";
web[26] = "For as the body without the spirit is dead, so faith without works is dead also.";
