csb[1] = "James, a servant of God and of the Lord Jesus Christ: To the twelve tribes dispersed abroad. Greetings.";
csb[2] = "Consider it a great joy, my brothers and sisters, whenever you experience various trials,";
csb[3] = "because you know that the testing of your faith produces endurance.";
csb[4] = "And let endurance have its full effect, so that you may be mature and complete, lacking nothing.";
csb[5] = "Now if any of you lacks wisdom, he should ask God -- who gives to all generously and ungrudgingly -- and it will be given to him.";
csb[6] = "But let him ask in faith without doubting. For the doubter is like the surging sea, driven and tossed by the wind.";
csb[7] = "That person should not expect to receive anything from the Lord,";
csb[8] = "being double-minded and unstable in all his ways.";
csb[9] = "Let the brother of humble circumstances boast in his exaltation,";
csb[10] = "but let the rich boast in his humiliation because he will pass away like a flower of the field.";
csb[11] = "For the sun rises and, together with the scorching wind, dries up the grass; its flower falls off, and its beautiful appearance perishes. In the same way, the rich person will wither away while pursuing his activities.";
csb[12] = "Blessed is the one who endures trials, because when he has stood the test he will receive the crown of life that God has promised to those who love him.";
csb[13] = "No one undergoing a trial should say, &quot;I am being tempted by God,&quot; since God is not tempted by evil, and he himself doesn\'t tempt anyone.";
csb[14] = "But each person is tempted when he is drawn away and enticed by his own evil desire.";
csb[15] = "Then after desire has conceived, it gives birth to sin, and when sin is fully grown, it gives birth to death.";
csb[16] = "Don\'t be deceived, my dear brothers and sisters.";
csb[17] = "Every good and perfect gift is from above, coming down from the Father of lights, who does not change like shifting shadows.";
csb[18] = "By his own choice, he gave us birth by the word of truth so that we would be a kind of firstfruits of his creatures.";
csb[19] = "My dear brothers and sisters, understand this: Everyone should be quick to listen, slow to speak, and slow to anger,";
csb[20] = "for human anger does not accomplish God\'s righteousness.";
csb[21] = "Therefore, ridding yourselves of all moral filth and the evil that is so prevalent, humbly receive the implanted word, which is able to save your souls.";
csb[22] = "But be doers of the word and not hearers only, deceiving yourselves.";
csb[23] = "Because if anyone is a hearer of the word and not a doer, he is like someone looking at his own face in a mirror.";
csb[24] = "For he looks at himself, goes away, and immediately forgets what kind of person he was.";
csb[25] = "But the one who looks intently into the perfect law of freedom and perseveres in it, and is not a forgetful hearer but a doer who works -- this person will be blessed in what he does.";
csb[26] = "If anyone thinks he is religious without controlling his tongue, his religion is useless and he deceives himself.";
csb[27] = "Pure and undefiled religion before God the Father is this: to look after orphans and widows in their distress and to keep oneself unstained from the world.";

kjv[26] = "If any man among you seem to be religious, and bridleth not his tongue, but deceiveth his own heart, this man\'s religion [is] vain.";
rsv[26] = "If any one thinks he is religious, and does not bridle his tongue but deceives his heart, this man\'s religion is vain.";
asv[26] = "If any man thinketh himself to be religious, while he bridleth not his tongue but deceiveth his heart, this man\'s religion is vain.";
yng[26] = "If any one doth think to be religious among you, not bridling his tongue, but deceiving his heart, of this one vain [is] the religion;";
dby[26] = "If any one think himself to be religious, not bridling his tongue, but deceiving his heart, this man\'s religion is vain.";
web[26] = "If any man among you seemeth to be religious, and bridleth not his tongue, but deceiveth his own heart, this man\'s religion [is] vain.";
hnv[26] = "If anyone among you thinks himself to be religious while he doesn\'t bridle his tongue, but deceives his heart, this man\'s religion is worthless.";
vul[26] = "si quis autem putat se religiosum esse non refrenans linguam suam sed seducens cor suum huius vana est religio";
kjv[27] = "Pure religion and undefiled before God and the Father is this, To visit the fatherless and widows in their affliction, [and] to keep himself unspotted from the world.";
rsv[27] = "Religion that is pure and undefiled before God and the Father is this: to visit orphans and widows in their affliction, and to keep oneself unstained from the world.";
asv[27] = "Pure religion and undefiled before our God and Father is this, to visit the fatherless and widows in their affliction, [and] to keep oneself unspotted from the world.";
yng[27] = "religion pure and undefiled with the God and Father is this, to look after orphans and widows in their tribulation -- unspotted to keep himself from the world.";
dby[27] = "Pure and undefiled religion before God and the Father is this: to visit orphans and widows in their affliction, to keep oneself unspotted from the world.";
web[27] = "Pure religion and undefiled before God and the Father is this, To visit the fatherless and widows in their affliction, [and] to keep himself unspotted from the world.";
hnv[27] = "Pure religion and undefiled before our God and Father is this: to visit the fatherless and widows in their affliction, and to keep oneself unstained by the world.";
vul[27] = "religio munda et inmaculata apud Deum et Patrem haec est visitare pupillos et viduas in tribulatione eorum inmaculatum se custodire ab hoc saeculo";
