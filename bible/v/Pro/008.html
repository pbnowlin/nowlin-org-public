csb[1] = "Doesn\'t wisdom call out? Doesn\'t understanding make her voice heard?";
csb[2] = "At the heights overlooking the road, at the crossroads, she takes her stand.";
csb[3] = "Beside the gates leading into the city, at the main entrance, she cries out:";
csb[4] = "&quot;People, I call out to you; my cry is to the children of Adam.";
csb[5] = "&quot;Learn to be shrewd, you who are inexperienced; develop common sense, you who are foolish.";
csb[6] = "&quot;Listen, for I speak of noble things, and what my lips say is right.";
csb[7] = "&quot;For my mouth tells the truth, and wickedness is detestable to my lips.";
csb[8] = "&quot;All the words from my mouth are righteous; none of them are deceptive or perverse.";
csb[9] = "&quot;All of them are clear to the perceptive, and right to those who discover knowledge.";
csb[10] = "&quot;Accept my instruction instead of silver, and knowledge rather than pure gold.";
csb[11] = "&quot;For wisdom is better than jewels, and nothing desirable can equal it.";
csb[12] = "&quot;I, wisdom, share a home with shrewdness and have knowledge and discretion.";
csb[13] = "&quot;To fear the LORD is to hate evil. I hate arrogant pride, evil conduct, and perverse speech.";
csb[14] = "&quot;I possess good advice and sound wisdom; I have understanding and strength.";
csb[15] = "&quot;It is by me that kings reign and rulers enact just law;";
csb[16] = "&quot;by me, princes lead, as do nobles and all righteous judges.";
csb[17] = "&quot;I love those who love me, and those who search for me find me.";
csb[18] = "&quot;With me are riches and honor, lasting wealth and righteousness.";
csb[19] = "&quot;My fruit is better than solid gold, and my harvest than pure silver.";
csb[20] = "&quot;I walk in the ways of righteousness, along the paths of justice,";
csb[21] = "&quot;giving wealth as an inheritance to those who love me, and filling their treasuries.";
csb[22] = "&quot;The LORD acquired me at the beginning of his creation, before his works of long ago.";
csb[23] = "&quot;I was formed before ancient times, from the beginning, before the earth began.";
csb[24] = "&quot;I was born when there were no watery depths and no springs filled with water.";
csb[25] = "&quot;Before the mountains were established, prior to the hills, I was given birth --";
csb[26] = "&quot;before he made the land, the fields, or the first soil on earth.";
csb[27] = "&quot;I was there when he established the heavens, when he laid out the horizon on the surface of the ocean,";
csb[28] = "&quot;when he placed the skies above, when the fountains of the ocean gushed out,";
csb[29] = "&quot;when he set a limit for the sea so that the waters would not violate his command, when he laid out the foundations of the earth.";
csb[30] = "&quot;I was a skilled craftsman beside him. I was his delight every day, always rejoicing before him.";
csb[31] = "&quot;I was rejoicing in his inhabited world, delighting in the children of Adam.";
csb[32] = "&quot;And now, sons, listen to me; those who keep my ways are happy.";
csb[33] = "&quot;Listen to instruction and be wise; don\'t ignore it.";
csb[34] = "&quot;Anyone who listens to me is happy, watching at my doors every day, waiting by the posts of my doorway.";
csb[35] = "&quot;For the one who finds me finds life and obtains favor from the LORD,";
csb[36] = "&quot;but the one who misses me harms himself; all who hate me love death.&quot;";
