csb[1] = "A king\'s heart is like channeled water in the LORD\'s hand: He directs it wherever he chooses.";
csb[2] = "All a person\'s ways seem right to him, but the LORD weighs hearts.";
csb[3] = "Doing what is righteous and just is more acceptable to the LORD than sacrifice.";
csb[4] = "The lamp that guides the wicked -- haughty eyes and an arrogant heart -- is sin.";
