csb[1] = "The wicked flee when no one is pursuing them, but the righteous are as bold as a lion.";
csb[2] = "When a land is in rebellion, it has many rulers, but with a discerning and knowledgeable person, it endures.";
csb[3] = "A destitute leader who oppresses the poor is like a driving rain that leaves no food.";
csb[4] = "Those who reject the law praise the wicked, but those who keep the law pit themselves against them.";
csb[5] = "The evil do not understand justice, but those who seek the LORD understand everything.";
csb[6] = "Better the poor person who lives with integrity than the rich one who distorts right and wrong.";
csb[7] = "A discerning son keeps the law, but a companion of gluttons humiliates his father.";
csb[8] = "Whoever increases his wealth through excessive interest collects it for one who is kind to the poor.";
csb[9] = "Anyone who turns his ear away from hearing the law -- even his prayer is detestable.";
csb[10] = "The one who leads the upright into an evil way will fall into his own pit, but the blameless will inherit what is good.";
csb[11] = "A rich person is wise in his own eyes, but a poor one who has discernment sees through him.";
csb[12] = "When the righteous triumph, there is great rejoicing, but when the wicked come to power, people hide.";
csb[13] = "The one who conceals his sins will not prosper, but whoever confesses and renounces them will find mercy.";
csb[14] = "Happy is the one who is always reverent, but one who hardens his heart falls into trouble.";
csb[15] = "A wicked ruler over a helpless people is like a roaring lion or a charging bear.";
csb[16] = "A leader who lacks understanding is very oppressive, but one who hates dishonest profit prolongs his life.";
csb[17] = "Someone burdened by bloodguilt will be a fugitive until death. Let no one help him.";
csb[18] = "The one who lives with integrity will be helped, but one who distorts right and wrong will suddenly fall.";
csb[19] = "The one who works his land will have plenty of food, but whoever chases fantasies will have his fill of poverty.";
csb[20] = "A faithful person will have many blessings, but one in a hurry to get rich will not go unpunished.";

csb[22] = "A greedy one is in a hurry for wealth; he doesn\'t know that poverty will come to him.";
csb[23] = "One who rebukes a person will later find more favor than one who flatters with his tongue.";
csb[24] = "The one who robs his father or mother and says, &quot;That\'s no sin,&quot; is a companion to a person who destroys.";
csb[25] = "A greedy person stirs up conflict, but whoever trusts in the LORD will prosper.";
csb[26] = "The one who trusts in himself is a fool, but one who walks in wisdom will be safe.";
