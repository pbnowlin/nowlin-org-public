csb[1] = "Solomon\'s proverbs: A wise son brings joy to his father, but a foolish son, heartache to his mother.";
csb[2] = "Ill-gotten gains do not profit anyone, but righteousness rescues from death.";
csb[3] = "The LORD will not let the righteous go hungry, but he denies the wicked what they crave.";
csb[4] = "Idle hands make one poor, but diligent hands bring riches.";
csb[5] = "The son who gathers during summer is prudent; the son who sleeps during harvest is disgraceful.";
csb[6] = "Blessings are on the head of the righteous, but the mouth of the wicked conceals violence.";
csb[7] = "The remembrance of the righteous is a blessing, but the name of the wicked will rot.";
csb[8] = "A wise heart accepts commands, but foolish lips will be destroyed.";
csb[9] = "The one who lives with integrity lives securely, but whoever perverts his ways will be found out.";
csb[10] = "A sly wink of the eye causes grief, and foolish lips will be destroyed.";
csb[11] = "The mouth of the righteous is a fountain of life, but the mouth of the wicked conceals violence.";
csb[12] = "Hatred stirs up conflicts, but love covers all offenses.";
csb[13] = "Wisdom is found on the lips of the discerning, but a rod is for the back of the one who lacks sense.";
csb[14] = "The wise store up knowledge, but the mouth of the fool hastens destruction.";
csb[15] = "The wealth of the rich is his fortified city; the poverty of the poor is their destruction.";
csb[16] = "The reward of the righteous is life; the wages of the wicked is punishment.";
csb[17] = "The one who follows instruction is on the path to life, but the one who rejects correction goes astray.";
csb[18] = "The one who conceals hatred has lying lips, and whoever spreads slander is a fool.";
csb[19] = "When there are many words, sin is unavoidable, but the one who controls his lips is prudent.";
csb[20] = "The tongue of the righteous is pure silver; the heart of the wicked is of little value.";
csb[21] = "The lips of the righteous feed many, but fools die for lack of sense.";
csb[22] = "The LORD\'s blessing enriches, and he adds no painful effort to it.";
csb[23] = "As shameful conduct is pleasure for a fool, so wisdom is for a person of understanding.";
csb[24] = "What the wicked dreads will come to him, but what the righteous desire will be given to them.";
csb[25] = "When the whirlwind passes, the wicked are no more, but the righteous are secure forever.";
csb[26] = "Like vinegar to the teeth and smoke to the eyes, so the slacker is to the one who sends him on an errand.";
csb[27] = "The fear of the LORD prolongs life, but the years of the wicked are cut short.";
csb[28] = "The hope of the righteous is joy, but the expectation of the wicked will perish.";
csb[29] = "The way of the LORD is a stronghold for the honorable, but destruction awaits the malicious.";
csb[30] = "The righteous will never be shaken, but the wicked will not remain on the earth.";
csb[31] = "The mouth of the righteous produces wisdom, but a perverse tongue will be cut out.";
csb[32] = "The lips of the righteous know what is appropriate, but the mouth of the wicked, only what is perverse.";
