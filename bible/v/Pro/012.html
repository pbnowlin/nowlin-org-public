csb[1] = "Whoever loves discipline loves knowledge, but one who hates correction is stupid.";
csb[2] = "One who is good obtains favor from the LORD, but he condemns a person who schemes.";
csb[3] = "No one can be made secure by wickedness, but the root of the righteous is immovable.";
csb[4] = "A wife&#x2009; of noble character is her husband\'s crown, but a wife who causes shame is like rottenness in his bones.";
csb[5] = "The thoughts of the righteous are just, but guidance from the wicked is deceitful.";
csb[6] = "The words of the wicked are a deadly ambush, but the speech of the upright rescues them.";
csb[7] = "The wicked are overthrown and perish, but the house of the righteous will stand.";
csb[8] = "A man is praised for his insight, but a twisted mind is despised.";
csb[9] = "Better to be disregarded, yet have a servant, than to act important but have no food.";
csb[10] = "The righteous cares about his animal\'s health, but even the merciful acts of the wicked are cruel.";
csb[11] = "The one who works his land will have plenty of food, but whoever chases fantasies lacks sense.";
csb[12] = "The wicked desire what evil people have caught, but the root of the righteous is productive.";
csb[13] = "By rebellious speech an evil person is trapped, but a righteous person escapes from trouble.";
csb[14] = "A person will be satisfied with good by the fruit of his mouth, and the work of a person\'s hands will reward him.";
csb[15] = "A fool\'s way is right in his own eyes, but whoever listens to counsel is wise.";
csb[16] = "A fool\'s displeasure is known at once, but whoever ignores an insult is sensible.";
csb[17] = "Whoever speaks the truth declares what is right, but a false witness speaks deceit.";
csb[18] = "There is one who speaks rashly, like a piercing sword; but the tongue of the wise brings healing.";
csb[19] = "Truthful lips endure forever, but a lying tongue, only a moment.";
csb[20] = "Deceit is in the hearts of those who plot evil, but those who promote peace have joy.";
csb[21] = "No disaster overcomes the righteous, but the wicked are full of misery.";
csb[22] = "Lying lips are detestable to the LORD, but faithful people are his delight.";
csb[23] = "A shrewd person conceals knowledge, but a foolish heart publicizes stupidity.";
csb[24] = "The diligent hand will rule, but laziness will lead to forced labor.";
csb[25] = "Anxiety in a person\'s heart weighs it down, but a good word cheers it up.";
csb[26] = "A righteous person is careful in dealing with his neighbor, but the ways of the wicked lead them astray.";
csb[27] = "A lazy hunter doesn\'t roast his game, but to a diligent person, his wealth is precious.";
csb[28] = "There is life in the path of righteousness, and in its path there is no death.";
