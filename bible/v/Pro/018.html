csb[1] = "One who isolates himself pursues selfish desires; he rebels against all sound wisdom.";
csb[2] = "A fool does not delight in understanding, but only wants to show off his opinions.";
csb[3] = "When a wicked person comes, contempt also comes, and along with dishonor, derision.";
csb[4] = "The words of a person\'s mouth are deep waters, a flowing river, a fountain of wisdom.";
csb[5] = "It is not good to show partiality to the guilty, denying an innocent person justice.";
csb[6] = "A fool\'s lips lead to strife, and his mouth provokes a beating.";
csb[7] = "A fool\'s mouth is his devastation, and his lips are a trap for his life.";
csb[8] = "A gossip\'s words are like choice food that goes down to one\'s innermost being.";
csb[9] = "The one who is lazy in his work is brother to a vandal.";
csb[10] = "The name of the LORD is a strong tower; the righteous run to it and are protected.";
csb[11] = "The wealth of the rich is his fortified city; in his imagination it is like a high wall.";
csb[12] = "Before his downfall a person\'s heart is proud, but humility comes before honor.";
csb[13] = "The one who gives an answer before he listens -- this is foolishness and disgrace for him.";
csb[14] = "A person\'s spirit can endure sickness, but who can survive a broken spirit?";
csb[15] = "The mind of the discerning acquires knowledge, and the ear of the wise seeks it.";
csb[16] = "A person\'s gift opens doors for him and brings him before the great.";
csb[17] = "The first to state his case seems right until another comes and cross-examines him.";
csb[18] = "Casting the lot ends quarrels and separates powerful opponents.";
csb[19] = "An offended brother is harder to reach than a fortified city, and quarrels are like the bars of a fortress.";
csb[20] = "From the fruit of a person\'s mouth his stomach is satisfied; he is filled with the product of his lips.";
csb[21] = "Death and life are in the power of the tongue, and those who love it will eat its fruit.";
csb[22] = "A man who finds a wife finds a good thing and obtains favor from the LORD.";
csb[23] = "The poor person pleads, but the rich one answers roughly.";
csb[24] = "One with many friends may be harmed, but there is a friend who stays closer than a brother.";
kjv[1] = "Through desire a man, having separated himself, seeketh [and] intermeddleth with all wisdom.";
rsv[1] = "He who is estranged seeks pretexts to break out against all sound judgment.";
asv[1] = "He that separateth himself seeketh [his own] desire, And rageth against all sound wisdom. ";
yng[1] = "For [an object of] desire he who is separated doth seek, With all wisdom he intermeddleth.";
dby[1] = "He that separateth himself seeketh [his] pleasure, he is vehement against all sound wisdom.";
web[1] = "Through desire a man, having separated himself, seeketh [and] intermeddleth with all wisdom.";
hnv[1] = "An unfriendly man pursues selfishness, And defies all sound judgment.";
vul[1] = "occasiones quaerit qui vult recedere ab amico omni tempore erit exprobrabilis";
kjv[2] = "A fool hath no delight in understanding, but that his heart may discover itself.";
rsv[2] = "A fool takes no pleasure in understanding, but only in expressing his opinion.";
asv[2] = "A fool hath no delight in understanding, But only that his heart may reveal itself. ";
yng[2] = "A fool delighteth not in understanding, But -- in uncovering his heart.";
dby[2] = "A fool hath no delight in understanding, but only that his heart may reveal itself.";
web[2] = "A fool hath no delight in understanding, but that his heart may reveal itself.";
hnv[2] = "A fool has no delight in understanding, But only in revealing his own opinion.";
vul[2] = "non recipit stultus verba prudentiae nisi ea dixeris quae versantur in corde eius";
kjv[3] = "When the wicked cometh, [then] cometh also contempt, and with ignominy reproach.";
rsv[3] = "When wickedness comes, contempt comes also; and with dishonor comes disgrace.";
asv[3] = "When the wicked cometh, there cometh also contempt, And with ignominy [cometh] reproach. ";
yng[3] = "With the coming of the wicked come also hath contempt, And with shame -- reproach.";
dby[3] = "When the wicked cometh, there cometh also contempt, and with ignominy reproach.";
web[3] = "When the wicked cometh, [then] cometh also contempt, and with ignominy reproach.";
hnv[3] = "When wickedness comes, contempt also comes, And with shame comes disgrace.";
vul[3] = "impius cum in profundum venerit peccatorum contemnit sed sequitur eum ignominia et obprobrium";
kjv[4] = "The words of a man\'s mouth [are as] deep waters, [and] the wellspring of wisdom [as] a flowing brook.";
rsv[4] = "The words of a man\'s mouth are deep waters; the fountain of wisdom is a gushing stream.";
asv[4] = "The words of a man\'s mouth are [as] deep waters; The wellspring of wisdom is [as] a flowing brook. ";
yng[4] = "Deep waters [are] the words of a man\'s mouth, The fountain of wisdom [is] a flowing brook.";
dby[4] = "The words of a man\'s mouth are deep waters, [and] the fountain of wisdom is a gushing brook.";
web[4] = "The words of a man\'s mouth [are as] deep waters, [and] the well-spring of wisdom [as] a flowing brook.";
hnv[4] = "The words of a man\'s mouth are like deep waters. The fountain of wisdom is like a flowing brook.";
vul[4] = "aqua profunda verba ex ore viri et torrens redundans fons sapientiae";
kjv[5] = "[It is] not good to accept the person of the wicked, to overthrow the righteous in judgment.";
rsv[5] = "It is not good to be partial to a wicked man, or to deprive a righteous man of justice.";
asv[5] = "To respect the person of the wicked is not good, [Nor] to turn aside the righteous in judgment. ";
yng[5] = "Acceptance of the face of the wicked [is] not good, To turn aside the righteous in judgment.";
dby[5] = "It is not good to accept the person of the wicked, to wrong the righteous in judgment.";
web[5] = "[It is] not good to accept the person of the wicked, to overthrow the righteous in judgment.";
hnv[5] = "To be partial to the faces of the wicked is not good, Nor to deprive the innocent of justice.";
vul[5] = "accipere personam impii non est bonum ut declines a veritate iudicii";
kjv[6] = "A fool\'s lips enter into contention, and his mouth calleth for strokes.";
rsv[6] = "A fool\'s lips bring strife, and his mouth invites a flogging.";
asv[6] = "A fool\'s lips enter into contention, And his mouth calleth for stripes. ";
yng[6] = "The lips of a fool enter into strife, And his mouth for stripes calleth.";
dby[6] = "A fool\'s lips enter into contention, and his mouth calleth for stripes.";
web[6] = "A fool\'s lips enter into contention, and his mouth calleth for strokes.";
hnv[6] = "A fool\'s lips come into strife, And his mouth invites beatings.";
vul[6] = "labia stulti inmiscunt se rixis et os eius iurgia provocat";
kjv[7] = "A fool\'s mouth [is] his destruction, and his lips [are] the snare of his soul.";
rsv[7] = "A fool\'s mouth is his ruin, and his lips are a snare to himself.";
asv[7] = "A fool\'s mouth is his destruction, And his lips are the snare of his soul. ";
yng[7] = "The mouth of a fool [is] ruin to him, And his lips [are] the snare of his soul.";
dby[7] = "A fool\'s mouth is destruction to him, and his lips are a snare to his soul.";
web[7] = "A fool\'s mouth [is] his destruction, and his lips [are] the snare of his soul.";
hnv[7] = "A fool\'s mouth is his destruction, And his lips are a snare to his soul.";
vul[7] = "os stulti contritio eius et labia illius ruina animae eius";
kjv[8] = "The words of a talebearer [are] as wounds, and they go down into the innermost parts of the belly.";
rsv[8] = "The words of a whisperer are like delicious morsels; they go down into the inner parts of the body.";
asv[8] = "The words of a whisperer are as dainty morsels, And they go down into the innermost parts. ";
yng[8] = "The words of a tale-bearer [are] as self-inflicted wounds, And they have gone down [to] the inner parts of the heart.";
dby[8] = "The words of a talebearer are as dainty morsels, and they go down into the innermost parts of the belly.";
web[8] = "The words of a tale-bearer [are] as wounds, and they go down into the innermost parts of the belly.";
hnv[8] = "The words of a gossip are like dainty morsels: They go down into a person\'s innermost parts.";
vul[8] = "verba bilinguis quasi simplicia et ipsa perveniunt usque ad interiora ventris";
kjv[9] = "He also that is slothful in his work is brother to him that is a great waster.";
rsv[9] = "He who is slack in his work is a brother to him who destroys.";
asv[9] = "He also that is slack in his work Is brother to him that is a destroyer. ";
yng[9] = "He also that is remiss in his work, A brother he [is] to a destroyer.";
dby[9] = "He also who is indolent in his work is brother of the destroyer.";
web[9] = "He also that is slothful in his work is brother to him that is a great waster.";
hnv[9] = "One who is slack in his work Is brother to him who is a master of destruction.";
vul[9] = "qui mollis et dissolutus est in opere suo frater est sua opera dissipantis";
kjv[10] = "The name of the LORD [is] a strong tower: the righteous runneth into it, and is safe.";
rsv[10] = "The name of the LORD is a strong tower; the righteous man runs into it and is safe.";
asv[10] = "The name of Jehovah is a strong tower; The righteous runneth into it, and is safe. ";
yng[10] = "A tower of strength [is] the name of Jehovah, Into it the righteous runneth, and is set on high.";
dby[10] = "The name of Jehovah is a strong tower: the righteous runneth into it, and is safe.";
web[10] = "The name of the LORD is a strong tower: the righteous runneth into it, and is safe.";
hnv[10] = "The name of the LORD is a strong tower: The righteous run to him, and are safe.";
vul[10] = "turris fortissima nomen Domini ad ipsum currit iustus et exaltabitur";
kjv[11] = "The rich man\'s wealth [is] his strong city, and as an high wall in his own conceit.";
rsv[11] = "A rich man\'s wealth is his strong city, and like a high wall protecting him.";
asv[11] = "The rich man\'s wealth is his strong city, And as a high wall in his own imagination. ";
yng[11] = "The wealth of the rich [is] the city of his strength, And as a wall set on high in his own imagination.";
dby[11] = "The rich man\'s wealth is his strong city, and as a high wall in his own imagination.";
web[11] = "The rich man\'s wealth [is] his strong city, and as a high wall in his own conceit.";
hnv[11] = "The rich man\'s wealth is his strong city, Like an unscalable wall in his own imagination.";
vul[11] = "substantia divitis urbs roboris eius et quasi murus validus circumdans eum";
kjv[12] = "Before destruction the heart of man is haughty, and before honour [is] humility.";
rsv[12] = "Before destruction a man\'s heart is haughty, but humility goes before honor.";
asv[12] = "Before destruction the heart of man is haughty; And before honor [goeth] humility. ";
yng[12] = "Before destruction the heart of man is high, And before honour [is] humility.";
dby[12] = "Before destruction the heart of man is haughty; and before honour [goeth] humility.";
web[12] = "Before destruction the heart of man is haughty, and before honor [is] humility.";
hnv[12] = "Before destruction the heart of man is proud, But before honor is humility.";
vul[12] = "antequam conteratur exaltatur cor hominis et antequam glorificetur humiliatur";
kjv[13] = "He that answereth a matter before he heareth [it], it [is] folly and shame unto him.";
rsv[13] = "If one gives answer before he hears, it is his folly and shame.";
asv[13] = "He that giveth answer before he heareth, It is folly and shame unto him. ";
yng[13] = "Whoso is answering a matter before he heareth, Folly it is to him and shame.";
dby[13] = "He that giveth answer before he heareth, it is folly and shame unto him.";
web[13] = "He that answereth a matter before he heareth [it], it [is] folly and shame to him.";
hnv[13] = "He who gives answer before he hears, That is folly and shame to him.";
vul[13] = "qui prius respondit quam audiat stultum se esse demonstrat et confusione dignum";
kjv[14] = "The spirit of a man will sustain his infirmity; but a wounded spirit who can bear?";
rsv[14] = "A man\'s spirit will endure sickness; but a broken spirit who can bear?";
asv[14] = "The spirit of a man will sustain his infirmity; But a broken spirit who can bear? ";
yng[14] = "The spirit of a man sustaineth his sickness, And a smitten spirit who doth bear?";
dby[14] = "The spirit of a man sustaineth his infirmity; but a broken spirit who can bear?";
web[14] = "The spirit of a man will sustain his infirmity; but a wounded spirit who can bear?";
hnv[14] = "A man\'s spirit will sustain him in sickness, But a crushed spirit, who can bear?";
vul[14] = "spiritus viri sustentat inbecillitatem suam spiritum vero ad irascendum facilem quis poterit sustinere";
kjv[15] = "The heart of the prudent getteth knowledge; and the ear of the wise seeketh knowledge.";
rsv[15] = "An intelligent mind acquires knowledge, and the ear of the wise seeks knowledge.";
asv[15] = "The heart of the prudent getteth knowledge; And the ear of the wise seeketh knowledge. ";
yng[15] = "The heart of the intelligent getteth knowledge, And the ear of the wise seeketh knowledge.";
dby[15] = "The heart of an intelligent [man] getteth knowledge, and the ear of the wise seeketh knowledge.";
web[15] = "The heart of the prudent getteth knowledge; and the ear of the wise seeketh knowledge.";
hnv[15] = "The heart of the discerning gets knowledge. The ear of the wise seeks knowledge.";
vul[15] = "cor prudens possidebit scientiam et auris sapientium quaerit doctrinam";
kjv[16] = "A man\'s gift maketh room for him, and bringeth him before great men.";
rsv[16] = "A man\'s gift makes room for him and brings him before great men.";
asv[16] = "A man\'s gift maketh room for him, And bringeth him before great men. ";
yng[16] = "The gift of a man maketh room for him, And before the great it leadeth him.";
dby[16] = "A man\'s gift maketh room for him, and bringeth him before great men.";
web[16] = "A man\'s gift maketh room for him, and bringeth him before great men.";
hnv[16] = "A man\'s gift makes room for him, And brings him before great men.";
vul[16] = "donum hominis dilatat viam eius et ante principes spatium ei facit";
kjv[17] = "[He that is] first in his own cause [seemeth] just; but his neighbour cometh and searcheth him.";
rsv[17] = "He who states his case first seems right, until the other comes and examines him.";
asv[17] = "He that pleadeth his cause first [seemeth] just; But his neighbor cometh and searcheth him out. ";
yng[17] = "Righteous [is] the first in his own cause, His neighbour cometh and hath searched him.";
dby[17] = "He that is first in his own cause [seemeth] just; but his neighbour cometh and searcheth him.";
web[17] = "[He that is] first in his own cause [seemeth] just; but his neighbor cometh and searcheth him.";
hnv[17] = "He who pleads his cause first seems right; Until another comes and questions him.";
vul[17] = "iustus prior est accusator sui venit amicus eius et investigavit eum";
kjv[18] = "The lot causeth contentions to cease, and parteth between the mighty.";
rsv[18] = "The lot puts an end to disputes and decides between powerful contenders.";
asv[18] = "The lot causeth contentions to cease, And parteth between the mighty. ";
yng[18] = "The lot causeth contentions to cease, And between the mighty it separateth.";
dby[18] = "The lot causeth contentions to cease, and parteth between the mighty.";
web[18] = "The lot causeth contentions to cease, and parteth between the mighty.";
hnv[18] = "The lot settles disputes, And keeps strong ones apart.";
vul[18] = "contradictiones conprimit sors et inter potentes quoque diiudicat";
kjv[19] = "A brother offended [is harder to be won] than a strong city: and [their] contentions [are] like the bars of a castle.";
rsv[19] = "A brother helped is like a strong city, but quarreling is like the bars of a castle.";
asv[19] = "A brother offended [is harder to be won] than a strong city; And [such] contentions are like the bars of a castle. ";
yng[19] = "A brother transgressed against is as a strong city, And contentions as the bar of a palace.";
dby[19] = "A brother offended is [harder to be won] than a strong city; and contentions are as the bars of a palace.";
web[19] = "A brother offended [is harder to be won] than a strong city: and [their] contentions [are] like the bars of a castle.";
hnv[19] = "A brother offended is more difficult than a fortified city; And disputes are like the bars of a castle.";
vul[19] = "frater qui adiuvatur a fratre quasi civitas firma et iudicia quasi vectes urbium";
kjv[20] = "A man\'s belly shall be satisfied with the fruit of his mouth; [and] with the increase of his lips shall he be filled.";
rsv[20] = "From the fruit of his mouth a man is satisfied; he is satisfied by the yield of his lips.";
asv[20] = "A man\'s belly shall be filled with the fruit of his mouth; With the increase of his lips shall he be satisfied. ";
yng[20] = "From the fruit of a man\'s mouth is his belly satisfied, [From the] increase of his lips he is satisfied.";
dby[20] = "A man\'s belly is satisfied with the fruit of his mouth; with the increase of his lips is he satisfied.";
web[20] = "A man\'s belly shall be satisfied with the fruit of his mouth; [and] with the increase of his lips shall he be filled.";
hnv[20] = "A man\'s stomach is filled with the fruit of his mouth. With the harvest of his lips he is satisfied.";
vul[20] = "de fructu oris viri replebitur venter eius et genimina labiorum illius saturabunt eum";

kjv[22] = "[Whoso] findeth a wife findeth a good [thing], and obtaineth favour of the LORD.";
rsv[22] = "He who finds a wife finds a good thing, and obtains favor from the LORD.";
asv[22] = "Whoso findeth a wife findeth a good thing, And obtaineth favor of Jehovah. ";
yng[22] = "[Whoso] hath found a wife hath found good, And bringeth out good-will from Jehovah.";
dby[22] = "Whoso hath found a wife hath found a good thing, and hath obtained favour from Jehovah.";
web[22] = "[Whoever] findeth a wife findeth a good [thing], and obtaineth favor from the LORD.";
hnv[22] = "Whoever finds a wife finds a good thing, And obtains favor of the LORD.";
vul[22] = "qui invenit mulierem invenit bonum et hauriet iucunditatem a Domino";
kjv[23] = "The poor useth intreaties; but the rich answereth roughly.";
rsv[23] = "The poor use entreaties, but the rich answer roughly.";
asv[23] = "The poor useth entreaties; But the rich answereth roughly. ";
yng[23] = "[With] supplications doth the poor speak, And the rich answereth fierce things.";
dby[23] = "He that is poor speaketh with supplications, but the rich answereth roughly.";
web[23] = "The poor useth entreaties; but the rich answereth roughly.";
hnv[23] = "The poor plead for mercy, But the rich answer harshly.";
vul[23] = "cum obsecrationibus loquetur pauper et dives effabitur rigide";
kjv[24] = "A man [that hath] friends must shew himself friendly: and there is a friend [that] sticketh closer than a brother.";
rsv[24] = "There are friends who pretend to be friends, but there is a friend who sticks closer than a brother.";
asv[24] = "He that maketh many friends [doeth it] to his own destruction; But there is a friend that sticketh closer than a brother. ";
yng[24] = "A man with friends [is] to show himself friendly, And there is a lover adhering more than a brother!";
dby[24] = "A man of [many] friends will come to ruin but there is a friend [that] sticketh closer than a brother.";
web[24] = "A man [that hath] friends must show himself friendly: and there is a friend [that] sticketh closer than a brother.";
hnv[24] = "A man of many companions may be ruined, But there is a friend who sticks closer than a brother.";
vul[24] = "vir amicalis ad societatem magis amicus erit quam frater";
