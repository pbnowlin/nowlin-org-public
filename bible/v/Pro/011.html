csb[1] = "Dishonest scales are detestable to the LORD, but an accurate weight is his delight.";
csb[2] = "When arrogance comes, disgrace follows, but with humility comes wisdom.";
csb[3] = "The integrity of the upright guides them, but the perversity of the treacherous destroys them.";
csb[4] = "Wealth is not profitable on a day of wrath, but righteousness rescues from death.";
csb[5] = "The righteousness of the blameless clears his path, but the wicked person will fall because of his wickedness.";
csb[6] = "The righteousness of the upright rescues them, but the treacherous are trapped by their own desires.";
csb[7] = "When the wicked person dies, his expectation comes to nothing, and hope placed in wealth vanishes.";
csb[8] = "The righteous one is rescued from trouble; in his place, the wicked one goes in.";
csb[9] = "With his mouth the ungodly destroys his neighbor, but through knowledge the righteous are rescued.";
csb[10] = "When the righteous thrive, a city rejoices; when the wicked die, there is joyful shouting.";
csb[11] = "A city is built up by the blessing of the upright, but it is torn down by the mouth of the wicked.";
csb[12] = "Whoever shows contempt for his neighbor lacks sense, but a person with understanding keeps silent.";
csb[13] = "A gossip goes around revealing a secret, but a trustworthy person keeps a confidence.";
csb[14] = "Without guidance, a people will fall, but with many counselors there is deliverance.";
csb[15] = "If someone puts up security for a stranger, he will suffer for it, but the one who hates such agreements is protected.";
csb[16] = "A gracious woman gains honor, but violent people gain only riches.";
csb[17] = "A kind man benefits himself, but a cruel person brings ruin on himself.";
csb[18] = "The wicked person earns an empty wage, but the one who sows righteousness, a true reward.";
csb[19] = "Genuine righteousness leads to life, but pursuing evil leads to death.";
csb[20] = "Those with twisted minds are detestable to the LORD, but those with blameless conduct are his delight.";
csb[21] = "Be assured that a wicked person will not go unpunished, but the offspring of the righteous will escape.";
csb[22] = "A beautiful woman who rejects good sense is like a gold ring in a pig\'s snout.";
csb[23] = "The desire of the righteous turns out well, but the hope of the wicked leads to wrath.";
csb[24] = "One person gives freely, yet gains more; another withholds what is right, only to become poor.";
csb[25] = "A generous person will be enriched, and the one who gives a drink of water will receive water.";
csb[26] = "People will curse anyone who hoards grain, but a blessing will come to the one who sells it.";
csb[27] = "The one who searches for what is good seeks favor, but if someone looks for trouble, it will come to him.";
csb[28] = "Anyone trusting in his riches will fall, but the righteous will flourish like foliage.";
csb[29] = "The one who brings ruin on his household will inherit the wind, and a fool will be a slave to someone whose heart is wise.";
csb[30] = "The fruit of the righteous is a tree of life, and a wise person captivates people.&#x2009;";
csb[31] = "If the righteous will be repaid on earth, how much more the wicked and sinful.";
