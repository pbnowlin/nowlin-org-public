csb[1] = "One who becomes stiff-necked, after many reprimands will be shattered instantly -- beyond recovery.";
csb[2] = "When the righteous flourish, the people rejoice, but when the wicked rule, people groan.";
csb[3] = "A man who loves wisdom brings joy to his father, but one who consorts with prostitutes destroys his wealth.";
csb[4] = "By justice a king brings stability to a land, but a person who demands &quot;contributions&quot; demolishes it.";
csb[5] = "A person who flatters his neighbor spreads a net for his feet.";
csb[6] = "An evil person is caught by sin, but the righteous one sings and rejoices.";
csb[7] = "The righteous person knows the rights of the poor, but the wicked one does not understand these concerns.";
csb[8] = "Mockers inflame a city, but the wise turn away anger.";
csb[9] = "If a wise person goes to court with a fool, there will be ranting and raving but no resolution.";
csb[10] = "Bloodthirsty men hate an honest person, but the upright care about him.";
csb[11] = "A fool gives full vent to his anger, but a wise person holds it in check.";
csb[12] = "If a ruler listens to lies, all his officials will be wicked.";
csb[13] = "The poor and the oppressor have this in common: the LORD gives light to the eyes of both.";
csb[14] = "A king who judges the poor with fairness -- his throne will be established forever.";
csb[15] = "A rod of correction imparts wisdom, but a youth left to himself is a disgrace to his mother.";
csb[16] = "When the wicked increase, rebellion increases, but the righteous will see their downfall.";
csb[17] = "Discipline your child, and it will bring you peace of mind and give you delight.";
csb[18] = "Without revelation people run wild, but one who follows divine instruction will be happy.";
csb[19] = "A servant cannot be disciplined by words; though he understands, he doesn\'t respond.";
csb[20] = "Do you see someone who speaks too soon? There is more hope for a fool than for him.";
csb[21] = "A servant pampered from his youth will become arrogant later on.";
csb[22] = "An angry person stirs up conflict, and a hot-tempered one increases rebellion.";
csb[23] = "A person\'s pride will humble him, but a humble spirit will gain honor.";
csb[24] = "To be a thief\'s partner is to hate oneself; he hears the curse but will not testify.";
csb[25] = "The fear of mankind is a snare, but the one who trusts in the LORD is protected.";
csb[26] = "Many desire a ruler\'s favor, but a person receives justice from the LORD.";
csb[27] = "An unjust person is detestable to the righteous, and one whose way is upright is detestable to the wicked.";
kjv[1] = "He, that being often reproved hardeneth [his] neck, shall suddenly be destroyed, and that without remedy.";
rsv[1] = "He who is often reproved, yet stiffens his neck will suddenly be broken beyond healing.";
asv[1] = "He that being often reproved hardeneth his neck Shall suddenly be destroyed, and that without remedy. ";
yng[1] = "A man often reproved, hardening the neck, Is suddenly broken, and there is no healing.";
dby[1] = "He that being often reproved hardeneth his neck, shall suddenly be destroyed, and without remedy.";
web[1] = "He, that being often reproved hardeneth [his] neck, shall suddenly be destroyed, and that without remedy.";
hnv[1] = "He who is often rebuked and stiffens his neck Will be destroyed suddenly, with no remedy.";
vul[1] = "viro qui corripientem dura cervice contemnit repentinus superveniet interitus et eum sanitas non sequitur";
kjv[2] = "When the righteous are in authority, the people rejoice: but when the wicked beareth rule, the people mourn.";
rsv[2] = "When the righteous are in authority, the people rejoice; but when the wicked rule, the people groan.";
asv[2] = "When the righteous are increased, the people rejoice; But when a wicked man beareth rule, the people sigh. ";
yng[2] = "In the multiplying of the righteous the people rejoice, And in the ruling of the wicked the people sigh.";
dby[2] = "When the righteous increase, the people rejoice; but when the wicked beareth rule, the people mourn.";
web[2] = "When the righteous are in authority, the people rejoice: but when the wicked beareth rule, the people mourn.";
hnv[2] = "When the righteous thrive, the people rejoice; But when the wicked rule, the people groan.";
vul[2] = "in multiplicatione iustorum laetabitur vulgus cum impii sumpserint principatum gemet populus";
kjv[3] = "Whoso loveth wisdom rejoiceth his father: but he that keepeth company with harlots spendeth [his] substance.";
rsv[3] = "He who loves wisdom makes his father glad, but one who keeps company with harlots squanders his substance.";
asv[3] = "Whoso loveth wisdom rejoiceth his father; But he that keepeth company with harlots wasteth [his] substance. ";
yng[3] = "A man loving wisdom rejoiceth his father, And a friend of harlots destroyeth wealth.";
dby[3] = "Whoso loveth wisdom rejoiceth his father; but he that is a companion of harlots destroyeth [his] substance.";
web[3] = "He that loveth wisdom rejoiceth his father: but he that keepeth company with harlots spendeth [his] substance.";
hnv[3] = "Whoever loves wisdom brings joy to his father; But a companion of prostitutes squanders his wealth.";
vul[3] = "vir qui amat sapientiam laetificat patrem suum qui autem nutrit scorta perdet substantiam";
kjv[4] = "The king by judgment establisheth the land: but he that receiveth gifts overthroweth it.";
rsv[4] = "By justice a king gives stability to the land, but one who exacts gifts ruins it.";
asv[4] = "The king by justice establisheth the land; But he that exacteth gifts overthroweth it. ";
yng[4] = "A king by judgment establisheth a land, And one receiving gifts throweth it down.";
dby[4] = "A king by just judgment establisheth the land; but he that taketh gifts overthroweth it.";
web[4] = "The king by judgment establisheth the land: but he that receiveth gifts overthroweth it.";
hnv[4] = "The king by justice makes the land stable, But he who takes bribes tears it down.";
vul[4] = "rex iustus erigit terram vir avarus destruet eam";
kjv[5] = "A man that flattereth his neighbour spreadeth a net for his feet.";
rsv[5] = "A man who flatters his neighbor spreads a net for his feet.";
asv[5] = "A man that flattereth his neighbor Spreadeth a net for his steps. ";
yng[5] = "A man taking a portion above his neighbour, Spreadeth a net for his own steps.";
dby[5] = "A man that flattereth his neighbour spreadeth a net for his steps.";
web[5] = "A man that flattereth his neighbor spreadeth a net for his feet.";
hnv[5] = "A man who flatters his neighbor, Spreads a net for his feet.";
vul[5] = "homo qui blandis fictisque sermonibus loquitur amico suo rete expandit gressibus eius";
kjv[6] = "In the transgression of an evil man [there is] a snare: but the righteous doth sing and rejoice.";
rsv[6] = "An evil man is ensnared in his transgression, but a righteous man sings and rejoices.";
asv[6] = "In the transgression of an evil man there is a snare; But the righteous doth sing and rejoice. ";
yng[6] = "In the transgression of the evil [is] a snare, And the righteous doth sing and rejoice.";
dby[6] = "In the transgression of an evil man there is a snare; but the righteous shall sing and rejoice.";
web[6] = "In the transgression of an evil man [there is] a snare: but the righteous doth sing and rejoice.";
hnv[6] = "An evil man is snared by his sin, But the righteous can sing and be glad.";
vul[6] = "peccantem virum iniquum involvet laqueus et iustus laudabit atque gaudebit";
kjv[7] = "The righteous considereth the cause of the poor: [but] the wicked regardeth not to know [it].";
rsv[7] = "A righteous man knows the rights of the poor; a wicked man does not understand such knowledge.";
asv[7] = "The righteous taketh knowledge of the cause of the poor; The wicked hath not understanding to know [it]. ";
yng[7] = "The righteous knoweth the plea of the poor, The wicked understandeth not knowledge.";
dby[7] = "The righteous taketh knowledge of the cause of the poor; the wicked understandeth not knowledge.";
web[7] = "The righteous considereth the cause of the poor: [but] the wicked regardeth not to know [it].";
hnv[7] = "The righteous care about justice for the poor. The wicked aren\'t concerned about knowledge.";
vul[7] = "novit iustus causam pauperum impius ignorat scientiam";
kjv[8] = "Scornful men bring a city into a snare: but wise [men] turn away wrath.";
rsv[8] = "Scoffers set a city aflame, but wise men turn away wrath.";
asv[8] = "Scoffers set a city in a flame; But wise men turn away wrath. ";
yng[8] = "Men of scorning ensnare a city, And the wise turn back anger.";
dby[8] = "Scornful men set the city in a flame; but the wise turn away anger.";
web[8] = "Scornful men bring a city into a snare: but wise [men] turn away wrath.";
hnv[8] = "Mockers stir up a city, But wise men turn away anger.";
vul[8] = "homines pestilentes dissipant civitatem sapientes avertunt furorem";
kjv[9] = "[If] a wise man contendeth with a foolish man, whether he rage or laugh, [there is] no rest.";
rsv[9] = "If a wise man has an argument with a fool, the fool only rages and laughs, and there is no quiet.";
asv[9] = "If a wise man hath a controversy with a foolish man, Whether he be angry or laugh, there will be no rest. ";
yng[9] = "A wise man is judged by the foolish man, And he hath been angry, And he hath laughed, and there is no rest.";
dby[9] = "If a wise man contendeth with a fool, whether he rage or laugh, [he] hath no rest.";
web[9] = "[If] a wise man contendeth with a foolish man, whether he rageth or laugheth, [there is] no rest.";
hnv[9] = "If a wise man goes to court with a foolish man, The fool rages or scoffs, and there is no shalom.";
vul[9] = "vir sapiens si cum stulto contenderit sive irascatur sive rideat non inveniet requiem";
kjv[10] = "The bloodthirsty hate the upright: but the just seek his soul.";
rsv[10] = "Bloodthirsty men hate one who is blameless, and the wicked seek his life.";
asv[10] = "The bloodthirsty hate him that is perfect; And as for the upright, they seek his life. ";
yng[10] = "Men of blood hate the perfect, And the upright seek his soul.";
dby[10] = "The bloodthirsty hate the perfect, but the upright care for his soul.";
web[10] = "The blood-thirsty hate the upright: but the just seek his soul.";
hnv[10] = "The bloodthirsty hate a man of integrity; And they seek the life of the upright.";
vul[10] = "viri sanguinum oderunt simplicem iusti quaerunt animam eius";
kjv[11] = "A fool uttereth all his mind: but a wise [man] keepeth it in till afterwards.";
rsv[11] = "A fool gives full vent to his anger, but a wise man quietly holds it back.";
asv[11] = "A fool uttereth all his anger; But a wise man keepeth it back and stilleth it. ";
yng[11] = "A fool bringeth out all his mind, And the wise till afterwards restraineth it.";
dby[11] = "A fool uttereth all his mind; but a wise [man] keepeth it back.";
web[11] = "A fool uttereth all his mind: but a wise [man] keepeth it in till afterwards.";
hnv[11] = "A fool vents all of his anger, But a wise man brings himself under control.";
vul[11] = "totum spiritum suum profert stultus sapiens differt et reservat in posterum";
kjv[12] = "If a ruler hearken to lies, all his servants [are] wicked.";
rsv[12] = "If a ruler listens to falsehood, all his officials will be wicked.";
asv[12] = "If a ruler hearkeneth to falsehood, All his servants are wicked. ";
yng[12] = "A ruler who is attending to lying words, All his ministers [are] wicked.";
dby[12] = "If a ruler hearken to lying words, all his servants are wicked.";
web[12] = "If a ruler hearkeneth to lies, all his servants [are] wicked.";
hnv[12] = "If a ruler listens to lies, All of his officials are wicked.";
vul[12] = "princeps qui libenter audit verba mendacii omnes ministros habebit impios";
kjv[13] = "The poor and the deceitful man meet together: the LORD lighteneth both their eyes.";
rsv[13] = "The poor man and the oppressor meet together; the LORD gives light to the eyes of both.";
asv[13] = "The poor man and the oppressor meet together; Jehovah lighteneth the eyes of them both. ";
yng[13] = "The poor and the man of frauds have met together, Jehovah is enlightening the eyes of them both.";
dby[13] = "The indigent and the oppressor meet together; Jehovah lighteneth the eyes of them both.";
web[13] = "The poor and the deceitful man meet together: the LORD enlighteneth both their eyes.";
hnv[13] = "The poor man and the oppressor have this in common: The LORD gives sight to the eyes of both.";
vul[13] = "pauper et creditor obviam fuerunt sibi utriusque inluminator est Dominus";
kjv[14] = "The king that faithfully judgeth the poor, his throne shall be established for ever.";
rsv[14] = "If a king judges the poor with equity his throne will be established for ever.";
asv[14] = "The king that faithfully judgeth the poor, His throne shall be established for ever. ";
yng[14] = "a king that is judging truly the poor, His throne for ever is established.";
dby[14] = "A king that faithfully judgeth the poor, his throne shall be established for ever.";
web[14] = "The king that faithfully judgeth the poor, his throne shall be established for ever.";
hnv[14] = "The king who fairly judges the poor, His throne shall be established forever.";
vul[14] = "rex qui iudicat in veritate pauperes thronus eius in aeternum firmabitur";
kjv[15] = "The rod and reproof give wisdom: but a child left [to himself] bringeth his mother to shame.";
rsv[15] = "The rod and reproof give wisdom, but a child left to himself brings shame to his mother.";
asv[15] = "The rod and reproof give wisdom; But a child left to himself causeth shame to his mother. ";
yng[15] = "A rod and reproof give wisdom, And a youth let away is shaming his mother.";
dby[15] = "The rod and reproof give wisdom; but a child left [to himself] bringeth his mother to shame.";
web[15] = "The rod and reproof give wisdom: but a child left [to himself] bringeth his mother to shame.";
hnv[15] = "The rod of correction gives wisdom, But a child left to himself causes shame to his mother.";
vul[15] = "virga atque correptio tribuet sapientiam puer autem qui dimittitur voluntati suae confundet matrem suam";
kjv[16] = "When the wicked are multiplied, transgression increaseth: but the righteous shall see their fall.";
rsv[16] = "When the wicked are in authority, transgression increases; but the righteous will look upon their downfall.";
asv[16] = "When the wicked are increased, transgression increaseth; But the righteous shall look upon their fall. ";
yng[16] = "In the multiplying of the wicked transgression multiplieth, And the righteous on their fall do look.";
dby[16] = "When the wicked increase, transgression increaseth; but the righteous shall see their fall.";
web[16] = "When the wicked are multiplied, transgression increaseth: but the righteous shall see their fall.";
hnv[16] = "When the wicked increase, sin increases; But the righteous will see their downfall.";
vul[16] = "in multiplicatione impiorum multiplicabuntur scelera et iusti ruinas eorum videbunt";
kjv[17] = "Correct thy son, and he shall give thee rest; yea, he shall give delight unto thy soul.";
rsv[17] = "Discipline your son, and he will give you rest; he will give delight to your heart.";
asv[17] = "Correct thy son, and he will give thee rest; Yea, he will give delight unto thy soul. ";
yng[17] = "Chastise thy son, and he giveth thee comfort, Yea, he giveth delights to thy soul.";
dby[17] = "Chasten thy son, and he shall give thee rest, and shall give delight unto thy soul.";
web[17] = "Correct thy son, and he shall give thee rest; yes, he shall give delight to thy soul.";
hnv[17] = "Correct your son, and he will give you shalom; Yes, he will bring delight to your soul.";
vul[17] = "erudi filium tuum et refrigerabit te et dabit delicias animae tuae";
kjv[18] = "Where [there is] no vision, the people perish: but he that keepeth the law, happy [is] he.";
rsv[18] = "Where there is no prophecy the people cast off restraint, but blessed is he who keeps the law.";
asv[18] = "Where there is no vision, the people cast off restraint; But he that keepeth the law, happy is he. ";
yng[18] = "Without a Vision is a people made naked, And whoso is keeping the law, O his happiness!";
dby[18] = "Where there is no vision the people cast off restraint; but happy is he that keepeth the law.";
web[18] = "Where [there is] no vision, the people perish: but he that keepeth the law, happy [is] he.";
hnv[18] = "Where there is no revelation, the people cast off restraint; But one who keeps the law is blessed.";
vul[18] = "cum prophetia defecerit dissipabitur populus qui custodit legem beatus est";
kjv[19] = "A servant will not be corrected by words: for though he understand he will not answer.";
rsv[19] = "By mere words a servant is not disciplined, for though he understands, he will not give heed.";
asv[19] = "A servant will not be corrected by words; For though he understand, he will not give heed. ";
yng[19] = "By words a servant is not instructed though he understand, And there is nothing answering.";
dby[19] = "A servant is not corrected by words: he understandeth indeed, but he will not answer.";
web[19] = "A servant will not be corrected by words: for though he understandeth, he will not answer.";
hnv[19] = "A servant can\'t be corrected by words. Though he understands, yet he will not respond.";
vul[19] = "servus verbis non potest erudiri quia quod dicis intellegit et respondere contemnit";
kjv[20] = "Seest thou a man [that is] hasty in his words? [there is] more hope of a fool than of him.";
rsv[20] = "Do you see a man who is hasty in his words? There is more hope for a fool than for him.";
asv[20] = "Seest thou a man that is hasty in his words? There is more hope of a fool than of him. ";
yng[20] = "Thou hast seen a man hasty in his words! More hope of a fool than of him.";
dby[20] = "Hast thou seen a man hasty in his words? there is more hope of a fool than of him.";
web[20] = "Seest thou a man [that is] hasty in his words? [there is] more hope of a fool than of him.";
hnv[20] = "Do you see a man who is hasty in his words? There is more hope for a fool than for him.";
vul[20] = "vidisti hominem velocem ad loquendum stulti magis speranda est quam illius correptio";
kjv[21] = "He that delicately bringeth up his servant from a child shall have him become [his] son at the length.";
rsv[21] = "He who pampers his servant from childhood, will in the end find him his heir.";
asv[21] = "He that delicately bringeth up his servant from a child Shall have him become a son at the last. ";
yng[21] = "Whoso is bringing up his servant delicately, from youth, [At] his latter end also he is continuator.";
dby[21] = "He that delicately bringeth up his servant from a child, shall in the end have him as a son.";
web[21] = "He that delicately bringeth up his servant from a child shall have him at length become [his] son.";
hnv[21] = "He who pampers his servant from youth Will have him become a son in the end.";
vul[21] = "qui delicate a pueritia nutrit servum suum postea illum sentiet contumacem";
kjv[22] = "An angry man stirreth up strife, and a furious man aboundeth in transgression.";
rsv[22] = "A man of wrath stirs up strife, and a man given to anger causes much transgression.";
asv[22] = "An angry man stirreth up strife, And a wrathful man aboundeth in transgression. ";
yng[22] = "An angry man stirreth up contention, And a furious man is multiplying transgression.";
dby[22] = "An angry man exciteth contention; and a furious man aboundeth in transgression.";
web[22] = "An angry man stirreth up strife, and a furious man aboundeth in transgression.";
hnv[22] = "An angry man stirs up strife, And a wrathful man abounds in sin.";
vul[22] = "vir iracundus provocat rixas et qui ad indignandum facilis est erit ad peccata proclivior";
kjv[23] = "A man\'s pride shall bring him low: but honour shall uphold the humble in spirit.";
rsv[23] = "A man\'s pride will bring him low, but he who is lowly in spirit will obtain honor.";
asv[23] = "A man\'s pride shall bring him low; But he that is of a lowly spirit shall obtain honor. ";
yng[23] = "The pride of man humbleth him, And humility of spirit upholdeth honour.";
dby[23] = "A man\'s pride bringeth him low; but the humble in spirit shall obtain honour.";
web[23] = "A man\'s pride shall bring him low: but honor shall uphold the humble in spirit.";
hnv[23] = "A man\'s pride brings him low, But one of lowly spirit gains honor.";
vul[23] = "superbum sequitur humilitas et humilem spiritu suscipiet gloria";
kjv[24] = "Whoso is partner with a thief hateth his own soul: he heareth cursing, and bewrayeth [it] not.";
rsv[24] = "The partner of a thief hates his own life; he hears the curse, but discloses nothing.";
asv[24] = "Whoso is partner with a thief hateth his own soul; He heareth the adjuration and uttereth nothing. ";
yng[24] = "Whoso is sharing with a thief is hating his own soul, Execration he heareth, and telleth not.";
dby[24] = "Whoso shareth with a thief hateth his own soul: he heareth the adjuration, and declareth not.";
web[24] = "Whoever is partner with a thief, hateth his own soul: he heareth cursing, and discloseth [it] not.";
hnv[24] = "Whoever is an accomplice of a thief is an enemy of his own soul. He takes an oath, but dares not testify.";
vul[24] = "qui cum fure partitur odit animam suam adiurantem audit et non indicat";
kjv[25] = "The fear of man bringeth a snare: but whoso putteth his trust in the LORD shall be safe.";
rsv[25] = "The fear of man lays a snare, but he who trusts in the LORD is safe.";
asv[25] = "The fear of man bringeth a snare; But whoso putteth his trust in Jehovah shall be safe. ";
yng[25] = "Fear of man causeth a snare, And the confident in Jehovah is set on high.";
dby[25] = "The fear of man bringeth a snare; but whoso putteth his confidence in Jehovah is protected.";
web[25] = "The fear of man bringeth a snare: but he who putteth his trust in the LORD shall be safe.";
hnv[25] = "The fear of man proves to be a snare, But whoever puts his trust in the LORD is kept safe.";
vul[25] = "qui timet hominem cito corruet qui sperat in Domino sublevabitur";
kjv[26] = "Many seek the ruler\'s favour; but [every] man\'s judgment [cometh] from the LORD.";
rsv[26] = "Many seek the favor of a ruler, but from the LORD a man gets justice.";
asv[26] = "Many seek the ruler\'s favor; But a man\'s judgment [cometh] from Jehovah. ";
yng[26] = "Many are seeking the face of a ruler, And from Jehovah [is] the judgment of each.";
dby[26] = "Many seek the ruler\'s face; but a man\'s right judgment is from Jehovah.";
web[26] = "Many seek the ruler\'s favor; but [every] man\'s judgment [cometh] from the LORD.";
hnv[26] = "Many seek the ruler\'s favor, But a man\'s justice comes from the LORD.";
vul[26] = "multi requirunt faciem principis et a Domino iudicium egreditur singulorum";
kjv[27] = "An unjust man [is] an abomination to the just: and [he that is] upright in the way [is] abomination to the wicked.";
rsv[27] = "An unjust man is an abomination to the righteous, but he whose way is straight is an abomination to the wicked.";
asv[27] = "An unjust man is an abomination to the righteous; And he that is upright in the way is an abomination to the wicked. ";
yng[27] = "An abomination to the righteous [is] the perverse man, And an abomination to the wicked [is] the upright in the way!";
dby[27] = "An unjust man is an abomination to the righteous; and he that is of upright way is an abomination to the wicked [man].";
web[27] = "An unjust man [is] an abomination to the just: and [he that is] upright in the way [is] abomination to the wicked.";
hnv[27] = "A dishonest man detests the righteous, And the upright in their ways detest the wicked.";
vul[27] = "abominantur iusti virum impium et abominantur impii eos qui in recta sunt via";
