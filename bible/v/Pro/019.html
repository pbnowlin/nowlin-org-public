csb[1] = "Better a poor person who lives with integrity than someone who has deceitful lips and is a fool.";
csb[2] = "Even zeal is not good without knowledge, and the one who acts hastily sins.";
csb[3] = "A person\'s own foolishness leads him astray, yet his heart rages against the LORD.";
csb[4] = "Wealth attracts many friends, but a poor person is separated from his friend.";
csb[5] = "A false witness will not go unpunished, and one who utters lies will not escape.";
csb[6] = "Many seek a ruler\'s favor, and everyone is a friend of one who gives gifts.";
csb[7] = "All the brothers of a poor person hate him; how much more do his friends keep their distance from him! He may pursue them with words, but they are not there.";
csb[8] = "The one who acquires good sense loves himself; one who safeguards understanding finds success.";
csb[9] = "A false witness will not go unpunished, and one who utters lies perishes.";
csb[10] = "Luxury is not appropriate for a fool -- how much less for a slave to rule over princes!";
csb[11] = "A person\'s insight gives him patience, and his virtue is to overlook an offense.";
csb[12] = "A king\'s rage is like the roaring of a lion, but his favor is like dew on the grass.";
csb[13] = "A foolish son is his father\'s ruin, and a wife\'s nagging is an endless dripping.";
csb[14] = "A house and wealth are inherited from fathers, but a prudent wife is from the LORD.";
csb[15] = "Laziness induces deep sleep, and a lazy person will go hungry.";
csb[16] = "The one who keeps commands preserves himself; one who disregards his ways will die.";
csb[17] = "Kindness to the poor is a loan to the LORD, and he will give a reward to the lender.";
csb[18] = "Discipline your son while there is hope; don\'t set your heart on being the cause of his death.";
csb[19] = "A person with intense anger bears the penalty; if you rescue him, you\'ll have to do it again.";
csb[20] = "Listen to counsel and receive instruction so that you may be wise later in life.";
csb[21] = "Many plans are in a person\'s heart, but the LORD\'s decree will prevail.";
csb[22] = "What is desirable in a person is his fidelity; better to be a poor person than a liar.";
csb[23] = "The fear of the LORD leads to life; one will sleep at night without danger.";
csb[24] = "The slacker buries his hand in the bowl; he doesn\'t even bring it back to his mouth!";
csb[25] = "Strike a mocker, and the inexperienced learn a lesson; rebuke the discerning, and he gains knowledge.";
csb[26] = "The one who plunders his father and evicts his mother is a disgraceful and shameful son.";
csb[27] = "If you stop listening to correction, my son, you will stray from the words of knowledge.";
csb[28] = "A worthless witness mocks justice, and a wicked mouth swallows iniquity.";
csb[29] = "Judgments are prepared for mockers, and beatings for the backs of fools.";
kjv[1] = "Better [is] the poor that walketh in his integrity, than [he that is] perverse in his lips, and is a fool.";
rsv[1] = "Better is a poor man who walks in his integrity than a man who is perverse in speech, and is a fool.";
asv[1] = "Better is the poor that walketh in his integrity Than he that is perverse in his lips and is a fool. ";
yng[1] = "Better [is] the poor walking in his integrity, Than the perverse [in] his lips, who [is] a fool.";
dby[1] = "Better is a poor [man] that walketh in his integrity, than he that is perverse in his lips, and is a fool.";
web[1] = "Better [is] the poor that walketh in his integrity, than [he that is] perverse in his lips, and is a fool.";
hnv[1] = "Better is the poor who walks in his integrity Than he who is perverse in his lips and is a fool.";
vul[1] = "melior est pauper qui ambulat in simplicitate sua quam torquens labia insipiens";
kjv[2] = "Also, [that] the soul [be] without knowledge, [it is] not good; and he that hasteth with [his] feet sinneth.";
rsv[2] = "It is not good for a man to be without knowledge, and he who makes haste with his feet misses his way.";
asv[2] = "Also, that the soul be without knowledge is not good; And he that hasteth with his feet sinneth. ";
yng[2] = "Also, without knowledge the soul [is] not good, And the hasty in feet is sinning.";
dby[2] = "Also that a person be without knowledge is not good; and he that hasteth with his feet maketh false steps.";
web[2] = "Also, [that] the soul [be] without knowledge, [it is] not good; and he that hasteth with [his] feet sinneth.";
hnv[2] = "It isn\'t good to have zeal without knowledge; Nor being hasty with one\'s feet and missing the way.";
vul[2] = "ubi non est scientia animae non est bonum et qui festinus est pedibus offendit";
kjv[3] = "The foolishness of man perverteth his way: and his heart fretteth against the LORD.";
rsv[3] = "When a man\'s folly brings his way to ruin, his heart rages against the LORD.";
asv[3] = "The foolishness of man subverteth his way; And his heart fretteth against Jehovah. ";
yng[3] = "The folly of man perverteth his way, And against Jehovah is his heart wroth.";
dby[3] = "The folly of man distorteth his way, and his heart is irritated against Jehovah.";
web[3] = "The foolishness of man perverteth his way: and his heart fretteth against the LORD.";
hnv[3] = "The foolishness of man subverts his way; His heart rages against the LORD.";
vul[3] = "stultitia hominis subplantat gressus eius et contra Deum fervet animo suo";
kjv[4] = "Wealth maketh many friends; but the poor is separated from his neighbour.";
rsv[4] = "Wealth brings many new friends, but a poor man is deserted by his friend.";
asv[4] = "Wealth addeth many friends; But the poor is separated from his friend. ";
yng[4] = "Wealth addeth many friends, And the poor from his neighbour is separated.";
dby[4] = "Wealth addeth many friends; but the poor is separated from his friend.";
web[4] = "Wealth maketh many friends; but the poor is separated from his neighbor.";
hnv[4] = "Wealth adds many friends, But the poor is separated from his friend.";
vul[4] = "divitiae addunt amicos plurimos a paupere autem et hii quos habuit separantur";
kjv[5] = "A false witness shall not be unpunished, and [he that] speaketh lies shall not escape.";
rsv[5] = "A false witness will not go unpunished, and he who utters lies will not escape.";
asv[5] = "A false witness shall not be unpunished; And he that uttereth lies shall not escape. ";
yng[5] = "A false witness is not acquitted, Whoso breatheth out lies is not delivered.";
dby[5] = "A false witness shall not be held innocent, and he that uttereth lies shall not escape.";
web[5] = "A false witness shall not be unpunished, and [he that] speaketh lies shall not escape.";
hnv[5] = "A false witness shall not be unpunished. He who pours out lies shall not go free.";
vul[5] = "testis falsus non erit inpunitus et qui mendacia loquitur non effugiet";
kjv[6] = "Many will intreat the favour of the prince: and every man [is] a friend to him that giveth gifts.";
rsv[6] = "Many seek the favor of a generous man, and every one is a friend to a man who gives gifts.";
asv[6] = "Many will entreat the favor of the liberal man; And every man is a friend to him that giveth gifts. ";
yng[6] = "Many entreat the face of the noble, And all have made friendship to a man of gifts.";
dby[6] = "Many court the favour of a noble; and every one is friend to a man that giveth.";
web[6] = "Many will entreat the favor of the prince: and every man [is] a friend to him that giveth gifts.";
hnv[6] = "Many will entreat the favor of a ruler, And everyone is a friend to a man who gives gifts.";

kjv[7] = "All the brethren of the poor do hate him: how much more do his friends go far from him? he pursueth [them with] words, [yet] they [are] wanting [to him].";
rsv[7] = "All a poor man\'s brothers hate him; how much more do his friends go far from him! He pursues them with words, but does not have them.";
asv[7] = "All the brethren of the poor do hate him: How much more do his friends go far from him! He pursueth [them with] words, [but] they are gone. ";
yng[7] = "All the brethren of the poor have hated him, Surely also his friends have been far from him, He is pursuing words -- they are not!";
dby[7] = "All the brethren of a poor [man] hate him; how much more do his friends go far from him: he pursueth [them] with words, -- they are not [to be found].";
web[7] = "All the brethren of the poor do hate him: how much more do his friends go far from him? he pursueth [them with] words, [yet] they [are] wanting [to him].";
hnv[7] = "All the relatives of the poor shun him: How much more do his friends avoid him! He pursues them with pleas, but they are gone.";

rsv[8] = "He who gets wisdom loves himself; he who keeps understanding will prosper.";
asv[8] = "He that getteth wisdom loveth his own soul: He that keepeth understanding shall find good. ";
yng[8] = "Whoso is getting heart is loving his soul, He is keeping understanding to find good.";
dby[8] = "He that getteth sense loveth his own soul; he that keepeth understanding shall find good.";
web[8] = "He that getteth wisdom loveth his own soul: he that keepeth understanding shall find good.";
hnv[8] = "He who gets wisdom loves his own soul. He who keeps understanding shall find good.";

kjv[10] = "Delight is not seemly for a fool; much less for a servant to have rule over princes.";
rsv[10] = "It is not fitting for a fool to live in luxury, much less for a slave to rule over princes.";
asv[10] = "Delicate living is not seemly for a fool; Much less for a servant to have rule over princes. ";
yng[10] = "Luxury is not comely for a fool, Much less for a servant to rule among princes.";
dby[10] = "Good living beseemeth not a fool; how much less for a servant to have rule over princes.";
web[10] = "Delight is not seemly for a fool; much less for a servant to have rule over princes.";
hnv[10] = "Delicate living is not appropriate for a fool, Much less for a servant to have rule over princes.";
vul[10] = "non decent stultum deliciae nec servum dominari principibus";
kjv[11] = "The discretion of a man deferreth his anger; and [it is] his glory to pass over a transgression.";
rsv[11] = "Good sense makes a man slow to anger, and it is his glory to overlook an offense.";
asv[11] = "The discretion of a man maketh him slow to anger; And it is his glory to pass over a transgression. ";
yng[11] = "The wisdom of a man hath deferred his anger, And his glory [is] to pass over transgression.";
dby[11] = "The discretion of a man maketh him slow to anger, and it is his glory to pass over a transgression.";
web[11] = "The discretion of a man deferreth his anger; and [it is] his glory to pass over a transgression.";
hnv[11] = "The discretion of a man makes him slow to anger. It is his glory to overlook an offense.";

rsv[12] = "A king\'s wrath is like the growling of a lion, but his favor is like dew upon the grass.";
asv[12] = "The king\'s wrath is as the roaring of a lion; But his favor is as dew upon the grass. ";
yng[12] = "The wrath of a king [is] a growl as of a young lion, And as dew on the herb his good-will.";

kjv[13] = "A foolish son [is] the calamity of his father: and the contentions of a wife [are] a continual dropping.";
rsv[13] = "A foolish son is ruin to his father, and a wife\'s quarreling is a continual dripping of rain.";
asv[13] = "A foolish son is the calamity of his father; And the contentions of a wife are a continual dropping. ";
yng[13] = "A calamity to his father [is] a foolish son, And the contentions of a wife [are] a continual dropping.";
dby[13] = "A foolish son is the calamity of his father; and the contentions of a wife are a continual dropping.";
web[13] = "A foolish son [is] the calamity of his father: and the contentions of a wife [are] a continual dropping.";
hnv[13] = "A foolish son is the calamity of his father. A wife\'s quarrels are a continual dripping.";
vul[13] = "dolor patris filius stultus et tecta iugiter perstillantia litigiosa mulier";
kjv[14] = "House and riches [are] the inheritance of fathers: and a prudent wife [is] from the LORD.";
rsv[14] = "House and wealth are inherited from fathers, but a prudent wife is from the LORD.";
asv[14] = "House and riches are an inheritance from fathers; But a prudent wife is from Jehovah. ";
yng[14] = "House and wealth [are] the inheritance of fathers, And from Jehovah [is] an understanding wife.";
dby[14] = "House and wealth are an inheritance from fathers; but a prudent wife is from Jehovah.";

hnv[14] = "House and riches are an inheritance from fathers, But a prudent wife is from the LORD.";

asv[15] = "Slothfulness casteth into a deep sleep; And the idle soul shall suffer hunger. ";
yng[15] = "Sloth causeth deep sleep to fall, And an indolent soul doth hunger.";
dby[15] = "Slothfulness casteth into a deep sleep, and the idle soul shall suffer hunger.";
web[15] = "Slothfulness casteth into a deep sleep; and an idle soul shall suffer hunger.";
hnv[15] = "Slothfulness casts into a deep sleep. The idle soul shall suffer hunger.";

kjv[16] = "He that keepeth the commandment keepeth his own soul; [but] he that despiseth his ways shall die.";

yng[16] = "Whoso is keeping the command is keeping his soul, Whoso is despising His ways dieth.";
dby[16] = "He that keepeth the commandment keepeth his soul; he that is careless of his ways shall die.";

kjv[17] = "He that hath pity upon the poor lendeth unto the LORD; and that which he hath given will he pay him again.";

asv[17] = "He that hath pity upon the poor lendeth unto Jehovah, And his good deed will he pay him again. ";
yng[17] = "Whoso is lending [to] Jehovah is favouring the poor, And his deed He repayeth to him.";
dby[17] = "He that is gracious to the poor lendeth unto Jehovah; and what he hath bestowed will he repay unto him.";
web[17] = "He that hath pity upon the poor, lendeth to the LORD; and that which he hath given will he pay him again.";
hnv[17] = "He who has pity on the poor lends to the LORD; He will reward him.";

kjv[18] = "Chasten thy son while there is hope, and let not thy soul spare for his crying.";
rsv[18] = "Discipline your son while there is hope; do not set your heart on his destruction.";
asv[18] = "Chasten thy son, seeing there is hope; And set not thy heart on his destruction. ";
yng[18] = "Chastise thy son, for there is hope, And to put him to death lift not up thy soul.";
dby[18] = "Chasten thy son, seeing there is hope; but set not thy soul upon killing him.";
web[18] = "Chasten thy son while there is hope, and let not thy soul spare for his crying.";
hnv[18] = "Discipline your son, for there is hope; Don\'t be a willing party to his death.";
vul[18] = "erudi filium tuum ne desperes ad interfectionem autem eius ne ponas animam tuam";

rsv[19] = "A man of great wrath will pay the penalty; for if you deliver him, you will only have to do it again.";
asv[19] = "A man of great wrath shall bear the penalty; For if thou deliver [him], thou must do it yet again. ";
yng[19] = "A man of great wrath is bearing punishment, For, if thou dost deliver, yet again thou dost add.";

web[19] = "A man of great wrath shall suffer punishment: for if thou deliver [him], yet thou must do it again.";

rsv[21] = "Many are the plans in the mind of a man, but it is the purpose of the LORD that will be established.";
asv[21] = "There are many devices in a man\'s heart; But the counsel of Jehovah, that shall stand. ";
yng[21] = "Many [are] the purposes in a man\'s heart, And the counsel of Jehovah it standeth.";
dby[21] = "Many are the thoughts in a man\'s heart, but the counsel of Jehovah, that doth stand.";

hnv[21] = "There are many plans in a man\'s heart, But the LORD\'s counsel will prevail.";
vul[21] = "multae cogitationes in corde viri voluntas autem Domini permanebit";

rsv[22] = "What is desired in a man is loyalty, and a poor man is better than a liar.";
asv[22] = "That which maketh a man to be desired is his kindness; And a poor man is better than a liar. ";
yng[22] = "The desirableness of a man [is] his kindness, And better [is] the poor than a liar.";
dby[22] = "The charm of a man is his kindness; and a poor [man] is better than a liar.";
web[22] = "The desire of a man [is] his kindness: and a poor man [is] better than a liar.";
hnv[22] = "That which makes a man to be desired is his kindness. A poor man is better than a liar.";
vul[22] = "homo indigens misericors est et melior pauper quam vir mendax";

rsv[23] = "The fear of the LORD leads to life; and he who has it rests satisfied; he will not be visited by harm.";
asv[23] = "The fear of Jehovah [tendeth] to life; And he [that hath it] shall abide satisfied; He shall not be visited with evil. ";
yng[23] = "The fear of Jehovah [is] to life, And satisfied he remaineth -- he is not charged with evil.";
dby[23] = "The fear of Jehovah [tendeth] to life, and he [that hath it] shall rest satisfied without being visited with evil.";
web[23] = "The fear of the LORD [tendeth] to life: and [he that hath it] shall abide satisfied; he shall not be visited with evil.";
hnv[23] = "The fear of the LORD leads to life, then contentment; He rests and will not be touched by trouble.";
vul[23] = "timor Domini ad vitam et in plenitudine commorabitur absque visitatione pessimi";

asv[24] = "The sluggard burieth his hand in the dish, And will not so much as bring it to his mouth again. ";
yng[24] = "The slothful hath hidden his hand in a dish, Even unto his mouth he bringeth it not back.";
dby[24] = "A sluggard burieth his hand in the dish, and will not even bring it to his mouth again.";
web[24] = "A slothful [man] hideth his hand in [his] bosom, and will not so much as bring it to his mouth again.";
hnv[24] = "The sluggard buries his hand in the dish; He will not so much as bring it to his mouth again.";
vul[24] = "abscondit piger manum suam sub ascella nec ad os suum adplicat eam";
kjv[25] = "Smite a scorner, and the simple will beware: and reprove one that hath understanding, [and] he will understand knowledge.";

yng[25] = "A scorner smite, and the simple acts prudently, And give reproof to the intelligent, He understandeth knowledge.";
dby[25] = "Smite a scorner, and the simple will beware; reprove the intelligent, and he will understand knowledge.";
web[25] = "Smite a scorner and the simple will beware: and reprove one that hath understanding, [and] he will understand knowledge.";
hnv[25] = "Flog a scoffer, and the simple will learn prudence; Rebuke one who has understanding, and he will gain knowledge.";

asv[26] = "He that doeth violence to his father, and chaseth away his mother, Is a son that causeth shame and bringeth reproach. ";
yng[26] = "Whoso is spoiling a father causeth a mother to flee, A son causing shame, and bringing confusion.";
dby[26] = "He that ruineth [his] father and chaseth away [his] mother is a son that causeth shame and bringeth reproach.";
web[26] = "He that wasteth [his] father, [and] chaseth away [his] mother, [is] a son that causeth shame, and bringeth reproach.";
hnv[26] = "He who robs his father and drives away his mother, Is a son who causes shame and brings reproach.";
vul[26] = "qui adfligit patrem et fugat matrem ignominiosus est et infelix";

rsv[27] = "Cease, my son, to hear instruction only to stray from the words of knowledge.";

yng[27] = "Cease, my son, to hear instruction -- To err from sayings of knowledge.";
dby[27] = "Cease, my son, to hear the instruction which causeth to stray from the words of knowledge.";
web[27] = "Cease, my son, to hear the instruction [that causeth] to err from the words of knowledge.";
hnv[27] = "If you stop listening to instruction, my son, You will stray from the words of knowledge.";
vul[27] = "non cesses fili audire doctrinam nec ignores sermones scientiae";

rsv[28] = "A worthless witness mocks at justice, and the mouth of the wicked devours iniquity.";
asv[28] = "A worthless witness mocketh at justice; And the mouth of the wicked swalloweth iniquity. ";
