csb[1] = "Don\'t envy the evil or desire to be with them,";
csb[2] = "for their hearts plan violence, and their words stir up trouble.";
csb[3] = "A house is built by wisdom, and it is established by understanding;";
csb[4] = "by knowledge the rooms are filled with every precious and beautiful treasure.";
csb[5] = "A wise warrior is better than a strong one, and a man of knowledge than one of strength;";
csb[6] = "for you should wage war with sound guidance -- victory comes with many counselors.";
csb[7] = "Wisdom is inaccessible to a fool; he does not open his mouth at the city gate.";
csb[8] = "The one who plots evil will be called a schemer.";
csb[9] = "A foolish scheme is sin, and a mocker is detestable to people.";
csb[10] = "If you do nothing in a difficult time, your strength is limited.";
csb[11] = "Rescue those being taken off to death, and save those stumbling toward slaughter.";
csb[12] = "If you say, &quot;But we didn\'t know about this,&quot; won\'t he who weighs hearts consider it? Won\'t he who protects your life know? Won\'t he repay a person according to his work?";
csb[13] = "Eat honey, my son, for it is good, and the honeycomb is sweet to your palate;";
csb[14] = "realize that wisdom is the same for you. If you find it, you will have a future, and your hope will never fade.";
csb[15] = "Don\'t set an ambush, you wicked one, at the camp of the righteous man; don\'t destroy his dwelling.";
csb[16] = "Though a righteous person falls seven times, he will get up, but the wicked will stumble into ruin.";
csb[17] = "Don\'t gloat when your enemy falls, and don\'t let your heart rejoice when he stumbles,";
csb[18] = "or the LORD will see, be displeased, and turn his wrath away from him.";
csb[19] = "Don\'t be agitated by evildoers, and don\'t envy the wicked.";
csb[20] = "For the evil have no future; the lamp of the wicked will be put out.";
csb[21] = "My son, fear the LORD, as well as the king, and don\'t associate with rebels,";
csb[22] = "for destruction will come suddenly from them; who knows what distress these two can bring?";
csb[23] = "These sayings also belong to the wise: It is not good to show partiality in judgment.";
csb[24] = "Whoever says to the guilty, &quot;You are innocent&quot; -- peoples will curse him, and nations will denounce him;";
csb[25] = "but it will go well with those who convict the guilty, and a generous blessing will come to them.";
csb[26] = "He who gives an honest answer gives a kiss on the lips.";
csb[27] = "Complete your outdoor work, and prepare your field; afterward, build your house.";
csb[28] = "Don\'t testify against your neighbor without cause. Don\'t deceive with your lips.";
csb[29] = "Don\'t say, &quot;I\'ll do to him what he did to me; I\'ll repay the man for what he has done.&quot;";
csb[30] = "I went by the field of a slacker and by the vineyard of one lacking sense.";
csb[31] = "Thistles had come up everywhere, weeds covered the ground, and the stone wall was ruined.";
csb[32] = "I saw, and took it to heart; I looked, and received instruction:";
csb[33] = "a little sleep, a little slumber, a little folding of the arms to rest,";
csb[34] = "and your poverty will come like a robber, and your need, like a bandit.";
