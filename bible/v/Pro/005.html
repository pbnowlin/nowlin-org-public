csb[1] = "My son, pay attention to my wisdom; listen closely to my understanding";
csb[2] = "so that you may maintain discretion and your lips safeguard knowledge.";
csb[3] = "Though the lips of the forbidden woman drip honey and her words are smoother than oil,";
csb[4] = "in the end she\'s as bitter as wormwood and as sharp as a double-edged sword.";
csb[5] = "Her feet go down to death; her steps head straight for Sheol.";
csb[6] = "She doesn\'t consider the path of life; she doesn\'t know that her ways are unstable.";
csb[7] = "So now, sons, listen to me, and don\'t turn away from the words from my mouth.";
csb[8] = "Keep your way far from her. Don\'t go near the door of her house.";
csb[9] = "Otherwise, you will give up your vitality to others and your years to someone cruel;";
csb[10] = "strangers will drain your resources, and your hard-earned pay will end up in a foreigner\'s house.";
csb[11] = "At the end of your life, you will lament when your physical body has been consumed,";
csb[12] = "and you will say, &quot;How I hated discipline, and how my heart despised correction.";
csb[13] = "&quot;I didn\'t obey my teachers or listen closely to my instructors.";
csb[14] = "&quot;I am on the verge of complete ruin before the entire community.&quot;";
csb[15] = "Drink water from your own cistern, water flowing from your own well.";
csb[16] = "Should your springs flow in the streets, streams in the public squares?";
csb[17] = "They should be for you alone and not for you to share with strangers.";
csb[18] = "Let your fountain be blessed, and take pleasure in the wife of your youth.";
csb[19] = "A loving deer, a graceful doe -- let her breasts always satisfy you; be lost in her love forever.";
csb[20] = "Why, my son, would you lose yourself with a forbidden woman or embrace a wayward woman?";
csb[21] = "For a man\'s ways are before the LORD\'s eyes, and he considers all his paths.";
csb[22] = "A wicked man\'s iniquities will trap him; he will become tangled in the ropes of his own sin.";
csb[23] = "He will die because there is no discipline, and be lost because of his great stupidity.";
