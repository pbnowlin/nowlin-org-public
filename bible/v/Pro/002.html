csb[1] = "My son, if you accept my words and store up my commands within you,";
csb[2] = "listening closely to wisdom and directing your heart to understanding;";
csb[3] = "furthermore, if you call out to insight and lift your voice to understanding,";
csb[4] = "if you seek it like silver and search for it like hidden treasure,";
csb[5] = "then you will understand the fear of the LORD and discover the knowledge of God.";
csb[6] = "For the LORD gives wisdom; from his mouth come knowledge and understanding.";
csb[7] = "He stores up success for the upright; He is a shield for those who live with integrity";
csb[8] = "so that he may guard the paths of justice and protect the way of his faithful followers.";
csb[9] = "Then you will understand righteousness, justice, and integrity -- every good path.";
csb[10] = "For wisdom will enter your heart, and knowledge will delight you.";
csb[11] = "Discretion will watch over you, and understanding will guard you.";
csb[12] = "It will rescue you from the way of evil -- from anyone who says perverse things,";
csb[13] = "from those who abandon the right paths to walk in ways of darkness,";
csb[14] = "from those who enjoy doing evil and celebrate perversion,";
csb[15] = "whose paths are crooked, and whose ways are devious.";
csb[16] = "It will rescue you from a forbidden woman, from a wayward woman with her flattering talk,";
csb[17] = "who abandons the companion of her youth and forgets the covenant of her God;";
csb[18] = "for her house sinks down to death and her ways to the land of the departed spirits.";
csb[19] = "None return who go to her; none reach the paths of life.";
csb[20] = "So follow the way of the good, and keep to the paths of the righteous.";
csb[21] = "For the upright will inhabit the land, and those of integrity will remain in it;";
csb[22] = "but the wicked will be cut off from the land, and the treacherous ripped out of it.";
kjv[1] = "My son, if thou wilt receive my words, and hide my commandments with thee;";

vul[1] = "fili mi si susceperis sermones meos et mandata mea absconderis penes te";

web[2] = "So that thou incline thy ear to wisdom, [and] apply thy heart to understanding;";
hnv[2] = "So as to turn your ear to wisdom, And apply your heart to understanding;";
vul[2] = "ut audiat sapientiam auris tua inclina cor tuum ad noscendam prudentiam";

web[3] = "Yes, if thou criest after knowledge, [and] liftest up thy voice for understanding;";

hnv[11] = "Discretion will watch over you. Understanding will keep you,";
