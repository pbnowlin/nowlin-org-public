csb[1] = "A good name is to be chosen over great wealth; favor is better than silver and gold.";
csb[2] = "Rich and poor have this in common: the LORD makes them all.";
csb[3] = "A sensible person sees danger and takes cover, but the inexperienced keep going and are punished.";
csb[4] = "Humility, the fear of the LORD, results in wealth, honor, and life.";
csb[5] = "There are thorns and snares on the way of the crooked; the one who guards himself stays far from them.";
csb[6] = "Start a youth out on his way; even when he grows old he will not depart from it.";
csb[7] = "The rich rule over the poor, and the borrower is a slave to the lender.";
csb[8] = "The one who sows injustice will reap disaster, and the rod of his fury will be destroyed.";
csb[9] = "A generous person will be blessed, for he shares his food with the poor.";
csb[10] = "Drive out a mocker, and conflict goes too; then quarreling and dishonor will cease.";
csb[11] = "The one who loves a pure heart and gracious lips -- the king is his friend.";
csb[12] = "The LORD\'s eyes keep watch over knowledge, but he overthrows the words of the treacherous.";
csb[13] = "The slacker says, &quot;There\'s a lion outside! I\'ll be killed in the public square! &quot;";
csb[14] = "The mouth of the forbidden woman is a deep pit; a man cursed by the LORD will fall into it.";
csb[15] = "Foolishness is bound to the heart of a youth; a rod of discipline will separate it from him.";
csb[16] = "Oppressing the poor to enrich oneself, and giving to the rich -- both lead only to poverty.";
csb[17] = "Listen closely, pay attention to the words of the wise, and apply your mind to my knowledge.";
csb[18] = "For it is pleasing if you keep them within you and if they are constantly on your lips.";
csb[19] = "I have instructed you today -- even you -- so that your confidence may be in the LORD.";
csb[20] = "Haven\'t I written for you thirty sayings about counsel and knowledge,";
csb[21] = "in order to teach you true and reliable words, so that you may give a dependable report to those who sent you?";
csb[22] = "Don\'t rob a poor person because he is poor, and don\'t crush the oppressed at the city gate,";
csb[23] = "for the LORD will champion their cause and will plunder those who plunder them.";
csb[24] = "Don\'t make friends with an angry person, and don\'t be a companion of a hot-tempered one,";
csb[25] = "or you will learn his ways and entangle yourself in a snare.";
csb[26] = "Don\'t be one of those who enter agreements, who put up security for loans.";
csb[27] = "If you have nothing with which to pay, even your bed will be taken from under you.";
csb[28] = "Don\'t move an ancient boundary marker that your fathers set up.";
csb[29] = "Do you see a person skilled in his work? He will stand in the presence of kings. He will not stand in the presence of the unknown.";
