csb[1] = "A gentle answer turns away anger, but a harsh word stirs up wrath.";
csb[2] = "The tongue of the wise makes knowledge attractive, but the mouth of fools blurts out foolishness.";
csb[3] = "The eyes of the LORD are everywhere, observing the wicked and the good.";
csb[4] = "The tongue that heals is a tree of life, but a devious tongue breaks the spirit.";
csb[5] = "A fool despises his father\'s discipline, but a person who accepts correction is sensible.";
csb[6] = "The house of the righteous has great wealth, but trouble accompanies the income of the wicked.";
csb[7] = "The lips of the wise broadcast knowledge, but not so the heart of fools.";
csb[8] = "The sacrifice of the wicked is detestable to the LORD, but the prayer of the upright is his delight.";
csb[9] = "The LORD detests the way of the wicked, but he loves the one who pursues righteousness.";
csb[10] = "Discipline is harsh for the one who leaves the path; the one who hates correction will die.";
csb[11] = "Sheol and Abaddon lie open before the LORD -- how much more, human hearts.";
csb[12] = "A mocker doesn\'t love one who corrects him; he will not consult the wise.";
csb[13] = "A joyful heart makes a face cheerful, but a sad heart produces a broken spirit.";
csb[14] = "A discerning mind seeks knowledge, but the mouth of fools feeds on foolishness.";
csb[15] = "All the days of the oppressed are miserable, but a cheerful heart has a continual feast.";
csb[16] = "Better a little with the fear of the LORD than great treasure with turmoil.";
csb[17] = "Better a meal of vegetables where there is love than a fattened ox with hatred.";
csb[18] = "A hot-tempered person stirs up conflict, but one slow to anger calms strife.";
csb[19] = "A slacker\'s way is like a thorny hedge, but the path of the upright is a highway.";
csb[20] = "A wise son brings joy to his father, but a foolish man despises his mother.";
csb[21] = "Foolishness brings joy to one without sense, but a person with understanding walks a straight path.";
csb[22] = "Plans fail when there is no counsel, but with many advisers they succeed.";
csb[23] = "A person takes joy in giving an answer; and a timely word -- how good that is!";
csb[24] = "For the prudent the path of life leads upward, so that he may avoid going down to Sheol.";
csb[25] = "The LORD tears apart the house of the proud, but he protects the widow\'s territory.";
csb[26] = "The LORD detests the plans of the one who is evil, but pleasant words are pure.";
csb[27] = "The one who profits dishonestly troubles his household, but the one who hates bribes will live.";
csb[28] = "The mind of the righteous person thinks before answering, but the mouth of the wicked blurts out evil things.";
csb[29] = "The LORD is far from the wicked, but he hears the prayer of the righteous.";
csb[30] = "Bright eyes cheer the heart; good news strengthens the bones.";
csb[31] = "One who listens to life-giving rebukes will be at home among the wise.";
csb[32] = "Anyone who ignores discipline despises himself, but whoever listens to correction acquires good sense.";
csb[33] = "The fear of the LORD is what wisdom teaches, and humility comes before honor.";
