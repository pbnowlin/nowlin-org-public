csb[1] = "My son, if you have put up security for your neighbor or entered into an agreement with a stranger,";
csb[2] = "you have been snared by the words of your mouth trapped by the words from your mouth.";
csb[3] = "Do this, then, my son, and free yourself, for you have put yourself in your neighbor\'s power: Go, humble yourself, and plead with your neighbor.";
csb[4] = "Don\'t give sleep to your eyes or slumber to your eyelids.";
csb[5] = "Escape like a gazelle from a hunter, like a bird from a hunter\'s trap.";
csb[6] = "Go to the ant, you slacker! Observe its ways and become wise.";
csb[7] = "Without leader, administrator, or ruler,";
csb[8] = "it prepares its provisions in summer; it gathers its food during harvest.";
csb[9] = "How long will you stay in bed, you slacker? When will you get up from your sleep?";
csb[10] = "A little sleep, a little slumber, a little folding of the arms to rest,";
csb[11] = "and your poverty will come like a robber, your need, like a bandit.";
csb[12] = "A worthless person, a wicked man goes around speaking dishonestly,";
csb[13] = "winking his eyes, signaling with his feet, and gesturing with his fingers.";
csb[14] = "He always plots evil with perversity in his heart; he stirs up trouble.";
csb[15] = "Therefore calamity will strike him suddenly; he will be shattered instantly, beyond recovery.";
csb[16] = "The LORD hates six things; in fact, seven are detestable to him:";
csb[17] = "arrogant eyes, a lying tongue, hands that shed innocent blood,";
csb[18] = "a heart that plots wicked schemes, feet eager to run to evil,";
csb[19] = "a lying witness who gives false testimony, and one who stirs up trouble among brothers.";
csb[20] = "My son, keep your father\'s command, and don\'t reject your mother\'s teaching.";
csb[21] = "Always bind them to your heart; tie them around your neck.";
csb[22] = "When you walk here and there, they will guide you; when you lie down, they will watch over you; when you wake up, they will talk to you.";
csb[23] = "For a command is a lamp, teaching is a light, and corrective discipline is the way to life.";
csb[24] = "They will protect you from an evil woman, from the flattering tongue of a wayward woman.";
csb[25] = "Don\'t lust in your heart for her beauty or let her captivate you with her eyelashes.";
csb[26] = "For a prostitute\'s fee is only a loaf of bread, but the wife of another man goes after a precious life.";
csb[27] = "Can a man embrace fire and his clothes not be burned?";
csb[28] = "Can a man walk on burning coals without scorching his feet?";
csb[29] = "So it is with the one who sleeps with another man\'s wife; no one who touches her will go unpunished.";
csb[30] = "People don\'t despise the thief if he steals to satisfy himself when he is hungry.";
csb[31] = "Still, if caught, he must pay seven times as much; he must give up all the wealth in his house.";
csb[32] = "The one who commits adultery lacks sense; whoever does so destroys himself.";
csb[33] = "He will get a beating and dishonor, and his disgrace will never be removed.";
csb[34] = "For jealousy enrages a husband, and he will show no mercy when he takes revenge.";
csb[35] = "He will not be appeased by anything or be persuaded by lavish bribes.";
