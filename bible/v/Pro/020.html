csb[1] = "Wine is a mocker, beer is a brawler; whoever goes astray because of them is not wise.";
csb[2] = "A king\'s terrible wrath is like the roaring of a lion; anyone who provokes him endangers himself.";
csb[3] = "Honor belongs to the person who ends a dispute, but any fool can get himself into a quarrel.";
csb[4] = "The slacker does not plow during planting season; at harvest time he looks, and there is nothing.";
csb[5] = "Counsel in a person\'s heart is deep water; but a person of understanding draws it out.";

csb[19] = "The one who reveals secrets is a constant gossip; avoid someone with a big mouth.";
csb[20] = "Whoever curses his father or mother -- his lamp will go out in deep darkness.";
csb[21] = "An inheritance gained prematurely will not be blessed ultimately.";
