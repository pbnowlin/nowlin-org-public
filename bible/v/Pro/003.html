csb[1] = "My son, don\'t forget my teaching, but let your heart keep my commands;";
csb[2] = "for they will bring you many days, a full life, and well-being.";
csb[3] = "Never let loyalty and faithfulness leave you. Tie them around your neck; write them on the tablet of your heart.";
csb[4] = "Then you will find favor and high regard with God and people.";
csb[5] = "Trust in the LORD with all your heart, and do not rely on your own understanding;";
csb[6] = "in all your ways know him, and he will make your paths straight.";
csb[7] = "Don\'t be wise in your own eyes; fear the LORD and turn away from evil.";
csb[8] = "This will be healing for your body and strengthening for your bones.";
csb[9] = "Honor the LORD with your possessions and with the first produce of your entire harvest;";
csb[10] = "then your barns will be completely filled, and your vats will overflow with new wine.";
csb[11] = "Do not despise the LORD\'s instruction, my son, and do not loathe his discipline;";
csb[12] = "for the LORD disciplines the one he loves, just as a father disciplines the son in whom he delights.";
csb[13] = "Happy is a man who finds wisdom and who acquires understanding,";
csb[14] = "for she is more profitable than silver, and her revenue is better than gold.";
csb[15] = "She is more precious than jewels; nothing you desire can equal her.";
csb[16] = "Long life is in her right hand; in her left, riches and honor.";
csb[17] = "Her ways are pleasant, and all her paths, peaceful.";
csb[18] = "She is a tree of life to those who embrace her, and those who hold on to her are happy.";
csb[19] = "The LORD founded the earth by wisdom and established the heavens by understanding.";
csb[20] = "By his knowledge the watery depths broke open, and the clouds dripped with dew.";
csb[21] = "Maintain sound wisdom and discretion. My son, don\'t lose sight of them.";
csb[22] = "They will be life for you and adornment for your neck.";
csb[23] = "Then you will go safely on your way; your foot will not stumble.";
csb[24] = "When you lie down, you will not be afraid; you will lie down, and your sleep will be pleasant.";
csb[25] = "Don\'t fear sudden danger or the ruin of the wicked when it comes,";
csb[26] = "for the LORD will be your confidence and will keep your foot from a snare.";
csb[27] = "When it is in your power, don\'t withhold good from the one to whom it belongs.";
csb[28] = "Don\'t say to your neighbor, &quot;Go away! Come back later. I\'ll give it tomorrow&quot; -- when it is there with you.";
csb[29] = "Don\'t plan any harm against your neighbor, for he trusts you and lives near you.";
csb[30] = "Don\'t accuse anyone without cause, when he has done you no harm.";
csb[31] = "Don\'t envy a violent man or choose any of his ways;";
csb[32] = "for the devious are detestable to the LORD, but he is a friend to the upright.";
csb[33] = "The LORD\'s curse is on the household of the wicked, but he blesses the home of the righteous;";
csb[34] = "He mocks those who mock, but gives grace to the humble.";
csb[35] = "The wise will inherit honor, but he holds up fools to dishonor.";
