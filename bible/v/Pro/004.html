csb[1] = "Listen, sons, to a father\'s discipline, and pay attention so that you may gain understanding,";
csb[2] = "for I am giving you good instruction. Don\'t abandon my teaching.";
csb[3] = "When I was a son with my father, tender and precious to my mother,";
csb[4] = "he taught me and said: &quot;Your heart must hold on to my words. Keep my commands and live.";
csb[5] = "&quot;Get wisdom, get understanding; don\'t forget or turn away from the words from my mouth.";
csb[6] = "&quot;Don\'t abandon wisdom, and she will watch over you; love her, and she will guard you.";
csb[7] = "&quot;Wisdom is supreme -- so get wisdom. And whatever else you get, get understanding.";
csb[8] = "&quot;Cherish her, and she will exalt you; if you embrace her, she will honor you.";
csb[9] = "&quot;She will place a garland of favor on your head; she will give you a crown of beauty.&quot;";
csb[10] = "Listen, my son. Accept my words, and you will live many years.";
csb[11] = "I am teaching you the way of wisdom; I am guiding you on straight paths.";
csb[12] = "When you walk, your steps will not be hindered; when you run, you will not stumble.";
csb[13] = "Hold on to instruction; don\'t let go. Guard it, for it is your life.";
csb[14] = "Keep off the path of the wicked; don\'t proceed on the way of evil ones.";
csb[15] = "Avoid it; don\'t travel on it. Turn away from it, and pass it by.";
csb[16] = "For they can\'t sleep unless they have done what is evil; they are robbed of sleep unless they make someone stumble.";
csb[17] = "They eat the bread of wickedness and drink the wine of violence.";
csb[18] = "The path of the righteous is like the light of dawn, shining brighter and brighter until midday.";
csb[19] = "But the way of the wicked is like the darkest gloom; they don\'t know what makes them stumble.";
csb[20] = "My son, pay attention to my words; listen closely to my sayings.";
csb[21] = "Don\'t lose sight of them; keep them within your heart.";
csb[22] = "For they are life to those who find them, and health to one\'s whole body.";
csb[23] = "Guard your heart above all else, for it is the source of life.";
csb[24] = "Don\'t let your mouth speak dishonestly, and don\'t let your lips talk deviously.";
csb[25] = "Let your eyes look forward; fix your gaze straight ahead.";
csb[26] = "Carefully consider the path for your feet, and all your ways will be established.";
csb[27] = "Don\'t turn to the right or to the left; keep your feet away from evil.";
kjv[1] = "Hear, ye children, the instruction of a father, and attend to know understanding.";

web[1] = "Hear, ye children, the instruction of a father, and attend to know understanding.";
hnv[1] = "Listen, sons, to a father\'s instruction. Pay attention and know understanding;";
vul[1] = "audite filii disciplinam patris et adtendite ut sciatis prudentiam";

web[5] = "Get wisdom, get understanding: forget [it] not; neither decline from the words of my mouth.";
hnv[5] = "Get wisdom. Get understanding. Don\'t forget, neither swerve from the words of my mouth.";
vul[5] = "posside sapientiam posside prudentiam ne obliviscaris neque declines a verbis oris mei";
kjv[6] = "Forsake her not, and she shall preserve thee: love her, and she shall keep thee.";
rsv[6] = "Do not forsake her, and she will keep you; love her, and she will guard you.";
asv[6] = "Forsake her not, and she will preserve thee; Love her, and she will keep thee. ";
yng[6] = "Forsake her not, and she doth preserve thee, Love her, and she doth keep thee.";
dby[6] = "Forsake her not, and she shall keep thee; love her, and she shall preserve thee.";
web[6] = "Forsake her not, and she shall preserve thee: love her, and she shall keep thee.";
