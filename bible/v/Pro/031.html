csb[1] = "The words of King Lemuel, a pronouncement that his mother taught him:";
csb[2] = "What should I say, my son? What, son of my womb? What, son of my vows?";
csb[3] = "Don\'t spend your energy on women or your efforts on those who destroy kings.";
csb[4] = "It is not for kings, Lemuel, it is not for kings to drink wine or for rulers to desire beer.";
csb[5] = "Otherwise, he will drink, forget what is decreed, and pervert justice for all the oppressed.";
csb[6] = "Give beer to one who is dying and wine to one whose life is bitter.";
csb[7] = "Let him drink so that he can forget his poverty and remember his trouble no more.";
csb[8] = "Speak up for those who have no voice, for the justice of all who are dispossessed.";
csb[9] = "Speak up, judge righteously, and defend the cause of the oppressed and needy.";
csb[10] = "Who can find a wife of noble character? She is far more precious than jewels.";
csb[11] = "The heart of her husband trusts in her, and he will not lack anything good.";
csb[12] = "She rewards him with good, not evil, all the days of her life.";
csb[13] = "She selects wool and flax and works with willing hands.";
csb[14] = "She is like the merchant ships, bringing her food from far away.";
csb[15] = "She rises while it is still night and provides food for her household and portions for her female servants.";
csb[16] = "She evaluates a field and buys it; she plants a vineyard with her earnings.";
csb[17] = "She draws on her strength and reveals that her arms are strong.";
csb[18] = "She sees that her profits are good, and her lamp never goes out at night.";
csb[19] = "She extends her hands to the spinning staff, and her hands hold the spindle.";
csb[20] = "Her hands reach out to the poor, and she extends her hands to the needy.";
csb[21] = "She is not afraid for her household when it snows, for all in her household are doubly clothed.";
csb[22] = "She makes her own bed coverings; her clothing is fine linen and purple.";
csb[23] = "Her husband is known at the city gates, where he sits among the elders of the land.";
csb[24] = "She makes and sells linen garments; she delivers belts to the merchants.";
csb[25] = "Strength and honor are her clothing, and she can laugh at the time to come.";
csb[26] = "Her mouth speaks wisdom, and loving instruction is on her tongue.";
csb[27] = "She watches over the activities of her household and is never idle.";
csb[28] = "Her children rise up and call her blessed; her husband also praises her:";
csb[29] = "&quot;Many women have done noble deeds, but you surpass them all! &quot;";
csb[30] = "Charm is deceptive and beauty is fleeting, but a woman who fears the LORD will be praised.";
