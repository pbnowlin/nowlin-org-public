csb[1] = "Wisdom has built her house; she has carved out her seven pillars.";

csb[3] = "She has sent out her female servants; she calls out from the highest points of the city:";
csb[4] = "&quot;Whoever is inexperienced, enter here! &quot; To the one who lacks sense, she says,";
csb[5] = "&quot;Come, eat my bread, and drink the wine I have mixed.";
csb[6] = "&quot;Leave inexperience behind, and you will live; pursue the way of understanding.";
csb[7] = "&quot;The one who corrects a mocker will bring abuse on himself; the one who rebukes the wicked will get hurt.";

csb[9] = "&quot;Instruct the wise, and he will be wiser still; teach the righteous, and he will learn more.";
csb[10] = "&quot;The fear of the LORD is the beginning of wisdom, and the knowledge of the Holy One is understanding.";
csb[11] = "&quot;For by me your days will be many, and years will be added to your life.";
csb[12] = "&quot;If you are wise, you are wise for your own benefit; if you mock, you alone will bear the consequences.&quot;";
