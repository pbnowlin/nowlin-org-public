kjv[35] = "They have stricken me, [shalt thou say, and] I was not sick; they have beaten me, [and] I felt [it] not: when shall I awake? I will seek it yet again.";

yng[35] = "`They smote me, I have not been sick, They beat me, I have not known. When I awake -- I seek it yet again!\'";
dby[35] = "-- \'\'They have smitten me, [and] I am not sore; they have beaten me, [and] I knew it not. When shall I awake? I will seek it yet again.\'\'";

hnv[35] = "&quot;They hit me, and I was not hurt; They beat me, and I don\'t feel it! When will I wake up? I can do it again. I can find another.&quot;";
