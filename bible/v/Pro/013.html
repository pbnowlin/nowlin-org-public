csb[1] = "A wise son responds to his father\'s discipline, but a mocker doesn\'t listen to rebuke.";
csb[2] = "From the fruit of his mouth, a person will enjoy good things, but treacherous people have an appetite for violence.";
csb[3] = "The one who guards his mouth protects his life; the one who opens his lips invites his own ruin.";
csb[4] = "The slacker craves, yet has nothing, but the diligent is fully satisfied.";
csb[5] = "The righteous hate lying, but the wicked bring disgust and shame.";
csb[6] = "Righteousness guards people of integrity, but wickedness undermines the sinner.";
csb[7] = "One person pretends to be rich but has nothing; another pretends to be poor but has abundant wealth.";
csb[8] = "Riches are a ransom for a person\'s life, but a poor person hears no threat.";
csb[9] = "The light of the righteous shines brightly, but the lamp of the wicked is put out.";
csb[10] = "Arrogance leads to nothing but strife, but wisdom is gained by those who take advice.";
csb[11] = "Wealth obtained by fraud will dwindle, but whoever earns it through labor will multiply it.";
csb[12] = "Hope delayed makes the heart sick, but desire fulfilled is a tree of life.";
csb[13] = "The one who has contempt for instruction will pay the penalty, but the one who respects a command will be rewarded.";
csb[14] = "A wise person\'s instruction is a fountain of life, turning people away from the snares of death.";
csb[15] = "Good sense wins favor, but the way of the treacherous never changes.";
csb[16] = "Every sensible person acts knowledgeably, but a fool displays his stupidity.";
csb[17] = "A wicked envoy falls into trouble, but a trustworthy courier brings healing.";
csb[18] = "Poverty and disgrace come to those who ignore discipline, but the one who accepts correction will be honored.";
csb[19] = "Desire fulfilled is sweet to the taste, but to turn from evil is detestable to fools.";
csb[20] = "The one who walks with the wise will become wise, but a companion of fools will suffer harm.";
csb[21] = "Disaster pursues sinners, but good rewards the righteous.";
csb[22] = "A good man leaves an inheritance to his grandchildren, but the sinner\'s wealth is stored up for the righteous.";
csb[23] = "The uncultivated field of the poor yields abundant food, but without justice, it is swept away.";
csb[24] = "The one who will not use the rod hates his son, but the one who loves him disciplines him diligently.";
csb[25] = "A righteous person eats until he is satisfied, but the stomach of the wicked is empty.";
kjv[1] = "A wise son [heareth] his father\'s instruction: but a scorner heareth not rebuke.";
rsv[1] = "A wise son hears his father\'s instruction, but a scoffer does not listen to rebuke.";
asv[1] = "A wise son [heareth] his father\'s instruction; But a scoffer heareth not rebuke. ";
yng[1] = "A wise son -- the instruction of a father, And a scorner -- he hath not heard rebuke.";
dby[1] = "A wise son [heareth] his father\'s instruction; but a scorner heareth not rebuke.";
web[1] = "A wise son [heareth] his father\'s instruction: but a scorner heareth not rebuke.";
hnv[1] = "A wise son listens to his father\'s instruction, But a scoffer doesn\'t listen to rebuke.";
vul[1] = "filius sapiens doctrina patris qui autem inlusor est non audit cum arguitur";
kjv[2] = "A man shall eat good by the fruit of [his] mouth: but the soul of the transgressors [shall eat] violence.";
rsv[2] = "From the fruit of his mouth a good man eats good, but the desire of the treacherous is for violence.";
asv[2] = "A man shall eat good by the fruit of his mouth; But the soul of the treacherous [shall eat] violence. ";
yng[2] = "From the fruit of the mouth a man eateth good, And the soul of the treacherous -- violence.";
dby[2] = "A man shall eat good by the fruit of his mouth; but the soul of the treacherous, violence.";
web[2] = "A man shall eat good by the fruit of [his] mouth: but the soul of the transgressors [shall eat] violence.";
hnv[2] = "By the fruit of his lips, a man enjoys good things; But the unfaithful crave violence.";
vul[2] = "de fructu oris homo saturabitur bonis anima autem praevaricatorum iniqua";
kjv[3] = "He that keepeth his mouth keepeth his life: [but] he that openeth wide his lips shall have destruction.";
rsv[3] = "He who guards his mouth preserves his life; he who opens wide his lips comes to ruin.";
asv[3] = "He that guardeth his mouth keepeth his life; [But] he that openeth wide his lips shall have destruction. ";
yng[3] = "Whoso is keeping his mouth, is keeping his soul, Whoso is opening wide his lips -- ruin to him!";
dby[3] = "He that guardeth his mouth keepeth his soul; destruction shall be to him that openeth wide his lips.";
web[3] = "He that keepeth his mouth keepeth his life: [but] he that openeth wide his lips shall have destruction.";
hnv[3] = "He who guards his mouth guards his soul. One who opens wide his lips comes to ruin.";
vul[3] = "qui custodit os suum custodit animam suam qui autem inconsideratus est ad loquendum sentiet mala";
kjv[4] = "The soul of the sluggard desireth, and [hath] nothing: but the soul of the diligent shall be made fat.";
rsv[4] = "The soul of the sluggard craves, and gets nothing, while the soul of the diligent is richly supplied.";
asv[4] = "The soul of the sluggard desireth, and hath nothing; But the soul of the diligent shall be made fat. ";
yng[4] = "The soul of the slothful is desiring, and hath not. And the soul of the diligent is made fat.";
dby[4] = "A sluggard\'s soul desireth and hath nothing; but the soul of the diligent shall be made fat.";
web[4] = "The soul of the sluggard desireth, and [hath] nothing: but the soul of the diligent shall be made fat.";
hnv[4] = "The soul of the sluggard desires, and has nothing, But the desire of the diligent shall be fully satisfied.";
vul[4] = "vult et non vult piger anima autem operantium inpinguabitur";
kjv[5] = "A righteous [man] hateth lying: but a wicked [man] is loathsome, and cometh to shame.";
rsv[5] = "A righteous man hates falsehood, but a wicked man acts shamefully and disgracefully.";
asv[5] = "A righteous man hateth lying; But a wicked man is loathsome, and cometh to shame. ";
yng[5] = "A false word the righteous hateth, And the wicked causeth abhorrence, and is confounded.";
dby[5] = "A righteous [man] hateth lying; but the wicked maketh himself odious and cometh to shame.";
web[5] = "A righteous [man] hateth lying: but a wicked [man] is lothsome, and cometh to shame.";
hnv[5] = "A righteous man hates lies, But a wicked man brings shame and disgrace.";
vul[5] = "verbum mendax iustus detestabitur impius confundit et confundetur";
kjv[6] = "Righteousness keepeth [him that is] upright in the way: but wickedness overthroweth the sinner.";
rsv[6] = "Righteousness guards him whose way is upright, but sin overthrows the wicked.";
asv[6] = "Righteousness guardeth him that is upright in the way; But wickedness overthroweth the sinner. ";
yng[6] = "Righteousness keepeth him who is perfect in the way, And wickedness overthroweth a sin offering.";
dby[6] = "Righteousness preserveth him that is perfect in the way; but wickedness overthroweth the sinner.";
web[6] = "Righteousness keepeth [him that is] upright in the way: but wickedness overthroweth the sinner.";
hnv[6] = "Righteousness guards the way of integrity, But wickedness overthrows the sinner.";
vul[6] = "iustitia custodit innocentis viam impietas vero peccato subplantat";
kjv[7] = "There is that maketh himself rich, yet [hath] nothing: [there is] that maketh himself poor, yet [hath] great riches.";
rsv[7] = "One man pretends to be rich, yet has nothing; another pretends to be poor, yet has great wealth.";
asv[7] = "There is that maketh himself rich, yet hath nothing: There is that maketh himself poor, yet hath great wealth. ";
yng[7] = "There is who is making himself rich, and hath nothing, Who is making himself poor, and wealth [is] abundant.";
dby[7] = "There is that feigneth himself rich, and hath nothing; there is that maketh himself poor, and hath great wealth.";
web[7] = "There is that maketh himself rich, yet [hath] nothing: [there is] that maketh himself poor, yet [hath] great riches.";
hnv[7] = "There are some who pretend to be rich, yet have nothing. There are some who pretend to be poor, yet have great wealth.";
vul[7] = "est quasi dives cum nihil habeat et est quasi pauper cum in multis divitiis sit";
kjv[8] = "The ransom of a man\'s life [are] his riches: but the poor heareth not rebuke.";
rsv[8] = "The ransom of a man\'s life is his wealth, but a poor man has no means of redemption.";
asv[8] = "The ransom of a man\'s life is his riches; But the poor heareth no threatening. ";
yng[8] = "The ransom of a man\'s life [are] his riches, And the poor hath not heard rebuke.";
dby[8] = "The ransom of a man\'s life is his riches; but the indigent heareth not rebuke.";
web[8] = "The ransom of a man\'s life [is] his riches: but the poor heareth not rebuke.";
hnv[8] = "The ransom of a man\'s life is his riches, But the poor hear no threats.";
vul[8] = "redemptio animae viri divitiae suae qui autem pauper est increpationem non sustinet";
kjv[9] = "The light of the righteous rejoiceth: but the lamp of the wicked shall be put out.";
rsv[9] = "The light of the righteous rejoices, but the lamp of the wicked will be put out.";
asv[9] = "The light of the righteous rejoiceth; But the lamp of the wicked shall be put out. ";
yng[9] = "The light of the righteous rejoiceth, And the lamp of the wicked is extinguished.";
dby[9] = "The light of the righteous rejoiceth; but the lamp of the wicked shall be put out.";
web[9] = "The light of the righteous rejoiceth: but the lamp of the wicked shall be extinguished.";
hnv[9] = "The light of the righteous shines brightly, But the lamp of the wicked is snuffed out.";
vul[9] = "lux iustorum laetificat lucerna autem impiorum extinguetur";
kjv[10] = "Only by pride cometh contention: but with the well advised [is] wisdom.";
rsv[10] = "By insolence the heedless make strife, but with those who take advice is wisdom.";
asv[10] = "By pride cometh only contention; But with the well-advised is wisdom. ";
yng[10] = "A vain man through pride causeth debate, And with the counselled [is] wisdom.";
dby[10] = "By pride there only cometh contention; but with the well-advised is wisdom.";
web[10] = "Only by pride cometh contention: but with the well-advised [is] wisdom.";
hnv[10] = "By pride only breeds quarrels, But with ones who take advice is wisdom.";
vul[10] = "inter superbos semper iurgia sunt qui autem agunt cuncta consilio reguntur sapientia";
kjv[11] = "Wealth [gotten] by vanity shall be diminished: but he that gathereth by labour shall increase.";
rsv[11] = "Wealth hastily gotten will dwindle, but he who gathers little by little will increase it.";
asv[11] = "Wealth gotten by vanity shall be diminished; But he that gathereth by labor shall have increase. ";
yng[11] = "Wealth from vanity becometh little, And whoso is gathering by the hand becometh great.";
dby[11] = "Wealth [gotten] by vanity diminisheth; but he that gathereth by manual-labour shall increase [it].";
web[11] = "Wealth [gotten] by vanity shall be diminished: but he that gathereth by labor shall increase.";
hnv[11] = "Wealth gained dishonestly dwindles away, But he who gathers by hand makes it grow.";
vul[11] = "substantia festinata minuetur quae autem paulatim colligitur manu multiplicabitur";
kjv[12] = "Hope deferred maketh the heart sick: but [when] the desire cometh, [it is] a tree of life.";
rsv[12] = "Hope deferred makes the heart sick, but a desire fulfilled is a tree of life.";
asv[12] = "Hope deferred maketh the heart sick; But when the desire cometh, it is a tree of life. ";
yng[12] = "Hope prolonged is making the heart sick, And a tree of life [is] the coming desire.";
dby[12] = "Hope deferred maketh the heart sick; but the desire [that] cometh to pass is a tree of life.";
web[12] = "Hope deferred maketh the heart sick: but [when] the desire cometh, [it is] a tree of life.";
hnv[12] = "Hope deferred makes the heart sick, But when longing is fulfilled, it is a tree of life.";
vul[12] = "spes quae differtur adfligit animam lignum vitae desiderium veniens";
kjv[13] = "Whoso despiseth the word shall be destroyed: but he that feareth the commandment shall be rewarded.";
rsv[13] = "He who despises the word brings destruction on himself, but he who respects the commandment will be rewarded.";
asv[13] = "Whoso despiseth the word bringeth destruction on himself; But he that feareth the commandment shall be rewarded. ";
yng[13] = "Whoso is despising the Word is destroyed for it, And whoso is fearing the Command is repayed.";
dby[13] = "Whoso despiseth the word shall be held by it; but he that feareth the commandment shall be rewarded.";
web[13] = "Whoever despiseth the word shall be destroyed: but he that feareth the commandment shall be rewarded.";
hnv[13] = "Whoever despises instruction will pay for it, But he who respects a command will be rewarded.";
vul[13] = "qui detrahit alicui rei ipse se in futurum obligat qui autem timet praeceptum in pace versabitur";
kjv[14] = "The law of the wise [is] a fountain of life, to depart from the snares of death.";
rsv[14] = "The teaching of the wise is a fountain of life, that one may avoid the snares of death.";
asv[14] = "The law of the wise is a fountain of life, That one may depart from the snares of death. ";
yng[14] = "The law of the wise [is] a fountain of life, To turn aside from snares of death.";
dby[14] = "The teaching of the wise [man] is a fountain of life, to turn away from the snares of death.";
web[14] = "The law of the wise [is] a fountain of life, to depart from the snares of death.";
hnv[14] = "The teaching of the wise is a spring of life, To turn from the snares of death.";
vul[14] = "lex sapientis fons vitae ut declinet a ruina mortis";
kjv[15] = "Good understanding giveth favour: but the way of transgressors [is] hard.";
rsv[15] = "Good sense wins favor, but the way of the faithless is their ruin.";
asv[15] = "Good understanding giveth favor; But the way of the transgressor is hard. ";
yng[15] = "Good understanding giveth grace, And the way of the treacherous [is] hard.";
dby[15] = "Good understanding procureth favour; but the way of the treacherous is hard.";
web[15] = "Good understanding giveth favor: but the way of transgressors [is] hard.";
hnv[15] = "Good understanding wins favor; But the way of the unfaithful is hard.";
vul[15] = "doctrina bona dabit gratiam in itinere contemptorum vorago";
kjv[16] = "Every prudent [man] dealeth with knowledge: but a fool layeth open [his] folly.";
rsv[16] = "In everything a prudent man acts with knowledge, but a fool flaunts his folly.";
asv[16] = "Every prudent man worketh with knowledge; But a fool flaunteth [his] folly. ";
yng[16] = "Every prudent one dealeth with knowledge, And a fool spreadeth out folly.";
dby[16] = "Every prudent [man] acteth with knowledge; but the foolish layeth open [his] folly.";
web[16] = "Every prudent [man] dealeth with knowledge: but a fool layeth open [his] folly.";
hnv[16] = "Every prudent man acts from knowledge, But a fool exposes folly.";
vul[16] = "astutus omnia agit cum consilio qui autem fatuus est aperit stultitiam";
kjv[17] = "A wicked messenger falleth into mischief: but a faithful ambassador [is] health.";
rsv[17] = "A bad messenger plunges men into trouble, but a faithful envoy brings healing.";
asv[17] = "A wicked messenger falleth into evil; But a faithful ambassador is health. ";
yng[17] = "A wicked messenger falleth into evil, And a faithful ambassador is healing.";
dby[17] = "A wicked messenger falleth into evil; but a faithful ambassador is health.";
web[17] = "A wicked messenger falleth into mischief: but a faithful embassador [is] health.";
hnv[17] = "A wicked messenger falls into trouble, But a trustworthy envoy gains healing.";
vul[17] = "nuntius impii cadet in malum legatus fidelis sanitas";
kjv[18] = "Poverty and shame [shall be to] him that refuseth instruction: but he that regardeth reproof shall be honoured.";
rsv[18] = "Poverty and disgrace come to him who ignores instruction, but he who heeds reproof is honored.";
asv[18] = "Poverty and shame [shall be to] him that refuseth correction; But he that regardeth reproof shall be honored. ";
yng[18] = "Whoso is refusing instruction -- poverty and shame, And whoso is observing reproof is honoured.";
dby[18] = "Poverty and shame shall be [to] him that refuseth instruction; but he that regardeth reproof shall be honoured.";
web[18] = "Poverty and shame [shall be to] him that refuseth instruction: but he that regardeth reproof shall be honored.";
hnv[18] = "Poverty and shame come to him who refuses discipline, But he who heeds correction shall be honored.";
vul[18] = "egestas et ignominia ei qui deserit disciplinam qui autem adquiescit arguenti glorificabitur";
kjv[19] = "The desire accomplished is sweet to the soul: but [it is] abomination to fools to depart from evil.";
rsv[19] = "A desire fulfilled is sweet to the soul; but to turn away from evil is an abomination to fools.";
asv[19] = "The desire accomplished is sweet to the soul; But it is an abomination to fools to depart from evil. ";
yng[19] = "A desire accomplished is sweet to the soul, And an abomination to fools [is]: Turn from evil.";
dby[19] = "The desire accomplished is sweet to the soul; but it is abomination to the foolish to depart from evil.";
web[19] = "The desire accomplished is sweet to the soul: but [it is] abomination to fools to depart from evil.";
hnv[19] = "Longing fulfilled is sweet to the soul, But fools detest turning from evil.";
vul[19] = "desiderium si conpleatur delectat animam detestantur stulti eos qui fugiunt mala";
kjv[20] = "He that walketh with wise [men] shall be wise: but a companion of fools shall be destroyed.";
rsv[20] = "He who walks with wise men becomes wise, but the companion of fools will suffer harm.";
asv[20] = "Walk with wise men, and thou shalt be wise; But the companion of fools shall smart for it. ";
yng[20] = "Whoso is walking with wise men is wise, And a companion of fools suffereth evil.";
dby[20] = "He that walketh with wise [men] becometh wise; but a companion of the foolish will be depraved.";
web[20] = "He that walketh with wise [men] shall be wise: but a companion of fools shall be destroyed.";
hnv[20] = "One who walks with wise men grows wise, But a companion of fools suffers harm.";
vul[20] = "qui cum sapientibus graditur sapiens erit amicus stultorum efficietur similis";
kjv[21] = "Evil pursueth sinners: but to the righteous good shall be repayed.";
rsv[21] = "Misfortune pursues sinners, but prosperity rewards the righteous.";
asv[21] = "Evil pursueth sinners; But the righteous shall be recompensed with good. ";
yng[21] = "Evil pursueth sinners, And good recompenseth the righteous.";
dby[21] = "Evil pursueth sinners; but to the righteous good shall be repaid.";
web[21] = "Evil pursueth sinners: but to the righteous good shall be repaid.";
hnv[21] = "Misfortune pursues sinners, But prosperity rewards the righteous.";
vul[21] = "peccatores persequetur malum et iustis retribuentur bona";
kjv[22] = "A good [man] leaveth an inheritance to his children\'s children: and the wealth of the sinner [is] laid up for the just.";
rsv[22] = "A good man leaves an inheritance to his children\'s children, but the sinner\'s wealth is laid up for the righteous.";
asv[22] = "A good man leaveth an inheritance to his children\'s children; And the wealth of the sinner is laid up for the righteous. ";
yng[22] = "A good man causeth sons\' sons to inherit, And laid up for the righteous [is] the sinner\'s wealth.";
dby[22] = "A good man leaveth an inheritance to his children\'s children; but the wealth of the sinner is laid up for the righteous [man].";
web[22] = "A good [man] leaveth an inheritance to his children\'s children: and the wealth of the sinner [is] laid up for the just.";
hnv[22] = "A good man leaves an inheritance to his children\'s children, But the wealth of the sinner is stored for the righteous.";
vul[22] = "bonus relinquet heredes filios et nepotes et custoditur iusto substantia peccatoris";
kjv[23] = "Much food [is in] the tillage of the poor: but there is [that is] destroyed for want of judgment.";
rsv[23] = "The fallow ground of the poor yields much food, but it is swept away through injustice.";
asv[23] = "Much food [is in] the tillage of the poor; But there is that is destroyed by reason of injustice. ";
yng[23] = "Abundance of food -- the tillage of the poor, And substance is consumed without judgment.";
dby[23] = "Much food is in the tillage of the poor; but there is that is lost for want of judgment.";
web[23] = "Much food [is in] the tillage of the poor: but there is [that is] destroyed for want of judgment.";
hnv[23] = "An abundance of food is in poor people\'s fields, But injustice sweeps it away.";
vul[23] = "multi cibi in novalibus patrum et alii congregantur absque iudicio";
kjv[24] = "He that spareth his rod hateth his son: but he that loveth him chasteneth him betimes.";
rsv[24] = "He who spares the rod hates his son, but he who loves him is diligent to discipline him.";
asv[24] = "He that spareth his rod hateth his son; But he that loveth him chasteneth him betimes. ";
yng[24] = "Whoso is sparing his rod is hating his son, And whoso is loving him hath hastened him chastisement.";
dby[24] = "He that spareth his rod hateth his son; but he that loveth him chasteneth him betimes.";
web[24] = "He that spareth his rod hateth his son: but he that loveth him chasteneth him betimes.";
hnv[24] = "One who spares the rod hates his son, But one who loves him is careful to discipline him.";
vul[24] = "qui parcit virgae suae odit filium suum qui autem diligit illum instanter erudit";
kjv[25] = "The righteous eateth to the satisfying of his soul: but the belly of the wicked shall want.";
rsv[25] = "The righteous has enough to satisfy his appetite, but the belly of the wicked suffers want.";
asv[25] = "The righteous eateth to the satisfying of his soul; But the belly of the wicked shall want. ";
yng[25] = "The righteous is eating to the satiety of his soul, And the belly of the wicked lacketh!";
dby[25] = "The righteous eateth to the satisfying of his soul; but the belly of the wicked shall want.";
web[25] = "The righteous eateth to the satisfying of his soul: but the belly of the wicked shall want.";
hnv[25] = "The righteous one eats to the satisfying of his soul, But the belly of the wicked goes hungry.";
vul[25] = "iustus comedit et replet animam suam venter autem impiorum insaturabilis";
