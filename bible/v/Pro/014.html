csb[1] = "Every wise woman builds her house, but a foolish one tears it down with her own hands.";
csb[2] = "Whoever lives with integrity fears the LORD, but the one who is devious in his ways despises him.";
csb[3] = "The proud speech of a fool brings a rod of discipline, but the lips of the wise protect them.";
csb[4] = "Where there are no oxen, the feeding trough is empty, but an abundant harvest comes through the strength of an ox.";
csb[5] = "An honest witness does not deceive, but a dishonest witness utters lies.";
csb[6] = "A mocker seeks wisdom and doesn\'t find it, but knowledge comes easily to the perceptive.";
csb[7] = "Stay away from a foolish person; you will gain no knowledge from his speech.";
csb[8] = "The sensible person\'s wisdom is to consider his way, but the stupidity of fools deceives them.";
csb[9] = "Fools mock at making reparation, but there is goodwill among the upright.";
csb[10] = "The heart knows its own bitterness, and no outsider shares in its joy.";
csb[11] = "The house of the wicked will be destroyed, but the tent of the upright will flourish.";
csb[12] = "There is a way that seems right to a person, but its end is the way to death.";
csb[13] = "Even in laughter a heart may be sad, and joy may end in grief.";
csb[14] = "The disloyal one will get what his conduct deserves, and a good one, what his deeds deserve.";
csb[15] = "The inexperienced one believes anything, but the sensible one watches his steps.";
csb[16] = "A wise person is cautious and turns from evil, but a fool is easily angered and is careless.";
csb[17] = "A quick-tempered person acts foolishly, and one who schemes is hated.";
csb[18] = "The inexperienced inherit foolishness, but the sensible are crowned with knowledge.";
csb[19] = "The evil bow before those who are good, and the wicked, at the gates of the righteous.";
csb[20] = "A poor person is hated even by his neighbor, but there are many who love the rich.";
csb[21] = "The one who despises his neighbor sins, but whoever shows kindness to the poor will be happy.";
csb[22] = "Don\'t those who plan evil go astray? But those who plan good find loyalty and faithfulness.";
csb[23] = "There is profit in all hard work, but endless talk leads only to poverty.";
csb[24] = "The crown of the wise is their wealth, but the foolishness of fools produces foolishness.";
csb[25] = "A truthful witness rescues lives, but one who utters lies is deceitful.";
csb[26] = "In the fear of the LORD one has strong confidence and his children have a refuge.";
csb[27] = "The fear of the LORD is a fountain of life, turning people away from the snares of death.";
csb[28] = "A large population is a king\'s splendor, but a shortage of people is a ruler\'s devastation.";
csb[29] = "A patient person shows great understanding, but a quick-tempered one promotes foolishness.";
csb[30] = "A tranquil heart is life to the body, but jealousy is rottenness to the bones.";
csb[31] = "The one who oppresses the poor person insults his Maker, but one who is kind to the needy honors him.";
csb[32] = "The wicked one is thrown down by his own sin, but the righteous one has a refuge in his death.";
csb[33] = "Wisdom resides in the heart of the discerning; she is known even among fools.";
csb[34] = "Righteousness exalts a nation, but sin is a disgrace to any people.";
csb[35] = "A king favors a prudent servant, but his anger falls on a disgraceful one.";
