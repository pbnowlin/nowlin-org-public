csb[1] = "In the seventh year, in the fifth month, on the tenth day of the month, some of Israel\'s elders came to inquire of the LORD, and they sat down in front of me.";
csb[2] = "Then the word of the LORD came to me:";
csb[3] = "&quot;Son of man, speak with the elders of Israel and tell them, \'This is what the Lord GOD says: Are you coming to inquire of me? As I live, I will not let you inquire of me. This is the declaration of the Lord GOD.\'";
csb[4] = "&quot;Will you pass judgment against them, will you pass judgment, son of man? Explain the detestable practices of their fathers to them.";
csb[5] = "&quot;Say to them, \'This is what the Lord GOD says: On the day I chose Israel, I swore an oath to the descendants of Jacob\'s house and made myself known to them in the land of Egypt. I swore to them, saying, &quot;I am the LORD your God.&quot;";
csb[6] = "On that day I swore to them that I would bring them out of the land of Egypt into a land I had searched out for them, a land flowing with milk and honey, the most beautiful of all lands.";
csb[7] = "I also said to them, &quot;Throw away, each of you, the abhorrent things that you prize, and do not defile yourselves with the idols of Egypt. I am the LORD your God.&quot;";
csb[8] = "&quot; \'But they rebelled against me and were unwilling to listen to me. None of them threw away the abhorrent things that they prized, and they did not abandon the idols of Egypt. So I considered pouring out my wrath on them, exhausting my anger against them within the land of Egypt.";
csb[9] = "&quot;But I acted for the sake of my name, so that it would not be profaned in the eyes of the nations they were living among, in whose sight I had made myself known to Israel by bringing them out of Egypt.";
csb[10] = "&quot; \'So I brought them out of the land of Egypt and led them into the wilderness.";
csb[11] = "&quot;Then I gave them my statutes and explained my ordinances to them -- the person who does them will live by them.";
csb[12] = "&quot;I also gave them my Sabbaths to serve as a sign between me and them, so that they would know that I am the LORD who consecrates them.";
csb[13] = "&quot; \'But the house of Israel rebelled against me in the wilderness. They did not follow my statutes and they rejected my ordinances -- the person who does them will live by them. They also completely profaned my Sabbaths. So I considered pouring out my wrath on them in the wilderness to put an end to them.";
csb[14] = "&quot;But I acted for the sake of my name, so that it would not be profaned in the eyes of the nations in whose sight I had brought them out.";
csb[15] = "&quot;However, I swore to them in the wilderness that I would not bring them into the land I had given them -- the most beautiful of all lands, flowing with milk and honey --";
csb[16] = "&quot;because they rejected my ordinances, profaned my Sabbaths, and did not follow my statutes. For their hearts went after their idols.";
csb[17] = "&quot;Yet I spared them from destruction and did not bring them to an end in the wilderness.";
csb[18] = "&quot; \'Then I said to their children in the wilderness, &quot;Don\'t follow the statutes of your fathers, defile yourselves with their idols, or keep their ordinances.";
csb[19] = "&quot;I am the LORD your God. Follow my statutes, keep my ordinances, and practice them.";
csb[20] = "&quot;Keep my Sabbaths holy, and they will be a sign between me and you, so you may know that I am the LORD your God.&quot;";
csb[21] = "&quot; \'But the children rebelled against me. They did not follow my statutes or carefully keep my ordinances -- the person who does them will live by them. They also profaned my Sabbaths. So I considered pouring out my wrath on them and exhausting my anger against them in the wilderness.";
csb[22] = "&quot;But I withheld my hand and acted for the sake of my name, so that it would not be profaned in the eyes of the nations in whose sight I brought them out.";
csb[23] = "&quot;However, I swore to them in the wilderness that I would disperse them among the nations and scatter them among the countries.";
csb[24] = "&quot;For they did not practice my ordinances but rejected my statutes and profaned my Sabbaths, and their eyes were fixed on their fathers\' idols.";
csb[25] = "&quot;I also gave them statutes that were not good and ordinances they could not live by.";
csb[26] = "&quot;When they sacrificed every firstborn in the fire, I defiled them through their gifts in order to devastate them so they would know that I am the LORD.\'";
csb[27] = "&quot;Therefore, son of man, speak to the house of Israel, and tell them, \'This is what the Lord GOD says: In this way also your fathers blasphemed me by committing treachery against me:";
csb[28] = "&quot;When I brought them into the land that I swore to give them and they saw any high hill or leafy tree, they offered their sacrifices and presented their offensive offerings there. They also sent up their pleasing aromas and poured out their drink offerings there.";
csb[29] = "&quot;So I asked them, &quot;What is this high place you are going to? &quot; And it is still called Bamah today.\'";
csb[30] = "&quot;Therefore say to the house of Israel, \'This is what the Lord GOD says: Are you defiling yourselves the way your fathers did, and prostituting yourselves with their abhorrent things?";
csb[31] = "&quot;When you offer your gifts, sacrificing your children in the fire, you still continue to defile yourselves with all your idols today. So should I let you inquire of me, house of Israel? As I live -- this is the declaration of the Lord GOD -- I will not let you inquire of me!";
csb[32] = "&quot; \'When you say, &quot;Let us be like the nations, like the clans of other countries, serving wood and stone,&quot; what you have in mind will never happen.";
csb[33] = "As I live -- the declaration of the Lord GOD -- I will reign over you with a strong hand, an outstretched arm, and outpoured wrath.";
csb[34] = "I will bring you from the peoples and gather you from the countries where you were scattered, with a strong hand, an outstretched arm, and outpoured wrath.";
csb[35] = "I will lead you into the wilderness of the peoples and enter into judgment with you there face to face.";
csb[36] = "Just as I entered into judgment with your fathers in the wilderness of the land of Egypt, so I will enter into judgment with you. This is the declaration of the Lord GOD.";
csb[37] = "I will make you pass under the rod and will bring you into the bond of the covenant.";
csb[38] = "I will purge you of those who rebel and transgress against me. I will bring them out of the land where they live as foreign residents, but they will not enter the land of Israel. Then you will know that I am the LORD.";
csb[39] = "&quot; \'As for you, house of Israel, this is what the Lord GOD says: Go and serve your idols, each of you. But afterward you will surely listen to me, and you will no longer defile my holy name with your gifts and idols.";
csb[40] = "&quot;For on my holy mountain, Israel\'s high mountain -- the declaration of the Lord GOD -- there the entire house of Israel, all of them, will serve me in the land. There I will accept them and will require your contributions and choicest gifts, all your holy offerings.";
csb[41] = "&quot;When I bring you from the peoples and gather you from the countries where you have been scattered, I will accept you as a pleasing aroma. And I will demonstrate my holiness through you in the sight of the nations.";
csb[42] = "&quot;When I lead you into the land of Israel, the land I swore to give your fathers, you will know that I am the LORD.";
csb[43] = "&quot;There you will remember your ways and all your deeds by which you have defiled yourself, and you will loathe yourselves for all the evil things you have done.";
csb[44] = "&quot;You will know that I am the LORD, house of Israel, when I have dealt with you for the sake of my name rather than according to your evil ways and corrupt acts. This is the declaration of the Lord GOD.\' &quot;";
csb[45] = "The word of the LORD came to me:";
csb[46] = "&quot;Son of man, face the south and preach against it. Prophesy against the forest land in the Negev,";
csb[47] = "&quot;and say to the forest there, \'Hear the word of the LORD! This is what the Lord GOD says: I am about to ignite a fire in you, and it will devour every green tree and every dry tree in you. The blazing flame will not be extinguished, and every face from the south to the north will be scorched by it.";
csb[48] = "&quot;Then all people will see that I, the LORD, have kindled it. It will not be extinguished.\' &quot;";
csb[49] = "Then I said, &quot;Oh, Lord GOD, they are saying of me, \'Isn\'t he just composing parables? \' &quot;";

kjv[8] = "But they rebelled against me, and would not hearken unto me: they did not every man cast away the abominations of their eyes, neither did they forsake the idols of Egypt: then I said, I will pour out my fury upon them, to accomplish my anger against them in the midst of the land of Egypt.";
rsv[8] = "But they rebelled against me and would not listen to me; they did not every man cast away the detestable things their eyes feasted on, nor did they forsake the idols of Egypt. &quot;Then I thought I would pour out my wrath upon them and spend my anger against them in the midst of the land of Egypt.";
asv[8] = "But they rebelled against me, and would not hearken unto me; they did not every man cast away the abominations of their eyes, neither did they forsake the idols of Egypt. Then I said I would pour out my wrath upon them, to accomplish my anger against them in the midst of the land of Egypt.";
yng[8] = "And -- they rebel against Me, And have not been willing to hearken to Me, Each, the detestable things of their eyes, They have not cast away, And the idols of Egypt have not forsaken, And I say -- to pour out My fury on them, To complete Mine anger against them, In the midst of the land of Egypt.";
dby[8] = "But they rebelled against me, and would not hearken unto me: none of them cast away the abominations of his eyes, neither did they forsake the idols of Egypt. Then I thought to pour out my fury upon them, so as to accomplish mine anger against them in the midst of the land of Egypt.";

vul[8] = "et inritaverunt me nolueruntque audire unusquisque abominationes oculorum suorum non proiecit nec idola Aegypti reliquerunt et dixi ut effunderem indignationem meam super eos et implerem iram meam in eis in medio terrae Aegypti";
kjv[9] = "But I wrought for my name\'s sake, that it should not be polluted before the heathen, among whom they [were], in whose sight I made myself known unto them, in bringing them forth out of the land of Egypt.";

kjv[13] = "But the house of Israel rebelled against me in the wilderness: they walked not in my statutes, and they despised my judgments, which [if] a man do, he shall even live in them; and my sabbaths they greatly polluted: then I said, I would pour out my fury upon them in the wilderness, to consume them.";
rsv[13] = "But the house of Israel rebelled against me in the wilderness; they did not walk in my statutes but rejected my ordinances, by whose observance man shall live; and my sabbaths they greatly profaned. &quot;Then I thought I would pour out my wrath upon them in the wilderness, to make a full end of them.";
asv[13] = "But the house of Israel rebelled against me in the wilderness: they walked not in my statutes, and they rejected mine ordinances, which if a man keep, he shall live in them; and my sabbaths they greatly profaned. Then I said I would pour out my wrath upon them in the wilderness, to consume them.";
yng[13] = "And -- rebel against me do the house of Israel in the wilderness, In My statutes they have not walked, And My judgments they have despised, Which the man who doth -- liveth by them. And My sabbaths they have greatly polluted, And I say to pour out My fury on them in the wilderness, to consume them.";
dby[13] = "But the house of Israel rebelled against me in the wilderness: they walked not in my statutes, and they rejected mine ordinances, which if a man do, he shall live by them; and my sabbaths they greatly profaned: and I said I would pour out my fury upon them in the wilderness, to consume them.";
web[13] = "But the house of Israel rebelled against me in the wilderness: they walked not in my statutes, and they despised my judgments, which [if] a man doeth, he shall even live in them; and my sabbaths they greatly profaned: then I said, I would pour out my fury upon them in the wilderness, to consume them.";
hnv[13] = "But the house of Yisra\'el rebelled against me in the wilderness: they didn\'t walk in my statutes, and they rejected my ordinances, which if a man keep, he shall live in them; and my Shabbatot they greatly profaned. Then I said I would pour out my wrath on them in the wilderness, to consume them.";
vul[13] = "et inritaverunt me domus Israhel in deserto in praeceptis meis non ambulaverunt et iudicia mea proiecerunt quae faciens homo vivet in eis et sabbata mea violaverunt vehementer dixi ergo ut effunderem furorem meum super eos in deserto et consumerem eos";
kjv[14] = "But I wrought for my name\'s sake, that it should not be polluted before the heathen, in whose sight I brought them out.";
rsv[14] = "But I acted for the sake of my name, that it should not be profaned in the sight of the nations, in whose sight I had brought them out.";
asv[14] = "But I wrought for my name\'s sake, that it should not be profaned in the sight of the nations, in whose sight I brought them out.";
yng[14] = "And I do [it] for My name\'s sake, Not to pollute [it] before the eyes of the nations, Before whose eyes I brought them forth.";
dby[14] = "But I wrought for my name\'s sake, that it should not be profaned in the sight of the nations, in whose sight I had brought them out.";
web[14] = "But I wrought for my name\'s sake, that it should not be profaned before the heathen, in whose sight I brought them out.";
hnv[14] = "But I worked for my name\'s sake, that it should not be profaned in the sight of the nations, in whose sight I brought them out.";
vul[14] = "et feci propter nomen meum ne violaretur coram gentibus de quibus eieci eos in conspectu earum";
kjv[15] = "Yet also I lifted up my hand unto them in the wilderness, that I would not bring them into the land which I had given [them], flowing with milk and honey, which [is] the glory of all lands;";
rsv[15] = "Moreover I swore to them in the wilderness that I would not bring them into the land which I had given them, a land flowing with milk and honey, the most glorious of all lands,";
asv[15] = "Moreover also I sware unto them in the wilderness, that I would not bring them into the land which I had given them, flowing with milk and honey, which is the glory of all lands;";
yng[15] = "And also, I, I have lifted up My hand to them in the wilderness, Not to bring them in to the land that I had given, Flowing with milk and honey, A beauty it [is] to all the lands,";
dby[15] = "And I also lifted up my hand unto them in the wilderness, that I would not bring them into the land that I had given [them], flowing with milk and honey, which is the ornament of all lands;";
web[15] = "Yet also I lifted up my hand to them in the wilderness, that I would not bring them into the land which I had given [them], flowing with milk and honey, which [is] the glory of all lands;";
hnv[15] = "Moreover also I swore to them in the wilderness, that I would not bring them into the land which I had given them, flowing with milk and honey, which is the glory of all lands;";
vul[15] = "ego igitur levavi manum meam super eos in deserto ne inducerem eos in terram quam dedi eis fluentem lacte et melle praecipuam terrarum omnium";
kjv[16] = "Because they despised my judgments, and walked not in my statutes, but polluted my sabbaths: for their heart went after their idols.";
rsv[16] = "because they rejected my ordinances and did not walk in my statutes, and profaned my sabbaths; for their heart went after their idols.";
asv[16] = "because they rejected mine ordinances, and walked not in my statutes, and profaned my sabbaths: for their heart went after their idols.";
yng[16] = "Because against My judgments they did kick, And in My statutes they have not walked, And My sabbaths they have polluted, For after their idols their heart is going.";
dby[16] = "because they rejected mine ordinances and walked not in my statutes, and profaned my sabbaths: for their heart went after their idols.";
web[16] = "Because they despised my judgments, and walked not in my statutes, but profaned my sabbaths: for their heart went after their idols.";
hnv[16] = "because they rejected my ordinances, and didn\'t walk in my statutes, and profaned my Shabbatot: for their heart went after their idols.";
vul[16] = "quia iudicia mea proiecerunt et in praeceptis meis non ambulaverunt et sabbata mea violaverunt post idola enim cor eorum gradiebatur";
kjv[17] = "Nevertheless mine eye spared them from destroying them, neither did I make an end of them in the wilderness.";
rsv[17] = "Nevertheless my eye spared them, and I did not destroy them or make a full end of them in the wilderness.";
asv[17] = "Nevertheless mine eye spared them, and I destroyed them not, neither did I make a full end of them in the wilderness.";
yng[17] = "And Mine eye hath pity on them -- against destroying them, And I have not made of them an end in the wilderness.";
dby[17] = "But mine eye spared them so as not to destroy them, neither did I make a full end of them in the wilderness.";
web[17] = "Nevertheless my eye spared them from destroying them, neither did I make an end of them in the wilderness.";
hnv[17] = "Nevertheless my eye spared them, and I didn\'t destroy them, neither did I make a full end of them in the wilderness.";
vul[17] = "et pepercit oculus meus super eos ut non interficerem eos nec consumpsi eos in deserto";
kjv[18] = "But I said unto their children in the wilderness, Walk ye not in the statutes of your fathers, neither observe their judgments, nor defile yourselves with their idols:";
rsv[18] = "&quot;And I said to their children in the wilderness, Do not walk in the statutes of your fathers, nor observe their ordinances, nor defile yourselves with their idols.";
asv[18] = "And I said unto their children in the wilderness, Walk ye not in the statutes of your fathers, neither observe their ordinances, nor defile yourselves with their idols.";
yng[18] = "And I say to their sons in the wilderness: In the statutes of your fathers ye walk not, And their judgments ye do not observe, And with their idols ye are not defiled.";
dby[18] = "And I said unto their children in the wilderness, Walk not in the statutes of your fathers, neither keep their ordinances, nor defile yourselves with their idols.";
web[18] = "But I said to their children in the wilderness, Walk ye not in the statutes of your fathers, neither observe their judgments, nor defile yourselves with their idols:";
hnv[18] = "I said to their children in the wilderness, Don\'t you walk in the statutes of your fathers, neither observe their ordinances, nor defile yourselves with their idols.";
vul[18] = "dixi autem ad filios eorum in solitudine in praeceptis patrum vestrorum nolite incedere nec iudicia eorum custodiatis nec in idolis eorum polluamini";
kjv[19] = "I [am] the LORD your God; walk in my statutes, and keep my judgments, and do them;";
rsv[19] = "I the LORD am your God; walk in my statutes, and be careful to observe my ordinances,";
asv[19] = "I am Jehovah your God: walk in my statutes, and keep mine ordinances, and do them;";
yng[19] = "I [am] Jehovah your God, in My statutes walk, And My judgments observe, and do them,";
dby[19] = "I [am] Jehovah your God: walk in my statutes, and keep mine ordinances, and do them;";
web[19] = "I [am] the LORD your God; walk in my statutes, and keep my judgments, and do them;";
hnv[19] = "I am the LORD your God: walk in my statutes, and keep my ordinances, and do them;";
vul[19] = "ego Dominus Deus vester in praeceptis meis ambulate et iudicia mea custodite et facite ea";
kjv[20] = "And hallow my sabbaths; and they shall be a sign between me and you, that ye may know that I [am] the LORD your God.";
rsv[20] = "and hallow my sabbaths that they may be a sign between me and you, that you may know that I the LORD am your God.";
asv[20] = "and hallow my sabbaths; and they shall be a sign between me and you, that ye may know that I am Jehovah your God.";
yng[20] = "And My sabbaths sanctify, And they have been for a sign between Me and you, To know that I, Jehovah, [am] your God.";
dby[20] = "and hallow my sabbaths; and they shall be a sign between me and you, that ye may know that I [am] Jehovah your God.";
web[20] = "And hallow my sabbaths; and they shall be a sign between me and you, that ye may know that I [am] the LORD your God.";
hnv[20] = "and make my Shabbatot holy; and they shall be a sign between me and you, that you may know that I am the LORD your God.";
vul[20] = "et sabbata mea sanctificate ut sit signum inter me et vos et sciatur quia ego Dominus Deus vester";
kjv[21] = "Notwithstanding the children rebelled against me: they walked not in my statutes, neither kept my judgments to do them, which [if] a man do, he shall even live in them; they polluted my sabbaths: then I said, I would pour out my fury upon them, to accomplish my anger against them in the wilderness.";
rsv[21] = "But the children rebelled against me; they did not walk in my statutes, and were not careful to observe my ordinances, by whose observance man shall live; they profaned my sabbaths. &quot;Then I thought I would pour out my wrath upon them and spend my anger against them in the wilderness.";
asv[21] = "But the children rebelled against me; they walked not in my statutes, neither kept mine ordinances to do them, which if a man do, he shall live in them; they profaned my sabbaths. Then I said I would pour out my wrath upon them, to accomplish my anger against them in the wilderness.";
yng[21] = "And -- the sons rebel against Me, In My statutes they have not walked, And My judgments they have not observed -- to do them, Which the man who doth -- liveth by them. My sabbaths they have polluted, And I say to pour out My fury upon them, To complete Mine anger against them in the wilderness.";
dby[21] = "And the children rebelled against me: they walked not in my statutes, neither kept mine ordinances to do them, which if a man do, he shall live by them; they profaned my sabbaths: and I said I would pour out my fury upon them, to accomplish mine anger against them in the wilderness.";
web[21] = "Notwithstanding the children rebelled against me: they walked not in my statutes, neither kept my judgments to do them, which [if] a man doeth, he shall even live in them: they profaned my sabbaths: then I said, I would pour out my fury upon them, to accomplish my anger against them in the wilderness.";
hnv[21] = "But the children rebelled against me; they didn\'t walk in my statutes, neither kept my ordinances to do them, which if a man do, he shall live in them; they profaned my Shabbatot. Then I said I would pour out my wrath on them, to accomplish my anger against them in the wilderness.";
vul[21] = "et exacerbaverunt me filii in praeceptis meis non ambulaverunt et iudicia mea non custodierunt ut facerent ea quae cum fecerit homo vivet in eis et sabbata mea violaverunt et comminatus sum ut effunderem furorem meum super eos et implerem iram meam in eis in deserto";
kjv[22] = "Nevertheless I withdrew mine hand, and wrought for my name\'s sake, that it should not be polluted in the sight of the heathen, in whose sight I brought them forth.";
rsv[22] = "But I withheld my hand, and acted for the sake of my name, that it should not be profaned in the sight of the nations, in whose sight I had brought them out.";
asv[22] = "Nevertheless I withdrew my hand, and wrought for my name\'s sake, that it should not be profaned in the sight of the nations, in whose sight I brought them forth.";
yng[22] = "And I have turned back My hand, And I do [it] for My name\'s sake, Not to pollute [it] before the eyes of the nations, Before whose eyes I brought them out.";
dby[22] = "But I withdrew my hand, and wrought for my name\'s sake, that it should not be profaned in the sight of the nations, in whose sight I had brought them out.";
web[22] = "Nevertheless I withdrew my hand, and wrought for my name\'s sake, that it should not be profaned in the sight of the heathen, in whose sight I brought them forth.";
hnv[22] = "Nevertheless I withdrew my hand, and worked for my name\'s sake, that it should not be profaned in the sight of the nations, in whose sight I brought them forth.";
vul[22] = "averti autem manum meam et feci propter nomen meum ut non violaretur coram gentibus de quibus eieci eos in oculis earum";
kjv[23] = "I lifted up mine hand unto them also in the wilderness, that I would scatter them among the heathen, and disperse them through the countries;";
rsv[23] = "Moreover I swore to them in the wilderness that I would scatter them among the nations and disperse them through the countries,";
asv[23] = "Moreover I sware unto them in the wilderness, that I would scatter them among the nations, and disperse them through the countries;";
yng[23] = "I also, I have lifted up My hand to them in the wilderness, To scatter them among nations, And to spread them through lands.";
dby[23] = "I lifted up my hand also unto them in the wilderness, that I would scatter them among the nations, and disperse them through the countries;";
web[23] = "I lifted up my hand to them also in the wilderness, that I would scatter them among the heathen, and disperse them through the countries;";
hnv[23] = "Moreover I swore to them in the wilderness, that I would scatter them among the nations, and disperse them through the countries;";
vul[23] = "iterum levavi manum meam in eos in solitudine ut dispergerem illos in nationes et ventilarem in terras";
kjv[24] = "Because they had not executed my judgments, but had despised my statutes, and had polluted my sabbaths, and their eyes were after their fathers\' idols.";
rsv[24] = "because they had not executed my ordinances, but had rejected my statutes and profaned my sabbaths, and their eyes were set on their fathers\' idols.";
asv[24] = "because they had not executed mine ordinances, but had rejected my statutes, and had profaned my sabbaths, and their eyes were after their fathers\' idols.";
yng[24] = "Because My judgments they have not done, And My statutes they have despised, And My sabbaths they have polluted, And after idols of their fathers have their eyes been.";
dby[24] = "because they performed not mine ordinances, and rejected my statutes, and profaned my sabbaths, and their eyes were after their fathers\' idols.";
web[24] = "Because they had not executed my judgments, but had despised my statutes, and had profaned my sabbaths, and their eyes were after their fathers\' idols.";
hnv[24] = "because they had not executed my ordinances, but had rejected my statutes, and had profaned my Shabbatot, and their eyes were after their fathers\' idols.";
vul[24] = "eo quod iudicia mea non fecissent et praecepta mea reprobassent et sabbata mea violassent et post idola patrum suorum fuissent oculi eorum";
kjv[25] = "Wherefore I gave them also statutes [that were] not good, and judgments whereby they should not live;";
rsv[25] = "Moreover I gave them statutes that were not good and ordinances by which they could not have life;";
asv[25] = "Moreover also I gave them statutes that were not good, and ordinances wherein they should not live;";
yng[25] = "And I also, I have given to them statutes not good, And judgments by which they do not live.";
dby[25] = "And I also gave them statutes that were not good, and ordinances whereby they should not live;";
web[25] = "Wherefore I gave them also statutes [that were] not good, and judgments by which they should not live;";
hnv[25] = " Moreover also I gave them statutes that were not good, and ordinances in which they should not live;";
vul[25] = "ergo et ego dedi eis praecepta non bona et iudicia in quibus non vivent";
kjv[26] = "And I polluted them in their own gifts, in that they caused to pass through [the fire] all that openeth the womb, that I might make them desolate, to the end that they might know that I [am] the LORD.";
rsv[26] = "and I defiled them through their very gifts in making them offer by fire all their first-born, that I might horrify them; I did it that they might know that I am the LORD.";
asv[26] = "and I polluted them in their own gifts, in that they caused to pass through [the fire] all that openeth the womb, that I might make them desolate, to the end that they might know that I am Jehovah.";
yng[26] = "And I defile them by their own gifts, By causing to pass away every opener of a womb, So that I make them desolate, So that they know that I [am] Jehovah.";
dby[26] = "and I defiled them by their own gifts, in that they devoted all that opened the womb, that I might make them desolate, to the end that they might know that I [am] Jehovah.";
web[26] = "And I polluted them in their own gifts, in that they caused to pass through [the fire] all the first-born, that I might make them desolate, to the end that they might know that I [am] the LORD.";
hnv[26] = "and I polluted them in their own gifts, in that they caused to pass through [the fire] all that opens the womb, that I might make them desolate, to the end that they might know that I am the LORD.";
vul[26] = "et pollui eos in muneribus suis cum offerrent omne quod aperit vulvam propter delicta sua et scient quia ego Dominus";
kjv[27] = "Therefore, son of man, speak unto the house of Israel, and say unto them, Thus saith the Lord GOD; Yet in this your fathers have blasphemed me, in that they have committed a trespass against me.";
rsv[27] = "&quot;Therefore, son of man, speak to the house of Israel and say to them, Thus says the Lord GOD: In this again your fathers blasphemed me, by dealing treacherously with me.";
asv[27] = "Therefore, son of man, speak unto the house of Israel, and say unto them, Thus saith the Lord Jehovah: In this moreover have your fathers blasphemed me, in that they have committed a trespass against me.";
yng[27] = "Therefore, speak unto the house of Israel, son of man, and thou hast said unto them, Thus said the Lord Jehovah: Still in this have your fathers reviled Me, In their committing against Me a trespass.";
dby[27] = "Therefore, son of man, speak unto the house of Israel, and say unto them, Thus saith the Lord Jehovah: In this moreover have your fathers blasphemed me, in that they have wrought unfaithfulness against me.";
web[27] = "Therefore, son of man, speak to the house of Israel, and say to them, Thus saith the Lord GOD; Yet in this your fathers have blasphemed me, in that they have committed a trespass against me.";
hnv[27] = "Therefore, son of man, speak to the house of Yisra\'el, and tell them, Thus says the Lord GOD: In this moreover have your fathers blasphemed me, in that they have committed a trespass against me.";
vul[27] = "quam ob rem loquere ad domum Israhel fili hominis et dices ad eos haec dicit Dominus Deus adhuc et in hoc blasphemaverunt me patres vestri cum sprevissent me contemnentes";
kjv[28] = "[For] when I had brought them into the land, [for] the which I lifted up mine hand to give it to them, then they saw every high hill, and all the thick trees, and they offered there their sacrifices, and there they presented the provocation of their offering: there also they made their sweet savour, and poured out there their drink offerings.";
rsv[28] = "For when I had brought them into the land which I swore to give them, then wherever they saw any high hill or any leafy tree, there they offered their sacrifices and presented the provocation of their offering; there they sent up their soothing odors, and there they poured out their drink offerings.";
asv[28] = "For when I had brought them into the land, which I sware to give unto them, then they saw every high hill, and every thick tree, and they offered there their sacrifices, and there they presented the provocation of their offering; there also they made their sweet savor, and they poured out there their drink-offerings.";
yng[28] = "And I bring them in unto the land, That I did lift up My hand to give to them, And they see every high hill, and every thick tree, And they sacrifice there their sacrifices, And give there the provocation of their offering, And make there their sweet fragrance, And they pour out there their libations.";
dby[28] = "When I had brought them into the land which I had lifted up my hand to give unto them, then they saw every high hill and all the thick trees, and they offered there their sacrifices, and there they presented the provocation of their offering; and there they placed their sweet savour, and there poured out their drink-offerings.";
web[28] = "[For] when I had brought them into the land, [for] which I lifted up my hand to give it to them, then they saw every high hill, and all the thick trees, and they offered there their sacrifices, and there they presented the provocation of their offering: there also they made their sweet savor, and poured out there their drink-offerings.";
hnv[28] = "For when I had brought them into the land, which I swore to give to them, then they saw every high hill, and every thick tree, and they offered there their sacrifices, and there they presented the provocation of their offering; there also they made their sweet savor, and they poured out there their drink-offerings.";
vul[28] = "et induxissem eos in terram super quam levavi manum meam ut darem eis viderunt omnem collem excelsum et omne lignum nemorosum et immolaverunt ibi victimas suas et dederunt ibi inritationem oblationis suae et posuerunt ibi odorem suavitatis suae et libaverunt libationes suas";
kjv[29] = "Then I said unto them, What [is] the high place whereunto ye go? And the name thereof is called Bamah unto this day.";
rsv[29] = "(I said to them, What is the high place to which you go? So its name is called Bamah to this day.)";
asv[29] = "Then I said unto them, What meaneth the high place whereunto ye go? So the name thereof is called Bamah unto this day.";
yng[29] = "And I say unto them: What [is] the high place whither ye are going in? And its name is called `high place\' to this day.";
dby[29] = "And I said unto them, What is the high place whither ye go? And the name thereof is called Bamah unto this day.";
web[29] = "Then I said to them, What [is] the high place to which ye go? and its name is called Bamah to this day.";
hnv[29] = " Then I said to them, What means the high place whereunto you go? So the name of it is called Bamah to this day.";
vul[29] = "et dixi ad eos quid est excelsum ad quod vos ingredimini et vocatum est nomen eius Excelsum usque ad hanc diem";
kjv[30] = "Wherefore say unto the house of Israel, Thus saith the Lord GOD; Are ye polluted after the manner of your fathers? and commit ye whoredom after their abominations?";
rsv[30] = "Wherefore say to the house of Israel, Thus says the Lord GOD: Will you defile yourselves after the manner of your fathers and go astray after their detestable things?";
asv[30] = "Wherefore say unto the house of Israel, Thus saith the Lord Jehovah: Do ye pollute yourselves after the manner of your fathers? and play ye the harlot after their abominations?";
yng[30] = "Therefore, say unto the house of Israel: Thus said the Lord Jehovah: In the way of your fathers are ye defiled? And after their detestable things go a-whoring?";
dby[30] = "Therefore say unto the house of Israel, Thus saith the Lord Jehovah: Do ye defile yourselves after the manner of your fathers? and do ye commit fornication after their abominations?";
web[30] = "Wherefore say to the house of Israel, Thus saith the Lord GOD; Are ye polluted after the manner of your fathers? and commit ye lewd deeds after their abominations?";
hnv[30] = "Therefore tell the house of Yisra\'el, Thus says the Lord GOD: Do you pollute yourselves after the manner of your fathers? and play you the prostitute after their abominations?";
vul[30] = "propterea dic ad domum Israhel haec dicit Dominus Deus certe in via patrum vestrorum vos polluimini et post offendicula eorum vos fornicamini";
kjv[31] = "For when ye offer your gifts, when ye make your sons to pass through the fire, ye pollute yourselves with all your idols, even unto this day: and shall I be enquired of by you, O house of Israel? [As] I live, saith the Lord GOD, I will not be enquired of by you.";
rsv[31] = "When you offer your gifts and sacrifice your sons by fire, you defile yourselves with all your idols to this day. And shall I be inquired of by you, O house of Israel? As I live, says the Lord GOD, I will not be inquired of by you.";
asv[31] = "and when ye offer your gifts, when ye make your sons to pass through the fire, do ye pollute yourselves with all your idols unto this day? and shall I be inquired of by you, O house of Israel? As I live, saith the Lord Jehovah, I will not be inquired of by you;";
yng[31] = "And in the offering of your gifts, In causing your sons to pass through fire, Ye are defiled by all your idols to this day, And I am sought by you, O house of Israel! I live -- an affirmation of the Lord Jehovah, I am not sought by you.";
dby[31] = "And when ye offer your gifts, making your sons to pass through the fire, ye defile yourselves with all your idols, even unto this day; and shall I be inquired of by you, O house of Israel? [As] I live, saith the Lord Jehovah, I will not be inquired of by you.";
web[31] = "For when ye offer your gifts, when ye make your sons to pass through the fire, ye pollute yourselves with all your idols, even to this day: and shall I be inquired of by you, O house of Israel? [As] I live, saith the Lord GOD, I will not be inquired of by you.";
hnv[31] = "and when you offer your gifts, when you make your sons to pass through the fire, do you pollute yourselves with all your idols to this day? and shall I be inquired of by you, house of Yisra\'el? As I live, says the Lord GOD, I will not be inquired of by you;";
vul[31] = "et in oblatione donorum vestrorum cum transducitis filios vestros per ignem vos polluimini in omnibus idolis vestris usque hodie et ego respondebo vobis domus Israhel vivo ego dicit Dominus Deus quia non respondebo vobis";
kjv[32] = "And that which cometh into your mind shall not be at all, that ye say, We will be as the heathen, as the families of the countries, to serve wood and stone.";
rsv[32] = "&quot;What is in your mind shall never happen--the thought, \'Let us be like the nations, like the tribes of the countries, and worship wood and stone.\'";
asv[32] = "and that which cometh into your mind shall not be at all, in that ye say, We will be as the nations, as the families of the countries, to serve wood and stone.";
yng[32] = "And that which is going up on your mind, It is not at all -- in that ye are saying: We will be as the nations, as the families of the lands, To serve wood and stone.";
dby[32] = "And that which cometh into your mind shall not be at all, that ye say, We will be as the nations, as the families of the countries, in serving wood and stone.";
web[32] = "And that which cometh into your mind shall not be at all, that ye say, We will be as the heathen, as the families of the countries, to serve wood and stone.";
hnv[32] = "and that which comes into your mind shall not be at all, in that you say, We will be as the nations, as the families of the countries, to serve wood and stone.";
vul[32] = "neque cogitatio mentis vestrae fiet dicentium erimus sicut gentes et sicut cognationes terrae ut colamus ligna et lapides";
kjv[33] = "[As] I live, saith the Lord GOD, surely with a mighty hand, and with a stretched out arm, and with fury poured out, will I rule over you:";
rsv[33] = "&quot;As I live, says the Lord GOD, surely with a mighty hand and an outstretched arm, and with wrath poured out, I will be king over you.";
asv[33] = "As I live, saith the Lord Jehovah, surely with a mighty hand, and with an outstretched arm, and with wrath poured out, will I be king over you:";
yng[33] = "I live -- an affirmation of the Lord Jehovah, Do not I, with a strong hand, And with a stretched-out arm, And with fury poured out -- rule over you?";
dby[33] = "[As] I live, saith the Lord Jehovah, verily with a mighty hand, and with an outstretched arm, and with fury poured out, will I reign over you.";
web[33] = "[As] I live, saith the Lord GOD, surely with a mighty hand, and with an out-stretched arm, and with fury poured out, will I rule over you:";
hnv[33] = "As I live, says the Lord GOD, surely with a mighty hand, and with an outstretched arm, and with wrath poured out, will I be king over you:";
vul[33] = "vivo ego dicit Dominus Deus quoniam in manu forti et brachio extento et in furore effuso regnabo super vos";
kjv[34] = "And I will bring you out from the people, and will gather you out of the countries wherein ye are scattered, with a mighty hand, and with a stretched out arm, and with fury poured out.";
rsv[34] = "I will bring you out from the peoples and gather you out of the countries where you are scattered, with a mighty hand and an outstretched arm, and with wrath poured out;";
asv[34] = "and I will bring you out from the peoples, and will gather you out of the countries wherein ye are scattered, with a mighty hand, and with an outstretched arm, and with wrath poured out;";

asv[38] = "and I will purge out from among you the rebels, and them that transgress against me; I will bring them forth out of the land where they sojourn, but they shall not enter into the land of Israel: and ye shall know that I am Jehovah.";
yng[38] = "And cleared out from you the rebels, And them transgressing against Me, From the land of their sojournings I bring them out, And unto the land of Israel they come not, And ye have known that I [am] Jehovah.";

kjv[39] = "As for you, O house of Israel, thus saith the Lord GOD; Go ye, serve ye every one his idols, and hereafter [also], if ye will not hearken unto me: but pollute ye my holy name no more with your gifts, and with your idols.";
rsv[39] = "&quot;As for you, O house of Israel, thus says the Lord GOD: Go serve every one of you his idols, now and hereafter, if you will not listen to me; but my holy name you shall no more profane with your gifts and your idols.";
asv[39] = "As for you, O house of Israel, thus saith the Lord Jehovah: Go ye, serve every one his idols, and hereafter also, if ye will not hearken unto me; but my holy name shall ye no more profane with your gifts, and with your idols.";
yng[39] = "And ye, O house of Israel, thus said the Lord Jehovah: Each his idols -- go -- serve ye, And, afterwards, if ye are not hearkening to me, And My holy name ye do not pollute any more by your gifts, and by your idols.";
dby[39] = "As for you, O house of Israel, thus saith the Lord Jehovah: Go ye, serve every one his idols henceforth also, if none of you will hearken unto me; but profane my holy name no more with your gifts and with your idols.";
web[39] = "As for you, O house of Israel, thus saith the Lord GOD; Go ye, serve ye every one his idols, and hereafter [also], if ye will not hearken to me: but profane ye my holy name no more with your gifts, and with your idols.";
hnv[39] = "As for you, house of Yisra\'el, thus says the Lord GOD: Go you, serve everyone his idols, and hereafter also, if you will not listen to me; but my holy name shall you no more profane with your gifts, and with your idols.";
vul[39] = "et vos domus Israhel haec dicit Dominus Deus singuli post idola vestra ambulate et servite eis quod si et in hoc non audieritis me et nomen meum sanctum pollueritis ultra in muneribus vestris et in idolis vestris";
kjv[40] = "For in mine holy mountain, in the mountain of the height of Israel, saith the Lord GOD, there shall all the house of Israel, all of them in the land, serve me: there will I accept them, and there will I require your offerings, and the firstfruits of your oblations, with all your holy things.";
rsv[40] = "&quot;For on my holy mountain, the mountain height of Israel, says the Lord GOD, there all the house of Israel, all of them, shall serve me in the land; there I will accept them, and there I will require your contributions and the choicest of your gifts, with all your sacred offerings.";
asv[40] = "For in my holy mountain, in the mountain of the height of Israel, saith the Lord Jehovah, there shall all the house of Israel, all of them, serve me in the land: there will I accept them, and there will I require your offerings, and the first-fruits of your oblations, with all your holy things.";
yng[40] = "For, in My holy mountain, In the mountain of the height of Israel, An affirmation of the Lord Jehovah, There serve Me do all the house of Israel, All of it, in the land -- there I accept them, And there I do seek your heave-offerings, And with the first-fruit of your gifts, With all your holy things.";
dby[40] = "For in my holy mountain, in the mountain of the height of Israel, saith the Lord Jehovah, there shall all the house of Israel serve me, the whole of it, in the land; there will I accept them, and there will I require your heave-offerings and the first-fruits of your offerings, with all your holy things.";
web[40] = "For on my holy mountain, on the mountain of the hight of Israel, saith the Lord GOD, there shall all the house of Israel, all of them in the land, serve me: there will I accept them, and there will I require your offerings, and the first fruits of your oblations, with all your holy things.";
hnv[40] = "For in my holy mountain, in the mountain of the height of Yisra\'el, says the Lord GOD, there shall all the house of Yisra\'el, all of them, serve me in the land: there will I accept them, and there will I require your offerings, and the first fruits of your offerings, with all your holy things.";
vul[40] = "in monte sancto meo in monte excelso Israhel ait Dominus Deus ibi serviet mihi omnis domus Israhel omnes inquam in terra in qua placebunt mihi et ibi quaeram primitias vestras et initium decimarum vestrarum in omnibus sanctificationibus vestris";

kjv[47] = "And say to the forest of the south, Hear the word of the LORD; Thus saith the Lord GOD; Behold, I will kindle a fire in thee, and it shall devour every green tree in thee, and every dry tree: the flaming flame shall not be quenched, and all faces from the south to the north shall be burned therein.";

asv[47] = "and say to the forest of the South, Hear the word of Jehovah: Thus saith the Lord Jehovah, Behold, I will kindle a fire in thee, and it shall devour every green tree in thee, and every dry tree: the flaming flame shall not be quenched, and all faces from the south to the north shall be burnt thereby.";
yng[47] = "and thou hast said to the forest of the south: Hear a word of Jehovah: Thus said the Lord Jehovah: Lo, I am kindling in thee a fire, And it hath devoured in thee every moist tree, and every dry tree, Not quenched is the glowing flames, And burnt by it have been all faces from south to north.";
dby[47] = "and say to the forest of the south, Hear the word of Jehovah. Thus saith the Lord Jehovah: Behold, I will kindle a fire in thee, and it shall devour every green tree in thee, and every dry tree: the flashing flame shall not be quenched; and all that it meets from the south to the north shall be burned thereby.";

hnv[47] = "and tell the forest of the South, Hear the word of the LORD: Thus says the Lord GOD, Behold, I will kindle a fire in you, and it shall devour every green tree in you, and every dry tree: the flaming flame shall not be quenched, and all faces from the south to the north shall be burnt thereby.";
vul[47] = "et dices saltui meridiano audi verbum Domini haec dicit Dominus Deus ecce ego succendam in te ignem et conburam in te omne lignum viride et omne lignum aridum non extinguetur flamma succensionis et conburetur in ea omnis facies ab austro usque ad aquilonem";
