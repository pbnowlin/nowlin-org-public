csb[1] = "The word of the LORD came to me:";
csb[2] = "&quot;Son of man, face the mountains of Israel and prophesy against them.";
csb[3] = "&quot;You are to say: Mountains of Israel, hear the word of the Lord GOD! This is what the Lord GOD says to the mountains and the hills, to the ravines and the valleys: I am about to bring a sword against you, and I will destroy your high places.";
csb[4] = "&quot;Your altars will be desolated and your shrines smashed. I will throw down your slain in front of your idols.";
csb[5] = "&quot;I will lay the corpses of the Israelites in front of their idols and scatter your bones around your altars.";
csb[6] = "&quot;Wherever you live the cities will be in ruins and the high places will be desolate, so that your altars will lie in ruins and be desecrated, your idols smashed and obliterated, your shrines cut down, and what you have made wiped out.";
csb[7] = "&quot;The slain will fall among you, and you will know that I am the LORD.";
csb[8] = "&quot;Yet I will leave a remnant when you are scattered among the nations, for throughout the countries there will be some of you who will escape the sword.";
csb[9] = "&quot;Then your survivors will remember me among the nations where they are taken captive, how I was crushed by their promiscuous hearts that turned away from me and by their eyes that lusted after their idols. They will loathe themselves because of the evil things they did, their detestable actions of every kind.";
csb[10] = "&quot;And they will know that I am the LORD; I did not threaten to bring this disaster on them without a reason.";
csb[11] = "&quot;This is what the Lord GOD says: Clap your hands, stamp your feet, and cry out over all the evil and detestable practices of the house of Israel, who will fall by the sword, famine, and plague.";
csb[12] = "&quot;The one who is far off will die by plague; the one who is near will fall by the sword; and the one who remains and is spared will die of famine. In this way I will exhaust my wrath on them.";
csb[13] = "&quot;You will all know that I am the LORD when their slain lie among their idols around their altars, on every high hill, on all the mountaintops, and under every green tree and every leafy oak -- the places where they offered pleasing aromas to all their idols.";
csb[14] = "&quot;I will stretch out my hand against them, and wherever they live I will make the land a desolate waste, from the wilderness to Diblah. Then they will know that I am the LORD.&quot;";

kjv[3] = "And say, Ye mountains of Israel, hear the word of the Lord GOD; Thus saith the Lord GOD to the mountains, and to the hills, to the rivers, and to the valleys; Behold, I, [even] I, will bring a sword upon you, and I will destroy your high places.";

yng[3] = "And thou hast said: Mountains of Israel, Hear ye a word of the Lord Jehovah: Thus said the Lord Jehovah To the mountains, and to the hills, To the streams, and to the valleys, Lo, I, I am bringing in against you a sword, And I have destroyed your high places.";

kjv[9] = "And they that escape of you shall remember me among the nations whither they shall be carried captives, because I am broken with their whorish heart, which hath departed from me, and with their eyes, which go a whoring after their idols: and they shall lothe themselves for the evils which they have committed in all their abominations.";
rsv[9] = "then those of you who escape will remember me among the nations where they are carried captive, when I have broken their wanton heart which has departed from me, and blinded their eyes which turn wantonly after their idols; and they will be loathsome in their own sight for the evils which they have committed, for all their abominations.";
asv[9] = "And those of you that escape shall remember me among the nations whither they shall be carried captive, how that I have been broken with their lewd heart, which hath departed from me, and with their eyes, which play the harlot after their idols: and they shall loathe themselves in their own sight for the evils which they have committed in all their abominations.";
yng[9] = "And remembered Me have your escaped among nations, Whither they have been taken captive, Because I have been broken with their heart that is going a-whoring, That hath turned aside from off Me, And with their eyes they are going a-whoring after their idols, And they have been loathsome in their own faces, For the evils that they have done -- all their abominations.";
dby[9] = "And they that escape of you shall remember me among the nations whither they have been carried captives, when I shall have broken their whorish heart, which hath departed from me, and their eyes, which go a whoring after their idols; and they shall loathe themselves for the evils which they have committed, in all their abominations.";
web[9] = "And they that escape of you shall remember me among the nations whither they shall be carried captives, because I am broken with their apostate heart, which hath departed from me, and with their eyes which go astray after their idols: and they shall lothe themselves for the evils which they have committed in all their abominations.";
hnv[9] = "Those of you that escape shall remember me among the nations where they shall be carried captive, how that I have been broken with their lewd heart, which has departed from me, and with they eyes, which play the prostitute after their idols: and they shall loathe themselves in their own sight for the evils which they have committed in all their abominations.";
vul[9] = "et recordabuntur mei liberati vestri in gentibus ad quas captivi ducti sunt quia contrivi cor eorum fornicans et recedens a me et oculos eorum fornicantes post idola sua et displicebunt sibimet super malis quae fecerunt in universis abominationibus suis";

kjv[11] = "Thus saith the Lord GOD; Smite with thine hand, and stamp with thy foot, and say, Alas for all the evil abominations of the house of Israel! for they shall fall by the sword, by the famine, and by the pestilence.";

kjv[13] = "Then shall ye know that I [am] the LORD, when their slain [men] shall be among their idols round about their altars, upon every high hill, in all the tops of the mountains, and under every green tree, and under every thick oak, the place where they did offer sweet savour to all their idols.";
rsv[13] = "And you shall know that I am the LORD, when their slain lie among their idols round about their altars, upon every high hill, on all the mountain tops, under every green tree, and under every leafy oak, wherever they offered pleasing odor to all their idols.";

yng[13] = "And ye have known that I [am] Jehovah, In their wounded being in the midst of their idols, Round about their altars, On every high hill, on all tops of mountains, And under every green tree, and under every thick oak, The place where they gave sweet fragrance to all their idols.";
