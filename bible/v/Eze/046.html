csb[1] = "&quot;This is what the Lord GOD says: The gate of the inner court that faces east is to be closed during the six days of work, but it will be opened on the Sabbath day and opened on the day of the New Moon.";
csb[2] = "&quot;The prince should enter from the outside by way of the gate\'s portico and stand at the gate\'s doorpost while the priests sacrifice his burnt offerings and fellowship offerings. He will bow in worship at the gate\'s threshold and then depart, but the gate is not to be closed until evening.";
csb[3] = "&quot;The people of the land will also bow in worship before the LORD at the entrance of that gate on the Sabbaths and New Moons.";
csb[4] = "&quot;The burnt offering that the prince presents to the LORD on the Sabbath day is to be six unblemished lambs and an unblemished ram.";
csb[5] = "&quot;The grain offering will be half a bushel with the ram, and the grain offering with the lambs will be whatever he wants to give, as well as a gallon of oil for every half bushel.";
csb[6] = "&quot;On the day of the New Moon, the burnt offering is to be a young, unblemished bull, as well as six lambs and a ram without blemish.";
csb[7] = "&quot;He will provide a grain offering of half a bushel with the bull, half a bushel with the ram, and whatever he can afford with the lambs, together with a gallon of oil for every half bushel.";
csb[8] = "&quot;When the prince enters, he is to go in by way of the gate\'s portico and go out the same way.";
csb[9] = "&quot;When the people of the land come before the LORD at the appointed times, whoever enters by way of the north gate to worship is to go out by way of the south gate, and whoever enters by way of the south gate is to go out by way of the north gate. No one may return through the gate by which he entered, but is to go out by the opposite gate.";
csb[10] = "&quot;When the people enter, the prince will enter with them, and when they leave, he will leave.";
csb[11] = "&quot;At the festivals and appointed times, the grain offering will be half a bushel with the bull, half a bushel with the ram, and whatever he wants to give with the lambs, along with a gallon of oil for every half bushel.";
csb[12] = "&quot;When the prince makes a freewill offering, whether a burnt offering or a fellowship offering as a freewill offering to the LORD, the gate that faces east is to be opened for him. He is to offer his burnt offering or fellowship offering just as he does on the Sabbath day. Then he will go out, and the gate is to be closed after he leaves.";
csb[13] = "&quot;You are to offer an unblemished year-old male lamb as a daily burnt offering to the LORD; you will offer it every morning.";
csb[14] = "&quot;You are also to prepare a grain offering every morning along with it: three quarts, with one-third of a gallon of oil to moisten the fine flour -- a grain offering to the LORD. This is a permanent statute to be observed regularly.";
csb[15] = "&quot;They will offer the lamb, the grain offering, and the oil every morning as a regular burnt offering.";
csb[16] = "&quot;This is what the Lord GOD says: If the prince gives a gift to each of his sons as their inheritance, it will belong to his sons. It will become their property by inheritance.";
csb[17] = "&quot;But if he gives a gift from his inheritance to one of his servants, it will belong to that servant until the year of freedom, when it will revert to the prince. His inheritance belongs only to his sons; it is theirs.";
csb[18] = "&quot;The prince must not take any of the people\'s inheritance, evicting them from their property. He is to provide an inheritance for his sons from his own property, so that none of my people will be displaced from his own property.&quot;";
csb[19] = "Then he brought me through the entrance that was at the side of the gate, into the priests\' holy chambers, which faced north. I saw a place there at the far western end.";
csb[20] = "He said to me, &quot;This is the place where the priests will boil the guilt offering and the sin offering, and where they will bake the grain offering, so that they do not bring them into the outer court and transmit holiness to the people.&quot;";
csb[21] = "Next he brought me into the outer court and led me past its four corners. There was a separate court in each of its corners.";
csb[22] = "In the four corners of the outer court there were enclosed courts, 70 feet long by 52 1/2 feet wide. All four corner areas had the same dimensions.";
csb[23] = "There was a stone wall around the inside of them, around the four of them, with ovens built at the base of the walls on all sides.";
csb[24] = "He said to me: &quot;These are the kitchens where those who minister at the temple will cook the people\'s sacrifices.&quot;";
kjv[1] = "Thus saith the Lord GOD; The gate of the inner court that looketh toward the east shall be shut the six working days; but on the sabbath it shall be opened, and in the day of the new moon it shall be opened.";

yng[1] = "`Thus said the Lord Jehovah: The gate of the inner court that is looking eastward is shut the six days of work, and on the day of rest it is opened, and in the day of the new moon it is opened;";

kjv[2] = "And the prince shall enter by the way of the porch of [that] gate without, and shall stand by the post of the gate, and the priests shall prepare his burnt offering and his peace offerings, and he shall worship at the threshold of the gate: then he shall go forth; but the gate shall not be shut until the evening.";
rsv[2] = "The prince shall enter by the vestibule of the gate from without, and shall take his stand by the post of the gate. The priests shall offer his burnt offering and his peace offerings, and he shall worship at the threshold of the gate. Then he shall go out, but the gate shall not be shut until evening.";
asv[2] = "And the prince shall enter by the way of the porch of the gate without, and shall stand by the post of the gate; and the priests shall prepare his burnt-offering and his peace-offerings, and he shall worship at the threshold of the gate: then he shall go forth; but the gate shall not be shut until the evening.";
yng[2] = "and come in hath the prince the way of the porch of the gate at the outside, and he hath stood by the post of the gate, and the priests have made his burnt-offering, and his peace-offerings, and he hath bowed himself by the opening of the gate, and hath gone forth, and the gate is not shut till the evening.";
dby[2] = "And the prince shall enter by the way of the porch of [that] gate from without, and shall stand by the post of the gate, and the priests shall offer his burnt-offering and his peace-offerings, and he shall worship at the threshold of the gate, and shall go forth: but the gate shall not be shut until the evening.";
web[2] = "And the prince shall enter by the way of the porch of [that] gate without, and shall stand by the post of the gate, and the priest shall prepare his burnt-offering and his peace-offerings, and he shall worship at the threshhold of the gate: then he shall go forth; but the gate shall not be shut until the evening.";
hnv[2] = "The prince shall enter by the way of the porch of the gate outside, and shall stand by the post of the gate; and the Kohanim shall prepare his burnt-offering and his peace-offerings, and he shall worship at the threshold of the gate: then he shall go forth; but the gate shall not be shut until the evening.";

kjv[9] = "But when the people of the land shall come before the LORD in the solemn feasts, he that entereth in by the way of the north gate to worship shall go out by the way of the south gate; and he that entereth by the way of the south gate shall go forth by the way of the north gate: he shall not return by the way of the gate whereby he came in, but shall go forth over against it.";
rsv[9] = "&quot;When the people of the land come before the LORD at the appointed feasts, he who enters by the north gate to worship shall go out by the south gate; and he who enters by the south gate shall go out by the north gate: no one shall return by way of the gate by which he entered, but each shall go out straight ahead.";
asv[9] = "But when the people of the land shall come before Jehovah in the appointed feasts, he that entereth by the way of the north gate to worship shall go forth by the way of the south gate; and he that entereth by the way of the south gate shall go forth by the way of the north gate: he shall not return by the way of the gate whereby he came in, but shall go forth straight before him.";
yng[9] = "And in the coming in of the people of the land before Jehovah at appointed times, he who hath come in the way of the north gate to bow himself, goeth out the way of the south gate, and he who hath come in the way of the south gate, goeth out by the way of the north gate: he doth not turn back the way of the gate by which he came in, but over-against it he goeth out.";
dby[9] = "And when the people of the land come in before Jehovah in the set feasts, he that cometh in by the way of the north gate to worship shall go out by the way of the south gate; and he that cometh in by the way of the south gate shall go out by the way of the north gate: he shall not return by the way of the gate by which he came in, but shall go out straight before him.";
web[9] = "But when the people of the land shall come before the LORD in the solemn feasts, he that entereth in by the way of the north gate to worship shall go out by the way of the south gate; and he that entereth by the way of the south gate shall go forth by the way of the north gate: he shall not return by the way of the gate by which he came in, but shall go forth over against it.";
hnv[9] = "But when the people of the land shall come before the LORD in the appointed feasts, he who enters by the way of the north gate to worship shall go forth by the way of the south gate; and he who enters by the way of the south gate shall go forth by the way of the north gate: he shall not return by the way of the gate by which he came in, but shall go forth straight before him.";
vul[9] = "et cum intrabit populus terrae in conspectu Domini in sollemnitatibus qui ingreditur per portam aquilonis ut adoret egrediatur per viam portae meridianae porro qui ingreditur per viam portae meridianae egrediatur per viam portae aquilonis non revertetur per viam portae per quam ingressus est sed e regione illius egredietur";

asv[11] = "And in the feasts and in the solemnities the meal-offering shall be an ephah for a bullock, and an ephah for a ram, and for the lambs as he is able to give, and a hin of oil to an ephah.";

kjv[12] = "Now when the prince shall prepare a voluntary burnt offering or peace offerings voluntarily unto the LORD, [one] shall then open him the gate that looketh toward the east, and he shall prepare his burnt offering and his peace offerings, as he did on the sabbath day: then he shall go forth; and after his going forth [one] shall shut the gate.";
rsv[12] = "When the prince provides a freewill offering, either a burnt offering or peace offerings as a freewill offering to the LORD, the gate facing east shall be opened for him; and he shall offer his burnt offering or his peace offerings as he does on the sabbath day. Then he shall go out, and after he has gone out the gate shall be shut.";
asv[12] = "And when the prince shall prepare a freewill-offering, a burnt-offering or peace-offerings as a freewill-offering unto Jehovah, one shall open for him the gate that looketh toward the east; and he shall prepare his burnt-offering and his peace-offerings, as he doth on the sabbath day: then he shall go forth; and after his going forth one shall shut the gate.";
yng[12] = "And when the prince maketh a free-will burnt-offering, or free-will peace-offerings, to Jehovah, then he hath opened for himself the gate that is looking eastward, and he hath made his burnt-offering and his peace-offerings as he doth in the day of rest, and he hath gone out, and he hath shut the gate after his going out.";
dby[12] = "And when the prince shall offer a voluntary burnt-offering or voluntary peace-offerings unto Jehovah, the gate that looketh toward the east shall be opened for him and he shall offer his burnt-offering and his peace-offerings as he did on the sabbath-day, and he shall go out again, and the gate shall be shut after he hath gone out.";
web[12] = "Now when the prince shall prepare a voluntary burnt-offering or peace-offerings voluntarily to the LORD, [one] shall then open to him the gate that looketh towards the east, and he shall prepare his burnt-offering and his peace-offerings, as he did on the sabbath-day: then he shall go forth; and after his going forth [one] shall shut the gate.";
hnv[12] = "When the prince shall prepare a freewill-offering, a burnt offering or peace-offerings as a freewill-offering to the LORD, one shall open for him the gate that looks toward the east; and he shall prepare his burnt offering and his peace-offerings, as he does on the day of Shabbat: then he shall go forth; and after his going forth one shall shut the gate.";

asv[14] = "And thou shalt prepare a meal-offering with it morning by morning, the sixth part of an ephah, and the third part of a hin of oil, to moisten the fine flour; a meal-offering unto Jehovah continually by a perpetual ordinance.";
yng[14] = "And a present thou dost make for it morning by morning, a sixth part of the ephah, and of oil a third part of the hin, to temper with the fine flour, a present to Jehovah, by a statute age-during -- continually;";
dby[14] = "And thou shalt prepare an oblation with it every morning, the sixth part of an ephah, and of oil the third part of a hin, to moisten the fine flour: an oblation unto Jehovah continually by a perpetual ordinance.";

hnv[14] = "You shall prepare a meal-offering with it morning by morning, the sixth part of an efah, and the third part of a hin of oil, to moisten the fine flour; a meal-offering to the LORD continually by a perpetual ordinance.";

kjv[15] = "Thus shall they prepare the lamb, and the meat offering, and the oil, every morning [for] a continual burnt offering.";

asv[15] = "Thus shall they prepare the lamb, and the meal-offering, and the oil, morning by morning, for a continual burnt-offering.";
yng[15] = "and prepare ye the lamb, and the present, and the oil, morning by morning, a continual burnt-offering.";
dby[15] = "They shall offer the lamb, and the oblation, and the oil, every morning for a continual burnt-offering.";
web[15] = "Thus shall they prepare the lamb, and the meat-offering, and the oil, every morning [for] a continual burnt-offering.";
hnv[15] = "Thus shall they prepare the lamb, and the meal-offering, and the oil, morning by morning, for a continual burnt offering.";
vul[15] = "faciet agnum et sacrificium et oleum cata mane mane holocaustum sempiternum";
kjv[16] = "Thus saith the Lord GOD; If the prince give a gift unto any of his sons, the inheritance thereof shall be his sons\'; it [shall be] their possession by inheritance.";
rsv[16] = "&quot;Thus says the Lord GOD: If the prince makes a gift to any of his sons out of his inheritance, it shall belong to his sons, it is their property by inheritance.";
asv[16] = "Thus saith the Lord Jehovah: If the prince give a gift unto any of his sons, it is his inheritance, it shall belong to his sons; it is their possession by inheritance.";
yng[16] = "`Thus said the Lord Jehovah: When the prince giveth a gift to any of his sons, his inheritance it [is], to his sons it [is]; their possession it [is] by inheritance.";
dby[16] = "Thus saith the Lord Jehovah: If the prince give a gift unto any of his sons, it shall be that one\'s inheritance, for his sons: it shall be their possession by inheritance.";
web[16] = "Thus saith the Lord GOD; If the prince shall give a gift to any of his sons, the inheritance of it shall be to his sons; it [shall be] their possession by inheritance.";
hnv[16] = "Thus says the Lord GOD: If the prince give a gift to any of his sons, it is his inheritance, it shall belong to his sons; it is their possession by inheritance.";
vul[16] = "haec dicit Dominus Deus si dederit princeps donum alicui de filiis suis hereditas eius filiorum suorum erit possidebunt ea hereditarie";
kjv[17] = "But if he give a gift of his inheritance to one of his servants, then it shall be his to the year of liberty; after it shall return to the prince: but his inheritance shall be his sons\' for them.";
rsv[17] = "But if he makes a gift out of his inheritance to one of his servants, it shall be his to the year of liberty; then it shall revert to the prince; only his sons may keep a gift from his inheritance.";
asv[17] = "But if he give of his inheritance a gift to one of his servants, it shall be his to the year of liberty; then it shall return to the prince; but as for his inheritance, it shall be for his sons.";
yng[17] = "And when he giveth a gift out of his inheritance to one of his servants, then it hath been to him till the year of freedom, and it hath turned back to the prince, only the inheritance of his sons is theirs.";
dby[17] = "But if he give a gift of his inheritance to one of his servants, it shall be his until the year of liberty; and it shall return to the prince: to his sons alone shall his inheritance remain.";
web[17] = "But if he shall give a gift of his inheritance to one of his servants, then it shall be his to the year of liberty; afterward it shall return to the prince: but his inheritance shall be to his sons for them.";
hnv[17] = "But if he give of his inheritance a gift to one of his servants, it shall be his to the year of liberty; then it shall return to the prince; but as for his inheritance, it shall be for his sons.";
vul[17] = "si autem dederit legatum de hereditate sua uni servorum suorum erit illius usque ad annum remissionis et revertetur ad principem hereditas autem eius filiis eius erit";
kjv[18] = "Moreover the prince shall not take of the people\'s inheritance by oppression, to thrust them out of their possession; [but] he shall give his sons inheritance out of his own possession: that my people be not scattered every man from his possession.";
rsv[18] = "The prince shall not take any of the inheritance of the people, thrusting them out of their property; he shall give his sons their inheritance out of his own property, so that none of my people shall be dispossessed of his property.&quot;";
asv[18] = "Moreover the prince shall not take of the people\'s inheritance, to thrust them out of their possession; he shall give inheritance to his sons out of his own possession, that my people be not scattered every man from his possession.";
yng[18] = "And the prince doth not take of the inheritance of the people to oppress them, out of their possession, out of his own possession he doth cause his sons to inherit, so that My people are not scattered each from his possession.\'";
dby[18] = "And the prince shall not take of the people\'s inheritance, to thrust them by oppression out of their possession: he shall give his sons an inheritance out of his own possession: that my people be not scattered every one from his possession.";
web[18] = "Moreover the prince shall not take of the people\'s inheritance by oppression, to thrust them out of their possession; [but] he shall give his sons\' inheritance out of his own possession: that my people be not scattered every man from his possession.";
hnv[18] = "Moreover the prince shall not take of the people\'s inheritance, to thrust them out of their possession; he shall give inheritance to his sons out of his own possession, that my people not be scattered every man from his possession.";
vul[18] = "et non accipiet princeps de hereditate populi per violentiam et de possessione eorum sed de possessione sua hereditatem dabit filiis suis ut non dispergatur populus meus unusquisque a possessione sua";
kjv[19] = "After he brought me through the entry, which [was] at the side of the gate, into the holy chambers of the priests, which looked toward the north: and, behold, there [was] a place on the two sides westward.";
rsv[19] = "Then he brought me through the entrance, which was at the side of the gate, to the north row of the holy chambers for the priests; and there I saw a place at the extreme western end of them.";
asv[19] = "Then he brought me through the entry, which was at the side of the gate, into the holy chambers for the priests, which looked toward the north: and, behold, there was a place on the hinder part westward.";
yng[19] = "And he bringeth me in through the entrance that [is] by the side of the gate, unto the holy chambers, unto the priests, that are looking northward, and lo, there [is] a place in their two sides westward.";
dby[19] = "Then he brought me through the passage which was at the side of the gate, into the holy cells which were for the priests, which looked toward the north; and behold, a place was there at the end westward.";
web[19] = "Afterward he brought me through the entry, which [was] at the side of the gate, into the holy chambers of the priests, which looked towards the north: and behold, there [was] a place on the two sides westward.";
hnv[19] = "Then he brought me through the entry, which was at the side of the gate, into the holy chambers for the Kohanim, which looked toward the north: and, behold, there was a place on the hinder part westward.";
vul[19] = "et introduxit me per ingressum qui erat ex latere portae in gazofilacia sanctuarii ad sacerdotes quae respiciebant ad aquilonem et erat ibi locus vergens ad occidentem";
kjv[20] = "Then said he unto me, This [is] the place where the priests shall boil the trespass offering and the sin offering, where they shall bake the meat offering; that they bear [them] not out into the utter court, to sanctify the people.";
rsv[20] = "And he said to me, &quot;This is the place where the priests shall boil the guilt offering and the sin offering, and where they shall bake the cereal offering, in order not to bring them out into the outer court and so communicate holiness to the people.&quot;";
asv[20] = "And he said unto me, This is the place where the priests shall boil the trespass-offering and the sin-offering, [and] where they shall bake the meal-offering; that they bring them not forth into the outer court, to sanctify the people.";
yng[20] = "And he saith unto me, `This [is] the place where the priests do boil the guilt-offering and the sin-offering, where they bake the present, so as not to bring [it] out unto the outer court, to sanctify the people.\'";
dby[20] = "And he said unto me, This is the place where the priests shall boil the trespass-offering, and the sin-offering, [and] where they shall bake the oblation, that they bring them not out into the outer court, so as to hallow the people.";
web[20] = "Then said he to me, This [is] the place where the priests shall boil the trespass-offering and the sin-offering, where they shall bake the meat-offering; that they bear [them] not out into the outer court, to sanctify the people.";
hnv[20] = "He said to me, This is the place where the Kohanim shall boil the trespass-offering and the sin-offering, [and] where they shall bake the meal-offering; that they not bring them forth into the outer court, to sanctify the people.";
vul[20] = "et dixit ad me iste est locus ubi coquent sacerdotes pro delicto et pro peccato ubi coquent sacrificium ut non efferant in atrio exteriori et sanctificetur populus";
kjv[21] = "Then he brought me forth into the utter court, and caused me to pass by the four corners of the court; and, behold, in every corner of the court [there was] a court.";
rsv[21] = "Then he brought me forth to the outer court, and led me to the four corners of the court; and in each corner of the court there was a court--";
asv[21] = "Then he brought me forth into the outer court, and caused me to pass by the four corners of the court; and, behold, in every corner of the court there was a court.";
yng[21] = "And he bringeth me out unto the outer court, and causeth me to pass over unto the four corners of the court, and lo, a court in a corner of the court, a court in a corner of the corner.";
dby[21] = "And he brought me forth into the outer court, and caused me to pass by the four corners of the court; and behold, in every corner of the court there was a court.";
web[21] = "Then he brought me forth into the outer court, and caused me to pass by the four corners of the court; and behold, in every corner of the court [there was] a court.";
hnv[21] = "Then he brought me forth into the outer court, and caused me to pass by the four corners of the court; and, behold, in every corner of the court there was a court.";
vul[21] = "et eduxit me in atrium exterius et circumduxit me per quattuor angulos atrii et ecce atriolum erat in angulo atrii atriola singula per angulos atrii";
kjv[22] = "In the four corners of the court [there were] courts joined of forty [cubits] long and thirty broad: these four corners [were] of one measure.";
rsv[22] = "in the four corners of the court were small courts, forty cubits long and thirty broad; the four were of the same size.";
asv[22] = "In the four corners of the court there were courts inclosed, forty [cubits] long and thirty broad: these four in the corners were of one measure.";
yng[22] = "In the four corners of the court [are] perfume courts, forty long, and thirty broad, one measure [is] to the four corners.";
dby[22] = "In the four corners of the court there were enclosed courts, forty [cubits] long and thirty broad: these four corner courts were of one measure.";
web[22] = "In the four corners of the court [there were] courts joined of forty [cubits] long and thirty broad: these four corners [were] of one measure.";
hnv[22] = "In the four corners of the court there were courts enclosed, forty [cubits] long and thirty broad: these four in the corners were of one measure.";
vul[22] = "in quattuor angulos atrii atriola disposita quadraginta cubitorum per longum et triginta per latum mensurae unius quattuor erant";
kjv[23] = "And [there was] a row [of building] round about in them, round about them four, and [it was] made with boiling places under the rows round about.";
rsv[23] = "On the inside, around each of the four courts was a row of masonry, with hearths made at the bottom of the rows round about.";
asv[23] = "And there was a wall round about in them, round about the four, and boiling-places were made under the walls round about.";
yng[23] = "And a row [is] round about in them, round about to them four, and made with boilers under the rows round about.";
dby[23] = "And there was a row [of building] round about in them, round about those four, and it was made with boiling places under the rows round about.";
web[23] = "And [there was] a row [of building] around in them, around them four, and [it was] made with boiling places under the rows around.";
hnv[23] = "There was a wall round about in them, round about the four, and boiling-places were made under the walls round about.";
vul[23] = "et paries per circuitum ambiens quattuor atriola et culinae fabricatae erant subter porticus per gyrum";
kjv[24] = "Then said he unto me, These [are] the places of them that boil, where the ministers of the house shall boil the sacrifice of the people.";
rsv[24] = "Then he said to me, &quot;These are the kitchens where those who minister at the temple shall boil the sacrifices of the people.&quot;";
asv[24] = "Then said he unto me, These are the boiling-houses, where the ministers of the house shall boil the sacrifice of the people.";
yng[24] = "And he saith unto me, `These [are] the houses of those boiling where the ministrants of the house boil the sacrifice of the people.\'";
dby[24] = "And he said unto me, These are the boiling-houses, where those who do the service of the house shall boil the sacrifice of the people.";
web[24] = "Then said he to me, These [are] the places of them that boil, where the ministers of the house shall boil the sacrifice of the people.";
hnv[24] = "Then said he to me, These are the boiling-houses, where the ministers of the house shall boil the sacrifice of the people.";
vul[24] = "et dixit ad me haec est domus culinarum in qua coquent ministri domus Domini victimas populi";
