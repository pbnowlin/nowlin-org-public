csb[1] = "In the twelfth year, in the twelfth month, on the first day of the month, the word of the LORD came to me:";
csb[2] = "&quot;Son of man, lament for Pharaoh king of Egypt and say to him, \'You compare yourself to a lion of the nations, but you are like a monster in the seas. You thrash about in your rivers, churn up the waters with your feet, and muddy the rivers.";
csb[3] = "&quot; \'This is what the Lord GOD says: I will spread my net over you with an assembly of many peoples, and they will haul you up in my net.";
csb[4] = "&quot;I will abandon you on the land and throw you onto the open field. I will cause all the birds of the sky to settle on you and let the wild creatures of the entire earth eat their fill of you.";
csb[5] = "&quot;I will put your flesh on the mountains and fill the valleys with your carcass.";
csb[6] = "&quot;I will drench the land with the flow of your blood, even to the mountains; the ravines will be filled with your gore.";
csb[7] = "&quot; \'When I snuff you out, I will cover the heavens and darken their stars. I will cover the sun with a cloud, and the moon will not give its light.";
csb[8] = "&quot;I will darken all the shining lights in the heavens over you, and will bring darkness on your land. This is the declaration of the Lord GOD.";
csb[9] = "&quot; \'I will trouble the hearts of many peoples, when I bring about your destruction among the nations, in countries you have not known.";
csb[10] = "&quot;I will cause many peoples to be appalled at you, and their kings will shudder with fear because of you when I brandish my sword in front of them. On the day of your downfall each of them will tremble every moment for his life.";
csb[11] = "&quot; \'For this is what the Lord GOD says: The sword of Babylon\'s king will come against you!";
csb[12] = "&quot;I will make your hordes fall by the swords of warriors, all of them ruthless men from the nations. They will ravage Egypt\'s pride, and all its hordes will be destroyed.";
csb[13] = "&quot;I will slaughter all its cattle that are beside many waters. No human foot will churn them again, and no cattle hooves will disturb them.";
csb[14] = "&quot;Then I will let their waters settle and will make their rivers flow like oil. This is the declaration of the Lord GOD.";
csb[15] = "&quot;When I make the land of Egypt a desolation, so that it is emptied of everything in it, when I strike down all who live there, then they will know that I am the LORD.";
csb[16] = "&quot; \'The daughters of the nations will chant that lament. They will chant it over Egypt and all its hordes. This is the declaration of the Lord GOD.\' &quot;";
csb[17] = "In the twelfth year, on the fifteenth day of the month, the word of the LORD came to me:";
csb[18] = "&quot;Son of man, wail over the hordes of Egypt and bring Egypt and the daughters of mighty nations down to the underworld, to be with those who descend to the Pit:";
csb[19] = "&quot;Who do you surpass in loveliness? Go down and be laid to rest with the uncircumcised!";
csb[20] = "&quot;They will fall among those slain by the sword. A sword is appointed! They drag her and all her hordes away.";
csb[21] = "&quot;Warrior leaders will speak from the middle of Sheol about him and his allies: \'They have come down; the uncircumcised lie slain by the sword.\'";
csb[22] = "&quot;Assyria is there with her whole assembly; her graves are all around her. All of them are slain, fallen by the sword.";
csb[23] = "&quot;Her graves are set in the deepest regions of the Pit, and her assembly is all around her burial place. All of them are slain, fallen by the sword -- those who once spread terror in the land of the living.";
csb[24] = "&quot;Elam is there with all her hordes around her grave. All of them are slain, fallen by the sword -- those who went down to the underworld uncircumcised, who once spread their terror in the land of the living. They bear their disgrace with those who descend to the Pit.";
csb[25] = "&quot;Among the slain they prepare a bed for Elam with all her hordes. Her graves are all around her. All of them are uncircumcised, slain by the sword, although their terror was once spread in the land of the living. They bear their disgrace with those who descend to the Pit. They are placed among the slain.";
csb[26] = "&quot;Meshech and Tubal are there, with all their hordes. Their graves are all around them. All of them are uncircumcised, slain by the sword, although their terror was once spread in the land of the living.";
csb[27] = "&quot;They do not lie down with the fallen warriors of the uncircumcised, who went down to Sheol with their weapons of war, whose swords were placed under their heads and their shields rested on their bones, although the terror of these warriors was once in the land of the living.";
csb[28] = "&quot;But you will be shattered and will lie down among the uncircumcised, with those slain by the sword.";
csb[29] = "&quot;Edom is there, her kings and all her princes, who, despite their strength, have been placed among those slain by the sword. They lie down with the uncircumcised, with those who descend to the Pit.";
csb[30] = "&quot;All the leaders of the north and all the Sidonians are there. They went down in shame with the slain, despite the terror their strength inspired. They lie down uncircumcised with those slain by the sword. They bear their disgrace with those who descend to the Pit.";
csb[31] = "&quot;Pharaoh will see them and be comforted over all his hordes -- Pharaoh and his whole army, slain by the sword.&quot; This is the declaration of the Lord GOD.";
csb[32] = "&quot;For I will spread my terror in the land of the living, so Pharaoh and all his hordes will be laid to rest among the uncircumcised, with those slain by the sword.&quot; This is the declaration of the Lord GOD.";

kjv[2] = "Son of man, take up a lamentation for Pharaoh king of Egypt, and say unto him, Thou art like a young lion of the nations, and thou [art] as a whale in the seas: and thou camest forth with thy rivers, and troubledst the waters with thy feet, and fouledst their rivers.";
rsv[2] = "&quot;Son of man, raise a lamentation over Pharaoh king of Egypt, and say to him: &quot;You consider yourself a lion among the nations, but you are like a dragon in the seas; you burst forth in your rivers, trouble the waters with your feet, and foul their rivers.";
asv[2] = "Son of man, take up a lamentation over Pharaoh king of Egypt, and say unto him, Thou wast likened unto a young lion of the nations: yet art thou as a monster in the seas; and thou didst break forth with thy rivers, and troubledst the waters with thy feet, and fouledst their rivers.";
yng[2] = "`Son of man, lift up a lamentation for Pharaoh king of Egypt, and thou hast said unto him: A young lion of nations thou hast been like, And thou [art] as a dragon in the seas, And thou comest forth with thy flowings, And dost trouble the waters with thy feet, And thou dost foul their flowings.";
dby[2] = "Son of man, take up a lamentation for Pharaoh king of Egypt, and say unto him, Thou wast like a young lion among the nations, and thou wast as a monster in the seas; and thou didst break forth in thy rivers, and troubledst the waters with thy feet, and fouledst their rivers.";
web[2] = "Son of man, take up a lamentation for Pharaoh king of Egypt, and say to him, Thou art like a young lion of the nations, and thou [art] as a whale in the seas: and thou didst come forth with thy rivers, and disturb the waters with thy feet, and render their rivers foul.";
hnv[2] = "Son of man, take up a lamentation over Par`oh king of Mitzrayim, and tell him, You were likened to a young lion of the nations: yet are you as a monster in the seas; and you did break forth with your rivers, and troubled the waters with your feet, and fouled their rivers.";
vul[2] = "fili hominis adsume lamentum super Pharao regem Aegypti et dices ad eum leoni gentium adsimilatus es et draconi qui est in mari et ventilabas cornu in fluminibus tuis et conturbabas aquas pedibus tuis et conculcabas flumina eorum";

hnv[17] = "It happened also in the twelfth year, in the fifteenth [day] of the month, that the word of the LORD came to me, saying,";

kjv[18] = "Son of man, wail for the multitude of Egypt, and cast them down, [even] her, and the daughters of the famous nations, unto the nether parts of the earth, with them that go down into the pit.";
rsv[18] = "&quot;Son of man, wail over the multitude of Egypt, and send them down, her and the daughters of majestic nations, to the nether world, to those who have gone down to the Pit:";
asv[18] = "Son of man, wail for the multitude of Egypt, and cast them down, even her, and the daughters of the famous nations, unto the nether parts of the earth, with them that go down into the pit.";
yng[18] = "`Son of man, Wail for the multitude of Egypt, And cause it to go down, It -- and the daughters of honourable nations, Unto the earth -- the lower parts, With those going down to the pit.";
dby[18] = "Son of man, wail for the multitude of Egypt, and cast them down, her and the daughters of the famous nations, unto the lower parts of the earth, with them that go down into the pit.";
web[18] = "Son of man, wail for the multitude of Egypt, and cast them down, [even] her, and the daughters of the famous nations, to the nether parts of the earth, with them that go down into the pit.";
hnv[18] = "Son of man, wail for the multitude of Mitzrayim, and cast them down, even her, and the daughters of the famous nations, to the lower parts of the eretz, with those who go down into the pit.";
vul[18] = "fili hominis cane lugubre super multitudine Aegypti et detrahe eam ipsam et filias gentium robustarum ad terram ultimam cum his qui descendunt in lacum";
kjv[19] = "Whom dost thou pass in beauty? go down, and be thou laid with the uncircumcised.";
rsv[19] = "\'Whom do you surpass in beauty? Go down, and be laid with the uncircumcised.\'";
asv[19] = "Whom dost thou pass in beauty? go down, and be thou laid with the uncircumcised.";
yng[19] = "Than whom hast thou been more pleasant? Go down, and be laid with the uncircumcised.";
dby[19] = "Whom dost thou surpass in beauty? Go down, and be thou laid with the uncircumcised.";
web[19] = "Whom dost thou pass in beauty? go down, and be thou laid with the uncircumcised.";
hnv[19] = "Whom do you pass in beauty? Go down, and be laid with the uncircumcised.";
vul[19] = "quo pulchrior es descende et dormi cum incircumcisis";
kjv[20] = "They shall fall in the midst of [them that are] slain by the sword: she is delivered to the sword: draw her and all her multitudes.";
rsv[20] = "They shall fall amid those who are slain by the sword, and with her shall lie all her multitudes.";
asv[20] = "They shall fall in the midst of them that are slain by the sword: she is delivered to the sword; draw her away and all her multitudes.";
yng[20] = "In the midst of the pierced of the sword they fall, [To] the sword she hath been given, They drew her out, and all her multitude.";
dby[20] = "They shall fall in the midst of them that are slain by the sword. The sword hath been given: draw her out, and all her multitudes.";
web[20] = "They shall fall in the midst of [them that are] slain by the sword: she is delivered to the sword: draw her and all her multitudes.";
hnv[20] = "They shall fall in the midst of those who are slain by the sword: she is delivered to the sword; draw her away and all her multitudes.";
vul[20] = "in medio interfectorum gladio cadent gladius datus est adtraxerunt eam et omnes populos eius";
kjv[21] = "The strong among the mighty shall speak to him out of the midst of hell with them that help him: they are gone down, they lie uncircumcised, slain by the sword.";
rsv[21] = "The mighty chiefs shall speak of them, with their helpers, out of the midst of Sheol: \'They have come down, they lie still, the uncircumcised, slain by the sword.\'";
asv[21] = "The strong among the mighty shall speak to him out of the midst of Sheol with them that help him: they are gone down, they lie still, even the uncircumcised, slain by the sword.";
yng[21] = "Speak to him do the gods of the mighty out of the midst of sheol, With his helpers -- they have gone down, They have lain with the uncircumcised, The pierced of the sword.";
dby[21] = "The strong among the mighty, with them that helped him, shall speak to him out of the midst of Sheol: they are gone down, they lie still, the uncircumcised, slain by the sword.";
web[21] = "The strong among the mighty shall speak to him out of the midst of the grave with them that help him: they are gone down, they lie uncircumcised, slain by the sword.";
hnv[21] = "The strong among the mighty shall speak to him out of the midst of She\'ol with those who help him: they are gone down, they lie still, even the uncircumcised, slain by the sword.";
vul[21] = "loquentur ei potentissimi robustorum de medio inferni qui cum auxiliatoribus eius descenderunt et dormierunt incircumcisi interfecti gladio";
kjv[22] = "Asshur [is] there and all her company: his graves [are] about him: all of them slain, fallen by the sword:";
rsv[22] = "&quot;Assyria is there, and all her company, their graves round about her, all of them slain, fallen by the sword;";
asv[22] = "Asshur is there and all her company; her graves are round about her; all of them slain, fallen by the sword;";
yng[22] = "There [is] Asshur, and all her assembly, Round about him [are] his graves, All of them [are] wounded, who are falling by sword,";
dby[22] = "There is Asshur and all his assemblage, his graves round about him: all of them slain, fallen by the sword;";
web[22] = "Asshur [is] there and all her company: his graves [are] about him: all of them slain, fallen by the sword:";
hnv[22] = "Ashshur is there and all her company; her graves are round about her; all of them slain, fallen by the sword;";
vul[22] = "ibi Assur et omnis multitudo eius in circuitu illius sepulchra eius omnes interfecti et qui ceciderunt gladio";
kjv[23] = "Whose graves are set in the sides of the pit, and her company is round about her grave: all of them slain, fallen by the sword, which caused terror in the land of the living.";
rsv[23] = "whose graves are set in the uttermost parts of the Pit, and her company is round about her grave; all of them slain, fallen by the sword, who spread terror in the land of the living.";
asv[23] = "whose graves are set in the uttermost parts of the pit, and her company is round about her grave; all of them slain, fallen by the sword, who caused terror in the land of the living.";
yng[23] = "Whose graves are appointed in the sides of the pit, And her assembly is round about her grave, All of them wounded, falling by sword, Because they gave terror in the land of the living.";
dby[23] = "their graves are set in the sides of the pit, and his assemblage is round about his grave; all of them slain, fallen by the sword, -- who caused terror in the land of the living.";
web[23] = "Whose graves are set in the sides of the pit, and her company is around her grave: all of them slain, fallen by the sword, who caused terror in the land of the living.";
hnv[23] = "whose graves are set in the uttermost parts of the pit, and her company is round about her grave; all of them slain, fallen by the sword, who caused terror in the land of the living.";
vul[23] = "quorum data sunt sepulchra in novissimis laci et facta est multitudo eius per gyrum sepulchri eius universi interfecti cadentesque gladio qui dederant quondam formidinem in terra viventium";
kjv[24] = "There [is] Elam and all her multitude round about her grave, all of them slain, fallen by the sword, which are gone down uncircumcised into the nether parts of the earth, which caused their terror in the land of the living; yet have they borne their shame with them that go down to the pit.";
rsv[24] = "&quot;Elam is there, and all her multitude about her grave; all of them slain, fallen by the sword, who went down uncircumcised into the nether world, who spread terror in the land of the living, and they bear their shame with those who go down to the Pit.";
asv[24] = "There is Elam and all her multitude round about her grave; all of them slain, fallen by the sword, who are gone down uncircumcised into the nether parts of the earth, who caused their terror in the land of the living, and have borne their shame with them that go down to the pit.";
yng[24] = "There [is] Elam, and all her multitude, Round about [is] her grave, All of them wounded, who are falling by sword, Who have gone down uncircumcised unto the earth -- the lower parts, Because they gave their terror in the land of the living, And they bear their shame with those going down to the pit.";
dby[24] = "There is Elam and all her multitude round about her grave, all of them slain, fallen by the sword, who are gone down uncircumcised unto the lower parts of the earth, who caused their terror in the land of the living; yet have they borne their confusion with them that go down to the pit.";
web[24] = "There [is] Elam and all her multitude around her grave, all of them slain, fallen by the sword, who are gone down uncircumcised into the nether parts of the earth, who caused their terror in the land of the living; yet have they borne their shame with them that go down to the pit.";
hnv[24] = "There is `Elam and all her multitude round about her grave; all of them slain, fallen by the sword, who are gone down uncircumcised into the lower parts of the eretz, who caused their terror in the land of the living, and have borne their shame with those who go down to the pit.";
vul[24] = "ibi Aelam et omnis multitudo eius per gyrum sepulchri sui omnes hii interfecti ruentesque gladio qui descenderunt incircumcisi ad terram ultimam qui posuerunt terrorem suum in terra viventium et portaverunt ignominiam suam cum his qui descendunt in lacum";
kjv[25] = "They have set her a bed in the midst of the slain with all her multitude: her graves [are] round about him: all of them uncircumcised, slain by the sword: though their terror was caused in the land of the living, yet have they borne their shame with them that go down to the pit: he is put in the midst of [them that be] slain.";
rsv[25] = "They have made her a bed among the slain with all her multitude, their graves round about her, all of them uncircumcised, slain by the sword; for terror of them was spread in the land of the living, and they bear their shame with those who go down to the Pit; they are placed among the slain.";
asv[25] = "They have set her a bed in the midst of the slain with all her multitude; her graves are round about her; all of them uncircumcised, slain by the sword; for their terror was caused in the land of the living, and they have borne their shame with them that go down to the pit: he is put in the midst of them that are slain.";
yng[25] = "In the midst of the wounded they have appointed a bed for her with all her multitude, Round about him [are] her graves, All of them uncircumcised, pierced of the sword, For their terror was given in the land of the living, And they bear their shame with those going down to the pit, In the midst of the pierced he hath been put.";
dby[25] = "They have set him a bed in the midst of the slain, with all his multitude: their graves are round about him, all of them uncircumcised, slain by the sword, though their terror was caused in the land of the living; and they have borne their confusion with them that go down to the pit: he is put in the midst of them that are slain.";
web[25] = "They have set her a bed in the midst of the slain with all her multitude: her graves [are] around him: all of them uncircumcised, slain by the sword: though their terror was caused in the land of the living, yet have they borne their shame with them that go down to the pit: he is put in the midst of [them that are] slain.";
hnv[25] = "They have set her a bed in the midst of the slain with all her multitude; her graves are round about her; all of them uncircumcised, slain by the sword; for their terror was caused in the land of the living, and they have borne their shame with those who go down to the pit: he is put in the midst of those who are slain.";
vul[25] = "in medio interfectorum posuerunt cubile eius in universis populis eius in circuitu eius sepulchrum illius omnes hii incircumcisi interfectique gladio dederant enim terrorem in terra viventium et portaverunt ignominiam suam cum his qui descendunt in lacum in medio interfectorum positi sunt";
kjv[26] = "There [is] Meshech, Tubal, and all her multitude: her graves [are] round about him: all of them uncircumcised, slain by the sword, though they caused their terror in the land of the living.";
rsv[26] = "&quot;Meshech and Tubal are there, and all their multitude, their graves round about them, all of them uncircumcised, slain by the sword; for they spread terror in the land of the living.";
asv[26] = "There is Meshech, Tubal, and all their multitude; their graves are round about them; all of them uncircumcised, slain by the sword; for they caused their terror in the land of the living.";
yng[26] = "There [is] Meshech, Tubal, and all her multitude, Round about him [are] her graves, All of them uncircumcised, pierced of the sword, For they gave their terror in the land of the living,";
dby[26] = "There is Meshech, Tubal, and all their multitude, their graves round about them, all of them uncircumcised, slain by the sword, though they caused their terror in the land of the living.";
web[26] = "There [is] Meshech, Tubal, and all her multitude: her graves [are] around him: all of them uncircumcised, slain by the sword, though they caused their terror in the land of the living.";
hnv[26] = "There is Meshekh, Tuval, and all their multitude; their graves are round about them; all of them uncircumcised, slain by the sword; for they caused their terror in the land of the living.";
vul[26] = "ibi Mosoch et Thubal et omnis multitudo eius in circuitu illius sepulchra eius omnes hii incircumcisi interfectique et cadentes gladio quia dederunt formidinem suam in terra viventium";
kjv[27] = "And they shall not lie with the mighty [that are] fallen of the uncircumcised, which are gone down to hell with their weapons of war: and they have laid their swords under their heads, but their iniquities shall be upon their bones, though [they were] the terror of the mighty in the land of the living.";
rsv[27] = "And they do not lie with the fallen mighty men of old who went down to Sheol with their weapons of war, whose swords were laid under their heads, and whose shields are upon their bones; for the terror of the mighty men was in the land of the living.";
asv[27] = "And they shall not lie with the mighty that are fallen of the uncircumcised, that are gone down to Sheol with their weapons of war, and have laid their swords under their heads, and their iniquities are upon their bones; for [they were] the terror of the mighty in the land of the living.";
yng[27] = "And they lie not with the mighty, Who are falling of the uncircumcised, Who have gone down to sheol with their weapons of war, And they put their swords under their heads, And their iniquities are on their bones, For the terror of the mighty [is] in the land of the living.";
dby[27] = "And they lie not with the mighty, [that are] fallen of the uncircumcised, who are gone down to Sheol with their weapons of war; and whose swords are laid under their heads, and whose iniquities are upon their bones, though they were the terror of the mighty in the land of the living.";
web[27] = "And they shall not lie with the mighty [that are] fallen of the uncircumcised, who are gone down to the grave, with their weapons of war: and they have laid their swords under their heads, but their iniquities shall be upon their bones, though [they were] the terror of the mighty in the land of the living.";
hnv[27] = "They shall not lie with the mighty who are fallen of the uncircumcised, who are gone down to She\'ol with their weapons of war, and have laid their swords under their heads, and their iniquities are on their bones; for [they were] the terror of the mighty in the land of the living.";
vul[27] = "et non dormient cum fortibus cadentibusque et incircumcisis qui descenderunt ad infernum cum armis suis et posuerunt gladios suos sub capitibus suis et fuerunt iniquitates eorum in ossibus eorum quia terror fortium facti sunt in terra viventium";
kjv[28] = "Yea, thou shalt be broken in the midst of the uncircumcised, and shalt lie with [them that are] slain with the sword.";
rsv[28] = "So you shall be broken and lie among the uncircumcised, with those who are slain by the sword.";
asv[28] = "But thou shalt be broken in the midst of the uncircumcised, and shalt lie with them that are slain by the sword.";
yng[28] = "And thou, in the midst of the uncircumcised art broken, And dost lie with the pierced of the sword.";
dby[28] = "Thou also shalt be broken in the midst of the uncircumcised, and shalt lie with them that are slain with the sword.";
web[28] = "Yes, thou shalt be broken in the midst of the uncircumcised, and shalt lie with [them that are] slain with the sword.";
hnv[28] = "But you shall be broken in the midst of the uncircumcised, and shall lie with those who are slain by the sword.";
vul[28] = "et tu ergo in medio incircumcisorum contereris et dormies cum interfectis gladio";
kjv[29] = "There [is] Edom, her kings, and all her princes, which with their might are laid by [them that were] slain by the sword: they shall lie with the uncircumcised, and with them that go down to the pit.";
rsv[29] = "&quot;Edom is there, her kings and all her princes, who for all their might are laid with those who are slain by the sword; they lie with the uncircumcised, with those who go down to the Pit.";
asv[29] = "There is Edom, her kings and all her princes, who in their might are laid with them that are slain by the sword: they shall lie with the uncircumcised, and with them that go down to the pit.";
yng[29] = "There [is] Edom, her kings, and all her princes, Who have been given up in their might, With the pierced of the sword, They with the uncircumcised do lie, And with those going down to the pit.";
dby[29] = "There is Edom, her kings, and all her princes, who in their might are laid with them that are slain by the sword: they lie with the uncircumcised, and with them that go down to the pit.";
web[29] = "There [is] Edom, her kings, and all her princes, who with their might are laid by [them that were] slain by the sword: they shall lie with the uncircumcised, and with them that go down to the pit.";
hnv[29] = "There is Edom, her kings and all her princes, who in their might are laid with those who are slain by the sword: they shall lie with the uncircumcised, and with those who go down to the pit.";
vul[29] = "ibi Idumea et reges eius omnes duces eius qui dati sunt cum exercitu suo cum interfectis gladio et qui cum incircumcisis dormierunt et cum his qui descenderunt in lacum";
kjv[30] = "There [be] the princes of the north, all of them, and all the Zidonians, which are gone down with the slain; with their terror they are ashamed of their might; and they lie uncircumcised with [them that be] slain by the sword, and bear their shame with them that go down to the pit.";
rsv[30] = "&quot;The princes of the north are there, all of them, and all the Sido\'nians, who have gone down in shame with the slain, for all the terror which they caused by their might; they lie uncircumcised with those who are slain by the sword, and bear their shame with those who go down to the Pit.";
asv[30] = "There are the princes of the north, all of them, and all the Sidonians, who are gone down with the slain; in the terror which they caused by their might they are put to shame; and they lie uncircumcised with them that are slain by the sword, and bear their shame with them that go down to the pit.";
yng[30] = "There [are] princes of the north, All of them, and every Zidonian, Who have gone down with the pierced in their terror, Of their might they are ashamed, And they lie uncircumcised with the pierced of the sword, And they bear their shame with those going down to the pit.";
dby[30] = "There are the princes of the north, all of them, and all the Zidonians, that are gone down with the slain -- ashamed of the terror which they caused through their might; and they lie uncircumcised with them that are slain by the sword, and bear their confusion with them that go down to the pit.";
web[30] = "There [are] the princes of the north, all of them, and all the Zidonians, who are gone down with the slain; with their terror they are ashamed of their might; and they lie uncircumcised with [them that are] slain by the sword, and bear their shame with them that go down to the pit.";
hnv[30] = "There are the princes of the north, all of them, and all the Tzidonim, who are gone down with the slain; in the terror which they caused by their might they are put to shame; and they lie uncircumcised with those who are slain by the sword, and bear their shame with those who go down to the pit.";
vul[30] = "ibi principes aquilonis omnes et universi venatores qui deducti sunt cum interfectis paventes et in sua fortitudine confusi qui dormierunt incircumcisi cum interfectis gladio et portaverunt confusionem suam cum his qui descendunt in lacum";
kjv[31] = "Pharaoh shall see them, and shall be comforted over all his multitude, [even] Pharaoh and all his army slain by the sword, saith the Lord GOD.";
rsv[31] = "&quot;When Pharaoh sees them, he will comfort himself for all his multitude, Pharaoh and all his army, slain by the sword, says the Lord GOD.";
asv[31] = "Pharaoh shall see them, and shall be comforted over all his multitude, even Pharaoh and all his army, slain by the sword, saith the Lord Jehovah.";
yng[31] = "Then doth Pharaoh see, And he hath been comforted for all his multitude, The pierced of the sword -- Pharaoh and all his force, An affirmation of the Lord Jehovah.";
dby[31] = "Pharaoh shall see them, and shall be comforted over all his multitude, Pharaoh and all his army slain by the sword, saith the Lord Jehovah.";
web[31] = "Pharaoh shall see them, and shall be comforted over all his multitude, [even] Pharaoh and all his army slain by the sword, saith the Lord GOD.";
hnv[31] = "Par`oh shall see them, and shall be comforted over all his multitude, even Par`oh and all his army, slain by the sword, says the Lord GOD.";
vul[31] = "vidit eos Pharao et consolatus est super universa multitudine sua quae interfecta est gladio Pharao et omnis exercitus eius ait Dominus Deus";
kjv[32] = "For I have caused my terror in the land of the living: and he shall be laid in the midst of the uncircumcised with [them that are] slain with the sword, [even] Pharaoh and all his multitude, saith the Lord GOD.";
rsv[32] = "For he spread terror in the land of the living; therefore he shall be laid among the uncircumcised, with those who are slain by the sword, Pharaoh and all his multitude, says the Lord GOD.&quot;";
asv[32] = "For I have put his terror in the land of the living; and he shall be laid in the midst of the uncircumcised, with them that are slain by the sword, even Pharaoh and all his multitude, saith the Lord Jehovah.";
yng[32] = "For I have given his terror in the land of the living, And he hath been laid down in the midst of the uncircumcised, With the pierced of the sword -- Pharaoh, and all his multitude, An affirmation of the Lord Jehovah!\'";
dby[32] = "For I have caused my terror in the land of the living; and he shall be laid in the midst of the uncircumcised, with them that are slain by the sword, Pharaoh and all his multitude, saith the Lord Jehovah.";
web[32] = "For I have caused my terror in the land of the living: and he shall be laid in the midst of the uncircumcised with [them that are] slain with the sword, [even] Pharaoh and all his multitude, saith the Lord GOD.";
hnv[32] = "For I have put his terror in the land of the living; and he shall be laid in the midst of the uncircumcised, with those who are slain by the sword, even Par`oh and all his multitude, says the Lord GOD.";
vul[32] = "quia dedi terrorem meum in terra viventium et dormivit in medio incircumcisorum cum interfectis gladio Pharao et omnis multitudo eius ait Dominus Deus";
