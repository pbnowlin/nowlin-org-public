csb[1] = "He said to me, &quot;Son of man, stand up on your feet and I will speak with you.&quot;";
csb[2] = "As he spoke to me, the Spirit entered me and set me on my feet, and I listened to the one who was speaking to me.";
csb[3] = "He said to me, &quot;Son of man, I am sending you to the Israelites, to the rebellious pagans who have rebelled against me. The Israelites and their ancestors have transgressed against me to this day.";
csb[4] = "&quot;The descendants are obstinate and hardhearted. I am sending you to them, and you must say to them, \'This is what the Lord GOD says.\'";
csb[5] = "&quot;Whether they listen or refuse to listen -- for they are a rebellious house -- they will know that a prophet has been among them.";
csb[6] = "&quot;But you, son of man, do not be afraid of them and do not be afraid of their words, even though briers and thorns are beside you and you live among scorpions. Don\'t be afraid of their words or discouraged by the look on their faces, for they are a rebellious house.";
csb[7] = "&quot;Speak my words to them whether they listen or refuse to listen, for they are rebellious.";
csb[8] = "&quot;And you, son of man, listen to what I tell you: Do not be rebellious like that rebellious house. Open your mouth and eat what I am giving you.&quot;";
csb[9] = "So I looked and saw a hand reaching out to me, and there was a written scroll in it.";
csb[10] = "When he unrolled it before me, it was written on the front and back; words of lamentation, mourning, and woe were written on it.";
